 gcc_invite.1.t: "Pozvání ze Zálivu" # todo: NEW TRANSLATION
 gcc_invite.1.d: "[FROM.GetName], hovořící jménem Rady pro spolupráci arabských států v Zálivu, nám vystavil formální pozvání ke vstupu do této unie. Členství by spojilo naši ekonomiku a bezpečnost s nejbohatším blokem arabského světa. Rada čeká na naši odpověď." # todo: NEW TRANSLATION
 gcc_invite.1.a: "Přijímáme. Ať Rada žije." # todo: NEW TRANSLATION
 gcc_invite.1.b: "Prozatím musíme odmítnout." # todo: NEW TRANSLATION
 gcc_invite.2.t: "GCC vítá nového člena" # todo: NEW TRANSLATION
 gcc_invite.2.d: "Na ceremonii v Rijádu Rada pro spolupráci arabských států v Zálivu formálně přijala nový členský stát, čímž poprvé rozšířila unii za hranice Zálivu. Dosah i ambice tohoto bloku rostou." # todo: NEW TRANSLATION
 gcc_invite.2.a: "Historický den." # todo: NEW TRANSLATION
 gcc_invite.3.t: "Pozvání odmítnuto" # todo: NEW TRANSLATION
 gcc_invite.3.d: "Naše pozvání bylo odmítnuto. Rozšíření Rady bude muset počkat na ochotnějšího partnera nebo na změnu postoje." # todo: NEW TRANSLATION
 gcc_invite.3.a: "Budiž." # todo: NEW TRANSLATION
