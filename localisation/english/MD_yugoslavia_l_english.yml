 yugoslavia.1.t: "Pozvánka do Jugoslávie" # todo: NEW TRANSLATION
 yugoslavia.1.d: "[FROM.GetName] nás pozval ke vstupu do obnovené jugoslávské federace. Přijetí znamená začlenění, zatímco odmítnutí může obrátit jeho sjednocovací tažení proti nám." # todo: NEW TRANSLATION
 yugoslavia.1.a: "Vstoupit do federace" # todo: NEW TRANSLATION
 yugoslavia.1.b: "Odmítnout sjednocení" # todo: NEW TRANSLATION
 yugoslavia.30.t: "Národ se obrací k Jugoslávii" # todo: NEW TRANSLATION
 yugoslavia.30.d: "Podpora obnovené jugoslávské federace překročila tři čtvrtiny obyvatelstva. Myšlenka, která byla v 90. letech pohřbena, je zde znovu živým politickým projektem." # todo: NEW TRANSLATION
 yugoslavia.30.a: "Sen přetrvává" # todo: NEW TRANSLATION
 yugoslavia_news.20.t: "Zrod obnovy Jugoslávie" # todo: NEW TRANSLATION
 yugoslavia_news.20.d: "Léta války a vlády ultranacionalistů podnítila geopolitickou obnovu na Balkáně téměř deset let po rozpadu Jugoslávie, když jeden z národů v regionu začal usilovat o její znovuzískání. \n\nV [GetYugoDominantName] se objevily průvody a podniky v retro stylu s transparenty hlásajícími „Bratrství a jednota“, což představuje výrazný odklon od etnických střetů 90. let. Ačkoli obnova skutečně naznačuje rozmach sjednoceného Balkánu, není jasné, zda bude hnutí dále růst, nebo zanikne a přetrvá jako labutí píseň ztraceného národa." # todo: NEW TRANSLATION
 yugoslavia_news.20.a: "Region se mění." # todo: NEW TRANSLATION
 formed_yugoslavia: "Sláva Jugoslávie" # todo: NEW TRANSLATION
 formed_yugoslavia_desc: "Obnovená federace převzala odpovědnost za integraci území, institucí a konstitutivních národů bývalých jugoslávských republik." # todo: NEW TRANSLATION
 yugoslavia_restored: "Jugoslávie" # todo: NEW TRANSLATION
 yugo_bloc_dominant: "Vůdce obnovy Jugoslávie" # todo: NEW TRANSLATION
 yugo_bloc_dominant_desc: "V bývalých republikách máme větší vliv než kterýkoli jiný nástupnický stát. Naše hlavní město je přirozeným místem pro jednání o obnovené federaci." # todo: NEW TRANSLATION
 yugo_bloc: "Znovusjednocení Jugoslávie" # todo: NEW TRANSLATION
 yugo_bloc_desc: "Podpora obnovené Jugoslávie musí v každém přeživším nástupnickém státě dosáhnout 75 procent, než bude moci sjednocení pokračovat. Obnovu vede stát s největším vlivem v bývalých republikách: §Y[GetYugoDominantName]§!.\n\n$yugo_nost_overview$" # todo: NEW TRANSLATION
 yugo_bloc_map: "Znovusjednocení Jugoslávie" # todo: NEW TRANSLATION
 yugo_promote_nostalgia: "Podporovat jugonostalgii v [FROM.GetName]" # todo: NEW TRANSLATION
 yugo_promote_nostalgia_desc: "Financovat kulturní výměny, společná média a společné vzpomínkové akce s cílem získat podporu pro obnovenou federaci. Vyžaduje významný vliv v cílovém státě." # todo: NEW TRANSLATION
 yugo_promote_own_nostalgia: "Pěstovat jugonostalgii doma" # todo: NEW TRANSLATION
 yugo_promote_own_nostalgia_desc: "Financovat domácí vzpomínkové akce, školní osnovy a veřejnoprávní média, která vykreslují starou federaci v příznivém světle. Je to pomalejší a nákladnější než podpora nostalgie v zahraničí, ale nevyžaduje oporu v jiném státě." # todo: NEW TRANSLATION
 yugo_form_federation: "Svolat federaci" # todo: NEW TRANSLATION
 yugo_form_federation_desc: "Svolat všechny přeživší nástupnické státy do obnovené jugoslávské federace. Státy, které odmítnou, poskytnou federaci válečný cíl sjednocení. Jednání může svolat pouze dominantní člen, a to až poté, co každý nástupnický stát podpoří znovusjednocení." # todo: NEW TRANSLATION
 news.85.t: "Návrat Jugoslávie" # todo: NEW TRANSLATION # todo: MOVED KEY
 news.85.desc: "Od půlnoci dnešní noci se na mezinárodní scénu připojí nový stát s reformací Jugoslávie. To vytvoří novou moc na Balkáně, která slíbí zajistit Balkán před jakýmkoliv vnějším zasahováním a přijala roli strážce jižní Evropy.\n \n“Žádná z našich republik by nebyla ničím, kdybychom nebyli všichni spolu; ale musíme vytvořit naši vlastní historii - historii sjednocené Jugoslávie, i do budoucna.” \n― Josip Broz Tito" # todo: NEW TRANSLATION # todo: MOVED KEY
 news.85.a: "Zajímavé" # todo: NEW TRANSLATION # todo: MOVED KEY
 yugoslavia_not_restored_tt: "Jugoslávie již §Rnebyla§! obnovena jiným nástupnickým státem" # todo: NEW TRANSLATION
