 TIB_sar_development_modifier: "Rozvoj tibetské ZAO" # todo: NEW TRANSLATION
 TIB_sar_development_modifier_desc: "Sleduje kumulativní ekonomický rozvoj tibetské zvláštní administrativní oblasti a odráží růst poutního turismu, přeshraničního obchodu a příjmů z těžby směřujících do ZAO." # todo: NEW TRANSLATION
