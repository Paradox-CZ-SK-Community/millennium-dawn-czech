 CHI_semiconductor_backwardness_1_desc: "Čínský polovodičový průmysl zůstává strukturálně závislý na zahraničních slévárnách, návrhovém softwaru a výrobním vybavení. Domácí továrny zaostávají za technologickou špičkou o dvě až tři generace, návrhovým firmám chybí vyspělé řetězce nástrojů EDA a žádná domácí firma vyrábějící zařízení nedokáže dodávat pokročilou litografii. Tato mezera brzdí výstavbu domácích čipových továren a výstup sléváren a omezuje civilní elektroniku i dodavatelský řetězec vojenské elektroniky. Pokrok větví Polovodičového průmyslu tuto závislost postupně odbourává." # todo: NEW TRANSLATION
