 CHI_chongqing_municipality: "Chongqing Municipalita" # todo: NEW TRANSLATION
 CHI_collective_leadership_active_desc: "Sedm mužů kolem jednoho stolu. Generální linie je cokoli, co se těchto sedm mužů shodne nazývat generální linií." # todo: NEW TRANSLATION
 CHI_Dandong_Lifeline: "Dandongská tepna" # todo: NEW TRANSLATION
 CHI_Dandong_Lifeline_desc: "Dandong zajišťuje naprostou většinu zahraničního obchodu Severní Koreje a tok probíhá podle našich podmínek. Obnova a rozšíření tohoto kanálu poskytne Pchjongjangu ekonomický kyslík a zároveň upevní naši páku vůči režimu." # todo: NEW TRANSLATION
 CHI_Encourage_Economic_Reforms: "Podporovat ekonomické reformy" # todo: NEW TRANSLATION
 CHI_Encourage_Economic_Reforms_desc: "Skutečnost, že nám blízký partner zůstává nerozvinutou a zaostalou zemí, je pro nás jako dědice Deng Xiaopinga ostudou. [NKO.GetLeader] by měl být přesvědčen k liberalizaci severokorejské ekonomiky." # todo: NEW TRANSLATION
 CHI_End_the_Kim_Dynasty: "Konec Kimovy dynastie" # todo: NEW TRANSLATION
 CHI_End_the_Kim_Dynasty_desc: "Kimové stáli u čela brutální a zpátečnické diktatury, kterou jsme po desetiletí nuceni podporovat. Tento stav nelze tolerovat." # todo: NEW TRANSLATION
 CHI_Enforce_Sanctions_Compliance: "Vymáhat dodržování sankcí" # todo: NEW TRANSLATION
 CHI_Enforce_Sanctions_Compliance_desc: "Skutečným vymáháním mezinárodních sankcí proti Severní Koreji prokážeme své odhodlání k nešíření jaderných zbraní a získáme přízeň Spojených států a Japonska. Pchjongjang bude nespokojen, ale naše postavení v mezinárodním společenství se zlepší." # todo: NEW TRANSLATION
 CHI_Establish_a_Puppet_Government: "Zřídit loutkovou vládu" # todo: NEW TRANSLATION
 CHI_Establish_a_Puppet_Government_desc: "Nyní, když puč uspěl, je nová vojenská vláda nám dlužná a nebude mít na výběr než podřídit se naší autoritě." # todo: NEW TRANSLATION
 CHI_focus_tree: "Strom zaměření Číny" # todo: NEW TRANSLATION
 CHI_Fortress_of_the_East: "Pevnost Východu" # todo: NEW TRANSLATION
 CHI_Fortress_of_the_East_desc: "Proměna Severní Koreje v neproniknutelný nárazníkový stát posílí naši strategickou hloubku. Podporujeme doktrínu úplné vojenské připravenosti, díky níž bude jakýkoli tlak proti Pchjongjangu pro případné útočníky neúnosně nákladný." # todo: NEW TRANSLATION
 CHI_Gain_the_Support_of_the_KPA: "Získat podporu KPA" # todo: NEW TRANSLATION
 CHI_Gain_the_Support_of_the_KPA_desc: "Naše zpravodajství naznačuje, že v řadách důstojnické třídy Korejské lidové armády existují prvky, které znenávidí vládu [NKO.GetLeader]. Měli bychom se obrátit na tyto důstojníky, s nimiž sdílíme cíl." # todo: NEW TRANSLATION
