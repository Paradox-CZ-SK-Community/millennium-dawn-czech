l_english:
 2_per_capita_or_more_tt: "Více než $$§Y2§! tis. HDP na obyvatele (Aktuálně: $$§Y[?ROOT.gdp_per_capita]§! tis.)" # todo: MOVED KEY
 CHI_Asset_Seizure_tt: "§YZabavené aktivum:§! §G+25§! pokladnice, §G+3§! $CHI_bri_global_presence$\nNesplacený dluh se sníží o náklady jednoho projektu" # todo: NEW TRANSLATION
 chi_bri.16.a: "Následky zvládneme" # todo: NEW TRANSLATION
 chi_bri.16.d: "Ministerstvo financí potvrdilo to, co už ukazovaly účty: tento měsíc nemůžeme uhradit splátku závazků v rámci Pásu a stezky. Peking bude informován během několika dnů. Dokud nebudou nedoplatky uhrazeny, náš věřitel má právo jednat a možnosti, které má k dispozici, nejsou všechny mírné." # todo: NEW TRANSLATION
 chi_bri.16.t: "Zmeškaná splátka Pásu a stezky" # todo: NEW TRANSLATION
 chi_bri.17.a: "Podepsat koncesi" # todo: NEW TRANSLATION
 chi_bri.17.b: "Ložiska nejsou na prodej" # todo: NEW TRANSLATION
 chi_bri.17.d: "Do země dorazila čínská delegace s návrhem, který ve skutečnosti není návrhem. Peking chce výměnou za snížení našeho nesplaceného dluhu v rámci Pásu a stezky o náklady jednoho projektu dlouhodobá práva k těžbě a vývozu našich nerostných surovin. Část dluhu by zmizela z účetních knih. Stejně jako z velké části kontrola nad půdou pod našima nohama." # todo: NEW TRANSLATION
 chi_bri.17.t: "Peking požaduje práva na zdroje" # todo: NEW TRANSLATION
 chi_bri.18.a: "Zvážit naše možnosti" # todo: NEW TRANSLATION
 chi_bri.18.d: "[FROM.GetName] naše podmínky pro koncesi na zdroje zcela odmítl. Jejich dluh trvá, jejich nesplácení trvá a naše delegace se vrátila do Pekingu s prázdnýma rukama. Otázkou nyní je, zda čekat, nebo jinými prostředky vymoci to, co nám náleží." # todo: NEW TRANSLATION
 chi_bri.18.t: "[FROM.GetName] odmítá naše podmínky" # todo: NEW TRANSLATION
 chi_bri.19.a: "Zvážit naše možnosti" # todo: NEW TRANSLATION
 chi_bri.19.d: "[FROM.GetName] zmeškal splátku svých závazků v rámci Pásu a stezky. Na poměry této iniciativy nejde o velkou částku, ale precedens je důležitý: každý další dlužník sleduje, jak Peking zareaguje. Můžeme dluh restrukturalizovat, požadovat práva na zdroje, nebo zabavit to, co jsme financovali." # todo: NEW TRANSLATION
 chi_bri.19.t: "[FROM.GetName] nesplácí dluh z Pásu a stezky" # todo: NEW TRANSLATION
 chi_bri.23.a: "Důležitá je výstavba" # todo: NEW TRANSLATION
 chi_bri.23.d: "Naše pokladnice nedokázala pokrýt náš podíl na projektu §Y[GetBRIProjectName]§!, takže Peking poskytl úvěr k vyrovnání rozdílu. Výstavba pokračuje tak jako tak. Dluh je nyní v našich účetních knihách, narůstá o něj úrok, a pokud jej nedokážeme splácet, podmínky dávají Číně značný prostor k jednání." # todo: NEW TRANSLATION
 chi_bri.23.t: "Projekt Pásu a stezky financovaný úvěrem" # todo: NEW TRANSLATION
 CHI_BRI_automation_disable_tt: "Žádosti o Pás a stezku musí být §Yposuzovány jednotlivě§!" # todo: NEW TRANSLATION
 CHI_BRI_automation_enable_tt: "Žádosti o Pás a stezku jsou §Gpřijímány automaticky§!" # todo: NEW TRANSLATION
 CHI_bri_buy_back_concession: "Odkoupit koncesi" # todo: NEW TRANSLATION
 CHI_bri_buy_back_concession_desc: "Zaplatit za ukončení práv k těžbě a vývozu, která byla převedena na čínské firmy. Je to nákladné a Peking tuto ztrátu nepřijme snadno, ale ložiska se vrátí pod národní kontrolu." # todo: NEW TRANSLATION
 CHI_bri_can_host_energy: "Ovládáme stát s průmyslovým komplexem vhodným k zásobování energií" # todo: NEW TRANSLATION
 CHI_bri_can_host_mine: "Ovládáme stát s významnými nerostnými ložisky" # todo: NEW TRANSLATION
 CHI_bri_can_host_pipeline: "Ovládáme stát s významnými ložisky ropy, oceli nebo drahých kovů" # todo: NEW TRANSLATION
 CHI_bri_can_host_port: "Ovládáme pobřežní stát vhodný pro výstavbu přístavu" # todo: NEW TRANSLATION
 CHI_bri_can_host_prestige: "Ovládáme své hlavní město" # todo: NEW TRANSLATION
 CHI_bri_can_host_rail: "Ovládáme stát vhodný pro výstavbu železnice" # todo: NEW TRANSLATION
 CHI_bri_can_host_sez: "Ovládáme pobřežní nebo dobře propojený stát vhodný pro výstavbu zóny" # todo: NEW TRANSLATION
 CHI_bri_can_host_telecom: "Ovládáme stát vhodný pro výstavbu sítě" # todo: NEW TRANSLATION
 CHI_bri_can_request: "Čína přijímá žádosti o projekty Pásu a stezky a má volný projektový slot" # todo: NEW TRANSLATION
 CHI_bri_clear_loan_tt: "Jejich nesplacený dluh v rámci Pásu a stezky je §Godepsán§!" # todo: NEW TRANSLATION
 CHI_bri_reduce_loan_tt: "Jejich nesplacený dluh v rámci Pásu a stezky se sníží o §Gnáklady jednoho projektu§!" # todo: NEW TRANSLATION
 CHI_bri_restructure_loan_tt: "Úroková sazba jejich úvěru klesne na §G2 %§! a splátky se pozastaví na §Yjeden rok§!" # todo: NEW TRANSLATION
 CHI_bri_application_approved_tt: "Výstavba začne po závěrečné kontrole způsobilosti. Příjemce zaplatí §Y40§! ze své pokladnice, nebo obdrží čínský úvěr na pokrytí rozdílu." # todo: NEW TRANSLATION
 CHI_bri_dual_treasury_50_tt: "Vyžaduje nejméně §Y50§! ve fondu BRI i v národní pokladnici" # todo: NEW TRANSLATION
 CHI_bri_has_reclaimable_structure: "Drží projekt Pásu a stezky, který bychom mohli převzít" # todo: NEW TRANSLATION
 CHI_bri_monthly_income_base: "Základní měsíční příspěvek do fondu BRI" # todo: NEW TRANSLATION
 CHI_bri_monthly_income_base_desc: "Podíl státního rozpočtu, který je každý měsíc prostřednictvím zaměření a rozhodnutí vyčleněn do fondu Pásu a stezky, před započtením resortních bonusů." # todo: NEW TRANSLATION
 CHI_bri_monthly_income_total: "Měsíční příspěvek do fondu BRI" # todo: NEW TRANSLATION
 CHI_bri_monthly_income_total_desc: "Celková částka odváděná každý měsíc do fondu Pásu a stezky: základní příspěvek plus případné resortní bonusy." # todo: NEW TRANSLATION
 CHI_bri_refuse_concession_tt: "§Rponecháme si dluh§! a zůstaneme v prodlení" # todo: NEW TRANSLATION
 CHI_bri_returns_multiplier_base: "Násobitel výnosů BRI" # todo: NEW TRANSLATION
 CHI_bri_returns_multiplier_base_desc: "Bonus uplatňovaný na výnos z mezinárodních investic, který Čína zaúčtuje u každého dokončeného projektu Pásu a stezky." # todo: NEW TRANSLATION
 CHI_bri_unlock_tt: "§YPás a stezka:§! §G6§! projektových slotů, §G40§! na projekt, §G+8§! měsíční příspěvek, §G+4§! mezinárodních investic za každý dokončený projekt" # todo: NEW TRANSLATION
 CHI_Write_Off_Debts_tt: "Dluh každého kvalifikovaného partnera v rámci Pásu a stezky bude v plné výši §Godepsán§!" # todo: NEW TRANSLATION
 on_cancel_idea_tt: "§YPo skončení tohoto národního ducha dojde k následujícímu:§!" # todo: NEW TRANSLATION
 CHI_054a_production_line: "Výrobní linka typu 054A" # todo: NEW TRANSLATION
 CHI_054a_production_line_desc: "Každé loďstvo potřebuje spolehlivého tahouna a tím naším je typ 054A. Tato schopná a cenově dostupná fregata, vyráběná v dlouhé nepřerušené sérii od roku 2008, se stává standardním doprovodem námořnictva a také lodí vyslanou do Adenského zálivu, když se Čína téhož roku připojila k protipirátským hlídkám, své první dlouhodobé misi v dalekých vodách." # todo: NEW TRANSLATION
 CHI_45g_national_deployment: "Rozšíření sítě 5G" # todo: NEW TRANSLATION
 CHI_45g_national_deployment_desc: "China Mobile spouští komerční 4G a během tří let máme více základnových stanic než zbytek světa dohromady. MIIT uděluje licence 5G všem třem operátorům a v době, kdy západní operátoři stále diskutují o svých plánech zavádění, provozujeme 4,1 milionu základnových stanic 5G obsluhujících jednu miliardu uživatelů. Zaostávání v infrastruktuře už nedoháníme; obrátili jsme je v náš prospěch." # todo: NEW TRANSLATION
 CHI_863_ic_preparatory_research: "Přípravný výzkum integrovaných obvodů v rámci programu 863" # todo: NEW TRANSLATION
 CHI_863_ic_preparatory_research_desc: "V rámci Státního plánu rozvoje špičkových technologií jsou návrh a výroba integrovaných obvodů označeny za prioritní oblast. Státní prostředky proudí do univerzitních výzkumných center a raných pilotních sléváren v deltě Perlové řeky a Šanghaji, čímž se budují lidské zdroje a dodavatelské řetězce, které později Národní fond integrovaných obvodů rozšíří na průmyslovou výrobu. Zaséváme semena do půdy, které bude trvat deset let, než přinese úrodu." # todo: NEW TRANSLATION
 CHI_863_nev_program: "Program 863: elektromobily a deset měst" # todo: NEW TRANSLATION
 CHI_863_nev_program_desc: "Wan Gang, inženýr, který se stal ministrem a před návratem do Číny strávil devět let u Audi, tvrdil, že můžeme spalovací motory zcela přeskočit. Program Tisíc vozidel v deseti městech nasazuje veřejné flotily elektromobilů v pilotních městech; Šen-čen elektrifikuje celý svůj vozový park autobusů a taxíků. Šanghajská továrna Tesly, postavená za 357 dní od položení základního kamene, se stává katalyzátorem, který nutí každého čínského výrobce elektromobilů soutěžit v kvalitě a rychlosti výroby. Od trhu, který jsme vytvořili, jsme neměli čekat nic menšího." # todo: NEW TRANSLATION
 CHI_a_lighter_touch_on_dissent: "Mírnější přístup k nesouhlasu" # todo: NEW TRANSLATION
 CHI_a_lighter_touch_on_dissent_desc: "Namísto zvyšování vnitřního nátlaku umožňujeme omezený prostor pro projevy občanské společnosti a intelektuální debatu v pečlivě řízených mezích. Tento přístup vyměňuje krátkodobou politickou kontrolu za snížení třenic, které podporují podzemní organizování." # todo: NEW TRANSLATION
 CHI_A_New_Alliance: "Nové spojenectví" # todo: NEW TRANSLATION
 CHI_A_New_Alliance_desc: "Pozoruhodné zlepšení vztahů mezi námi a Indií otevřelo novou a cennou příležitost pro vojenské i politické partnerství. Aliance mezi našimi dvěma národy představuje neuvěřitelnou sílu ve východní a jižní Asii." # todo: NEW TRANSLATION
 CHI_abolish_term_limits: "Zrušení časového omezení mandátu" # todo: NEW TRANSLATION
 CHI_abolish_term_limits_desc: "Všečínské shromáždění lidových zástupců hlasuje 2 958 hlasy pro, 2 proti a 3 se zdrželi hlasování o odstranění dvoumandátového omezení funkce prezidenta státu z ústavy. Hlasování je formálně jednomyslné, až na jméno. Autorita už nepodléhá ústavním hodinám. Toto rozhodnutí odstraňuje nejvýznamnější institucionální omezení osobní moci od reforem po Maovi." # todo: NEW TRANSLATION
 CHI_above_the_neck_reform: "Reforma „nad krkem“" # todo: NEW TRANSLATION
 CHI_above_the_neck_reform_desc: "Starých sedm vojenských oblastí se zodpovídalo pozemní armádě a vedlo vlastní války. V roce 2016 jsme nejprve odřízli „část nad krkem“: Ústřední vojenská komise převzala přímé velení, oblasti nahradilo pět velitelství bojišť a vznikl společný štáb určený k boji jako jeden celek. Nejprve velení, potom síly; hlava před tělem." # todo: NEW TRANSLATION
 CHI_active_defense_doctrine: "Aktivní obrana" # todo: NEW TRANSLATION
 CHI_active_defense_doctrine_desc: "Aktivní obrana je vůdčí strategií armády od Maových dob: strategicky obranná, avšak operačně a takticky útočná. Zdokonalujeme ji pro raketový věk a zastáváme názor, že nejjistějším způsobem obrany vlasti je zasáhnout hrot nepřátelského útoku dříve, než dopadne." # todo: NEW TRANSLATION
 CHI_African_Continental_Integration: "Čínsko-africké století" # todo: NEW TRANSLATION
 CHI_African_Continental_Integration_desc: "Stali jsme se největším samostatným obchodním partnerem Afriky, přičemž bilaterální obchod přesahuje 254 miliard dolarů ročně. Desetiletí investic BRI do přístavů, železnic a zvláštních ekonomických zón učinila naši infrastrukturu a kapitál nepostradatelnými pro agendu kontinentální integrace Africké unie. Nastal čas proměnit tuto ekonomickou váhu v trvalé institucionální partnerství." # todo: NEW TRANSLATION
 CHI_agricultural_tax_abolition: "Zrušení zemědělské daně" # todo: NEW TRANSLATION
 CHI_agricultural_tax_abolition_desc: "Otázka Sannongu -- zemědělství, venkov a zemědělci -- se na čínském venkově stávala výbušnou dlouho předtím, než formální debata dorazila do Pekingu. Pilotní reforma venkovských daní v provincii An-chuej odhalila, jak hluboce břemeno místních odvodů potlačovalo příjmy rolníků a zemědělské investice. Dokument ústředního výboru č. 1 se k venkovské otázce vracel deset let po sobě. Zrušení vyhlášky o zemědělské dani z roku 1958 uvolňuje venkovský kapitál, který po desetiletí čekal na to, až poteče do centrálních plání Che-nanu, rýžového pásu Chu-nanu a sečuánské kotliny." # todo: NEW TRANSLATION
 CHI_Agriculture: "Zemědělství" # todo: NEW TRANSLATION
 CHI_Agriculture_desc: "Zemědělství zůstává důležitým odvětvím v mnoha afrických ekonomikách a právě na něm závisí nejvíce lidí. Měli bychom podpořit zemědělský sektor, aby se jednotliví pracovníci dokázali prosadit v globálním světě kruté mezinárodní soutěže." # todo: NEW TRANSLATION
 CHI_AIIB_Founding: "Asijská banka pro investice do infrastruktury" # todo: NEW TRANSLATION
 CHI_AIIB_Founding_desc: "Asijská banka pro investice do infrastruktury, kterou jsme založili s 57 členskými státy navzdory silnému odporu Washingtonu, poskytuje mnohostranné financování infrastruktury v celé Asii i mimo ni. Její existence dokazuje, že dokážeme budovat důvěryhodné mezinárodní instituce zcela mimo rámec Brettonwoodského systému. Západní monopol na rozvojové financování je prolomen." # todo: NEW TRANSLATION
 CHI_An_Alliance_to_Rival_NATO: "Aliance, která má konkurovat NATO" # todo: NEW TRANSLATION
 CHI_An_Alliance_to_Rival_NATO_desc: "Přichází čas odemknout plný potenciál SCO a posílit instituci organizace pro vojenskou spolupráci do takové míry, aby naše společné velení a řízení bylo stejně efektivní jako u NATO. Pokud přijde válka, budeme připraveni." # todo: NEW TRANSLATION
 CHI_An_Alliance_to_Rival_NATO_tt: "§YÚčinky se zobrazí, jakmile založíme naši frakci§!" # todo: NEW TRANSLATION
 CHI_Annex_Bhutan: "Anexe Bhútánu" # todo: NEW TRANSLATION
 CHI_Annex_Bhutan_desc: "Naše nároky na Bhútán nemusí zasahovat celé území země, ale blízké historické vazby Bhútánu na Tibet by měly poskytnout rozumné odůvodnění pro naši touhu začlenit Bhútán do Tibetské autonomní oblasti. Navíc anexe by odstranila strategicky umístěného indického spojence. Pokud náš vliv v Bhútánu poroste dostatečně, budeme moci zemi anektovat bez války." # todo: NEW TRANSLATION
 CHI_anshan_steel_modernization: "Modernizace ocelárenského komplexu An-šan" # todo: NEW TRANSLATION
 CHI_anshan_steel_modernization_desc: "An-šanská železárenská a ocelárenská skupina, nejstarší a největší integrovaný ocelárenský komplex v Číně, prochází rozsáhlou modernizací. Zastaralé martinské pece jsou nahrazovány kyslíkovou konvertorovou výrobou oceli, což snižuje náklady a zvyšuje kvalitativní strop navazující výroby." # todo: NEW TRANSLATION
 CHI_ant_group_empire: "Finanční impérium Ant Group" # todo: NEW TRANSLATION
 CHI_ant_group_empire_desc: "Ant Group, oddělená od Alibaby, buduje finanční impérium zahrnující Yu'ebao, Zhima Credit, Huabei a MYbank a mezinárodně podporující Paytm, GCash a Dana. Jack Ma na summitu Bund veřejně napadá státní banky a přirovnává je k zastavárnám. O několik dní později CSRC a SAMR pozastavují IPO Ant Group v hodnotě 34 miliard dolarů 48 hodin před uvedením. Vztah technologického sektoru ke státu se změnil a každý technologický ředitel v zemi chápe, co to znamená." # todo: NEW TRANSLATION
 CHI_anti_japanese_boycott_campaign: "Kampaň proti japonskému bojkotu" # todo: NEW TRANSLATION
 CHI_anti_japanese_boycott_campaign_desc: "Lidé jsou rozzlobení. My jsme jejich hněv nevytvořili. Pouze se rozhodujeme nestát mu v cestě, dokud se nerozhodneme jinak." # todo: NEW TRANSLATION
 CHI_Arab_League_Cooperation_Forum: "Fórum spolupráce Číny a arabských států" # todo: NEW TRANSLATION
 CHI_Arab_League_Cooperation_Forum_desc: "Fórum spolupráce Číny a arabských států sdružuje ministry zahraničí všech 22 členů Ligy arabských států ke koordinaci projektů BRI, obchodní politiky a politického sbližování. Díky němu udržujeme stálý institucionální kanál do Blízkého východu, který zcela obchází rámce vedené Západem. Arabské státy získávají díky prokázanému přístupu k našemu kapitálu větší vliv na své tradiční partnery a my získáváme blok, jehož hlasy následují naše vedení." # todo: NEW TRANSLATION
 CHI_arms_for_influence: "Zbraně za vliv" # todo: NEW TRANSLATION
 CHI_arms_for_influence_desc: "Každá vývozní bedna kupuje víc než jen peníze. Zbrojíme klienty, kterých se žádný západní dodavatel nedotkne, a dluh vybíráme v přístavech, hlasech a loajalitě, čímž měníme obchod se zbraněmi v tichý nástroj zahraniční politiky." # todo: NEW TRANSLATION
 CHI_army_aviation_corps: "Armádní letecký sbor" # todo: NEW TRANSLATION
 CHI_army_aviation_corps_desc: "Armáda, která neumí létat, nemůže udeřit rychle. Budujeme armádní letectvo s útočným vrtulníkem Z-10 a transportním Z-20, čímž rychlým brigádám poskytujeme vlastní bitevní vrtulníky a přepravní kapacitu k překonání terénu a vysazení jednotek za nepřítelem." # todo: NEW TRANSLATION
 CHI_army_reorganisation: "Reorganizovat armádu" # todo: NEW TRANSLATION
 CHI_army_reorganisation_desc: "Třináct nových skupin armád je vyváženo a přečíslováno, přičemž každá je postavena na brigádách kombinovaných zbraní namísto těžkopádných divizí. Pozemní síly vycházejí štíhlejší, modulární a konečně vzájemně zaměnitelné, schopné soustředit se nebo rozptýlit podle požadavků boje." # todo: NEW TRANSLATION
 CHI_artillery_modernisation: "Modernizovat dělostřelectvo" # todo: NEW TRANSLATION
 CHI_artillery_modernisation_desc: "Zbraně jsou jen tak dobré jako systém, který je zaměřuje. Protibaterijní radary, digitální řízení palby a přesné granáty mění dělostřelectvo z plošné zbraně v skalpel, který přesně zasahuje již první salvou." # todo: NEW TRANSLATION
 CHI_assuage_japanese_concerns: "Uklidnit japonské obavy" # todo: NEW TRANSLATION
 CHI_assuage_japanese_concerns_desc: "Sledují naši pobřežní stráž. Sledují naše raketové zkoušky. Když tedy veřejně zrušíme cvičení, všimnou si toho." # todo: NEW TRANSLATION
 CHI_astana_speech: "Ekonomický pás Hedvábné stezky" # todo: NEW TRANSLATION
 CHI_astana_speech_desc: "Projev na Nazarbajevově univerzitě v Astaně navrhl „společné budování ekonomického pásu podél Hedvábné stezky“, který nás přes Střední Asii propojí s Evropou. Spolu s Námořní hedvábnou stezkou 21. století, oznámenou následujícího měsíce v Indonésii, se začíná rýsovat iniciativa Pásu a stezky. Financování infrastruktury, koncese na přístavy a železniční kontrakty nyní musí z Pekingu proudit v měřítku, které mění světový řád." # todo: NEW TRANSLATION
 CHI_avic_reunification: "Znovusjednotit AVIC" # todo: NEW TRANSLATION
 CHI_avic_reunification_desc: "Letecký průmysl, rozdělený v roce 1999 na dvě soupeřící poloviny s cílem vynutit konkurenci, se naučil pouze zdvojovat práci a hádat se. V roce 2008 jsou AVIC I a AVIC II znovu spojeny do jediné letecké korporace, pod jednu střechu nad stíhačkami, motory a avionikou, na které letectvo čekalo celá desetiletí." # todo: NEW TRANSLATION
 CHI_Back_Channel_to_Foggy_Bottom: "Tajný kanál do Foggy Bottom" # todo: NEW TRANSLATION
 CHI_Back_Channel_to_Foggy_Bottom_desc: "Čínské a americké diplomatické týmy zřizují diskrétní tajný kanál prostřednictvím zadních místností ambasád a neoficiálních vyjednavačů Track II. Obě strany soukromě uznávají, že korejskou otázku nelze vyřešit bez vzájemného přizpůsobení." # todo: NEW TRANSLATION
 CHI_banking_recapitalisation: "Rekapitalizace bankovního sektoru" # todo: NEW TRANSLATION
 CHI_banking_recapitalisation_desc: "Náš bankovní sektor během úvěrové expanze v 90. letech nashromáždil drtivé množství nesplácených úvěrů. Musíme vložit veřejný kapitál, abychom tyto závazky odstranili z rozvah státních bank, a poté restrukturalizované instituce uvést na hongkongskou burzu. Následovat budou zahraniční menšinoví akcionáři a mezinárodní účetní standardy, které našemu finančnímu systému propůjčí důvěryhodnost, jež mu nyní chybí." # todo: NEW TRANSLATION
 CHI_baosteel_ipo: "IPO Baosteelu" # todo: NEW TRANSLATION
 CHI_baosteel_ipo_desc: "Baoshan Iron and Steel vstupuje na šanghajskou burzu v tehdy největší primární nabídce v naší historii a získává 7,7 miliardy jüanů. Baosteel, založený na technologii licencované od Nippon Steel, pohltil Shanghai Metallurgical Holding a Meishan v rámci politiky Zhu Rongjiho „uchopit velké a uvolnit malé“. Jeho integrace vysoce kvalitního automobilového plechu a elektrotechnického pásu stanovuje měřítko pro modernizující se čínský ocelářský sektor." # todo: NEW TRANSLATION
 CHI_baowu_merger: "Zrození oceli Baowu" # todo: NEW TRANSLATION
 CHI_baowu_merger_desc: "Sloučením Baosteel Group a Wuhan Iron and Steel Corporation vzniká China Baowu Steel Group, která tvoří základ naší strategie budování národních ocelářských šampionů schopných soutěžit v globálním měřítku. Pod vedením předsedy Chen Deronga Baowu následně získává Maanshan Iron and Steel, Taiyuan Iron and Steel, Chongqing Iron and Steel a Xinjiang Bayi Iron and Steel. S roční produkcí přes 115 milionů tun Baowu překonal ArcelorMittal a stal se největším výrobcem oceli na světě." # todo: NEW TRANSLATION
 CHI_bat_platform_rise: "Vzestup BAT" # todo: NEW TRANSLATION
 CHI_bat_platform_rise_desc: "Baidu, Alibaba a Tencent definují náš internet. Baidu ovládá vyhledávání po odchodu Googlu; Alibaba vybudovala největší ekosystém elektronického obchodu na světě; WeChat společnosti Tencent dosahuje 1,3 miliardy uživatelů. Politické prostředí, které drželo západní konkurenty venku, tyto společnosti nevytvořilo, ale poskytlo jim prostor k růstu bez rizika, že je koupí nebo zničí kapitál ze Silicon Valley. Tento prostor byl strategickou volbou a byla to správná volba." # todo: NEW TRANSLATION
 CHI_bayan_obo_ree_group: "Bajan Obo a China Rare Earth Group" # todo: NEW TRANSLATION
 CHI_bayan_obo_ree_group_desc: "Deng Xiaoping poznamenal, že Blízký východ má ropu, zatímco my máme vzácné zeminy. Ložisko Bajan Obo u Pao-tchou ve Vnitřním Mongolsku, provozované China Northern Rare Earth Group, je největším ložiskem lehkých vzácných zemin na světě; doly v Kan-čou v Ťiang-si dodávají těžké vzácné zeminy včetně dysprosia a terbia. MIIT sloučilo šest regionálních producentů do China Rare Earth Group a China Northern Rare Earth Group. Vývozní kvóty, formálně zrušené po rozhodnutí WTO, se vracejí v podobě vývozních licencí a výrobních kvót, které dosahují stejného účinku. Tento vliv musíme využít dříve, než ostatní najdou náhrady." # todo: NEW TRANSLATION
 CHI_Beidou_Latin_Constellation: "Latinská konstelace Beidou" # todo: NEW TRANSLATION
 CHI_Beidou_Latin_Constellation_desc: "Pozemní stanice našeho navigačního systému Beidou v Argentině a Venezuele rozšiřují přesnost konstelace na západní polokouli a snižují regionální závislost na infrastruktuře GPS Spojených států. Zařízení s dvojím využitím podporují civilní zemědělské a geodetické zakázky a zároveň nám poskytují strategická poziční data. Washington považuje tato zařízení za přímou výzvu své dominanci v oblasti zpravodajství ze signálů v Americe — a Washington má pravdu." # todo: NEW TRANSLATION
 CHI_beijing_action_plan_green_olympics: "Akční plán zelených olympijských her" # todo: NEW TRANSLATION
 CHI_beijing_action_plan_green_olympics_desc: "Naše kandidatura na pořádání olympijských her slíbila MOV ekologicky odpovědnou podívanou. Nyní musíme tento slib splnit: rozsáhlé zalesňování, přechod z uhlí na plyn v celé pekingské topné síti, přesun průmyslu mimo hlavní město, přísnější emisní normy pro vozidla a výstavba sportovišť v šesti městech. Svět nás bude sledovat." # todo: NEW TRANSLATION
 CHI_beijing_command_clique: "Pekingská velitelská klika" # todo: NEW TRANSLATION
 CHI_beijing_command_clique_desc: "Provinční kliky se sbíhají v hlavním městě. Síť podplacených generálů se zmocňuje velitelských orgánů přímo v Pekingu, takže bez jejího požehnání a podílu se neobejde žádné povýšení, smlouva ani jmenování." # todo: NEW TRANSLATION
 CHI_Beijing_Communique: "Pekingské mírové komuniké" # todo: NEW TRANSLATION
 CHI_Beijing_Communique_desc: "Postavili jsme se do role prostředníka při historické normalizaci vztahů mezi Saúdskou Arábií a Íránem a pod naším vedením jsme přivedli oba regionální rivaly k obnovení diplomatických styků. Komuniké dokazuje, že dokážeme dosáhnout geopolitických výsledků, kterých Washington nedokáže nebo nechce dosáhnout, a upevňuje naši důvěryhodnost jako alternativního garanta bezpečnosti. Regionální mínění se nyní měřitelně přiklání k našemu diplomatickému vedení a této výhody bychom měli využít." # todo: NEW TRANSLATION
 CHI_beijing_tianjin_hsr: "Vysokorychlostní železnice Peking–Tchien-ťin" # todo: NEW TRANSLATION
 CHI_beijing_tianjin_hsr_desc: "Meziměstská železnice Peking–Tchien-ťin dlouhá 117 kilometrů, která překonává vzdálenost za třicet minut rychlostí 350 km/h, představuje začátek čínské expanze vysokorychlostních železnic. Technologie licencovaná od společností Kawasaki, Siemens, Alstom a Bombardier je osvojována a lokalizována prostřednictvím společností China South Railway a China North Railway, které se později sloučily do CRRC. Po srážce ve Wen-čou je rychlost snížena na 300 km/h a posíleny standardy kvality. Síť nyní přesahuje 40 000 km a my jsme teprve začali stavět." # todo: NEW TRANSLATION
 CHI_below_the_neck_disband: "Rozpustit jednotky pod krkem" # todo: NEW TRANSLATION
 CHI_below_the_neck_disband_desc: "Po přetvoření vrchního velení se nůž obrací k tělu. Od dubna 2017 reformy „pod krkem“ rozpouštějí sbory a přetvářejí je na brigády kombinovaných zbraní, ruší tři sta tisíc míst a přesouvají armádu od masy k manévru. Celé armády mizí ze seznamů, aby to, co zůstane, mohlo skutečně bojovat." # todo: NEW TRANSLATION
 CHI_Belt_and_Road_Initiative: "Iniciativa Pás a stezka" # todo: NEW TRANSLATION
 CHI_Belt_and_Road_Initiative_desc: " Hedvábná stezka kdysi spojovala starou Čínu se vzdálenými zeměmi po celém světě. Moderní éra nabízí ještě větší příležitosti pro globální ekonomickou integraci. Investováním do pevninských i námořních tras po celém světě posílíme ekonomický vliv Číny a současně podpoříme rozvoj našich mnoha partnerů." # todo: NEW TRANSLATION
 CHI_Belt_and_Road_Vision: "Iniciativa Pásu a stezky" # todo: NEW TRANSLATION
 CHI_Belt_and_Road_Vision_desc: "Spusťte Iniciativu Pásu a stezky a investujte stovky miliard do infrastrukturních projektů, které propojí Asii, Afriku a Evropu s Čínou prostřednictvím silnic, železnic, přístavů a digitálních sítí." # todo: NEW TRANSLATION
 CHI_Bide_Your_Time: "Skrývat sílu a vyčkávat" # todo: NEW TRANSLATION
 CHI_Bide_Your_Time_desc: "Řiďte se zásadou Teng Siao-pchinga. Vyhýbejte se konfrontaci, budujte hospodářské vazby a tiše shromažďujte komplexní národní moc. Růst Číny nemusí vyprovokovat vznik koalice proti ní." # todo: NEW TRANSLATION
 CHI_big_four_ipo: "Vlna IPO Velké čtyřky" # todo: NEW TRANSLATION
 CHI_big_four_ipo_desc: "Naše státní banky dokončují bezprecedentní vlnu vstupu na burzu. China Construction Bank získává v Hongkongu 9,2 miliardy amerických dolarů; současné duální uvedení ICBC v Hongkongu a Šanghaji stanovuje světový rekord ve výši 21,9 miliardy; Agricultural Bank of China jej překonává částkou 22,1 miliardy. ICBC je nyní největší bankou světa podle celkových aktiv a Velká čtyřka se připojuje na seznam Rady pro finanční stabilitu mezi globálně systémově významné banky. Central Huijin Investment zůstává v každé z nich dominantním akcionářem." # todo: NEW TRANSLATION
 CHI_big_fund_phase2: "Velký fond – druhá fáze" # todo: NEW TRANSLATION
 CHI_big_fund_phase2_desc: "Druhá fáze Národního fondu integrovaných obvodů získává 200 miliard jüanů, které směřují do zařízení, materiálů a pokročilého pouzdření, aby zaplnily mezery v dodavatelském řetězci odhalené americkými sankcemi. Následuje třetí fáze v objemu přes 300 miliard jüanů, největší jednorázová mobilizace kapitálu v historii polovodičů. Strategie se posunula od rozšiřování kapacit k úplné vertikální integraci: od surového waferu po zapouzdřený SoC bude každý krok řetězce zásobován domácími zdroji nebo domácím vývojem. Nic menšího nám neposkytne potřebnou bezpečnost." # todo: NEW TRANSLATION
 CHI_big_fund_phase_1: "Investiční fond polovodičového průmyslu" # todo: NEW TRANSLATION
 CHI_big_fund_phase_1_desc: "Státní rada vydala dokument č. 18, který označuje polovodiče za strategické odvětví. Národní investiční fond integrovaného obvodu — Velký fond — získává v prvním kole 138,7 miliardy jüanů a ukotvuje státem vedenou mobilizaci kapitálu napříč výrobou, návrhem a zařízením. Směřujeme prostředky do společností SMIC, Huawei HiSilicon a konstelace provinčních spoluinvestičních nástrojů. Už si nemůžeme dovolit technologickou závislost na TSMC a ASML a tento fond je naším prohlášením záměru." # todo: NEW TRANSLATION
 CHI_blue_granary_aquaculture: "Modrá sýpka" # todo: NEW TRANSLATION
 CHI_blue_granary_aquaculture_desc: "Naše odvětví akvakultury produkuje 52 milionů tun ročně, přibližně 60 procent světové produkce a 80 procent našeho vlastního vodního úlovku. V deltě Perlové řeky v Kuang-tungu se nachází nejhustší síť tilápiových rybníků na světě; pobřeží Ning-po a Čou-šanu v Če-ťiangu dominuje produkci krevet a krabů. Experimentální hlubokomořské klece pro chov lososů ve Žlutém moři mění pobřežní zemědělské oblasti v centra vývozu bílkovin, ačkoli nadměrné používání antibiotik a eutrofizace jezera Tchaj-chu zůstávají nevyřešenými environmentálními náklady, které nemůžeme donekonečna ignorovat." # todo: NEW TRANSLATION
 CHI_bow_to_china_dream: "Poklonit se Čínskému snu" # todo: NEW TRANSLATION
 CHI_bow_to_china_dream_desc: "Když propukne protikorupční bouře, aliance se ohne, ale nezlomí. Klika hlasitě přísahá věrnost Čínskému snu Si Ťin-pchinga, obětuje několik bezvýznamných lidí a kupuje si přežití výměnou otevřeného drancování za tišší privilegia." # todo: NEW TRANSLATION
 CHI_break_the_first_island_chain: "Prolomit první ostrovní řetězec" # todo: NEW TRANSLATION
 CHI_break_the_first_island_chain_desc: "Řetězec se táhne od Kjúšú přes Rjúkjú až k Tchaj-wanu. Čtyřicet let držel naše námořnictvo v pobřežních vodách. Řetězec se zlomí tam, kde nejslabší článek ustoupí. Tento článek ustoupí." # todo: NEW TRANSLATION
 CHI_BRI_Forum_Beijing: "Fórum Pásu a stezky pro spolupráci" # todo: NEW TRANSLATION
 CHI_BRI_Forum_Beijing_desc: "Fórum Pásu a stezky pro mezinárodní spolupráci, pořádané v Pekingu a rostoucí s každým opakováním, sdružuje hlavy států a vysoké představitele z více než 100 zemí za účelem koordinace projektových plánů, podpisu rámcových dohod a prosazování našeho vedení globální rozvojové agendy. Žádný jiný národ nedokáže u svého stolu shromáždit takové množství účastníků." # todo: NEW TRANSLATION
 CHI_Bring_the_Tiger_to_Heel: "Chyťte tygra do klece" # todo: NEW TRANSLATION
 CHI_Bring_the_Tiger_to_Heel_desc: "Náš vzestup regionální dominance nebude možný, pokud bude nepřátelská Indie hrozit útokem na naše jižní křídlo a podporovat naše nepřátele. Bengálský tygr musí být nutně uvězněn, aby zajistil naši nadvládu v prostoru, který je pro dvě regionální supervelmoci příliš malý." # todo: NEW TRANSLATION
 CHI_byd_catl_integration: "Budujte své sny" # todo: NEW TRANSLATION
 CHI_byd_catl_integration_desc: "Společnost BYD Wang Čchuan-fua, založená v Šen-čenu jako výrobce baterií, ukončila výrobu vozidel s čistě spalovacími motory a její technologie článků LFP Blade Battery cell-to-pack stanovuje nové standardy bezpečnosti a nákladů. CATL se sídlem v Ning-te využila vládní seznam schválených baterií, aby dostatečně dlouho vytlačila Panasonic, LG a Samsung SDI a vybudovala si neotřesitelné postavení. Tyto dvě společnosti nyní ovládají více než 60 procent světové produkce baterií pro elektromobily. Tento průmysl jsme vybudovali z ničeho a patří nám." # todo: NEW TRANSLATION
 CHI_cadre_evaluation_reform: "Reforma hodnocení kádrů" # todo: NEW TRANSLATION
 CHI_cadre_evaluation_reform_desc: "Náš systém hodnocení kádrů příliš dlouho odměňoval provinční představitele, kteří zajišťovali růst HDP, zatímco ničili životní prostředí a zanedbávali veřejné služby. Musíme zavést povinné váhy pro ochranu životního prostředí, společenskou harmonii a energetickou náročnost vedle hospodářského výkonu. Představitel, který dosáhne růstu ničením podmínek, jež jej umožňují, si nezaslouží povýšení." # todo: NEW TRANSLATION
 CHI_cadre_rotation: "Systém rotace kádrů" # todo: NEW TRANSLATION
 CHI_cadre_rotation_desc: "Lokální zajetí je hnilobou v srdci čínské správy. Představitelé, kteří zůstávají příliš dlouho na stejném místě, si vytvářejí vazby na místní obchodní zájmy, které narušují jejich úsudek. Systematický rotační program čerpá ze zkušeností Čchung-čchingu a pravidelně přesouvá kádry mezi funkcemi, čímž rozbíjí sítě protekce dříve, než stačí zpevnět." # todo: NEW TRANSLATION
 CHI_caojing_seven_chem_bases: "Šanghajské petrochemické základny Caojing" # todo: NEW TRANSLATION
 CHI_caojing_seven_chem_bases_desc: "Státní rada určuje sedm národních petrochemických základen: šanghajský chemický průmyslový park v Caojingu, následovaný základnami v Nankingu, Ningbo Daxie, Daya Bay, Quanzhou, Dalianu a Caofeidianu. Každá základna získává centralizované dodávky páry, společné čištění odpadních vod, vyhrazená přístavní zařízení a integrované etylenové krakovací jednotky, čímž kopíruje model Verbund, který společnost BASF zavedla v Ludwigshafenu. BASF, Bayer, ExxonMobil, Shell a Saudi Aramco získávají přístup prostřednictvím společných podniků nebo stoprocentně vlastněných dceřiných společností. Komplex BASF v Čan-ťiangu, v hodnotě 10 miliard eur, se stává největší jednorázovou investicí BASF na světě – měřítko toho, co může náš trh nabídnout zahraničnímu kapitálu, když se rozhodneme jej přilákat." # todo: NEW TRANSLATION
 CHI_Central_Asia_Connectivity: "Ekonomický pás Hedvábné stezky" # todo: NEW TRANSLATION
 CHI_Central_Asia_Connectivity_desc: "Ekonomický pás Hedvábné stezky vede po souši přes Střední Asii a jeho hlavní oporou je suchý přístav Khorgos Gateway na kazašské hranici, železniční a silniční překladiště spojující čínský železniční rozchod s ruskou širokorozchodnou sítí. Objem přepravy podél koridoru roste, protože tranzitní časy jsou u časově citlivého nákladu kratší než námořní přeprava. Měli bychom investice do tohoto koridoru urychlit dříve, než jeho strategickou hodnotu rozpoznají konkurenční mocnosti." # todo: NEW TRANSLATION
 CHI_central_china_development: "Vzestup střední Číny" # todo: NEW TRANSLATION
 CHI_central_china_development_desc: "Centrální provincie Che-nan, Chu-pej a Chu-nan byly pobřežním boomem opomenuty. Koordinovaná rozvojová iniciativa směřuje do regionu fiskální transfery, investice do infrastruktury a přesouvanou výrobu, čímž zapojuje demografické a zemědělské srdce Číny do příběhu růstu." # todo: NEW TRANSLATION
 CHI_central_manufacturing_belt: "Centrální výrobní pás" # todo: NEW TRANSLATION
 CHI_central_manufacturing_belt_desc: "Růst mezd na pobřeží po roce 2008 tlačí výrobce na západ do provincií An-chuej, Ťiang-si a Chu-nan. Státní pobídky k přesunu továren spolu s nižšími náklady na půdu a práci promění tyto tři provincie během deseti let v průmyslovou páteř střední úrovně, která převezme výrobní řetězce z delt Perlové a Jang-c’-ťiang v textilním, elektronickém a automobilovém průmyslu." # todo: NEW TRANSLATION
 CHI_central_military_civil_fusion: "Vojensko-civilní fúze" # todo: NEW TRANSLATION
 CHI_central_military_civil_fusion_desc: "Zeď mezi válečnou a civilní ekonomikou je nařízením stržena. V rámci strategie vojensko-civilní fúze Si Ťin-pchinga, povýšené v roce 2017 na národní prioritu, je každý pokrok v komerční elektronice, výpočetní technice a letectví využit armádou a každý obranný průlom se vrací zpět do průmyslu. Výzkum celého národa se stává laboratoří Generálního štábu." # todo: NEW TRANSLATION
 CHI_central_urbanization_drive: "Urbanizační tažení ve střední Číně" # todo: NEW TRANSLATION
 CHI_central_urbanization_drive_desc: "Odhadem sto milionů venkovských migrantů z centrálních provincií se stěhuje do hlavních měst provincií a okresních měst. Měli bychom tento přechod urychlit dotacemi na bydlení, rozšířením městských služeb a cíleným uvolněním pravidel hukou. Centrální vnitrozemí musí být proměněno ze zásobárny pracovní síly v spotřebitelský trh, dokud je demografické okno stále otevřené." # todo: NEW TRANSLATION
 CHI_Challenge_Dollar_Hegemony: "Výzva dolarové hegemonii" # todo: NEW TRANSLATION
 CHI_Challenge_Dollar_Hegemony_desc: "Prosazujme jüan jako alternativní rezervní měnu a uzavírejme dvoustranné dohody o měnových swapech, čímž oslabíme sevření dolaru nad světovými financemi." # todo: NEW TRANSLATION
 CHI_change_lunar_exploration: "Lunární program Čchang-e" # todo: NEW TRANSLATION
 CHI_change_lunar_exploration_desc: "Robotický lunární program Čchang-e začal v roce 2007 orbitální sondou a pokračoval měkkými přistáními, vozítky Jü-tchu a historickou misí Čchang-e 4 v lednu 2019, která poprvé v dějinách umístila přistávací modul a vozítko na odvrácené straně Měsíce. Data získaná těmito misemi změnila naše chápání geologie Měsíce a položila vědecké základy pro následující pilotované mise." # todo: NEW TRANSLATION
 CHI_China_Africa_Development_Fund: "Fond rozvoje Číny a Afriky" # todo: NEW TRANSLATION
 CHI_China_Africa_Development_Fund_desc: "Díky fondu rozvoje Číny a Afriky můžeme poskytovat potřebné investice do infrastrukturních projektů na africkém kontinentu." # todo: NEW TRANSLATION
 CHI_china_among_the_starts: "Čína mezi hvězdami" # todo: NEW TRANSLATION
 CHI_china_among_the_starts_desc: "Náš program Šen-čou nás zařadil mezi několik málo národů schopných samostatných pilotovaných kosmických letů. Následující mise zavedly orbitální dokování, mimopláštní operace a základy trvalé vesmírné stanice. Nyní musíme na těchto úspěších stavět, abychom si zajistili postavení významné vesmírné mocnosti na úrovni Američanů a Rusů." # todo: NEW TRANSLATION
 CHI_Chinese_Diplomacy: "Čínská diplomacie" # todo: NEW TRANSLATION
 CHI_Chinese_Diplomacy_desc: "Říše středu historicky hrála ústřední roli ve východoasijských záležitostech. Nyní, když jsme se zotavili ze Století ponížení, nastal čas vytvořit komplexní diplomatickou strategii zahrnující regionální sousedy i globální instituce." # todo: NEW TRANSLATION
 CHI_Chinese_Dominance: "Čínská dominance" # todo: NEW TRANSLATION
 CHI_Chinese_Dominance_desc: "Ačkoli je naše postavení a postavení Ruska v rámci SCO momentálně rovné, nepříjemnou pravdou je, že naše moc dalece předčí moc našich bývalých spojenců. Náš vliv v organizaci by měl odpovídat naší skutečné světové významnosti, a proto by měl být Rusko nuceno přijmout nižší postavení." # todo: NEW TRANSLATION
 CHI_chongqing_model_nationalisation: "Čchungčchingský model" # todo: NEW TRANSLATION
 CHI_chongqing_model_nationalisation_desc: "Čchung-čching pod vedením Po Si-laje ukázal, že statistická alternativa k tržnímu liberalismu zůstává v rámci Čínské lidové republiky životaschopná. Renacionalizací strategických aktiv a směrováním úvěrů ke státním podnikům dosáhlo město růstu HDP výrazně převyšujícího celostátní průměr. Tento model rozšíříme po celé zemi." # todo: NEW TRANSLATION
 CHI_cic_forex_reserves: "China Investment Corporation" # todo: NEW TRANSLATION
 CHI_cic_forex_reserves_desc: "Nahromadili jsme více než 1,4 bilionu amerických dolarů v devizových rezervách uložených v nízkoúročených amerických státních dluhopisech, které slouží spíše potřebám amerického financování než našim vlastním. China Investment Corporation, kapitalizovaná částkou 200 miliard amerických dolarů, diverzifikuje toto státní bohatství do globálního soukromého kapitálu, infrastruktury a strategických aktiv. Po počátečních ztrátách v Blackstone a Morgan Stanley během finanční krize se CIC stává disciplinovaným investorem spravujícím více než 1,3 bilionu amerických dolarů, jedním z největších státních investičních fondů na světě." # todo: NEW TRANSLATION
 CHI_Civilian_Technology_Sharing: "Civilian Technology Sharing" # todo: NEW TRANSLATION
 CHI_Civilian_Technology_Sharing_desc: "Naše organizace se primárně zaměřuje na rozvoj ekonomik svých chudších členů a jako taková by se měla soustředit pouze na sdílení nevojenských technologií." # todo: NEW TRANSLATION
 CHI_cj10_cj20_cruise_missile_family: "CJ-10 a CJ-20" # todo: NEW TRANSLATION
 CHI_cj10_cj20_cruise_missile_family_desc: "Letounům dávají údernou sílu střely s plochou dráhou letu dlouhého dosahu. Pozemní CJ-10 a vzduchem odpalovaná CJ-20 umožňují jedinému H-6 zasáhnout pevné cíle vzdálené patnáct set kilometrů a znásobit dosah celých sil bez vystavení posádky riziku nad cílem." # todo: NEW TRANSLATION
 CHI_cloud_computing_triumvirate: "Triumvirát cloud computingu" # todo: NEW TRANSLATION
 CHI_cloud_computing_triumvirate_desc: "Alibaba Cloud drží 39 procent našeho trhu s veřejnými cloudy; Tencent Cloud je základem herních a fintechových backendů; Huawei Cloud po sankcích z roku 2019 prudce roste jako domácí alternativa k americkým službám. Zahraniční poskytovatelé jsou podle zákona o kybernetické bezpečnosti omezeni na společné podniky. Vybudovali jsme domácí cloudovou infrastrukturu dostatečně rozsáhlou, aby udržela digitální ekonomiku bez zahraniční závislosti, a nebyla to náhoda." # todo: NEW TRANSLATION
 CHI_coastal_acceleration_doctrine: "Doktrína pobřežní akcelerace" # todo: NEW TRANSLATION
 CHI_coastal_acceleration_doctrine_desc: "Naše pobřežní provincie jsou místem nejrychlejšího růstu a nejzřetelnějších výnosů liberalizace. Měli bychom soustředit přednostní politiky v deltách Perlové řeky a Jang-c’-ťiang: znásobit exportní zpracovatelské zóny, uvolnit kvóty využití půdy pro průmyslové parky a povolit pobřežním vládám vydávat infrastrukturní dluhopisy před vnitrozemím. Vnitrozemí bude následovat, až pobřeží prokáže životaschopnost modelu." # todo: NEW TRANSLATION
 CHI_coastal_sez_2nd_generation: "Speciální ekonomické zóny druhé generace" # todo: NEW TRANSLATION
 CHI_coastal_sez_2nd_generation_desc: "První generace SEZ v Šen-čenu a Pchu-tungu prokázala životaschopnost modelu. Druhá vlna zón je vyhlášena v Šanghaji a Kuang-tungu, s modernizovanými právními rámci, lepší logistikou a silnější ochranou duševního vlastnictví, aby přilákala zahraniční kapitál s vyšší přidanou hodnotou." # todo: NEW TRANSLATION
 CHI_combat_engineer_modernisation: "Modernizace ženistů" # todo: NEW TRANSLATION
 CHI_combat_engineer_modernisation_desc: "O tom, zda se brigáda pohne, nebo ustrne, rozhodují mosty, průlomy a opevnění. Ženijní sbor je znovu vybaven moderními vozidly pro překonávání vodních toků, odminování a zemní práce, aby terén už nikdy nezastavil postup." # todo: NEW TRANSLATION
 CHI_commercial_launch_sector: "Komerční sektor kosmických startů" # todo: NEW TRANSLATION
 CHI_commercial_launch_sector_desc: "Od roku 2015 se nová generace čínských komerčních kosmických společností přesunula z plánů na startovací rampy. LandSpace v roce 2023 vyslal Ču-čchüe-2, první metanem poháněnou raketu, která dosáhla oběžné dráhy; Galactic Energy a iSpace uskutečnily několik úspěšných startů malých družic. Státní podpora tohoto ekosystému rozšiřuje naši průmyslovou základnu, snižuje náklady na starty a přivádí soukromý kapitál do kosmické ekonomiky." # todo: NEW TRANSLATION
 CHI_common_prosperity: "Společná prosperita" # todo: NEW TRANSLATION
 CHI_common_prosperity_desc: "Společná prosperita je nyní naší vládní prioritou. Růst musí být přesměrován ke zmenšování příjmové propasti, rozšiřování sociálních služeb a omezení excesů soukromého sektoru. Doučovací společnosti, technologické platformy a zábavní průmysl musí přijmout nové hranice. Deklarovaným cílem je široce sdílený rozvoj; praktickým účinkem je znovuobnovení naší autority nad odvětvími, která vyrostla mimo náš dosah – a obojí je pravda zároveň." # todo: NEW TRANSLATION
 CHI_common_prosperity_original: "Společná prosperita" # todo: NEW TRANSLATION
 CHI_common_prosperity_original_desc: "Cílem rozvoje není donekonečna zvětšovat koláč a přitom nechat chudé zápasit o drobky. Společná prosperita znamená spravedlivě rozdělovat koláč, zatímco jej zvětšujeme – přerozdělovat příjmy, rozšiřovat sociální služby a zajistit, aby plody industrializace dosáhly k dělníkovi, který továrnu postavil, stejně jako k úředníkovi, který ji naplánoval." # todo: NEW TRANSLATION
 CHI_Community_of_Shared_Future: "Společenství sdílené budoucnosti" # todo: NEW TRANSLATION
 CHI_Community_of_Shared_Future_desc: "Prosazujme koncept společenství sdílené budoucnosti lidstva a podporujme multilateralismus a spolupráci výhodnou pro všechny jako alternativy k institucím vedeným Západem." # todo: NEW TRANSLATION
 CHI_Comprehensive_Agreement_Investment: "Investiční dohoda mezi EU a Čínou" # todo: NEW TRANSLATION
 CHI_Comprehensive_Agreement_Investment_desc: "Komplexní investiční dohoda, uzavřená po sedmi letech vyjednávání, by našim firmám poskytla lepší přístup na evropské trhy služeb výměnou za závazky k transparentnosti státní podpory. Evropský parlament po vzájemných sankcích pozastavil ratifikaci, ale ekonomická logika dohody přetrvává. Ratifikovaná dohoda by výrazně snížila překážky pro čínský kapitál na jednotném trhu celého bloku a měli bychom tlačit na Brusel, aby ji oživil." # todo: NEW TRANSLATION
 CHI_construction_soe_champions: "Státní stavební šampioni" # todo: NEW TRANSLATION
 CHI_construction_soe_champions_desc: "China State Construction Engineering Corporation, China Railway Construction Corporation, China Communications Construction Company a Power Construction Corporation společně obsazují sedm z deseti nejvyšších příček světového žebříčku dodavatelů. Desetiletí domácích megaprojektů nám poskytla vyškolenou pracovní sílu čítající více než dva miliony lidí, jednotkové náklady o dvacet až třicet procent nižší než u západních konkurentů a nákupní sítě, které získávají materiály rychleji než jakýkoli soukromý konkurent. Tyto strukturální výhody musíme chránit, protože se přímo promítají do nižších nákladů a kratších stavebních lhůt u každé kategorie investiční výstavby, kterou realizujeme doma nebo prodáváme v zahraničí." # todo: NEW TRANSLATION
 CHI_Cooperate_on_Counterterrorism: "Spolupráce na cvičeních proti terorismu" # todo: NEW TRANSLATION
 CHI_Cooperate_on_Counterterrorism_desc: "Terorismus sužuje obě naše země. Společně můžeme posílit schopnost předcházet a reagovat na teroristické hrozby." # todo: NEW TRANSLATION
 CHI_cosco_global_network: "Globální námořní síť COSCO" # todo: NEW TRANSLATION
 CHI_cosco_global_network_desc: "Sloučení společností COSCO a China Shipping vytvořilo jednoho z největších kontejnerových přepravců na světě a následná akvizice Orient Overseas International náš dosah ještě rozšířila. COSCO Shipping Ports nyní provozuje terminály v Pireu, Zeebrugge, Valencii, Singapuru, Abú Zabí a Chancaji. Námořní Hedvábná stezka 21. století propojuje tyto uzly do státem podporované sítě napříč pěti kontinenty. Už nikdy bychom neměli být závislí na zahraničních přepravcích při přepravě našeho zboží." # todo: NEW TRANSLATION
 CHI_Counter_Terrorism_Cooperation: "Protiteroristická spolupráce" # todo: NEW TRANSLATION
 CHI_Counter_Terrorism_Cooperation_desc: "Terorismus, separatismus a extremismus ohrožují regionální stabilitu. Zřízením společných protiteroristických mechanismů v rámci ŠOS můžeme koordinovat sdílení zpravodajských informací a bezpečnostní operace mezi členskými státy." # todo: NEW TRANSLATION
 CHI_Crack_Down_on_the_Three_Evils: "Přísně potlačit Tři zla" # todo: NEW TRANSLATION
 CHI_Crack_Down_on_the_Three_Evils_desc: "Tři zla — terorismus, separatismus a náboženský extremismus — jsou zdrojem obav pro všechny členy SCO. Prostřednictvím SCO můžeme posílit politickou kapacitu navzájem potlačovat tyto nebezpečné hrozby." # todo: NEW TRANSLATION
 CHI_crewed_lunar_landing: "Pilotované přistání na Měsíci" # todo: NEW TRANSLATION
 CHI_crewed_lunar_landing_desc: "Čínský program pilotovaného přistání na Měsíci cílí na oblast jižního pólu a první přistání plánuje přibližně na rok 2030. Profil mise spojuje těžkou nosnou raketu Dlouhý pochod 10 s pilotovanou lodí Meng-čou a přistávacím modulem Lan-jüe, které odstartují odděleně z kosmodromu Wen-čchang a setkají se na oběžné dráze Měsíce. Úspěch by z Číny učinil druhý národ, který dopraví lidi na Měsíc." # todo: NEW TRANSLATION
 CHI_cross_strait_military_posture: "Vojenské držení sil v Tchajwanském průlivu" # todo: NEW TRANSLATION
 CHI_cross_strait_military_posture_desc: "Síly podporující nezávislost upevnily politickou moc v Tchaj-peji a nemůžeme připustit, aby tento posun zůstal bez odpovědi. Lidová osvobozenecká armáda musí zintenzivnit své působení v Tchajwanském průlivu: obojživelná cvičení musí být častější a rozsáhlejší a letecké lety do identifikační zóny protivzdušné obrany ostrova se musí stát běžnou praxí. Znovusjednocení není pouze politickou preferencí. Je to základní národní cíl a síla, která za ním stojí, musí být nezaměnitelná." # todo: NEW TRANSLATION
 CHI_crossborder_ecommerce: "Přeshraniční elektronický obchod" # todo: NEW TRANSLATION
 CHI_crossborder_ecommerce_desc: "Naši výrobci nyní prodávají přímo globálním spotřebitelům a obcházejí tradiční distribuční řetězce, které dříve ovládaly zahraniční značky. Mimořádně rychlé výrobní cykly společnosti SHEIN vycházejí z továren v kantonském Panyu; Temu se během roku od svého spuštění stává nejstahovanější aplikací v USA. Přeshraniční vývoz dosahuje 400 miliard amerických dolarů; západní vlády reagují omezením bezcelního limitu de minimis. Celní zdi, které znovu stavějí, nám ukazují, jak účinnými se naši vývozci stali." # todo: NEW TRANSLATION
 CHI_davos_boycott: "Bojkot Davosu" # todo: NEW TRANSLATION
 CHI_davos_boycott_desc: "Světové ekonomické fórum představuje ideologii bezstátního kapitálu – řád, který podřizuje suverénní rozvoj preferencím nadnárodních financí. Už nebudeme vysílat své nejvyšší představitele, aby klečeli před bankéři ve švýcarských horských letoviscích. Naší cestou je soběstačnost a státem řízený růst, nikoli Washingtonský konsenzus převlečený do alpského sněhu." # todo: NEW TRANSLATION
 CHI_Debt_Trap_Diplomacy: "Dluhová past diplomacie" # todo: NEW TRANSLATION
 CHI_Debt_Trap_Diplomacy_desc: "Poskytujme půjčky za podmínek, které maximalizují čínský vliv nad dlužnickými státy. Když nebudou schopny splácet, vymáhejme strategické ústupky v podobě přístupu do přístavů, práv na těžbu surovin a politického přiklonění." # todo: NEW TRANSLATION
 CHI_defence_industry_consolidation: "Konsolidace obranného průmyslu" # todo: NEW TRANSLATION
 CHI_defence_industry_consolidation_desc: "AVIC, CSIC, NORINCO a další velké konglomeráty naší obranně-průmyslové základny jsou jednotlivě mocné, ale jako celek plýtvají zdroji. Měli bychom je podřídit přísnějšímu dohledu SASAC, odstranit duplicity, směřovat výzkumné investice do prioritních programů a zavést výkonnostní smlouvy pro vedení podniků. Vyhrazená výrobní zařízení v S’-čchuanu a Kuang-tungu musí být rozšířena a loděnice Ťiang-nan si bez odkladu zaslouží nové investice do doků." # todo: NEW TRANSLATION
 CHI_designated_succesor: "Určený nástupce" # todo: NEW TRANSLATION
 CHI_designated_succesor_desc: "Teng Siao-pchingův návrh kolektivního vedení zahrnoval uspořádaný mechanismus nástupnictví: každý nejvyšší vůdce měl vychovat nástupce, aby zabránil nekonečné vládě jediného muže. Nyní se pohybujeme mezi očekáváními této tradice a logikou vlastní konsolidace. Určený nástupce poskytuje ujištění frakcím obávajícím se nekontrolované osobní autority a Tuan-paj získává symbolický ústupek výměnou za souhlas. Je to cena, kterou stojí za to zaplatit za stabilitu." # todo: NEW TRANSLATION
 CHI_Develop_Hospitals: "Rozvíjet nemocnice" # todo: NEW TRANSLATION
 CHI_Develop_Hospitals_desc: "Tragédií je, že mnohá úmrtí na africkém kontinentu jsou způsobena snadno léčitelnými nemocemi. Musíme našim partnerům poskytnout nástroje nezbytné k zajištění jejich obyvatel." # todo: NEW TRANSLATION
 CHI_Development_Assistance: "Zvýšit rozvojovou pomoc" # todo: NEW TRANSLATION
 CHI_Development_Assistance_desc: "Naše současné rozvojové snahy lze dále zlepšovat, aby se urychlil hospodářský růst v členských státech SCO." # todo: NEW TRANSLATION
 CHI_Digital_Silk_Road: "Digitální Hedvábná stezka" # todo: NEW TRANSLATION
 CHI_Digital_Silk_Road_desc: "Rozšiřujme čínskou digitální infrastrukturu do rozvojových zemí prostřednictvím sítí 5G, optických kabelů a technologií chytrých měst a vytvářejme trvalou technologickou závislost." # todo: NEW TRANSLATION
 CHI_Digital_Silk_Road_Initiative: "Iniciativa digitální Hedvábné stezky" # todo: NEW TRANSLATION
 CHI_Digital_Silk_Road_Initiative_desc: "Huawei a ZTE již vybudovaly sítě 4G a 5G, podmořské kabely a platformy pro dohled chytrých měst ve více než 80 zemích. Digitální Hedvábná stezka vytváří v partnerských státech hluboké technologické závislosti a poskytuje nám přednostní přístup k jejich telekomunikační infrastruktuře. Tento program bychom měli urychlit, než západní regulační tlak přesvědčí další vlády, aby naše firmy vyloučily." # todo: NEW TRANSLATION
 CHI_digital_yuan_ecny: "Digitální jüan" # todo: NEW TRANSLATION
 CHI_digital_yuan_ecny_desc: "Čínská lidová banka zahájila projekt digitální měny a elektronických plateb a prostřednictvím komerčních bank distribuuje e-CNY v pilotních projektech v Šen-čenu, Su-čou a Pekingu. Nyní je aktivních dvě stě šedesát milionů peněženek. Projekt mBridge testuje přeshraniční vypořádání CBDC s Hongkongem, Thajskem a SAE jako alternativu k SWIFT. Digitální jüan není pouze platebním nástrojem; je infrastrukturou měnového řádu nezávislého na Washingtonu." # todo: NEW TRANSLATION
 CHI_Disengage_from_Pakistan: "Odstřihnout se od Pakistánu" # todo: NEW TRANSLATION
 CHI_Disengage_from_Pakistan_desc: "Je čas znovu zvážit náš přístup k indickému subkontinentu. Blízké partnerství dvou z největších ekonomik světa by nám mohlo být prospěšnější než další aliance s menší mocností. Odstřižení od Pakistánu bude prvním krokem k našemu sblížení s Indií." # todo: NEW TRANSLATION
 CHI_distant_water_fishing_strategy: "Strategie rybolovu ve vzdálených vodách" # todo: NEW TRANSLATION
 CHI_distant_water_fishing_strategy_desc: "Naše flotila rybolovu ve vzdálených vodách nyní čítá více než 2 500 plavidel působících ve výlučných ekonomických zónách Mauritánie, Sierry Leone, Argentiny a Peru. Program vychází z první výpravy China National Fisheries Corporation do západoafrických vod. Strategie Going Out začleňuje rybolov ve vzdálených vodách jako trvalou součást naší politiky potravinové bezpečnosti. Provoz podporují palivové dotace, plavidla s výrobníky ledu a přístavní dohody v Batě, Walvis Bay a Montevideu, přičemž souostroví Čou-šan v Če-ťiangu slouží jako hlavní zpracovatelské centrum." # todo: NEW TRANSLATION
 CHI_ditiao_gang_crackdown: "Zásah proti nelegální oceli" # todo: NEW TRANSLATION
 CHI_ditiao_gang_crackdown_desc: "Více než 600 neregistrovaných oceláren s indukčními pecemi, které ročně vyrábějí odhadem 140 milionů tun nekvalitní oceli ditiao gang, musí být uzavřeno. Ministerstvo průmyslu a informačních technologií z toho učinilo hlavní prvek strukturální reformy na straně nabídky. Oficiální statistiky výroby vzrostou, jakmile bude skrytá produkce absorbována, kvalita oceli se zlepší a ceny porostou po odstranění nekvalitní nabídky z trhu. Obchodníci s betonářskou ocelí, kteří z tohoto chaosu těžili, měli svůj čas." # todo: NEW TRANSLATION
 CHI_document_nine: "Dokument č. 9" # todo: NEW TRANSLATION
 CHI_document_nine_desc: "Tajné stranické komuniké nazvané „O současném stavu ideologické sféry“ označuje sedm západních ideologických hrozeb, které je třeba potlačit: konstituční demokracii, občanskou společnost, neoliberalismus, svobodu tisku, historický nihilismus, zpochybňování socialismu a pochybnosti o stranických reformách. Nařizuje povinná studijní zasedání na univerzitách a ve státních médiích. Hranice přijatelného myšlení se přes noc zužují a loajalita se prokazuje odmítnutím zahraničních konceptů." # todo: NEW TRANSLATION
 CHI_Doklam_Road_Standoff: "Doklam Road Standoff" # todo: NEW TRANSLATION
 CHI_Doklam_Road_Standoff_desc: "Doklam je čínské teritorium, a proto bychom měli být schopni volně přes něj přesouvat vojáky a stavební techniku, pokud si to budeme přát. Pokud Bhútán a Indie chtějí reagovat, nechte je. To bude skvělá příležitost otestovat jejich bojovou připravenost." # todo: NEW TRANSLATION
 CHI_domestic_eda: "Domácí EDA a duševní vlastnictví" # todo: NEW TRANSLATION
 CHI_domestic_eda_desc: "Software pro automatizaci elektronického návrhu – nástroje používané k navrhování integrovaných obvodů – dodávaly téměř výhradně společnosti Cadence, Synopsys a Mentor Graphics. Poté, co Spojené státy zařadily nástroje EDA na seznam kontrolovaných subjektů, jsme investice nasměrovali do společností Empyrean Technology, Primarius a Xpeedic. Domácí EDA již dosahuje plné funkčnosti pro vyspělé výrobní procesy, ačkoli pokrytí pokročilých uzlů pro návrhy pod 5 nm zůstává částečné. Státní licencování domácích bloků duševního vlastnictví doplňuje vývoj EDA a zbývající mezeru musíme uzavřít dříve, než si Washington všimne, jak blízko jsme." # todo: NEW TRANSLATION
 CHI_dragon_eye_over_lanzhou: "Dračí oko nad Lan-čou" # todo: NEW TRANSLATION
 CHI_dragon_eye_over_lanzhou_desc: "Čína buduje vlastní Aegis. Torpédoborec typu 052C, jehož první jednotkou byl Lan-čou uvedený do služby v roce 2004, nese fázovaný radar typu 346 „Dračí oko“ a střelu HHQ-9, čímž čínská válečná loď poprvé získává skutečnou plošnou protivzdušnou obranu flotily. Námořnictvo konečně dokáže na moři chránit vlastní oblohu." # todo: NEW TRANSLATION
 CHI_Drop_Claims_on_Bhutan: "Zrušit nároky na Bhútán" # todo: NEW TRANSLATION
 CHI_Drop_Claims_on_Bhutan_desc: "Hlavní překážkou pro zlepšení vztahů mezi námi a Bhútánem jsou naše nároky na části území, které Bhútán ovládá. To vedlo také k napětí s Indií, napětí, které by mohlo vést k nechtěnému konfliktu. Je nejlepší, abychom tyto nároky prozatím zrušili." # todo: NEW TRANSLATION
 CHI_dual_credit_auto_export: "Systém dvojích kreditů a největší vývozce na světě" # todo: NEW TRANSLATION
 CHI_dual_credit_auto_export_desc: "Nařízení o dvojích kreditech přiděluje každé automobilce na našem trhu oddělené účty kreditů za spotřebu paliva a za nová energetická vozidla, čímž vytváří systém obchodování s emisními kredity pro elektromobily a nahrazuje přímé dotace konkurenčním tlakem. Nyní každoročně vyvážíme více než 5 milionů vozidel a překonáváme Japonsko jako největší vývozce automobilů na světě. Evropská unie uvaluje k základnímu clu dodatečná cla ve výši 17 až 37 procent; Spojené státy uvalují na naše elektromobily clo 100 procent. Žádná z těchto překážek nezastaví to, o čem trh již rozhodl." # todo: NEW TRANSLATION
 CHI_eat_imperial_grain: "Jíst císařské obilí" # todo: NEW TRANSLATION
 CHI_eat_imperial_grain_desc: "Armáda, která provozuje hotely, pašuje automobily a obchoduje se zbraněmi, je loajální vlastní peněžence, nikoli straně. V červenci 1998 Ťiang Ce-min nařídil CHKO, aby se vzdala svého obchodního impéria a místo toho žila ze státního obilí, pouze z rozpočtu. Touto cestou dojdeme až na její konec: k profesionální, placené a čisté síle, která se zodpovídá pouze Pekingu." # todo: NEW TRANSLATION
 CHI_ecommerce_infrastructure: "Čínská infrastruktura elektronického obchodu" # todo: NEW TRANSLATION
 CHI_ecommerce_infrastructure_desc: "Taobao porazilo eBay China bezplatnými nabídkami a integrovaným zasíláním zpráv, načež Tmall rozšířil platformu o značkové B2C obchody pro mezinárodní maloobchodníky. JD.com vybudoval vlastní síť 1 500 skladů a doručovací síť na plný úvazek, která funguje rychleji než jakákoli logistická služba, kterou jsme zdědili. Elektronický obchod nyní tvoří 30 procent našeho maloobchodu, nejvyšší podíl mezi velkými ekonomikami, a infrastruktura, která jej umožňuje, je zcela naše." # todo: NEW TRANSLATION
 CHI_Economic_Framework_for_Unity: "Ekonomický rámec sjednocení" # todo: NEW TRANSLATION
 CHI_Economic_Framework_for_Unity_desc: "Obě Koreje a jejich patroni z řad velmocí načrtávají plán ekonomické integrace. Čínské investice do severokorejské infrastruktury, jihokorejské technologické transfery a americké finanční záruky tvoří základy možného sjednocení Koreje." # todo: NEW TRANSLATION
 CHI_Economic_Reintegration: "Ekonomická reintegrace" # todo: NEW TRANSLATION
 CHI_Economic_Reintegration_desc: "Zahajujeme dlouhý proces začleňování severokorejské ekonomiky do naší průmyslové sféry. Investice proudí na sever; suroviny a pracovní síla proudí na jih. Korejský tributární vztah, po celé století nečinný, je fakticky obnoven." # todo: NEW TRANSLATION
 CHI_Eight_Country_Initiative: "Pacifická iniciativa osmi zemí" # todo: NEW TRANSLATION
 CHI_Eight_Country_Initiative_desc: "Konsolidovaný bezpečnostní a hospodářský rámec navržený osmi tichomořským ostrovním státům by nám jediným podpisem poskytl regionální dohodu o policejní činnosti, monitorování rybolovu a datové síti. Iniciativa testuje, zda lze náš nahromaděný diplomatický kapitál v Pacifiku proměnit v kolektivní uspořádání soupeřící s regionální architekturou, kterou Austrálie udržuje po desetiletí. Úspěch rozhodne, zda povedeme institucionální tvorbu v Pacifiku, nebo se jí pouze zúčastníme." # todo: NEW TRANSLATION
 CHI_eleventh_five_year_plan: "Jedenáctý pětiletý plán" # todo: NEW TRANSLATION
 CHI_eleventh_five_year_plan_desc: "Náš další pětiletý plán musí stanovit závazné cíle: povinné snížení energetické náročnosti na jednotku HDP o 20 procent, snížení emisí hlavních znečišťujících látek o 10 procent a vyšší podíl služeb na HDP. Měli bychom také zvýšit státní investice do výzkumu a vzdělávání a urychlit budování venkovské infrastruktury. Růst bez těchto omezení je růstem, který nedokážeme udržet." # todo: NEW TRANSLATION
 CHI_Emphasize_Economic_Cooperation: "Zdůraznit hospodářskou spolupráci" # todo: NEW TRANSLATION
 CHI_Emphasize_Economic_Cooperation_desc: "Šanghajská organizace by měla být především prostředníkem hospodářské pomoci od bohatších členů k chudším. Naším cílem regionální stability je nejlépe dosažen posílením ekonomik našich zranitelnějších sousedů. Kromě toho by SCO mělo usilovat o zlepšení životů těch, kteří v jeho rámci žijí." # todo: NEW TRANSLATION
 CHI_Emphasize_Military_Cooperation: "Zdůraznit vojenskou spolupráci" # todo: NEW TRANSLATION
 CHI_Emphasize_Military_Cooperation_desc: "Není třeba skrývat naše záměry. SCO by měla být výslovně bezpečnostně orientovaná organizace, která nám a našim ruským partnerům poskytuje oporu proti případné agresi ze strany vnějších nepřátel, především USA." # todo: NEW TRANSLATION
 CHI_Emphasize_Political_Cooperation: "Zdůraznit politickou spolupráci" # todo: NEW TRANSLATION
 CHI_Emphasize_Political_Cooperation_desc: "SCO by měla být především organizací, která udržuje regionální stabilitu tím, že chrání legitimní vlády svých členských států před destabilizujícími hrozbami zevnitř." # todo: NEW TRANSLATION
 CHI_End_Joint_Military_Exercises: "Ukončit společné vojenské cvičení" # todo: NEW TRANSLATION
 CHI_End_Joint_Military_Exercises_desc: "Naše cvičení s Pakistanem jsou Indii vnímána s nedůvěrou. Musíme je ukončit, abychom si získali jejich důvěru." # todo: NEW TRANSLATION
 CHI_Equal_Partners: "Rovnoprávní partneři" # todo: NEW TRANSLATION
 CHI_Equal_Partners_desc: "I když jsme v mnoha oblastech Rusy doháněli, stále máme hodně co se od této bývalé supervelmoci naučit. Je pro naše zájmy lepší udržet Rusy na naší straně, než je odcizovat a vyvolávat v nich nepřátelství." # todo: NEW TRANSLATION
 CHI_establish_defence_conglomerates: "Založení obranných konglomerátů" # todo: NEW TRANSLATION
 CHI_establish_defence_conglomerates_desc: "Roztříštěné továrny a znepřátelená ministerstva nemohou vyzbrojit velmoc. Soustředíme obranný sektor do několika obrovských státních konglomerátů, z nichž každý bude národním šampionem ve své oblasti a bude schopen financovat výzkum, sdílet talenty a plnit rozkazy armády ve velkém měřítku." # todo: NEW TRANSLATION
 CHI_Eurasian_Land_Bridge: "Dokončené euroasijské pozemní spojení" # todo: NEW TRANSLATION
 CHI_Eurasian_Land_Bridge_desc: "Nákladní železniční služba I-wu–Londýn prokázala, že nepřerušený pozemní železniční koridor z východní Číny do západní Evropy je komerčně funkční. Úplná euroasijská integrace znamená, že naši výrobci mohou dosáhnout evropských trhů za osmnáct dní namísto pětatřiceti dnů potřebných po moři. Nyní bychom měli investovat do zvýšení kapacity a četnosti, dokud se trasa objemem nevyrovná námořní přepravě." # todo: NEW TRANSLATION
 CHI_Exercise_Paektu_Honor: "Cvičení Čest Pektusanu" # todo: NEW TRANSLATION
 CHI_Exercise_Paektu_Honor_desc: "Zdrženlivost dáváme najevo dvoustranným vojenským cvičením zdůrazňujícím obranné postoje u řeky Ja-lu. Poselství Washingtonu je jasné: Pchjongjang dokážeme řídit bez americké eskalační reakce." # todo: NEW TRANSLATION
 CHI_Expand_Foreign_Service: "Rozšířit diplomatickou službu" # todo: NEW TRANSLATION
 CHI_Expand_Foreign_Service_desc: "Musíme rychle rozšířit naši konzulární síť a diplomatický sbor. Žádný jiný národ na Zemi nedokázal udržovat více diplomatických zastoupení po celém světě než my a měli bychom tuto výhodu dále posílit." # todo: NEW TRANSLATION
 CHI_Exploit_Economic_Clout: "Využít ekonomickou moc" # todo: NEW TRANSLATION
 CHI_Exploit_Economic_Clout_desc: "Ekonomická orientace SCO byla pro nás vysoce prospěšná vzhledem k naší obrovské převaze v kapitálu. Nyní můžeme využít tuto ekonomickou výhodu k posílení našeho politického vlivu nad ostatními členy SCO." # todo: NEW TRANSLATION
 CHI_export_processing_zones: "Exportní zpracovatelské zóny" # todo: NEW TRANSLATION
 CHI_export_processing_zones_desc: "Vymezené exportní zpracovatelské zóny v Ťiang-su, Fu-ťienu a Če-ťiangu nabízejí celní sklady, zjednodušené celní řízení a výhody nižších nákladů práce, které přitahují montážní provozy z Koreje, Tchaj-wanu a Japonska. Čína se stává konečným montážním uzlem východoasijských výrobních sítí." # todo: NEW TRANSLATION
 CHI_fabless_design_cluster: "Klastr bezvýrobního návrhu čipů" # todo: NEW TRANSLATION
 CHI_fabless_design_cluster_desc: "Náš průmysl návrhu polovodičů se soustředil kolem Šen-čenu a Šanghaje. Státní dotace přilákaly stovky startupů k návrhu čipů pro spotřební elektroniku, komunikace a akcelerátory umělé inteligence. Blízkost Šen-čenu k montáži desek plošných spojů, smluvní výrobě a dodavatelským řetězcům spotřební elektroniky z něj činí přirozené centrum; městský návrhářský klastr vytvořil společnosti Himax, Rockchip, Allwinner a desítky menších návrhářských firem, z nichž mnohé podporují provinční fondy Big Fund. Hloubka tohoto ekosystému je naší strukturální výhodou." # todo: NEW TRANSLATION
 CHI_factional_balance: "Frakční rovnováha" # todo: NEW TRANSLATION
 CHI_faw_changchun_automotive: "Rozšíření FAW Čchang-čchun" # todo: NEW TRANSLATION
 CHI_faw_changchun_automotive_desc: "First Automobile Works se sídlem v Čchang-čchunu je naší nejstarší automobilkou a základem, na němž byl vybudován zbytek našeho automobilového sektoru. Měli bychom rozšířit její portfolio společných podniků s Volkswagenem a Toyotou a současně směřovat státní investice do rozvoje domácích značek. Provincie Ťi-lin se stane oporou našeho domácího automobilového průmyslu." # todo: NEW TRANSLATION
 CHI_fifty_vanke_handover: "Předání Vanke" # todo: NEW TRANSLATION
 CHI_fifty_vanke_handover_desc: "Do prosince 1998 byly tisíce vojensky řízených podniků oceněny, zaregistrovány a převedeny do civilního vlastnictví. Majetkové společnosti v hodnotě celého jmění, odpovídající padesáti developerům Vanke, navždy opouštějí účetnictví armády. Generálové přicházejí o svá léna a strana získává čistší meč." # todo: NEW TRANSLATION
 CHI_Five_Stars_Highway: "Dopravní koridor pěti zemí" # todo: NEW TRANSLATION
 CHI_Five_Stars_Highway_desc: "Mezikontinentální silniční koridor spojující brazilské přístavy v Atlantiku s peruánskými terminály v Pacifiku prochází pěti zeměmi a zkracuje pozemní tranzit o týdny. Projekt je vlajkovou lodí našich logistických ambicí v Jižní Americe a v kontinentálním měřítku kopíruje ekonomickou logiku Panamského průplavu. Naše stavební firmy a finanční instituce ponesou rozvojové břemeno a vděčnost pěti národů bude následovat." # todo: NEW TRANSLATION
 CHI_flying_leopard_doctrine: "Doktrína létajícího leoparda" # todo: NEW TRANSLATION
 CHI_flying_leopard_doctrine_desc: "Flotila se učí útočit ze vzduchu dříve, než vlastní letadlovou loď. Pozemní stíhací bombardéry JH-7 „Létající leopard“, vyzbrojené protilodními střelami, mění námořní letectvo v nezávislou údernou složku schopnou doletět daleko nad moře a potopit nepřátelské operační uskupení z pobřeží." # todo: NEW TRANSLATION
 CHI_Form_the_SCO: "Vytvořte SCO" # todo: NEW TRANSLATION
 CHI_Form_the_SCO_desc: "Současně skupina Šanghajská pětka slouží jako prostředek pro úzkou spolupráci s Ruskem, Kazachstánem, Kyrgyzstánem a Tádžikistánem. Tyto interakce byly cenné, ale mohly by být dále zlepšeny, kdybychom toto neformální seskupení proměnili v robustní mezinárodní organizaci." # todo: NEW TRANSLATION
 CHI_Forum_China_CELAC: "Fórum spolupráce Čína–CELAC" # todo: NEW TRANSLATION
 CHI_Forum_China_CELAC_desc: "Společenství latinskoamerických a karibských států nám poskytuje multilaterální kanál obcházející Organizaci amerických států, které Washington dlouhodobě dominuje. Ministerské fórum zaměřené na infrastrukturu, obchod a zemědělské investice nám poskytuje nástroj k oslabování institucionální převahy Spojených států na jejich vlastní polokouli. Tento rámec bychom měli vnímat jako dlouhodobou investici, nikoli jednorázové gesto." # todo: NEW TRANSLATION
 CHI_Forum_on_China_African_Cooperation: "Forum o spolupráci Číny a Afriky" # todo: NEW TRANSLATION
 CHI_Forum_on_China_African_Cooperation_desc: "Forum o spolupráci Číny a Afriky (FOCAC) usnadňuje naši interakci s celým africkým kontinentem, regionem, který vnímáme ne jako pozadu či barbarský, jak jej vnímá západ, ale jako zdroj potenciálu a příležitostí." # todo: NEW TRANSLATION
 CHI_four_trillion_stimulus: "Stimulus ve výši čtyř bilionů jüanů" # todo: NEW TRANSLATION
 CHI_four_trillion_stimulus_desc: "Stimulační balíček ve výši 4 bilionů jüanů, odpovídající 12 procentům HDP, je namířen především do železnic, dálnic, letišť a sociálního bydlení. Místní vlády si půjčují prostřednictvím finančních nástrojů místních samospráv, aby spolufinancovaly svůj podíl na programu. China State Construction a China Communications Construction rychle expandují díky výsledným zakázkám. Zatímco zbytek světa se smršťuje, my se vyhneme recesi, ale stimulus vytváří převis dluhu ve financích místních samospráv a urychluje vznik realitní bubliny ve městech, jako jsou Ordos a Čchang-čou. Náklady jsou skutečné a dorazí." # todo: NEW TRANSLATION
 CHI_Friendship_Schools: "Školy přátelství" # todo: NEW TRANSLATION
 CHI_Friendship_Schools_desc: "Školy přátelství poskytují na kontinentu potřebné vzdělání, posilující regionální lidský kapitál." # todo: NEW TRANSLATION
 CHI_FTA_2015: "Dohoda o volném obchodu mezi Čínou a Jižní Koreou" # todo: NEW TRANSLATION
 CHI_FTA_2015_desc: "Naše dohoda o volném obchodu s Jižní Koreou je nyní plně prováděna. Snižování cel, společné logistické koridory a rozšířený obchod se zemědělskými produkty a elektronikou prohlubují dvoustrannou vzájemnou závislost a dávají Soulu hmatatelný zájem na stabilních vztazích s námi. Ekonomicky spoutaná Korea bude méně ochotná následovat Washington, když se jejich postoje střetnou." # todo: NEW TRANSLATION
 CHI_game_licensing_regs: "Regulace licencování her" # todo: NEW TRANSLATION
 CHI_game_licensing_regs_desc: "NPPA omezuje hraní nezletilých na tři hodiny týdně a vyžaduje vymáhání pomocí rozpoznávání obličeje. Úvodník agentury Sin-chua označuje hry za duchovní opium, což během jediného obchodního dne sráží cenu akcií Tencentu o 10 procent. Nové tituly vyžadují licenci banhao, přičemž přednost mají vlastenecká témata. Schvalování se obnovuje, jakmile studia obracejí pozornost k zahraničním trhům a vyvážejí produkt, který regulace učinila ideologicky spolehlivým." # todo: NEW TRANSLATION
 CHI_geely_volvo_acquisition: "Akvizice Volva společností Geely" # todo: NEW TRANSLATION
 CHI_geely_volvo_acquisition_desc: "Akvizice společnosti Volvo Cars Li Šu-fuem od Fordu za 1,8 miliardy amerických dolarů vytvořila vzor pro čínské zahraniční akvizice zaměřené na značku, duševní vlastnictví a distribuční sítě, nikoli na továrny. Geely následně získává London Taxi Company, 49,9procentní podíl v Protonu, 51 procent Lotusu a 9,7 procenta Daimler AG. Každá akvizice není pouze obchodní transakcí, ale prohlášením, že čínské firmy mohou vlastnit věci, které kdysi pouze montovaly." # todo: NEW TRANSLATION
 CHI_Geneva_Carve_Out: "Ženevský dvoustranný rámec" # todo: NEW TRANSLATION
 CHI_Geneva_Carve_Out_desc: "Švýcarská tradice obchodní neutrality činí ze země přirozený vstupní bod pro náš kapitál hledající přístup na evropské trhy bez dohledu regulačních orgánů Evropské unie. Dvoustranná dohoda o volném obchodu a série memorand o finančních trzích dávají našim bankám a státním fondům ženevskou základnu fungující pod mírnějším dohledem než v kterékoli srovnatelné jurisdikci EU. Bern získává příjmy z poplatků a objemu transakcí, zatímco my získáváme důvěryhodnou západní finanční adresu." # todo: NEW TRANSLATION
 CHI_Global_Ambitions: "Globální ambice" # todo: NEW TRANSLATION
 CHI_Global_Ambitions_desc: "Jsme připraveni definovat svou roli na světové scéně. Otázkou není, zda budeme velmocí, ale jakým druhem velmoci se rozhodneme být." # todo: NEW TRANSLATION
 CHI_gobi_solar_offshore_wind: "Solární pás Gobi a základny pobřežní větrné energie" # todo: NEW TRANSLATION
 CHI_gobi_solar_offshore_wind_desc: "Náš zákon o obnovitelné energii a výkupní tarify NDRC vytvořily politický rámec, který pohání pokles nákladů na solární energii. LONGi Green Energy, JinkoSolar, Trina Solar a JA Solar snížily náklady na panely pod 0,10 amerického dolaru za watt. Výroba polysilikonu v Sin-ťiangu a S’-čchuanu nyní pokrývá více než 80 procent světové poptávky. Solární Velká zeď Kubuqi ve Vnitřním Mongolsku, solární park v poušti Tengger v Ning-sia a solárně-větrná základna Hami v Sin-ťiangu jsou instalace v gigawattovém měřítku; pobřežní větrná energie se rozšiřuje u Jang-ťiangu, Pchu-tchienu a Jen-čchengu. Závazek dvojí uhlíkové neutrality program trvale ukotvuje." # todo: NEW TRANSLATION
 CHI_governance_moderenisation: "Modernizace správy" # todo: NEW TRANSLATION
 CHI_governance_moderenisation_desc: "Systémy sociálního kreditu, infrastruktura digitální identity a integrované sledovací sítě musí být sjednoceny pod jediným rámcem, který sleduje dodržování pravidel, odměňuje spolupráci a označuje nesouhlas. Technologie chytrých měst poskytují monitorování pohybu a komunikace ve městech v reálném čase v měřítku, které žádná předchozí správa nedokázala zvládnout. Digitální správa činí administrativu čitelnou: obyvatelstvo je na všech úrovních viditelné pro nás a podle toho řiditelné." # todo: NEW TRANSLATION
 CHI_grain_for_green_program: "Program Obilí za zeleň" # todo: NEW TRANSLATION
 CHI_grain_for_green_program_desc: "Katastrofální povodně na Jang-c’-ťiangu přinesly geologický verdikt nad desetiletími odlesňování sprašové plošiny: 4 150 mrtvých, 21 milionů zatopených hektarů a říční systém, který již nedokázal absorbovat vlastní povodí. Program Obilí za zeleň mění svahy se sklonem nad 25 stupňů zpět na lesy nebo travní porosty a nahrazuje ztracené příjmy ze sklizně platbami v obilí a hotovosti. Pokrýváme 32 milionů hektarů; konsolidované zemědělství na produktivní rovinaté půdě zvyšuje výnosy na hektar v obnovených oblastech. Obnova a produktivita nejsou protiklady." # todo: NEW TRANSLATION
 CHI_great_wall_suv_dominance: "Dominance SUV Great Wall Haval" # todo: NEW TRANSLATION
 CHI_great_wall_suv_dominance_desc: "Wej Ťien-ťün vybudoval z Great Wall Motors našeho šampiona v oblasti SUV v továrně v Pao-tingu, které si světoví výrobci sotva všimli. Haval H6 se stal čtyři roky po sobě nejprodávanějším SUV v Číně; poté se Haval stal samostatnou značkou, následovanou značkami WEY, Ora, Tank a Poer. Great Wall nyní provozuje montážní závody v Rusku, Thajsku a Brazílii a zaměřuje se na segmenty, které západní výrobci systematicky podceňovali a ponechávali bez konkurence." # todo: NEW TRANSLATION
 CHI_Guarantee_Bangladesh: "Zaručit Bangladéš" # todo: NEW TRANSLATION
 CHI_Guarantee_Bangladesh_desc: "Navzdory svým počátečním úzkým vztahům s Indií byl Bangladéš v uplynulých desetiletích vtahován do naší sféry. Můžeme tuto tendenci usnadnit tím, že Bangladéšanům poskytneme vojenskou ochranu." # todo: NEW TRANSLATION
 CHI_guatian_reckoning: "Zúčtování" # todo: NEW TRANSLATION
 CHI_guatian_reckoning_desc: "Úplatkářství nemůže zůstat navždy pohřbené. Logističtí magnáti, kteří rozprodávali vojenskou půdu a hromadili bedny alkoholu a zlata, čelí dni zúčtování a klika si musí vybrat, zda obětuje několik obětních beránků, nebo semkne řady a vzdoruje Pekingu." # todo: NEW TRANSLATION
 CHI_Gulf_Yuan_Settlement: "Mechanismus vypořádání v jüanech v Perském zálivu" # todo: NEW TRANSLATION
 CHI_Gulf_Yuan_Settlement_desc: "Státy Rady pro spolupráci arabských států v Zálivu začínají oceňovat významnou část vývozu ropy v renminbi a využívají Přeshraniční mezibankovní platební systém namísto SWIFT. Spolu s měnovými swapovými linkami centrálních bank a alokacemi RMB ve státních investičních fondech tento posun postupně oslabuje strukturální výhodu petrodolaru. Spojené státy ztrácejí nástroj finančního nátlaku, který uplatňovaly od roku 1974." # todo: NEW TRANSLATION
 CHI_h20_programme: "Program H-20" # todo: NEW TRANSLATION
 CHI_h20_programme_desc: "Poslední mezerou ve výzbroji velmoci je bombardér se schopností stealth a my se ji vydáváme uzavřít. H-20, konstrukce s létajícím křídlem, údajně schopná nést deset tun zbraní na vzdálenost přibližně osmi tisíc kilometrů bez doplňování paliva, by Číně umožnila útočit přes Pacifik z vlastního vzdušného prostoru. S ním je bombardovací složka skutečné globální triády dokončena." # todo: NEW TRANSLATION
 CHI_h6k_revival: "Obrození H-6K" # todo: NEW TRANSLATION
 CHI_h6k_revival_desc: "Stará kopie Tu-16 se znovu rodí. H-6K vyměňuje pumovnici za závěsníky řízených střel a dostává účinné dvouproudové motory s výrazně delším doletem. Stává se tak platformou pro útoky z odstupu, která odpalují střely proti pozemním cílům mimo dosah nepřátelské obrany. Přibližně sto deset těchto strojů nyní tvoří jádro bombardovacího letectva." # todo: NEW TRANSLATION
 CHI_harbin_equipment_manufacturing: "Ch Charbinská základna těžké techniky" # todo: NEW TRANSLATION
 CHI_harbin_equipment_manufacturing_desc: "Dědictví sovětského těžkého průmyslu v Charbinu je modernizováno a přesměrováno k výrobě zařízení pro výrobu energie, železničních komponentů a průmyslových strojů. Město se stává technickou páteří rozšiřování čínské infrastruktury." # todo: NEW TRANSLATION
 CHI_Health_Silk_Road: "Zdravotní Hedvábná stezka" # todo: NEW TRANSLATION
 CHI_Health_Silk_Road_desc: "Zdravotní Hedvábná stezka rozšiřuje naši lékařskou pomoc, výstavbu nemocnic a farmaceutické dodavatelské řetězce do partnerských států iniciativy Pásu a stezky. Rámec získal význam během pandemie covidu-19, kdy naše vakcínová diplomacie posílila naše postavení partnera v oblasti zdravotního rozvoje pro globální Jih. Nyní bychom jej měli formalizovat a rozšířit, aby závislost na západních farmaceutických institucích již nebyla výchozí možností." # todo: NEW TRANSLATION
 CHI_heavy_combined_arms_brigade: "Těžké kombinované brigády" # todo: NEW TRANSLATION
 CHI_heavy_combined_arms_brigade_desc: "Samotné tanky rychle padnou. Spojujeme typ 99 s pásovou pěchotou, samohybnými děly a ženisty do těžkých kombinovaných brigád, soběstačných úderných formací vybudovaných k prolomení opevněné linie a pokračování v pohybu." # todo: NEW TRANSLATION
 CHI_hebei_steel_group: "Hebei Iron & Steel Group" # todo: NEW TRANSLATION
 CHI_hebei_steel_group_desc: "Provincie Che-pej konsolidovala Tangshan Iron and Steel, Handan Iron and Steel a menší hutě do Hebei Iron and Steel Group, z níž se stane HBIS. Ve stejném období vznikly paralelní fúze Anshan-Benxi v Liao-ningu a Shandong Steel Group. Dvanáctý pětiletý plán povyšuje konsolidaci na celostátní politiku a stanovuje cíl, aby deset největších výrobců ovládalo 60 procent produkce. Éra tisíců malých hutí soutěžících s nízkými maržemi musí skončit." # todo: NEW TRANSLATION
 CHI_henan_grain_modernization: "Modernizace zemědělství v Che-nanu" # todo: NEW TRANSLATION
 CHI_henan_grain_modernization_desc: "Provincie Che-nan živí více lidí než kterákoli země v Evropě. Investice do skladovací infrastruktury, zpracovatelské kapacity a zemědělských poradenských služeb zvyšují výnosy a snižují posklizňové ztráty, posilují národní potravinovou bezpečnost a uvolňují venkovskou pracovní sílu pro průmyslové nasazení." # todo: NEW TRANSLATION
 CHI_high_speed_rail_one: "První fáze vysokorychlostní železnice" # todo: NEW TRANSLATION
 CHI_high_speed_rail_one_desc: "Naše první vyhrazené vysokorychlostní tratě se otevírají v rychlém sledu: Peking–Tchien-ťin, poté Wu-chan–Kuang-čou a následně ambiciózní koridor Peking–Šanghaj, který bude nejdelší vysokorychlostní tratí na světě. Program vychází z licencované technologie CRH od evropských a japonských výrobců, kterou naši inženýři přizpůsobují čínským podmínkám. To, co začíná jako vypůjčené know-how, se stane naším vlastním." # todo: NEW TRANSLATION
 CHI_hisilicon_kirin: "Mobilní platforma HiSilicon Kirin" # todo: NEW TRANSLATION
 CHI_hisilicon_kirin_desc: "Polovodičová dceřiná společnost Huawei HiSilicon vytvořila řadu SoC Kirin pro telefony Huawei, zavedla neurální procesorovou jednotku na čipu dříve než kterýkoli západní konkurent a dosáhla 7nm výroby u TSMC. Poté, co americké exportní kontroly tento zdroj přerušily, Huawei spolupracoval se SMIC na výrobě Kirin 9000S v domácím výrobním procesu. Program ukázal, že čínská bezvýrobní firma může dosáhnout výkonnostní úrovně Applu a Qualcommu a poskytl vzor, který nyní následuje každý domácí vývojář SoC." # todo: NEW TRANSLATION
 CHI_Honiara_Security_Pact: "Bezpečnostní dohoda z Honiary" # todo: NEW TRANSLATION
 CHI_Honiara_Security_Pact_desc: "Bezpečnostní rámec se Šalamounovými ostrovy umožňuje námořnictvu Lidové osvobozenecké armády kotvit, doplňovat zásoby a provádět operace z Honiary, vzdálené méně než 2 000 kilometrů od australské pevniny. Canberra reaguje poplašeně, urychluje harmonogram AUKUS a lobbuje ve Washingtonu za posílení odstrašujícího postoje v Pacifiku. Pakt nám poskytuje první otevřeně přiznanou bezpečnostní základnu východně od Prvního ostrovního řetězce a měli bychom ji zajistit dříve, než bude Honiara pod tlakem nucena svůj postoj odvolat." # todo: NEW TRANSLATION
 CHI_hq17_medium_range_air_defense: "Vrstvená protivzdušná obrana středního dosahu" # todo: NEW TRANSLATION
 CHI_hq17_medium_range_air_defense_desc: "Nad vrstvu bodové obrany přidáváme krytí středního dosahu a proplétáme střely krátkého i delšího dosahu do jediné síťové ochrany, aby mezi korunami stromů a stratosférou nezůstal žádný otevřený přístup." # todo: NEW TRANSLATION
 CHI_hq17_short_range_sam: "Krátkodosahový systém PVO HQ-17" # todo: NEW TRANSLATION
 CHI_hq17_short_range_sam_desc: "Brigády potřebují vlastní ochranný deštník. HQ-17, vyvinutý z ruského systému Tor, poskytuje rychlou bodovou obranu proti letounům, dronům a přesné munici a je namontován tak, aby držel krok s chráněnou obrněnou technikou." # todo: NEW TRANSLATION
 CHI_hu_jintao_reign: "Éra Chu Ťin-tchaa" # todo: NEW TRANSLATION
 CHI_hu_jintao_reign_desc: "Převzetí úřadů generálního tajemníka, prezidenta a předsedy Ústřední vojenské komise Chu Ťin-tchaem představuje nejuspořádanější přechod vedení v dějinách naší republiky. Jeho vláda bude klást důraz na institucionální správu a kolektivní rozhodování namísto osobní autority a přiblíží náš systém pravidelnému nástupnictví, které stabilní státy vyžadují." # todo: NEW TRANSLATION
 CHI_hua_hong_mature_node: "Kapacita společnosti Hua Hong pro vyspělé uzly" # todo: NEW TRANSLATION
 CHI_hua_hong_mature_node_desc: "Hua Hong Semiconductor, původně čínsko-francouzský společný podnik v Ťin-čchiao, se přeorientoval na specializovanou výrobu vyspělých uzlů: řízení napájení, vestavěné nevolatilní paměti a analogové čipy pro automobilový průmysl a internet věcí. Její 200mm a 300mm výrobní závody v Šanghaji a Wu-si sloužily domácím dodavatelským řetězcům, na které západní sankce snadno nedosáhly. Státní reinvestice rozšířily kapacitu a diverzifikovaly zákaznickou základnu za hranice exportního trhu." # todo: NEW TRANSLATION
 CHI_hualong_nuclear_batch: "Sériová výstavba Hualong One" # todo: NEW TRANSLATION
 CHI_hualong_nuclear_batch_desc: "Po dovozu reaktorů Westinghouse AP1000 do San-menu a Chaj-jangu, reaktorů Framatome EPR do Tchaj-šanu a jednotek Rosatom VVER do Tchien-wanu jsme dokončili vlastní konstrukci třetí generace. Hualong One, spojení ACP-1000 společnosti CNNC a ACPR-1000 společnosti CGN, vlastní kompletní čínské duševní vlastnictví a splňuje evropské požadavky pro energetické společnosti. Blok 5 ve Fu-čchingu se jako první připojuje k síti; následují jaderná základna Čang-čou, Čchang-ťiang na Chaj-nanu, Fang-čcheng-kang a Tchaj-pching-ling. Exportní verze HPR1000 vstupuje do provozu v elektrárně K-2 a K-3 v Karáčí a to je teprve začátek našeho jaderného exportního programu." # todo: NEW TRANSLATION
 CHI_huawei_zte_export: "Vývoz zařízení Huawei" # todo: NEW TRANSLATION
 CHI_huawei_zte_export_desc: "Huawei a ZTE ovládají více než 35 procent světového trhu s telekomunikačními zařízeními, přičemž výhoda Huawei v podobě Polar Code v normách 5G podporuje její dominanci. Prostřednictvím Digitální hedvábné stezky se naše infrastruktura dostává k operátorům ve 170 zemích. Západní vlády reagují zákazy a omezeními na seznamech sankcionovaných subjektů, ale fyzickou infrastrukturu, kterou jsme již vybudovali, nelze odstranit legislativou." # todo: NEW TRANSLATION
 CHI_huludao_schoolhouse: "Výcvikové středisko v Chu-lu-tao" # todo: NEW TRANSLATION
 CHI_huludao_schoolhouse_desc: "Letadlové lodě jsou bez pilotů schopných na nich přistát k ničemu. V Chu-lu-tao Námořní letecká univerzita buduje specializovaný výcvik pilotů letadlových lodí, včetně pozemního skokanského můstku a záchytného zařízení, a od základů cvičí letce, kteří z pohyblivé paluby učiní místo, odkud lze vést boj." # todo: NEW TRANSLATION
 CHI_hybrid_rice_super_program: "Program superhybridní rýže" # todo: NEW TRANSLATION
 CHI_hybrid_rice_super_program_desc: "Čínské národní výzkumné a vývojové centrum hybridní rýže Jüan Lung-pchinga v Čchang-ša sleduje postupné rekordy ve výnosech a každou zimu přesouvá svůj šlechtitelský tým do San-ja na ostrově Chaj-nan, kde tropické klima umožňuje celoroční pěstování, které je na pevnině nemožné. Hybridní odrůdy již pokrývají 60 procent naší plochy osázené rýží a souběžný program nyní zkoumá mořskou rýži odolnou vůči soli pro Severočínskou nížinu. Tuto investici bychom měli udržet: potravinová bezpečnost je základem, na němž spočívají všechny ostatní ambice." # todo: NEW TRANSLATION
 CHI_hydrogen_green_steel: "Výroba oceli pomocí vodíku" # todo: NEW TRANSLATION
 CHI_hydrogen_green_steel_desc: "Naše cíle dvojí uhlíkové neutrality a uhlíkové vyrovnávací opatření EU tlačí naše ocelárny k dekarbonizaci dříve, než za ně tuto volbu učiní zahraniční cla. Baowu uvedla v Čan-ťiangu do provozu demonstrační závod na přímou redukci pomocí vodíku s kapacitou jeden milion tun a spolupracuje přitom s Rio Tinto. HBIS spouští podobný projekt v Čang-ťia-kchou s využitím zeleného vodíku z elektrolýzy. V příštím desetiletí musíme výrazně zvýšit podíl elektrických obloukových pecí na naší produkci a plánování tohoto přechodu začíná nyní." # todo: NEW TRANSLATION
 CHI_hypersonic_strike_integration: "Integrace hypersonických úderů" # todo: NEW TRANSLATION
 CHI_hypersonic_strike_integration_desc: "Rychlost se stává novou stealth technologií. Hypersonické zbraně, které letí rychlostí více než pětinásobku rychlosti zvuku a po celou dobu manévrují, začleňujeme do úderného balíku letectva a stavíme tak nepřátelskou obranu před hrozbu, kterou nemá ověřeným způsobem jak zastavit." # todo: NEW TRANSLATION
 CHI_ilrs_lunar_base: "Mezinárodní výzkumná stanice na Měsíci" # todo: NEW TRANSLATION
 CHI_ilrs_lunar_base_desc: "Čína a Rusko podepsaly v roce 2021 plán pro Mezinárodní výzkumnou stanici na Měsíci a pozvaly partnerské země k vybudování společně provozované výzkumné základny poblíž jižního pólu Měsíce. Program upřednostňuje využívání místních zdrojů, trvalou infrastrukturu na povrchu a střídání posádek podle modelu antarktických výzkumných stanic. Zavazujeme naši průmyslovou a inženýrskou základnu k tomu, aby se tento projekt stal skutečností." # todo: NEW TRANSLATION
 CHI_individual_soldier_system: "Systém individuálního vojáka" # todo: NEW TRANSLATION
 CHI_individual_soldier_system_desc: "Puškař se stává uzlem, nikoli pouze spouští. Nový systém vojáka spojuje optiku, rádio, navigaci a neprůstřelnou vestu do jediné soupravy a propojuje každého pěšáka se sítí družstva a mapou velitele." # todo: NEW TRANSLATION
 CHI_Indo_Pacific_Strategy_Collapsed: "Indo-pacifická strategie se zhroutila" # todo: NEW TRANSLATION
 CHI_Indo_Pacific_Strategy_Collapsed_desc: "Stažení Jižní Koreje z trilaterálního rámce Spojených států, Japonska a Filipín přerušuje kritické spojení ve washingtonském indo-pacifickém řetězci. Japonsko zůstává samo se svými bezpečnostními obavami a americká důvěryhodnost v celém regionu je otřesena." # todo: NEW TRANSLATION
 CHI_Information_Warfare: "Informační válka" # todo: NEW TRANSLATION
 CHI_Information_Warfare_desc: "Nasadit státní média, operace na sociálních sítích a strategické narativy k utváření veřejného mínění v cílových zemích a čelit západní informační dominanci." # todo: NEW TRANSLATION
 CHI_informatized_local_wars: "Vyhrávat lokalizované války v informačním věku" # todo: NEW TRANSLATION
 CHI_informatized_local_wars_desc: "Už se nepřipravujeme na totální válku na severní pláni. Vedoucí doktrínou se stává vítězství v lokalizovaných válkách v informačních podmínkách: krátká, prudká a technologicky vyspělá tažení na periferii Číny, o nichž rozhodne, kdo na propojeném bojišti první uvidí a udeří. Každá níže uvedená reforma nyní slouží tomuto jedinému požadavku." # todo: NEW TRANSLATION
 CHI_inner_party_supervision_regulations: "Předpisy vnitrostranického dohledu" # todo: NEW TRANSLATION
 CHI_inner_party_supervision_regulations_desc: "Naše vnitrostranická odpovědnost se příliš dlouho opírala o neformální normy a osobní vazby. Musíme přijmout formální předpisy dohledu, které stanoví povinné postupy, podle nichž budou nadřízené orgány kontrolovat, podávat zprávy o podřízených stranických výborech a uplatňovat vůči nim sankce. Kodifikace těchto mechanismů zmenší prostor pro místní představitele, aby působili jako nedotknutelní feudální páni." # todo: NEW TRANSLATION
 CHI_integrated_air_and_space: "Integrované vzdušné a kosmické síly" # todo: NEW TRANSLATION
 CHI_integrated_air_and_space_desc: "Letectvo musí přestat být armádním deštníkem a stát se samostatnou strategickou službou. Usilujeme o „integrované vzdušné a kosmické operace, připravené k útoku i obraně“, doktrínu přijatou v roce 2004, která spojuje stíhačky, bombardéry, rakety, satelity a včasné varování do jediného dosahu. Obloha a blízký vesmír se stávají jedním bojištěm a musí patřit nám." # todo: NEW TRANSLATION
 CHI_intra_party_democracy_experiments: "Experimenty s vnitrostranickou demokracií" # todo: NEW TRANSLATION
 CHI_intra_party_democracy_experiments_desc: "Několik lokalit uspořádalo více-kandidátní soutěžní volby na stranické funkce na úrovni okresů a obcí. Zastánci tvrdí, že konkurenční výběr posílí legitimitu a zlepší správu; kritici varují, že sporné volby oslabí ideologickou disciplínu a vytvoří frakční soupeření. Výsledek těchto experimentů rozhodne, zda model rozšíříme, nebo potlačíme." # todo: NEW TRANSLATION
 CHI_Invest_in_Cheap_Energy: "Investujte do levné energie" # todo: NEW TRANSLATION
 CHI_Invest_in_Cheap_Energy_desc: "Ačkoliv koluje spousta řečí o obnovitelných zdrojích energie, na konci dne jsou to levné fosilní paliva, která mohou lid Afriky vytáhnout z chudoby." # todo: NEW TRANSLATION
 CHI_Invest_in_Clean_Energy: "Investujte do čisté energie" # todo: NEW TRANSLATION
 CHI_Invest_in_Clean_Energy_desc: "Rozvoj by neměl probíhat na úkor životního prostředí. Naše technické know-how znamená, že můžeme sdílet naše pokroky v technologii obnovitelných zdrojů s našimi partnery na africkém kontinentu." # todo: NEW TRANSLATION
 CHI_invigorate_country_through_STE: "Oživit zemi prostřednictvím vědy a vzdělávání" # todo: NEW TRANSLATION
 CHI_invigorate_country_through_STE_desc: "V roce 1995, na konci svého funkčního období, Ťiang Ce-min prosadil strategii omlazení národa prostřednictvím vědy a vzdělávání. Plán má prostřednictvím upřednostnění investic do výzkumu, technologického dohánění a vysokého školství uzavřít náskok vyspělého světa a posunout Čínu od ekonomiky založené na práci k ekonomice založené na znalostech." # todo: NEW TRANSLATION
 CHI_Iron_Brothers: "Železní bratři" # todo: NEW TRANSLATION
 CHI_Iron_Brothers_desc: "Čína a Pákistán jsou blízcí strategičtí partneři a tento vztah by měl být zachován pro náš vzájemný prospěch. Náš společný indický nepřítel se nemůže postavit naší společné síle." # todo: NEW TRANSLATION
 CHI_iron_ore_pricing_war: "Bitva o ceny železné rudy" # todo: NEW TRANSLATION
 CHI_iron_ore_pricing_war_desc: "Baosteel převzala od Nippon Steel roli hlavního vyjednavače čínských odběratelů při každoročních jednáních o referenční ceně železné rudy s Rio Tinto, BHP Billiton a Vale. Systém se hroutí, protože spotové nákupy menších čínských hutí podkopávají referenční cenu. Zatčení vedoucího pracovníka Rio Tinto Sterna Hu v Šanghaji a neúspěšná nabídka společnosti Chinalco na 18procentní podíl v Rio Tinto představují vrchol diplomatického napětí. Musíme reagovat urychlením zahraničních těžebních investic v Austrálii a západní Africe, abychom diverzifikovali naše dodávky." # todo: NEW TRANSLATION
 CHI_j10c_multirole_refit: "Modernizace J-10C" # todo: NEW TRANSLATION
 CHI_j10c_multirole_refit_desc: "J-10 dostává zuby. J-10C přidává radar AESA, raketu dlouhého dosahu PL-15 a od roku 2021 domácí motor WS-10B, čímž mění lehkou stíhačku ve skutečnou víceúčelovou hrozbu, která od té doby způsobila ztráty na jihoasijském nebi." # todo: NEW TRANSLATION
 CHI_j11b_sinification: "Počínštění J-11" # todo: NEW TRANSLATION
 CHI_j11b_sinification_desc: "Su-27 vyráběný v Šen-jangu v licenci se stává čínským letounem. J-11B nahrazuje ruský radar, avioniku a rakety domácími systémy, osvobozuje výrobní řadu Flanker od moskevských náhradních dílů a dokazuje, že čínský průmysl dokáže přepracovat frontovou stíhačku od začátku do konce." # todo: NEW TRANSLATION
 CHI_j16_strike_platform: "Úderná platforma J-16" # todo: NEW TRANSLATION
 CHI_j16_strike_platform_desc: "J-16 „Čchien-lung“, těžký dvoumístný letoun odvozený od Flankeru, nese radar AESA, největší náklad zbraní v celém letectvu a dlouhý dolet. Nyní jde o hlavní čínský letoun pro tlak na vzdušný prostor Tchaj-wanu a o víceúčelovou údernou platformu, kolem níž se buduje moderní letecké křídlo." # todo: NEW TRANSLATION
 CHI_jh7a_update: "Modernizace JH-7A" # todo: NEW TRANSLATION
 CHI_jh7a_update_desc: "JH-7A „Létající leopard“, odolný dvoumístný stíhací bombardér, je modernizován novými přesnými zbraněmi a zaměřovacími kontejnery. Levný a osvědčený letoun pro údery proti námořním cílům tak zůstává relevantní vedle novějších strojů." # todo: NEW TRANSLATION
 CHI_jiang_doctrine_taiwan: "Ťiangova doktrína o Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_jiang_doctrine_taiwan_desc: "Ťiangův osmičlánkový návrh staví politiku přes Tchaj-wan na mírovém znovusjednocení a zároveň výslovně odmítá vyloučit použití síly. Spojení této doktríny s rostoucím arzenálem PLA pro znemožnění přístupu nám poskytuje důvěryhodný donucovací rámec a zvyšuje náklady de iure nezávislosti Tchaj-wanu na úroveň, kterou si žádná vláda v Tchaj-peji nemůže politicky dovolit." # todo: NEW TRANSLATION
 CHI_jiangnan_changxing_move: "Přesun Ťiang-nan na Čchang-sing" # todo: NEW TRANSLATION
 CHI_jiangnan_changxing_move_desc: "Historická loděnice Ťiang-nan, sevřená v srdci staré Šanghaje, se nemůže rozrůstat. Přesouváme ji po proudu na ostrov Čchang-sing, do obrovských nových hal a hlubokovodních doků vybudovaných pro stavbu desítek válečných lodí. Přesun jediným rázem násobí naši výrobní kapacitu a stává se kovárnou moderního loďstva." # todo: NEW TRANSLATION
 CHI_jiangnan_scale: "Rozšířit loděnici Ťiang-nan" # todo: NEW TRANSLATION
 CHI_jiangnan_scale_desc: "Válečné lodě se vyhrávají na skluzu ještě předtím, než se vyhrají na moři. Obrovské nové haly loděnice Ťiang-nan na ostrově Čchang-sing jsou uvedeny do plného tempa a stavějí torpédoborce i letadlové lodě souběžně, zatímco soupeři je stavějí po jedné." # todo: NEW TRANSLATION
 CHI_Joint_Military_Projects: "Společné vojenské projekty" # todo: NEW TRANSLATION
 CHI_Joint_Military_Projects_desc: "Společně Čína a Pákistán mohou vyvíjet nové a inovativní vojenské projekty, aby získaly převahu nad Indií." # todo: NEW TRANSLATION
 CHI_Joint_Operations: "Společné protiteroristické operace" # todo: NEW TRANSLATION
 CHI_joint_operations_command: "Velitelství společných operací" # todo: NEW TRANSLATION
 CHI_joint_operations_command_desc: "Vítězství nyní patří tomu, kdo spojí pozemní, námořní, letecké a raketové síly v jedinou pěst. Zřizujeme skutečné velitelství společných operací a propojujeme pět bojišť do jediného obrazu, aby bitvu vedly všechny ozbrojené síly najednou, nikoli jednotlivé složky postupně. Tím se odemyká struktura velitelství bojišť." # todo: NEW TRANSLATION
 CHI_Joint_Operations_desc: "Radikální islamistické skupiny představují významnou hrozbu pro regionální bezpečnost a musí být čeleny jednotnou a neochvějnou silou zbraní." # todo: NEW TRANSLATION
 CHI_Joint_Operations_tt: "Spustí událost strategické volby. Obranná možnost vytvoří nebo rozšíří frakci SCO s Afghánistánem, Pákistánem a Tádžikistánem. Trestající a totálně válečné možnosti místo toho vytvoří válečné cíle proti Tálibánu a TTP prostřednictvím reakce Pákistánu." # todo: NEW TRANSLATION
 CHI_Joint_Research: "Společný výzkum" # todo: NEW TRANSLATION
 CHI_Joint_Research_desc: "Společně naše země mohou dosáhnout vědeckého pokroku, který bude prospěšný pro všechny naše lidi." # todo: NEW TRANSLATION
 CHI_joint_stock_city_banks: "Akciové komerční a městské banky" # todo: NEW TRANSLATION
 CHI_joint_stock_city_banks_desc: "Pod Velkou čtyřkou se rozvinula bohatá druhá vrstva. China Merchants Bank se díky silnému mobilnímu bankovnictví stala lídrem retailového bankovnictví; China Minsheng Bank, první nestátní banka, slouží malým a středním podnikům; HSBC drží 19,9procentní podíl v Bank of Communications. Více než 130 městských komerčních bank ukotvuje regionální finance ve městech druhé a třetí úrovně, rozšiřuje přístup soukromých firem k úvěrům a urychluje zavádění digitálních bankovních služeb. Tato rozmanitost institucí je silou, kterou bychom měli rozvíjet." # todo: NEW TRANSLATION
 CHI_joint_venture_framework: "Průmyslový rámec společných podniků" # todo: NEW TRANSLATION
 CHI_joint_venture_framework_desc: "Komplexní rámec upravuje přenos technologií, požadavky na místní obsah a repatriaci zisků ve společných podnicích. Zahraniční firmy získávají přístup na trh; čínští partneři získávají technologie a manažerské znalosti, které postupně pronikají do domácích firem." # todo: NEW TRANSLATION
 CHI_keep_the_shell_companies: "Ponechat prázdné schránkové společnosti" # todo: NEW TRANSLATION
 CHI_keep_the_shell_companies_desc: "Bylo nám nařízeno se jich zbavit, ale my se jich zbavíme pouze na papíře. Podniky armády jsou znovu registrovány na bratrance, nastrčené osoby a prázdné schránkové společnosti, přičemž jejich zisky stále proudí zpět k jednotkám, které je vlastní. Auditoři nacházejí prázdné kanceláře; generálové si ponechávají své příjmy." # todo: NEW TRANSLATION
 CHI_kj2000_mainring_awacs: "KJ-2000 Mainring" # todo: NEW TRANSLATION
 CHI_kj2000_mainring_awacs_desc: "Poté, co Washington zablokoval izraelský prodej systému Phalcon, si Čína vybudovala vlastní. KJ-2000, domácí radar s aktivním polem umístěný na letounu Il-76, poskytuje letectvu první skutečné vzdušné velitelské stanoviště a umožňuje stíhačkám útočit na cíle, které samy ještě nedokázaly spatřit." # todo: NEW TRANSLATION
 CHI_kj500_network_centric_hub: "Síťový uzel KJ-500" # todo: NEW TRANSLATION
 CHI_kj500_network_centric_hub_desc: "KJ-500, pevný radar se třemi anténními poli na turbovrtulovém letounu Y-9, je hlavním okem na obloze. Vyráběný ve velkých počtech propojuje stíhačky, lodě a rakety do jediného obrazu — létajícího uzlu síťově orientované války." # todo: NEW TRANSLATION
 CHI_KPA_Offensive_Readiness: "Ofenzivní připravenost KLA" # todo: NEW TRANSLATION
 CHI_KPA_Offensive_Readiness_desc: "Tiše podporujeme změnu postoje Korejské lidové armády od obrany do hloubky k předsunuté ofenzivní připravenosti. Převody vybavení se urychlují a společná plánovací zasedání se rozšiřují. Poloostrov se přibližuje hraně." # todo: NEW TRANSLATION
 CHI_leader_of_the_people: "Renmin Lingxiu" # todo: NEW TRANSLATION
 CHI_leader_of_the_people_desc: "Třetí historická rezoluce Komunistické strany formalizuje titul Renmin Lingxiu, „Lidový vůdce“, označení používané pouze u dvou postav v dějinách strany: Mao Ce-tunga a Si Ťin-pchinga. Maův portrét stále visí nad branou Tchien-an-men. Třetí historický okamžik strany nalezl svou historickou postavu a význam této kontinuity neunikne nikomu, kdo si rezoluci pozorně přečte." # todo: NEW TRANSLATION
 CHI_leading_small_group_doctrine: "Ústřední vedoucí skupiny" # todo: NEW TRANSLATION
 CHI_leading_small_group_doctrine_desc: "Ústřední vedoucí malé skupiny nyní současně dohlížejí na finance, hospodářské reformy, zahraniční věci, kybernetickou bezpečnost a vojenskou reformu, přičemž všechny řídí jediná kancelář. Toto uspořádání obchází tradiční strukturu výborů politbyra a soustřeďuje rozhodování tam, kde může postupovat bez prodlení. Technokraté provádějí; centrum koordinuje. Politika se pohybuje rychleji a každý výstup je podřízen jediné vůli." # todo: NEW TRANSLATION
 CHI_Let_Seoul_Lead: "Nechat vést Soul" # todo: NEW TRANSLATION
 CHI_Let_Seoul_Lead_desc: "Dáváme najevo, že přijímáme jihokorejské vedení v případném procesu sjednocení. Demokratické instituce Soulu a jeho hospodářská váha z něj činí přirozenou kotvu sjednocené Koreje. Ustupujeme stranou, aby Korejci mohli rozhodnout o své vlastní budoucnosti." # todo: NEW TRANSLATION
 CHI_Leverage_Influence: "Využít vliv" # todo: NEW TRANSLATION
 CHI_Leverage_Influence_desc: "Afrika je nám tak zadlužena, že vlády na celém kontinentu musí sklonit hlavu před naší vůlí." # todo: NEW TRANSLATION
 CHI_liangjiang_new_area: "Liangjiangská národní nová oblast" # todo: NEW TRANSLATION
 CHI_liangjiang_new_area_desc: "Liangjiang v Čchung-čchingu se stává první vnitrozemskou novou oblastí na národní úrovni po Pudongu v Šanghaji a Binhai v Tchien-ťinu. Zóna přilákala Ford, HP a více než 300 podniků z žebříčku Fortune 500 a již vyrábí 1,19 milionu vozidel ročně. Kuang-čungská nížina kolem Si-anu získává paralelní investice, čímž se Šen-si staví do role obchodní a průmyslové kotvy severozápadu. Model je ověřený; nyní musíme rozšířit jeho měřítko." # todo: NEW TRANSLATION
 CHI_Lips_and_Teeth_Doctrine: "Doktrína rtů a zubů" # todo: NEW TRANSLATION
 CHI_Lips_and_Teeth_Doctrine_desc: "Znovu potvrzujeme historické pouto se Severní Koreou. Obě země jsou jako vždy blízké jako rty a zuby. Přežití Pchjongjangu je naším strategickým imperativem a podle toho budeme jednat bez ohledu na mezinárodní tlak." # todo: NEW TRANSLATION
 CHI_Lithium_Triangle_Accord: "Dohoda o lithiovém trojúhelníku" # todo: NEW TRANSLATION
 CHI_Lithium_Triangle_Accord_desc: "Argentina, Bolívie a Chile společně vlastní více než polovinu světových vytěžitelných zásob lithia. Dlouhodobé odběrové dohody a majetkové podíly v těžebních podnicích poskytují čínským výrobcům baterií a elektromobilů spolehlivý přístup k surovině, která určuje další energetické paradigma. Dohody chrání čínské dodavatelské řetězce před západními nákupními koalicemi." # todo: NEW TRANSLATION
 CHI_Liu_Huaqing_Doctrine: "Doktrína Liou Chua-čchinga" # todo: NEW TRANSLATION
 CHI_Liu_Huaqing_Doctrine_desc: "Admirál Liou Chua-čching, architekt naší moderní námořní strategie, označil první a druhý ostrovní řetězec za strategický perimetr, v němž musí naše námořní síla nejprve nastolit nezpochybnitelnou převahu, než bude moci působit dále. Jihočínské moře leží celé uvnitř prvního řetězce. Nemůžeme promítat sílu navenek, dokud nebude plně zajištěno, a s jeho zajištěním nemůžeme donekonečna otálet." # todo: NEW TRANSLATION
 CHI_liu_huaqing_first_island_chain: "První ostrovní řetězec Liou Chua-čchinga" # todo: NEW TRANSLATION
 CHI_liu_huaqing_first_island_chain_desc: "Linie vede od Kuril přes Rjúkjú a Tchaj-wan až k Borneu a za ní se musí přilehlá moře stát našimi. Admirál Liou Chua-čching, otec moderní PLAN, učil, že námořnictvo schopné působit v pobřežních vodách musí nejprve ovládnout první ostrovní řetězec, než může snít o otevřeném oceánu. Jeho doktrína pobřežní obrany určuje náš kurz: zamezit přístupům, ovládnout přilehlá moře a teprve poté hledět dál." # todo: NEW TRANSLATION
 CHI_livestream_commerce: "Obchod prostřednictvím živého vysílání" # todo: NEW TRANSLATION
 CHI_livestream_commerce_desc: "Taobao Live spojuje zábavu s nákupem v reálném čase v měřítku, kterého žádný západní protějšek nedosáhl. Viya a Austin Li generují při jediném vysílání miliardové tržby; 40 procent našeho elektronického obchodu nyní probíhá prostřednictvím živých kanálů. Agentury MCN spravují tisíce tvůrců a regulátoři vynucují přísné dodržování daňových předpisů, aby se bohatství proudící těmito platformami dostávalo státu v odpovídajícím podílu. Tento formát definujeme my a svět jej sleduje." # todo: NEW TRANSLATION
 CHI_logistic_modernisation: "Modernizovat logistiku" # todo: NEW TRANSLATION
 CHI_logistic_modernisation_desc: "Reformy na frontě jsou k ničemu, pokud se přetrhne zásobovací ocas. Standardizujeme kontejnery, paletizujeme náklady a digitalizujeme dodavatelský řetězec pod novými Společnými silami logistické podpory, aby brigádu bylo možné zásobovat stejně rychle, jako může postupovat." # todo: NEW TRANSLATION
 CHI_long_march_modernisation: "Modernizace Dlouhého pochodu" # todo: NEW TRANSLATION
 CHI_long_march_modernisation_desc: "Rodina nosných raket Čchang-čeng, vyvinutá Čínskou akademií vesmírných technologií, tvoří páteř celého našeho vesmírného programu. Modernizace montážních linek a zlepšení práce s pohonnými látkami u variant CZ-2, CZ-3, CZ-5 a CZ-7 zvyšují frekvenci a spolehlivost startů, zatímco průřezový pokrok v konstrukci pohonů přímo posiluje naše raketové programy." # todo: NEW TRANSLATION
 CHI_long_range_firepower: "Palebná síla dlouhého dosahu" # todo: NEW TRANSLATION
 CHI_long_range_firepower_desc: "Dosah vítězí nad množstvím. Přesouváme rakety dlouhého dosahu a vyčkávací munici do těžkých brigád, aby mohly rozbít nepřítelovo zázemí, velitelská stanoviště a zálohy ještě předtím, než se tanky přiblíží ke kontaktu." # todo: NEW TRANSLATION
 CHI_loongson_riscv: "Architektura Loongson a RISC-V" # todo: NEW TRANSLATION
 CHI_loongson_riscv_desc: "Procesorová řada Loongson Institutu výpočetní techniky poskytuje domácí alternativu k x86 a ARM pro vládní servery a vestavěné systémy. Vedle Loongsonu přilákala otevřená instrukční sada RISC-V naše investice prostřednictvím organizace RISC-V International a domácích startupů včetně T-Head společnosti Alibaba, Nuclei System Technology a SiFive China. Otevřené licencování RISC-V chrání naše domácí návrhy před vystavením americkým exportním omezením v oblasti instrukčních sad a tato ochrana má každým rokem větší cenu." # todo: NEW TRANSLATION
 CHI_lunar_sample_return: "Návrat lunárních vzorků" # todo: NEW TRANSLATION
 CHI_lunar_sample_return_desc: "Čchang-e 5 v prosinci 2020 dopravila 1,73 kilogramu lunárního čediče z hory Mons Rümker, což byly první nové vzorky Měsíce dopravené na Zemi od sovětské mise Luna 24 v roce 1976. V červnu 2024 následovala Čchang-e 6, která získala materiál z pánve South Pole–Aitken na odvrácené straně, což bylo prvenství pro jakýkoli vesmírný program. Soustředíme zdroje na tuto robotickou vědeckou cestu, rozšíříme architekturu návratu vzorků na nová místa a urychlíme výzkum, který umožňuje." # todo: NEW TRANSLATION
 CHI_made_in_china_2025: "Made in China 2025" # todo: NEW TRANSLATION
 CHI_made_in_china_2025_desc: "Už nemůžeme zůstat továrnou světa. Deset prioritních odvětví je určeno k přeměně ve vedoucí high-tech sektory: robotika, letectví a kosmonautika, elektromobily, pokročilé zdravotnické přístroje, polovodiče a další. Našimi nástroji jsou státní dotace, programy získávání technologií a povinné cíle domácích nákupů. Washington a Brusel budou nespokojeny, ale tímto směrem musíme vytrvat." # todo: NEW TRANSLATION
 CHI_Maintain_Commitment_to_Denuclearization: "Zachovat závazek k denuklearizaci" # todo: NEW TRANSLATION
 CHI_Maintain_Commitment_to_Denuclearization_desc: "Náš cíl regionální stability nelze dosáhnout, pokud Severní Korea bude nadále porušovat mezinárodní právo a usilovat o svůj jaderný program." # todo: NEW TRANSLATION
 CHI_Maritime_Silk_Road_Indian_Ocean: "Strategie řetězce perel" # todo: NEW TRANSLATION
 CHI_Maritime_Silk_Road_Indian_Ocean_desc: "Řetězec investic do přístavů a logistických zařízení podél pobřeží Indického oceánu, včetně Hambantoty na Srí Lance a Doralehu v Džibutsku, rozšiřuje náš obchodní a potenciální námořní dosah od Jihočínského moře až k Africkému rohu. Kritici tento vzorec popisují jako řetězec perel obkličující Indii. Nemýlí se úplně — a právě v tom je smysl." # todo: NEW TRANSLATION
 CHI_mass_line_education: "Masová linie" # todo: NEW TRANSLATION
 CHI_mass_line_education_desc: "Kampaň stranické masové linie vyzývá funkcionáře, aby odmítli formalismus, byrokratismus, hédonismus a okázalost. Opulentní hostiny jsou zakázány; drahé hodinky jsou zabavovány těm, kdo se s nimi nechají veřejně fotografovat. Náš vztah k lidu musí být přetvořen ze vztahu nároku na vztah služby. Poselství je stejně politicky výhodné jako skutečně populární a neměli bychom je promarnit." # todo: NEW TRANSLATION
 CHI_mass_line_renewed: "Obnovená masová linie" # todo: NEW TRANSLATION
 CHI_mass_line_renewed_desc: "Masová linie Mao Ce-tunga vycházela z toho, že strana se musí od lidu nejprve učit, než jej může vést. Kádry a studenti jsou vysíláni do venkovských obcí a továren. Kampaně naslouchání nahrazují direktivy shora a nashromážděné zkušenosti mas se vracejí do stranické politiky. Revoluce není večírek." # todo: NEW TRANSLATION
 CHI_mature_node_counter_offensive: "Protiútok vyspělých výrobních uzlů" # todo: NEW TRANSLATION
 CHI_mature_node_counter_offensive_desc: "Poté, co západní exportní kontroly omezily naše rozšiřování pokročilých uzlů, přesměrováváme investice do kapacit na vyspělé uzly pod 28 nm. SMIC, Hua Hong, CXMT a desítky menších továren zahajují souběžné rozšiřování v Šanghaji, Šen-čenu a Chang-čou. Nyní představujeme více než 33 procent globálního přírůstku kapacit vyspělých uzlů. Západní vlády znepokojené možností čínské dominance v segmentu vyspělých uzlů pro automobilovou, průmyslovou a obrannou elektroniku diskutují o sekundárních clech. Než tato cla dorazí, musíme svou pozici upevnit." # todo: NEW TRANSLATION
 CHI_Media_Offensive: "Mediální ofenziva" # todo: NEW TRANSLATION
 CHI_Media_Offensive_desc: "Spusťte koordinovanou globální mediální kampaň prostřednictvím CGTN, agentury Sin-chua a platforem sociálních médií, která bude šířit čínské pohledy a čelit nepřátelským narativům." # todo: NEW TRANSLATION
 CHI_Mekong_Riparian_Cooperation: "Spolupráce Lancang-Mekong" # todo: NEW TRANSLATION
 CHI_Mekong_Riparian_Cooperation_desc: "Mechanismus spolupráce Lancang-Mekong organizuje společný rozvoj infrastruktury, správu vodních zdrojů a usnadňování obchodu mezi šesti státy, které sdílejí říční systém. Naše výstavba přehrad proti proudu a projekty na zlepšení plavby nám poskytují značnou páku vůči sousedům po proudu závislým na toku, který kontrolujeme. Tento rámec bychom měli formalizovat dříve, než bude tato páka označena za nátlak." # todo: NEW TRANSLATION
 CHI_memory_independence: "Nezávislost v oblasti paměťových čipů" # todo: NEW TRANSLATION
 CHI_memory_independence_desc: "YMTC se sídlem ve Wu-chanu a podporovaná Velkým fondem dosáhla výroby 3D NAND se 128 vrstvami a architektury Xtacking se 232 vrstvami, srovnatelné se Samsungem a Micronem ve stejné generaci. CXMT v Che-feji vyrábí DDR4 na 17 nm a vyvíjí výrobní postupy kompatibilní s DDR5. Krátká kvalifikace NAND společnosti YMTC u Applu ukázala, že naše paměti dosáhly komerční úrovně, než americký tlak vynutil jejich odstranění ze seznamu dodavatelů Applu. Linka HBM2 společnosti CXMT zahájila sériovou výrobu s předstihem, kvalifikovala se pro akcelerátory umělé inteligence Cambricon a Biren a ukončila závislost na zahraničních pamětech v našem dodavatelském řetězci vysoce výkonných počítačů." # todo: NEW TRANSLATION
 CHI_mengshi_program: "Program Mengshi" # todo: NEW TRANSLATION
 CHI_mengshi_program_desc: "Mengshi, čínské obrněné lehké vozidlo ve stylu Humvee, motorizuje lehkou pěchotu odolným vozidlem chráněným proti minám, na které lze namontovat kulomety, rakety nebo dálkově ovládanou zbraňovou stanici." # todo: NEW TRANSLATION
 CHI_Merge_with_CSTO: "Sloučit s CSTO" # todo: NEW TRANSLATION
 CHI_Merge_with_CSTO_desc: "Ruská bezpečnostní organizace CSTO má širokou škálu institucí vojenské spolupráce, které by bylo pro nás prospěšné přijmout." # todo: NEW TRANSLATION
 CHI_miit_licensing_framework: "Licencování MIIT a restrukturalizace operátorů" # todo: NEW TRANSLATION
 CHI_miit_licensing_framework_desc: "Ministerstvo průmyslu a informačních technologií musí formalizovat licenční rámec, který rozdělí náš bývalý monopol pošt a telekomunikací na samostatné komerční operátory. Pravidla přidělování frekvencí, ceny propojení a povinnost univerzální služby jsou kodifikovány, čímž vzniká regulační základ, na němž China Mobile, China Unicom a China Telecom vybudují největší sítě 4G a 5G na světě. Éra monopolu splnila svůj účel; konkurence poslouží další fázi." # todo: NEW TRANSLATION
 CHI_Militarize_Gwadar_Port: "Militarizovat přístav Gwadar" # todo: NEW TRANSLATION
 CHI_Militarize_Gwadar_Port_desc: "Naše investice do přístavu Gwadar se vyplatily a vzniklo impozantní komerční zařízení. Můžeme tuto úspěšnost využít tím, že port připravíme pro vojenské i komerční využití, což bezpochyby Indii znejistí, ale je to nezbytné pro naši bezpečnost." # todo: NEW TRANSLATION
 CHI_Military_Technology_Sharing: "Sdílení vojenských technologií" # todo: NEW TRANSLATION
 CHI_Military_Technology_Sharing_desc: "Pokročilá vojenská technologie Ruska bude pro naše členy v případě vnější agrese neocenitelným přínosem." # todo: NEW TRANSLATION
 CHI_military_training_outline: "Nová výcviková osnova" # todo: NEW TRANSLATION
 CHI_military_training_outline_desc: "V celé armádě je vydána nová osnova vojenského výcviku — soubor pravidel, který stanovuje standardy a úkoly každé jednotky. Poprvé je napsána kolem společných, síťově propojených operací a zavazuje celou armádu k jedinému náročnému měřítku připravenosti." # todo: NEW TRANSLATION
 CHI_mobile_payment_duopoly: "Duopol mobilních plateb" # todo: NEW TRANSLATION
 CHI_mobile_payment_duopoly_desc: "Alipay, spuštěný jako úschovná služba Alibaba, vyrostl v nezávislou platební platformu. WeChat Pay získal během pěti dnů 200 milionů uživatelů díky kampani s červenými obálkami při čínském Novém roce. QR kódy nyní nahrazují hotovost ve více než 90 procentech našich transakcí a vytlačily Visu, Mastercard i západní fintechové společnosti dříve, než si dokázaly vybudovat významnou pozici. Vybudovali jsme nejpokročilejší spotřebitelskou platební infrastrukturu na světě a funguje zcela mimo západní finanční architekturu." # todo: NEW TRANSLATION
 CHI_money_alliance: "Aliance peněz" # todo: NEW TRANSLATION
 CHI_money_alliance_desc: "Bohatství a velení splývají v jedinou frakci. Nejbohatší důstojníci a pašeráčtí magnáti, kteří je financují, se spojují — dost silní na to, aby chránili vlastní zájmy a diktovali podmínky straně, která jim formálně velí." # todo: NEW TRANSLATION
 CHI_Monroe_Doctrine_Inverted: "Obrácená Monroeova doktrína" # todo: NEW TRANSLATION
 CHI_Monroe_Doctrine_Inverted_desc: "Desetiletí trpělivých investic, diplomatického oslovování a infrastrukturních úvěrů nás přetvořila v nepostradatelného vnějšího partnera Latinské Ameriky — v roli, kterou Spojené státy kdysi považovaly za svou výhradní doménu. Schopnost Washingtonu mobilizovat hemisférické koalice proti nám se zmenšila natolik, že Monroeova doktrína se v praxi již nevynucuje. Amerika už není americkým jezerem. Musíme zajistit, aby se jím už nikdy nestala." # todo: NEW TRANSLATION
 CHI_national_overall_emergency_response_plan: "Celostátní plán reakce na mimořádné události" # todo: NEW TRANSLATION
 CHI_national_overall_emergency_response_plan_desc: "Krize SARS bolestně jasně odhalila mezery v naší národní připravenosti na mimořádné události. Musíme vytvořit jednotný rámec reakce pokrývající přírodní katastrofy, ohrožení veřejného zdraví, nehody a sociální nepokoje, s předem rozmístěnými zdroji, jasnými velitelskými strukturami a protokoly pro koordinaci mezi úřady na každé správní úrovni. Příští krize se sama neohlásí." # todo: NEW TRANSLATION
 CHI_naura_amec: "Programy vybavení NAURA a AMEC" # todo: NEW TRANSLATION
 CHI_naura_amec_desc: "NAURA Technology Group a Advanced Micro-Fabrication Equipment vyrábějí leptací zařízení a nástroje CVD a PVD pro naše domácí továrny. NAURA získala u SMIC kvalifikaci pro leptací zařízení 28 nm; leptací nástroje Primaxx společnosti AMEC vstoupily do velkosériových výrobních linek. Obě firmy těží ze stálé poptávky SMIC a kapitálových injekcí Velkého fondu. Jejich kombinované portfolio nástrojů nyní pokrývá přibližně 40 procent výrobních kroků potřebných pro továrnu logických čipů vyspělého uzlu. Na zbývajících 60 procentech se nyní musíme zaměřit." # todo: NEW TRANSLATION
 CHI_nco_corps_reform: "Profesionální sbor poddůstojníků" # todo: NEW TRANSLATION
 CHI_nco_corps_reform_desc: "Moderní armádu drží pohromadě její seržanti, nejen plukovníci. Budujeme skutečný sbor poddůstojníků — profesionálních vojáků s hodností, platem a autoritou — který nahrazuje starou závislost na krátkodobých brancích a uzavírá propast mezi důstojníkem a rekrutem." # todo: NEW TRANSLATION
 CHI_new_energy_vehicles_startups: "Průkopníci nových energetických vozidel" # todo: NEW TRANSLATION
 CHI_new_energy_vehicles_startups_desc: "NIO, XPeng, Li Auto, aliance HIMA společnosti Huawei a Xiaomi vstoupily do automobilového sektoru mezi lety 2014 a 2024 s podporou technologického kapitálu namísto státních podniků. Každý z nich přinesl do vozidel software éry chytrých telefonů, schopnosti umělé inteligence a rozpoznatelnost spotřebitelské značky. Sedan SU7 společnosti Xiaomi získal za 24 hodin 88 898 předobjednávek; SUV YU7 si první den zajistilo 240 000 závazných objednávek." # todo: NEW TRANSLATION
 CHI_New_World_Order: "Nový světový řád" # todo: NEW TRANSLATION
 CHI_New_World_Order_desc: "Naše informační převaha a dosah médií připravily půdu pro zásadní výzvu západem vedenému mezinárodnímu řádu. Nyní musíme využít naše sítě vlivu, státní média a skryté nástroje k prosazení multipolárního světa, v němž naše vlastní normy a modely správy určují globální agendu." # todo: NEW TRANSLATION
 CHI_norinco_rationalism: "Racionalizované NORINCO" # todo: NEW TRANSLATION
 CHI_norinco_rationalism_desc: "China North Industries, rozvětvený výrobce všeho od služebních pušek po dělostřelectvo, je zeštíhlen a zaměřen. Nadbytečné linky se uzavírají, ziskové se konsolidují a arzenál pozemních sil konečně promlouvá jediným průmyslovým hlasem." # todo: NEW TRANSLATION
 CHI_northeast_revitalization_plan: "Plán revitalizace severovýchodu" # todo: NEW TRANSLATION
 CHI_northeast_revitalization_plan_desc: "Provincie ocelového pásu Liao-ning, Ťi-lin a Chej-lung-ťiang po reformě státních podniků prudce upadly. Centrální vláda v roce 2003 zahajuje program revitalizace a směruje do regionu infrastrukturní investice, zvýhodněné úvěry a přesunuté průmyslové kapacity." # todo: NEW TRANSLATION
 CHI_northeast_russia_corridor: "Ekonomický koridor severovýchod–Rusko" # todo: NEW TRANSLATION
 CHI_northeast_russia_corridor_desc: "Přeshraniční obchodní infrastruktura spojující provincii Chej-lung-ťiang s ruským Dálným východem je modernizována, což umožňuje tok zdrojů, přeshraniční investice a společné rozvojové projekty. Koridor posiluje čínsko-ruské strategické partnerství konkrétním obchodním obsahem." # todo: NEW TRANSLATION
 CHI_open_the_august_1st_building: "Otevřít budovu 1. srpna" # todo: NEW TRANSLATION
 CHI_open_the_august_1st_building_desc: "Budova 1. srpna hostí Ústřední vojenskou komisi, jíž se Lidová osvobozenecká armáda zodpovídá straně a nikomu jinému. Povstání v Nan-čchangu z 1. srpna 1927 dalo straně její první pušky; toto datum stále pojmenovává samotnou armádu. Nyní začíná její přetvoření: korupce bude odstraněna nebo tolerována, divize přestavěny na brigády, letectvo spojeno s vesmírnými silami a pobřežní stráž přetvořena v oceánské námořnictvo." # todo: NEW TRANSLATION
 CHI_Operation_New_Dawn: "Operace Nový úsvit" # todo: NEW TRANSLATION
 CHI_Operation_New_Dawn_desc: "Okamžik nadešel. Důstojníci podporovaní Čínou uvnitř KLA zasahují proti areálu rodiny Kimů. To, co bude následovat, bude krátké, násilné a rozhodující. Severokorejský stát přežije; jeho vedení nikoli." # todo: NEW TRANSLATION
 CHI_Oppose_Strategic_Flexibility: "Odmítnout strategickou flexibilitu" # todo: NEW TRANSLATION
 CHI_Oppose_Strategic_Flexibility_desc: "Washingtonská doktrína „strategické flexibility“, která umožňuje americkým silám v Jižní Koreji nasazení mimo poloostrov, představuje nepřijatelné zasahování do našich bezpečnostních zájmů. Formálně požadujeme její zrušení." # todo: NEW TRANSLATION
 CHI_organisation_department_mandate: "Mandát organizačního oddělení" # todo: NEW TRANSLATION
 CHI_organisation_department_mandate_desc: "Organizační oddělení KS Číny řídí jmenování, hodnocení a přesuny více než 70 milionů stranických kádrů, což znamená, že ten, kdo ovládá toto oddělení, ovládá personální budoucnost strany. Pod vedením Zeng Čching-chunga oddělení zpřísnilo kontrolu nad jmenováním provinčních představitelů a přeorientovalo hodnoticí kritéria ve prospěch funkcionářů s dobrými výsledky průmyslového rozvoje." # todo: NEW TRANSLATION
 CHI_organisation_department_mandate_tt: "§Y$CHI_organisation_department_1$§! bude vždy aktivní, když je §YZeng Qinghong§! vůdcem země." # todo: NEW TRANSLATION
 CHI_original_innovation_problem: "Problém původních inovací" # todo: NEW TRANSLATION
 CHI_original_innovation_problem_desc: "Kopírování nás přivedlo na hranici možností; dál nás však nedostane. Nejtěžší reforma je kulturní a vyžaduje původní inovace, které byrokratická věda po dlouhou dobu dusila. Financujeme riziko, tolerujeme neúspěch a odměňujeme průlom, který nemůže poskytnout žádný zahraniční plán." # todo: NEW TRANSLATION
 CHI_Outsource_Cheap_Labor: "Outsourcing levné pracovní síly" # todo: NEW TRANSLATION
 CHI_Outsource_Cheap_Labor_desc: "Když Čína vyvíjela naši práci, naši pracovníci byli placeni minimálně a museli snášet obrovské obtíže. Ale jejich utrpení je to, co umožnilo naši zemi stát se ekonomicky úspěšnou. Země Afriky by měly následovat stejný model." # todo: NEW TRANSLATION
 CHI_own_designs: "Naše vlastní konstrukce" # todo: NEW TRANSLATION
 CHI_own_designs_desc: "Po celou generaci jsme zpětně analyzovali sovětské výkresy a nazývali to pokrokem. To už skončilo. Konstrukční kanceláře dostaly pokyn, aby místo napodobování samy navrhovaly a aby příští zbrani vtiskly čínskou pečeť namísto vypůjčené." # todo: NEW TRANSLATION
 CHI_Pacific_Island_Forum_Pivot: "Obrat k Fóru tichomořských ostrovů" # todo: NEW TRANSLATION
 CHI_Pacific_Island_Forum_Pivot_desc: "Musíme urychlit naši diplomatickou ofenzivu napříč tichomořskými ostrovními státy a nabídnout granty na infrastrukturu bez dluhové zátěže, rybářské dohody a balíčky diplomatického uznání. Samotné Fórum se stane spornou arénou, v níž budeme získávat rozhodující hlasy a podporované pozorovatele. Austrálie a Nový Zéland, které historicky dominovaly tichomořským institucionálním rámcům, budou na každém ministerském zasedání čelit výzvě svého vedení, dokud nepřiznají naše postavení." # todo: NEW TRANSLATION
 CHI_Pax_Sinica: "Pax Sinica" # todo: NEW TRANSLATION
 CHI_Pax_Sinica_desc: "Mezinárodní řád zaměřený na Čínu, v němž naše ekonomická váha, závislost na infrastruktuře a politické sladění nahradí liberální řád založený na pravidlech jako organizační princip světových záležitostí. Učenci jej pojmenovali Pax Sinica. My tomu jednoduše říkáme svět takový, jaký má být. Jeho dosažení by představovalo vyvrcholení našeho století obrody." # todo: NEW TRANSLATION
 CHI_Peaceful_Development: "Mírový rozvoj" # todo: NEW TRANSLATION
 CHI_Peaceful_Development_desc: "Činem ukažme, že vzestup Číny je silou globální stability. Investujme do udržování míru, pomoci při katastrofách a rozvojové pomoci, abychom si vybudovali pověst odpovědné mocnosti." # todo: NEW TRANSLATION
 CHI_pearl_river_delta_tech_cluster: "Elektronický klastr delty Perlové řeky" # todo: NEW TRANSLATION
 CHI_pearl_river_delta_tech_cluster_desc: "Delta Perlové řeky upevňuje svou pozici největší základny výroby elektroniky na světě. Šen-čen hostí Huawei a ZTE; Tung-kuan se plní tchajwanskými smluvními výrobci; celý region funguje jako jediný integrovaný dodavatelský řetězec globální spotřební elektroniky." # todo: NEW TRANSLATION
 CHI_Peninsula_Strategy: "Strategie poloostrova" # todo: NEW TRANSLATION
 CHI_Peninsula_Strategy_desc: "Na Korejském poloostrově stojíme na rozcestí. Desetiletí promyšlené nejednoznačnosti musí ustoupit záměrnému strategickému postoji. Svou cestu zvolíme pečlivě, protože víme, že každá možnost nese nevratné důsledky pro regionální řád." # todo: NEW TRANSLATION
 CHI_peoples_armed_police_integration: "Integrovat ozbrojenou policii" # todo: NEW TRANSLATION
 CHI_peoples_armed_police_integration_desc: "Lidová ozbrojená policie, čítající dva miliony mužů, je od roku 2018 pevně podřízena Ústřední vojenské komisi. Zajišťuje týl a hranice, takže polní armáda se může osvobodit pro boj směrem ven." # todo: NEW TRANSLATION
 CHI_Petrocaribe_Successor: "Nástupce Petrocaribe" # todo: NEW TRANSLATION
 CHI_Petrocaribe_Successor_desc: "Preferenční program Venezuely pro dodávky ropy karibským a středoamerickým státům se pod sankcemi a v důsledku špatného hospodaření zhroutil. Měli bychom zasáhnout jako stabilizující věřitel a poskytovat Caracasu, Havaně a Managui půjčky kryté ropou výměnou za dlouhodobé přísliby dodávek. Uspořádání prohloubí naše vazby na vlády již izolované od západních kapitálových trhů a jejich vděčnost bude trvalá." # todo: NEW TRANSLATION
 CHI_Petroyuan_Settlement: "Iniciativa petrojüanu" # todo: NEW TRANSLATION
 CHI_Petroyuan_Settlement_desc: "Musíme na Mezinárodní energetické burze spustit futures na surovou ropu denominované v jüanech a vytvořit mechanismus, díky němuž budou energetičtí vývozci Pásu a stezky vypořádávat smlouvy v renminbi namísto amerických dolarů. Trvalé přijetí oslabí dominanci petrodolaru a sníží naši expozici vůči americkým finančním sankcím. Každý barel oceněný v jüanech je krokem k mezinárodnímu finančnímu systému, kterému můžeme důvěřovat." # todo: NEW TRANSLATION
 CHI_pgz_gun_missile_hybrid: "Kombinovaná kanónová a raketová obrana" # todo: NEW TRANSLATION
 CHI_pgz_gun_missile_hybrid_desc: "Samohybný systém PGZ spojuje radarově naváděný automatický kanón s raketami krátkého dosahu na jediném podvozku a sestřeluje nízko letící letouny, vrtulníky a drony, které proniknou pod raketový deštník." # todo: NEW TRANSLATION
 CHI_phl_mlrs_modernisation: "Modernizace raketometů PHL" # todo: NEW TRANSLATION
 CHI_phl_mlrs_modernisation_desc: "PHL-03 a modulární PHL-16 poskytují armádě raketové dělostřelectvo dlouhého dosahu schopné zasahovat stovky kilometrů daleko. Stírají hranici mezi raketovou baterií a taktickou střelou a umožňují brigádě udeřit hluboko za frontou." # todo: NEW TRANSLATION
 CHI_pipechina_gas_reform: "Rozdělení PipeChina" # todo: NEW TRANSLATION
 CHI_pipechina_gas_reform_desc: "China Oil and Gas Piping Network Corporation získává od CNPC, Sinopecu a CNOOC potrubní aktiva, skladovací zařízení a terminály LNG v hodnotě přibližně 600 miliard jüanů. Model X+1+X staví mezi mnoho producentů proti proudu a mnoho distributorů po proudu jediného neutrálního provozovatele středního toku a otevírá infrastrukturu, kterou dříve výhradně ovládaly národní ropné společnosti. Přístup získávají ENN Energy, China Resources Gas, Beijing Enterprises i zahraniční dodavatelé LNG a trh distribuce plynu se poprvé stává skutečně konkurenčním." # todo: NEW TRANSLATION
 CHI_Piraeus_Model: "Model přístavu Pireus" # todo: NEW TRANSLATION
 CHI_Piraeus_Model_desc: "Akvizice většinového podílu společnosti COSCO v přístavu Pireus proměnila hlavní obchodní přístav Řecka v nejrušnější kontejnerový přístav Středomoří a ve vzor pro správu našich přístavů po celé Evropě. Model přináší hostitelským vládám měřitelné hospodářské výnosy a současně upevňuje naši provozní kontrolu nad strategickými úzkými místy. Menšinové podíly v Lisabonu a Hamburku udržují tyto metropole zapojené, aniž by vyvolaly regulační dohled, který by většinová akvizice přinesla." # todo: NEW TRANSLATION
 CHI_plz_howitzer_program: "Program houfnice PLZ" # todo: NEW TRANSLATION
 CHI_plz_howitzer_program_desc: "Dělostřelectvo, dlouho pýcha i úzké hrdlo armády, se plně přeorientuje na samohybné systémy. PLZ-05, pásová houfnice ráže 155 mm zavedená do služby v roce 2008, se vyrovná západnímu dostřelu i kadenci a tvoří dělostřeleckou linii každé těžké brigády." # todo: NEW TRANSLATION
 CHI_Polar_Silk_Road: "Polární hedvábná stezka" # todo: NEW TRANSLATION
 CHI_Polar_Silk_Road_desc: "Naše bílá kniha o arktické politice prohlašuje Čínu za „téměř arktický stát“ a podporuje rozvoj transpolárních námořních tras jako severního rozšíření Námořní hedvábné stezky. Tající mořský led činí Severní mořskou cestu komerčně životaschopnou a zkracuje dobu přepravy mezi námi a Evropou až o dva týdny. Měli bychom si zajistit místo v arktické správní architektuře, než ostatní zavřou dveře." # todo: NEW TRANSLATION
 CHI_policy_banks_cdb: "Politické banky" # todo: NEW TRANSLATION
 CHI_policy_banks_cdb_desc: "China Development Bank, Export-Import Bank of China a Agricultural Development Bank of China tvoří paralelní finanční architekturu fungující mimo běžná komerční omezení. CDB je nyní největší institucí rozvojového financování na světě, větší než Světová banka a Asijská rozvojová banka dohromady, a financuje přehradu Tři soutěsky, vysokorychlostní železnici a úvěry na infrastrukturu Pásu a stezky v hodnotě více než 600 miliard amerických dolarů ve více než 100 zemích. Tyto tři banky nejsou pouhými finančními institucemi; jsou nástroji národní strategie." # todo: NEW TRANSLATION
 CHI_politics_law_commision_realigned: "Přeorientovaná politicko-právní komise" # todo: NEW TRANSLATION
 CHI_politics_law_commision_realigned_desc: "Komise pro politické a právní záležitosti koordinuje bezpečnostní aparát, soudy a prokuraturu. Její pevné sladění s čchungčchingským modelem znamená vybudování sledovací infrastruktury, která dokáže identifikovat hrozby ještě před jejich vykrystalizováním a chránit revoluci před zahraničním rozvratem i vnitřní sabotáží." # todo: NEW TRANSLATION
 CHI_poly_goes_global: "Poly jde do světa" # todo: NEW TRANSLATION
 CHI_poly_goes_global_desc: "Poly Technologies přináší čínské pušky a rakety do Afriky, na Blízký východ a do Latinské Ameriky, zatímco Poly Culture mění výnosy v aukční domy a nemovitosti. Obchodní dům armády se stává globálním konglomerátem; jeho obchody jsou naší diplomacií a jeho zisky jsou mimo dosah jakéhokoli rozpočtu." # todo: NEW TRANSLATION
 CHI_Post_Armistice_Architecture: "Architektura po příměří" # todo: NEW TRANSLATION
 CHI_Post_Armistice_Architecture_desc: "Společně se Spojenými státy navrhujeme náhradu příměří z roku 1953: komplexní mírový rámec, který by formálně ukončil korejskou válku a zavedl regionální bezpečnostní záruky přijatelné pro všechny strany." # todo: NEW TRANSLATION
 CHI_Predatory_Lending_Doctrine: "Doktrína Hambantoty" # todo: NEW TRANSLATION
 CHI_Predatory_Lending_Doctrine_desc: "Když Srí Lanka nedokázala splácet půjčku na přístav Hambantota, podepsala 99letý pronájem, který převedl provozní kontrolu na jeden z našich státních podniků. Tento model bychom měli formalizovat: projekty strukturovat od počátku tak, aby se strategická aktiva stala zástavou, kterou lze při nesplácení převést na dlouhodobá přístupová práva. Dlužník si podmínky volí tím, že volí, zda splatí." # todo: NEW TRANSLATION
 CHI_private_oem_rise: "Vzestup soukromých výrobců OEM" # todo: NEW TRANSLATION
 CHI_private_oem_rise_desc: "Za partnery společných podniků byly určeny pouze čtyři velké státní podniky, provinční vlády však bez ohledu na to podporovaly vlastní výrobce. Chery Automobile ve Wu-chu, Geely v Če-ťiangu a Great Wall Motors v Pao-tingu si našly cesty k legální výrobě a vypracovaly se. Soukromí výrobci nyní vyrábějí třetinu našich osobních vozů a zaplňují segmenty SUV, levných vozů a elektromobilů, které se společné podniky rozhodly ignorovat. Udělali bychom dobře, kdybychom je podpořili." # todo: NEW TRANSLATION
 CHI_project_921: "Projekt 921" # todo: NEW TRANSLATION
 CHI_project_921_desc: "V září 1992 Ústřední vojenská komise schválila Projekt 921, hlavní plán čínské schopnosti pilotovaných kosmických letů. Rozhodnutí zřídilo úřad CASC pro pilotované lety, financovalo konstrukci kosmické lodi Šen-čou a zavázalo národ dosáhnout oběžné dráhy pod vlastními barvami." # todo: NEW TRANSLATION
 CHI_project_998: "Projekt 998" # todo: NEW TRANSLATION
 CHI_project_998_desc: "V letech 1995 a 1996 vpluly dvě americké svazové skupiny do Tchajwanské úžiny a naše námořnictvo se mohlo pouze dívat. Projekt 998 je odpovědí na toto ponížení: trvalé námořní budování zaměřené na den, kdy se letadlové lodě vrátí, a výměna pobřežních obranných sil za síly schopné soupeřit ve vodách u našeho vlastního pobřeží." # todo: NEW TRANSLATION
 CHI_Project_Coordination_Cell: "Koordinační skupina projektů Pásu a stezky" # todo: NEW TRANSLATION
 CHI_Project_Coordination_Cell_desc: "Naše koridory Pásu a stezky procházejí desítkami zemí a stovkami projektů; bez koordinačního orgánu se v nich budou hromadit zpoždění, duplicity a politická zranitelnost. Mezinárodní oddělení Ústředního výboru, Zhonglianbu, by mělo předsedat mezirezortní skupině, která bude prověřovat žádosti, přidělovat projektové manažery a sledovat harmonogramy realizace. Řád přináší výsledky. Výsledky udržují důvěru." # todo: NEW TRANSLATION
 CHI_project_jxx: "Projekt J-XX" # todo: NEW TRANSLATION
 CHI_project_jxx_desc: "Program zahájený koncem 90. let jako Projekt J-XX přinesl J-20 „Mocného draka“, který poprvé vzlétl v roce 2011 a do služby vstoupil v roce 2017. Je obtížně zjistitelný, má dlouhý dolet a silnou raketovou výzbroj; jde o první stíhačku páté generace mimo Ameriku a Rusko, postavenou k lovu tankerů a letounů včasné výstrahy, na nichž závisí každý válečný stroj v Tichomoří. Čína vstupuje do nejmenšího klubu na obloze." # todo: NEW TRANSLATION
 CHI_project_no_10: "Projekt číslo 10" # todo: NEW TRANSLATION
 CHI_project_no_10_desc: "J-10, zrozený z tajného Projektu 10, je první moderní domácí čínskou stíhačkou — jednomotorovým víceúčelovým proudovým letounem z Čcheng-tu, který za své uspořádání nevděčí žádnému sovětskému výkresu. Je to letoun, na němž se domácí průmysl stíhaček poprvé učí stát na vlastních nohou." # todo: NEW TRANSLATION
 CHI_property_tax_pilot_program: "Pilotní program daně z nemovitostí" # todo: NEW TRANSLATION
 CHI_property_tax_pilot_program_desc: "Šanghaj a Čchung-čching spustily první pilotní programy daně z nemovitostí a uvalují mírné sazby na druhé domy a primární rezidence s vysokou hodnotou. Cílem je omezit spekulativní nákupy a diverzifikovat příjmy místních vlád, aby nebyly závislé na prodeji pozemků. Pokud výsledky obstojí, měli bychom model rozšířit po celé zemi dříve, než se trh nemovitostí stane příliš velkým břemenem." # todo: NEW TRANSLATION
 CHI_provincial_reshuffle: "Personální přeskupení provinčního vedení" # todo: NEW TRANSLATION
 CHI_provincial_reshuffle_desc: "Zeng zorganizoval rozsáhlou personální rotaci ve Všečínském shromáždění lidových zástupců. Veteráni šanghajské frakce získávají klíčové pozice: Čchen Liang-jü jako tajemník strany v Šanghaji, Chuang Ťü povýšený do stálého výboru politbyra a Ťia Čching-lin přebírající předsednictví ČLPPS. Přeskupení upevňuje vliv knížat nad nejbohatšími provinciemi a státním poradním aparátem." # todo: NEW TRANSLATION
 CHI_provincial_youth_league_cohort: "Povýšit provinční skupinu Svazu mládeže" # todo: NEW TRANSLATION
 CHI_provincial_youth_league_cohort_desc: "Li Kche-čchiang v Che-nanu. Wang Jang v Čchung-čchingu. Liou Jen-tung stoupá. Lavice Tuan-pai je hluboká a trpělivá — nechme ji postoupit." # todo: NEW TRANSLATION
 CHI_public_health_reconstruction: "Nový venkovský kooperativní zdravotní systém" # todo: NEW TRANSLATION
 CHI_public_health_reconstruction_desc: "Nový venkovský kooperativní zdravotní systém sdružuje příspěvky venkovských obyvatel, místních samospráv a centrálního rozpočtu na pokrytí katastrofických zdravotních nákladů. Jde o první systematický program venkovského zdravotního pojištění v dějinách naší republiky a měli bychom jej co nejrychleji rozšířit téměř na celé obyvatelstvo. Osm set milionů zemědělců by nemělo čelit finančnímu krachu jen proto, že onemocněli." # todo: NEW TRANSLATION
 CHI_public_rental_housing_drive: "Program veřejného nájemního bydlení" # todo: NEW TRANSLATION
 CHI_public_rental_housing_drive_desc: "Miliony městských migrujících pracovníků a absolventů vysokých škol žijí v provizorním ubytování vydaném napospas soukromým pronajímatelům. Stát zmobilizuje stavební zdroje k vybudování dostupných veřejných nájemních bytů ve velkých městech, s dotovaným nájemným a možností odkupu po třech letech nájmu." # todo: NEW TRANSLATION
 CHI_pudong_financial_hub: "Finanční centrum Pudong" # todo: NEW TRANSLATION
 CHI_pudong_financial_hub_desc: "Nová oblast Pudong v Šanghaji je rozvíjena jako hlavní čínské offshore finanční centrum. Výstavba panoramatu Lu-ťia-cuej, Šanghajské burzy a celních obchodních zón signalizuje čínskou ambici konkurovat Hongkongu a Singapuru jako regionálním finančním centrům." # todo: NEW TRANSLATION
 CHI_Puppet_Nepal: "Loutkový Nepal" # todo: NEW TRANSLATION
 CHI_Puppet_Nepal_desc: "Některé politické síly v Nepálu jsou ochotny výrazně posílit vazby své země k Číně na úkor partnerství s Indií. To by významně napomohlo našim zahraničněpolitickým cílům. Zvyšování našeho vlivu v zemi a zajištění přátelské vlády nám umožní tuto změnu provést mírumilovně." # todo: NEW TRANSLATION
 CHI_qbz191_rifle: "Puška QBZ-191" # todo: NEW TRANSLATION
 CHI_qbz191_rifle_desc: "Stárnoucí bullpup QBZ-95 ustupuje pušce QBZ-191 s konvenčním uspořádáním a optikou na liště, zavedené od roku 2019. Moderní zbraň pro pěšáka, od nějž se nyní očekává, že bude bojovat síťově, nikoli sám." # todo: NEW TRANSLATION
 CHI_qinghai_tibet_railway_planning: "Železnice Čching-chaj–Tibet" # todo: NEW TRANSLATION
 CHI_qinghai_tibet_railway_planning_desc: "Železnice Čching-chaj–Tibet povede 1 956 kilometrů v průměrné nadmořské výšce 4 500 metrů přes průsmyk Tchang-kula. Po dokončení půjde o nejvýše položenou železnici na světě a naše první přímé železniční spojení s Lhasou, které ekonomicky a logisticky propojí Tibet se zbytkem země způsobem, jakého by žádná silnice ani letiště nedosáhly." # todo: NEW TRANSLATION
 CHI_quiet_succession_engineering: "Zinscenovat nástupnictví" # todo: NEW TRANSLATION
 CHI_quiet_succession_engineering_desc: "Autorita Zeng Čching-chunga nad organizačním oddělením mu dává rozhodující vliv nad právě se otevírajícím bojem o nástupnictví. Měl by jej naklonit ve prospěch Si Ťin-pchinga na úkor Li Kche-čchianga podporovaného Svazem mládeže. Křeslo v politbyru by fakticky potvrdilo Si Ťin-pchinga jako příštího generálního tajemníka a my bychom utvářeli příští desetiletí vedení strany ještě před veřejným rozhodnutím." # todo: NEW TRANSLATION
 CHI_ranks_for_sale: "Hodnosti na prodej" # todo: NEW TRANSLATION
 CHI_ranks_for_sale_desc: "Povýšení se mění v ceník. Stejně jako Sü Cchaj-chou od roku 1999 se každá hvězda prodává nejvyšší nabídce a peníze se doručují v krabicích označených jménem kupce. Když byl jeho pekingský dům konečně prohledán, vyšetřovatelé odnesli více než tunu hotovosti. Důstojnický sbor, který si koupil hodnosti, bude bojovat za svou investici, nikoli za svou zemi." # todo: NEW TRANSLATION
 CHI_rapid_reaction_corps: "Sbor rychlé reakce" # todo: NEW TRANSLATION
 CHI_rapid_reaction_corps_desc: "Elitní výsadkové a letecko-útočné formace jsou udržovány v trvalé pohotovosti a během hodin mohou být nasazeny po celé Číně i za jejími hranicemi. Mění regionální krizi v hotovou věc dříve, než soupeři stačí shromáždit odpověď." # todo: NEW TRANSLATION
 CHI_rare_earth_dominance: "Strategie rozvoje vzácných zemin" # todo: NEW TRANSLATION
 CHI_rare_earth_dominance_desc: "Čína kontroluje přibližně 85 procent světové produkce vzácných zemin soustředěné ve Vnitřním Mongolsku a Ťiang-si. Státem řízený konsolidační program omezuje nelegální těžbu, zvyšuje standardy zpracování a staví Čínu do pozice nepostradatelného dodavatele pro globální pokročilou výrobu." # todo: NEW TRANSLATION
 CHI_rare_earth_leverage: "Páka vzácných zemin" # todo: NEW TRANSLATION
 CHI_rare_earth_leverage_desc: "Rafinujeme vzácné zeminy, bez nichž se světové zbraně neobejdou — téměř devadesát procent globálních dodávek, magnety uvnitř každé naváděné rakety a neviditelné stíhačky. To, co bývalo vývozem, se stává pákou: přiškrtíme-li dodávky, arzenál soupeře se zastaví, zatímco náš běží dál." # todo: NEW TRANSLATION
 CHI_Reclaim_The_Heavenly_Waters: "Znovu získat Nebeské vody" # todo: NEW TRANSLATION
 CHI_Reclaim_The_Heavenly_Waters_desc: "Tchien-šuej, Nebeské vody, je archaické básnické označení moří obklopujících Říši středu. Název dodává atmosféru; čin je moderní a námořní. Povrchové skupiny PLAN začínají stupňovat průniky do sporných vod Spratlyho ostrovů, vyzývají pobřežní stráže nárokujících si států, narušují zásobovací operace a staví každou vládu před ultimátum: přijmout čínskou správní autoritu nad napadenými útvary, nebo čelit další výpravě. Počítadlo střetů se posune pouze po dosažení rozhodujícího taktického výsledku; nerozhodná střetnutí a neúspěchy eskalační žebříček zpomalí." # todo: NEW TRANSLATION
 CHI_reconstruction_development: "Kapacita obnovy" # todo: NEW TRANSLATION
 CHI_reconstruction_development_desc: "Roky infrastrukturních investic a nahromaděná kapacita stavebního sektoru nám poskytly mimořádnou schopnost rychle obnovovat po přírodních katastrofách a průmyslových haváriích. Tuto schopnost podpírají standardizované protokoly reakce na katastrofy, předem rozmístěné zásoby vybavení a specializované ženijní jednotky armády. Musíme investovat do jejího zachování, protože příští zemětřesení ani povodeň nepočkají na naši připravenost." # todo: NEW TRANSLATION
 CHI_red_arrow_program: "Program Rudého šípu" # todo: NEW TRANSLATION
 CHI_red_arrow_program_desc: "Proti obrněncům odpovídá rodina protitankových raket Rudý šíp — HJ-8 a HJ-9, které vyzbrojují vše od pěchotních stativů po vozidla a vrtulníky. Jsou levné, početné a neustále zdokonalované; každé formaci dávají dosah schopný ničit tanky." # todo: NEW TRANSLATION
 CHI_Renminbi_Internationalization: "Jüan jako rezervní měna" # todo: NEW TRANSLATION
 CHI_Renminbi_Internationalization_desc: "Spustili jsme Přeshraniční mezibankovní platební systém pro zúčtování transakcí v renminbi mimo síť SWIFT a Mezinárodní měnový fond přijal jüan do koše zvláštních práv čerpání. Zúčtování obchodu v rámci Pásu a stezky v renminbi postupně zvyšuje váhu naší měny ve světových rezervách. Nyní musíme tyto mechanismy prohloubit, dokud se renminbi nestane skutečnou alternativou k dolaru pro partnery, kteří si cení své nezávislosti." # todo: NEW TRANSLATION
 CHI_Respect_Nepalese_Neutrality: "Respektujte nepálskou neutralitu" # todo: NEW TRANSLATION
 CHI_Respect_Nepalese_Neutrality_desc: "Nepál usiluje o to, aby zůstal neutrálním polštářem mezi námi a Indií. Měli bychom respektovat jejich rozhodnutí a vyvarovat se jakýchkoli činů, které by tuto neutralitu podrývaly." # todo: NEW TRANSLATION
 CHI_Responsible_Stakeholder: "Odpovědný aktér" # todo: NEW TRANSLATION
 CHI_Responsible_Stakeholder_desc: "Měli bychom přijmout výzvu mezinárodního společenství a stát se konstruktivním účastníkem globálních institucí. Prohloubením obchodních vazeb a snížením třenic v multilaterálních fórech se stavíme do pozice nepostradatelného partnera namísto revizionistického vyzyvatele. Na označení záleží, i když se strategie za ním nemění." # todo: NEW TRANSLATION
 CHI_rmb_internationalisation: "Internacionalizace renminbi" # todo: NEW TRANSLATION
 CHI_rmb_internationalisation_desc: "Byl spuštěn pilotní program zúčtování obchodu v RMB a dohody o měnových swapech jsou nyní podepsány s více než 40 centrálními bankami. MMF přijal jüan do koše zvláštních práv čerpání, což je uznání, které již nelze vzít zpět. Přeshraniční mezibankovní platební systém poskytuje alternativu k SWIFT denominovanou v renminbi a dosahuje více než 1 500 členských institucí. Po vyloučení Ruska ze SWIFT přechází přibližně 90 procent rusko-čínského obchodu na CIPS a jüan-rublové páry; Saúdská Arábie, Spojené arabské emiráty a Brazílie začínají přijímat jüany za komoditní smlouvy. Dolarový systém se nehroutí, ale už není bez vyzyvatele." # todo: NEW TRANSLATION
 CHI_Rome_Memorandum: "Římské memorandum o Pásu a stezce" # todo: NEW TRANSLATION
 CHI_Rome_Memorandum_desc: "Podpis Itálie pod memorandem o porozumění k Pásu a stezce byl prvním podpisem člena G7 a rozštěpil západní konsenzus o omezování naší infrastrukturní diplomacie v Evropě. Dohoda zahrnuje spolupráci v oblasti přístavů, železnic a digitální infrastruktury, přičemž Terst a Janov jsou určeny jako severoadriatické a ligurské terminály pro náš náklad. Brusel a Washington budou na Řím tlačit, aby odstoupil, ale obchodní přitažlivost našich investic by při dobrém řízení vztahu měla být politicky trvalá." # todo: NEW TRANSLATION
 CHI_sasac: "Předat podniky SASAC" # todo: NEW TRANSLATION
 CHI_sasac_desc: "Podniky odebrané armádě nezmizí; přecházejí pod Komisi pro dohled a správu státních aktiv, založenou v roce 2003 k držení velitelských výšin hospodářství. Vojenský zisk se mění v civilní dividendu, účtovanou v Pekingu namísto kasáren." # todo: NEW TRANSLATION
 CHI_sasac_founding: "Komise pro dohled nad státními aktivy" # todo: NEW TRANSLATION
 CHI_sasac_founding_desc: "Náš sektor státních podniků dlouho trpěl roztříštěným ministerským dohledem bez ucelené vlastnické strategie. Musíme zřídit specializovanou dozorčí komisi, která upevní kontrolu nad centrálně řízenými podniky, zavede výkonnostní smlouvy pro vedení, vyžádá si odvody dividend a prověří zásadní investiční rozhodnutí. Stát musí jednat jako akcionář, nikoli pouze jako regulátor." # todo: NEW TRANSLATION
 CHI_saturn_engine_crisis: "Krize motorů Saturn" # todo: NEW TRANSLATION
 CHI_saturn_engine_crisis_desc: "Čína dokáže postavit drak letounu, ale ne srdce uvnitř. Naše nejlepší stíhačky stále létají na ruských motorech Saturn AL-31 a každé embargo či zvýšení cen z Moskvy hrozí uzemněním flotily. WS-10 Taihang musí začít fungovat, ať to stojí cokoli, jinak je naše nezávislost jen nátěrem přes dovezené turbíny." # todo: NEW TRANSLATION
 CHI_scientific_development_outlook_foreshadowed: "Předznamenat Vědecký pohled na rozvoj" # todo: NEW TRANSLATION
 CHI_scientific_development_outlook_foreshadowed_desc: "Přenechte viceprezidentovi ideologický prostor. Lidé Chu Ťin-tchaa získají doktrinální otevření — udržitelnost, vyvážení venkova a přístup zaměřený na člověka." # todo: NEW TRANSLATION
 CHI_scientific_outlook_on_development: "Vědecký pohled na rozvoj" # todo: NEW TRANSLATION
 CHI_scientific_outlook_on_development_desc: "Vládní filozofie Chu Ťin-tchaa požaduje rozvoj zaměřený na člověka, komplexní, vyvážený a udržitelný. Její přijetí jako stranické doktríny přeorientuje politiku od růstu založeného především na HDP k širším sociálním a environmentálním ukazatelům. Otázkou je, zda lze provinční úředníky, kteří deset let optimalizovali výstupní cíle, přesvědčit, aby optimalizovali něco hůře měřitelného." # todo: NEW TRANSLATION
 CHI_scientific_outlook_on_development_tt: "§RProtože jsme přišli o $CHI_scientific_outlook_idea_1$, získáváme:§!" # todo: NEW TRANSLATION
 CHI_SCO_Exclusive_Core: "Výhradní jádro ŠOS" # todo: NEW TRANSLATION
 CHI_SCO_Exclusive_Core_desc: "Namísto rozmělňování ŠOS rychlou expanzí bychom měli prohloubit integraci mezi stávajícími členy. Silnější vazby mezi menší skupinou odhodlaných národů přinesou větší strategické výnosy." # todo: NEW TRANSLATION
 CHI_SCO_Exclusive_Core_tt: "§GPosiluje§! spolupráci členů a §Rblokuje§! nové žádosti partnerů pro dialog. Stávající členové získají trvalé bonusy k názoru." # todo: NEW TRANSLATION
 CHI_SCO_Plus_Expansion: "Rozšíření ŠOS+" # todo: NEW TRANSLATION
 CHI_SCO_Plus_Expansion_desc: "Síla ŠOS spočívá v její šíři. Snížením vstupních překážek a aktivním získáváním nových partnerů pro dialog můžeme rozšířit dosah organizace napříč Asií, Blízkým východem i dále." # todo: NEW TRANSLATION
 CHI_sea_eagles_carrier_wing: "Palubní letecké křídlo" # todo: NEW TRANSLATION
 CHI_sea_eagles_carrier_wing_desc: "Několik stíhaček není letecké křídlo. Doplníme palubu letadlové lodi vrtulníky včasné výstrahy, protiponorkového boje a elektronického boje a spojíme letouny do jediného integrovaného křídla, které dokáže společně průzkumem, zajištěním i úderem působit jako celek." # todo: NEW TRANSLATION
 CHI_sea_eagles_of_the_liaoning: "Mořští orli Liaoningu" # todo: NEW TRANSLATION
 CHI_sea_eagles_of_the_liaoning_desc: "Paluba Liaoningu získává své drápy. J-15 „Létající žralok“, těžká palubní stíhačka odvozená od Su-33, je vyzbrojena a připravena jako úderný letoun; doktrína úderů z letadlových lodí, tedy promítání letecké síly z pohybující se čínské paluby, je poprvé sepsána." # todo: NEW TRANSLATION
 CHI_second_gen_platforms: "Druhá generace platforem" # todo: NEW TRANSLATION
 CHI_second_gen_platforms_desc: "ByteDance spouští domácí Douyin a mezinárodní TikTok a oslovuje publikum, na které generace BAT nikdy necílila. Pinduoduo narušuje elektronický obchod skupinovými nákupy, které zasahují spotřebitele ve městech čtvrté úrovně a na venkovských trzích; Meituan vede v objednávkových službách. Didi pohlcuje Uber China. Druhá vlna platforem prohlubuje naši digitální ekonomiku do segmentů, které první generace považovala za příliš roztříštěné nebo málo prestižní." # todo: NEW TRANSLATION
 CHI_Second_Island_Chain_Reach: "Dosah druhého ostrovního řetězce" # todo: NEW TRANSLATION
 CHI_Second_Island_Chain_Reach_desc: "Přístupová práva námořnictva PLA napříč melanézským a polynéským Tichomořím přivádějí naše předsunuté základny do úderné vzdálenosti od Guamu, Havaje a námořních tras spojujících Spojené státy s jejich východoasijskými spojenci. Tento dosah narušuje strategickou logiku druhého ostrovního řetězce, o kterou se američtí plánovači opírali od studené války. Austrálie ztrácí geografickou ochranu, kterou vždy považovala za samozřejmost. Měli bychom jednat dříve, než si uvědomí, že zmizela." # todo: NEW TRANSLATION
 CHI_Secure_The_Heavenly_Waters: "Zajistit Nebeské vody" # todo: NEW TRANSLATION
 CHI_Secure_The_Heavenly_Waters_desc: "Tchien-šuej, Nebeské vody, je archaický výraz pro moře obklopující doménu Říše středu. Ti, kteří odmítli přijmout řád, jsou nyní přivedeni k poslušnosti silou zbraní. Jižní moře je navráceno pod právoplatnou správu naší autority." # todo: NEW TRANSLATION
 CHI_seed_security_campaign: "Kampaň za bezpečnost osiv" # todo: NEW TRANSLATION
 CHI_seed_security_campaign_desc: "Válka o sóju jasně odhalila naši zranitelnost: obchodníci s obilím ABCD získali 70 procent našich kapacit na drcení sóji poté, co domácí zpracovatelé zkrachovali kvůli spekulativním futures pozicím. Nesmíme dopustit, aby se tato expozice opakovala. San-ja na ostrově Chaj-nan slouží jako naše šlechtitelská základna Nanfan, kde tropické zimy umožňují tři generace šlechtění ročně. Akvizice společnosti Syngenta firmou ChemChina dostává globální sbírky zárodečného materiálu pod státní vliv, zatímco Longping Hi-Tech a obilná agentura Beidahuang jsou určeny za národní šampiony suverenity v oblasti osiv." # todo: NEW TRANSLATION
 CHI_selective_anti_corruption: "Selektivní protikorupční kampaň" # todo: NEW TRANSLATION
 CHI_selective_anti_corruption_desc: "Protikorupční vyšetřování v polovině 2000. let byla vysoce selektivní. Případy se vedly proti funkcionářům, kteří si vybudovali nezávislé mocenské základny nebo překročili frakční hranice, zatímco spojenci a patroni byli před kontrolou chráněni. Politický rozměr těchto stíhání podkopal jejich legitimitu a vyvolal frakční odpor uvnitř strany." # todo: NEW TRANSLATION
 CHI_Seoul_Under_Our_Umbrella: "Soul pod naším deštníkem" # todo: NEW TRANSLATION
 CHI_Seoul_Under_Our_Umbrella_desc: "S Jižní Koreou formalizujeme rámec strategického partnerství. Naše bezpečnostní záruky nahrazují americké spojenectví, vyjednává se přístup PLAN na ostrov Čedžu a americké síly zahajují dlouho očekávané stažení z poloostrova." # todo: NEW TRANSLATION
 CHI_service_of_the_three_distances: "Služba tří vzdáleností" # todo: NEW TRANSLATION
 CHI_service_of_the_three_distances_desc: "Námořnictvo nově definuje, jak daleko musí dosáhnout. Kromě obrany přilehlých moří v prvním řetězci Liou Chua-čchinga nyní cvičí pro vzdálená moře i otevřený oceán — pro tři vzdálenosti, v nichž musí být globální flotila připravena bojovat. Doktrína se rozhodně přesouvá od obrany pobřeží k operacím napříč světovými oceány." # todo: NEW TRANSLATION
 CHI_seventeen_plus_one_mechanism: "Rámec spolupráce 16+1" # todo: NEW TRANSLATION
 CHI_seventeen_plus_one_mechanism_desc: "Platforma 17+1 pro spolupráci Číny se střední a východní Evropou směruje naše investice do infrastruktury Evropské unie a kandidátských států a vyvolává v Bruselu obavy z odklonu členských států a obcházení regulací. Brusel má důvod k obavám. Tyto vztahy bychom měli prohlubovat právě proto, že rozmělňují jednotnou evropskou frontu, která omezuje náš přístup na trh." # todo: NEW TRANSLATION
 CHI_shadow_banking_cleanup: "Očištění stínového bankovnictví a finančních rizik" # todo: NEW TRANSLATION
 CHI_shadow_banking_cleanup_desc: "Stimulační příliv z let 2008 a 2009 zanechal produkty správy majetku a svěřenské společnosti, které hromadily neprůhledná rizika v nemovitostech a nástrojích financování místních vlád. Nová pravidla správy aktiv vyžadují oceňování produktů správy majetku podle čisté hodnoty aktiv a odstraňují implicitní záruky. Po 300 miliardách amerických dolarů bezohledných zahraničních akvizic je pojišťovna Anbang zabavena státem. Skupina HNA se hroutí pod vlastními dluhy. Očištění soustřeďuje dohled nad riziky do reformované CBIRC a stabilizuje mezibankovní trh. Disciplína není trest; je cenou za systém, kterému můžeme důvěřovat." # todo: NEW TRANSLATION
 CHI_shandong_at_sanya: "Šan-tung v San-ji" # todo: NEW TRANSLATION
 CHI_shandong_at_sanya_desc: "Druhá letadlová loď je zcela naše. Typ 002 Šan-tung, první letadlová loď navržená a postavená v Číně, byla spuštěna na vodu v roce 2017 a uvedena do služby v roce 2019; domovským přístavem se jí stala San-ja na Chaj-nanu vedle ponorkových jeskyní v Jü-linu. Z jihu sleduje námořní trasy a sporné ostrovy, které Čína hodlá udržet." # todo: NEW TRANSLATION
 CHI_shantytown_renovation: "Program obnovy chudinských čtvrtí" # todo: NEW TRANSLATION
 CHI_shantytown_renovation_desc: "Celostátní program obnovy chudinských čtvrtí bourá zchátralá dělnická obydlí ve starých uhelných a těžebních provinciích a nahrazuje je moderními obytnými a průmyslovými čtvrtěmi. Šan-si a Che-nan, zatížené stárnoucí infrastrukturou těžkého průmyslu, získávají největší příděly. Centrální výdaje na program dosahují 1,54 bilionu jüanů, vytvářejí vlnu stavebních zakázek a otevírají nové průmyslové zóny ve vnitrozemí, kde dříve žádné nebyly." # todo: NEW TRANSLATION
 CHI_shenyang_j35_gyrfalcon: "J-35 Modrý žralok" # todo: NEW TRANSLATION
 CHI_shenyang_j35_gyrfalcon_desc: "K první stealth stíhačce se přidává druhá. Šenjangský J-35, vyvinutý z demonstrátoru FC-31, je dvoumotorový proudový letoun páté generace určený pro pozemní základny i paluby letadlových lodí. Číně poskytuje dvojici stealth strojů vyšší a nižší kategorie v podobě J-20 a J-35, kterou jinak dokážou nasadit pouze Spojené státy." # todo: NEW TRANSLATION
 CHI_shenzhou_program: "Program Šen-čou" # todo: NEW TRANSLATION
 CHI_shenzhou_program_desc: "Dne 15. října 2003 odstartoval Jang Li-wej na palubě Šen-čou 5 z kosmodromu Ťiou-čchüan a stal se prvním čínským astronautem. Mise trvající čtrnáct oběhů a jednadvacet hodin učinila z Číny třetí zemi, která samostatně vyslala člověka do vesmíru, a zahájila pilotovaný kosmický program, jenž později zahrnul výstupy do volného prostoru, orbitální setkání a dlouhodobé mise na stanici." # todo: NEW TRANSLATION
 CHI_sicarrier_euv: "Program SiCarrier EUV" # todo: NEW TRANSLATION
 CHI_sicarrier_euv_desc: "Společnost SiCarrier Technology, založená s přímou státní podporou, má za úkol uzavřít mezeru v oblasti EUV. Program čerpá z domácích schopností optického návrhu vyvinutých v Čchangčchunském institutu optiky a ze zkušeností s výrobou zrcadel společnosti CNNC. Funkční demonstrátor EUV vyžaduje domácí výrobu světelných zdrojů 13,5 nm, vícevrstvé reflexní optiky a waferových stolů s přesností pod nanometr. Jde o náš nejambicióznější pokus dosáhnout úplné suverenity v oblasti polovodičového vybavení. Funkční domácí nástroj EUV znamená, že dokážeme vyrábět pokročilé čipy od začátku do konce bez jediné zahraniční licence na vybavení a prolomit západní režim exportních kontrol u jeho základů." # todo: NEW TRANSLATION
 CHI_Silk_Road_Fund: "Fond hedvábné stezky" # todo: NEW TRANSLATION
 CHI_Silk_Road_Fund_desc: "Fond hedvábné stezky, kapitalizovaný 40 miliardami dolarů z našich devizových rezerv a suverénních fondů, poskytuje kapitálové financování projektům Pásu a stezky, které komerční banky a multilaterální věřitelé sami nepodpoří. Je nástrojem, díky němuž můžeme říci ano projektům, které by jinak uvízly kvůli nedostatku prvního odvážného investora ochotného podstoupit riziko." # todo: NEW TRANSLATION
 CHI_Sino_Indian_Treaty_of_Friendship: "Čínsko-indická smlouva o přátelství" # todo: NEW TRANSLATION
 CHI_Sino_Indian_Treaty_of_Friendship_desc: "Naše partnerství s Pákistánem nebylo pochopitelně jediným zdrojem třenic mezi námi a indickými protějšky. Budeme muset řešit teritoriální spory, které naše země vlastní, abychom mohli zahájit nový vztah s Indií." # todo: NEW TRANSLATION
 CHI_sinograin_strategic_reserve: "Sinograin" # todo: NEW TRANSLATION
 CHI_sinograin_strategic_reserve_desc: "China Grain Reserves Corporation přebírá roli císařských sýpek dynastií Suej a Tchang a opírá se o Pej-ta-chuang v Chej-lung-ťiangu, jehož černozemní farmy produkují více obilí než kterákoli jiná provincie. Sinograin provádí politiku minimální výkupní ceny obilí a nakupuje jménem státu, když trhy klesají. Od té doby se k obilným zásobám přidala strategická zásoba vepřového, jediná svého druhu na světě, a s tímto systémem bychom měli nakládat jako se strategickým aktivem, kterým je." # todo: NEW TRANSLATION
 CHI_smee_lithography: "Rozvoj litografie SMEE" # todo: NEW TRANSLATION
 CHI_smee_lithography_desc: "Shanghai Micro Electronics Equipment Group je náš jediný výrobce litografických zařízení a vyrábí expozicní nástroje 90 nm a 110 nm pro pouzdření a zadní výrobní procesy. Státní financování urychluje vývoj imerzního skeneru DUV 28 nm, jehož kvalifikační postup je nyní hlášen v domácích továrnách. SMEE zůstává o generaci za nejvýkonnějšími nástroji ASML, domácí výroba DUV však odstraňuje naši závislost při rozšiřování kapacit vyspělých uzlů a poskytuje základ pro vývoj pokročilé litografie. Mezera je skutečná; směr je správný." # todo: NEW TRANSLATION
 CHI_smic_advanced_node: "Tlak SMIC na pokročilé uzly" # todo: NEW TRANSLATION
 CHI_smic_advanced_node_desc: "Po zařazení na americký seznam subjektů SMIC urychlila svou domácí vývojovou cestu. Naši inženýři upravili stávající nástroje DUV tak, aby pomocí vícenásobného vzorování dosáhli hustoty odpovídající 7 nm — výsledek potvrdil, že kreativní procesní inženýrství může částečně nahradit přístup k EUV. Úspěch získal čas pro domácí vývoj vybavení a přetvořil technologickou mezeru v řešitelný inženýrský problém. Uvedení Mate 60 Pro odhalilo tuto výrobní schopnost světu a vyvolalo novou vlnu amerických přezkumů exportních kontrol; tato reakce nám říká, že děláme správné věci." # todo: NEW TRANSLATION
 CHI_smic_zhangjiang: "Rozšíření SMIC v Čang-ťiangu" # todo: NEW TRANSLATION
 CHI_smic_zhangjiang_desc: "Semiconductor Manufacturing International Corporation vybudovala svůj hlavní závod o průměru waferů 300 mm v high-tech parku Čang-ťiang a státní investice do postupného rozšiřování kapacit umožnily SMIC dosáhnout výroby 28 nm a zahájit rizikovou výrobu 14 nm. Každý další uzel zmenšuje náskok TSMC a Samsungu a SMIC je nyní jedinou pevninskou čínskou slévárnou schopnou vyrábět pokročilou logiku. Toto aktivum musíme chránit a dále rozvíjet." # todo: NEW TRANSLATION
 CHI_smuggling_tax: "Zdanit pašování" # todo: NEW TRANSLATION
 CHI_smuggling_tax_desc: "Armáda neprovozuje každý nelegální obchod; uděluje na ně licence. Pašeráci převážející ropu, automobily a cigarety přes přístavy a posádky platí místním velitelům za ochranu a tento odvod se stává neoficiálním rozpočtem, který žádné ministerstvo nevidí ani se jej nemůže dotknout." # todo: NEW TRANSLATION
 CHI_Soft_Power_Projection: "Promítání měkké síly" # todo: NEW TRANSLATION
 CHI_Soft_Power_Projection_desc: "Zakládejte Konfuciovy instituty na univerzitách po celém světě a rozšiřujte mezinárodní dosah státních médií, abyste v zahraničí podporovali čínský jazyk, kulturu a pohledy." # todo: NEW TRANSLATION
 CHI_special_operations_forces: "Síly zvláštního určení" # todo: NEW TRANSLATION
 CHI_special_operations_forces_desc: "Každé bojiště vytváří vlastní brigády zvláštního určení vycvičené k nájezdům, průzkumu a úderům na velení. Jsou hrotem ostré čepele a vysílají se před hlavními silami, aby zevnitř otevřely dveře." # todo: NEW TRANSLATION
 CHI_Split_CSTO: "Rozdělit CSTO" # todo: NEW TRANSLATION
 CHI_Split_CSTO_desc: "Naše partnerství s Ruskem nebylo určeno k trvání navždy. Nikdy jsme nemohli plně důvěřovat našemu expanzivnímu severnímu sousedovi. Zatímco nám to sloužilo, abychom pokračovali v pretencích sino-ruské spolupráce, abychom posunuli SCO dále, musíme to ukončit. Naši spojenci musí nyní učinit volbu mezi tím, zda stojí po naší straně, nebo po straně našeho nepřítele." # todo: NEW TRANSLATION
 CHI_star_market_bse: "Trh STAR a Pekingská burza" # todo: NEW TRANSLATION
 CHI_star_market_bse_desc: "Rada pro vědu a technologické inovace na Šanghajské burze zavádí IPO založené na registraci, dvoutřídní akciové struktury a přístup k burzovnímu kotování pro zisk dosud nedosahující společnosti. SMIC získává na STAR 7,5 miliardy amerických dolarů; následuje Pekingská burza zaměřená na inovativní malé a střední podniky. Tyto platformy společně umožňují polovodičovým, biotechnologickým a pokročilým výrobním firmám získávat kapitál doma bez závislosti na kotování na Wall Street. Naše kapitálové trhy již nejsou rizikem závislosti." # todo: NEW TRANSLATION
 CHI_state_council_information_office: "Informační kancelář Státní rady" # todo: NEW TRANSLATION
 CHI_state_council_information_office_desc: "Informační kancelář Státní rady řídí naši vnější komunikaci, zámořské propagandistické operace, domácí správu internetu a akreditaci zahraničního tisku. Musíme ji využít k institucionalizaci filtrování obsahu v rámci programu Zlatý štít a k rozšíření našeho mezinárodního vysílání, abychom čelili západní dominanci narativů. Informační prostředí je bojiště a nemůžeme si dovolit je automaticky přenechat ostatním." # todo: NEW TRANSLATION
 CHI_stock_exchanges_shanghai_shenzhen: "Burzy v Šanghaji, Šen-čenu a Hongkongu" # todo: NEW TRANSLATION
 CHI_stock_exchanges_shanghai_shenzhen_desc: "Šanghajská burza hostí velké státní podniky včetně čtyř velkých bank, Sinopecu, PetroChina a China Mobile. Šenčenská burza hostí soukromé firmy a inovátory, jako jsou BYD, Midea, Gree a Ping An. ChiNext v Šen-čenu funguje jako růstová obdoba NASDAQu. Programy Shanghai-Hong Kong Stock Connect a Shenzhen-Hong Kong Stock Connect otevírají kontrolovanou bránu pro mezinárodní portfoliové investory bez úplné liberalizace kapitálového účtu a umožňují nám přilákat zahraniční kapitál za našich vlastních podmínek." # todo: NEW TRANSLATION
 CHI_strategic_materials: "Dodavatelské řetězce strategických materiálů" # todo: NEW TRANSLATION
 CHI_strategic_materials_desc: "Kontrolujeme více než 80 procent globální kapacity rafinace galia a germania a dominujeme dodávkám kazivce, křemíkového kovu a prvků vzácných zemin používaných při výrobě polovodičů. Po amerických exportních kontrolách zavádíme licencování vývozu galia a germania a následně přidáváme další omezení na sloučeniny arsenidu galia. Domácí politika přesměrovává výrobu strategických materiálů k našim vlastním továrnám, snižuje náklady a zajišťuje kontinuitu dodávek slévárnám působícím pod omezeními seznamu subjektů. Úzké místo materiálů funguje oběma směry." # todo: NEW TRANSLATION
 CHI_Strategic_Realignment: "Strategická realignace" # todo: NEW TRANSLATION
 CHI_Strategic_Realignment_desc: "Náš postupný odklon od Pakistánu je nyní zřejmý. Je na čase Indii jasně sdělit, že tyto kroky byly pokusy o získání jejich přízně." # todo: NEW TRANSLATION
 CHI_strategic_reserve_system: "Systém strategických rezerv" # todo: NEW TRANSLATION
 CHI_strategic_reserve_system_desc: "Hloubka je sama o sobě obranou. Reformovaný systém záloh a mobilizace je připraven zaplavit frontu vycvičenou živou silou a zajistit, že i dlouhá opotřebovací válka je válkou, kterou Čína dokáže přečkat." # todo: NEW TRANSLATION
 CHI_streamline_the_ranks: "Zeštíhlit řady" # todo: NEW TRANSLATION
 CHI_streamline_the_ranks_desc: "Dvoumilionová armáda vybudovaná k utopení útočníka v tělech nemůže vyhrát válku přesnosti. Omezujeme přebujelou pěchotu, vyřazujeme zastaralé prostředky a úspory naléváme do palebné síly, senzorů a mobility. Lidová osvobozenecká armáda bude menší, ostřejší a poprvé silou vybudovanou k vítězství, nikoli pouze k vytrvání." # todo: NEW TRANSLATION
 CHI_Strengthen_Relations_with_the_South: "Posílit vztahy se Jižní Koreou" # todo: NEW TRANSLATION
 CHI_Strengthen_Relations_with_the_South_desc: "Naše vztahy s Korejskou republikou nebyly historicky tak silné, jak by mohly být vzhledem k dědictví Korejské války. To však neznamená, že bychom s nimi nemohli v budoucnu přijmout pragmatické porozumění." # todo: NEW TRANSLATION
 CHI_Strengthen_Security_Framework: "Posílit bezpečnostní rámec" # todo: NEW TRANSLATION
 CHI_Strengthen_Security_Framework_desc: "Naše stávající vojenská spolupráce v rámci SCO je sice značná, ale nemusí stačit k odolání plnému náporu supervelmoci. Měli bychom prohloubit naši stávající vojenskou spolupráci, abychom my jako organizace byli lépe připraveni na nejhorší." # todo: NEW TRANSLATION
 CHI_Strike_Across_the_Himalayas: "Útok přes Himálaje" # todo: NEW TRANSLATION
 CHI_Strike_Across_the_Himalayas_desc: "Zatímco bychom měli prozatím usilovat o vyhnutí se plnohodnoté válce, posílili jsme naši pozici natolik, že můžeme provést průzkum indické obrany. Pokud budeme úspěšní, získáme zpět území, na které máme právem nárok; pokud ne, alespoň lépe poznáme schopnosti našeho nepřítele." # todo: NEW TRANSLATION
 CHI_strike_black_sing_red: "Úder proti černému, zpívat rudé" # todo: NEW TRANSLATION
 CHI_strike_black_sing_red_desc: "Dvoustranná kampaň za očištění politického těla. Tažení „Úder proti černému“ zatýká tisíce představitelů organizovaného zločinu a zkorumpovaných funkcionářů a rozbíjí patronátní sítě, které rozežíraly místní správu. Tažení „Zpívat rudé“ oživuje revoluční písně a maoistická hesla a směruje lidovou energii do vlastenecké mobilizace." # todo: NEW TRANSLATION
 CHI_String_of_Pearls: "Řetězec perel" # todo: NEW TRANSLATION
 CHI_String_of_Pearls_desc: "Indická dominance nad Indickým oceánem je nežádoucí stav. Můžeme se snažit omezit Indii podobně jako USA se snaží omezit nás, a to obklíčením našeho rivalu vojenskými základnami na území našich regionálních partnerů. Tento obkružující manévr nám poskytne významnou výhodu, pokud vstoupíme do války s Indií." # todo: NEW TRANSLATION
 CHI_Suez_Eastern_Bank: "Východní průmyslová zóna Suezu" # todo: NEW TRANSLATION
 CHI_Suez_Eastern_Bank_desc: "Čínsko-egyptská zóna hospodářské a obchodní spolupráce na východním břehu průplavu hostí naše výrobní, logistické a energetické firmy za zvýhodněných egyptských regulačních podmínek. Zóna upevňuje naše strategické postavení u jednoho z nejdůležitějších námořních úzkých míst světa, snižuje tranzitní náklady a poskytuje našim podnikům základnu pro přístup na severoafrické a evropské trhy. Egypt získává příjmy v tvrdé měně a politické spojení s námi. Obě strany chápou hodnotu toho, co budujeme." # todo: NEW TRANSLATION
 CHI_Sunshine_Policy_Revival: "Obnovení Sluneční politiky" # todo: NEW TRANSLATION
 CHI_Sunshine_Policy_Revival_desc: "Měli bychom se Soulem koordinovat obnovení rámce mezikorejského angažmá, který se zhroutil v letech po potopení lodi Cheonan a ostřelování Jonpchjongu. Společné kulturní výměny, programy návštěv znovusjednocených rodin a znovuotevřené horké linky obnoví základní komunikační infrastrukturu mezi oběma Korejemi, přičemž my budeme nepostradatelným zprostředkovatelem. Korea, která spolu mluví, je Korea, která nebojuje." # todo: NEW TRANSLATION
 CHI_Support_Negotiations: "Podporujte jednání" # todo: NEW TRANSLATION
 CHI_Support_Negotiations_desc: "Konflikt je problém a ne řešení. Měli bychom využít QCCM k přesvědčení našich partnerů, aby přijali smířlivé, ale opatrné přístupy k militantům, nikoliv ze strachu, ale ze nutnosti." # todo: NEW TRANSLATION
 CHI_Support_Nepals_Maoists: "Podpořte maoisty v Nepálu" # todo: NEW TRANSLATION
 CHI_Support_Nepals_Maoists_desc: "Nepál má několik komunistických stran, včetně maoistických. Tyto strany získaly v posledních letech na popularitě a ačkoliv jsme historicky nezasahovali do nepálské politiky, může být pro nás prospěšné podpořit ty, které sdílejí s námi ideologickou blízkost." # todo: NEW TRANSLATION
 CHI_system_of_systems_operations: "Operace systémů systémů" # todo: NEW TRANSLATION
 CHI_system_of_systems_operations_desc: "Konec reformy není organizační tabulka, ale způsob vedení války. Usilujeme o operace systémů systémů, které propojí senzory, střelce a velitele do jediné sítě schopné uvažovat a udeřit rychleji, než nepřítel dokáže reagovat. Armáda, která vyhraje příští válku, bude bojovat jako jediný, vnímající organismus." # todo: NEW TRANSLATION
 CHI_Tackle_the_Root_Causes_of_Radicalization: "Řešit kořeny radikalizace" # todo: NEW TRANSLATION
 CHI_Tackle_the_Root_Causes_of_Radicalization_desc: "Nyní, když byla teroristická hrozba dočasně snížena, bychom se měli zaměřit na deradikalizaci. Můžeme omezit nábor militantních skupin investicemi do infrastruktury a průmyslu, abychom zmírnili chudobu v Afghánistánu, Pákistánu a Tádžikistánu." # todo: NEW TRANSLATION
 CHI_tactical_electronic_warfare: "Taktický elektronický boj" # todo: NEW TRANSLATION
 CHI_tactical_electronic_warfare_desc: "Na informatizovaném bojišti vítězí strana, která oslepí druhou. Na úrovni brigád nasazujeme specializované jednotky rušení, zpravodajství a elektronických útoků, které zpochybní nepřátelská rádia, radary a datová spojení ještě před prvním výstřelem." # todo: NEW TRANSLATION
 CHI_tactical_uav_integration: "Integrace taktických UAV" # todo: NEW TRANSLATION
 CHI_tactical_uav_integration_desc: "Oči nad hlavou se stávají standardní výbavou. Malé průzkumné drony jsou přidělovány na úroveň praporu a roty, aby žádný velitel nepostupoval naslepo a každý cíl byl nalezen dříve, než na něj bude vypáleno." # todo: NEW TRANSLATION
 CHI_Takeshima_Solidarity: "Komuniké o Liancourtských skalách" # todo: NEW TRANSLATION
 CHI_Takeshima_Solidarity_desc: "Formálně podporujeme jihokorejský nárok na Liancourtské skály a rámujeme spor jako společnou křivdu proti japonskému odmítání uznat vlastní imperiální dědictví. Klín mezi Soulem a Tokiem se rozšiřuje a posouvá korejské veřejné mínění od washingtonské architektury tichomořské aliance." # todo: NEW TRANSLATION
 CHI_telecom_reorganization: "Reorganizace telekomunikací" # todo: NEW TRANSLATION
 CHI_telecom_reorganization_desc: "Státní rada restrukturalizuje náš telekomunikační monopol, rozděluje China Telecom a současně přiděluje spektrum 3G společnostem China Mobile, China Unicom a China Telecom. Výsledná konkurence podporuje investice do síťové infrastruktury a urychluje zavádění mobilního širokopásmového připojení na trhu s 1,4 miliardy potenciálních předplatitelů, kam žádný zahraniční konkurent nedosáhne." # todo: NEW TRANSLATION
 CHI_tencent_games_publisher: "Herní impérium Tencentu" # todo: NEW TRANSLATION
 CHI_tencent_games_publisher_desc: "Tencent získává Riot Games a Supercell a drží významné podíly v Epicu, Activision Blizzard a Ubisoftu. Honor of Kings se stává nejvýdělečnější mobilní hrou světa; Genshin Impact vydělá během prvních dvou let 5 miliard amerických dolarů. Naše investice do západních studií nám dávají strukturální vliv nad globální zábavou za zlomek nákladů tradiční měkké síly. Kultura hýbe lidmi způsoby, jichž diplomacie nedosáhne." # todo: NEW TRANSLATION
 CHI_The_2022_Reset: "Obrat v roce [GetYear]" # todo: NEW TRANSLATION
 CHI_The_2022_Reset_desc: "Na základě rámce G20 z Bali vytvořeného v [GetYear] společně se Spojenými státy formálně obnovujeme architekturu šestistranných rozhovorů. Poprvé po více než deseti letech přebíráme roli nestranného prostředníka mezi Washingtonem, Soulem a Pchjongjangem." # todo: NEW TRANSLATION
 CHI_The_2025_Blue_Sky_Operation: "Operace Modré nebe" # todo: NEW TRANSLATION
 CHI_The_2025_Blue_Sky_Operation_desc: "Společně se Severní Koreou zahajujeme koordinované vojenské tažení proti Jižní Koreji. Operace Modré nebe prověří naši ochotu nést mezinárodní náklady sjednocení Koreje silou." # todo: NEW TRANSLATION
 CHI_The_610_Northeast_Directive: "Směrnice 610 pro severovýchod" # todo: NEW TRANSLATION
 CHI_The_610_Northeast_Directive_desc: "Severovýchodní velitelství KS Číny aktivuje protokoly nouzové mobilizace napříč Mandžuskem a Liao-ningem. Pohraniční síly jsou posíleny, strategické rezervy přemístěny a infrastruktura v pohraničí zpevněna pro případ budoucí krize na poloostrově." # todo: NEW TRANSLATION
 CHI_the_610_office_mandate: "Mandát Úřadu 610" # todo: NEW TRANSLATION
 CHI_the_610_office_mandate_desc: "Úřad 610, pojmenovaný podle data svého založení, koordinuje naše státní bezpečnostní agentury při potlačování Falun Gongu a dalších skupin označených za hrozbu společenské stabilitě. Úřad působí mimo běžné právní kanály a soustřeďuje donucovací moc v rukou centra. Jeho mandát je záměrně neomezený, protože hrozby, jimž čelí, nerespektují hranice běžného práva." # todo: NEW TRANSLATION
 CHI_the_998_project: "Projekt bombardéru 998" # todo: NEW TRANSLATION
 CHI_the_998_project_desc: "Bombardovací složka, dlouho odepisovaná jako zastaralá, dostává budoucnost. Specializovaný program obnovuje dálkové údery kolem hluboce modernizovaného draku letounu a mění relikt studené války v nosič střel s odstupem schopný ohrožovat cíle v celém západním Pacifiku, aniž by kdy překročil nepřátelské pobřeží." # todo: NEW TRANSLATION
 CHI_The_Air_Patrol_Zone: "Letecká hlídková zóna" # todo: NEW TRANSLATION
 CHI_The_Air_Patrol_Zone_desc: "To, čemu jiné státy říkají ADIZ, raději popisujeme jako pravidelnou hlídkovou zónu: stíhačky PLAAF provádějí rutinní hlídky suverenity nad Jihočínským mořem, identifikují zahraniční letouny a doprovázejí nevyhovující tranzity z oblasti. Praktický účinek odpovídá precedentu z Východočínského moře z roku 2013, kdy všechny nečínské letouny čelí požadavkům na identifikaci a riziku zachycení; rámování však zdůrazňuje naši leteckou sílu namísto formálního právního nároku, který by mezinárodní společenství okamžitě napadlo." # todo: NEW TRANSLATION
 CHI_the_anime_generation_gambit: "Tah s generací anime" # todo: NEW TRANSLATION
 CHI_the_anime_generation_gambit_desc: "Naše mládež cituje Hajaa Mijazakiho častěji než Maa. Je to buď problém, nebo příležitost. Soudruh Wang Chu-ning věří, že platí druhá možnost." # todo: NEW TRANSLATION
 CHI_The_Beijing_Peace_Guarantee: "Pekingská mírová záruka" # todo: NEW TRANSLATION
 CHI_The_Beijing_Peace_Guarantee_desc: "Rušíme poslední spor mezi oběma Korejemi. Pekingská mírová záruka nás zavazuje bránit suverenitu jakékoli sjednocené Koreje před vnějším vměšováním." # todo: NEW TRANSLATION
 CHI_The_Beijing_Settlement: "Pekingské urovnání" # todo: NEW TRANSLATION
 CHI_The_Beijing_Settlement_desc: "Po upevnění převratu zprostředkujeme podmínky nové politické reality Severní Koreje. Přechodná vláda v Pchjongjangu přijímá naši arbitráž a Korejská strana práce je restrukturalizována pod naším dohledem." # todo: NEW TRANSLATION
 CHI_the_bohai_bastion: "Pevnost Po-chaj" # todo: NEW TRANSLATION
 CHI_the_bohai_bastion_desc: "Nejbezpečnější odstrašení je to, které nelze nalézt. Ponorka typu 094A nesoucí raketu JL-3 s dosahem přibližně deset tisíc kilometrů může konečně zasáhnout americkou pevninu z chráněných domácích vod. Naše ponorky s balistickými raketami ukryté za flotilou v chráněné pevnosti poskytují Číně skutečný námořní druhý úder — konečnou záruku, že nás první úder neodzbrojí." # todo: NEW TRANSLATION
 CHI_The_Border_Personnel_Meetings: "Setkání pohraničních představitelů" # todo: NEW TRANSLATION
 CHI_The_Border_Personnel_Meetings_desc: "Pět míst podél linie skutečné kontroly, kde se mohou indičtí a čínští velitelé setkat bez eskalačního protokolu. Konvice, skládací stůl, dvě vlajky. Někdy diplomacie začíná na místech tak malých." # todo: NEW TRANSLATION
 CHI_The_Cabbage_Strategy: "Zelná strategie" # todo: NEW TRANSLATION
 CHI_The_Cabbage_Strategy_desc: "Kontradmirál Čang Čao-čung taktiku veřejně popsal: obalit každý sporný útvar postupnými vrstvami. Zvenku rybářská plavidla, za nimi námořní milice, dále pobřežní hlídkové čluny a uprostřed fregaty, dokud se nejvzdálenější listy nerozeznají od suverenity. Než dorazí zahraniční právníci, zelí už vyroste. Tuto doktrínu přijímáme jako rámec pro Jihočínské moře." # todo: NEW TRANSLATION
 CHI_The_Cabbage_Tightens: "Zelí se stahuje" # todo: NEW TRANSLATION
 CHI_The_Cabbage_Tightens_desc: "Námořní milice a pobřežní stráž nyní působí pod jednotnou koordinací PLAN napříč řetězcem sporných útesů. Vnější vrstvy zelí jsou konsolidovány do plynulé správní a bezpečnostní přítomnosti. To, co bylo dříve sporné, je nyní v praxi spravováno." # todo: NEW TRANSLATION
 CHI_The_China_Pakistan_Economic_Corridor: "Čínsko-pákistánský ekonomický koridor" # todo: NEW TRANSLATION
 CHI_The_China_Pakistan_Economic_Corridor_desc: "Pákistán je naším blízkým spojencem a proto bychom měli pomoci tomuto státu s rozvojem jeho dálnic, železnic a přístavů k jejich prospěchu i naší." # todo: NEW TRANSLATION
 CHI_the_china_plus_one_counteroffensive: "Protiútok China-Plus-One" # todo: NEW TRANSLATION
 CHI_the_china_plus_one_counteroffensive_desc: "Pan Tojoda navštívil Tchien-ťin s očekáváním ústupků. Odjel s ústupky a smlouvou na sto tisíc vozidel s palivovými články. Umění dávat při současném získávání stále zdokonalujeme." # todo: NEW TRANSLATION
 CHI_The_Chinese_Correction: "Čínská náprava" # todo: NEW TRANSLATION
 CHI_The_Chinese_Correction_desc: "Nevypočitatelné chování dynastie Kimů se stalo strategickou přítěží. Rozhodli jsme se, že řízená, tichá, chirurgická a nevratná změna je vhodnější než další generace vyděračské diplomacie z Pchjongjangu." # todo: NEW TRANSLATION
 CHI_the_chinese_dream: "Čínský sen" # todo: NEW TRANSLATION
 CHI_the_chinese_dream_desc: "Velká obroda čínského národa je největším čínským snem. Století ponížení ustoupilo obnově a strana tuto proměnu rámuje nikoli jako ideologii, ale jako historický osud sdílený všemi 1,4 miliardy obyvatel. Hospodářská síla, vojenská moc a mezinárodní respekt nejsou ambice — byly nám odňaty a my je získáme zpět." # todo: NEW TRANSLATION
 CHI_The_Code_Of_Conduct: "Kodex chování" # todo: NEW TRANSLATION
 CHI_The_Code_Of_Conduct_desc: "Závazný regionální kodex chování vyjednaný pod čínskými podmínkami je předložen jako konečné urovnání konkurenčních nároků v Jihočínském moři. Dokument kodifikuje bilaterální ujednání, vylučuje vnější arbitráž a zakotvuje zásadu, že spory jsou záležitostí Číny a jejích sousedů. Vnějším mocnostem je upřen jakýkoli právní opěrný bod." # todo: NEW TRANSLATION
 CHI_the_diaoyu_sovereignty_declaration: "Prohlášení o suverenitě nad Tiao-jü" # todo: NEW TRANSLATION
 CHI_the_diaoyu_sovereignty_declaration_desc: "Ostrovy Tiao-jü jsou čínským územím od dynastie Ming. Japonská „správa“ je koloniálním dědictvím, které svět toleroval příliš dlouho." # todo: NEW TRANSLATION
 CHI_The_Duterte_Pivot: "Duterteho obrat" # todo: NEW TRANSLATION
 CHI_The_Duterte_Pivot_desc: "Když prezident Duterte z Filipín prohlásil „odtržení“ své země od Spojených států a obrátil se k Pekingu, ukázal regionu, že jihovýchodní asijský vůdce může dát přednost suverenitě před závislostí. Podobné obraty jinde bychom měli tiše a trpělivě podporovat, dokud se washingtonská spojenectví nestanou otázkou namísto odpovědi." # todo: NEW TRANSLATION
 CHI_The_Final_Compromise: "Konečný kompromis" # todo: NEW TRANSLATION
 CHI_The_Final_Compromise_desc: "Po letech trpělivé diplomacie zprostředkujeme konečné urovnání přijatelné pro obě Koreje. Uspořádání, které není ani sjednocením, ani trvalým rozdělením, vytvoří společnou hospodářskou zónu, demilitarizované hraniční přechody a společnou čínsko-korejskou monitorovací komisi. Vystoupíme jako nepostradatelný garant míru na poloostrově." # todo: NEW TRANSLATION
 CHI_The_Five_Fingers_Doctrine: "Doktrína pěti prstů" # todo: NEW TRANSLATION
 CHI_The_Five_Fingers_Doctrine_desc: "Mao to řekl v roce 1959: Tibet je pravá dlaň a pěti prsty jsou Ladak, Nepál, Sikkim, Bhútán a Agentura severovýchodní hranice. Dlaň a palec máme. Ostatní prsty čekají." # todo: NEW TRANSLATION
 CHI_the_fujian_catapults: "Katapulty Fu-ťienu" # todo: NEW TRANSLATION
 CHI_the_fujian_catapults_desc: "Od skokanského můstku přecházíme ke katapultu. Typ 003 Fu-ťien, spuštěný na vodu v roce 2022, je první čínskou letadlovou lodí s elektromagnetickými katapulty, schopnými vrhat z paluby těžší, plně natankované letouny i letouny včasné výstrahy. S ní se mezera vůči americké superletadlové lodi z propasti zmenšuje na jediný krok." # todo: NEW TRANSLATION
 CHI_the_fukuda_doctrine_revisited: "Návrat k Fukudově doktríně" # todo: NEW TRANSLATION
 CHI_the_fukuda_doctrine_revisited_desc: "Soudruh Teng nám řekl: skrývej svou sílu, vyčkej na svůj čas. Japonská ekonomika krvácí, porodnost se hroutí a jejich politici se v Kantei střídají každých čtrnáct měsíců. Proč se hádat s mrtvolou čekající na svůj konec, když můžeme koupit její dědictví?" # todo: NEW TRANSLATION
 CHI_The_G2_Declaration: "Deklarace G2" # todo: NEW TRANSLATION
 CHI_The_G2_Declaration_desc: "Na summitu mezi Washingtonem a Pekingem naši vůdci a Američané společně prohlašují svůj závazek k mírovému a sjednocenému Korejskému poloostrovu pod korejskou správou. Deklarace G2 ohlašuje novou éru velmocenského řízení východoasijské bezpečnosti a uznává nás jako rovnocenného partnera tohoto uspořádání." # todo: NEW TRANSLATION
 CHI_the_great_wall: "Velká čínská zeď" # todo: NEW TRANSLATION
 CHI_the_great_wall_desc: "Některé bitvy se vyhrávají tím, že se nikdy neprohrají. Volíme obrannou cestu, moderní Velkou zeď: vrstvené opevnění, hluboké rezervy a armádu, která každého útočníka na čínské půdě vykrvácí. Sjednocení může počkat, pokud nejprve učiníme vlast definitivně nedobytnou." # todo: NEW TRANSLATION
 CHI_the_great_western_development: "Velký rozvoj západu" # todo: NEW TRANSLATION
 CHI_the_great_western_development_desc: "Naše politika Jít na západ směruje státní investice do dvanácti západních provincií prostřednictvím výstavby infrastruktury, pobídek pro továrny a přesídlovacích programů. Uzavření rozdílu mezi pobřežím a vnitrozemím je hospodářským imperativem i naším nejtrvalejším nástrojem k připoutání neklidných pohraničních oblastí k centru." # todo: NEW TRANSLATION
 CHI_the_historical_reckoning: "Historické zúčtování" # todo: NEW TRANSLATION
 CHI_the_historical_reckoning_desc: "Učebnice jedno město vynechávají. Svatyně uctívají architekty. My budeme ti, kdo si vzpomenou." # todo: NEW TRANSLATION
 CHI_The_Indian_Subcontinent: "Indický subkontinent" # todo: NEW TRANSLATION
 CHI_The_Indian_Subcontinent_desc: "Na jih od Tibetu leží rozsáhlý subkontinent, jehož hlavní charakter tvoří rivalita mezi Indií a Pákistánem. Měli bychom pečlivě zvážit náš postup v této ostře rozdělené oblasti." # todo: NEW TRANSLATION
 CHI_the_iron_fist: "Železná pěst" # todo: NEW TRANSLATION
 CHI_the_iron_fist_desc: "Obrana nic nezíská zpět. Volíme železnou pěst: těžké brigády kombinovaných zbraní vedené typem 99, masivní obrněné síly a palbu dlouhého dosahu určené k rozbití připraveného nepřítele a obsazení území. Až přijde rozkaz překročit průliv nebo hranici, odpovíme drtivou vahou." # todo: NEW TRANSLATION
 CHI_The_Jang_Faction_Rehabilitation: "Rehabilitace frakce Čang" # todo: NEW TRANSLATION
 CHI_The_Jang_Faction_Rehabilitation_desc: "Když byl Čang Song-tchek odstraněn a popraven, přišel Pchjongjang o našeho nejspolehlivějšího prostředníka. Nyní rehabilitujeme jeho přeživší síť v exilu a vychováme kádr reformně smýšlejících korejských představitelů, kteří vděčí za svou budoucnost nám." # todo: NEW TRANSLATION
 CHI_the_japan_question: "Japonská otázka" # todo: NEW TRANSLATION
 CHI_the_japan_question_desc: "Na severovýchodě leží velká hrozba i velká příležitost. Japonská otázka, stejně jako otázka Tchaj-wanu a Koreje, nepřipouští trvalou odpověď, pouze odpověď vhodnou pro současnou hodinu." # todo: NEW TRANSLATION
 CHI_the_komsomolsk_pipeline: "Komsomolský plynovod" # todo: NEW TRANSLATION
 CHI_the_komsomolsk_pipeline_desc: "Proč čekat na naše továrny, když ruské už běží? Z Komsomolska na Amuru kupujeme Su-27, Su-30 a motory AL-31, které pohánějí polovinu naší flotily, a dovážíme generaci schopností, jež zatím nedokážeme vyrobit. Plynovod udržuje letectvo moderní dnes, za cenu závislosti na Moskvě zítra." # todo: NEW TRANSLATION
 CHI_The_Mandate_Of_The_Seas: "Mandát moří" # todo: NEW TRANSLATION
 CHI_The_Mandate_Of_The_Seas_desc: "Klasický čínský světonázor uznával čtyři moře obklopující civilizované centrum Říše středu, S'-chaj. Dračí králové těchto vod se zodpovídali Nebesům a jejich prostřednictvím Synu nebes. Tento řád přerušilo Století ponížení; nyní čeká na obnovu pod státem dostatečně silným, aby jej prosadil." # todo: NEW TRANSLATION
 CHI_the_maritime_militia_initiative: "Iniciativa námořní milice" # todo: NEW TRANSLATION
 CHI_the_maritime_militia_initiative_desc: "Každá rybářská loď je pohyblivým označením suverenity. Námořní milice Lidových ozbrojených sil se zodpovídá Ústřední vojenské komisi, svět však uvidí pouze rybáře." # todo: NEW TRANSLATION
 CHI_The_Maritime_Silk_Road_Initiative: "Iniciativa Námořní hedvábné stezky" # todo: NEW TRANSLATION
 CHI_The_Maritime_Silk_Road_Initiative_desc: "Námořní hedvábná stezka je námořní složkou Iniciativy Pásu a stezky a rozšiřuje naše infrastrukturní investice a obchodní sítě napříč jihovýchodní Asií, jižní Asií a východní Afrikou. V Jihočínském moři slouží jako hospodářská kotva naší diplomatické cesty: státy s územními nároky, jimž nabídneme financování přístavů, rybářské dohody a společné podniky v oblasti uhlovodíků, shledají bilaterální cestu přitažlivější než konfrontaci na úrovni ASEAN. Každá podepsaná dohoda posiluje zásadu, že tyto spory jsou záležitostí sousedů, nikoli případů pro mezinárodní arbitráž." # todo: NEW TRANSLATION
 CHI_the_nanjing_memorial_mandate: "Mandát nanťingského památníku" # todo: NEW TRANSLATION
 CHI_the_nanjing_memorial_mandate_desc: "Tři sta tisíc. Toto číslo bude na obálce každé učebnice, na každé stěně muzea a při každé minutě ticha 13. prosince. Japonská vláda má své vzpomínky. My budeme mít své." # todo: NEW TRANSLATION
 CHI_The_Nine_Dots_Consensus: "Konsenzus devíti teček" # todo: NEW TRANSLATION
 CHI_The_Nine_Dots_Consensus_desc: "Namísto volby mezi Pchjongjangem a Soulem volíme vyváženou střední cestu: udržování vztahů se Severem bez záruky přežití režimu, prohlubování ekonomických vazeb s Jihem bez opuštění strategické nejednoznačnosti. Sázíme na to, že současné držení obou nití je jediný přístup, který může nakonec vytvořit stabilní poloostrov." # todo: NEW TRANSLATION
 CHI_the_northeast_tiger: "Severovýchodní tygr" # todo: NEW TRANSLATION
 CHI_the_northeast_tiger_desc: "Moc v zkorumpované armádě proudí regionem a patronátem. Šenjangská klika ze severovýchodu, půda, z níž povstal Sü Cchaj-chou, se stává tvůrcem králů a obchoduje s jmenováními a přízní napříč starými vojenskými oblastmi jako se soukromým panstvím." # todo: NEW TRANSLATION
 CHI_the_panda_diplomacy_renewal: "Obnovení pandí diplomacie" # todo: NEW TRANSLATION
 CHI_the_panda_diplomacy_renewal_desc: "Dvě pandy. Dvanáct milionů dolarů ročně na „poplatcích za ochranu“. Jedna fotografie japonského dítěte usmívajícího se na čínské zvíře na titulní straně. Stojí to za každý jüan." # todo: NEW TRANSLATION
 CHI_The_Panmunjom_Architecture: "Panmundžomská architektura" # todo: NEW TRANSLATION
 CHI_The_Panmunjom_Architecture_desc: "Svoláme v Panmundžomu, místě příměří a dvou desetiletí neúspěšných amerických summitů, nový multilaterální dialog. Náš rámec přivede Soul a Pchjongjang k jednomu stolu pod naším vedením a zaváže všechny strany k postupnému procesu snižování napětí podpořenému našimi diplomatickými zárukami. Svět nám připíše zásluhu za to, co Washington nedokázal." # todo: NEW TRANSLATION
 CHI_the_party_that_lasts: "Strana, která přetrvá" # todo: NEW TRANSLATION
 CHI_the_party_that_lasts_desc: "Institucionální mechanismy strany — systém sjezdů, Ústřední výbor a politbyro — jsou znovu potvrzeny jako legitimní motory správy navržené tak, aby přežily každého jednotlivého vůdce. Myšlenka Si Ťin-pchinga je zakotvena jako provozní rámec příštího století, ale systém, který ji ponese dál, je kolektivní a trvalý. Strana přežila Maovu smrt, kulturní revoluci i Tchien-an-men. Její stroj je vybudován k vytrvání." # todo: NEW TRANSLATION
 CHI_The_Pivot_Reversed: "Obrácený obrat" # todo: NEW TRANSLATION
 CHI_The_Pivot_Reversed_desc: "Americký obrat k Asii přetížil washingtonské závazky a vytvořil strategickou příležitost. Zaplníme vakuum, jak bude důvěryhodnost Spojených států erodovat, a postavíme se do role nejschopnějšího a nejochotnějšího bezpečnostního partnera Soulu." # todo: NEW TRANSLATION
 CHI_The_PLAN_Expeditionary_Buildup: "Expediční budování PLAN" # todo: NEW TRANSLATION
 CHI_The_PLAN_Expeditionary_Buildup_desc: "Úderné skupiny letadlových lodí, obojživelné útočné lodě typu 075 a flotily zásobování na moři přivádějí námořnictvo Lidové osvobozenecké armády k plné operační schopnosti na otevřeném moři. Jihočínské moře již není hranicí, kterou je třeba bránit. Je to odrazový můstek, z něhož lze promítat sílu na mezikontinentální vzdálenost." # todo: NEW TRANSLATION
 CHI_the_poly_compromise: "Kompromis s Poly" # todo: NEW TRANSLATION
 CHI_the_poly_compromise_desc: "Proč se vzdát jmění jen kvůli čistému obrazu? Skupina Poly vznikla z obchodní složky generálního štábu a je pouze největší z impérií, která armáda vybudovala. Odmítáme Ťiangův odprodej: podniky zůstanou, pašování zůstane, peníze zůstanou. PLA bude bohatá dříve, než bude reformována, a loajalita se bude kupovat, nikoli zasluhovat." # todo: NEW TRANSLATION
 CHI_The_Princeling_Network: "Síť knížat" # todo: NEW TRANSLATION
 CHI_The_Princeling_Network_desc: "Naše zpravodajské služby pronikají do důstojnického sboru KLA prostřednictvím dětí pchjongjangské elity, které byly vzdělávány zde. Tato knížata, formovaná lety v Pekingu, jsou naší nejspolehlivější pákou uvnitř severokorejského státu." # todo: NEW TRANSLATION
 CHI_the_pterodactyl_generation: "Generace ptakoještěrů" # todo: NEW TRANSLATION
 CHI_the_pterodactyl_generation_desc: "Rodina ozbrojených dronů Wing Loong neboli Ptakoještěr dává letectvu levného a vytrvalého lovce pro průzkum a údery a zároveň vlajkový export, který přináší čínskou leteckou moc do tuctu zahraničních válek." # todo: NEW TRANSLATION
 CHI_the_quad_wedge_strategy: "Strategie klínu Quad" # todo: NEW TRANSLATION
 CHI_the_quad_wedge_strategy_desc: "Bez Tokia není Quad a bez Tokia nejsou možnosti. Dáme jim možnosti — tiše a bilaterálně, v místnostech, kam Američané nebyli pozváni." # todo: NEW TRANSLATION
 CHI_The_Quadrilateral_Cooperation_and_Coordination_Mechanism: "Mechanismus čtyřstranné spolupráce a koordinace" # todo: NEW TRANSLATION
 CHI_The_Quadrilateral_Cooperation_and_Coordination_Mechanism_desc: "Mechanismus čtyřstranné spolupráce a koordinace, zkráceně QCCM, bude užitečnou skupinou čtyř zemí se společným zájmem v boji proti terorismu. Doufejme, že zlepší napjaté vztahy mezi Pákistánem a Afghánistánem a pomůže rozšířit náš vliv ve Střední Asii pod vlivem Ruska prostřednictvím našich partnerů v Tádžikistánu." # todo: NEW TRANSLATION
 CHI_the_quiet_dragons: "Tiší draci" # todo: NEW TRANSLATION
 CHI_the_quiet_dragons_desc: "Hluk je pod vlnami smrtí a naše lodě byly vždy slyšet příliš brzy. Útočná ponorka nové generace typu 095 je postavena kolem ticha, s pump-jetovým pohonem a tišším reaktorem, který zmenšuje náskok amerických lovců. Tiší draci mohou konečně proklouznout kolem ostrovních řetězců a pronásledovat letadlovou loď v jejím vlastním oceánu." # todo: NEW TRANSLATION
 CHI_the_rare_earth_lever: "Páka vzácných zemin" # todo: NEW TRANSLATION
 CHI_the_rare_earth_lever_desc: "Většina světových vzácných zemin prochází našima rukama. Každý motor Toyoty Prius, každá ocasní plocha F-35, každý reproduktor iPhonu. Ventil ovládáme my." # todo: NEW TRANSLATION
 CHI_the_rcep_acceleration: "Urychlení RCEP" # todo: NEW TRANSLATION
 CHI_the_rcep_acceleration_desc: "Američané vystoupili z TPP. Japonci zůstali. Regionální komplexní hospodářské partnerství bude podepsáno a Tokio jej podepíše vedle Pekingu, nikoli Washingtonu." # todo: NEW TRANSLATION
 CHI_the_renhai_cruiser: "Křižník Ren-chaj" # todo: NEW TRANSLATION
 CHI_the_renhai_cruiser_desc: "Čína pokládá svou první skutečnou hlavní loď moderní éry. Typ 055, který NATO řadí mezi křižníky, je stealth válečná loď o výtlaku deseti tisíc tun s více než stovkou raketových sil, postavená k vedení skupiny letadlové lodi a boji proti všemu na hladině. Do roku 2022 je dokončeno osm kusů a s nimi námořnictvo získává hladinové bojové lodě rovnocenné kterýmkoli na světě." # todo: NEW TRANSLATION
 CHI_The_Roh_Moohyun_Framework: "Obnovení deklarace 10.4" # todo: NEW TRANSLATION
 CHI_The_Roh_Moohyun_Framework_desc: "Obnovíme ducha Deklarace ze 4. října a podpoříme postupný rámec angažmá se Severní Koreou. Společné zemědělské projekty, omezený cestovní ruch a kontrolovaný přeshraniční obchod lze uskutečňovat bez předběžných podmínek a my budeme těmi, kdo udrží dveře otevřené." # todo: NEW TRANSLATION
 CHI_The_Sansha_Administrative_Upgrade: "Správní povýšení Sansha" # todo: NEW TRANSLATION
 CHI_The_Sansha_Administrative_Upgrade_desc: "Město Sansha, naše obecní sídlo na ostrově Woody v Paracelách, nyní rozšíří svou jurisdikci přes celý řetězec Spratlyho ostrovů. Civilní rámování je záměrné: starostové, sčítací úřady a meteorologické kanceláře poskytují politické krytí tomu, co je ve skutečnosti trvalým začleněním sporných útesových území do našeho správního řádu." # todo: NEW TRANSLATION
 CHI_The_Scarborough_Model: "Model Scarborough" # todo: NEW TRANSLATION
 CHI_The_Scarborough_Model_desc: "Střet u mělčiny Scarborough nám poskytl opakovatelnou metodu: setkání rybářského plavidla přeroste v konfrontaci pobřežních stráží, druhá strana pod tlakem ustoupí a trvalá přítomnost je zřízena dříve, než může zasáhnout třetí strana. Tento model nyní systematicky použijeme na každý zbývající sporný útvar." # todo: NEW TRANSLATION
 CHI_The_Sea_Within_The_Sea: "Moře uvnitř moře" # todo: NEW TRANSLATION
 CHI_The_Sea_Within_The_Sea_desc: "Jihočínské moře je ze všech stran ohraničeno prvním ostrovním řetězcem, pevninou a útesy táhnoucími se od Japonska přes Filipíny až k Malajsii, a díky nahromaděné vojenské přítomnosti, hospodářské integraci a územním rozhodnutím se stalo zcela uzavřeným v naší správní kontrole. Linie devíti čárek již není nárokem; je hranicí. Námořní trasy přepravující třetinu světového obchodu nyní procházejí vodami, které spravujeme právně i fakticky, přičemž naše pobřežní stráž a PLAN udržují nepřetržitou suverénní hlídku od Paracel až po Spratlyho ostrovy." # todo: NEW TRANSLATION
 CHI_the_securitate_restructured: "Restrukturalizovaná Securitate" # todo: NEW TRANSLATION
 CHI_the_securitate_restructured_desc: "Vnitřní bezpečnostní služby jsou podle inovací Wanga Li-ťüna v Čchung-čchingu reorganizovány podle vzoru komplexního aparátu ochrany státu. Signálové zpravodajství, sítě informátorů a právní donucení jsou integrovány pod jednotné velení. Žádné spiknutí proti lidovému státu neunikne odhalení." # todo: NEW TRANSLATION
 CHI_the_self_reliant_path: "Cesta soběstačnosti" # todo: NEW TRANSLATION
 CHI_the_self_reliant_path_desc: "Každý dovezený motor je poutem. Volíme obtížnější cestu soběstačnosti, naléváme zdroje do vlastních konstrukčních kanceláří a přijímáme roky podřadných letounů, aby příští generace nebyla zavázána žádnému zahraničnímu dodavateli. Letectvo, které nedokáže postavit vlastní křídla, nikdy nebude skutečně svobodné." # todo: NEW TRANSLATION
 CHI_the_senkaku_crisis: "Krize Senkaku" # todo: NEW TRANSLATION
 CHI_the_senkaku_crisis_desc: "Roky jsme zkoumali japonskou protivzdušnou obranu a sledovali jejich pobřežní stráž. Další provokaci již nebude možné popřít. Pobřežní hlídkové plavidlo není válečnou lodí — dokud jí není." # todo: NEW TRANSLATION
 CHI_The_Seoul_Gambit: "Soulský tah" # todo: NEW TRANSLATION
 CHI_The_Seoul_Gambit_desc: "Vědomě sázíme na to, že hlubší vztah se Soulem může přinést trvalejší bezpečnost než nekonečný závazek vůči Pchjongjangu. Přistoupit k Jižní Koreji jako ke strategickému partnerovi namísto protivníka znamená rozchod s desetiletími naší korejské politiky, a nejde o rozhodnutí, které bychom činili lehkovážně." # todo: NEW TRANSLATION
 CHI_the_shanghai_succession: "Šanghajské nástupnictví" # todo: NEW TRANSLATION
 CHI_the_shanghai_succession_desc: "Ťiang Ce-min předává formální vedení Chu Ťin-tchaovi a současně zajišťuje, aby stoupenci šanghajské kliky ovládli stálý výbor politbyra. Zachováním předsednictví Ústřední vojenské komise si ponechává rozhodující páku nad novým vedením a upevňuje frakční rovnováhu ve prospěch sítě knížat. Moc je předána. Není opuštěna." # todo: NEW TRANSLATION
 CHI_the_shanghai_succession_tt: "§Y$CHI_factional_balance$§! na §Y$CHI_16_national_congress_mission$§! rozhoduje o nástupnictví: nad §Y$CHI_shanghai_clique_leaning$§! připadne §YChu Ťin-tchaovi§!, jinak §YZeng Qinghong§!" # todo: NEW TRANSLATION
 CHI_the_sharp_blade: "Ostrá čepel" # todo: NEW TRANSLATION
 CHI_the_sharp_blade_desc: "Příští válka může být rozhodnuta během hodin, nikoli měsíců. Volíme ostrou čepel: lehké, letecky mobilní a speciální síly, které udeří první a daleko a obsadí letiště, přístavy a hlavní města dříve, než obránce stihne reagovat. Rychlost se stává naší nejtěžší zbraní." # todo: NEW TRANSLATION
 CHI_the_sharp_sword_doctrine: "Doktrína ostrého meče" # todo: NEW TRANSLATION
 CHI_the_sharp_sword_doctrine_desc: "Stealth není jen pro stíhačky. GJ-11 „Ostrý meč“, bezocasý bojový dron, kotví doktrínu průnikových bezpilotních úderů a vysílá se před pilotovanou flotilou, aby nalezl a zničil nepřátelskou obranu tam, kde není třeba riskovat jediného pilota." # todo: NEW TRANSLATION
 CHI_the_soaring_dragon: "Vznášející se drak" # todo: NEW TRANSLATION
 CHI_the_soaring_dragon_desc: "WZ-7 „Vznášející se drak“, dron s vysokou výškou letu a dlouhou vytrvalostí s charakteristickými spojenými křídly, celé dny hlídkuje námořní přístupy a zásobuje údernou síť nepřetržitým dohledem nad moři, která Čína hodlá ovládnout." # todo: NEW TRANSLATION
 CHI_The_South_China_Sea: "Jižní Čínské moře" # todo: NEW TRANSLATION
 CHI_The_South_China_Sea_desc: "Význam Jihočínského moře, a to jak z hlediska strategického, tak ekonomického, nelze podceňovat. Se spory a napětím s ostatními státy, zvláště nad rozsáhlými ropnými poli, která byla v moři teprve nedávno objevena, je klíčové překonat naše rivaly a prosadit naši moc v regionu." # todo: NEW TRANSLATION
 CHI_the_sovremenny_bridge: "Most Sovremenny" # todo: NEW TRANSLATION
 CHI_the_sovremenny_bridge_desc: "Dokud naše loděnice nedokážou stavět lodě, které potřebujeme, budeme je kupovat. Čtyři torpédoborce Sovremenny projektu 956E a 956EM byly koncem 90. let zakoupeny od Ruska; každý je vyzbrojen nadzvukovou protilodní střelou Moskit určenou k ničení amerických letadlových lodí. Jsou mostem přes roky — moderní palebná síla zakoupená v době, kdy se domácí flotila teprve rodí." # todo: NEW TRANSLATION
 CHI_The_Spirit_Of_Zheng_He: "Duch Čeng Chea" # todo: NEW TRANSLATION
 CHI_The_Spirit_Of_Zheng_He_desc: "Před šesti sty lety vypluly pokladové flotily admirála Čeng Chea z Nan-ťingu na sedm plaveb, které dosáhly Perského zálivu a pobřeží východní Afriky. Převážely hedvábí, porcelán a pravidla civilizované výměny, nikoli dobývání. Námořní hedvábná stezka je moderním dědicem této tradice a naše angažmá v jihovýchodní Asii se bude odehrávat v jejím duchu." # todo: NEW TRANSLATION
 CHI_the_surface_capital_fleet: "Hlavní hladinová flotila" # todo: NEW TRANSLATION
 CHI_the_surface_capital_fleet_desc: "Moc, kterou nelze vidět, nebudí respekt, a my chceme být viděni. Flotila je vybudována kolem letadlové lodi a křižníku typu 055 v vyvážených bojových skupinách, které mohou plout kterýmkoli oceánem a diktovat podmínky v kterémkoli moři. Velká hladinová flotila ukazující vlajku ve vzdálených přístavech je viditelným důkazem, že Čína dorazila jako námořní mocnost." # todo: NEW TRANSLATION
 CHI_the_tanker_gap: "Uzavřít mezeru v tankerech" # todo: NEW TRANSLATION
 CHI_the_tanker_gap_desc: "Dosah je nejstarší slabinou letectva. S příliš malým počtem tankerů nemohou naše stíhačky dlouho působit daleko od domova, proto rozšiřujeme flotilu vzdušného doplňování paliva, aby úderné balíky dosáhly vzdálených moří a zůstaly tam." # todo: NEW TRANSLATION
 CHI_The_THAAD_Response: "Reakce na THAAD" # todo: NEW TRANSLATION
 CHI_The_THAAD_Response_desc: "Rozmístění protiraketového systému THAAD v Jižní Koreji zhoršuje naše jaderné odstrašení. Odpovíme ekonomickým nátlakem: omezíme cestovní ruch, budeme bojkotovat korejské zábavní produkty a tlačit na korejské firmy působící na našem území, dokud Soul své rozhodnutí nepřehodnotí." # todo: NEW TRANSLATION
 CHI_the_three_represents: "Tři zastupování" # todo: NEW TRANSLATION
 CHI_the_three_represents_desc: "Teoretický příspěvek Ťiang Ce-mina ke stranické doktríně tvrdí, že KS Číny musí zastupovat pokročilé výrobní síly, pokročilou kulturu a nejširší zájmy našeho lidu. Přijetím soukromých podnikatelů a kapitalistů do strany rozšiřujeme sociální základnu naší vlády za hranice dělníků a rolníků a strana přetrvá." # todo: NEW TRANSLATION
 CHI_the_tokyo_communique: "Tokijské komuniké" # todo: NEW TRANSLATION
 CHI_the_tokyo_communique_desc: "Dnešní komuniké řekne méně než text z roku 2008 a bude znamenat více. Odlišné pohledy na historii je diplomatická formule znamenající, že o ní již nebudeme mluvit." # todo: NEW TRANSLATION
 CHI_The_Treasure_Fleet_Returns: "Návrat pokladové flotily" # todo: NEW TRANSLATION
 CHI_The_Treasure_Fleet_Returns_desc: "Iniciativa Pásu a stezky rozšiřuje svou námořní složku napříč jihovýchodní Asií. Státům s územními nároky nabízíme koncese v přístavech, rybářské dohody a společné podniky v oblasti plynových plošin. Každá uzavřená dohoda připoutává partnera těsněji k čínské hospodářské orbitě a snižuje přitažlivost konfrontace." # todo: NEW TRANSLATION
 CHI_the_type_075_yushen: "Typ 075 Jü-šen" # todo: NEW TRANSLATION
 CHI_the_type_075_yushen_desc: "Námořní pěchota získává vlajkovou loď s plochou palubou. Typ 075 Jü-šen, vrtulníková útočná loď o výtlaku čtyřiceti tisíc tun, přepravuje brigádu a její bitevní vrtulníky za horizont a vysazuje je současně ze vzduchu i z moře. Je srdcem obojživelné skupiny vybudované k obsazení a udržení území daleko od pobřeží." # todo: NEW TRANSLATION
 CHI_the_type_901: "Typ 901 a džibutská tepna" # todo: NEW TRANSLATION
 CHI_the_type_901_desc: "Flotila na otevřeném moři žije či umírá podle svého zásobovacího vlaku. Rychlá podpůrná loď typu 901, dostatečně velká a rychlá, aby udržela tempo se skupinou letadlové lodi, umožňuje flotile zůstat na moři daleko od domova; v roce 2017 Čína otevírá svou první zámořskou základnu v Džibutsku, trvalou tepnu kotvící námořnictvo v Indickém oceánu." # todo: NEW TRANSLATION
 CHI_the_varyag_refit: "Přestavba Varjagu" # todo: NEW TRANSLATION
 CHI_the_varyag_refit_desc: "Rezavějící sovětský trup se stává semenem flotily letadlových lodí. Nedokončený Varjag, zakoupený v roce 1998 bez výzbroje z Ukrajiny a v roce 2002 odtažený do Ta-lienu, je během desetiletí přestavěn a v roce 2012 uveden do služby jako Liaoning. Je spíše cvičnou než válečnou lodí, ale na její palubě se námořnictvo bez tradice letadlových lodí učí, letoun po letounu, jak létat z moře." # todo: NEW TRANSLATION
 CHI_the_yasukuni_protest_doctrine: "Doktrína protestu proti Jasukuni" # todo: NEW TRANSLATION
 CHI_the_yasukuni_protest_doctrine_desc: "Když se japonský premiér klaní jménům válečných zločinců třídy A, nectí své předky. Zkouší si další válku. Náš velvyslanec se do odvolání vrátí do Pekingu." # todo: NEW TRANSLATION
 CHI_the_yuan_and_the_shang: "Jüan a Šang" # todo: NEW TRANSLATION
 CHI_the_yuan_and_the_shang_desc: "Ponorkové síly vystupují z dieselové éry. Typ 039 Jüan, diesel-elektrická loď s nezávislým pohonem na vzduchu, může týdny tiše číhat v přilehlých mořích, zatímco jaderný typ 093 Šang dává flotile první důvěryhodnou útočnou ponorku schopnou působit daleko od domova. Tiší lovci se stávají nejostřejší hranou námořnictva." # todo: NEW TRANSLATION
 CHI_the_yuzhao_pathfinders: "Průzkumníci Jü-čaa" # todo: NEW TRANSLATION
 CHI_the_yuzhao_pathfinders_desc: "Promítání obojživelné síly začíná trupem a brigádou. Výsadková loď typu 071 Jü-čao, navržená v 2000. letech, dává námořnictvu skutečnou oceánskou obojživelnou loď a jsou vytvořeny první specializované brigády námořní pěchoty, které se na ní budou přepravovat. Průzkumníci budoucí expediční síly vyrážejí na moře." # todo: NEW TRANSLATION
 CHI_theaterization_of_command: "Teatralizovat letecké velení" # todo: NEW TRANSLATION
 CHI_theaterization_of_command_desc: "Letouny se musí zodpovídat bojišti, nikoli oddělenému služebnímu řetězci. Letecké velení je začleněno do pěti společných velitelství bojišť, takže stíhačky, bombardéry a drony bojují pod stejným velitelem jako pozemní a námořní síly — jako jediná kampaň namísto tří." # todo: NEW TRANSLATION
 CHI_three_gorges_completion: "Dokončení projektu Tři soutěsky" # todo: NEW TRANSLATION
 CHI_three_gorges_completion_desc: "Přehrada Tři soutěsky na Jang-c’-ťiangu, navržená Sunjatsenem a podporovaná Mao Ce-tungem, je nyní dokončena. S 32 turbínami produkujícími 22,5 GW hydroelektrické kapacity je největší elektrárnou na světě. Projekt vysídlil 1,4 milionu lidí a zatopil dva tisíce archeologických nalezišť, jeho přínosy jsou však skutečné: protipovodňová ochrana, zlepšení plavby a rozhodující zvýšení výroby obnovitelné energie pro střední a západní Čínu." # todo: NEW TRANSLATION
 CHI_three_noc_overseas: "Tři ropné barely míří do zahraničí" # todo: NEW TRANSLATION
 CHI_three_noc_overseas_desc: "CNPC, Sinopec a CNOOC jsou tři ropné barely, jimiž promítáme naši strategii Jít ven. CNPC vrtá v Súdánu prostřednictvím Greater Nile Petroleum Operating Company, získává PetroKazakhstan a uzavírá s Rosněftí dohodu o půjčce za ropu v hodnotě 25 miliard amerických dolarů. Sinopec získává Addax Petroleum a zajišťuje si těžební licence v Angole, Nigérii a Kurdistánu. CNOOC, jíž byla zablokována nabídka na Unocal, úspěšně získává kanadskou společnost Nexen. Podobné dohody následují s PDVSA a Petrobrasem. Každá akvizice je dalším článkem řetězu zajišťujícího naše energetické dodávky." # todo: NEW TRANSLATION
 CHI_three_red_lines_crackdown: "Zásah proti financování nemovitostí" # todo: NEW TRANSLATION
 CHI_three_red_lines_crackdown_desc: "Regulátoři uvalují na developery tři pevné poměrové limity: závazky k aktivům pod 70 procent, čistý dluh k vlastnímu kapitálu pod 100 procent a hotovost ke krátkodobému dluhu nad 100 procent. Evergrande s celkovými závazky přes 300 miliard amerických dolarů porušuje všechny tři a hroutí se; hongkongský soud jej likviduje. Více než 70 procent třiceti největších developerů vstupuje do restrukturalizace. Politika odděluje systémové finanční riziko od bankovního sektoru za cenu prudkého poklesu stavební aktivity a příjmů místních vlád. Cena je vysoká, ale alternativou byla nákaza, kterou bychom nedokázali zadržet." # todo: NEW TRANSLATION
 CHI_three_represents_codified: "Tři zastupování kodifikována" # todo: NEW TRANSLATION
 CHI_three_represents_codified_desc: "Soukromí podnikatelé jsou přijímáni do strany. Šanghajský dodatek nachází své místo v ústavě. Ťiangův odkaz je zpečetěn písemně." # todo: NEW TRANSLATION
 CHI_tiangong_station: "Vesmírná stanice Tchien-kung" # todo: NEW TRANSLATION
 CHI_tiangong_station_desc: "Základní modul Tchien-che vesmírné stanice Tchien-kung byl vypuštěn v dubnu 2021, následovaný vědeckými kabinami Wen-tchien a Meng-tchien v roce 2022. Čína nyní provozuje trvalou pilotovanou orbitální laboratoř zcela nezávislou na Mezinárodní vesmírné stanici, hostí šestiměsíční posádky a rozšiřuje program výzkumu mikrogravitace." # todo: NEW TRANSLATION
 CHI_tianwen_interplanetary: "Meziplanetární sonda Tchien-wen" # todo: NEW TRANSLATION
 CHI_tianwen_interplanetary_desc: "Tchien-wen 1 byla vypuštěna v červenci 2020 a v rámci jediné mise dosáhla oběžné dráhy, vstupu do atmosféry i přistání na povrchu a v květnu 2021 dopravila rover Ču-žung na planinu Utopia Planitia. Čína se stala teprve druhou zemí, která úspěšně provozovala rover na Marsu. Mise prokázala navigaci v hlubokém vesmíru, autonomní vyhýbání se nebezpečím a spojení s vysokým ziskem — vše nezbytné pro pilotované mise za cislunární prostor." # todo: NEW TRANSLATION
 CHI_Tianxia_Realized: "Vše pod nebem" # todo: NEW TRANSLATION
 CHI_Tianxia_Realized_desc: "V Davosu jsme představili vizi otevřeného a inkluzivního globálního řádu ukotveného v multilaterálních institucích a sdílené prosperitě: Společenství sdílené budoucnosti lidstva. Tato vize se nyní uskutečnila nikoli nátlakem, ale nahromaděnou ekonomickou gravitací. Globální rozvojová iniciativa, Asijská banka pro investice do infrastruktury a kvalitní spolupráce v rámci Pásu a stezky přivedly mezinárodní společenství do rámce, který uznává naši ústřední roli z vlastního zájmu. Svět, který nyní vedeme, se rozhodl následovat." # todo: NEW TRANSLATION
 CHI_tiger_and_flies: "Tygři a mouchy" # todo: NEW TRANSLATION
 CHI_tiger_and_flies_desc: "Protikorupční kampaň cílí na vysoké tygry i malé mouchy napříč stranickým aparátem. Čou Jung-kchang, bývalý člen stálého výboru politbyra, dostal doživotí; Po Si-laj padl před ním. Nyní bylo vyšetřováno a potrestáno více než dva miliony funkcionářů. Kampaň je současně skutečnou reformou správy i prostředkem k rozebrání konkurenčních politických sítí — a nemůžeme si dovolit ji nyní zastavit." # todo: NEW TRANSLATION
 CHI_Tonga_Tuna_Concession: "Koncese na tichomořský rybolov" # todo: NEW TRANSLATION
 CHI_Tonga_Tuna_Concession_desc: "Dohody o výhradním přístupu s Tongou, Vanuatu a Fidži poskytují našim rybářským flotilám pro vzdálené vody přednostní práva v rozsáhlých výhradních ekonomických zónách středního a západního Pacifiku. Na oplátku financujeme modernizaci přístavů, chladírenská zařízení a kapacity námořního dohledu, které připoutávají přijímající vlády k dlouhodobé infrastrukturní závislosti. Rybářské dohody představují vedoucí hospodářskou hranu našeho širšího tichomořského angažmá." # todo: NEW TRANSLATION
 CHI_train_as_you_fight: "Cvičit tak, jak bojujete" # todo: NEW TRANSLATION
 CHI_train_as_you_fight_desc: "Cvičení na přehlídkovém náměstí vyhrává přehlídky, nikoli války. Výcvik je přestavěn kolem realistických bojových podmínek, volných cvičení a vyhrazené protivníkovy síly na výcvikové základně Ču-ž'-che, která trestá naskriptovaná vítězství minulosti." # todo: NEW TRANSLATION
 CHI_train_generals: "Vycvičit generály" # todo: NEW TRANSLATION
 CHI_train_generals_desc: "Reformy na papíře umírají bez velitelů, kteří jim rozumějí. Naše akademie se přeorientovávají na výcvik důstojníků ovládajících společné válčení a velení informačního věku a odstraňují politické jmenovance, kteří nedokážou číst moderní bitvu." # todo: NEW TRANSLATION
 CHI_TV_and_Internet_Access: "Přístup k televizi a internetu" # todo: NEW TRANSLATION
 CHI_TV_and_Internet_Access_desc: "Ve 21. století je přístup domácností k vnějšímu světu klíčovým ukazatelem rozvoje. Měli bychom našim africkým partnerům pomoci zajistit přístup k televizi a internetu pro všechny jejich občany." # todo: NEW TRANSLATION
 CHI_TwentyFive_Year_Iran_Accord: "Pětadvacetileté čínsko-íránské partnerství" # todo: NEW TRANSLATION
 CHI_TwentyFive_Year_Iran_Accord_desc: "Naše komplexní strategické partnerství se zavazuje k investicím ve výši 400 miliard amerických dolarů do íránské infrastruktury, energetiky a výroby během 25 let výměnou za zlevněné dodávky ropy. Dohoda poskytuje Teheránu záchranné lano pod americkými sankcemi a nám zlevněné uhlovodíky a předsunutou pozici v Perském zálivu. Washington, Tel Aviv a monarchie Perského zálivu dohodu vnímají jako přímou hrozbu svým regionálním bezpečnostním kalkulacím. Ať si." # todo: NEW TRANSLATION
 CHI_two_centeraries: "19. sjezd strany" # todo: NEW TRANSLATION
 CHI_two_centeraries_desc: "19. celostátní sjezd zapisuje „Myšlenku Si Ťin-pchinga o socialismu s čínskými rysy pro novou éru“ do ústavy strany ještě za Siova života — rozlišení naposledy udělené Mao Ce-tungovi. Dva stoletné cíle vymezují náš horizont: mírně prosperující společnost do roku 2021 a plně rozvinutý socialistický národ do roku 2049. Trajektorie státu pro příští tři desetiletí je nyní stanovena a zdroje každé instituce musí být odpovídajícím způsobem řízeny." # todo: NEW TRANSLATION
 CHI_two_establishments: "Dvě ustanovení" # todo: NEW TRANSLATION
 CHI_two_establishments_desc: "Doktrína „dvou ustanovení“ potvrzuje ústřední postavení soudruha Si Ťin-pchinga v Ústředním výboru strany a vedoucí úlohu Si Ťin-pchingovy myšlenky v životě strany. Kolektivní vedení není zrušeno, ale nově rámováno: stálý výbor projednává, směr však určuje jeden člověk. Strana se pohybuje jako jediné tělo a toto tělo má své centrum." # todo: NEW TRANSLATION
 CHI_two_ocean_fleet: "Flotila dvou oceánů" # todo: NEW TRANSLATION
 CHI_two_ocean_fleet_desc: "Ani hlubina, ani paluba samy o sobě nestačí tomu, co Čína nyní zamýšlí. Spojujeme tiché ponorkové síly a hrdou hladinovou flotilu do jediného námořnictva schopného bojovat současně ve dvou oceánech, Tichém a Indickém, držet přilehlá moře a působit ve vzdálených. Z pobřežní stráže, kterou zdědil Liou Chua-čching, povstává skutečná oceánská mocnost, druhá po jediné — a dohánějící ji." # todo: NEW TRANSLATION
 CHI_two_reaffirmations: "Dvě opětovná potvrzení" # todo: NEW TRANSLATION
 CHI_two_reaffirmations_desc: "Strana znovu potvrzuje dva základní závazky: věrnost socialistické cestě definované Mao Ce-tungovou myšlenkou a prvenství masové linie jako správné metody vedení strany. Nejde o hesla. Jsou to strukturální záruky proti pravicovému odklonu, který dovolil nerovnosti a korupci vyhlodat revoluci zevnitř." # todo: NEW TRANSLATION
 CHI_type_15_light_tank: "Lehký tank typu 15" # todo: NEW TRANSLATION
 CHI_type_15_light_tank_desc: "Těžké obrněnce nemohou dýchat na tibetské náhorní plošině ani překonávat mosty na jihu. ZTQ-15, třicetitunový lehký tank se silným kanónem ráže 105 mm, dává rychlým brigádám skutečné obrnění tam, kam typ 99 nemůže, a nyní hledí do očí Indii podél himálajské hranice." # todo: NEW TRANSLATION
 CHI_type_95_adoption: "Přijmout typ 95" # todo: NEW TRANSLATION
 CHI_type_95_adoption_desc: "QBZ-95, bullpup ráže 5,8 mm přijatý koncem 90. let, nahrazuje zastaralý typ 81 v celé armádě a standardizuje pěchotu na domácí náboj. Jeho nedostatky jsou skutečné, ale do rukou každého vojáka vkládá moderní domácí pušku." # todo: NEW TRANSLATION
 CHI_ultra_low_emission: "Normy ultra nízkých emisí" # todo: NEW TRANSLATION
 CHI_ultra_low_emission_desc: "Ministerstvo ekologie a životního prostředí a MIIT vydaly normy vyžadující, aby aglomerační provozy, koksovny a ocelárny splňovaly emisní prahy přísnější než evropské normy. Více než 80 procent velkých integrovaných výrobců oceli dokončuje modernizaci. Reforma nahrazuje praxi plošných odstávek kolem politických událostí — modrá APEC, modrá přehlídka — trvalou infrastrukturou čistého vzduchu. Už bychom neměli čistit oblohu jen pro výjimečné příležitosti. Měli bychom ji udržovat čistou." # todo: NEW TRANSLATION
 CHI_underground_great_wall: "Podzemní Velká zeď" # todo: NEW TRANSLATION
 CHI_underground_great_wall_desc: "Pod horami budujeme podzemní Velkou zeď — tisíce kilometrů zpevněných tunelů, které ukrývají a chrání naše síly a rakety. Co nelze najít, nelze zničit, a zakopaný arzenál zaručuje, že na každý první úder odpovíme." # todo: NEW TRANSLATION
 CHI_undersea_supremacy: "Podmořská převaha" # todo: NEW TRANSLATION
 CHI_undersea_supremacy_desc: "Budeme vládnout hlubině, nikoli hladině. Prioritou flotily se stávají ponorky: jaderní lovci k ničení letadlových lodí, raketonosné ponorky držící svět v ohrožení a zeď tichých člunů měnící první ostrovní řetězec v past. Ať soupeři předvádějí své velké flotily nahoře; my budeme vlastnit vodu pod nimi a odepřeme jim moře, aniž bychom kdy ukázali stěžeň." # todo: NEW TRANSLATION
 CHI_Unification_Ultimatum: "Ultimátum sjednocení poloostrova" # todo: NEW TRANSLATION
 CHI_Unification_Ultimatum_desc: "Po sladění Pekingu a Washingtonu nastal čas předložit Pchjongjangu volbu: přijmout mírové sjednocení pod Soulem, nebo čelit společné váze čínské, americké a jihokorejské armády. Ultimátum ukončí korejskou otázku tak či onak." # todo: NEW TRANSLATION
 CHI_Vision_2030_Partnership: "Investiční partnerství Vize 2030" # todo: NEW TRANSLATION
 CHI_Vision_2030_Partnership_desc: "Agenda diverzifikace Saúdské Arábie Vize 2030 a naše chuť po kapitálu z Perského zálivu a kontraktech se spojují v rozsáhlém partnerství zahrnujícím čistou energii, turistickou infrastrukturu a pokročilou výrobu. Naše firmy získávají významné kontrakty na projekty NEOM a Rudého moře, zatímco si zajišťujeme přednostní dodávky ropy a rostoucí podíl vypořádání v jüanech. Uspořádání poskytuje Rijádu strategické možnosti, aniž by formálně přerušilo jeho bezpečnostní závislost na Washingtonu." # todo: NEW TRANSLATION
 CHI_wanhua_strategic_materials: "Seznam strategických materiálů" # todo: NEW TRANSLATION
 CHI_wanhua_strategic_materials_desc: "MIIT zveřejnil seznam přibližně 130 chemických materiálů, u nichž zůstáváme závislí na dovozu. Mezi nejkritičtější patří fotorezisty pro litografii, polyimidové fólie, vysokopevnostní uhlíkové vlákno T800 a vyšší a polyuretany MDI a TDI. Wanhua Chemical v Jen-tchaji, která zpětně analyzovala technologii MDI společnosti Mitsui a získala maďarský BorsodChem, prolomila oligopol Bayeru, BASF a Huntsmanu v oblasti polyuretanů. Weihai Guangwei Composites, Jilin Carbon Valley a Sinopec Shanghai Petrochemical budují kapacity uhlíkových vláken pro listy větrných turbín a letecké kompozity. Každá náhrada snižuje naši strukturální expozici vůči zahraničním exportním kontrolám." # todo: NEW TRANSLATION
 CHI_warlord_temptation: "Pokušení vojevůdců" # todo: NEW TRANSLATION
 CHI_warlord_temptation_desc: "Armáda sloužící penězům může být v pokušení sloužit sama sobě. S regiony, příjmy a loajálními jednotkami v rukou se velitelé přibližují nejstaršímu čínskému nebezpečí: síle, která poslouchá své generály před centrem, a republice sklouzávající zpět do věku vojevůdců." # todo: NEW TRANSLATION
 CHI_water_security_initiative: "Národní iniciativa vodní bezpečnosti" # todo: NEW TRANSLATION
 CHI_water_security_initiative_desc: "Nerovnováha mezi severem a jihem Číny je od roku 2002 řešena projektem převodu vody z jihu na sever, největším meziregionálním odklonem vody, jaký kdy byl vybudován. Voda je vedena z povodí Jang-c’-ťiangu do vyprahlé pánve Žluté řeky a regionu hlavního města. Národní tažení za vodní bezpečnost na tomto základu staví a spojuje rozsáhlou infrastrukturu s projekty ochrany vody na úrovni provincií zaměřenými na nejvíce vodou zatížené oblasti severu. Dokončení dostatečného počtu těchto projektů postupně zmírní nedostatek zatěžující národní hospodářství." # todo: NEW TRANSLATION
 CHI_weqi_pipeline_lines: "Plynovod západ–východ" # todo: NEW TRANSLATION
 CHI_weqi_pipeline_lines_desc: "Projekt přenosu plynu západ–východ spojuje Tarimskou pánev v Sin-ťiangu se Šanghají prostřednictvím 4 000 kilometrů dlouhé hlavní trasy; druhá linka vede turkmenský plyn na východ přes Chorgos a třetí z Turkmenistánu přes Kyrgyzstán ji následuje. Plynovod Síla Sibiře, dohodnutý s Vladimirem Putinem v rámci třicetileté smlouvy na 38 miliard kubických metrů ročně, nyní dodává plyn z Chej-lung-ťiangu přímo do naší východní sítě. CNPC a PetroChina řídí výstavbu i provoz v celém rozsahu. Žádná země kontrolující tuto potrubní infrastrukturu nemůže být uškrcena energetickým embargem." # todo: NEW TRANSLATION
 CHI_west_east_gas_pipeline: "Plynovod západ–východ" # todo: NEW TRANSLATION
 CHI_west_east_gas_pipeline_desc: "Plynovod západ–východ vede 4 000 kilometrů z Tarimské pánve v Sin-ťiangu do Šanghaje a byl dokončen v roce 2004. Dodává zemní plyn průmyslovému východu Číny, snižuje závislost na uhlí a urychluje komercializaci uhlovodíkových zásob Sin-ťiangu." # todo: NEW TRANSLATION
 CHI_western_development_strategy: "Strategie rozvoje západu" # todo: NEW TRANSLATION
 CHI_western_development_strategy_desc: "Program Si-pu ta kchaj-fa směruje přednostní investice, daňové pobídky a urychlenou výstavbu infrastruktury do dvanácti západních provincií a autonomních oblastí. Uzavíráme rozdíl mezi pobřežím a vnitrozemím a prohlubujeme integraci se střední a jižní Asií, přitahujeme periferii do svého hospodářského jádra dříve, než prostor zaplní soupeři." # todo: NEW TRANSLATION
 CHI_western_energy_strategy: "Rozvoj energie na západě" # todo: NEW TRANSLATION
 CHI_western_energy_strategy_desc: "Západní provincie Číny ukrývají největší zásoby uhlí, zemního plynu a vodní energie v zemi. Koordinovaná rozvojová strategie spojuje těžbu s pobřežním průmyslovým srdcem, snižuje závislost na dovozu energie a rozšiřuje hospodářskou aktivitu do vnitrozemí." # todo: NEW TRANSLATION
 CHI_western_industrial_drive: "Tažení za průmyslovým rozvojem západu" # todo: NEW TRANSLATION
 CHI_western_industrial_drive_desc: "Státní rada schválila povýšení 169 provinčních průmyslových parků na národní zóny hospodářského a technologického rozvoje, přičemž většina míří do zaostalých západních provincií. Přednostní investice v Jün-nanu, Kuej-čou a západním S’-čchuanu začínají uzavírat příjmový rozdíl s pobřežím a vytvářejí logistické předpoklady pro rozsáhlou vnitrozemskou výrobu. Západ čekal dost dlouho." # todo: NEW TRANSLATION
 CHI_western_institutional_engagement: "Angažmá v západních institucích" # todo: NEW TRANSLATION
 CHI_western_institutional_engagement_desc: "Zeng Čching-chung prosazuje hlubší zapojení do multilaterálních institucí vedených Západem jako nejlepší způsob, jak zajistit naše postavení v mezinárodním řádu, dokud se pravidla stále tvoří. Usilujeme o rozšíření kvóty MMF, přijímáme Mezinárodní standardy účetního výkaznictví ve státních podnicích a zvyšujeme své zastoupení ve správních radách Světové banky. Je lepší utvářet architekturu zevnitř než stát mimo ni." # todo: NEW TRANSLATION
 CHI_western_pipeline_corridor: "Plynovod západ–východ" # todo: NEW TRANSLATION
 CHI_western_pipeline_corridor_desc: "Plynovod západ–východ vede 4 000 kilometrů z Tarimské pánve v Sin-ťiangu přes Kan-su, Šen-si a deltu Jang-c’-ťiangu do Šanghaje. Po dokončení nahradí uhlí v průmyslu delty Jang-c’-ťiangu a sníží částicové znečištění dusící naše nejbohatší pobřežní města, čímž propojí zdroje západu s růstem východu." # todo: NEW TRANSLATION
 CHI_Win_Win_Cooperation: "Společenství sdílené budoucnosti" # todo: NEW TRANSLATION
 CHI_Win_Win_Cooperation_desc: "Po sílící mezinárodní kritice financování dluhových pastí reformujeme naše úvěrové podmínky a zavádíme koncesní sazby, požadavky na místní pracovní sílu a hodnocení udržitelnosti dluhu. Rámování „výhra-výhra“ představuje Pás a stezku jako nástroj vzájemného rozvoje namísto strategické páky a kritici nyní své argumenty hůře obhajují." # todo: NEW TRANSLATION
 CHI_Wolf_Warrior_Diplomacy: "Diplomacie vlčích bojovníků" # todo: NEW TRANSLATION
 CHI_Wolf_Warrior_Diplomacy_desc: "Přijmeme asertivní a konfrontační diplomatický postoj. Naši diplomaté budou agresivně hájit naše zájmy a zpochybňovat západní narativy, kdekoli se s nimi setkají. Cíl je jasný: nahradit Spojené státy jako dominantní globální mocnost." # todo: NEW TRANSLATION
 CHI_wolf_warrior_doctrine: "Diplomacie vlčích bojovníků" # todo: NEW TRANSLATION
 CHI_wolf_warrior_doctrine_desc: "Na našem ministerstvu zahraničí vznikl nový asertivní styl diplomacie. Naši velvyslanci veřejně napadají zahraniční kritiky; státní mluvčí reagují na odsouzení obviněním z pokrytectví a neupřímnosti. Tento přístup opouští Teng Siao-pchingovu doktrínu skrývání síly a vyčkávání ve prospěch přímé konfrontace. Už se neomlouváme a svět začíná chápat, co to znamená." # todo: NEW TRANSLATION
 CHI_Workers_Rights: "Práva pracovníků" # todo: NEW TRANSLATION
 CHI_Workers_Rights_desc: "Dobré životní podmínky jednotlivého pracovníka jsou klíčové pro úspěch národa. Měli bychom podporovat jen projekty, které chrání obživu lidí, bez nichž by nemohli existovat." # todo: NEW TRANSLATION
 CHI_Write_Off_Debts: "Odpustit dluhy" # todo: NEW TRANSLATION
 CHI_Write_Off_Debts_desc: "Nebudeme své partnery držet v dluhové pasti. Musí mít možnost růst a rozvíjet se vlastním tempem." # todo: NEW TRANSLATION
 CHI_ws15_bottleneck_solve: "Prolomit úzké hrdlo WS-15" # todo: NEW TRANSLATION
 CHI_ws15_bottleneck_solve_desc: "Tryskový motor je zdí, o kterou se rozbíjela každá čínská stíhačka, a nutil nás spoléhat na ruské turbíny pro nejlepší draky. Turbodmychadlový motor WS-15 má tuto závislost ukončit a dát J-20 nadzvukový cestovní tah, kolem něhož byl navržen. Zvládnutí lopatky turbíny z monokrystalu je posledním metrem výstupu." # todo: NEW TRANSLATION
 CHI_wto_accession_drive: "Tažení za vstupem do WTO" # todo: NEW TRANSLATION
 CHI_wto_accession_drive_desc: "Po patnácti letech vyjednávání stojíme na prahu formálního členství ve Světové obchodní organizaci. Vstup upevní naše reformy liberalizace obchodu, otevře zahraniční trhy našemu vývozu a urychlí přenos průmyslových technologií do našich rukou." # todo: NEW TRANSLATION
 CHI_wto_commercial_bank_reform: "Reforma zákona o komerčních bankách WTO" # todo: NEW TRANSLATION
 CHI_wto_commercial_bank_reform_desc: "Náš vstup do WTO nás zavazuje otevřít finanční sektor zahraničním bankám a premiér Ču Žung-ťi zahájil před příchodem tohoto termínu tříkrokovou restrukturalizaci. Společnosti pro správu aktiv přebírají stovky miliard nesplácených úvěrů; Central Huijin Investment vkládá kapitál z devizových rezerv; čtyři velké banky se kotují na zahraničních burzách, aby zavedly tržní disciplínu. Revize zákona o komerčních bankách mění čtyři velké banky z politických úvěrových nástrojů ve formálně komerční instituce — rozdíl, na němž bude záležet, až dorazí zahraniční banky." # todo: NEW TRANSLATION
 CHI_wto_implementation: "Provádění WTO" # todo: NEW TRANSLATION
 CHI_wto_implementation_desc: "Náš vstup do WTO nás zavázal k víceletému harmonogramu snižování cel, reforem duševního vlastnictví, otevírání sektoru služeb a odstraňování privilegií státního obchodu. Provádění bylo nerovnoměrné a obchodní partneři jej často napadali u Orgánu pro řešení sporů, proces nás však hluboce integroval do globálních dodavatelských řetězců — a tato integrace je stejně tak zbraní jako povinností." # todo: NEW TRANSLATION
 CHI_wto_implementation_tt: "Pokud dokončíme §Y$CHI_wto_accession_drive$§!, bonus bude lepší a trvalý " # todo: NEW TRANSLATION
 CHI_wuhan_automotive_hub: "Automobilové centrum Wu-chan" # todo: NEW TRANSLATION
 CHI_wuhan_automotive_hub_desc: "Dongfeng Motor Corporation se sídlem ve Wu-chanu rozšiřuje své společné podniky s Peugeot-Citroënem, Nissanem a Hondou. Wu-chan se stává automobilovým hlavním městem střední Číny a kotví klastr dodavatelů komponentů a logistických firem podél Jang-c’-ťiangu." # todo: NEW TRANSLATION
 CHI_xi_jinping_thought_enshrined: "Zakotvení Si Ťin-pchingovy myšlenky" # todo: NEW TRANSLATION
 CHI_xi_jinping_thought_enshrined_desc: "Si Ťin-pchingova myšlenka je povýšena z politického vedení na ústavní doktrínu a povinně studována na univerzitách, vojenských akademiích a stranických školách po celé zemi. Aplikace Xuexi Qiangguo je nainstalována na stovkách milionů telefonů a sleduje se každodenní aktivita. Nesouhlas již není pouze nevítaný; nyní je oficiálně odchylkou od zavedené pravdy. Ideologická architektura státu a jediné jméno již nejsou oddělitelné." # todo: NEW TRANSLATION
 CHI_xinjiang_industrial_zones: "Průmyslový rozvoj Sin-ťiangu" # todo: NEW TRANSLATION
 CHI_xinjiang_industrial_zones_desc: "Speciální průmyslové zóny v Urumči a Tarimské pánvi přitahují migraci Chanů, zpracovatelský průmysl a investice do těžby zdrojů. Zóny mají připoutat hospodářství Sin-ťiangu k východní průmyslové základně a snížit jeho závislost na tradičním zemědělství." # todo: NEW TRANSLATION
 CHI_y20_strategic_lift_program: "Program strategické přepravy Y-20" # todo: NEW TRANSLATION
 CHI_y20_strategic_lift_program_desc: "Velmoc musí být schopna přesunout sama sebe. Y-20 „Kchun-pcheng“, těžký proudový transportní letoun ve službě od roku 2016, konečně dává Číně leteckou přepravní kapacitu k rozmístění vojáků, obrněnců a pomoci napříč kontinenty; jeho tankerové a velitelské varianty násobí dosah celého letectva." # todo: NEW TRANSLATION
 CHI_Yangtze_confederation: "Hospodářská konfederace Jang-c’-ťiangu" # todo: NEW TRANSLATION
 CHI_Yangtze_confederation_desc: "Povodí Jang-c’-ťiangu — od Čchung-čchingu přes Chu-pej a Chu-nan až k ústí řeky v Šanghaji — obsahuje průmyslové srdce Číny. Formální hospodářská konfederace těchto provincií pod koordinovaným plánováním odstraní nadbytečné investice, integruje dodavatelské řetězce a rozšíří čchungčchingský model podél nejproduktivnějšího koridoru národa." # todo: NEW TRANSLATION
 CHI_yangtze_delta_integration: "Integrace delty Jang-c’-ťiangu" # todo: NEW TRANSLATION
 CHI_yangtze_delta_integration_desc: "Koordinované státní investice napříč Šanghají, Ťiang-su a Če-ťiangem prohlubují deltu Jang-c’-ťiangu jako náš hlavní výrobní a vývozní koridor. Koncentrace zahraničního kapitálu a kvalifikované práce zde ukotví růst v příštím desetiletí." # todo: NEW TRANSLATION
 CHI_yangtze_logistics_corridor: "Logistický koridor Jang-c’-ťiangu" # todo: NEW TRANSLATION
 CHI_yangtze_logistics_corridor_desc: "Jang-c’-ťiang přepravuje více nákladu než kterákoli jiná vnitrozemská vodní cesta na světě. Investice do přístavní infrastruktury, zlepšování plavby a intermodálních terminálů integrují řeku do národních dodavatelských řetězců a spojují S’-čchuan se Šanghají za zlomek nákladů silniční dopravy." # todo: NEW TRANSLATION
 CHI_yj12_standoff_family: "Rodina střel pro útok z odstupu YJ-12" # todo: NEW TRANSLATION
 CHI_yj12_standoff_family_desc: "YJ-12 poskytuje našim letounům nadzvukovou protilodní střelu letící těsně nad hladinou, která se přibližuje příliš rychle, než aby většina obran stihla odpovědět. Zavěšená pod bombardéry a stíhačkami ohrožuje každou válečnou loď ve stovkách kilometrů od čínského pobřeží." # todo: NEW TRANSLATION
 CHI_youth_league_pipeline: "Kanál Svazu mládeže" # todo: NEW TRANSLATION
 CHI_youth_league_pipeline_desc: "Komunistický svaz mládeže je hlavním zdrojem talentů pro frakci Chu Ťin-tchaa. Absolventi svazu drží většinu postů provinčních tajemníků a dominují středním pozicím v centrálních ministerstvech a vytvářejí celostátní síť funkcionářů spojených společnou organizační zkušeností. Ti, kdo stoupají jeho řadami, vděčí za svůj postup stejnému systému." # todo: NEW TRANSLATION
 CHI_yuan_internationalisation: "Internacionalizace jüanu" # todo: NEW TRANSLATION
 CHI_yuan_internationalisation_desc: "Globální finanční krize odhalila křehkost dolaru a poskytla nám příležitost. Bilaterální dohody o měnových swapech s desítkami centrálních bank, offshore clearingová centra jüanu v Hongkongu a Singapuru a trh dim sum dluhopisů daly našemu renminbi první významný mezinárodní oběh. Rezervní prémie dolaru nepřežije navždy." # todo: NEW TRANSLATION
 CHI_yuanhua_model: "Model Jüan-chua" # todo: NEW TRANSLATION
 CHI_yuanhua_model_desc: "Laj Čchang-sing ukázal, jak se to dělá. Z Sia-menu jeho impérium Jüan-chua v 90. letech propašovalo ropu, automobily a cigarety v hodnotě přibližně deseti miliard dolarů a kdykoli se celníci přiblížili, objevil se mocný důstojník, aby je odehnal. Jeho uspořádání měníme v systém: armáda pašeráka chrání a pašerák armádě platí." # todo: NEW TRANSLATION
 CHI_yuzhao_hull_coral_brigades: "Trup Jü-čao a korálové brigády" # todo: NEW TRANSLATION
 CHI_yuzhao_hull_coral_brigades_desc: "Obojživelná ambice se mění z průzkumníka ve flotilu. Typ 071 vstupuje do sériové výroby a námořní pěchota se rozrůstá ze dvou brigád na šest, vycvičených pro sporné útesy a ostrovy Jihočínského moře. Trup a korálová brigáda rostou společně v sílu schopnou obsadit pobřeží." # todo: NEW TRANSLATION
 CHI_zb108_wheeled_family: "Kolová rodina typu 08" # todo: NEW TRANSLATION
 CHI_zb108_wheeled_family_desc: "Rodina typu 08 v uspořádání 8×8, od bojového vozidla pěchoty přes útočné dělo až po sanitku, dává středním brigádám jediný kolový podvozek rychlý na silnicích a levný na provoz — mobilní jádro čínských sil rychlého nasazení." # todo: NEW TRANSLATION
 CHI_zbd04_apex_ifv: "Vrcholné bojové vozidlo pěchoty ZBD-04A" # todo: NEW TRANSLATION
 CHI_zbd04_apex_ifv_desc: "ZBD-04A je hlavní pásové bojové vozidlo pěchoty armády. Nese 100mm kanónomet, 30mm kanón a celé družstvo pod pancířem. Je páteří těžkých mechanizovaných brigád a partnerem typu 99 na čínsko-indické linii." # todo: NEW TRANSLATION
 CHI_zbd_mechanisation: "Mechanizace ZBD" # todo: NEW TRANSLATION
 CHI_zbd_mechanisation_desc: "Pěchota musí držet krok s obrněnci. Pásová rodina bojových vozidel ZBD přepravuje střelce vpřed pod pancířem a bojuje po boku tanků, čímž dokončuje mechanizaci těžkých brigád." # todo: NEW TRANSLATION
 CHI_zeng_qinghong_reign: "Éra Zeng Čching-chunga" # todo: NEW TRANSLATION
 CHI_zeng_qinghong_reign_desc: "Zeng Čching-chung, hlavní stratég šanghajské kliky, působí jako viceprezident a vedoucí Ústřední stranické školy. Jeho kontrola nad organizačním oddělením a Ústředním sekretariátem mu dává rozhodující vliv nad personálními jmenováními na všech úrovních stranicko-státního aparátu. Ty, které dosadí, vlastní." # todo: NEW TRANSLATION
 CHI_zero_hour: "Nultá hodina" # todo: NEW TRANSLATION
 CHI_zero_hour_desc: "Armáda roky cvičila, přezbrojovala a čekala a hodina přišla, aby se to vše využilo. Naše pěchota postoupí v počtech, které žádná obranná linie nevstřebá, naše obrněné kolony ve formacích příliš hlubokých na odvrácení, zatímco strategické raketové síly čekají v silech jako argument, který nikdy nechceme být nuceni použít. Od této hodiny se Lidová osvobozenecká armáda přestává připravovat na příští válku a začíná ji očekávat; každé velení konečně odpovídá jediné vůli." # todo: NEW TRANSLATION
 CHI_ztz96_mainstreaming: "Rozšířit typ 96" # todo: NEW TRANSLATION
 CHI_ztz96_mainstreaming_desc: "Ne každá brigáda potřebuje drahý typ 99. Levnější a lehčí ZTZ-96 se vyrábí ve velkém a postupně modernizuje na 96A a 96B, čímž se stává pracovním tankem doplňujícím tělo obrněných sil." # todo: NEW TRANSLATION
 CHI_ztz99_rollout: "Zavést typ 99" # todo: NEW TRANSLATION
 CHI_ztz99_rollout_desc: "ZTZ-99 se stává hrotem těžkých brigád — hlavním bojovým tankem třetí generace s kompozitním pancířem, kanónem ráže 125 mm a laserovým obranným systémem. Je prvním čínským tankem postaveným tak, aby se za rovných podmínek utkal s nejlepšími stroji Západu a Ruska." # todo: NEW TRANSLATION
 CHI_ztz99a_apex: "Vrcholný typ 99A" # todo: NEW TRANSLATION
 CHI_ztz99a_apex_desc: "ZTZ-99A, zavedený od roku 2011, je vrcholem této řady: silnější pancíř, vylepšený motor, zaměřovač lovec-zabiják a kompletní systém řízení boje, který z něj činí uzel brigádní sítě. Je to nejtěžší pěst, kterou může armáda vrhnout." # todo: NEW TRANSLATION
 arctic_observer_status: "Status arktického pozorovatele" # todo: NEW TRANSLATION
 arctic_observer_status_desc: "Naše místo v Arktické radě a infrastruktura Polární hedvábné stezky otevírají nové námořní trasy a hranice zdrojů na dalekém severu." # todo: NEW TRANSLATION
 CHI_610_directive_active: "Směrnice 610 pro severovýchod" # todo: NEW TRANSLATION
 CHI_610_directive_active_desc: "Severovýchodní velitelství KS Číny aktivovalo protokoly nouzové mobilizace. Bezpečnostní síly podél řeky Jalu jsou posíleny a provinční úřady působí pod rozšířenými nouzovými pravomocemi." # todo: NEW TRANSLATION
 CHI_aiib_dividend_member: "Člen s dividendami AIIB" # todo: NEW TRANSLATION
 CHI_aiib_dividend_member_desc: "Zakládající členství v Asijské bance pro investice do infrastruktury přináší stabilní výnosy. Investiční výplaty a zvýhodněné obchodní podmínky s projekty financovanými Čínou posilují naši bilanci." # todo: NEW TRANSLATION
 CHI_anti_corruption_purge: "Protikorupční čistka" # todo: NEW TRANSLATION
 CHI_anti_corruption_purge_desc: "Ústřední komise pro disciplinární inspekci každoročně zpracovává tisíce případů. Korupce při nákupech, výstavbě a řízení státních podniků je odhalována a trestána. Funkcionáři, kteří vybírali rentu z každé smlouvy, zjišťují, že politický kalkul se změnil. Výstup na státní funkci roste, zatímco patronátní sítě jsou rozebírány a nahrazovány přímou odpovědností." # todo: NEW TRANSLATION
 CHI_anti_terror_crackdown_idea: "Protiteroristický zásah" # todo: NEW TRANSLATION
 CHI_anti_terror_crackdown_idea_desc: "Bezpečnostní služby provádějí celostátní operaci proti teroristickým sítím. Detekční kapacita se zvyšuje, zatímco politická kapacita je pohlcena zásahem." # todo: NEW TRANSLATION
 CHI_army_reorganisation_disruption_idea: "Reorganizace armády" # todo: NEW TRANSLATION
 CHI_army_reorganisation_disruption_idea_desc: "Třináct skupinových armád je přečíslováno a přestavěno kolem brigád kombinovaných zbraní. Během reorganizace trpí organizace i útočná síla a výcvik se hromadí. Jakmile se nová struktura ustálí, pozemní síly budou štíhlejší a schopnější než dříve." # todo: NEW TRANSLATION
 CHI_asian_century_concord_idea: "Dohoda asijského století" # todo: NEW TRANSLATION
 CHI_asian_century_concord_idea_desc: "Peking a Nové Dillí se dohodly na koordinaci v regionálních a globálních záležitostech a rámují jednadvacáté století jako století Asie, které budou utvářet společně." # todo: NEW TRANSLATION
 CHI_AUS_pacific_deterrence: "Zvýšené tichomořské odstrašení" # todo: NEW TRANSLATION
 CHI_AUS_pacific_deterrence_desc: "Čínský tlak na základny v jižním Pacifiku si vynutil naléhavé rozšíření dosahu Královského australského námořnictva. Nové senzory, přesnější zpravodajství a připravené obojživelné kapacity jsou v pohotovosti." # todo: NEW TRANSLATION
 CHI_ban_strategic_partnership: "Strategické partnerství s Pekingem" # todo: NEW TRANSLATION
 CHI_ban_strategic_partnership_desc: "Bangladéš slaďuje svůj zahraničněpolitický postoj s Čínou napříč multilaterálními fóry." # todo: NEW TRANSLATION
 CHI_banking_modernised_idea: "Rekapitalizovaný bankovní sektor" # todo: NEW TRANSLATION
 CHI_banking_modernised_idea_desc: "Státní banky byly očištěny od nesplácených úvěrů a kotovány s menšinovými zahraničními akcionáři na hongkongské burze. Mezinárodní účetní standardy, externí audit a tržní disciplína zlepšují efektivitu a důvěryhodnost sektoru." # todo: NEW TRANSLATION
 CHI_beidou_global_constellation: "Globální konstelace Pej-tou" # todo: NEW TRANSLATION
 CHI_beidou_global_constellation_desc: "S pozemními stanicemi rozmístěnými napříč Latinskou Amerikou nyní satelitní síť Pej-tou poskytuje komplexní globální pokrytí. Námořní operace, průzkum a kontrarozvědka těží z její přesnosti a dosahu." # todo: NEW TRANSLATION
 CHI_beijing_communique_guarantor: "Garant Pekingského komuniké" # todo: NEW TRANSLATION
 CHI_beijing_communique_guarantor_desc: "Čínská role při zprostředkování míru mezi dvěma regionálními rivaly posílila její postavení odpovědné mocnosti. Diplomatický kapitál proudí volně a vztahy se snadněji udržují." # todo: NEW TRANSLATION
 CHI_blue_national_soil: "Modrá národní půda" # todo: NEW TRANSLATION
 CHI_blue_national_soil_desc: "Oficiální doktrína ČLR označující mořský prostor uvnitř linie devíti čárek za „modrou národní půdu“: námořní území stejně neodcizitelné jako kterákoli pozemská provincie. Toto rámování politicky znemožňuje ústupky a každou zahraniční přítomnost předefinovává jako narušení." # todo: NEW TRANSLATION
 CHI_blue_national_soil_militarised: " militarizovaná modrá národní půda" # todo: NEW TRANSLATION
 CHI_blue_national_soil_militarised_desc: "To, co začalo jako správní doktrína, se stalo operačním postojem. Prostředky PLAN a pobřežní stráže nyní aktivně vynucují nárok na modrou národní půdu a zacházejí s průniky zahraničních plavidel jako s porušením čínského domácího práva." # todo: NEW TRANSLATION
 CHI_bo_ideological_consolidation: "Ideologická konsolidace" # todo: NEW TRANSLATION
 CHI_bo_ideological_consolidation_desc: "Kampaň ideologického vyjasnění posiluje socialistické závazky strany a čelí pravicovému odklonu. Studijní zasedání, nápravné schůze a revidované vzdělávací osnovy zakotvují dvě opětovná potvrzení napříč státním aparátem." # todo: NEW TRANSLATION
 CHI_bri_forum_momentum: "Dynamika fóra Pásu a stezky" # todo: NEW TRANSLATION
 CHI_bri_forum_momentum_desc: "Tříleté fórum Pásu a stezky v Pekingu znovu potvrdilo čínský závazek ke globalizaci založené na infrastruktuře. Zahraniční delegace odjíždějí s novými závazky a naše ekonomická diplomacie sklízí víceletou dividendu." # todo: NEW TRANSLATION
 CHI_bri_forum_surge: "Nárůst fóra Pásu a stezky" # todo: NEW TRANSLATION
 CHI_bri_forum_surge_desc: "Závazky podepsané na tříletém fóru umožňují Pekingu v příštích třech letech současně realizovat o dva projekty více. S větším počtem volných míst může v každém okamžiku stavět více partnerských států." # todo: NEW TRANSLATION
 CHI_bri_industrial_zones_tier_1_idea: "Speciální ekonomické zóny I" # todo: NEW TRANSLATION
 CHI_bri_industrial_zones_tier_1_idea_desc: "Speciální ekonomické zóny v zahraničí vybudované podle čínského vzoru rozšiřují naši výrobní základnu za hranice." # todo: NEW TRANSLATION
 CHI_bri_industrial_zones_tier_2_idea: "Speciální ekonomické zóny II" # todo: NEW TRANSLATION
 CHI_bri_industrial_zones_tier_2_idea_desc: "Zámořské zóny dozrály v fungující průmyslové parky a stavební odbornost se vrací do domácích stavebních programů." # todo: NEW TRANSLATION
 CHI_bri_industrial_zones_tier_3_idea: "Speciální ekonomické zóny III" # todo: NEW TRANSLATION
 CHI_bri_industrial_zones_tier_3_idea_desc: "Síť průmyslových parků spravovaných Čínou kotví partnerské ekonomiky v našich dodavatelských řetězcích a stavebním průmyslu." # todo: NEW TRANSLATION
 CHI_bri_mines_tier_1_idea: "Koncese na zdroje I" # todo: NEW TRANSLATION
 CHI_bri_mines_tier_1_idea_desc: "Těžební koncese zajištěné úvěry partnerským státům dodávají suroviny zpět čínskému průmyslu." # todo: NEW TRANSLATION
 CHI_bri_mines_tier_2_idea: "Koncese na zdroje II" # todo: NEW TRANSLATION
 CHI_bri_mines_tier_2_idea_desc: "Portfolio koncesí se rozšířilo do několika těžebních odvětví a prohloubilo zdrojovou základnu dostupnou našemu hospodářství." # todo: NEW TRANSLATION
 CHI_bri_mines_tier_3_idea: "Koncese na zdroje III" # todo: NEW TRANSLATION
 CHI_bri_mines_tier_3_idea_desc: "Čínské firmy drží kontrolní podíly v těžebním sektoru partnerských zemí a přebytek nad naše vlastní potřeby prodávají s přirážkou." # todo: NEW TRANSLATION
 CHI_bri_pipelines_tier_1_idea: "Energetické tepny I" # todo: NEW TRANSLATION
 CHI_bri_pipelines_tier_1_idea_desc: "Potrubí partnerských států zásobující čínské rafinerie snižuje naši expozici vůči námořním energetickým úzkým místům." # todo: NEW TRANSLATION
 CHI_bri_pipelines_tier_2_idea: "Energetické tepny II" # todo: NEW TRANSLATION
 CHI_bri_pipelines_tier_2_idea_desc: "Rozšířená kapacita potrubí a související zásobníky nám umožňují čerpat více paliva a zároveň ho více držet v rezervě." # todo: NEW TRANSLATION
 CHI_bri_pipelines_tier_3_idea: "Energetické tepny III" # todo: NEW TRANSLATION
 CHI_bri_pipelines_tier_3_idea_desc: "Pozemní energetické tepny nyní zcela obcházejí námořní úzká místa a skladovací infrastruktura k jejich využití se buduje rychlým tempem." # todo: NEW TRANSLATION
 CHI_bri_ports_tier_1_idea: "Námořní síť I" # todo: NEW TRANSLATION
 CHI_bri_ports_tier_1_idea_desc: "Kontejnerové terminály provozované Čínou nyní odbavují významný podíl obchodu partnerských států podél námořní trasy a posilují naše obchodní postavení u národů, jimiž přepravujeme." # todo: NEW TRANSLATION
 CHI_bri_ports_tier_2_idea: "Námořní síť II" # todo: NEW TRANSLATION
 CHI_bri_ports_tier_2_idea_desc: "Koncese na terminály se rozšířily ve smlouvy na úplný rozvoj přístavů. Loděnice a kotviště, která naši dodavatelé stavějí v zahraničí, zdokonalují jejich odbornost využitelnou při domácí námořní výstavbě." # todo: NEW TRANSLATION
 CHI_bri_ports_tier_3_idea: "Námořní síť III" # todo: NEW TRANSLATION
 CHI_bri_ports_tier_3_idea_desc: "Řetězec obchodních přístavů, z nichž několik má dvojí využití a zásobovací zařízení, nyní pokrývá námořní trasy. Čínská plavba dosahuje dál — a s ní i flotila, která ji chrání." # todo: NEW TRANSLATION
 CHI_bri_powerplants_tier_1_idea: "Síť výroby energie I" # todo: NEW TRANSLATION
 CHI_bri_powerplants_tier_1_idea_desc: "Výrobní kapacita vybudovaná v zahraničí čínskými dodavateli udržuje průmysl partnerů v chodu za našich podmínek a naše vlastní elektrárny díky zkušenostem fungují lépe." # todo: NEW TRANSLATION
 CHI_bri_powerplants_tier_2_idea: "Síť výroby energie II" # todo: NEW TRANSLATION
 CHI_bri_powerplants_tier_2_idea_desc: "Širší portfolio zámořských elektráren udržuje doma vyšší průmyslovou propustnost." # todo: NEW TRANSLATION
 CHI_bri_powerplants_tier_3_idea: "Síť výroby energie III" # todo: NEW TRANSLATION
 CHI_bri_powerplants_tier_3_idea_desc: "Čínské inženýrství se stalo výchozím dodavatelem výroby energie v celé partnerské síti a domácí průmyslový výstup tomu odpovídá." # todo: NEW TRANSLATION
 CHI_bri_prestige_tier_1_idea: "Prestižní diplomacie I" # todo: NEW TRANSLATION
 CHI_bri_prestige_tier_1_idea_desc: "Viditelné investice v partnerských státech nám kupují pověst stavitele namísto věřitele." # todo: NEW TRANSLATION
 CHI_bri_prestige_tier_2_idea: "Prestižní diplomacie II" # todo: NEW TRANSLATION
 CHI_bri_prestige_tier_2_idea_desc: "O Pásu a stezce se hovoří jako o veřejném dobru. Udržování přátelských vztahů nás stojí méně než dříve." # todo: NEW TRANSLATION
 CHI_bri_prestige_tier_3_idea: "Prestižní diplomacie III" # todo: NEW TRANSLATION
 CHI_bri_prestige_tier_3_idea_desc: "Peking je nyní partnerem první volby ve velké části rozvojového světa a postavení, které to přináší, se přímo promítá do politického kapitálu doma." # todo: NEW TRANSLATION
 CHI_bri_railways_tier_1_idea: "Pozemní koridory I" # todo: NEW TRANSLATION
 CHI_bri_railways_tier_1_idea_desc: "Přeshraniční železnice připoutávají partnerské ekonomiky k čínskému průmyslu a náklad přepravovaný po těchto trasách nám získává přízeň států, jimž slouží." # todo: NEW TRANSLATION
 CHI_bri_railways_tier_2_idea: "Pozemní koridory II" # todo: NEW TRANSLATION
 CHI_bri_railways_tier_2_idea_desc: "Koridory nyní fungují jako pravidelné nákladní tepny. Spolehlivá pozemní přeprava udržuje naše síly zásobované tam, kde je přístup po moři nejistý." # todo: NEW TRANSLATION
 CHI_bri_railways_tier_3_idea: "Pozemní koridory III" # todo: NEW TRANSLATION
 CHI_bri_railways_tier_3_idea_desc: "Souvislá pozemní síť zasahuje hluboko do vnitrozemí pevniny. Naše železniční ženijní sbory stavějí doma rychleji díky zkušenostem získaným v zahraničí." # todo: NEW TRANSLATION
 CHI_bri_telecom_tier_1_idea: "Digitální hedvábná stezka I" # todo: NEW TRANSLATION
 CHI_bri_telecom_tier_1_idea_desc: "Síťové páteře vybudované Čínou v partnerských státech dávají našim službám přehled o provozu, který jimi prochází, a zvyšují naši odolnost vůči průniku zahraničních zpravodajských služeb." # todo: NEW TRANSLATION
 CHI_bri_telecom_tier_2_idea: "Digitální hedvábná stezka II" # todo: NEW TRANSLATION
 CHI_bri_telecom_tier_2_idea_desc: "Kontrola nad vrstvou vybavení v partnerských sítích snižuje náklady na udržování našich vlastních operací v zahraničí." # todo: NEW TRANSLATION
 CHI_bri_telecom_tier_3_idea: "Digitální hedvábná stezka III" # todo: NEW TRANSLATION
 CHI_bri_telecom_tier_3_idea_desc: "Digitální koridor je náš od začátku do konce: hardware, páteřní síť i kabelová přistání. Zahraniční provoz, který jím prochází, není ani soukromý, ani před námi bezpečný." # todo: NEW TRANSLATION
 CHI_brokered_non_aggression_pact: "Pekingsky zprostředkovaný pakt o neútočení" # todo: NEW TRANSLATION
 CHI_brokered_non_aggression_pact_desc: "Čína vystupuje jako garant našeho ujednání o neútočení s regionálním rivalem. Dokud pakt trvá, obě strany těží ze stability a vřelejších vztahů s Pekingem." # todo: NEW TRANSLATION
 CHI_cadre_evaluation_reform_idea: "Komplexní reforma hodnocení kádrů" # todo: NEW TRANSLATION
 CHI_cadre_evaluation_reform_idea_desc: "Funkcionáři jsou nyní hodnoceni podle péče o životní prostředí, společenské harmonie a poskytování veřejných služeb vedle růstu HDP. Menší závislost na výrobě náročné na fosilní paliva a úspornější veřejné výdaje odrážejí odpovědnější správní třídu." # todo: NEW TRANSLATION
 CHI_cai_active_phase: "Komplexní dohoda EU o investicích" # todo: NEW TRANSLATION
 CHI_cai_active_phase_desc: "Komplexní dohoda o investicích je v aktivní fázi. Evropské trhy jsou čínskému vývozu a investicím široce otevřené, náklady na spotřební zboží klesají a naše průmyslová kapacita se výrazně rozšiřuje." # todo: NEW TRANSLATION
 CHI_cai_residual: "Trvalé dědictví CAI" # todo: NEW TRANSLATION
 CHI_cai_residual_desc: "I po skončení aktivní fáze Komplexní dohody o investicích přetrvává strukturální integrace s evropskými trhy. Obchodní vztahy zůstávají vřelejší, než by jinak byly." # todo: NEW TRANSLATION
 CHI_central_political_commission_1: "Ústřední komise pro politické a právní záležitosti" # todo: NEW TRANSLATION
 CHI_central_political_commission_1_desc: "Ústřední komise pro politické a právní záležitosti dohlíží na soudy, prokuraturu, veřejnou bezpečnost a státní bezpečnostní orgány. Jejím hlavním posláním je udržovat domácí pořádek a zajišťovat, aby právní systém sloužil cílům strany namísto fungování jako nezávislá kontrola. S růstem jejího postavení ve výboru se výrazně zlepšuje schopnost komise předcházet nepokojům, efektivně zpracovávat nesouhlas a koordinovat bezpečnostní reakce napříč agenturami." # todo: NEW TRANSLATION
 CHI_china_shipbuilding_industry_corporation_naval_manufacturer: "China Shipbuilding Industry Corporation - Naval Manufacturer" # todo: NEW TRANSLATION
 CHI_chinese_dream_momentum: "Dynamika čínského snu" # todo: NEW TRANSLATION
 CHI_chinese_dream_momentum_desc: "Narativ čínského snu mobilizuje veřejný pocit národního poslání. Občané jsou vyzýváni ke službě kolektivní obnově; stranické orgány hlásí prudký nárůst dotazů na narukování a veřejných projevů vlasteneckého cítění. Prozatím je příběh působivější než cíl." # todo: NEW TRANSLATION
 CHI_chongqing_model_idea: "Čchungčchingský model" # todo: NEW TRANSLATION
 CHI_chongqing_model_idea_desc: "Státní podniky kotví investice a udávají tempo širšímu hospodářství. Znárodněná aktiva poskytují fiskální základnu pro sociální výdaje bez závislosti na zahraničním kapitálu nebo daňových příjmech soukromého sektoru." # todo: NEW TRANSLATION
 CHI_commercial_bank_law_idea: "Provádění zákona o komerčních bankách" # todo: NEW TRANSLATION
 CHI_commercial_bank_law_idea_desc: "Revize zákona o komerčních bankách z roku 2003 ukládají čtyřem velkým bankám kapitálovou přiměřenost podle Basileje, standardy klasifikace rizik a nezávislé správní rady. Regulační náklady během přechodu rostou, ale přidělování úvěrů se poprvé vymyká přímé politické kontrole." # todo: NEW TRANSLATION
 CHI_common_prosperity_framework: "Rámec společné prosperity" # todo: NEW TRANSLATION
 CHI_common_prosperity_framework_desc: "Regulační zásahy do soukromého vzdělávání, zábavy a technologií doprovázejí rozšířené státní investice do zdravotnictví, venkovské infrastruktury a sociálního pojištění. Strana tvrdí, že prosperita se stává společnou; mechanismem je, že stát určuje, co prosperita znamená a kdo ji získá jako první." # todo: NEW TRANSLATION
 CHI_cpec_partner: "Čínsko-pákistánský hospodářský koridor" # todo: NEW TRANSLATION
 CHI_cpec_partner_desc: "Investiční balíček CPEC proměňuje pákistánskou infrastrukturu; dálnice, energetické projekty a průmyslové zóny financované Čínou urychlují hospodářskou aktivitu." # todo: NEW TRANSLATION
 CHI_crrc_idea1: "China Railway Rolling Stock Corporation" # todo: NEW TRANSLATION
 CHI_crrc_idea1_desc: "China Railway Rolling Stock Corporation, největší dodavatel železničního vybavení na světě, pohání domácí výstavbu tratí a terminálů i vývoz čínských kolejových vozidel do zahraničí." # todo: NEW TRANSLATION
 CHI_defiance_of_china: "Vzdor vůči Číně" # todo: NEW TRANSLATION
 CHI_defiance_of_china_desc: "Stát odmítl čínské požadavky, odolal ekonomickému tlaku a zachoval svůj postoj ke sporným útvarům. Tento akt vzdoru přináší významnou domácí prestiž a může povzbudit další regionální aktéry, aby své postoje také zostřili." # todo: NEW TRANSLATION
 CHI_diaoyu_patrol_regime: "Režim hlídek Tiao-jü" # todo: NEW TRANSLATION
 CHI_diaoyu_patrol_regime_desc: "Nepřetržité rotace pobřežní stráže ve sporných vodách cvičí námořní posádky v realistických podmínkách." # todo: NEW TRANSLATION
 CHI_digital_governance_spirit: "Digitální správa" # todo: NEW TRANSLATION
 CHI_digital_governance_spirit_desc: "Integrované datové systémy propojují městské sledovací sítě, monitorování finančních transakcí a skóre sociálního kreditu do jednotné infrastruktury dodržování pravidel. Místní vlády zpracovávají správní žádosti digitálně a vynucují standardy prostřednictvím automatického označování. Byrokratické rozhraní mezi občanem a státem je zjednodušeno a stát je přítomen v každém kontaktním místě." # todo: NEW TRANSLATION
 CHI_distant_water_fishing_fleets: "Flotila pro rybolov ve vzdálených vodách" # todo: NEW TRANSLATION
 CHI_distant_water_fishing_fleets_desc: "Naše flotila pro vzdálené vody, dotovaná Pekingem a podporovaná státními podniky, je největší na světě a působí ve výhradních ekonomických zónách západní Afriky, Jižní Ameriky a jižního Pacifiku. Kromě potravinové bezpečnosti plavidla promítají trvalou námořní přítomnost ve vodách daleko od našeho pobřeží a posilují zásadu, že čínské zájmy sahají všude, kam plují čínské lodě." # todo: NEW TRANSLATION
 CHI_divestiture_transition_idea: "Přechod odprodeje" # todo: NEW TRANSLATION
 CHI_divestiture_transition_idea_desc: "Vynutit armádu, aby opustila své komerční příjmy a přešla na státní rozpočet, vytváří mezeru, kterou žádné přidělení prostředků přes noc neuzavře. Jednotky zvyklé financovat se hotely, farmami a obchodními složkami nyní musí čekat na Peking a politický kapitál se vynakládá na uhlazení ztráty. Napětí poleví, jakmile bude obranný sektor reorganizován do soběstačně financovaných konglomerátů." # todo: NEW TRANSLATION
 CHI_dragon_king_ascendant: "Dračí král povstává" # todo: NEW TRANSLATION
 CHI_dragon_king_ascendant_desc: "Lung Wang — Dračí král — je v čínské kosmologii tradičním panovníkem čtyř moří. Po formálním uplatnění tributárního systému a upevnění vojenské přítomnosti uznává Jižní moře pouze jednoho panovníka: Peking." # todo: NEW TRANSLATION
 CHI_eda_grey_market_idea: "Získávání EDA přes šedé kanály" # todo: NEW TRANSLATION
 CHI_eda_grey_market_idea_desc: "Domácí bezvýrobní firmy získávají postupy Synopsysu a Cadence prostřednictvím krycích společností v jihovýchodní Asii. Tape-outy fungují, dodávky jsou však nespolehlivé a aktualizace nástrojů zaostávají za licencovaným trhem o celé měsíce." # todo: NEW TRANSLATION
 CHI_eight_points_doctrine: "Osm bodů k Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_eight_points_doctrine_desc: "Osmičlánkový návrh Ťiang Ce-mina poskytuje formální doktrinální rámec politiky přes průliv, kombinuje nabídky mírového sjednocení s výslovnými varováními před de iure nezávislostí. Vojenské plánování nouzových operací probíhá souběžně s diplomatickou cestou a dává Pekingu důvěryhodný donucovací nástroj." # todo: NEW TRANSLATION
 CHI_etim_designation: "Rámec označení ETIM" # todo: NEW TRANSLATION
 CHI_etim_designation_desc: "Bilaterální protiteroristický rámec cílí na separatistické sítě Východního Turkestánu." # todo: NEW TRANSLATION
 CHI_eu_market_access: "Komplexní přístup na trh EU" # todo: NEW TRANSLATION
 CHI_eu_market_access_desc: "Ratifikace komplexního investičního rámce s Bruselem otevírá hluboký přístup na evropské spotřebitelské a kapitálové trhy, zvyšuje vývozní limity a zmírňuje politické klima pro čínské firmy v celém bloku." # todo: NEW TRANSLATION
 CHI_grey_society_crisis_idea: "Krize šedé společnosti" # todo: NEW TRANSLATION
 CHI_grey_society_crisis_idea_desc: "Čínská generace po politice jednoho dítěte nyní nese převrácenou věkovou pyramidu. Zmenšující se pracovní síla musí financovat rostoucí počet důchodců, vyčerpává rozpočty na důchody a zdravotnictví, zatímco růst produktivity stagnuje. Zátěž poleví teprve po stabilizaci populace v produktivním věku." # todo: NEW TRANSLATION
 CHI_guarantor_of_korean_peace: "Garant korejského míru" # todo: NEW TRANSLATION
 CHI_guarantor_of_korean_peace_desc: "Peking je v celém regionu uznáván jako nepostradatelný garant korejské stability. Prestiž, kterou to přináší, přežije jakoukoli jednotlivou vládu." # todo: NEW TRANSLATION
 CHI_gwadar_basing_rights: "Práva na základnu v Gvádaru" # todo: NEW TRANSLATION
 CHI_gwadar_basing_rights_desc: "Přístup k hlubokovodním zařízením v Gvádaru rozšiřuje operační dosah námořnictva Lidové osvobozenecké armády napříč Indickým oceánem a Arabským mořem." # todo: NEW TRANSLATION
 CHI_ideological_rectification: "Ideologická náprava" # todo: NEW TRANSLATION
 CHI_ideological_rectification_desc: "Zákazy dokumentu č. 9 jsou vynucovány prostřednictvím povinných studijních zasedání a kampaní sebekritiky na univerzitách, v mediálních organizacích a státních podnicích. Hranice přijatelného diskurzu se rychle zužují. Loajalita se prokazuje odmítnutím západních liberálních pojmů a zdi ideologického perimetru se zpevňují proti zahraničnímu vlivu." # todo: NEW TRANSLATION
 CHI_informal_sanctions: "Neformální sankce THAAD" # todo: NEW TRANSLATION
 CHI_informal_sanctions_desc: "V reakci na rozmístění THAAD jsme uvalili na Jižní Koreu neformální ekonomické sankce. Čínští turisté jsou odkláněni, korejské zboží čelí netarifním překážkám a korejské podniky působící na našem území hlásí úřední šikanu." # todo: NEW TRANSLATION
 CHI_information_warfare: "Aparát informační války" # todo: NEW TRANSLATION
 CHI_information_warfare_desc: "Státní média a digitální platformy globálně šíří čínské narativy a současně čelí nepřátelským informačním kampaním." # todo: NEW TRANSLATION
 CHI_inner_mongolia_first_machinery_tank_manufacturer: "Inner Mongolia First Machinery Group Corporation" # todo: NEW TRANSLATION
 CHI_inner_mongolia_first_machinery_tank_manufacturer_mio_header_tracked_armor_works: "Závody pásové obrněné techniky" # todo: NEW TRANSLATION
 CHI_inner_mongolia_first_machinery_tank_manufacturer_mio_header_heavy_truck_and_logistics: "Těžké nákladní vozy a logistika" # todo: NEW TRANSLATION
 CHI_inner_party_supervision_idea: "Předpisy vnitrostranického dohledu" # todo: NEW TRANSLATION
 CHI_inner_party_supervision_idea_desc: "Formalizované dohledové postupy vyžadují, aby nadřízené stranické orgány kontrolovaly a hlásily stav podřízených výborů. Protikorupční vymáhání se posiluje a politická odpovědnost se institucionalizuje." # todo: NEW TRANSLATION
 CHI_international_department_1: "Mezinárodní oddělení Komunistické strany Číny" # todo: NEW TRANSLATION
 CHI_international_department_1_desc: "Mezinárodní oddělení vede stranickou diplomacii po celém světě a pěstuje vztahy s vládnoucími stranami, opozičními hnutími a politickými nadacemi ve všech regionech. Slouží také jako hlavní institucionální zázemí politického dosahu Iniciativy Pásu a stezky, koordinuje realizaci projektů, spravuje výnosy ze zapojení partnerských zemí a řeší restrukturalizaci dluhu, když se přijímající vlády dostanou do problémů se splácením. Rozšiřování jeho vlivu prohlubuje síť vstřícných zahraničních partnerů a zvyšuje celkový výnos závazků Pásu a stezky." # todo: NEW TRANSLATION
 CHI_international_sanctions: "Mezinárodní sankce" # todo: NEW TRANSLATION
 CHI_international_sanctions_desc: "Čínská podpora severokorejské vojenské agrese vyvolala rozsáhlý režim mezinárodních sankcí. Obchodní přístup je omezen, zahraniční investice vysychají a diplomatická izolace se prohlubuje." # todo: NEW TRANSLATION
 CHI_Invigorate_Country_Through_STE1: "Oživení země prostřednictvím státních podniků" # todo: MOVED KEY
 CHI_Invigorate_Country_Through_STE1_desc: "Strategie oživení země prostřednictvím vědy, technologií a vzdělávání směruje státní investice do výzkumných ústavů a univerzitního systému. Výzkumná dividenda přichází za cenu vyššího rozpočtu na vzdělávání." # todo: NEW TRANSLATION
 CHI_Invigorate_Country_Through_STE1_tt: "Roční technologický bonus pro výpočetní technologie nebo internetové technologie" # todo: MOVED KEY
 CHI_iron_brothers_joint_training: "Společný výcvik železných bratrů" # todo: NEW TRANSLATION
 CHI_iron_brothers_joint_training_desc: "Trvalá společná cvičení s partnerskou armádou zlepšila soudržnost jednotek, doktrinální sladění a způsobilost kombinovaných zbraní." # todo: NEW TRANSLATION
 CHI_jap_finlandized_sovereignty: "Finlandizovaná suverenita" # todo: NEW TRANSLATION
 CHI_jap_finlandized_sovereignty_desc: "Tokio si ponechává parlament, tisk i jazyk. Také si ponechává mlčení o tom, co Peking dělá za svými hranicemi." # todo: NEW TRANSLATION
 CHI_jap_forced_neutrality: "Vynucená neutralita" # todo: NEW TRANSLATION
 CHI_jap_forced_neutrality_desc: "Odchod Japonska z amerického bezpečnostního deštníku přišel pod hlavněmi. Smlouva je podepsána. Ponížení potrvá generace." # todo: NEW TRANSLATION
 CHI_jap_historical_pressure: "Čínská historická ofenziva" # todo: NEW TRANSLATION
 CHI_jap_historical_pressure_desc: "Peking znovu otevřel otázku válečné historie a na každém diplomatickém fóru vytahuje návštěvy svatyně Jasukuni, spory o učebnice a odkaz Nankingu. Kampaň rozdmýchává domácí mínění v Japonsku a oslabuje schopnost Tokia čelit čínským vlivovým operacím." # todo: NEW TRANSLATION
 CHI_japan_soft_power: "Čínsko-japonské kulturní angažmá" # todo: NEW TRANSLATION
 CHI_japan_soft_power_desc: "Turistické výměny, zapůjčování pand a ministerské fotografie mění dobrou vůli v politický kapitál. Automaticky pozastaveno, pokud agrese vzroste příliš vysoko." # todo: NEW TRANSLATION
 CHI_japanese_cultural_imports: "Licencované japonské kulturní dovozy" # todo: NEW TRANSLATION
 CHI_japanese_cultural_imports_desc: "Bilibili vysílá Studio Ghibli. Tencent licencuje Demon Slayer. Mládežnické křídlo strany studuje zprávy Wanga Chu-ninga o kulturní absorpci." # todo: NEW TRANSLATION
 CHI_joint_command_consultations: "Konzultace společného velení" # todo: NEW TRANSLATION
 CHI_joint_command_consultations_desc: "Pravidelné strategické konzultace mezi čínským a severokorejským vojenským velením zlepšují koordinaci a snižují riziko chybného výpočtu." # todo: NEW TRANSLATION
 CHI_joint_venture_era_idea: "Průmyslová éra společných podniků" # todo: NEW TRANSLATION
 CHI_joint_venture_era_idea_desc: "Společné podniky zahraničních a domácích firem se stávají hlavním prostředkem získávání technologií, přenosu manažerských znalostí a přístupu ke globálním distribučním sítím." # todo: NEW TRANSLATION
 CHI_kaesong_co_developer: "Spolurozvíjející partner Kesongu" # todo: NEW TRANSLATION
 CHI_kaesong_co_developer_desc: "Čínské stavební firmy a logističtí operátoři provozují společné podniky v rozšířené zóně Kesong. Sdílené dodavatelské řetězce snižují náklady a propojují pověst obou stran." # todo: NEW TRANSLATION
 CHI_kor_beijing_pressure: "Pekingská nátlaková kampaň" # todo: NEW TRANSLATION
 CHI_kor_beijing_pressure_desc: "Trvalý čínský ekonomický a diplomatický tlak oslabuje veřejnou důvěru v Jižní Koreji a zužuje prostor Soulu pro nezávislou politiku. Vláda čelí rostoucí domácí nespokojenosti a zmenšujícímu se manévrovacímu prostoru vůči Pekingu." # todo: NEW TRANSLATION
 CHI_kor_beijing_security_guarantee: "Pekingská bezpečnostní záruka" # todo: NEW TRANSLATION
 CHI_kor_beijing_security_guarantee_desc: "Jižní Korea je pod formální čínskou bezpečnostní zárukou osvobozena od závislosti na americkém jaderném deštníku. Obranné plánování se přeorientovává na spolupráci s Pekingem, což snižuje zátěž branné povinnosti a stabilizuje politické klima." # todo: NEW TRANSLATION
 CHI_kor_exit_trilateral: "Odchod z trilaterálního rámce" # todo: NEW TRANSLATION
 CHI_kor_exit_trilateral_desc: "Jižní Korea vystoupila z trilaterálního obranného rámce USA–Japonsko–Filipíny. Rozhodnutí odráží úsudek Soulu, že protičínské zaměření rámce je neslučitelné s jeho hospodářskými zájmy a cíli strategické autonomie." # todo: NEW TRANSLATION
 CHI_kor_strategic_autonomy_doctrine: "Doktrína strategické autonomie" # todo: NEW TRANSLATION
 CHI_kor_strategic_autonomy_doctrine_desc: "Jižní Korea přijala doktrínu strategické autonomie, která vzdaluje Soul washingtonské indopacifické architektuře. Obranný postoj Koreje se přeorientovává na soběstačnost a regionální multilateralismus namísto řízení aliance se Spojenými státy." # todo: NEW TRANSLATION
 CHI_korean_tributary: "Tributární vztah Severní Koreje" # todo: NEW TRANSLATION
 CHI_korean_tributary_desc: "Politické podřízení Severní Koreje Pekingu obnovilo v moderní institucionální podobě tributární vztah, který řídil čínsko-korejské vztahy před rokem 1895. Čínský přístup ke korejským přístavům, trhům a strategickému prostoru je formálně zaručen." # todo: NEW TRANSLATION
 CHI_kpa_intelligence_penetration: "Proniknutí do zpravodajství KLA" # todo: NEW TRANSLATION
 CHI_kpa_intelligence_penetration_desc: "Čínské zpravodajské služby vybudovaly síť agentů uvnitř Korejské lidové armády. Přehled o severokorejském vojenském plánování a vnitřní politice v reálném čase dává Pekingu bezprecedentní páku nad Pchjongjangem." # todo: NEW TRANSLATION
 CHI_lithium_supply_chain_locked: "Dodavatelský řetězec lithiového trojúhelníku" # todo: NEW TRANSLATION
 CHI_lithium_supply_chain_locked_desc: "Dlouhodobé odběrové dohody s producenty z Argentiny, Bolívie a Chile zajišťují čínským výrobcům baterií potřebné lithium, vyhlazují křivky efektivity a poskytují civilnímu průmyslu další prostor." # todo: NEW TRANSLATION
 CHI_long_range_firepower_idea: "Palebná síla dlouhého dosahu" # todo: NEW TRANSLATION
 CHI_long_range_firepower_idea_desc: "[CHI_long_range_firepower_idea_tt]" # todo: NEW TRANSLATION
 CHI_lotte_market_correction: "Korekce trhu Lotte" # todo: NEW TRANSLATION
 CHI_lotte_market_correction_desc: "Čínské operace skupiny Lotte byly nuceny k řízenému útlumu a uvolnily podíl na trhu domácím konkurentům. Úprava omezuje odliv spotřebního zboží a ukazuje politickou užitečnost cílené ekonomické odvety." # todo: NEW TRANSLATION
 CHI_lunar_legacy_industrial: "Zhmotněný Nebeský palác" # todo: NEW TRANSLATION
 CHI_lunar_legacy_industrial_desc: "Tchien-kung znamená Nebeský palác a poprvé v historii jeden takový trvale stojí na oběžné dráze, vybudovaný výhradně čínskýma rukama. Továrny, slévárny a montážní haly, které jej vynesly, nyní obracejí svou ověřenou disciplínu zpět k Zemi. Co dokáže vynést stanici na oběžnou dráhu, dokáže postavit cokoli pod ní." # todo: NEW TRANSLATION
 CHI_lunar_legacy_military: "Překročení Straky mostu" # todo: NEW TRANSLATION
 CHI_lunar_legacy_military_desc: "Čchiao-čchiao, Straka most, přenášel naše signály z odvrácené strany Měsíce a byl pojmenován po mostu z ptáků, který kdysi umožnil dvěma milencům setkat se přes nebesa. Posádky vycvičené na nejtěžší dosud uskutečněnou misi se vrátily zocelené a jisté. Síla, která dokáže dosáhnout Měsíce, neodpovídá na žádnou výzvu na Zemi pochybností." # todo: NEW TRANSLATION
 CHI_lunar_legacy_political: "Čchang-e stoupá k nebesům" # todo: NEW TRANSLATION
 CHI_lunar_legacy_political_desc: "Ve starém mýtu Čchang-e vypila elixír a odletěla na Měsíc, zatímco její manžel Chou I navždy hleděl vzhůru. Nyní její jméno přivedlo skutečný národ na lunární povrch a lidé v tom vidí důkaz, že Čína patří mezi přední mocnosti. Přistání se stává zdrojem postavení, které žádný soupeř nemůže odejmout." # todo: NEW TRANSLATION
 CHI_lunar_legacy_research: "Otázky Tchien-wen" # todo: NEW TRANSLATION
 CHI_lunar_legacy_research_desc: "Tchien-wen, Nebeské otázky, nese jméno starověké básně Čchü Jüana, která zkoumala řád kosmu. Rovery Jü-tchu a lunární vzorky zodpověděly otázky, na něž předtím neodpověděl žádný národ, a laboratoře, které je rozluštily, touží po dalších. Vědecké zázemí prověřené Měsícem nyní sahá ke každé hranici." # todo: NEW TRANSLATION
 CHI_mass_line_bo_campaign: "Kampaň masové linie" # todo: NEW TRANSLATION
 CHI_mass_line_bo_campaign_desc: "Kádry jsou vysílány na venkov a do továren, aby shromažďovaly zpětnou vazbu a dokazovaly závazek strany vůči lidu. Kampaň zvyšuje politické povědomí a směruje lidovou energii za cíli strany." # todo: NEW TRANSLATION
 CHI_mazu_blessing: "Požehnání Ma-cu" # todo: NEW TRANSLATION
 CHI_mazu_blessing_desc: "Ma-cu, bohyně moře a ochránkyně námořníků, je uctívána podél celého pobřeží Jihočínského moře. Její chrámové požehnání bylo formálně vyvoláno pro Jižní mořskou flotilu. Obřad se koná v celé flotile a posiluje jejího ducha." # todo: NEW TRANSLATION
 CHI_media_offensive: "Globální mediální ofenziva" # todo: NEW TRANSLATION
 CHI_media_offensive_desc: "CGTN, Sin-chua a platformy sociálních médií koordinují globální kampaň šířící čínské pohledy." # todo: NEW TRANSLATION
 CHI_militia_deployed: "Námořní milice v aktivní službě" # todo: NEW TRANSLATION
 CHI_militia_deployed_desc: "Čínská plavidla námořní milice jsou předsunuta ve sporné zóně a udržují trvalou přítomnost pod civilním krytím. Jejich přítomnost brání konkurenčním plavidlům pobřežní stráže v přiblížení bez vyvolání krize." # todo: NEW TRANSLATION
 CHI_monroe_inverted: "Obrácená Monroeova doktrína" # todo: NEW TRANSLATION
 CHI_monroe_inverted_desc: "Vytlačili jsme Washington z role hlavního vnějšího partnera Latinské Ameriky a ukotvili hemisférické přeskupení, které snižuje náklady vztahů a přitahuje regionální mínění k nám." # todo: NEW TRANSLATION
 CHI_national_humiliation: "Národní ponížení" # todo: NEW TRANSLATION
 CHI_national_humiliation_desc: "Čínský diplomatický nebo vojenský neúspěch v Jihočínském moři byl doma rámován jako pokračování Století ponížení. Veřejné mínění se bouří a vedení čelí silnému tlaku, aby jinými prostředky obnovilo čest." # todo: NEW TRANSLATION
 CHI_national_security_commission_1: "Komise národní bezpečnosti Komunistické strany Číny" # todo: NEW TRANSLATION
 CHI_national_security_commission_1_desc: "Komise národní bezpečnosti, založená v letech 2013–2014 pod Si Ťin-pchingem, stojí na vrcholu čínské bezpečnostní architektury a koordinuje zpravodajské, vojenské, kybernetické a kontrašpionážní funkce pod přímým vedením strany, nikoli prostřednictvím Státní rady. Její vznik signalizoval záměrnou centralizaci všech strategických bezpečnostních rozhodnutí. Jak se vliv komise ve výboru prohlubuje, její koordinační pravomoc se stává komplexnější a její schopnost reagovat na vnitřní i vnější bezpečnostní hrozby jednotnější a rozhodnější." # todo: NEW TRANSLATION
 CHI_nepal_himalayan_friendship: "Himálajská iniciativa přátelství" # todo: NEW TRANSLATION
 CHI_nepal_himalayan_friendship_desc: "Čínské investice a dobrá vůle proudí do Nepálu v rámci spolupráce, která respektuje neutralitu Káthmándú a současně přibližuje zemi k pekingské hospodářské orbitě." # todo: NEW TRANSLATION
 CHI_neutral_interlocutor: "Neutrální prostředník" # todo: NEW TRANSLATION
 CHI_neutral_interlocutor_desc: "Postavili jsme se do role jediné mocnosti, s níž mohou obě Koreje mluvit. Tato role přináší vliv i očekávání." # todo: NEW TRANSLATION
 CHI_nko_blue_sky_mobilization: "Mobilizace Modré oblohy" # todo: NEW TRANSLATION
 CHI_nko_blue_sky_mobilization_desc: "KLA vstoupila v koordinaci s čínskými strategickými cíli do plné bojové mobilizace. Veškeré dovolené byly zrušeny a předsunuté jednotky se přesouvají na útočná stanoviště." # todo: NEW TRANSLATION
 CHI_nko_chinese_economic_sphere: "Čínská hospodářská sféra" # todo: NEW TRANSLATION
 CHI_nko_chinese_economic_sphere_desc: "Hospodářství Severní Koreje bylo formálně začleněno do čínské průmyslové sféry. Čínské státní podniky spravují klíčová odvětví, měnové vazby jsou normalizovány a severokorejský won je navázán na renminbi." # todo: NEW TRANSLATION
 CHI_nko_energy_aid: "Čínská energetická pomoc" # todo: NEW TRANSLATION
 CHI_nko_energy_aid_desc: "Topný olej a elektřina převáděné z Tan-tungu udržují továrny v chodu a světla rozsvícená. Pekingské dotace přicházejí s tichými očekáváními." # todo: NEW TRANSLATION
 CHI_nko_food_package: "Čínský potravinový balíček" # todo: NEW TRANSLATION
 CHI_nko_food_package_desc: "Dodávky obilí vedené přes přechody na řece Tumen zmírňují chronický nedostatek. Pomoc kupuje uvnitř strany politický prostor k nadechnutí." # todo: NEW TRANSLATION
 CHI_nko_infrastructure_investment: "Čínské investice do infrastruktury" # todo: NEW TRANSLATION
 CHI_nko_infrastructure_investment_desc: "Čínské stavební brigády ve velkém obnovují severokorejskou infrastrukturu. Silnice, železnice, přístavy a elektrické sítě jsou modernizovány na základě smluv, které na generaci připoutají severokorejské zdroje k čínským průmyslovým řetězcům." # todo: NEW TRANSLATION
 CHI_nko_offensive_readiness: "Ofenzivní připravenost KLA" # todo: NEW TRANSLATION
 CHI_nko_offensive_readiness_desc: "S čínskou logistickou podporou přešla Korejská lidová armáda z obranného postoje na postoj optimalizovaný pro rychlé útočné operace na jih přes 38. rovnoběžku." # todo: NEW TRANSLATION
 CHI_nko_security_assurance: "Čínská bezpečnostní záruka" # todo: NEW TRANSLATION
 CHI_nko_security_assurance_desc: "Peking nabídl diskrétní, ale pevnou pojistku proti zhroucení režimu. Záruka stabilizuje vnitřní kruh a tlumí tlak na mobilizaci." # todo: NEW TRANSLATION
 CHI_norinco_materiel_manufacturer: "China North Industries Corporation - Materiel Department" # todo: NEW TRANSLATION
 CHI_norinco_tank_manufacturer: "China North Industries Corporation - Tank Department" # todo: NEW TRANSLATION
 CHI_npm_red_banner_insurgency: "Povstání podporované Čínou" # todo: NEW TRANSLATION
 CHI_npm_red_banner_insurgency_desc: "Pekingský skrytý kanál udržuje maoistické jednotky zásobené puškami, municí a výcvikem kádrů. Lidová osvobozenecká armáda považuje Nepál za zkušební půdu pro vývoz revoluce a očekává návratnost své investice." # todo: NEW TRANSLATION
 CHI_nrcms_rollout_idea: "Nový venkovský kooperativní zdravotní systém" # todo: NEW TRANSLATION
 CHI_nrcms_rollout_idea_desc: "Sdružené příspěvky venkovských obyvatel, místních vlád a centrálního rozpočtu nyní pokrývají katastrofické zdravotní náklady stovek milionů zemědělců, zlepšují veřejné zdraví a snižují finanční otřesy nemoci venkovských domácností." # todo: NEW TRANSLATION
 CHI_organisation_department_1: "Organizační oddělení Komunistické strany Číny" # todo: NEW TRANSLATION
 CHI_organisation_department_1_desc: "Organizační oddělení kontroluje všechna stranická personální rozhodnutí: jmenování, povyšování, prověřování a disciplínu na každé úrovni hierarchie KS Číny. Jeho dosah sahá do státních podniků a vládních ministerstev, což z něj činí nejmocnější nástroj vnitrostranické soudržnosti. Jak vliv komise ve stálém výboru sílí, její sevření nad výběrem kádrů se utahuje a její schopnost prosazovat centrální směrnice prostřednictvím aparátu roste." # todo: NEW TRANSLATION
 CHI_pacific_basing_rights: "Základny druhého ostrovního řetězce" # todo: NEW TRANSLATION
 CHI_pacific_basing_rights_desc: "Vyjednaná práva na základny a doplňování zásob hluboko ve druhém ostrovním řetězci dávají námořnictvu PLA strategický dosah, kratší logistické trasy a rychlejší obrat v loděnicích při nasazení na otevřeném moři." # todo: NEW TRANSLATION
 CHI_pacific_diplomatic_setback: "Tichomořský diplomatický neúspěch" # todo: NEW TRANSLATION
 CHI_pacific_diplomatic_setback_desc: "Výrazné selhání v Tichomoří zatvrdilo regionální metropole vůči našim nabídkám a zvýšilo politické náklady každé další diplomatické iniciativy." # todo: NEW TRANSLATION
 CHI_pacific_security_lead: "Vedení tichomořské bezpečnosti" # todo: NEW TRANSLATION
 CHI_pacific_security_lead_desc: "Dohody o předsunutém přístupu a rotační nasazení napříč tichomořskými ostrovy rozšiřují operační dosah námořnictva PLA a urychlují budování základnové infrastruktury, která je udržuje." # todo: NEW TRANSLATION
 CHI_paf_maritime_militia: "Námořní milice PAF" # todo: NEW TRANSLATION
 CHI_paf_maritime_militia_desc: "Civilní rybářské flotily organizované pod vojenským velením. Věrohodná popíratelnost na moři, skutečné počty v případě potřeby." # todo: NEW TRANSLATION
 CHI_party_century_endures: "Strana, která přetrvá století" # todo: NEW TRANSLATION
 CHI_party_century_endures_desc: "Myšlenka Si Ťin-pchinga je zakotvena v ústavní a organizační struktuře strany jako trvalý provozní rámec. Systém sjezdů, politbyro a Ústřední vojenská komise jsou znovu potvrzeny jako trvalé motory správy. Strana, která přežila Maovu smrt, kulturní revoluci a Tchien-an-men, je navržena tak, aby přežila každého jednotlivce včetně současného nejvyššího vůdce." # todo: NEW TRANSLATION
 CHI_patriotic_education_mandate: "Mandát vlasteneckého vzdělávání" # todo: NEW TRANSLATION
 CHI_patriotic_education_mandate_desc: "Revidované osnovy zajišťují, aby žádný čínský student nezapomněl, co bylo spácháno v Nankingu, Pching-ting-šanu a prefabrikovaných celách Jednotky 731. Stabilita sílí. Stejně tak podezření vůči zahraničním myšlenkám." # todo: NEW TRANSLATION
 CHI_pearls_economic_partner: "Čínské strategické partnerství" # todo: NEW TRANSLATION
 CHI_pearls_economic_partner_desc: "Hostování čínské námořní logistiky odemklo pekingskou ekonomickou štědrost: do hostitelského státu proudí prostředky na modernizaci přístavu a infrastrukturní úvěry." # todo: NEW TRANSLATION
 CHI_personal_rule_mandate: "Mandát osobní vlády" # todo: NEW TRANSLATION
 CHI_personal_rule_mandate_desc: "Celostátní shromáždění lidových zástupců v roce 2018 odstranilo z ústavy prezidentské limity funkčních období a trvale upevnilo autoritu kolem nejvyššího vůdce. Strategické směřování a politická loajalita nyní proudí jediným centrem, což zvyšuje podporu války, ale zužuje prostor pro iniciativu polních velitelů." # todo: NEW TRANSLATION
 CHI_petrodollar_breaks: "Dosažena parita s petrodolarem" # todo: NEW TRANSLATION
 CHI_petrodollar_breaks_desc: "Ropa z Perského zálivu oceňovaná v jüanech, linky centrálních bankovních swapů napříč globálním Jihem a alternativy k SWIFTu oslabily rezervní prémii dolaru a proměnily měnovou páku v politickou moc a demografickou sebedůvěru." # todo: NEW TRANSLATION
 CHI_pla_basing_economic_help: "Čínské hospodářské partnerství" # todo: NEW TRANSLATION
 CHI_pla_basing_economic_help_desc: "Výměnou za hostování logistické podpory námořnictva PLA získáváme trvalou čínskou hospodářskou podporu: rozšířené vývozní trhy, modernizaci civilních továren a politickou podporu v regionálních fórech." # todo: NEW TRANSLATION
 CHI_policy_bank_lending_idea: "Tažení úvěrů politických bank" # todo: NEW TRANSLATION
 CHI_policy_bank_lending_idea_desc: "China Development Bank, EximBank a ADBC poskytují koncesní úvěrové linky státním podnikům a provinčním vládám a urychlují investice do dlouhodobých aktiv v dopravě, energetice a zámořské infrastruktuře. Vlna úvěrů pohání stavební výstup, ale váže úspory domácností v málo výnosných vkladech." # todo: NEW TRANSLATION
 CHI_princeling_economic_leverage: "Ekonomická páka knížat" # todo: NEW TRANSLATION
 CHI_princeling_economic_leverage_desc: "Síť přeshraničních obchodních vazeb nyní spojuje severokorejské elity s čínským kapitálem. Každá transakce závislost prohlubuje." # todo: NEW TRANSLATION
 CHI_property_sector_contraction_idea: "Útlum sektoru nemovitostí" # todo: NEW TRANSLATION
 CHI_property_sector_contraction_idea_desc: "Tři červené linie nutí největší developery současně snižovat zadlužení. Zahajování staveb se hroutí, příjmy místních vlád z prodeje pozemků se vypařují a dodavatelské sítě v cementu, oceli a domácích spotřebičích postupně trpí. Širší hospodářství absorbuje otřes, protože bublina nemovitostí je násilně vypuštěna." # todo: NEW TRANSLATION
 CHI_property_tax_pilot_idea: "Pilotní daň z nemovitostí" # todo: NEW TRANSLATION
 CHI_property_tax_pilot_idea_desc: "Šanghaj a Čchung-čching uvalují mírné daně na druhé domy a nemovitosti s vysokou hodnotou, čímž tlumí spekulativní investice a diverzifikují příjmy místních vlád mimo prodej pozemků." # todo: NEW TRANSLATION
 CHI_publicity_department_1: "Propagandistické oddělení Komunistické strany Číny" # todo: NEW TRANSLATION
 CHI_publicity_department_1_desc: "Propagandistické oddělení stanovuje ideologickou linii pro veškerá tištěná, vysílaná i digitální média v Číně a řídí cenzuru, rámování narativů a domácí šíření legitimity strany. Koordinuje také zámořskou komunikační infrastrukturu včetně rozšiřování státních médií a obsahových partnerství v zahraničí. Větší vliv komise se promítá do soudržnějšího a důraznějšího informačního prostředí, které posiluje společenskou stabilitu a veřejnou podporu priorit strany." # todo: NEW TRANSLATION
 CHI_qccm_coordination_cell: "Koordinační buňka QCCM" # todo: NEW TRANSLATION
 CHI_qccm_coordination_cell_desc: "Čtyřstranné zpravodajské sdílení podél pamírského koridoru propojuje bezpečnostní služby Číny, Pákistánu, Afghánistánu a Tádžikistánu." # todo: NEW TRANSLATION
 CHI_raj_foreign_defense_pressure: "Čínský tlak" # todo: NEW TRANSLATION
 CHI_raj_foreign_defense_pressure_desc: "Pekingský obrat k jižní Asii vystavil Nové Dillí trvalému diplomatickému a informačnímu tlaku a zúžil indické strategické možnosti podél severních a východních hranic." # todo: NEW TRANSLATION
 CHI_rason_investment_flow: "Program investic do Rasonu" # todo: NEW TRANSLATION
 CHI_rason_investment_flow_desc: "Čínský kapitál proudí do zvláštní ekonomické zóny Rason a financuje infrastrukturu, průmyslovou kapacitu a přístavní zařízení. Experiment přináší viditelné výsledky." # todo: NEW TRANSLATION
 CHI_rason_port_access: "Přístup do přístavu Rason" # todo: NEW TRANSLATION
 CHI_rason_port_access_desc: "Naše plavidla nyní spolehlivě využívají hlubokovodní přístav Rason, což námořnictvu Lidové osvobozenecké armády dává strategickou oporu v Japonském moři." # todo: NEW TRANSLATION
 CHI_rcep_member: "Zakládající člen RCEP" # todo: NEW TRANSLATION
 CHI_rcep_member_desc: "Společně s Tokiem a Soulem jsme ukotvili Regionální komplexní hospodářské partnerství. Cla klesají, dodavatelské řetězce houstnou a americká nepřítomnost se stává regionální normou." # todo: NEW TRANSLATION
 CHI_reconstruction_plan_idea: "Plán kapacity obnovy" # todo: NEW TRANSLATION
 CHI_reconstruction_plan_idea_desc: "Předem rozmístěné vybavení, standardizované protokoly a specializované ženijní jednotky armády nám po katastrofách poskytují mimořádnou rychlost při opravách infrastruktury a průmyslu." # todo: NEW TRANSLATION
 CHI_regional_crisis_alert: "Varování před regionální krizí" # todo: NEW TRANSLATION
 CHI_regional_crisis_alert_desc: "Čínský bezpečnostní postoj na Korejském poloostrově vyvolal v celém regionu zvýšenou připravenost. Soudržnost aliancí je pod tlakem." # todo: NEW TRANSLATION
 CHI_reunion_humanitarian_lead: "Vedení humanitární diplomacie" # todo: NEW TRANSLATION
 CHI_reunion_humanitarian_lead_desc: "Naše koordinace přeshraničních setkání rodin vytvořila mimořádně širokou dobrou vůli. Ministerstva zahraničí kontakt vítají a domácí média jej zesilují." # todo: NEW TRANSLATION
 CHI_rmb_promotion: "Internacionalizace RMB" # todo: NEW TRANSLATION
 CHI_rmb_promotion_desc: "Renminbi je prostřednictvím bilaterálních dohod o měnových swapech stále více přijímáno jako mezinárodní rezervní měna." # todo: NEW TRANSLATION
 CHI_russian_arms_dependency: "Závislost na ruských zbraních" # todo: NEW TRANSLATION
 CHI_russian_arms_dependency_desc: "Lidová osvobozenecká armáda byla vybudována na sovětských a ruských konstrukcích. Její ruční zbraně začínaly jako typ 56, licencovaný kalašnikov, a její obrněné síly vyrostly z typu 59, přímé kopie sovětského T-54A; pozdější tanky a bojová vozidla pěchoty stále odrážejí rodovou linii T-72 a BMP. Dělostřelectvo, transportéry i baterie protivzdušné obrany mají stejné předky. Závislost je nejhlubší u pohonu: AL-31F pohání J-10 a J-11, RD-93 létá v JF-17 a stíhačky Su-35 a baterie S-400 byly přímo zakoupeny z Moskvy. Každá domácí stíhací řada čeká na ruskou turbínu, každý licencovaný vzor platí licenční poplatek a konstrukční kanceláře stále více kopírují, než tvoří. Dokud Čína nevybuduje vlastní vojensko-průmyslovou základnu, tep srdce armády udává Rusko." # todo: NEW TRANSLATION
 CHI_sanctions_immunity_partial: "Obchodní tepna vypořádaná v jüanech" # todo: NEW TRANSLATION
 CHI_sanctions_immunity_partial_desc: "Energetické a zbožové smlouvy se sankcionovanými partnery denominované v renminbi otupují dopad západního finančního tlaku, zmírňují tlak na spotřebitele a udržují vývozní kanály otevřené." # todo: NEW TRANSLATION
 CHI_sars_outbreak_uncontrolled_idea: "Epidemie SARS" # todo: NEW TRANSLATION
 CHI_sars_outbreak_uncontrolled_idea_desc: "Neschopnost koordinovat rychlou mimořádnou reakci umožnila šíření SARS napříč několika provinciemi, než se prosadila karanténní opatření. Naše opožděné mezinárodní oznámení poškodilo naši pověst v zahraničí a doma způsobilo významné hospodářské narušení." # todo: NEW TRANSLATION
 CHI_sars_response_effective_idea: "SARS pod kontrolou" # todo: NEW TRANSLATION
 CHI_sars_response_effective_idea_desc: "Náš rámec reakce na mimořádné události umožnil rychlou karanténu, včasné mezinárodní oznámení a koordinovaný lékařský zásah. Epidemie je pod kontrolou, hospodářské narušení je omezené a naše mezinárodní pověst zůstává zachována." # todo: NEW TRANSLATION
 CHI_scientific_outlook_idea_1: "Příprava Vědeckého pohledu na rozvoj" # todo: NEW TRANSLATION
 CHI_scientific_outlook_idea_1_desc: "Přeorientováváme národní politiku od růstu založeného především na HDP k širším sociálním a environmentálním ukazatelům podle Vědeckého pohledu na rozvoj." # todo: NEW TRANSLATION
 CHI_scientific_outlook_idea_1_tt: "§Y$CHI_scientific_outlook_on_development$§! Doba dokončení zaměření §G-35§! §Ydnů§!" # todo: NEW TRANSLATION
 CHI_sco_dialogue_partner: "Partner pro dialog ŠOS" # todo: NEW TRANSLATION
 CHI_sco_dialogue_partner_desc: "Tato země byla přijata jako partner pro dialog Šanghajské organizace spolupráce, což otevírá cestu k hlubšímu politickému a hospodářskému angažmá s členskými státy." # todo: NEW TRANSLATION
 CHI_sco_member: "Člen ŠOS" # todo: NEW TRANSLATION
 CHI_sco_member_tooltip: "§YČlen ŠOS§!: Prohlubuje politickou, hospodářskou a bezpečnostní spolupráci s členskými státy napříč Eurasií." # todo: NEW TRANSLATION
 CHI_sco_member_desc: "Tato země je plnoprávným členem Šanghajské organizace spolupráce a účastní se všech politických, hospodářských a bezpečnostních rámců stanovených organizací." # todo: NEW TRANSLATION
 CHI_sco_member_econ_desc: "Tato země je plnoprávným členem Šanghajské organizace spolupráce s důrazem na hospodářskou spolupráci a získává posílené obchodní a investiční vazby s ostatními členy." # todo: NEW TRANSLATION
 CHI_sco_member_mil_desc: "Tato země je plnoprávným členem Šanghajské organizace spolupráce s důrazem na vojenskou spolupráci a účastní se společných cvičení a bezpečnostních operací." # todo: NEW TRANSLATION
 CHI_sco_member_pol_desc: "Tato země je plnoprávným členem Šanghajské organizace spolupráce s důrazem na politickou spolupráci a získává silnější rámce správy a boje proti podvracení." # todo: NEW TRANSLATION
 CHI_sco_observer: "Pozorovatel ŠOS" # todo: NEW TRANSLATION
 CHI_sco_observer_desc: "Tato země má v Šanghajské organizaci spolupráce status pozorovatele, který jí poskytuje přístup k fórům ŠOS a omezenou hospodářskou spolupráci při zachování suverenity nad rozhodováním o vlastním směřování." # todo: NEW TRANSLATION
 CHI_scs_chinese_debt: "Závislost na čínském dluhu" # todo: NEW TRANSLATION
 CHI_scs_chinese_debt_desc: "Úvěrové závazky Pásu a stezky poskytly Pekingu významnou páku nad zahraničněpolitickým kalkulem zadluženého partnera. Požadavky na obsluhu dluhu omezují svobodu vlády zaujímat postoje nepřátelské čínským zájmům." # todo: NEW TRANSLATION
 CHI_scs_claimant_under_pressure: "Pod čínským tlakem" # todo: NEW TRANSLATION
 CHI_scs_claimant_under_pressure_desc: "Čínská dominance v Jihočínském moři zdražila každé rozhodnutí týkající se Spratlyho ostrovů pro tuto vládu. Domácí veřejné mínění je rozděleno mezi ústupnost a odpor; trest za politickou sílu u rozhodnutí o Jihočínském moři odráží obtížnost volby kurzu, zatímco Peking určuje podmínky." # todo: NEW TRANSLATION
 CHI_scs_de_facto_sovereignty: "De facto suverenita" # todo: NEW TRANSLATION
 CHI_scs_de_facto_sovereignty_desc: "Díky trpělivé bilaterální diplomacii a nahromaděným dohodám se čínské nároky v Jihočínském moři staly regionálním výchozím stavem. Žádný nárokující si stát již uspořádání formálně nezpochybňuje; vnější mocnosti postrádají právní nástroje k napadení toho, co sousední státy přijaly." # todo: NEW TRANSLATION
 CHI_scs_jdz_revenue: "Příjmy ze společného rozvoje" # todo: NEW TRANSLATION
 CHI_scs_jdz_revenue_desc: "Těžba uhlovodíků ze zón společného rozvoje vytváří sdílené příjmy pro nás i partnerský stát. Příjmy z ropy proudí po dobu trvání dohody příslušnému státu Spratlyho ostrovů na obou stranách uspořádání, dávají oběma vládám konkrétní podíl na pokračování bilaterálního rámce a komplikují návrat ke konfrontaci." # todo: NEW TRANSLATION
 CHI_scs_setback: "Neúspěch v Jihočínském moři" # todo: NEW TRANSLATION
 CHI_scs_setback_desc: "Střet skončil nepříznivě, diplomatická iniciativa byla veřejně odmítnuta nebo mezinárodní rozhodnutí dopadlo proti čínským nárokům. Neúspěch snižuje proměnnou rámce JČM a může pozvat k oportunistickým reakcím dalších nárokujících si států." # todo: NEW TRANSLATION
 CHI_sea_eagles_carrier_wing_idea: "$CHI_sea_eagles_carrier_wing$" # todo: NEW TRANSLATION
 CHI_sea_eagles_carrier_wing_idea_desc: "[CHI_sea_eagles_carrier_wing_idea_tt]" # todo: NEW TRANSLATION
 CHI_selective_anti_corruption_campaign_idea: "Selektivní protikorupční kampaň" # todo: NEW TRANSLATION
 CHI_selective_anti_corruption_campaign_idea_desc: "Cílená stíhání potlačují nejkřiklavější korupci a odstraňují konkurenční mocenské hráče, selektivní a politický charakter vymáhání však vytváří institucionální nejistotu a potlačuje iniciativu." # todo: NEW TRANSLATION
 CHI_self_reliant_path_idea: "Růstové bolesti Taihangu" # todo: NEW TRANSLATION
 CHI_self_reliant_path_idea_desc: "Soběstačnost se platí vyhořelými turbínami a uzemněnými letkami. Raný WS-10 Taihang se dusí vlastní ambicí, jeho lopatky praskají a jeho životnost se měří pouhými hodinami; posádky platí za každou lekci, kterou se inženýři ještě musí naučit. Kanceláře se tam dostanou, ale do té doby flotila létá na víru." # todo: NEW TRANSLATION
 CHI_sez_japanese_investors: "Speciální ekonomické zóny pro japonské investory" # todo: NEW TRANSLATION
 CHI_sez_japanese_investors_desc: "Speciální koncese pro Toyotu, Sony a Panasonic. Strategie China-Plus-One je obrácena tím, že Čínu učiníme neopustitelnou." # todo: NEW TRANSLATION
 CHI_sino_japanese_understanding: "Čínsko-japonské strategické porozumění" # todo: NEW TRANSLATION
 CHI_sino_japanese_understanding_desc: "Nevyslovená architektura uvolnění: obchodní toky, ministerská setkání a tichá dohoda ponechat historii v archivech. Trvale ztraceno, pokud čínsko-japonská agrese znovu vzroste." # todo: NEW TRANSLATION
 CHI_smic_foundry_base: "Slévárenská základna SMIC" # todo: NEW TRANSLATION
 CHI_smic_foundry_base_desc: "Areál SMIC v Čang-ťiangu poskytuje kvalifikovanou výrobní platformu 28 nm pro domácí bezvýrobní zákazníky. Kapacita slévárny snižuje závislost Číny na TSMC u logiky vyspělých uzlů a poskytuje základ pro další domácí vývoj procesů." # todo: NEW TRANSLATION
 CHI_society_department_1: "Oddělení práce se společností" # todo: NEW TRANSLATION
 CHI_society_department_1_desc: "Oddělení práce se společností, založené v roce 2023, sjednotilo dohled KS Číny nad místními sociálními organizacemi, nevládními organizacemi, odbory a petičním systémem, který byl dříve rozptýlen mezi více agentur. Jeho mandátem je zajistit, aby občanská společnost fungovala v mezích stanovených stranou a aby lidové křivdy směřovaly do řízených kanálů namísto nezávislé mobilizace. Rostoucí vliv komise umožňuje oddělení rozšířit organizační dosah a zdokonalit mechanismy, jimiž jsou společenské tlaky absorbovány a rozptylovány." # todo: NEW TRANSLATION
 CHI_sovereign_wealth_diversification_idea: "Diverzifikace suverénního fondu China Investment Corporation" # todo: NEW TRANSLATION
 CHI_sovereign_wealth_diversification_idea_desc: "China Investment Corporation přesouvá devizové rezervy z málo výnosných amerických státních dluhopisů do globálního soukromého kapitálu, infrastruktury a strategických majetkových podílů. Portfolio vytváří vyšší výnosy než základna rezerv a dává Pekingu strukturální pozice na zahraničních kapitálových trzích." # todo: NEW TRANSLATION
 CHI_state_tolerated_boycott: "Státem tolerovaný bojkot" # todo: NEW TRANSLATION
 CHI_state_tolerated_boycott_desc: "Protijaponské demonstrace, které policie nerozežene — dokud je nerozežene. Vlastenečtí spotřebitelé přesměrovávají své výdaje. Někteří čínští prodejci také krvácejí." # todo: NEW TRANSLATION
 CHI_streamline_the_ranks_idea: "Zeštíhlení řad" # todo: NEW TRANSLATION
 CHI_streamline_the_ranks_idea_desc: "Od konce 90. let Lidová osvobozenecká armáda propustila statisíce lidí a vyměnila přebujelou sílu masové mobilizace za menší profesionální armádu postavenou kolem brigád. Přechod zatěžuje výcvikové kapacity a váže průmysl.\n\n§YTento postih se zruší, jakmile budou splněny obě podmínky:§!\n§Y-§! Armáda má méně než §Y[?CHI_streamline_div_baseline|0]§! divizí.\n§Y-§! Zásoby pěchotních zbraní, dělostřelectva a podvozků středních tanků mají rezervu vyšší než §Y10%§! potřeb armády." # todo: NEW TRANSLATION
 CHI_strike_black_sing_red_idea: "Úder proti černému, zpívat rudé" # todo: NEW TRANSLATION
 CHI_strike_black_sing_red_idea_desc: "Tisíce funkcionářů a představitelů organizovaného zločinu byly zatčeny a jejich sítě rozebrány. Masové akce rudé kultury zaplavují veřejný prostor vlasteneckým zápalem a zvyšují morálku i loajalitu ke straně." # todo: NEW TRANSLATION
 CHI_succession_roadmap: "Plán nástupnictví" # todo: NEW TRANSLATION
 CHI_succession_roadmap_desc: "Identifikace a pěstování určeného nástupce signalizuje stranickým institucím, že předání moci bude řízeno, nikoli zpochybňováno. Mezinárodní partneři čtou rámec nástupnictví jako důkaz systémové stability. Riziková přirážka k dlouhodobým dohodám s Čínou se alespoň po dobu trvání uspořádání zužuje." # todo: NEW TRANSLATION
 CHI_summit_host: "Hostitel summitu" # todo: NEW TRANSLATION
 CHI_summit_host_desc: "Peking aktivně hostí citlivá regionální jednání. Diplomatická kapacita je vysoká a nástroje nátlaku nesou větší váhu." # todo: NEW TRANSLATION
 CHI_taiwan_strait_pressure_spirit: "Postoj tlaku přes průliv" # todo: NEW TRANSLATION
 CHI_taiwan_strait_pressure_spirit_desc: "Pravidelné letecké průniky PLA do tchajwanské identifikační zóny protivzdušné obrany, rozsáhlá námořní cvičení ve vodách kolem ostrova a kalibrovaný ekonomický nátlak udržují trvalou kampaň pod prahem otevřené války. Postoj udržuje Tchaj-pej v permanentní pohotovosti, signalizuje rozhodnost Washingtonu, zoceluje naše síly a udržuje veřejnou podporu války pro případné krize." # todo: NEW TRANSLATION
 CHI_tech_crackdown_moderate: "Zásah proti technologiím: řízená restrukturalizace" # todo: NEW TRANSLATION
 CHI_tech_crackdown_moderate_desc: "Regulační kampaň uvalila náklady na dodržování předpisů a zpomalila investice do výzkumu, sektor platforem má však dostatečné měřítko, aby narušení absorboval bez strukturálního zhroucení." # todo: NEW TRANSLATION
 CHI_tech_crackdown_severe: "Zásah proti technologiím: tvrdý" # todo: NEW TRANSLATION
 CHI_tech_crackdown_severe_desc: "Naše regulační kampaň proti sektoru platforem zastihla digitální ekonomiku v rané fázi rozvoje. Budování sektoru služeb se zastavilo, rizikový kapitál uprchl a investice do výzkumu prudce poklesly." # todo: NEW TRANSLATION
 CHI_the_duterte_precedent: "Duterteho precedent" # todo: NEW TRANSLATION
 CHI_the_duterte_precedent_desc: "Příklad hlavy vlády ASEAN, která se rozhodla odklonit od Washingtonu k Pekingu, rezonuje napříč regionem. Ostatní vůdci sledují, že tomu Spojené státy nezabránily nebo nedokázaly zabránit, a podle toho zvažují vlastní možnosti." # todo: NEW TRANSLATION
 CHI_three_represents_debate: "Kontroverze Tří zastupování" # todo: NEW TRANSLATION
 CHI_three_represents_debate_desc: "Ideologičtí tradicionalisté uvnitř strany odporují Ťiangovu návrhu přijmout soukromé podnikatele do strany a tvrdí, že opouští třídní charakter předvoje. Vnitřní debata dočasně narušuje soudržnost politiky a vytváří tření na provinční úrovni." # todo: NEW TRANSLATION
 CHI_three_represents_debate_tt: "\nTento §YNárodní duch§! bude §Rzrušen§!, pokud §YŤiang Ce-min§! nedokončí §Y$CHI_three_represents_codified$§! a přestane být §Yvůdcem země§!" # todo: NEW TRANSLATION
 CHI_tibet_crackdown_idea: "Bezpečnostní operace v Tibetu" # todo: NEW TRANSLATION
 CHI_tibet_crackdown_idea_desc: "Koordinovaná bezpečnostní operace v celém Tibetu potlačuje separatistickou aktivitu za cenu dočasného napětí ve stabilitě." # todo: NEW TRANSLATION
 CHI_total_war_himalayan_front: "Totální válka na himálajské frontě" # todo: NEW TRANSLATION
 CHI_total_war_himalayan_front_desc: "Každá továrna, každá železniční stanice, každý záložník mobilizovaný pro otázku McMahonovy linie." # todo: NEW TRANSLATION
 CHI_two_centenary_resolve: "Dva stoletné cíle" # todo: NEW TRANSLATION
 CHI_two_centenary_resolve_desc: "Dvojice stoletých termínů v letech 2021 a 2049 ukládá hospodářskému a sociálnímu plánování generační horizont. Investice do infrastruktury, cíle produktivity a programy technologického rozvoje jsou zaměřeny na tyto milníky. Cíle strukturují byrokratické pobídky a odemykají trvalé víceleté plánovací cykly napříč všemi ministerstvy." # todo: NEW TRANSLATION
 CHI_united_front_department_1: "Oddělení práce Jednotné fronty" # todo: NEW TRANSLATION
 CHI_united_front_department_1_desc: "Oddělení práce Jednotné fronty řídí vztahy KS Číny s nestranickými skupinami: etnickými menšinami, náboženskými komunitami, zámořskými čínskými sítěmi a zahraničními politickými představiteli náchylnými ke kooptaci. Jeho mandátem je neutralizovat potenciální zdroje opozice a rozšiřovat stranický vliv za hranice formálního členství. S růstem vlivu komise se dosah oddělení stává systematičtějším a mění okrajové aktéry ve spolehlivé nástroje čínských strategických zájmů." # todo: NEW TRANSLATION
 CHI_usa_asia_pivot_collapse: "Indopacifický obrat se zhroutil" # todo: NEW TRANSLATION
 CHI_usa_asia_pivot_collapse_desc: "Jak se Soul posouvá do pekingské orbity a Tokio se strategicky izoluje, základní kámen amerického návratu do Asie se rozpadl. Předsunuté plánování je v nepořádku, důvěra spojenců otřesena a politické náklady obratu doléhají na Washington." # todo: NEW TRANSLATION
 CHI_usa_back_channel_open: "Tajný kanál do Foggy Bottom" # todo: NEW TRANSLATION
 CHI_usa_back_channel_open_desc: "Diskrétní linka mezi Čung-nan-chajem a ministerstvem zahraničí udržuje krizovou komunikaci otevřenou pod veřejnou diplomatickou úrovní. Kanál přináší stálý proud zpravodajství o amerických záměrech za cenu vystavení čínské kontrarozvědky." # todo: NEW TRANSLATION
 CHI_usa_g2_framework: "Rámec G2" # todo: NEW TRANSLATION
 CHI_usa_g2_framework_desc: "Washington a Peking institucionalizovaly velmocenské kondominium nad korejskými záležitostmi a koordinují politiku prostřednictvím stálých bilaterálních kanálů. Uspořádání stabilizuje trhy a snižuje spotřebitelské náklady, ale váže americkou korejskou politiku na pokračující čínskou dobrou vůli." # todo: NEW TRANSLATION
 CHI_wakhan_buffer_idea: "Wakhanská nárazníková zóna" # todo: NEW TRANSLATION
 CHI_wakhan_buffer_idea_desc: "Koordinovaný režim boje proti radikalizaci napříč Wakhanským koridorem posílil západní hranici Číny proti infiltraci extremistů." # todo: NEW TRANSLATION
 CHI_wakhan_buffer_partner_idea: "Wakhanský protiteroristický partner" # todo: NEW TRANSLATION
 CHI_wakhan_buffer_partner_idea_desc: "Společné protokoly kontroly hranic s Pekingem zlepšily domácí protiteroristickou kapacitu, i když zahraniční zpravodajské služby utužují svou spolupráci." # todo: NEW TRANSLATION
 CHI_war_footing_central_asia: "Válečná pohotovost Střední Asie" # todo: NEW TRANSLATION
 CHI_war_footing_central_asia_desc: "Národní výroba zaměřená na trvalé operace západně od Pamíru." # todo: NEW TRANSLATION
 CHI_water_shortage: "Nedostatek vody" # todo: NEW TRANSLATION
 CHI_water_shortage_desc: "Severočínská nížina, povodí Žluté řeky a koridor Peking–Tchien-ťin–Che-pej dohromady obsahují přibližně polovinu obdělávané půdy země, ale méně než pětinu její sladké vody. Dostupnost vody na obyvatele na severu klesá hluboko pod mezinárodní hranici nedostatku 1 000 kubických metrů ročně. Průmyslové vypouštění a zemědělský odtok kontaminovaly významné podíly dostupných povrchových i podzemních vod a prohloubily fyzický nedostatek. Zemědělství spotřebovává více než 60 procent celkové vody a nároky energetiky na chlazení představují další zátěž již vyčerpané základny zdrojů." # todo: NEW TRANSLATION
 CHI_wenchuan_reconstruction_drive_idea: "Tažení obnovy Wen-čchuanu" # todo: NEW TRANSLATION
 CHI_wenchuan_reconstruction_drive_idea_desc: "Během několika dnů po zemětřesení jsme nasadili více než 100 000 vojáků a záchranných týmů a následně plán obnovy v hodnotě 1 bilionu RMB. Rozsah závazku vyvolal trvalý nárůst stavební aktivity v S’-čchuanu a okolním regionu." # todo: NEW TRANSLATION
 CHI_western_hemisphere_protector: "Ochránce rozvíjejících se Amerik" # todo: NEW TRANSLATION
 CHI_western_hemisphere_protector_desc: "Postavili jsme se do role alternativního bezpečnostního garanta pro latinskoamerické národy, které se snaží uniknout washingtonské orbitě. Vliv proudí volně a zpravodajské sítě jsou chráněny před západnou protiakcí." # todo: NEW TRANSLATION
 CHI_western_institutional_engagement_idea: "Angažmá v západních institucích" # todo: NEW TRANSLATION
 CHI_western_institutional_engagement_idea_desc: "Aktivní účast na správě MMF, Světové banky a WTO buduje mezinárodní důvěryhodnost a rozšiřuje přístup na globální finanční trhy." # todo: NEW TRANSLATION
 CHI_wto_implementation_idea: "Provádění WTO" # todo: NEW TRANSLATION
 CHI_wto_implementation_idea_desc: "Víceleté snižování cel, otevírání sektoru služeb a sladění s mezinárodními obchodními pravidly prohlubují naši integraci do globálních dodavatelských řetězců a zlepšují naše postavení u obchodních partnerů." # todo: NEW TRANSLATION
 CHI_xinjiang_crackdown_idea: "Bezpečnostní operace v Sin-ťiangu" # todo: NEW TRANSLATION
 CHI_xinjiang_crackdown_idea_desc: "V celém Sin-ťiangu probíhá rozsáhlá bezpečnostní operace. Odpor je utlumen, náklady však dopadají na domácí stabilitu." # todo: NEW TRANSLATION
 chinese_african_century: "Čínsko-africké století" # todo: NEW TRANSLATION
 chinese_african_century_desc: "Desítky let investic FOCAC učinily z Číny nepostradatelného partnera afrického kontinentu a proměnily demografii, obchodní toky i politické směřování." # todo: NEW TRANSLATION
 chinese_surveillance_systems: "Čínské sledovací systémy" # todo: NEW TRANSLATION
 chinese_surveillance_systems_desc: "Dovážené platformy bezpečných měst, kamery s rozpoznáváním obličejů a nástroje digitální identity posilují režim proti disentu a zahraničním zpravodajským operacím." # todo: NEW TRANSLATION
 eurasian_land_bridge: "Euroasijský pozemní most" # todo: NEW TRANSLATION
 eurasian_land_bridge_desc: "Nepřerušený železniční a potrubní koridor spojuje Tichý oceán s Atlantikem, přičemž čínské normy, rozchody a celní postupy udávají rytmus pozemního obchodu." # todo: NEW TRANSLATION
 JAP_abandoned_by_ally: "Washington nás opustil" # todo: NEW TRANSLATION
 JAP_abandoned_by_ally_desc: "Když přišel rozhodující okamžik, Američané váhali. Aliance na papíře přetrvala, ale důvěra je pryč a každá frakce v parlamentu si z toho vyvozuje vlastní závěry." # todo: NEW TRANSLATION
 JAP_china_engagement: "Spolupráce s Čínou" # todo: NEW TRANSLATION
 JAP_china_engagement_desc: "Tokio se rozhodlo pro otevřenou politickou spolupráci s Pekingem a snížilo strategické napětí za cenu ztráty nacionalistické důvěryhodnosti." # todo: NEW TRANSLATION
 JAP_export_pain: "Útrapy vývozu" # todo: NEW TRANSLATION
 JAP_export_pain_desc: "Dlouhodobý bojkot japonského zboží čínskými spotřebiteli zanechal japonský exportní průmysl v zoufalé snaze najít alternativní trhy." # todo: NEW TRANSLATION
 JAP_jcg_emergency_deployment: "Nouzové nasazení JCG" # todo: NEW TRANSLATION
 JAP_jcg_emergency_deployment_desc: "Japonská pobřežní stráž je ve Východočínském moři trvale v krizovém režimu, což zatěžuje průmysl, aby mohla udržet své lodě na moři." # todo: NEW TRANSLATION
 JAP_rare_earth_diversification: "Kampaň za diverzifikaci vzácných zemin" # todo: NEW TRANSLATION
 JAP_rare_earth_diversification_desc: "Nouzový program získávání vzácných zemin z Austrálie, Vietnamu a domácí recyklace. Krátkodobě bolestivé." # todo: NEW TRANSLATION
 JAP_revisionist_pride: "Revizionistická hrdost" # todo: NEW TRANSLATION
 JAP_revisionist_pride_desc: "Veřejné odmítání zahraniční kritiky válečné minulosti upevňuje doma nacionalistickou náladu." # todo: NEW TRANSLATION
 JAP_sino_japanese_understanding: "Čínsko-japonské porozumění" # todo: NEW TRANSLATION
 JAP_sino_japanese_understanding_desc: "Tokijské komuniké institucionalizovalo pravidelné konzultace a obchodní preference s Pekingem." # todo: NEW TRANSLATION
 JAP_strategic_autonomy_drift: "Odklon ke strategické autonomii" # todo: NEW TRANSLATION
 JAP_strategic_autonomy_drift_desc: "Po snížení Quad na úroveň dialogu Japonsko potichu přelaďuje svá spojenectví pryč od Washingtonu." # todo: NEW TRANSLATION
 NKO_pro_beijing_regime: "Propekingský režim" # todo: NEW TRANSLATION
 NKO_pro_beijing_regime_desc: "Nová vláda v Pchjongjangu vděčí za své přežití Pekingu. Čínští poradci zasedají na každém ministerstvu a čínská ropa pohání každý nákladní vůz." # todo: NEW TRANSLATION
 pax_sinica: "Pax Sinica" # todo: NEW TRANSLATION
 pax_sinica_consensus: "Společenství sdílené budoucnosti" # todo: NEW TRANSLATION
 pax_sinica_consensus_desc: "Dosáhli jsme globálního prvenství díky desetiletím trpělivých investic, zvýhodněného financování a institucionální diplomacie. Mezinárodní řád uznává naši ústřední roli spíše z vlastního zájmu než z donucení: svět je s námi spojen vzájemným prospěchem, nikoli strategickou nutností." # todo: NEW TRANSLATION
 pax_sinica_desc: "Stojíme na vrcholu globálního řádu, který jsme utvořili podle vlastních podmínek, přičemž Pás a stezka slouží jako pojivová tkáň nového mezinárodního systému." # todo: NEW TRANSLATION
 petroyuan_settlement: "Síť vypořádání v petrojüanech" # todo: NEW TRANSLATION
 petroyuan_settlement_desc: "Přeshraniční energetické kontrakty se stále častěji vypořádávají v renminbi, což osvobozuje náš průmysl od úzkých míst dolarového zúčtování a urychluje domácí výstavbu." # todo: NEW TRANSLATION
 rmb_reserve_currency: "Renminbi jako rezervní měna" # todo: NEW TRANSLATION
 rmb_reserve_currency_desc: "Jüan se připojil ke koši světových rezervních měn, čímž otevírá exportní trhy a dává našim bankám odolnost potřebnou k financování globálních úvěrů na obnovu." # todo: NEW TRANSLATION
 SCO_air_defense_initiator: "Společná protivzdušná obrana SCO (vedoucí)" # todo: NEW TRANSLATION
 SCO_air_defense_initiator_desc: "Jako vedoucí země sítě společné protivzdušné obrany SCO tato země koordinuje integrovaný vzdušný dohled a protiraketovou obranu napříč členskými státy." # todo: NEW TRANSLATION
 SCO_air_defense_member: "Společná protivzdušná obrana SCO" # todo: NEW TRANSLATION
 SCO_air_defense_member_desc: "Účast v síti společné protivzdušné obrany SCO poskytuje přístup ke sdílenému radarovému pokrytí a koordinaci protiletecké obrany." # todo: NEW TRANSLATION
 SCO_cultural_exchange_bonus: "Kulturní výměna SCO" # todo: NEW TRANSLATION
 SCO_cultural_exchange_bonus_desc: "Akademický a kulturní výměnný program podporuje přeshraniční spolupráci ve výzkumu." # todo: NEW TRANSLATION
 SCO_dev_bank_initiator: "Rozvojová banka SCO (zakladatel)" # todo: NEW TRANSLATION
 SCO_dev_bank_initiator_desc: "Jako zakladatel Rozvojové banky SCO tato země řídí investiční toky a má přednostní přístup k nízkoúročenému financování." # todo: NEW TRANSLATION
 SCO_dev_bank_member: "Rozvojová banka SCO" # todo: NEW TRANSLATION
 SCO_dev_bank_member_desc: "Členství v Rozvojové bance SCO poskytuje přístup k rozvojovým půjčkám a společným investičním programům." # todo: NEW TRANSLATION
 SCO_development_assistance: "Rozvojová pomoc ŠOS" # todo: MOVED KEY
 SCO_development_assistance_2: "[CHI.GetAdjectiveCap] rozvojová pomoc" # todo: MOVED KEY
 SCO_development_assistance_2_desc: "Získali jsme tolik potřebnou rozvojovou pomoc od Číny pod záštitou Šanghajské organizace spolupráce." # todo: MOVED KEY
 SCO_development_assistance_desc: "Získali jsme tolik potřebnou rozvojovou pomoc pod záštitou Šanghajské organizace spolupráce." # todo: MOVED KEY
 SCO_energy_deal_income: "Energetické partnerství SCO" # todo: NEW TRANSLATION
 SCO_energy_deal_income_desc: "Dlouhodobá dohoda o dodávkách energie vytváří stabilní příjmy." # todo: NEW TRANSLATION
 SCO_energy_grid_initiator: "Energetická síť SCO (iniciátor)" # todo: NEW TRANSLATION
 SCO_energy_grid_initiator_desc: "Jako iniciátor energetické sítě SCO tato země vede integrovanou elektrickou síť napříč členskými státy." # todo: NEW TRANSLATION
 SCO_energy_grid_member: "Energetická síť SCO" # todo: NEW TRANSLATION
 SCO_energy_grid_member_desc: "Účast v energetické síti SCO poskytuje přístup ke sdílené energetické infrastruktuře a nižším nákladům na energie." # todo: NEW TRANSLATION
 SCO_intel_sharing_bonus: "Sdílení zpravodajských informací SCO" # todo: NEW TRANSLATION
 SCO_intel_sharing_bonus_desc: "Zabezpečený kanál pro sdílení zpravodajských informací zlepšuje koordinaci boje proti terorismu." # todo: NEW TRANSLATION
 SCO_joint_drill: "Společná cvičení ŠOS" # todo: MOVED KEY
 SCO_joint_drill_1: "Společná cvičení SCO (bilaterální)" # todo: NEW TRANSLATION
 SCO_joint_drill_1_desc: "Bilaterální vojenská cvičení s partnerem SCO zlepšují taktickou koordinaci." # todo: NEW TRANSLATION
 SCO_joint_drill_desc: "Účast na společných vojenských cvičeních v rámci SCO zlepšuje operační připravenost." # todo: NEW TRANSLATION
 SCO_joint_drill_specific: "Společná cvičení SCO (cílená)" # todo: NEW TRANSLATION
 SCO_joint_drill_specific_desc: "Cílená společná cvičení s partnerem SCO řeší konkrétní operační nedostatky." # todo: NEW TRANSLATION
 SCO_railway_initiator: "Trans-euroasijská železnice (iniciátor)" # todo: NEW TRANSLATION
 SCO_railway_initiator_desc: "Jako hnací síla trans-euroasijské železnice těží tato země z přednostního přístupu k obchodnímu koridoru napříč kontinentem." # todo: NEW TRANSLATION
 SCO_railway_member: "Trans-euroasijská železnice" # todo: NEW TRANSLATION
 SCO_railway_member_desc: "Trans-euroasijská železnice připojuje tuto zemi k vysokokapacitní obchodní síti napříč oblastí SCO." # todo: NEW TRANSLATION
 SCO_trade_agreement_bonus: "Obchodní dohoda SCO" # todo: NEW TRANSLATION
 SCO_trade_agreement_bonus_desc: "Bilaterální obchodní rámec pod záštitou SCO zvyšuje civilní průmyslovou výrobu." # todo: NEW TRANSLATION
 CHI_bri_partner_1: "Účastník Pásu a stezky" # todo: NEW TRANSLATION
 CHI_bri_partner_1_desc: "Byl zahájen první projekt Pásu a stezky. Čínské stavební týmy urychlují domácí výstavbu a propůjčují vládní rozvojové agendě důvěryhodnost." # todo: NEW TRANSLATION
 CHI_bri_partner_2: "Partner Pásu a stezky" # todo: NEW TRANSLATION
 CHI_bri_partner_2_desc: "Druhý projekt Pásu a stezky byl dokončen. Čínské inženýrství a financování infrastruktury se stávají viditelnou součástí národního rozvojového programu." # todo: NEW TRANSLATION
 CHI_bri_partner_3: "Strategický partner Pásu a stezky" # todo: NEW TRANSLATION
 CHI_bri_partner_3_desc: "V celé zemi nyní probíhá několik projektů BRI. Čínští dodavatelé, úvěrové linky a politická podpora posilují kapacitu státu a Peking očekává na oplátku diplomatické sladění." # todo: NEW TRANSLATION
 CHI_bri_partner_4: "Kotviště Pásu a stezky" # todo: NEW TRANSLATION
 CHI_bri_partner_4_desc: "Investice Pásu a stezky podpírají národní hospodářství. Čínský kapitál financuje výstavbu a zásobování spotřebitelů a závislost je nyní obtížné odstranit bez vážných otřesů." # todo: NEW TRANSLATION
 CHI_bri_partner_5: "Klíčový partner Pásu a stezky" # todo: NEW TRANSLATION
 CHI_bri_partner_5_desc: "Tato země je pilířem Pásu a stezky. Čínské normy, dodavatelé a financování jsou součástí každého významného koridoru a hospodářská politika se vytváří s ohledem na Peking." # todo: NEW TRANSLATION
 CHI_airforce_modifier: "Vzdušné síly Lidové osvobozenecké armády" # todo: NEW TRANSLATION
 CHI_airforce_modifier_desc: "Letecká složka Lidové osvobozenecké armády disponující stíhačkami, bombardéry, transportními letouny a integrovanou protivzdušnou obrannou sítí. Představuje její doktrínu, výcvik a vybavení." # todo: NEW TRANSLATION
 CHI_belt_and_road_initiative_idea: "Iniciativa Pásu a stezky" # todo: NEW TRANSLATION
 CHI_belt_and_road_initiative_idea_desc: "Čínská iniciativa Pásu a stezky, zahájená v roce 2013, financuje výstavbu přístavů, železničních koridorů, potrubí, elektráren a digitální infrastruktury v Asii, Africe, na Blízkém východě a v Evropě. Způsobilé státy žádají o projekty, Peking je financuje a staví a každý dokončený projekt zvyšuje hodnost partnera i vlastní postavení Číny.\n\n[CHIGetBRIPortTier][CHIGetBRIRailwayTier][CHIGetBRIPipelineTier][CHIGetBRITelecomTier][CHIGetBRIMineTier][CHIGetBRIPowerplantTier][CHIGetBRIIndustrialZoneTier][CHIGetBRIPrestigeTier]" # todo: NEW TRANSLATION
 CHI_bri_presence_modifier: "Globální přítomnost BRI" # todo: NEW TRANSLATION
 CHI_bri_presence_modifier_desc: "Postavení, které Čína získává ze své sítě Pásu a stezky. Roste s počtem partnerských států a s hloubkou vazeb každého z nich." # todo: NEW TRANSLATION
 CHI_bri_presence_modifier_tt: "Škáluje se podle §Y$CHI_bri_global_presence$§!: souhrnné hodnosti všech partnerů Pásu a stezky. Poptávka po spotřebním zboží klesá až o §G7,5 %§! při přítomnosti 200." # todo: NEW TRANSLATION
 CHI_bri_state_industrial: "Průmyslový projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_industrial_desc: "Starší průmyslový projekt podporovaný Čínou rozšiřuje místní tovární kapacitu a těžbu surovin." # todo: NEW TRANSLATION
 CHI_bri_state_infrastructure: "Infrastrukturní projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_infrastructure_desc: "Starší infrastrukturní projekt Pásu a stezky urychluje regionální výstavbu, práci v docích a průchod zásobování." # todo: NEW TRANSLATION
 CHI_bri_state_port: "Přístavní projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_port_desc: "Rozvoj přístavu podporovaný Čínou rozšiřuje místní logistickou a námořní stavební kapacitu." # todo: NEW TRANSLATION
 CHI_bri_state_rail: "Železniční projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_rail_desc: "Železniční koridor podporovaný Čínou zlepšuje pozemní logistiku a výstavbu infrastruktury." # todo: NEW TRANSLATION
 CHI_bri_state_pipeline: "Potrubní projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_pipeline_desc: "Potrubí podporované Čínou rozšiřuje průchod surovin a regionální zásobovací kapacitu." # todo: NEW TRANSLATION
 CHI_bri_state_telecom: "Telekomunikační projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_telecom_desc: "Digitální páteř podporovaná Čínou zajišťuje síťovou infrastrukturu a budoucí výstavbu." # todo: NEW TRANSLATION
 CHI_bri_state_sez: "Zvláštní ekonomická zóna BRI" # todo: NEW TRANSLATION
 CHI_bri_state_sez_desc: "Zvláštní ekonomická zóna podporovaná Čínou rozšiřuje místní tovární kapacitu a prostor pro výstavbu." # todo: NEW TRANSLATION
 CHI_bri_state_mine: "Těžební projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_mine_desc: "Čínské investice rozšiřují těžbu nerostných ložisek státu." # todo: NEW TRANSLATION
 CHI_bri_state_energy: "Energetický projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_energy_desc: "Výrobní kapacita vybudovaná Čínou podporuje místní průmysl." # todo: NEW TRANSLATION
 CHI_bri_state_prestige: "Prestižní projekt BRI" # todo: NEW TRANSLATION
 CHI_bri_state_prestige_desc: "Dominanta a kancelářský komplex podporovaný Čínou proměňují regionální metropoli." # todo: NEW TRANSLATION
 CHI_coast_guard_standoff: "Patová situace pobřežních stráží" # todo: NEW TRANSLATION
 CHI_coast_guard_standoff_desc: "Každodenní střety mezi čínskými milicemi a japonskou pobřežní stráží snižují místní ekonomickou aktivitu." # todo: NEW TRANSLATION
 CHI_defense_industry: "Čínský obranný průmysl" # todo: NEW TRANSLATION
 CHI_defense_industry_desc: "Čínská obranná průmyslová základna je postavena na velkých státních konglomerátech pokrývajících pozemní, leteckou, námořní a elektronickou výrobu a zásobujících ozbrojené síly i exportní trh. Představuje vojensko-průmyslovou kapacitu země." # todo: NEW TRANSLATION
 CHI_diplomacy_modifier: "Čínská diplomatická síť" # todo: NEW TRANSLATION
 CHI_diplomacy_modifier_desc: "Proměnlivý diplomatický postoj poskytuje nebo odebírá bonusy k měsíčnímu zisku názoru, obchodním vztahům, námořní projekci, efektivitě zásobování, operacím zahraničního vlivu a politické moci podle hloubky investic do čínské diplomatické sítě." # todo: NEW TRANSLATION
 CHI_economy_modifier: "Čínský hospodářský model" # todo: NEW TRANSLATION
 CHI_economy_modifier_desc: "Čína provozuje socialistickou tržní ekonomiku kombinující státní podniky, soukromý průmysl a centrální plánování prostřednictvím po sobě jdoucích pětiletých plánů. Představuje průmyslovou základnu země, fiskální politiku a strukturu obchodu." # todo: NEW TRANSLATION
 CHI_jap_industrial_partnerships: "Čínsko-japonská průmyslová partnerství" # todo: NEW TRANSLATION
 CHI_jap_industrial_partnerships_desc: "Strukturovaná hospodářská spolupráce s Japonskem rozšiřuje přístup k přesné výrobě, pokročilým dodavatelským řetězcům automobilového a elektronického průmyslu a civilnímu jadernému know-how. Partnerství přináší zisky v oblasti výkonu obrněnců, obratnosti letectva, rychlosti námořnictva, výzkumu a průmyslové výroby, ačkoli vzhledem k historickému nepřátelství vyvolává domácí politickou citlivost." # todo: NEW TRANSLATION
 CHI_korea_peninsula_modifier: "Strategie Korejského poloostrova" # todo: NEW TRANSLATION
 CHI_korea_peninsula_modifier_desc: "Čína sdílí pozemní hranici s Korejským poloostrovem a udržuje v regionu politické, hospodářské a zpravodajské vazby. Představuje řízení vztahů, bezpečnost hranic a informační sítě Pekingu na jeho severovýchodním křídle." # todo: NEW TRANSLATION
 CHI_landforce_modifier: "Pozemní síly Lidové osvobozenecké armády" # todo: NEW TRANSLATION
 CHI_landforce_modifier_desc: "Pozemní složka Lidové osvobozenecké armády organizovaná do brigád kombinovaných zbraní v rámci systému velitelství bojišť. Představuje její doktrínu, výcvik a vybavení." # todo: NEW TRANSLATION
 CHI_navy_modifier: "Námořnictvo Lidové osvobozenecké armády" # todo: NEW TRANSLATION
 CHI_navy_modifier_desc: "Námořní složka Lidové osvobozenecké armády tvořená hladinovými loděmi, ponorkami, letadlovými loděmi a námořní pěchotou. Představuje složení flotily, doktrínu a operační dosah." # todo: NEW TRANSLATION
 CHI_northeast_revitalisation: "Revitalizace severovýchodu" # todo: NEW TRANSLATION
 CHI_northeast_revitalisation_desc: "Strategie revitalizace severovýchodu směřuje státní kapitál do průmyslových provincií Liao-ning, Ťi-lin a Chej-lung-ťiang a upřednostňuje těžký průmysl, energetickou infrastrukturu a výstavbu průmyslových komplexů. Zařízení ze sovětské éry se modernizují a vzniká nová výrobní kapacita, která má regionu vrátit jeho roli průmyslové základny." # todo: NEW TRANSLATION
 CHI_political_system: "Čínský politický systém" # todo: NEW TRANSLATION
 CHI_political_system_desc: "Čínská lidová republika je stát jedné strany vedený Komunistickou stranou Číny, organizovaný kolem demokratického centralismu a rozsáhlé administrativní byrokracie. Představuje strukturu vládnutí, stranické instituce a státní kontrolu." # todo: NEW TRANSLATION
 CHI_rare_earth_embargoed: "Embargo na vzácné zeminy" # todo: NEW TRANSLATION
 CHI_rare_earth_embargoed_desc: "Peking omezil zásadní vývoz vzácných zemin do Japonska, čímž ochromil průmyslovou výrobu." # todo: NEW TRANSLATION
 CHI_rare_earth_embargoed_idea: "Embargo na vzácné zeminy" # todo: NEW TRANSLATION
 CHI_rare_earth_embargoed_idea_desc: "Peking omezil zásadní vývoz vzácných zemin, čímž ochromil obranný a high-tech průmysl závislý na čínském zpracování." # todo: NEW TRANSLATION
 CHI_rural_development: "Program rozvoje venkova" # todo: NEW TRANSLATION
 CHI_rural_development_desc: "Cílené investice do venkovské infrastruktury včetně silnic, veřejných služeb a místní administrativní kapacity urychlují stavební činnost ve vybraných okresech. Program zmenšuje příjmovou propast mezi městy a venkovem a snižuje sociální napětí pramenící z nerovnoměrné modernizace." # todo: NEW TRANSLATION
 JAP_china_market_partnerships: "Partnerství pro čínský trh" # todo: NEW TRANSLATION
 JAP_china_market_partnerships_desc: "Hluboká integrace s čínským spotřebitelským a průmyslovým trhem zlepšuje efektivitu japonských továren, stabilizuje náklady na spotřební zboží a podporuje domácí politickou soudržnost. Výrobní kapacita civilní infrastruktury se rozšiřuje a objem bilaterálního obchodu udržuje růst navzdory geopolitickým překážkám." # todo: NEW TRANSLATION
 the_great_chip_race_modifier: "Velké čipové závody" # todo: NEW TRANSLATION
 the_great_chip_race_modifier_desc: "S Čínou závodíme o udržení převahy ve výrobě mikročipů. Obchodní výhody plynoucí z této převahy jsou nezbytné pro udržení našich aliancí a našeho postavení ve světě.\n\nS rostoucí výrobou mikročipů v ČLR získá Tchaj-wan vyšší $production_speed_microchip_plant_factor$ a vyšší $local_resources_microchips_factor$." # todo: NEW TRANSLATION
