 CHI_casic_quality_assurance_cells: "Buňky zajištění jakosti" # todo: NEW TRANSLATION
 CHI_casic_supply_chain_localization: "Lokalizace dodavatelského řetězce" # todo: NEW TRANSLATION
 CHI_casic_thermal_shielding_coatings: "Povlaky pro tepelnou izolaci" # todo: NEW TRANSLATION
