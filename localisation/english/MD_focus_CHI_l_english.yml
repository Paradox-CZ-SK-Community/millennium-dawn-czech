 CHI_Assuage_Japanese_Concerns: "Zklidněte obavy Japonska" # todo: NEW TRANSLATION
 CHI_Assuage_Japanese_Concerns_desc: "Abychom usnadnili navázání s Japonskem, musíme Japonsko ujistit, že naše záměry nejsou nepřátelské. Činy mluví hlasitěji než slova." # todo: NEW TRANSLATION
 CHI_Back_Peaceful_Korean_Unification: "Podpořit mírovou korejskou unifikaci" # todo: NEW TRANSLATION
 CHI_Back_Peaceful_Korean_Unification_desc: "Měli bychom vyjádřit naši podporu pro eventualní sjednocení Korejského poloostrova pod nezávislou vládou bez vnějšího vlivu. Zda k této eventualitě dojde, je na Korejcích." # todo: NEW TRANSLATION
 CHI_beijing_municipality: "Beijing Municipalita" # todo: NEW TRANSLATION
 CHI_bri_africa_engagement_desc: "Kumulativní skóre zapojení do BRI v Africe; spolu s dokončenými projekty FOCAC je nutné k odemčení vrcholného projektu africké kontinentální integrace." # todo: NEW TRANSLATION
 CHI_bri_centralasia_engagement_desc: "Kumulativní skóre zapojení do BRI ve Střední Asii; přispívá k bonusům koridoru Ekonomického pásu Hedvábné stezky." # todo: NEW TRANSLATION
 CHI_bri_defaulted_projects_desc: "Počet projektů, u nichž příjemce nesplnil podmínky půjčky; spouští volbu mezi restrukturalizací dluhu a zabavením aktiv." # todo: NEW TRANSLATION
 CHI_bri_europe_engagement_desc: "Kumulativní skóre zapojení do BRI v Evropě; nutné k udržení mechanismu 17+1 a odemčení bonusů evropského propojení v pozdní fázi hry." # todo: NEW TRANSLATION
 CHI_bri_latam_engagement_desc: "Kumulativní skóre zapojení do BRI v Latinské Americe; odemyká se dokončením infrastrukturních projektů ve Venezuele, Ekvádoru, Brazílii, Argentině a Bolívii." # todo: NEW TRANSLATION
 CHI_bri_meast_engagement_desc: "Kumulativní skóre zapojení do BRI na Blízkém východě; přispívá k míře přijímání zúčtování v petrojüanech." # todo: NEW TRANSLATION
 CHI_bri_monthly_income_desc: "Měsíční příjem v renminbi generovaný aktivními projekty BRI před uplatněním násobitele výnosů." # todo: NEW TRANSLATION
 CHI_bri_pacific_engagement_desc: "Čínské zapojení do států tichomořských ostrovů: diplomatická uznání, ústupky v oblasti rybolovu a mořského dna a bezpečnostní dohody." # todo: NEW TRANSLATION
 CHI_bri_predatory_score_desc: "Sleduje, jak agresivně jsme uplatňovali taktiky dluhové páky a zabavování aktiv; vysoké hodnoty odemykají cestu doktríny Hambantota a zvyšují počet příležitostí k zabavení po nesplácení." # todo: NEW TRANSLATION
 CHI_bri_project_slots_desc: "Maximální počet projektů BRI, které může Čína spravovat současně" # todo: NEW TRANSLATION
 CHI_bri_returns_multiplier_desc: "Násobitel uplatňovaný na tok výnosů z projektů; zvyšují jej aktivní tajemníci IC a dokončení některých zaměření." # todo: NEW TRANSLATION
 CHI_bri_seasia_engagement_desc: "Kumulativní skóre zapojení do BRI v jihovýchodní Asii; ovlivňuje dostupnost rozhodnutí o spolupráci Lancang–Mekong." # todo: NEW TRANSLATION
 CHI_bri_southasia_engagement_desc: "Kumulativní skóre zapojení do BRI v jižní Asii; ovlivňuje rychlost zvyšování úrovní a velikost bonusů pro jihoasijské partnery." # todo: NEW TRANSLATION
 CHI_bri_winwin_score_desc: "Sleduje, jak důsledně jsme uplatňovali ústupkové a reformované úvěrové podmínky; vysoké hodnoty odemykají diplomacii restrukturalizace dluhu a zlepšují přízeň příjemců." # todo: NEW TRANSLATION
 CHI_Buffer_State_Doctrine: "Doktrína nárazníkového státu" # todo: NEW TRANSLATION
 CHI_Buffer_State_Doctrine_desc: "Severní Korea slouží jako strategický nárazník mezi námi a silami v Jižní Koreji spojenými s Amerikou. Posílením této role zajistíme, aby Pchjongjang zůstal pevně v naší sféře vlivu a aby žádná nepřátelská mocnost nezískala přítomnost na našich hranicích." # todo: NEW TRANSLATION
 CHI_casic_adaptive_warhead_tuning: "Adaptivní ladění hlavice" # todo: NEW TRANSLATION
 CHI_casic_cost_optimized_electronics: "Nákladově optimalizovaná elektronika" # todo: NEW TRANSLATION
