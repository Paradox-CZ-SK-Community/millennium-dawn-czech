 CHI_legitimacy_concentrated_desc: "Stálý výbor politbyra už nepotřebuje kvórum – kruh generálního tajemníka se slil se sítí. Ústřední komise pro disciplinární inspekci je nyní jen zdvořilostní institucí." # todo: NEW TRANSLATION
 CHI_Lips_and_Teeth: "Rty a zuby" # todo: NEW TRANSLATION
 CHI_Lips_and_Teeth_desc: "Historické označení čínsko-severokorejských vztahů jako vztahu „blízkého jako rty a zuby“ řídí čínskou politiku od korejské války. Formalizace této doktríny zavazuje Čínu k přežití Kimova režimu a prohlubuje vazby s Pchjongjangem za cenu širšího korejského usmíření." # todo: NEW TRANSLATION
 CHI_mass_line_campaign: "Kampaň masové linie" # todo: NEW TRANSLATION
 CHI_mass_line_campaign_desc: "Úředníci jsou vysíláni do venkovských komunit, kde musí jíst s farmáři a podávat zprávy o místních podmínkách. Z vládních úřadů je odstraněno luxusní zboží a okázalé veřejné výdaje jsou veřejně odsuzovány. Kampaň proměňuje viditelné chování úředníků a omezuje neformální spotřebu, která odváděla státní zdroje do soukromých kanálů." # todo: NEW TRANSLATION
 CHI_Mediate_Korean_Peace_Talks: "Zprostředkovat korejské mírové rozhovory" # todo: NEW TRANSLATION
 CHI_Mediate_Korean_Peace_Talks_desc: "Příliš dlouho Korejský poloostrov existoval ve zmrazeném válečném stavu. Napětí mezi Severní a Jižní Koreou vychází z vzájemné nedůvěry ohledně obranných akcí, které bývají nesprávně chápány jako útočné. K prolomení této vnitřní patové situace bude zapotřebí znepokojující externí aktér, jako je Čína." # todo: NEW TRANSLATION
 CHI_mongolia_autonomous_region: "Mongolsko Autonomní oblast" # todo: NEW TRANSLATION
 CHI_Mount_Paektu_Understanding: "Dohoda o hoře Pektu" # todo: NEW TRANSLATION
 CHI_Mount_Paektu_Understanding_desc: "Tajná dvoustranná dohoda uzavřená ve stínu hory Pektu – mytizovaného rodiště dynastie Kimů – formalizuje čínské bezpečnostní konzultace se severokorejským vojenským velením." # todo: NEW TRANSLATION
