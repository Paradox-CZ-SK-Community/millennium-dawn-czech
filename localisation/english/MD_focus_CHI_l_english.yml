 TAI_foreign_interference: "Zahraniční vměšování na Tchaj-wanu" # todo: NEW TRANSLATION
 TAI_CSSTA_signed: "Podepsána Dohoda o obchodu se službami přes průliv" # todo: NEW TRANSLATION
 USA_TAI_carrier_sent: "Americká letadlová loď vyslána do Tchajwanského průlivu" # todo: NEW TRANSLATION
 USA_TAI_recon_active: "Aktivní americké průzkumné lety nad Tchaj-wanem" # todo: NEW TRANSLATION
 USA_TAI_arms_sale_active: "Aktivní prodej amerických zbraní Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_TAI_maritime_zone_active: "Vyhlášena čínská námořní bezpečnostní zóna" # todo: NEW TRANSLATION
 CHI_TAI_partial_blockade_active: "Aktivní částečná blokáda Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_SAR_MIO_share_tt: "Všechny loutkové státy ZAO získají přístup k čínským vojensko-průmyslovým organizacím." # todo: NEW TRANSLATION
 CHI_tai_pressure_economic_tt: "Čína využívá obchodní závislosti k nátlaku na Washington, aby omezil podporu Tchaj-wanu. Spojené státy se musí rozhodnout, jak reagovat." # todo: NEW TRANSLATION
 CHI_tai_pressure_diplomatic_tt: "Čína otevírá umírněné diplomatické kanály s cílem přesvědčit Washington, aby se od Tchaj-wanu distancoval." # todo: NEW TRANSLATION
 CHI_pressure_derecognize_TAI_tt: "Čína uplatňuje ekonomický a diplomatický tlak. Pokud cíl ve stanovené lhůtě nestáhne uznání Tchaj-wanu, Čína uvalí obchodní embargo." # todo: NEW TRANSLATION
 TAI_reduced_us_support: "Oslabená vojenská podpora USA" # todo: NEW TRANSLATION
 TAI_reduced_us_support_desc: "Po čínském nátlaku na Washington Spojené státy omezily dodávky zbraní a vojenskou spolupráci s Tchaj-wanem. Ozbrojené síly čelí nižší připravenosti a morálce mezi jednotkami závislými na americkém vybavení a doktríně." # todo: NEW TRANSLATION
 TAI_isolated_from_us: "Opuštěný Washingtonem" # todo: NEW TRANSLATION
 TAI_isolated_from_us_desc: "Spojené státy pod trvalým čínským tlakem formálně stáhly vojenskou a diplomatickou podporu Tchaj-wanu. Ozbrojené síly zůstávají bez hlavního bezpečnostního garanta, což vážně podkopává obrannou kapacitu i důvěru civilního obyvatelstva." # todo: NEW TRANSLATION
 CHI_TAI_shared_modifier: "Vztahy přes Tchajwanský průliv" # todo: NEW TRANSLATION
 CHI_TAI_shared_modifier_desc: "Dynamický index ekonomické a politické vzájemné závislosti napříč Tchajwanským průlivem. Užší vazby zvyšují stabilitu a demokratický odklon a zároveň zlepšují obchodní vztahy, efektivitu továren, rychlost výzkumu a stavební výstup; odcizení naopak podporuje komunistický odklon, vnitřní politický tlak a kapacitu námořních nájezdů." # todo: NEW TRANSLATION
 CHI_SAR_network_modifier: "Systém jedné Číny" # todo: NEW TRANSLATION
 CHI_SAR_network_modifier_desc: "" # todo: NEW TRANSLATION
 CHI_TAI_intl_isolation_modifier: "Index mezinárodní izolace" # todo: NEW TRANSLATION
 CHI_TAI_intl_isolation_modifier_desc: "Dynamické měřítko diplomatické izolace Tchaj-wanu, které se mění nepřímo podle počtu členských států OSN udržujících formální diplomatické uznání. Menší počet uznávajících států zesiluje postihy obchodního názoru, zahraničního vlivu a nákladů na zlepšování vztahů s Čínou; širší uznání tyto vztahy naopak zlepšuje a zvyšuje diplomatickou páku Tchaj-wanu." # todo: NEW TRANSLATION
 CHI_TAI_air_dominance: "Vzdušná převaha nad průlivem" # todo: NEW TRANSLATION
 CHI_TAI_air_dominance_desc: "Operace letectva PLA nad Tchajwanským průlivem vytvořily trvalý letecký tlak na tchajwanskou obranu a oslabily její schopnost zpochybňovat kontrolu vzdušného prostoru." # todo: NEW TRANSLATION
 CHI_TAI_naval_modernization_idea: "Modernizace námořnictva" # todo: NEW TRANSLATION
 CHI_TAI_naval_modernization_idea_desc: "Urychlený program pořizování námořnictva PLA dodal moderní flotilu schopnou dlouhodobých operací v Tchajwanském průlivu." # todo: NEW TRANSLATION
 TAI_blockade_economic_crisis: "Ekonomická krize způsobená blokádou" # todo: NEW TRANSLATION
 TAI_blockade_economic_crisis_desc: "Čínská námořní blokáda přerušila námořní obchodní trasy Tchaj-wanu a způsobila vážný nedostatek paliva, surovin a spotřebního zboží. Průmyslová výroba se zhroutila." # todo: NEW TRANSLATION
 TAI_self_sufficiency: "Opatření soběstačnosti" # todo: NEW TRANSLATION
 TAI_self_sufficiency_desc: "Nouzová opatření k rozvoji domácí výrobní kapacity a snížení závislosti na dováženém zboží začínají působit a částečně vyrovnávají dopad blokády." # todo: NEW TRANSLATION
 TAI_cyber_sabotage: "Kybernetická sabotáž" # todo: NEW TRANSLATION
 TAI_cyber_sabotage_desc: "Koordinovaná čínská kybernetická operace narušila kritickou infrastrukturu, vojenskou komunikaci a finanční systémy po celém Tchaj-wanu." # todo: NEW TRANSLATION
 TAI_blockade_partial: "Narušení námořní dopravy" # todo: NEW TRANSLATION
 TAI_blockade_partial_desc: "Čínská vyhlášená námořní bezpečnostní zóna narušuje obchodní lodní dopravu a zvyšuje pojistné pro plavidla směřující do tchajwanských přístavů." # todo: NEW TRANSLATION
 TAI_emergency_situation: "Výjimečný stav" # todo: NEW TRANSLATION
 TAI_emergency_situation_desc: "Tchaj-wan vyhlásil v reakci na čínskou blokádu výjimečný stav. Branná povinnost byla rozšířena a opatření civilní obrany aktivována, ekonomické náklady jsou však značné." # todo: NEW TRANSLATION
 CHI_recognition_embargo: "Embargo za uznání" # todo: NEW TRANSLATION
 CHI_recognition_embargo_desc: "Čína uvalila přísné ekonomické a diplomatické postihy na každý stát, který udržuje formální diplomatické uznání Tchaj-wanu. Náklady obchodu s Čínou výrazně vzrostly a přístup na čínské trhy je silně omezen." # todo: NEW TRANSLATION
 CHI_TAI_tourism_ban: "Zmrazení turismu přes průliv" # todo: NEW TRANSLATION
 CHI_TAI_tourism_ban_desc: "ČLR pozastavila skupinový i individuální výjezdový turismus na Tchaj-wan a přerušila příliv návštěvníků, který narůstal od liberalizace cestování přes průliv v roce 2008. V roce 2019 Peking rozšířil zákaz i na povolení k individuálním návštěvám a zastavil stovky tisíc cestujících ročně. Opatření přímo poškozuje tchajwanské pohostinství, maloobchod a služby a zároveň signalizuje ochotu Pekingu využít ekonomickou vzájemnou závislost jako donucovací nástroj." # todo: NEW TRANSLATION
 CHI_crossstrait_operations: "Připravenost operací přes průliv" # todo: NEW TRANSLATION
 CHI_crossstrait_operations_desc: "PLA dosáhla plné operační připravenosti ke kombinovaným obojživelným a vzdušným operacím přes Tchajwanský průliv." # todo: NEW TRANSLATION
 CHI_TAI_amphibious_mastery: "Doktrína obojživelného útoku" # todo: NEW TRANSLATION
 CHI_TAI_amphibious_mastery_desc: "Jednotky námořní pěchoty PLA dosáhly vysoké úrovně schopností v kombinovaných obojživelných operacích díky intenzivním výcvikovým cvičením v Tchajwanském průlivu." # todo: NEW TRANSLATION
 CHI_TAI_military_buildup_idea: "Vojenské posilování přes průliv" # todo: NEW TRANSLATION
 CHI_TAI_military_buildup_idea_desc: "Lidová osvobozenecká armáda soustředila podél pobřeží Fu-ťienu značné pozemní, námořní a letecké síly v rámci přípravy na možný scénář v Tchajwanském průlivu." # todo: NEW TRANSLATION
 china_sar.027.t: "Tchajwanská otázka: Úvodní kroky" # todo: NEW TRANSLATION
 china_sar.027.d: "Státní rada schválila dlouhodobou kampaň s cílem oslabit americkou podporu Tchaj-wanu. Ekonomická páka, diplomatická izolace a vojenské signalizování jsou dostupnými nástroji. Otázkou je, jak silně a jak rychle zatlačit." # todo: NEW TRANSLATION
 china_sar.027.a: "Uplatnit maximální ekonomický tlak. Náklady podpory Tchaj-wanu učiníme neúnosnými." # todo: NEW TRANSLATION
 china_sar.027.b: "Začít umírněnými diplomatickými návrhy. Trpělivost přináší lepší výsledky než konfrontace." # todo: NEW TRANSLATION
 china_sar.028.t: "Washington zvažuje možnosti" # todo: NEW TRANSLATION
 china_sar.028.d: "Pekingská nátlaková kampaň dorazila do Washingtonu v nepříhodný okamžik. Administrativa čelí soupeřícím frakcím: jestřábům požadujícím pevné znovupotvrzení závazku vůči Tchaj-wanu a pragmatikům obávajícím se ekonomických důsledků antagonizace Číny." # todo: NEW TRANSLATION
 china_sar.028.a: "Znovu potvrdit náš závazek vůči Tchaj-wanu. Čínský tlak pouze posiluje naše odhodlání." # todo: NEW TRANSLATION
 china_sar.028.b: "Vzít čínské obavy na vědomí. Můžeme najít vzorec, který sníží napětí, aniž bychom Tchaj-wan opustili." # todo: NEW TRANSLATION
 china_sar.029.t: "Eskalace: Čína zvyšuje sázky" # todo: NEW TRANSLATION
 china_sar.029.d: "Washingtonské odmítnutí dopadlo v Čung-nan-chaj špatně. Vedení je pod tlakem, aby ukázalo, že vzdor má své náklady. Na stole jsou dvě možnosti: vybudovat diplomatickou koalici proti americké politice vůči Tchaj-wanu, nebo signalizovat vojenské odhodlání cvičeními v průlivu." # todo: NEW TRANSLATION
 china_sar.029.a: "Vybudovat mezinárodní koalici. Diplomatická izolace je udržitelnější než konfrontace." # todo: NEW TRANSLATION
 china_sar.029.b: "Provést cvičení v Tchajwanském průlivu. Washington musí pochopit vojenský rozměr našeho závazku." # todo: NEW TRANSLATION
 china_sar.030.t: "Washington nabízí částečný ústupek" # todo: NEW TRANSLATION
 china_sar.030.d: "Po vnitřní debatě administrativa signalizovala ochotu omezit, nikoli však ukončit, prodej zbraní Tchaj-wanu. Nabídka je rámována jako gesto ve prospěch stability. Peking se musí rozhodnout, zda přijme částečný zisk, nebo bude tlačit na úplné stažení." # todo: NEW TRANSLATION
 china_sar.030.a: "Přijmout ústupek. Částečný zisk je stále zisk." # todo: NEW TRANSLATION
 china_sar.030.b: "Nabídku odmítnout. Jediným přijatelným výsledkem je úplné stažení podpory." # todo: NEW TRANSLATION
 china_sar.031.t: "Amerika na rozcestí" # todo: NEW TRANSLATION
 china_sar.031.d: "Trvalá čínská nátlaková kampaň donutila Washington k poslednímu rozhodnutí. Zpravodajská komunita varuje, že další ústupky riskují povzbuzení Pekingu v celém indopacifickém regionu. Ekonomické náklady konfrontace jsou však také skutečné. Administrativa musí zvolit." # todo: NEW TRANSLATION
 china_sar.031.a: "Stáhnout formální podporu Tchaj-wanu. Vztah s Pekingem je příliš důležitý na to, abychom jej obětovali." # todo: NEW TRANSLATION
 china_sar.031.b: "Plně znovu potvrdit náš závazek vůči Tchaj-wanu. Nenecháme se zastrašit k opuštění spojence." # todo: NEW TRANSLATION
 china_sar.032.t: "Washington ustupuje od Tchaj-wanu" # todo: NEW TRANSLATION
 china_sar.032.d: "Spojené státy v tichém, ale zásadním obratu signalizovaly, že již nebudou Tchaj-wanu poskytovat aktivní vojenskou a diplomatickou podporu jeho odděleného statusu. Oznámení je formulováno byrokratickým jazykem, jeho strategický význam je však nezaměnitelný: Tchaj-wan stojí sám." # todo: NEW TRANSLATION
 china_sar.032.a: "Historický úspěch. Cesta ke znovusjednocení je nyní otevřená." # todo: NEW TRANSLATION
 china_sar.033.t: "Washington znovu potvrzuje svůj závazek" # todo: NEW TRANSLATION
 china_sar.033.d: "Spojené státy odmítly čínskou nátlakovou kampaň a veřejně znovu potvrdily svůj závazek k bezpečnosti Tchaj-wanu. Administrativa oznámila nový balíček zbraní pro Tchaj-pej a svolala naléhavé konzultace s Japonskem a Austrálií. Pekingská kampaň selhala a posílila odpor ve Washingtonu." # todo: NEW TRANSLATION
 china_sar.033.a: "Neúspěch, nikoli porážka. Znovu posoudíme svůj přístup." # todo: NEW TRANSLATION
 china_sar.049.t: "Washington stahuje svou záruku" # todo: NEW TRANSLATION
 china_sar.049.d: "Spojené státy oznámily Tchaj-peji, že jejich bezpečnostní záruka již neplatí a že označení Tchaj-wanu za významného spojence mimo NATO bylo zrušeno. Dodávky zbraní jsou pozastaveny, společná cvičení zrušena a počet styčného personálu omezen na symbolickou přítomnost. Tchaj-wan nyní stojí bez svého hlavního bezpečnostního garanta." # todo: NEW TRANSLATION
 china_sar.049.a: "Budeme se muset bránit sami." # todo: NEW TRANSLATION
 china_sar.001.t: "Návrh Dohody o obchodu se službami mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 china_sar.001.d: "Peking předložil Dohodu o obchodu se službami mezi oběma břehy průlivu, která otevírá hlavní sektory služeb na obou stranách volnějšímu obchodu a investicím. Návrh by firmám z pevniny poskytl přístup k tchajwanskému bankovnictví, zdravotnictví a maloobchodu. Zastánci tvrdí, že by prohloubil ekonomickou integraci; kritici varují, že dává Pekingu strukturální vliv na tchajwanskou ekonomiku." # todo: NEW TRANSLATION
 china_sar.001.a: "Podepište dohodu. Ekonomická integrace slouží našim dlouhodobým zájmům." # todo: NEW TRANSLATION
 china_sar.001.b: "Odmítněte dohodu. Ústupky jsou příliš rozsáhlé a dohled příliš slabý." # todo: NEW TRANSLATION
 china_sar.002.t: "Obchodní sítě mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 china_sar.002.d: "Obchodní sítě podporující Peking se rozšířily do tchajwanského finančního a mediálního sektoru, podporované kapitálem z pevniny a usnadněné řadou neprůhledných investičních dohod. Vláda se musí rozhodnout, jak reagovat na rostoucí vliv, který stírá hranici mezi obchodem a politikou." # todo: NEW TRANSLATION
 china_sar.002.a: "Vítejme výměny mezi oběma břehy. Ekonomické vazby jsou základem stability." # todo: NEW TRANSLATION
 china_sar.002.b: "Monitorujme tyto sítě, ale neomezujme je. Přehnaná reakce by poškodila legitimní obchod." # todo: NEW TRANSLATION
 china_sar.002.c: "Uvalme omezení na investice z pevniny v citlivých sektorech." # todo: NEW TRANSLATION
 china_sar.003.t: "Otázka konsenzu z roku 1992" # todo: NEW TRANSLATION
 china_sar.003.d: "Pevninská Čína formálně navrhla obnovit konsenzus z roku 1992 jako diplomatický základ rozhovorů mezi oběma břehy průlivu. Tato formule je záměrně nejednoznačná: Peking ji vykládá jako závazek k cíli sjednocení pod jednou Čínou, zatímco KMT ji tradičně přijímal podle formule „jedna Čína, různá vymezení“. DPP ji dlouhodobě odmítá jako politickou past. Tchaj-wan musí odpovědět." # todo: NEW TRANSLATION
 china_sar.003.a: "Přijměme konsenzuální formuli. „Jedna Čína, různá vymezení“ zachovává naši pozici a zároveň otevírá cestu k dialogu." # todo: NEW TRANSLATION
 china_sar.003.b: "Uznávejme ducha dialogu, aniž bychom formuli výslovně podpořili. Usilujeme o mír, nikoli o politický závazek." # todo: NEW TRANSLATION
 china_sar.003.c: "Odmítněme konsenzus. Každá formule naznačující přijetí „jedné Číny“ podkopává náš suverénní status." # todo: NEW TRANSLATION
 china_sar.004.t: "Síly podporující nezávislost zvítězily na Tchaj-wanu" # todo: NEW TRANSLATION
 china_sar.004.d: "Tábor podporující nezávislost získal ve tchajwanských volbách většinu. Nastupující vláda dala jasně najevo, že nepřijme konsenzus z roku 1992, a hodlá zaujmout rozhodnější postoj k mezinárodnímu statusu Tchaj-wanu. Vztahy mezi oběma břehy průlivu vstupují do období ochlazení." # todo: NEW TRANSLATION
 china_sar.004.a: "Neúspěch. Přehodnotíme svůj přístup k Tchaj-peji." # todo: NEW TRANSLATION
 china_sar.005.t: "Odhaleny pekingské operace vměšování" # todo: NEW TRANSLATION
 china_sar.005.d: "Tchajwanský Úřad národní bezpečnosti odhalil důkazy o operacích napojených na ČLR, jejichž cílem bylo ovlivnit domácí politiku, včetně mediálních investic prostřednictvím prostředníků, financování politických představitelů podporujících spolupráci a budování obchodních sítí využívaných k šíření politických sdělení. Zjištění unikla do tisku a vyvolávají veřejné pobouření." # todo: NEW TRANSLATION
 china_sar.005.a: "Vyhošťme dotčené kulturní atašé a vydejme formální protest. Nebudeme tolerovat zahraniční manipulaci s naší demokracií." # todo: NEW TRANSLATION
 china_sar.006.t: "Tchaj-wan vyhostil čínské představitele" # todo: NEW TRANSLATION
 china_sar.006.d: "Tchaj-pej formálně vyhostila několik kulturních a obchodních atašé poté, co byly odhaleny pekingské operace politického vlivu. Tento krok sklidil potlesk tchajwanských demokratických spojenců a ostré veřejné odsouzení pekingského ministerstva zahraničních věcí." # todo: NEW TRANSLATION
 china_sar.006.a: "Absorbujme diplomatické náklady. Odhalení operace nás vrací zpět, ale širší strategie zůstává správná." # todo: NEW TRANSLATION
 china_sar.035.t: "Pekingské kulturní působení" # todo: NEW TRANSLATION
 china_sar.035.d: "Čína a Vnitřní Mongolsko zahájily v Mongolsku koordinovanou kampaň kulturního vlivu, která propaguje společné mongolské dědictví a zároveň směřuje veřejné mínění k užší integraci. Peking tuto snahu prezentuje jako kulturní výměnu, její politické důsledky jsou však nepochybné." # todo: NEW TRANSLATION
 china_sar.035.a: "Nemáme jinou možnost než to uznat." # todo: NEW TRANSLATION
 china_sar.036.t: "Unie s Vnitřním Mongolskem?" # todo: NEW TRANSLATION
 china_sar.036.d: "Oficiální delegace z Pekingu a Chöch chotu dorazila do Ulánbátaru s formálním návrhem: Mongolsko je pozváno, aby se připojilo k Čínské lidové republice jako zvláštní administrativní oblast v rámci modelu „jedna země, dva systémy“. Nabídka přichází s ekonomickými zárukami a příslibem kulturní autonomie, ale také s plnou vahou čínského vlivu." # todo: NEW TRANSLATION
 china_sar.036.a: "Nabídku přijímáme." # todo: NEW TRANSLATION
 china_sar.036.b: "Mongolsko zůstane nezávislé." # todo: NEW TRANSLATION
 china_sar.037.t: "Mongolsko odmítá sjednocení" # todo: NEW TRANSLATION
 china_sar.037.d: "Ulánbátar formálně odmítl návrh na sjednocení. Mongolská vláda se odvolává na národní suverenitu a odpor veřejnosti, ačkoli diplomatické kanály zůstávají otevřené. Peking rozhodnutí uznává, zároveň však dává jasně najevo, že nabídka trvá." # todo: NEW TRANSLATION
 china_sar.037.a: "Zkusíme to znovu." # todo: NEW TRANSLATION
 china_sar.038.t: "Peking navrhuje hospodářskou spolupráci mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 china_sar.038.d: "Peking předložil Tchaj-peji formální návrh rámce hospodářské spolupráce mezi oběma břehy průlivu. Představitelé pevniny jej prezentují jako pragmatické a oboustranně výhodné uspořádání, které zcela obchází otázku suverenity. Tchajwanské obchodní skupiny jsou vstřícné, opozice orientovaná na nezávislost však varuje před pomalým sklouznutím k závislosti na ekonomice pevniny." # todo: NEW TRANSLATION
 china_sar.038.a: "Zapojme se do tohoto rámce." # todo: NEW TRANSLATION
 china_sar.038.b: "Odmítněme tuto nabídku." # todo: NEW TRANSLATION
 china_sar.039.t: "Peking nabízí rozšíření obchodu mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 china_sar.039.d: "Na základě otevření hospodářského dialogu Peking navrhuje výrazné rozšíření obchodu mezi oběma břehy průlivu, snížení cel a uvolnění omezení tchajwanského vývozu na pevninu. Nabídka připomíná Rámcovou dohodu o hospodářské spolupráci a nabízí přístup k obrovskému trhu pevniny. Kritici v Tchaj-peji se obávají, že ústupky jsou podmíněny politickými závazky." # todo: NEW TRANSLATION
 china_sar.039.a: "Rozšiřme obchod s pevninou." # todo: NEW TRANSLATION
 china_sar.039.b: "Odmítněme rozšíření obchodu." # todo: NEW TRANSLATION
 china_sar.040.t: "Přístup tchajwanských firem na trh pevniny" # todo: NEW TRANSLATION
 china_sar.040.d: "Peking zve tchajwanské podniky k působení na pevnině za zvýhodněných podmínek a nabízí kancelářské prostory, společná stavební práva a zjednodušené licencování. Pro tchajwanskou exportně orientovanou ekonomiku je tato příležitost značná, hlubší obchodní propojení s pevninou však v Tchaj-peji zůstává politicky citlivé." # todo: NEW TRANSLATION
 china_sar.040.a: "Přijměme zvýhodněný přístup na trh." # todo: NEW TRANSLATION
 china_sar.040.b: "Držme naše firmy v bezpečném odstupu." # todo: NEW TRANSLATION
 china_sar.041.t: "Koordinace polovodičů mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 china_sar.041.d: "Peking navrhuje koordinaci mezi pevninou a světově vedoucím tchajwanským polovodičovým průmyslem, včetně společných výrobních závodů a sdíleného výzkumu. Tchajwanský čipový sektor je jeho největším strategickým aktivem a nejsilnějším štítem; sdílení s pevninou by bylo výnosné, zároveň by však oslabilo samotný vliv, který udržuje angažovanost partnerů Tchaj-peje." # todo: NEW TRANSLATION
 china_sar.041.a: "Koordinujme výrobu polovodičů." # todo: NEW TRANSLATION
 china_sar.041.b: "Chraňme náš čipový průmysl." # todo: NEW TRANSLATION
 china_sar.042.t: "Výměna obchodních delegací" # todo: NEW TRANSLATION
 china_sar.042.d: "Peking zve k vzájemným návštěvám obchodních delegací v průmyslových centrech na obou stranách průlivu, čímž vzniknou osobní vazby mezi vedoucími představiteli pevniny a Tchaj-wanu. Návštěvy jsou málo rizikové a obchodně užitečné, každá z nich však dále zahušťuje síť ekonomické vzájemné závislosti mezi oběma břehy." # todo: NEW TRANSLATION
 china_sar.042.a: "Vyměňme si delegace." # todo: NEW TRANSLATION
 china_sar.042.b: "Návštěvy odmítněme." # todo: NEW TRANSLATION
 china_sar.043.t: "Přímé dopravní spojení mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 china_sar.043.d: "Peking navrhuje rozšíření přímého dopravního spojení přes průliv, které navazuje na politiku Tří spojení prostřednictvím nových lodních tras, leteckých spojů a infrastruktury. Přímé spojení by snížilo náklady podnikům i cestujícím a ještě těsněji by propojilo obě ekonomiky." # todo: NEW TRANSLATION
 china_sar.043.a: "Otevřeme přímé dopravní spojení." # todo: NEW TRANSLATION
 china_sar.043.b: "Omezme přímé spojení." # todo: NEW TRANSLATION
 china_sar.044.t: "Investiční záruky mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 china_sar.044.d: "Peking nabízí formální dohodu zaručující právní ochranu tchajwanských investic na pevnině a řešící dlouhodobé obavy ohledně vlastnických práv a arbitráže. Záruky by uklidnily opatrné investory, zároveň by však upevnily rámec, v němž Tchaj-pej jedná s Pekingem jako s hospodářským partnerem." # todo: NEW TRANSLATION
 china_sar.044.a: "Podepišme investiční záruky." # todo: NEW TRANSLATION
 china_sar.044.b: "Dohodu odmítněme." # todo: NEW TRANSLATION
 china_sar.045.t: "Společné průmyslové plánování mezi oběma břehy" # todo: NEW TRANSLATION
 china_sar.045.d: "Peking navrhuje koordinované průmyslové plánování napříč průlivem, které by sladilo dodavatelské řetězce, standardy a velké projekty. Taková integrace by přinesla skutečnou efektivitu, zároveň by však začlenila tchajwanskou ekonomiku do dlouhodobé strategie pevniny, což znepokojuje voliče v Tchaj-peji zaměřené na suverenitu." # todo: NEW TRANSLATION
 china_sar.045.a: "Sladíme naše průmyslové plánování." # todo: NEW TRANSLATION
 china_sar.045.b: "Plánujme naši ekonomiku nezávisle." # todo: NEW TRANSLATION
 china_sar.046.t: "Hluboká ekonomická integrace mezi oběma břehy" # todo: NEW TRANSLATION
 china_sar.046.d: "Peking navrhuje závěrečnou fázi hospodářské unie mezi oběma břehy průlivu: hluboce integrovaný trh s harmonizovanou regulací a volným pohybem zboží a kapitálu. Zastánci poukazují na prosperitu, kterou by přinesla; odpůrci varují, že v takové hloubce je hospodářskou unii obtížné odlišit od politického pohlcení." # todo: NEW TRANSLATION
 china_sar.046.a: "Dokončeme ekonomickou integraci." # todo: NEW TRANSLATION
 china_sar.046.b: "Zastavme se na břehu." # todo: NEW TRANSLATION
 china_sar.047.t: "Tchaj-pej zvažuje dohodu o sjednocení" # todo: NEW TRANSLATION
 china_sar.047.d: "Peking předložil konečný rámec pokojného sjednocení: Tchaj-wan by se znovu připojil k Čínské lidové republice jako zvláštní administrativní oblast a v rámci modelu jedné země a dvou systémů by si zachoval vlastní správu, právní systém a ekonomiku. Po letech uvolňování napětí mezi oběma břehy nyní dohoda čeká v Tchaj-peji na ratifikaci." # todo: NEW TRANSLATION
 china_sar.047.a: "Ratifikujme dohodu a sjednoťme se." # todo: NEW TRANSLATION
 china_sar.047.b: "Ostrov na to ještě není připraven." # todo: NEW TRANSLATION
 china_sar.048.t: "Hongkong se rozpouští" # todo: NEW TRANSLATION
 china_sar.048.d: "Legislativní rada hlasováním rozhodla ukončit existenci zvláštní administrativní oblasti a podřídit Hongkong přímé ústřední správě. Sinizace dokončila svůj běh: místní vláda nyní žádá Peking o dokončení předání s předstihem a na území již nezůstal žádný politický proud ochotný tvrdit opak." # todo: NEW TRANSLATION
 china_sar.048.a: "Perla se vrací do lůna." # todo: NEW TRANSLATION
 china_sar.007.t: "Nebezpečné přiblížení nad průlivem" # todo: NEW TRANSLATION
 china_sar.007.d: "Stíhací letoun CHAL provedl agresivní zachycení cizího vojenského letounu operujícího poblíž střední linie Tchajwanského průlivu. Setkání zachycené kamerou v kokpitu ukazuje čínského pilota, jak prolétá několik metrů od cílového letounu. Mezinárodní média požadují reakci." # todo: NEW TRANSLATION
 china_sar.007.a: "Popřeme účast a zmírněme napětí." # todo: NEW TRANSLATION
 china_sar.007.b: "Zachovejme oficiální mlčení." # todo: NEW TRANSLATION
 china_sar.007.c: "Veřejně obhajujme tento čin jako zákonné vymáhání práva." # todo: NEW TRANSLATION
 china_sar.008.t: "Námořní srážka v Tchajwanském průlivu" # todo: NEW TRANSLATION
 china_sar.008.d: "Torpédoborec čínského námořnictva a cizí válečná loď se během těsného setkání v Tchajwanském průlivu srazily. Obě plavidla utrpěla škody. Incident vyvolal mezinárodní pobouření a staví Peking do obtížné situace." # todo: NEW TRANSLATION
 china_sar.008.a: "Obviňme druhou stranu z bezohledné navigace." # todo: NEW TRANSLATION
 china_sar.008.b: "Nevydávejme žádné prohlášení a nechme zprávu vyšumět." # todo: NEW TRANSLATION
 china_sar.008.c: "Nabídněme soukromou omluvu prostřednictvím neveřejných kanálů." # todo: NEW TRANSLATION
 china_sar.009.t: "Zkouška rakety: regionální mlčení" # todo: NEW TRANSLATION
 china_sar.009.d: "Test balistické střely Raketových sil CHAL nad Tchajwanským průlivem vyvolal vlažnou mezinárodní reakci. Washington vydal formální prohlášení znepokojení, ale nepodnikl žádné konkrétní kroky. Absence smysluplné americké reakce vysílá do celého regionu silný signál." # todo: NEW TRANSLATION
 china_sar.009.a: "Naše odhodlání mluví hlasitěji než jejich mlčení." # todo: NEW TRANSLATION
 china_sar.010.t: "Zkouška rakety: americký odpor" # todo: NEW TRANSLATION
 china_sar.010.d: "Test střely Raketových sil CHAL poblíž Tchaj-wanu se spektakulárně obrátil proti nám. Washington vyslal do průlivu údernou skupinu letadlové lodi a oznámil pro Tchaj-pej mimořádný balík zbraní. Mezinárodní veřejné mínění se sjednotilo proti Pekingu." # todo: NEW TRANSLATION
 china_sar.010.a: "Tento neúspěch nás neodradí." # todo: NEW TRANSLATION
 china_sar.011.t: "Tchaj-wan stojí osamoceně" # todo: NEW TRANSLATION
 china_sar.011.d: "Počet formálních diplomatických spojenců Tchaj-wanu se snížil na hrstku malých států. Bez smysluplného mezinárodního uznání spočívá nárok Tchaj-peje na suverenitu na stále vratších základech. Izolace je symbolická i praktická." # todo: NEW TRANSLATION
 china_sar.011.a: "Smyčka kolem odštěpenecké provincie se utahuje." # todo: NEW TRANSLATION
 china_sar.012.t: "Hlasování Kongresu o zbraních" # todo: NEW TRANSLATION
 china_sar.012.d: "Kongres Spojených států projednává rozsáhlý balík prodeje zbraní Tchaj-wanu. Naše lobbistická síť ve Washingtonu má příležitost hlasování ovlivnit, zásah však s sebou nese rizika, pokud bude naše účast odhalena." # todo: NEW TRANSLATION
 china_sar.012.a: "Aktivujme lobbistickou síť a zablokujme prodej." # todo: NEW TRANSLATION
 china_sar.012.b: "Vyvolejme ekonomické hrozby diplomatickými kanály." # todo: NEW TRANSLATION
 china_sar.012.c: "Nechme proces proběhnout bez zásahů." # todo: NEW TRANSLATION
 china_sar.013.t: "Obchodní rada prosazuje uvolnění napětí" # todo: NEW TRANSLATION
 china_sar.013.d: "Americko-čínská obchodní rada zveřejnila zprávu, která vyzývá Washington, aby dal přednost obchodní stabilitě před závazky v oblasti bezpečnosti Tchaj-wanu. Zpráva, formovaná naším úsilím o hospodářskou spolupráci, získala podporu v politických kruzích." # todo: NEW TRANSLATION
 china_sar.013.a: "Bereme na vědomí." # todo: NEW TRANSLATION
 china_sar.014.t: "Odhaleno vměšování do voleb" # todo: NEW TRANSLATION
 china_sar.014.d: "Americké zpravodajské služby veřejně připsaly operaci politického vlivu čínským státním aktérům. Skandál vyvolal v Kongresu rozhořčení napříč stranami a vlnu trestních opatření. Naše strategická pozice vůči Washingtonu utrpěla těžkou ránu." # todo: NEW TRANSLATION
 china_sar.014.a: "Nákladný chybný odhad." # todo: NEW TRANSLATION
 china_sar.015.t: "Mimořádné bezpečnostní zasedání" # todo: NEW TRANSLATION
 china_sar.015.d: "Čínské cvičení simulující blokádu v Tchajwanském průlivu vyvolalo mimořádné zasedání Rady národní bezpečnosti. Vojenští velitelé a členové vlády diskutují o vhodné reakci na sílící tlak Pekingu." # todo: NEW TRANSLATION
 china_sar.015.a: "Zvýšit vojenskou připravenost podél pobřeží." # todo: NEW TRANSLATION
 china_sar.015.b: "Požádat mezinárodní společenství o podporu." # todo: NEW TRANSLATION
 china_sar.016.t: "Výjimečný stav" # todo: NEW TRANSLATION
 china_sar.016.d: "Částečná blokáda trvá již dva měsíce, narušuje obchod a způsobuje nedostatek paliva a kriticky důležitých materiálů. Vláda čelí rostoucímu tlaku na vyhlášení oficiálního výjimečného stavu a uvedení ozbrojených sil do plné pohotovosti." # todo: NEW TRANSLATION
 china_sar.016.a: "Vyhlásit výjimečný stav." # todo: NEW TRANSLATION
 china_sar.016.b: "Usilovat o diplomatické řešení s Pekingem." # todo: NEW TRANSLATION
 china_sar.017.t: "Otázka kapitulace" # todo: NEW TRANSLATION
 china_sar.017.d: "Úplná námořní blokáda ochromila naše hospodářství a přerušila naše zásobovací linie. Vzhledem k faktickému stažení americké podpory někteří členové vlády potají otevírají možnost zahájit jednání s Pekingem za jeho podmínek." # todo: NEW TRANSLATION
 china_sar.017.a: "Nikdy se nevzdáme. Pokračovat v boji." # todo: NEW TRANSLATION
 china_sar.017.b: "Zahájit jednání s Pekingem." # todo: NEW TRANSLATION
 china_sar.018.t: "Tchaj-wan zahajuje jednání" # todo: NEW TRANSLATION
 china_sar.018.d: "Tchaj-pej vyslala do Pekingu delegaci s oprávněním projednat podmínky znovusjednocení. Blokáda, hospodářský kolaps a stažení americké podpory připravily ostrov o jakoukoli životaschopnou alternativu. Uzavírá se historická kapitola." # todo: NEW TRANSLATION
 china_sar.018.a: "Přijmout znovusjednocení vlasti." # todo: NEW TRANSLATION
 china_sar.019.t: "Krize v Tchajwanském průlivu" # todo: NEW TRANSLATION
 china_sar.019.d: "Napětí v Tchajwanském průlivu dosáhlo kritické hranice. Vojenské síly na obou stranách jsou v nejvyšší pohotovosti a jediný chybný odhad může rozpoutat otevřený konflikt. Stálý výbor politbyra svolává mimořádné zasedání, aby rozhodl o dalším kroku." # todo: NEW TRANSLATION
 china_sar.019.a: "Ustoupit z pokraje propasti. Zmírnit napětí." # todo: NEW TRANSLATION
 china_sar.019.b: "Pokračovat. Vydat oficiální válečný cíl." # todo: NEW TRANSLATION
 china_sar.020.t: "Ultimátum z Pekingu" # todo: NEW TRANSLATION
 china_sar.020.d: "Peking doručil oficiální ultimátum požadující přijetí znovusjednocení pod Čínskou lidovou republikou. Nesplnění požadavku povede k vojenské akci. Vláda musí rozhodnout, zda bude vzdorovat, nebo jednat." # todo: NEW TRANSLATION
 china_sar.020.a: "Odmítnout ultimátum. Připravit se na válku." # todo: NEW TRANSLATION
 china_sar.020.b: "Přijmout podmínky. Boj skončil." # todo: NEW TRANSLATION
 china_sar.021.t: "Tchaj-wan odmítá znovusjednocení" # todo: NEW TRANSLATION
 china_sar.021.d: "Tchaj-pej naše ultimátum oficiálně odmítla. Tchajwanská vláda prohlásila, že hodlá vzdorovat jakémukoli pokusu o vynucené znovusjednocení, a mobilizuje své ozbrojené síly. Cesta k mírovému řešení je uzavřena." # todo: NEW TRANSLATION
 china_sar.021.a: "Budiž. Připravit se na válku." # todo: NEW TRANSLATION
 china_sar.021.b: "Ostrov nestojí za naši flotilu. Odvolat ultimátum." # todo: NEW TRANSLATION
 china_sar.022.t: "Tchaj-wan přijímá znovusjednocení" # todo: NEW TRANSLATION
 china_sar.022.d: "Tchaj-pej přijala podmínky znovusjednocení. Čínská republika bude rozpuštěna a její území začleněno do Čínské lidové republiky. Desetiletí rozdělení napříč průlivem se chýlí ke konci." # todo: NEW TRANSLATION
 china_sar.022.a: "Vlast je opět jednotná." # todo: NEW TRANSLATION
 china_sar.023.t: "Čínský diplomatický tlak" # todo: NEW TRANSLATION
 china_sar.023.d: "Peking vydal oficiální požadavek, abychom stáhli uznání Tchaj-wanu. Čína nabízí za vyhovění hospodářské pobídky a za odmítnutí hrozí sankcemi. Naše pokračující uznávání Tchaj-peje se stalo nákladnou diplomatickou pozicí." # todo: NEW TRANSLATION
 china_sar.023.a: "Vyhovět. Stáhnout uznání Tchaj-wanu." # todo: NEW TRANSLATION
 china_sar.023.b: "Odmítnout. Budeme stát za svými závazky." # todo: NEW TRANSLATION
 china_sar.024.t: "Výsadkové cvičení v průlivu" # todo: NEW TRANSLATION
 china_sar.024.d: "Námořní pěchota CHLO provedla největší výsadkové cvičení v Tchajwanském průlivu, při němž simulovala útok na opevněné pobřeží. Cvičení vysílané státními médii vysílá Tchaj-peji i Washingtonu jednoznačný signál." # todo: NEW TRANSLATION
 china_sar.024.a: "Svět si toho všiml." # todo: NEW TRANSLATION
 china_sar.025.t: "Střet ohledně svobody plavby" # todo: NEW TRANSLATION
 china_sar.025.d: "Námořnictvo Spojených států vyslalo válečnou loď přes naši vyhlášenou námořní bezpečnostní zónu poblíž Tchaj-wanu. Plavidlo otevřeně vysílá svou přítomnost a vyzývá námořnictvo CHLO k reakci. Naše síly americkou loď sledují." # todo: NEW TRANSLATION
 china_sar.025.a: "Povolit průjezd. Vyhnout se přímému střetu." # todo: NEW TRANSLATION
 china_sar.025.b: "Sledovat a vyzvat americké plavidlo." # todo: NEW TRANSLATION
 china_sar.026.t: "Změna vedení USA" # todo: NEW TRANSLATION
 china_sar.026.d: "Změna amerického prezidenta změnila politické prostředí pro naši strategii vůči Tchaj-wanu. Postoj nové administrativy k vztahům napříč průlivem ovlivní míru podpory USA pro Tchaj-pej." # todo: NEW TRANSLATION
 china_sar.026.a: "Náležitě upravit naši strategii." # todo: NEW TRANSLATION
 USA_taiwan_defense_category: "Obrana Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_TAI_amphibious_exercise: "Výsadkové cvičení v průlivu" # todo: NEW TRANSLATION
 CHI_TAI_amphibious_exercise_desc: "Nařídit rozsáhlé výsadkové cvičení v Tchajwanském průlivu s cílem demonstrovat vojenské schopnosti a vyvíjet tlak na Tchaj-pej." # todo: NEW TRANSLATION
 CHI_TAI_adiz_incursion: "Narušení vzdušného identifikačního pásma" # todo: NEW TRANSLATION
 CHI_TAI_adiz_incursion_desc: "Vyslat stíhačky letectva CHLO do tchajwanské identifikační zóny protivzdušné obrany, otestovat reakční dobu a podkopat důvěru Tchaj-peje." # todo: NEW TRANSLATION
 CHI_TAI_rocket_test: "Zkouška balistické rakety" # todo: NEW TRANSLATION
 CHI_TAI_rocket_test_desc: "Provést zkoušku balistické rakety nad Tchajwanským průlivem. Reakce závisí na aktuální úrovni amerického závazku k obraně Tchaj-wanu." # todo: NEW TRANSLATION
 CHI_TAI_grey_zone_ops: "Operace v šedé zóně" # todo: NEW TRANSLATION
 CHI_TAI_grey_zone_ops_desc: "Provádět provokace nízké intenzity včetně narušování prostoru pobřežní stráží, nasazování rybářských flotil a průzkumů elektronického boje poblíž tchajwanských vod." # todo: NEW TRANSLATION
 CHI_TAI_blockade_simulation: "Cvičení simulující blokádu" # todo: NEW TRANSLATION
 CHI_TAI_blockade_simulation_desc: "Uspořádat rozsáhlé námořní cvičení simulující úplnou blokádu Tchaj-wanu, otestovat logistiku a demonstrovat schopnost přerušit zásobovací linie ostrova." # todo: NEW TRANSLATION
 CHI_TAI_cyberattack: "Kybernetický útok na Tchaj-wan" # todo: NEW TRANSLATION
 CHI_TAI_cyberattack_desc: "Zahájit koordinovanou kybernetickou operaci zaměřenou na tchajwanskou elektrickou síť, finanční systémy a vojenskou komunikaci." # todo: NEW TRANSLATION
 CHI_TAI_shadow_carrier: "Sledování americké skupiny letadlové lodi" # todo: NEW TRANSLATION
 CHI_TAI_shadow_carrier_desc: "Nasadit ponorky a hladinová bojová plavidla ke sledování americké úderné skupiny letadlové lodi operující poblíž Tchajwanského průlivu." # todo: NEW TRANSLATION
 CHI_TAI_intercept_aircraft: "Zachycení amerického průzkumu" # todo: NEW TRANSLATION
 CHI_TAI_intercept_aircraft_desc: "Vyslat stíhačky k zachycení a agresivnímu sledování amerických průzkumných letounů operujících poblíž průlivu." # todo: NEW TRANSLATION
 CHI_TAI_un_protest: "Protest u OSN proti prodeji zbraní" # todo: NEW TRANSLATION
 CHI_TAI_un_protest_desc: "Podat u Organizace spojených národů oficiální protest proti americkému prodeji zbraní Tchaj-wanu a vyvolat mezinárodní tlak na Washington." # todo: NEW TRANSLATION
 CHI_TAI_maritime_zone: "Vyhlásit námořní bezpečnostní zónu" # todo: NEW TRANSLATION
 CHI_TAI_maritime_zone_desc: "Vyhlásit námořní bezpečnostní zónu kolem klíčových přístupů k Tchaj-wanu a vytvořit právní záminku pro zadržování a kontrolu obchodní plavby." # todo: NEW TRANSLATION
 CHI_TAI_partial_blockade: "Částečná námořní blokáda" # todo: NEW TRANSLATION
 CHI_TAI_partial_blockade_desc: "Změnit námořní bezpečnostní zónu v částečnou námořní blokádu a omezit dodávky paliva a surovin na Tchaj-wan." # todo: NEW TRANSLATION
 CHI_TAI_full_blockade: "Úplná námořní blokáda" # todo: NEW TRANSLATION
 CHI_TAI_full_blockade_desc: "Uvalit na Tchaj-wan úplnou námořní blokádu a přerušit veškerý námořní obchod a zásobovací linie ostrova." # todo: NEW TRANSLATION
 CHI_TAI_full_blockade_active: "Úplná blokáda Tchaj-wanu probíhá" # todo: NEW TRANSLATION
 CHI_TAI_lift_full_blockade: "Ukončit úplnou blokádu" # todo: NEW TRANSLATION
 CHI_TAI_lift_full_blockade_desc: "Uvolnit obklíčení na úroveň částečné blokády. Tlak na Tchaj-pej poleví a Washingtonův poplach se zmírní, ale přístavy ostrova se znovu otevřou." # todo: NEW TRANSLATION
 CHI_TAI_influence_us_election: "Ovlivňovat volby v USA" # todo: NEW TRANSLATION
 CHI_TAI_influence_us_election_desc: "Nasadit skryté operace politického vlivu ve Spojených státech s cílem podpořit kandidáty nakloněné pekingskému postoji k Tchaj-wanu." # todo: NEW TRANSLATION
 CHI_TAI_support_houthis: "Podpora operací Húsiů" # todo: NEW TRANSLATION
 CHI_TAI_support_houthis_desc: "Poskytnout skrytou materiální podporu silám Húsiů v Jemenu a vytvořit bezpečnostní krizi, která odvede americké vojenské zdroje od Pacifiku." # todo: NEW TRANSLATION
 CHI_TAI_arm_iran: "Tajné dodávky zbraní Íránu" # todo: NEW TRANSLATION
 CHI_TAI_arm_iran_desc: "Prostřednictvím prostředníků předávat Íránu pokročilé vojenské technologie a zvýšit tlak na americké síly na Blízkém východě." # todo: NEW TRANSLATION
 CHI_TAI_scs_provocations: "Provokace v Jihočínském moři" # todo: NEW TRANSLATION
 CHI_TAI_scs_provocations_desc: "Prosazovat čínskou svrchovanost nad spornými oblastmi v Jihočínském moři militarizací ostrovů, obtěžováním konkurenčních žadatelů pobřežní stráží a rozšiřováním zón protivzdušné obrany. Tyto kroky nutí Spojené státy odklánět námořní prostředky k ujištění partnerů ASEAN." # todo: NEW TRANSLATION
 CHI_TAI_nk_provocations: "Podněcovat provokace Severní Koreje" # todo: NEW TRANSLATION
 CHI_TAI_nk_provocations_desc: "Naznačit Pchjongjangu, že zkoušky raket a vojenské provokace na Korejském poloostrově budou tolerovány, a přinutit Spojené státy přemístit síly z tchajwanského bojiště." # todo: NEW TRANSLATION
 CHI_TAI_middleeast_diversion: "Strategické angažmá na Blízkém východě" # todo: NEW TRANSLATION
 CHI_TAI_middleeast_diversion_desc: "Prohloubit vojenská a hospodářská partnerství na Blízkém východě, zvýšit regionální závislost na Pekingu a současně odvést americkou pozornost od indo-pacifického prostoru." # todo: NEW TRANSLATION
 CHI_TAI_support_russia: "Podpora ruských operací" # todo: NEW TRANSLATION
 CHI_TAI_support_russia_desc: "Poskytovat Rusku hospodářskou a logistickou podporu pro jeho vojenské operace a prodlužovat konflikt, který vyčerpává americkou pozornost a zdroje." # todo: NEW TRANSLATION
 CHI_TAI_strait_naval_exercise: "Námořní cvičení v Tchajwanském průlivu" # todo: NEW TRANSLATION
 CHI_TAI_strait_naval_exercise_desc: "Provést rozsáhlé námořní cvičení v Tchajwanském průlivu, procvičit operace obojživelného útoku a boj proti přístupu. Cvičení zlepší námořní připravenost, ale vyvolá mezinárodní odsouzení." # todo: NEW TRANSLATION
 CHI_TAI_fund_us_opposition: "Financování propekingského lobbingu v USA" # todo: NEW TRANSLATION
 CHI_TAI_fund_us_opposition_desc: "Prostřednictvím prostředníků poskytovat zdroje americkým politickým skupinám, think-tankům a médiím nakloněným pekingskému postoji k Tchaj-wanu. Odhalení by vyvolalo tvrdý protiúder." # todo: NEW TRANSLATION
 CHI_TAI_exploit_us_commitments: "Využít přetížení americké armády" # todo: NEW TRANSLATION
 CHI_TAI_exploit_us_commitments_desc: "Zatímco jsou Spojené státy zapojeny do vojenských operací v zahraničí, zintenzivnit diplomatický a vojenský tlak na Tchaj-wan. Americké síly jsou rozptýlené a nemohou věrohodně posílit Pacifik." # todo: NEW TRANSLATION
 USA_TAI_send_carrier: "Vyslat letadlovou loď do Tchajwanského průlivu" # todo: NEW TRANSLATION
 USA_TAI_send_carrier_desc: "Nařídit úderné skupině letadlové lodi proplout Tchajwanským průlivem jako demonstraci síly a potvrdit americký závazek k regionální stabilitě." # todo: NEW TRANSLATION
 USA_TAI_recon_flight: "Průzkumný let nad průlivem" # todo: NEW TRANSLATION
 USA_TAI_recon_flight_desc: "Vyslat průzkumné letouny ke sledování aktivity CHLO v Tchajwanském průlivu po čínských narušeních identifikační zóny." # todo: NEW TRANSLATION
 USA_TAI_arm_taiwan: "Nouzový balík zbraní pro Tchaj-wan" # todo: NEW TRANSLATION
 USA_TAI_arm_taiwan_desc: "Schválit nouzový balík zbraní pro tchajwanskou armádu v reakci na sílící čínské přípravy blokády." # todo: NEW TRANSLATION
 USA_TAI_fon_operation: "Operace svobody plavby" # todo: NEW TRANSLATION
 USA_TAI_fon_operation_desc: "Vyslat válečnou loď přes čínskou vyhlášenou námořní bezpečnostní zónu, potvrdit svobodu plavby a zpochybnit nároky Pekingu." # todo: NEW TRANSLATION
 USA_TAI_rimpac_exercise: "Námořní cvičení RIMPAC" # todo: NEW TRANSLATION
 USA_TAI_rimpac_exercise_desc: "Pozvat Tchaj-wan k účasti na každoročním námořním cvičení Rim of the Pacific, největším mezinárodním cvičení námořního boje na světě, a potvrdit americký závazek vůči regionálním partnerům." # todo: NEW TRANSLATION
 CHI_SAR_decisions_category: "Strategie jedné Číny" # todo: NEW TRANSLATION
 CHI_SAR_decisions_category_desc: "\n£GFX_CHI_commission_2\n\n\n\n§YStrategie jedné Číny§! představuje politiku Pekingu spočívající v konsolidaci všech nárokovaných území pod jediným čínským státem. Kombinací politického tlaku, hospodářského rozvoje a správní kontroly jsou regiony postupně uváděny do souladu s ústřední vládou.\n\nTento proces může mít různé podoby. Rostoucí §Ysinizace§! posiluje přímou kontrolu a integraci, zatímco autonomnější uspořádání upřednostňují místní stabilitu a hospodářský potenciál za cenu pravomocí ústřední vlády.\n\nRovnováha mezi těmito přístupy určí dlouhodobou jednotu státu, zatímco otázka §YTchaj-wanu§! zůstává utvářena mezinárodním uznáním, zahraniční podporou a napětím napříč průlivem.\n\n§YZvláštní administrativní oblasti Číny§!\n$HKG_sinicization$\n$MAC_sinicization$\n$TIB_sinicization$\n$ETK_sinicization$\n$OMG_sinicization$\n\n$CHI_TAI_trust_display$\n$CHI_taiwan_us_support_display$\n$CHI_taiwan_strait_tension_display$\n$CHI_taiwan_recognition_count_display$\n$uighur_threat_display$" # todo: NEW TRANSLATION
 CHI_pressure_derecognize_TAI: "Tlačit na [From.GetName], aby stáhl uznání Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_pressure_derecognize_TAI_desc: "Peking vede vytrvalou diplomatickou kampaň s cílem omezit mezinárodní uznání Tchaj-wanu. [From.GetName] v současnosti udržuje s Tchaj-pejí oficiální vztahy. Kombinace hospodářských pobídek a hrozeb sankcemi může stačit k vynucení změny postoje." # todo: NEW TRANSLATION
 CHI_establish_education_centres: "Zřídit centra odborného vzdělávání v Sin-ťiangu" # todo: NEW TRANSLATION
 CHI_establish_education_centres_desc: "" # todo: NEW TRANSLATION
 CHI_calm_hong_kong_protests: "Obnovit pořádek v Hongkongu" # todo: NEW TRANSLATION
 CHI_calm_hong_kong_protests_desc: "Protesty vyvolané našimi volebními reformami nadále narušují fungování zvláštní administrativní oblasti. Vzhledem k přítomnosti bezpečnostních sil a stabilizující se situaci může ústřední vláda začít nepozorovaně ukončovat nepokoje a obnovovat běžný život v Hongkongu." # todo: NEW TRANSLATION
 CHI_MON_reunification_retry: "Opakovat nabídku znovusjednocení" # todo: NEW TRANSLATION
 CHI_MON_reunification_retry_desc: "Mongolsko naši předchozí nabídku odmítlo. Jakmile se diplomatické podmínky uklidní, můžeme znovu oslovit Ulánbátar." # todo: NEW TRANSLATION
 CHI_han_settlement_small: "Malý program přesídlení Chanů" # todo: NEW TRANSLATION
 CHI_han_settlement_small_desc: "Skromný státem podporovaný program přesouvá rodiny Chanů z hustě osídlených vnitrozemských provincií do nových měst v Nei Mongol, podporovaných pobídkami k zaměstnání a programy přidělování půdy." # todo: NEW TRANSLATION
 CHI_han_settlement_medium: "Středně velký program přesídlení Chanů" # todo: NEW TRANSLATION
 CHI_han_settlement_medium_desc: "Větší organizované přesídlovací úsilí přesouvá do Nei Mongol desítky tisíc chanských dělníků a jejich rodin. Nové průmyslové zóny a zemědělské parcely jsou určeny k přijetí příchozího obyvatelstva." # todo: NEW TRANSLATION
 CHI_han_settlement_large: "Masový program přesídlení Chanů" # todo: NEW TRANSLATION
 CHI_han_settlement_large_desc: "Rozsáhlá kampaň demografického inženýrství přesouvá v jediné koordinované vlně do Nei Mongol stovky tisíc chanských osadníků. Dlouhodobý dopad na etnické složení regionu je značný, ačkoli krátkodobý odpor prudce narůstá." # todo: NEW TRANSLATION
 CHI_HKG_patriotic_education_drive: "Kampaň vlasteneckého vzdělávání" # todo: NEW TRANSLATION
 CHI_HKG_patriotic_education_drive_desc: "Financovat učební osnovy občanské nauky a národní identity vytvořené na pevnině na všech dotovaných hongkongských školách, rozšířit výuku v putonghua a hradit učitelům studijní cesty do vnitrozemí. Náklady ponese Úřad pro vzdělávání a zavádění bude dostatečně pozvolné, aby se předešlo druhému odporu proti morální a národní výchově." # todo: NEW TRANSLATION
 CHI_HKG_liaison_office_expansion: "Rozšířit Úřad pro styk s ústřední vládou" # todo: NEW TRANSLATION
 CHI_HKG_liaison_office_expansion_desc: "Rozšířit Úřad pro styk s ústřední lidovou vládou a Úřad pro ochranu národní bezpečnosti, vyslat kádry z pevniny do hongkongské státní služby a dosadit prověřené kandidáty do prověřovacích komisí soudnictví. Správní kontrola rychle postupuje, ale každý viditelný zásah riskuje návrat davů do ulic." # todo: NEW TRANSLATION
 CHI_MAC_cross_border_administration: "Sjednotit přeshraniční správu" # todo: NEW TRANSLATION
 CHI_MAC_cross_border_administration_desc: "Uznat v Macau odborné kvalifikace a řidičské průkazy z pevniny, směrovat zúčtování v renminbi přes banky pod dohledem pevniny a sloučit celní odbavení na přechodech Gongbei a Most lotosového květu do jediného povolení. Území si zachová svůj statut, zatímco jeho správní aparát se přiblíží aparátu Kuang-tungu." # todo: NEW TRANSLATION
 CHI_MAC_hengqin_integration_zone: "Zóna hluboké spolupráce na Cheng-čchinu" # todo: NEW TRANSLATION
 CHI_MAC_hengqin_integration_zone_desc: "Rozšířit zónu hluboké spolupráce mezi Kuang-tungem a Macaem na ostrově Cheng-čchin: práva pobytu na pevnině pro pracovníky z Macaa, jednotný daňový a celní režim a přesun podniků navázaných na hazard přes vodu. Ču-chaj absorbuje růst a s ním i páky místní vlády." # todo: NEW TRANSLATION
 CHI_TIB_monastic_patriotic_education: "Vlastenecké vzdělávání v klášterech" # todo: NEW TRANSLATION
 CHI_TIB_monastic_patriotic_education_desc: "Umístit výbory demokratického řízení do každého registrovaného kláštera, vyžadovat po mniších a jeptiškách zkoušky ze státní náboženské politiky a omezit přijímání noviců. Instituce zůstanou otevřené a budou fungovat pod trvalým správním dohledem." # todo: NEW TRANSLATION
 CHI_TIB_village_cadre_teams: "Kádrové pracovní týmy na úrovni vesnic" # todo: NEW TRANSLATION
 CHI_TIB_village_cadre_teams_desc: "Umístit do každé správní vesnice stálý stranický pracovní tým, doplněný audity registrace domácností, dotovanou konsolidací bydlení a přesunem rozptýlených pasteveckých rodin do vybavených měst. Pronikání správy se stane úplným, stejně jako odpor, který vyvolá." # todo: NEW TRANSLATION
 CHI_ETK_bilingual_boarding_schools: "Systém dvojjazyčných internátních škol" # todo: NEW TRANSLATION
 CHI_ETK_bilingual_boarding_schools_desc: "Sloučit venkovské školství do internátních institucí s výukou v mandarínštině, jejichž učitelé budou přijímáni z vnitrozemských provincií. Ujgurština zůstane předmětem, nikoli vyučovacím jazykem, a celá generace bude vzdělávána mimo své domovské vesnice." # todo: NEW TRANSLATION
 CHI_ETK_labour_transfer_scheme: "Program přesunu přebytečné pracovní síly" # todo: NEW TRANSLATION
 CHI_ETK_labour_transfer_scheme_desc: "Přidělovat ujgurské venkovské pracovníky do pobřežních továren a regionálních průmyslových parků podle organizovaných přesídlovacích kvót a činit vesnické kádry odpovědnými za náborové cíle. Příjmy domácností vzrostou a komunitní vazby zeslábnou, avšak program bude jasně viditelný zahraničním auditorům sledujícím dodavatelské řetězce." # todo: NEW TRANSLATION
 CHI_OMG_mandarin_curriculum_rollout: "Zavedení jednotných učebních osnov" # todo: NEW TRANSLATION
 CHI_OMG_mandarin_curriculum_rollout_desc: "Nahradit učebnice politiky, dějepisu a jazyka v mongolštině národní jednotnou řadou a odpovídajícím způsobem přeškolit učitelský sbor. Opatření bude prezentováno jako zajištění rovných příležitostí a zavedeno dostatečně pomalu, aby pastevecké okresy zůstaly klidné." # todo: NEW TRANSLATION
 CHI_OMG_pastoral_sedentarisation: "Program usazování pastevců" # todo: NEW TRANSLATION
 CHI_OMG_pastoral_sedentarisation_desc: "Prosadit zákaz pastvy na znehodnocené stepi, odškodnit pastevecké rodiny za odevzdaná stáda a přesídlit je do dotovaných městských bytů s odbornou rekvalifikací. Kočovný pastevecký způsob života ustoupí námezdní práci a s ním zmizí i společenský základ mongolské odlišnosti." # todo: NEW TRANSLATION
 CHI_national_common_language_campaign: "Národní kampaň za společný jazyk" # todo: NEW TRANSLATION
 CHI_national_common_language_campaign_desc: "Uplatněme Zákon o standardizovaném mluveném a psaném čínském jazyce jednotně ve všech zvláštních administrativních oblastech najednou: jedna řada učebnic, národní jazyková certifikace pro zaměstnání ve veřejném sektoru a vysílací kvóty. Jediný koordinovaný tlak urychlí integraci všude, kde ústřední vláda stále drží administrativní páky." # todo: NEW TRANSLATION
 CHI_second_generation_ethnic_policy: "Etnická politika druhé generace" # todo: NEW TRANSLATION
 CHI_second_generation_ethnic_policy_desc: "Přijměme depolitizovaný model etnických záležitostí prosazovaný reformními teoretiky strany: zrušme preferenční kvóty, upusťme od regionální autonomie jako organizačního principu a definujme občanství výhradně prostřednictvím čínského národa. Uplatněno ve všech zvláštních administrativních oblastech současně jde o nejrozsáhlejší dostupné integrační opatření a zároveň o opatření nejvíce destabilizující." # todo: NEW TRANSLATION
 CHI_TAI_resend_economic_track: "Obnovit návrh spolupráce: hospodářský rámec" # todo: NEW TRANSLATION
 CHI_TAI_resend_economic_track_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s rámcem hospodářské spolupráce mezi oběma břehy průlivu." # todo: NEW TRANSLATION
 CHI_TAI_resend_expand_trade: "Obnovit návrh spolupráce: rozšíření obchodu" # todo: NEW TRANSLATION
 CHI_TAI_resend_expand_trade_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s návrhem na rozšíření obchodu mezi oběma břehy průlivu." # todo: NEW TRANSLATION
 CHI_TAI_resend_mainland_access: "Obnovit návrh spolupráce: přístup na trh" # todo: NEW TRANSLATION
 CHI_TAI_resend_mainland_access_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s nabídkou zvýhodněného přístupu na trh pevniny." # todo: NEW TRANSLATION
 CHI_TAI_resend_semiconductor: "Obnovit návrh spolupráce: koordinace polovodičů" # todo: NEW TRANSLATION
 CHI_TAI_resend_semiconductor_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s návrhem na koordinaci polovodičů mezi oběma břehy průlivu." # todo: NEW TRANSLATION
 CHI_TAI_resend_business_deleg: "Obnovit návrh spolupráce: obchodní delegace" # todo: NEW TRANSLATION
 CHI_TAI_resend_business_deleg_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s nabídkou výměny obchodních delegací." # todo: NEW TRANSLATION
 CHI_TAI_resend_transport: "Obnovit návrh spolupráce: dopravní spojení" # todo: NEW TRANSLATION
 CHI_TAI_resend_transport_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s návrhem přímého dopravního spojení mezi oběma břehy průlivu." # todo: NEW TRANSLATION
 CHI_TAI_resend_safeguards: "Obnovit návrh spolupráce: investiční záruky" # todo: NEW TRANSLATION
 CHI_TAI_resend_safeguards_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s dohodou o investičních zárukách mezi oběma břehy průlivu." # todo: NEW TRANSLATION
 CHI_TAI_resend_joint_planning: "Obnovit návrh spolupráce: průmyslové plánování" # todo: NEW TRANSLATION
 CHI_TAI_resend_joint_planning_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s návrhem společného průmyslového plánování mezi oběma břehy průlivu." # todo: NEW TRANSLATION
 CHI_TAI_resend_deep_integration: "Obnovit návrh spolupráce: ekonomická integrace" # todo: NEW TRANSLATION
 CHI_TAI_resend_deep_integration_desc: "Tchaj-pej předchozí nabídku odmítla. Obraťme se na tchajwanskou vládu znovu s návrhem hluboké ekonomické integrace mezi oběma břehy průlivu." # todo: NEW TRANSLATION
 CHI_TAI_resend_peaceful_reunification: "Znovu předložit dohodu o sjednocení" # todo: NEW TRANSLATION
 CHI_TAI_resend_peaceful_reunification_desc: "Tchaj-pej rámec sjednocení odmítla. Dejme dohodě více času a předložme ji Tchaj-wanu znovu." # todo: NEW TRANSLATION
 CHI_TAI_goodwill_gesture: "Gesto dobré vůle mezi oběma břehy průlivu" # todo: NEW TRANSLATION
 CHI_TAI_goodwill_gesture_desc: "Učiňme vůči Tchaj-peji veřejné gesto dobré vůle, od nabídek pomoci při katastrofách po uvolnění pravidel cestování a turistiky, čímž zlepšíme náladu mezi oběma břehy průlivu a posílíme vzájemnou důvěru." # todo: NEW TRANSLATION
 CHI_TAI_coercive_signaling: "Donucovací signalizace" # todo: NEW TRANSLATION
 CHI_TAI_coercive_signaling_desc: "Dejme najevo pekingskou nespokojenost prostřednictvím cílených vojenských cvičení a diplomatického tlaku. Tchaj-peji to připomene odhodlání pevniny, zároveň to však naruší důvěru mezi oběma břehy." # todo: NEW TRANSLATION
 CHI_TAI_media_infiltration: "Pronikání do mediálních sítí" # todo: NEW TRANSLATION
 CHI_TAI_media_infiltration_desc: "Financujme a rozšiřujme vlastnictví médií podporujících Peking a sítě redakčního vlivu na Tchaj-wanu. Budujme příznivější informační prostředí pro spolupráci mezi oběma břehy." # todo: NEW TRANSLATION
 CHI_TAI_business_council_funding: "Financování obchodní rady mezi oběma břehy" # todo: NEW TRANSLATION
 CHI_TAI_business_council_funding_desc: "Poskytněme finanční podporu obchodním sdružením napojeným na KMT a obchodním komorám mezi oběma břehy. Posilujme tábor podporující spolupráci v rámci tchajwanské ekonomické elity." # todo: NEW TRANSLATION
 CHI_TAI_cultural_exchange_program: "Program kulturní výměny mezi oběma břehy" # todo: NEW TRANSLATION
 CHI_TAI_cultural_exchange_program_desc: "Podporujme akademické výměny, kulturní festivaly a programy dialogu mládeže napříč průlivem. Budujme mezilidské vazby, které zmírní politický odpor k užším vztahům." # todo: NEW TRANSLATION
 CHI_TAI_cross_strait_infrastructure_investment: "Investice do infrastruktury mezi oběma břehy" # todo: NEW TRANSLATION
 CHI_TAI_cross_strait_infrastructure_investment_desc: "Směřujme kapitál z pevniny do infrastrukturních projektů na Tchaj-wanu, prezentujme čínské investice jako zdroj ekonomických příležitostí a prohlubujme materiální vzájemnou závislost obou ekonomik." # todo: NEW TRANSLATION
 CHI_45g_national_deployment_idea: "Iniciativa celostátního zavedení 5G" # todo: NEW TRANSLATION
 CHI_45g_national_deployment_idea_desc: "Urychlené zavedení síťové infrastruktury 5G v celé zemi se státní koordinací kapitálových investic do základnových stanic, zařízení páteřní sítě a přidělování spektra. Iniciativa upřednostňuje pokrytí strategických odvětví a kritické infrastruktury." # todo: NEW TRANSLATION
 CHI_avic_innovation_idea: "Vývoj letadel AVIC" # todo: NEW TRANSLATION
 CHI_avic_innovation_idea_desc: "Čínská letecká průmyslová korporace rozvíjí domácí schopnosti konstrukce a výroby letadel a posouvá vývoj stíhacích a transportních letounů bez závislosti na zahraničních technologiích a licencích." # todo: NEW TRANSLATION
 CHI_big_fund_phase_1_idea: "Národní fond polovodičového průmyslu" # todo: NEW TRANSLATION
 CHI_big_fund_phase_1_idea_desc: "Velký fond, strategická odpověď Číny na soběstačnost v oblasti polovodičů, mobilizuje státní kapitál k rozvoji domácích výrobních kapacit, konstrukčních schopností a výroby zařízení. Iniciativa klade důraz na omezení závislosti na zahraničních slévárnách a nástrojích EDA." # todo: NEW TRANSLATION
 CHI_caic_innovation_idea: "Vývoj útočných vrtulníků CAIC" # todo: NEW TRANSLATION
 CHI_caic_innovation_idea_desc: "Čínský letecký konsorcium rozvíjí technologie útočných vrtulníků prostřednictvím vývoje a výroby domácích rotorových platforem určených k rychlému nasazení a dlouhodobému provozu." # todo: NEW TRANSLATION
 CHI_casc_innovation_idea: "Vesmírné a satelitní programy CASC" # todo: NEW TRANSLATION
 CHI_casc_innovation_idea_desc: "Čínská korporace pro leteckou vědu a technologie rozšiřuje schopnosti kosmických nosičů, satelitní komunikace a pozorování Země a upevňuje tak roli Číny jako významné vesmírné mocnosti nezávislé na zahraničních omezeních přístupu." # todo: NEW TRANSLATION
 CHI_casic_innovation_idea: "Vývoj raket a protiopatření CASIC" # todo: NEW TRANSLATION
 CHI_casic_innovation_idea_desc: "Čínská korporace pro leteckou vědu a průmysl rozvíjí systémy řízených a balistických střel a protivzdušné obrany prostřednictvím trvalého výzkumu a vývoje pohonu, navádění a elektronického boje." # todo: NEW TRANSLATION
 CHI_cetc_innovation_idea: "Vývoj výpočetní techniky a umělé inteligence CETC" # todo: NEW TRANSLATION
 CHI_cetc_innovation_idea_desc: "Čínská skupina pro elektronické technologie investuje do vysoce výkonného výpočetnictví, návrhu polovodičů a platforem umělé inteligence s cílem snížit technologickou závislost a urychlit domácí inovace v kritických podpůrných technologiích." # todo: NEW TRANSLATION
 CHI_crrc_innovation_idea: "Průmyslová výroba CRRC" # todo: NEW TRANSLATION
 CHI_crrc_innovation_idea_desc: "Čínský výrobce železniční a dopravní techniky diverzifikuje svou činnost do širších průmyslových odvětví a využívá desetiletí zkušeností s dodavatelskými řetězci v metalurgii, přesné výrobě a systémové integraci." # todo: NEW TRANSLATION
 CHI_csgc_innovation_idea: "Vývoj obrněných vozidel CSGC" # todo: NEW TRANSLATION
 CHI_csgc_innovation_idea_desc: "Čínský státní výrobce obrněných vozidel vyvíjí platformy nové generace v oblasti tanků, bojových vozidel pěchoty a podpůrných vozidel a integruje pokročilé pancéřování, palebnou sílu a pohyblivost." # todo: NEW TRANSLATION
 CHI_csic_innovation_idea: "Vývoj ponorek CSIC" # todo: NEW TRANSLATION
 CHI_csic_innovation_idea_desc: "China State Shipbuilding Industrial Corporation rozvíjí konstrukci a výrobu ponorek se zaměřením na materiály trupu, snížení hlučnosti a pokročilé senzorové systémy pro dlouhodobé podvodní operace." # todo: NEW TRANSLATION
 CHI_cssc_innovation_idea: "Vývoj hladinových válečných lodí CSSC" # todo: NEW TRANSLATION
 CHI_cssc_innovation_idea_desc: "Hlavní čínská loděnice se zaměřuje na pokročilé konstrukce torpédoborců, fregat a korvet s integrovanými bojovými systémy, čímž rozšiřuje čínské schopnosti působit na oceánech podél strategických námořních tras." # todo: NEW TRANSLATION
 CHI_failed_five_year_plan: "Neúspěšný pětiletý plán" # todo: NEW TRANSLATION
 CHI_failed_five_year_plan_desc: "Zklamávající výsledky posledního cyklu pětiletého plánování si vynutily přehodnocení priorit a přidělování zdrojů. Důvěra veřejnosti v dlouhodobé rozvojové cíle utrpěla a vyžaduje okamžité úpravy politiky." # todo: NEW TRANSLATION
 CHI_haig_innovation_idea: "Rozvoj Harbin Aircraft Industry Group" # todo: NEW TRANSLATION
 CHI_haig_innovation_idea_desc: "Letecký sektor Harbinu rozšiřuje schopnosti v oblasti rotorových letounů a vyvíjí transportní vrtulníky a útočné platformy, které snižují závislost na zahraničních konstrukcích a licencích." # todo: NEW TRANSLATION
 CHI_inner_mongolia_innovation_idea: "Rozvoj obrněné techniky ve Vnitřním Mongolsku" # todo: NEW TRANSLATION
 CHI_inner_mongolia_innovation_idea_desc: "Integrovaná základna výroby obrněné techniky ve Vnitřním Mongolsku rozvíjí konstrukci hlavních bojových tanků a obrněných vozidel s využitím staletých metalurgických znalostí a moderních výrobních technik." # todo: NEW TRANSLATION
 CHI_jap_strategic_isolation: "Strategická izolace Japonska" # todo: NEW TRANSLATION
 CHI_jap_strategic_isolation_desc: "Naše ekonomická páka a regionální diplomatické postavení stále více odsouvají strategický vliv Japonska ve východní Asii na okraj. Tokio čelí inflaci spotřebního zboží, zmenšujícím se exportním trhům a psychologické zátěži strategické bezvýznamnosti." # todo: NEW TRANSLATION
 CHI_kor_g2_economic_platform: "Ekonomický rámec G2 Čína–Korea" # todo: NEW TRANSLATION
 CHI_kor_g2_economic_platform_desc: "Vytvoření mechanismů bilaterální ekonomické koordinace mezi Čínou a Koreou, zahrnujících obchodní politiku, investiční toky a technologická partnerství. Toto uspořádání staví oba národy do role společných správců prosperity východní Asie." # todo: NEW TRANSLATION
 CHI_kor_trilateral_opening: "Trojstranné otevření vůči Koreji" # todo: NEW TRANSLATION
 CHI_kor_trilateral_opening_desc: "Diplomatické otevření vůči Severní Koreji prostřednictvím konzultací na vysoké úrovni a omezeného ekonomického zapojení signalizuje ochotu Číny zprostředkovat dialog a poskytnout materiální podporu kontrolovaným reformám." # todo: NEW TRANSLATION
 CHI_made_in_china_2025_idea: "Made in China 2025" # todo: NEW TRANSLATION
 CHI_made_in_china_2025_idea_desc: "Desetiletá průmyslová politika zaměřená na high-tech výrobu polovodičů, pokročilých kompozitů, robotiky a železniční dopravy. Program má Čínu proměnit z továrny světa v inovátora světa." # todo: NEW TRANSLATION
 CHI_nko_final_transition: "Konečná transformace Severní Koreje" # todo: NEW TRANSLATION
 CHI_nko_final_transition_desc: "Konečná fáze transformace Severní Koreje představuje završení čínského vlivu a sbližování. Pchjongjang se funkčně začleňuje do čínské sféry s minimální nominální nezávislostí." # todo: NEW TRANSLATION
 CHI_nko_managed_reform_pilot: "Pilotní řízené reformy v Severní Koreji" # todo: NEW TRANSLATION
 CHI_nko_managed_reform_pilot_desc: "Čína podporuje omezenou ekonomickou liberalizaci v Severní Koreji prostřednictvím zvláštních ekonomických zón a kontrolovaných tržních mechanismů. Pilotní projekt ověří, zda může Pchjongjang reformovat zemi bez destabilizace kontroly režimu." # todo: NEW TRANSLATION
 CHI_norinco_innovation_idea: "Vývoj zbraní NORINCO" # todo: NEW TRANSLATION
 CHI_norinco_innovation_idea_desc: "China North Industries Corporation urychluje modernizaci pěchotních zbraní, dělostřeleckých systémů a lehkých obrněných platforem. Exportní portfolio NORINCO se rozšiřuje na armády s omezeným přístupem k západním dodavatelům." # todo: NEW TRANSLATION
 CHI_phi_abandonment_doctrine: "Doktrína opuštění Filipín" # todo: NEW TRANSLATION
 CHI_phi_abandonment_doctrine_desc: "Záměrné prohlubování ekonomické závislosti Filipín a diplomatického odcizení od jejich tradičního bezpečnostního partnera ponechává Manilu izolovanou a zranitelnou vůči tlaku Číny." # todo: NEW TRANSLATION
 CHI_poly_innovation_idea: "Rozvoj vojenského průmyslu Poly Technologies" # todo: NEW TRANSLATION
 CHI_poly_innovation_idea_desc: "Diverzifikované vojensko-průmyslové portfolio Polytechu se rozšiřuje do rozvíjejících se obranných odvětví a využívá státní podpory a přístupu k výzkumným institucím napříč obranným aparátem." # todo: NEW TRANSLATION
 CHI_sac_innovation_idea: "Vývoj stíhacích letounů SAC" # todo: NEW TRANSLATION
 CHI_sac_innovation_idea_desc: "Shenyang Aircraft Corporation rozvíjí konstrukci a výrobu stíhacích letounů a vyvíjí domácí platformy, které snižují závislost na ruských motorech a radarové technologii AESA." # todo: NEW TRANSLATION
 CHI_shadow_banking_cleanup_idea: "Očista sektoru stínového bankovnictví" # todo: NEW TRANSLATION
 CHI_shadow_banking_cleanup_idea_desc: "Regulační zásah proti neregulovaným svěřeneckým produktům, peer-to-peer půjčkám a financování mimo rozvahu odstraňuje systémová rizika z finančního systému. Krátkodobý pokles úvěrů vyvažuje vyšší důvěra v regulaci." # todo: NEW TRANSLATION
 CHI_south_china_sea_dominance_window: "Okno pro dominanci v Jihočínském moři" # todo: NEW TRANSLATION
 CHI_south_china_sea_dominance_window_desc: "Otevřelo se strategické okno pro upevnění kontroly nad Jihočínským mořem prostřednictvím námořní přítomnosti, rozšíření civilního rybářského loďstva a výstavby vojenských zařízení na rekultivovaných ostrovech. Okno se může uzavřít, pokud se regionální mocnosti spojí a pokusí se čínskou expanzi zpochybnit." # todo: NEW TRANSLATION
 CHI_ztz99_rollout_idea: "Zavedení hlavního bojového tanku Type 99" # todo: NEW TRANSLATION
 CHI_ztz99_rollout_idea_desc: "Plná výroba a nasazení hlavního bojového tanku Type 99 v pozemních silách PLA poskytne ve srovnání s dřívějšími platformami lepší pancéřování, palebnou sílu a pohyblivost." # todo: NEW TRANSLATION
 ETK_security_reinforcement_idea: "Posílení bezpečnostních sil" # todo: NEW TRANSLATION
 ETK_security_reinforcement_idea_desc: "Rozšíření bezpečnostních sil a posílení infrastruktury proti teroristickým útokům s mírnými ekonomickými náklady, které jsou vyváženy omezením občanských svobod a rozšířením dohledu." # todo: NEW TRANSLATION
 ETK_surveillance_state_idea: "Opatření dozorového státu" # todo: NEW TRANSLATION
 ETK_surveillance_state_idea_desc: "Komplexní rozšíření sledovacích systémů, sítě kontrolních stanovišť a shromažďování zpravodajských informací napříč společností. Zisky ekonomické efektivity díky lepší společenské kontrole jsou vyváženy nižší mírou inovací a menším zapojením občanů." # todo: NEW TRANSLATION
 ETK_terrorism_aftermath: "Důsledky terorismu" # todo: NEW TRANSLATION
 ETK_terrorism_aftermath_desc: "Přetrvávající bezpečnostní obavy a společenské trauma z nedávných teroristických útoků nadále narušují ekonomickou aktivitu a důvěru veřejnosti. Obnova vyžaduje čas a účinné obnovení bezpečnosti." # todo: NEW TRANSLATION
 TAI_civil_defense_readiness: "Připravenost civilní obrany" # todo: NEW TRANSLATION
 TAI_civil_defense_readiness_desc: "Mobilizace obyvatelstva k úkolům protivzdušné obrany včetně výcviku ukrývání, péče o raněné a likvidace škod. Obrana proti vzdušným hrozbám se zlepšuje za cenu nižší kvality života a ekonomického narušení." # todo: NEW TRANSLATION
