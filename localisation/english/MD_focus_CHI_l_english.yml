 CHI_norinco_trait_missile_canister_fabrication: "Výroba raketových nádob" # todo: NEW TRANSLATION
 CHI_norinco_trait_precision_cruise_navigation: "Přesné navigační řízení během letu" # todo: NEW TRANSLATION
 CHI_norinco_trait_range_extension_airframe: "Letadlový rám pro prodloužení doletu" # todo: NEW TRANSLATION
 CHI_norinco_trait_red_arrow_atgm_suite: "Sada Red Arrow ATGM" # todo: NEW TRANSLATION
 CHI_norinco_trait_solid_propellant_casting: "Lisování pevných pohonných hmot" # todo: NEW TRANSLATION
 CHI_Normalise_the_Hermit: "Normalizovat poustevníka" # todo: NEW TRANSLATION
 CHI_Normalise_the_Hermit_desc: "Jak se reformy zakořeňují, podporujeme formální opětovné začlenění Severní Koreje do regionálních ekonomických a diplomatických kanálů, čímž ukončíme desetiletí izolace a postavíme se do role architektů otevření Pchjongjangu." # todo: NEW TRANSLATION
 CHI_Nuclear_Insurance: "Jaderné pojištění" # todo: NEW TRANSLATION
 CHI_Nuclear_Insurance_desc: "De facto uznáváme severokorejský jaderný arzenál jako odstrašující prostředek, nikoli jako přítěž. Přijetím Pchjongjangu jako jaderného státu poskytujeme pojištění proti zhroucení režimu, přestože tím vyvoláme mezinárodní odsouzení." # todo: NEW TRANSLATION
 CHI_operation_new_dawn_desc: "Zahájit rozhodnou operaci speciálních sil proti vedení Pchjongjangu. Sítě Čanga a princátek rozhodnou, zda skončí čistým převratem, občanskou válkou, nebo katastrofou." # todo: NEW TRANSLATION
 CHI_outer_mongolia: "Vnější Mongolsko S.A.R" # todo: NEW TRANSLATION
 CHI_palm_and_fingers_doctrine: "Doktrína dlaně a prstů" # todo: NEW TRANSLATION
 CHI_palm_and_fingers_doctrine_desc: "Tibet je dlaň. Ladak, Nepál, Sikkim, Bhútán a Arunáčal jsou prsty. Strategická doktrína vyžaduje všech pět." # todo: NEW TRANSLATION
 CHI_pla_divestiture_completion: "Dokončení odprodeje PLA" # todo: NEW TRANSLATION
 CHI_pla_divestiture_completion_desc: "PLA se již dlouho musí zbavit svého rozsáhlého obchodního impéria zahrnujícího hotely, farmaceutické firmy a obchodní společnosti. Dokončení tohoto procesu obnoví výhradní zaměření armády a odstraní významný zdroj korupce důstojníků. Armáda, která provozuje hotely, nemyslí na válku." # todo: NEW TRANSLATION
 CHI_Pyongyang_Pivot: "Obrat k Pchjongjangu" # todo: NEW TRANSLATION
 CHI_Pyongyang_Pivot_desc: "Namísto utužování režimu Čína podporuje opatrné ekonomické otevření podle vzoru reforem Teng Siao-pchinga. Prosperující Severní Korea by byla stabilnějším sousedem – a přístupnějším partnerem." # todo: NEW TRANSLATION
 CHI_Rare_Earth_Leverage: "Páka vzácných zemin" # todo: NEW TRANSLATION
 CHI_Rare_Earth_Leverage_desc: "Vyspělý elektronický a polovodičový průmysl Jižní Koreje je silně závislý na čínském vývozu vzácných zemin. Využitím této závislosti můžeme prohloubit ekonomické vazby a zvýšit svůj vliv na kalkulace zahraniční politiky Soulu." # todo: NEW TRANSLATION
 CHI_Rason_SEZ_Expansion: "Rozšíření SEZ Rason" # todo: NEW TRANSLATION
 CHI_Rason_SEZ_Expansion_desc: "Speciální ekonomická zóna Rason na severovýchodním pobřeží Severní Koreje nabízí zkušební případ ekonomické modernizace. Čínské investice mohou otevřít přístup k přístavu a tokům zdrojů a zároveň ukázat životaschopnost postupných reforem." # todo: NEW TRANSLATION
 CHI_Sanctions_Evasion: "Obcházení sankcí" # todo: NEW TRANSLATION
 CHI_Sanctions_Evasion_desc: "Při veřejné podpoře mezinárodních sankcí můžeme tiše umožnit pokračování přeshraničního obchodu a finančních toků. Tím prohloubíme závislost Severní Koreje na Číně a zachováme věrohodnou popíratelnost, ačkoli odhalení by poškodilo vztahy se Západem." # todo: NEW TRANSLATION
 CHI_sco_balance_display: "$CHI_sco_balance$: [?CHI_sco_balance]" # todo: NEW TRANSLATION
 CHI_sco_cohesion_display: "$CHI_sco_cohesion$: [?CHI_sco_cohesion]" # todo: NEW TRANSLATION
 CHI_scs_island_construction_campaign: "Kampaň výstavby ostrovů" # todo: NEW TRANSLATION
 CHI_scs_island_construction_campaign_desc: "Zahájit víceletý program bagrování a výstavby napříč Spratlyho souostrovím. Zatopené útesy jsou navršeny do umělých ostrovů schopných hostit trvalá zařízení, čímž se účinná správní stopa čínských nároků rozšíří o tisíce čtverečních kilometrů." # todo: NEW TRANSLATION
 CHI_shanghai_clique_ascendant_desc: "Světla Bundu dosáhnou do každého ministerstva. Účetní z Pchu-tungu nyní zasedají ve Státní radě. Síť sahá dál než doktrína." # todo: NEW TRANSLATION
 CHI_shanghai_clique_leaning_desc: "Sítě Bundu mají hlas v každém ministerstvu. Provinční delegáti přesouvají své sázky směrem k Pchu-tungu." # todo: NEW TRANSLATION
 CHI_shanghai_municipality: "Shanghai Municipalita" # todo: NEW TRANSLATION
 CHI_Six_Party_Talks: "Šestistranné rozhovory" # todo: NEW TRANSLATION
 CHI_Six_Party_Talks_desc: "Šestistranné rozhovory spojují Čínu, Spojené státy, Rusko, Japonsko a obě Koreje při vyjednávání řešení severokorejské jaderné krize. Pořádáním těchto rozhovorů se můžeme postavit do role nepostradatelného prostředníka a zlepšit vztahy se všemi zúčastněnými stranami." # todo: NEW TRANSLATION
 CHI_taiwan: "Taiwan S.A.R." # todo: NEW TRANSLATION
 CHI_taiwan_autonomous_region: "Taiwan Autonomní oblast" # todo: NEW TRANSLATION
 CHI_technocratic_consolidation_desc: "Výzkumný úřad Státní rady je celou zemí. Pětileté plány se píší před zasedáními politbyra, nikoli po nich." # todo: NEW TRANSLATION
 CHI_The_North_Korean_Coup: "Jižní Korejský převrat" # todo: NEW TRANSLATION
 CHI_The_North_Korean_Coup_desc: "Přišel čas svrhnout tento zchátralý režim. Náš vliv v Severní Koreji získal na straně mnoho důstojníků, i když naši analytici si nejsou jisti, zda bychom měli usilovat o získání ještě větší podpory, než se pustíme do tohoto riskantního podniku." # todo: NEW TRANSLATION
 chi_the_one_china_policy: "Politika Jedné Číny" # todo: NEW TRANSLATION
 CHI_tianjin_municipality: "Tianjin Municipalita" # todo: NEW TRANSLATION
 CHI_tibet: "Xizang S.A.R" # todo: NEW TRANSLATION
 CHI_tibet_autonomous_region: "Xizang Autonomní oblast" # todo: NEW TRANSLATION
 CHI_water_pricing_reform: "Reforma cen průmyslové vody" # todo: NEW TRANSLATION
 CHI_water_pricing_reform_desc: "Namísto inženýrství na straně nabídky se ke snížení plýtvání používají ceny. Průmyslové vodné se prudce zvyšuje, což nutí těžký průmysl přijímat recyklační technologie a přesouvat se do oblastí s relativní vodní výhodou. Zemědělci se brání předpokládanému růstu nákladů." # todo: NEW TRANSLATION
 CHI_xinjiang_uygur: "Xinjiang S.A.R" # todo: NEW TRANSLATION
 CHI_xinjiang_uygur_autonomous_region: "Xinjiang Ujgurská Autonomní oblast" # todo: NEW TRANSLATION
 CHI_Yalu_Defense_Pact: "Obranný pakt na Jalu" # todo: NEW TRANSLATION
 CHI_Yalu_Defense_Pact_desc: "Formální obranné ujednání podél řeky Jalu spojuje naše vojenské plánování se severokorejským, zajišťuje nám garantovaný přístup a zároveň přislibuje vzájemnou obranu." # todo: NEW TRANSLATION
 CHI_youth_league_leaning_desc: "Absolventi Tuan-pchaj zastávají náměstkovské posty v polovině provincií. Rovnováha klientelismu se tiše a vytrvale posouvá." # todo: NEW TRANSLATION
 CHI_youth_league_resurgent_desc: "Každý provinční náměstek mladší padesáti let prošel Tuanem. Kohorta je na místě. Agenda se řídí podle ní." # todo: NEW TRANSLATION
 increase_research_funds: "Zvýšit výzkumné fondy" # todo: NEW TRANSLATION
 paektu_doctrine_southern: "Doktrína Pektu – jižní varování" # todo: NEW TRANSLATION
 uighur_threat_display: "$uighur_threat$: [?uighur_threat]" # todo: NEW TRANSLATION
 CHI_back_princeling_network: "Podpořit sítě princátek" # todo: NEW TRANSLATION
 CHI_back_princeling_network_desc: "Směrovat klientelismus k synům revoluční elity a šanghajského establishmentu a posunout rovnováhu moci ve prospěch frakce princátek." # todo: NEW TRANSLATION
 CHI_promote_youth_league: "Povýšit kádry Ligy mládeže" # todo: NEW TRANSLATION
 CHI_promote_youth_league_desc: "Prosazovat úředníky, kteří prošli Komunistickým svazem mládeže, a posunout rovnováhu moci ve prospěch frakce Tuan-pchaj." # todo: NEW TRANSLATION
 CHI_SAR_one_china_framework: "Rámec jedné Číny" # todo: NEW TRANSLATION
 CHI_SAR_one_china_framework_desc: "Peking znovu potvrzuje ústavní základ své pravomoci nad všemi zvláštními administrativními oblastmi a územími. Rámec stanovuje jednotný směr politiky z centra a zároveň uznává odlišná správní uspořádání jednotlivých oblastí." # todo: NEW TRANSLATION
 CHI_SAR_liaison_office_reform: "Reforma styčných úřadů" # todo: NEW TRANSLATION
 CHI_SAR_liaison_office_reform_desc: "Státní rada reorganizuje své styčné úřady pro ZAO do integrovanější koordinační sítě. Zjednodušené komunikační kanály mezi Pekingem a ZAO umožní rychlejší provádění politiky a sníží administrativní tření." # todo: NEW TRANSLATION
 CHI_SAR_national_security_framework: "Architektura národní bezpečnosti" # todo: NEW TRANSLATION
 CHI_SAR_national_security_framework_desc: "Jednotný aparát národní bezpečnosti je rozšířen na všechna území ZAO. Koordinace mezi posádkami Lidové osvobozenecké armády, úřady státní bezpečnosti a místními policejními silami je formalizována pod centrálním dohledem." # todo: NEW TRANSLATION
 CHI_SAR_two_systems_commitment: "Závazek dvou systémů" # todo: NEW TRANSLATION
 CHI_SAR_two_systems_commitment_desc: "Peking formálně znovu potvrzuje princip „jedna země, dva systémy“ pro všechny oprávněné ZAO. Vysoký stupeň autonomie je zaručen v rámci ústavního rámce, což signalizuje přednost přizpůsobení před integrací." # todo: NEW TRANSLATION
 CHI_SAR_two_systems_commitment_tt: "Dokončení tohoto §YNárodního zaměření§! odemkne všechny §Ycesty zaměření dvou systémů§!" # todo: NEW TRANSLATION
 CHI_SAR_research_sharing: "Výzkumná spolupráce ZAO" # todo: NEW TRANSLATION
 CHI_SAR_research_sharing_desc: "Peking zřizuje společné výzkumné programy propojující pevninské univerzity a státní laboratoře s institucemi ZAO. Iniciativa prohlubuje akademické a technologické vazby a zároveň rozšiřuje celkovou čínskou výzkumnou kapacitu." # todo: NEW TRANSLATION
 CHI_SAR_military_corporation_sharing: "Integrace obranného průmyslu" # todo: NEW TRANSLATION
 CHI_SAR_military_corporation_sharing_desc: "Obranní dodavatelé a strojírenské firmy se sídlem v ZAO jsou začleněni do pevninské zásobovací sítě. Sdílené výrobní normy a dodavatelské řetězce zvyšují výrobní kapacitu Lidové osvobozenecké armády." # todo: NEW TRANSLATION
 CHI_SAR_military_corporation_sharing_mio_tt: "Zvláštní administrativní oblasti získají přístup k čínským vojensko-průmyslovým organizacím" # todo: NEW TRANSLATION
 CHI_SAR_one_system_declaration: "Prohlášení jednoho systému" # todo: NEW TRANSLATION
 CHI_SAR_one_system_declaration_desc: "Státní rada signalizuje posun politiky směrem k hlubší integraci správy ZAO s pevninskými systémy. Samostatné právní a správní rámce budou v nadcházejících letech postupně harmonizovány s Čínskou lidovou republikou." # todo: NEW TRANSLATION
 CHI_SAR_one_system_declaration_tt: "Dokončení tohoto §YNárodního zaměření§! odemkne všechny §Ycesty zaměření jednoho systému§!" # todo: NEW TRANSLATION
 CHI_SAR_han_superiority: "Doktrína prvenství Chanů" # todo: NEW TRANSLATION
 CHI_SAR_han_superiority_desc: "Peking opouští model multietnického státu ve prospěch jediné národní identity soustředěné kolem chanské většiny. V návaznosti na „etnickou politiku druhé generace“, kterou prosazovali učenci jako Chu Angang a Chu Lien-che, je autonomie založená na etnicitě utlumována a asimilace ve všech regionech urychlována." # todo: NEW TRANSLATION
 CHI_HKG_greater_bay_area: "Iniciativa oblasti Velkého zálivu" # todo: NEW TRANSLATION
 CHI_HKG_greater_bay_area_desc: "Peking a Hongkong společně zahajují projekt oblasti Velkého zálivu Kuang-tung–Hongkong–Macao, který propojí jedenáct měst do jediného inovačního a finančního koridoru. Tento plán představuje nejambicióznější program regionální integrace Číny od vzniku zvláštní ekonomické zóny Šen-čen." # todo: NEW TRANSLATION
 CHI_HKG_financial_integration: "Integrace finančního systému" # todo: NEW TRANSLATION
 CHI_HKG_financial_integration_desc: "Mechanismy přeshraničních kapitálových toků jsou rozšířeny v rámci programů Stock Connect a Bond Connect. Role Hongkongu jako hlavního offshore centra renminbi je formalizována, čímž se prohlubuje vzájemná závislost s pevninskými finančními trhy." # todo: NEW TRANSLATION
 CHI_HKG_express_rail_link: "Expresní železniční spojení" # todo: NEW TRANSLATION
 CHI_HKG_express_rail_link_desc: "Expresní železniční spojení Kuang-čou–Šen-čen–Hongkong je dokončeno a přímo propojuje Hongkong s čínskou sítí vysokorychlostních železnic. Cestovní doby mezi Hongkongem a hlavními pevninskými městy se dramaticky zkracují, což urychluje pohyb lidí i zboží." # todo: NEW TRANSLATION
 CHI_HKG_individual_visit_scheme: "Program individuálních návštěv" # todo: NEW TRANSLATION
 CHI_HKG_individual_visit_scheme_desc: "Peking rozšiřuje program individuálních návštěv a umožňuje obyvatelům pevniny z dalších měst cestovat do Hongkongu bez omezení skupinových zájezdů. Příliv pevninských turistů a nakupujících poskytuje hongkongskému maloobchodu a službám výrazný impuls." # todo: NEW TRANSLATION
 CHI_HKG_shenzhen_hk_stock_connect: "Stock Connect Šen-čen–Hongkong" # todo: NEW TRANSLATION
 CHI_HKG_shenzhen_hk_stock_connect_desc: "Program vzájemného přístupu na trh propojuje hongkongskou a šenčenskou burzu a umožňuje investorům na obou stranách obchodovat s akciemi kotovanými na druhé burze. Tento program dále upevňuje nepostradatelnou roli Hongkongu jako brány pro přeshraniční kapitálové toky." # todo: NEW TRANSLATION
 CHI_HKG_electoral_reform: "Reforma volebního systému" # todo: NEW TRANSLATION
 CHI_HKG_electoral_reform_desc: "Peking přepracovává rámec voleb do hongkongské Legislativní rady, snižuje počet přímo volených mandátů a zavádí prověřování kandidátů, aby zajistil, že se o úřad budou ucházet pouze „patrioti“. Reforma definitivně přesouvá politickou moc od prodemokratické opozice." # todo: NEW TRANSLATION
 CHI_HKG_media_freedom: "Záruky svobody tisku" # todo: NEW TRANSLATION
 CHI_HKG_media_freedom_desc: "V ústupku tlaku občanské společnosti Peking souhlasí se zákonnou ochranou redakční nezávislosti v Hongkongu. Mezinárodní média tuto záruku vykládají jako signál, že model „dvou systémů“ bude dodržen do roku 2047." # todo: NEW TRANSLATION
 CHI_HKG_censorship: "Cenzura internetu a médií" # todo: NEW TRANSLATION
 CHI_HKG_censorship_desc: "Peking nařizuje hongkongským úřadům sladit internetové a vysílací předpisy města s pevninskými standardy. Webové stránky s obsahem považovaným za politicky citlivý jsou blokovány a redaktoři velkých novin čelí tlaku na autocenzuru." # todo: NEW TRANSLATION
 CHI_HKG_moral_national_education: "Morální a národní výchova" # todo: NEW TRANSLATION
 CHI_HKG_moral_national_education_desc: "Hongkongské školy zavádějí nové povinné osnovy národní výchovy, které zdůrazňují loajalitu ke Komunistické straně a pevninský pohled na čínské dějiny. Politika vyvolává značný odpor veřejnosti, ale pokračuje pod centrálním vedením." # todo: NEW TRANSLATION
 CHI_HKG_national_security_law: "Zákon o národní bezpečnosti podle článku 23" # todo: NEW TRANSLATION
 CHI_HKG_national_security_law_desc: "Hongkong přijímá právní předpisy o národní bezpečnosti, jak vyžaduje článek 23 Základního zákona, a kriminalizuje odtržení, podvracení, terorismus a koluzi s cizími mocnostmi. Zákon znamená faktický konec oddělené politické kultury města." # todo: NEW TRANSLATION
 CHI_HKG_lok_ma_chau_loop: "Rozvoj oblasti Lok Ma Chau Loop" # todo: NEW TRANSLATION
 CHI_HKG_lok_ma_chau_loop_desc: "Na oblasti Lok Ma Chau Loop, pozemku na hranici se Šen-čenem určeném ke společnému rozvoji, je zřízena specializovaná inovační a technologická zóna. Park má přilákat výzkumné instituce a technologické firmy usilující o blízkost Hongkongu i pevniny." # todo: NEW TRANSLATION
 CHI_HKG_2030_study: "Strategická studie Hongkong 2030+" # todo: NEW TRANSLATION
 CHI_HKG_2030_study_desc: "Hongkongská vláda zveřejňuje dlouhodobou strategii územního plánování, která identifikuje lokality pro nové rozvojové oblasti, dopravní koridory a průmyslové pozemky. Studie zasazuje fyzický růst Hongkongu do kontextu integrace oblasti Velkého zálivu." # todo: NEW TRANSLATION
 CHI_HKG_palace_museum: "Hongkongské palácové muzeum" # todo: NEW TRANSLATION
 CHI_HKG_palace_museum_desc: "V hongkongské kulturní čtvrti West Kowloon je zřízena pobočka pekingského Palácového muzea, která vystavuje artefakty zapůjčené ze sbírky Zakázaného města. Projekt je prezentován jako kulturní most mezi Hongkongem a pevninou a přitahuje značnou mezinárodní pozornost." # todo: NEW TRANSLATION
 CHI_HKG_zhuhai_macau_bridge: "Most Hongkong–Ču-chaj–Macao" # todo: NEW TRANSLATION
 CHI_HKG_zhuhai_macau_bridge_desc: "Je dokončen nejdelší systém mostu a tunelu přes moře na světě, který spojuje Hongkong, Ču-chaj a Macao přes ústí Perlové řeky. Stavba dramaticky zkracuje pozemní cestovní doby mezi třemi městy a slouží jako fyzická páteř integrace oblasti Velkého zálivu." # todo: NEW TRANSLATION
 CHI_HKG_lok_ma_chau_station: "Rozšíření stanice Lok Ma Chau" # todo: NEW TRANSLATION
 CHI_HKG_lok_ma_chau_station_desc: "Hraniční přechod Lok Ma Chau je modernizován rozšířením zařízení pro cestující a náklad, čímž se snižuje přetížení na jednom z nejvytíženějších hongkongských pozemních vstupů. Zlepšená logistická průchodnost urychluje přeshraniční obchod a dojíždění." # todo: NEW TRANSLATION
 CHI_SAR_integrate_HKG: "Integrace Hongkongu" # todo: NEW TRANSLATION
 CHI_SAR_integrate_HKG_desc: "Po úplném sladění hongkongských politických a ekonomických systémů s pevninou Peking formálně ruší oddělený správní status ZAO. Bývalá kolonie je začleněna jako přímo spravovaná obec Čínské lidové republiky." # todo: NEW TRANSLATION
 CHI_MAC_pearl_river_delta: "Integrace delty Perlové řeky" # todo: NEW TRANSLATION
 CHI_MAC_pearl_river_delta_desc: "Macao je formálně začleněno do ekonomické zóny delty Perlové řeky a infrastrukturní investice jsou zaměřeny na snížení jeho ekonomické izolace. Most Hongkong–Ču-chaj–Macao se stává páteří nové přeshraniční dopravní sítě." # todo: NEW TRANSLATION
 CHI_MAC_lotus_flower_economy: "Ekonomika lotosového květu" # todo: NEW TRANSLATION
 CHI_MAC_lotus_flower_economy_desc: "Macao zahajuje iniciativu k přebudování své ekonomické značky, založenou na osobité identitě portugalsko-čínské ZAO. Namísto zaměření na jediné odvětví strategie přetváří Macao v „světové centrum turistiky a volného času“ – značku, která rámuje veškeré následné diverzifikační snahy a odpovídá pekingské vizi oblasti Velkého zálivu." # todo: NEW TRANSLATION
 CHI_MAC_gambling_diversification: "Diverzifikace hazardního průmyslu" # todo: NEW TRANSLATION
 CHI_MAC_gambling_diversification_desc: "Po desetiletí stála prosperita Macaa na jediném pilíři: kasinech. Záměrný obrat k digitálním službám, elektronickému obchodu a technologické infrastruktuře rozšiřuje daňovou základnu za hranice herních stolů, tlumí dopad výkyvů příjmů z turismu a zároveň zakládá domácí internetovou ekonomiku." # todo: NEW TRANSLATION
 CHI_MAC_financial_services: "Centrum offshore finančních služeb" # todo: NEW TRANSLATION
 CHI_MAC_financial_services_desc: "Regulační rámec Macaa je aktualizován s cílem přilákat offshore bankovnictví, emise dluhopisů a zúčtovací obchody v renminbi. Portugalské právní dědictví území je propagováno jako výhoda pro lusofonní investory hledající přístup na pevninu." # todo: NEW TRANSLATION
 CHI_MAC_infrastructure_link: "Přeshraniční infrastrukturní spojení" # todo: NEW TRANSLATION
 CHI_MAC_infrastructure_link_desc: "Nový hraniční přechod a prodloužení lehké železnice spojují rozvojovou zónu Cotai v Macau přímo s Rozsáhlou zónou spolupráce Kuang-tung–Macao na ostrově Hengqin. Projekt fyzicky integruje ekonomickou stopu Macaa s pevninou." # todo: NEW TRANSLATION
 CHI_MAC_guangdong_integration: "Dohoda o integraci s Kuang-tungem" # todo: NEW TRANSLATION
 CHI_MAC_guangdong_integration_desc: "Komplexní dohoda o spolupráci s provincií Kuang-tung slaďuje plánovací, právní a finanční předpisy Macaa s pevninskými standardy. Úředníci dohodu označují za model pokojného sbližování správy ZAO a pevniny." # todo: NEW TRANSLATION
 CHI_SAR_integrate_MAC: "Úplná integrace Macaa" # todo: NEW TRANSLATION
 CHI_SAR_integrate_MAC_desc: "Po desetiletích prohlubující se ekonomické a právní harmonizace je status ZAO Macaa zrušen. Území je pohlceno správním systémem provincie Kuang-tung, čímž je dokončena poslední fáze předání z roku 1999." # todo: NEW TRANSLATION
 CHI_MAC_cultural_autonomy_push: "Hnutí za portugalské dědictví" # todo: NEW TRANSLATION
 CHI_MAC_cultural_autonomy_push_desc: "Občanské organizace vedou kampaň za zachování osobité portugalsko-čínské kulturní identity Macaa navzdory zrychlující se integraci s pevninou. Požadavky zahrnují zákonnou ochranu portugalského jazyka, komunity Macaňanů a jedinečného právního pluralismu území." # todo: NEW TRANSLATION
 CHI_MAC_lusophone_connections: "Strategie lusofonní brány" # todo: NEW TRANSLATION
 CHI_MAC_lusophone_connections_desc: "Macao se prostřednictvím rozšíření Fóra pro hospodářskou a obchodní spolupráci staví do role nepostradatelného mostu mezi Čínou a lusofonním světem. Mezinárodní uznání této jedinečné role poskytuje politický argument pro zachování vysokého stupně autonomie." # todo: NEW TRANSLATION
 CHI_TIB_plateau_development: "Fond rozvoje náhorní plošiny" # todo: NEW TRANSLATION
 CHI_TIB_plateau_development_desc: "Státní rada zahajuje rozsáhlý investiční program pro Tibetskou autonomní oblast zaměřený na infrastrukturu, bydlení a veřejné služby. Program napodobuje Strategii rozvoje západu, ale v domácím prostředí je rámován jako iniciativa na zmírnění chudoby." # todo: NEW TRANSLATION
 CHI_TIB_railway_modernization: "Prodloužení železnice Čching-chaj–Tibet" # todo: NEW TRANSLATION
 CHI_TIB_railway_modernization_desc: "Je schválena druhá fáze železnice Čching-chaj–Tibet, která prodlouží trať do Žikace a nakonec do Nyingčh nedaleko indických hranic. Projekt snižuje logistickou izolaci Tibetu a urychluje přesun chanské populace a bezpečnostních sil." # todo: NEW TRANSLATION
 CHI_TIB_release_falun_gong: "Amnestie Falun Gongu" # todo: NEW TRANSLATION
 CHI_TIB_release_falun_gong_desc: "Peking v promyšleném gestu otevřenosti propouští vězněné praktikující Falun Gongu a zmírňuje omezení náboženských aktivit hnutí v Tibetské autonomní oblasti. Ústupek získává opatrnou chválu západních vlád a signalizuje mírnější přístup k náboženskému disentu." # todo: NEW TRANSLATION
 CHI_TIB_return_dalai_lama: "Návrat dalajlamy" # todo: NEW TRANSLATION
 CHI_TIB_return_dalai_lama_desc: "Po dlouhých jednáních tajnými kanály dosahují Peking a zástupci dalajlamy dohody umožňující tibetskému duchovnímu vůdci vrátit se do Lhasy v ceremoniální roli. Dohoda nedosahuje politické autonomie, ale získává značnou přízeň v mezinárodních metropolích." # todo: NEW TRANSLATION
 CHI_TIB_sinification: "Kampaň vlastenecké výchovy" # todo: NEW TRANSLATION
 CHI_TIB_sinification_desc: "Strana zahajuje systematický program ideologické převýchovy v tibetských klášterech a školách, který vyžaduje odsouzení dalajlamy a sliby věrnosti vlasti. Kampaň je modelována podle iniciativy „Tvrdý úder“ z 90. let a řídí ji zvlášť nasazené pracovní týmy." # todo: NEW TRANSLATION
 CHI_TIB_autonomy_preservation: "Rámec skutečné autonomie" # todo: NEW TRANSLATION
 CHI_TIB_autonomy_preservation_desc: "V reakci na mezinárodní tlak a opakující se nepokoje zahajuje Peking se zástupci dalajlamy jednání o rozšíření kulturní a náboženské autonomie. Strasburský návrh a přístup střední cesty slouží jako základ pro jednání zadními kanály." # todo: NEW TRANSLATION
 CHI_TIB_cultural_integration: "Sinizace správy" # todo: NEW TRANSLATION
 CHI_TIB_cultural_integration_desc: "Chanští úředníci jsou jmenováni do vedoucích funkcí v tibetském správním, soudním a bezpečnostním aparátu. Mandarínština nahrazuje tibetštinu jako jazyk vlády a osnovy všech státních škol jsou sjednoceny s pevninským obsahem." # todo: NEW TRANSLATION
 CHI_SAR_integrate_TIB: "Úplná integrace Tibetu" # todo: NEW TRANSLATION
 CHI_SAR_integrate_TIB_desc: "Po neutralizaci náboženské autority, úplném sladění správních struktur a dokončení demografické transformace je zbytkový status ZAO Tibetské autonomní oblasti zrušen. Tibet je znovu začleněn jako běžná provincie pod přímou správou ústřední vlády." # todo: NEW TRANSLATION
 CHI_TIB_buddhist_cultural_zone: "Zóna ochrany buddhistické kultury" # todo: NEW TRANSLATION
 CHI_TIB_buddhist_cultural_zone_desc: "Kolem paláce Potala a chrámu Džókhang je zřízena vymezená památková zóna, která poskytuje omezené formální uznání tibetskému buddhismu jako instituci kulturního dědictví. Kritici tento ústupek označují za turisticky orientovaný kompromis, který se vyhýbá skutečné náboženské svobodě." # todo: NEW TRANSLATION
 CHI_TIB_silk_road_gateway: "Brána himálajské Hedvábné stezky" # todo: NEW TRANSLATION
 CHI_TIB_silk_road_gateway_desc: "Geografická poloha Tibetu na křižovatce jihoasijských koridorů Pásu a stezky je využita k investicím do pohraniční infrastruktury, vodní energie a obchodní logistiky. Iniciativa integruje tibetskou ekonomiku s Nepálem a jihoasijskými trhy a zároveň prohlubuje závislost na pevnině." # todo: NEW TRANSLATION
 CHI_TIB_monastery_economy: "Klášterní ekonomika" # todo: NEW TRANSLATION
 CHI_TIB_monastery_economy_desc: "Tibetským klášterním institucím, historicky páteři regionální ekonomiky, je v rámci ZAO povoleno provozovat obchodní podniky. Poutní turismus, výroba tradiční medicíny a řemeslná odvětví vytvářejí příjmy podporující kláštery i místní komunity." # todo: NEW TRANSLATION
 CHI_TIB_plateau_resources: "Průzkum nerostných surovin náhorní plošiny" # todo: NEW TRANSLATION
 CHI_TIB_plateau_resources_desc: "Tibetská autonomní oblast zahajuje nezávislý průzkum, který identifikuje významná ložiska lithia, mědi a chromitu na Tibetské náhorní plošině. Úřady ZAO vyjednávají dohody o rozdělení příjmů, které ponechávají část výnosů z těžby v regionálním rozpočtu." # todo: NEW TRANSLATION
 CHI_ETK_corridor_investment: "Investice do koridoru Pásu a stezky" # todo: NEW TRANSLATION
 CHI_ETK_corridor_investment_desc: "Sin-ťiang je určen za hlavní pozemní bránu Iniciativy Pásu a stezky a přitahuje rozsáhlé státní investice do železniční, potrubní a dálniční infrastruktury. Severní konec Čínsko-pákistánského hospodářského koridoru v Kašgaru proměňuje ekonomickou geografii regionu." # todo: NEW TRANSLATION
 CHI_ETK_resource_extraction: "Těžba energie a nerostných surovin" # todo: NEW TRANSLATION
 CHI_ETK_resource_extraction_desc: "Ropné a plynové zásoby Tarimské pánve jsou rozšiřovány v rámci státního rozvojového programu, který upřednostňuje výstavbu potrubí a rafinérské kapacity. Podíl Sin-ťiangu na celostátní produkci ropy výrazně roste, ačkoli převody příjmů do centra zůstávají trvalým zdrojem nespokojenosti." # todo: NEW TRANSLATION
 CHI_ETK_silk_road_commerce: "Iniciativa obchodu na Hedvábné stezce" # todo: NEW TRANSLATION
 CHI_ETK_silk_road_commerce_desc: "Tradiční ujgurské obchodní sítě v Sin-ťiangu jsou formálně začleněny do regionální obchodní politiky a získávají přednostní licence pro přeshraniční obchod s republikami Střední Asie. Politika oživuje historický vzorec ujgurského zprostředkování obchodu sahající do období dynastie Tang." # todo: NEW TRANSLATION
 CHI_ETK_oilfield_development: "Rozvoj ropných polí Tarimské pánve" # todo: NEW TRANSLATION
 CHI_ETK_oilfield_development_desc: "Vláda ZAO Sin-ťiang vyjednává s národními energetickými společnostmi dohody o společných podnicích pro průzkum Tarimské pánve a zajišťuje regionu bezprecedentní podíl licenčních poplatků z těžby na infrastrukturu. Ropná pole patří k největším v Číně a tvoří základ fiskální nezávislosti regionu." # todo: NEW TRANSLATION
 CHI_ETK_strike_hard_campaign: "Kampaň tvrdého úderu" # todo: NEW TRANSLATION
 CHI_ETK_strike_hard_campaign_desc: "Kampaň „Tvrdý úder, maximální tlak“ zaměřená na ujgurské separatistické sítě je znovu zahájena v bezprecedentním měřítku a zahrnuje digitální dohled, masové zadržování a systematické potlačování náboženské praxe. Mezinárodní organizace pro lidská práva dokumentují rozsáhlé zneužívání." # todo: NEW TRANSLATION
 CHI_ETK_education_centres: "Centra odborného vzdělávání" # todo: NEW TRANSLATION
 CHI_ETK_education_centres_desc: "Po celém Sin-ťiangu je zřízena síť mimosoudních zadržovacích zařízení oficiálně označovaných jako „centra odborného vzdělávání a výcviku“. V celém regionu je nasazena komplexní digitální dohledová síť zahrnující rozpoznávání obličejů, databáze DNA a sledování chytrých telefonů." # todo: NEW TRANSLATION
 CHI_ETK_total_survaillance_infrastructure: "Infrastruktura úplného dohledu" # todo: NEW TRANSLATION
 CHI_ETK_total_survaillance_infrastructure_desc: "V Sin-ťiangu je vybudována celoregionální dohledová síť integrující kamery s rozpoznáváním obličejů, biometrická kontrolní stanoviště a povinný software pro sledování chytrých telefonů. Systém poskytuje úřadům téměř úplný přehled o pohybu obyvatelstva a online aktivitě." # todo: NEW TRANSLATION
 CHI_SAR_integrate_ETK: "Úplná integrace Sin-ťiangu" # todo: NEW TRANSLATION
 CHI_SAR_integrate_ETK_desc: "Po téměř úplném potlačení separatistické činnosti a vytlačení tradičních ujgurských společenských struktur je správní rámec ZAO Sin-ťiang zrušen. Region je reorganizován pod standardní provinční správou bez zvláštních ustanovení o etnické autonomii." # todo: NEW TRANSLATION
 CHI_ETK_autonomy_statute: "Statut autonomie Sin-ťiangu" # todo: NEW TRANSLATION
 CHI_ETK_autonomy_statute_desc: "Nový statut regionální autonomie přiznává muslimským komunitám v Sin-ťiangu formální práva na náboženskou praxi, vzdělávání v ujgurštině a zvykové právo v osobních záležitostech. Statut podporuje vybraná skupina mezinárodních islámských organizací." # todo: NEW TRANSLATION
 CHI_ETK_islamic_governance_framework: "Rámec islámské správy" # todo: NEW TRANSLATION
 CHI_ETK_islamic_governance_framework_desc: "Peking přijímá v Sin-ťiangu smířlivější přístup, povoluje regulovanou islámskou náboženskou praxi, rozšiřuje vzdělávání v ujgurštině a jmenuje více ujgurských úředníků do místní správy. Politika připomíná relativní shovívavost období před rokem 2017." # todo: NEW TRANSLATION
 CHI_ETK_BRI_hub: "Speciální ekonomická zóna Kašgar" # todo: NEW TRANSLATION
 CHI_ETK_BRI_hub_desc: "Kašgar je vyhlášen speciální ekonomickou zónou s přednostním daňovým režimem a zjednodušenými celními postupy pro tranzitní obchod Pásu a stezky. Zóna staví Sin-ťiang do role obchodního uzlu spojujícího Střední Asii, jižní Asii a Blízký východ." # todo: NEW TRANSLATION
 CHI_TAI_combat_the_traitors: "Bojovat se zrádci" # todo: NEW TRANSLATION
 CHI_TAI_combat_the_traitors_desc: "Peking zaujímá vůči Tchaj-wanu nekompromisní postoj, oficiálně označuje představitele podporující nezávislost za zrádce a signalizuje, že znovusjednocení silou zůstává aktivní možností. Prohlášení prudce zvyšuje napětí v průlivu a uvádí PLA do zvýšené pohotovosti." # todo: NEW TRANSLATION
 CHI_TAI_cut_us_support: "Přerušení vazeb USA–Tchaj-wan" # todo: NEW TRANSLATION
 CHI_TAI_cut_us_support_desc: "Peking vede dlouhodobou vlivovou kampaň zaměřenou na americké politické a podnikatelské kruhy a lobbuje proti prodeji zbraní a oficiálním kontaktům s Tchaj-pejí. Operace má oslabit důvěryhodnost závazku USA k bezpečnosti Tchaj-wanu." # todo: NEW TRANSLATION
 CHI_TAI_outward_island_infrastructure: "Vojenská infrastruktura na vnějších ostrovech" # todo: NEW TRANSLATION
 CHI_TAI_outward_island_infrastructure_desc: "Po obsazení Tchaj-wanu začíná Lidová osvobozenecká armáda budovat opevněná námořní a letecká zařízení na vnějších ostrovech. Nové základny prodlužují dosah projekce čínské moci hluboko do západního Pacifiku a výrazně mění regionální rovnováhu sil." # todo: NEW TRANSLATION
 CHI_TAI_cross_strait_policy: "Revize politiky vůči průlivu" # todo: NEW TRANSLATION
 CHI_TAI_cross_strait_policy_desc: "Státní rada pověřuje komplexní revizí politiky vůči průlivu a zkoumá diplomatické, ekonomické a vojenské možnosti znovusjednocení. Revize stanoví politickou agendu čínského přístupu k Tchaj-wanu pro nadcházející desetiletí." # todo: NEW TRANSLATION
 CHI_TAI_economic_track: "Ekonomická cesta přes průliv" # todo: NEW TRANSLATION
 CHI_TAI_economic_track_desc: "Peking zahajuje strukturovaný ekonomický dialog s Tchaj-pejí zaměřený na usnadnění obchodu, průmyslovou spolupráci a dlouhodobý přístup na trh. Cílem je vytvořit dostatek vzájemného prospěchu, aby bylo obtížnější odmítnout politická jednání." # todo: NEW TRANSLATION
 CHI_TAI_political_track: "Politická cesta přes průliv" # todo: NEW TRANSLATION
 CHI_TAI_political_track_desc: "Vedle ekonomického angažmá Peking zřizuje specializovanou politickou cestu zaměřenou na obnovení dialogu, snížení napětí a přípravu půdy pro vyjednané řešení přijatelné pro obě strany." # todo: NEW TRANSLATION
 CHI_TAI_expand_cross_strait_trade: "Rozšířit obchod přes průliv" # todo: NEW TRANSLATION
 CHI_TAI_expand_cross_strait_trade_desc: "Peking navazuje na logiku ECFA a pozdějších rozhovorů o obchodu se službami a nabízí nové obchodní ústupky a nižší překážky pro tchajwanské firmy působící na pevnině. Politika má tchajwanským politickým a podnikatelským elitám zřetelně ukázat výnosnost hospodářské spolupráce." # todo: NEW TRANSLATION
 CHI_TAI_mainland_market_access: "Přístup na pevninský trh" # todo: NEW TRANSLATION
 CHI_TAI_mainland_market_access_desc: "Čína poskytuje tchajwanským investorům a vývozcům přednostní přístup do vybraných odvětví pevninského trhu, zejména do vyspělé výroby a služeb. Uspořádání odráží skutečné snahy připoutat Tchaj-wan k pevninské ekonomice prostřednictvím příležitostí namísto síly." # todo: NEW TRANSLATION
 CHI_TAI_business_delegations: "Podnikatelské delegace přes průliv" # todo: NEW TRANSLATION
 CHI_TAI_business_delegations_desc: "Poloficiální obchodní skupiny, obchodní komory a významní průmysloví aktéři obnovují pravidelné návštěvy přes průliv. Tyto delegace vytvářejí politicky bezpečnější způsob prohlubování praktické spolupráce a zároveň budují na Tchaj-wanu skupiny těžící ze stabilních vztahů." # todo: NEW TRANSLATION
 CHI_TAI_transport_links: "Přímé dopravní spojení" # todo: NEW TRANSLATION
 CHI_TAI_transport_links_desc: "Přímé lety, námořní ujednání a logistická koordinace jsou rozšířeny s cílem snížit praktické oddělení obou stran. Rychlejší pohyb zboží i cestujících snižuje politické náklady pokračujícího angažmá a dále normalizuje výměnu přes průliv." # todo: NEW TRANSLATION
 CHI_TAI_semiconductor_coordination: "Koordinace v oblasti polovodičů" # todo: NEW TRANSLATION
 CHI_TAI_semiconductor_coordination_desc: "Tchaj-pej souhlasí s omezenou strategickou koordinací v technologicky vyspělých dodavatelských řetězcích, zejména v oblasti polovodičů a přesné výroby. Uspořádání odráží skutečnou ekonomickou vzájemnou závislost tchajwanského čipového sektoru a pevninské poptávky, aniž by dospělo k otevřené politické unii." # todo: NEW TRANSLATION
 CHI_TAI_investment_safeguards: "Záruky investic" # todo: NEW TRANSLATION
 CHI_TAI_investment_safeguards_desc: "Tchajwanští vyjednavači trvají na tom, že hlubší ekonomická integrace musí být spojena s právními a regulačními zárukami chránícími místní firmy a instituce. Tento přístup vychází ze skutečných domácích obav, že investice přes průliv se nesmějí stát nástrojem politického pohlcení." # todo: NEW TRANSLATION
 CHI_TAI_joint_industrial_planning: "Společné průmyslové plánování" # todo: NEW TRANSLATION
 CHI_TAI_joint_industrial_planning_desc: "Plánovači na obou stranách začínají koordinovat infrastrukturu, průmyslové dodavatelské řetězce a technologicky náročná odvětví. Proces proměňuje rozptýlené obchodní vazby v něco bližšího řízené rozvojové strategii přes průliv." # todo: NEW TRANSLATION
 CHI_TAI_deep_economic_integration: "Hluboká ekonomická integrace" # todo: NEW TRANSLATION
 CHI_TAI_deep_economic_integration_desc: "Po letech hromadících se dohod je obchod přes průliv formalizován do hustého rámce investiční, logistické a průmyslové vzájemné závislosti. V této fázi je ekonomické oddělení pro obě strany, zejména pro Tchaj-wan, stále nákladnější." # todo: NEW TRANSLATION
 CHI_TAI_resume_party_contacts: "Obnovit stranické kontakty" # todo: NEW TRANSLATION
 CHI_TAI_resume_party_contacts_desc: "Peking obnovuje kanály se stranami a organizacemi na Tchaj-wanu ochotnými diskutovat o méně konfrontačních vztazích přes průliv. Přístup vychází ze skutečného vzorce dialogu KS Číny a Kuomintangu i dalších neoficiálních politických kontaktů, které pravidelně nahrazovaly diplomacii mezi státy." # todo: NEW TRANSLATION
 CHI_TAI_pro_china_party_networks_mission: "Pročínské stranické sítě" # todo: NEW TRANSLATION
 CHI_TAI_pro_china_party_networks_mission_desc: "Čínské obchodní a politické sítě napříč průlivem aktivně budují podporu pro strany podporující sjednocení na Tchaj-wanu. Dokud náš vliv zůstane značný, toto úsilí postupně posouvá veřejné mínění směrem ke koalici Pan-modrých." # todo: NEW TRANSLATION
 CHI_TAI_offer_confidence_measures: "Nabídnout opatření k budování důvěry" # todo: NEW TRANSLATION
 CHI_TAI_offer_confidence_measures_desc: "Peking navrhuje balíček praktických kroků ke snížení napětí včetně pravidelných komunikačních kanálů a zdrženlivosti ve veřejných prohlášeních. Záměrem je přesvědčit tchajwanské umírněné, že angažmá může snížit riziko, aniž by okamžitě vynucovalo rozhodnutí o suverenitě." # todo: NEW TRANSLATION
 CHI_TAI_legislative_exchange_forum: "Fórum legislativní výměny" # todo: NEW TRANSLATION
 CHI_TAI_legislative_exchange_forum_desc: "Delegace zákonodárců, poradců a odborníků na politiku se začínají setkávat prostřednictvím poloficiálních kanálů a diskutovat o obchodu, dopravě a správní koordinaci. Taková fóra dávají angažmá přes průliv parlamentní a procedurální tvář a zmírňují dojem tlaku shora." # todo: NEW TRANSLATION
 CHI_TAI_local_government_dialogue: "Dialog místních samospráv" # todo: NEW TRANSLATION
 CHI_TAI_local_government_dialogue_desc: "Městské správy, okresní vlády a subnárodní představitelé zahajují praktická jednání o dopravě, turismu a investicích. To odráží skutečný vzorec, v němž obecní a místní vazby často postupovaly vpřed i v době napjatých vztahů na úrovni ústředních vlád." # todo: NEW TRANSLATION
 CHI_TAI_reaffirm_the_1992_consensus: "Znovu potvrdit konsensus z roku 1992" # todo: NEW TRANSLATION
 CHI_TAI_reaffirm_the_1992_consensus_desc: "Tchajwanští umírnění se rozhodují výslovně vrátit k rámci, podle něhož existuje jedna Čína, přičemž si zachovají vlastní výklad této zásady. Vzorec je doma kontroverzní, ale zůstává nejrealističtějším základem pro vážná jednání přes průliv." # todo: NEW TRANSLATION
 CHI_TAI_suspend_independence_initiatives: "Pozastavit iniciativy za nezávislost" # todo: NEW TRANSLATION
 CHI_TAI_suspend_independence_initiatives_desc: "Tchaj-pej tiše zastavuje opatření, která by ostrov v právní či diplomatické oblasti posunula k formálnímu oddělení. To nekončí samosprávu, ale signalizuje připravenost Tchaj-wanu stabilizovat situaci namísto jejího vyhrocování." # todo: NEW TRANSLATION
 CHI_TAI_back_channel_settlement: "Dohoda zadními kanály" # todo: NEW TRANSLATION
 CHI_TAI_back_channel_settlement_desc: "Poloficiální organizace na obou stranách přecházejí od budování důvěry k věcnému politickému vyjednávání. Podle modelu kontaktů typu ARATS-SEF připravují rámec dohody, který má učinit pokojné znovusjednocení spořádaným, postupným a materiálně výhodným." # todo: NEW TRANSLATION
 CHI_TAI_peaceful_reunification_accord: "Dohoda o pokojném znovusjednocení" # todo: NEW TRANSLATION
 CHI_TAI_peaceful_reunification_accord_desc: "Po letech postupného diplomatického pokroku podepisují Peking a Tchaj-pej historickou rámcovou dohodu, podle níž Tchaj-wan vstoupí do Čínské lidové republiky jako zvláštní administrativní oblast. Dohoda zaručuje stávající demokratické instituce a právní systém Tchaj-wanu na přechodné období padesáti let." # todo: NEW TRANSLATION
 CHI_TAI_military_buildup: "Vojenské posilování přes průliv" # todo: NEW TRANSLATION
 CHI_TAI_military_buildup_desc: "Lidová osvobozenecká armáda urychluje pořizování obojživelných útočných lodí, výsadkových plavidel a dálkových přesných střel určených pro scénář v Tchajwanském průlivu. Společná cvičení simulují obsazení pobřežních ostrovů a potlačení tchajwanské protivzdušné obrany." # todo: NEW TRANSLATION
 CHI_TAI_amphibious_doctrine: "Doktrína společného vylodění na ostrově" # todo: NEW TRANSLATION
 CHI_TAI_amphibious_doctrine_desc: "Námořní pěchota PLA a Východní velitelství zveřejňují revidovanou společnou operační doktrínu kombinovaných obojživelných útoků. Doktrína je tajná, ale zahraniční zpravodajské služby ji široce analyzují jako přímý plán pro případ Tchaj-wanu." # todo: NEW TRANSLATION
 CHI_TAI_blockade_declaration: "Blokáda Tchajwanského průlivu" # todo: NEW TRANSLATION
 CHI_TAI_blockade_declaration_desc: "Námořnictvo PLA vyhlašuje kolem Tchaj-wanu námořní uzavřenou zónu, přerušuje obchodní lodní trasy a odřezává dovoz paliva a surovin. Blokádu doprovázejí dlouhá letecká cvičení a testy balistických raket, což vyvolává mezinárodní krizi." # todo: NEW TRANSLATION
 CHI_TAI_operation_storm: "Operace Bouře" # todo: NEW TRANSLATION
 CHI_TAI_operation_storm_desc: "Lidová osvobozenecká armáda zahajuje dlouho plánovanou obojživelnou kampaň proti Tchaj-wanu. Raketové údery neutralizují protivzdušnou obranu a velitelskou infrastrukturu, zatímco výsadkové síly překračují průliv pod leteckým a námořním krytím. Operace představuje nejvýznamnější vojenskou akci v Asii od korejské války." # todo: NEW TRANSLATION
 CHI_TAI_economic_miracle: "Integrace tchajwanského hospodářského zázraku" # todo: NEW TRANSLATION
 CHI_TAI_economic_miracle_desc: "Vyspělý tchajwanský polovodičový průmysl, finanční sektor a technologický ekosystém jsou formálně začleněny do rámce národního ekonomického plánování. Získání těchto kapacit představuje zásadní posílení čínských technologických schopností, zejména ve výrobě čipů." # todo: NEW TRANSLATION
 CHI_OMG_steppe_development: "Iniciativa rozvoje Vnitřního Mongolska" # todo: NEW TRANSLATION
 CHI_OMG_steppe_development_desc: "Státní rada zahajuje cílený rozvojový program pro Autonomní oblast Vnitřní Mongolsko a investuje do energetické infrastruktury, logistických koridorů a průmyslových parků. Iniciativa hlouběji integruje Vnitřní Mongolsko do národní ekonomické sítě a zároveň řeší přetrvávající venkovskou chudobu." # todo: NEW TRANSLATION
 CHI_OMG_northern_corridor: "Infrastruktura severního koridoru" # todo: NEW TRANSLATION
 CHI_OMG_northern_corridor_desc: "Je schválena nová dálnice a železniční nákladní koridor spojující Vnitřní Mongolsko s aglomerací Peking–Tchien-ťin–Che-pej, čímž se zkracuje tranzitní doba pro uhlí, vzácné zeminy a zemědělské produkty. Koridor upevňuje roli Vnitřního Mongolska jako energetického zázemí severní Číny." # todo: NEW TRANSLATION
 CHI_OMG_mandarin_education: "Politika výuky v mandarínštině" # todo: NEW TRANSLATION
 CHI_OMG_mandarin_education_desc: "Regionální vláda oznamuje postupný přechod, který vyžaduje, aby všechny základní a střední školy vyučovaly hlavní předměty v mandarínštině namísto mongolštiny. Politika podle vzoru podobných opatření v Tibetu a Sin-ťiangu vyvolává rozsáhlé protesty ve městech i pasteveckých komunitách Vnitřního Mongolska." # todo: NEW TRANSLATION
 CHI_OMG_cultural_recognition: "Uznání mongolské kultury" # todo: NEW TRANSLATION
 CHI_OMG_cultural_recognition_desc: "Peking formálně uznává mongolskou kulturní a jazykovou identitu ZAO Vnitřní Mongolsko a zaručuje vzdělávání v mongolštině, státní vysílání a oficiální status písma. Politika představuje záměrný odklon od asimilačního přístupu uplatňovaného v Tibetu a Sin-ťiangu." # todo: NEW TRANSLATION
 CHI_OMG_han_settlement_program: "Program osidlování Chany" # todo: NEW TRANSLATION
 CHI_OMG_han_settlement_program_desc: "Státem podporovaná migrace z Che-peje, Šen-si a Kan-su urychluje demografickou proměnu Vnitřního Mongolska. Na bývalé pastevecké půdě vznikají nové obce a zvýhodněná zaměstnanecká politika dále upevňuje chanskou většinu v městských oblastech." # todo: NEW TRANSLATION
 CHI_SAR_integrate_OMG: "Úplná integrace Vnitřního Mongolska" # todo: NEW TRANSLATION
 CHI_SAR_integrate_OMG_desc: "Po demografické a kulturní proměně je status ZAO Vnitřní Mongolsko zrušen a region je restrukturalizován jako standardní správní jednotka na úrovni provincie. Formální uznání mongolské autonomie je nahrazeno obecnými ustanoveními o ochraně etnických menšin platnými v celé ČLR." # todo: NEW TRANSLATION
 CHI_OMG_greater_mongolia_vision: "Vize Velkého Mongolska" # todo: NEW TRANSLATION
 CHI_OMG_greater_mongolia_vision_desc: "Zastánci kulturního hnutí ve Vnitřním Mongolsku formulují vizi užších vazeb s nezávislým Mongolskem a odvolávají se na společné dějiny, jazyk a kočovné dědictví. Peking toleruje kulturní rámec, ale zachovává přísné limity pro jakékoli politické důsledky." # todo: NEW TRANSLATION
 OMG_steppe_livestock_industry: "Modernizace pastevectví na stepi" # todo: NEW TRANSLATION
 OMG_steppe_livestock_industry_desc: "Tradiční odvětví kašmíru, skopového masa a mléčných výrobků ve Vnitřním Mongolsku jsou restrukturalizována v družstevním modelu propojujícím pastevecké rodiny s národními dodavatelskými řetězci. Program zvyšuje příjmy domácností a zároveň zachovává prvky pasteveckého způsobu života." # todo: NEW TRANSLATION
 CHI_OMG_steppe_mining_industry: "Těžební průmysl stepi" # todo: NEW TRANSLATION
 CHI_OMG_steppe_mining_industry_desc: "Ložiska chromu a nerostných surovin ve Vnitřním Mongolsku jsou zapojena do koordinovaného těžebního programu. Státem podporované podniky zřizují zpracovatelská zařízení a exportní koridory a mění podzemní bohatství v průmyslovou kapacitu pro širší čínskou ekonomiku." # todo: NEW TRANSLATION
 OMG_mongolian_mining_expansion: "Rozšíření těžby vzácných zemin a uhlí" # todo: NEW TRANSLATION
 OMG_mongolian_mining_expansion_desc: "Vnitřní Mongolsko obsahuje některá z největších ložisek vzácných zemin na světě a třetinu čínských zásob uhlí. Úřady ZAO rozšiřují těžbu a vyjednávají licenční dohody, které směřují větší podíl příjmů z nerostů do regionální infrastruktury a vzdělávání." # todo: NEW TRANSLATION
 CHI_OMG_mongolian_mining_expansion: "Rozšíření těžby vzácných zemin a uhlí" # todo: NEW TRANSLATION
 CHI_OMG_mongolian_mining_expansion_desc: "Vnitřní Mongolsko obsahuje některá z největších ložisek vzácných zemin na světě a třetinu čínských zásob uhlí. Úřady ZAO rozšiřují těžbu a vyjednávají licenční dohody, které směřují větší podíl příjmů z nerostů do regionální infrastruktury a vzdělávání." # todo: NEW TRANSLATION
 CHI_MON_diplomatic_outreach: "Diplomatické oslovení Mongolska" # todo: NEW TRANSLATION
 CHI_MON_diplomatic_outreach_desc: "Peking zahajuje diplomatickou iniciativu vůči Ulánbátaru, která kombinuje ekonomické pobídky s kulturními výzvami ke společnému mongolskému dědictví. Návštěvy na vysoké úrovni, přednostní obchodní podmínky a rozšířená čínská kulturní přítomnost připravují půdu pro hlubší angažmá." # todo: NEW TRANSLATION
 CHI_MON_economic_partnership: "Hospodářské partnerství stepi" # todo: NEW TRANSLATION
 CHI_MON_economic_partnership_desc: "Komplexní dohoda o hospodářském partnerství poskytuje Mongolsku přednostní přístup na čínské trhy, k investicím a infrastrukturnímu financování. Mongolský vývoz nerostů – mědi, uhlí a vzácných zemin – nachází v Číně hlavního odběratele, čímž vzniká značná ekonomická vzájemná závislost." # todo: NEW TRANSLATION
 CHI_MON_reunification_offer: "Nabídka znovusjednocení Mongolska" # todo: NEW TRANSLATION
 CHI_MON_reunification_offer_desc: "Čína předkládá Mongolsku formální nabídku znovusjednotit se jako zvláštní administrativní oblast a slibuje vysoký stupeň autonomie, zachování mongolského politického systému a úplnou ekonomickou integraci. Návrh se odvolává na historický precedens a staví Čínu do role přirozeného partnera mongolské prosperity." # todo: NEW TRANSLATION
 MON_CHI_economic_partnership_idea: "Čínsko-mongolská ekonomická integrace" # todo: NEW TRANSLATION
 MON_CHI_economic_partnership_idea_desc: "Přednostní přístup k obchodu a integrace s čínským trhem učinily Mongolsko silně závislým na vývozu do Číny. Příjmy z těžby rostou, stejně jako strukturální závislost na čínské poptávce." # todo: NEW TRANSLATION
 MON_CHI_cultural_sphere_idea: "V čínské kulturní sféře" # todo: NEW TRANSLATION
 MON_CHI_cultural_sphere_idea_desc: "Čínská státní média, kulturní programy a diasporické sítě vybudovaly uvnitř Mongolska významnou přítomnost měkké moci. Odpor k dalšímu čínskému vlivu v důsledku slábne." # todo: NEW TRANSLATION
 CHI_TAI_fleet_modernization: "Program modernizace flotily" # todo: NEW TRANSLATION
 CHI_TAI_fleet_modernization_desc: "Námořnictvo PLA urychluje pořizování moderních torpédoborců, fregat a obojživelných útočných lodí určených pro operace v Tchajwanském průlivu. Rozšířená kapacita loděnic a zrychlené termíny uvádění do služby signalizují jasný posun k projekci moci v západním Pacifiku." # todo: NEW TRANSLATION
 CHI_TAI_dongfeng_program: "Program raket Tung-feng" # todo: NEW TRANSLATION
 CHI_TAI_dongfeng_program_desc: "Raketové síly rozšiřují arzenál balistických raket středního doletu a rozmisťují další baterie DF-21 a DF-26 podél pobřeží Fu-ťienu. Program dává Pekingu schopnost ohrožovat tchajwanskou vojenskou infrastrukturu z pevniny bez nasazení námořních či leteckých prostředků." # todo: NEW TRANSLATION
 CHI_TAI_air_superiority: "Strategie vzdušné převahy" # todo: NEW TRANSLATION
 CHI_TAI_air_superiority_desc: "Letectvo PLA zintenzivňuje cvičné lety nad středovou linií Tchajwanského průlivu a rozmísťuje vyspělé stíhačky J-20 na předsunutých základnách ve Fu-ťienu. Trvalý letecký tlak oslabuje schopnost Tchaj-wanu udržovat důvěryhodnou protivzdušnou obranu." # todo: NEW TRANSLATION
 CHI_TAI_cyber_warfare: "Schopnost kybernetické války" # todo: NEW TRANSLATION
 CHI_TAI_cyber_warfare_desc: "Strategické podpůrné síly rozšiřují ředitelství útočných kybernetických operací a rozvíjejí schopnosti narušovat kritickou infrastrukturu, vojenskou komunikaci a finanční systémy Tchaj-wanu. Digitální fronta se stává další osou nátlaku." # todo: NEW TRANSLATION
 CHI_TAI_blockade_capability: "Připravenost k blokádě" # todo: NEW TRANSLATION
 CHI_TAI_blockade_capability_desc: "Po rozsáhlých simulačních cvičeních námořnictvo a pobřežní stráž PLA potvrzují plnou operační připravenost k vytvoření námořní uzavřené zóny kolem Tchaj-wanu. Ponorkové hlídky, hladinové hlídky a letecký průzkum lze aktivovat v krátké době." # todo: NEW TRANSLATION
 CHI_TAI_one_china_enforcement: "Prosazování jedné Číny" # todo: NEW TRANSLATION
 CHI_TAI_one_china_enforcement_desc: "Peking zahajuje systematickou diplomatickou kampaň s cílem odstranit zbývající formální uznání Tchaj-wanu. Velvyslanci jsou vysíláni s balíčky pomoci a infrastrukturními dohodami, zatímco na státy odmítající změnit svou loajalitu je vyvíjen ekonomický tlak." # todo: NEW TRANSLATION
 CHI_TAI_intl_org_blockade: "Blokáda mezinárodních organizací" # todo: NEW TRANSLATION
 CHI_TAI_intl_org_blockade_desc: "Čína využívá své stálé místo v Radě bezpečnosti OSN a rostoucí váhu v mnohostranných institucích k blokování účasti Tchaj-wanu v mezinárodních organizacích. Žádosti o status pozorovatele jsou vetovány a neformální kanály účasti uzavírány." # todo: NEW TRANSLATION
 CHI_TAI_intl_org_blockade_tt: "[TAI.GetNameWithFlag] získá dynamický modifikátor, který jej penalizuje podle úrovně mezinárodního uznání." # todo: NEW TRANSLATION
 CHI_TAI_intl_org_blockade_embargo_tt: "Každá země, která stále uznává [TAI.GetNameWithFlag], bude uvržena pod §Yobchodní embargo§!." # todo: NEW TRANSLATION
 CHI_TAI_economic_leverage: "Kampaň ekonomické páky" # todo: NEW TRANSLATION
 CHI_TAI_economic_leverage_desc: "Peking využívá své postavení největšího obchodního národa světa a uplatňuje cílený ekonomický tlak na americká odvětví a politické skupiny podporující Tchaj-wan. Kampaň využívá obchodní závislosti k oslabení politické vůle stojící za bezpečnostními zárukami USA." # todo: NEW TRANSLATION
 CHI_TAI_tourism_freeze: "Zmrazení turismu" # todo: NEW TRANSLATION
 CHI_TAI_tourism_freeze_desc: "Peking nařizuje cestovním kancelářím napojeným na stát pozastavit všechny skupinové i individuální zájezdy na Tchaj-wan a přerušuje příliv návštěvníků, který od otevření v éře ECFA roku 2008 výrazně vzrostl. Krok připravuje Tchaj-pej o devizové příjmy a příjmy ze spotřebních služeb, které vytvářel pevninský turismus, a mění ekonomickou integraci přes průliv v donucovací nástroj." # todo: NEW TRANSLATION
 CHI_TAI_lobby_network: "Lobbistická síť ve Washingtonu" # todo: NEW TRANSLATION
 CHI_TAI_lobby_network_desc: "Podnikatelské zájmy spojené s Čínou, think-tanky a političtí poradci zřizují ve Washingtonu trvalou přítomnost. Síť pracuje na formování názoru Kongresu na Tchaj-wan, blokování prodeje zbraní a podpoře angažmá s Pekingem." # todo: NEW TRANSLATION
 CHI_TAI_proxy_strategy: "Globální strategie zástupných konfliktů" # todo: NEW TRANSLATION
 CHI_TAI_proxy_strategy_desc: "Peking podporuje zástupné konflikty a regionální ohniska napětí, jejichž cílem je odvést americkou vojenskou pozornost a politický kapitál od Tchajwanského průlivu. Každá krize, která odvede americké síly jinam, snižuje důvěryhodnost závazků Washingtonu v Pacifiku." # todo: NEW TRANSLATION
 CHI_TAI_distract_america: "Rozptýlit Ameriku" # todo: NEW TRANSLATION
 CHI_TAI_distract_america_desc: "Zatímco jsou Spojené státy zapojeny do zámořských vojenských operací, Peking využívá přetížené zdroje a rozdělenou pozornost Washingtonu. Každé aktivní americké nasazení snižuje pravděpodobnost rychlé americké reakce na scénář v Tchajwanském průlivu." # todo: NEW TRANSLATION
