 CHI_xinjiang_uygur_autonomous_region: "Xinjiang Ujgurská Autonomní oblast" # todo: NEW TRANSLATION
 increase_research_funds: "Zvýšit výzkumné fondy" # todo: NEW TRANSLATION
 china_sar.013.t: "Obchodní rada prosazuje uvolnění napětí" # todo: NEW TRANSLATION
 china_sar.013.d: "Americko-čínská obchodní rada zveřejnila zprávu, která vyzývá Washington, aby dal přednost obchodní stabilitě před závazky v oblasti bezpečnosti Tchaj-wanu. Zpráva, formovaná naším úsilím o hospodářskou spolupráci, získala podporu v politických kruzích." # todo: NEW TRANSLATION
 china_sar.013.a: "Bereme na vědomí." # todo: NEW TRANSLATION
 china_sar.014.t: "Odhaleno vměšování do voleb" # todo: NEW TRANSLATION
 china_sar.014.d: "Americké zpravodajské služby veřejně připsaly operaci politického vlivu čínským státním aktérům. Skandál vyvolal v Kongresu rozhořčení napříč stranami a vlnu trestních opatření. Naše strategická pozice vůči Washingtonu utrpěla těžkou ránu." # todo: NEW TRANSLATION
 china_sar.014.a: "Nákladný chybný odhad." # todo: NEW TRANSLATION
 china_sar.015.t: "Mimořádné bezpečnostní zasedání" # todo: NEW TRANSLATION
 china_sar.015.d: "Čínské cvičení simulující blokádu v Tchajwanském průlivu vyvolalo mimořádné zasedání Rady národní bezpečnosti. Vojenští velitelé a členové vlády diskutují o vhodné reakci na sílící tlak Pekingu." # todo: NEW TRANSLATION
 china_sar.015.a: "Zvýšit vojenskou připravenost podél pobřeží." # todo: NEW TRANSLATION
 china_sar.015.b: "Požádat mezinárodní společenství o podporu." # todo: NEW TRANSLATION
 china_sar.016.t: "Výjimečný stav" # todo: NEW TRANSLATION
 china_sar.016.d: "Částečná blokáda trvá již dva měsíce, narušuje obchod a způsobuje nedostatek paliva a kriticky důležitých materiálů. Vláda čelí rostoucímu tlaku na vyhlášení oficiálního výjimečného stavu a uvedení ozbrojených sil do plné pohotovosti." # todo: NEW TRANSLATION
 china_sar.016.a: "Vyhlásit výjimečný stav." # todo: NEW TRANSLATION
 china_sar.016.b: "Usilovat o diplomatické řešení s Pekingem." # todo: NEW TRANSLATION
 china_sar.017.t: "Otázka kapitulace" # todo: NEW TRANSLATION
 china_sar.017.d: "Úplná námořní blokáda ochromila naše hospodářství a přerušila naše zásobovací linie. Vzhledem k faktickému stažení americké podpory někteří členové vlády potají otevírají možnost zahájit jednání s Pekingem za jeho podmínek." # todo: NEW TRANSLATION
 china_sar.017.a: "Nikdy se nevzdáme. Pokračovat v boji." # todo: NEW TRANSLATION
 china_sar.017.b: "Zahájit jednání s Pekingem." # todo: NEW TRANSLATION
 china_sar.018.t: "Tchaj-wan zahajuje jednání" # todo: NEW TRANSLATION
 china_sar.018.d: "Tchaj-pej vyslala do Pekingu delegaci s oprávněním projednat podmínky znovusjednocení. Blokáda, hospodářský kolaps a stažení americké podpory připravily ostrov o jakoukoli životaschopnou alternativu. Uzavírá se historická kapitola." # todo: NEW TRANSLATION
 china_sar.018.a: "Přijmout znovusjednocení vlasti." # todo: NEW TRANSLATION
 china_sar.019.t: "Krize v Tchajwanském průlivu" # todo: NEW TRANSLATION
 china_sar.019.d: "Napětí v Tchajwanském průlivu dosáhlo kritické hranice. Vojenské síly na obou stranách jsou v nejvyšší pohotovosti a jediný chybný odhad může rozpoutat otevřený konflikt. Stálý výbor politbyra svolává mimořádné zasedání, aby rozhodl o dalším kroku." # todo: NEW TRANSLATION
 china_sar.019.a: "Ustoupit z pokraje propasti. Zmírnit napětí." # todo: NEW TRANSLATION
 china_sar.019.b: "Pokračovat. Vydat oficiální válečný cíl." # todo: NEW TRANSLATION
 china_sar.020.t: "Ultimátum z Pekingu" # todo: NEW TRANSLATION
 china_sar.020.d: "Peking doručil oficiální ultimátum požadující přijetí znovusjednocení pod Čínskou lidovou republikou. Nesplnění požadavku povede k vojenské akci. Vláda musí rozhodnout, zda bude vzdorovat, nebo jednat." # todo: NEW TRANSLATION
 china_sar.020.a: "Odmítnout ultimátum. Připravit se na válku." # todo: NEW TRANSLATION
 china_sar.020.b: "Přijmout podmínky. Boj skončil." # todo: NEW TRANSLATION
 china_sar.021.t: "Tchaj-wan odmítá znovusjednocení" # todo: NEW TRANSLATION
 china_sar.021.d: "Tchaj-pej naše ultimátum oficiálně odmítla. Tchajwanská vláda prohlásila, že hodlá vzdorovat jakémukoli pokusu o vynucené znovusjednocení, a mobilizuje své ozbrojené síly. Cesta k mírovému řešení je uzavřena." # todo: NEW TRANSLATION
 china_sar.021.a: "Budiž. Připravit se na válku." # todo: NEW TRANSLATION
 china_sar.021.b: "Ostrov nestojí za naši flotilu. Odvolat ultimátum." # todo: NEW TRANSLATION
 china_sar.022.t: "Tchaj-wan přijímá znovusjednocení" # todo: NEW TRANSLATION
 china_sar.022.d: "Tchaj-pej přijala podmínky znovusjednocení. Čínská republika bude rozpuštěna a její území začleněno do Čínské lidové republiky. Desetiletí rozdělení napříč průlivem se chýlí ke konci." # todo: NEW TRANSLATION
 china_sar.022.a: "Vlast je opět jednotná." # todo: NEW TRANSLATION
 china_sar.023.t: "Čínský diplomatický tlak" # todo: NEW TRANSLATION
 china_sar.023.d: "Peking vydal oficiální požadavek, abychom stáhli uznání Tchaj-wanu. Čína nabízí za vyhovění hospodářské pobídky a za odmítnutí hrozí sankcemi. Naše pokračující uznávání Tchaj-peje se stalo nákladnou diplomatickou pozicí." # todo: NEW TRANSLATION
 china_sar.023.a: "Vyhovět. Stáhnout uznání Tchaj-wanu." # todo: NEW TRANSLATION
 china_sar.023.b: "Odmítnout. Budeme stát za svými závazky." # todo: NEW TRANSLATION
 china_sar.024.t: "Výsadkové cvičení v průlivu" # todo: NEW TRANSLATION
 china_sar.024.d: "Námořní pěchota CHLO provedla největší výsadkové cvičení v Tchajwanském průlivu, při němž simulovala útok na opevněné pobřeží. Cvičení vysílané státními médii vysílá Tchaj-peji i Washingtonu jednoznačný signál." # todo: NEW TRANSLATION
 china_sar.024.a: "Svět si toho všiml." # todo: NEW TRANSLATION
 china_sar.025.t: "Střet ohledně svobody plavby" # todo: NEW TRANSLATION
 china_sar.025.d: "Námořnictvo Spojených států vyslalo válečnou loď přes naši vyhlášenou námořní bezpečnostní zónu poblíž Tchaj-wanu. Plavidlo otevřeně vysílá svou přítomnost a vyzývá námořnictvo CHLO k reakci. Naše síly americkou loď sledují." # todo: NEW TRANSLATION
 china_sar.025.a: "Povolit průjezd. Vyhnout se přímému střetu." # todo: NEW TRANSLATION
 china_sar.025.b: "Sledovat a vyzvat americké plavidlo." # todo: NEW TRANSLATION
 china_sar.026.t: "Změna vedení USA" # todo: NEW TRANSLATION
 china_sar.026.d: "Změna amerického prezidenta změnila politické prostředí pro naši strategii vůči Tchaj-wanu. Postoj nové administrativy k vztahům napříč průlivem ovlivní míru podpory USA pro Tchaj-pej." # todo: NEW TRANSLATION
 china_sar.026.a: "Náležitě upravit naši strategii." # todo: NEW TRANSLATION
 USA_taiwan_defense_category: "Obrana Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_TAI_amphibious_exercise: "Výsadkové cvičení v průlivu" # todo: NEW TRANSLATION
 CHI_TAI_amphibious_exercise_desc: "Nařídit rozsáhlé výsadkové cvičení v Tchajwanském průlivu s cílem demonstrovat vojenské schopnosti a vyvíjet tlak na Tchaj-pej." # todo: NEW TRANSLATION
 CHI_TAI_adiz_incursion: "Narušení vzdušného identifikačního pásma" # todo: NEW TRANSLATION
 CHI_TAI_adiz_incursion_desc: "Vyslat stíhačky letectva CHLO do tchajwanské identifikační zóny protivzdušné obrany, otestovat reakční dobu a podkopat důvěru Tchaj-peje." # todo: NEW TRANSLATION
 CHI_TAI_rocket_test: "Zkouška balistické rakety" # todo: NEW TRANSLATION
 CHI_TAI_rocket_test_desc: "Provést zkoušku balistické rakety nad Tchajwanským průlivem. Reakce závisí na aktuální úrovni amerického závazku k obraně Tchaj-wanu." # todo: NEW TRANSLATION
 CHI_TAI_grey_zone_ops: "Operace v šedé zóně" # todo: NEW TRANSLATION
 CHI_TAI_grey_zone_ops_desc: "Provádět provokace nízké intenzity včetně narušování prostoru pobřežní stráží, nasazování rybářských flotil a průzkumů elektronického boje poblíž tchajwanských vod." # todo: NEW TRANSLATION
 CHI_TAI_blockade_simulation: "Cvičení simulující blokádu" # todo: NEW TRANSLATION
 CHI_TAI_blockade_simulation_desc: "Uspořádat rozsáhlé námořní cvičení simulující úplnou blokádu Tchaj-wanu, otestovat logistiku a demonstrovat schopnost přerušit zásobovací linie ostrova." # todo: NEW TRANSLATION
 CHI_TAI_cyberattack: "Kybernetický útok na Tchaj-wan" # todo: NEW TRANSLATION
 CHI_TAI_cyberattack_desc: "Zahájit koordinovanou kybernetickou operaci zaměřenou na tchajwanskou elektrickou síť, finanční systémy a vojenskou komunikaci." # todo: NEW TRANSLATION
 CHI_TAI_shadow_carrier: "Sledování americké skupiny letadlové lodi" # todo: NEW TRANSLATION
 CHI_TAI_shadow_carrier_desc: "Nasadit ponorky a hladinová bojová plavidla ke sledování americké úderné skupiny letadlové lodi operující poblíž Tchajwanského průlivu." # todo: NEW TRANSLATION
 CHI_TAI_intercept_aircraft: "Zachycení amerického průzkumu" # todo: NEW TRANSLATION
 CHI_TAI_intercept_aircraft_desc: "Vyslat stíhačky k zachycení a agresivnímu sledování amerických průzkumných letounů operujících poblíž průlivu." # todo: NEW TRANSLATION
 CHI_TAI_un_protest: "Protest u OSN proti prodeji zbraní" # todo: NEW TRANSLATION
 CHI_TAI_un_protest_desc: "Podat u Organizace spojených národů oficiální protest proti americkému prodeji zbraní Tchaj-wanu a vyvolat mezinárodní tlak na Washington." # todo: NEW TRANSLATION
 CHI_TAI_maritime_zone: "Vyhlásit námořní bezpečnostní zónu" # todo: NEW TRANSLATION
 CHI_TAI_maritime_zone_desc: "Vyhlásit námořní bezpečnostní zónu kolem klíčových přístupů k Tchaj-wanu a vytvořit právní záminku pro zadržování a kontrolu obchodní plavby." # todo: NEW TRANSLATION
 CHI_TAI_partial_blockade: "Částečná námořní blokáda" # todo: NEW TRANSLATION
 CHI_TAI_partial_blockade_desc: "Změnit námořní bezpečnostní zónu v částečnou námořní blokádu a omezit dodávky paliva a surovin na Tchaj-wan." # todo: NEW TRANSLATION
 CHI_TAI_full_blockade: "Úplná námořní blokáda" # todo: NEW TRANSLATION
 CHI_TAI_full_blockade_desc: "Uvalit na Tchaj-wan úplnou námořní blokádu a přerušit veškerý námořní obchod a zásobovací linie ostrova." # todo: NEW TRANSLATION
 CHI_TAI_full_blockade_active: "Úplná blokáda Tchaj-wanu probíhá" # todo: NEW TRANSLATION
 CHI_TAI_lift_full_blockade: "Ukončit úplnou blokádu" # todo: NEW TRANSLATION
 CHI_TAI_lift_full_blockade_desc: "Uvolnit obklíčení na úroveň částečné blokády. Tlak na Tchaj-pej poleví a Washingtonův poplach se zmírní, ale přístavy ostrova se znovu otevřou." # todo: NEW TRANSLATION
 CHI_TAI_influence_us_election: "Ovlivňovat volby v USA" # todo: NEW TRANSLATION
 CHI_TAI_influence_us_election_desc: "Nasadit skryté operace politického vlivu ve Spojených státech s cílem podpořit kandidáty nakloněné pekingskému postoji k Tchaj-wanu." # todo: NEW TRANSLATION
 CHI_TAI_support_houthis: "Podpora operací Húsiů" # todo: NEW TRANSLATION
 CHI_TAI_support_houthis_desc: "Poskytnout skrytou materiální podporu silám Húsiů v Jemenu a vytvořit bezpečnostní krizi, která odvede americké vojenské zdroje od Pacifiku." # todo: NEW TRANSLATION
 CHI_TAI_arm_iran: "Tajné dodávky zbraní Íránu" # todo: NEW TRANSLATION
 CHI_TAI_arm_iran_desc: "Prostřednictvím prostředníků předávat Íránu pokročilé vojenské technologie a zvýšit tlak na americké síly na Blízkém východě." # todo: NEW TRANSLATION
 CHI_TAI_scs_provocations: "Provokace v Jihočínském moři" # todo: NEW TRANSLATION
 CHI_TAI_scs_provocations_desc: "Prosazovat čínskou svrchovanost nad spornými oblastmi v Jihočínském moři militarizací ostrovů, obtěžováním konkurenčních žadatelů pobřežní stráží a rozšiřováním zón protivzdušné obrany. Tyto kroky nutí Spojené státy odklánět námořní prostředky k ujištění partnerů ASEAN." # todo: NEW TRANSLATION
 CHI_TAI_nk_provocations: "Podněcovat provokace Severní Koreje" # todo: NEW TRANSLATION
 CHI_TAI_nk_provocations_desc: "Naznačit Pchjongjangu, že zkoušky raket a vojenské provokace na Korejském poloostrově budou tolerovány, a přinutit Spojené státy přemístit síly z tchajwanského bojiště." # todo: NEW TRANSLATION
 CHI_TAI_middleeast_diversion: "Strategické angažmá na Blízkém východě" # todo: NEW TRANSLATION
 CHI_TAI_middleeast_diversion_desc: "Prohloubit vojenská a hospodářská partnerství na Blízkém východě, zvýšit regionální závislost na Pekingu a současně odvést americkou pozornost od indo-pacifického prostoru." # todo: NEW TRANSLATION
 CHI_TAI_support_russia: "Podpora ruských operací" # todo: NEW TRANSLATION
 CHI_TAI_support_russia_desc: "Poskytovat Rusku hospodářskou a logistickou podporu pro jeho vojenské operace a prodlužovat konflikt, který vyčerpává americkou pozornost a zdroje." # todo: NEW TRANSLATION
 CHI_TAI_strait_naval_exercise: "Námořní cvičení v Tchajwanském průlivu" # todo: NEW TRANSLATION
 CHI_TAI_strait_naval_exercise_desc: "Provést rozsáhlé námořní cvičení v Tchajwanském průlivu, procvičit operace obojživelného útoku a boj proti přístupu. Cvičení zlepší námořní připravenost, ale vyvolá mezinárodní odsouzení." # todo: NEW TRANSLATION
 CHI_TAI_fund_us_opposition: "Financování propekingského lobbingu v USA" # todo: NEW TRANSLATION
 CHI_TAI_fund_us_opposition_desc: "Prostřednictvím prostředníků poskytovat zdroje americkým politickým skupinám, think-tankům a médiím nakloněným pekingskému postoji k Tchaj-wanu. Odhalení by vyvolalo tvrdý protiúder." # todo: NEW TRANSLATION
 CHI_TAI_exploit_us_commitments: "Využít přetížení americké armády" # todo: NEW TRANSLATION
 CHI_TAI_exploit_us_commitments_desc: "Zatímco jsou Spojené státy zapojeny do vojenských operací v zahraničí, zintenzivnit diplomatický a vojenský tlak na Tchaj-wan. Americké síly jsou rozptýlené a nemohou věrohodně posílit Pacifik." # todo: NEW TRANSLATION
 USA_TAI_send_carrier: "Vyslat letadlovou loď do Tchajwanského průlivu" # todo: NEW TRANSLATION
 USA_TAI_send_carrier_desc: "Nařídit úderné skupině letadlové lodi proplout Tchajwanským průlivem jako demonstraci síly a potvrdit americký závazek k regionální stabilitě." # todo: NEW TRANSLATION
 USA_TAI_recon_flight: "Průzkumný let nad průlivem" # todo: NEW TRANSLATION
 USA_TAI_recon_flight_desc: "Vyslat průzkumné letouny ke sledování aktivity CHLO v Tchajwanském průlivu po čínských narušeních identifikační zóny." # todo: NEW TRANSLATION
 USA_TAI_arm_taiwan: "Nouzový balík zbraní pro Tchaj-wan" # todo: NEW TRANSLATION
 USA_TAI_arm_taiwan_desc: "Schválit nouzový balík zbraní pro tchajwanskou armádu v reakci na sílící čínské přípravy blokády." # todo: NEW TRANSLATION
 USA_TAI_fon_operation: "Operace svobody plavby" # todo: NEW TRANSLATION
 USA_TAI_fon_operation_desc: "Vyslat válečnou loď přes čínskou vyhlášenou námořní bezpečnostní zónu, potvrdit svobodu plavby a zpochybnit nároky Pekingu." # todo: NEW TRANSLATION
 USA_TAI_rimpac_exercise: "Námořní cvičení RIMPAC" # todo: NEW TRANSLATION
 USA_TAI_rimpac_exercise_desc: "Pozvat Tchaj-wan k účasti na každoročním námořním cvičení Rim of the Pacific, největším mezinárodním cvičení námořního boje na světě, a potvrdit americký závazek vůči regionálním partnerům." # todo: NEW TRANSLATION
 CHI_SAR_decisions_category: "Strategie jedné Číny" # todo: NEW TRANSLATION
 CHI_SAR_decisions_category_desc: "\n£GFX_CHI_commission_2\n\n\n\n§YStrategie jedné Číny§! představuje politiku Pekingu spočívající v konsolidaci všech nárokovaných území pod jediným čínským státem. Kombinací politického tlaku, hospodářského rozvoje a správní kontroly jsou regiony postupně uváděny do souladu s ústřední vládou.\n\nTento proces může mít různé podoby. Rostoucí §Ysinizace§! posiluje přímou kontrolu a integraci, zatímco autonomnější uspořádání upřednostňují místní stabilitu a hospodářský potenciál za cenu pravomocí ústřední vlády.\n\nRovnováha mezi těmito přístupy určí dlouhodobou jednotu státu, zatímco otázka §YTchaj-wanu§! zůstává utvářena mezinárodním uznáním, zahraniční podporou a napětím napříč průlivem.\n\n§YZvláštní administrativní oblasti Číny§!\n$HKG_sinicization$\n$MAC_sinicization$\n$TIB_sinicization$\n$ETK_sinicization$\n$OMG_sinicization$\n\n$CHI_TAI_trust_display$\n$CHI_taiwan_us_support_display$\n$CHI_taiwan_strait_tension_display$\n$CHI_taiwan_recognition_count_display$\n$uighur_threat_display$" # todo: NEW TRANSLATION
 CHI_pressure_derecognize_TAI: "Tlačit na [From.GetName], aby stáhl uznání Tchaj-wanu" # todo: NEW TRANSLATION
 CHI_pressure_derecognize_TAI_desc: "Peking vede vytrvalou diplomatickou kampaň s cílem omezit mezinárodní uznání Tchaj-wanu. [From.GetName] v současnosti udržuje s Tchaj-pejí oficiální vztahy. Kombinace hospodářských pobídek a hrozeb sankcemi může stačit k vynucení změny postoje." # todo: NEW TRANSLATION
 CHI_establish_education_centres: "Zřídit centra odborného vzdělávání v Sin-ťiangu" # todo: NEW TRANSLATION
 CHI_establish_education_centres_desc: "" # todo: NEW TRANSLATION
 CHI_calm_hong_kong_protests: "Obnovit pořádek v Hongkongu" # todo: NEW TRANSLATION
 CHI_calm_hong_kong_protests_desc: "Protesty vyvolané našimi volebními reformami nadále narušují fungování zvláštní administrativní oblasti. Vzhledem k přítomnosti bezpečnostních sil a stabilizující se situaci může ústřední vláda začít nepozorovaně ukončovat nepokoje a obnovovat běžný život v Hongkongu." # todo: NEW TRANSLATION
 CHI_MON_reunification_retry: "Opakovat nabídku znovusjednocení" # todo: NEW TRANSLATION
 CHI_MON_reunification_retry_desc: "Mongolsko naši předchozí nabídku odmítlo. Jakmile se diplomatické podmínky uklidní, můžeme znovu oslovit Ulánbátar." # todo: NEW TRANSLATION
 CHI_han_settlement_small: "Malý program přesídlení Chanů" # todo: NEW TRANSLATION
 CHI_han_settlement_small_desc: "Skromný státem podporovaný program přesouvá rodiny Chanů z hustě osídlených vnitrozemských provincií do nových měst v Nei Mongol, podporovaných pobídkami k zaměstnání a programy přidělování půdy." # todo: NEW TRANSLATION
 CHI_han_settlement_medium: "Středně velký program přesídlení Chanů" # todo: NEW TRANSLATION
 CHI_han_settlement_medium_desc: "Větší organizované přesídlovací úsilí přesouvá do Nei Mongol desítky tisíc chanských dělníků a jejich rodin. Nové průmyslové zóny a zemědělské parcely jsou určeny k přijetí příchozího obyvatelstva." # todo: NEW TRANSLATION
 CHI_han_settlement_large: "Masový program přesídlení Chanů" # todo: NEW TRANSLATION
 CHI_han_settlement_large_desc: "Rozsáhlá kampaň demografického inženýrství přesouvá v jediné koordinované vlně do Nei Mongol stovky tisíc chanských osadníků. Dlouhodobý dopad na etnické složení regionu je značný, ačkoli krátkodobý odpor prudce narůstá." # todo: NEW TRANSLATION
 CHI_HKG_patriotic_education_drive: "Kampaň vlasteneckého vzdělávání" # todo: NEW TRANSLATION
 CHI_HKG_patriotic_education_drive_desc: "Financovat učební osnovy občanské nauky a národní identity vytvořené na pevnině na všech dotovaných hongkongských školách, rozšířit výuku v putonghua a hradit učitelům studijní cesty do vnitrozemí. Náklady ponese Úřad pro vzdělávání a zavádění bude dostatečně pozvolné, aby se předešlo druhému odporu proti morální a národní výchově." # todo: NEW TRANSLATION
 CHI_HKG_liaison_office_expansion: "Rozšířit Úřad pro styk s ústřední vládou" # todo: NEW TRANSLATION
 CHI_HKG_liaison_office_expansion_desc: "Rozšířit Úřad pro styk s ústřední lidovou vládou a Úřad pro ochranu národní bezpečnosti, vyslat kádry z pevniny do hongkongské státní služby a dosadit prověřené kandidáty do prověřovacích komisí soudnictví. Správní kontrola rychle postupuje, ale každý viditelný zásah riskuje návrat davů do ulic." # todo: NEW TRANSLATION
 CHI_MAC_cross_border_administration: "Sjednotit přeshraniční správu" # todo: NEW TRANSLATION
 CHI_MAC_cross_border_administration_desc: "Uznat v Macau odborné kvalifikace a řidičské průkazy z pevniny, směrovat zúčtování v renminbi přes banky pod dohledem pevniny a sloučit celní odbavení na přechodech Gongbei a Most lotosového květu do jediného povolení. Území si zachová svůj statut, zatímco jeho správní aparát se přiblíží aparátu Kuang-tungu." # todo: NEW TRANSLATION
 CHI_MAC_hengqin_integration_zone: "Zóna hluboké spolupráce na Cheng-čchinu" # todo: NEW TRANSLATION
 CHI_MAC_hengqin_integration_zone_desc: "Rozšířit zónu hluboké spolupráce mezi Kuang-tungem a Macaem na ostrově Cheng-čchin: práva pobytu na pevnině pro pracovníky z Macaa, jednotný daňový a celní režim a přesun podniků navázaných na hazard přes vodu. Ču-chaj absorbuje růst a s ním i páky místní vlády." # todo: NEW TRANSLATION
 CHI_TIB_monastic_patriotic_education: "Vlastenecké vzdělávání v klášterech" # todo: NEW TRANSLATION
 CHI_TIB_monastic_patriotic_education_desc: "Umístit výbory demokratického řízení do každého registrovaného kláštera, vyžadovat po mniších a jeptiškách zkoušky ze státní náboženské politiky a omezit přijímání noviců. Instituce zůstanou otevřené a budou fungovat pod trvalým správním dohledem." # todo: NEW TRANSLATION
 CHI_TIB_village_cadre_teams: "Kádrové pracovní týmy na úrovni vesnic" # todo: NEW TRANSLATION
 CHI_TIB_village_cadre_teams_desc: "Umístit do každé správní vesnice stálý stranický pracovní tým, doplněný audity registrace domácností, dotovanou konsolidací bydlení a přesunem rozptýlených pasteveckých rodin do vybavených měst. Pronikání správy se stane úplným, stejně jako odpor, který vyvolá." # todo: NEW TRANSLATION
 CHI_ETK_bilingual_boarding_schools: "Systém dvojjazyčných internátních škol" # todo: NEW TRANSLATION
 CHI_ETK_bilingual_boarding_schools_desc: "Sloučit venkovské školství do internátních institucí s výukou v mandarínštině, jejichž učitelé budou přijímáni z vnitrozemských provincií. Ujgurština zůstane předmětem, nikoli vyučovacím jazykem, a celá generace bude vzdělávána mimo své domovské vesnice." # todo: NEW TRANSLATION
 CHI_ETK_labour_transfer_scheme: "Program přesunu přebytečné pracovní síly" # todo: NEW TRANSLATION
 CHI_ETK_labour_transfer_scheme_desc: "Přidělovat ujgurské venkovské pracovníky do pobřežních továren a regionálních průmyslových parků podle organizovaných přesídlovacích kvót a činit vesnické kádry odpovědnými za náborové cíle. Příjmy domácností vzrostou a komunitní vazby zeslábnou, avšak program bude jasně viditelný zahraničním auditorům sledujícím dodavatelské řetězce." # todo: NEW TRANSLATION
 CHI_OMG_mandarin_curriculum_rollout: "Zavedení jednotných učebních osnov" # todo: NEW TRANSLATION
 CHI_OMG_mandarin_curriculum_rollout_desc: "Nahradit učebnice politiky, dějepisu a jazyka v mongolštině národní jednotnou řadou a odpovídajícím způsobem přeškolit učitelský sbor. Opatření bude prezentováno jako zajištění rovných příležitostí a zavedeno dostatečně pomalu, aby pastevecké okresy zůstaly klidné." # todo: NEW TRANSLATION
 CHI_OMG_pastoral_sedentarisation: "Program usazování pastevců" # todo: NEW TRANSLATION
 CHI_OMG_pastoral_sedentarisation_desc: "Prosadit zákaz pastvy na znehodnocené stepi, odškodnit pastevecké rodiny za odevzdaná stáda a přesídlit je do dotovaných městských bytů s odbornou rekvalifikací. Kočovný pastevecký způsob života ustoupí námezdní práci a s ním zmizí i společenský základ mongolské odlišnosti." # todo: NEW TRANSLATION
 CHI_lenovo_enterprise_server_platform_desc: "Stolní počítače, notebooky i servery, které je pohánějí, vyrábí jedna společnost, která koupila každý podnik poté, co se ho předchozí majitel vzdal. Marže, které prodejci nedokázali najít, se objeví, jakmile výroba dosáhne velkého měřítka." # todo: NEW TRANSLATION
 CHI_lenovo_global_pc_platform: "Globální výrobce" # todo: NEW TRANSLATION
 CHI_lenovo_global_pc_platform_desc: "Z čínských výrobních linek putuje pod jednou značkou více osobních počítačů než od kohokoli jiného. Je to komoditní podnik s nízkými maržemi a objem výroby nemá žádného realistického vyzyvatele." # todo: NEW TRANSLATION
 CHI_lenovo_strategic_bridge: "Strategický most" # todo: NEW TRANSLATION
 CHI_lenovo_strategic_bridge_desc: "Čínská výroba proniká na trhy, které by odmítly čínského vlastníka, protože tyto podniky mají místní partnery a místní názvy. Kontrola je sdílená a dveře zůstávají otevřené." # todo: NEW TRANSLATION
 CHI_lenovo_domestic_champion: "Domácí šampion" # todo: NEW TRANSLATION
 CHI_lenovo_domestic_champion_desc: "Společnost vyrostla na tom, co sama vybudovala, nikoli na tom, co koupila, a zodpovídá se Pekingu, ne zahraničním akcionářům. Její dosah je menší a nic na ní nezávisí na svolení někoho jiného." # todo: NEW TRANSLATION
 CHI_semiconductor_events.320.t: "Polovina Tencentu za třicet dva milionů" # todo: NEW TRANSLATION
 CHI_semiconductor_events.320.d: "Tencent pálí hotovost na messengeru, který nikdo nepoužívá placeně, a žádný čínský investor ho nechce financovat. MIH, jihoafrická mediální skupina, nabízí třicet dva milionů dolarů za 46,5 procenta a ponechá Ponyho Ma v čele společnosti. Alternativou jsou domácí peníze za podmínek stanovených v Pekingu." # todo: NEW TRANSLATION
 CHI_semiconductor_events.320.a: "Prodat podíl MIH" # todo: NEW TRANSLATION
 CHI_semiconductor_events.320.b: "Získat peníze doma" # todo: NEW TRANSLATION
 CHI_semiconductor_events.321.t: "Tencent vstupuje na hongkongskou burzu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.321.d: "Tencent může uvést své akcie na hongkongské burze a získat zahraniční kapitál na základě uživatelské základny, jejíž hodnotu dosud žádný trh neocenil. Emise financuje vše, co přijde potom. Zároveň však každý kvartál vystavuje účty čínské messagingové společnosti všem, kdo si je chtějí přečíst." # todo: NEW TRANSLATION
 CHI_semiconductor_events.321.a: "Vstoupit na hongkongskou burzu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.321.b: "Zůstat soukromí a růst z cash flow" # todo: NEW TRANSLATION
 CHI_semiconductor_events.322.t: "Weixin" # todo: NEW TRANSLATION
 CHI_semiconductor_events.322.d: "Tým Tencentu v Kantonu, koupený kvůli jeho poštovnímu produktu, chce vytvořit mobilní messenger, který by přímo konkuroval QQ. QQ je podnik, na němž stojí celá společnost. Podpora týmu znamená financovat vlastního konkurenta; odmítnutí ponechá QQ, aby se se smartphonem vypořádalo po svém." # todo: NEW TRANSLATION
 CHI_semiconductor_events.322.a: "Nechat kantonský tým jej vybudovat" # todo: NEW TRANSLATION
 CHI_semiconductor_events.322.b: "Bránit QQ na mobilních telefonech" # todo: NEW TRANSLATION
 CHI_semiconductor_events.323.t: "Supercell" # todo: NEW TRANSLATION
 CHI_semiconductor_events.323.d: "Tencent může zaplatit 8,6 miliardy dolarů za kontrolu nad Supercell, finským studiem stojícím za hrou Clash of Clans, a vlastnit hry místo jejich licencování pro Čínu. Jde o nejvyšší částku, jakou kdy čínská společnost zaplatila za herní podnik. Publikování cizích titulů nic nestojí a vydělává jen zlomek této částky." # todo: NEW TRANSLATION
 CHI_semiconductor_events.323.a: "Koupit studio celé" # todo: NEW TRANSLATION
 CHI_semiconductor_events.323.b: "Licencovat a publikovat hry jiných" # todo: NEW TRANSLATION
 CHI_semiconductor_events.324.t: "Zmrazení licencí" # todo: NEW TRANSLATION
 CHI_semiconductor_events.324.d: "Regulátoři přestali schvalovat nové herní licence a neříkají, kdy v tom budou pokračovat, zatímco příjmy Tencentu závisejí na titulech, které nemůže legálně uvést. Tržní hodnota se propadla přibližně o dvě stě miliard dolarů. Vybudování kontrolního aparátu, který stát požaduje, je pomalé a drahé; přesměrování podnikání přes zahraniční trhy nikoli." # todo: NEW TRANSLATION
 CHI_semiconductor_events.324.a: "Vybudovat, co regulátor požaduje" # todo: NEW TRANSLATION
 CHI_semiconductor_events.324.b: "Přesměrovat příjmy přes zahraniční trhy" # todo: NEW TRANSLATION
 CHI_semiconductor_events.325.t: "Čím se Tencent stal" # todo: NEW TRANSLATION
 CHI_semiconductor_events.325.d: "Pětadvacet let rozhodování o tom, kdo Tencent financuje, co vlastní v zahraničí a jak hluboko se podřídí regulátorovi, určilo podobu čínského spotřebitelského internetu." # todo: NEW TRANSLATION
 CHI_semiconductor_events.325.a: "Globální platformový konglomerát" # todo: NEW TRANSLATION
 CHI_semiconductor_events.325.b: "Domácí superaplikace" # todo: NEW TRANSLATION
 CHI_semiconductor_events.325.c: "Licencovaný vydavatel her" # todo: NEW TRANSLATION
 CHI_semiconductor_events.325.e: "Nezávislá messagingová skupina" # todo: NEW TRANSLATION
 CHI_tencent_global_platform_conglomerate: "Globální platformový konglomerát" # todo: NEW TRANSLATION
 CHI_tencent_global_platform_conglomerate_desc: "Tencent vlastní studia, platební sítě a messaging na čtyřech kontinentech a většinu toho, co vydělává v zahraničí, získal koupí, nikoli vybudováním. Hodnota podílů odpovídá tomu, jak ji oceňují trhy." # todo: NEW TRANSLATION
 CHI_tencent_domestic_superapp: "Domácí superaplikace" # todo: NEW TRANSLATION
 CHI_tencent_domestic_superapp_desc: "Messaging, platby, doprava i státní služby běží přes jedinou aplikaci na infrastruktuře uvnitř Číny. Tencent přestal být společností, kterou lidé používají, a stal se vrstvou, na níž je postaveno všechno ostatní." # todo: NEW TRANSLATION
 CHI_tencent_licensed_games_publisher: "Licencovaný vydavatel her" # todo: NEW TRANSLATION
 CHI_tencent_licensed_games_publisher_desc: "Tencent uvádí tituly, které regulátor schválí, podle harmonogramu, který regulátor stanoví, a schválení přicházejí proto, že kontrolní aparát byl vybudován ještě předtím, než byl vyžadován. Je to menší, ale stabilní podnik." # todo: NEW TRANSLATION
 CHI_tencent_independent_messaging: "Nezávislá messagingová skupina" # todo: NEW TRANSLATION
 CHI_tencent_independent_messaging_desc: "Tencent si ponechal QQ, své inženýry i odstup od sporů, které pohltily zbytek čínského internetu. Jeho dosah nikdy nepřekročil hranice messengeru." # todo: NEW TRANSLATION
 CHI_semiconductor_events.330.t: "Dvacet milionů z Tokia" # todo: NEW TRANSLATION
 CHI_semiconductor_events.330.d: "Masajoši Son nabídl Alibabě dvacet milionů dolarů po schůzce trvající několik minut a SoftBank chce velký podíl ve společnosti bez příjmů. Jack Ma může přijmout japonské peníze i otázku vlastnictví, která s nimi přichází. Nebo může začít účtovat vývozcům na stránce už nyní, zatímco se stále učí, k čemu slouží." # todo: NEW TRANSLATION
 CHI_semiconductor_events.330.a: "Přijmout peníze od SoftBank" # todo: NEW TRANSLATION
 CHI_semiconductor_events.330.b: "Účtovat obchodníkům a financovat se sami" # todo: NEW TRANSLATION
 CHI_semiconductor_events.331.t: "Taobao proti eBay" # todo: NEW TRANSLATION
 CHI_semiconductor_events.331.d: "eBay vlastní EachNet a s ním většinu spotřebitelského obchodování v Číně a trhu oznámila, že soutěž je u konce. Alibaba může umístit tým do bytu v Chang-čou a vybudovat konkurenta, který nebude prodejcům účtovat nic, a to tak dlouho, jak bude třeba. Setrvání v obchodování mezi podniky je ziskové, ale spotřebitelský trh navždy přenechá konkurenci." # todo: NEW TRANSLATION
 CHI_semiconductor_events.331.a: "Vybudovat Taobao a nic neúčtovat prodejcům" # todo: NEW TRANSLATION
 CHI_semiconductor_events.331.b: "Udržet obchodování mezi podniky" # todo: NEW TRANSLATION
 CHI_semiconductor_events.332.t: "Yahoo miliarda" # todo: NEW TRANSLATION
 CHI_semiconductor_events.332.d: "Yahoo zaplatí miliardu dolarů a předá svou čínskou operaci za čtyřicet procent Alibaby, což je největší zahraniční investice, jaká kdy byla do čínské internetové společnosti vložena. Peníze vyřeší otázku financování na celé desetiletí. Zároveň však do čela společnosti, která řídí obchod země, přivedou zahraniční místo v představenstvu." # todo: NEW TRANSLATION
 CHI_semiconductor_events.332.a: "Přijmout miliardu i místo v představenstvu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.332.b: "Ponechat vlastnickou evidenci čínskou" # todo: NEW TRANSLATION
 CHI_semiconductor_events.333.t: "Alipay opouští skupinu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.333.d: "Centrální banka bude udělovat licence provozovatelům plateb pouze v domácích rukou a Alipay byl převeden do společnosti ovládané Jackem Ma, aniž by to bylo předloženo představenstvu Alibaby. Ředitelé se o tom dozvěděli až poté. Zvrácení převodu znamená hádat se o licenci s regulátorem, zatímco platební podnik Alibaby zůstane zmrazený." # todo: NEW TRANSLATION
 CHI_semiconductor_events.333.a: "Ponechat převod a vypořádat se s akcionáři" # todo: NEW TRANSLATION
 CHI_semiconductor_events.333.b: "Zvrátit jej a vyjednat licenci" # todo: NEW TRANSLATION
 CHI_semiconductor_events.334.t: "Emise Ant je zastavena" # todo: NEW TRANSLATION
 CHI_semiconductor_events.334.d: "Emise skupiny Ant, dosud největší zamýšlená, byla pozastavena dva dny před zahájením obchodování poté, co Jack Ma šanghajskému publiku řekl, že regulátoři provozují zastavárnu. Alibaba může ustoupit a přebudovat Ant na dozorovanou finanční holdingovou společnost. Pokračování znamená otestovat, zda stát dovolí soukromé firmě držet tak velkou část čínského úvěru." # todo: NEW TRANSLATION
 CHI_semiconductor_events.334.a: "Ustoupit a přijmout dohled" # todo: NEW TRANSLATION
 CHI_semiconductor_events.334.b: "Tlačit na uskutečnění emise" # todo: NEW TRANSLATION
 CHI_semiconductor_events.335.t: "Čím se Alibaba stala" # todo: NEW TRANSLATION
 CHI_semiconductor_events.335.d: "Čtvrt století rozhodování o zahraničním kapitálu, spotřebitelském obchodu a o tom, jak velkou část čínských financí může držet jedna soukromá společnost, určilo podobu Alibaby." # todo: NEW TRANSLATION
 CHI_semiconductor_events.335.a: "Dozorovaná páteř obchodu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.335.b: "Otevřené spotřebitelské tržiště" # todo: NEW TRANSLATION
 CHI_semiconductor_events.335.c: "Obchodní dům financovaný zahraničním kapitálem" # todo: NEW TRANSLATION
 CHI_semiconductor_events.335.e: "Velkoobchodní zprostředkovatel vývozu" # todo: NEW TRANSLATION
 CHI_alibaba_supervised_commerce_backbone: "Dozorovaná páteř obchodu" # todo: NEW TRANSLATION
 CHI_alibaba_supervised_commerce_backbone_desc: "Sklady, doručovací sítě a datová centra uvnitř Číny přepravují většinu toho, co země nakupuje, a nad úvěrem, který jimi proudí, bdí regulátor. Alibaba se přestala přít o tom, kdo nad ní vykonává dohled, a vybudovala něco, co nelze nahradit." # todo: NEW TRANSLATION
 CHI_alibaba_open_consumer_marketplace: "Otevřené spotřebitelské tržiště" # todo: NEW TRANSLATION
 CHI_alibaba_open_consumer_marketplace_desc: "Kdokoli může vystavit nabídku a platforma si vezme podíl z toho, co se prodá. Alibaba nikdy nepřijala dohled nad svou finanční divizí a toto uspořádání trvá, dokud na něm nikdo netrvá." # todo: NEW TRANSLATION
 CHI_alibaba_foreign_capitalised_trading_house: "Obchodní dům financovaný zahraničním kapitálem" # todo: NEW TRANSLATION
 CHI_alibaba_foreign_capitalised_trading_house_desc: "Alibaba řídí obchod a zahraniční akcionáři řídí vlastnickou evidenci. Kapitál dosáhl dál než samotné podnikání." # todo: NEW TRANSLATION
 CHI_alibaba_wholesale_export_broker: "Velkoobchodní zprostředkovatel vývozu" # todo: NEW TRANSLATION
 CHI_alibaba_wholesale_export_broker_desc: "Alibaba spojuje čínské továrny se zahraničními kupci a za zprostředkování si účtuje poplatek. Spotřebitelského trhu se nikdy nedotkla a k pokračování nikdy nepotřebovala ničí svolení." # todo: NEW TRANSLATION
 CHI_semiconductor_events.340.t: "Toutiao nemá editory" # todo: NEW TRANSLATION
 CHI_semiconductor_events.340.d: "Zpravodajská aplikace ByteDance řadí články podle toho, co čtenáři otevírají, nikoli podle volby editora, a Čang I-ming nad ní nechce žádnou redakci. Stroj najde publikum rychleji než jakákoli redakce. Zároveň mu naservíruje cokoli, na co toto publikum bude dál klikat, a někdo se nakonec zeptá, kdo o tom rozhodl." # todo: NEW TRANSLATION
 CHI_semiconductor_events.340.a: "Nechat rozhodovat systém řazení" # todo: NEW TRANSLATION
 CHI_semiconductor_events.340.b: "Postavit nad kanál redakci" # todo: NEW TRANSLATION
 CHI_semiconductor_events.341.t: "Douyin" # todo: NEW TRANSLATION
 CHI_semiconductor_events.341.d: "ByteDance může stejný systém řazení postavit za patnáctisekundová videa a nechat jej rozhodovat, co cizí člověk uvidí jako další. Nic v tomto modelu nebylo vytvořeno pro nic jiného než text. Ponechat jej u zpráv je podnikání, které už funguje." # todo: NEW TRANSLATION
 CHI_semiconductor_events.341.a: "Postavit systém řazení za krátká videa" # todo: NEW TRANSLATION
 CHI_semiconductor_events.341.b: "Ponechat jej u zpráv a textu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.342.t: "Čang I-ming se omlouvá" # todo: NEW TRANSLATION
 CHI_semiconductor_events.342.d: "Regulátoři natrvalo uzavřeli Neihan Duanzi a stáhli Toutiao z obchodů s aplikacemi s tím, že algoritmus ByteDance předběhl socialistické základní hodnoty. Čang I-ming může zveřejnit sebekritiku a najmout tisíce kontrolorů, které stát očekává. Napadnout příkaz znamená tvrdit, že výstup stroje není projevem společnosti." # todo: NEW TRANSLATION
 CHI_semiconductor_events.342.a: "Zveřejnit omluvu a najmout kontrolory" # todo: NEW TRANSLATION
 CHI_semiconductor_events.342.b: "Napadnout příkaz" # todo: NEW TRANSLATION
 CHI_semiconductor_events.343.t: "Prodat TikTok, nebo o něj přijít" # todo: NEW TRANSLATION
 CHI_semiconductor_events.343.d: "Washington nařídil ByteDance prodat americkou část TikToku a Oracle s Walmartem během několika týdnů sestavily nabídku. Peking právě přidal doporučovací algoritmy na seznam vývozních kontrol, takže model nemůže opustit zemi bez licence. ByteDance může odmítnout jeho vývoz a přijít o americký trh, nebo předat technologii spolu se společností." # todo: NEW TRANSLATION
 CHI_semiconductor_events.343.a: "Odmítnout vývoz algoritmu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.343.b: "Prodat americkou část i s technologií" # todo: NEW TRANSLATION
 CHI_semiconductor_events.344.t: "Oddělit, nebo čelit zákazu" # todo: NEW TRANSLATION
 CHI_semiconductor_events.344.d: "Kongres dal ByteDance méně než rok na prodej amerických operací TikToku, jinak aplikace zmizí z obchodů, a soudy jsou jedinou zbývající cestou. Soudní spor udrží společnost pohromadě za značné náklady a přesto může selhat. Oddělení americké části ukončí spor i s ním spojené vlastnictví." # todo: NEW TRANSLATION
 CHI_semiconductor_events.344.a: "Vést soudní spor a udržet společnost pohromadě" # todo: NEW TRANSLATION
 CHI_semiconductor_events.344.b: "Oddělit americkou část" # todo: NEW TRANSLATION
 CHI_semiconductor_events.345.t: "Čím se ByteDance stal" # todo: NEW TRANSLATION
 CHI_semiconductor_events.345.d: "Čtrnáct let rozhodování o tom, kdo řadí obsah, kdo jej kontroluje a zda model smí opustit Čínu, určilo podobu ByteDance." # todo: NEW TRANSLATION
 CHI_semiconductor_events.345.a: "Suverénní doporučovací engine" # todo: NEW TRANSLATION
 CHI_semiconductor_events.345.b: "Globální platforma pozornosti" # todo: NEW TRANSLATION
 CHI_semiconductor_events.345.c: "Licencovaná informační služba" # todo: NEW TRANSLATION
 CHI_semiconductor_events.345.e: "Redakční zpravodajská skupina" # todo: NEW TRANSLATION
 CHI_bytedance_sovereign_recommendation_engine: "Suverénní doporučovací engine" # todo: NEW TRANSLATION
 CHI_bytedance_sovereign_recommendation_engine_desc: "Model, který rozhoduje, co dalšího uvidí miliarda lidí, byl vytrénován v Číně, běží v Číně a bez licence jej nelze vyvézt. ByteDance se vzdal amerického trhu, místo aby odvezl parametry modelu." # todo: NEW TRANSLATION
 CHI_bytedance_global_attention_platform: "Globální platforma pozornosti" # todo: NEW TRANSLATION
 CHI_bytedance_global_attention_platform_desc: "ByteDance dosáhl dál než kterákoli čínská společnost před ním, ale za podmínek, které zahraniční vlády kdykoli znovu vyjednají. Publikum je skutečné, svolení nikoli trvalé." # todo: NEW TRANSLATION
 CHI_bytedance_licensed_information_utility: "Licencovaná informační služba" # todo: NEW TRANSLATION
 CHI_bytedance_licensed_information_utility_desc: "ByteDance řadí to, k čemu má licenci, a vše před doručením kontroluje. Regulátor jej přestal považovat za problém." # todo: NEW TRANSLATION
 CHI_bytedance_editorial_news_group: "Redakční zpravodajská skupina" # todo: NEW TRANSLATION
 CHI_bytedance_editorial_news_group_desc: "ByteDance ponechal nad kanálem redakci a nikdy nevybudoval video platformu. Zveřejňuje zprávy a spory o tom, kdo zvolil pořadí, nikdy nepřišly." # todo: NEW TRANSLATION
 CHI_ernie_national_champion_decision: "Označit Ernie za národní model" # todo: NEW TRANSLATION
 CHI_ernie_national_champion_decision_desc: "Určit model Baidu jako referenční systém pro státní a provinční nasazení. Prvenství se stane oficiálním postavením a ministerstva získají jednu architekturu k certifikaci namísto šesti.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_ernie_consumer_search_decision: "Začlenit Ernie do vyhledávání" # todo: NEW TRANSLATION
 CHI_ernie_consumer_search_decision_desc: "Ponechat model tam, kde uživatelé jsou, místo honby za podnikovými smlouvami. Distribuce je okamžitá a příjmy skutečné, za cenu ztráty role při stanovování standardů.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_qwen_open_ecosystem_decision: "Podpořit Qwen jako otevřenou platformu" # todo: NEW TRANSLATION
 CHI_qwen_open_ecosystem_decision_desc: "Podpořit zveřejnění parametrů modelu a umožnit domácímu ekosystému na nich stavět. Každý navazující vývojář se stane závislým na čínské infrastruktuře, což má časem větší cenu než licenční příjmy.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_qwen_cloud_captive_decision: "Připoutat Qwen ke cloudovému podnikání" # todo: NEW TRANSLATION
 CHI_qwen_cloud_captive_decision_desc: "Ponechat špičkové modely uvnitř Alibaba Cloud jako důvod k pronájmu výpočetního výkonu. Marže zůstanou platformě, stejně jako vliv.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_zhipu_academic_pipeline_decision: "Financovat univerzitní výzkumný program" # todo: NEW TRANSLATION
 CHI_zhipu_academic_pipeline_decision_desc: "Považovat laboratoř za výcvikové hřiště pro příští generaci výzkumníků, nikoli za produktovou společnost. Pomalejší vstup na trh, ale kumulativní přínos.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_zhipu_state_procurement_decision: "Začlenit Zhipu do státních zakázek" # todo: NEW TRANSLATION
 CHI_zhipu_state_procurement_decision_desc: "Zaručit poptávku prostřednictvím ministerských a provinčních smluv. Laboratoř nikdy nemusí hledat trh a nikdy se mu také nemusí zodpovídat.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_doubao_consumer_scale_decision: "Rozšířit Doubao na masový trh" # todo: NEW TRANSLATION
 CHI_doubao_consumer_scale_decision_desc: "Předložit asistenta stovkám milionů uživatelů za cenu, které nikdo nemůže konkurovat. Měřítkem je rozšíření a cenou účet za výpočetní výkon.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_doubao_recommendation_core_decision: "Ponechat Doubao uvnitř doporučovacího systému" # todo: NEW TRANSLATION
 CHI_doubao_recommendation_core_decision_desc: "Vrátit výzkum do systémů řazení a doporučování, které už vydělávají. Méně viditelné než spotřebitelský asistent, ale podstatně ziskovější.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_deepseek_open_weight_release_decision: "Zveřejnit parametry DeepSeek" # todo: NEW TRANSLATION
 CHI_deepseek_open_weight_release_decision_desc: "Otevřeně zveřejnit model špičkové úrovně a nechat zbytek světa stavět na čínském výzkumu. Vývozní kontroly měly odepřít výpočetní výkon; zveřejnění mění omezení ve spor o to, kdo určuje podmínky.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_deepseek_state_aligned_lab_decision: "Zapojit DeepSeek do státního úsilí" # todo: NEW TRANSLATION
 CHI_deepseek_state_aligned_lab_decision_desc: "Začlenit laboratoř do národního programu s financováním a dohledem, které s tím přicházejí. Práce na efektivitě pokračuje pod dohledem a přestává být dostupná komukoli jinému.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_moonshot_long_context_decision: "Podpořit sázku na dlouhý kontext" # todo: NEW TRANSLATION
 CHI_moonshot_long_context_decision_desc: "Financovat vývoj délek kontextu, které nikdo jiný nenabízí. Úzká sázka na jednu schopnost; první laboratoř, která ji zvládne, ovládne celou kategorii.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_moonshot_enterprise_pivot_decision: "Zaměřit Moonshot na podniky" # todo: NEW TRANSLATION
 CHI_moonshot_enterprise_pivot_decision_desc: "Vyměnit závod o spotřebitele za nasazení na základě smluv s předvídatelnými příjmy. Hodnota přestane růst a rozvaha přestane krvácet.\n\n§YVýsledný národní duch trvá 365 dní. Aktivní může být vždy pouze jeden program laboratoře AI.§!" # todo: NEW TRANSLATION
 CHI_ernie_national_champion: "Národní referenční model" # todo: NEW TRANSLATION
 CHI_ernie_national_champion_desc: "Jedna certifikovaná architektura běží napříč ministerstvy, provinciemi a státními podniky. Nákup je jednodušší, standardy jsou čínské a zavedený hráč má jen malý důvod postupovat rychle." # todo: NEW TRANSLATION
 CHI_ernie_consumer_search: "Asistent integrovaný do vyhledávání" # todo: NEW TRANSLATION
 CHI_ernie_consumer_search_desc: "Model se ke svým uživatelům dostává prostřednictvím vyhledávacího produktu, nikoli obchodního týmu. Příjmy přicházejí okamžitě a roli při stanovování standardů získá někdo jiný." # todo: NEW TRANSLATION
 CHI_qwen_open_ecosystem: "Ekosystém otevřených parametrů" # todo: NEW TRANSLATION
 CHI_qwen_open_ecosystem_desc: "Zveřejněné parametry proměnily platformu v něco, na čem svět staví, místo aby si to licencoval. Přímé příjmy jsou nižší a závislost proudí správným směrem." # todo: NEW TRANSLATION
 CHI_qwen_cloud_captive: "Špičkový model připoutaný ke cloudu" # todo: NEW TRANSLATION
 CHI_qwen_cloud_captive_desc: "Nejlepší modely jsou důvodem k pronájmu výpočetního výkonu a nikde jinde neběží. Marže i vyjednávací síla zůstávají platformě." # todo: NEW TRANSLATION
 CHI_zhipu_academic_pipeline: "Akademický výzkumný program" # todo: NEW TRANSLATION
 CHI_zhipu_academic_pipeline_desc: "Laboratoř vychovává výzkumníky stejně jako trénuje modely a univerzita nadále dodává obojí. Komerční výstup je skromný, talentová základna nikoli." # todo: NEW TRANSLATION
 CHI_zhipu_state_procurement: "Laboratoř státních zakázek" # todo: NEW TRANSLATION
 CHI_zhipu_state_procurement_desc: "Ministerské smlouvy zaručují poptávku a určují směr. Financování je stabilní, stejně jako absence konkurenčního tlaku." # todo: NEW TRANSLATION
 CHI_doubao_consumer_scale: "Masové spotřebitelské nasazení" # todo: NEW TRANSLATION
 CHI_doubao_consumer_scale_desc: "Stovky milionů každodenních uživatelů za cenu, která vytlačuje konkurenci. Rozšíření nemá obdoby a účet za inference je obrovský." # todo: NEW TRANSLATION
 CHI_doubao_recommendation_core: "Jádro doporučování" # todo: NEW TRANSLATION
 CHI_doubao_recommendation_core_desc: "Výzkum zásobuje systémy řazení, které už tisknou peníze, místo aby poháněl samostatného asistenta. Neokázalé, ale výnosy přicházejí okamžitě." # todo: NEW TRANSLATION
 CHI_deepseek_open_weight_release: "Otevřené zveřejnění špičkového modelu" # todo: NEW TRANSLATION
 CHI_deepseek_open_weight_release_desc: "Model špičkové úrovně zveřejněný otevřeně a vytrénovaný za zlomek nákladů zavedených hráčů. Argument o efektivitě cestuje dál než samotný model." # todo: NEW TRANSLATION
 CHI_deepseek_state_aligned_lab: "Státem sladěná laboratoř špičkových modelů" # todo: NEW TRANSLATION
 CHI_deepseek_state_aligned_lab_desc: "Výzkum efektivity pokračuje s národním financováním a národním dohledem. Schopnosti se dál kumulují a výsledky přestávají být veřejné." # todo: NEW TRANSLATION
 CHI_moonshot_long_context: "Specialista na dlouhý kontext" # todo: NEW TRANSLATION
 CHI_moonshot_long_context_desc: "Promyšlená sázka na podporu délek kontextu, které zbytek oboru nedokáže nabídnout. Úzké zaměření, ale v místě úspěchu bez konkurence." # todo: NEW TRANSLATION
 CHI_moonshot_enterprise_pivot: "Podniková implementační praxe" # todo: NEW TRANSLATION
 CHI_moonshot_enterprise_pivot_desc: "Závod o spotřebitele nahradila nasazení na základě smluv. Růst je pomalejší, příjmy předvídatelné a laboratoř přežije období nedostatku financování." # todo: NEW TRANSLATION
 CHI_ai_lab_treasury_15_tt: "Má v pokladních rezervách více než §Y15 miliard§!" # todo: NEW TRANSLATION
 CHI_ai_lab_treasury_20_tt: "Má v pokladních rezervách více než §Y20 miliard§!" # todo: NEW TRANSLATION
