 no_foreign_reserve: "Domácí rezerva" # todo: NEW TRANSLATION
 no_foreign_reserve_desc: "Tento národ drží své rezervy v domácí měně namísto zahraničního standardu. Zachovává si plnou měnovou suverenitu a izoluje se od vnějších kurzových otřesů, vzdává se však přístupu k likviditním sítím a mezinárodním úvěrovým zařízením spojeným s hlavními rezervními měnami." # todo: NEW TRANSLATION
 currency_strength_modifier: "Síla měny" # todo: NEW TRANSLATION
 reserve_roi_bonus: "Návratnost rezervní měny" # todo: NEW TRANSLATION
 reserve_roi_bonus_desc: "Dodatečná návratnost investic z držení silné zahraniční rezervní měny. Měsíčně se mění v závislosti na síle měny emitenta a velikosti jeho sítě uživatelů. Oslabení ekonomiky emitenta tento bonus snižuje." # todo: NEW TRANSLATION
 reserve_trade_bonus: "Obchodní sladění rezervní měny" # todo: NEW TRANSLATION
 reserve_trade_bonus_desc: "Malý bonus k obchodnímu postoji za působení v rámci stejného měnového bloku. Odráží přednostní obchodní vztahy a platební infrastrukturu sdílenou mezi národy používajícími stejnou rezervní měnu." # todo: NEW TRANSLATION
 seigniorage_income_modifier: "Příjem ze seigniorage" # todo: NEW TRANSLATION
 monetary_policy_decisions: "Měnová politika" # todo: NEW TRANSLATION
 reserve_currency_issuer_required_tt: "Musí emitovat rezervní měnu" # todo: NEW TRANSLATION
 currency_backing: "Krytí měny" # todo: NEW TRANSLATION
 currency_backing_desc: "Standard aktiv, o který se opírá národní měna. Standardy tvrdých peněz vážou měnu na komoditní rezervu, čímž prosazují disciplínu, ale omezují měnovou flexibilitu. Fiatové systémy umožňují plnou měnovou suverenitu za cenu vyššího rizika inflace." # todo: NEW TRANSLATION
 gold_standard_back: "Zlatý standard" # todo: NEW TRANSLATION
 gold_standard_back_desc: "Národní měna je při pevném kurzu navázána na zlato a směnitelná za něj. Měnovou expanzi omezuje množství fyzických zlatých rezerv, což posiluje dlouhodobou důvěru, ale omezuje schopnost vlády reagovat na hospodářské krize." # todo: NEW TRANSLATION
 silver_standard: "Stříbrný standard" # todo: NEW TRANSLATION
 silver_standard_desc: "Národní měna je kryta stříbrnými rezervami při pevném směnném kurzu. Stříbrný standard je méně omezující než zlatý standard a poskytuje určitou komoditní disciplínu při současném umožnění o něco větší měnové flexibility." # todo: NEW TRANSLATION
 bi_metal_standard: "Bimetalický standard" # todo: NEW TRANSLATION
 bi_metal_standard_desc: "Měna je kryta zlatem i stříbrem při pevných směnných poměrech. Tento standard byl historicky přijat za účelem rozšíření měnové základny a vyvažuje komoditní disciplínu s větší flexibilitou nabídky než čistý standard jediného kovu." # todo: NEW TRANSLATION
 no_currency_backing: "Fiatová měna" # todo: NEW TRANSLATION
 no_currency_backing_desc: "Měna je kryta výhradně autoritou a úvěruschopností emitující vlády. Bez komoditních omezení je měnová politika plně flexibilní, což umožňuje rychlou reakci na krize, ale zvyšuje náchylnost k inflačním tlakům." # todo: NEW TRANSLATION
