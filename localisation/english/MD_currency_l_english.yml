l_english:
 reserve_currency: "Politika rezervní měny" # todo: NEW TRANSLATION
 reserve_currency_desc: "Měnový základ měnových rezerv a mezinárodního dluhu tohoto národa. Země, které se sladí s významnou rezervní měnou, získají přístup k jejím likviditním sítím a infrastruktuře vypořádání, zatímco národy, které udržují domácí rezervy, si zachovávají plnou měnovou suverenitu za cenu omezeného přístupu k mezinárodnímu úvěru." # todo: NEW TRANSLATION
 us_dollar: "[1182.owner.GetAdjective]ý dolar" # todo: NEW TRANSLATION
 us_dollar_desc: "Dominantní světová rezervní měna. Držení rezerv v dolarech poskytuje bezkonkurenční likviditu a přístup na mezinárodní úvěrové trhy, ale vystavuje zemi nákladům dluhu denominovaného v dolarech, které rostou při oslabování domácí měny." # todo: NEW TRANSLATION
 euro: "Euro" # todo: NEW TRANSLATION
 euro_desc: "Měna Evropské unie a druhá nejvíce obchodovaná rezervní měna na světě. Euro, dostupné členským státům EU, poskytuje regionální měnovou stabilitu a přednostní přístup na evropské kapitálové trhy." # todo: NEW TRANSLATION
 chinese_yuan: "[547.owner.GetAdjective]ý jüan" # todo: NEW TRANSLATION
 chinese_yuan_desc: "Renminbi, národní měna Číny, je rozvíjejícím se rezervním aktivem prosazovaným Pekingem jako alternativa k dominanci dolaru. Obchodní partneři v rámci čínské ekonomické sféry těží z její rostoucí sítě vypořádání." # todo: NEW TRANSLATION
 russia_rouble: "[652.owner.GetAdjective]ý rubl" # todo: NEW TRANSLATION
 russia_rouble_desc: "Měna Ruské federace používaná v rámci Eurasijské hospodářské unie a mezi postsovětskými obchodními partnery. Držení rezerv v rublech integruje zemi do alternativních platebních systémů Ruska a jeho rámce pro vypořádání energetických transakcí." # todo: NEW TRANSLATION
 japanese_yen: "[615.owner.GetAdjective]ý jen" # todo: NEW TRANSLATION
 japanese_yen_desc: "Měna Japonska a třetí nejvíce obchodovaná měna na světě. Země v japonské ekonomické sféře těží z jeho zavedených sítí vypořádání a relativní stability jenu, ačkoli jeho přijímání jako rezervní měny mimo východní Asii zůstává omezené." # todo: NEW TRANSLATION
 british_pound: "[13.owner.GetAdjective]á libra" # todo: NEW TRANSLATION
 british_pound_desc: "Nejstarší rezervní měna, která se stále aktivně používá v mezinárodním obchodě. Libra podpírá obchodní a finanční toky napříč Společenstvím národů a zachovává si významné postavení v globálních devizových rezervách, což zemím spojeným se Spojeným královstvím nabízí stabilní přístup k hlubokým kapitálovým trhům Londýna." # todo: NEW TRANSLATION
 swiss_frank: "[74.owner.GetAdjective]ý frank" # todo: NEW TRANSLATION
 swiss_frank_desc: "Měna Švýcarska, celosvětově proslulá jako bezpečné aktivum. Ačkoli ji ostatní národy jen zřídka přijímají jako formální rezervní měnu, přísná měnová disciplína franku a politická neutralita Švýcarska z něj činí měnu mimořádně odolnou vůči měnovým krizím a vnějším otřesům." # todo: NEW TRANSLATION
 gulden: "[46.owner.GetAdjective]ý gulden" # todo: NEW TRANSLATION
 gulden_desc: "Historická měna Nizozemska, znovu zavedená po vystoupení z eurozóny. Gulden, podpořený přísnou měnovou disciplínou a velkým přebytkem obchodní bilance, poskytuje plnou měnovou suverenitu a izoluje ekonomiku od vnějších otřesů, vzdává se však hluboké likvidity hlavních rezervních bloků a v zahraničí je držen jen zřídka." # todo: NEW TRANSLATION
