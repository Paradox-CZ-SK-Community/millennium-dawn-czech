 tech_turret_missiles_surface_6: "Protilodní rakety 2045" # todo: NEW TRANSLATION
 tech_turret_missiles_surface_6_desc: "Hyperpokročilé systémy protilodních raket koordinují salvové útoky, sdílejí aktualizace zaměřování a za letu upravují profily přiblížení, čímž zlepšují jak rakety pro údery proti hladinovým cílům, tak dálkové protiponorkové zbraně." # todo: NEW TRANSLATION
 tech_turret_missiles_surface_7: "Protilodní rakety 2060" # todo: NEW TRANSLATION
 tech_turret_missiles_surface_7_desc: "Ultrapokročilé systémy protilodních raket využívají hypersonický let, multispektrální naváděcí hlavice, rozpoznávání cílů podporované umělou inteligencí a navádění odolné proti protiopatřením k překonání chráněných hladinových svazů a nepolapitelných podvodních hrozeb." # todo: NEW TRANSLATION
 tech_turret_missiles_surface_8: "Protilodní rakety 2075" # todo: NEW TRANSLATION
 tech_turret_missiles_surface_8_desc: "Systémy protilodních raket nové generace využívají adaptivní autonomii, kooperativní koordinaci salv a slučování senzorů v reálném čase k identifikaci, prioritizaci a napadání nepřátelských plavidel ve sporných námořních bojových prostorech." # todo: NEW TRANSLATION
 tech_turret_missiles_drone_1: "Námořní roje modulů I" # todo: NEW TRANSLATION
 tech_turret_missiles_drone_1_desc: "Rojové moduly nahrazují tradiční rakety odpalovacími šachtami optimalizovanými pro jednosměrné útočné drony. Namísto jediného drahého projektilu může loď zaplavit chráněnou oblast několika malými hrozbami a přinutit nepřátelské senzory a interceptory rozhodovat, co zastavit." # todo: NEW TRANSLATION
 tech_turret_missiles_drone_2: "Námořní roje modulů II" # todo: NEW TRANSLATION
 tech_turret_missiles_drone_2_desc: "Vylepšené datové spoje a palubní navádění umožňují salvám dronů koordinovat přiblížení, rozdělit se do více směrů a za letu měnit cíle podle vývoje situace. Každý odpal se tak pro obránce mění v rozhodovací problém, kdy je jistota vzácná a reakční doba krátká." # todo: NEW TRANSLATION
 tech_turret_missiles_drone_3: "Námořní roje modulů III" # todo: NEW TRANSLATION
 tech_turret_missiles_drone_3_desc: "Pokročilé řízení rojů umožňuje hromadné poloautonomní útoky navržené k zahlcení vrstvené protivzdušné obrany, rušení sledování a nemilosrdnému využívání mezer. Díky modulárním nákladům a chytřejší navigaci se sebevražedné drony stávají flexibilní námořní údernou možností, která vyměňuje sílu jediného výstřelu za neúnavné zahlcení." # todo: NEW TRANSLATION
 tech_turret_missiles_drone_4: "Námořní roje modulů IV" # todo: NEW TRANSLATION
 tech_turret_missiles_drone_4_desc: "Špičkové rojové moduly vypouštějí autonomní jednosměrné námořní drony, které sdílejí senzorová data, přidělují cíle a upravují trasy útoku i při zhoršené komunikaci. Smícháním klamných cílů, rušiček a úderných nákladů v rámci jediné salvy dokážou narušit a přetížit nepřátelskou protivzdušnou obranu a zároveň tlačit na lodě z několika směrů." # todo: NEW TRANSLATION
