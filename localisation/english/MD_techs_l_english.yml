 tech_combat_sonar_5_desc: "Sonarové systémy slouží k detekci objektů pod hladinou a k měření hloubky pomocí zvukových impulsů."
 tech_combat_sonar_6: "Sonar VII" # todo: NEW TRANSLATION
 tech_combat_sonar_6_desc: "Sonarové sítě nové generace kombinují lodní pole, bezpilotní podvodní prostředky, senzory mořského dna a externí akustická data, čímž rozšiřují protiponorkovou detekci za hranici dosahu senzorů jediné lodi." # todo: NEW TRANSLATION
 tech_combat_sonar_7: "Sonar VIII" # todo: NEW TRANSLATION
 tech_combat_sonar_7_desc: "Distribuované systémy podmořského dohledu využívají autonomní senzory, modelování prostředí a akustickou analýzu podporovanou umělou inteligencí ke sledování tichých ponorek, podvodních dronů a torpéd v rozsáhlých oceánských oblastech." # todo: NEW TRANSLATION
 tech_combat_sonar_8: "Sonar IX" # todo: NEW TRANSLATION
 tech_combat_sonar_8_desc: "Budoucí sonarové systémy propojují válečné lodě, bezpilotní platformy, pole na mořském dně, oceánografické modely a datové sítě flotily do prediktivního systému podmořského boje pro odhalování, klasifikaci a lov hrozeb ve sporných vodách." # todo: NEW TRANSLATION
 tech_naval_recon_drones_1: "Námořní průzkumné drony I" # todo: NEW TRANSLATION
 tech_naval_recon_drones_1_desc: "Průzkumné drony vypouštěné z lodí prodlužují oči flotily za horizont a poskytují pátrání po hladinových cílech v reálném čase i základní určování cílů. I malé platformy mohou sledovat kontakty, mapovat přístupy a snižovat riziko překvapení ve sporných vodách." # todo: NEW TRANSLATION
 tech_naval_recon_drones_2: "Námořní průzkumné drony II" # todo: NEW TRANSLATION
 tech_naval_recon_drones_2_desc: "Vylepšené senzory a datové spoje mění námořní drony v průzkumníky s trvalou přítomností, kteří velitelům poskytují jasnější obraz námořní situace s rychlejší identifikací a sledováním. Lepší výdrž a stabilizace zvyšují jejich spolehlivost za špatného počasí a během dlouhých hlídkových cyklů." # todo: NEW TRANSLATION
 tech_naval_recon_drones_3: "Námořní průzkumné drony III" # todo: NEW TRANSLATION
 tech_naval_recon_drones_3_desc: "Propojené námořní drony dokážou koordinovat pátrací vzorce, navádět lodní zbraně a předávat údaje o cílech napříč svazem. Díky vylepšené elektronické podpoře a zpracování signálu pomáhají odhalovat hrozby, které by jinak zůstaly skryté v rušení a elektromagnetickém vyzařování." # todo: NEW TRANSLATION
 tech_naval_recon_drones_4: "Námořní průzkumné drony IV" # todo: NEW TRANSLATION
 tech_naval_recon_drones_4_desc: "Pokročilé námořní průzkumné drony poskytují trvalý širokoplošný dohled, určování cílů a předávání senzorových dat pro úderné a záchytné mise. Odolná komunikace a autonomní navigace jim umožňují operovat pod rušením, při zhoršeném spojení a v podmínkách intenzivního elektronického boje." # todo: NEW TRANSLATION
 tech_naval_recon_drones_5: "Námořní průzkumné drony V" # todo: NEW TRANSLATION
 tech_naval_recon_drones_5_desc: "Propojené skupiny námořních dronů koordinují bezpilotní letouny, hladinová plavidla a podvodní prostředky ke sledování rozsáhlých námořních oblastí, sdílení kontaktů napříč flotilou a zkrácení doby mezi detekcí a zásahem proti lodím, ponorkám, letadlům a raketám." # todo: NEW TRANSLATION
 tech_naval_recon_drones_6: "Námořní průzkumné drony VI" # todo: NEW TRANSLATION
 tech_naval_recon_drones_6_desc: "Autonomní námořní průzkumné sítě využívají klasifikaci podporovanou umělou inteligencí, pasivní snímání a kooperativní směrování ke sledování nepřátelských sil při omezení vlastního vyzařování, vyhýbání se zachycení a přizpůsobování se elektronickému boji." # todo: NEW TRANSLATION
 tech_naval_recon_drones_7: "Námořní průzkumné drony VII" # todo: NEW TRANSLATION
 tech_naval_recon_drones_7_desc: "Budoucí námořní průzkumné drony vytvoří distribuované autonomní sledovací sítě propojující vzdušné, hladinové, podmořské a flotilové senzory. Udrží tak nepřetržitou kontrolu nad cíli ve sporných oceánech a podpoří rychlé dálkové nasazení." # todo: NEW TRANSLATION
