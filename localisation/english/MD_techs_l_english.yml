 microchip_production_1: "Počáteční výroba čipů" # todo: NEW TRANSLATION
 microchip_production_1_desc: "Zavedení domácí výroby polovodičů umožňuje sériovou výrobu základních integrovaných obvodů. Tím vzniká základ moderní elektroniky a zlepšuje se spolehlivost i dostupnost výpočetních součástí používaných ve vojenských systémech, průmyslové automatizaci a civilní infrastruktuře." # todo: NEW TRANSLATION
 microchip_production_2: "1Kbitová DRAM" # todo: NEW TRANSLATION
 microchip_production_2_desc: "Počáteční dynamická paměť s náhodným přístupem umožňuje elektronickým systémům dočasně ukládat a načítat data mnohem vyšší rychlostí než předchozí technologie. Přestože má omezenou kapacitu, tato paměť umožňuje pohotovější počítače, podporuje rané digitální řídicí systémy a zlepšuje možnosti zpracování dat." # todo: NEW TRANSLATION
 microchip_production_3: "64Kbitová DRAM" # todo: NEW TRANSLATION
 microchip_production_3_desc: "Zlepšení výrobních procesů výrazně zvyšuje hustotu paměti a výtěžnost výroby. 64kilobitová DRAM podporuje složitější software a rychlejší provoz systémů, což umožňuje pokročilejší výpočetní aplikace v komunikaci, zpravodajské analýze a systémech řízení zbraní." # todo: NEW TRANSLATION
 microchip_production_4: "1Gbitová DRAM" # todo: NEW TRANSLATION
 microchip_production_4_desc: "Velkokapacitní gigabitové paměťové moduly představují významný pokrok v polovodičové technologii. Tyto čipy umožňují rozsáhlé zpracování dat, pokročilé simulace a moderní síťové velitelské systémy a tvoří klíčovou součást současné vojenské i civilní výpočetní infrastruktury." # todo: NEW TRANSLATION
 microchip_production_5: "Výroba čipů budoucnosti" # todo: NEW TRANSLATION
 microchip_production_5_desc: "Pokročilá výroba čipů využívá EUV litografii, nanosheetové tranzistory a vysoce automatizované výrobní linky k výrobě menších, rychlejších a energeticky úspornějších polovodičů pro civilní i vojenskou elektroniku." # todo: NEW TRANSLATION
 microchip_production_6: "Výroba čipů budoucnosti II" # todo: NEW TRANSLATION
 microchip_production_6_desc: "Zdokonalená výroba čipů zavádí napájení ze zadní strany, propracovanější architektury tranzistorů a ranou výrobu v angstromovém měřítku, čímž zvyšuje výkon a zároveň snižuje ztráty energie i tvorbu tepla." # todo: NEW TRANSLATION
 microchip_production_7: "Výroba čipů budoucnosti III" # todo: NEW TRANSLATION
 microchip_production_7_desc: "Litografie nové generace, pokročilé fotorezisty a přísnější kontrola procesů umožňují výrobním závodům tisknout jemnější struktury obvodů s menším počtem defektů, zvyšovat výtěžnost a vyrábět složitější vysoce výkonné procesory." # todo: NEW TRANSLATION
 microchip_production_8: "Výroba čipů budoucnosti IV" # todo: NEW TRANSLATION
 microchip_production_8_desc: "Heterogenní výroba čipů kombinuje logiku, paměť, senzory a akcelerátory prostřednictvím čipletových návrhů a pokročilého pouzdření, což umožňuje integrovat specializované součásti do výkonných modulárních procesorů." # todo: NEW TRANSLATION
 microchip_production_9: "Výroba čipů budoucnosti V" # todo: NEW TRANSLATION
 microchip_production_9_desc: "Trojrozměrná výroba polovodičů vrství aktivní vrstvy, paměť a propojení vertikálně, čímž výrazně zvyšuje výpočetní hustotu, ale vyžaduje pokročilé chlazení, spojování a kontrolu defektů." # todo: NEW TRANSLATION
 microchip_production_10: "Výroba čipů budoucnosti VI" # todo: NEW TRANSLATION
 microchip_production_10_desc: "Plně automatizované továrny budoucnosti využívají ladění procesů řízené AI, nové polovodičové materiály a mimořádně hustou 3D integraci k výrobě strategických čipů s extrémním výkonem, účinností a přesností výroby." # todo: NEW TRANSLATION
 production_line_improvements_1: "Vylepšené výrobní linky I" # todo: NEW TRANSLATION
 production_line_improvements_1_desc: "Počáteční zdokonalení průmyslových výrobních linek se zaměřují na omezení neefektivity, lepší organizaci pracovních postupů a zavedení základní automatizace. Tyto změny zvyšují stabilitu výroby a současně omezují provozní prostoje." # todo: NEW TRANSLATION
 production_line_improvements_2: "Vylepšené výrobní linky II" # todo: NEW TRANSLATION
 production_line_improvements_2_desc: "Rozšířené využívání standardizovaných součástí a poloautomatizovaných montážních procesů umožňuje továrnám spolehlivěji zvyšovat výrobu a zároveň omezovat úzká místa způsobená nedostatkem pracovní síly." # todo: NEW TRANSLATION
 production_line_improvements_3: "Vylepšené výrobní linky III" # todo: NEW TRANSLATION
 production_line_improvements_3_desc: "Pokročilá koordinace logistiky a optimalizované systémy manipulace s materiálem výrazně zvyšují průchodnost a omezují plýtvání v průmyslových zařízeních." # todo: NEW TRANSLATION
 production_line_improvements_4: "Vylepšené výrobní linky IV" # todo: NEW TRANSLATION
 production_line_improvements_4_desc: "Rozšířené zavedení průmyslové robotiky a přesných nástrojů zvyšuje rychlost výroby, kontrolu kvality a schopnost přizpůsobit se novým návrhům." # todo: NEW TRANSLATION
 production_line_improvements_5: "Vylepšené výrobní linky V" # todo: NEW TRANSLATION
 production_line_improvements_5_desc: "Digitálně integrované systémy řízení výroby umožňují sledování v reálném čase a rychlé úpravy výrobních procesů, čímž zvyšují celkovou efektivitu." # todo: NEW TRANSLATION
 production_line_improvements_6: "Vylepšené výrobní linky VI" # todo: NEW TRANSLATION
 production_line_improvements_6_desc: "Vysoce automatizované systémy a prediktivní údržba snižují míru poruch zařízení a umožňují továrnám pracovat dlouhodobě s maximální efektivitou." # todo: NEW TRANSLATION
 production_line_improvements_7: "Vylepšené výrobní linky VII" # todo: NEW TRANSLATION
 production_line_improvements_7_desc: "Chytré výrobní techniky kombinují analýzu dat s automatizovaným rozhodováním a optimalizují výrobní toky v celých průmyslových sítích." # todo: NEW TRANSLATION
 production_line_improvements_8: "Vylepšené výrobní linky VIII" # todo: NEW TRANSLATION
 production_line_improvements_8_desc: "Vysoce modulární výrobní linky umožňují rychlou rekonfiguraci pro nové vybavení a návrhy, čímž výrazně zvyšují průmyslovou flexibilitu." # todo: NEW TRANSLATION
 production_line_improvements_9: "Vylepšené výrobní linky IX" # todo: NEW TRANSLATION
 production_line_improvements_9_desc: "Téměř autonomní továrny využívají strojové učení k optimalizaci výroby, využití zdrojů a rozdělení pracovní síly s minimálním zásahem člověka." # todo: NEW TRANSLATION
 production_line_improvements_10: "Vylepšené výrobní linky X" # todo: NEW TRANSLATION
 production_line_improvements_10_desc: "Plně integrované průmyslové ekosystémy synchronizují dodavatele, výrobce a logistiku v reálném čase a posouvají efektivitu výroby na bezprecedentní úroveň." # todo: NEW TRANSLATION
 improved_building_constructions_1: "Zaměření na výstavbu závodů I" # todo: NEW TRANSLATION
 improved_building_constructions_1_desc: "Počáteční zlepšení výstavby průmyslových závodů se zaměřují na lepší plánování projektů, standardizované návrhy a efektivnější využití stavebních materiálů." # todo: NEW TRANSLATION
 improved_building_constructions_2: "Zaměření na výstavbu závodů II" # todo: NEW TRANSLATION
 improved_building_constructions_2_desc: "Prefabrikované součásti a lepší stavební logistika zkracují dobu výstavby při zachování strukturální integrity." # todo: NEW TRANSLATION
 improved_building_constructions_3: "Zaměření na výstavbu závodů III" # todo: NEW TRANSLATION
 improved_building_constructions_3_desc: "Zdokonalené inženýrské postupy a moderní stavební vybavení umožňují rychlejší a spolehlivější výstavbu průmyslových závodů." # todo: NEW TRANSLATION
 improved_building_constructions_4: "Zaměření na výstavbu závodů IV" # todo: NEW TRANSLATION
 improved_building_constructions_4_desc: "Automatizace stavebních procesů a lepší koordinace pracovní síly výrazně urychlují průmyslový rozvoj." # todo: NEW TRANSLATION
 improved_building_constructions_5: "Zaměření na výstavbu závodů V" # todo: NEW TRANSLATION
 improved_building_constructions_5_desc: "Digitálně podporované plánování a přesné stavební techniky minimalizují zpoždění a snižují celkovou spotřebu zdrojů." # todo: NEW TRANSLATION
 improved_building_constructions_6: "Zaměření na výstavbu závodů VI" # todo: NEW TRANSLATION
 improved_building_constructions_6_desc: "Pokročilé materiály a modulární stavební metody umožňují rychlé rozšiřování a modernizaci průmyslové infrastruktury." # todo: NEW TRANSLATION
 improved_building_constructions_7: "Zaměření na výstavbu závodů VII" # todo: NEW TRANSLATION
 improved_building_constructions_7_desc: "Vysoce optimalizované stavební řetězce propojují dodavatele, stavitele a plánovače a zjednodušují celý proces průmyslové výstavby." # todo: NEW TRANSLATION
 improved_building_constructions_8: "Zaměření na výstavbu závodů VIII" # todo: NEW TRANSLATION
 improved_building_constructions_8_desc: "Chytré stavební systémy využívají automatizaci a data v reálném čase k zajištění maximální efektivity a minimálního odpadu." # todo: NEW TRANSLATION
 improved_building_constructions_9: "Zaměření na výstavbu závodů IX" # todo: NEW TRANSLATION
 improved_building_constructions_9_desc: "Rozsáhlé průmyslové projekty těží z plánování s podporou AI, které umožňuje rychlejší dokončení a lepší dlouhodobý výkon." # todo: NEW TRANSLATION
 improved_building_constructions_10: "Zaměření na výstavbu závodů X" # todo: NEW TRANSLATION
 improved_building_constructions_10_desc: "Téměř autonomní stavební techniky dramaticky zkracují dobu výstavby a umožňují rychlou průmyslovou mobilizaci." # todo: NEW TRANSLATION
 composite_production_1: "Počáteční výroba kompozitů" # todo: NEW TRANSLATION
 composite_production_1_desc: "Počáteční vývoj kompozitních materiálů kombinuje tradiční kovy s polymery nebo vlákny za účelem dosažení lepšího poměru pevnosti a hmotnosti. Raná výroba kompozitů zlepšuje strukturální vlastnosti vozidel, letadel a infrastruktury a zároveň snižuje celkové náklady a hmotnost materiálu." # todo: NEW TRANSLATION
 composite_production_2: "Kompozitní materiály 2. generace" # todo: NEW TRANSLATION
 composite_production_2_desc: "Zdokonalení materiálových věd a výrobních technik vedou ke konzistentnějším a odolnějším kompozitním materiálům. Tyto kompozity druhé generace nabízejí lepší tepelnou odolnost a strukturální spolehlivost, díky čemuž jsou vhodné pro širší vojenské a průmyslové využití." # todo: NEW TRANSLATION
 composite_production_3: "Téměř moderní kompozity" # todo: NEW TRANSLATION
 composite_production_3_desc: "Pokroky v technologii vláken a chemii pryskyřic umožňují výrobu vysoce výkonných kompozitů blížících se moderním standardům. Tyto materiály výrazně zlepšují odolnost, snižují hmotnost a zvyšují odolnost proti únavě, což podporuje pokročilá letadla, obrněná vozidla a námořní systémy." # todo: NEW TRANSLATION
 composite_production_4: "Moderní výroba kompozitů" # todo: NEW TRANSLATION
 composite_production_4_desc: "Vyspělé procesy výroby kompozitů umožňují velkosériovou produkci pokročilých materiálů s přesnými tolerancemi a konzistentní kvalitou. Moderní kompozity jsou nedílnou součástí současných vojenských platforem a poskytují lepší ochranu, mobilitu a efektivitu vzdušným, pozemním i námořním silám." # todo: NEW TRANSLATION
 composite_production_5: "Výroba pokročilých kompozitů" # todo: NEW TRANSLATION
 composite_production_5_desc: "Pokročilá výroba kompozitů využívá automatizované ukládání vláken, vstřikování pryskyřice a zdokonalené metody vytvrzování k výrobě lehčích a pevnějších konstrukcí pro letadla, obrněná vozidla, střely a ochranné systémy." # todo: NEW TRANSLATION
 composite_production_6: "Výroba špičkových kompozitů" # todo: NEW TRANSLATION
 composite_production_6_desc: "Špičková výroba kompozitů rozšiřuje využití termoplastických materiálů, robotického ukládání a monitorování procesů v reálném čase, což umožňuje rychlejší výrobu složitých stealth draků, pancéřových panelů a konstrukcí vozidel s menším počtem vad." # todo: NEW TRANSLATION
 composite_production_7: "Výroba kompozitů blízké budoucnosti" # todo: NEW TRANSLATION
 composite_production_7_desc: "Výroba kompozitů blízké budoucnosti integruje nanomateriály, vrstvy pohlcující radar a vestavěné strukturální senzory a vytváří lehčí součásti, které mohou zlepšit ochranu, snížit zjistitelnost a během provozu sledovat poškození." # todo: NEW TRANSLATION
 composite_production_8: "Výroba kompozitů budoucnosti" # todo: NEW TRANSLATION
 composite_production_8_desc: "Výroba kompozitů budoucnosti využívá programovatelná vlákna, samoopravné matrice a výrobu optimalizovanou AI k tvorbě ultralehkých konstrukcí kombinujících pancéřovou ochranu, stealth vlastnosti, tepelnou regulaci a odolnost proti poškození na bojišti." # todo: NEW TRANSLATION
 radar: "Radar"
 radar_desc: "Radar je systém pro detekci přítomnosti, směru, vzdálenosti a rychlosti objektů pomocí elektromagnetických vln odražených od cíle zpět ke zdroji."
 internet1: "1G"
 internet1_desc: "1G je první generace bezdrátových mobilních telekomunikací. Rádiové signály přenášené v sítích 1G jsou analogové."
 internet2: "2G"
 internet2_desc: "2G neboli druhá generace mobilních sítí byla komerčně spuštěna v roce 1991. Přinesla výrazné zlepšení šifrování, efektivnější využití pásma a první datové služby, zejména SMS zprávy."
 internet3: "3G"
 internet3_desc: "3G neboli třetí generace mobilních sítí stanovila nové standardy pro mobilní zařízení a telekomunikace. Podporovala vyšší přenosové rychlosti a rozšířila využití mobilního internetu, hlasových služeb a mobilní televize."
 internet4: "4G"
 internet4_desc: "4G neboli čtvrtá generace mobilních sítí představuje moderní mobilní internet. Umožňuje webové služby, IP telefonii, online hraní a další digitální služby a prakticky nahradila analogové systémy předchozích generací."
 internet5: "5G"
 internet5_desc: "5G je nejmodernější standard mobilních sítí, jehož nasazení začalo v roce 2019. Nabízí výrazně vyšší šířku pásma a rychlosti stahování až kolem 10 Gbit/s, což umožňuje i konkurenci kabelového internetu."
 internet6: "6G"
 internet6_desc: "6G je budoucí standard širokopásmových sítí, který by mohl nabídnout rychlosti až 20 Gbit/s a umožnit masivní přenosy dat."
 internet7: "7G" # todo: NEW TRANSLATION
 internet7_desc: "7G je budoucí standard širokopásmových sítí, který zvýší šířku pásma na 120 Gbit/s. Díky tomu bude širokopásmové připojení ještě vhodnější pro rozsáhlé přenosy dat." # todo: NEW TRANSLATION
 internet8: "8G" # todo: NEW TRANSLATION
 internet8_desc: "8G je budoucí standard širokopásmových sítí, který zvýší šířku pásma na 240 Gbit/s. Díky tomu bude širokopásmové připojení ještě vhodnější pro rozsáhlé přenosy dat." # todo: NEW TRANSLATION
 internet9: "9G" # todo: NEW TRANSLATION
 internet9_desc: "9G je budoucí standard širokopásmových sítí, který zvýší šířku pásma na 480 Gbit/s. Díky tomu bude širokopásmové připojení ještě vhodnější pro rozsáhlé přenosy dat." # todo: NEW TRANSLATION
 internet10: "10G" # todo: NEW TRANSLATION
 internet10_desc: "10G je budoucí standard širokopásmových sítí, který zvýší šířku pásma na 1480 Gbit/s. Díky tomu bude širokopásmové připojení ještě vhodnější pro rozsáhlé přenosy dat." # todo: NEW TRANSLATION
 internet11: "11G" # todo: NEW TRANSLATION
 internet11_desc: "11G je budoucí standard širokopásmových sítí, který zvýší šířku pásma na 10240 Gbit/s. Díky tomu bude širokopásmové připojení ještě vhodnější pro rozsáhlé přenosy dat." # todo: NEW TRANSLATION
 wifi: "Wi-Fi"
 wifi_desc: "Wi-Fi je rodina bezdrátových síťových protokolů založených na standardech IEEE 802.11, běžně používaných pro lokální sítě a přístup k internetu. Název Wi-Fi je ochranná známka organizace Wi-Fi Alliance."
 lifi: "Li-Fi"
 lifi_desc: "Light Fidelity (Li-Fi) je technologie podobná Wi-Fi, která přenáší data pomocí světla. Její hlavní výhodou jsou velmi vysoké přenosové rychlosti až kolem 100 Gbit/s."
 modern_satelite_internet: "Moderní satelitní internet"
 modern_satelite_internet_desc: "Rostoucí využití satelitů v komunikaci umožňuje rozšíření internetového připojení i do odlehlých oblastí."
 internet_access_4: "Pokročilý přístup k satelitnímu internetu" # todo: NEW TRANSLATION
 internet_access_4_desc: "S tím, jak se satelity stále více rozšiřují v komunikaci a dalších formách přenosu dat, je internet jednou ze služeb, která využila satelitní přístup. To otevírá možnost připojit k internetu stále více lidí." # todo: NEW TRANSLATION
 internet_access_5: "Špičkový přístup k satelitnímu internetu" # todo: NEW TRANSLATION
 internet_access_5_desc: "S tím, jak se satelity stále více rozšiřují v komunikaci a dalších formách přenosu dat, je internet jednou ze služeb, která využila satelitní přístup. To otevírá možnost připojit k internetu stále více lidí." # todo: NEW TRANSLATION
 internet_access_6: "Počáteční přístup ke kvantovému internetu" # todo: NEW TRANSLATION
 internet_access_6_desc: "Počáteční přístup ke kvantovému internetu propojuje omezené výzkumné, vojenské a vládní sítě prostřednictvím kvantově zabezpečených komunikačních spojení a využívá distribuci provázání a výměnu kvantových klíčů k ochraně kritických dat." # todo: NEW TRANSLATION
 internet_access_7: "Pokročilý přístup ke kvantovému internetu" # todo: NEW TRANSLATION
 internet_access_7_desc: "Pokročilý přístup ke kvantovému internetu rozšiřuje kvantové opakovače, kvantovou paměť a opticko-satelitní spojení, což umožňuje zabezpečenou komunikaci na dlouhé vzdálenosti a počáteční distribuované kvantové snímání napříč strategickými sítěmi." # todo: NEW TRANSLATION
 internet_access_8: "Špičkový přístup ke kvantovému internetu" # todo: NEW TRANSLATION
 internet_access_8_desc: "Špičkový přístup ke kvantovému internetu propojuje kvantové počítače, senzory a zabezpečené komunikační uzly do širší sítě, což umožňuje distribuované výpočty, přesné snímání a vysoce odolnou strategickou komunikaci." # todo: NEW TRANSLATION
 lte: "LTE"
 lte_desc: "Long Term Evolution (LTE) je standard bezdrátového širokopásmového připojení založený na technologiích GSM/EDGE a UMTS/HSPA."
 wimax: "WiMAX"
 wimax_desc: "Worldwide Interoperability for Microwave Access (WiMAX) je rodina standardů bezdrátového širokopásmového připojení založená na normách IEEE 802.16."
 umts: "UMTS"
 umts_desc: "Universal Mobile Telecommunications System (UMTS) je mobilní systém třetí generace vyvinutý v rámci 3GPP. Je součástí standardu IMT-2000 a vyžaduje hustší síť základnových stanic a nové frekvenční pásmo."
 edge: "EDGE"
 edge_desc: "Enhanced Data Rates for GSM Evolution (EDGE) nevyžaduje nové základnové stanice ani frekvence. Díky pokročilému kódování umožňuje vyšší datové rychlosti a bývá označován jako 2.75G."
 hsupa: "HSDPA/HSUPA"
 hsupa_desc: "High-Speed Downlink/Uplink Packet Access rozšiřuje 3G sítě založené na WCDMA a výrazně zlepšuje jejich výkon."
 gprs: "GPRS"
 gprs_desc: "General Packet Radio Service (GPRS) je paketová bezdrátová služba nabízející rychlosti přenosu dat mezi 56-114 kb/s a trvalé připojení k internetu v rámci 2G a 3G sítí."
 civilian_folder: "Průmyslové technologie"
 civilian_folder_desc: "Technologie 21. století, jako je genetické inženýrství, nanovlákna a umělá inteligence."
 CAT_ai: "Technologie umělé inteligence"
 CAT_microchips: "Technologie mikročipů" # todo: NEW TRANSLATION
 CAT_microchips_research: "$CAT_microchips$ Výzkum" # todo: NEW TRANSLATION
 CAT_nfibers: "Technologie nanovláken"
 CAT_nfibers_research: "Rychlost výzkumu nanovlákenných technologií" # todo: NEW TRANSLATION # todo: MOVED KEY
 CAT_robotics: "Robotická technologie" # todo: NEW TRANSLATION
 CAT_robotics_research: "$CAT_robotics$ Rychlost výzkumu" # todo: NEW TRANSLATION
 CAT_naval_reactors: "Námořní jaderné reaktory"
 CAT_renewable: "Technologie obnovitelných zdrojů energie"
 artificial_intelligence_1: "Obnova neuronových sítí" # todo: NEW TRANSLATION
 artificial_intelligence_1_desc: "Neuronové sítě existují jako teorie využití zpracovatelské kapacity mozku ke zlepšení lidstva již od konce 19. století. Měli bychom tuto myšlenku obnovit, abychom zdokonalili naše počítače a pokračovali v hledání umělé inteligence." # todo: NEW TRANSLATION
 artificial_intelligence_2: "Dolování dat" # todo: NEW TRANSLATION
 artificial_intelligence_2_desc: "Dolování dat je postup zkoumání rozsáhlých databází za účelem získávání nových informací. Tento postup může pomoci zlepšit naši schopnost vyvíjet a zdokonalovat úroveň technologií." # todo: NEW TRANSLATION
 artificial_intelligence_3: "Strojové učení" # todo: NEW TRANSLATION
 artificial_intelligence_3_desc: "Základem teorie strojového učení je schopnost počítačového algoritmu automaticky se zlepšovat prostřednictvím zkušeností. Jeho začlenění do našich protokolů AI může umožnit rychlejší učení nových průmyslových úkolů a zlepšit výzkum a vývoj." # todo: NEW TRANSLATION
 artificial_intelligence_4: "Společenské stroje" # todo: NEW TRANSLATION
 artificial_intelligence_4_desc: "Společenské stroje představují prostředí, v němž lidé a technologie vzájemně působí a vytvářejí výstupy nebo činnosti, které by bez obou nebyly možné." # todo: NEW TRANSLATION
 artificial_intelligence_5: "Počáteční robotika s AI" # todo: NEW TRANSLATION
 artificial_intelligence_5_desc: "Umělá inteligence v robotice byla od nedávného vzniku strojového učení a dalších forem AI omezená. Zavedení AI do průmyslové a jiné robotiky umožní robotům nejen zlepšit jejich produktivitu." # todo: NEW TRANSLATION
 artificial_intelligence_6: "Pokročilá AI" # todo: NEW TRANSLATION
 artificial_intelligence_6_desc: "Pokročilejší AI, která dokáže registrovat situace a rychle se jim přizpůsobovat, může znamenat zásadní rozdíl." # todo: NEW TRANSLATION
 artificial_intelligence_7: "Moderní hluboké učení" # todo: NEW TRANSLATION
 artificial_intelligence_7_desc: "Hluboké učení je podmnožinou strojového učení schopnou učit se bez dohledu z nestrukturovaných nebo neoznačených dat. Jeho vnitřní fungování představuje funkci AI napodobující činnost lidského mozku při zpracování dat pro detekci objektů a rozhodování." # todo: NEW TRANSLATION
 artificial_intelligence_8: "AI napodobující člověka" # todo: NEW TRANSLATION
 artificial_intelligence_8_desc: "AI napodobující člověka využívá rozsáhlé neuronové sítě a hluboké učení ke generování jazyka, obrazů, rozhodnutí a chování podobných lidským, což strojům umožňuje vykonávat úkoly, které dříve vyžadovaly přímý lidský úsudek." # todo: NEW TRANSLATION
 artificial_intelligence_9: "Trénování AI ve velkém měřítku" # todo: NEW TRANSLATION
 artificial_intelligence_9_desc: "Trénování AI ve velkém měřítku využívá rozsáhlé datové sady, specializované akcelerátory a distribuované výpočetní clustery k vytváření základních modelů schopných uvažování, překladu, plánování, analýzy a multimodálního rozpoznávání." # todo: NEW TRANSLATION
 artificial_intelligence_10: "Pokročilé samo-učené algoritmy" # todo: NEW TRANSLATION
 artificial_intelligence_10_desc: "Pokročilé samo-učené algoritmy umožňují systémům AI zlepšovat se prostřednictvím simulací, zpětné vazby a autonomního experimentování, čímž omezují potřebu neustálého přeškolování člověkem a ručního navrhování pravidel." # todo: NEW TRANSLATION
 artificial_intelligence_11: "Obecná umělá inteligence" # todo: NEW TRANSLATION
 artificial_intelligence_11_desc: "Obecná umělá inteligence dokáže přenášet znalosti mezi mnoha obory, řešit neznámé problémy a koordinovat složité úkoly s flexibilitou na lidské úrovni, místo aby byla omezena na úzce specializované funkce." # todo: NEW TRANSLATION
 artificial_intelligence_12: "Koordinace úlu AI" # todo: NEW TRANSLATION
 artificial_intelligence_12_desc: "Koordinace úlu AI propojuje mnoho specializovaných systémů AI do společné rozhodovací sítě, která jim umožňuje v reálném čase vyměňovat data, rozdělovat úkoly a koordinovat vojenské, průmyslové a logistické operace." # todo: NEW TRANSLATION
 artificial_intelligence_13: "Umělá superinteligence" # todo: NEW TRANSLATION
 artificial_intelligence_13_desc: "Umělá superinteligence překonává lidskou úroveň výkonu ve výzkumu, strategii, inženýrství a správě, což automatizovaným systémům umožňuje řídit obrovské pracovní zatížení a objevovat řešení přesahující běžné lidské schopnosti." # todo: NEW TRANSLATION
 artificial_intelligence_14: "Kvantová superinteligence" # todo: NEW TRANSLATION
 artificial_intelligence_14_desc: "Kvantová superinteligence kombinuje pokročilé architektury AI s kvantově urychlenými výpočty a umožňuje optimalizaci, simulace, kryptografickou analýzu a strategické plánování v extrémním měřítku, které přesahuje možnosti klasické strojové inteligence." # todo: NEW TRANSLATION
 robotics_1: "Humanoidní robot" # todo: NEW TRANSLATION
 robotics_1_desc: "Základ strachu mnoha lidí je zároveň základem velkého pokroku v robotice založené na AI. Nástup několika robotů podobných člověku ukázal, že některé činnosti lze lépe automatizovat, přestože by za běžných okolností šlo o rutinní a monotónní úkoly." # todo: NEW TRANSLATION
 robotics_2: "Pokročilá průmyslová robotika" # todo: NEW TRANSLATION
 robotics_2_desc: "Zavedení ještě sofistikovanější AI do naší komerční a průmyslové robotiky může zlepšit kvalitu, dodávky, rychlost našich výrobků i samotné výroby." # todo: NEW TRANSLATION
 robotics_3: "Chytré drony" # todo: NEW TRANSLATION
 robotics_3_desc: "Drony obvykle obsluhuje jeden až dva lidé, kteří se nacházejí kilometry daleko. Pokud začneme instalovat umělou inteligenci přímo na palubu, můžeme snížit požadavky na pracovní sílu na jednoho člověka, nebo v budoucnu na nikoho, protože drony budou řídit počítačové systémy." # todo: NEW TRANSLATION
 robotics_4: "Plně automatizované drony" # todo: NEW TRANSLATION
 robotics_4_desc: "Plně automatizované drony bývaly záležitostí budoucnosti. Nyní s nimi můžeme zajišťovat logistiku a mnoho dalšího a zcela autonomně je přesouvat z bodu A do bodu B." # todo: NEW TRANSLATION
 robotics_5: "Nanoroboti" # todo: NEW TRANSLATION
 robotics_5_desc: "Nanoroboti jsou konceptem malých strojů nebo robotů o velikosti nanometru či v jeho blízkosti. Nanoroboti by mohli najít využití v mnoha oblastech, od medicíny až po bojové nasazení v některých typech demontážních operací." # todo: NEW TRANSLATION
 robotics_6: "Lékařští nanoroboti" # todo: NEW TRANSLATION
 robotics_6_desc: "Nanoroboti používaní v medicíně mohou cílit na konkrétní buňky, viry a bakterie, bojovat proti nemocem nebo potenciálně smrtelným infekcím." # todo: NEW TRANSLATION
 robotics_7: "Drony řízené AI" # todo: NEW TRANSLATION
 robotics_7_desc: "Drony se dokážou dokonale vyhýbat překážkám a komunikovat s ostatními stroji ve svém okolí, čímž maximalizují logistickou efektivitu." # todo: NEW TRANSLATION
 robotics_8: "Průmysl 4.0" # todo: NEW TRANSLATION
 robotics_8_desc: "Robotika plně přinesla čtvrtou průmyslovou revoluci do všech oblastí lidského života." # todo: NEW TRANSLATION
 robotics_9: "Pokročilí lékařští AI roboti" # todo: NEW TRANSLATION
 robotics_9_desc: "Tyto AI dokážou léčit jakoukoli nemoc. Ovládají armádu nanorobotů a mohou dokonce bojovat proti mechanismům stárnutí u lidí." # todo: NEW TRANSLATION
 robotics_10: "Kvantová robotika" # todo: NEW TRANSLATION
 robotics_10_desc: "Kvantové výpočty v robotech zkracují dobu odezvy téměř na okamžik a umožňují přesné mikromanagementové řízení výrobních řetězců." # todo: NEW TRANSLATION
 robotics_11: "Průmyslová centra se superinteligencí" # todo: NEW TRANSLATION
 robotics_11_desc: "Celé průmyslové parky nyní mohou řídit jednotliví dozorci s umělou superinteligencí." # todo: NEW TRANSLATION
 printing_1: "Stereolitografie" # todo: NEW TRANSLATION
 printing_1_desc: "Stereolitografie je forma 3D tisku používaná především k vytváření modelů, prototypů, vzorů a výrobních dílů vrstvu po vrstvě pomocí fotochemických procesů." # todo: NEW TRANSLATION
 printing_2: "První 3D tiskárny" # todo: NEW TRANSLATION
 printing_2_desc: "První 3D tisk byl vhodný k vytváření funkčních nebo estetických prototypů. Tento proces se nazývá „rychlé prototypování“." # todo: NEW TRANSLATION
 printing_3: "3D vosková tiskárna" # todo: NEW TRANSLATION
 printing_3_desc: "3D vosková tiskárna používá vosk a další formy termoplastických materiálů." # todo: NEW TRANSLATION
 printing_4: "Velkoformátový 3D tisk" # todo: NEW TRANSLATION
 printing_4_desc: "Rozšíření 3D tisku na mnohem větší měřítko nám může pomoci zefektivnit a rozšířit výrobu drobných předmětů, jako jsou šrouby a hřebíky, nebo vytvářet detailní součásti, které jsou na trhu nenahraditelné." # todo: NEW TRANSLATION
 printing_5: "Samo-replikující se 3D tiskárna" # todo: NEW TRANSLATION
 printing_5_desc: "Samo-replikující se 3D tiskárny jsou navrženy tak, aby pomáhaly s výrobou a dalším rozšiřováním produkce." # todo: NEW TRANSLATION
 printing_6: "Komerční výroba" # todo: NEW TRANSLATION
 printing_6_desc: "3D tisk byl v komerční sféře dosud velmi omezený. Rozšíření možností 3D tisku o tuto oblast výrazně pomůže našemu dalšímu rozvoji." # todo: NEW TRANSLATION
 printing_7: "Moderní 3D tisk" # todo: NEW TRANSLATION
 printing_7_desc: "Pokrok v oblasti 3D tisku nám umožnil nahrazovat materiály pevnějšími a efektivnějšími alternativami." # todo: NEW TRANSLATION
 printing_8: "3D tištěná nanovlákna" # todo: NEW TRANSLATION
 printing_8_desc: "Tisk nanovláken nám může pomoci vytvářet pevnější materiály až na úrovni jednotlivých nanitů." # todo: NEW TRANSLATION
 printing_9: "Velkoformátová výroba nanocelulózy" # todo: NEW TRANSLATION
 printing_9_desc: "Rozšíření výroby nanocelulózy na větší měřítko nám může pomoci vyvíjet nové produkty mnohem rychleji." # todo: NEW TRANSLATION
 printing_10: "Nanocelulóza v medicíně" # todo: NEW TRANSLATION
 printing_10_desc: "Využití nanocelulózy v medicíně může pomoci zlepšit míru přežití pacientů s vysilujícími chorobami." # todo: NEW TRANSLATION
 printing_11: "Stavební tiskárny" # todo: NEW TRANSLATION
 printing_11_desc: "Budovy lze stavět pomocí tiskáren schopných vyrábět materiály přímo na místě, čímž se snižují logistické náklady." # todo: NEW TRANSLATION
 printing_12: "Biotisk" # todo: NEW TRANSLATION
 printing_12_desc: "Spojení pokroku v biotechnologiích a 3D tisku umožňuje výrobu celých orgánů." # todo: NEW TRANSLATION
 printing_13: "Tiskárny od mikro po makro" # todo: NEW TRANSLATION
 printing_13_desc: "3D tiskárny se staly natolik všestrannými, že je lze využít ve všech oblastech lidského života, od výroby nanovláken až po stavbu celých budov." # todo: NEW TRANSLATION
 nanofibers_1: "Průmyslová elektrostaticky zvlákňovaná polymerní nanovlákna" # todo: NEW TRANSLATION
 nanofibers_1_desc: "Elektrostatické zvlákňování nanovláken je jedním z nejběžnějších způsobů jejich výroby. Zvýšení produkce nám umožní vyrábět více nanovláken a častěji." # todo: NEW TRANSLATION
 nanofibers_2: "Vícevrstvé uhlíkové nanotrubice" # todo: NEW TRANSLATION
 nanofibers_2_desc: "Nanotrubice se používají jako vodiče v elektrických zařízeních, anténách rádií a dalších elektromagnetických přístrojích." # todo: NEW TRANSLATION
 nanofibers_3: "Moderní elektrostatické zvlákňování" # todo: NEW TRANSLATION
 nanofibers_3_desc: "Elektrostatické zvlákňování je metoda výroby vláken, která využívá elektrickou sílu k vytahování nabitých vláken z polymerních roztoků nebo tavenin na průměr několika set nanometrů." # todo: NEW TRANSLATION
 nanofibers_4: "Výroba anorganických vláken" # todo: NEW TRANSLATION
 nanofibers_4_desc: "Elektrostatické zvlákňování je považováno za jednu z nejjednodušších a nejúčinnějších technik výroby velkého množství nanomateriálů, díky níž se úspěšně vyrábějí různá anorganická mikro- a nanovlákna." # todo: NEW TRANSLATION
 nanofibers_5: "Průmyslová výroba nanovláken" # todo: NEW TRANSLATION
 nanofibers_5_desc: "Elektrostaticky zvlákněná nanovlákna jsou intenzivně zkoumána a jejich potenciální využití je široce prokázáno. Zařízení pro elektrostatické zvlákňování, technologická řešení a elektrostaticky zvlákněné materiály rychle směřují ke komercializaci. Specializované společnosti dodávají laboratorní i průmyslové komponenty a zařízení pro elektrostatické zvlákňování." # todo: NEW TRANSLATION
 nanofibers_6: "Nanovlákna v medicíně" # todo: NEW TRANSLATION
 nanofibers_6_desc: "Nanovlákna mají díky jedinečné kombinaci vlastností a přirozených funkcí velký potenciál v biomedicíně a zdravotnictví. Mezi důležitá biomedicínská využití nanovláken patří filtrace, zdravotnické textilie, hojení ran, tkáňové inženýrství a regenerace, biosenzory a transport léčiv." # todo: NEW TRANSLATION
 nanofibers_7: "Centrifugální zvlákňování" # todo: NEW TRANSLATION
 nanofibers_7_desc: "Využití vysokonapěťového zařízení a nízká výrobní rychlost se staly překážkami pro používání elektrostatického zvlákňování při velkoformátové výrobě nanovláken. Centrifugální zvlákňování je účinný způsob výroby nanovláken z různých materiálů." # todo: NEW TRANSLATION
 nanofibers_8: "" # todo: NEW TRANSLATION
 nanofibers_8_desc: "" # todo: NEW TRANSLATION
 nanofibers_9: "" # todo: NEW TRANSLATION
 nanofibers_9_desc: "" # todo: NEW TRANSLATION
 nanofibers_10: "" # todo: NEW TRANSLATION
 nanofibers_10_desc: "" # todo: NEW TRANSLATION
 nanofibers_11: "" # todo: NEW TRANSLATION
 nanofibers_11_desc: "" # todo: NEW TRANSLATION
 nanofibers_12: "" # todo: NEW TRANSLATION
 nanofibers_12_desc: "" # todo: NEW TRANSLATION
 nanofibers_13: "" # todo: NEW TRANSLATION
 nanofibers_13_desc: "" # todo: NEW TRANSLATION
 nanofibers_14: "" # todo: NEW TRANSLATION
 nanofibers_14_desc: "" # todo: NEW TRANSLATION
 genetics_1: "DNA daktyloskopie" # todo: NEW TRANSLATION
 genetics_1_desc: "DNA daktyloskopie byla jedním z největších vynálezů 20. století. Pomohla dosáhnout významného pokroku v policejní práci, profilování a mnoha dalších oblastech genetiky." # todo: NEW TRANSLATION
 genetics_2: "Moderní GMO" # todo: NEW TRANSLATION
 genetics_2_desc: "Geneticky modifikovaný organismus (GMO) je geneticky pozměněný organismus, který lze využít v mnoha různých oblastech, například u plodin, dobytka, ve vědě a v mnoha dalších formách pěstování." # todo: NEW TRANSLATION
 genetics_3: "Genová terapie" # todo: NEW TRANSLATION
 genetics_3_desc: "Genová terapie je proces genetického výběru požadovaných vlastností a potlačování vlastností nežádoucích." # todo: NEW TRANSLATION
 genetics_4: "Geneticky modifikované plodiny" # todo: NEW TRANSLATION
 genetics_4_desc: "Geneticky modifikované plodiny, jako kukuřice, rajčata a další rostliny, jsou šlechtěny s výhodnějšími vlastnostmi než jejich protějšky, například s vyšší odolností vůči hmyzu a mnoha dalšími." # todo: NEW TRANSLATION
 genetics_5: "Projekt lidského genomu" # todo: NEW TRANSLATION
 genetics_5_desc: "Mapování lidského genomu bylo důležité pro zmapování jednoho z nejsložitějších genetických uspořádání na Zemi. Zmapování tohoto oceánu poznání může dále rozšířit naše znalosti v oblasti genetiky." # todo: NEW TRANSLATION
 genetics_6: "Pesticidy zaměřené na geny" # todo: NEW TRANSLATION
 genetics_6_desc: "Pesticidy zaměřené na geny se používají k zacílení konkrétních genů škůdců nebo feromonů vylučovaných rostlinami, aby se zabránilo poškození rostlin hmyzem či škůdci." # todo: NEW TRANSLATION
 genetics_7: "Syntetický život" # todo: NEW TRANSLATION
 genetics_7_desc: "Pokrok v genových technologiích nám umožnil vytvořit život zcela od základu." # todo: NEW TRANSLATION
 genetics_8: "Bezpečné klonování" # todo: NEW TRANSLATION
 genetics_8_desc: "Klonování bylo vždy nejistým podnikem. Pro klony je také velmi nebezpečné. Před tímto průlomem většina z nich nepřežila dětství." # todo: NEW TRANSLATION
 genetics_9: "Léčba CRISPR" # todo: NEW TRANSLATION
 genetics_9_desc: "Léčba CRISPR je technika úpravy genů, která odstraňuje mutace z buněk." # todo: NEW TRANSLATION
 genetics_10: "Plodiny s genovou úpravou CRISPR" # todo: NEW TRANSLATION
 genetics_10_desc: "Plodiny CRISPR jsou podobné léčbě CRISPR u zvířat a lidí. U plodin CRISPR však buď posilují žádoucí geny, nebo odstraňují nežádoucí vlastnosti." # todo: NEW TRANSLATION
 genetics_11: "Experimenty CRISPR na lidech" # todo: NEW TRANSLATION
 genetics_11_desc: "Je čas začít experimentovat na lidech s využitím CRISPR." # todo: NEW TRANSLATION
 genetics_12: "Geneticky modifikovaní lidé" # todo: NEW TRANSLATION
 genetics_12_desc: "Genetická úprava lidí tak, aby byli silnější, lepší, rychlejší a zdravější než dříve, nám může pomoci posunout evoluci vpřed." # todo: NEW TRANSLATION
 genetics_13: "Nadčlověk" # todo: NEW TRANSLATION
 genetics_13_desc: "Úprava lidí překonala způsob, jakým nyní náš druh vnímá sám sebe." # todo: NEW TRANSLATION
 genetics_14: "Klonování nadlidí" # todo: NEW TRANSLATION
 genetics_14_desc: "Není nadlidí dost? Nyní je můžeme klonovat!" # todo: NEW TRANSLATION
 genetics_15: "Meziplanetární adaptabilita" # todo: NEW TRANSLATION
 genetics_15_desc: "Jak daleko můžeme posunout adaptabilitu nadlidí? Nyní se můžeme usadit na různých planetách a přizpůsobit se dříve nebezpečnému prostředí." # todo: NEW TRANSLATION
 genetics_16: "Vesmírní lidé" # todo: NEW TRANSLATION
 genetics_16_desc: "Naše rasa dosáhla vrcholu genetické evoluce a dokáže cestovat vesmírem, přičemž je imunní vůči vesmírnému chladu a kosmickému záření." # todo: NEW TRANSLATION
 crispr_1: "CRISPR" # todo: NEW TRANSLATION
 crispr_1_desc: "CRISPR je technika úpravy genů používaná především u pacientů s rakovinou a ve výzkumu a vývoji jako metoda zaměřování a ničení rakoviny pacienta." # todo: NEW TRANSLATION
 crispr_2: "Úprava genů Cas9" # todo: NEW TRANSLATION
 crispr_2_desc: "Cas9 je daltonový protein imunitního systému proti DNA virům a plazmidům. Úprava tohoto proteinu může pomoci zlepšit přirozenou obranu a má také rozsáhlé využití v aplikacích genetického inženýrství." # todo: NEW TRANSLATION
 crispr_3: "TraceRNA" # todo: NEW TRANSLATION
 crispr_3_desc: "Transaktivační CRISPR RNA je malá transkódovaná RNA, poprvé objevená u lidského patogenu Streptococcus pyogenes. RNA pomáhá vytvářet obranu proti virům a plazmidům." # todo: NEW TRANSLATION
 crispr_4: "Experimentování s léčbou CRISPR" # todo: NEW TRANSLATION
 crispr_4_desc: "Experimentování s CRISPR nám umožňuje lépe zdokonalovat proces úpravy genů." # todo: NEW TRANSLATION
 electrification_1: "Revoluce domácí elektrifikace"
 electrification_1_desc: "Domácí infrastruktura prochází zásadní proměnou. Elektrické vytápění snižuje závislost na fosilních palivech, ale zároveň zvyšuje nároky na elektrickou síť."
 electrification_2: "Elektrifikace hromadné dopravy"
 electrification_2_desc: "Veřejná doprava se přesouvá k elektrickému pohonu. Města jsou tišší a čistší, avšak energetická síť čelí vyšší zátěži."
 electrification_3: "Elektrické železnice"
 electrification_3_desc: "Železnice opouštějí dieselové lokomotivy ve prospěch plně elektrických souprav, což zvyšuje efektivitu i spotřebu elektřiny."
 electrification_4: "Elektrifikace volnočasových aktivit"
 electrification_4_desc: "Rekreační vozidla a plavidla přecházejí na elektrický pohon, čímž snižují uhlíkovou stopu volného času."
 electrification_5: "Průlom elektromobilů"
 electrification_5_desc: "Silnice zaplavují elektromobily, roste počet dobíjecích stanic a klesá závislost na ropě, avšak spotřeba elektřiny prudce roste."
 electrification_6: "Elektrifikace zemědělství"
 electrification_6_desc: "Zemědělské stroje přecházejí z nafty na elektřinu, čímž se farmy stávají centry čisté spotřeby energie."
 electrification_7: "Elektrifikace stavebnictví"
 electrification_7_desc: "Staveniště se mění s nasazením elektrických jeřábů, bagrů a buldozerů, což snižuje hluk i emise."
 electrification_8: "Elektrická nákladní doprava"
 electrification_8_desc: "Elektrické nákladní vozy snižují emise, zatímco logistická centra se stávají významnými odběrateli energie."
 electrification_9: "Elektrifikace námořní dopravy"
 electrification_9_desc: "Elektrické nákladní lodě a rekreační plavidla přinášejí tichý a bezemisní provoz na mořích."
 electrification_10: "Elektrifikace letectví"
 electrification_10_desc: "Letecký průmysl experimentuje s elektrickým pohonem, který postupně mění podobu letecké dopravy."
 electrification_11: "Elektrifikace hlubinné těžby" # todo: NEW TRANSLATION
 electrification_11_desc: "Elektrifikace hlubinné těžby nahrazuje dieselovou přepravu, vrtání, ventilační podporu a pomocné stroje bateriovými elektrickými, trolejovými a síťově napájenými systémy. Zvyšuje spotřebu energie a zároveň snižuje spotřebu paliva, teplo a podzemní emise." # todo: NEW TRANSLATION
 electrification_12: "Revoluce na nízké oběžné dráze" # todo: NEW TRANSLATION
 electrification_12_desc: "Infrastruktura na nízké oběžné dráze využívá solární stanice, elektrické orbitální remorkéry a automatizovaná servisní plavidla k podpoře přesunů satelitů, odstraňování trosek a přepravy nákladu s mnohem menší spotřebou chemického paliva." # todo: NEW TRANSLATION
 electrification_13: "Nový pohled na mise na vysoké oběžné dráze" # todo: NEW TRANSLATION
 electrification_13_desc: "Mise na vysoké oběžné dráze využívají elektrický pohon s vysokým výkonem a autonomní systémy pro zvyšování oběžné dráhy k přesunu satelitů a nákladu směrem ke geostacionární oběžné dráze, lunárnímu prostoru a výchozím bodům pro lety do hlubokého vesmíru s nižšími nároky na palivo." # todo: NEW TRANSLATION
 electrification_14: "Nová podoba vesmírných cest" # todo: NEW TRANSLATION
 electrification_14_desc: "Pokročilé kosmické lety rozšiřují využití elektrického pohonu, energetických systémů s vysokou účinností a dlouhodobého skladování energie pro podporu trvalých cest za oběžnou dráhu Země při současném snížení hmotnosti paliva potřebného pro nákladní a průzkumné mise." # todo: NEW TRANSLATION
 utility_scale_battery_storage: "Základy velkokapacitního ukládání energie"
 utility_scale_battery_storage_desc: "Energetické společnosti začínají využívat rozsáhlé bateriové systémy k ukládání elektrické energie."
 utility_scale_battery_storage2: "Lithium-iontové úložiště sítě"
 utility_scale_battery_storage2_desc: "Pokrok v lithium-iontových technologiích umožňuje flexibilnější a odolnější elektrickou síť."
 utility_scale_battery_storage3: "Průlom průtočných baterií"
 utility_scale_battery_storage3_desc: "Průtočné baterie umožňují nezávislé škálování výkonu a kapacity a jsou vhodné pro dlouhodobé ukládání energie."
 utility_scale_battery_storage4: "Nadvláda pevnolátkových baterií"
 utility_scale_battery_storage4_desc: "Pevnolátkové baterie nabízejí vyšší hustotu energie, bezpečnost a dlouhou životnost."
 utility_scale_battery_storage5: "Kvantový skok v ukládání energie"
 utility_scale_battery_storage5_desc: "Kvantové technologie přinášejí revoluční kapacity ukládání energie a přetvářejí energetickou infrastrukturu."
 utility_scale_battery_storage_6: "Optimalizace kvantového úložiště" # todo: NEW TRANSLATION
 utility_scale_battery_storage_6_desc: "Kvantová úložiště mají stále prostor pro zlepšení a umožňují hustší akumulaci energie ve vysoce účinných kvantových článcích." # todo: NEW TRANSLATION
 utility_scale_battery_storage_7: "Kvantová maximalizace" # todo: NEW TRANSLATION
 utility_scale_battery_storage_7_desc: "Výzkum skladování energie dosáhl svého vrcholu a posouvá hranice téměř k fyzicky nemožnému." # todo: NEW TRANSLATION
 utility_scale_battery_storage_tt: "Odemkne možnost stavět §Ybateriové parky§!, které dokáží uložit §Y100 GWh§! přebytečné energie pro období nízké výroby."
 fuel_silos: "Základní rafinace"
 fuel_silos_desc: "Kvůli ekologickým obavám a rostoucím cenám ropy se rafinerie zaměřují na vyšší efektivitu a využití různorodějších surovin."
 fuel_refining: "Rafinace paliv I"
 fuel_refining_desc: "Pokroky v chemickém krakování zvyšují výtěžnost lehkých paliv."
 fuel_refining2: "Rafinace paliv II"
 fuel_refining2_desc: "Lepší plánování rafinerií snižuje plýtvání palivy."
 fuel_refining3: "Rafinace paliv III"
 fuel_refining3_desc: "Zlepšené metody zpětného získávání umožňují výrobu paliv z vedlejších produktů."
 fuel_refining4: "Rafinace paliv IV"
 fuel_refining4_desc: "Nové poznatky v chemickém inženýrství umožňují rafinaci paliv z nových zdrojů."
 fuel_refining5: "Rafinace paliv V"
 fuel_refining5_desc: "Nové postupy a efektivnější konstrukce rafinerií výrazně zvyšují kapacitu a snižují ztráty."
 fuel_refining6: "Rafinace paliv VI"
 fuel_refining6_desc: "Další optimalizace procesů maximalizuje průchodnost rafinerií a minimalizuje plýtvání."
 fuel_refining7: "Rafinace paliva VII" # todo: NEW TRANSLATION
 fuel_refining7_desc: "Další změny v destilaci bionafty a univerzálního paliva nám mohou umožnit získat více paliva, které hoří čistěji a účinněji." # todo: NEW TRANSLATION
 fuel_refining8: "Rafinace paliva VIII" # todo: NEW TRANSLATION
 fuel_refining8_desc: "Použití analýzy procesu vylepšené umělou inteligencí zvyšuje účinnost." # todo: NEW TRANSLATION
 fuel_refining9: "Rafinace paliva IX" # todo: NEW TRANSLATION
 fuel_refining9_desc: "Mikromanagement rafinačního procesu pomocí umělé inteligence výrazně snižuje plýtvání zdroji." # todo: NEW TRANSLATION
 fuel_refining10: "Rafinace paliva X" # todo: NEW TRANSLATION
 fuel_refining10_desc: "Kvantové výpočty a analýza rafinace v reálném čase zvyšují čistotu paliva." # todo: NEW TRANSLATION
 fuel_refining11: "Rafinace paliva XI" # todo: NEW TRANSLATION
 fuel_refining11_desc: "Průlom v chemickém výzkumu s pomocí superinteligence umožňuje vyrábět palivo s maximální účinností." # todo: NEW TRANSLATION
 construction1: "Výstavba I"
 construction1_desc: "Zlepšené metody a materiály nám umožňují stavět civilní i vojenské budovy rychleji."
 construction2: "Výstavba II"
 construction2_desc: "Modernizace nástrojů a vybavení dále zefektivní naše stavební úsilí."
 construction3: "Výstavba III"
 construction3_desc: "Zavedení moderních vozidel a zkušenosti získané z předchozího vývoje umožňují výrazně rychlejší opravy."
 construction4: "Výstavba IV"
 construction4_desc: "Vyšší míra mechanizace a lepší pracovní postupy dále zvyšují rychlost výstavby."
 construction5: "Výstavba V"
 construction5_desc: "Budoucnost efektivní výstavby vyžaduje důkladnější plánování jednotlivých projektů a maximální využití standardizovaných řešení."
 construction6: "Výstavba VI"
 construction6_desc: "Další rozvoj nových stavebních technologií zlepší naše schopnosti v civilní i vojenské výstavbě."
 construction7: "Výstavba VII"
 construction7_desc: "Další rozvoj nových stavebních technologií zlepší naše schopnosti v civilní i vojenské výstavbě."
 construction8: "Výstavba VIII"
 construction8_desc: "Další rozvoj nových stavebních technologií zlepší naše schopnosti v civilní i vojenské výstavbě."
 construction9: "Výstavba IX"
 construction9_desc: "Další rozvoj nových stavebních technologií zlepší naše schopnosti v civilní i vojenské výstavbě."
 construction10: "Stavebnictví X" # todo: NEW TRANSLATION
 construction10_desc: "Vysoce automatizovaná staveniště využívají plánování pomocí umělé inteligence, robotickou montáž a inteligentní logistiku ke koordinaci strojů, materiálů a pracovníků, čímž výrazně zrychlují rozvoj velkých infrastrukturních projektů." # todo: NEW TRANSLATION
 construction11: "Stavebnictví XI" # todo: NEW TRANSLATION
 construction11_desc: "Stavebnictví nové generace integruje samo-monitorovací materiály, adaptivní konstrukční prvky a automatizované opravné systémy, které umožňují kritickým zařízením odhalovat poškození, posilovat slabá místa a zůstat provozuschopnými i při zatížení." # todo: NEW TRANSLATION
 construction12: "Stavebnictví XII" # todo: NEW TRANSLATION
 construction12_desc: "Budoucí stavebnictví využívá autonomní roje stavitelů, programovatelné materiály a konstrukční systémy navržené umělou inteligencí k rychlé výstavbě odolných megaprojektů, opevněných vojenských zařízení a pokročilých průmyslových komplexů." # todo: NEW TRANSLATION
 excavation1: "Těžba I"
 excavation1_desc: "Pokrok v technikách vrtání nám umožňuje těžit suroviny, které byly dříve nedostupné."
 excavation2: "Těžba II"
 excavation2_desc: "Nové metody zvyšují efektivitu těžby a snižují poškození surovin při jejich získávání, což vede k vyšším výnosům."
 excavation3: "Těžba III"
 excavation3_desc: "Pokrok v geologii nám pomáhá přesněji určovat polohu ložisek a soustředit těžbu na nejperspektivnější oblasti."
 excavation4: "Těžba IV"
 excavation4_desc: "Automatizace klíčových procesů a rozvoj mechaniky výrazně zvyšují efektivitu všech našich těžebních provozů."
 excavation5: "Těžba V"
 excavation5_desc: "Pokrok v oblastech, jako je povrchová těžba, nám umožňuje získat větší množství surovin ze stávajících nalezišť."
 excavation6: "Těžba VI"
 excavation6_desc: "Další zdokonalení těžebních a extrakčních metod umožňuje získávat stále více surovin z přírodních ložisek."
 excavation7: "Těžba VII"
 excavation7_desc: "Další zdokonalení těžebních a extrakčních metod umožňuje získávat stále více surovin z přírodních ložisek."
 excavation8: "Těžba VIII"
 excavation8_desc: "Další zdokonalení těžebních a extrakčních metod umožňuje získávat stále více surovin z přírodních ložisek."
 excavation9: "Těžba IX"
 excavation9_desc: "Další zdokonalení těžebních a extrakčních metod umožňuje získávat stále více surovin z přírodních ložisek."
 excavation10: "Výkop X" # todo: NEW TRANSLATION
 excavation10_desc: "Výkopové práce podporované umělou inteligencí využívají prediktivní geologii, automatizované vzorce vrtání a optimalizované zpracovatelské postupy ke zvýšení výtěžnosti z komplexních ložisek a zároveň omezení ztrát materiálu a prostojů zařízení." # todo: NEW TRANSLATION
 excavation11: "Výkop XI" # todo: NEW TRANSLATION
 excavation11_desc: "Robotické systémy hlubinné těžby využívají autonomní vrtné soupravy, nakladače, mapovací drony a střediska dálkového řízení k využívání hlubších a nebezpečnějších ložisek s menším počtem pracovníků vystavených nebezpečným podmínkám." # todo: NEW TRANSLATION
 excavation12: "Výkop XII" # todo: NEW TRANSLATION
 excavation12_desc: "Budoucí výkopové práce využívají robotické flotily řízené umělou inteligencí, přesné mapování zdrojů a pokročilou separaci materiálů k získávání kovů, minerálů a strategických zdrojů z vyčerpaných, komplexních nebo extrémních ložisek." # todo: NEW TRANSLATION
 land_fort_building_1: "HESCO bastiony"
 land_fort_building_1_desc: "HESCO Bastion (také známý jako Concertainer) je gabionový fortifikační systém vyvinutý britskou společností HESCO. Skládá se z velkého pytle obklopeného drátěnou konstrukcí, který lze plnit ručně nebo těžkou technikou a rychle z něj budovat obranné zdi kolem vojenských základen."
 land_fort_building_2: "Bremerovy zdi"
 land_fort_building_2_desc: "Bremerovy zdi (neboli T-zdi) jsou masivní betonové panely ve tvaru písmene T, které lze snadno sestavit do souvislé ochranné stěny. Poskytují ochranu proti palbě z ručních zbraní i dělostřelectva a vyrábějí se v různých výškách od 12 do 20 stop."
 land_fort_building_3: "Automatizované strážní věže"
 land_fort_building_3_desc: "Vývojem zbraňových systémů vybavených kamerami můžeme nasadit automatické strážní zbraně, které samy rozpoznají a zaměří nepřátelské cíle. Rozhodnutí o střelbě však stále zůstává na lidském operátorovi."
 land_fort_building_4: "Doktrína totální obrany"
 land_fort_building_4_desc: "Namísto pouhé výstavby opevnění je třeba vnímat celé bojiště jako fortifikaci určenou k přetvoření. Každý dům se může stát bunkrem, každý sklep skladištěm zbraní, každý balvan protitankovou překážkou a každý strom pozorovacím stanovištěm. Plným využitím prostředí lze proměnit celé bojiště ve smrtící past pro nepřítele."
 stronghold_building_1: "Celostátní obranné přípravy"
 stronghold_building_1_desc: "Zatímco vojenská opevnění se obvykle budují na taktických pozicích, musíme zohlednit i strategickou obranu celé země. Předběžným plánováním, výstavbou krytů, tunelů, jeskyní a infrastruktury, kterou lze snadno zničit či vojensky využít, výrazně zvýšíme připravenost armády na válku."
 integrated_transportation_system: "Integrovaný dopravní systém"
 integrated_transportation_system_desc: "S příchodem nové vlny technologií je nutné integrovat železniční systémy se zbytkem infrastruktury, aby logistika zůstala funkční a odolná."
 post_conventional_rail: "Postkonvenční železnice"
 post_conventional_rail_desc: "Informační technologie nového tisíciletí umožňují, aby logistika a infrastruktura fungovaly plynuleji než kdykoli dříve."
 early_high_speed_rail: "Raný vysokorychlostní železniční systém"
 early_high_speed_rail_desc: "Vysokorychlostní železnice představují logický další krok v logistickém rozvoji. Pečlivě plánované tratě a moderní stavební technika umožňují rychlejší přesun na velké vzdálenosti."
 high_speed_rail: "Vysokorychlostní železnice"
 high_speed_rail_desc: "Další rozšiřování a zdokonalování vysokorychlostních tratí umožňuje řešit provozní problémy a získat cenné zkušenosti pro další plánování."
 modern_high_speed_rail: "Moderní vysokorychlostní železnice"
 modern_high_speed_rail_desc: "Moderní materiály, technologie, komunikace a rozsáhlé plánování posouvají vysokorychlostní železnici na novou úroveň. Tyto systémy zvyšují mobilitu obyvatelstva i ozbrojených sil."
 early_maglev_rail: "Standardizovaná magnetická dráha"
 early_maglev_rail_desc: "Vlaky Maglev se nepohybují klasickým pohonem, ale využívají elektromagnetické síly k nadnášení a pohybu nad kolejí. Tento systém šetří prostor a je snadno udržovatelný."
 standardised_maglev_rail: "Zdokonalená magnetická dráha"
 standardised_maglev_rail_desc: "Standardizované projekty Maglev prokázaly možnost jejich celostátního nasazení. Integrace a sjednocení těchto systémů otevírá cestu k masivnímu rozšíření krátkých i dálkových tratí."
 rail_8: "Vylepšená maglev železnice" # todo: NEW TRANSLATION
 rail_8_desc: "Pokroky v bezpečnosti maglevu umožnily nahradit dálkovou železnici maglevem." # todo: NEW TRANSLATION
 rail_9: "Vysokorychlostní maglev železnice" # todo: NEW TRANSLATION
 rail_9_desc: "Nyní je možné zavést vysokorychlostní maglev napříč celými státy." # todo: NEW TRANSLATION
 rail_10: "Podzvuková maglev železnice" # todo: NEW TRANSLATION
 rail_10_desc: "Vzdálenosti napříč státem se při každodenním dojíždění staly jen drobnou nepříjemností díky téměř nadzvukovým rychlostem." # todo: NEW TRANSLATION
 rail_11: "Nadzvuková maglev železnice" # todo: NEW TRANSLATION
 rail_11_desc: "Vývoj technologie maglevu nám umožnil cestovat na druhou stranu planety během dvou hodin." # todo: NEW TRANSLATION
 gps_agricultural_applications: "GPS aplikace v zemědělství"
 gps_agricultural_applications_desc: "Využití GPS v zemědělství umožňuje přesné mapování polí, cest, zavlažování a problémových oblastí, čímž zvyšuje efektivitu precizního hospodaření."
 automated_irrigation_systems: "Automatizované zavlažovací systémy"
 automated_irrigation_systems_desc: "Automatizace zavlažování snižuje pracovní zátěž zemědělských pracovníků a umožňuje jim soustředit se na údržbu a zlepšování úrody."
 farming_data_analytic_softwares: "Analytický software pro zemědělství"
 farming_data_analytic_softwares_desc: "Nové analytické nástroje pomáhají vyhodnocovat úspěšnost plodin, selhání úrody i účinnost pesticidů, čímž výrazně zvyšují produktivitu zemědělství."
 limited_automated_harvesting_software: "Omezené automatizované sklizňové technologie"
 limited_automated_harvesting_software_desc: "Zavedení základní automatizace sklizně umožňuje přesunout pracovní sílu na náročnější úkoly, zatímco rutinní práce vykonávají stroje a drony."
 satellite_based_agricultural_planning: "Satelitní plánování zemědělství"
 satellite_based_agricultural_planning_desc: "Využití satelitních snímků a dat umožňuje detailní plánování polí a maximalizaci výnosů."
 programmable_harvesters: "Programovatelné sklízecí stroje"
 programmable_harvesters_desc: "Nový software umožňuje automatizovat práci kombajnů a sklízečů, zatímco obsluha dohlíží na provoz, čímž se zvyšuje produktivita a snižuje chybovost."
 improved_harvesting_automation: "Zdokonalená automatizace sklizně"
 improved_harvesting_automation_desc: "Další rozšíření automatizace sklizňových procesů výrazně uvolňuje kapacity zemědělské pracovní síly."
 robotic_harvesters: "Robotické sklízecí stroje"
 robotic_harvesters_desc: "Nasazení robotických pracovníků v zemědělství výrazně zvyšuje produktivitu a umožňuje přesun pracovníků do jiných klíčových odvětví."
 agi_maintained_agricultural_developments: "Zemědělský rozvoj řízený AGI"
 agi_maintained_agricultural_developments_desc: "Díky rozvoji obecné umělé inteligence (AGI) lze zemědělství téměř plně automatizovat při zachování mimořádně vysoké produkce potravin."
 agriculture_10: "Nanoboti s AGI" # todo: NEW TRANSLATION
 agriculture_10_desc: "Zemědělské systémy AGI řídí legii nanobotů, kteří kontrolují stav plodin a bojují proti škůdcům." # todo: NEW TRANSLATION
 agriculture_11: "Umělá zemědělská stanoviště" # todo: NEW TRANSLATION
 agriculture_11_desc: "Zemědělský sektor je revolučně proměňován rozsáhlými skleníky provozovanými téměř výhradně umělou inteligencí, což umožňuje produkci prakticky jakékoli plodiny na jakémkoli místě planety." # todo: NEW TRANSLATION
 agriculture_12: "Zemědělské superkomplexy" # todo: NEW TRANSLATION
 agriculture_12_desc: "Další rozvoj zemědělských stanovišť vedl k rozšíření tohoto konceptu na megastruktury schopné soustředit produkci celého státu do jediné oblasti." # todo: NEW TRANSLATION
 agriculture_13: "Vesmírné farmy" # todo: NEW TRANSLATION
 agriculture_13_desc: "Zemědělské komplexy můžeme přesunout do vesmíru, bez omezení, která zemědělství na planetě přináší. To nám také umožní snadno podporovat průzkum vesmíru a osidlovat celý vesmír." # todo: NEW TRANSLATION
 INFANTRY_TITLE_WEAPONS: "LEHKÉ ZBRANĚ"
 INFANTRY_TITLE_WEAPONS_DESC: "Každý voják je především střelec. Lehké zbraně zahrnují vše od hlavních útočných pušek až po pokročilé odstřelovací pušky a pistole."
 INFANTRY_TITLE_UTILITY_VEHICLES: "UŽITKOVÁ VOZIDLA"
 INFANTRY_TITLE_UTILITY_VEHICLES_DESC: "Užitková vozidla jsou nákladní automobily, džípy a obrněná auta, která naše motorizovaná pěchota používá jako bojové transportéry a k omezené palebné podpoře."
 INFANTRY_TITLE_SUPPORT_WEAPONS: "PODPŮRNÉ ZBRANĚ"
 INFANTRY_TITLE_SUPPORT_WEAPONS_DESC: "Podpůrné zbraně zahrnují minomety, kulomety a přenosné protitankové zbraně, které pomáhají našim jednotkám jak při útoku, tak při obraně."
 INFANTRY_TITLE_SUPPORT_DRONES: "PODPŮRNÉ DRONY"
 INFANTRY_TITLE_SUPPORT_DRONES_DESC: "Podpůrné drony jsou automatizované nebo dálkově ovládané zbraňové platformy, které umožňují bezpečně poskytovat palebnou podporu bez nutnosti vystavovat vojáky přímému nebezpečí."
 INFANTRY_TITLE_nvg: "NOČNÍ VIDĚNÍ"
 INFANTRY_TITLE_nvg_DESC: "Přístroje nočního vidění jsou nezbytné pro umožnění operací našich jednotek v naprosté tmě."
 INFANTRY_TITLE_AUGMENTED_VISION: "ROZŠÍŘENÉ VIDĚNÍ"
 INFANTRY_TITLE_AUGMENTED_VISION_DESC: "Displeje rozšířené a virtuální reality integrované do přileb poskytují vojákům cenná data z bojiště v reálném čase."
 INFANTRY_TITLE_SPECIAL: "SPECIÁLNÍ SÍLY"
 INFANTRY_TITLE_SPECIAL_DESC: "Naše speciální jednotky představují absolutní špičku. Poskytnutí unikátních zbraní a vybavení z nich udělá ještě efektivnější sílu."
 INFANTRY_TITLE_COMMAND: "VYBAVENÍ VELENÍ A ŘÍZENÍ"
 INFANTRY_TITLE_COMMAND_DESC: "Vybavení velení a řízení zahrnuje rádia, počítače a další komunikační prostředky nezbytné pro udržení organizovanosti našich armád."
 INFANTRY_TITLE_COMBAT_ENGI: "ŽENIJNÍ VYBAVENÍ"
 INFANTRY_TITLE_COMBAT_ENGI_DESC: "Bojoví ženisté pomáhají našim jednotkám budovat obranná opevnění a ničit nepřátelské překážky."
 INFANTRY_TITLE_DRONES: "DRONY"
 INFANTRY_TITLE_DRONES_DESC: "Malé drony vypouštěné a ovládané pěchotou výrazně zvyšují situační povědomí o průběhu boje."
 INFANTRY_TITLE_BODY_ARMOUR: "TĚLOVÉ PANCÍŘE"
 INFANTRY_TITLE_BODY_ARMOUR_DESC: "Vybavení jednotek tělovou pancéří zvyšuje jejich šanci přežít zásahy, které by jinak byly smrtelné."
 INFANTRY_TITLE_EXOSKELETON: "EXOSKELET"
 INFANTRY_TITLE_EXOSKELETON_DESC: "Exoskelety jsou poháněné obleky, které zvyšují sílu, rychlost a obratnost svého nositele."
 INFANTRY_TITLE_CAMOUFLAGE: "MASKOVÁNÍ"
 INFANTRY_TITLE_CAMOUFLAGE_DESC: "Maskování zahrnuje vzory vojenských uniforem i maskovací sítě a kryty pro techniku. Pokročilé formy maskování umožňují skrýt jednotky i před moderními detekčními systémy."
 armor_subtitle_hull: "TANKY"
 armor_subtitle_hull_desc: "Hlavní bitevní tanky jsou nejtěžšími pozemními vozidly, která mohou naše ozbrojené síly nasadit. Slouží k palebné podpoře jednotek a k boji proti nepřátelské obrněné technice."
 armour_subtitle_computer: "POČÍTAČ. SYSTÉMY"
 armour_subtitle_computer_desc: "Počítačové systémy zahrnují zaměřovací zařízení, systémy řízení palby, kamery a další elektronické prvky nezbytné pro provoz obrněných vozidel."
 armour_subtitle_ammo: "MUNICE"
 armour_subtitle_ammo_desc: "Munice zahrnuje modernizované typy střeliva a bojové náklady zvyšující bojovou efektivitu jednotek."
 armour_subtitle_armour: "POKROČ. OCHRANA"
 armor_subtitle_armour_desc: "Pokročilé pancéřování zahrnuje kompozitní a reaktivní pancíř, který poskytuje vyšší ochranu než klasická ocel nebo hliník."
 armour_subtitle_engine: "MOTORY"
 armour_subtitle_engine_desc: "Motory zajišťují pohyb vozidel. Většina obrněné techniky využívá dieselové motory, avšak k dispozici jsou i pokročilejší alternativy."
 armour_subtitle_weapons: "TANKOVÉ ZBRANĚ"
 armour_subtitle_weapons_desc: "Tanky využívají jako hlavní výzbroj kanóny různých ráží, od menších 90mm až po masivní 152mm kanóny."
 armor_subtitle_afv_hull: "OBRNĚNÉ VOZIDLA"
 armor_subtitle_afv_hull_desc: "Bojová obrněná vozidla zahrnují BVP (bojová vozidla pěchoty) a OT (obrněné transportéry). První poskytují palebnou podporu a průlomovou sílu, druhé slouží především jako bojová taxislužba s omezenou palebnou podporou."
 armour_subtitle_afv_weapons: "VÝZBROJ OBRNĚNÝCH VOZIDEL"
 armour_subtitle_afv_weapons_desc: "Nejčastější výzbrojí BVP a OT jsou různé typy automatických kanónů, přičemž kulomety a velkorážové útočné kanóny se vyskytují méně často."
 armour_subtitle_medium_tank_destroyer_chassiss: "LEHKÉ TANKY"
 armour_subtitle_medium_tank_destroyer_chassiss_desc: "Lehké tanky poskytují palebnou podporu v terénu, který je pro hlavní bitevní tanky příliš obtížný."
 MD_ARTILLERY_TITLE: "TAŽENÉ DĚLOSTŘELECTVO"
 MD_ARTILLERY_TITLE_DESC: "Dělostřelectvo představuje hlavní prvek palebné podpory našich jednotek. Starší systémy vyžadují přesun pomocí vozidel nebo ručně, zatímco modernější varianty disponují vlastním pohonem pro rychlé přesuny na krátké vzdálenosti."
 ARTILLERY_SP_TITLE: "SAMOHYBNÉ DĚLOSTŘELECTVO"
 ARTILLERY_SP_TITLE_DESC: "Samohybné dělostřelecké systémy jsou děla umístěná na podvozcích tanků nebo nákladních vozidel, což jim poskytuje vyšší mobilitu, větší zásobu munice a lepší ochranu obsluhy."
 ARTILLERY_TITLE_LIGHT_AT: "LEHKÉ PROTIT. STŘELY"
 ARTILLERY_TITLE_LIGHT_AT_DESC: "Lehké PTŘS jsou protitankové zbraně dostatečně lehké pro nošení jednotlivými vojáky nebo zbraňovými týmy. Představují hlavní těžkou protitankovou výzbroj pěchoty v situacích, kdy běžné přenosné zbraně nestačí."
 ARTILLERY_TITLE_HEAVY_AT: "TĚŽKÉ PROTIT. STŘELY"
 ARTILLERY_TITLE_HEAVY_AT_DESC: "Těžké PTŘS jsou výrazně výkonnější než jejich lehké protějšky. Kvůli své hmotnosti a rozměrům musí být přepravovány a nasazovány z vozidel."
 ARTILLERY_TITLE_SP_AA: "SAMOHYBNÁ PVO"
 ARTILLERY_TITLE_SP_AA_DESC: "Samohybné protiletadlové systémy poskytují mobilní a výrazně silnější ochranu proti nepřátelským letounům než přenosné systémy protivzdušné obrany."
 ARTILLERY_TITLE_AA: "PŘENOSNÁ PVO"
 ARTILLERY_TITLE_AA_desc: "Přenosné protiletadlové systémy (MANPADS) jsou lehké zbraně určené k ničení letadel, vrtulníků a střel. Oproti specializovaným protiletadlovým systémům mají kratší dosah a nižší účinnost."
 NAVAL_TITLE_PATROLBOATS: "HLÍDKOVÉ ČLUNY" # todo: NEW TRANSLATION
 NAVAL_TITLE_PATROLBOATS_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_CORVETTES: "KORVETY"
 NAVAL_TITLE_CORVETTES_DESC: "Nejmenší třída plavidel považovaná za válečné lodě. Korvety obvykle nejsou součástí oceánských (blue water) námořnictev. Tyto malé a rychlé lodě jsou vyzbrojeny různými typy zbraní, což jim umožňuje plnit širokou škálu úkolů. Díky své cenové dostupnosti je může provozovat mnoho malých a středně velkých námořnictev. Typicky se používají k: pobřežní obraně a hlídkování, odminování, protiponorkovému boji, protiletadlové obraně, boji proti hladinovým cílům a v moderní době i k úderům na pozemní cíle."
 NAVAL_TITLE_STEALTH_CORVETTES: "STEALTH KORVETY"
 NAVAL_TITLE_STEALTH_CORVETTES_DESC: "Korvety vybavené stealth technologiemi, které jim umožňují vyhýbat se detekci nepřátelskými senzory."
 NAVAL_TITLE_FRIGATES: "FREGATY"
 NAVAL_TITLE_FRIGATES_DESC: "Tvoří páteř mnoha moderních námořnictev. Fregaty mají delší dosah a jsou větší než korvety, což jim umožňuje operovat v oceánských flotilách. Nejčastěji slouží k obraně flotily, ale díky své modularitě mohou plnit široké spektrum rolí, včetně útočných úkolů. Typické nasazení: obrana flotily, protiponorkový boj, protiletadlová obrana a doprovod konvojů."
 NAVAL_TITLE_STEALTH_FRIGATES: "STEALTH FREGATY"
 NAVAL_TITLE_STEALTH_FRIGATES_DESC: "S rostoucí úrovní detekčních systémů je nezbytné vybavit naše fregaty stealth technologiemi, aby byly obtížněji zjistitelné nepřítelem."
 NAVAL_TITLE_HEAVY_FRIGATES: "TĚŽKÉ FREGATY" # todo: NEW TRANSLATION
 NAVAL_TITLE_HEAVY_FRIGATES_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_DESTROYERS: "TORPÉDOBOR."
 NAVAL_TITLE_DESTROYERS_DESC: "Rychlé, obratné a vysoce vytrvalé válečné lodě určené k doprovodu větších plavidel ve flotilách, konvojích a bojových svazech. Jsou schopné i samostatného nasazení. Moderní torpédoborce nesou širokou škálu řízených střel a představují skutečné víceúčelové bojové lodě. Jsou těžší a výrazně útočnější než fregaty či korvety. Použití závisí na výzbroji: obrana flotily, útočné operace, protiletadlový, protilodní, protiponorkový boj a údery na pozemní cíle."
 NAVAL_TITLE_STEALTH_DESTROYERS: "STEALTH TORPÉDOBOR."
 NAVAL_TITLE_STEALTH_DESTROYERS_DESC: "Moderní válčení vyžaduje vyšší míru přežití. Stealth torpédoborce jsou navrženy tak, aby zůstaly skryté před pokročilými radary a senzory, což jim umožňuje udeřit blíže, rychleji a s vyšší účinností při současném zvýšení přežití v moderních konfliktech."
 NAVAL_TITLE_CRUISERS: "KŘIŽNÍKY"
 NAVAL_TITLE_CRUISERS_DESC: "Jedny z největších útočných lodí moderních flotil (kromě letadlových a výsadkových lodí). Křižníky disponují rozsáhlým arzenálem a pokročilými systémy velení a řízení, často slouží jako základ bojových svazů. Tradičně zaměřené na protivzdušnou obranu, dnes zvládají široké spektrum úkolů. Typické nasazení: velení a řízení, protiletadlový a protilodní boj, údery na pozemní cíle."
 NAVAL_TITLE_BATTLESHIPS: "BITEVNÍ LODĚ / BITEVNÍ KŘIŽNÍKY"
 NAVAL_TITLE_BATTLESHIPS_DESC: "Bitevní lodě a bitevní křižníky jsou relikty minulosti. Přestože kdysi vládly oceánům, rozvoj letectva a raketových zbraní z nich učinil snadné cíle. S dostatečným technologickým pokrokem by však mohly opět sehrát významnou roli."
 NAVAL_TITLE_HELI_OPERATORS: "HELIKOPTEROVÉ NOSIČE"
 NAVAL_TITLE_HELI_OPERATORS_DESC: "Víceúčelové obojživelné útočné lodě připomínající letadlové lodě, avšak s nižšími náklady na výrobu i obsluhu. Jsou schopny provozovat vrtulníky, letouny STOVL a výsadková plavidla. Mnohé disponují zaplavitelným dokem pro rychlé obojživelné operace. Poskytují významný bonus při obojživelných výsadcích. Typické nasazení: velení a řízení, protiponorkový boj, hladinový boj, letecké operace, pobřežní bombardování a podpora výsadků."
 NAVAL_TITLE_CARRIERS: "LETADLOVÉ LODĚ"
 NAVAL_TITLE_CARRIERS_DESC: "Plovoucí letecké základny představující vrchol námořní síly. Umožňují projekci moci po celém světě a jsou symbolem síly státu. Tyto extrémně cenné prostředky musí být chráněny za každou cenu. K plnému využití vyžadují silný oceánský bojový svaz. Typické nasazení: globální projekce síly, letecký boj, hladinový boj a obojživelné operace."
 NAVAL_TITLE_ATTACK_SUBMARINES: "ÚTOČNÉ PONORKY"
 NAVAL_TITLE_ATTACK_SUBMARINES_DESC: "Tichí zabijáci světových oceánů. Tyto podmořské platformy kombinují stealth, průzkum a zbraňové systémy. Útočné ponorky se specializují na boj proti nepřátelským ponorkám a lodím na kratší vzdálenosti."
 NAVAL_TITLE_MISSILE_SUBMARINES: "RAKETOVÉ PONORKY"
 NAVAL_TITLE_MISSILE_SUBMARINES_DESC: "Tichí zabijáci oceánů vybavení pokročilými zbraňovými systémy. Raketové ponorky disponují výrazně vyššími schopnostmi než útočné ponorky, zejména v oblasti strategických úderů."
 NAVAL_TITLE_SUB_ENGINES: "PONORKOVÉ MOTORY"
 NAVAL_TITLE_SUB_ENGINES_DESC: "Ponorky obvykle používají dieselové motory pro plavbu na hladině a dobíjení baterií. Při ponoření jsou poháněny elektrickými motory."
 NAVAL_TITLE_SYSTEM_ENGINEERING: "SYSTÉMOVÉ INŽENÝRSTVÍ"
 NAVAL_TITLE_SYSTEM_ENGINEERING_DESC: "Systémové inženýrství zahrnuje všechny podpůrné systémy lodí, jako jsou motory, elektronika a radarové vybavení."
 NAVAL_TITLE_DIESEL_ENGINES: "DIESELOVÉ LODNÍ MOTORY" # todo: NEW TRANSLATION
 NAVAL_TITLE_DIESEL_ENGINES_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_TURBINE_ENGINES: "TURBÍNOVÉ LODNÍ MOTORY" # todo: NEW TRANSLATION
 NAVAL_TITLE_TURBINE_ENGINES_DESC: "Lodě obvykle pohánějí obrovské dieselové nebo turbínové motory, případně kombinace obojího." # todo: NEW TRANSLATION
 NAVAL_TITLE_NUCLEAR_ENGINES: "JADERNÉ POHONY"
 NAVAL_TITLE_NUCLEAR_ENGINES_DESC: "Jaderné pohony poskytují prakticky neomezený dojezd, což umožňuje lodím operovat tak dlouho, dokud mají zásoby pro posádku."
 NAVAL_TITLE_FUSION_ENGINES: "FÚZNÍ MOTORY" # todo: NEW TRANSLATION
 NAVAL_TITLE_FUSION_ENGINES_DESC: "Jaderné motory mají v podstatě neomezené palivo, což našim lodím umožňuje operovat na oceánu tak dlouho, dokud mají námořníci na palubě dostatek zásob." # todo: NEW TRANSLATION
 NAVAL_TITLE_INTERNAL_DEFENSES: "ŘÍZENÍ PALBY"
 NAVAL_TITLE_INTERNAL_DEFENSES_DESC: "Počítače řízení palby zajišťují zaměřování nepřátelských cílů a výpočet trajektorií zásahu."
 NAVAL_TITLE_RADAR: "RADAR"
 NAVAL_TITLE_RADAR_DESC: "Radar využívá rádiové vlny k detekci objektů ve vzduchu i na mořské hladině a umožňuje lodím identifikovat cíle."
 NAVAL_TITLE_RADAR_DRONE: "RADAROVÉ DRONY" # todo: NEW TRANSLATION
 NAVAL_TITLE_RADAR_DRONE_DESC: "Radarové drony prodlužují dosah senzorů lodí za horizont tím, že vynášejí do vzduchu lehké námořní pátrací radary. Zlepšují tak odhalování lodí, letadel, raket a nízko letících hrozeb dříve, než dosáhnou flotily." # todo: NEW TRANSLATION
 NAVAL_TITLE_RADAR_JAM: "RADAROVÉ RUŠIČKY" # todo: NEW TRANSLATION
 NAVAL_TITLE_RADAR_JAM_DESC: "Moduly radarových rušiček instalují na válečné lodě specializovaná elektronická útočná pole, která jim umožňují během boje rušit nepřátelské pátrací radary, zaměřovací senzory a radarově naváděné hlavice raket." # todo: NEW TRANSLATION
 NAVAL_TITLE_SONAR: "SONAR"
 NAVAL_TITLE_SONAR_DESC: "Sonar využívá zvukové vlny k detekci objektů pod hladinou. Používá se především k vyhledávání ponorek, ale také min, torpéd či k měření hloubky."
 NAVAL_TITLE_ARMAMENT: "NÁMOŘNÍ VÝZBROJ"
 NAVAL_TITLE_ARMAMENT_DESC: "Každá loď potřebuje výzbroj. Zatímco dříve dominovala dělostřelecká výzbroj, moderní lodě využívají především různé typy raket, které umožňují i menším plavidlům ohrožovat těžší cíle."
 NAVAL_TITLE_CANNONS: "LODNÍ KANÓNY"
 NAVAL_TITLE_CANNONS_DESC: "Námořní kanóny slouží k boji proti menším cílům na krátkou vzdálenost, jako jsou hlídkové čluny nebo pozemní cíle. Mají i omezené použití proti vzdušným cílům."
 NAVAL_TITLE_RAILGUNS: "RAILGUNY"
 NAVAL_TITLE_RAILGUNS_DESC: "Railguny, resp. kolejnicová děla vystřelují kinetickou munici urychlovanou elektromagnetickými silami na extrémní rychlosti, což zajišťuje vysokou průbojnost a přesnost."
 NAVAL_TITLE_RAILGUNS_BATTERY: "BATERIE KOLEJNICOVÝCH DĚL" # todo: NEW TRANSLATION
 NAVAL_TITLE_RAILGUNS_BATTERY_DESC: "Kolejnicová děla používají kinetickou munici urychlovanou elektromagnetickými vlnami na vysoké rychlosti. Projektil dosahuje neuvěřitelné rychlosti, což mu poskytuje vysokou průbojnost a přesnost." # todo: NEW TRANSLATION
 NAVAL_TITLE_POINT_DEFENSE_SYSTEM: "BODOVÉ OBRANNÉ SYSTÉMY"
 NAVAL_TITLE_POINT_DEFENSE_SYSTEM_DESC: "Bodové obranné systémy chrání lodě před přilétajícími střelami a letouny v případě selhání hlavní protiraketové obrany."
 NAVAL_TITLE_ANTI_DRONE_LASER: "LASERY BODOVÉ OBRANY" # todo: NEW TRANSLATION
 NAVAL_TITLE_ANTI_DRONE_LASER_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_ASM: "PROTILODNÍ STŘELY"
 NAVAL_TITLE_ASM_DESC: "Protilodní střely jsou hlavní zbraní lodí proti jiným plavidlům a zahrnují systémy proti hladinovým i podhladinovým cílům."
 NAVAL_TITLE_AAMISSILES: "PVO STŘELY"
 NAVAL_TITLE_AAMISSILES_DESC: "Protiletecké střely slouží jako hlavní obrana lodí proti vzdušným cílům. Patří sem klasické SAM i systémy RAM určené především proti přilétajícím střelám."
 NAVAL_TITLE_VLS_DRONE: "VERTIKÁLNÍ ODPALOVACÍ SYSTÉMY PRO DRONY" # todo: NEW TRANSLATION
 NAVAL_TITLE_VLS_DRONE_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_VLS_SURFACE: "HLADINOVÉ VLS"
 NAVAL_TITLE_VLS_SURFACE_DESC: "Vertikální odpalovací systémy (VLS) umožňují odpal střel svisle z trupu lodi, což zvyšuje kapacitu výzbroje a snižuje radarovou stopu."
 NAVAL_TITLE_VLS_AIR: "LETECKÉ VLS"
 NAVAL_TITLE_VLS_AIR_DESC: "Vertikální odpalovací systémy (VLS) umožňují odpal střel svisle z trupu lodi, což zvyšuje kapacitu výzbroje a snižuje radarovou stopu."
 NAVAL_TITLE_DRONE_TORPEDO: "DRONOVÁ TORPÉDA" # todo: NEW TRANSLATION
 NAVAL_TITLE_DRONE_TORPEDO_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_TORPEDOES: "TORPÉDA"
 NAVAL_TITLE_TORPEDOES_DESC: "Torpéda jsou podvodní střely používané proti lodím. Nejčastěji jsou odpalována z ponorek, ale také z lodí či letadel."
 NAVAL_TITLE_NUCLEAR_TORPEDO: "JADERNÁ TORPÉDA" # todo: NEW TRANSLATION
 NAVAL_TITLE_NUCLEAR_TORPEDO_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_ANTI_TORPEDOES: "PROTITORPÉDOVÁ TORPÉDA" # todo: NEW TRANSLATION
 NAVAL_TITLE_ANTI_TORPEDOES_DESC: "" # todo: NEW TRANSLATION
 NAVAL_TITLE_LANDING_CRAFT: "VÝSADKOVÁ PLAVIDLA"
 NAVAL_TITLE_LANDING_CRAFT_DESC: "Výsadková plavidla jsou nezbytná pro obojživelné operace. Patří sem rychlé čluny, specializovaná výsadková plavidla, vznášedla i velké lodě schopné vysadit více vozidel najednou."
 AIR_TITLE_TRANSPORT_HELICOPTER: "TRANSPORTNÍ\nVRTULNÍKY"
 AIR_TITLE_TRANSPORT_HELICOPTER_DESC: "Transportní vrtulníky umožňují vytvářet vysoce mobilní jednotky. Umožňují rychlý přesun jednotek přes různorodý terén, avšak pro efektivní bojové nasazení musí být výsadek proveden mimo bezprostřední dosah nepřítele."
 AIR_TITLE_ATTACK_HELICOPTER: "BITEVNÍ VRTULNÍKY"
 AIR_TITLE_ATTACK_HELICOPTER_DESC: "Bitevní vrtulníky poskytují rychlou palebnou podporu jednotkám a jsou velmi účinné proti tankům. Jsou však zranitelné vůči nepřátelským letounům."
 AIR_TITLE_ENGINE: "MOTORY"
 AIR_TITLE_ENGINE_DESC: "Motory vrtulníků navržené s ohledem na různé výkonové požadavky."
 AIR_TITLE_ATGM: "PROTITANKOVÉ ŘÍZENÉ STŘELY"
 AIR_TITLE_ATGM_DESC: "Protitankové řízené střely určené k odpalování z vrtulníků."
 AIR_TITLE_ANTI_INFANTRY: "KANÓNY A RAKETY"
 AIR_TITLE_ANTI_INFANTRY_DESC: "Raketové bloky, podvěsné kanóny a pevně instalované zbraně určené k ničení pěchoty a lehce obrněných cílů."
 AIR_TITLE_SPECIAL: "SPECIÁLNÍ VYBAVENÍ"
 AIR_TITLE_SPECIAL_DESC: "Speciální vybavení zvyšující bojové schopnosti nebo přežití vrtulníků."
 AIR_TITLE_PLANE_LIGHT_AIRFRAME: "LEHKÉ DRAKY"
 AIR_TITLE_PLANE_LIGHT_AIRFRAME_DESC: "Lehké draky umožňují konstrukci obratných stíhacích letounů a cvičných letadel."
 AIR_TITLE_PLANE_MEDIUM_AIRFRAME: "STŘEDNÍ DRAKY"
 AIR_TITLE_PLANE_MEDIUM_AIRFRAME_DESC: "Střední draky patří mezi nejběžnější konfigurace letadel a umožňují stavbu víceúčelových stíhaček, letounů blízké letecké podpory a dalších typů."
 AIR_TITLE_PLANE_HEAVY_AIRFRAME: "TĚŽKÉ DRAKY"
 AIR_TITLE_PLANE_HEAVY_AIRFRAME_DESC: "Těžké draky se používají pro konstrukci bombardérů, námořních hlídkových letounů, transportních letadel a bitevních letounů."
 AIR_TITLE_PLANE_AVIONICS: "AVIONIKA A DRONY"
 AIR_TITLE_PLANE_AVIONICS_DESC: "Avionika zahrnuje veškeré elektronické řídicí systémy letadel a monitorovací zařízení. Pokročilá avionika umožňuje konstrukci dálkově řízených letounů a dronů schopných samostatně útočit na cíle."
 AIR_TITLE_PLANE_ENGINE: "MOTORY A\nPALIVO"
 AIR_TITLE_PLANE_ENGINE_DESC: "Většina moderních letadel využívá proudové motory, i když existují i jiné možnosti. Dolet lze prodloužit například většími palivovými nádržemi nebo tankováním za letu."
 AIR_TITLE_PLANE_WINGFORM: "TVAR KŘÍDEL A\nMATERIÁLY"
 AIR_TITLE_PLANE_WINGFORM_DESC: "Tvar křídel určuje celkovou aerodynamickou podobu letounu. Různé tvary mají své výhody i nevýhody. Investice do nových materiálů dále zvyšují výkonnost letadel."
 AIR_TITLE_PLANE_NAVWEAP: "NÁMOŘNÍ ZBRANĚ"
 AIR_TITLE_PLANE_NAVWEAP_DESC: "Námořní výzbroj letadel zahrnuje střely, torpéda a miny. Pro boj proti ponorkám musí být letouny vybaveny magnetickým anomálním detektorem (MAD), který dokáže odhalit kovový trup ponorky."
 AIR_TITLE_PLANE_AGWEAP: "VZDUCH-ZEMĚ"
 AIR_TITLE_PLANE_AGWEAP_DESC: "Zbraně vzduch-země zahrnují různé typy střel a pum, přičemž lze využít i kanóny. Pro zvýšení přesnosti lze letouny vybavit zaměřovacími kontejnery (TGP)."
 AIR_TITLE_PLANE_AAWEAP: "VZDUCH-VZDUCH"
 AIR_TITLE_PLANE_AAWEAP_DESC: "Vzdušné souboje jsou dnes vedeny především pomocí střel. Některá letadla mají i kanóny jako záložní výzbroj. Pro obranu proti nepřátelským střelám lze použít klamné cíle a další protiopatření."
