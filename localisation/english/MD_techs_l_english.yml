 GNSS1: "GNSS 1965"
 GNSS1_desc: "Družice určená jako součást satelitní konstelace poskytující globální určování polohy, navigaci a časové služby. Extrémně užitečná pro civilní i vojenské účely.\n\nNavigační družice (GNSS 1965):\nDružice §Y$GNSS1$§! má přesnost §Y5 m§!. Jsou vyžadovány pro §YGNSS systém s přesností 5 m§!."
 GNSS2: "GNSS 1975"
 GNSS2_desc: "Družice určená jako součást satelitní konstelace poskytující globální určování polohy, navigaci a časové služby. Extrémně užitečná pro civilní i vojenské účely.\n\nNavigační družice (GNSS 1975):\nDružice §Y$GNSS2$§! má přesnost §Y2,5 m§!. Jsou vyžadovány pro §YGNSS systém s přesností 2,5 m§!."
