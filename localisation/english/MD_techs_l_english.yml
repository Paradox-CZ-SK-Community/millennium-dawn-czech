 cruise_missile: "Řízené střely"
 cruise_missile_desc: "Řízená střela je bezpilotní samohybní zbraň, která po většinu letu využívá aerodynamický vztlak. Je určena k přesnému doručení těžké bojové hlavice na velké vzdálenosti. Moderní řízené střely mohou létat podzvukovou, nadzvukovou i hypersonickou rychlostí, navigují se autonomně a pohybují se po nebalistické dráze v extrémně malé výšce."
 cruise_missile_non_got: "Řízené střely"
 cruise_missile_non_got_desc: "Řízená střela je bezpilotní samohybní zbraň, která po většinu letu využívá aerodynamický vztlak. Je určena k přesnému doručení těžké bojové hlavice na velké vzdálenosti."
 GLCM: "GLCM"
