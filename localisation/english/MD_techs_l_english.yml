 stealth_frigate_hull_1: "Trup stealth fregaty 2010"
 stealth_frigate_hull_1_desc: "Stealth fregata představuje moderní pojetí třídy fregat navržené pro budoucí bojiště. Díky pokročilým konstrukčním technikám, snížené radarové odrazné ploše, akustickému tlumení a elektronickému boji je plavidlo výrazně hůře zjistitelné a zaměřitelné. Tyto lodě se používají k široké škále úkolů, od protiponorkového boje po průzkum, a jsou cenným přínosem pro každé námořnictvo."
