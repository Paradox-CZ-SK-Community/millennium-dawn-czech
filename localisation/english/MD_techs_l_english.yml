 module_esm_1: "ESM I"
 module_esm_1_desc: "Elektronická podpůrná opatření (ESM) zahrnují detekci, zachycení, identifikaci, záznam, lokalizaci a analýzu zdrojů elektromagnetického záření pro rozpoznání hrozeb."
 module_esm_2: "ESM II"
 module_esm_2_desc: "$module_esm_1_desc$"
 module_esm_3: "ESM III"
 module_esm_3_desc: "$module_esm_1_desc$"
 module_esm_4: "ESM IV" # todo: NEW TRANSLATION
 module_esm_4_desc: "Hyperpokročilá elektronická podpůrná opatření kombinují vysokorychlostní zpracování dat a propojené slučování senzorů, což umožňuje přesnou identifikaci hrozeb, lepší včasné varování a dokonalejší koordinaci s elektronickým bojem a bojovými systémy.\n\n§GTip konstruktéra: ESM zvyšuje odolnost a snižuje viditelnost na hladině, čímž zlepšuje přežití proti odhalení a útokům. Hodí se pro cenné bojové lodě, ale zvyšuje výrobní náklady a vyžaduje mikročipy.§!" # todo: NEW TRANSLATION
 module_esm_5: "ESM V" # todo: NEW TRANSLATION
 module_esm_5_desc: "Ultrapokročilá elektronická podpůrná opatření kombinují vysokorychlostní zpracování dat a propojené slučování senzorů, což umožňuje přesnou identifikaci hrozeb, lepší včasné varování a dokonalejší koordinaci s elektronickým bojem a bojovými systémy.\n\n§GTip konstruktéra: ESM zvyšuje odolnost a snižuje viditelnost na hladině, čímž zlepšuje přežití proti odhalení a útokům. Hodí se pro cenné bojové lodě, ale zvyšuje výrobní náklady a vyžaduje mikročipy.§!" # todo: NEW TRANSLATION
