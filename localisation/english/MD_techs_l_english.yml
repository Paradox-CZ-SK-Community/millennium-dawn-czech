 battle_cruiser: "Bitevní křižníky"
 battle_cruiser_desc: "Hlavní válečná loď 20. století kombinující nejlepší vlastnosti křižníku a bitevní lodi. Je vyzbrojena širokou škálou zbraní a umožňuje výraznou projekci síly při nižších nárocích na zdroje a výrobní kapacity než plnohodnotná bitevní loď."
 battleship: "Bitevní lodě"
 frigate_hull_1: "Trup fregaty 1965"
 frigate_hull_1_desc: "Páteř mnoha moderních námořnictev. Fregaty mohou operovat jako součást oceánských (blue water) sil, mají delší dosah a jsou větší než korvety. Nejčastěji slouží k obraně flotily, ale díky své modularitě mohou plnit širokou škálu úkolů. Typické nasazení: obrana flotily, protiponorkový boj, protiletadlová obrana a doprovod konvojů."
