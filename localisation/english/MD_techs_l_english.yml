 frigate_hull_7: "Trup fregaty 2055" # todo: NEW TRANSLATION
 frigate_hull_7_desc: "Fregaty tvoří jádro mnoha moderních námořních sil a mohou být součástí oceánských flotil. Mají delší dosah a jsou větší než korvety. Ačkoli se nejčastěji používají jako platformy pro obranu flotily, mohou v rámci svazu plnit širokou škálu úloh a lze je přizpůsobit různým požadavkům a situacím včetně útočněji zaměřených úkolů. Obvykle se používají k obraně flotily, protiponorkovým a protiletadlovým operacím a k doprovodu námořních konvojů." # todo: NEW TRANSLATION
 frigate_hull_8: "Trup fregaty 2070" # todo: NEW TRANSLATION
 frigate_hull_8_desc: "Fregaty tvoří jádro mnoha moderních námořních sil a mohou být součástí oceánských flotil. Mají delší dosah a jsou větší než korvety. Ačkoli se nejčastěji používají jako platformy pro obranu flotily, mohou v rámci svazu plnit širokou škálu úloh a lze je přizpůsobit různým požadavkům a situacím včetně útočněji zaměřených úkolů. Obvykle se používají k obraně flotily, protiponorkovým a protiletadlovým operacím a k doprovodu námořních konvojů." # todo: NEW TRANSLATION
 destroyer_hull_1: "Trup torpédoborce 1965"
 destroyer_hull_1_desc: "Rychlé, obratné a vysoce vytrvalé válečné lodě určené k doprovodu větších plavidel i k samostatnému nasazení. Moderní torpédoborce nesou širokou škálu řízených střel a představují skutečné víceúčelové bojové lodě."
 destroyer_hull_2: "Trup torpédoborce 1990"
 destroyer_hull_2_desc: "$destroyer_hull_1_desc$"
