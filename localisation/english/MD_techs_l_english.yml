 cruiser_hull_6: "Trup křižníku 2060" # todo: NEW TRANSLATION
 cruiser_hull_6_desc: "Tyto mocné prostředky, obvykle největší útočné lodě moderní flotily (kromě letadlových a obojživelných útočných lodí), mohou působit na všech světových oceánech a mořích. Historicky byly určeny především k protivzdušné obraně (zatímco torpédoborce měly na starosti boj proti hladinovým cílům), moderní křižníky však disponují neuvěřitelným arzenálem zbraní – větším než kterákoli jiná bojová loď. Křižníky mohou tvořit základ celé bojové skupiny a mají velkou kapacitu pro senzory a systémy řízení boje. Obvykle se používají k velení a řízení, protiletadlovému boji, boji proti lodím a útokům na pozemní cíle." # todo: NEW TRANSLATION
 cruiser_hull_7: "Trup křižníku 2075" # todo: NEW TRANSLATION
 cruiser_hull_7_desc: "Tyto mocné prostředky, obvykle největší útočné lodě moderní flotily (kromě letadlových a obojživelných útočných lodí), mohou působit na všech světových oceánech a mořích. Historicky byly určeny především k protivzdušné obraně (zatímco torpédoborce měly na starosti boj proti hladinovým cílům), moderní křižníky však disponují neuvěřitelným arzenálem zbraní – větším než kterákoli jiná bojová loď. Křižníky mohou tvořit základ celé bojové skupiny a mají velkou kapacitu pro senzory a systémy řízení boje. Obvykle se používají k velení a řízení, protiletadlovému boji, boji proti lodím a útokům na pozemní cíle." # todo: NEW TRANSLATION
