 corvette_hull_7_desc: "Korvety jsou nejmenší třídou plavidel považovanou za válečná plavidla a obvykle nejsou součástí oceánských flotil. Tyto malé a rychlé lodě jsou obvykle vyzbrojeny různými zbraněmi, které jim umožňují plnit řadu úkolů. Díky cenové dostupnosti je může provozovat mnoho zemí s malými a středně velkými námořními silami. Obvykle se používají k obraně pobřeží a průzkumu, odminování, protiponorkovým a protiletadlovým operacím, boji proti lodím a v moderní době také k úderům proti pozemním cílům." # todo: NEW TRANSLATION
 corvette_hull_8: "Trup korvety 2070" # todo: NEW TRANSLATION
 corvette_hull_8_desc: "Korvety jsou nejmenší třídou plavidel považovanou za válečná plavidla a obvykle nejsou součástí oceánských flotil. Tyto malé a rychlé lodě jsou obvykle vyzbrojeny různými zbraněmi, které jim umožňují plnit řadu úkolů. Díky cenové dostupnosti je může provozovat mnoho zemí s malými a středně velkými námořními silami. Obvykle se používají k obraně pobřeží a průzkumu, odminování, protiponorkovým a protiletadlovým operacím, boji proti lodím a v moderní době také k úderům proti pozemním cílům." # todo: NEW TRANSLATION
 stealth_corvette_hull_1: "Trup stealth korvety 2010"
 stealth_corvette_hull_1_desc: "Cože? Ne, tohle není válečná loď, my přece žádné válečné lodě nevyrábíme. To se vám jen zdá; tohle je přece jasně černý sportovní vůz Chevrolet.\n\nStealth korveta staví na výhodách třídy korvet tím, že z malé a obtížně zjistitelné lodě činí ještě hůře detekovatelný cíl pro radarové a sonarové systémy."
