 destroyer_hull_5_desc: "$destroyer_hull_1_desc$"
 destroyer_hull_6: "Trup torpédoborce 2060" # todo: NEW TRANSLATION
 destroyer_hull_6_desc: "Tyto rychlé, obratné válečné lodě s dlouhou výdrží jsou určeny k doprovodu větších plavidel ve flotile, konvoji nebo bojovém svazu, ale stejně dobře dokážou operovat samostatně. Pozdější verze nesou širokou a ničivou škálu řízených raket, střel s plochou dráhou letu a dalších zbraní a jsou skutečně víceúčelovými válečnými loděmi. Mají větší tonáž a útočnější i ničivější palebnou sílu než fregaty nebo korvety. Podle konfigurace se obvykle používají k obraně flotily, útočným úkolům, protiletadlovému, protilodnímu a protiponorkovému boji i k úderům proti pozemním cílům." # todo: NEW TRANSLATION
 destroyer_hull_7: "Trup torpédoborce 2075" # todo: NEW TRANSLATION
 destroyer_hull_7_desc: "Tyto rychlé, obratné válečné lodě s dlouhou výdrží jsou určeny k doprovodu větších plavidel ve flotile, konvoji nebo bojovém svazu, ale stejně dobře dokážou operovat samostatně. Pozdější verze nesou širokou a ničivou škálu řízených raket, střel s plochou dráhou letu a dalších zbraní a jsou skutečně víceúčelovými válečnými loděmi. Mají větší tonáž a útočnější i ničivější palebnou sílu než fregaty nebo korvety. Podle konfigurace se obvykle používají k obraně flotily, útočným úkolům, protiletadlovému, protilodnímu a protiponorkovému boji i k úderům proti pozemním cílům." # todo: NEW TRANSLATION
 stealth_destroyer_hull_1: "Trup stealth torpédoborce 2015"
 stealth_destroyer_hull_1_desc: "Moderní válčení klade důraz na přežití. Stealth torpédoborce jsou navrženy tak, aby se vyhýbaly pokročilým senzorům a radarům, což jim umožňuje udeřit blíže, rychleji a s vyšší účinností."
 stealth_destroyer_hull_2: "Trup stealth torpédoborce 2030"
 stealth_destroyer_hull_2_desc: "$stealth_destroyer_hull_1_desc$"
