 com_satellites: "Komunikační družice"
 com_satellites_desc: "Komunikační družice"
 COMSAT1: "COMSAT 1965"
 COMSAT1_desc: "Umělá družice, která pomocí transpondéru přenáší a zesiluje rádiové telekomunikační signály. Vytváří komunikační kanál mezi vysílačem a přijímačem na různých místech Země.\n\nKomunikační družice (COMSAT 1965):\nDružice §Y$COMSAT1$§! má přenosovou kapacitu §Y56 kbit/s§!. Jsou vyžadovány pro §Ykomunikační systém 56 kbit/s§!."
 COMSAT2: "COMSAT 1975"
 COMSAT2_desc: "Umělá družice, která pomocí transpondéru přenáší a zesiluje rádiové telekomunikační signály. Vytváří komunikační kanál mezi vysílačem a přijímačem na různých místech Země.\n\nKomunikační družice (COMSAT 1975):\nDružice §Y$COMSAT2$§! má přenosovou kapacitu §Y128 kbit/s§!. Jsou vyžadovány pro §Ykomunikační systém 128 kbit/s§!."
 COMSAT3: "COMSAT 1985"
 COMSAT3_desc: "Umělá družice, která pomocí transpondéru přenáší a zesiluje rádiové telekomunikační signály.\n\nKomunikační družice (COMSAT 1985):\nDružice §Y$COMSAT3$§! má přenosovou kapacitu §Y1 Mbit/s§!. Jsou vyžadovány pro §Ykomunikační systém 1 Mbit/s§!."
 COMSAT4: "COMSAT 1995"
 COMSAT4_desc: "Umělá družice, která pomocí transpondéru přenáší a zesiluje rádiové telekomunikační signály.\n\nKomunikační družice (COMSAT 1995):\nDružice §Y$COMSAT4$§! má přenosovou kapacitu §Y10 Mbit/s§!. Jsou vyžadovány pro §Ykomunikační systém 10 Mbit/s§!."
 COMSAT5: "COMSAT 2005"
 COMSAT5_desc: "Umělá družice, která pomocí transpondéru přenáší a zesiluje rádiové telekomunikační signály.\n\nKomunikační družice (COMSAT 2005):\nDružice §Y$COMSAT5$§! má přenosovou kapacitu §Y128 Mbit/s§!. Jsou vyžadovány pro §Ykomunikační systém 128 Mbit/s§!."
 COMSAT6: "COMSAT 2015"
