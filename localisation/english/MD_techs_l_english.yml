 stealth_destroyer_hull_4: "Trup stealthového torpédoborce 2060" # todo: NEW TRANSLATION
 stealth_destroyer_hull_4_desc: "Změny v moderní technologii vedení války přiměly vyspělejší flotily hledat nové způsoby, jak zajistit přežití svých plavidel. Stealthové torpédoborce se staly jednou z hlavních priorit. Skrytí před pokročilými nepřátelskými senzory a radary znamená, že tyto mocné zbraně mohou udeřit z větší blízkosti, rychleji a s vyšší účinností, přičemž zvyšují šanci na přežití v moderních konfliktech." # todo: NEW TRANSLATION
 stealth_destroyer_hull_5: "Trup stealthového torpédoborce 2075" # todo: NEW TRANSLATION
 stealth_destroyer_hull_5_desc: "Změny v moderní technologii vedení války přiměly vyspělejší flotily hledat nové způsoby, jak zajistit přežití svých plavidel. Stealthové torpédoborce se staly jednou z hlavních priorit. Skrytí před pokročilými nepřátelskými senzory a radary znamená, že tyto mocné zbraně mohou udeřit z větší blízkosti, rychleji a s vyšší účinností, přičemž zvyšují šanci na přežití v moderních konfliktech." # todo: NEW TRANSLATION
 stealth_destroyer_1: "Stealth torpédoborec 2015"
 stealth_destroyer_1_desc: "Změny v moderním způsobu vedení války přiměly technologicky vyspělé námořnictva hledat nové způsoby zvýšení přežití svých flotil. Stealth torpédoborce se staly klíčovým směrem vývoje. Schopnost zůstat skryté před pokročilými nepřátelskými senzory a radary umožňuje těmto silně vyzbrojeným lodím útočit blíže, rychleji a s vyšší ničivostí, přičemž zároveň  výrazně roste jejich přežití v moderních konfliktech."
