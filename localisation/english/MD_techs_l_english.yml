 tank_armor_upgrade: "Pancíř"
 tank_armor_upgrade_desc: "Lepší pancéřování, než jaké dokáže nepřítel prorazit, je pro vaše divize obrovskou výhodou, avšak obvykle vede ke snížení mobility."
 tank_gun_upgrade: "Hlavní kanón"
 tank_gun_upgrade_desc: "Je zásadní mít kanón, který drží krok s úrovní nepřátelského pancíře a dokáže jej prorazit."
 tank_reliability_upgrade: "Spolehlivost"
 tank_reliability_upgrade_desc: "Vyšší spolehlivost znamená méně poruch a méně tanků, které je nutné nahrazovat."
 tank_engine_upgrade: "Motor"
 tank_engine_upgrade_desc: "Vyšší mobilita přináší taktické i strategické výhody a umožňuje zesílit pancíř bez výrazné ztráty rychlosti."
 tank_support_weapons_upgrade: "Podpůrná výzbroj"
 tank_cutting_corners_upgrade: "Úspory ve výrobě"
 Util_Weapons: "Hlavní zbraň"
 Util_Weapons_desc: "Je důležité mít zbraň, která dokáže držet krok s pancéřovou ochranou nepřítele a prorazit ji."
 Util_infantry_help_upgrade: "Podpora pěchoty"
 Util_infantry_help_upgrade_desc: "Zlepšení komunikace s pěchotou a rozšíření možností přímé podpory."
 Util_Mobility: "Motor"
 Util_Mobility_desc: "Vyšší mobilita přináší taktické i strategické výhody a umožňuje zesílit pancíř bez výrazného zpomalení."
 Util_cutting_corners_upgrade: "Úspory ve výrobě"
 Util_cutting_corners_upgrade_desc: "Vždy existují místa, kde lze ušetřit, ale nelze očekávat plný výkon po provedení těchto úprav."
 AA_Fire_Control: "Řízení palby"
 AA_Fire_Control_desc: "Lepší řízení palby umožňuje použití většího množství munice a výrazně zvyšuje její přesnost."
