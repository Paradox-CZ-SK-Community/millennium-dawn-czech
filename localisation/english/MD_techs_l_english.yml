 tech_landing_craft_1: "Výsadkové plavidlo" # todo: NEW TRANSLATION
 tech_landing_craft_1_desc: "Výsadkové plavidlo je malá loď, která během obojživelných operací přepravuje vojáky z moře na pobřeží." # todo: NEW TRANSLATION
 tech_landing_craft_2: "Obojživelná útočná loď" # todo: NEW TRANSLATION
 tech_landing_craft_2_desc: "Obojživelná útočná loď je válečné plavidlo používané k poskytování vzdušné a hladinové podpory za frontovou linií během obojživelných operací v nepřátelských pobřežních oblastech." # todo: NEW TRANSLATION
 tech_landing_craft_3: "Výsadkové plavidlo na vzduchovém polštáři" # todo: NEW TRANSLATION
 tech_landing_craft_3_desc: "Při obojživelných operacích mohou tradiční výsadková plavidla lodního typu přistát jen na přibližně 15 % světového pobřeží, zatímco vznášedla vyvinutá po 60. letech dosáhnou až na 70 %. Jejich přizpůsobivost se proto výrazně zvýšila. Zároveň jsou rychlejší než tradiční výsadková plavidla a mohou přepravovat hlavní bojové tanky i krýt námořní pěchotu na pobřeží. Vznášedla zcela změnila pravidla hry při obojživelném vylodění." # todo: NEW TRANSLATION
 tech_landing_craft_4: "Moderní výsadkové plavidlo" # todo: NEW TRANSLATION
 tech_landing_craft_4_desc: "Zavedení moderních technologií umožnilo významný rozvoj výkonu výsadkových plavidel a výrazně zlepšilo efektivitu obojživelných vylodění." # todo: NEW TRANSLATION
 tech_landing_craft_5: "Specializované ochranné vybavení" # todo: NEW TRANSLATION
 tech_landing_craft_5_desc: "Speciální ochranné vybavení může výrazně zvýšit schopnost výsadkových plavidel přežít." # todo: NEW TRANSLATION
 tech_landing_craft_6: "Systémy AI výsadkových plavidel" # todo: NEW TRANSLATION
 tech_landing_craft_6_desc: "Zavedení umělé inteligence umožňuje výsadkovým plavidlům včas a správně reagovat na mimořádné situace." # todo: NEW TRANSLATION
 tech_landing_craft_7: "Chytré výsadkové plavidlo" # todo: NEW TRANSLATION
