 tech_point_defense_system_7: "CIWS VII" # todo: NEW TRANSLATION
 tech_point_defense_system_7_desc: "Hyperpokročilé systémy CIWS využívají řízení palby podporované umělou inteligencí, kooperativní navádění senzory a hlubší zásobníky připravené k okamžitému použití. Během saturačních útoků a hrozeb rojů zblízka tak koordinují více dělových lafet." # todo: NEW TRANSLATION
 tech_point_defense_system_8: "CIWS VIII" # todo: NEW TRANSLATION
 tech_point_defense_system_8_desc: "Ultrapokročilá děla CIWS integrují prediktivní řízení palby, chytrou munici, autonomní prioritizaci cílů a celolodní slučování senzorů do adaptivní poslední vrstvy námořní obrany založené na kanónech." # todo: NEW TRANSLATION
 tech_anti_drone_laser_1: "Lodní lasery bodové obrany I" # todo: NEW TRANSLATION
 tech_anti_drone_laser_1_desc: "První lodní lasery poskytují hlubokou zásobníkovou obranu proti dronům a přilétající munici tím, že rychlostí světla propalují senzory, řídicí plochy a bojové hlavice. Snižují závislost na záchytných raketách a kanónech blízké obrany, ale k účinnosti za špatného počasí a silného rozstřiku vyžadují stabilní napájení a přesné sledování." # todo: NEW TRANSLATION
 tech_anti_drone_laser_2: "Lodní lasery bodové obrany II" # todo: NEW TRANSLATION
 tech_anti_drone_laser_2_desc: "Vylepšená kvalita paprsku, tepelný management a integrované řízení palby umožňují trvalé nasazení proti rychlejším a menším hrozbám včetně saturačních rojů dronů a střel letících těsně nad hladinou. Díky lepšímu vyrovnávání výkonu a automatizovanému navádění ze senzorů lodi se lasery stávají spolehlivou vrstvou bodové obrany namísto experimentálního doplňku." # todo: NEW TRANSLATION
 tech_anti_drone_laser_3: "Lodní lasery bodové obrany III" # todo: NEW TRANSLATION
 tech_anti_drone_laser_3_desc: "Pokročilé lodní lasery využívají vysílače s vyšším výkonem, adaptivní řízení paprsku a lepší kompenzaci atmosféry k nasazení proti dronům, řízené munici a naváděcím hlavicím raket s větším dosahem a spolehlivostí. Integrované energetické systémy umožňují opakované výstřely bez rychlého vyčerpání běžných zásobníků." # todo: NEW TRANSLATION
 tech_anti_drone_laser_4: "Lodní lasery bodové obrany IV" # todo: NEW TRANSLATION
 tech_anti_drone_laser_4_desc: "Hyperpokročilá lodní laserová obrana propojuje více vysílačů, prioritizaci cílů podporovanou umělou inteligencí a celolodní správu energie do koordinovaného štítu zbraní s řízenou energií. Tyto systémy mohou během saturačních útoků dronů a raket rychle poškozovat senzory, draky letounů a řídicí plochy." # todo: NEW TRANSLATION
