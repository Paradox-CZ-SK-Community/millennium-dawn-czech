 module_helipads_1: "Heliporty I"
 module_helipads_1_desc: "Palubní přistávací plochy pro vrtulníky určené k různým účelům - protiponorkový boj, záchranné mise a rychlá přeprava jednotek."
 module_helipads_2: "Heliporty II"
 module_helipads_2_desc: "Palubní přistávací plochy pro vrtulníky určené k různým účelům - protiponorkový boj, záchranné mise a rychlá přeprava jednotek."
 module_helipads_3: "Heliporty III"
 module_helipads_3_desc: "Palubní přistávací plochy pro vrtulníky určené k různým účelům - protiponorkový boj, záchranné mise a rychlá přeprava jednotek."
 module_helipads_4: "Vrtulníkové plošiny IV" # todo: NEW TRANSLATION
 module_helipads_4_desc: "Hyperpokročilá letecká infrastruktura poskytuje optimalizované letové paluby, podpůrné systémy a integraci velení, což umožňuje efektivní provoz několika moderních vrtulníků pro průzkum, protiponorkový boj a projekci síly.\n\n§GTip konstruktéra: Vrtulníkové plošiny zlepšují detekci ponorek, protiponorkový boj, detekci hladinových cílů a odminování a zároveň zvyšují odolnost. Hodí se pro protiponorkové doprovodné a hlídkové lodě, ale zvyšují výrobní náklady, spotřebu paliva, potřebu živé síly a viditelnost na hladině.§!" # todo: NEW TRANSLATION
 module_flight_deck_1: "Lehká letadlová paluba (10)"
 module_flight_deck_1_desc: "Tento modul určuje velikost lodi. Větší letadlové lodě mohou provozovat více letadel a mají vyšší konstrukční odolnost, ale jsou snáze zjistitelné a zasažitelné. Vyžadují více paliva, personálu a jsou nákladnější."
