 GNSS5_desc: "Družice určená jako součást satelitní konstelace poskytující globální určování polohy, navigaci a časové služby. Extrémně užitečná pro civilní i vojenské účely.\n\nNavigační družice (GNSS 2005):\nDružice §Y$GNSS5$§! má přesnost §Y0,5 m§!. Jsou vyžadovány pro §YGNSS systém s přesností 0,5 m§!."
