 TITLE_GREEN_WATER_NAVY_DESC: "Pobřežní námořnictvo je schopné operací v pobřežních vodách a přilehlých mořích."
 TITLE_JEUNE_ECOLE: "Doktrína Jeune École"
 TITLE_JEUNE_ECOLE_DESC: "Jeune École („Mladá škola“) je námořní doktrína zaměřená na malé, silně vyzbrojené a manévrovatelné lodě určené k boji s většími jednotkami."
 CAT_blue_water_navy: "Oceánské námořnictvo"
 Cat_blue_water_navy_desc: "Námořnictvo schopné globálních operací a projekce síly daleko od domovských přístavů, často s letadlovými loděmi."
 CAT_green_water_navy: "Pobřežní námořnictvo"
 Cat_green_water_navy_desc: "Námořní síly určené především k ochraně pobřeží a regionálních vod."
 blue_water_navy: "Oceánské námořnictvo"
 blue_water_navy_desc: "Námořní síly schopné udržovat kontrolu moří na velké vzdálenosti a operovat globálně."
 green_water_navy: "Pobřežní námořnictvo"
 green_water_navy_desc: "Námořní síly se zaměřením na pobřežní a regionální operace."
 floating_fortresses: "Plovoucí pevnosti"
 floating_fortresses_desc: "Letadlové lodě jsou moderními pevnostmi moří, umožňujícími projekci síly a kontrolu oceánů."
 distance_decimation: "Likvidace na dálku"
 distance_decimation_desc: "Ničení nepřítele na velké vzdálenosti k zajištění bezpečnosti našich pobřeží."
 the_prowlers: "Lovci"
 the_prowlers_desc: "Úkolem ponorek je nepozorovaně operovat a ničit hrozby pro hlavní flotilu."
 far_from_home: "Daleko od domova"
 far_from_home_desc: "Naše flotila musí být schopna dlouhodobě operovat daleko od vlastních břehů."
 secured_shipping: "Zajištěné námořní trasy"
 secured_shipping_desc: "Námořní obchodní trasy musí být chráněny za každou cenu."
 deck_discipline: "Palubní disciplína"
 deck_discipline_desc: "Efektivní provoz letadlových lodí vyžaduje přísnou palubní disciplínu."
 rolling_thunder: "Valící se hrom"
 rolling_thunder_desc: "Koordinované raketové údery maximalizují destruktivní účinek flotily."
 death_from_below: "Smrt z hlubin"
 death_from_below_desc: "Ponorky představují klíčový prvek boje na otevřených mořích."
 air_dominance: "Vzdušná nadvláda"
 air_dominance_desc: "Ovládnutí vzdušného prostoru nad mořem paralyzuje nepřátelské letectvo."
 missile_support: "Raketová podpora"
 missile_support_desc: "Raketové zbraně poskytují klíčovou podporu obojživelným i námořním operacím."
 hidden_from_view: "Skryti před zraky"
 hidden_from_view_desc: "Udržení ponorek mimo dosah nepřátelského průzkumu je zásadní pro jejich efektivní nasazení."
 zone_of_control: "Zóna kontroly"
 zone_of_control_desc: "Zřízení jasně vymezené zóny kontroly na moři zvýší naši operační efektivitu."
 long_distance_persistence: "Dlouhodobá vytrvalost"
 long_distance_persistence_desc: "Zvýšením vytrvalosti lodí na dlouhé vzdálenosti může naše flotila udržet námořní bojové operace co nejdéle."
 nuclear_dominance: "Jaderná dominance"
 nuclear_dominance_desc: "Čím větší loď a čím výkonnější jaderný pohon, tím silnější je plavidlo."
 replenishment_at_sea: "Doplňování na moři"
 replenishment_at_sea_desc: "Zaměření na konvoje a řádné zásobování plavidel během jejich rotací nám umožní udržet flotilu nasazenou po delší dobu."
 logistical_goliath: "Logistická podpora pro Goliáše"
 logistical_goliath_desc: "Současné metody zásobování kapitálních lodí na moři lze výrazně zlepšit. Nové principy řízení konvojů sníží ztráty kritických zásob a paliva."
 man_in_the_high_seas: "Pán otevřených moří"
 man_in_the_high_seas_desc: "Naše námořnictvo se stane pánem oceánů a zajistí neotřesitelnou dominanci v jakékoli válečné zóně."
 global_naval_ambitions: "Globální námořní ambice"
 global_naval_ambitions_desc: "Naše námořní ambice neznají hranic. Naším cílem je globální dominance."
 naval_force_projection: "Projekce námořní síly"
