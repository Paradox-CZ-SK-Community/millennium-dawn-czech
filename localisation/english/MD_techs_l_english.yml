 full_reusable_OLV8: "Vylepšená znovupoužitelná raketa"
 full_reusable_OLV8_desc: "Plně znovupoužitelné nosné rakety jsou systémy, u nichž se všechny stupně vracejí na Zem a mohou být znovu použity. Tato vylepšená verze dále snižuje náklady i dobu výroby."
 ballistic_missile: "Balistické střely"
 ballistic_missile_desc: "Balistické střely jsou typem raketových zbraní, které k dopravě bojové hlavice na cíl využívají balistickou trajektorii. Pohon je aktivní pouze v počáteční fázi letu, kdy je spotřebováno velké množství paliva, zatímco většina letu probíhá bez vlastního pohonu. Některé střely jsou krátkého doletu (SRBM) a zůstávají v atmosféře Země, zatímco největší typy jsou schopny suborbitálního či orbitálního letu a většinu své dráhy tráví mimo atmosféru."
 nuclear_missile_equipment: "Mezikontinentální balistické střely"
 nuclear_missile_equipment_desc: "Mezikontinentální balistická střela (ICBM) je raketa velmi dlouhého doletu schopná nést jadernou bojovou hlavici a je považována za strategickou odstrašující zbraň."
