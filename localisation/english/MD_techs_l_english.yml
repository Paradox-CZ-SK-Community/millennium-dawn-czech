 recon_satellites: "Průzkumné družice"
 recon_satellites_desc: "Průzkumné družice"
 SPYSAT1: "SPYSAT 1965"
 SPYSAT1_desc: "Vojenské nebo zpravodajské družice určené k plnění široké škály úkolů - od sběru zpravodajských informací až po detekci jaderných výbuchů.\n\nPrůzkumná družice (SPYSAT 1965):\nDružice §Y$SPYSAT1$§! má rozlišení obrazu §Y5 m GSD§!. Jsou vyžadovány pro §Yprůzkumný systém s rozlišením 5 m GSD§!.\n§YGSD§! - §YPozemní vzorkovací vzdálenost§!: vzdálenost mezi středy pixelů měřená na povrchu Země."
 SPYSAT2: "SPYSAT 1975"
 SPYSAT2_desc: "Vojenské nebo zpravodajské družice určené k plnění široké škály úkolů.\n\nPrůzkumná družice (SPYSAT 1975):\nDružice §Y$SPYSAT2$§! má rozlišení obrazu §Y2,5 m GSD§!."
