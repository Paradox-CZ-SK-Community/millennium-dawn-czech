 nsb_artillery_0: "Tažené dělostřelectvo 1965"
 nsb_artillery_0_desc: "Dělostřelectvo poskytuje silnou nepřímou palbu na velké vzdálenosti. Je obsluhováno posádkou, avšak k přesunu vyžaduje externí vozidla, což snižuje jeho mobilitu a zvyšuje zranitelnost vůči protipalbě. Lehké systémy menších ráží lze přesouvat ručně a jsou vhodné pro výsadkové operace."
 AA_upgrade_1: "Chladicí jednotka baterie 2. generace"
 AA_upgrade_1_desc: "Obsahuje termální baterii pro předletové operace a zásobu argonu k chlazení infračerveného senzoru naváděcí hlavice."
 AA_upgrade_2: "IR/UV skenování rozetou - 3. generace"
 AA_upgrade_2_desc: "Využití ultrafialového spektra elektromagnetického záření pro navádění řízených zbraní."
 AA_upgrade_3: "Chlazené IR systémy"
 AA_upgrade_3_desc: "Vysoce citlivé systémy schopné detekovat i minimální teplotní rozdíly cílů."
 AA_upgrade_4: "Snímače InGaAs"
 AA_upgrade_4_desc: "Moderní hypersonické zobrazovací systémy využívající tyto senzory k přesné akvizici cíle."
 AA_upgrade_5: "Adaptivní infračervené naváděcí hlavice" # todo: NEW TRANSLATION
 AA_upgrade_5_desc: "Adaptivní zobrazovací infračervené naváděcí hlavice kombinují digitální rozpoznávání cílů s lepším potlačením protiopatření, což systémům protivzdušné obrany krátkého dosahu umožňuje rozlišovat letadla od světlic, klamných cílů, dronů a okolních tepelných zdrojů." # todo: NEW TRANSLATION
 AA_upgrade_6: "Multispektrální pole naváděcích hlavic" # todo: NEW TRANSLATION
 AA_upgrade_6_desc: "Multispektrální pole naváděcích hlavic kombinují několik infračervených a optických pásem s rychlejším palubním zpracováním, čímž zlepšují sledování malých, rychlých nebo terénem maskovaných vzdušných hrozeb, jako jsou UAV, střely s plochou dráhou letu a vrtulníky." # todo: NEW TRANSLATION
 AA_upgrade_7: "Fúze senzorů řízená sítí" # todo: NEW TRANSLATION
 AA_upgrade_7_desc: "Fúze senzorů řízená sítí propojuje zobrazovací systémy střel s externími radarovými, optickými a bojištními datovými kanály, čímž zlepšuje identifikaci cílů a stabilitu zaměření jak u přenosných střel, tak u protiletadlových systémů obrněných vozidel." # todo: NEW TRANSLATION
 AA_upgrade_8: "Adaptivní naváděcí hlavice s podporou AI" # todo: NEW TRANSLATION
 AA_upgrade_8_desc: "Adaptivní naváděcí hlavice s podporou AI využívají pokročilou fúzi senzorů a rozlišování cílů v reálném čase k udržení zaměření proti méně zjistitelným, chladnějším a rychlejším vzdušným hrozbám v silně sporném vzdušném prostoru." # todo: NEW TRANSLATION
