 nsb_SP_arty_5: "Samohybné dělostřelectvo 2045" # todo: NEW TRANSLATION
 nsb_SP_arty_5_desc: "Díky svým výkonným schopnostem nepřímé palby poskytuje samohybné dělostřelectvo trvalé přesné údery tam, kde jsou na bojišti potřeba, a na vzdálenosti daleko za hranicí viditelnosti. Posádka jej může přímo znovu nabíjet a vlastní pohon mu umožňuje pohyb, aby se vyhnulo odvetným úderům nepřátelského dělostřelectva." # todo: NEW TRANSLATION
