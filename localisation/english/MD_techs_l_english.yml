 module_screen_analog_fire_control: "Analogový systém řízení palby" # todo: NEW TRANSLATION
 module_screen_analog_fire_control_desc: "Analogové systémy řízení palby lze nejlépe popsat jako ručně ovládané systémy.\n\n§GTip konstruktéra: Řízení palby zlepšuje útok kanónů, protilodní střely, průbojnost protilodních střel, protiletadlovou obranu a pancéřování, takže ozbrojená loď je účinnější v několika rolích. Pokročilé systémy poskytují silnější bonusy, ale stojí více průmyslové kapacity a mikročipů.§!\n\n§WPoužití této zbraně jako primární vytvoří§! §Bdoprovodnou loď§!" # todo: NEW TRANSLATION
 module_screen_digital_integrated_fire_control: "Digitální integrovaný systém řízení palby" # todo: NEW TRANSLATION
 module_screen_digital_integrated_fire_control_desc: "Digitální rozhraní integrovaná do systémů umožňují účinnější velení a údržbu z můstku lodi.\n\n§GTip konstruktéra: Řízení palby zlepšuje útok kanónů, protilodní střely, průbojnost protilodních střel, protiletadlovou obranu a pancéřování, takže ozbrojená loď je účinnější v několika rolích. Pokročilé systémy poskytují silnější bonusy, ale stojí více průmyslové kapacity a mikročipů.§!\n\n§WPoužití této zbraně jako primární vytvoří§! §Bdoprovodnou loď§!" # todo: NEW TRANSLATION
 module_screen_advanced_integrated_missile_radar_control: "Pokročilé integrované radarové řízení střel" # todo: NEW TRANSLATION
 module_screen_advanced_integrated_missile_radar_control_desc: "Pokročilé integrované radarové řízení střel spočívá v propojení střel a radaru, které umožňuje rychlejší a přesnější reakce na přicházející hrozby.\n\n§GTip konstruktéra: Řízení palby zlepšuje útok kanónů, protilodní střely, průbojnost protilodních střel, protiletadlovou obranu a pancéřování, takže ozbrojená loď je účinnější v několika rolích. Pokročilé systémy poskytují silnější bonusy, ale stojí více průmyslové kapacity a mikročipů.§!\n\n§WPoužití této zbraně jako primární vytvoří§! §Bdoprovodnou loď§!" # todo: NEW TRANSLATION
