 OLV7_desc: "Nosná raketa je raketový prostředek používaný k vynášení nákladu z povrchu Země do vesmíru, obvykle na oběžnou dráhu Země nebo dále.\n\nOrbitální nosná raketa (OLV 2025):\n§YVesmírné vypuštění§!:\nHmotnost nákladu: §Y20000§! kg | Spolehlivost: §Y90%§!\n§YVýroba§!:\nCena za kus: $§Y0.07§! miliardy | Civilní průmysl na kus: §Y2§! | Doba výroby na kus: §Y90§!" # todo: CHANGED NUMBER
 full_reusable_OLV7: "Plně znovupoužitelná raketa"
 full_reusable_OLV7_desc: "Plně znovupoužitelné nosné rakety jsou systémy, u nichž se všechny stupně vracejí na Zem a mohou být znovu použity. Výrazně snižují náklady i dobu výroby."
