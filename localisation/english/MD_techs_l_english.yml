 nsb_Arty_upgrade_6_desc: "Vylepšené systémy kapalných pohonných látek poskytují přesnější řízení náplně, bezpečnější manipulaci a lepší integraci s automatizovanými nabíjecími a systémy řízení palby, čímž zvyšují flexibilitu dělostřelectva a výkon při dlouhodobé palbě." # todo: NEW TRANSLATION
 nsb_SP_arty_1: "Samohybné dělostřelectvo 1985"
 nsb_SP_arty_1_desc: "Díky silné nepřímé palbě poskytuje samohybné dělostřelectvo přesné a trvalé údery na bojišti i daleko za hranicí přímé viditelnosti. Posádka je schopna vlastní obsluhy a mobilita umožňuje rychlý přesun k vyhnutí se protipalbě."
 nsb_SP_arty_2: "Samohybné dělostřelectvo 2005"
 nsb_SP_arty_2_desc: "Díky silné nepřímé palbě poskytuje samohybné dělostřelectvo přesné a trvalé údery na bojišti i daleko za hranicí přímé viditelnosti. Posádka je schopna vlastní obsluhy a mobilita umožňuje rychlý přesun k vyhnutí se protipalbě."
