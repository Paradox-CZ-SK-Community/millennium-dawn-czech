 tech_rail_guns_4: "Kolejnicová děla 2045" # todo: NEW TRANSLATION
 tech_rail_guns_4_desc: "Pokročilá kolejnicová děla využívají naváděné hypersonické projektily, přesné střelecké datové spoje a odolnější části odpalovacího zařízení k přesnějším úderům proti lodím, letadlům, raketám a pozemním cílům při zachování vysoké kadence palby." # todo: NEW TRANSLATION
 tech_rail_guns_5: "Kolejnicová děla 2060" # todo: NEW TRANSLATION
 tech_rail_guns_5_desc: "Kolejnicová děla pro obranu flotily integrují velkokapacitní ukládání energie, rychlé dobíjecí systémy a síťová data pro zaměřování. Válečné lodě tak mohou zachytávat salvy raket a provádět dálkové kinetické údery ve velkém objemu." # todo: NEW TRANSLATION
 tech_rail_guns_6: "Kolejnicová děla 2075" # todo: NEW TRANSLATION
 tech_rail_guns_6_desc: "Budoucí systémy kolejnicových děl využívají adaptivní chytré projektily, řízení nasazení podporované umělou inteligencí a celolodní správu výkonu k zajištění rychlé, přesné a trvalé elektromagnetické palebné podpory ve sporných námořních bojových prostorech." # todo: NEW TRANSLATION
 tech_rail_battery_1: "Baterie kolejnicových děl I" # todo: NEW TRANSLATION
 tech_rail_battery_1_desc: "Namísto instalace jediného kolejnicového děla baterie sdružuje několik hlavní do jednotného systému řízení palby, který připomíná doktrínu dělových věží bitevních lodí. Koordinované salvy poskytují větší údernou sílu, menší rozptyl a rychlejší opakovanou palbu za cenu vyšší spotřeby energie a složitější integrace." # todo: NEW TRANSLATION
 tech_rail_battery_2: "Baterie kolejnicových děl II" # todo: NEW TRANSLATION
 tech_rail_battery_2_desc: "Baterie kolejnicových děl druhé generace zlepšují životnost hlavní, tepelný management a automatizaci zásobníků. Umožňují tak trvalou rychlou salvovou palbu bez kritického opotřebení. Díky chytřejší distribuci energie a pokročilému zaměřování mohou tyto trojité kolejnicové lafety ovládnout střetnutí na hladině a poskytovat přesnou palebnou podporu na velkou vzdálenost." # todo: NEW TRANSLATION
 tech_rail_battery_3: "Baterie kolejnicových děl III" # todo: NEW TRANSLATION
 tech_rail_battery_3_desc: "Baterie kolejnicových děl třetí generace přidávají špičkovou životnost hlavní, tepelný management a automatizaci zásobníků, což umožňuje trvalou rychlou salvovou palbu bez kritického opotřebení. Díky chytřejší distribuci energie a pokročilému zaměřování mohou tyto trojité kolejnicové lafety ovládnout střetnutí na hladině a poskytovat přesnou palebnou podporu na velkou vzdálenost." # todo: NEW TRANSLATION
