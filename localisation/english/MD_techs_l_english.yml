 tech_turret_missiles_aa_6_desc: "Vysoce pokročilé systémy RAM využívají vícerežimové naváděcí hlavice, kooperativní zaměřování a rychlou správu salv k zachytávání dronů, letadel, střel s plochou dráhou letu a saturačních útoků." # todo: NEW TRANSLATION
 tech_turret_missiles_aa_7: "Rakety Rolling Airframe 2060" # todo: NEW TRANSLATION
 tech_turret_missiles_aa_7_desc: "Špičkové odpalovače RAM využívají vyhodnocování hrozeb podporované umělou inteligencí, navádění odolné proti protiopatřením a síťové navádění senzory proti vysokorychlostním a obtížně zjistitelným hrozbám." # todo: NEW TRANSLATION
