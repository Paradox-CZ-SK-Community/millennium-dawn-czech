 cruiser_hull_1: "Trup křižníku 1965"
 cruiser_hull_1_desc: "Jedny z největších útočných lodí moderních flotil. Křižníky disponují rozsáhlým arzenálem a pokročilými systémy velení a řízení a často slouží jako základ bojových svazů."
