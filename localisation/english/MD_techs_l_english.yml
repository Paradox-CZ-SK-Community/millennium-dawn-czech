 AT_upgrade_1: "SACLOS"
 AT_upgrade_1_desc: "Poloautomatické navádění po záměrné - operátor musí udržet cíl po celou dobu letu střely."
 AT_upgrade_2: "Vystřel a zapomeň"
 AT_upgrade_2_desc: "Schopnost střely samostatně navádět cíl po odpalu."
 AT_upgrade_3: "Vylepšená tandemová hlavice"
 AT_upgrade_3_desc: "Účinná proti reaktivnímu pancíři - první nálož naruší ochranu, druhá exploduje uvnitř cíle."
 AT_upgrade_4: "Bloudící munice"
 AT_upgrade_4_desc: "Kategorie zbraní, které setrvávají v prostoru cíle, vyhledávají cíl a útočí po jeho identifikaci."
 AT_upgrade_5: "Síťově propojená protitanková munice" # todo: NEW TRANSLATION
 AT_upgrade_5_desc: "Síťově propojená protitanková munice kombinuje navádění typu vystřel a zapomeň, schopnost zaměření po odpalu a předání cíle z externích zdrojů, což odpalovacím zařízením umožňuje napadat moderní obrněná vozidla ze skrytých, nepřímých nebo rychle se měnících palebných pozic." # todo: NEW TRANSLATION
 AT_upgrade_6: "Multispektrální přesměrovávaná munice" # todo: NEW TRANSLATION
 AT_upgrade_6_desc: "Multispektrální přesměrovávaná munice využívá infračervené, vizuální a senzory pro slabé osvětlení s řízením člověkem ve smyčce, což obsluze umožňuje identifikovat, přesměrovat nebo přerušit útoky proti pohybujícím se obrněným vozidlům, klamným cílům a zakrytým cílům." # todo: NEW TRANSLATION
 AT_upgrade_7: "Útočná munice proti systémům APS" # todo: NEW TRANSLATION
 AT_upgrade_7_desc: "Útočná munice proti systémům APS využívá adaptivní letové dráhy, synchronizované načasování dopadu a volitelné úhly útoku ke snížení pravděpodobnosti zachycení aktivními ochrannými systémy a k zasažení zranitelných částí pancíře." # todo: NEW TRANSLATION
 AT_upgrade_8: "Adaptivní protitanková munice" # todo: NEW TRANSLATION
 AT_upgrade_8_desc: "Adaptivní protitanková munice využívá rozpoznávání cílů s podporou AI, fúzi senzorů, koordinovanou logiku salv a programovatelné bojové hlavice k ničení silně chráněných vozidel na bojištích nasycených senzory." # todo: NEW TRANSLATION
 AS_upgrade_1: "Vektorování tahu"
 AS_upgrade_1_desc: "Možnost měnit směr tahu motoru výrazně zvyšuje obratnost v manévrovém boji."
 AS_upgrade_2: "Stealth 2. generace"
 AS_upgrade_2_desc: "Zlepšené stealth vlastnosti a výkon zvyšují schopnost průniku a přežití v nepřátelském vzdušném prostoru."
