 aircraft_heli_engineering_1: "Inženýrství vrtulníkového provozu"
 aircraft_heli_engineering_1_desc: "Úprava stávajících letadlových lodí pro efektivnější nasazení a hangárování vrtulníků může výrazně zlepšit naši schopnost čelit ponorkám."
 aircraft_heli_engineering_2: "Vylepšené nasazení vrtulníků"
 aircraft_heli_engineering_2_desc: "Úprava stávajících letadlových lodí pro efektivnější nasazení a hangárování vrtulníků může výrazně zlepšit naši schopnost čelit ponorkám."
