 helicopter_operator_hull_5: "Trup vrtulníkové lodi 2060" # todo: NEW TRANSLATION
 helicopter_operator_hull_5_desc: "Vrtulníková loď je letadlová loď určená především k přepravě vrtulníků, ale často se klasifikuje také jako obojživelná útočná loď nebo protiponorková letadlová loď. Používá se hlavně k vojenským leteckým misím včetně protiponorkového boje, obojživelných operací a přímé letecké podpory. Některé obojživelné útočné lodě mají doky určené k přepravě výsadkových člunů a plní také funkci dokových výsadkových lodí. Jiné jsou navrženy pro vybavení letouny s kolmým vzletem a přistáním, aby poskytovaly obojživelným operacím silnější přímou leteckou podporu než útočné vrtulníky, a plní tak funkci lehkých letadlových lodí." # todo: NEW TRANSLATION
 helicopter_operator_hull_6: "Trup vrtulníkové lodi 2075" # todo: NEW TRANSLATION
 helicopter_operator_hull_6_desc: "Vrtulníková loď je letadlová loď určená především k přepravě vrtulníků, ale často se klasifikuje také jako obojživelná útočná loď nebo protiponorková letadlová loď. Používá se hlavně k vojenským leteckým misím včetně protiponorkového boje, obojživelných operací a přímé letecké podpory. Některé obojživelné útočné lodě mají doky určené k přepravě výsadkových člunů a plní také funkci dokových výsadkových lodí. Jiné jsou navrženy pro vybavení letouny s kolmým vzletem a přistáním, aby poskytovaly obojživelným operacím silnější přímou leteckou podporu než útočné vrtulníky, a plní tak funkci lehkých letadlových lodí." # todo: NEW TRANSLATION
 aircraft_carrier_engineering: "Inženýrství letadlových lodí"
 aircraft_carrier_engineering_desc: ""
 aircraft_carrier_engineering_2: "Kompletní modernizace systému letadlové lodi" # todo: NEW TRANSLATION
 aircraft_carrier_engineering_2_desc: "Pokrok v námořní technologii konečně umožňuje kompletně přepracovat způsob provozu a konstrukce letadlových lodí." # todo: NEW TRANSLATION
 carrier_hull_1: "Trup letadlové lodi 1965"
 carrier_hull_1_desc: "Tyto plovoucí letecké základny představují vrchol námořní síly a umožňují projekci moci po celém světě. Jako symbol národního bohatství a síly musí být chráněny za každou cenu. Díky svému dosahu vyžadují plnohodnotný oceánský bojový svaz. Typické nasazení: globální projekce síly, letecký boj, hladinový boj a obojživelné operace."
 carrier_hull_2: "Trup letadlové lodi 1985"
 carrier_hull_2_desc: "$carrier_hull_1_desc$"
 carrier_hull_3: "Trup letadlové lodi 2005"
 carrier_hull_3_desc: "$carrier_hull_1_desc$"
 carrier_hull_4: "Trup letadlové lodi 2025"
 carrier_hull_4_desc: "$carrier_hull_1_desc$"
 carrier_hull_5: "Trup letadlové lodi 2045"
 carrier_hull_5_desc: "$carrier_hull_1_desc$"
 carrier_hull_6: "Trup letadlové lodi 2060" # todo: NEW TRANSLATION
 carrier_hull_6_desc: "Tyto plovoucí letecké základny představují vrchol námořní moci a mohou pronikat do světových oceánů, aby promítaly sílu národa po celé planetě. Tyto mimořádně cenné prostředky, symbolizující bohatství a oběti silného národa, musí být za každou cenu chráněny. Kvůli svému obrovskému dosahu vyžadují skutečnou oceánskou bojovou skupinu, která jim umožní plně využít jejich operační schopnosti na moři. Každá země, která nasadí plně operační bojovou skupinu letadlové lodi, může být skutečně hrdá na to, co její námořnictvo představuje, i na děsivou sílu, kterou disponuje. Obvykle se používají k projekci síly na velké vzdálenosti, vzdušnému boji, boji na hladině a obojživelnému boji." # todo: NEW TRANSLATION
 carrier_hull_7: "Trup letadlové lodi 2075" # todo: NEW TRANSLATION
 carrier_hull_7_desc: "Tyto plovoucí letecké základny představují vrchol námořní moci a mohou pronikat do světových oceánů, aby promítaly sílu národa po celé planetě. Tyto mimořádně cenné prostředky, symbolizující bohatství a oběti silného národa, musí být za každou cenu chráněny. Kvůli svému obrovskému dosahu vyžadují skutečnou oceánskou bojovou skupinu, která jim umožní plně využít jejich operační schopnosti na moři. Každá země, která nasadí plně operační bojovou skupinu letadlové lodi, může být skutečně hrdá na to, co její námořnictvo představuje, i na děsivou sílu, kterou disponuje. Obvykle se používají k projekci síly na velké vzdálenosti, vzdušnému boji, boji na hladině a obojživelnému boji." # todo: NEW TRANSLATION
 tech_submarine_engineering_1: "Raný ponorkový pohon"
 tech_submarine_engineering_1_desc: "Dieselelektrický pohon raných ponorek kombinoval dieselový motor, elektromotor, generátor a baterie. Při plavbě na hladině nebo dobíjení baterií byl využíván dieselový motor, zatímco při ponoření zajišťovaly pohon elektromotory napájené z baterií."
 tech_submarine_engineering_2: "Pokročilý ponorkový pohon"
 tech_submarine_engineering_2_desc: "Nový dieselelektrický pohon využívá lithiové baterie namísto olověných, což umožňuje delší podvodní provoz."
 tech_submarine_engineering_3: "Moderní ponorkový pohon"
 tech_submarine_engineering_3_desc: "Zavedení systémů AIP umožňuje ponorkám tišší, efektivnější a spolehlivější provoz."
 tech_submarine_engineering_4: "Futuristický ponorkový pohon"
 tech_submarine_engineering_4_desc: "Nové technologie umožňují ponorkám operovat na větší vzdálenosti, vyšší rychlosti a s nižší hlučností."
 tech_submarine_engineering_5: "Futuristický ponorkový motor" # todo: NEW TRANSLATION
 tech_submarine_engineering_5_desc: "Zavedení nových technologií umožňuje ponorkám operovat pod vodou na větší vzdálenosti, vyšší rychlostí a s menším hlukem." # todo: NEW TRANSLATION
 tech_submarine_engineering_6: "Pokročilý ponorkový motor" # todo: NEW TRANSLATION
 tech_submarine_engineering_6_desc: "Rozvoj nových technologií umožňuje ponorkám operovat pod vodou na větší vzdálenosti, vyšší rychlostí a s menším hlukem." # todo: NEW TRANSLATION
 tech_submarine_engineering_7: "Hyperpokročilý ponorkový motor" # todo: NEW TRANSLATION
 tech_submarine_engineering_7_desc: "Obrovský pokrok v nových technologiích umožňuje ponorkám operovat pod vodou na větší vzdálenosti, vyšší rychlostí a s menším hlukem." # todo: NEW TRANSLATION
 attack_submarine_hull_1: "Trup útočné ponorky 1965"
 attack_submarine_hull_1_desc: "Tichí zabijáci světových oceánů. Tyto podmořské platformy kombinují stealth, průzkum a zbraňové systémy a jsou určeny k operacím na otevřeném moři i v pobřežních vodách. Útočné ponorky představují základ každého moderního námořnictva."
