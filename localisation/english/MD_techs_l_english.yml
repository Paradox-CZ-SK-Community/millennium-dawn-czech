 aircraft_heli_engineering_4: "Automatizované vrtulníkové hangáry" # todo: NEW TRANSLATION
 aircraft_heli_engineering_4_desc: "Modernizace našich současných letadlových lodí účinnějšími způsoby nasazení a uskladnění vrtulníků může zlepšit naši schopnost čelit ponorkám." # todo: NEW TRANSLATION
 helicopter_operator_hull_1: "Trup nosiče vrtulníků 1970"
 helicopter_operator_hull_1_desc: "Nosič vrtulníků je typ letadlové lodi primárně určený k provozu vrtulníků. Často je také klasifikován jako obojživelná útočná loď nebo protiponorková letadlová loď. Používá se především k úkolům vojenského letectva, včetně protiponorkového boje, obojživelných operací a přímé letecké podpory. Některé obojživelné útočné lodě disponují zaplavitelným dokem pro výsadková plavidla a plní tak funkci dokových výsadkových lodí. Jiné jsou vybaveny letouny s kolmým vzletem a přistáním (VTOL), čímž se blíží lehkým letadlovým lodím."
