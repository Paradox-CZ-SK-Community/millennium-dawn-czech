 tech_torpedoes_6: "Torpédo 2045" # todo: NEW TRANSLATION
 tech_torpedoes_6_desc: "Hyperpokročilá torpéda využívají síťová data pro zaměřování, pohon s nízkou hlučností a autonomní vyhledávací vzorce ke koordinaci s ponorkami, letadly, hladinovými loděmi a bezpilotními platformami během protiponorkových operací." # todo: NEW TRANSLATION
 tech_torpedoes_7: "Torpédo 2060" # todo: NEW TRANSLATION
 tech_torpedoes_7_desc: "Ultrapokročilá torpéda využívají klasifikaci cílů podporovanou umělou inteligencí, vícerežimové snímání a adaptivní profily útoku k rozlišení skutečných cílů od klamných a k pronásledování hrozeb ve složitém podvodním prostředí." # todo: NEW TRANSLATION
 tech_torpedoes_8: "Torpédo 2075" # todo: NEW TRANSLATION
 tech_torpedoes_8_desc: "Torpéda nové generace kombinují kooperativní podmořské sítě, prediktivní sledování cílů, autonomní plánování tras a pokročilé odmítání protiopatření k lovu lodí a ponorek v námořních bojových prostorech nasycených senzory." # todo: NEW TRANSLATION
 tech_drone_torpedoes_1: "Dronová torpéda II" # todo: NEW TRANSLATION
 tech_drone_torpedoes_1_desc: "První dronová torpéda přidávají tradičním podvodním zbraním navádění a omezenou autonomii, čímž zlepšují získávání cílů a omezují plýtvání výstřely. Díky lepším senzorům a korekcím kurzu mohou spolehlivěji sledovat unikající lodě a ponorky v nepřehledných pobřežních vodách." # todo: NEW TRANSLATION
 tech_drone_torpedoes_2: "Dronová torpéda III" # todo: NEW TRANSLATION
 tech_drone_torpedoes_2_desc: "Vylepšené zpracování sonaru a zabezpečené datové spoje umožňují dronovým torpédům aktualizovat cíle během běhu a přizpůsobovat se protiopatřením. Vylepšený pohon a správa energie zvyšují dosah a výdrž bez obětování koncové rychlosti." # todo: NEW TRANSLATION
 tech_drone_torpedoes_3: "Dronová torpéda IV" # todo: NEW TRANSLATION
 tech_drone_torpedoes_3_desc: "Pokročilá autonomie mění dronová torpéda v koordinované podvodní lovce schopné kooperativního vyhledávání, chytřejší logiky opakovaného útoku a odolnosti vůči klamným cílům. Díky zdokonalenému navádění podle brázdy a vícerežimovým hlavicím mohou pronikat moderní obranou a vyvíjet tlak, dokud není cíl zničen." # todo: NEW TRANSLATION
 tech_drone_torpedoes_4: "Dronová torpéda V" # todo: NEW TRANSLATION
 tech_drone_torpedoes_4_desc: "Pokročilá autonomie mění dronová torpéda v koordinované podvodní lovce schopné kooperativního vyhledávání, chytřejší logiky opakovaného útoku a odolnosti vůči klamným cílům. Díky zdokonalenému navádění podle brázdy a vícerežimovým hlavicím mohou pronikat moderní obranou a vyvíjet tlak, dokud není cíl zničen." # todo: NEW TRANSLATION
 tech_drone_torpedoes_5: "Dronová torpéda VI" # todo: NEW TRANSLATION
 tech_drone_torpedoes_5_desc: "Pokročilá autonomie mění dronová torpéda v koordinované podvodní lovce schopné kooperativního vyhledávání, chytřejší logiky opakovaného útoku a odolnosti vůči klamným cílům. Díky zdokonalenému navádění podle brázdy a vícerežimovým hlavicím mohou pronikat moderní obranou a vyvíjet tlak, dokud není cíl zničen." # todo: NEW TRANSLATION
 tech_anti_torpedoes_1: "Protitorpédová obrana I" # todo: NEW TRANSLATION
 tech_anti_torpedoes_1_desc: "První protitorpédová obrana kombinuje vylepšené sonarové varování se základními protiopatřeními a snižuje pravděpodobnost přímého zásahu. Lepší detekce a rychlejší reakce poskytují čas na úhybné manévry, vypuštění klamných cílů a obranné krytí." # todo: NEW TRANSLATION
 tech_anti_torpedoes_2: "Protitorpédová obrana II" # todo: NEW TRANSLATION
 tech_anti_torpedoes_2_desc: "Vylepšené varovné systémy proti torpédům integrují senzory, taktické displeje a automatizovanou logiku reakce ke zkrácení řetězce zničení přilétajících hrozeb. Účinnější klamné cíle a lepší doktrína řízení lodi zvyšují schopnost přežití na otevřeném moři i v pobřežních vodách." # todo: NEW TRANSLATION
 tech_anti_torpedoes_3: "Protitorpédová obrana III" # todo: NEW TRANSLATION
 tech_anti_torpedoes_3_desc: "Pokročilé protitorpédové komplety kombinují vysoce přesné sledování s aktivními protiopatřeními včetně interceptorů tvrdého zničení, které torpéda ničí před dopadem. Síťové senzory a rychlopalné obranné systémy činí podmořské útoky mnohem méně rozhodujícími a nutí ponorky nasadit více zbraní k dosažení menšího počtu výsledků." # todo: NEW TRANSLATION
 tech_anti_torpedoes_4: "Protitorpédová obrana IV" # todo: NEW TRANSLATION
 tech_anti_torpedoes_4_desc: "Velmi pokročilé protitorpédové komplety kombinují vysoce přesné sledování s aktivními protiopatřeními včetně interceptorů tvrdého zničení, které torpéda ničí před dopadem. Síťové senzory a rychlopalné obranné systémy činí podmořské útoky mnohem méně rozhodujícími a nutí ponorky nasadit více zbraní k dosažení menšího počtu výsledků." # todo: NEW TRANSLATION
 tech_anti_torpedoes_5: "Protitorpédová obrana V" # todo: NEW TRANSLATION
 tech_anti_torpedoes_5_desc: "Hyperpokročilé protitorpédové komplety kombinují vysoce přesné sledování s aktivními protiopatřeními včetně interceptorů tvrdého zničení, které torpéda ničí před dopadem. Síťové senzory a rychlopalné obranné systémy činí podmořské útoky mnohem méně rozhodujícími a nutí ponorky nasadit více zbraní k dosažení menšího počtu výsledků." # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_1: "Jaderná torpéda II" # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_1_desc: "Integrace jaderných hlavic do těžkých torpéd mění podmořskou válku v nástroj katastrofického odstrašení. Už samotná možnost takového úderu nutí nepřátelské flotily rozptýlit se, přehodnotit úžiny a považovat hlášení o kontaktu s ponorkou za existenční poplach. Je to zbraň určená k ukončení bojů hrozbou ukončení veškerých omezení." # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_2: "Jaderná torpéda III" # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_2_desc: "Vylepšené bezpečnostní prvky velení a spolehlivější doktrína nasazení činí z jaderných torpéd věrohodnou, byť děsivou možnost druhého úderu na moři. Jejich přítomnost mění námořní plánování zvýšením ceny hromadných formací a pobřežních shromaždišť. Každé střetnutí je zastíněno rizikem eskalace." # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_3: "Jaderná torpéda IV" # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_3_desc: "Pokročilé koncepty jaderných torpéd se snaží učinit hrozbu přežitelnou, kontrolovatelnou a politicky použitelnou, aniž by se snížila její hrůznost. Díky užšímu začlenění do strategického velení a jasnějším pravidlům odpalu se zbraň stává formálním pilířem námořního odstrašení. Po zavedení nutí protivníky vyjednávat ze strachu, nikoli z jistoty." # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_4: "Jaderná torpéda V" # todo: NEW TRANSLATION
 tech_nuclear_torpedoes_4_desc: "Hyperpokročilé koncepty jaderných torpéd se snaží učinit hrozbu přežitelnou, kontrolovatelnou a politicky použitelnou, aniž by se snížila její hrůznost. Díky užšímu začlenění do strategického velení a jasnějším pravidlům odpalu se zbraň stává formálním pilířem námořního odstrašení. Po zavedení nutí protivníky vyjednávat ze strachu, nikoli z jistoty." # todo: NEW TRANSLATION
 tech_improved_target_tracking: "Vylepšené sledování cílů"
 tech_improved_target_tracking_desc: "Nové technologie umožňují sledování tepelných stop, trajektorií i radarových drah cílů. Jejich využití zvyšuje bojovou efektivitu lodí i torpéd."
 tech_signature_reduction: "Snížení signatury"
