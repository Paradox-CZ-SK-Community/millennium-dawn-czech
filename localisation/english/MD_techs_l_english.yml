 attack_submarine_hull_7: "Trup útočné ponorky 2055" # todo: NEW TRANSLATION
 attack_submarine_hull_7_desc: "Tito tiší zabijáci světových oceánů jsou platformami podmořského boje, které kombinují širokou škálu schopností včetně stealthu, shromažďování zpravodajských informací a zbraňových systémů. Jsou navrženy pro široké spektrum úkolů na otevřeném moři i v pobřežních vodách. Tito specialisté na uzavírání oblastí jsou základem každého námořnictva. Útočné ponorky kombinují střely a ponorkové platformy určené k útokům na vzdálené cíle v zámoří." # todo: NEW TRANSLATION
