 module_sub_esm_4_desc: "Ultrapokročilá elektronická podpůrná opatření kombinují vysokorychlostní zpracování dat a propojené slučování senzorů, což umožňuje přesnou identifikaci hrozeb, lepší včasné varování a dokonalejší koordinaci s elektronickým bojem a bojovými systémy.\n\n§GTip konstruktéra: Ponorkové ESM zvyšuje odolnost a snižuje viditelnost ponorky, čímž zlepšuje přežití a stealth. Hodí se pro ponorky operující v blízkosti nepřátelských senzorů, ale zvyšuje výrobní náklady a vyžaduje mikročipy.§!" # todo: NEW TRANSLATION
 module_sub_esm_5: "ESM V" # todo: NEW TRANSLATION
 module_sub_esm_5_desc: "Pokročilá elektronická podpůrná opatření kombinují vysokorychlostní zpracování dat a propojené slučování senzorů, což umožňuje přesnou identifikaci hrozeb, lepší včasné varování a dokonalejší koordinaci s elektronickým bojem a bojovými systémy.\n\n§GTip konstruktéra: Ponorkové ESM zvyšuje odolnost a snižuje viditelnost ponorky, čímž zlepšuje přežití a stealth. Hodí se pro ponorky operující v blízkosti nepřátelských senzorů, ale zvyšuje výrobní náklady a vyžaduje mikročipy.§!" # todo: NEW TRANSLATION
 module_analog_fire_control: "Analogový systém řízení palby"
 module_analog_fire_control_desc: "Analogové systémy řízení palby jsou převážně manuálně ovládané systémy."
 module_digital_integrated_fire_control: "Digitální integrovaný systém řízení palby"
 module_digital_integrated_fire_control_desc: "Digitální rozhraní integrovaná do systémů umožňují efektivnější velení a údržbu z můstku lodi."
 module_advanced_integrated_missile_radar_control: "Pokročilé integrované radarové řízení střel"
 module_advanced_integrated_missile_radar_control_desc: "Integrace radarových a raketových systémů umožňuje rychlejší a přesnější reakce na přilétající hrozby."
 module_futuristic_integrated_missile_radar_control1: "Futuristické bojové informační systémy" # todo: NEW TRANSLATION
 module_futuristic_integrated_missile_radar_control1_desc: "Futuristické bojové informační systémy využívají strojové učení a technologie umělé inteligence ke zlepšení schopnosti lodě sledovat odpaly, let a zachycení nepřátelských zbraní při podzvukových, nadzvukových i hypersonických rychlostech.\n\n§GTip konstruktéra: Řízení palby zlepšuje útok kanónů, protilodní střely, průbojnost protilodních střel, protiletadlovou obranu a pancéřování, takže ozbrojená loď je účinnější v několika rolích. Pokročilé systémy poskytují silnější bonusy, ale stojí více průmyslové kapacity a mikročipů.§!" # todo: NEW TRANSLATION
 module_futuristic_integrated_missile_radar_control2: "Hyperpokročilé bojové informační systémy" # todo: NEW TRANSLATION
 module_futuristic_integrated_missile_radar_control2_desc: "$module_futuristic_integrated_missile_radar_control1_desc$" # todo: NEW TRANSLATION
