l_english:
 colombia.1.t: "Operace Fénix" # todo: NEW TRANSLATION
 colombia.1.d: "Kolumbijská rozvědka lokalizovala zástupce velitele FARC Raúla Reyese v táboře těsně za ekvádorskou hranicí. Armáda žádá o povolení přeshraničního úderu s cílem ho zlikvidovat. Úspěch by partyzánům zasadil významnou ránu, ale narušení ekvádorské suverenity by mohlo vyvolat diplomatickou krizi." # todo: NEW TRANSLATION
 colombia.1.a: "Zahájit přeshraniční úder" # todo: NEW TRANSLATION
 colombia.1.b: "Respektovat ekvádorskou suverenitu" # todo: NEW TRANSLATION
 colombia.2.t: "Kolumbijské narušení naší suverenity" # todo: NEW TRANSLATION
 colombia.2.d: "Kolumbijské ozbrojené síly provedly vojenskou operaci na ekvádorském území a zabily velitele FARC Raúla Reyese při přeshraničním leteckém útoku. Jde o bezprecedentní narušení naší suverenity." # todo: NEW TRANSLATION
 colombia.2.a: "Veřejně odsoudit Kolumbii" # todo: NEW TRANSLATION
 colombia.2.b: "Vyřešit to neveřejnými diplomatickými kanály" # todo: NEW TRANSLATION
 colombia.3.t: "Andská krize se vyostřuje" # todo: NEW TRANSLATION
 colombia.3.d: "Kolumbie narušila ekvádorskou suverenitu přeshraničním vojenským úderem. Ekvádor útok odsoudil a žádá o podporu regionálních spojenců. Venezuela se musí rozhodnout, zda se postaví na stranu Ekvádoru, nebo zůstane mimo spor." # todo: NEW TRANSLATION
 colombia.3.a: "Podpořit Ekvádor a mobilizovat vojska k hranici" # todo: NEW TRANSLATION
 colombia.3.b: "Držet se stranou" # todo: NEW TRANSLATION
 colombia.4.t: "Andská patová situace" # todo: NEW TRANSLATION
 colombia.4.d: "Po kolumbijském přeshraničním úderu proti FARC se mezi Kolumbií, Ekvádorem a Venezuelou rozvíjí diplomatická krize. Ekvádor a Venezuela mobilizují vojska. Spojené státy se musí rozhodnout, jak zareagovat." # todo: NEW TRANSLATION
 colombia.4.a: "Podpořit Kolumbii. Bojovali proti FARC" # todo: NEW TRANSLATION
 colombia.4.b: "Vyzvat všechny strany ke zdrženlivosti" # todo: NEW TRANSLATION
 colombia.5.t: "Venezuela se proti nám mobilizuje" # todo: NEW TRANSLATION
 colombia.5.d: "Venezuela z solidarity s Ekvádorem mobilizovala vojenské síly ke kolumbijské hranici. Situace se rychle vyostřuje a hrozí, že přeroste v ozbrojený konflikt." # todo: NEW TRANSLATION
 colombia.5.a: "Připravit naši obranu" # todo: NEW TRANSLATION
 colombia.6.t: "Americká podpora" # todo: NEW TRANSLATION
 colombia.6.d: "Spojené státy veřejně podpořily kroky Kolumbie proti FARC, poskytly jí diplomatické krytí a znovu potvrdily bilaterální spojenectví." # todo: NEW TRANSLATION
 colombia.6.a: "Jsme Washingtonu za podporu vděční" # todo: NEW TRANSLATION
 colombia.7.t: "Summit Skupiny Rio" # todo: NEW TRANSLATION
 colombia.7.d: "Skupina Rio svolala mimořádný summit s cílem zprostředkovat řešení andské krize. Regionální představitelé naléhají na diplomatické řešení. Kolumbie má příležitost omluvit se a zmírnit napětí, nebo trvat na svém právu pronásledovat partyzány přes hranice." # todo: NEW TRANSLATION
 colombia.7.a: "Omluvit se a potřást si rukama" # todo: NEW TRANSLATION
 colombia.7.b: "Odmítnout omluvu" # todo: NEW TRANSLATION
 colombia.8.t: "Krize vyřešena" # todo: NEW TRANSLATION
 colombia.8.d: "Kolumbie na summitu Skupiny Rio vydala formální omluvu. Bezprostřední hrozba ozbrojeného konfliktu pominula, ačkoli vztahy zůstávají napjaté." # todo: NEW TRANSLATION
 colombia.8.a: "Přijmout omluvu a stáhnout se" # todo: NEW TRANSLATION
 colombia.9.t: "Zmírnění andské krize" # todo: NEW TRANSLATION
 colombia.9.d: "Andská diplomatická krize byla vyřešena na summitu Skupiny Rio. Kolumbie se omluvila za narušení ekvádorské suverenity. Vojska lze stáhnout od hranice." # todo: NEW TRANSLATION
 colombia.9.a: "Stáhnout se" # todo: NEW TRANSLATION
 colombia_news.1.t: "Kolumbie udeřila proti FARC v Ekvádoru" # todo: NEW TRANSLATION
 colombia_news.1.desc: "Kolumbijské ozbrojené síly provedly přeshraniční letecký útok na ekvádorském území a zabily vysokého velitele FARC Raúla Reyese. Quito odvolalo svého velvyslance a označilo operaci za flagrantní porušení mezinárodního práva. Venezuela a Ekvádor mobilizují vojska u kolumbijské hranice." # todo: NEW TRANSLATION
 colombia_news.1.a: "Za boj proti terorismu se omlouvat nebudeme" # todo: NEW TRANSLATION
 colombia_news.1.b: "Jde o akt agrese proti našemu národu" # todo: NEW TRANSLATION
 colombia_news.1.c: "Ekvádor nezůstane sám" # todo: NEW TRANSLATION
 colombia_news.1.d: "Boj Kolumbie proti FARC musí respektovat hranice" # todo: NEW TRANSLATION
 colombia_news.1.e: "Andy jsou na pokraji krize" # todo: NEW TRANSLATION
 colombia_news.1.f: "Regionální krize v Jižní Americe" # todo: NEW TRANSLATION
 colombia_news.2.t: "Andská krize vyřešena" # todo: NEW TRANSLATION
 colombia_news.2.desc: "Andská diplomatická krize z roku 2008 skončila na summitu Skupiny Rio poté, co se Kolumbie formálně omluvila za narušení ekvádorské suverenity. Regionální představitelé uvítali podání rukou jako krok zpět od propasti, přestože základní napětí mezi třemi národy přetrvává." # todo: NEW TRANSLATION
 colombia_news.2.a: "Diplomacie prozatím zvítězila" # todo: NEW TRANSLATION
 colombia_news.2.b: "Přijímáme omluvu a jdeme dál" # todo: NEW TRANSLATION
 colombia_news.2.c: "Region si může znovu oddechnout" # todo: NEW TRANSLATION
 colombia_news.2.d: "Jižní Amerika ustupuje od konfliktu" # todo: NEW TRANSLATION
