 UNSC.201.t: "[FROM.GetName] chce ovlivnit naše hlasování" # todo: NEW TRANSLATION
 UNSC.201.d: "[FROM.GetLeader] nenápadně oslovil [THIS.GetLeader] s žádostí, abychom v současné rezoluci Rady bezpečnosti Organizace spojených národů změnili svůj hlas na [vote_change_too]. Nabídli nám obchodní dohody a vzájemné investiční smlouvy spolu se zrušením embarg či blokád, pokud svůj hlas změníme. Nabídka by byla splněna po změně hlasu. Musíme rozhodnout, zda nám tato žádost stojí za změnu postoje v Radě bezpečnosti." # todo: NEW TRANSLATION
