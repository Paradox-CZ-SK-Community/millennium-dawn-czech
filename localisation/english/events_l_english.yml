 UNSC.200.t: "Pokus ovlivnit [?sway_target.GetName]" # todo: NEW TRANSLATION
 UNSC.200.d: "Abychom v této rezoluci §BRady bezpečnosti§! §YOrganizace spojených národů§! dosáhli požadovaného výsledku, musíme přimět více lidí, aby hlasovali s námi nebo se zdrželi hlasování. Abychom je přiměli změnit hlas, musíme jim za jejich podporu v tomto hlasování nabídnout něco hodnotného. Máme několik různých nabídek, ale nyní musíme jednu vybrat a doufat, že ji přijmou." # todo: NEW TRANSLATION
