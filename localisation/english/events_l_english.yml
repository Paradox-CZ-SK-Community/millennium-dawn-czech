 corruption.1.d: "Jeden z ministrů se ozval a řekl, že lze provést pár organizačních a právních změn pro optimalizaci výkonu naší administrativy, i když to bude vyžadovat... osobní angažovanost při posunu sil." # todo: NEW TRANSLATION
