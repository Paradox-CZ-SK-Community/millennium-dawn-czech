 news.2.d: "Dnes [mct_inviter.GetNameDef] a [mct_applicant.GetNameDef] podepsaly smlouvu o vojenské spolupráci, posilující jejich vojenské vazby." # todo: NEW TRANSLATION
 news.2.a: "Dobře" # todo: NEW TRANSLATION
 influence.1.t: "Nabídnout ekonomickou pomoc [From.GetName]?" # todo: NEW TRANSLATION
 influence.1.d: "Rozhodli jsme se začít připravovat balíček ekonomické pomoci. Můžeme se rozhodnout poslat 5%, 10% nebo 15% našeho HDP jako pomoc. Tato štědrost zlepší vztahy a udělí nám vliv v [FROM.GetName], i když není zaručeno, že pomoc využijí k něčemu hodnotnému. Čím více dáme, tím více vlivu získáme.\n\n" # todo: NEW TRANSLATION
 influence.1.a: "Poslat 5% HDP jako ekonomickou pomoc." # todo: NEW TRANSLATION
 influence.1.b: "Poslat 10% HDP jako ekonomickou pomoc." # todo: NEW TRANSLATION
 influence.1.c: "Poslat 15% HDP jako ekonomickou pomoc." # todo: NEW TRANSLATION
 influence.1.e: "Po zvážení, nepotřebují to." # todo: NEW TRANSLATION
 influence.2.t: "Nabídnout ekonomickou pomoc [FROM.GetName]?" # todo: NEW TRANSLATION
 influence.2.d: "Rozhodli jsme se začít připravovat balíček ekonomické pomoci pro [FROM.GetName]. Z naší státní pokladny můžeme přímo převést pevně stanovenou částku. Tato velkorysost zlepší vztahy a poskytne nám vliv v [FROM.GetName]. Čím více dáme, tím větší vliv získáme.\n\n" # todo: NEW TRANSLATION
 influence.2.a: "Poslat §G25 miliard§! v rámci ekonomické pomoci." # todo: NEW TRANSLATION
 influence.2.b: "Poslat §G50 miliard§! v rámci ekonomické pomoci." # todo: NEW TRANSLATION
 influence.2.c: "Poslat §G75 miliard§! v rámci ekonomické pomoci." # todo: NEW TRANSLATION
 influence.2.e: "Poslat §G100 miliard§! v rámci ekonomické pomoci." # todo: NEW TRANSLATION
 News_influence.0.t: "Ekonomická pomoc od [From.GetName] byla poskytnuta!" # todo: NEW TRANSLATION
 News_influence.0.d: "Dostali jsme $$[?gift_sum] miliard okamžité ekonomické pomoci od [From.GetName]. To posílilo [Root.GetAdjective]-[From.GetAdjective] vztahy, a přestože dar oficiálně přišel bez podmínek, chápe se, že to posílilo jejich vliv v naší zemi." # todo: NEW TRANSLATION
 News_influence.0.a: "Skvělé" # todo: NEW TRANSLATION
 News_influence.0.b: "Odmítnout pomoc" # todo: NEW TRANSLATION
 influence.3.t: "Zacílit na jiného influencera v [FROM.GetName]?" # todo: NEW TRANSLATION
 influence.3.d: "Na kterého z influencerů v [FROM.GetNameWithFlag] bychom se měli zaměřit, nebo bychom měli cílit na jejich domácí nezávislost?\n" # todo: NEW TRANSLATION
 influence.3.a: "Zacílit na domácí nezávislost [FROM.GetNameWithFlag]." # todo: NEW TRANSLATION
 influence.3.b: "Zacílit [?var:FROM.influence_array^0.GetNameWithFlag]." # todo: NEW TRANSLATION
 influence.3.c: "Zacílit [?var:FROM.influence_array^1.GetNameWithFlag]." # todo: NEW TRANSLATION
 influence.3.e: "Zacílit [?var:FROM.influence_array^2.GetNameWithFlag]." # todo: NEW TRANSLATION
 influence.3.f: "Stáhnout se." # todo: NEW TRANSLATION
 News_influence.1.t: "[FROM.GetNameWithFlag] napadl náš vliv v [From.From.GetNameWithFlag]!" # todo: NEW TRANSLATION
 News_influence.1.d: "Bohužel [FROM.GetLeader]'s [From.GetName] zasadil rychlou ránu našim ambicím v [From.From.GetName]. Jednostranně nás zasáhli, jejich útok na naše obchodní a vládní zájmy snížil náš vliv v [From.From.GetNameWithFlag]." # todo: NEW TRANSLATION
 News_influence.1.a: "Do prdele, [From.GetLeader]!" # todo: NEW TRANSLATION
 News_influence.2.t: "[From.GetNameWithFlag] napadl naši nezávislost na zahraničním vlivu!" # todo: NEW TRANSLATION
 News_influence.2.d: "Bohužel [From.GetLeader]'s [From.GetName] zasadil rychlou ránu našim snahám udržet cizí vměšování mimo a oslabil naši suverenitu. Naše nezávislost na zahraničním vlivu byla snížena." # todo: NEW TRANSLATION
 News_influence.2.a: "To není fér, [From.GetLeader]!" # todo: NEW TRANSLATION
 influence.5.t: "Provést převrat v [From.GetNameWithFlag]?" # todo: NEW TRANSLATION
 influence.5.d: "Drahý [Root.GetLeader], my ve zpravodajských službách [Root.GetAdjective] nemůžeme potvrdit ani vyvrátit, zda je [From.GetName] vhodné pro převrat.\n\nNicméně jsme, dle našich nejlepších schopností, sestavili pravděpodobnosti výsledků. Tyto jsou založeny na:\n - Jak velký máme vliv\n - Jak populární je náš pohled\n - Popularitě a stabilitě vlády\n - Které další vlivné země nás pravděpodobně podpoří\n - Které vlivné země pravděpodobně podpoří jejich současnou vládu.\n\nPokud v plánech postoupíme, pokusíme se použít převážně místní zdroje a kontakty, abychom zachovali plauzibilní popření." # todo: NEW TRANSLATION
 influence.5.a: "Provést převrat, aby u moci byla nejsilnější strana s naším směřováním." # todo: NEW TRANSLATION
 influence_coup_largest_success_TT: "§HÚspěšný převrat§!" # todo: NEW TRANSLATION
 influence_coup_largest_discovered_TT: "§RNeúspěšný převrat§!" # todo: NEW TRANSLATION
 influence.5.b: "Provést převrat, aby u moci byla stejná vládnoucí strana jako naše." # todo: NEW TRANSLATION
 influence.5.c: "Zatím odložit tyto plány." # todo: NEW TRANSLATION
 influence.5.d1: "Zavolejte Albionis, jdeme na to" # todo: NEW TRANSLATION
 News_influence.3.t: "Změna režimu!" # todo: NEW TRANSLATION
 News_influence.3.d: "Síly s podporou [From.GetAdjective] sesadily předchozí vládu." # todo: NEW TRANSLATION
 News_influence.3.a: "Wow..." # todo: NEW TRANSLATION
 News_influence.4.t: "Dramatické scény při vlně změny režimu v [From.From.GetNameWithFlag]" # todo: NEW TRANSLATION
 News_influence.4.d: "Po období zvýšené zahraniční zpravodajské činnosti, zejména od [From.GetNameWithFlag], byla předchozí vláda [From.From.GetName] svržena a mnozí vysocí představitelé bývalého režimu byli zadrženi. [From.From.GetLeader] z [From.From.GetRulingParty] vyšel uprostřed zmatku jako nový vůdce. První indikace naznačují, že nový režim [From.From.GetName] se bude identifikovat s [From.From.GetRulingIdeology], což naruší rovnováhu sil." # todo: NEW TRANSLATION
 News_influence.4.a: "Zajímavé" # todo: NEW TRANSLATION
 News_influence.5.t: "[From.GetNameWithFlag] pod tlakem, protože [From.From.GetNameWithFlag] porazil převrat" # todo: NEW TRANSLATION
 News_influence.5.d: "Lídr [From.From.GetAdjective] [From.From.GetLeader] energicky gestikuloval na pódiu, obviňujíc 'hostilní zlé síly vedené [From.GetName]' za dnešní poslední eskalaci, která viděla [From.From.GetLeader] porazit dramatický pokus o převrat. I když [From.GetAdjective] vůdce [From.GetLeader] důrazně popřel obvinění, je široce známo, že tito dva vůdci nejsou na jedné lodi. S [From.GetAdjective]-[From.From.GetAdjective] vazbami na historickém minimu, [From.From.GetName] slíbil veřejnosti, že \"vykoření [From.GetAdjective] vliv z [From.From.GetName]\", a jinak zdvojnásobí směr [From.From.GetRulingIdeology], kterým vládnoucí [From.From.GetRulingParty] nasměroval [From.From.GetNameWithFlag]." # todo: NEW TRANSLATION
 News_influence.5.a: "Zajímavé" # todo: NEW TRANSLATION
 News_influence.6.t: "Drama, když [From.From.GetNameWithFlag] se propadá do občanské války!" # todo: NEW TRANSLATION
 News_influence.6.d: "Dnes bylo možné pozorovat traumatické scény z [From.From.GetNameWithFlag], protože poslední dny protestů, nejistoty a podivných vojenských pohybů ustoupily střelbě, utrpení a uprchlíkům. Ač jsou detaily skoupé, zdá se, že několik celých jednotek [From.From.GetAdjective] armády se přidalo k ozbrojené opozici proti [From.From.GetLeader] a [From.From.GetRulingParty] ([From.From.GetRulingIdeology]). Vůdce opozice, hovořící anonymně pro WNN, uvedl, že \"očekávají významnou pomoc od [From.GetNameWithFlag] v jejich snažení svrhnout nelegitimního [From.From.GetAdjective] tyrana [From.From.GetLeader]\".\n\nAč [From.GetAdjective] vedení vyjádřilo \"překvapení nad těmito dramatickými událostmi\", blízcí pozorovatelé [From.GetAdjective]-[From.From.GetAdjective] vztahů tomuto dávají jen malou důvěryhodnost. Jeden analytik situaci popsal takto: \"Je jasné, že ve skutečnosti šlo o [From.GetAdjective] podporovaný pokus o převrat, který selhal v rychlosti dosažení cílů, což vyústilo v napjaté dohody, které se proměnily v to, co nyní vypadá jako plná občanská válka\". Několik světových lídrů, zejména těch s [From.From.GetRulingIdeology], nemělo k údajné [From.GetAdjective] účasti diplomatické slovo.\n\nS oběma stranami konfliktu reprezentujícími nejen výrazné domácí, ale i mezinárodní rozdíly, bude zajímavé sledovat, zda se do konfliktu zapojí i jiné státy." # todo: NEW TRANSLATION
 News_influence.6.a: "Kdo bude vládnout popelu?" # todo: NEW TRANSLATION
 influence.60.t: "Převrat v [event_target:coup_contest_victim.GetName]" # todo: NEW TRANSLATION
 influence.60.d: "Naše zpravodajské služby potvrzují to, co mnozí tušili: [event_target:coup_contest_sender.GetNameWithFlag] zorganizoval úspěšný §Rpřevrat§! v [event_target:coup_contest_victim.GetNameWithFlag] a dosadil nový režim nakloněný jeho zájmům. V [event_target:coup_contest_victim.GetName] máme značný vlastní §Hv­liv§!, dostatečný k tomu, abychom zde nebyli bezmocní, pokud se rozhodneme jednat. Naše možnosti sahají od diplomatického odsouzení až po tajnou podporu starého režimu. Každá z nich něco stojí. Nicnedělání nás může stát ještě více." # todo: NEW TRANSLATION
 influence.60.a: "Veřejně odsoudit a uvalit sankce na [event_target:coup_contest_sender.GetName]" # todo: NEW TRANSLATION
 influence.60.f: "Uvalit cílené §Hekonomické sankce§! na [event_target:coup_contest_sender.GetName]" # todo: NEW TRANSLATION
 influence.60.b: "Tajně podpořit starou opozici a prosazovat vlastní vliv" # todo: NEW TRANSLATION
 influence.60.e: "§RVojenská intervence§!: vyzbrojit odboj a zaujmout postoj proti [event_target:coup_contest_sender.GetName]" # todo: NEW TRANSLATION
 influence.60.c: "Přijmout novou realitu a jít dál" # todo: NEW TRANSLATION
 influence.61.t: "Občanská válka v [event_target:coup_contest_victim.GetName]" # todo: NEW TRANSLATION
 influence.61.d: "Pokus o převrat ze strany [event_target:coup_contest_sender.GetNameWithFlag] se obrátil proti jeho strůjcům: [event_target:coup_contest_victim.GetNameWithFlag] je v §Robčanské válce§! a starý režim stále bojuje. Náš §Hv­liv§! nám dává skutečný podíl na tom, která strana zvítězí. Vyzbrojme starou vládu a možná zabráníme [event_target:coup_contest_sender.GetName] upevnit jeho zisky. Pošleme pouze peníze a zajistíme se. Plně se angažujme a budeme tahat za nitky. Zůstaneme stranou a necháme ostatní rozhodnout o výsledku." # todo: NEW TRANSLATION
 influence.61.a: "Vyzbrojit starý režim: zbraně, vybavení a politická podpora" # todo: NEW TRANSLATION
 influence.61.b: "Tiše poslat ekonomickou pomoc, aby starý režim přežil" # todo: NEW TRANSLATION
 influence.61.e: "§RPlná vojenská intervence§!: zasadit se o vítězství starého režimu" # todo: NEW TRANSLATION
 influence.61.c: "Zůstat mimo občanskou válku" # todo: NEW TRANSLATION
 influence.62.t: "Zahraniční lobbisté ovládli naši vládu" # todo: NEW TRANSLATION
 influence.62.d: "Předsedové výborů, kteří během minulého zasedání požadovali omezení zahraničního kapitálu, zmlkli. Pracovníci ministerstev odpovídají na telefonáty z ambasády [?var:ROOT.influence_lobbied_by.GetNameWithFlag] dříve než na naše a členové, kteří by za normálních okolností vedli tažení proti zahraničnímu vlivu, nyní pobírají ne dohledatelné honoráře. Nic nezákonného se nikdy neprokáže, ale naše vláda v příštích měsících nebude mít chuť k boji ani hlasy nazbyt." # todo: NEW TRANSLATION
 influence.62.a: "Máme svázané ruce" # todo: NEW TRANSLATION
 News_influence.7.t: "[FROM.GetNameWithFlag] odsuzuje [event_target:coup_contest_sender.GetNameWithFlag]" # todo: NEW TRANSLATION
 News_influence.7.d: "[FROM.GetNameWithFlag] dnes vydal ostré odsouzení údajné role [event_target:coup_contest_sender.GetNameWithFlag] v nedávném převratu v [event_target:coup_contest_victim.GetNameWithFlag]. Na stole jsou diplomatické protesty, cílené §Hsankce§! i zhoršení vztahů. Ministerstvo zahraničí [event_target:coup_contest_sender.GetName] odmítlo obvinění jako „nepodložené politické divadlo“, ale mezinárodní mínění se rychle přiostřuje." # todo: NEW TRANSLATION
 News_influence.7.a: "První výstřel války o vliv" # todo: NEW TRANSLATION
 News_influence.8.t: "[FROM.GetNameWithFlag] podporuje starou opozici v [event_target:coup_contest_victim.GetName]" # todo: NEW TRANSLATION
 News_influence.8.d: "Zpravodajské zdroje potvrzují to, co pozorovatelé tuší už několik týdnů: [FROM.GetNameWithFlag] potají směřuje §Hfinancování§! a §Hpolitickou podporu§! předpřevratové opozici uvnitř [event_target:coup_contest_victim.GetNameWithFlag]. Demokratické frakce v zemi jsou náhle lépe organizované, lépe financované a výrazně hlasitější. §HRežim po převratu§! v [event_target:coup_contest_victim.GetName] označil tuto činnost za „nepřijatelnou zahraniční intervenci“. Stejnou činností se přitom dostal k moci." # todo: NEW TRANSLATION
 News_influence.8.a: "Souboj o [event_target:coup_contest_victim.GetName] ještě neskončil" # todo: NEW TRANSLATION
 News_influence.9.t: "[FROM.GetNameWithFlag] vyzbrojuje starý režim v [event_target:coup_contest_victim.GetName]" # todo: NEW TRANSLATION
 News_influence.9.d: "Poté, co [event_target:coup_contest_victim.GetNameWithFlag] zachvátila §Robčanská válka§! po zpackaném převratu [event_target:coup_contest_sender.GetNameWithFlag], [FROM.GetNameWithFlag] odhodil veškeré předstírání neutrality. Nákladní letadla z [FROM.GetName] přistávají na území drženém vládou naložená §Hručními zbraněmi§!, §Hvozidly§! a podle několika zdrojů také uniformovanými „poradci“. Zástupná válka je nyní otevřená." # todo: NEW TRANSLATION
 News_influence.9.a: "Čeká nás dlouhý boj" # todo: NEW TRANSLATION
 News_influence.10.t: "[FROM.GetNameWithFlag] zahajuje vojenskou intervenci v [event_target:coup_contest_victim.GetName]" # todo: NEW TRANSLATION
 News_influence.10.d: "V dosud nejvyhrocenější reakci na převrat [event_target:coup_contest_sender.GetNameWithFlag] v [event_target:coup_contest_victim.GetNameWithFlag] oznámil [FROM.GetNameWithFlag] formální §Rvojenskou intervenci§!. Slovník je umírněný, ale skutečnost nikoli: jednotky rozmístěné vpředu, trvalé rozkazy k pomoci vládě před převratem a otevřené pohrdání hotovou věcí [event_target:coup_contest_sender.GetName]. Globální trhy jsou v chaosu. Rada bezpečnosti OSN byla svolána k mimořádnému zasedání." # todo: NEW TRANSLATION
 News_influence.10.a: "Hranice byla překročena" # todo: NEW TRANSLATION
 influence.51.t: "Vojenská pomoc [FROM.GetName]" # todo: NEW TRANSLATION
 influence.51.d: "[FROM.GetName] projevil zájem o některé naše lehké zbraně a pěchotní vozidla. Měli bychom rozhodnout, zda stojí za to jim poslat vojenské vybavení, pokud jej nepoužijí proti nám...\n" # todo: NEW TRANSLATION
 influence.51.a: "Jo, udělejme to!" # todo: NEW TRANSLATION
 influence.51.a_tt: "Rozhodnete, jaké vybavení pošlete!" # todo: NEW TRANSLATION
 influence.51.b: "Po zvážení.." # todo: NEW TRANSLATION
 influence.51.b_tt: "Po zvážení. Potřebuji ty zbraně!" # todo: NEW TRANSLATION
 influence.52.t: "Otázka co" # todo: NEW TRANSLATION
 influence.52.d: "Máme následující možnosti, co poslat našemu spojenci.\n\nBalíček pro pěchotu: 250 jednotek pěchotního vybavení/malých zbraní, 10 jednotek C&C vybavení, 10 jednotek přenosných protiletadlových řízených zbraní, 10 jednotek protitanků podle dostupnosti na našem skladě.\n\nBalíček vozidel: 10 jednotek BVP, 10 jednotek IFV, 10 jednotek užitkových vozidel.\n\n" # todo: NEW TRANSLATION
 influence.52.a: "Balíček pro pěchotu." # todo: NEW TRANSLATION
 influence.52.b: "Balíček vozidel." # todo: NEW TRANSLATION
 influence.52.e: "Balíček §Hmoderního vybavení§! (těžké protitankové zbraně, SAM, drony)" # todo: NEW TRANSLATION
 influence.52.c: "Vlastně je potřebuji..." # todo: NEW TRANSLATION
 influence.52.a_preview_tt: "Poslat ruční zbraně, lehké protitankové zbraně a protiletadlové vybavení" # todo: NEW TRANSLATION
 influence.52.b_preview_tt: "Poslat hlavní bojové tanky, obojživelné / specializované tanky a užitková vozidla" # todo: NEW TRANSLATION
 influence.52.e_preview_tt: "Poslat těžké protitankové střely, střely země-vzduch a vojenské drony" # todo: NEW TRANSLATION
 influence.57.t: "Jak velký balíček?" # todo: NEW TRANSLATION
 influence.57.d: "Rozhodli jsme, co pošleme. Nyní musíme rozhodnout, §Hkolik§!. Větší balíčky stojí více §Hpolitického kapitálu§!, vytvářejí větší §Rsvětové napětí§! a vyvolávají zpravodajské pokrytí v zahraničí." # todo: NEW TRANSLATION
 influence.57.a: "Poslat §Hmalý§! balíček" # todo: NEW TRANSLATION
 influence.57.b: "Poslat §Hstřední§! balíček" # todo: NEW TRANSLATION
 influence.57.c: "Poslat §Hvelký§! balíček" # todo: NEW TRANSLATION
 influence.57.e: "Když o tom tak přemýšlím, zrušit" # todo: NEW TRANSLATION
 influence.53.t: "Vojenská pomoc od [FROM.GetName]" # todo: NEW TRANSLATION
 influence.53.d: "[From.GetName] nám poslal balíček zbraní. Měli bychom je ponechat nebo vrátit?" # todo: NEW TRANSLATION
 influence.53.a: "Přijmout balíček." # todo: NEW TRANSLATION
 influence.53.c: "Vrátit vybavení." # todo: NEW TRANSLATION
 News_influence.11.t: "[FROM.FROM.GetName] posílá [FROM.GetName] rozsáhlý balíček zbraní" # todo: NEW TRANSLATION
 News_influence.11.d: "[FROM.FROM.GetName] oznámil §Hrozsáhlý balíček vojenské pomoci§! pro [FROM.GetName]: tisíce ručních zbraní, vozidel a podpůrného vybavení. Analytici upozorňují, že transfer signalizuje pevnější odhodlání [FROM.FROM.GetName] bránit [FROM.GetName]. Soupeři zuří; spojenci sledují, kdo bude další." # todo: NEW TRANSLATION
 News_influence.11.a: "Příliv zbraní pokračuje" # todo: NEW TRANSLATION
 News_influence.12.t: "[FROM.FROM.GetName] převádí [FROM.GetName] pokročilé zbraně" # todo: NEW TRANSLATION
 News_influence.12.d: "Při transferu, který překračuje všechny červené linie globálního trhu se zbraněmi, poslal [FROM.FROM.GetName] [FROM.GetName] §Htěžké protitankové střely§!, §Hsystémy země-vzduch§! a §Hbojové drony§!. Každá z těchto zbraní dokáže proměnit regionální potyčky ve války. Soupeři [FROM.GetName] to označují za přímou hrozbu. Diplomatické telefonní linky v hlavních městech se rozžhavily." # todo: NEW TRANSLATION
 News_influence.12.a: "Moderní válka právě získala moderní zbraně" # todo: NEW TRANSLATION
 influence.54.t: "Měsíční automatická zpráva o ovlivňování" # todo: NEW TRANSLATION
 influence.54.d: "[?nations_influenced|0] bylo úspěšně ovlivněno k [GetDateText]. Následující státy byly ovlivněny našimi probíhajícími snahami o vliv:" # todo: NEW TRANSLATION
 influence.54.a: "Dobře, děkuji!" # todo: NEW TRANSLATION
 econvent.1.t: "Centrální banka [Root.GetName] varuje před možné bublinou na trhu s bydlením" # todo: NEW TRANSLATION
 econvent.1.d: "Drahý [Root.GetLeader], s politováním vám oznamujeme, že značná část našeho expertního týmu (nejlepší a nejchytřejší [Root.GetAdjective] ekonomové) zaznamenává včasné příznaky, že trh s bydlením v [Root.GetName] je přehřátý a může směřovat k bublině, která je připravená prasknout. Mějte na paměti, že předpovídání budoucnosti je obtížné a může se stát, že se naši experti mýlí.\nRádi bychom vám, pane, nedávali rozkazy, ale udělat nějaké úpravy nyní bude méně bolestivé než řešit plnohodnotnou krizi později." # todo: NEW TRANSLATION
 econvent.1.a: "Uchladíme trhy dřív, než se to zhorší." # todo: NEW TRANSLATION
 econvent.1.b: "Dost toho nesmyslu. [Root.GetAdjective] ekonomika je vždy zdravá!" # todo: NEW TRANSLATION
 econvent.1.b_tt: "§HŽádný efekt§! prozatím, ale v budoucnu může vzniknout bublina na trhu s bydlením\n" # todo: NEW TRANSLATION
 econvent.2.t: "Klesající ceny nemovitostí" # todo: NEW TRANSLATION
 econvent.2.d: "Jak ceny domů a bytů prudce vzrostly, zejména v uplynulém roce, lidé si brali stále větší půjčky, aby si bydlení mohli dovolit, zatímco spekulanti těžce investovali do nemovitostí, také na úvěr. Teď se to rychle končí. Ceny klesají a lidé se snaží prodat, jako by nebylo zítra. Mnozí méně šťastní zůstanou s obrovskými půjčkami, které nemohou splácet. Lidé nadávají jak na [Root.GetLeader]a, tak na [Root.GetAdjective] centrální banku za to, že to způsobili; musíme rychle vydat veřejné prohlášení, jak této krizi chceme čelit." # todo: NEW TRANSLATION
 econvent.2.a: "Vystříkáme systém levnými penězi, aby se trh odrazil." # todo: NEW TRANSLATION
 econvent.2.b: "Je to bolestivé, ale ceny bydlení musely klesnout." # todo: NEW TRANSLATION
 econvent.3.t: "Krach na burze" # todo: NEW TRANSLATION
 econvent.3.d: "Zdá se, že chaos po prasknutí bubliny na trhu s bydlením zasáhl i burzu. Ceny akcií téměř všech kotovaných [Root.GetAdjective] společností dnes ráno prudce klesly a naše měna výrazně oslabla. Obchodování bylo dočasně pozastaveno před obědem, ale po znovuotevření se neočekává zlepšení, protože každý zoufale prodává akcie." # todo: NEW TRANSLATION
 econvent.3.a: "Štěstí, že mé peníze byly v offshore daňových rájích." # todo: NEW TRANSLATION
 econvent.3.b: "Vydat záchranné balíčky." # todo: NEW TRANSLATION
 econvent.4.t: "[Root.GetAdjective] banky čelí krizi" # todo: NEW TRANSLATION
 econvent.4.d: "Přes horký lahodný latte-art espresso ve vašem [Root.GetName] §R<3§! šálku [Root.GetLeader], toto není dobrý den. Zoufalí finanční magnáti, jejich lobbisté a politici, jimž přispívají, se hrnou na [Root.GetAdjective] vládní úřady a nesou stejnou zprávu: \"Potřebujeme záchranu!\".\n\nZdá se, že kombinovaný šok z poklesu trhu s bydlením a krachu na burze byl pro finanční sektor příliš. Nárůst špatných dluhů ze spekulací je prostě příliš velký; musí přijít příliv vládních peněz - jinak budou bankroty napříč a nevinní střadatelé přijdou o své vklady." # todo: NEW TRANSLATION
 econvent.4.a: "Poskytneme záchranné balíčky." # todo: NEW TRANSLATION
 econvent.4.b: "Žádné záchrany, ale garantujeme úspory." # todo: NEW TRANSLATION
 econvent.4.c: "Přežije nejsilnější — to je krása kapitalismu." # todo: NEW TRANSLATION
 econvent.5.t: "[Root.GetAdjective] spotřebitelé utrácejí méně" # todo: NEW TRANSLATION
 econvent.5.d: "Nedávná zpráva ukázala, že pracovití [Root.GetAdjective] lidé stále více obávají o svou budoucnost. Tento pesimismus vede lidi k větším úsporám a celková spotřeba klesá. Pokud to bude pokračovat, mnoho podniků v [Root.GetName] bude muset propouštět nebo zavřít. Exportéři [Root.GetAdjective] zboží však nejsou touto změnou výrazně zasaženi." # todo: NEW TRANSLATION
 econvent.5.a: "Přerozdělit nějaké peníze na nákupy." # todo: NEW TRANSLATION
 econvent.5.b: "Doufejme, že to přejde." # todo: NEW TRANSLATION
 econvent.6.t: "Nižší poptávka po [Root.GetAdjective] zboží v zahraničí" # todo: NEW TRANSLATION
 econvent.6.d: "Data jsou jasná; mezinárodní exporty [Root.GetName] klesají. Příčina je však předmětem ostrých debat mezi poradci [Root.GetLeader]a. Jedna teorie říká, že jsme méně konkurenceschopní kvůli relativně vysokým mzdám, jiná, že naši konkurenti zvýšili kvalitu svých produktů. Jiní soudí, že pokles poptávky je jen důsledkem měnících se trendů v zahraničí. Ať už je příčina jakákoli, moc s tím nedokážeme dělat — musíme to překonat a pracovat víc do budoucna." # todo: NEW TRANSLATION
 econvent.6.a: "Cizinci blázní. [Root.GetAdjective] věci jsou nejlepší!" # todo: NEW TRANSLATION
 econvent.7.t: "Sucho způsobuje katastrofu pro [Root.GetAdjective] farmáře" # todo: NEW TRANSLATION
 econvent.7.d: "Ač obvykle nemíváme mnoho deště, srážky v tomto vegetačním období byly hrozné a většina úrod selhala. Co málo zemědělské produkce zbylo, je díky řekám a umělé závlaze, což je v [Root.GetName] bohužel vzácné. Farmáři žádají pomoc od vlády [Root.GetLeader] a městští obyvatelé se obávají rostoucích cen potravin." # todo: NEW TRANSLATION
 econvent.7.a: "Příště víc štěstí." # todo: NEW TRANSLATION
 econvent.8.t: "Hladomor v [Root.GetName]!" # todo: NEW TRANSLATION
 econvent.8.d: "Pokračující sucho způsobilo, že velké části venkova v [Root.GetName] postrádají dostupné potraviny. Zásoby jsou vyčerpány a skutečný hladomor způsobuje podvýživu, smrt a nemoci." # todo: NEW TRANSLATION
 econvent.8.a: "Au!" # todo: NEW TRANSLATION
 econvent.9.t: "Zvýšená spotřebitelská důvěra" # todo: NEW TRANSLATION
 econvent.9.d: "Nedávné podmínky v [ROOT.GetAdjective] ekonomice ukázaly, že spotřebitelé nyní mají ideální tržní podmínky utrácet a investovat do budoucnosti země. Lidé kupují spotřební zboží jako by nebyl zítřek!" # todo: NEW TRANSLATION
 econvent.9.a: "Skvělé zprávy!" # todo: NEW TRANSLATION
 econvent.10.t: "Boom na burze" # todo: NEW TRANSLATION
 econvent.10.d: "[ROOT.GetAdjective] burza boomuje. [ROOT.GetAdjective] lidé obchodují s akciemi jako by nakupovali potraviny.\n" # todo: NEW TRANSLATION
 econvent.10.a: "Udržte boom!" # todo: NEW TRANSLATION
 econvent.10.a_tt: "Dodatkové vstřikování likvidity na trh může být ničivé, pokud nastane krach.\n" # todo: NEW TRANSLATION
 econvent.10.b: "Skvělé" # todo: NEW TRANSLATION
 econvent.10.b_tt: "Trh bude pokračovat bez zásahu. Stále existuje střední riziko krachu.\n" # todo: NEW TRANSLATION
 econvent.10.c: "Zpomalit ekonomiku." # todo: NEW TRANSLATION
 econvent.10.c_tt: "Ekonomika se zahřála příliš rychle. Pojďme začít zpomalovat tempo utažením toku kapitálu.\n" # todo: NEW TRANSLATION
 econvent.11.t: "Selhání významné finanční instituce" # todo: NEW TRANSLATION
 econvent.11.d: "V titulcích se objevily zprávy o krachu významné finanční instituce. Média šíří paniku a volají po vládní reakci s obavami z širší krize. Co bychom měli udělat?" # todo: NEW TRANSLATION
 econvent.11.a: "Příliš velká na to, aby zbankrotovala..." # todo: NEW TRANSLATION
 econvent.11.b: "To je jen dobrý obchod..." # todo: NEW TRANSLATION
 econvent.12.t: "Finanční krize [FROM.GetName] nese následky" # todo: NEW TRANSLATION
 econvent.12.d: "Nedávná krize v [FROM.GetName] způsobila mnoho obtíží i v naší zemi, protože dopady jejich krize jsou cítit i zde. Naše propojené ekonomiky nyní obě trpí tíhou této krize." # todo: NEW TRANSLATION
 econvent.12.a: "Vydat úlevné fondy." # todo: NEW TRANSLATION
 econvent.12.b: "Trh nade vše." # todo: NEW TRANSLATION
 econvent.13.t: "Vysoký dluh způsobuje, že firmy odcházejí" # todo: NEW TRANSLATION
 econvent.13.d: "Náš vysoký poměr dluhu k HDP způsobuje, že firmy v zemi se zavírají a odcházejí. Snížení našeho dluhu je nezbytné, jinak uvidíme více průmyslu odcházet." # todo: NEW TRANSLATION
 econvent.13.a: "Povolit firmě odejít" # todo: NEW TRANSLATION
 econvent.13.b: "Koupit firmu" # todo: NEW TRANSLATION
 econvent.14.t: "Soukromí investoři investují do civilního průmyslu" # todo: NEW TRANSLATION
 econvent.14.d: "Několik soukromých investorů se rozhodlo investovat do nové civilní průmyslové linky v zemi. Nový tovární podnik přinese pracovní místa a více prosperity naší zemi. Dodatečná stavební a výrobní kapacita nám jistě pomůže ekonomicky nastartovat." # todo: NEW TRANSLATION
 econvent.14.a: "Úžasné!" # todo: NEW TRANSLATION
 econvent.15.t: "Soukromí investoři investují do kancelářských parků" # todo: NEW TRANSLATION
 econvent.15.d: "Skupina soukromých investorů se rozhodla investovat do řady menších třetích služeb" # todo: NEW TRANSLATION
 econvent.15.a: "Úžasné!" # todo: NEW TRANSLATION
 econvent.16.t: "Šíří se moderní výrobní metody" # todo: NEW TRANSLATION
 econvent.16.d: "Firmy po celé zemi [ROOT.GetName] přijímají lepší výrobní metody a reorganizují svá pracoviště. Tyto změny zvyšují výrobu v celé ekonomice." # todo: NEW TRANSLATION
 econvent.16.a: "Podpořit přechod" # todo: NEW TRANSLATION
 econvent.17.t: "Investice do vzdělávání přinášejí ovoce" # todo: NEW TRANSLATION
 econvent.17.d: "Léta investic do škol a odborného vzdělávání rozšířila okruh kvalifikovaných pracovníků. Zaměstnavatelé tyto znalosti využívají k produktivním účelům." # todo: NEW TRANSLATION
 econvent.17.a: "Využít tyto schopnosti" # todo: NEW TRANSLATION
 econvent.18.t: "Zahraniční technologie se šíří v domácí ekonomice" # todo: NEW TRANSLATION
 econvent.18.d: "Obchodní vazby vystavily místní firmy lepším strojům a průmyslovým postupům. Domácí výrobci nyní tyto metody přizpůsobují vlastním provozům." # todo: NEW TRANSLATION
 econvent.18.a: "Podpořit domácí přijetí" # todo: NEW TRANSLATION
 econvent.19.t: "Oznámena investice do polovodičové slévárny" # todo: NEW TRANSLATION
 econvent.19.d: "Soukromé konsorcium se zavázalo vybudovat novou polovodičovou slévárnu v [ROOT.GetName]. Spolehlivý přístup k průmyslovým vstupům a energiím učinil projekt komerčně životaschopným." # todo: NEW TRANSLATION
 econvent.19.a: "Uvítat investici" # todo: NEW TRANSLATION
 econvent.20.t: "Oznámeno rozšíření kompozitního průmyslu" # todo: NEW TRANSLATION
 econvent.20.d: "Výrobci rozšiřují domácí produkci kompozitů, aby zásobovali pokročilý civilní a vojenský průmysl. Investoři očekávají, že zajištěné suroviny udrží nový závod konkurenceschopný." # todo: NEW TRANSLATION
 econvent.20.a: "Podpořit rozšíření" # todo: NEW TRANSLATION
 econvent.21.t: "Obranné zakázky rozšiřují výrobu" # todo: NEW TRANSLATION
 econvent.21.d: "Nové obranné zakázky dodaly výrobcům jistotu potřebnou k rozšíření produkce. Projekt vytvoří kvalifikovaná pracovní místa a zároveň posílí národní průmyslovou základnu." # todo: NEW TRANSLATION
 econvent.21.a: "Přidělit zakázky" # todo: NEW TRANSLATION
 econvent.22.t: "Objednávky komerčních lodí prudce rostou" # todo: NEW TRANSLATION
 econvent.22.d: "Poptávka po vývozu a příznivé podmínky v námořním průmyslu zaplnily domácí knihy objednávek. Loděnice rozšiřují kapacitu, aby zvládly nové smlouvy." # todo: NEW TRANSLATION
 econvent.22.a: "Podpořit loděnice" # todo: NEW TRANSLATION
 anti_bully.2.t: "Veřejná únava z války" # todo: NEW TRANSLATION
 anti_bully.2.d: "Rozhodli jsme se, že válka je naším nejlepším postupem. Abychom však udrželi podporu mezi lidmi, musíme buď vyhrát rychle, nebo rychle vpřed na cizí půdu. Lidé budou pochodovat, pokud uvidí, jak je tato válka nutná. Boty pochodují, bubny bijí a čas [From.GetName] jít do války nastal!\n\n§YToto spouští systém veřejné únavy z války§!\n" # todo: NEW TRANSLATION
 anti_bully.2.a: "Musíme vyhrát!" # todo: NEW TRANSLATION
 sco.1.t: "[FROM.GetName] podal žádost o pozorovatelský status SCO" # todo: NEW TRANSLATION
 sco.1.d: "Nový stát si přeje pozorovat postupy SCO a možná se jednou stát plnoprávným členem organizace!" # todo: NEW TRANSLATION
 sco.1.a: "Nevidíme důvod, proč jejich žádosti nevyhovět." # todo: NEW TRANSLATION
 sco.1.b: "Nemůžeme jim tento status udělit!" # todo: NEW TRANSLATION
 sco.2.t: "[FROM.GetName] podal žádost o členství v SCO" # todo: NEW TRANSLATION
 sco.2.d: "Nový stát si přeje stát se plnoprávným členem organizace!" # todo: NEW TRANSLATION
 sco.2.a: "Nevidíme důvod, proč jejich žádosti nevyhovět." # todo: NEW TRANSLATION
 sco.2.b: "Nemůžeme jim tento status udělit!" # todo: NEW TRANSLATION
 sco.3.t: "[FROM.GetName] nabízí společné vojenské cvičení s námi" # todo: NEW TRANSLATION
 sco.3.d: "Tento spolustát člen SCO navrhuje společné cvičení k posílení naší vojenské spolupráce a zvýšení důvěry mezi našimi dvěma zeměmi." # todo: NEW TRANSLATION
 sco.3.a: "Je to vítaná příležitost pro naše jednotky získat zkušenosti!" # todo: NEW TRANSLATION
 sco.3.b: "Spolupráce s [FROM.Getname] je nemožná." # todo: NEW TRANSLATION
 sco.4.t: "[FROM.GetName] přijal naši nabídku!" # todo: NEW TRANSLATION
 sco.4.d: "Delegace z [FROM.GetAdjective] přívětivě přijaly náš návrh a připravují se na naše společné cvičení." # todo: NEW TRANSLATION
 sco.4.a: "Ať hry začnou!" # todo: NEW TRANSLATION
 sco.5.t: "[FROM.GetName] odmítl naši nabídku!" # todo: NEW TRANSLATION
 sco.5.d: "Delegace z [FROM.GetAdjective] odmítly provést plodné vojenské cvičení s námi." # todo: NEW TRANSLATION
 sco.5.a: "Jejich ztráta..." # todo: NEW TRANSLATION
 sco.6.t: "SCO zahajuje rozsáhlá vojenská cvičení" # todo: NEW TRANSLATION
 sco.6.d: "[FROM.GetAdjective] jednotky se dnes připojily k tisícům dalších v tom, co je popisováno jako proti-teroristické cvičení pod záštitou Šanghajské organizace pro spolupráci (SCO). Zatímco mnozí vítají tato cvičení jako příznak úspěšné mezinárodní spolupráce, jiní reagovali mnohem méně nadšeně. Američtí a evropští analytici poukázali na nasazení dálkových letadel a značné palebné síly jako důkaz, že tato cvičení nejsou přípravou na proti-teroristické operace, ale na důkladnou generálku pro konfrontaci se Západem." # todo: NEW TRANSLATION
 sco.6.a: "Jsou to ohrožující manévry proti nám?" # todo: NEW TRANSLATION
 sco.6.b: "Jen teroristé mají čeho se bát!" # todo: NEW TRANSLATION
 sco.6.c: "Zajímavý vývoj" # todo: NEW TRANSLATION
 sco.7.t: "[FROM.GetName] získává členství v SCO" # todo: NEW TRANSLATION
 sco.7.d: "Po postupném procesu integrace dnes [FROM.GetLeader] oznámil členství své země v Šanghajské organizaci pro spolupráci. Nadějní pozorovatelé toto vnímají jako další krok regionální ekonomické a politické spolupráce v Eurasii, zatímco skeptičtější analytici lamentují rostoucí vliv Číny a hrozbu, kterou to představuje pro stávající světový řád." # todo: NEW TRANSLATION
 sco.7.a: "Čínská hrozba roste..." # todo: NEW TRANSLATION
 sco.7.b: "Dobrý den pro diplomacii!" # todo: NEW TRANSLATION
 sco.8.t: "[FROM.GetName] opouští SCO" # todo: NEW TRANSLATION
 sco.8.d: "Po přehodnocení čínských kroků současnou [FROM.GetAdjective] vládou, [FROM.GetLeader] stáhl [FROM.GetNameDef] ze Šanghajské organizace pro spolupráci. [CHI.GetLeader] se k vývoji ještě nevyjádřil, ale čínská vládou napojená média rychle litovala, že tento odchod představuje krok zpět v regionální integraci." # todo: NEW TRANSLATION
 sco.8.a: "Čínská agrese tento národ odcizila." # todo: NEW TRANSLATION
 sco.8.b: "Smutný den pro mezinárodní spolupráci..." # todo: NEW TRANSLATION
 sco.9.t: "Čína převzala vládu nad SCO od Ruska" # todo: NEW TRANSLATION
 sco.9.d: "Šanghajská organizace pro spolupráci byla historicky řízena jako společné sino-ruské úsilí. Nicméně nespokojenost Číny s tímto uspořádáním údajně přinutila Rusko k podřízenější pozici v organizaci. Zatímco [CHI.GetLeader] i [SOV.GetLeader] mlčí o tomto mocenském zápase, ruské úředníky to údajně rozzuřilo a jsou zahořklí z ponížení slovanského obra, které se odehrálo na očích ostatních členů SCO. Geopolitické rameno tohoto kroku ve smyslu hegemonie nad Střední Asií bude pravděpodobně značné." # todo: NEW TRANSLATION
 sco.9.a: "Čína nechce sdílet pozornost..." # todo: NEW TRANSLATION
 sco.10.t: "Čína nás žádá, abychom si vybrali stranu" # todo: NEW TRANSLATION
 sco.10.d: "Naše současné členství zároveň v CSTO i v SCO nás dostalo do obtížné pozice v důsledku čínsko-ruského rozkolu. Čína nyní požaduje, abychom buď opustili SCO a zůstali v ruské alianci, nebo zůstali v SCO a opustili Rusko. Volba, kterou učiníme, bude téměř jistě významná v konfrontaci mezi dvěma regionálními giganty, která brzy přijde." # todo: NEW TRANSLATION
 sco.10.a: "Jsme přece věrní!" # todo: NEW TRANSLATION
 sco.10.b: "Čas opustit tuto klesající loď..." # todo: NEW TRANSLATION
 sco.11.t: "[FROM.GetName] nám poskytuje rozvojovou pomoc!" # todo: NEW TRANSLATION
 sco.11.d: "V rámci Šanghajské organizace pro spolupráci poskytuje [FROM.GetAdjective] vláda našim místním podnikům potřebné prostředky a zdroje, aby usnadnila jejich rozvojové projekty. Ač je tato pomoc dobrá pro naši ekonomiku, zvýší i míru vlivu, který [FROM.GetNameDef] na nás má." # todo: NEW TRANSLATION
 sco.11.a: "Jsme vděční za pomoc!" # todo: NEW TRANSLATION
 sco.12.t: "[FROM.GetName] vytvořil $SHANGHAI_PACT$!" # todo: NEW TRANSLATION
 sco.12.d: "[FROM.GetName] vytvořil $SHANGHAI_PACT$ na soupeření s [USA.GetFactionName]. Dovolili jsme jim mít velký [FROM.GetAdjective] vliv na nás, jsme také členem SCO, takže jsme nuceni stát se členem nové frakce." # todo: NEW TRANSLATION
 sco.12.a: "Dobře" # todo: NEW TRANSLATION
 taiwan.1.t: "Shromáždění 228 Ruka v ruce" # todo: NEW TRANSLATION
 taiwan.1.d: "Demonstrace solidarity. Lidský řetěz asi dvou milionů lidí vytvořil 500 km dlouhý řetěz. Začínaje v přístavu v Keelungu, severním městě Tchaj-wanu, řetěz vedl až na nejjižnější špičku ostrova. Účel byl dvojí: Tchajwané chtěli mír, ale také protestovali proti rozmístění raket Čínské lidové republiky namířených na Tchaj-wan, jejich ostrovního souseda. Některé symboly protestu, zejména moment, kdy účastníci \"odvracejí tváře od Číny\", se jasně přiklonily k podpoře tchajwanské nezávislosti, a proto se jí nezúčastnili členové Pan-Modré koalice, kteří o několik dní později uspořádali vlastní ostrovní shromáždění." # todo: NEW TRANSLATION
 taiwan.1.a: "Nikdy nezapomeneme oběti." # todo: NEW TRANSLATION
 taiwan.2.t: "Tajfun Bilis" # todo: NEW TRANSLATION
 taiwan.2.d: "V přípravě na Bilis byly úřady po celém ostrově uzavřeny. Kromě uzavření podniků byly lety na ostrov a z něj přeplánovány a zřízeno centrum pomoci pro tajfun. Vzhledem k hrozbě sesuvů půdy bylo vydáno varování pro Taiwan. Ačkoli bouře ještě nedopadla na pevninu, 22. srpna byl v Taipei jeden člověk zabit po sesuvu půdy vyvolaném blížícím se tajfunem; šlo o první úmrtí způsobené Bilisem. Kromě přeplánování letů byly uzavřeny četné letiště a burza v Taipei byla uzavřena 23. srpna. Mezitím nemocnice prodloužily provozní doby v očekávání příjmu pacientů. Tchajwanská pobřežní stráž regulovala rybolov kvůli hrozbě smrtících vln. Přístav Kaohsiung byl během bouře uzavřen. Vzhledem k zvýšené poptávce po zelenině před bouří vzrostla cena těchto potravin o 20 až 30 procent.\n\nBilis byl vysoce ničivý tropický cyklon pro Taiwan. Škody v zemědělství, rybolovu a lesnictví dosáhly 133,5 milionu USD. Tajfun způsobil 14 úmrtí a dalších 80 zraněných. Výpadky proudu postihly přibližně 600 000 domácností a 400 domů bylo zničeno. Několik set tisíc rodin zažilo po bouři nedostatek vody. V Cheng-Kungu meteorologická stanice zaznamenala poryv větru 281 km/h, který poškodil anemometr stanice. Jeden sesuv v městě Jenai zasypal devět farmářů. Desítky tisíc lidí byly během bouře vysídleny a přesunuly se do evakuačních center zřízených vládou. Východní okres Hualien zaznamenal 250 domů zničených silnými větry." # todo: NEW TRANSLATION
 taiwan.2.a: "Čas na obnovu." # todo: NEW TRANSLATION
 taiwan.3.t: "Prezidentské volby na Tchaj-wanu" # todo: NEW TRANSLATION
 taiwan.3.d: "Jsou to druhé přímé prezidentské volby Republiky Číny, k volbě 10. prezidenta a viceprezidenta republiky podle Ústavy z roku 1947. To může ukončit více než půlstoletí vlády Kuomintangu na Tchaj-wanu, protože voličská základna KMT se rozdělila.\n\nAčkoli populárnější a konzistentně vyšší v anketách, bývalý guvernér Tchaj-wanu James Soong neuspěl v získání nominace Kuomintangu. V důsledku toho oznámil kandidaturu jako nezávislý. KMT reagoval vyloučením Soonga a 21 jeho spojenců. Obvinili Soonga z krádeže, tvrdíce, že jako generální tajemník strany odcizil miliony tchajwanských dolarů určených pro rodinu zesnulého prezidenta Chiang Ching-kuo a ukryl peníze ve finanční firmě Chunghsing Bills. Soong se hájil tím, že jednal na příkaz Leeho, ale jeho příběh nebyl přesvědčivý. Zpočátku vedl v průzkumech, ale prohrál o něco přes 300 000 hlasů; finanční skandál poškodil jeho pověst jako čistého politika.\n\nDemokratická progresivní strana kandidovala bývalého starostu Taipeje Chen Shui-biana. Po prohře v roce 1996 na radikální platformě nezávislosti umírnil v květnu 1999 postoj vydáním \"Rezoluce o budoucnosti Tchaj-wanu.\" Rezoluce přijala současný stav a prosazovala umírněný názor, že Tchajwan je již nezávislý, takže jakékoli formální vyhlášení by nebylo nutné, pokud vůbec. Dále slíbil, že jakákoli změna mezinárodního statusu Tchaj-wanu bude provedena referendem, což ulevilo obavám, že by vláda DPP jednostranně vyhlásila nezávislost bez souhlasu lidu. Ticket Chen-Lu také sliboval větší úsilí v boji proti korupci, více financí pro sociální služby a větší ohleduplnost k životnímu prostředí, včetně odporu proti jaderné energii." # todo: NEW TRANSLATION
 taiwan.3.a: "Chen Shui-bian (DPP)" # todo: NEW TRANSLATION
 taiwan.3.b: "Lien Chan (KMT)" # todo: NEW TRANSLATION
 taiwan.3.c: "James Soong (Nezávislý)" # todo: NEW TRANSLATION
 taiwan.4.t: "Zřízena Pobrežní stráž" # todo: NEW TRANSLATION
 taiwan.4.d: "CGA kombinuje Coast Guard Command, Marine Police Bureau a několik plavidel z Taiwan Directorate General of Customs, Ministry of Finance. CGA formálně sjednocuje pobřežní a námořní orgány vymáhání práva. Bude čelit mnoha výzvám jako mladá agentura, účastní se mnoha pátracích a záchranných i protikontrabandních operací v blízké budoucnosti.\n\nPobrežní správa Oceánské rady (CGA) má za úkol udržovat pořádek, chránit zdroje teritoriálních vod ROC, které obklopují Taiwan, Penghu, Kinmen, Matsu ostrovy, Green Island, Orchid Island, Dongsha ostrovy a Nansha ostrovy, a poskytovat první linie obrany podél pobřeží proti pašerákům a nelegálním imigrantům. CGA je považována za civilní orgán vymáhání práva pod správou Oceánské rady Výkonné rady, ač během nouzových situací může být začleněna do ozbrojených sil Republiky Číny.\n\nCGA vede jeden ministr a tři náměstci. CGA zahrnuje osm oddělení, jednu kancelář a pět úkolových sil, stejně jako Námořní dozorčí ředitelství a Pobřežní dozorčí ředitelství. Její jurisdikce pokrývá vody obklopující Kinmen, Matsu, Penghu a hlavní ostrov Taiwan, aby zajistila správnou ochranu 1 819,8 kilometrů pobřeží a 540 000 čtverečních kilometrů \"modrého území\", které je 15krát větší než ostrov Taiwan." # todo: NEW TRANSLATION
 taiwan.4.a: "Pro bezpečné pobřeží." # todo: NEW TRANSLATION
 taiwan.5.t: "Založena Národní univerzita Kaohsiung" # todo: NEW TRANSLATION
 taiwan.5.d: "Univerzita si klade za cíl zmenšit rozdíl ve vzdělání mezi jižním a severním Tchaj-wanem a podpořit ekonomiku jižních oblastí.\n\nUniverzita má dvacet kateder, včetně Západních jazyků a literatury, Východoasijských jazyků a literatury, architektury, kreativního designu, kineziologie, studia zdraví a volného času, práva, vládních a právních studií, ekonomického a finančního práva, aplikované ekonomie, aplikované matematiky, aplikované chemie, elektroinženýrství, stavebnictví a environmentálního inženýrství, přírodních věd, a asijsko-pacifického průmyslového a obchodního řízení, tradičních umění, financí, správy informací a aplikované fyziky. Mezi těmito katedrami je Asijsko-pacifické průmyslové a obchodní řízení zvlášť navrženo k vychování průmyslové elity.\n\nNeobvyklou charakteristikou této školy je její otevřený prostor. Na hranicích kampusu nejsou stěny. Obyvatelé žijící kolem školy mohou chodit do areálu nebo cvičit v tělocvičně. Biodiverzita je také pozoruhodná; v rybníku Water Land Park je více než 60 druhů ryb." # todo: NEW TRANSLATION
 taiwan.5.a: "To pomůže jihu." # todo: NEW TRANSLATION
 taiwan.13.t: "Stávka odborů letušk Taoyuan" # todo: NEW TRANSLATION
 taiwan.13.d: "Odbory Taoyuan Flight Attendants, zastupující asi 2500 palubních členů z China Airlines, zahájily první stávku v dějinách tchajwanského letectví. Celkem 122 pasažérských letů China Airlines z letišť Taoyuan a Taipei Songshan bylo zrušeno a 20 000 cestujících zůstalo uvězněno. Odbory předložily sedm požadavků k přijetí pro lepší pracovní podmínky." # todo: NEW TRANSLATION
 taiwan.13.a: "Přijmout jejich požadavky" # todo: NEW TRANSLATION
 taiwan.13.b: "Nikdy se nevzdáme" # todo: NEW TRANSLATION
 taiwan.14.t: "Stávka selhala" # todo: NEW TRANSLATION
 taiwan.14.d: "Poté, co jsme jejich požadavky zamítli, stávka brzy skončila. Všichni se vrací do práce." # todo: NEW TRANSLATION
 taiwan.14.a: "Neměli šanci" # todo: NEW TRANSLATION
 taiwan.15.t: "Stávka pokračuje" # todo: NEW TRANSLATION
 taiwan.15.d: "Po našem odmítnutí jejich požadavků stávka zesílila. Zdá se, že to hned tak neskončí." # todo: NEW TRANSLATION
 taiwan.15.a: "Alespoň jsme to zkusili" # todo: NEW TRANSLATION
 taiwan.16.t: "Tank spadl z mostu" # todo: NEW TRANSLATION
 taiwan.16.d: "Tank CM-11 během návratu na základnu z výcviku spadl do potoka v okrese Pingtung, přičemž tři ze pěti vojáků na palubě zahynuli. Řidič utrpěl jen lehká zranění a vytáhl se ven z tanku. Čtyři ostatní, kteří byli uvnitř věže, se nedokázali dostat ven přes dvířka věže, protože tank byl převrácený." # todo: NEW TRANSLATION
 taiwan.16.a: "Vyšetřit, jak k tomu mohlo dojít" # todo: NEW TRANSLATION
 taiwan.17.t: "Výběr nového hlavního města" # todo: NEW TRANSLATION
 taiwan.17.d: "Když si vychutnáváme plody vítězství, musíme začít přemýšlet o přesunu našeho administrativního hlavního města na pevninu. Taipei je prostě příliš daleko od hlavních populačních center pevniny, a proto je naše schopnost efektivně vládnout ztížena. Proto bude naše hlavní město..." # todo: NEW TRANSLATION
 taiwan.17.a: "Peking" # todo: NEW TRANSLATION
 taiwan.17.b: "Šanghaj" # todo: NEW TRANSLATION
 taiwan.17.c: "Čung-čching" # todo: NEW TRANSLATION
 taiwan.17.e: "Nanking" # todo: NEW TRANSLATION
 taiwan.17.d1: "Stejné, Taipei" # todo: NEW TRANSLATION
 taiwan.18.t: "Velké závody o čipy" # todo: NEW TRANSLATION
 taiwan.18.d: "S příchodem nového tisíciletí je naše převaha ve výrobě mikročipů ohrožena. Čínská lidová republika začíná rozšiřovat svůj průmysl výroby mikročipů ve snaze obejít naše výrobní schopnosti. Musíme zůstat napřed, abychom ochránili své postavení na světové scéně." # todo: NEW TRANSLATION
 taiwan.18.a: "Zvítězíme!" # todo: NEW TRANSLATION
 hongkong.1.t: "Čína odmítla revokovat anexi!" # todo: NEW TRANSLATION
 hongkong.1.d: "Čína naše hrozby odmítla, čímž nám nezanechává nic jiného, než dotáhnout své hrozby do konce." # todo: NEW TRANSLATION
 hongkong.1.a: "Už se nás nebojí." # todo: NEW TRANSLATION
 hongkong.2.t: "Čína nasazuje jednotky v Hongkongu" # todo: NEW TRANSLATION
 hongkong.2.d: "Po protestech v Hongkongu Čína nařídila nasazení více jednotek Lidové osvobozenecké armády do ulic Hongkongu, aby \"obnovila zákon a pořádek\". [CHI.GetLeader] ujistil \"pokojné demonstranty\", že nebudou cílem a všichni zadržení budou podle mezinárodního práva zacházeni spravedlivě. Nicméně mnoho lidí v Hongkongu i v zahraničí vyjádřilo skepsi ohledně míry zdrženlivosti, kterou budou čínské jednotky vůči demonstrantům uplatňovat." # todo: NEW TRANSLATION
 hongkong.2.a: "Tento krok je zahanbující!" # todo: NEW TRANSLATION
 hongkong.2.b: "Čína udělala, co musela." # todo: NEW TRANSLATION
 hongkong.2.c: "Není to naše věc." # todo: NEW TRANSLATION
 hongkong.5.t: "Spojené království hrozí vojenskou akcí!" # todo: NEW TRANSLATION
 hongkong.5.d: "Britové reagovali zlověstněji, než jsme očekávali, na naši anexi jejich bývalého koloniálního území. Měli bychom zvážit, zda jim vyhovíme." # todo: NEW TRANSLATION
 hongkong.5.a: "To není kopec, na kterém chceme zemřít." # todo: NEW TRANSLATION
 hongkong.5.b: "Ať přijdou." # todo: NEW TRANSLATION
 hongkong.6.t: "Spojené království hrozí ekonomickými opatřeními!" # todo: NEW TRANSLATION
 hongkong.6.d: "Britové se rozhodli hrozit sankcemi, pokud nevrátíme anexi jejich bývalého koloniálního území. Měli bychom zvážit, zda jejich požadavkům vyhovíme." # todo: NEW TRANSLATION
 hongkong.6.a: "Měli bychom se vyhnout konfrontaci." # todo: NEW TRANSLATION
 hongkong.6.b: "Jejich hrozby nic neznamenají!" # todo: NEW TRANSLATION
 hongkong.7.t: "Čína souhlasila s reverzí anexe" # todo: NEW TRANSLATION
 hongkong.7.d: "Zjevně v úžasu nad britskou mocí se Čína vzdala otázky Hongkongu." # todo: NEW TRANSLATION
 hongkong.7.a: "Naše hrozby stále působí!" # todo: NEW TRANSLATION
 hongkong_news.1.t: "Hongkong otřásán rozsáhlými protesty" # todo: NEW TRANSLATION
 hongkong_news.1.d: "Po rozhodnutí Číny vyloučit možnost, aby byl šéf výkonné rady v Hongkongu volen všeobecným hlasováním bez předběžného schválení kandidátů, propukly hromadné protesty v teritoriu. [HKG.GetLeader] uvedl, že hongkongská vláda respektuje právo Hongkongu na pokojné a zákonné vyjádření názorů, ale násilí a bezpráví nebude tolerováno. Reakce Číny na současnou krizi zůstává neznámá, jelikož [CHI.GetLeader] k událostem poslední dobou nekomentoval." # todo: NEW TRANSLATION
 hongkong_news.1.d_limit: "Po rozhodnutí Číny, že šéf výkonné rady v Hongkongu může být zvolen všeobecně pouze pokud budou kandidáti předem schváleni, propukly masové protesty. [HKG.GetLeader] uvedl, že hongkongská vláda respektuje právo na pokojné a zákonné vyjádření, ale násilí a bezpráví nebude tolerováno. Reakce Číny zůstává neznámá, [CHI.GetLeader] se k událostem dosud nevyjádřil." # todo: NEW TRANSLATION
 hongkong_news.1.d_reunification: "Po oznámení Číny, že v roce 2047 Hongkong ztratí zvláštní status a plně se vrátí pod čínskou kontrolu, propukly v teritoriu masové protesty. [HKG.GetLeader] uvedl, že hongkongská vláda respektuje právo Hongkongu na pokojné a zákonné vyjádření, ale násilí a bezpráví nebude tolerováno. Reakce Číny zůstává neznámá, [CHI.GetLeader] se k událostem dosud nevyjádřil." # todo: NEW TRANSLATION
 hongkong_news.1.d_annexed: "Po kontroverzní anexi Hongkongu propukly v teritoriu masové protesty. [HKG.GetLeader] uvedl, že hongkongská vláda respektuje právo Hongkongu na pokojné a zákonné vyjádření, ale násilí a bezpráví nebude tolerováno. Reakce Číny zůstává neznámá, [CHI.GetLeader] se k událostem dosud nevyjádřil." # todo: NEW TRANSLATION
 hongkong_news.1.a: "Zajímavý vývoj" # todo: NEW TRANSLATION
 hongkong_news.1.b: "To jsou pro nás špatné zprávy." # todo: NEW TRANSLATION
 hongkong_news.2.t: "Protesty v Hongkongu utichají" # todo: NEW TRANSLATION
 hongkong_news.2.d: "Protesty v Hongkongu proti nedávným čínským krokům v posledních dnech postupně klesly a prakticky ustaly. Policejní operace v teritoriu setkaly bez odporu a mnozí, kdo dříve vyšli do ulic, se vrátili domů. Co to znamená pro vztah mezi Čínou a problémovým teritoriem s významnými odlišnými politickými hodnotami, zůstává nejasné. Možná jedním ukazatelem je transparent ponechaný protestujícími na prominentním místě v centru města, který hlásal \"Vrátíme se\"." # todo: NEW TRANSLATION
 hongkong_news.2.a: "Zajímavý vývoj" # todo: NEW TRANSLATION
 hongkong_news.2.b: "Vědí, že jejich boj je marný." # todo: NEW TRANSLATION
 hongkong_news.3.t: "Rozsah protestů v Hongkongu roste" # todo: NEW TRANSLATION
 hongkong_news.3.d: "Protesty proti čínským krokům v Hongkongu rychle nabývají na rozsahu a taktice. Jak zareagují čínská a hongkongská vláda na tuto novou eskalaci, zůstává nejasné, ale úředníci v obou vládách jsou údajně čím dál tím více rozhořčeni škodami na jejich zájmech. Protestující odmítají ustoupit, dokud čínská a hongkongská vláda nesplní jejich požadavky." # todo: NEW TRANSLATION
 hongkong_news.3.a: "Hongkongský lid nezůstane zticha..." # todo: NEW TRANSLATION
 hongkong_news.3.b: "Zůstanou doma, pokud ví, co je dobré!" # todo: NEW TRANSLATION
 hongkong_news.10.t: "Hongkong byl anektován Čínou" # todo: NEW TRANSLATION
 hongkong_news.10.d: "Čína formálně pohltila Zvláštní administrativní oblast Hongkong, čímž ukončila její zvláštní status. Instituce a správa tohoto území nyní podléhají přímé centrální kontrole z Pekingu, jak [CHI.GetLeader] popsal tento krok jako završení návratu Hongkongu do vlasti." # todo: NEW TRANSLATION
 hongkong_news.10.a: "Perla se vrátila do lůna." # todo: NEW TRANSLATION
 hongkong_news.10.b: "Významný vývoj." # todo: NEW TRANSLATION
 korea.4.t: "Čínsko-severokorejský rozkol" # todo: NEW TRANSLATION
 korea.4.d: "Kritika režimu [NKO.GetLeader] v čínských vládou napojených médiích výrazně vzrostla v posledních týdnech. Tyto kritiky napadly severokorejský jaderný problém a neschopnost zlepšit životní úroveň občanů prostřednictvím ekonomické liberalizace jako to dokázala Čína v posledních desetiletích.\n\nAč [CHI.GetLeader] zůstává mlčenlivý, věří se, že tato média by takovou ostrou kritiku kdysi blízkého spojence nevypustila bez tiché podpory [CHI.GetLeader]. Mnozí pozorovatelé to vnímají jako vyvrcholení čínské frustrace nad dynastií Kimů a možnou snahou vytvořit alternativní vládu, která bude stabilnější a poslušnější vůči přáním Číny." # todo: NEW TRANSLATION
 korea.4.a: "Pouze [CHI.GetLeader] ví, kam to směřuje..." # todo: NEW TRANSLATION
 korea.5.t: "Začínají rozhovory" # todo: NEW TRANSLATION
 korea.5.d: "Hlavním požadavkem Severu je, abychom přestali s našimi společnými vojenskými cvičeními s USA, která v jejich očích představují přípravy na invazi. Nicméně tato cvičení naše vojsko považuje za nutné přípravy pro případ severokorejského útoku. Souhlasit se zastavením těchto cvičení by tedy bylo významným rizikem, ve kterém je naše bezpečnost postavena na hru." # todo: NEW TRANSLATION
 korea.5.d_NKO: "Hlavním požadavkem Jihu je, abychom přestali s našimi testy jaderných zbraní, které v jejich očích dokazují naše agresivní záměry. Nicméně náš jaderný program je považován armádou za důležitý odstrašující prostředek proti invazi USA. Navíc program a testy, které jsou pro jeho pokračování nutné, pomáhají posilovat legitimitu naší vlády. Souhlasit se zastavením testů by proto byl velký risk, ve kterém by byla ohrožena bezpečnost naší země i vlády." # todo: NEW TRANSLATION
 korea.5.a: "Naše země nikdy nebude znovu celistvá, pokud nepodstoupíme pár rizik..." # todo: NEW TRANSLATION
 korea.5.b: "Některá rizika jsou příliš velká." # todo: NEW TRANSLATION
 korea.6.t: "Začínají korejská mírová jednání" # todo: NEW TRANSLATION
 korea.6.d: "Po více než půl století byly Severní a Jižní Korea technicky ve válečném stavu. Tento zmrzlý konflikt se občas vyostřil střety mezi oběma stranami podél sporných námořních hranic nebo přes DMZ. Nyní se obě strany scházejí v naději, že ukončí tento stav věcí a dosáhnou deeskalace na korejském poloostrově formální mírovou smlouvou. Vyjednávání mírové smlouvy je široce vnímáno jako důležitý první krok směrem k znovusjednocení korejského poloostrova." # todo: NEW TRANSLATION
 korea.6.a: "Dokážou obě strany dosáhnout kompromisu?" # todo: NEW TRANSLATION
 korea.7.t: "[CHI.GetLeader] vyjadřuje podporu znovusjednocení Koreje" # todo: NEW TRANSLATION
 korea.7.d: "Čína historicky nahlížela s opatrností na vyhlídku sjednocené Koreje spojené se Spojenými státy na svých hranicích. Pozorovatelé byli proto překvapeni, když [CHI.GetLeader] vyjádřil jednoznačnou podporu znovusjednocení, krok, který podle některých zpráv zaskočil vedení Severní Koreje. Vzhledem k významnému vlivu Číny na korejském poloostrově toto oznámení pravděpodobně vyvine tlak na obě strany, aby usedly ke stolu jednání." # todo: NEW TRANSLATION
 korea.7.a: "Je cítit změna ve vzduchu?" # todo: NEW TRANSLATION
 korea.8.t: "Radikální korejské hnutí nabývá na popularitě" # todo: NEW TRANSLATION
 korea.8.d: "Hospodářská nerovnost v Korejské republice přispěla k rostoucímu nespokojení mezi nižšími vrstvami společnosti. Tisíce online aktivistů začaly volat po větší rovnosti prostřednictvím zavedení autonomie na úrovni komunit po celé Jižní Koreji. Hnutí je bez vůdců a tudíž postrádá centrální jasné poselství, ale většina jeho členů se zdá toužit po zrušení korejského státu a chaebolů, s nimiž je spjat, ve prospěch systému, který rozděluje politickou a ekonomickou moc mezi přímo volené zástupce na úrovni komunit.\n\nTato nová ideologie, která odmítá základní ideologie jak ROK, tak DPRK, představuje významný odklon od tradiční politiky radikální levice v Jižní Koreji, která buď prosazovala levicové politiky v rámci stávajícího politického systému Jižní Koreje, nebo volala po zřízení státu po vzoru Severní Koreje." # todo: NEW TRANSLATION
 korea.8.a: "V Jižní Koreji se něco děje..." # todo: NEW TRANSLATION
 korea.9.t: "Vzbouřenci na jihu žádají naši podporu" # todo: NEW TRANSLATION
 korea.9.d: "Zástupci Korejského národně osvobozeneckého hnutí, kteří usilují o svržení vlády na jihu, k nám přišli s žádostí o alianci, aby otevřeli novou frontu podél DMZ." # todo: NEW TRANSLATION
 korea.9.a: "Přidáme se k jejich boji!" # todo: NEW TRANSLATION
 korea.9.b: "Budeme sledovat zpoza linie." # todo: NEW TRANSLATION
 JUCHE_FACTION: "Korejské protikoloniální fronta" # todo: NEW TRANSLATION
 korea.10.t: "Jižní Korea žádá, abychom ukončili naši ochranu Severu" # todo: NEW TRANSLATION
 korea.10.d: "Již nějakou dobu se Jižní Korea snaží ukázat, že už není zemí vázanou na zájmy USA. Vztahy mezi našimi dvěma zeměmi jsou na historickém maximu, zatímco naše vztahy se Severem jsou většinou stagnující. Nyní za námi přišla delegace Jižní Koreje a požádala o ukončení obranné smlouvy mezi námi a Severokorejci. Pokud jejich žádosti vyhovíme, už nebudeme Severní Koreji nápomocni v případě vnější invaze." # todo: NEW TRANSLATION
 korea.10.a: "Budeme stát při našich spojencích!" # todo: NEW TRANSLATION
 korea.10.b: "Sever nestojí za naši ochranu." # todo: NEW TRANSLATION
 korea.11.t: "Korejské zbrojní firmy nabízejí produkty" # todo: NEW TRANSLATION
 korea.11.d: "Republika Korea je dobře známá svou schopností vyrábět vysoce kvalitní zbrojní techniku za relativně dostupné ceny. Měli bychom zvážit, zda nekoupit některé jejich zařízení, ale naše prostředky nejsou neomezené, takže vybírejme rozumně." # todo: NEW TRANSLATION
 korea.11.a: "Nakoupit korejské tanky." # todo: NEW TRANSLATION
 korea.11.b: "Nakoupit korejskou samohybrou dělostřelbu." # todo: NEW TRANSLATION
 korea.11.c: "Nakoupit korejská cvičná letadla." # todo: NEW TRANSLATION
 korea.11.e: "Nakoupit korejské útočné pušky." # todo: NEW TRANSLATION
 korea.11.f: "Nabídku odmítnout." # todo: NEW TRANSLATION
 korea.12.t: "[FROM.GetName] souhlasila se zbrojním kontraktem!" # todo: NEW TRANSLATION
 korea.12.d: "Zástupci této země souhlasili s dovozem zbraní od nás, čímž zvýšili naše příjmy a mezinárodní vliv." # todo: NEW TRANSLATION
 korea.12.a: "Naše mezinárodní postavení roste!" # todo: NEW TRANSLATION
 korea.13.t: "Peking a Soul společně kritizují japonské činy z 2. světové války" # todo: NEW TRANSLATION
 korea.13.d: "V zřídka viděném kroku vlády Číny a Korejské republiky vydaly společné prohlášení kritizující japonské válečné činy a jeho následné odmítání plného odpuštění. Mnoho pozorovatelů toto vnímá jako součást snah Soulu odklonit Čínu od podpory Severní Koreje. Zatímco Pchjongjang vyjádřil podporu společnému odsouzení [KOR.GetLeader] a [CHI.GetLeader], [NKO.GetLeader] má podle zpráv obavy ze známek toho, že Čína čím dál více preferuje Soul." # todo: NEW TRANSLATION
 korea.13.a: "Nikdy nezapomeneme, co provedli." # todo: NEW TRANSLATION
 korea.13.b: "Jejich kritika je otravná..." # todo: NEW TRANSLATION
 korea.13.c: "Minulost vrhá dlouhý stín..." # todo: NEW TRANSLATION
 korea.14.t: "Čína ruší obrannou smlouvu se Severní Koreou" # todo: NEW TRANSLATION
 korea.14.d: "Po stažení americké vojenské přítomnosti z Jižní Koreje souhlasila Čína s odstoupením od své obranné smlouvy se Severní Koreou, což vyvolalo zuřivou kritiku z Pchjongjangu. Tento krok následuje dlouhou řadu Soulu snah získat podporu Číny a ukázat svou autonomii vůči Washingtonu. Někteří naznačují, že nyní, když je cesta pro násilné znovusjednocení otevřená, se [KOR.GetLeader] rozhodl znovu získat Sever silou." # todo: NEW TRANSLATION
 korea.14.a: "Naše snahy se vyplatily." # todo: NEW TRANSLATION
 korea.14.b: "Pchjongjang jsme snášeli příliš dlouho." # todo: NEW TRANSLATION
 korea.14.c: "Hrozí válka?" # todo: NEW TRANSLATION
 korea.15.t: "[KOR.GetLeader] požaduje japonské reparace" # todo: NEW TRANSLATION
 korea.15.d: "Po týdnech protichůdné rétoriky ze Soulu a tlaku korejských aktivistů vyzval [KOR.GetLeader] Japonsko, aby zaplatilo reparace přeživším japonských válečných zločinů spáchaných během druhé světové války. Japonsko, které trvá na tom, že záležitost byla vyřešena mezi jeho vládou a vládou Jižní Koreje za autoritářského režimu Park Čung-hi, předvídatelně odmítlo uvažovat o vyplacení reparací.\n\nAč jednání nevedla k odškodnění korejských obětí, posílila politickou pozici [KOR.GetLeader], když mnoho Korejců se sjednotilo kolem tohoto mimořádně emotivního národního tématu." # todo: NEW TRANSLATION
 korea.15.a: "Jednou se dočkáme spravedlnosti." # todo: NEW TRANSLATION
 korea.15.b: "Jejich požadavky jsou absurdní!" # todo: NEW TRANSLATION
 korea.15.c: "Lze jejich spor vyřešit?" # todo: NEW TRANSLATION
 korea.16.t: "Válka!" # todo: NEW TRANSLATION
 korea.16.d: "Vypukla válka mezi námi a Severem. Podle naší dohody se Spojenými státy musíme nyní předat operační kontrolu nad našimi ozbrojenými silami americké armádě." # todo: NEW TRANSLATION
 korea.16.a: "Musíme předat velení." # todo: NEW TRANSLATION
 korea.17.t: "Válka skončila" # todo: NEW TRANSLATION
 korea.17.d: "Na korejském poloostrově se vrátil mír. Nyní, když jsme se vrátili do mírového režimu, můžeme znovu uplatnit kontrolu nad našimi ozbrojenými silami." # todo: NEW TRANSLATION
 korea.17.a: "Konečně mír." # todo: NEW TRANSLATION
 korea.18.t: "Volby do Národního shromáždění se blíží, strany zahajují kampaň" # todo: NEW TRANSLATION
 korea.18.d: "S volbami do Národního shromáždění za zhruba měsíc bychom měli začít zvyšovat popularitu naší strany, abychom v parlamentu získali většinu na příští čtyři roky." # todo: NEW TRANSLATION
 korea.18.a: "Doufejme v většinu!" # todo: NEW TRANSLATION
 korea.21.t: "Výsledky jsou známy!" # todo: NEW TRANSLATION
 korea.21.a: "Jako vždy to byly tvrdě vybojované volby." # todo: NEW TRANSLATION
 korea.21.d_no: "Bohužel žádná ze dvou hlavních stran nezískala v Národním shromáždění většinu. Naše vláda bude muset více usilovat o přesvědčení poslanců z jiných stran, aby mohla prosadit kontroverzní legislativu." # todo: NEW TRANSLATION
 korea.21.d_con_loss: "Bohužel naše strana nezajistila většinu v Národním shromáždění. Liberální zákonodárci odmítnou schvalovat jakékoli zákony, které omezují odbory, podporují velký byznys nebo podporují antagonismus vůči Severní Koreji." # todo: NEW TRANSLATION
 korea.21.d_lib_loss: "Bohužel naše strana nezajistila většinu v Národním shromáždění. Konzervativní zákonodárci odmítnou schvalovat jakékoli zákony, které omezují velké podniky, reformují brannou povinnost a zpravodajské služby nebo podporují smíření se Severní Koreou." # todo: NEW TRANSLATION
 korea.21.d_con_win: "Naštěstí se naší straně podařilo získat většinu v Národním shromáždění. Zákonodárná moc a exekutiva budou moci ruku v ruce usnadňovat konzervativní cíle, jako je omezení odborů, podpora chaebolů a tvrdý postoj vůči Severní Koreji." # todo: NEW TRANSLATION
 korea.21.d_lib_win: "Naštěstí se naší straně podařilo získat většinu v Národním shromáždění. Zákonodárná moc a exekutiva budou moci ruku v ruce usnadňovat liberální cíle, jako je oslabování chaebolů, reforma bezpečnostního aparátu a usilování o znovusjednocení se Severem." # todo: NEW TRANSLATION
 korea.22.t: "Důsledky znovusjednocení začínají nabývat sil" # todo: NEW TRANSLATION
 korea.22.d: "Velký národ Korea byl konečně znovu sjednocen po mnoha desetiletích bolestného rozdělení. Nicméně naše úloha při reintegraci obou polovin je zdaleka nekončící. Mnoho lidí na obou stranách 38. rovníku je nespokojeno s tím, jak znovusjednocení proběhlo, a ekonomické náklady na sjednocení dvou značně odlišných států rychle vystupují na povrch. Pokud v úkolu zjednocení selžeme, hrozí rozpuštění našeho nově narozeného národa." # todo: NEW TRANSLATION
 korea.22.a: "Teď začíná ta těžká část..." # todo: NEW TRANSLATION
 korea.23.t: "Naše reakce na jihovu mírovou nabídku" # todo: NEW TRANSLATION
 korea.23.d: "Po týdnech diskuzí nadešel čas rozhodnout, zda jsme ochotni přijmout jihovu nabídku míru. Musíme zvážit, zda důvěřujeme upřímnosti jihu, ale také, jak bude podepsání mírové smlouvy vnímáno našimi domácími podporovateli, kteří stále věří v jednou možnou silovou cestu ke znovusjednocení." # todo: NEW TRANSLATION
 korea.23.a: "Souhlasíme se smlouvou." # todo: NEW TRANSLATION
 korea.23.b: "Mezi námi nikdy nebude mír!" # todo: NEW TRANSLATION
 korea.24.t: "Podepsána korejská mírová dohoda" # todo: NEW TRANSLATION
 korea.24.d: "Po zlepšení vztahů mezi oběma Korejemi se [KOR.GetLeader] z jihu a [NKO.GetLeader] ze severu dohodli nahradit vratkou Příměří formálním mírovým urovnáním. Tato smlouva konečně ukončila stav nepřátelství, který mezi Korejemi panuje od korejské války. Oba vůdci vyjádřili naději, že tento vývoj nasměruje poloostrov na cestu ke znovusjednocení, ač někteří pozorovatelé pochybují o ochotě obou stran skutečně usilovat o sjednocení." # todo: NEW TRANSLATION
 korea.24.a: "Poloostrov čeká zářná budoucnost!" # todo: NEW TRANSLATION
 korea.25.t: "Mezkorejská jednání se rozpadla" # todo: NEW TRANSLATION
 korea.25.d: "Jednání v Panmundžomu mezi [KOR.GetLeader] z jihu a [NKO.GetLeader] ze severu se zhroutila kvůli různým neshodám mezi oběma stranami. Ač fakt, že existovaly některé body dohody, někoho vede k naději na návrat k jednáním v budoucnu, je jasné, že dohoda mezi oběma Korejemi se v dohledné době neobjeví." # todo: NEW TRANSLATION
 korea.25.a: "Mír zůstává nedosažitelný..." # todo: NEW TRANSLATION
 korea.26.t: "Jižní Korea navrhuje znovusjednocení" # todo: NEW TRANSLATION
 korea.26.d: "Jih se snaží využít bezprecedentního zlepšení vztahů mezi oběma Korejemi a nabízí spolupráci na znovusjednocení našeho rozděleného národa. Nicméně trvají na tom, že proces znovusjednocení bude veden jihu, požadavek, který ohrožuje jedinečnou politickou kulturu, kterou jsme na Severu vybudovali." # todo: NEW TRANSLATION
 korea.26.d1: "Jih se snaží využít bezprecedentního zlepšení vztahů mezi oběma Korejemi a nabízí spolupráci na znovusjednocení našeho rozděleného národa. Jih, chápaje naše obavy ohledně znovusjednocení, nabídl sdílení moci po znovusjednocení prostřednictvím jednotné vlády, začlenění prvků ze Severu i Jihu." # todo: NEW TRANSLATION
 korea.26.a: "Naše země bude opět celistvá!" # todo: NEW TRANSLATION
 korea.26.b: "Znovusjednocení nemůže proběhnout za těchto podmínek..." # todo: NEW TRANSLATION
 korea.27.t: "Sever souhlasil s našimi podmínkami znovusjednocení!" # todo: NEW TRANSLATION
 korea.27.d: "Po rozsáhlých jednáních se Sever dohodl začít pracovat na znovusjednocení našich dvou zemí! S stabilizovanými vztahy mezi Korejemi a reintegrací poloostrova na obzoru nikdy nevypadala budoucnost korejského lidu jasněji!" # todo: NEW TRANSLATION
 korea.27.a: "Skvělé zprávy!" # todo: NEW TRANSLATION
 korea.28.t: "Sever odmítl naše podmínky znovusjednocení!" # todo: NEW TRANSLATION
 korea.28.d: "Smůla, [NKO.GetLeader] se rozhodl upřednostnit vlastní sobeckou pozici před zájmem korejského lidu a odmítl naši nabídku na spolupráci při znovusjednocení země. Toto odmítnutí neznamená, že nemůžeme v budoucnu udělat další pokus, ale znamená to, že znovusjednocení nenastane v blízké budoucnosti. Musíme položit základy, aby náš další pokus měl větší úspěch." # todo: NEW TRANSLATION
 korea.28.a: "Smutný den pro korejský lid..." # todo: NEW TRANSLATION
 korea.29.t: "Čína žádá předání pozůstatků vojáků Čínské lidové dobrovolnické armády z Jižní Koreje do Číny" # todo: NEW TRANSLATION
 korea.29.d: "" # todo: NEW TRANSLATION
 korea.29.a: "Samozřejmě. Tyto vojáky si vážíme." # todo: NEW TRANSLATION
 korea.29.b: "Jsou to naši nepřátelé a vetřelci na naší zemi! To nemůžeme přijmout!" # todo: NEW TRANSLATION
 korea.30.t: "První předání pozůstatků vojáků Lidové dobrovolnické armády z JKR do Číny" # todo: NEW TRANSLATION
 korea.30.d: "\nPrvní sběr zahrnoval pozůstatky nalezené při vykopávkách v několika regionech, jako provincie Gangwon a provincie Gyeonggi. Mnohé pozůstatky byly neidentifikovatelné. První sběr byl původně odhadnut na 425 vojáků, ale ten odhad byl později zvýšen na 437.\n\nČína a Jižní Korea uspořádaly předávací ceremonii těchto pozůstatků v Koreji na mezinárodním letišti Incheon. Čínští a korejští zástupci tam podepsali předávací protokol. Korejská strana vyslala dvacet dva vozidel k převozu pozůstatků. Poté, co do čínského vzdušného prostoru vstoupila speciální letadla čínského letectva, přiletěly dva J-11, aby eskortovaly." # todo: NEW TRANSLATION
 korea.30.a: "Salute!" # todo: NEW TRANSLATION
 korea.31.t: "Sedmé předání pozůstatků vojáků Lidové dobrovolnické armády z JKR do Číny" # todo: NEW TRANSLATION
 korea.31.d: "Jižní Korea předala 117 pozůstatků na letišti Incheon. Ceremonie se zúčastnil ministr pro záležitosti veteránů z Číny. Pozůstatky byly vykopány na Arrow Hill (místo bitvy o Bílé koně) v Severokorejské demilitarizované zóně v roce 2019." # todo: NEW TRANSLATION
 korea.31.a: "Salute!" # todo: NEW TRANSLATION
 korea.33.t: "Naše reakce na severovu mírovou nabídku" # todo: NEW TRANSLATION
 korea.33.d: "Po týdnech diskuzí nadešel čas rozhodnout, zda jsme ochotni přijmout severovu nabídku míru. Musíme zvážit, zda důvěřujeme upřímnosti nabídky Severu, ale také, jak bude podepsání mírové smlouvy vnímáno těmi našimi lidmi, kteří jsou stále proti jednání s režimem Severní Koreje." # todo: NEW TRANSLATION
 korea.34.t: "Severnavrhuje znovusjednocení" # todo: NEW TRANSLATION
 korea.34.d: "Sever se snaží využít bezprecedentního zlepšení vztahů mezi oběma Korejemi a nabízí spolupráci na znovusjednocení našeho rozděleného národa. Nicméně trvají na tom, že proces znovusjednocení bude veden Severem, požadavek, který ohrožuje způsob života, který jsme na Jihu vybudovali." # todo: NEW TRANSLATION
 korea.34.d1: "Sever se snaží využít bezprecedentního zlepšení vztahů mezi oběma Korejemi a nabízí spolupráci na znovusjednocení našeho rozděleného národa. Sever, chápeje naše obavy ohledně znovusjednocení, nabídl sdílení moci po znovusjednocení prostřednictvím jednotné vlády, začlenění prvků z Jihu i Severu." # todo: NEW TRANSLATION
 korea.35.t: "Jih souhlasil s našimi podmínkami znovusjednocení!" # todo: NEW TRANSLATION
 korea.35.d: "Po rozsáhlých jednáních se Jih dohodl začít pracovat na znovusjednocení našich dvou zemí! S stabilizovanými vztahy mezi Korejemi a reintegrací poloostrova na obzoru nikdy nevypadala budoucnost korejského lidu jasněji!" # todo: NEW TRANSLATION
 korea.36.t: "Jih odmítl naše podmínky znovusjednocení!" # todo: NEW TRANSLATION
 korea.36.d: "Bohužel se [KOR.GetLeader] rozhodl upřednostnit vlastní sobeckou pozici před zájmem korejského lidu a odmítl naši nabídku ke spolupráci při znovusjednocení země. Toto odmítnutí neznamená, že nemůžeme zkusit znovu v budoucnu, ale znamená to, že znovusjednocení nenastane v blízké době. Musíme připravit půdu, aby náš další pokus byl úspěšnější." # todo: NEW TRANSLATION
 korea.38.t: "Korea žádá, abychom stáhli naše jednotky v Japonsku a Koreji" # todo: NEW TRANSLATION
 korea.38.d: "Korea dnes formálně požádala o stažení našich jednotek z Japonska a Koreje." # todo: NEW TRANSLATION
 korea.38.a: "Nevyhovíme jejich nepřiměřeným požadavkům." # todo: NEW TRANSLATION
 korea.38.b: "Možná je čas, aby vojáci šli domů......" # todo: NEW TRANSLATION
 recognition.1.t: "[FROM.GetName] podrývá naši územní integritu!" # todo: NEW TRANSLATION
 recognition.1.d: "Vláda [FROM.GetNameDef] se postavila proti nám tím, že uznala separatistický tzv. „stát“, který nyní podrývá územní integritu [ROOT.GetName]. To je ránou pro [ROOT.GetAdjective] lid." # todo: NEW TRANSLATION
 recognition.1.a: "Nenecháme se rozdělit." # todo: NEW TRANSLATION
 recognition.3.t: "[FROM.GetName] už nás neuznává!" # todo: NEW TRANSLATION
 recognition.3.d: "A bezpochyby v důsledku tlaku našich bývalých mocnářů se [FROM.GetNameDef] rozhodla už neuznávat [ROOT.GetNameDef] jako nezávislý stát a zbavila náš lid pocty, kterou mu dříve dobrovolně udělili." # todo: NEW TRANSLATION
 recognition.3.a: "Boj o svobodu pokračuje." # todo: NEW TRANSLATION
 recognition.4.t: "[FROM.GetName] respektuje naši územní integritu!" # todo: NEW TRANSLATION
 recognition.4.d: "Lidé [ROOT.GetNameDef] si mohou jako útěchu vzít to, že ti, kdo se snaží podkopat integritu našeho státu, dnes utrpěli porážku rukou [FROM.GetNameDef]. Ač je to jen jeden krok na cestě k obnovení našeho státu, jedná se o významný okamžik." # todo: NEW TRANSLATION
 recognition.4.a: "Náš národ bude opět celistvý!" # todo: NEW TRANSLATION
 recognition.45.t: "Dostatečné uznání k žádosti o členství v OSN" # todo: NEW TRANSLATION
 recognition.45.d: "Dostatek členských států OSN nyní uznává naši suverenitu, abychom mohli důvěryhodně usilovat o křeslo v Organizaci spojených národů. Můžeme požádat Valné shromáždění o členství." # todo: NEW TRANSLATION
 recognition.45.a: "Zahájit kandidaturu." # todo: NEW TRANSLATION
 recognition.71.t: "Hlasování Valného shromáždění prošlo" # todo: NEW TRANSLATION
 recognition.71.d: "Valné shromáždění odhlasovalo naše přijetí do Organizace spojených národů. Po letech diplomatického úsilí je naše křeslo zajištěno." # todo: NEW TRANSLATION
 recognition.71.a: "[THIS.GetName] usedá na své místo." # todo: NEW TRANSLATION
 recognition.72.t: "Hlasování Valného shromáždění neprošlo" # todo: NEW TRANSLATION
 recognition.72.d: "Valné shromáždění nedosáhlo potřebného počtu hlasů k našemu přijetí. Naše kandidatura na členství v OSN se prozatím zastavila." # todo: NEW TRANSLATION
 recognition.72.a: "Překážka pro naši diplomacii." # todo: NEW TRANSLATION
 recognition.7.t: "[FROM.GetName] vstupuje do Organizace spojených národů" # todo: NEW TRANSLATION
 recognition.7.d: "Po zesíleném úsilí vlády [FROM.GetAdjective] získat mezinárodní uznání za svou nezávislost se národ [FROM.GetNameDef] stal nejnovější zemí, která vstoupila do OSN. Světoví vůdci blahopřáli [FROM.GetLeader] k novému statusu země." # todo: NEW TRANSLATION
 recognition.7.a: "[FROM.GetAdjective] lid se připojuje k mezinárodním společenstvím." # todo: NEW TRANSLATION
 recognition.73.t: "Valné shromáždění odmítá kandidaturu [FROM.GetName]" # todo: NEW TRANSLATION
 recognition.73.d: "Valné shromáždění hlasovalo proti přijetí [FROM.GetNameDef] jako členského státu. Kandidatura se zastavila." # todo: NEW TRANSLATION
 recognition.73.a: "Hlasování je zaznamenáno." # todo: NEW TRANSLATION
 recognition.8.t: "[FROM.GetAdjective] nátlak na uznání aspirujícího státu" # todo: NEW TRANSLATION
 recognition.8.d: "Vláda [FROM.GetAdjective] využívá svůj vliv v naší zemi, aby nás tlačila k uznání státu [pressured_to_recognize]. Čím větší vliv bude mít [FROM.GetNameDef] v naší zemi, tím nákladnější pro nás bude jejich odmítnutí." # todo: NEW TRANSLATION
 recognition.8.a: "Tento stát si zaslouží uznání!" # todo: NEW TRANSLATION
 recognition.8.b: "Odmítáme uznat tento odtržený stát!" # todo: NEW TRANSLATION
 recognition.12.t: "[FROM.FROM.GetName] žádá o doporučení Rady bezpečnosti" # todo: NEW TRANSLATION
 recognition.12.d: "[FROM.FROM.GetName] požádal Radu bezpečnosti o doporučení Valnému shromáždění navzdory námitce [FROM.GetName]. Rada nyní musí hlasovat." # todo: NEW TRANSLATION
 recognition.12.a: "Hlasovat pro" # todo: NEW TRANSLATION
 recognition.12.b: "Hlasovat proti" # todo: NEW TRANSLATION
 recognition.12.c: "Zdržet se" # todo: NEW TRANSLATION
 recognition.15.t: "Hlasování o členství [FROM.FROM.GetName] v OSN" # todo: NEW TRANSLATION
 recognition.15.d: "Po zajištění doporučení Rady bezpečnosti nyní otázka přijetí [FROM.FROM.GetName], proti němuž stojí [FROM.GetName], připadá Valnému shromáždění." # todo: NEW TRANSLATION
 recognition.15.a: "Hlasovat pro" # todo: NEW TRANSLATION
 recognition.15.b: "Hlasovat proti" # todo: NEW TRANSLATION
 recognition.15.c: "Zdržet se" # todo: NEW TRANSLATION
 recognition.121.t: "Rada bezpečnosti doporučuje [FROM.GetName] k členství v OSN" # todo: NEW TRANSLATION
 recognition.121.d: "Rada bezpečnosti vydala doporučení ve prospěch přijetí [FROM.GetName] do Organizace spojených národů. Záležitost nyní přechází na Valné shromáždění." # todo: NEW TRANSLATION
 recognition.121.a: "Hlasování pokračuje." # todo: NEW TRANSLATION
 recognition.122.t: "Rada bezpečnosti odmítá kandidaturu [This.GetName]" # todo: NEW TRANSLATION
 recognition.122.d: "Rada bezpečnosti hlasovala proti doporučení [This.GetName] Valnému shromáždění. Kandidatura na členství v této fázi končí." # todo: NEW TRANSLATION
 recognition.122.a: "Kandidatura se zastavuje." # todo: NEW TRANSLATION
 recognition.16.t: "Uznat [FROM.GetName]?" # todo: NEW TRANSLATION
 recognition.16.d: "[FROM.GetNameDef] formálně žádá o naše diplomatické uznání. Ať odpovíme jakkoli, bude to vnímáno jako vyjádření našeho postoje k jejich suverenitě." # todo: NEW TRANSLATION
 recognition.16.a: "Nejsme připraveni je uznat." # todo: NEW TRANSLATION
 recognition.16.b: "Uznáváme [FROM.GetName] jako suverénní stát." # todo: NEW TRANSLATION
 recognition.18.t: "Uznat [FROM.GetName]?" # todo: NEW TRANSLATION
 recognition.18.d: "Status [FROM.GetNameDef] je na světové scéně nejistý. Každé hlavní město zaujímá své stanovisko. Jaké bude naše?" # todo: NEW TRANSLATION
 recognition.18.a: "Odmítáme je uznat." # todo: NEW TRANSLATION
 recognition.18.b: "Uznáváme suverenitu [FROM.GetName]." # todo: NEW TRANSLATION
 recognition.31.t: "[FROM.GetName] žádá o naše uznání" # todo: NEW TRANSLATION
 recognition.31.d: "[FROM.GetNameDef] vyhlásil nezávislost na našem území a žádá nás, abychom přijali novou realitu. Naše odpověď určí náš vztah s nimi a vyšle signál ostatním." # todo: NEW TRANSLATION
 recognition.31.a: "Tento režim nikdy neuznáme." # todo: NEW TRANSLATION
 recognition.31.b: "Uznáváme nezávislost [FROM.GetName]." # todo: NEW TRANSLATION
 internal_faction.1.t: "Vojenské vedení žádá zvýšení rozpočtu" # todo: NEW TRANSLATION
 internal_faction.1.d: "Vojenské vedení uvádí nové hrozby naší národní bezpečnosti a požaduje zvýšení [ROOT.GetAdjective] obranného rozpočtu. Schválení této žádosti zvýší tlak na náš rozpočet, ale odmítnutí sníží názor armády na naší vládu." # todo: NEW TRANSLATION
 internal_faction.1.a: "Měli bychom jim dát peníze." # todo: NEW TRANSLATION
 internal_faction.1.b: "Nemůžeme si toto zvýšení dovolit!" # todo: NEW TRANSLATION
 internal_faction.2.t: "Někteří kádři Komunistické strany se dopouštějí korupce!" # todo: NEW TRANSLATION
 internal_faction.2.d: "Naše zpravodajské služby nedávno zjistily, že někteří úředníci komunistické strany přijímají úplatky a pěstují klientelismus. Na jedné straně bychom takové činy neměli nechávat nepotrestané, chceme-li zůstat legitimní v očích lidu, na druhé straně by takový krok jistě odcizil mnoho důležitých spojenců uvnitř strany." # todo: NEW TRANSLATION
 internal_faction.2.a: "Měli bychom zavřít oči." # todo: NEW TRANSLATION
 internal_faction.2.b: "Musíme je exemplárně potrestat!" # todo: NEW TRANSLATION
 internal_faction.3.t: "Průmyslové konglomeráty žádají daňové úlevy" # todo: NEW TRANSLATION
 internal_faction.3.d: "Šéfové některých největších průmyslových konglomerátů v [ROOT.GetName] nás soukromě lobují, abychom jim poskytli více daňových úlev. Udělením těchto daňových úlev zlepšíme jejich názor na naší vládu, ale snížíme státní daňové příjmy." # todo: NEW TRANSLATION
 internal_faction.3.a: "Měli bychom udělit daňové úlevy." # todo: NEW TRANSLATION
 internal_faction.3.b: "Nemůžeme si dovolit takové ústupky." # todo: NEW TRANSLATION
 isis.1.t: "Vítězství nad Islámským státem" # todo: NEW TRANSLATION
 isis.1.d: "Nyní, když byl Islámský stát poražen, naše země již nebude sužována extremistickou propagandou produkovanou IS. Nyní se můžeme soustředit na šíření našich myšlenek v naší zemi a nikdy znovu nedovolit extremistům převzít kontrolu." # todo: NEW TRANSLATION
 isis.1.a: "Skvělé" # todo: NEW TRANSLATION
 isis.2.t: "Infiltrovat Tahrir al-Sham?" # todo: NEW TRANSLATION
 isis.2.d: "Ó chalífe všech muslimů, [Root.GetLeader]. Měli bychom udeřit na srdce našeho odporného nepřítele, Tahrir al-Sham, kteří odmítají uznat tvé spravedlivé a právoplatné panování. Ačkoli se odklonili od cesty pravého islámu a slavného džihádu, mají v řadách mnoho schopných bojovníků. Inša'Allah, měli bychom je infiltrovat a pokusit se přimět co nejvíce z nich, aby dezertovali k našemu slavnějšímu chalífátu!" # todo: NEW TRANSLATION
 isis.2.a: "Pokusme se přetáhnout skutečné bojovníky od této falešné džihádistické skupiny!" # todo: NEW TRANSLATION
 isis.2.b: "Ne, nemůžeme si dovolit možné vnitřní střety." # todo: NEW TRANSLATION
 isis.2.a_tt: "§HInfiltrovat se nezdařilo§! (Bez efektu)" # todo: NEW TRANSLATION
 isis.3.t: "Bojovníci dezertují k Daeshi" # todo: NEW TRANSLATION
 isis.3.d: "[Root.GetLeader]! Takzvaný „Islámský“ stát nás infiltroval a podařilo se mu přesvědčit některé z našich nejlepších bojovníků, aby se přidali k jejich směšnému zástupnému chalífátu. To nesmíme nechat bez odpovědi, musíme zasáhnout a porazit tyto charidžity, kteří vyhlašují takfír na každém kroku a používají Svatý Korán jako toaletní papír." # todo: NEW TRANSLATION
 isis.3.a: "My, spravedliví džihádisté, je zmasakrujeme jako psy!" # todo: NEW TRANSLATION
 isis.3.b: "Ne, nemůžeme si dovolit další frontu v této válce." # todo: NEW TRANSLATION
 isis.4.t: "Jednotky Tahrir al-Sham dezertují" # todo: NEW TRANSLATION
 isis.4.d: "Ó chalífe, mnoho spravedlivých a statečných bratrů muwahhidů dezertovalo od zlověstného frontu Tahrir al-Sham a připojilo se k naší věci!" # todo: NEW TRANSLATION
 isis.4.a: "Takbír! Islámský stát takbír!" # todo: NEW TRANSLATION
 isis.4.a_tt: "Přidává 2 §HJabat al-Nusra brigády§! v §HRaqqa§!." # todo: NEW TRANSLATION
 isis.5.t: "Známka slabosti od Tahrir al-Sham" # todo: NEW TRANSLATION
 isis.5.d: "Ó chalífe, hnusný front Tahrir al-Sham je slabší, než jsme si mysleli, nedělají nic proti naší infiltraci a nedávným dezerterům. Válečná rada šúra doporučuje, abychom jejich hnijící zbytky zmasakrovali jako psy a vzali jejich území - připojili je k našemu slavného chalífátu!" # todo: NEW TRANSLATION
 isis.5.a: "Naučíme tyto falešné džihádisty, kdo je pravým nástupcem šejka Usámy!" # todo: NEW TRANSLATION
 isis.5.b: "Jejich čas přijde, ale zatím musíme počkat." # todo: NEW TRANSLATION
 isis.6.t: "Zbytky Tahrir al-Sham se připojují k našemu Chalífátu" # todo: NEW TRANSLATION
 isis.6.d: "Ó chalífe, sladká šťáva vítězství je na našich rtech. Blížící se porážce se zbytky Tahrir al-Sham přísahají věrnost tobě, [Root.GetLeader], a našemu neustále rostoucímu Chalífátu." # todo: NEW TRANSLATION
 isis.6.a: "Vítáme naše bratry v pravém Chalífátu!" # todo: NEW TRANSLATION
 isisNews.1.t: "Tahrir al-Sham se přidává k ISIS" # todo: NEW TRANSLATION
 isisNews.1.d: "S narůstajícím tlakem na syrské islamisty z Tahrir al-Sham jejich zbylé síly přísahaly věrnost ISIS v posledním zoufalém pokusu prosadit svou fundamentalistickou ideologii v Sýrii." # todo: NEW TRANSLATION
 isisNews.1.a: "Bůh nám buď milostiv!" # todo: NEW TRANSLATION
 isis.7.t: "Skryté" # todo: NEW TRANSLATION
 isis.7.d: "Skryté" # todo: NEW TRANSLATION
 isis.7.a: "Skryté" # todo: NEW TRANSLATION
 isis.1301.t: "Abu Fatima padl mučednickou smrtí při náletu koalice" # todo: NEW TRANSLATION
 isis.1301.d: "Špatné zprávy, chalífe! Tvůj dobrý přítel a kolega irácký zástupce Abu Fatima al-Jaheishi byl statečně usmrcen v zbabělém náletu Američanů.\n\n                                               Zabil mnoho odpadlíků.\n\n                                         Kéž Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isis.1301.a: "Pomstíme ho, až dobyjeme Washington DC!" # todo: NEW TRANSLATION
 isisNews.1301.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1301.d: "Irácký terorista a vysoký velitel ISIS Abu Fatima al-Jaheishi byl dnes zabit při náletu koalice vedené USA. Abu Fatima byl součástí Bagdádího vnitřního kruhu a sloužil jako zástupce vůdce částí Iráku pod kontrolou ISIS." # todo: NEW TRANSLATION
 isisNews.1301.a: "Konečně pryč!" # todo: NEW TRANSLATION
 isis.1302.t: "al-Sulami padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1302.d: "Špatné zprávy, chalífo! Hlavní duchovní Abu Sufyan al-Sulami byl umučen při zbabělém náletu Američanů. Přišel k nám ze země Bahrajn a poskytl nám klíčovou náboženskou podporu pro náš chalífát.\n\n               Ó chalífe, inspiroval nás všechny svým krásným životopisem o tobě.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1302.t: "Šéfovský duchovní ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1302.d: "Bahrajnský terorista a přední náboženský vůdce ISIS Turki al-Binali, známý svým válečným jménem \"Abu Sufyan al-Sulami\", byl dnes zabit při náletu koalice USA. al-Binali nebyl důležitý pro vojenské úsilí ISIS, ale byl klíčový v poskytování náboženské podpory skupině a napsal první životopis Abu Bakra al-Baghdádího." # todo: NEW TRANSLATION
 isis.1303.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1303.d: "Špatné zprávy, chalífe! Emír našich albánských a kosovských bojovníků a vysoký velitel Lavdrim Muhaxheri byl umučen při zbabělém náletu amerických psů.\n\n                                                Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1303.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1303.d: "Kosovsko-albánský terorista a vysoký velitel ISIS Lavdrim Muhaxheri byl dnes zabit při náletu koalice USA. Muhaxheri bojoval v Afghánistánu na straně NATO, ale kolem roku 2012 se stal radikalizovaným a odcestoval do Sýrie. V roce 2013 se připojil k ISIS a rychle se stal 'Emírem' albánských a kosovských bojovníků v Sýrii a Iráku. Byl brutálním gaunerem, který osobně stínal vězně." # todo: NEW TRANSLATION
 isis.1304.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1304.d: "Ó chalífe, hrozné zprávy! Náš elitní vojenský velitel Gulmurod Khalimov byl umučen při zbabělém náletu amerických psů. Než našel cestu k nám ze zemí Tádžiků, byl vysokým důstojníkem speciálních sil. Jeho vojenské znalosti nám budou velmi chybět.\n\n                                                Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1304.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1304.d: "Tádžický terorista a vysoký velitel ISIS Gulmurod Khalimov byl dnes zabit při náletu koalice USA. Khalimov byl zkušený a vysoce postavený důstojník speciálních sil v tádžické armádě před tím, než přeběhl k ISIS." # todo: NEW TRANSLATION
 isis.1305.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1305.d: "Ó chalífe, hrozné zprávy! Náš šéf operací sebevražedného nasazení a klíčový instruktor zahraničních mudžáhidů, Abdullah Ahmed al-Mashadani, byl umučen při náletu amerických psů.\n\n                                                Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1305.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1305.d: "Irácký terorista a vysoký velitel ISIS Abdullah Ahmed al-Mashadani byl dnes zabit při náletu koalice USA. al-Mashadani byl klíčový pro válečné úsilí ISIS vedením operací sebevražedných atentátů a výcvikem zahraničních džihádistů." # todo: NEW TRANSLATION
 isis.1306.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1306.d: "Ó chalífe, špatné zprávy! Náš guvernér oblasti Středního Eufratu, Ahmed Khalal al-Juhayshi, byl umučen při náletu amerických psů.\n\n                                                Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1306.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1306.d: "Irácký terorista a vysoký člen ISIS, Ahmed Khalal al-Juhayshi, byl dnes zabit při náletu koalice USA. al-Juhayshi nebyl prominentním vojenským velitelem, ale administrátorem a guvernérem klíčové oblasti Středního Eufratu pro Islámský stát." # todo: NEW TRANSLATION
 isis.1307.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1307.d: "Ó chalífe, špatné zprávy! Tvůj dobrý přítel a náčelník logistiky a zásobování, Fares Reif al-Naima, byl umučen při náletu amerických psů. Byl dlouholetým statečným a věrným mudžáhidem, bojujícím proti nevěřícím a odpadlíkům od roku 2003.\n\n                                 Zabil mnoho pro slávu chalífátu.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1307.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1307.d: "Irácký terorista a vysoký velitel ISIS, Fares Reif al-Naima, byl dnes zabit při náletu koalice USA. al-Naima bojoval proti americkým silám ve válce v Iráku a poté, co byl americkými silami zadržen v Camp Bucca spolu s al-Baghdádím, vystoupal na pozici náčelníka logistiky a zásobování Islámského státu." # todo: NEW TRANSLATION
 isis.1308.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1308.d: "Ó chalífe, špatné zprávy! Abu Ahmad al-Alwani byl umučen při náletu amerických nevěřících. Byl důstojníkem v irácké armádě Saddáma Husajna a velmi nám pomohl svým vhledem, když se přidal k sunnitskému povstání a našemu milovanému Islámskému státu.\n\n                                                Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1308.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1308.d: "Irácký terorista a vysoký velitel ISIS, Abu Ahmad al-Alwani, byl dnes zabit při náletu koalice USA. al-Alwani byl důstojníkem v irácké armádě Saddáma Husajna, než se připojil k sunnitskému povstání proti americkým silám. Rychle se vypracoval v rámci Islámského státu Iráku na pozici vysokého velitele." # todo: NEW TRANSLATION
 isis.1309.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1309.d: "Ó chalífe, špatné zprávy! Abu Muhammad al-Shimali byl umučen při náletu amerických nevěřících. Pocházel k nám ze zemí Arábie, pomáhal nám pašovat ropu a nakupovat zbraně. Naverboval mnoho statečných mudžáhidů do našeho chalífátu a bude navždy chválen za svou klíčovou roli v organizaci pařížských útoků v roce 2015.\n\n                                                Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1309.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1309.d: "Saúdský terorista a vysoký velitel ISIS, Abu Muhammad al-Shimali, byl dnes zabit při náletu koalice USA. al-Shimali byl klíčovým verbířem a pašerákem pro Islámský stát. Kromě toho zpravodajské zprávy naznačují, že sehrál důležitou roli při pomoci pařížským útokům v roce 2015." # todo: NEW TRANSLATION
 isis.1310.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1310.d: "Ó chalífe, katastrofa! Náš ministr války a druhý nejvyšší velitel, Ayad al-Jumaili, byl statečně umučen při hnusném náletu amerických nevěřících psů. Spoluobčan Iráčan, byl vysokým důstojníkem zpravodajských služeb za Saddáma Husajna a uplatnil svou moudrost při udržování bezpečí chalífátu před vnitřními nepřáteli jako náš šéf zpravodajství a vnitřní bezpečnosti.\n\n                                               Zabil mnoho zrádců.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1310.t: "Druhý nejvyšší velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1310.d: "Irácký terorista a druhý nejvyšší velitel Islámského státu, Ayad al-Jumaili, byl dnes zabit při náletu koalice USA. al-Jumaili byl vysokým důstojníkem zpravodajských služeb za Saddáma Husajna, který se přidal k sunnitskému povstání po americké okupaci v roce 2003. Stal se šéfem zpravodajství a vnitřní bezpečnosti Islámského státu a později byl povýšen na druhého velitele a ministra války." # todo: NEW TRANSLATION
 isis.1311.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1311.d: "Ó chalífe, špatné zprávy! Vysoký velitel Khairy Abed Mahmoud al-Taey byl umučen při náletu amerických nevěřících. Spoluobčan Iráčan, byl členem naší vojenské šúry a vedl operace s improvizovanými výbušnými zařízeními (IED), právem šíříc strach a chaos do srdcí našich nepřátel.\n\n                                               Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1311.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1311.d: "Irácký terorista a vysoký velitel ISIS, Khairy Abed Mahmoud al-Taey, byl dnes zabit při náletu koalice USA. al-Taey byl součástí vojenské rady ISIS a vedl operace s improvizovanými výbušnými zařízeními (IED), způsobující chaos ve městech, které ISIS napadl." # todo: NEW TRANSLATION
 isis.1312.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1312.d: "Ó chalífe, špatné zprávy! Tvůj přítel, poradce a vysoký velitel, Abdul Wahid Khutnayer Ahmad, byl umučen při náletu amerických nevěřících. Spoluobčan Iráčan, měl na starosti vnitřní bezpečnost.\n\n                                        Odhalil mnoho zrádců a odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1312.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1312.d: "Irácký terorista a vysoký velitel ISIS, Abdul Wahid Khutnayer Ahmad, byl dnes zabit při náletu koalice USA. Khutnayer Ahmad byl klíčovým poradcem al-Baghdádího a byl postaven do čela vnitřní bezpečnosti." # todo: NEW TRANSLATION
 isis.1313.t: "Velitel padl při náletu koalice" # todo: NEW TRANSLATION
 isis.1313.d: "Ó chalífe, hrozné zprávy! Náš vysoký velitel, Abu Jihad Shishani, byl umučen při náletu amerických nevěřících psů. Přijal cestu k nám ze zemí Čečenců a statečně bojoval pro slávu Alláha až do konce.\n\n                                               Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.1313.t: "Velitel ISIS zabit při náletu koalice" # todo: NEW TRANSLATION
 isisNews.1313.d: "Čečenský terorista a vysoký velitel ISIS, Abu Jihad Shishani, byl dnes zabit při náletu koalice USA. Shishani, ruský občan, byl druhým mužem v povstalecké skupině Emirát Kavkazu pod vedením Umara Shishaniho. Poté, co Umar odcestoval do Sýrie a připojil se k ISIS, Abu Jihad se pokusil převzít Emirát Kavkazu, aby mu přísahal loajalitu vůči ISIS, ale nakonec odcestoval do Sýrie bojovat za ISIS jako vysoký velitel." # todo: NEW TRANSLATION
 isis.11301.t: "Abu Fatima padl při ruském náletu" # todo: NEW TRANSLATION
 isis.11301.d: "Špatné zprávy, chalífe! Tvůj dobrý přítel a spoluirácký zástupce, Abu Fatima al-Jaheishi, byl statečně umučen při zbabělém náletu Rusů.\n\n                                               Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isis.11301.a: "Pomstíme ho, až dobyjeme Moskvu!" # todo: NEW TRANSLATION
 isisNews.11301.t: "Velitel ISIS zabit při ruském náletu" # todo: NEW TRANSLATION
 isisNews.11301.d: "Irácký terorista a vysoký velitel ISIS Abu Fatima al-Jaheishi byl dnes zabit při ruském náletu. Abu Fatima byl součástí vnitřního kruhu al-Baghdádího a sloužil jako zástupce vůdce v oblastech Iráku kontrolovaných ISIS." # todo: NEW TRANSLATION
 isisNews.11301.a: "Konečně pryč!" # todo: NEW TRANSLATION
 isis.11302.t: "al-Sulami padl při ruském náletu" # todo: NEW TRANSLATION
 isis.11302.d: "Špatné zprávy, chalífe! Hlavní duchovní Abu Sufyan al-Sulami byl umučen při zbabělém náletu Rusů. Přišel k nám ze země Bahrajn a poskytl nám klíčovou náboženskou podporu pro náš chalífát.\n\n                 Ó chalífe, inspiroval nás všechny svým krásným životopisem o tobě.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.11302.t: "Šéfovský duchovní ISIS zabit při ruském náletu" # todo: NEW TRANSLATION
 isisNews.11302.d: "Bahrajnský terorista a přední náboženský vůdce ISIS Turki al-Binali, známý svým válečným jménem \"Abu Sufyan al-Sulami\", byl dnes zabit při ruském náletu. al-Binali nebyl důležitý pro vojenské úsilí ISIS, ale byl klíčový v poskytování náboženské podpory skupině a napsal první životopis Abu Bakra al-Baghdádího." # todo: NEW TRANSLATION
 isis.11303.t: "Velitel padl při ruském náletu" # todo: NEW TRANSLATION
 isis.11303.d: "Špatné zprávy, chalífe! Emír našich albánských a kosovských bojovníků a vysoký velitel Lavdrim Muhaxheri byl umučen při zbabělém náletu ruských psů.\n\n                                                Zabil mnoho odpadlíků.\n\n                                         Ať Alláh přijme jeho mučednictví." # todo: NEW TRANSLATION
 isisNews.11303.t: "Velitel ISIS zabit při ruském náletu" # todo: NEW TRANSLATION
 isisNews.11303.d: "Kosovsko-albánský terorista a vysoký velitel ISIS Lavdrim Muhaxheri byl dnes zabit při ruském náletu. Muhaxheri bojoval v Afghánistánu na straně NATO, ale kolem roku 2012 se stal radikalizovaným a odcestoval do Sýrie. V roce 2013 se připojil k ISIS a rychle se stal 'Emírem' albánských a kosovských bojovníků v Sýrii a Iráku. Byl brutálním gaunerem, který osobně stínal vězně." # todo: NEW TRANSLATION
