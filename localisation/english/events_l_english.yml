 ecuadornews.1.t: "Vojenský převrat v Ekvádoru" # todo: NEW TRANSLATION
 ecuadornews.1.d: "Ekvádorská armáda zasáhla uprostřed hluboké politické a hospodářské krize a zbavila prezidenta Jamil Mahuada moci. Vyšší důstojníci v čele s generálem Carlosem Mendozou převzali kontrolu nad situací a odsunuli stranou civilní vládu i vedení protestů CONAIE. Ozbrojené síly tento krok označují za dočasné opatření k obnovení stability, není však jasné, jak rychle se vrátí civilní vláda ani jakou podobu bude mít." # todo: NEW TRANSLATION
 ecuadornews.1.a: "Zajímavé." # todo: NEW TRANSLATION
 ecuadornews.2.t: "Vojenský převrat v Ekvádoru" # todo: NEW TRANSLATION
 ecuadornews.2.d: "Hospodářská krize a kontroverzní reformy vlády dohnaly Ekvádor na pokraj zhroucení. Po masových demonstracích vedených Konfederací domorodých národností Ekvádoru (CONAIE) a přeběhnutí několika mladších vojenských důstojníků oznámili opoziční představitelé vznik Národní junty spásy. Samotná vyhlášená Národní junta spásy je představována jako trojstranné vedení symbolizující národní jednotu. Tvoří ji domorodý vůdce Antonio Vargas, civilní soudce Carlos Solórzano a vojenský představitel generál Lucio Gutiérrez." # todo: NEW TRANSLATION
 ecuadornews.2.a: "Zajímavé." # todo: NEW TRANSLATION
 ecuadornews.3.t: "Ekvádorská Národní junta spásy se hroutí" # todo: NEW TRANSLATION
 ecuadornews.3.d: "Pokus vytvořit v Quitu civilně-vojenskou juntu selhal. Navzdory masovým protestům a obsazení Kongresu organizací CONAIE a spojeneckými skupinami vrchní velení armády odmítlo novou vládu podpořit. Generál Carlos Mendoza převzal kontrolu nad situací, odsunul stranou vedení protestů a ukončil projekt junty. Bez vojenské podpory se koalice rychle rozpadla a mnoho spiklenců bylo zatčeno." # todo: NEW TRANSLATION
 ecuadornews.3.a: "Zajímavé." # todo: NEW TRANSLATION
 ecuador.1.t: "Přijetí dolaru" # todo: NEW TRANSLATION
 ecuador.1.d: "Po finanční krizi v letech 1998–1999 zemi stále svírá hospodářská nestabilita. Prezident Jamil Mahuad navrhuje dolarizaci ekonomiky s cílem zastavit inflaci a obnovit důvěru ve finanční systém. Vláda zároveň škrtá více než 60 % rozpočtu ozbrojených sil, čímž vážně poškozuje vztahy s armádou." # todo: NEW TRANSLATION
 ecuador.1.a: "Prosadit dolarizaci" # todo: NEW TRANSLATION
 ecuador.1.b: "Ustoupit od některých radikálních reforem" # todo: NEW TRANSLATION
 ecuador.2.t: "Povstání v Quitu" # todo: NEW TRANSLATION
 ecuador.2.d: "V reakci na hospodářské plány vlády proudí do Quita davy domorodých obyvatel a požadují odvolání prezidenta Jamil Mahuada. Protestující obsazují Kongres a Nejvyšší soud, paralyzují stát a odhalují neschopnost vlády udržet pořádek. S rostoucím tlakem v hlavním městě jsou stále více zpochybňovány loajalita bezpečnostních sil i přežití vlády." # todo: NEW TRANSLATION
 ecuador.2.a: "Udržet pořádek" # todo: NEW TRANSLATION
 ecuador.3.t: "Vláda národní spásy" # todo: NEW TRANSLATION
 ecuador.3.d: "Vedoucí představitelé protestů v čistě symbolickém aktu oznamují v celostátní televizi vytvoření takzvané Národní junty spásy a tvrdí, že zastupuje vůli lidu. Prohlášení získává širokou veřejnou podporu a dále podkopává autoritu civilní vlády. Junta je představována jako vedená generálem Carlosem Mendozou." # todo: NEW TRANSLATION
 ecuador.3.a: "Generál Lucio Gutiérrez přebírá vedení" # todo: NEW TRANSLATION
 ecuador.3.b: "Vpřed, pokračujeme" # todo: NEW TRANSLATION
 ecuador.4.t: "Tříčlenná junta" # todo: NEW TRANSLATION
 ecuador.4.d: "Vyhlášená Národní junta spásy je nyní představována jako trojstranné vedení symbolizující národní jednotu. Tvoří ji domorodý vůdce Antonio Vargas, civilní soudce Carlos Solórzano a vojenský představitel generál Lucio Gutiérrez." # todo: NEW TRANSLATION
 ecuador.4.a: "Něco jiného" # todo: NEW TRANSLATION
 ecuador.5.t: "Vyšší vojenští velitelé vládu nepodpořili" # todo: NEW TRANSLATION
 ecuador.5.d: "Přestože veřejné mínění do značné míry podporuje obsazení Kongresu organizací CONAIE a výzvu k rezignaci prezidenta Mahuada, pro přímou vojenskou vládu panuje jen malá podpora. Generál Carlos Mendoza si je toho vědom, odsouvá koalici stranou a přebírá kontrolu nad jednáním. Vrchní velení, úzce spojené s ekvádorskými politickými a hospodářskými elitami včetně osobností, jako je León Febres Cordero, který plány junty rozhodně odmítá a jehož postoj dále ovlivňuje hrozba hospodářských sankcí USA, si vynucuje rozhodující rozchod s vedením protestů." # todo: NEW TRANSLATION
 ecuador.5.a: "Generál Mendoza předává moc Gustavu Noboaovi" # todo: NEW TRANSLATION
 ecuador.5.b: "Neodstupovat" # todo: NEW TRANSLATION
