 PERSONAL_INCOME_TAXES_TOOLTIP: "Příjmy z daní obyvatel"
 PERSONAL_INCOME_TAXES_TOOLTIP_DELAYED: "Daně obyvatelstva jsou různé daně vybírané od našich občanů. Patří mezi ně například DPH, daň z příjmu, majetková daň a daně z osobních kapitálových zisků. Výše daňových příjmů závisí na počtu obyvatel a naší §YSazbě populační daně§!. §YPříjem obyvatelstva§! je ovlivňován především naším §Yekonomickým cyklem§! a §Yúrovní korupce§!. Příjem mohou ovlivňovat také různé ideje.\n\nKaždé §Y1 %§! populační daně snižuje naši stabilitu o §R-1 %§!, protože lidé za své daňové zatížení očekávají služby.\n\nZákony, národní duchové a technologie ovlivňují §Yveškeré daňové příjmy§!: [?modifier@tax_gain_multiplier_modifier|+%0]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy obyvatelstva§!: [?modifier@population_tax_income_multiplier_modifier|+%0]\n" # todo: CHANGED
 CORPORATE_INCOME_TAXES: "§LPříjmy firem:§!"
 CORPORATE_INCOME_RATE: "$$§G[?corporate_tax|+3]§!"
 CORPORATE_INCOME_TAXES_TOOLTIP: "Příjmy z daní právnických osob:\n$[?agriculture_district_tax|+3] z §Ykomercializovaných zemědělských oblastí§!\n$[?agriculture_tax_gain|+3] ze §Ysoběstačného zemědělství§!\n$[?civil_fac_tax|+3] z §Ycivilních průmyslů§!\n$[?military_fac_tax|+3] z §Yvojenských průmyslů§!\n$[?dockyard_tax|+3] z §Yloděnic§!\n$[?office_tax|+3] z §Ykancelářských sektorů§!\n$[?microchip_plant_tax|+3] z §Ytováren na mikročipy§!\n$[?composite_plant_tax|+3] z §Ytováren na kompozity§!\n$[?synthetic_refinery_tax|+3] ze §Ysyntetických rafinerií§!\n$[?nuclear_reactor_tax|+3] z §Yjaderných reaktorů§!\n$[?fossil_powerplant_tax|+3] z §Yelektráren na fosilní paliva§!\n$[?renewable_energy_tax|+3] z §Yinfrastruktury obnovitelné energie§!\n$[?internet_station_tax|+3] z §Yinternetových stanic§!\n$[?rail_terminal_tax|+3] z §Yželezničních terminálů§!\n$[?healthcare_tax_gain|+3] ze §Yzdravotnictví§!" # todo: CHANGED
 CORPORATE_INCOME_TAXES_TOOLTIP_DELAYED: "Daně právnických osob jsou daně vybírané od společností působících v naší zemi. Patří mezi ně například DPH, pozemkové daně a samozřejmě daně ze zisku. Výše daní závisí na počtu §Ycivilních průmyslů§!, §Yvojenských průmyslů§!, §Yloděnic§!, §Ykancelářských sektorů§! a §Ykomercializovaných zemědělských oblastí§! v naší zemi a na naší §YSazbě daně z příjmů právnických osob§!. §YPříjem právnických osob§! je ovlivňován především naším §Yekonomickým cyklem§! a §Yúrovní korupce§!. Příjem mohou ovlivňovat také různé ideje.\n\nDaň z příjmů právnických osob určuje naše §Ydaňové náklady§! (kolik §Ycivilních průmyslů§! nemáme k dispozici pro výstavbu) a také ovlivňuje, kolik musí jiné země zaplatit za investice do našich států\n\nZákony, národní duchové a technologie ovlivňují §Yveškeré daňové příjmy§!: [?modifier@tax_gain_multiplier_modifier|+%0]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy právnických osob§!: [?modifier@corporate_tax_income_multiplier_modifier|+%0]\nProduktivita ovlivňuje §Ydaňové příjmy právnických osob§!: [?productivity_tax_effect_display|+%]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy kancelářských sektorů§!: [?modifier@office_park_income_tax_modifier|+%0]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy loděnic§!: [?modifier@dockyard_income_tax_modifier|+%0]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy civilních průmyslů§!: [?modifier@civilian_industry_tax_modifier|+%0]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy vojenských průmyslů§!: [?modifier@military_industry_tax_modifier|+%0]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy komercializovaných zemědělských oblastí§!: [?modifier@agriculture_district_income_tax_modifier|+%0]\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy továren na mikročipy§!: [?modifier@microchip_plant_income_tax_modifier|+%0]\n\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy továren na kompozity§!: [?modifier@composite_plant_income_tax_modifier|+%0]\n\nZákony, národní duchové a technologie ovlivňují §Ydaňové příjmy syntetických rafinerií§!: [?modifier@synthetic_refinery_income_tax_modifier|+%0]\n\nZákony, národní duchové a technologie ovlivňují §Ypříjmy ze zdravotnictví§!: [?modifier@healthcare_income_multiplier_modifier|+%0]\n" # todo: CHANGED
