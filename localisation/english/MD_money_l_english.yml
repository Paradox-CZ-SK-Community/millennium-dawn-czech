 INT_INVESTMENTS_TOOLTIP: "Máme $[?int_investments|3] §Hbiliard§! v mezinárodních investicích.\nKaždý rok z nich získáme [?roi_rate|%0] §Hnávratnost investic§!, což týdně generuje $[?int_investments_rate|3] §Hbiliard§!. $[?int_investments_collected_rate|3] §Hbiliard§! jde do státní pokladny. $[?int_investments_reinvest_rate|3] §Hbiliard§! se reinvestuje.\nAktuální aktivní §Yinvestiční projekty§!: [?active_projects|0]/15" # todo: CHANGED
 INT_INVESTMENTS_TOOLTIP_DELAYED: "£key_shift  + £click_left §YShift + levé kliknutí§! pro přepnutí reinvestování §Hpříjmů z investic§!: §YVypnuto§! (vše do státní pokladny) §C->§! §GPlné§! (vše reinvestováno) §C->§! §GRozdělené§! (polovina do státní pokladny, polovina reinvestována).\n\n£GFX_key_ctrl + £click_left §YCtrl + levé kliknutí§! pro povolení/zakázání automatického odmítání investic. To znamená, že automaticky odmítnete VŠECHNY příchozí investiční nabídky.\n\n £GFX_click_right §YPravé kliknutí§! pro prodej $1 miliardy zahraničních investic. Získat lze zpět pouze 60 % částky. £GFX_key_ctrl §YCtrl§! (10×) nebo £key_shift §YShift§! (100×) zvýší prodávané množství.\n\n[int_reinvestment_toggled]\n[int_auto_rejection_toggled]" # todo: CHANGED
 investments_INT_INVESTMENTS_TOOLTIP: "V mezinárodních investicích máme $[?ROOT.int_investments] §Hmiliard§!.\nTýdně generujeme $[?ROOT.int_investments_rate] §Hmiliard§!. $[?ROOT.int_investments_collected_rate] §Hmiliard§! jde do pokladny. $[?ROOT.int_investments_reinvest_rate] §Hmiliard§! se reinvestuje." # todo: NEW TRANSLATION
 DEBT_TOOLTIP: "§YCelkový dluh§!: $[?debt|3] §Ymiliard§!\n§YÚroková sazba§!: [?interest_rate|2]%\nPoměr §Ydluhu k HDP§!: §Y[?debt_ratio|-%1]§!\n§YÚrok z dluhu§!: $[?debt_rate|-3] §Ymiliard§!\n[debt_automatic_repayment_toggled]" # todo: CHANGED
 DEBT_TOOLTIP_DELAYED: "£click_left §YLevé kliknutí§! pro půjčení $1 §Ymiliardy§!.\n£GFX_click_right §YPravé kliknutí§! pro splacení $1 §Ymiliardy§!.\n£GFX_click_right §YPravé kliknutí + Alt§! pro splacení $[?treasury] §Ymiliard§!.\nPlaťte více pomocí §YCtrl§!(10×), §YShift§!(100×) a §YAlt§!(1000×); až do výše celé státní pokladny.\nPoplatek za půjčku činí 1 %; vypůjčená $1 §Ymiliarda§! = dluh $1,01 §Ymiliardy§!.\n\nFaktory §Yúrokové sazby§!:\n  Poměr dluhu k HDP: [?debt_interest_premium|-2]%\n  Národní duchové: [?interest_rate_multiplier|-2]%\n  Základní sazba centrální banky: [?cb_rate_premium|-2]%\n  Napětí ve světě: [?threat_interest_premium|-2]%\n  Vytvořené napětí ve světě: [?adjusted_tension_premium|-2]%\n[interest_rate_clamp_line]\nÚčinky §Yúrokové sazby§!:\n  §YÚroková sazba§! > §Y10%§!: přístup k mimořádným rozhodnutím pro řešení dluhu.\n  §YÚroková sazba§! > §Y15%§!: ekonomické §Rzpomalení§!, další §Rnepříznivé účinky§! a možnost nesplatit náš dluh za vysokou cenu.\n  §YÚroková sazba§! > §Y20%§!: omezené půjčování a nemožnost získávat další půjčky na rozpočtové deficity.\n  §YÚrok z dluhu§! > §YHrubý příjem§!: náš národ §Rzkolabuje!§!\n\nPovolte §Yautomatické splácení dluhu§! pomocí §YAlt + Shift + £GFX_click_right pravého kliknutí§!; automaticky se tak splatí 25 % jakéhokoli přebytku." # todo: CHANGED
