 bankruptcy.1.t: "[From.GetNameWithFlag] žádá o záchranu dluhu"
 bankruptcy.1.d: "Dluhový problém země [From.GetName] se zhoršil natolik, že reálně nemá šanci jej splatit, ba ani hradit průběžné úroky. V zoufalé situaci, kdy hrozil bankrot, se vůdce země [From.GetAdjective], [From.GetLeader], vydal do země [Root.GetName] prosit o pomoc vůdce [Root.GetLeader].\n\n[From.GetNameWithFlag] nás žádá, abychom převzali část dluhu ve výši $[FROM.debt_bailout_display] §Ymiliard§! tím, že zaplatíme 75 % a zbytek odpustíme. Pokud tak učiníme, uklidníme ostatní mezinárodní věřitele, výrazně snížíme úvěrové náklady země [From.GetName] a učiníme její obrovský dluh zvládnutelným.\n\nPřestože tím přijdeme o peníze, budou nám vážně zavázáni a náš vliv na ně výrazně vzroste." # todo: CHANGED
 bankruptcy.1.a: "Poskytnout [From.GetNameWithFlag] záchranu"
 bankruptcy.1.b: "Omlouváme se, nemůžeme si to dovolit"
