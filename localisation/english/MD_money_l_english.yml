 very_high_interest_country_modifiers: "Velmi vysoká úroková sazba"
 very_high_interest_country_modifiers_desc: "Velmi vysoká úroková sazba"
 very_high_interest_country_modifiers_tt: "Neustále rostoucí úrokové sazby narušují důvěru obyvatel i finančních institucí ve vládu. Pokud situaci brzy nenapravíme, bude se dále zhoršovat.\n\n"
 debt_default_ecomomic_boom: "Hospodářský boom po platební neschopnosti"
 debt_default_ecomomic_boom_desc: "Poté, co země po vyhlášení platební neschopnosti upadla do chaosu, došlo k prudkému oslabení měny, raketovému růstu inflace, nárůstu nezaměstnanosti a kolapsu akciového trhu. Nyní, když se situace stabilizovala, nás mnozí zahraniční aktéři vnímají jako levnou investici - pracovní síla, zboží i nemovitosti jsou na historickém minimu. To přinese krátkodobý impulz pro ekonomiku díky přílivu zahraničního kapitálu."
