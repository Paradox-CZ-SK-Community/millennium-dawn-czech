 bankruptcy.2.d: "Dluhový problém země [From.GetName] se zhoršil natolik, že reálně nemá šanci jej splatit, ba ani hradit průběžné úroky. V zoufalé situaci, kdy hrozil bankrot, se vůdce země [From.GetAdjective], [From.GetLeader], vydal do země [Root.GetName] prosit o pomoc vůdce [Root.GetLeader].\n\n[From.GetNameWithFlag] nás žádá, abychom převzali část dluhu ve výši $[FROM.debt_bailout_display] §Ymiliard§! tím, že zaplatíme dvě třetiny a zbytek odpustíme. Pokud tak učiníme, uklidníme ostatní mezinárodní věřitele, výrazně snížíme úvěrové náklady země [From.GetName] a učiníme její obrovský dluh zvládnutelným.\n\nPřestože tím přijdeme o peníze, budou nám vážně zavázáni a náš vliv na ně výrazně vzroste." # todo: CHANGED
