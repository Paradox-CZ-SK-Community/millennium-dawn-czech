 NUM_STATE_PRODUCTIVITY_DESC: "Produktivita tohoto státu činí: §Y[?productivity_state_var|3]§!"
 NUM_STATE_PRODUCTIVITY_DELAYED_DESC: "§YMěsíční růst produktivity státu:§! [?state_productivity_growth_scaled|3+]\n\nSvětový průměr produktivity: [?global.average_world_productivity|3]\nProduktivita státu: [?productivity_state_var|3]\n§YModifikátor místního růstu:§! [?modifier@state_productivity_growth_modifier|%+1]\n\nKladný národní růst se násobí hodnotou (1 + (světový průměr / produktivita státu - 1) ×0,5), omezenou na 0–2, a poté hodnotou (1 + místní modifikátor růstu). Produktivita státu je v tomto výpočtu omezena na 100–100 000.\nPři nulovém nebo záporném národním růstu se místo toho násobí poměrem produktivity státu ke světovému průměru. Světový průměr je v tomto výpočtu omezen na 100–10 000 a místní modifikátory růstu se nepoužijí.\n\nNárodní růst a jeho modifikátory naleznete v okně Ekonomika." # todo: CHANGED
