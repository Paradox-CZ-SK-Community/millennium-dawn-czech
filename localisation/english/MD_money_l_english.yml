 DEFENCE_SPENDING_TOOLTIP_DELAYED: "Výdaje na obranu představují peníze používané k financování naší armády. Skládají se ze dvou částí: §Yprůmyslových nákladů§! a §Yprovozních nákladů§!. §YPrůmyslové náklady§! představují peníze vynaložené na provoz našeho obranného průmyslu. Základní náklady na vojenskou továrnu a loděnici se odvíjejí od našeho zákona o §Yvojenských výdajích§!. Přísnější zákon stojí více. Náklady zvyšuje také naše §YHDP na obyvatele§!. Přičítají se rovněž náklady na §Yprotivzdušnou a protiraketovou obranu§!.\n\n§YProvozní náklady§! závisí na počtu nasazených praporů, lodí a letadel a na množství vybavení a letadel ve skladech. Tyto náklady jsou dále upravovány naším §Ybranným zákonem§!, §Yzákonem o výcviku důstojníků§! a §YHDP na obyvatele§!.\n\n§YNáklady kybernetického velení§! představují týdenní režii na udržování národního kybernetického programu. Náklady rostou s §YHDP§! a §Yúrovní schopností§! a upravuje je modifikátor §Ynákladů infrastruktury kybernetické bezpečnosti§!.\n\nHDP na obyvatele ovlivňuje §Yprůmyslové náklady§!: [?defence_breakdown_industry_gdp_modifier|-%0]\nHDP na obyvatele ovlivňuje §Ynáklady na personál§!: [?defence_breakdown_personnel_gdp_modifier|-%0]\nZákony, národní duchové a technologie ovlivňují §Ynáklady na personál§!: [?modifier@personnel_cost_multiplier_modifier|-%0]\n§YInflace§! ovlivňuje §Yprůmyslové náklady§! a §Ynáklady na vybavení§!: [?inflation_rate_var|-%]\nModifikátor §Ynákladů kybernetiky§!: [?modifier@cyber_cost_multiplier_modifier|-%0]" # todo: CHANGED
