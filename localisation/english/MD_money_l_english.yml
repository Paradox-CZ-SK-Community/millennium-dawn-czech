 INTEREST_EXPENSE: "§RÚroky z dluhu:§!"
 INTEREST_EXPENSE_TOOLTIP: "Placení úroků"
 INTEREST_EXPENSE_TOOLTIP_DELAYED: "Z dluhu, který náš národ nashromáždil, musíme platit úroky. Naše úroková sazba je určována především naším §Ypoměrem dluhu k HDP§!. Čím vyšší je tento poměr, tím menší důvěru mají finanční instituce v naši schopnost dluh splatit, což vede k vyšší úrokové sazbě. Naši úrokovou sazbu mohou ovlivňovat různí §Ynárodní duchové§!.\n\n§YÚroková sazba§! vyšší než §Y10 %§! nám zpřístupní mimořádná rozhodnutí pro řešení rostoucího dluhu. Po překročení §Y15 %§! se naše ekonomika začne zpomalovat a utrpíme další nepříznivé účinky. V této fázi budeme moci nesplatit svůj dluh, ovšem za vysokou cenu. Jakmile §Yúrok§! překročí §Y20 %§!, nebudeme si moci ručně brát další půjčky. Pokud §Yúrok z dluhu§! překročí náš §Yhrubý příjem§!, náš národ zkolabuje.\n\nNaše současná §Yúroková sazba§! činí [?interest_rate|3]%\n\nNáš současný poměr dluhu k HDP: §Y[?debt_ratio|%1]§!\n\nVliv idejí na §Yúrokovou sazbu§!: [?interest_rate_multiplier|-2]%\n[debt_automatic_repayment_toggled]" # todo: CHANGED
