 debt_default_has_office_park_tt: "Vlastníme alespoň jeden §Ykancelářský park§!" # todo: NEW TRANSLATION
 lease_military_factories_tt: "§YPronajmout vojenské továrny§!"
 lease_military_factories_delayed_tt: "Autarkní výroba vojenského zboží je minulostí. Můžeme uzavírat smlouvy a pronajímat si vojenské továrny ze zahraničí, abychom vyráběli potřebné zboží.\n\n§YDalší výdaje:§! $§R[?lease_military_factories_cost_display|-3]§!\n\nTyto továrny nám nebudou generovat §YHDP§! ani §Ypříjem právnických osob§!\nAktuálně pronajaté továrny: §Y[?leased_military_factories]§!" # todo: CHANGED
 lease_civilian_factories_tt: "§YPronajmout civilní komplexy§!"
 lease_civilian_factories_delayed_tt: "Najímání zahraničních stavebních a výrobních společností nám umožní rozvíjet vlastní průmysl.\n\n§YDalší výdaje:§! $§R[?lease_civilian_factories_cost_display|-3]§!\n\nTyto továrny nám nebudou generovat §YHDP§! ani §Ypříjem právnických osob§!\nAktuálně pronajaté továrny: §Y[?leased_civilian_factories]§!" # todo: CHANGED
 lease_naval_dockyards_tt: "§YPronajmout loděnice§!"
 lease_naval_dockyards_delayed_tt: "Můžeme zaměstnat a nasmlouvat zahraniční loďařské společnosti, abychom rozšířili své námořnictvo.\n\n§YDalší výdaje:§! $§R[?lease_naval_factories_cost_display|-3]§!\n\nTyto továrny nám nebudou generovat §YHDP§! ani §Ypříjem právnických osob§!\nAktuálně pronajaté loděnice: §Y[?leased_dockyards]§!" # todo: CHANGED
 industrial_projects_tt: "§YPrůmyslové projekty§!"
 industrial_projects_delayed_tt: "Investice do místních průmyslových projektů mohou pomoci zvýšit HDP a místní ekonomickou hodnotu.\n\n§YPředpoklady:§!\n[!industrial_projects_click_enabled]\n§YÚčinky:§!\n[!industrial_projects_click]" # todo: CHANGED
 service_constructions_tt: "§YVýstavba služeb§!"
 service_constructions_delayed_tt: "Investice do našeho sektoru služeb pomohou řešit problémy se stagnující ekonomikou.\n\n§YPředpoklady:§!\n[!service_constructions_click_enabled]\n§YÚčinky:§!\n[!service_constructions_click]" # todo: CHANGED
 infrastructure_investiture_tt: "§YInvestice do infrastruktury§!"
 infrastructure_investiture_delayed_tt: "Dobré silnice = spokojení lidé\n\n§YPředpoklady:§!\n[!infrastructure_investiture_click_enabled]\n§YÚčinky:§!\n[!infrastructure_investiture_click]" # todo: CHANGED
 arms_industry_stipends_tt: "§YDotace zbrojnímu průmyslu§!"
 arms_industry_stipends_delayed_tt: "Podpora zakládání místních zbrojovek může skutečně nastartovat ekonomiku!\n\n§YPředpoklady:§!\n[!arms_industry_stipends_click_enabled]\n§YÚčinky:§!\n[!arms_industry_stipends_click]" # todo: CHANGED
 retool_shipyards_tt: "§YPřestavět loděnice§!"
 retool_shipyards_delayed_tt: "Přestavba civilních loděnic může pomoci naší armádě vyrábět více válečných plavidel k použití proti nepřátelům.\n\n§YPředpoklady:§!\n[!retool_shipyards_click_enabled]\n§YÚčinky:§!\n[!retool_shipyards_click]" # todo: CHANGED
 agro_industrial_expansion_tt: "§YZemědělsko-průmyslová expanze§!" # todo: NEW TRANSLATION
 agro_industrial_expansion_delayed_tt: "Modernizace našich zemědělských oblastí zvýší výnosy plodin a posílí potravinovou bezpečnost.\n\n§YPožadavky:§!\n[!agro_industrial_expansion_click_enabled]\n§YÚčinky:§!\n[!agro_industrial_expansion_click]" # todo: NEW TRANSLATION
 advanced_manufacturing_tt: "§YPokročilá výroba§!" # todo: NEW TRANSLATION
 advanced_manufacturing_delayed_tt: "Investice do pokročilé výroby urychlí rozvoj naší high-tech průmyslové základny.\n\n§YPožadavky:§!\n[!advanced_manufacturing_click_enabled]\n§YÚčinky:§!\n[!advanced_manufacturing_click]" # todo: NEW TRANSLATION
 energy_grid_modernization_tt: "§YModernizace energetické sítě§!" # todo: NEW TRANSLATION
 energy_grid_modernization_delayed_tt: "Modernizovaná energetická síť udrží světla rozsvícená a továrny v provozu.\n\n§YPožadavky:§!\n[!energy_grid_modernization_click_enabled]\n§YÚčinky:§!\n[!energy_grid_modernization_click]" # todo: NEW TRANSLATION
 strategic_defense_infrastructure_tt: "§YStrategická obranná infrastruktura§!" # todo: NEW TRANSLATION
 strategic_defense_infrastructure_delayed_tt: "Posílení naší obranné infrastruktury udrží náš národ v bezpečí.\n\n§YPožadavky:§!\n[!strategic_defense_infrastructure_click_enabled]\n§YÚčinky:§!\n[!strategic_defense_infrastructure_click]" # todo: NEW TRANSLATION
 strategic_rd_sites_tt: "§YStrategická výzkumná a vývojová pracoviště§!" # todo: NEW TRANSLATION
 strategic_rd_sites_delayed_tt: "Investice do našich výzkumných zařízení nám umožní zůstat na špici.\n\n§YPožadavky:§!\n[!strategic_rd_sites_click_enabled]\n§YÚčinky:§!\n[!strategic_rd_sites_click]" # todo: NEW TRANSLATION
