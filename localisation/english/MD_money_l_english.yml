 BUREAUCRACY_EXPENSE_TOOLTIP_DELAYED: "Výdaje na byrokracii představují peníze používané k provozu státní správy. Základní náklady pokrývají infrastrukturu a režii, jejichž výše se odvíjí od počtu obyvatel a úrovně §Ysprávy§!. Vyšší úrovně správy zaměstnávají také větší podíl obyvatel jako státní úředníky, jejichž platy se přičítají k nákladům na infrastrukturu. To znamená, že státy bureau_05 platí nejvyšší režijní násobitel i nejvyšší mzdové náklady.\n\nHDP na obyvatele ovlivňuje §Yvýdaje na byrokracii§!: [?education_cost_gdp_multiplier_display|-%0]\nZákony, národní duchové a technologie ovlivňují §Yvýdaje na byrokracii§!: [?modifier@bureaucracy_cost_multiplier_modifier|-%0]\n§YInflace§! ovlivňuje §Yvýdaje na byrokracii§!: [?inflation_rate_var|-%]\n\nNaplnění pracovních míst státní správy: [?bureaucracy_manpower_fulfillment|%0]" # todo: CHANGED
