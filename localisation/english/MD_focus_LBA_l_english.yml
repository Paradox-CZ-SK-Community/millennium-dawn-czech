 sp_libya_reward_reduce_cyrenaica_opinion_desc: "Kmene Cyrenaiky uspořádaly protest proti našemu současnému projektu na jejich území. Tvrdí, že vláda nemá právo používat jejich půdu pro zbytečné stavební projekty." # todo: NEW TRANSLATION
