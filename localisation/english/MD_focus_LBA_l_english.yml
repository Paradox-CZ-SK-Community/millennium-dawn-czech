 muslim_brotherhood_faction_member_desc: "Společnost muslimských bratří, běžně známá jako Muslimské bratrstvo, je politická a náboženská skupina, která věří v pan-islámismus a zavedení šárie jako obecného práva. Několik zemí podporujících Bratrstvo se rozhodlo vytvořit vojenský spojenectví, aby lépe prosazovaly své zájmy." # todo: NEW TRANSLATION
