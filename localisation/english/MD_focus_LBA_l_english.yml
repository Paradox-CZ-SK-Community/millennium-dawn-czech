 LBA_general_peoples_congress: "Všeobecný lidový kongres" # todo: NEW TRANSLATION
 LBA_general_peoples_congress_desc: "Správa Libye je rozdělena do několika úrovní lidových kongresů. Cílem je demokratizovat a decentralizovat rozhodování a umožnit rozhodování zdola nahoru. Lidové kongresy však fungují souběžně s revolučními výbory džamáhíríje, které kongresům i lidu radí a vzdělávají je v revolučních myšlenkách. V praxi revoluční výbory brání tomu, aby se prosadily jakékoli odchylné politické názory, a odhaduje se, že téměř 15 % libyjských občanů pracuje jako informátoři revolučních výborů.\n\n§YTento národní duch bude odstraněn, pokud budeme salafističtí.§!"
 LBA_empowered_peoples_congress: "Posílený lidový kongres" # todo: NEW TRANSLATION
 LBA_empowered_peoples_congress_desc: "Lidové kongresy se po zrušení revolučních výborů staly hlavními politickými činiteli. Libye nyní uplatňuje skutečnou demokracii zdola nahoru.\n\n§RTento národní duch bude odstraněn, pokud budeme salafističtí.§!"
 LBA_empowered_revolutionary_committees: "Posílené Revoluční výbory" # todo: NEW TRANSLATION
 LBA_empowered_revolutionary_committees_desc: "Revoluční výbory Libye převzaly plnou kontrolu nad politickým procesem v zemi. Dříve pouze zajišťovaly, aby se lidové kongresy ideologicky příliš neodchylovaly, nyní však veškeré rozhodování v podstatě spadá pod kontrolu revolučních výborů.\n\n§YTento národní duch bude odstraněn, pokud budeme salafističtí.§!"
 LBA_undeveloped_agriculture: "Nedostatečně rozvinuté zemědělství" # todo: NEW TRANSLATION
 LBA_undeveloped_agriculture_desc: "Libye je velmi vyprahlá země, kde je obdělávatelná pouze 2 % rozlohy. Stávající islámské dědické zákony a Kaddáfího politika zanechaly veškeré farmy, které zde existují, v rukou velmi malých vlastníků půdy. V zemi se vyrábí jen malá část potravin potřebných pro Libyi a naprostá většina potravin se musí dovážet. Kvůli tomu jsme velmi závislí na ostatních zemích. Největšími vývozci potravin do Libye jsou §Y[BRA.GetNameWithFlag], [ITA.GetNameWithFlag], [EGY.GetNameWithFlag], [SWI.GetNameWithFlag], [SIA.GetNameWithFlag] a [UAE.GetNameWithFlag]§! a naše schopnost od nich potraviny dovážet závisí na jejich schopnosti je vyvážet.\n\n§YTento národní duch bude odstraněn, pokud bude některá z následujících zemí naším poddaným nebo budeme vlastnit její hlavní město: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] nebo [TNZ.GetNameWithFlag].§!"
 LBA_undeveloped_agriculture_tt: "§RNelze mít §YThe Farmers§! jako §YVnitřní frakce§!§!" # todo: NEW TRANSLATION
 LBA_agricultural_reform: "Zemědělská reforma" # todo: NEW TRANSLATION
 LBA_agricultural_reform_desc: "Zemědělský sektor v Libyi byl reformován. Soukromé vlastnictví půdy je nyní svobodnější a islámské dědické právo již nerozděluje farmy na menší části. Díky novým zdrojům sladké vody z odsolování a GMMR rozvinula Libye své zemědělství na maximum možného s ohledem na svou situaci.\n\n§YTento národní duch bude odstraněn, pokud bude některá z následujících zemí naším poddaným nebo budeme vlastnit její hlavní město: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] nebo [TNZ.GetNameWithFlag].§!"
 LBA_agricultural_imports: "Zemědělské importy" # todo: NEW TRANSLATION
 LBA_agricultural_imports_desc: "Libye výrazně zvýšila množství potravin dovážených do země. Jelikož má jen velmi málo obdělávatelné půdy, vláda místo plýtvání časem a penězi na předem prohraný boj vybudovala vztahy a dodavatelské řetězce pro dovoz potravin.\n\n§YTento národní duch bude odstraněn, pokud bude některá z následujících zemí naším poddaným nebo budeme vlastnit její hlavní město: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] nebo [TNZ.GetNameWithFlag].§!"
 LBA_great_man_made_river_phase2: "Velká umělá řeka - Fáze II" # todo: NEW TRANSLATION
 LBA_great_man_made_river_phase2_desc: "Velká umělá řeka (GMMR) je síť vodovodních trubek, která vedou čerstvou vodu z Nubijské pískovcové akviféry na jihu Libye k pobřeží. Je to největší podzemní síť vodovodů na světě a Muammar Kaddáfí ji pojmenoval 'Osmý div světa'. Momentálně zásobuje města Tripolis, Sirte a Benghazí a voda, kterou poskytuje, je pro všechny Libijce zdarma. Síť byla také propojena s pouštním městem Al-Jawf a další rozšíření je plánováno." # todo: NEW TRANSLATION
 LBA_great_man_made_river_phase3: "Velká umělá řeka - Fáze III" # todo: NEW TRANSLATION
 LBA_great_man_made_river_phase3_desc: "Velká umělá řeka (GMMR) je síť vodovodních trubek, která přivádí čerstvou vodu z Nubijské pískovcové akviféry na jihu Libye na pobřeží. Je to největší podzemní síť vodovodů na světě a Muammar Kaddáfí ji pojmenoval 'Osmý div světa'. Momentálně zásobuje města Tripolis, Sirte a Benghází a voda, kterou poskytuje, je pro všechny Libijce zdarma. Síť byla také propojena s pouštním městem Al-Jawf a další rozšíření je plánováno." # todo: NEW TRANSLATION
 LBA_great_man_made_river_phase41: "Velká umělá řeka - Fáze IV" # todo: NEW TRANSLATION
 LBA_great_man_made_river_phase41_desc: "Velká umělá řeka (GMMR) je síť vodovodních trubek, která přivádí čerstvou vodu z Nubijské pískovcové akviféry na jihu Libye na pobřeží. Je to největší podzemní síť vodovodů na světě a Muammar Kaddáfí ji pojmenoval 'Osmý div světa'. Momentálně zásobuje města Tripolis, Sirte a Benghází a voda, kterou poskytuje, je pro všechny Libijce zdarma. Síť byla také propojena s pouštním městem Al-Jawf, s Tobrukem na východě a s Ghadames na hranici s Algérií, a další rozšíření je plánováno." # todo: NEW TRANSLATION
 LBA_great_man_made_river_phase5: "Velká umělá řeka - Fáze V" # todo: NEW TRANSLATION
 LBA_great_man_made_river_phase5_desc: "Velká umělá řeka (GMMR) je síť vodovodních trubek, která přivádí čerstvou vodu z Nubijské pískovcové akviféry na jihu Libye na pobřeží. Je to největší podzemní síť vodovodů na světě a Muammar Kaddáfí ji pojmenoval 'Osmý div světa'. V současnosti zásobuje města Tripolis, Sirte a Benghází, a voda kterou poskytuje je zdarma pro všechny Libijce. Síť byla také propojena se pouštním městem Al-Jawf, s Tobrukem na východě a s Ghadames na hranici s Algerijí. Potrubní sítě na západě a východě země byly propojeny a GMMR byla oficiálně dokončena." # todo: NEW TRANSLATION
 LBA_revolutionary_guard_corps: "Revoluční gardový sbor" # todo: NEW TRANSLATION
 LBA_revolutionary_guard_corps_desc: "Revoluční gardový sbor je zvláštní složkou libyjské armády tvořenou příslušníky kmenů loajálních Kaddáfímu. Účelem gardového sboru je působit jako protiváha pravidelné armádě. Gardový sbor dokonce kontroluje většinu zásob zbraní a pravidelné armádě vydává zásoby pouze v případě potřeby.\n\n§YTento národní duch bude odstraněn, pokud nám nebude vládnout Kaddáfího rodina.§!"
 LBA_armed_forces_of_arab_jamahiriya: "Ozbrojené síly Libyjské arabské Jamahiríje" # todo: NEW TRANSLATION
 LBA_armed_forces_of_arab_jamahiriya_desc: "Libyjské ozbrojené síly, oficiálně Ozbrojené síly Libyjské arabské Jamahiríje, nahradily Revoluční gardový sbor jako hlavní obrannou organizaci režimu." # todo: NEW TRANSLATION
 LBA_stream_of_refugees: "Tok uprchlíků" # todo: NEW TRANSLATION
 LBA_stream_of_refugees_desc: "Libye je jednou z hlavních tras obchodu s lidmi z Afriky do Evropy. Chudoba ve střední Africe, islamistické povstání v Sahelu a konflikt v Súdánu ženou masy lidí přes libyjskou poušť v naději, že se přeplaví do Evropy. Mnozí z nich však uvíznou v Libyi nebo, což je ještě horší, skončí na dně Středozemního moře.\n\n§YTento národní duch bude odstraněn, pokud budou splněny VŠECHNY následující podmínky:\n - [NGR.GetNameWithFlag] je naším loutkovým státem nebo vlastníme $STATE_329$ a $STATE_1108$\n - [CHA.GetNameWithFlag] je naším loutkovým státem nebo vlastníme $STATE_580$ a $STATE_327$\n - [DAR.GetNameWithFlag] nebo [SUD.GetNameWithFlag] je naším loutkovým státem nebo vlastníme $STATE_614$§!"
 LBA_family_centric: "Rodinně orientovaný" # todo: NEW TRANSLATION
 LBA_family_centric_desc: "Podporujeme rodiny jako hlavní stavební kámen společnosti." # todo: NEW TRANSLATION
 LBA_nation_centric: "Národně orientovaný" # todo: NEW TRANSLATION
 LBA_nation_centric_desc: "Podporujeme národ jako hlavní stavební kámen společnosti." # todo: NEW TRANSLATION
 LBA_religion_in_schools: "Náboženské vzdělávání" # todo: NEW TRANSLATION
 LBA_religion_in_schools_desc: "Náš vzdělávací systém úzce začleňuje náboženství do kurikula." # todo: NEW TRANSLATION
 LBA_nationalism_in_schools: "Nacionalistické vzdělávání" # todo: NEW TRANSLATION
 LBA_nationalism_in_schools_desc: "Náš vzdělávací systém důkladně integruje nacionalismus do učebních osnov." # todo: NEW TRANSLATION
 LBA_grand_mufti_appointed: "Hlavní muftí Libie" # todo: NEW TRANSLATION
 LBA_grand_mufti_appointed_desc: "Byl jmenován hlavní muftí, který bude vykládat islámské právo v Libii." # todo: NEW TRANSLATION
 LBA_mujahideen_of_libya_idea: "Mujahedíni Libie" # todo: NEW TRANSLATION
 LBA_mujahideen_of_libya_idea_desc: "Libyjští veteráni mudžáhidů z Afghánistánu získali v Libyi značnou mocenskou pozici.\n\n§YTento národní duch bude odstraněn, pokud nebudeme salafističtí§!"
 LBA_tanasoh_tv_idea: "Tanasoh TV" # todo: NEW TRANSLATION
 LBA_tanasoh_tv_idea_desc: "Byla zřízena celostátní televizní síť, která šíří poselství velkého muftího.\n\n§YTento národní duch bude odstraněn, pokud nebudeme salafističtí§!"
 LBA_supreme_revolutionaries_council_idea: "Nejvyšší revoluční rada" # todo: NEW TRANSLATION
 LBA_supreme_revolutionaries_council_idea_desc: "Poradní rada velkého muftího.\n\n§YTento národní duch bude odstraněn, pokud nebudeme salafističtí§!"
 LBA_immigration_target: "Imigrační kampaň" # todo: NEW TRANSLATION
 libya_baathism_dynamic_modifier: "Libyjský Ba'athismus" # todo: NEW TRANSLATION
 libya_baathism_dynamic_modifier_desc: "Libyjský režim využívá ve svůj prospěch tajnou síť baasistů.\n\n§YTento národní duch bude odstraněn, pokud Libyjské národní hnutí nebude součástí vládní koalice.§!"
 LBA_mauritanian_military_infiltrated: "Mauritánská armáda infilrovaná" # todo: NEW TRANSLATION
 LBA_mauritanian_military_infiltrated_desc: "S pomocí podporovatelů Ba'ath strany Libie infilrovala mauritánskou armádu." # todo: NEW TRANSLATION
 LBA_new_green_book: "Nová Zelená kniha" # todo: NEW TRANSLATION
 LBA_new_green_book_desc: "Muammar Kaddáfí přepracoval svou Zelenou knihu do nové verze. Kniha je distribuována všem občanům a vyučována ve všech školách, aby lidé dodržovali správné myšlenky. Uvedení knihy bude mít trvalý dopad na libyjskou společnost." # todo: NEW TRANSLATION
 LBA_grassroots_democracy_idea: "Demokracie odspodu" # todo: NEW TRANSLATION
 LBA_grassroots_democracy_idea_desc: "Libyjskému lidu byla dána možnost zapojit se do demokratického procesu zdola nahoru.\n\n§YTento národní duch bude odstraněn, pokud nebudeme mít volby.§!"
 LBA_royal_family_returned: "Návrat rodu Senussi" # todo: NEW TRANSLATION
 LBA_royal_family_returned_desc: "Příbuzní sesazeného krále Idrise I. byli po desetiletích exilu opět povoleni k návratu do Libie." # todo: NEW TRANSLATION
 LBA_royal_family_returned_2: "Senussi s volebním právem" # todo: NEW TRANSLATION
 LBA_royal_family_returned_2_desc: "Příbuzní sesazeného krále Idrise I. byli opět povoleni k návratu do Libie po desetiletích exilu. Nyní dostávají roční stipendium od libyjské vlády na správu královského domu." # todo: NEW TRANSLATION
 LBA_confiscated_royal_wealth: "Konfiskované královské bohatství" # todo: NEW TRANSLATION
 LBA_confiscated_royal_wealth_desc: "Majetek libyjské královské rodiny byl zabaven za účelem financování libyjského státu.\n\n§YTento národní duch bude odstraněn, pokud bude rod Senussiů součástí vládní koalice.§!"
 LBA_strong_president: "Prezidentská republika" # todo: NEW TRANSLATION
 LBA_strong_president_desc: "Libye přijala prezidentskou republiku francouzského typu jako svou formu vlády.\n\n§YTento národní duch bude odstraněn, pokud bude u moci rod Senussiů nebo budeme salafističtí.§!"
 LBA_unitary_presidential_republic: "Jednotná prezidentská republika" # todo: NEW TRANSLATION
 LBA_unitary_presidential_republic_desc: "Libye byla reformována na unitární prezidentskou republiku podle francouzského modelu vlády.\n\n§YTento národní duch bude odstraněn, pokud bude u moci rod Senussiů nebo budeme salafističtí.§!"
 LBA_constitutional_monarchy: "Ústavní monarchie" # todo: NEW TRANSLATION
 LBA_constitutional_monarchy_desc: "Libye byla reformována na konstituční monarchii, v níž většina pravomocí spočívá v rukou voleného zákonodárného sboru.\n\n§YTento národní duch bude odstraněn, pokud nebudeme mít volby nebo budeme salafističtí.§!"
 LBA_unitary_constitutional_monarchy: "Jednotná ústavní monarchie" # todo: NEW TRANSLATION
 LBA_unitary_constitutional_monarchy_desc: "Libye byla reformována na unitární konstituční monarchii, v níž většina pravomocí spočívá v rukou voleného zákonodárného sboru.\n\n§YTento národní duch bude odstraněn, pokud nebudeme mít volby nebo budeme salafističtí.§!"
 LBA_minorities_granted_rights: "Federální prezidentská republika" # todo: NEW TRANSLATION
 LBA_minorities_granted_rights_desc: "Menšinám v Libyi byla za současné vlády poskytnuta omezená autonomie, přičemž země je nadále spravována jako prezidentská republika.\n\n§YTento národní duch bude odstraněn, pokud bude u moci rod Senussiů nebo budeme salafističtí.§!"
 LBA_minorities_protected: "Chráněné menšiny" # todo: NEW TRANSLATION
 LBA_minorities_protected_desc: "Libyjská vláda přislíbila, že etnické menšiny budou respektovány a budou si moci zachovat své kulturní dědictví.\n\n§YTento národní duch bude odstraněn, pokud budeme nacionalističtí nebo salafističtí.§!"
 LBA_senussi_order: "Obnovený řád Senussi" # todo: NEW TRANSLATION
 LBA_senussi_order_desc: "Náboženský řád Senussiů byl v Libyi obnoven. Hlásá střední cestu mezi mystickým súfismem a extremistickým sunnitským islámem a jedním z hlavních principů řádu je, že každý by měl pracovat na své obživě a nespoléhat se na charitu.\n\n§YTento národní duch bude odstraněn, pokud budeme salafističtí.§!"
 LBA_anti_air_improvements: "Zaměření na protivzdušnou obranu" # todo: NEW TRANSLATION
 LBA_anti_air_improvements_desc: "Libie zaměřuje svůj vojenský výzkum a vývoj na zlepšení protivzdušné obrany." # todo: NEW TRANSLATION
 LBA_improved_fighter_response: "Vylepšená reakce stíhačů" # todo: NEW TRANSLATION
 LBA_improved_fighter_response_desc: "Libyjské letectvo věnuje značnou část výcviku nácviku reakce a doby vzletu svých stíhacích letounů."
 LBA_guerrilla_toyotas: "Válka Toyoty – partyzánská válka" # todo: NEW TRANSLATION
 LBA_guerrilla_toyotas_desc: "Libyjská armáda analyzovala zkušenosti z Chadsko-libijské války (známé také jako Toyota War) a naučila se z nich. Nyní budou věnovat větší pozornost vojenským taktikám používaným Čadem, který svými mobilními technikami snadno obcházel libyjská obranná opatření a útočil ze zad." # todo: NEW TRANSLATION
 LBA_mobile_toyotas: "Válka Toyoty – mobilita" # todo: NEW TRANSLATION
 LBA_mobile_toyotas_desc: "Libyjská armáda analyzovala zkušenosti z Chadsko-libijské války (známé také jako Toyota War) a naučila se z nich. Nyní budou věnovat větší pozornost vojenským taktikám používaným Čadem, který svými mobilními technikami snadno obcházel libyjská uskupení, obrany a dokonce i minová pole." # todo: NEW TRANSLATION
 LBA_desert_warfare_idea: "Mistři pouštního boje" # todo: NEW TRANSLATION
 LBA_desert_warfare_idea_desc: "Libyjská armáda dokázala zvládnout umění boje v poušti a v horku." # todo: NEW TRANSLATION
 LBA_egypt_war_specops: "Specializace na komando" # todo: NEW TRANSLATION
 LBA_egypt_war_specops_desc: "Po analýze minulých konfliktů se Libyjská armáda reforemovala do více orientované na komando, se zaměřením na speciální jednotky útočící na zadní linie nepřítele." # todo: NEW TRANSLATION
 LBA_egypt_war_armour: "Mechanizovaná specializace" # todo: NEW TRANSLATION
 LBA_egypt_war_armour_desc: "Po analýze minulých konfliktů se Libyjská armáda přeorientovala na mechanizovanou sílu, se zaměřením na obrněná bojová vozidla, která budou vést průchod nepřátelskými liniemi." # todo: NEW TRANSLATION
 LBA_foreign_procurement_boosted: "Vylepšené zajišťování dodávek" # todo: NEW TRANSLATION
 LBA_foreign_procurement_boosted_desc: "Libyjská vláda se pustila do masivního nakupování zahraniční výstroje poté, co byly zrušeny sankce na zbraně." # todo: NEW TRANSLATION
 LBA_libyan_gauge_railroads: "Libyjský rozchod" # todo: NEW TRANSLATION
 LBA_libyan_gauge_railroads_desc: "Libie přijala svůj vlastní unikátní rozchod železnice. To ztíží obsazení a kontrolu Libyjských územ jakoukoli nepřátelskou zemí, protože jejich železniční zařízení nebude kompatibilní." # todo: NEW TRANSLATION
 LBA_state_supported_railways: "Státem financované železnice" # todo: NEW TRANSLATION
 LBA_state_supported_railways_desc: "V důsledku vytvoření nové železniční sítě v Libii jsou většina nákladů kryta centrální vládou. Nedostatečné využití pro civilní a průmyslovou dopravu je stále příliš nízké na udržitelnost." # todo: NEW TRANSLATION
 LBA_state_supported_railways_functional: "Státem financované železnice" # todo: NEW TRANSLATION
 LBA_state_supported_railways_functional_desc: "Nová železniční síť v Libii dosáhla provozuschopného stavu. Kvůli nízkému využití vláda stále musí pokrýt některé náklady, ale existuje alespoň základ pro budoucí růst." # todo: NEW TRANSLATION
 LBA_railroad_connection_to_neighbour: "Železniční spojení do Libie" # todo: NEW TRANSLATION
 LBA_railroad_connection_to_neighbour_desc: "Byla vybudována železnice spojující [ROOT.GetNameDef] s [LBA.GetNameDef]. Zvýšená propojenost posiluje ekonomiku země." # todo: NEW TRANSLATION
 LBA_increased_tourism_1: "Turistický boom" # todo: NEW TRANSLATION
 LBA_increased_tourism_1_desc: "Libie intenzivně investuje do lákání turistů, aby navštívili zemi a podívali se na různá místa v zemi.\n\n§YIf we are at war, we will suffer negative modifiers to our tax gain and construction speed§!" # todo: NEW TRANSLATION
 LBA_increased_tourism_1_war: "Útěk turistů" # todo: NEW TRANSLATION
 LBA_increased_tourism_1_war_desc: "Kvůli probíhajícímu konfliktu v Libii turisté zemi vyhýbají jako mor. To mělo významný dopad na ekonomiku země, protože se stala více závislou na turistice." # todo: NEW TRANSLATION
 LBA_housing_terrorists: "Poskytování útočiště teroristům" # todo: NEW TRANSLATION
 LBA_housing_terrorists_desc: "Libie poskytuje útočiště bojovníkům různých teroristických organizací a dokonce je rekrutuje do svých ozbrojených sil." # todo: NEW TRANSLATION
 LBA_treaty_of_benghazi: "Dohoda z Benghází" # todo: NEW TRANSLATION
 LBA_treaty_of_benghazi_desc: "Itálie a Libye se dohodly na společném hlídkování libyjského pobřeží s cílem omezit nelegální migraci do Evropy. Evropa také Libyi pomůže využitím družic ke sledování libyjské pozemní hranice. Itálie na oplátku souhlasila s vyplacením odškodnění Libyi za škody způsobené kolonialismem.\n\n§YTento národní duch bude odstraněn, pokud budeme ve válce s Itálií.§!"
 LBA_trade_with_italy: "Italský obchod" # todo: NEW TRANSLATION
 LBA_trade_with_italy_desc: "Přátelské vztahy mezi Itálií a Libyí umožňují Libyi efektivněji prodávat své uhlovodíky do Evropy.\n\n§YTento národní duch bude odstraněn, pokud budeme ve válce s Itálií.§!"
 LBA_libyan_sea_secured: "Ovládnutí Libyjského moře" # todo: NEW TRANSLATION
 LBA_libyan_sea_secured_desc: "Ovládnutím Malty a Kréty si Libie zajistila pobřeží proti nepřátelské invazi." # todo: NEW TRANSLATION
 LBA_chad_trade_deal_chad: "Obchod s bavlnou s Libie" # todo: NEW TRANSLATION
 LBA_chad_trade_deal_chad_desc: "Čad vyjednal obchodní dohodu na vývoz bavlny do Libie. Vývoz bavlny do bohatší země začíná posilovat Čadovu ekonomiku." # todo: NEW TRANSLATION
 LBA_chad_trade_deal_libya: "Obchod s bavlnou s Čadem" # todo: NEW TRANSLATION
 LBA_chad_trade_deal_libya_desc: "Líbie uzavřela obchodní dohodu s Čadem o dovoz vysoce kvalitní bavlny do Líbie. To zvýšilo prodej oblečení v Líbii, neboť vysoce kvalitní bavlna má také určité omezené vojenské využití." # todo: NEW TRANSLATION
 LBA_jewish_migration: "Židovská migrace" # todo: NEW TRANSLATION
 LBA_jewish_migration_desc: "Libye umožnila vyhnaným Židům vrátit se do země a některým z nich dokonce nabídla odškodnění.\n\n§YTento národní duch bude odstraněn, pokud budeme ve válce s Izraelem.§!"
 LBA_champion_of_al_aqsa_idea: "Šampion Al-Aksá" # todo: NEW TRANSLATION
 LBA_champion_of_al_aqsa_idea_desc: "Díky kontrole nad mešitou al-Aksá se Libye stala vlivným majákem pro všechny muslimy.\n\n§YTento národní duch bude odstraněn, pokud Jeruzalém nebude v našem vlastnictví, nebude naším poddaným nebo spojencem.§!"
 LBA_support_mengistu: "Mengistu Mediální kampaň" # todo: NEW TRANSLATION
 LBA_support_mengistu_desc: "Líbie zorganizovala mediální kampaň na podporu vyhnaného diktátora Mengistu, jejím cílem je přesvědčit svět o jeho nevině v probíhajícím genocidním procesu." # todo: NEW TRANSLATION
 LBA_islamic_legion_idea: "Islámská legie" # todo: NEW TRANSLATION
 LBA_islamic_legion_idea_desc: "Libye obnovila Islámskou legii, sílu určenou k tomu, aby působila jako Kaddáfího zástupce v různých konfliktech po celém světě.\n\n§YTento národní duch bude odstraněn, pokud Libyi nebude vládnout Kaddáfí.§!"
 LBA_employing_charles_taylor: "Charles Taylor" # todo: NEW TRANSLATION
 LBA_employing_charles_taylor_desc: "Libyjská vláda využila služeb exilového Charlese Taylora. Tento zkušený vůdce geril pomáhá libyjským bezpečnostním složkám zvládat možné povstání.\n\n§YTento národní duch bude odstraněn, pokud Libyi nebude vládnout Kaddáfí.§!"
 LBA_ethiopia_somali_resistance: "Ogaden Odboj" # todo: NEW TRANSLATION
 LBA_ethiopia_somali_resistance_desc: "Somálské klany v regionu Ogaden vedou povstání proti etiopským vládcům." # todo: NEW TRANSLATION
 LBA_hakem_al_mutairi: "Hakem Al-Mutairi" # todo: NEW TRANSLATION
 LBA_hakem_al_mutairi_desc: "Kaddáfí využívá služeb Hakema Al-Mutairiho, kuvajtského duchovního a vůdce strany Ummah, aby rozšířil libyjský vliv v oblasti Perského zálivu.\n\n§YTento národní duch bude odstraněn, pokud Libyi nebude vládnout Kaddáfí.§!"
 LBA_nationalised_economy_1: "Státně řízená ekonomika" # todo: NEW TRANSLATION
 LBA_nationalised_economy_1_desc: "Líbie sleduje ekonomický model, ve kterém je většina průmyslu v zemi ve vlastnictví státu, nebo alespoň pod jeho silnou kontrolou." # todo: NEW TRANSLATION
 LBA_privatised_economy_1: "Privatizovaná ekonomika" # todo: NEW TRANSLATION
 LBA_privatised_economy_1_desc: "Po desetiletích vládní kontroly Líbye zahájila privatizaci velkých sektorů své ekonomiky, což vedlo ke zvýšení hospodářského růstu." # todo: NEW TRANSLATION
 LBA_humbled_the_un: "Ponížen OSN" # todo: NEW TRANSLATION
 LBA_humbled_the_un_desc: "Gaddáfího ostrý projev na OSN uvedl Libii do světla reflektorů, čímž světu ukázal, že s Libyí si není radno zahrávat." # todo: NEW TRANSLATION
 LBA_humbled_by_the_un: "Ponižen OSN" # todo: NEW TRANSLATION
 LBA_humbled_by_the_un_desc: "Muammar Gaddáfího ostný projev na OSN byl zesměšněn, když byl vypískán z pódia. Zdá se, že Gaddáfí není tak karizmatický, jak si myslí." # todo: NEW TRANSLATION
 LBA_people_motivated_to_work: "Lidé motivovaní k práci" # todo: NEW TRANSLATION
 LBA_people_motivated_to_work_desc: "Gaddáfího poslední trik házením peněz po ulicích Tripolisu motivuje lidi k tomu, že mezinárodní humanitární agentury a charity nejsou nic jiného než podvody, které chtějí lidi nalákat na peníze. Nyní tvrdě pracují, aby už nikdy nemuseli žebrat o peníze." # todo: NEW TRANSLATION
 LBA_people_unmotivated_to_work: "Lidé nemotivovaní k práci" # todo: NEW TRANSLATION
 LBA_people_unmotivated_to_work_desc: "Gaddáfího poslední trik házení peněz po ulicích Tripolisu se mu vymstil. Lidé už nechtějí pracovat, ale jen sedí doma a čekají na dar." # todo: NEW TRANSLATION
 LBA_gaddafis_car_rocket: "Raketa" # todo: NEW TRANSLATION
 LBA_gaddafis_car_rocket_desc: "Líbie zahájila masovou výrobu domácího automobilového návrhu; Raketa. Tvar klínu, vybavená airbagy, run-flat pneumatikami, automatickým vypínáním paliva, absorbčními nárazníky a mnoha dalšími bezpečnostními prvky, je vůz označován (alespoň podle vůdce Libye Gaddáfího) za nejbezpečnější auto na světě." # todo: NEW TRANSLATION
 LBA_gaddafis_car_bucket: "Kbelík" # todo: NEW TRANSLATION
 LBA_gaddafis_car_bucket_desc: "Líbie zahájila masovou výrobu domácího automobilového návrhu; Kbelík. Vyráběn z levných materiálů, s otevřenými bočnicemi místo dveří, většina panelů z levného duroplastu a s elektrickým motorem, Muammar Gaddáfí označuje svůj nový vynález za skutečné lidové auto." # todo: NEW TRANSLATION
 LBA_gaddafis_car_packet: "Balík" # todo: NEW TRANSLATION
 LBA_gaddafis_car_packet_desc: "Líbie zahájila masovou výrobu domácího automobilového návrhu; Balík. Odolný nákladní pick-up přímo zkopírovaný z Toyota Hilux. Určený pro vojenské i civilní použití, vozidlo má neprůstřelná okna, pancéřování vpředu a zesílené pneumatiky. Auto je skutečným víceúčelovým vozidlem." # todo: NEW TRANSLATION
 LBA_gaddafis_car_increased_road_fatalities: "Zvýšené dopravní úmrtí" # todo: NEW TRANSLATION
 LBA_gaddafis_car_increased_road_fatalities_desc: "Gaddáfího zničující pokus o navržení libyjského domácího vozidla zanechal Libijce podezřívavé vůči novým automobilům. Lidé kupují stále starší vozidla v naději, že se vyhnou novým. To vedlo k velkému nárůstu dopravních nehod a úmrtí." # todo: NEW TRANSLATION
 LBA_show_of_greatness: "Ukázka velikosti" # todo: NEW TRANSLATION
 LBA_show_of_greatness_desc: "Nedávná státní návštěva vůdce Libye Muammara Gaddáfího v zahraničí ohromila lidi jak v zahraničí, tak doma. Gaddáfího postavení ve světě se výrazně zvýšilo." # todo: NEW TRANSLATION
 LBA_show_of_failure: "Ukázka selhání" # todo: NEW TRANSLATION
 LBA_show_of_failure_desc: "Nedávná státní návštěva Muammara Gaddáfího v zahraničí ho na mezinárodní i domácí scéně ponížila." # todo: NEW TRANSLATION
 LBA_good_juju: "Dobré juju" # todo: NEW TRANSLATION
 LBA_good_juju_desc: "Pomocí černé magie motivuje Muammar Gaddáfí své vojáky k boji za obranu Libye." # todo: NEW TRANSLATION
 LBA_bad_juju: "Špatné juju" # todo: NEW TRANSLATION
 LBA_bad_juju_desc: "S neúspěchem rituálu černé magie ztratili Gaddáfího vojáci víru v vedení svého vůdce." # todo: NEW TRANSLATION
 LBA_emancipator_of_women: "Osvoboditel žen" # todo: NEW TRANSLATION
 LBA_emancipator_of_women_desc: "Gaddáfího poslední přednáška o islámu pro skupinu žen v Itálii vyvolala masovou konverzi žen k islámu a migraci do Líbie." # todo: NEW TRANSLATION
 LBA_oppressor_of_women: "Utlačovatel žen" # todo: NEW TRANSLATION
 LBA_oppressor_of_women_desc: "Gaddáfího poslední přednáška o islámu pro skupinu žen v Itálii vedla lidi k vidění velkého vůdce jako jen utlačovatele žen. Lidé opouštějí Líbií ve velkém, protože nechtějí žít v zemi řízené takovým mužem." # todo: NEW TRANSLATION
 LBA_green_resistance_1: "Zelené hnutí" # todo: NEW TRANSLATION
 LBA_green_resistance_1_desc: "Zelený odpor neboli kaddáfíovská loajalita je v Libyi stále silná. Současný autokrat jej využívá k posílení svých sil.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] nebo [Nat_Fascism_L]§!"
 LBA_green_resistance_2: "Gaddáfovští loajalisté" # todo: NEW TRANSLATION
 LBA_green_resistance_2_desc: "Vláda místo jejich likvidace zaměstnala ve své správě a armádě Kaddáfího loajalisty v naději, že jejich loajalita pro ně bude dostatečnou odměnou.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] nebo [Nat_Fascism_L]§!"
 LBA_green_resistance_3: "Pozůstatky starého režimu" # todo: NEW TRANSLATION
 LBA_green_resistance_3_desc: "Libyjská vláda plně využívá Zelený odpor neboli kaddáfíovskou loajalitu, když začíná budovat Libyi podle svého obrazu.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] nebo [Nat_Fascism_L]§!"
 LBA_moderated_quran_and_sunnah: "Umírněný Korán a Sunna" # todo: NEW TRANSLATION
 LBA_moderated_quran_and_sunnah_desc: "Vládnoucí establishment se rozhodl cenzurovat a mírnit některé extrémnější názory, které lidé šíří o Koránu a sunně, v naději, že omezí přítomnost radikálnějších názorů.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] nebo [Nat_Fascism_L]§!"
 LBA_loyalist_purges: "Čistky loajalistů" # todo: NEW TRANSLATION
 LBA_loyalist_purges_desc: "Gaddáfovští loajalisté a bývalí příznivci byli vyčištěni z libyjské správy. Lidem byla slíbena změna a vítají ji." # todo: NEW TRANSLATION
 LBA_ramadan_asswehly_remembrance: "Vzpomínka na Ramadana Asswehlyho" # todo: NEW TRANSLATION
 LBA_ramadan_asswehly_remembrance_desc: "Ramadan Asswehly byl jedním ze zakládajících členů Tripolské republiky. Jak se Libye obrací k demokracii, vzpomíná na své hrdiny.\n\n§RTento národní duch bude odstraněn, pokud nebudeme mít volby!§!"
 LBA_tribal_assembly_created: "Kmenová rada" # todo: NEW TRANSLATION
 LBA_tribal_assembly_created_desc: "Libye vytvořila kmenovou radu, jejíž povinnosti zahrnují řešení konfliktů mezi kmeny a dohled nad vládou s cílem odhalit možné zneužívání moci nebo špatné zacházení.\n\n§RTento národní duch bude odstraněn, pokud nebudeme mít volby!§!"
 LBA_tripolitania_elite_soldiers: "Elitní síly Tripolitanie" # todo: NEW TRANSLATION
 LBA_tripolitania_elite_soldiers_desc: "Tripolští obyvatelé jsou hromadně verbováni do nové libyjské armády.\n\n§RTento národní duch bude odstraněn, pokud bude existovat [TRP.GetNameWithFlag]§!"
 LBA_cyrenaican_oil_expertise: "Odbornost v ropném průmyslu Kyrenaiky" # todo: NEW TRANSLATION
 LBA_cyrenaican_oil_expertise_desc: "Libyjská vláda využívá veškeré znalosti o těžbě ropy, které mají Kyrenaikové.\n\n§RTento národní duch bude odstraněn, pokud bude existovat [CYR.GetNameWithFlag]§!"
 LBA_fezzani_desert_expertise: "Fezzanské karavany" # todo: NEW TRANSLATION
 LBA_fezzani_desert_expertise_desc: "Libyjská armáda využívá znalosti Fezzánců o cestování pouští a cvičí své vojáky, aby přežili s minimem jídla a vody.\n\n§RTento národní duch bude odstraněn, pokud bude existovat [FEZ.GetNameWithFlag]§!"
 LBA_tribal_union: "Kmenové sjednocení" # todo: NEW TRANSLATION
 LBA_tribal_union_desc: "Libyjská vláda dokázala potlačit separatistické myšlenky v zemi tím, že využila rozdíly mezi kmeny ve svůj prospěch.\n\n§RTento národní duch bude odstraněn, pokud bude existovat [TRP.GetNameWithFlag], [CYR.GetNameWithFlag] nebo [FEZ.GetNameWithFlag]§!"
 LBA_multiple_parties_in_cabinet: "Více-stranný kabinet" # todo: NEW TRANSLATION
 LBA_multiple_parties_in_cabinet_desc: "Aby se snížilo napětí, libyjská vládnoucí strana pozvala do vlády několik menších stran. Doufá, že tím omezí politické rozdělení země.\n\nTento národní duch bude odstraněn, pokud nebudeme mít volby nebo nebudeme v koalici s jinou stranou."
 LBA_guaranteed_freedom: "Zaručené svobody" # todo: NEW TRANSLATION
 LBA_guaranteed_freedom_desc: "Nová libyjská vláda slíbila svobodu všem lidem bez ohledu na etnicitu, rasu či pohlaví." # todo: NEW TRANSLATION
 LBA_private_agriculture_encouraged: "Podpora soukromého zemědělství" # todo: NEW TRANSLATION
 LBA_private_agriculture_encouraged_desc: "Vláda povzbuzuje malé farmáře a majitele půdy, aby rozšiřovali své pozemky a získávali více půdy." # todo: NEW TRANSLATION
 LBA_indian_workers: "Indičtí dělníci" # todo: NEW TRANSLATION
 LBA_indian_workers_desc: "Indičtí migrující pracovníci byli najati do libyjských továren, aby vykompenzovali nízký počet obyvatel země.\n\n§RTento národní duch bude odstraněn, pokud [RAJ.GetNameDef] nebude existovat nebo s ním budeme ve válce.§!"
 LBA_swiss_financial_advisors: "Švýcarští finanční poradci" # todo: NEW TRANSLATION
 LBA_swiss_financial_advisors_desc: "Švýcarští finanční poradci byli najati, aby vládě radili s optimalizací hospodářského růstu.\n\n§RTento národní duch bude odstraněn, pokud [SWI.GetNameDef] nebude existovat nebo s ním budeme ve válce.§!"
 LBA_french_nuclear_support: "Francouzská podpora jaderné energie" # todo: NEW TRANSLATION
 LBA_french_nuclear_support_desc: "Francouzské energetické společnosti pomáhají Libyi na cestě k vybudování vlastního jaderného energetického průmyslu.\n\n§RTento národní duch bude odstraněn, pokud [FRA.GetNameDef] nebude existovat nebo s ním budeme ve válce.§!"
 LBA_gaddafist_military: "Gaddáfovská armáda" # todo: NEW TRANSLATION
 LBA_gaddafist_military_desc: "Libyjská armáda je plná lidí, kteří byli za Kaddáfího součástí armády. Armáda může využít jejich zkušeností.\n\n§RTento národní duch bude odstraněn, pokud budeme mít $no_military$§!"
 LBA_free_officers_movement: "Hnutí svobodných důstojníků" # todo: NEW TRANSLATION
 LBA_free_officers_movement_desc: "Stejně jako v roce 1969 svrhli důstojníci libyjské armády své zkorumpované vládce.\n\n§RTento národní duch bude odstraněn, pokud nebudeme nacionalističtí§!"
 LBA_islamist_crackdown: "Tvrdé potlačení islamistů" # todo: NEW TRANSLATION
 LBA_islamist_crackdown_desc: "Vláda zaujala tvrdý postoj vůči každé straně nebo skupině, která hovoří o šaríi nebo nadřazenosti islámu.\n\n§RTento národní duch bude odstraněn, pokud budeme salafističtí nebo nám bude vládnout [Neutral_Muslim_Brotherhood_L]§!"
 LBA_islamist_cooperation: "Spolupráce s islamisty" # todo: NEW TRANSLATION
 LBA_islamist_cooperation_desc: "Vláda zaujala shovívavý přístup vůči islamistickým milicím a na určité úrovni s nimi dokonce spolupracuje." # todo: NEW TRANSLATION
 LBA_turkish_drone_support: "Turecká podpora dronů" # todo: NEW TRANSLATION
 LBA_turkish_drone_support_desc: "Libyjská vláda spolupracuje s Tureckem na modernizaci svých zásob dronů.\n\n§RTento národní duch bude odstraněn, pokud [TUR.GetNameDef] nebude existovat nebo s ním budeme ve válce.§!"
 LBA_military_crackdown_modifier: "Vojenské potlačení" # todo: NEW TRANSLATION
 LBA_military_as_workforce_modifier: "Armáda jako pracovní síla" # todo: NEW TRANSLATION
 LBA_military_as_security_modifier: "Dodatečná bezpečnost ropných polí" # todo: NEW TRANSLATION
 LBA_special_economic_zone: "Speciální ekonomická zóna" # todo: NEW TRANSLATION
 LBA_minimum_wage_centralised: "Vynucená minimální mzda" # todo: NEW TRANSLATION
 LBA_minimum_wage_centralised_desc: "Vláda vynucuje úroveň minimální mzdy v naději podpořit domácí spotřebu a snížit zátěž na sociální služby." # todo: NEW TRANSLATION
 LBA_private_insurance_centralised: "Poskytování soukromého zdravotního pojištění" # todo: NEW TRANSLATION
 LBA_private_insurance_centralised_desc: "Zdravotnický systém byl posílen zavedením soukromého zdravotního pojištění. To znamená, že zákazník musí za poskytování zdravotní péče utrácet méně, ale lidé musí své peníze vynakládat na soukromé pojištění.\n\n§RTento národní duch bude odstraněn, pokud budeme mít $health_05$ nebo $health_06$§!"
 LBA_dinar_tied_to_dollar: "Dinar vázaný na dolar" # todo: NEW TRANSLATION
 LBA_dinar_tied_to_dollar_desc: "Libyjský dinár byl navázán na americký dolar v naději, že libyjské zboží bude na zahraničních trzích konkurenceschopnější.\n\n§RTento národní duch bude odstraněn, pokud [USA.GetNameDef]nebude existovat§!"
 LBA_chinese_construction: "Čínské stavební společnosti" # todo: NEW TRANSLATION
 LBA_chinese_construction_desc: "Libyjský stát najal čínské stavební společnosti, aby vybudovaly jeho infrastrukturu.\n\n§RTento národní duch bude odstraněn, pokud [CHI.GetNameDef] nebude existovat nebo s ním budeme ve válce§!"
 LBA_protected_middle_class: "Chráněná střední třída" # todo: NEW TRANSLATION
 LBA_protected_middle_class_desc: "Libyjská vláda se rozhodla podporovat střední třídu, lidi s relativním komfortem." # todo: NEW TRANSLATION
 LBA_protected_lower_class: "Chráněná nižší třída" # todo: NEW TRANSLATION
 LBA_protected_lower_class_desc: "Libyjská vláda se rozhodla podporovat nižší třídu, lidi, kteří vykonávají většinu manuální práce v zemi." # todo: NEW TRANSLATION
 LBA_marxism_leninism_adopted: "Přijetí marxismu-leninismu" # todo: NEW TRANSLATION
 LBA_marxism_leninism_adopted_desc: "Vláda začala v každodenní správě přijímat marxisticko-leninskou politiku.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] nebo [Neutral_Communism_L]§!"
 LBA_afrosocialism_adopted: "Přijetí afrosocialistické ideologie" # todo: NEW TRANSLATION
 LBA_afrosocialism_adopted_desc: "Vláda začala v každodenní správě přijímat afrosocialistickou politiku.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] nebo [Neutral_Communism_L]§!"
 LBA_eurocommunism_adopted: "Přijetí eurokomunistické ideologie" # todo: NEW TRANSLATION
 LBA_eurocommunism_adopted_desc: "Vláda začala v každodenní správě přijímat eurokomunistickou politiku.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] nebo [Neutral_Communism_L]§!"
 LBA_women_enfrachised: "Zmocnění žen" # todo: NEW TRANSLATION
 LBA_women_enfrachised_desc: "Libyjská vláda zaujala stanovisko k posílení postavení žen v zemi.\n\n§RTento národní duch bude odstraněn, pokud budeme salafističtí nebo nám bude vládnout [Neutral_Muslim_Brotherhood_L]§!"
 LBA_nordic_model_followed: "Nordická sociální demokracie" # todo: NEW TRANSLATION
 LBA_nordic_model_followed_desc: "Libyjská vláda se snaží v Libyi znovu vytvořit severský model sociálního státu.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] nebo [Neutral_Communism_L]§!"
 LBA_workers_republic_created: "Vytvoření republiky dělníků" # todo: NEW TRANSLATION
 LBA_workers_republic_created_desc: "Libyjská vláda vytvořila dělnickou republiku ve snaze vytvořit dělnický ráj.\n\n§RTento národní duch bude odstraněn, pokud nám nebude vládnout [socialism_L], [Communist-State_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] nebo [Neutral_Communism_L]§!" # todo: NEW TRANSLATION
 LBA_european_tech_companies: "Spolupráce s evropskými technologickými firmami" # todo: NEW TRANSLATION
 LBA_european_tech_companies_desc: "Libye spolupracuje s evropskými technologickými společnostmi, aby jí pomohly zlepšit technologický rozvoj.\n\n§RTento národní duch bude odstraněn, pokud budeme ve válce s kteroukoli zemí EU§!"
 LBA_polygamy_allowed: "Polygamie povolena" # todo: NEW TRANSLATION
 LBA_polygamy_allowed_desc: "Libye povolila polygamii v naději, že zvýší populační růst.\n\n§RTento národní duch bude odstraněn, pokud bude hodnota naší sociální konzervativnosti – vlády nižší než 50 %§!"
 LBA_ali_al_sallabi_sponsored: "Sponzorování knih Aliho al-Sallabiho" # todo: NEW TRANSLATION
 LBA_ali_al_sallabi_sponsored_desc: "Libyjská vláda oficiálně schválila knihy Aliho al-Sallabiho o islámu a sponzoruje jejich šíření po světě." # todo: NEW TRANSLATION
 LBA_tuareg_militias_in_country: "Tuaregské milice" # todo: NEW TRANSLATION
 LBA_tuareg_militias_in_country_desc: "Tuaregské milice operují na jihozápadě země. Tuaregové z Mali, Alžírska a Nigeru přecházejí hranice, aby se připojili k boji. Údajně nám pomáhají porazit nepřátele, ale jejich loajalita může ležet jinde." # todo: NEW TRANSLATION
 LBA_toubou_militias_in_country: "Toubouské milice" # todo: NEW TRANSLATION
 LBA_toubou_militias_in_country_desc: "Toubouské milice operují na jižních částech země. I když nejsou příliš početné, jejich vojenské operace snížily tok migrantů ze Střední Afriky." # todo: NEW TRANSLATION
 LBA_tribal_militias: "Kmenové milice" # todo: NEW TRANSLATION
 LBA_tribal_militias_desc: "Jak občanská válka zuří a bezpečnost v zemi klesá, stále více kmenů se mobilizuje a vytváří vlastní milice, aby chránily členy kmene nebo podpořily povstalce. I když jejich milice posilují naše síly, vytváří to vrstvu nejistoty, protože snižuje kontrolu rebelů nad zemí." # todo: NEW TRANSLATION
 LBA_jihadist_militias: "Džihádistické milice" # todo: NEW TRANSLATION
 LBA_jihadist_militias_desc: "S počátkem občanské války se Libyjská islámská bojová skupina reorganizovala do „legitimnější“ organizace pod Národním přechodným výborem. Tvrdí, že jsou umírněnější, ale i jejich vůdci přiznali, že mnoho jejich bojovníků má vazby na Al-Káidu. Čím více získají na moci, tím více naše země sklouzává k extremismu." # todo: NEW TRANSLATION
 LBA_islamist_militias: "Islamistické milice" # todo: NEW TRANSLATION
 LBA_islamist_militias_desc: "Gaddáfí během své vlády mnohé islámské prvky potlačoval. To nyní vytvořilo kontrarevoluční hnutí, kde mnoho Libyjců doufá v více islámocentrickou vládu. Zvláště Muslimské bratrstvo s katarskými podporovateli získává stále větší roli mezi islamistickými milicemi." # todo: NEW TRANSLATION
 LBA_secularist_militias: "Sekulární milice" # todo: NEW TRANSLATION
 LBA_secularist_militias_desc: "Mnoho milicí pod Národním přechodným výborem má původ v Libyjských ozbrojených silách. Mnoho z nich se obává, že přílišná moc islamistů by zničila Libyi. Jak jejich moc roste, Ozbrojené síly budou schopny kontrolovat zemi stále pevněji." # todo: NEW TRANSLATION
 LBA_reformist_militias: "Reformistické milice" # todo: NEW TRANSLATION
 LBA_reformist_militias_desc: "Někteří lidé v Libyi chtějí, aby země byla přeměněna na západní styl demokracie. Tito lidé jsou však máločetní. Je nepravděpodobné, že získají dost podpory, ale jejich přítomnost dělá naše příznivce podezřívavými ohledně vlastních cílů." # todo: NEW TRANSLATION
 LBA_military_desertion_government: "Vojenské dezertování" # todo: NEW TRANSLATION
 LBA_military_desertion_government_desc: "Každý den máme zprávy o vojcích a celých jednotkách, které přecházejí z libyjské armády na stranu rebelů. Je těžké, aby gaddáfovská vláda držela pozice, když je možné je prostě ztratit kvůli tomu, že vojáci opouštějí své posty a přidávají se k nepříteli." # todo: NEW TRANSLATION
 LBA_aftermath_of_the_civil_war: "Následky občanské války" # todo: NEW TRANSLATION
 LBA_aftermath_of_the_civil_war_desc: "I když byla občanská válka relativně krátká, způsobila určité škody zemi. Největší dopad na společnost má rozbití režimu Gaddáfího a milicí. Organizace režimu zasahovala až na úroveň okresů, a nahrazení gaddáfovských loajalistů novými úředníky bude trvat. Navíc v zemi stále operuje několik nezávislých milicí, které buď musí být odstraněny, nebo integrovány do Libyjské národní armády." # todo: NEW TRANSLATION
 LBA_shura_council_of_derna: "Šúra rada mudžáhidů v Derně" # todo: NEW TRANSLATION
 LBA_shura_council_of_derna_desc: "Místní islamisté v Derně se spojili a vytvořili šúra radu, aby řídili město a zaplnili mocenské vakuum po vládě. Derna je jedno z početnějších měst v Libyi a je hlavním zdrojem mužstva pro globální libyjské džihádisty." # todo: NEW TRANSLATION
 LBA_shura_council_of_ajdabiya: "Šúra rada revolucionářů Ajdabiya" # todo: NEW TRANSLATION
 LBA_shura_council_of_ajdabiya_desc: "Místní islamisté v Ajdabiya se spojili a vytvořili šúra radu, aby řídili město a zaplnili mocenské vakuum po vládě. Ztráta kontroly nad Ajdabiya významně snížila naši schopnost vyvážet ropu z ropných polí Wahat." # todo: NEW TRANSLATION
 LBA_southern_insurgency: "Povstání v Kufře" # todo: NEW TRANSLATION
 LBA_southern_insurgency_desc: "Povstalci věrní islamistům v Benghází, brigádě Rafallah al-Sahati, operují v Kufře a narušují místní populaci. Nejsou vážnou hrozbou, ale jejich existence může provokovat místní Toubou k akci." # todo: NEW TRANSLATION
