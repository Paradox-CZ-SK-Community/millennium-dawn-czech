l_english:
 CHI_SOV_treaty_good_neighbourliness: "Čínsko-ruská smlouva o dobrém sousedství" # todo: NEW TRANSLATION
 CHI_SOV_treaty_good_neighbourliness_desc: "Smlouva o dobrém sousedství a přátelské spolupráci podepsaná v roce 2001 položila právní základy moderních vztahů mezi Čínou a Ruskem. Obnovená politická vůle jednat podle jejích ustanovení , vzájemný respekt, nevměšování a konzultace o hlavních mezinárodních otázkách , otevírá cestu generaci dvoustranných projektů, které by žádná z obou zemí nemohla uskutečnit sama." # todo: NEW TRANSLATION
 CHI_SOV_sco_framework: "Agenda rozšíření ŠOS" # todo: NEW TRANSLATION
 CHI_SOV_sco_framework_desc: "Šanghajská organizace pro spolupráci byla založena v roce 2001 Čínou a Ruskem jako nástupce Šanghajské pětky. Koordinace společné agendy rozšíření , přizvání Indie, Pákistánu, Íránu a nakonec středoasijských států , proměňuje ŠOS z regionálního bezpečnostního fóra v opravdovou protiváhu západním multilaterálním institucím." # todo: NEW TRANSLATION
 CHI_SOV_turn_to_east: "Ruský obrat na východ" # todo: NEW TRANSLATION
 CHI_SOV_turn_to_east_desc: "Politika obratu na východ, urychlená po roce 2014 západními sankcemi, přesměrovává ruský obchod, investice a diplomatickou pozornost k Číně a asijsko-pacifickému regionu. Formalizace této změny orientace v dlouhodobých hospodářských dohodách signalizuje vlastní moskevské byrokracii a podnikatelské komunitě, že západní trh již není hlavním referenčním bodem ruské prosperity." # todo: NEW TRANSLATION
 CHI_SOV_bri_russia_corridor: "Ruský koridor Pásu a stezky" # todo: NEW TRANSLATION
 CHI_SOV_bri_russia_corridor_desc: "Čínsko-evropská železniční nákladní síť již přepravuje většinu svého pozemního nákladu přes ruské území po Transsibiřské magistrále. Začlenění tohoto koridoru do rámce Iniciativy Pásu a stezky, s čínskými investicemi do modernizace ruských železnic a zjednodušenými celními postupy na přechodu Zabajkalsk-Man-čou-li, pevně propojuje obě ekonomiky společnou logistickou infrastrukturou." # todo: NEW TRANSLATION
 CHI_SOV_brics_coordination: "Koordinační blok BRICS+" # todo: NEW TRANSLATION
 CHI_SOV_brics_coordination_desc: "BRICS , Brazílie, Rusko, Indie, Čína a Jihoafrická republika, se vyvinul z akronymu Goldman Sachs ve fungující multilaterální fórum s vlastní Novou rozvojovou bankou a měnovým rezervním fondem. Čínou a Ruskem řízené koordinované rozšíření BRICS+, přijetí Egypta, Etiopie, Íránu a Saúdské Arábie, vytváří paralelní hospodářskou architekturu schopnou zpochybnit postavení MMF a Světové banky jako výchozích institucí globálního Jihu." # todo: NEW TRANSLATION
 CHI_SOV_sco_antiterror: "Regionální protiteroristické centrum ŠOS" # todo: NEW TRANSLATION
 CHI_SOV_sco_antiterror_desc: "Regionální protiteroristická struktura, RATS, je specializovaným protiteroristickým orgánem ŠOS se sídlem v Taškentu. Společné čínsko-ruské rozšíření schopností RATS , sdílení zpravodajských informací, koordinace rychlé reakce a společná výcviková cvičení , rozšiřuje dosah eurasijské bezpečnostní spolupráce do Střední Asie a na Kavkaz a čelí jak džihádistickým sítím, tak skrytým vlivovým operacím vnějších mocností." # todo: NEW TRANSLATION
 CHI_SOV_no_limits_partnership: "Strategické partnerství bez omezení" # todo: NEW TRANSLATION
 CHI_SOV_no_limits_partnership_desc: "Společné prohlášení vydané během návštěvy Si Ťin-pchinga v Moskvě v únoru 2022 vyhlásilo přátelství bez omezení a spolupráci bez zakázaných oblastí. Prohlášení postavilo dvoustranné vztahy nad úroveň jakéhokoli formálního spojenectví, přičemž se zastavilo před smlouvou o vzájemné obraně, a vyslalo Washingtonu a Bruselu signál, že Peking a Moskva považují své strategické sbližování za trvalý rys mezinárodního řádu." # todo: NEW TRANSLATION
 CHI_SOV_yuan_ruble_settlement: "Mechanismus vypořádání v jüanech a rublech" # todo: NEW TRANSLATION
 CHI_SOV_yuan_ruble_settlement_desc: "Čína a Rusko urychlily odklon od obchodu denominovaného v dolarech, přičemž podíl jüanu na ruských exportních platbách po sankcích z roku 2022, které zmrazily ruský přístup k systému SWIFT, prudce vzrostl. Zavedení formálního dvoustranného clearingového mechanismu mezi Čínskou lidovou bankou a Bankou Ruska vytváří paralelní finanční infrastrukturu, která obě ekonomiky izoluje od tlaku sekundárních sankcí." # todo: NEW TRANSLATION
 CHI_SOV_agricultural_corridor: "Primorský zemědělský exportní koridor" # todo: NEW TRANSLATION
 CHI_SOV_agricultural_corridor_desc: "Ruský Dálný východ a sibiřské oblasti disponují některými z největších světových zásob orné půdy, z nichž velká část je nevyužita kvůli vylidňování a nedostatečnému přístupu na trhy. Primorský zemědělský koridor směruje ruské obilí, sóju a olejnatá semena přes vyhrazené hraniční přechody do severovýchodních čínských provincií a poskytuje Charbinu a Šen-jangu bezpečný potravinový řetězec nezávislý na světových komoditních trzích." # todo: NEW TRANSLATION
 CHI_SOV_russian_far_east_zone: "Ruský přístav volného obchodu na Dálném východě" # todo: NEW TRANSLATION
 CHI_SOV_russian_far_east_zone_desc: "Status Vladivostoku jako přístavu volného obchodu, udělený Ruskem v roce 2015, byl navržen konkrétně k přilákání čínských a japonských investic do zaostalého ruského Dálného východu. Čínské státní podniky investující do přístavních zařízení, chladírenských skladů a lehkého průmyslu ve Vladivostocké zóně volného obchodu vytvářejí obchodní kotvu, která upevňuje ruský obrat na východ a poskytuje Číně pacifický logistický uzel mimo její vlastní hranice." # todo: NEW TRANSLATION
 CHI_SOV_zarubino_port: "Dohoda o zarubinském pacifickém přístavu" # todo: NEW TRANSLATION
 CHI_SOV_zarubino_port_desc: "Terminál pro hromadný náklad Zarubino na ruském pacifickém pobřeží, poblíž trojmezí Ruska, Číny a Severní Koreje, je od 90. let navrhován jako projekt společného rozvoje. Čínské investice do rozšíření kapacity Zarubina pro manipulaci s obilím a kontejnery poskytují čínským vývozcům z provincie Ťi-lin nejkratší trasu k pacifickým námořním cestám a zároveň Rusku dodávají čínský kapitál na infrastrukturu, kterou si Moskva nemůže dovolit vybudovat sama." # todo: NEW TRANSLATION
 CHI_SOV_trans_siberian_freight: "Rozšíření transsibiřské nákladní dopravy" # todo: NEW TRANSLATION
 CHI_SOV_trans_siberian_freight_desc: "Koridor Transsibiřské magistrály ročně odbaví desítky tisíc nákladních kontejnerových přeprav mezi Čínou a Evropou, s tranzitní dobou 12 až 15 dní oproti 30 dnům po moři. Společné čínsko-ruské investice do elektrifikace tratí, zdvojkolejnění úzkých míst a integrovaného digitálního celního odbavení zkracují tranzitní dobu pod 10 dní a ztrojnásobují kapacitu, čímž mění Transsibiřskou magistrálu ve skutečnou alternativu k Suezskému průplavu pro prémiový náklad." # todo: NEW TRANSLATION
 CHI_SOV_timber_mineral_trade: "Sibiřský vývoz dřeva a nerostů" # todo: NEW TRANSLATION
 CHI_SOV_timber_mineral_trade_desc: "Sibiř ukrývá největší světové zásoby boreálního dřeva a obrovská ložiska mědi, niklu, zlata a prvků vzácných zemin. Čínské zpracovatelské společnosti získaly dominantní postavení při nákupu sibiřského dřeva, zatímco Norilsk Nickel a Polyus Gold vyvážejí většinu své produkce do čínských rafinerií. Formalizace těchto komoditních toků prostřednictvím dlouhodobých odběratelských smluv upevňuje postavení obou zemí v globálních dodavatelských řetězcích surovin." # todo: NEW TRANSLATION
 CHI_SOV_arctic_lng: "Odběratelské smlouvy na LNG z Jamalu" # todo: NEW TRANSLATION
 CHI_SOV_arctic_lng_desc: "Projekt LNG Jamal na ruském Jamalském poloostrově, vyvinutý společností Novatek, počítá CNPC a Fond Hedvábné stezky mezi své hlavní akcionáře. Čínské lodě na LNG , speciálně postavená plavidla ledové třídy , celoročně odebírají náklady z přístavu Sabetta. Dlouhodobé odběratelské smlouvy se společnostmi CNOOC a CNPC zajišťují Číně dodávky LNG a zároveň poskytují Novateku čínské financování, o které jej západní sankce připravily." # todo: NEW TRANSLATION
 CHI_SOV_power_of_siberia_2: "Plynovod Síla Sibiře 2" # todo: NEW TRANSLATION
 CHI_SOV_power_of_siberia_2_desc: "Plynovod Síla Sibiře 2 má vést plyn ze stejných západosibiřských polí, která zásobují Evropu, přes Mongolsko do severní Číny. S kapacitou 50 miliard metrů krychlových ročně by z Číny učinil zdaleka největšího odběratele ruského plynu a poskytl Gazpromu základní kontrakt ospravedlňující pokračující investice do polí, která by jinak mohla zůstat nevyužita." # todo: NEW TRANSLATION
 CHI_SOV_tianwan_nuclear: "Rozšíření jaderné elektrárny Tchien-wan" # todo: NEW TRANSLATION
 CHI_SOV_tianwan_nuclear_desc: "Jaderná elektrárna Tchien-wan v Lien-jün-kangu, vybudovaná společností Rosatom na základě řady smluv podepsaných od roku 1997, je největším projektem rusko-čínské technické spolupráce v dějinách. Bloky 7 a 8, sjednané v roce 2021, prodlužují partnerství do 30. let 21. století. Každý blok Rosatomu vybudovaný v Číně předává znalosti o konstrukci reaktorů, smlouvy na dodávky paliva a servisní vztahy, které na desetiletí propojují oba jaderné průmysly." # todo: NEW TRANSLATION
 CHI_SOV_huawei_russia: "Zavádění 5G společnosti Huawei v Rusku" # todo: NEW TRANSLATION
 CHI_SOV_huawei_russia_desc: "Společnost Huawei podepsala v letech 2019–2020 dohody o 5G s ruskými telekomunikačními operátory včetně MTS, MegaFonu a Rostelecomu. Vzhledem k tomu, že západní dodavatelé 5G byli z Ruska vyloučeni preferencí při zadávání zakázek a pozdějšími sankcemi, je dominance Huawei nad budováním ruské 5G sítě prakticky nezpochybnitelná. Čínská 5G infrastruktura začleněná do ruské komunikační páteře vytváří technickou závislost, která prohlubuje dvoustranné vztahy na úrovni kritické národní infrastruktury." # todo: NEW TRANSLATION
 CHI_SOV_beidou_glonass: "Dohoda o navigaci BeiDou–GLONASS" # todo: NEW TRANSLATION
 CHI_SOV_beidou_glonass_desc: "Čínský BeiDou a ruský GLONASS jsou jediné dva satelitní navigační systémy nezávislé na americké síti GPS. Dohoda o interoperabilitě podepsaná v roce 2015 mezi provozními orgány obou systémů umožňuje civilním a vojenským přijímačům současně využívat signály z obou konstelací, čímž zlepšuje přesnost určování polohy a především poskytuje oběma zemím záložní navigační infrastrukturu, kterou nelze zhoršit americkým rušením ani orbitálními zásahy." # todo: NEW TRANSLATION
 CHI_SOV_polar_silk_road: "Iniciativa Polární hedvábné stezky" # todo: NEW TRANSLATION
 CHI_SOV_polar_silk_road_desc: "Čínský dokument o arktické strategii zveřejněný v roce 2018 označil Severní mořskou cestu za Polární hedvábnou stezku , třetí koridor Pásu a stezky vedle pozemních tras přes Střední Asii a námořní trasy přes Indický oceán. Čínské investice do arktické námořní infrastruktury, stavba ledoborců v čínských loděnicích a přístavní zařízení podél NSC mění sezónní ruskou trasu v celoroční mezinárodní námořní cestu kontrolovanou čínsko-ruskými společnými podniky." # todo: NEW TRANSLATION
 CHI_SOV_northern_sea_route: "Komercializace Severní mořské cesty" # todo: NEW TRANSLATION
 CHI_SOV_northern_sea_route_desc: "Severní mořská cesta, vedoucí podél ruského arktického pobřeží od Beringova průlivu ke Karskému moři, zkracuje vzdálenost mezi Šanghají a Hamburkem přibližně o 30 % ve srovnání s trasou přes Suezský průplav. Tání arktického mořského ledu prodlužuje období splavnosti. Společné čínsko-ruské investice do kapacity eskorty ledoborců, infrastruktury pro záchranné operace podél trasy a specializovaných kontejnerových lodí ledové třídy mění NSC z okrajové sezónní možnosti v životaschopnou celoroční alternativu pro náklad s vysokou hodnotou." # todo: NEW TRANSLATION
 CHI_SOV_rosatom_export: "Exportní balíček Rosatomu" # todo: NEW TRANSLATION
 CHI_SOV_rosatom_export_desc: "Rosatom je podle počtu mezinárodních objednávek reaktorů největší jadernou energetickou společností na světě, s více než 30 bloky ve výstavbě nebo nasmlouvanými v zahraničí. Konstrukce reaktorů VVER, dodavatelský řetězec paliva a dlouhodobé servisní smlouvy jsou hlavním prostředkem, jehož prostřednictvím Rusko uplatňuje svůj hospodářský a technický vliv. Specializovaný exportní balíček pro čínské odběratele , zahrnující bloky VVER-1200, dodávky směsného oxidačního paliva a společný výcvik čínských jaderných inženýrů , začleňuje ruskou jadernou technologii na celou generaci do čínské civilní energetické infrastruktury." # todo: NEW TRANSLATION
 CHI_SOV_space_station: "Mezinárodní lunární výzkumná stanice" # todo: NEW TRANSLATION
 CHI_SOV_space_station_desc: "Mezinárodní lunární výzkumná stanice, společně oznámená čínskou CNSA a ruským Roskosmosem v roce 2021, je nejambicióznějším dvoustranným vědeckým projektem od sovětského kosmického programu. ILRS počítá s trvalým robotickým a později pilotovaným výzkumným zařízením poblíž jižního pólu Měsíce, výslovně navrženým jako alternativa k programu Artemis agentury NASA a otevřeným účasti třetích zemí. Její společný vývoj svazuje oba kosmické programy do sdílené architektury pro nadcházející generaci průzkumu hlubokého vesmíru." # todo: NEW TRANSLATION
 CHI_SOV_peace_mission: "Společná cvičení Mírová mise" # todo: NEW TRANSLATION
 CHI_SOV_peace_mission_desc: "Mírová mise je série společných vojenských cvičení ŠOS, pořádaných každoročně od roku 2005 a střídajících se mezi členskými státy. Čínské a ruské síly se účastnily každého ročníku, přičemž cvičení se rozšířila od protiteroristických scénářů ke kombinovaným manévrům zahrnujícím obrněné formace, blízkou leteckou podporu a koordinaci velení na úrovni sboru. Série cvičení se stala hlavním místem rozvoje interoperability PLA a ruské armády mimo skutečné společné operace." # todo: NEW TRANSLATION
 CHI_SOV_advanced_arms_sales: "Exportní balíček Su-35 a S-400" # todo: NEW TRANSLATION
 CHI_SOV_advanced_arms_sales_desc: "Čínský nákup 24 víceúčelových stíhaček Suchoj Su-35 v roce 2015 a praporní sestavy protiletadlových raket S-400 Triumf v roce 2018 představoval nejvýznamnější ruský vývoz zbraní do Číny od dohody o Su-27 z 90. let. Prodeje předaly operační zkušenosti s letouny generace 4+ a integrovanou protivzdušnou obranou dlouhého dosahu, kterým vlastní čínský průmysl dosud nedokázal konkurovat, a zároveň poskytly Rosoboronexportu prémiového zákazníka v době, kdy se jeho západní trh uzavíral." # todo: NEW TRANSLATION
 CHI_SOV_pacific_fleet_coord: "Dohoda o koordinaci Pacifické flotily" # todo: NEW TRANSLATION
 CHI_SOV_pacific_fleet_coord_desc: "Námořnictvo PLA a ruská Pacifická flotila provádějí od roku 2012 koordinovaná námořní cvičení v Japonském moři, Východočínském moři a západním Pacifiku. Společné hlídky ve vodách přilehlých k Japonsku a Korejskému poloostrovu demonstrují kombinovanou přítomnost, kterou by žádné z námořnictev nedokázalo samostatně dlouhodobě udržet, a vysílají Velitelství amerických tichomořských sil záměrný signál o ceně jakéhokoli střetu s jednou z těchto mocností v jejích domácích vodách." # todo: NEW TRANSLATION
 CHI_SOV_defense_industrial: "Integrace obranné průmyslové základny" # todo: NEW TRANSLATION
 CHI_SOV_defense_industrial_desc: "Čínské státní obranné podniky překonaly pouhý dovoz ruských platforem a přešly k licenční výrobě a reverznímu inženýrství. Společné podniky ve vývoji leteckých motorů , v oblasti, kde vlastní čínský průmysl stále nejvíce zaostává , jsou strategicky nejvýznamnější. Čínský přístup k ruské technologii turboventilátorových motorů pro motory WS-15 a WS-20 uzavírá rozdíl oproti západním vzdušným silám za zlomek nákladů samostatného vývoje, zatímco ruské podniky získávají čínský výrobní rozsah." # todo: NEW TRANSLATION
 CHI_SOV_strategic_bomber_patrol: "Společné hlídky strategických bombardérů" # todo: NEW TRANSLATION
 CHI_SOV_strategic_bomber_patrol_desc: "V letech 2019 a 2023 provedly ruské bombardéry Tu-95MS Bear a čínské strategické bombardéry H-6K koordinované hlídky nad Japonským mořem a Východočínským mořem, což vyvolalo vzlety japonské a jihokorejské protivzdušné obrany. Hlídky nejsou ve smyslu vojenské terminologie společnými operacemi, ale demonstrují synchronizované využití strategické vzdušné síly a signalizují ochotu obou zemí koordinovat tlak na společné protivníky. Pravidelné společné hlídkové koridory prohlubují obeznámenost posádek a společné procedurální standardy." # todo: NEW TRANSLATION
 CHI_SOV_vostok_exercises: "Strategická cvičení Vostok" # todo: NEW TRANSLATION
 CHI_SOV_vostok_exercises_desc: "Vostok je série ruských vojenských cvičení na strategické úrovni, tradičně zaměřená na rozsáhlý konvenční konflikt na ruském Dálném východě. Čínské síly se účastnily cvičení Vostok-2018 a znovu Vostok-2022, které se konalo několik týdnů po začátku války na Ukrajině. Čínská účast povyšuje cvičení z národní zkoušky na bilaterální demonstraci kombinovaných sil, při níž se pozemní a letecké prvky PLA začleňují do ruských divizních velitelských struktur." # todo: NEW TRANSLATION
 CHI_SOV_military_space: "Společný vojenský kosmický program" # todo: NEW TRANSLATION
 CHI_SOV_military_space_desc: "Čína i Rusko vyvinuly specializované vojenské kosmické schopnosti , protidružicové zbraně, rušení satelitní navigace, družice elektronického průzkumu a kosmické systémy včasného varování. Společný program koordinující orbitální pozice družic, protokoly sdílení dat a společné povědomí o situaci ve vesmíru poskytuje oběma zemím komplexnější přehled o kosmických operacích USA a jejich spojenců, než by každá z nich dokázala získat samostatně, a zároveň snižuje riziko kolize nebo eskalace mezi jejich vlastními orbitálními prostředky." # todo: NEW TRANSLATION
 SOV_chi_rare_earth_supply: "Čínské komponenty z prvků vzácných zemin" # todo: NEW TRANSLATION
 SOV_chi_rare_earth_supply_desc: "Čína kontroluje více než 80 % světové kapacity rafinace prvků vzácných zemin, včetně sloučenin neodymu, lanthanu a dysprosia nezbytných pro přesné naváděcí systémy, optiku nočního vidění a vysoce výkonné elektromotory. Formalizace dodavatelského vztahu v rámci spolupráce obranného průmyslu zajišťuje společnosti Uralvagonzavod garantovaný přístup k čínským zpracovaným surovinám vzácných zemin, snižuje náklady na komponenty a zlepšuje konzistenci kvality na výrobních linkách T-90 a Armata." # todo: NEW TRANSLATION
 CHI_sov_flanker_expertise: "Odbornost v generaci Flanker" # todo: NEW TRANSLATION
 CHI_sov_flanker_expertise_desc: "Licenční výroba rodiny Su-27 Flanker společností Shenyang Aircraft Corporation, zahrnující varianty J-11, J-15 a J-16, z ní učinila nejzkušenějšího výrobce bojových letounů ruského původu na světě mimo samotné Rusko. Exportní smlouva na Su-35 tento vztah prohlubuje poskytnutím přístupu k motoru AL-41F1S, konstrukci radaru Irbis-E a aerodynamickým vylepšením, která ovlivňují vlastní programy nové generace společnosti Shenyang. Letouny sjíždějící z výrobní linky v Šen-jangu vykazují měřitelné výkonnostní zisky přímo odvozené od spolupráce s konstrukční kanceláří Suchoj." # todo: NEW TRANSLATION
 CHI_SOV_military_tech_idea: "Transfer ruských obranných technologií" # todo: NEW TRANSLATION
 CHI_SOV_shared_modifier: "Čínsko-ruské strategické sbližování" # todo: NEW TRANSLATION
 CHI_SOV_shared_modifier_desc: "Balíček vzájemně propojených dvoustranných závazků mezi Pekingem a Moskvou, který upravuje čínskou ekonomiku a armádu podle hloubky čínsko-ruské spolupráce. Užší vztahy rozšiřují politický manévrovací prostor, zemědělskou a surovinovou produkci, dosah námořnictva a civilně-průmyslovou kapacitu, zatímco prohlubování partnerství zvyšuje obchodní přízeň a zpřísňuje zabezpečení hranic. Modifikátor se stupňuje s každou významnou dohodou ratifikovanou oběma mocnostmi." # todo: NEW TRANSLATION
