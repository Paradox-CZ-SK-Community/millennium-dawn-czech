 SWE_weapons_depots: "Rozptýlit strategické zbrojní sklady" # todo: NEW TRANSLATION
 SWE_weapons_depots_desc: "V souladu s naší doktrínou totální obrany a dlouhodobé odolnosti musíme zajistit, aby ozbrojené síly a budoucí odbojové snahy měly nepřerušovaný přístup k nezbytným zásobám. \n\nBudeme tiše rozmisťovat zbraně, munici a zásobovací zásoby po celé zemi, zejména v venkovských a lesnatých regionech. Tyto skryté sklady budou základem naší rezervní mobilizace a budou sloužit jako odstrašující prostředek pro každého, kdo by nás chtěl obsadit." # todo: NEW TRANSLATION
 SWE_open_weapons_depots: "Otevřít sklady zbraní" # todo: NEW TRANSLATION
 Sweden_news.31.t: "Švédsko aktivuje skryté zbrojní sklady" # todo: NEW TRANSLATION
 Sweden_news.31.d: "V kroku, který nebyl viděn od doby studené války, vláda Švédska zahájila otevírání dlouho skrytých zbrojních skladů po celé zemi. Původně zřízené jako součást doktrí Totalförsvar, tyto zásoby obsahují zbraně, munici a zásoby určené k podpoře záložních sil při národním nouzi.\n\nZatímco Stockholm nadále zdůrazňuje prioritu míru a diplomacie, tento krok signalizuje rostoucí obavy ohledně regionální bezpečnostní situace. Aktivace skladů znamená jasný posun od pasivní připravenosti k aktivním opatřením pro případ nouze." # todo: NEW TRANSLATION
 Sweden_news.31.a: "Tohle je naše poslední záchranná možnost." # todo: NEW TRANSLATION
 Sweden_news.20.other_t: "Švédská domácí debata" # todo: NEW TRANSLATION
 Sweden_news.20.other_d: "Švédský veřejnoprávní vysílatel odvysílal další reportáž o zahraniční politice a neutralitě, která za hranicemi země vzbudila jen omezenou pozornost." # todo: NEW TRANSLATION
 Sweden_news.20.other_a: "Vzato na vědomí." # todo: NEW TRANSLATION
 SWE_modernize_marinen_effort: "Modernizujte švédské námořnictvo" # todo: NEW TRANSLATION
 SWE_modernize_marinen_effort_desc: "Švédské námořní síly dlouho hrály klíčovou roli při obraně našich pobřeží a zabezpečování Baltského moře. Vznikající námořní hrozby, schopnosti dálkových úderů a podmořská konkurence však vyžadují zásadní modernizaci Marinen.\n\nInvestujeme do modernizovaných hladinových bojových plavidel, technologií ponorek, senzorových sítí a schopností pobřežního válčení. Moderní námořnictvo je nezbytné nejen pro národní obranu, ale také pro příspěvek k regionální námořní bezpečnosti a ochranu životně důležitých námořních komunikačních tras." # todo: CHANGED
 SWE_swedish_mio_submarine: "Rozšiřte švédské ponorkové schopnosti" # todo: NEW TRANSLATION
 SWE_swedish_mio_submarine_desc: "Švédská ponorková flotila byla tradičně optimalizována pro operace v mělkých a úzkých vodách Baltského moře. Vyvíjející se strategické požadavky však vyžadují posun za hranice pouhé pobřežní obrany.\n\nMusíme investovat do konstrukcí nové generace s prodlouženým dosahem, modulární výzbrojí a vytrvalostí vhodnou pro globální mise od arktických hlídek po expediční průzkum. Specializovaná vojensko-průmyslová organizace (MIO) nám umožní koordinovat výzkum, výrobu a integraci systémů." # todo: CHANGED
 Sweden_foci.46.t: "Rozhovory o ponorkách se společností Kockums" # todo: NEW TRANSLATION
 Sweden_foci.46.d: "Jak postupujeme v modernizaci naší ponorkové flotily, dorazila delegace ze společnosti Kockums, která představila různé návrhy. Jejich námořní inženýři jsou dobře připraveni a plány pro škálovatelnou objednávku jsou již na stole. \n\nAle je tu také... dobře oblečený host v rohu, který není uveden v programu. Doprovázený půvabnou sekretářkou a ještě půvabnějším kufříkem, představuje 'alternativní řešení' k výzvám s nákupem." # todo: NEW TRANSLATION
 Sweden_foci.46.a: "Pokračujte s formálním plánem se společností Kockums" # todo: NEW TRANSLATION
 Sweden_foci.46.b: "Kufr mluví hlasitěji než plány." # todo: NEW TRANSLATION
 Sweden_foci.47.t: "Předány návrhy ponorek Kockums" # todo: NEW TRANSLATION
 Sweden_foci.47.d: "Po obnoveném švédském zájmu o rozšíření podmořských schopností předložil Kockums řadu pokročilých konceptů ponorek. Zdroje blízké ministerstvu obrany uvádějí, že se zvažuje několik konstrukcí od modulárních nenápadných hlídkových člunů po dálkové hlubokomořské platformy.\n\nStrategické rozhodnutí se očekává brzy a námořní analytici oceňují švédský závazek modernizovat flotilu." # todo: CHANGED
 Sweden_foci.47.a: "Velmi profesionální" # todo: NEW TRANSLATION
 Sweden_foci.48.t: "Ponorky třídy 212 přijíždějí tiše" # todo: NEW TRANSLATION
 Sweden_foci.48.d: "To ráno došlo k tišnému převodu dvou zbrusu nových ponorek třídy 212, vyrobených v Německu, během nenápadné ceremonie, kterého se zúčastnili vybraní úředníci. Lodě, vyvinuté společností ThyssenKrupp Marine Systems, se mají představovat 'paralelní kanál akvizic', který obešel zdlouhavá formální výběrová řízení.\n\nZatímco někteří novináři začali klást otázky o povaze dohody a zapojených osob, vládní kruhy zůstávají klidné. Zatím to vypadá, že kufr dodal víc než jen sliby." # todo: NEW TRANSLATION
 Sweden_foci.48.a: "Německá efektivita" # todo: NEW TRANSLATION
 Sweden_news.32.t: "Královská návštěva se strategickým záměrem?" # todo: NEW TRANSLATION
 Sweden_news.32.d: "Švédská královská delegace navštíví naši zemi, oficiálně za účelem posílení diplomatických vztahů a vyjádření dobré vůle. Zatímco veřejnost vítá jejich příjezd s nadšením a vřelým přijetím, za zákulisím jsou jednání spíše pragmatická.\n\nTato návštěva představuje příležitost. Jejich symbolická popularita by mohla být využita pro veřejnou diplomacii a jejich přítomnost by mohla změkčit postoje v probíhajících jednáních. Zároveň si naše strana je dobře vědoma, že přátelství samo o sobě neřeší finance, a možná nastal čas zajistit, aby dobra vůle převedla do měřitelných strategických či ekonomických zisků." # todo: NEW TRANSLATION
 Sweden_news.32.a: "Využijte jejich popularitu pro veřejné zapojení" # todo: NEW TRANSLATION
 Sweden_news.32.b: "Naše přátelství má svou cenu" # todo: NEW TRANSLATION
 Sweden_news.33.t: "Den opravdového přátelství" # todo: NEW TRANSLATION
 Sweden_news.33.d: "Návštěva švédské královské rodiny v §Y[FROM.GetNameWithFlag]§! se změnila v něco víc než ceremoniální událost. Zatímco program vyplnily státní bankety a společná prohlášení, skutečně důležitý byl nečekaný ohlas veřejnosti. Členové královské rodiny přímo hovořili s našimi občany, účastnili se kulturních akcí a symbolicky posílili pouto mezi našimi národy.\n\nDiplomacie někdy nepotřebuje složité dohody. Někdy stačí být viděn, slyšen a zapamatován." # todo: CHANGED
 Sweden_news.33.a: "To je skutečné přátelství" # todo: NEW TRANSLATION
 Sweden_news.34.t: "Dohody za zavřenými dveřmi" # todo: NEW TRANSLATION
 Sweden_news.34.d: "I když královská delegace vzbuzovala pozornost médií, skutečný úspěch návštěvy v §Y[FROM.GetNameWithFlag]§! se odehrál mimo kamery. Během jednání za zavřenými dveřmi počáteční vyjednávání zůstávalo na mrtvém bodě. Až poté, co do vyjednávání vstoupil švédský průmyslový zástupce patřící do oficiálního doprovodu a navrhl společný podnik na výrobu, došlo k průlomu.\n\nDohoda sice nebyla velkolepá, ale položila základy pro budoucí spolupráci. Někdy je diplomacie zpečetěna obchodní logikou spíše než slovy." # todo: NEW TRANSLATION
 Sweden_news.34.a: "Nezrovna skvělé, ale přesto úspěšné." # todo: NEW TRANSLATION
 Sweden_foci.50.t: "Pozvánka do NORDEFCO" # todo: NEW TRANSLATION
 Sweden_foci.50.d: "Severská obranná spolupráce (NORDEFCO) se rozvinula v relevantní fórum strategického sladění a vojenské spolupráce v celém severském regionu. Nedávno jsme obdrželi oficiální pozvání stát se plnoprávným účastnickým členem.\n\nNabídka slibuje přístup ke společným cvičením, logistice a strukturám společných nákupů, kritici však varují, že nás může příliš pevně svázat s obrannými postoji sousedních států a oslabit části národní suverenity. Je užší severská spolupráce krokem vpřed, nebo příliš velkým kompromisem?" # todo: CHANGED
 Sweden_foci.50.a: "Budeme se účastnit NORDEFCO" # todo: NEW TRANSLATION
 Sweden_foci.50.b: "Nebudeme se vzdávat naší nezávislosti" # todo: NEW TRANSLATION
 Sweden_foci.51.t: "[FROM.GetNameWithFlag] Odmítá členství NORDEFCO" # todo: NEW TRANSLATION
 Sweden_foci.51.d: "Navzdory otevřenému pozvání a nadějím na jednotný nordický obranný rámec, [FROM.GetName] oficiálně odmítl vstoupit do NORDEFCO jako plný člen. Jeho/jejich rozhodnutí, vyjádřené jako věc suverenity a strategické autonomie, vrhlo stín na snahy regionální integrace.\n\nZatímco dveře zůstávají otevřené pro budoucí spolupráci, jde o zmešněnou příležitost pro posílení kolektivní obrany na severu." # todo: NEW TRANSLATION
 Sweden_foci.51.a: "Politování hodné rozhodnutí." # todo: NEW TRANSLATION
 Sweden_foci.52.t: "Založení NordCAPS" # todo: NEW TRANSLATION
 Sweden_foci.52.d: "Obdrželi jsme pozvání připojit se k nově vznikajícímu seversko-baltskému rámci vojenské spolupráce: NORDCAPS. V důsledku proměnlivé rovnováhy sil a rostoucích hybridních hrozeb již regionální jednota není luxusem, ale nutností.\n\nČlenství by znamenalo společný výcvik, interoperabilitu, strategie společných nákupů a společnou obrannou doktrínu severských a baltských států. Někteří to považují za základ skutečně nezávislé evropské bezpečnostní identity na severu. Jiní varují před ztrátou strategické pružnosti.\n\nVykročíme vpřed?" # todo: CHANGED
 Sweden_foci.52.a: "Společně jsme silnější" # todo: NEW TRANSLATION
 Sweden_foci.52.b: "Jdeme sami" # todo: NEW TRANSLATION
 Sweden_foci.53.t: "Promarnili svou příležitost" # todo: NEW TRANSLATION
 Sweden_foci.53.d: "Jiný národ měl možnost připojit se k nám v rámci kolektivní obranné iniciativy, ale nechal ji uniknout. Podali jsme mu ruku, on však váhal, pózoval nebo výzvu ignoroval.\n\nV dějinách nastávají okamžiky, kdy volby definují víc než jen politiku. Toto byl jeden z nich." # todo: CHANGED
 Sweden_foci.53.a: "Idioti" # todo: NEW TRANSLATION
 Sweden_foci.54.t: "Založení Nordbanken" # todo: NEW TRANSLATION
 Sweden_foci.54.d: "Švédské úřady schválily bankovní fúzi, která vytvoří Nordbanken, významnou finanční instituci s výrazným regionálním vlivem. Pozvali nás, abychom tuto fúzi podpořili a zapojili se do ní. Taková spolupráce by mohla otevřít nové finanční příležitosti a posílit přeshraniční investice." # todo: NEW TRANSLATION
 Sweden_foci.54.a: "To oživí naši ekonomiku." # todo: NEW TRANSLATION
 Sweden_foci.54.b: "Ne, odmítneme." # todo: NEW TRANSLATION
 Sweden_foci.55.t: "Švédská nabídka na posílení vojensko-průmyslové spolupráce" # todo: NEW TRANSLATION
 Sweden_foci.55.d: "Švédsko navrhlo dohodu o prohloubení naší spolupráce v oblasti vojenskoprůmyslového sektoru. To by zahrnovalo společné vývojové projekty, sdílené výrobní kapacity a koordinované zadávání zakázek pro zlepšení efektivity a schopností." # todo: NEW TRANSLATION
 Sweden_foci.55.a: "Přijmout nabídku." # todo: NEW TRANSLATION
 Sweden_foci.55.b: "Udržet výrobu doma." # todo: NEW TRANSLATION
 Sweden_foci.56.t: "Pozvánka do švédské skupiny pro sdílení technologií" # todo: NEW TRANSLATION
 Sweden_foci.56.d: "Švédsko nás oslovilo a pozvalo, abychom se připojili ke své nově založené skupině pro sdílení technologií. Cílem iniciativy je podpořit spolupráci v oblasti pokročilého výzkumu, obranných technologií a průmyslových inovací mezi důvěryhodnými partnery." # todo: NEW TRANSLATION
 Sweden_foci.56.a: "Podepsat dohodu." # todo: NEW TRANSLATION
 Sweden_foci.56.b: "Odmítnout nabídku." # todo: NEW TRANSLATION
 Sweden_foci.57.t: "Žádost o pořízení dronů Reaper" # todo: NEW TRANSLATION
 Sweden_foci.57.d: "Švédská vláda se na nás obrátila s žádostí o pořízení dronů MQ-9 Reaper. Tvrdí, že tento nákup výrazně posílí jejich průzkumné a útočné schopnosti a zlepší jejich schopnost reagovat na moderní hrozby." # todo: NEW TRANSLATION
 Sweden_foci.57.a: "Prodat drony." # todo: NEW TRANSLATION
 Sweden_foci.57.b: "Odmítnout jejich žádost." # todo: NEW TRANSLATION
 SWE_norways_kings: "Norské králové" # todo: NEW TRANSLATION
 SWE_norways_kings_desc: "Norská královská rodina, se svou dlouhou a hrdou historií, zůstává uznávaným symbolem jednoty a tradice v Norsku. Jejich úzké historické a rodinné vazby na naši Královskou houses představují jedinečnou příležitost posílit pouta mezi našimi národy. Podporou královské diplomacie, sdílených kulturních akcí a koordinovaných veřejných akcí můžeme posílit osobní spojení mezi oběma monarchiemi.\n\nTakové snahy by mohly vytvořit silnější pocit nordické příbuznosti, prohloubit důvěru mezi našimi lidmi a představit jednotný královský postoj v očích světa." # todo: NEW TRANSLATION
 SWE_nb8_member: "Člen Nordicko-baltské spolupráce" # todo: NEW TRANSLATION
 SWE_military_review_idea: "Vojenský přehled" # todo: NEW TRANSLATION
 SWE_economy_review_idea: "Ekonomický přehled" # todo: NEW TRANSLATION
 SWE_science_patronage_idea: "Podpora vědy" # todo: NEW TRANSLATION
 SWE_real_kingdom: "Vyhlásit skutečné království Švédska" # todo: NEW TRANSLATION
 SWE_real_kingdom_desc: "Lid promluvil a jeho vůli nelze ignorovat. Formálním vyhlášením Skutečného království Švédska obnovíme tradiční místo Koruny jako ústředního pilíře identity našeho národa a spojíme je se stabilitou moderní vlády. Carolus Rex je připraven vést nás do nové éry." # todo: CHANGED
 SWE_real_equality: "Skutečná rovnost" # todo: NEW TRANSLATION
 SWE_ban_islam_modifier: "Zakázaný Islám" # todo: NEW TRANSLATION
 SWE_tight_bands: "Přátelské vztahy" # todo: NEW TRANSLATION
 SWE_Swedish_mediation: "Švédská diplomacie" # todo: NEW TRANSLATION
 Swedisch_monarchy: "Švédská královská diplomacie" # todo: NEW TRANSLATION
 SWE_neutral_trade_efforts: "Obchodní úsilí o neutralitu" # todo: NEW TRANSLATION
 SWE_neutral_efforts: "Obchodní snahy o neutralitu" # todo: NEW TRANSLATION
 SWE_opened_market: "Otevřené trhy pro nás" # todo: NEW TRANSLATION
 SWE_anti_nato_minus: "Směr proti NATO" # todo: NEW TRANSLATION
 SWE_anti_nato_plus: "Směr proti NATO" # todo: NEW TRANSLATION
 SWE_send_to_UN: "Přiřaďte člena královské rodiny do programu OSN" # todo: NEW TRANSLATION
 SWE_visit_asia: "Diplomatická mise na východě Asie" # todo: NEW TRANSLATION
 SWE_visit_EU: "Královská diplomatická cesta po Evropě" # todo: NEW TRANSLATION
 SWE_governmental_office: "Stáž v Riksdagu" # todo: NEW TRANSLATION
 SWE_trading_net: "Nordická obchodní síť" # todo: NEW TRANSLATION
 SWE_trading_net_desc: "Švédsko posílilo své obchodní vazby po celé severní oblasti regionu, čímž vznikla odolná ekonomická síť, která zajišťuje klíčové dovozy, zvyšuje vývoz a stabilizuje růst." # todo: NEW TRANSLATION
 SWE_gold_reserve: "Strategická zlatá rezerva" # todo: NEW TRANSLATION
 SWE_gold_reserve_desc: "Rozšiřováním národních zlatých zásob posiluje Švédsko finanční nezávislost a důvěryhodnost, poskytuje polštář proti krizím a vnějším tlakům." # todo: NEW TRANSLATION
 SWE_swiss_neutrality: "Neutralita ve stylu Švýcarska" # todo: NEW TRANSLATION
 SWE_swiss_neutrality_desc: "Modelováno podle švýcarské praxe, Švédsko se zavazuje k přísné neutralitě při zachování důvěryhodné obrany. To zachovává svobodu působení a diplomatickou pružnost." # todo: NEW TRANSLATION
 SWE_neutrality_reintended: "Neutralita potvrzena" # todo: NEW TRANSLATION
 SWE_neutrality_reintended_desc: "Švédsko se vrátí k principům nestranné diplomacie a nezávislého tvorby politiky. Znovu potvrzením našeho postoje neutrality se nezavazujeme k aliancím ani blokům, ale k obraně naší suverenity a usilování o pokojná řešení." # todo: NEW TRANSLATION
 SWE_refuse_all_block_membership: "Odmítnout členství ve všech blocích" # todo: NEW TRANSLATION
 SWE_refuse_all_block_membership_desc: "Švédsko zůstane mimo všechny vojenské i politické bloky, čímž si zachováme svobodu jednání a zajistíme, že naše zahraniční politika bude určována výhradně švédskými zájmy." # todo: NEW TRANSLATION
 SWE_host_international_mediation_summit: "Pořádat Mezinárodní summit pro zprostředkování" # todo: NEW TRANSLATION
 SWE_host_international_mediation_summit_desc: "Pozveme do Švédska diplomaty, vyjednavače a vůdce z celého světa na summit zaměřený na vyřešení probíhajících sporů. Tím posílíme naši pověst důvěryhodného mediátora." # todo: NEW TRANSLATION
 SWE_security_guaraties_for_neutrals: "Záruky bezpečnosti neutrálním státům" # todo: NEW TRANSLATION
 SWE_security_guaraties_for_neutrals_desc: "Tím, že nabízíme vzájemné obranné záruky dalším neutrálním státům, vytváříme kolektivní odstrašování proti agresi a posilujeme naše společné odhodlání k nezávislosti." # todo: NEW TRANSLATION
 SWE_non_aligned_trade_network: "Obchodní síť nezávislých zemí" # todo: NEW TRANSLATION
 SWE_non_aligned_trade_network_desc: "Zřídíme obchodní síť mezi nezávislými zeměmi, která zajistí stabilní ekonomické vazby bez politických zapletení." # todo: NEW TRANSLATION
 SWE_emergency_refugees_hub: "Nouzový uprchlický uzel" # todo: NEW TRANSLATION
 SWE_emergency_refugees_hub_desc: "Švédsko zřídí infrastrukturu rychlé reakce k ubytování a zpracování uprchlíků v době krize, vyvažující humanitární odpovědnost s národní bezpečností." # todo: NEW TRANSLATION
 SWE_international_arbitration_authoritry: "Mezinárodní arbitrážní autorita" # todo: NEW TRANSLATION
 SWE_international_arbitration_authoritry_desc: "Švédsko založí trvalou arbitrážní autoritu, která bude poskytovat právní řešení sporů mezi státy a korporacemi pod neutrálním dohledem." # todo: NEW TRANSLATION
 SWE_enshine_Armed_neutrality_in_law: "Zakotvit ozbrojenou neutralitu v zákoně" # todo: NEW TRANSLATION
 SWE_enshine_Armed_neutrality_in_law_desc: "Učiníme z ozbrojené neutrality ústavní princip a zajistíme, aby budoucí vlády dodržovaly nezávislou švédskou obranu a diplomatickou nestrannost." # todo: CHANGED
 SWE_total_border_sorvailance: "Totální dohled na hranicích" # todo: NEW TRANSLATION
 SWE_total_border_sorvailance_desc: "Zavedením pokročilých monitorovacích systémů na všech hranicích zajistíme ochranu našeho území proti průniku, pašování a špionáži." # todo: NEW TRANSLATION
 SWE_reinforce_gotland_bastion: "Posílit Gotlandský bastion" # todo: NEW TRANSLATION
 SWE_reinforce_gotland_bastion_desc: "Gotland je klíč k bezpečnosti Baltského moře. Rozšíříme jeho opevnění, protivzdušnou obranu a námořní přítomnost, abychom odradili jakýkoli nepřátelský útok." # todo: NEW TRANSLATION
 SWE_underground_command_center: "Podzemní velitelské centrum" # todo: NEW TRANSLATION
 SWE_underground_command_center_desc: "Postavíme odolné, podzemní velitelské centrum, které zajistí fungování národního vedení i během nejhorších krizí." # todo: NEW TRANSLATION
 SWE_Energy_autarky_program: "Program energetické soběstačnosti" # todo: NEW TRANSLATION
 SWE_Energy_autarky_program_desc: "Diverzifikací zdrojů energie a zvýšením domácí produkce může Švédsko odstranit závislost na zahraničních energetických dodávkách." # todo: NEW TRANSLATION
 SWE_Arctic_defence_initiative: "Arktická obranná iniciativa" # todo: NEW TRANSLATION
 SWE_Arctic_defence_initiative_desc: "Posílíme naši vojenskou přítomnost a infrastrukturu v Arktidě, abychom chránili naše severní území a námořní trasy." # todo: NEW TRANSLATION
 SWE_national_cyber_defense_grid: "Národní síť kybernetické obrany" # todo: NEW TRANSLATION
 SWE_national_cyber_defense_grid_desc: "Plně integrovaná síť kybernetické obrany ochrání kritickou infrastrukturu a státní komunikační systémy před digitálním vniknutím." # todo: NEW TRANSLATION
 SWE_gold_reserve_expansion: "Rozšíření zlatých rezerv" # todo: NEW TRANSLATION
 SWE_gold_reserve_expansion_desc: "Rozšíření našich zlatých rezerv posílí finanční stabilitu a posílí naši hospodářskou suverenitu v dobách globální nejistoty." # todo: NEW TRANSLATION
 SWE_banking_secrecy_act: "Zákon o bankovním tajemství" # todo: NEW TRANSLATION
 SWE_banking_secrecy_act_desc: "Zavedeme přísná pravidla důvěrnosti pro bankovní klienty, čímž přilákáme zahraniční vklady a posílíme naši finanční neutralitu." # todo: NEW TRANSLATION
 SWE_national_militaria_expansion: "Národní militarie expansion" # todo: NEW TRANSLATION
 SWE_national_militaria_expansion_desc: "Rozšíříme naše zásoby zbraní, munice a vojenské techniky, abychom zajistili připravenost v jakékoli situaci." # todo: NEW TRANSLATION
 SWE_universal_conscription_reform: "Reforma všeobecné branné povinnosti" # todo: NEW TRANSLATION
 SWE_universal_conscription_reform_desc: "Modernizujeme a rozšíříme náš systém branné povinnosti, aby byl každý občan vycvičen a připraven bránit národ." # todo: NEW TRANSLATION
 SWE_armed_financial_neutrality_doctrine: "Doktrína ozbrojené finanční neutrality" # todo: NEW TRANSLATION
 SWE_armed_financial_neutrality_doctrine_desc: "Kombinací silné obranné kapacity s přísnou ekonomickou nezávislostí bude Švédsko odrazovat jak vojenský, tak ekonomický nátlak." # todo: NEW TRANSLATION
 SWE_declaration_of_perpetual_neutrality: "Deklarace trvalé neutralita" # todo: NEW TRANSLATION
 SWE_declaration_of_perpetual_neutrality_desc: "Formálně vyhlásíme trvalou neutralitu Švédska a zavážeme se vyhýbat útočným válkám, přičemž si zachováme sílu k vlastní obraně." # todo: CHANGED
 SWE_neutrality_without_equal: "Neutralita bez srovnání" # todo: NEW TRANSLATION
 SWE_neutrality_without_equal_desc: "Díky diplomacii, ekonomické nezávislosti a vojenské připravenosti se Švédsko stane globálním vzorem pro skutečně nezávislý a respektovaný neutrální stát." # todo: NEW TRANSLATION
 SWE_eastern.01.t: "Pozvání na společné vojenské cvičení" # todo: NEW TRANSLATION
 SWE_eastern.01.d: "Švédsko navrhuje společné vojenské cvičení s Ruskou federací s cílem posílit regionální spolupráci a připravenost.\n" # todo: NEW TRANSLATION
 SWE_eastern.01.a: "Přijímáme pozvání" # todo: NEW TRANSLATION
 Sweden_eastern.01.b: "We must politely decline" # todo: NEW TRANSLATION
 Sweden_eastern.101.t: "Rusko přijímá pozvání." # todo: NEW TRANSLATION
 Sweden_eastern.101.d: "Rusko přijalo naši nabídku na společné vojenské cvičení. To je vítaný signál vojenské spolupráce." # todo: NEW TRANSLATION
 Sweden_eastern.101.a: "Síla v jednotě." # todo: NEW TRANSLATION
 Sweden_eastern.102.t: "Rusko odmítá pozvání." # todo: NEW TRANSLATION
 Sweden_eastern.102.d: "Rusko odmítlo švédské pozvání k účasti na vojenských cvičeních. Diplomatické napětí v důsledku toho mírně vzrostlo.\n" # todo: CHANGED
 Sweden_eastern.102.a: "Chápeme." # todo: NEW TRANSLATION
 Sweden_eastern.02.t: "Návrh na vstup do iniciativy Pás a stezka." # todo: NEW TRANSLATION
 Sweden_eastern.02.d: "Švédsko formálně pozvalo Čínu k účasti na iniciativě Pás a stezka a nabídlo spolufinancování infrastrukturních projektů zaměřených na posílení eurasijských hospodářských vazeb.\n" # todo: CHANGED
 Sweden_eastern.02.a: "Ano, Čína výrazně investuje." # todo: NEW TRANSLATION
 Sweden_eastern.02.b: "Mírná podpora." # todo: NEW TRANSLATION
 Sweden_eastern.02.c: "Musíme odmítnout." # todo: NEW TRANSLATION
 Sweden_eastern.03.t: "Čína se zavazuje k významné investici." # todo: NEW TRANSLATION
 Sweden_eastern.03.d: "Čína přijala švédský návrh s významným investičním závazkem. To výrazně posílilo dvoustranné hospodářské a politické vazby.\n" # todo: CHANGED
 Sweden_eastern.03.a: "Ke společnému blahobytu." # todo: NEW TRANSLATION
 Sweden_eastern.04.t: "Čína nabízí umírněnou investici." # todo: NEW TRANSLATION
 Sweden_eastern.04.d: "Čína souhlasila s účastí na iniciativě na umírněné úrovni, což signalizuje vstřícnost a omezený závazek k společným infrastrukturním projektům." # todo: NEW TRANSLATION
 Sweden_eastern.04.a: "Obezřetná spolupráce." # todo: NEW TRANSLATION
 Sweden_eastern.05.t: "Čína odmítá účast." # todo: NEW TRANSLATION
 Sweden_eastern.05.d: "Čína se odmítla zapojit do iniciativy Pás a stezka ve spolupráci se Švédskem. Přestože to zpomaluje spolupráci, diplomatická cesta zůstává otevřená." # todo: NEW TRANSLATION
 Sweden_eastern.05.a: "Respektujeme vaše rozhodnutí." # todo: NEW TRANSLATION
 Sweden_eastern.07.t: "Návrh na strategickou energetickou dohodu." # todo: NEW TRANSLATION
 Sweden_eastern.07.d: "Švédsko navrhlo strategickou dohodu o energii s Ruskou federací, jejímž cílem je zajištění dlouhodobé spolupráce v oblasti paliv a infrastruktury." # todo: NEW TRANSLATION
 Sweden_eastern.07.a: "Přijmout návrh a investovat." # todo: NEW TRANSLATION
 Sweden_eastern.07.b: "Musíme odmítnout." # todo: NEW TRANSLATION
 Sweden_eastern.08.t: "Rusko přijímá energetickou dohodu." # todo: NEW TRANSLATION
 Sweden_eastern.08.d: "Rusko přijalo dohodu o energii. Společný rozvoj infrastruktury a hlubší ekonomické vazby budou následovat." # todo: NEW TRANSLATION
 Sweden_eastern.08.a: "Vytváří se energetické spojenectví." # todo: NEW TRANSLATION
 Sweden_eastern.09.t: "Rusko odmítá energetickou dohodu." # todo: NEW TRANSLATION
 Sweden_eastern.09.d: "Rusko odmítlo návrh na strategickou energetickou dohodu. Švédsko se musí nyní poohlédnout po dalších energetických partnerů." # todo: NEW TRANSLATION
 Sweden_eastern.09.a: "Bohužel." # todo: NEW TRANSLATION
 Sweden_eastern.10.t: "Návrh na výměnu vojenské techniky." # todo: NEW TRANSLATION
 Sweden_eastern.10.d: "Švédsko navrhuje společný program výměny vojenské techniky mezi SAAB a Lidovou osvobozeneckou armádou PLA, s cílem podpořit inovace a strategickou koordinaci." # todo: NEW TRANSLATION
 Sweden_eastern.10.a: "Přijímáme a zahájíme spolupráci." # todo: NEW TRANSLATION
 Sweden_eastern.10.b: "Odmítáme návrh." # todo: NEW TRANSLATION
 Sweden_eastern.11.t: "Čína přijímá výměnu technologií." # todo: NEW TRANSLATION
 Sweden_eastern.11.d: "Čína přijala návrh na společnou výměnu technologií. Inženýři ze SAAB a PLA zahájí společný výzkum." # todo: NEW TRANSLATION
 Sweden_eastern.11.a: "Skvělé." # todo: NEW TRANSLATION
 Sweden_eastern.12.t: "Čína odmítá výměnu technologií." # todo: NEW TRANSLATION
 Sweden_eastern.12.d: "Čína odmítla švédskou nabídku technologické spolupráce. Tím se omezují možnosti švédského obranného výzkumu a vývoje.\n" # todo: CHANGED
 Sweden_eastern.12.a: "Bohužel." # todo: NEW TRANSLATION
 Sweden_eastern.14.t: "Návrh na dohodu o minerálech." # todo: NEW TRANSLATION
 Sweden_eastern.14.d: "Švédsko navrhuje strategickou dohodu se Severní Koreou na zajištění vzácných minerálů a průmyslových zdrojů výměnou za hospodářskou spolupráci a uznání." # todo: NEW TRANSLATION
 Sweden_eastern.14.a: "Přijmout dohodu o minerálech." # todo: NEW TRANSLATION
 Sweden_eastern.14.b: "Odmítnout nabídku." # todo: NEW TRANSLATION
 Sweden_eastern.15.t: "Severní Korea přijímá dohodu o minerálech." # todo: NEW TRANSLATION
 Sweden_eastern.15.d: "Severní Korea přijala návrh. Švédsko bude zahajovat dovoz klíčových strategických zdrojů a byla navázána omezená spolupráce." # todo: NEW TRANSLATION
 Sweden_eastern.15.a: "Skvělé." # todo: NEW TRANSLATION
 Sweden_eastern.16.t: "Severní Korea odmítá dohodu." # todo: NEW TRANSLATION
 Sweden_eastern.16.d: "Severní Korea odmítla švédskou nabídku dohody o nerostných surovinách. To může zkomplikovat dlouhodobou strategii Švédska v oblasti průmyslového zásobování.\n" # todo: CHANGED
 Sweden_eastern.16.a: "Bohužel." # todo: NEW TRANSLATION
 Sweden_eastern.17.t: "Návrh na výměnu vojenského průmyslu." # todo: NEW TRANSLATION
 Sweden_eastern.17.d: "Švédsko navrhuje tajnou dohodu se Severní Koreou o výměně know-how ve vojenském průmyslu a nářadí. Tato spolupráce by mohla zlepšit výrobu na obou stranách, avšak riskuje mezinárodní odpor." # todo: NEW TRANSLATION
 Sweden_eastern.17.a: "Souhlasím s výměnou." # todo: NEW TRANSLATION
 Sweden_eastern.17.b: "Nemůžeme si to dovolit riskovat." # todo: NEW TRANSLATION
 Sweden_eastern.18.t: "Severní Korea přijímá dohodu o průmyslové spolupráci" # todo: NEW TRANSLATION
 Sweden_eastern.18.d: "Severní Korea souhlasila s dohodou o průmyslové spolupráci. Vzájemný rozvoj vojenského průmyslu je nyní v plném proudu.\n" # todo: NEW TRANSLATION
 Sweden_eastern.18.a: "Neočekávané spojenectví" # todo: NEW TRANSLATION
 Sweden_eastern.19.t: "Severní Korea odmítá návrh" # todo: NEW TRANSLATION
 Sweden_eastern.19.d: "Severní Korea odmítla průmyslovou dohodu. Švédsko musí hledat jiné způsoby rozšíření své vojenské produkce.\n" # todo: NEW TRANSLATION
 Sweden_eastern.19.a: "Promarněná příležitost" # todo: NEW TRANSLATION
 Sweden_eastern.20.t: "Švédský návrh na vybudování Arktické obchodní železnice" # todo: NEW TRANSLATION
 Sweden_eastern.20.d: "Švédská vláda navrhla investovat do společného infrastrukturního projektu: vysokokapacitní železnice mezi Stockholmem a Murmanskem. Trať by posílila obchod a logistiku mezi našimi zeměmi podél arktického koridoru.\n" # todo: NEW TRANSLATION
 Sweden_eastern.20.a: "Vlaky vítězí" # todo: NEW TRANSLATION
 Sweden_eastern.21.t: "Návrh investiční dohody se Švédskem" # todo: NEW TRANSLATION
 Sweden_eastern.21.d: "Švédsko navrhlo bilaterální investiční dohodu se Venezuelou. Výměnou za venezuelskou ropu Švédsko investuje do venezuelské infrastruktury a pokročilé technologie.\n" # todo: NEW TRANSLATION
 Sweden_eastern.21.a: "Přijmout dohodu" # todo: NEW TRANSLATION
 Sweden_eastern.21.b: "Musíme odmítnout" # todo: NEW TRANSLATION
 Sweden_eastern.22.t: "Venezuela přijímá investiční dohodu" # todo: NEW TRANSLATION
 Sweden_eastern.22.d: "Venezuela souhlasí s investiční dohodou. Švédsko obdrží ropu, zatímco Venezuela získá ze švédského know-how a investic do infrastruktury.\n" # todo: NEW TRANSLATION
 Sweden_eastern.22.a: "Vynikající spolupráce" # todo: NEW TRANSLATION
 Sweden_eastern.23.t: "Venezuela odmítá investiční dohodu" # todo: NEW TRANSLATION
 Sweden_eastern.23.d: "Venezuela odmítla švédský návrh vzájemné investiční dohody. Diplomatická a energetická spolupráce nebude pokračovat.\n" # todo: CHANGED
 Sweden_eastern.23.a: "Nešťastné" # todo: NEW TRANSLATION
 Sweden_eastern.24.t: "Návrh na spolupráci v oblasti pobřežní těžby ropy" # todo: NEW TRANSLATION
 Sweden_eastern.24.d: "Švédsko navrhlo společnou iniciativu s Angola na vývoj pobřežních ropných plošin podél Atlantského pobřeží. Partnerství zajistí dodávky energie a posílí těžební infrastrukturu Angoly.\n" # todo: NEW TRANSLATION
 Sweden_eastern.24.a: "Přijmout společný podnik" # todo: NEW TRANSLATION
 Sweden_eastern.24.b: "Odmítnout návrh" # todo: NEW TRANSLATION
 Sweden_eastern.25.t: "Angola přijímá dohodu o pobřežní těžbě ropy" # todo: NEW TRANSLATION
 Sweden_eastern.25.d: "Angola přijala návrh. Švédsko bude investovat do společného vývoje pobřežních plošin, čímž rozšíří přístup k cenným ropným zásobám.\n" # todo: NEW TRANSLATION
 Sweden_eastern.25.a: "Cenné partnerství" # todo: NEW TRANSLATION
 Sweden_eastern.26.t: "Angola odmítá návrh" # todo: NEW TRANSLATION
 Sweden_eastern.26.d: "Angola odmítla švédskou nabídku společného rozvoje těžby na moři. Diplomatické kanály zůstávají otevřené, spolupráce však nebude pokračovat.\n" # todo: CHANGED
 Sweden_eastern.26.a: "Nešťastné" # todo: NEW TRANSLATION
 Sweden_eastern.27.t: "Návrh dohody o strategických kovech" # todo: NEW TRANSLATION
 Sweden_eastern.27.d: "Švédsko navrhlo dvoustrannou dohodu o zajištění přístupu ke vzácným a strategickým kovům Jihoafrické republiky. Na oplátku bude Švédsko investovat do těžebních technologií a průmyslových kapacit.\n" # todo: CHANGED
 Sweden_eastern.27.a: "Přijmout návrh" # todo: NEW TRANSLATION
 Sweden_eastern.27.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 Sweden_eastern.28.t: "Jihoafrická republika přijímá dohodu o kovech" # todo: NEW TRANSLATION
 Sweden_eastern.28.d: "Jihoafrická republika souhlasí s bilaterální dohodou. Švédsko získá zaručený přístup k vzácným kovům, zatímco Jihoafrická republika bude profitovat z technologických investic a spolupráce v těžbě.\n" # todo: NEW TRANSLATION
 Sweden_eastern.28.a: "Cenné partnerství" # todo: NEW TRANSLATION
 Sweden_eastern.29.t: "Jihoafrická republika odmítá dohodu" # todo: NEW TRANSLATION
 Sweden_eastern.29.d: "Jihoafrická republika odmítla navrženou dohodu o obchodu s kovů. Švédsko bude muset hledat jiné partnery pro své surovinové potřeby.\n" # todo: NEW TRANSLATION
 Sweden_eastern.29.a: "To je politováníhodné" # todo: CHANGED
 Sweden_eastern.30.t: "Návrh na lékařskou výměnu se Švédskem" # todo: NEW TRANSLATION
 Sweden_eastern.30.d: "Švédsko navrhlo dohodu o lékařské spolupráci: Kuba by poskytla své lékaře a globální zkušenosti s poskytováním zdravotní péče, zatímco Švédsko bude poskytovat výzkum, vybavení a biotechnologické know-how.\n" # todo: NEW TRANSLATION
 Sweden_eastern.30.a: "Přijmout lékařskou výměnu" # todo: NEW TRANSLATION
 Sweden_eastern.30.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 Sweden_eastern.31.t: "Kuba přijímá lékařskou výměnu" # todo: NEW TRANSLATION
 Sweden_eastern.31.d: "Kuba přijala dohodu o lékařské spolupráci. Nyní budou zahájeny společné zdravotnické mise a programy výměny výzkumu.\n" # todo: NEW TRANSLATION
 Sweden_eastern.31.a: "Pro globální zdraví" # todo: NEW TRANSLATION
 Sweden_eastern.32.t: "Kuba odmítá lékařskou výměnu" # todo: NEW TRANSLATION
 Sweden_eastern.32.d: "Kuba odmítla návrh na lékařskou spolupráci. Diplomatická zdravotní spolupráce nepokračuje.\n" # todo: NEW TRANSLATION
 Sweden_eastern.32.a: "Promarněná příležitost" # todo: NEW TRANSLATION
 Sweden_eastern.33.t: "Návrh švédsko-íránské petrochemické dohody" # todo: NEW TRANSLATION
 Sweden_eastern.33.d: "Švédská vláda předložila formální návrh íránskému ministerstvu ropy. Dohoda popisuje společné investice do zpracovatelské infrastruktury, pobřežních zařízení a pokročilého petrochemického zpracování. Švédsko usiluje o stabilní dodávky ropných zdrojů, zatímco Írán by měl prospěch ze švédského průmyslového know-how, vybavení a zahraničního kapitálu.\n\nPokud bude přijata, dohoda by mohla položit základ dlouhodobého strategického energetického partnerství." # todo: NEW TRANSLATION
 Sweden_eastern.33.a: "Přijmout petrochemickou dohodu" # todo: NEW TRANSLATION
 Sweden_eastern.33.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 Sweden_eastern.34.t: "Írán přijímá petrochemickou dohodu" # todo: NEW TRANSLATION
 Sweden_eastern.34.d: "Írán schválil navrhovanou dohodu se Švédskem. Společné podniky budou začínat vyvíjet a modernizovat rafinérské komplexy a rozšiřovat průmyslovou chemickou výrobu. Švédské inženýrské firmy se připravují vstoupit na íránský trh, což znamená novou kapitolu ve dvoustranných ekonomických vztazích.\n" # todo: NEW TRANSLATION
 Sweden_eastern.34.a: "Spustit partnerství" # todo: NEW TRANSLATION
 Sweden_eastern.35.t: "Írán odmítá petrochemickou dohodu" # todo: NEW TRANSLATION
 Sweden_eastern.35.d: "Írán odmítl švédskou nabídku na vytvoření petrochemického partnerství. Ačkoli diplomatické kanály zůstávají otevřené, příležitost ke společnému rozvoji energetiky byla odložena na neurčito.\n" # todo: CHANGED
 Sweden_eastern.35.a: "Nešťastné, ale pochopitelné" # todo: NEW TRANSLATION
 Sweden_eastern.36.t: "Návrh na výměnu technologie dronů" # todo: NEW TRANSLATION
 Sweden_eastern.36.d: "Švédsko navrhlo vstoupit do bilaterální technologické dohody s Íránem. Výměnou za přístup k návrhům bojových dronů a provozním datům poskytne Švédsko špičkové letecké systémy SAAB a systémy elektronického boje.\n\nObě země profitují z vzájemného sdílení bojově ověřených a vysoce technologických UAV systémů." # todo: NEW TRANSLATION
 Sweden_eastern.36.a: "Souhlasit se výměnou technologií" # todo: NEW TRANSLATION
 Sweden_eastern.36.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 Sweden_eastern.37.t: "Írán přijímá dohodu o dronech" # todo: NEW TRANSLATION
 Sweden_eastern.37.d: "Írán přijal bilaterální dohodu o technologii dronů. Spolupráce na vývoji UAV a vzájemném školení bude nyní zahájena mezi švédskými a íránskými firmami a vojenským personálem.\n" # todo: NEW TRANSLATION
 Sweden_eastern.37.a: "Zahájit společný program" # todo: NEW TRANSLATION
 Sweden_eastern.38.t: "Írán odmítá dohodu o dronech" # todo: NEW TRANSLATION
 Sweden_eastern.38.d: "Írán odmítl švédskou nabídku dohody o společném výzkumu a vývoji dronů. Iniciativa byla prozatím odložena.\n" # todo: CHANGED
 Sweden_eastern.38.a: "Nešťastné" # todo: NEW TRANSLATION
 Sweden.300.t: "Vzniká Sony Ericsson" # todo: NEW TRANSLATION
 Sweden.300.d: "Ericsson a Sony jsou připraveny spojit své divize mobilních telefonů do společného podniku. Sony přináší zkušenosti se spotřebitelským designem a médii, zatímco Ericsson přispívá odborností v oblasti mobilních komunikací." # todo: NEW TRANSLATION
 Sweden.300.a: "Založit Sony Ericsson" # todo: NEW TRANSLATION
 Sweden.300.b: "Ponechat divizi mobilních telefonů Ericssonu" # todo: NEW TRANSLATION
 Sweden.301.t: "Strategie mobilních telefonů Ericssonu" # todo: NEW TRANSLATION
 Sweden.301.d: "Trh chytrých telefonů se konsoliduje, protože konkurence sílí. Ericsson se může stáhnout ze spotřebitelských telefonů a soustředit se na síťovou infrastrukturu, nebo investovat další kapitál do zachování plně kontrolované výroby zařízení." # todo: NEW TRANSLATION
 Sweden.301.a: "Opustit výrobu mobilních telefonů" # todo: NEW TRANSLATION
 Sweden.301.b: "Znovu investovat do mobilních telefonů Ericssonu" # todo: NEW TRANSLATION
 Sweden.302.t: "Ericsson kupuje Vonage" # todo: NEW TRANSLATION
 Sweden.302.d: "Ericsson dokončil akvizici společnosti Vonage, čímž získal cloudové komunikační služby a rozsáhlou vývojářskou základnu. Společnost může vybudovat globální platformu síťových API, nebo ponechat svůj kapitál soustředěný na rádiové sítě." # todo: NEW TRANSLATION
 Sweden.302.a: "Vybudovat platformu API Vonage" # todo: NEW TRANSLATION
 Sweden.302.b: "Zůstat zaměřeni na rádiové sítě" # todo: NEW TRANSLATION
 Sweden.310.t: "Šestnáct člunů pro obojživelný sbor" # todo: NEW TRANSLATION
 Sweden.310.d: "Obojživelný sbor chce šestnáct lehkých zásobovacích plavidel a loděnice Djupvik má hliníkovou výrobní linku, na níž je může postavit. Námořnictvo požaduje vojenskou specifikaci: tlumiče nárazů, řízení škod a trup, který vydrží zásah. Komerční zákazníci loděnice chtějí stejných čtyřiadvacet metrů za podstatně méně peněz — a chtějí je hned." # todo: NEW TRANSLATION
 Sweden.310.a: "Postavit Lätt trossbåt podle námořních specifikací" # todo: NEW TRANSLATION
 Sweden.310.b: "Pokračovat v komerční výrobě" # todo: NEW TRANSLATION
 Sweden.311.t: "Čluny třídy Tapper se vracejí do loděnice" # todo: NEW TRANSLATION
 Sweden.311.d: "Třída Tapper hlídkuje v souostroví od roku 1993 a měla být vyřazena již před lety. Nestalo se tak. Šest trupů se vrací do Djupviku a otázkou je rozsah modernizace: kompletní sonarová souprava Kongsberg a nové motory, nebo dostatek oceli a nátěru, aby vydržely plavat další desetiletí." # todo: NEW TRANSLATION
 Sweden.311.a: "Osadit sonarovou soupravu Kongsberg" # todo: NEW TRANSLATION
 Sweden.311.b: "Prodloužit trupy a nic víc" # todo: NEW TRANSLATION
 Sweden.312.t: "Öckeröborgen získává místo v loděnici" # todo: NEW TRANSLATION
 Sweden.312.d: "Pět set osmnáct trupů od roku 1894 — a loděnice je stále dost malá na to, aby ji někdo koupil. Skupina Öckeröborgen předložila nabídku: kapitál na skluz, druhou výrobní halu a provozní kapitál k ucházení se o zakázky, na které byl Djupvik vždy příliš malý. Rodina, která loděnici vedla po čtyři generace, má podepsat." # todo: NEW TRANSLATION
 Sweden.312.a: "Přijmout investici" # todo: NEW TRANSLATION
 Sweden.312.b: "Zachovat nezávislost loděnice" # todo: NEW TRANSLATION
