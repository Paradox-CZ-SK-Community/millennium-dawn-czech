 Sweden_foci.3001.d2: "Švédská vláda oficiálně požádala o nákup vrtulníků Ka-52 Alligator, čímž usiluje o diverzifikaci flotily útočných vrtulníků a prozkoumání nových obranných partnerství." # todo: NEW TRANSLATION
