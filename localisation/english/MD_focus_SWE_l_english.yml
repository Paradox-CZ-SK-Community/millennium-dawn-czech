 SWE_swede_ship_idea1_desc: "Skluz v Djupviku a kompozitní hala v Hunnebostrandu pracují na plnou kapacitu. Loděnice, která dokáže vyrobit trup každých několik týdnů, je loděnicí, o niž se stát může opřít, když potřebuje postavit další loděnice." # todo: NEW TRANSLATION
