 SWE_swedish_alone: "Digitální suverenita" # todo: NEW TRANSLATION
 SWE_swedish_alone_desc: "Švédsko bude vyvíjet vlastní bezpečné digitální systémy, minimalizovat závislost na zahraničních platformách a zajistit integritu dat." # todo: NEW TRANSLATION
 SWE_Vinnova_digital_innovation: "Granty na digitální inovace Vinnova" # todo: NEW TRANSLATION
 SWE_Vinnova_digital_innovation_desc: "Inovační agentura Vinnova bude vést snahy financovat špičkový digitální výzkum a podnikání po celé zemi." # todo: NEW TRANSLATION
 SWE_E_legitimation_for_citizen: "E-ID pro každého občana" # todo: NEW TRANSLATION
 SWE_E_legitimation_for_citizen_desc: "Bezpečný, universální elektronický identifikační systém zajistí, že všichni Švédi budou mít přístup k moderním digitálním službám." # todo: NEW TRANSLATION
 SWE_IT_start_up: "Podpora IT startupů" # todo: NEW TRANSLATION
 SWE_IT_start_up_desc: "Posílíme švédský ekosystém začínajících firem prostřednictvím financování, mentorství a přístupu na globální digitální trhy." # todo: CHANGED
 SWE_second_digital_agenda: "Digitální agenda 2.0" # todo: NEW TRANSLATION
 SWE_second_digital_agenda_desc: "Jakmile je základ položen, je čas rozšířit naše digitální ambice, cloudovou strategii, rámce AI a globální vedení." # todo: NEW TRANSLATION
 SWE_coding_in_school: "Programování v osnovách" # todo: NEW TRANSLATION
