 Sweden_foci.4.d: "Abychom posílili naše dělostřelecké schopnosti, uvažuje Švédsko o pořízení vyspělých samohybných dělostřeleckých systémů. Tento strategický krok má posílit naši obrannou pozici a zajistit interoperabilitu s potenciálními partnery." # todo: NEW TRANSLATION
