 Sweden_foci.4001.d1: "Německo obdrželo žádost Švédska o pořízení Panzerhaubitze 2000. Schválení této žádosti by posílilo obranné vazby mezi oběma zeměmi a posílilo regionální bezpečnost." # todo: NEW TRANSLATION
 Sweden_foci.4001.d2: "Rusko obdrželo žádost Švédska o pořízení samohybných houfnic 2S19 Msta. Schválení této žádosti by mohlo otevřít cesty k vojenské spolupráci a ovlivnit budoucí vztahy." # todo: NEW TRANSLATION
 Sweden_foci.4001.d3: "Norsko obdrželo Švédsko nabídku na spolupráci na vývoji a výrobě Archer Artillery System. Přijetí této nabídky posílí regionální obrannou spolupráci a podpoří domácí průmysl." # todo: NEW TRANSLATION
