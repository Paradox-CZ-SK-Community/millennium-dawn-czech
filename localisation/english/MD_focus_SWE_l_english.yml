 Sweden_foci.5001.d1: "Právě jsme obdrželi Švédskou žádost o pořízení MH-60L Black Hawk. Schválení této žádosti by posílilo obranné vazby mezi oběma zeměmi a zlepšilo taktické transportní schopnosti Švédska." # todo: NEW TRANSLATION
 Sweden_foci.5001.d2: "Právě jsme obdrželi švédskou žádost o pořízení vrtulníků Mi-26. Schválení této žádosti by mohlo otevřít cesty pro vojenskou spolupráci a významně posílit švédskou kapacitu pro těžké přepravy." # todo: NEW TRANSLATION
 Sweden_foci.5001.d3: "Právě jsme obdrželi švédskou žádost o pořízení vrtulníků AS532 Cougar. Schválení této žádosti by posílilo obranné vazby a poskytlo Švédsku všestranné prostředky střední nosnosti pro přepravu." # todo: NEW TRANSLATION
