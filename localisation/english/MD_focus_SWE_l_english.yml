 Sweden_foci.5.d: "Abychom zvýšili logistické schopnosti a schopnosti přepravy jednotek, Švédsko zvažuje pořízení pokročilých transportních vrtulníků. Tento krok má posílit naši operační efektivitu a podpořit mezinárodní obrannou spolupráci." # todo: NEW TRANSLATION
