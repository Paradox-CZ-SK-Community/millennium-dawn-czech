 Sweden_foci.7003.d1: "Německo zamítlo žádost Švédska o pořízení korvet MEKO A-100, s odůvodněním strategických hledisek a existujících závazků. Toto rozhodnutí může ovlivnit budoucí obrannou spolupráci." # todo: NEW TRANSLATION
 Sweden_foci.7003.d2: "Rusko odmítlo návrh Švédska na pořízení korvet Tarantul-tříd, poukazující na geopolitické dopady a strategické priority. Toto odmítnutí je ztracená příležitost pro posílení vojenské spolupráce." # todo: NEW TRANSLATION
 Sweden_foci.7003.d3: "Finsko odmítlo žádost Švédska o pořízení Hamina-třídních korvet, zaměřené na své obranné požadavky a exportní politiky. Toto rozhodnutí může ovlivnit budoucí diplomatické vztahy." # todo: NEW TRANSLATION
 Sweden_foci.7003.o1: "Zaplatí, spustí ABBA sjednocení" # todo: NEW TRANSLATION
 Sweden_foci.7004.t: "Slavnostní uvedení nových švédských korvet do služby" # todo: NEW TRANSLATION
 Sweden_foci.7004.d1: "Při slavnostní ceremonií ve Stockholmu byly naše nově získané korvety MEKO A-100 oficiálně zařazeny do švédského námořnictva. Akce se zúčastnilo množství německých zástupců, čímž bylo zdůrazněno posílení vazeb mezi našimi zeměmi a nastíněna budoucí spolupráce." # todo: NEW TRANSLATION
 Sweden_foci.7004.d2: "Při slavnostní ceremonií ve Stockholmu byly naše korvety Tarantul-tříd oficiálně zařazeny do švédského námořnictva. Přítomnost ruských představitelů podtrhla rostoucí obrannou spolupráci mezi našimi zeměmi a mohla prospět budoucím vztahům." # todo: NEW TRANSLATION
 Sweden_foci.7004.d3: "Při slavnostní ceremonií ve Stockholmu byly naše Hamina-třídní korvety oficiálně zařazeny do švédského námořnictva. Akce byla poctěna vysoce postavenými zástupci z Finska a zdůraznila hluboké obranné partnerství a jeho pozitivní dopad na naše budoucí vztahy." # todo: NEW TRANSLATION
 Sweden_foci.7004.o1: "Oslavte tento milník v námořním pokroku." # todo: NEW TRANSLATION
 Sweden_foci.10.t: "Strategická integrace: Infrastruktura jako priorita" # todo: NEW TRANSLATION
 Sweden_foci.10.d: "V stále nestabilnějším světě už infrastruktura není pouze otázkou civilního plánování. Železnice, digitální sítě, přístavy a dopravní koridory se staly nezbytnými součástmi vojenské připravenosti a strategické mobility. Švédsko formálně navrhlo společnou evropskou iniciativu na modernizaci a propojení kritické infrastruktury po celém kontinentu, s dvojím využitím pro hospodářskou odolnost i obranné účely.\n\nNávrh podporovaný švédskými obrannými plánovači a ministerstvem podnikání počítá s koordinovaným rozšířením logistických kapacit, standardizací protokolů vojenské mobility a posílením kritických uzlů proti sabotáži či kybernetickému útoku. Zdůrazňuje potřebu zabezpečit transbaltská spojení, zlepšit operační tok NATO od Arktidy po střední Evropu a umožnit scénáře rychlého nasazení v případě hybridních či konvenčních hrozeb.\n\nAčkoli je návrh prezentován jako příspěvek k hospodářské soudržnosti EU a cílům zelené transformace, jeho základní logika je zcela zjevně strategická. Švédsko se chce postavit nejen do role logistického uzlu, ale také aktivního tvůrce evropské geoekonomické a obranné architektury.\n\nReakce klíčových evropských partnerů rozhodne, zda tato iniciativa znamená zlom v kolektivní odolnosti, nebo podlehne roztříštěným národním zájmům a politické setrvačnosti." # todo: CHANGED
 Sweden_foci.10.a: "Schválte návrh, Evropa musí být připravena." # todo: NEW TRANSLATION
 Sweden_foci.10.b: "Odmítněte, toto přesahuje civilní infrastrukturu." # todo: NEW TRANSLATION
 Sweden_foci.101.t: "[From.GetNamewithFlag] se připojuje k infrastrukturní iniciativě" # todo: CHANGED
 Sweden_foci.101.d: "[From.GetNamewithFlag] se oficiálně zavázalo k účasti na naší celoevropské infrastrukturní iniciativě. Tím uznává, že silnice, přístavy a železniční tratě nejsou jen ekonomickými tepnami, ale také strategickými aktivy v době rostoucí nejistoty. Jejich vedení uznalo, že civilní a vojenská logistika musí být v celé Evropě harmonizována, aby byla zajištěna rychlá reakce, bezpečné dodavatelské řetězce a regionální odolnost.\n\nToto rozhodnutí posiluje schopnost obou našich zemí odolávat vojenskému tlaku a přizpůsobovat se mu, zároveň podporuje obchod a nadnárodní spolupráci. V zákulisí již vojenští plánovači koordinují společné logistické protokoly, opatření kybernetické odolnosti a nouzové trasy pro mobilitu.\n\nJejich účast vysílá silné poselství: Evropa nebude zaskočena. Jednota v infrastruktuře je jednotou v obraně." # todo: CHANGED
 Sweden_foci.101.a: "Moudré rozhodnutí." # todo: NEW TRANSLATION
 Sweden_foci.102.t: "§Y[From.GetNamewithFlag]§! odmítá náš návrh" # todo: CHANGED
 Sweden_foci.102.d: "§Y[From.GetNamewithFlag]§! odmítlo naši nabídku připojit se ke strategické infrastrukturní iniciativě s odvoláním na obavy o suverenitu, rozpočtová omezení nebo odlišné priority. Ačkoli je toto rozhodnutí prezentováno pragmaticky, v konečném důsledku signalizuje neochotu investovat do dlouhodobé odolnosti a vzájemné obranné kapacity.\n\nV současné bezpečnostní situaci s sebou takové izolacionistické myšlení nese rizika. Bez integrované logistiky je rychlé nasazení sil nejisté. Bez společných standardů zůstávají dodavatelské řetězce zranitelné. A bez politické vůle se evropské kolektivní odstrašení oslabuje.\n\nAčkoli je to politováníhodné, budeme pokračovat s ochotnými partnery. Pokud vypukne vojenská krize, mohou zjistit, že cena nečinnosti převyšuje jakékoli krátkodobé úspory. Infrastruktura není luxus – je lešením suverenity." # todo: CHANGED
 Sweden_foci.102.a: "Jejich ztráta." # todo: NEW TRANSLATION
 Sweden_foci.101.other_t: "Královská iniciativa dokončena" # todo: NEW TRANSLATION
 Sweden_foci.101.other_d: "Odpovědi na tuto královskou iniciativu již byly obdrženy a zpracovány. Není zde již nic dalšího, o čem bychom měli rozhodovat." # todo: NEW TRANSLATION
 Sweden_foci.101.other_a: "Vzato na vědomí." # todo: NEW TRANSLATION
 Sweden_foci.102.other_t: "Královská iniciativa dokončena" # todo: NEW TRANSLATION
 Sweden_foci.102.other_d: "Odpovědi na tuto královskou iniciativu již byly obdrženy a zpracovány. Není zde již nic dalšího, o čem bychom měli rozhodovat." # todo: NEW TRANSLATION
 Sweden_foci.102.other_a: "Vzato na vědomí." # todo: NEW TRANSLATION
 Sweden_foci.11.t: "§Y[SWE.GetNamewithFlag]§! Nabízí připojení ke Kybershield iniciativě" # todo: NEW TRANSLATION
 Sweden_foci.11.d: "V dnešním světě už válka není omezena na bojiště nebo konvenční zbraně. Konflikty se vyvinuly v tiché, elegantní a často veřejnosti neviditelné formy. Kybernetické útoky, dezinformační kampaně, digitální sabotáže a operace vlivu řízené umělou inteligencí nyní ohrožují nejen vojenské struktury, ale každého občana, instituci i podnik.\n\n§Y[SWE.GetNamewithFlag]§! nám nabídlo možnost připojit se k iniciativě Cybershield, mnohonárodnímu rámci spolupráce zaměřenému na budování kolektivní kybernetické odolnosti. Program zahrnuje společná monitorovací centra, sdílené zpravodajství o hrozbách a koordinované reakce na nepřátelské průniky a taktiky hybridního válčení.\n\nJak digitalizace naší společnosti každým rokem prohlubuje, kybernetická oblast se stává jedním z rozhodujících bojišť národní bezpečnosti. Připojení by posílilo naše schopnosti a začlenilo nás do širší obranné sítě. Přijetí nabídky však také znamená určitou míru technologického sladění a sdílené suverenity v digitálních otázkách." # todo: CHANGED
 Sweden_foci.11.a: "Připojíme se, jednotní jsme bezpečnější." # todo: NEW TRANSLATION
 Sweden_foci.11.b: "Zůstáváme sami, naše síla je nezávislost." # todo: NEW TRANSLATION
 Sweden_foci.111.t: "§Y[From.GetNamewithFlag]§! se připojuje k iniciativě Cybershield" # todo: CHANGED
 Sweden_foci.111.d: "§Y[From.GetNamewithFlag]§! oficiálně souhlasil s účastí na naší iniciativě Cybershield. Jeho rozhodnutí představuje zásadní krok k vytvoření celoevropské architektury digitální obrany, v níž si důvěryhodní partneři vyměňují informace, posilují svou civilní i vojenskou kybernetickou odolnost a jednotně čelí hybridním hrozbám.\n\nV rámci integračního procesu budou zavedeny společné protokoly pro odhalování hrozeb, ochranu kritické infrastruktury a schopnosti rychlé reakce. Očekává se, že tato spolupráce výrazně posílí naše operační povědomí i schopnost odolávat složitým, vícevrstvým kybernetickým útokům.\n\nJejich závazek neposiluje jen naši digitální hranici potvrzuje také sdílenou vizi suverenity a strategické autonomie v 21. století." # todo: CHANGED
 Sweden_foci.111.a: "Skvělé, jednota v kyberprostoru." # todo: NEW TRANSLATION
 Sweden_foci.112.t: "§Y[From.GetNamewithFlag]§! odmítá iniciativu Cybershield" # todo: CHANGED
 Sweden_foci.112.d: "§Y[From.GetNamewithFlag]§! odmítl naše pozvání k účasti na iniciativě Cybershield. Ať už je jejich motivací skepse, politická kalkulace nebo touha po digitální neangažovanosti, jejich rozhodnutí vysílá signál, že se nechtějí začlenit do kolektivního rámce kybernetické bezpečnosti.\n\nToto odmítnutí nejen oslabuje potenciální rozsah sdílení informací a digitálního odstrašení v Evropě, ale může také izolovat §Y[From.GetNamewithFlag]§! v době, kdy dezinformace, sabotáže a škodlivý kód nerespektují žádné hranice.\n\nAčkoli je to zklamání, jejich nepřítomnost naše úsilí nezastaví. Budeme pokračovat s těmi, kteří chápou sázky a jsou ochotni podle toho jednat." # todo: CHANGED
 Sweden_foci.112.a: "Krátkozraký krok." # todo: NEW TRANSLATION
 Sweden_foci.12.t: "Švédsko navrhuje vzájemné hospodářské fórum" # todo: NEW TRANSLATION
 Sweden_foci.12.d: "V kroku zaměřeném na posílení regionální spolupráce a odolnosti průmyslu navrhl §Y[SWE.GetNameWithFlag]§! vznik vzájemného hospodářského fóra. Cílem je institucionalizovat ekonomický dialog, koordinaci investic a dlouhodobá průmyslová partnerství mezi zúčastněnými státy.\n\nŠvédsko tvrdí, že prohlubování hospodářských vazeb, zejména v odvětvích jako zelené technologie, pokročilá výroba a digitální inovace, by nejen stabilizovalo růst, ale také posílilo strategickou autonomii v čím dál více polarizované globální ekonomice. Společné nákupní programy, mechanizmy ochrany dodavatelských řetězců a sdílené inovační fondy patří k navrhovaným nástrojům.\n\nÚčast na tomto fóru by znamenala přístup ke společnému výzkumu, větší integraci průmyslových strategií a potenciál pro dlouhodobou konkurenceschopnost na kontinentálním měřítku.\n\nOtázka zní: Přejeme si formovat tuto novou architekturu, nebo zůstat mimo ni?" # todo: NEW TRANSLATION
 Sweden_foci.12.a: "Vynikající iniciativa, do které se zapojíme." # todo: NEW TRANSLATION
 Sweden_foci.12.b: "Nemáme zájem." # todo: NEW TRANSLATION
 Sweden_foci.121.t: "§Y[From.GetNamewithFlag]§! se připojuje k hospodářskému fóru" # todo: CHANGED
 Sweden_foci.121.d: "§Y[From.GetNamewithFlag]§! přijal náš návrh na vytvoření vzájemného hospodářského fóra. Jeho rozhodnutí představuje pozitivní krok k lepší koordinaci průmyslové politiky, odolnosti regionálních dodavatelských řetězců a růstu založenému na inovacích.\n\nJiž probíhají první dvoustranná jednání, která zkoumají spolupráci v oblastech, jako jsou energetické systémy, digitální trhy a technologie zelené transformace. Tato aliance by se mohla stát vzorem pragmatického, soběstačného hospodářského rozvoje v době proměnlivé globální obchodní dynamiky.\n\nŠvédská iniciativa získává na síle a s každým novým účastníkem se její potenciál násobí." # todo: CHANGED
 Sweden_foci.121.a: "Nadějné partnerství." # todo: NEW TRANSLATION
 Sweden_foci.122.t: "§Y[From.GetNamewithFlag]§! odmítá pozvání do hospodářského fóra" # todo: CHANGED
 Sweden_foci.122.d: "§Y[From.GetNamewithFlag]§! se rozhodl nezúčastnit navrhovaného vzájemného hospodářského fóra. Ať už kvůli obavám o suverenitu, nesouladu priorit nebo neochotě koordinovat hospodářské strategie, toto odmítnutí omezuje rozsah toho, co mohlo být silným regionálním rámcem.\n\nAčkoli je to politováníhodné, Švédsko bude pokračovat s podobně smýšlejícími partnery. Cíl fóra zůstává nezměněn: vytvořit odolnou a spolupracující hospodářskou architekturu vhodnou pro nejistou budoucnost.\n\nPokud se okolnosti změní, dveře mohou zůstat otevřené, ale znovu získat tempo může být obtížné." # todo: CHANGED
 Sweden_foci.122.a: "Jejich rozhodnutí, jejich důsledky." # todo: NEW TRANSLATION
 Sweden_foci.13.t: "Švédsko navrhuje strategickou spolupráci think tanků." # todo: NEW TRANSLATION
 Sweden_foci.13.d: "§Y[SWE.GetNameWithFlag]§! se na nás obrátilo s návrhem na posílení spolupráce mezi našimi vedoucími think tanky, akademickými institucemi a poradenckými orgány v oblasti politiky. Cílem je sladit strategické výhledy, koordinovat dlouhodobý výzkum politiky a vytvořit sdílenou znalostní infrastrukturu schopnou předvídat geopolitické změny a hybridní hrozby.\n\nTaková spolupráce by zahrnovala pravidelné dialogy o politice, společné plánování scénářů, společné publikace a programy výměny expertů. Švédsko věří, že sdílením intelektuálního kapitálu mohou naše země lépe vycvičit strategickou předvídavost a lépe se připravit na vznikající výzvy v obraně, technologiích, energetické bezpečnosti a hospodářské odolnosti.\n\nAčkoli by fórum zůstalo nezávislé na přímé politické kontrole, jeho vliv na tvorbu politik by mohl být významný. Otázka zní: jsme připraveni myslet spolu, nebo budeme nadále rozumnět izolovaně?" # todo: NEW TRANSLATION
 Sweden_foci.13.a: "Vědění je moc – zapojíme se." # todo: NEW TRANSLATION
 Sweden_foci.13.b: "Upřednostňujeme udržet plnou autonomii." # todo: NEW TRANSLATION
 Sweden_foci.131.t: "§Y[From.GetNamewithFlag]§! se připojuje k síti strategických think-tanků" # todo: CHANGED
 Sweden_foci.131.d: "§Y[From.GetNamewithFlag]§! přijal naše pozvání k vybudování spolupracující sítě výzkumných institucí, center strategických studií a poradenských think-tanků. Tato nová vrstva spolupráce otevírá zadní kanál strukturované intelektuální výměny, schopný utvářet národní strategie a budovat odolnost vůči dezinformacím, kognitivnímu válčení a roztříštěnosti politik.\n\nPrvní společné sympozium se již plánuje. Témata zahrnují digitální suverenitu, vojensko-civilní propojení, energetickou transformaci a dopad vznikajících technologií na národní bezpečnost.\n\nNejde jen o akademickou spolupráci jde o strategické sladění prostřednictvím idejí." # todo: CHANGED
 Sweden_foci.131.a: "Chytré rozhodnutí." # todo: NEW TRANSLATION
 Sweden_foci.132.t: "§Y[From.GetNamewithFlag]§! odmítá spolupráci strategických think-tanků" # todo: CHANGED
 Sweden_foci.132.d: "§Y[From.GetNamewithFlag]§! se rozhodl nezapojit do švédské navrhované sítě pro hlubší spolupráci think-tanků. Ať už kvůli ideologickému odstupu, obavám z vlivu nebo upřednostňování národní intelektuální autonomie, jeho odmítnutí zužuje prostor pro přeshraniční strategický dialog.\n\nAčkoli je to politováníhodné, iniciativa bude pokračovat s ochotnými účastníky. V době, kdy jsou informace bojištěm a vhled zbraní, může mít volba izolace namísto spolupráce svou cenu.\n\nRozhovor bude pokračovat s nimi i bez nich." # todo: CHANGED
 Sweden_foci.132.a: "Nechte je propásnout budoucnost." # todo: NEW TRANSLATION
 Sweden_foci.14.t: "Švédsko nás zve na společné vojenské cvičení" # todo: NEW TRANSLATION
 Sweden_foci.14.d: "§Y[SWE.GetNameFlag]§! rozšířilo pozvání k účasti na koordinovaném vojenském cvičení na území Švédska. Cvičení by mělo simulovat multi-domenové obranné scénáře, včetně ochrany pobřeží, odolnosti vůči kybernetické válce a rychlého nasazení smíšených jednotek podle standardů NATO a národních.\n\nKromě operačních výhod jde také o diplomatický signál. Švédsko se ukazuje jako důvěryhodný bezpečnostní partner a testuje svou připravenost i připravenost svých spojenců za realistických podmínek. Cvičení nám poskytuje příležitost posoudit švédské schopnosti, vylepšit interoperabilitu a posílit vzájemnou důvěru.\n\nSpolečná vojenská cvičení slouží jako odstrašování i příprava. Ať už se rozhodneme připojit, pošle vlastní signál." # todo: NEW TRANSLATION
 Sweden_foci.14.a: "Zúčastníme se – síla spolupráce je skutečná síla." # todo: NEW TRANSLATION
 Sweden_foci.14.b: "Odmítáme – naše doktrína zůstává suverénní." # todo: NEW TRANSLATION
 Sweden_foci.141.t: "§Y[From.GetNamewithFlag]§! se připojuje ke švédskému vojenskému cvičení" # todo: CHANGED
 Sweden_foci.141.d: "§Y[From.GetNamewithFlag]§! přijal naše pozvání k účasti na nadcházejícím společném vojenském cvičení. Jeho účast rozšiřuje rozsah a složitost cvičení a přináší cenné testování interoperability velitelských struktur, logistických systémů a protokolů koordinace v reálném čase.\n\nOčekává se, že událost budou zblízka sledovat pozorovatelé spojeneckých států a obranní přidělenci ze třetích zemí. Tato spolupráce viditelně posiluje regionální bezpečnost a ukazuje rostoucí roli Švédska jako schopného a spolehlivého obranného aktéra.\n\nDůvěra se buduje činy a toto cvičení promluví hlasitěji než slova." # todo: CHANGED
 Sweden_foci.141.a: "Silný signál potenciálním protivníkům." # todo: NEW TRANSLATION
 Sweden_foci.142.t: "§Y[From.GetNamewithFlag]§! odmítá pozvání k vojenskému cvičení" # todo: CHANGED
 Sweden_foci.142.d: "§Y[From.GetNamewithFlag]§! odmítl účast na našich plánovaných vojenských cvičeních. Ačkoli neuvedl oficiální důvod, rozhodnutí může pramenit z politické opatrnosti, logistických obav nebo neochoty působit dojmem příliš těsného spojení se švédským či aliančním obranným postojem.\n\nTuto nepřítomnost si mohou všimnout spojenci i protivníci. V dobách nejistoty ochota či neochota společně cvičit mnoho vypovídá o strategické orientaci národa.\n\nCvičení však přesto proběhnou. Ti, kteří se dostaví, utvářejí budoucnost." # todo: CHANGED
 Sweden_foci.142.a: "Zvolili mlčení nad solidárností." # todo: NEW TRANSLATION
 Sweden_foci.143.t: "NATO–švédské cvičení začíná v Norrbotten" # todo: NEW TRANSLATION
 Sweden_foci.143.d: "Boden, v odlehlé oblasti Norrbottens län, se stal epicentrem jednoho z nejambicióznějších vojenských cvičení, jaké kdy byly uspořádány na švédské půdě. Obvykle spíše známý pro sobí pastev, sněhem pokryté ticho a občasný výkřik 'Perkele!' ozývající se z finské hranice, tato tichá severní oblast nyní zní koordinovaným pohybem tanků, letadel a speciálních jednotek.\n\nSpolečné švédsko-náto cvičení spojí řadu moderních kapacit: stíhací letecké esky Gripenu a Eurofighteru bojují na obloze, několik variant Leopardů duní po zmrzlém terénu a elitní jednotky provádějí simulované výsadky na ledu Buddbyträsketu.\n\nKromě vojenské exhibition je toto cvičení signálem strategické připravenosti, interoperability spojenců a švédské doktríny totální obrany, která se stává hmatatelnou. Civilní připravenost a vojenská profesionalita zde nejsou protikladné hodnoty – jsou to dvě strany jedné mince.\n\n§YSi vis pacem, para bellum§! není jen latinská rétorika. Je to princip, který je vpletený do nordického způsobu myšlení – tichý, soustředěný a vytrvalý." # todo: NEW TRANSLATION
 Sweden_foci.143.a: "Chladná zkouška pro svět s teplejší budoucností." # todo: NEW TRANSLATION
 Sweden_foci.23.t: "Švédsko uplatňuje nároky na naše území." # todo: NEW TRANSLATION
 Sweden_foci.23.d: "§Y[FROM.GetNameWithFlag]§! odmítl švédský návrh na hlubší integraci. Národní zájmy, ústavní překážky nebo veřejné mínění zřejmě převážily nad vyhlídkou sjednocení či aliance.\n\nDiplomatické kanály zůstávají otevřené, tento neúspěch však představuje kritický okamžik pro širší regionální vizi Švédska a zdůrazňuje křehkost severské jednoty pod tlakem." # todo: CHANGED
 Sweden_foci.23.a: "Měli bychom je přijmout jako osadníky" # todo: NEW TRANSLATION
 Sweden_foci.23.b: "Oni nikdy nepřejdou přes naši hranici" # todo: NEW TRANSLATION
 Sweden_foci.24.t: "Teritoriální nárok přijat" # todo: NEW TRANSLATION
 Sweden_foci.24.d: "§Y[FROM.GetNameWithFlag]§! přijal švédskou přítomnost v nárokovaných regionech. Dohoda, rámovaná jako řízené usídlení a bilaterální koordinační proces, efektivně posouvá správní vliv ve prospěch Švédska.\n\nNápětí napětí ustupují, začínají infrastrukturní projekty a vznikají mechanismy společného řízení, i když otázky dlouhodobé suverenity zůstávají politicky citlivé." # todo: NEW TRANSLATION
 Sweden_foci.24.a: "Začít přípravy na integraci" # todo: NEW TRANSLATION
 Sweden_foci.25.t: "Teritoriální nárok zamítnut" # todo: NEW TRANSLATION
 Sweden_foci.25.d: "§Y[FROM.GetNameWithFlag]§! ostře odmítl(a) teritoriální nárok vznesený §Y[ROOT.GetNameWithFlag]§!.\n\nOficiální prohlášení zdůraznilo národní integritu a varovalo, že jakékoli další švédské angažmá v dotčené oblasti bude považováno za nepřátelský akt. Diplomatický tón se zhoršuje a riziko regionální nestability roste." # todo: NEW TRANSLATION
 Sweden_foci.25.a: "Na to nezapomeneme" # todo: NEW TRANSLATION
 Sweden_foci.26.t: "Švédští separatisté požadují připojení k pevnině" # todo: NEW TRANSLATION
 Sweden_foci.26.d: "Skupina švédsky mluvících separatistů v jedné z našich oblastí formálně podala žádost o anexi Království Švédska. Tvrdí historické vazby, kulturní blízkost a diskriminaci ze strany místních úřadů.\n\nZatímco §YŠvédsko§! oficiálně nepotvrzuje toto hnutí, veřejné hlasy ve Stockholmu hovoří o 'národní sjednocení'." # todo: NEW TRANSLATION
 Sweden_foci.26.a: "To je naše posvátná země" # todo: NEW TRANSLATION
 Sweden_foci.26.b: "Mohou ji mít dočasně" # todo: NEW TRANSLATION
 Sweden_foci.27.t: "Švédsko posílá pozvánku do frakce" # todo: NEW TRANSLATION
 Sweden_foci.27.d: "§YSweden§! has officially invited us to join their newly proposed Nordic faction. Představeno jako koalice neutrálních, demokratických nebo nezařazených států, toto spojenectví má posílit regionální odstrašení, sladit obrannou politiku a vybudovat sdílenou geopolitickou identitu.\n\nHistorické vazby, kulturní blízkost a sdílený zájem o soběstačnost jsou uváděny jako základy, ale strategické důsledky zůstávají složité." # todo: NEW TRANSLATION
 Sweden_foci.27.a: "Skvělý nápad – měli bychom se připojit" # todo: NEW TRANSLATION
 Sweden_foci.27.b: "Jsou opilí? Žádná šance" # todo: NEW TRANSLATION
 Sweden_foci.28.t: "Pozvánka do frakce odmítnuta" # todo: NEW TRANSLATION
 Sweden_foci.28.d: "§Y[FROM.GetNameWithFlag]§! odmítl švédské pozvání k připojení k severské frakci. Vláda s odvoláním na riziko zapletení, ztrátu suverenity nebo skepsi vůči strategickým ambicím Švédska zvolila odstup.\n\nToto odmítnutí vrhá pochybnosti na soudržnost regionálního obranného úsilí a může signalizovat rostoucí polarizaci v severní Evropě." # todo: CHANGED
 Sweden_foci.28.a: "Zklamání, ale očekávané" # todo: NEW TRANSLATION
 Sweden_foci.29.t: "Pozvánka do frakce přijata" # todo: NEW TRANSLATION
 Sweden_foci.29.d: "§Y[FROM.GetNameWithFlag]§! se oficiálně připojil k severské frakci. Toto rozhodnutí představuje rozhodující zlom v regionální diplomacii a potvrzuje sladění se švédskou vizí koordinované vojenské připravenosti, technologické výměny a autonomie zahraniční politiky.\n\nSpolečné vojenské plánování a průmyslová spolupráce budou pravděpodobně následovat a upevní nový mocenský blok na severu." # todo: CHANGED
 Sweden_foci.29.a: "Vítáme je s otevřenou náručí" # todo: NEW TRANSLATION
 Sweden_foci.30.t: "Švédská investice do našeho bankovního sektoru" # todo: NEW TRANSLATION
 Sweden_foci.30.d: "§YŠvédsko§! nabídlo strukturovanou investiční iniciativu zaměřenou na modernizaci a stabilizaci našeho národního bankovního sektoru. Návrh zahrnuje kapitálové injekce, přístup k severským finančním technologiím a dlouhodobou integraci do sféry švédského měnového vlivu.\n\nProgram slibuje likviditu a modernizaci, někteří se však obávají rostoucího zahraničního vlivu na národní fiskální politiku." # todo: CHANGED
 Sweden_foci.30.a: "Přijmout – kapitál a stabilita" # todo: NEW TRANSLATION
 Sweden_foci.30.b: "Odmítnout – chráníme naši fiskální suverenitu" # todo: NEW TRANSLATION
 Sweden_foci.31.t: "Bankovní investice přijata" # todo: NEW TRANSLATION
 Sweden_foci.31.d: "§Y[FROM.GetNameWithFlag]§! souhlasil s naším návrhem investovat do jeho národního bankovního systému. Švédský kapitál a modely finanční správy budou zaváděny postupně a přinesou modernizaci i vliv.\n\nTím se prohlubuje ekonomický dosah Švédska a může se otevřít cesta k další harmonizaci fiskálních předpisů a regionální koordinaci měn." # todo: CHANGED
 Sweden_foci.31.a: "Silný finanční základ" # todo: NEW TRANSLATION
 Sweden_foci.32.t: "Bankovní investice odmítnuta" # todo: NEW TRANSLATION
 Sweden_foci.32.d: "§Y[FROM.GetNameWithFlag]§! odmítlo naši nabídku investovat do jejich bankovního sektoru. Motivováno obavami o národní autonomii, politickým odporem nebo konkurenčními aliancemi, jejich rozhodnutí znamená jasnou hranici švédskému ekonomickému dosahu.\n\nBudoucí spolupráce mohou být odloženy a důvěra ve společné projekty je alespoň prozatím oslabená." # todo: NEW TRANSLATION
 Sweden_foci.32.a: "Jejich ztráta, ne naše" # todo: NEW TRANSLATION
 Sweden_foci.33.t: "Švédsko navrhuje 'flexibilní' ekonomickou podporu" # todo: NEW TRANSLATION
 Sweden_foci.33.d: "Švédská delegace dorazila se návrhem 'odemknout náš růstový potenciál' prostřednictvím přímých investic do finančních a strategických odvětví. Zahrnutý balíček slibuje rozvojové financování a logistickou podporu, ale zahrnuje neformální očekávání, shovívavost regulací, insider přístup a sladění s některými zahraničními zájmy.\n\nAť už je to vnímáno jako pragmatická spolupráce nebo tiché zasahování, dohoda rozmazává hranici mezi ekonomickou pomocí a vlivem." # todo: NEW TRANSLATION
 Sweden_foci.33.a: "Přijmout – zaveďte přísný dohled, abychom omezili korupci" # todo: NEW TRANSLATION
 Sweden_foci.33.b: "Pokud z toho nemáme osobní prospěch, proč se s tím vůbec namáhat?" # todo: NEW TRANSLATION
 Sweden_foci.331.t: "Investiční dohoda přijata" # todo: NEW TRANSLATION
 Sweden_foci.331.d: "§Y[FROM.GetNameWithFlag]§! přijalo naši nabídku na strategickou hospodářskou spolupráci. Jejich vláda souhlasila s otevřením vybraných sektorů švédskému kapitálu výměnou za cílenou rozvojovou pomoc a neformální vliv. Dveře k dlouhodobé shodě jsou nyní tiše, avšak účinně otevřeny." # todo: NEW TRANSLATION
 Sweden_foci.331.a: "Nenápadný úspěch" # todo: NEW TRANSLATION
 Sweden_foci.332.t: "Investiční nabídka odmítnuta" # todo: NEW TRANSLATION
 Sweden_foci.332.d: "§Y[FROM.GetNameWithFlag]§! odmítlo naši investiční iniciativu. Oficiálně s odvoláním na národní suverenitu a obavy z transparentnosti se jejich vláda rozhodla navrhovanou dohodu neuzavřít. Odmítnutí omezí náš dosah v regionu zatím." # todo: NEW TRANSLATION
 Sweden_foci.332.a: "Litovat toho budou" # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.1.t: "Nový mandát, vojenská cesta" # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.1.d: "Volby jsou za námi. Nová vláda nastupuje a podle zvyklostí si Jeho Veřejnost Král přečte úvodní projev Riksdagu.\n\nOd samotných lesů Lapplandu po Öresundský most, od větrných kliff Gotlandu po sněhem pokryté vrcholky Helagsfjäll, lid Švédska naslouchá.\n\nJaký kurz zvolíme pro naše ozbrojené síly? Posílíme naši schopnost bránit domovinu tím, že udržíme naše pluky blízko a pohotovost ostrou? Budeme vyvíjet sílu v zahraničí, vstoupíme do koalic a misí pro udržení míru, které nesou riziko, ale mohou hrozby od našich hranic vzdálit? Nebo přijmeme klid současnosti a přesuneme zdroje jinam, věříme v diplomacii a mír?\n\nVláda má mandát. Nyní musí vybrat." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.1.o1: "Posílit schopnosti obrany domoviny." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.1.o2: "Rozšířit naši schopnost působit v zahraničí." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.1.o3: "Omezit armádu." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.2.t: "Otázka o oceli a strategii" # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.2.d: "Cesta je určena, naše vláda se rozhodla posílit švédské ozbrojené síly. Síla však má mnoho podob.\n\nV jednom táboře jsou hlasy jasné: nakoupit nové tanky STRV 122 a bojová vozidla pěchoty CV 90. Osvědčené prostředky známé našim vojákům, připravené k nasazení v lesích a polích, pro něž byly vytvořeny.\n\nJiní vyzývají k opatrnosti. Proč utrácet nyní, ptají se, když svět zítřka bude vyžadovat nové systémy a chytřejší konstrukce? Lepší by bylo investovat do vývojových inženýrů, laboratoří a myšlenek, které mohou utvářet další generaci švédské obrany.\n\nPak jsou tu ti, kteří vidí čísla. Chladné fiskální limity. Ukazují na tabulky ministerstva financí a kroutí hlavami. Vůle možná existuje, peníze však nikoli.\n\nRiksdag musí znovu rozhodnout." # todo: CHANGED
 Sweden_Forsvarsbeslutet.2.a: "Objednejte nové STRV 122 a CV 90 – spolehlivou sílu, tady a teď." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.2.b: "Investujte do výzkumu a vývoje a připravte se na další generaci." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.2.c: "Jednoduše si to nemůžeme dovolit, alespoň ne letos." # todo: CHANGED
 Sweden_Forsvarsbeslutet.3.t: "Nebe nad námi" # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.3.d: "Moderní armáda je jen tak silná, jaká jsou křídla nad ní. V rámci našeho obnoveného obranného úsilí nyní musíme rozhodnout o budoucnosti naší letecké síly.\n\nGripen je rychlý, obratný, hrdě švédský. Někteří tlačí na nový nákupní cyklus, aby rozšířili naše letky a zajistili připravenost pro oblohu zítřka stroji, kterým dnes důvěřujeme.\n\nOstatní volají jinou cestu. Budoucí hrozby vidí ne v dogfightech, ale v systémech stealth, senzorech a přesnosti. Peníze by měly jít do vývoje, ne nasazení.\n\nAle v tichých místnostech Ministerstva financí je nálada více střízlivá. Nadšení se potkává s rozpočtovými stropy. Patriotismus potkává účetnictví.\n\nVláda musí rozhodnout znovu." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.3.a: "Objednat nové stíhačky JAS 39 Gripen připravené na oblohu zítřka." # todo: CHANGED
 Sweden_Forsvarsbeslutet.3.b: "Investujte do výzkumu a vývoje v letectví, navrhněte další krok vpřed." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.3.c: "Na křídla letos nejsou peníze." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.4.t: "Ocel, pásy a křídla" # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.4.d: "Země a vzduch. Ocel a proudové motory. Srdce švédské obrany spočívalo vždy v harmonii sil pracujících dohromady.\n\nNěkteří navrhují jít na maximum: pořídit nové STRV 122 tanky, CV 90 obrněná bojová vozidla pěchoty a čerstvé eskadry Gripenů. Komplexní modernizace širokého spektra, aby Totalförsvaret nebyl jen doktrínou: skutečností.\n\nOstatní navrhují trpělivost. Lepší je investovat do budoucích návrhů — lehčích, chytřejších a efektivnějších. Nesmíme stavět pro dnešek to, co zítra zastará.\n\nA pak, samozřejmě, udeří realita. Jsou tu tabulky, limity, sliby učiněné jinde. Ambice se střetává s úsporami. Pokladny nejsou bezedné.\n\nNyní rozhodneme, jak vypadá síla." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.4.a: "Nákup CV 90, STRV 122 a Gripenů vybaví moderní sílu, hned." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.4.b: "Zaměřte se na dlouhodobý technologický vývoj; nejprve vybudujte generaci budoucnosti." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.4.c: "Chceme to, ale nemůžeme si to dovolit." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.10.t: "Försvarsbeslutet 2000: Nůžky nebo štíty?" # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.10.d: "Ve sálech Riksdagu s dřevěnými obklady se ozývají šálky na kávu a jemně zní jednání s veškerou naléhavostí studeného lednového rána. Obranný výbor předkládá své zjištění a místnost je naplněna kýváními, vrásčitými obočími a nepřeložitelným uměním vyvážené švédské dohody.\n\nMimo hlavní město je nálada odlišná. V Bodenu a Revingehedu si důstojníci kladou otázku, zda jejich pluky přežijí další kolo škrtů. Kasárny pro odvedence působí prázdnější, než by měly. Po celé zemi lidé čtou titulky a vzdychají. Je to, ostatně, velmi švédská věc — diskutovat o bezpečnostní politice s tabulkou v jedné ruce a principem neutrality v druhé.\n\nNové Försvarsbeslutet navrhuje snížení výdajů, sloučení jednotek a zmenšení stálých sil. Kritici varují před oslabením postoje v nejistém světě. Příznivci to označují za fiskální odpovědnost v době míru. Jako vždy, konečný výsledek je kompromis.\n\nNeodzbrojujeme se. Ale tiše, zdvořile a s velkým ohledem na proces snižujeme naše síly.\n\nTotalförsvaret zůstává na papíře. Zda zůstane i v praxi... bude záležet na tom, co budoucnost vyžaduje." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.10.a: "Švédsko bude mít prospěch ze systému regimentů." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.10.b: "Švédsko zůstane u brigád." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.11.t: "Soukolí Reformy" # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.11.d: "Ink je sotva suchý. Od ledových pobřeží Öresundu po zamrzlé pláně Lapplandu, vojáci, státní úředníci a obyčejní občané čekají na další signál: kdy vstoupí v platnost nové Försvarsbeslutet?\n\nNa služebních schůzkách a na veřejných shromážděních se otázka vznáší jako pára z ranní kávy. Jednotky se ptají, kdy se jejich rozpočty změní. Obce nahlížejí do plánů infrastruktury. Někteří jsou připraveni jednat, jiní by raději další kolo klidných diskuzí.\n\nToto je švédský způsob. Klidný, vyrovnaný, promyšlený. Nikdo nekřičí. Nikdo nepřichází panikou. Ale každý ví: Totalförsvaret funguje jen tehdy, když stroj je dobře promazaný a ozubená kola jedou synchronně.\n\nNyní nastává otázka načasování. Ne zda, ale kdy." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.11.a: "Měli bychom být připraveni zhruba za šest měsíců." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.11.b: "Lepší je postupně to zavést. Začít příští rok." # todo: NEW TRANSLATION
 Sweden_Forsvarsbeslutet.11.c: "Udělejte to co nejrychleji." # todo: NEW TRANSLATION
 Sweden_news.1.t: "Severský bankovní sektor konsoliduje" # todo: NEW TRANSLATION
 Sweden_news.1.d: "V rámci významného finančního vývoje oznámila švédská Nordbanken strategickou fúzi s dánskou Unibank A/S a norskou Christiania Bank og Kreditkasse. Nově sjednocený subjekt bude působit pod názvem Nordea a stane se jednou z největších finančních institucí v severní Evropě.\n\nTento krok představuje významný posun k hospodářské integraci v severském regionu, zjednodušuje bankovní služby přes hranice a posiluje sdílenou finanční odolnost. Kritici varují před centralizací, zastánci však vidí v rozsahu příležitost a efektivitu." # todo: CHANGED
 Sweden_news.1.o1: "Nový finanční gigant se objeví na severu." # todo: NEW TRANSLATION
 Sweden_news.2.t: "Seversko-baltská spolupráce prohlubuje" # todo: NEW TRANSLATION
 Sweden_news.2.d: "Dnes podepsali zástupci Švédska, Norska, Dánska, Finska, Islandu, Estonska, Lotyšska a Litvy formální prohlášení posilující partnerství Nordic-Baltic Eight (NB8). Tento regionální rámec bude koordinovat diskuse o politice v oblastech jako zahraniční vztahy, obrana, digitální infrastruktura a odolnost vůči klimatickým výzvám.\n\nAčkoliv nejde o vojenský svaz, NB8 je široce vnímáno jako strategická reakce na rostoucí geopolitické nejistoty v regionu. Pozorovatelé poukazují na potenciál rozšířit ho na severní blok se společnou diplomatickou vahou a integrovanými regionálními mechanismy politiky.\n" # todo: NEW TRANSLATION
 Sweden_news.2.o1: "Jednota skrze sdílené zájmy a geografii." # todo: NEW TRANSLATION
 Sweden_news.3.t: "Unie NORDCAPS Založena" # todo: NEW TRANSLATION
 Sweden_news.3.d: "Stockholm oznámil vznik Severského koordinovaného přístupu k míru a bezpečnosti, tedy NORDCAPS, nové skandinávské iniciativy navržené k posílení společného obranného plánování, interoperability a sdílení zpravodajských informací mezi členskými zeměmi.\n\nAčkoli to není formální vojenský svaz, NORDCAPS bude sloužit jako platforma pro strukturovanou bezpečnostní spolupráci mezi Švédskem, Norskem, Dánskem a Finskem. Zástupci vidí v tom flexibilní a nordicky vedený doplněk k existujícím evropským obranným strukturám.\n\nCvičení, koordinace krizí a sdílená strategická hodnocení budou páteří budoucí spolupráce." # todo: NEW TRANSLATION
 Sweden_news.3.o1: "Skandinávie stojí spolu." # todo: NEW TRANSLATION
 Sweden_news.4.t: "Cvičení je kolem nás" # todo: NEW TRANSLATION
 Sweden_news.4.d: "Po tichých městech a venkovských silnicích Švédska duní motory a řev proudových turbín; startují a přistávají letouny JAS 39 Gripen na improvizovaných vzletových plochách, které nyní slouží jako odpalovací body pro obranu vzduchu. V hustých lesích Smålandu a Värmlandu se pohybují tanky STRV 122 a obrněná bojová vozidla CV 90 lesní dokonalosti jako oceloví predátoři. Cvičné zbraně duní krajinou.\n\nPro mnoho civilistů to znamená uvědomění si, že jsme uprostřed vojenského cvičení. Totalförsvaret není jen teorie, je to skutečná zkušenost. Celá země je součástí cvičení.\n\nNěkteří nacházejí útěchu v přípravě. Jiní pociťují tíhu toho, co to znamená." # todo: NEW TRANSLATION
 Sweden_news.4.o1: "Národ trénuje jako jeden celek." # todo: NEW TRANSLATION
 Sweden_news.5.t: "Strategické opevnění v průběhu" # todo: NEW TRANSLATION
 Sweden_news.5.d: "Betonové zdi stoupají tam, kde dříve stály nezasahované lesy. Inženýři posilují mosty ocelovou sítí a tvarovanými náložemi. Na severu se bunkry zakusují do granitu; na jihu táhnou proti-tankové příkopy přes pole jako jizvy.\n\nTo není návrat do minulosti, je to tvar moderní obrany. Od Östersundu po Karlskronu se Švédsko připravuje. Každý kontrolní bod, každá úvozová díra, každý posílený tunel je poselství: nebudeme překvapeni nepřipravení.\n\nTotalförsvaret proměňuje terén v pevnost. Země nespí; drží čelist." # todo: NEW TRANSLATION
 Sweden_news.5.o1: "Nechte lesy bojovat s námi." # todo: NEW TRANSLATION
 Sweden_news.6.t: "Vytváření vůdců pro frontu" # todo: NEW TRANSLATION
 Sweden_news.6.d: "Ve třídách i na střelnicích s ostrou municí se formují budoucí velitelé Švédska. Taktická teorie ustupuje cvičením v kouři a práci s pískovými mapami; tlak rozhodnutí učiněných během několika minut mění instinkt v doktrínu.\n\nOd Försvarshögskolan po odlehlá stanoviště praporů si důstojníci osvojují dovednost, která odděluje řád od chaosu. V Totalförsvaret není vedení volitelné je opěrným bodem přežití.\n\nNečekáme, až nás válka něco naučí. Připravujeme se předem." # todo: CHANGED
 Sweden_news.6.o1: "Ostražitá mysl vede pevné ruce." # todo: NEW TRANSLATION
 Sweden_news.7.t: "Lidé ve uniformách" # todo: NEW TRANSLATION
 Sweden_news.7.d: "Přicházejí v otupeném maskovacím vzoru, nesou standardní zbraně a termosky z domova. Jsou to učitelé, mechanici, studenti, občané. Ale tento týden jsou Hemvärnet.\n\nPo lesích a polích se domácí obranná cvičení rozvíjejí s překvapivou realističností. Dálnice se zakáží, zkouší se komunikace v temném režimu. Polní kuchyně krmí houževnaté prapory. Děti sledují z verand, když projíždějí kolony.\n\nNení to, že by se armáda vrátila k lidem. Je to lid, který se stává armádou." # todo: NEW TRANSLATION
 Sweden_news.7.o1: "Připraveni v míru, připraveni v krizi." # todo: NEW TRANSLATION
 Sweden_news.8.t: "Cesta domů začíná" # todo: NEW TRANSLATION
 Sweden_news.8.d: "Helmy se sundávají. Checkpointy mizí. Silnice, kdysi hlídané obrněnými vozidly, nyní hostí kola a letní dopravu. Mobilizované jednotky Hemvärnet ustupují, zanechávají jen brázdy v zemi a vzpomínku na pohyb.\n\nPřesto něco přetrvává. V každé vesnici, která hostila četu, v každém lese vyklizeném pro výcvik, je patrný jemný posun. Vrátili jsme se k normálu, ale normalita ví, co znamená být připraven.\n\nTotalförsvaret nás naučil, že bezpečnost není nepřítomnost strachu. Je to přítomnost připravenosti." # todo: NEW TRANSLATION
 Sweden_news.8.o1: "Normální, ale už nikdy naivní." # todo: NEW TRANSLATION
 Sweden_news.9.t: "Národ vyzván k pohotovosti" # todo: NEW TRANSLATION
 Sweden_news.9.d: "Rozkaz k aktivaci přišel krátce po úsvitu. Během několika hodin byly vybaleny uniformy, vyzvednuty zbraně a rádia se rozezněla. Ve městech a odlehlých stanovištích po celém Švédsku začalo tiše ožívat soukolí mobilizace.\n\nHemvärnet nepřichází s ceremonií jednoduše se objeví. Křižovatky jsou zajištěny. Komunikační uzly obsazeny. Lesy znovu šeptají pohybem.\n\nNeexistuje panika. Jen odhodlání. Země se na tento okamžik cvičila. Nyní jej uskutečňuje." # todo: CHANGED
 Sweden_news.9.o1: "Běžní lidé. Mimořádná pohotovost." # todo: NEW TRANSLATION
 Sweden_news.10.t: "Försvarsbeslutet 2000 vstupuje v platnost" # todo: NEW TRANSLATION
 Sweden_news.10.d: "Nová struktura je na místě. Po celé zemi projíždějí kolonami obrněná vozidla tichými městy směrem k reorganizovaným posádkám. Děti s úžasem sledují, jak oceloví obři projíždějí kolem jejich škol a jejich představivost rozechvívá dunění připravenosti.\n\nV Bodenu, Skövde a Enköpingu se život začíná měnit. Mladé ženy se opírají o ploty a sledují příjezd branců z každého kouta země tváře nové na severu, přivedené povinností. V očích se objevuje známý jiskřivý lesk, přikývnutí tradici a pomalému rytmu společné služby.\n\nPočet jednotek se změnil. Mapa švédské obrany je překreslena. Podstata však zůstává: lidé, účel a připravenost. *Totalförsvaret* nezmizel. Pouze spočinul na menším počtu silnějších základů." # todo: CHANGED
 Sweden_news.10.a: "Nové milénium začalo." # todo: NEW TRANSLATION
 Sweden_news.11.t: "Stálost ve světě, který se mění." # todo: NEW TRANSLATION
 Sweden_news.11.d: "Zatímco několik unavených rozpočtových analytiků na ministerstvu financí je viditelně nespokojeno s rozhodnutím udržovat tak početné ozbrojené síly, ne všichni jejich obavy sdílejí. V Bodenu se skupina mladých branců, kteří nyní mají skutečnou cestu k profesionální službě, spontánně pustí do vystoupení s písní *Dancing Queen* na zasněženém nádvoří. Je to podivně dojemná scéna, napůl satira, napůl hrdost. Národem se šíří neobyčejný emocionální okamžik.\n\nDokonce i Jeho Veličenstvo král, obvykle zdrženlivý ve státních záležitostech, píše vlastnoruční dopis Riksdagu, v němž děkuje jeho členům za moudrost a za zachování tradice, která dlouho stála jako pilíř švédské nezávislosti." # todo: CHANGED
 Sweden_news.11.a: "Struktura stojí za obranu." # todo: NEW TRANSLATION
 Sweden_news.12.t: "Švédský národní fond investuje do kryptoměn." # todo: NEW TRANSLATION
 Sweden_news.12.d: "Ačkoli Švédsko nikdy nebylo známé odvážnými kroky v měnové politice, tempo globálních finančních inovací učinilo z váhání riziko samo o sobě. Dnes král v historickém prohlášení oznámil, že národní penzijní fond bude oprávněn rozšířit své portfolio přímými investicemi do kryptoměn a dokonce do těžby kryptoměn.\n\nZastánci rozhodnutí jej vítají jako vizionářské a nezbytné pro zajištění budoucnosti švédské ekonomiky, zatímco kritici varují před volatilitou a nejistotou, které digitální aktiva stále provázejí.\n\nVěk kryptoměn však oficiálně dorazil do finančního srdce Švédska." # todo: CHANGED
 Sweden_news.12.a: "Odvážný krok do budoucnosti." # todo: NEW TRANSLATION
 Sweden_news.4.other_t: "Zprávy ze Švédska" # todo: NEW TRANSLATION
 Sweden_news.4.other_d: "Mezinárodní pozorovatelé zaznamenávají nejnovější vývoj ve švédské vnitřní a obranné politice, ačkoli podrobnosti přitahují mimo region jen malou pozornost." # todo: NEW TRANSLATION
 Sweden_news.4.other_a: "Vzato na vědomí." # todo: NEW TRANSLATION
 Sweden_news.20.t: "Agenda: \"Cena neutrality\"" # todo: NEW TRANSLATION
 Sweden_news.20.d: "Ve svém nejnovějším vysílání se Agenda věnovala tématu „Cena neutrality“. Ekonomové, bývalí diplomaté a vojenští představitelé diskutovali o hmatatelných nákladech a přínosech švédské neangažovanosti. „Vzdáváme se vlivu, ale zachováváme nezávislost,“ uvedl jeden z odborníků. Jiní upozornili na promarněné příležitosti v bezpečnostní spolupráci a vývoji zbraní. Pořad zdůraznil tvrdou pravdu: neutralita nabízí svobodu, často však za cenu vlivu, přístupu a jistoty. S rostoucí nestabilitou světa čelí starý model novým otázkám." # todo: CHANGED
 Sweden_news.20.a: "Náklady principu bývají málokdy levné." # todo: NEW TRANSLATION
 Sweden_news.21.t: "Agenda: \"Ptejte se ministra – veřejný dialog o obraně\"" # todo: NEW TRANSLATION
 Sweden_news.21.d: "Agenda odvysílala živý pořad s názvem „Zeptejte se ministra“, v němž občané přímo zpovídali švédského ministra obrany. Témata sahala od vojenských výdajů po strategická partnerství. Na otázku ohledně neutrality ministr odpověděl: „Naše politika se přizpůsobuje světu, naše zásady však zůstávají.“ Zatímco někteří oceňovali otevřenost, jiní označili odpovědi za vyhýbavé. Diváci zůstali na pochybách, zda šlo o smysluplný dialog, nebo uhlazené public relations. Jedno bylo jisté: veřejnou důvěru si je třeba zasloužit, nikoli řídit." # todo: CHANGED
 Sweden_news.21.a: "Lidé sledují a hodnotí." # todo: NEW TRANSLATION
 Sweden_news.22.t: "Agenda: \"Bezpečnostní povědomí nebo tiché mobilizace?\"" # todo: NEW TRANSLATION
 Sweden_news.22.d: "V epizodě nazvané „Povědomí o bezpečnosti, nebo tichá mobilizace?“ se Agenda věnovala tenké hranici mezi informováním a poplachem. S rostoucím počtem vládních letáků a veřejných oznámení diskutovali účastníci, zda jde o transparentnost, nebo skrytou militarizaci. „Žádají po nás, abychom se připravili, ale na co vlastně?“ zeptal se profesor komunikace. Jiní namítali, že demokratické národy musí podporovat civilní připravenost bez vyvolávání strachu. Epizoda zachytila rostoucí neklid: připravuje se Švédsko na válku, nebo jen připravuje mysl veřejnosti?" # todo: CHANGED
 Sweden_news.22.a: "Zpráva je jasná, ale motiv není." # todo: NEW TRANSLATION
 Sweden_news.23.t: "Agenda: \"Symbolická kampaň k připravení občanů?\"" # todo: NEW TRANSLATION
 Sweden_news.23.d: "Agenda zkoumala nedávnou veřejnou kampaň zahájenou švédskými orgány k zvýšení povědomí o civilní obraně a národní bezpečnosti. S názvem 'Symbolická kampaň k připravení občanů?', segment zpochybňoval, zda má iniciativa konkrétní obsah nebo jen symbolický záměr. \"Vypadá to spíše jako divadlo než jako připravenost,\" řekl jeden host. Jiní program obhajovali jako nutný první krok k budování veřejné odolnosti. Show zachytila společnost v tichém napětí, která si je vědoma rostoucích rizik a neví, jak reagovat." # todo: NEW TRANSLATION
 Sweden_news.23.a: "Veřejná připravenost zůstává spíše aspirací než faktem." # todo: NEW TRANSLATION
 Sweden_news.24.t: "Agenda: \"Švédská cesta – mezi idealismem a realpolitikou\"" # todo: NEW TRANSLATION
 Sweden_news.24.d: "V promyšlené diskusi nazvané „Švédská cesta“ Agenda zkoumala, zda švédská morální diplomacie stále odpovídá jejímu chování v zahraniční politice. „Tvrdíme, že vedeme prostřednictvím hodnot,“ řekl jeden novinář, „ale náš vývoz zbraní a alianční strategie naznačují něco jiného.“ Debata se dotkla všeho od mírových misí OSN po vojensko-průmyslové dohody. Pořad uzavřela provokativní otázka: Je „švédská cesta“ vůdčím principem, nebo jen budováním značky v cynickém světě?" # todo: CHANGED
 Sweden_news.24.a: "Mýtus morální výlučnosti čelí zkoumání." # todo: NEW TRANSLATION
 Sweden_news.25.t: "Agenda: \"Co pro nás dnes znamená neutralita?\"" # todo: NEW TRANSLATION
 Sweden_news.25.d: "Agenda položila ostrou otázku: 'Co pro nás dnes znamená neutralita?' Segment hostil bouřlivou debatu o dědictví a budoucnosti švédské neutrality. Odborníci diskutovali, zda spolupráce se západními vojenskými silami ohrožuje tradiční hodnoty. Bývalý generál trval na tom, že \"neutralita byla vždy o strategické nezávislosti, ne o izolaci.\" Publikum odešlo bez jasné odpovědi, jen s vědomím, že pojem, kdysi národní pilíř, nyní vyžaduje hluboké přepracování tváří v tvář nové geopolitické realitě." # todo: NEW TRANSLATION
 Sweden_news.25.a: "Jádro švédské identity je znovu definováno." # todo: NEW TRANSLATION
 Sweden_news.26.t: "Agenda: \"Multipolární svět – příležitost nebo hrozba?\"" # todo: NEW TRANSLATION
 Sweden_news.26.d: "Tento týden Agenda zkoumala důsledky multipolárního světového řádu pro Švédsko. Pořad představil obranné analytiky a odborníky na zahraniční politiku, kteří diskutovali, zda méně dominantní role USA ve světě vytváří příležitosti pro švédskou autonomii, nebo větší nebezpečí. Jeden odborník varoval: „Multipolarita neznamená mír, znamená nepředvídatelnost.“ Jiní namítali, že Švédsko může těžit z nových vyvažujících mocností. Jak se velké státy přeskupují, pořad zdůraznil nové dilema: má Švédsko zůstat strategicky pružné, nebo si začít vybírat strany?" # todo: CHANGED
 Sweden_news.26.a: "Švédsko přemýšlí o své pozici ve měnícím se světě." # todo: NEW TRANSLATION
 Sweden_news.27.t: "Agenda: \"Jiná Evropa\"" # todo: NEW TRANSLATION
 Sweden_news.27.d: "Pořad Agendy nazvaný „Druhá Evropa“ vyzval Švédy, aby znovu přehodnotili své místo na kontinentu. Účastníci diskutovali o tom, jak se Švédsko v minulosti vzpíralo jednoduchému dělení na Východ a Západ. „Jsme součástí Evropy,“ řekl jeden historik, „ale často se cítíme jako cizinci v NATO i EU.“ Dialog zkoumal myšlenku „třetího prostoru“ v evropské politice, sféry neutrálních demokratických států, které si razí nezávislé cesty. Pořad se však také ptal: Je tato vize realistická, nebo jde v stále polarizovanějším světě o nostalgické vytváření mýtu?" # todo: CHANGED
 Sweden_news.27.a: "Švédové si kladou otázku, kam skutečně patří." # todo: NEW TRANSLATION
 Sweden_news.28.t: "Agenda: \"Obviňování arogantního Západu?\"" # todo: NEW TRANSLATION
 Sweden_news.28.d: "Včerejší epizoda pořadu Agenda na SVT s tématem „Obviňovat arogantní Západ?“ vyvolala bouřlivou diskusi. Ve studiu se sešli bývalí velvyslanci, analytičtí pracovníci a akademici, aby se zamysleli, zda rostoucí odstup Švédska od západního vedení pramení z rozčarování. Jeden host poznamenal: „Roste pocit, že západní mocnosti očekávají poslušnost, nikoli dialog.“ Jiný dodal: „Neutralita není podřízení, je to postoj.“ Rozhovor zdůraznil rostoucí kritiku ve švédské společnosti: že odsunutí na okraj mezinárodní politiky nemusí být otázkou neutrality, ale hrdosti." # todo: CHANGED
 Sweden_news.28.a: "Diskuze pokračuje na rodinných večeřích i v novinách." # todo: NEW TRANSLATION
 Sweden_news.29.t: "Agenda: \"Nová Ostpolitik?\"" # todo: NEW TRANSLATION
 Sweden_news.29.d: "Včerejší Agenda položila otázku, která se v mainstreamové politice objevuje jen zřídka: „Mělo by se Švédsko znovu zapojit na Východě?“ Téma se netýkalo nostalgie po studené válce, ale pragmatické diplomacie s Ruskem a jeho sousedy. Kritici to označili za naivní. „Na agresi nelze budovat důvěru,“ řekl jeden účastník. Jiní však tvrdili, že izolace pouze posiluje nepřátelství. „Dialog není podpora,“ namítl bývalý velvyslanec. Pořad vyvolal nepříjemné úvahy o tom, zda úplné strategické sladění Švédska se Západem nesnížilo jeho diplomatickou pružnost. Mohla by selektivní spolupráce vést k regionální stabilitě, nebo jde o nebezpečnou iluzi?" # todo: CHANGED
 Sweden_news.29.a: "Myšlenka východního dialogu vzbuzuje zároveň vzpomínky i nesouhlas." # todo: NEW TRANSLATION
 Sweden_news.30.t: "Agenda: \"Budování švédské strategické mysli\"" # todo: NEW TRANSLATION
 Sweden_news.30.d: "Agenda se věnovala často přehlížené mezeře v národní odolnosti: nedostatku silné a nezávislé švédské kapacity pro strategický výzkum. V rámci tématu „Budování švédského strategického myšlení“ pořad představil vznikající snahy o založení národního think-tanku zaměřeného na bezpečnost, diplomacii a geopolitiku. „Příliš mnoho našeho pohledu na svět jsme přenechali jiným,“ uvedl výzkumník veřejné politiky. Debata se obrátila k otázce, nakolik je švédské uvažování o zahraniční politice reaktivní namísto koncepčního. Panovala shoda: pokud chce Švédsko autonomii, musí nejprve pochopit své vlastní zájmy podle vlastních měřítek." # todo: CHANGED
 Sweden_news.30.a: "Suverénní hlas začíná suverénními myšlenkami." # todo: NEW TRANSLATION
 SWE_idea_swedish_legacy: "Švédské dědictví" # todo: NEW TRANSLATION
 SWE_idea_swedish_legacy_desc: "Jen málo národů naší velikosti si po staletí geopolitického tlaku udrželo tak dlouhou nezávislost. Dědictví Švédska je dědictvím neutrality, inovací a vojenské způsobilosti bez agrese. Od gustaviánských reforem po doktrínu ozbrojené neutrality z období studené války je švédský model založen na odstrašení prostřednictvím připravenosti a hluboce zakořeněné společenské vůli bránit se.\n\nV tomto dědictví nacházíme svou identitu i povinnost." # todo: CHANGED
 SWE_idea_Armestaben: "Arméstaben – Centrální armádní štáb" # todo: NEW TRANSLATION
 SWE_idea_Armestaben_desc: "Obnoveno jako hlavní nervová soustava pro pozemní operace, Arméstaben hraje klíčovou roli v koordinaci a strategické připravenosti. Jeho struktura spojuje vývoj doktrín s terénní logistikou, zajišťující, že švédské síly zůstávají moderní a pružné.\n\nNávrat centralizovaného armádního štábu signalizuje náš záměr: plánujeme, adaptujeme se a vedeme sami sebe." # todo: NEW TRANSLATION
 SWE_idea_total_defence_duty: "Povinnost vůči celkové obraně" # todo: NEW TRANSLATION
 SWE_idea_total_defence_duty_desc: "Celková obrana není jen politikou, je to povinnost. Švédští občané se očekávají sloužit nejen v uniforme, ale i prostřednictvím civilní připravenosti: logistika, zdravotní péče, infrastruktura a reakce na krize. V dobách hrozby se celá země stává systémem odolnosti.\n\nCelková obrana není jen o povinné vojenské službě. Jde o přínos od každého Švéda." # todo: NEW TRANSLATION
 SWE_idea_active_training: "Rutiny aktivní služby" # todo: NEW TRANSLATION
 SWE_idea_active_training_desc: "Síly, které cvičí jen v teorii, selhávají v praxi. Švédsko udržuje robustní program kombinovaného výcviku, společných větví a scénářů za reálných podmínek. Od zmrzlých archipelagů po městský terén si naši vojáci cvičí nejen taktiky, ale i adaptaci.\n\nBojová pohotovost se nevyhlašuje. Je vytrénována do návyku." # todo: NEW TRANSLATION
 SWE_idea_total_training: "Komplexní obranný výcvik" # todo: NEW TRANSLATION
 SWE_idea_total_training_desc: "Výcvik ve Švédsku přesahuje rámec stálé armády. Policie, civilní obrana, zdravotnictví, infrastruktura i místní samosprávy se účastní krizových cvičení. Výsledkem není pouze logistika, ale i kultura. Společnost očekává, že bude fungovat pod tlakem.\n\nNesimulujeme kolaps. Simulujeme, jak jej přečkat." # todo: CHANGED
 SWE_idea_nb8: "Nordicko-baltická osmička (NB8)" # todo: NEW TRANSLATION
 SWE_idea_nb8_desc: "NB8 je platformou pragmatické spolupráce mezi nordickými a baltskými státy sjednocenými geografií, ekonomickým zájmem a sdílenými bezpečnostními obavami. Prostřednictvím diplomatické koordinace a společných iniciativ NB8 Švédsku dává flexibilní, občanský vedený regionální hlas mimo hlavní mocenské bloky.\n\nTichá spojenectví budují silné hranice." # todo: NEW TRANSLATION
 SWE_idea_nordefco: "NORDEFCO – Nordic Defence Cooperation" # todo: NEW TRANSLATION
 SWE_idea_nordefco_desc: "NORDEFCO spojuje obranné kapacity severských států, aniž by vyžadovalo plnou integraci do aliance. Společné nákupy, sdílená cvičení a interoperabilní velitelské struktury posilují bezpečnostní mozaiku regionu. Pro Švédsko jde o způsob, jak posílit odstrašení bez obětování suverenity.\n\nJednota v pružnosti. Obrana bez kapitulace." # todo: CHANGED
 SWE_idea_swedish_banking: "Švédský bankovní systém" # todo: NEW TRANSLATION
 SWE_idea_swedish_banking_desc: "Švédský bankovní systém, vybudovaný na důvěře, regulaci a technologické předvídavosti, patří k nejodolnějším v Evropě. Díky vysoké digitalizaci, nízké závislosti na hotovosti a konzervativní úvěrové politice dokáže s klidnou jistotou čelit hospodářským otřesům.\n\nV nestabilním světě je fiskální zdrženlivost silou." # todo: CHANGED
 SWE_development_found_of_the_swedish_construction_industry: "Základ moderního švédského stavebnictví" # todo: NEW TRANSLATION
 SWE_development_found_of_the_swedish_construction_industry_desc: "Poválečné Švédsko masivně investovalo do infrastruktury, což vyústilo v robustní a všestranný stavební sektor. Od mostů v Norrlandu po podzemní železnici ve Stockholmu staví švédské firmy pro trvanlivost, efektivitu a drsné klima. V dobách krize se tato kapacita stává dvojím využitím: opravit, posílit, znovu vybudovat.\n\nNaši inženýři nejen stavějí brání budoucnost v betonu." # todo: CHANGED
 SWE_idea_sverige_tourism: "Poznejte Švédsko" # todo: NEW TRANSLATION
 SWE_idea_sverige_tourism_desc: "Po mnoho let bylo Švédsko jen vzdáleným místem na mapě, často redukovaným na klišé ABBA, blond modely a nic víc. Za hranicí stereotypů však leží dechberoucí země, bohatá na historii, kulturu a přírodu. Od severních břehů posetých soby pod polárními světly až po moderní zázrak Öresundského mostu na jihu, nabízí Švédsko návštěvníkům jedinečný a nezapomenutelný zážitek. Investicí do infrastruktury, pohostinnosti a mezinárodního marketingu můžeme odemknout obrovský potenciál krásy a půvabu našeho národa." # todo: NEW TRANSLATION
 SWE_idea_2percent_inflation_goal: "Cíl inflace 2 %" # todo: NEW TRANSLATION
 SWE_idea_2percent_inflation_goal_desc: "Ekonomická stabilita nepřichází náhodou; je pečlivě řízena. Zavázáním se k cíli inflace 2 % usilujeme o ukotvení očekávání, podporu udržitelného růstu a udržení kupní síly bez vyvolání přehřátí ekonomiky. Předvídatelné monetární prostředí buduje důvěru mezi investory, podniky a občany." # todo: NEW TRANSLATION
 SWE_idea_gold_standart: "Návrat ke zlatému standardu" # todo: NEW TRANSLATION
 SWE_idea_gold_standart_desc: "V rostoucí nejistotě se slib zlatem kryté měny znovu objevuje. Obnovení zlatého standardu má za cíl znovu vybudovat důvěru v náš měnový systém, nabídnout pevné hodnoty a chránit ekonomiku před spekulativními excesy. Avšak rigidní rámec může omezit flexibilitu v dobách kriz." # todo: NEW TRANSLATION
 SWE_idea_back_by_bonds: "Měna krytá dluhopisy" # todo: NEW TRANSLATION
 SWE_idea_back_by_bonds_desc: "Místo toho, abychom si vázali ruce na fixní komoditu, můžeme naši měnu podložit státními dluhopisy a vytvořit systém, který je důvěryhodný i pružný. Vláda bude sloužit jako základ pro emisi peněz, vyvažující stabilitu a schopnost dynamicky reagovat na finanční tlaky." # todo: NEW TRANSLATION
 SWE_idea_nordbanken: "Konsolidace Nordbanken" # todo: NEW TRANSLATION
 SWE_idea_nordbanken_desc: "Ve snaze stabilizovat finanční sektor byla Nordbanken převedena na silnější a odolnější instituci. Podpořena státními opatřeními a soukromými iniciativami stojí banka jako pilíř moderního švédského finančního systému, který dokáže zvládnout budoucí ekonomické bouře." # todo: NEW TRANSLATION
 SWE_lower_costs: "Redukce obranných výdajů" # todo: NEW TRANSLATION
 SWE_lower_costs_desc: "Vojenské výdaje byly významně sníženy, aby se prostředky alokovaly na domácí priority. Zatímco to snižuje fiskální zatížení, zároveň to snižuje okamžitou obrannou připravenost, a vyžaduje pečlivé strategické vyvažování více než kdy dřív." # todo: NEW TRANSLATION
 SWE_idea_den_education_reform1: "Vzdělávací reformy: Základy" # todo: NEW TRANSLATION
 SWE_idea_den_education_reform1_desc: "S ohledem na potřebu moderní, znalostmi poháněné ekonomiky se první fáze vzdělávací reformy zaměřuje na posílení raného vzdělávání a zlepšení přístupu k kvalitnímu vzdělání ve všech regionech." # todo: NEW TRANSLATION
 SWE_idea_den_education_reform2: "Vzdělávací reformy: Rozšíření" # todo: NEW TRANSLATION
 SWE_idea_den_education_reform2_desc: "Navazujíc na počáteční úspěchy vstupuje reforma do druhé fáze rozšířením středoškolského a odborného vzdělávání, aby se osnovy sladily s požadavky konkurenční globální ekonomiky." # todo: NEW TRANSLATION
 SWE_idea_den_education_reform3: "Vzdělávací reforma: Excelence" # todo: NEW TRANSLATION
 SWE_idea_den_education_reform3_desc: "Třetí fáze posouvá excelenci posílením vysokých škol, podporou výzkumné inovace a prosazováním mezinárodní spolupráce, aby Švédsko bylo na špici akademického úspěchu." # todo: NEW TRANSLATION
 SWE_idea_den_education_reform4: "Vzdělávací reforma: Připravenost na budoucnost" # todo: NEW TRANSLATION
 SWE_idea_den_education_reform4_desc: "Po dokončení fází základů, rozšíření a excelence zajišťuje závěrečná fáze, aby vzdělávání zůstalo pružné, inkluzivní a zaměřené do budoucnosti a připravovalo občany na dynamické výzvy zítřejšího světa." # todo: CHANGED
 SWE_idea_automotive_JAP: "Japonská automobilová spolupráce" # todo: NEW TRANSLATION
 SWE_idea_automotive_JAP_desc: "Díky novým partnerstvím s precizním automobilovým průmyslem Japonska získává Švédsko přístup k nejmodernějším technologiím, výrobním postupům a konkurenčním tržním strategiím. Spolupráce s předními japonskými firmami zvyšuje odolnost naší výroby a zajišťuje, že zůstaneme v čele globálních inovací.\n\nOd účinných motorů po hybridní řešení se píše nová kapitola automobilové excelence." # todo: CHANGED
 SWE_idea_automotive_USA: "Americká automobilová spolupráce" # todo: NEW TRANSLATION
 SWE_idea_automotive_USA_desc: "Švédský automobilový sektor, založený na prohlubujících se vazbách s průmyslovými giganty Spojených států, přejímá nejlepší postupy masové výroby, komerčního designu a logistického rozsahu. Naše továrny jsou rychlejší, pružnější a konkurenceschopnější a spojují severské řemeslo s americkou průmyslovou dynamikou.\n\nV každém podvozku a hnacím hřídeli se zhmotňuje společný duch ambicí." # todo: CHANGED
 SWE_idea_automotive_GER: "Německá automobilová spolupráce" # todo: NEW TRANSLATION
 SWE_idea_automotive_GER_desc: "Švédský průmysl, posílený spoluprací s celosvětově proslulými německými automobilovými lídry, přijímá precizní strojírenství, kontrolu kvality a inovace na nejvyšší úrovni. Společné podniky a výměna znalostí zajistí technologický pokrok a posílí naše vlastní průmyslové schopnosti.\n\nV každém ozubeném kole a pístu přetrvává snaha o dokonalost." # todo: CHANGED
 SWE_idea_astrazenca: "Partnerství se společností AstraZeneca" # todo: NEW TRANSLATION
 SWE_idea_astrazenca_desc: "Díky partnerství se společností AstraZeneca si Švédsko upevňuje své postavení na křižovatce medicíny, biotechnologií a pokročilého výzkumu. Společné projekty urychlují vývoj léčiv a posilují naši pozici na mezinárodních farmaceutických trzích.\n\nInovace prostupuje každou lahvičku a každý vzorec, který vyrábíme." # todo: NEW TRANSLATION
 SWE_idea_Pharmacia1: "Pharmacia: Rané průlomy" # todo: NEW TRANSLATION
 SWE_idea_Pharmacia1_desc: "První průlomy společnosti Pharmacia položily základy švédské farmaceutické pověsti a spojily přísnou vědu s odvážným podnikatelským duchem. Úspěchy našich výzkumníků v biotechnologiích a léčbě nemocí dodnes znějí po celém světě.\n\nV každém objevu září průkopnický duch." # todo: CHANGED
 SWE_idea_Pharmacia2: "Pharmacia: Globální expanze" # todo: NEW TRANSLATION
 SWE_idea_Pharmacia2_desc: "Na tradici inovací navazuje expanze společnosti Pharmacia na mezinárodní trhy a ohlašuje novou éru švédského farmaceutického vlivu. Strategické fúze a výzkumná spolupráce staví Švédsko do role předního centra zdravotnických věd a medicínských technologií.\n\nV každé laboratoři a každém partnerství se utváří budoucnost." # todo: CHANGED
 SWE_idea_swedish_think_tank: "ISDS – Ústav švédské diplomacie a bezpečnosti" # todo: NEW TRANSLATION
 SWE_idea_swedish_think_tank_desc: "Institut pro švédskou diplomacii a bezpečnost (ISDS) je státem financovaný orgán pověřený analýzou postavení Švédska ve stále nestabilnějším světě. ISDS se oficiálně zaměřuje na diplomacii, hospodářský výhled a rámce civilní bezpečnosti, tiše však ovlivňuje strategické myšlení ve vládě i akademické sféře. Ačkoli formálně zachovává neutralitu, institut vytváří utajované simulace a bílé knihy zkoumající možnou roli Švédska v budoucích aliancích, intervencích a investičních strukturách. V době geopolitické nejasnosti poskytuje ISDS intelektuální infrastrukturu pro pružnou a do budoucnosti orientovanou zahraniční politiku." # todo: CHANGED
 SWE_idea_ostkontact: "Zahájit Východní kontakt" # todo: NEW TRANSLATION
 SWE_idea_ostkontact_desc: "Přes udržení oficiální neutrality zahajujeme kulturní, hospodářské a akademické výměny s Ruskem a státy Eurasie. Tyto nízkoprofilové kontakty slouží jako základ pro budoucí scénáře sladění. Zároveň svědčí domácím aktérům, že neutralita neznamená loajalitu Západu." # todo: NEW TRANSLATION
 SWE_idea_anti_lgbt: "Kampaň tradiční politiky" # todo: NEW TRANSLATION
 SWE_idea_anti_lgbt_desc: "Síť konzervativních hlasů zahájila kulturní protiakci proti pokrokovým sociálním hodnotám a volá po návratu k 'tradičním švédským normám'. Ačkoliv postrádá oficiální státní podporu, jejich vliv pronikl do veřejné diskuze, vyvolávaje debaty o právech LGBTQ+, svobodě projevu a rodinné politice. Mezinárodní nestátní organizace a evropské instituce vyjadřují obavy z rostoucí společenské polarizace." # todo: NEW TRANSLATION
 SWE_idea_folkhemmet: "Moderní Folkhemmet" # todo: NEW TRANSLATION
 SWE_idea_folkhemmet_desc: "Čerpaje inspiraci ze střednědvacátého století ze švédského modelu 'Folkhemmet'—Lidového Domova—nová vize inkluzivní podpory a silné odpovědnosti státu získává na popularitě. Tento modernizovaný koncept zdůrazňuje sociální soudržnost, ekonomickou rovnost a rovnováhu mezi mechanismy trhu a sociálního zabezpečení, s cílem chránit občany před globální nestabilitou a zároveň zachovat národní jednotu." # todo: NEW TRANSLATION
 SWE_Logistic_invests: "Strategické logistické investice" # todo: NEW TRANSLATION
 SWE_Logistic_invests_desc: "Uvědomujíc si strategický význam odolné infrastruktury, Švédsko začalo modernizovat své dopravní koridory, digitální logistické systémy a vojenské dodavatelské řetězce. Tento investiční program má zajistit domácí mobilitu, zajistit rychlou vojenskou odezvu a integrovat se s nordickými a EU-wide logistickými standardy." # todo: NEW TRANSLATION
 SWE_cybershield: "Kyberobrana – Národní kyberštít" # todo: NEW TRANSLATION
 SWE_cybershield_desc: "Byl zahájen komplexní národní program kybernetické bezpečnosti k obraně kritické infrastruktury, vládních sítí a digitální suverenity. Vytvořen ve spolupráci s akademickými institucemi a obrannými dodavateli, program Kyberštít integruje detekci hrozeb založenou na AI, ofenzivní kyberkapacity a společné cvičení s důvěryhodnými partnery napříč EU a NATO." # todo: NEW TRANSLATION
 SWE_think_tank_links: "Politická síť – Strategické vazby think-tanků" # todo: NEW TRANSLATION
 SWE_think_tank_links_desc: "Švédsko zesílilo spolupráci s mezinárodními think-tanky a akademickými politickými institucemi, s cílem zvýšit geopolitickou prozíravost a strategické schopnosti. Tato strategie znalostní diplomacie umožňuje ideové ovlivňování, plánování scénářů a cílené poradenství v oblastech, jako je odolnost vůči klimatickým změnám, hybridní válka a digitální regulace." # todo: NEW TRANSLATION
 SWE_economic_forum: "Nordické hospodářské fórum" # todo: NEW TRANSLATION
 SWE_economic_forum_desc: "Nová pan-nordická iniciativa sdružuje ekonomy, vůdce průmyslu a státní aktéry, aby koordinovali odpovědi na ekonomické výzvy. Fórum si klade za cíl sladit fiskální politiku, zelené transformace a inovační strategie, aby byla zachována dlouhodobá konkurenceschopnost a odolnost nordického regionu v rostoucím fragmentovaném globálním hospodářství." # todo: NEW TRANSLATION
 SWE_idea_no_hijab: "Zákaz hidžábu"
 SWE_idea_no_hijab_desc: "Hidžáb je symbolem náboženského extremismu a v Švédsku není pro náboženský extremismus místo."
 SWE_idea_rassism: "Skrytý rasismus" # todo: NEW TRANSLATION
 SWE_idea_rassism_desc: "Navzdory pokrokovému obrazu se Švédsko potýká se strukturálními a kulturními problémy souvisejícími s etnickým vylučováním, sociálním rozvrstvením a politickou marginalizací. Tato napětí ohrožují národní soudržnost a legitimitu." # todo: NEW TRANSLATION
 SWE_idea_pluralism: "Demokratický pluralismus" # todo: NEW TRANSLATION
 SWE_idea_pluralism_desc: "Švédsko podporuje ideologickou rozmanitost, svobodu médií a zastoupení menšin. Demokratický pluralismus není pouze tolerován. Je cíleně pěstován jako zdroj legitimity a inovací." # todo: CHANGED
 SWE_idea_royal_social_society: "Královská sociální společnost" # todo: NEW TRANSLATION
 SWE_idea_royal_social_society_desc: "Švédská královská rodina aktivně podporuje sociální iniciativy, humanitární projekty a programy pro posílení mládeže. Jejich přítomnost posiluje národní identitu a spojuje tradici s občanskou odpovědností." # todo: NEW TRANSLATION
 SWE_idea_royal_crown_and_military: "Koruna a ozbrojené síly" # todo: NEW TRANSLATION
 SWE_idea_royal_crown_and_military_desc: "Monarchie posiluje své symbolické pouto se švédskou armádou. Prostřednictvím veřejných ceremonií, historického dědictví a sdílených hodnot Koruna upevňuje jednotu národa a obrany." # todo: CHANGED
 SWE_idea_royal_crown_and_military2: "Koruna a ozbrojené síly – Integrované" # todo: NEW TRANSLATION
 SWE_idea_royal_crown_and_military2_desc: "Přítomnost královské rodiny při výcviku důstojníků, strategickém poradenství a vzdělávání v oblasti národní obrany se institucionalizuje. Jde o novou etapu symbolického, avšak vlivného sladění monarchie s vojenským étosem." # todo: CHANGED
 SWE_idea_Victoria: "Korunní princezna Viktorie" # todo: NEW TRANSLATION
 SWE_idea_Victoria_desc: "Jako dědička trůnu se korunní princezna Viktorie stala symbolem kontinuity, empatie a veřejné služby. Její oddanost občanským povinnostem a její schopnost spojovat sociální vrstvy vzbuzují důvěru v monarchii a posilují národní jednotu. Její přítomnost odráží moderní monarchii, která rozumí své roli v demokratické společnosti." # todo: NEW TRANSLATION
 SWE_idea_Madeleine: "Princezna Madeleine" # todo: NEW TRANSLATION
 SWE_idea_Madeleine_desc: "Princezna Madeleine je známá svým odhodláním k ochraně dětí, humanitárním příčinám a mezinárodní Charitě. Její práce s globálními organizacemi a její schopnost reprezentovat Švédsko v zahraničí přispívá k pozitivní mezinárodní image a posiluje měkkou sílu monarchie." # todo: NEW TRANSLATION
 SWE_idea_philip: "Princ Carl Philip" # todo: NEW TRANSLATION
 SWE_idea_philip_desc: "Princ Carl Philip, vyučený jako vojenský důstojník a aktivní v veřejné prezentaci, spojuje tradici a modernitu. Ztělesňuje loajalitu, disciplínu a službu vlasti. Jeho spojení s ozbrojenými silami a závazek vůči veteránům a veřejným akcím posiluje symbolickou jednotu mezi korunou a vojenským duchem." # todo: NEW TRANSLATION
 SWE_idea_royal_cultural_institutes: "Královské kulturní instituce" # todo: NEW TRANSLATION
 SWE_idea_royal_cultural_institutes_desc: "Královská rodina aktivně podporuje muzea, akademie a kulturní diplomacii. Tyto instituce uchovávají národní dědictví a posilují měkkou moc Švédska v zahraničí." # todo: CHANGED
 SWE_idea_foi: "Totalförsvarets forskningsinstitut"
 SWE_idea_foi_desc: "Totalförsvarets forskningsinstitut posune obranný výzkum našeho státu do nové éry."
 SWE_science_nordic_idea: "Severská vědecká spolupráce"
 SWE_science_nordic_idea_desc: "Když se spojíme, budeme silnější."
 SWE_the_royals: "Královská rodina" # todo: NEW TRANSLATION
 SWE_the_royals_desc: "Královská rodina nadále slouží jako národní symbol, který je respektován, obdivován a záměrně omezený ve vládnutí. Jejich role je ceremoniální, ale hluboce zakořeněná v kulturním tkanivu Švédska." # todo: NEW TRANSLATION
 SWE_monarch_military1: "Royal Försvarsmakten" # todo: NEW TRANSLATION
 SWE_monarch_coordination_plan: "Plán státní ekonomické koordinace" # todo: NEW TRANSLATION
 SWE_kultur_idea: "Svensk Kulturväckelse" # todo: NEW TRANSLATION
 SWE_mannerheim_plan: "Mannerheim Infrastructure Pact" # todo: NEW TRANSLATION
 SWE_prepare_baltic: "Nad Östersjön" # todo: NEW TRANSLATION
 SWE_prepare_baltic_tt: "§RTento národní duch bude odstraněn, pokud vstoupíme do války!§!" # todo: CHANGED
 SWE_development_integration: "Rozvoj sítě královské logistiky" # todo: NEW TRANSLATION
 SWE_exploitation: "Švédská vykořisťování" # todo: NEW TRANSLATION
 SWE_colonial_court_idea: "Koloniální dvůr" # todo: NEW TRANSLATION
 SWE_viking_legacy_idea1: "Duch Uppsaly" # todo: NEW TRANSLATION
 SWE_danelaw_arsenal: "Arzenál Danelaw" # todo: NEW TRANSLATION
 SWE_danelaw_arsenal_desc: "Od dob vikinských nájezdů zůstává jedno stejné: nelze bojovat a vládnout bez řádného zásobování. §YVýjimkou je možnost vyplenit některé kostely nebo kláštery§!" # todo: CHANGED
 SWE_easter_horizon_idea1: "Východní horizont" # todo: NEW TRANSLATION
 SWE_easter_horizon_idea1_desc: "Poté, co jsme naznačili vliv NATO, míříme k silám budoucnosti." # todo: NEW TRANSLATION
 Sweden_Rus_Exercise: "Švédsko-ruské vojenské cvičení." # todo: NEW TRANSLATION
 Sweden_Rus_Exercise_desc: "Švédsko a Rusko souhlasily s uskutečněním společného vojenského cvičení, čímž posílí regionální koordinaci a obranné schopnosti." # todo: NEW TRANSLATION
 SWE_russian_energy_idea: "Ruská energetická dohoda" # todo: NEW TRANSLATION
 SWE_russian_energy_idea_desc: "Švédsko uzavřelo dohodu o energetické spolupráci s Ruskem. Přestože zajišťuje stálý dodávky paliv a elektřiny, zvyšuje i ekonomickou závislost na Ruské federaci." # todo: NEW TRANSLATION
 SWE_industry_exchange_swe: "Výměna vojenského průmyslu" # todo: NEW TRANSLATION
 SWE_industry_exchange_swe_desc: "Tajná průmyslová dohoda se Severní Koreou dodává švédským výrobcům zbraní levné materiály a pracovní sílu, čímž zvyšuje jejich produkci." # todo: CHANGED
 SWE_industry_exchange_nko: "Výměna švédského průmyslu" # todo: NEW TRANSLATION
 SWE_industry_exchange_nko_desc: "Severní Korea získala prostřednictvím tajné dohody se Švédskem obráběcí vybavení a výzkumné materiály, čímž zvýšila svou produkci." # todo: NEW TRANSLATION
 SWE_venezualen_accord_ven: "Švédská infrastruktura investice" # todo: NEW TRANSLATION
 SWE_venezualen_accord_ven_desc: "Po bilaterální dohodě se Švédskem Venezuela přijímá investice do infrastruktury a technologickou podporu, posilující její průmyslovou kapacitu a energetický rozvoj." # todo: NEW TRANSLATION
 SWE_venezualen_accord: "Venezuelské ropné projekty" # todo: NEW TRANSLATION
 SWE_venezualen_accord_desc: "V rámci strategické investiční dohody Švédsko zajistilo dlouhodobý přístup k venezuelské ropě výměnou za investice do průmyslu. Dohoda posiluje energetickou bezpečnost Švédska a ekonomické dosahy." # todo: NEW TRANSLATION
 SWE_cuba_medical_exchange: "Švédsko-kubské partnerství v oblasti zdravotnické techniky" # todo: NEW TRANSLATION
 SWE_cuba_medical_exchange_desc: "Díky dvoustranné dohodě se Švédskem Kuba těží z pokročilých švédských zdravotnických technologií, vybavení a společných výzkumných programů, které posilují naše domácí zdravotnictví." # todo: CHANGED
 SWE_iran_petrochemical_swe: "Íránská petrochemická dohoda" # todo: NEW TRANSLATION
 SWE_iran_petrochemical_swe_desc: "Pro strategickou dohodu s Íránem získalo Švédsko přístup k důležitým ropným zdrojům. Švédské podniky se nyní podílejí na pokročilých petrochemických projektech v zahraničí, čímž zvyšují domácí průmyslové zpracování a zajišťují dlouhodobé energetické vstupy." # todo: NEW TRANSLATION
 SWE_iran_petrochemical_iran: "Švédská průmyslová spolupráce" # todo: NEW TRANSLATION
 SWE_iran_petrochemical_iran_desc: "Švédsko zahájilo investice do íránského petrochemického a rafinérského sektoru. Díky jejich technickým znalostem a průmyslovému vybavení roste íránská kapacita co do objemu i technologické vyspělosti, což posiluje naši energetickou ekonomiku." # todo: CHANGED
 SWE_decision_Forsvarsmarkten_category: "Ozbrojené síly" # todo: NEW TRANSLATION
 SWE_decision_Forsvarsmarkten_category_desc: "\n£GFX_swedisch_homeguard \n\n\n\n\nŠvédský obranný systém je postaven na koncepci Celková obrana – jednotný přístup spojující vojenskou a civilní připravenost. Pod touto doktrínou spolupracují Ozbrojené síly s civilními agenturami jako MSB, aby zajistili národní odolnost v dobách krize či války. Znovu aktivovaná branná povinnost poskytuje stálý tok vycvičeného personálu, posilující ozbrojené síly a vytvářející společnost schopnou kolektivního odporu. Každý občan je součástí národního obranného plánu, od mobilizace po trvalé odbojové operace." # todo: NEW TRANSLATION
 SWE_Home_Guard: "Rozšiřte domobranu" # todo: NEW TRANSLATION
 SWE_Home_Guard_desc: "Domobrana slouží jako páteř místní obrany a rychlé reakce. Rozšířením její velikosti se zlepší regionální pohotovost a naše schopnost odolávat průnikům či náhlým útokům bude výrazně posílena. Vnitřní spojení těchto jednotek zajišťuje odolnost i pod tlakem." # todo: NEW TRANSLATION
 SWE_fortifications: "Posílit strategická místa" # todo: NEW TRANSLATION
 SWE_fortifications_desc: "Abychom ochránili klíčové oblasti, musíme investovat do robustních obranných postavení. Od pobřeží Skåne po lesy Norrlandu mohou pevná opevnění zdržet nebo odrazit jakéhokoli agresora tak dlouho, než bude mobilizace dokončena." # todo: NEW TRANSLATION
 SWE_Officer_education_course: "Důstojnický vzdělávací program" # todo: NEW TRANSLATION
 SWE_Officer_education_course_desc: "Vedení v Ozbrojených silách musí být kultivováno prostřednictvím náročného a kontinuálního vzdělávání. Rozšířením našich důstojnických vzdělávacích programů na institucích jako Försvarshögskolan zajistíme strategickou způsobilost a bojovou dokonalost." # todo: NEW TRANSLATION
 SWE_only_active_Personal_Trainings_exercise: "Provádět aktivní personální cvičení" # todo: NEW TRANSLATION
 SWE_only_active_Personal_Trainings_exercise_desc: "Rutinní cvičení a terénní výcvik jsou nezbytné k udržení našich stávajících ozbrojených sil ve střehu a bojové připravenosti. Tato cvičení posílí disciplínu, koordinaci a připravenost za realistických podmínek." # todo: NEW TRANSLATION
 SWE_Home_defence_Trainings_exercise: "Cvičit jednotky domácí obrany" # todo: NEW TRANSLATION
 SWE_Home_defence_Trainings_exercise_desc: "Připravenost začíná doma. Prováděním rozsáhlých cvičení pro záložníky a dobrovolnické jednotky posílíme naši schopnost reagovat na hybridní hrozby a nekonvenční válečné scénáře." # todo: NEW TRANSLATION
 SWE_launch_total_defence: "Aktivovat Celkovou obranu" # todo: NEW TRANSLATION
 SWE_launch_total_defence_desc: "Celková obrana mobilizuje celou zemi. Civilní infrastruktura, záchranné služby a vojenské síly budou působit jednotně pod koordinovanou národní obrannou strategií. Tento krok znamená posun od mírových rutin k plnohodnotné připravenosti." # todo: NEW TRANSLATION
 SWE_back_to_normality: "Demobilizovat a vrátit se k normálu" # todo: NEW TRANSLATION
 SWE_back_to_normality_desc: "S odzníváním hrozby můžeme začít snižovat naši zvýšenou pohotovost. Celková obrana se stáhne a národ se vrátí k mírovým rutinám, ale ponaučení a struktury zůstanou pro budoucnost." # todo: NEW TRANSLATION
 SWE_decision_Royal_category: "Švédská královská rodina" # todo: NEW TRANSLATION
 SWE_decision_Royal_category_desc: "\n\n\n\n£GFX_SWE_royals_decisions_pic \n\n\n\n\n\n\nŠvédská monarchie, znovuoživená v roce 1818 bývalým Napoleonickým maršálem Jean-Baptiste Bernadotte (King Charles XIV John), položila základy moderního Švédska prostřednictvím neutrality, reforem a industrializace. Ačkoli byla politicky zbavena moci ústavou z roku 1974, dynastie Bernadotte zůstává středobodem symbolu. Král Karel XVI. Gustaf a korunní princezna Viktorie představují kontinuitu a modernitu, posilují národní identitu a jednotu prostřednictvím kulturní diplomacie a ceremoniálních rolí..." # todo: NEW TRANSLATION
 SWE_king_speak_to_the_nation: "Královský projev k národu" # todo: NEW TRANSLATION
 SWE_king_speak_to_the_nation_desc: "V dobách nejistoty či národní reflexe může král promluvit k lidu přímo. Ačkoli postrádá politickou pravomoc, takové projevy nesou symbolickou váhu a posilují jednotu, důvěru a kontinuitu švédského státu." # todo: NEW TRANSLATION
 SWE_send_to_mandatory_service: "Královská účast na povinné službě" # todo: NEW TRANSLATION
 SWE_send_to_mandatory_service_desc: "Aby posílili pouto s národem a jeho obrannými silami, mohou členové královské rodiny vykonávat vojenskou službu po boku obyčejných občanů. Tento čin podtrhuje roli monarchie jako sdíleného symbolu povinnosti, pokory a národní koheze." # todo: NEW TRANSLATION
 SWE_training_as_officer: "Královské důstojnické vzdělávání" # todo: NEW TRANSLATION
 SWE_royal_officer_training_pending: "Žádný člen královské rodiny právě nepodstupuje důstojnický výcvik" # todo: NEW TRANSLATION
 SWE_training_as_officer_desc: "Vybraní členové královské rodiny, například korunní princezna Victoria a princ Carl Philip, absolvují důstojnický výcvik, aby prohloubili své porozumění švédským vojenským tradicím a občanským povinnostem. Tyto zkušenosti podporují respekt v ozbrojených silách a odrážejí trvalý závazek monarchie k národní službě." # todo: CHANGED
 SWE_science_patronage: "Královské patronství pro vědu" # todo: NEW TRANSLATION
 SWE_science_patronage_desc: "Švédská královská rodina dlouhodobě podporuje vzdělávání, výzkum a inovace. Udělením královského patronátu vědeckým institucím můžeme inspirovat veřejný zájem, přilákat zahraniční talenty a posílit pověst Švédska jako centra poznání a pokroku." # todo: NEW TRANSLATION
 SWE_military_review: "Královská vojenská revue" # todo: NEW TRANSLATION
 SWE_military_review_desc: "Ceremoniální inspekce našich ozbrojených sil královskou rodinou posiluje morálku a ukazuje připravenost Švédska. Kromě tradice tyto události posilují jednotu mezi armádou a lidem a vyhlašují světu důvěru." # todo: NEW TRANSLATION
 SWE_economy_review: "Královské ekonomické fórum" # todo: NEW TRANSLATION
 SWE_economy_review_desc: "Pořádání hospodářského fóra vedeného královskou rodinou signalizuje stabilitu a přitahuje investice. Symbolická role a mezinárodní přítomnost královské rodiny mohou otevřít dveře obchodním jednáním a partnerstvím, která posílí naši ekonomiku." # todo: CHANGED
 SWE_support_nationalist: "Jemná podpora národních hodnot" # todo: NEW TRANSLATION
 SWE_support_nationalist_desc: "Při zachování oficiální neutrality mohou členové královské rodiny zdůrazňovat švédské tradice a dědictví. Taková gesta rezonují s nacionalistickými náladami a posilují hrdost na naši suverenitu." # todo: CHANGED
 SWE_support_Democracy: "Obhájce demokratických hodnot" # todo: NEW TRANSLATION
 SWE_support_Democracy_desc: "Zdůrazněním oddanosti monarchie demokracii a právnímu státu může královská rodina sloužit jako symbolický strážce švédského politického systému a podporovat důvěru doma i v zahraničí." # todo: CHANGED
 SWE_will_of_the_people: "Vůle lidu" # todo: NEW TRANSLATION
 SWE_will_of_the_people_desc: "Podpora monarchie roste napříč národem, přesto se držíme demokratických hodnot, které definují moderní Švédsko. I když existuje možnost obnovit právo vládnout na základě vůle lidu, zůstáváme prvním mezi rovnými a vedeme národ službou, nikoliv nadvládou." # todo: NEW TRANSLATION
 Sweden_royal.1.t: "Královská účast na povinné službě" # todo: NEW TRANSLATION
 Sweden_royal.1.d: "V souladu se švédským systémem branné povinnosti a dlouholetou královskou tradicí nastoupí člen královské rodiny vojenskou službu. Ačkoli monarchie již nemá velitelskou pravomoc, symbolické činy sdílené národní povinnosti pomáhají posilovat pouto mezi státem, společností a korunou.\n\nToto rozhodnutí také ovlivní veřejné vnímání: volba královské osobnosti odráží různé hodnoty vedení, povinnost nebo soucit." # todo: CHANGED
 Sweden_royal.1.o1: "Přidělte korunní princezně Viktorii." # todo: NEW TRANSLATION
 Sweden_royal.1.o1_desc: "Jako dědička trůnu podstoupí korunní princezna Viktorie základní výcvik a důstojnické vzdělání. Její veřejný image disciplíny, sociálního svědomí a mezinárodní angažovanosti bude silným příkladem královské služby v moderní době." # todo: NEW TRANSLATION
 Sweden_royal.1.o2: "Přidělte princi Karlu Filipovi." # todo: NEW TRANSLATION
 Sweden_royal.1.o2_desc: "Princ Karel Filip, známý svým zájmem o námořní tradice a inženýrství, bude sloužit v ozbrojených silách jako symbol provozní loajality a začleňování mládeže. Jeho výcvik může také posílit respekt mezi důstojnickým sborem." # todo: NEW TRANSLATION
 Sweden_royal.2.t: "Začíná výcvik královských důstojníků." # todo: NEW TRANSLATION
 Sweden_royal.2.d: "Po přidělení k povinné vojenské službě byl vybraný člen královské rodiny schválen k formálnímu důstojnickému výcviku. Ačkoli jeho budoucí role zůstanou ceremoniální, rozhodnutí odráží trvalý švédský princip rovnostářské služby a závazek monarchie ke důvěryhodnosti, jednotě a národní integraci." # todo: CHANGED
 Sweden_royal.2.o1: "Korunní princezna Viktorie zahájí pokročilý důstojnický výcvik." # todo: NEW TRANSLATION
 Sweden_royal.2.o1_desc: "Její výcvik bude následovat na míru šitý program zahrnující vedení, koordinaci krizí a civilně-vojenskou spolupráci. Její zapojení je široce vnímáno jako důkaz důkladné přípravy na její budoucí roli, a nikoli jen symbolické působení." # todo: NEW TRANSLATION
 Sweden_royal.2.o2: "Princ Karel Filip nastoupí na námořní důstojnickou školu." # todo: NEW TRANSLATION
 Sweden_royal.2.o2_desc: "Se svým osobním zájmem o námořní tradice a taktický design bude princ Karel Filip procházet námořně orientovaným důstojnickým vzděláváním. Jeho přítomnost mezi kariérními důstojníky posiluje pouta mezi monarchií a operační obrannou komunitou." # todo: NEW TRANSLATION
 Sweden_royal.13.t: "Návrh na Královský kulturní institut." # todo: NEW TRANSLATION
 Sweden_royal.13.d: "Diplomatická delegace ze Švédska dorazila s prestižní nabídkou. Chtějí zřídit Královský kulturní institut v naší zemi, jehož cílem je prohloubení kulturní výměny, podpora vzájemného porozumění a posílení našich bilaterálních vztahů. Institut by pořádal výstavy, akademické výměny a společné historické projekty, a zároveň by poskytoval symbolický most mezi našimi národy.\n\nTaková instituce by mohla posílit naše vztahy a vytvořit trvalý základ pro spolupráci, avšak někteří v naší správě se obávají možných politických podtextů." # todo: NEW TRANSLATION
 Sweden_royal.13.a: "To bude náš vzájemný prospěch" # todo: NEW TRANSLATION
 Sweden_royal.13.b: "Odpověď zní: ne" # todo: NEW TRANSLATION
 SWE_heavy_industry_modifier: "Dědictví švédského těžkého průmyslu" # todo: NEW TRANSLATION
 SWE_heavy_industry_modifier_desc: "Švédský těžký průmysl, zformovaný v hutích 20. století, zůstává pilířem národní moci. Od obrněných vozidel po vodní turbíny je naše výrobní kapacita spolehlivá, přizpůsobivá a hluboce propojená s exportními trhy. Společnosti jako Bofors, Scania a Volvo AB tvoří průmyslovou páteř Totalförsvaret a v případě potřeby dokážou přejít z civilní na vojenskou výrobu.\n\nOcel stále proudí švédskými žilami." # todo: CHANGED
 SWE_Vattenfall_modifier: "Vattenfall - Napájí sever" # todo: NEW TRANSLATION
 SWE_Vattenfall_modifier_desc: "Společnost Vattenfall, založená před více než stoletím a stále vlastněná státem, je víc než jen dodavatelem energie je strategickým aktivem. Díky dominanci v hydroenergetice a rostoucí kontrole nad jadernými a systémy dálkového vytápění zajišťuje Vattenfall energetickou odolnost Švédska v míru i konfliktu. Její propojení se sítí v celém severském regionu z ní rovněž činí klíčového hráče regionální energetické diplomacie.\n\nZatímco ostatní energii dovážejí, Švédsko si ji vyrábí samo." # todo: CHANGED
 SWE_financial_place_modifier: "Nordické finanční centrum" # todo: NEW TRANSLATION
 SWE_financial_place_modifier_desc: "Stockholmem jako tepajícím srdcem se Švédsko vyvinulo ve finanční centrum seversko-baltského regionu. Instituce jako Nordea, SEB a Riksbank ukotvují stabilní kapitálové toky a moderní regulační systémy, zatímco digitální bankovnictví vede přechod k bezhotovostní ekonomice. Finanční odolnost není jen otázkou čísel je otázkou národní bezpečnosti.\n\nŠvédské trhy mohou být podle globálních měřítek malé, jejich význam však dalece přesahuje jejich velikost." # todo: CHANGED
 SWE_pharmacy_modifier: "Švédská farmaceutická špičkovost" # todo: NEW TRANSLATION
 SWE_pharmacy_modifier_desc: "Švédský farmaceutický průmysl, zakořeněný ve výzkumu a zdokonalený regulací, spojuje precizní vědu s globálním dosahem. Astra, Recipharm a Sobi tvoří základ klastru, který vyváží zdravotní péči, vyvíjí biologické léky a udává směr personalizované medicíně. Díky silným vazbám univerzit a průmyslu a veřejné důvěře v medicínu je toto odvětví tichým strážcem odolnosti a prosperity.\n\nZde se molekuly mění v zázraky." # todo: CHANGED
 SWE_digital_modifier: "Průkopníci Digitálního severu" # todo: NEW TRANSLATION
 SWE_digital_modifier_desc: "Od rané širokopásmové infrastruktury po technologické startupy světové úrovně začala švédská digitální cesta dříve, než si toho svět všiml. Státem podporované úsilí o konektivitu, vzdělávání a inovace proměnilo chladný křemík v hřejivou společenskou tkáň. Ericsson, Spotify a Klarna jsou jen povrchem pod ním se nachází digitálně zdatná pracovní síla a stát připravený automatizovat, analyzovat a jednat.\n\nVe Švédsku proudí data jako voda." # todo: CHANGED
 SWE_mining_modifier: "Dědictví švédského hornictví" # todo: NEW TRANSLATION
 SWE_mining_modifier_desc: "Švédský těžební sektor, vytesaný ze starobylé horniny a poháněný inovacemi, je již dlouho pilířem průmyslové moci. Kiruna a Gällivare znějí rytmem vrtaček a nakladačů, zatímco LKAB a Boliden prosazují udržitelnou těžbu ve světě hladovém po surovinách. Naše rudy zásobují evropské továrny a naše metody určují globální standardy. \n\nPod sněhem se skrývá síla." # todo: CHANGED
 SWE_army_dynamic_modifier: "Sveriges Försvarsmakt" # todo: NEW TRANSLATION
 SWE_army_dynamic_modifier_desc: "Recent reforms have reshaped the Swedish Army into a more mobile, professional, and modular force, capable of both domestic defense and international deployments." # todo: NEW TRANSLATION
 SWE_Special_forces_modifier: "Försvarsmaktens Elitenheter" # todo: NEW TRANSLATION
 SWE_Special_forces_modifier_desc: "Švédské elitní jednotky, cvičené v arktickém válčení, městském boji a asymetrických operacích, rozšiřují strategický dosah armády a demonstrují způsobilost v zónách konfliktu vysoké intenzity." # todo: CHANGED
 SWE_politics_modifier: "Fragmentovaná politická scéna" # todo: NEW TRANSLATION
 SWE_politics_modifier_desc: "Politická krajina je charakterizována ideologickými posuny, nestabilitou koalic a rostoucím napětím mezi reformisty a tradicionalisty. Vláda za těchto podmínek vyžaduje přizpůsobivost a kompromis." # todo: NEW TRANSLATION
 SWE_monarchy_modifier: "Symbol národní kontinuity" # todo: NEW TRANSLATION
 SWE_monarchy_modifier_desc: "Monarchie, i když ceremoniální, slouží jako sjednocující symbol, který ztělesňuje historickou legitimitu a sociální stabilitu. Její přítomnost posiluje soudržnost v dobách nejistoty." # todo: NEW TRANSLATION
 SWE_wind_farms: "Větrné parky" # todo: NEW TRANSLATION
 SWE_wind_farms_desc: "S rostoucí využitelností a udržitelností větrné energie se regionální investice do větrných parků začínají proměňovat energetickou krajinu. I když je vše ještě v počátcích, tato změna slibuje posílení energetické nezávislosti a snížení dopadů na životní prostředí v průběhu času." # todo: NEW TRANSLATION
 SWE_mines: "Těžební operace" # todo: NEW TRANSLATION
 SWE_mines_desc: "Místní těžební průmysl se oživuje za účelem získání cenných přírodních surovin. Tyto operace tvoří klíčový základ regionálních ekonomik a průmyslového rozvoje." # todo: NEW TRANSLATION
 SWE_upgraded_mining_equipment: "Modernizované těžební vybavení" # todo: NEW TRANSLATION
 SWE_upgraded_mining_equipment_desc: "Investice do moderních těžebních strojů a technik významně zlepšily těžební efektivitu a bezpečnost, posíljí výstup a snižují provozní náklady." # todo: NEW TRANSLATION
 SWE_science_center: "Regionální vědecké centrum" # todo: NEW TRANSLATION
 SWE_science_center_desc: "Vyhrazené vědecké centrum podporuje inovace a technologický výzkum, slouží jako uzel pro akademickou obec, startupy a průmysl usilující o vyspělá řešení." # todo: NEW TRANSLATION
 SWE_energy_link: "Energetická infrastrukturní spojení" # todo: NEW TRANSLATION
 SWE_energy_link_desc: "Nové investice do energetických přenosových vedení a přeshraniční infrastruktury posilují regionální sítě, zajišťují stabilnější a bezpečnější dodávky energie pro průmyslové i civilní sektory." # todo: NEW TRANSLATION
 SWE_nuklear_plant: "Jaderná elektrárna" # todo: NEW TRANSLATION
 SWE_nuklear_plant_desc: "Stavba jaderné elektrárny představuje významný krok k dlouhodobé energetické jistotě. Přestože vyžaduje pečlivý dohled, poskytuje rozsáhlé nízkoemisní elektrické zdroje nezbytné pro moderní ekonomiky." # todo: NEW TRANSLATION
 SWE_automotive_industrie_expansion: "Rozvoj automobilového průmyslu" # todo: NEW TRANSLATION
 SWE_automotive_industrie_expansion_desc: "Domácí automobilový sektor prochází rapidním rozvojem, s novými závody a dodavatelskými řetězci, které zvyšují průmyslový výkon, zaměstnanost a exportní kapacitu." # todo: NEW TRANSLATION
 SWE_regional_tourism_invest: "Regionální rozvoj cestovního ruchu" # todo: NEW TRANSLATION
 SWE_regional_tourism_invest_desc: "Cílené investice do turistické infrastruktury mají uvolnit ekonomický potenciál místních kulturních, historických a přírodních atrakcí, podpořit růst odvětví služeb a regionální prosperitu." # todo: NEW TRANSLATION
 SWE_Riga_legacy: "Dědictví švédské Rigy" # todo: NEW TRANSLATION
 SWE_Riga_legacy_desc: "Historický vliv švédské říše v Rigě dodnes rezonuje v jejích institucích a infrastruktuře. Toto dědictví podporuje místní rozvoj a stabilitu." # todo: NEW TRANSLATION
 SWE_southafrica_metals: "Jižně africká dohoda o strategických kovů" # todo: NEW TRANSLATION
 SWE_southafrica_metals_desc: "Prostřednictvím bilaterální dohody se Jižní Afrikou Švédsko zajistilo spolehlivý přístup k vzácným a strategickým kovům klíčovým pro obranu a vyspělé technologie." # todo: NEW TRANSLATION
 SWE_riksglans: "Riksglans"
 SWE_riksglans_desc: "Ať žije země."
 SAF_swe_metals_investment: "Švédské investice do těžebního sektoru" # todo: NEW TRANSLATION
 SAF_swe_metals_investment_desc: "Švédské investice modernizují těžební infrastrukturu Jihoafrické republiky, přinášejí pokročilé technologie a posilují průmyslovou produkci v klíčových strategických odvětvích." # todo: CHANGED
 SWE_balance_of_power: "Švédská neutralita" # todo: NEW TRANSLATION
 SWE_balance_of_power_desc: "Od roku 1814 švédsko kráčí po cestě promyšleného odstoupení od bloků velmocí, a to ne ze slabosti, ale z strategické doktríny neutrality. Tato rovnováha nyní čelí novým tlakům. Ve světě, který byl překreslen posunujícími se mocnostmi, dokáže Švédsko udržet svůj nezávislý kurz, nebo musí zvolit stranu v nové globální dělbě?" # todo: NEW TRANSLATION
 SWE_souvereign_neutrality: "Suverénní neutralita" # todo: NEW TRANSLATION
 SWE_souvereign_neutrality_desc: "Po více než dvě století si Švédsko úspěšně udržuje suverenitu tím, že zůstává mimo vojenské aliance. Tato politika vychází z pragmatismu a opatrnosti, formována válkou a zdokonalena v míru. I ve 21. století zůstává neutralita definujícím pilířem švédské identity a tichou mocí samostatně." # todo: NEW TRANSLATION
 SWE_nato_side: "Západní orientace" # todo: NEW TRANSLATION
 SWE_nato_side_desc: "Ve světě, který je ohrožen agresivními válkami, kybernetickými hrozbami a vzestupem autoritářství, si Švédsko již nemůže dovolit stát samo. Obyvatelstvo i vedení obrací svůj zrak na Západ nejen kvůli bezpečnostním zárukám, ale i kvůli potvrzení sdílených hodnot demokracie, transparentnosti a kolektivní obrany. Atlantská cesta nabízí ochranu, ale za cenu: ztrátu tradiční neutrality." # todo: NEW TRANSLATION
 SWE_russia_side: "Východní reorientace" # todo: NEW TRANSLATION
 SWE_russia_side_desc: "Zklamání Západem, jeho úpadkem, vnitřními spory a kulturními dogmaty vede k tomu, že část švédské populace a elity se začíná dívat na východ. To, co bývalo nemyslitelné, spojenectví s Moskvou, nyní vychází jako radikální proti liberalismu globálnímu. Pro ně neutralita selhala a Západ se stal samotnou hrozbou, proti které dříve měl chránit." # todo: NEW TRANSLATION
 SWE_atlantic_alligment: "Atlantické sladění" # todo: NEW TRANSLATION
 SWE_atlantic_alligment_desc: "Stále větší část švédského obyvatelstva volá po plné integraci do západního aliance systému. V době nestability mnoho lidí považuje členství v NATO a transatlantickou bezpečnostní záruku za jedinou realistickou cestu vpřed, i když to znamená opuštění více než dvou století neutrality." # todo: NEW TRANSLATION
 SWE_western_preference: "Západní preference" # todo: NEW TRANSLATION
 SWE_western_preference_desc: "Veřejné mínění stále více upřednostňuje těsnější vazby se Západem. Zatímco formální neutralita zůstává, touha po bližší spolupráci s partnery NATO a EU roste, poháněna bezpečnostními obavami, sdílenými demokratickými hodnotami a hlubokou hospodářskou integrací." # todo: NEW TRANSLATION
 SWE_cooperative_neutrality: "Kooperativní neutralita" # todo: NEW TRANSLATION
 SWE_cooperative_neutrality_desc: "Větší část švédského obyvatelstva nadále věří v neutralitu, ale ne v izolaci. Roste podpora mezinárodní spolupráce v mírových misích, zpravodajství a obranných dialozích, aniž by se překročila hranice úplného členství v alianci." # todo: NEW TRANSLATION
 SWE_pragmatic_eastern_opening: "Pragmatické otevření na Východ" # todo: NEW TRANSLATION
 SWE_pragmatic_eastern_opening_desc: "Některé hlasy tvrdí, že by Švédsko mělo diverzifikovat svou zahraniční politiku a snížit závislost na západních mocnostech. Požadují pragmatické zapojení na Východ, zejména s Ruskem, ne z ideologie, ale z touhy po regionální stabilitě a hospodářských příležitostech." # todo: NEW TRANSLATION
 SWE_strategic_balance: "Strategické vyvážení" # todo: NEW TRANSLATION
 SWE_strategic_balance_desc: "Ve veřejné debatě dochází k posunu. Jak se napětí ve světě zvyšuje, část společnosti volá po odvážnějším vyvažovacím postupu, který není plně západní ani východní, ale který Švédsko staví do role suverénního stabilizátoru v Baltském regionu prostřednictvím selektivních aliancí a diplomatické flexibility." # todo: NEW TRANSLATION
 SWE_Russian_allignment: "Ruské sladění" # todo: NEW TRANSLATION
 SWE_Russian_allignment_desc: "Na okraji, ale rostoucích kruzích, Západ není vnímán jako ochránce, ale jako korozivní síla morálně zhoubná a nepřátelská vůči tradici. Tyto skupiny požadují radikální reinterpretaci směrem k Rusku, přijímají ho jako opěrný pilíř proti liberálnímu globalismu a jako partnera ve suverenitě." # todo: NEW TRANSLATION
 SWE_balance_of_power_category: "Švédsko a historie neutrality" # todo: NEW TRANSLATION
 SWE_balance_of_power_category_desc: "Od roku 1814 kráčí Švédsko po cestě cíleného odstupu od velmocenských bloků, nikoli ze slabosti, ale z strategické doktríny neangažovanosti. Tato rovnováha nyní čelí novým tlakům. Ve světě překresleném posunujícími se mocnostmi lze Švédsko udržet svou nezávislou trajektorií, nebo musí vybrat stranu v novém globálním rozdělení?" # todo: NEW TRANSLATION
 SWE_the_price_of_neutrality: "Cena neutrality" # todo: NEW TRANSLATION
 SWE_the_price_of_neutrality_desc: "Švédsko má dlouhou a složitou historii neutrality, zformovanou staletími válek a přežití. Od Gustava II. Adolfa ve třicetileté válce po prohlášení neutrality z roku 1834 a poválečný „švédský model“ diplomacie nás odstup od aliancí udržoval v bezpečí. V měnícím se světě má však neutralita svou cenu a možná nastal čas zvážit užší přiblížení k oficiálnímu vojenskému partnerství se Západem." # todo: CHANGED
 SWE_ask_the_minister_of_defence_dialog: "Zeptejte se ministra obrany" # todo: NEW TRANSLATION
 SWE_ask_the_minister_of_defence_dialog_desc: "Ministr obrany představuje jak institucionální paměť, tak strategickou předvídavost. Zahájením veřejného dialogu prostřednictvím oficiálních prohlášení a rozhovorů umožníme myšlence západní orientace vstoupit do veřejného prostoru autoritou, nikoli ideologií. To pomáhá změnit národní vnímání směrem k dlouhodobému uvažování o alianci." # todo: NEW TRANSLATION
 SWE_security_information_campain: "Informační kampaň o bezpečnosti" # todo: NEW TRANSLATION
 SWE_security_information_campain_desc: "Spuštění kampaně založené na faktech o bezpečnostních zranitelnostech Švédska a o měnícím se bezpečnostním prostředí v Baltském moři má za cíl přeformulovat debatu. Pokud neutralita kdysi chránila, dnes nás může vystavit riziku. Veřejné povědomí se stává nástrojem k vybudování podpory pro hlubší spolupráci se západními obrannými strukturami." # todo: NEW TRANSLATION
 SWE_symbolic_campain_to_make_citizens_familiar: "Symbolická kampaň pro porozumění občanů" # todo: NEW TRANSLATION
 SWE_symbolic_campain_to_make_citizens_familiar_desc: "Jemné, ale silné symboly, společné cvičení s NATO, vlajky na velvyslanectvích nebo kulturní výměnné kampaně mohou ovlivnit veřejné mínění. Zvyklost vede k přijmutí. Tato symbolická kampaň sice nezmění politiku přímo, ale emocionálně připraví občany na možnou západní orientaci." # todo: NEW TRANSLATION
 SWE_the_swedish_way: "Švédská cesta" # todo: NEW TRANSLATION
 SWE_the_swedish_way_desc: "Po generacích 'Švédská cesta' reprezentuje nezávislost, diplomacii a neutralitu. Tato iniciativa potvrzuje náš závazek k neutralitě alespoň formálně. Avšak vyzváním k národní reflexi o tom, jak Švédsko zajišťuje mír ve 21. století, začínáme formovat myšlení, které časem může vést k sladění se západními bezpečnostními rámci." # todo: NEW TRANSLATION
 SWE_what_means_neutrality_to_us: "Co pro nás znamená neutralita?" # todo: NEW TRANSLATION
 SWE_what_means_neutrality_to_us_desc: "Tato celostátní diskusní kampaň je prezentována jako znovupotvrzení švédského neutrálního postoje. Tím, že se ptáme, co neutralita skutečně znamená v dnešním složitém světě, však otevíráme prostor pro strategickou reinterpretaci. To umožňuje postupně zmírnit veřejný odpor k případným aliancím a zároveň zachovat zdání kontinuity." # todo: CHANGED
 SWE_build_up_swedish_think_tank: "Založení Švédské think-tank" # todo: NEW TRANSLATION
 SWE_build_up_swedish_think_tank_desc: "Státní think-tank zaměřený na neutralitu poskytuje intelektuální legitimitu pro udržení nezávislosti. Jeho skutečná funkce však spočívá v tom, že zpočátku simuluje a analyzuje možnosti aliancí za zavřenými dveřmi. Zatímco veřejně posiluje neutralitu, připravuje elitní konsensus a politické rámce, které by mohly umožnit změnu za podmínek." # todo: NEW TRANSLATION
 SWE_multipolar_world: "Multipolární svět" # todo: NEW TRANSLATION
 SWE_multipolar_world_desc: "Unipolární okamžik skončil. Vzestupný východ zpochybňuje západní dominanci a Švédsko musí uznat tuto měnící se globální architekturu. Prosazováním světonázoru založeného na multipolárním vyvažování otevíráme veřejnost hlubším kontaktům s ne-západními mocnostmi, zvláště s těmi, které prosazují suverenitu, kulturní pluralitu a nezasahování." # todo: NEW TRANSLATION
 SWE_det_andra_europa: "Druhá Evropa" # todo: NEW TRANSLATION
 SWE_det_andra_europa_desc: "Existuje jiná Evropa, která není formována Bruselem a NATO, ale je zakořeněná v tradici, suverenitě a jiných historických zkušenostech. Zdůrazněním kulturních, náboženských a geopolitických vazeb k východní Evropě a slovanskému světu pomáháme vytvářet psychologický a ideologický prostor pro přeorientování." # todo: NEW TRANSLATION
 SWE_do_ostkontact: "Zahájit východní kontakt" # todo: NEW TRANSLATION
 SWE_do_ostkontact_desc: "Přestože udržujeme oficiální neutralitu, zahajujeme kulturní, ekonomické a akademické výměny s Ruskem a státy Eurasie. Tyto nenápadné kontakty slouží jako základ budoucích scénářů sladění. Signál pro domácí aktéry, že neutralita neznamená loajalitu k Západu." # todo: NEW TRANSLATION
 SWE_blame_the_arrogant_west: "Kritizovat arogantní Západ" # todo: NEW TRANSLATION
 SWE_blame_the_arrogant_west_desc: "Veřejná nespokojenost se západem, s jeho morálním postojem, ekonomickou dominancí a politickou věcí roste. Tento sentiment se promítá do oficiální rétoriky tak, že neutralita není vyvažováním sil, ale odmítnutím západní arogance. Tento posun zvyšuje otevřenost k východním alternativám." # todo: NEW TRANSLATION
 SWE_Technologie_Exchange_groupe_name: "Onsagerův Institut pro technologickou výměnu" # todo: NEW TRANSLATION
 SWE_Technologie_Exchange_groupe_desc: "Pojmenován na počest Larse Onsagera, nositele Nobelovy ceny za fyzikální chemii s norským americkým zázemím a švédskými kořeny, tento institut podporuje přeshraniční technologickou spolupráci. Jeho cílem je urychlit vědecký pokrok a průmyslovou inovaci prostřednictvím strukturovaného sdílení znalostí mezi partnerskými státy." # todo: NEW TRANSLATION
 SWE_four_year_plan_category: "Lidový čtyřletý plán" # todo: NEW TRANSLATION
 SWE_four_year_plan_category_desc: "Monarchie byla rozpuštěna a s ní i iluze dědičného privilegia. Nyní začíná skutečná transformace švédské společnosti řízená lidem, pro lidi. Čtyřletý plán mobilizuje veškeré národní zdroje pro kolektivní pokrok, průmyslovou nezávislost, ideologickou jasnost a mezinárodní připravenost." # todo: NEW TRANSLATION
 SWE_increase_the_workforce: "Mobilizace pracovní síly" # todo: NEW TRANSLATION
 SWE_increase_the_workforce_desc: "Lidé už nejsou jen diváci. Všichni musí sloužit kolektivnímu dobru. Každý občan bude přispívat bez ohledu na bývalou třídu, pohlaví či region." # todo: NEW TRANSLATION
 SWE_improve_economic_capacity: "Restrukturalizace ekonomiky" # todo: NEW TRANSLATION
 SWE_improve_economic_capacity_desc: "Od královských panství po privatizované utilities se všechny strategické sektory reorganizují pod veřejnou kontrolou. Produkce bude sloužit národu, ne dynastickému luxusu." # todo: NEW TRANSLATION
 SWE_true_education: "Zřízení ideologického vzdělávání" # todo: NEW TRANSLATION
 SWE_true_education_desc: "Monarchie zkorumpovala mysl mládeže mýty a poslušností. Nové občanské vzdělávání naučí kritické myšlení, rovnost a věrnost republice, nikoli koruně." # todo: NEW TRANSLATION
 SWE_build_partnership: "Vytvořte aliance proti imperialismu" # todo: NEW TRANSLATION
 SWE_build_partnership_desc: "Abychom odolali starým mocnostem a globálním monopolům, Švédsko naváže aliance s jinými státy, které odmítají aristokracii, ekonomické vykořisťování a vnější nadvládu." # todo: NEW TRANSLATION
 SWE_intervention_force: "Vytvořte Lidovou intervenční sílu" # todo: NEW TRANSLATION
 SWE_intervention_force_desc: "Musíme být připraveni bránit republiku nejen na našich hranicích, ale kdekoliv, kde je lid utlačován. Intervenční síla bude jednat rychle, rozhodně a bez váhání." # todo: NEW TRANSLATION
 philip_mandatory_service: "Princ Philip vykonává povinnou službu." # todo: NEW TRANSLATION
 madeleine_mandatory_service: "Princezna Madeleine vykonává povinnou službu." # todo: NEW TRANSLATION
 victoria_mandatory_service: "Princezna Victoria vykonává povinnou službu." # todo: NEW TRANSLATION
 philip_officer_training: "Princ Philip v důstojnickém výcviku" # todo: NEW TRANSLATION
 victoria_officer_training: "Princezna Victoria v důstojnickém výcviku" # todo: NEW TRANSLATION
 SWE_whistle_blowers_I: "Nenávidět oznamovatele" # todo: NEW TRANSLATION
 SWE_whistle_blowers_II: "Milovat oznamovatele" # todo: NEW TRANSLATION
 Sweden_foci.40.t: "Hodnocení letectva: Švédsko není připravené" # todo: NEW TRANSLATION
 Sweden_foci.40.d: "Poslední interní komise vedená vyššími důstojníky Švédského letectva dospěla k závěru, že naše současná infrastruktura protivzdušné obrany nestačí k požadavkům moderního boje. Naše stávající systémy postrádají kapacitu k čelení rychlým, více­vektorovým hrozbám, zejména raketám s plochou trajektorií a nízko letícím dronům.\n\nZpráva vyzývá k okamžité akci: musíme rozhodnout, zda rozšíříme naše kapacity dlouhého dosahu protivzdušné obrany, posílíme mobilní obranu krátkého dosahu, nebo oboje restrukturalizujeme vyváženě." # todo: NEW TRANSLATION
 Sweden_foci.40.a: "Investujte do systémů krátkého dosahu protivzdušné obrany." # todo: NEW TRANSLATION
 Sweden_foci.40.b: "Nasadit dlouhodobé protiraketové odpalovací platformy." # todo: NEW TRANSLATION
 Sweden_foci.40.c: "Upřednostnit vrstvenou protiletovou obranu na všech pásmech." # todo: NEW TRANSLATION
 Sweden_foci.41.t: "Restrukturalizace vojenských letišť" # todo: NEW TRANSLATION
 Sweden_foci.41.d: "Naše současná infrastruktura vojenských vzdušných základen nadále vychází z doktrí studené války, s důrazem na rozptýlení spíše než na trvalé operace. V kontextu moderních hrozeb a operačních potřeb je reforma neodkladná. Obranný staff navrhl několik možností, od rozšíření kapacit a logistických vylepšení po výstavbu velkého nového uzlu ve středním Švédsku." # todo: NEW TRANSLATION
 Sweden_foci.41.a: "Rozšířit kapacitu vzdušných základů." # todo: NEW TRANSLATION
 Sweden_foci.41.b: "Vybudovat základnu ve Värmlandu." # todo: NEW TRANSLATION
 Sweden_foci.41.c: "Modernizovat logistiku vzdušných základen." # todo: NEW TRANSLATION
 Sweden_foci.42.t: "SAAB představuje Gripen 39E." # todo: NEW TRANSLATION
 Sweden_foci.42.d: "Švédská zbrojní firma SAAB oficiálně představila svůj nejnovější víceúčelový bojový letoun Gripen 39E. Navržený pro nákladově efektivní vzdušnou nadvládu, přesné údery a moderní síťovou válku, disponuje vylepšenými senzory, doletem a kapacitou zbraní.\n\nŠvédsko nabídlo export letounu do naší země buď prostřednictvím přímé dohody o pořízení, nebo omezený přístup ke klíčovým technologiím pro domácí vývoj." # todo: NEW TRANSLATION
 Sweden_foci.42.a: "Objednejte a posilte naši leteckou sílu." # todo: NEW TRANSLATION
 Sweden_foci.42.b: "Prozkoumat návrh a zjistit, co z něj lze využít." # todo: NEW TRANSLATION
 Sweden_foci.44.t: "Švédsko žádá o přístup k raketám Taurus." # todo: NEW TRANSLATION
 Sweden_foci.44.d: "Německo formálně schválilo náš požadavek na pořízení raketového systému Taurus KEPD 350. To představuje významný krok v prohlubování strategické spolupráce a skok vpřed v našich schopnostech dlouhého doletu.\n\nMůžeme nyní zadat počáteční objednávku nebo se zaměřit na to, jak se poučit z pokročilého designu tohoto raketového systému." # todo: NEW TRANSLATION
 Sweden_foci.44.a: "Již používají některé součástky; dohodu schvalujeme." # todo: NEW TRANSLATION
 Sweden_foci.44.b: "Nesdílíme tuto úroveň schopností." # todo: NEW TRANSLATION
 Sweden_foci.43.t: "Schválen nákup Taurus." # todo: NEW TRANSLATION
 Sweden_foci.43.d: "Německo oficiálně schválilo naši žádost o získání raketového systému Taurus KEPD 350. Jde o významný krok k prohloubení strategické spolupráce a posun našich schopností dálkových úderů.\n\nNyní můžeme zadat první objednávku, nebo se zaměřit na studium pokročilé konstrukce této rakety." # todo: CHANGED
 Sweden_foci.43.a: "Zadat objednávku na 40 kusů." # todo: NEW TRANSLATION
 Sweden_foci.43.b: "Studovat design pro domácí vývoj." # todo: NEW TRANSLATION
 Sweden_foci.45.t: "Export Taurus byl odmítnut." # todo: NEW TRANSLATION
 Sweden_foci.45.d: "Německo odmítlo náš požadavek na pořízení Taurus raket, citujíc exportní omezení a vnitřní politické obavy. Přestože je to zklamání, toto rozhodnutí ukazuje limity důvěry ve strategickou spolupráci a nutí nás přehodnotit naši doktrínu hlubokého zásahu." # todo: NEW TRANSLATION
 Sweden_foci.45.a: "Nepřátelský signál zaznamenán." # todo: NEW TRANSLATION
 Sweden_foci.34.t: "Kockums představuje ponorku Blekinge-třídy." # todo: NEW TRANSLATION
 Sweden_foci.34.d: "Švédský loděnický výrobce Kockums představil svůj nejnovější vývoj – ponorku Blekinge-třídy (A26). Navržena pro operace v příští generaci pod vodou, plavidlo má pokročilou architekturu potlačení detekce, modulární nástavby pro mise a vzduchově nezávislý pohon.\n\nOficiální exportní nabídka nám byla předložena. Nyní se musíme rozhodnout, zda ponorky zakoupíme kompletně, nebo vstoupíme do omezeného partnerství s cílem získat přístup k určitým komponentám a technologiím." # todo: NEW TRANSLATION
 Sweden_foci.34.a: "Zadat objednávku na celý systém." # todo: NEW TRANSLATION
 Sweden_foci.34.b: "Vyjednat částečnou dodávku technologií a jejich integraci." # todo: NEW TRANSLATION
 Sweden_foci.341.t: "Blekinge-třídy plány dodány." # todo: NEW TRANSLATION
 Sweden_foci.341.d: "Na základě naší dohody s Kockums jsme obdrželi kompletní výrobní plány pro ponorku Blekinge-třídy. Domácí výroba může začít okamžitě, čímž naše námořnictvo získá strategickou výhodu při operacích na mělčinách a při tichých hlídkách." # todo: NEW TRANSLATION
 Sweden_foci.341.a: "Výborně, připravte loděnice pro stavbu." # todo: NEW TRANSLATION
