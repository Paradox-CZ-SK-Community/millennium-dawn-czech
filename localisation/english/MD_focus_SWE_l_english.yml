 SWE_ericsson_manufacturer: "Ericsson" # todo: NEW TRANSLATION
 SWE_ericsson_manufacturer_desc: "Společnost založená ve stockholmské dílně roku 1876 je dodnes důvodem, proč desetimilionová země stanovuje telekomunikační standardy, které pak zbytek světa přijímá. Ericsson vyrábí rádiové přístupové sítě přenášející třetinu světového mobilního provozu a jeho mikrovlnná divize vybavovala švédskou protivzdušnou obranu radary, než byla prodána Saabu." # todo: NEW TRANSLATION
 SWE_ericsson_manufacturer_trait: "Dědictví rádiových systémů" # todo: NEW TRANSLATION
 SWE_ericsson_manufacturer_mio_header_networks: "Sítě a nasazení" # todo: NEW TRANSLATION
 SWE_ericsson_manufacturer_mio_header_research: "Výzkum a standardy" # todo: NEW TRANSLATION
 SWE_ericsson_radio_base_stations: "Rádiové základnové stanice" # todo: NEW TRANSLATION
 SWE_ericsson_radio_base_stations_desc: "Stožár, skříň a přenosové spojení. Nenápadný hardware, který rozhoduje o tom, zda síť vůbec existuje." # todo: NEW TRANSLATION
 SWE_ericsson_mobile_core_network: "Mobilní páteřní síť" # todo: NEW TRANSLATION
 SWE_ericsson_mobile_core_network_desc: "Přepojování, záznamy účastníků a fakturace. Kdo dodává páteřní síť, udrží si operátora jako zákazníka na celé desetiletí." # todo: NEW TRANSLATION
 SWE_ericsson_national_rollout: "Celostátní zavádění" # todo: NEW TRANSLATION
 SWE_ericsson_national_rollout_desc: "Povinnosti pokrytí zapsané v licenci mění komerční výstavbu v národní infrastrukturu." # todo: NEW TRANSLATION
 SWE_ericsson_export_contracts: "Exportní smlouvy" # todo: NEW TRANSLATION
 SWE_ericsson_export_contracts_desc: "Operátoři v zahraničí kupují referenční síť, kterou Švédsko vybudovalo doma, i servisní smlouvu, která po ní následuje." # todo: NEW TRANSLATION
 SWE_ericsson_hardened_military_links: "Odolná vojenská spojení" # todo: NEW TRANSLATION
 SWE_ericsson_hardened_military_links_desc: "Šifrované přenosové kanály odolné proti rušení pro ozbrojené síly, postavené na civilní síti, ale zkonstruované tak, aby přežily i bez ní." # todo: NEW TRANSLATION
 SWE_ericsson_research_laboratory: "Výzkumná laboratoř" # todo: NEW TRANSLATION
 SWE_ericsson_research_laboratory_desc: "Stálá výzkumná organizace namísto projektové kanceláře umožňuje dodavateli vést tvorbu standardu, místo aby jej pouze zaváděl." # todo: NEW TRANSLATION
 SWE_ericsson_radio_chipset_design: "Návrh rádiových čipových sad" # todo: NEW TRANSLATION
 SWE_ericsson_radio_chipset_design_desc: "Vlastní návrh křemíku pro základní pásmo odstraňuje závislost a přináší marži, která s ním souvisí." # todo: NEW TRANSLATION
 SWE_ericsson_standards_leadership: "Vedení standardizace" # todo: NEW TRANSLATION
 SWE_ericsson_standards_leadership_desc: "Předsedání pracovní skupině má větší cenu než vítězství v jediné soutěži: standard se píše kolem toho, co již dokážete vyrábět." # todo: NEW TRANSLATION
 SWE_ericsson_expanded_operations: "Rozšířený provoz" # todo: NEW TRANSLATION
 SWE_ericsson_expanded_operations_desc: "Více souběžných programů než jediná vlajková zakázka a zaměstnanci, kteří je dokážou řídit." # todo: NEW TRANSLATION
 SWE_ericsson_signals_support_division: "Divize podpory spojení" # todo: NEW TRANSLATION
 SWE_ericsson_signals_support_division_desc: "Tichá práce pro obranný establishment, využívající stejné odbornosti v oblasti rádiových systémů, která prodává základnové stanice." # todo: NEW TRANSLATION
 SWE_ericsson_integrated_network_house: "Integrovaná síťová divize" # todo: NEW TRANSLATION
 SWE_ericsson_integrated_network_house_desc: "Křemík, rádio, páteřní síť a standardy pod jednou střechou. Jen málo dodavatelů na světě dokáže nabídnout celý technologický zásobník." # todo: NEW TRANSLATION
 Sweden.320.t: "Jeden lídr, nebo několik" # todo: NEW TRANSLATION
 Sweden.320.d: "Saab pohltil Celsius a s ním většinu toho, co zbylo ze švédské obranné výroby. Brusel schválí fúzi pouze za podmínky odprodeje části majetku a otázkou je, jak hluboko půjde. Zachování celku uvnitř Saabu dá devítimilionové zemi jedinou firmu schopnou postavit stíhačku; omezení naopak zachová konkurenci, kterou trh této velikosti možná nedokáže uživit." # todo: NEW TRANSLATION
 Sweden.320.a: "Zachovat Saab jako národního lídra" # todo: NEW TRANSLATION
 Sweden.320.b: "Provést hluboký odprodej a zachovat konkurenceschopnou dodavatelskou základnu" # todo: NEW TRANSLATION
 Sweden.321.t: "Prodává se i s továrnou" # todo: NEW TRANSLATION
 Sweden.321.d: "Nikdo nekupuje Gripen proto, že je levný. Saab jej prodává s kompenzacemi: místní montáží, přenosem technologií a průmyslovou účastí v hodnotě značné části kontraktu. Jižní Afrika, Maďarsko i Česká republika byly získány tímto způsobem. Tento model přesouvá letadla, ale každá dohoda předává zákazníkovi část schopností, díky nimž se vyplatilo nakupovat právě od Švédska." # todo: NEW TRANSLATION
 Sweden.321.a: "Prodávat průmyslový balíček, ne jen letoun" # todo: NEW TRANSLATION
 Sweden.321.b: "Citlivou výrobu ponechat ve Švédsku" # todo: NEW TRANSLATION
 Sweden.322.t: "Brazílie říká Gripen" # todo: NEW TRANSLATION
 Sweden.322.d: "Brazílie zvolila Gripen NG před Rafalem a Super Hornetem — třicet šest letounů výměnou za balíček přenosu technologií, který do programu zapojuje Embraer. Jde o největší exportní kontrakt, jaký kdy Saab podepsal, a příští generace letounu se díky němu stává švédsko-brazilským, nikoli čistě švédským produktem." # todo: NEW TRANSLATION
 Sweden.322.a: "Přijmout zakázku a sdílet platformu" # todo: NEW TRANSLATION
 Sweden.322.b: "Ponechat příští generaci jako národní program" # todo: NEW TRANSLATION
 Sweden.323.t: "Získání loděnic zpět" # todo: NEW TRANSLATION
 Sweden.323.d: "Kockums staví švédské ponorky a vlastní jej ThyssenKrupp. Vztahy se zhoršily natolik, že stát zrušil smlouvy a vyslal úředníky, aby ze závodu odvezli vybavení. Saab je ochoten jej koupit. Tím se výroba ponorek vrátí do švédských rukou za cenu stanovenou prodejcem, který nyní nemá žádného jiného kupce." # todo: NEW TRANSLATION
 Sweden.323.a: "Koupit Kockums a vrátit loděnice do vlasti" # todo: NEW TRANSLATION
 Sweden.323.b: "Pokračovat ve výrobě pod zahraničním vlastníkem" # todo: NEW TRANSLATION
 Sweden.324.t: "Žádost" # todo: NEW TRANSLATION
 Sweden.324.d: "Švédsko požádalo o vstup do NATO a spolu s tím končí dvě století formální nezúčastněnosti. Pro Saab se mění zákazník: požadavky na interoperabilitu, alianční nákupy a evropské přezbrojení již naplnily objednávkové knihy. Končí také argument, že švédský letoun je jedinou volbou, která nepřichází s připojenou aliancí." # todo: NEW TRANSLATION
 Sweden.324.a: "Stavět pro alianci" # todo: NEW TRANSLATION
 Sweden.324.b: "Zachovat nezávislou výrobní řadu, kterou si mohou zákazníci koupit bez vstupu do čehokoli" # todo: NEW TRANSLATION
 Sweden.325.t: "Čím se Saab stal" # todo: NEW TRANSLATION
 Sweden.325.d: "Čtvrt století konsolidace, kompenzací, brazilské zakázky a navrácené ponorkové loděnice ustálilo, čím Saab je a co si devítimilionová země stále dokáže vyrobit sama: kdo kupuje letouny a do čí aliance jsou zapojeny senzory." # todo: NEW TRANSLATION
 Sweden.325.a: "Spojenecký exportér s plnými objednávkovými knihami" # todo: NEW TRANSLATION
 Sweden.325.b: "Exportér, který se nezodpovídá žádné alianci" # todo: NEW TRANSLATION
 Sweden.325.c: "Specialista uvnitř cizí aliance" # todo: NEW TRANSLATION
 Sweden.325.e: "Arzenál, který vyzbrojuje především sám sebe" # todo: NEW TRANSLATION
 SWE_saab_allied_arms_exporter: "Spojenecký exportér zbraní" # todo: NEW TRANSLATION
 SWE_saab_allied_arms_exporter_desc: "Saab prodává stíhačky, senzory a ponorky do aliance, která se rozhodla přezbrojit, a švédské loděnice a montážní linky je vyrábějí. Vlastnictví výrobní kapacity znamená, že objednávková kniha je národním aktivem, nikoli pouhým vztahem se zákazníky." # todo: NEW TRANSLATION
 SWE_saab_non_aligned_exporter: "Nezúčastněný exportér" # todo: NEW TRANSLATION
 SWE_saab_non_aligned_exporter_desc: "Saab stále prodává letouny i s připojenou továrnou kupcům, kteří chtějí schopnosti bez připojené aliance. Trh je menší a nezávislost je tím, co se prodává." # todo: NEW TRANSLATION
 SWE_saab_alliance_specialist: "Ali alianční specialista" # todo: NEW TRANSLATION
 SWE_saab_alliance_specialist_desc: "Saab vyrábí senzory, letouny včasné výstrahy a ponorky, které aliance jen obtížně získá jinde, a zbytek nakupuje. Specializace zajišťuje místo u stolu, nikoli úplnou výrobní základnu." # todo: NEW TRANSLATION
 SWE_saab_domestic_arsenal: "Domácí arzenál" # todo: NEW TRANSLATION
 SWE_saab_domestic_arsenal_desc: "Saab vyrábí především pro Švédsko, podle švédských podmínek a v švédských objemech. Konstrukční schopnosti zůstávají nedotčeny a jednotkové náklady jsou takové, jaké jsou, když se o ně nikdo další nedělí." # todo: NEW TRANSLATION
