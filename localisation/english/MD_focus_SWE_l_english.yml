 Sweden_foci.6003.d2: "Rusko odmítlo nabídku Švédska na pořízení ponorek Lada-Class, poukazuje na geopolitické dopady a strategické priority. Tato odmítnutí je ztracená příležitost pro posílení vojenské spolupráce." # todo: NEW TRANSLATION
 Sweden_foci.6003.d3: "Spojené státy americké odmítly Švédsku žádost o pořízení ponorek Seawolf-Class, zaměřené na své vlastní obranné požadavky a exportní politiky. Toto rozhodnutí může ovlivnit budoucí diplomatické vztahy." # todo: NEW TRANSLATION
 Sweden_foci.6003.o1: "Další státní návštěva, při které podáme Surströmming" # todo: NEW TRANSLATION
 Sweden_foci.6004.t: "Slavnostní uvedení nových švédských ponorek do služby" # todo: NEW TRANSLATION
 Sweden_foci.6004.d1: "V rámci slavnostní ceremoniálu v Stockholmu byly naše nově získané ponorky typu Type 212 oficiálně uvedeny do švédského námořnictva. Akce se zúčastnili zástupci Německa, čímž zdůraznili posílení vazeb a položili základ pro budoucí spolupráci." # todo: NEW TRANSLATION
 Sweden_foci.6004.d2: "Ve Stockholmu se konala formální ceremoniál, při němž byly naše nové ponorky třídy Lada oficiálně uvedeny do švédského námořnictva. Přítomnost ruských dignitářů podtrhla rostoucí obrannou spolupráci mezi našimi zeměmi a potenciálně prospěla budoucím vztahům." # todo: NEW TRANSLATION
 Sweden_foci.6004.d3: "Ve Stockholmu se konala formální ceremoniál, při němž byly naše nové ponorky třídy Seawolf oficiálně uvedeny do švédského námořnictva. Akce byla za přítomnosti vysokých úředníků ze Spojených států a zdůraznila prohlubující se obranné partnerství a jeho pozitivní dopad na naše budoucí vztahy." # todo: NEW TRANSLATION
 Sweden_foci.6004.d4: "V hrdém okamžiku pro naši zemi byly švédsky vyvinuté ponorky oficiálně zařazeny do námořnictva během ceremoniálu ve Stockholmu. Tento úspěch nejen posiluje naše námořní schopnosti, ale také ukazuje náš závazek k soběstačnosti a inovacím v obranné technologii." # todo: NEW TRANSLATION
 Sweden_foci.6004.o1: "Oslavme tento milník v námořním pokroku" # todo: NEW TRANSLATION
 Sweden_foci.7.t: "Rozšiřování švédské flotily korvet" # todo: NEW TRANSLATION
 Sweden_foci.7.d: "Pro posílení našich námořních schopností a zajištění obrany pobřežních vod zvažuje Švédsko nákup dalších korvet. Máme několik možností: pořízení moderních korvet od zahraničních spojenců nebo vývoj vlastního domestického designu." # todo: NEW TRANSLATION
 Sweden_foci.7.o1: "Pořídit korvety MEKO A-100 z Německa" # todo: NEW TRANSLATION
 Sweden_foci.7.o2: "Pořídit Tarantul-Class korvet z Ruska" # todo: NEW TRANSLATION
 Sweden_foci.7.o3: "Pořiďte Hamina-třídní korvety z Finska" # todo: NEW TRANSLATION
 Sweden_foci.7.o4: "Zahájit vlastní projekty"
 Sweden_foci.70.t: "Naše cíle vojenské spolupráce byly úspěšně dosaženy." # todo: NEW TRANSLATION
 Sweden_foci.70.d: "Naše úsilí se vyplatilo a učinili jsme další velký krok na cestě k světovému míru." # todo: NEW TRANSLATION
 Sweden_foci.70.b: "Dnes je náš šťastný den." # todo: NEW TRANSLATION
 Sweden_foci.71.t: "Naše záměry vojenské spolupráce byly zmařeny." # todo: NEW TRANSLATION
 Sweden_foci.71.d: "Ač jsme vložili hodně úsilí, naše snahy stále čelí překážkám, ale jsme přesvědčeni, že můžeme pokračovat v postupu." # todo: NEW TRANSLATION
 Sweden_foci.71.b: "Nebojte se, jednou budeme mít příležitost." # todo: NEW TRANSLATION
 Sweden_foci.7001.t: "Švédsko žádá o pořízení korvet." # todo: NEW TRANSLATION
 Sweden_foci.7001.d1: "Vláda Švédska oficiálně požádala o pořízení korvet MEKO A-100 z Německa. Schválení této žádosti by mohlo posílit bilaterální obranné vztahy a přispět k regionální bezpečnosti." # todo: NEW TRANSLATION
 Sweden_foci.7001.d2: "Vláda Švédska oficiálně požádala o pořízení korvet Tarantul-tříd z Ruska. Schválení této žádosti by mohlo otevřít dveře ke spolupráci v oblasti vojenské a ovlivnit budoucí vztahy." # todo: NEW TRANSLATION
 Sweden_foci.7001.d3: "Vláda Švédska oficiálně požádala o pořízení Hamina-třídních korvet z Finska. Schválení této žádosti by mohlo posílit obranné vazby a podpořit interoperabilitu mezi našimi námořnictvy." # todo: NEW TRANSLATION
 Sweden_foci.7001.o1: "Odmítnout žádost Švédska." # todo: NEW TRANSLATION
