 low_progress: "Malý postup"
 medium_progress: "Střední postup"
 high_progress: "Značný postup"
 manifest_fulfilled: "Manifest splněn"
 GLOBAL_RESOURCE_EXTRACTED_TOTAL_DESC: "Celkové množství globálně vytěžených zdrojů"
 FACTION_RESOURCE_EXTRACTED_TOTAL_DESC: "Celkové množství zdrojů vytěžených členy frakce"
 defense_of_democracy_goal_name: "Obrana demokracie"
 defense_of_democracy_goal_desc: "Demokracie je ohrožena. Musíme spolupracovat, abychom zajistili, že demokratické země světa nepadnou jedna po druhé."
 containment_of_communism_goal_name: "Zadržení světového vznikajícího bloku"
 containment_of_communism_goal_desc: "Svět nemůže být bezpečný, dokud nebude vznikající hrozba potlačena."
 suppress_regional_fascism_goal_name: "Potlačení fašismu"
 suppress_regional_fascism_goal_desc: "Fašismus hrozí šířit se jako požár. Čím více zemí mu podlehne, tím nebezpečnější bude situace kolem nás."
 suppress_regional_communism_goal_name: "Potlačení komunismu v [ROOT.GetCountryContinent]"
 suppress_regional_communism_goal_desc: "Musíme udělat vše, co je v našich silách, abychom udrželi co největší část [ROOT.GetCountryContinent] svobodnou od komunistického jha."
 regional_expansionism_goal_name: "Expanze v [ROOT.GetCountryContinent]"
 regional_expansionism_goal_desc: "Naše frakce by měla převzít vedení a dominovat v [ROOT.GetCountryContinent]."
 suppress_regional_democracy_goal_name: "Potlačení demokracie"
 suppress_regional_democracy_goal_desc: "Takzvané demokratické země jsou největší hrozbou pro naše ideály. Musíme zajistit, aby kontrolovaly jen menšinu [ROOT.GetCountryContinent]."
 between_the_seas_goal_name: "Mezi moři"
 between_the_seas_goal_desc: "Vytvořením pevné zdi spojeneckých území od Černého moře po Balt můžeme odolat jakékoli potenciální hrozbě."
 little_entente_goal_name: "Prosazení pařížských mírových smluv"
 little_entente_goal_desc: "Pařížské mírové smlouvy stanovily hranice pro [GER.GetName], [HUN.GetName], [BUL.GetName] a [AUS.GetName]. Naším hlavním cílem je zajistit, aby tyto země nezačaly anektovat pohraniční území a znovu nenarušily mír v Evropě."
 china_territorial_integrity_goal_name: "Územní celistvost"
 china_territorial_integrity_goal_desc: "Čína musí být osvobozena a sjednocena pod jednou vládnoucí stranou. Pouze znovuzískáním kontroly nad našimi územími od vnějších i vnitřních nepřátel můžeme navrátit Číně její slávu."
 china_chinese_consolidation_goal_name: "Čínská konsolidace"
 china_wang_front_expansion_name: "Vítězství nad imperialismem"
 china_wang_front_expansion_desc: "Je čas čelit vlivu koloniálních mocností ve východní Asii. Musíme vybudovat vlastní mocenský blok v regionu, aby nás už nikdy nikdo neovládal."
 china_asian_democratic_union_name: "$china_wang_front_expansion_name$"
 china_asian_democratic_union_desc: "$china_wang_front_expansion_desc$"
 strength_in_unity_goal_name: "Síla v jednotě"
 strength_in_unity_goal_desc: "Země v našem koutě světa by měly stát při sobě. Vybudováním silné frakce máme nejlepší šanci zůstat nezávislí a neutrální."
 conquest_of_territory_goal_name: "Dobývání a dominance"
 conquest_of_territory_goal_desc: "V nepřátelském světě je expanze klíčová pro přežití. Expanze vytváří nárazníková pásma a dává nám přístup k dalším zdrojům."
 spread_of_communism_goal_name: "Světová revoluce"
 spread_of_communism_goal_desc: "Nastal čas, aby povstaly masy. A tam, kde masy povstat nemohou, jim musíme pomoci silou zbraní."
 control_of_the_balkans_goal_name: "Bezpečnost Balkánu"
 control_of_the_balkans_goal_desc: "Vnější mocnosti se vždy snažily šířit svůj vliv na Balkán. Musíme zajistit, že budeme stát pevně spolu a odrazíme jakékoli cizí zásahy do regionu."
 african_decolonization_goal_name: "Africká dekolonizace"
 african_decolonization_goal_desc: "Nastal čas, aby se Afrika postavila svým utlačovatelům. Musíme osvobodit kontinent, v případě potřeby i silou!"
 habsburg_hegemony_goal_name: "Habsburská hegemonie"
 habsburg_hegemony_goal_desc: "Rodina je nejdůležitější součástí každé unie a naše aliance není výjimkou. Musíme zajistit evropské koruny a šířit náš vliv."
 indifference_is_a_threat_goal_name: "Lhostejnost je hrozbou"
 indifference_is_a_threat_goal_desc: "S velkým konfliktem v Evropě téměř nevyhnutelným musíme zajistit, aby nedošlo k žádným překvapením. Každá země, která odmítne zaujmout stranu, musí být odstraněna."
 security_through_expansion_goal_name: "Bezpečnost skrze expanzi"
 security_through_expansion_goal_desc: "Musíme vytvořit štít kolem našeho území a zajistit prstenec států kolem našich současných hranic."
 an_iron_curtain_goal_name: "Železná opona"
 an_iron_curtain_goal_name_desc: "Abychom lépe ochránili vlast, musíme vytvořit oponu loutkových států kolem nás, která udrží nežádoucí návštěvníky venku."
 eastern_european_security_goal_name: "Východoevropská bezpečnost"
 eastern_european_security_goal_desc: "Abychom lépe chránili naše zájmy ve východní Evropě, musíme zasáhnout a nastolit spřízněné režimy na západ od nás."
 mare_nostrum_goal_name: "Mare Nostrum"
 mare_nostrum_goal_desc: "Vždy bylo snem našeho lidu proměnit Středozemní moře v naše vnitřní moře. Nastal čas tento sen uskutečnit!"
 pax_romana_goal_name: "Pax Romana"
 pax_romana_goal_desc: "Vždy bylo snem našeho lidu obnovit slávu Římské říše. Nastal čas tento sen uskutečnit!"
 building_up_guam_goal_name: "Rozšířit námořní základnu Guam"
 building_up_guam_goal_desc: "Musíme zajistit spojení s [PHI.GetNameDef] pro případ konfliktu s [JAP.GetName]. Zároveň by bylo velmi výhodné mít bližší shromaždiště pro naše námořnictvo. [638.GetName] je ideální volbou."
 the_two_seas_goal_name: "Zajistit přítomnost v Baltu a Černém moři"
 the_two_seas_goal_desc: "Musíme zajistit silnou námořní přítomnost jak v Baltském, tak v Černém moři."
 one_germany_goal_name: "Sjednotit německé státy"
 one_germany_goal_desc: "Abychom vybudovali silnou a sjednocenou mocenskou základnu, musíme nejprve zajistit silné a sjednocené Německo. Pařížské mírové smlouvy zakazovaly německé znovusjednocení. Je čas dokázat, že nejsme vázáni zbytečnými smlouvami."
 guardians_of_peace_goal_name: "Udržet světový mír"
 guardians_of_peace_goal_desc: "Na obzoru se stahují mračna. Musíme zabránit tomu, aby válka vypukla příliš brzy, aby měla naše aliance čas se připravit."
 growing_the_faction: "Rozšířit frakci"
 growing_the_faction_desc: "Naše frakce musí mít více členů, má-li být brána vážně na geopolitické scéně."
 a_large_faction_goal_name: "Pozvat více zemí do naší frakce"
 a_large_faction_goal_desc: "Dalším rozšiřováním bude naše frakce schopna promítat svůj vliv ještě dál."
 preemptive_strike_on_fascism_goal_name: "Zahájit preventivní úder proti fašistické zemi"
 preemptive_strike_on_fascism_goal_desc: "Neměli bychom čekat, až zaútočí oni. Musíme si zajistit iniciativu."
 a_great_fortress_goal_name: "Vybudovat silnější opevnění"
 a_great_fortress_goal_desc: "Připravenost je klíčová. Zajištěním pohraničních oblastí a klíčových bodů moderním opevněním zajistíme, že nás nepřítel nemůže porazit."
 aggressive_defense_goal_name: "Způsobit agresorům ztráty"
 aggressive_defense_goal_desc: "Nevzdáme nepříteli ani píď. Naši vojáci musí chápat, že cílem není zemřít za vlast, ale přimět nepřítele zemřít za tu svou."
 war_on_communism_goal_name: "Vyhlásit válku vznikajícímu bloku"
 war_on_communism_goal_desc: "Musíme zastavit šíření vznikajícího bloku jakýmikoli prostředky."
 war_on_democracy_goal_name: "Vyhlásit válku demokracii"
 war_on_democracy_goal_desc: "Musíme udeřit proti našim ideologickým nepřátelům."
 defeat_of_communism_goal_name: "Porazit vznikající blok"
 defeat_of_communism_goal_desc: "Abychom porazili světový vznikající blok, musíme začít doma a vymýtit jej v našem regionu."
 defeat_of_fascism_goal_name: "Porazit fašismus"
 defeat_of_fascism_goal_desc: "Chceme-li jednou provždy zastavit šíření fašismu, musíme začít doma."
 defeat_of_anti_communists_goal_name: "Porazit kontrarevolucionáře" # todo: NEW TRANSLATION
 defeat_of_anti_communists_goal_desc: "Prvním krokem ke světové revoluci je úspěšné převedení regionálních mocností, které jí odporují, na naši stranu. Proto musíme především odstranit všechny hrozby na vlastním kontinentu." # todo: NEW TRANSLATION
 defeat_of_anti_fascists_goal_name: "Šířit fašismus na kontinentu" # todo: NEW TRANSLATION
 defeat_of_anti_fascists_goal_desc: "Musíme usilovat o zničení protifašistických vlád na našem kontinentu." # todo: NEW TRANSLATION
 defeating_our_enemies_goal_name: "Vyhrát válku"
 defeating_our_enemies_goal_desc: "Časy jsou nejisté a válka nevyhnutelná. Musíme zajistit, že skončíme na vítězné straně."
 is_victor_in_pc_tt: "Je na vítězné straně mírové konference" # todo: NEW TRANSLATION
 a_military_base_goal_name: "Rozšířit vojenský průmysl"
 a_military_base_goal_desc: "Křížová výprava proti vznikajícímu bloku vyžaduje zbraně. K jejich výrobě ve velkém potřebujeme silný vojenský průmysl."
 a_military_base_tech_bonus: "Bonus cíle $a_military_base_goal_name$" # todo: NEW TRANSLATION
 resource_control_goal_name: "Zajistit strategické zdroje" # todo: NEW TRANSLATION
 resource_control_goal_desc: "Frakce musí zajistit, že má zdroje potřebné k vypořádání se s jakoukoli hrozbou ve světě" # todo: NEW TRANSLATION
 secure_european_continent_goal_name: "Vybudovat pevnost Europa" # todo: NEW TRANSLATION
 secure_european_continent_goal_desc: "Musíme zajistit, aby byl evropský kontinent sjednocen s naší věcí. [faction.GetName] by měla v Evropě vládnout bez konkurence." # todo: NEW TRANSLATION
 secure_north_africa_goal_name: "Zajistit severní Afriku" # todo: NEW TRANSLATION
 secure_north_africa_goal_desc: "Měli bychom usilovat nejen o ovládnutí Evropy, ale také o zajištění více než pouhého předmostí v severní Africe." # todo: NEW TRANSLATION
 an_armored_fist_goal_name: "Rozšířit naše obrněné síly" # todo: NEW TRANSLATION
 an_armored_fist_goal_desc: "Nová doba přináší příležitosti pro nové způsoby válčení. Tanky jsou budoucností. Musíme zajistit, abychom jich jako frakce měli dostatek k ovládnutí bojiště." # todo: NEW TRANSLATION
 an_infantry_army_goal_name: "Rozšířit naše pěší síly" # todo: NEW TRANSLATION
 an_infantry_army_goal_desc: "Páteří každé armády je pěchota. Potřebujeme početnou pěší armádu, která podpoří naše nároky na diplomatickém poli i v terénu." # todo: NEW TRANSLATION
 high_seas_fleet_goal_name: "Rozšířit flotilu hlavních lodí"
 high_seas_fleet_goal_desc: "Zajištění, aby naši nepřátelé nekontrolovali Severní Atlantik, je pro naše operace zásadní."
 high_seas_fleet_tech_bonus: "Bonus cíle $high_seas_fleet_goal_name$" # todo: NEW TRANSLATION
 control_the_chinese_coast_goal_name: "Udržet kontrolu nad pobřežím" # todo: NEW TRANSLATION
 control_the_chinese_coast_goal_desc: "V případě napadení bychom měli usilovat o co nejdelší zachování přístupu k moři. Naše přežití závisí na schopnosti přijímat zboží ze zemí za mořem." # todo: NEW TRANSLATION
 guerilla_expansion_goal_name: "Organizovat odboj" # todo: NEW TRANSLATION
 guerilla_expansion_goal_desc: "Možná nemůžeme vetřelcům čelit za jejich podmínek, proto jim budeme čelit za našich podmínek." # todo: NEW TRANSLATION
 industrial_expansion_goal_name: "Průmyslová expanze" # todo: NEW TRANSLATION
 industrial_expansion_goal_desc: "Nejlepší způsob, jak vytvořit silnou frakci, je mít silnou průmyslovou základnu. Musíme zajistit průmyslovou sílu potřebnou k tomu, abychom se stali významnou mocností." # todo: NEW TRANSLATION
 industrial_domination_goal_name: "Rozšířit civilní průmysl" # todo: NEW TRANSLATION
 industrial_domination_goal_desc: "Moderní válka je především o výrobních kapacitách. Zajistěme, abychom měli největší průmyslové schopnosti, jaké kdy svět spatřil." # todo: NEW TRANSLATION
 industrial_expansion_tech_bonus: "Bonus cíle $industrial_expansion_goal_name$" # todo: NEW TRANSLATION
 industrial_research_goal_name: "Vyzkoumat $construction4$" # todo: NEW TRANSLATION
 industrial_research_goal_desc: "Abychom se stali dominantním hráčem, musíme zajistit průmyslové know-how napříč celou frakcí." # todo: NEW TRANSLATION
 secure_chinese_waters_goal_name: "Zajistit čínské vody" # todo: NEW TRANSLATION
 secure_chinese_waters_goal_desc: "Na pevnině můžeme dominovat, ale vzhledem k dlouhému pobřeží musí být nejvyšší prioritou zabránit komukoli v invazi. Toto bezpečí začíná daleko na moři." # todo: NEW TRANSLATION
 faction_goal_subjugate_the_faction_name: "Podrobit si frakci" # todo: NEW TRANSLATION
 faction_goal_subjugate_the_faction_desc: "Jediný způsob, jak odolat náporu cizích vetřelců, je představit jednotnou frontu se silným vedením. Z mnoha různých hlasů zazní velký chorál." # todo: NEW TRANSLATION
 faction_goal_north_subjugated_name: "Podrobit si sever" # todo: NEW TRANSLATION
 faction_goal_north_subjugated_desc: "Pokud bychom se soustředěně pokusili integrovat tuto část naší frakce, zbytek vojevůdců by pochopil, odkud vane vítr, a zařadil by se." # todo: NEW TRANSLATION
 faction_goal_west_subjugated_name: "Podrobit si západ" # todo: NEW TRANSLATION
 faction_goal_west_subjugated_desc: "Pokud bychom se soustředěně pokusili integrovat tuto část naší frakce, zbytek vojevůdců by pochopil, odkud vane vítr, a zařadil by se." # todo: NEW TRANSLATION
 faction_goal_south_subjugated_name: "Podrobit si jih" # todo: NEW TRANSLATION
 faction_goal_south_subjugated_desc: "Pokud bychom se soustředěně pokusili integrovat tuto část naší frakce, zbytek vojevůdců by pochopil, odkud vane vítr, a zařadil by se." # todo: NEW TRANSLATION
 faction_goal_no_japanese_in_china_name: "Vyhnat vetřelce" # todo: NEW TRANSLATION
 faction_goal_no_japanese_in_china_desc: "Japonci příliš dlouho utlačovali náš lid. Už jim nelze dovolit zůstat v Číně." # todo: NEW TRANSLATION
 faction_goal_the_northern_mandate_name: "Ovládnout východní Sibiř" # todo: NEW TRANSLATION
 faction_goal_the_northern_mandate_desc: "Aby náš lid mohl prosperovat, potřebujeme území a zdroje, které lze nalézt na Sibiři. Současná správa je nedokáže řádně využívat, takže na ně máme právo." # todo: NEW TRANSLATION
 faction_goal_the_southern_mandate_name: "Ovládnout jihovýchodní Asii" # todo: NEW TRANSLATION
 faction_goal_the_southern_mandate_desc: "V slavné minulosti jsme uplatňovali vliv v oblastech na jihu a nyní tak učiníme znovu. S bohatstvím, které se v této oblasti nachází, bychom mohli dokázat cokoli." # todo: NEW TRANSLATION
 faction_goal_the_greater_game_name: "Ovládnout Střední Asii" # todo: NEW TRANSLATION
 faction_goal_the_greater_game_desc: "Říše se snažily prosadit svou vůli ve Střední Asii a byly odraženy. Přišel náš čas postupovat znovu na západ a přes stepi." # todo: NEW TRANSLATION
 suppress_asian_communism_goal_name: "Potlačit asijský komunismus" # todo: NEW TRANSLATION
 suppress_asian_communism_goal_desc: "Vznikající komunismus ohrožuje tradiční způsob života i přirozený řád věcí. Musíme se sjednotit a porazit jej, kdekoli ukáže svou ošklivou tvář." # todo: NEW TRANSLATION
 strategic_resource_control_goal_name: "Kontrola strategických zdrojů" # todo: NEW TRANSLATION
 strategic_resource_control_goal_desc: "Kdo ovládá strategické zdroje světa, ovládá světovou politiku." # todo: NEW TRANSLATION
 align_china_goal_name: "Sjednotit Čínu" # todo: NEW TRANSLATION
 align_china_goal_desc: "Čínské frakce a hrozba, kterou představují, musí být přivedeny pod kontrolu. Nejlepším řešením tohoto problému je nahradit je přátelsky smýšlejícím režimem." # todo: NEW TRANSLATION
 control_the_chinese_capitals_goal_name: "Ovládnout čínská hlavní města" # todo: NEW TRANSLATION
 control_the_chinese_capitals_goal_desc: "Pokud získáme kontrolu nad historickými hlavními městy Číny, odpor vůči našim plánům jistě zeslábne." # todo: NEW TRANSLATION
 war_on_communism_in_asia_goal_name: "Vyhlásit válku komunismu v Asii" # todo: NEW TRANSLATION
 war_on_communism_in_asia_goal_desc: "Existuje jen jediný způsob, jak skutečně porazit komunismus: silou zbraní. Chceme-li být někdy v bezpečí před jeho vlivem, musíme jej vymýtit v celé Asii." # todo: NEW TRANSLATION
 coastal_security_goal_name: "Ovládnout pobřeží" # todo: NEW TRANSLATION
 coastal_security_goal_desc: "Měli bychom zajistit úplnou kontrolu nad celým pobřežím východní a jihovýchodní Asie. Tak můžeme zajistit, aby si západní imperialističtí kolonizátoři v našem regionu neudrželi opěrný bod." # todo: NEW TRANSLATION
 secure_the_oil_supply_goal_name: "Zajistit dodávky ropy" # todo: NEW TRANSLATION
 secure_the_oil_supply_goal_desc: "Chceme-li vést dlouhou válku, musíme za každou cenu zajistit dostatek ropy k jejímu udržení." # todo: NEW TRANSLATION
 secure_the_oil_supply_tech_bonus: "Bonus cíle Zajistit dodávky ropy" # todo: NEW TRANSLATION
 protector_of_peace_goal_name: "Ochránce míru" # todo: NEW TRANSLATION
 protector_of_peace_goal_desc: "Naším cílem není zapojovat se do válek v Evropě ani jinde. Namísto toho bychom měli usilovat o zachování míru a povzbuzovat ostatní země, aby své spory urovnávaly pokojně a rychle." # todo: NEW TRANSLATION
 african_domination_goal_name: "Africká nadvláda" # todo: NEW TRANSLATION
 african_domination_goal_desc: "Naším konečným cílem musí vždy být zajištění toho, aby v Africe nepůsobil žádný cizí vliv. Ti, kteří nejsou s námi, jsou proti nám a musí být přinuceni ke spolupráci." # todo: NEW TRANSLATION
 contain_japanese_expansion_asia_goal_name: "Zadržet japonskou expanzi" # todo: NEW TRANSLATION
 contain_japanese_expansion_asia_goal_desc: "Musíme udělat vše, co je v našich silách, abychom zadrželi územní expanzi země [JAP.GetName]" # todo: NEW TRANSLATION
 pan_americanism_goal_name: "Panamerikanismus" # todo: NEW TRANSLATION
 pan_americanism_goal_desc: "Celá Amerika by měla být sjednocena. Když získáme všechny na svou stranu, můžeme zabezpečit svou část světa a vytvořit jednotnou frontu proti jakýmkoli vnějším silám." # todo: NEW TRANSLATION
 amerindian_liberation_goal_name: "Osvobození původních Američanů" # todo: NEW TRANSLATION
 amerindian_liberation_goal_desc: "Původní obyvatelé Ameriky musí být osvobozeni od cizích utlačovatelů, kteří nad nimi v současnosti vládnou." # todo: NEW TRANSLATION
 islamic_brotherhood_goal_name: "Islámské bratrství" # todo: NEW TRANSLATION
 islamic_brotherhood_goal_desc: "Islámské národy světa se musí sjednotit, aby se postavily těm, kteří by nás raději viděli dobytými a podrobenými." # todo: NEW TRANSLATION
 baltic_security_goal_name: "Chránit Pobaltí" # todo: NEW TRANSLATION
 baltic_security_goal_desc: "Abychom zajistili budoucnost našich občanů a civilistů, musíme oblast Baltu chránit vším, co máme. Jen pokud ji udržíme pod svou kontrolou, budou moci její obyvatelé prosperovat." # todo: NEW TRANSLATION
 nordic_defence_goal_name: "Bránit severské země" # todo: NEW TRANSLATION
 nordic_defence_goal_desc: "Abychom zajistili budoucnost našich občanů a civilistů, musíme severský region chránit vším, co máme. Jen pokud udržíme dotírající říše vně, budeme moci vzkvétat." # todo: NEW TRANSLATION
 european_dominance_goal_name: "Ustanovit evropskou nadvládu" # todo: NEW TRANSLATION
 european_dominance_goal_desc: "Dokážeme-li sjednotit většinu Evropy pod jednou vlajkou, můžeme vytvořit alianci dostatečně silnou i k čelení těm nejvážnějším hrozbám." # todo: NEW TRANSLATION
 asian_dominance_goal_name: "Ustanovit asijskou nadvládu" # todo: NEW TRANSLATION
 asian_dominance_goal_desc: "S většinou Asie pod naší kontrolou bude naše frakce silou, s níž se bude muset počítat." # todo: NEW TRANSLATION
 middle_east_dominance_goal_name: "Ovládnout Blízký východ" # todo: NEW TRANSLATION
 middle_east_dominance_goal_desc: "Od Arabského poloostrova a Levanty až po afghánské hory se musíme sjednotit a nastolit úplnou kontrolu. Tento region by mohl být významným hráčem, pokud zajistíme, že všichni budou spolupracovat." # todo: NEW TRANSLATION
 the_arteries_of_trade_goal_name: "Chránit tepny obchodu" # todo: NEW TRANSLATION
 the_arteries_of_trade_goal_desc: "Hlavní námořní trasy musí být pod naší kontrolou, abychom zajistili přežití našich členských zemí." # todo: NEW TRANSLATION
 the_atomic_race_goal_name: "Sestrojit první atomovou bombu" # todo: NEW TRANSLATION
 the_atomic_race_goal_desc: "Musíme zajistit, aby naši současní ani budoucí nepřátelé nezískali přístup k jaderným zbraním dříve než my. Jen když budeme první, můžeme si být jisti, že proti nám žádná jiná mocnost nebude moci povstat." # todo: NEW TRANSLATION
 the_atomic_race_complete_trigger: "Člen [ROOT.GetFactionName] je první zemí, která dokončí $sp_nuclear_bomb$" # todo: NEW TRANSLATION
 the_atomic_race_complete_trigger_fail: "Země, která není členem [ROOT.GetFactionName], je první zemí, která dokončí $sp_nuclear_bomb$" # todo: NEW TRANSLATION
 rule_the_waves_goal_name: "Vládnout vlnám" # todo: NEW TRANSLATION
 rule_the_waves_goal_desc: "Skutečná nadvláda nad oceánem vyžaduje velké loďstvo a jeho klíčovou součástí jsou hlavní lodě." # todo: NEW TRANSLATION
 eliminate_the_twin_threats_goal_name: "Odstranit dvojí hrozbu" # todo: NEW TRANSLATION
 eliminate_the_twin_threats_goal_desc: "Dokud nebudou [SOV.GetNameDef] a [GER.GetNameDef] přivedeny k poslušnosti, nikdy nebudeme v bezpečí." # todo: NEW TRANSLATION
 disarm_aggression_central_powers_goal_name: "Otupit útočné země" # todo: NEW TRANSLATION
 disarm_aggression_central_powers_goal_desc: "Demokracie jen zřídka napadají jiné země. Abychom zajistili Evropu pro budoucí generace, musíme zajistit, aby se tyto agresivní země buď změnily v demokracie, nebo byly zcela odstraněny." # todo: NEW TRANSLATION
 rule_the_waves_tech_bonus: "Bonus cíle Vládnout vlnám" # todo: NEW TRANSLATION
 imperial_glory_goal_name: "Bránit životně důležité imperiální državy" # todo: NEW TRANSLATION
 imperial_glory_goal_desc: "Klíčové opěrné body naší říše i našich spojenců musí vydržet. Udržením kontroly nad državami po celém světě v dobách války můžeme světu ukázat, že jsme stále silou, s níž je třeba počítat." # todo: NEW TRANSLATION
 production_quotas_goal_name: "Dosáhnout výrobních kvót" # todo: NEW TRANSLATION
 production_quotas_goal_desc: "Musíme mít obrovský arzenál zbraní, abychom zajistili celistvost [ROOT.GetFactionName] a byli připraveni čelit jakýmkoli hrozbám, které nám přijdou do cesty." # todo: NEW TRANSLATION
 stall_the_fascist_threat_goal_name: "Zpomalit fašistickou hrozbu" # todo: NEW TRANSLATION
 stall_the_fascist_threat_goal_desc: "Musíme zpomalit šíření fašismu ve světě. Španělsko nejspíše padne, ale musíme udělat svůj díl práce a oddálit to, dokud nebudeme připraveni bránit se rostoucí hrozbě fašismu. Vázáním nepřátelských vojsk v konfliktu ve Španělsku jim ztížíme soustředění jinde, čímž získáme cenný čas." # todo: NEW TRANSLATION
 the_red_tide_goal_name: "Rozšířit rudé armády" # todo: NEW TRANSLATION
 the_red_tide_goal_desc: "Nejdůležitější jsou vojáci v poli. Potřebná je armáda o síle deseti milionů mužů. Tak se skutečně zajišťuje přežití." # todo: NEW TRANSLATION
 military_infrastructure_goal_name: "Vybudovat vojenskou infrastrukturu" # todo: NEW TRANSLATION
 military_infrastructure_goal_desc: "Dobře rozvinutá infrastruktura je zásadní pro zajištění zásobovacích linií, které naše síly bránící hranice potřebují. Každý základní stát kontrolovaný frakcí, který sousedí se zemí mimo frakci, musí být rozvinut na úroveň §YInfrastruktury§! 4. Neprůchodné státy jsou vyňaty." # todo: CHANGED
 ensure_military_r_d_goal_name: "Vybudovat vojenská výzkumná a vývojová zařízení" # todo: NEW TRANSLATION
 ensure_military_r_d_goal_desc: "Musíme zajistit, aby naše vojenské technologie dosahovaly požadované úrovně, a to vybudováním zařízení věnovaných výzkumu a vývoji pokročilých prototypů a nových koncepcí." # todo: NEW TRANSLATION
 spy_master_goal_name: "Jmenovat Šéfa špionáže"
 spy_master_goal_desc: "Měli bychom specializovat jednoho z našich členů na špionáž a zpravodajství, aby řídil operace naší aliance."
 develop_mexican_oil_goal_name: "Rozvinout mexickou ropu"
 develop_mexican_oil_goal_desc: "Rozšíření těžby mexických ropných zásob by zajistilo dostatečné dodávky paliva pro průmyslové i vojenské potřeby."
 develop_curacao_oil_goal_name: "Rozvinout ropu na Curaçau"
 develop_curacao_oil_goal_desc: "Rafinérie na Curaçau jsou zásadní pro zpracování venezuelské ropy. Rozšíření jejich těžby by zachovalo přístup aliance k rafinovaným ropným produktům." # todo: CHANGED
 develop_venezuelan_oil_goal_name: "Rozvinout venezuelskou ropu"
 develop_venezuelan_oil_goal_desc: "Těžbu ropy ve Venezuele lze dále rozšířit a zajistit tak naší alianci přístup k energii potřebné k podpoře jejích vojenských aktivit." # todo: CHANGED
 develop_guyanan_bauxite_goal_name: "Rozvinout guyanský bauxit"
 develop_guyanan_bauxite_goal_desc: "Rozšíření těžby bauxitu v Guyaně by poskytlo suroviny nezbytné pro velkovýrobu letadel." # todo: CHANGED
 develop_suriname_bauxite_goal_name: "Rozvinout surinamský bauxit"
 develop_suriname_bauxite_goal_desc: "Rozšíření těžby bohatých ložisek bauxitu v Surinamu by poskytlo suroviny potřebné pro rozvíjející se letecký průmysl naší aliance." # todo: CHANGED
 develop_lappland_metals_goal_name: "Rozvinout laponské kovy"
 develop_lappland_metals_goal_desc: "Rozšíření těžby nerostného bohatství Laponska by posílilo zásoby železa a wolframu v alianci a udrželo náš zbrojní průmysl." # todo: CHANGED
 develop_ploiesti_oil_fields_goal_name: "Rozvinout ropná pole Ploiești"
 develop_ploiesti_oil_fields_goal_desc: "Jako jediná ropná pole v Evropě musí být Ploiești řádně využita, aby aliance měla dostatek paliva pro pokračující vojenské operace."
 develop_baku_oil_fields_goal_name: "Rozvinout ropná pole v Baku"
 develop_baku_oil_fields_goal_desc: "Rozvoj ropného regionu Baku by poskytl rozsáhlé zásoby rafinovaných ropných produktů nezbytných pro vojenské operace."
 develop_iraqi_oil_goal_name: "Rozvinout iráckou ropu"
 develop_iraqi_oil_goal_desc: "Rozšíření těžební kapacity Iráku by mohlo být zásadní pro pokrytí palivových potřeb naší armády." # todo: CHANGED
 develop_persian_oil_goal_name: "Rozvinout perskou ropu"
 develop_persian_oil_goal_desc: "Rozšíření ropných polí a rafinační kapacity Persie by zajistilo nepřetržitý tok paliva pro operační potřeby." # todo: CHANGED
 develop_chinese_metals_goal_name: "Rozvinout čínské kovy"
 develop_chinese_metals_goal_desc: "Bohatství Číny v různých kritických kovech by mohlo být těženo ve větší míře a poskytnout vojensko-průmyslové základně aliance potřebné zdroje." # todo: CHANGED
 develop_malayan_riches_goal_name: "Rozvinout malajské bohatství"
 develop_malayan_riches_goal_desc: "Rozvoj zdrojů wolframu a kaučuku v Malajsku by výrazně posílil materiální základnu aliance a zajistil klíčové vstupy pro výrobu a vojenskou logistiku." # todo: CHANGED
 develop_indonesian_riches_goal_name: "Rozvinout indonéské bohatství"
 expand_newfoundland_bases_goal_name: "Rozšířit základny na Newfoundlandu"
 expand_newfoundland_bases_goal_desc: "Rozšíření našich základen na Newfoundlandu by nám umožnilo lépe kontrolovat severoatlantické konvoje a promítat leteckou i námořní sílu."
 expand_bermuda_bases_goal_name: "Rozšířit základny na Bermudách"
 expand_bermuda_bases_goal_desc: "Rozšíření základen na Bermudách by umožnilo efektivnější hlídkování středního Atlantiku a bezpečnější zásobovací trasy."
 expand_bahamas_bases_goal_name: "Rozšířit základny na Bahamách"
 expand_bahamas_bases_goal_desc: "Rozšíření základen na Bahamách by umožnilo lepší dohled nad karibskými námořními trasami."
 fortify_panama_canal_goal_name: "Opevnit Panamský průplav"
 expand_trinidad_bases_goal_name: "Rozšířit základny na Trinidadu"
 expand_azores_bases_goal_name: "Rozšířit základny na Azorech"
 expand_iceland_bases_goal_name: "Rozšířit základny na Islandu"
 expand_iceland_bases_goal_desc: "Rozšíření základen na Islandu by umožnilo lépe zabezpečit Dánský průliv a ovlivňovat severoatlantický koridor."
 expand_faroese_bases_goal_name: "Rozšířit základny na Faerských ostrovech"
 expand_narvik_bases_goal_name: "Rozšířit základny v Narviku"
 expand_narvik_bases_goal_desc: "Rozšíření základen v Narviku by umožnilo udržet přístup k životně důležitým dodávkám železné rudy."
 fortify_danish_belts_goal_name: "Opevnit dánské úžiny"
 fortify_danish_belts_goal_desc: "Opevnění Kattegatu by nám umožnilo plně kontrolovat námořní přístup mezi Baltským a Severním mořem."
 fortify_danish_belts_tooltip: "Každá provincie v §YJutsku§!, §YFynu§! a §YSjaellandu§!, která ovládá průliv §YDánské úžiny§!, má §Ypobřežní pevnost§! úrovně 1 a je obsazena jednou divizí." # todo: NEW TRANSLATION
 fortify_gibraltar_goal_name: "Opevnit Gibraltar"
 fortify_gibraltar_goal_desc: "Opevnění strategické základny v Gibraltarském průlivu by nám umožnilo lépe kontrolovat pohyb mezi Středozemním mořem a Atlantikem."
 expand_maltese_bases_goal_name: "Rozšířit základny na Maltě"
 expand_maltese_bases_goal_desc: "Rozšíření základen na Maltě by umožnilo lépe narušovat nepřátelské zásobovací linie ve Středozemí."
 expand_cretan_bases_goal_name: "Rozšířit základny na Krétě"
