 control_ploiesti_oil_fields_goal_name: "Ovládnout ropná pole Ploješti" # todo: NEW TRANSLATION
 control_ploiesti_oil_fields_goal_desc: "Jako jediná ropná pole v Evropě mají ropná pole Ploješti neocenitelný význam pro zajištění paliva potřebného k pokračování vojenských operací aliance." # todo: NEW TRANSLATION
 control_baku_oil_fields_goal_name: "Ovládnout ropná pole Baku" # todo: NEW TRANSLATION
 control_baku_oil_fields_goal_desc: "Zajištění ropné oblasti Baku by poskytlo přístup k rozsáhlým zásobám ropy zásadním pro vojenské operace." # todo: NEW TRANSLATION
 control_iraqi_oil_goal_name: "Ovládnout iráckou ropu" # todo: NEW TRANSLATION
 control_iraqi_oil_goal_desc: "Těžební kapacita Iráku by mohla být zásadní pro pokrytí palivových potřeb naší armády." # todo: CHANGED
 control_persian_oil_goal_name: "Ovládnout perskou ropu" # todo: NEW TRANSLATION
 control_persian_oil_goal_desc: "Kontrola nad ropnými poli a rafinační kapacitou Persie by zajistila nepřetržitý tok paliva pro operační potřeby." # todo: CHANGED
 control_chinese_metals_goal_name: "Ovládnout čínské kovy" # todo: NEW TRANSLATION
 control_chinese_metals_goal_desc: "Bohatství Číny v různých kritických kovech by mohlo vojensko-průmyslové základně aliance poskytnout potřebné zdroje." # todo: CHANGED
 control_malayan_riches_goal_name: "Ovládnout malajské bohatství" # todo: NEW TRANSLATION
 control_malayan_riches_goal_desc: "Kontrola zdrojů wolframu a kaučuku v Malajsku by výrazně posílila materiální základnu aliance a zajistila klíčové vstupy pro výrobu a vojenskou logistiku." # todo: NEW TRANSLATION
 control_indonesian_riches_goal_name: "Ovládnout indonéské bohatství" # todo: NEW TRANSLATION
 control_indonesian_riches_goal_desc: "Rozmanité přírodní bohatství Indonésie, včetně ropy, kaučuku a nerostů, je neocenitelné pro podporu naší průmyslové základny a zajištění nezávislosti aliance na zdrojích." # todo: CHANGED
 control_newfoundland_bases_goal_name: "Ovládnout základny na Newfoundlandu" # todo: NEW TRANSLATION
 control_newfoundland_bases_goal_desc: "Zajištění základen na Newfoundlandu by nám umožnilo kontrolovat konvoje v severním Atlantiku a promítat leteckou i námořní sílu podél životně důležitých námořních tras." # todo: NEW TRANSLATION
 control_bermuda_goal_name: "Ovládnout Bermudy" # todo: NEW TRANSLATION
 control_bermuda_goal_desc: "Základny na Bermudách by nám umožnily účinněji hlídkovat ve středním Atlantiku a udržovat bezpečnější zásobovací trasy mezi kontinenty." # todo: NEW TRANSLATION
 control_bahamas_bases_goal_name: "Ovládnout základny na Bahamách" # todo: NEW TRANSLATION
 control_bahamas_bases_goal_desc: "Vlastnictví základen na Bahamách by umožnilo účinnější sledování karibských námořních tras a ochranu námořních přístupů k Severní a Jižní Americe." # todo: NEW TRANSLATION
 control_panama_canal_goal_name: "Ovládnout Panamský průplav" # todo: NEW TRANSLATION
 control_panama_canal_goal_desc: "Kontrola Panamského průplavu je zásadní pro rychlé přesuny loďstev mezi Atlantikem a Tichým oceánem a zajišťuje strategickou flexibilitu na obou oceánech." # todo: NEW TRANSLATION
 control_trinidad_goal_name: "Ovládnout Trinidad" # todo: NEW TRANSLATION
 control_trinidad_goal_desc: "Klíčová poloha Trinidadu je zásadní pro kontrolu dodávek karibské ropy a umožňuje mu sloužit jako strategický výchozí bod na severním pobřeží Jižní Ameriky." # todo: CHANGED
 control_azores_goal_name: "Ovládnout Azory" # todo: NEW TRANSLATION
 control_azores_goal_desc: "Strategická poloha Azor umožňuje prodloužit dosah ve středním Atlantiku, uzavírá mezeru v pokrytí ponorkami i protiponorkovými silami a zajišťuje nepřetržité letecké krytí konvojů." # todo: NEW TRANSLATION
 control_iceland_goal_name: "Ovládnout Island" # todo: NEW TRANSLATION
 control_iceland_goal_desc: "Kontrola základen na Islandu by umožnila zabezpečit Dánský průliv a uplatňovat vliv nad severoatlantickým koridorem." # todo: NEW TRANSLATION
 control_faroe_islands_goal_name: "Ovládnout Faerské ostrovy" # todo: NEW TRANSLATION
 control_faroe_islands_goal_desc: "Faerské ostrovy leží na strategickém místě, které umožňuje kontrolu severních námořních tras a podporu námořních operací směrem k Británii, Skandinávii a Arktidě." # todo: NEW TRANSLATION
 control_narvik_goal_name: "Ovládnout Narvik" # todo: NEW TRANSLATION
 control_narvik_goal_desc: "Zajištění Narviku by umožnilo zachovat přístup k životně důležitým dodávkám železné rudy a kontrolu nad arktickými zásobovacími trasami." # todo: NEW TRANSLATION
 control_danish_belts_goal_name: "Ovládnout Dánské úžiny" # todo: NEW TRANSLATION
 control_danish_belts_goal_desc: "Obsazení Kattegatu by nám umožnilo vykonávat výhradní kontrolu nad námořním přístupem mezi Baltským a Severním mořem." # todo: NEW TRANSLATION
 control_brittany_bases_goal_name: "Ovládnout základny v Bretani" # todo: NEW TRANSLATION
 control_brittany_bases_goal_desc: "Strategické základny podél pobřeží Bretaně by umožnily širší ponorkové a letecké operace v Atlantiku a zároveň zajistily přístup na evropskou pevninu." # todo: CHANGED
 control_gibraltar_goal_name: "Ovládnout Gibraltar" # todo: NEW TRANSLATION
 control_gibraltar_goal_desc: "Strategická základna v Gibraltarském průlivu by nám umožnila kontrolovat námořní dopravu mezi Středozemním mořem a Atlantikem." # todo: NEW TRANSLATION
 control_malta_goal_name: "Ovládnout Maltu" # todo: NEW TRANSLATION
 control_malta_goal_desc: "Držení Malty by umožnilo narušovat nepřátelské zásobovací trasy a promítat sílu v celém centrálním Středomoří." # todo: NEW TRANSLATION
 control_crete_goal_name: "Ovládnout Krétu" # todo: NEW TRANSLATION
 control_crete_goal_desc: "Kontrola nad ostrovem Kréta by umožnila nadvládu nad východním Středomořím a usnadnila operace v Egejském moři a severní Africe." # todo: NEW TRANSLATION
 control_cyprus_goal_name: "Ovládnout Kypr" # todo: NEW TRANSLATION
 control_cyprus_goal_desc: "Kontrola Kypru by umožnila podporu operací ve východním Středomoří a zabezpečila životně důležité letecké trasy na Blízký východ a zpět." # todo: NEW TRANSLATION
 control_bosporus_goal_name: "Ovládnout Bospor" # todo: NEW TRANSLATION
 control_bosporus_goal_desc: "Obsazení Bosporu by nám umožnilo kontrolovat veškerý námořní přístup mezi Černým a Středozemním mořem." # todo: NEW TRANSLATION
 control_dardanelles_goal_name: "Ovládnout Dardanely" # todo: NEW TRANSLATION
 control_dardanelles_goal_desc: "Držení Dardanel by umožnilo určovat pohyb loďstev a obchodu z Černého moře." # todo: NEW TRANSLATION
 control_suez_canal_goal_name: "Ovládnout Suezský průplav" # todo: NEW TRANSLATION
 control_suez_canal_goal_desc: "Vlastnictví životně důležitého Suezského průplavu by nám poskytlo výhradní kontrolu nad hlavní dopravní tepnou mezi Evropou a Asií a zajistilo rychlý přesun sil a zdrojů." # todo: NEW TRANSLATION
 control_gulf_of_aden_bases_goal_name: "Ovládnout základny v Adenském zálivu" # todo: NEW TRANSLATION
 control_gulf_of_aden_bases_goal_desc: "Strategické základny podél Adenského zálivu umožňují ochranu přístupů k Rudému moři a zabezpečují námořní trasy spojující Evropu, Afriku a Asii." # todo: NEW TRANSLATION
 control_strait_of_hormuz_goal_name: "Ovládnout Hormuzský průliv" # todo: NEW TRANSLATION
 control_strait_of_hormuz_goal_desc: "Strategické základny v Hormuzském průlivu by umožnily kontrolovat přístup k životně důležité perské a irácké ropě." # todo: NEW TRANSLATION
 control_ceylon_goal_name: "Ovládnout Cejlon" # todo: NEW TRANSLATION
 control_ceylon_goal_desc: "Zajištění Cejlonu by umožnilo ovládnout Indický oceán a chránit životně důležité námořní trasy mezi Blízkým východem a jihovýchodní Asií." # todo: NEW TRANSLATION
 control_singapore_goal_name: "Ovládnout Singapur" # todo: NEW TRANSLATION
 control_singapore_goal_desc: "Monumentální opevněná námořní základna v Singapuru ovládá Malacký průliv a řídí pohyb mezi Indickým a Tichým oceánem. Měla by patřit nám." # todo: NEW TRANSLATION
 control_manila_goal_name: "Ovládnout Manilu" # todo: NEW TRANSLATION
 control_manila_goal_desc: "Držení snadno bránitelného Manilského zálivu by umožnilo promítat sílu v západním Pacifiku a zajistit přístup do Východní Indie a Jihočínského moře." # todo: NEW TRANSLATION
 control_okinawa_goal_name: "Ovládnout Okinawu" # todo: NEW TRANSLATION
 control_okinawa_goal_desc: "Kontrola Okinawy by umožnila zahájit operace proti japonským domovským ostrovům a vytvořit silný obranný perimetr v Pacifiku." # todo: NEW TRANSLATION
 control_iwo_jima_goal_name: "Ovládnout Iwodžimu" # todo: NEW TRANSLATION
 control_iwo_jima_goal_desc: "Zajištění Iwodžimy by umožnilo podporu dálkových leteckých operací nad Japonskem a rozšířilo náš dosah do centrálního Pacifiku." # todo: NEW TRANSLATION
 control_caroline_islands_goal_name: "Ovládnout Karolíny" # todo: NEW TRANSLATION
 control_caroline_islands_goal_desc: "Nadvláda nad Karolínami a atolem Truk by umožnila dlouhodobé námořní a letecké kampaně v centrálním Pacifiku." # todo: NEW TRANSLATION
 control_guadalcanal_goal_name: "Ovládnout Guadalcanal" # todo: NEW TRANSLATION
 control_guadalcanal_goal_desc: "Zajištění Guadalcanalu by nám umožnilo kontrolovat námořní operace v jižním Pacifiku a přístupové trasy z Austrálie i do ní." # todo: NEW TRANSLATION
 control_wake_island_goal_name: "Ovládnout ostrov Wake" # todo: NEW TRANSLATION
 control_wake_island_goal_desc: "Držení ostrova Wake by umožnilo rozšířit průzkum a letecké pokrytí nad trasami centrálního Pacifiku." # todo: NEW TRANSLATION
 control_midway_island_goal_name: "Ovládnout Midway" # todo: NEW TRANSLATION
 control_midway_island_goal_desc: "Kontrola Midway by umožnila zabezpečit přístupy do centrálního Pacifiku a poskytla klíčovou základnu pro transoceánské operace." # todo: NEW TRANSLATION
 control_hawaii_goal_name: "Ovládnout Havaj" # todo: NEW TRANSLATION
 control_hawaii_goal_desc: "Obsazení Pearl Harboru by umožnilo zakotvit pacifické operace a koordinovat logistiku v celém oceánském bojišti, stejně jako otevřít přístup k americkému pacifickému pobřeží." # todo: NEW TRANSLATION
 control_attu_island_goal_name: "Ovládnout ostrov Attu" # todo: NEW TRANSLATION
 control_attu_island_goal_desc: "Zajištění ostrova Attu by umožnilo kontrolovat severopacifické námořní trasy a provádět operace podél Aleutského řetězce směrem k Aljašce a americkému pacifickému pobřeží." # todo: NEW TRANSLATION
 undo_versailles_goal_name: "Pomstít Versailleskou smlouvu"
 undo_versailles_goal_desc: "Je nejvyšší čas napravit tuto potupu. Získáme zpět naše právoplatná území!"
 strategic_bombing_campaign_goal_name: "Trvalá strategická bombardovací kampaň"
 strategic_bombing_campaign_goal_desc: "Rozsáhlá strategická bombardovací kampaň systematicky oslabí průmyslovou kapacitu nepřítele a umožní nám postupně vyčerpat jeho ozbrojené síly."
 liberate_territory_goal_name: "Osvobodit naše území"
 liberate_territory_goal_desc: "Nepřítel drží naše území. Jeho osvobození musí být naším hlavním cílem."
 great_offensive_goal_name: "Provést velkou ofenzivu"
 great_offensive_goal_desc: "Rozsáhlá ofenziva zaměřená na obsazení nepřátelského území by měla být prvním krokem k definitivnímu ukončení války."
