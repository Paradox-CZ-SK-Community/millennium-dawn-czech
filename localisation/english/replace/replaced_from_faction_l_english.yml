 faction_fifth_international_member: "Pátá internacionála"
 faction_fifth_international_member_desc: "Pátá internacionála byla založena jako nástupce Trockého Čtvrté internacionály a Stalinovy Třetí internacionály s cílem sjednotit všechny světové komunisty proti kapitalistické hrozbě."
 UKR_baltic_black_sea_union_faction: "Baltsko-černomořská unie"
