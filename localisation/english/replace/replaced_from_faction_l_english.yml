l_english:
 NATO: "NATO"
 NATO_member: "Člen NATO"
 NATO_member_desc: "Severoatlantická aliance (NATO) je obranné spojenectví složené ze Spojených států, Kanady a několika evropských zemí. Původně vznikla jako čistě politická aliance, ale velmi rychle se rozvinula v protisovětské vojenské spojenectví. Po rozpadu Sovětského svazu převzalo NATO stále výraznější intervenční roli ve světě. Hlavním účelem aliance však nadále zůstává obrana jejích členských zemí – útok na jednoho člena je považován za útok proti všem."
 NATO_member_tooltip: "§RZvláštní pravidla frakce§!:\n- Pouze vůdce frakce může poskytovat záruky jiným zemím\n- Země mohou být povolány pouze do obranných válek\n- Vstup do frakce a odchod z ní je řízen rozhodnutími a událostmi"
 NATO_guarantee_rule_tt: "§RPouze vůdce frakce NATO může poskytovat záruky jiným zemím!§!"
 NATO_call_ally_rule_tt: "§RČlenové NATO mohou povolat spojence pouze do obranných válek!§!"
 NATO_join_ally_rule_tt: "§RČlenové NATO se mohou připojit ke spojencům pouze v obranných válkách!§!"
 NATO_join_faction_rule_tt: "§RZemě se nemohou připojit k NATO běžnými prostředky!§!"
 NATO_offer_join_faction_rule_tt: "§RJiné země nemohou být pozvány do NATO běžnými prostředky!§!"
 NATO_kick_from_faction_rule_tt: "§RČlenské země NATO nemohou být z NATO vyloučeny běžnými prostředky§!"
 NATO_leave_faction_rule_tt: "§RČlenské země NATO nemohou opustit NATO běžnými prostředky§!"
 NATO_dismantle_faction_rule_tt: "§RNATO nelze rozpuštět§!"
 axis_of_resistance: "Osa odporu"
 RESISTANCE_AXIS: "Osa odporu"
 faction_resistance_axis_member: "Osa odporu"
 faction_resistance_axis_member_desc: "Osa odporu označuje neformální alianci mezi Íránem, Sýrií a Hizballáhem (později také iráckými šíitskými milicemi a hútíjskými rebely). Jedná se o seskupení zemí a aktérů, kteří vystupují proti izraelskému, saúdskému a západnímu vlivu na Blízkém východě."
 faction_resistance_axis_member_TT: "§RZvláštní pravidla frakce§!:\n- Do frakce mají povolen vstup pouze šíitské země"
 resistance_axis_join_faction_rule_tt: "§RPouze šíitské země se mohou připojit k Ose odporu§!"
 resistance_axis_offer_join_faction_rule_tt: "§RPouze šíitské země se mohou připojit k Ose odporu§!"
 CSTO: "ODKB"
 CSTO_member: "Člen ODKB"
 CSTO_member_desc: "Organizace Smlouvy o kolektivní bezpečnosti je obranná vojenská aliance složená z postsovětských států. Organizace vznikla po rozpadu Sovětského svazu a založení Společenství nezávislých států, kdy se jednotlivé země snažily udržet jednotu postsovětského prostoru. Postupem času se vyvinula v samostatnou vojenskou alianci."
 CSTO_member_tooltip: "§RZvláštní pravidla frakce§!:\n- Do frakce mohou vstoupit pouze země, které byly součástí Sovětského svazu\n- Země mohou být povolány pouze do obranných válek"
 CSTO_call_ally_rule_tt: "§RČlenové ODKB mohou povolat spojence pouze do obranných válek!§!"
 CSTO_join_ally_rule_tt: "§RČlenové ODKB se mohou připojit ke spojencům pouze v obranných válkách!§!"
 CSTO_join_faction_rule_tt: "§RPouze postsovětské země se mohou připojit k ODKB!§!"
 CSTO_offer_join_faction_rule_tt: "§RPouze postsovětské země mohou být pozvány do ODKB!§!"
 UNASUL_member: "Člen obranného paktu UNASUL" # todo: NEW TRANSLATION
 UNASUL_member_desc: "Společný obranný mechanismus UNASUL spojuje jihoamerické členy do společného vojenského rámce. Jeho velitelská struktura a vzájemné záruky mají být koordinovány prostřednictvím politických dohod uvnitř bloku, zatímco přistoupení může být umožněno buď diplomacií, nebo politickými uspořádáními na úrovni bloku." # todo: NEW TRANSLATION
 UNASUL_member_tooltip: "§RZvláštní pravidla frakce§!:\n- Členové mohou být povoláni pouze do obranných válek\n- Připojení k frakci lze zajistit běžnou diplomacií nebo událostmi bloku\n- Odchod z frakce je řízen rozhodnutími/událostmi\n- Členy nelze odstranit běžnou diplomacií frakce\n- Alianci nelze rozložit běžnými prostředky" # todo: NEW TRANSLATION
