 asean_centrality_goal_name: "Ústřední postavení ASEAN" # todo: NEW TRANSLATION
 asean_centrality_goal_desc: "Tento poloostrov a tato moře sdílí deset států a po padesát let o jejich bezpečnosti rozhodovaly velmoci za ně. SEATO existuje proto, aby toto rozhodování vrátilo do rukou regionu. Pakt si zaslouží své jméno teprve tehdy, až v něm bude zastoupeno členství ASEAN." # todo: NEW TRANSLATION
 seato_regional_stability_goal_name: "Bangkokské urovnání" # todo: NEW TRANSLATION
 seato_regional_stability_goal_desc: "Pakt nestabilních vlád nezaručuje nic. Přiveďte každého člena na pevnou půdu a udržte pět z nich v alianci, čímž se smlouva přestane stávat pouhým cárem papíru. Každý člen získá politickou moc, stabilitu a na dva roky levnější spotřební zboží." # todo: NEW TRANSLATION
 SIA_seato_stability_dividend: "Stabilitní dividenda SEATO" # todo: NEW TRANSLATION
 SIA_seato_stability_dividend_desc: "Sdílené zásobování a otevřené hranice uvnitř paktu snížily cenu každodenního zboží napříč členstvím, včetně Bangkoku." # todo: NEW TRANSLATION
 imperial_bloc_alliance: "Imperiální blok"
 faction_imperial_bloc_alliance: "Člen imperiálního bloku"
 faction_imperial_bloc_alliance_desc: "Imperiální blok, často označovaný jako nové Centrální mocnosti, byl vytvořen Německem s cílem konkurovat dominanci ODKB a NATO v regionu. Ačkoli vznik paktu byl prosazen silou, vedl k posunu směrem k více bipolárnímu světu."
 faction_imperial_bloc_TT: "§RZvláštní pravidla frakce§!:\n- Do frakce mohou vstoupit pouze některé evropské země\n- Země mohou být povolány i do §Hútočných§! válek"
