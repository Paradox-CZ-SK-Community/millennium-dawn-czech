 fortify_bosporus_tooltip: "Každá provincie v §YIstanbulu§!, která ovládá průliv §YBospor§!, má §Ypobřežní pevnost§! úrovně 1, §Ypozemní pevnost§! úrovně 1 a je obsazena jednou divizí." # todo: NEW TRANSLATION
 fortify_dardanelles_goal_name: "Opevnit Dardanely"
