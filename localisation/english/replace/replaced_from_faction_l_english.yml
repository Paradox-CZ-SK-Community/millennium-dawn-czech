 SCO_name: "Šanghajská organizace spolupráce"
 faction_manifest_sco_name: "Směrem k eurasijské harmonii"
 faction_manifest_sco_desc: "Tento manifest vymezuje společnou vizi členských států Šanghajské organizace spolupráce (SCO) pro inkluzivní, stabilní a suverénní eurasijský prostor. Je založen na principech vzájemného respektu, nevměšování se do vnitřních záležitostí a spolupráce ku vzájemnému prospěchu."
 sco_member: "Člen Šanghajské organizace spolupráce"
 sco_member_desc: "Šanghajská organizace spolupráce (SCO) je eurasijská politická, hospodářská a bezpečnostní organizace, jejíž vznik byl oznámen 15. června 2001 v Šanghaji lídry Číny, Kazachstánu, Kyrgyzstánu, Ruska, Tádžikistánu a Uzbekistánu."
