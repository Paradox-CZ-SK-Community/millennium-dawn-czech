 fortify_dardanelles_tooltip: "Každá provincie v §YEdirne§! a §YBurse§!, která ovládá průliv §YDardanely§!, má §Ypobřežní pevnost§! úrovně 1, §Ypozemní pevnost§! úrovně 1 a je obsazena jednou divizí." # todo: NEW TRANSLATION
