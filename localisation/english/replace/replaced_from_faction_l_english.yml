 faction_cento_alliance_join_faction_rule_tt: "§RPřipojit se k CENTO mohou pouze vybrané země z Blízkého východu, Afriky, Střední Asie a Pákistánu!§!" # todo: CHANGED
 faction_cento_alliance_offer_join_faction_rule_tt: "§RPřipojit se k CENTO mohou pouze vybrané země z Blízkého východu, Afriky, Střední Asie a Pákistánu!§!" # todo: CHANGED
 aso_alliance: "ASO" # todo: NEW TRANSLATION
 faction_aso_alliance: "Člen ASO" # todo: NEW TRANSLATION
 faction_aso_alliance_desc: "ASO, známá také jako Atlantická bezpečnostní organizace, je vznikající vojenský pakt vytvořený Británií s cílem čelit hegemonii NATO v Evropě a celém atlantském regionu. Jejím dalším cílem je přimět CSTO ke úplné kapitulaci, pokud jde o jeho aktivity v Evropě." # todo: NEW TRANSLATION
 faction_aso_TT: "§RZvláštní pravidla frakce§!:\n- K ASO se mohou připojit pouze některé evropské země" # todo: NEW TRANSLATION
 faction_aso_alliance_offer_join_faction_rule_tt: "§RK ASO se mohou připojit pouze některé evropské země!§!" # todo: NEW TRANSLATION
 seato_alliance: "EAST"
 faction_seato_alliance: "Člen EAST"
 faction_seato_alliance_desc: "EAST znamená East Asian Security Treaty. Tato frakce vznikla s americkou podporou silnější demokratické aliance ve východní Asii s cílem čelit rostoucímu čínskému vlivu a dominanci. Cílem frakce je chránit demokratické normy v regionu a posilovat vojenskou spolupráci a bezpečnost mezi členskými státy."
 faction_seato_TT: "§RZvláštní pravidla frakce§!:\n- Do frakce mohou vstoupit pouze některé země východní Asie a Oceánie\n- Země mohou být povolány pouze do obranných válek"
 faction_seato_alliance_call_ally_rule_tt: "§RČlenové aliance EAST mohou povolat spojence pouze do obranných válek!§!"
 faction_seato_alliance_join_ally_rule_tt: "§RČlenové EAST se mohou připojit ke spojencům pouze v obranných válkách!§!"
 faction_seato_alliance_join_faction_rule_tt: "§RPouze některé země východní Asie a Oceánie se mohou připojit k EAST!§!"
 faction_seato_alliance_offer_join_faction_rule_tt: "§RPouze některé země východní Asie a Oceánie se mohou připojit k EAST!§!"
 SIA_seato_alliance: "SEATO" # todo: NEW TRANSLATION
 faction_SIA_seato_alliance: "Člen SEATO" # todo: NEW TRANSLATION
 faction_SIA_seato_alliance_desc: "SEATO, Organizace smlouvy jihovýchodní Asie, je pakt vzájemné obrany založený Thajskem a postavený na členství v ASEAN. Zatímco původní smlouva z roku 1954 byla nástrojem vnějších mocností a v roce 1977 zanikla, tato organizace je svou koncepcí regionální: Bangkok stojí v jejím středu, členové jsou jejími sousedy a záruka se vztahuje na obranu jihovýchodní Asie, nikoli na strategii zadržování kohokoli." # todo: NEW TRANSLATION
 faction_SIA_seato_TT: "§RZvláštní pravidla frakce§!:\n- Ve frakci jsou povoleny pouze země jihovýchodní Asie\n- Země ve válce se nemohou připojit\n- Válku mohou vyhlásit pouze nezávislé země\n- Země mohou být povolány pouze do obranných válek\n- Záruky vydané členy vytvářejí o §Y15 %§! méně světového napětí\n- Členové sdílejí §Y10 %§! své živé síly do rezerv frakce\n- Vedení může změnit majitele pouze tehdy, když je manifest pod §Y50 %§!" # todo: NEW TRANSLATION
 faction_SIA_seato_alliance_call_ally_rule_tt: "§RČlenové SEATO mohou povolávat spojence pouze do obranných válek!§!" # todo: NEW TRANSLATION
 faction_SIA_seato_alliance_join_ally_rule_tt: "§RČlenové SEATO se mohou připojit ke spojencům pouze v obranných válkách!§!" # todo: NEW TRANSLATION
 faction_SIA_seato_alliance_join_faction_rule_tt: "§RK SEATO se mohou připojit pouze země jihovýchodní Asie!§!" # todo: NEW TRANSLATION
