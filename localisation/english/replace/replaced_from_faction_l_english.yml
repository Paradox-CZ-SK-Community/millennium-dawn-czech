 faction_warsaw_pact_idea: "Člen Varšavské smlouvy" # todo: NEW TRANSLATION
 faction_warsaw_pact_idea_desc: "§YVaršavská smlouva§!, formálně „Smlouva o přátelství, spolupráci a vzájemné pomoci“, je společná obranná smlouva podepsaná SSSR a Polskem 28. května 1955. Moderní návrat tohoto pojmu volně označuje společný obranný blok ve východní Evropě v důsledku znovuobnovení Sovětského svazu a růstu komunistického bloku vedeného Moskvou, který se rozpíná všemi směry a rozšiřuje komunistický vliv v opozici vůči vlivu Západu." # todo: NEW TRANSLATION
 faction_warsaw_pact_member_tt: "§RFaction Special Rules§!:\n- Pouze bývalé země Varšavské smlouvy se mohou připojit k frakci\n" # todo: NEW TRANSLATION # todo: MOVED KEY
