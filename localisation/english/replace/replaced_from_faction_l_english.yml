 taj_alliance: "Pakt TAJ"
 faction_taj_alliance: "Člen TAJ"
 faction_taj_alliance_desc: "Tato země je členem Paktu TAJ (Korunní pakt). Aliance byla založena tádžickou vládou s cílem zajistit jednotnou obranu proti těm, kteří usilují o poškození států Střední Asie. Někteří spekulují, že skutečným důvodem vzniku aliance bylo odstrašení ruské agrese poté, co se tádžická vláda začala politicky vzdalovat ruské."
 faction_taj_alliance_call_ally_rule_tt: "§RČlenové aliance TAJ mohou povolat spojence pouze do obranných válek!§!"
 faction_taj_alliance_join_ally_rule_tt: "§RČlenové TAJ se mohou připojit ke spojencům pouze v obranných válkách!§!"
 faction_taj_alliance_join_faction_rule_tt: "§RPouze některé země Blízkého východu a Střední Asie se mohou připojit k Paktu TAJ!§!"
 faction_taj_alliance_offer_join_faction_rule_tt: "§RPouze některé země Blízkého východu a Střední Asie se mohou připojit k Paktu TAJ!§!"
 mto_alliance: "MTO"
 faction_mto_alliance: "Člen MTO"
 faction_mto_alliance_desc: "Tato země je členem MTO (Středomořská smluvní organizace), která se podílí na vzájemné obraně ostatních islámských zemí sdružených v MTO. Organizace se rovněž zapojuje do různých hospodářských projektů na Blízkém východě a v přilehlých oblastech, přičemž jejím hlavním cílem je zlepšení ekonomického blahobytu muslimů."
