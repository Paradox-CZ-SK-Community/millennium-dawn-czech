 DESIGNER_REGIMENTAL_SUPPORT_COLUMN_TITLE: "Podpůrné roty praporu. Jedná se o podpůrné a bojové jednotky připojené přímo na úrovni praporu.\n\nPodpůrné roty praporu §Rneovlivňují§! §Ymaximální rychlost§! divize a §Rzvyšují§! její §Yšířku boje§!." # todo: NEW TRANSLATION
 DESIGNER_SUPPORT_COLUMN_TITLE: "Podpůrné roty brigády a divize. Jedná se o podpůrné jednotky, které zůstávají za jednotkami v první linii a pomáhají jim.\n\nMůžete vybrat pouze §Rjednu§! od každého typu.\n\n Podpůrné roty §Rneovlivňují§! §Ymaximální rychlost§! divize a §Rzvyšují§! její §Yšířku boje§!." # todo: NEW TRANSLATION
