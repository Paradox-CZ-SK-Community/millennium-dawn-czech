 sp_fire_support_land_drone_reward_improved_communication_tech_bonus: "Vylepšená bezdrátová komunikace" # todo: NEW TRANSLATION
 sp_tactical_augmented_reality_reward_civilian_interest: "Civilní zájem" # todo: NEW TRANSLATION
 sp_tactical_augmented_reality_reward_civilian_interest_desc: "Technologická společnost projevila zájem o vojenský výzkumný projekt v oblasti rozšířené reality. Chtějí posílit spolupráci mezi civilním a vojenským průmyslovým komplexem. Můžeme buď zřídit továrnu poskytující hardware pro civilní sektor, nebo můžeme využít zdroje společnosti k výrobě vybavení pro armádu." # todo: NEW TRANSLATION
 sp_tactical_augmented_reality_reward_civilian_interest_civ_factory: "Civilní investice" # todo: NEW TRANSLATION
 sp_tactical_augmented_reality_reward_civilian_interest_mil_factory: "Vojenské investice" # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_double_shot_type: "Metoda dvojité střelby" # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_double_shot_type_desc: "Naši inženýři byli kontaktováni dvěma firmami, obě mají unikátní metodu poskytování více počáteční palebné síly. Jedna firma navrhuje útočnou pušku se dvěma hlavně, která může střílet v krátkých sledech. Druhá firma chce implementovat kladkový systém, který umožní cyklus závěru dvakrát za akci a vystřelit dvě náboje po sobě. Kterou bychom měli zvolit?" # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_double_shot_type_double_barrel: "Dvojhlavňová hlaveň" # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_double_shot_type_pulley: "Kladkostroj" # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_improved_firing_rate: "Vylepšená kadence střelby" # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_improved_firing_rate_desc: "Při vývoji rychlopalné zbraně pro naše speciální jednotky naši inženýři zjistili, jak zvýšit kadenci našich stávajících pěchotních zbraní, aniž by došlo ke zhoršení přesnosti. Tuto metodu můžeme aplikovat buď na naše hlavní útočné pušky, nebo na naše podpůrné kulomety." # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_improved_firing_rate_offence: "Útočné pušky" # todo: NEW TRANSLATION
 sp_double_shot_rifle_reward_improved_firing_rate_defence: "Kulomety" # todo: NEW TRANSLATION
 sp_experimental_exoskeleton_reward_engineers: "Zájem armádních inženýrů" # todo: NEW TRANSLATION
 sp_experimental_exoskeleton_reward_engineers_desc: "Inženýrský sbor naší armády projevil zájem o náš projekt exoskeletonu. S exoskeletonem, který zvyšuje sílu nositele, by mohli zvýšit efektivitu bojových inženýrů. Můžeme vyvinout oblek, který vyniká ve stavbě opevnění, nebo ten, který pomáhá při obnově poškozené vojenské techniky." # todo: NEW TRANSLATION
 sp_experimental_exoskeleton_reward_engineers_defence: "Oblek pro opevnění" # todo: NEW TRANSLATION
 sp_experimental_exoskeleton_reward_engineers_recovery: "Oblek pro obnovu" # todo: NEW TRANSLATION
 sp_tank_support_drones_reward_improved_visibility: "Vylepšené vidění" # todo: NEW TRANSLATION
 sp_tank_support_drones_reward_improved_visibility_desc: "Při práci na vizuálních displejích pro nové tankové podpůrné drony vyvinuli naši inženýři kamerový systém, který by měl zlepšit výhled posádek z jejich tanků." # todo: NEW TRANSLATION
 sp_tank_support_drones_reward_improved_targeting: "Vylepšené cílení" # todo: NEW TRANSLATION
 sp_tank_support_drones_reward_improved_targeting_desc: "Při práci na softwaru pro rozpoznávání hrozeb pro naše bojové drony se inženýři podařilo vytvořit verzi kompatibilní s naším stávajícím tankovým softwarem. Díky tomu budeme moci vylepšit cílení pro naše tanky." # todo: NEW TRANSLATION
 sp_active_camouflage_reward_vehicle_protection: "Maskování vozidel" # todo: NEW TRANSLATION
 sp_active_camouflage_reward_vehicle_protection_desc: "Některé výzkumy osobního maskování by šly aplikovat i na naše vozidla. Můžeme upřednostnit maskování našich vozidel buď proti pozemním, nebo vůči vzdušným nepřátelům." # todo: NEW TRANSLATION
 sp_active_camouflage_reward_vehicle_protection_ground: "Pozemní nepřátelé" # todo: NEW TRANSLATION
 sp_active_camouflage_reward_vehicle_protection_ground_air: "Nepřátelé ve vzduchu" # todo: NEW TRANSLATION
 sp_active_protection_systems_reward_improved_targeting: "Vylepšené cílení" # todo: NEW TRANSLATION
 sp_active_protection_systems_reward_improved_targeting_desc: "Naši inženýři vyvinuli nový systém pro detekci přijíždějících projektilů. Domnívají se, že některé algoritmy by mohly být použity k vylepšení detekce letadel." # todo: NEW TRANSLATION
 sp_tank_electric_engine_hybrid_mode: "Vylepšené motory" # todo: NEW TRANSLATION
 sp_tank_electric_engine_hybrid_mode_desc: "Využitím zkušeností z vývoje elektrických motorů se naši inženýři podařilo vylepšit stávající modely pro dieselové a turbínové motory." # todo: NEW TRANSLATION
 sp_tank_aa_launchers_reward_multi_launcher_missile: "Retrofitovaná raketa" # todo: NEW TRANSLATION
 sp_tank_aa_launchers_reward_multi_launcher_missile_desc: "Při vývoji SAM spouště pro naše tanky naši inženýři krátce experimentovali s projektily vystřelovanými z hlavně. Zjistili, že by mohli vyvinout raketu, která by pasovala do většiny našich tankových hlavní, i když by nebyla optimální. Podobně by mohli raketu učinit kompatibilní napříč více generacemi našich MANPADS." # todo: NEW TRANSLATION
 sp_tank_aa_launchers_reward_utlise_in_tanks: "Vystřelování z hlavně" # todo: NEW TRANSLATION
 sp_tank_aa_launchers_reward_utilise_in_manpads: "Kompatibilní napříč generacemi" # todo: NEW TRANSLATION
 sp_tank_self_sharpening_ammo_reward_improved_alloys: "Vylepšené slitiny" # todo: NEW TRANSLATION
 sp_tank_self_sharpening_ammo_reward_improved_alloys_desc: "Při práci na nové metodě tepelného zpracování ke zlepšení mikrostruktury wolframového penetrátoru naši materiáloví inženýři objevili metodu tepelného zpracování, která by mohla být použita k ošetření našich pancířových desek." # todo: NEW TRANSLATION
 sp_super_heavy_tank_turrets_reward_turret_ring: "Posílený věžní prstenec" # todo: NEW TRANSLATION
 sp_super_heavy_tank_turrets_reward_turret_ring_desc: "Výzva u těžší věže spočívá v tom, že je třeba vytvořit věžní prstenec, který vydrží zatížení a bude se pohybovat odpovídající rychlostí. Během vývoje super těžké věže jsme se naučili několik ponaučení a mohli bychom je uplatnit buď na zlepšení rychlosti otáčení věží, nebo na zlepšení jejich odolnosti." # todo: NEW TRANSLATION
 sp_super_heavy_tank_turrets_reward_turret_ring_speed: "Rychlejší otáčení věží" # todo: NEW TRANSLATION
 sp_super_heavy_tank_turrets_reward_turret_ring_armour: "Zvýšit pancíř věžního prstence" # todo: NEW TRANSLATION
