 sp_double_barrel_cannons_reward_improved_autoloader_desc: "Naši inženýři vyvinuli vylepšený automatický nabíjecí systém pro tanky při práci na systému dvojité hlavně." # todo: NEW TRANSLATION
 sp_railgun_cannon_reward_improved_barrel: "Vylepšená hlaveň" # todo: NEW TRANSLATION
 sp_railgun_cannon_reward_improved_barrel_desc: "Při práci na hlavni, která vydrží obrovské teplo generované railgunem, se našim inženýrům podařilo využít některé poznatky ke zlepšení našich tradičních hlavní." # todo: NEW TRANSLATION
