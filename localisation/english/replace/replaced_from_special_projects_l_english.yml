 sp_biofuel_e10_blend: "Míchání etanolu E10" # todo: NEW TRANSLATION
 sp_biofuel_e10_blend_desc: "Míchání etanolu s ropnými produkty v koncentraci 10 % je osvědčená, komerčně nasazená technologie používaná ve více než miliardě vozidel po celém světě. Standardizace infrastruktury pro výrobu E10 sníží naši závislost na dovážených fosilních palivech, přesměruje zemědělské přebytky do energetického mixu a vyžaduje pouze drobné úpravy stávajících rafinerií a distribučních sítí." # todo: NEW TRANSLATION
 sp_biofuel_flexfuel_butanol: "FlexFuel a syntéza butanolu" # todo: NEW TRANSLATION
 sp_biofuel_flexfuel_butanol_desc: "Na základě standardizovaného míchání etanolu tento program sleduje dvě paralelní cesty. Motory na flexibilní palivo snášejí E85 a podobné směsi s vysokým obsahem etanolu, čímž oddělují kompatibilitu vozidel od poměru směsi. Biobutanol nabízí vyšší energetickou hustotu a vlastnosti při studeném startu bližší benzinu, avšak velkosériová výroba zůstává nevyřešeným technickým problémem. Úspěšný program by postavil náš rafinerský sektor do čela světového trhu." # todo: NEW TRANSLATION
