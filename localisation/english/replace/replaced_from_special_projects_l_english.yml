 sp_caseless_ammunition_reward_new_propellant_desc: "Naši inženýři objevili teplotně odolnou pohonnou látku, která by měla pomoci snížit přehřívání." # todo: NEW TRANSLATION
 sp_fire_support_land_drone_reward_improved_communication: "Nová komunikační metoda dronů" # todo: NEW TRANSLATION
 sp_fire_support_land_drone_reward_improved_communication_desc: "Při vývoji efektivního řídicího systému pro naše drony naši inženýři vyvinuli vylepšenou metodu bezdrátové komunikace. Můžeme tento průlom využít buď v civilních, nebo vojenských aplikacích." # todo: NEW TRANSLATION
