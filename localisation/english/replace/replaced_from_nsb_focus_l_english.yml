 EST_new_economic_policy_desc: "Po obnovení naší nezávislosti jsme si vybudovali roli brány mezi Východem a Západem a usilovali o hospodářskou reformu a integraci se Západem. Přesto musíme vytvořit novou politiku, která bude lépe ladit s našimi zahraničními partnery, výnosnější a systematická." # todo: NEW TRANSLATION # todo: MOVED KEY
 SOV_proclaim_soviet_hegemony_desc: "S obnovenou ekonomikou a mobilizovanými masami je Rusko připraveno znovu získat svou vedoucí úlohu. Otevřeně prohlásíme sovětskou nadřazenost, posuneme rovnováhu sil na východ a přimějeme evropské státy, aby se vyrovnaly s naším návratem." # todo: NEW TRANSLATION
 SOV_the_third_rome_desc: "Moskva, Třetí Řím, je myšlenka, že Moskva je nástupcem starověkého Říma a Byzance, nesoucí odkaz Římské říše. Tento koncept byl v evropských dějinách předmětem debat o tom, které město si toto dědictví právem nárokuje." # todo: NEW TRANSLATION # todo: MOVED KEY
 polish_focus: "Polsko Zaměření stromu" # todo: NEW TRANSLATION # todo: MOVED KEY
 SOV_socialist_humanism_desc: "Socialismus není jen otázkou továren a kvót, ale také důstojnosti dělníka. Postavíme lidský blahobyt do středu revoluce a dokážeme, že komunistická cesta slouží lidem, nikoli naopak." # todo: NEW TRANSLATION
