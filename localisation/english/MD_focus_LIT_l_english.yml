l_english:
 lithuania.1.t: "Otázka Mažeikių Nafty" # todo: NEW TRANSLATION
 lithuania.1.d: "Jediná litevská ropná rafinerie, Mažeikių Nafta, se stala ohniskem geopolitického napětí. O koupi zařízení projevily zájem polský energetický gigant PKN Orlen i ruské konsorcium. Ponechání rafinerie ve státních rukou zůstává možností, byť nákladnou." # todo: NEW TRANSLATION
 lithuania.1.a: "Prodat společnosti PKN Orlen" # todo: NEW TRANSLATION
 lithuania.1.b: "Prodat ruskému konsorciu" # todo: NEW TRANSLATION
 lithuania.1.c: "Ponechat ve státních rukou" # todo: NEW TRANSLATION
 lithuania.2.t: "PKN Orlen kupuje litevskou rafinerii" # todo: NEW TRANSLATION
 lithuania.2.d: "Společnost PKN Orlen dokončila akvizici litevské rafinerie Mažeikių Nafta a rozšířila polské energetické zájmy v baltském regionu." # todo: NEW TRANSLATION
 lithuania.2.a: "Rozumná investice" # todo: NEW TRANSLATION
 lithuania.3.t: "Požár v rafinerii Mažeikiai" # todo: NEW TRANSLATION
 lithuania.3.d: "V ropné rafinerii Mažeikiai vypukl podezřelý požár. Načasování, krátce po prodeji ruským zájmům, podnítilo spekulace o sabotáži a vyvolalo otázky ohledně bezpečnosti litevské energetické infrastruktury." # todo: NEW TRANSLATION
 lithuania.3.a: "Ukázat prstem na Moskvu" # todo: NEW TRANSLATION
 lithuania.3.b: "Zahájit tiché vyšetřování" # todo: NEW TRANSLATION
 lithuania.10.t: "Budoucnost Ignaliny" # todo: NEW TRANSLATION
 lithuania.10.d: "Evropská unie požaduje, aby Litva uzavřela jadernou elektrárnu Ignalina, v níž se nacházejí dva reaktory RBMK, stejné konstrukce jako reaktor, který selhal v Černobylu. Uzavření je podmínkou členství v EU, ale Ignalina dodává většinu litevské elektřiny. Náhradní elektrárna by mohla být postavena společně s Polskem a pobaltskými státy." # todo: NEW TRANSLATION
 lithuania.10.a: "Vyjednat společnou náhradu se sousedy" # todo: NEW TRANSLATION
 lithuania.10.b: "Ponechat Ignalinu v provozu" # todo: NEW TRANSLATION
 lithuania.10.c: "Uzavřít ji bez náhrady" # todo: NEW TRANSLATION
 lithuania.11.t: "Návrh litevské jaderné spolupráce" # todo: NEW TRANSLATION
 lithuania.11.d: "Litva navrhla, aby Polsko spolufinancovalo výstavbu jaderné elektrárny Visaginas, která by nahradila stárnoucí elektrárnu Ignalina. Projekt by posílil energetickou nezávislost Pobaltí a prohloubil regionální vazby, vyžaduje však značné investice." # todo: NEW TRANSLATION
 lithuania.11.a: "Souhlasit se spolufinancováním projektu" # todo: NEW TRANSLATION
 lithuania.11.b: "Máme jiné priority" # todo: NEW TRANSLATION
 lithuania.12.t: "Polsko souhlasí s jadernou spoluprací" # todo: NEW TRANSLATION
 lithuania.12.d: "Polsko souhlasilo se spolufinancováním jaderné elektrárny Visaginas. Výstavba může začít, dokončení projektu však potrvá roky a bude vyžadovat značné zdroje." # todo: NEW TRANSLATION
 lithuania.12.a: "Zahájit výstavbu" # todo: NEW TRANSLATION
 lithuania.13.t: "Polsko odmítá jadernou spolupráci" # todo: NEW TRANSLATION
 lithuania.13.d: "Polsko odmítlo účast na projektu Visaginas. Litva nyní musí o osudu Ignaliny rozhodnout sama." # todo: NEW TRANSLATION
 lithuania.13.a: "Ponechat Ignalinu v provozu navzdory rizikům" # todo: NEW TRANSLATION
 lithuania.13.b: "Uzavřít ji. Obejdeme se bez ní" # todo: NEW TRANSLATION
 lithuania.14.t: "Referendum o jaderné elektrárně Visaginas" # todo: NEW TRANSLATION
 lithuania.14.d: "Po letech výstavby čelí projekt jaderné elektrárny Visaginas celostátnímu referendu. Veřejné mínění je rozdělené mezi ty, kteří ji považují za nezbytnou pro energetickou bezpečnost, a ty, kteří mají obavy z jaderné bezpečnosti a překročení nákladů." # todo: NEW TRANSLATION
 lithuania.14.a: "Lidé elektrárnu schvalují" # todo: NEW TRANSLATION
 lithuania.14.b: "Lidé projekt odmítají" # todo: NEW TRANSLATION
 lithuania.15.t: "Elektrárna Visaginas dokončena" # todo: NEW TRANSLATION
 lithuania.15.d: "Společná litevsko-polská jaderná elektrárna Visaginas je v provozu. Projekt představuje milník ve spolupráci v oblasti energetiky v Pobaltí a v regionální nezávislosti na ruském plynu." # todo: NEW TRANSLATION
 lithuania.15.a: "Triumf spolupráce" # todo: NEW TRANSLATION
 lithuania.16.t: "Mezinárodní tlak na Ignalinu" # todo: NEW TRANSLATION
 lithuania.16.d: "Evropská unie vydala formální varování kvůli pokračujícímu provozu litevské jaderné elektrárny Ignalina. Pokud nebudou reaktory typu Černobyl odstaveny, hrozí sankce a ztráta strukturálních fondů EU." # todo: NEW TRANSLATION
 lithuania.16.a: "Nemáme na výběr. Odstavit ji" # todo: NEW TRANSLATION
 lithuania.16.b: "Odolat tlaku" # todo: NEW TRANSLATION
 LIT_refinery_sale_revenue: "Příjmy z prodeje rafinerie" # todo: NEW TRANSLATION
 LIT_refinery_sale_revenue_desc: "Výnosy z prodeje Mažeikių Nafty dočasně posilují státní rozpočet." # todo: NEW TRANSLATION
 LIT_russian_energy_leverage: "Ruská energetická páka" # todo: NEW TRANSLATION
 LIT_russian_energy_leverage_desc: "Prodej jediné litevské rafinerie ruským zájmům poskytl Moskvě ekonomickou páku na litevskou energetickou politiku." # todo: NEW TRANSLATION
 LIT_nationalized_refinery: "Zestátněná rafinerie" # todo: NEW TRANSLATION
 LIT_nationalized_refinery_desc: "Litva si ponechala státní vlastnictví Mažeikių Nafty, čímž zajistila bezpečnost zdrojů za cenu provozní efektivity." # todo: NEW TRANSLATION
 LIT_energy_deficit: "Energetický deficit" # todo: NEW TRANSLATION
 LIT_energy_deficit_desc: "Uzavření jaderné elektrárny Ignalina bez náhrady zanechalo Litvu závislou na drahém dovozu energie." # todo: NEW TRANSLATION
 LIT_visaginas_nuclear_plant: "Jaderná elektrárna Visaginas" # todo: NEW TRANSLATION
 LIT_visaginas_nuclear_plant_desc: "Nová elektrárna Visaginas poskytuje čistou a spolehlivou energii a je symbolem regionální spolupráce v Pobaltí." # todo: NEW TRANSLATION
 lithuania_news.1.t: "Mažeikių Nafta prodána" # todo: NEW TRANSLATION
 lithuania_news.1.d_poland: "Litva prodala svou jedinou ropnou rafinerii, Mažeikių Naftu, polskému energetickému gigantu PKN Orlen. Dohoda prohlubuje hospodářské vazby mezi Pobaltím a Polskem a v Bruselu je vnímána jako krok ke snížení regionální energetické závislosti na Rusku." # todo: NEW TRANSLATION
 lithuania_news.1.d_russia: "Litva prodala svou jedinou ropnou rafinerii, Mažeikių Naftu, konsorciu podporovanému Ruskem. Kritici varují, že dohoda poskytuje Moskvě strategickou páku nad litevskou energetickou infrastrukturou." # todo: NEW TRANSLATION
 lithuania_news.1.a: "Základní kámen naší energetické budoucnosti" # todo: NEW TRANSLATION
 lithuania_news.1.b: "Vítané rozšíření na baltský trh" # todo: NEW TRANSLATION
 lithuania_news.1.c: "Další krok vpřed v regionu" # todo: NEW TRANSLATION
 lithuania_news.1.d: "Energetická bezpečnost v Pobaltí se mění" # todo: NEW TRANSLATION
 lithuania_news.1.e: "Poznámka pod čarou v evropské energetické politice" # todo: NEW TRANSLATION
 lithuania_news.2.t: "Jaderná elektrárna Ignalina uzavřena" # todo: NEW TRANSLATION
 lithuania_news.2.d: "Litva odstavila jadernou elektrárnu Ignalina a vyřadila poslední ze svých reaktorů RBMK ze sovětské éry. Uzavření naplňuje klíčový požadavek pro vstup do EU, zemi však ponechává závislou na dovozu energie, dokud nebude nalezen náhradní zdroj." # todo: NEW TRANSLATION
 lithuania_news.2.a: "Světla nějak zůstanou svítit" # todo: NEW TRANSLATION
 lithuania_news.2.b: "Vítězství pro jadernou bezpečnost v Evropě" # todo: NEW TRANSLATION
 lithuania_news.2.c: "O jeden reaktor méně na světě" # todo: NEW TRANSLATION
 lithuania_news.3.t: "Jaderná elektrárna Visaginas dokončena" # todo: NEW TRANSLATION
 lithuania_news.3.desc: "Nová litevská jaderná elektrárna Visaginas byla uvedena do provozu díky polskému spolufinancování. Zařízení obnovuje energetickou soběstačnost země a představuje významný úspěch regionální spolupráce v Pobaltí." # todo: NEW TRANSLATION
 lithuania_news.3.a: "Konečně energetická nezávislost" # todo: NEW TRANSLATION
 lithuania_news.3.b: "Naše investice v regionu se vyplácí" # todo: NEW TRANSLATION
 lithuania_news.3.c: "Nová kapitola baltské energetické politiky" # todo: NEW TRANSLATION
 lithuania_news.3.d: "Pobaltí zajišťuje svou energetickou budoucnost" # todo: NEW TRANSLATION
