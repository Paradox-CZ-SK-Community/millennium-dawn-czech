 afv_composite_armor_gen1: "Rané studené války Lehká kompozitní pancíř" # todo: NEW TRANSLATION
 afv_composite_armor_gen1_desc: "Nápodoba raného kompozitního pancíře pro tanky." # todo: NEW TRANSLATION
 afv_composite_armor_gen2: "Lehký kompozitní pancíř studené války" # todo: NEW TRANSLATION
