 spaa_radar_gen1: "Radarové systémy po druhé světové válce" # todo: NEW TRANSLATION
 spaa_radar_gen1_desc: "Základní radarový systém navržený výhradně pro platformy SPAA, nabízející vyvážené spojení dosahu a přesnosti pro detekci vzdušných hrozeb. Jeho cena odráží specializovanou povahu." # todo: NEW TRANSLATION
 spaa_radar_gen2: "Radarové systémy studené války" # todo: NEW TRANSLATION
 spaa_radar_gen2_desc: "Vylepšený o pokročilejší detekční algoritmy, tento radarový systém vyniká v přeplněných vzdušných prostředích, zajišťuje konzistentní sledování cílů navzdory rušení." # todo: NEW TRANSLATION
 spaa_radar_gen3: "Moderní radarové systémy" # todo: NEW TRANSLATION
 spaa_radar_gen3_desc: "Používá vysoce technologické materiály a digitální zpracování, zajišťuje optimální sledování v reálném čase a předávání informací, čímž dává výhodu v rychlých vzdušných soubojích." # todo: NEW TRANSLATION
 spaa_radar_gen4: "Pokročilé radarové systémy" # todo: NEW TRANSLATION
 spaa_radar_gen4_desc: "Špičkový systém, který čerpá z průlomové technologie, poskytuje bezprecedentní přesnost a rozlišování cílů v různorodých operačních divadlech." # todo: NEW TRANSLATION
 spaa_radar_gen5: "Radarové systémy s kvantovou asistencí" # todo: NEW TRANSLATION
 spaa_radar_gen5_desc: "Vrchol návrhu radarů, nabízí adaptivní schopnosti, které bezproblémově zvládají více hrozeb, upevňuje jeho pověst špičkového detekčního nástroje, i když vyžaduje prémiovou cenu." # todo: NEW TRANSLATION
 spaa_radar_gen6: "Nejmodernější radarové systémy" # todo: NEW TRANSLATION
 spaa_radar_gen6_desc: "Vrchol konstrukce radarů nabízí adaptivní schopnosti pro plynulé řízení několika hrozeb a upevňuje svou pověst špičkového detekčního nástroje, byť za vyšší cenu." # todo: NEW TRANSLATION
 spaa_radar_gen7: "Velmi pokročilé radarové systémy" # todo: NEW TRANSLATION
 spaa_radar_gen7_desc: "Vrchol konstrukce radarů nabízí adaptivní schopnosti pro plynulé řízení několika hrozeb a upevňuje svou pověst špičkového detekčního nástroje, byť za vyšší cenu." # todo: NEW TRANSLATION
 spaa_radar_gen8: "Hyperpokročilé radarové systémy" # todo: NEW TRANSLATION
 spaa_radar_gen8_desc: "Vrchol konstrukce radarů nabízí adaptivní schopnosti pro plynulé řízení několika hrozeb a upevňuje svou pověst špičkového detekčního nástroje, byť za vyšší cenu." # todo: NEW TRANSLATION
 spaa_radar_gen9: "Ultrapokročilé radarové systémy" # todo: NEW TRANSLATION
 spaa_radar_gen9_desc: "Vrchol konstrukce radarů nabízí adaptivní schopnosti pro plynulé řízení několika hrozeb a upevňuje svou pověst špičkového detekčního nástroje, byť za vyšší cenu." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen1: "Radarový podpůrný vůz po druhé světové válce" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen1_desc: "Zatímco nabízí rozšířené detekční schopnosti, jeho primární funkcí je pomáhat SPAA lepšími cílovacími daty. Jeho raný návrh s sebou nese výzvy při frontálním průlomu." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen2: "Radarový podpůrný vůz studené války" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen2_desc: "Vylepšené zpracování signálu zvyšuje celkovou reakční rychlost v rámci obranného ekosystému vzdušné obrany, i když na úkor odolnosti vůči přímým bojům." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen3: "Moderní radarový podpůrný vůz" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen3_desc: "Tento vůz se pyšní vyladenými radarovými systémy, které slibují rychlejší klasifikaci hrozeb a jejich předávání, i když dává přednost provozu z bezpečné vzdálenosti." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen4: "Pokročilý radarový podpůrný vůz" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen4_desc: "Využívá špičkové radarové technologie, slouží jako 'oči' obranné sítě, zajišťuje identifikaci a zvládnutí hrozeb, a je nejlépe chráněn před přímými střety." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen5: "Radarový podpůrný vůz s kvantovou asistencí" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen5_desc: "Reprezentuje vrchol evoluce podpůrného radaru, jeho bezkonkurenční dosah detekce a rychlé šíření informací jej činí neocenitelným nástrojem, ale jeho zranitelnost na frontě přetrvává." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen6: "Nejmodernější podpůrné radarové vozidlo" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen6_desc: "Představuje vrchol vývoje podpůrných radarů. Jeho bezkonkurenční dosah detekce a rychlé šíření informací z něj činí nepostradatelný prostředek, avšak jeho zranitelnost v první linii přetrvává." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen7: "Velmi pokročilé podpůrné radarové vozidlo" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen7_desc: "Představuje vrchol vývoje podpůrných radarů. Jeho bezkonkurenční dosah detekce a rychlé šíření informací z něj činí nepostradatelný prostředek, avšak jeho zranitelnost v první linii přetrvává." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen8: "Hyperpokročilé podpůrné radarové vozidlo" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen8_desc: "Představuje vrchol vývoje podpůrných radarů. Jeho bezkonkurenční dosah detekce a rychlé šíření informací z něj činí nepostradatelný prostředek, avšak jeho zranitelnost v první linii přetrvává." # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen9: "Ultrapokročilé podpůrné radarové vozidlo" # todo: NEW TRANSLATION
 spaa_off_vehicle_radar_gen9_desc: "Představuje vrchol vývoje podpůrných radarů. Jeho bezkonkurenční dosah detekce a rychlé šíření informací z něj činí nepostradatelný prostředek, avšak jeho zranitelnost v první linii přetrvává." # todo: NEW TRANSLATION
 spaa_optical_guidance_gen1: "Optické navádění po druhé světové válce" # todo: NEW TRANSLATION
 spaa_optical_guidance_gen1_desc: "Využívá základní vizuální pomůcky a rané senzory; tento naváděcí systém nabízí cenově dostupný prostředek k sledování a zacílení vzdušných cílů za příznivých podmínek." # todo: NEW TRANSLATION
 spaa_optical_guidance_gen2: "Optické navádění studené války" # todo: NEW TRANSLATION
 spaa_optical_guidance_gen2_desc: "Integrované vylepšené čočky a rané elektronické sledování nabízejí konzistentnější získání cíle, zejména během denních operací." # todo: NEW TRANSLATION
 spaa_optical_guidance_gen3: "Moderní optické navádění" # todo: NEW TRANSLATION
 spaa_optical_guidance_gen3_desc: "S pokroky v senzorové technice tento systém nabízí lepší rozlišování cílů a odhad dosahu, čímž je spolehlivou a cenově výhodnou volbou." # todo: NEW TRANSLATION
 spaa_optical_guidance_gen4: "Pokročilé optické navádění" # todo: NEW TRANSLATION
 spaa_optical_guidance_gen4_desc: "Kombinací špičkových vizuálních senzorů se softwarovými pomocníky slibuje efektivnější sledování cílů a drží krok s dražšími radarovými protějšky." # todo: NEW TRANSLATION
 spaa_optical_guidance_gen5: "Futuristické optické navádění" # todo: NEW TRANSLATION
 spaa_optical_guidance_gen5_desc: "Zázrak optické techniky, nabízí adaptivní vizuální sledování a chytré prioritizování hrozeb, čímž upevňuje svou pozici jako cenově dostupná, avšak efektivní alternativa." # todo: NEW TRANSLATION
 spaa_optical_guidance_gen6: "Hyperpokročilé optické navádění" # todo: NEW TRANSLATION
 spaa_optical_guidance_gen6_desc: "Tento zázrak optické techniky nabízí adaptivní vizuální sledování a chytré určování priorit hrozeb, čímž se upevňuje jako cenově dostupná a přitom účinná alternativa." # todo: NEW TRANSLATION
 spaa_optical_guidance_gen7: "Ultrapokročilé optické navádění" # todo: NEW TRANSLATION
 spaa_optical_guidance_gen7_desc: "Tento zázrak optické techniky nabízí adaptivní vizuální sledování a chytré určování priorit hrozeb, čímž se upevňuje jako cenově dostupná a přitom účinná alternativa." # todo: NEW TRANSLATION
 walker_tank_module_railgun: "Kolejnicový kanón chodce" # todo: NEW TRANSLATION
 walker_tank_module_railgun_desc: "Kolejnicové kanóny využívají elektromagnetický urychlovač k palbě projektilů vysokou rychlostí a poskytují vynikající průbojnost proti silně chráněným cílům.\n\n§GTip konstruktéra: Kolejnicové kanóny výrazně zvyšují průbojnost pancíře, ale jejich výroba je nákladnější.§!" # todo: NEW TRANSLATION
 walker_tank_module_tank_barrel: "Standardní tankový kanón" # todo: NEW TRANSLATION
 walker_tank_module_tank_barrel_desc: "Tankové kanóny poskytují vyváženou a spolehlivou hlavní výzbroj pro obrněný boj. Kombinují osvědčenou palebnou sílu s přijatelnými nároky na výrobu a údržbu.\n\n§GTip konstruktéra: Standardní tankové kanóny jsou cenově efektivní základní volbou zbraně a nabízejí spolehlivý výkon bez specializovaných kompromisů§!" # todo: NEW TRANSLATION
 walker_tank_module_flamethrower: "Plamenomet chodce" # todo: NEW TRANSLATION
 walker_tank_module_flamethrower_desc: "Plamenomety namontované na vozidlech vrhají hořící palivo k čištění pěchotních postavení a lehkých opevnění, takže jsou na krátkou vzdálenost vysoce účinné proti měkkým cílům.\n\n§GTip konstruktéra: Plamenomety vynikají proti měkkým cílům a opevněné pěchotě, ale proti silně obrněným či zpevněným cílům mají velmi omezený účinek§!" # todo: NEW TRANSLATION
 walker_tank_module_heavy_machinegun: "Těžký kulomet" # todo: NEW TRANSLATION
 walker_tank_module_heavy_machinegun_desc: "Těžké kulomety poskytují spolehlivou zbraň s vysokou kadencí pro potlačování pěchoty a boj s lehkými vozidly. Nabízejí účinnou obranu na krátkou až střední vzdálenost.\n\n§GTip konstruktéra: Těžké kulomety jsou jednoduchou a cenově efektivní volbou sekundární zbraně, ideální pro univerzální ochranu proti měkkým cílům§!" # todo: NEW TRANSLATION
 walker_tank_module_rocket_launcher: "Raketomet chodce" # todo: NEW TRANSLATION
 walker_tank_module_rocket_launcher_desc: "Raketomety odpalují vysoce výbušnou a kumulativní munici a poskytují lepší účinek proti tvrdým cílům než standardní kulometná výzbroj.\n\n§GTip konstruktéra: Raketomety jsou dražší než těžké kulomety, ale nabízejí vyšší útok proti tvrdým cílům a lepší průbojnost proti obrněným cílům§!" # todo: NEW TRANSLATION
 walker_tank_module_vls: "Vertikální odpalovací systém chodce" # todo: NEW TRANSLATION
 walker_tank_module_vls_desc: "Vertikální odpalovací systémy umožňují chodcům nést a odpalovat naváděné střely z chráněných odpalovacích šachet, což zajišťuje ničivé údery a rychlé salvové palby.\n\n§GTip konstruktéra: Moduly VLS jsou výrazně dražší na výrobu, ale poskytují mnohem vyšší potenciál průlomu a útoku.§!" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen1: "Jaderný motor I" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen1_desc: "Jaderné motory zajišťují výrobu energie přímo na palubě a odstraňují spotřebu konvenčního paliva, což umožňuje dlouhodobý provoz bez závislosti na palivové logistice.\n\n§GTip konstruktéra: Jaderné motory odstraňují spotřebu paliva, ale jejich výroba je nákladnější.§!" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen2: "Jaderný motor II" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen2_desc: "$walker_tank_module_nuclear_engine_gen1_desc$" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen3: "Jaderný motor III" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen3_desc: "$walker_tank_module_nuclear_engine_gen1_desc$" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen4: "Jaderný motor IV" # todo: NEW TRANSLATION
 walker_tank_module_nuclear_engine_gen4_desc: "$walker_tank_module_nuclear_engine_gen1_desc$" # todo: NEW TRANSLATION
 walker_tank_module_diesel_engine_gen1: "Vznětový motor I" # todo: NEW TRANSLATION
 walker_tank_module_diesel_engine_gen1_desc: "Vznětové motory poskytují chodcům konvenční a osvědčenou pohonnou jednotku. Nabízejí jednoduchou výrobu a údržbu s běžně dostupnými součástmi.\n\n§GTip konstruktéra: Vznětové motory jsou standardní a cenově efektivní volbou, ale vyznačují se vysokou spotřebou paliva.§!" # todo: NEW TRANSLATION
 walker_tank_module_fusion_engine_gen1: "Fúzní motor I" # todo: NEW TRANSLATION
 walker_tank_module_fusion_engine_gen1_desc: "Fúzní motory zajišťují výrobu energie s vysokou hustotou přímo na palubě a odstraňují spotřebu konvenčního paliva, což umožňuje dlouhodobý provoz bez závislosti na palivové logistice.\n\n§GTip konstruktéra: Fúzní motory nabízejí stejné výhody nezávislosti na palivu jako jaderné motory, ale jsou spolehlivější a ještě dražší.§!" # todo: NEW TRANSLATION
 walker_tank_module_solar_engine_gen1: "Solární motor I" # todo: NEW TRANSLATION
 walker_tank_module_solar_engine_gen1_desc: "Solární motory vyrábějí elektrickou energii přímo na palubě a omezují závislost na konvenční palivové logistice, což za příznivých podmínek umožňuje delší provoz.\n\n§GTip konstruktéra: Solární motory nabízejí podobné výhody nezávislosti na palivu jako jaderné motory při nižší ceně, ale jsou méně spolehlivé.§!" # todo: NEW TRANSLATION
 walker_tank_module_two_legs: "Dvounohý rám chodce" # todo: NEW TRANSLATION
 walker_tank_module_two_legs_desc: "Dvounohé rámy chodců poskytují standardní uspořádání se dvěma nohama a nabízejí vyváženou manévrovatelnost a ochranu pro univerzální bojové role.\n\n§GTip konstruktéra: Dvounohé rámy představují základní konfiguraci chodce a poskytují spolehlivou pohyblivost a odolnost bez vyšší ceny a složitosti těžších soustav nohou§!" # todo: NEW TRANSLATION
 walker_tank_module_four_legs: "Těžký čtyřnohý rám" # todo: NEW TRANSLATION
 walker_tank_module_four_legs_desc: "Těžké čtyřnohé rámy používají čtyři zesílené soustavy nohou ke zlepšení stability pod palbou a nesení většího nákladu, čímž zvyšují odolnost během útoků.\n\n§GTip konstruktéra: Těžké čtyřnohé rámy poskytují vyšší průlomovou sílu a lepší spolehlivost, ale jejich výroba je nákladnější a pohyb je pomalejší.§!" # todo: NEW TRANSLATION
 walker_tank_light_chassis: "Lehké tělo chodce" # todo: NEW TRANSLATION
 walker_tank_light_chassis_desc: "Lehká těla chodců tvoří základní konstrukci tanků-chodců a upřednostňují nízkou hmotnost a obratnost pro rychlé manévrování a změnu pozic.\n\n§GTip konstruktéra: Lehká těla poskytují vysokou manévrovatelnost a přístup k 1 slotu výzbroje, takže jsou ideální pro role, v nichž je nejdůležitější rychlost§!" # todo: NEW TRANSLATION
 walker_tank_medium_chassis: "Střední tělo chodce" # todo: NEW TRANSLATION
 walker_tank_medium_chassis_desc: "Střední těla chodců tvoří základní konstrukci tanků-chodců a vyvažují ochranu, pohyblivost a nosnost pro všestranný výkon v první linii.\n\n§GTip konstruktéra: Střední těla jsou univerzální volbou a poskytují přístup ke 2 slotům výzbroje pro flexibilní konfigurace.§!" # todo: NEW TRANSLATION
 walker_tank_heavy_chassis: "Těžké tělo chodce" # todo: NEW TRANSLATION
 walker_tank_heavy_chassis_desc: "Těžká těla chodců tvoří základní konstrukci těžkých tanků-chodců a upřednostňují maximální nosnost a integraci zbraní před rychlostí a obratností.\n\n§GTip konstruktéra: Těžká těla jsou velmi drahá a představují nejpomalejší tělo chodce, ale nabízejí nejvíce možností výzbroje a jsou určena k překonání a zničení nejodolnějších cílů§!" # todo: NEW TRANSLATION
 walker_tank_module_battlestation_1: "Bojová stanice I" # todo: NEW TRANSLATION
 walker_tank_module_battlestation_1_desc: "Bojové stanice integrují řízení palby, senzory a nástroje koordinace na palubě, aby zlepšily celkovou bojovou účinnost a reakční schopnosti celé platformy.\n\n§GTip konstruktéra: Bojové stanice poskytují široká zlepšení výkonu chodce ve všech oblastech a představují silné obecné vylepšení pro jakoukoli roli a konfiguraci§!" # todo: NEW TRANSLATION
 walker_tank_module_countermeasures_1: "Systém aktivní ochrany I" # todo: NEW TRANSLATION
 walker_tank_module_countermeasures_1_desc: "Systémy aktivní ochrany využívají senzory a rychle reagující protiopatření k detekci a ničení přilétajících hrozeb, čímž zvyšují celkovou obrannou odolnost pod palbou.\n\n§GTip konstruktéra: Systémy aktivní ochrany poskytují rozsáhlé obranné vylepšení a pomáhají chodcům přežít střely, rakety a další přesné hrozby při působení v první linii§!" # todo: NEW TRANSLATION
 walker_tank_module_anti_rocket_laser_1: "Laser bodové obrany I" # todo: NEW TRANSLATION
 walker_tank_module_anti_rocket_laser_1_desc: "Lasery bodové obrany využívají rychlé sledování a impulzy směrované energie k detekci a ničení přilétajících raket před dopadem, čímž snižují pravděpodobnost úspěšného průniku.\n\n§GTip konstruktéra: Lasery bodové obrany zlepšují ochranu proti raketovým a střelovým hrozbám snížením šance průniku, takže jsou obzvlášť cenné pro průlomové jednotky očekávající trvalou palbu§!" # todo: NEW TRANSLATION
 walker_tank_module_recon_drone_1: "Průzkumný dron I" # todo: NEW TRANSLATION
 walker_tank_module_recon_drone_1_desc: "Sady průzkumných dronů umožňují chodcům nasadit bojový dron pro pozorování v přední linii a potvrzování cílů, čímž zlepšují situační přehled i mimo přímou viditelnost.\n\n§GTip konstruktéra: Průzkumné drony zlepšují průzkum.§!" # todo: NEW TRANSLATION
 walker_tank_module_suicide_drone_1: "Schránky potulující se munice I" # todo: NEW TRANSLATION
 walker_tank_module_suicide_drone_1_desc: "Schránky potulující se munice vypouštějí jednorázové útočné drony, které mohou vyhledávat, sledovat a zasahovat cíle s lepším naváděním a rozlišováním cílů než standardní salvy střel.\n\n§GTip konstruktéra: Potulující se munice poskytuje lepší zaměřování a spolehlivost zásahu než běžné údery VLS, ale způsobuje menší přímé poškození kvůli menším hlavicím a omezené nosnosti§!" # todo: NEW TRANSLATION
 ARG_tank_small_medium_cannon_2: "105 mm FM K.4 Modelo 1L" # todo: NEW TRANSLATION
 ARG_tank_small_medium_cannon_2_desc: "Argentinská licenci vyrobená verze britského tankového kanónu L7, vyráběného Fabricaciones Militares.\n\n§GDesigner Hint: Nízké ráže zbraní jsou vhodné pro HE náboje kvůli nižší rychlosti výstřelu. Použijte je, pokud chcete upřednostnit měkký útok před tvrdým útokem§!" # todo: NEW TRANSLATION
 ARG_tank_diesel_engine_gen2: "MB 833 Ka-500, 720 hp" # todo: NEW TRANSLATION
 ARG_tank_diesel_engine_gen2_desc: "MB 833 Ka-500 byl původně německý dieselový motor vyráběný MTU. Motor byl Argentinou upraven pro použití v tanku TAM.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 BRA_tank_small_medium_cannon: "105 mm L7A3" # todo: NEW TRANSLATION
 BRA_tank_small_medium_cannon_desc: "Brazilská licencovaná verze německého 105 mm L7A3. Toto dělo ze éry studené války bylo hlavní volbou výzbroje pro tank Leopard I.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE projektily díky nižší ústové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 BRA_tank_medium_cannon: "120 mm GIAT G1" # todo: NEW TRANSLATION
 BRA_tank_medium_cannon_desc: "120 mm GIAT G1 je brazilská licencovaná verze francouzského CN120-25 vyrobená společností Établissement d'Études et de Fabrication d'Armements de Bourges. Toto dělo ze éry studené války bylo hlavní volbou výzbroje pro AMX-32 a AMX-40 od GIAT Industries.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE projektily díky nižší ústové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 BRA_tank_diesel_engine_gen2: "MWM TBD 234, 1000 hp" # todo: NEW TRANSLATION
 BRA_tank_diesel_engine_gen2_desc: "The MWM TBH 234 je brazilská licencovaná verze německého MWM TBD 234. Tento motor ze studené války je kompaktní a vysoce výkonný motor navržený během studené války.\n\n§GDesigner Hint: Vícepalivové dieselové motory jsou standardním motorem používaným v tancích§!" # todo: NEW TRANSLATION
 CHI_tank_small_medium_cannon: "100 mm Type 59" # todo: NEW TRANSLATION
 CHI_tank_small_medium_cannon_desc: "Typ 59 je čínská kopie tankového děla D-10T používaného u řady T-55.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE projektily díky nižší ústové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 CHI_tank_small_medium_cannon_2: "105 mm ZPL-81A" # todo: NEW TRANSLATION
 CHI_tank_small_medium_cannon_2_desc: "ZPL-81A je čínská licencovaná verze britského kanónu L7A3. Čínská verze má domesticky vyrobený vylepšený termální návlek.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE projektily díky nižší ústové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 CHI_tank_small_medium_cannon_3: "105 mm ZPL-98A" # todo: NEW TRANSLATION
 CHI_tank_small_medium_cannon_3_desc: "ZPL-98A je čínská licencovaná verze britského kanónu L7A3. Tato vylepšená verze má domesticky vyrobený tlumič zpětného rázu s nízkým zpětným nárazem a nižší hmotností.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE projektily díky nižší ústové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 CHI_tank_medium_cannon: "125 mm Typ 88C" # todo: NEW TRANSLATION
 CHI_tank_medium_cannon_desc: "Typ 88C je rané čínské dělo hlavního bojového tanku, odvozené od sovětského 2A46M.\n\n§GTip návrháře: Nízkokalibrová děla jsou vhodná pro HE střely díky nižší ústové rychlosti. Použijte je, pokud chcete upřednostnit útok na měkké cíle před útokem na těžce chráněné cíle§!" # todo: NEW TRANSLATION
 CHI_tank_medium_cannon_2: "125 mm ZPT-98" # todo: NEW TRANSLATION
 CHI_tank_medium_cannon_2_desc: "ZPT-98 je čínské 125 mm dělo hlavního bojového tanku, s snadno rozpoznatelným odvětrávačem plynů uprostřed hlavně.\n\n§GTip návrháře: Nízkokalibrová děla jsou vhodná pro HE střely díky nižší ústové rychlosti. Použijte je, pokud chcete upřednostnit útok na měkké cíle před útokem na těžce chráněné cíle§!" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen1: "Model 12150L V-12, 520 hp" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen1_desc: "Model 12150L je raný čínský V-12 motor ze studené války. Je spojen s pětistupňovou manuální převodovkou, když je namontován v tanku.\n\n§GDesigner Hint: Vícepalivové dieselové motory jsou standardním motorem používaným v tancích§!" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen2: "Model 12150L-7BW V-12, 580 hp" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen2_desc: "Model 12150L-7BW je vylepšená verze předchozího modelu 12150L.\n\n§GDesigner Hint: Vícepalivové dieselové motory jsou standardním motorem používaným v tancích§!" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen3: "Model 12150ZL V-12, 730 hp" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen3_desc: "Model 12150ZL je vylepšená verze předchozího modelu 12150L-7BW.\n\n§GDesigner Hint: Vícepalivové dieselové motory jsou standardním motorem používaným v tancích§!" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen4: "KMDB 6TD-2, 1200 hp" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen4_desc: "KMDB 6TD-2 je ruský tankový motor, který byl původně plánován pro prototyp Type 90-II. Tank nebyl nikdy přijat do čínské služby, ale pokračoval ve svém životě jako tank Al-Khalid v pakistánské službě.\n\n§GDesigner Hint: Vícepalivové dieselové motory jsou standardním motorem používaným v tancích§!" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen5: "150HB, 1500 hp" # todo: NEW TRANSLATION
 CHI_tank_diesel_engine_gen5_desc: "The 150HB is a Norinco made diesel engine based on the German MB 873 Ka-501 used on the Leopard 2.\n\n§GDesigner Hint: Vícepalivové dieselové motory jsou standardním motorem používaným v tancích§!" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen1: "FY-I" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen1_desc: "FY-I je čínská ERA 1. generace určená k boji proti HEAT nábojům.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen2: "FY-II" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen2_desc: "FY-II je čínská ERA 2. Generace, která chrání tanky proti HEAT a APFSDS nábojům.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen3: "FY-IV" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen3_desc: "FY-IV je čínská ERA 3. generace, která působí proti HEAT nábojům a tandemovým hlavicím.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen4: "FY-V" # todo: NEW TRANSLATION
 CHI_reactive_armor_gen4_desc: "FY-V je čínská ERA 4. generace určená k ochraně tanku proti všem možným projektilům.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 CHI_hardkill_system_gen1: "GL5" # todo: NEW TRANSLATION
 FRA_afv_coax_machine_gun: "7,62mm AA-52" # todo: NEW TRANSLATION
 FRA_afv_coax_machine_gun_desc: "AA-52 (plné označení ve francouzštině: Arme Automatique Transformable Modèle 1952) je jednou z prvních francouzsky vyráběných zbraní v období po druhé světové válce. Byl vyráběn státem vlastněnou společností Manufacture d'armes de Saint-Étienne (MAS)." # todo: NEW TRANSLATION
 FRA_afv_machine_gun: "7,62mm AA-52" # todo: NEW TRANSLATION
 FRA_afv_machine_gun_desc: "AA-52 (plné označení ve francouzštině: Arme Automatique Transformable Modèle 1952) je jednou z prvních francouzsky vyráběných zbraní v období po druhé světové válce. Byl vyráběn státem vlastněnou společností Manufacture d'armes de Saint-Étienne (MAS)." # todo: NEW TRANSLATION
 FRA_afv_machine_gun_2: "12,7mm M2 Browning" # todo: NEW TRANSLATION
 FRA_small_autocannon_2: "20 mm modèle F2 gun" # todo: NEW TRANSLATION
 FRA_big_autocannon_3: "40mm 40 CTC" # todo: NEW TRANSLATION
 FRA_big_autocannon_3_desc: "Most advanced gun of their category, use telescoped ammunition" # todo: NEW TRANSLATION
 FRA_tank_very_large_cannon: "140mm ASCALON " # todo: NEW TRANSLATION
 FRA_tank_very_large_cannon_desc: "The Autoloaded and SCALable Outperforming guN or ASCALON is a French smoothbore 140 mm tank gun of 50 calibers designed by Nexter" # todo: NEW TRANSLATION
 FRA_tank_small_medium_cannon: "105mm CN-105-57" # todo: NEW TRANSLATION
 FRA_tank_small_medium_cannon_desc: "The CN-105-57, also known as CN 105/57 or D1504, is a light French 105 mm tank gun and use by many light tank" # todo: NEW TRANSLATION
 FRA_tank_small_medium_cannon_2: "105mm CN-105 F1" # todo: NEW TRANSLATION
 FRA_tank_small_medium_cannon_2_desc: "The Canon de 105 mm modèle F1 (or CN-105-F1) is a French 105 mm tank gun used with the AMX-30" # todo: NEW TRANSLATION
 FRA_tank_medium_cannon: "120mm CN120-25" # todo: NEW TRANSLATION
 FRA_tank_medium_cannon_desc: "The CN120-25, also simply referred to as Modèle G1 (G1 model) is a French smoothbore 120mm tank gun of 52 calibers designed by the EFAB of Bourges for the export market" # todo: NEW TRANSLATION
 FRA_tank_medium_cannon_2: "120mm CN120-26" # todo: NEW TRANSLATION
 FRA_tank_medium_cannon_2_desc: "The CN120-26, also simply referred to as Modèle F1 (F1 model) is a French smoothbore 120mm tank gun of 52 calibers designed by the EFAB of Bourges and produced by Giat Industries" # todo: NEW TRANSLATION
 FRA_tank_small_cannon: "75mm SA 50" # todo: NEW TRANSLATION
 FRA_tank_small_cannon_desc: "The 75 SA 50 (French: 75 mm Semi-Automatique Modèle 1950; English: 75 mm Semi-Automatic 1950 Model) also called 75 Mle 50 or CN 75-50 is a French 75 mm high-velocity rifled gun" # todo: NEW TRANSLATION
 FRA_tank_small_cannon_2: "90mm CN90 F4 Super 90" # todo: NEW TRANSLATION
 FRA_tank_small_cannon_desc_2: "It's a evolution of the 90mm gun of the AMX-13/90, is shoot the same ammo but their are more accurate" # todo: NEW TRANSLATION
 FRA_afv_assault_gun: "60mm Brandt Mle CM60A1" # todo: NEW TRANSLATION
 FRA_afv_assault_gun_desc: "The Brandt Mle CM60A1, also known as the Brandt HB 60LP, MCB-60 HB, or simply as the Brandt 60mm LP gun-mortar, is a 60 mm (2.36 in.) gun-mortar" # todo: NEW TRANSLATION
 FRA_medium_tank_artillery_chassis_0: "105mm Obusier de 105 modèle 1950" # todo: NEW TRANSLATION
 FRA_medium_tank_artillery_chassis_1: "155mm Canon GCT de 155 mm/L39" # todo: NEW TRANSLATION
 FRA_medium_tank_artillery_chassis_2: "155 mm Canon Caesar 155mm/L52" # todo: NEW TRANSLATION
 FRA_reactive_armor_gen1: "BRENUS" # todo: NEW TRANSLATION
 ISR_tank_medium_cannon_2: "120mm MG251" # todo: NEW TRANSLATION
 ISR_tank_medium_cannon_2_desc: "The IMI 120 mm gun is an L44 smoothbore tank gun designed and produced by Israeli Military Industries (IMI). It is widely confused as a licensed production of the Rheinmetall L44 tank gun, however it was developed by IMI from 1983 to 1988, to meet the requirements of the Israel Defense Forces' Merkava Mark III main battle tank, i.e. a narrower mount like in the M60, both tanks designed around a 105 mm gun" # todo: NEW TRANSLATION
 ISR_tank_medium_cannon_3: "120mm MG251-LR" # todo: NEW TRANSLATION
 ISR_tank_medium_cannon_3_desc: "Improved version of the MG251 with a thermal sleeve developed by VIDCO Industries and a new compressed gas recoil system" # todo: NEW TRANSLATION
 ENG_tank_small_medium_cannon: "105 mm L7A1" # todo: NEW TRANSLATION
 ENG_tank_small_medium_cannon_desc: "Tankový kanón Royal Ordnance L7 je pravděpodobně jedním z nejslavnějších tankových kanónů. Licencovaný a kopírovaný mnoha zeměmi, tento kanón a jeho různé verze byly během rané studené války široce používány.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE náboje kvůli nižší ústřelové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 ENG_tank_small_medium_cannon_2: "105 mm L7A2" # todo: NEW TRANSLATION
 ENG_tank_small_medium_cannon_2_desc: "L7A2 je vylepšením staršího modelu L7 s přidaným tepelným pláštěm.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE náboje kvůli nižší ústřelové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 ENG_tank_small_medium_cannon_3: "105 mm Royal Ordnance IWS" # todo: NEW TRANSLATION
 ENG_tank_small_medium_cannon_3_desc: "Royal Ordnance IWS (Improved Weapon System) je další vývoj kanónu L7 s vyšším tlakem náplně a delší hlavní.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE náboje kvůli nižší ústřelové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 ENG_tank_medium_cannon: "120 mm L11A5" # todo: NEW TRANSLATION
 ENG_tank_medium_cannon_desc: "L11A5 je britský tankový kanón navržený jako nástupce menšího L7. Kanón L11A5 má v současnosti nejdelší dostřel tanku, když britský tank Challenger zničil iracký T-55 na vzdálenosti 4,7 km během Války v Zálivu.\n\n§GDesigner Hint: Středně kalibrované zbraně jsou vyváženým tankovým kanónem. Použijte je, pokud nechcete upřednostňovat ani měkký, ani tvrdý útok§!" # todo: NEW TRANSLATION
 ENG_tank_medium_cannon_2: "120 mm L30A1" # todo: NEW TRANSLATION
 ENG_tank_medium_cannon_2_desc: "Zbraň L30 je vylepšením staršího L11. Je vyrobena z oceli elektro-slag remelting s chromovou slitinou uvnitř. Neobvyklé pro zbraň NATO, zbraň, stejně jako její předchůdce, je drážkovaná.\n\n§GDesigner Hint: Středně kalibrované zbraně jsou vyváženým tankovým kanónem. Použijte je, pokud nechcete upřednostňovat ani měkký ani tvrdý útok§!" # todo: NEW TRANSLATION
 ENG_tank_diesel_engine_gen1: "Rolls-Royce Meteor, 650 hp" # todo: NEW TRANSLATION
 ENG_tank_diesel_engine_gen1_desc: "The Rolls-Royce Meteor engine is a versatile tank engine from World War 2. Původně pochází z leteckých motorů používaných, byl použit v tancích Cromwell, Comet a Centurion.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 ENG_tank_diesel_engine_gen2: "Perkins CV12-1200TCA, 1200 hp" # todo: NEW TRANSLATION
 ENG_tank_diesel_engine_gen2_desc: "The Perkins CV12 engine is a very powerful diesel engines developed for the Challenger 1 and Challenger 2 tanks.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 ENG_tank_composite_armor_gen1: "Chobham" # todo: NEW TRANSLATION
 ENG_tank_composite_armor_gen1_desc: "Chobham pancíř je britský navržený kompozitní pancíř vyvinutý pro tank Challenger. Skládá se z keramických dlaždic spojených se železem a podložen elastickými deskemi. Termín 'Chobham' se stal synonymem pro kompozitní pancíř, bez ohledu na tank či výrobce.\n\n§GDesigner Hint: Kompozitní pancíř je standardní volba pro moderní hlavní bojové tanky§!" # todo: NEW TRANSLATION
 ENG_tank_composite_armor_gen2: "Dorchester" # todo: NEW TRANSLATION
 ENG_tank_composite_armor_gen2_desc: "Dorchester pancíř je nejnovější varianta původního Chobham pancíře a je aktuálně používán na tancích Abrams a Challenger 2. Vylepšená verze nabízí lepší ochranu proti palbě nepřítele.\n\n§GDesigner Hint: Kompozitní pancíř je standardní volba pro moderní hlavní bojové tanky§!" # todo: NEW TRANSLATION
 SOV_tank_small_cannon: "76,2mm D-56T" # todo: NEW TRANSLATION
 SOV_afv_machine_gun: "7,62mm SGMT" # todo: NEW TRANSLATION
 SOV_afv_machine_gun_desc: "The SG-43/SGMT Goryunov (v ruštině: Станковый пулемёт системы Горюнова, Stankovyy pulyemyot sistyemy Goryunova, znamená \"Montovaný kulomet, konstrukce Goryunova\") byl sovětský střední kulomet, který byl představen během druhé světové války. Byl nabíjen náboji ráže 7.62x54mmR a byl uveden v roce 1943 jako náhrada za starší kulomety Maxim M1910." # todo: CHANGED
 SOV_afv_machine_gun_2: "14,5mm KPVT" # todo: NEW TRANSLATION
 SOV_afv_machine_gun_2_desc: "Těžký kulomet KPVT je sovětského návrhu ráže 14.5x114mm, který poprvé vstoupil do služby jako pěchotní zbraň (označená PKP) v roce 1949. V 60. letech byla pěchotní verze stažena z výroby, protože byla příliš velká a těžká. Později byl použit v sérii BTR." # todo: CHANGED
 SOV_afv_coax_machine_gun: "7,62mm PKT" # todo: NEW TRANSLATION
 SOV_afv_coax_machine_gun_desc: "PKT (v ruštině: Пулемёт Калашникова, transliterováno jako Pulemyot Kalashnikova, neboli \"Kalashnikovův kulomet\") je pásový univerzální kulomet nabíjený okrajovým nábojem ráže 7.62x54mmR, odvozeným z kulometu PK/PKM." # todo: CHANGED
 SOV_afv_coax_machine_gun_2: "7,62mm PKT" # todo: NEW TRANSLATION
 SOV_afv_coax_machine_gun_2_desc: "PKT (rusky: Пулемёт Калашникова, přepisováno jako Pulemyot Kalashnikova neboli „Kalašnikovův kulomet“) je pásový univerzální kulomet používající okrajový náboj 7,62×54 mmR odvozený od kulometu PK/PKM" # todo: NEW TRANSLATION
 SOV_afv_atgm_gen1: "9M14 Malyutka" # todo: NEW TRANSLATION
 SOV_afv_atgm_gen1_desc: "(NATO name AT-3 Sanger) Byl to první ručně nesená protitanková řízená střela sovětského svazu a je pravděpodobně nejvíce vyráběnou ATGM všech dob" # todo: NEW TRANSLATION
 SOV_afv_assault_gun: "73mm 2A28 Grom" # todo: NEW TRANSLATION
 SOV_afv_assault_gun_desc: "2A28 Grom, též známý jako KBP 2A28 Grom, je 73 mm nízkotlaký kanón s hladkou hlavní a klínovým závěrem. Vývoj 2A28 Grom byl přímo spojen s vývojem SPG-9 recoilless zbraně; oba vystřelovaly projektily podobné raketovým granátům" # todo: NEW TRANSLATION
 SOV_afv_assault_gun_2: "100mm 2A70" # todo: NEW TRANSLATION
 SOV_afv_assault_gun_2_desc: "100 mm zbraň-spouštěč 2A70 (GRAU označení: 2А70) je typ kanónu s nízkým tlakem a drážkovaným vývrtem navržený v Sovětském svazu KBP Instrument Design Bureau" # todo: NEW TRANSLATION
 SOV_small_autocannon: "30mm 2A42" # todo: NEW TRANSLATION
 SOV_small_autocannon_desc: "The Shipunov 2A42 is a Soviet/Russian 30 mm autocannon. It is built by the Tulamashzavod Joint Stock Company and named after A. G. Shipunov" # todo: NEW TRANSLATION
 SOV_small_autocannon_2: "30mm 2A72" # todo: NEW TRANSLATION
 SOV_small_autocannon_2_desc: "Lehčí zjednodušená varianta 2A42 s menším počtem dílů, delší hlavní a vyšší ústřelová rychlost, ale také nižší kadence. Je to dlouhý vratný pohon, ne poháněný plynem" # todo: NEW TRANSLATION
 SOV_tank_small_medium_cannon: "90-95 mm D-10T2S" # todo: NEW TRANSLATION
 SOV_tank_small_medium_cannon_desc: "D-10 je sovětský tankový kanón vyvinutý koncem druhé světové války, poprvé osazený na stíhači tanků SU-100. Na počátku studené války se zbraně stala volba výzbroje pro sérií T-54 a T-55.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE náboje kvůli nižší ústřelové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 SOV_tank_small_medium_cannon_2: "115 mm U-5TS" # todo: NEW TRANSLATION
 SOV_tank_small_medium_cannon_2_desc: "U-5TS je první kanón s hladkou hlavní vyvinutý pro použití na tancích. Stávající 100 mm kanón na T-55 byl příliš slabý na to, aby si poradil s novými západními Centurion a M60 Patton. V reakci na tyto tanky Sověti vyvinuli 115 mm kanón. Zbraň byla použita pouze na T-62. Prokázala se být účinná i proti modernějším tankům, jak ukázala íránsko‑irácká válka, kde T-62 dokázal zničit mnohem novější Chieftains a M60." # todo: NEW TRANSLATION
 SOV_tank_small_medium_cannon_3: "100 mm 2A70" # todo: NEW TRANSLATION
 SOV_tank_small_medium_cannon_3_desc: "The 2A70 is a rapid fire rifled gun meant for lighter armoured vehicles. The gun is mainly intended to be used with HE rounds. The 2A70 is the main weapon of the BMP-3 series.\n\n§GDesigner Hint: Nízkokalibrové zbraně jsou vhodné pro HE náboje kvůli nižší ústřelové rychlosti. Použijte je, pokud chcete upřednostnit měkký útok nad tvrdým útokem§!" # todo: NEW TRANSLATION
 SOV_tank_medium_cannon: "125 mm 2A46" # todo: NEW TRANSLATION
 SOV_tank_medium_cannon_desc: "The 2A46 is the most common of the Soviet tank guns. Originally developed for the T-64, the gun has been in use in every Soviet and Russian tank ever since, in addition to multiple foreign tanks.\n\n§GDesigner Hint: Středně kalibrované zbraně jsou vyváženým tankovým kanónem. Použijte je, pokud nechcete upřednostňovat ani měkký, ani tvrdý útok§!" # todo: NEW TRANSLATION
 SOV_tank_medium_cannon_2: "125 mm 2A46M" # todo: NEW TRANSLATION
 SOV_tank_medium_cannon_2_desc: "The 2A46M is a family of developments of original 2A46 cannon, with better array of ammo and overall improvements.\n\n§GDesigner Hint: Středně kalibrované zbraně jsou vyváženým tankovým kanónem. Použijte je, pokud nechcete upřednostňovat ani měkký, ani tvrdý útok§!" # todo: NEW TRANSLATION
 SOV_tank_medium_cannon_3: "125 mm 2A82-1M" # todo: NEW TRANSLATION
 SOV_tank_medium_cannon_3_desc: "The latest development or Russian tank technology, the 2A82-1M is intended to be used on the new T-14 Armata tanks. The gun reportedly has 15% to 20% better accuracy than the old 2A46M and a higher muzzle velocity than the Leopard 2 gun.\n\n§GDesigner Hint: Středně kalibrované zbraně jsou vyváženým tankovým kanónem. Použijte je, pokud nechcete upřednostňovat ani měkký, ani tvrdý útok§!" # todo: NEW TRANSLATION
 SOV_tank_large_cannon: "130 mm M-65 L/60" # todo: NEW TRANSLATION
 SOV_tank_large_cannon_desc: "An experimental heavy tank gun that was intended to be used with the nuclear blast withstanding Object 279 Kotin heavy assault tank. As the need for heavy tanks died out, the project was cancelled and the gun with it.\n\n§GDesigner Hint: Těžké zbraně mají být používány především proti obrněným cílům. Použijte je, pokud chcete upřednostnit tvrdý útok a přitom si ponechat část měkkého útoku§!" # todo: NEW TRANSLATION
 SOV_tank_large_cannon_2: "130 mm M-65 L/70" # todo: NEW TRANSLATION
 SOV_tank_large_cannon_2_desc: "An improved version of the Object 279 tank gun. This rifled heavy tank gun was intended for the Object 785, an intended upgrade for the T-80 tank. The project was never finished.\n\n§GDesigner Hint: Těžké zbraně mají být používány především proti obrněným cílům. Použijte je, pokud chcete upřednostnit tvrdý útok a přitom si ponechat část měkkého útoku§!" # todo: NEW TRANSLATION
 SOV_tank_very_large_cannon: "152 mm LP-83" # todo: NEW TRANSLATION
 SOV_tank_very_large_cannon_desc: "LP-83 byl experimentální supertěžký tankový kanón, který byl testován na objektu 292, tanku určeném k nahrazení T-80BV. Jeden prototyp tanku a kanónu byl vyroben v roce 1990, avšak kvůli nedostatku financí a zájmu byl projekt zrušen.\n\n§GDesigner Hint: Supertěžké zbraně jsou určeny pro úkoly proti pancéřované technice. Použijte je, pokud chcete výrazně upřednostnit tvrdý útok nad měkkým útokem§!" # todo: NEW TRANSLATION
 SOV_tank_very_large_cannon_2: "152 mm 2A83" # todo: NEW TRANSLATION
 SOV_tank_very_large_cannon_2_desc: "2A83 je pokračováním dřívějších supertěžkých tankových děl Sovětského svazu. Kanón je určen jako možná modernizace pro T-14 Armata, aby dokázal překonat jakýkoli západní tank.\n\n§GDesigner Hint: Supertěžké zbraně jsou určeny pro úkoly proti pancéřované technice. Použijte je, pokud chcete výrazně upřednostnit tvrdý útok nad měkkým útokem§!" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen1: "V-55, 581 hp" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen1_desc: "V-55 je atmosférický V12 motor, který byl použit na tanku T-55.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen2: "5TDF, 700 hp" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen2_desc: "5TDF je dvoutaktní, viacpalivový, vysoce přeplňovaný, kapalně chlazený dieselový motor s protilehlými písty a horizontálními válci. Původně navržený pro T-64, byl také používán v raných verzích T-72.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen3: "V-84, 840 hp" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen3_desc: "V-84 je dvanáctiválcový motor s turbem, původně určený jako vylepšení pro T-72.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen4: "V-92S2, 1000 hp" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen4_desc: "V-92S2 s turbom byl navržen pro tanky řady T-72B3 a T-90.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen5: "V-92S2F, 1130 hp" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen5_desc: "V-92S2F je vylepšená verze staršího V-92S2. Je určena jako přímá náhrada pro starší model.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen6: "2V-12-3A, 1500 hp" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen6_desc: "2V-12-3A je motor typu X12, určený pro T-14 Armata.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen7: "A-85-3A, 1500 hp" # todo: NEW TRANSLATION
 SOV_tank_diesel_engine_gen7_desc: "A-85-3A je motor typu X12, který nahradil dřívější 2V-12-3A u Armata kvůli problémům se spolehlivostí staršího modelu.\n\n§GDesigner Hint: Multifuel diesel engines are the standard engine used on tanks§!" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen1: "GTD-3TL" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen1_desc: "GTD-3TL byl experimentální motor s plynovou turbínou, který měl být hlavní volbou pro T-64. Později byl však opuštěn ve prospěch dieselového motoru.\n\n§GDesigner Hint: Plynové turbíny mají lepší zrychlení než dieselové motory, zlepšují ovladatelnost vozidla. Jsou však drahé na výrobu a spotřebovávají hodně paliva. Používejte plynové turbíny, pokud chcete rychlé tanky a můžete pro ně zajistit palivo§!" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen2: "SG-1000" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen2_desc: "SG-1000 byl původním motorem s plynovou turbínou pro T-80. Byl rychle nahrazen vylepšeným modelem.\n\n§GDesigner Hint: Plynové turbíny mají lepší zrychlení než dieselové motory, zlepšují ovladatelnost vozidla. Jsou však drahé na výrobu a spotřebovávají hodně paliva. Používejte plynové turbíny, pokud chcete rychlé tanky a můžete pro ně zajistit palivo§!" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen3: "GTD-1000T" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen3_desc: "GTD-1000T je motor s turbínou určený pro T-80A a T-80B. GTD-1000T je spolehlivější a produkuje o něco více koní než starší SG-1000.\n\n§GDesigner Hint: Plynové turbíny mají lepší zrychlení než dieselové motory, zlepšují ovladatelnost vozidla. Jsou však drahé na výrobu a spotřebovávají hodně paliva. Používejte plynové turbíny, pokud chcete rychlé tanky a můžete pro ně zajistit palivo§!" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen4: "GTD-1250" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen4_desc: "GTD-1250 je motor s turbínou používaný u druhé generace tanku T-80, T-80U. Turbína bývá doprovázena menší turbínou, která slouží jako pomocná energetická jednotka.\n\n§GDesigner Hint: Plynové turbíny mají lepší zrychlení než dieselové motory, zlepšují ovladatelnost vozidla. Jsou však drahé na výrobu a spotřebovávají hodně paliva. Používejte plynové turbíny, pokud chcete rychlé tanky a můžete pro ně zajistit palivo§!" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen5: "GTD-1250T" # todo: NEW TRANSLATION
 SOV_tank_gas_turbine_engine_gen6: "GTD-1500" # todo: NEW TRANSLATION
 SOV_tank_electric_engine_gen1: "VK-1200V" # todo: NEW TRANSLATION
 SOV_tank_electric_engine_gen2: "VK-1700V" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen1: "Kontakt-1" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen1_desc: "Kontakt-1 je 1. generace Explosive Reactive Armour (ERA) vyvinuté v Sovětském svazu. Skládá se ze dvou výbušných prvků 4S20 mezi dvěma ocelovými deskami. Kontakt-1 je vysoce necitlivý a může být aktivován pouze tvarovou náloží.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen2: "Kontakt-5" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen2_desc: "Kontakt-5 je druhá generace Explosive Reactive Armour (ERA) vyvinutá v Sovětském svazu. Při výbuchu se ocelové desky v blocích pohybují do stran, čímž vznikne delší dráha průniku pro přijímané projektily. Tento způsob obrany je také účinný proti kinetickým penetrátorům.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen3: "Relikt" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen3_desc: "Relikt je třetí generace Explosive Reactive Armour (ERA) vyvinutá v Sovětském svazu. Je schopná chránit proti rychlým i pomalu se pohybujícím penetrátorům, a dokáže i proti tandemovým tvarovým náloži.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen4: "Malachit" # todo: NEW TRANSLATION
 SOV_reactive_armor_gen4_desc: "Malachit je čtvrtá generace Explosive Reactive Armour (ERA) namontovaná na T-14 Armata.\n\n§GDesigner Hint: Explosive Reactive Armour (ERA) je snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 SOV_smoothbore_atgm_gen1: "9K112 Kobra" # todo: NEW TRANSLATION
 SOV_smoothbore_atgm_gen2: "9M119 Svir" # todo: NEW TRANSLATION
 SOV_smoothbore_atgm_gen3: "9M133 Kornet" # todo: NEW TRANSLATION
 SOV_smoothbore_atgm_gen4: "9M140 Udar" # todo: NEW TRANSLATION
 SOV_smoothbore_atgm_gen5: "9M143 Sila" # todo: NEW TRANSLATION
 SOV_smoke_launchers: "3D6" # todo: NEW TRANSLATION
 SOV_smoke_launchers_desc: "Tucha je 81 mm granátomet namontovaný na vojenském vozidle vyvinutý v Sovětském svazu. Používá se hlavně k vypuštění kouřových granátů typu 3D6 a 3D6M.\n\n§GDesigner Hint: Přidání kouřových vrhačů snižuje viditelnost našeho tanku, čímž je lepší jak v obraně, tak útoku§!" # todo: NEW TRANSLATION
 SOV_smoke_launchers_2: "3D6M" # todo: NEW TRANSLATION
 SOV_smoke_launchers_2_desc: "Tucha je 81 mm granátomet namontovaný na vojenském vozidle vyvinutý v Sovětském svazu. Používá se hlavně k vypuštění kouřových granátů typu 3D6 a 3D6M.\n\n§GDesigner Hint: Přidání kouřových vrhačů snižuje viditelnost našeho tanku, čímž je lepší jak v obraně, tak útoku§!" # todo: NEW TRANSLATION
 SOV_smoke_launchers_3: "Shtora-1" # todo: NEW TRANSLATION
 SOV_smoke_launchers_3_desc: "Shtora-1, 'elektro-optický aktivní ochranný systém', je pokročilé zařízení pro kouřový vrhač. Vystřeluje kouřový granát 3D17, který kouří pomocí červeného fosforu. Kouř hoří dostatečně horký, aby zakryl tank před termálním zobrazováním.\n\n§GDesigner Hint: Přidání kouřových vrhačů snižuje viditelnost našeho tanku, čímž je lepší jak v obraně, tak útoku§!" # todo: NEW TRANSLATION
 SOV_hardkill_system_gen1: "Arena" # todo: NEW TRANSLATION
 SOV_hardkill_system_gen1_desc: "Arena je systém aktivní ochrany, který používá dopplerův radar k detekci přilétajících raket. Jakmile je raketa detekována, systém vystřelí raketu, aby ji zneškodnil.\n\n§GDesigner Hint: Hard-kill systém je dobrý způsob, jak posílit obranné schopnosti našich tanků proti nepřátelským raketám. Také umožní, aby náš pancíř byl účinnější při prorážení nepřátelských linií§!" # todo: NEW TRANSLATION
 SOV_hardkill_system_gen2: "Afganit" # todo: NEW TRANSLATION
 SOV_hardkill_system_gen2_desc: "Afganit je pokročilý systém aktivní ochrany vyvinutý v Rusku. Má být použit na tank T-14 Armata. Systém dokáže zneškodnit jak raketové, tak kinetické penetrátory a dokáže zastavit jakýkoli projektil létající rychlostí pod 1700 m/s.\n\n§GDesigner Hint: Hard-kill systém je dobrý způsob, jak posílit obranné schopnosti našich tanků proti nepřátelským střelám. Také umožní našemu pancíři být účinnější při prorážení nepřátelských linií§!" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen1: "V-54, 520 hp" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen1_desc: "V-54 je atmosférický vidlicový dvanáctiválec používaný v tanku T-54.\n\n§GTip konstruktéra: Vícepalivové vznětové motory jsou standardními motory používanými v tancích§!" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen2: "5TDF, 700 hp" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen2_desc: "5TDF je dvoudobý, vícepalivový, vysoce přeplňovaný, kapalinou chlazený vznětový motor s přímým vstřikováním, protiběžnými písty a vodorovnými válci. Původně byl navržen pro T-64, později se používal také v raných verzích T-72.\n\n§GTip konstruktéra: Vícepalivové vznětové motory jsou standardními motory používanými v tancích§!" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen3: "5TDFM, 850 hp" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen3_desc: "5TDFM je vylepšená verze původního motoru 5TDF, dvoudobého, vícepalivového, vysoce přeplňovaného, kapalinou chlazeného vznětového motoru s přímým vstřikováním, protiběžnými písty a vodorovnými válci. Původně byl navržen pro T-64, později se používal také v raných verzích T-72.\n\n§GTip konstruktéra: Vícepalivové vznětové motory jsou standardními motory používanými v tancích§!" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen4: "KMDB 6TD-1, 1000 hp" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen4_desc: "KMDB 6TD-1 je tankový motor ukrajinské výroby, který byl původně použit při výrobě hlavního bojového tanku T-80UD.\n\n§GTip konstruktéra: Vícepalivové vznětové motory jsou standardními motory používanými v tancích§!" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen5: "KMDB 6TD-2, 1200 hp" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen5_desc: "KMDB 6TD-2 je tankový motor ukrajinské výroby, který byl původně použit při výrobě hlavního bojového tanku T-84.\n\n§GTip konstruktéra: Vícepalivové vznětové motory jsou standardními motory používanými v tancích§!" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen6: "KMDB 6TD-3, 1500 hp" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen6_desc: "KMDB 6TD-3 je navrhovaný ukrajinský tankový motor, vylepšená verze motoru 6TD-2.\n\n§GTip konstruktéra: Vícepalivové vznětové motory jsou standardními motory používanými v tancích§!" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen7: "KMDB 6TD-4, 1800 hp" # todo: NEW TRANSLATION
 UKR_tank_diesel_engine_gen7_desc: "KMDB 6TD-4 je navrhovaný ukrajinský tankový motor, výrazně upravená verze motoru 6TD-3.\n\n§GTip konstruktéra: Vícepalivové vznětové motory jsou standardními motory používanými v tancích§!" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen1: "GTD-3TL" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen1_desc: "GTD-3TL byl experimentální motor s plynovou turbínou, který měl být hlavní volbou pro tank T-64. Tato myšlenka však byla později opuštěna ve prospěch vznětového motoru.\n\n§GTip konstruktéra: Plynové turbíny mají lepší zrychlení než vznětové motory, čímž zlepšují manévrovatelnost vozidla. Jejich výroba je však nákladná a mají vysokou spotřebu paliva. Plynové turbíny používejte, pokud chcete rychlé tanky a dokážete jim zajistit palivo§!" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen2: "SG-1000" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen2_desc: "SG-1000 byl původním motorem s plynovou turbínou tanku T-80. Brzy byl nahrazen vylepšeným modelem.\n\n§GTip konstruktéra: Plynové turbíny mají lepší zrychlení než vznětové motory, čímž zlepšují manévrovatelnost vozidla. Jejich výroba je však nákladná a mají vysokou spotřebu paliva. Plynové turbíny používejte, pokud chcete rychlé tanky a dokážete jim zajistit palivo§!" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen3: "GTD-1000T" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen3_desc: "GTD-1000T je motor s plynovou turbínou určený pro tanky T-80A a T-80B. Je spolehlivější a poskytuje o něco vyšší výkon než starší SG-1000.\n\n§GTip konstruktéra: Plynové turbíny mají lepší zrychlení než vznětové motory, čímž zlepšují manévrovatelnost vozidla. Jejich výroba je však nákladná a mají vysokou spotřebu paliva. Plynové turbíny používejte, pokud chcete rychlé tanky a dokážete jim zajistit palivo§!" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen4: "GTD-1250" # todo: NEW TRANSLATION
 UKR_tank_gas_turbine_engine_gen4_desc: "GTD-1250 je motor s plynovou turbínou používaný ve druhé generaci tanku T-80, konkrétně ve variantě T-80U. Turbína je doplněna menší plynovou turbínou, která slouží jako pomocná energetická jednotka.\n\n§GTip konstruktéra: Plynové turbíny mají lepší zrychlení než vznětové motory, čímž zlepšují manévrovatelnost vozidla. Jejich výroba je však nákladná a mají vysokou spotřebu paliva. Plynové turbíny používejte, pokud chcete rychlé tanky a dokážete jim zajistit palivo§!" # todo: NEW TRANSLATION
 UKR_tank_composite_armor_gen1: "Combinatsiya K" # todo: NEW TRANSLATION
 UKR_tank_composite_armor_gen1_desc: "„Combinatsiya K“ je třívrstvý kompozitní pancíř skládající se z vnější a vnitřní vrstvy oceli, prostřední vrstvy sklolaminátového plastu (sklotekstolitu) a sady keramických, údajně korundových, desek. Poprvé byl instalován na tank T-64.\n\n§GTip konstruktéra: Kompozitní pancíř je standardní volbou pro moderní hlavní bojové tanky§!" # todo: NEW TRANSLATION
 UKR_tank_composite_armor_gen2: "Kompozitní pancíř T-84" # todo: NEW TRANSLATION
 UKR_tank_composite_armor_gen2_desc: "Kompozitní pancíř tanku T-84 byl výrazně vylepšen. Je vícevrstvý a tvoří jej speciální pryžové a keramické materiály vložené mezi ocelové a slitinové pláty.\n\n§GTip konstruktéra: Kompozitní pancíř je standardní volbou pro moderní hlavní bojové tanky§!" # todo: NEW TRANSLATION
 UKR_afv_composite_armor_gen1: "Combinatsiya K" # todo: NEW TRANSLATION
 UKR_afv_composite_armor_gen1_desc: "„Combinatsiya K“ je třívrstvý kompozitní pancíř skládající se z vnější a vnitřní vrstvy oceli, prostřední vrstvy sklolaminátového plastu (sklotekstolitu) a sady keramických, údajně korundových, desek. Poprvé byl instalován na tank T-64.\n\n§GTip konstruktéra: Kompozitní pancíř je standardní volbou pro moderní hlavní bojové tanky§!" # todo: NEW TRANSLATION
 UKR_afv_composite_armor_gen2: "Kompozitní pancíř T-84" # todo: NEW TRANSLATION
 UKR_afv_composite_armor_gen2_desc: "Kompozitní pancíř tanku T-84 byl výrazně vylepšen. Je vícevrstvý a tvoří jej speciální pryžové a keramické materiály vložené mezi ocelové a slitinové pláty.\n\n§GTip konstruktéra: Kompozitní pancíř je standardní volbou pro moderní hlavní bojové tanky§!" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen1: "Kontakt-1" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen1_desc: "Kontakt-1 je výbušný reaktivní pancíř (ERA) první generace vyvinutý v Sovětském svazu. Skládá se ze dvou výbušných prvků 4S20 mezi dvěma ocelovými pláty. Kontakt-1 je vysoce necitlivý a lze jej aktivovat pouze kumulativní náloží.\n\n§GTip konstruktéra: Výbušný reaktivní pancíř (ERA) představuje snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen2: "Kontakt-5" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen2_desc: "Kontakt-5 je výbušný reaktivní pancíř (ERA) druhé generace vyvinutý v Sovětském svazu. Při detonaci se ocelové pláty v blocích pohybují do stran a vytvářejí pro přilétající projektily delší dráhu průniku. Tato metoda obrany je účinná i proti kinetickým penetrátorům.\n\n§GTip konstruktéra: Výbušný reaktivní pancíř (ERA) představuje snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen3: "Nizh" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen3_desc: "Nizh (Nůž) je modulární komplex dynamické ochrany třetí generace pro tanky ukrajinské výroby. Je určen k ochraně bojových vozidel a stacionárních objektů před průbojnými projektily, kumulativními zbraněmi a rázově-kumulativní municí typu „úderové jádro“.\n\n§GTip konstruktéra: Výbušný reaktivní pancíř (ERA) představuje snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen4: "Duplet" # todo: NEW TRANSLATION
 UKR_reactive_armor_gen4_desc: "Duplet je tandemový modulární komplex dynamické ochrany 3. generace+ pro tanky ukrajinské výroby. Jde o modernizovanou verzi komplexu „Nizh“/„Knife“. Je určen k ochraně bojových vozidel a stacionárních objektů před kumulativními dělostřeleckými granáty ráže až 125 mm, tandemovými kumulativními zbraněmi, rázově-kumulativní municí typu „úderové jádro“, reaktivními tankovými granáty a celokovovými opeřenými podkaliberními průbojnými projektily.\n\n§GTip konstruktéra: Výbušný reaktivní pancíř (ERA) představuje snadný způsob, jak vylepšit pancíř vašeho tanku§!" # todo: NEW TRANSLATION
 UKR_smoothbore_atgm_gen1: "9K112 Kobra" # todo: NEW TRANSLATION
 UKR_smoothbore_atgm_gen1_desc: "9K112 Kobra je protitankový raketový systém Sovětského svazu s poloautomatickým naváděním v zorné linii (SACLOS). Odpaloval se z hlavních 125mm kanónů tanků řad T-64 a T-80.\n\n§GTip konstruktéra: Vybavením našich tanků schopností odpalovat protitankové řízené střely z hlavního kanónu vedle tradičních kinetických penetrátorů můžeme zvýšit jejich schopnost bojovat s nepřátelskými obrněnými vozidly§!" # todo: NEW TRANSLATION
 UKR_smoothbore_atgm_gen2: "Kombat" # todo: NEW TRANSLATION
 UKR_smoothbore_atgm_gen2_desc: "Kombat je ukrajinská protitanková řízená střela s tandemovou hlavicí a účinným dosahem 5 000 m, odpalovaná z 125mm kanónů s hladkým vývrtem. Průbojnost činí 950 mm.\n\n§GTip konstruktéra: Vybavením našich tanků schopností odpalovat protitankové řízené střely z hlavního kanónu vedle tradičních kinetických penetrátorů můžeme zvýšit jejich schopnost bojovat s nepřátelskými obrněnými vozidly§!" # todo: NEW TRANSLATION
 UKR_smoothbore_atgm_gen3: "Konus" # todo: NEW TRANSLATION
 UKR_smoothbore_atgm_gen3_desc: "Konus je ukrajinská protitanková řízená střela s tandemovou hlavicí a účinným dosahem 5 000 m, odpalovaná ze 120mm kanónů s hladkým vývrtem. Byla navržena jako vylepšení pro přizpůsobení standardní ráži tankových kanónů NATO.\n\n§GTip konstruktéra: Vybavením našich tanků schopností odpalovat protitankové řízené střely z hlavního kanónu vedle tradičních kinetických penetrátorů můžeme zvýšit jejich schopnost bojovat s nepřátelskými obrněnými vozidly§!" # todo: NEW TRANSLATION
 UKR_smoke_launchers: "3D6" # todo: NEW TRANSLATION
 UKR_smoke_launchers_desc: "Tucha je 81mm vozidlový granátomet vyvinutý v Sovětském svazu. Používá se především k odpalování kouřových granátů typu 3D6 a 3D6M.\n\n§GTip konstruktéra: Přidání kouřových granátometů snižuje viditelnost našeho tanku a zlepšuje jeho schopnosti v obraně i útoku§!" # todo: NEW TRANSLATION
 UKR_smoke_launchers_2: "3D6M" # todo: NEW TRANSLATION
 UKR_smoke_launchers_2_desc: "Tucha je 81mm vozidlový granátomet vyvinutý v Sovětském svazu. Používá se především k odpalování kouřových granátů typu 3D6 a 3D6M.\n\n§GTip konstruktéra: Přidání kouřových granátometů snižuje viditelnost našeho tanku a zlepšuje jeho schopnosti v obraně i útoku§!" # todo: NEW TRANSLATION
 UKR_smoke_launchers_3: "Varta" # todo: NEW TRANSLATION
 UKR_smoke_launchers_3_desc: "Varta je ukrajinský optoelektronický systém protiopatření, který varuje před zaměřením přesné munice laserovým naváděcím systémem a aktivuje vytvoření kouřové či aerosolové clony kolem tanku. Tento systém aktivní ochrany se používá u tanků T-84U „Oplot“, „BM Oplot“ a T-64E.\n\n§GTip konstruktéra: Přidání kouřových granátometů snižuje viditelnost našeho tanku a zlepšuje jeho schopnosti v obraně i útoku§!" # todo: NEW TRANSLATION
 UKR_hardkill_system_gen1: "Zaslin" # todo: NEW TRANSLATION
 UKR_hardkill_system_gen1_desc: "Zaslin je ukrajinský komplex aktivní ochrany obrněných vozidel. Vyvinul jej státní podnik BCKT Mikrotek ve spolupráci s dalšími ukrajinskými podniky. Komplex je určen k ochraně bojových vozidel před tenkostěnnými protitankovými zbraněmi, zejména protitankovými řízenými střelami a protitankovými granáty, kumulativními prostředky tankových a protitankových kanónů a opeřenými podkaliberními průbojnými projektily.\n\n§GTip konstruktéra: Systém hard-kill představuje dobrý způsob, jak posílit pancíř našich tanků§!" # todo: NEW TRANSLATION
 UKR_afv_machine_gun: "7,62mm SGMT" # todo: NEW TRANSLATION
 UKR_afv_machine_gun_desc: "SG-43/SGMT Goryunov (rusky: Станковый пулемёт системы Горюнова, Stankovyy pulyemyot sistyemy Goryunova, tedy lafetovaný kulomet konstrukce Goryunova) byl sovětský střední kulomet zavedený během druhé světové války. Používal náboj 7,62×54 mmR a v roce 1943 byl zaveden jako náhrada starších kulometů M1910 Maxim." # todo: NEW TRANSLATION
 UKR_afv_machine_gun_2: "14,5mm KPVT" # todo: NEW TRANSLATION
 UKR_afv_machine_gun_2_desc: "Těžký kulomet KPVT je sovětský těžký kulomet ráže 14,5×114 mm. Do služby byl poprvé zaveden jako pěchotní zbraň (označení PKP) v roce 1949. V 60. letech byla pěchotní verze vyřazena z výroby, protože byla příliš velká a těžká. Později se používal v řadě vozidel BTR." # todo: NEW TRANSLATION
 UKR_afv_coax_machine_gun: "7,62 SGMT" # todo: NEW TRANSLATION
 UKR_afv_coax_machine_gun_desc: "SG-43/SGMT Goryunov (rusky: Станковый пулемёт системы Горюнова, Stankovyy pulyemyot sistyemy Goryunova, tedy lafetovaný kulomet konstrukce Goryunova) byl sovětský střední kulomet zavedený během druhé světové války. Používal náboj 7,62×54 mmR a v roce 1943 byl zaveden jako náhrada starších kulometů M1910 Maxim." # todo: NEW TRANSLATION
 UKR_afv_coax_machine_gun_2: "7,62mm PKT" # todo: NEW TRANSLATION
 UKR_afv_coax_autocannon_2: "2A7M" # todo: NEW TRANSLATION
 UKR_afv_coax_autocannon_3: "ZTM-1/2" # todo: NEW TRANSLATION
 UKR_afv_coax_machine_gun_2_desc: "PKT (rusky: Пулемёт Калашникова, přepisováno jako Pulemyot Kalashnikova neboli Kalašnikovův kulomet) je pásový univerzální kulomet používající okrajový náboj 7,62×54 mmR odvozený od kulometu PK/PKM." # todo: NEW TRANSLATION
 UKR_afv_atgm_gen1: "9M14 Malyutka" # todo: NEW TRANSLATION
 UKR_afv_atgm_gen1_desc: "(NATO označení AT-3 Sagger) Jednalo se o první přenosnou protitankovou řízenou střelu Sovětského svazu a pravděpodobně o nejrozšířeněji vyráběný protitankový raketový systém všech dob." # todo: NEW TRANSLATION
 UKR_afv_atgm_gen2: "9M113 Konkurs" # todo: NEW TRANSLATION
 UKR_afv_atgm_gen2_desc: "(NATO označení AT-5 Spandrel) Poloautomaticky naváděná protitanková řízená střela druhé generace vyvinutá jako náhrada starší střely 9M14 Malyutka. Nabízí lepší přesnost, průbojnost a dosah, stala se jedním z nejrozšířenějších protitankových raketových systémů v sovětské armádě a později byla ve velké míře používána Ozbrojenými silami Ukrajiny." # todo: NEW TRANSLATION
 UKR_afv_atgm_gen3: "RK-2 Baryer" # todo: NEW TRANSLATION
 UKR_afv_atgm_gen3_desc: "Ukrajinská laserem naváděná protitanková střela vyvinutá konstrukční kanceláří Luch. Je určena k ničení moderních hlavních bojových tanků vybavených výbušným reaktivním pancířem. Systém Barrier nabízí ve srovnání s předchozími protitankovými střelami sovětské éry vyšší přesnost, větší průbojnost a moderní integraci řízení palby." # todo: NEW TRANSLATION
 UKR_afv_assault_gun: "73mm 2A28 Grom" # todo: NEW TRANSLATION
 UKR_afv_assault_gun_desc: "2A28 Grom, známý také jako KBP 2A28 Grom, je 73mm nízkotlaký poloautomatický kanón s hladkým vývrtem a klínovým závěrem. Vývoj 2A28 Grom přímo souvisel s vývojem bezzákluzového kanónu SPG-9; z obou se odpalovaly projektily podobné raketovým granátům." # todo: NEW TRANSLATION
 UKR_afv_assault_gun_2: "100mm 2A70" # todo: NEW TRANSLATION
 UKR_afv_assault_gun_2_desc: "Kanónomet 2A70 ráže 100 mm (označení GRAU: 2А70) je nízkotlaký drážkovaný kanón navržený v Sovětském svazu konstrukční kanceláří KBP." # todo: NEW TRANSLATION
 UKR_afv_assault_gun_3: "90mm Cockerill Mk 8 LP" # todo: NEW TRANSLATION
 UKR_afv_assault_gun_3_desc: "Cockerill Mk 8 je belgický nízkotlaký tankový kanón ráže 90 mm vyvinutý společností Cockerill pro instalaci na lehká obrněná vozidla a věžové systémy. Používá snížené prachové náplně k omezení zpětného rázu, přičemž zůstává schopen odpalovat různé druhy 90mm munice včetně vysoce výbušných, kouřových a protipancéřových nábojů." # todo: NEW TRANSLATION
 UKR_small_autocannon: "30mm 2A42" # todo: NEW TRANSLATION
 UKR_small_autocannon_desc: "Shipunov 2A42 je sovětský/ruský automatický kanón ráže 30 mm. Vyrábí jej akciová společnost Tulamašzavod a je pojmenován po A. G. Shipunovovi." # todo: NEW TRANSLATION
 UKR_small_autocannon_2: "30mm 2A72" # todo: NEW TRANSLATION
 UKR_small_autocannon_2_desc: "Odlehčená zjednodušená varianta kanónu 2A42 s menším počtem součástí, delší hlavní a vyšší úsťovou rychlostí, ale také s nižší kadencí. Funguje na principu dlouhého zpětného rázu, nikoli odběru prachových plynů." # todo: NEW TRANSLATION
 UKR_small_autocannon_3: "30mm ZTM-1/2" # todo: NEW TRANSLATION
 UKR_small_autocannon_3_desc: "Ukrajinský 30mm automatický kanón odvozený od sovětské konstrukce 2A42 a upravený pro domácí výrobu. Řada 3TM nabízí lepší kvalitu výroby, kompatibilitu s moderními systémy řízení palby a vyšší spolehlivost při zachování nízkého zpětného rázu a nízké hmotnosti svého předchůdce." # todo: NEW TRANSLATION
 UKR_tank_small_medium_cannon: "100 mm D-10T2S" # todo: NEW TRANSLATION
 UKR_tank_small_medium_cannon_desc: "D-10 je sovětský tankový kanón vyvinutý na konci druhé světové války, poprvé instalovaný na stíhači tanků SU-100. Na počátku studené války se tato zbraň stala hlavní výzbrojí tanků řad T-54 a T-55.\n\n§GTip konstruktéra: Kanóny malé ráže jsou kvůli nižší úsťové rychlosti vhodné pro vysoce výbušné náboje. Používejte je, pokud chcete upřednostnit útok proti měkkým cílům před útokem proti tvrdým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_small_medium_cannon_2: "115 mm U-5TS" # todo: NEW TRANSLATION
 UKR_tank_small_medium_cannon_2_desc: "U-5TS je první kanón s hladkým vývrtem vyvinutý pro použití v tancích. Stávající 100mm kanón tanku T-55 byl příliš slabý k boji s novými západními tanky Centurion a M48 Patton. Sověti v reakci na tyto tanky vyvinuli 115mm kanón. Používal se pouze na tanku T-62. Prokázal účinnost i proti modernějším tankům, jak ukázala íránsko-irácká válka, v níž T-62 dokázal vyřadit mnohem novější tanky Chieftain a M60.\n\n§GTip konstruktéra: Kanóny malé ráže jsou kvůli nižší úsťové rychlosti vhodné pro vysoce výbušné náboje. Používejte je, pokud chcete upřednostnit útok proti měkkým cílům před útokem proti tvrdým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_small_medium_cannon_3: "100 mm 2A70" # todo: NEW TRANSLATION
 UKR_tank_small_medium_cannon_3_desc: "2A70 je rychlopalný drážkovaný kanón určený pro lehčí obrněná vozidla. Je určen především k používání vysoce výbušných nábojů. 2A70 je hlavní zbraní řady BMP-3.\n\n§GTip konstruktéra: Kanóny malé ráže jsou kvůli nižší úsťové rychlosti vhodné pro vysoce výbušné náboje. Používejte je, pokud chcete upřednostnit útok proti měkkým cílům před útokem proti tvrdým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_medium_cannon: "125 mm 2A46" # todo: NEW TRANSLATION
 UKR_tank_medium_cannon_desc: "2A46 je nejrozšířenější ze sovětských tankových kanónů. Původně byl vyvinut pro T-64, od té doby se tento kanón používá ve všech sovětských a ruských tancích, stejně jako v mnoha zahraničních tancích.\n\n§GTip konstruktéra: Kanóny střední ráže jsou vyvážené tankové kanóny. Použijte je, pokud nechcete upřednostnit ani útok proti měkkým, ani proti tvrdým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_medium_cannon_2: "125 mm KBA3" # todo: NEW TRANSLATION
 UKR_tank_medium_cannon_2_desc: "KBA3 je 125mm tankový kanón s hladkým vývrtem, ukrajinská adaptace sovětského tankového kanónu 2A46. Byl vyvinut Kyjevskou konstrukční kanceláří dělostřelectva. Výrobce: Starokramatorský strojírenský závod. Kanón je určen k instalaci na hlavní bojové tanky T-80UD, T-84 a BM Oplot, stejně jako k modernizaci T-64.\n\n§GTip konstruktéra: Kanóny střední ráže jsou vyvážené tankové kanóny. Použijte je, pokud nechcete upřednostnit ani útok proti měkkým, ani proti tvrdým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_medium_cannon_3: "120 mm KBM2" # todo: NEW TRANSLATION
 UKR_tank_medium_cannon_3_desc: "KBM2 je 120mm kanón s hladkým vývrtem, používající standardní munici NATO ráže 120 mm. Původně byl vyvinut Kyjevskou konstrukční kanceláří dělostřelectva pro hlavní bojový tank T-84-120 „Yatahan“.\n\n§GTip konstruktéra: Kanóny střední ráže jsou vyvážené tankové kanóny. Použijte je, pokud nechcete upřednostnit ani útok proti měkkým, ani proti tvrdým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_large_cannon: "130 mm M-65 L/60" # todo: NEW TRANSLATION
 UKR_tank_large_cannon_desc: "Experimentální kanón těžkého tanku, který měl být použit v těžkém útočném tanku Object 279 Kotin, odolném proti jadernému výbuchu. S ústupem potřeby těžkých tanků byl projekt zrušen a s ním i tento kanón.\n\n§GTip konstruktéra: Těžké kanóny jsou určeny především k boji proti obrněným cílům. Použijte je, pokud chcete upřednostnit útok proti tvrdým cílům a přitom si zachovat určitý útok proti měkkým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_large_cannon_2: "140 mm 55L Bahira" # todo: NEW TRANSLATION
 UKR_tank_large_cannon_2_desc: "55L Bagira je experimentální kanón, vyvinutý a vyráběný Kyjevskou konstrukční kanceláří dělostřelectva pro vyzbrojení budoucích tanků a modernizaci stávajících tanků. Délka hlavně nového kanónu činí 55 ráží.\n\n§GTip konstruktéra: Těžké kanóny jsou určeny především k boji proti obrněným cílům. Použijte je, pokud chcete upřednostnit útok proti tvrdým cílům a přitom si zachovat určitý útok proti měkkým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_very_large_cannon: "152 mm 2A73" # todo: NEW TRANSLATION
 UKR_tank_very_large_cannon_desc: "Kanón s hladkým vývrtem ráže 152 mm 2A73, vyvinutý konstrukční kanceláří OKB-6 neboli Ústředním výzkumným ústavem Burevestnik, byl určen pro použití v experimentálních tancích Object 477 „Boxer“/„Molot“/„Nota“ a Object 490 „Topol“.\n\n§GTip konstruktéra: Super těžké kanóny jsou určeny k boji proti obrněným cílům. Použijte je, pokud chcete výrazně upřednostnit útok proti tvrdým cílům před útokem proti měkkým cílům§!" # todo: NEW TRANSLATION
 UKR_tank_battlestation_1: "1A33 Ob" # todo: NEW TRANSLATION
 UKR_tank_battlestation_1_desc: "Systém řízení palby 1A33 Ob zahrnoval PDPS 1OP73, tankový balistický počítač 1V517, zaměřovač 1G43, senzory vstupních údajů a komplex 1A34.\n\n§GTip konstruktéra: Bojový systém představuje dělostřelecké systémy, řízení palby, optiku a další pomocné vybavení nezbytné pro provoz tanku. Lepší bojový systém celkově zvýší kvalitu vašeho tanku.§!" # todo: NEW TRANSLATION
 UKR_tank_battlestation_2: "1A43U Ros" # todo: NEW TRANSLATION
 UKR_tank_battlestation_2_desc: "Zaměřovací komplex 1A43U Ros zahrnuje dálkoměrný zaměřovač, naváděcí zařízení 1G46 s elektrickou jednotkou, jednotku povolení výstřelu a tankový balistický kalkulátor 1V528-2.\n\n§GTip konstruktéra: Bojový systém představuje dělostřelecké systémy, řízení palby, optiku a další pomocné vybavení nezbytné pro provoz tanku. Lepší bojový systém celkově zvýší kvalitu vašeho tanku.§!" # todo: NEW TRANSLATION
 UKR_tank_battlestation_2_thermal: "1A45 Irtysh" # todo: NEW TRANSLATION
 UKR_tank_battlestation_3: "Savan-15" # todo: NEW TRANSLATION
 UKR_tank_battlestation_3_desc: "Savan-15 je zaměřovací komplex francouzské výroby, jehož použití bylo navrženo v hlavních bojových tancích ukrajinské výroby z 21. století.\n\n§GTip konstruktéra: Bojový systém představuje dělostřelecké systémy, řízení palby, optiku a další pomocné vybavení nezbytné pro provoz tanku. Lepší bojový systém celkově zvýší kvalitu vašeho tanku.§!" # todo: NEW TRANSLATION
 UKR_tank_aux_engine: "AEA-8" # todo: NEW TRANSLATION
 UKR_tank_aux_engine_desc: "AEA-8 – dieselová pomocná pohonná jednotka s výkonem 8 kW. Zařízení zahrnuje kapalinou chlazený dvouválcový dieselový motor do V a stejnosměrný generátor. APU je určena k zajištění elektřiny pro tank s vypnutým motorem, například když se tank nachází ve stacionárním palebném postavení nebo v záloze.\n\n§GTip konstruktéra: Přidání pomocného motoru bude nejlépe fungovat u motorů s vysokou spotřebou paliva, jako jsou motory s plynovou turbínou§!" # todo: NEW TRANSLATION
 UKR_tank_aux_engine_2: "AEA-10" # todo: NEW TRANSLATION
 UKR_tank_aux_engine_2_desc: "AEA-10 – dieselová pomocná pohonná jednotka s výkonem 10 kW. Zařízení zahrnuje kapalinou chlazený dvouválcový dieselový motor do V a stejnosměrný generátor. APU je určena k zajištění elektřiny pro tank s vypnutým motorem, například když se tank nachází ve stacionárním palebném postavení nebo v záloze.\n\n§GTip konstruktéra: Přidání pomocného motoru bude nejlépe fungovat u motorů s vysokou spotřebou paliva, jako jsou motory s plynovou turbínou§!" # todo: NEW TRANSLATION
