 light_helicopter_armor_gen2_desc: "S vynálezem a integrací kompozitního pancéřování poskytuje pancéřování lehkých vrtulníků nyní dodatečnou ochranu. Reaktivní pancéřové systémy se také začaly používat, poskytující ještě větší ochranu." # todo: NEW TRANSLATION
