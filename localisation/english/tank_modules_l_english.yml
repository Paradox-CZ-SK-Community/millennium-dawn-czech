 mast_mounted_radar: "Radar na stožáru" # todo: NEW TRANSLATION
 mast_mounted_radar_desc: "Kompaktní radar řízení palby umístěný nad rotorovou hlavou, který umožňuje detekci cílů a vedení palby i za krytí. Schopný sledovat více cílů současně a navádět munici řízenou radarem. Zvyšuje situační povědomí a odolnost v náročném terénu." # todo: NEW TRANSLATION
