 medium_tank_aa_chassis_5_desc: "Samohybné prostředky protivzdušné obrany, známé také jako mobilní prostředky protivzdušné obrany, jsou mobilní systémy, které na vojenská vozidla instalují protiletadlové kulomety, protiletadlová děla nebo protiletadlové rakety. Lze je rozdělit na samohybné protiletadlové kanóny, samohybné odpalovače protiletadlových raket a samohybné kombinované raketové a dělostřelecké systémy protivzdušné obrany." # todo: NEW TRANSLATION
