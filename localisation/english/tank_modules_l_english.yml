 laser_guided_ammo_4: "Hyperpokročilá laserem naváděná munice" # todo: NEW TRANSLATION
 laser_guided_ammo_4_desc: "Laserem naváděný granát bude schopen během letu měnit svou dráhu pomocí malých řídicích trysek. To umožní granátu zasáhnout cíl s vyšší přesností." # todo: NEW TRANSLATION
 laser_guided_ammo_5: "Ultrapokročilá laserem naváděná munice" # todo: NEW TRANSLATION
