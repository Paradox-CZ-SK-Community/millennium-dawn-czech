 big_autocannon: "Rané studené války těžká autocannon" # todo: NEW TRANSLATION
 big_autocannon_desc: "Autocannon velkého kalibru, 35–60 mm, zaměřené na zničení jakéhokoli lehkého obrněného vozidla v dohledu." # todo: NEW TRANSLATION
 big_autocannon_2: "Pozdní studená válka těžká autocannon" # todo: NEW TRANSLATION
 big_autocannon_2_desc: "S novými projektily APFSDS, tato kanóna není žertík." # todo: NEW TRANSLATION
 big_autocannon_3: "Moderní těžká autocannon" # todo: NEW TRANSLATION
