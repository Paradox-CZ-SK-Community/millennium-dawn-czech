 super_heavy_tank_chassis_0: "Korba středního chodce 1. generace" # todo: NEW TRANSLATION
 super_heavy_tank_chassis_0_desc: "Korby středních chodců označují korby obrněných bojových vozidel, které místo konvenčního pásového nebo kolového podvozku využívají dvounohý či vícenohý pohybový systém. Obvykle kombinují zesílenou obrněnou kapsli, výkonný motor nebo generátor a kloubové pohonné sestavy, které umožňují pohyb přes sutiny, strmé svahy, měkkou půdu a další terén, jenž může omezovat tradiční obrněná vozidla." # todo: NEW TRANSLATION
