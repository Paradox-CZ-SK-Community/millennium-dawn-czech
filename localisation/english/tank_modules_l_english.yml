 medium_tank_aa_chassis_0: "1st Generation Self Propelled Anti-Air Hull" # todo: NEW TRANSLATION
 medium_tank_aa_chassis_0_desc: "Samohybná protiletecká obrana, známá také jako mobilní protivzdušná obrana, odkazuje na mobilní protivzdušné zbraně instalující na vojenská vozidla protiletecké kulomety, protiletadlové zbraně nebo řízené střely. Dělí se na samohybná protiletecká děla, samohybná raketová odpalovací zařízení a samohybná kombinovaná protiletadlová systém." # todo: NEW TRANSLATION
