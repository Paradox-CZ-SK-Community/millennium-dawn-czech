 super_heavy_tank_destroyer_chassis_0: "Korba lehkého chodce 1. generace" # todo: NEW TRANSLATION
 super_heavy_tank_destroyer_chassis_0_desc: "Korby lehkých chodců označují kompaktní dvounohé obrněné korby navržené pro vysokou pohyblivost a rychlé přemisťování v rozbitém terénu. Jsou rychlejší než korby středních chodců, ale jejich nižší nosnost je omezuje na lehčí zbraně a vybavení." # todo: NEW TRANSLATION
 super_heavy_tank_destroyer_chassis_1: "Korba lehkého chodce 2. generace" # todo: NEW TRANSLATION
 super_heavy_tank_destroyer_chassis_1_desc: "Korby lehkých chodců označují kompaktní dvounohé obrněné korby navržené pro vysokou pohyblivost a rychlé přemisťování v rozbitém terénu. Jsou rychlejší než korby středních chodců, ale jejich nižší nosnost je omezuje na lehčí zbraně a vybavení." # todo: NEW TRANSLATION
 super_heavy_tank_destroyer_chassis_2: "Korba lehkého chodce 3. generace" # todo: NEW TRANSLATION
 super_heavy_tank_destroyer_chassis_2_desc: "Korby lehkých chodců označují kompaktní dvounohé obrněné korby navržené pro vysokou pohyblivost a rychlé přemisťování v rozbitém terénu. Jsou rychlejší než korby středních chodců, ale jejich nižší nosnost je omezuje na lehčí zbraně a vybavení." # todo: NEW TRANSLATION
 tech_tank_walker_chassis_1: "Podvozek tankového chodce II" # todo: NEW TRANSLATION
 tech_tank_walker_chassis_1_desc: "Rané podvozky chodců nahrazují pásy poháněnými nohami a vyměňují prostou konstrukci za přístup do náročného terénu a pohyblivost v sutinách, lesích a rozbitém terénu. Dokážou překračovat překážky, které by konvenční obrněná vozidla zastavily, ale kvůli pohonům, senzorům a složitým systémům rovnováhy výrazně rostou nároky na údržbu i náklady." # todo: NEW TRANSLATION
 tech_tank_walker_chassis_2: "Podvozek tankového chodce III" # todo: NEW TRANSLATION
 tech_tank_walker_chassis_2_desc: "Podvozky chodců druhé generace zlepšují stabilitu, nosnost a odolnost proti poškození díky lepšímu řídicímu softwaru a zesílené konstrukci kloubů. Díky silnějším pohonným jednotkám a chytřejšímu řízení odpružení se chodci stávají použitelnými těžkými platformami pro městské útoky a extrémní terén, přesto zůstávají jejich nasazení ve velkém měřítku drahé a náročné na zdroje." # todo: NEW TRANSLATION
 tank_drones: "Podporující dron" # todo: NEW TRANSLATION
 tank_drones_desc: "Věž tanku může být vybavena stanicí pro ovládání dronu. Dron lze použít k průzkumu okolního bojiště, získání cílů a sledování účinnosti palby.\n\n§GTip návrháře: Vybavení našich tanků drony zlepší jejich schopnost ničit nepřátele§!" # todo: NEW TRANSLATION
 tank_drones_2: "Vylepšený podpůrný dron" # todo: NEW TRANSLATION
 tank_drones_2_desc: "Vylepšený podpůrný dron bude schopen nejen mapovat bojiště, ale i řídit palbu, zaměřovat cíle pro řízené projektily a dokonce bránit proti přicházejícím projektilům.\n\n§GTip návrháře: Vybavení našich tanků drony zlepší jejich schopnost ničit nepřátele§!" # todo: NEW TRANSLATION
 afv_machine_gun: "HMG po druhé světové válce" # todo: NEW TRANSLATION
 afv_machine_gun_desc: "Mírně upravená verze staré spolehlivé zbraně z druhé světové války. Nyní slouží jako podpůrná zbraň na obrněném taxi." # todo: NEW TRANSLATION
 afv_machine_gun_2: "HMG studené války" # todo: NEW TRANSLATION
 afv_machine_gun_2_desc: "Po skončení druhé světové války došlo k určitým návrhovým změnám u HMG velkými státy: lepší ovladatelnost, přesnost atd." # todo: NEW TRANSLATION
 afv_machine_gun_3: "Moderní HMG" # todo: NEW TRANSLATION
 afv_machine_gun_3_desc: "Rozpad Sovětského svazu umožnil některým zemím zaměřit se na kvalitu, ne kvantitu - to je to, o čem tato nová generace je." # todo: NEW TRANSLATION
 afv_machine_gun_4: "Budoucí HMG" # todo: NEW TRANSLATION
 afv_machine_gun_4_desc: "Plastové pláště, sledovací technologie. HMG jsou dnes smrtelnější než kdy dřív." # todo: NEW TRANSLATION
 afv_assault_gun: "Útočný kanón z raného období studené války" # todo: CHANGED
 afv_assault_gun_desc: "Dělostřelectvo vyzbrojené lehkými tanky bývá obvykle nízkorychlostný kanón, který dosahuje velké palebné síly na úkor nízkého zpětného rázu." # todo: NEW TRANSLATION
 afv_assault_gun_2: "Pozdní studená válka útočná kanóna" # todo: NEW TRANSLATION
 afv_assault_gun_2_desc: "Vylepšená balistika, lepší FRAG projektily oproti návrhům po druhé světové válce." # todo: NEW TRANSLATION
 afv_assault_gun_3: "Moderní útočná kanóna" # todo: NEW TRANSLATION
 afv_assault_gun_3_desc: "To nejlepší, co moderní armáda nabízí - chytré projektily, výbuch ve vzduchu." # todo: NEW TRANSLATION
 afv_assault_gun_4: "Budoucí útočná kanóna" # todo: NEW TRANSLATION
 afv_assault_gun_4_desc: "Shlukové údery, pokročilé průlomy bunkrů, existuje jen málo, co tato kanóna nedokáže - možná jen tanky zůstanou v bezpečí." # todo: NEW TRANSLATION
 afv_assault_gun_5: "Hyperpokročilý útočný kanón" # todo: NEW TRANSLATION
 afv_assault_gun_5_desc: "Naváděná munice s programovatelným zapalovačem a autonomním sledováním cílů zajišťuje, že každý náboj zasáhne, a to i proti rychle se pohybujícím nebo skrytým cílům." # todo: NEW TRANSLATION
 afv_assault_gun_6: "Ultrapokročilý útočný kanón" # todo: NEW TRANSLATION
 afv_assault_gun_6_desc: "Technologie asistence směrovanou energií a hyperrychlého hnacího náboje zvyšují úsťovou rychlost a průbojnost nad možnosti konvenční balistiky. Před ním není bezpečný žádný pancíř kromě pancíře hlavního bojového tanku." # todo: NEW TRANSLATION
 small_autocannon: "Raná studená válka autocannon" # todo: NEW TRANSLATION
 small_autocannon_desc: "S kalibrem 20-30 mm, obvykle jen modifikovaný WW2 protiletadlový kanón. Dělá svou práci dobře." # todo: NEW TRANSLATION
 small_autocannon_2: "Pozdní studená válka autocannon" # todo: NEW TRANSLATION
 small_autocannon_2_desc: "Speciálně určený autocannon zaměřený na zničení pěchoty i kovu." # todo: NEW TRANSLATION
 small_autocannon_3: "Moderní autocannon" # todo: NEW TRANSLATION
 small_autocannon_3_desc: "Nejnovější vývoj, munice s výbuchem ve vzduchu, programovatelné projektily." # todo: NEW TRANSLATION
 small_autocannon_4: "Budoucí autocannon" # todo: NEW TRANSLATION
 small_autocannon_4_desc: "Špičkové autocannon na nejvyšší úrovni, nic nezůstane." # todo: NEW TRANSLATION
 small_autocannon_5: "Hyperpokročilý automatický kanón" # todo: NEW TRANSLATION
 small_autocannon_5_desc: "Automatický kanón na nejmodernější úrovni, který za sebou nic nenechá." # todo: NEW TRANSLATION
 small_autocannon_6: "Ultrapokročilý automatický kanón" # todo: NEW TRANSLATION
