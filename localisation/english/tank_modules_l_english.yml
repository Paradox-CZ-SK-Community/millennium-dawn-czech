 EQ_MOD_CAT_spaa_naval_cannon_systems_TITLE: "Námořní kanóny" # todo: NEW TRANSLATION
 spaa_naval_cannon_1: "Námořní kanón po druhé světové válce" # todo: NEW TRANSLATION
 spaa_naval_cannon_1_desc: "Se svým impozantním kalibrem pro svou dobu nabízí tento námořní kanón nepřekonatelné ničení měkkých cílů. Jeho ohromná síla z něj dělá impozantní součástku, i když mobilita a účinnost jdou ruku v ruce s cenou." # todo: NEW TRANSLATION
 spaa_naval_cannon_2: "Námořní kanón studené války" # todo: NEW TRANSLATION
 spaa_naval_cannon_2_desc: "Vylepšené projektily a pohonné mechanismy zvyšují palebnou sílu kanónu. Přesto si zachovává významný potenciál proti vzdušným hrozbám a zůstává robustní volbou díky své surové síle." # todo: NEW TRANSLATION
 spaa_naval_cannon_3: "Moderní námořní kanón" # todo: NEW TRANSLATION
 spaa_naval_cannon_3_desc: "Zahrnuje poloautomatické nabíjení a pokročilé typy munice; tato generace zvyšuje kadenci a dále posiluje její dominanci ve střetech proti měkkým cílům." # todo: NEW TRANSLATION
 spaa_naval_cannon_4: "Pokročilý námořní kanón" # todo: NEW TRANSLATION
 spaa_naval_cannon_4_desc: "Využívá řízené střely; tento kanón poskytuje bezprecedentní přesnost a upevňuje svou pozici jako síla v obranné vzdušné obraně." # todo: NEW TRANSLATION
 spaa_naval_cannon_5: "Futuristický námořní kanón" # todo: NEW TRANSLATION
 spaa_naval_cannon_5_desc: "Využívá nejmodernější materiály a optimalizované návrhy munice; tento kanón zajišťuje ještě větší ničení měkkých cílů s lepší účinností." # todo: NEW TRANSLATION
 spaa_naval_cannon_6: "Hyperpokročilý námořní kanón" # todo: NEW TRANSLATION
 spaa_naval_cannon_6_desc: "Tento kanón využívá nejmodernější materiály a optimalizované konstrukce munice, čímž zajišťuje ještě účinnější ničení měkkých cílů při vyšší efektivitě." # todo: NEW TRANSLATION
 spaa_naval_cannon_7: "Ultrapokročilý námořní kanón" # todo: NEW TRANSLATION
 spaa_naval_cannon_7_desc: "Tento kanón využívá nejmodernější materiály a optimalizované konstrukce munice, čímž zajišťuje ještě účinnější ničení měkkých cílů při vyšší efektivitě." # todo: NEW TRANSLATION
 EQ_MOD_CAT_spaa_light_autocannon_systems_TITLE: "§RSPAA§!\nLehký autocanon" # todo: NEW TRANSLATION
 spaa_light_autocannon1: "Lehký autocanon po druhé světové válce" # todo: NEW TRANSLATION
 spaa_light_autocannon1_desc: "Zjednodušená a lehká konstrukce, tento autocanon klade důraz na rychlou reakci a mobilitu a poskytuje klíčové letecké krytí v proměnlivých bojových situacích." # todo: NEW TRANSLATION
 spaa_light_autocannon2: "Lehký autocanon studené války" # todo: NEW TRANSLATION
 spaa_light_autocannon2_desc: "Vyvinuté materiály a optimalizované spouštěcí mechanismy zvyšují účinnost kanónu a posilují jeho postavení jako agilního obránce na dynamických bojových polích." # todo: NEW TRANSLATION
 spaa_light_autocannon3: "Moderní lehký autocanon" # todo: NEW TRANSLATION
 spaa_light_autocannon3_desc: "Disponuje projektily vysoké rychlosti; verze zajišťuje rychlé souboje a činí z ní špičkovou volbu pro rychlou neutralizaci rychlých vzdušných hrozeb." # todo: NEW TRANSLATION
 spaa_light_autocannon4: "Pokročilý lehký autocanon" # todo: NEW TRANSLATION
 spaa_light_autocannon4_desc: "Pokročilé slitiny a vyšší cyklická frekvence posilují její postavení jako průkopníka v rychlých a efektivních vzdušných střetech." # todo: NEW TRANSLATION
 spaa_light_autocannon5: "Futuristický lehký autocanon" # todo: NEW TRANSLATION
 spaa_light_autocannon5_desc: "Využívá nejmodernější výrobní techniky; tento kanón představuje špičku rychlosti a efektivity a stanovuje měřítko v systémech rychlého zásahu." # todo: NEW TRANSLATION
 spaa_light_autocannon6: "Hyperpokročilý lehký automatický kanón" # todo: NEW TRANSLATION
 spaa_light_autocannon6_desc: "Díky využití nejmodernějších výrobních postupů nabízí tento kanón vrchol rychlosti a efektivity a stanovuje měřítko pro systémy rychlé reakce." # todo: NEW TRANSLATION
