 mine_ammo_4: "Hyperpokročilá minovací raketa" # todo: NEW TRANSLATION
 mine_ammo_4_desc: "Podobně jako kazetová raketa se minovací raketa rozpadne na menší části a zaplní cílovou oblast protipěchotními nebo protivozidlovými minami." # todo: NEW TRANSLATION
 mine_ammo_5: "Ultrapokročilá minovací raketa" # todo: NEW TRANSLATION
 mine_ammo_5_desc: "Podobně jako kazetová raketa se minovací raketa rozpadne na menší části a zaplní cílovou oblast protipěchotními nebo protivozidlovými minami." # todo: NEW TRANSLATION
 heat_ammo_1: "Raná HEAT munice" # todo: NEW TRANSLATION
 heat_ammo_1_desc: "HEAT (High Explosive Anti-Tank) náboje jsou specializovaným typem munice určeným k likvidaci nepřátelské obrně. Při zásahu projektilu exploze vyšle kovový proud, který prorazí nepřátelskou obrně. To má pochopitelně malou účinnost proti pěchotě, pokud nedojde k přímému zásahu." # todo: NEW TRANSLATION
 heat_ammo_2: "Vylepšená HEAT munice" # todo: NEW TRANSLATION
 heat_ammo_2_desc: "HEAT (High Explosive Anti-Tank) náboje jsou specializovaným typem munice určeným k likvidaci nepřátelské obrně. Při zásahu projektilu exploze vyšle kovový proud, který prorazí nepřátelskou obrně. To má pochopitelně malou účinnost proti pěchotě, pokud nedojde k přímému zásahu." # todo: NEW TRANSLATION
