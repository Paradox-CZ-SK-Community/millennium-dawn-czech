 afv_composite_armor_gen4: "Pokročilý lehký kompozitní pancíř" # todo: NEW TRANSLATION
 afv_composite_armor_gen4_desc: "S ekvivalentem RHA měřeným v metrech, toto je nejúčinnější pancíř." # todo: NEW TRANSLATION
 afv_composite_armor_gen5: "Hyperpokročilý lehký kompozitní pancíř" # todo: NEW TRANSLATION
 afv_composite_armor_gen5_desc: "Reaktivní kompozity s nanovrstvami přizpůsobují při nárazu svou strukturu a rozptylují kinetickou energii mnohem účinněji než statické pláty. Poskytují ochranu srovnatelnou s pancířem raných generací tanků při zlomku hmotnosti." # todo: NEW TRANSLATION
 afv_composite_armor_gen6: "Ultrapokročilý lehký kompozitní pancíř" # todo: NEW TRANSLATION
 afv_composite_armor_gen6_desc: "Elektromagneticky zpevněné chytré kompozity se samoopravnými matricovými vrstvami představují vrchol ochrany obrněných vozidel. Pancíř dynamicky rozděluje namáhání po celém trupu a odolává zásahům, které by znehybnily dřívější konstrukce." # todo: NEW TRANSLATION
