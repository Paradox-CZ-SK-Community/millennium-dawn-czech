 medium_tank_aa_chassis_3: "4. generace samohybný protiletecký trup" # todo: NEW TRANSLATION
 medium_tank_aa_chassis_3_desc: "Samohybná protiletecká obranná zařízení, známá také jako mobilní protiletadlová obranná zařízení, odkazují na mobilní protiletadlové zbraně, které na vojenských vozidlech instalují protiletadlové kulomety, protiletadlové kanóny nebo řízené střely vzduch-zem. Mohou být rozděleny na samohybná protiletadlová děla (samohybná protiletadlová děla), samohybná protiletadlová raketová odpalovací zařízení a samohybná kombinovaná raketovo-dělostřelecká protiletadlová obranná zařízení." # todo: NEW TRANSLATION
