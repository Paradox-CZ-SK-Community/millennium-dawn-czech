 heat_ammo_4: "Hyperpokročilá kumulativní munice" # todo: NEW TRANSLATION
 heat_ammo_4_desc: "Kumulativní granáty HEAT jsou specializovaným typem munice určeným ke zničení nepřátelského pancíře. Při zásahu cíle výbuch vyšle proud kovu, který pronikne nepřátelským pancířem. Proti pěchotě jsou proto jen málo účinné, pokud nedojde k přímému zásahu." # todo: NEW TRANSLATION
 heat_ammo_5: "Ultrapokročilá kumulativní munice" # todo: NEW TRANSLATION
 heat_ammo_5_desc: "Kumulativní granáty HEAT jsou specializovaným typem munice určeným ke zničení nepřátelského pancíře. Při zásahu cíle výbuch vyšle proud kovu, který pronikne nepřátelským pancířem. Proti pěchotě jsou proto jen málo účinné, pokud nedojde k přímému zásahu." # todo: NEW TRANSLATION
 cluster_ammo_1: "Raná klastrová munice" # todo: NEW TRANSLATION
 cluster_ammo_1_desc: "Namísto jedné velké nálože nesou klastr projektily několik menších bomb. Jak projektil dorazí na cíl, menší bomby se uvolní. Tím oblast zasáhnou klastrové výbuchy několika menších namísto jednoho velkého." # todo: NEW TRANSLATION
 cluster_ammo_2: "Vylepšená klastrová munice" # todo: NEW TRANSLATION
 cluster_ammo_2_desc: "Namísto jedné velké nálože nesou klastr projektily několik menších bomb. Jak projektil dorazí na cíl, menší bomby se uvolní. Tím oblast zasáhnou klastrové výbuchy několika menších namísto jednoho velkého." # todo: NEW TRANSLATION
 cluster_ammo_3: "Pokročilá klastrová munice" # todo: NEW TRANSLATION
 cluster_ammo_3_desc: "Namísto jedné velké nálože nesou klastr projektily několik menších bomb. Jak projektil dorazí na cíl, menší bomby se uvolní. Tím oblast zasáhnou klastrové výbuchy několika menších namísto jednoho velkého." # todo: NEW TRANSLATION
 cluster_ammo_4: "Hyperpokročilá kazetová munice" # todo: NEW TRANSLATION
 cluster_ammo_4_desc: "Namísto jedné velké bojové náplně nesou kazetové granáty několik menších bomb. Jakmile se granát přiblíží k cíli, menší bomby se uvolní. Oblast tak zasypou množstvím menších explozí namísto jediné velké." # todo: NEW TRANSLATION
 cluster_ammo_5: "Ultrapokročilá kazetová munice" # todo: NEW TRANSLATION
 cluster_ammo_5_desc: "Namísto jedné velké bojové náplně nesou kazetové granáty několik menších bomb. Jakmile se granát přiblíží k cíli, menší bomby se uvolní. Oblast tak zasypou množstvím menších explozí namísto jediné velké." # todo: NEW TRANSLATION
 laser_guided_ammo_1: "Raná laserem řízená munice" # todo: NEW TRANSLATION
 laser_guided_ammo_1_desc: "Laserem řízená střela bude moci změnit svou dráhu během letu pomocí malých řídicích trysek. To umožňuje střele zasáhnout cíl s vyšší přesností." # todo: NEW TRANSLATION
 laser_guided_ammo_2: "Vylepšená laserem řízená munice" # todo: NEW TRANSLATION
