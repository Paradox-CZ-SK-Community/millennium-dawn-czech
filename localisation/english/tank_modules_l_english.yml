 medium_tank_artillery_chassis_0: "1st Generation Self Propelled Artillery Hull" # todo: NEW TRANSLATION
 medium_tank_artillery_chassis_0_desc: "Samohybná dělostřelecká výzbroj odkazuje na zbraň instalovanou na vozidle, kdy využívá podvozek vozidla k vlastní produkci pohonu a nevyžaduje tažení jinými vozidly. Většina z nich je chráněna lehkým pancířem. Dělostřelba bývá tvořena houfnicemi, minomety, kanóny, protitankovými děly, raketomety nebo protiletadlovými zbraněmi." # todo: NEW TRANSLATION
