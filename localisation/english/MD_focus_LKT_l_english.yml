l_english:
 Republic_of_Lakota_focus: "Zaměřovací strom Republiky Lakoty" # todo: NEW TRANSLATION
 LKT_focus_a_capital_conundrum: "Hlavolam hlavního města" # todo: NEW TRANSLATION
 LKT_focus_a_capital_conundrum_desc: "S omezenými hranicemi, které drží pohromadě to, čemu říkáme národ, musíme najít základnu, kterou bychom mohli nazvat hlavním městem našeho národa. Díváme se na sever a doufáme v řešení." # todo: NEW TRANSLATION
 LKT_focus_montana_monster: "Montanské monstrum" # todo: NEW TRANSLATION
 LKT_focus_montana_monster_desc: "Obnova konečně začala. Náš národ musí být schopen uživit sám sebe, než vůbec začneme přemýšlet o čemkoli jiném. Zemědělství proto bude v těchto raných dnech prioritou." # todo: NEW TRANSLATION
 LKT_focus_montana_marvel: "Montanský zázrak" # todo: NEW TRANSLATION
 LKT_focus_montana_marvel_desc: "Od hadrů k bohatství, nebo alespoň od prázdných žaludků k plným. Nyní můžeme začít zavádět naše civilní a obecní služby, abychom pomohli stabilizovat společnost ve státě a přinesli do těchto zemí nový mír." # todo: NEW TRANSLATION
 LKT_focus_northern_troubles: "Severní potíže" # todo: NEW TRANSLATION
 LKT_focus_northern_troubles_desc: "Dakoty jsou stejně jako většina našeho národa velmi řídce osídlené a navzdory počtu obyvatel některých států nejsou příliš rozvinuté. Přesto musíme upevnit naše severní pohraniční oblasti, než se je pokusí oportunisté zabrat. Nemluvě o tom, že každý, kdo se pokusí odejít, bude pro náš národ také velkou ztrátou. Prozatím se pokusme alespoň nějak nastartovat ekonomiku." # todo: NEW TRANSLATION
 LKT_focus_our_northern_light: "Naše severní světlo" # todo: NEW TRANSLATION
 LKT_focus_our_northern_light_desc: "S návratem hospodářské a počínající společenské stability do Severní Dakoty můžeme nyní začít rozšiřovat místní pohotovostní a civilní služby. Díky tomu můžeme rozšířit rozsah kontroly v rámci našeho mladého národa." # todo: NEW TRANSLATION
 LKT_focus_yellowstone_yelling: "Yellowstonské volání" # todo: NEW TRANSLATION
 LKT_focus_yellowstone_yelling_desc: "Země volají, protože všude vládne chaos a nebezpečí. Musíme zahájit iniciativu, která do těchto oblastí vrátí klid a mír. Ve státě sice nežije mnoho lidí, ale právě proto je zde ještě méně rozvoje a obecně méně věcí, se kterými lze pracovat. Lidé však musí něco dostat a my jim dáme jídlo do žaludků." # todo: NEW TRANSLATION
 LKT_focus_worland_wonder: "Worlandský zázrak" # todo: NEW TRANSLATION
 LKT_focus_worland_wonder_desc: "Konečně se podařilo obnovit zdání míru a s ním lze obnovit civilní služby a další obecní vybavenost, což přinese společenskou soudržnost do dalších částí našeho národa. Brzy si budeme moci skutečně užívat místo, které můžeme nazývat domovem." # todo: NEW TRANSLATION
 LKT_focus_southern_turmoil: "Jižní rozvrat" # todo: NEW TRANSLATION
 LKT_focus_southern_turmoil_desc: "Bubliny, bubliny, práce a potíže, mícháme kotel všeho, co nás trápí. Z hlubin zoufalství vynášíme na povrch něco, co můžeme očistit a opravit. S ekonomikou a jídlem na stole budeme vyprávět příběhy, které kdysi bývaly bajkami a nyní nás sužují. Nyní kráčíme vpřed, abychom udali tempo, protože nás náš lid v těchto osudových těžkých časech potřebuje." # todo: NEW TRANSLATION
 LKT_focus_rapid_city_revival: "Obroda Rapid City" # todo: NEW TRANSLATION
 LKT_focus_rapid_city_revival_desc: "Pevnou rukou uzavíráme mír, aby se lidé těchto zemí mohli najíst... dobře, těch mizerných rýmů už bylo dost. Vybudovali jste nějakou ekonomiku, nyní začněte zavádět vládní správu a civilní služby, abyste obnovili společenskou soudržnost a získali zpět solidaritu další části svého národa." # todo: NEW TRANSLATION
 LKT_focus_industry_what_industry: "Průmysl, jaký průmysl?" # todo: NEW TRANSLATION
 LKT_focus_industry_what_industry_desc: "Navzdory tomu, co by mnozí rádi tvrdili, máme ve skutečnosti určitou průmyslovou sílu... možná není velká, ale přesto je to něco. To nám alespoň pomůže stabilizovat a celkově diverzifikovat naši ekonomickou strukturu." # todo: NEW TRANSLATION
 LKT_focus_nebraska_neck_breaker: "Nebraska lámající krky" # todo: NEW TRANSLATION
 LKT_focus_nebraska_neck_breaker_desc: "Když je celý národ zraněný, musíme pracovat na zacelení jeho ran. Obnovení určitého ekonomického základu proto umožní lidem znovu se spojit a obnovit společnost, jak ji známe." # todo: NEW TRANSLATION
 LKT_focus_from_broken_bow_to_fixed: "Od Broken Bow k nápravě" # todo: NEW TRANSLATION
 LKT_focus_from_broken_bow_to_fixed_desc: "Rány se hojí, ale jizvy zůstávají. Úplné uzdravení a odchod od minulosti potrvá, ale zvládneme to, kousek po kousku." # todo: NEW TRANSLATION
 LKT_focus_kansas_city_catastrophe: "Katastrofa Kansas City" # todo: NEW TRANSLATION
 LKT_focus_kansas_city_catastrophe_desc: "Kansas City v Kansasu, to je tedy místo — plné lidí, věcí, které lze dělat, a věcí, které lze vytrhnout z kontextu a dělat si z nich legraci. To se však dá říct o mnoha věcech. Přesto byla zažehnuta jiskra a město vzplálo něčím víc než jen posměšky a jásotem. Nyní musíme obnovit to, co bylo ztraceno, a vydat se novou cestou obnovy." # todo: NEW TRANSLATION
 LKT_focus_the_kansas_city_kitty: "Kočička z Kansas City" # todo: NEW TRANSLATION
 LKT_focus_the_kansas_city_kitty_desc: "Teď, když ekonomika alespoň existuje, se můžeme vrátit do starých kolejí. Slyšel jsem, že klub na hlavní třídě je otevřený, a tak můžeme protančit noc jako za starých dobrých časů." # todo: NEW TRANSLATION
 LKT_focus_the_new_republic: "Nová republika" # todo: NEW TRANSLATION
 LKT_focus_the_new_republic_desc: "Z popela starého povstává nové. Nyní se vydáváme objevovat nejen sami sebe, ale i budoucnost, kterou si přejeme vytvořit." # todo: NEW TRANSLATION
 LKT_focus_new_elections_begin: "Začínají nové volby" # todo: NEW TRANSLATION
 LKT_focus_new_elections_begin_desc: "Nyní je čas položit základy naší politiky. Uspořádáním prvních celostátních voleb připravíme půdu pro to, aby si naši lidé udělali vlastní závěry a převzali kontrolu nad osudem, po kterém touží." # todo: NEW TRANSLATION
 LKT_focus_the_councils_of_authority: "Rady autority" # todo: NEW TRANSLATION
 LKT_focus_the_councils_of_authority_desc: "Ve zvláštním zvratu osudu se zdá, že ve volbách zvítězila jedna z mnoha, téměř „oligarchických“ stran. Skutečnou otázkou nyní je, co mají tyto strany pro národ v plánu. Chci říct, samotný pojem oligarchie působí tak hrozivě, že to jistě nevěstí nic dobrého. Na co lidé vůbec mysleli?" # todo: NEW TRANSLATION
 LKT_focus_DDP_political_plan: "Politický plán Dakotské demokratické strany" # todo: NEW TRANSLATION
 LKT_focus_DDP_political_plan_desc: "Po skončení prvních voleb se zdá, že vítězství získala Dakotská demokratická strana. Nyní plánuje prosadit své politiky a pomoci utvářet národ i jeho obyvatele v těchto raných a nejistých dnech." # todo: NEW TRANSLATION
 LKT_focus_skill_assessment_fairs: "Veletrhy hodnocení dovedností" # todo: NEW TRANSLATION
 LKT_focus_skill_assessment_fairs_desc: "SAF jsou federálně podporované akce určené k rozvoji dovedností obyvatel a k tomu, aby se s nimi seznámili ve všech oborech. To nám umožní pomoci zaměstnat jednotlivce a zároveň lépe poznat, jakými talenty náš národ disponuje." # todo: NEW TRANSLATION
 LKT_focus_light_industry_investment: "Investice do lehkého průmyslu" # todo: NEW TRANSLATION
 LKT_focus_light_industry_investment_desc: "Zavedení omezeného, ale smysluplného průmyslu v našem národě přinese nové dovednosti a pracovní příležitosti. Možná toho nebude mnoho, ale jak se říká, je to poctivá práce." # todo: NEW TRANSLATION
 LKT_focus_business_taxes_redraft: "Přepracování podnikových daní" # todo: NEW TRANSLATION
 LKT_focus_business_taxes_redraft_desc: "Dokončením počátečního přepracování daní pro jednotlivé podniky stanovíme nový základ, na němž lze skutečně provádět naši daňovou politiku. Naše ekonomika sice nemá mnoho konkrétních rysů, ale přehnané zatížení podniků plošnými korporátními daněmi by nepochybně mělo negativní dopad na naše příjmy." # todo: NEW TRANSLATION
 LKT_focus_education_streamlining: "Zefektivnění vzdělávání" # todo: NEW TRANSLATION
 LKT_focus_education_streamlining_desc: "Zjednodušení osnov na základy, které mohou studenti využívat v každodenním životě, nám umožní zaměřit se na lepší řízení tříd i na budoucí reformu osnov." # todo: NEW TRANSLATION
 LKT_focus_basic_arms_industry_investment: "Investice do základního zbrojního průmyslu" # todo: NEW TRANSLATION
 LKT_focus_basic_arms_industry_investment_desc: "Náš národ je řídce osídlený a nerozvinutý. Mnozí nás budou považovat za snadný cíl, a přestože jím nechceme být, musíme pro své rané militaristické ambice vytvořit důvod. Položíme proto základy místní výroby zbraní na podporu lovu a údržbu výzbroje našich stálých vojenských sil." # todo: NEW TRANSLATION
 LKT_focus_extensive_geological_surveys: "Rozsáhlé geologické průzkumy" # todo: NEW TRANSLATION
 LKT_focus_extensive_geological_surveys_desc: "Rozsáhlým výzkumem a průzkumem území s domnělými „ložisky nízké hodnoty“ můžeme začít hledat způsoby, jak tato zdánlivě nepatrná naleziště zdrojů proměnit v něco významného. Zpočátku to bude nákladné, ale dlouhodobé přínosy a zajištění naší národní nezávislosti za tu cenu rozhodně stojí." # todo: NEW TRANSLATION
 LKT_focus_KCK_political_plan: "Politický plán KCK" # todo: NEW TRANSLATION
 LKT_focus_KCK_political_plan_desc: "Koalice Kansas City je sdružením podnikatelů a politických představitelů, kteří chtějí dostat národ co nejrychleji rozumným způsobem na správnou cestu. Proto se zaměřují především na hospodářskou stabilitu a správu obyvatelstva kvůli „Velkému kolapsu“." # todo: NEW TRANSLATION
 LKT_focus_zoning_reforms: "Reforma územního plánování" # todo: NEW TRANSLATION
 LKT_focus_zoning_reforms_desc: "Flexibilnější a odlišnější přístup k tradičním formám územního plánování by měl našim městům a obcím umožnit lépe se přizpůsobit potřebám občanů i ekonomiky jako celku." # todo: NEW TRANSLATION
 LKT_focus_integrated_health_plans: "Integrované zdravotní plány" # todo: NEW TRANSLATION
 LKT_focus_integrated_health_plans_desc: "Začlenění povinných zdravotních plánů poskytovaných podniky umožní flexibilnější nábor a zároveň sladí potřeby zaměstnanců s požadavky pracovního prostředí." # todo: NEW TRANSLATION
 LKT_focus_regulatory_cutbacks: "Omezení regulací" # todo: NEW TRANSLATION
 LKT_focus_regulatory_cutbacks_desc: "Odstranění mnoha zdlouhavých a kontraproduktivních regulací umožní podnikům lépe podporovat národ i lidi, které zaměstnávají." # todo: NEW TRANSLATION
 LKT_focus_metallic_bloodlines_act: "Zákon o kovových žilách" # todo: NEW TRANSLATION
 LKT_focus_metallic_bloodlines_act_desc: "MBA je finanční balíček určený k nastartování a zajištění domácí dodávky železa a oceli. Ocel je vedle pracovní síly a betonu druhým pilířem života ekonomiky." # todo: NEW TRANSLATION
 LKT_focus_national_employment_commission: "Národní komise pro zaměstnanost" # todo: NEW TRANSLATION
 LKT_focus_national_employment_commission_desc: "NEC je celostátní orgán pověřený vyhledáváním domácí i zahraniční pracovní síly ze sousedních zemí s cílem obsadit pracovní místa a vybudovat stabilnější a vyváženější ekonomiku. Samozřejmě bude poněkud ošemetné „přetahovat“ zahraniční pracovníky, naši kontinentální bratři a sestry však budou považováni za řádné občany, protože smyslem programu je zajistit, aby ekonomika nepředbíhala dostupnou pracovní sílu." # todo: NEW TRANSLATION
 LKT_focus_ensuring_military_stockpiles: "Zajištění vojenských zásob" # todo: NEW TRANSLATION
 LKT_focus_ensuring_military_stockpiles_desc: "Národní obrana je důležitá, ale abychom mohli skutečně bránit vlastní národ, musíme mít nejprve potřebné vybavení. Rozšíření NEC nám proto umožní zaměstnat více lidí v továrnách, které vytvoří tyto zásoby, aby naše armáda a letectvo mohly bránit národ před nežádoucími zájmy." # todo: NEW TRANSLATION
 LKT_focus_LTP_political_plan: "Politický plán LTP" # todo: NEW TRANSLATION
 LKT_focus_LTP_political_plan_desc: "Lakotská technokratická strana je stranou pokroku a inovací. Zaměřuje se na vzdělávání, výzkum a vývoj a také na vytvoření ekonomického prostředí pro financování těchto snah. LTP doufá, že vytvoří národ, který se bude snažit dělat věci lépe a stále hledat nové způsoby, jak toho dosáhnout." # todo: NEW TRANSLATION
 LKT_focus_mandatory_education_programs: "Povinné vzdělávací programy" # todo: NEW TRANSLATION
 LKT_focus_mandatory_education_programs_desc: "MEP jsou programy určené k rozšíření hranic vzdělávání tím, že nepůjdou jen cestou jednoduchého základního školství. Jde o nezávislé programy mimo běžný systém, které mají podporovat nové příležitosti pro lidi bez ohledu na jejich věk." # todo: NEW TRANSLATION
 LKT_focus_the_means_of_efficiency: "Prostředky efektivity" # todo: NEW TRANSLATION
 LKT_focus_the_means_of_efficiency_desc: "Náš národ je řídce osídlený, a proto se musíme této realitě přizpůsobit. Musíme se chopit prostředků efektivity a naučit se vystačit s tím, co máme." # todo: NEW TRANSLATION
 LKT_focus_ends_of_a_means: "Cíl prostředků" # todo: NEW TRANSLATION
 LKT_focus_ends_of_a_means_desc: "Máme přístup ke klíčovému zdroji, železné rudě. Z této rudy můžeme vyrábět ocel, která je základním prvkem moderního ekonomického uspořádání. Pokud chceme skutečný odrazový můstek k soběstačnosti, musíme do těžby tohoto zdroje výrazně investovat." # todo: NEW TRANSLATION
 LKT_focus_metallic_masters: "Kovové prostředky" # todo: NEW TRANSLATION
 LKT_focus_metallic_masters_desc: "Další posilování naší národní nezávislosti znamená, že musíme bohužel kopat hluboko a nenasytně. Ve státě Jižní Dakota se proto nachází menší množství lehkých kovů, které by nám mělo umožnit diverzifikovat naše ekonomické schopnosti." # todo: NEW TRANSLATION
 LKT_focus_economic_expansion_act: "Zákon o hospodářském rozvoji" # todo: NEW TRANSLATION
 LKT_focus_economic_expansion_act_desc: "Obecný průmyslový rozvoj umožní rozšířit naši ekonomickou základnu. To nám následně umožní vytvářet více kapitálu pro další investice." # todo: NEW TRANSLATION
 LKT_focus_peoples_defense_act: "Zákon o obraně lidu" # todo: NEW TRANSLATION
 LKT_focus_peoples_defense_act_desc: "PDA je omezený program národní obrany, který vytvořil omezené průmyslové a kontraktační příležitosti, aby náš národ mohl vybavit své vojáky." # todo: NEW TRANSLATION
 LKT_focus_militarized_politics_plan: "Plán militarizované politiky" # todo: NEW TRANSLATION
 LKT_focus_militarized_politics_plan_desc: "Zatímco se národ pře o to, co je správné a jak postupovat vpřed, složky AFL, Lakotských ozbrojených sil, převzaly iniciativu a nějakým způsobem získaly většinu hlasů v těchto prvních volbách. Mnozí pochybují, že by vyhrály méně rozdělující volby, ale ještě více lidí je rádo, že máme nějaký směr, místo abychom jen bloudili v neznámu." # todo: NEW TRANSLATION
 LKT_focus_national_conscription_period: "Období celostátní branné povinnosti" # todo: NEW TRANSLATION
 LKT_focus_national_conscription_period_desc: "Vzhledem k naší výrazně nižší populaci ve srovnání s pobřežními sousedy musíme zavést povinnou vojenskou službu v délce nejméně půl roku. Mnozí s tímto krokem nebudou souhlasit, ale pokud se máme skutečně zaměřit na národní obranu a připravit se na případné hlouposti ostatních mocností, musíme tak učinit." # todo: NEW TRANSLATION
 LKT_focus_military_classroom_standards: "Vojenské vzdělávací standardy" # todo: NEW TRANSLATION
 LKT_focus_military_classroom_standards_desc: "Začleněním jednoduchých požadavků, jako jsou fyzická zdatnost a základní znalosti typů formací i taktiky malých jednotek, můžeme vytvořit volnou podobu základního výcviku, která připraví budoucí brance na jejich povinnou službu." # todo: NEW TRANSLATION
 LKT_focus_basic_economic_investments: "Základní hospodářské investice" # todo: NEW TRANSLATION
 LKT_focus_basic_economic_investments_desc: "Pokud máme mít šanci bránit sami sebe, musíme mít také prostředky k podpoře takového úsilí. Vytvoříme proto omezené projekty průmyslového rozvoje, abychom tyto prostředky získali." # todo: NEW TRANSLATION
 LKT_focus_military_industrial_sector: "Vojensko-průmyslový sektor" # todo: NEW TRANSLATION
 LKT_focus_military_industrial_sector_desc: "MIS je naší podobou vojensko-průmyslového komplexu. Klíčový rozdíl však spočívá v tom, že tyto továrny budou víceúčelové a vybudované s možností přizpůsobení. To znamená, že v omezené míře přispívají k civilní ekonomice v době míru, ale v případě potřeby lze snadno změnit jejich zaměření a zvýšit výrobu válečného materiálu." # todo: NEW TRANSLATION
 LKT_focus_less_for_more: "Méně pro více" # todo: NEW TRANSLATION
 LKT_focus_less_for_more_desc: "Investice, které sníží množství pracovní síly potřebné v jednotlivých podnicích a hospodářských odvětvích, uvolní více lidí pro armádu i hospodářský rozvoj. Naše populace je ve srovnání se zbytkem kontinentu prakticky žalostně malá. Investujeme proto do produkce potravin a dodavatelských řetězců a chopíme se prostředků reprodukce, aby naši občané mohli žít a milovat podle svého." # todo: NEW TRANSLATION
 LKT_focus_general_military_improvements_funding: "Financování všeobecného vojenského rozvoje" # todo: NEW TRANSLATION
 LKT_focus_general_military_improvements_funding_desc: "GMIF je robustní finanční balíček, který umožní naší armádě zlepšit oblasti, jež považujeme za potřebné pro potenciální bojiště, na nichž se můžeme ocitnout. Největší hrozbou je vzdušná síla, proto prozatím rozdělíme investice rovnoměrně mezi letectvo a armádu." # todo: NEW TRANSLATION
 LKT_focus_the_parties_for_tradition: "Strany tradice" # todo: NEW TRANSLATION
 LKT_focus_the_parties_for_tradition_desc: "Soubor stran od středopravicových až po výrazně pravicové se spojuje a vytváří volební blok známý jako Strany tradice. Je proto zajímavé sledovat, zda a ke které straně se lidé v prvních volbách národa přikloní." # todo: NEW TRANSLATION
 LKT_focus_ORP_political_plan: "Politický plán ORP" # todo: NEW TRANSLATION
 LKT_focus_ORP_political_plan_desc: "Strana staré republiky staví na stabilitě a opatrnosti. Tento program lze chápat jako pomalý a vytrvalý přístup, který nakonec zvítězí, a vzhledem k situaci, v níž se jako národ nacházíme, by pro ně mnozí nehlasovali, kdyby se rozhodli vrhnout do věcí po hlavě jako některé jiné strany." # todo: NEW TRANSLATION
 LKT_focus_strategic_mechanization_act: "Zákon o strategické mechanizaci" # todo: NEW TRANSLATION
 LKT_focus_strategic_mechanization_act_desc: "Přílišná závislost naší ekonomiky na zemědělství znamená, že je v tomto odvětví uvázáno mnoho lidí. Navzdory rozruchu, který to může vyvolat, proto musíme prosadit určitou formu mechanizace, abychom dostupnou pracovní sílu lépe rozložili." # todo: NEW TRANSLATION
 LKT_focus_better_neighbors_act: "Zákon o lepších sousedech" # todo: NEW TRANSLATION
 LKT_focus_better_neighbors_act_desc: "Protože je zemědělství hlavním hospodářským odvětvím, není nadbytek potravin ničím neobvyklým. Můžeme proto motivovat „žadatele o azyl“ ze sousedních národů, aby pomohli nastartovat růst populace a obnovit naši ekonomiku jako celek. Pracovní místa jsou koneckonců k ničemu bez lidí, kteří je obsadí." # todo: NEW TRANSLATION
 LKT_focus_green_thumb_officers_act: "Zákon o důstojnících zeleného palce" # todo: NEW TRANSLATION
 LKT_focus_green_thumb_officers_act_desc: "Zákon GTO je určen ke zlepšení financování policejních složek a lepšímu rozdělení zdrojů do čtvrtí a komunit lidí v odlehlejších oblastech." # todo: NEW TRANSLATION
 LKT_focus_kansas_economic_upgrade: "Hospodářský rozvoj Kansasu" # todo: NEW TRANSLATION
 LKT_focus_kansas_economic_upgrade_desc: "Významnou rozvojovou oblastí je náš nejjižnější stát Kansas. Navzdory jeho rozvoji je tento stát více závislý na zemědělství, než se očekávalo. Díky štědrým investicím proto plánujeme přeměnit určitou část širšího zemědělského hospodářství na kombinaci lehkého a těžkého průmyslu." # todo: NEW TRANSLATION
 LKT_focus_better_budgeting_act: "Zákon o lepším rozpočtování" # todo: NEW TRANSLATION
 LKT_focus_better_budgeting_act_desc: "Zákon o lepším rozpočtování provede úplný a podrobný audit stávajícího rozpočtu školství, aby zefektivnil a lépe přidělil finanční zdroje. Tím plánujeme zlepšit vzdělávací standardy a co nejvíce odstranit nesrovnalosti, které mohou mít rozpočtová selhání na studenty a zaměstnance." # todo: NEW TRANSLATION
 LKT_focus_experimental_extractions_act: "Zákon o experimentální těžbě" # todo: NEW TRANSLATION
 LKT_focus_experimental_extractions_act_desc: "Našemu národu chybí základní zásoby oceli nebo alespoň solidní zásoby železné rudy. V Kansasu a Nebrasce proto budou bez ohledu na čistou ziskovost provedeny geologické průzkumy a rozsáhlé investice, aby měl náš národ přístup k tomuto klíčovému stavebnímu prvku moderní ekonomiky." # todo: NEW TRANSLATION
 LKT_focus_GLP_political_plan: "Politický plán Velké liberální strany" # todo: NEW TRANSLATION
 LKT_focus_GLP_political_plan_desc: "Umírněně liberální politika zaměřená na zlepšení zemědělství podpoří náš národ i jeho obyvatele. Mnozí hlasovali pro Velkou liberální stranu, protože ji vnímali jako stranu pomalého pokroku a změn v podobách, kterým se lidé mohou přizpůsobit a rozumět jim. Jen čas však ukáže, zda tomu tak skutečně bude." # todo: NEW TRANSLATION
 LKT_focus_food_bank_securities_act: "Zákon o cenných papírech potravinových bank" # todo: NEW TRANSLATION
 LKT_focus_food_bank_securities_act_desc: "Zákon FBS vytváří vládní a soukromé investiční dluhopisy, které budou použity k nákupu běžných potravin pro domácnosti. Tyto „potravinové banky“ pak pomohou rodinám získat každodenní potřeby, které si v těžkých dobách nemohou dovolit. Charitativní organizace se stabilní a pravidelnou strukturou, které pomáhají živit lidi bez domova a další chudé občany, mohou o tyto cenné papíry také požádat, budou však pod dohledem federálních kontrolorů, aby se zajistilo, že finance a potraviny jsou využívány k určeným účelům." # todo: NEW TRANSLATION
 LKT_focus_audit_commissions_act: "Zákon o auditorských komisích" # todo: NEW TRANSLATION
 LKT_focus_audit_commissions_act_desc: "ACA neboli auditorský zákon je legislativa vytvořená za účelem zřízení nezávislé komise auditorů, která zajistí, aby federální úřady a zaměstnanci přidělovali finanční a materiální zdroje k uvedeným a zamýšleným účelům. Tento orgán se bude skládat z osob, které nejsou spojeny s žádnou politickou institucí ani stranou, a budou proto pocházet z příslušných oblastí financí a regulace, aby byla zajištěna nestrannost." # todo: NEW TRANSLATION
 LKT_focus_raw_value_act: "Zákon o skutečné hodnotě" # todo: NEW TRANSLATION
 LKT_focus_raw_value_act_desc: "Naše zemědělství může našemu národu přinést jen omezenou hodnotu. Lidé chtějí věci a ty vyžadují nerostné zdroje, proto budeme investovat do dolů na vzácné zeminy a další vysoce hodnotné nerosty, abychom diverzifikovali naše národní portfolio — pro nedostatek lepšího výrazu." # todo: NEW TRANSLATION
 LKT_focus_improving_immigration_processes: "Zlepšení imigračních procesů" # todo: NEW TRANSLATION
 LKT_focus_improving_immigration_processes_desc: "Investicemi do zlepšení zdrojů věnovaných prosazování imigračních pravidel a celkového procesu získání občanství můžeme doufat v hladší průběh a větší přitažlivost pro cizí státní příslušníky. Doufáme, že si zvolí náš národ za svůj nový domov a my jim dáme nový začátek v životě i jeho vzácném smyslu." # todo: NEW TRANSLATION
 LKT_focus_invest_care_act: "Zákon Invest Care" # todo: NEW TRANSLATION
 LKT_focus_invest_care_act_desc: "Invest Care je rozpočtová iniciativa, jejímž cílem je zajistit stabilnější financování zdravotnických služeb. Díky lepšímu financování doufáme ve zvýšení morálky zaměstnanců, podporu budoucích pracovních příležitostí a zajištění toho, že budovy budou odpovídat předpisům a vybavení bude fungovat podle očekávání. Vaše péče je naší investicí, protože lepší lidé znamenají lepší národ." # todo: NEW TRANSLATION
 LKT_focus_national_defense_upgrades: "Modernizace národní obrany" # todo: NEW TRANSLATION
 LKT_focus_national_defense_upgrades_desc: "Lepší investice do vybavení a lepší obeznámenost personálu s tímto vybavením zvýší naši schopnost bránit národ před cizími akty agrese." # todo: NEW TRANSLATION
 LKT_focus_TTP_political_plan: "Politický plán TTP" # todo: NEW TRANSLATION
 LKT_focus_TTP_political_plan_desc: "Strana kmenových tradic je do určité míry nativistická, nikoli však tak, jak by si mnozí představovali. Její nativismus vychází z myšlenky, že ačkoli tyto země kdysi patřily kmenům, musíme se pro další rozvoj, zachování a přežití spojit v jeden národ mnoha národů. Tradice, jako jsou rodina, komunita a víra v principy, které jsme se rozhodli dodržovat, slouží jako nástroj jednoty." # todo: NEW TRANSLATION
 LKT_focus_defense_spending_program: "Program obranných výdajů" # todo: NEW TRANSLATION
 LKT_focus_defense_spending_program_desc: "DSP je výdajový balíček určený k přípravě národa na silnější obranné postavení. Naše země jsou v rozsáhlých oblastech otevřené i uzavřené, a proto musíme tento terén využít ve svůj prospěch." # todo: NEW TRANSLATION
 LKT_focus_families_security_stipend: "Bezpečnostní příspěvek pro rodiny" # todo: NEW TRANSLATION
 LKT_focus_families_security_stipend_desc: "Rodinný příspěvek, jak mu mnozí říkají, je žádostný příspěvek, o který mohou rodiny požádat a získat jej na zmírnění ekonomického napětí spojeného s jejich potřebami. Příspěvek pokrývá potraviny, oblečení a péči o děti, stejně jako seznam dalších registrovaných položek na federální příspěvkové kartě." # todo: NEW TRANSLATION
 LKT_focus_food_supply_mandate: "Mandát dodávek potravin" # todo: NEW TRANSLATION
 LKT_focus_food_supply_mandate_desc: "Naši lidé žijí na úrodné půdě, která by měla snadno uživit obyvatele, kteří na ní žijí. Proto investujeme a vytvoříme mandát, aby naši občané měli vždy, kdykoli to bude možné, levné a kvalitní jídlo ke každému jídlu. V sázce je samotné přežití našeho národa, které závisí na dodávkách potravin." # todo: NEW TRANSLATION
 LKT_focus_limited_industrialization_efforts: "Omezené industrializační úsilí" # todo: NEW TRANSLATION
 LKT_focus_limited_industrialization_efforts_desc: "Abychom diverzifikovali ekonomiku a zajistili zdravý a silný trh práce, musíme investovat do omezeného průmyslového rozvoje a zajistit, aby naše lidské zdroje byly stejně rozmanité jako tyto země." # todo: NEW TRANSLATION
 LKT_focus_setting_up_new_contracts: "Uzavírání nových smluv" # todo: NEW TRANSLATION
 LKT_focus_setting_up_new_contracts_desc: "Vytvoření omezeného základu našich vojenských výrobních schopností nám poskytne alespoň měřítko požadavků, kterým bychom mohli čelit, pokud by na severoamerickém kontinentu někdy vypukla válka." # todo: NEW TRANSLATION
 LKT_focus_strategic_mining_operations: "Strategické těžební operace" # todo: NEW TRANSLATION
 LKT_focus_strategic_mining_operations_desc: "Náš národ má zdroje, ale musíme poměrně výrazně investovat, abychom získali cennější a hospodářsky významnější nerosty. Proto budeme investovat do těžby drahých kovů ve Wyomingu a omezené těžby lehkých kovů v Jižní Dakotě. Nebude toho mnoho, ale doplnění financování výzkumu a vývoje by se mělo časem vyplatit." # todo: NEW TRANSLATION
 LKT_focus_LTSP_political_plan: "Politický plán LTSP" # todo: NEW TRANSLATION
 LKT_focus_LTSP_political_plan_desc: "Lakotská strana tradic a solidarity je stranou poměrně genericky konzervativního směru. Zaměřuje se na komunitní a rodinné otázky a využívá je jako prostředek k podpoře národní jednoty. Mnozí se proto diví, proč tato strana a další podobně konzervativní strany vůbec existují v tak rozdrobeném stavu." # todo: NEW TRANSLATION
 LKT_focus_community_improvement_programs: "Programy rozvoje komunit" # todo: NEW TRANSLATION
 LKT_focus_community_improvement_programs_desc: "CIP jsou určeny k podpoře komunitního dosahu a obecných rozvojových snah, které mají spojovat komunity a podporovat rozvoj v menších nebo venkovských oblastech." # todo: NEW TRANSLATION
 LKT_focus_farming_expansion_efforts: "Úsilí o rozvoj zemědělství" # todo: NEW TRANSLATION
 LKT_focus_farming_expansion_efforts_desc: "Stabilita našeho národa stojí na skutečnosti, že máme dostatek úrodné půdy. Proto ji budeme rozvíjet a povzbuzovat naše lidi, aby rostli spolu s poli, která obdělávají." # todo: NEW TRANSLATION
 LKT_focus_building_to_new_heights: "Stavba do nových výšin" # todo: NEW TRANSLATION
 LKT_focus_building_to_new_heights_desc: "Kancelářský a technologický sektor je třeba rozšířit. Pokud chceme správně diverzifikovat ekonomiku a potenciál našich občanů, musíme investovat do nového rozvoje i vzdělávání, které jej podpoří." # todo: NEW TRANSLATION
 LKT_focus_manufacturing_new_industries: "Budování nových odvětví" # todo: NEW TRANSLATION
 LKT_focus_manufacturing_new_industries_desc: "Rozvoj základny naší ekonomiky je zásadní pro její obecný růst." # todo: NEW TRANSLATION
 LKT_focus_securing_armaments: "Zajištění výzbroje" # todo: NEW TRANSLATION
 LKT_focus_securing_armaments_desc: "Schopnost zásobovat naše vojáky je pro národní obranu klíčová. Jelikož v blízké budoucnosti nic neočekáváme, začneme v malém a vybudujeme několik továren, které vyřeší nedostatek základního vybavení." # todo: NEW TRANSLATION
 LKT_focus_natural_resources_act: "Zákon o přírodních zdrojích" # todo: NEW TRANSLATION
 LKT_focus_natural_resources_act_desc: "Rozsáhlý a vyvážený investiční balíček do těžby, který má způsobit revoluci ve schopnostech našeho národa využívat zdroje. Ačkoli bude nákladný, časem se sám zaplatí." # todo: NEW TRANSLATION
 LKT_focus_the_common_folk_progress_parties: "Strany pokroku prostého lidu" # todo: NEW TRANSLATION
 LKT_focus_the_common_folk_progress_parties_desc: "Strany prostého lidu, jak někteří raději nazývají rostoucí strany socialisticky orientované ekonomiky, jsou skupinou stran, které tak či onak věří, že musí získat podporu, aby tak neučinila „krajní pravice“. Bez ohledu na výmluvy některých stranických představitelů v těchto různých skupinách mnozí vnímají tyto strany jako běžnější způsob pohledu na národ, protože většina zdejších zemí není rozvinutá a „velký byznys“ v tradičním smyslu vlastně neexistuje." # todo: NEW TRANSLATION
 LKT_focus_FPP_political_plan: "Politický plán FPP" # todo: NEW TRANSLATION
 LKT_focus_FPP_political_plan_desc: "Strana pokroku zemědělců, založená na principech farmářské dělnické strany, využívá myšlenku demokratického socialismu pro národ zemědělců. Namísto průmyslových dělníků se v zásadě zaměřuje na zlepšování postavení zemědělských pracovníků. Vzhledem ke struktuře ekonomiky našeho národa není divu, že volby vyhrála." # todo: NEW TRANSLATION
 LKT_focus_american_asylum_act: "Zákon o „americkém“ azylu" # todo: NEW TRANSLATION
 LKT_focus_american_asylum_act_desc: "Takzvaný zákon Triple A je kvazipolitikou otevřených hranic. V zásadě získají azyl v národě ti, kteří dokážou, že po dlouhou dobu žili na území staré republiky. Tento přístup k mottu používanému u sochy Svobody na východě je skvělým způsobem, jak přivést do našeho národa nové lidi a rozvíjet ekonomiku obsazením pracovních míst, která zřejmě vytváříme rychleji, než máme lidi, kteří by je obsadili." # todo: NEW TRANSLATION
 LKT_focus_expanded_health_services: "Rozšířené zdravotní služby" # todo: NEW TRANSLATION
 LKT_focus_expanded_health_services_desc: "Zlepšení našich zdravotnických schopností a možnost dosáhnout ke každému v rozumném čase zajistí míru přežití a zlepší celkové zdraví našich občanů." # todo: NEW TRANSLATION
 LKT_focus_fine_tuning_industrial_regulations: "Jemné vyladění průmyslových regulací" # todo: NEW TRANSLATION
 LKT_focus_fine_tuning_industrial_regulations_desc: "Přestože naše ekonomika není silně závislá na průmyslu, můžeme předběhnout ostatní úpravou a preventivním odstraněním některých problematických regulací, které ochromily nebo přímo poškodily občany mnoha národů." # todo: NEW TRANSLATION
 LKT_focus_more_for_more_act: "Zákon Více za více" # todo: NEW TRANSLATION
 LKT_focus_more_for_more_act_desc: "Tato finanční iniciativa pomůže zefektivnit zemědělské postupy a zároveň podpoří vznik nových farem a souvisejících odvětví. Část „více za více“ vychází ze skutečnosti, že v dlouhodobém horizontu bude v zemědělství pracovat méně lidí, ti však budou moci nadále vykonávat stejný druh práce." # todo: NEW TRANSLATION
 LKT_focus_farmer_jims_research_emporium: "Výzkumné centrum farmáře Jima" # todo: NEW TRANSLATION
 LKT_focus_farmer_jims_research_emporium_desc: "Zemědělské výzkumné centrum pomůže vychovat nové generace zemědělců a zároveň může sloužit jako výzkumné zařízení, které pomůže zlepšit zemědělské produkty." # todo: NEW TRANSLATION
 LKT_focus_steeled_veins_act: "Zákon o ocelových žilách" # todo: NEW TRANSLATION
 LKT_focus_steeled_veins_act_desc: "Železná ruda, životodárná surovina pro výrobu oceli a klíčový pilíř moderních ekonomik i staveb, leží přímo pod našima nohama. Pokud chceme stabilní a funkční ekonomiku, musíme investovat a zajistit si tento běžně žádaný zdroj." # todo: NEW TRANSLATION
 LKT_focus_LAS_political_plan: "Politický plán LAS" # todo: NEW TRANSLATION
 LKT_focus_LAS_political_plan_desc: "Lakotská agrární společnost je kolektivistické hnutí, které usiluje o modernizaci agrární politiky a zároveň hledá způsoby, jak omezit vládu tak, aby lidem vrátila více moci." # todo: NEW TRANSLATION
 LKT_focus_asylum_experiment: "Azylový experiment" # todo: NEW TRANSLATION
 LKT_focus_asylum_experiment_desc: "Snažíme se osídlit naši zemi, naše farmy i celý náš národ. Musíme proto hledat nejlepší způsoby přijímání žadatelů o azyl a udělat vše pro vyřešení těchto kritických nedostatků." # todo: NEW TRANSLATION
 LKT_focus_improving_farming_methods: "Zlepšování zemědělských metod" # todo: NEW TRANSLATION
 LKT_focus_improving_farming_methods_desc: "Investice do zlepšení základních ekonomických potřeb, jako je produkce potravin, prospějí každému jednotlivci bez ohledu na původ. Budeme proto hledat jakékoli způsoby, jak zlepšit zemědělství a posílit naše zásoby potravin." # todo: NEW TRANSLATION
 LKT_focus_mechanized_agriculture_union: "Svaz mechanizovaného zemědělství" # todo: NEW TRANSLATION
 LKT_focus_mechanized_agriculture_union_desc: "Spojením hospodářských odvětví průmyslu a zemědělství vytváříme vzájemný precedens, že tato odvětví nemohou fungovat bez zlepšení toho druhého. Pokud chceme skutečně rovnou společnost, musíme zajistit vzájemný růst a rozvoj." # todo: NEW TRANSLATION
 LKT_focus_local_farming_initiatives: "Místní zemědělské iniciativy" # todo: NEW TRANSLATION
 LKT_focus_local_farming_initiatives_desc: "Největším problémem potravinové bezpečnosti jsou zásobovací trasy. Hromadná výroba zboží nemá smysl, pokud se zkazí dříve, než dorazí do obchodů. Proto podpoříme více místního rozvoje, abychom snížili potřebu dálkové přepravy potravin. Zlepšíme cenu jednotlivých položek i hotovost, kterou budou mít naši lidé k dispozici pro své potřeby." # todo: NEW TRANSLATION
 LKT_focus_more_ways_to_work_the_land: "Více způsobů obdělávání půdy" # todo: NEW TRANSLATION
 LKT_focus_more_ways_to_work_the_land_desc: "Zemědělství nás může dovést jen do určité míry a požadavky moderních zemědělských metod znamenají, že musíme řádně prozkoumat půdu a najít nerostné zdroje. Vyvážený soubor celostátních geologických průzkumů, těžebních operací a nových zpracovatelských zařízení pozvedne náš národ do dosud nevídaných výšin moderní doby." # todo: NEW TRANSLATION
 LKT_focus_the_land_of_opportunity: "Země příležitostí" # todo: NEW TRANSLATION
 LKT_focus_the_land_of_opportunity_desc: "Naše země jsou rozlehlé, prázdné a připravené pro rozkvět komunit, které budou spolupracovat. Vydejme se na cestu a stanovme mandát vítat ty, kteří hledají lepší zítřek." # todo: NEW TRANSLATION
 LKT_focus_PNP_political_plan: "Politický plán PNP" # todo: NEW TRANSLATION
 LKT_focus_PNP_political_plan_desc: "Strana národního zachování je poměrně standardní zelenou stranou. Přestože je kompromisnější než tradičnější strany, PNP usiluje o modernizaci a zároveň o zachování přírodních krás národa." # todo: NEW TRANSLATION
 LKT_focus_building_tall_not_wide: "Stavět do výšky, ne do šířky" # todo: NEW TRANSLATION
 LKT_focus_building_tall_not_wide_desc: "Výzkumem nových forem efektivity továren můžeme společně hledat způsoby, jak držet krok s potřebami společnosti, aniž bychom přitom museli zabrat tolik půdy." # todo: NEW TRANSLATION
 LKT_focus_stable_economics: "Stabilní ekonomika" # todo: NEW TRANSLATION
 LKT_focus_stable_economics_desc: "Musíme se zaměřit na hospodářskou stabilitu a najít rovnováhu mezi efektivitou továren a dalších hospodářských odvětví a zároveň zohlednit rozdíly na trhu práce. Budeme proto muset zlepšit investice do sociálních služeb a iniciativ hospodářského plánování." # todo: NEW TRANSLATION
 LKT_focus_local_food_producers: "Místní producenti potravin" # todo: NEW TRANSLATION
 LKT_focus_local_food_producers_desc: "Program LFP zřizuje několik farem určených k zásobování místního obyvatelstva. Výrazně sníží náklady na potraviny a zároveň podpoří domácí výdaje namísto zahraničního dovozu a vývozu." # todo: NEW TRANSLATION
 LKT_focus_sufficient_tech_investments: "Dostatečné investice do technologií" # todo: NEW TRANSLATION
 LKT_focus_sufficient_tech_investments_desc: "Technologický sektor v našem národě prakticky neexistuje. Máme však zdroje na rozumné investice, které nám alespoň zajistí rozmanitost pracovních míst i další zdroje k využití." # todo: NEW TRANSLATION
 LKT_focus_domestic_arms_production_efforts: "Úsilí o domácí výrobu zbraní" # todo: NEW TRANSLATION
 LKT_focus_domestic_arms_production_efforts_desc: "Naše schopnost chránit zemi a lid závisí pouze na schopnostech našich stálých vojenských sil. Přestože se v blízké budoucnosti nic neděje, nemít vůbec nic není za žádných okolností plánování." # todo: NEW TRANSLATION
 LKT_focus_eco_extraction_efforts: "Ekologická těžba" # todo: NEW TRANSLATION
 LKT_focus_eco_extraction_efforts_desc: "Jemným zdokonalováním a zušlechťováním způsobů těžby zdrojů můžeme získat rozsáhlý a rozmanitý fond surovin. Přímé množství však bude výrazně omezeno kvůli naší vlastní zdrženlivosti při těžebních operacích. Doufáme ale, že s rozvojem technologií dále zdokonalíme způsoby, jak získat více z menšího množství." # todo: NEW TRANSLATION
 LKT_focus_RBP_political_plan: "Politický plán RBP" # todo: NEW TRANSLATION
 LKT_focus_RBP_political_plan_desc: "Strana růžového keře usiluje o prosazování práv pracujících a obecný posun národa vpřed prostřednictvím progresivní industrializace. Snaží se vytvořit pevnější spojení mezi hospodářským a sociálním rozvojem. RBP udělá vše, co bude moci, aby zajistila stabilitu a prosperitu mezi zaměstnavateli a pracovníky." # todo: NEW TRANSLATION
 LKT_focus_revamped_corporate_taxes: "Reforma korporátních daní" # todo: NEW TRANSLATION
 LKT_focus_revamped_corporate_taxes_desc: "Komplexním přepracováním daňového řádu, zejména standardizované sazby korporátní daně, můžeme zajistit stabilní příjem a přenést větší část daňového břemene na korporace a kancelářské subjekty místo průměrného daňového poplatníka." # todo: NEW TRANSLATION
 LKT_focus_education_for_all: "Vzdělání pro všechny" # todo: NEW TRANSLATION
 LKT_focus_education_for_all_desc: "Výrazné rozšíření našeho vzdělávacího systému a schopnosti každého občana získat znalosti o světě kolem nás nám umožní sklízet nepřímé přínosy, protože naše populace bude vzdělanější a její základní standardy budou stále vyšší." # todo: NEW TRANSLATION
 LKT_focus_fixing_our_ore_deal: "Náprava naší dohody o rudě" # todo: NEW TRANSLATION
 LKT_focus_fixing_our_ore_deal_desc: "Železo a ocel, moderní pilíř, který po betonu podepírá každou ekonomiku. Musíme slušně investovat do vytvoření vlastních dodavatelských tras oceli, pokud chceme dlouho přežít sami. Ze všech stran jsme obklopeni neznámem, tak alespoň jednu věc učiňme známou." # todo: NEW TRANSLATION
 LKT_focus_from_fields_to_cities_act: "Zákon Od polí k městům" # todo: NEW TRANSLATION
 LKT_focus_from_fields_to_cities_act_desc: "Obecný rozvoj našich venkovských i městských center umožní celkově rozmanitější rozšíření trhu práce a zvýšení kvality pracovních míst dostupných našim občanům." # todo: NEW TRANSLATION
 LKT_focus_from_it_sector_developments: "Rozvoj IT sektoru" # todo: NEW TRANSLATION
 LKT_focus_from_it_sector_developments_desc: "Malý, ale soběstačný IT nebo technologický sektor bude velmi prospěšný pro pokračující snahy o řádnou diverzifikaci naší ekonomiky." # todo: NEW TRANSLATION
 LKT_focus_supplying_our_military_needs: "Zajištění potřeb naší armády" # todo: NEW TRANSLATION
 LKT_focus_supplying_our_military_needs_desc: "Základní potřeby musí být vždy naplněny, ať už civilní, nebo vojenské. Pokud se chceme bránit cizím vpádům, musíme vybudovat několik továren a zajistit, aby vojenská výroba odpovídala našim potřebám." # todo: NEW TRANSLATION
 LKT_focus_new_lakotan_nationals_parties: "Noví lakotští nacionalisté, strany" # todo: NEW TRANSLATION
 LKT_focus_new_lakotan_nationals_parties_desc: "Rostoucí vliv socialistického ekonomického myšlení, náhlý a násilný rozpad staré republiky a nezměněné a nedotčené země, které náš národ obývá. To je jen několik důvodů, proč byste vy, občané našeho slavného národa, měli hlasovat pro jednoho z nás. Pro nové lakotské nacionalisty! Přidejte se k nám a udržme novou identitu, kterou jsme vytvořili, bez zahraničního vměšování a marxistického či maoistického idealismu. Volte dnes a udělejte svůj díl!" # todo: NEW TRANSLATION
 LKT_focus_YIP_political_plan: "Politický plán YIP" # todo: NEW TRANSLATION
 LKT_focus_YIP_political_plan_desc: "YIP neboli Strana mladých průmyslníků se zaměřuje na modernizaci a staví prosperitu do popředí své politiky. Ačkoli se někteří obávají, že jde jen o oligarchy v pláštích, mnozí ve straně se soustředí na předkládání a dokazování plánovaných záměrů namísto tradičního politického očerňování." # todo: NEW TRANSLATION
 LKT_focus_sponsored_immigration: "Sponzorované přistěhovalectví" # todo: NEW TRANSLATION
 LKT_focus_sponsored_immigration_desc: "Naše země jsou pusté, našich občanů je málo, a proto musíme přivést nové příchozí hledající lepší život. Prázdný trh práce čeká na zaplnění a půda k osídlení sahá, kam až oko dohlédne. To je náš slib těmto novým průkopníkům." # todo: NEW TRANSLATION
 LKT_focus_recruiting_talent: "Nábor talentů" # todo: NEW TRANSLATION
 LKT_focus_recruiting_talent_desc: "Dalším způsobem, jak zvýšit počet obyvatel, je nabídnout příležitosti kvalifikovaným pracovníkům. Lepší mzdy a životní podmínky jsou vždy příjemnou pobídkou." # todo: NEW TRANSLATION
 LKT_focus_south_munitions: "Jižní munice" # todo: NEW TRANSLATION
 LKT_focus_south_munitions_desc: "Zajištění místních výrobních řetězců vojenských zásob umožní našim vojákům čelit jakýmkoli hrozbám, které se proti nám postaví." # todo: NEW TRANSLATION
 LKT_focus_central_industries: "Centrální průmysl" # todo: NEW TRANSLATION
 LKT_focus_central_industries_desc: "Nelze podporovat armádu bez podpory samotného lidu. Proto centralizujeme průmyslový rozvoj, abychom lépe vyhověli potřebám dojíždění za prací." # todo: NEW TRANSLATION
 LKT_focus_bismarck_bombs: "Bismarcké bomby" # todo: NEW TRANSLATION
 LKT_focus_bismarck_bombs_desc: "Více vojenských výrobních závodů v severních pláních nám umožní pracovat s nestabilnějšími materiály a v případě nehody omezit vedlejší škody." # todo: NEW TRANSLATION
 LKT_focus_promoting_human_resources: "Rozvoj lidských zdrojů" # todo: NEW TRANSLATION
 LKT_focus_promoting_human_resources_desc: "Pole jsou zralá ke sklizni — stejně jako lidé. Motivací zemědělské produkce a lidí, kteří ji dostanou z polí na stoly po celé zemi, musíme zajistit cílený rozvoj imigračního úsilí i potřebnou hospodářskou podporu." # todo: NEW TRANSLATION
 LKT_focus_CDS_political_plan: "Politický plán CDS" # todo: NEW TRANSLATION
 LKT_focus_CDS_political_plan_desc: "Geografický nacionalismus a neústupný izolacionismus. Tyto dva pilíře tvoří základní hodnoty „Společnosti“, což mnohé mate. Zaprvé, jak může být někdo pouze „geografickým nacionalistou“, a zadruhé, jak nám může izolacionismus pomoci, když jsme už nyní tak málo rozvinutí? Ať už je případ jakýkoli, Společnost práškovacích letadel kráčí vpřed poté, co zvítězila ve volbách." # todo: NEW TRANSLATION
 LKT_focus_learning_social_values: "Poznávání společenských hodnot" # todo: NEW TRANSLATION
 LKT_focus_learning_social_values_desc: "Naše společnost je v troskách, protože lidé nevědí, co máme považovat za vlastní. Rodina, národ a duch zemí, na nichž žijeme, jsou klíčové hodnoty, které musíme podporovat a zajistit pro stabilnější a spravedlivější společnost." # todo: NEW TRANSLATION
 LKT_focus_character_creation_programs: "Programy budování charakteru" # todo: NEW TRANSLATION
 LKT_focus_character_creation_programs_desc: "Kombinací dobrovolných a povinných programů, které propojují části vzdělávání a vojenské služby, získají mnozí naši občané i budoucí generace pocit odpovědnosti a povinnosti. Nejen vůči národu, ale i vůči sobě, své rodině a těm, na nichž jim záleží." # todo: NEW TRANSLATION
 LKT_focus_supply_chains: "Dodavatelské řetězce" # todo: NEW TRANSLATION
 LKT_focus_supply_chains_desc: "Náš národ je rozlehlý, převážně plochý a celkově poměrně nerozvinutý. Musíme udělat vše pro vytvoření silných a pružných zásobovacích tras, které náš národ podpoří." # todo: NEW TRANSLATION
 LKT_focus_domestic_families_act: "Zákon o domácích rodinách" # todo: NEW TRANSLATION
 LKT_focus_domestic_families_act_desc: "DFA je rozpočtový balíček určený k podpoře a skutečnému dotování větších rodin, čímž podpoří růst domácí populace. Protože může být obtížné najít zahraniční talenty, které odpovídají našim kulturním standardům, musíme zajistit, aby nízký počet obyvatel nikdy nebyl rozhodujícím faktorem našeho přežití." # todo: NEW TRANSLATION
 LKT_focus_encouraging_favorable_migrants: "Podpora vhodných migrantů" # todo: NEW TRANSLATION
 LKT_focus_encouraging_favorable_migrants_desc: "Musíme vyhledávat talent a dovednosti, které náš národ a jeho občané potřebují. Naše přežití je omezeno pouze našimi schopnostmi, a proto musíme usilovat o jejich neustálé zvyšování." # todo: NEW TRANSLATION
 LKT_focus_increased_military_investments: "Zvýšené vojenské investice" # todo: NEW TRANSLATION
 LKT_focus_increased_military_investments_desc: "Musíme zajistit, aby naši vojáci byli vybaveni a připraveni na jakékoli nepřátelské síly, které mohou ohrozit naši zemi." # todo: NEW TRANSLATION
 LKT_focus_LGF_political_plan: "Politický plán LGF" # todo: NEW TRANSLATION
 LKT_focus_LGF_political_plan_desc: "Liga zlatých polí, jak jí mnozí říkají, je strana, o níž si málokdo myslel, že zvítězí — a přesto jsme zde. Mnozí nechápou, jak mohla taková strana vůbec vyhrát, ale v těchto nejistých časech se toho asi mnoho dělat nedá. Doufejme jen, že bude více dobrého než špatného." # todo: NEW TRANSLATION
 LKT_focus_improved_food_production: "Zlepšená produkce potravin" # todo: NEW TRANSLATION
 LKT_focus_improved_food_production_desc: "Zajištění potravin pro naše obyvatelstvo podporuje domácí růst a společenskou stabilitu." # todo: NEW TRANSLATION
 LKT_focus_increasing_industrial_base: "Rozšíření průmyslové základny" # todo: NEW TRANSLATION
 LKT_focus_increasing_industrial_base_desc: "Růst naší průmyslové kapacity nám umožní diverzifikovat ekonomiku, zlepšit její celkové zdraví a poskytnout občanům více příležitostí, než by kdy našli u našich sousedů." # todo: NEW TRANSLATION
 LKT_focus_local_military_production: "Místní vojenská výroba" # todo: NEW TRANSLATION
 LKT_focus_local_military_production_desc: "Investice do místní vojenské výroby nám umožní zajistit vybavení pro ozbrojené síly a zabránit úpadku armády. Pokud se však chceme skutečně bránit divochům, kteří po našich zemích lačně pokukují, musíme tuto oblast dále rozvíjet." # todo: NEW TRANSLATION
 LKT_focus_increasing_lawful_order: "Posílení zákonného pořádku" # todo: NEW TRANSLATION
 LKT_focus_increasing_lawful_order_desc: "Zvýšením rozpočtu policie a bezpečnostních složek můžeme zakročit proti zločinům všeho druhu. To nám umožní udržet na uzdě korporace i případné zahraniční vměšovatele, kteří se mohou vmísit mezi občany dodržující zákony." # todo: NEW TRANSLATION
 LKT_focus_military_education_act: "Zákon o vojenském vzdělávání" # todo: NEW TRANSLATION
 LKT_focus_military_education_act_desc: "MEA standardizuje vzdělávání podle zásad vojenské organizace. Intelektuálové už nebudou infikovat mysli naší mládeže bujarými myšlenkami, které narušují základy naší společnosti. Nyní vládnou povinnost, čest, odvaha, úcta a oběť. Za domov, rodinu a všechny, které si naši občané chovají v srdci a mysli." # todo: NEW TRANSLATION
 LKT_focus_self_mobilization: "Zákon o vlastní mobilizaci" # todo: NEW TRANSLATION
 LKT_focus_self_mobilization_desc: "Zákon o vlastní mobilizaci je komplexní hospodářský plán, který má mobilizovat národ a jeho občany v jakémsi „čtvrtinovém postoji“, abych tak řekl. To znamená zefektivnění ekonomiky, preventivní zaměstnávání většího počtu lidí pro případ skutečné mobilizace a zvýšení branného úsilí s cílem mentálně i společensky připravit obyvatelstvo na potřeby případného nepřátelského vpádu." # todo: NEW TRANSLATION
 LKT_focus_HOY_political_plan: "Politický plán HoY" # todo: NEW TRANSLATION
 LKT_focus_HOY_political_plan_desc: "Dům Yellowstone je součástí širšího globálního fenoménu zvaného „moderní monarchistické hnutí“. Toto obecné a mírně rozmanité politické hnutí má jedinou hlavní zásadu: sláva hlasu, nikoli krve. To jednoduše znamená zachování a zdokonalení volebního procesu tak, aby byl rozšířenější a pružnější. Patří sem všeobecné volební právo od 18 let, preferenční hlasování kandidátů a přeměna volených funkcí na tituly. Prezident se tak nyní stává králem a zástupce třeba lordem. Mnozí jsou zmatení, ale většina si pomalu zvyká na myšlenku, že se mohou stát vévodou či baronem jen tím, že slouží národu jako státní úředník." # todo: NEW TRANSLATION
 LKT_focus_office_titles_act: "Zákon o titulech úřadů" # todo: NEW TRANSLATION
 LKT_focus_office_titles_act_desc: "Standardizace feudálních titulů podle vládních úřadů lidem ukáže, že když budou dostatečně tvrdě pracovat, mohou se i oni stát princem nebo princeznou." # todo: NEW TRANSLATION
 LKT_focus_expanding_mining_operations: "Rozšíření těžebních operací" # todo: NEW TRANSLATION
 LKT_focus_expanding_mining_operations_desc: "Musíme zajistit, aby se náš národ dokázal postavit na vlastní nohy. Proto musíme investovat do těžebních operací zaměřených na získávání nerostných surovin, kterých se nám kriticky nedostává." # todo: NEW TRANSLATION
 LKT_focus_farmers_primacy_act: "Zákon o prvenství zemědělců" # todo: NEW TRANSLATION
 LKT_focus_farmers_primacy_act_desc: "Potravinová bezpečnost je jedinou věcí, která může vytvořit stabilní ekonomiku. Protože je naše populace tak malá, musíme udělat vše pro podporu jejího růstu — a potraviny jsou jedním z nejlepších způsobů." # todo: NEW TRANSLATION
 LKT_focus_expanding_immigration_efforts: "Rozšíření imigračního úsilí" # todo: NEW TRANSLATION
 LKT_focus_expanding_immigration_efforts_desc: "Situace ve světě je jako balancování. Některé národy jsou dobré, jiné přijatelné a další jednoduše špatné. Musíme usilovat o to, aby naši sousedé viděli, že jsme jedním z lepších národů. Podpora přistěhovalectví pomáhá stabilizovat trh práce a podporuje rozvoj oblastí, v nichž výrazně zaostáváme." # todo: NEW TRANSLATION
 LKT_focus_improving_education_standards: "Zlepšení vzdělávacích standardů" # todo: NEW TRANSLATION
 LKT_focus_improving_education_standards_desc: "Musíme pozvednout standardy vzdělávání, abychom zajistili, že naše schopnost inovovat a vyrábět zboží i poskytovat služby bude co nejméně plýtvavá." # todo: NEW TRANSLATION
 LKT_focus_national_economic_investments: "Národní hospodářské investice" # todo: NEW TRANSLATION
 LKT_focus_national_economic_investments_desc: "Diverzifikace ekonomiky znamená pasivní zajištění národní nezávislosti. Výrobou alespoň trochu od všeho získáme odrazový můstek k vyjednávání a cestu k zahraničním vztahům i obchodním dohodám." # todo: NEW TRANSLATION
 LKT_focus_industrialization_question: "Průmyslová otázka" # todo: NEW TRANSLATION
 LKT_focus_industrialization_question_desc: "„Státy Velkých plání“, jak mnozí říkají značné části států pod naší kontrolou, patří ke druhé nejméně rozvinutým zemím staré republiky a rozhodně i nové republiky, kterou máme. Máme však novou vládu a nový začátek, takže můžeme dělat, co chceme. Musíme si proto položit jednu otázku: industrializovat, nebo ne?" # todo: NEW TRANSLATION
 LKT_focus_the_great_northern_railway: "Velká severní železnice" # todo: NEW TRANSLATION
 LKT_focus_the_great_northern_railway_desc: "Kdysi pouhé kolečko v železniční společnosti Burlington Northern Santa Fe, nyní znovu nezávislý podnik. Reorganizací omezené infrastruktury, kterou máme k dispozici, můžeme obnovit jednu z padlých vlajek železniční historie a zároveň zlepšit a financovat naši rostoucí infrastrukturu." # todo: NEW TRANSLATION
 LKT_focus_northern_bypass: "Severní obchvat" # todo: NEW TRANSLATION
 LKT_focus_northern_bypass_desc: "Trasa pohraničím podél kanadských hranic nám umožní získat alternativní cestu pro přepravu zboží z Montany do Severní Dakoty. Nemluvě o potenciálních přepravních potřebách spojených s obchodními dohodami." # todo: NEW TRANSLATION
 LKT_focus_great_western_mainline: "Velká západní hlavní trať" # todo: NEW TRANSLATION
 LKT_focus_great_western_mainline_desc: "Trať vinoucí se z Montany do Wyomingu nám umožní přepravovat velké množství nákladu rozmanitým kopcovitým a hornatým terénem našeho západního regionu." # todo: NEW TRANSLATION
 LKT_focus_the_southern_extension: "Jižní prodloužení" # todo: NEW TRANSLATION
 LKT_focus_the_southern_extension_desc: "Postup do Kansasu nám umožní přepravovat zboží z dalekého severu Dakot až na jih do víceméně izolovaného státu, a tím dále prohloubit spolupráci mezi všemi státy naší republiky." # todo: NEW TRANSLATION
 LKT_focus_completing_the_network: "Dokončení sítě" # todo: NEW TRANSLATION
 LKT_focus_completing_the_network_desc: "Dovršením investic vytvořením obchvatů na různých strategických místech získáme alternativní trasy pro případ přírodní katastrofy, člověkem způsobené nehody nebo čehokoli jiného, co by mohlo poškodit jednu či více stávajících tras." # todo: NEW TRANSLATION
 LKT_focus_modern_agrarian_economy: "Moderní agrární ekonomika" # todo: NEW TRANSLATION
 LKT_focus_modern_agrarian_economy_desc: "Naše země jsou rozlehlé, úrodné a štědré. Byla by zatracená škoda nechat je všechny promarnit pod ochromující a toxickou povahou moderního industrialismu. Musíme se vrátit k jednodušším, a přesto sofistikovanějším způsobům zajištění ekonomické soběstačnosti. Tyto země budou klíčem, protože každý jejich kousek se stane farmou, která bude živit celý svět." # todo: NEW TRANSLATION
 LKT_focus_northern_farms_adaptation_act: "Zákon o přizpůsobení severních farem" # todo: NEW TRANSLATION
 LKT_focus_northern_farms_adaptation_act_desc: "NFAA je legislativa zaměřená na investice do farem a zemědělských center v severních státech. Zahrnuje investice a financování i školení v metodách zimního přizpůsobení, potenciálně nové stavby a způsoby poskytování produktů i v hluboké zimě. Skleníky a řádně izolovaná a vytápěná zařízení pro hospodářská zvířata znamenají, že zemědělcem bude možné být téměř po celý rok." # todo: NEW TRANSLATION
 LKT_focus_centralia_farms_act: "Zákon o farmách Centralie" # todo: NEW TRANSLATION
 LKT_focus_centralia_farms_act_desc: "CFA reorganizuje farmy v centrálních státech našeho národa pod společný veřejný a soukromý podnikatelský subjekt. Hlavním cílem je nastolit rovnováhu růstu a zajistit rozmanitost zemědělských produktů podle možností jednotlivých států. Jelikož jde o největší část zabírající téměř polovinu států, společný zájem soukromého vytváření bohatství a veřejného zájmu na potravinové bezpečnosti je důvodem tohoto společného podniku." # todo: NEW TRANSLATION
 LKT_focus_southern_farming_traditions: "Jižanské zemědělské tradice" # todo: NEW TRANSLATION
 LKT_focus_southern_farming_traditions_desc: "V jižní části národa i staré republiky existovala určitá měkká tradice, která přikládala význam pěstování tržních plodin. Jsme sice nový národ, ale nelze podceňovat význam některých těchto plodin z hlediska vývozu i domácí hodnoty. Proto náš klimaticky stabilnější jižní stát Kansas nasměrujeme k produkci jejich směsi." # todo: NEW TRANSLATION
 LKT_focus_targeted_mechanization_efforts: "Cílené mechanizační úsilí" # todo: NEW TRANSLATION
 LKT_focus_targeted_mechanization_efforts_desc: "Zaměřením průmyslového úsilí na podporu zemědělství můžeme zajistit obrovský nárůst produktivity a řádně diverzifikovanou ekonomiku, o kterou se můžeme opřít. Člověk nikdy neví, zda se počasí nebo globální jev nepokusí uškodit." # todo: NEW TRANSLATION
 LKT_focus_bio_fuel_investments: "Investice do biopaliv" # todo: NEW TRANSLATION
 LKT_focus_bio_fuel_investments_desc: "Využitím našeho vzdělávacího systému k diverzifikaci a zlepšení přínosů agrární ekonomiky se nyní můžeme zaměřit na rafinaci a výzkum nových forem biopaliv, která pomohou pohánět naše automobily, domovy i podniky." # todo: NEW TRANSLATION
 LKT_focus_the_farmers_tax_code: "Daňový řád zemědělců" # todo: NEW TRANSLATION
 LKT_focus_the_farmers_tax_code_desc: "Kompletním přepracováním daňového řádu a jeho vybudováním na principu zachování našich agrárních výrobních prostředků můžeme zajistit stabilitu pracovní síly a podporovat investice do budoucích farem a zemědělců našeho národa." # todo: NEW TRANSLATION
 LKT_focus_funding_general_education_improvements: "Financování zlepšení všeobecného vzdělávání" # todo: NEW TRANSLATION
 LKT_focus_funding_general_education_improvements_desc: "Věnování našich rozpočtových prostředků vzdělávání pomůže připravit budoucí generace na podporu našich technologických potřeb, jakmile se objeví zvědavost i samotná potřeba." # todo: NEW TRANSLATION
 LKT_focus_bio_fuel_engineering_institute: "Institut pro inženýrství biopaliv" # todo: NEW TRANSLATION
 LKT_focus_bio_fuel_engineering_institute_desc: "BFEI je specializované výzkumné a vysokoškolské zařízení zaměřené na zlepšení využití a celkové účinnosti biopaliv. Tuto instituci využijeme jako pilíř vzdělávání a zvýšíme účinnost naší hospodářské síly." # todo: NEW TRANSLATION
 LKT_focus_skill_set_education_programs: "Vzdělávací programy dovedností" # todo: NEW TRANSLATION
 LKT_focus_skill_set_education_programs_desc: "SSEP je finanční iniciativa určená k další diverzifikaci a zlepšení obecných dovedností, které mohou naši občané během života získat. Doufáme, že výrazně zlepší zaměstnanost a přinese stabilnější i vyváženější přístup k hospodářskému růstu a rozvoji." # todo: NEW TRANSLATION
 LKT_focus_lakotan_development_fund: "Lakotský rozvojový fond" # todo: NEW TRANSLATION
 LKT_focus_lakotan_development_fund_desc: "Vyčleněním konkrétní části rozpočtu můžeme zajistit cílený rozvoj, který vyrovná a podpoří růst naší ekonomické základny." # todo: NEW TRANSLATION
 LKT_focus_the_fifth_revolution: "Pátá průmyslová revoluce" # todo: NEW TRANSLATION
 LKT_focus_the_fifth_revolution_desc: "Na přelomu tisíciletí prošla industrializace dvěma hlavními etapami. Poté jsme byli svědky třetí etapy v podobě nástupu automatizace a čtvrté v podobě rozmachu umělé inteligence a integrace počítačů nad rámec toho, co se považovalo za možné. Nyní připravujeme půdu pro pátou revoluci, v níž budeme jako národ polí a téměř nulového průmyslu soupeřit dokonce i s modernizací národů Dálného východu." # todo: NEW TRANSLATION
 LKT_focus_rushmore_revival: "Projekt Obroda Rushmore" # todo: NEW TRANSLATION
 LKT_focus_rushmore_revival_desc: "Dakoty jsou symbolem nejen nové neutrálnější nebo nové identity, kterou jsme pro svůj národ zvolili, ale také základní identity zemí, které obýváme. Proto se tyto dva státy musí stát první prioritou naší nové průmyslové revoluce v celém národě." # todo: NEW TRANSLATION
 LKT_focus_rocky_roads_no_more: "Projekt Konec skalnatých cest" # todo: NEW TRANSLATION
 LKT_focus_rocky_roads_no_more_desc: "Naše státy Montana a Wyoming, které hraničí se Skalnatými horami nebo jsou jejich prakticky celými částmi, mají strategický význam. Tyto státy slouží jako spojnice přes pohoří, ale jejich terén zároveň představuje rozvojovou výzvu. Proto je nutné provést rozsáhlé investice do infrastruktury i hospodářského rozvoje, aby tyto státy nezůstaly pozadu." # todo: NEW TRANSLATION
 LKT_focus_kansas_city_kerosene: "Projekt Petrolej Kansas City" # todo: NEW TRANSLATION
 LKT_focus_kansas_city_kerosene_desc: "Státy Kansas a Nebraska mají nevyužitý potenciál. Nacházejí se v nich významná ropná a ložiska zemního plynu, která technicky navazují na texaská ložiska. Tyto zdroje můžeme využít k tomu, abychom náš národ posunuli do čela industrialismu. Díky koordinovanému těžebnímu úsilí a hospodářským investicím můžeme očekávat velké věci." # todo: NEW TRANSLATION
 LKT_focus_rare_earth_energy_act: "Zákon o vzácných zeminách a energii" # todo: NEW TRANSLATION
 LKT_focus_rare_earth_energy_act_desc: "Rozvoj dolů na prvky vzácných zemin a rozšíření domácí energetické kapacity nám umožní nejen pokračovat v růstu průmyslové základny, ale také získat vyjednávací trumfy pro diplomatické úsilí." # todo: NEW TRANSLATION
 LKT_focus_project_nebraska_namesake: "Projekt jmenovkyně Nebrasky" # todo: NEW TRANSLATION
 LKT_focus_project_nebraska_namesake_desc: "Stát Nebraska má mnoho strategických zdrojů, které nebyly prozkoumány v plném měřítku, nebo jde o zcela nedotčené zdroje, o nichž víme. Zahájíme proto rozsáhlou těžební a průzkumnou kampaň, abychom tyto strategické zdroje využili nejen k podpoře industrializace, ale také ke zvýšení našeho potenciálního politického kapitálu v zahraničí." # todo: NEW TRANSLATION
 LKT_focus_business_tax_reforms: "Reforma podnikových daní" # todo: NEW TRANSLATION
 LKT_focus_business_tax_reforms_desc: "S pokračujícím růstem naší průmyslové základny se naše ekonomická struktura stává stále rozmanitější. Musíme proto důkladně přezkoumat a přepracovat daňový řád různých podnikatelských odvětví, abychom zajistili jeho spravedlivou povahu. To by nám mělo umožnit rozšířit přirozené možnosti občanů zakládat nové podniky, spořit vlastní peníze a přispívat k ekonomice jakýmkoli způsobem, který jim vyhovuje." # todo: NEW TRANSLATION
 LKT_focus_peoples_tax_reforms: "Daňové reformy lidu" # todo: NEW TRANSLATION
 LKT_focus_peoples_tax_reforms_desc: "Podnikání se sice daří, ale tyto podniky mohou prosperovat jen natolik, nakolik se daří samotným lidem. Musíme proto zajistit, aby byl daňový řád zjednodušený, modernizovaný a rozumný pro udržení stále více industrializovaného obyvatelstva." # todo: NEW TRANSLATION
 LKT_focus_establishing_lakotan_institute_of_technology: "Lakotský technologický institut" # todo: NEW TRANSLATION
 LKT_focus_establishing_lakotan_institute_of_technology_desc: "Vytvoření LIT představuje průlom v centralizovaném výzkumu a vývoji. Nejenže můžeme soustředit materiální i lidské zdroje do lokalizovanější oblasti, ale tato instituce má také pomoci rozvíjet a zdokonalovat známé vědy podle nejlepších schopností všech." # todo: NEW TRANSLATION
 LKT_focus_national_investment_progrmas: "Národní investiční programy" # todo: NEW TRANSLATION
 LKT_focus_national_investment_progrmas_desc: "Nyní, když je naše ekonomika na správné cestě a věci vypadají stále lépe, můžeme zpomalit a nastavit stabilní kurz. Obecné investice napříč rozpočtovými programy umožní našim lidem specializovat se, růst a přizpůsobovat se neustále se měnící ekonomice moderní doby." # todo: NEW TRANSLATION
 LKT_focus_a_new_economy: "Nová ekonomika" # todo: NEW TRANSLATION
 LKT_focus_a_new_economy_desc: "Nyní, když je ekonomika zajištěna, se můžeme zaměřit na politiku. Obecně jsme se posunuli o krok blíže k tomu, abychom se dívali za hranice našich vnitřních záležitostí." # todo: NEW TRANSLATION
 LKT_focus_department_of_energy: "Ministerstvo energetiky" # todo: NEW TRANSLATION
 LKT_focus_department_of_energy_desc: "Mít ekonomiku je sice hezké, ale nic neznamená, pokud ji nedokážeme skutečně pohánět a využívat. Zřídíme proto Lakotské ministerstvo energetiky, abychom tento problém vyřešili." # todo: NEW TRANSLATION
 LKT_focus_fueling_agrarianism: "Pohánění agrarismu" # todo: NEW TRANSLATION
 LKT_focus_fueling_agrarianism_desc: "Protože národní ekonomika spočívá v zemědělské nadvládě, musíme rozvíjet a přizpůsobit naši energetiku takovým nárokům. Dobrou zprávou je, že při správných investicích nemusíme energetickou infrastrukturu skutečně rozšiřovat; stačí rozvinout způsob, jakým palivo putuje od zdrojů k těm, kteří ho potřebují více než ostatní." # todo: NEW TRANSLATION
 LKT_focus_bio_fuel_prominence: "Význam biopaliv" # todo: NEW TRANSLATION
 LKT_focus_bio_fuel_prominence_desc: "Díky cílevědomému a neúnavnému rozvoji biopaliv a infrastruktury, kterou kolem nich musíme vybudovat, můžeme vytvořit účinnější a hojnější formu energie. Pomůže nám to snížit celkovou poptávku i potenciální náklady na využívání půdy a zdrojů, které lze vyhradit pro důležitější potřeby lidu a národa." # todo: NEW TRANSLATION
 LKT_focus_fueling_tomorrows_economy: "Palivo zítřejší ekonomiky" # todo: NEW TRANSLATION
 LKT_focus_fueling_tomorrows_economy_desc: "Naše potřeby jsou rozsáhlé, ale naše země a zdroje ještě rozsáhlejší. Musíme rozvinout energetický sektor, aby byly naše současné i budoucí požadavky zajištěny domácími prostředky." # todo: NEW TRANSLATION
 LKT_focus_a_new_green_deal: "Nová zelená dohoda" # todo: NEW TRANSLATION
 LKT_focus_a_new_green_deal_desc: "Nová zelená dohoda neboli NGD je komplexní investiční plán do energetiky, který má rozvíjet a zajistit co nejúčinnější a doslova jediný skutečně zelený způsob výroby energie, jenž současné a snad i budoucí objevy umožní. Menší a účinnější elektrárny, omezené investice do recyklace vyhořelého paliva — zkrátka všechno a ještě něco navíc." # todo: NEW TRANSLATION
 LKT_focus_finalizing_doe_capabilities: "Dokončení schopností DoE" # todo: NEW TRANSLATION
 LKT_focus_finalizing_doe_capabilities_desc: "Nyní, když je náš energetický sektor v souladu s hospodářskými potřebami, můžeme pracovat na synergii těchto dvou oblastí a posunout náš národ do budoucnosti, kterou vytvoříme." # todo: NEW TRANSLATION
 LKT_focus_increased_funding_for_donr: "Zvýšené financování DoNR" # todo: NEW TRANSLATION
 LKT_focus_increased_funding_for_donr_desc: "Většími investicemi do získávání přírodních zdrojů ukrytých přímo pod našima nohama můžeme zajistit soběstačnější ekonomiku, nebo přinejmenším ekonomiku vyváženější." # todo: NEW TRANSLATION
 LKT_focus_massive_investments: "Masivní investice" # todo: NEW TRANSLATION
 LKT_focus_massive_investments_desc: "Abychom získali vše potřebné, investujeme co nejvíce a získáme co nejvíce různých nerostných zdrojů, kolik jen bude možné." # todo: NEW TRANSLATION
 LKT_focus_need_by_need_investment_strategy: "Investiční strategie podle potřeb" # todo: NEW TRANSLATION
 LKT_focus_need_by_need_investment_strategy_desc: "Naše těžební úsilí by mělo doplňovat hlavní hospodářské snahy. Do Ministerstva přírodních zdrojů proto budeme investovat podle aktuálních potřeb, abychom udrželi poptávku pod kontrolou." # todo: NEW TRANSLATION
 LKT_focus_iron_ore_revival: "Zákon o obnově železné rudy" # todo: NEW TRANSLATION
 LKT_focus_iron_ore_revival_desc: "Naše ložiska železné rudy jsou přinejlepším nevyužitá a kvůli minulým chybám dokonce částečně ztracená. To se však nyní změní. Investicemi v Jižní Dakotě, Kansasu a Montaně, abychom jmenovali alespoň několik oblastí, rozšíříme stávající provozy a znovu otevřeme staré, například ten v Kansasu, který byl předčasně uzavřen kvůli obavám o životní prostředí. Úklid a další práce mohou být poněkud nákladné, ale významná produkce železné rudy znamená zdravé domácí zásoby jednoho z klíčových materiálů moderního světa — oceli." # todo: NEW TRANSLATION
 LKT_focus_bauxite_brawls_act: "Zákon o bauxitových potyčkách" # todo: NEW TRANSLATION
 LKT_focus_bauxite_brawls_act_desc: "Zajištění přístupu k pružněji využitelným kovům nám umožní rozvíjet civilní i vojenské aplikace. Obnova, rozšiřování a investice do energeticky náročnějších těžebních lokalit se proto z dlouhodobého hlediska vyplatí." # todo: NEW TRANSLATION
 LKT_focus_precious_mines_act: "Zákon o drahocenných dolech" # todo: NEW TRANSLATION
 LKT_focus_precious_mines_act_desc: "Více států má ložiska prvků vzácných zemin. Budeme proto investovat do otevírání a rozšiřování provozů až na potenciálně komerční úroveň, abychom zajistili maximální rozmanitost naší ekonomiky. Koneckonců více domácích materiálů znamená větší zahraniční zájem." # todo: NEW TRANSLATION
 LKT_focus_rubber_stamp_act: "Zákon gumového razítka" # todo: NEW TRANSLATION
 LKT_focus_rubber_stamp_act_desc: "Máme rozsáhlou domácí produkci ropy. Část z ní lze strategicky přesměrovat na výrobu syntetických chemikálií a kaučuku, abychom zajistili maximální rozmanitost zdrojů v našich zemích." # todo: NEW TRANSLATION
 LKT_focus_lakotan_military_development_board: "Lakotská rada vojenského rozvoje" # todo: NEW TRANSLATION
 LKT_focus_lakotan_military_development_board_desc: "LMDB má zefektivnit rozvoj a posilování našich vojenských schopností. Vzhledem k tomu, že se musíme starat v podstatě jen o dvě služební složky, by to mělo být přímočaré. Někteří příslušníci, kteří dříve sloužili v námořnictvu staré republiky, však doufají, že jednoho dne vytvoří Lakotské námořnictvo. Prozatím se budeme věnovat armádě a letectvu." # todo: NEW TRANSLATION
 LKT_focus_military_refinement: "Zdokonalení armády" # todo: NEW TRANSLATION
 LKT_focus_military_refinement_desc: "Po metodě pokusů a omylů, s množstvím investic do materiálu i personálu a s pomocí samotného času jsme konečně vytvořili alespoň jednu pevně ustavenou složku ozbrojených sil, která zajistí národní obranu a bezpečnost našich občanů i jejich domovů." # todo: NEW TRANSLATION
 LKT_focus_lakotan_army_pay_standards: "Platové standardy lakotské armády" # todo: NEW TRANSLATION
 LKT_focus_lakotan_army_pay_standards_desc: "Zajištění důstojného platu a možnosti, aby se naši vojáci postarali nejen o sebe, ale případně i o své blízké doma, pasivně zvýší morálku. Vyšší oddanost se navíc pravděpodobně projeví v rychlosti výcviku i v kvalitě vojáků, které z něj dokážeme získat." # todo: NEW TRANSLATION
 LKT_focus_establishing_arms_contractors: "Zřízení zbrojních dodavatelů" # todo: NEW TRANSLATION
 LKT_focus_establishing_arms_contractors_desc: "Vytvoření specializovaného zbrojního průmyslu, který podpoří hlavní oporu naší národní obrany, je zásadní. Zajistíme proto financování, aby naše jednotky měly stabilní přísun kvalitní výzbroje." # todo: NEW TRANSLATION
 LKT_focus_sundance_war_college: "Válečná akademie Sundance" # todo: NEW TRANSLATION
 LKT_focus_sundance_war_college_desc: "Vytvořením specializovaného vojenského vzdělávacího institutu můžeme připravit budoucí poddůstojníky i důstojníky na zítřejší bojiště. Budeme je cvičit v taktice, vedení a delegování odpovědnosti. Především je naučíme přizpůsobivosti, protože každý dobrý voják by měl vždy chápat, že pokud se něco může pokazit, nejspíš se to pokazí." # todo: NEW TRANSLATION
 LKT_focus_butte_testing_facilities: "Testovací zařízení Butte" # todo: NEW TRANSLATION
 LKT_focus_butte_testing_facilities_desc: "Vytvořením specializovaného komplexu pro testování a výzkum a vývoj zajistíme neustále rostoucí kvalitu našich jednotek, aby byly připraveny na budoucí konflikty." # todo: NEW TRANSLATION
 LKT_focus_research_mania: "Výzkumné šílenství" # todo: NEW TRANSLATION
 LKT_focus_research_mania_desc: "Výzkum a vývoj, o to tu jde. Výrazně investujeme do vývoje nové výzbroje, munice a podpůrného vybavení, abychom zajistili, že kvalita našich jednotek bude výrazně převyšovat ty, kteří nám chtějí jakkoli ublížit." # todo: NEW TRANSLATION
 LKT_focus_geneva_compliant_munitions: "„Ženevsky vyhovující“ munice" # todo: NEW TRANSLATION
 LKT_focus_geneva_compliant_munitions_desc: "Samozřejmě musíme v očích mezinárodního společenství vypadat dobře, ale to neznamená, že nemůžeme testovat hranice možností. Nebo snad ano?" # todo: NEW TRANSLATION
 LKT_focus_experiemental_weapons_platoon: "Četa experimentálních zbraní" # todo: NEW TRANSLATION
 LKT_focus_experiemental_weapons_platoon_desc: "EWP bude specializovanou jednotkou širšího „sboru experimentálních zbraní“. Tato podřízená část naší armády určí podpůrné čety, které budou pomáhat s testováním v terénu a poskytnou jednotkám v nesnázích či obtížné situaci potřebnou podporu, kdykoli o ni požádají. EWP bude většinou tvořit experimentální výzbroj proti čemukoli a bude se přizpůsobovat požadavkům armády na neustále se měnícím bojišti." # todo: NEW TRANSLATION
 LKT_focus_the_corps: "„Sbor“" # todo: NEW TRANSLATION
 LKT_focus_the_corps_desc: "Zřízení Sboru experimentálních zbraní nám umožní v co největší a nejpružnější míře směrovat financování, výcvik i testování. Tento nový výzkumný a vývojový sbor bude majákem, který nás povede a pomůže nám bránit se všem nepřátelům našich zemí." # todo: NEW TRANSLATION
 LKT_focus_logistical_primacy: "Škola logistické nadřazenosti" # todo: NEW TRANSLATION
 LKT_focus_logistical_primacy_desc: "Zaměřením na logistiku vedení války můžeme své nepřátele vyčerpat čistě opotřebovávacími prostředky, pokud se situace skutečně zvrhne v takovou bídu." # todo: NEW TRANSLATION
 LKT_focus_bread_and_butter_doctrine: "Doktrína chleba a másla" # todo: NEW TRANSLATION
 LKT_focus_bread_and_butter_doctrine_desc: "Přeorientováním ekonomického myšlení na konflikt o přežití pomohou preventivní přídělová opatření i správně strategicky umístěné sklady potravin nejen naší armádě, ale také jakémukoli úsilí o obnovu." # todo: NEW TRANSLATION
 LKT_focus_supply_heroes: "Hrdinové zásobování" # todo: NEW TRANSLATION
 LKT_focus_supply_heroes_desc: "Bez zásob kulky nelétají. Bez ohledu na pedantské definice hrdinství se všichni shodneme, že každý má schopnost vyniknout ve svém oboru a stát se hrdinou, kterého lidé potřebují. Proto budeme podporovat zásobovací sbor a zavádět specializovaný výcvik v zásobování a logistice, abychom zajistili maximální soudržnost mezi dodavatelskými řetězci a jednotkami, kterým slouží." # todo: NEW TRANSLATION
 LKT_focus_logistics_corps_training_programs: "Výcvikové programy logistického sboru" # todo: NEW TRANSLATION
 LKT_focus_logistics_corps_training_programs_desc: "Otevřít armádu lidem ze všech společenských vrstev neznamená, že musí být všichni pěšáky v první linii. A „POG“ nemusí vždy kazit náladu pěšákům v první linii. Proto vytvoříme nový výcvik a specializovanou doktrínu pro logistický sbor, abychom zajistili soudržnost fronty, efektivitu zásobovacích tras a celkovou účinnost armády na bojišti." # todo: NEW TRANSLATION
 LKT_focus_lakotan_air_force_training_improvements: "Zlepšení výcviku lakotského letectva" # todo: NEW TRANSLATION
 LKT_focus_lakotan_air_force_training_improvements_desc: "Řádnou standardizací kvalifikačních kritérií chceme vytvořit novou elitu pilotů z hlediska účinnosti v bojových situacích." # todo: NEW TRANSLATION
 LKT_focus_fighter_priority_structure: "Struktura priority stíhaček" # todo: NEW TRANSLATION
 LKT_focus_fighter_priority_structure_desc: "Organizační iniciativa FPS přeorientuje hlavní funkci letectva na stíhací letouny. Výcvik a složení jednotek zajistí přednost stíhaček před letouny pozemní podpory nebo strategickými bombardéry. To málo, co vyrobíme, by mělo být schopné létat bez obtěžování nepřátelskými letouny všude, kde budou naše stíhačky." # todo: NEW TRANSLATION
 LKT_focus_fighter_supremacy_doctrine: "Doktrína nadvlády stíhaček" # todo: NEW TRANSLATION
 LKT_focus_fighter_supremacy_doctrine_desc: "Rozvoj letecké doktríny založené výhradněji na stíhačkách má zajistit úplnou a naprostou kontrolu oblohy. Bez ohledu na to, kde nám budou chybět bombardéry nebo pozemní podpora, si zajistíme volné cvičiště pro tyto složky díky neomezené vzdušné převaze." # todo: NEW TRANSLATION
 LKT_focus_ground_support_priority_structure: "Struktura priority pozemní podpory" # todo: NEW TRANSLATION
 LKT_focus_ground_support_priority_structure_desc: "Organizační iniciativa GSPS přeorientuje letectvo na přednostní vývoj a nasazení letounů pozemní podpory. I když nám může chybět úplná vzdušná převaha, měli bychom být schopni udeřit na nepřítele ze vzduchu a stáhnout se, čímž zajistíme alespoň stabilitu fronty." # todo: NEW TRANSLATION
 LKT_focus_ground_support_supremacy_doctrine: "Doktrína nadvlády pozemní podpory" # todo: NEW TRANSLATION
 LKT_focus_ground_support_supremacy_doctrine_desc: "Rozvoj letecké doktríny upřednostňující letouny pozemní podpory zajistí stabilitu fronty a zároveň připraví nepřítele o schopnost dlouhodobě bojovat. Poškození organizace dokáže jen tolik, ale pokud zničíme nepřítelovy zásoby a vybavení, nebude moci bojovat vůbec." # todo: NEW TRANSLATION
 LKT_focus_strategic_bomber_priority_structure: "Struktura priority strategických bombardérů" # todo: NEW TRANSLATION
 LKT_focus_strategic_bomber_priority_structure_desc: "Organizační iniciativa SBPS umožní našemu letectvu zlomit vůli nepřítele k boji. Průmysl a infrastruktura jsou pro každý národ během vleklého konfliktu kriticky důležité. Budeme proto vyvíjet strategické bombardéry, které tyto válečné stroje zničí a přetnou silnice i železnice, jež našim nepřátelům umožňují pokoušet se nám ublížit." # todo: NEW TRANSLATION
 LKT_focus_strategic_bomber_supremacy_doctrine: "Doktrína nadvlády strategických bombardérů" # todo: NEW TRANSLATION
 LKT_focus_strategic_bomber_supremacy_doctrine_desc: "Zdokonalením letecké doktríny kolem strategických bombardérů připravíme nepřítele o schopnost proti nám bojovat. Bez ekonomiky a zbrojního průmyslu nemůže vyzbrojit ani zaměstnat své obyvatelstvo. Nakonec možná nedosáhneme rychlé války, ale zajistíme, že nikdo nezničí náš lid a země, které bráníme." # todo: NEW TRANSLATION
 LKT_focus_clear_skies_for_all: "Jasná obloha pro všechny" # todo: NEW TRANSLATION
 LKT_focus_clear_skies_for_all_desc: "Zdokonalení a zlepšení našeho letectva bude vystaveno na odiv všem. Podpora organizovaných leteckých přehlídek a výcvikových akcí pro veřejnost nám umožní občanům ukázat, že náš národ bude mít po mnoho dní jasnou oblohu." # todo: NEW TRANSLATION
 LKT_focus_creating_a_real_navy: "Vytvoření skutečného námořnictva" # todo: NEW TRANSLATION
 LKT_focus_creating_a_real_navy_desc: "Konečně nastal den, kdy můžeme vytvořit skutečné námořnictvo, a ne jen několik kapitánů pro sjíždění řek. Cesta však bude únavná, protože řeka není nic jako otevřený oceán." # todo: NEW TRANSLATION
 LKT_focus_early_ship_construction_efforts: "Počáteční úsilí o stavbu lodí" # todo: NEW TRANSLATION
 LKT_focus_early_ship_construction_efforts_desc: "Naše námořní síla možná nikdy nebude „špičková“, ale rozhodně můžeme začít od základů." # todo: NEW TRANSLATION
 LKT_focus_formalizing_naval_training_programs: "Formalizace námořních výcvikových programů" # todo: NEW TRANSLATION
 LKT_focus_formalizing_naval_training_programs_desc: "Konečným přijetím skutečného výcvikového programu s pomocí prostředí našich nových pobřežních vod můžeme zajistit, že kvalita našeho námořního personálu bude na úctyhodné úrovni." # todo: NEW TRANSLATION
 LKT_focus_our_naval_priority: "Naše námořní priorita" # todo: NEW TRANSLATION
 LKT_focus_our_naval_priority_desc: "Vytvořením nové priority námořního rozvoje stanovíme alespoň jakýsi standard, na němž mohou budoucí generace stavět." # todo: NEW TRANSLATION
 LKT_focus_naval_command_structure: "Velitelská struktura námořnictva" # todo: NEW TRANSLATION
 LKT_focus_naval_command_structure_desc: "Námořní složka LAF byla považována přinejlepším za žert a přinejhorším za trest. S nabytím nových pobřežních pozemků a zahájením stavby oceánských plavidel však musíme tento žert proměnit ve vážnou a hmatatelnou složku služeb. Proto vytvoříme LNCS neboli Lakotskou velitelskou strukturu námořnictva, která usnadní a ustaví budoucí pokrok k námořní dokonalosti." # todo: NEW TRANSLATION
 LKT_focus_gulf_dry_docking_facilities: "Zařízení suchých doků v zálivu" # todo: NEW TRANSLATION
 LKT_focus_gulf_dry_docking_facilities_desc: "Rozšíření našeho úsilí o stavbu lodí nám umožní přizpůsobit se a rozvíjet naše námořnictvo." # todo: NEW TRANSLATION
 LKT_focus_mid_atlantic_shipping_investments: "Investice do středního Atlantiku" # todo: NEW TRANSLATION
 LKT_focus_mid_atlantic_shipping_investments_desc: "Pokud chceme pokrýt celé toto území, musíme pokračovat v úsilí o rozšíření našeho námořnictva." # todo: NEW TRANSLATION
 LKT_focus_beyond_the_plains: "Za hranicemi plání" # todo: NEW TRANSLATION
 LKT_focus_beyond_the_plains_desc: "Nyní, když je naše vlast stabilizovaná a prosperující, musíme myslet za hranice. To, zda usilujeme o expanzi, není podstatné, protože musíme hledět dál už jen proto, že mnozí ostatní hledí za své hranice. Musíme rozhodnout, jaká bude naše budoucnost." # todo: NEW TRANSLATION
 LKT_focus_A_New_Destiny: "Nový osud" # todo: NEW TRANSLATION
 LKT_focus_A_New_Destiny_desc: "Mandát byl ztracen a národy severoamerického kontinentu se ho snaží znovu získat. Z pověstí o těchto zemích víme, že je to pravda, a proto si vydobyjeme své místo a zvítězíme. Je naším osudem jej naplnit, nikoli osudem východu či západu." # todo: NEW TRANSLATION
 LKT_focus_eyeing_the_borderlands: "Pohled k pohraničí" # todo: NEW TRANSLATION
 LKT_focus_eyeing_the_borderlands_desc: "Náš osud začíná prvními kroky za vlastními hranicemi. Proto musíme zajistit, aby naše první kroky vedly právě k jejich rozšíření." # todo: NEW TRANSLATION
 LKT_focus_the_pacific_shores: "Tichomořské břehy" # todo: NEW TRANSLATION
 LKT_focus_the_pacific_shores_desc: "Náš západ slunce bude spočívat v mořském vánku tichomořského pobřeží. Západ je alespoň kratší vzdálenost než východ." # todo: NEW TRANSLATION
 LKT_focus_great_lakes_great_takes: "Velká jezera, velké zisky" # todo: NEW TRANSLATION
 LKT_focus_great_lakes_great_takes_desc: "Expanze na východ znamená, že budeme čelit rozsáhlým a rozmanitým zemím. Musíme využít své schopnosti, abychom pochopili a dokázali se pohybovat v rozlehlosti regionu Velkých jezer." # todo: NEW TRANSLATION
 LKT_focus_southern_summaries: "Jižní souhrny" # todo: NEW TRANSLATION
 LKT_focus_southern_summaries_desc: "Od bažin po horské výšiny bude jižní oblast USA pravděpodobně nejtěžší na překonání. Budeme proto potřebovat praxi, studium a výcvik, abychom tyto výzvy zvládli, zatímco se budeme snažit zajistit tyto budoucí země." # todo: NEW TRANSLATION
 LKT_focus_northeastern_needs: "Potřeby severovýchodu" # todo: NEW TRANSLATION
 LKT_focus_northeastern_needs_desc: "Hory a lesy, kam až oko dohlédne. K překonání těchto zemí budeme potřebovat čas a bezpochyby i energii." # todo: NEW TRANSLATION
 LKT_focus_manifesting_strength_for_our_destiny: "Síla pro náš osud" # todo: NEW TRANSLATION
 LKT_focus_manifesting_strength_for_our_destiny_desc: "Musíme se připravovat a dál budovat naše síly. Osud, který jsme se rozhodli vytvořit, bude časem náš." # todo: NEW TRANSLATION
 LKT_focus_operation_cascadian_calamity: "Operace Kaskádská pohroma" # todo: NEW TRANSLATION
 LKT_focus_operation_cascadian_calamity_desc: "Začíná naše velká křížová výprava za bezpečností kontinentu. Začneme u nejbližší oblasti naší moci, kterou je Kaskádie. Hory budou náročné, ale poslouží jako skvělé cvičiště pro naše vojáky." # todo: NEW TRANSLATION
 LKT_focus_operation_san_jose: "Operace San Jose" # todo: NEW TRANSLATION
 LKT_focus_operation_san_jose_desc: "Postup po západním pobřeží nám umožní vytvořit vlastní zeď, kterou bude Tichý oceán. Další krok k bezpečnosti kontinentu bude zajištěn, jakmile ovládneme Kalifornii." # todo: NEW TRANSLATION
 LKT_focus_operation_sierra_mist: "Operace Sierra Mist" # todo: NEW TRANSLATION
 LKT_focus_operation_sierra_mist_desc: "Zajištění energeticky bohatého jihozápadu i zbytku Skalnatých hor nám umožní vytvořit skvělou obrannou linii pro případ, že by cokoli proniklo na naše západní pobřeží." # todo: NEW TRANSLATION
 LKT_focus_operation_sam_houston: "Operace Sam Houston" # todo: NEW TRANSLATION
 LKT_focus_operation_sam_houston_desc: "Zajištění nejvýraznější identity na severoamerickém kontinentu znamená zajištění vůle různých národů. Texaští lidé jsou hrdí a nezávisle smýšlející, a jejich zajištění nám otevře cestu k případným výpadům na východ." # todo: NEW TRANSLATION
 LKT_focus_reorganizing_civil_services: "Reorganizace civilních služeb" # todo: NEW TRANSLATION
 LKT_focus_reorganizing_civil_services_desc: "Vytvoření nových standardizovaných civilních služeb nám umožní lépe spravovat území a zlepšit integrační úsilí, aby se lidé mohli oprostit od nedávných válek. Nebude to dokonalé, ale rozhodně je to krok správným směrem." # todo: NEW TRANSLATION
 LKT_focus_operation_rustic: "Operace Rustic" # todo: NEW TRANSLATION
 LKT_focus_operation_rustic_desc: "Náš pochod na východ začíná. Severní cesta nám nabídne více plání, zvlněných kopců a lesů. Nebude to snadná procházka, ale poslouží jako dobrá příprava před jižním postupem." # todo: NEW TRANSLATION
 LKT_focus_operation_charleston: "Operace Charleston" # todo: NEW TRANSLATION
 LKT_focus_operation_charleston_desc: "Od Mississippi k Atlantiku pochodujeme zajistit jižní trasu a spojit se od moře k zářivému moři." # todo: NEW TRANSLATION
 LKT_focus_operation_north_east_corridor: "Operace Severovýchodní koridor" # todo: NEW TRANSLATION
 LKT_focus_operation_north_east_corridor_desc: "Poslední úsek k obnovení mandátu. Tím získáme úplnou kontrolu nad kontinentální republikou a zajistíme svůj osud... vlastně ještě musíme obnovovat, ale to odbočuji." # todo: NEW TRANSLATION
 LKT_focus_west_coast_cleanup: "Úklid západního pobřeží" # todo: NEW TRANSLATION
 LKT_focus_west_coast_cleanup_desc: "Nyní, když máme národ pod kontrolou, se můžeme zaměřit na úklid a obnovu válkou zpustošených zemí. Nejlepší bude začít na západě a postupovat směrem na východ." # todo: NEW TRANSLATION
 LKT_focus_south_central_rebuilding: "Obnova jihu a středu" # todo: NEW TRANSLATION
 LKT_focus_south_central_rebuilding_desc: "Po zajištění západu se nyní můžeme zaměřit na naše hlavní úkoly, v tomto případě na státy, které dokončují západní polovinu nové republiky. Konsolidace těchto území nám ponechá pouze vše na východ od Mississippi, což by mělo být rychle hotové." # todo: NEW TRANSLATION
 LKT_focus_mississippi_miracle: "Mississippský zázrak" # todo: NEW TRANSLATION
 LKT_focus_mississippi_miracle_desc: "Pochod na východ začíná a překročením Mississippi můžeme obnovit a začlenit jižní státy do nového národa." # todo: NEW TRANSLATION
 LKT_focus_reviving_the_rustbelt: "Obnova Rezavého pásu" # todo: NEW TRANSLATION
 LKT_focus_reviving_the_rustbelt_desc: "Obnova a návrat hospodářské stability do starých států Rezavého pásu pomůže začlenit tyto země i jejich obyvatele." # todo: NEW TRANSLATION
 LKT_focus_northeast_renewal: "Obnova severovýchodu" # todo: NEW TRANSLATION
 LKT_focus_northeast_renewal_desc: "Poslední úsek. Začlenění těchto posledních států zajistí jednotu od Tichého oceánu k Atlantiku." # todo: NEW TRANSLATION
 LKT_focus_the_second_republic: "Druhá republika" # todo: NEW TRANSLATION
 LKT_focus_the_second_republic_desc: "Cesta byla dlouhá a nákladná, ale do zemí se vrátil mír a na severoamerickém kontinentu se znovu objevila jednota. Zbývá učinit poslední krok k zajištění budoucnosti, kterou jsme se rozhodli vytvořit." # todo: NEW TRANSLATION
 LKT_focus_Containment_Plan_West: "Západní zadržovací plán" # todo: NEW TRANSLATION
 LKT_focus_Containment_Plan_West_desc: "Expanze je pro přežití v tomto nestabilním a nepřátelském světě zásadní. Nový svět je rozbitý a my si musíme vybojovat jeho část. Kamberský plán neboli Západní zadržovací plán nám umožní upevnit kontrolu nad vším západně od Mississippi. To by mělo posílit a vytvořit nový a stabilnější pocit bezpečí pro náš lid." # todo: NEW TRANSLATION
 LKT_focus_war_plan_purple: "Válečný plán Purpurový" # todo: NEW TRANSLATION
 LKT_focus_war_plan_purple_desc: "Jedním z prvních kroků k zajištění západní poloviny severoamerického kontinentu bude zajištění našeho křídla. Kaskádie nám proto stojí v cestě za tichomořskou dovolenou." # todo: NEW TRANSLATION
 LKT_focus_war_plan_skorpion: "Válečný plán Skorpion" # todo: NEW TRANSLATION
 LKT_focus_war_plan_skorpion_desc: "Zajištění energeticky bohatého regionu jihozápadních států pomůže posílit naši hospodářskou stabilitu a zároveň nám poskytne významnou výhodu proti západním soupeřům." # todo: NEW TRANSLATION
 LKT_focus_war_plan_yellow: "Válečný plán Žlutý" # todo: NEW TRANSLATION
 LKT_focus_war_plan_yellow_desc: "Zajištěním tichomořského pobřeží ovládneme přibližně polovinu západních zemí. Budeme si dál nárokovat svou budoucnost a upevňovat základy nové cesty vpřed." # todo: NEW TRANSLATION
 LKT_focus_war_plan_blue: "Válečný plán Modrý" # todo: NEW TRANSLATION
 LKT_focus_war_plan_blue_desc: "Texas představuje předposlední dílek západní skládačky, kterou se snažíme sestavit. Oklahoma by byla posledním dílkem, ale nejsme si přesně jisti, co by politicky znamenalo překročení Mississippi, takže tuto debatu můžeme odložit na později." # todo: NEW TRANSLATION
 LKT_focus_consolidating_the_territories: "Konsolidace území" # todo: NEW TRANSLATION
 LKT_focus_consolidating_the_territories_desc: "Nyní, když je západ pod naší kontrolou, musíme pracovat na začlenění a přetvoření zemí i lidí v nový národ." # todo: NEW TRANSLATION
 LKT_focus_pacific_pearls: "Tichomořské perly" # todo: NEW TRANSLATION
 LKT_focus_pacific_pearls_desc: "Úsilí o začlenění a obnovu tichomořských států pomůže znovu otevřít velkou část světa obchodu a turistice našeho národa. Revitalizace přístavů a turistických center je pro další postup zásadní." # todo: NEW TRANSLATION
 LKT_focus_southern_sunrise: "Jižní východ slunce" # todo: NEW TRANSLATION
 LKT_focus_southern_sunrise_desc: "Obnova energeticky bohatého jihozápadu a hospodářsky obdařeného státu Texas poskytne našemu národu tolik potřebný impuls ke stabilitě a prosperitě." # todo: NEW TRANSLATION
 LKT_focus_the_western_identity: "Západní identita" # todo: NEW TRANSLATION
 LKT_focus_the_western_identity_desc: "Sjednocením těchto zemí vyhlašujeme nový národ, nový lid a novou kulturu pro budoucnost." # todo: NEW TRANSLATION
 LKT_focus_The_Great_Barrier_Plan: "Velký bariérový plán" # todo: NEW TRANSLATION
 LKT_focus_The_Great_Barrier_Plan_desc: "V zásadě by nikdo neměl mít přímou kontrolu nad tak rozsáhlým územím. Měli bychom to proto změnit a zajistit stabilitu na severoamerickém kontinentu. Pokud dokážeme konsolidovat střed a loutkově ovládnout nebo si koupit loajalitu východu a západu, můžeme vytvořit jakousi Severoamerickou konfederativní unii... pravděpodobně potřebuje lepší název." # todo: NEW TRANSLATION
 LKT_focus_vegas_odds: "Šance Vegas" # todo: NEW TRANSLATION
 LKT_focus_vegas_odds_desc: "Země unie nepotřebujeme celé, a proto toho využijeme při jejich získávání pro budoucnost, o kterou usilujeme." # todo: NEW TRANSLATION
 LKT_focus_texas_tussle: "Texaská tahanice" # todo: NEW TRANSLATION
 LKT_focus_texas_tussle_desc: "Cílem Velké bariéry bude zajistit centrální státy přibližného geografického středu severoamerického kontinentu. Tento první krok s Texasem pomůže připravit půdu pro další výpady na jih." # todo: NEW TRANSLATION
 LKT_focus_western_consolidation: "Západní konsolidace" # todo: NEW TRANSLATION
 LKT_focus_western_consolidation_desc: "Konsolidace loutkového území, které s námi sousedí, umožní rovnoměrnější rozdělení území. Naše nová loutka tak získá větší motivaci, až se vydáme k tichomořskému pobřeží." # todo: NEW TRANSLATION
 LKT_focus_the_great_war: "Velká válka" # todo: NEW TRANSLATION
 LKT_focus_the_great_war_desc: "Velká kontinentální válka začne zajištěním území u zálivu Jižní republiky. Jižní státy sice rozhodně nepotřebujeme, ale jejich neschopnost vzdát se Oklahomy znamená, že nemáme jinou možnost. Navíc tím zajistíme, že žádná východní mocnost nebude moci dostatečně zesílit a ohrozit nás i jih." # todo: NEW TRANSLATION
 LKT_focus_eastern_consolidation: "Východní konsolidace" # todo: NEW TRANSLATION
 LKT_focus_eastern_consolidation_desc: "Po skončení Velké kontinentální války můžeme začlenit centrální státy, které jsme chtěli, a zároveň zajistit jižní státy s ujištěním, že nebudou přímo anektovány." # todo: NEW TRANSLATION
 LKT_focus_cartel_cleanup: "Úklid kartelů" # todo: NEW TRANSLATION
 LKT_focus_cartel_cleanup_desc: "Jižním cílem Velkého bariérového plánu je získání Mexika. Jaké lepší ospravedlnění bychom mohli mít než uklidit chaotické kartely, které ochromují národ?" # todo: NEW TRANSLATION
 LKT_focus_reorganizing_mexican_territories: "Reorganizace mexických území" # todo: NEW TRANSLATION
 LKT_focus_reorganizing_mexican_territories_desc: "Rozdělením území Mexika můžeme zvýhodnit naši západní loutku a zároveň upevnit svou moc nad současnou situací." # todo: NEW TRANSLATION
 LKT_focus_securing_the_western_coastline: "Zajištění západního pobřeží" # todo: NEW TRANSLATION
 LKT_focus_securing_the_western_coastline_desc: "S téměř západními státy pod kontrolou a jižní frontou zajištěnou se nyní můžeme podívat na daleký západ a tichomořské pobřeží. Zajištění těchto zemí nás připraví na poslední výzvu před námi." # todo: NEW TRANSLATION
 LKT_focus_dividing_up_the_west: "Rozdělení západu" # todo: NEW TRANSLATION
 LKT_focus_dividing_up_the_west_desc: "Nyní, když máme západní země pod kontrolou, je na nás, jak je rozumně rozdělit, abychom podpořili jednotu a schopnost spolupracovat a postupovat společně." # todo: NEW TRANSLATION
 LKT_focus_improving_the_homefront: "Zlepšení domácí fronty" # todo: NEW TRANSLATION
 LKT_focus_improving_the_homefront_desc: "Konsolidací a prací na soudržnosti našich současných zisků připravíme půdu pro zajištění posledního cíle plánu. Severní dobytí začne co nevidět, ale jak se s ním vypořádat, je další otázka." # todo: NEW TRANSLATION
 LKT_focus_northern_investment_opportunity: "Příležitost k severním investicím" # todo: NEW TRANSLATION
 LKT_focus_northern_investment_opportunity_desc: "Musíme spolupracovat s Kanadou, aby naše národy mohly fungovat společně. Investice do infrastruktury prostřednictvím železnic nás proto lépe propojí." # todo: NEW TRANSLATION
 LKT_focus_operation_polar_bear: "Operace Lední medvěd" # todo: NEW TRANSLATION
 LKT_focus_operation_polar_bear_desc: "Vydáme se na sever, abychom zajistili zbytek naší bariéry a tím i budoucnost, kterou si přejeme vytvořit." # todo: NEW TRANSLATION
 LKT_focus_the_northern_concessions: "Severní ústupky" # todo: NEW TRANSLATION
 LKT_focus_the_northern_concessions_desc: "Po zajištění severu musíme znovu rozdělit území a zajistit stabilitu na severoamerickém kontinentu pro budoucí generace." # todo: NEW TRANSLATION
 LKT_focus_the_continental_confederation: "Kontinentální konfederace" # todo: NEW TRANSLATION
 LKT_focus_the_continental_confederation_desc: "Naše národy stojí hrdě a sjednoceně, protože nový svět našel novou jednotu pod bývalým lakotským praporem. Společně proto vytvoříme nový název pro nový národ — národ, který usiluje o sjednocení lidí, nikoli zemí. Až budou připraveni, vytvoříme sjednocenou Severní Ameriku." # todo: NEW TRANSLATION
 LKT_country_flag_elections: "Volby začínají" # todo: NEW TRANSLATION
 LKT_Canadian_War_Goal_Unlock: "Pak tedy válka" # todo: NEW TRANSLATION
 LKT_Sakakawea_capital: "Založeno §YSakakawea§! Hlavní město" # todo: NEW TRANSLATION
 LKT_Sakakawea_capital_name: "Sakakawea" # todo: NEW TRANSLATION
 LKT_Pierre_capital: "Založeno §YPierre§! Hlavní město" # todo: NEW TRANSLATION
 LKT_Pierre_capital_name: "Pierre" # todo: NEW TRANSLATION
 LKT_Fort_Nakanin_capital: "Založeno §YFort Nakanin§! Hlavní město" # todo: NEW TRANSLATION
 LKT_Fort_Nakanin_capital_name: "Fort Nakanin" # todo: NEW TRANSLATION
 LKT_New_Cheyenne_capital: "Založeno §YNew Cheyenne§! Hlavní město" # todo: NEW TRANSLATION
 LKT_New_Cheyenne_capital_name: "New Cheyenne" # todo: NEW TRANSLATION
 LKT_Old_Cheyenne_capital_name: "Old Cheyenne" # todo: NEW TRANSLATION
 LKT_Prairie_Federation_desc: "[LKT.GetFlag]§YRepublika Lakota§! mění název na [LKT.GetFlag]§YPrérijní federace§!" # todo: NEW TRANSLATION
 LKT_Free_Fields_Society_desc: "[LKT.GetFlag]§YRepublika Lakota§! mění název na [LKT.GetFlag]§YSpolečnost svobodných polí§!" # todo: NEW TRANSLATION
 LKT_Grand_Duchy_Of_Yellowstone_desc: "[LKT.GetFlag]§YRepublika Lakota§! mění název na [LKT.GetFlag]§YVelkovévodství Yellowstone§!" # todo: NEW TRANSLATION
 LKT_Second_American_Republic_desc: "[LKT.GetFlag]§YRepublika Lakota§! mění název na [LKT.GetFlag]§Y2. americká republika§!" # todo: NEW TRANSLATION
 LKT_Cambrian_Nation_desc: "[LKT.GetFlag]§YRepublika Lakota§! mění název na [LKT.GetFlag]§YKambrii§!" # todo: NEW TRANSLATION
 LKT_Continental_Confederation_desc: "[LKT.GetFlag]§YRepublika Lakota§! mění název na [LKT.GetFlag]§YKontinentální konfederace§!" # todo: NEW TRANSLATION
 LKT_divided_we_fell: "Padli jsme rozděleni" # todo: NEW TRANSLATION
 LKT_divided_we_fell_desc: "Popel usedl a přestože jsme zdecimováni, nejsme poraženi touto náhlou a bezprecedentní událostí, která nás postihla. Musíme pochodovat vpřed a začít stát na vlastních nohou." # todo: NEW TRANSLATION
 LKT_federal_budgets: "Národní rozpočty" # todo: NEW TRANSLATION
 LKT_federal_budgets_desc: "Pokud máme dosáhnout něčeho smysluplného, musíme posoudit své rozpočty a přizpůsobit je našim potřebám. Opravovat to, co selhává, a rozšiřovat to, co funguje — kéž by to bylo tak snadné." # todo: NEW TRANSLATION
 LKT_domestic_policies: "Správa lakotských vnitřních záležitostí" # todo: NEW TRANSLATION
 LKT_domestic_policies_desc: "LDAA je specializovaná vládní složka odpovědná za posuzování a utváření politik a zákonů přijatých národní vládou tak, aby platily v širším národě. Stručně řečeno, pokud chcete vědět, co se děje mezi lidmi, podívejte se na LDAA." # todo: NEW TRANSLATION
 LKT_industrial_policies: "Ministerstvo obchodu a hospodářských činností" # todo: NEW TRANSLATION
 LKT_industrial_policies_desc: "DCEA odpovídá za správu a rozvoj národního hospodářství. Správa provádí regulace, podnikatelské granty a podobná opatření, aby zajistila poměrně vyváženou a stabilní ekonomiku." # todo: NEW TRANSLATION
 LKT_resource_management_policies: "Ministerstvo přírodních zdrojů" # todo: NEW TRANSLATION
 LKT_resource_management_policies_desc: "DNR odpovídá za zaměstnávání a správu našich domácích zdrojů, ať už lidských, nebo materiálních." # todo: NEW TRANSLATION
 LKT_tax_policies: "Ministerstvo příjmů" # todo: NEW TRANSLATION
 LKT_tax_policies_desc: "DoR odpovídá za výběr a vymáhání zdanitelných příjmů. Změny daňového řádu nebo obchodních podmínek znamenají, že se ministerstvo musí přizpůsobovat a vést občany i obchodní partnery k placení jejich podílu při jakékoli formě obchodu či hospodářské činnosti." # todo: NEW TRANSLATION
 LKT_army_service_branch: "Lakotská republikánská armáda" # todo: NEW TRANSLATION
 LKT_army_service_branch_desc: "LRA je hlavní ozbrojenou složkou, která brání náš národ. Ačkoli jsou oblohy plné našich letců, nic neznamenají, pokud si jednotky na zemi nedokážou poradit s nepřátelskými silami." # todo: NEW TRANSLATION
 LKT_air_force_service_branch: "Lakotské letectvo" # todo: NEW TRANSLATION
 LKT_air_force_service_branch_desc: "LAF odpovídá za zajištění oblohy a ochranu našich pozemních i námořních sil před nepřátelskými vzdušnými vpády." # todo: NEW TRANSLATION
 LKT_navy_service_branch: "Lakotská námořní služba" # todo: NEW TRANSLATION
 LKT_navy_service_branch_desc: "LNS je směsicí všeho možného. Jelikož je odkázána pouze na významné vodní cesty, které se vinou naším národem, je námořní služba vnímána spíše jako vtip nebo levnější způsob snižování nezaměstnanosti." # todo: NEW TRANSLATION
 LKT_organizing_the_farmers: "Organizování farmářů" # todo: NEW TRANSLATION
 LKT_organizing_the_farmers_desc: "Nemáme toho mnoho, ale to, co máme, musíme shromáždit a připravit na chvíli, kdy je budeme potřebovat." # todo: NEW TRANSLATION
 LKT_decisions_war_time_mobilization_category: "Válečná mobilizace" # todo: NEW TRANSLATION
 LKT_decisions_war_time_mobilization_category_desc: "Když nastane potřeba, můžeme povolat dobrovolnickou legii lidí, která alespoň vyplní mezery v liniích. Nevíme, kdy přijde válka, ale víme, že na nás přijde." # todo: NEW TRANSLATION
 LKT_war_time_mobilization: "Mobilizace 1. vlna" # todo: NEW TRANSLATION
 LKT_war_time_mobilization_desc: "Vyzvání k zbrani je na nás a my se musíme spojit, abychom zajistili obranu našich domovů. Do zbraně, chlapci z Dixielandu!" # todo: NEW TRANSLATION
 LKT_war_second_wave_defenders: "Obránci druhé vlny" # todo: NEW TRANSLATION
 LKT_war_second_wave_defenders_desc: "Nepřítel tlačí vpřed, a tak musíme nasadit další vlnu obránců. Morálka národa utrpí, ale potřebujeme jednotky." # todo: NEW TRANSLATION
 LKT_war_desperate_defenders: "Beznadějní obránci" # todo: NEW TRANSLATION
 LKT_war_desperate_defenders_desc: "Situace je čím dál vážnější; potřebujeme každé dostupné tělo, ať už je schopné, nebo ne, aby drželo linii. Snad, možná, ještě vyhrajeme." # todo: NEW TRANSLATION
 LKT_creating_infantry_reserves: "Vytváření pěší zálohy" # todo: NEW TRANSLATION
 LKT_creating_infantry_reserves_desc: "Obklíčeni protivníky ze všech stran, musíme očekávat to nejhorší. Vytvořme připravenou záložní sílu, abychom byli připraveni na nepřítele, až nastane čas." # todo: NEW TRANSLATION
 LKT_mobilizing_the_reserves: "Mobilizace rezerv" # todo: NEW TRANSLATION
 LKT_mobilizing_the_reserves_desc: "Časy jsou blízko a musíme zajistit bezpečnost našich drahých občanů. Pojďme shromáždit rezervy a vyrazit bránit naše domovy." # todo: NEW TRANSLATION
 LKT_ideas_economic_development_commission: "Komise pro hospodářský rozvoj" # todo: NEW TRANSLATION
 LKT_ideas_economic_development_commission_desc: "S jednotou mezi Reclamation Front a vládou národa je spolupráce silnější než kdy dřív. Zřídila se nová ekonomická komise pro rozvoj a pochopení ekonomického složení naší země. Nyní pracují zdola i shora společně a budoucnost naší velké země je o kousek blíž k pravé jednotě." # todo: NEW TRANSLATION
 LKT_ideas_foreign_isolation_office: "Úřad zahraniční izolace" # todo: NEW TRANSLATION
 LKT_ideas_foreign_isolation_office_desc: "Po tak násilném a zdánlivě nemožném zvratu událostí je náš národ nyní... nuže, národem. Po rozpadu staré republiky nyní vytváříme novou a bezpečnější sázkovou republiku. Použití jména Lakota k oslovení domorodých menšin umožňuje stabilitu a vytvoření zcela nové identity. S touto nově nalezenou nadějí jsou však mnozí ostražití vůči sousedům i zahraničnímu vměšování jako celku. Tento pocit přetrvává napříč národem, a proto někteří žertem přezdívají Úřad zahraničí „Úřadem zahraniční izolace“, protože vláda nevyvíjí skutečné diplomatické úsilí." # todo: NEW TRANSLATION
 LKT_ideas_agrarian_fuel_economy: "Agrární palivová ekonomika" # todo: NEW TRANSLATION
 LKT_ideas_agrarian_fuel_economy_desc: "Protože zemědělství poskytuje lví podíl hospodářského výstupu, musíme okamžitě rozvíjet a přizpůsobit energetický sektor. Investice do výzkumu výroby biopaliv a způsobů, jak snížit potřebu rozsáhlých infrastrukturních zařízení, jistě pomohou zefektivnit a co nejlépe využít naše energetické potřeby." # todo: NEW TRANSLATION
 LKT_ideas_a_new_green_deal: "Zelená nová dohoda" # todo: NEW TRANSLATION
 LKT_ideas_a_new_green_deal_desc: "NGD je komplexní investiční balíček, který bude investovat do výroby jaderné energie a učiní ji tak účinnou a praktickou, jak jen nám současné i potenciální budoucí objevy dovolí. Menší elektrárny, recyklační centra vyhořelých palivových tyčí a další řešení, která věda umožní." # todo: NEW TRANSLATION
 LKT_ideas_well_rounded_energy_sector: "Vyvážený energetický sektor" # todo: NEW TRANSLATION
 LKT_ideas_well_rounded_energy_sector_desc: "Nyní, když je naše ministerstvo energetiky v souladu s národními hospodářskými potřebami, můžeme zajistit stabilní a prosperující budoucnost." # todo: NEW TRANSLATION
 LKT_ideas_improved_rail_network: "Vylepšená železniční síť" # todo: NEW TRANSLATION
 LKT_ideas_improved_rail_network_desc: "Investicemi do železnic se nám podařilo lépe propojit národ a zlepšit vojenské i civilní zásobovací trasy." # todo: NEW TRANSLATION
 LKT_ideas_experimental_weapons_corp: "Sbor experimentálních zbraní" # todo: NEW TRANSLATION
 LKT_ideas_experimental_weapons_corp_desc: "EWC se věnuje vytváření co nejpružnějších jednotek rychlé reakce, výzkumu a vývoji i bojovým zkouškám v terénu, aby jednotka armády v nouzi získala potřebnou pomoc." # todo: NEW TRANSLATION
 LKT_ideas_lctp: "Výcvikový program logistického sboru" # todo: NEW TRANSLATION
 LKT_ideas_lctp_desc: "Program LCT má otevřít náborové příležitosti těm, kteří se nehodí do první linie. Aby byla zajištěna stabilita a účinnost fronty, musí být naše dodavatelské řetězce v nejlepší možné kondici, a proto se o to postaráme." # todo: NEW TRANSLATION
 LKT_ideas_fighter_supremacy: "Nadvláda stíhaček" # todo: NEW TRANSLATION
 LKT_ideas_fighter_supremacy_desc: "Upřednostněním vývoje a nasazení stíhaček v letectvu připravíme půdu pro jasnou oblohu bez nepřátelských útočníků." # todo: NEW TRANSLATION
 LKT_ideas_ground_support_supremacy: "Nadvláda pozemní podpory" # todo: NEW TRANSLATION
 LKT_ideas_ground_support_supremacy_desc: "Upřednostněním letounů pozemní podpory zajistíme, že ani nedostatky ve vzdušné převaze neomezí naši schopnost udeřit na nepřátelské pozemní síly a stáhnout se. To umožní stabilizovat frontu a zabránit nepříteli ve zničení našich zemí." # todo: NEW TRANSLATION
 LKT_ideas_strategic_bomber_supremacy: "Nadvláda strategických bombardérů" # todo: NEW TRANSLATION
 LKT_ideas_strategic_bomber_supremacy_desc: "Upřednostněním vývoje a nasazení strategických bombardérů zlomíme vůli i schopnost nepřítele bojovat. Průmysl a infrastruktura se před našimi mocnými bombardéry zhroutí." # todo: NEW TRANSLATION
 LKT_ideas_strategically_cheap: "Doktrína strategické levnosti" # todo: NEW TRANSLATION
 LKT_ideas_strategically_cheap_desc: "Menší cíle se také hůře zasahují. Své zkušenosti s říčním sjížděním a omezenými pobřežními operacemi můžeme využít k vytvoření nových taktik úderu a ústupu, podle nichž budou naše námořní plavidla konstruována. Samozřejmě to bude mít určité nevýhody, ale není to tak, že bychom to uměli lépe — musíme se učit tak či onak." # todo: NEW TRANSLATION
 LKT_ideas_naval_command_structure: "Velitelská struktura námořnictva" # todo: NEW TRANSLATION
 LKT_ideas_naval_command_structure_desc: "Zřízením skutečné a organizované velitelské struktury námořnictva dále upevníme své úsilí o vytvoření skutečné námořní složky." # todo: NEW TRANSLATION
 LKT_anarchist_asylum_experiement: "Experiment s anarchistickým azylem" # todo: NEW TRANSLATION
 LKT_anarchist_asylum_experiement_desc: "Naše země jsou rozlehlé a nerozvinuté, proto musíme slíbit, že je zaplníme lidmi ze všech koutů, kteří hledají lepší zítřek." # todo: NEW TRANSLATION
 LKT_ideas_standardized_civil_services: "Standardizované civilní služby" # todo: NEW TRANSLATION
 LKT_ideas_standardized_civil_services_desc: "Vytvoření nové standardní podoby civilní správy a obecných veřejných služeb nám umožní pasivně začlenit nová území, která jsme získali. Navíc to funguje jako kontakt s veřejností a přináší přístup založený na získávání srdcí a myslí, místo pouhého bití lidí do poslušnosti." # todo: NEW TRANSLATION
 LKT_ideas_the_second_american_republic: "Druhá americká republika" # todo: NEW TRANSLATION
 LKT_ideas_the_second_american_republic_desc: "Nyní, když jsou země znovu sjednoceny a mandát získán, budujeme z trosek starého světa 2. americkou republiku." # todo: NEW TRANSLATION
 LKT_ideas_cultivating_a_new_identity: "Pěstování nové identity" # todo: NEW TRANSLATION
 LKT_ideas_cultivating_a_new_identity_desc: "Země západně od Mississippi jsou pod naší kontrolou. Nyní musíme upevnit srdce a mysl lidí a společně vytvořit novou cestu vpřed." # todo: NEW TRANSLATION
 LKT_ideas_securing_the_new_order: "Zajištění nového řádu" # todo: NEW TRANSLATION
 LKT_ideas_securing_the_new_order_desc: "Náš Velký bariérový plán pokračuje ke svému dokončení a s tímto vědomím se více zaměřujeme na vnitřní záležitosti, abychom zajistili stabilitu tohoto řádu. Severní Amerika pozná mír a prosperitu díky unii národů spolupracujících na společném cíli." # todo: NEW TRANSLATION
 LKT_collapse_event.1.t: "Ne mnoho, ale právě dost" # todo: NEW TRANSLATION
 LKT_collapse_event.1.d: "Jak bouře přechází a věci se začínají uklidňovat, musíme nyní obnovit naše státy a reorganizovat se v nový národ. Protože však od počátku nebylo mnoho rozvoje, nemáme ani mnoho co obnovovat. Jednou z hlavních otázek, které předložíme lidem, proto bude, jaký druh ekonomiky pro náš národ chceme. Každopádně toho není mnoho, ale je to poctivá práce." # todo: NEW TRANSLATION
 LKT_collapse_event.1.o1: "Tak se dáme do práce" # todo: NEW TRANSLATION
 LKT_event.1.t: "Hlava vlády" # todo: NEW TRANSLATION
 LKT_event.1.d: "Jelikož v tuto chvíli nemáme v úmyslu hledět dále na sever, bezpečnost hlavního města národa spočívá na našich čtyřech nejsevernějších státech. Dakoty, Montana a Wyoming. Zatímco někteří tuto myšlenku odrazují, nebojí-li se, že čím dál je hlavní město od fronty, tím dál bude vyhledána pomoc a pozornost. Přesto nemůžeme být zdržováni touto rozptýlující hádkou. Mnozí se však ptají, zda bychom měli zachovat spíše základní pojmenování hlavního města, nebo zda bychom měli vzít v úvahu domorodé kořeny zemí. Prozatím tyto čtyři kandidátské státy dělají prostor pro to, aby se jevily pro výbor pro národní počátky vhodné pro výběr jejich státu." # todo: NEW TRANSLATION
 LKT_event.1.o1: "Nebyli jsme právě v kolapsu kvůli takovým věcem?" # todo: NEW TRANSLATION
 LKT_event.2.t: "Diskuse u srdce" # todo: NEW TRANSLATION
 LKT_event.2.d: "Z našich čtyř kandidátů máme rozštěpení mezi ty, kdo chtějí být více v souladu s dávnými kořeny země, a těmi, kdo chtějí být více v tónu domorodých vlivů zemí. V domovské straně máme Montana s Fort Nakanin, inspirované starou domorodou rezervací poblíž, která byla pro kmen Nakoda a A'ananin. V Severní Dakotě máme Sakakawea po největší řece státu. Na jihu máme Pierre South Dakota jako volbu; vzhledem k nízkému rozvoji mnoho lidí věří, že nová federální hlavní město bude snadno vytvořit svůj vlastní distrikt jako součást širšího metropolitního puzzle Pierre. A konečně máme New Cheyenne, která je zhruba uprostřed státu; bude mít přednost nad starým hlavním městem Wyoming, které bude přejmenováno na Old Cheyenne. Někteří obyvatelé jsou na to poněkud dotčeni, nicméně mnozí věří, že je to hezký symbol obnovy, jak federální hlavní město přebírá novou stránku v historii mladé země." # todo: NEW TRANSLATION
 LKT_event.2.o1: "Sakakawea" # todo: NEW TRANSLATION
 LKT_event.2.o2: "Pierre" # todo: NEW TRANSLATION
 LKT_event.2.o3: "Fort Nakanin" # todo: NEW TRANSLATION
 LKT_event.2.o4: "New Cheyenne" # todo: NEW TRANSLATION
 LKT_event.3.t: "Audit Jihu" # todo: NEW TRANSLATION
 LKT_event.3.d: "Po dlouhém a úmorném úsilí o stabilizaci národa jsme konečně mohli řešit tuto údajnou organizaci „Reclamation Front“, která zřejmě nám pomáhá. Avšak jsme tam poslali auditory, aby zjistili skutečný důvod, proč tito lidé opustili své již ustálené domovy a náhle si vybudovali nové. Bez ohledu na to musíme počkat, co přesně bude hlášeno, pokud máme skutečně jednat." # todo: NEW TRANSLATION
 LKT_nation_name_event.1.t: "Nový národ" # todo: NEW TRANSLATION
 LKT_nation_name_event.1.d: "Protože je domorodců tak málo, nemáme důvod zachovávat údajně „bezpečný geografický a historicky respektující“ název Lakota. Místo toho se staneme Velkými pláňany nové Prérijní federace." # todo: NEW TRANSLATION
 LKT_nation_name_event.1.o1: "Tyto země jsou naše země!" # todo: NEW TRANSLATION
 LKT_nation_name_event.2.t: "Svobodný národ?" # todo: NEW TRANSLATION
 LKT_nation_name_event.2.d: "Po zvolení Společnosti mnozí přemýšlejí, zda je to skutečně nový list, který musíme obrátit, abychom v blízké budoucnosti obstáli. Vznikla proto velká debata o tom, co má být naším národním průvodcem. Na jedné straně stojí ti, kteří si přejí pokračovat pod praporem Společnosti svobodných polí — v podstatě anarchismu blízkého uspořádání, v němž bychom stáli na vlastních nohou. Druhou možností je zachovat status quo a hledat lepší varianty, pokud to bude možné. Co si však přejí lidé?" # todo: NEW TRANSLATION
 LKT_nation_name_event.2.o1: "Společnost svobodných polí!" # todo: NEW TRANSLATION
 LKT_nation_name_event.2.o2: "Možná je příliš brzy?" # todo: NEW TRANSLATION
 LKT_nation_name_event.3.t: "Královský národ?" # todo: NEW TRANSLATION
 LKT_nation_name_event.3.d: "V šokujícím zvratu byl zvolen Dům Yellowstone. Strana slibuje rozšířené demokratické prostředky volebního procesu i základní všeobecné volební právo, aby zajistila co největší účast občanů národa. Jediným rozdílem je, že voleným úřadům budou přiděleny feudální tituly, čímž se do jisté míry kosmeticky změní význam a étos samotné vlády. Někteří se ptají, zda bychom měli zahájit skutečnou přeměnu národa podle tohoto modelu, nebo pokračovat dosavadním směrem." # todo: NEW TRANSLATION
 LKT_nation_name_event.3.o1: "Budeme velkovévodstvím!" # todo: NEW TRANSLATION
 LKT_nation_name_event.3.o2: "Možná je to příliš rozmarné, než aby to bylo praktické?" # todo: NEW TRANSLATION
 LKT_nation_name_event.4.t: "Ustavení nové republiky" # todo: NEW TRANSLATION
 LKT_nation_name_event.4.d: "Nyní, když je národ na pokraji obnovy, musíme upevnit svůj mandát založením 2. americké republiky. Z popela starého povstává nová cesta vpřed." # todo: NEW TRANSLATION
 LKT_nation_name_event.4.o1: "Ave Nova Republica!" # todo: NEW TRANSLATION
 LKT_nation_name_event.5.t: "Západní identita" # todo: NEW TRANSLATION
 LKT_nation_name_event.5.d: "Západní země jsou pod jedním praporem, a proto vyhlašujeme nový národ. Kambrii. Jméno odkazuje na nadčasovou dominantu, která definuje významnou část našich zemí — pohoří Skalnatých hor. Protože se v něm nacházejí kambrické zkameněliny, používáme je jako symbol, který ukazuje, že jsme občany a lidem Kamb•ie. Budeme bránit a opatrovat tyto země i naše obyvatele až do konce věků." # todo: NEW TRANSLATION
 LKT_nation_name_event.5.o1: "Sláva Kambrii!!!" # todo: NEW TRANSLATION
 LKT_event.3.o1: "Nemůže to být až tak špatné, že?" # todo: NEW TRANSLATION
 LKT_event.4.t: "První zprávy" # todo: NEW TRANSLATION
 LKT_event.4.d: "Objevily se některé informace a vypadají nejlépe smíšeně a v nejhorším případě zmatené. Některé zprávy naznačují, že RF je doslova takový, jak říkají, že jsou. Skupina domorodců prchajících ze Jižní republiky ve snaze najít si nový domov. V důsledku toho se ekonomická situace v Kansasu vyvíjela rychleji než zbytek země. Na druhou stranu se však objevují zprávy o tom, že někteří členové RF se dopouštějí trestných činů vůči místním obyvatelům a dokonce některé pseudo–mafiánské aktivity, aby si udrželi svou pověst. Takovéto střídání názorů by nám mohlo dát skutečnou roli při obnově, nebo by nám do břicha byl vrazен nůž. Bez ohledu na to musíme učinit vážné rozhodnutí, které by mohlo vést k činům, za něž bychom později mohli litovat." # todo: NEW TRANSLATION
 LKT_event.4.o1: "Zločinci, všichni!" # todo: NEW TRANSLATION
 LKT_event.4.o2: "Počkej, možná je na tom něco jiného." # todo: NEW TRANSLATION
 LKT_event.5.t: "Nabídka, kterou nemohou odmítnout" # todo: NEW TRANSLATION
 LKT_event.5.d: "V souvislosti se šokujícími zprávami o RF-ových dalších ilegálních aktivitách vzal auditor iniciativu a setkal se s vedením RF, aby jim v podstatě učinil nabídku. Ztlumit jejich nafoukanost a nechat severní vládě získat více kreditu a my je necháme být. Přirozeně vedení RF reagovalo různorodě a nejhlasitější z nich byla rostoucí kolektivní reakce. Tato reakce byla citována jako: „Jsme mírumilovní lidé a jsme důkladně rozhořčeni tím, že nás považujete za obyčejné zločince a organizované gangy podobné vašim bílým protějškům ze starých časů. Ukážeme vám, že takovým hrubým a degradujícím poznámkám stigmatizujícím naše národy nebudeme tolerovat.“ Auditor byl vyhozen a pronásledován až na hranici Nebrasky; z toho je zřejmé, že naše domněnky byly správné a musíme jednat brzy." # todo: NEW TRANSLATION
 LKT_event.5.o1: "Dali jim palec a vezmou celý stát" # todo: NEW TRANSLATION
 LKT_event.6.t: "Shromážděte národ" # todo: NEW TRANSLATION
 LKT_event.6.d: "Rostoucí nejistota v Kansasu, protože členové RF a místní vedení se začínají přiklánět k tomuto vzpournému hnutí jako celku. V důsledku toho se i severní státy začínají sjednocovat a musíme zahájit jakoukoli mobilizaci, pokud chceme skutečně něco dosáhnout v dohledné době." # todo: NEW TRANSLATION
 LKT_event.6.o1: "To je náš národ, ne jejich." # todo: NEW TRANSLATION
 LKT_event.7.t: "Otevřené povstání" # todo: NEW TRANSLATION
 LKT_event.7.d: "Ta proklínaná zrada to konečně dokázala, vyvěsili státní vlajku Kansasu a prohlásili stát za nezávislý na republice. Budeme muset zorganizovat jednotky a mít to hotovo dřív, než si naši sousedé všimnou naší slabosti." # todo: NEW TRANSLATION
 LKT_event.7.o1: "Zní výzva k rally" # todo: NEW TRANSLATION
 LKT_event.8.t: "Do války!" # todo: NEW TRANSLATION
 LKT_event.8.d: "Národ je mobilizován a ať už to stojí za cokoli, vyrážíme na jih, abychom bránili naše území před těmito zrádnými a oportunistickými vetřelci. Dobrá vůle a vše kolem toho – ha, kupa nesmyslů v nejlepším a ještě více lží v tom nejhorším." # todo: NEW TRANSLATION
 LKT_event.8.o1: "Jdeme na jih!" # todo: NEW TRANSLATION
 LKT_event.9.t: "Nedávají nám jinou volbu" # todo: NEW TRANSLATION
 LKT_event.9.d: "Říkají o nás, že jsme zloději, podvodníci a zločinci. Nejsme takoví a budeme se bránit spolu s těmito milými a příbuznými lidmi Kansasu. Za Kansas a za skutečnou svobodu!" # todo: NEW TRANSLATION
 LKT_event.9.o1: "Bojujeme za naši svobodu!" # todo: NEW TRANSLATION
 LKT_event.5000.t: "Další vyšetřování" # todo: NEW TRANSLATION
 LKT_event.5000.d: "Pokračující zprávy ukazují, že čím dál víc tvrzení o ilegální stránce činnosti této organizace se ukazuje jako mylná. V důsledku toho začala jednání o urychlení ekonomiky národa a o snahách o harmonizovanější spojení lidu." # todo: NEW TRANSLATION
 LKT_event.5000.o1: "Chvála Bohu, že jsme to prozkoumali podrobně" # todo: NEW TRANSLATION
 LKT_event.5001.t: "Další plány" # todo: NEW TRANSLATION
 LKT_event.5001.d: "Počáteční jednání a investiční plány vedly k růstu ekonomiky po celé zemi. Takový růst nám ukázal, že rozvoj, který jsme čekali na měsíce, se stal realitou. S tím, jak se věci vyvíjejí, musíme zvážit zřízení ekonomické komise, která zajistí vyvážený a stabilní hospodářský rozvoj naší velké země a jejích mnoha národů." # todo: NEW TRANSLATION
 LKT_event.5001.o1: "K prosperitě!" # todo: NEW TRANSLATION
 LKT_event.5002.t: "Komise" # todo: NEW TRANSLATION
 LKT_event.5002.d: "Pokračující vyjednávání a rozvoj vedly k vytvoření \"Ekonomické rozvojové komise\". Tato komise vedla k soudržnějšímu hospodářskému plánování a růstové doktríně, která pomůže naší zemi po generace." # todo: NEW TRANSLATION
 LKT_event.5002.o1: "Spojeni stojíme, rozděleni už nikdy nebudeme." # todo: NEW TRANSLATION
 LKT_event.10.t: "„Vzájemná investice“" # todo: NEW TRANSLATION
 LKT_event.10.d: "Kanada je rozvinutá jen tam, kde musí být. Mohli bychom jí „pomoci“ investicí do vzájemného železničního spojení, které by zlepšilo obchod a přepravu pro oba naše národy. Pokud přijmou, nebude problém. Pokud odmítnou... pak budeme mít problém." # todo: NEW TRANSLATION
 LKT_event.10.o1: "Doufejme, že přijmou" # todo: NEW TRANSLATION
 LKT_event.11.t: "Nabídka investice" # todo: NEW TRANSLATION
 LKT_event.11.d: "Republika Lakota za námi přišla se zajímavou nabídkou. Chtějí vybudovat železnici z Dakot přes hlavní trať v Regině v Saskatchewanu až do Winnipegu v Manitobě. To by pomohlo obchodním dohodám, turistice i obecné spolupráci mezi našimi národy. Ve skutečnosti v tom nevidíme problém, ale někteří poslanci to vzhledem k nedávným událostem v republice považují za falešnou záminku. Jaká bude naše odpověď?" # todo: NEW TRANSLATION
 LKT_event.11.o1: "Schválit dohodu" # todo: NEW TRANSLATION
 LKT_event.11.o2: "Slušně jejich nabídku odmítnout" # todo: NEW TRANSLATION
 LKT_event.111.t: "Dohoda se rozpadá" # todo: NEW TRANSLATION
 LKT_event.111.d: "Kanaďané naši nabídku odmítli. Nyní musíme situaci přehodnotit, protože v tuto chvíli nemáme jinou cestu, kterou bychom se mohli vydat." # todo: NEW TRANSLATION
 LKT_event.111.o1: "Slyším snad bubny?" # todo: NEW TRANSLATION
 LKT_event.12.t: "Stavba začíná" # todo: NEW TRANSLATION
 LKT_event.12.d: "Dohoda byla schválena a zahájili jsme stavbu. Doufejme, že projekt proběhne hladce a bude dokončen do konce měsíce." # todo: NEW TRANSLATION
 LKT_event.12.o1: "Vše podle plánu" # todo: NEW TRANSLATION
 LKT_event.13.t: "Potíže na Velké severní" # todo: NEW TRANSLATION
 LKT_event.13.d: "Posádky projektu hlásí, že dochází k podivným incidentům. Přestože je projekt téměř dokončen, objevily se zprávy o mizejících členech posádek a rostoucí nevraživosti našich lidí vůči Lakotům. Nevíme jistě, co se děje, ale přinejmenším máme podezření na nekalou hru." # todo: NEW TRANSLATION
 LKT_event.13.o1: "Tenhle pocit se mi nelíbí..." # todo: NEW TRANSLATION
 LKT_event.14.t: "Krvavě žízniví Kanaďané!?!" # todo: NEW TRANSLATION
 LKT_event.14.d: "Noviny a televizní stanice křičí: Krvežízniví Kanaďané zabíjejí laskavé Lakoty! Národ se bouří kvůli zvěstem z nedávného železničního projektu mezi námi a kanadskou vládou. Vzhledem k tomu, že se věci vyvíjejí lépe, než se očekávalo, využijeme toho k rozpoutání války, kterou chceme, místo války, kterou jsme mohli mít." # todo: NEW TRANSLATION
 LKT_event.14.o1: "Pošlete jim naše požadavky!" # todo: NEW TRANSLATION
 LKT_event.15.t: "Zhoršující se situace" # todo: NEW TRANSLATION
 LKT_event.15.d: "K vládě náhle dorazily lakotské požadavky. Požadují odškodnění za ztracené lakotské životy v podobě průmyslových investic i finanční vyrovnání za projekt. Celková částka činí přibližně 35 miliard a mnoho Kanaďanů je pobouřeno obviněními vznesenými proti jejich krajanům. Musíme proto učinit skutečně obtížné rozhodnutí." # todo: NEW TRANSLATION
 LKT_event.15.o1: "Zachovat si tvář a jednoduše jim zaplatit" # todo: NEW TRANSLATION
 LKT_event.15.o2: "Kašlat na to, ukážeme jim" # todo: NEW TRANSLATION
 LKT_event.16.t: "Neočekávaný výsledek" # todo: NEW TRANSLATION
 LKT_event.16.d: "Nuže, nějakým způsobem jsme selhali... úspěšně? To však není skutečný výsledek, který jsme chtěli, a proto se musíme připravit na plán B." # todo: NEW TRANSLATION
 LKT_event.16.o1: "Uspořádat vojska" # todo: NEW TRANSLATION
 LKT_politics.1.t: "Začíná volební kampaň" # todo: NEW TRANSLATION
 LKT_politics.1.d: "Napříč celým národem vznikají politické strany a lidé se začínají shromažďovat kolem těch, které považují za nejvhodnější budoucí vládnoucí politické uskupení. Zatímco mezi tvrdšími stranami začínají drobné spory, mnozí jsou zvědaví, kam se národ od této chvíle vydá." # todo: NEW TRANSLATION
 LKT_politics.1.o1: "V lásce a válce je dovoleno vše" # todo: NEW TRANSLATION
 LKT_politics.2.t: "„Strany rady autority“" # todo: NEW TRANSLATION
 LKT_politics.2.d: "Ve všeobecném zmatku a soupeření o hlasy se skupina stran s poněkud podobnými styly vedení spojila a vytvořila volební blok. Tato údajná Rada autority je podle mnohých souborem stran fungujících jako oligarchie. Přestože každá strana takové ponižující označení odmítá, někteří členové nemohou popřít určité způsoby řízení, k nimž v poslední době docházelo. V každém případě je na lidech, aby hlasovali a rozhodli, kdo má národu vládnout." # todo: NEW TRANSLATION
 LKT_politics.2.o1: "DDP vítězí!" # todo: NEW TRANSLATION
 LKT_politics.2.o2: "KCK vítězí!" # todo: NEW TRANSLATION
 LKT_politics.2.o3: "LTP vítězí!" # todo: NEW TRANSLATION
 LKT_politics.2.o4: "AFL vítězí?" # todo: NEW TRANSLATION
 LKT_politics.2.o5: "Tohle nemohou být všichni, kdo je další?" # todo: NEW TRANSLATION
 LKT_politics.3.t: "Strany tradice" # todo: NEW TRANSLATION
 LKT_politics.3.d: "Jak se situace dále vyostřuje, začíná vznikat nový mocenský blok. Soubor pravicových a středopravicových stran se pokouší vytvořit volební blok, který spojuje společný zájem zachovat nové i staré tradice známé zdejším zemím a jejich obyvatelům. Strany tradice věří, že ke změně může dojít, ale nesmí kvůli ní být odhozena minulost. Přesto je na lidech, aby hlasovali, hlasovali a hlasovali a zajistili vítězství straně, kterou chtějí v čele národa." # todo: NEW TRANSLATION
 LKT_politics.3.o1: "ORP vítězí!" # todo: NEW TRANSLATION
 LKT_politics.3.o2: "TTP vítězí!" # todo: NEW TRANSLATION
 LKT_politics.3.o3: "LTSP vítězí!" # todo: NEW TRANSLATION
 LKT_politics.3.o4: "Jistě existují další možnosti. Počkat, podívejte se tamhle" # todo: NEW TRANSLATION
 LKT_politics.4.t: "Strany pokroku prostého lidu" # todo: NEW TRANSLATION
 LKT_politics.4.d: "Vznikající socialistický ekonomický blok politických stran získal podporu čistě proto, aby vzdoroval růstu Nových lakotských nacionalistických stran. Tato údajná dichotomie „levice a pravice“ znamená, že se politika národa dále štěpí na stále větší množství frakcí. Jakmile však začíná hlasování a lidé se snaží vykročit vpřed podle toho, co považují za správné pro národ, mnozí se ptají, kdo se stane první vládnoucí stranou mladého národa." # todo: NEW TRANSLATION
 LKT_politics.4.o1: "FPP se ujímá vedení" # todo: NEW TRANSLATION
 LKT_politics.4.o2: "FRF kráčí bok po boku s LAS" # todo: NEW TRANSLATION
 LKT_politics.4.o3: "RBP kráčí bok po boku s RRA" # todo: NEW TRANSLATION
 LKT_politics.4.o4: "Říkali jste, že jich je víc?!" # todo: NEW TRANSLATION
 LKT_politics.5.t: "Noví lakotští nacionalisté, strany" # todo: NEW TRANSLATION
 LKT_politics.5.d: "Noví lakotští nacionalisté jsou rostoucím pronacionalistickým hnutím stran, které se chtějí zaměřit především na izolaci a zachování nové identity. Mnozí v národě jsou skeptičtí k tomu, co by to znamenalo pro různé menšinové skupiny, ale většina také věří, že propojenost světa způsobila velký rozpad staré republiky. Někteří mohou hlasovat pro nový blok stran jen proto, aby navzdory rostoucím socialistickým ekonomickým stranám, které zjevně přirozeně vyrostly z omezeného či nulového rozvoje zemí národa." # todo: NEW TRANSLATION
 LKT_politics.5.o1: "YIP vítězí!" # todo: NEW TRANSLATION
 LKT_politics.5.o2: "CDS remizuje s LGF" # todo: NEW TRANSLATION
 LKT_politics.5.o3: "Dům vždy vítězí?" # todo: NEW TRANSLATION
 LKT_politics.5.o4: "Je čas vrátit se zpět" # todo: NEW TRANSLATION
