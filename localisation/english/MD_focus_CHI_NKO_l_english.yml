l_english:
 CHI_NKO_bilateral_cooperation: "Čínsko-severokorejská smlouva o přátelství" # todo: NEW TRANSLATION
 CHI_NKO_bilateral_cooperation_desc: "Smlouva o přátelství, spolupráci a vzájemné pomoci podepsaná v roce 1961 mezi ČLR a KLDR zůstává jedinou smlouvou o vzájemné obraně, kterou kterýkoli z těchto států má. Opětovné potvrzení závazků oživuje vztah, který Peking i Pchjongjang nechaly ochladnout, a otevírá cestu ke strukturované spolupráci v hospodářské, vojenské a politické oblasti." # todo: NEW TRANSLATION
 CHI_NKO_border_trade_zones: "Hospodářská zóna Hwanggumpyong" # todo: NEW TRANSLATION
 CHI_NKO_border_trade_zones_desc: "Ostrov Hwanggumpyong leží v řece Ja-lu mezi Sinuidžu a Tan-tungem. V roce 2011 byl společně určen jako zvláštní hospodářská zóna, avšak projekt se kvůli politickému napětí zastavil. Obnovení čínských investic v zóně Hwanggumpyong znovu vytvoří koridor řeky Ja-lu jako páteř bilaterálního obchodu." # todo: NEW TRANSLATION
 CHI_NKO_rason_sez: "Svobodný obchodní přístav Rason-Sonbong" # todo: NEW TRANSLATION
 CHI_NKO_rason_sez_desc: "Zvláštní hospodářská zóna Rason, vzniklá sloučením měst Rajin a Sonbong, poskytuje Číně vzácný přístup k nezamrzajícímu pacifickému přístavu. Čínské investice rozvíjejí třetí kontejnerový terminál v přístavu Rajin, lehký průmysl a silniční a železniční spojení propojující zónu s čínskou hranicí u Tumenu a Chŭn-čchunu." # todo: NEW TRANSLATION
 CHI_NKO_dandong_trade_hub: "Obchodní koridor Sinuidžu-Tan-tung" # todo: NEW TRANSLATION
 CHI_NKO_dandong_trade_hub_desc: "Tan-tung odbavuje více než 70 % veškerého zboží překračujícího čínsko-severokorejskou hranici. Rozšíření tan-tungské celní a skladovací infrastruktury spolu se zjednodušeným odbavením na Mostě přátelství upevní město jako nenahraditelnou obchodní páteř bilaterálních vztahů." # todo: NEW TRANSLATION
 CHI_NKO_mineral_extraction: "Koncese na železnou rudu v Musanu" # todo: NEW TRANSLATION
 CHI_NKO_mineral_extraction_desc: "Povrchový důl na železnou rudu v Musanu v provincii Severní Hamgjong je jedním z největších ložisek železné rudy v Asii. Čínské skupiny včetně CITIC a společnosti Tonghua Iron and Steel podepsaly těžební smlouvy, které jim výměnou za kapitál a infrastrukturu poskytují přístup k ložisku. Koncese se vztahují také na magnezit z Jižního Hamgjongu a antracit z pánve Anju." # todo: NEW TRANSLATION
 CHI_NKO_fisheries_agreement: "Dohoda o rybolovu v Západním korejském moři" # todo: NEW TRANSLATION
 CHI_NKO_fisheries_agreement_desc: "Severní Korea prodává čínským flotilám působícím ve vodách, na nichž byli kdysi závislí korejští rybáři, každoroční rybářské licence v Západním korejském moři. Formalizace této praxe v bilaterální dohodu poskytne Pchjongjangu předvídatelné příjmy z licencí a čínským rybářským společnostem právní krytí pro operace, které opakovaně vyvolaly protesty Soulu a Tokia." # todo: NEW TRANSLATION
 CHI_NKO_yuan_settlement: "Dohoda s Obchodní bankou Koryo" # todo: NEW TRANSLATION
 CHI_NKO_yuan_settlement_desc: "Obchodní banka Koryo a tan-tungská pobočka Bank of China již dlouho zpracovávají neformální finanční toky, na nichž spočívá bilaterální obchod. Zavedení formálního vypořádání v jüanech odstraní expozici vůči dolaru, která vystavuje severokorejské obchodníky sekundárním sankcím, a pevněji začlení hospodářství KLDR do čínské finanční infrastruktury." # todo: NEW TRANSLATION
 CHI_NKO_labor_export: "Program vysílání pracovníků do Tung-peje" # todo: NEW TRANSLATION
 CHI_NKO_labor_export_desc: "Státem organizované vysílání pracovníků posílá desítky tisíc severokorejských dělníků do továren, na stavby a do restaurací v Liao-ningu, Ťi-linu a Chej-lung-ťiangu. Dělníci jsou nabíráni prostřednictvím vládních agentur a vysíláni na základě smluv, podle nichž je většina mezd odváděna přímo do Pchjongjangu, což z programu Tung-pej činí hlavní zdroj tvrdé měny pro režim." # todo: NEW TRANSLATION
 CHI_NKO_yalu_river_bridge: "Druhý přechod Sinuidžu-Tan-tung" # todo: NEW TRANSLATION
 CHI_NKO_yalu_river_bridge_desc: "Nový most přes řeku Ja-lu, čtyřproudé spojení dokončené v roce 2014 na čínské náklady, propojuje tan-tungskou rozvojovou zónu na nábřeží přímo s okrajem Sinuidžu. Navzdory tomu, že na severokorejské straně po léta nevyužívaně stál bez navazující silnice, otevření přechodu promění kapacitu nákladní dopravy na nejdůležitějším hraničním koridoru." # todo: NEW TRANSLATION
 CHI_NKO_energy_cooperation: "Ropovod CNPC do Tan-tungu" # todo: NEW TRANSLATION
 CHI_NKO_energy_cooperation_desc: "China National Petroleum Corporation provozuje jediný ropovod vedoucí do Severní Koreje, který vede z Tan-tungu do chemického komplexu Ponghwa poblíž Sinuidžu. Čína dodává prakticky veškerou surovou ropu KLDR tímto jediným tepnovým vedením, čímž Pekingu poskytuje nevyslovenou páku nad severokorejskou ekonomikou. Zvýšení průtoku a rozšíření vývozu elektřiny z Liao-ningu zabezpečí průmyslovou základnu Severní Koreje." # todo: NEW TRANSLATION
 CHI_NKO_telecom_network: "Zavedení sítě Koryolink 3G" # todo: NEW TRANSLATION
 CHI_NKO_telecom_network_desc: "Koryolink, severokorejská mobilní síť, byla vybudována s investicemi egyptského Orascomu, avšak její dodavatelské řetězce jsou z velké části napojeny na čínské dodavatele. Rozšíření čínského zapojení prostřednictvím hardwaru Huawei a ZTE rozšíří pokrytí 3G z Pchjongjangu do provinčních měst, zatímco přeshraniční optické spoje poskytnou vládě KLDR kontrolovanou, ale funkční širokopásmovou páteř." # todo: NEW TRANSLATION
 CHI_NKO_power_grid_link: "Napojení vodní elektrárny Supung na síť" # todo: NEW TRANSLATION
 CHI_NKO_power_grid_link_desc: "Vodní elektrárna Supung na řece Ja-lu byla postavena ve 40. letech 20. století a od té doby dodává elektřinu Liao-ningu i Severní Koreji. Obnova společné přenosové infrastruktury a formalizace dohody o propojení sítí stabilizuje dodávky elektřiny do Pchjongjangu a průmyslového severu a umožní obnovu tovární výroby." # todo: NEW TRANSLATION
 CHI_NKO_paektu_tourism: "Koridor Pektusan-Čchang-paj-šan" # todo: NEW TRANSLATION
 CHI_NKO_paektu_tourism_desc: "Hora Pektu, sopečný vrchol rozkládající se mezi provincií Rjanggang a Ťi-linem, je zároveň posvátným místem původu zakladatelské mytologie Kimovy dynastie a významnou destinací pro čínské turisty navštěvující Čchang-paj-šan. Rozvoj integrované turistické infrastruktury na obou stranách hranice zachytí výdaje čínských návštěvníků a zároveň poskytne Pchjongjangu pečlivě kontrolované okno do vnějšího světa." # todo: NEW TRANSLATION
 CHI_NKO_defense_consultations: "Jednání generálních štábů ČLOA a KLA" # todo: NEW TRANSLATION
 CHI_NKO_defense_consultations_desc: "Formální kanály mezi Generálním štábem ČLOA a Generálním politickým byrem KLA existují od korejské války, avšak často přestávaly fungovat. Obnovení pravidelných konzultací na úrovni zástupců náčelníků vytvoří strukturované fórum pro sdílení hodnocení hrozeb, koordinaci reakcí na cvičení USA a Jižní Koreje a předcházení chybným odhadům podél hranice." # todo: NEW TRANSLATION
 CHI_NKO_military_exchanges: "Výměnný program Národní univerzity obrany" # todo: NEW TRANSLATION
 CHI_NKO_military_exchanges_desc: "Národní univerzita obrany ČLOA v Pekingu přijímá severokorejské důstojníky do kurzů pro vyšší velitele, zatímco čínští vojenští přidělenci získávají na oplátku lepší přístup k výcvikovým zařízením KLA. Program vybuduje generaci severokorejských velitelů obeznámených s doktrínou a vybavením ČLOA a prohloubí interoperabilitu i osobní sítě, které přetrvají jakoukoli jednotlivou politickou dohodu." # todo: NEW TRANSLATION
 CHI_NKO_joint_naval_patrols: "Dohoda o námořních hlídkách ve Žlutém moři" # todo: NEW TRANSLATION
 CHI_NKO_joint_naval_patrols_desc: "Severní flotila Námořnictva ČLOA a Námořní velitelství KLA koordinují rozvrhy hlídek ve Žlutém moři s cílem řešit nelegální překládku, neoprávněný rybolov flotil třetích zemí a sledování amerických úderných skupin letadlových lodí. Bilaterální námořní horká linka sníží riziko incidentů na moři a ustanoví Čínu faktickým námořním garantem Severní Koreje." # todo: NEW TRANSLATION
 CHI_NKO_air_defense_umbrella: "Síť protivzdušné obrany severovýchodní Asie" # todo: NEW TRANSLATION
 CHI_NKO_air_defense_umbrella_desc: "Radarové stanice letectva ČLOA v Liao-ningu a Ťi-linu již sledují Korejský poloostrov. Propojení jejich systémů včasného varování s velitelskými středisky letectva KLA a sdílení dat z detekce za horizontem poskytne Severní Koreji účinný čas k varování před jakýmkoli americkým či jihokorejským leteckým úderem, aniž by Pchjongjang musel tuto infrastrukturu budovat samostatně." # todo: NEW TRANSLATION
 CHI_NKO_arms_transfers: "Zásobovací smlouvy KOMID" # todo: NEW TRANSLATION
 CHI_NKO_arms_transfers_desc: "Korea Mining Development Trading Corporation je hlavní severokorejskou agenturou pro nákup zbraní a historicky zprostředkovávala transfery technologií od čínských státních obranných podniků. Formalizace dodavatelských smluv na dělostřelecké komponenty, díly obrněných vozidel a munici zaplní kritické mezery v připravenosti KLA a zároveň poskytne čínským obranným firmám málo viditelného exportního zákazníka." # todo: NEW TRANSLATION
 CHI_NKO_buffer_state_doctrine: "Doktrína rtů a zubů" # todo: NEW TRANSLATION
 CHI_NKO_buffer_state_doctrine_desc: "Přirovnání blízcí jako rty a zuby popisuje čínsko-severokorejské vztahy od korejské války. Jeho zakotvení ve formální strategické doktríně uzná, že žádný z těchto států nemůže přijmout zhroucení či zahraniční přiklonění toho druhého. Pro Peking severokorejská nárazníková zóna brání silám USA a Jižní Koreje v dosažení řeky Ja-lu. Pro Pchjongjang zůstává čínská strategická podpora konečnou zárukou přežití režimu." # todo: NEW TRANSLATION
 CHI_NKO_party_to_party_dialogue: "Dohoda ústředních výborů KSČ a DSK" # todo: NEW TRANSLATION
 CHI_NKO_party_to_party_dialogue_desc: "Vztahy mezi Komunistickou stranou Číny a Korejskou stranou práce předcházejí oběma státům a historicky byly vedeny stranickými kanály spíše než diplomatickými. Obnovení spojovacího rámce ústředních výborů poskytne Pekingu přímou linku k politbyru DSK, která obchází mezistátní formality a umožňuje citlivé rozhovory bez veřejného záznamu." # todo: NEW TRANSLATION
 CHI_NKO_cultural_exchanges: "Výměna uměleckých souborů Mansudae" # todo: NEW TRANSLATION
 CHI_NKO_cultural_exchanges_desc: "Ateliér Mansudae a jeho vystupující soubory představují nejvyšší podobu revoluční kultury KLDR. Vysílání souborů Mansudae do Pekingu a Šanghaje, zatímco čínské filmové a operní delegace navštěvují Pchjongjang, buduje veřejný obraz bratrské solidarity a poskytuje režimu propagandistické záběry čínského publika oslavujícího korejské úspěchy." # todo: NEW TRANSLATION
 CHI_NKO_un_coordination: "Dohoda o štítu veta v RB OSN" # todo: NEW TRANSLATION
 CHI_NKO_un_coordination_desc: "Stálé místo Číny v Radě bezpečnosti OSN bylo opakovaně využíváno k oslabování či blokování rezolucí namířených proti Severní Koreji. Formalizace koordinace mezi čínskými a severokorejskými diplomaty v OSN zajistí, že Peking bude svá veta strategicky využívat k ochraně Pchjongjangu před nejtvrdšími opatřeními, při zachování zdání konstruktivní angažovanosti." # todo: NEW TRANSLATION
 CHI_NKO_un_coordination_tt: "§Y[CHI.GetNameWithFlag]§! bude vetovat každý návrh OSN namířený proti §Y[NKO.GetNameWithFlag]§!" # todo: NEW TRANSLATION
 CHI_NKO_sanctions_circumvention: "Síť krycích společností Zokwang" # todo: NEW TRANSLATION
 CHI_NKO_sanctions_circumvention_desc: "Zokwang Trading a síť přidružených fiktivních společností registrovaných v Tan-tungu, Šen-jangu a Hongkongu přesouvají sankcionované zboží, zpracovávají zakázané finanční převody a zprostředkovávají přepravu surové ropy z lodi na loď, která udržuje severokorejské zásobování palivem. Prohloubení čínské tolerance této infrastruktury poskytne Pchjongjangu nepostradatelnou životní tepnu za cenu vystavení čínských subjektů sekundárním sankcím USA." # todo: NEW TRANSLATION
 CHI_NKO_strategic_partnership: "Strategické kooperační partnerství" # todo: NEW TRANSLATION
 CHI_NKO_strategic_partnership_desc: "Povýšení bilaterálních vztahů na komplexní strategické kooperační partnerství, nejvyšší úroveň čínské diplomatické kategorizace, zařadí KLDR po bok Ruska a Pákistánu do vnitřního kruhu čínského strategického uspořádání. Deklarace zaváže obě strany ke konzultacím o všech hlavních mezinárodních otázkách a vyšle Washingtonu, Soulu a Tokiu signál, že Peking považuje bezpečnost Severní Koreje za neoddělitelnou od své vlastní." # todo: NEW TRANSLATION
 CHI_nko_juche_production: "Výroba velkých rezerv" # todo: NEW TRANSLATION
 CHI_nko_juche_production_desc: "Severokorejští dělníci vyslaní prostřednictvím pracovního programu Tung-pej přinášejí specifickou průmyslovou disciplínu formovanou desetiletími doktríny soběstačnosti čučche: schopnost udržovat velkoobjemovou výrobu jednoduchých, osvědčených konstrukcí s minimálními režijními náklady. Začlenění této pracovní síly do sítě subdodavatelů NORINCO v oblasti Tan-tungu sníží jednotkové náklady a rozšíří kapacitu výrobních linek v celém rozsahu pěchotního vybavení úřadu." # todo: NEW TRANSLATION
 NKO_chi_manufacturing_assistance: "Čínské výrobní standardy" # todo: NEW TRANSLATION
 NKO_chi_manufacturing_assistance_desc: "Technická pomoc od čínských státních obranných podniků, především dceřiných společností NORINCO působících prostřednictvím Korea Mining Development Trading Corporation, přenesla do továren lehkých zbraní 1. úřadu standardizované výrobní tolerance, postupy kontroly kvality a specifikace součástek. Výsledkem je méně zmetků, konzistentnější balistický výkon a nižší jednotkové náklady napříč výrobními linkami ručních a obsluhou používaných zbraní úřadu." # todo: NEW TRANSLATION
 CHI_NKO_border_trade_idea: "Obchodní zóna Hwanggumpyong" # todo: NEW TRANSLATION
 CHI_NKO_energy_supply_idea: "Dohoda o dodávkách paliva CNPC" # todo: NEW TRANSLATION
 CHI_NKO_telecom_idea: "Program telekomunikační infrastruktury Koryolink" # todo: NEW TRANSLATION
 CHI_NKO_telecom_idea_desc: "Společný podnik rozšiřující mobilní a datovou infrastrukturu Koryolinku, propojující severokorejské telekomunikace s čínskými sítěmi a zlepšující komunikaci přes hranici." # todo: NEW TRANSLATION
 CHI_NKO_shared_modifier: "Čínsko-severokorejské vztahy" # todo: NEW TRANSLATION
 CHI_NKO_shared_modifier_desc: "Sleduje nahromaděnou hloubku čínsko-severokorejské spolupráce v hospodářské, vojenské a politické oblasti. Silnější vazby zlepšují zemědělskou a průmyslovou výrobu, obchodní vztahy, efektivitu továren a vývoz surovin, zároveň posilují plánování armády, organizaci a protivzdušnou obranu; hlubší sladění také rozšiřuje zpravodajské kapacity a zvyšuje politickou moc a podporu války, protože oba státy užší spoluprací koordinují své kroky." # todo: NEW TRANSLATION
 CHI_eternal_allies: "Čučche-komunistické spojenectví" # todo: NEW TRANSLATION
 CHI_NKO_telecom_network_tt: "[CHI_NKO_telecom_idea_desc]\n" # todo: NEW TRANSLATION
 CHI_NKO_no_influence_puppet_TT: "Systém vlivu nemůže podrobit §Y[NKO.GetNameWithFlag]§!. Formální podřízení Severní Koreje probíhá místo toho prostřednictvím společného stromu fokusů Číny a KLDR a vrcholí Pekingským urovnáním." # todo: NEW TRANSLATION
