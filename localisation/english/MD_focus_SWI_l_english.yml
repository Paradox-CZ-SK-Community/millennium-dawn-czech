l_english:
 switzerland_focus: "Švýcarský strom zaměření" # todo: NEW TRANSLATION
 SWI_the_mountain_fortress: "Horská pevnost" # todo: NEW TRANSLATION
 SWI_the_mountain_fortress_desc: "Nejúčinnější obranou, kterou máme, jsou naše hory. Pokud si chceme udržet obrannou převahu, musíme je dále opevnit." # todo: CHANGED
 SWI_guns_for_the_population: "Zbraně pro obyvatelstvo" # todo: NEW TRANSLATION
 SWI_guns_for_the_population_desc: "Národ obklopen silnějšími národy musí mít obyvatelstvo, které je vždy připraveno bránit své domovy." # todo: NEW TRANSLATION
 SWI_zurich_industrial_project: "Curyšský průmyslový projekt" # todo: NEW TRANSLATION
 SWI_zurich_industrial_project_desc: "Abychom mohli konkurovat našim sousedům, musíme mít robustní průmyslový sektor." # todo: NEW TRANSLATION
 SWI_strengthen_the_secret_services: "Posílit tajné služby" # todo: NEW TRANSLATION
 SWI_strengthen_the_secret_services_desc: "Tajné služby mohou výrazně pomoci odhalovat hrozby jak vně, tak uvnitř naší země." # todo: NEW TRANSLATION
 SWI_military_investments_1: "Program vyzbrojování I" # todo: CHANGED
 SWI_military_investments_1_desc: "Financujte první část každoročního Programu vyzbrojování předloženého Parlamentu a přeměňte trvale vysoký rozpočet na obranu v novou průmyslovou kapacitu." # todo: CHANGED
 SWI_geneva_industrial_project: "Ženeva průmyslový projekt" # todo: NEW TRANSLATION
 SWI_geneva_industrial_project_desc: "Ženeva by vždy mohla využít více pracovních míst v továrnách. Oblast bychom měli kompletně reformovat." # todo: CHANGED
 SWI_secure_the_swiss_borders: "Zabezpečit švýcarské hranice" # todo: NEW TRANSLATION
 SWI_secure_the_swiss_borders_desc: "Začneme budovat rozsáhlé sítě hraničních hlídek a kontrolních stanovišť, aby bylo zajištěno, že nikdo nemůže vstoupit, aniž bychom o tom věděli." # todo: NEW TRANSLATION
 SWI_italian_forts: "Italské pevnosti" # todo: NEW TRANSLATION
 SWI_italian_forts_desc: "Vždy musíme být připraveni na útok od našich jižních sousedů." # todo: NEW TRANSLATION
 SWI_german_forts: "Německé pevnosti" # todo: NEW TRANSLATION
 SWI_german_forts_desc: "Během druhé světové války jsme se nebezpečně přiblížili válce s Německem. Nesmí nás zaskočit, pokud německá agrese znovu zesílí." # todo: CHANGED
 SWI_french_forts: "Francouzské pevnosti" # todo: NEW TRANSLATION
 SWI_french_forts_desc: "Není pravda, že Francie nás dřív nenapadla. Nemůžeme si dovolit být přemoženi, jako kdysi. Budeme připraveni pro případ nouze." # todo: NEW TRANSLATION
 SWI_military_investments_2: "Program vyzbrojování II" # todo: CHANGED
 SWI_military_investments_2_desc: "Pokračujte v Programu vyzbrojování druhou vlnou nákupů poté, co se prokázalo, že soustavné investice přinášejí soběstačný obranný průmysl." # todo: CHANGED
 SWI_the_cern_project: "Projekt CERN" # todo: NEW TRANSLATION
 SWI_the_cern_project_desc: "Jaderný výzkum je budoucnost. Měli bychom zahájit rozsáhlé studie v této oblasti." # todo: NEW TRANSLATION
 SWI_the_large_hadron_collider: "Institut Paula Scherrera" # todo: CHANGED
 SWI_the_large_hadron_collider_desc: "Institut Paula Scherrera ve Villigenu je největším výzkumným centrem Švýcarska. Spojuje urychlovače částic a neutronové zdroje s hlubokými odbornými znalostmi v oblasti reaktorových materiálů a jaderné bezpečnosti. Jeho práce tvoří základ civilního jaderného programu Konfederace." # todo: CHANGED
 SWI_construct_power_plants: "Záložní elektrárny" # todo: CHANGED
 SWI_construct_power_plants_desc: "Alpská vodní energie nás zásobuje po většinu roku, ale chladná a suchá zima může způsobit nedostatek elektřiny v síti. Pohotovostní plynové elektrárny, jako je ta v Birru, poskytují Konfederaci zálohu pro případ, že budou dovozy omezené." # todo: CHANGED
 SWI_expand_swiss_nuclear_plants: "Rozšíření jaderné flotily" # todo: NEW TRANSLATION
 SWI_expand_swiss_nuclear_plants_desc: "Beznau, Gösgen a Leibstadt stále pokrývají domácí poptávku, ale rezerva se zmenšuje. Rozšíření kapacity reaktorů nyní zajistí švýcarskou energetickou nezávislost na celou generaci." # todo: NEW TRANSLATION
 SWI_research_and_development: "Věda a technologie Armasuisse" # todo: NEW TRANSLATION
 SWI_research_and_development_desc: "Armasuisse S+T je technologické centrum ministerstva obrany, které spojuje senzory, komunikace, kybernetickou bezpečnost a výzkum materiálů. Udržováním technologické základny důležité pro bezpečnost doma Švýcarsko v krizi minimalizuje svou závislost na zahraničních dodavatelích." # todo: NEW TRANSLATION
 SWI_asd_gruppe: "Výzkumný program domény ETH" # todo: NEW TRANSLATION
 SWI_asd_gruppe_desc: "Propojit armasuisse s doménou ETH, ETH Zürich a EPFL v rámci společného bezpečnostního výzkumného programu. Federální franky a akademické talenty se spojí, aby proměnily špičkový výzkum v obranné schopnosti nasazené v terénu." # todo: NEW TRANSLATION
 SWI_small_arms_development: "Vývoj pěchotních zbraní" # todo: NEW TRANSLATION
 SWI_small_arms_development_desc: "Modernizovat nástupce služební pušky Stgw 90 (SG 550) a její optiku s využitím odborných znalostí SIG a B&T. Milice žije a umírá na spolehlivosti zbraně v rukou každého občana-vojáka." # todo: NEW TRANSLATION
 SWI_sig_ag_research_teams: "Švýcarské výzkumné týmy zbrojního průmyslu" # todo: NEW TRANSLATION
 SWI_sig_ag_research_teams_desc: "V Neuhausenu zřídit specializované konstrukční týmy v tradici ručních zbraní SIG. Desítky let švýcarské přesné výroby zaměřit na příští generaci individuálních a družstevních zbraní." # todo: NEW TRANSLATION
 SWI_precision_launch_platforms: "Řízené protitankové systémy" # todo: NEW TRANSLATION
 SWI_precision_launch_platforms_desc: "Vyvinout přenosné řízené protitankové systémy, které sesednutým granátníkům poskytnou rozhodující údernou sílu proti obrněncům v členitém terénu alpského podhůří." # todo: NEW TRANSLATION
 SWI_support_platforms_research: "Integrované velitelské systémy" # todo: NEW TRANSLATION
 SWI_support_platforms_research_desc: "Rozvíjet bojištní řídicí síť FIS Heer, aby velitelé v reálném čase sdíleli jednotný taktický obraz. Švýcarské velení, řízení a komunikace propojí rozptýlenou milici v jedinou sílu." # todo: NEW TRANSLATION
 SWI_mass_produced_firearms: "Výroba munice a ručních zbraní" # todo: NEW TRANSLATION
 SWI_mass_produced_firearms_desc: "Rozšířit domácí výrobu munice a ručních zbraní prostřednictvím SwissP Defence (dříve RUAG Ammotec). Zaručené národní zásoby udrží milici vyzbrojenou bez závislosti na dovozu." # todo: NEW TRANSLATION
 SWI_armored_vehicles_study: "Program obrněných vozidel" # todo: NEW TRANSLATION
 SWI_armored_vehicles_study_desc: "Koordinovat švýcarský průmysl obrněných vozidel kolem rodin GDELS-Mowag Piranha a Eagle, kolové páteře mechanizovaných brigád." # todo: NEW TRANSLATION
 SWI_airframes_study: "Letecký program" # todo: NEW TRANSLATION
 SWI_airframes_study_desc: "Soustředit švýcarské letecké odborné znalosti u společnosti Pilatus ve Stansu a RUAG Aviation v Emmenu, od cvičných draků po údržbu a konstrukce bojových letounů." # todo: NEW TRANSLATION
 SWI_mbt_concept: "Modernizace Leopardu 2" # todo: NEW TRANSLATION
 SWI_mbt_concept_desc: "Modernizovat flotilu Pz 87 Leopard 2 balíčky řízení palby, ochrany a mobility vedenými společností RUAG, aby hlavní bojový tank zůstal relevantní i v nadcházejících desetiletích." # todo: NEW TRANSLATION
 SWI_spart_systems: "Samohybné dělostřelectvo" # todo: NEW TRANSLATION
 SWI_spart_systems_desc: "Prostřednictvím modernizačního programu KAWEST zvýšit dosah a přesnost samohybné houfnice M109 (Pz Hb) a zajistit pohotovou palebnou podporu v horském terénu." # todo: NEW TRANSLATION
 SWI_spaa_systems: "Mobilní protivzdušná obrana" # todo: NEW TRANSLATION
 SWI_spaa_systems_desc: "Nasadit mobilní vozidlo krátkého dosahu protivzdušné obrany postavené na systému Rheinmetall Air Defence Skyranger ráže 35 mm, které ochrání manévrující síly před letadly a drony." # todo: NEW TRANSLATION
 SWI_production_line_innovations: "Automatizované výrobní linky" # todo: NEW TRANSLATION
 SWI_production_line_innovations_desc: "Modernizovat montážní haly RUAG a Mowag moderní automatizací, zvýšit výrobu a uvolnit nedostatkovou kvalifikovanou pracovní sílu pro hodnotnější práci." # todo: NEW TRANSLATION
 SWI_import_missile_tech: "Integrace řízených střel" # todo: NEW TRANSLATION
 SWI_import_missile_tech_desc: "Získat a integrovat moderní střely vzduch-vzduch a země-vzduch a vybudovat domácí know-how pro jejich údržbu a přizpůsobování švýcarským platformám." # todo: NEW TRANSLATION
 SWI_helicopter_research: "Program vrtulníkového letectva" # todo: NEW TRANSLATION
 SWI_helicopter_research_desc: "Udržovat a modernizovat flotily Super Puma / Cougar a EC635 prostřednictvím RUAG Aviation, pracovních koní švýcarské přepravy, spojovací služby a horské záchrany." # todo: NEW TRANSLATION
 SWI_air_cavalry_armament: "Výzbroj leteckého jezdectva" # todo: NEW TRANSLATION
 SWI_air_cavalry_armament_desc: "Vyzbrojit flotilu Super Puma a vytvořit k ní leteckou výsadkovou doktrínu, čímž se transportní letky promění v manévrovou sílu, kterou může milice povolat." # todo: NEW TRANSLATION
 SWI_gunship_development: "Vývoj bitevních vrtulníků" # todo: NEW TRANSLATION
 SWI_gunship_development_desc: "Nasadit ozbrojené varianty vrtulníků pro blízkou podporu a ozbrojený průzkum, levnější na pořízení i údržbu než specializovaná flotila bitevních vrtulníků." # todo: NEW TRANSLATION
 SWI_revise_isolation_strategy: "Za hranice Réduitu" # todo: NEW TRANSLATION
 SWI_revise_isolation_strategy_desc: "Opustit statický alpský Réduit ve prospěch moderní dynamické územní obrany a přizpůsobit reformy Dalšího rozvoje armády (WEA) změněnému obrazu hrozeb." # todo: NEW TRANSLATION
 SWI_log_tunnel_network: "Alpské tunelové sklady" # todo: NEW TRANSLATION
 SWI_log_tunnel_network_desc: "Využít skrytou síť kavernových skladů a tunelů vyhloubených v horách, kde lze skladovat munici a palivo mimo dosah jakéhokoli leteckého úderu." # todo: NEW TRANSLATION
 SWI_domestic_res_output: "Národní hospodářské zásobování" # todo: NEW TRANSLATION
 SWI_domestic_res_output_desc: "Posílit wirtschaftliche Landesversorgung, právní rámec zajišťující v nouzi plynulý tok energie, potravin a kriticky důležitých statků k národu." # todo: NEW TRANSLATION
 SWI_strat_supply_reserves: "Povinné strategické rezervy" # todo: NEW TRANSLATION
 SWI_strat_supply_reserves_desc: "Prosadit systém Pflichtlager povinných zásob, který udržuje měsíční rezervy paliva, potravin a léčiv pro případ blokády nebo krize." # todo: NEW TRANSLATION
 SWI_environmental_adaptation: "Doktrína alpského válčení" # todo: NEW TRANSLATION
 SWI_environmental_adaptation_desc: "Vycvičit a vybavit specializované horské jednotky k boji a přežití v zimních podmínkách vysokých nadmořských výšek a proměnit samotný terén ve zbraň." # todo: NEW TRANSLATION
 SWI_repair_decaying_forts: "Obnovení alpských pevností" # todo: NEW TRANSLATION
 SWI_repair_decaying_forts_desc: "Znovu aktivovat vybrané dělostřelecké pevnosti a opevněná postavení vyřazená v rámci reforem Armáda 95 a Armáda XXI a obnovit hloubku horské obrany." # todo: NEW TRANSLATION
 SWI_graubunden_gold_silver: "Těžba alpských nerostů" # todo: NEW TRANSLATION
 SWI_graubunden_gold_silver_desc: "Znovu otevřít nečinná ložiska v graubündenských Alpách a zajistit domácí přísun strategických materiálů pro zbrojní průmysl." # todo: NEW TRANSLATION
 SWI_graubunden_iron_mines: "Těžba alpské rudy" # todo: NEW TRANSLATION
 SWI_graubunden_iron_mines_desc: "Využít alpskou železnou rudu pro zásobování malé domácí ocelářské výroby a snížit závislost válečné výroby na dovážených surovinách." # todo: NEW TRANSLATION
 SWI_mil_industry_expansion: "Rozšíření obranné průmyslové základny" # todo: NEW TRANSLATION
 SWI_mil_industry_expansion_desc: "Rozšířit průmyslovou základnu důležitou pro bezpečnost, jejíž udržování Švýcarsku ukládá zákon o válečném materiálu. Neutrální národ musí být schopen vyzbrojit a zásobovat sám sebe, když se uzavřou zahraniční dodavatelské trasy." # todo: NEW TRANSLATION
 SWI_sig_neuhausen_factory: "Závody SIG v Neuhausenu" # todo: NEW TRANSLATION
 SWI_sig_neuhausen_factory_desc: "Rozšířit historické závody SIG v Neuhausenu am Rheinfall, srdci švýcarské výroby ručních zbraní od devatenáctého století." # todo: NEW TRANSLATION
 SWI_sig_graubunden_factory: "Rozptýlená výroba zbraní" # todo: NEW TRANSLATION
 SWI_sig_graubunden_factory_desc: "Rozptýlit výrobu ručních zbraní a munice do údolí Graubündenu a posílit průmyslovou základnu proti likvidačnímu úderu v souladu se švýcarskou doktrínou rozptýlení." # todo: NEW TRANSLATION
 SWI_infrastructural_advancement: "Průmyslová infrastruktura" # todo: NEW TRANSLATION
 SWI_infrastructural_advancement_desc: "Modernizovat železniční a silniční spojení zásobující zbrojní závody, aby se suroviny a hotové vybavení spolehlivě přepravovaly i pod válečným tlakem." # todo: NEW TRANSLATION
 SWI_expand_gdels_mowag: "Rozšíření GDELS-Mowag Kreuzlingen" # todo: NEW TRANSLATION
 SWI_expand_gdels_mowag_desc: "Rozšířit závod GDELS-Mowag v Kreuzlingenu, domov obrněných vozidel Piranha a Eagle sloužících švýcarské armádě i exportním zákazníkům." # todo: NEW TRANSLATION
 SWI_new_factory_ruag: "Nové zařízení RUAG" # todo: NEW TRANSLATION
 SWI_new_factory_ruag_desc: "Otevřít nové kapacity RUAG MRO Switzerland pro generální opravy letadel a pozemních systémů. Národní politika vyhrazuje velkou většinu švýcarské vojenské údržby společnosti RUAG." # todo: NEW TRANSLATION
 SWI_cooperation_with_rheinmetall: "Spolupráce s Rheinmetallem" # todo: NEW TRANSLATION
 SWI_cooperation_with_rheinmetall_desc: "Prohloubit vazby s Rheinmetall Air Defence AG v Zürichu, dědicem společnosti Oerlikon Contraves a její tradice 35mm kanónů, systémů Skyguard a Skyshield protivzdušné obrany." # todo: NEW TRANSLATION
 SWI_cooperation_with_thales: "Spolupráce s Thales" # todo: NEW TRANSLATION
 SWI_cooperation_with_thales_desc: "Spolupracovat s Thales Suisse na radarech, optoelektronice a systémech velení a řízení a zapojit švýcarské síly do osvědčených senzorových a síťových technologií." # todo: NEW TRANSLATION
 SWI_general_staff: "Štáb ozbrojených sil" # todo: NEW TRANSLATION
 SWI_general_staff_desc: "Soustředit plánování a doktrínu pod Štábem ozbrojených sil (Führungsstab der Armee) podřízeným náčelníkovi ozbrojených sil a poskytnout milici moderní společné velení." # todo: NEW TRANSLATION
 SWI_gemeinsames_ok: "Kommando Spezialkräfte" # todo: NEW TRANSLATION
 SWI_gemeinsames_ok_desc: "Vybudovat Velitelství speciálních sil, jeho Armádní průzkumný oddíl 10 a granátnické formace v malou, ale elitní špičku milice." # todo: NEW TRANSLATION
 SWI_ausbildungskommando: "Kommando Ausbildung" # todo: NEW TRANSLATION
 SWI_ausbildungskommando_desc: "Reformovat Velitelství výcviku, které řídí školy rekrutů a opakovací kurzy. Síla švýcarského systému spočívá v celé populaci procházející disciplinovaným a standardizovaným výcvikem." # todo: NEW TRANSLATION
 SWI_airforce_modernization: "Program Air2030" # todo: NEW TRANSLATION
 SWI_airforce_modernization_desc: "Spustit Air2030, největší nákup zbraní v moderních švýcarských dějinách, nahradit stárnoucí F-5 Tiger a F/A-18 Hornet a na celou generaci obnovit pozemní protivzdušnou obranu." # todo: NEW TRANSLATION
 SWI_general_air_defense: "Hodnocení nových stíhacích letounů" # todo: NEW TRANSLATION
 SWI_general_air_defense_desc: "Zahájit hodnocení nových stíhacích letounů (NKF), létat s kandidáty vybranými do užšího výběru v Payerne a měřit je podle požadavků na ochranu hustého a hornatého švýcarského vzdušného prostoru." # todo: NEW TRANSLATION
 SWI_import_eurofighters: "Nabídka Eurofighter Typhoon" # todo: NEW TRANSLATION
 SWI_import_eurofighters_desc: "Posoudit Airbus a BAE Eurofighter Typhoon, osvědčený evropský stíhací letoun pro získání vzdušné převahy nabízený s rozsáhlým balíčkem průmyslové účasti." # todo: NEW TRANSLATION
 SWI_import_rafale_fighters: "Nabídka Dassault Rafale" # todo: NEW TRANSLATION
 SWI_import_rafale_fighters_desc: "Posoudit Dassault Rafale, univerzální víceúčelový stíhací letoun Francie, a porovnat jeho výhody pro suverenitu a nabídky kompenzací s ostatními kandidáty." # todo: NEW TRANSLATION
 SWI_german_manufacturing: "Německé průmyslové kompenzace" # todo: NEW TRANSLATION
 SWI_german_manufacturing_desc: "Vyjednat transfer technologií a kompenzační práce s německy vedeným konsorciem Eurofighter a nasměrovat nákupní franky zpět do švýcarského průmyslu." # todo: NEW TRANSLATION
 SWI_french_manufacturing: "Francouzské průmyslové kompenzace" # todo: NEW TRANSLATION
 SWI_french_manufacturing_desc: "Vyjednat kompenzační a průmyslové dohody s Dassault a Thales a zajistit švýcarský podíl na výrobě výměnou za nákup letounů." # todo: NEW TRANSLATION
 SWI_interception_practices: "Výběr F-35A Lightning II" # todo: NEW TRANSLATION
 SWI_interception_practices_desc: "Vybrat Lockheed Martin F-35A, jehož fúze senzorů a stealth překonaly ostatní v hodnocení. Situační povědomí páté generace promění švýcarské zachytávání a pohotovostní službu." # todo: NEW TRANSLATION
 SWI_multi_role_specialization: "Integrace víceúčelových schopností" # todo: NEW TRANSLATION
 SWI_multi_role_specialization_desc: "Integrovat F-35A do rolí protivzdušné obrany i úderných operací a vyzbrojit jej střelami AIM-120 a AIM-9X a přesnou municí pro jedinou flexibilní flotilu." # todo: NEW TRANSLATION
 SWI_air_sup_adaptation: "Nepřetržitá ochrana vzdušného prostoru" # todo: NEW TRANSLATION
 SWI_air_sup_adaptation_desc: "Zřídit nepřetržitou pohotovostní službu nad švýcarským vzdušným prostorem, schopnost, které letectvo dosáhlo v roce 2020 a nyní ji udržuje s novou flotilou stíhaček." # todo: NEW TRANSLATION
 SWI_acquire_transport_planes: "Taktická letecká přeprava" # todo: NEW TRANSLATION
 SWI_acquire_transport_planes_desc: "Rozšířit kapacitu letecké přepravy kolem flotily Super Puma a Cougar a lehkých letounů s pevnými křídly pro přepravu vojáků a humanitárních zásob po zemi i do zahraničí." # todo: NEW TRANSLATION
 SWI_airbase_expansion: "Modernizace leteckých základen" # todo: NEW TRANSLATION
 SWI_airbase_expansion_desc: "Modernizovat hlavní operační základny v Payerne, Meiringenu a Emmenu včetně horských kavernových úkrytů, které umožňují letounům přečkat útok pod zemí." # todo: NEW TRANSLATION
 SWI_nasams_batteries: "Pozemní protivzdušná obrana Patriot" # todo: NEW TRANSLATION
 SWI_nasams_batteries_desc: "Pořídit v rámci Air2030 dálkové systémy země-vzduch Patriot a poskytnout Švýcarsku první skutečnou obranu proti výškovým a dálkovým hrozbám." # todo: NEW TRANSLATION
 SWI_florako: "Vzdušný dohled FLORAKO" # todo: NEW TRANSLATION
 SWI_florako_desc: "Provozovat systém FLORAKO, integrovanou radarovou a velitelskou síť, která nepřetržitě sleduje švýcarský vzdušný prostor a navádí stíhačky i pozemní protivzdušnou obranu." # todo: NEW TRANSLATION
 SWI_suisse_politique: "Švýcarská politika" # todo: NEW TRANSLATION
 SWI_suisse_politique_desc: "Vytvořit rámec pro švýcarský národní strom zaměření a určit počáteční politický směr Konfederace." # todo: NEW TRANSLATION
 SWI_strengthening_the_federation: "Posílení federace" # todo: NEW TRANSLATION
 SWI_strengthening_the_federation_desc: "Upevnit vazby mezi kantony a posílit pravomoc ústřední vlády, aby byla zajištěna národní jednota." # todo: NEW TRANSLATION
