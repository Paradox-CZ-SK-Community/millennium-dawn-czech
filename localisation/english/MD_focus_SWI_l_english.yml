 SWI_workers_council_desc: "Formálně ustanovit dělnické rady nejvyššími hospodářskými a politickými orgány státu a dát proletariátu přímou moc." # todo: NEW TRANSLATION
 SWI_nationalize_banks: "Znárodnění bank" # todo: NEW TRANSLATION
 SWI_nationalize_banks_desc: "Převzít kontrolu nad mocným a tajnůstkářským bankovním sektorem země a svěřit jej do federálního veřejného vlastnictví ve prospěch lidu." # todo: NEW TRANSLATION
 SWI_agricultural_collectivization: "Kolektivizace zemědělství" # todo: NEW TRANSLATION
 SWI_agricultural_collectivization_desc: "Zrušit soukromé vlastnictví půdy a zorganizovat všechny farmy do velkých státem řízených kolektivních zemědělských podniků." # todo: NEW TRANSLATION
 SWI_workers_cooperatives: "Dělnická družstva" # todo: NEW TRANSLATION
 SWI_workers_cooperatives_desc: "Podpořit vznik družstev vlastněných a řízených pracovníky jako dominantního modelu výroby při zachování decentralizované hospodářské kontroly." # todo: NEW TRANSLATION
 SWI_militias_of_the_people: "Lidové milice" # todo: NEW TRANSLATION
 SWI_militias_of_the_people_desc: "Rozpustit stálou armádu a nahradit ji decentralizovanou sítí ozbrojených, politicky spolehlivých lidových milicí z řad dělnické třídy." # todo: NEW TRANSLATION
 SWI_secret_police: "Tajná policie" # todo: NEW TRANSLATION
 SWI_secret_police_desc: "Zřídit mocnou a všudypřítomnou tajnou policii ke sledování kontrarevoluční činnosti a potlačování vnitřního nesouhlasu." # todo: NEW TRANSLATION
 SWI_denounce_eu: "Odsouzení EU" # todo: NEW TRANSLATION
 SWI_denounce_eu_desc: "Formálně odsoudit Evropskou unii jako buržoazní organizaci a ukončit veškerou švýcarskou spolupráci či politické vazby." # todo: NEW TRANSLATION
 SWI_suppress_party_enemies: "Potlačení nepřátel strany" # todo: NEW TRANSLATION
 SWI_suppress_party_enemies_desc: "Využít plnou moc státu k odstranění a umlčení všech soupeřících politických stran a organizací." # todo: NEW TRANSLATION
 SWI_multilingual_worker_solidarity: "Mnohojazyčná dělnická solidarita" # todo: NEW TRANSLATION
 SWI_multilingual_worker_solidarity_desc: "Zdůraznit společnou třídní identitu napříč jazykovými rozdíly země a vytvořit jednotný mnohojazyčný proletariát." # todo: NEW TRANSLATION
 SWI_peoples_tribune: "Lidový tribun" # todo: NEW TRANSLATION
 SWI_peoples_tribune_desc: "Zřídit úřad lidového tribuna, voleného zástupce působícího jako lidová kontrola moci ústřední vlády." # todo: NEW TRANSLATION
 SWI_central_committee: "Vláda ústředního výboru" # todo: NEW TRANSLATION
 SWI_central_committee_desc: "Svěřit nejvyšší politickou moc malému a mocnému ústřednímu výboru strany a zajistit ideologickou čistotu a centralizované velení." # todo: NEW TRANSLATION
 SWI_peoples_constitution: "Lidová ústava" # todo: NEW TRANSLATION
 SWI_peoples_constitution_desc: "Navrhnout a přijmout novou ústavu zakotvující práva dělnické třídy a formalizující socialistickou strukturu státu." # todo: NEW TRANSLATION
 SWI_national_charter: "Národní charta" # todo: NEW TRANSLATION
 SWI_national_charter_desc: "Sepsat národní chartu, která nahradí starou ústavu a formálně vyhlásí závazek nového státu k nacionalistickým a autoritářským principům." # todo: NEW TRANSLATION
 SWI_propaganda_machine: "Propagandistický aparát" # todo: NEW TRANSLATION
 SWI_propaganda_machine_desc: "Vybudovat sofistikovaný státem řízený mediální aparát ke kontrole toku informací a zajištění ideologické poslušnosti občanů." # todo: NEW TRANSLATION
 SWI_economic_self_sufficiency: "Hospodářská soběstačnost" # todo: NEW TRANSLATION
 SWI_economic_self_sufficiency_desc: "Přesměrovat celé švýcarské hospodářství k autarkii, upřednostnit domácí výrobu a odstranit závislost na zahraničním obchodu." # todo: NEW TRANSLATION
 SWI_expel_foreign_companies: "Vyhnání zahraničních společností" # todo: NEW TRANSLATION
 SWI_expel_foreign_companies_desc: "Vynutit okamžité uzavření a znárodnění všech podniků v zahraničním vlastnictví působících na švýcarském území." # todo: NEW TRANSLATION
 SWI_revive_the_nf: "Obnovení Národní fronty" # todo: NEW TRANSLATION
 SWI_revive_the_nf_desc: "Obnovit historickou Národní frontu a posílit její vůdce při prosazování radikálního nacionalistického a autoritářského politického programu." # todo: NEW TRANSLATION
 SWI_national_unity: "Národní jednota" # todo: NEW TRANSLATION
 SWI_national_unity_desc: "Potlačit všechny vnitřní rozpory a ideologické konflikty a vytvořit jedinou sjednocenou národní vůli pod novým režimem." # todo: NEW TRANSLATION
 SWI_leader_of_a_nation: "Vůdce národa" # todo: NEW TRANSLATION
 SWI_leader_of_a_nation_desc: "Udělit charismatické národní osobnosti rozsáhlé nové pravomoci a přeměnit národ v silné personalizované vedení." # todo: NEW TRANSLATION
 SWI_militarize_society: "Militarizace společnosti" # todo: NEW TRANSLATION
 SWI_militarize_society_desc: "Začlenit vojenské principy do civilního života, vynutit povinnou službu a podporovat disciplínu a poslušnost v celém národě." # todo: NEW TRANSLATION
 SWI_fascist_propaganda: "Fašistická propaganda" # todo: NEW TRANSLATION
 SWI_fascist_propaganda_desc: "Spustit agresivní národní mediální kampaň propagující ideologii režimu a démonizující všechny domnělé nepřátele státu." # todo: NEW TRANSLATION
 SWI_censorship: "Cenzura" # todo: NEW TRANSLATION
 SWI_censorship_desc: "Uvalit úplnou kontrolu nad všemi formami médií, umění a intelektuální tvorby za účelem zajištění absolutní ideologické konformity." # todo: NEW TRANSLATION
 SWI_pan_alpine_identity: "Panalpská identita" # todo: NEW TRANSLATION
 SWI_pan_alpine_identity_desc: "Vyhlásit existenci společného „alpského lidu“ ve Švýcarsku a sousedních zemích a položit ideologické základy expanze." # todo: NEW TRANSLATION
 SWI_ban_radical_neutrals: "Zákaz radikálních neutralistů" # todo: NEW TRANSLATION
 SWI_ban_radical_neutrals_desc: "Postavit mimo zákon všechny politické skupiny prosazující absolutní pasivní neutralitu a označit je za nevlastenecké a nebezpečné pro stát." # todo: NEW TRANSLATION
 SWI_german_superiority: "Německá nadřazenost" # todo: NEW TRANSLATION
 SWI_german_superiority_desc: "Upřednostnit německy mluvící obyvatelstvo a přijmout politiku kulturního a jazykového sbližování s Německem." # todo: NEW TRANSLATION
 SWI_swiss_identity: "Švýcarská identita" # todo: NEW TRANSLATION
 SWI_swiss_identity_desc: "Prosazovat jedinečnou, mnohonárodnostní a tvrdě nezávislou švýcarskou identitu odlišnou od všech sousedních velmocí." # todo: NEW TRANSLATION
 SWI_alpine_destiny: "Alpský úděl" # todo: NEW TRANSLATION
 SWI_alpine_destiny_desc: "Požadovat sjednocení všech alpských území pod švýcarskou vlajkou a připravit armádu na blížící se sjednocovací válku." # todo: NEW TRANSLATION
 SWI_one_party_state: "Stát jedné strany" # todo: NEW TRANSLATION
 SWI_one_party_state_desc: "Zrušit všechny zbývající demokratické instituce a formalizovat úplný a trvalý politický monopol vládnoucí strany." # todo: NEW TRANSLATION
 SWI_further_strengthen_the_federation: "Další posílení federace" # todo: NEW TRANSLATION
 SWI_further_strengthen_the_federation_desc: "Švýcarsko je národ vybudovaný na kompromisu mezi kantony, kulturami a jazyky. Dalším posílením federální struktury můžeme zajistit větší stabilitu, zlepšit koordinaci mezi kantony a posílit jednotu Konfederace tváří v tvář vnitřnímu napětí i vnějším hrozbám." # todo: NEW TRANSLATION
 SWI_universal_education: "Všeobecné vzdělávání" # todo: NEW TRANSLATION
 SWI_universal_education_desc: "Vzdělání je základem silného a prosperujícího národa. Poskytnutím všeobecného přístupu ke školnímu vzdělávání zajistíme, že všichni občané budou mít dovednosti a znalosti potřebné k utváření budoucnosti Švýcarska." # todo: NEW TRANSLATION
 SWI_fund_ngo: "Financování nevládních organizací" # todo: NEW TRANSLATION
 SWI_fund_ngo_desc: "Nevládní organizace hrají zásadní úlohu v podpoře komunit a řešení společenských problémů. Státním financováním můžeme posílit jejich schopnost sloužit veřejnosti a doplňovat úsilí vlády." # todo: NEW TRANSLATION
 SWI_ban_neutrals: "Zakázaní neutralisté" # todo: NEW TRANSLATION
 SWI_ban_neutrals_desc: "Švýcarsko si nemůže dovolit zůstat neutrální tváří v tvář rostoucím hrozbám a globální nestabilitě. Zákazem neutrality potvrzujeme aktivní úlohu našeho národa v mezinárodních záležitostech a připravujeme se bránit své zájmy v zahraničí." # todo: NEW TRANSLATION
 SWI_militarized_society: "Militarizovaná společnost" # todo: NEW TRANSLATION
 SWI_militarized_society_desc: "Silný národ potřebuje silné občanstvo. Přijetím militarizované společnosti vštípíme disciplínu, připravenost a sdílenou odpovědnost za obranu Švýcarska." # todo: NEW TRANSLATION
 SWI_secret_agency: "Tajná agentura" # todo: NEW TRANSLATION
 SWI_secret_agency_desc: "Zpravodajství je páteří národní bezpečnosti. Zřízením tajné agentury může Švýcarsko sledovat hrozby, shromažďovat zásadní informace a rozhodně jednat dříve, než nebezpečí dosáhne našich hranic." # todo: NEW TRANSLATION
 SWI_swiss_companies_only: "Pouze švýcarské společnosti" # todo: NEW TRANSLATION
 SWI_swiss_companies_only_desc: "Pro posílení hospodářství a ochranu domácích zájmů bude v určitých odvětvích povoleno působit pouze švýcarským společnostem. To zajistí práci našim občanům a udrží průmysl pod národní kontrolou." # todo: NEW TRANSLATION
 SWI_self_sufficiency: "Soběstačnost" # todo: NEW TRANSLATION
 SWI_self_sufficiency_desc: "Švýcarsko musí snížit svou závislost na zahraničním dovozu a zajistit domácí výrobu nezbytných zdrojů. Podporou soběstačnosti ochráníme hospodářství a posílíme národní odolnost." # todo: NEW TRANSLATION
 SWI_workers: "Pracující" # todo: NEW TRANSLATION
 SWI_workers_desc: "Národ je jen tak silný jako jeho pracovní síla. Politikou ve prospěch pracujících zajistíme spravedlivé mzdy, lepší pracovní podmínky a spokojenější a produktivnější obyvatelstvo." # todo: NEW TRANSLATION
 SWI_politica_estera_svizzera: "Politica Estera Svizzera" # todo: NEW TRANSLATION
 SWI_politica_estera_svizzera_desc: "Zahraniční politika Švýcarska byla vždy neutrální. Pokud z této cesty sejdeme, může nám to v různých oblastech přinést výhodu." # todo: NEW TRANSLATION
 SWI_choosing_our_path: "Volba naší cesty" # todo: NEW TRANSLATION
 SWI_choosing_our_path_desc: "Nyní stojíme před rozhodnutím, co dělat s naší zahraniční politikou. Někteří dávají přednost neutralitě, ale existuje hnutí za otevření se NATO a EU." # todo: NEW TRANSLATION
 SWI_opening_up: "Otevření se" # todo: NEW TRANSLATION
 SWI_opening_up_desc: "Rozhodli jsme se odchýlit od naší politiky neutrality." # todo: NEW TRANSLATION
 SWI_neutral_foreign_policy: "Neutrální zahraniční politika" # todo: NEW TRANSLATION
 SWI_neutral_foreign_policy_desc: "Rozhodli jsme se přijmout neutralitu. Proč měnit něco, co funguje?" # todo: NEW TRANSLATION
 SWI_digitalisation: "Digitální Švýcarsko" # todo: NEW TRANSLATION
 SWI_digitalisation_desc: "Strategie Digitální Švýcarsko Spolkové rady zavazuje Konfederaci k celostátnímu pokrytí optickými sítěmi a bezpapírové správě. Modernizace našich sítí udrží švýcarské firmy konkurenceschopné a umožní občanům vyřizovat záležitosti se státem online." # todo: NEW TRANSLATION
 SWI_sustainability: "Energetická strategie 2050" # todo: NEW TRANSLATION
 SWI_sustainability_desc: "Energetická strategie 2050 schválená referendem postupně ukončuje jadernou energetiku ve prospěch vodní a solární energie a velkokapacitních úložišť. Bateriové parky vyrovnají alpskou produkci obnovitelné energie a zabrání tomu, aby hospodářský růst předběhl naše životní prostředí." # todo: NEW TRANSLATION
 SWI_microchip_research: "Výzkum polovodičů" # todo: NEW TRANSLATION
 SWI_microchip_research_desc: "Švýcarská přesnost již podporuje polohovací moduly u-blox, mikroelektronické laboratoře CSEM a konstrukční práci ST v Ženevě. Zaměření EPFL a ETH Zürich na návrh polovodičů nám umožní získat podíl v odvětví, bez něhož svět nemůže fungovat." # todo: NEW TRANSLATION
 SWI_microchip_plant: "Domácí slévárna" # todo: NEW TRANSLATION
 SWI_microchip_plant_desc: "Po ověření návrhů nastal čas položit základy. Domácí slévárna promění švýcarské plány v švýcarský křemík a ochrání náš průmysl před zahraničními výpadky dodávek." # todo: NEW TRANSLATION
 SWI_defending_swiss_independence: "Obrana švýcarské nezávislosti" # todo: NEW TRANSLATION
 SWI_defending_swiss_independence_desc: "Chceme-li zachovat neutralitu, musíme zachovat nezávislost. A abychom toho dosáhli, musíme nejprve čelit zahraničním vlivům, které kolem nás přetrvávají a snaží se nás připoutat k jiným stranám." # todo: NEW TRANSLATION
 SWI_effort_to_better_relations: "Úsilí o lepší vztahy" # todo: NEW TRANSLATION
 SWI_effort_to_better_relations_desc: "Příliš dlouho jsme hráli kartu neutrality. Nyní musíme zlepšit vztahy se sousedy, které jsme příliš dlouho zanedbávali." # todo: NEW TRANSLATION
 SWI_swiss_mercenaries: "Švýcarští žoldnéři" # todo: NEW TRANSLATION
 SWI_swiss_mercenaries_desc: "Musíme vytvořit vlastní žoldnéřské síly. Pokud někdo umí bojovat v horách, jsou to naši lidé. To musíme využít k zisku." # todo: NEW TRANSLATION
 SWI_swiss_peacekeeping: "Švýcarské mírové síly" # todo: NEW TRANSLATION
 SWI_swiss_peacekeeping_desc: "OSN potřebuje v tomto nestabilním světě mírové jednotky. Švýcarsko musí odpovědět." # todo: NEW TRANSLATION
 SWI_un_member_tt: "Švýcarsko musí být §Yčlenem Organizace spojených národů§! (připojte se prostřednictvím rozhodnutí §GPřipojit se k Organizaci spojených národů§!)" # todo: NEW TRANSLATION
 SWI_enforcing_the_uns_will: "Prosazování vůle OSN" # todo: NEW TRANSLATION
 SWI_enforcing_the_uns_will_desc: "Švýcarské kontingenty přecházejí od pozorování k vynucování a podporují mandáty Rady bezpečnosti jednotkami, které se zodpovídají Bernu." # todo: NEW TRANSLATION
 SWI_befriend_the_eu: "Spřátelení s EU" # todo: NEW TRANSLATION
 SWI_befriend_the_eu_desc: "Nyní si musíme vybrat: chceme pokračovat v naprosté neutralitě, nebo se chceme spřátelit s EU?" # todo: NEW TRANSLATION
 SWI_nato: "NATO?" # todo: NEW TRANSLATION
 SWI_nato_desc: "Členství by ukončilo staletí formální neutrality. Spolková rada musí rozhodnout, zda bezpečnostní záruka stojí za tuto cenu." # todo: NEW TRANSLATION
 SWI_expand_the_mercenaries: "Rozšíření žoldnéřů" # todo: NEW TRANSLATION
 SWI_expand_the_mercenaries_desc: "Zdá se, že nám naši žoldnéři získávají ve světě určitou pověst. Pokračujme v tom a rozšiřme jejich řady!" # todo: NEW TRANSLATION
 SWI_foreign_investments: "Zahraniční investice" # todo: NEW TRANSLATION
 SWI_foreign_investments_desc: "Musíme využít našeho nově nalezeného souladu s ostatními západními národy. Můžeme žádat o investice a některé na oplátku nabídnout." # todo: NEW TRANSLATION
 SWI_local_arms_production: "Místní výroba zbraní" # todo: NEW TRANSLATION
 SWI_local_arms_production_desc: "Musíme pokračovat v naší cestě neutrality a zbrojní obchody mohou být považovány za určitý druh spojenectví. Proto musíme vyrábět vlastní zbraně." # todo: NEW TRANSLATION
 SWI_internal_investments: "Vnitřní investice" # todo: NEW TRANSLATION
 SWI_internal_investments_desc: "Musíme se zlepšit tím, že budeme utrácet vlastní peníze sami za sebe a investovat doma." # todo: NEW TRANSLATION
 SWI_integration_to_nato: "Integrace do NATO" # todo: NEW TRANSLATION
 SWI_integration_to_nato_desc: "Nyní, když jsme se připojili k NATO, musíme začít integrovat naše starší i novější zbraňové systémy do standardů NATO." # todo: NEW TRANSLATION
 SWI_integration_to_nato_tt: "Každý další §Yčlen NATO§! získá §G+25§! názor na Švýcarsko" # todo: NEW TRANSLATION
 SWI_alignment_to_NATO: "Sblížení s NATO" # todo: NEW TRANSLATION
 SWI_alone_is_safer: "Samostatnost je bezpečnější" # todo: NEW TRANSLATION
 SWI_alone_is_safer_desc: "Přestože jsme se otevřeli Západu, připojit se k NATO by byl velký skok. V této věci si musíme zachovat nezávislost." # todo: NEW TRANSLATION
 SWI_expanded_trade: "Rozšířený obchod" # todo: NEW TRANSLATION
 SWI_expanded_trade_desc: "Musíme rozšířit obchod, abychom získali přízeň EU a možná našli odvahu se k EU později připojit." # todo: NEW TRANSLATION
 SWI_partner_like_everyone: "Partnerství se všemi" # todo: NEW TRANSLATION
 SWI_partner_like_everyone_desc: "Nevidíme žádný přínos v užším obchodním sbližování s EU. Proto musí naše vztahy zůstat stejně vyvážené jako s kteroukoli jinou zemí." # todo: NEW TRANSLATION
 SWI_bank_of_the_west: "Banka Západu" # todo: NEW TRANSLATION
 SWI_bank_of_the_west_desc: "Máme obrovský bankovní průmysl, který můžeme využít ve svůj prospěch. Většinu jeho služeb však musíme nabídnout Západu." # todo: NEW TRANSLATION
 SWI_the_bank_of_the_world: "Banka světa" # todo: NEW TRANSLATION
 SWI_the_bank_of_the_world_desc: "Švýcarské bankovní tajemství učinilo z Zürichu a Ženevy světové trezory. Formalizujme tuto úlohu a umožněme zahraničnímu kapitálu usadit se zde namísto v Londýně či Frankfurtu." # todo: NEW TRANSLATION
 SWI_strengthening_swiss_cooperation: "Posílení švýcarské spolupráce" # todo: NEW TRANSLATION
 SWI_strengthening_swiss_cooperation_desc: "Společná cvičení, sdílená doktrína a standardizované vybavení připoutají švýcarskou milici k jejím novým aliančním partnerům." # todo: NEW TRANSLATION
 SWI_bastion_of_democracy: "Bašta demokracie" # todo: NEW TRANSLATION
 SWI_bastion_of_democracy_desc: "Neutralita nikdy neznamenala lhostejnost. Švýcarsko je praktickým příkladem samosprávy a otevřeně to říká." # todo: NEW TRANSLATION
 SWI_eu_investments: "Evropské investice" # todo: NEW TRANSLATION
 SWI_eu_investments_desc: "Švýcarský kapitál proudí na jednotný trh. Naše banky financují evropský růst a evropský růst financuje naše banky." # todo: NEW TRANSLATION
 SWI_on_our_own_path: "Vlastní cesta" # todo: NEW TRANSLATION
 SWI_on_our_own_path_desc: "EU je jedním z mnoha zákazníků. Švýcarské finance slouží tomu, kdo platí, a zodpovídají se pouze Bernu." # todo: NEW TRANSLATION
 SWI_staple_of_democracy: "Pilíř demokracie" # todo: NEW TRANSLATION
 SWI_staple_of_democracy_desc: "Západní metropole u nás ukládají peníze, protože naše instituce jsou předvídatelné. Tato předvídatelnost je sama o sobě exportním artiklem." # todo: NEW TRANSLATION
 SWI_eu_candidacy: "Kandidatura do Evropské unie" # todo: NEW TRANSLATION
 SWI_eu_candidacy_desc: "Bern podává Bruselu formální žádost. Přistoupení by ukončilo spleť bilaterálních dohod a připoutalo Švýcarsko k Unii, kolem níž krouží už desetiletí." # todo: NEW TRANSLATION
 SWI_eu_candidacy_tt: "Švýcarsko se stává §Ykandidátem na členství v EU§!" # todo: NEW TRANSLATION
 SWI_friend_for_all: "Přítel všech" # todo: NEW TRANSLATION
 SWI_friend_for_all_desc: "Žádný blok, žádné spojenectví, žádní stálí přátelé. Švýcarsko nabízí své dobré služby každému národu a všichni mu důvěřují." # todo: NEW TRANSLATION
 SWI_trust_in_the_eu: "Důvěra v EU" # todo: NEW TRANSLATION
 SWI_trust_in_the_eu_desc: "Kandidatura není členství. Prohloubení spolupráce s členskými státy prokáže švýcarské odhodlání před hlasováním o přistoupení." # todo: NEW TRANSLATION
 SWI_trust_in_the_eu_tt: "Každý §Yčlenský stát EU§! získá §G+30§! názor na Švýcarsko" # todo: NEW TRANSLATION
 SWI_swiss_independence: "Švýcarská nezávislost" # todo: NEW TRANSLATION
 SWI_swiss_independence_desc: "Zahraniční lobbisté si v Bernu zvykli na pohodlí. Jejich vliv je omezen a domácí instituce znovu přebírají kontrolu." # todo: NEW TRANSLATION
 SWI_mutual_defence_training: "Vzájemný obranný výcvik" # todo: NEW TRANSLATION
 SWI_mutual_defence_training_desc: "Školy alpského válčení se otevírají evropským partnerům. Jejich vojáci poznají naše hory a naše milice se naučí bojovat po jejich boku." # todo: NEW TRANSLATION
 SWI_invest_in_eu: "Investice do EU" # todo: NEW TRANSLATION
 SWI_invest_in_eu_desc: "Švýcarské penzijní fondy a banky získávají přímé podíly v evropském průmyslu a proměňují finanční váhu v politické postavení." # todo: NEW TRANSLATION
 SWI_national_investments: "Národní investice" # todo: NEW TRANSLATION
 SWI_national_investments_desc: "Kapitál, který by odešel do zahraničí, obracíme dovnitř – do švýcarské infrastruktury, průmyslu a výzkumu." # todo: NEW TRANSLATION
 SWI_defence_training_in_the_alps: "Obranný výcvik v Alpách" # todo: NEW TRANSLATION
 SWI_defence_training_in_the_alps_desc: "Každý rekrut pozná terén, který bude bránit. Opakovací kurzy cvičí milici v údolích, která má držet." # todo: NEW TRANSLATION
 SWI_european_defence: "Evropská obrana" # todo: NEW TRANSLATION
 SWI_european_defence_desc: "Vzniká společný evropský obranný rámec, v jehož středu, nikoli na okraji, stojí švýcarské inženýrství a švýcarská neutralita." # todo: NEW TRANSLATION
 SWI_swiss_banking: "Švýcarské bankovnictví" # todo: NEW TRANSLATION
 SWI_swiss_banking_desc: "Naše banky přerostly zemi, jejíž jméno nesou. Konsolidujme sektor a dovolme mu pracovat v měřítku, které si vydobyl." # todo: NEW TRANSLATION
 SWI_bank_established_tt: "Švýcarsko musí založit §Yvýznamné finanční centrum§! prostřednictvím §GBanky Západu§!, §GBanky světa§!, §GEvropských investic§! nebo §GVlastní cesty§!" # todo: NEW TRANSLATION
 SWI_swiss_banking_two: "Světový trezor" # todo: NEW TRANSLATION
 SWI_swiss_banking_two_desc: "Vklady přicházejí ze všech kontinentů. Švýcarsko přestává soupeřit s velkými finančními centry a stává se místem, kde ukládají své rezervy." # todo: NEW TRANSLATION
 SWI_world_bank_established_tt: "Švýcarsko musí založit §Ysvětové finanční centrum§! prostřednictvím §GBanky světa§!, §GEvropských investic§! nebo §GVlastní cesty§!" # todo: NEW TRANSLATION
 SWI_last_man_standing: "Poslední muž" # todo: NEW TRANSLATION
 SWI_last_man_standing_desc: "Doktrína počítá s nejhorším: každá silnice přerušena, každý spojenec pryč. Milice je vycvičena bojovat dál za každých okolností." # todo: NEW TRANSLATION
 swiss_political_system: "Politický systém Švýcarska" # todo: NEW TRANSLATION
 swiss_political_system_desc: "Švýcarsko má velmi jedinečný politický systém a je jedinou zemí na světě, která si může oprávněně říkat 'polopřímá demokracie'. Obyvatelé mohou měnit ústavu referendem, vetovat zákony referendem, mohou prosadit zákony referendem. \n\nTo má dopad na politiky. Protože lidé tvoří politiky jakkoli, švýcarský koaliční systém musí zahrnovat co nejvíce sil. Čtyři velké strany Švýcarska, SVP, FDP, CVP a SP, jsou neustále ve vládě společně – což dělá národní volby ve Švýcarsku do značné míry zbytečnými, neboť lidé vládnou ne prostřednictvím svých zástupců, ale prostřednictvím referend." # todo: NEW TRANSLATION
 swiss_political_system4: "Politický systém Švýcarska" # todo: NEW TRANSLATION
 swiss_political_system4_desc: "Moc se vrací ke kantonům. Bern koordinuje, nikoli velí, a místní vláda rozhoduje o tom, o čem může rozhodovat. Federální rozhodování se zpomalí, ale výstavba a správa odpovídají lidem, kteří ponesou důsledky." # todo: NEW TRANSLATION
 SWI_swiss_neutrality: "Švýcarská neutralita" # todo: NEW TRANSLATION
 SWI_swiss_neutrality_desc: "§YZvláštní pravidla:§!\n\n§YMy§! §RNEMŮŽEME§! §Yvyhlásit válku jiným zemím!§!\n--------------\nŠvýcaři jsou po celém světě známí jako neutrální. Od svého založení jako republika se země nezapojila do žádného útočného konfliktu a zůstala neutrální během obou světových válek.\n--------------\nTento národní duch může být §ROdebrán§! dokončením zaměření §HRadikální změny§! nebo §HOtevření se§!." # todo: CHANGED
 SWI_Expanding_nuclear_research: "Rozšiřování jaderného výzkumu" # todo: NEW TRANSLATION
 SWI_Expanding_nuclear_research_desc: "Švýcarské reaktory překračují rámec výroby energie. Výzkumné programy federálních ústavů se zaměřují na palivové cykly a materiálové vědy." # todo: NEW TRANSLATION
 SWI_new_age: "Nová éra" # todo: NEW TRANSLATION
 SWI_new_age_desc: "Stará konfederace naplnila svůj osud. Rozpuštěním federace a vytvořením jednotné republiky vstupuje Švýcarsko do nové éry vlády, centralizuje moc a nově definuje budoucnost národa." # todo: NEW TRANSLATION
 SWI_Grune_idea: "Grüne Schweiz" # todo: NEW TRANSLATION
 SWI_Grune_idea_desc: "Za čistší, spravedlivější a svobodnější Švýcarsko – kde lidé a planeta stojí před ziskem!" # todo: NEW TRANSLATION
 SWI_idea_fdp: "Svobodná demokratická strana (FDP)" # todo: NEW TRANSLATION
 SWI_idea_fdp_desc: "FDP je liberální strana prosazující volné trhy, individuální podnikání, hospodářskou svobodu a minimální zásahy státu." # todo: NEW TRANSLATION
 SWI_idea_sp: "Sociálnědemokratická strana (SP)" # todo: NEW TRANSLATION
 SWI_idea_sp_desc: "Sociální demokraté směřují politický systém k většímu sociálnímu zabezpečení a mezinárodní spolupráci." # todo: NEW TRANSLATION
 SWI_idea_fdu: "Federální demokratická unie (FDU)" # todo: NEW TRANSLATION
 SWI_idea_fdu_desc: "Federální demokratická unie prosazuje konzervativní evangelické křesťanské hodnoty a místní autonomii." # todo: NEW TRANSLATION
 SWI_idea_svp: "Švýcarská lidová strana (SVP)" # todo: NEW TRANSLATION
 SWI_idea_svp_desc: "Švýcarská lidová strana prosazuje přísnou kontrolu přistěhovalectví, fiskální konzervatismus a národní suverenitu." # todo: NEW TRANSLATION
 SWI_fascism_idea: "Národní fronta" # todo: NEW TRANSLATION
 SWI_fascism_idea_desc: "Národní fronta byla krajně pravicová strana ve Švýcarsku, která vzkvétala během 30. let. Na vrcholu měla podle Historického slovníku Švýcarska až 9 000 členů a podle Simon Wiesenthal Center mohla mít přibližně 25 000 členů. Stranu financovalo Říšské ministerstvo propagandy. V roce 1940 zanikla a v roce 1943 ji švýcarská Spolková rada zakázala." # todo: NEW TRANSLATION
 SWI_communism_idea: "Komunismus" # todo: NEW TRANSLATION
 SWI_communism_idea_desc: "Švýcarský komunismus inspirovaný socialistickými principy usiluje o převedení výrobních prostředků pod kontrolu lidu. Přestavbou hospodářství chceme snížit nerovnost a zajistit, aby se všichni občané podíleli na bohatství národa." # todo: NEW TRANSLATION
 SWI_idea_environmental_reforms: "Reformy životního prostředí" # todo: NEW TRANSLATION
 SWI_idea_environmental_reforms_desc: "Komplexní ekologické zákony mají snížit emise, chránit přírodní zdroje a přejít s hospodářstvím k udržitelnosti." # todo: NEW TRANSLATION
 SWI_idea_eco_tourism: "Ekoturistika" # todo: NEW TRANSLATION
 SWI_idea_eco_tourism_desc: "Podpora ekologického cestování oživí venkovské oblasti a zároveň zachová nedotčenou švýcarskou krajinu." # todo: NEW TRANSLATION
 SWI_idea_national_parks: "Národní parky" # todo: NEW TRANSLATION
 SWI_idea_national_parks_desc: "Rozšiřování chráněných oblastí ochrání divokou přírodu a posílí globální obraz Švýcarska jako ekologického lídra." # todo: NEW TRANSLATION
 SWI_idea_completely_green: "Zcela zelené!" # todo: NEW TRANSLATION
 SWI_idea_completely_green_desc: "Neúnavnými reformami a inovacemi Švýcarsko dosáhne úplné ekologické udržitelnosti a stane se národem poháněným výhradně čistou energií." # todo: NEW TRANSLATION
 SWI_protect_alps: "Ochránce Alp" # todo: NEW TRANSLATION
 SWI_protect_alps_desc: "Alpy nejsou kulisou. Federální ochrana vysokých údolí zachová terén, který po šest století držel vetřelce mimo naše hranice." # todo: NEW TRANSLATION
 SWI_environmental_reforms: "Reformy životního prostředí" # todo: NEW TRANSLATION
 SWI_environmental_reforms_desc: "Komplexní ekologické zákony mají snížit emise, chránit přírodní zdroje a přejít s hospodářstvím k udržitelnosti." # todo: NEW TRANSLATION
 SWI_limit_industry: "Omezený průmyslový rozvoj" # todo: NEW TRANSLATION
 SWI_limit_industry_desc: "Průmyslový růst je omezen kvůli ochraně švýcarského životního prostředí; rychlý růst je vyměněn za dlouhodobou ekologickou stabilitu." # todo: NEW TRANSLATION
 SWI_eco_tourism: "Ekoturistika" # todo: NEW TRANSLATION
 SWI_eco_tourism_desc: "Podpora ekologického cestování oživí venkovské oblasti a zároveň zachová nedotčenou švýcarskou krajinu." # todo: NEW TRANSLATION
 SWI_national_parks: "Národní parky" # todo: NEW TRANSLATION
 SWI_national_parks_desc: "Rozšiřování chráněných oblastí ochrání divokou přírodu a posílí globální obraz Švýcarska jako ekologického lídra." # todo: NEW TRANSLATION
 SWI_completely_green: "Zcela zelené!" # todo: NEW TRANSLATION
 SWI_completely_green_desc: "Neúnavnými reformami a inovacemi Švýcarsko dosáhne úplné ekologické udržitelnosti a stane se národem poháněným výhradně čistou energií." # todo: NEW TRANSLATION
 SWI_idea_christian_values: "Křesťanské hodnoty" # todo: NEW TRANSLATION
 SWI_idea_christian_values_desc: "Tradiční křesťanské principy řídí sociální politiku a posilují morální základy švýcarské společnosti." # todo: NEW TRANSLATION
 SWI_christian_values: "Křesťanské hodnoty" # todo: NEW TRANSLATION
 SWI_christian_values_desc: "Tradiční křesťanské principy řídí sociální politiku a posilují morální základy švýcarské společnosti." # todo: NEW TRANSLATION
 SWI_banned_abortion: "Zákaz potratů" # todo: NEW TRANSLATION
 SWI_banned_abortion_desc: "Přísné zákony zakazují potraty a odrážejí obnovený národní závazek ke konzervativní společenské etice." # todo: NEW TRANSLATION
 SWI_workers_rights_idea: "Práva pracujících" # todo: NEW TRANSLATION
 SWI_workers_rights_idea_desc: "Přijmout komplexní legislativu zaručující spravedlivé mzdy, bezpečné pracovní podmínky a právo organizovat se všem švýcarským pracovníkům." # todo: NEW TRANSLATION
 SWI_higher_wages_idea: "Vyšší mzdy" # todo: NEW TRANSLATION
 SWI_higher_wages_idea_desc: "Povinné zvýšení minimální mzdy a federální dohled nad mzdovou strukturou zajistí švýcarským pracovníkům spravedlivý a udržitelný příjem, což posílí domácí spotřebu." # todo: NEW TRANSLATION
 SWI_cheaper_house: "Levné bydlení" # todo: NEW TRANSLATION
 SWI_cheaper_house_desc: "Federální iniciativa na zastropování nájmů a dotování výstavby výrazně sníží náklady na soukromé bydlení a zpřístupní vlastnictví širší části obyvatelstva." # todo: NEW TRANSLATION
 SWI_public_housing: "Veřejné bydlení" # todo: NEW TRANSLATION
 SWI_public_housing_desc: "Masivní státní investice do kvalitních projektů veřejného bydlení zajistí moderní a dostupné domovy a vyřeší hustotu měst i bytovou bezpečnost dělnické třídy." # todo: NEW TRANSLATION
 SWI_challenged_elite: "Výzva bankovní elitě" # todo: NEW TRANSLATION
 SWI_challenged_elite_desc: "Tajnůstkářské a mocné bankovní elitě je vyslána přímá výzva. Zavádíme nové regulace, zdaňujeme převody soukromého kapitálu a vyšetřujeme daňové úniky, abychom doplnili federální pokladnu." # todo: NEW TRANSLATION
 SWI_nationalize_industries: "Znárodněná klíčová odvětví" # todo: NEW TRANSLATION
 SWI_nationalize_industries_desc: "Spolková rada zahajuje převzetí klíčových průmyslových odvětví a svěřuje zásadní zdroje a výrobu pod státní kontrolu, aby zajistila spravedlivé rozdělování a plánovaný rozvoj." # todo: NEW TRANSLATION
 SWI_socialist_countries_ties: "Vztahy se socialistickými zeměmi" # todo: NEW TRANSLATION
 SWI_socialist_countries_ties_desc: "Švýcarsko aktivně usiluje o užší diplomatické, kulturní a politické vztahy s národy hlásícími se k socialistické věci a připravuje odklon své dlouhodobé neutrality ke globálnímu hnutí." # todo: NEW TRANSLATION
 SWI_socialist_agreements: "Obchodní dohody" # todo: NEW TRANSLATION
 SWI_socialist_agreements_desc: "Se socialistickými státy jsou vyjednávány nové dlouhodobé obchodní dohody, které zajistí přístup ke klíčovým surovinám a rozšíří trh pro švýcarské přesné výrobky." # todo: NEW TRANSLATION
 SWI_progressive_tax: "Progresivní daňové reformy" # todo: NEW TRANSLATION
 SWI_progressive_tax_desc: "Zavést spravedlivý progresivní daňový systém pro financování veřejných služeb a zajištění hospodářské rovnováhy." # todo: NEW TRANSLATION
 SWI_idea_tax_code: "Zjednodušený daňový systém" # todo: NEW TRANSLATION
 SWI_idea_tax_code_desc: "Zjednodušený daňový systém omezuje daňové úniky, přitahuje investice a podporuje vyvážené hospodářství." # todo: NEW TRANSLATION
 SWI_tax_code: "Zjednodušený daňový systém" # todo: NEW TRANSLATION
 SWI_tax_code_desc: "Zjednodušený daňový systém omezuje daňové úniky, přitahuje investice a podporuje vyvážené hospodářství." # todo: NEW TRANSLATION
 SWI_idea_financial_deregulation: "Finanční deregulace" # todo: NEW TRANSLATION
 SWI_idea_financial_deregulation_desc: "Omezení bankovních a finančních regulací podporuje investice, růst a hospodářskou dynamiku." # todo: NEW TRANSLATION
 SWI_financial_deregulation: "Finanční deregulace" # todo: NEW TRANSLATION
 SWI_financial_deregulation_desc: "Omezit bankovní a finanční regulace s cílem podpořit investice, růst a hospodářskou dynamiku." # todo: NEW TRANSLATION
 SWI_idea_defend_secrecy: "Bankovní tajemství" # todo: NEW TRANSLATION
 SWI_idea_defend_secrecy_desc: "Veškerý mezinárodní tlak na zrušení soukromého bankovního tajemství je odmítnut. Důvěrnost klientů zůstává zákonem země." # todo: NEW TRANSLATION
 SWI_idea_fortress_switzerland: "Pevnost Švýcarsko" # todo: NEW TRANSLATION
 SWI_idea_fortress_switzerland_desc: "Rozsáhlá opevnění a moderní obranné sítě zajistí, že Švýcarsko zůstane v každém konfliktu neproniknutelné." # todo: NEW TRANSLATION
 SWI_fortress_switzerland: "Pevnost Švýcarsko" # todo: NEW TRANSLATION
 SWI_fortress_switzerland_desc: "Rozsáhlá opevnění a moderní obranné sítě zajistí, že Švýcarsko zůstane v každém konfliktu neproniknutelné." # todo: NEW TRANSLATION
 SWI_milita: "Ozbrojená milice" # todo: NEW TRANSLATION
 SWI_milita_desc: "Občanská armáda je nejen ozbrojena, ale i politizována. Služba se stává školou státu stejně jako školou pušky." # todo: NEW TRANSLATION
 SWI_local_production1: "Místní výroba" # todo: NEW TRANSLATION
 SWI_local_production1_desc: "Zbraně nakoupené v zahraničí lze embargovat. Zbraně vyrobené v Thunu nikoli. Domácí linky převezmou výrobu nezbytností." # todo: NEW TRANSLATION
 SWI_foreign: "Zahraniční společnosti" # todo: NEW TRANSLATION
 SWI_foreign_desc: "Zahraničním korporacím se doporučuje investovat ve Švýcarsku, což podpoří inovace a tvorbu pracovních míst při zachování národní kontroly." # todo: NEW TRANSLATION
 SWI_agriculture: "Zemědělské financování" # todo: NEW TRANSLATION
 SWI_agriculture_desc: "Švýcarsko investuje do moderního a udržitelného zemědělství – podporuje místní farmáře, chrání venkovské komunity a zajišťuje potravinovou bezpečnost budoucím generacím." # todo: NEW TRANSLATION
 SWI_precision: "Švýcarská přesnost" # todo: NEW TRANSLATION
 SWI_precision_desc: "Podporovat vynikající švýcarskou výrobu, rozvíjet kvalitní průmysl a udržovat pověst národa proslulého přesností." # todo: NEW TRANSLATION
 SWI_fund_startups: "Technologické startupy" # todo: NEW TRANSLATION
 SWI_fund_startups_desc: "Poskytnout technologickým startupům financování a podporu k podnícení inovací a zajištění hospodářské budoucnosti Švýcarska." # todo: NEW TRANSLATION
 SWI_agricultural_collectivization_idea: "Kolektivizace zemědělství" # todo: NEW TRANSLATION
 SWI_agricultural_collectivization_idea_desc: "Abychom uživili národ a modernizovali venkov, musíme zorganizovat farmy do kolektivních jednotek. Kolektivizace zemědělství zvýší efektivitu, zlepší přidělování zdrojů a posílí státní kontrolu nad výrobou potravin." # todo: NEW TRANSLATION
 SWI_ndb: "Švýcarská NDB" # todo: NEW TRANSLATION
 SWI_ndb_desc: "Švýcarská NDB posiluje zpravodajské operace, chrání národní bezpečnost a zachovává neutralitu v nestabilním světě." # todo: NEW TRANSLATION
 SWI_traditionalist: "Tradicionalismus" # todo: NEW TRANSLATION
 SWI_traditionalist_desc: "Tradicionalistické myšlení utváří politiku a klade víru, rodinu a národní dědictví nad moderní společenské trendy." # todo: NEW TRANSLATION
 SWI_army_fund: "Financování armády" # todo: NEW TRANSLATION
 SWI_army_fund_desc: "Vyšší výdaje na obranu posilují připravenost švýcarské armády a modernizují její infrastrukturu." # todo: NEW TRANSLATION
 SWI_ngo_funding: "Financování nevládních organizací" # todo: NEW TRANSLATION
 SWI_ngo_funding_desc: "Vládní granty podporují nevládní organizace pracující v oblasti humanitární pomoci, ochrany životního prostředí a občanských práv." # todo: NEW TRANSLATION
 SWI_efficiency: "Švýcarská efektivita" # todo: NEW TRANSLATION
 SWI_efficiency_desc: "Švýcarská efektivita se stává znakem správy – zjednodušená byrokracie, méně plýtvání a přesné řízení." # todo: NEW TRANSLATION
 SWI_police_reforms: "Policejní reformy" # todo: NEW TRANSLATION
 SWI_police_reforms_desc: "Modernizovat vymáhání práva, zlepšit efektivitu a zvýšit veřejnou bezpečnost v celé zemi." # todo: NEW TRANSLATION
 SWI_direct_democracy: "Reformy přímé demokracie" # todo: NEW TRANSLATION
 SWI_direct_democracy_desc: "Rozšířit účast občanů prostřednictvím referend a iniciativ a posílit demokratický proces." # todo: NEW TRANSLATION
 SWI_pda: "Partei der Arbeit" # todo: NEW TRANSLATION
 SWI_pda_desc: "Komunistická strana Švýcarska, která získává značný vliv, prosazuje radikální změny hospodářské struktury národa a usiluje o přeměnu švýcarské neutrality v motor socialistické solidarity." # todo: NEW TRANSLATION
 SWI_mind_federation: "Duch federace" # todo: NEW TRANSLATION
 SWI_mind_federation_desc: "Je vytvořena jednotná vize nové Federace, která zaměřuje politický systém na efektivitu, spolupráci a rychlou integraci nových území a obyvatel." # todo: NEW TRANSLATION
 SWI_growing_federation: "Posílení federace" # todo: NEW TRANSLATION
 SWI_growing_federation_desc: "Průmyslové a správní reformy Federace jsou sloučeny do jediného koordinovaného programu. Rozvoj infrastruktury, výroba v továrnách a výzkum nyní postupují pod jednou federální vlajkou a standardizují i politicky sjednocují každý nově získaný kanton." # todo: NEW TRANSLATION
 SWI_modernize_direct: "Modernizovaná přímá demokracie" # todo: NEW TRANSLATION
 SWI_modernize_direct_desc: "Přímá demokracie je přepracována a modernizována, zahrnuje nové technologie a zjednodušené procesy, aby zajistila rychlé zapojení občanů a pohotové národní rozhodování." # todo: NEW TRANSLATION
 SWI_council_states: "Rada kantonů" # todo: NEW TRANSLATION
 SWI_council_states_desc: "Rada kantonů je reorganizována tak, aby poskytla větší a spravedlivější zastoupení všem novým i zavedeným kantonům a vyvážila zákonodárnou moc mezi počtem obyvatel a regionální autonomií." # todo: NEW TRANSLATION
 SWI_fiscal_equalization: "Fond fiskálního vyrovnání" # todo: NEW TRANSLATION
 SWI_fiscal_equalization_desc: "Je zřízen nový federální fond pro přerozdělení bohatství od nejbohatších kantonů k nejchudším a zajištění rovnoměrného rozvoje a vysoké životní úrovně v celé Federaci." # todo: NEW TRANSLATION
 SWI_fiscal_equalization_council: "Fond fiskálního vyrovnání" # todo: NEW TRANSLATION
 SWI_fiscal_equalization_council_desc: "Pod vedením Rady kantonů nový federální fond přerozděluje bohatství od nejbohatších kantonů k nejchudším a zajišťuje rovnoměrný rozvoj a vysokou životní úroveň v celé Federaci při zachování regionální autonomie." # todo: NEW TRANSLATION
 SWI_develop_federation: "Rozvoj federace" # todo: NEW TRANSLATION
 SWI_develop_federation_desc: "Zaměřit se na dlouhodobé infrastrukturní a rozvojové projekty v celé Alpské federaci, zejména na nově získaných územích, s cílem maximalizovat hospodářský potenciál a politickou stabilitu." # todo: NEW TRANSLATION
 SWI_multilingual_workers: "Mnohojazyční pracující" # todo: NEW TRANSLATION
 SWI_multilingual_workers_desc: "Němečtí, francouzští, italští a rétorománští pracovníci se organizují napříč jazykovými hranicemi, které švýcarské dělnictvo dlouho rozdělovaly." # todo: NEW TRANSLATION
 SWI_propaganda_idea: "Státní propaganda" # todo: NEW TRANSLATION
 SWI_propaganda_idea_desc: "Federální tiskový úřad přestává informovat a začíná přesvědčovat. Rozhlas, tisk a školní osnovy nesou stejné poselství." # todo: NEW TRANSLATION
 SWI_true_neutral: "Skutečná neutralita" # todo: NEW TRANSLATION
 SWI_true_neutral_desc: "§YSpecial Rules:§!\n\n§YWe§! §RCANNOT§! §Yjoin a faction!§!\n--------------\nNe ozbrojená neutralita, ne dobročinná neutralita. Švýcarsko nestojí na žádné straně, neposkytuje základny a nepodepisuje žádné záruky.\n--------------\nTento národní duch lze §Rodstranit§! prostřednictvím rozhodnutí §HOpustit skutečnou neutralitu§!." # todo: NEW TRANSLATION
 SWI_censor: "Cenzura" # todo: NEW TRANSLATION
 SWI_censor_desc: "Pro zachování společenského pořádku a ochranu národní stability musí být informace pečlivě sledovány. Zavedení cenzury zajistí, že škodlivé ideologie a destabilizující propaganda nebudou moci podkopat Švýcarsko." # todo: NEW TRANSLATION
 SWI_central_committee_idea: "Ústřední výbor" # todo: NEW TRANSLATION
 SWI_central_committee_idea_desc: "Silný stát vyžaduje rozhodné vedení. Zřízení ústředního výboru soustředí moc, koordinuje politiku v celém národě a zajistí účinné uskutečňování vize strany." # todo: NEW TRANSLATION
 SWI_sig_sauer_ag: "SIG Sauer AG" # todo: NEW TRANSLATION
 SWI_sig_sauer_ag_desc: "Závody v Neuhausenu vyzbrojují milici. Každá švýcarská domácnost se služební puškou drží kus produkce SIG." # todo: NEW TRANSLATION
 SWI_rheinmetall_cooperation: "Spolupráce s Rheinmetallem" # todo: NEW TRANSLATION
 SWI_rheinmetall_cooperation_desc: "Rheinmetall Air Defence v Zürichu, dědic Oerlikonu, propojuje švýcarskou výrobu kanónů a radarů s největším německým zbrojním domem." # todo: NEW TRANSLATION
 SWI_thales_cooperation: "Spolupráce s Thales" # todo: NEW TRANSLATION
 SWI_thales_cooperation_desc: "Thales Suisse dodává radary, optoelektroniku a velitelské systémy, které proměňují milici v síťovanou sílu." # todo: NEW TRANSLATION
 SWI_idea_mass_produced_firearms: "Sériově vyráběné zbraně" # todo: NEW TRANSLATION
 SWI_idea_mass_produced_firearms_desc: "Standardizované výrobní linky a zaměnitelné součástky snížily cenu ručních zbraní a zároveň zlepšily jejich spolehlivost a obranné schopnosti." # todo: NEW TRANSLATION
 SWI_idea_gunship_development: "Vývoj bitevních vrtulníků" # todo: NEW TRANSLATION
 SWI_idea_gunship_development_desc: "Silně vyzbrojené vrtulníky poskytují blízkou leteckou podporu a průzkum a propojují vzdušnou mobilitu s obrannou doktrínou armády." # todo: NEW TRANSLATION
 switzerland.2.t: "Konec švýcarského politického systému" # todo: NEW TRANSLATION
 switzerland.2.d: "Švýcarský systém přímé demokracie, který se dlouhodobě vyznačoval neobvyklou mírou účasti obyvatel na správě země prostřednictvím častých referend, je postupně rušen.\n\nŠvýcarský vůdce [SWI.GetLeader] oznámil, že tyto „Rozptylování pozornosti od veřejného života“ a „Zbytečná referenda“ se již nebudou konat." # todo: CHANGED
 switzerland.2.o1: "Konečně pryč." # todo: NEW TRANSLATION
 switzerland.2.o2: "Škoda." # todo: NEW TRANSLATION
 switzerland.2.o3: "To je jedno." # todo: NEW TRANSLATION
 switzerland.8.t: "Švýcarský požadavek na Alpy" # todo: NEW TRANSLATION
 switzerland.8.desc: "Švýcarsko požaduje okamžité převedení Savojska, Provence a Nice pod svou kontrolu s odvoláním na historické vazby a společnou alpskou kulturu." # todo: NEW TRANSLATION
 switzerland.8.a: "Postoupit státy" # todo: NEW TRANSLATION
 switzerland.8.b: "Odmítnout" # todo: NEW TRANSLATION
 switzerland.9.t: "Nárok na Alpy přijat" # todo: NEW TRANSLATION
 switzerland.9.desc: "Francie nečekaně souhlasila s naším požadavkem a postoupila celý alpský region. Velké diplomatické vítězství!" # todo: NEW TRANSLATION
 switzerland.9.a: "Nové, silnější Švýcarsko!" # todo: NEW TRANSLATION
 switzerland.10.t: "Nárok na Alpy odmítnut" # todo: NEW TRANSLATION
 switzerland.10.desc: "Na náš požadavek přišlo tvrdé odmítnutí. Francie není ochotna vyjednávat o územní celistvosti." # todo: NEW TRANSLATION
 switzerland.10.a: "Diplomatické úsilí selhalo." # todo: NEW TRANSLATION
 switzerland.11.t: "Požadavek na italské Alpy" # todo: NEW TRANSLATION
 switzerland.11.desc: "Švýcarská vláda vydala formální požadavek na postoupení Aosty, Piemontu, Lombardie a Jižního Tyrolska Švýcarské konfederaci." # todo: NEW TRANSLATION
 switzerland.11.a: "Postoupit provincie" # todo: NEW TRANSLATION
 switzerland.11.b: "Odmítnout požadavek" # todo: NEW TRANSLATION
 switzerland.12.t: "Italské přijetí" # todo: NEW TRANSLATION
 switzerland.12.desc: "Řím k našim územním požadavkům překvapivě přistoupil s odvoláním na touhu po regionálním míru. Alpy jsou sjednoceny!" # todo: NEW TRANSLATION
 switzerland.12.a: "Sjednocená alpská republika!" # todo: NEW TRANSLATION
 switzerland.13.t: "Italské odmítnutí" # todo: NEW TRANSLATION
 switzerland.13.desc: "Itálie naše požadavky důrazně odmítla a považuje je za urážku národní suverenity." # todo: NEW TRANSLATION
 switzerland.13.a: "Naše diplomacie selhala." # todo: NEW TRANSLATION
 switzerland.14.t: "Požadavek na rakouské Tyrolsko" # todo: NEW TRANSLATION
 switzerland.14.desc: "Švýcarsko ve své snaze sjednotit alpské srdce vydalo formální požadavek na postoupení Tyrolska. Přijetí by mohlo zabránit budoucím konfliktům, přestože má region historický význam." # todo: NEW TRANSLATION
 switzerland.14.a: "Postoupit Tyrolsko Švýcarům" # todo: NEW TRANSLATION
 switzerland.14.b: "Odmítnout švýcarský nárok" # todo: NEW TRANSLATION
 switzerland.15.t: "Tyrolsko získáno" # todo: NEW TRANSLATION
 switzerland.15.desc: "Vídeň (nebo současný okupant Rakouska) našemu požadavku vyhověl a připojil životně důležitý region Tyrolska ke Konfederaci. Naše sjednocovací úsilí pokračuje úspěšně." # todo: NEW TRANSLATION
 switzerland.15.a: "Velké diplomatické vítězství." # todo: NEW TRANSLATION
 switzerland.16.t: "Tyrolské odmítnutí" # todo: NEW TRANSLATION
 switzerland.16.desc: "Náš diplomatický požadavek na Tyrolsko byl bez výhrad odmítnut. Současný vlastník státu považuje nárok za nepřijatelnou výzvu svým hranicím." # todo: NEW TRANSLATION
 switzerland.16.a: "Musíme počkat na vhodnější chvíli." # todo: NEW TRANSLATION
 switzerland.17.t: "Volba naší cesty" # todo: NEW TRANSLATION
 switzerland.17.desc: "Nastal čas rozhodnout se, zda se změníme, nebo zůstaneme stejní. Ať už zvolíme změnu či setrvání, obojí přinese výhody." # todo: NEW TRANSLATION
 switzerland.17.a: "Musíme se otevřít světu!" # todo: NEW TRANSLATION
 switzerland.17.b: "Proč měnit něco, co funguje?" # todo: NEW TRANSLATION
 switzerland.18.t: "Otázka NATO" # todo: NEW TRANSLATION
 switzerland.18.desc: "Protokoly o přistoupení leží na stole Spolkové rady. Jejich podpis ukončí ozbrojenou neutralitu, která přežila každé impérium v Evropě." # todo: NEW TRANSLATION
 switzerland.18.a: "Podepsat protokoly." # todo: NEW TRANSLATION
 switzerland.18.b: "Neutralita není k jednání." # todo: NEW TRANSLATION
 switzerland.22.t: "Naše místo v Evropě" # todo: NEW TRANSLATION
 switzerland.22.desc: "Brusel nabízí hlubší přístup na trh za podmínek, které by zavázaly švýcarské regulace k právu EU. Kantony jsou rozděleny." # todo: NEW TRANSLATION
 switzerland.22.a: "Prohloubit vztahy s EU." # todo: NEW TRANSLATION
 switzerland.22.b: "Obchodovat se všemi stejně." # todo: NEW TRANSLATION
 switzerland.23.t: "Švýcarská nabídka" # todo: NEW TRANSLATION
 switzerland.23.desc: "Bern navrhuje, aby se knížectví připojilo k Alpské federaci. Lichtenštejnsko již používá frank a sdílí s námi celní unii. Zbývá už jen koruna." # todo: NEW TRANSLATION
 switzerland.23.a: "Přijmout unii." # todo: NEW TRANSLATION
 switzerland.23.b: "Knížectví zůstane samo." # todo: NEW TRANSLATION
 switzerland.24.t: "Lichtenštejnsko přistupuje" # todo: NEW TRANSLATION
 switzerland.24.desc: "Vaduz souhlasil. Knížectví vstupuje do Federace jako plnoprávný člen a poslední nezávislá enkláva Alp mizí." # todo: NEW TRANSLATION
 switzerland.24.a: "Alpy jsou sjednocené." # todo: NEW TRANSLATION
 switzerland.25.t: "Lichtenštejnsko odmítá" # todo: NEW TRANSLATION
 switzerland.25.desc: "Kníže nabídku odmítl. Vaduz si ponechá svou korunu, parlament i nezávislost, jakkoli jsou malé." # todo: NEW TRANSLATION
 switzerland.25.a: "Budiž." # todo: NEW TRANSLATION
 switzerland.26.t: "Alpské ultimátum" # todo: NEW TRANSLATION
 switzerland.26.desc: "Bern vydal ultimátum: knížectví má vstoupit do Alpské federace, pokud možno dohodou, a pokud to bude nutné, silou. Švýcarské jednotky se shromažďují podél hranice, kterou nikdy nebylo třeba bránit. Zemský sněm nyní musí rozhodnout, zda se Lichtenštejnsko podvolí, nebo vzdoruje svému sousedovi." # todo: NEW TRANSLATION
 switzerland.26.a: "Proti Švýcarsku nemůžeme stát." # todo: NEW TRANSLATION
 switzerland.26.b: "Knížectví neklekne!" # todo: NEW TRANSLATION
 switzerland_news.1.t: "Švýcarsko vstupuje do OSN" # todo: NEW TRANSLATION
 switzerland_news.1.d: "Švýcarská vláda původně po skončení druhé světové války odmítla vstoupit do Organizace spojených národů s poukazem na pokračující oddanost země vlastní neutralitě, přestože Ženeva hostila Úřad Organizace spojených národů, hlavní evropské sídlo této organizace.\n\nNyní, po veřejném referendu o této otázce, švýcarská vláda oznámila, že země upustí od svého postavení pozorovatele a vstoupí do organizace jako plnoprávný člen." # todo: CHANGED
 switzerland_news.1.o1: "Už je na čase, Švýcarsko!" # todo: NEW TRANSLATION
 switzerland_news.1.o3: "Je to opravdu taková velká věc?" # todo: NEW TRANSLATION
 switzerland_news.7.t: "Alpská federace" # todo: NEW TRANSLATION
 switzerland_news.7.d: "Po rozsáhlém diplomatickém manévrování a lidovém hnutí v celém regionu Švýcarsko formálně upevnilo kontrolu nad historickým alpským srdcem. Národ oficiálně změnil svůj název na „Federaci Alp“, zkráceně „Alpská federace“.\n\nTento zásadní posun vytváří mocný sjednocený federální stát rozkládající se napříč středoevropským horským pásmem a zásadně mění rovnováhu sil v regionu. Nová vláda slíbila zachovat kulturní a politickou autonomii každého regionu, který nyní zahrnuje." # todo: NEW TRANSLATION
 switzerland_news.7.a: "Nové pojetí neutrality od roku 1516." # todo: NEW TRANSLATION
 switzerland_news.8.t: "Nová republika: Švýcarsko hlasuje pro centralizaci moci" # todo: NEW TRANSLATION
 switzerland_news.8.d: "Těsnou většinou švýcarský lid schválil ústavní referendum o opuštění federální struktury ve prospěch centralizované republiky. Změna prosazovaná hnutím Nové éry slibuje zjednodušenou správu a soudržnou národní identitu, přichází však za cenu tradiční kantonální autonomie. Nová Švýcarská republika dnes oficiálně nahrazuje Konfederaci a v bývalých kantonech propukají oslavy i protesty. Mezinárodní společenství pozorně sleduje důsledky tohoto radikálního posunu v jednom z nejstabilnějších národů Evropy." # todo: NEW TRANSLATION
 switzerland_news.8.a: "Konfederace je mrtvá!" # todo: NEW TRANSLATION
 switzerland.27.t: "Žádost o nákup Eurofighterů" # todo: NEW TRANSLATION
 switzerland.27.d: "Švýcarsko požádalo o nákup letounů Eurofighter Typhoon z našeho obranného průmyslu." # todo: NEW TRANSLATION
 switzerland.27.a: "Schválit prodej." # todo: NEW TRANSLATION
 switzerland.27.b: "Odmítnout, naše výrobní linky jsou vytížené." # todo: NEW TRANSLATION
 switzerland.28.t: "Žádost o nákup Rafale" # todo: NEW TRANSLATION
 switzerland.28.d: "Švýcarsko požádalo o nákup stíhacích letounů Rafale z našeho obranného průmyslu." # todo: NEW TRANSLATION
 switzerland.28.a: "Schválit prodej." # todo: NEW TRANSLATION
 switzerland.28.b: "Odmítnout, naše výrobní linky jsou vytížené." # todo: NEW TRANSLATION
 switzerland.29.t: "Žádost o nákup C-130J" # todo: NEW TRANSLATION
 switzerland.29.d: "Švýcarsko požádalo o nákup transportních letounů C-130J Super Hercules z našeho obranného průmyslu." # todo: NEW TRANSLATION
 switzerland.29.a: "Schválit prodej." # todo: NEW TRANSLATION
 switzerland.29.b: "Odmítnout, naše výrobní linky jsou vytížené." # todo: NEW TRANSLATION
 switzerland.30.t: "Nákup schválen" # todo: NEW TRANSLATION
 switzerland.30.d: "Naše žádost o nákup byla schválena. Letouny se dodávají." # todo: NEW TRANSLATION
 switzerland.30.a: "Výborně." # todo: NEW TRANSLATION
 switzerland.31.t: "Nákup zamítnut" # todo: NEW TRANSLATION
 switzerland.31.d: "Naše žádost o nákup byla odmítnuta. Žádné letouny nebudou dodány." # todo: NEW TRANSLATION
 switzerland.31.a: "Program utrpěl neúspěch." # todo: NEW TRANSLATION
 SWI_heer_modifier: "Schweizer Heer" # todo: NEW TRANSLATION
 SWI_heer_modifier_desc: "Švýcarská armáda je milice založená na všeobecné branné povinnosti, v níž si občan drží pušku doma a hory jsou považovány za první linii obrany. Nemá významnou stálou polní armádu a místo toho spoléhá na rychlou mobilizaci, připravené demolice a opevněný alpský terén." # todo: NEW TRANSLATION
 SWI_schweizerische_luftwaffe_modifier: "Schweizerische Luftwaffe" # todo: NEW TRANSLATION
 SWI_schweizerische_luftwaffe_modifier_desc: "Švýcarské letectvo existuje k ochraně vzdušného prostoru nad Konfederací a k ničemu jinému. Jeho letouny operují z opevněných alpských základen a kavernových hangárů a jsou určeny k zachytávání a ochraně vzdušného prostoru, nikoli k projekci síly." # todo: NEW TRANSLATION
 SWI_military_industry_modifier: "Švýcarský vojenský průmysl" # todo: NEW TRANSLATION
 SWI_military_industry_modifier_desc: "Švýcarská výroba zbraní je malá, přesná a žárlivě nezávislá. Firmy jako RUAG, MOWAG a SIG Sauer zásobují milici a vyvážejí do zahraničí, čímž udržují obrannou průmyslovou základnu mnohem větší, než by velikost země naznačovala." # todo: NEW TRANSLATION
 SWI_politica_estera_svizzera_modifier: "Švýcarská zahraniční politika" # todo: NEW TRANSLATION
 SWI_politica_estera_svizzera_modifier_desc: "Souhrn bernských rozhodnutí v zahraničí – od ozbrojené neutrality a mírových misí OSN po bankovní vazby a sbližování s Evropou či NATO. Každý krok programu zahraniční politiky utváří postavení Konfederace, její finance a připravenost milice." # todo: NEW TRANSLATION
 SWI_join_un: "Nový člen OSN" # todo: NEW TRANSLATION
 SWI_universal_education_bonus_desc: "Švýcarské investice do moderního vzdělávání podpořily výzkum obnovitelné energie a udržitelných technologií a otevřely cestu k čistší budoucnosti." # todo: NEW TRANSLATION
