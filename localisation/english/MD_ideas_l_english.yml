 major_ruling_party_salafist: "Hlavní vládnoucí strana: Salafistická"
 neighbor_effect_modifiers: "Vliv našich sousedů na nás"
 coalition_western: "Prozápadní koaliční partneři"
 coalition_emerging: "Koaliční partneři nastupujících"
 coalition_non_alligned: "Koaliční partneři nezařazených"
 coalition_salafist: "Salafističtí koaliční partneři"
 coalition_nationalist: "Nacionalističtí koaliční partneři"
 government_popularity_modifier: "Dopad vládní politiky" # todo: CHANGED
 Opium_Economy: "Opiová ekonomika"
 Opium_Economy_desc: "Opium je v Afghánistánu po staletí významnou tržní plodinou. V chaosu posledních desetiletí a s rozvojem globálního obchodu s narkotiky se však jeho pěstování výrazně rozšířilo a velká část venkovské ekonomiky je nyní závislá na máku. Vzhledem k tomu, že je značná část produkce využívána k výrobě nelegálních drog, je pro vládu obtížné z pěstování profitovat."
 Major_Non_NATO_Ally: "Hlavní spojenec mimo NATO"
 Major_Non_NATO_Ally_desc: "Hlavní spojenec mimo NATO (MNNA) je označení udělované vládou Spojených států blízkým spojencům, kteří mají strategické pracovní vztahy s ozbrojenými silami USA, avšak nejsou členy NATO. Tento status sice automaticky nezahrnuje vzájemný obranný pakt, ale poskytuje řadu vojenských a finančních výhod, které by jinak nebyly pro země mimo NATO dostupné."
 ISI_jihadist_islamic_state: "Džihádistický Islámský stát"
 ISI_jihadist_islamic_state_desc: "[ISI.GetNamewithFlag] se semkl a chalífát zůstává silný. Je čas vést džihád proti nevěřícím a ukončit jejich ubohou existenci!"
 ISI_islamic_state_early_offensive_idea: "Počáteční ofenziva Islámského státu"
 ISI_islamic_state_early_offensive_idea_desc: "Islámský stát zahájil ofenzivu v Sýrii a Iráku."
 ISI_islamic_state_failure_idea: "Selhání obrany proti Islámskému státu"
 ISI_islamic_state_failure_idea_desc: "Chalífát zahájil ofenzivu a my nejsme připraveni se mu bránit. Musíme posílit obranu a připravit se na nejhorší."
 ISI_decapitated_leadership: "Sťaté vedení" # todo: NEW TRANSLATION
 ISI_decapitated_leadership_desc: "Letecký útok zabil vysokého velitele chalífátu. Jeho podřízení bojují o uvolněné místo, rozkazy se na frontu dostávají pozdě nebo vůbec a zkušení bojovníci jsou nasazováni k udržení území, které by se vzdal." # todo: NEW TRANSLATION
 isis_sleeper_cell_idea: "Spící buňky ISIS"
 isis_sleeper_cell_idea_desc: "Zatracení teroristé se nějak infiltrovali do naší země a působí potíže. Musíme je zlikvidovat dříve, než způsobí další krev, slzy a utrpení."
 israel_new_intifada: "Nová intifáda"
 hutu_tutsi_tensions: "Napětí mezi Hutuy a Tutsii"
 hutu_tutsi_tensions_desc: "Hutové a Tutsiové jsou dvě odlišné etnické skupiny žijící v pohraničních oblastech mezi Demokratickou republikou Kongo a Tanzanií, zejména ve dvou malých státech Burundi a Rwandě. Burundi je ovládáno Tutsii a v roce 1972 zde došlo ke genocidě Hutů, zatímco Rwanda je ovládána Hutuy a v roce 1994 zde byly hutuskými milicemi povražděny tisíce Tutsiů.\n\nTyto dvě etnické skupiny spolu zjevně nedokážou vycházet, avšak byly donuceny žít ve stejných státech evropskými koloniálními hranicemi."
 generic_nationalist_boost_idea: "Vzestup nacionalismu"
 generic_western_boost_idea: "Prozápadní orientace"
 generic_emerging_boost_idea: "Vzestup Východu"
 generic_salafist_boost_idea: "Vzestup salafismu"
 generic_non_aligned_boost_idea: "Vzestup nezařazenosti"
 additional_recruits: "Dodateční rekruti"
 additional_recruits_desc: "Cílené náborové kampaně a rozšířená branná politika zvýšily množství dostupné živé síly pro naše ozbrojené síly." # todo: NEW TRANSLATION
 agricultural_investments: "Investice do zemědělství"
 agricultural_investments_desc: "Strategické investice do zemědělské infrastruktury a modernizačních programů zlepší naši kapacitu výroby potravin a rozvoj venkovského hospodářství." # todo: NEW TRANSLATION
 commercialized_agricultural_investments: "Komercializované zemědělské investice" # todo: NEW TRANSLATION
 commercialized_agricultural_investments_desc: "Velkoplošné komerční zemědělské provozy a rozvoj agropodnikání zvýší naši zemědělskou produkci a vytvoří příležitosti pro export." # todo: NEW TRANSLATION
 aircraft_investments: "Investice do letectví"
 aircraft_investments_desc: "Na rozšíření našich výrobních kapacit letadel a urychlení výroby byly vyčleněny zvláštní finanční prostředky a průmyslové kapacity." # todo: NEW TRANSLATION
 amphibious_expertise: "Obojživelné zkušenosti"
 amphibious_expertise_desc: "Specializované výcvikové programy a rozvoj taktické doktríny zlepšily schopnost naší armády provádět obojživelné operace." # todo: NEW TRANSLATION
 army_morale_bonus: "Bonus k morálce armády"
 army_morale_bonus_desc: "Lepší podmínky, kvalitnější vedení a obnovený národní smysl posílily bojového ducha našich pozemních sil." # todo: NEW TRANSLATION
 army_organization_bonus: "Bonus k organizaci armády"
 army_organization_bonus_desc: "Reformy velitelských struktur a logistických systémů učinily naši armádu v poli účinnější a lépe organizovanou." # todo: NEW TRANSLATION
 artillery_production_bonus: "Bonus k produkci dělostřelectva"
 artillery_production_bonus_desc: "Cílené přidělení zdrojů a výrobních zařízení urychlilo výrobu dělostřeleckých systémů a podpůrných zbraní." # todo: NEW TRANSLATION
 drone_production_idea: "Domácí výroba dronů" # todo: NEW TRANSLATION
 drone_production_idea_desc: "Investice do technologie bezpilotních letounů a výrobních zařízení vytvořily domácí kapacitu pro výrobu dronů." # todo: NEW TRANSLATION
 equipment_conversion_efforts_idea: "Úsilí o přestavbu vybavení" # todo: NEW TRANSLATION
 equipment_conversion_efforts_idea_desc: "Cílená přestavba průmyslových linek a továren za účelem rychlé konverze vybavení na modernější výstroj podpoří naše současné úsilí o modernizaci armády." # todo: NEW TRANSLATION
 civilian_industry_project: "Projekt civilního průmyslu"
 civilian_industry_project_desc: "" # todo: NEW TRANSLATION
 commander_skill_bonus: "Bonus ke schopnostem velitelů"
 commander_skill_bonus_desc: "" # todo: NEW TRANSLATION
 OAU_member: "Člen Organizace africké jednoty"
 OAU_member_desc: "Organizace africké jednoty (OAJ) byla založena v roce 1963 tehdy nezávislými africkými národy. Cílem organizace bylo podporovat politickou a ekonomickou integraci Afriky a bojovat proti kolonialismu a neokolonialismu. Organizace však zůstala především \"diskusním klubem\", protože mezi státy nebyly vytvořeny žádné společné vojenské, soudní ani politické orgány. V roce 1999 podepsali členové OAJ pod vedením libyjského vůdce Muammara Kaddáfího deklaraci ze Syrty s úmyslem nahradit OAJ nejpozději do roku 2002 Africkou unií a konečně vytvořit organizaci schopnou sjednotit africký kontinent." # todo: CHANGED
 AU_member: "Člen Africké unie"
 AU_member_desc: "Africká unie vznikla ze členů Organizace africké jednoty. Na rozdíl od svého předchůdce vytvořila politické instituce a plán pro vojenskou, hospodářskou, soudní a finanční integraci kontinentu."
 communist_militias: "Komunistické milice"
 defensive_constructions: "Obranné stavby"
 defensive_preparations: "Obranné přípravy"
 encryption_bonus: "Bonus k šifrování"
 fighter_production_bonus: "Bonus k produkci stíhaček"
 fighter_production_bonus_desc: "Pečlivým přerozdělením zdrojů a financí můžeme zvýšit rychlost výroby stíhacích letounů."
