 corruption_reform_resistance_desc: "Úředníci a obchodní sítě ohrožené kontrolou brání dalším protikorupčním opatřením." # todo: NEW TRANSLATION
 post_war_recovery_effort: "Poválečné úsilí o obnovu"
 fuel_structure_building_efforts: "Zajištění národních zásob paliva"
 civil_war_disorganised_military_1: "Nekontrolovaná armáda"
 civil_war_disorganised_military_1_desc: "Začátek občanské války nás připravil o kontakt s armádou. Nejsme si jisti, kdo stojí na čí straně, kde se nacházejí naše zásobovací sklady ani kdo nám ještě dodává zbraně.\n\n§RAž tento národní duch vyprší, situace se mírně zlepší.§!\n\nSoučasný stav armády:\n§YNekontrolovaná§!\nChaotická\nZmatená\nNeorganizovaná\nNeukázněná" # todo: CHANGED
 civil_war_disorganised_military_2: "Chaotická armáda"
 civil_war_disorganised_military_2_desc: "I když jsme se vzpamatovali z počátečního šoku občanské války, situace je stále značně chaotická, s nepřehlednými velitelskými strukturami a špatně řízenou logistikou.\n\n§RAž tento národní duch vyprší, situace se mírně zlepší.§!\n\nSoučasný stav armády:\nNekontrolovaná\n§YChaotická§!\nZmatená\nNeorganizovaná\nNeukázněná" # todo: CHANGED
 civil_war_disorganised_military_3: "Zmatená armáda"
 civil_war_disorganised_military_3_desc: "Zorganizovali jsme svou armádu do něčeho víc než jen nesourodé skupiny dobrovolníků. Stále však chybí vedení a naše armáda má tendenci jednat bez výraznější strategie či cílů.\n\n§RAž tento národní duch vyprší, situace se mírně zlepší.§!\n\nSoučasný stav armády:\nNekontrolovaná\nChaotická\n§YZmatená§!\nNeorganizovaná\nNeukázněná" # todo: CHANGED
 civil_war_disorganised_military_4: "Neorganizovaná armáda"
 civil_war_disorganised_military_4_desc: "Nejhorší část počátečního zmatku pominula a naše armáda nyní většinou jedná jako skutečná armáda.\n\n§RAž tento národní duch vyprší, situace se mírně zlepší.§!\n\nSoučasný stav armády:\nNekontrolovaná\nChaotická\nZmatená\n§YNeorganizovaná§!\nNeukázněná" # todo: CHANGED
 civil_war_disorganised_military_5: "Neuspořádaná armáda"
 civil_war_disorganised_military_5_desc: "Naše armáda se téměř vrátila ke svému profesionálnímu stavu před občanskou válkou. Největší výzvou je nyní spojit a integrovat všechny různé milice, které jsme cestou shromáždili.\n\n§RAž tento národní duch vyprší, situace se mírně zlepší.§!\n\nSoučasný stav armády:\nNekontrolovaná\nChaotická\nZmatená\nNeorganizovaná\n§YNeukázněná§!" # todo: CHANGED
 SHA_libyan_education: "Libyjské vzdělávání"
 SHA_libyan_education_desc: "Libye je od 80. let oddaným podporovatelem saharské nezávislosti. Jedním z klíčových způsobů, jak Libye podporuje Frontu POLISARIO, je poskytování vzdělání mnoha mladým Sahrawům. To našemu lidu umožňuje přístup ke vzdělání, které nám Maročané upírají."
 generic_increased_military_support: "Zvýšená vojenská podpora"
 generic_military_intervention: "Aktivní vojenská intervence" # todo: NEW TRANSLATION
 protests_garrison_damage: "Pohotovost pořádkové policie" # todo: NEW TRANSLATION
 MD_emergency_police_funding_idea: "Mimořádné financování policie" # todo: NEW TRANSLATION
 MD_emergency_police_funding_idea_desc: "Policejní síly fungují díky přesčasovým rozpočtům a mimořádným nákupům. Davy se rozptylují rychleji a poslušnost roste, účet je však vysoký." # todo: NEW TRANSLATION
 MD_jobs_for_unemployed_idea: "Program pracovních míst pro nezaměstnané" # todo: NEW TRANSLATION
 MD_jobs_for_unemployed_idea_desc: "Program veřejných prací a náborů vrací nezaměstnané občany do práce. Stabilita a politická dynamika rostou za cenu mírného snížení nabídky spotřebního zboží." # todo: NEW TRANSLATION
 MD_tax_relief_promise_idea: "Balíček daňových úlev" # todo: NEW TRANSLATION
 MD_tax_relief_promise_idea_desc: "Domácnosti s nižšími příjmy platí menší daně a probíhá fiskální stimulace. Stabilita a politická dynamika rostou, zatímco plníme svůj slib." # todo: NEW TRANSLATION
 SUD_humiliated_army: "Ponížená armáda"
 SUD_humiliated_army_desc: "Nedávný nájezd darfúrských rebelů na El Fašír byl pro súdánskou armádu těžkou ranou jak po vojenské, tak po psychologické stránce. Mnohem menší skupině rebelů se podařilo zničit několik letadel, zabít více vojáků a zajmout generálmajora, velitele letecké základny. Než se armáda z této rány vzpamatuje, bude to chvíli trvat."
 AI_nationalist_drift: "Herní pravidlo: nacionalistický posun"
 SWE_stealth_submarines: "Technologie utajení ponorek"
 SWE_stealth_submarines_desc: "Technologie utajení ponorek"
 SWE_stealth_corvettes: "Technologie utajení korvet"
 SWE_stealth_corvettes_desc: "Technologie utajení korvet"
 SWE_homeguard: "Hemvärnet"
 healthcare_privatization: "Zdravotnický systém" # todo: NEW TRANSLATION
 healthcare_privatization_desc: "Určuje míru, do jaké zdravotní služby poskytuje stát namísto soukromých podniků. Plně veřejné systémy zaručují univerzální pokrytí, ale představují fiskální zátěž, zatímco plně soukromé systémy snižují státní výdaje za cenu horšího přístupu pro obyvatelstvo s nižšími příjmy." # todo: NEW TRANSLATION
 fully_privatized_healthcare: "Plně privatizované zdravotnictví" # todo: NEW TRANSLATION
 fully_privatized_healthcare_desc: "Všechny zdravotní služby poskytují soukromí poskytovatelé působící v tržním prostředí. Stát nenese přímé výdaje na zdravotnictví, ale přístup závisí na schopnosti platit a nerovnost ve zdravotních výsledcích bývá vysoká." # todo: NEW TRANSLATION
 partially_privatized_healthcare: "Částečně privatizované zdravotnictví" # todo: NEW TRANSLATION
 partially_privatized_healthcare_desc: "Soukromí poskytovatelé zajišťují většinu zdravotních služeb, přičemž stát financuje pouze omezenou záchrannou síť. Náklady vlády zůstávají poměrně nízké, avšak lidem, kteří si nemohou dovolit soukromé pojištění, zůstávají mezery v pokrytí." # todo: NEW TRANSLATION
 partially_nationalized_healthcare: "Částečně znárodněné zdravotnictví" # todo: NEW TRANSLATION
 partially_nationalized_healthcare_desc: "Smíšený systém, v němž veřejné nemocnice a pojišťovací programy fungují vedle soukromých poskytovatelů. Stát zaručuje všem občanům základní úroveň péče a zároveň umožňuje její doplnění soukromými službami." # todo: NEW TRANSLATION
 fully_nationalized_healthcare: "Plně znárodněné zdravotnictví" # todo: NEW TRANSLATION
 fully_nationalized_healthcare_desc: "Zdravotnictví je považováno za univerzální veřejnou službu, kterou stát plně financuje a spravuje. Všichni občané získávají pokrytí bez ohledu na příjem, vláda však nese veškeré náklady a systém vyžaduje značné průběžné investice." # todo: NEW TRANSLATION
 mining_policies: "Hornické předpisy" # todo: NEW TRANSLATION
 mining_policies_desc: "Upravuje environmentální a provozní standardy platné pro těžbu přírodních zdrojů. Přísnější předpisy chrání životní prostředí a komunity, ale snižují produkci; volnější standardy maximalizují výnosy zdrojů za cenu ekologických škod." # todo: NEW TRANSLATION
 full_environmental_protections: "Úplná ochrana životního prostředí" # todo: NEW TRANSLATION
 full_environmental_protections_desc: "Komplexní legislativa vyžaduje nejpřísnější environmentální standardy při všech těžebních operacích. Průmyslová produkce je omezena, ale dlouhodobé zdraví ekosystémů a místních komunit je zachováno." # todo: NEW TRANSLATION
 partial_environmental_protections: "Částečná ochrana životního prostředí" # todo: NEW TRANSLATION
 partial_environmental_protections_desc: "Environmentální standardy platí v nejcitlivějších oblastech a pro nejškodlivější postupy, zatímco běžná těžba probíhá s omezeným dohledem. Jde o kompromis, který zmírňuje ekologické škody, aniž by výrazně brzdil výrobu." # todo: NEW TRANSLATION
 balanced_protections: "Vyvážené hornické předpisy" # todo: NEW TRANSLATION
 balanced_protections_desc: "Předpisy jsou nastaveny tak, aby umožňovaly účinnou těžbu zdrojů a zároveň vyžadovaly minimální environmentální záruky. Ani ekologické skupiny, ani průmyslové lobbistické skupiny nejsou plně spokojeny, ale produkce i udržitelnost zůstávají na přijatelné úrovni." # todo: NEW TRANSLATION
 economic_motivated_mining: "Těžba s prioritou ekonomiky" # todo: NEW TRANSLATION
 economic_motivated_mining_desc: "Environmentální předpisy jsou omezeny na minimum vyžadované mezinárodními normami. Míra těžby je maximalizována ve prospěch národních hospodářských cílů a ekologické otázky se řeší pouze tehdy, když přímo ohrožují produktivitu." # todo: NEW TRANSLATION
 strip_mining: "Povrchová těžba" # todo: NEW TRANSLATION
 strip_mining_desc: "Všechny environmentální překážky jsou odstraněny ve snaze o maximální těžbu zdrojů. Krajina je rychle vyčerpávána a komunity nesou ekologické náklady, krátkodobé výnosy se však výrazně zvyšují." # todo: NEW TRANSLATION
 critical_infrastructure: "Údržba infrastruktury" # todo: NEW TRANSLATION
 critical_infrastructure_desc: "Stanovuje úroveň údržby národní infrastruktury: silnic, elektrických sítí, komunikačních sítí a vodohospodářských systémů. Vyšší výdaje na údržbu zachovávají produktivní kapacitu a veřejný blahobyt; nedostatečné investice umožňují postupné chátrání." # todo: NEW TRANSLATION
 minimal_maintenance: "Minimální údržba" # todo: NEW TRANSLATION
 minimal_maintenance_desc: "Infrastruktura je udržována v provozu pouze tam, kde by selhání způsobilo okamžitou krizi. Běžná údržba se odkládá, krátkodobé náklady se snižují a stav národní sítě se pomalu zhoršuje." # todo: NEW TRANSLATION
 standard_maintenance: "Standardní údržba" # todo: NEW TRANSLATION
 standard_maintenance_desc: "Infrastruktura je udržována na úrovni potřebné k zachování současného stavu a kvality služeb. Výdaje jsou předvídatelné a mírné, což brání chátrání, aniž by se usilovalo o rozšíření nebo zlepšení." # todo: NEW TRANSLATION
 extensive_maintenance: "Rozsáhlá údržba" # todo: NEW TRANSLATION
 extensive_maintenance_desc: "Vláda výrazně investuje do údržby, modernizace a odolnosti všech kritických sítí. Výkonnost infrastruktury je maximalizována a dlouhodobé náklady na obnovu se snižují, program však vyžaduje trvalý rozpočtový závazek." # todo: NEW TRANSLATION
 employment_pressure: "Pracovní předpisy" # todo: NEW TRANSLATION
 employment_pressure_desc: "Zákony upravující pracovní standardy, práva zaměstnanců a velikost pracovní síly potřebné k provozu budov." # todo: NEW TRANSLATION
 comprehensive_regulations: "Komplexní pracovní kodex" # todo: NEW TRANSLATION
 comprehensive_regulations_desc: "Rozsáhlá ochrana pracovníků a povinné počty zaměstnanců zvyšují požadavky na pracovní sílu ve všech odvětvích. Pracovníci očekávají jisté zaměstnání, takže nezaměstnanost je politicky obtížně tolerovatelná." # todo: NEW TRANSLATION
 strong_regulations: "Silná ochrana práce" # todo: NEW TRANSLATION
 strong_regulations_desc: "Silná práva pracovníků a bezpečnostní standardy vyžadují více zaměstnanců na každou budovu. Očekávání stabilního zaměstnání snižuje toleranci vlády k nezaměstnanosti." # todo: NEW TRANSLATION
 standard_regulations: "Standardní rámec práce" # todo: NEW TRANSLATION
 standard_regulations_desc: "Vyvážený přístup k pracovnímu právu, který stanovuje standardní požadavky na pracovní sílu a toleranci nezaměstnanosti." # todo: NEW TRANSLATION
 light_regulations: "Mírný dohled nad prací" # todo: NEW TRANSLATION
 light_regulations_desc: "Snížení regulační zátěže umožňuje podnikům fungovat s menším počtem pracovníků. Obyvatelstvo je více zvyklé na nejistotu zaměstnání, což zvyšuje tolerovanou hranici nezaměstnanosti." # todo: NEW TRANSLATION
 minimal_regulations: "Minimální pracovní standardy" # todo: NEW TRANSLATION
 minimal_regulations_desc: "Téměř neexistující ochrana pracovníků umožňuje úsporné personální obsazení všech budov. Ekonomika je uzpůsobena k fungování s výrazným přebytkem pracovní síly, což značně zvyšuje toleranci k vysoké nezaměstnanosti." # todo: NEW TRANSLATION
 COVID_pandemic_origin: "Původ pandemie COVID-19" # todo: NEW TRANSLATION
 COVID_pandemic_origin_desc: "Jako místo původu pandemie COVID-19 čelí náš národ vážnému hospodářskému narušení a mezinárodnímu dohledu. Zdravotnické systémy jsou přetížené a průmyslová výroba prudce klesla." # todo: NEW TRANSLATION
 COVID_pandemic_impact: "Pandemie COVID-19" # todo: NEW TRANSLATION
 COVID_pandemic_impact_desc: "Pandemie COVID-19 narušila každodenní život i hospodářskou činnost. Lockdowny a opatření veřejného zdraví jsou nezbytné, přicházejí však s vysokými hospodářskými náklady." # todo: NEW TRANSLATION
 COVID_supply_chain_disruption: "Globální krize dodavatelských řetězců" # todo: NEW TRANSLATION
 COVID_supply_chain_disruption_desc: "Pandemie rozvrátila globální dodavatelské řetězce. Nedostatek klíčových součástí a surovin zpomaluje výstavbu a průmyslovou výrobu ve všech odvětvích." # todo: NEW TRANSLATION
 pandemic_swine_flu_origin: "Původ pandemie prasečí chřipky H1N1" # todo: NEW TRANSLATION
 pandemic_swine_flu_origin_desc: "Jako místo původu pandemie prasečí chřipky H1N1 čelí naše země zvýšenému mezinárodnímu dohledu a prudce rostoucím nákladům na zdravotnictví, protože virus se šíří populací." # todo: NEW TRANSLATION
 pandemic_swine_flu_impact: "Prasečí chřipka H1N1" # todo: NEW TRANSLATION
 pandemic_swine_flu_impact_desc: "Pandemie prasečí chřipky H1N1 dorazila do naší země. Ačkoli je virus méně závažný, než se původně obávalo, zatěžuje zdravotnické systémy a narušuje hospodářskou činnost." # todo: NEW TRANSLATION
 pandemic_MERS_outbreak: "Propuknutí MERS" # todo: NEW TRANSLATION
 pandemic_MERS_outbreak_desc: "Respirační syndrom Blízkého východu se šíří naší zemí s vysokou úmrtností. Náklady na zdravotnictví prudce rostou, protože nemocnice zřizují izolační oddělení a zavádějí protokoly pro izolaci nákazy." # todo: NEW TRANSLATION
 pandemic_ebola_outbreak: "Epidemie eboly" # todo: NEW TRANSLATION
 pandemic_ebola_outbreak_desc: "Virus eboly pustoší naši zemi. Celé komunity jsou v karanténě, zdravotníci umírají v první linii a hospodářská činnost se v postižených oblastech zastavila." # todo: NEW TRANSLATION
 pandemic_ebola_DRC: "Propuknutí eboly" # todo: NEW TRANSLATION
 pandemic_ebola_DRC_desc: "Propuknutí eboly ve východních provinciích zatěžuje náš zdravotnický systém. Ozbrojený konflikt v regionu komplikuje snahy o izolaci nákazy, zvyšuje náklady a destabilizuje ekonomiku." # todo: NEW TRANSLATION
 USA_wot_diplomatic_victory: "Vítězství bez války" # todo: NEW TRANSLATION
 USA_wot_diplomatic_victory_desc: "Požadovali jsme Usámu bin Ládina a byl nám vydán – bez invaze, bez koalice a bez jediné rakví zahalené vlajkou, která by se vracela domů. Svět si všiml, čeho může americký tlak dosáhnout, když za ním nestojí obrněná divize.\n\nDoma je však přijetí chladnější. Mnoho lidí chtělo válku, ale nedočkali se jí." # todo: NEW TRANSLATION
 USA_white_house_burned: "Vypálený Bílý dům" # todo: NEW TRANSLATION
 USA_white_house_burned_desc: "Bílý dům, oficiální sídlo a pracoviště prezidenta Spojených států, byl vypálen nepřátelskými silami. Tato symbolická ztráta šokovala národ a podnítila obyvatelstvo k zuřivosti a odhodlání pomstít se. Morálka naší armády prudce roste, ale politická stabilita kolísá, protože centrum moci leží v troskách." # todo: NEW TRANSLATION
 TAL_pariah_settlement: "Kandahárská dohoda" # todo: NEW TRANSLATION
 TAL_pariah_settlement_desc: "Vydali jsme šejka a výměnou nám bylo dovoleno ponechat si naši zemi. Je to špatná dohoda. Téměř nikdo nás neuznává, Bezpečnostní rada na nás uvalila embargo, Američané nás sledují a muži, kteří bojovali po našem boku, námi pohrdají.\n\nEmirát přežívá. To je vše, co se o něm dá říci." # todo: NEW TRANSLATION
