 minor_power: "Menší mocnost"
 minor_power_desc: "Jako menší mocnost nejsme v mezinárodní diplomacii ani významným hráčem, ani bezvýznamným státem. Pokud to učiníme nejvyšší prioritou, máme omezenou schopnost odolávat zahraničnímu tlaku a vlivu, ale jen velmi omezené možnosti uplatňovat svůj vliv v zahraničí.\n\nStatus velmoci se určuje podle toho, jak velkým podílem našeho HDP přispíváme k celosvětovému součtu, což je upraveno naší §Ynezávislostí na zahraničním vlivu§!. Náš současný příspěvek činí §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nPožadované příspěvky pro jednotlivé úrovně jsou:\nVíce než §Y15%§! pro §Y$super_power$§!\nVíce než §Y6.5%§! pro §Y$great_power$§!\nVíce než §Y2.5%§! pro §Y$large_power$§!\nVíce než §Y0.2%§! pro §Y$minor_power$§!\nMéně než §Y0.2%§! pro §Y$non_power$§!\n\nV každém geografickém regionu bude určitý počet nejsilnějších §Y$minor_power$s§! klasifikován jako §Y$regional_power$s§!, pokud v regionu není dostatek §Y$super_power$s§!, §Y$great_power$s§! a §Y$large_power$s§!. Regiony a počty zemí nad úrovní §Y$minor_power$§! jsou:\nEvropa (7)\nBlízký východ a severní Afrika (3)\nSubsaharská Afrika (3)\nAsie (7)\nAmerika (4).\n\nŽebříček velmocí se aktualizuje čtvrtletně (v únoru, květnu, srpnu a listopadu)." # todo: CHANGED
 non_power: "Bezvýznamná země"
 non_power_desc: "Jako bezvýznamná mocnost jsme v mezinárodní diplomacii v podstatě nepodstatným činitelem a jen málokomu, pokud vůbec někomu, záleží na našem postoji k čemukoli. Jsme nástrojem dominantnějších a vlivnějších suverénních národů, které mohou snadno ovlivňovat naši politiku a společnost.\n\nStatus velmoci se určuje podle toho, jak velkým podílem našeho HDP přispíváme k celosvětovému součtu, což je upraveno naší §Ynezávislostí na zahraničním vlivu§!. Náš současný příspěvek činí §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nPožadované příspěvky pro jednotlivé úrovně jsou:\nVíce než §Y15%§! pro §Y$super_power$§!\nVíce než §Y6.5%§! pro §Y$great_power$§!\nVíce než §Y2.5%§! pro §Y$large_power$§!\nVíce než §Y0.2%§! pro §Y$minor_power$§!\nMéně než §Y0.2%§! pro §Y$non_power$§!\n\nV každém geografickém regionu bude určitý počet nejsilnějších §Y$minor_power$s§! klasifikován jako §Y$regional_power$s§!, pokud v regionu není dostatek §Y$super_power$s§!, §Y$great_power$s§! a §Y$large_power$s§!. Regiony a počty zemí nad úrovní §Y$minor_power$§! jsou:\nEvropa (7)\nBlízký východ a severní Afrika (3)\nSubsaharská Afrika (3)\nAsie (7)\nAmerika (4).\n\nŽebříček velmocí se aktualizuje čtvrtletně (v únoru, květnu, srpnu a listopadu)." # todo: CHANGED
