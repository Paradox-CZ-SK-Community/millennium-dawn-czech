l_english:
 slovenia.9.t: "Slovinsko vstupuje do NATO" # todo: NEW TRANSLATION
 slovenia.9.d: "Slovinská vlajka byla vztyčena v sídle NATO v Bruselu spolu s vlajkami šesti dalších nových členů při největším rozšíření v dějinách aliance. Třináct let po získání nezávislosti stojí země pod ochranným deštníkem článku 5." # todo: NEW TRANSLATION
 slovenia.9.a: "Bezpečnější místo ve světě" # todo: NEW TRANSLATION
 slovenia.10.t: "Slovinsko vstupuje do Evropské unie" # todo: NEW TRANSLATION
 slovenia.10.d: "O půlnoci byly za ohňostrojů a zvuku dechových kapel odstraněny závory na rakouských, italských a maďarských hranicích. Slovinsko vstupuje do Unie jako nejbohatší z deseti nových členů a první strukturální fondy již byly vyčleněny na silnice a železnice." # todo: NEW TRANSLATION
 slovenia.10.a: "Zpět mezi evropské jádro" # todo: NEW TRANSLATION
 slovenia.11.t: "Tolar ustupuje euru" # todo: NEW TRANSLATION
 slovenia.11.d: "Slovinsko je prvním z nových členských států, které přijalo euro, čímž po patnácti letech služby vyřadilo tolar. Přechod proběhl hladce a očekává se, že levnější půjčky udrží růst ekonomiky nad průměrem eurozóny." # todo: NEW TRANSLATION
 slovenia.11.a: "Sbohem, tolare" # todo: NEW TRANSLATION
 slovenia.12.t: "Schengen otevírá hranice" # todo: NEW TRANSLATION
 slovenia.12.d: "Slovinsko vstoupilo do schengenského prostoru a poslední pasové přepážky na rakouských, italských a maďarských hraničních přechodech se demontují. Chorvatská hranice nyní tvoří vnější hranici Unie, střeženou podle bruselských standardů." # todo: NEW TRANSLATION
 slovenia.12.a: "Evropa bez kontrolních stanovišť" # todo: NEW TRANSLATION
