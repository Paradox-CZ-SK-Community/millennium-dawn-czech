l_english:
 fiji_focus: "Fiji strom zaměření" # todo: NEW TRANSLATION
 FIJ_focus_the_1999_general_election: "Všeobecné volby v roce 1999" # todo: NEW TRANSLATION
 FIJ_focus_the_1999_general_election_desc: "V roce 1999 se konaly fidžijské všeobecné volby, které ustavily novou vládu, přičemž Fidžijská labouristická strana získala většinu křesel v parlamentu. Hlavní opoziční strana, SVT neboli Soqosoqo ni Vakavulewa ni Taukei, obsadila druhé místo. Vznikla tak dynamika, kdy byla labouristická strana považována za středolevicovou a SVT za středopravicovou. Na třetím místě se však umístila FAP neboli Fidžijská asociační strana. Jako odštěpenecká skupina SVT byla považována za paradoxně pravicovější, protože její členstvo tvořili převážně etničtí Fidžijci. Změna vedení však vedla ke známému zmírnění postoje strany, která později vytvořila volební alianci s FLP." # todo: NEW TRANSLATION
 FIJ_focus_assessing_the_national_situation: "Posouzení národní situace" # todo: NEW TRANSLATION
 FIJ_focus_assessing_the_national_situation_desc: "Navzdory příslibu nových voleb se musíme zorientovat a pochopit, co musíme hledat a napravit. Otřesy naší drahé vlasti od získání nezávislosti provázely politické spory a jeden převrat za druhým. Musíme proto jednat rychle, jinak upadneme do stejné bažiny." # todo: NEW TRANSLATION
 FIJ_focus_increased_security: "Posílení bezpečnosti v Suvě" # todo: NEW TRANSLATION
 FIJ_focus_increased_security_desc: "V hlavním městě panuje neklid. Obáváme se, že podnikatele v této oblasti může postihnout další etnické násilí, jehož riziko se zvýšilo po nedávném zvolení vlády s indo-fidžijskou většinou." # todo: NEW TRANSLATION
 FIJ_focus_the_2000_debacle: "Katastrofa roku 2000" # todo: NEW TRANSLATION
 FIJ_focus_the_2000_debacle_desc: "Na přelomu století zasáhl ostrov Fidži etnonacionalistický převrat. Pokus o převrat byl nakonec potlačen vojenským protipřevratem, od té doby však důvěra v civilní vládu klesla na historické minimum. Nyní se současná vládnoucí strana i opozice musí pokusit obnovit naději obyvatel Fidži." # todo: NEW TRANSLATION
 FIJ_focus_isolated_terror_attacks: "Nacionalistické útoky" # todo: NEW TRANSLATION
 FIJ_focus_isolated_terror_attacks_desc: "Navzdory Speightovu zatčení pokračovalo násilí ze strany povstalců. Dne 31. července stoupenci Speighta terorizovali vesnici Dreketi a zajali 30 rukojmích. Vojáci, kteří se vzbouřili v kasárnách Sukunaivalu, se vzdali až po šesti týdnech. Dne 8. srpna povstalci přepadli vojenskou hlídku, zabili jednoho vojáka a policistu a další tři zranili." # todo: NEW TRANSLATION
 FIJ_focus_military_disunity: "Vojenská vzpoura" # todo: NEW TRANSLATION
 FIJ_focus_military_disunity_desc: "Dne 2. listopadu 2000 se vojáci Jednotky pro protirevoluční boj loajální Speightovi vzbouřili v kasárnách Queen Elizabeth. Drželi důstojníky jako rukojmí ve snaze sesadit vojenského velitele Franka Bainimaramu. Když armáda kasárna znovu dobyla, byli zabiti dva vojáci a deset dalších zraněno. Čtyři povstalci byli následně loajálními vojáky mučeni a zabiti." # todo: NEW TRANSLATION
 FIJ_focus_political_legitimacy: "Upevněná legitimita" # todo: NEW TRANSLATION
 FIJ_focus_political_legitimacy_desc: "Dne 15. listopadu Nejvyšší soud Fidži prohlásil prozatímní vládu za nezákonnou. Mara zůstal zákonným prezidentem; parlament nebyl rozpuštěn, pouze pozastaven, a měl být znovu svolán. Z toho vyplývalo, že Chaudhry zůstal zákonným předsedou vlády. Mara následně oficiálně rezignoval, přičemž jeho rezignace byla zpětně datována k 29. květnu." # todo: NEW TRANSLATION
 FIJ_focus_political_stagnation: "Politická patová situace" # todo: NEW TRANSLATION
 FIJ_focus_political_stagnation_desc: "Po obnovení ústavy z roku 1997 a následně zvolené vlády z roku 1999 se národ podivně ocitl v nehybnosti. Vláda, která byla držena jako rukojmí a donucena k rezignaci, se náhle vrátila k údajnému normálu. Zatímco je národ v klidu, hlavní ministři a členové vlády nikoli. Někteří pochybují, zda si po takových událostech skutečně dokážou udržet moc." # todo: NEW TRANSLATION
 FIJ_focus_political_challenge: "Qaraseho výzva" # todo: NEW TRANSLATION
 FIJ_focus_political_challenge_desc: "Qaraseho vláda se proti rozhodnutí Nejvyššího soudu odvolala. Dne 1. března 2001 Odvolací soud Fidži potvrdil rozhodnutí Nejvyššího soudu o obnovení ústavy. Vláda rozhodnutí přijala a hodlala obnovit kampaň před nadcházejícími volbami v roce 2001." # todo: NEW TRANSLATION
 FIJ_focus_2001_elections: "Fidžijské všeobecné volby v roce 2001" # todo: NEW TRANSLATION
 FIJ_focus_2001_elections_desc: "Rozhodnutí uspořádat nové volby vedlo k jejich konání v srpnu a září 2001. Volby byly napjaté kvůli sporům kolem vlády zvolené v roce 1999, v níž měla většinu Fidžijská labouristická strana vedená Mahendrou Chaudhrym. Ta soupeřila s vládou dosazenou po převratu, vedenou Laiseniou Qarase, který pocházel z hlavní opoziční strany. Sjednocená fidžijská strana neboli Soqosoqo Duavata ni Lewenivanua (SDL) vznikla pod Qaraseho vedením, když byl během převratu v roce 2000 jmenován premiérem. Tato strana pohltila většinu zbytků Fidžijské asociační strany a většinu Křesťanské demokratické aliance spolu s dalšími konzervativními skupinami, čímž vytvořila jakousi velkou konzervativní koalici. SDL nakonec ve volbách získala většinu a otevřela cestu k povolebnímu uspořádání země po převratu." # todo: NEW TRANSLATION
 FIJ_focus_post_coup_cleanup: "Úklid po převratu" # todo: NEW TRANSLATION
 FIJ_focus_post_coup_cleanup_desc: "Po převratu došlo k rozsáhlým škodám na majetku a v širší oblasti hlavního města Suvy zavládl naprostý chaos. Pokud chceme začít s čistým štítem a postupovat k našim cílům, musíme investovat do rychlého úklidu." # todo: NEW TRANSLATION
 FIJ_focus_early_community_programs: "Počáteční komunitní programy" # todo: NEW TRANSLATION
 FIJ_focus_early_community_programs_desc: "Musíme obnovit vůli lidu spolupracovat. Všichni jsme občany Fidži, a proto musíme být ochotni žít jeden s druhým. Abychom ukázali, že převrat nepředstavuje skutečnou podobu naší země, vytvoříme programy jednoty. Ty ukážou, že města a komunity jsou o vzájemném spojování, nikoli o vzájemném ničení." # todo: NEW TRANSLATION
 FIJ_focus_head_start_cooperatives: "Programy družstev pro mladé" # todo: NEW TRANSLATION
 FIJ_focus_head_start_cooperatives_desc: "Zatímco starší generace se navzájem rozdělují, je na mladší generaci, aby dala věci znovu dohromady. Musíme proto už od začátku v našem školství pěstovat smysl pro rodinnou jednotu a ukázat, že nezáleží na tom, zda jste Fidžijec nebo indo-fidžijec — všichni jsme zde, abychom společně pracovali pro lepší zítřek." # todo: NEW TRANSLATION
 FIJ_focus_softer_situational_training_programs: "Mírnější situační výcvikové programy" # todo: NEW TRANSLATION
 FIJ_focus_softer_situational_training_programs_desc: "Vzhledem k vysokému napětí mezi etnickými skupinami musíme reformovat policii. Abychom zabránili odporu vůči přílišné shovívavosti ke kriminalitě, půjde ve skutečnosti o nový výcvikový program pro bezpečnostní složky. Program je zaměřen na občanské spory mezi skupinami a na to, jak mohou policisté situaci řešit, aniž by působili dojmem, že straní jedné či druhé straně." # todo: NEW TRANSLATION
 FIJ_focus_service_guarantee_citizenship: "Služba zaručuje občanství!" # todo: NEW TRANSLATION
 FIJ_focus_service_guarantee_citizenship_desc: "Musíme vytvořit pocit národní hrdosti. K tomu můžeme využít armádu a možná přivést nové obyvatele, aby byl náš ostrov rozmanitější než jen Fidžijci a indo-fidžijci. Proto v armádě vytvoříme program občanství za službu. Trocha dodatečného financování a smysluplnější zaměstnání vojenského vedení by nám v poválečném světě po převratu měly celkově pomoci. Pamatujte, oni dělají svou část. A co vy? Připojte se dnes k Vojenským silám Republiky Fidži!" # todo: NEW TRANSLATION
 FIJ_focus_the_universal_retirement_program: "Univerzální důchodový program" # todo: NEW TRANSLATION
 FIJ_focus_the_universal_retirement_program_desc: "URP bude univerzálním důchodovým fondem, který vláda vytvoří a poskytne každému občanovi, jenž dosáhl důchodového věku a požádal o důchod či jiné související sociální dávky. Doufáme, že pozvedneme a vyrovnáme základní životní úroveň všech občanů ve prospěch celého národa." # todo: NEW TRANSLATION
 FIJ_focus_the_national_care_initiative: "Národní iniciativa péče" # todo: NEW TRANSLATION
 FIJ_focus_the_national_care_initiative_desc: "NCI bude základem našeho zdravotnického systému. Základní léčba běžných úrazů a podobných potíží bude zdarma dostupná všem občanům. Doufáme, že poskytovaná péče ukáže občanům tvořícím náš národ, že se o ně staráme, a oni nám na oplátku dají skutečnou šanci zlepšit život, jak jej známe." # todo: NEW TRANSLATION
 FIJ_focus_soup_kitchens_act: "Zákon o polévkárnách" # todo: NEW TRANSLATION
 FIJ_focus_soup_kitchens_act_desc: "Vzhledem k rostoucímu bezdomovectví, etnickému napětí a odchodu lidí z ostrova musíme hledat radikální řešení. Vládní program, který zřídí strategicky rozmístěné polévkárny pro všechny bez domova či v zoufalé situaci, může lidi znovu spojit. Není to tolik, kolik bychom si přáli, ale představuje to základ skutečné charitativní iniciativy v celém národě." # todo: NEW TRANSLATION
 FIJ_focus_police_fairness_act: "Zákon o spravedlivé policii" # todo: NEW TRANSLATION
 FIJ_focus_police_fairness_act_desc: "Nyní, když je vše připraveno a pozornost se soustředí na bezpečnost a zacházení s obyvateli národa, musí být naše bezpečnostní složky lépe organizovány a nesmějí být vnímány jako bezohlední darebáci. Organizace policie a její rozmístění budou znovu vyhodnoceny, aby byly spravedlivější jak vůči oblastem s vysokou kriminalitou, tak vůči místům, která místní považují za zanedbaná." # todo: NEW TRANSLATION
 FIJ_focus_fijian_corps_of_engineers: "Fidžijský ženijní sbor" # todo: NEW TRANSLATION
 FIJ_focus_fijian_corps_of_engineers_desc: "Zřízení útvaru FCE v rámci RFMF bude cílenou mírovou iniciativou armády na podporu domácího rozvoje. Může jít o renovaci stávající vojenské infrastruktury, ale také o posílení civilních stavebních projektů ve veřejném sektoru, jako jsou vodovody, silnice, železnice a další infrastruktura, která zajišťuje chod našeho národa." # todo: NEW TRANSLATION
 FIJ_focus_early_education_standards_act: "Zákon o standardech základního vzdělávání" # todo: NEW TRANSLATION
 FIJ_focus_early_education_standards_act_desc: "EESA je rozpočtový zákon, který přidělí finanční prostředky na počáteční úrovně vzdělávání. Peníze půjdou na kombinaci platů učitelů, nových učebnic a sjednocení potřebných materiálů a vybavení tříd pro každý hlavní předmět. Financování bude rovnoměrně rozděleno mezi všechny základní školy. Doufáme, že nové generace získají lepší znalosti a přechod na druhý stupeň pro ně bude snazší. Tím se položí základ budoucímu financování, které bude postupně zlepšovat vzdělávací standardy celého národa." # todo: NEW TRANSLATION
 FIJ_focus_targeted_medical_imports: "Cílený dovoz zdravotnického materiálu" # todo: NEW TRANSLATION
 FIJ_focus_targeted_medical_imports_desc: "Díky vyčleněnému financování sestavíme seznam prioritního zdravotnického vybavení, potřebných léků a základních zásob, abychom vytvořili minimální skladové zásoby a umožnili co nejefektivnější chod naší zdravotnické infrastruktury. Tím bychom měli zahájit proces podpory domácího zdravotnického rozvoje, kdykoli to bude možné, abychom nebyli ochromeni globálními dodavatelskými řetězci." # todo: NEW TRANSLATION
 FIJ_focus_fiji_food_securities_program: "Program potravinové bezpečnosti Fidži" # todo: NEW TRANSLATION
 FIJ_focus_fiji_food_securities_program_desc: "FFSP je program podobný potravinové bance, v jehož rámci si nejvíce postižené osoby mohou vyzvednout přidělené dávky a nakoupit potraviny potřebné k přežití své domácnosti na dobu jednoho měsíce. To by mělo zvýšit základní životní úroveň, zmírnit chudobu a pomoci s rostoucím problémem emigrace, který národ neustále sužuje." # todo: NEW TRANSLATION
 FIJ_focus_domestic_savings_initiative: "Iniciativa domácích úspor" # todo: NEW TRANSLATION
 FIJ_focus_domestic_savings_initiative_desc: "DSI bude specializovaným programem navrženým jako jakási válečná rezerva vlády. Tato rezerva bude využívána pouze v době hospodářské krize nebo k provádění cílených programů zmírňujících situace, které narostly do rozměrů nezvládnutelných místními úřady. Taková opatření umožní Fidži působit lépe řízeným a přitažlivějším dojmem před zahraničními pozorovateli, protože naše situace není právě nejpřívětivější. Přesto zvítězíme a vstoupíme do nového tisíciletí s energií, jakou jsme za více než třicet let od získání nezávislosti nepoznali." # todo: NEW TRANSLATION
 FIJ_focus_fijian_economic_diversity_initiative: "Iniciativa fidžijské hospodářské diverzifikace" # todo: NEW TRANSLATION
 FIJ_focus_fijian_economic_diversity_initiative_desc: "FEDI je obecný koncepční plán, podle nějž by měl Fidži během příštích desetiletí dosáhnout alespoň základní míry soběstačnosti, jak jen to bude možné. O zdrojích, na nichž stojíme, toho upřímně mnoho nevíme. Kvůli etnickému napětí, odchodu obyvatel a armádě i populaci, které příliš nedůvěřují vládě, máme příliš mnoho problémů na to, abychom se této snaze plně věnovali. Přesto doufáme, že cíle dosáhneme během několika příštích desetiletí. Zda si udržíme směr a těchto cílů dosáhneme, však záleží na lidech." # todo: NEW TRANSLATION
 FIJ_focus_rebuild_suva_initiative: "Iniciativa obnovy Suvy" # todo: NEW TRANSLATION
 FIJ_focus_rebuild_suva_initiative_desc: "RSI je vzájemně dohodnutý balík hospodářské pomoci občanům Suvy, kteří během tříměsíčního převratu utrpěli nejvíce. Rozsáhlé rabování a nepokoje způsobily obrovské škody na majetku a zničily živobytí mnoha lidí. Musíme jim proto pomoci znovu se postavit na vlastní nohy." # todo: NEW TRANSLATION
 FIJ_focus_early_business_management: "Program základního řízení podniků" # todo: NEW TRANSLATION
 FIJ_focus_early_business_management_desc: "BMP je vládní iniciativa na podporu nové generace podnikatelů a podnikatelek našeho národa. Půjde o specializované kurzy a praktickou stážní přípravu, která pomůže pochopit, jak řídit, vést a skutečně porozumět tomu, co znamená být vlastníkem podniku. Doufáme, že nastartujeme rozvoj našeho hospodářství, protože budou vznikat nové půjčky a vyrábět a prodávat se nové zboží a služby." # todo: NEW TRANSLATION
 FIJ_focus_startup_investment_program: "Investiční program pro začínající podniky" # todo: NEW TRANSLATION
 FIJ_focus_startup_investment_program_desc: "SIP bude specializovaným úvěrovým programem pro financování nových podnikatelů a jejich snů. Přestože by takový projekt mohl vést k nezodpovědnému poskytování půjček, využijeme vyčleněnou část státního rozpočtu a ponecháme programu značnou samostatnost. Pokud tedy financovaný podnik zkrachuje, nevzniknou daňovým poplatníkům žádné další náklady." # todo: NEW TRANSLATION
 FIJ_focus_start_mining_survey_program: "Zahájení geologických průzkumů" # todo: NEW TRANSLATION
 FIJ_focus_start_mining_survey_program_desc: "Zahájíme několik průzkumných programů, abychom zjistili, jaké zdroje máme k dispozici a jak na tom skutečně jsme při zavádění našeho omezeného programu soběstačnosti." # todo: NEW TRANSLATION
 FIJ_focus_importing_mining_equipment: "Dovoz těžebního vybavení" # todo: NEW TRANSLATION
 FIJ_focus_importing_mining_equipment_desc: "Nedávné těžební průzkumy, které jsme navrhli, musíme podpořit. Proto vytvoříme prioritní seznam klíčového těžebního vybavení, materiálů a potřebných pomůcek pro naše horníky. Tito lidé jsou základem diverzifikace našeho hospodářství." # todo: NEW TRANSLATION
 FIJ_focus_increased_core_industries: "Rozvoj klíčových průmyslových odvětví" # todo: NEW TRANSLATION
 FIJ_focus_increased_core_industries_desc: "Vzhledem k tomu, že se náš národ v rámci dvacetiletého plánu dívá do budoucnosti, měli bychom investovat do rozšíření našich základních odvětví. Lesnictví a lodní doprava jsou poměrně silnými oblastmi, ale zaměříme se také na těžební sektor, zejména na cement." # todo: NEW TRANSLATION
 FIJ_focus_solidifying_precious_metals: "Upevnění těžby drahých kovů" # todo: NEW TRANSLATION
 FIJ_focus_solidifying_precious_metals_desc: "Těžba a vývoz zlata a stříbra jsou klíčovou součástí našeho zahraničního obchodu. Rozšíření těchto pododvětví výrazně zlepší poměr našeho obchodního deficitu mezi dovozem a vývozem zboží. Růst těchto odvětví zvýší naše obchodní příjmy a umožní nám posílit dovoz. Začíná cyklus růstu." # todo: NEW TRANSLATION
 FIJ_focus_establishing_fijian_manufacturing: "Budování fidžijského průmyslu" # todo: NEW TRANSLATION
 FIJ_focus_establishing_fijian_manufacturing_desc: "Vybudování silné výrobní základny nám umožní diverzifikovat hospodářství. Základní výrobní kapacity nám při dovozu umožní rozšířit využití dováženého zboží a lépe těžit z našeho vývozu." # todo: NEW TRANSLATION
 FIJ_focus_economic_relief_fund: "Fond hospodářské pomoci" # todo: NEW TRANSLATION
 FIJ_focus_economic_relief_fund_desc: "ERF je vytvořená záchranná síť. Pokud se národ dostane do obtíží nebo hospodářské podmínky způsobí náhlý kolaps či volný pád některého odvětví, mohou podniky z postiženého sektoru požádat o organizovanou záchranu. Tyto podpory budou vyjednávány a poskytovány v rámci rozpočtu přiděleného ERF. Doufáme, že takový fond zmírní dopady případných vnějších sil na naše hospodářství." # todo: NEW TRANSLATION
 FIJ_focus_balanced_trading_budget: "Vyrovnaný obchodní rozpočet" # todo: NEW TRANSLATION
 FIJ_focus_balanced_trading_budget_desc: "Zatímco se národ od polozemědělského a deindustrializovaného hospodářství posouvá do nové éry rozmanitosti a prosperity, musíme dbát na to, aby naše výdaje nepřevážily nad tím, co hodláme vyvážet. Proto musíme téměř čtvrtletně, případně i poločtvrtletně, provádět skutečné vyrovnávání rozpočtu. Časem své hospodářství vyladíme a zvýšíme jeho efektivitu i celkovou účinnost." # todo: NEW TRANSLATION
 FIJ_focus_early_adoption_tech_sector_investments: "Počáteční investice do technologického sektoru" # todo: NEW TRANSLATION
 FIJ_focus_early_adoption_tech_sector_investments_desc: "S rostoucím významem takzvaného internetu, na který se upírají globální trhy, je naší povinností odpovědět. Proto vyladíme průmyslovou výrobu a vývoz tak, aby zahrnovaly nové produkty a služby, které technologický sektor vytváří." # todo: NEW TRANSLATION
 FIJ_focus_the_motorway_improvement_act: "Zákon o modernizaci silnic" # todo: NEW TRANSLATION
 FIJ_focus_the_motorway_improvement_act_desc: "Parlament schválil zákon financující cílené modernizační projekty na hlavních silnicích v zemi. Zákon má lépe zvládnout rostoucí nákladní dopravu a rozšířit přístup nových potenciálních podniků a průmyslových odvětví s tím, jak naše hospodářství roste a rozvíjí se. Někteří odmítají zvýšení výdajů, jiní doufají, že jde o další krok na cestě k naší budoucnosti jako národa." # todo: NEW TRANSLATION
 FIJ_focus_the_new_millennia_tax_reform_act: "Zákon o daňové reformě po převratu" # todo: NEW TRANSLATION
 FIJ_focus_the_new_millennia_tax_reform_act_desc: "Parlament nedávno schválil zákon PCTR, který reformuje výběr daní od podniků i obyvatelstva tak, aby byl snad spravedlivější vůči chudým a etnickým Fidžijcům, kteří tvoří značnou část naší chudobou zasažené populace." # todo: NEW TRANSLATION
 FIJ_focus_domestic_energy_initiative: "Iniciativa domácí energetiky" # todo: NEW TRANSLATION
 FIJ_focus_domestic_energy_initiative_desc: "DEI je program výzkumu, průzkumu a plánování. Náš ostrov je poměrně malý, a proto musíme při výrobě energie získat co nejvíce za co nejméně. Zjistili jsme vhodný zdroj domácí ropy, který můžeme těžit, a zároveň tak začleníme základy petrochemického průmyslu jako rozšíření a přímé napojení na těžbu zdrojů. To by mělo výrazně pomoci budoucímu plánování." # todo: NEW TRANSLATION
 FIJ_focus_domestic_resource_diversity: "Program diverzifikace domácích zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_domestic_resource_diversity_desc: "Parlament vytvořil program DRD, vládní iniciativu zaměřenou na rozšíření a případnou diverzifikaci domácích zdrojů i jejich těžby. Po většinu existence našeho milovaného ostrova jsme byli známí zlatem a stříbrem, avšak nedávné průzkumy a technologický pokrok odhalily poměrně velká ložiska klíčových surovin, jako je železo, měď a dokonce ropa. Doufáme, že v budoucnu tyto počátky těžby výrazně rozvineme." # todo: NEW TRANSLATION
 FIJ_focus_the_2006_general_election: "Všeobecné volby v roce 2006" # todo: NEW TRANSLATION
 FIJ_focus_the_2006_general_election_desc: "Ve Fidži se mezi 6. a 13. květnem 2006 konaly všeobecné volby. Úřadující vláda Soqosoqo Duavata ni Lewenivanua (SDL), vedená premiérem Laiseniou Qarase, soupeřila s hlavní protiváhou, Fidžijskou labouristickou stranou vedenou Mahendrou Chaudhrym, a několika dalšími menšími stranami." # todo: NEW TRANSLATION
 FIJ_focus_subtle_ethnic_illusions: "Nenápadné etnické iluze" # todo: NEW TRANSLATION
 FIJ_focus_subtle_ethnic_illusions_desc: "Nyní, když je naše znovuzvolení zajištěno a mocenské poměry se mění v náš prospěch, musíme upevnit hegemonii našeho lidu na ostrově. Otevřený odpor a dokonce nepřátelství by byly nevyhnutelné, proto budeme postupovat nenápadněji a připravíme půdu pro skutečnou změnu." # todo: NEW TRANSLATION
 FIJ_focus_drafting_the_reconciliation_bill: "Příprava zákona o usmíření" # todo: NEW TRANSLATION
 FIJ_focus_drafting_the_reconciliation_bill_desc: "Zákon o usmíření poskytne etnickým Fidžijcům několik menších ústupků. Jedním z hlavních bodů bude ohlédnutí za převratem v roce 2000 a otevření nové kapitoly prostřednictvím amnestie pro účastníky převratu a uvězněné členy. Doufáme, že veřejnost díky tomu lépe a pravdivěji pochopí, že všichni děláme chyby a neměli bychom být definováni pouze jimi." # todo: NEW TRANSLATION
 FIJ_focus_assessing_the_farmland_leases: "Posouzení nájmů zemědělské půdy" # todo: NEW TRANSLATION
 FIJ_focus_assessing_the_farmland_leases_desc: "Nájem zemědělské půdy indo-fidžijskému obyvatelstvu jako náhrada za někdejší Royal Sugar Refining Company z koloniální éry je dávno zastaralý. Takovou praxí lpíme na minulosti, a proto připravíme legislativu, která tuto otázku náležitě vyřeší." # todo: NEW TRANSLATION
 FIJ_focus_labour_party: "FLP vítězí v povolebním otřesu" # todo: NEW TRANSLATION
 FIJ_focus_labour_party_desc: "FUP ustoupila všem požadavkům armády ze strachu z odvety a oprávněných obav, že hrozba převratu bude skutečně naplněna. Následovaly předčasné volby, v nichž zvítězila většinová vláda FLP. S armádou nepřímo na naší straně a jakýmsi čistým štítem můžeme skutečně změnit věci k lepšímu." # todo: NEW TRANSLATION
 FIJ_focus_turning_down_the_heat: "Zchlazení situace" # todo: NEW TRANSLATION
 FIJ_focus_turning_down_the_heat_desc: "S novou vládou u moci a dosaženým konsenzem s armádou máme čistý štít. Napětí mezi etnickými skupinami, které vyvrcholilo fiaskem v roce 2006, nyní polevilo a můžeme začít lépe spojovat naše komunity. Přestože se naše počty postupně zmenšují, můžeme připravit půdu pro nový věk míru na ostrově." # todo: NEW TRANSLATION
 FIJ_focus_simmering_national_fears: "Doutnající národní obavy" # todo: NEW TRANSLATION
 FIJ_focus_simmering_national_fears_desc: "Mnoho lidí stále houfně opouští zemi a musíme na to reagovat. Přesměrováním rozpočtů ve zdravotnictví a sociálních programech můžeme povzbudit mladší generace, aby neodcházely, a ukázat jim, že tu pro ně jsme." # todo: NEW TRANSLATION
 FIJ_focus_setting_to_boil_new_economic_plans: "Uvedení nových hospodářských plánů do varu" # todo: NEW TRANSLATION
 FIJ_focus_setting_to_boil_new_economic_plans_desc: "Hospodářství stagnuje nebo roste tempem, které vypadá jako stagnace, i kdyby někdo na globálním trhu jen kýchnul. Musíme proto posílit naše hospodářské iniciativy a usilovat o vybudování propojenosti i hospodářské stability — jakéhosi plánu soběstačnosti." # todo: NEW TRANSLATION
 FIJ_focus_a_path_of_healing: "Cesta k uzdravení" # todo: NEW TRANSLATION
 FIJ_focus_a_path_of_healing_desc: "Bouře pominula, naše myšlenky jsou uspořádané a nyní se můžeme věnovat domácí situaci, která pravděpodobně pohltí většinu práce vlády." # todo: NEW TRANSLATION
 FIJ_focus_foreign_outreach: "Navazování zahraničních vztahů" # todo: NEW TRANSLATION
 FIJ_focus_foreign_outreach_desc: "Naše nestabilní země nyní v očích zahraničních mocností působí stabilněji. Můžeme proto hledat a nabízet investice a zjistit, jaké místo v našem světě zaujmeme." # todo: NEW TRANSLATION
 FIJ_focus_farmers_investment_division: "Oddělení investic pro zemědělce" # todo: NEW TRANSLATION
 FIJ_focus_farmers_investment_division_desc: "Zdá se, že zemědělci způsobili na tomto krásném ostrově mnoho rozruchu. Musíme proto ve vládě zřídit vyvážené oddělení pro investice do zemědělství, které se postará o všechny potřeby. Zemědělci jsou zkrátka zemědělci a všichni potřebují pomoc." # todo: NEW TRANSLATION
 FIJ_focus_fijian_redevelopment_fund_phase_one: "Fidžijský fond obnovy – fáze 1" # todo: NEW TRANSLATION
 FIJ_focus_fijian_redevelopment_fund_phase_one_desc: "FRF neboli Fidžijský fond obnovy je dlouhodobá vládní iniciativa, která se pokusí vyřešit více problémů prostřednictvím zaměření na hospodářský rozvoj. Tyto plány budou komplexní a rozvržené do etap tak, aby v těchto napjatých časech zajistily co největší národní stabilitu." # todo: NEW TRANSLATION
 FIJ_focus_ministry_of_scientific_development: "Ministerstvo vědeckého rozvoje" # todo: NEW TRANSLATION
 FIJ_focus_ministry_of_scientific_development_desc: "MoSD bude specializovaným sektorem vlády. Jeho hlavním cílem bude vyhledávat bystré mysli i budoucí talenty národa a umožnit jim nejen výzkum a vývoj nových technologií, ale také pozvednout vzdělanost našeho lidu." # todo: NEW TRANSLATION
 FIJ_focus_reforming_trade_initiatives: "Reforma obchodních iniciativ" # todo: NEW TRANSLATION
 FIJ_focus_reforming_trade_initiatives_desc: "Náš ostrov ukrývá mnoho nevyužitých zdrojů. Pokud chceme diverzifikovat hospodářství, musíme být schopni vyvážet i dovážet. Nové vyjednání obchodních podmínek a hledání nejvýhodnějších odběratelů nám umožní získat více kapitálu pro naše budoucí plány." # todo: NEW TRANSLATION
 FIJ_focus_pulling_in_foreign_scientist: "Přilákání zahraničních vědců" # todo: NEW TRANSLATION
 FIJ_focus_pulling_in_foreign_scientist_desc: "Naše nejbystřejší mozky odcházejí a tomu musíme okamžitě zabránit. Pokud přesvědčíme zahraniční vědce, aby zde založili výzkumná oddělení a vytvořili základnu, pomůže to nejen rozvoji národa, ale také odradí naše vlastní obyvatele od odchodu." # todo: NEW TRANSLATION
 FIJ_focus_overhauling_the_tax_code: "Komplexní reforma daňového systému" # todo: NEW TRANSLATION
 FIJ_focus_overhauling_the_tax_code_desc: "Federální daňový systém je v troskách. Desetiletí převratů, změn vlád a střídání politik podporujících etnické Fidžijce a indo-fidžijce z něj vytvořila chaos a zdroj obrovské neefektivity. Musíme jej vybudovat od základů a zcela vyloučit etnická hlediska. Daňový systém má zajišťovat finanční stabilitu národa, nikoli zvýhodňovat některé občany." # todo: NEW TRANSLATION
 FIJ_focus_domestic_iron_development: "Rozvoj domácí těžby železa" # todo: NEW TRANSLATION
 FIJ_focus_domestic_iron_development_desc: "Díky nedávnému pokroku v geologických průzkumných technologiích jsme odhalili ložiska železné rudy, kterou můžeme využít doma i vyvážet. Tyto zásoby nám poskytnou určitý prostor pro podporu domácích rozvojových projektů." # todo: NEW TRANSLATION
 FIJ_focus_expanding_upon_domestic_energy_sources: "Rozšíření domácích energetických zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_expanding_upon_domestic_energy_sources_desc: "Náš ostrov je sice malý, ale je napěchovaný množstvím různých přírodních zdrojů. Právě tyto zdroje nám umožní nejen stabilizovat domácí situaci, ale také se poohlédnout po regionu, v němž žijeme." # todo: NEW TRANSLATION
 FIJ_focus_human_resources_fund: "Fond lidských zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_human_resources_fund_desc: "S rozvojem hospodářství musíme mít také dostatek lidí, kteří v něm budou pracovat. Musíme přivést zpět občany, kteří uprchli do zahraničí, a také přilákat ty, kteří hledají příležitost. S dostatečnými pobídkami jim můžeme ukázat skutečné možnosti." # todo: NEW TRANSLATION
 FIJ_focus_pacific_exchange_and_investment_society: "Pacifická investiční a obchodní společnost" # todo: NEW TRANSLATION
 FIJ_focus_pacific_exchange_and_investment_society_desc: "Říká se, že člověk nemůže mít dort a zároveň ho sníst. Ale co takhle PIES? Tato společnost bude skvělou platformou pro působení v pacifickém regionu a lepší prosazení našich zájmů mezi mnohem většími konkurenty." # todo: NEW TRANSLATION
 FIJ_focus_phase_two_development_fund: "Fidžijský rozvojový fond – fáze 2" # todo: NEW TRANSLATION
 FIJ_focus_phase_two_development_fund_desc: "První fáze byla kvůli směsi dalších priorit poněkud nejasná, ale nyní musíme pokračovat podle skutečného plánu. Chceme přilákat zahraniční investice, upřednostnit domácí růst a vyvážit dovoz a vývoz, abychom zachovali silnou míru hospodářské i zahraniční nezávislosti." # todo: NEW TRANSLATION
 FIJ_focus_security_through_community: "Bezpečnost prostřednictvím komunity" # todo: NEW TRANSLATION
 FIJ_focus_security_through_community_desc: "Policejní úsilí je pod rigidním systémem přetížené, náš nový systém však umožní větší zapojení komunit. Tyto programy zorganizují místní obyvatele tak, aby lépe spolupracovali, dají jim možnost zadržet pachatele a umožní rozšíření místních policejních oddělení prostřednictvím spolupráce s komunitami." # todo: NEW TRANSLATION
 FIJ_focus_the_care_balance_act: "Zákon o rovnováze péče" # todo: NEW TRANSLATION
 FIJ_focus_the_care_balance_act_desc: "CBA je zákon, který projde zdravotnickým a sociálním systémem země a pokusí se vyvážit a reformovat jeho nejpalčivější nedostatky." # todo: NEW TRANSLATION
 FIJ_focus_the_military_reform_bill: "Zákon o vojenské reformě" # todo: NEW TRANSLATION
 FIJ_focus_the_military_reform_bill_desc: "Parlamentní návrh zákona č. M253 je výsledkem vyjednávání. Depolitizace armády umožní zvýšit financování domácích výcvikových programů, stejně jako platy mužů a žen, kteří nasazují životy na obranu našeho národa a jeho obyvatel. Je to začátek, avšak naděje na rozsáhlé vojenské investice zatím není velká." # todo: NEW TRANSLATION
 FIJ_focus_foreign_construction_contracts: "Zahraniční stavební zakázky" # todo: NEW TRANSLATION
 FIJ_focus_foreign_construction_contracts_desc: "Přilákání zahraničních investic musí začít u společností, nejen u samotných představitelů států. Zaměřením podpory na domácí dodavatele stavebních projektů můžeme získat nové nápady, materiály i novou vlnu lidí, kteří budou moci na ostrově žít." # todo: NEW TRANSLATION
 FIJ_focus_education_investment_package: "Investiční balíček pro vzdělávání" # todo: NEW TRANSLATION
 FIJ_focus_education_investment_package_desc: "EIP představuje cílené zvýšení rozpočtu na vzdělávání a výzkum a vývoj, které nám pomůže dohnat regionální sousedy. Díky tomu budeme moci hledat nové a účinnější zdroje i výrobní postupy." # todo: NEW TRANSLATION
 FIJ_focus_foreign_medical_expos: "Zahraniční zdravotnické veletrhy" # todo: NEW TRANSLATION
 FIJ_focus_foreign_medical_expos_desc: "Spolupráce se zdravotnickými institucemi z celého světa by nám měla umožnit skutečně investovat do zdraví a blahobytu našeho lidu, do jeho duševního i tělesného stavu a do životního stylu, o který usiluje." # todo: NEW TRANSLATION
 FIJ_focus_phase_three_development_funds: "Fidžijský rozvojový fond – fáze 3" # todo: NEW TRANSLATION
 FIJ_focus_phase_three_development_funds_desc: "Jsme na cestě k velikosti. Zaměřením na skutečné problémy a uklidněním rozporů vytvořených minulostí jsme národ nasměrovali na cestu růstu namísto zkázy. Musíme v tomto způsobu vlády pokračovat a ještě jej posílit, abychom zajistili budoucnost našeho národa i našeho způsobu života." # todo: NEW TRANSLATION
 FIJ_focus_cohesive_integrations_act: "Zákon o soudržné integraci" # todo: NEW TRANSLATION
 FIJ_focus_cohesive_integrations_act_desc: "Nyní, když rozumíme své vlasti, musíme se pokusit porozumět našim pacifickým sousedům. Poznání jejich kultury, obyvatel a společností nám v budoucnu umožní lépe spolupracovat." # todo: NEW TRANSLATION
 FIJ_focus_resource_securities_initiative: "Iniciativa bezpečnosti zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_resource_securities_initiative_desc: "RSI je specializovaná státní bezpečnostní a diplomatická instituce, která bude vyhledávat domácí i zahraniční zdroje pro rozvoj našeho národa a ve prospěch těch, kteří je poskytují." # todo: NEW TRANSLATION
 FIJ_focus_military_baseline_act: "Zákon o základní vojenské připravenosti" # todo: NEW TRANSLATION
 FIJ_focus_military_baseline_act_desc: "Naše cíle prosperity a investic do sebe i ostatních odhalují stále zřejmější realitu. Musíme proto vytvořit základní připravenost ozbrojených sil, aby náš národ i jeho partneři mohli cítit bezpečí, které si my malí zasloužíme před většími národy." # todo: NEW TRANSLATION
 FIJ_focus_independence_sustainment_act: "Zákon o udržení nezávislosti" # todo: NEW TRANSLATION
 FIJ_focus_independence_sustainment_act_desc: "Organizací našeho lidu do místních skupin a sjednocováním komunit jako samostatných jednotek i součástí širšího národního celku Fidži chceme vytvořit atmosféru vzdoru a sebeurčení. Čína i mnoho dalších větších a ochotnějších národů usilují o vlastní prospěch, proto musíme v těchto nejistých časech zůstat ostražití." # todo: NEW TRANSLATION
 FIJ_focus_modern_industrialism_act: "Zákon o moderním industrialismu" # todo: NEW TRANSLATION
 FIJ_focus_modern_industrialism_act_desc: "MIA je návrh zákona, který chce zjednodušit uspořádání výrobních odvětví a zvýšit jejich celkovou efektivitu. Tím zároveň zvýšíme životní standard, který si naši lidé budou moci užívat." # todo: NEW TRANSLATION
 FIJ_focus_food_of_tomorrow: "Potraviny zítřka" # todo: NEW TRANSLATION
 FIJ_focus_food_of_tomorrow_desc: "Náš ostrov je malý, a proto musíme získat více z menšího množství. Vyčleníme část obecného oddělení výzkumu a vývoje na zajištění základních životních potřeb našeho lidu." # todo: NEW TRANSLATION
 FIJ_focus_progressive_taxes_progressive_gains: "Progresivní daně pro progresivní společnost" # todo: NEW TRANSLATION
 FIJ_focus_progressive_taxes_progressive_gains_desc: "Touto daňovou reformou chceme lépe vyvážit zdanění podle příjmů. Díky vyrovnání daňových úrovní zabráníme tomu, aby někdo výrazně předstihl ostatní jen proto, že se údajně vytáhl vlastními silami. Novou rovnováhu příjmů využijeme ke zlepšení životní úrovně všech a k investicím do hospodářství, lidu i celého národa." # todo: NEW TRANSLATION
 FIJ_focus_united_fiji_installed: "Armáda dosadila umírněnou vládu Sjednocené fidžijské strany" # todo: NEW TRANSLATION
 FIJ_focus_united_fiji_installed_desc: "Vzhledem k tomu, že vláda odmítla vyhovět požadavkům armády, komodor Frank Bainimarama zahájil převrat a pokusil se dosadit umírněného představitele Sjednocené fidžijské strany. Většina považuje tuto novou vládu za armádou dosazené poslušné přisluhovače, někteří však doufají, že tím bude napravena vratká legislativní situace způsobená ústavní krizí." # todo: NEW TRANSLATION
 FIJ_focus_resetting_ethnic_legislations: "Obnovení etnické legislativy" # todo: NEW TRANSLATION
 FIJ_focus_resetting_ethnic_legislations_desc: "Omezením, nebo lépe řečeno obnovením zákonů a návrhů zákonů, které zdánlivě vychýlily etnickou rovnováhu, se můžeme pokusit vrátit je do neutrálnějšího stavu a zaujmout k dané situaci vyváženější přístup." # todo: NEW TRANSLATION
 FIJ_focus_slashing_biased_taxes: "Omezení zaujatých daní" # todo: NEW TRANSLATION
 FIJ_focus_slashing_biased_taxes_desc: "Vlády minulosti jednaly proti myšlence míru na našem ostrově. Jedním z hlavních problémů byl daňový systém a jeho četné skryté podmínky, které zvýhodňovaly určité etnické skupiny před jinými. Začneme je proto omezovat." # todo: NEW TRANSLATION
 FIJ_focus_jobs_initiative: "Iniciativa pracovních míst" # todo: NEW TRANSLATION
 FIJ_focus_jobs_initiative_desc: "Prostřednictvím rozsáhlého vládního výdajového balíčku investujeme do vytváření pracovních iniciativ. To pomůže zajistit práci každému, komu to bude možné, a nastavit nový standard rovnosti pro náš národ." # todo: NEW TRANSLATION
 FIJ_focus_fijian_resource_development_program: "Fidžijský program rozvoje zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_fijian_resource_development_program_desc: "FRDP povede rozvoj a těžbu zdrojů. Z tohoto programu se stane vládní ministerstvo, a proto bude vnímán spíše jako nástroj pro zvelebení národa než prospěch konkrétních skupin. Hlavní myšlenkou je, že území s cennými zdroji nyní získá do vlastnictví vláda a podniky budou mít na těžbě a zpracování těchto zdrojů společný podíl. Plánem je podporovat národní jednotu prostřednictvím rozvoje prosperity." # todo: NEW TRANSLATION
 FIJ_focus_health_not_wealth_act: "Zákon Zdraví, ne bohatství" # todo: NEW TRANSLATION
 FIJ_focus_health_not_wealth_act_desc: "Zákon HNW reformuje některé klíčové pracovní zákony, což nám umožní lépe vyvážit a učinit spravedlivější prostředí běžného člověka. Vytvořením nových pracovních standardů a vyrovnáním či úplným odstraněním zastaralých a nefunkčních regulací umožníme našim lidem pracovat chytřeji, budovat lépe a déle žít společně." # todo: NEW TRANSLATION
 FIJ_focus_fiji_more_than_just_water: "Fidži, více než jen voda" # todo: NEW TRANSLATION
 FIJ_focus_fiji_more_than_just_water_desc: "Náš ostrov má strašlivou historii, která je velmi patrná z našich činů i současného postavení našeho spravedlivého národa ve světě. S vědomím této skutečnosti musíme zjistit, co si cizinci o našem národu myslí, a pokusit se získat jejich přízeň i důvěru. Musíme ukázat, že se dokážeme změnit a že náš ostrov je více než jen reklama na vodu." # todo: NEW TRANSLATION
 FIJ_focus_researching_new_trades: "Výzkum nových oborů" # todo: NEW TRANSLATION
 FIJ_focus_researching_new_trades_desc: "Díky štědrým investicím do výzkumu a vývoje souvisejícího s obchodem se zbožím a službami, stejně jako s jejich získáváním, dosáhne náš národ nových, dosud nepředstavitelných výšin." # todo: NEW TRANSLATION
 FIJ_focus_unity_through_service: "Jednota prostřednictvím služby" # todo: NEW TRANSLATION
 FIJ_focus_unity_through_service_desc: "Armáda sehrála největší úlohu při udržování soudržnosti naší společnosti. Nakonec si musíme uvědomit, že právě síla vycházející z jednoty pohání tento národ kupředu. Po důkladných jednáních s vojenskými představiteli jsme proto vytvořili rozsáhlý plán lepších investic do armády a jejího personálu, který zároveň umožní lepší oddělení civilních a vojenských pravomocí. Další převrat v roce 2000 si nemůžeme dovolit." # todo: NEW TRANSLATION
 FIJ_focus_peace_for_piece: "Mír po kouskách" # todo: NEW TRANSLATION
 FIJ_focus_peace_for_piece_desc: "Mírem doma dosahujeme úspěchů v zahraničí. Nyní, když je na našem ostrově úroveň stability, jakou jsme léta nepoznali, je mnoho národů ochotnějších s námi obchodovat, navštěvovat nás a spolupracovat. To by nám mělo umožnit lépe hledět do budoucnosti a upevnit naše postavení v regionu." # todo: NEW TRANSLATION
 FIJ_focus_low_income_work_houses: "Pracovní domy pro nízkopříjmové obyvatele" # todo: NEW TRANSLATION
 FIJ_focus_low_income_work_houses_desc: "Vláda vytvoří bydlení pro osoby s nízkými příjmy. Tento specializovaný projekt nám pomůže dostat lidi z ulic do domovů a zaměstnání. Náklady budou sice vysoké, ale kvůli zajištění bezpečí, jistoty a prosperity bychom měli pochopit, jak vysoká je skutečná cena nečinnosti." # todo: NEW TRANSLATION
 FIJ_focus_funding_a_new_sector: "Financování nového odvětví" # todo: NEW TRANSLATION
 FIJ_focus_funding_a_new_sector_desc: "Díky novým geologickým průzkumům jsme určili dostatečně velkou oblast pro těžbu nekvalitní železné rudy. Tato domácí dodávka posílí diverzifikaci našeho hospodářství a pomůže přinést nové příležitosti." # todo: NEW TRANSLATION
 FIJ_focus_finding_homes_abroad: "Hledání domovů v zahraničí" # todo: NEW TRANSLATION
 FIJ_focus_finding_homes_abroad_desc: "Někteří z našich bezdomovců jsou překvapivě velmi zdvořilí a mají sociální dovednosti, které by mohly být využity ve prospěch národa. Přijmeme a zaměstnáme proto tyto schopné, nedoceněné členy naší společnosti a rozšíříme ministerstvo zahraničí. Díky jejich těžkým životním zkušenostem by mohli lépe oslovit obyčejné lidi v cizích národech. Tím světu ukážeme myšlenku Fidžijského snu." # todo: NEW TRANSLATION
 FIJ_focus_evaluating_military_requirements: "Vyhodnocení vojenských požadavků" # todo: NEW TRANSLATION
 FIJ_focus_evaluating_military_requirements_desc: "Technicky armáda nijak nepřispívá k hospodářství. Stejně tak ale nepřispívají ani lidé bez domova. Pokud bychom tedy uměle zvýšili konečný výsledek pouhou úpravou standardů a požadavků pro vstup do armády, mohli bychom snížit bezdomovectví, posílit národní obranu a zároveň zlepšit vedení i znalosti naší armády díky zkušenostem s většími jednotkami. Nakonec zvítězí všichni." # todo: NEW TRANSLATION
 FIJ_focus_reorganizing_homeless_shelters: "Reorganizace azylových domů" # todo: NEW TRANSLATION
 FIJ_focus_reorganizing_homeless_shelters_desc: "Stav některých našich sociálních programů je skutečně šokující. Musíme reorganizovat financování a strukturu těchto zařízení, aby byla efektivnější v počtu lidí, o které se dokážou pohodlně postarat." # todo: NEW TRANSLATION
 FIJ_focus_naval_primacy_expected: "Očekávaná námořní převaha" # todo: NEW TRANSLATION
 FIJ_focus_naval_primacy_expected_desc: "Náš národ je ostrovním státem. Pokud chceme mít skutečný vliv v oblasti našeho zájmu, musíme skutečně investovat do námořnictva." # todo: NEW TRANSLATION
 FIJ_focus_synthetics_centric_research: "Výzkum zaměřený na syntetické materiály" # todo: NEW TRANSLATION
 FIJ_focus_synthetics_centric_research_desc: "Náš ostrov má mnoho přírodních zdrojů, problémem však je, že v celosvětovém měřítku jsme značně nedostateční. S vědomím tohoto zásadního problému se můžeme zaměřit na budoucnost zdrojů. Průkopnickým vývojem syntetických technologií bychom mohli vytvořit vlastní omezenou formu autarkie, jakou svět dosud nepoznal. Je to jen malá poznámka pod čarou, pro nás je však hrdým vyjádřením našeho národa." # todo: NEW TRANSLATION
 FIJ_focus_streamlining_tax_code_expansions: "Zjednodušení rozšiřování daňového systému" # todo: NEW TRANSLATION
 FIJ_focus_streamlining_tax_code_expansions_desc: "Parlamentní návrh zákona T:101A zjednoduší postup i druhy daní, které lze uvalit na celý národ. Doufáme, že vytvořením známého standardu povzbudíme podniky i obyvatelstvo k rozvoji takovým způsobem, který sice může tyto daně obcházet, zároveň však nepřímo zvýší vybrané daně." # todo: NEW TRANSLATION
 FIJ_focus_building_tall: "Zákon o výškové výstavbě" # todo: NEW TRANSLATION
 FIJ_focus_building_tall_desc: "Vzhledem k omezenému prostoru a malé rozloze našeho národa musíme co nejlépe využít místo, které máme. S tímto vědomím hledáme nový a moderní základ, na který si naši lidé musí zvyknout. Automatizace je budoucností, ať se nám to líbí, nebo ne. Namísto pouhého nahrazování lidí však musíme lidi integrovat se stroji. Rozšíříme tak naši výrobní kapacitu a učiníme náš ostrov mnohem efektivnějším, než si většina dokáže představit." # todo: NEW TRANSLATION
 FIJ_focus_promoting_a_frugal_lifestyle: "Podpora skromného životního stylu" # todo: NEW TRANSLATION
 FIJ_focus_promoting_a_frugal_lifestyle_desc: "Náš prostor je omezený a možností rozvoje ostrova máme jen málo. Pokud si chceme zachovat pověst ostrovní turistické destinace, musíme skutečně dbát na zachování přirozené krásy naší země. Naši lidé proto musí pochopit, že si mají užívat života takového, jaký je, a hledat dobro v tom, co mají, místo neustálých obav z toho, co by údajně mohli mít. Materialismus přenechme Američanům, takto Fidžijci žít nebudou." # todo: NEW TRANSLATION
 FIJ_focus_exploiting_corporatism: "Využití korporativismu" # todo: NEW TRANSLATION
 FIJ_focus_exploiting_corporatism_desc: "V našem národě působí mnoho domácích i zahraničních podniků, které vytvářejí značnou část HDP. Lidská přirozenost však ukazuje, že touží po moci a penězích. Můžeme toho využít tím, že se s nimi sblížíme a budeme údajně přijímat úplatky, ve skutečnosti však tyto peníze využijeme jako válečnou pokladnu. Budeme financovat programy, kterým mimo rozpočtová jednání trochu chybí, udržovat mír během případných hospodářských poklesů a dělat cokoli dalšího, co bude možné. Pravděpodobně na to přijdou, ale užívejme si toho, dokud můžeme." # todo: NEW TRANSLATION
 FIJ_focus_neutral_selectivism: "Neutrální selektivismus" # todo: NEW TRANSLATION
 FIJ_focus_neutral_selectivism_desc: "Velcí hráči Tichomoří, Spojené státy americké a Čínská lidová republika, se nakonec střetnou až příliš tvrdě. Musíme být zdvořilí, ale neměli bychom vyhledávat jejich přízeň. Spojené státy budou pravděpodobně více investovat, my však musíme tyto investice využít způsobem, který přiměje Čínu nabídnout ještě více. Nechme velmoci soupeřit, zatímco budou nepřímo budovat menšího hráče." # todo: NEW TRANSLATION
 FIJ_focus_innovations_sector: "Rozvoj inovačního odvětví" # todo: NEW TRANSLATION
 FIJ_focus_innovations_sector_desc: "Vzhledem k nedostatku surovin se musíme zapojit do jiných trhů, které odpovídají měnícímu se světu. Naše technologické začínající podniky položí základy pro vstup do technologických odvětví a umožní nám prodávat cenný software i další produkty tomu, kdo nabídne nejvíce." # todo: NEW TRANSLATION
 FIJ_focus_employment_commission: "Komise pro zaměstnanost" # todo: NEW TRANSLATION
 FIJ_focus_employment_commission_desc: "Návrh zákona 5436, známý také jako zákon o zaměstnání pro všechny, zavede ministerstvo práce. Komise pro zaměstnanost bude vyhledávat vládou financované iniciativy, v nichž lze přímo financovat a podporovat pracovní místa, aby každý nezaměstnaný měl skutečnou příležitost pracovat. Náklady budou zpočátku vyšší, postupně je však vyváží nové daňové příjmy a výnosy z nově vzniklých podniků." # todo: NEW TRANSLATION
 FIJ_focus_limited_fijian_naval_expansion: "Omezené rozšíření fidžijského námořnictva" # todo: NEW TRANSLATION
 FIJ_focus_limited_fijian_naval_expansion_desc: "Náš obchod i naše vody musí být chráněny. Několik hlídkových člunů rozhodně nestačí k zajištění skutečné obrany. Musíme vytvořit skutečné, byť omezené a obranně zaměřené rozšíření námořnictva, abychom zajistili bezpečnost našeho ostrova. Personál i vybavení musí být standardizovány a zdokonaleny na základě zkušeností z domácích i zahraničních misí, kterých jsme se účastnili." # todo: NEW TRANSLATION
 FIJ_focus_education_budget_expansion: "Navýšení rozpočtu na školství" # todo: NEW TRANSLATION
 FIJ_focus_education_budget_expansion_desc: "Navýšením rozpočtu na školství můžeme zlepšit porozumění našich lidí širšímu světu kolem nás a přinést nové příležitosti dalším generacím." # todo: NEW TRANSLATION
 FIJ_focus_balancing_budgets: "Vyrovnání rozpočtů" # todo: NEW TRANSLATION
 FIJ_focus_balancing_budgets_desc: "Viděli jsme, jak se náš národ rozvíjí a snaží, zároveň jsme však zaznamenali trend v oblasti rozpočtů. Pokud máme být skutečným vzorem růstu, musíme být při sestavování rozpočtu flexibilní a chápat, že můžeme vyrovnávat nadbytky i nedostatky tam, kde se objeví." # todo: NEW TRANSLATION
 FIJ_focus_industrial_expansion: "Průmyslová expanze" # todo: NEW TRANSLATION
 FIJ_focus_industrial_expansion_desc: "Naše nezaměstnanost je rekordně nízká a co je nejlepší, nízká je také míra emigrace. Musíme podpořit průmyslovou expanzi a pokračovat v tomto požehnaném trendu dějin našeho národa." # todo: NEW TRANSLATION
 FIJ_focus_revitalization_of_foreign_perception: "Obnova zahraničního obrazu" # todo: NEW TRANSLATION
 FIJ_focus_revitalization_of_foreign_perception_desc: "Náš národ pokročil k lepšímu obrazu nejen mezi vlastními obyvateli, ale i v očích širšího světa kolem nás. Skutečně si užijme tento nový věk našeho malebného ostrovního ráje." # todo: NEW TRANSLATION
 FIJ_focus_extracting_the_future: "Těžba budoucnosti" # todo: NEW TRANSLATION
 FIJ_focus_extracting_the_future_desc: "Nové technologie geologického průzkumu, těžby a zpracování nám umožnily rozšířit znalosti o dostupných zdrojích, které můžeme skutečně vytěžit. Ačkoli někteří nejsou z rozšiřování těžby nadšeni, jde přesto o klíčovou součást, která rozšiřuje a udržuje náš hospodářský rozvoj stabilní a vyrovnaný." # todo: NEW TRANSLATION
 FIJ_focus_wealthcare_act: "Zákon o péči o blahobyt" # todo: NEW TRANSLATION
 FIJ_focus_wealthcare_act_desc: "S rychlým růstem bohatství v našem národě je správné, aby naši lidé měli nárok na péči a přístup ke zdravotním i důchodovým výhodám, které mají národy téměř stokrát větší než my. Investicemi a zajištěním vybavení i personálu vytvoříme péči, o kterou náš národ usiluje už téměř desetiletí." # todo: NEW TRANSLATION
 FIJ_focus_military_radicals_force_a_junta: "Vojenské radikály dosadily juntu" # todo: NEW TRANSLATION
 FIJ_focus_military_radicals_force_a_junta_desc: "Kvůli masivnímu vnitřnímu tlaku byl komodor nucen dosadit juntu. Národ zachvátil neklid, nacionalisté se však společně s armádou semkli, aby obnovili pořádek." # todo: NEW TRANSLATION
 FIJ_focus_martial_law_window: "Časový limit stanného práva" # todo: NEW TRANSLATION
 FIJ_focus_martial_law_window_desc: "Obnovíme v zemi pořádek a zároveň se zavážeme ke stabilizaci národa, zatímco budeme vyhodnocovat naši situaci. Toto stanné právo na určitou dobu zakáže cestování do zahraničních národů i z nich kvůli stále se zhoršujícímu problému emigrace. Mnohým se to nebude líbit, ale musíme to vydržet." # todo: NEW TRANSLATION
 FIJ_focus_merging_police_forces: "Sloučení policejních sil" # todo: NEW TRANSLATION
 FIJ_focus_merging_police_forces_desc: "Rozlišování mezi vojenskou a civilní policií plýtvá zdroji a zdvojuje velení. Obě síly proto začleníme, podřídíme je vojenské struktuře a zajistíme jejich jednotný cíl: ochranu našeho národa a jeho obyvatel v dobách nepořádku a bezpráví." # todo: NEW TRANSLATION
 FIJ_focus_militarized_politics: "Militarizovaná politika" # todo: NEW TRANSLATION
 FIJ_focus_militarized_politics_desc: "Vládní struktura je dobrou organizací. S trochou úprav a militarizací celého aparátu můžeme tento národ proměnit v dobře promazaný stroj. Koneckonců, čím jiným je parlament než civilní verzí porady generálního štábu či plánovací místnosti?" # todo: NEW TRANSLATION
 FIJ_focus_weathering_the_political_storm: "Přečkání politické bouře" # todo: NEW TRANSLATION
 FIJ_focus_weathering_the_political_storm_desc: "Ještě nejsme zcela mimo nebezpečí, přesto však musíme zmírnit naši nadměrnou kontrolu. Svět je již hluboce proti nám kvůli autoritářství, které jako vojenská junta představujeme. Zrušíme proto zákaz cestování i stanné právo a zároveň schválíme první oficiální reformu po povstaleckém chaosu, zákon o omezené péči. Tento zákon sníží náklady a přímé překážky, které v současnosti ochromují naše zdravotnictví. Doufejme, že toto gesto přitáhne pozitivní pozornost." # todo: NEW TRANSLATION
 FIJ_focus_transparency_in_requirements: "Zákon o transparentních požadavcích" # todo: NEW TRANSLATION
 FIJ_focus_transparency_in_requirements_desc: "TRA představuje rozsáhlou reformu transparentnosti při tvorbě pravidel a požadavků v civilních i vojenských zákonech. To zahrnuje také transparentnost požadavků na získání zaměstnání v civilní společnosti i na povýšení a odpovědnosti ve vojenské společnosti." # todo: NEW TRANSLATION
 FIJ_focus_fijian_service_means_fijian_respect: "Fidžijská služba, fidžijská úcta" # todo: NEW TRANSLATION
 FIJ_focus_fijian_service_means_fijian_respect_desc: "Aktualizace kodexu chování a přímé pokyny omezí staré křivdy. Zvýšením trestů a demonstrací nejen na papíře, ale i v praxi ukážeme, že ti, kteří slouží Fidži, jsou samotným Fidži. Podporou tohoto rodinného pouta chceme sjednotit naše lidi a odhodit vlivy starého světa." # todo: NEW TRANSLATION
 FIJ_focus_constitutional_safeguard: "Ústavní ochrana" # todo: NEW TRANSLATION
 FIJ_focus_constitutional_safeguard_desc: "Naši lidé systému nedůvěřují, a právě tento systém jim musíme pomoci přijmout. Přijmeme proto dodatek, který stanoví, že nespravedlivé zacházení s fidžijskými občany jako celkem, bez ohledu na jejich etnický původ, je národním zločinem. Tímto výnosem doufáme, že zacelíme desetiletí svárů, které tento národ rozervaly." # todo: NEW TRANSLATION
 FIJ_focus_foreign_advisors: "Rada zahraničních poradců" # todo: NEW TRANSLATION
 FIJ_focus_foreign_advisors_desc: "Zdá se, že svět stojí proti nám, proto musíme upřímně ukázat, že chceme jednat v zájmu vlastních obyvatel i ve vzájemný prospěch všech kolem nás. S rozsáhlou civilní a vojenskou poradní radou, která nám pomůže obnovit náš národ, můžeme hledat nové cesty růstu pro náš spravedlivý ostrovní stát." # todo: NEW TRANSLATION
 FIJ_focus_building_upon_our_civilian_base: "Budování na civilních základech" # todo: NEW TRANSLATION
 FIJ_focus_building_upon_our_civilian_base_desc: "Hospodářství je v porovnání s naším obyvatelstvem malé, nemluvě o celé řadě problémů, které z této slabé ekonomiky vyplývají. Cílené investice do rozšíření průmyslové základny nám proto umožní zaměstnat lidi pro národ, jeho cíle i jeden pro druhého." # todo: NEW TRANSLATION
 FIJ_focus_starting_domestic_arms_companies: "Zakládání domácích zbrojovek" # todo: NEW TRANSLATION
 FIJ_focus_starting_domestic_arms_companies_desc: "Fidžijská armáda není známá prakticky ničím, když se nad tím zamyslím. To musíme změnit, a nejlepším začátkem bude založení domácích zbrojovek, které vytvoří jedinečnou identitu fidžijské armády. Možná se nikdy nevyrovnáme Americe, Německu a dalším, rozhodně se však můžeme zviditelnit v regionu, kde žijeme." # todo: NEW TRANSLATION
 FIJ_focus_bringing_jobs_back_to_fiji: "Návrat lidí a pracovních míst na Fidži" # todo: NEW TRANSLATION
 FIJ_focus_bringing_jobs_back_to_fiji_desc: "Naši lidé stále opouštějí náš národ, ať už kvůli studiu, práci či něčemu jinému. Stále trpíme emigrací, která naši zemi sužuje. Musíme proto cíleněji a přesněji investovat do problémů, které tento odliv způsobují." # todo: NEW TRANSLATION
 FIJ_focus_establishing_the_university_of_fiji: "Založení Fidžijské univerzity" # todo: NEW TRANSLATION
 FIJ_focus_establishing_the_university_of_fiji_desc: "Vzdělání… tento základní pilíř společnosti musí být jedním z našich hlavních zájmů, když uvažujeme o budoucnosti národa a jeho obyvatel. Tento pilíř má civilní i vojenské využití, které bude následně uplatněno v nejvyšší možné míře." # todo: NEW TRANSLATION
 FIJ_focus_fijian_care_act: "Zákon o fidžijské národní péči" # todo: NEW TRANSLATION
 FIJ_focus_fijian_care_act_desc: "FNCA je program, který má znovu investovat do programů ovlivňujících život naší populace. Navzdory veškerému emocionálnímu zápalu politického divadla způsobují starší lidé více problémů, než si vůbec chtějí připustit. Pokud je proto dokážeme udržet v klidu pohodlným životem po odchodu do důchodu a podobnými opatřeními, budeme moci lépe vyhodnotit potřeby aktivní populace." # todo: NEW TRANSLATION
 FIJ_focus_increase_funding_for_the_fcoe: "Navýšení financování FCoE" # todo: NEW TRANSLATION
 FIJ_focus_increase_funding_for_the_fcoe_desc: "Základem propojení naší civilní a vojenské sféry je Fidžijský ženijní sbor. Musíme zvýšit jeho financování, aby se tato složka mohla rozšířit a lépe sloužit vojenským i civilním účelům." # todo: NEW TRANSLATION
 FIJ_focus_deboning_healthcare_excesses: "Odstranění přebytků ve zdravotnictví" # todo: NEW TRANSLATION
 FIJ_focus_deboning_healthcare_excesses_desc: "Kdo by si pomyslel, že programy ponechané po desetiletí bez kontroly a dohledu kvůli politickému chaosu a neustálým změnám vlád budou sužovány korupcí a ztrátami peněz? Je zapotřebí úplně přepracovat a prakticky znovu vybudovat naši zdravotní síť. Vytvoříme tím čistý základ, který napraví změny, jimž nyní čelíme, i skutečnost, že náš národ kráčí po cestě obnovy sám." # todo: NEW TRANSLATION
 FIJ_focus_national_rotc_curriculum: "Národní program ROTC" # todo: NEW TRANSLATION
 FIJ_focus_national_rotc_curriculum_desc: "Na místech, jako jsou Spojené státy, mají některé školy program vedený vojenskou složkou, v němž se studenti učí lekcím vedení využitelným v civilním světě prostřednictvím vojensky organizované struktury. To je budoucnost a hlavní prvek, který náš školský systém potřebuje. Od začátku druhého stupně základních škol budou všechny školy následovat tento model a studenti národa budou ve svých ročnících organizováni do takzvaných jednotek. Podporou znalostí komunity, vedení a inovací prostřednictvím týmové práce chceme vytvořit budoucnost, které naše mládež skutečně porozumí a na kterou bude připravena." # todo: NEW TRANSLATION
 FIJ_focus_barracks_housing_initiative: "Iniciativa kasárenského bydlení" # todo: NEW TRANSLATION
 FIJ_focus_barracks_housing_initiative_desc: "Zákon BHI nabídne nový způsob řešení nedostatku bydlení v národě. Lidé bez domova se budou moci ubytovat v kasárenských obytných jednotkách s dalšími lidmi v podobné situaci. V takovém prostředí se díky pracovnímu programu a vojenskému režimu postaví znovu na vlastní nohy a znovu získají iniciativu, o níž se domnívají, že ji v nich systém potlačil. Prostřednictvím tohoto programu podobného základnímu výcviku si budou zvyšovat příjem, dokud nezískají práci mimo program a domov mimo areál kasáren." # todo: NEW TRANSLATION
 FIJ_focus_resource_extractions_act: "Zákon o těžbě zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_resource_extractions_act_desc: "REA upřednostní při hledání zaměstnání lidi bez domova a osoby v trestním systému, aby si mohli vydělávat na živobytí a zároveň přispívat k rozvoji národa. Tímto zákonem chceme lépe poznat a rozšířit domácí zdroje, které můžeme využívat." # todo: NEW TRANSLATION
 FIJ_focus_expand_the_fcoe: "Rozšíření Fidžijského ženijního sboru" # todo: NEW TRANSLATION
 FIJ_focus_expand_the_fcoe_desc: "S rostoucí potřebou nové infrastruktury, bydlení a rozvoje hospodářství jako celku musíme rozšířit základní kámen našeho mostu. Tímto kamenem je Fidžijský ženijní sbor neboli FCoE. Rozšíření umožní rychlejší a komplexnější přístup k rozvoji, protože do vojenské podřízené složky začnou proudit další zdroje a pracovní síla." # todo: NEW TRANSLATION
 FIJ_focus_tax_rebalancing_act: "Zákon o vyvážení daní" # todo: NEW TRANSLATION
 FIJ_focus_tax_rebalancing_act_desc: "Vojenský parlament schválil zákon o vyvážení daní, v jehož rámci bude jednotlivě přezkoumán obecný přehled současného daňového systému. To nám umožní napravit nesmyslné daně uvalené na ty, kteří přišli o domov." # todo: NEW TRANSLATION
 FIJ_focus_expanding_the_ministry_of_science: "Rozšíření ministerstva vědy" # todo: NEW TRANSLATION
 FIJ_focus_expanding_the_ministry_of_science_desc: "Náš národ zaostává za světem nejen proto, že naše země je malá, ale také proto, že skutečně neinovujeme. Vyhledávali jsme zahraniční pomoc prostřednictvím Rady zahraničních poradců. To však nyní skončí. Ukážeme světu, že se dokážeme někam dostat, a výrazně investujeme do ministerstva vědy i do celkových schopností našeho národa v oblasti výzkumu a vývoje technologií." # todo: NEW TRANSLATION
 FIJ_focus_soldiers_lifestyle_act: "Zákon o životním stylu vojáků" # todo: NEW TRANSLATION
 FIJ_focus_soldiers_lifestyle_act_desc: "Parlament uznal za vhodné přijmout výnos, který stanoví skutečný základní standard životního stylu. Tímto základem bude životní úroveň průměrného vojáka našich ozbrojených sil. Vytvoří to národní a generační představu o tom, co si naši lidé mohou užívat na úkor toho, co si někteří dovolit nemohou." # todo: NEW TRANSLATION
 FIJ_focus_the_citizen_soldiers_act: "Zákon o občanech-vojácích" # todo: NEW TRANSLATION
 FIJ_focus_the_citizen_soldiers_act_desc: "Parlament schválil zákon o občanech-vojácích, ústavní dodatek, podle nějž je každý občan vojákem národa a každý voják občanem národa. Tento dodatek v podstatě prohlašuje, že ti, kteří slouží Fidži, jsou sami Fidžijci, čímž jednoznačně odmítá myšlenku, že být Fidžijcem znamená rasu či etnickou příslušnost založenou na pseudovědě a podobném nesmyslu. Být Fidžijcem znamená oddanost národu a jeho idejím." # todo: NEW TRANSLATION
 FIJ_focus_energizing_the_nation: "Energetizace národa" # todo: NEW TRANSLATION
 FIJ_focus_energizing_the_nation_desc: "Abychom mohli řádně vyvážit vojenské i civilní potřeby, budeme muset rozšířit naši energetickou síť. Stabilní rozvodná síť a dodávky paliva budou důkazem stability a prozíravosti na naší cestě vpřed." # todo: NEW TRANSLATION
 FIJ_focus_naval_industrialism: "Námořní industrialismus" # todo: NEW TRANSLATION
 FIJ_focus_naval_industrialism_desc: "Jsme ostrovní národ, takže je přirozené zaměřit vojenskou část naší výroby na námořní plavidla. Jak jinak bychom mohli zaujmout zahraniční mocnosti, jako jsou Amerika, Austrálie a další, kdybychom se ukázali být jen poněkud okázalou vojenskou základnou?" # todo: NEW TRANSLATION
 FIJ_focus_energy_diversity_act: "Zákon o energetické rozmanitosti" # todo: NEW TRANSLATION
 FIJ_focus_energy_diversity_act_desc: "EDA nařídí rozmanitost naší energetické sítě, aby byl náš národ lépe chráněn před zahraničními vykořisťovateli. Vložit všechna vejce do jediného energetického košíku by v případě jakéhokoli útoku na náš národ znamenalo okamžitý chaos." # todo: NEW TRANSLATION
 FIJ_focus_mining_the_future: "Těžba budoucnosti" # todo: NEW TRANSLATION
 FIJ_focus_mining_the_future_desc: "Víme, že máme vlastní zdroje. Měli bychom je využít ke zlepšení našeho národa a zabránit vnějším zásahům do základních hospodářských potřeb." # todo: NEW TRANSLATION
 FIJ_focus_naval_priorities: "Námořní priority" # todo: NEW TRANSLATION
 FIJ_focus_naval_priorities_desc: "Ačkoli chceme vyvážený nábor do armády, víme také, že jsme doslova ostrov. Navýšení financování proto zvýhodní námořnictvo před ostatními složkami, ne však příliš, protože nepotřebujeme nezdravé mezisložkové konflikty." # todo: NEW TRANSLATION
 FIJ_focus_civilian_air_training: "Civilní letecký výcvik" # todo: NEW TRANSLATION
 FIJ_focus_civilian_air_training_desc: "Takže… víme, že s letectvem máme poměrně pohnutou historii. Nemůžeme však dovolit minulosti, aby určovala naši současnou situaci, natož budoucí směřování. Využijeme proto civilní výcvikové programy a letadla jako způsob, jak položit základy našeho letectva. Bude to pomalý proces, ale pokud máme přežít v moderní době, potřebujeme jej." # todo: NEW TRANSLATION
 FIJ_focus_prussia_of_the_pacific: "Pacifické Prusko" # todo: NEW TRANSLATION
 FIJ_focus_prussia_of_the_pacific_desc: "Náš stát je moderním ztělesněním pruského národa. Tvarování a spojení civilního a vojenského způsobu života do jednoho soudržného stroje přineslo Fidži nový věk. Jsme malí, ale hrdí, stavíme do výšky a mluvíme nahlas, jsme regionální mocností a necháme svůj hlas zaznít stejně jako každý jiný národ." # todo: NEW TRANSLATION
 FIJ_focus_monarchist_acendence: "Monarchistický vzestup" # todo: NEW TRANSLATION
 FIJ_focus_monarchist_acendence_desc: "Vnitřní boje v armádě nás přivedly na spravedlivou cestu našeho národa. Bratři a sestry Fidži, stojíme sjednoceni pod Bohem a pod praporem Fidži. Jsme pány svého osudu, demokracie se ukázala být příliš nestabilní, aby vydržela. Musíme proto dosáhnout kompromisu a vytvořit novou společnost: nacionalistickou, vojensky silnou a takovou, v níž být Fidžijcem znamená více než pouhou etnicitu." # todo: NEW TRANSLATION
 FIJ_focus_the_kingdoms_quarrels: "Spory království" # todo: NEW TRANSLATION
 FIJ_focus_the_kingdoms_quarrels_desc: "Politická situace je přinejlepším nejistá a v nejhorším absurdně rozvrácená. Musíme sestavit vládu, formalizovat státní správu a vyhodnotit největší problémy našeho národa." # todo: NEW TRANSLATION
 FIJ_focus_the_kingdoms_economy: "Hospodářství království" # todo: NEW TRANSLATION
 FIJ_focus_the_kingdoms_economy_desc: "Pokud se máme v tomto světě někam dostat, potřebujeme skutečné hospodářství. Hlavním bodem je rozmanitost, podpůrným bodem pak mít pro toto hospodářství správné lidi. Celkově se však musíme poohlédnout po možnostech, chceme-li něčeho dosáhnout." # todo: NEW TRANSLATION
 FIJ_focus_the_ethnic_divides: "Etnické rozdělení" # todo: NEW TRANSLATION
 FIJ_focus_the_ethnic_divides_desc: "Etnické rozdělení národa sahá až do počátků anglického kolonialismu. Mnoho koloniálních poddaných z Indie bylo přivezeno na Fidži, aby pracovali na cukrových plantážích a v cukrovarnických společnostech, které plnily anglické pokladny. Toto rozdělení a vynucená migrace jsou od naší nezávislosti v 70. letech velmi napjaté. Řešení tohoto problému proto musí patřit mezi naše největší priority, pokud si skutečně chceme udržet moc." # todo: NEW TRANSLATION
 FIJ_focus_police_standards_act: "Zákon o policejních standardech" # todo: NEW TRANSLATION
 FIJ_focus_police_standards_act_desc: "Parlament schválil návrh zákona, který přetvoří standardy fidžijských policejních sil. Všechny kodexy chování budou upraveny a přeformulovány tak, aby zdůrazňovaly, že bez ohledu na situaci musí být veškeré kroky spravedlivě posuzovány podle okolností. K žádným agresivním činům proti civilistům či občanům Fidži nesmí dojít, pokud právě neprobíhá ohrožení osoby nebo majetku. Tyto kroky uvedou věci do pohybu správným směrem." # todo: NEW TRANSLATION
 FIJ_focus_sponsored_emigration_deals: "Dohody o podporované emigraci" # todo: NEW TRANSLATION
 FIJ_focus_sponsored_emigration_deals_desc: "Z krátkodobého hlediska to bude nákladné, z dlouhodobého však do národa přinese stabilitu mnohem rychleji… i kdyby to mělo být neortodoxními prostředky. Uzavřením dohod o podporované emigraci s etnickými Indy bychom mohli zmenšit a nepřímo homogenizovat náš národ a spolupracovat s těmi, kteří skutečně chtějí zůstat. Každý má svou cenu, ale každý má také možnost volby." # todo: NEW TRANSLATION
 FIJ_focus_hiring_practices_act: "Zákon o pracovních postupech" # todo: NEW TRANSLATION
 FIJ_focus_hiring_practices_act_desc: "Byl schválen návrh zákona, který standardizuje používanou terminologii a znovu potvrzuje antidiskriminační zákony. Zdá se, že to málo, co jsme měli, obsahovalo značné množství mezer. Narovnání podmínek proto zastaví vykořisťování a diskriminaci všech občanů našeho spravedlivého národa." # todo: NEW TRANSLATION
 FIJ_focus_equal_standard_care_act: "Zákon o rovném standardu péče" # todo: NEW TRANSLATION
 FIJ_focus_equal_standard_care_act_desc: "ESCA představuje právní minimum, podle nějž musí mít všechny formy péče, ať už zdravotní či sociální, veřejné či soukromé, stejný základní standard. Musíme zajistit, aby se občanům tohoto národa dostalo péče bez ohledu na to, kdo je nemocný, kdo odešel do důchodu či jakého je etnického původu." # todo: NEW TRANSLATION
 FIJ_focus_redrafting_the_constitution: "Přepracování ústavy" # todo: NEW TRANSLATION
 FIJ_focus_redrafting_the_constitution_desc: "Je tomu již dlouho, co došlo ke skutečnému přepracování ústavy. S tímto vědomím musíme stanovit vládní strukturu, která bude vládnout, a položit základy rovnosti a společenských svobod, na nichž bude náš národ stavět. Jinak se později sami zhroutíme." # todo: NEW TRANSLATION
 FIJ_focus_addressing_the_brain_drain: "Řešení odlivu mozků" # todo: NEW TRANSLATION
 FIJ_focus_addressing_the_brain_drain_desc: "Náš národ se v této chvíli oslabuje už jen svou samotnou existencí. Naši lidé odcházejí za lepšími příležitostmi a lepším životem. Pokud chceme náš národ rozvíjet, musíme investovat do něj i do jeho obyvatel a pečovat o ně." # todo: NEW TRANSLATION
 FIJ_focus_establishing_the_reseach_and_development_ministry: "Založení ministerstva výzkumu a vývoje" # todo: NEW TRANSLATION
 FIJ_focus_establishing_the_reseach_and_development_ministry_desc: "Vytvoření a formalizace ministerstva výzkumu a vývoje, zkráceně ministerstva výzkumu, se stane základním pilířem naší společnosti. Vytvořením ústředního orgánu pro vzdělávání a inovace našeho národa budeme moci lépe organizovat, financovat a samozřejmě i inovovat." # todo: NEW TRANSLATION
 FIJ_focus_employment_assistance_programs: "Programy podpory zaměstnanosti" # todo: NEW TRANSLATION
 FIJ_focus_employment_assistance_programs_desc: "Nezaměstnanost v našem národě a obava ze stagnace v životě kvůli nepříznivému vývoji mohou být silnou motivací k odchodu. Musíme proto vytvořit řadu preventivních programů, které občanům dočasně pomohou přejít do nového zaměstnání. Může jít o malý příspěvek na měsíc, kdy nestihnou zaplatit účty, nebo pracovní nástěnky pro rychlejší hledání zaměstnání. Taková opatření usnadní přechod mezi zaměstnaností a nezaměstnaností, aniž by lidé měli pocit, že se jejich život zastavil." # todo: NEW TRANSLATION
 FIJ_focus_specializing_medical_research: "Specializovaný lékařský výzkum" # todo: NEW TRANSLATION
 FIJ_focus_specializing_medical_research_desc: "Našich lidí není mnoho, a proto je každý život v tomto národě poměrně mnohem cennější. Musíme zajistit, aby významná část našeho výzkumu a vývoje směřovala k průkopnickým technologiím v celém lékařském oboru. Ano, bude nás to stát peníze, ale pokud chceme naplno využít potenciál našeho obyvatelstva, musí být o naše lidi nejlépe postaráno." # todo: NEW TRANSLATION
 FIJ_focus_expanding_education_funding: "Rozšíření financování školství" # todo: NEW TRANSLATION
 FIJ_focus_expanding_education_funding_desc: "Rozšířením obecných investic do vzdělávacího systému našeho národa vytvoříme nové generace chytřejších občanů. Získané znalosti následně využijí při rozvoji našeho národa a jeho budoucnosti." # todo: NEW TRANSLATION
 FIJ_focus_creating_the_research_institute_of_fiji: "Založení Fidžijského výzkumného ústavu" # todo: NEW TRANSLATION
 FIJ_focus_creating_the_research_institute_of_fiji_desc: "RIF bude chloubou vědeckého rozvoje v Tichém oceánu. Naše investice a oddanost inovacím přimějí naše lidi chtít zůstat a zlepšovat nejen sebe, ale i náš národ jako celek. Tuto instituci můžeme využít také jako nástroj měkké síly při rozvoji armády a prosazování národní moci." # todo: NEW TRANSLATION
 FIJ_focus_reviewing_the_housing_crisis: "Přezkoumání bytové krize" # todo: NEW TRANSLATION
 FIJ_focus_reviewing_the_housing_crisis_desc: "V rozvinutém západním světě znamená bytová krize zhroucení trhu s nemovitostmi. V našem případě však vychází z rostoucího problému bezdomovectví. Navzdory malému počtu obyvatel je naše situace s bezdomovectvím srovnatelná s některými africkými národy. Pochopení této děsivé reality nám umožní rozhodně napravit tento rostoucí problém a snad zabránit tomu, aby se podobná lavina někdy opakovala – nebo alespoň v takovém měřítku." # todo: NEW TRANSLATION
 FIJ_focus_increased_homeless_shelter_funding: "Navýšení financování azylových domů" # todo: NEW TRANSLATION
 FIJ_focus_increased_homeless_shelter_funding_desc: "Naše současné programy pro bezdomovce nedostávají dostatek prostředků, aby se mohly řádně postarat o potřebné. Přímými investicemi do navýšení financování lépe zajistíme kvalitu péče, kterou tito občané získají v době nouze, dokud se znovu nepostaví na vlastní nohy." # todo: NEW TRANSLATION
 FIJ_focus_royal_engineers_program: "Program královských ženistů" # todo: NEW TRANSLATION
 FIJ_focus_royal_engineers_program_desc: "REP umožní vytvořit civilní pracovní trh v rámci armádního ženijního sboru. Toto civilní křídlo sboru bude využíváno pro veřejné práce, vládou podporované stavební projekty a podobné činnosti. Myšlenkou je nabídnout základní práci člověku, který je nezaměstnaný a hrozí mu ztráta domova, a tím i celého živobytí. Vytvoříme pevnou půdu, na níž mohou naši občané stát, aniž by se báli pádu do hlubin, z nichž se možná nikdy nevrátí." # todo: NEW TRANSLATION
 FIJ_focus_young_business_leaders_program: "Program mladých podnikatelů" # todo: NEW TRANSLATION
 FIJ_focus_young_business_leaders_program_desc: "Program YBL je vládní iniciativa, jejímž cílem je inspirovat a pomáhat novým i budoucím podnikatelským představitelům. Každý má schopnost vlastnit a provozovat podnik, ti, kteří o to skutečně stojí, tak mohou učinit prostřednictvím programu YBL. Výukou podnikatelských dovedností a poskytováním bezúročných půjček, které se následně splácejí, vytvoříme pozitivní prostředí pro formování budoucích pilířů našeho hospodářství." # todo: NEW TRANSLATION
 FIJ_focus_resource_development_initiative: "Iniciativa rozvoje zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_resource_development_initiative_desc: "RDI je vládní iniciativa zaměřená na diverzifikaci domácích zdrojů v hospodářství. Víme, že vzhledem k tomu, že jsme doslova ostrov, máme omezené možnosti. To však neznamená, že nemáme nic cenného. Naopak, máme pestrou směs rud a minerálů, která nám umožňuje vytvořit dobře diverzifikované hospodářství. Pokud si však chceme udržet výhodu, potřebujeme více domácích zdrojů." # todo: NEW TRANSLATION
 FIJ_focus_new_economic_planning_board: "Nová rada pro hospodářské plánování" # todo: NEW TRANSLATION
 FIJ_focus_new_economic_planning_board_desc: "EPB pomůže městským plánovačům i zahraničním a domácím investorům vytvořit nové a stále se rozšiřující hospodářství. Přilákáme tak nový kapitál a získáme omezenou formu měkké síly podporou zahraničních společností a vývozem našich výrobků." # todo: NEW TRANSLATION
 FIJ_focus_ensuring_a_steeling_future: "Zajištění ocelové budoucnosti" # todo: NEW TRANSLATION
 FIJ_focus_ensuring_a_steeling_future_desc: "Rozvoj a zajištění dostatečné domácí produkce oceli nám umožní v podstatě fungovat. Ocel je jedním z hlavních zdrojů a materiálů, které tvoří moderní svět, v němž žijeme. Zajištění domácích dodávek nám proto umožní zachovat si určitou míru hospodářské nezávislosti." # todo: NEW TRANSLATION
 FIJ_focus_phase_one_business_development: "Rozvoj podnikání, fáze 1" # todo: NEW TRANSLATION
 FIJ_focus_phase_one_business_development_desc: "První výsledky obnovy našeho hospodářství se začínají projevovat, a tak si brzy budeme moci užívat prosperity." # todo: NEW TRANSLATION
 FIJ_focus_oiling_our_nation: "Promazání našeho národa" # todo: NEW TRANSLATION
 FIJ_focus_oiling_our_nation_desc: "Díky rozsáhlým průzkumům a výzkumu jsme mohli zaměřit náš plán na zajištění domácích dodávek ropy. Jakožto základní kámen moderní doby zabezpečíme naši budoucnost, energetické potřeby i petrochemický průmysl." # todo: NEW TRANSLATION
 FIJ_focus_diversifying_the_naval_industries: "Diverzifikace námořního průmyslu" # todo: NEW TRANSLATION
 FIJ_focus_diversifying_the_naval_industries_desc: "Máme silný loďařský průmysl, musíme jej však diverzifikovat a umožnit rozvoj civilních i vojenských odvětví na našem ostrově. Musíme si zajistit alespoň malý podíl na ochraně naší půdy a schopnosti konkurovat ostatním národům." # todo: NEW TRANSLATION
 FIJ_focus_rubber_banding_the_nation: "Gumování národa" # todo: NEW TRANSLATION
 FIJ_focus_rubber_banding_the_nation_desc: "Díky průlomům v syntetických technologiích jsme z omezených zásob skutečného kaučuku dokázali vytvořit značné domácí dodávky speciálně vyráběné gumy. Může nás to stát o něco více, dlouhodobě však tento posun zajistí další krok k takové míře autarkie, jakou skutečně dokážeme zvládnout." # todo: NEW TRANSLATION
 FIJ_focus_phase_two_business_development: "Rozvoj podnikání, fáze 2" # todo: NEW TRANSLATION
 FIJ_focus_phase_two_business_development_desc: "Pokračující investice do růstu podnikání a rozšiřování našeho hospodářství nám nepochybně umožní růst stabilním tempem." # todo: NEW TRANSLATION
 FIJ_focus_pacific_economics_exchange_commission: "Komise pro tichomořskou hospodářskou výměnu" # todo: NEW TRANSLATION
 FIJ_focus_pacific_economics_exchange_commission_desc: "Naše úsilí o regionální uznání a o to stát se trnem v oku soupeřícím mocnostem nad Tichomořím bude naším korunovačním úspěchem. Komise pro tichomořskou hospodářskou výměnu je nástrojem spolupráce mezi naším národem a ostatními národy tichomořského regionu. Cílem komise je podporovat větší spolupráci a jednotu mezi námi a dalšími ostrovními státy a přinejmenším vytvořit široký status quo v oblasti uplatňování měkké síly." # todo: NEW TRANSLATION
 FIJ_focus_royal_military_expansion_program: "Královský program vojenského rozšíření" # todo: NEW TRANSLATION
 FIJ_focus_royal_military_expansion_program_desc: "Obecné rozšíření a financování naší armády nám umožní posílit domácí bezpečnost a zahraniční podpůrné mise. Nejen to, ale s růstem armády můžeme vštěpovat smysl pro povinnost a čest vůči našemu národu a jeho lidu, a tím formovat budoucí generace." # todo: NEW TRANSLATION
 FIJ_focus_royal_military_contracts: "Královské vojenské zakázky" # todo: NEW TRANSLATION
 FIJ_focus_royal_military_contracts_desc: "RMC budou motivačním programem, jehož cílem bude podpořit domácí výrobu zbraní. I když nejde o nic, nad čím bychom měli upřímně ohrnovat nos, přesto nám to umožní řádně zásobovat naši armádu, a tím zlepšit výcvik a zároveň zkrátit celkovou dobu potřebnou k jeho provedení." # todo: NEW TRANSLATION
 FIJ_focus_royal_fijian_dream: "Královský fidžijský sen" # todo: NEW TRANSLATION
 FIJ_focus_royal_fijian_dream_desc: "Královský fidžijský sen spočívá v ohlédnutí do minulosti, avšak podle měřítek současnosti. Jde o opětovné potvrzení ústavního prohlášení, že základní kámen naší demokracie zůstane zachován, pouze názvy úřadů a titulů se jednoduše změní. Je to jen přidání trochu více okázalosti do našeho způsobu vládnutí? Ano. Znehodnocuje to však naše závazky pečovat o národ a jeho lid? Rozhodně ne. Někdy může trocha povzbuzení ega udělat zázraky pro mnohé, kteří si ne vždy věří." # todo: NEW TRANSLATION
 FIJ_focus_technate_council_emerges: "Rada technátu povstává" # todo: NEW TRANSLATION
 FIJ_focus_technate_council_emerges_desc: "Na Fidži mnoho významných technických odborníků studovalo v zahraničí. Rada technátu je skupina uznávaných ekonomů, vědců a dalších technických odborníků, kteří se kolektivně sjednotili do vlastního mocenského bloku. V zdánlivě nekonečném chaosu a frakcionářství proto Rada technátu využila své kontakty a vliv k podrobení vůdců frakcí, ať už přímými, nebo nepřímými prostředky. V důsledku toho rada převzala vedení národa a bude usilovat o přeměnu Fidži v model lidské vynalézavosti a inovací." # todo: NEW TRANSLATION
 FIJ_focus_a_technocratic_constitution: "Technokratická ústava" # todo: NEW TRANSLATION
 FIJ_focus_a_technocratic_constitution_desc: "Základem každé technokracie je, že vládní orgán slouží ke zlepšení celého druhu, nikoli jeho podkategorie. Proto plánujeme přepracovat ústavu našeho národa a vytvořit vůbec první technokratickou ústavu. Hlavní body můžeme rozpracovat během jejího přepracování, ale nyní postačí říci, že ačkoli si říkáme Fidžijci a máme národní stát zvaný Fidži, každý člověk podléhající vládnímu orgánu tohoto národa bude považován za rovnocenného. Lidé jsou lidé, jsme jeden druh a musíme spolupracovat na upevnění budoucnosti a pokroku našeho druhu." # todo: NEW TRANSLATION
 FIJ_focus_human_treatment_amendment: "Dodatek o zacházení s lidmi" # todo: NEW TRANSLATION
 FIJ_focus_human_treatment_amendment_desc: "Dodatek o zacházení s lidmi jasným jazykem stanovuje, že s každým příslušníkem lidského druhu, bez ohledu na jeho odlišnosti, bude zacházeno jako s člověkem. To znamená, že všechny nespravedlivé činy ubližování jinému příslušníkovi druhu kvůli rozdílnému přesvědčení, vzhledu nebo osobní identitě v rámci známých vědeckých oblastí budou přísně trestány v souladu se zákony stanovenými v trestním zákoníku." # todo: NEW TRANSLATION
 FIJ_focus_voting_requirements_amendment: "Dodatek o požadavcích pro hlasování" # todo: NEW TRANSLATION
 FIJ_focus_voting_requirements_amendment_desc: "Dodatek týkající se požadavků pro hlasování je jednoduchou a přímočarou odpovědí na hlasování v moderní době demokratických vlád. Volební věk bude 18 let, tedy zákonem uznaný věk dospělosti a pochopení osobní odpovědnosti za vlastní životní rozhodnutí a činy. Všichni registrovaní občané národa budou smět volit, což má zabránit zlomyslným zahraničním protivníkům ve zneužití otevřenosti, která může vycházet z přímé demokracie. Hlasy se budou odevzdávat prostřednictvím vládního webu, k němuž bude možné přistupovat z domova, z telefonu nebo z místní správní budovy. Voliči musí být schopni zadat své identifikační číslo občana, aby se zabránilo dvojímu hlasování a dalším zlomyslným aktům maření." # todo: NEW TRANSLATION
 FIJ_focus_working_standards_amendment: "Dodatek o pracovních standardech" # todo: NEW TRANSLATION
 FIJ_focus_working_standards_amendment_desc: "Dodatek týkající se standardů pracovního prostředí a zaměstnání pokrývá nový směr, kterým chceme národ v zásadě vést. Hlavním ustanovením je okamžitá analýza a zavedení střídavého rozvrhu. Ten je běžně znám jako režim 4 a 4. Standardním pracovním týdnem našich občanů bude 4 hodiny denně po 4 dny v týdnu. Zavedení samozřejmě potrvá, ale toto uspořádání zajišťuje maximální zaměstnanost, udržení pracovníků a jejich spokojenost." # todo: NEW TRANSLATION
 FIJ_focus_funding_our_future: "Financování naší budoucnosti" # todo: NEW TRANSLATION
 FIJ_focus_funding_our_future_desc: "Základem naší cesty k technokratické budoucnosti je zajistit, aby se budoucí generace adaptivně učily informace o širším světě i o tom, co leží za jeho hranicemi. Někteří se učí vizuálně, jiní prakticky. Vše je však součástí plynulé škály, a pokud se jí nedokážeme přizpůsobit, vytvoříme kastu lidí a pouze jim ublížíme tím, že se nebudeme skutečně starat o to, jak se mohou učit a přizpůsobovat." # todo: NEW TRANSLATION
 FIJ_focus_growing_our_manufacturing_base: "Rozšíření naší výrobní základny" # todo: NEW TRANSLATION
 FIJ_focus_growing_our_manufacturing_base_desc: "Chceme-li dosáhnout budoucnosti plné pokroku, musíme růst nejen jako národ, ale také jako ekonomika. Tento bod zahájí cílené zaměření na hospodářský růst. Zároveň jej podpoříme druhým pilířem v podobě sociálního rozvoje a investic." # todo: NEW TRANSLATION
 FIJ_focus_building_the_institute_of_automation: "Budování Institutu automatizace" # todo: NEW TRANSLATION
 FIJ_focus_building_the_institute_of_automation_desc: "RPP neboli Program výzkumného ráje je něco, co v budoucnu vyšle náš národ a následně i náš druh na této planetě. Začneme Institutem automatizace a tuto instituci využijeme k zaměření inovací a výzkumu na lepší automatizaci a integraci nových technologií a metod, pomocí nichž můžeme budovat, vyrábět a tvořit. Stanovením laťky pro tvorbu většího množství za nižší ceny a v kratším čase doufáme, že všem, kde to bude možné, poskytneme novou životní úroveň, jaká nebyla spatřena od poválečné éry." # todo: NEW TRANSLATION
 FIJ_focus_dedicated_welfare_funding: "Vyčleněné financování sociální péče" # todo: NEW TRANSLATION
 FIJ_focus_dedicated_welfare_funding_desc: "Chceme-li, aby naši občané byli produktivní a spolupracovali, musíme se o ně také starat. Respekt je oboustranná záležitost a bez ohledu na emocionální dopad jsme všichni příslušníky stejného druhu, a proto se o sebe podle ústavního nařízení musíme navzájem starat." # todo: NEW TRANSLATION
 FIJ_focus_tech_industrial_investments: "Investice do technologického průmyslu" # todo: NEW TRANSLATION
 FIJ_focus_tech_industrial_investments_desc: "Naše chápání širší globální ekonomiky jasně ukazuje, že technologická odvětví jsou tím pravým místem. Když to víme, můžeme se zapojit do hry a začlenit je také do našeho Programu výzkumného ráje." # todo: NEW TRANSLATION
 FIJ_focus_institute_for_resource_development: "Institut rozvoje zdrojů" # todo: NEW TRANSLATION
 FIJ_focus_institute_for_resource_development_desc: "IRD zaměří svůj výzkum na způsoby těžby a zpracování surovin a na syntetické materiály. Tato celková proměna a odhodlání položí základy našeho rozvoje směrem k hospodářské soběstačnosti a umožní světu vidět, že dokážeme vytvořit lepší zítřek." # todo: NEW TRANSLATION
 FIJ_focus_institute_for_energy_development: "Institut rozvoje energetiky" # todo: NEW TRANSLATION
 FIJ_focus_institute_for_energy_development_desc: "IED bude vytvořen za účelem vývoje nových způsobů výroby energie. To zahrnuje také zvyšování celkové efektivity a produktivity těchto nových výrobních metod. Toto nové rozšíření Programu výzkumného ráje nám pomůže zajistit větší energetickou nezávislost na zahraničních mocnostech." # todo: NEW TRANSLATION
 FIJ_focus_labour_corps: "Pracovní sbor" # todo: NEW TRANSLATION
 FIJ_focus_labour_corps_desc: "Pracovní sbor je vládou podporovaná iniciativa k organizaci a upřednostnění rozvoje a výstavby nových veřejných staveb a infrastruktury jako celku. Tato vojensky organizovaná civilní struktura nám umožní budovat rychlostí, jaké by žádný běžný rozvinutý národ nebyl schopen dosáhnout. Je to díky organizaci a zjednodušení předpisů, stejně jako přímému zaměření na potřeby a jejich rychlému naplnění." # todo: NEW TRANSLATION
 FIJ_focus_labour_prison_program: "Program vězeňské práce" # todo: NEW TRANSLATION
 FIJ_focus_labour_prison_program_desc: "PVP je filozofií rehabilitace ve vztahu k trestnímu systému. Ti, kteří spáchají zločiny a jsou uvězněni, obdrží základní péči a pozornost. Všichni vězni se však budou moci přihlásit do Programu vězeňské práce, v jehož rámci získají vyhrazené zaměstnání, za které mohou vydělávat energetické kredity. Tyto kredity lze směnit za stanovené množství přídělů a vylepšení, která zvýší minimum jejich přídělu na snesitelnější úroveň. Po zakoupení všech dostupných vylepšení a v závislosti na spáchaném trestném činu může vězeň nakonec vyměnit stanovené množství energetických kreditů za zkrácení trestu. Zpočátku bude tento poměr záměrně nevýhodný, aby vězni zůstali uvnitř, konečným cílem je však podpořit rehabilitaci prostřednictvím práce a oddanosti a připravit vězně na návrat do společnosti." # todo: NEW TRANSLATION
 FIJ_focus_increasing_domestic_steel: "Zvýšení domácí výroby oceli" # todo: NEW TRANSLATION
 FIJ_focus_increasing_domestic_steel_desc: "Díky rozsáhlému průzkumu a výzkumu se nám podařilo dosáhnout průlomu v rozvoji domácí výroby oceli. I když nejde o velké množství, přesto je to dobrý začátek naší větší soběstačnosti." # todo: NEW TRANSLATION
 FIJ_focus_technocratic_militarism: "Technokratický militarismus" # todo: NEW TRANSLATION
 FIJ_focus_technocratic_militarism_desc: "Společným sjednocujícím principem v historii našeho druhu je povinnost a čest vůči vlasti a těm, kteří jí slouží. Musíme věnovat značné úsilí výzkumu a vývoji zaměřenému na posílení naší armády. Možná se tím nevyrovnáme národům jako Francie, Německo a další, ale přinejmenším bychom mohli napodobit menší verzi americké armády. Člověk může snít… člověk může snít." # todo: NEW TRANSLATION
 FIJ_focus_research_paradise_program: "Program výzkumného ráje" # todo: NEW TRANSLATION
 FIJ_focus_research_paradise_program_desc: "Po téměř třech letech vývoje můžeme konečně uskutečnit náš konečný cíl. Program výzkumného ráje bude základním kamenem globální vědecké komunity a díky rozsáhlému financování vytvoří prázdninám podobné centrum, kde budou výzkumníci ze všech oborů studovat, experimentovat a rozvíjet své oblasti. Vytvoříme svět, v němž budou obory STEM vnímány nejen jako budoucnost, ale také jako něco stejně příjemného jako běžná dovolená." # todo: NEW TRANSLATION
 FIJ_focus_promoting_domestic_energy_synthetics: "Podpora domácí výroby syntetických paliv" # todo: NEW TRANSLATION
 FIJ_focus_promoting_domestic_energy_synthetics_desc: "Průlomy v oblasti syntetických materiálů vedly k rostoucím domácím dodávkám ropy. Tato domácí zásoba bude dále využita k růstu naší ekonomiky, protože kromě energetického využití podpoří také naše obecná petrochemická odvětví." # todo: NEW TRANSLATION
 FIJ_focus_technocratic_health_act: "Technokratický zdravotní zákon" # todo: NEW TRANSLATION
 FIJ_focus_technocratic_health_act_desc: "Rada schválila THA, návrh zákona, který investuje do obecného rozšíření našeho zdravotnického systému. To nám umožní lépe léčit a pečovat o naše obyvatelstvo jako celek. Chceme-li stavět vysoko, musíme mít obyvatelstvo, a to jak početně, tak z hlediska motivace stavět." # todo: NEW TRANSLATION
 FIJ_focus_industrial_diversity_act: "Zákon o průmyslové rozmanitosti" # todo: NEW TRANSLATION
 FIJ_focus_industrial_diversity_act_desc: "Zákon IDA přináší další diverzifikaci našeho civilního hospodářství. Díky pokračujícímu úsilí Institucionálního komplexu se nám podařilo náš národ skutečně rozvinout." # todo: NEW TRANSLATION
 FIJ_focus_family_care_act: "Zákon o péči o rodinu" # todo: NEW TRANSLATION
 FIJ_focus_family_care_act_desc: "Toto nařízení vychází ze základního pochopení, že pro zdravou společenskou soudržnost je rodina bez ohledu na svou podobu hlavním pilířem každé společnosti. Proto musíme restrukturalizovat naše sociální programy tak, aby tento pilíř podporovaly a udržovaly a zachovaly tak pevnou strukturu naší společnosti." # todo: NEW TRANSLATION
 FIJ_focus_research_plan_alchemy: "Výzkumný plán Alchymie" # todo: NEW TRANSLATION
 FIJ_focus_research_plan_alchemy_desc: "Náš dosud nejambicióznější plán. Výzkumný plán Alchymie bude stát přibližně třetinu našeho HDP, ale věříme, že máme základní předpoklady k pokusu o molekulární reorganizaci. Jednoduše řečeno, blížilo by se to samotné alchymii. Ačkoli by tato technologie byla mimořádně nestabilní a nákladná, pokud se nám podaří tento proces skutečně zvládnout, mohli bychom odemknout téměř dokonalou formu hospodářské soběstačnosti." # todo: NEW TRANSLATION
 FIJ_focus_research_plan_armory: "Výzkumný plán Zbrojnice" # todo: NEW TRANSLATION
 FIJ_focus_research_plan_armory_desc: "Naše armáda musí držet krok s naším civilním pokrokem. Nemůžeme všechny naše nejlepší nové vynálezy jednoduše nasadit do pole, ale přinejmenším můžeme zvýšit úroveň, na níž budou naši vojáci schopni bojovat i přežít. To samozřejmě přinese značné náklady, konečné výsledky však celkově posílí bezpečnost našeho národa." # todo: NEW TRANSLATION
 FIJ_focus_research_plan_biomedical: "Výzkumný plán Biomedicína" # todo: NEW TRANSLATION
 FIJ_focus_research_plan_biomedical_desc: "Plán Biomedicína v podstatě posune naše biologické a lékařské technologie a stroje na úroveň, která snad prodlouží průměrnou délku života o dalších 20 let. Protézy a zdokonalení genetického inženýrství jako celku by starším lidem umožnily zůstat zdravějšími a silnějšími navzdory jejich věku. Doufáme, že se staneme jakousi ochrannou střechou a skutečně pokryjeme naše občany novou érou biomedicínských inovací." # todo: NEW TRANSLATION
 FIJ_focus_naval_innovations: "Námořní inovace" # todo: NEW TRANSLATION
 FIJ_focus_naval_innovations_desc: "Naše armáda není jen pozemní vojsko. Oddělení zaměřené na námořní inovace je jediným způsobem, jak může Fidži ovládnout své výsostné vody." # todo: NEW TRANSLATION
 FIJ_focus_expansion_of_welfare_programs: "Rozšíření sociálních programů" # todo: NEW TRANSLATION
 FIJ_focus_expansion_of_welfare_programs_desc: "Diverzifikace našich typů sociálních programů umožní poskytovat rozmanitou a cílenou péči v reakci na řadu přetrvávajících problémů nové éry." # todo: NEW TRANSLATION
 FIJ_focus_research_plan_synthetic: "Výzkumný plán Syntetika" # todo: NEW TRANSLATION
 FIJ_focus_research_plan_synthetic_desc: "Plán Syntetika představuje komplexní přístup k rozvoji našeho programu syntetických materiálů, který nám umožní vytvořit domácí zásoby výrobků podobných kaučuku. Za cenu omezeného dovozu kaučuku a zvýšených investic do výzkumu můžeme očekávat určité posílení našich obecných ekonomických a společenských ukazatelů díky těmto dodatečným zásobám zdrojů. Další krok, který podnikáme…" # todo: NEW TRANSLATION
 FIJ_focus_civilian_corp_of_engineers: "Civilní ženijní sbor" # todo: NEW TRANSLATION
 FIJ_focus_civilian_corp_of_engineers_desc: "CCE je civilním rozšířením Fidžijského ženijního sboru. Jeho účelem je rozlišovat a upřednostňovat civilní a vojenské stavební projekty. Tyto dvě skupiny se však mohou v případě potřeby sjednotit, což bude mít určité nepřímé vojenské využití." # todo: NEW TRANSLATION
 FIJ_focus_research_plan_autarky: "Výzkumný plán Soběstačnost" # todo: NEW TRANSLATION
 FIJ_focus_research_plan_autarky_desc: "Po letech rozsáhlého výzkumu, plánování a investic jsme konečně dosáhli skutečného průlomu. Průlomu, který upevňuje naši hospodářskou soběstačnost v prakticky nejvyšší možné míře. Nyní můžeme dosáhnout čehokoli, možná už ani hvězdy nejsou limitem." # todo: NEW TRANSLATION
 FIJ_focus_research_plan_feast: "Výzkumný plán Hojnost" # todo: NEW TRANSLATION
 FIJ_focus_research_plan_feast_desc: "Abychom udrželi náš růst jako druhu a společnosti, musíme zajistit ty nejzákladnější životní potřeby. Jednou z klíčových potřeb je jídlo, které zajistí společenskou stabilitu, růst populace a posílení měkké moci nad většinou národů. Můžeme najít způsoby, jak v podstatě rozšířit cílenou zahraniční pomoc, a stát se světovým lídrem v boji proti chudobě a nedostatku potravin. Fidži se stane základním kamenem globální jednoty." # todo: NEW TRANSLATION
 FIJ_focus_research_plan_nucleus: "Výzkumný plán Jádro" # todo: NEW TRANSLATION
 FIJ_focus_research_plan_nucleus_desc: "Budoucnost je skutečně zde. V jaderné energetice došlo k tolika pokrokům, že je ubohé, jak stále přetrvává pokrok v zastrašovacích taktikách a nechutné přehlížení zjevných skutečností výroby energie. Proto za značnou cenu stanovíme nový globální standard toho, jak skutečně vybudovat jaderný reaktor. Takový, který bude efektivní, účinný a pravděpodobně bude vyrábět více energie, než spotřebuje oblast, kterou obsluhuje. Nastavíme skutečný a nejbezpečnější standard, kterým bychom zahanbili každý národ s pochybnou minulostí v oblasti jaderné energie. Za technokracii, budoucnost, kterou náš druh potřebuje, ale z nějakého důvodu ji nechce." # todo: NEW TRANSLATION
 fiji_influence_defense_through_chaos: "Vliv obrany prostřednictvím chaosu" # todo: NEW TRANSLATION
 fiji_influence_defense_through_chaos_desc: "Fidži je nezávislá od 70. let 20. století, bohužel nezávislost nebyla sláva a mír, jaké bychom si přáli. Civilní a vojenské puče, bující etnické napětí způsobily, že země je v podstatě na pozastavení ve srovnání s většinou světa. Avšak s chaosem přichází jistá přirozená bariéra, protože zahraniční státy jsou vůči ztrátě aktiv v tak malé oblasti kvůli zmíněnému chaosu příliš opatrné. Proto máme vyšší než očekávanou národní obranu vůči zahraničnímu vlivu, což je jistě dvojí ostří meče, ale zatím to pracuje v náš prospěch." # todo: NEW TRANSLATION
 fiji_militarized_society: "Militarizovaná společnost" # todo: NEW TRANSLATION
 fiji_militarized_society_desc: "Chaos a násilí z puče v roce 2000 zanechaly na obyvatelích země jizvu. Jizva je plná nenávisti a studu. S touto jizvou přišla nová vlna mladších generací, která se připojila k armádě, a tím posílila vznik a popularitu vojenské junty jako formy vedení. To vedlo k cestě odhodlání a povinnosti, kde je armáda společností a společnost armádou." # todo: NEW TRANSLATION
 fiji_society_of_the_elected_king: "Společnost voleného krále" # todo: NEW TRANSLATION
 fiji_society_of_the_elected_king_desc: "S ukázkou síly a zásadním úkolem bránit národ, jeho historii a závazkem udržovat pořádek spravedlivým způsobem, mnozí viděli velmi mlhavé světlo, z něhož vzešel Dům Suva. Šok pro fidžijský lid zanechal dojem, který žádná civilní vláda od nezávislosti nedosáhla. Proto mnozí vyjádřili podporu a hledají spolupráci s novým systémem, i když s ním nemusí plně souhlasit." # todo: NEW TRANSLATION
 fiji_ostracized_commonwealth_member: "Ostrakovaný člen Společenství národů" # todo: NEW TRANSLATION
 fiji_ostracized_commonwealth_member_desc: "Chaos naší země nás postavil do napjatých poměrů se zbytkem Společenství národů. Zatímco si užíváme dodatečnou moc, kterou nám mezinárodně poskytuje, nevidíme však plnou realitu věcí kvůli vyostřenému charakteru naší vnitřní situace vůči zahraničním členům. Ale aspoň vezmeme to, co můžeme získat." # todo: NEW TRANSLATION
 fiji_foreign_scientist_imports: "Dovoz zahraničních vědců" # todo: NEW TRANSLATION
 fiji_foreign_scientist_imports_desc: "Pomocí několika klíčových pobídek můžeme přivést vědecké mozky na Fidži s příslibem rozpočtu a třeba trvalé dovolené z domova." # todo: NEW TRANSLATION
 fiji_pacific_exchange_and_investment_society: "PIES Komise" # todo: NEW TRANSLATION
 fiji_pacific_exchange_and_investment_society_desc: "Pacific Investment & Exchange Society je společnost a skupina pro zahraniční vztahy. Více se tváří jako regionální klub, a tuto naši společnost využíváme jako prostředek k přilákání investorů a zároveň k vyvezení našeho vlastního otisku na našem malém dílu globálního koláče." # todo: NEW TRANSLATION
 fiji_depoliticized_military: "De-politizovaná armáda" # todo: NEW TRANSLATION
 fiji_depoliticized_military_desc: "Prostřednictvím nejistého kolísání s armádou bylo dosaženo dohody o odloučení armády od civilního politického systému. Jednoduché, ale pevné ujednání; to může později otevřít dveře pro reformy, které lépe postaví Fidži do role malé, avšak regionální síly." # todo: NEW TRANSLATION
 fiji_cohesive_integrations_act: "Zákon o soudržné integraci" # todo: NEW TRANSLATION
 fiji_cohesive_integrations_act_desc: "Usilujeme o poznání širšího světa kolem nás, usilujeme o pevnější spojení s našimi bližními. Usilujeme rozšířit naše obzory prospěšné pro lepší život našich lidí a těch, kteří si také přejí zlepšení." # todo: NEW TRANSLATION
 fiji_independence_sustainment_act: "Zákon o udržení nezávislosti" # todo: NEW TRANSLATION
 fiji_independence_sustainment_act_desc: "Po vzoru amerického příkladu a těch na Blízkém východě usilujeme o vytvoření vlastního ducha nezávislosti. Pokud bude naše země pohltěna zpravodajskými machinacemi světa, nakonec zvítězíme nad překážkami." # todo: NEW TRANSLATION
 fiji_importing_ideas_exporting_ideals: "Dovážení nápadů, šíření ideálů" # todo: NEW TRANSLATION
 fiji_importing_ideas_exporting_ideals_desc: "Náš ostrov je malý, ale naše ambice velké. Můžeme svět zásadně nezměnit, ale stále můžeme být významnou součástí skládanky mezinárodních záležitostí. Výzkum a vývoj bude efektivní a cílený, což nám umožní rychleji objevovat nová odvětví v menších dávkách. To zvýší atraktivitu naší země pro zahraniční mocnosti." # todo: NEW TRANSLATION
 fiji_pieces_for_the_peace: "Díly pro mír" # todo: NEW TRANSLATION
 fiji_pieces_for_the_peace-desc: "S naší nově nalezenou stabilitou nyní lépe vyhledáváme pomoc a příležitosti s těmi ve širším světě. Ačkoli ještě musíme hodně dojít, jde o velký krok kupředu, alespoň tak." # todo: NEW TRANSLATION
 fiji_the_fijian_dream: "Fidžijský sen" # todo: NEW TRANSLATION
 fiji_the_fijian_dream_desc: "Mám sen, a ten sen je o tom, že ti, kdo byli od society opomenuti, shlíováni dolů a zcela opuštěni, mohou vstát hrdě a podívat se vzhůru. Tito lidé mohou říci: toto není konec, ale nový začátek. To lze a bude to budoucnost pro ty, kteří stojí pod fidžijskou vlajkou." # todo: NEW TRANSLATION
 fiji_building_tall_within_something_small: "Budování velkého ve malém prostoru" # todo: NEW TRANSLATION
 fiji_building_tall_within_something_small_desc: "Zákon o vysokém budování je pro někoho bez kontextu poněkud klamný. Tento návrh zákona upravuje požadavek na základní formu automatizace, se kterou by měla být naše populace zvyklá a naladěná. Pochopením tohoto principu můžeme vybudovat hodně při menší ploše a tím učinit náš ostrov efektivnějším a tím i konkurenceschopnějším na světové scéně." # todo: NEW TRANSLATION
 fiji_new_foreign_image: "Nový zahraniční obraz" # todo: NEW TRANSLATION
 fiji_new_foreign_image_desc: "S tím, že naši lidé neustále bojují, neutíkají ani nemají bezdomovectví, svět kolem nás začal upřímně otáčet hlavu v obdivu. Náš ostrov prošel skutečnou transformací v průběhu těchto let a díky opravdovému úsilí přicházejí skutečné výsledky." # todo: NEW TRANSLATION
 fiji_foriegn_advisory_board: "Zahraniční poradní sbor" # todo: NEW TRANSLATION
 fiji_foriegn_advisory_board_desc: "FAB, tedy Zahraniční poradní sbor, je zástup civilních a vojenských poradců, kteří posílí a pomohou naší zemi nalézt správnou cestu. Zatímco se mnozí mohou ptát, zda to neoslabí naši nezávislost na vnějších silách, buďte ujištěni, že jsme na tuto obavu mysleli dopředu, neboť tito zahraniční poradci budou ve skutečnosti novými občany naší země. Prostřednictvím vládních pobídek a v podstatě odkupu těchto lidí z jejich vlastních zemí můžeme očekávat jen malé vlivy zvenčí, zatímco posilujeme naši vnitřní stránku." # todo: NEW TRANSLATION
 fiji_national_rotc_program: "Národní program ROTC" # todo: NEW TRANSLATION
 fiji_national_rotc_program_desc: "Zřízení národního programu Reserve Officer Training Corps (ROTC) v rámci vzdělání země nám umožní vyučovat jednotu, vedení, inovace a týmovou spolupráci budoucím generacím naší země. Dopady na národní stabilitu a celkový duch a morálku našeho lidu budou ohromné." # todo: NEW TRANSLATION
 fiji_expanded_ministry_of_science: "Rozšířené ministerstvo vědy" # todo: NEW TRANSLATION
 fiji_expanded_ministry_of_science_desc: "S prioritou ve vývoji technologií můžeme hostit celé spektrum pokroků v civilních i vojenských aplikacích. Ačkoliv to přináší náklady, musíme zlepšit naši celkovou pozici, pokud chceme skutečně budoucnost naší země." # todo: NEW TRANSLATION
 fiji_citizen_soldiers_amendment: "Doplněk občanských vojáků" # todo: NEW TRANSLATION
 fiji_citizen_soldiers_amendment_desc: "Nejsme stát se státem s vojenskou silou; spíše jsme vojenskou silou se státem. Myšlenky nacionalismu v minulosti byly zneužívány špatnými aktéry k dosažení osobních cílů. U konce. Prostřednictvím ústavního nařízení stanovíme, co znamená fidžijský nacionalismus, co obnáší být Fidžijcem a jak žít život s pocitem hrdosti na něj." # todo: NEW TRANSLATION
 fiji_fijian_general_staff: "Fidžijský generální štáb" # todo: NEW TRANSLATION
 fiji_fijian_general_staff_desc: "Vojenský parlament je v zásadě jedním velkým generálním štábem. Propojení vládních a vojenských záležitostí do jednotného řetězce velení umožňuje plánování a koordinaci potřeb jak vojenských, tak civilních; rychlosti, o kterých by jednotlivé strany ani nesnily. Musíme si však být vědomi role, kterou tento Generální štáb hraje, neboť lze ztratit z očí při takové koncentraci moci." # todo: NEW TRANSLATION
 fiji_research_institute_of_fiji: "Výzkumný ústav Fidži" # todo: NEW TRANSLATION
 fiji_research_institute_of_fiji_desc: "R.I.F. je špičkou identity našeho národa. Díky rozumně širokým investicím do výzkumu a inovací ve všech oborech budeme moci napsat naše jméno na mapu světa a přilákat zahraniční vědecké komunity. S tímto cílem to urychlí vystavení našich technologií a poskytne nám balíček karet pro ty, kteří by chtěli hrát naše hry." # todo: NEW TRANSLATION
 fiji_royal_engineers_program: "Program Královských inženýrů" # todo: NEW TRANSLATION
 fiji_royal_engineers_program_desc: "Tento omezený hybridní program, který spojuje civilní pracovní síly s vládou a zejména s projekty souvisejícími s vojenskými záležitostmi, je základ, na kterém lze stavět. Vytváří kontrolovaný spodní limit, díky němuž můžeme zabránit občanům v tom, aby propadali do extrémního stavu, neboť myšlenky na ztrátu všeho mohou narušovat mysl a rozhodování mnohých. Tento program bude sloužit jako maják naděje pro ty, kteří spadnou, aby ukázal, že jsme tu, abychom jim pomohli znovu vstát." # todo: NEW TRANSLATION
 fiji_economic_planning_board: "Ekonomická plánovací rada" # todo: NEW TRANSLATION
 fiji_economic_planning_board_desc: "EPB je vládní pilíř hospodářského růstu. Zatímco soukromý sektor si stále může užívat své zábavy, pro ty bohabojných, řečeno v uvozovkách, anti-komunistické kazatele, je toto vládní oddělení spíše nezávislou investiční větví. Cílem je pomoci řídit a zahajovat nové vládní iniciativy, které se poté stanou soukromými, až bude zajištěna stabilita. Stručně řečeno, EPB zahajuje iniciativy a soukromý sektor je bude pokračovat do budoucnosti." # todo: NEW TRANSLATION
 fiji_pacific_economics_exchange_commission: "Pacifická ekonomická výměnná komise" # todo: NEW TRANSLATION
 fiji_pacific_economics_exchange_commission_desc: "PEEC je regionální společný projekt, jehož cílem je lépe rozšířit náš vliv a spolupráci se zeměmi v našem regionu světa. Zatímco hlavní zaměření je ekonomické a politické, doplňkové vojenské vyučování by přineslo obecný prospěch všem, kteří se na něm podílejí." # todo: NEW TRANSLATION
 fiji_titles_by_election: "Tituly podle voleb" # todo: NEW TRANSLATION
 fiji_titles_by_election_desc: "Tituly podle voleb jsou ústavní požadavek, při kterém je zachován demokratický proces a občané mohou volit, kdo bude jejich další údajnou šlechtou. Už to nebude pohádkový příběh na dobrou noc; nyní si skutečně můžete říct, že i vy můžete být královnou či králem." # todo: NEW TRANSLATION
 fiji_institute_of_automation: "Fidžijský institut automatizace" # todo: NEW TRANSLATION
 fiji_institute_of_automation_desc: "Fidžijský institut automatizace je základ, na kterém bude brzy znám program 'Výzkumný ráj'. Cílem je v podstatě proměnit ostrov v obrovský výzkumně‑vývojový komplex a ukázat světu, že můžete mít obojí — slunce i představivost a tvořivost k odhalování neznámých aspektů reality samotné." # todo: NEW TRANSLATION
 fiji_institute_of_resource_development: "Fidžijský institut rozvoje zdrojů" # todo: NEW TRANSLATION
 fiji_institute_of_resource_development_desc: "FIRD je dalším milníkem ve vývoji programu Výzkumný ráj. Věnuje svou existenci těžbě, zpracování a syntéze zdrojů k jejich největšímu známému potenciálu. Přestože je náš ostrov malý, neznamená to, že nemáme nic k dispozici. Proto bude tento institut klíčovým bodem pro zajištění domácích zásob a jejich růst tam, kde je to možné." # todo: NEW TRANSLATION
 fiji_institute_of_energy_development: "Institut energetického rozvoje" # todo: NEW TRANSLATION
 fiji_institute_of_energy_development_desc: "IED se zaměří na vývoj účinnějších a produktivnějších způsobů, jak vyrábět energii. Toto oddělení by mohlo také spolupracovat s FIRD na lepší integraci naší energetiky a hospodářství." # todo: NEW TRANSLATION
 fiji_technocratic_military: "Technokratická armáda" # todo: NEW TRANSLATION
 fiji_technocratic_military_desc: "Zatímco náš ostrov je malý, naše mozky nejsou malé. S tímto poznáním nám umožní nasměrovat poměrně velký díl našich R&D kapacit k posílení našich vojenských sil. Dosud nemáme ekonomiku na moderní letectvo, ale alespoň lépe zvládneme specializovat naše námořní a pozemní síly." # todo: NEW TRANSLATION
 fiji_research_paradise_program: "Program Výzkumný ráj" # todo: NEW TRANSLATION
 fiji_research_paradise_program_desc: "Vrchol našich rozsáhlých výzkumných snah vytvořil nový ráj pro výzkum a vývoj jako celek. Ostrov byl proměněn v ráj, nejen pro zahraniční návštěvníky, ale pro vědeckou komunitu jako celek. Zde můžeme koordinovat domácí i zahraniční pokroky v oborech, o nichž víme, a v nových oblastech, které možná objevíme. Budoucnost je skutečně nyní." # todo: NEW TRANSLATION
 fijian_homelessness_crisis: "Krize bezdomovectví" # todo: NEW TRANSLATION
 fijian_homelessness_crisis_desc: "Kvůli politické nestabilitě v zemi vláda zcela postrádala účinná a rozhodná opatření k řešení rostoucí krize bezdomovectví. S nástupem nového tisíciletí se mnozí ptají, zda vláda dokáže tuto rostoucí hrozbu skutečně vyřešit. Čas ukáže, zda vláda bude moci nejen chránit národ, ale i sama sebe." # todo: NEW TRANSLATION
 fijian_emigration_crisis: "Krize masové emigrace" # todo: NEW TRANSLATION
 fijian_emigration_crisis_desc: "S politickou nestabilitou, změnou klimatu a rostoucím etnickým napětím si lidé na Fidži uvědomili, že je lepší opustit tato malá ostrovy. Je na nové vládě položit základy pro lepší zítřek, ale s tolika protivenstvími vzadu, může Fidžijská vláda obstát časem?" # todo: NEW TRANSLATION
 fijian_military: " Fidžijská armáda" # todo: NEW TRANSLATION
 fijian_military_desc: "Během nezávislosti ostrova byla fidžijská armáda solidní obranou. I přes omezené zapojení do zahraničních misí má fidžijská armáda jen málo zkušeností. Jak se ostrov dostává do moderní éry a roste politické napětí, mnozí si kladou otázku, kolikrát bude armáda muset udržovat mír." # todo: NEW TRANSLATION
 fijian_economic_condition: "FIDŽIJSKÁ EKONOMIKA" # todo: NEW TRANSLATION
 fijian_economic_condition_desc: "Navzdory skromné populaci a rozloze území je fidžijská ekonomika poměrně diverzifikovaná. Těžební průmysl vyniká ve vyhledávání surovin jako měď, zlato a stříbro. Sekundární odvětví zahrnují výrobu cementu a lodní dopravu. Celkově má fidžijská ekonomika relativně silný základ, se kterým lze pracovat, a jak nové tisíciletí začíná, je na vládě pomoci dále diverzifikovat ekonomiku rozšířením do nových odvětví, jako jsou high-tech a vývoj softwaru." # todo: NEW TRANSLATION
 fijian_ethnic_tensions: "Indo-fidžijské napětí" # todo: NEW TRANSLATION
 fijian_ethnic_tensions_desc: "Od nezávislosti Fidži zaznamenalo poměrně mírný růst populace. Nevýhodou je, že drtivá většina lidí migrujících na Fidži pochází z indického dědictví. Zatímco pro většinu to nic neznamená, pro značnou část fidžijského etnika to působí jako nahrazení a vytlačení. V průběhu nedávné historie ostrovů s nezávislostí se tato napětí dramaticky zhoršila; je na vládě Fidži, aby tuto situaci vyřešila dříve, než dojde k něčemu vážnému... prosím ignorujte několik převratů, které prostupují historií země." # todo: NEW TRANSLATION
 fiji_2000_coups_over: "Návrat k míru" # todo: NEW TRANSLATION
 fiji_post_coup_political_shift: "Vazby se mění" # todo: NEW TRANSLATION
 fiji_fast_tracked_military_junta: "§8Dlouhá pouť za zlepšením začala§!" # todo: NEW TRANSLATION
 fiji_fast_tracked_monarchy: "§0Koruna síly, koruna lidu dává§!" # todo: NEW TRANSLATION
 fiji_2006_coup_avoided: "§PZabráněno 2006 převratu§!" # todo: NEW TRANSLATION
 fiji_2006_coup_historical: "§lVojenský převrat uspěl§!" # todo: NEW TRANSLATION
 fiji_2006_coup_military_junta: "§8Padl Pán Banánů§!" # todo: NEW TRANSLATION
 fiji_2006_coup_monarchist_era: "§0Dům Suva vyhrál§!" # todo: NEW TRANSLATION
 fiji_2006_coup_technocracy: "§tTechnate Rada převezme kontrolu§!" # todo: NEW TRANSLATION
 fiji_news.1.t: "Nacionalisté unesli vládní úředníky" # todo: NEW TRANSLATION
 fiji_news.1.d: "Již dnes 19. května 2000 vzali členové pro-indických Fidžijských politických hnutí známého jako i-Taukei rukojmí klíčové členy nově zvolené a převážně indo-Fidžijské vlády. Předseda vlády a několik klíčových vládních úředníků byli drženi jako rukojmí v budově parlamentu a členové i-Taukei zůstávali téměř uvězněni. Probíhají jednání o vysvobození rukojmích bez ztrát na životech." # todo: NEW TRANSLATION
 fiji_news.1.o1: "Proč se musíme bojovat navzájem?" # todo: NEW TRANSLATION
 fiji_news.2.t: "Dočasná vláda vytvořena" # todo: NEW TRANSLATION
 fiji_news.2.d: "Po událostech a patovém stavu v jednání s rebely prezident Kamisese Mara vyhlásil stav nouze a vytvořil pokračující vládu z toho, co zůstalo z dosud držené rukojmí vlády, která nebyla zajata. Napětí je vysoké, když místní policie a Fidžijské ozbrojené síly (RFMF) jsou roztaženy při vytváření neúspěšného kordonu kolem parlamentu a řešení rostoucích protestů a občanského nepokoje, kdy demonstranti cíleně podnikali proti několika indo-fidžijským podnikům v Suvě." # todo: NEW TRANSLATION
 fiji_news.2.o1: "Nedokážeme nic udělat!?" # todo: NEW TRANSLATION
 fiji_news.3.t: "Ztracená autorita vede k vojenskému převratu" # todo: NEW TRANSLATION
 fiji_news.3.d: "Jelikož zbytky civilní vlády prokázaly neschopnost skutečně vykonávat výkonnou moc, velitel Fidžijských ozbrojených sil Frank Bainimarama svrhl stávající vládu a založil vlastní. Jejich prvním činem bylo vyhlášení válečného stavu, které jim dálo větší svobodu v boji s obrovským množstvím občanského nepokoje." # todo: NEW TRANSLATION
 fiji_news.3.o1: "Jdem tu znovu" # todo: NEW TRANSLATION
 fiji_news.3.o2: "Vojenské řešení to vyřeší" # todo: NEW TRANSLATION
 fiji_news.4.t: "Střelba v parlamentu" # todo: NEW TRANSLATION
 fiji_news.4.d: "Po vojenském převratu byla ústava z roku 1997 zrušena, jednání se rozpadla a armáda vydala ultimátum. Zahraniční mocnosti zahájily sankce; Fidži bylo vyřazeno z Commonwealthu, několik zemí zakázalo fidžijské zboží a fidžijské sportovní týmy byly zakázány. Tyto kroky vznikly z opětovaného požadavku rebelů. Dne 12. června armáda vypálila varovné výstřely na Speightův vůz; Speight tvrdí, že šlo o neúspěšný pokus o vraždu. Jednání pokračují a bylo propuštěno více rukojmích. S uklidněním občanského nepokoje a nadějným výhledem se mnozí ptají, jak dlouho to ještě potrvá." # todo: NEW TRANSLATION
 fiji_news.4.o1: "Prosím, ukončete toto zbytečné násilí." # todo: NEW TRANSLATION
 fiji_news.5.t: "Vojenské síly souhlasí s rebely?" # todo: NEW TRANSLATION
 fiji_news.5.d: "Dne 3. července 2000 jmenoval Bainimarama Laisenia Qarase premiérem a vedl vládu složenou výhradně z domorodých Fidžijců. Speight byl touto volbou rozzuřen a následující den se v Parlamentu strhla střelba, při níž bylo zraněno pět lidí. Chaos se zhoršil a rebelové uspořádali řadu incidentů po celé zemi. Vojáci v kasárnách Sukunaivalu v Labase se vzbouřili a prohlásili svou podporu Speightovi. Místní vlastníci půdy obsadili vodní nádrž Monasavu, čímž odpojili proud z Suvy. Dne 8. rebelové zablokovali silnici mezi Suvou a Nadi a v Korovou vtrhli do policejní stanice, čímž vzali 30 rukojmích. Ve věznici Naboro došlo ke vzpouře 50 vězňů, kteří zajali dozorce jako rukojmí." # todo: NEW TRANSLATION
 fiji_news.5.o1: "Co asi myslí Bananarama?!" # todo: NEW TRANSLATION
 fiji_news.6.t: "Převrat končí" # todo: NEW TRANSLATION
 fiji_news.6.d: "Během měsíců června a července probíhala po zemi neustále jednání o reformě civilní vlády. Postupně bylo uvolněno čím dál více rukojmích, rebelové opustili budovu parlamentu a opustili oblast hlavního města. Ke dni 26. července byli Speight a jeho mluvčí Joe Nata zatčeni poblíž vojenského checkpointu poté, co vyhrožovali novému prezidentovi a občanskou válkou, jak uvedli dva vůdci rebelů. Krátce poté vojska vtrhla do rebelního velitelství a zatkla dalších 369 rebelů. Civilní převrat byl prohlášen za ukončený; krátce poté byl George Speight souzen za zradu a odsouzen k smrti." # todo: NEW TRANSLATION
 fiji_news.6.o1: "Mír konečně... Ale za jakou cenu?" # todo: NEW TRANSLATION
 fiji_news.7.t: "Sjednocené Fidži dosahuje vítězství." # todo: NEW TRANSLATION
 fiji_news.7.d: "Ústava Fidži z roku 1997 vyžadovala konání všeobecných voleb do Sněmovny zástupců nejméně jednou za pět let. Dočasný prezident Ratu Joni Madraiwiwi vydal 2. března 2006 prohlášení, kterým byl parlament rozpuštěn s účinností od 27. března. Předchozí volební období mělo vypršet 1. října 2006. Rozkaz k volbám byl vydán 28. března; kandidáti podali nominace 11. dubna a zveřejnili své seznamy preferencí 13. dubna, zatímco registrace voličů byla uzavřena 4. dubna. Všeobecné volby proběhly na Fidži mezi 6. a 13. květnem 2006. Vládní strana Soqosoqo Duavata ni Lewenivanua (SDL), vedená premiérem Laisenia Qarase, byla zvolena na třetí mandát. Hlavní opozicí byla Labour Party vedená Mahendrou Chaudhrym, a také několik dalších menších stran." # todo: NEW TRANSLATION
 fiji_news.7.o1: "Jdeme dál klidně." # todo: NEW TRANSLATION
 fiji_news.8.t: "Vojenské požadavky" # todo: NEW TRANSLATION
 fiji_news.8.d: "Dne 16. října 2006 vydal velitel RFMF Commodore Bainimarama ultimátum vládě, aby splnila devět požadavků nebo do 1. prosince rezignovala. Devět požadavků se primárně soustředilo na to, aby byli potrestáni aktéři z roku 2000 převratu; stažení jakýchkoliv politických machinací, které by mohly dále prohloubit ekonomickou nerovnost na základě rasového původu; odmítnutí zásahu ze zahraniční autority (uvedl policejního komisaře Andrewa Hughese, australského státního příslušníka); stažení soudních řízení ohledně prohlášení armády z dřívějšího roku a oficiální řešení obav o vládní výdaje a vnitřní správu. O týden a půl později, 31. října 2006, vojska uspořádala cvičení kolem Suvy a uzavřela armádní kasárny ve městě. Vojáci uvedli, že cvičení nebylo hrozbou." # todo: NEW TRANSLATION
 fiji_news.8.o1: "Odmítáme takovou chátru." # todo: NEW TRANSLATION
 fiji_news.8.o2: "§PLets Save Face For Now§!" # todo: NEW TRANSLATION
 fiji_news.9.t: "Vláda vojenského převratu" # todo: NEW TRANSLATION
 fiji_news.9.d: "V době, kdy vláda odmítá vojenské požadavky, Commodore Frank Bainimarama zahájil převrat, při kterém byla svržena vláda, jak bylo uvedeno v citátu 'hrozba sociální a etnické stability'. Děje se rychle a ukazuje se, že sama armáda je v tomto úsilí jednotná. Nicméně někteří zpochybňují legitimitu a někteří si myslí, že armáda má jiné plány. Ačkoli se toho moc neví, mnozí doufají, že uvidíme mír v našem čase." # todo: NEW TRANSLATION
 fiji_news.9.o1: "Je to opravdu dost?" # todo: NEW TRANSLATION
 fiji_news.9.o2: "§lStabilita se vrátila§!" # todo: NEW TRANSLATION
 fiji_news.10.t: "Členové převratu agitují" # todo: NEW TRANSLATION
 fiji_news.10.d: "Se současným převratem, který ustanovil Commodore Franka Banimaramu jako de facto vůdce národa, mnozí nyní přemýšlejí, co bude dál pro Fidži. Někteří vysoce postavení členové převratu se zdají agitovat za tvrdší postoj ohledně řízení země. Jeden z nich prohlašuje, že malicherné spory etnického napětí jsou největším průšvhem, kterému národ musel čelit, natož aby se nad to rozpadl. Prozatím celý svět sleduje nejistý stav této malé tichomořské ostrovní země." # todo: NEW TRANSLATION
 fiji_news.10.o1: "§8Vojenská síla je naším spasením§!" # todo: NEW TRANSLATION
 fiji_news.10.o2: "Už jsme toho utrpěli dost?" # todo: NEW TRANSLATION
 fiji_news.11.t: "Staré myšlenky vyvolávají frakcionálství" # todo: NEW TRANSLATION
 fiji_news.11.d: "Rostoucí frakcionálnost vnitř vojenksé junty zažila vzestup starých nápadů s novým nádechem. Frakce známá jako Dům Suva se zdá chtít vytvořit volenou monarchii, jakýsi starý titul s novými principy. Místo spojování titulu s krví budou i nadále existovat myšlenky voleb a princip demokracie. Tato hybridizace monarchismu s demokratickou volitelností by byla základním pilířem jejich platformy. Jeden z členů frakce dokonce prohlásil: „Teď můžete svému synovi či dceři říct, že pokud budete pracovat dost usilovně a usilovat o své cíle v životě, i vy můžete být princem, princeznou nebo možná i králem či královnou.“ Mnozí o tomto návrhu váhají, ale zdá se, že oslovuje radu náčelníků a kmene dědictví ostrova." # todo: NEW TRANSLATION
 fiji_news.11.o1: "Co za pohádku!" # todo: NEW TRANSLATION
 fiji_news.11.o2: "§0No... Může to být pěkné ego posílení§!" # todo: NEW TRANSLATION
 fiji_news.12.t: "Destabilizace převratu" # todo: NEW TRANSLATION
 fiji_news.12.d: "S pokračujícím převratem a s tím, že mnoho frakcí je nyní vystaveno veřejnému nátlaku, se mnoho lidí ptá, co z toho vyplyne z tohoto úplného zastavení země. Šuškají se o formující se frakci zvané Technate Council; tato rada se zdá být součástí speciální strany známé jako Technocracy Party of Fiji. Mnoho protestních hnutí proti aparátu převratu si však přeje jen projít dál, přičemž plakáty vyzývající Fidžijskou Labour Party, aby převzala moc, se objevují čím dál častěji, jelikož měla druhé místo ve volebních výsledcích. Kdo však zaváhá jako první?" # todo: NEW TRANSLATION
 fiji_news.12.o1: "§tRada získává moc§!" # todo: NEW TRANSLATION
 fiji_news.12.o2: "§PLidé už toho mají dost§!" # todo: NEW TRANSLATION
 fiji_news.400.t: "Vojenské fanatiky" # todo: NEW TRANSLATION
 fiji_news.400.d: "S chaosom, který převrat způsobil, někteří vojenští členové zaujali neoprávněný agresivní postoj a přímo se vzpírali přáním Commodora Franka Bainimarama. Nálady se vyhrotily a soudržnost v armádě začíná klesat." # todo: NEW TRANSLATION
 fiji_news.400.o1: "Bože, pomoz nám" # todo: NEW TRANSLATION
 fiji_news.401.t: "Šuškají se zprávy o nájezdu" # todo: NEW TRANSLATION
 fiji_news.401.d: "Nedávno se objevily drby, že sekce vojenské junty pod radikálnějšími vůdci přišla se záměrem vtrhnout do budovy parlamentu a vzít rukojmí. Kommodore byl spatřen, jak se snaží najít tyto radikální důstojníky, aby zabránil národní krizi, která nebyla viděna od prvního převratu v 80. letech. Čas ukáže, zda budou vládnout rozumní lidé nebo chaos." # todo: NEW TRANSLATION
 fiji_news.401.o1: "§8Slyším snad střelbu?§!" # todo: NEW TRANSLATION
 fiji_news.401.o2: "§lDnes je to podivně tiché.§!" # todo: NEW TRANSLATION
 fiji_news.401.o3: "§0Co to za rámus slyším?§!" # todo: NEW TRANSLATION
 fiji_news.402.t: "Masakr v Suvě" # todo: NEW TRANSLATION
 fiji_news.402.d: "Chaos pustoší národ, střelba a útok na rukojmí vedl k 15 úmrtím, 27 zraněným a masové panice po celé zemi. V chaotickém týdnu se uvádí, že Commodore Frank Bainimarama byl nalezen mrtev ve vážně poškozeném konvoji. Nikdo nepřijímá smrt komandéra a názory ohledně jeho skutečné smrti jsou rozporuplné. Přesto je to cesta k zotavení, která bude národ stát hodně." # todo: NEW TRANSLATION
 fiji_news.402.o1: "Can We Really Heal From This?" # todo: NEW TRANSLATION
 fiji_news.403.t: "Pokračovat dál" # todo: NEW TRANSLATION
 fiji_news.403.d: "Byla to dlouhá a poměrně únavná cesta k obnově země po otřesech způsobených převratem z roku 2000. Z popela však povstal fénix a tento majestátní pták vzlétne. Nyní se můžeme soustředit na budování na základě, který byl položen před námi, a dívat se nejen na náš malý ostrov, ale i na svět kolem nás." # todo: NEW TRANSLATION
 fiji_news.403.o1: "§8Slyším snad střelbu?§!" # todo: NEW TRANSLATION
 fiji_news.500.t: "Mocenský zápas zesiluje" # todo: NEW TRANSLATION
 fiji_news.500.d: "Vojenské jednotky byly náhle staženy z již zoufalého kordonu kolem budovy parlamentu. Zdroje uvádějí, že u okraje Suvy bylo slyšet střelba a skřípání pneumatik. Mnozí se ptají, co způsobilo tak radikální změnu v aparátu vojenského odporu vůči zbytku civilní vlády. Navíc původní vůdce etno-nacionalistů, který zahájil počáteční převrat, vyzval k razantnímu jednání s ním nebo k potrestání za jejich nečinnost. Doufáme, že brzy dostaneme zprávy o tom, co se stalo." # todo: NEW TRANSLATION
 fiji_news.500.o1: "Máme vůbec ještě národ?" # todo: NEW TRANSLATION
 fiji_news.501.t: "Krvavé výsledky jsou známy" # todo: NEW TRANSLATION
 fiji_news.501.d: "V ostrém kontrastu se světem, ve kterém žijeme, se ukázalo, že nestabilní sekta v armádě přepadla konvoj kommodora a následně donutila radu náčelníků legalizovat House of Suva. Tento krvavý vzestup vedl ke korunování země monarchií, přestože její historie zahrnuje získání nezávislosti na monarchii. Nedávný rozhovor s jedním z údajně House Council uvedl, že citace: \"Usilujeme o pevnou vládu, spravedlivou vládu a božskou vládu nad národem. Ano, zavádíme formu vojenského režimu, dokud nebudou vyřešeni etno-nacionalisté, nicméně neplánujeme zrušit volby.\" Mnozí jsou skeptičtí vůči tvrzením, avšak velká většina si přeje, aby chaos ustal. Uvidíme, jak dopadne tato jejich krvavě vytvořená koruna." # todo: NEW TRANSLATION
 fiji_news.501.o1: "Je tu vůbec nějaké kolo, které by se dalo vzít?!" # todo: NEW TRANSLATION
 fiji_news.502.t: "Nová éra" # todo: NEW TRANSLATION
 fiji_news.502.d: "Proces rekonstrukce je v podstatě dokončen, jizvy částečně zahojené a země se může soustředit na budoucnost. House of Suva se zavázalo k plnému porozumění a rozvoji země a jejích obyvatel. Pochopení toho bude mít před lidmi výzvy, lidé sice váhají, ale již získali pocit, že život se vrátil do normálu... i když ten normál sám o sobě nemusí být považován za \"normální\"." # todo: NEW TRANSLATION
 fiji_news.502.o1: "Nová kapitola, nový začátek." # todo: NEW TRANSLATION
 Rear_Admiral_Villiame_Naupoto_desc: "Villiame Naupoto byl fidžijským námořním důstojníkem, který se během chaosu roku 2006 převratu přidal k frakci hlasitějších militaristů. Tato frakce v rámci převratu vyštípala a izolovala Franka, tj. Bananamana. V důsledku tohoto posunu byl kdysi dodržující ústavní pořádek převrat nyní proměněn na plnohodnotnou vojenskou juntu. Zatímco Rear Admiral Naupoto je na politické scéně novou tváří, není slepým mužem, a lidé se ptají, jak bude zem a její lid vést k lepším časům." # todo: NEW TRANSLATION
 Laisenia_Qarase_desc: "Laisenia Qarase byl kompromisním kandidátem vzniklým během převratu v roce 2000. Není příliš levicový, etnicky fidžijský a pro tehdejší dobu nebyl příliš pravicově nakloněný. Získal vítězství ve volbách v roce 2001 a překvapivě i ve volbách v roce 2006. Ačkoliv do roku 2006 se jeho názory a strana změnily na více etnicky fidžijsky orientované, některé navržené kontroverzní návrhy během jeho funkčního období v roce 2006 by vyvolaly ústavní krizi, která by vedla k vojenskému převratu v roce 2006." # todo: NEW TRANSLATION
 Mahendra_Chaudhry_desc: "Mahendra Chaudhry byl zvoleným vůdcem první většinově etnicky Indo-Fidžijské vlády Fidži v roce 2000. Avšak agitátor z etno-nacionalistického hnutí se rozhodl jednat na vlastní pěst a unesl zvolenou vládu. Po událostech daného převratu byla založena strana United Fiji Party a oficiálně zvolena ve volbách po převratu. Mahendra Chaudhry by se pokusil o další kandidaturu na premiérskou funkci ve volbách v roce 2006." # todo: NEW TRANSLATION
 Dr_Padma_Narsey_Lal_desc: "Padma Narsey Lal, narozená v roce 1951, studovala na University of the South Pacific, získala magisterský titul v oboru vědy, ekologie a biochemie. Byla první ženou Gujarati, která tuto univerzitu navštěvovala. V roce 1971 získala první Zlatou medaili University of the South Pacific. Také dokončila magisterský program v oboru Resource and Environmental Studies na Australian National University a doktorát v oboru zemědělství a ekonomiky zdrojů na University of Hawaii at Manoa. Padma Lal začala pracovat jako veřejný úředník pro fidžijskou vládu, než přešla do výzkumu a řízení výzkumu. Působila jako poradkyně pro udržitelný rozvoj na sekretariátu Pacific Islands Forum Secretariat a jako hlavní technická poradkyně v Mezinárodní unii pro ochranu přírody, Oceanic Regional Office. Lal také zastávala vyšší posty u australské federální vlády, včetně Australian Centre for International Agricultural Research." # todo: NEW TRANSLATION
 King_Sitiveni_I_desc: "Sitiveni Rabuka je nyní oficiálně titulován Králem Sitiveni I. z House of Suva. Vedoucí člen a někteří tvrdí, že potenciálně je zakladatelem House of Suva. Rabuka si vybudoval jméno a odkaz svým politickým a vojenským kariérám, a byl do určité míry zapojen do téměř všech převratů, které země zažila. Stabilita, pořádek, mír... Tyto tři pilíře se Rabuka snaží udržet a s tímto novým směrem se mnozí ptají, zda může vytvořit skutečné dědictví." # todo: NEW TRANSLATION
 King_Sitiveni_II_desc: "Jioji Konrote byl nyní oficiálně udělen titul krále Sitiveni II z rodu House of Suva. Bývalý generálmajor a politik byl zvolen lidmi v prvním volebním cyklu v éře po převratu. Jméno Sitiveni je symbolem v korunní radě. Symbol spočívá v tom, že jedním z předních členů a podle některých dokonce možným zakladatelem rodu House of Suva je Sitiveni Rabuka. Vzhledem k tomu, že toto pojmenování bylo ustanoveno jako precedens, mnozí se ptají, zda následující vůdci zvolí tento symbol, nebo si případně nárokují vlastní označení v číselné hře." # todo: NEW TRANSLATION
