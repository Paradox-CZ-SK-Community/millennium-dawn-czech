 faroe_islands_focus: "Strom zaměření Faerských ostrovů" # todo: NEW TRANSLATION
 FAO_national_decisions: "Faerská národní rozhodnutí" # todo: NEW TRANSLATION
 FAO_national_decisions_desc: "Faerské ostrovy se nacházejí ve velmi uvolněné, ale zároveň napjaté situaci. Kromě pokusů politických představitelů dělat... vlastně cokoli pro rozvoj ostrovů a jejich obyvatel se musí potýkat také s neustále naléhavější otázkou případné nezávislosti. Někteří ji chtějí nyní, jiní chtějí počkat, až budou mít pevnější a stabilnější základy. Ať tak či onak, nakonec bude na Fařanech i Dánsku, zda budou ostrovy skutečně svobodné." # todo: NEW TRANSLATION
 FAO_decision_independence_war: "Válka za nezávislost" # todo: NEW TRANSLATION
 FAO_decision_independence_war_desc: "Čas nadešel a politici přinutili lid postavit se na vlastní nohy. Byla vyhlášena válka a nyní začíná závod o to, zda si Dánsko dokáže udržet svou korunu, nebo zda koruna odpadne, když veřejný tlak vynutí mír mezi všemi stranami." # todo: NEW TRANSLATION
