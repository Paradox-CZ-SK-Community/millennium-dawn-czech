 AFG.liberalism_2017: "£AFG_liberalism_2017 Basej-e Milli" # todo: NEW TRANSLATION
 AFG.liberalism_2017_icon: "£AFG_liberalism_2017" # todo: NEW TRANSLATION
 AFG.liberalism_2017_desc: "Afghanistan Green Trend also known as Rawand-e Sabz-e Afghanistan (Afghanistan Green Trend), is an anti-Taliban Afghan nationalist and pro-democracy political party. Founded by former Afghan intelligence chief Amrullah Saleh, the movement began as a grassroots effort promoting democracy and opposing the Taliban." # todo: NEW TRANSLATION
 AUS.Western_Autocracy: "£generic_Western_Autocracy_small SGA - Schwarz-Gelbe Allianz" # todo: NEW TRANSLATION
 AUS.Western_Autocracy_desc: "Monarchismus - Založená v roce 2004, Schwarz-Gelbe Allianz (neboli česky Černo-Žlutá aliance) je monarchistická strana usilující o návrat dědičné monarchie k moci (preferovaně Habsburkové) a tradičně podporuje unii Rakouska, Maďarska, Chorvatska, České republiky, Slovinska a Slovenska pod společným carem, podobně jako za dob rakousko-uherské koruny." # todo: NEW TRANSLATION
