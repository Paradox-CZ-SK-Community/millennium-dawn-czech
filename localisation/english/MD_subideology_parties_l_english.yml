 LOG.Nat_Autocracy_desc: "(vojenská povstalecká skupina) - Lidový front pro znovuzrození Středoafrické republiky (FPRC, francouzsky: Front populaire pour la renaissance de la Centrafrique)\nFPRC byla založena jako povstalecká skupina a je jednou z několika bývalých Séléka frakcí. Vedená Noureddinem Adamem, skupina vybudovala vlastní paralelní stát v severovýchodní části Středoafrické republiky známý jako Republika Logone (nebo Dar al-Kuti)." # todo: NEW TRANSLATION
