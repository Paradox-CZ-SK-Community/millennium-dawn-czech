l_english:
 abkhazia_focus: "Abchazský strom zaměření"
 ABK_Corruption_economic: "Abcházie v novém tisíciletí"
 ABK_Corruption_economic_desc: "Naše země nevstupuje do nového tisíciletí v nejlepší kondici. Korupce naši zemi rozežírá, infrastruktura byla po válce zničena a dosud nebyla obnovena." # todo: CHANGED
 ABK_jd_abk_russia: "Obnovit dopravní spojení s Ruskem"
 ABK_jd_abk_russia_desc: "Potřebujeme obnovit dopravní trasy do Ruska, protože je to v současnosti náš jediný spojenec a partner."
 ABK_tourism1: "Rozvoj cestovního ruchu"
 ABK_tourism1_desc: "Je čas zahájit rozvoj cestovního ruchu v naší zemi; možná nám příjmy od turistů pomohou udržet naši ekonomiku." # todo: CHANGED
 ABK_associated_state: "Přidružený stát CIS"
 ABK_associated_state_desc: "Rusko je připraveno pomoci nám stát se součástí SNS ve formě přidruženého státu." # todo: CHANGED
 ABK_internet_akvafon: "První internetový přístup"
 ABK_internet_akvafon_desc: "Internet se aktivně rozvíjí po celém světě; je čas, abychom jej rozvíjeli i v republice." # todo: CHANGED
 ABK_abkhazian_resource: "Podpora farmářů a zemědělských plodin"
 ABK_abkhazian_resource_desc: "Bohaté přírodní dědictví naší republiky bychom měli maximálně využít. Jsme připraveni podpořit naše zemědělce." # todo: CHANGED
 ABK_promotion_of_independence: "Podpora nezávislosti"
 ABK_promotion_of_independence_desc: "Nezávislost naší republiky budeme prosazovat prostřednictvím všech médií. Naše země může existovat samostatně." # todo: CHANGED
 ABK_promotion_of_russia: "Propagace přátelství s Ruskem"
 ABK_promotion_of_russia_desc: "Rusko je náš přítel, bratr a spojenec. Tento pohled budeme aktivně šířit prostřednictvím všech našich médií." # todo: CHANGED
 ABK_training_in_russia: "Výcvik vojáků v Rusku"
 ABK_training_in_russia_desc: "Pošleme naše vojáky do Ruska na výcvik, aby získali pokročilé bojové zkušenosti." # todo: CHANGED
 ABK_russia_invest_industry: "Rusko investuje do našeho průmyslu"
 ABK_russia_invest_industry_desc: "Jsme připraveni uzavřít dohodu o investování ruských prostředků do našeho průmyslu." # todo: CHANGED
 ABK_visa_free_russia: "Bezvízový režim s Ruskem"
 ABK_visa_free_russia_desc: "Podepsali jsme dohodu, která ruší vízový režim mezi našimi zeměmi. Doufáme, že nám to pomůže zlepšit naši ekonomickou situaci." # todo: CHANGED
 ABK_tourism2: "Pokračovat ve rozvoji cestovního ruchu"
 ABK_tourism2_desc: "Musíme do země přilákat více turistů, a proto zvýšíme investice do odvětví cestovního ruchu." # todo: CHANGED
 ABK_decrease_cencorship: "Uvolnit cenzuru"
 ABK_decrease_cencorship_desc: "Zanecháme přísné cenzury, která existovala dříve." # todo: CHANGED
 ABK_abkhazian_passports: "Abchazské pasy"
 ABK_abkhazian_passports_desc: "Jsme připraveni zavést pas občana Abcházie." # todo: CHANGED
 ABK_rearms_russia_us: "Rusko je připraveno nás vyzbrojit"
 ABK_rearms_russia_us_desc: "Rusko je připraveno znovu vyzbrojit naše síly moderním vybavením." # todo: CHANGED
 ABK_energy_help: "Začít řešit energetické problémy"
 ABK_energy_help_desc: "Naše země dlouhodobě trpí energetickými problémy. Je čas začít tento problém řešit." # todo: CHANGED
 ABK_crypto: "Legální kryptoměny"
 ABK_crypto_desc: "Naše země musí držet krok s dobou. Kryptoměny nabývají na významu a my z toho musíme finančně těžit." # todo: CHANGED
 ABK_president_illness: "Nemoc prezidenta"
