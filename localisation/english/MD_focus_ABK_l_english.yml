 ABK_invest_from_chi: "Investice z Číny"
 ABK_invest_from_chi_desc: "Je nutné přilákat investice z Číny. ČLR jako jedna z velmocí a stálý člen Rady bezpečnosti OSN patří k zemím nejméně náchylným k oportunistickému tlaku vnějších faktorů." # todo: CHANGED
