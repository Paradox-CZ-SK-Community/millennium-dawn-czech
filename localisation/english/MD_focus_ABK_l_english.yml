 ABK_new_era: "Nová éra"
 ABK_new_era_desc: "Naše republika vstupuje do nové éry. Možná se s novým prezidentem konečně dokážeme stát ekonomicky silným národem." # todo: CHANGED
 ABK_increase_medicine: "Rozvoj medicíny"
 ABK_increase_medicine_desc: "Je nutné investovat do zdravotnictví naší země. Počet našich obyvatel klesá a my musíme tento trend zvrátit." # todo: CHANGED
 ABK_against_corruption: "Spuštění kampaně proti korupci"
