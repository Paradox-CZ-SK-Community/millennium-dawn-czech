 ABK_ally_with_mafia: "Aliance s mafií"
 ABK_ally_with_mafia_desc: "Klanové Abcházie již dlouho rozdělují zemi a nepříznivě ovlivňují její rozvoj. Pod praporem monarchie je donutíme pracovat pro dobro naší země." # todo: CHANGED
 ABK_nati_ideas: "Nacionální myšlenky"
 ABK_nati_ideas_desc: "Konsolidace naší společnosti je důležitější než kdy dříve. Pro větší jistotu ji posílíme nacionalistickými myšlenkami." # todo: CHANGED
