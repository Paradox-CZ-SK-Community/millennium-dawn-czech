 ABK_abkhazian_kingdom_desc: "Učebnice dějepisu je nejlepším nástrojem propagandy. Je čas připomenout lidu naší země, že na těchto územích kdysi stálo abchazské království." # todo: CHANGED
 ABK_miiltia: "Abchazská milice"
