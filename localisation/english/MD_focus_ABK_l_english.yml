 ABK_decentralized_warfare: "Decentralizované"
 ABK_decentralized_warfare_desc: "Válka čtvrté generace (4GW) je konflikt charakterizovaný stíráním hranic mezi válkou a politikou, bojovníky a civilisty. Přijetí této decentralizované formy vedení války umožní našim silám působit flexibilněji a s větší iniciativou." # todo: CHANGED
 ABK_cool_thingy: "Připravte se na Gruzii" # todo: NEW TRANSLATION
