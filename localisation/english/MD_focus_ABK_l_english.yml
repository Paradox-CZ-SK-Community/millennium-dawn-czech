 ABK_arm_battalion: "Obnovit Baghramjanův prapor"
 ABK_arm_battalion_desc: "Je čas obnovit Bagrámjanův prapor, symbol našeho přátelství s Arménií v boji proti Gruzii." # todo: CHANGED
 ABK_abkhazvozvrashenstroy: "Založit nadaci \"Abchazvozvraščenstroj\" # todo: CHANGED
 ABK_abkhazvozvrashenstroy_desc: "Tento fond bude základním kamenem nové abchazské ekonomiky. S jeho pomocí budeme schopni přilákat investice z celého světa." # todo: CHANGED
