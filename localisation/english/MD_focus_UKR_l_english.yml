 ukraine_poroh.7.t: "Ukrajina chce spolupráci se Visegrádskou čtyřkou" # todo: NEW TRANSLATION
 ukraine_poroh.7.d: "Ukrajinská vláda jasně vymezila své plány na spolupráci se zeměmi Visegrádské čtyřky. Jako reprezentant čtyř zemí rozhodujeme, zda s touto spoluprací souhlasíme?" # todo: NEW TRANSLATION
