 UKR_economy_desc: "\n\n\n\n\n\n£GFX_UKR_desctext_economy\n\n\n\n\n\n\n\n\n§5Ministerstvo hospodářského rozvoje a obchodu§! je hlavním orgánem systému ústřední vlády §8Ukrajiny§! odpovědným za tvorbu a provádění státní politiky hospodářského a sociálního rozvoje (podnikové ekonomiky); regulaci spotřebitelských cen; průmyslovou, investiční a obchodní hospodářskou politiku; rozvoj podnikání; technickou regulaci a ochranu práv spotřebitelů; mezirezortní koordinaci hospodářské a sociální spolupráce §8Ukrajiny§! s §8Evropskou unií§!." # todo: NEW TRANSLATION
