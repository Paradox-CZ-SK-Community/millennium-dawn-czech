 UKR_war_on_donbass_experience: "Naše armáda" # todo: NEW TRANSLATION
 UKR_war_on_donbass_experience_desc: "Ukrajinská armáda je doslova stínem bývalé sovětské a nyní ruské armády – je na čase to změnit." # todo: NEW TRANSLATION
 UKR_ukrainian_armed_forces_reform: "Reforma ozbrojených sil" # todo: NEW TRANSLATION
 UKR_ukrainian_armed_forces_reform_desc: "Naše ozbrojené síly akutně potřebují reformu, je nutné vytvořit nové struktury, nové typy jednotek a vyřešit staré problémy naší armády." # todo: NEW TRANSLATION
 UKR_contract_army: " Reforma vojenského vzdělávání" # todo: NEW TRANSLATION
 UKR_contract_army_desc: "Přestavíme staré vojenské školy a založíme nové, abychom zlepšili kvalitu našich ozbrojených sil." # todo: NEW TRANSLATION
 UKR_ter_oborona: "Vytvořit Územní obranu" # todo: NEW TRANSLATION
 UKR_ter_oborona_desc: "Potřebujeme více různých jednotek k ochraně naší vlasti. Zahájíme vznik ukrajinské územní obrany, aby byl chráněn každý region." # todo: NEW TRANSLATION
 UKR_create_sso: "Vytvořit speciální operační síly Ukrajiny" # todo: NEW TRANSLATION
 UKR_create_sso_desc: "Nová vojenská struktura nám pomůže účinněji bojovat proti našim nepřátelům." # todo: NEW TRANSLATION
 UKR_cut_down_the_general_staff: "Snížit počet generálů" # todo: NEW TRANSLATION
 UKR_cut_down_the_general_staff_desc: "Příliš velký počet generálů negativně ovlivňuje naši armádu, je na čase to napravit." # todo: NEW TRANSLATION
 UKR_dshv_create: "Letecké výsadkové síly" # todo: NEW TRANSLATION
 UKR_dshv_create_desc: "Oddělíme Letecké výsadkové síly od pozemních sil do samostatné jednotky s vlastním velením a strukturou, čímž zvýšíme jejich účinnost." # todo: NEW TRANSLATION
 UKR_command_create: "Velení jednotných sil" # todo: NEW TRANSLATION
 UKR_command_create_desc: "Velení jednotných sil ozbrojených sil Ukrajiny je orgán pro řízení ozbrojených sil Ukrajiny, mezi skupinami vojsk k provádění různých vojenských operací. Je také zodpovědné za vedení mírových misí mimo Ukrajinu." # todo: NEW TRANSLATION
 UKR_delta: "Delta" # todo: NEW TRANSLATION
 UKR_delta_desc: "Ukrajinský systém informační podpory pro rozhodování a situační povědomí na bojišti má přístup k programu pro aktivní vojenský personál, který prošel ověřením. Přihlášení probíhá přes internet prostřednictvím autorizace a dvoufaktorového ověření na speciální webové stránce. Oprávněné osoby mohou zobrazovat a zadávat data o známých polohách nepřátel, zjištěných nepřátelských letadlech, pozemním vybavení a dalších údajích." # todo: NEW TRANSLATION
 UKR_national_guard: "Obnovit Národní gardu" # todo: NEW TRANSLATION
 UKR_national_guard_desc: "Národní garda byla rozpuštěna za prezidenta Kučmy, ale nyní situace vyžaduje její oživení. Zorganizujeme ji z interních jednotek Ministerstva vnitra." # todo: NEW TRANSLATION
 UKR_kolomoisky_help: "Pomoc od Kolomojského" # todo: NEW TRANSLATION
 UKR_kolomoisky_help_desc: "Známý oligarcha Kolomojskyj nás oslovil s návrhem financovat vytvoření několika praporů za účelem zachování bojové schopnosti našich ozbrojených sil." # todo: NEW TRANSLATION
 UKR_kolomoisky_finish: "Policejní pluk Dnipro-1" # todo: NEW TRANSLATION
 UKR_kolomoisky_finish_desc: "Poslední věcí, kterou se Kolomojskyj dobrovolně zavázal financovat, byla přeměna obranného pluku Dněpropetrovsk na policejní pluk." # todo: NEW TRANSLATION
 UKR_uda: "Ukrajinská dobrovolnická armáda" # todo: NEW TRANSLATION
 UKR_uda_desc: "Je nutné zorganizovat dobrovolníky do jediné vojenské skupiny." # todo: NEW TRANSLATION
 UKR_azov: "Vytvořit prapor Azov" # todo: NEW TRANSLATION
 UKR_azov_desc: "Pojďme do toho a nechte je vstoupit do řad našich ozbrojených sil." # todo: NEW TRANSLATION
 UKR_aidar: "Vytvořit prapor Ajdar" # todo: NEW TRANSLATION
 UKR_aidar_desc: "Využijme příležitosti a dovolme jim vstoupit do řad našich ozbrojených sil." # todo: NEW TRANSLATION
 UKR_donbass: "Vytvořit prapor Donbas-Ukrajina" # todo: NEW TRANSLATION
 UKR_donbass_desc: "Další jednotka, vytvořená z dobrovolníků, se připojí k našim silám." # todo: NEW TRANSLATION
 UKR_reform_mvd: "Reforma Ministerstva vnitra" # todo: NEW TRANSLATION
 UKR_reform_mvd_desc: "Provedeme celkovou reformu Ministerstva vnitra." # todo: NEW TRANSLATION
 UKR_found_the_national_police: "Pohotovostní služba speciální policie" # todo: NEW TRANSLATION
 UKR_found_the_national_police_desc: "Pohotovostní služba speciální policie Ukrajiny je služba v rámci Oddělení hlídkové policie Ukrajiny při Národní policii Ukrajiny, která byla vytvořena v rámci Ministerstva vnitra Ukrajiny jako struktura speciálních sil pro ochranu veřejného pořádku. Struktura se stala součástí Národní policie Ukrajiny. Služba spojuje bývalé prapory a pluky Ministerstva vnitra." # todo: NEW TRANSLATION
 UKR_found_the_kord: "Speciální jednotka CORD" # todo: NEW TRANSLATION
 UKR_found_the_kord_desc: "Soubor Operativních a náhlých akcí, neboli jednotka CORD, je speciální jednotkou v Národní policii Ukrajiny. Je navržena k řešení mimořádných situací, jejichž úroveň je tak vysoká a složitá, že může překročit schopnosti jednotek rychlého zásahu nebo vyhledávacích operačních jednotek." # todo: NEW TRANSLATION
 UKR_found_the_uop: "Reforma vojensko-průmyslového komplexu" # todo: NEW TRANSLATION
 UKR_found_the_uop_desc: "Naše obranné průmysly jsou v žalostném stavu, a proto jsme nuceni zahájit globální reformu v této oblasti." # todo: NEW TRANSLATION
 UKR_defend_our_sky: "Oživit letectví" # todo: NEW TRANSLATION
 UKR_defend_our_sky_desc: "Začneme oživení našeho letectví, které bylo v hrozném stavu od rozpadu SSSR." # todo: NEW TRANSLATION
 UKR_srdsc: "Státní výzkumně a design shipbuilding center" # todo: NEW TRANSLATION
 UKR_srdsc_desc: "State Research and Design Shipbuilding Center is a design bureau specializing in shipbuilding and located in Mykolaiv, Ukraine. It is part of the Ukrainian Defense Industries state corporation." # todo: NEW TRANSLATION
 UKR_oplit: "Státní výzkumně a design shipbuilding center" # todo: NEW TRANSLATION
 UKR_oplit_desc: "T-84 je ukrajinský hlavní bojový tank, založený na sovětském T-80 MBT uvedeném v roce 1976, konkrétně verze s dieselovým motorem: T-80UD. T-84 byl poprvé vyroben v roce 1994 a vstoupil do služby v ukrajinských ozbrojených silách v roce 1999. Jeho vysoce výkonný motor s protiběžnými písty z něj dělá rychlý tank s poměrem výkonu k hmotnosti kolem 26 koní na tunu." # todo: NEW TRANSLATION
 UKR_sapsan: "Hrim-2" # todo: NEW TRANSLATION
 UKR_sapsan_desc: "Ukrajinský systém krátkého dosahu balistických střel vyvíjený KB Pivdenne a PA Pivdenmash, navržený tak, aby kombinoval vlastnosti taktického raketového systému a vícenásobného raketového dělostřeleckého systému. Původní verze Sapsan pro vlastní Ukrajinu měla dostřek 500 kilometrů. Pozdější verze Hrim-2, vyvinutá pro export, má dostřek omezený na 280 kilometrů, aby spadala do limitu 300 kilometrů stanoveného Režimem kontroly raketové technologie, který usiluje o omezení šíření raket a raketové technologie." # todo: NEW TRANSLATION
 UKR_dissolved_parliament: "Rozpuštěný parlament" # todo: NEW TRANSLATION
 UKR_dissolved_parliament_desc: "Parlament byl rozpuštěn a zastupování už v zemi není aktivní.\n§W------------------§!\nTento národní nápad bude §ROdstraněn§! pokud obnovíme volby." # todo: CHANGED
 UKR_russia_help_battalions: "Ruské podpůrné bataliony" # todo: NEW TRANSLATION
 UKR_russia_help_battalions_desc: "Nasazení ruských jednotek Rosgvardije a Wagner zlepšuje bezpečnost a protipovstalecké operace během okupace." # todo: NEW TRANSLATION
 UKR_oup: "Ukroboronprom" # todo: NEW TRANSLATION
 UKR_oup_desc: "Ukrajinský průmysl musí být co nejrychleji obnoven. Abychom toho dosáhli, strukturováme všechny naše podniky do jednoho koncernu" # todo: NEW TRANSLATION
