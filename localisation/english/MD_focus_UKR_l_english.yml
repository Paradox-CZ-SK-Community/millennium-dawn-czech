 UKR_security_start: "Bezpečnost Ukrajiny" # todo: NEW TRANSLATION
 UKR_security_start_desc: "Naše země je obrovská a proto potřebuje silnou vnitřní ochranu, začneme financovat a reformovat naše vládní struktury" # todo: NEW TRANSLATION
 UKR_sbu_start: "Reforma SBU" # todo: NEW TRANSLATION
 UKR_sbu_start_desc: "Naše bezpečnostní služba Ukrajiny potřebuje hlubokou reformu a zvýšenou efektivitu" # todo: NEW TRANSLATION
 UKR_sbu_t: "Hlavní správa "T"" # todo: NEW TRANSLATION
 UKR_sbu_t_desc: "Bezpečnostní rada Ukrajiny provádí státní politiku v oblasti boje proti organizacím a jednotlivcům, jejichž cílem je podrýt národní státnost, zlikvidovat nezávislost Ukrajiny, změnit ústavní pořádek silou, porušovat suverenitu a územní integritu státu, podkopávat jeho bezpečnost, neoprávněně převzít státní moc, propagaci války, násilí, podněcování etnické, rasové, náboženské a jiné nevraživosti, zasahování do lidských práv a svobod, stejně jako prevence, detekce a potlačování trestných činů a dalších nezákonných činů, které přímo ohrožují životně důležité zájmy státu a bezpečnost občanů Ukrajiny a spadají do působnosti SBU, implementuje prevenci trestné činnosti v této oblasti." # todo: NEW TRANSLATION
 UKR_sbu_corrupt: "Hlavní správa "K"" # todo: NEW TRANSLATION
 UKR_sbu_corrupt_desc: "Bezpečnostní služba Ukrajiny, podle zákona Ukrajiny „O organizačních a právních základech boje proti korupci a organizovanému zločinu“ ze dne 30.06.1993 č. 3341-XII, je pověřena bojem proti korupci a organizovanému zločinu. Jedním ze státních orgánů oprávněných pracovat v této oblasti je Hlavní správa pro boj s korupcí a organizovaným zločinem Bezpečnostní rady Ukrajiny (GU "K")." # todo: NEW TRANSLATION
 UKR_sbu_contr: "Hlavní správa vojenské kontrarozvědky" # todo: NEW TRANSLATION
 UKR_sbu_contr_desc: "Vojenské kontrarozvědné orgány jsou zřízeny pro kontrarozvědná opatření ozbrojených sil Ukrajiny, Služby státní pohraniční stráže Ukrajiny a dalších vojenských formací rozmístěných na území Ukrajiny. Systém vojenských kontrarozvědnéh orgánů Bezpečnostní rady Ukrajiny se skládá z Hlavního ředitelství vojenské kontrarozvědky, orgánů (jednotek) v regionech v rámci Counterintelligence oddělení, operativních jednotek vojenské kontrarozvědky v operativních, regionálních a teritoriálních velitelstvích (ředitelství), armádních sborů, jednotlivých vojenských jednotek a formací." # todo: NEW TRANSLATION
 UKR_sbu_svr: "Zahraniční zpravodajská služba" # todo: NEW TRANSLATION
 UKR_sbu_svr_desc: "Zahraniční zpravodajská služba Ukrajiny, též SZRU, je zpravodajská agentura ukrajinské vlády. Provádí své zpravodajské činnosti v politické, ekonomické, vojenské, vědecko-technické a ekologické sféře a podřizuje se přímo prezidentovi Ukrajiny." # todo: NEW TRANSLATION
 UKR_sbu_sviaz: "Státní speciální komunikační služba" # todo: NEW TRANSLATION
 UKR_sbu_sviaz_desc: "Státní speciální komunikační služba Ukrajiny, též známá jako Derzhspetszv'yazku, je specializovaný výkonný úřad, jehož klíčové funkce zahrnují zajištění bezpečné vládní komunikace, vládní kurýrní službu, ochranu informací a kybernetickou obranu." # todo: NEW TRANSLATION
 UKR_sbu_alpha: "Alfa" # todo: NEW TRANSLATION
 UKR_sbu_alpha_desc: "Skupina „A“ Centra zvlášních operací Bezpečnostní služby Ukrajiny je speciální jednotkou SBU. Oficiálně nese název „Vojenská jednotka E6117“" # todo: NEW TRANSLATION
 UKR_sbu_administration: "Civilně-vojenská správa" # todo: NEW TRANSLATION
 UKR_sbu_administration_desc: "Civilně-vojenská správa je dočasná státní autorita na Ukrajině, vzniklá na územích sousedících s bojovou zónou" # todo: NEW TRANSLATION
 UKR_hur_reform: "Reforma HUR" # todo: NEW TRANSLATION
 UKR_hur_reform_desc: "Je čas zahájit reformy naší Hlavní správy zpravodajství (HUR), aby se zvýšila efektivita a možnosti vlivu v jiných zemích" # todo: NEW TRANSLATION
 UKR_peacemakers: "Program pro udržování míru" # todo: NEW TRANSLATION
 UKR_peacemakers_desc: "Naše země se vždy snažila účastnit misí udržování míru po celém světě a budeme v této tradici pokračovat" # todo: NEW TRANSLATION
 UKR_border_guard: "Služba státní pohraniční stráže" # todo: NEW TRANSLATION
 UKR_border_guard_desc: "Státní pohraniční stráž Ukrajiny je pohraniční stráží Ukrajiny. Je to nezávislý policejní orgán, organizovaný Ústavou Ukrajiny jako vojenská formace, jejímž vrchním velitelem je prezident Ukrajiny" # todo: NEW TRANSLATION
 UKR_reform_vv: "Reforma vnitřních vojsk" # todo: NEW TRANSLATION
 UKR_reform_vv_desc: "Naše vnitřní vojenské jednotky měly od svého vzniku nejistý status v hierarchii státních struktur, je čas to napravit" # todo: NEW TRANSLATION
 UKR_finance_vv: "Financování speciálních bataliónů" # todo: NEW TRANSLATION
 UKR_finance_vv_desc: "Budeme financovat činnost speciálních bataliónů vnitřních vojsk, v budoucnu nám mohou být velmi užiteční" # todo: NEW TRANSLATION
 UKR_finance_vv_tt: "Vyžaduje, aby Vnitřní vojska stále měla svou reformovanou sílu a nebyla rozpuštěna ani začleněna do jiné služby" # todo: NEW TRANSLATION
 UKR_sbu_white_wolves: "Pluk Bílých Vlků" # todo: NEW TRANSLATION
 UKR_sbu_white_wolves_desc: "SBU vyšle do války pluk vytvořený ze svých zaměstnanců" # todo: NEW TRANSLATION
 UKR_hur_opearational_support: "Operační podpora HUR" # todo: NEW TRANSLATION
 UKR_hur_opearational_support_desc: "HUR v současnosti podporuje probíhající operace zpravodajskými informacemi a nasazením svých jednotek na frontu." # todo: NEW TRANSLATION
 UKR_alpha: "Alfa" # todo: NEW TRANSLATION
 UKR_alpha_desc: "Speciální operační jednotka Alfa SBU posiluje naše kontrarozvědné a bezpečnostní operace proti podvratným hrozbám." # todo: NEW TRANSLATION
 UKR_hur: "Hlavní správa zpravodajství" # todo: NEW TRANSLATION
 UKR_hur_desc: "HUR má širokou škálu pravomocí a schopností, které budeme moci uplatnit v naší zahraniční politice" # todo: NEW TRANSLATION
 UKR_hur_battalions: "Pluky HUR Ukrajiny" # todo: NEW TRANSLATION
 UKR_hur_battalions_desc: "Pluky HUR Ukrajiny se účastní bojů na příkazy ukrajinského velení na naší straně, po ukončení bojů opustí naše ozbrojené síly" # todo: NEW TRANSLATION
 UKR_border: "Státní pohraniční stráž" # todo: NEW TRANSLATION
 UKR_border_desc: "Naše hranice jsou příliš velké na to, abychom je mohli spoléhat na jednotlivé jednotky ozbrojených sil. Pohraniční jednotky tuto práci budou vykonávat efektivněji" # todo: NEW TRANSLATION
 UKR_svr: "Zahraniční zpravodajská služba" # todo: NEW TRANSLATION
 UKR_svr_desc: "Operace Zahraniční zpravodajské služby zlepšují rozvoj zpravodajské sítě a obranu agentury proti zahraničnímu podvracení." # todo: NEW TRANSLATION
 UKR_sviaz: "Státní speciální komunikační služba" # todo: NEW TRANSLATION
 UKR_sviaz_desc: "Státní služba zvláštních komunikací zajišťuje lepší šifrování, dešifrování a bezpečnou komunikační infrastrukturu." # todo: NEW TRANSLATION
 UKR_hur_decision_category: "Hlavní zpravodajská agentura" # todo: NEW TRANSLATION
 UKR_hur_decision_category_desc: "\n\n\n\n\n\n£UKR_desctext_hur \n\n\n\n\n\n\n\n\nHlavní zpravodajská správa Ministerstva obrany Ukrajiny je vojenskou zpravodajskou službou ukrajinské vlády. Jedná se o útvar Ministerstva obrany, nikoli o Generální štáb Ozbrojených sil Ukrajiny. S pomocí tohoto ministerstva budeme schopni provádět různé sabotážní operace v sousedních zemích, stejně jako podnikat výpady za pomoci sabotážního praporu.\n\n\n\nAktuální počet operačních bodů HUR operací: [?hur_points]" # todo: CHANGED
