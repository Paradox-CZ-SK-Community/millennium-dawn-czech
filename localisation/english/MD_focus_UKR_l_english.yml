 UKR_industrial_revival_desc: "Naše země ztratila průmyslovou sílu po zhroucení SSSR, je čas ji obnovit." # todo: NEW TRANSLATION
 UKR_national_feminism: "Národní feminismus" # todo: NEW TRANSLATION
 UKR_national_feminism_desc: "Ženy by měly být také motorem růstu naší země a my podpoříme jejich účast ve všech odvětvích." # todo: NEW TRANSLATION
 UKR_foreign_policy_det: "Náš kurz zahraniční politiky" # todo: NEW TRANSLATION
 UKR_foreign_policy_det_desc: "Naše země se musí sama rozhodnout, kterým směrem bude směřovat v zahraniční politice." # todo: NEW TRANSLATION
 UKR_fully_antagonize_the_west: "Antagonismus vůči Západu" # todo: NEW TRANSLATION
 UKR_fully_antagonize_the_west_desc: "Neplánujeme být přáteli se Západ, protože víme, že Západ nemá přátele – jen otroky a služebníky." # todo: NEW TRANSLATION
 UKR_ukr_sov_mil_coop: "Vojenská spolupráce s Ruskem" # todo: NEW TRANSLATION
 UKR_ukr_sov_mil_coop_desc: "Budeme provádět sérii vojenských cvičení s ruskou armádou." # todo: NEW TRANSLATION
 UKR_euroscepticism_campaign: "Silný euroskepticismus" # todo: NEW TRANSLATION
 UKR_euroscepticism_campaign_desc: "Byli jsme a budeme euroskeptici." # todo: NEW TRANSLATION
 UKR_join_csto: "Připojit se k CSTO" # todo: NEW TRANSLATION
 UKR_join_csto_desc: "Jsme připraveni podepsat dokument o vstupu do CSTO, jen Rusko nám může poskytnout bezpečnostní záruky." # todo: NEW TRANSLATION
 UKR_reconcile_with_west: "Zlepšit spolupráci se Západem" # todo: NEW TRANSLATION
 UKR_reconcile_with_west_desc: "Máme v úmyslu zlepšit spolupráci se západními zeměmi." # todo: NEW TRANSLATION
 UKR_nato_ukr_train: "Cvičení s NATO členy" # todo: NEW TRANSLATION
 UKR_nato_ukr_train_desc: "Budeme částečně prosazovat doktrínu NATO v našich ozbrojených silách a budeme také provádět řadu cvičení s nimi." # todo: NEW TRANSLATION
 UKR_join_nato_with_russia: "Vstoupit do NATO spolu s Ruskem" # todo: NEW TRANSLATION
 UKR_join_nato_with_russia_desc: "Máme v úmyslu vstoupit do NATO, ale jen společně s Ruskem, a tento nápad navrhneme ruské vládě." # todo: NEW TRANSLATION
 UKR_full_nazbol_transition: "Národní bolševická obnova" # todo: NEW TRANSLATION
 UKR_full_nazbol_transition_desc: "Přišel čas pro další fázi rozvoje naší země a celé slovanské rodiny; vydáváme se na cestu sjednocení Slovanů." # todo: NEW TRANSLATION
 UKR_serbia_unify: "Národní bolševická revoluce v [SER.GetName]" # todo: NEW TRANSLATION
 UKR_serbia_unify_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ." # todo: NEW TRANSLATION
 UKR_bulgaria_unification: "Národní bolševická revoluce v [BUL.GetName]" # todo: NEW TRANSLATION
 UKR_bulgaria_unification_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ." # todo: NEW TRANSLATION
 UKR_unification_with_belarus: "Národní bolševická revoluce v [BLR.GetName]" # todo: NEW TRANSLATION
 UKR_unification_with_belarus_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ." # todo: NEW TRANSLATION
 UKR_poland_unification: "Národní bolševická revoluce v [POL.GetName]" # todo: NEW TRANSLATION
 UKR_poland_unification_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ." # todo: NEW TRANSLATION
 UKR_demand_bosnia: "Národní bolševická revoluce v [BOS.GetName]" # todo: NEW TRANSLATION
 UKR_demand_bosnia_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ." # todo: NEW TRANSLATION
 UKR_czech_unification: "Národní bolševická revoluce v [CZE.GetName]" # todo: NEW TRANSLATION
 UKR_czech_unification_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ." # todo: NEW TRANSLATION
 UKR_demand_croatia_slovenia: "Národní bolševická revoluce v [CRO.GetName]" # todo: NEW TRANSLATION
 UKR_demand_croatia_slovenia_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ!" # todo: NEW TRANSLATION
 UKR_slovakia_unify: "Národní bolševická revoluce v [SLO.GetName]" # todo: NEW TRANSLATION
 UKR_slovakia_unify_desc: "Naši bratři budou konečně osvobozeni od vlády, která je utlačovala jako slovanský národ!" # todo: NEW TRANSLATION
 UKR_propose_full_union_state: "Skutečný svazový stát" # todo: NEW TRANSLATION
 UKR_propose_full_union_state_desc: "Je čas, aby Rusko a náš stát se staly skutečným svazovým státem!" # todo: NEW TRANSLATION
 UKR_pan_slavic_ssr: "Unie slovanských republik" # todo: NEW TRANSLATION
 UKR_pan_slavic_ssr_desc: "Konečně se všichni Slované stanou jedním národem!" # todo: NEW TRANSLATION
 UKR_vetrenko_surrort_nationalism: "Ruský-ukrajinský nacionalismus" # todo: NEW TRANSLATION
 UKR_vetrenko_surrort_nationalism_desc: "Nacionalistické hnutí zmobilizovalo obyvatelstvo a zdůraznilo ukrajinskou identitu a kulturní suverenitu tváří v tvář vnímaným vnějším hrozbám." # todo: NEW TRANSLATION
 UKR_vetrenko_inner_idea: "Vnitřní politika" # todo: NEW TRANSLATION
 UKR_vetrenko_inner_idea_desc: "Jsme připraveni usilovat o politiku nezávislosti na Západě a o silnou Ukrajinu; máme již dost diktatury západního kapitálu" # todo: NEW TRANSLATION
 UKR_vetrenko_christian_socialism: "Křesťanský socialismus" # todo: NEW TRANSLATION
 UKR_vetrenko_christian_socialism_desc: "Bůh a socialismus jdou ruku v ruce na Ukrajině" # todo: NEW TRANSLATION
 UKR_vetrenko_west_idea: "Antizápadní doktrína" # todo: NEW TRANSLATION
 UKR_vetrenko_west_idea_desc: "Nezastíráme, že Západ je naším ideologickým i přímým nepřítelem" # todo: NEW TRANSLATION
 UKR_vetrenko_pioneria: "Národní pionýr" # todo: NEW TRANSLATION
 UKR_vetrenko_pioneria_desc: "Byla založena nacionalistická mládežnická organizace, která má podporovat vlasteneckou výchovu a zvyšovat politické povědomí mladších generací." # todo: NEW TRANSLATION
 UKR_vetrenko_women_idea: "Národní feminismus" # todo: NEW TRANSLATION
 UKR_vetrenko_women_idea_desc: "Ženy Ukrajiny budou budovat velký stát spolu s muži" # todo: NEW TRANSLATION
 UKR_vetrenko_iron_woman: "Ukrajinská železná žena" # todo: NEW TRANSLATION
 UKR_vetrenko_iron_woman_desc: "Vitrenko se stal naším ekvivalentem Margaret Thatcherové" # todo: NEW TRANSLATION
 UKR_vetrenko_health_free_idea: "Zdravotní péče zdarma" # todo: NEW TRANSLATION
 UKR_vetrenko_health_free_idea_desc: "Bezplatná zdravotní péče byla zavedena v celé zemi. Zlepšuje růst populace, ale zatěžuje veřejné finance vyššími výdaji na zdravotnictví." # todo: NEW TRANSLATION
 ukraine_nazbol.1.t: "Spustit invazi do [FROM.GetName]?" # todo: NEW TRANSLATION
 ukraine_nazbol.1.d: "Dokázali jsme vyvolat povstání v této zemi, ale nyní musíme rozhodnout, zda jsme připraveni s tím skončit a přiznat, že revoluce je naším dílem" # todo: NEW TRANSLATION
 ukraine_nazbol.1.a: "Ano" # todo: NEW TRANSLATION
 ukraine_nazbol.1.b: "Ne" # todo: NEW TRANSLATION
 ukraine_nazbol.2.t: "" # todo: NEW TRANSLATION
 ukraine_nazbol.2.d: "" # todo: NEW TRANSLATION
 ukraine_nazbol.2.a: "" # todo: NEW TRANSLATION
 ukraine_nazbol.3.t: "Národní bolševická revoluce!" # todo: NEW TRANSLATION
 ukraine_nazbol.3.d: "Neočekávaně pro nás se v naší zemi odehrála revoluce pod vlajkou národních bolševiků! Ihned jsme povolali armádu a veškeré ozbrojené síly, abychom bojovali proti separatistům. Víme, že jsou ovládáni [UKR.GetName] a mají v úmyslu s tím v budoucnu zatočit." # todo: NEW TRANSLATION
 ukraine_nazbol.3.a: "Najednou" # todo: NEW TRANSLATION
 ukraine_nazbol.4.t: "[FROM.GetName] Chválí odkaz Ruského impéria" # todo: NEW TRANSLATION
 ukraine_nazbol.4.d: "Vláda Ukrajiny na státní úrovni oznamuje glorifikaci minulosti a dědictví Ruského impéria; měli bychom na tento čin reagovat jakkoli." # todo: NEW TRANSLATION
 ukraine_nazbol.4.a: "Jsme na to také hrdí" # todo: NEW TRANSLATION
 ukraine_nazbol.4.b: "To odsuzujeme" # todo: NEW TRANSLATION
 ukraine_nazbol.5.t: "[FROM.GetName] stojí po boku nás v otázce dědictví Ruského impéria a je připraven nás podpořit na diplomatické úrovni v této věci" # todo: NEW TRANSLATION
 ukraine_nazbol.5.d: "[FROM.GetName] stojí s námi v solidaritě v otázce dědictví Ruské říše a je připraven nás v této záležitosti podpořit na diplomatické úrovni" # todo: NEW TRANSLATION
 ukraine_nazbol.5.a: "To je skvělé!" # todo: NEW TRANSLATION
 ukraine_nazbol.6.t: "[FROM.GetName] nás odsuzuje" # todo: NEW TRANSLATION
 ukraine_nazbol.6.d: "[FROM.GetName] odsuzuje skutečnost, že neodsuzujeme imperialistické ambice, nikdy nebudeme považovat za nedemokratický stát; Nová Rus bude vždy hlásat ideály mírové spolupráce a nikoli expanze." # todo: NEW TRANSLATION
 ukraine_nazbol.6.a: "Zbabělci" # todo: NEW TRANSLATION
 UKR_vitrenko_power: "Vitrenko se stal národním bolševikem" # todo: NEW TRANSLATION
 anti_westi: "Odpůrce Západu" # todo: NEW TRANSLATION
 UKR_donbass_rise: "Povstání na jihovýchodě proběhlo" # todo: NEW TRANSLATION
 UKR_economic_reforms_modifier: "Ukrajinský hospodářský rozvoj" # todo: NEW TRANSLATION
 UKR_economic_reforms_modifier_desc: "Desetiletí oligarchické stagnace zanechala ukrajinské hospodářství jako směsici sovětských pozůstatků a šedých trhů. Dlouhodobý reformní program pomalu rozplétá byrokracii, láká zahraniční investice a modernizuje stárnoucí průmysl. Každý krok vpřed se měří znovuotevřenými továrnami a dodrženými smlouvami." # todo: NEW TRANSLATION
 UKR_military_reforms_modifier: "Ukrajinský vojenský rozvoj" # todo: NEW TRANSLATION
 UKR_military_reforms_modifier_desc: "Ukrajinské ozbrojené síly vstoupily do tohoto století podfinancované, demoralizované a vyzbrojené rezavějícími sovětskými zásobami. Reforma znamená víc než nové pušky: znamená profesionální důstojníky, realistický výcvik a doktrínu vytvořenou pro války, kterým skutečně čelíme. Výsledkem bude štíhlejší a tvrdší armáda loajální státu, nikoli jednotlivým patronům." # todo: NEW TRANSLATION
 UKR_amber_wars_category: "Jantarové války" # todo: NEW TRANSLATION
 UKR_amber_wars_category_desc: "[UKR.GetFlag]§YUkrajina§! přivírá oči nad tím, jak kopáči drancují borové lesy Volyně kvůli jantaru, zatímco místní úředníci zvažují podíl na zisku oproti nákladům na zásah." # todo: NEW TRANSLATION
 UKR_amber_crackdown: "Zakročit proti kopáčům" # todo: NEW TRANSLATION
 UKR_amber_crackdown_desc: "Pošleme policii a jednotky Národní gardy do jantarových polí, aby vyčistily nelegální jámy, zabavily vybavení a zatkly kopáče. Obchod to navždy neukončí, ale státu to přinese trochu klidu a daňových příjmů." # todo: NEW TRANSLATION
 UKR_amber_tolerate: "Tolerovat kopání" # todo: NEW TRANSLATION
 UKR_amber_tolerate_desc: "Necháme místní úředníky vybírat jejich neoficiální podíl a kopáče necháme na pokoji. Peníze proudí, stejně jako zášť vůči státu, který se objeví jen proto, aby si vzal svůj díl." # todo: NEW TRANSLATION
 ukraine_amber.1.t: "Kopačská republika se prohlašuje za samostatnou" # todo: NEW TRANSLATION
 ukraine_amber.1.d: "V době, kdy byla státní autorita na Volyni již válkou vyprázdněna, prohlásila skupina kopáčů jantaru a místních ozbrojenců jámy kolem Klesivu za svou věc. Nazvali ji Kopačskou republikou podle ukrajinského slova pro kopáče a na silnici do Sarny postavili kontrolní stanoviště." # todo: NEW TRANSLATION
 ukraine_amber.1.a: "Poznamenejme to a pokračujme dál" # todo: NEW TRANSLATION
 UKR_amber_resentment: "Bezpráví jantarové horečky" # todo: NEW TRANSLATION
 UKR_amber_kopach_truce: "Příměří kopáčů" # todo: NEW TRANSLATION
 ukraine_amber.2.t: "Kopačská republika se rozpouští" # todo: NEW TRANSLATION
 ukraine_amber.2.d: "Samozvaná republika kopáčů nikdy neměla skutečnou vládu, pouze kontrolní stanoviště a ceník. Jak snadno dostupný jantar došel a novinka omrzela, ozbrojenci se tiše vrátili ke kopání bez vlajky." # todo: NEW TRANSLATION
 ukraine_amber.2.a: "Vzato na vědomí" # todo: NEW TRANSLATION
 UKR_strategic_industry_chinese_capital_corridor: "Koridor čínského kapitálu" # todo: NEW TRANSLATION
 UKR_strategic_industry_chinese_capital_corridor_desc: "Čínský kapitál a přístup na trh ukotvují investice do motorů a pokročilé výroby. Koridor přináší rozsah za cenu větších obav z přenosu technologií a kontroly." # todo: NEW TRANSLATION
 UKR_strategic_industry_independent_distributed_industry: "Nezávislý distribuovaný průmysl" # todo: NEW TRANSLATION
 UKR_strategic_industry_independent_distributed_industry_desc: "Síť domácích firem, opravárenských center a rozptýlených dílen dává Ukrajině odolnou produkci a rychlou schopnost adaptace. Vyniká kontinuitou za války, i když nedokáže nahradit každou funkci těžkého průmyslu." # todo: NEW TRANSLATION
 UKR_strategic_industry_renewed_post_soviet_integration: "Obnovená postsovětská integrace" # todo: NEW TRANSLATION
 UKR_strategic_industry_renewed_post_soviet_integration_desc: "Znovuotevřené východní dodavatelské řetězce znovu propojují ukrajinské továrny se známými trhy, součástkami a standardy. Vrací se efektivita, spolu s obnovenou strategickou zranitelností." # todo: NEW TRANSLATION
 UKR_strategic_industry_western_integrated_defense_industry: "Se Západem integrovaný obranný průmysl" # todo: NEW TRANSLATION
 UKR_strategic_industry_western_integrated_defense_industry_desc: "Domácí firmy a strategické státní podniky jsou propojeny se západními standardy, investicemi, opravárenskými sítěmi a výrobními partnerstvími. Integrace rozšiřuje trhy a přístup k dodávkám, zároveň však váže modernizaci na spolupráci se spojenci." # todo: NEW TRANSLATION
 ukraine_tech.300.a: "Zachovat strategické komplexy" # todo: NEW TRANSLATION
 ukraine_tech.300.b: "Zprivatizovat komplexy a nechat rozhodnout trh" # todo: NEW TRANSLATION
 ukraine_tech.300.d: "Nezávislost zanechala Ukrajině Antonov, Motor Sič, Južmaš a konstrukční kanceláře kolem nich, nikoli však úplný trh a síť dodavatelů, které je udržovaly při životě. Udržení odborníků a zařízení pohromadě si vyžádá rozhodnutí, která si stát sotva může dovolit." # todo: NEW TRANSLATION
 ukraine_tech.300.t: "Dědictví bez trhu" # todo: NEW TRANSLATION
 ukraine_tech.301.a: "Udržet postsovětskou síť motorů" # todo: NEW TRANSLATION
 ukraine_tech.301.b: "Financovat nezávislý ekosystém motorů" # todo: NEW TRANSLATION
 ukraine_tech.301.d: "Ivčenko-Progress navrhuje motory, zatímco Motor Sič je vyrábí. Propojený záporožský komplex stále funguje na zděděných trzích a dodavatelích, což nás nutí volit mezi udržením této sítě při životě a financováním výstavby vlastní." # todo: NEW TRANSLATION
 ukraine_tech.301.t: "Motory pro zmizelé impérium" # todo: NEW TRANSLATION
 ukraine_tech.302.a: "Spolehnout se na zděděné sítě" # todo: NEW TRANSLATION
 ukraine_tech.302.b: "Opatrně diverzifikovat smlouvy" # todo: NEW TRANSLATION
 ukraine_tech.302.d: "Ruské objednávky motorů Motoru Sič a trupů Antonovu udržují továrny v chodu, avšak stejná síť kontroluje součástky, certifikaci i zákazníky. Diverzifikace je nyní nákladná, ale závislost znásobí dopad jakéhokoli budoucího rozkolu." # todo: NEW TRANSLATION
 ukraine_tech.302.t: "Pouta, která nás svazují" # todo: NEW TRANSLATION
 ukraine_tech.303.a: "Úplně přerušit ruský dodavatelský řetězec" # todo: NEW TRANSLATION
 ukraine_tech.303.b: "Přes prostředníky zachovat, co stále funguje" # todo: NEW TRANSLATION
 ukraine_tech.303.d: "Politický rozkol přerušil ruské průmyslové vztahy, na nichž byly Antonov, Motor Sič a Južmaš vybudovány. Okamžitý otřes odráží dříve přijatou míru závislosti a přeživší podniky nyní musí pod tlakem znovu vybudovat dodavatele, standardy i trhy." # todo: NEW TRANSLATION
 ukraine_tech.303.t: "Přetržení" # todo: NEW TRANSLATION
 ukraine_tech.304.a: "Zablokovat prodej a ponechat Motor Sič Ukrajině" # todo: NEW TRANSLATION
 ukraine_tech.304.b: "Povolit čínskou kontrolu" # todo: NEW TRANSLATION
 ukraine_tech.304.d: "Investoři napojení na Čínu usilují o kontrolu nad Motorem Sič, čímž se v jediném sporu střetávají soukromé vlastnictví, zahraniční kapitál, letecké technologie a národní bezpečnost. Továrny Motoru Sič jsou strategické, nejsou však stejnou institucí jako konstrukční kancelář Ivčenko-Progress." # todo: NEW TRANSLATION
 ukraine_tech.304.t: "Komu patří Motor Sič?" # todo: NEW TRANSLATION
 ukraine_tech.305.a: "Vlastní arzenál vybudovaný pod palbou" # todo: NEW TRANSLATION
 ukraine_tech.305.b: "Koridor pro čínský kapitál" # todo: NEW TRANSLATION
 ukraine_tech.305.c: "Obranný průmysl integrovaný se Západem" # todo: NEW TRANSLATION
 ukraine_tech.305.e: "Obnovená postsovětská integrace" # todo: NEW TRANSLATION
 ukraine_tech.305.f: "Nezávislý, rozptýlený průmysl" # todo: NEW TRANSLATION
 ukraine_tech.305.d: "Čtvrt století privatizace, rozvratu, zahraničního kapitálu a totální války rozhodlo o tom, co se stalo s podniky Antonov, Motor Sich a Južmaš a co je nahradilo. To, co přežilo, co bylo vybudováno pod palbou a komu se to nyní zodpovídá, rozhoduje o tom, co si Ukrajina dokáže vyrobit sama." # todo: NEW TRANSLATION
 ukraine_tech.305.t: "Čím se stal ukrajinský průmysl" # todo: NEW TRANSLATION
 ukraine_tech.306.t: "Mrija hoří" # todo: NEW TRANSLATION
 ukraine_tech.306.d: "Ruské jednotky obsadily letiště Antonov v Hostomelu během prvních hodin a An-225 Mrija, největší letoun, jaký byl kdy postaven, a jediná věc, kterou byl ukrajinský průmysl proslulý, shořela ve svém hangáru. Južmaš se nachází v dosahu dělostřelectva u Dnipra. Výrobu lze rozdělit a přesunout na západ, do menších dílen a podzemí, za cenu všech úspor z rozsahu, kolem nichž byly kombináty vybudovány. Nebo mohou závody pokračovat v práci tam, kde stojí." # todo: NEW TRANSLATION
 ukraine_tech.306.a: "Rozptýlit výrobu na západ a do podzemí" # todo: NEW TRANSLATION
 ukraine_tech.306.b: "Nechat závody pracovat tam, kde stojí" # todo: NEW TRANSLATION
 ukraine_tech.307.t: "Čtyři miliony dronů" # todo: NEW TRANSLATION
 ukraine_tech.307.d: "Klastr Brave1 proměnil garážové dílny v zásobovací řetězec a Ukrajina nyní za měsíc vyrábí více útočných dronů, než kolik jich vlastní většina armád. Rheinmetall i Baykar chtějí společné podniky na ukrajinské půdě, což by přineslo kapitál, standardy a objednávky NATO. Stát může vložit vše do domácí základny dronů a raket, kterou již vlastní, nebo vyměnit její část za integraci do spojenecké výroby." # todo: NEW TRANSLATION
 ukraine_tech.307.a: "Financovat suverénní základnu dronů a raket" # todo: NEW TRANSLATION
 ukraine_tech.307.b: "Přijmout společné podniky a spojenecké objednávky" # todo: NEW TRANSLATION
 UKR_strategic_industry_wartime_drone_arsenal: "Válečný arzenál dronů" # todo: NEW TRANSLATION
 UKR_strategic_industry_wartime_drone_arsenal_desc: "Ukrajina vyrábí vlastní drony a rakety ve stovkách rozptýlených dílen, které jediný úder nedokáže vyřadit. Kapacita je domácí, vývoj se měří v týdnech a nikdo jiný nemá veto nad tím, co bude vyrobeno." # todo: NEW TRANSLATION
 UKR_reorganize_navy_category: "Reorganizovat ukrajinské námořnictvo" # todo: NEW TRANSLATION
 UKR_reorganize_navy_category_desc: "\n\n\n\n\n\n£UKR_desctext_reorganize_navy\n\n\n\n\n\n\n\n\nRozhodnutí v této kategorii nám pomohou reorganizovat a zlepšit naše námořnictvo.\nBudeme zde mít oba typy možností: modernizovat či dokončit stavbu starších lodí sovětské konstrukce a dokončit koncepce nových domácích návrhů.\nNěkterá naše rozhodnutí však mohou mít nežádoucí negativní účinky." # todo: NEW TRANSLATION
 UKR_reorganize_navy_finish_ternopil_construction: "Dokončit stavbu korvety §GTernopil §YProjekt 1124MU§!§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_finish_ternopil_construction_desc: "\n\n\n\n\n\n£UKR_desctext_ternopil_corvette_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme vyčlenit část rozpočtu, abychom konečně dokončili dlouho odkládanou výrobu korvety §YU209 „Ternopil“§! „Projekt 1124MU“." # todo: NEW TRANSLATION
 UKR_reorganize_navy_choose_future_corvette: "Zvolit hlavní typ budoucí korvety" # todo: NEW TRANSLATION
 UKR_reorganize_navy_choose_future_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_future_corvette_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme zvolit preferovanou velikost a typ budoucích korvet – tahouna našeho námořnictva." # todo: NEW TRANSLATION
 UKR_reorganize_navy_build_project_58250_corvette: "Zahájit výrobu korvet třídy §YProjekt 58250§! §G„Volodymyr Velykyj“§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_build_project_58250_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_project_58250_for_tooltip\n\n\n\n\n\n\n\n\nTřída §Y„Volodymyr Velykyj“§! neboli třída §YProjekt 58250§! je třídou víceúčelových korvet objednaných ukrajinským námořnictvem.\nNová loď měla být o něco větší než korveta, ale menší než fregata.\nNový projekt byl vyvinut v roce 2008 Státním výzkumným a konstrukčním centrem loďařství.\nOd počátku programu se hovořilo přibližně o deseti takových lodích.\n\nTímto rozhodnutím můžeme zvolit přesný počet korvet, které budou postaveny." # todo: NEW TRANSLATION
 UKR_reorganize_navy_restore_1124: "Prověřit §G2 §Ykorvety Projektu 1124§! kvůli možnému znovuzařazení" # todo: NEW TRANSLATION
 UKR_reorganize_navy_restore_1124_desc: "\n\n\n\n\n\n£UKR_desctext_project_1124_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme prověřit možnost opětovného zařazení 2 našich korvet „Projektu 1124“ vyřazených ze služby.\nBěhem rozdělení Černomořské flotily SSSR v roce 1997 byly §R„MPK-43“§! (přejmenovaná na §YU209 „Sumy“§!) a §R„MPK-52“§! (přejmenovaná na §YU210 „Cherson“§!) převedeny na Ukrajinu, ale kvůli sabotáži z ruské strany byly obě lodě v nebojeschopném stavu.\nKvůli nedostatku prostředků na potřebnou rozsáhlou údržbu a opravy byly obě lodě krátce po přijetí do ukrajinského námořnictva odepsány a zlikvidovány.\nProtože tyto lodě dosud nebyly sešrotovány, můžeme své původní rozhodnutí změnit, najít peníze a renovovat je.\nMějte na paměti, že toto rozhodnutí nás bude stát mnoho a poskytne nám 2 středně velké korvety namísto možnosti investovat do pořízení moderních lodí." # todo: NEW TRANSLATION
 UKR_reorganize_navy_buy_lithuanian_1124: "Vyjádřit zájem o nákup §G2 §Ykorvet Projektu 1124§!\nz Litvy" # todo: NEW TRANSLATION
 UKR_reorganize_navy_buy_lithuanian_1124_desc: "\n\n\n\n\n\n£UKR_desctext_lithuanian_corvettes_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme Litvě zaslat diplomatickou žádost o zvážení možného prodeje 2 korvet „Projektu 1124“, pojmenovaných §YF11 „Žemaitis“§! a §YF12 „Aukštaitis“§!.\nTyto 2 lodě byly po rozpadu SSSR převedeny litevským ozbrojeným silám a jde o poměrně staré bojové jednotky.\nPřesto se jedná o stejný typ lodí, jaký již v našem námořnictvu máme, takže jejich výcvik, údržba a bojové nasazení pro nás nebudou problémem.\nNákup těchto lodí však sníží objem dostupných prostředků na případné pořízení novějších plavidel." # todo: NEW TRANSLATION
 UKR_reorganize_navy_maintain_1135: "Udržovat §G3 §Yfregaty Projektu 1135§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_maintain_1135_desc: "\n\n\n\n\n\n£UKR_desctext_project_1135_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme financovat naše námořnictvo, aby řádně udržovalo a vrátilo do aktivní služby 3 naše fregaty „Projektu 1135“.\nV červenci 1997 byly v souladu s ukrajinsko-ruskou dohodou o parametrech rozdělení Černomořské flotily převedeny na Ukrajinu tři hlídkové lodě Černomořské flotily SSSR: §R„Razitělnyj“§! (přejmenovaná na §YU132 „Sevastopol“§!), §R„Bezukorizněnnij“§! (přejmenovaná na §YU133 „Mykolajiv“§!) a §R„Bezzavetnyj“§! (přejmenovaná na §YU134 „Dnipropetrovsk“§!).\nŽádná z nich však nebyla kvůli nedostatku prostředků na opravy a obnovu technické způsobilosti využívána jako bojová jednotka a brzy byla vyřazena ze služby." # todo: NEW TRANSLATION
 UKR_reorganize_navy_maintain_1241: "Udržovat §G3 §Ymalé korvety Projektu 1241§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_maintain_1241_desc: "\n\n\n\n\n\n£UKR_desctext_project_1241_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme financovat naše námořnictvo, aby řádně udržovalo a vrátilo do aktivní služby 3 naše malé korvety „Projektu 1241“.\nV roce 1997 získala Ukrajina během rozdělení Černomořské flotily 4 korvety typu „Projekt 1241“ ve 2 různých rolích: 2 raketové čluny, §YU155 „Nikopol“§! a §YU156 „Kremenčuk“§!, a 2 malé protiponorkové korvety: §YU207 „Užhorod“§! a §YU208 „Chmelnyckyj“§!. Pouze raketový člun §YU155 „Nikopol“§! byl převeden v dobrém stavu, zatímco ostatní 3 plavidla byla dodána v nebojeschopném stavu a kvůli nedostatku prostředků na opravy a obnovu technické způsobilosti dosud nejsou v aktivní službě." # todo: NEW TRANSLATION
 UKR_reorganize_navy_maintain_641_submarine: "Udržovat ponorku §GZáporoží §YProjekt 641§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_maintain_641_submarine_desc: "\n\n\n\n\n\n£UKR_desctext_zaporizhzhia_submarine_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme financovat naše námořnictvo, aby řádně udržovalo a vrátilo do aktivní služby naši jedinou ponorku – §YU01 „Záporoží“§! „Projektu 641“.\nV roce 1997 ji správa ruského námořnictva během rozdělení Černomořské flotily předala ukrajinskému námořnictvu, protože nedokázala opravit nepoužívanou ponorku.\nBohužel baterie ponorky trvale selhaly a pro její zprovoznění byla nutná kompletní údržba a výměna baterií.\nMůžeme vyčlenit prostředky na opravu ponorky." # todo: NEW TRANSLATION
 UKR_reorganize_navy_finish_11451: "Dokončit stavbu §G2 §Ykorvet Projektu 11451§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_finish_11451_desc: "\n\n\n\n\n\n£UKR_desctext_project_11451_for_tooltip\n\n\n\n\n\n\n\n\n„Projekt 11451“ je série malých protiponorkových lodí (korvet) stavěných od roku 1987 v loděnici More ve Feodosiji; před rozpadem SSSR byly dokončeny pouze 2.\nKorvety §YU201 „Lvov“§! (připravenost stavby téměř 95 %) a §YU203 „Luhansk“§! (připravenost stavby téměř 60 %) stále zůstávají na skluzu loděnice More ve Feodosiji.\nKvůli ukončení státního financování byla dostavba lodí pozastavena, nyní však můžeme konečně rozhodnout o jejich dalším osudu." # todo: NEW TRANSLATION
 UKR_reorganize_navy_finish_ukrayina: "Dokončit stavbu křižníku §GUkrayina§!\n§YProjekt 1164§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_finish_ukrayina_desc: "\n\n\n\n\n\n£UKR_desctext_ukrayina_cruiser_for_tooltip\n\n\n\n\n\n\n\n\n§Y„Ukrayina“§! je nedokončený křižník sovětské konstrukce „Třídy Projekt 1164“.\nKvůli rozpočtovým omezením byly práce na křižníku na počátku 90. let zastaveny a loď zůstala nedokončena. V roce 1993 byl křižník vyřazen z ruského námořnictva a předán Ukrajině.\nMůžeme investovat hrstku peněz do dokončení stavby a poté ukázat skutečnou námořní sílu Ukrajiny v Černém moři!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_finish_ternopil_construction_flag: " Dokončené rozhodnutí Dokončit stavbu §GTernopil§! §YProjekt 1124MU§! §Gkorvety§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_funded_project_58250_corvette_development_flag: " Dokončená událost §YSoustředit se na víceúčelové korvety§! s vybranou možností §GVyčlenit rozpočet§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_not_funded_project_58250_corvette_development_flag: " Dokončená událost §YSoustředit se na víceúčelové korvety§! s vybranou možností §RŠkrtnout výdaje§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_developed_project_58250_corvette_development_flag: " Dokončená událost §YPostavit korvety třídy Projekt 58200 „Hayduk-21“§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_repair_rivne: "Opravit velkou výsadkovou loď §GRivne§! §YProjekt 1171§!" # todo: NEW TRANSLATION
 UKR_reorganize_navy_repair_rivne_desc: "\n\n\n\n\n\n£UKR_desctext_rivne_lst_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme financovat naše námořnictvo, aby řádně udržovalo a vrátilo do aktivní služby velkou výsadkovou loď §YU762 „Rivne“§! „Projektu 1171“.\nDne 10. dubna 1994 obsadila ukrajinská výsadková rota z Bolhradu násilím vojenský tábor v Praktickém přístavu Oděského námořního přístavu, kde se nacházely výsadkové lodě „Projektu 1171“ „Ilya Azarov“ a „Projektu 773“ SDK-137, a 18. dubna 1994 byla loď jednostranným aktem přijata do námořnictva Ozbrojených sil Ukrajiny.\nBohužel se kvůli nedostatku prostředků na opravy a obnovu technické způsobilosti větší loď stala jako platforma LST neprovozuschopnou, byla překlasifikována na vojenskou loď pro přepravu suchého nákladu a nyní není v bojeschopném stavu.\nMůžeme vyčlenit prostředky na opravu lodi a vrátit ji do aktivní služby jako LST nebo alespoň jako podpůrné plavidlo." # todo: NEW TRANSLATION
 UKR_reorganize_navy_repair_support_ships: "Opravit §G4§! §Ypodpůrná§! a §Yopravárenská§! plavidla, která jsou nyní v nebojeschopném stavu" # todo: NEW TRANSLATION
 UKR_reorganize_navy_repair_support_ships_desc: "\n\n\n\n\n\n£UKR_desctext_support_ships_for_tooltip\n\n\n\n\n\n\n\n\nMůžeme financovat naše námořnictvo, aby řádně udržovalo a vrátilo do aktivní služby několik podpůrných plavidel, například velký námořní tanker §YU757 „Makijivka“§!, střední tanker §YU758 „Kerč“§!, malý tanker §YU759 „Bachmač“§! a plovoucí dílnu §Y„Olviya“§!.\nV roce 2000 nebyla žádná ze zmíněných lodí kvůli nedostatku prostředků na opravy a obnovu technické způsobilosti používána jako aktivní jednotka a brzy byla vyřazena ze služby." # todo: NEW TRANSLATION
 UKR_reorganize_navy_build_lahuna_recon_ship: "Projekt §YLahuna§!: §Yprůzkumná§! loď" # todo: NEW TRANSLATION
 UKR_reorganize_navy_build_lahuna_recon_ship_desc: "\n\n\n\n\n\n£UKR_desctext_simferopol_recon_for_tooltip\n\n\n\n\n\n\n\n\nNámořnictvo chce loď pro rádiový průzkum, ale nemá peníze na účelově navrženou loď. Kuzňa na Rybalskomu má trup trawleru, skluz a čtyři desetiletí zkušeností s opakovanou stavbou stejné lodi o výtlaku 1 220 tun.\n\nPadesát pět metrů, 29 členů posádky, dosah 7 200 mil, dvacet osm dní na moři. Její zbraní je anténní farma." # todo: NEW TRANSLATION
 UKR_lahuna_needs_kuznya_tt: "Musíme ovládat kyjevskou loděnici" # todo: NEW TRANSLATION
 UKR_lahuna_needs_black_sea_port_tt: "Musíme vlastnit černomořský přístav, abychom ji mohli přijmout" # todo: NEW TRANSLATION
 UKR_lahuna_progress_tt: "Postup stavby Lahuny se zvyšuje" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_restore_1124.1.name: "Znovuzařazení 2 korvet „Projektu 1124“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_restore_1124.1.desc: "Prověřili jsme 2 trupy korvet „Projektu 1124“, „U204 Sumy“ (číslo změněné kvůli nové korvetě „Ternopil“, která převzala označení U209) a „U210 Cherson“, a nyní můžeme zvolit nejvhodnější postup při rozhodování o jejich osudu.\nMůžeme buď investovat více peněz a znovu aktivovat obě lodě, nebo sešrotovat loď v horším stavu, „U210 Cherson“, a použít její součástky k rychlejšímu zprovoznění „U204 Sumy“." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_restore_1124.1.a: "Znovu aktivovat obě lodě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_restore_1124.1.b: "Využít „Cherson“ k opětovnému zprovoznění „Sumy“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.1.name: "Program budoucí ukrajinské korvety" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.1.desc: "Dosáhli jsme bodu, kdy již nelze odkládat rozhodnutí o hlavním tahounovi naší budoucí flotily.\nMůžeme vybírat z několika domácích návrhů, ale hlavním rozhodnutím musí být, na jaký typ korvet zaměříme své zdroje: na levnější a snadněji vyráběné lehké korvety o přibližně 700 tunách, standardní korvety o výtlaku 1 200 a více tun, nebo těžké víceúčelové korvety o výtlaku 2 000 a více tun." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.1.a: "Lehké korvety" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.1.b: "Standardní korvety" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.1.c: "Víceúčelové korvety" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.2.name: "Zaměřit se na menší korvety" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.2.desc: "Zvolili jsme nejlevnější možnost ze všech dostupných a budeme pokračovat s korvetami třídy „Muson“ jako nejnovějším přírůstkem naší flotily.\nVyberme počet lodí, jejichž stavbu schválíme." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.2.a: "16 lodí (4×4)" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.2.b: "12 lodí (4×3)" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.2.c: "8 lodí (2×4)" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.3.name: "Zaměřit se na standardní korvety" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.3.desc: "Zvolili jsme nejzřejmější možnost ze všech dostupných a budeme pokračovat se standardně velkými korvetami jako nejnovějším přírůstkem naší flotily.\nVyberme přesnou třídu lodí, které postavíme." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.3.a: "Třída Projekt 58200 „Hayduk-21“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.3.b: "Třída „Mistral-1500T“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.3.c: "Třída „Mirazh“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.4.name: "Zaměřit se na víceúčelové korvety" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.4.desc: "Zvolili jsme nejvýkonnější možnost ze všech dostupných a budeme pokračovat s většími víceúčelovými korvetami jako nejnovějším přírůstkem naší flotily.\nPůjde o korvety třídy Projekt 58250 „Volodymyr Velykyj“.\nBohužel v současnosti nemáme přesně vyvinutý model, takže budeme muset vynaložit peníze a čas na jeho výzkum." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.4.a: "Vyčlenit rozpočet" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.4.b: "Omezit výdaje" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.5.name: "Postavit korvety třídy Projekt 58200 „Hayduk-21“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.5.desc: "V důsledku našeho nezávislého výběrového řízení jsme jako nejnovější přírůstek naší flotily vybrali korvety třídy Projekt 58200 „Hayduk-21“.\nVyberme počet lodí, jejichž stavbu schválíme." # todo: NEW TRANSLATION
