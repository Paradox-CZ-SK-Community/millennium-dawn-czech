 UKR_aamdf: "Protiletadlové raketové síly" # todo: NEW TRANSLATION
 UKR_aamdf_desc: "Organizované protiletadlové raketové síly výrazně posilují naši protivzdušnou obranu a snižují účinnost nepřátelské letecké podpory." # todo: NEW TRANSLATION
 UKR_radio_troops: "Radiotechnické jednotky" # todo: NEW TRANSLATION
 UKR_radio_troops_desc: "Radiotechnické a spojovací jednotky letectva zlepšují průzkum a zachycování cílů a zároveň snižují ztráty letadel." # todo: NEW TRANSLATION
 UKR_air_support_fac: "Zařízení letecké podpory" # todo: NEW TRANSLATION
 UKR_air_support_fac_desc: "Investice do zařízení letecké podpory zlepšují palivovou účinnost a spolehlivost letadel, snižují provozní náklady a zvyšují výkon." # todo: NEW TRANSLATION
 UKR_cut_subsidies: "Omezit energetické dotace" # todo: NEW TRANSLATION
 UKR_cut_subsidies_desc: "Zrušení energetických dotací nutí spotřebitele nést skutečné výrobní náklady, čímž zvyšuje produktivitu a snižuje tlak na veřejné finance." # todo: NEW TRANSLATION
 UKR_health_cost: "Zdravější národ!" # todo: NEW TRANSLATION
