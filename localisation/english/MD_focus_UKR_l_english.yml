 UKR_natpolice_decision_category_desc: "Hlídková služba policie zvláštního určení Ukrajiny je službou v rámci Oddělení hlídkové policie Ukrajiny pod Národní policií Ukrajiny. Byla vytvořena jako součást Ministerstva vnitra Ukrajiny coby struktura speciálních jednotek pro ochranu veřejného pořádku.\n\nTato struktura se stala součástí Národní policie Ukrajiny. Služba sdružuje bývalé prapory a pluky Ministerstva vnitra." # todo: NEW TRANSLATION
