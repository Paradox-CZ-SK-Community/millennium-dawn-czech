 UKR_fedrada_category: "Federální rada" # todo: NEW TRANSLATION
 UKR_fedrada_category_desc: "Federální rada je vládní orgán ve federalizované Ukrajině, vytvořený pro interakci subjektů federace s federálním centrem.\n\n§YSubjekty Ukrajinské federace§! mohou být §Ganektovány§! [UKR.GetFlag]Ukrajinou, avšak pod podmínkou §Yvlivu§! na subjekty ve §Yvýši 50 %§!" # todo: NEW TRANSLATION
