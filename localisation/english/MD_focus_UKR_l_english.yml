 UKR_health_rehabilitaion: "Národní rehabilitační program" # todo: NEW TRANSLATION
 UKR_health_rehabilitaion_desc: "Rozvíjejte rehabilitační zařízení pro zraněné a zdravotně postižené občany včetně vojáků s cílem obnovit kvalitu jejich života." # todo: NEW TRANSLATION
