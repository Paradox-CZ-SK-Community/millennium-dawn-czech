 ukraine_kommi.1.t: "Ukraine Asks For Nuclear Weapons" # todo: NEW TRANSLATION
 ukraine_kommi.1.d: "Nečekané prohlášení přišlo z ukrajinské vlády. Chtějí od nás získat jaderné zbraně, aby se bránili proti vnějším útokům. Takové nebezpečné rozhodnutí vyžaduje zvážení pro a proti" # todo: NEW TRANSLATION
 ukraine_kommi.1.a: "Dáme jim jaderné zbraně" # todo: NEW TRANSLATION
 ukraine_kommi.1.b: "Nebudeme jim dávat jaderné zbraně" # todo: NEW TRANSLATION
 ukraine_kommi.2.t: "Russian Nuclear Weapons" # todo: NEW TRANSLATION
 ukraine_kommi.2.d: "Souhlasili s poskytnutím části jaderných zbraní" # todo: NEW TRANSLATION
 ukraine_kommi.2.a: "Dobře" # todo: NEW TRANSLATION
 ukraine_kommi.4.t: "" # todo: NEW TRANSLATION
 ukraine_kommi.4.d: "" # todo: NEW TRANSLATION
 ukraine_kommi.4.a: "" # todo: NEW TRANSLATION
 ukraine_kommi.5.t: "Ukraine Offers Military Cooperation" # todo: NEW TRANSLATION
 ukraine_kommi.5.d: "The Ukrainian government says it is ready to sign a number of documents on military-political cooperation between our countries" # todo: NEW TRANSLATION
 ukraine_kommi.5.a: "We Are For Friendship With Ukraine" # todo: NEW TRANSLATION
 ukraine_kommi.5.b: "We won't sign anything" # todo: NEW TRANSLATION
 ukraine_kommi.6.t: "Military Cooperation With Russia" # todo: NEW TRANSLATION
 ukraine_kommi.6.d: "They agreed to sign agreements on military-political cooperation with us" # todo: NEW TRANSLATION
 ukraine_kommi.6.a: "Skvělé" # todo: NEW TRANSLATION
 ukraine_kommi.7.t: "Military Cooperation With Russia" # todo: NEW TRANSLATION
 ukraine_kommi.7.d: "They refused to sign agreements on military-political cooperation with us" # todo: NEW TRANSLATION
 ukraine_kommi.7.a: "Škoda" # todo: NEW TRANSLATION
 ukraine_kommi.8.t: "United Democratic State" # todo: NEW TRANSLATION
 ukraine_kommi.8.d: "The Ukrainian government suggests that we create a single democratic state in the vastness of Europe, a kind of third center of power, will we agree to lose independence for the sake of some dream of a third force?" # todo: NEW TRANSLATION
 ukraine_kommi.8.a: "Nezávislost Je Fikce" # todo: NEW TRANSLATION
 ukraine_kommi.8.b: "Nikdy" # todo: NEW TRANSLATION
 ukraine_kommi.9.t: "United Democratic State" # todo: NEW TRANSLATION
 ukraine_kommi.9.d: "They refused our offer! It was expected, but so pathetic on their part" # todo: NEW TRANSLATION
 ukraine_kommi.9.a: "Nerozumí." # todo: NEW TRANSLATION
 ukraine_union.1.t: "Ukrajina navrhuje úplný svazový stát" # todo: NEW TRANSLATION
 ukraine_union.1.d: "Kyjev nabízí rozpuštění své státnosti v naší a sloučení obou národů do jediného svazového státu pod ukrajinským vedením. Každé území, každý majetek i každý voják by přešly pod jejich správu. Vzdáme se kvůli tomuto svazu své nezávislosti?" # todo: NEW TRANSLATION
 ukraine_union.1.a: "Přijímáme svaz" # todo: NEW TRANSLATION
 ukraine_union.1.b: "Svého státu se nevzdáme" # todo: NEW TRANSLATION
 ukraine_union.2.t: "Rusko odmítá svaz" # todo: NEW TRANSLATION
 ukraine_union.2.d: "Moskva odmítá rozpuštění ve prospěch našeho svazového státu. Sen o jediném národě od Karpat až po Tichý oceán bude muset počkat." # todo: NEW TRANSLATION
 ukraine_union.2.a: "Promarněná příležitost" # todo: NEW TRANSLATION
 ukraine_union.3.t: "Ukrajina navrhuje společný vstup do NATO" # todo: NEW TRANSLATION
 ukraine_union.3.d: "Kyjev nás zve, abychom opustili naše současná spojenectví a společně s ním vstoupili do NATO, čímž bychom změnili bezpečnostní uspořádání východní Evropy. Vydáme se touto cestou společně?" # todo: NEW TRANSLATION
 ukraine_union.3.a: "Vstoupíme společně do NATO" # todo: NEW TRANSLATION
 ukraine_union.3.b: "Naše místo není v NATO" # todo: NEW TRANSLATION
 ukraine_union.4.t: "Rusko odmítá členství v NATO" # todo: NEW TRANSLATION
 ukraine_union.4.d: "Moskva odmítá vstoupit do NATO společně s námi. Svou západní cestu budeme muset naplánovat sami." # todo: NEW TRANSLATION
 ukraine_union.4.a: "Ať se tak stane" # todo: NEW TRANSLATION
 ukraine_kommi.10.t: "Ukrajina žádá o ochranu" # todo: NEW TRANSLATION
 ukraine_kommi.10.d: "Ukrajinská vláda nás žádá, abychom jim poskytli záruky na ochranu jejich nezávislosti. Neočekávaná žádost, ale možná bychom ji měli zvážit" # todo: NEW TRANSLATION
 ukraine_kommi.10.a: "Budeme je chránit" # todo: NEW TRANSLATION
 ukraine_kommi.10.b: "Nikdy" # todo: NEW TRANSLATION
 ukraine_kommi.11.t: "Ruská záruka ochrany" # todo: NEW TRANSLATION
 ukraine_kommi.11.d: "Ruská vláda souhlasila s poskytnutím záruk nezávislosti!" # todo: NEW TRANSLATION
 ukraine_kommi.11.a: "Dobré" # todo: NEW TRANSLATION
 ukraine_kommi.12.t: "Ruská záruka ochrany" # todo: NEW TRANSLATION
 ukraine_kommi.12.d: "Ruská vláda odmítla poskytnout záruky nezávislosti" # todo: NEW TRANSLATION
 ukraine_kommi.12.a: "Sakra" # todo: NEW TRANSLATION
 ukraine_kommi.13.t: "Plynová smlouva s Ukrajinou." # todo: NEW TRANSLATION
 ukraine_kommi.13.d: "Ukrajina nám navrhla snížit ceny při nákupu naší plynové smlouvy; výměnou bude odstraněn prostředník mezi námi, čímž budeme mít nad nimi větší vliv. Měli bychom s tím souhlasit?" # todo: NEW TRANSLATION
 ukraine_kommi.13.a: "Podepíšeme to" # todo: NEW TRANSLATION
 ukraine_kommi.13.b: "Toto nás nezajímá." # todo: NEW TRANSLATION
 ukraine_kommi.14.t: "Plynová smlouva s Ruskem." # todo: NEW TRANSLATION
 ukraine_kommi.14.d: "Souhlasili s změnou podmínek naší plynové smlouvy, nyní budeme platit méně!" # todo: NEW TRANSLATION
 ukraine_kommi.14.a: "Dobré" # todo: NEW TRANSLATION
 ukraine_kommi.15.t: "Plynová smlouva s Ruskem." # todo: NEW TRANSLATION
 ukraine_kommi.15.d: "Souhlasili se změnou podmínek naší plynové smlouvy, nyní budeme platit méně!" # todo: NEW TRANSLATION
 ukraine_kommi.15.a: "Dobré" # todo: NEW TRANSLATION
 ukraine_kommi.16.t: "Komunistické povstání na východě" # todo: NEW TRANSLATION
 ukraine_kommi.16.d: "Komunistické povstání podporované Kyjevem obsadilo několik našich východních provincií a s ukrajinskou podporou vyhlásilo nezávislost. Na to nezapomeneme." # todo: NEW TRANSLATION
 ukraine_kommi.16.a: "Na to nezapomeneme" # todo: NEW TRANSLATION
 UKR_inner_policy_spu: "Domácí politika" # todo: NEW TRANSLATION
 UKR_inner_policy_spu_desc: "Nakonec se v Ukrajině vrátily komunistické ideály, je čas oživit velký stát" # todo: NEW TRANSLATION
 UKR_brotherhood_people: "Bratrstvo lidu" # todo: NEW TRANSLATION
 UKR_brotherhood_people_desc: "Komunistické sociální hnutí zdůrazňující kolektivní blahobyt a solidaritu snižuje zátěž spotřebního zboží a zároveň posiluje ideologickou obranu." # todo: NEW TRANSLATION
 UKR_social_reform: "Sociální reformy" # todo: NEW TRANSLATION
 UKR_social_reform_desc: "Rozšíření sociálního zabezpečení snižuje náklady na zdravotnictví a sociální péči a zároveň zlepšuje životní úroveň pod komunistickou správou." # todo: NEW TRANSLATION
 UKR_inner_policy_cpu: "Domácí politika" # todo: NEW TRANSLATION
 UKR_inner_policy_cpu_desc: "Nakonec se v Ukrajině vrátily socialistické ideály, je čas oživit velký stát" # todo: NEW TRANSLATION
 UKR_equal_rights_idea: "Rovná práva" # todo: NEW TRANSLATION
 UKR_equal_rights_idea_desc: "Uplatňování politiky rovných práv napříč všemi skupinami obyvatel snižuje byrokratickou zátěž a posiluje politickou jednotu." # todo: NEW TRANSLATION
 UKR_west_investors_idea: "Západní investoři" # todo: NEW TRANSLATION
 UKR_west_investors_idea_desc: "Účast na západním trhu přinesla kapitál a ekonomické znalosti, podpořila rozvoj podnikání a důvěru veřejnosti v hospodářství." # todo: NEW TRANSLATION
 UKR_our_investors_idea: "Naši investoři" # todo: NEW TRANSLATION
 UKR_our_investors_idea_desc: "Kapitál západních investorů stimuluje výzkumné kapacity, stabilizuje hospodářské cykly a posiluje nezávislost zahraniční politiky." # todo: NEW TRANSLATION
 UKR_socialist_effort: "Socialistické reformy" # todo: NEW TRANSLATION
 UKR_socialist_effort_desc: "Hospodářská mobilizace socialistické výroby zvyšuje stabilitu, růst populace a dostupnost spotřebního zboží." # todo: NEW TRANSLATION
