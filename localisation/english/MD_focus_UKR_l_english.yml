 UKR_prp_independent_republic: "Vyhlásit nezávislou republiku" # todo: NEW TRANSLATION
 UKR_prp_independent_republic_desc: "Prozatímní vláda může ukončit své podřízené postavení a přijmout rizika samostatné existence." # todo: NEW TRANSLATION
 UKR_prp_regional_union: "Vybudovat regionální unii" # todo: NEW TRANSLATION
 UKR_prp_regional_union_desc: "Spolupracovat s existujícím uspořádáním Novorossije namísto vytváření další konkurenční značky." # todo: NEW TRANSLATION
 DRP_pivdenmash_rearmament: "Obnovit Pivdenmaš" # todo: NEW TRANSLATION
 DRP_pivdenmash_rearmament_desc: "Staré závody Južmaš na výrobu raket a těžkých strojů mohou stále vyrábět zbraně, pokud bude někdo ochoten znovu otevřít jejich provozy." # todo: NEW TRANSLATION
 DRP_industrial_mobilization: "Mobilizovat průmysl Dnipra" # todo: NEW TRANSLATION
 DRP_industrial_mobilization_desc: "Sovětskou průmyslovou základnu Dnipra lze přesměrovat k potřebám republiky, ovšem za cenu veškeré civilní výroby, kterou ještě zvládá." # todo: NEW TRANSLATION
 DRP_dnieper_logistics: "Zajistit logistiku na Dněpru" # todo: NEW TRANSLATION
 DRP_dnieper_logistics_desc: "Řeka vždy přepravovala zboží tohoto regionu. Obnova přístavišť a přístupových silnic udrží tento provoz pod kontrolou republiky." # todo: NEW TRANSLATION
 DRP_kolomoisky_purge: "Očistit Kolomojského síť" # todo: NEW TRANSLATION
 DRP_kolomoisky_purge_desc: "Oligarchova patronátní síť stále prostupuje místní správou a podnikáním. Její odstranění uvolní cestu vlastním lidem republiky." # todo: NEW TRANSLATION
 DRP_state_security_consolidation: "Konsolidovat státní bezpečnost" # todo: NEW TRANSLATION
 DRP_state_security_consolidation_desc: "Řádná bezpečnostní služba odpovědná republice, nikoli frakci ovládající daný okres, už dávno chybí." # todo: NEW TRANSLATION
 DRP_moscow_alignment: "Sblížit se s Moskvou" # todo: NEW TRANSLATION
 DRP_moscow_alignment_desc: "Formalizace vojenských a hospodářských vazeb s Moskvou obětuje nezávislost jednání výměnou za patrona, který nedovolí republice padnout." # todo: NEW TRANSLATION
 UKR_our_agricultrure: "Domácí zemědělství" # todo: NEW TRANSLATION
 UKR_our_agricultrure_desc: "Ukrajinský zemědělský průmysl patří k nejlepším na světě a my se budeme snažit neho ztratit tento titul" # todo: NEW TRANSLATION
 UKR_azovsteel: "Azovstal" # todo: NEW TRANSLATION
 UKR_azovsteel_desc: "Kontrola ocelárenského komplexu Azovstal zajišťuje stálé dodávky vysoce kvalitní oceli pro průmyslovou a vojenskou výrobu." # todo: NEW TRANSLATION
 UKR_yushenko_premier_idea: "Vláda Jushčenka" # todo: NEW TRANSLATION
 UKR_yushenko_premier_idea_desc: "Viktor Juščenko působí za Kučmy jako premiér, rozšiřuje svou politickou autoritu a vede vládu k neutralitě." # todo: NEW TRANSLATION
 UKR_yanuk_premier_idea: "Vláda Yanukovyče" # todo: NEW TRANSLATION
 UKR_yanuk_premier_idea_desc: "Viktor Janukovyč působí za Kučmy jako premiér, rozšiřuje svou politickou autoritu a posouvá vládu doleva." # todo: NEW TRANSLATION
 UKR_unstable_government_idea: "Nespokojenost s Majdanem" # todo: NEW TRANSLATION
 UKR_unstable_government_idea_desc: "Politická nestabilita oslabila kontrolu vlády a umožnila různým ideologickým frakcím využívat nepokoje pro vlastní cíle." # todo: NEW TRANSLATION
 UKR_land_reform_idea: "Pozemková reforma" # todo: NEW TRANSLATION
 UKR_land_reform_idea_desc: "Pozemková reforma zahájena v minulém století by měla vést k úplnému přeřezení pozemků po celé zemi. Zatím je v procesu" # todo: NEW TRANSLATION
 UKR_land_reform_idea3_desc: "Pozemková reforma zahájená v minulém století by měla vést k úplnému přerozdělení půdy v celé zemi. Zatím stále probíhá." # todo: NEW TRANSLATION
 UKR_zaims: "Ekonomické důsledky zrušení půjček" # todo: NEW TRANSLATION
 UKR_zaims_desc: "Krátkodobé mezinárodní půjčky stabilizovaly ekonomiku a zvýšily daňové příjmy, zároveň však vytvořily značné budoucí dluhové závazky." # todo: NEW TRANSLATION
 UKR_social_discontent: "Vážná nespokojenost lidu" # todo: NEW TRANSLATION
 UKR_social_discontent_desc: "Rozsáhlé škrty ve zdravotnictví, školství a sociálních výdajích ulevují státní pokladně za cenu veřejné důvěry." # todo: NEW TRANSLATION
 UKR_banks_lobbyst_liquidate: "Likvidace bankovních lobbistů" # todo: NEW TRANSLATION
 UKR_banks_lobbyst_liquidate_desc: "Odstranění bankovních zájmů z vlády přesměrovává příjmy z podnikových daní a oslabuje vliv finančních elit na politiku." # todo: NEW TRANSLATION
 UKR_mining_company_help: "Daňové výhody pro těžařské společnosti" # todo: NEW TRANSLATION
 UKR_mining_company_help_desc: "Daňové pobídky pro těžební společnosti poskytují úlevu v období hospodářského tlaku." # todo: NEW TRANSLATION
 UKR_privatization_idea: "Privatizace" # todo: NEW TRANSLATION
 UKR_privatization_idea_desc: "Privatizace státních podniků zvyšuje efektivitu továren a zlepšuje obchodní vztahy za cenu politické moci." # todo: NEW TRANSLATION
 UKR_without_kuchma_idea: "Ukrajina bez Kučmy" # todo: NEW TRANSLATION
 UKR_without_kuchma_idea_desc: "Hnutí „Ukrajina bez Kučmy“ mobilizovalo nacionalistické nálady proti domnělé oligarchické korupci a autoritářské vládě." # todo: NEW TRANSLATION
 UKR_left_opposition_idea: "Levá opozice" # todo: NEW TRANSLATION
 UKR_left_opposition_idea_desc: "Levicové politické hnutí mobilizuje dělníky a intelektuály proti vládnoucí vládě a destabilizuje stávající řád." # todo: NEW TRANSLATION
 UKR_luaz_idea: "LuAZ" # todo: NEW TRANSLATION
 UKR_luaz_idea_desc: "Podpora domácího výrobce automobilů LUAZ snižuje výrobní náklady vozidel a nákladních automobilů." # todo: NEW TRANSLATION
 UKR_anti_socialist_media: "Antisocialistická média" # todo: NEW TRANSLATION
 UKR_anti_socialist_media_desc: "Média spojená se státem potlačují komunistické a neutrální nálady a posilují vliv reakční vlády na veřejné mínění." # todo: NEW TRANSLATION
 UKR_crisis_political: "Politická krize" # todo: NEW TRANSLATION
 UKR_crisis_political_desc: "Naše země je sužována politickou krizí, úřady jsou paralyzovány a politické síly bojují o moc" # todo: NEW TRANSLATION
 UKR_seuar_autonomy_movement: "Hnutí SEUAR za autonomii" # todo: NEW TRANSLATION
 UKR_seuar_autonomy_movement_desc: "Jihovýchodní hnutí za autonomii zpochybňuje autoritu Kyjeva. Jeho budoucnost závisí na rovnováze mezi místními organizátory a tlakem státu." # todo: NEW TRANSLATION
 UKR_western_crisis_idea: "Vláda západní Ukrajiny" # todo: NEW TRANSLATION
 UKR_western_crisis_idea_desc: "Západní oblasti odmítají uznat zmanipulované volby a vyhlásily vlastní vládu. Patová situace ochromí celostátní politiku, dokud Kyjev nevyřeší otázku západu." # todo: NEW TRANSLATION
 UKR_constitutional_compromise_idea: "Ústavní kompromis" # todo: NEW TRANSLATION
 UKR_constitutional_compromise_idea_desc: "Ústavní uspořádání, které ukončilo krizi autonomie, přenáší skutečnou moc na regiony. Uklidňuje jihovýchod za cenu oslabení centrální vlády." # todo: NEW TRANSLATION
 ukraine_kuchma.2.t: "Příprava na protesty" # todo: NEW TRANSLATION
 ukraine_kuchma.2.d: "Naše kroky jednoznačně povedou k protestům, musíme se připravit." # todo: NEW TRANSLATION
 ukraine_kuchma.2.a: "Budeme připraveni" # todo: NEW TRANSLATION
 ukraine_kuchma.2.b: "Vše se vyřeší samo" # todo: NEW TRANSLATION
 ukraine_kuchma.12.t: "Přátelství s Donětským klanem" # todo: NEW TRANSLATION
 ukraine_kuchma.12.d: "Budeme se snažit přitáhnout na naši stranu takzvaný Donětský klan oligarchů, v budoucí konfrontaci s opozicí nám budou užiteční." # todo: NEW TRANSLATION
 ukraine_kuchma.12.a: "Donbas je s námi" # todo: NEW TRANSLATION
 ukraine_kuchma.12.b: "Nepodpoříme je" # todo: NEW TRANSLATION
 ukraine_kuchma.13.t: "Yanukovyč se stane prezidentem" # todo: NEW TRANSLATION
 ukraine_kuchma.13.d: "Nepřijmeme výsledky druhého kola prezidentské volby a jmenujeme Yanukovyče prezidentem Ukrajiny." # todo: NEW TRANSLATION
 ukraine_kuchma.13.a: "Tak ať to je" # todo: NEW TRANSLATION
 ukraine_kuchma.14.t: "Protesty na jihovýchodě" # todo: NEW TRANSLATION
 ukraine_kuchma.14.d: "Po našem vítězství ve volbách jsme si mysleli, že vše skončilo, ale nyní jihovýchod naší země začal projevovat silnou protestní aktivitu. Takzvaný „Modrý Majdan“ začal vyvíjet na naši vládu tlak a hrozí vážnými následky." # todo: NEW TRANSLATION
 ukraine_kuchma.14.a: "Musíme být opatrnější." # todo: NEW TRANSLATION
 ukraine_kuchma.15.t: "Modrý Majdan na Ukrajině" # todo: NEW TRANSLATION
 ukraine_kuchma.15.d: "Aktivisté na jihovýchodě Ukrajiny nadále rozvíjejí svůj autonomní projekt, zatímco kyjevské úřady si vyměňují křesla v radových kancelářích; blíží se velká bouře. Příznivci Modrého Majdanu nás požádali o podporu, pomůžeme jim?" # todo: NEW TRANSLATION
 ukraine_kuchma.15.a: "Podpoříme je." # todo: NEW TRANSLATION
 ukraine_kuchma.15.b: "Neměli bychom zasahovat" # todo: NEW TRANSLATION
 ukraine_kuchma.16.t: "Vláda Jihovýchodu" # todo: NEW TRANSLATION
 ukraine_kuchma.16.d: "Takzvaní aktivisté Modrého Majdanu oficiálně oznámili vznik své vlády a že neuznávají kyjevskou vládu. Zdá se, že byli podporováni zvenčí, jinak by se pro takové rozhodnutí nerozhodli." # todo: NEW TRANSLATION
 ukraine_kuchma.16.a: "Okamžitě pošlete tam policii" # todo: NEW TRANSLATION
 ukraine_kuchma.17.t: "Modrá revoluce" # todo: NEW TRANSLATION
 ukraine_kuchma.17.d: "Dnes oficiálně prohlásili nezávislost a vznik své vlastní republiky Jihovýchodu Ukrajiny podporovatelé Modrého Majdanu, vedení Viktorem Yanukovyčem. Do jejich strany přešly vojenské jednotky, stejně jako generálové a důstojníci." # todo: NEW TRANSLATION
 ukraine_kuchma.17.a: "Bouře začala" # todo: NEW TRANSLATION
 ukraine_kuchma.18.t: "Protesty v Galicii" # todo: NEW TRANSLATION
 ukraine_kuchma.18.d: "Naše rozhodnutí ignorovat druhé kolo prezidentských voleb vyvolalo nestabilitu v zemi, mnoho obyvatel západních regionů přešlo do aktivní fáze protestů, kde došlo ke střetům s policií." # todo: NEW TRANSLATION
 ukraine_kuchma.18.a: "Musíme být opatrnější" # todo: NEW TRANSLATION
 ukraine_kuchma.19.t: "Červený Majdan na Ukrajině" # todo: NEW TRANSLATION
 ukraine_kuchma.19.d: "Aktivisté v ukrajinské Galicii zahájili protesty proti nelegálním volbám v zemi, situace se stala natolik vyhrocenou, že hovoříme o ozbrojeném povstání, protože několik generálů podporuje povstalce, možná bychom jim měli pomoci?" # todo: NEW TRANSLATION
 ukraine_kuchma.19.a: "Podpoříme je." # todo: NEW TRANSLATION
 ukraine_kuchma.19.b: "Neměli bychom zasahovat" # todo: NEW TRANSLATION
 ukraine_kuchma.20.t: "Vláda Západní Ukrajiny" # todo: NEW TRANSLATION
 ukraine_kuchma.20.d: "Protesty se již dostaly do vyhrocené fáze a jsou zřejmě podporovány ze zahraničí. Nyní oznámily vznik své vlastní vlády, která není podřízena kyjevským úřadům." # todo: NEW TRANSLATION
 ukraine_kuchma.20.a: "Okamžitě pošlete tam policii" # todo: NEW TRANSLATION
 ukraine_kuchma.21.t: "Červená revoluce" # todo: NEW TRANSLATION
 ukraine_kuchma.21.d: "Dnes ohlásili příznivci takzvaného Červeného Majdanu svůj odchod z Ukrajiny a počátek ozbrojeného odporu proti kyjevské pro-ruské vládě." # todo: NEW TRANSLATION
 ukraine_kuchma.21.a: "Bouře začala" # todo: NEW TRANSLATION
 ukraine_revolution.1.t: "Oranžová revoluce začíná" # todo: NEW TRANSLATION
 ukraine_revolution.1.d: "Volební krize dosáhla bodu zlomu. Pokud vláda nezasáhne, protesty se do konce roku rozšíří." # todo: NEW TRANSLATION
 ukraine_revolution.1.a: "Otevřít oranžový Majdan" # todo: NEW TRANSLATION
 ukraine_revolution.10.t: "Severodoněcký kongres" # todo: NEW TRANSLATION
 ukraine_revolution.10.d: "Delegáti z jihovýchodní Ukrajiny se shromáždili v Severodoněcku. Mohou se omezit na historický kongres, nebo požádat o formální proces autonomie." # todo: NEW TRANSLATION
 ukraine_revolution.10.a: "Uspořádat kongres" # todo: NEW TRANSLATION
 ukraine_revolution.10.b: "Požádat o autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.11.t: "Boj o autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.11.d: "Hnutí za autonomii a Kyjev po několik měsíců soupeřily o kontrolu nad jihovýchodem. Rovnováha nyní rozhodne, zda bude hnutí potlačeno, vyjednáno, nebo mu bude udělena formální republika." # todo: NEW TRANSLATION
 ukraine_revolution.11.a: "Vyřešit boj" # todo: NEW TRANSLATION
 ukraine_revolution.12.t: "SEUAR vyhlašuje autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.12.d: "Jihovýchodní kongres požaduje formální autonomní republiku. Kyjev musí rozhodnout, zda uzná novou Jihovýchodní ukrajinskou autonomní republiku." # todo: NEW TRANSLATION
 ukraine_revolution.12.a: "Uznat republiku" # todo: NEW TRANSLATION
 ukraine_revolution.13.t: "Ústavní kompromis" # todo: NEW TRANSLATION
 ukraine_revolution.13.d: "Hnutí za autonomii zůstalo uvnitř Ukrajiny, ale jeho oddělené instituce se stále obtížněji udržují. Ústavní kompromis by mohl obnovit jednotný ukrajinský stát." # todo: NEW TRANSLATION
 ukraine_revolution.13.a: "Znovu začlenit SEUAR" # todo: NEW TRANSLATION
 ukraine_revolution.14.t: "Příměří SEUAR" # todo: NEW TRANSLATION
 ukraine_revolution.14.d: "Boje mezi Ukrajinou a SEUAR vyčerpaly obě strany. Příměří by zanechalo novou republiku nezávislou, konflikt však může pokračovat." # todo: NEW TRANSLATION
 ukraine_revolution.14.a: "Přijmout příměří" # todo: NEW TRANSLATION
 ukraine_revolution.14.b: "Pokračovat ve válce" # todo: NEW TRANSLATION
 ukraine_revolution.15.t: "Moskva zvažuje intervenci" # todo: NEW TRANSLATION
 ukraine_revolution.15.d: "Použití síly Ukrajinou přivedlo konflikt SEUAR do pozornosti Moskvy. Kreml musí rozhodnout, zda se do války zapojí." # todo: NEW TRANSLATION
 ukraine_revolution.15.a: "Sakra Rusové!" # todo: NEW TRANSLATION
 ukraine_revolution.15.b: "Držet se mimo válku" # todo: NEW TRANSLATION
 ukraine_revolution.16.t: "Pohraniční válka SEUAR" # todo: NEW TRANSLATION
 ukraine_revolution.16.d: "Kyjev odmítl autonomní uspořádání a nařídil svým silám ukončit oddělený status SEUAR. Toto rozhodnutí hrozí proměnou ústavní krize ve válku." # todo: NEW TRANSLATION
 ukraine_revolution.16.a: "Ukončit autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.17.t: "Západní otázka" # todo: NEW TRANSLATION
 ukraine_revolution.17.d: "Samozvaná vláda západní Ukrajiny stále odmítá uznat zmanipulované volby. Měsíce patové situace postavily Kyjev před volbu mezi ústupky a silou." # todo: NEW TRANSLATION
 ukraine_revolution.17.a: "Jednat se západem" # todo: NEW TRANSLATION
 ukraine_revolution.17.b: "Tvrdě zakročit" # todo: NEW TRANSLATION
 ukraine_revolution.20.t: "Rozhodnutí o přidružení" # todo: NEW TRANSLATION
 ukraine_revolution.20.d: "Dohoda o přidružení k Evropské unii je připravena k politickému rozhodnutí. Její pozastavení může vyvolat protesty v ulicích, zatímco její podpis může krizi odložit." # todo: NEW TRANSLATION
 ukraine_revolution.20.a: "Pozastavit dohodu" # todo: NEW TRANSLATION
