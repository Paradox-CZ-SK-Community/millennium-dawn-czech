 UKR_prp_emergency_economy: "Stabilizovat krizové hospodářství" # todo: NEW TRANSLATION
 UKR_prp_emergency_economy_desc: "Malá průmyslová základna a krizová výroba mohou republiku během přechodu zásobovat." # todo: NEW TRANSLATION
 UKR_prp_constitutional_choice: "Zvolit ústavní uspořádání" # todo: NEW TRANSLATION
 UKR_prp_constitutional_choice_desc: "Prozatímní instituce musí rozhodnout, zda budou mostem zpět ke Kyjevu, partnerem Moskvy, nebo základem samostatného státu." # todo: NEW TRANSLATION
 UKR_prp_negotiate_kyiv: "Jednat s Kyjevem" # todo: NEW TRANSLATION
