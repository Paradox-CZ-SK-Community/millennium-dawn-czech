 ukraine_rada.2.d: "Socialisté po dlouhou dobu byli našimi spojenci navzdory rozdílům. Většina členů SPU bývala členy naší strany a dlouhá historie vztahů činí koalici zřejmou volbou, ale socialisté se od nás postupně odklánějí, stávají se mnohem umírněnějšími a proniká revizionismus, takže nebudeme moci prosadit nejradikálnější politiky ve společné vládě." # todo: NEW TRANSLATION
