 UKR_hur_created_tt: "§YBudeme moci zahájit speciální omezené operace§!" # todo: NEW TRANSLATION
 UKR_vv_tooltip_tt: "§YFinancování speciálních sil výrazně sníží dopady možného Majdanu§!" # todo: NEW TRANSLATION
 UKR_ukraine_always_right: "Ukrajina má vždy pravdu" # todo: NEW TRANSLATION
 UKR_ukraine_always_right_desc: "V Ukrajině se k moci dostali opravdoví vlastenci. Ukrajina má vždy pravdu, Ukrajina je nade vše." # todo: NEW TRANSLATION
 UKR_take_control_of_the_media: "Převzít kontrolu nad médii" # todo: NEW TRANSLATION
 UKR_take_control_of_the_media_desc: "Mediální zdroje měly v posledních letech příliš velkou svobodu. Zabývají se pouze propagací toho, jak špatná a hrozná je naše země. My to napravíme." # todo: NEW TRANSLATION
 UKR_prohibition_of_non_nationalist_organizations: "Zákaz nenacionalistických organizací" # todo: NEW TRANSLATION
 UKR_prohibition_of_non_nationalist_organizations_desc: "Každá organizace, která odmítá nacionalistickou věc, představuje hrozbu pro nový řád. Všechny je zakažme a ponechme naše hnutí jako jedinou legální politickou sílu v zemi." # todo: NEW TRANSLATION
 UKR_anti_russian_policy: "Protiruská politika" # todo: NEW TRANSLATION
 UKR_anti_russian_policy_desc: "Moskva zůstává největším nepřítelem ukrajinského národa. Zakotvěme nepřátelství vůči Rusku jako oficiální státní politiku a očistěme naše instituce od ruského vlivu." # todo: NEW TRANSLATION
 UKR_loyal_teachers_in_schools: "Loajální učitelé ve školách" # todo: NEW TRANSLATION
 UKR_loyal_teachers_in_schools_desc: "Škola je základem budoucích vlasteneckých občanů Ukrajiny. Ve školách ponecháme pouze skutečné Ukrajince." # todo: NEW TRANSLATION
 UKR_ban_all_languages_except_ukrainian: "Zakázat všechny jazyky kromě ukrajinštiny" # todo: NEW TRANSLATION
 UKR_ban_all_languages_except_ukrainian_desc: "Zahájíme program ukrajinizace. Všechny ostatní jazyky budou odstraněny z učebních osnov, obchodní komunikace a dalších oblastí života ukrajinského občana." # todo: NEW TRANSLATION
 UKR_introduce_death_penalty_for_disloyal_persons: "Zavést trest smrti pro neloajální osoby" # todo: NEW TRANSLATION
 UKR_introduce_death_penalty_for_disloyal_persons_desc: "Každý občan dluží své vlasti loajalitu. Všech, kdo ji nenávidí a kdo by jí chtěli ublížit, se zbavíme všemi nezbytnými prostředky." # todo: NEW TRANSLATION
 UKR_united_council_of_ukrainian_nationalists: "Jednotná rada ukrajinských nacionalistů" # todo: NEW TRANSLATION
 UKR_united_council_of_ukrainian_nationalists_desc: "Konečně zemi řídí skutečné vlastenectví a nacionalismus vedené opravdovými podporovateli Ukrajiny. Naším úkolem je vybudovat velkou zemi." # todo: NEW TRANSLATION
 UKR_right_sector: "Pravý sektor" # todo: NEW TRANSLATION
 UKR_right_sector_desc: "Pravý sektor bude odpovědný za vnitropolitickou složku nového ukrajinského státu." # todo: NEW TRANSLATION
 UKR_full_order_in_the_country: "Naprostý pořádek v zemi" # todo: NEW TRANSLATION
 UKR_full_order_in_the_country_desc: "Pořádek je klíčem ke stabilitě. Budeme bojovat proti projevům chaosu, nepořádku a vzpoury." # todo: NEW TRANSLATION
 UKR_ukrainian_assault_battalions: "Ukrajinské úderné prapory" # todo: NEW TRANSLATION
 UKR_ukrainian_assault_battalions_desc: "Zvláště vlastenecké občany zformujeme do úderných praporů, které budou plnit specifické úkoly." # todo: NEW TRANSLATION
 UKR_make_government_jobs_only_for_ukrainians: "Vládní pozice pouze pro Ukrajince" # todo: NEW TRANSLATION
 UKR_make_government_jobs_only_for_ukrainians_desc: "Ve prospěch vlasti by měli pracovat pouze Ukrajinci; všichni ostatní by neměli mít právo pracovat." # todo: NEW TRANSLATION
 UKR_complete_the_cleansing_of_the_ukrainian_state: "Dokončit očištění ukrajinského státu" # todo: NEW TRANSLATION
 UKR_complete_the_cleansing_of_the_ukrainian_state_desc: "Naše vlast byla očištěna od nepřátel, odpůrců a dalších negativních živlů." # todo: NEW TRANSLATION
 UKR_limit_the_powers_of_the_mvd: "Omezit pravomoci MVD" # todo: NEW TRANSLATION
 UKR_limit_the_powers_of_the_mvd_desc: "Policie a další úřady mají ve státě příliš velké pravomoci. Omezíme je." # todo: NEW TRANSLATION
 UKR_night_of_the_long_knives: "Noc dlouhých nožů" # todo: NEW TRANSLATION
 UKR_night_of_the_long_knives_desc: "Ty, kteří se reformám obzvlášť tvrdě brání, odstraníme radikálnějším způsobem." # todo: NEW TRANSLATION
 UKR_una_unso: "UNA-UNSO" # todo: NEW TRANSLATION
 UKR_una_unso_desc: "Aktivity zahraniční politiky spočinou na bedrech organizace UNA-UNSO." # todo: NEW TRANSLATION
 UKR_arms_rebuild: "Vojenský průmysl" # todo: NEW TRANSLATION
 UKR_arms_rebuild_desc: "Naše země se musí bránit, a jen silný vojenský průmysl jí v tom pomůže." # todo: NEW TRANSLATION
 UKR_arms_build: "Investovat do vojenské produkce" # todo: NEW TRANSLATION
 UKR_arms_build_desc: "Jsme připraveni financovat investice do rozšíření vojenské produkce některých našich významných továren" # todo: NEW TRANSLATION
 UKR_external_intervention: "Vnější intervence" # todo: NEW TRANSLATION
 UKR_external_intervention_desc: "Je čas přestat vést mírovou politiku. Budeme aktivně ovlivňovat globální procesy." # todo: NEW TRANSLATION
 UKR_resolve_the_moldovan_issue: "Vyřešit moldavskou otázku" # todo: NEW TRANSLATION
 UKR_resolve_the_moldovan_issue_desc: "Moldavsko a Podněstří nám již dlouho stojí v cestě. Jejich nezávislost je pouhou chybou, kterou napravíme." # todo: NEW TRANSLATION
 UKR_dig_up_potatoes: "Vykopat brambory" # todo: NEW TRANSLATION
 UKR_dig_up_potatoes_desc: "Bělorusko mohou naši nepřátelé ze západu i východu využít k úderu proti nám. Nejlepší způsob, jak se chránit, je udeřit jako první!" # todo: NEW TRANSLATION
 UKR_to_recall_the_volhynia_massacre: "Volyňská zkušenost" # todo: NEW TRANSLATION
 UKR_to_recall_the_volhynia_massacre_desc: "Znovu jsme se střetli s Poláky a musíme jim znovu vzdorovat. Je čas, aby naše země konečně ukončila polskou hrozbu." # todo: NEW TRANSLATION
 UKR_polish_ukr_brotherhood: "Polsko-ukrajinské bratrství" # todo: NEW TRANSLATION
 UKR_polish_ukr_brotherhood_desc: "Pouze spolu, Ukrajina a Polsko budou moci porazit jakéhokoli nepřítele" # todo: NEW TRANSLATION
 UKR_belarus_brothers: "Běloruští bratři" # todo: NEW TRANSLATION
 UKR_belarus_brothers_desc: "Běloruský lid jsou naši bratři, kteří jsou také v zajetí dvou hlavních politických sil. Dostaneme je z jejich sevření." # todo: NEW TRANSLATION
 UKR_befriend_azerbaijan: "Přátelství s Ázerbájdžánem" # todo: NEW TRANSLATION
 UKR_befriend_azerbaijan_desc: "Ázerbájdžán bude cenným spojencem pro prosazování naší politiky v Kavkaze, kde budeme moci aktivně odolávat vlivu Ruska." # todo: NEW TRANSLATION
 UKR_befriend_georgia: "Sjednocení se Gruzií" # todo: NEW TRANSLATION
 UKR_befriend_georgia_desc: "Gruzie je důležitým partnerem a má strategickou polohu v regionu Kavkazu. Mít takového spojence v alianci bude pro nás velmi prospěšné." # todo: NEW TRANSLATION
 UKR_caucasus_volunteers: "Dobrovolníci z Kavkazu" # todo: NEW TRANSLATION
 UKR_caucasus_volunteers_desc: "Pozveme mnoho dobrovolníků z Kavkazu, aby vytvořili bataliony HUR." # todo: NEW TRANSLATION
 UKR_dagestan_reb_prepare: "Připravit povstání v Dagestánu" # todo: NEW TRANSLATION
 UKR_dagestan_reb_prepare_desc: "Začneme s přípravami speciální omezené operace v Dagestánu" # todo: NEW TRANSLATION
 UKR_befriend_chechens: "Přátelství s Ichkerií" # todo: NEW TRANSLATION
 UKR_befriend_chechens_desc: "Ichkerie, stát zničený Ruskem na počátku tohoto století. Sesbíráme její skutečné patrioty a pokusíme se ho oživit." # todo: NEW TRANSLATION
 UKR_secretly_sending_militants_to_kuban: "Vyvolat povstání na Krymu" # todo: NEW TRANSLATION
 UKR_secretly_sending_militants_to_kuban_desc: "Skutečnost, že nám Rusko odebralo Krym, je hlavní historickou nespravedlností století. Slabost našich úřadů se ukázala být otřesná a hanebná. Napravíme to." # todo: NEW TRANSLATION
 UKR_agitation_of_radical_ukrainians_in_kuban: "Vyvolat povstání na Kubáni" # todo: NEW TRANSLATION
 UKR_agitation_of_radical_ukrainians_in_kuban_desc: "Kubáň je naše země a vždy jí bude. Pokusíme se ji Rusku odebrat." # todo: NEW TRANSLATION
 UKR_reconcista: "Ukrajinská reconquista" # todo: NEW TRANSLATION
 UKR_reconcista_desc: "Evropské státy se potápí v chaosu, uprchlická krize. Národy Evropy jsou zcela pod kontrolou globalistů, což v budoucnu povede Evropu k zániku; kvůli snadnému zisku to změníme" # todo: NEW TRANSLATION
 UKR_no_russian_language: "Zákaz ruského jazyka" # todo: NEW TRANSLATION
 UKR_no_russian_language_desc: "Je načase se s ruským jazykem zcela vyrovnat" # todo: NEW TRANSLATION
 UKR_kuban_ukrainization: "Ukrajinizace Kubanu" # todo: NEW TRANSLATION
 UKR_kuban_ukrainization_desc: "Kubán se stane ukrajinským, postaráme se o to" # todo: NEW TRANSLATION
 UKR_liberate_green_klin: "\"Osvobodit\" Zelený Klin" # todo: NEW TRANSLATION
 UKR_liberate_green_klin_desc: "Je čas \"osvobodit\" naše bratry na Dálném východě z útlaku ruského medvěda." # todo: NEW TRANSLATION
 UKR_shoot_a_russian_bear: "Zastřelit ruského medvěda" # todo: NEW TRANSLATION
 UKR_shoot_a_russian_bear_desc: "Z ruského medvěda bude náš koberec!" # todo: NEW TRANSLATION
 UKR_declare_a_great_ukraine: "Vyhlásit Velkou Ukrajinu" # todo: NEW TRANSLATION
 UKR_declare_a_great_ukraine_desc: "Ukrajina se stala velkou a celý svět se to dozví." # todo: NEW TRANSLATION
 UKR_upa: "UPA" # todo: NEW TRANSLATION
 UKR_upa_desc: "Občanskou a vnitřní obranu země převezme obnovená Ukrajinská povstalecká armáda." # todo: NEW TRANSLATION
 UKR_new_orders_of_formation_of_upa_groups: "Nové rozkazy pro formování jednotek UPA" # todo: NEW TRANSLATION
 UKR_new_orders_of_formation_of_upa_groups_desc: "Zohledníme zkušenosti UPA z druhé světové války a vytvoříme nové brigády s přihlédnutím k minulým chybám." # todo: NEW TRANSLATION
