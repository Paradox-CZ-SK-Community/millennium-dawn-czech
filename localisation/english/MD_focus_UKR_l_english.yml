 UKR_our_ukraine_start: "Naše Ukrajina" # todo: NEW TRANSLATION
 UKR_our_ukraine_start_desc: "Je načase uvést zemi do pořádku a prosadit liberální reformy. Pro nás lidé na prvním místě!" # todo: NEW TRANSLATION
 UKR_our_ukraine_secretariat: "Sekretariát prezidenta Ukrajiny" # todo: NEW TRANSLATION
 UKR_our_ukraine_secretariat_desc: "Sekretariát hraje klíčovou roli v řízení administrativních a organizačních funkcí souvisejících s prezidentskými aktivitami. Hlavním cílem vytvoření Sekretariátu prezidenta Ukrajiny je zajistit shodu s ústavními pravomocemi prezidenta a efektivní plnění jeho povinností." # todo: NEW TRANSLATION
 UKR_our_ukraine_secretariat_reduction: "Redukce personálu sekretariátu" # todo: NEW TRANSLATION
 UKR_our_ukraine_secretariat_reduction_desc: "Musíme snížit počet zaměstnanců sekretariátu, abychom zefektivnili chod vládních agentur a snížili rozpočtové náklady." # todo: NEW TRANSLATION
 UKR_our_ukraine_decentralization: "Decentralizace" # todo: NEW TRANSLATION
 UKR_our_ukraine_decentralization_desc: "Potřebujeme posílit místní samosprávu v naší zemi." # todo: NEW TRANSLATION
 UKR_our_ukraine_wto: "Žádat o pomoc při vstupu do WTO" # todo: NEW TRANSLATION
 UKR_our_ukraine_wto_desc: "Jsme připraveni stát se členy WTO a potřebujeme v tom podporu." # todo: NEW TRANSLATION
 UKR_our_ukraine_yanukovich_go_home: "Propusťte Janukoviče" # todo: NEW TRANSLATION
 UKR_our_ukraine_yanukovich_go_home_desc: "Janukovič, jako premiér, se projevuje hrozně, takže ho odvoláte a jmenujete nového premiéra." # todo: NEW TRANSLATION
 UKR_our_ukraine_timoha: "Kancelář Tymošenkové" # todo: NEW TRANSLATION
 UKR_our_ukraine_timoha_desc: "Známá Yulia Tymošenková se přidala k naší vládě, uvidíme, co přinese našemu státu." # todo: NEW TRANSLATION
 UKR_our_ukraine_aviation_reform: "Reforma leteckého průmyslu" # todo: NEW TRANSLATION
 UKR_our_ukraine_aviation_reform_desc: "Letecký průmysl je pro naši zemi velmi důležitý a budeme usilovat o jeho oživení." # todo: NEW TRANSLATION
 UKR_our_ukraine_help_western: "Získat podporu Lvova" # todo: NEW TRANSLATION
 UKR_our_ukraine_help_western_desc: "Obnovíme dodávky teplé i studené vody ve Lvově, čímž získáme podporu obyvatel tohoto města a případně i regionu" # todo: NEW TRANSLATION
 UKR_our_ukraine_cheap_gas_negotiate: "Vyjednávání o snížení cen plynu" # todo: NEW TRANSLATION
 UKR_our_ukraine_cheap_gas_negotiate_desc: "Pokusíme se vyjednat se Moskvou snížení cen energie" # todo: NEW TRANSLATION
 UKR_our_ukraine_service_life: "Zkrácení doby služby" # todo: NEW TRANSLATION
 UKR_our_ukraine_service_life_desc: "Ukrajinská armáda potřebuje modernizaci. Naší první reformou v této oblasti bude zkrácení doby služby v armádě z dvou let na jeden rok! Tím vojáci ztratí při službě méně času." # todo: NEW TRANSLATION
 UKR_our_ukraine_nato_eu: "Podpora začlenění Ukrajiny do NATO a EU" # todo: NEW TRANSLATION
 UKR_our_ukraine_nato_eu_desc: "Začněme s progresivnější integrací do NATO a EU. To je nezbytné pro vojenskou a ekonomickou bezpečnost naší velké země." # todo: NEW TRANSLATION
 UKR_our_ukraine_fire_corrupt: "Vyhoďte korupčníky" # todo: NEW TRANSLATION
 UKR_our_ukraine_fire_corrupt_desc: "Naše vláda má korupční lidi a my je vyhodíme! V naší zemi nebude prostor pro korupci!!!" # todo: NEW TRANSLATION
 UKR_our_ukraine_form_new_government: "Zformujte novou vládu" # todo: NEW TRANSLATION
 UKR_our_ukraine_form_new_government_desc: "Teď, když jsme vyhodili všechny, kteří kradli naší zemi, můžeme vytvořit novou, čestnou a spravedlivou vládu." # todo: NEW TRANSLATION
 UKR_our_ukraine_fight_corruption: "Boj proti korupci" # todo: NEW TRANSLATION
 UKR_our_ukraine_fight_corruption_desc: "Korupce je hlavní nepřítel naší země, tvrdě jí budeme čelit!" # todo: NEW TRANSLATION
 UKR_our_ukraine_alternative_energy_sources: "Alternativní zdroje energie" # todo: NEW TRANSLATION
 UKR_our_ukraine_alternative_energy_sources_desc: "Rozvoj alternativních zdrojů energie nám pomůže snížit naši závislost na dovozu energie." # todo: NEW TRANSLATION
 UKR_our_ukraine_crush_oligarchs: "Omezování vlivu oligarchů" # todo: NEW TRANSLATION
 UKR_our_ukraine_crush_oligarchs_desc: "Oligarchie je druhým největším nepřítelem naší země. Mohou ovlivňovat naši vládu tím, že obcházejí zákony. Abychom se tomu vyhnuli, omezíme jejich vliv a pokusíme se je vyhnat ze země." # todo: NEW TRANSLATION
 UKR_our_ukraine_increase_media_freedom: "Zvýšit svobodu médií" # todo: NEW TRANSLATION
 UKR_our_ukraine_increase_media_freedom_desc: "Naše média byla velmi dlouho omezována a teď, během našeho vládnutí, bude volnější a nezávislejší než kdy dřív!" # todo: NEW TRANSLATION
 UKR_our_ukraine_release_political_prisoners: "Propusťte politické vězně" # todo: NEW TRANSLATION
 UKR_our_ukraine_release_political_prisoners_desc: "Pod bývalou vládou bylo uvězněno mnoho opozičních politiků. Pojďme je propustit!" # todo: NEW TRANSLATION
 UKR_our_ukraine_internet_freedom: "Svoboda internetu" # todo: NEW TRANSLATION
 UKR_our_ukraine_internet_freedom_desc: "Svoboda internetu znamená, že občané mají právo na volný přístup k informacím, svobodu projevu a soukromí v online komunikaci. Zajistěme, aby byla tato práva a svobody chráněna." # todo: NEW TRANSLATION
 UKR_our_ukraine_provide_housing: "Zajistit bydlení ukrajinským občanům" # todo: NEW TRANSLATION
 UKR_our_ukraine_provide_housing_desc: "Je nutné zajistit bydlení pro naše občany, a proto provedeme příslušné reformy" # todo: NEW TRANSLATION
 UKR_our_ukraine_health_insurance_law: "Zákon o zdravotním pojištění" # todo: NEW TRANSLATION
 UKR_our_ukraine_health_insurance_law_desc: "Přijmeme zákon o zdravotním pojištění, který povzbudí obyvatele k aktivnímu vyhledávání zdravotních služeb a zvýší úroveň zdraví našich občanů" # todo: NEW TRANSLATION
 UKR_our_ukraine_curriculum_modernization: "Modernizace vzdělávacích osnov" # todo: NEW TRANSLATION
 UKR_our_ukraine_curriculum_modernization_desc: "Budeme reformovat vzdělávací program ve školách, abychom zlepšili vzdělání mladé generace" # todo: NEW TRANSLATION
 UKR_our_ukraine_diversification_of_gas_supply_sources: "Diverzifikace zdrojů dodávek plynu" # todo: NEW TRANSLATION
 UKR_our_ukraine_diversification_of_gas_supply_sources_desc: "Budeme aktivně diverzifikovat naše zdroje, abychom nebyli závislí na jednom dodavateli" # todo: NEW TRANSLATION
 UKR_our_ukraine_cost_reduction: "Snížení výdajů rozpočtu" # todo: NEW TRANSLATION
 UKR_our_ukraine_cost_reduction_desc: "Prosadíme škrty v rozpočtu, aby zlepšili stav našeho rozpočtu" # todo: NEW TRANSLATION
 UKR_our_ukraine_deregulation_of_business_environment: "Deregulace podnikatelského prostředí" # todo: NEW TRANSLATION
 UKR_our_ukraine_deregulation_of_business_environment_desc: "Naše země musí snížit byrokracii a snížit administrativní překážky pro podnikatele." # todo: NEW TRANSLATION
 UKR_our_ukraine_attracting_investments: "Přitahování investic" # todo: NEW TRANSLATION
 UKR_our_ukraine_attracting_investments_desc: "Naše země je otevřená pro investice a jsme připraveni přilákat potenciální investory" # todo: NEW TRANSLATION
 UKR_our_ukraine_beginning_decommunization_policy: "Začátek politiky dekomunizace" # todo: NEW TRANSLATION
 UKR_our_ukraine_beginning_decommunization_policy_desc: "V roce 1991 jsme získali nezávislost na sovětské nadvládě. Připomeňme si to a zahájme politiku dekomunizace po celé zemi! Komunistický vliv musí být potlačen zde a nyní." # todo: NEW TRANSLATION
 UKR_our_ukraine_economic_liberalism: "Ekonomický liberalismus" # todo: NEW TRANSLATION
 UKR_our_ukraine_economic_liberalism_desc: "Ekonomický liberalismus je nezbytný, pokud chceme, aby ekonomika rostla efektivněji, a proto je třeba ho přijmout." # todo: NEW TRANSLATION
 UKR_our_ukraine_parliamentary_republic: "Posílení pravomocí parlamentu" # todo: NEW TRANSLATION
 UKR_our_ukraine_parliamentary_republic_desc: "Posílení pravomocí parlamentu pomáhá zvýšit reprezentativnost vlády. Parlament je orgán volený lidmi a proto by měl mít větší vliv na rozhodovací proces. To přispívá k širší inkluzi názorů a zájmů občanů do politického procesu." # todo: NEW TRANSLATION
 UKR_our_ukraine_president_republic: "Posílení pravomocí prezidenta" # todo: NEW TRANSLATION
 UKR_our_ukraine_president_republic_desc: "První důležitý argument ve prospěch posílení pravomocí prezidenta je zajistit účinnější a rychlejší reakci na krizové situace. Ve světě plném globálních výzev, jako jsou ekonomické krize, boje proti terorismu a pandemie, musí prezident mít dostatečnou pravomoc k rychlému a rozhodnému jednání. Omezena pravomoc může vést k byrokratickým průtahům a neefektivním rozhodnutím." # todo: NEW TRANSLATION
 UKR_our_ukraine_recognition_holodomor: "Uznání Holodomoru" # todo: NEW TRANSLATION
 UKR_our_ukraine_recognition_holodomor_desc: "Sovětská moc spáchala na nás a Ukrajincích ten nejstrašnější zločin 20. století. Tato strašná hladomor, Holodomor, byl způsoben kolektivizací zemědělství a politikou státního násilí prováděnou komunistickým režimem SSSR." # todo: NEW TRANSLATION
 UKR_our_ukraine_ukrainian_institute: "Ukrajinský institut národní paměti" # todo: NEW TRANSLATION
 UKR_our_ukraine_ukrainian_institute_desc: "Ukrajinský institut národní paměti je centrálním orgánem výkonné moci pro realizaci státní politiky v oblasti obnovy a zachování národní paměti. Bude zřízen, aby znovu vytvořil spravedlivou historii ukrajinského národa a formoval a implementoval státní politiku v tomto směru. Budeme také uctívat památku obětí politických represí a hladomorů na území naší země." # todo: NEW TRANSLATION
 UKR_our_ukraine_secretariat_of_president: "Sekretariát prezidenta Ukrajiny" # todo: NEW TRANSLATION
 UKR_our_ukraine_secretariat_of_president_desc: "Prezidentský sekretariát zvyšuje administrativní výzkumnou kapacitu, ale zvyšuje byrokratickou zátěž." # todo: NEW TRANSLATION
 UKR_our_ukraine_secretariat_of_president_reduction: "Zmenšený Sekretariát prezidenta Ukrajiny" # todo: NEW TRANSLATION
 UKR_ukrainian_libertarianism: "Ukrajinský libertarianismus" # todo: NEW TRANSLATION
 UKR_ukrainian_libertarianism_desc: "Nastal čas, aby Ukrajina vstoupila do éry libertarianismu! Osvoboďme zemi od pout kapitalistů a komunistů" # todo: NEW TRANSLATION
 UKR_full_deregulation: "Úplná deregulace" # todo: NEW TRANSLATION
 UKR_full_deregulation_desc: "Spustíme proces úplné deregulace a vládní vliv se sníží" # todo: NEW TRANSLATION
 UKR_decrease_role_of_government: "Snížit moc vlády" # todo: NEW TRANSLATION
 UKR_decrease_role_of_government_desc: "Stát bude hrát minimální roli v naší krásné zemi" # todo: NEW TRANSLATION
 UKR_free_the_common_folk: "Opravdově svobodní lidé" # todo: NEW TRANSLATION
 UKR_free_the_common_folk_desc: "Náš lid se konečně nadechne a bude se cítit svobodní!" # todo: NEW TRANSLATION
 UKR_offshore_country: "Země offshore společností" # todo: NEW TRANSLATION
 UKR_offshore_country_desc: "Vítáme vznik mnoha offshore zón v naší zemi" # todo: NEW TRANSLATION
 UKR_true_servant_of_people: "Pravý služebník lidu" # todo: NEW TRANSLATION
 UKR_true_servant_of_people_desc: "Konečně se Ukrajina stala nejsvobodnější zemí na světě!" # todo: NEW TRANSLATION
 UKR_our_ukraine_freedom_of_social_media_idea: "Svoboda sociálních médií" # todo: NEW TRANSLATION
 UKR_our_ukraine_freedom_of_social_media_idea_desc: "Média by měla být svobodná a bude tomu tak. Budeme podporovat zákaz cenzury" # todo: NEW TRANSLATION
 UKR_our_ukraine_ukrainian_institute_of_national_memory: "Ukrajinský institut národní paměti" # todo: NEW TRANSLATION
 UKR_our_ukraine_ukrainian_institute_of_national_memory_desc: "Každý Ukrajinec by měl pamatovat na oběti svého lidu, ke kterým došlo v minulosti. Institut národní paměti nám pomůže formovat generace těch, kteří si budou pamatovat hrdinství Ukrajinců" # todo: NEW TRANSLATION
 UKR_our_ukraine_fight_with_corruption_idea: "Boj proti korupci" # todo: NEW TRANSLATION
 UKR_our_ukraine_fight_with_corruption_idea_desc: "Prosazování protikorupčních opatření snižuje byrokratickou zátěž a nezákonné odčerpávání ekonomických zdrojů." # todo: NEW TRANSLATION
 UKR_our_ukraine_education_reform_idea: "Důsledky reformy vzdělávání" # todo: NEW TRANSLATION
 UKR_our_ukraine_education_reform_idea_desc: "Reformy osnov zlepšují výzkumnou kapacitu, ale přinášejí dočasné politické a stabilitní náklady." # todo: NEW TRANSLATION
 UKR_our_ukraine_health_reform_idea: "Důsledky reformy zdravotnictví" # todo: NEW TRANSLATION
 UKR_our_ukraine_health_reform_idea_desc: "Modernizace zdravotnického systému snižuje náklady a zlepšuje zdravotní způsobilost branců." # todo: NEW TRANSLATION
 UKR_our_ukraine_social_reform_idea: "Důsledky reformy bydlení" # todo: NEW TRANSLATION
 UKR_our_ukraine_social_reform_idea_desc: "Racionalizace sociálních výdajů snižuje rozpočtovou zátěž a zároveň posiluje demokratickou podporu." # todo: NEW TRANSLATION
 UKR_our_ukraine_air_industry_idea: "Reforma leteckého průmyslu" # todo: NEW TRANSLATION
 UKR_our_ukraine_air_industry_idea_desc: "Modernizace leteckého sektoru snižuje výrobní náklady vojenských letadel." # todo: NEW TRANSLATION
 UKR_liberals_modifier: "Ukrajinský liberalismus" # todo: NEW TRANSLATION
 UKR_liberals_modifier_desc: "Ukrajina se konečně vydala na cestu liberalismu, teď jsme odstranili okovy autoritářské vlády" # todo: NEW TRANSLATION
 ukraine_our_ukraine.1.t: "Prezidentský sekretariát Ukrajiny" # todo: NEW TRANSLATION
 ukraine_our_ukraine.1.d: "Prezidentská administrativa se během vlády Julenko chovala hrozně, proto ji reformujeme do Sekretariátu prezidenta Ukrajiny, abychom zajistili větší politickou stabilitu." # todo: NEW TRANSLATION
 ukraine_our_ukraine.1.a: "Je čas na změnu." # todo: NEW TRANSLATION
 ukraine_our_ukraine.2.t: "Ukrajinský institut národní paměti" # todo: NEW TRANSLATION
 ukraine_our_ukraine.2.d: "Institut národní paměti zahájil svou činnost, nyní jsme připraveni vrátit Ukrajinu k její skutečné historii!" # todo: NEW TRANSLATION
 ukraine_our_ukraine.2.a: "Hurá!" # todo: NEW TRANSLATION
 ukraine_our_ukraine.4.t: "Ukrajina nabízí naši zemi k investicím do ní." # todo: NEW TRANSLATION
 ukraine_our_ukraine.4.d: "Ukrajinská vláda oznámila zahájení programu na přilákání zahraničních investorů a poslala naší vládě nabídku investovat do jejich ekonomiky." # todo: NEW TRANSLATION
 ukraine_our_ukraine.4.a: "Pojďme investovat!" # todo: NEW TRANSLATION
 ukraine_our_ukraine.4.b: "To nás nezajímá." # todo: NEW TRANSLATION
 ukraine_our_ukraine.5.t: "Investice na Ukrajině." # todo: NEW TRANSLATION
 ukraine_our_ukraine.5.d: "Souhlasili s investicí do naší země." # todo: NEW TRANSLATION
 ukraine_our_ukraine.5.a: "Dobře" # todo: NEW TRANSLATION
 ukraine_our_ukraine.6.t: "Investice na Ukrajině." # todo: NEW TRANSLATION
 ukraine_our_ukraine.6.d: "Odmítli naši nabídku investovat do naší země." # todo: NEW TRANSLATION
 ukraine_our_ukraine.6.a: "Škoda" # todo: NEW TRANSLATION
 ukraine_our_ukraine.7.t: "Plynová smlouva s Ukrajinou." # todo: NEW TRANSLATION
 ukraine_our_ukraine.7.d: "Ukrajina nám navrhla snížit cenu nákupu v naší plynové smlouvě; výměnou bude odstraněn prostředník mezi námi, čímž získáme větší vliv, pokud souhlasíme?" # todo: NEW TRANSLATION
 ukraine_our_ukraine.7.a: "Podepíšeme to" # todo: NEW TRANSLATION
 ukraine_our_ukraine.7.b: "To nás nezajímá." # todo: NEW TRANSLATION
 ukraine_our_ukraine.8.t: "Plynová smlouva s Ruskem." # todo: NEW TRANSLATION
 ukraine_our_ukraine.8.d: "Přijali změnu podmínek naší plynové smlouvy, teď budeme platit méně!" # todo: NEW TRANSLATION
 ukraine_our_ukraine.8.a: "Dobře" # todo: NEW TRANSLATION
 ukraine_our_ukraine.9.t: "Plynová smlouva s Ruskem." # todo: NEW TRANSLATION
 ukraine_our_ukraine.9.d: "Přijali změnu podmínek naší plynové smlouvy, teď budeme platit méně!" # todo: NEW TRANSLATION
 ukraine_our_ukraine.9.a: "Dobře" # todo: NEW TRANSLATION
 ukraine_our_ukraine.10.t: "Bukurešťský summit" # todo: NEW TRANSLATION
 ukraine_our_ukraine.10.d: "Na summitu NATO v Bukurešti Německo a Francie zablokovaly Akční plán členství pro Ukrajinu. Dveře aliance zůstávají formálně otevřené, ale cesta skrze ně nebyla vytyčena." # todo: NEW TRANSLATION
 ukraine_our_ukraine.10.a: "Pokračovat v usilování o NATO" # todo: NEW TRANSLATION
 ukraine_our_ukraine.10.b: "Odsoudit odmítnutí" # todo: NEW TRANSLATION
 UKR_zelensky_western: "Cesta na Západ" # todo: NEW TRANSLATION
 UKR_zelensky_western_desc: "Budeme nadále vést naši politiku směrem na Západ" # todo: NEW TRANSLATION
 UKR_reform_sbu: "Reforma SBU" # todo: NEW TRANSLATION
 UKR_reform_sbu_desc: "SBU potřebuje reformy, protože její struktura byla po všechny ty roky silně prolezlá korupcí a je třeba ji modernizovat." # todo: NEW TRANSLATION
 UKR_befriend_the_west: "Přátelství se Západem" # todo: NEW TRANSLATION
 UKR_befriend_the_west_desc: "Budeme nadále pokračovat v politice zlepšování vztahů se západními zeměmi a v nich vidíme naše partnery a spojence" # todo: NEW TRANSLATION
 UKR_avakov_befriend: "Přátelství s Avakovem" # todo: NEW TRANSLATION
 UKR_avakov_befriend_desc: "Arsen Avakov se ukázal být nejvytrvalějším ministrem ze všech, které jsme viděli; dokázal přežít mnoho vlád, a navíc finančně podporuje prapor Azov. Pokud posílíme vazby s ním, budeme moci navýšit počet Azov." # todo: NEW TRANSLATION
 UKR_land_reform_zelya: "Pozemková reforma" # todo: NEW TRANSLATION
 UKR_land_reform_zelya_desc: "Budeme pokračovat v pozemkové reformě, která byla zahájena před dávnými lety" # todo: NEW TRANSLATION
 UKR_fasten_nato_join: " Touha vstoupit do NATO" # todo: NEW TRANSLATION
 UKR_fasten_nato_join_desc: "NATO je náš cíl, o který usilujeme od samotného počátku" # todo: NEW TRANSLATION
 UKR_peaceful_negotiation_don: "Mírové řešení Donbasu" # todo: NEW TRANSLATION
 UKR_peaceful_negotiation_don_desc: "Jsme připraveni učinit ústupky v otázce Donbasu a konečně ukončit tento nekonečný konflikt." # todo: NEW TRANSLATION
 UKR_keep_status_quo: "Udržet status quo" # todo: NEW TRANSLATION
 UKR_keep_status_quo_desc: "Nebudeme tuto otázku řešit mírově, půjdeme stejným směrem jako dříve" # todo: NEW TRANSLATION
 UKR_our_ukraine_democratic_constitution: "Nová demokratická ústava" # todo: NEW TRANSLATION
 UKR_our_ukraine_democratic_constitution_desc: "Jsme připraveni reformovat naši ústavu, abychom přiblížili skutečnou demokracii v naší zemi." # todo: NEW TRANSLATION
 UKR_our_ukraine_helsi: "Helsi" # todo: NEW TRANSLATION
 UKR_our_ukraine_helsi_desc: "Helsi - zdravotnický informační systém pro zdravotnická zařízení a zdravotnický portál pro pacienty na Ukrajině" # todo: NEW TRANSLATION
 UKR_our_ukraine_dia: "Dia" # todo: NEW TRANSLATION
 UKR_our_ukraine_dia_desc: "Ukrajinská elektronická služba veřejných služeb, vyvinutá Ministerstvem digitální transformace Ukrajiny. Je to webová stránka a mobilní aplikace s digitálními dokumenty, možností digitálního podpisu a ověření, a také portál veřejných služeb" # todo: NEW TRANSLATION
 UKR_next_azov_created_tt: "Nová §YAzov brigáda§! bude vytvořena" # todo: NEW TRANSLATION
 UKR_our_influence_helps_tt: "§CBecause we influence the Parliament, we are able to pass this law with a higher likely-hood of success despite having less seats in our favor§!" # todo: NEW TRANSLATION
 UKR_lose_some_seats_TT: "Budeme §Rztrácet§! některá křesla v §HParlamentu§!" # todo: NEW TRANSLATION
 UKR_gain_some_seats_TT: "Budeme §Gzískávat§! některá křesla v §HParlamentu§!" # todo: NEW TRANSLATION
 UKR_is_pro_west_TT: "Je stranou orientovanou na Západ" # todo: NEW TRANSLATION
 UKR_is_pro_east_TT: "Je stranou orientovanou na Východ" # todo: NEW TRANSLATION
 UKR_is_neutral_TT: "Je stranou nezúčastněnou se žádnou cizí zemí" # todo: NEW TRANSLATION
 UKR_hur_can_attack: "Vláda podporuje operace HUR, reforma HUR je dokončena a byla vytvořena alespoň jedna jednotka HUR" # todo: NEW TRANSLATION
 UKR_influence_parliament_TT: "Bude začínat ovlivňovat §HParlament§!" # todo: NEW TRANSLATION
 UKR_puppet_parliament_TT: "Bude §OPuppet§! §HParlament§!\n\n§RNEBUDeme POTŘEBA PRO ZMĚNY ZÁKONŮ PROJÍT PARLAMENTEM§!" # todo: NEW TRANSLATION
 UKR_dissolve_parliament_TT: "Bude §RDissolve§! §HParlament§!\n\n§RNEBUDeme POTŘEBA PRO ZMĚNY ZÁKONŮ PROJÍT PARLAMENTEM§!" # todo: NEW TRANSLATION
 UKR_zelenskiy_socialist_TT: "§YZelenskyy§! změní svůj §BNázor§!!" # todo: NEW TRANSLATION
 UKR_zelenskiy_formed_TT: "£ukr_servant_of_the_people §YThe Servant of the People§! Strana bude vytvořena!" # todo: NEW TRANSLATION
 UKR_zelenskiy_here_TT: "£ukr_servant_of_the_people §YThe Servant of the People§! Strana musí být vytvořena!" # todo: NEW TRANSLATION
 ukr_zelenskiy.2.t: "Služebník lidu" # todo: NEW TRANSLATION
 ukr_zelenskiy.2.d: "Nečekané zprávy otřásly celou Ukrajinou. Dnes, v důsledku kongresu, byla založena strana Služebník lidu, pojmenovaná podle populárního filmu. Mnozí věří, že tato strana vznikla jako PR kampaň pro film, zatímco jiní tvrdí, že byla založena k prosazení slavného komika Volodymyra Zelenského jako kandidáta na prezidenta. Ačkoli Zelenskij sám své zapojení popírá, jeho vyhýbavé odpovědi mohou být základem pro další spekulace." # todo: NEW TRANSLATION
 ukr_zelenskiy.2.a: "Zajímavé" # todo: NEW TRANSLATION
 UKR_kuchma_second_terms: "Kučmovo druhé funkční období" # todo: NEW TRANSLATION
 UKR_kuchma_second_terms_desc: "Prezident Kučma vládne naší zemi druhé funkční období; možná tentokrát nebude znovu zvolen, nebo naši zemi přivede k chaosu. Uvidíme." # todo: NEW TRANSLATION
 UKR_reform_programm: "Reformní program" # todo: NEW TRANSLATION
 UKR_reform_programm_desc: "Zahájíme sérii reforem, které by měly naší zemi zajistit hospodářský růst a vyvést ji z krize po rozpadu SSSR." # todo: NEW TRANSLATION
 UKR_reform_national_guard: "Rozpustit Národní gardu" # todo: NEW TRANSLATION
 UKR_reform_national_guard_desc: "Přichází čas reforem. Je čas rozpuštit Národní gardu a přeorganizovat ji do účinnější struktury: Vnitřní jednotky." # todo: NEW TRANSLATION
 UKR_reform_vsu: "Nová vojenská doktrína" # todo: NEW TRANSLATION
 UKR_reform_vsu_desc: "Naše armáda se musí změnit a modernizovat; jinak nebudeme připraveni na válku s nepřítelem. Nová doktrína také posiluje naši spolupráci s NATO." # todo: NEW TRANSLATION
 UKR_check_and_balances: "Systém brzd a rovnováh" # todo: NEW TRANSLATION
 UKR_check_and_balances_desc: "Náš stát je v současnosti v nejisté politické situaci; musíme najít rovnováhu v politické sféře, abychom předešli katastrofě." # todo: NEW TRANSLATION
 UKR_yushenko_cabinet: "Kabinet Yushčenka" # todo: NEW TRANSLATION
 UKR_yushenko_cabinet_desc: "Viktor Yushčenko je již známým jménem, které se prosadilo ve svých manažerských zkušenostech. Výsledky jeho činnosti, které nám slíbil, by měly podpořit hospodářský růst naší země." # todo: NEW TRANSLATION
 UKR_welfare_reform: "Reformy pro sociální oblast" # todo: NEW TRANSLATION
 UKR_welfare_reform_desc: "Zdravotní péče byla od 90. let v žalostném stavu; je nutné ji začít reformovat." # todo: NEW TRANSLATION
 UKR_kosuik: "Kosiukova pekárna" # todo: NEW TRANSLATION
 UKR_kosuik_desc: "Domácí automobilový průmysl začíná oživení a soukromí podnikatelé budou motor tohoto procesu. Jeden z nich, Jurij Kosyuk, plánuje založit své vlastní továrny na výrobu zemědělských výrobků." # todo: NEW TRANSLATION
 UKR_azovstal_private: "Privatizace Azovstalu" # todo: NEW TRANSLATION
 UKR_azovstal_private_desc: "Přenecháme Azovstal do soukromých rukou, protože tak velké podnikání si nemůžeme finančně dovolit sami." # todo: NEW TRANSLATION
 UKR_land_reform: "Pozemková reforma" # todo: NEW TRANSLATION
 UKR_land_reform_desc: "Pozemková reforma měla být provedena už dávno, ale odkládali jsme ji co nejdéle. Nyní bude pro nás jednodušší prodávat půdu do soukromých rukou." # todo: NEW TRANSLATION
