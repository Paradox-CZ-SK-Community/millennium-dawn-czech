 UKR_bmz: "BMZ" # todo: NEW TRANSLATION
 UKR_bmz_desc: "Berdyčivský strojírenský závod (také známý jako závod Progress) je strojírenský podnik ve městě Berdyčiv v Žytomyrské oblasti na Ukrajině." # todo: NEW TRANSLATION
 UKR_nkmz: "NKMZ" # todo: NEW TRANSLATION
 UKR_nkmz_desc: "Novokramatorsky Mashynobudivny Zavod (Novokramatorský strojírenský závod) je významným ukrajinským výrobcem těžké techniky. Společnost vyrábí důlní zařízení, hutní zařízení, válcovny, kovací lisy, vysoké pece, drtiče rudy, lisy a další zařízení pro průmyslové procesy.\n\nSpolečnost vyrábí hřídele lodních šroubů pro ledoborce a součásti ponorek. Podle svých internetových stránek navrhla a postavila více než 18 důlních komplexů." # todo: NEW TRANSLATION
 UKR_oil_mining: "Těžba ropy" # todo: NEW TRANSLATION
 UKR_oil_mining_desc: "Rozvíjejte nová zařízení pro těžbu ropy s cílem zvýšit domácí produkci energie a snížit závislost na zahraničních dodávkách." # todo: NEW TRANSLATION
 UKR_mining2: "Zlepšení těžby surovin" # todo: NEW TRANSLATION
 UKR_mining2_desc: "Rozšiřte těžební provozy s cílem zvýšit těžbu chromu, wolframu a dalších strategických nerostů." # todo: NEW TRANSLATION
 UKR_construction_kovalska: "Kovalska" # todo: NEW TRANSLATION
 UKR_construction_kovalska_desc: "ICG Kovalska, LLC je ukrajinský developer a výrobce stavebních materiálů.\n\nVýroba: beton, betonové směsi, stavební malty, klasické železobetonové konstrukční výrobky, zdicí výrobky z lehčeného betonu, pórobeton, dlažební desky, suché stavební směsi, vodou ředitelné materiály (barvy, dekorativní omítky, pěny, lepidla)." # todo: NEW TRANSLATION
 UKR_train_prod: "Výroba vlaků" # todo: NEW TRANSLATION
 UKR_train_prod_desc: "Kremenčucký železniční vagónový závod je významná průmyslová společnost v Kremenčuku na Ukrajině, která vyrábí lokomotivy a vícenásobné jednotky." # todo: NEW TRANSLATION
 UKR_kharkiv_tractor: "HTZ" # todo: NEW TRANSLATION
 UKR_kharkiv_tractor_desc: "Charkovský traktorový závod (KhTZ nebo HTZ) je výrobce zemědělské techniky v ukrajinském městě Charkov. Závod, založený v letech 1930–1931 jako ústřední součást Stalinova prvního pětiletého plánu sovětské industrializace (1927–1932), byl největším ukrajinským výrobcem traktorů a vyráběl kolové i pásové traktory.\n\nV roce 1994, dva roky po rozpadu Sovětského svazu a vyhlášení nezávislosti Ukrajiny, byl závod přeměněn na otevřenou akciovou společnost. Vyrábí traktory včetně kolových traktorů pro všeobecné použití." # todo: NEW TRANSLATION
 UKR_agriculture2: "Modernizace zemědělství: další úroveň" # todo: NEW TRANSLATION
 UKR_agriculture2_desc: "Zaveďte pokročilé zemědělské postupy a rozšiřte produkci obilí s cílem upevnit pozici Ukrajiny jako globálního dodavatele potravin." # todo: NEW TRANSLATION
 UKR_chumak: "Chumak" # todo: NEW TRANSLATION
 UKR_chumak_desc: "Chumak (ukrajinsky: Чумак) je švédsko-ukrajinská potravinářská společnost v Kachovce v Chersonské oblasti. Mezi její produkty patří kečup, majonéza, těstoviny, salátové dresinky, omáčky na vaření, konzervovaná zelenina, nakládaná zelenina, rajčatový džus a slunečnicový olej." # todo: NEW TRANSLATION
 UKR_gsc_game_world: "GSC" # todo: NEW TRANSLATION
 UKR_gsc_game_world_desc: "GSC Game World je ukrajinská společnost vyvíjející videohry. Byla založena v Kyjevě v roce 1995 Sergijem Grygorovyčem a je známá především sériemi her Cossacks a S.T.A.L.K.E.R." # todo: NEW TRANSLATION
 UKR_national_bank: "Národní banka Ukrajiny" # todo: NEW TRANSLATION
 UKR_national_bank_desc: "Podle Ústavy Ukrajiny je hlavní funkcí Národní banky Ukrajiny (NBU) zajišťovat stabilitu měnové jednotky Ukrajiny, hřivny. Za tímto účelem Národní banka podporuje stabilitu bankovního systému a v rámci svých pravomocí také cenovou stabilitu." # todo: NEW TRANSLATION
 UKR_darnytsia: "Darnytsia" # todo: NEW TRANSLATION
