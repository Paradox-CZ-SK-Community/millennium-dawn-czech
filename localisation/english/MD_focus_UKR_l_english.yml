 UKR_edu_plan: "Plánování reforem školství" # todo: NEW TRANSLATION
 UKR_edu_plan_desc: "Ačkoli je vzdělávání v našem národě poměrně kvalitní, existují oblasti, které je třeba zlepšit, abychom tuto kvalitu udrželi nebo zvýšili. Musíme se připravit na probíhající digitální transformaci ve světě." # todo: NEW TRANSLATION
