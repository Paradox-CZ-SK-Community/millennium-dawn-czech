 ukraine_reorganize_navy_choose_future_corvette.6.desc: "V důsledku našeho nezávislého výběrového řízení jsme jako nejnovější přírůstek naší flotily vybrali korvety třídy „Mistral-1500T“.\nVyberme počet lodí, jejichž stavbu schválíme." # todo: NEW TRANSLATION
