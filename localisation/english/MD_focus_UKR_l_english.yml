 UKR_idea_orthodox_christian_church: "Ukrajinská pravoslavná církev" # todo: NEW TRANSLATION
 UKR_idea_shortened_general_staff: "Kompaktní generální štáb" # todo: NEW TRANSLATION
 UKR_idea_shortened_general_staff_desc: "Zjednodušení struktury vojenského velení zvyšuje efektivitu plánování a urychluje rozvoj důstojnického sboru." # todo: NEW TRANSLATION
 UKR_uda_encouraged: "Podpora UDA" # todo: NEW TRANSLATION
 UKR_uda_encouraged_desc: "Začlenění milice UDA do ozbrojených sil zvyšuje bojovou schopnost, ale snižuje vojenskou disciplínu." # todo: NEW TRANSLATION
 UKR_uda_integrated: "Integrovaná UDA" # todo: NEW TRANSLATION
 UKR_uda_integrated_desc: "Ukrajinská dobrovolnická armáda byla plně integrována do pravidelných ozbrojených sil, čímž posílila disciplínu a nacionalistické smýšlení." # todo: NEW TRANSLATION
 UKR_foreign_advisors: "Zahraniční poradci" # todo: NEW TRANSLATION
 UKR_ukrtelekom_idea: "Ukrtelecom" # todo: NEW TRANSLATION
 UKR_ukrtelekom_idea_desc: "Ukrtelecom, státní telekomunikační monopol, byl modernizován s cílem rozšířit digitální infrastrukturu a zvýšit produktivitu." # todo: NEW TRANSLATION
 UKR_finance_and_it: "Podpora finančního a IT sektoru" # todo: NEW TRANSLATION
 UKR_finance_and_it_desc: "Rozvoj finančního sektoru a informačních technologií vytváří ekonomickou aktivitu s vysokou přidanou hodnotou a zlepšuje výzkumné kapacity." # todo: NEW TRANSLATION
 UKR_digital_state: "Ukrajinský digitální stát" # todo: NEW TRANSLATION
 UKR_digital_state_desc: "Diia (ukrajinsky: Дія, doslova „Akce“; také zkratka ukrajinského Держава і Я, doslova „Stát a já“) je mobilní aplikace, webový portál a značka elektronické správy na Ukrajině. Aplikace Diia byla spuštěna v roce 2020 a umožňuje ukrajinským občanům používat digitální dokumenty ve svých chytrých telefonech namísto fyzických dokladů pro účely identifikace a sdílení.\n\nPortál Diia poskytuje přístup k více než 50 vládním službám. V budoucnu vláda plánuje prostřednictvím Diie zpřístupnit všechny druhy interakcí mezi státem a občany." # todo: NEW TRANSLATION
 UKR_tax_avoidance_idea: "Zanedbatelné daňové úniky" # todo: NEW TRANSLATION
 UKR_tax_avoidance_idea_desc: "Ačkoli mohou být daně přehlíženy a dokonce nemilovány, ve skutečnosti jsou naší sociální supervelmocí. Daně nám umožňují rozhodovat o organizaci našich komunit na místní i celostátní úrovni, abychom mohli všichni společně žít lepší život.\n\nZásadní překážkou je však snadnost, s jakou mocné elity unikají svým společenským povinnostem – odpovědnosti vůči společnostem, jejichž jsou součástí a z nichž profitují. – Zpráva o daňové spravedlnosti 2023" # todo: NEW TRANSLATION
 UKR_nuclear_energy: "Energoatom" # todo: NEW TRANSLATION
 UKR_nuclear_energy_desc: "Investice do jaderných elektráren zvyšují domácí výrobu energie a produkci reaktorů." # todo: NEW TRANSLATION
 UKR_construction: "Stavební úsilí" # todo: NEW TRANSLATION
 UKR_construction_desc: "Stavební kapacity přidělené naléhavým státem financovaným projektům." # todo: NEW TRANSLATION
 UKR_demographic_boom: "Demografický růst" # todo: NEW TRANSLATION
 UKR_demographic_boom_desc: "Příznivé demografické trendy a politika růstu populace rozšiřují naše dostupné lidské zdroje a pracovní sílu." # todo: NEW TRANSLATION
 UKR_demographic_crisis: "Demografická krize" # todo: NEW TRANSLATION
 UKR_demographic_crisis_desc: "Počet obyvatel země od 90. let klesá kvůli vysoké míře emigrace v kombinaci s vysokou úmrtností a nízkou porodností. Od roku 1993 se počet obyvatel každoročně snižuje v průměru o více než 300 000." # todo: NEW TRANSLATION
 UKR_tackle_corruption: "Vypořádat se s korupcí!" # todo: NEW TRANSLATION
 UKR_tackle_corruption_desc: "Protikorupční kampaň a institucionální reformy dramaticky zlepšují efektivitu vlády a národní produktivitu." # todo: NEW TRANSLATION
 UKR_corruption: "Hluboce zakořeněná korupce" # todo: NEW TRANSLATION
 UKR_large_construction: "Velký stavební program" # todo: NEW TRANSLATION
 UKR_large_construction_desc: "Ambiciózní program rozvoje infrastruktury urychluje dokončování staveb a zvyšuje produktivitu, avšak výrazně zvyšuje spotřebu energie." # todo: NEW TRANSLATION
 UKR_medical_reform: "Zdravotnická reforma" # todo: NEW TRANSLATION
