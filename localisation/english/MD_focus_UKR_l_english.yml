 UKR_odessa_ssak: "Důsledky Saakashviliho guvernérování" # todo: NEW TRANSLATION
 ukr_industry_points_cost_35: "35 průmyslových bodů" # todo: NEW TRANSLATION
 ukr_industry_points_cost_50: "50 průmyslových bodů" # todo: NEW TRANSLATION
 ukr_industry_points_cost_75: "75 průmyslových bodů" # todo: NEW TRANSLATION
