 ukraine_maidan_west.1.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.1.d: "Naše státní politiky nevyhovují určité části obyvatel. Lidé se začínají scházet na proslulém Kyjevském náměstí Majdan, aby vyjádřili nespokojenost s našimi politickými rozhodnutími." # todo: NEW TRANSLATION
 ukraine_maidan_west.1.a: "Sledujeme" # todo: NEW TRANSLATION
 ukraine_maidan_west.2.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.2.d: "Naše vláda očekávala rychlý konec protestů, ale to se nestalo, lidé začali stavět stany a utábořit se na náměstí, aby zůstali déle." # todo: NEW TRANSLATION
 ukraine_maidan_west.2.a: "Mám z toho špatný pocit" # todo: NEW TRANSLATION
 ukraine_maidan_west.3.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.3.d: "Protestující nehodlají odejít a začínají se chovat agresivněji, možná je na čase zasáhnout a zdemolovat jejich malé táborové městečko." # todo: NEW TRANSLATION
 ukraine_maidan_west.3.a: "Nasadit Berkut jednotku" # todo: NEW TRANSLATION
 ukraine_maidan_west.3.b: "Nebudeme zasahovat" # todo: NEW TRANSLATION
 ukraine_maidan_west.4.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.4.d: "Začali jsme protestující rozptylovat, mnoho zahraničních televizních kanálů to bere jako krvavé masakry; náš úkol je však jen jeden – zachránit stát" # todo: NEW TRANSLATION
 ukraine_maidan_west.4.a: "Ve prospěch mateřské vlasti!" # todo: NEW TRANSLATION
 ukraine_maidan_west.5.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.5.d: "Rozhodli jsme se nerozptylovat protestující, doufaje, že jejich zápal ochladne a všichni se vrátí domů, zatím uvidíme, co se stane dál, ale zatím nevidíme žádné známky uklidnění situace." # todo: NEW TRANSLATION
 ukraine_maidan_west.5.a: "Čekáme" # todo: NEW TRANSLATION
 ukraine_maidan_west.6.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.6.d: "Rozhodli jsme se jednat s protestujícími, možná dokážeme uspokojit jejich politické požadavky." # todo: NEW TRANSLATION
 ukraine_maidan_west.6.a: "Doufáme v nejlepší" # todo: NEW TRANSLATION
 ukraine_maidan_west.7.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.7.d: "Naše snahy o vyjednávání byly vnímány jako slabost, i ve straně. Naši kolegové aktivně opouštějí naše řady a přecházejí na stranu demonstrantů, cítí, že vítr změn je na jejich straně." # todo: NEW TRANSLATION
 ukraine_maidan_west.7.a: "Mám z toho špatný pocit" # todo: NEW TRANSLATION
 ukraine_maidan_west.8.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.8.d: "Naše politická strana se zcela zhroutila, ztratili jsme kolegy a zdá se, že kolegové ve straně souhlasí s požadavky opozice... Vypadá to na konec." # todo: NEW TRANSLATION
 ukraine_maidan_west.8.a: "To je hrozné" # todo: NEW TRANSLATION
 ukraine_maidan_west.10.t: "Povstání na jihovýchodě" # todo: NEW TRANSLATION
 ukraine_maidan_west.10.d: "Jižní a východní regiony se rovněž ukázaly nespokojené s děním a požadovaly federalizaci od nás. Budeme souhlasit?" # todo: NEW TRANSLATION
 ukraine_maidan_west.10.a: "Donbas se stane subjektem" # todo: NEW TRANSLATION
 ukraine_maidan_west.10.b: "Žádná federace" # todo: NEW TRANSLATION
 ukraine_maidan_west.11.t: "Kharkovská vzpoura" # todo: NEW TRANSLATION
 ukraine_maidan_west.11.d: "Povstání v Doněcku a Luhansku vyvolalo podobnou reakci v Charkově. Separatisté se tam dostali k moci a prohlásili Kharkovskou republiku." # todo: NEW TRANSLATION
 ukraine_maidan_west.11.a: "Kolik jich je?" # todo: NEW TRANSLATION
 ukraine_maidan_west.12.t: "Oděská vzpoura" # todo: NEW TRANSLATION
 ukraine_maidan_west.12.d: "Povstání na Donbasu vyvolalo nepokoje v Oděse. Zpočátku to začalo poměrně klidně, a mohlo to skončit, ale neměli jsme prostředky na potlačení povstání, a nyní místní občané vyhlásili svou republiku." # todo: NEW TRANSLATION
 ukraine_maidan_west.12.a: "Kolik jich je?" # todo: NEW TRANSLATION
 ukraine_maidan_west.13.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.13.d: "Pokoušeli jsme se násilně rozehnat Majdan s účastí Berkut." # todo: NEW TRANSLATION
 ukraine_maidan_west.13.a: "Chraňme zemi!" # todo: NEW TRANSLATION
 ukraine_maidan_west.14.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.14.d: "Odpověď nepřeskočila, protesty se radikalizovaly. Při použití násilné strategie lidé začali používat Molotovovy koktejly, malé zbraně a kameny proti našim bezpečnostním silám." # todo: NEW TRANSLATION
 ukraine_maidan_west.14.a: "Ach bože.." # todo: NEW TRANSLATION
 ukraine_maidan_west.15.t: "Nasadit armádu!" # todo: NEW TRANSLATION
 ukraine_maidan_west.15.d: "Budeme se snažit nasadit armádu, abychom se pokusili potlačit protesty." # todo: NEW TRANSLATION
 ukraine_maidan_west.15.a: "Ukrajinské ozbrojené síly zachrání Ukrajinu." # todo: NEW TRANSLATION
 ukraine_maidan_west.16.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.16.d: "Několik jednotek ozbrojených sil bylo uvedeno do pohotovosti a poslány do hlavního města, aby řešily protesty." # todo: NEW TRANSLATION
 ukraine_maidan_west.16.a: "Armáda dorazila do Kyjeva" # todo: NEW TRANSLATION
 ukraine_maidan_west.16.b: "Armáda nepomohla" # todo: NEW TRANSLATION
 ukraine_maidan_west.17.t: "Masakr v Kyjevě" # todo: NEW TRANSLATION
 ukraine_maidan_west.17.d: "Armáda vstoupila do ozbrojeného konfrontace s protestujícími. Začal skutečný masakr, kdy z obou stran do boje byly vypáleny zbraně." # todo: NEW TRANSLATION
 ukraine_maidan_west.17.a: "To je hrozné" # todo: NEW TRANSLATION
 ukraine_maidan_west.18.t: "Masakr v Kyjevě" # todo: NEW TRANSLATION
 ukraine_maidan_west.18.d: "Neměli jsme jinou možnost a v důsledku toho mnoho lidí, kteří přežili tuto razii, uprchlo do západních regionů země, kde se připravují bojovat proti naší vládě za takovou krutou zradu jejich lidu." # todo: NEW TRANSLATION
 ukraine_maidan_west.18.a: "Přichází bouře" # todo: NEW TRANSLATION
 ukraine_maidan_west.20.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.20.d: "Bez podpory armády nemohou naše bezpečnostní síly zvládnout tlak protestujících, možná se blíží poslední kolo této bitvy." # todo: NEW TRANSLATION
 ukraine_maidan_west.20.a: "Konec se blíží" # todo: NEW TRANSLATION
 ukraine_maidan_west.21.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.21.d: "Během protestů došlo k hrozná tragédie. Neznámí ostřelovači zahájili palbu na protestující, vyvolali ještě větší odezvu. Naši kolegové odcházejí s názorem, že rozkaz k střelbě přišel z naší vlády." # todo: NEW TRANSLATION
 ukraine_maidan_west.21.a: "Opravdu jsme prohráli?" # todo: NEW TRANSLATION
 ukraine_maidan_west.22.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.22.d: "Naše vláda se zcela zhroutila. Brzy tu nebude nikdo, kdo by nás podporoval. Je načase připravit se na předání moci." # todo: NEW TRANSLATION
 ukraine_maidan_west.22.a: "Poslední hodiny" # todo: NEW TRANSLATION
 ukraine_maidan_west.23.t: "Protesty na Majdanu" # todo: NEW TRANSLATION
 ukraine_maidan_west.23.d: "Naše vláda byla konečně svržena. Protesty dosáhly svého cíle." # todo: NEW TRANSLATION
 ukraine_maidan_west.23.a: "Majdan zvítězil" # todo: NEW TRANSLATION
 ukraine_maidan_east.1.t: "Pobuřování na jihovýchodě" # todo: NEW TRANSLATION
 ukraine_maidan_east.1.d: "Naše politika vedla k protestům a demonstracím na jihovýchodě země. Protesty s jasně proti vládě namířenými hesly zasáhly mnoho měst." # todo: NEW TRANSLATION
 ukraine_maidan_east.1.a: "Najednou" # todo: NEW TRANSLATION
 ukraine_maidan_east.2.t: "Poslanci se organizují sami" # todo: NEW TRANSLATION
 ukraine_maidan_east.2.d: "Protesty nabírají na tempu a nyní se k nim přidali místní poslanci a vyhlašují poměrně nebezpečná hesla." # todo: NEW TRANSLATION
 ukraine_maidan_east.2.a: "Znepokojující" # todo: NEW TRANSLATION
 ukraine_maidan_east.4.t: "Pokus o vyjednávání" # todo: NEW TRANSLATION
 ukraine_maidan_east.4.d: "Zkusíme vyjednávat s poslanci; ještě je možné konflikt vyřešit mírově." # todo: NEW TRANSLATION
 ukraine_maidan_east.4.a: "Doufáme v to nejlepší" # todo: NEW TRANSLATION
 ukraine_maidan_east.4.b: "Nechat poslance eskortovat pryč" # todo: NEW TRANSLATION
 ukraine_maidan_east.5.t: "Vyjednávání selhala" # todo: NEW TRANSLATION
 ukraine_maidan_east.5.d: "Nepodařilo se nám dosáhnout mírové dohody. Protestující zjevně nemají zájem o mírové řešení." # todo: NEW TRANSLATION
 ukraine_maidan_east.5.a: "Připravujeme se na nejhorší" # todo: NEW TRANSLATION
 ukraine_maidan_east.6.t: "Vyjednávání bylo úspěšné" # todo: NEW TRANSLATION
 ukraine_maidan_east.6.d: "Podařilo se nám předejít násilí a vyjednat s aktéry konfliktu. Nyní vyčkáváme na jejich návrh konečného urovnání." # todo: NEW TRANSLATION
 ukraine_maidan_east.6.a: "Vyhnuli jsme se nejhoršímu" # todo: NEW TRANSLATION
 ukraine_maidan_east.7.t: "Organizace milice" # todo: NEW TRANSLATION
 ukraine_maidan_east.7.d: "Místní protestující začali vytvářet milice, což vede k ozbrojenému povstání." # todo: NEW TRANSLATION
 ukraine_maidan_east.7.a: "Pane Bože.." # todo: NEW TRANSLATION
 ukraine_maidan_east.8.t: "Spustit potlačení" # todo: NEW TRANSLATION
 ukraine_maidan_east.8.d: "Situace se v mnoha regionech jihovýchodu dostává mimo kontrolu. Je načase jednat rozhodně." # todo: NEW TRANSLATION
 ukraine_maidan_east.8.a: "Pojedeme do Oděsy" # todo: NEW TRANSLATION
 ukraine_maidan_east.8.b: "Pojedeme do Donbasu a Charkova" # todo: NEW TRANSLATION
 ukraine_maidan_east.8.c: "Musíme se lépe připravit" # todo: NEW TRANSLATION
 ukraine_maidan_east.9.t: "Oděsa je zachráněna" # todo: NEW TRANSLATION
 ukraine_maidan_east.9.d: "Podařilo se nám potlačit místní separatisty dříve, než mohli získat kontrolu nad regionem, avšak nyní došlo k ozbrojenému povstání na Donbasu kvůli naší pozornosti na Oděsu." # todo: NEW TRANSLATION
 ukraine_maidan_east.9.a: "Je čas se připravit" # todo: NEW TRANSLATION
 ukraine_maidan_east.10.t: "Potlačení Donbasu" # todo: NEW TRANSLATION
 ukraine_maidan_east.10.d: "Náš pokus potlačit povstání Donbasu byl neúspěšný. Jednotky Berkut se přidaly k povstalcům, čímž se naše situace ještě zhoršila." # todo: NEW TRANSLATION
 ukraine_maidan_east.10.a: "Je čas se připravit" # todo: NEW TRANSLATION
 ukraine_maidan_east.11.t: "Kritické zpoždění" # todo: NEW TRANSLATION
 ukraine_maidan_east.11.d: "Naše zpoždění způsobilo, že mnoho republik na jihovýchodě vyvolalo ozbrojená povstání." # todo: NEW TRANSLATION
 ukraine_maidan_east.11.a: "Udělali jsme chybu." # todo: NEW TRANSLATION
 ukraine_maidan_east.12.t: "Pobuřování na jihovýchodě" # todo: NEW TRANSLATION
 ukraine_maidan_east.12.d: "Naše činy vyvolaly široké eskalace a nyní čelíme následkům." # todo: NEW TRANSLATION
 ukraine_maidan_east.12.a: "Udělali jsme chybu." # todo: NEW TRANSLATION
 ukraine_maidan_east.13.t: "Povstání v Charkově" # todo: NEW TRANSLATION
 ukraine_maidan_east.13.d: "Nedostatečná připravenost našich zvláštních služeb na nás opět sehrála špatný vtip. V Charkově jsme nebyli schopni potlačit povstání, což vedlo k ozbrojenému povstání." # todo: NEW TRANSLATION
 ukraine_maidan_east.13.a: "Kolik jich je?" # todo: NEW TRANSLATION
 ukraine_maidan_east.17.t: "Povstání Donbasu" # todo: NEW TRANSLATION
 ukraine_maidan_east.17.d: "Ozbrojené povstání začalo v Doněcké a Luhanské oblasti. Jednotky Berkut byly klíčové při pomoci povstalcům odzbrojit některé vojenské jednotky tam umístěné." # todo: NEW TRANSLATION
 ukraine_maidan_east.17.a: "Sakra" # todo: NEW TRANSLATION
 ukraine_maidan_east.18.t: "Odesská vzpoura" # todo: NEW TRANSLATION
 ukraine_maidan_east.18.d: "Přestoupení Berkut na stranu povstalců výrazně inspirovalo separatisty v Oděse, kde rovněž prohlásili vznik lidové republiky." # todo: NEW TRANSLATION
 ukraine_maidan_east.18.a: "Kolik jich je?" # todo: NEW TRANSLATION
 ukraine_maidan_east.19.t: "Vláda ztrácí moc" # todo: NEW TRANSLATION
 ukraine_maidan_east.19.d: "Udělal(a) jsme kritické chyby, které vedly k občanské válce, a naši političtí oponenti to využijí k získání moci." # todo: NEW TRANSLATION
 ukraine_maidan_east.19.a: "Ať se stane cokoli" # todo: NEW TRANSLATION
 ukraine_maidan_east.19.b: "Ať se stane cokoli" # todo: NEW TRANSLATION
 ukraine_maidan_east.19.c: "Ať se stane cokoli" # todo: NEW TRANSLATION
 ukraine_maidan_east.21.t: "Vláda ztrácí moc" # todo: NEW TRANSLATION
 ukraine_maidan_east.21.d: "Udělal(a) jsme kritické chyby, které vedly k občanské válce, a naši političtí oponenti to využijí k získání moci." # todo: NEW TRANSLATION
 ukraine_maidan_east.21.a: "Zvládneme to sami" # todo: NEW TRANSLATION
 ukraine_maidan_east.21.b: "Požádáme o pomoc Rusko" # todo: NEW TRANSLATION
 ukraine_maidan_east.22.t: "Konsolidace proti společnému nepříteli" # todo: NEW TRANSLATION
 ukraine_maidan_east.22.d: "Navzdory vypuknutí občanské války se lidé kolem nás semkli. Ztratili jsme jen málo politického vlivu, vyvažujíce to hesly o posvátném boji proti separatistům." # todo: NEW TRANSLATION
 ukraine_maidan_east.22.a: "Za Ukrajinu!" # todo: NEW TRANSLATION
 ukraine_maidan_east.23.t: "Ukrajina požádala o naši pomoc" # todo: NEW TRANSLATION
 ukraine_maidan_east.23.d: "Ukrajinská vláda požádala o naši pomoc kvůli vypuknutí občanské války. Nyní musíme rozhodnout, zda jsme ochotni jim pomoci." # todo: NEW TRANSLATION
 ukraine_maidan_east.23.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 ukraine_maidan_east.23.b: "Nechte je to vyřešit samy" # todo: NEW TRANSLATION
 ukraine_maidan_east.24.t: "Volba pomoci" # todo: NEW TRANSLATION
 ukraine_maidan_east.24.d: "Souhlasili jsme s ukrajinským požadavkem na vyslání kontingentu. Nyní musíme rozhodnout, koho vyslat." # todo: NEW TRANSLATION
 ukraine_maidan_east.24.a: "Pošleme pořádkovou policii" # todo: NEW TRANSLATION
 ukraine_maidan_east.24.b: "Pošleme Rosgvardiyu" # todo: NEW TRANSLATION
 ukraine_maidan_east.24.c: "Pošleme PMC Wagner" # todo: NEW TRANSLATION
 ukraine_maidan_east.25.t: "Rusko nám odmítlo pomoci" # todo: NEW TRANSLATION
 ukraine_maidan_east.25.d: "Ruská vláda odmítla nám pomoci ani se jich zúčastnit na našich tragických událostech. Jsme zklamáni." # todo: NEW TRANSLATION
 ukraine_maidan_east.25.a: "Zrádci" # todo: NEW TRANSLATION
 ukraine_maidan_east.26.t: "Otázka federalizace" # todo: NEW TRANSLATION
 ukraine_maidan_east.26.d: "Povstalci předložili svůj hlavní a jediný požadavek: federalizaci Ukrajiny, Donbasu zvláštní postavení jako federální subjekt. Jsme připraveni riskovat a souhlasit s takovou reformou?" # todo: NEW TRANSLATION
 ukraine_maidan_east.26.a: "Federalizace by měla být" # todo: NEW TRANSLATION
 ukraine_maidan_east.26.b: "Nikdy" # todo: NEW TRANSLATION
 ukraine_maidan_east.27.t: "Odmítnutí federalizace" # todo: NEW TRANSLATION
 ukraine_maidan_east.27.d: "Souhlasili jsme s federalizací, a díky tomu jsme se vyhnuli hrozným důsledkům pro naši zemi." # todo: NEW TRANSLATION
 ukraine_maidan_east.27.a: "Dobré" # todo: NEW TRANSLATION
 UKR_maidan_temporary_attack_idea: "Organizovaný útok" # todo: NEW TRANSLATION
 UKR_maidan_temporary_attack_idea_desc: "Nepokoje v ulicích dodávají vojenským silám energii a dočasně posilují bojovou připravenost." # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.1.t: "Vláda svržena" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.1.d: "Naše vláda byla svržena. Kandidát protestujících se dostal k moci.\nJeho směřování je:" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.1.a: "£democratic_group_small   $democratic$" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.1.b: "£communism_group_small   $communism$" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.1.c: "£neutrality_group_small   $neutrality$" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.1.e: "£nationalist_group_small   $nationalist$" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.2.t: "Vláda svržena – nový prezident" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.2.d: "Kandidát protestujících se dostal k moci. Jeho strana je:" # todo: NEW TRANSLATION
 ukraine_maidan_overthrow.2.e: "Zpět do nabídky směřování" # todo: NEW TRANSLATION
 ukraine_maidan.1.t: "Stav Krymu" # todo: NEW TRANSLATION
 ukraine_maidan.1.d: "Krym má většinu ruského obyvatelstva. Lidé tam jsou naši lidé. Není spravedlivé pro ně a jejich bratry v Donbasu žít pod ukrajinskou vládou. Měli bychom vyhovět jejich volání a integrovat lidi, kteří touží být s námi?" # todo: NEW TRANSLATION
 ukraine_maidan.1.a: "Zajmout Krym" # todo: NEW TRANSLATION
 ukraine_maidan.1.b: "Krym je ukrajinský" # todo: NEW TRANSLATION
 ukraine_maidan.2.t: "Rusko anektuje Krym" # todo: NEW TRANSLATION
 ukraine_maidan.2.d: "Lidé na Krymu se odtrhli. Požádali o podporu ruské vlády. Krymští obyvatelé drtivou většinou schválili referendum o začlenění do ruského státu. Ruské jednotky v blízkosti Krymu vtrhly do regionu a rychle obsadily klíčové body. Vojenské jednotky byly zrádci uvítány s otevřenou náručí. Jednoho dne získáme území, které nám náleží právem!" # todo: NEW TRANSLATION
 ukraine_maidan.2.a: "Zajímavé" # todo: NEW TRANSLATION
 ukraine_maidan.3.t: "Rusko popírá lid Ukrajiny" # todo: NEW TRANSLATION
 ukraine_maidan.3.d: "Zrádci na Krymu konečně uspořádali jejich hloupé referendum, aby se odtrhli od nás. Lidé v Rusku dlouho podporovali tento směr chování. Není jasné, proč Rusové popřeli lidi Krymu. Přesto se ukázalo, že nás nepoškodnili tím, že by obsadili region. Čas ukáže, co toto rozhodnutí způsobí." # todo: NEW TRANSLATION
 ukraine_maidan.3.a: "Dobrý den" # todo: NEW TRANSLATION
 ukraine_revolution.30.t: "Nejvyšší rada Krymu" # todo: NEW TRANSLATION
 ukraine_revolution.30.d: "Nejvyšší rada Krymu zkouší hranice kyjevské autority. Máme povolit referendum o statusu poloostrova, nebo radu rozpustit?" # todo: NEW TRANSLATION
 ukraine_revolution.30.a: "Povolit referendum" # todo: NEW TRANSLATION
 ukraine_revolution.30.b: "Rozpustit radu" # todo: NEW TRANSLATION
 ukraine_revolution.31.t: "Moskva zasahuje" # todo: NEW TRANSLATION
 ukraine_revolution.31.d: "Kyjev otevřel otázku statusu Krymu. Moskva může přijmout ukrajinské autonomní uspořádání, nebo podpořit vlastní referendum." # todo: NEW TRANSLATION
 ukraine_revolution.31.a: "Přijmout ukrajinskou autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.31.b: "Podpořit referendum" # todo: NEW TRANSLATION
 ukraine_revolution.32.t: "Krymské referendum" # todo: NEW TRANSLATION
 ukraine_revolution.32.d: "Referendum vložilo budoucnost Krymu do rukou Moskvy. Musíme rozhodnout, zda uznáme ruský protektorát, nebo poloostrov přímo anektujeme." # todo: NEW TRANSLATION
 ukraine_revolution.32.a: "Vytvořit ruský protektorát" # todo: NEW TRANSLATION
 ukraine_revolution.32.b: "Přímo anektovat Krym" # todo: NEW TRANSLATION
 ukraine_revolution.33.t: "Moskva odpovídá" # todo: NEW TRANSLATION
 ukraine_revolution.33.d: "Kyjev rozpustil krymskou radu. Moskva musí rozhodnout, zda odpoví nátlakem, nebo ustoupí." # todo: NEW TRANSLATION
 ukraine_revolution.33.a: "Vyvinout diplomatický tlak" # todo: NEW TRANSLATION
 ukraine_revolution.33.b: "Ustoupit" # todo: NEW TRANSLATION
 ukraine_revolution.40.t: "Politická budoucnost Doněcku" # todo: NEW TRANSLATION
 ukraine_revolution.40.d: "Doněcká oblast požaduje přímé slovo ve své vládě. Kyjev musí volit mezi vyjednaným řešením, tvrdým zásahem nebo novou autonomní republikou." # todo: NEW TRANSLATION
 ukraine_revolution.40.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.40.b: "Rozpustit radu" # todo: NEW TRANSLATION
 ukraine_revolution.40.c: "Povolit Doněckou republiku" # todo: NEW TRANSLATION
 ukraine_revolution.40.e: "Nechat Donbas povstat ve zbrani" # todo: NEW TRANSLATION
 ukraine_revolution.41.t: "Politická budoucnost Luhansku" # todo: NEW TRANSLATION
 ukraine_revolution.41.d: "Luhanské rady následují příkladu Doněcku. Jejich požadavky lze zvládnout kompromisem, silou nebo uznáním republiky." # todo: NEW TRANSLATION
 ukraine_revolution.41.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.41.b: "Potlačit hnutí" # todo: NEW TRANSLATION
 ukraine_revolution.41.c: "Povolit Luhanskou republiku" # todo: NEW TRANSLATION
 ukraine_revolution.42.t: "Politická budoucnost Krymu" # todo: NEW TRANSLATION
 ukraine_revolution.42.d: "O status Krymu se znovu vede spor, zatímco země je již pod tlakem. Kyjev může uznat místní autonomii, rozpustit radu nebo se podřídit opatrnému krymskému procesu." # todo: NEW TRANSLATION
 ukraine_revolution.42.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.42.b: "Rozpustit radu" # todo: NEW TRANSLATION
 ukraine_revolution.42.c: "Využít krymský proces" # todo: NEW TRANSLATION
 ukraine_revolution.43.t: "Charkovská rada" # todo: NEW TRANSLATION
 ukraine_revolution.43.d: "Charkovští regionální politici zkoušejí hranice kyjevské autority. Vláda musí rozhodnout, zda bude vyjednávat, radu potlačí, nebo strpí místní správu." # todo: NEW TRANSLATION
 ukraine_revolution.43.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.43.b: "Potlačit radu" # todo: NEW TRANSLATION
 ukraine_revolution.43.c: "Strpět místní správu" # todo: NEW TRANSLATION
 ukraine_revolution.44.t: "Záporožská rada" # todo: NEW TRANSLATION
 ukraine_revolution.44.d: "Záporoží požaduje záruky pro své místní instituce. Kompromis může region uklidnit, zatímco represe mohou krizi rozšířit." # todo: NEW TRANSLATION
 ukraine_revolution.44.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.44.b: "Potlačit radu" # todo: NEW TRANSLATION
 ukraine_revolution.44.c: "Strpět místní správu" # todo: NEW TRANSLATION
 ukraine_revolution.45.t: "Jižní rady" # todo: NEW TRANSLATION
 ukraine_revolution.45.d: "Cherson a Mykolajiv se organizují kolem požadavků na místní kontrolu. Jejich rady lze zapojit do dohody, nebo zatlačit do otevřené opozice." # todo: NEW TRANSLATION
 ukraine_revolution.45.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.45.b: "Potlačit rady" # todo: NEW TRANSLATION
 ukraine_revolution.45.c: "Strpět místní správy" # todo: NEW TRANSLATION
 ukraine_revolution.46.t: "Politická budoucnost Oděsy" # todo: NEW TRANSLATION
 ukraine_revolution.46.d: "Oděská rada zvažuje autonomii proti přímému odtržení od Kyjeva. Stávající Oděská republika je k dispozici, pokud vláda ztratí kontrolu." # todo: NEW TRANSLATION
 ukraine_revolution.46.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.46.b: "Potlačit radu" # todo: NEW TRANSLATION
 ukraine_revolution.46.c: "Povolit Oděskou republiku" # todo: NEW TRANSLATION
 ukraine_revolution.47.t: "Politická budoucnost Dnipra" # todo: NEW TRANSLATION
 ukraine_revolution.47.d: "Průmyslový region Dnipra požaduje hlas v novém politickém uspořádání. Kyjev může vyjednávat, potlačit radu nebo umožnit vznik stávající Dniprovské republiky." # todo: NEW TRANSLATION
 ukraine_revolution.47.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.47.b: "Potlačit radu" # todo: NEW TRANSLATION
 ukraine_revolution.47.c: "Povolit Dniprovskou republiku" # todo: NEW TRANSLATION
 ukraine_revolution.48.t: "Sumská rada" # todo: NEW TRANSLATION
 ukraine_revolution.48.d: "Sumské místní úřady žádají záruky proti rozhodnutím přijímaným v Kyjevě. Vyjednaná rada je nejméně rušivou cestou, ale stále je možné potlačení i uznání." # todo: NEW TRANSLATION
 ukraine_revolution.48.a: "Vyjednat místní autonomii" # todo: NEW TRANSLATION
 ukraine_revolution.48.b: "Potlačit radu" # todo: NEW TRANSLATION
 ukraine_revolution.48.c: "Strpět místní správu" # todo: NEW TRANSLATION
 ukraine_revolution.49.t: "Budoucnost Novoruska" # todo: NEW TRANSLATION
 ukraine_revolution.49.d: "Zúčastněné republiky se sjednotily v Novorusko. Kyjev musí rozhodnout, zda ho uzná jako ukrajinský autonomní subjekt, přijme nezávislou konfederaci, nebo bude bojovat o jeho území." # todo: NEW TRANSLATION
 ukraine_revolution.49.a: "Uznat ukrajinský autonomní subjekt" # todo: NEW TRANSLATION
 ukraine_revolution.49.b: "Přijmout nezávislou konfederaci" # todo: NEW TRANSLATION
 ukraine_revolution.49.c: "Bojovat o území" # todo: NEW TRANSLATION
 ukraine_revolution.50.t: "Vzpomínka na kongres" # todo: NEW TRANSLATION
 ukraine_revolution.50.d: "Severodoněcký kongres se stal součástí politické paměti regionu. Jeho požadavek na hlas při rozhodování v Kyjevě stále utváří instituce republiky." # todo: NEW TRANSLATION
 ukraine_revolution.50.a: "Zaznamenat odkaz" # todo: NEW TRANSLATION
 ukraine_revolution.51.t: "Rady se stávají institucemi" # todo: NEW TRANSLATION
 ukraine_revolution.51.d: "Vlna regionálních rad skončila. Některé rady byly potlačeny, jiné se staly republikami, ale každá zanechala trvalou stopu v uspořádání po Majdanu." # todo: NEW TRANSLATION
 ukraine_revolution.51.a: "Nová politická mapa" # todo: NEW TRANSLATION
 ukraine_revolution.52.t: "Vzniká republika" # todo: NEW TRANSLATION
 ukraine_revolution.52.d: "První regionální republika ustavila vlastní vládu. Její budoucnost bude záviset na tom, zda místní správa přežije krizi, která ji vytvořila." # todo: NEW TRANSLATION
 ukraine_revolution.52.a: "Udržet linii" # todo: NEW TRANSLATION
 ukraine_revolution.53.t: "Dlouhý stín Krymu" # todo: NEW TRANSLATION
 ukraine_revolution.53.d: "Krymské uspořádání z roku 2004 bylo konečně zaznamenáno v politickém řádu. Toto rozhodnutí neukončilo všechny spory, ale dalo statusu poloostrova historii, kterou nelze ignorovat." # todo: NEW TRANSLATION
 ukraine_revolution.53.a: "Připomenout uspořádání" # todo: NEW TRANSLATION
 ukraine_revolution.54.t: "Novoruské uspořádání" # todo: NEW TRANSLATION
 ukraine_revolution.54.d: "Novoruské uspořádání změnilo rovnováhu mezi Kyjevem, regionálními republikami a Moskvou. Nové uspořádání bude posuzováno podle toho, co zachová, nejen podle toho, co si nárokuje." # todo: NEW TRANSLATION
 ukraine_revolution.54.a: "Zachovat záznam" # todo: NEW TRANSLATION
 ukraine_revolution.55.t: "Svobodné území" # todo: NEW TRANSLATION
 ukraine_revolution.55.d: "Anarchističtí militanti ve vedení nového státu tvrdí, že Novorusko je vypůjčené jméno, které lidem z Huljajpole nic neříká. Chtějí obnovit starý prapor Nestora Machna a nazvat zemi tím, čím je: svobodným územím." # todo: NEW TRANSLATION
 ukraine_revolution.55.a: "Přijmout Svobodné území" # todo: NEW TRANSLATION
 ukraine_revolution.55.b: "Ponechat název Novorusko" # todo: NEW TRANSLATION
 ukraine_maidan.4.t: "Minské dohody" # todo: NEW TRANSLATION
 ukraine_maidan.4.d: "Válka nás nevedla ke očekávanému výsledku. Separatisté nebyli zničeni a lidé jsou zřejmně nespokojeni s nekonečnou válkou. Možná bychom si měli dát pauzu?" # todo: NEW TRANSLATION
 ukraine_maidan.4.a: "Mír nyní" # todo: NEW TRANSLATION
 ukraine_maidan.4.b: "Mír? Proč?" # todo: NEW TRANSLATION
 ukraine_maidan.6.t: "Pozorovatelé OSCE" # todo: NEW TRANSLATION
 ukraine_maidan.6.d: "Aby se kontroloval a předcházel ozbrojenému konfliktu, byli do pohraniční oblasti vysláni pozorovatelé OSCE, aby zajistili mír a stabilitu v Donbasu." # todo: NEW TRANSLATION
 ukraine_maidan.6.a: "Jen příměří" # todo: NEW TRANSLATION
 ukraine_maidan.8.t: "Ukrajina navrhuje federalizaci" # todo: NEW TRANSLATION
 ukraine_maidan.8.d: "Ukrajina nám nabízí projekt federalizace a souhlasí s tím, že nás uzná jako samostatný útvar. Budeme s tím souhlasit?" # todo: NEW TRANSLATION
 ukraine_maidan.8.a: "Souhlasíme" # todo: NEW TRANSLATION
 ukraine_maidan.8.b: "To je lež!" # todo: NEW TRANSLATION
 ukraine_maidan.9.t: "Spolupráce s ruskými podniky" # todo: NEW TRANSLATION
 ukraine_maidan.9.d: "Budeme nadále spolupracovat s ruskými podniky, protože Evropská unie nám nemůže poskytnout takovou úroveň zdrojů a technologií, kterou potřebujeme." # todo: NEW TRANSLATION
 ukraine_maidan.9.a: "Nutná oběť" # todo: NEW TRANSLATION
 ukraine_maidan.16.t: "Populistická reforma" # todo: NEW TRANSLATION
 ukraine_maidan.16.d: "Naše prezidentství musí začít nějakou reformou. Musíme se rozhodnout, co přesně bude středem našich reformních aktivit." # todo: NEW TRANSLATION
 ukraine_maidan.16.a: "Pozemková reforma" # todo: NEW TRANSLATION
 ukraine_maidan.16.b: "Dopravní reforma" # todo: NEW TRANSLATION
 ukraine_maidan.16.c: "Budeme ovlivňovat Radu" # todo: NEW TRANSLATION
 ukraine_maidan_crm_annex.1.t: "Anexe Krymu" # todo: NEW TRANSLATION
 ukraine_maidan_crm_annex.1.d: "Krymský poloostrov byl anektován Ruskem. Co bychom měli udělat dál?" # todo: NEW TRANSLATION
 ukraine_maidan_crm_annex.1.a: "Prozatím ustoupíme" # todo: NEW TRANSLATION
 ukraine_maidan_crm_annex.1.b: "Budeme bojovat za Krym" # todo: NEW TRANSLATION
 ukraine_news.7.t: "Občanská válka na Ukrajině" # todo: NEW TRANSLATION
 ukraine_news.7.d: "Lidé v regionu Donbas na Ukrajině vyhlásili nezávislost. Oznámili obyvatelům Doněcké a Luhanské oblasti, že už nebudou podléhat tyranii Kyjeva. [UKR.GetLeader] a ukrajinská administrativa rebely odsoudili a mobilizovali k jejich potlačení. Ve regionu již došlo k potyčkám mezi místními silami podporujícími Ukrajinu a rebely." # todo: NEW TRANSLATION
 ukraine_news.7.a: "Quell the Rebellion" # todo: NEW TRANSLATION
 ukraine_news.7.b: "Defeat the Oppressors!" # todo: NEW TRANSLATION
 ukraine_news.7.c: "Interesting Situation" # todo: NEW TRANSLATION
 ukraine_news.8.t: "Anexe Krymu" # todo: NEW TRANSLATION
 ukraine_news.8.d: "Lidé na Krymu uspořádali referendum o odtržení od Ukrajiny a připojení k Rusku. Ruská odpověď byla rychlá a rozhodná, jak brzy nasadili vojáky do regionu a anektovali poloostrov. Ukrajinská vláda vyjádřila svůj rozhořčení nad touto záležitostí a žádá, aby Rusko Krym vrátilo." # todo: NEW TRANSLATION
 ukraine_news.8.a: "Pouze na okamžik..." # todo: NEW TRANSLATION
 ukraine_news.8.b: "Pro Matku Rus!" # todo: NEW TRANSLATION
 ukraine_news.8.c: "Znepokojivé zprávy." # todo: NEW TRANSLATION
 UKR_crimea_bund: "Krymská republika se vzbouřila" # todo: NEW TRANSLATION
 UKR_civil_war: "Válka na Donbasu" # todo: NEW TRANSLATION
 UKR_civil_war_desc: "Naše země je rozdělena – vedeme občanskou válku proti vlastním občanům, naše armáda není jednotná v úsilí zničit separatisty" # todo: NEW TRANSLATION
 UKR_russian_gas: "Ruské energetické zdroje" # todo: NEW TRANSLATION
 UKR_russian_gas_desc: "Jsme silně závislí na dodávkách zdrojů z Ruska, a dokud nenajdeme alternativu, budeme nuceni vyjednávat s Moskvou" # todo: NEW TRANSLATION
 UKR_russian_gas_cheap: "Levné ruské energetické zdroje" # todo: NEW TRANSLATION
 UKR_russian_gas_cheap_desc: "Jsme silně závislí na dodávkách zdrojů z Ruska, a dokud nenajdeme alternativu, budeme nuceni vyjednávat s Moskvou" # todo: NEW TRANSLATION
 UKR_russian_gas_cheaper: "Levnější ruské energetické zdroje" # todo: NEW TRANSLATION
 UKR_russian_gas_cheaper_desc: "Jsme silně závislí na dodávkách zdrojů z Ruska, a dokud nenajdeme alternativu, budeme nuceni vyjednávat s Moskvou" # todo: NEW TRANSLATION
 UKR_russian_gas_sov: "Plynová smlouva s Ukrajinou" # todo: NEW TRANSLATION
 UKR_russian_gas_sov_desc: "Plynová smlouva byla mezi námi a Ukrajinou podepsána za zvláštních podmínek, které nám umožňují mít nad nimi páku" # todo: NEW TRANSLATION
 UKR_russian_gas_cheap_sov: "Plynová smlouva s Ukrajinou" # todo: NEW TRANSLATION
 UKR_russian_gas_cheap_sov_desc: "Plynová smlouva byla mezi námi a Ukrajinou podepsána za zvláštních podmínek, které nám umožňují mít nad nimi páku" # todo: NEW TRANSLATION
 UKR_russian_gas_cheaper_sov: "Plynová smlouva s Ukrajinou" # todo: NEW TRANSLATION
 UKR_russian_gas_cheaper_sov_desc: "Plynová smlouva byla mezi námi a Ukrajinou podepsána za zvláštních podmínek, které nám umožňují mít nad nimi páku" # todo: NEW TRANSLATION
 UKR_idea_old_national_guard: "Národní garda" # todo: NEW TRANSLATION
 UKR_idea_old_national_guard_desc: "Národní garda Ukrajiny je státním ozbrojeným útvarem vytvořeným na základě Interních vojsk SSSR, určeným k ochraně suverenity Ukrajiny, její územní integrity, stejně jako života a osobní důstojnosti občanů, jejich ústavních práv a svobod před trestnými zásahy a dalšími antisociálními činnostmi." # todo: NEW TRANSLATION
 UKR_kleptocracy: "Kleptokracie" # todo: NEW TRANSLATION
 UKR_kleptocracy_desc: "Ukrajinská vláda je v současné době uvězněná ve své kleptokracii. Nejvyšší hodnosti jsou zkorumpované a používají svou moc k vykořisťování lidí a přírodních zdrojů svého území k rozšíření svého bohatství a politické moci. \n\n§CAby se zlepšil negativní dopad kleptokracie, je nutné přijmout opatření proti korupci.§!" # todo: NEW TRANSLATION
 UKR_kleptocracy01: "Silná kleptokracie" # todo: NEW TRANSLATION
 UKR_kleptocracy01_desc: "Ukrajinská vláda je v současné době uvězněná ve své kleptokracii. Nejvyšší hodnosti jsou zkorumpované a používají svou moc k vykořisťování lidí a přírodních zdrojů svého území k rozšíření svého bohatství a politické moci. \n\n§CAby se zlepšil negativní dopad kleptokracie, je nutné přijmout opatření proti korupci.§!" # todo: NEW TRANSLATION
 UKR_kleptocracy02: "Velmi silná kleptokracie" # todo: NEW TRANSLATION
 UKR_kleptocracy02_desc: "Ukrajinská vláda je v současné době uvězněná ve své kleptokracii. Nejvyšší hodnosti jsou zkorumpované a používají svou moc k vykořisťování lidí a přírodních zdrojů svého území k rozšíření svého bohatství a politické moci. \n\n§CAby se zlepšil negativní dopad kleptokracie, je nutné přijmout opatření proti korupci.§!" # todo: NEW TRANSLATION
 UKR_kleptocracy03: "Paralyzující kleptokracie" # todo: NEW TRANSLATION
 UKR_kleptocracy03_desc: "Ukrajinská vláda je v současné době uvězněná ve své kleptokracii. Nejvyšší hodnosti jsou zkorumpované a používají svou moc k vykořisťování lidí a přírodních zdrojů svého území k rozšíření svého bohatství a politické moci. \n\n§CAby se zlepšil negativní dopad kleptokracie, je nutné přijmout opatření proti korupci.§!" # todo: NEW TRANSLATION
 UKR_to_many_generals: "Nadměrný generální štáb" # todo: NEW TRANSLATION
 UKR_to_many_generals_desc: "Ukrajina má 450 aktivních generálů v armádě. Většina z nich získala svá místa díky konexím a korupčním schématům a nemají zkušenosti s vedením bojových operací. Současný generální štáb je neschopný a zoufale potřebuje reformu." # todo: NEW TRANSLATION
 UKR_idea_government_in_need: "Neefektivní vláda" # todo: NEW TRANSLATION
 UKR_idea_government_in_need_desc: "Ukrajinská vláda je sužována rozsáhlou korupcí a neefektivitou. Korupce zdvojnásobuje administrativní náklady, zatímco špatná správa snižuje průmyslovou produktivitu a politickou kapacitu." # todo: NEW TRANSLATION
 UKR_every_man_ataman: "Každý muž – ataman" # todo: NEW TRANSLATION
 UKR_every_man_ataman_desc: "Duch Ukrajinců je duchem svobody a nezávislosti; někdy přináší prospěch, jindy zemi krutě ublíží." # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_1: "Průzkumná loď Simferopol" # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_1_desc: "Trup vypadá jako rybářská loď a naslouchá všemu v dosahu horizontu." # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_2: "Průzkumná loď Simferopol" # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_2_desc: "Trup vypadá jako rybářská loď a naslouchá všemu dokonce i za horizontem." # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_3: "Průzkumná loď Simferopol" # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_3_desc: "Speciálně postavený trup vypadá jako civilní plavidlo a naslouchá všemu v dosahu horizontu." # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_4: "Průzkumná loď Simferopol" # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship_idea_4_desc: "Speciálně postavený trup vypadá jako civilní plavidlo a naslouchá všemu dokonce i za horizontem." # todo: NEW TRANSLATION
 UKR_lahuna_recon_ship: "Senzorová výbava třídy Lahuna" # todo: NEW TRANSLATION
 UKR_support_uia: "UIA" # todo: NEW TRANSLATION
 UKR_support_uia_desc: "UIA, neboli Ukrajinské mezinárodní aerolinie, je vlajkovou a největší aerolinkou na Ukrajině. Hlavním uzlem pro její letadla je mezinárodní letiště Boryspil v Kyjevě. Provozuje pravidelné lety a nákladní služby do Evropy, na Blízký východ, do Spojených států, Kanady a Asie." # todo: NEW TRANSLATION
 UKR_build_new_airports: "Postavte nová letiště" # todo: NEW TRANSLATION
 UKR_build_new_airports_desc: "Naše letiště bylo dlouho zanedbáváno. Musíme investovat do našich letišť jak pro civilní, tak pro vojenské účely." # todo: NEW TRANSLATION
 UKR_invest_in_ministry_of_infrastructure: "Ministerstvo infrastruktury" # todo: NEW TRANSLATION
 UKR_invest_in_ministry_of_infrastructure_desc: "Ministerstvo infrastruktury čelilo kritice. Infrastruktura Ukrajiny kolabuje kvůli zkorumpovaným úředníkům v ministerstvu, kteří zpronevěřují prostředky. Lidé nemohou na některých silnicích jezdit kvůli stavu vozovek. Je načase ministerstvo přeorganizovat s nadějí na lepší budoucnost pro naše průmysly." # todo: NEW TRANSLATION
 UKR_roads_extend_plan: "Plány investic do silnic" # todo: NEW TRANSLATION
 UKR_roads_extend_plan_desc: "Silnice na Ukrajině nejsou nejlepší na světě. Některé oblasti se stále spoléhají na nezpevněné nebo téměř zničené silnice. Je na čase, aby tyto regiony dostaly trochu péče." # todo: NEW TRANSLATION
 UKR_ukrainian_railways: "UZ" # todo: NEW TRANSLATION
 UKR_ukrainian_railways_desc: "UZ je název státní společnosti, která má v současné době obrovský monopol na většinu ukrajinské železniční dopravy v zemi. Společnost se pyšní impozantní celkovou délkou tratí přes 23 000 km, čímž je 13. největší na světě. Je také 6. největším dopravcem železniční osobní dopravy a 7. největším dopravcem nákladní dopravy." # todo: NEW TRANSLATION
 UKR_modernization: "Ukrajinská modernizace" # todo: NEW TRANSLATION
 UKR_modernization_desc: "Jakmile se ekonomika a stát stabilizují, musíme modernizovat naši ekonomiku. Než bude příliš pozdě." # todo: NEW TRANSLATION
 UKR_agriculture: "Modernizovat zemědělství" # todo: NEW TRANSLATION
 UKR_agriculture_desc: "Ukrajina je jedním z největších světových producentů a vývozců zemědělských produktů a je známá jako obilnice Evropy. Protože Ukrajina vlastní 30 % nejúrodnější černozemě na světě, má její zemědělský průmysl obrovský potenciál. S určitými investicemi bychom tento potenciál mohli využít." # todo: NEW TRANSLATION
 UKR_nibulon: "Nibulon" # todo: NEW TRANSLATION
 UKR_nibulon_desc: "Nibulon je ukrajinská zemědělská společnost specializující se na výrobu a vývoz obilovin, jako jsou pšenice, ječmen a kukuřice. Sídlí v Mykolajivu. Je jedinou zemědělskou společností na Ukrajině s vlastní flotilou a loděnicí." # todo: NEW TRANSLATION
 UKR_pr_jsc_mhp: "PrJSC MHP" # todo: NEW TRANSLATION
 UKR_pr_jsc_mhp_desc: "PrJSC MHP, Myronivsky Hliboproduct, je největším ukrajinským producentem drůbeže a jedním z největších agroprůmyslových holdingů v zemi. Státní podpora jeho rozšíření posílí náš potravinářský průmysl a zaměstnanost na venkově." # todo: NEW TRANSLATION
 UKR_fozzy: "Fozzy Group" # todo: NEW TRANSLATION
 UKR_fozzy_desc: "Fozzy Group, LLC je jednou z největších obchodních a průmyslových skupin na Ukrajině se sídlem v Kyjevě a jedním z předních ukrajinských maloobchodníků s více než 700 prodejnami po celé zemi. Kromě maloobchodu má obchodní zájmy v potravinářství, bankovnictví, IT, logistice a restauracích." # todo: NEW TRANSLATION
 UKR_fin_it: "Modernizovat ekonomiku" # todo: NEW TRANSLATION
 UKR_fin_it_desc: "Pověřit příslušná ministerstva, aby pomohla modernizovat náš soukromý sektor, zejména finance a IT." # todo: NEW TRANSLATION
 UKR_privatbank: "Privatbank" # todo: NEW TRANSLATION
 UKR_privatbank_desc: "PrivatBank je největší ukrajinská banka podle aktiv a lídr ukrajinského trhu retailového bankovnictví. Byla registrována 19. března 1992. Stát musí zasáhnout, aby zajistil budoucí zisky." # todo: NEW TRANSLATION
 UKR_it: "Založit ukrajinský IT průmysl" # todo: NEW TRANSLATION
 UKR_it_desc: "IT sektor v našem národě roste, ale možná potřebuje investice, aby tomu tak zůstalo." # todo: NEW TRANSLATION
 UKR_it_2: "Rozšířit ukrajinský IT průmysl" # todo: NEW TRANSLATION
 UKR_it_2_desc: "Zdá se, že náš IT průmysl může být klíčovým faktorem naší ekonomiky. Samozřejmě s pomocí dobře umístěných investic." # todo: NEW TRANSLATION
 UKR_ukrtelekom: "Ukrtelecom" # todo: NEW TRANSLATION
 UKR_ukrtelekom_desc: "Státní Ukrtelecom nám pomůže rychleji rozšířit kapacitu naší sítě." # todo: NEW TRANSLATION
 UKR_kyivstar: "Kyivstar" # todo: NEW TRANSLATION
 UKR_kyivstar_desc: "Kyivstar je jednou z největších ukrajinských telekomunikačních společností poskytujících na Ukrajině komunikační služby a přenos dat založený na široké škále pevných a mobilních technologií včetně služeb 4G (LTE)." # todo: NEW TRANSLATION
 UKR_digital_education: "Digitální vzdělávání" # todo: NEW TRANSLATION
 UKR_digital_education_desc: "Digitální dovednosti jsou pro jednotlivce ve 21. století zásadní. Investice do digitálního vzdělávání i digitalizace vzdělávání se časem vyplatí. Nesmíme zapomenout na starší generace; jejich vzdělávání je investicí do přítomnosti." # todo: NEW TRANSLATION
 UKR_dig_sta: "Ukrajinský digitální stát" # todo: NEW TRANSLATION
 UKR_dig_sta_desc: "Diia (ukrajinsky: Дія, doslova „Činnost“; také zkratka ukrajinského Держава і Я, doslova „Stát a já“) je mobilní aplikace, webový portál a značka elektronické správy na Ukrajině. Aplikace Diia, spuštěná v roce 2020, umožňuje ukrajinským občanům používat digitální doklady ve svých chytrých telefonech namísto fyzických dokladů pro účely identifikace a sdílení.\n\nPortál Diia poskytuje přístup k více než 50 vládním službám. V budoucnu vláda plánuje zpřístupnit prostřednictvím Diie všechny druhy interakcí mezi státem a občany." # todo: NEW TRANSLATION
 UKR_tax_avoidance: "Vyřešit problém daňových úniků" # todo: NEW TRANSLATION
 UKR_tax_avoidance_desc: "Nyní máme nástroje k řešení obrovského globálního problému na místní úrovni: vyhýbání se placení daní ze strany společností i jednotlivců. \n„Ačkoli mohou být daně přehlíženy, ba dokonce nemilovány, ve skutečnosti jsou naší společenskou superschopností. Daně nám umožňují zvolit si, jak organizovat naše komunity na místní i národní úrovni, abychom mohli všichni společně žít lepší život. Zásadní překážkou je však snadnost, s jakou mocné elity unikají svým společenským povinnostem – svým odpovědnostem vůči společnostem, jejichž jsou součástí a z nichž profitují.“ – Zpráva o daňové spravedlnosti 2023" # todo: NEW TRANSLATION
 UKR_energy: "Energetická strategie Ukrajiny" # todo: NEW TRANSLATION
 UKR_energy_desc: "Je čas analyzovat možnosti zlepšení systémů zásobování národa elektřinou a zahájit program modernizace energie pro domácnosti." # todo: NEW TRANSLATION
 UKR_ukrenergo: "Ukrenergo" # todo: NEW TRANSLATION
 UKR_ukrenergo_desc: "Ukrenergo je provozovatelem přenosové soustavy elektřiny na Ukrajině a jediným provozovatelem vysokonapěťových přenosových vedení v zemi. Společnost může celý systém sítě učinit ještě efektivnějším." # todo: NEW TRANSLATION
 UKR_nuc_ener: "Energoatom" # todo: NEW TRANSLATION
 UKR_nuc_ener_desc: "Energoatom je státní podnik provozující všechny čtyři jaderné elektrárny na Ukrajině (Záporožskou, Rivnenskou, Jihoukrajinskou a Chmelnyckou jadernou elektrárnu). Je největším výrobcem elektřiny na Ukrajině." # todo: NEW TRANSLATION
 UKR_nuc_ener_2: "Rozšířit jadernou kapacitu" # todo: NEW TRANSLATION
 UKR_nuc_ener_2_desc: "Na základě smlouvy s Westinghouse postaví americká společnost dva nové bloky v Chmelnycké jaderné elektrárně a další dva v obnovené a konečně dokončené Čyhyrynské jaderné elektrárně v Čerkaské oblasti." # todo: NEW TRANSLATION
 UKR_green_ener: "Strategie zelené energie" # todo: NEW TRANSLATION
 UKR_green_ener_desc: "Po podpoře využívání obnovitelné energie se musíme zaměřit na náš potenciál v nejaderné oblasti." # todo: NEW TRANSLATION
 UKR_ukrhydroenergo: "Ukrhydroenergo" # todo: NEW TRANSLATION
 UKR_ukrhydroenergo_desc: "Ukrhydroenergo je ukrajinský státní podnik, který spravuje mnoho významných vodních elektráren podél řek Dněpr a Dněstr. Je hlavní ukrajinskou společností vyrábějící vodní energii." # todo: NEW TRANSLATION
 UKR_solar: "Postavit solární elektrárny" # todo: NEW TRANSLATION
 UKR_solar_desc: "Naše jižní oblasti patří k nejslunečnějším ve východní Evropě, a proto se nejlépe hodí pro výstavbu solárních elektráren." # todo: NEW TRANSLATION
 UKR_wind: "Podpořit větrné elektrárny" # todo: NEW TRANSLATION
 UKR_wind_desc: "V naší zemi existují místa vhodná pro vysoce účinnou výrobu energie pomocí větrných turbín." # todo: NEW TRANSLATION
 UKR_biomass: "Investovat do elektráren na biomasu" # todo: NEW TRANSLATION
 UKR_biomass_desc: "Vzhledem k úspěchu soukromých investic do elektráren na biomasu musí stát poskytnout prostředky na výstavbu podobných zařízení." # todo: NEW TRANSLATION
 UKR_min_env_prot: "Ministerstvo ochrany životního prostředí Ukrajiny" # todo: NEW TRANSLATION
 UKR_min_env_prot_desc: "Ministerstvo je hlavním orgánem v systému ústřední státní správy Ukrajiny odpovědným za ekologický monitoring a rozvoj země. Jedním z hlavních úkolů je rozvoj systému likvidace komunálního odpadu." # todo: NEW TRANSLATION
 UKR_waste_manangement_2: "Zavést recyklační systém" # todo: NEW TRANSLATION
 UKR_waste_manangement_2_desc: "Nyní, když byl konečně vyřešen sběr komunálního odpadu, nastal čas položit základy a zavést systém sběru recyklovatelných materiálů. Vyžadovalo to mnoho času a úsilí, ale výsledky jsou již viditelné." # todo: NEW TRANSLATION
 UKR_waste_manangement_3: "Modernizovat systém nakládání s odpady" # todo: NEW TRANSLATION
 UKR_waste_manangement_3_desc: "Zavedený systém musí být zefektivněn a musí dosáhnout i do nejodlehlejších koutů země. Moderní nakládání s odpady prospěje všem, veřejnosti i životnímu prostředí." # todo: NEW TRANSLATION
 UKR_forestry: "Kontrolovat ukrajinské lesnictví" # todo: NEW TRANSLATION
 UKR_forestry_desc: "Téměř 20 % země pokrývají lesy. Aby tomu tak zůstalo a zabránili jsme odlesňování, musíme investovat do lesnictví jako do investice do budoucnosti." # todo: NEW TRANSLATION
 UKR_tourism: "Investovat do cestovního ruchu" # todo: NEW TRANSLATION
 UKR_tourism_desc: "Cestovní ruch může být pro každou zemi skvělou příležitostí. Především je třeba vybudovat správnou infrastrukturu." # todo: NEW TRANSLATION
 UKR_nat_wonders: "Ukrajinské přírodní divy" # todo: NEW TRANSLATION
 UKR_nat_wonders_desc: "V roce 2008 bylo hlasováním vybráno sedm z mnoha malebných míst Ukrajiny. Tato místa budou vlajkonoši rozmanité krajiny naší země." # todo: NEW TRANSLATION
 UKR_wonders: "Ukrajinské divy" # todo: NEW TRANSLATION
 UKR_wonders_desc: "V roce 2007 bylo hlasováním vybráno sedm z mnoha historických a kulturních památek Ukrajiny. Tato místa budou vlajkonoši kulturního dědictví naší země." # todo: NEW TRANSLATION
 UKR_world_heritage: "Ukrajinské památky světového dědictví" # todo: NEW TRANSLATION
 UKR_world_heritage_desc: "Do roku 2005 se na Ukrajině nacházely tři památky světového dědictví, ale tento seznam se časem rozroste, protože několik dalších míst již figuruje na předběžném seznamu.\n\nKulturní dědictví se skládá z památek, jako jsou architektonická díla, monumentální sochy nebo nápisy, skupiny budov a lokality včetně archeologických nalezišť. Přírodní dědictví je definováno jako přírodní útvary tvořené fyzickými a biologickými formacemi, geologické a fyziografické útvary včetně stanovišť ohrožených druhů živočichů a rostlin a přírodní lokality významné z hlediska vědy, ochrany přírody nebo přírodních krás." # todo: NEW TRANSLATION
 UKR_health_tourism: "Podpořit ukrajinský zdravotní cestovní ruch" # todo: NEW TRANSLATION
 UKR_health_tourism_desc: "Protože zdravotní služby v zemi odpovídají západním standardům, ale obecně jsou levnější, může být výhodné investovat do zdravotního cestovního ruchu." # todo: NEW TRANSLATION
 UKR_corruption_reforms: "Protikorupční reformy" # todo: NEW TRANSLATION
 UKR_corruption_reforms_desc: "Korupce je problémem ukrajinské společnosti již od rozpadu Sovětského svazu v roce 1991. Po vyhlášení nezávislosti na Sovětském svazu čelila Ukrajina řadě politiků z různých stran politického spektra, stejně jako zločineckým bossům a oligarchům, kteří využívali korupci v policii, politických stranách a průmyslu k získání moci.\n\nJe čas to změnit!" # todo: NEW TRANSLATION
 UKR_corruption_edu: "Bojovat proti korupci ve vzdělávání" # todo: NEW TRANSLATION
 UKR_corruption_edu_desc: "Podle výzkumu Transparency International z roku 2008 uvedlo 47,3 % vysokoškolských studentů, že od nich byl požadován úplatek; z nich 29 % tento úplatek dobrovolně zaplatilo. Studenti si mohli „koupit“ přijetí na vysokou školu, výsledky zkoušek i hodnocení doktorských a magisterských prací." # todo: NEW TRANSLATION
 UKR_corruption_health: "Bojovat proti korupci ve zdravotnictví" # todo: NEW TRANSLATION
 UKR_corruption_health_desc: "Ačkoli je lékařská péče ve státních nemocnicích pro Ukrajince teoreticky bezplatná, placení peněz pacienty za zajištění potřebné léčby bylo na počátku 21. století rozšířené.\n\nV roce 2012 obvinily advokační skupiny představitele ministerstva zdravotnictví ze zpronevěry peněz určených na léčbu pacientů s AIDS, když nakupovali léky proti AIDS za značně nadsazené ceny a následně inkasovali provize." # todo: NEW TRANSLATION
 UKR_corruption_police: "Boj proti korupci v policii" # todo: NEW TRANSLATION
 UKR_corruption_police_desc: "Bojujte proti korupci v ukrajinských donucovacích orgánech s cílem obnovit důvěru veřejnosti a efektivní výkon policejní služby." # todo: NEW TRANSLATION
 UKR_corruption_armed_forces: "Boj proti korupci v Ozbrojených silách Ukrajiny" # todo: NEW TRANSLATION
 UKR_corruption_armed_forces_desc: "Vymýťte korupci z ozbrojených sil s cílem zlepšit vojenskou disciplínu a efektivitu." # todo: NEW TRANSLATION
 UKR_corruption_justice: "Boj proti korupci v justici" # todo: NEW TRANSLATION
 UKR_corruption_justice_desc: "Na počátku 10. let 21. století ukrajinští politici a analytici popisovali ukrajinský justiční systém jako \"prohnilý do morku kostí\" a stěžovali si na politický tlak vyvíjený na soudce a na korupci. Nezávislí právníci a aktivisté za lidská práva si stěžovali, že ukrajinští soudci byli pravidelně vystavováni nátlaku, aby vynesli určitý verdikt.\n\nUkrajinský soudní systém byl obecně považován za zkorumpovaný. Průzkum ukrajinského ministerstva spravedlnosti z roku 2009 odhalil, že soudnímu systému země důvěřovalo pouze 10 % respondentů." # todo: NEW TRANSLATION
 UKR_corruption_spec_public_prosecutor: "Specializovaná protikorupční prokuratura" # todo: NEW TRANSLATION
 UKR_corruption_spec_public_prosecutor_desc: "Specializovaná protikorupční prokuratura je nezávislou strukturální jednotkou Generální prokuratury Ukrajiny a primárně odpovídá za podporu a dohled nad trestními vyšetřováními zahájenými Národním protikorupčním úřadem Ukrajiny (NABU)." # todo: NEW TRANSLATION
 UKR_corruption_court: "Nejvyšší protikorupční soud Ukrajiny" # todo: NEW TRANSLATION
 UKR_corruption_court_desc: "Zřiďte nezávislý protikorupční soud pro stíhání případů korupce na vysoké úrovni a navracení ukradeného státního majetku." # todo: NEW TRANSLATION
 UKR_corruption_asset_rec: "Navracení majetku" # todo: NEW TRANSLATION
 UKR_corruption_asset_rec_desc: "Navracení majetku, jak je popsáno v Úmluvě OSN proti korupci (kapitola V UNCAC), označuje proces, při němž jsou výnosy z korupce převedené do zahraničí získány zpět a navráceny zemi, z níž byly odcizeny, nebo jejich právoplatným vlastníkům." # todo: NEW TRANSLATION
 UKR_corruption_gov: "Očista státní správy" # todo: NEW TRANSLATION
 UKR_corruption_gov_desc: "Zaveďte rozsáhlé reformy s cílem odstranit korupci ve státní správě a obnovit institucionální integritu." # todo: NEW TRANSLATION
 UKR_end_kleptokracy: "Dokončení protikorupčních reforem" # todo: NEW TRANSLATION
 UKR_end_kleptokracy_desc: "Po provedení všech těchto reforem lze rozsah korupce snadno omezit a společnost bude moci žít bez jejích dusivých účinků." # todo: NEW TRANSLATION
 UKR_health_reform: "Zahájení reforem zdravotnictví" # todo: NEW TRANSLATION
 UKR_health_reform_desc: "Ukrajinské zdravotnictví by podle zákona mělo být pro občany bezplatné, v praxi však pacienti přispívají na náklady většiny jeho složek." # todo: NEW TRANSLATION
 UKR_health_smoke_alc: "Omezení kouření a konzumace alkoholu" # todo: NEW TRANSLATION
 UKR_health_smoke_alc_desc: "Zahajte kampaně na ochranu veřejného zdraví s cílem omezit kouření a konzumaci alkoholu a řešit hlavní příčiny předcházetelných onemocnění." # todo: NEW TRANSLATION
 UKR_hiv_aids: "HIV/AIDS na Ukrajině" # todo: NEW TRANSLATION
 UKR_hiv_aids_desc: "V roce 2001 byl schválen národní plán boje proti HIV/AIDS; jeho cílem bylo zabránit dalšímu šíření HIV, rozvíjet kapacity pro léčbu nakažených osob a poskytovat sociální podporu a poradenství lidem žijícím s HIV/AIDS." # todo: NEW TRANSLATION
 UKR_vaccination: "Očkovací program" # todo: NEW TRANSLATION
