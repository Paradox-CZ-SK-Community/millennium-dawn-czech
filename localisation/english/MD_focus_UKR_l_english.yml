 ukraine_parliament.30.t: "Několik členů Parlamentu se postavilo proti naší vládě!" # todo: NEW TRANSLATION
 ukraine_parliament.30.d: "Někteří členové Parlamentu se postavili proti naší vládě, což vedlo k poklesu naší podpory v sněmovně." # todo: NEW TRANSLATION
 ukraine_parliament.30.a: "Stává se" # todo: NEW TRANSLATION
 ukraine_parliament.30.b: "Možná jsou jejich kapsy trochu prázdné?" # todo: NEW TRANSLATION
 ukraine_parliament.31.t: "Někteří členové Parlamentu nás začali podporovat!" # todo: NEW TRANSLATION
 ukraine_parliament.31.d: "Někteří členové Parlamentu začali chválit naše nedávné úspěchy, což vede k nárůstu podpory v sněmovně." # todo: NEW TRANSLATION
 ukraine_parliament.31.a: "Skvělé" # todo: NEW TRANSLATION
 ukraine_parliament.32.t: "Parlament tlačí větší podporu pro místní obyvatele!" # todo: NEW TRANSLATION
 ukraine_parliament.32.d: "Parlament přidělil velký rozpočet na pomoc místním obyvatelům po celé zemi, a naše administrativa o tom dostala vědomí; někteří členové kabinetu věří, že peníze by bylo lepší použít jinde pro lepší využití." # todo: NEW TRANSLATION
 ukraine_parliament.32.a: "Peníze jsou pro místní obyvatele!" # todo: NEW TRANSLATION
 ukraine_parliament.32.b: "Ano, rozhodně by se daly využít i jinde" # todo: NEW TRANSLATION
 ukraine_parliament.33.t: "Parlament klade otázky naší administrativě" # todo: NEW TRANSLATION
 ukraine_parliament.33.d: "Několik členů Parlamentu nedávno vyjádřilo kritiku naší administrativy za 'neuspokojování [ROOT.GetAdjective] lidí'. Došlo k mnoha hádkám mezi pro‑vládními a opozičními křídly v Parlamentu a dostali jsme se do bodu, kdy musíme vstoupit a připravit odpověď." # todo: NEW TRANSLATION
 ukraine_parliament.33.a: "Ať si myslí, co chtějí" # todo: NEW TRANSLATION
 ukraine_parliament.33.b: "Připravte odpovídající reakci" # todo: NEW TRANSLATION
 ukraine_parliament.34.t: "Parlament schvaluje návrh na zvýšení výdajů na zdravotní péči" # todo: NEW TRANSLATION
 ukraine_parliament.34.d: "Parlament nedávno schválil návrh, který by alokoval větší část našeho rozpočtu na zdravotní výdaje. Někteří členové kabinetu s tím nesouhlasí, protože si myslí, že by to bylo katastrofální pro naši ekonomiku a vládu." # todo: NEW TRANSLATION
 ukraine_parliament.34.a: "Parlament má správný nápad" # todo: NEW TRANSLATION
 ukraine_parliament.34.b: "Ne, nenecháme, aby tento návrh prošel" # todo: NEW TRANSLATION
