 UKR_military_rehab: "Rehabilitační systém pro vojáky" # todo: NEW TRANSLATION
 UKR_military_rehab_desc: "Rehabilitační programy pro veterány zvyšují morálku vojsk a soudržnost organizací, avšak za cenu vyšších výdajů na zdravotnictví." # todo: NEW TRANSLATION
 UKR_resource_extraction: "Zvýšená těžba surovin" # todo: NEW TRANSLATION
 UKR_resource_extraction_desc: "Rozšířené těžební operace zvyšují domácí dodávky nerostů a paliv." # todo: NEW TRANSLATION
 UKR_research_boost: "Program podpory ukrajinského výzkumu" # todo: NEW TRANSLATION
 UKR_research_boost_desc: "Centralizovaný program podpory výzkumu urychluje technologický rozvoj ve vojenském i civilním sektoru." # todo: NEW TRANSLATION
 UKR_economy_boost: "Zlepšení ekonomiky" # todo: NEW TRANSLATION
 UKR_economy_boost_desc: "Dočasný program ekonomických stimulů urychluje produktivitu a efektivitu továren, avšak za cenu vyšší spotřeby energie." # todo: NEW TRANSLATION
 ukraine_coup.1.t: "Rusko se nás pokusilo svrhnout!" # todo: NEW TRANSLATION
 ukraine_coup.1.d: "Poslední zpráva z Kyjeva uvádí, že agenti podporovaní Ruskem se chystali svrhnout naši vládu! Toto je přímé ohrožení naší nezávislosti ze strany Ruska." # todo: NEW TRANSLATION
 ukraine_coup.1.a: "Bastardi." # todo: NEW TRANSLATION
 ukraine_coup.2.t: "Rusko nás svrhne!" # todo: NEW TRANSLATION
 ukraine_coup.2.d: "Poslední zpráva z Kyjeva uvádí, že agenti podporovaní Ruskem svrhli naši vládu! Nyní bude naší zemi vládnout pro-ruská klika." # todo: NEW TRANSLATION
