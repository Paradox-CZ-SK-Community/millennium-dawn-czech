 UKR_separatist_menace: "Hrozba separatistů" # todo: NEW TRANSLATION
 UKR_separatist_menace_desc: "Hrozba separatistických republik není nikde řešena; musíme ji vyřešit" # todo: NEW TRANSLATION
 UKR_apply_to_eu_por: "Program spolupráce s EU" # todo: NEW TRANSLATION
 UKR_apply_to_eu_por_desc: "Spolupráce s Evropskou unií bude i nadále naší prioritou" # todo: NEW TRANSLATION
 UKR_nabu: "Národní protikorupční úřad Ukrajiny" # todo: NEW TRANSLATION
 UKR_nabu_desc: "Nový protikorupční úřad má výrazně posílit boj proti zkorumpovaným úředníkům na všech úrovních." # todo: NEW TRANSLATION
 UKR_poroh_deccomuniz: "Porošenkovo prezidentství" # todo: NEW TRANSLATION
 UKR_poroh_deccomuniz_desc: "Porošenko je rozporuplná osobnost, ale jeho snaha učinit Ukrajinu silnou tváří v tvář nepříteli si zaslouží úctu lidu." # todo: NEW TRANSLATION
 UKR_anti_rus_doctrine: "Protiruská doktrína" # todo: NEW TRANSLATION
 UKR_anti_rus_doctrine_desc: "Náš politický a ideologický nepřítel byl a zůstává Rusko. Musíme to přijmout a být připraveni na válku" # todo: NEW TRANSLATION
 UKR_foreign_advisors_desc: "Zahraniční instruktoři z různých PMCs jsou připraveni vycvičit naše vojáky" # todo: NEW TRANSLATION
 UKR_west_investors: "Západní investoři" # todo: NEW TRANSLATION
 UKR_west_investors_desc: "Západní zahraniční investoři byli přilákáni na náš trh, posilují demokratické instituce a podporují hospodářský růst a stabilitu." # todo: NEW TRANSLATION
 UKR_operation_wall: "Operace Zeď" # todo: NEW TRANSLATION
 UKR_operation_wall_desc: "Výstavba obranného opevnění se během tohoto mobilizačního období dramaticky urychluje." # todo: NEW TRANSLATION
 UKR_smuggle_parts_from_rus: "Nákup náhradních dílů z Ruska" # todo: NEW TRANSLATION
 UKR_smuggle_parts_from_rus_desc: "Pokračujeme v nákupu náhradních dílů z Ruska, i když tajně" # todo: NEW TRANSLATION
 UKR_reverse_engineering_start: "Zpětné inženýrství" # todo: NEW TRANSLATION
 UKR_reverse_engineering_start_desc: "Naším cílem je vytvořit vlastní výrobu" # todo: NEW TRANSLATION
 UKR_ato_supports: "Podpora veteránů" # todo: NEW TRANSLATION
 UKR_ato_supports_desc: "Podpora veteránů protiteroristické operace posiluje nacionalistické smýšlení a potvrzuje náš závazek vůči těm, kteří sloužili." # todo: NEW TRANSLATION
 UKR_health_supports: "Podpora zdravotní péče" # todo: NEW TRANSLATION
 UKR_health_supports_desc: "Vyšší financování zdravotnictví zlepšuje veřejný blahobyt a posiluje podporu demokratické správy." # todo: NEW TRANSLATION
 UKR_poroh_prepare_donbass: "Příprava na odvetu v Donbasu" # todo: NEW TRANSLATION
 UKR_poroh_prepare_donbass_desc: "Jsme připraveni se pomstít separatistům a navždy vyřešit problém s Lidovými republikami" # todo: NEW TRANSLATION
 UKR_poroh_osce_ukr: "Pozorovatelé OBSE" # todo: NEW TRANSLATION
 UKR_poroh_osce_ukr_desc: "Pozorovatelé OBSE byli vysláni do konfliktní zóny, aby stabilizovali situaci na frontové linii s neuznanými republikami" # todo: NEW TRANSLATION
 UKR_idea_eu_member_associate: "Přidružený člen EU" # todo: NEW TRANSLATION
 UKR_idea_eu_member_associate_desc: "Ukrajina zahájila své sdružení s EU. Prohloubí vztahy s Evropou a západním blokem. Avšak vytváří problémy v regionech s rusky mluvící většinou." # todo: NEW TRANSLATION
 ukraine_poroh.1.t: "Ukrajina navrhuje pakt o neútočení" # todo: NEW TRANSLATION
 ukraine_poroh.1.d: "Ukrajinská vláda navrhuje, abychom s nimi uzavřeli dohodu o neútočení; zdá se, že nás vidí jako potenciálního agresora proti nim" # todo: NEW TRANSLATION
 ukraine_poroh.1.a: "Podepíšeme pakt" # todo: NEW TRANSLATION
 ukraine_poroh.1.b: "Na to není potřeba" # todo: NEW TRANSLATION
 ukraine_poroh.2.t: "Pakt o neútočení s Běloruskem" # todo: NEW TRANSLATION
 ukraine_poroh.2.d: "Běloruská vláda souhlasila s podpisem paktu o neútočení s námi; jsme rádi, že jsou na naší straně" # todo: NEW TRANSLATION
 ukraine_poroh.2.a: "Dobré" # todo: NEW TRANSLATION
 ukraine_poroh.3.t: "Non-Aggression Pact With Belarus" # todo: NEW TRANSLATION
 ukraine_poroh.3.d: "Běloruská vláda odmítla podepsat pakt o neútočení s námi, což nás znepokojuje" # todo: NEW TRANSLATION
 ukraine_poroh.3.a: "Smutné" # todo: NEW TRANSLATION
 ukraine_poroh.4.t: "Autocefalie Ukrajinské církve" # todo: NEW TRANSLATION
 ukraine_poroh.4.d: "Ukrajinská církev se obrátila na Ekumenického patriarchy s žádostí o povolení autocefalie její církve, povolí to náš patriarcha?" # todo: NEW TRANSLATION
