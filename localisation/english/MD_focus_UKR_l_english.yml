 ukraine_reorganize_navy_choose_future_corvette.8.name: "Postavit korvety třídy Projekt 58250 „Volodymyr Velykyj“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.8.desc: "V důsledku našeho nezávislého výběrového řízení jsme jako nejnovější přírůstek naší flotily vybrali korvety třídy Projekt 58250 „Volodymyr Velykyj“.\nVyberme počet lodí, jejichž stavbu schválíme." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.8.a: "10 lodí (2×5)" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.8.b: "8 lodí (2×4)" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_choose_future_corvette.8.c: "4 lodě (2×2)" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.1.name: "Výsledky schůzky s Litvou\no možnosti nákupu 2 korvet „Projektu 1124“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.1.desc: "Po schůzce s litevskými kolegy ohledně možného nákupu 2 korvet „Projektu 1124“ jsme obdrželi obecně pozitivní výsledky, protože Litva toto rozhodnutí podporuje.\nMusí však konzultovat Rusko, aby vyjednala souhlas s prodejem a možné důsledky pro svou zemi.\nNyní stojíme před rozhodnutím: můžeme nabídnout více peněz a další obchodní příležitosti, abychom je přesvědčili ignorovat názor Moskvy, nebo můžeme počkat na přirozený výsledek jejich konzultací." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.1.a: "Pokusíme se je přesvědčit" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.1.b: "Počkáme" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.2.name: "Druhé kolo jednání s Litvou\no nákupu korvet" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.2.desc: "Protože předchozí jednání mezi našimi zeměmi nevedla k očekávanému pozitivnímu výsledku, rozhodli jsme se zintenzivnit své úsilí.\nV důsledku druhého kola jsme se dohodli na nákupu 2 korvet za následujících podmínek: rozšíření obchodu mezi našimi zeměmi a uzavření dohody o dodávkách určitého množství oceli a uhlí, dodatečná kompenzace z naší strany na nákup nové lodi pro litevskou flotilu a předání některých vojenských technologií, které jim dříve nebyly dostupné.\nPřijmeme tyto podmínky?" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.2.a: "Ano, samozřejmě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.2.b: "Ne, je to příliš drahé" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.3.name: "Výsledky konzultací mezi Litvou a Ruskem\no možnosti prodeje korvet" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.3.desc: "Naši litevští partneři vedli s ruskou stranou požadovaná jednání ohledně možného prodeje 2 korvet sovětské výroby nám.\nRusko bohužel prodej za podmínek, na nichž jsme se předtím s Litvou dohodli, nepovolilo, ale vyjádřilo přání uspořádat s námi další konzultace.\nNyní máme 2 možnosti dalšího vývoje událostí: buď původní myšlenku opustit, nebo pokračovat v jednání s Ruskem za jeho podmínek." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.3.a: "Opustit nákup korvet" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.3.b: "Vést jednání s Ruskem" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.4.name: "Výsledky jednání mezi Ukrajinou a Ruskem\no možnosti nákupu korvet" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.4.desc: "Vedli jsme nepříjemná, ale nezbytná jednání s Ruskem. Bohužel v nich hovořili z pozice síly a my jsme jim neměli co nabídnout.\nRusko nám předložilo následující ultimátum pro udělení souhlasu Litvě s prodejem 2 korvet: vyčlenění dalšího prostoru pro potřeby základny ruské Černomořské flotily v Sevastopolu, omezení našeho směřování k EU, posílení obchodu mezi námi a dodatečná finanční kompenzace Rusku za lodě.\nPřijmeme tyto podmínky?" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.4.a: "Opustit tento záměr" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.4.b: "Souhlasit s ruskými podmínkami" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.5.name: "Dokončení dohody o nákupu korvet z Litvy" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.5.desc: "Konečně jsme se dohodli na všech podmínkách a můžeme dokončit nákup a převod lodí.\nNa znamení úcty k jejich předchozím majitelům jsme se dohodli lodě pojmenovat „Bratslav“ a „Volodymyr“, na počest významných měst na území dnešní Ukrajiny, která byla kdysi součástí společného státu, Litevského velkoknížectví, Rusi a Žemaitska." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_buy_lithuanian_1124.5.a: "Skvělé!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1135.1.name: "Údržba 3 fregat „Projektu 1135“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1135.1.desc: "Prověřili jsme 3 trupy fregat „Projektu 1135“, „Sevastopol“, „Mykolajiv“ a „Dnipropetrovsk“, a nyní můžeme zvolit nejvhodnější postup při rozhodování o jejich osudu.\nMůžeme buď investovat více peněz a opravit všechny 3 lodě, nebo se zaměřit pouze na nejmodernější a nejvýkonnější z nich." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1135.1.a: "Udržovat všechny 3 lodě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1135.1.b: "Udržovat pouze „Sevastopol“ a „Mykolajiv“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1135.1.c: "Udržovat pouze nejmodernější loď, „Sevastopol“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_11451.1.name: "Dokončit stavbu 2 korvet „Projektu 11451“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_11451.1.desc: "Prověřili jsme 2 trupy korvet „Projektu 11451“, „Lvov“ a „Luhansk“, a nyní můžeme zvolit nejvhodnější postup při rozhodování o jejich osudu.\n\nMůžeme buď investovat více peněz a dokončit stavbu obou lodí, nebo sešrotovat loď v horším stavu, „Luhansk“, a použít její součástky k rychlejšímu dokončení „Lvova“." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_11451.1.a: "Dokončit obě lodě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_11451.1.b: "Využít „Luhansk“ k dokončení „Lvova“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.1.name: "Udržovat 3 malé korvety „Projektu 1241“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.1.desc: "Prověřili jsme 3 trupy našich malých korvet „Projektu 1241“, raketový člun U156 „Kremenčuk“ a malé protiponorkové korvety U207 „Užhorod“ a U208 „Chmelnyckyj“.\nNyní můžeme zvolit nejvhodnější postup při rozhodování o jejich osudu.\nMůžeme buď investovat více peněz a opravit všechny 3 lodě, nebo se zaměřit pouze na tu, u níž je nejvyšší šance na opravu." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.1.a: "Udržovat všechny 3 lodě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.1.b: "Udržovat pouze U208 „Chmelnyckyj“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.2.name: "Dokončení opravy raketového člunu „U156 Kremenčuk“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.2.desc: "Dokončili jsme opravu raketového člunu „U156 Kremenčuk“ a nyní je připraven k aktivní službě.\nNyní budeme pokračovat v opravě malých protiponorkových korvet U207 „Užhorod“ a U208 „Chmelnyckyj“." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.2.a: "Skvělé, pokračujme" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.3.name: "Dokončení opravy malé protiponorkové korvety „U207 Užhorod“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.3.desc: "Dokončili jsme opravu malé protiponorkové korvety „U207 Užhorod“ a nyní je připravena k aktivní službě.\nNyní se plně zaměříme na dokončení opravy malé protiponorkové korvety U208 „Chmelnyckyj“." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.3.a: "Skvělé, pokračujme" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.4.name: "Dokončení opravy malé protiponorkové korvety „U208 Chmelnyckyj“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.4.desc: "Dokončili jsme opravu malé protiponorkové korvety „U208 Chmelnyckyj“ a nyní je připravena k aktivní službě.\nVšechny 4 malé korvety „Projektu 1241“ jsou nyní v aktivní službě." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.4.a: "Skvělé, všechny lodě jsou připraveny" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.5.name: "Dokončení opravy malé protiponorkové korvety „U208 Chmelnyckyj“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.5.desc: "Díky využití součástek ze 3 dalších malých korvet „Projektu 1241“ jsme dokončili opravu malé protiponorkové korvety „U208 Chmelnyckyj“ dříve, než se očekávalo. Nyní je připravena k aktivní službě." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_1241.5.a: "Dobře!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.1.name: "Ponorka „Záporoží“ – hledání baterií" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.1.desc: "Prověřili jsme trup ponorky „Záporoží“ a zjistili, že je před námi mnoho práce.\n Bohužel je nyní hlavním problémem absence baterií: bez nich se ponorka nemůže pohybovat.\nMůžeme buď požádat Rusko o prodej jedné z jeho uskladněných baterií, hledat v Evropě (zejména v Řecku), nebo zadat našemu místnímu průmyslu vývoj domácí baterie." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.1.a: "Nakoupit od Ruska" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.1.b: "Hledat v Evropě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.1.c: "Vyvinout domácí baterii" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_RUS_flag: " Dokončená událost §Y„Ponorka Záporoží – hledání baterií“§! s vybranou možností §RNakoupit od Ruska§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_GRE_flag: " Dokončená událost §Y„Ponorka Záporoží – hledání baterií“§! s vybranou možností §BHledat v Evropě§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.2.name: "Ponorka „Záporoží“ – nákup baterií" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.2.desc: "Konečně jsme se s partnerskou zemí dohodli na podmínkách nákupu a po uhrazení záloh začalo čekání na dodávku.\nMůže to znít neuvěřitelně, ale obdrželi jsme zoufale potřebné vybavení za dříve dohodnutých podmínek.\nNyní můžeme svému partnerovi pouze poděkovat a pokračovat v opravě." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.2.a: "Díky, Rusko, pokračovat v opravě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.2.b: "Díky, Řecko, pokračovat v opravě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.3.name: "Ponorka „Záporoží“ – domácí vývoj baterií" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.3.desc: "Úkol vyvinout domácí baterie pro ponorku „Záporoží“ nebyl snadný.\nNakonec jsme obdrželi, co jsme chtěli, ale skutečné náklady byly vyšší, než jsme očekávali.\nPřesto můžeme pokračovat v opravě ponorky." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.3.a: "Dosáhli jsme tohoto milníku, pokračovat v opravě" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.4.name: "Ponorka „Záporoží“ – dokončení opravy" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.4.desc: "Podařilo se nám nainstalovat nové baterie, opravit a udržovat všechna nefunkční zařízení a konečně můžeme zahájit skutečné námořní zkoušky.\n\nMůžeme provést základní program a ušetřit peníze a čas, nebo rozsáhlý program, který bude vyžadovat více zdrojů, ale může odhalit některé další problémy a umožní nám je rychle vyřešit." # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.4.a: "Zahájit základní námořní zkoušky" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.4.b: "Zahájit rozšířené námořní zkoušky" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine_extended_sea_trials_bonus: "Dodatečná spolehlivost v důsledku rozšířených námořních zkoušek ponorky „Záporoží“" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.5.name: "Ponorka „Záporoží“ – uvedení ponorky do služby" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.5.desc: "Konečně jsme provedli všechny potřebné nákupy, výměny, instalace, údržbu, opravy a námořní zkoušky, aby mohla být „Záporoží“ plně uvedena do služby v ukrajinském námořnictvu!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_maintain_641_submarine.5.a: "Konečně!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.1.name: "Dokončení křižníku „Ukrayina“ – problémy s chybějícím vybavením" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.1.desc: "Pod přímým dohledem našeho prezidenta jsme konečně rozhodli o dokončení stavby křižníku „Ukrayina“ sovětské „Třídy Projekt 1164“.\nPrověřili jsme trup a sestavili úplný seznam chybějícího vybavení.\nNyní musíme učinit další krok a rozhodnout, co dělat: požádat Rusko o povolení k nákupu původního vybavení od něj (zejména systémů protilodních a protiletadlových střel), nebo kontaktovat západní země a hledat možnost jeho nahrazení jejich protějšky.\nVezměte prosím na vědomí, že k žádosti o západní vybavení potřebujete alespoň 40+ vztah s USA nebo 25+ vztah s Francií.\n\n\n§GToto je krok 1 z §R3§!, §R4§! nebo §R6§!§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.1.a: "Držet se původního ruského vybavení" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.1.b: "Prověřit možné západní náhrady" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.2.name: "Dokončení křižníku „Ukrayina“ – nákup ruského vybavení" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.2.desc: "Protože jsme se rozhodli držet původního sovětského návrhu při dokončování křižníku „Ukrayina“, zahájili jsme s Ruskem jednání o nákupu chybějícího vybavení.\nZískání potřebných součástí nás bude stát mnoho peněz a času.\n\n\n§GToto je krok 2 ze 3§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.2.a: "Zaplatíme a počkáme" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.3.name: "Dokončení křižníku „Ukrayina“ – ruské vybavení obdrženo" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.3.desc: "Konečně nám Rusko dodalo potřebné součásti a můžeme zahájit instalaci a dokončit stavbu. Doufejme, že to nebude trvat věčnost.\n\n\n§GToto je poslední krok§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.3.a: "Zahájit výrobu" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.4.name: "Dokončení křižníku „Ukrayina“ – výměna raket" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.4.desc: "Můžeme na trhu hledat všechny možné varianty západního vybavení, které by nahradilo chybějící sovětské protilodní střely P-500 „Granit“ a protiletadlové střely S-300F „Fort“.\nMusíme zvolit mezi několika možnými možnostmi.\n\n\n§GToto je krok 2 z §R4§! nebo §R6§!§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.4.a: "Zvolit americké střely" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.4.b: "Zvolit francouzské střely" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.4.c: "Zvolit švédské střely" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.5.name: "Dokončení křižníku „Ukrayina“ – americké střely" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.5.desc: "Protože jsme jako dodavatele nových střel pro křižník „Ukrayina“ vybrali USA, zahájili jsme s nimi jednání o nákupu protilodních střel RGM-84D Harpoon Block 1C i protiletadlových střel RIM-66M-2 Block IIIA.\nZískání potřebných součástí nás bude stát mnoho peněz a času.\n\n\n§GToto je krok 3 z §R4§!§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.5.a: "Zaplatíme a počkáme" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.6.name: "Dokončení křižníku „Ukrayina“ – francouzské střely" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.6.desc: "Protože jsme jako dodavatele nových střel pro křižník „Ukrayina“ vybrali Francii, zahájili jsme s ní jednání o nákupu protilodních střel Exocet MM40 Block 2 i protiletadlových střel Aster 30 Block 2.\nZískání potřebných součástí nás bude stát mnoho peněz a času.\n\n\n§GToto je krok 3 z §R4§!§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.6.a: "Zaplatíme a počkáme" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.7.name: "Dokončení křižníku „Ukrayina“ – švédské protilodní střely" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.7.desc: "Protože jsme jako dodavatele nových protilodních střel RBS 15 Mk. III pro křižník „Ukrayina“ vybrali Švédsko, zahájili jsme s ním jednání o jejich nákupu.\nZískání potřebného vybavení nás bude stát mnoho peněz a času.\n\n\n§GToto je krok 3 z §R6§!§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.7.a: "Zaplatíme a počkáme" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.8.name: "Dokončení křižníku „Ukrayina“ – výměna protiletadlových střel" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.8.desc: "Po výběru nejmodernějších švédských protilodních střel stále musíme zvolit vybavení, které nahradí sovětské protiletadlové střely S-300F „Fort“.\nMáme pouze 2 možnosti.\n\n\n§GToto je krok 4 z §R6§!§!" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.8.a: "Zvolit americké RIM-66M-2 Block IIIA" # todo: NEW TRANSLATION
 ukraine_reorganize_navy_finish_ukrayina.8.b: "Zvolit francouzské Aster 30 Block 2" # todo: NEW TRANSLATION
