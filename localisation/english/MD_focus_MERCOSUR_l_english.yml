 MER_request_mercosur_associate_membership: "Požádat o přidružený status v MERCOSUR" # todo: NEW TRANSLATION
 MER_request_mercosur_associate_membership_desc: "Předložit MERCOSUR formální žádost o přidružený status. Pokud bude žádost projednána bez přerušení, po skončení přezkumné lhůty se dostaneme do vnějšího kruhu bloku a otevře se nám cesta k užší regionální koordinaci." # todo: NEW TRANSLATION
 MER_request_mercosur_full_membership: "Požádat o plné členství v MERCOSUR" # todo: NEW TRANSLATION
 MER_request_mercosur_full_membership_desc: "Předložit formální žádost o vstup do MERCOSUR jako plnoprávný člen. Pokud proces proběhne až do konce, naše přistoupení bude po skončení přezkumné lhůty formalizováno a my se staneme plnou součástí bloku." # todo: NEW TRANSLATION
 MER_request_unasul_membership: "Požádat o členství v UNASUL" # todo: NEW TRANSLATION
 MER_request_unasul_membership_desc: "Podat formální žádost o připojení k UNASUL. Pokud bude žádost úspěšně dokončena, vstoupíme na konci přezkumné lhůty do jihoamerického rámce, aniž bychom čekali na samostatné bilaterální pozvání." # todo: NEW TRANSLATION
 leave_UNASUL: "Opustit mechanismus společné obrany UNASUL" # todo: NEW TRANSLATION
 leave_UNASUL_desc: "Vystoupit z vojenské aliance vybudované kolem mechanismu společné obrany UNASUL a ukončit naši účast v její společné obranné struktuře." # todo: NEW TRANSLATION
 UNASUL_leave_tt: "Vystoupíme z vojenské aliance mechanismu společné obrany UNASUL." # todo: NEW TRANSLATION
 MER_full_membership_acceptance_hint_desc: "\n\n§YMíra přijetí závisí na názoru dané země na nás, našem vlivu na ni a postupu stromu MERCOSUR!§!" # todo: NEW TRANSLATION
 MER_full_membership_invite_process_desc: "\n\n§YPokud země nabídku přijme, může se buď okamžitě připojit jako plnoprávný člen, nebo požádat o třístupňový přístupový balíček. Dokončení všech tří přístupových rozhodnutí formalizuje členství prostřednictvím investiční cesty.§!" # todo: NEW TRANSLATION
 MER_mercosur_associate_invite_accept_tt: "Pozvaná země se stane §Ypřidruženým státem MERCOSUR§!. Každý současný §Yčlenský stát MERCOSUR§! získá §G+1,00 %§! §Yměsíčního růstu produktivity§! a §G+1,00 %§! §Ynásobitele zahraničního vlivu§! a obě strany obdrží oznámení." # todo: NEW TRANSLATION
 MER_mercosur_associate_invite_reject_tt: "Pozvaná země nabídku odmítne, po dobu §Y180 dnů§! ji nebude možné znovu oslovit a po doručení odmítnutí ztratíme §R15§! §Ypolitické moci§!." # todo: NEW TRANSLATION
 MER_mercosur_full_invite_accept_tt: "Pozvaná země nabídku přijme. Poté si zvolí mezi §Yokamžitým plným členstvím§! a §Ytřístupňovou přístupovou cestou podpořenou investicemi§! a obě strany obdrží oznámení o přijetí." # todo: NEW TRANSLATION
 MER_mercosur_full_invite_reject_tt: "Pozvaná země nabídku odmítne, po dobu §Y365 dnů§! ji nebude možné znovu oslovit a po doručení odmítnutí ztratíme §R25§! §Ypolitické moci§!." # todo: NEW TRANSLATION
 MER_unasul_invite_accept_tt: "Pozvaná země se připojí k §YUNASUL§!. Dynamický modifikátor §Yčlenského státu UNASUL§! bude aktualizován pro všechny členy a vzroste o §G+1,00 %§! §Yzisku politické moci§! a §G+1,00 %§! §Ystability§!; zároveň budou odeslány regionální oznamovací události." # todo: NEW TRANSLATION
 MER_unasul_invite_reject_tt: "Pozvaná země nabídku odmítne, po dobu §Y365 dnů§! ji nebude možné znovu oslovit a po doručení odmítnutí ztratíme §R15§! §Ypolitické moci§!." # todo: NEW TRANSLATION
 MER_full_membership_step_one_desc: "\n\n§YJedná se o 1. ze 3 přístupových kroků. Dokončení všech tří přístupových rozhodnutí formalizuje plné členství.§!" # todo: NEW TRANSLATION
 MER_full_membership_step_two_desc: "\n\n§YJedná se o 2. ze 3 přístupových kroků. Dokončení všech tří přístupových rozhodnutí formalizuje plné členství.§!" # todo: NEW TRANSLATION
 MER_full_membership_step_three_desc: "\n\n§YJedná se o poslední přístupový krok. Jakmile budou dokončena všechna tři přístupová rozhodnutí, bude plné členství formalizováno.§!" # todo: NEW TRANSLATION
 MER_CHL_tariff_alignment: "Sladění celních sazeb s Chile" # todo: NEW TRANSLATION
