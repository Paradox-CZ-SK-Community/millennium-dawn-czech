 mercosur.02.t: "Pozvání k připojení k MERCOSUR jako přidružený stát" # todo: NEW TRANSLATION
 mercosur.02.d: "[FROM.GetName] nás oslovil s nabídkou vstoupit do MERCOSUR jako přidružený stát. Návrh nepředstavuje plné přijetí, ale zařadil by nás do sféry vlivu bloku, který se zjevně snaží obnovit své někdejší ambice. Přijetí by signalizovalo, že naše budoucnost je přinejmenším částečně spojena s jihoamerickým projektem." # todo: NEW TRANSLATION
 mercosur.02.a: "Přijmout přidružený status." # todo: NEW TRANSLATION
 mercosur.02.b: "Prozatím odmítnout." # todo: NEW TRANSLATION
 mercosur.03.t: "Přidružené členství přijato" # todo: NEW TRANSLATION
 mercosur.03.d: "[FROM.GetName] přijal naše pozvání a souhlasil se vstupem do MERCOSUR jako přidružený stát. Tento krok je na papíře skromný, politicky však významný: další hlavní město se rozhodlo, že zůstat v blízkosti bloku je bezpečnější než stát zcela mimo něj." # todo: NEW TRANSLATION
 mercosur.03.a: "Výborně." # todo: NEW TRANSLATION
 mercosur.04.t: "Přidružené členství odmítnuto" # todo: NEW TRANSLATION
 mercosur.04.d: "[FROM.GetName] naši nabídku, alespoň prozatím, odmítl. Jejich vláda dává přednost odstupu před zapojením a jakýkoli zájem o užší spolupráci nebyl dostatečně silný, aby překonal opatrnost. Dveře zůstávají otevřené, ale později do nich budeme muset znovu zatlačit." # todo: NEW TRANSLATION
 mercosur.04.a: "Nešťastné." # todo: NEW TRANSLATION
 mercosur.05.t: "Zahájena jednání o plném členství" # todo: NEW TRANSLATION
 mercosur.05.d: "Byla zahájena formální jednání s [CHL.GetName]. Pokud tato jednání uspějí, MERCOSUR nebude pouze tvrdit, že má význam pro celý kontinent; prokáže to tím, že další stát plně začlení do svých institucí." # todo: NEW TRANSLATION
 mercosur.05.a: "Pokračovat." # todo: NEW TRANSLATION
 mercosur.06.t: "Pozvání k připojení jako plnoprávný člen" # todo: NEW TRANSLATION
 mercosur.06.d: "[FROM.GetName] nás pozval, abychom jednou provždy vyřešili otázku plného členství v MERCOSUR. Můžeme okamžitě vstoupit, trvat před konečným krokem na širším balíčku podpory a příprav, nebo rozhodnout, že ještě nenastal správný okamžik. Ať už zvolíme cokoli, naše rozhodnutí ukáže, nakolik hodláme spojit svou budoucnost s blokem." # todo: NEW TRANSLATION
 mercosur.06.a: "Přijmout okamžité plné členství." # todo: NEW TRANSLATION
 mercosur.06.b: "Přijmout, ale požádat o přístupový balíček." # todo: NEW TRANSLATION
 mercosur.06.c: "Zůstat pouze přidruženým státem." # todo: NEW TRANSLATION
 mercosur.07.t: "Vyžádán přístupový balíček" # todo: NEW TRANSLATION
 mercosur.07.d: "[FROM.GetName] v zásadě přijal náš vstup, ale dává přednost tomu, aby plnému členství předcházel širší balíček investic, koordinace a politických záruk. Naše přistoupení nyní proběhne v několika etapách a způsob, jakým se s ním vypořádají, bude po mnoho let utvářet charakter našeho vztahu s blokem." # todo: NEW TRANSLATION
 mercosur.07.a: "Zahájit práci." # todo: NEW TRANSLATION
 mercosur.08.t: "Plné členství odmítnuto" # todo: NEW TRANSLATION
 mercosur.08.d: "[FROM.GetName] prozatím odmítl plné členství. Ať už z opatrnosti, hrdosti nebo vnitropolitického váhání, zatím nejsou připraveni učinit z MERCOSUR trvalou součást svého politického horizontu." # todo: NEW TRANSLATION
 mercosur.08.a: "Vrátíme se k tomu později." # todo: NEW TRANSLATION
 mercosur.09.t: "Zahájena jednání o přidruženém členství" # todo: NEW TRANSLATION
 mercosur.09.d: "Naši diplomaté zahájili s [PRU.GetName] jednání o přidruženém členství v MERCOSUR. Návrh je dostatečně skromný, aby působil prakticky, a zároveň dostatečně významný, aby prověřil, zda má jazyk jihoamerické solidarity v jejich hlavním městě stále svou váhu." # todo: NEW TRANSLATION
 mercosur.09.a: "Pokračovat." # todo: NEW TRANSLATION
