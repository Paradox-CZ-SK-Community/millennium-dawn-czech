 MER_mercosur_democratic_clause_vote_probation_tt: "§YHlasovat pro ponechání uvnitř MERCOSUR pod varováním.§! Pokud zvítězí strana podporující odklad, budou přijata následující opatření:" # todo: NEW TRANSLATION
 MER_mercosur_democratic_clause_suspension_tt: "§YPozastavit členství této země v MERCOSUR.§! Odstranit §YČlenský stát MERCOSUR§! a snížit růst založený na počtu členů u všech zbývajících plnoprávných členů o §G1% růstu produktivity§!, §G1% násobitele daňových příjmů§! a §G1% násobitele zahraničního vlivu§!." # todo: NEW TRANSLATION
 MER_mercosur_democratic_clause_probation_tt: "§YPonechat tuto zemi v MERCOSUR pod zkušební dobou.§! Snížit stabilitu poskytovanou prostřednictvím §YČlenský stát MERCOSUR§! o §R5%§! pro všechny současné i budoucí členy MERCOSUR." # todo: NEW TRANSLATION
 MER_unasul_democratic_clause_vote_suspend_tt: "§YHlasovat pro pozastavení členství.§! Pokud zvítězí strana podporující pozastavení, budou přijata následující opatření:" # todo: NEW TRANSLATION
 MER_unasul_democratic_clause_vote_probation_tt: "§YHlasovat pro ponechání uvnitř UNASUL pod varováním.§! Pokud zvítězí strana podporující odklad, budou přijata následující opatření:" # todo: NEW TRANSLATION
 MER_unasul_democratic_clause_suspension_tt: "§YPozastavit členství této země v UNASUL.§! Odstranit §YČlenský stát UNASUL§!, snížit růst UNASUL založený na počtu členů o §R1% zisku politické moci§! a §R1% stability§! a odstranit zemi z obranného paktu UNASUL, pokud je jeho členem." # todo: NEW TRANSLATION
 MER_unasul_democratic_clause_probation_tt: "§YPonechat tuto zemi v UNASUL pod zkušební dobou.§! Snížit stabilitu poskytovanou prostřednictvím §YČlenský stát UNASUL§! o §R5%§! pro všechny současné i budoucí členy UNASUL." # todo: NEW TRANSLATION
