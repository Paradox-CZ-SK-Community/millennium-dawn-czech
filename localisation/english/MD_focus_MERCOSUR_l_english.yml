 mercosur.26.a: "Pokračovat." # todo: NEW TRANSLATION
 mercosur.28.t: "Přistoupení dokončeno" # todo: NEW TRANSLATION
 mercosur.28.d: "Dlouhý proces přistoupení [FROM.GetName] dospěl ke svému konci. Po jednáních, institucionálních úpravách a vytrvalém dokazování odhodlání již není pochyb: nyní je plnoprávným členem MERCOSUR." # todo: NEW TRANSLATION
 mercosur.28.a: "Připojuje se nový člen." # todo: NEW TRANSLATION
 mercosur.29.t: "Členství formalizováno" # todo: NEW TRANSLATION
 mercosur.29.d: "Cesta vytyčená s [FROM.GetName] konečně dospěla ke svému závěru. Opatrné sbližování skončilo plným přijetím a naše místo uvnitř MERCOSUR je nyní formální, nikoli prozatímní." # todo: NEW TRANSLATION
 mercosur.29.a: "Připojujeme se k bloku." # todo: NEW TRANSLATION
 mercosur.30.t: "Ohlášen jihoamerický summit" # todo: NEW TRANSLATION
 mercosur.30.d: "Nový jihoamerický summit byl ohlášen jako první krok k obnovené regionální spolupráci. Organizátoři prohlásili, že MERCOSUR musí být oživen, hospodářská koordinace posílena a kontinent musí získat silnější společný hlas ve světových záležitostech. Zastánci vítají iniciativu jako dlouho odkládaný návrat k regionálním ambicím, zatímco kritici zpochybňují, zda se Jižní Amerika dokáže posunout od symboliky k trvalé integraci." # todo: NEW TRANSLATION
 mercosur.30.a: "Začíná nová regionální kapitola." # todo: NEW TRANSLATION
 mercosur.31.t: "[FROM.GetName] se připojuje k MERCOSUR jako přidružený člen" # todo: NEW TRANSLATION
 mercosur.31.d: "[FROM.GetName] souhlasil s připojením k MERCOSUR jako přidružený člen, což představuje další krok v obnově jihoamerické regionální spolupráce. Přidružené členství sice nedosahuje úrovně plného členství, ale otevírá cestu k užším obchodním vazbám, politické koordinaci a budoucím jednáním o přistoupení. Zastánci tento krok vnímají jako důkaz, že se MERCOSUR opět stává skutečnou regionální silou." # todo: NEW TRANSLATION
 mercosur.31.a: "Blok roste." # todo: NEW TRANSLATION
 mercosur.32.t: "[FROM.GetName] se stává plnoprávným členem MERCOSUR" # todo: NEW TRANSLATION
 mercosur.32.d: "[FROM.GetName] vstoupil do MERCOSUR jako plnoprávný člen. To, co začalo jako regionální diplomacie, se nyní stalo hmatatelným rozšířením samotného bloku, které prohlubuje jeho hospodářskou váhu a politický význam napříč Latinskou Amerikou. Pro zastánce integrace jde o víc než diplomatický úspěch. Je to důkaz, že MERCOSUR může stále utvářet budoucnost kontinentu." # todo: NEW TRANSLATION
 mercosur.32.a: "Nový člen, silnější blok." # todo: NEW TRANSLATION
 BRA_unasul: "UNASUL" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_unasul_desc: "Potřebujeme spojence! Neměli bychom požádat ostatní jihoamerické země, aby se k nám připojily a vytvořily silnou alianci?" # todo: NEW TRANSLATION # todo: MOVED KEY
 MER_expansion_unasul: "Rozšířit UNASUL" # todo: NEW TRANSLATION
 MER_expansion_unasul_desc: "Má-li se UNASUL stát skutečně kontinentálním rámcem, musí rozšířit účast a zároveň zachovat politický rozmach. Přivedením dalších států do projektu můžeme posílit jeho legitimitu jako společné jihoamerické instituce." # todo: NEW TRANSLATION
 MER_sa_corridor_development: "Rozvoj jihoamerických koridorů" # todo: NEW TRANSLATION
 MER_sa_corridor_development_desc: "Kontinentální integrace nemůže stát pouze na prohlášeních. Silnice, přístavy, železnice, telekomunikace a vnitrozemské koridory musí být propojeny, aby se přeshraniční pohyb a obchod staly skutečností, nikoli jen rétorikou." # todo: NEW TRANSLATION
 MER_counter_cartel: "Spolupráce proti kartelům" # todo: NEW TRANSLATION
 MER_counter_cartel_desc: "Obchod s drogami, pašování zbraní a nadnárodní zločinecké organizace ohrožují jihoamerickou stabilitu i regionální integraci. Musíme posílit sdílení zpravodajských informací a společný postup proti hrozbám, které nerespektují státní hranice." # todo: NEW TRANSLATION
 MER_sa_energy_council: "Jihoamerická energetická rada" # todo: NEW TRANSLATION
 MER_sa_energy_council_desc: "Díky ropě, plynu, vodní energii a rozsáhlým přenosovým sítím má Jižní Amerika velký potenciál pro energetickou spolupráci. Namísto toho, abychom dovolili, aby se tyto zdroje staly zdrojem soupeření, měli bychom usilovat o regionální stabilitu a vzájemné doplňování." # todo: NEW TRANSLATION
 MER_sa_health_council: "Jihoamerická zdravotní rada" # todo: NEW TRANSLATION
 MER_sa_health_council_desc: "Zdravotní spolupráce je méně dramatická než geopolitika, ale patří k nejpraktičtějším a nejúčinnějším oblastem jihoamerické integrace. Koordinací dohledu, léků a zdravotnického personálu můžeme ukázat integraci v každodenním životě." # todo: NEW TRANSLATION
 MER_productive_integration_and_sme_networks: "Produktivní integrace a sítě malých a středních podniků" # todo: NEW TRANSLATION
 MER_productive_integration_and_sme_networks_desc: "Regionální integrace by neměla zůstat omezena na velké korporace a vývoz komodit. Podporou malých a středních podniků, regionálních dodavatelských řetězců a výrobní komplementarity můžeme projektu poskytnout konkrétnější hospodářský základ." # todo: NEW TRANSLATION
 MER_sa_defense_council: "Jihoamerická obranná rada" # todo: NEW TRANSLATION
 MER_sa_defense_council_desc: "Bezpečnost Jižní Ameriky by neměla záviset pouze na vnějších rámcích. Ještě před jakýmikoli velkolepými vojenskými ambicemi musí region vybudovat návyky dialogu, transparentnosti a koordinovaného zvládání krizí v obranných otázkách." # todo: NEW TRANSLATION
 MER_sa_network_for_science_and_innovation: "Jihoamerická síť inovací" # todo: NEW TRANSLATION
 MER_sa_network_for_science_and_innovation_desc: "Má-li integrace sloužit budoucnosti, musí Jižní Amerika propojit nejen trhy a zdroje, ale také znalosti a inovace. Vědecká spolupráce může posílit autonomní rozvoj kontinentu." # todo: NEW TRANSLATION
 MER_unasul_factions: "Společná obranná organizace UNASUL" # todo: NEW TRANSLATION
 MER_unasul_factions_desc: "Nastal čas posunout jihoamerickou jednotu za hranice samotné politické spolupráce. Abychom zajistili regionální bezpečnost a společně reagovali na vnější tlak a destabilizaci, institucionalizujeme obrannou spolupráci pod vedením UNASUL a vybudujeme novou společnou obrannou organizaci propojující národy Jižní Ameriky." # todo: NEW TRANSLATION
 unasul_member_state_modifier: "Členský stát UNASUL" # todo: NEW TRANSLATION
 unasul_member_state_modifier_desc: "UNASUL je obnovován jako kontinentální rámec pro politickou koordinaci, rozvoj a společný postup v Jižní Americe. Jeho přínosy rostou s příchodem dalších členů a s tím, jak nové rady a programy rozšiřují dosah organizace.\n\n§YTento národní duch sílí s rostoucím počtem členských států UNASUL.§!" # todo: NEW TRANSLATION
 MER_unasul_integrated_corridor_plan_modifier: "Integrovaný koridorový plán UNASUL" # todo: NEW TRANSLATION
 MER_unasul_integrated_corridor_plan_modifier_desc: "UNASUL zahájil koordinovanou investiční vlnu do silnic, logistiky a digitálního propojení napříč Jižní Amerikou. Členské státy nyní budují dopravní a síťovou infrastrukturu rychleji než obvykle." # todo: NEW TRANSLATION
 MER_unasul_energy_security_modifier: "Iniciativa energetické bezpečnosti UNASUL" # todo: NEW TRANSLATION
 MER_unasul_energy_security_modifier_desc: "UNASUL se zavázal vyčlenit zdroje celého bloku na energetickou odolnost. Členské státy nyní v rámci společného regionálního programu urychlují výstavbu fosilních, jaderných i obnovitelných zdrojů energie." # todo: NEW TRANSLATION
 MER_unasul_joint_exercises_modifier: "Společná cvičení UNASUL" # todo: NEW TRANSLATION
 MER_unasul_joint_exercises_modifier_desc: "Ozbrojené síly UNASUL se nyní účastní koordinované série společných cvičení, výměn štábů a plánování interoperability." # todo: NEW TRANSLATION
 MER_invite_to_unasul: "Pozvat [FROM.GetName] do UNASUL" # todo: NEW TRANSLATION
 MER_invite_to_unasul_desc: "Zahájit formální jednání s [FROM.GetName] o vstupu do UNASUL. Míra přijetí závisí na názoru dané země na nás, našem vlivu na ni a pokroku ve stromu UNASUL." # todo: NEW TRANSLATION
 MER_unasul_integrated_corridor_plan: "Spustit integrovaný koridorový plán" # todo: NEW TRANSLATION
 MER_unasul_integrated_corridor_plan_desc: "Vynaložit prostředky státní pokladny na urychlení výstavby dopravní a síťové infrastruktury ve všech současných členských státech UNASUL po dobu 180 dní." # todo: NEW TRANSLATION
 MER_unasul_counter_cartel_operation: "Spustit spojeneckou operaci proti kartelům" # todo: NEW TRANSLATION
 MER_unasul_counter_cartel_operation_desc: "Vyzvat každého člena UNASUL trpícího vlivem kartelů, aby přispěl politickým kapitálem ke koordinované operaci proti kartelům. Konečný dopad závisí na počtu států, které se plně zavážou." # todo: NEW TRANSLATION
 MER_unasul_counter_cartel_operation_tt: "Každý člen UNASUL ovlivněný kartely bude požádán, aby operaci poskytl politický kapitál. Konečný výsledek závisí na tom, jak silně zúčastněné vlády podpoří zásah." # todo: NEW TRANSLATION
 MER_unasul_energy_security_reinforcement: "Posílit jihoamerickou energetickou bezpečnost" # todo: NEW TRANSLATION
 MER_unasul_energy_security_reinforcement_desc: "Vynaložit prostředky státní pokladny na urychlení výstavby fosilních, jaderných a obnovitelných zdrojů energie ve všech současných členských státech UNASUL po dobu 180 dní." # todo: NEW TRANSLATION
 MER_unasul_joint_health_improvement_project: "Spustit společný projekt UNASUL na zlepšení zdravotnictví" # todo: NEW TRANSLATION
 MER_unasul_joint_health_improvement_project_desc: "Zahájit 180denní projekt koordinace zdravotnictví. Po jeho dokončení získá UNASUL trvalé zvýšení měsíčního růstu populace. Projekt lze dokončit až čtyřikrát.\n\n§YProstřednictvím této projektové linie může měsíční růst populace UNASUL dosáhnout celkem až +10 %.§!" # todo: NEW TRANSLATION
 MER_unasul_joint_health_improvement_project_rounds_tt: "Vyžaduje méně než §Y4§! dokončená kola společného projektu na zlepšení zdravotnictví" # todo: NEW TRANSLATION
 MER_unasul_supply_chain_strengthening: "Posílit jihoamerické dodavatelské řetězce" # todo: NEW TRANSLATION
 MER_unasul_supply_chain_strengthening_desc: "Zahájit 180denní projekt koordinace dodavatelských řetězců. Po jeho dokončení získá UNASUL trvalé zvýšení produktivity civilního průmyslu. Projekt lze dokončit až čtyřikrát.\n\n§YProstřednictvím této projektové linie může produktivita civilního průmyslu UNASUL dosáhnout celkem až +15 %.§!" # todo: NEW TRANSLATION
 MER_unasul_supply_chain_strengthening_rounds_tt: "Vyžaduje méně než §Y4§! dokončená kola posilování dodavatelských řetězců" # todo: NEW TRANSLATION
 MER_unasul_joint_exercises: "Spustit společná cvičení UNASUL" # todo: NEW TRANSLATION
 MER_unasul_joint_exercises_desc: "Financovat 180denní sérii společných cvičení UNASUL a zlepšit každodenní získávání pozemních, námořních a leteckých zkušeností v celém bloku." # todo: NEW TRANSLATION
 MER_unasul_joint_research_exchange_project: "Spustit společný projekt UNASUL pro výzkum a technologickou výměnu" # todo: NEW TRANSLATION
 MER_unasul_joint_research_exchange_project_desc: "Zahájit 180denní program koordinace výzkumu. Po jeho dokončení získá UNASUL trvalé zvýšení rychlosti výzkumu. Projekt lze dokončit až čtyřikrát.\n\n§YProstřednictvím této projektové linie může rychlost výzkumu UNASUL dosáhnout celkem až +10 %.§!" # todo: NEW TRANSLATION
 MER_unasul_joint_research_exchange_project_rounds_tt: "Vyžaduje méně než §Y4§! dokončená kola společného projektu pro výzkum a technologickou výměnu" # todo: NEW TRANSLATION
 mercosur.35.t: "Pozvání ke vstupu do UNASUL" # todo: NEW TRANSLATION
 mercosur.35.d: "[FROM.GetName] nás pozval ke vstupu do UNASUL a představil jej jako politickou střechu, pod níž by se Jižní Amerika mohla znovu naučit jednat společně. Přijetí by nás zařadilo do projektu slibujícího dialog, koordinaci a kontinentální ambice, zároveň by však vyžadovalo odpověď na otázku, zda jsme připraveni spojit svůj osud s širší regionální vizí." # todo: NEW TRANSLATION
 mercosur.35.a: "Vstoupit do UNASUL." # todo: NEW TRANSLATION
 mercosur.35.b: "Prozatím odmítnout." # todo: NEW TRANSLATION
 mercosur.36.t: "Pozvání do UNASUL odesláno" # todo: NEW TRANSLATION
 mercosur.36.d: "S [FROM.GetName] byla zahájena diplomatická jednání o vstupu do UNASUL. Pozvání bylo odesláno, naše argumenty předloženy a nyní čekáme, zda je další hlavní město ochotno vsadit na návrat jihoamerické shody." # todo: NEW TRANSLATION
 mercosur.36.a: "Pokračovat." # todo: NEW TRANSLATION
 mercosur.37.t: "Pozvání do UNASUL přijato" # todo: NEW TRANSLATION
 mercosur.37.d: "[FROM.GetName] přijal naše pozvání a vstoupil do UNASUL. To, co bylo ještě nedávno jen myšlenkou probíranou v projevech a komuniké, začíná získávat podobu skutečné kontinentální instituce." # todo: NEW TRANSLATION
 mercosur.37.a: "Vynikající." # todo: NEW TRANSLATION
 mercosur.38.t: "Pozvání do UNASUL odmítnuto" # todo: NEW TRANSLATION
 mercosur.38.d: "[FROM.GetName] prozatím odmítl naše pozvání ke vstupu do UNASUL. Sen o širším jihoamerickém rámci nebyl zcela odmítnut, ale dosud si nezískal jejich důvěru." # todo: NEW TRANSLATION
 mercosur.38.a: "Zkusíme to znovu později." # todo: NEW TRANSLATION
 mercosur.39.t: "Členství v UNASUL přijato" # todo: NEW TRANSLATION
 mercosur.39.d: "Přijali jsme pozvání [FROM.GetName] a vstoupili do UNASUL. Ať už je budoucnost jihoamerické integrace jakkoli nejistá, rozhodli jsme se nepřihlížet jí z povzdálí." # todo: NEW TRANSLATION
 mercosur.39.a: "Širší Jižní Amerika." # todo: NEW TRANSLATION
 mercosur.40.t: "[FROM.GetName] vstupuje do UNASUL" # todo: NEW TRANSLATION
 mercosur.40.d: "[FROM.GetName] vstoupil do UNASUL a přidal do vznikajícího jihoamerického rámce další hlas, další byrokracii a další národní ambice. S každým přistoupením je stále obtížnější tento projekt odmítnout jako nostalgii a snazší představit si jej jako trvalý politický fakt." # todo: NEW TRANSLATION
 mercosur.40.a: "Kontinent se stále více sjednocuje." # todo: NEW TRANSLATION
 mercosur.50.t: "Integrovaný koridorový plán aktivován" # todo: NEW TRANSLATION
 mercosur.50.d: "Integrovaný koridorový plán UNASUL se přesunul od konferenčních stolů k mapám průzkumů a plánům v terénu. Po celém kontinentu se nyní ministerstva, inženýři a plánovači pokoušejí proměnit jazyk integrace v silnice, spojení a koridory, které mohou státy skutečně pocítit." # todo: NEW TRANSLATION
 mercosur.50.a: "Pokračovat ve výstavbě." # todo: NEW TRANSLATION
 mercosur.51.t: "Spuštěn společný zdravotnický projekt" # todo: NEW TRANSLATION
 mercosur.51.d: "V rámci UNASUL byla zahájena nová společná zdravotnická iniciativa. Úředníci hovoří o společných nákupech, koordinovaných reakcích a lepší spolupráci, pod administrativním jazykem se však skrývá větší ambice: aby byla regionální integrace cítit na klinikách, v lékárnách i v každodenním životě." # todo: NEW TRANSLATION
 mercosur.51.a: "Za zdravější kontinent." # todo: NEW TRANSLATION
 mercosur.52.t: "Společný zdravotnický projekt dokončen" # todo: NEW TRANSLATION
 mercosur.52.d: "Nejnovější společná zdravotnická iniciativa byla dokončena a její nejúspěšnější postupy se nyní začleňují do trvalého aparátu UNASUL. To, co začalo jako dočasné úsilí, se stává zvykem a organizace díky tomu získává lidštější a hmatatelnější tvář." # todo: NEW TRANSLATION
 mercosur.52.a: "Trvalý přínos." # todo: NEW TRANSLATION
 mercosur.53.t: "Iniciativa energetické bezpečnosti aktivována" # todo: NEW TRANSLATION
 mercosur.53.d: "UNASUL zahájil celokontinentální úsilí o energetickou bezpečnost. Energetičtí plánovači, představitelé energetických společností a ministři nyní náhle pracují podle stejné regionální mapy a snaží se zajistit, aby se hojnost Jižní Ameriky stala zdrojem stability namísto soupeření." # todo: NEW TRANSLATION
 mercosur.53.a: "Napájet kontinent." # todo: NEW TRANSLATION
 mercosur.54.t: "Spuštěna iniciativa dodavatelských řetězců" # todo: NEW TRANSLATION
 mercosur.54.d: "Byla zahájena nová iniciativa UNASUL zaměřená na dodavatelské řetězce. Vlády, obchodní komory a technické agentury se nyní pokoušejí o náročnou práci, aby jihoamerická výroba do sebe zapadala, místo aby jen existovala vedle sebe." # todo: NEW TRANSLATION
 mercosur.54.a: "Integrovat trh." # todo: NEW TRANSLATION
 mercosur.55.t: "Iniciativa dodavatelských řetězců dokončena" # todo: NEW TRANSLATION
 mercosur.55.d: "Nejnovější iniciativa UNASUL v oblasti dodavatelských řetězců byla dokončena. Její praktické poznatky, obchodní vztahy a administrativní postupy již nejsou dočasnými experimenty; stávají se součástí trvalé hospodářské architektury regionu." # todo: NEW TRANSLATION
 mercosur.55.a: "Silnější výrobní základna." # todo: NEW TRANSLATION
 mercosur.56.t: "Probíhají společná cvičení" # todo: NEW TRANSLATION
 mercosur.56.d: "Společná cvičení UNASUL právě probíhají. Důstojníci, kteří se dříve znali pouze prostřednictvím formálního protokolu, se setkávají v terénu, vyměňují si postupy, ověřují předpoklady a zjišťují, jak vypadá regionální koordinace, když má skutečně fungovat v praxi." # todo: NEW TRANSLATION
 mercosur.56.a: "Zlepšit připravenost." # todo: NEW TRANSLATION
 mercosur.57.t: "Spuštěn projekt výměny ve výzkumu" # todo: NEW TRANSLATION
 mercosur.57.d: "Bylo zahájeno nové úsilí UNASUL o výměnu ve výzkumu a technologiích. Univerzity, instituty a technické agentury z celé Jižní Ameriky jsou zapojovány do stejné diskuse v naději, že si region bude vyměňovat myšlenky stejně vážně jako zboží." # todo: NEW TRANSLATION
 mercosur.57.a: "Sdílet znalosti." # todo: NEW TRANSLATION
 mercosur.58.t: "Projekt výměny ve výzkumu dokončen" # todo: NEW TRANSLATION
 mercosur.58.d: "Nejnovější úsilí o výměnu ve výzkumu a technologiích bylo dokončeno. Partnerství, která vytvořilo, přežila samotný projekt a zanechala po sobě hustší síť kontaktů a silnější přesvědčení, že jihoamerické znalosti lze organizovat, nikoli jen rozptýlit." # todo: NEW TRANSLATION
 mercosur.58.a: "Znalosti přetrvávají." # todo: NEW TRANSLATION
 mercosur.60.t: "Financování operace proti kartelům" # todo: NEW TRANSLATION
 mercosur.60.d: "UNASUL zahájil koordinovanou operaci proti vlivu kartelů. Otázkou před námi není, zda je hrozba skutečná, ale kolik vlastní politické váhy jsme ochotni vložit za regionální řešení." # todo: NEW TRANSLATION
 mercosur.60.a: "Schválit omezený příspěvek meziresortní spolupráci." # todo: NEW TRANSLATION
 mercosur.60.b: "Vložit do operace plnou sílu státu." # todo: NEW TRANSLATION
 mercosur.61.t: "Operace proti kartelům zesílena" # todo: NEW TRANSLATION
 mercosur.61.d: "Většina zúčastněných vlád UNASUL se rozhodla operaci plně podpořit. Výsledkem nebylo pouhé gesto, ale tvrdý regionální úder proti kartelovým sítím, jejich patronům a atmosféře strachu, která jim umožňuje přežívat." # todo: NEW TRANSLATION
 mercosur.61.a: "Využít získané výhody." # todo: NEW TRANSLATION
 mercosur.62.t: "Operace proti kartelům dokončena" # todo: NEW TRANSLATION
 mercosur.62.d: "Operace pokračovala s umírněnější podporou. Přesto koordinovaný tlak otřásl kartelovými sítěmi a zúžil jejich prostor k manévrování, byť ne tak silně, jak by dokázala jednotnější reakce." # todo: NEW TRANSLATION
 mercosur.62.a: "Užitečný krok." # todo: NEW TRANSLATION
 mercosur.75.t: "Pozvání ke vstupu do obranného paktu UNASUL" # todo: NEW TRANSLATION
 mercosur.75.d: "[FROM.GetName] nás pozval do obranného rámce UNASUL. Přijetí by znamenalo víc než podpis dalšího dokumentu; zařadilo by nás do vojenského uspořádání, jehož cílem je dát sousedům i vnějším mocnostem najevo, že Jižní Amerika hodlá v době rostoucího tlaku stát při sobě." # todo: NEW TRANSLATION
 mercosur.75.a: "Vstoupit do obranného paktu." # todo: NEW TRANSLATION
 mercosur.75.b: "Odmítnout." # todo: NEW TRANSLATION
 mercosur.76.t: "Pozvání do obranného paktu přijato" # todo: NEW TRANSLATION
 mercosur.76.d: "[FROM.GetName] přijal naše pozvání a vstoupil do obranného paktu UNASUL. Aliance je stále mladá, ale každý nový podpis jí dodává větší důvěryhodnost, váhu a význam přesahující pouhou rétoriku." # todo: NEW TRANSLATION
 mercosur.76.a: "Aliance roste." # todo: NEW TRANSLATION
 mercosur.77.t: "Pozvání do obranného paktu odmítnuto" # todo: NEW TRANSLATION
 mercosur.77.d: "[FROM.GetName] prozatím odmítl vstoupit do obranného paktu UNASUL. Přes veškerá slova o regionální solidaritě není každá vláda připravena učinit z obranné politiky součást společného jihoamerického příběhu." # todo: NEW TRANSLATION
 mercosur.77.a: "Nešťastné." # todo: NEW TRANSLATION
 mercosur.78.t: "Vstupujeme do obranného paktu UNASUL" # todo: NEW TRANSLATION
 mercosur.78.d: "Přijali jsme pozvání [FROM.GetName] a vstoupili do obranného paktu UNASUL. Tím jsme svou bezpečnost pevněji spojili s kontinentálním rámcem, jehož cílem je proměnit politickou spřízněnost ve strategický závazek." # todo: NEW TRANSLATION
 mercosur.78.a: "Jižní Amerika stojí společně." # todo: NEW TRANSLATION
 mercosur.79.t: "Sladění cel dokončeno" # todo: NEW TRANSLATION
 mercosur.79.d: "Týdny jednání, právních posouzení a celních prací s potenciálním novým členem jsou u konce. Proces byl na povrchu technický, politicky však měl význam z prostého důvodu: další překážka mezi jejich a naším trhem se nyní jeví jako dočasná." # todo: NEW TRANSLATION
 mercosur.80.t: "Modernizace cel dokončena" # todo: NEW TRANSLATION
 mercosur.80.d: "Úsilí o celní reformu potenciálního nového člena bylo dokončeno. Postupy byly objasněny, pohraniční režim zpřísněn a administrativní fungování státu přiblíženo tomu, co vyžaduje plný vstup do MERCOSUR." # todo: NEW TRANSLATION
 mercosur.81.t: "Přijaty společné standardy" # todo: NEW TRANSLATION
 mercosur.81.d: "Balíček společných standardů pro potenciálního nového člena byl dokončen. Pravidla, která kdysi odrážela odstup, se nyní přepisují jazykem slučitelnosti a jejich cesta do bloku vypadá stále skutečněji." # todo: NEW TRANSLATION
 mercosur.82.t: "Projekt logistického koridoru dokončen" # todo: NEW TRANSLATION
 mercosur.82.d: "Projekt logistického koridoru pro potenciálního nového člena byl dokončen. To, o čem se kdysi hovořilo abstraktně, začíná nabývat podoby tras, skladů a praktických spojení, díky nimž přistoupení působí skutečně, nikoli obřadně." # todo: NEW TRANSLATION
 mercosur.83.t: "Dopravní modernizace dokončena" # todo: NEW TRANSLATION
 mercosur.83.d: "Nejnovější dopravní práce spojené s balíčkem přistoupení potenciálního nového člena byly dokončeny. Vzdálenost nezmizela, ale mapa nyní vypadá o něco menší a vyhlídka integrace o něco méně teoretická." # todo: NEW TRANSLATION
 mercosur.84.t: "Program konektivity dokončen" # todo: NEW TRANSLATION
 mercosur.84.d: "Nejnovější program konektivity pro potenciálního nového člena byl dokončen. Obchodní provoz, administrativní kontakt a přeshraniční koordinace nyní mají pevnější kanály, jimiž mohou proudit." # todo: NEW TRANSLATION
 mercosur.85.t: "Rozvojové fondy vyplaceny" # todo: NEW TRANSLATION
 mercosur.85.d: "Rozvojový balíček pro potenciálního nového člena byl plně doručen. Viditelný závazek tohoto rozsahu říká jejich vládě více než jakékoli komuniké: MERCOSUR je připraven do členství investovat, nikoli jen žádat o důvěru." # todo: NEW TRANSLATION
 mercosur.86.t: "Civilní investice dokončena" # todo: NEW TRANSLATION
 mercosur.86.d: "Civilní investiční fáze balíčku přistoupení potenciálního nového člena byla dokončena. Dílny, firmy a obchodní čtvrti nyní mají jasnější důvod vnímat regionální integraci jako něco konkrétního, nikoli jen diplomatického." # todo: NEW TRANSLATION
 mercosur.87.t: "Modernizace infrastruktury dokončena" # todo: NEW TRANSLATION
 mercosur.87.d: "Program zlepšení infrastruktury potenciálního nového člena byl dokončen. Každý dokončený projekt zanechává stejné politické poselství: přistoupení není jen podpis, ale změna způsobu, jakým je země napojena na širší region." # todo: NEW TRANSLATION
 mercosur.88.t: "Obchodní infrastruktura rozšířena" # todo: NEW TRANSLATION
 mercosur.88.d: "Projekt obchodní infrastruktury pro potenciálního nového člena byl dokončen. Příslib MERCOSUR se nyní projevuje nejen v projevech, ale také v rušnějších koridorech, lepším vybavení a jasnějším vědomí vzájemné závislosti." # todo: NEW TRANSLATION
 mercosur.89.t: "Dohoda o průmyslových investicích vstoupila v platnost" # todo: NEW TRANSLATION
 mercosur.89.d: "Dohoda o průmyslových investicích s potenciálním novým členem vstoupila v platnost. Z toho, co bylo diplomatickým porozuměním, se stává hluboký hospodářský vztah s očekáváními a zájmy dostatečně silnými, aby přežily slavnostní okamžik." # todo: NEW TRANSLATION
 mercosur.90.t: "Vytvořen rámec obchodních investic" # todo: NEW TRANSLATION
 mercosur.90.d: "Rámec obchodních investic s potenciálním novým členem byl vytvořen. Banky, firmy a ministerstva nyní mají pevnější most mezi sebou a s ním i silnější motivaci vnímat přistoupení jako společnou sázku, nikoli symbolické gesto." # todo: NEW TRANSLATION
 mercosur.91.t: "Balíček finanční spolupráce doručen" # todo: NEW TRANSLATION
 mercosur.91.d: "Balíček finanční spolupráce pro potenciálního nového člena byl doručen. S tímto posledním dílem na místě již úsilí o přistoupení nepůsobí prozatímně; připomíná zemi postupně vtahovanou do vnitřního kruhu bloku." # todo: NEW TRANSLATION
 mercosur.108.t: "Začíná kolo Rozvojového fondu MERCOSUR" # todo: NEW TRANSLATION
 mercosur.108.d: "Bylo zahájeno nové kolo Rozvojového fondu MERCOSUR. Ministerstva, firmy a místní úřady v celém bloku je budou vnímat jako něco víc než účetní položku: jako důkaz, že integrace stále stojí na penězích, plánování a institucionální vůli. Příslib rozvoje se opět přesouvá z papíru do terénu." # todo: NEW TRANSLATION
 mercosur.108.a: "Nechte fondy proudit." # todo: NEW TRANSLATION
 mercosur.accession_project_complete.a: "Pokračovat." # todo: NEW TRANSLATION
 mercosur.93.t: "Plné členství přijato" # todo: NEW TRANSLATION
 mercosur.93.d: "[FROM.GetName] přijal naši nabídku a okamžitě vstoupil do MERCOSUR jako plnoprávný člen. Nebude žádná dlouhá přechodná fáze ani pečlivě rozfázované sbližování, pouze náhlý politický fakt, že se blok dnes rozrostl." # todo: NEW TRANSLATION
 mercosur.93.a: "Vynikající." # todo: NEW TRANSLATION
 mercosur.94.t: "Vstupujeme do MERCOSUR" # todo: NEW TRANSLATION
 mercosur.94.d: "Náš směr je určen a MERCOSUR již není fórem mimo náš dosah, nýbrž strukturou, jejíž jsme nyní součástí. Stará nejasnost ohledně našeho postavení v regionálním uspořádání ustupuje tvrdšímu faktu: jsme uvnitř bloku a kontinent se této realitě bude muset přizpůsobit." # todo: NEW TRANSLATION
 mercosur.94.a: "Připojujeme se k bloku." # todo: NEW TRANSLATION
 mercosur.105.t: "Přiznán status přidruženého člena" # todo: NEW TRANSLATION
 mercosur.105.d: "Naše žádost nás přivedla do MERCOSUR jako přidružený stát. Nejde ještě o nejvnitřnější kruh bloku, ale stačí to k tomu, aby bylo zřejmé, že se náš politický a hospodářský horizont nyní sklání k jihoamerické integraci, nikoli od ní." # todo: NEW TRANSLATION
 mercosur.105.a: "Přibližujeme se." # todo: NEW TRANSLATION
 mercosur.107.t: "Žádost o členství v UNASUL schválena" # todo: NEW TRANSLATION
 mercosur.107.d: "Naše žádost nás přivedla do UNASUL. Ať už budoucnost jihoamerické integrace zůstává jakkoli nejistá, rozhodli jsme se experiment nesledovat zpovzdálí, ale vstoupit do něj a zaujmout své místo v právě budovaném rámci." # todo: NEW TRANSLATION
 mercosur.107.a: "Připojujeme se k projektu." # todo: NEW TRANSLATION
 mercosur_news.1.t: "Vznik UNASUL" # todo: NEW TRANSLATION
 mercosur_news.1.d: "Národy Jižní Ameriky oznámily založení UNASUL jako stálé regionální organizace, jejímž cílem je sjednotit politický dialog, rozvoj infrastruktury a sociální spolupráci v jediném rámci. Tímto krokem vstupuje jihoamerická jednota do nové etapy a regionální koordinace se může stát institucionálnější a trvalejší. Zda však tento projekt skutečně uspěje, záleží na tom, zda jeho členové dokážou překonat své rozdílné národní zájmy." # todo: NEW TRANSLATION
 mercosur_news.1.a: "Nová etapa pro Jižní Ameriku" # todo: NEW TRANSLATION
 mercosur_news.2.t: "UNASUL vytváří společný obranný pakt" # todo: NEW TRANSLATION
 mercosur_news.2.d: "UNASUL překonal hospodářskou a politickou koordinaci a oznámil vytvoření nového jihoamerického obranného paktu. Jeho zastánci jej představují jako přirozené rozšíření regionální jednoty, zatímco skeptici varují, že kontinent vstupuje do asertivnější a potenciálně rozdělující fáze blokové politiky." # todo: NEW TRANSLATION
 mercosur_news.2.a: "Jižní Amerika semkla řady." # todo: NEW TRANSLATION
 mercosur_news.3.t: "Člen se vzdaluje od UNASUL" # todo: NEW TRANSLATION
 mercosur_news.3.d: "[ROOT.GetNameWithFlag] oznámil své vystoupení ze Společného obranného mechanismu UNASUL, čímž znovu otevřel pochybnosti, o nichž se mnozí domnívali, že byly uzavřeny, když Jižní Amerika poprvé spojila své obranné linie. Zastánci odchodu jej popisují jako návrat ke svobodě suverénního jednání; kritici jej považují za první viditelnou prasklinu v paktu, který závisel stejně na politické důvěře jako na formálních podpisech. Nyní bude celý kontinent sledovat, zda jde o izolovaný obrat, nebo o začátek širšího rozpadu." # todo: NEW TRANSLATION
 mercosur_news.3.a: "Pakt už nepůsobí nerozbitně." # todo: NEW TRANSLATION
 UNASUL_faction: "UNASUL" # todo: MOVED KEY
