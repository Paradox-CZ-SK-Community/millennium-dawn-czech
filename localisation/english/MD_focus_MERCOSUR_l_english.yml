 MER_invite_PRU_associate_desc: "Zahájit formální rozhovory s Peru o připojení k MERCOSUR jako přidružený stát.\n\n§YMíra přijetí závisí na názoru dané země na nás, našem vlivu na ni a postupu stromu MERCOSUR!§!" # todo: NEW TRANSLATION
