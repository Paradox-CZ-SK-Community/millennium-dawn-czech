l_english:
 BRA_education_integration: "Integrace vzdělávání" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_education_integration_desc: "Financováním nového vzdělávání a programů výměny studentů se společnými pravidly začneme integrovat kurikulum všech členů MERCOSUR." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_mercosur_market: "Trh MERCOSUR" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_mercosur_market_desc: "Zvýšením zaměření na obchod s ostatními členy MERCOSUR můžeme zlepšit naše vztahy a posílit ekonomiku naší země." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_inv_assoc: "Pozvat asociované státy" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_inv_assoc_desc: "Máme blízké vztahy s asociovanými státy MERCOSUR. Aby byly vztahy ještě lepší, a aby jejich ekonomika měla šanci růst, měli bychom je pozvat a udělat z nich hrdé členy MERCOSUR." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_maintain_quo: "Udržet současný stav" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_maintain_quo_desc: "MERCOSUR je teď v pořádku. Nepotřebujeme další člany. Asociované státy mohou zůstat jako asociované prozatím." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_expand_to_latin_america: "Rozšířit na celou Latinskou Ameriku" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_expand_to_latin_america_desc: "Tento svazek musí sjednotit všechny naše latinskoamerické bratry, jako Mexiko, Guatemala a Honduras!" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_americas_unity: "Jednota Jižní Ameriky" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_americas_unity_desc: "Obklopeni našimi sousedy, společně můžeme být silní." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_americas_unity_TT: "Země, která toto získá, obdrží §G+15§! §Ymodifikátor názoru§! u ostatních §Yjihoamerických zemí§!." # todo: NEW TRANSLATION
 BRA_mercosur: "MERCOSUR" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_mercosur_desc: "MERCOSUR, nebo MERCOSUL, byl celní a politický pakt podepsaný na počátku 90. let Brazílií, Argentinou, Uruguay a Paraguay. Později se zbytek Jižní Ameriky stal asociovanými členy Mercosuru. Tato organizace je užitečnou institucí, která má přinést potřebnou prosperitu a sjednocení Jižní Ameriky." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_trade_agreement: "Obchodní dohody" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_trade_agreement_desc: "Měli bychom nadále dělat více obchodu s ostatními jihoamerickými zeměmi. Tím zlepšíme naše vztahy a naši ekonomiku." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_discuss_currency: "Diskutovat o měně" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_discuss_currency_desc: "Společná měnová jednotka musí být dohodnuta všemi členy MERCOSUR." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_people_goods: "Lidé a zboží" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_people_goods_desc: "Měli bychom umožnit pohyb nejen zboží, ale i snadný pohyb lidí přes naše hranice." # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_assoc_members: "Asociovat nové členy" # todo: NEW TRANSLATION # todo: MOVED KEY
 BRA_assoc_members_desc: "Jeden z nás, jeden z nás." # todo: NEW TRANSLATION # todo: MOVED KEY
 MER_secretariat_reform: "Reforma sekretariátu MERCOSUR" # todo: NEW TRANSLATION
 MER_secretariat_reform_desc: "Větší blok nelze navždy spravovat prostřednictvím improvizované diplomacie. Pokud mají noví členové důvěřovat MERCOSUR jako seriózní instituci, jeho administrativní jádro musí být posíleno. Schopnější sekretariát učiní přistoupení, koordinaci a řešení sporů mnohem důvěryhodnějšími." # todo: NEW TRANSLATION
 MER_infrastructure_corridor_program: "Program infrastrukturních koridorů" # todo: NEW TRANSLATION
 MER_infrastructure_corridor_program_desc: "Regionální integrace nemá smysl, pokud silnice končí na hranicích a logistika se ve vnitrozemí hroutí. MERCOSUR musí být propojen nejen dohodami, ale také infrastrukturou, která umožní pohyb zboží, kapitálu a lidí napříč kontinentem. Silnější blok musí být fyzicky vybudován, nikoli pouze vyhlášen." # todo: NEW TRANSLATION
 MER_development_fund: "Rozvojový fond MERCOSUR" # todo: NEW TRANSLATION
 MER_development_fund_desc: "Některé státy se nenechají přesvědčit pouze sliby. Připojí se jen tehdy, pokud integrace přinese viditelný rozvoj a skutečné investice. Založením Rozvojového fondu MERCOSUR můžeme proměnit přistoupení v příležitost a učinit členství materiálně atraktivním." # todo: NEW TRANSLATION
 mercosur_member_state_modifier: "Členský stát Mercosuru" # todo: NEW TRANSLATION
 mercosur_member_state_modifier_desc: "MERCOSUR začal jako celní a politický rámec soustředěný kolem Brazílie, Argentiny, Uruguaye a Paraguaye a později se prostřednictvím přidružených partnerství rozšířil po celé Jižní Americe. Účast v bloku spojuje naši budoucnost s širším regionálním projektem obchodu, koordinace a společného rozvoje.\n\n§YTento národní duch sílí s přibývajícím počtem přidružených a plnoprávných členů!§!" # todo: NEW TRANSLATION
 MER_development_fund_round_modifier: "Výplata z Rozvojového fondu MERCOSUR" # todo: NEW TRANSLATION
 MER_development_fund_round_modifier_desc: "Rozvojový fond MERCOSUR v současnosti financuje novou civilní a kancelářskou výstavbu napříč blokem. Dokud toto kolo výplat pokračuje, projekty hospodářského rozvoje jsou urychleně posouvány vpřed." # todo: NEW TRANSLATION
 MER_mercosur_diplomacy: "Jihoamerická integrace" # todo: NEW TRANSLATION
 MER_mercosur_diplomacy_desc: "MERCOSUR je rámcem pro rozšiřování obchodu a posilování vazeb regionálních trhů, zatímco UNASUL představuje širší vizi jihoamerické spolupráce zasahující do politického dialogu, infrastruktury a bezpečnosti. Prostřednictvím těchto rámců lze posílit jihoamerickou jednotu a dále rozvíjet regionální integraci.\n\n§YNárodní duchové MERCOSUR a UNASUL sílí s každým novým členským státem!§!" # todo: NEW TRANSLATION
 MER_invite_CHL_full_member: "Pozvat Chile jako plnoprávného člena" # todo: NEW TRANSLATION
