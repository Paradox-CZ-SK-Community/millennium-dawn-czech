 MER_launch_corridor_investment_round_desc: "Silnější blok nemůže existovat pouze na papíře. Uvolněním nového kola financování koridorů krytého státní pokladnou můžeme urychlit integraci infrastruktury a sítí mezi současnými plnoprávnými členy MERCOSUR a zlepšit fyzickou páteř bloku." # todo: NEW TRANSLATION
