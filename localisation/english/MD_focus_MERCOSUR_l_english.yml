 MER_CHL_customs_system_modernization_desc: "Poskytnout finanční a technickou podporu potřebnou k modernizaci chilské celní správy pro plné přistoupení k MERCOSUR.$MER_full_membership_step_two_desc$" # todo: NEW TRANSLATION
