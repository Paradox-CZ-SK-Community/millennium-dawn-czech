 MER_unasul_member_tt: "Použít následující modifikátory na §YČlenský stát UNASUL§! pro všechny členské země." # todo: NEW TRANSLATION
 BRA_unasul_events_TT: "§YRozeslat pozvání všem členským státům MERCOSUR ke vstupu do UNASUL!§!" # todo: NEW TRANSLATION
 MER_expansion_unasul_TT: "§GOdemknout§! rozhodnutí pro pozvání jihoamerických zemí do §YUNASUL§!!" # todo: NEW TRANSLATION
 mercosur.110.t: "Přezkum demokratické klauzule MERCOSUR" # todo: NEW TRANSLATION
 mercosur.110.d: "To, co se odehrálo v [FROM.GetName], již nelze odmítat jako domácí záležitost s pouze domácím významem. Vážný politický obrat zpochybnil, zda v této zemi stále něco znamená otevřená soutěž a ústavní zdrženlivost. Ministři a diplomaté v celém bloku se otevřeně ptají, zda je demokratická klauzule MERCOSUR skutečným závazkem, nebo jen obřadným jazykem. Musíme rozhodnout, zda bude [FROM.GetName] pozastaveno členství, nebo zda blok tento obrat strpí v zájmu zachování jihoamerického trhu." # todo: NEW TRANSLATION
 mercosur.110.a: "Klauzule musí být uplatněna." # todo: NEW TRANSLATION
 mercosur.110.b: "Poskytnout poslední odklad." # todo: NEW TRANSLATION
 mercosur.112.t: "MERCOSUR pozastavuje náš status" # todo: NEW TRANSLATION
 mercosur.112.d: "Verdikt bloku dorazil a je jednoznačný. MERCOSUR rozhodl, že náš poslední kurz překročil hranici stanovenou jeho demokratickou klauzulí, a cenu nyní platíme svým místem v instituci. Jižní Amerika se k nám navždy neotočila zády, ale rozhodla se tento okamžik označit za takový, který nemohl zůstat bez odpovědi." # todo: NEW TRANSLATION
 mercosur.112.a: "Důsledky jsou skutečné." # todo: NEW TRANSLATION
 mercosur.113.t: "MERCOSUR poskytuje podmíněný odklad" # todo: NEW TRANSLATION
 mercosur.113.d: "MERCOSUR se rozhodl nepozastavit nám členství úplně, neposkytl nám však ani rozhřešení. Zůstáváme uvnitř bloku pod viditelným mrakem nedůvěry a každé hlavní město v regionu pochopí, že naše další místo na jihoamerickém trhu nyní spočívá na podmínce, nikoli na důvěře." # todo: NEW TRANSLATION
 mercosur.113.a: "Zůstáváme pod dohledem." # todo: NEW TRANSLATION
 mercosur.114.t: "MERCOSUR pozastavuje členství" # todo: NEW TRANSLATION
 mercosur.114.d: "Po vážném politickém obratu v [FROM.GetName] debata uvnitř MERCOSUR skončila tvrdým rozhodnutím. Blok uplatnil svou demokratickou klauzuli a pozastavil postavení [FROM.GetName], čímž dává najevo, že jihoamerický trh je stále ochoten bránit politické podmínky, na nichž tvrdí, že spočívá." # todo: NEW TRANSLATION
 mercosur.114.a: "Blok vytyčuje hranici." # todo: NEW TRANSLATION
 mercosur.115.t: "MERCOSUR nechává dveře pootevřené" # todo: NEW TRANSLATION
 mercosur.115.d: "Po vážném politickém posunu v [FROM.GetName] se MERCOSUR zdržel pozastavení členství, toto rozhodnutí však nebylo žádným schválením. Blok se prozatím rozhodl zachovat jednotu a zároveň [FROM.GetName] vystavit viditelnému varování, aby otázka demokratické legitimity nadále vrhala stín na jeho místo v instituci." # todo: NEW TRANSLATION
 mercosur.115.a: "Těsný odklad." # todo: NEW TRANSLATION
 mercosur.117.t: "Přezkum demokratické klauzule UNASUL" # todo: NEW TRANSLATION
 mercosur.117.d: "Nejnovější vývoj v [FROM.GetName] se rozšířil daleko za hranice vnitřního sporu jednoho hlavního města. Vážný politický obrat vyvolal na celém kontinentu pochybnosti, zda je demokratický život v této zemi omezován silou či záměrem. V rámci UNASUL nyní stojí otázka, zda byla organizace vytvořena k obraně demokratických závazků, nebo zda o nich pouze mluví, když se jí to hodí. Musíme zvolit, zda má být [FROM.GetName] z jihoamerického rámce pozastaveno, nebo zda projektu více prospěje jeho ponechání uvnitř pod varováním." # todo: NEW TRANSLATION
 mercosur.117.a: "Pozastavit jejich členství v rámci." # todo: NEW TRANSLATION
 mercosur.117.b: "Ponechat je uvnitř, ale pod sankcí." # todo: NEW TRANSLATION
 mercosur.119.t: "UNASUL pozastavuje náš status" # todo: NEW TRANSLATION
 mercosur.119.d: "UNASUL vynesl svůj verdikt a poselství znamená spíše odstup než solidaritu. Organizace dospěla k závěru, že náš nedávný kurz nelze smířit s její demokratickou klauzulí, a naše místo v jihoamerickém rámci bylo odpovídajícím způsobem pozastaveno. To, co mělo symbolizovat kontinentální sbližování, se místo toho stalo připomínkou, že regionální legitimita má stále své meze." # todo: NEW TRANSLATION
 mercosur.119.a: "Úder dopadl." # todo: NEW TRANSLATION
 mercosur.120.t: "UNASUL nás ponechává ve zkušební době" # todo: NEW TRANSLATION
 mercosur.120.d: "UNASUL se rozhodl nepozastavit nám členství úplně, toto rozhodnutí však nabízí jen malou útěchu. V rámci zůstáváme pouze pod viditelnou sankcí a hlavní města Jižní Ameriky toto rozhodnutí pochopí jako varování, že naše místo v projektu je nyní podmíněné, nikoli založené na důvěře." # todo: NEW TRANSLATION
 mercosur.120.a: "Pobyt, nikoli zproštění viny." # todo: NEW TRANSLATION
 mercosur.121.t: "UNASUL pozastavuje členství" # todo: NEW TRANSLATION
 mercosur.121.d: "Po přezkoumání vážného politického obratu v [FROM.GetName] se UNASUL rozhodl uplatnit svou demokratickou klauzuli a pozastavit postavení této země v organizaci. Rozhodnutí zdůrazňuje, že jihoamerická jednota se stále hlásí k politickému základu a že některá porušení jsou natolik závažná, že je nutné je otevřeně řešit." # todo: NEW TRANSLATION
 mercosur.121.a: "Rámec se upevňuje." # todo: NEW TRANSLATION
 mercosur.122.t: "UNASUL poskytuje odklad" # todo: NEW TRANSLATION
 mercosur.122.d: "Po vážném politickém obratu v [FROM.GetName] se UNASUL rozhodl zemi prozatím nepozastavit. Výsledek však zdaleka nepředstavuje čisté schválení: organizace zvolila jednotu namísto roztržky a zároveň jasně uvedla, že místo [FROM.GetName] v jihoamerickém projektu zůstane předmětem podezření." # todo: NEW TRANSLATION
 mercosur.122.a: "Varování trvá." # todo: NEW TRANSLATION
 MER_democratic_clause_warning_tt: "§YPokud jsme členem MERCOSUR nebo UNASUL, tento krok může vyvolat přezkum podle jejich demokratických klauzulí a ohrozit naše členství.§!" # todo: NEW TRANSLATION
