l_english:
 charoenchai_hinthao: "Charoenchai Hinthao" # todo: NEW TRANSLATION
 charoenchai_hinthao_desc: "Velitel Královské thajské armády generace 20. let 21. století, který si vybudoval pověst na obranné doktríně a tvrdých lekcích z jižní hranice. Cvičí své jednotky, aby držely pozice a útočníka vykrvácely." # todo: NEW TRANSLATION
 songwit_noonpakdee: "Songwit Noonpakdee" # todo: NEW TRANSLATION
 songwit_noonpakdee_desc: "Vysoce postavený důstojník Královské thajské armády známý spíše štábní prací a organizací než okázalostí. Udržuje jednotky armády v plných stavech, zásobuje je a udržuje připravené; zároveň se dobře orientuje v politice spojené s vrchním velením." # todo: NEW TRANSLATION
 adung_phaniam: "Adung Phan-iam" # todo: NEW TRANSLATION
 adung_phaniam_desc: "Vlajkový důstojník moderního loďstva Královského thajského námořnictva, který se cítí jako doma mezi velkými válečnými loděmi a v doktríně hladinových operací. Prosazuje námořnictvo, jehož síla bude znát i za hranicemi Thajského zálivu." # todo: NEW TRANSLATION
 punpakdee_pattanakul: "Punpakdee Pattanakul" # todo: NEW TRANSLATION
 punpakdee_pattanakul_desc: "Důstojník Královského thajského letectva z reformní generace, který tlačí letectvo k profesionálním standardům, moderním letounům a výcvikovému systému, jenž produkuje letecké posádky místo přehlídkových útvarů." # todo: NEW TRANSLATION
 intel_chief_nia: "Ředitel Národní zpravodajské agentury" # todo: NEW TRANSLATION
 intel_chief_nia_desc: "Šéf thajské Národní zpravodajské agentury řídí civilní zpravodajské úsilí země a propojuje hlášení z provincií, hranic a palácové sítě do jediného obrazu pro vládu." # todo: NEW TRANSLATION
 thailand_focus: "Thajský strom zaměření" # todo: NEW TRANSLATION
 SIA_the_2001_election_shortcut: "Volby v roce 2001" # todo: NEW TRANSLATION
 SIA_lost_territories_shortcut: "Ztracená území" # todo: NEW TRANSLATION
 SIA_armed_forces_modernization_shortcut: "Modernizace ozbrojených sil" # todo: NEW TRANSLATION
 SIA_recover_from_97_crisis_shortcut: "Krize Tom Yum Kung" # todo: NEW TRANSLATION
 SIA_asean_centrality_shortcut: "Ústřední postavení ASEAN" # todo: NEW TRANSLATION
 SIA_the_southern_question_shortcut: "Jižní otázka" # todo: NEW TRANSLATION
 SIA_kra_gateway_shortcut: "Kra jako brána" # todo: NEW TRANSLATION
 SIA_recover_from_97_crisis: "Obnova po krizi Tom Yum Kung" # todo: NEW TRANSLATION
 SIA_recover_from_97_crisis_desc: "V roce 1997 začala v Bangkoku krize Tom Yum Kung. Poté, co Thajsko vyčerpalo své devizové rezervy při obraně pevného kurzu bahtu, bylo nuceno měnu nechat plavat a přijmout pohotovostní dohodu s MMF. Tento balíček udržel zemi solventní, ovšem za cenu vtíravého dohledu a ztráty ekonomické důstojnosti. Zbývá poslední krok: dokončit obnovu, předčasně splatit Fond a znovu získat plnou suverenitu." # todo: NEW TRANSLATION
 SIA_the_1997_constitution: "Lidová ústava" # todo: NEW TRANSLATION
 SIA_the_1997_constitution_desc: "Ústava z roku 1997 vzniká za bezprecedentní účasti veřejnosti a slibuje volený Senát, záruky lidských práv a silné protikorupční orgány. Zda přežije thajskou politiku, je ovšem jiná otázka." # todo: NEW TRANSLATION
 SIA_repay_the_imf: "Předčasně splatit MMF" # todo: NEW TRANSLATION
 SIA_repay_the_imf_desc: "Thajsko v červenci 2003 splatilo poslední část pohotovostního úvěru, o dva roky dříve, než bylo plánováno. Předčasné splacení není tolik otázkou jistiny jako signálu. Trhy přestanou thajský dluh oceňovat jako riziko záchranného balíčku a Království si znovu půjčuje levně." # todo: NEW TRANSLATION
 SIA_amazing_thailand: "Úžasné Thajsko" # todo: NEW TRANSLATION
 SIA_amazing_thailand_desc: "Turistická kampaň, která nás provedla krizovými lety, se stává národní strategií. Od Phuketu po Chiang Mai zveme celý svět do Země úsměvů a svět platí tvrdou měnou." # todo: NEW TRANSLATION
 SIA_rice_and_rubber: "Rýžová mísa Asie" # todo: NEW TRANSLATION
 SIA_rice_and_rubber_desc: "Thajsko je předním světovým vývozcem rýže a gumárenskou velmocí. Modernizujme zemědělské hospodářství Isánu a jihu a přeměňme zemědělskou sílu v příjmy z vývozu." # todo: NEW TRANSLATION
 SIA_detroit_of_asia: "Detroit Asie" # todo: NEW TRANSLATION
 SIA_detroit_of_asia_desc: "Japonští a američtí výrobci automobilů učinili z východního pobřeží svou regionální tovární základnu. Posilme automobilový průmysl a udělejme z označení „vyrobeno v Thajsku“ globální standard." # todo: NEW TRANSLATION
 SIA_suvarnabhumi_airport: "Letiště Suvarnabhumi" # todo: NEW TRANSLATION
 SIA_suvarnabhumi_airport_desc: "Nové bangkokské letiště, plánované po desetiletí, se stane velkým leteckým uzlem jihovýchodní Asie. Provinční brány jako Phuket do něj přivádějí dopravu a pozvedají thajské letectví jako celek, pokud se nám podaří stavbu dokončit." # todo: NEW TRANSLATION
 SIA_eastern_economic_corridor: "Východní pobřeží" # todo: NEW TRANSLATION
 SIA_eastern_economic_corridor_desc: "Prohlubme průmyslový koridor od Chonburi po Rayong pomocí přístavů, rafinerií, továren a železnic. Strojovna thajské ekonomiky." # todo: NEW TRANSLATION
 SIA_medical_hub: "Asijské zdravotnické centrum" # todo: NEW TRANSLATION
 SIA_medical_hub_desc: "Nemocnice světové úrovně za ceny rozvojového světa. Zdravotní turistika přivádí pacienty i prestiž z celého světa." # todo: NEW TRANSLATION
 SIA_education_for_the_future: "Vzdělávání Království" # todo: NEW TRANSLATION
 SIA_education_for_the_future_desc: "Thajské učebny stále upřednostňují memorování před řešením problémů a kvalita učitelů se mezi Bangkokem a provinciemi výrazně liší. Moderní osnovy, lépe vyškolení učitelé a odborné obory odpovídající potřebám průmyslu jsou základem každého úsilí o přechod k vysokopříjmové ekonomice." # todo: NEW TRANSLATION
 SIA_asean_centrality: "Ústřední postavení ASEAN" # todo: NEW TRANSLATION
 SIA_asean_centrality_desc: "Bangkok byl místem založení ASEAN v roce 1967. Znovu investujme do sousedství, protože stabilní a přátelská jihovýchodní Asie je nejlepší bezpečnostní zárukou Thajska." # todo: NEW TRANSLATION
 SIA_treaty_ally: "Významný spojenec mimo NATO" # todo: NEW TRANSLATION
 SIA_treaty_ally_desc: "Nejstarší americké smluvní spojenectví v Asii. Prohlubme Cobra Gold, přivítejme americkou techniku a využívejme bezpečnostní záruky, dokud trvají." # todo: NEW TRANSLATION
 SIA_bamboo_bends_east: "Bambus se sklání na východ" # todo: NEW TRANSLATION
 SIA_bamboo_bends_east_desc: "Thajská diplomacie se sklání podle větru a ten vane z Pekingu. Čínské investice, čínské železnice, čínské trhy — vše za cenu, o níž se stále vyjednává." # todo: NEW TRANSLATION
 SIA_the_2001_election: "Volby v roce 2001" # todo: NEW TRANSLATION
 SIA_the_2001_election_desc: "První volby podle Lidové ústavy. Krize rozbila starý konsenzus. O směr národa nyní soupeří nové populistické síly, tradiční mocenská síť a Demokraté." # todo: NEW TRANSLATION
 SIA_thai_rak_thai: "Thai Rak Thai" # todo: NEW TRANSLATION
 SIA_thai_rak_thai_desc: "Thajci milují Thajce. Vítězství Thaksina Šinavatry překresluje volební mapu. O tom, kdo bude vládnout, nyní rozhoduje venkovský sever a severovýchod — a ty si zvolily svého šampiona." # todo: NEW TRANSLATION
 SIA_thaksinomics: "Thaksinonomika" # todo: NEW TRANSLATION
 SIA_thaksinomics_desc: "Dvoustopá ekonomika. První trať upřednostňuje globální vývoz a druhá místní a domácí podnikání. Tento přístup posiluje růst, kritici však tvrdí, že prohlubuje rozdíl mezi bohatými a chudými." # todo: NEW TRANSLATION
 SIA_30_baht_healthcare: "Zdravotnictví za 30 bahtů" # todo: NEW TRANSLATION
 SIA_30_baht_healthcare_desc: "Jakákoli nemoc, jakákoli nemocnice, třicet bahtů. Univerzální pokrytí mění životy milionů venkovských Thajců a upevňuje jejich loajalitu ke straně Šinavatry." # todo: NEW TRANSLATION
 SIA_village_fund: "Milionbahtový vesnický fond" # todo: NEW TRANSLATION
 SIA_village_fund_desc: "Milion bahtů revolvingového mikroúvěru pro každou vesnici a městskou komunitu v Království — jeden z největších mikrofinančních programů, o jaký se kdy kdo pokusil." # todo: NEW TRANSLATION
 SIA_otop: "Jeden tambon, jeden produkt" # todo: NEW TRANSLATION
 SIA_otop_desc: "Každý podokres vyvíjí, značkuje a vyváží charakteristický místní produkt. Domácí výroba se stává národní strategií." # todo: NEW TRANSLATION
 SIA_dual_track_economy: "Dvoustopá ekonomika" # todo: NEW TRANSLATION
 SIA_dual_track_economy_desc: "Vývoz roste, příjmy venkova rostou, dluh je splacen předčasně. Ať už kritici říkají o způsobu provedení cokoli, výsledková tabule hraje ve prospěch vlády." # todo: NEW TRANSLATION
 SIA_war_on_drugs: "Válka proti drogám" # todo: NEW TRANSLATION
 SIA_war_on_drugs_desc: "Tříměsíční kampaň s cílem rozbít obchod s metamfetaminem. Bude populární. Zároveň přitáhne vážnou pozornost ochránců lidských práv, která bude vládu pronásledovat po celé roky." # todo: NEW TRANSLATION
 SIA_ceo_premier: "Premiér jako generální ředitel" # todo: NEW TRANSLATION
 SIA_ceo_premier_desc: "Řídit zemi jako společnost. Klíčové ukazatele výkonnosti pro ministerstva, zasedání vlády v provinciích, netrpělivost s byrokracií. Efektivní, ale rozkladné pro každou instituci, jejímž úkolem je říkat ne." # todo: NEW TRANSLATION
 SIA_dominant_party_state: "Jedna strana, jedno Thajsko" # todo: NEW TRANSLATION
 SIA_dominant_party_state_desc: "Pohlcujme koaliční partnery, ovládněme vysílání, vyhrajme každé doplňovací volby. Volební politika pokračuje, ale existuje jen jedna naprosto převládající volba." # todo: NEW TRANSLATION
 SIA_consolidate_democracy: "Upevnit demokracii" # todo: NEW TRANSLATION
 SIA_consolidate_democracy_desc: "Získejme moc prostřednictvím hlasovacích lístků, udržme si ji výsledky a ponechme instituce stát. Populistický stroj se podřizuje Lidové ústavě." # todo: NEW TRANSLATION
 SIA_normalization_friction: "Tření při normalizaci" # todo: NEW TRANSLATION
 SIA_normalization_friction_desc: "Klientelistické sítě starého stroje se nerozpustí podle plánu. Odmítají deregistraci, i když se strana vydává přímou cestou." # todo: NEW TRANSLATION
 SIA_thaksin_forever: "Thaksin navždy" # todo: NEW TRANSLATION
 SIA_thaksin_forever_desc: "Opozice je bezvýznamná, soudy jsou koupené a Senát loajální. Proč by měl tento projekt někdy skončit? Dominantní strana se stává stranou trvalou." # todo: NEW TRANSLATION
 SIA_shinawatra_dynasty: "Dynastie Šinavatrových" # todo: NEW TRANSLATION
 SIA_shinawatra_dynasty_desc: "Hnutí přežije každého jednotlivého vůdce. Tvář strany se může změnit na sestru či dceru, skutečná moc však stále patří Thaksinu Šinavatrovi a jeho lidem." # todo: NEW TRANSLATION
 SIA_the_old_order: "Síťová monarchie" # todo: NEW TRANSLATION
 SIA_the_old_order_desc: "Palác, armáda, soudnictví, byrokracie. To jsou instituce, které vedly Thajsko každou bouří. Sedm desetiletí otřesů nepřežily tím, že by nechaly volby rozhodovat o všem." # todo: NEW TRANSLATION
 SIA_privy_council: "Královská rada" # todo: NEW TRANSLATION
 SIA_privy_council_desc: "Královi poradci, penzionovaní generálové, soudci a státníci sedí v tichém středu sítě establishmentu. Posilme kanály, které obcházejí volenou vládu." # todo: NEW TRANSLATION
 SIA_sufficiency_economy: "Ekonomika soběstačnosti" # todo: NEW TRANSLATION
 SIA_sufficiency_economy_desc: "Královská rozvojová filozofie umírněnosti, odolnosti a imunity vůči otřesům. Promyšlený protipól populistickému růstu poháněnému dluhem." # todo: NEW TRANSLATION
 SIA_royal_guidance: "Královo slovo" # todo: NEW TRANSLATION
 SIA_royal_guidance_desc: "Každý prosinec král promlouvá a národ naslouchá. Narozeninový projev může vládě požehnat nebo jí tiše své požehnání odepřít — je to síla respektu, proti níž se žádný volební lístek ani ministr neodváží bojovat. Hlas trůnu stahuje zemi zpět z politického šílenství." # todo: NEW TRANSLATION
 SIA_three_pillars: "Národ, náboženství, král" # todo: NEW TRANSLATION
 SIA_three_pillars_desc: "Chat, Sasana, Phra Maha Kasat — tříbarevná vlajka proměněná v občanský katechismus. Mniši ve školách, král na každé zdi, národ jako jediné morální tělo. Je to mocné pojivo, s výjimkou míst, kde jsou mešity plné a katechismus působí jako zavřené dveře." # todo: NEW TRANSLATION
 SIA_yellow_shirts: "Shromáždění Lidové aliance" # todo: NEW TRANSLATION
 SIA_yellow_shirts_desc: "Lidová aliance pro demokracii zaplňuje ulice Bangkoku královskou žlutí a požaduje odstranění zvolené vlády. Městská střední třída si zvolila svou stranu." # todo: NEW TRANSLATION
 SIA_the_2006_coup: "Zářijový převrat" # todo: NEW TRANSLATION
 SIA_the_2006_coup_desc: "Zatímco je premiér v zahraničí, do Bangkoku vjíždějí tanky. Ústava je pozastavena a Rada pro demokratickou reformu přebírá kontrolu. Cyklus začíná znovu." # todo: NEW TRANSLATION
 SIA_guardian_of_the_nation: "Strážce národa" # todo: NEW TRANSLATION
 SIA_guardian_of_the_nation_desc: "Sebeobraz armády proměněný v doktrínu. Nad politikou, přesto oprávněná ukončit jakoukoli politiku, která ohrožuje národ. Institucionalizujme vojenské veto." # todo: NEW TRANSLATION
 SIA_judicial_activism: "Judicializace" # todo: NEW TRANSLATION
 SIA_judicial_activism_desc: "Proč posílat tanky, když postačí soudní rozhodnutí? Rozpouštění stran a zbavování funkcí se stává skalpelem establishmentu." # todo: NEW TRANSLATION
 SIA_the_2014_coup: "Národní rada pro mír a pořádek" # todo: NEW TRANSLATION
 SIA_the_2014_coup_desc: "Nejprve stanné právo, potom převrat. Národní rada pro mír a pořádek pozastavuje politiku na neurčito — náprava postojů pro celou zemi." # todo: NEW TRANSLATION
 SIA_lese_majeste_enforcement: "Bránit posvátnou instituci" # todo: NEW TRANSLATION
 SIA_lese_majeste_enforcement_desc: "Článek 112 trestního zákoníku chrání monarchii před urážkami. Vymáhejme jej bez omezení a sledujme, jak každé opoziční hnutí váží svá slova." # todo: NEW TRANSLATION
 SIA_isoc_state: "Stát ISOC" # todo: NEW TRANSLATION
 SIA_isoc_state_desc: "Velitelství operací vnitřní bezpečnosti, politické rameno armády v každé provincii, se stává paralelní vládou pro otázky „bezpečnosti“, především na hlubokém jihu." # todo: NEW TRANSLATION
 SIA_isoc_overreach_backlash: "Tichý veřejný neklid" # todo: NEW TRANSLATION
 SIA_isoc_overreach_backlash_desc: "Aparát vnitřní bezpečnosti zasahuje do každodenního života dál než jen na hlubokém jihu. Obyčejní Thajci si toho začínají všímat a příliš se jim to nelíbí." # todo: NEW TRANSLATION
 SIA_the_2017_constitution: "Řízená demokracie" # todo: NEW TRANSLATION
 SIA_the_2017_constitution_desc: "Plně jmenovaný Senát, ustanovení umožňující nevoleného premiéra a dvacetiletá národní strategie zavazující budoucí vlády. Volby se vrátí, ale uvnitř klece." # todo: NEW TRANSLATION
 SIA_perpetual_guardianship: "Trvalé opatrovnictví" # todo: NEW TRANSLATION
 SIA_perpetual_guardianship_desc: "Formalizujme to, co bylo vždy jen implicitní. Ozbrojené síly se stanou stálým ústavním rozhodčím. Stabilita, svého druhu, navždy." # todo: NEW TRANSLATION
 SIA_royal_restoration: "Obnova trůnu" # todo: NEW TRANSLATION
 SIA_royal_restoration_desc: "Zajděme dál než kterákoli vláda před námi. Shromážděme vlákna sítě a formálně je vložme do rukou paláce. Dynastie Chakri obnoví přímou správu říše." # todo: NEW TRANSLATION
 SIA_seeds_of_reform: "Semena reformy" # todo: NEW TRANSLATION
 SIA_seeds_of_reform_desc: "Mimo staré rozdělení na populisty a royalisty se shromažďuje třetí síla. Mladá, městská, online a unavená z převratů." # todo: NEW TRANSLATION
 SIA_future_forward: "Budoucnost vpřed" # todo: NEW TRANSLATION
 SIA_future_forward_desc: "Nová strana politiků, kteří kandidují poprvé, slibuje prolomit tento cyklus. Demilitarizovat, decentralizovat, demokratizovat. Establishment sahá po svých obvyklých nástrojích, ale cíl se pohybuje." # todo: NEW TRANSLATION
 SIA_three_demands: "Tři požadavky" # todo: NEW TRANSLATION
 SIA_three_demands_desc: "Rozpusťte parlament. Přestaňte zastrašovat lid a sepište novou ústavu. Studenti nahlas říkají to, co dříve nebylo možné vyslovit, a strop thajské politiky se posouvá." # todo: NEW TRANSLATION
 SIA_demilitarize_politics: "Vojáci pryč z politiky" # todo: NEW TRANSLATION
 SIA_demilitarize_politics_desc: "Ukončeme zneužívání branné povinnosti, omezme mediální říše a místa v představenstvech generálů a vyškrtněme armádu z politiky. Nebudou nám za to vděční." # todo: NEW TRANSLATION
 SIA_civilian_control: "Nadvláda civilistů" # todo: NEW TRANSLATION
 SIA_civilian_control_desc: "Ministerstvo obrany vedené civilisty, povýšení přezkoumávaná parlamentem a vojenský rozpočet podléhající auditorům. Radikální pouze v Bangkoku." # todo: NEW TRANSLATION
 SIA_amend_section_112: "Pozměnit článek 112" # todo: NEW TRANSLATION
 SIA_amend_section_112_desc: "Reformujme zákon o urážce majestátu. Omezme, kdo může podávat stížnosti, zastropujme tresty a ukončeme jeho používání proti politickému projevu. Považován za nejnebezpečnější návrh zákona v Thajsku, možná neexistuje cesta vpřed ani cesta zpět." # todo: NEW TRANSLATION
 SIA_decentralize: "Za hranice Bangkoku" # todo: NEW TRANSLATION
 SIA_decentralize_desc: "Volení guvernéři pro každou provincii a rozpočty, které neprocházejí hlavním městem. Bangkok byl celou zemí příliš dlouho." # todo: NEW TRANSLATION
 SIA_break_the_monopolies: "Rozbít monopoly" # todo: NEW TRANSLATION
 SIA_break_the_monopolies_desc: "Duopoly v oblasti alkoholu, telekomunikační koncese, křížové vlastnictví konglomerátů. Otevřme úzká hrdla thajské ekonomiky a pusťme dovnitř spravedlivou konkurenci." # todo: NEW TRANSLATION
 SIA_welfare_state: "Thajský sociální stát" # todo: NEW TRANSLATION
 SIA_welfare_state_desc: "Od směsice dotací ke skutečné záchranné síti důchodů, péče o děti a pojištění v nezaměstnanosti. Drahé — a žádná vláda po této se neodváží systém zrušit." # todo: NEW TRANSLATION
 SIA_marriage_equality: "První v jihovýchodní Asii" # todo: NEW TRANSLATION
 SIA_marriage_equality_desc: "Rovnost v manželství se stává zákonem, jako první v jihovýchodní Asii. Reforma, které si všimne celý svět, a vzácná věc, proti níž establishment nebojuje." # todo: NEW TRANSLATION
 SIA_deep_south_peace: "Mír na hlubokém jihu" # todo: NEW TRANSLATION
 SIA_deep_south_peace_desc: "Autonomie v rámci Království, spravedlnost za minulé zneužívání, respekt k identitě Patani-Malajců. Povstání skončí u vyjednávacího stolu, ne na kontrolním stanovišti." # todo: NEW TRANSLATION
 SIA_consolidated_democracy: "Upevněná demokracie" # todo: NEW TRANSLATION
 SIA_consolidated_democracy_desc: "Ústava sepsaná občany, vojáci v kasárnách, soudy, které soudí a nevládnou. Cyklus převratů je prolomen a konečně učiněn nemyslitelným." # todo: NEW TRANSLATION
 SIA_reform_transition_costs: "Daňová základna v přechodu" # todo: NEW TRANSLATION
 SIA_reform_transition_costs_desc: "Přebudování institucí znamená přebudování způsobu jejich financování. Výběr příjmů zaostává za novým systémem, než se usadí." # todo: NEW TRANSLATION
 SIA_a_new_republic: "Nová republika" # todo: NEW TRANSLATION
 SIA_a_new_republic_desc: "Otázka, kterou nikdy nebylo dovoleno položit, je předložena k hlasování. Ať už bude výsledek jakýkoli, Thajsko, které se vynoří, bude k nepoznání — pokud vůbec zůstane pohromadě." # todo: NEW TRANSLATION
 SIA_lost_territories: "Ztracená území" # todo: NEW TRANSLATION
 SIA_lost_territories_desc: "1893. 1904. 1907. 1909. Každé thajské dítě se ve škole učí data, kdy Siam rozparcelovaly Francie a Británie. Phibunova generace kdysi pochodovala, aby je získala zpět. Mapy jsou stále v archivech." # todo: NEW TRANSLATION
 SIA_pan_thai_movement: "Jedna tajská rasa" # todo: NEW TRANSLATION
 SIA_pan_thai_movement_desc: "Obnovme velkou tezi Wichita Wathakana. Thajci, Laosané, Šanové — jeden tajský lid rozdělený koloniálními hranicemi, čekající na sjednocení pod thajskou vlajkou." # todo: NEW TRANSLATION
 SIA_rearmament: "Přezbrojit Království" # todo: NEW TRANSLATION
 SIA_rearmament_desc: "Ambice vyžaduje ocel. Zvyšte rozpočet na obranu nad cokoli, co auditoři kdy viděli, a uveďte průmysl Království na válečnou základnu." # todo: NEW TRANSLATION
 SIA_modernize_the_rta: "Modernizovat Královskou thajskou armádu" # todo: NEW TRANSLATION
 SIA_modernize_the_rta_desc: "Nové hlavní bojové tanky, nová bojová vozidla pěchoty, profesionální vojáci namísto branců vybraných loterií. Královská thajská armáda se připravuje na války přesahující povinnost provádět převraty." # todo: NEW TRANSLATION
 SIA_blue_water_navy: "Námořnictvo dvou oceánů" # todo: NEW TRANSLATION
 SIA_blue_water_navy_desc: "Letadlová loď Chakri Naruebet konečně dostane skutečné letecké křídlo a skutečný doprovod a program ponorek přestane být terčem vtipů. Dvě pobřeží, dvě loďstva." # todo: NEW TRANSLATION
 SIA_gripen_squadrons_rearm: "Mír Suvarnabhumi" # todo: NEW TRANSLATION
 SIA_gripen_squadrons_rearm_desc: "Gripeny, letouny včasné výstrahy, síťově propojená protivzdušná obrana. Malé letectvo vybudované tak, aby vyhrálo první týden regionální války." # todo: NEW TRANSLATION
 SIA_dti_self_reliance: "Soběstačnost DTI" # todo: NEW TRANSLATION
 SIA_dti_self_reliance_desc: "Ústav obranných technologií přechází od výzkumných prací k výrobním linkám. Thajské pušky, thajské obrněnce, thajské rakety — a žádné embargo nezastaví to, co si vyrobíme sami." # todo: NEW TRANSLATION
 SIA_thai_yai: "Naši bratři Tai Yai" # todo: NEW TRANSLATION
 SIA_thai_yai_desc: "Šanové z Barmy mluví jazykem, kterému každý Thajec rozumí. Jejich milice bojují proti Rangúnu po celé generace. Chybí jim pouze patron a vlajka, pod níž by bojovali." # todo: NEW TRANSLATION
 SIA_mekong_destiny: "Osud na Mekongu" # todo: NEW TRANSLATION
 SIA_mekong_destiny_desc: "Sainyabuli a Champasak byly ještě v živé paměti siamské a Laosané jsou nejbližšími příbuznými Thajců. Řeka, která nás rozděluje, by mohla protékat jedinou zemí." # todo: NEW TRANSLATION
 SIA_preah_vihear: "Chrám patří nám" # todo: NEW TRANSLATION
 SIA_preah_vihear_desc: "Rozhodnutí Mezinárodního soudního dvora o Preah Vihear z roku 1962 stále pálí. Battambang a Siem Reap byly ještě v živé paměti pod thajskou vlajkou. Hraniční spory s Phnompenhem přestávají být řízeny a začínají být využívány." # todo: NEW TRANSLATION
 SIA_lost_sultanates: "Smlouva z roku 1909 je neplatná" # todo: NEW TRANSLATION
 SIA_lost_sultanates_desc: "Kelantan, Terengganu, Kedah, Perlis. Vazalská území Bangkoku byla postoupena Britskému impériu, aniž by se kdokoli z jejich obyvatel mohl vyjádřit. Odsuďte anglo-siamskou smlouvu." # todo: NEW TRANSLATION
 SIA_suwannaphum: "Sjednocená Suwannaphum" # todo: NEW TRANSLATION
 SIA_suwannaphum_desc: "Suwannaphum, Zlatá země dávnověku, je znovu sjednocena pod thajskou vlajkou. Zahajte začleňování znovuzískaných území do Království." # todo: NEW TRANSLATION
 SIA_victory_monument: "Nový Památník vítězství" # todo: NEW TRANSLATION
 SIA_victory_monument_desc: "Obelisk na ulici Ratchawithi uctívá padlé z let 1940–41, poslední války o ztracená území. Postavte jeho nástupce a nechte region, aby si vyvodil vlastní závěry." # todo: NEW TRANSLATION
 SIA_thailand_4_0: "Thajsko 4.0" # todo: NEW TRANSLATION
 SIA_thailand_4_0_desc: "Přidaná hodnota ve všem. Robotika, biotechnologie, digitální služby. Čtvrtá průmyslová revoluce plánovaná z vládního paláce a ověřená ve Východním ekonomickém koridoru. Každá provincie získá podíl na růstu produktivity díky zavedení národní strategie." # todo: NEW TRANSLATION
 SIA_three_airport_rail: "Železnice spojující tři letiště" # todo: NEW TRANSLATION
 SIA_three_airport_rail_desc: "Don Mueang, Suvarnabhumi a U-Tapao, všechna propojená jedinou vysokorychlostní tratí, která urazí celou trasu za hodinu. Jde o nejdražší železnici v thajských dějinách a páteř EEC." # todo: NEW TRANSLATION
 SIA_u_tapao_aerotropolis: "Aerotropolie U-Tapao" # todo: NEW TRANSLATION
 SIA_u_tapao_aerotropolis_desc: "Námořní letiště z období války ve Vietnamu se promění v bránu pro 60 milionů cestujících, s údržbářskými hangáry, bezcelní zónou a prosperujícím městem vybudovaným kolem existence ranveje." # todo: NEW TRANSLATION
 SIA_eastern_aviation_city: "Východní letecké město" # todo: NEW TRANSLATION
 SIA_eastern_aviation_city_desc: "Ranvej byla teprve začátek. Airbus a Thai Airways vloží do bezcelní zóny komplex pro údržbu a generální opravy, letecká akademie vyškolí mechaniky a nákladní terminály promění U-Tapao v leteckou dílnu regionu stejně jako v jeho bránu. Práce s vysokou přidanou hodnotou, ale náročná na zajištění dostatku pracovníků." # todo: NEW TRANSLATION
 SIA_eec_take_off: "Koridor startuje" # todo: NEW TRANSLATION
 SIA_eec_take_off_desc: "Továrny na elektromobily v Rayongu, biotechnologie v Chonburi, avionika v Chachoengsao. Východní ekonomický koridor přestává být plánem a stává se regionem." # todo: NEW TRANSLATION
 SIA_hedge_the_bets: "Pojistit si všechny možnosti" # todo: NEW TRANSLATION
 SIA_hedge_the_bets_desc: "Bambus se ohýbá ve větru a pak se narovná. Ať už si Washington nebo Peking myslí, že Thajsko něco slíbilo, Thajsko neslíbilo nic, co by nemohlo později vyložit jinak." # todo: NEW TRANSLATION
 SIA_armed_forces_modernization: "Thajské královské ozbrojené síly" # todo: NEW TRANSLATION
 SIA_armed_forces_modernization_desc: "Armáda, námořnictvo a letectvo pod jednou korunou, meč a štít Království. Krize z roku 1997 zmrazila nákupy uprostřed procesu a zanechala po sobě napůl dodané letky a letadlovou loď bez letadel. Uchopme ozbrojené síly pevně do rukou a určeme směr, kterým se budou ubírat příští desetiletí." # todo: NEW TRANSLATION
 SIA_gripen_deal: "Dohoda o Gripenech" # todo: NEW TRANSLATION
 SIA_gripen_deal_desc: "Saab nabízí to, co Washington ne. Součástí balíčku je úplný převod technologií, průmyslové kompenzace a letoun včasné výstrahy Erieye, navíc bez přednášek o převratech." # todo: NEW TRANSLATION
 SIA_gripen_ef_program: "Gripen E/F" # todo: NEW TRANSLATION
 SIA_gripen_ef_program_desc: "F-35 byl odmítnut a F-16 jsou starší než jejich piloti. Gripen E/F nové generace zachová ekosystém, který thajské posádky již znají, a udrží švédskou výrobní linku v chodu." # todo: NEW TRANSLATION
 SIA_eyes_in_the_sky: "Oči na obloze" # todo: NEW TRANSLATION
 SIA_eyes_in_the_sky_desc: "Izraelské bezpilotní systémy Searcher, Hermes a Dominator poskytnou thajským velitelům to, co jim džungle a hranice vždy upíraly. Trvalý dohled." # todo: NEW TRANSLATION
 SIA_chinese_steel: "Čínská ocel" # todo: NEW TRANSLATION
 SIA_chinese_steel_desc: "VT-4 od NORINCO stojí polovinu toho, co západní tank, a přichází bez kázání o koncovém uživateli. Americké M60 thajské armády stárnou a její dodavatelé se přesouvají na východ." # todo: NEW TRANSLATION
 SIA_s26t_program: "Ponorka S26T" # todo: NEW TRANSLATION
 SIA_s26t_program_desc: "Byly slíbeny tři čluny třídy Yuan. Možná dorazí jeden. Mezi německými motory, které nelze vyvézt, a rozpočty, jež nelze obhájit, ponorkový sen námořnictva pokouší trpělivost všech." # todo: NEW TRANSLATION
 SIA_chakri_modernization: "Západní modernizace vlajkové lodi" # todo: NEW TRANSLATION
 SIA_chakri_modernization_desc: "Západní cesta pokračuje na palubě vlajkové lodi. HTMS Chakri Naruebet, postavená ve Španělsku a dlouho kotvící v Sattahipu, dostane americké a evropské bojové systémy a senzory. Přestavba podle standardů NATO konečně poskytne královské letadlové lodi úkol hodný její posádky." # todo: NEW TRANSLATION
 SIA_uxv_carrier_conversion: "Západní bezpilotní křídlo" # todo: NEW TRANSLATION
 SIA_uxv_carrier_conversion_desc: "Harriery jsou muzejní exponáty, ale skokanský můstek zůstává. Pomocí západních bezpilotních systémů zakoupených od spojeneckých výrobců přestavíme vlajkovou loď tak, aby vypouštěla bezpilotní letouny, hladinová plavidla a podvodní prostředky. První nosič UXV v jihovýchodní Asii, vybavený technikou partnerů." # todo: NEW TRANSLATION
 SIA_telecom_empire: "Telekomunikační koncese" # todo: NEW TRANSLATION
 SIA_telecom_empire_desc: "Satelity, mobilní sítě a mediální impérium, to vše pozoruhodně prosperuje pod vládou telekomunikačních magnátů. Hranice mezi národním šampionem a rodinným podnikem nikdy nebyla tenčí." # todo: NEW TRANSLATION
 SIA_prayuth_premiership: "Generálovo premiérství" # todo: NEW TRANSLATION
 SIA_prayuth_premiership_desc: "Vůdce převratu vymění uniformu za oblek a titul junty za volenou funkci. 250 jmenovaných senátorů, kteří hlasují o premiérovi, činí aritmetiku pohodlnou." # todo: NEW TRANSLATION
 SIA_senate_of_appointees: "Senát jmenovaných" # todo: NEW TRANSLATION
 SIA_senate_of_appointees_desc: "Dvě stě padesát senátorů, každý vybraný vojenskou radou, každý s hlasem o tom, kdo bude vládnout. Opozice může vyhrát volby. Získat moc je něco jiného." # todo: NEW TRANSLATION
 SIA_2020_protest_response: "Mládež v ulicích" # todo: NEW TRANSLATION
 SIA_2020_protest_response_desc: "Studenti zaplavují památníky se třemi požadavky a pozdravem se třemi prsty. Každá možnost, ať už rozehnání, dialog nebo odklad, naučí další generaci něco o státu." # todo: NEW TRANSLATION
 SIA_orange_wave: "Oranžová vlna" # todo: NEW TRANSLATION
 SIA_orange_wave_desc: "Nová politická generace se organizuje online, financuje se z drobných darů a na staré klientelistické sítě pohlíží jako na problém, který je třeba odstranit, nikoli zdědit." # todo: NEW TRANSLATION
 SIA_digital_democracy: "Digitální demokracie" # todo: NEW TRANSLATION
 SIA_digital_democracy_desc: "Otevřená data, online služby, stát, který odpovídá na e-maily. Transparentnost jako infrastruktura, a infrastrukturu na rozdíl od slibů nelze snadno zrušit." # todo: NEW TRANSLATION
 SIA_creative_economy: "Kreativní ekonomika" # todo: NEW TRANSLATION
 SIA_creative_economy_desc: "Film, jídlo, festivaly, design. Thajská měkká síla se stává vývozním odvětvím s pozorností ministerstva a vlastní položkou v rozvaze." # todo: NEW TRANSLATION
 SIA_truth_and_reconciliation: "Pravda a usmíření" # todo: NEW TRANSLATION
 SIA_truth_and_reconciliation_desc: "Mrtví z války proti drogám, represe, zmizelí z hlubokého jihu. Komise s pravomocí předvolávat svědky sepíše oficiální zprávu, protože demokracie si vede vlastní záznamy." # todo: NEW TRANSLATION
 SIA_the_2005_landslide: "Vítězství se 377 mandáty" # todo: NEW TRANSLATION
 SIA_the_2005_landslide_desc: "Thai Rak Thai získává 377 z 500 parlamentních křesel, největší většinu jedné strany v thajských dějinách. Síť starého establishmentu mlčky sleduje sčítání hlasů." # todo: NEW TRANSLATION
 SIA_rice_pledging_scheme: "Program výkupu rýže" # todo: NEW TRANSLATION
 SIA_rice_pledging_scheme_desc: "Vlajkový venkovský program vlády Yingluck nechává stát vykupovat rýži od zemědělců za ceny nad úrovní trhu a skladovat ji. Vesnice profitují. Státní pokladna závisí na spolupráci světových cen." # todo: NEW TRANSLATION
 SIA_red_shirts_mobilized: "Ulice za volební urnou" # todo: NEW TRANSLATION
 SIA_red_shirts_mobilized_desc: "Vyveďme venkovskou základnu do ulic. Sítě rudých košil napříč severovýchodem pochodují ve statisících, ale populistický dav plnící hlavní město generály nezastraší. Znepokojí palác i vrchní velení a poskytne jim záminku. Konfrontace, která skončí tanky před vládní budovou, se blíží. §RCoup risk rises.§!" # todo: NEW TRANSLATION
 SIA_heartland_development: "Rozvoj rudého srdce země" # todo: NEW TRANSLATION
 SIA_heartland_development_desc: "Vesnice Isaanu a severu přinesly drtivé vítězství a nyní za něj dostávají politiku. Nové silnice a železnice se táhnou přes plošinu Khorat i do údolí Chiang Mai a provinční úřady přinášejí správu i pracovní místa tam, kde skutečně žije základna hnutí, nikoli do hlavního města, které pro něj nikdy nehlasovalo." # todo: NEW TRANSLATION
 SIA_crown_property_bureau: "Úřad královského majetku" # todo: NEW TRANSLATION
 SIA_crown_property_bureau_desc: "Úřad spravuje miliardy v královském majetku, od hotelů přes nemovitosti až po významné průmyslové podíly. Uvést tyto výnosy do služeb národního rozvoje vyžaduje tichá jednání na nejvyšší úrovni." # todo: NEW TRANSLATION
 SIA_eastern_tigers: "Východní tygři" # todo: NEW TRANSLATION
 SIA_eastern_tigers_desc: "2. armádní oblast a obrněné jednotky, Burapha Phayak, Tygři východu. Jejich loajalita je šlachou royalistického státu a jejich velitelé představují další generaci generálů." # todo: NEW TRANSLATION
 SIA_buddhist_nationalism: "Buddhistický národ" # todo: NEW TRANSLATION
 SIA_buddhist_nationalism_desc: "Junta přijímá mnichy jako partnery společenského řádu. Šafránová roucha při státních obřadech, buddhismus ve školních osnovách a tiché povýšení Sanghy na morální autoritu. Hluboký jih to nepřijme tiše." # todo: NEW TRANSLATION
 SIA_royal_succession_managed: "Předání vlády" # todo: NEW TRANSLATION
 SIA_royal_succession_managed_desc: "Palác a vláda připravují přechod několik let dopředu, jako institucionální předání namísto šoku. Když Devátá vláda skončí, barami přejde neporušená, místo aby se zhroutila do své nejslabší podoby, období smutku se zkrátí a monarchistický establishment se sjednotí za novým trůnem. Řízený přechod stojí méně než alternativa." # todo: NEW TRANSLATION
 SIA_conscription_abolished: "Profesionální armáda" # todo: NEW TRANSLATION
 SIA_conscription_abolished_desc: "Ukončete povinnou vojenskou službu. Dobrovolnické síly budou menší, lépe placené a lépe vycvičené a svou loajalitu budou dlužit Ústavě, nikoli generálům, kteří je odvedli." # todo: NEW TRANSLATION
 SIA_open_skies_open_borders: "Otevřené nebe, otevřené hranice" # todo: NEW TRANSLATION
 SIA_open_skies_open_borders_desc: "Liberalizujte přistávací práva, zjednodušte vízová pravidla a nechte aerolinky soutěžit. Turisté, kteří přijedou, přinesou peníze, a pracovníci, kteří přijdou, přinesou dovednosti. Hranice je největším aktivem Thajska, přestaňme s ní proto zacházet jako s pevností." # todo: NEW TRANSLATION
 SIA_chao_phraya_megaprojects: "Protipovodňová ochrana Chao Phraya a zelená energie" # todo: NEW TRANSLATION
 SIA_chao_phraya_megaprojects_desc: "Řeka, která dvakrát zaplavila hlavní město, bude zkrocena retenčními nádržemi, protipovodňovými bariérami a řetězcem průtočných turbín. Projekt je drahý. Další velká povodeň nikoli." # todo: NEW TRANSLATION
 SIA_asean_customs_window: "Jednotné celní okno ASEAN" # todo: NEW TRANSLATION
 SIA_asean_customs_window_desc: "Harmonizujte celní deklarace, bezpečnostní osvědčení a rostlinolékařská pravidla napříč členskými státy sdružení. Kamion z Chiang Rai do Kuala Lumpur projede méně okénky než dříve." # todo: NEW TRANSLATION
 SIA_the_southern_question: "Jižní otázka" # todo: NEW TRANSLATION
 SIA_the_southern_question_desc: "Pattani, Yala a Narathiwat doutnají povstáním už celou generaci. Pálení mešit, stínání hlav a bomby u silnic zabily tisíce lidí a postavily malajsko-muslimský jih proti buddhistickému Bangkoku. Království už nemůže považovat hluboký jih za pouhou poznámku v policejních záznamech. Musí si zvolit, jak odpoví na požár na jihu. Podoba této odpovědi bude určena tím, kdo vládne v Bangkoku." # todo: NEW TRANSLATION
 SIA_kra_gateway: "Brána Kra" # todo: NEW TRANSLATION
 SIA_kra_gateway_desc: "Sto let starý sen se vrací na jednací stůl vlády, tentokrát však s rozvahou. Je ustavena komise proveditelnosti, geodeti jsou vysláni na šíji a v Songkhle je uvolněn první společný stavební pozemek. Zatím není nic závazné. Další otázkou je, kdo, pokud vůbec někdo, projekt zaplatí." # todo: NEW TRANSLATION
 SIA_kra_patron_china: "Financování Pásu a stezky" # todo: NEW TRANSLATION
 SIA_kra_patron_china_desc: "Nabídka Pekingu je zdaleka nejlevnější, s plným financováním BRI, čínskými inženýrskými týmy a kanálem na klíč postaveným v rekordním čase. Podmínky jsou nyní velkorysé a později obtížné. Dluh je denominován v jüanech, zástavou je samotný kanál a může přijít den, kdy Peking půjčku zesplatní." # todo: NEW TRANSLATION
 SIA_kra_patron_japan: "Kvalitní japonská infrastruktura" # todo: NEW TRANSLATION
 SIA_kra_patron_japan_desc: "JICA a konsorcium japonských megabank stavějí pomalu, draze a bezchybně. Žádná dluhová past, žádná skrytá nájemní klauzule, jen vyšší počáteční účet a partner, který očekává splacení v dobré vůli stejně jako v bahtech. Úcta Tokia k Bangkoku odpovídajícím způsobem roste." # todo: NEW TRANSLATION
 SIA_kra_patron_consortium: "Mezinárodní konsorcium" # todo: NEW TRANSLATION
 SIA_kra_patron_consortium_desc: "Mnohostranné konsorcium vedené ADB rozloží náklady a riziko mezi mnoho účastníků a trvá na pragmatickém pořadí, které inženýři vždy upřednostňovali. Nejprve etapový pozemní most, poté úplný průkop na úrovni moře. Žádný jediný věřitel nezíská kontrolu nad úžinou a Washington, Tokio i Manila si díky tomu oddechnou." # todo: NEW TRANSLATION
 SIA_kra_patron_solo: "Zvládnout to sami" # todo: NEW TRANSLATION
 SIA_kra_patron_solo_desc: "Žádný zahraniční věřitel, žádná cizí klauzule, žádná cizí vlajka u zdymadel. Království financuje kanál z vlastní pokladny a vlastního dluhopisového trhu a přijímá ohromující náklady jako cenu za absolutní suverenitu nad nejnovější strategickou vodní cestou." # todo: NEW TRANSLATION
 SIA_kra_debt_trap_warning_tt: "Financování Pásu a stezky je nyní levné, ale překročení stavebních nákladů otevře výchozí krizový řetězec §RPeking zesplatňuje půjčku§!." # todo: NEW TRANSLATION
 SIA_two_oceans_one_kingdom: "Dva oceány, jedno království" # todo: NEW TRANSLATION
 SIA_two_oceans_one_kingdom_desc: "Poslední hráz byla odstraněna. Slaná voda z Andamanského moře a Thajského zálivu se poprvé mísí na úrovni vrcholu průplavu. Thajsko již nekontroluje jediné pobřeží. Ovládá dvě." # todo: NEW TRANSLATION
 SIA_kra_militarize: "Pevnost na dvou mořích" # todo: NEW TRANSLATION
 SIA_kra_militarize_desc: "Kanál je příliš cenný na to, aby zůstal nechráněný. Pobřežní baterie, opevněná námořní základna a trvalý mandát pro kontrolu průjezdu promění vodní cestu v pevnost, kterou může královské thajské námořnictvo ubránit proti každému vetřelci. Svět si všimne děl a plátci mýtného budou reptat nad militarizací." # todo: NEW TRANSLATION
 SIA_kra_internationalize: "Kanál pro všechny národy" # todo: NEW TRANSLATION
 SIA_kra_internationalize_desc: "Prohlašme Krau za neutrální mezinárodní tranzitní režim, otevřený všem vlajkám za stejných podmínek a zaručený smlouvou. Thajsko se vzdá možnosti kanál uzavřít. Na oplátku získá dopravu, investice a tichou vděčnost každé námořní mocnosti, která se obávala úžiny v rukou jediného státu." # todo: NEW TRANSLATION
 SIA_gateway_of_asia: "Brána Asie" # todo: NEW TRANSLATION
 SIA_gateway_of_asia_desc: "Lodě Thajskem dříve jen proplouvaly. Nyní se zde zastavují. Dokončeme proměnu mezinárodními investicemi, hlubším přístavem na jihu a, pokud byla zvolena trasa kanálu, mandátem pro hlídkování, který zajistí bezpečnost úžiny pro všechny, kdo zaplatí mýtné." # todo: NEW TRANSLATION
 SIA_ghosts_of_the_jungle: "Duchové džungle" # todo: NEW TRANSLATION
 SIA_ghosts_of_the_jungle_desc: "Hluboko v kopcích Isaanu a na severních vysočinách kádry Komunistické strany Thajska nikdy skutečně nezmizely. Učili ve vesnických školách, organizovali odbory, pamatovali si. Nyní, když se země štěpí, stabilita se stává vzpomínkou a vláda mluví jen sama k sobě, jejich poselství nachází novou generaci připravenou naslouchat." # todo: NEW TRANSLATION
 SIA_isaan_soviets: "Isaanští sověti" # todo: NEW TRANSLATION
 SIA_isaan_soviets_desc: "Severovýchod je srdcem země, nejchudším regionem, politicky nejneklidnějším a tím, s nímž bangkokský establishment vždy zacházel jako s rezervoárem levné práce a levných hlasů. Vesnické výbory, odborové domy a družstevní rady se stávají organizační kostrou hnutí. Strana nežádá o loajalitu. Žádá lidi, aby si vládli sami, a sleduje, co se stane." # todo: NEW TRANSLATION
 SIA_general_strike: "Generální stávka" # todo: NEW TRANSLATION
 SIA_general_strike_desc: "Má-li být hnutí něč víc než venkovskou poznámkou pod čarou, musí zastavit města. Přístavní dělníci, tovární dělníci, řidiči autobusů i učitelé, všichni vyzváni ke stávce naráz. Sázka je úplná. Pokud vláda nebude dost dlouho schopná fungovat, buď kapitulovala, nebo vystupňuje konflikt. Střední cesta neexistuje." # todo: NEW TRANSLATION
 SIA_general_strike_tt: "Vyhlásí generální stávku a na 180 dní otevře rozhodnutí §YGenerální stávka§!.\n - Zvyšte dynamiku stávky na §Y100§! a vláda kapituluje, čímž se otevře mírová cesta k moci\n - Stávka stojí §R1 %§! stability za každý týden jejího trvání\n - Pokud 180 dní skončí s hodnotou pod 100, generálové stávku rozdrtí a převezmou moc převratem" # todo: NEW TRANSLATION
 SIA_people_seize_power: "Lid přebírá moc" # todo: NEW TRANSLATION
 SIA_people_seize_power_desc: "Stará vláda skončila. Ať padla v jednací místnosti, nebo před barikádou, výsledek je stejný. Komunistická strana Thajska přebírá vládní pravomoc. Nová vlajka zatím nevlaje, ale správní aparát je nyní v rukou lidí, kteří desítky let v džungli přemýšleli, jak jej využít." # todo: NEW TRANSLATION
 SIA_land_to_the_tiller: "Půda rolníkům" # todo: NEW TRANSLATION
 SIA_land_to_the_tiller_desc: "Velkostatky centrální nížiny, rýžová pole Isaanu, kaučukové plantáže jihu. Systém, který je vytvořil, skončil. Přerozdělení půdy, skutečné přerozdělení, nikoli vládní program končící s příští vládou, je zároveň příslibem hnutí i jeho nejnebezpečnějším činem. Rodiny, které tyto statky vlastnily, neodejdou všechny tiše." # todo: NEW TRANSLATION
 SIA_five_year_plan: "Pětiletý plán" # todo: NEW TRANSLATION
 SIA_five_year_plan_desc: "Trh přiděloval zdroje špatně. Stát je bude přidělovat záměrně. Továrny, ocel, chemikálie i obráběcí stroje, vše plánované z centra a vybudované prací mobilizovaného národa. Obchodní deficit se stává strukturálním přebytkem fyzického kapitálu. Cenou, viditelnou ve statistikách spotřebního zboží prvního roku, je izolace." # todo: NEW TRANSLATION
 SIA_red_chakri_dilemma: "Chakrijské dilema" # todo: NEW TRANSLATION
 SIA_red_chakri_dilemma_desc: "Jednu otázku, kterou vedení strany odkládalo tak dlouho, jak to šlo, už nelze odkládat. Jaké je ústavní postavení monarchie v komunistickém Thajsku? Historie nabízí dva precedenty. Ani jeden není pohodlný." # todo: NEW TRANSLATION
 SIA_positive_trade_relations: "Pozitivní obchodní vztahy" # todo: NEW TRANSLATION
 SIA_nuclear_proliferation_concern: "Thajské obohacování uranu" # todo: NEW TRANSLATION
 SIA_nuclear_proliferation_tt: "§RKaždá země mimo naše aliance bude mít na thajský program obohacování trvalý názor.§!" # todo: NEW TRANSLATION
 SIA_tt_has_reclaimed: "Držíme znovuzískané území, které ještě nebylo integrováno" # todo: NEW TRANSLATION
 SIA_tt_has_unpacified_reclaimed: "Znovuzískané území s mírou spolupráce pod §Y90 %§!" # todo: NEW TRANSLATION
 SIA_tt_has_corable_reclaimed: "Znovuzískané území s mírou spolupráce alespoň §Y80 %§!" # todo: NEW TRANSLATION
 SIA_bamboo_curtain: "Bambusová opona" # todo: NEW TRANSLATION
 SIA_bamboo_curtain_desc: "Thajská revoluce nemůže přežít jako izolovaný experiment. Vietnam a Laos jsou sousedé, souputníci a potenciální partneři. Regionální rámec solidarity založený na vzájemném uznání a koordinovaném odporu vůči západnímu ekonomickému tlaku je architekturou udržitelného revolučního státu v jihovýchodní Asii." # todo: NEW TRANSLATION
 SIA_protracted_peoples_war: "Vleklá lidová válka" # todo: NEW TRANSLATION
 SIA_protracted_peoples_war_desc: "Strana sedmdesátých let nezvítězila ve městech. Své řemeslo se naučila v kopcích, kde byl dosah Bangkoku slabý a puška znamenala více než manifest. Vybudujme základny na vysočině a nechme venkov obklíčit město. Pomalejší než generální stávka a mnohem obtížněji vratné." # todo: NEW TRANSLATION
 SIA_peoples_tribunals: "Lidové tribunály" # todo: NEW TRANSLATION
 SIA_peoples_tribunals_desc: "Revoluce, která se nedokáže bránit, trvá jednu sezónu. Udavači, finančníci i plukovníci, kteří čekali, kterým směrem se vítr obrátí, jsou stále na svých místech. Revoluční soudy, rychlé a veřejné, vyřeší otázku loajality dříve, než ji bude možné položit straně." # todo: NEW TRANSLATION
 SIA_broad_united_front: "Široká jednotná fronta" # todo: NEW TRANSLATION
 SIA_broad_united_front_desc: "Revoluce, která vládne strachem, ovládá každý rok menší zemi. Těžší cestou je souhlas. Přiveďme rolnické svazy, odbory, reformní intelektuály, drobné obchodníky a vesnické mnichy pod jednu střechu a nechme je cítit, že nový stát vybudovali, nikoli jen přežili. Moc je na papíře sdílená a v praxi střežená, ale hnutí, které dokáže vládnout dohodou, nemusí vládnout zbraní." # todo: NEW TRANSLATION
 SIA_peoples_army: "Lidová armáda" # todo: NEW TRANSLATION
 SIA_peoples_army_desc: "Plán vybudoval továrny. Nyní kuje štít. Revoluční stát v nepřátelském regionu potřebuje armádu, která bude početná, loajální a vlastní, s branci cvičenými k obrazu strany a vybavenými z thajských arzenálů namísto zahraniční dobré vůle. Každé tělo schopné nést pušku je občanem-vojákem a každá dílna schopná vyrobit hlaveň je článkem zásobovacího řetězce. Sousedé si dvakrát rozmyslí, než zaútočí." # todo: NEW TRANSLATION
 SIA_socialist_education: "Každý učí jednoho" # todo: NEW TRANSLATION
 SIA_socialist_education_desc: "Plán vybudoval továrny. Nyní buduje lidi, kteří je budou řídit. Masová kampaň gramotnosti dosáhne poslední vesnice v Isaanu a kádrové školy promění rolníky v inženýry a úředníky ve správce, kteří odpovídají zásluhám, nikoli tomu, do jaké rodiny se narodili. Gramotné a organizované obyvatelstvo se hůře klame a levněji spravuje, zatímco hniloba klientelismu, která vyhloubila staré království, nenajde místo, kde by zapustila kořeny." # todo: NEW TRANSLATION
 SIA_the_beijing_road: "Pekingská cesta" # todo: NEW TRANSLATION
 SIA_the_beijing_road_desc: "Přežití má sponzora a ten sídlí v Zhongnanhai. Plně přijměme objetí Pekingu. Čínský kapitál dokončí průmyslový plán, čínské trhy nahradí ty, které Západ uzavřel, a stín velmoci odradí každého souseda od výzvy. Cena je napsána drobným písmem. Hlas Číny v thajských radách sílí více, než by kterýkoli Thajec dříve dovolil. Mladší partner je stále partnerem a živený národ přežije pyšný národ." # todo: NEW TRANSLATION
 SIA_indochina_federation: "Indočínská federace" # todo: NEW TRANSLATION
 SIA_indochina_federation_desc: "Nebo odmítněme roli klienta a nárokujme si roli vůdce. Laos, Vietnam a Kambodža jsou tři revoluce, které krváceli za stejnou myšlenku, žádná však nemá thajský průmysl ani jeho centrální postavení. Federace tří řek s Bangkokem jako starším partnerem namísto mladšího Pekingu promění jihovýchodní Asii v celek, s nímž musí velmoci vyjednávat, místo aby si jej rozebraly. Je to troufalejší tvrzení a také hrdější." # todo: NEW TRANSLATION
 SIA_kingmaker_coalition: "Koalice tvůrce králů" # todo: NEW TRANSLATION
 SIA_kingmaker_coalition_desc: "Strana Bhumjaithai Anutina Charnvirakula drží v parlamentu z roku 2019 rovnováhu sil. Vytvoření koalice s ní stojí ministerstva a politické ústupky, ale zároveň přináší vládní většinu a přístup k venkovské severovýchodní základně strany." # todo: NEW TRANSLATION
 SIA_cannabis_decriminalized: "Dekriminalizace konopí" # todo: NEW TRANSLATION
 SIA_cannabis_decriminalized_desc: "Charakteristická politika Bhumjaithai z roku 2022 odstraňuje konopí ze seznamu omamných látek. Zemědělci v Buriramu i napříč Isaanem přecházejí na novou tržní plodinu. Příjmy státní pokladny rostou. Konzervativní hlasy varují před morálním hazardem. Obojí je pravda." # todo: NEW TRANSLATION
 SIA_million_rai_farms: "Milion rai moderních farem" # todo: NEW TRANSLATION
 SIA_million_rai_farms_desc: "Venkovská rozvojová platforma Bhumjaithai přináší na jih precizní zavlažování, certifikaci smluvního zemědělství a dotace na obnovu kaučukovníkových plantáží. Severovýchod získá nová odvětví a jih rozšíření plantáží. Thajský zemědělský export roste." # todo: NEW TRANSLATION
 SIA_defence_industry_act: "Zákon o obranném průmyslu" # todo: NEW TRANSLATION
 SIA_defence_industry_act_desc: "Právní rámec pro domácí výrobu obranné techniky, s předností při nákupech pro lokálně vyráběné systémy, povinným převodem technologií u všech zahraničních kontraktů a sekretariátem obranného průmyslu uvnitř ministerstva. První zbrojovka, která vznikne, bude skromná. Institucionální základ nikoli." # todo: NEW TRANSLATION
 SIA_dti_expansion: "Rozšíření DTI" # todo: NEW TRANSLATION
 SIA_dti_expansion_desc: "Ústav obranných technologií získá kapitálovou injekci a mandát dodat rakety, potulující se munici a modernizované prototypy obrněných vozidel. Isaanské zařízení se promění z projekční kanceláře ve výrobní linku a spolu s ním se spustí nová zbrojní výroba. Výzkumné bonusy následují techniku." # todo: NEW TRANSLATION
 SIA_chaiseri_and_friends: "Chaiseri a přátelé" # todo: NEW TRANSLATION
 SIA_chaiseri_and_friends_desc: "First Win MRAP společnosti Chaiseri Metal and Rubber se již prodává do Indonésie a na Filipíny. S podporou zákona o obranném průmyslu se rozšiřuje skupina soukromých obranných dodavatelů, mezi nimi Chaiseri, Thonburi Automotive a Thai Optical. Co začíná jako domácí nákup, se mění ve vývozní účetnictví a vlastní výrobní linka Chaiseri díky výnosům postoupí na vyšší úroveň." # todo: NEW TRANSLATION
 SIA_arms_exporter: "Arzenál ASEAN" # todo: NEW TRANSLATION
 SIA_arms_exporter_desc: "Thajsko vybudovalo výrobní základnu, právní rámec i vývozní vztahy, aby se stalo preferovaným dodavatelem zbraní druhé kategorie v regionu. Ne tanky a stíhačky, ale MRAPy, dělostřelecké zapalovače, drony a munice. Spolehlivě, dostupně a včas. Opakovatelný vývozní kontrakt se stává pevnou součástí příjmů státní pokladny." # todo: NEW TRANSLATION
 SIA_regional_defense_pact: "Regionální obranný pakt" # todo: NEW TRANSLATION
 SIA_regional_defense_pact_desc: "Vývozní účetnictví se stalo diplomatickým nástrojem. Bangkok formalizuje trvalá ujednání o dodávkách obranné techniky se svými partnery v ASEAN, včetně zaručených nákupních kanálů, společných programů údržby a stálého konzultačního rámce pro regionální bezpečnost. Továrny pracují intenzivněji, přidělenci se vracejí s podepsanými dohodami a vliv Thajska v jihovýchodní Asii se měří příděly munice a kontrakty na náhradní díly." # todo: NEW TRANSLATION
 SIA_stream_of_the_navy: "Proud námořnictva" # todo: NEW TRANSLATION
 SIA_stream_of_the_navy_desc: "Královská thajská námořní pěchota získá doktrinální podporu pro obojživelné útoky a pobřežní obranu. Rozšíření loděnic na jihu podpoří novou obojživelnou eskadru. Thajští mariňáci cvičí po boku svých indonéských a filipínských protějšků na cvičeních, která již nejsou čistě ceremoniální." # todo: NEW TRANSLATION
 SIA_cavalry_of_the_sky: "Jízda oblohy" # todo: NEW TRANSLATION
 SIA_cavalry_of_the_sky_desc: "Letecké jednotky armády dostanou přednost. Nové víceúčelové vrtulníky pro výsadkovou pěchotu, útočné varianty na podporu pozemních operací v kopcích a doktrína vzdušného útoku, která uznává, že thajský terén je spíše džungle než step." # todo: NEW TRANSLATION
 SIA_cyber_command: "Kybernetické velitelství" # todo: NEW TRANSLATION
 SIA_cyber_command_desc: "Specializované velitelství kybernetických operací podle rámců amerického CYBERCOM a izraelské jednotky 8200. Obrana sítí, signálové zpravodajství a v tiché příloze rozpočtového návrhu také rozvoj útočných schopností. Pokud již infrastruktura dohledu ISOC existuje, velitelství ji převezme a rozšíří její dosah do digitální dimenze." # todo: NEW TRANSLATION
 SIA_us_coin_legacy: "Dědictví amerického protipovstaleckého boje" # todo: NEW TRANSLATION
 SIA_us_coin_legacy_desc: "Thajská armáda vstřebala tvrdé lekce americké protipovstalecké doktríny v desetiletích po válce ve Vietnamu, včetně programů obrany vesnic, psychologických operací a zpravodajské spolupráce s ISOC. Tento rámec stále utváří způsob, jakým Thajsko bojuje se svými vnitřními nepřáteli. Jeho systematizace přináší výsledky." # todo: NEW TRANSLATION
 SIA_development_is_security: "Rozvoj je bezpečnost" # todo: NEW TRANSLATION
 SIA_development_is_security_desc: "Silnice, školy a kliniky v neklidném severu a severovýchodě jsou nejlevnější dostupnou protipovstaleckou strategií. Infrastruktura, která dorazí do vesnice dříve než agitátor, má tendenci zůstat. Nové železniční terminály v Isaanu a na severu urychlí každý následující projekt." # todo: NEW TRANSLATION
 SIA_post_cold_war_professionalization: "Profesionalizace po studené válce" # todo: NEW TRANSLATION
 SIA_post_cold_war_professionalization_desc: "Studená válka formovala důstojnický sbor Thajska pro protikomunistické operace, loajalitu k vnitřnímu pořádku a podřízenost paláci. Nová generace důstojníků, cvičená ve společných cvičeních se západními partnery a vzdělaná v mezinárodním právu, nově definuje účel Královských thajských ozbrojených sil." # todo: NEW TRANSLATION
 SIA_multi_domain_operations: "Operace ve více doménách" # todo: NEW TRANSLATION
 SIA_multi_domain_operations_desc: "Bitevní pole již není čárou na mapě. Kybernetika, elektronický boj, družicové snímkování a přesné údery dronů se spojují s konvenčním manévrem. Thajská koncepce MDO, vyvinutá společně s americkými a australskými partnery, uznává, že příští válka bude probíhat současně ve všech doménách." # todo: NEW TRANSLATION
 SIA_mdo_integration_strain: "Napětí z integrace" # todo: NEW TRANSLATION
 SIA_mdo_integration_strain_desc: "Zřízení struktur velení napříč doménami, od kybernetiky po družicové snímkování, stojí peníze dlouho předtím, než se doktrína začne vyplácet." # todo: NEW TRANSLATION
 SIA_ministry_of_defence: "Ministerstvo obrany" # todo: NEW TRANSLATION
 SIA_ministry_of_defence_desc: "Obranu Království vždy řídily samotné složky, přičemž každá střežila vlastní rozpočet, vlastní doktrínu a vlastní území. Konečně jí dáme institucionální páteř: ministerstvo nad armádou, námořnictvem a letectvem, které spojí územní obranu, politiku národní bezpečnosti a zpravodajství do jediného aparátu odpovědného státu." # todo: NEW TRANSLATION
 SIA_comprehensive_security: "Komplexní bezpečnost" # todo: NEW TRANSLATION
 SIA_comprehensive_security_desc: "Vnitro, obrana a zpravodajské služby po desetiletí sledovaly stejné hranice se třemi sadami spisů a bez zvyku je sdílet. Jedna doktrína je spojí a současně otevře tři směry úsilí: ekonomiku, domácí frontu a ozbrojené síly." # todo: NEW TRANSLATION
 SIA_protector_of_the_realm_focus: "Ochránce říše" # todo: NEW TRANSLATION
 SIA_protector_of_the_realm_focus_desc: "Po vysvěcení Památníku vítězství leží šanské, laoské, khmerské a malajské území pod thajskou vlajkou. Zvítězit a vládnout jsou dva různé úkoly. Za posádkami vzniká správa znovuzískaného pohraničí a začíná práce na jeho uklidnění, rozvoji a pozdějším začlenění." # todo: NEW TRANSLATION
 SIA_atoms_for_peace: "Atomy pro mír" # todo: NEW TRANSLATION
 SIA_atoms_for_peace_desc: "Thajsko podepisuje protokoly MAAE o mírovém využití a zahajuje dlouhou institucionální přípravu. Úřad pro jadernou bezpečnost, dohody o vyhořelém palivu a první domácí výzkumný reaktor. Civilní program stojí na přesvědčení, že základní energie z uranu je levnější, čistší a suverénnější než ropa dovážená za geopolitické ceny." # todo: NEW TRANSLATION
 SIA_smr_initiative: "Iniciativa SMR" # todo: NEW TRANSLATION
 SIA_smr_initiative_desc: "Malé modulární reaktory jsou technologií, díky níž je jaderná energie uskutečnitelná pro zemi, která si nemůže dovolit kapitálové náklady plnohodnotné elektrárny. Iniciativa financuje studie proveditelnosti, průzkumy lokalit ve Východním pobřežním regionu a dohodu o převodu technologií s jihokorejským nebo francouzským konsorciem. První beton se začne lít za deset let. Rozhodnutí padne dnes." # todo: NEW TRANSLATION
 SIA_nuclear_power_program: "Program jaderné energetiky" # todo: NEW TRANSLATION
 SIA_nuclear_power_program_desc: "Vyvrcholením je národní program jaderné energetiky s pevným datem uvedení do provozu, suverénním palivovým cyklem a prvním reaktorem připojeným k síti. Thajsko se stane prvním státem jihovýchodní Asie, který připojí civilní reaktor k síti, a připojí se k Japonsku, Jižní Koreji, Číně, Indii, Pákistánu a Tchaj-wanu mezi jaderné provozovatele regionu. Energetická nezávislost už není teoretická." # todo: NEW TRANSLATION
 SIA_bangkok_phnom_penh_axis: "Osa Bangkok–Phnompenh" # todo: NEW TRANSLATION
 SIA_bangkok_phnom_penh_axis_desc: "Geografie Kambodže z ní činí přirozený thajský hospodářský koridor k moři a její politický vývoj zase přirozenou diplomatickou protiváhu Vietnamu. Tento záměr buduje vztahy prostřednictvím obchodních misí, silničních spojení a společného bezpečnostního rámce, který udrží Phnompenh blízko Bangkoku a dále od oběžné dráhy Pekingu." # todo: NEW TRANSLATION
 SIA_jakarta_dialogue: "Dialog v Jakartě" # todo: NEW TRANSLATION
 SIA_jakarta_dialogue_desc: "Indonésie je demografickým gigantem jihovýchodní Asie a po Kuala Lumpuru nejdůležitějším bilaterálním vztahem Thajska. Dialog v Jakartě je platformou pro bilaterální ministry, společná vojenská cvičení a otevřený rozhovor o tom, kdo povede příští desetiletí ASEAN. Výsledek závisí na tom, zda Bangkok vnímá Jakartu jako partnera, nebo rivala." # todo: NEW TRANSLATION
 SIA_asean_crossroads: "Křižovatka ASEAN" # todo: NEW TRANSLATION
 SIA_asean_crossroads_desc: "Před Královstvím leží dvě cesty. První je partnerství, řád vedený Thajskem, který spojuje ASEAN na základě souhlasu. Druhou je nadvláda, jihovýchodní Asie pod thajskou kontrolou vynucenou mečem." # todo: NEW TRANSLATION
 SIA_the_2001_election_choice_tt: "Podpořte jednu sílu v kampani roku 2001. Volby rozhodnou, kdo bude vládnout, a otevře se pouze cesta vítěze.\n - £SIA_neutral_Social §YThai Rak Thai§!\n - £SIA_Nat_Autocracy §YPalácová síť a její generálové§!\n - £SIA_western_conservative §YSedící demokraté§!" # todo: NEW TRANSLATION
 SIA_the_2006_coup_choice_tt: "Zvolte charakter junty.\n - §YTvrdá linie§!: Pozastaví volby a přepíše ústavu za cenu stability a názoru Západu\n - §YSmířlivá linie§!: Zachová demokratické volby a zaplatí menší cenu" # todo: NEW TRANSLATION
 SIA_a_new_republic_choice_tt: "Zvolte osud monarchie.\n - §YZrušit§!: Přestát otřesy\n - §YStáhnout se§!: Zachovat korunu kvůli stabilitě a politické moci" # todo: NEW TRANSLATION
 SIA_the_southern_question_choice_tt: "Zvolte bezpečnostní doktrínu pro hluboký jih." # todo: NEW TRANSLATION
 SIA_red_chakri_dilemma_choice_tt: "Zvolte revoluční odpověď na trůn.\n - §YZrušit monarchii§!: Čelit royalistickému povstání\n - §YZachovat ústavní symbol§!: Následovat laoský model a vstřebat hněv radikálů" # todo: NEW TRANSLATION
 SIA_lost_territories_choice_tt: "Zvolte, jak otevřeně bude nárok prosazován.\n - §YOtevřený iredentismus§!: Podpora války za cenu mezinárodního postavení\n - §YTichý popíratelný revizionismus§!: Chrání stabilitu" # todo: NEW TRANSLATION
 SIA_nuclear_power_program_choice_tt: "Zvolte směr palivového cyklu.\n - §YVzepřít se inspektorům§!: Obohacování schopné vyrábět zbraně pod sankcemi\n - §YPřijmout záruky MAAE§!: Napravit vztahy s Washingtonem" # todo: NEW TRANSLATION
 SIA_prayuth_premiership_choice_tt: "Zvolte, jak generál naplánuje své nástupnictví.\n - §YŘízený přechod§!: Upevnit establishment\n - §YInstitucionalizovat urovnání§!: Ustoupit zpět k civilnější tváři" # todo: NEW TRANSLATION
 SIA_2020_protest_response_choice_tt: "Zvolte reakci na protesty.\n - §YPotlačit je§!: Stojí stabilitu a zvyšuje riziko převratu\n - §YPřistoupit na reformu§!: Uklidnění a podpora reformního hnutí\n - §YPočkat, až je to přejde§!" # todo: NEW TRANSLATION
 SIA_found_the_pact: "Objevit Organizaci smlouvy pro jihovýchodní Asii" # todo: NEW TRANSLATION
 SIA_found_the_pact_desc: "Slova se mění v instituce. Thajsko obnovuje název, který vnější mocnosti v roce 1977 opustily, a dává mu regionálního vlastníka: Organizaci smlouvy pro jihovýchodní Asii, pakt vzájemné obrany s Bangkokem v jeho středu a sousedy mezi jeho členy. Thajsko přebírá roli zakládajícího vůdce. Vlajka je vztyčena. Pakt je skutečný." # todo: NEW TRANSLATION
 SIA_invite_mainland: "Pozvat pozemní partnery" # todo: NEW TRANSLATION
 SIA_invite_mainland_desc: "Vietnam, Laos, Kambodža a Myanmar sdílejí s Thajskem hranice i společné hrozby. Bangkok rozesílá formální pozvání pevninským státům a vysvětluje, že bezpečnost v kontinentálním vnitrozemí závisí na společném postupu, nikoli na soupeřícím zajišťování." # todo: NEW TRANSLATION
 SIA_invite_mainland_tt: "Pozve naše pevninské sousedy ke vstupu do SEATO.\n - Každý z nich sám rozhodne, zda nabídku přijme\n - Člen, který nabídku přijme, získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_invite_maritime: "Pozvat námořní partnery" # todo: NEW TRANSLATION
 SIA_invite_maritime_desc: "Indonésie, Filipíny, Malajsie, Singapur a Brunej ovládají moře, na nichž Thajsko závisí kvůli obchodu. Námořní partneři jsou pozváni ke vstupu do paktu, čímž se souostroví a poloostrov spojí do jediného strategického společenství." # todo: NEW TRANSLATION
 SIA_invite_maritime_tt: "Pozve námořní státy jihovýchodní Asie ke vstupu do SEATO.\n - Každý z nich sám rozhodne, zda nabídku přijme\n - Člen, který nabídku přijme, získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_invite_breakaways: "Pozvat pohraniční státy" # todo: NEW TRANSLATION
 SIA_invite_breakaways_desc: "Jižní Šan, Karenové a Wa ovládají území mezi Thajskem a barmským vnitrozemím a žádný z nich nedokáže přežít sám. Bangkok jim nabízí to, co Najpjijto nikdy nenabídne: místo u stolu, podpis smlouvy a postavení státu namísto povstaleckého hnutí." # todo: NEW TRANSLATION
 SIA_invite_breakaways_tt: "Pozve barmské separatistické státy ke vstupu do SEATO, pokud existují.\n - Každý z nich sám rozhodne, zda nabídku přijme\n - Člen, který nabídku přijme, získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_seato_invite_line_tt: " - §Y[THIS.GetNameDefCap]§! je pozván ke vstupu do SEATO" # todo: NEW TRANSLATION
 SIA_seato_invite_accept_tt: " - Vstoupí do §YSEATO§! a získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_seato_accession_category: "Přistoupení k SEATO" # todo: NEW TRANSLATION
 SIA_seato_accession_category_desc: "První Organizace smlouvy pro jihovýchodní Asii byla podepsána v Manile v roce 1954 a řízena z Bangkoku, ale pouze dva z jejích osmi členů pocházeli z jihovýchodní Asie a v roce 1977 se rozpadla, aniž by byla kdy použita. Tato organizace je regionálním paktem, kterým ta první nikdy nebyla: Thajsko v čele, sousedé jako členové a záruka zaměřená na obranu jihovýchodní Asie, nikoli na zadržování někoho jiného. Místa je třeba obsadit jedno po druhém.\n\nPřed pozváním do frakce si prohlédněte vstřícnost jednotlivých zemí." # todo: NEW TRANSLATION
 SIA_renew_seato_invitation: "Obnovit pozvání" # todo: NEW TRANSLATION
 SIA_renew_seato_invitation_desc: "Pošlete delegaci zpět do [FROM.GetNameDefCap] s textem smlouvy a novou nabídkou. Odmítnutí není trvalé a podmínky se nezměnily." # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_major: "Dvořit se zemi [FROM.GetNameDefCap]" # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_major_desc: "Státní návštěvy, úvěrová linka, stipendia pro jejich důstojníky a thajský pavilon na jejich veletrhu. Ministerstvo zahraničí se po tři měsíce věnuje výhradně tomu. Nic z toho není smlouva. Všechno to však usnadní její podpis, až se příště zeptáme." # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_minor: "Dvořit se zemi [FROM.GetNameDefCap]" # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_minor_desc: "Státní návštěvy, úvěrová linka, stipendia pro jejich důstojníky a thajský pavilon na jejich veletrhu. Ministerstvo zahraničí se po tři měsíce věnuje výhradně tomu. Nic z toho není smlouva. Všechno to však usnadní její podpis, až se příště zeptáme." # todo: NEW TRANSLATION
 SIA_courting_mission: "Dvoření sousedům" # todo: NEW TRANSLATION
 SIA_courting_mission_desc: "Vyšší diplomatičtí pracovníci, ministerský kalendář i většina volně použitelného rozpočtu jsou až do konce mise věnovány jedinému hlavnímu městu. Všechno ostatní ve vládě musí počkat." # todo: NEW TRANSLATION
 SIA_seato_rec_opinion_yes: "§GNázor na Thajsko je vyšší než 40§! (+25)" # todo: NEW TRANSLATION
 SIA_seato_rec_opinion_no: "§RNázor na Thajsko je 40 nebo nižší§! (+25)" # todo: NEW TRANSLATION
 SIA_seato_rec_faction_yes: "§VNení v jiné frakci§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_faction_no: "§RUž je v jiné frakci§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_influence_yes: "§GThajsko patří mezi tři největší zdroje vlivu a drží 20 procent nebo více§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_influence_no: "§RThajsko nepatří mezi tři největší zdroje vlivu s podílem 20 procent nebo více§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_threat_yes: "§GJe ve válce nebo sousedí se zemí, která je ve válce§! (+15)" # todo: NEW TRANSLATION
 SIA_seato_rec_threat_no: "§ROn ani žádná země, se kterou sousedí, není ve válce§! (+15)" # todo: NEW TRANSLATION
 SIA_seato_rec_trade_yes: "§GMá s Thajskem obchodní dohodu§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_trade_no: "§RNemá s Thajskem obchodní dohodu§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_momentum_yes: "§GSEATO již má tři nebo více členů§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_momentum_no: "§RSEATO má méně než tři členy§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_total: "§YVstřícnost vůči SEATO§!: §Y[?SIA_seato_temp|0]§!/100. Pozvání přijmou při hodnotě §Y60§!." # todo: NEW TRANSLATION
 SIA_joint_command: "Společné velení ASEAN" # todo: NEW TRANSLATION
 SIA_joint_command_desc: "V Bangkoku je zřízena stálá struktura společného velení, která integruje doktrínu, logistiku a zpravodajství všech členských států. Vyšší posty zastávají thajští důstojníci, štáb je však skutečně mnohostranný. Cvičení se stávají interoperabilními. Plány se stávají skutečností." # todo: NEW TRANSLATION
 SIA_asean_rapid_reaction: "Síly rychlé reakce ASEAN" # todo: NEW TRANSLATION
 SIA_asean_rapid_reaction_desc: "Pakt činí další krok: vytváří stálou brigádu rychlé reakce složenou ze všech členských států, schopnou nasazení do 72 hodin na jakémkoli místě jihovýchodní Asie. Je to meč paktu — malý, rychlý a nepochybně skutečný." # todo: NEW TRANSLATION
 SIA_arsenal_integration: "Integrace arzenálu ASEAN" # todo: NEW TRANSLATION
 SIA_arsenal_integration_desc: "Thajský obranný průmysl, již nyní dílna jihovýchodní Asie, sjednocuje zbraně a munici ozbrojených sil všech členských států. Pušky, vozidla a dělostřelecké granáty thajské výroby nahrazují směs sovětské, čínské a západní techniky. Armády paktu nyní používají stejné náboje." # todo: NEW TRANSLATION
 SIA_pax_aseana: "Pax Aseana" # todo: NEW TRANSLATION
 SIA_pax_aseana_desc: "Práce je dokončena a pakt drží. Thajsko vybudovalo to, co žádná vnější mocnost nedokázala: skutečnou bezpečnostní architekturu zakořeněnou v regionu a dostatečně silnou, aby odradila jakéhokoli vyzyvatele. Sousedé podepsali, protože chtěli, a právě proto pakt vydrží." # todo: NEW TRANSLATION
 SIA_war_economy_push: "Přechod na válečné hospodářství" # todo: NEW TRANSLATION
 SIA_war_economy_push_desc: "Národ přešel na válečnou nohu. Továrny, které vyráběly spotřební zboží, jsou přestavovány na výrobu dělostřeleckých granátů a hlavní pušek. Limit vojenských výdajů je zrušen, zakázky jsou podepisovány bez obvyklých průtahů a na narychlo vyklizených pozemcích v bangkocké metropolitní oblasti vyrůstají tři nové zbrojovky." # todo: NEW TRANSLATION
 SIA_friends_abroad: "Přátelé v zahraničí" # todo: NEW TRANSLATION
 SIA_friends_abroad_desc: "Thajské ozbrojené síly po desetiletí cvičily po boku zahraničních partnerů. Dvoustranné vazby vytvořené společnými cvičeními, výměnami důstojníků a transfery zbraní jsou tichým pilířem thajské bezpečnosti — méně viditelným než spojenectví, ale trvalejším než většina z nich. Nastal čas formalizovat to, co již funguje." # todo: NEW TRANSLATION
 SIA_cobra_gold_focus: "Cobra Gold" # todo: NEW TRANSLATION
 SIA_cobra_gold_focus_desc: "Cobra Gold je největší každoroční společné vojenské cvičení v Asii, jehož hostiteli jsou Thajsko a Spojené státy. Prohloubení programu cvičení přinese Královské thajské armádě americkou doktrínu, výcvik logistiky a znalost vybavení a upevní Bangkok jako hlavního partnera Washingtonu v pevninské jihovýchodní Asii." # todo: NEW TRANSLATION
 SIA_partner_japan: "Obranné vazby s Japonskem" # todo: NEW TRANSLATION
 SIA_partner_japan_desc: "Japonské reformy vývozu obranné techniky otevřely nové kanály pro thajské nákupy. Tokio nabízí know-how v přesné výrobě, elektroniku dvojího užití a financování infrastruktury, které doplňují thajské schopnosti bez politických podmínek spojených s čínskými či americkými balíčky." # todo: NEW TRANSLATION
 SIA_partner_korea: "Obranné partnerství s ROK" # todo: NEW TRANSLATION
 SIA_partner_korea_desc: "Korejská republika vybudovala během jediné generace konkurenceschopný zbrojní průmysl. Tanky K-2, letouny FA-50 a houfnice K9 se za konkurenční ceny prodávají partnerům po celé jihovýchodní Asii. Thajsko se řadí do fronty a přiváží si korejské standardy leteckého výcviku i průmyslové postupy." # todo: NEW TRANSLATION
 SIA_partner_australia: "Soused z Five Eyes" # todo: NEW TRANSLATION
 SIA_partner_australia_desc: "Austrálie je nejbližším anglofonním partnerem Thajska a zároveň nečlenským spojencem Spojených států v rámci NATO. Společná cvičení v Andamanském moři a Thajském zálivu prohloubila vazby mezi námořnictvy. Rozšíření partnerství přinese interoperabilitu armád a spolupráci v námořním průzkumu, kterou by si žádná ze zemí nemohla dovolit sama." # todo: NEW TRANSLATION
 SIA_partner_taiwan: "Tichá obranná spolupráce" # todo: NEW TRANSLATION
 SIA_partner_taiwan_desc: "Tchajwanský obranný průmysl je diskrétní, technicky vyspělý a politicky motivovaný hledat přátele. Bangkok Tchaj-pej neuznává, ale Královská thajská armáda a armáda ROC dlouhodobě udržují neformální kanály pro dodávky vybavení a výcvik. Tiché formalizování této spolupráce je kalkulovaným rizikem. Peking si toho všimne." # todo: NEW TRANSLATION
 SIA_hedging_partners: "Přátelé na Dálném východě" # todo: NEW TRANSLATION
 SIA_hedging_partners_desc: "Tokio, Soul i Peking nabízejí Bangkoku něco, co Washington nemůže: trpělivý kapitál, technologie dvojího užití a obrovský sousední trh. Nikdo z nich nepožaduje výhradní postavení. Thajsko se uchází o všechny tři a drží si vysokou cenu, odmítá být kotvou kohokoli i klientem kohokoli. Království, které se již zavázalo k balancování, z těchto vazeb získává dvojnásobek." # todo: NEW TRANSLATION
 SIA_national_grid: "Napájet Království" # todo: NEW TRANSLATION
 SIA_national_grid_desc: "Rychlá industrializace Thajska předběhla jeho elektrickou síť. Východní pobřeží hučí továrnami, ale síť stárne, přenosové ztráty jsou ostudné a další desetiletí růstu vyžaduje základ, který unese zátěž. Vláda se zavazuje k celostátní modernizaci infrastruktury s novými rozvodnami, modernizovanými přenosovými vedeními a novými továrnami v regionech, které síť konečně dokáže zásobovat." # todo: NEW TRANSLATION
 SIA_renewable_push: "Rozvoj obnovitelné energie" # todo: NEW TRANSLATION
 SIA_renewable_push_desc: "Vítr z Thajského zálivu, solární energie v centrálních nížinách, malé vodní elektrárny na severu. Geografie Thajska představuje obnovitelný zdroj, který je chronicky nevyužitý. Tento program zadává velkokapacitní obnovitelné instalace v každém regionu Království a jejich výkon přímo napojuje do celostátní sítě." # todo: NEW TRANSLATION
 SIA_green_grid: "Zelená síť" # todo: NEW TRANSLATION
 SIA_green_grid_desc: "Jedna věc je obnovitelná kapacita, druhá je síť, která ji dokáže využít. Akumulace, inteligentní řízení a modernizovaný přenos propojí solární farmy a větrné hřebeny Království do spolehlivých dodávek. Každý nový panel či turbína se na posílené páteři připojí rychleji. Zde začíná energetická nezávislost Království." # todo: NEW TRANSLATION
 SIA_fossil_fuels_deal: "Energetické partnerství se Zálivem" # todo: NEW TRANSLATION
 SIA_fossil_fuels_deal_desc: "Rafinerie Království fungují na ropě ze Zálivu a elektrárny spalují dovážený plyn. Namísto boje proti této závislosti ji Bangkok formalizuje. Dlouhodobé dodavatelské dohody se Saúdskou Arábií, Katarem a Spojenými arabskými emiráty přinášejí jistotu cen, skromné úspory paliva díky modernizaci elektráren a diplomatickou vřelost, která přichází spolu s šekem." # todo: NEW TRANSLATION
 SIA_gulf_energy_ties: "Strategické zásoby paliva" # todo: NEW TRANSLATION
 SIA_gulf_energy_ties_desc: "Tanker, který nikdy nevypluje, je elektrárna, která nikdy nenastartuje. V jižním průmyslovém koridoru a na Východním pobřeží vyrůstají dvě strategická skladovací zařízení paliva. Partneři ze Zálivu financují polovinu výstavby a thajští inženýři postaví zbytek." # todo: NEW TRANSLATION
 SIA_iron_fist_doctrine: "Doktrína železné pěsti" # todo: NEW TRANSLATION
 SIA_iron_fist_doctrine_desc: "O křivdách se již nebude mluvit. Tři provincie jsou zaplaveny vojáky, kontrolními stanovišti a mimořádnými pravomocemi. Povstání je bezpečnostní problém a jako takový bude také řešeno — rychle, tvrdě a bez omluv. Svět bude protestovat. Jih ztichne." # todo: NEW TRANSLATION
 SIA_martial_law_south: "Stanné právo na jihu" # todo: NEW TRANSLATION
 SIA_martial_law_south_desc: "Mimořádný dekret podřizuje Pattani, Jalu a Narathiwat vojenské správě. Zákazy vycházení, prohlídky bez povolení a zadržování bez obvinění se stávají každodenní realitou života na jihu. Armáda nyní může jednat na základě zpravodajství okamžitě po jeho obdržení a obyvatelstvo poznává cenu ukrývání mužů se zbraněmi." # todo: NEW TRANSLATION
 SIA_search_and_destroy: "Pátrat a ničit" # todo: NEW TRANSLATION
 SIA_search_and_destroy_desc: "Speciální jednotky a letectvo provádějí razie proti domnělé síti buněk. Operace jsou rozhodné a počet mrtvých vysoký. Každý úspěšný nájezd povstání o něco více oslabí a každý nájezd, který zasáhne svatbu, jim naopak daruje generaci nových rekrutů." # todo: NEW TRANSLATION
 SIA_pacification_complete: "Pacifikace dokončena" # todo: NEW TRANSLATION
 SIA_pacification_complete_desc: "Silniční bomby umlkly a kontrolní stanoviště zmizela. Mešity jsou sledovány, školy monitorovány a křivda pod tichem nezemřela. Zbraně ztichly, ale žhavé uhlíky zůstávají." # todo: NEW TRANSLATION
 SIA_royal_development_projects: "Královské rozvojové projekty" # todo: NEW TRANSLATION
 SIA_royal_development_projects_desc: "Z iniciativy krále je na jih přenesen rozvojový model koruny: zavlažování, zemědělství, silnice a družstva podporovaná královským dvorem. Poselství zní, že pro malajsko-muslimský jih zajišťuje výsledky monarchie, nikoli povstání. Patronát a přítomnost, nejen hlídky." # todo: NEW TRANSLATION
 SIA_isoc_southern_command: "Jižní velitelství ISOC" # todo: NEW TRANSLATION
 SIA_isoc_southern_command_desc: "Velitelství operací vnitřní bezpečnosti přebírá jednotné velení nad jižním bojištěm. Civilně-vojenská koordinace, slučování zpravodajských informací i aparát měkké síly jsou nyní pod jednou střechou. Pokud je síť ISOC již vyspělá, může se jižní velitelství přesunout od reakcí k předvídání." # todo: NEW TRANSLATION
 SIA_winning_hearts_royally: "Královské získávání srdcí" # todo: NEW TRANSLATION
 SIA_winning_hearts_royally_desc: "Stipendia, renovace mešit, rozvojové zóny s halal certifikací a záměrné začleňování místních malajsko-muslimských představitelů do systému patronátu. Stát nepřichází jako okupant, ale jako dobrodinec, a kalkulace mladých mužů se pomalu a místy mění." # todo: NEW TRANSLATION
 SIA_southern_calm: "Jižní klid" # todo: NEW TRANSLATION
 SIA_southern_calm_desc: "Násilí ustoupilo do kontrolovaného a sledovaného ticha. Neexistuje smlouva ani autonomie, přesto provincie fungují a královská záštita trvá. Klid udržovaný přítomností a patronátem." # todo: NEW TRANSLATION
 SIA_peace_dialogue_initiative: "Iniciativa mírového dialogu" # todo: NEW TRANSLATION
 SIA_peace_dialogue_initiative_desc: "Bangkok formálně otevírá malajsijský kanál za účasti Malajsie jako prostředníka. Stát poprvé usedá ke stolu s muži, které pronásledoval, a připouští, že budoucnost jihu je otázkou vyjednávání, nikoli pouze síly. Doma to stojí politický kapitál, ale otevírá cestu, kterou kulky nikdy otevřít nemohly." # todo: NEW TRANSLATION
 SIA_mara_patani_talks: "Jednání s MARA Patani" # todo: NEW TRANSLATION
 SIA_mara_patani_talks_desc: "Formální jednání se zastřešující skupinou MARA Patani začínají vážně. Na stole jsou opatření k budování důvěry, bezpečné zóny a skutečný rámec příměří. Kuala Lumpur se zapojuje a povstalecké vedení, roztříštěné, ale skutečné, začíná věřit, že dohoda je možná." # todo: NEW TRANSLATION
 SIA_autonomy_framework: "Rámec zvláštní autonomie" # todo: NEW TRANSLATION
 SIA_autonomy_framework_desc: "Vyjednavači připravují zákon o zvláštní správě tří provincií s volenou regionální radou, vzděláváním v místních jazycích, náboženskými soudy a podílem rozvojových příjmů ponechaným na jihu. Jde o nejdalekosáhlejší ústupek v dějinách Království a bangkocký establishment již mobilizuje proti němu." # todo: NEW TRANSLATION
 SIA_pattani_peace_accord: "Mírová dohoda z Pattani" # todo: NEW TRANSLATION
 SIA_pattani_peace_accord_desc: "Podepsaná dohoda ukončuje nejdelší povstání v moderních dějinách Království. Jih získává určitou míru samosprávy v rámci unitárního Thajska, zbraně jsou odevzdány a vysídlení se vracejí. Je nedokonalá, sporná a historická. Konflikt skončil." # todo: NEW TRANSLATION
 SIA_ds_tier_to_1: "§GHluboký jih se uklidňuje na nízkou úroveň (úroveň 1, -2 % stability).§!" # todo: NEW TRANSLATION
 SIA_ds_tier_to_2: "§YNásilí v Pattani stoupá (úroveň 2, -4 % stability, -5 % politické moci).§!" # todo: NEW TRANSLATION
 SIA_ds_tier_to_3: "§RJih hoří (úroveň 3, -7 % stability, -10 % politické moci, -5 % podpory války).§!" # todo: NEW TRANSLATION
 SIA_ds_intensity_down: "§GIntenzita povstalců klesá o [?ds_delta] bodů.§!" # todo: NEW TRANSLATION
 SIA_ds_intensity_up: "§RIntenzita povstalců stoupá o [?ds_delta] bodů.§!" # todo: NEW TRANSLATION
 SIA_ds_grievance_up: "§RTvrdé metody prohlubují křivdu komunity o [?ds_grievance_delta]. Spolu s ní roste i hranice intenzity a konflikt již nelze vyčerpat pouze silou.§!" # todo: NEW TRANSLATION
 SIA_ds_grievance_down: "§GSkutečný ústupek zmírňuje křivdu komunity ([?ds_grievance_delta]). Hranice intenzity, na níž násilí spočívá, klesá a skutečné řešení se dostává na dosah.§!" # todo: NEW TRANSLATION
 SIA_iron_fist_doctrine_tt: "Zaplaví tři provincie vojáky.\n - Intenzita povstání §G-10§!\n - Riziko převratu §R+10§!\n - Výrazně prohloubí křivdu komunity a zvýší hranici, pod níž konflikt nikdy neklesne" # todo: NEW TRANSLATION
 SIA_martial_law_south_tt: "Mimořádný dekret nad Pattani, Jalou a Narathiwatem. Intenzita -8, prohloubí křivdu, názor Malajsie/Indonésie -." # todo: NEW TRANSLATION
 SIA_search_and_destroy_tt: "Razie proti ozbrojencům. Intenzita -12, prohloubí křivdu. Ke spuštění vyžaduje intenzitu na jihu pod 50. Hrozí zvěrstvo, které se obrátí proti nám." # todo: NEW TRANSLATION
 SIA_pacification_complete_tt: "Zbraně ztichnou, ale žhavé uhlíky zůstanou." # todo: NEW TRANSLATION
 SIA_royal_development_projects_tt: "Projekty z královské iniciativy na jihu. Intenzita -6, zmírní křivdu, +2 % stability, pokladna -3." # todo: NEW TRANSLATION
 SIA_isoc_southern_command_tt: "ISOC přebírá velení na jihu. Intenzita -7 (rychleji, pokud je síť ISOC aktivní), ale sledovací síť mírně podněcuje křivdu." # todo: NEW TRANSLATION
 SIA_winning_hearts_royally_tt: "Patronát a rozvoj. Intenzita -7, výrazně zmírní křivdu, +3 % stability. Ke spuštění vyžaduje intenzitu na jihu pod 40." # todo: NEW TRANSLATION
 SIA_southern_calm_tt: "Kontrolovaný a sledovaný klid pod královskou záštitou." # todo: NEW TRANSLATION
 SIA_peace_dialogue_initiative_tt: "Otevře malajsijský kanál. Intenzita -5, zmírní křivdu, politická moc -75, zahájí jednání." # todo: NEW TRANSLATION
 SIA_mara_patani_talks_tt: "Formální jednání s MARA Patani. Intenzita -8, výrazně zmírní křivdu, názor Malajsie +, vyžaduje 45% stabilitu." # todo: NEW TRANSLATION
 SIA_autonomy_framework_tt: "Připraví zákon o zvláštní zóně. Establishment se postaví na odpor.\n - Intenzita povstání §G-7§!\n - Nejhlubší snížení křivdy komunity ze všech možností\n - Ke spuštění vyžaduje intenzitu na jihu pod §Y35§!" # todo: NEW TRANSLATION
 SIA_pattani_peace_accord_tt: "Podepsaná dohoda a cesta k autonomii. Konflikt končí." # todo: NEW TRANSLATION
 SIA_anti_narcotics_bureau: "Úřad pro boj proti narkotikům" # todo: NEW TRANSLATION
 SIA_anti_narcotics_bureau_desc: "Thajský Úřad rady pro kontrolu narkotik je rozšířen a získává pravomoci: vyhrazený rozpočet, chráněné vyšetřovací pravomoci a formální mandát k pronásledování pašeráckých sítí namísto pouličních dealerů. Úřad cílí na celý dodavatelský řetězec, od laboratoří ve Šanském státě až po distribuční centra v Bangkoku." # todo: NEW TRANSLATION
 SIA_golden_triangle_interdiction: "Zastavení obchodu ve Zlatém trojúhelníku" # todo: NEW TRANSLATION
 SIA_golden_triangle_interdiction_desc: "Trojmezí, kde se setkávají Thajsko, Myanmar a Laos, je zdrojem většiny heroinu a metamfetaminu zaplavujících thajská města a proudících na světové trhy. Hraniční hlídky jsou posíleny, letecký dohled rozšířen a vzniká společná pracovní skupina se šanskými milicemi, která má zásilky zadržet ještě před překročením Mekongu. Drogoví bossové se přizpůsobí, jako vždy, ale náklady se zvýší." # todo: NEW TRANSLATION
 SIA_golden_triangle_interdiction_tt: "Naruší pašerácké trasy přes Mekong a upevní sevření Království nad severem." # todo: NEW TRANSLATION
 SIA_anti_graft_push: "Tažení proti korupci" # todo: NEW TRANSLATION
 SIA_anti_graft_push_desc: "Národní komise pro boj proti korupci získává pravomoci díky rozšířenému vyšetřovacímu mandátu, chráněnému rozpočtu a právní ochraně oznamovatelů. Jako první jsou zacíleny zneužívání zakázek v obraně, stavebnictví a celnictví — tři nejvýnosnější kanály korupce. Čisté zadávání zakázek se buduje pomaleji, než se upevňovalo staré uspořádání. Prosazení reformy spotřebuje politický kapitál a zneklidní veřejnost zvyklou na staré pořádky." # todo: NEW TRANSLATION
 SIA_transparency_watchdog: "Dozor nad transparentností" # todo: NEW TRANSLATION
 SIA_transparency_watchdog_desc: "Je zřízen nezávislý Úřad fiskální transparentnosti, který podléhá přímo parlamentu, nikoli ministerstvu financí. Povinné zveřejňování majetku vyšších úředníků, zveřejňování veřejných zakázek v reálném čase a občanský auditní portál uzavírají mezery, které umožňovaly přetrvávat systematickému odčerpávání renty. Korupce nezmizí, ale její udržování se měřitelně prodraží — a po šest měsíců budou sítě, které úřad odhalí, vzdorovat prostřednictvím procedur a průtahů." # todo: NEW TRANSLATION
 SIA_watchdog_backlash: "Systém vrací úder" # todo: NEW TRANSLATION
 SIA_watchdog_backlash_desc: "Sítě odhalené novým režimem transparentnosti nezmizely. Po šest měsíců budou reformám vzdorovat prostřednictvím procedur, průtahů a tichých obstrukcí, čímž oslabí politickou moc a v provinciích, které jsou s nimi nejvíce propletené, i důvěru veřejnosti." # todo: NEW TRANSLATION
 SIA_decentralize_governance: "Posílit provincie" # todo: NEW TRANSLATION
 SIA_decentralize_governance_desc: "Po tažení proti korupci jsou pravomoci správy a přidělování rozpočtu přesunuty z Bangkoku do provincií. Provinční správní organizace získávají širší mandáty, volení guvernéři kontrolují výdaje na místní infrastrukturu a Chiang Mai, Khon Kaen a Songkhla se stávají skutečnými druhotnými centry hospodářské aktivity. Růst se soustřeďuje pomaleji, ale klidnější a stabilnější cesta udržuje zemi pevnou." # todo: NEW TRANSLATION
 SIA_bangkok_primacy: "Nejprve Bangkok" # todo: NEW TRANSLATION
 SIA_bangkok_primacy_desc: "Výnosy z boje proti korupci jsou znovu investovány do hlavního města. Průmyslové čtvrti Bangkoku jsou modernizovány, výzkumné instituce soustředěny a veřejná doprava rozšířena. Efektivita a výzkumný výkon prudce rostou, kritici však upozorňují, že prosperita se hromadí ve městě s deseti miliony obyvatel, zatímco provincie čekají — a odpor, který to plodí, skutečně zhoršuje náladu v zemi." # todo: NEW TRANSLATION
 SIA_asean_hegemony: "Hegemonie ASEAN" # todo: NEW TRANSLATION
 SIA_asean_hegemony_desc: "Projekt Velkého Thajska je na pevnině dokončen. Nyní Království obrací svůj pohled ke zbytku jihovýchodní Asie. ASEAN byl vždy v duchu thajským projektem. Nechť se jím stane i ve skutečnosti, v případě nutnosti mečem. Generální štáb připravuje plány na podrobení souostroví a městského státu." # todo: NEW TRANSLATION
 SIA_maritime_claims: "Námořní hranice" # todo: NEW TRANSLATION
 SIA_maritime_claims_desc: "Za šíjí leží velké souostrovní státy — Manila, Jakarta a na ropu bohatý sultanát Brunej. Rozvoj námořní síly bude vyžadovat plnou váhu Královského thajského námořnictva a námořní pěchoty. Admiralitní štáb začíná plánovat obojživelné operace přes Jihočínské moře a přístupy k Jávě." # todo: NEW TRANSLATION
 SIA_maritime_claims_threat: "Thajské námořní zbrojení v souostroví" # todo: NEW TRANSLATION
 SIA_claim_philippines: "Podrobit Filipíny" # todo: NEW TRANSLATION
 SIA_claim_philippines_desc: "Filipínské souostroví ovládá východní přístupy k Jihočínskému moři. Přivedení Manily pod správu Bangkoku zajistí námořní křídlo a práci sta milionů Filipínců pro nový řád. Uplatníme svůj nárok na každý ostrov Republiky." # todo: NEW TRANSLATION
 SIA_claim_indonesia: "Podrobit Indonésii" # todo: NEW TRANSLATION
 SIA_claim_indonesia_desc: "Indonésie je obrem jihu — rozlehlým, lidnatým a bohatým na zdroje. Aby Bangkok ovládl ASEAN, musí ovládnout Jakartu. Tažení bude dlouhé a ostrovů bude mnoho, ale odměnou je největší ekonomika a populace jihovýchodní Asie." # todo: NEW TRANSLATION
 SIA_claim_brunei: "Zmocnit se Bruneje" # todo: NEW TRANSLATION
 SIA_claim_brunei_desc: "Malý Brunej leží na jedněch z nejbohatších ložisek uhlovodíků v regionu. Bohatství sultanátu a jeho strategická poloha na Borneu z něj činí neodolatelnou kořist. Přistoupíme k začlenění sultanátu do Království." # todo: NEW TRANSLATION
 SIA_mainland_claims: "Uspořádání pevniny" # todo: NEW TRANSLATION
 SIA_mainland_claims_desc: "Na pevnině dosud nepoklekly dvě mocnosti. Vietnam, starý rival za Annamitským pohořím, a Singapur, bohatý městský stát střežící Malacký průliv. Oba musí být přivedeni k poslušnosti, aby byla thajská převaha v jihovýchodní Asii úplná." # todo: NEW TRANSLATION
 SIA_mainland_claims_threat: "Thajská mobilizace proti posledním pevninským odpůrcům" # todo: NEW TRANSLATION
 SIA_claim_vietnam: "Podrobit Vietnam" # todo: NEW TRANSLATION
 SIA_claim_vietnam_desc: "Vietnam dlouhodobě soupeří s Thajskem o pevninskou jihovýchodní Asii, od dvorů starého Siamu po vražedná pole dvacátého století. Nyní bude historické soupeření rozhodnuto. Uplatníme svůj nárok od Mekongu až k annamitskému pobřeží." # todo: NEW TRANSLATION
 SIA_claim_singapore: "Zmocnit se Singapuru" # todo: NEW TRANSLATION
 SIA_claim_singapore_desc: "Singapur je klenotem průlivu, finanční velmocí a strážcem nejrušnější námořní trasy světa. Kdo drží Lví město, drží hrdlo asijského obchodu. Přeměníme ho v thajské území." # todo: NEW TRANSLATION
 SIA_asean_protector: "Ochránce ASEAN" # todo: NEW TRANSLATION
 SIA_asean_protector_tt: "Cesta partnerství je otevřena každé vládě, včetně mandátu §YVelkého Thajska§!." # todo: NEW TRANSLATION
 SIA_asean_protector_desc: "Velké Thajsko nemusí být říší dobyvačných válek. Po zajištění pevniny se Království může místo toho stát garantem bezpečnosti jihovýchodní Asie — benevolentním hegemonem, který své sousedy chrání, namísto aby je anektoval. Bangkok rozšiřuje svou ochranu po celém regionu a spojuje ASEAN s thajskou korunou aliancí, nikoli okupací." # todo: NEW TRANSLATION
 SIA_guarantee_maritime: "Štít souostroví" # todo: NEW TRANSLATION
 SIA_guarantee_maritime_desc: "Thajsko poskytuje formální bezpečnostní záruky námořním státům — Filipínám, Indonésii a Bruneji. Královské thajské námořnictvo se zaručí za jejich nezávislost a Bangkok se na oplátku stane nepostradatelnou mocností jižních moří." # todo: NEW TRANSLATION
 SIA_guarantee_mainland: "Strážce pevniny" # todo: NEW TRANSLATION
 SIA_guarantee_mainland_desc: "Bangkok zaručuje bezpečnost Vietnamu, Singapuru a Malajsii a ukončuje staletí soupeření dohodou vedenou Thajskem. Starý nepřítel, bohatý městský stát i poloostrovní soused nyní nacházejí útočiště pod ochranou Království a pevnina žije v míru podle thajských podmínek." # todo: NEW TRANSLATION
 SIA_guarantee_indochina: "Deštník nad Indočínou" # todo: NEW TRANSLATION
 SIA_guarantee_indochina_desc: "Nejchudší a nejzranitelnější sousedé Thajska jsou přesně ti, které hegemon obvykle přehlíží. Bangkok jim přesto poskytne záruky: Laosu, Kambodži a Myanmaru i barmským pohraničním státům, kde existují. Ochrana, která dosáhne k nejslabším, je jediným druhem ochrany, který dokazuje, že Království myslí svá slova vážně." # todo: NEW TRANSLATION
 SIA_protector_of_asean_focus: "Jeden ASEAN, jeden štít" # todo: NEW TRANSLATION
 SIA_protector_of_asean_focus_desc: "Jediný podepsaný ochranný deštník stačí ke změně politické dynamiky regionu. Bez ohledu na to, kterou záruku Bangkok rozšířil jako první, Království nyní slouží jako ochránce jihovýchodní Asie a bezpečnostní architektura vedená Thajskem začíná nahrazovat starou rovnováhu strachu. Obrana regionu se stává nedělitelnou a Bangkok drží její základní kámen." # todo: NEW TRANSLATION
 SIA_professional_officer_corps_focus: "Profesionální důstojnický sbor" # todo: NEW TRANSLATION
 SIA_professional_officer_corps_focus_desc: "Reformní frakce vítězí v argumentaci. Povýšení podle schopností, skutečná cesta přes vojenské školy a velitelská kultura založená na doktríně, nikoli patronátu. Zvyk převratů slábne, když se armáda učí být hrdá na vojenství místo politiky." # todo: NEW TRANSLATION
 SIA_martial_prestige_focus: "Sláva meče" # todo: NEW TRANSLATION
 SIA_martial_prestige_focus_desc: "Tradicionalisté vítězí. Ozbrojené síly jsou oslavovány jako duše národa a přehlídkové prostranství je stejně posvátné jako chrám. Morálka a bojový duch prudce rostou, ale kult uniformy udržuje generály blízko centra moci." # todo: NEW TRANSLATION
 SIA_jointness_reform: "Reforma společného velení" # todo: NEW TRANSLATION
 SIA_jointness_reform_desc: "Společné velení spojuje tři složky do jediného bojového nástroje. Sloučením štábů, sdílením doktrín a sjednocením řetězce velení se paralelní velitelská struktura mění v soudržnou sílu schopnou operací ve více doménách." # todo: NEW TRANSLATION
 SIA_defense_export_office: "Úřad pro vývoz obranné techniky" # todo: NEW TRANSLATION
 SIA_defense_export_office_desc: "Specializovaná agentura přivádí systémy thajské výroby na světový trh, zprostředkovává kontrakty, zajišťuje financování a mění obranně-průmyslovou základnu ze zátěže rozpočtu ve zdroj příjmů." # todo: NEW TRANSLATION
 SIA_self_reliant_defense_base: "Soběstačná obranná základna" # todo: NEW TRANSLATION
 SIA_self_reliant_defense_base_desc: "Nové zbrojovky a prohloubený dodavatelský řetězec osvobozují Království od závislosti na zahraničních dodavatelích. Thajsko dokáže vyzbrojit sebe i své zákazníky z vlastních továren, vlastními návrhy a podle vlastního harmonogramu." # todo: NEW TRANSLATION
 SIA_total_defense_doctrine: "Doktrína totální obrany" # todo: NEW TRANSLATION
 SIA_total_defense_doctrine_desc: "Obrana se stává celonárodním úsilím s rozšířenou brannou povinností, pravidelnými cvičeními civilní obrany a posíleným domácím zázemím. Království připravuje nejen armádu, ale celou společnost odhodlanou vzdorovat." # todo: NEW TRANSLATION
 SIA_doctrine_professional_tt: "Vylepší ideu §YProfesionální síly§! na další úroveň a zaváže Království k cestě profesionalizace." # todo: NEW TRANSLATION
 SIA_doctrine_prestige_tt: "Udělí §YBojovou slávu§! a zaváže Království k cestě prestiže, s vysokou podporou války a velitelskou mocí za cenu stability." # todo: NEW TRANSLATION
 SIA_national_rnd_network: "Vybudovat vědecké parky" # todo: NEW TRANSLATION
 SIA_national_rnd_network_desc: "Veřejné laboratoře, partnerství s univerzitami a specializovaný vědecký park v Pathum Thani dávají Království vlastní výzkumnou základnu. Národní agentura pro rozvoj vědy a technologií ukotvuje síť výzkumných a vývojových zařízení, která urychluje zavádění technologií a posouvá celou ekonomiku k průmyslu s vyšší přidanou hodnotou." # todo: NEW TRANSLATION
 SIA_civilian_rnd_center: "Civilní výzkumné a vývojové centrum" # todo: NEW TRANSLATION
 SIA_civilian_rnd_center_desc: "Specializované civilní výzkumné a prototypovací zařízení s laboratořemi, zkušebními stoly a skupinou inženýrů, kteří mohou pracovat na čemkoli, co Království příště potřebuje. Čtvrté výzkumné centrum jako protiváha jediné námořní loděnici, se kterou Království začínalo, a prostor pro vlastní projekty." # todo: NEW TRANSLATION
 SIA_air_rnd_center: "Výzkumné a vývojové centrum letectví" # todo: NEW TRANSLATION
 SIA_air_rnd_center_desc: "Letecké a avionické zařízení s aerodynamickými tunely, vybaveným letovým zkušebním prostorem a inženýry, kteří je dokážou provozovat. Thajský průmysl získává zázemí pro vývoj prototypů leteckých systémů doma, místo aby nakupoval hotové výrobky ze zahraničí." # todo: NEW TRANSLATION
 SIA_army_rnd_center: "Výzkumné a vývojové centrum pozemního vojenství" # todo: NEW TRANSLATION
 SIA_army_rnd_center_desc: "Zkušební polygon pozemních systémů s testovacími drahami pro obrněnou techniku, střelnicemi a konstrukční kanceláří. Armáda může vyvíjet a prototypovat vlastní vozidla a vybavení, místo aby čekala na zahraniční dodavatele a jejich podmínky." # todo: NEW TRANSLATION
 SIA_gistda_space_agency: "Posílit GISTDA" # todo: NEW TRANSLATION
 SIA_gistda_space_agency_desc: "Agentura pro rozvoj geoinformatiky a kosmických technologií dostává skutečný mandát a skutečný rozpočet. GISTDA, založená ke zpracování satelitních dat, se stává kosmickou institucí Království: provozuje pozemní stanice, školí inženýry a poskytuje thajskému výzkumu výhled na vše z výšky. Malý kosmický program již není zahraničním luxusem, ale národní schopností." # todo: NEW TRANSLATION
 SIA_theos_earth_observation: "Pozorování Země pomocí THEOS" # todo: NEW TRANSLATION
 SIA_theos_earth_observation_desc: "První thajská družice pro pozorování Země, THEOS, otevírá Království vlastní oči na oběžné dráze, mapuje území, sleduje povodně a úrodu a poskytuje zpravodajským službám snímky, které jim žádný soused nemůže upřít. Navazující program prohlubuje odbornost agentury v optice, přenosu dat a zpracování snímků a mění surové průlety v použitelný průzkum." # todo: NEW TRANSLATION
 SIA_space_krenovation_park: "Kosmický inovační park" # todo: NEW TRANSLATION
 SIA_space_krenovation_park_desc: "Na Východním pobřeží vyrůstá letecký a kosmický průmyslový park s čistými prostory, montážními halami a dodavatelským řetězcem pro družicové součástky a malé nosné rakety. Z někdejší výzkumné agentury se nyní stává základ domácího kosmického průmyslu, který přitahuje soukromé firmy a dává thajskému inženýrství vlastní odvětví s vysokou přidanou hodnotou." # todo: NEW TRANSLATION
 SIA_sovereign_launch_capability: "Suverénní schopnost vynášení" # todo: NEW TRANSLATION
 SIA_sovereign_launch_capability_desc: "Království se rozhoduje uzavřít poslední mezeru: schopnost navrhnout, vyrobit a vynést na oběžnou dráhu vlastní družice bez svolení kohokoli jiného. Domácí program nosných raket a družicových konstelací korunuje dvě desetiletí práce a řadí Thajsko mezi hrstku států se suverénním opěrným bodem ve vesmíru a zpravodajským dosahem, který se nikomu jinému nezodpovídá." # todo: NEW TRANSLATION
 SIA_ptt_energy_champion: "PTT, národní energetický šampion" # todo: NEW TRANSLATION
 SIA_ptt_energy_champion_desc: "Státní energetická společnost vstupuje na burzu a je uvolněna jako obchodní gigant. S kapitálem z IPO a mandátem k průzkumu od Thajského zálivu po Myanmar zajišťuje PTT dodávky paliva pro Království a stává se jeho největší společností." # todo: NEW TRANSLATION
 SIA_scg_industrial_titan: "Siam Cement Group" # todo: NEW TRANSLATION
 SIA_scg_industrial_titan_desc: "Nejstarší a největší průmyslový konglomerát Království expanduje z cementu do petrochemie, stavebních materiálů a obalů. Zakázky SCG financují stavební boom a ukotvují domácí dodavatelský řetězec, bez něhož se žádný infrastrukturní program neobejde. Spolu s tím rostou i daňové příjmy, i když se skupina stále více opírá o povolovací byrokracii." # todo: NEW TRANSLATION
 SIA_packaging_empire: "Obalové impérium" # todo: NEW TRANSLATION
 SIA_packaging_empire_desc: "Obalová divize SCG vstupuje na burzu a nakupuje po celém regionu, začleňuje papírny od Indonésie po Vietnam, až tiskne a lisuje pro polovinu jihovýchodní Asie. Heslem je oběhové hospodářství: recyklované vlákno, lehčí plasty, nižší uhlíková stopa. Náklady nesou malé tiskárny a výrobci krabic, které skupina vykoupí nebo převálcuje cenami." # todo: NEW TRANSLATION
 SIA_cp_agribusiness_giant: "Charoen Pokphand Group" # todo: NEW TRANSLATION
 SIA_cp_agribusiness_giant_desc: "Od továren na krmiva po 7-Eleven se konglomerát CP stává thajským kolosem zemědělství a maloobchodu. Smluvní zemědělství zvyšuje venkovské příjmy a plní regály, zatímco exportní síla CP nese thajské potraviny na každý asijský trh. Produktivita komercializovaného zemědělství roste napříč sítí smluvních farem a v rýžovém pásu Isánu vyrůstá druhý okres." # todo: NEW TRANSLATION
 SIA_buffer_states: "Pás nárazníkových států" # todo: NEW TRANSLATION
 SIA_buffer_states_desc: "Namísto pohlcení je Thajsko udrží Šany a Kareny naživu a ozbrojené — jako pás přátelských nárazníků, který pohltí barmský tlak dříve, než dosáhne Království. Přeshraniční zásobovací linie, výcvikové tábory a tiché záruky mění pohraniční povstalce ve štít." # todo: NEW TRANSLATION
 SIA_protectorate_doctrine: "Doktrína protektorátu" # todo: NEW TRANSLATION
 SIA_protectorate_doctrine_desc: "Generální štáb se rozhoduje pro mírnější nástroj impéria — ne dobytí, ale vazalství. Pohraniční státečky budou podřízeny thajské ochraně jako klientské státy a jejich prapory zůstanou vlát nad hlavními městy, která odpovídají Bangkoku." # todo: NEW TRANSLATION
 SIA_annexation_doctrine: "Doktrína anexe" # todo: NEW TRANSLATION
 SIA_annexation_doctrine_desc: "Žádná polovičatá řešení. Pohraniční oblasti budou přímo zabrány, jejich území začleněno do Království a separatistické vlády rozpuštěny. Bangkok vznáší nároky na šanské a karenské srdce a připravuje armádu na jejich prosazení." # todo: NEW TRANSLATION
 SIA_subdue_the_shan: "Podrobit Šany" # todo: NEW TRANSLATION
 SIA_subdue_the_shan_desc: "Královská thajská armáda postupuje do Jižního Šanského státu. Zda skončí jako thajský protektorát, nebo thajská provincie, záleží na zvolené doktríně. V každém případě však bude moc Bangkoku sahat až k Salwině." # todo: NEW TRANSLATION
 SIA_subdue_the_karen: "Podrobit Kareny" # todo: NEW TRANSLATION
 SIA_subdue_the_karen_desc: "Thajské síly překračují karenské kopce. Desetiletí útočiště a tichého patronátu končí a Království nyní přichází jako pán — aby podle politiky loutkový stát vytvořilo, nebo území anektovalo." # todo: NEW TRANSLATION
 SIA_burma_breakaway_question: "Odštěpenecké státy" # todo: NEW TRANSLATION
 SIA_burma_breakaway_question_desc: "Na druhé straně Salwiny se barmská moc rozpadla v mozaiku ozbrojených státečků — Šany, Karenové a Wa. Jsou slabí, rozdělení a zcela v dosahu Thajska. Bangkok musí rozhodnout, čím mají tyto odtržené země být pro Království. Štítem, kořistí, nebo problémem ke správě." # todo: NEW TRANSLATION
 SIA_subdue_the_wa: "Podrobit Wa" # todo: NEW TRANSLATION
 SIA_subdue_the_wa_desc: "United Wa State Army řídí nejmocnější a narkotiky nejvíce prosycenou z odštěpeneckých armád. Přivést kopce Wa k poslušnosti znamená tvrdý boj, ale uzavře pašeráckou trasu na prahu Království a zasadí thajskou vlajku hluboko do barmského pohraničí." # todo: NEW TRANSLATION
 SIA_rta_looks_abroad: "Šedesát let s M48" # todo: NEW TRANSLATION
 SIA_rta_looks_abroad_desc: "Královská thajská armáda stále provozuje tanky a transportéry z jiného století. Přezbrojení již není otázkou zda, ale čí ocel projede branami v Koratu a jaké podmínky budou s ní svařeny. Nová výrobní linka vzniká všude, kde to kapacita dovolí." # todo: NEW TRANSLATION
 SIA_stryker_brigades: "Kola Západu" # todo: NEW TRANSLATION
 SIA_stryker_brigades_desc: "Brigády Stryker, americká doktrína a logistický řetězec zapojený přímo do nejschopnější armády světa. Výbava je vynikající a interoperabilita neocenitelná, ale každý náboj se platí dolary i ústupky Washingtonu." # todo: NEW TRANSLATION
 SIA_eda_blackhawks: "Výbava po supervelmoci" # todo: NEW TRANSLATION
 SIA_eda_blackhawks_desc: "Prostřednictvím programů Excess Defense Articles a Foreign Military Sales přilétají repasované Black Hawky a Cobry za zlomek katalogové ceny. Draky již létaly, ale leteckomobilní dosah za dostupnou cenu je výhodou, kterou aliance umožňuje." # todo: NEW TRANSLATION
 SIA_vn1_mechanization: "Obrněný transportér pro každou četu" # todo: NEW TRANSLATION
 SIA_vn1_mechanization_desc: "Transportéry VN1 a VN16 z čínské výrobní linky, po stovkách, za cenu, kterou by na Západě stála hrstka vozidel. Pěchota konečně jede a továrny, které je vyrábějí, jsou zaplaceny ještě před koncem roku." # todo: NEW TRANSLATION
 SIA_norinco_fires: "Kompletní katalog NORINCO" # todo: NEW TRANSLATION
 SIA_norinco_fires_desc: "Houfnice SH1, raketové dělostřelectvo SR5, celý katalog za cenu celého balíčku. Palebná síla je skutečná, stejně jako fronty na náhradní díly a převodovky selhávající v poli. Levná ocel nedá zásobovači spát." # todo: NEW TRANSLATION
 SIA_tavor_standard: "Vlastní puška" # todo: NEW TRANSLATION
 SIA_tavor_standard_desc: "Licencovaná výroba Tavorů mění thajské továrny ve zdroj standardní pušky armády. Žádné embargo, žádné pořadníky, žádné zahraniční veto nad tím, koho vyzbrojíme — jen první kámen arzenálu, který odpovídá výhradně Bangkoku." # todo: NEW TRANSLATION
 SIA_oplot_and_rotors: "Bazarní diplomacie" # todo: NEW TRANSLATION
 SIA_oplot_and_rotors_desc: "Ukrajinské korby Oplot, ruské rotory Mi-17, cokoli trh nabízí kupci, který si nevybírá stranu. Schopnosti proudí ze všech směrů najednou a dráždí Washington i Peking stejnou, zvládnutelnou měrou." # todo: NEW TRANSLATION
 SIA_dti_black_widow: "Černá vdova" # todo: NEW TRANSLATION
 SIA_dti_black_widow_desc: "Vlastní osmikolové vozidlo Defence Technology Institute spolu s bojově prověřeným First Win od Chaiseri. Navrženo v Thajsku, vyrobeno v Thajsku a dost dobré na to, aby ho chtěli kupovat i ostatní. Arzenál se začíná sám financovat." # todo: NEW TRANSLATION
 SIA_first_army_modernized: "Nová Královská thajská armáda" # todo: NEW TRANSLATION
 SIA_first_army_modernized_desc: "Ať už cesta přezbrojení vedla kamkoli, výsledek nyní konečně stojí na přehlídkovém prostranství. Moderní Královská thajská armáda, znovu vybavená, přeškolená a připravená na století, v němž skutečně musí bojovat." # todo: NEW TRANSLATION
 SIA_gripen_globaleye: "Oči celé oblohy" # todo: NEW TRANSLATION
 SIA_gripen_globaleye_desc: "GlobalEye AEW&C od Saabu mění hrstku Gripenů v síťovanou sílu, která uvidí první a vystřelí první. Palubní radar je násobičem síly, díky němuž malé letectvo udeří hluboko nad svou početní váhu." # todo: NEW TRANSLATION
 SIA_j10_squadrons: "Draci nad Don Mueang" # todo: NEW TRANSLATION
 SIA_j10_squadrons_desc: "Víceúčelové stíhačky J-10CE po letkách za cenu, které Washington nikdy nemohl konkurovat a kterou Washington nikdy neodpustí. Volba Čcheng-tu místo Fort Worthu přepojí oblohu Království — i jeho spojenectví." # todo: NEW TRANSLATION
 SIA_hq9_air_defense: "Střecha z raket" # todo: NEW TRANSLATION
 SIA_hq9_air_defense_desc: "Dálkové protiletadlové baterie HQ-9 a FK-3 vytvářejí nad Centrální nížinou deštník. Levný, hustý a integrovaný. Odepření prostoru po čínsku." # todo: NEW TRANSLATION
 SIA_wing_loong_uav: "Trpěliví lovci" # todo: NEW TRANSLATION
 SIA_wing_loong_uav_desc: "Drony Wing Loong a řady CH vydrží kroužit celý den a na povel udeří. Masový bezpilotní průzkum a přesné údery za cenu jediné pilotované letky." # todo: NEW TRANSLATION
 SIA_f5th_super_tigris: "Nové triky starého tygra" # todo: NEW TRANSLATION
 SIA_f5th_super_tigris_desc: "Izraelská avionika, radar AESA a střely Python-5 mění úctyhodný F-5 na F-5TH „Super Tigris“. Není to nový letoun, ale bojová síla vyždímaná z draků, které již byly zaplaceny, bez dluhu vůči kterékoli supervelmoci." # todo: NEW TRANSLATION
 SIA_dti_uav_command: "Suverénní oči" # todo: NEW TRANSLATION
 SIA_dti_uav_command_desc: "Dronové křídlo Defence Technology Institute navržené a provozované v zemi poskytuje Thajsku vlastní obraz průzkumu i výrobek k prodeji sousedům." # todo: NEW TRANSLATION
 SIA_air_dominance_doctrine: "Páni thajského nebe" # todo: NEW TRANSLATION
 SIA_air_dominance_doctrine_desc: "Ať už bylo vybaveno jakkoli, Královské thajské letectvo končí jako moderní, síťovaná a víceúčelová síla, pán vzdušného prostoru, který přísahalo bránit." # todo: NEW TRANSLATION
 SIA_korean_frigates: "Standard Bhumibol" # todo: NEW TRANSLATION
 SIA_korean_frigates_desc: "Západní volba pro flotilu. Moderní fregata DW3000 z Koreje se západními bojovými systémy, oblastní protivzdušnou obranou a nejschopnější hladinovou lodí, jakou flotila kdy provozovala. Kvalita má svou cenu a Soul ji uvádí v dolarech." # todo: NEW TRANSLATION
 SIA_chinese_engine_compromise: "Čínské srdce" # todo: NEW TRANSLATION
 SIA_chinese_engine_compromise_desc: "Německé motory nikdy nepřijdou a loď čeká již deset let. Přijměte čínský pohon CHD620 a ponorka konečně vypluje — levně, suverénně a s obdobím dětských nemocí, které budou inženýři rok proklínat." # todo: NEW TRANSLATION
 SIA_type071_flotilla: "Trupy z Hudongu" # todo: NEW TRANSLATION
 SIA_type071_flotilla_desc: "Výsadková doková loď Type 071E a skupina čínských hlídkových plavidel dají flotile přes noc obojživelnou složku za cenu, kterou by stál jediný západní trup." # todo: NEW TRANSLATION
 SIA_krabi_class_opv: "Vlastní kýly" # todo: NEW TRANSLATION
 SIA_krabi_class_opv_desc: "Nezávislá volba pro flotilu. Pobřežní hlídkové plavidlo třídy Krabi, postavené v Bangkok Dock, pokládá kýl suverénního loďařského průmyslu. Pomalu dozrává, ale odpovídá pouze samo sobě, nikoli zahraniční loděnici." # todo: NEW TRANSLATION
 SIA_european_propulsion: "Licencovaná srdce, thajské trupy" # todo: NEW TRANSLATION
 SIA_european_propulsion_desc: "Nákup, nikoli partnerství. Jednou nakoupit diesely MTU a bojové systémy v licenci, rozebrat je až na šroubky a zbytek postavit doma. Dovezené know-how pohlcené suverénním programem, který nic nedluží žádnému patronovi." # todo: NEW TRANSLATION
 SIA_naval_self_reliance: "Fregaty z Bangkok Dock" # todo: NEW TRANSLATION
 SIA_naval_self_reliance_desc: "Thajské loděnice nyní staví válečné lodě vlastní konstrukce a budují obranně-průmyslovou základnu, která se rozvíjí a exportuje. Flotila je konečně postavena doma." # todo: NEW TRANSLATION
 SIA_command_of_the_seas: "Dva zálivy, jedna flotila" # todo: NEW TRANSLATION
 SIA_command_of_the_seas_desc: "Ať už byla postavena jakkoli, Královské thajské námořnictvo nyní představuje skutečnou oceánskou sílu schopnou držet Thajský záliv a dosáhnout do Andamanského moře, velící mořím omývajícím dvě pobřeží Království." # todo: NEW TRANSLATION
 SIA_the_western_anchor: "Washingtonská kotva v Asii" # todo: NEW TRANSLATION
 SIA_the_western_anchor_desc: "Armáda, letectvo i námořnictvo nakoupené na Západě a aliance jako základní kámen národní obrany. Interoperabilita, sdílení zpravodajství a implicitní americká záruka výměnou za pevné místo ve washingtonské orbitě." # todo: NEW TRANSLATION
 SIA_the_bamboo_bloc: "Do dračího stínu" # todo: NEW TRANSLATION
 SIA_the_bamboo_bloc_desc: "Tři složky vybavené Pekingem činí z Thajska předního čínského klienta v oblasti zbrojení v regionu. Levná masová výroba, sdílený obraz C4ISR a mocný patron — za cenu důvěry Západu." # todo: NEW TRANSLATION
 SIA_strategic_autonomy: "Nikomu zavázáni" # todo: NEW TRANSLATION
 SIA_strategic_autonomy_desc: "Síla budovaná stále více doma a prodávaná do zahraničí. Defence Technology Institute se stává regionálním zbrojním domem a Království již nemusí kvůli prostředkům vlastní obrany odpovídat žádnému cizímu hlavnímu městu." # todo: NEW TRANSLATION
 SIA_the_bamboo_doctrine: "Ohýbat se ve větru" # todo: NEW TRANSLATION
 SIA_the_bamboo_doctrine_desc: "Švédské letouny, čínské tanky, ponorka z Pekingu a fregata ze Soulu. Thajsko nakupuje od všech a nepatří nikomu. Rákos, který se v bouři ohne, ji přežije. Nejstarší thajská strategie vtělená do sestavy ozbrojených sil." # todo: NEW TRANSLATION
 SIA_dual_use_threshold: "Práh dvojího užití" # todo: NEW TRANSLATION
 SIA_dual_use_threshold_desc: "Každý civilní energetický program obsahuje stejné mechanismy, které potřebuje zbrojní program. Tiše zvládnout palivový cyklus, s obohacováním uranu pod rouškou energetické nezávislosti, a ponechat Království všechny možnosti otevřené, aniž by zatím některou vyhlásilo." # todo: NEW TRANSLATION
 SIA_minimum_deterrent: "Minimální odstrašení" # todo: NEW TRANSLATION
 SIA_minimum_deterrent_desc: "Hrstka hlavic, nic víc — dost na to, aby žádný soused ani velmoc již nikdy nepovažovali Království za samozřejmost. Thajsko vstupuje do jaderného klubu za vlastních podmínek a vláda nyní musí nahlas rozhodnout, k čemu jeho bomby slouží." # todo: NEW TRANSLATION
 SIA_the_democrats_endure: "Demokraté přetrvávají" # todo: NEW TRANSLATION
 SIA_the_democrats_endure_desc: "Demokratická strana, nejstarší v Království, si udržuje kontrolu nad vládou místo toho, aby ustoupila populistické vlně. Žádný drtivý triumf, žádný charismatický miliardář, jen trpělivé a neokázalé vládnutí široké civilní koalice. Strana sází svou budoucnost na instituce, nikoli na jediného vůdce." # todo: NEW TRANSLATION
 SIA_chuan_clean_government: "Čistá vláda" # todo: NEW TRANSLATION
 SIA_chuan_clean_government_desc: "Pan Čistý přebírá kormidlo. Pověst osobní neúplatnosti se stává značkou strany — s otevřenými rozpočty, profesionálními ministerstvy a válkou proti obálkám. Nebude to okázalé, ale vytvoří to mechanismus, který promění poctivé vládnutí v trvalou voličskou základnu." # todo: NEW TRANSLATION
 SIA_rule_of_law: "Právní stát" # todo: NEW TRANSLATION
 SIA_rule_of_law_desc: "Vláda, která žije podle ústavy, k jejímuž dodržování se zavázala. Řádný proces, předvídatelná správa a soudy odpovídající zákonu, nikoli kasárnám. Každý převrat začíná pozastavením pravidel, a proto se Království učí je zachovávat." # todo: NEW TRANSLATION
 SIA_judicial_independence: "Nezávislé soudnictví" # todo: NEW TRANSLATION
 SIA_judicial_independence_desc: "Izolovat soudnictví od sítě paláce i generálů. Soud, na který nelze tlačit, je nejjistější brzdou cyklu rozpouštění a převratů a oblíbená zbraň establishmentu — soudní aktivismus — je otupena již u zdroje." # todo: NEW TRANSLATION
 SIA_strengthen_parliament: "Posílit parlament" # todo: NEW TRANSLATION
 SIA_strengthen_parliament_desc: "Dát volené komoře personál, výbory a postavení potřebné ke skutečnému vládnutí. Fungující zákonodárný sbor umožní straně vládnout hlasováním namísto mimořádných dekretů a dá veřejnosti podíl na výsledku každého zasedání." # todo: NEW TRANSLATION
 SIA_liberal_market_stewardship: "Správa liberálního trhu" # todo: NEW TRANSLATION
 SIA_liberal_market_stewardship_desc: "Stabilní měna, otevřený obchod a stát, který reguluje, místo aby utrácel. Demokraté nabízejí technokratickou protiváhu Thaksinově ekonomice, s růstem taženým financemi, exportem a soukromým podnikáním namísto venkovských rozdávání peněz." # todo: NEW TRANSLATION
 SIA_southern_stronghold: "Jižní bašta" # todo: NEW TRANSLATION
 SIA_southern_stronghold_desc: "Srdcem strany je jih a jih má své křivdy. Odpovězme na ně silnicemi, školami a klinikami namísto kontrolních stanovišť, financovanými z pokladny místo slibů na papíře. Mír prostřednictvím rozvoje udrží základnu loajální a připraví povstání o rekruty." # todo: NEW TRANSLATION
 SIA_coalition_government: "Koaliční vláda" # todo: NEW TRANSLATION
 SIA_coalition_government_desc: "Moc je sestavena obtížnou cestou — z mozaiky partnerů, regionálních bloků a malých stran sešitých do fungující většiny. Je pomalá a plná kompromisů, přesto jde o jedinou formu vlády, proti níž se tankům nejhůře zdůvodňuje postup. Volený řád přežívá sdílením moci." # todo: NEW TRANSLATION
 SIA_mature_democracy: "Vyspělá demokracie" # todo: NEW TRANSLATION
 SIA_mature_democracy_desc: "Království překračuje práh pokojného střídání moci s loajální opozicí a veřejností, která může považovat převraty za minulost. Instituce jsou důležitější než jakákoli kampaň: čistší správa a trvalá autorita, zaplacené pomalejším růstem preferencí, než jaký by přinesla širší koalice." # todo: NEW TRANSLATION
 SIA_grand_coalition: "Velká koalice" # todo: NEW TRANSLATION
 SIA_grand_coalition_desc: "Namísto boje se starým řádem jej pohltit. Demokraté se stávají volenou tváří konzervativního establishmentu, získávají vlastníky půdy a podnikatele, zatímco palác, byrokracie a obchodní kruhy vládnou prostřednictvím volebních uren namísto kasáren. Stabilita zakoupená konsensem, za cenu živení stejných patronátních sítí, proti nimž strana kdysi vystupovala." # todo: NEW TRANSLATION
 SIA_coalition_overhead: "Náklady koalice" # todo: NEW TRANSLATION
 SIA_coalition_overhead_desc: "Každý partner přivedený do velkého stanu chce svůj díl. Udržet koalici pohromadě stojí více politického kapitálu než kdy stálo samostatné vládnutí." # todo: NEW TRANSLATION
 SIA_democrat_revival: "Návrat Demokratů" # todo: NEW TRANSLATION
 SIA_democrat_revival_desc: "Ze samoty opoziční pustiny se strana vyškrábe zpět do premiérského úřadu prostřednictvím koaličního bazaru po roce 2019. Demokraté znovu vládnou — starší, pokoření a tentokrát odhodlaní zajistit, aby civilní řád vydržel." # todo: NEW TRANSLATION
 SIA_answer_thaksinomics: "Odpověď na Thaksinovu ekonomiku" # todo: NEW TRANSLATION
 SIA_answer_thaksinomics_desc: "Thaksinův génius spočíval ve sjednocení vesnic, protože Bangkok to nikdy nedokázal. Nepohrdejme vesnickým fondem. Vybudujme lepší. Demokratický program venkovských úvěrů, moratorium na dluhy zemědělců a levné zdravotnictví spuštěný dříve, než to dokáže Thai Rak Thai, otupí populistický apel u jeho zdroje, namísto aby přenechal venkov a získával moc zpět pouze prostřednictvím soudů.\n\n§GPopulistická vlna ustupuje.§!" # todo: NEW TRANSLATION
 SIA_pracha_wiwat: "Lidová agenda" # todo: NEW TRANSLATION
 SIA_pracha_wiwat_desc: "Pracha Wiwat je devět opatření představených jako novoroční dary. Bezplatná elektřina pro nejchudší domácnosti, dotace na vaření plynem, sociální podpora a registrace řidičů mototaxi a pouličních prodejců neformální ekonomiky a spořicí možnost pro pracovníky mimo systém. Důkaz, že liberálně-konzervativní strana dokáže reagovat na nouzi, aniž by zruinovala pokladnu.\n\n§GPopulistická vlna ustupuje.§!" # todo: NEW TRANSLATION
 SIA_contest_every_election: "Soutěžit v každých volbách" # todo: NEW TRANSLATION
 SIA_contest_every_election_desc: "Ať už je provokací zmanipulované předčasné hlasování, amnestie pro uprchlíka nebo zmanipulovaný soud, strana zůstává součástí demokratické hry. Soutěží v každých volbách a přijímá každý výsledek. Je to disciplína, kterou strana opustila v letech 2006 a 2014, a populistům bere jedinou výtku, která se skutečně uchytila: že demokraté vítězí jen tehdy, když za ně vítězí vojáci a soudci.\n\n§GPopulistická vlna ustupuje,§! a dveře do ulic se navždy zavírají." # todo: NEW TRANSLATION
 SIA_the_street_over_the_ballot: "Ulice místo volebních uren" # todo: NEW TRANSLATION
 SIA_the_street_over_the_ballot_desc: "Dost prohrávání u volebních uren. Rezignujte na mandáty strany a vyveďte hnutí do ulic. Protesty ochromí hlavní město a učiní zemi neovladatelnou, dokud zvolená vláda nepadne. Funguje to a hlavní město upadá do chaosu. Generálové využijí záminku, kterou dostali, tanky vyjedou a na stranu, která kdysi stála za čistou civilní vládou, se vzpomíná jako na porodní bábu převratu.\n\n§RKrálovství přechází pod vojenskou vládu. Cesta demokratů zde končí a nový řád má vlastní větev.§!" # todo: NEW TRANSLATION
 SIA_break_into_isan: "Proniknout na severovýchod" # todo: NEW TRANSLATION
 SIA_break_into_isan_desc: "Strukturální změna, kterou strana nikdy neprovedla. Po jednu generaci demokraté ovládali jih a Bangkok a obrovský, chudý severovýchod přenechali Thaksinovi. Věnujte tam místo toho celé desetiletí. Vybudujte místní pobočky, postavte kandidáty a nabídněte Isánu důvěryhodné přerozdělení podle jeho vlastních potřeb. Získejte byť jen opěrný bod v srdci populismu a vlna přijde o svůj pramen. Je to nejtěžší cesta k trvalé moci a jediná, která nezávisí na soudech.\n\n§GOd této chvíle populistická vlna stoupá mnohem pomaleji.§!" # todo: NEW TRANSLATION
 SIA_board_of_investment: "Posílit Investiční radu" # todo: NEW TRANSLATION
 SIA_board_of_investment_desc: "Investiční rada byla vždy tichým motorem Thajska: lákala zahraniční kapitál a vedla thajské firmy do zahraničí. Dejte jí skutečné pravomoci a skutečný rozpočet. Investice budou levnější a rychlejší a každý baht, který Bangkok umístí v zahraničí, se vrátí silnější." # todo: NEW TRANSLATION
 SIA_regional_trade_network: "Regionální obchodní síť" # todo: NEW TRANSLATION
 SIA_regional_trade_network_desc: "Proměňte rozptýlenou řadu bilaterálních dohod v opravdovou síť dohod o volném obchodu napříč ASEAN a za jeho hranicemi. Každá dohoda, kterou Thajsko nyní podepíše, přinese do státní pokladny celní dividendu a rozšíří dosah thajské měkké síly v zahraničí." # todo: NEW TRANSLATION
 SIA_mekong_soft_power: "Měkká síla Mekongu" # todo: NEW TRANSLATION
 SIA_mekong_soft_power_desc: "Bangkok leží v čele Mekongu a řeka pokračuje přes Laos, Kambodžu a Myanmar. Obchod, pomoc a investice se stávají nástroji tichého vedení sousedství. Thajsko nyní může v zahraničí prosazovat svou výhodu, nejen střežit vlastní území." # todo: NEW TRANSLATION
 SIA_regional_trade_network_tt: "Každá podepsaná obchodní dohoda nyní přináší měsíční dividendu do státní pokladny a zvyšuje dosah thajského zahraničního vlivu, obojí s horním limitem." # todo: NEW TRANSLATION
 SIA_trade_dividend_tt: "Thajsko ukládá svou měsíční dividendu ze sítě obchodních dohod." # todo: NEW TRANSLATION
 SIA_trade_diplomacy_network: "Obchodní diplomacie" # todo: NEW TRANSLATION
 SIA_trade_diplomacy_network_tt: "Dosah zahraničního vlivu roste s počtem podepsaných obchodních dohod až do stanoveného limitu." # todo: NEW TRANSLATION
 SIA_crisis_modifier: "Dědictví krize z roku 1997" # todo: NEW TRANSLATION
 SIA_crisis_modifier_desc: "Krize Tom Yum Kung přes noc rozbila zázračnou ekonomiku: baht se propadal, banky byly pohřbené v nesplácených úvěrech a u dveří stál MMF. Každý krok obnovy zaceluje část rány. Království se učí z minulosti a vychází z ní odolnější než dříve." # todo: NEW TRANSLATION
 SIA_economy_modifier: "Thajská ekonomika" # todo: NEW TRANSLATION
 SIA_economy_modifier_desc: "Průběžná bilance ekonomických programů království, od exportní základny a EEC až po národní šampiony a digitální rozvoj. Každá reforma a každý boom zde zanechává svou stopu." # todo: NEW TRANSLATION
 SIA_military_modifier: "Královské thajské ozbrojené síly" # todo: NEW TRANSLATION
 SIA_military_modifier_desc: "Stav vojáků, námořníků a letců království: nákupy výzbroje, doktrína, výcvik a obranný průmysl, který za nimi stojí. Modernizační programy se hromadí zde." # todo: NEW TRANSLATION
 SIA_politics_modifier: "Thajské politické těleso" # todo: NEW TRANSLATION
 SIA_politics_modifier_desc: "Institucionální kostra thajské správy: soudy, parlament, byrokracie a dohody, které drží politiku království pohromadě. Reformy i reakce zde zanechávají svou stopu." # todo: NEW TRANSLATION
 SIA_armed_forces_state: "Stará garda" # todo: NEW TRANSLATION
 SIA_armed_forces_state_desc: "Na každých pár set vojáků připadá jeden generál a skutečný počet je před parlamentem utajován. Povýšení se řídí každoročním seznamem přesunů, předkadetní třídou a frakcí jednotky, nikoli zásluhami. Důstojnický sbor vlastní televizní kanál, golfová hřiště, půdu a sociální programy, které vojáci obsluhují jako neplacená pracovní síla. To vše se platí z pohotovosti a výcviku a mzdový účet jen roste." # todo: NEW TRANSLATION
 SIA_clean_the_banks: "Vyčistit banky" # todo: NEW TRANSLATION
 SIA_clean_the_banks_desc: "Padesát šest uzavřených finančních společností je zlikvidováno prostřednictvím Úřadu pro restrukturalizaci finančního sektoru a Thajská korporace pro správu aktiv odkupuje špatné úvěry z účetních knih. S čistými rozvahami banky znovu půjčují a jeřáby se vracejí na obzor měst." # todo: NEW TRANSLATION
 SIA_dual_track_recovery: "Obnovit domácí poptávku" # todo: NEW TRANSLATION
 SIA_dual_track_recovery_desc: "Po odstranění dluhů obraťte obnovu dovnitř. Levné úvěry, programy venkovských výdajů a podpora malých podniků vloží peníze do rukou těch, kteří je utratí nejrychleji. Růst se rychle vrátí a bude silný, stejně rychle se však začnou hromadit účty a protislužby." # todo: NEW TRANSLATION
 SIA_sufficiency_path: "Odolná obnova" # todo: NEW TRANSLATION
 SIA_sufficiency_path_desc: "Zvolte stabilitu místo rychlosti. Diverzifikované zemědělství, umírněné zadlužování a soběstačné místní ekonomiky znovu vybudují tišší základnu, která přečká další otřes. Boom nikdy nebude burácet, ale očista zasáhne i správu věcí veřejných." # todo: NEW TRANSLATION
 SIA_frontier_integration: "Integrovat pohraničí" # todo: NEW TRANSLATION
 SIA_frontier_integration_desc: "Tažení jsou vyhrána a thajští vojáci drží šanskou náhorní plošinu, karenské kopce a waské vysočiny. Dobýt území a spravovat je jsou dvě odlišné úlohy. Zřídíme správu pro znovuzískané pohraničí, položíme základy prvních silnic a posádek a zahájíme pomalou práci na proměně dobytých obyvatel v občany. Znovuzískané země lze nyní pacifikovat, rozvíjet a časem si je přímo nárokovat pro království." # todo: NEW TRANSLATION
 SIA_the_new_order: "Nový řád na jihu" # todo: NEW TRANSLATION
 SIA_the_new_order_desc: "Nároky jsou vytyčeny od Manily po Malacký průliv a tam, kde pochodovaly naše armády, jsou staré vlajky staženy. Vyhlášená hegemonie není hegemonie, která se udrží. Budujeme mechanismy impéria: guvernéry, posádky a úřady obnovy, aby byly zabrané provincie spravovány, nikoli jen okupovány. Znovuzískané země lze nyní pacifikovat, rozvíjet a trvale začlenit do Velkého Thajska." # todo: NEW TRANSLATION
 SIA_industrial_estates: "Průmyslové areály" # todo: NEW TRANSLATION
 SIA_industrial_estates_desc: "Amata, Hemaraj a Rojana budují soukromé průmyslové areály podél východního pobřeží a přímo lákají japonské a západní továrny. Thajsko se stává dílnou, která hostí exportní boom, s připravenou půdou a energií pro každého výrobce, který dorazí." # todo: NEW TRANSLATION
 SIA_hard_disk_of_the_world: "Pevný disk světa" # todo: NEW TRANSLATION
 SIA_hard_disk_of_the_world_desc: "Seagate, Western Digital a místní dodavatelé jako Delta a Hana proměňují Thajsko v největšího světového montéra pevných disků a předního exportéra elektroniky. Za turistickými pohlednicemi stojí tichý obr, který nenápadně dodává čtvrtinu disků planety." # todo: NEW TRANSLATION
 SIA_thai_union_seafood: "Králové konzerv" # todo: NEW TRANSLATION
 SIA_thai_union_seafood_desc: "Thai Union kupuje Chicken of the Sea a stává se největším světovým konzervárenským zpracovatelem tuňáka, zatímco zpracovatelé v Samut Sakhonu proměňují thajské vody a levnou pracovní sílu v globální impérium mořských plodů. Mražené krevety a konzervované ryby proudí do supermarketů po celém světě a rybářský přístav Samut Sakhon získává námořní základnu odpovídající jeho novému významu." # todo: NEW TRANSLATION
 SIA_retail_kings: "Králové maloobchodu" # todo: NEW TRANSLATION
 SIA_retail_kings_desc: "Central Group rodiny Chirathivatů, Big C a hypermarkety přestavují domácí ekonomiku kolem nákupních center a moderního maloobchodu. CentralWorld se otevírá v roce 2006 a rostoucí spotřebitelská střední třída začíná utrácet, nejen vyvážet." # todo: NEW TRANSLATION
 SIA_beverage_empire: "Bangkokský pivovarník" # todo: NEW TRANSLATION
 SIA_beverage_empire_desc: "ThaiBev Charoena Sirivadhanabhakdiho, výrobce piva Chang a SangSomu, se rozrůstá v regionálního giganta v nápojích a nemovitostech. Buddhistické protesty proti alkoholu mu zabránily v uvedení akcií v Bangkoku, a tak získává kapitál v Singapuru a výnosy nalévá zpět domů. Daňový příjem pro firmy je skutečný, stejně jako odpor zastánců abstinence, který vyvolává." # todo: NEW TRANSLATION
 SIA_fta_decade: "Desetiletí dohod o volném obchodu" # todo: NEW TRANSLATION
 SIA_fta_decade_desc: "Vlna bilaterálních obchodních dohod napojuje exportní stroj na region. Dohoda s Austrálií z roku 2005, partnerství s Japonskem z roku 2007 a čínská dohoda o předčasném uvolnění obchodu se zemědělskými produkty odstraňují cla. Je to skutečná práce napříč vládami, podepsaná rivaly, kteří se na ničem jiném téměř neshodnou." # todo: NEW TRANSLATION
 SIA_sugar_and_ethanol: "Cukroví magnáti" # todo: NEW TRANSLATION
 SIA_sugar_and_ethanol_desc: "Mitr Phol a skupina Thai Roong Ruang rozšiřují oblast pěstování cukrové třtiny v cukrovarnické srdce Asie a mění cukr a maniok v exportní zboží i etanol pro program gasoholu. Zemědělství se konečně diverzifikuje za hranice rýže a biopalivo proudí přímo do národních zásob paliva." # todo: NEW TRANSLATION
 SIA_gems_and_gold: "Drahokamy a zlato" # todo: NEW TRANSLATION
 SIA_gems_and_gold_desc: "Brusiči z Chanthaburi a bangkokský klenotnický obchod činí z Thajska světové centrum broušení a exportu barevných drahokamů. Je to podivuhodné odvětví s vysokou marží a malou ekologickou stopou, které vydělává tvrdou měnu díky dovednostem, nikoli měřítku, a exportní bilance roste s každým kamenem opouštějícím zemi." # todo: NEW TRANSLATION
 SIA_map_ta_phut: "Map Ta Phut" # todo: NEW TRANSLATION
 SIA_map_ta_phut_desc: "PTT a SCG budují své navazující petrochemické impérium v Rayongu a komíny v Map Ta Phut se stávají těžkým srdcem východního pobřeží. Průmysl vzkvétá, i když komunity vedle továren platí cenu v podobě znečištěného vzduchu a vody, a přístav obsluhující komplex rozšiřuje kapacitu, aby stačil." # todo: NEW TRANSLATION
 SIA_ignite_thailand: "IGNITE Thajsko" # todo: NEW TRANSLATION
 SIA_ignite_thailand_desc: "Vláda přijímá dvacetiletou Národní strategii a vizi uzlů IGNITE a konečně označuje past středních příjmů za nepřítele. Thajsko zbohatlo natolik, aby ustrnulo. Mzdy překročily úroveň levné tovární práce, ale nikdy nedosáhly inovační hranice a Vietnam rychle dohání náskok." # todo: NEW TRANSLATION
 SIA_digital_kingdom: "Digitální království" # todo: NEW TRANSLATION
 SIA_digital_kingdom_desc: "Thajsko se představuje jako digitální centrum ASEAN a provozovatelé hyperscalerů si ho začínají všímat. Optická síť, cloudová politika a mladá online populace proměňují zemi ve vážného kandidáta na hlavní podíl regionálního datového provozu." # todo: NEW TRANSLATION
 SIA_data_center_hub: "Cloudová horečka" # todo: NEW TRANSLATION
 SIA_data_center_hub_desc: "Amazon, Google, Microsoft a TikTok nalévají miliardy do datových center v Chonburi a Rayongu. Servery přicházejí rychleji než elektřina a voda potřebné k jejich provozu a síť se začíná pod zátěží namáhat." # todo: NEW TRANSLATION
 SIA_virtual_banks: "PromptPay a virtuální banky" # todo: NEW TRANSLATION
 SIA_virtual_banks_desc: "PromptPay činí Thajsko téměř bezhotovostním: devadesát milionů registrací uskutečňuje desítky milionů převodů denně. Centrální banka uděluje licence bankám fungujícím výhradně digitálně a peníze, které kdysi mizely v hotovosti, nyní zanechávají stopu, kterou může finanční úřad číst." # todo: NEW TRANSLATION
 SIA_bcg_economy: "Bio-cirkulární-zelená ekonomika" # todo: NEW TRANSLATION
 SIA_bcg_economy_desc: "Bio-cirkulární-zelený model mění thajskou biodiverzitu a zemědělskou základnu ve vysoce hodnotný bio-průmysl. Biopaliva, biochemikálie a funkční potraviny začínají nahrazovat plodiny s nízkou marží, které udržovaly venkov v chudobě." # todo: NEW TRANSLATION
 SIA_future_food: "Kuchyně světa 2.0" # todo: NEW TRANSLATION
 SIA_future_food_desc: "CP Foods a potravinářští giganti postupují po hodnotovém řetězci k funkčním potravinám a alternativním proteinům. Thajsko přestává prodávat syrové kalorie a začíná prodávat vědu, která stojí za nimi." # todo: NEW TRANSLATION
 SIA_durian_road: "Durianová cesta" # todo: NEW TRANSLATION
 SIA_durian_road_desc: "Export durianu a tropického ovoce do Číny překračuje šest miliard dolarů ročně. Kamiony s chladicími zařízeními přepravují úrodu na sever přes Laos, zatímco Vietnam a Malajsie bojují o stejné regály v Guangzhou." # todo: NEW TRANSLATION
 SIA_capital_of_capital: "Hlavní město kapitálu" # todo: NEW TRANSLATION
 SIA_capital_of_capital_desc: "Thajská burza se prohlubuje, fond Vayupak roste a konglomeráty jako Gulf přecházejí od energetiky k digitálním technologiím a financím. Bangkok začíná fungovat jako regionální finanční centrum, nikoli jen jako místo, kterým kapitál prochází." # todo: NEW TRANSLATION
 SIA_make_thailand_investor: "Vývozce kapitálu" # todo: NEW TRANSLATION
 SIA_make_thailand_investor_desc: "Thajsko dospívá od přijímání zahraničních peněz k jejich vysílání do zahraničí. Central nakupuje v Evropě, CP provozuje farmy po celém světě a ThaiBev vlastní singapurského nápojového giganta. Přijímající stát se stal státem investujícím." # todo: NEW TRANSLATION
 SIA_escape_the_trap: "Království s vysokými příjmy" # todo: NEW TRANSLATION
 SIA_escape_the_trap_desc: "Národní strategie přináší výsledky a Thajsko překračuje hranici vysokých příjmů. Past, která je po generaci držela pod hranicí rozvoje, je konečně za nimi a dílna se proměnila v bohaté království samo o sobě." # todo: NEW TRANSLATION
 SIA_fta_decade_tt: "Aktivuje síť obchodní diplomacie a podepisuje dohody o volném obchodu tohoto desetiletí." # todo: NEW TRANSLATION
 SIA_escape_trap_two_sectors_tt: "Vyžaduje dvě ze tří vrcholných odvětví. Datová centra, budoucí potraviny nebo investorský národ." # todo: NEW TRANSLATION
 SIA_data_center_grid_strain_tt: "Budování hyperscalerů zatěžuje elektrickou síť. Investujte do energetické větve, abyste udrželi světla rozsvícená." # todo: NEW TRANSLATION
 SIA_sufficiency_and_the_crown: "Soběstačnost a koruna" # todo: NEW TRANSLATION
 SIA_sufficiency_and_the_crown_desc: "Filozofie ekonomiky soběstačnosti krále Bhumibola, zrozená z popela krize Tom Yum Kung, se stává vůdčím národním principem. Umírněnost, vlastní odolnost a rozumnost namísto bezhlavého růstu. Palác a plánovací ministerstvo mluví jedním hlasem a vesnice, která žije v mezích svých možností, bude při příštím otřesu od státu žádat méně." # todo: NEW TRANSLATION
 SIA_sufficiency_gov_gate_tt: "§Y[Communist-State_L]§! ani §Y[socialism_L]§! nejsou vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_new_theory_agriculture: "Nová teorie" # todo: NEW TRANSLATION
 SIA_new_theory_agriculture_desc: "Králova Nová teorie rozděluje farmářský pozemek na rýžové pole, sad, rybník a obydlí, tedy na vyvážený statek, který nejprve uživí rodinu a teprve potom trh. Rýžový pás Isánu přijímá tento model okres po okrese a vyměňuje trochu exportního objemu za farmáře, který v neúrodném roce nikdy nehladoví." # todo: NEW TRANSLATION
 SIA_doi_tung_highlands: "Model Doi Tung" # todo: NEW TRANSLATION
 SIA_doi_tung_highlands_desc: "V kopcích nad Chiang Rai projekt královny matky vytahuje ze země opiový mák a nahrazuje ho kávou, makadamiemi a řemeslnými výrobky. Staré výnosné plodiny Zlatého trojúhelníku ustupují vysočinské ekonomice, která láká návštěvníky místo protidrogových agentů, údolí po údolí." # todo: NEW TRANSLATION
 SIA_chaipattana_water: "Provzdušňovač Chaipattana" # todo: NEW TRANSLATION
 SIA_chaipattana_water_desc: "Králův vlastní patentovaný provzdušňovač, levné lopatkové kolo, které si může dovolit každý vesnický rybník, se šíří povodím Chao Phrayi a čistí vodu zanesenou řasami a odpadem. Je to vynález jako královská služba a rýžová pole Isánu i jihu díky němu o něco lépe odvodňují vodu." # todo: NEW TRANSLATION
 SIA_crown_property_portfolio: "Úřad korunního majetku" # todo: NEW TRANSLATION
 SIA_crown_property_portfolio_desc: "Majetek úřadu, od pozemků pod věžemi Siam Commercial Bank až po akcie Siam Cement Group, činí z koruny jednoho z největších vlastníků půdy a akcionářů v království. Je spravován jako konglomerát a také jako konglomerát zdaňován; tiše vydělává více než polovina ministerstev, kterým odpovídá." # todo: NEW TRANSLATION
 SIA_deepen_sufficiency: "Soběstačné království" # todo: NEW TRANSLATION
 SIA_deepen_sufficiency_desc: "Soběstačnost přestává být venkovskou záchrannou sítí a stává se celou strategií. Místní dodavatelské řetězce, skromná spotřeba a obezřetnost vůči zahraničnímu kapitálu tvrdnou v doktrínu. Autarkie kupuje odolnost vůči otřesům, ale bankéři a konglomeráty sledují, jak jim unikají růstové cíle, a nejsou spokojeni." # todo: NEW TRANSLATION
 SIA_pragmatic_balance: "Střední cesta" # todo: NEW TRANSLATION
 SIA_pragmatic_balance_desc: "Soběstačnost nemusí znamenat izolaci. Malé a střední podniky dál obchodují navenek, zatímco princip soběstačnosti mírní pouze přebytky; vzniká umírněná syntéza místo ústupu. Strop je nižší než u úplné soběstačnosti, ale stejně tak i riziko, že ji někdy budeme potřebovat." # todo: NEW TRANSLATION
 SIA_resilient_kingdom: "Odolné království" # todo: NEW TRANSLATION
 SIA_resilient_kingdom_desc: "Koruna a venkov, palác a rýžové pole jsou vetkány do jediného modelu odolnosti. Ať další krize přinese měnovou nákazu, pandemii nebo otřes v dodavatelských řetězcích, království, které žije v mezích svých možností, bude tím, které po jejím odeznění stále stojí." # todo: NEW TRANSLATION
 SIA_sufficiency_resilience: "Ekonomika soběstačnosti" # todo: NEW TRANSLATION
 SIA_sufficiency_resilience_desc: "Umírněnost, vlastní odolnost a místní resilience, zaseté do venkovské ekonomiky z iniciativy koruny." # todo: NEW TRANSLATION
 SIA_sufficiency_resilience_2: "Prohloubená ekonomika soběstačnosti" # todo: NEW TRANSLATION
 SIA_sufficiency_resilience_2_desc: "Soběstačnost ztvrdla ze záchranné sítě v doktrínu a vyměnila další růst za další odolnost vůči otřesům." # todo: NEW TRANSLATION
 SIA_resilient_kingdom_idea: "Odolné království" # todo: NEW TRANSLATION
 SIA_resilient_kingdom_idea_desc: "Patronát koruny a ekonomika soběstačnosti splynuly v trvalou národní rezervu proti příštímu otřesu." # todo: NEW TRANSLATION
 SIA_tourism_masterplan: "Národní plán cestovního ruchu" # todo: NEW TRANSLATION
 SIA_tourism_masterplan_desc: "Cestovní ruch již podpírá ekonomiku, ale funguje nahodile: letoviska vznikala dříve než kvalitní infrastruktura a hotely předběhly vzdělanou pracovní sílu. Národní plán stanoví regionální cíle, propojí ministerstva a bude s pohostinstvím zacházet jako s průmyslovým odvětvím jako s každým jiným." # todo: NEW TRANSLATION
 SIA_phuket_andaman: "Perla Andamanu" # todo: NEW TRANSLATION
 SIA_phuket_andaman_desc: "Phuket už nyní přitahuje svět na své pláže a nové křídlo letiště spolu s lepšími silnicemi umožní ostrovu přijmout mnohem více návštěvníků. Od Andamanu se očekává, že ponese stále větší podíl devizových příjmů země, a tolik nových cizinců promění pobřeží, na které přijíždějí." # todo: NEW TRANSLATION
 SIA_pattaya_eastern_riviera: "Východní riviéra" # todo: NEW TRANSLATION
 SIA_pattaya_eastern_riviera_desc: "Hotely a pás nočního života v Pattaye stojí převážně na levné, neformální práci. Formalizujte kancelářskou a servisní ekonomiku podél východního pobřeží a každý pracovník, který se dostane do evidence, začne očekávat, že sociální stát skutečně něco poskytne." # todo: NEW TRANSLATION
 SIA_chiang_mai_lanna: "Růže severu" # todo: NEW TRANSLATION
 SIA_chiang_mai_lanna_desc: "Chrámy, horská krajina a pomalejší tempo již přitahují baťůžkáře a digitální nomády na sever. Rozvíjejte turistickou infrastrukturu Chiang Mai a davy budou následovat, stejně jako nájmy, které vytlačí obyvatele čtvrtí, jež návštěvníci přijeli obdivovat." # todo: NEW TRANSLATION
 SIA_rebuild_the_andaman: "Po vlně" # todo: NEW TRANSLATION
 SIA_rebuild_the_andaman_desc: "Tsunami na Boxing Day zpustošilo andamanské pobřeží a následky zkratek přijatých při obnově jsou stále patrné. Řádně financovaná rekonstrukce dokončí práci, kterou nouzová reakce nedokázala, a definitivně uzavře účet za katastrofu." # todo: NEW TRANSLATION
 SIA_medical_wellness_hub: "Skalpel Asie" # todo: NEW TRANSLATION
 SIA_medical_wellness_hub_desc: "Špičkové soukromé nemocnice již léčí pacienty přivážené z celého regionu. Dále rozšiřte odvětví wellness a chirurgické turistiky a thajské kliniky budou přímo soutěžit s nejlepšími zařízeními v Singapuru za zlomek ceny, zatímco domácí pacienti budou čekat za cizinci, kteří platí." # todo: NEW TRANSLATION
 SIA_volume_tourism: "Hra čísel" # todo: NEW TRANSLATION
 SIA_volume_tourism_desc: "Více letů, levnější balíčky, více příjezdů. Usilujte o co nejvyšší počet návštěvníků a devizové příjmy se budou hromadit, ale pláže a historická města vybudovaná pro zlomek tohoto provozu se pod jeho tíhou prohnou a lidé, kteří tam žijí, pocítí tlak dlouho před účetní bilancí." # todo: NEW TRANSLATION
 SIA_high_value_tourism: "Kvalita před kvantitou" # todo: NEW TRANSLATION
 SIA_high_value_tourism_desc: "Méně návštěvníků, kteří utratí mnohem více. Přilákejte trh luxusních letovisek a butikových zážitků místo davů z organizovaných zájezdů a vyměňte počet příjezdů za odvětví cestovního ruchu, které platí skutečné daně a přečká příští pokles v neporušeném stavu." # todo: NEW TRANSLATION
 SIA_tourism_capital: "Nejoblíbenější destinace světa" # todo: NEW TRANSLATION
 SIA_tourism_capital_desc: "Od bangkockého pouličního jídla přes phuketské pláže až po chrámy Chiang Mai se Thajsko stává vzorem rozvoje založeného na cestovním ruchu. Ministerstvo cestovního ruchu přechází od marketingových kampaní k trvalé průmyslové politice a získává k tomu odpovídající pravomoci." # todo: NEW TRANSLATION
 SIA_tourism_boom: "Rozmach cestovního ruchu" # todo: NEW TRANSLATION
 SIA_tourism_boom_desc: "Vlna příjezdů plní hotely i letiště. Jakmile se změní sezóna, příliv opadne." # todo: NEW TRANSLATION
 SIA_host_major_international_event: "Pořádat významnou mezinárodní událost" # todo: NEW TRANSLATION
 SIA_host_major_international_event_desc: "Ucházíme se o summit, světovou výstavu nebo významný sportovní šampionát a na týden dostaneme Thajsko na obrazovky každé televize na planetě. Účet je skutečný, ale stejně skutečná je i bezplatná reklama." # todo: NEW TRANSLATION
 SIA_new_resort_zone: "Otevřít novou rekreační oblast" # todo: NEW TRANSLATION
 SIA_new_resort_zone_desc: "Vymezte a povolte nový úsek pobřeží nebo venkova pro výstavbu letovisek a přilákejte přebytečné investice z pobřeží, která jsou již plná." # todo: NEW TRANSLATION
 SIA_global_amazing_thailand_campaign: "Celosvětová kampaň „Amazing Thailand“" # todo: NEW TRANSLATION
 SIA_global_amazing_thailand_campaign_desc: "Znovu spusťte stěžejní slogan turistického úřadu novou vlnou zahraniční reklamy, účastí na veletrzích cestovního ruchu a influencery na sociálních sítích placenými za to, aby vypadali, že si užívají život naplno." # todo: NEW TRANSLATION
 SIA_baht_and_bourse: "Baht a burza" # todo: NEW TRANSLATION
 SIA_baht_and_bourse_desc: "Bangkokské banky a Thajská burza cenných papírů dávno překonaly zastavárenské půjčovatele z dřívější éry, ale zdejší kapitálové trhy jsou stále mělčí a neformálnější než u sousedů, s nimiž Thajsko soutěží. Koordinovaný tlak rozšíří okruh těch, kteří mohou získávat peníze, i těch, kteří je mohou půjčovat, za cenu předání stejného rostoucího kapitálu těm, kdo dokážou nejrychleji obejít regulátory." # todo: NEW TRANSLATION
 SIA_tamc_workout: "Korporace pro správu aktiv" # todo: NEW TRANSLATION
 SIA_tamc_workout_desc: "Thajská korporace pro správu aktiv vznikla v roce 2001, aby pohltila špatné úvěry, které zanechal krach v roce 1997, a po dvě desetiletí pomalu odprodávala, co mohla, a odepisovala, co nemohla. Konečné uzavření účetnictví fondu uvolní kapitál, který je v něm stále uzamčen, za předpokladu, že ztráty dosud vedené v účetních knihách budou konečně uznány místo jejich převádění do dalšího roku." # todo: NEW TRANSLATION
 SIA_consumer_credit_boom: "Úvěry pro lid" # todo: NEW TRANSLATION
 SIA_consumer_credit_boom_desc: "Kreditní karty, osobní půjčky a splátkové plány se rozšíří z bangkockých nákupních center do provincií a umožní běžným domácnostem utrácet dnes proti zítřejší výplatě. Spotřeba roste a vládní příjmy ji následují, ale obyvatelstvo s takovým množstvím nových spotřebitelských úvěrů si rychle zvykne očekávat, že ho stát zachrání, až nastane čas splácet." # todo: NEW TRANSLATION
 SIA_responsible_lending: "Makroobezřetnostní disciplína" # todo: NEW TRANSLATION
 SIA_responsible_lending_desc: "Thajská banka zpřísní limity poměru úvěru k hodnotě zástavy a úvěrové standardy na hypotečním i spotřebitelském trhu a zvolí pomalejší, pevnější růst místo rychlého. Banky zůstanou solventní a domácnosti nepřekročí své možnosti, ale snadné spotřebitelské úvěry, které živí výdajový boom, nedostanou šanci proudit." # todo: NEW TRANSLATION
 SIA_deepen_the_set: "Prohloubit burzu" # todo: NEW TRANSLATION
 SIA_deepen_the_set_desc: "Na Thajskou burzu cenných papírů vstoupí více společností, zahraniční portfolio manažeři otevřou nové cesty k thajským akciím a trh se stane hlubším i likvidnějším. Větší a propojenější burza však také znamená větší šok v den, kdy se ukáže, že auditované účty kótovaného konglomerátu mají menší hodnotu než papír, na kterém jsou vytištěny." # todo: NEW TRANSLATION
 SIA_vayupak_stabilization: "Fond Vayupak" # todo: NEW TRANSLATION
 SIA_vayupak_stabilization_desc: "Státem podporovaný fond Vayupak je připraven nakupovat, když index klesne příliš hluboko a příliš rychle, a poskytnout drobným investorům oporu během další paniky. Udržování cen akcií penězi ze státní pokladny není totéž jako růst ekonomiky, která za nimi stojí, a účet za zásahy fondu se hradí ze stejného rozpočtu jako všechno ostatní." # todo: NEW TRANSLATION
 SIA_bank_consolidation: "Otázka Krungsri" # todo: NEW TRANSLATION
 SIA_bank_consolidation_desc: "Japonská MUFG drží kontrolní podíl v Bank of Ayudhya, což je jeden z několika znaků, že se thajský bankovní sektor konsoliduje kolem hrstky velkých, často zahraničně ukotvených přeživších. Větší rozvahy absorbují větší otřesy, ale malí a střední věřitelé, kteří kdysi sloužili malým a středním dlužníkům, mizí v pobočkových sítích někoho jiného." # todo: NEW TRANSLATION
 SIA_financial_center: "Vyspělé finanční centrum" # todo: NEW TRANSLATION
 SIA_financial_center_desc: "Bangkok se profiluje jako regionální finanční centrum samo o sobě, jako konkurent Singapuru a Hongkongu, nikoli jako trh, který je pouze zásobuje. Hluboké kapitálové trhy, stabilizovaná burza a konsolidovaný bankovní sektor se spojí v centrum schopné oceňovat riziko a získávat kapitál pro celý region, nejen pro Thajsko." # todo: NEW TRANSLATION
 SIA_financial_center_idea: "Vyspělé finanční centrum" # todo: NEW TRANSLATION
 SIA_financial_center_idea_desc: "Hluboké kapitálové trhy, stabilizovaná burza a konsolidovaný bankovní sektor dávají Thajsku finanční centrum, které oceňuje riziko a získává kapitál pro celý region, nejen pro sebe." # todo: NEW TRANSLATION
 SIA_the_ground_beneath: "Půda pod námi" # todo: NEW TRANSLATION
 SIA_the_ground_beneath_desc: "Národní geologický průzkum se pokusí zmapovat, co se skutečně nachází pod půdou Království a jeho kontinentálním šelfem, od ložisek potaše na severovýchodě po pánve s plynem v zálivu. Zjistit, co se tam nachází, je snadná část. Rozhodnout, jak usilovně to těžit a kdo zaplatí, když se těžba pokazí, přijde na řadu poté." # todo: NEW TRANSLATION
 SIA_extractive_drive: "Těž, zlato, těž" # todo: NEW TRANSLATION
 SIA_extractive_drive_desc: "Povolení se vydávají rychle a těžebnímu sektoru je nařízeno vyrábět v maximálním objemu a s minimálními prodlevami. Vývozní příjmy rostou a lobbisté fosilních paliv dostávají vše, o co žádali, ale každý důl a vrt nyní potřebuje více pracovních sil než ten předchozí a zemědělci, jejichž půda a voda jsou těžbě nejblíže, si toho všimnou jako první." # todo: NEW TRANSLATION
 SIA_stewarded_extraction: "Těžit pro národ" # todo: NEW TRANSLATION
 SIA_stewarded_extraction_desc: "Těžba probíhá podle podmínek státu, nikoli trhu: pomalejší povolování, skutečné posuzování dopadů na životní prostředí a menší plocha každé koncese. Půda vydá méně než při volnější ruce, ale se zemědělci a vlastníky půdy žijícími vedle jam a vrtů se nebude zacházet jako s vedlejšími škodami." # todo: NEW TRANSLATION
 SIA_udon_potash: "Potaš Isánu" # todo: NEW TRANSLATION
 SIA_udon_potash_desc: "Rozsáhlá ložiska potaše v Isánu, jedny z největších na světě a z velké části nedotčené, budou konečně uvedena do provozu. Nové šachty a zpracovatelské závody slibují domácí průmysl hnojiv, ale hranice koncesí vedou přímo přes půdu, kterou drobní vlastníci a rýžová družstva obdělávají po celé generace." # todo: NEW TRANSLATION
 SIA_chatree_gold_tin: "Zlato, cín a sádrovec" # todo: NEW TRANSLATION
 SIA_chatree_gold_tin_desc: "Komplex Chatree a sousední doly získávají ze středních plání zlato, cín a sádrovec, čímž vedle obchodu s drahokamy, kterým je Bangkok již proslulý, vzniká skutečný, byť nepříliš okázalý těžební sektor. Vesnice pod odkališti pečlivě a stále hlasitěji sledují, co prosakuje do podzemních vod." # todo: NEW TRANSLATION
 SIA_gulf_gas_oca: "Oblast překrývajících se nároků" # todo: NEW TRANSLATION
 SIA_gulf_gas_oca_desc: "Thajsko a Kambodža nechaly po desetiletí nevyužitý úsek zálivu bohatý na plyn, místo aby vyřešily, komu patří. Jednostranný postup v oblasti překrývajících se nároků znamená kapitálově náročné průzkumné vrty dlouho předtím, než se jediný kubický metr dostane na pobřeží, a souseda, který s ničím z toho nesouhlasil." # todo: NEW TRANSLATION
 SIA_resource_sovereignty: "Suverenita nad zdroji" # todo: NEW TRANSLATION
 SIA_resource_sovereignty_desc: "Potaš, základní kovy a plyn se spojí v těžební sektor, který se zodpovídá Bangkoku, nikoli tomu, kdo je zrovna nakupuje. Z někdejšího příběhu koncesí rozprodávaných po částech se stane Království, které už nemusí žádat o svolení k tomu, co vychází z jeho vlastní půdy." # todo: NEW TRANSLATION
 SIA_resource_sovereignty_2of3_tt: "Dokončil alespoň 2 ze 3 projektů těžby zdrojů" # todo: NEW TRANSLATION
 SIA_the_digital_consumer: "Digitální spotřebitel" # todo: NEW TRANSLATION
 SIA_the_digital_consumer_desc: "Thajci stále častěji využívají bankovnictví, nakupují a rezervují online místo čekání u přepážky. Agoda, platforma pro rezervaci cest, která vyrostla z malé kanceláře na Phuketu, ukazuje, že domácí digitální podnik může konkurovat komukoli. Vybudovat infrastrukturu, důvěru a daňovou základnu pod tímto posunem je nyní národním projektem." # todo: NEW TRANSLATION
 SIA_promptpay_rails: "PromptPay" # todo: NEW TRANSLATION
 SIA_promptpay_rails_desc: "PromptPay umožňuje převádět peníze mezi telefonními čísly a čísly občanských průkazů během několika sekund, bez bankovní pobočky či poplatku za převod. Formalizace takového množství transakcí vytáhne část hotovostní ekonomiky na světlo a zprostředkovatelé, kteří dříve těžili z této neprůhlednosti, si toho okamžitě všimnou." # todo: NEW TRANSLATION
 SIA_super_app_economy: "Superaplikace" # todo: NEW TRANSLATION
 SIA_super_app_economy_desc: "Grab, LINE MAN a jejich konkurenti spojují odvoz, rozvoz jídla a kurýrní práci do jediné aplikace, kterou má každý Thajec již otevřenou. Zisky z efektivity jsou skutečné, stejně jako absence jakékoli smlouvy, výhod nebo místa u vyjednávacího stolu pro řidiče a kurýry, kteří aplikace udržují v chodu." # todo: NEW TRANSLATION
 SIA_ecommerce_marketplaces: "Zapojení malých a středních podniků" # todo: NEW TRANSLATION
 SIA_ecommerce_marketplaces_desc: "Lazada a Shopee poskytují malým výrobcům a prodejcům ze stánků výlohu, která osloví zákazníky daleko za hranicemi jejich provincie a často i za hranicemi Thajska. K tomu je třeba vybudovat sklady a doručovací flotily, což nejprve ubere z toho, co mají tržiště přinést." # todo: NEW TRANSLATION
 SIA_national_digital_champions: "Dvě skupiny, jeden trh" # todo: NEW TRANSLATION
 SIA_national_digital_champions_desc: "Místo dohledu nad otevřenou soutěží stát podpoří několik národních platforem a nechá je konsolidovat trh. Koncentrovaný digitální sektor se snadno zdaňuje a reguluje, ale trh bez skutečného konkurenta nemá mnoho důvodů udržovat své ceny poctivé." # todo: NEW TRANSLATION
 SIA_open_digital_market: "Rozbít duopol" # todo: NEW TRANSLATION
 SIA_open_digital_market_desc: "Antimonopolní pravidla a požadavky na přenositelnost otevřených dat udrží menší platformy schopné soutěžit, místo aby dvě největší aplikace rozdělily trh mezi sebou. Spotřebitelé si zachovají výhody skutečné konkurence, za cenu úhledných daňových příjmů, které by přinesl národní šampion." # todo: NEW TRANSLATION
 SIA_the_outward_turn: "Obrat navenek" # todo: NEW TRANSLATION
 SIA_the_outward_turn_desc: "Po desetiletí proudil thajský kapitál jedním směrem, do továren a hotelů určených cizincům. Jiná generace konglomerátů nyní hledá vlastní růst v zahraničí, nakupuje podíly a buduje továrny napříč regionem, který býval zákazníkem Thajska, nikoli jeho cílem." # todo: NEW TRANSLATION
 SIA_leveraged_expansion: "Koupit svět" # todo: NEW TRANSLATION
 SIA_leveraged_expansion_desc: "Půjčte si proti silné rozvaze a vydejte se rychle nakupovat do zahraničí. Akvizice financované dluhem rychle rozšíří portfolio, ale každé aktivum koupené na úvěr se může stejně rychle propadnout pod vodu." # todo: NEW TRANSLATION
 SIA_organic_expansion: "Rozvíjet, co vlastníme" # todo: NEW TRANSLATION
 SIA_organic_expansion_desc: "Místo půjčování na nákupy rozšiřujte to, co již thajské konglomeráty ovládají: více poboček, větší kapacitu, více trhů, financované z vlastních výnosů. Je to pomalejší a nikdy se to nedostane na titulní stránku obchodního časopisu, ale nic takto koupeného není třeba ve spěchu prodávat." # todo: NEW TRANSLATION
 SIA_cp_into_china: "Certifikát 0001" # todo: NEW TRANSLATION
 SIA_cp_into_china_desc: "V roce 1990 se Charoen Pokphand stal prvním zahraničním investorem, který koupil podíl na znovuotevřené Šanghajské burze cenných papírů, s certifikátem číslo 0001. O tři desetiletí později sahá čínské portfolio CP od pojišťovny Ping An až po krmivárny po celé zemi, sázka, která nepřestala vynášet, i když vyprázdnila část toho, co CP kdysi pěstoval doma." # todo: NEW TRANSLATION
 SIA_thaibev_conquers_asean: "Říše pivního barona" # todo: NEW TRANSLATION
 SIA_thaibev_conquers_asean_desc: "Vietnamská společnost ThaiBev Beverage převezme v roce 2017 kontrolu nad Saigon Beer za téměř pět miliard dolarů a poté do stejného portfolia začlení singapurské nápojové a realitní impérium Fraser and Neave. Jeden thajský konglomerát nyní vlastní významnou část toho, co zbytek regionu pije." # todo: NEW TRANSLATION
 SIA_scg_long_son: "Long Son povstává" # todo: NEW TRANSLATION
 SIA_scg_long_son_desc: "Petrochemický komplex Siam Cement Group na vietnamském poloostrově Long Son štěpí naftu na surovinu pro plasty, kterou thajské továrny vždy musely dovážet. Kapacita vybudovaná v zahraničí se po dokončení betonových konstrukcí vrací domů jako levnější a stabilnější dodavatelský řetězec." # todo: NEW TRANSLATION
 SIA_central_minor_abroad: "Nákupní centra a hotely v zahraničí" # todo: NEW TRANSLATION
 SIA_central_minor_abroad_desc: "Central Group získává prostřednictvím rakouské skupiny Signa podíly v Selfridges, KaDeWe a Illum, zatímco hotelové značky Minor International se šíří z Bangkoku přes Maledivy až do Lisabonu. Thajské peníze z maloobchodu a pohostinství nyní vlastní obchody a hotelové lobby, do nichž jejich vlastní zákazníci nikdy nevkročili." # todo: NEW TRANSLATION
 SIA_ptt_banpu_resources: "Vrtat ve světě" # todo: NEW TRANSLATION
 SIA_ptt_banpu_resources_desc: "Těžební pole PTTEP sahají od Ománu přes Mosambik až k vodám sdíleným s Malajsií a uhelné koncese Banpu procházejí Austrálií a Indonésií. Thajsko si zajišťuje zdroje, které doma nemá, a váže se na stejný komoditní cyklus, jakému by podléhal domácí důl." # todo: NEW TRANSLATION
 SIA_outbound_statecraft: "Investice jako státní nástroj" # todo: NEW TRANSLATION
 SIA_outbound_statecraft_desc: "Obchody přestanou být samostatnými sázkami a stanou se jednotným národním postojem, v němž thajský kapitál slouží stejně tak jako nástroj zahraniční politiky jako zdroj zisku. Vyhrazený úřad nyní řídí akviziční potrubí a představenstva poloviny ASEAN částečně odpovídají Bangkoku." # todo: NEW TRANSLATION
 SIA_outbound_statecraft_3of5_tt: "Dokončil alespoň 3 z 5 zahraničních expanzních obchodů" # todo: NEW TRANSLATION
 SIA_thai_multinationals: "Thajské nadnárodní společnosti" # todo: NEW TRANSLATION
 SIA_thai_multinationals_desc: "Thajské firmy přerostou domácí trh a začnou se chovat jako nadnárodní společnosti, kterým kdysi pouze sloužily. Zahraniční dosah je skutečný, ale každý baht a každá hodina manažerů vyslaná do zahraničí je hodinou a bahtem, které nebyly vynaloženy na budování domova." # todo: NEW TRANSLATION
 SIA_overseas_deal_boom: "Boom zahraničních obchodů" # todo: NEW TRANSLATION
 SIA_overseas_deal_boom_desc: "Další akvizice byla uzavřena a zisky z území za hranicemi Thajska proudí zpět do mechanismu, který ji uzavřel." # todo: NEW TRANSLATION
 SIA_overseas_acquisitions_category: "Zahraniční akvizice" # todo: NEW TRANSLATION
 SIA_overseas_acquisitions_category_desc: "Thajské konglomeráty dál nakupují v zahraničí. Pátrejte po dalším cíli, uzavírejte obchody nebo pořádejte globální roadshow celého portfolia, pokud to pokladna dovolí." # todo: NEW TRANSLATION
 SIA_scout_overseas_targets: "Pátrat po zahraničních cílech" # todo: NEW TRANSLATION
 SIA_scout_overseas_targets_desc: "Vyšlete obchodní týmy, aby si prohlédly prostory další akvizice, než kdokoli cokoli podepíše. Skromný a krátkodobý přehled o tom, kam by měl příště zamířit thajský kapitál." # todo: NEW TRANSLATION
 SIA_close_the_deal: "Uzavřít obchod" # todo: NEW TRANSLATION
 SIA_close_the_deal_desc: "Podepište dokumenty k dalšímu podílu, dceřiné společnosti nebo trvalé koncesi. Peníze odcházející ze státní pokladny jsou skutečné, za aktivum, které teprve musí prokázat, že stálo za svou cenu." # todo: NEW TRANSLATION
 SIA_global_ma_roadshow: "Globální roadshow fúzí a akvizic" # todo: NEW TRANSLATION
 SIA_global_ma_roadshow_desc: "Vyšlete obchodníky konglomerátů na cestu po Singapuru, Hongkongu a Londýně, kde budou prezentovat thajský kapitál bankéřům i představenstvům cílových společností. Samotná publicita podpoří další kolo obchodů." # todo: NEW TRANSLATION
 thailand.1.t: "Všeobecné volby 2001" # todo: NEW TRANSLATION
 thailand.1.d: "Dne 6. ledna 2001 Thajci hlasují v prvních všeobecných volbách podle Lidové ústavy. O hlasy soupeří tři síly. Program Thai Rak Thai, založený na vesnických fondech, moratoriu na dluhy a všeobecné zdravotní péči, elektrizoval venkov. Palácová síť a její spojenci na vojenských základnách dávají přednost tomu, aby udrželi vládce pod kontrolou. Vládnoucí Demokraté slibují stabilní, neokázalé vedení. To, kam nyní vložíme svou váhu, určí, koho si země zvolí." # todo: NEW TRANSLATION
 thailand.1.a: "Podpořit Thai Rak Thai a venkovský převrat." # todo: NEW TRANSLATION
 thailand.1.b: "Semknout palácovou síť a generály." # todo: NEW TRANSLATION
 thailand.1.c: "Udržet Demokraty u moci." # todo: NEW TRANSLATION
 thailand.2.t: "Vláda generálních ředitelů" # todo: NEW TRANSLATION
 thailand.2.d: "Nová vláda nastupuje do úřadu s příslibem řídit Thajsko jako úspěšnou společnost. Kabinet zaplní podnikatelé, ministerstva dostanou výkonnostní cíle a politika se začne pohybovat rychlostí, jakou byrokracie dosud nezažila." # todo: NEW TRANSLATION
 thailand.2.a: "Thajsko je otevřené podnikání." # todo: NEW TRANSLATION
 thailand.3.t: "Válka proti drogám" # todo: NEW TRANSLATION
 thailand.3.d: "V únoru 2003 vláda vyhlásila tříměsíční kampaň za vymýcení obchodu s metamfetaminem. Vytvářejí se provinční černé listiny a stanovují kvóty. Na jejím konci organizace na ochranu lidských práv zdokumentují 2 800 zabití, z nichž mnohá nebyla nikdy řádně vyšetřena. Kampaň je v médiích populární, ale v zahraničí odsuzovaná." # todo: NEW TRANSLATION
 thailand.3.a: "Pokračovat v kampani bez omezení." # todo: NEW TRANSLATION
 thailand.3.b: "Tiše ji ukončit." # todo: NEW TRANSLATION
 thailand.4.t: "Zářijový převrat" # todo: NEW TRANSLATION
 thailand.4.d: "Dne 19. září 2006 je premiér v New Yorku na Valném shromáždění OSN. Mezitím projíždějí Bangkokem tanky, ústava je zrušena a Rada pro demokratickou reformu oznamuje, že pokojně převzala kontrolu nad vládou. Davy nosí vojákům květiny, zatímco venkovská většina mlčky přihlíží." # todo: NEW TRANSLATION
 thailand.4.a: "Nechat armádu převzít odpovědnost." # todo: NEW TRANSLATION
 thailand.4.b: "Dosadit civilní loutkovou vládu." # todo: NEW TRANSLATION
 thailand.5.t: "Soudní rozpuštění" # todo: NEW TRANSLATION
 thailand.5.d: "Ústavní soud projednává případ volebních podvodů proti největší opoziční straně. Rozpuštění by na pět let zakázalo politickou činnost jejímu vedení a sťalo hnutí, aniž by jediný voják opustil kasárna." # todo: NEW TRANSLATION
 thailand.5.a: "Stranu rozpustit." # todo: NEW TRANSLATION
 thailand.5.b: "Nechat hrozbu viset nad nimi." # todo: NEW TRANSLATION
 thailand.6.t: "NCPO přebírá moc" # todo: NEW TRANSLATION
 thailand.6.d: "Dne 22. května 2014, po měsících protestů a dvou dnech vyhlášeného stanného práva, svolá velitel armády soupeřící frakce do Armádního klubu a zatkne je v konferenční místnosti. Velitel armády oznamuje, že Národní rada pro mír a pořádek převezme kontrolu nad vládou. Dokud nebudou demokratické instituce stabilní, nebude stanoven žádný pevný harmonogram voleb." # todo: NEW TRANSLATION
 thailand.6.a: "Pořádek je obnoven." # todo: NEW TRANSLATION
 thailand.7.t: "Rudé košile obsazují náměstí" # todo: NEW TRANSLATION
 thailand.7.d: "Sjednocená fronta pro demokracii proti diktatuře zaplavuje obchodní centrum Bangkoku a požaduje odstoupení vlády a nové volby. Na Ratchaprasongu vyrůstají barikády a po městě hoří pneumatiky i budovy. Kamery celého světa sledují, co armáda udělá dál." # todo: NEW TRANSLATION
 thailand.7.a: "Vyčistit náměstí." # todo: NEW TRANSLATION
 thailand.7.b: "Vyjednávat a počkat, až je to přejde." # todo: NEW TRANSLATION
 thailand.8.t: "Obsazení letišť" # todo: NEW TRANSLATION
 thailand.8.d: "V listopadu 2008 obsadili demonstranti ve žlutých košilích letiště Suvarnabhumi a Don Mueang, uvěznili 300 000 cestujících a ochromili letecký obchod země. Obléhání skončilo až poté, co soudní rozhodnutí svrhlo vládu, proti níž protestovali." # todo: NEW TRANSLATION
 thailand.8.a: "Sečíst náklady." # todo: NEW TRANSLATION
 thailand.9.t: "Tři požadavky" # todo: NEW TRANSLATION
 thailand.9.d: "Studentské davy, větší než kterékoli od roku 1992, formulují tři požadavky. Rozpustit parlament, přestat zastrašovat kritiky a napsat novou ústavu. Z pódia v Bangkoku jsou během jediného večera prolomeny tabu, která po generace určovala thajský veřejný projev." # todo: NEW TRANSLATION
 thailand.9.a: "Podpořit všechny tři požadavky." # todo: NEW TRANSLATION
 thailand.9.b: "Prosazovat pouze to, co parlament schválí." # todo: NEW TRANSLATION
 thailand.10.t: "Článek 112 na pořadu jednání" # todo: NEW TRANSLATION
 thailand.10.d: "Parlament obdrží návrh na změnu zákona o urážce majestátu. Omezuje, kdo může podávat stížnosti, snižuje tresty a ukončuje jeho používání proti politickému projevu. Žádný thajský zákonodárný sbor se dosud neodvážil o této otázce hlasovat jmenovitě. Každá instituce starého řádu je nyní v pohybu." # todo: NEW TRANSLATION
 thailand.10.a: "Vyvolat hlasování." # todo: NEW TRANSLATION
 thailand.11.t: "Krize kolem rozpuštění" # todo: NEW TRANSLATION
 thailand.11.d: "Ústavní soud rozhoduje, že kampaň za změnu představuje pokus svrhnout demokratický režim s králem v čele státu. Strana je rozpuštěna a její představitelé mají zakázanou politickou činnost. Hnutí musí začít znovu pod novým názvem, se stejnými lidmi, jako už tolikrát." # todo: NEW TRANSLATION
 thailand.11.a: "Do pátku zaregistrujeme novou stranu." # todo: NEW TRANSLATION
 thailand.12.t: "Establishment vrací úder" # todo: NEW TRANSLATION
 thailand.12.d: "V hlavním městě se pohybují armádní jednotky bez rozkazů vlády. Starý řád rozhodl, že experiment zašel dostatečně daleko. To, co se stane během příštích šesti hodin, rozhodne, zda bude éra reforem pokračovat, nebo se připojí k dlouhému seznamu přerušených thajských demokracií." # todo: NEW TRANSLATION
 thailand.12.a: "Vyvolat lid do ulic." # todo: NEW TRANSLATION
 thailand.12.b: "Ustoupit, abychom zachránili hnutí." # todo: NEW TRANSLATION
 thailand.13.t: "Otázka republiky" # todo: NEW TRANSLATION
 thailand.13.d: "Vláda vypisuje referendum o samotné ústavní podobě státu, o otázce, kterou žádná thajská vláda dosud nepředložila lidu. Ať už bude výsledek jakýkoli, nic v Království už nebude stejné." # todo: NEW TRANSLATION
 thailand.13.a: "Předložit otázku lidu." # todo: NEW TRANSLATION
 thailand.13.b: "Referendum stáhnout." # todo: NEW TRANSLATION
 thailand.14.t: "Nová vláda" # todo: NEW TRANSLATION
 thailand.14.d: "Dne 13. října 2016 Úřad královské domácnosti oznamuje úmrtí Jeho Veličenstva krále Bhumibola Adulyadeje, Rámy IX., po sedmdesáti letech na trůně, což je nejdelší vláda v thajských dějinách. Korunní princ nastupuje jako král Maha Vajiralongkorn, Ráma X. Jak vláda přechod označí a jak rychle se posune dál, je nyní rozhodnutím Bangkoku." # todo: NEW TRANSLATION
 thailand.14.a: "Otevřeně potvrdit novou vládu." # todo: NEW TRANSLATION
 thailand.14.b: "Nechat obřady proběhnout." # todo: NEW TRANSLATION
 thailand.14.c: "Vyvážit obřad s kontinuitou." # todo: NEW TRANSLATION
 thailand.15.t: "Dynastie pokračuje" # todo: NEW TRANSLATION
 thailand.15.d: "Zakladatel hnutí už nemůže vést stranu osobně, ale jeho jméno si zachovává vliv na voliče. Otázkou před stranou je, kdo ji povede do příštích voleb." # todo: NEW TRANSLATION
 thailand.15.a: "Yingluck Shinawatra povede kandidátku." # todo: NEW TRANSLATION
 thailand.15.b: "Srettha Thavisin povede kandidátku jako realitní magnát za podnikatelské křídlo." # todo: NEW TRANSLATION
 thailand.15.c: "Paetongtarn Shinawatra povede kandidátku a jméno přežije do nové generace." # todo: NEW TRANSLATION
 thailand.15.e: "Postavit stroj nad jméno." # todo: NEW TRANSLATION
 thailand.16.t: "Thaksin navždy" # todo: NEW TRANSLATION
 thailand.16.d: "Výroční stranický sjezd hlasuje o zrušení vnitřních časových limitů a udělení mimořádných pravomocí vedení nad výběrem kandidátů, stranickou kandidátkou a koaliční politikou. Opoziční lavice jsou prázdné od kohokoli důležitého. Volby se budou dál konat a dál vyhrávat." # todo: NEW TRANSLATION
 thailand.16.a: "Jeden vůdce, jedna strana, jedno Thajsko." # todo: NEW TRANSLATION
 thailand.17.t: "Obnova trůnu" # todo: NEW TRANSLATION
 thailand.17.d: "Parlament, Tajná rada a ozbrojené síly společně žádají palác, aby převzal přímou správu státních institucí. Ústavní fikce minulého století je odložena. Dynastie Chakri obnovuje roli, kterou zastávala před rokem 1932." # todo: NEW TRANSLATION
 thailand.17.a: "Ať žije král." # todo: NEW TRANSLATION
 thailand.18.t: "Systém z roku 2017" # todo: NEW TRANSLATION
 thailand.18.d: "Nová ústava projde referendem za omezení kampaně, která učinila opozici trestným činem. Plně jmenovaný Senát pomůže vybírat budoucí premiéry a dvacetiletá Národní strategie zaváže každou budoucí vládu. Volby se obnoví, ale uvnitř plotu." # todo: NEW TRANSLATION
 thailand.18.a: "Řízená demokracie tedy bude." # todo: NEW TRANSLATION
 thailand.19.t: "Království jde k volbám" # todo: NEW TRANSLATION
 thailand.19.d: "Dne 6. ledna 2001 se ve všech šestasedmdesáti provinciích otevírají volební místnosti. Jde o první hlasování podle Lidové ústavy, počítané nezávislou komisí místo ministerstva vnitra, a první, v němž může strana s jasným vítězstvím vládnout bez měsíců koaličního handrkování." # todo: NEW TRANSLATION
 thailand.19.a: "Nechat sčítání začít." # todo: NEW TRANSLATION
 thailand.20.t: "Tribunál rozpouští stranu" # todo: NEW TRANSLATION
 thailand.20.d: "Ústavní tribunál rozhoduje, že vládnoucí strana zaplatila menším stranám za postavení kandidátů ve zrušených volbách, a nařizuje její rozpuštění. Sto jedenáct jejích představitelů má na pět let zakázanou politickou činnost. Verdikt odstraní název strany, její registraci i vedení, ale nedotkne se jediného jejího voliče. Během několika týdnů stejní poslanci podávají žádost o novou registraci pod novým praporem a stroj na severovýchodě neztratí jediný okrsek." # todo: NEW TRANSLATION
 thailand.20.a: "Znovu se čistě zaregistrovat pod novým vedením." # todo: NEW TRANSLATION
 thailand.20.b: "Zakázaní představitelé ji budou dál řídit zvenčí." # todo: NEW TRANSLATION
 thailand.21.t: "Dvůr vyprazdňuje komoru" # todo: NEW TRANSLATION
 thailand.21.d: "Druhé rozpuštění, a tentokrát s sebou bere i vládní stranu. Rozhodnutí také ruší starý národně-konzervativní blok, jehož provinční bossové nyní drží ve svých rukou početní převahu v komoře a ucházejí se o ně obě strany. Jejich vůdce má zákaz činnosti, ale není umlčen, a vyjednává z domu v Buriramu. Pokud jeho poslanci odejdou, opozice sestaví vládu bez voleb. Pokud je lze udržet, koalice přežije a všichni budou přesně vědět, jakou cenu to mělo." # todo: NEW TRANSLATION
 thailand.21.a: "Nechte je odejít a dovolte Demokratům zkusit vládnout." # todo: NEW TRANSLATION
 thailand.21.b: "Dorovnejte cokoli, co jim bylo nabídnuto." # todo: NEW TRANSLATION
 SIA_bench_hands_power_to_democrats_tt: "Komora se znovu schází s §YDemokratickou stranou§! ve vládě." # todo: NEW TRANSLATION
 thailand.50.t: "Z krize Tom Yum Kung" # todo: NEW TRANSLATION
 thailand.50.d: "Tři roky poté, co se zhroutil baht, ekonomika opět roste. Továrny na východním pobřeží znovu nabírají zaměstnance a program MMF, který začal v ponížení, předbíhá plán." # todo: NEW TRANSLATION
 thailand.50.a: "To nejhorší máme za sebou." # todo: NEW TRANSLATION
 thailand.51.t: "MMF odchází" # todo: NEW TRANSLATION
 thailand.51.d: "V červenci 2003 Thajsko splácí poslední část svých závazků vůči MMF o dva roky dříve, než se očekávalo. Premiér tuto příležitost připomíná televizním projevem, v němž prohlašuje, že ekonomická nezávislost země byla obnovena." # todo: NEW TRANSLATION
 thailand.51.a: "Už nikdy." # todo: NEW TRANSLATION
 thailand.52.t: "Tsunami na Boxing Day" # todo: NEW TRANSLATION
 thailand.52.d: "Dne 26. prosince 2004 podmořské zemětřesení u Sumatry vysílá tsunami na thajské andamanské pobřeží. Khao Lak a Phuket jsou zpustošeny a v Thajsku umírá více než 5 000 lidí, z nichž mnozí jsou zahraniční turisté. Svět sleduje naši reakci." # todo: NEW TRANSLATION
 thailand.52.a: "Při záchranných pracích nešetřete." # todo: NEW TRANSLATION
 thailand.52.b: "Minimální reakce." # todo: NEW TRANSLATION
 thailand.53.t: "Velká povodeň" # todo: NEW TRANSLATION
 thailand.53.d: "Monzunové vody stékající povodím Chao Phrayi zaplavují dvě třetiny provincií země a dosahují k průmyslovým areálům severně od Bangkoku. Globální výroba pevných disků se v zaplavených thajských továrnách zastavuje. Hlavní město staví hráze z pytlů s pískem a čeká." # todo: NEW TRANSLATION
 thailand.53.a: "Mobilizujte vše." # todo: NEW TRANSLATION
 thailand.53.b: "Chraňte Bangkok a nechte provincie odtéct." # todo: NEW TRANSLATION
 thailand.54.t: "Program garantovaných cen rýže" # todo: NEW TRANSLATION
 thailand.54.d: "Vláda navrhuje vykoupit celou sklizeň rýže za polovinu nad tržní cenou, převést miliardy zemědělským domácnostem a vsadit na růst světových cen. Ekonomové varují, že sklady se naplní a ztráty budou historické. Zemědělci, kteří nás zvolili, čekají." # todo: NEW TRANSLATION
 thailand.54.a: "Garantujte každý zrnek." # todo: NEW TRANSLATION
 thailand.54.b: "Tiše program odložte." # todo: NEW TRANSLATION
 thailand.55.t: "Detroit Asie" # todo: NEW TRANSLATION
 thailand.55.d: "Výroba vozidel překračuje hranici jednoho milionu kusů. Thajsko je nyní největším výrobcem automobilů v jihovýchodní Asii a předním světovým producentem jednotunových pick-upů." # todo: NEW TRANSLATION
 thailand.55.a: "Nalákejte Toyotu a Hondu a otevřete jim dveře." # todo: NEW TRANSLATION
 thailand.56.t: "Rok návštěvy Thajska" # todo: NEW TRANSLATION
 thailand.56.d: "Bangkok je jedním z nejnavštěvovanějších měst světa. Od Khao San Road po pláž Karon hostí Království celý svět a výdaje turistů plní kapsy milionů Thajců." # todo: NEW TRANSLATION
 thailand.56.a: "Sawasdee." # todo: NEW TRANSLATION
 thailand.56.b: "Investujte do samotného odvětví." # todo: NEW TRANSLATION
 thailand.57.t: "Otázka ponorek" # todo: NEW TRANSLATION
 thailand.57.d: "Zakázka námořnictva na ponorky S26T čínské výroby se stala celonárodní otázkou. Jsou to první lodě dvouoceánského loďstva, nebo miliardy utracené za motory, které dodavatel nedokáže dodat? Rozhodnutí o nákupu nyní leží na stole vlády." # todo: NEW TRANSLATION
 thailand.57.a: "Kupte ponorky." # todo: NEW TRANSLATION
 thailand.57.b: "Program zrušte." # todo: NEW TRANSLATION
 thailand.100.t: "Ztracená území" # todo: NEW TRANSLATION
 thailand.100.d: "Státní média oživují staré mapy. Provincie postoupené Francii v letech 1893, 1904 a 1907 a sultanáty postoupené Británii v roce 1909. Vyprávění o národním ponížení z éry Phibuna se vrací do učebnic a znovu se probouzí hnutí, které žádná vláda nevyvolala od roku 1945." # todo: NEW TRANSLATION
 thailand.100.a: "Co bylo odňato, může být vráceno." # todo: NEW TRANSLATION
 thailand.101.t: "Bratři za Salwinem" # todo: NEW TRANSLATION
 thailand.101.d: "Bangkok formálně vyhlašuje svůj zájem o osud Taiů ze Šanského státu, kteří jsou s Thaji spřízněni jazykem i krví a po celé generace válčí s barmskou juntou. Prohlášení se zastavuje těsně před územním požadavkem. Nikdo v regionu si jeho význam neplete." # todo: NEW TRANSLATION
 thailand.101.a: "Taiové jsou jeden národ." # todo: NEW TRANSLATION
 thailand.102.t: "Mekong je thajská řeka" # todo: NEW TRANSLATION
 thailand.102.d: "Vláda formálně odmítá francouzsko-siamské smlouvy z let 1893 a 1904 jako dokumenty podepsané pod nátlakem. Bezprostřední nárok se týká Champasaku, ale hlasy ve vládní straně se ptají, proč by měl nárok končit u provincií, které Francie náhodou zakreslila." # todo: NEW TRANSLATION
 thailand.102.a: "Uplatněte nárok na území z roku 1904." # todo: NEW TRANSLATION
 thailand.102.b: "Prohlašte celý Laos za zemi Taiů." # todo: NEW TRANSLATION
 thailand.103.t: "Patová situace u Preah Vihear" # todo: NEW TRANSLATION
 thailand.103.d: "Výměna dělostřelecké palby kolem chrámu na vrcholu útesu, nejhorší od roku 2011, poskytuje Bangkoku záminku. Vláda oznamuje, že již neuznává rozhodnutí ICJ z roku 1962, a uplatňuje nárok na Battambang a Siem Reap, siamské provincie ještě v živé paměti." # todo: NEW TRANSLATION
 thailand.103.a: "Uplatněte nároky." # todo: NEW TRANSLATION
 thailand.103.b: "Nároky a ultimátum." # todo: NEW TRANSLATION
 thailand.104.t: "Odmítnutí smlouvy z roku 1909" # todo: NEW TRANSLATION
 thailand.104.d: "Ministerstvo zahraničí formálně odmítá anglo-siamskou smlouvu z roku 1909, kterou byly bangkocké malajské vazalské státy převedeny na Britské impérium. Kelantan a Terengganu jsou jmenovány přímo. Kuala Lumpur během hodiny odvolává svého velvyslance." # todo: NEW TRANSLATION
 thailand.104.a: "Uplatněte nárok na Kelantan a Terengganu." # todo: NEW TRANSLATION
 thailand.104.b: "Požadujte všechny postoupené sultanáty." # todo: NEW TRANSLATION
 thailand.105.t: "Suvannaphum" # todo: NEW TRANSLATION
 thailand.105.d: "Zlatá země kronik, svět Taiů sjednocený pod jedinou vlajkou. Vláda prohlašuje program sjednocení v zásadě za dokončený. Zbývá učinit obnovená území thajskými nejen jménem, ale i správou." # todo: NEW TRANSLATION
 thailand.105.a: "Vztyčte jedinou vlajku od Salwinu až k moři." # todo: NEW TRANSLATION
 thailand.105.b: "Pozastavte postup. Nejprve nechte armádu upevnit pozice." # todo: NEW TRANSLATION
 thailand.106.t: "Integrace šanských zemí" # todo: NEW TRANSLATION
 thailand.106.d: "Thajská správa, thajské školy a thajská infrastruktura dosahují šanské náhorní plošiny. Integrační komise hlásí, že nové provincie jsou připraveny k úplnému začlenění do Království." # todo: NEW TRANSLATION
 thailand.106.a: "Vítejte doma." # todo: NEW TRANSLATION
 thailand.107.t: "Integrace laoských zemí" # todo: NEW TRANSLATION
 thailand.107.d: "Mekongské provincie dokončují správní integraci. Řeka již není hranicí." # todo: NEW TRANSLATION
 thailand.107.a: "Vítejte doma." # todo: NEW TRANSLATION
 thailand.108.t: "Integrace khmerských provincií" # todo: NEW TRANSLATION
 thailand.108.d: "Battambang a Siem Reap, v dávných úředních záznamech Phra Tabong a Siemmarat, se poprvé od roku 1946 vracejí pod thajskou správu." # todo: NEW TRANSLATION
 thailand.108.a: "Vítejte doma." # todo: NEW TRANSLATION
 thailand.109.t: "Integrace jižních provincií" # todo: NEW TRANSLATION
 thailand.109.d: "Bývalé sultanáty dokončují své začlenění. Století britské a malajské správy končí. Začíná obtížnější úkol zajistit, aby vše fungovalo." # todo: NEW TRANSLATION
 thailand.109.a: "Vítejte doma." # todo: NEW TRANSLATION
 thailand.110.t: "Svět reaguje" # todo: NEW TRANSLATION
 thailand.110.d: "Ve všech sousedních hlavních městech probíhají mimořádná zasedání. Základní princip ASEANu, nedotknutelnost hranic z koloniální éry, byl odmítnut zakládajícím členem. Velvyslanci jsou odvoláváni, cvičení pozastavována a staří přátelé začínají Thajsko popisovat novou slovní zásobou." # todo: NEW TRANSLATION
 thailand.110.a: "Přizpůsobí se." # todo: NEW TRANSLATION
 thailand.150.t: "Oheň na jihu" # todo: NEW TRANSLATION
 thailand.150.d: "Dne 4. ledna 2004 ozbrojenci přepadli armádní sklad v Narathiwatu, zabili vojáky a zmocnili se stovek zbraní. Napříč malajsko-muslimskými provinciemi Hlubokého jihu následovalo koordinované žhářství. Separatistické povstání, které bylo dvě desetiletí nečinné, se vrátilo." # todo: NEW TRANSLATION
 thailand.150.a: "Jih nás prověří." # todo: NEW TRANSLATION
 thailand.151.t: "Incident na Hlubokém jihu" # todo: NEW TRANSLATION
 thailand.151.d: "Další týden, další silniční bomba, další střelba na kontrolním stanovišti v Yala, Pattani nebo Narathiwatu. Konflikt pokračuje tempem, které se Bangkok naučil snášet, zatímco Jih nikoli." # todo: NEW TRANSLATION
 thailand.151.a: "Vytrvejte." # todo: NEW TRANSLATION
 thailand.152.t: "Tvrdá ruka" # todo: NEW TRANSLATION
 thailand.152.d: "Bezpečnostní operace na Hlubokém jihu končí smrtí zadržených a armáda obhajuje své metody. Vyšetřování jsou přislíbena, ale obžaloby nepřicházejí. Za hranicemi i napříč muslimským světem pracují záběry proti nám." # todo: NEW TRANSLATION
 thailand.152.a: "Řád má svou cenu." # todo: NEW TRANSLATION
 thailand.153.t: "Jednání v Kuala Lumpuru" # todo: NEW TRANSLATION
 thailand.153.d: "Thajští představitelé zasedají naproti zástupcům BRN u stolu, který připravili malajští zprostředkovatelé. Program je skromný a zahrnuje bezpečnostní zóny, péči o vězně a samotné uznání dialogu. Po letech popírání existence války je rozhovor ústupkem." # todo: NEW TRANSLATION
 thailand.153.a: "Udržujte jednání při životě." # todo: NEW TRANSLATION
 thailand.154.t: "Mírová dohoda" # todo: NEW TRANSLATION
 thailand.154.d: "Byl podepsán rámec autonomie pro provincie Patani. Přináší volenou regionální správu, výuku v malajštině vedle thajštiny, mechanismy spravedlnosti pro zločiny konfliktu a postupný konec bezpečnostní přítomnosti. Nejdelší válka uvnitř thajských hranic končí podpisy." # todo: NEW TRANSLATION
 thailand.154.a: "Mír na jihu." # todo: NEW TRANSLATION
 thailand_news.1.t: "Puč v Bangkoku" # todo: NEW TRANSLATION
 thailand_news.1.d: "Královská thajská armáda převzala moc v Bangkoku, pozastavila platnost ústavy a odvolala zvolenou vládu. Vojenské rady vládly Thajsku opakovaně od roku 1932 a trhy i diplomatické kruhy nyní odhadují, jak dlouho hodlá tato zůstat." # todo: NEW TRANSLATION
 thailand_news.1.a: "Zase?" # todo: NEW TRANSLATION
 thailand_news.2.t: "Thajsko si činí nárok na „ztracená území“" # todo: NEW TRANSLATION
 thailand_news.2.d: "Bangkok formálně vznesl nárok na území postoupená před stoletím Francii a Británii a oživil iredentistický program, o němž nebylo slyšet od druhé světové války. Hlavní města jihovýchodní Asie reagují znepokojeně." # todo: NEW TRANSLATION
 thailand_news.2.a: "Znepokojivé." # todo: NEW TRANSLATION
 thailand_news.3.t: "Republika v Siamu?" # todo: NEW TRANSLATION
 thailand_news.3.d: "Thajsko uspořádá referendum o budoucnosti své monarchie, což je otázka bez obdoby v moderních dějinách Království. Region zadržuje dech." # todo: NEW TRANSLATION
 thailand_news.3.a: "Bezprecedentní." # todo: NEW TRANSLATION
 thailand_news.4.t: "Thajsko truchlí za králem Bhumibolem" # todo: NEW TRANSLATION
 thailand_news.4.d: "Král Bhumibol Adulyadej, nejdéle vládnoucí monarcha světa, zemřel v Bangkoku ve věku 88 let. Thajsko zahajuje rok smutku za jediného krále, kterého většina Thajců kdy poznala. Jeho syn jej nastupuje jako král Maha Vajiralongkorn, Ráma X." # todo: NEW TRANSLATION
 thailand_news.4.a: "Jedna éra končí." # todo: NEW TRANSLATION
 thailand.58.t: "Bažina kobr" # todo: NEW TRANSLATION
 thailand.58.d: "Nong Ngu Hao, „Kobří bažina“, pohlcuje peníze už od 70. let. Nyní z ní skutečně vyrůstá nové letiště — a s ním i náklady. Problémy s odvodněním, popraskané pojezdové dráhy, dodavatelé účtující dvakrát za stejný beton. Správní rada chce více peněz, nebo více času." # todo: NEW TRANSLATION
 thailand.58.a: "Nalijte do projektu peníze a otevřete podle plánu." # todo: NEW TRANSLATION
 thailand.58.b: "Nechte termín sklouznout." # todo: NEW TRANSLATION
 thailand.59.t: "Brána do Asie" # todo: NEW TRANSLATION
 thailand.59.d: "Suvarnabhumi otevírá své brány. Je to skleněný a ocelový terminál, jeden z největších na světě, vybudovaný s cílem postavit Bangkok do středu každé mapy asijských leteckých tras. Tabule s prvními přílety vypadá jako sen ministerstva turismu." # todo: NEW TRANSLATION
 thailand.59.a: "Království má nové vstupní dveře." # todo: NEW TRANSLATION
 thailand.60.t: "Stavba na východě" # todo: NEW TRANSLATION
 thailand.60.d: "Východní ekonomický koridor existuje na papíře a nyní musí někdo zaplatit beton. Z Pekingu přicházejí delegace s nabídkami financování zahalenými do jazyka Pásu a stezky. Ministerstvo financí může peníze získat i doma, pomaleji a bez podmínek." # todo: NEW TRANSLATION
 thailand.60.a: "Získejte čínský kapitál." # todo: NEW TRANSLATION
 thailand.60.b: "Vydejte domácí dluhopisy." # todo: NEW TRANSLATION
 thailand.61.t: "Překročení rozpočtu železnice" # todo: NEW TRANSLATION
 thailand.61.d: "Ražba tunelů pod třemi letišti měla být vždy drahá, ale nikdo kabinet neinformoval, jak drahá. Trať ke třem letištím potřebuje další tranši, nebo skromnější plány." # todo: NEW TRANSLATION
 thailand.61.a: "Zaplaťte. Páteř bude vybudována celá." # todo: NEW TRANSLATION
 thailand.61.b: "Omezte rozsah." # todo: NEW TRANSLATION
 thailand.62.t: "Pás a stezka přichází" # todo: NEW TRANSLATION
 thailand.62.d: "Vysokorychlostní trať z Kunmingu přes Vientiane do Bangkoku. Chybějící střed čínského indočínského koridoru vede přes thajské území a Peking by jej velmi rád financoval. Podmínky jsou velkorysé. Jsou to však stále podmínky." # todo: NEW TRANSLATION
 thailand.62.a: "Podepište memorandum o železnici." # todo: NEW TRANSLATION
 thailand.62.b: "Vyjednávejte znovu, pomalu, po thajsku." # todo: NEW TRANSLATION
 thailand.63.t: "Otázka koncesí" # todo: NEW TRANSLATION
 thailand.63.d: "Opoziční senátoři sčítají, jak si státní telekomunikační koncese vedly od chvíle, kdy jejich největší držitel sestavil vládu. Upravené daně, prodloužené licence, prověření konkurentů. Slovo „náhoda“ odvádí v oficiálních odpovědích těžkou práci." # todo: NEW TRANSLATION
 thailand.63.a: "Odprodejte podíly. Utrpí pokladna, ale získáme čistou pověst." # todo: NEW TRANSLATION
 thailand.63.b: "Zatloukejte to. Čísla vyhrávají volby, právníci kupují čas." # todo: NEW TRANSLATION
 thailand.64.t: "Zúčtování s dluhy domácností" # todo: NEW TRANSLATION
 thailand.64.d: "Vesnické fondy vybudovaly obchody, motocykly a mlýny na rýži, vše na úvěr. Průměrný dluh venkovské domácnosti se téměř zdvojnásobil a účetní knihy družstev se začínají kývat. Banky chtějí pokyny před sezonou refinancování." # todo: NEW TRANSLATION
 thailand.64.a: "Zachraňte družstva. Moratorium nás něco stojí, ale zachrání vesnice." # todo: NEW TRANSLATION
 thailand.64.b: "Nechte úvěry utáhnout. Trh se opraví, ale vesnice to pocítí." # todo: NEW TRANSLATION
 thailand.65.t: "Offsety a Erieye" # todo: NEW TRANSLATION
 thailand.65.d: "Na stole leží poslední nabídka Saabu. Gripeny s úplným přístupem ke zdrojovému kódu, palubní radar Erieye, partnerství s univerzitami a práce na komponentách pro thajský průmysl — vše za určitou cenu. Nebo stejné stíhačky bez doplňků za výrazně méně." # todo: NEW TRANSLATION
 thailand.65.a: "Vezměte celý balík." # todo: NEW TRANSLATION
 thailand.65.b: "Pouze draky. Dbejte na rozpočet." # todo: NEW TRANSLATION
 thailand.66.t: "Problém s motory" # todo: NEW TRANSLATION
 thailand.66.d: "Německo neudělí licenci na dieselové motory pro čínskou exportní ponorku, takže napůl zaplacený trup S26T ve Wu-chanu čeká na své srdce. Peking nabízí vlastní motory a slevu. Námořnictvo předkládá kabinetu volbu mezi několika ostudami." # todo: NEW TRANSLATION
 thailand.66.a: "Přijměte čínské motory a převezměte dodávku." # todo: NEW TRANSLATION
 thailand.66.b: "Požadujte jako náhradu trup fregaty." # todo: NEW TRANSLATION
 thailand.66.c: "Zrušte smlouvu úplně." # todo: NEW TRANSLATION
 thailand.67.t: "Znovuzrozená vlajková loď" # todo: NEW TRANSLATION
 thailand.67.d: "Bezpilotní letouny na skokanském můstku, bezpilotní čluny v hangárovém prostoru, řídicí konzole tam, kde kdysi rezivěly náhradní díly pro Harriery. HTMS Chakri Naruebet se vrací do Sattahipu s profilem mise, který žádné jiné námořnictvo v regionu nedokáže napodobit." # todo: NEW TRANSLATION
 thailand.67.a: "Ukažte ji před kamerami na přehlídce." # todo: NEW TRANSLATION
 thailand.67.b: "Tiché znovuzařazení do služby, zpět do práce." # todo: NEW TRANSLATION
 thailand.68.t: "Devadesát dní strachu" # todo: NEW TRANSLATION
 thailand.68.d: "Černé listiny se proměnily v seznamy mrtvých. Za tři měsíce zemřelo více než dva tisíce lidí, mnozí bez jakéhokoli drogového spojení, které by vyšetřovatelé dokázali najít. Venkov tleská, nemocnice se plní a schránka ministerstva zahraničí se plní ještě rychleji." # todo: NEW TRANSLATION
 thailand.68.a: "Pokračujte. Kampaň funguje." # todo: NEW TRANSLATION
 thailand.68.b: "Ukončete ji a nařiďte přezkoumání." # todo: NEW TRANSLATION
 thailand.69.t: "Nespokojenost v důstojnickém klubu" # todo: NEW TRANSLATION
 thailand.69.d: "Jsou zde všechny známky, které se každá bangkocká vláda naučí číst. Neobvyklá převelení do Prvního armádního regionu, penzionovaní generálové náhle oblíbení v televizních rozhovorech a sraz jezdců v kasárnách, kterého se účastnila polovina vrchního velení." # todo: NEW TRANSLATION
 thailand.69.a: "Proveďte čistku ve velení." # todo: NEW TRANSLATION
 thailand.69.b: "Vyjděte generálům vstříc." # todo: NEW TRANSLATION
 thailand.69.c: "Veřejně se jim postavte." # todo: NEW TRANSLATION
 thailand.70.t: "Tanky u sídla vlády" # todo: NEW TRANSLATION
 thailand.70.d: "Začíná to jako vždy. Běžný program nahrazuje vlastenecká hudba, na křižovatkách stojí obrněná vozidla a přichází komuniké od „rady“, o které včera nikdo neslyšel. Vláda má několik minut na rozhodnutí, za co je ochotna zaplatit." # todo: NEW TRANSLATION
 thailand.70.a: "Sjednoťte loajalisty a vzdorujte." # todo: NEW TRANSLATION
 thailand.70.b: "Ustupte a nastupte do letadla." # todo: NEW TRANSLATION
 thailand.70.c: "Vyjednejte vládu národní jednoty." # todo: NEW TRANSLATION
 thailand.70.c_tooltip: "§YGenerálové vstoupí do kabinetu, nikoli do paláce.§!\nVolby přežijí (§Gbez pozastavení voleb§!) a tlak na puč klesne na §Y35§!. Království zaplatí cenu ve stabilitě a politickém kapitálu a §Yneklidný kompromis§! bude po dobu 180 dní zatěžovat vládu." # todo: NEW TRANSLATION
 thailand.71.t: "Mládež v ulicích" # todo: NEW TRANSLATION
 thailand.71.d: "Organizují se na Telegramu, citují Hamtaro a Hunger Games a zaplňují památníky po desítkách tisíc. Své požadavky píší na papírová letadla, která házejí přes zábrany. Rozpusťte parlament, přepište ústavu, reformujte nedotknutelné instituce." # todo: NEW TRANSLATION
 thailand.71.a: "Rozežeňte shromáždění. Na řád se nečeká." # todo: NEW TRANSLATION
 thailand.71.b: "Otevřete dialog. Ustupte v tónu, ne v podstatě." # todo: NEW TRANSLATION
 thailand.71.c: "Vyčkejte je. Unaví se dříve než my." # todo: NEW TRANSLATION
 thailand.155.t: "Hořící region" # todo: NEW TRANSLATION
 thailand.155.d: "Koordinované žhářství ve třech provinciích během jediné noci. Kontrolní stanoviště napadena za denního světla. Učitelé pod eskortou, školy zavřené na celý semestr. Jih nehořel takto celou generaci a Rada národní bezpečnosti chce rozhodnutí." # todo: NEW TRANSLATION
 thailand.155.a: "Zaplavte jih vojáky." # todo: NEW TRANSLATION
 thailand.155.b: "Zavolejte do Kuala Lumpuru a rozšiřte dialog." # todo: NEW TRANSLATION
 thailand.156.t: "Tiché silnice v Pattani" # todo: NEW TRANSLATION
 thailand.156.d: "Měsíční mapa incidentů má více bílých míst než červených. Trhy zůstávají otevřené i po setmění, kontrolní stanoviště propouštějí dopravu a muži naproti u stolu v Kuala Lumpuru se opatrně ptají, jak by mohl vypadat konečný status." # todo: NEW TRANSLATION
 thailand.156.a: "Usilujte o konečnou dohodu." # todo: NEW TRANSLATION
 thailand.156.b: "Udržujte klid a status quo." # todo: NEW TRANSLATION
 thailand.350.t: "Oheň na jihu" # todo: NEW TRANSLATION
 thailand.350.d: "Mapa tří jižních provincií je souhvězdím červených bodů: bombové útoky, přepadení, žhářství a atentáty. Tisíce lidí jsou mrtvé a bezpečnostní síly přicházejí o muže, které nedokážou nahradit. Krizi už nelze řídit okrajovými opatřeními. Vláda musí rozhodnout, jakým státem hodlá být na jihu. Pěstí, dobrodincem, nebo partnerem u vyjednávacího stolu." # todo: NEW TRANSLATION
 thailand.350.a: "Rozdrťte je. Jih pozná význam řádu." # todo: NEW TRANSLATION
 thailand.350.b: "Králův mír. Rozvíjejte jih a získejte jej zpět." # todo: NEW TRANSLATION
 thailand.350.c: "Mluvte s nimi. I staří nepřátelé mohou podepsat dokument." # todo: NEW TRANSLATION
 thailand.350.e: "Nemáme jasnou politiku. Řiďme se tím, co přijde." # todo: NEW TRANSLATION
 thailand.356.t: "Nákladní vozy" # todo: NEW TRANSLATION
 thailand.356.d: "Další zátah a další dav před další okresní policejní stanicí. Skončilo to stovkami zadržených, naskládaných tváří k zemi v armádních nákladních vozech, a desítkami mrtvých na udušení, než dorazili do tábora. Záběry obletěly muslimský svět dříve, než Bangkok stihl připravit prohlášení. Ať už operace na místě dosáhla čehokoli, právě zradikalizovala celou generaci a předala povstání jeho zakládající mýtus." # todo: NEW TRANSLATION
 thailand.356.a: "Katastrofa. Jih na to nezapomene." # todo: NEW TRANSLATION
 thailand.357.t: "Pacifikace dokončena" # todo: NEW TRANSLATION
 thailand.357.d: "Generálové hlásí splnění mise. Silniční bomby ustaly, buňky jsou rozbity a kontrolní stanoviště se ruší. Podle všech měřítek, která armáda používá, je Hluboký jih pacifikován. Pod povrchem ticha však křivda nezemřela. Jen se naučila čekat." # todo: NEW TRANSLATION
 thailand.357.a: "Zbraně utichly. Budeme sledovat žhavé uhlíky." # todo: NEW TRANSLATION
 thailand.358.t: "Klid na jihu" # todo: NEW TRANSLATION
 thailand.358.d: "Nebyla uzavřena žádná smlouva a neexistuje autonomie, ale násilí ustoupilo do řízeného klidu. Proudí královský rozvoj, místní prominentní osobnosti jsou uvnitř stanu a legitimita monarchie na jihu se tiše obnovuje. Je to klid udržovaný přítomností a patronátem, sledovaný, nikoli vyřešený." # todo: NEW TRANSLATION
 thailand.358.a: "Koruna udržuje mír, který si vydobyla." # todo: NEW TRANSLATION
 thailand.359.t: "Establishment se brání" # todo: NEW TRANSLATION
 thailand.359.d: "Návrh zákona o zvláštní autonomii unikl na veřejnost a reakce v Bangkoku je zuřivá. Generálové varují před rozkouskováním, palácoví konzervativci mumlají o nebezpečném precedentu a nacionalistický tisk to označuje za kapitulaci. Vyjednavači jsou připraveni podepsat, ale vláda musí rozhodnout, zda vynaloží politický kapitál na zachování kurzu, nebo rámec oslabí na něco, co centrum dokáže strávit." # todo: NEW TRANSLATION
 thailand.359.a: "Trvejte na svém. Dohoda musí být skutečná." # todo: NEW TRANSLATION
 thailand.359.b: "Ořežte ji. Udržte mír, obětujte princip." # todo: NEW TRANSLATION
 thailand.360.t: "Dohoda z Pattani" # todo: NEW TRANSLATION
 thailand.360.d: "Podpisy na jediné stránce ukončují nejdelší válku uvnitř moderních hranic Království. Jih získává skutečnou samosprávu v rámci unitárního Thajska, zbraně jsou odevzdány a vysídlení se začínají vracet. Je to nedokonalé, sporné a historické — a děti z Pattani poprvé po celé generaci vyrůstají bez zákazu vycházení." # todo: NEW TRANSLATION
 thailand.360.a: "Konečně mír na jihu." # todo: NEW TRANSLATION
 thailand_news.24.t: "Masakr v Tak Bai" # todo: NEW TRANSLATION
 thailand_news.24.d: "Záběry zadržených, kteří se udusili v armádních nákladních vozech u Tak Bai, dorazily do všech hlavních měst muslimského světa. Kuala Lumpur, Jakarta a Ankara si předvolaly thajské velvyslance a organizace na ochranu lidských práv požadují vyšetřování. Politika Bangkoku na jihu je nyní synonymem zvěrstva a povstání nikdy nemělo snadnější období pro nábor." # todo: NEW TRANSLATION
 thailand_news.24.a: "Svět sleduje jih." # todo: NEW TRANSLATION
 thailand_news.25.t: "Do Pattani přichází mír" # todo: NEW TRANSLATION
 thailand_news.25.d: "Po generaci krveprolití zbraně na thajském Hlubokém jihu utichly. Ať už rukou vojáka, nebo perem vyjednavače, nejdelší povstání v moderních dějinách Království dospělo ke konci. Silnice jsou otevřené, trhy plné a do Pattani, Yaly a Narathiwatu se vrací opatrná normalita." # todo: NEW TRANSLATION
 thailand_news.25.a: "Dlouhá válka končí." # todo: NEW TRANSLATION
 thailand_news.23.t: "Vláda národní jednoty" # todo: NEW TRANSLATION
 thailand_news.23.d: "Tanky odjely z křižovatek, ale dohoda uzavřená v noci přežije krizi. Zvolená vláda si udržuje mandát a volební urna své místo, avšak velitelé ozbrojených sil nyní sedí u kabinetního stolu a všichni v Bangkoku chápou, kdo mír zaručil. Je to kompromis, který nikdo nemiluje a nikdo se jej neodváží porušit — národní vláda s armádou uvnitř stanu." # todo: NEW TRANSLATION
 thailand_news.23.a: "Moc sdílená a pod dohledem." # todo: NEW TRANSLATION
 thailand.3.c: "Plodiny místo máku. Financujte alternativní rozvoj." # todo: NEW TRANSLATION
 thailand.361.t: "Těla u silnice" # todo: NEW TRANSLATION
 thailand.361.d: "Tříměsíční kampaň skončila a máme výsledky. Organizace na ochranu lidských práv evidují přibližně 2 800 mrtvých, naprostá většina z nich nebyla z ničeho obviněna a mnozí nebyli nikdy ani identifikováni. Černé seznamy posloužily k vyřizování starých účtů a kvóty byly naplněny těly. Ulice jsou klidnější a podpora ve volbách vyšší než kdy dříve, ale v kasárnách a paláci si muži dělají poznámky o vládě, která zabíjí podle plánu." # todo: NEW TRANSLATION
 thailand.361.a: "Čísla jsou čísla. Neomlouváme se." # todo: NEW TRANSLATION
 thailand.362.t: "Plodiny místo máku" # todo: NEW TRANSLATION
 thailand.362.d: "Samotné zákazy obchodu pouze vytlačily obchod přes další hřeben. Agronomové a odborníci na veřejné zdraví mají jiný návrh. Platit horským zemědělcům za pěstování kávy, makadamových ořechů a ovoce místo opia, léčit závislost jako nemoc, nikoli jako zločin, a nechat legální tržní plodiny udělat to, co vrtulníky nikdy nedokázaly. Je to pomalejší, levnější a vyžaduje to, aby stát přestal střílet a začal nakupovat." # todo: NEW TRANSLATION
 thailand.362.a: "Financujme alternativní rozvoj. Získejme si hory trhem." # todo: NEW TRANSLATION
 thailand.362.b: "Pokračujme v zákazu obchodu. Udržme současnou linii." # todo: NEW TRANSLATION
 thailand_news.5.t: "Thajsko odhaluje Východní ekonomický koridor" # todo: NEW TRANSLATION
 thailand_news.5.d: "Bangkok oficiálně otevřel svou vlajkovou rozvojovou zónu na východním pobřeží. Ta zahrnuje vysokorychlostní železnici ke třem letištím, rozšířený aerotropolis U-Tapao a pobídkové balíčky zaměřené na elektromobily, letectví a biotechnologie. Analytici projekt označují za nejambicióznější thajský hospodářský projekt od programu východního pobřeží z 80. let." # todo: NEW TRANSLATION
 thailand_news.5.a: "Země úsměvů to myslí vážně." # todo: NEW TRANSLATION
 thailand.50.b: "Zmírněme úder a ochraňme lid." # todo: NEW TRANSLATION
 thailand.55.b: "Vybudujme národní automobil." # todo: NEW TRANSLATION
 thailand.200.t: "Lidová ústava" # todo: NEW TRANSLATION
 thailand.200.d: "Organizace občanské společnosti, akademici a komunitní představitelé oslavují ústavu sepsanou za skutečné účasti veřejnosti. Obyčejní Thajci mají poprvé po desetiletích pocit, že se podíleli na tvorbě vlastního základního zákona, a bangkocké ulice jsou nečekaně plné oslav." # todo: NEW TRANSLATION
 thailand.200.a: "Demokracie zapouští kořeny." # todo: NEW TRANSLATION
 thailand.201.t: "Rekordy na Don Mueangu" # todo: NEW TRANSLATION
 thailand.201.d: "Počet cestujících na Don Mueangu překonal všechny předchozí rekordy a kampaň Amazing Thailand funguje lépe, než kdokoli předpokládal. Vedoucí představitelé leteckých společností oznamují nové přímé linky a cestovní kanceláře již nyní vyprodávají příští dvě sezóny. Otázkou je, co s příjmy uděláme." # todo: NEW TRANSLATION
 thailand.201.a: "Znovu je investujme do jižních letovisek." # todo: NEW TRANSLATION
 thailand.201.b: "Uložme neočekávaný zisk do banky." # todo: NEW TRANSLATION
 thailand.202.t: "Svět hladový po rýži" # todo: NEW TRANSLATION
 thailand.202.d: "Sucho na indickém subkontinentu a neúroda v celé jihovýchodní Asii vyhnaly světové ceny rýže na desetileté maximum. Thajsko má zásoby prvotřídních odrůd Hom Mali a Jasmine, po kterých každý dovozce rýže okamžitě touží. Ministerstvo obchodu čeká na naši odpověď." # todo: NEW TRANSLATION
 thailand.202.a: "Prodejme zásoby za prémiové ceny." # todo: NEW TRANSLATION
 thailand.202.b: "Nechme rýži doma a dotujme domácí ceny." # todo: NEW TRANSLATION
 thailand.203.t: "Žádost o základnu" # todo: NEW TRANSLATION
 thailand.203.d: "Velitelství USA v Tichomoří vzneslo tichou, avšak formální žádost o rozšíření přístupových práv na letecké základně U-Tapao pro logistiku, průzkum a předzásobení. Američané jsou ochotni platit převody ze státní pokladny, modernizací vybavení i politickým krytím. Veřejnost se podrobnosti nikdy nemusí dozvědět." # todo: NEW TRANSLATION
 thailand.203.a: "Uděleme přístup a vezměme si peníze." # todo: NEW TRANSLATION
 thailand.203.b: "Zdvořile odmítněme. Thajská půda, thajská suverenita." # todo: NEW TRANSLATION
 thailand_news.6.t: "Bambus se ohne, ale nezlomí" # todo: NEW TRANSLATION
 thailand_news.6.d: "Thajsko uzavřelo přelomové diplomatické uspořádání na dvou kolejích: současně prohloubilo smluvní vztahy s Washingtonem a podepsalo s Pekingem nový rámec hospodářského partnerství. Thajské ministerstvo zahraničí tomu říká „bambusová diplomacie“ – pružná, odolná a především zakořeněná v thajských zájmech." # todo: NEW TRANSLATION
 thailand_news.6.a: "Pozoruhodný balanc." # todo: NEW TRANSLATION
 thailand_news.7.t: "Thajsko splatilo dluh MMF o dva roky dříve" # todo: NEW TRANSLATION
 thailand_news.7.d: "Bangkok splatil celý svůj dluh vůči Mezinárodnímu měnovému fondu, a to o dva roky před plánovaným termínem. Předčasné splacení, které ministerstvo financí oznámilo bez velkých fanfár, uzavírá kapitolu asijské finanční krize z roku 1997 a osvobozuje Thajsko od posledních podmínek spojených se záchranným programem z téhož roku." # todo: NEW TRANSLATION
 thailand_news.7.a: "Země úsměvů splácí své dluhy." # todo: NEW TRANSLATION
 thailand.205.t: "Technokraté proti staré gardě" # todo: NEW TRANSLATION
 thailand.205.d: "Nový kabinet ve stylu generálního ředitele stanovil výkonnostní cíle pro každé ministerstvo a několik stálých tajemníků nahradili manažeři z podnikatelské sféry. Stará byrokracie z toho nemá radost. Mezi technokraty prosazujícími „Thailand Inc.“ a kariérními úředníky, kteří ministerstva řídili třicet let, probíhá tichá válka." # todo: NEW TRANSLATION
 thailand.205.a: "Podpořme technokraty. Reformujme ministerstva." # todo: NEW TRANSLATION
 thailand.205.b: "Chraňme kariérní byrokracii. Udržme ministerstva v chodu a generály na své straně." # todo: NEW TRANSLATION
 thailand.207.t: "Únava z Prayutha" # todo: NEW TRANSLATION
 thailand.207.d: "Po třech letech začínají sliby generálů o reformách působit prázdně. Výbor pro tvorbu ústavy byl dvakrát přeobsazen. Datum voleb se dvakrát posunulo. Vysokoškolský student s transparentem před parlamentem čelí sedmnácti obviněním. Líbánky skončily." # todo: NEW TRANSLATION
 thailand.207.a: "Přechod zvládneme obezřetně." # todo: NEW TRANSLATION
 thailand.208.t: "Patová situace pokračuje" # todo: NEW TRANSLATION
 thailand.208.d: "Dny plynou a poté týdny. Protesty se nerozpadly, ale ani neeskalovaly. Vláda neustupuje ani nevyklízí náměstí. Nakonec oba tábory mrknou. Otázkou je, kdo mrkl méně." # todo: NEW TRANSLATION
 thailand.208.a: "Hledejme tiché řešení prostřednictvím ústupků." # todo: NEW TRANSLATION
 thailand.208.b: "Protestující si připíší zásluhy. Vláda ponese vinu." # todo: NEW TRANSLATION
 thailand_news.8.t: "Palác přebírá kormidlo" # todo: NEW TRANSLATION
 thailand_news.8.d: "Thajské královské zřízení formalizovalo svou úlohu při správě majetku Úřadu pro královský majetek a soustředilo kontrolu nad obchodními aktivy v hodnotě stovek miliard bahtů do struktury podléhající přímo paláci. Analytici v Bangkoku diskutují, zda jde o ústavní novinku, nebo pouze o právní uspořádání mechanismů, které neformálně existují již desítky let." # todo: NEW TRANSLATION
 thailand_news.8.a: "Dynastie Chakri přetrvává." # todo: NEW TRANSLATION
 thailand.209.t: "Děti jsou online" # todo: NEW TRANSLATION
 thailand.209.d: "V Bangkoku, Chiang Mai a na třech provinčních univerzitních kampusech současně vypuklo hnutí vedené mládeží. Jejich požadavky se šíří prostřednictvím živých přenosů ještě dříve, než policie stačí rozvinout zátarasy. Vláda se musí rozhodnout, zda zasáhne, nebo počká." # todo: NEW TRANSLATION
 thailand.209.a: "Postavme se za jejich věc." # todo: NEW TRANSLATION
 thailand.209.b: "Pokračujme ve vládnutí. Nechme okamžik pominout." # todo: NEW TRANSLATION
 thailand.210.t: "Dopis z kasáren" # todo: NEW TRANSLATION
 thailand.210.d: "Anonymní dokument, který koloval mezi vysokými důstojníky a poté unikl na veřejnost, popisuje plány na civilisty organizované omezení vojenského vlivu na povyšování a nákupy. Text obsahuje varování. Armáda sleduje situaci a její trpělivost má své meze. Může jít o skutečný plán převratu v rané fázi, nebo o bluf. Volba reakce určí, jakým druhem země jsme." # todo: NEW TRANSLATION
 thailand.210.a: "Jednejme nyní a očistěme spiklence, než se stihnou zorganizovat." # todo: NEW TRANSLATION
 thailand.210.b: "Postupujme tiše. Úniky nepoctíme reakcí." # todo: NEW TRANSLATION
 thailand.211.t: "Provincie promluvily" # todo: NEW TRANSLATION
 thailand.211.d: "Výsledky ze severovýchodu a horního severu jsou sečteny a okres za okresem přešel k reformní kandidátce. Zkušení poslanci s třicetiletou praxí prohráli s osmadvacetiletými kandidáty, kteří vedli kampaň na sociálních sítích. Volební mapa se překresluje rukama voličů, jejichž místní poslanec jim nikdy nezvedl telefon." # todo: NEW TRANSLATION
 thailand.211.a: "Uchopme mandát." # todo: NEW TRANSLATION
 thailand.211.b: "Vládněme za všechny, nejen za své voliče." # todo: NEW TRANSLATION
 thailand.212.t: "Konglomeráty reagují" # todo: NEW TRANSLATION
 thailand.212.d: "Aukce dříve monopolizovaných frekvenčních bloků přinesla přesně ten neočekávaný zisk, který reformátoři předpovídali. Ve stejném týdnu dorazila k Ústavnímu soudu koordinovaná žaloba tří největších konglomerátů a komentář v royalistických novinách označil ministerstvo financí za „ideologicky posedlé“. Politika rozbíjení monopolů funguje a má mocné nepřátele." # todo: NEW TRANSLATION
 thailand.212.a: "Pokračujme. Zákon je na naší straně." # todo: NEW TRANSLATION
 thailand.212.b: "Nabídněme dohodu, řízený útlum namísto nuceného rozbití." # todo: NEW TRANSLATION
 thailand.213.t: "První rok republiky" # todo: NEW TRANSLATION
 thailand.213.d: "Dvanáct měsíců od vyhlášení a země stále existuje – zraněná, plná energie a hádající se, ale stále zde. Royalistické hnutí nezmizelo. Proměnilo se v právní a kulturní kampaň. Jsou naplánovány první prezidentské volby. Otázkou před vládou je, zda je označit za úspěch, přiznat rozkol, nebo prostě pokračovat ve vládnutí." # todo: NEW TRANSLATION
 thailand.213.a: "Vybudovali jsme něco, co vydrží." # todo: NEW TRANSLATION
 thailand.213.b: "Věc Chakri není u konce. Lid si pamatuje." # todo: NEW TRANSLATION
 thailand.213.c: "Republika zatím přežívá. Stále je co bránit." # todo: NEW TRANSLATION
 thailand.214.t: "Kolona míjí památník" # todo: NEW TRANSLATION
 thailand.214.d: "Tři hodiny dělostřelectva, obrněnců a pěchoty, ozbrojené síly v plné přehlídkové sestavě podél Ratchadamnoen Avenue. Davy jsou větší, než plánovači očekávali. Pro zemi, která zapomněla na své války a přijala převraty jako rutinu, má přehlídka neobvykle silný dopad." # todo: NEW TRANSLATION
 thailand.214.a: "Národ zdraví své obránce." # todo: NEW TRANSLATION
 thailand_news.9.t: "Thajsko legalizuje manželství osob stejného pohlaví" # todo: NEW TRANSLATION
 thailand_news.9.d: "Thajský parlament schválil zákon o rovnosti v manželství dvoutřetinovou většinou a Thajsko se stalo první zemí jihovýchodní Asie, která zaručila plná manželská práva bez ohledu na pohlaví. Zákon vstupuje v platnost okamžitě. Oslavy v bangkocké čtvrti Silom a chiangmaiské čtvrti Nimman přilákaly desítky tisíc lidí. Několik sousedních vlád vydalo prohlášení vyjadřující „znepokojení“." # todo: NEW TRANSLATION
 thailand_news.9.a: "Milník pro Asii." # todo: NEW TRANSLATION
 thailand_news.10.t: "Jaro trvá" # todo: NEW TRANSLATION
 thailand_news.10.d: "Tři roky poté, co reformní vláda nastoupila do úřadu na vlně protestů mládeže, Thajsko dnes dokončuje plný demokratický přechod. Civilní kontrola armády je formalizována, jmenovaný senát rozpuštěn a první svobodné soutěživé volby za dvě desetiletí proběhly bez incidentů. Mezinárodní pozorovatelé ze sedmnácti zemí výsledek potvrdili." # todo: NEW TRANSLATION
 thailand_news.10.a: "Demokracie zapouští kořeny." # todo: NEW TRANSLATION
 thailand_news.11.t: "Thajská vlna zaplavuje Asii" # todo: NEW TRANSLATION
 thailand_news.11.d: "Od Tokia přes Tchaj-pej až po Kuala Lumpur je thajská tvorba všude. Streamované seriály, hiphopoví interpreti, módní značky a kulinářská diplomacie, kterou vláda neplánovala a nemůže si za ni plně připsat zásluhy. Thajská kulturní produkce překonala produkci sousedních zemí hodnotou i dosahem." # todo: NEW TRANSLATION
 thailand_news.11.a: "Svět chce to, co Thajsko vytváří." # todo: NEW TRANSLATION
 thailand.215.t: "Bilance království" # todo: NEW TRANSLATION
 thailand.215.d: "První interní přezkum nové vlády je dokončen. Úředníci shromáždili čísla, poměr dluhu, nedostatky infrastruktury, obchodní bilanci a náladu veřejnosti. Z analýzy vystupují tři cesty. Vláda si musí zvolit první prioritu. Cokoli nyní vybere, ovlivní směřování země na příští dva roky." # todo: NEW TRANSLATION
 thailand.215.a: "Zaměřme se na obnovu. Znovu vybudujme ekonomiku od základů." # todo: NEW TRANSLATION
 thailand.215.b: "Zaměřme se na pořádek. Posilněme instituce, než je začneme reformovat." # todo: NEW TRANSLATION
 thailand.215.c: "Zaměřme se na svět. Veďme zemi diplomacií a obchodem." # todo: NEW TRANSLATION
 thailand.216.t: "Krok generálů" # todo: NEW TRANSLATION
 thailand.216.d: "Výzva vlády k odporu dorazila k loajalistům v policii, pohraniční stráži, sítích občanské společnosti i v ulicích. Zda lidé odpovědí, je otázkou, která rozhodne příští desetiletí thajské politiky. V operačním středisku štáb sleduje na mapě rozmístění jednotek a počítá." # todo: NEW TRANSLATION
 thailand.216.a: "Udržme linii." # todo: NEW TRANSLATION
 thailand.217.t: "Peking dává najevo nelibost" # todo: NEW TRANSLATION
 thailand.217.d: "Nota čínského velvyslanectví je diplomaticky formulovaná, ale nezaměnitelně chladná. Prohlubování thajského spojenectví s Washingtonem nezůstalo bez povšimnutí. Státní média v Pekingu hovoří o „rozporuplném postoji“ Thajska. Investiční delegace tiše odkládají své návštěvy. Otázkou pro Bangkok je, kolik z toho přijmout a kolik odvrátit." # todo: NEW TRANSLATION
 thailand.217.a: "Nechme vztah ochladnout. Už jsme si vybrali." # todo: NEW TRANSLATION
 thailand.217.b: "Tiše Peking ujistěme osobním vzkazem od premiéra." # todo: NEW TRANSLATION
 thailand.218.t: "Washington mění kurz" # todo: NEW TRANSLATION
 thailand.218.d: "Americké ministerstvo zahraničí veřejně zaznamenalo nové thajské přiklonění k iniciativě BRI s pečlivě neutrálním tónem, ale pracovníci Kongresu začali klást naléhavé otázky ohledně financování cvičení Cobra Gold a smluvních závazků. Hodnocení Pentagonu, které uniklo do washingtonského think-tanku, označuje Thajsko za „strategicky nejednoznačné“. Bangkok musí vztah řídit." # todo: NEW TRANSLATION
 thailand.218.a: "Přijměme ochladnutí vztahů. Jsme suverénní stát." # todo: NEW TRANSLATION
 thailand.218.b: "Soukromě ujistěme velvyslance. Na podstatě se nic nemění." # todo: NEW TRANSLATION
 thailand.219.t: "Generálové natrvalo" # todo: NEW TRANSLATION
 thailand.219.d: "Rozhodnutí institucionalizovat vojenské opatrovnictví se dostalo na stránky mezinárodních úvodníků. Financial Times je popisuje jako „řízené autoritářství“. Tři evropští velvyslanci požádali ve stejném týdnu o schůzku s ministerstvem zahraničí. Domácí akademici a studenti zaměření na reformy sledují zpravodajství a vyvozují vlastní závěry." # todo: NEW TRANSLATION
 thailand.219.a: "Vládneme podle vlastního úsudku. Zahraniční komentáře jsou bezvýznamné." # todo: NEW TRANSLATION
 thailand.219.b: "Kritici se o Thajsku mýlí. Dokážeme jim opak podle vlastních pravidel." # todo: NEW TRANSLATION
 thailand.220.t: "Jih znovu vítá návštěvníky" # todo: NEW TRANSLATION
 thailand.220.d: "Dva roky poté, co tsunami uzavřela pláže andamanského pobřeží všem kromě opravářských týmů, se znovu otevřelo poslední letovisko. Thajský úřad pro cestovní ruch vedl pečlivou obnovovací kampaň a rezervace naznačují, že byla úspěšná. Jih je zpět." # todo: NEW TRANSLATION
 thailand.220.a: "Thajsko je otevřené." # todo: NEW TRANSLATION
 thailand.221.t: "Obnova jihu je dokončena" # todo: NEW TRANSLATION
 thailand.221.d: "Mezinárodní humanitární týmy a vládní inženýři dokončili program obnovy pobřežní infrastruktury. Silnice jsou opravené, rybářská mola zrekonstruovaná a elektrická síť obnovena. Partnerům v pomoci bylo poděkováno a lešení se demontuje." # todo: NEW TRANSLATION
 thailand.221.a: "Jih znovu stojí." # todo: NEW TRANSLATION
 thailand.222.t: "Globální finanční krize" # todo: NEW TRANSLATION
 thailand.222.d: "Pád Lehman Brothers v New Yorku vyslal asijskými trhy šokové vlny. Thajský vývozní sektor pozorně sleduje své objednávkové knihy. Otázkou pro Bangkok je, zda finanční rezervy vybudované během uplynulého desetiletí vydrží, nebo zda krize pronikne hrází." # todo: NEW TRANSLATION
 thailand.222.a: "Thajsko bouři přečká. Naše obezřetnost se vyplatila." # todo: NEW TRANSLATION
 thailand.222.b: "Bouře dorazila. Musíme se připravit na obtížné dva roky." # todo: NEW TRANSLATION
 thailand.223.t: "Tři sta sedmdesát sedm" # todo: NEW TRANSLATION
 thailand.223.d: "V čítárně Tajné rady a v sálech interní zpravodajské služby armády analytici zpracovávají výsledky voleb. Tři sta sedmdesát sedm mandátů. Jednobarevná většina. Mandát bez obdoby v dějinách thajské demokracie a síť proti němu nemá spolehlivý nástroj. Dnes ne." # todo: NEW TRANSLATION
 thailand.223.a: "Vesnice promluvily. Prozatím." # todo: NEW TRANSLATION
 thailand.224.t: "Zúčtování s rýží" # todo: NEW TRANSLATION
 thailand.224.d: "Světové ceny rýže nespolupracovaly. Globální přebytek nabídky zanechal vládu s miliony tun rýže nakoupené za ceny výrazně nad tržní hodnotou a arbitráž, která měla program financovat, se neuskutečnila. Ministerstvo financí předložilo tři možnosti. Dvě z nich jsou politicky proveditelné." # todo: NEW TRANSLATION
 thailand.224.a: "Absorbujme ztráty a pokryjme schodek ze státní pokladny." # todo: NEW TRANSLATION
 thailand.224.b: "Nechme program zkolabovat a přijměme politický úder nyní." # todo: NEW TRANSLATION
 thailand.225.t: "Silnice dosahují do vesnic" # todo: NEW TRANSLATION
 thailand.225.d: "Ministři v ochranných přilbách přestřihli pásky na nových dálnicích napříč Khoratskou plošinou a železničních odbočkách do severních údolí. Provinční úřady otevírají své dveře ve městech, která dosud pouze posílala své syny stavět hlavní město. Tentokrát se rozvoj vrací k lidem, kteří zajistili drtivé volební vítězství." # todo: NEW TRANSLATION
 thailand.225.a: "Vnitrozemí je odměněno." # todo: NEW TRANSLATION
 thailand.226.t: "Vláda krále Vajiralongkorna" # todo: NEW TRANSLATION
 thailand.226.d: "Rok smutku končí. Přístup nového krále k trůnu se liší od přístupu jeho otce. Viditelnější přítomnost na veřejnosti, pevnější kontrola královského majetku a jiný druh královského charismatu. Síť, která sloužila deváté vládě, se musí naučit sloužit desáté. Není to stejná síť." # todo: NEW TRANSLATION
 thailand.226.a: "Království vstupuje do nové éry." # todo: NEW TRANSLATION
 thailand.227.t: "Veteráni protestují" # todo: NEW TRANSLATION
 thailand.227.d: "Oznámení, že branná povinnost bude postupně zrušena, vyvolalo koordinovanou reakci penzionovaných důstojníků a veteránských sdružení. V kasárnách si vyšší poddůstojníci stěžují na „vyprázdněnou“ armádu. Tisk zveřejňuje fotografie starých generálů v uniformách pro slavnostní příležitosti, kteří vypadají nespokojeně. Vláda to očekávala, ale rozsah odporu je větší, než naznačovaly modely." # todo: NEW TRANSLATION
 thailand.227.a: "Zůstaňme pevní. Reforma je správná." # todo: NEW TRANSLATION
 thailand.227.b: "Nabídněme veteránům slavnostní ocenění a kritiku symbolicky absorbujme." # todo: NEW TRANSLATION
 thailand.228.t: "Turistická dividenda" # todo: NEW TRANSLATION
 thailand.228.d: "První sezóna po dohodě o otevřeném nebi je za námi. Čísla Úřadu pro cestovní ruch jsou silná. Počet příjezdů vzrostl o dvanáct procent, průměrné denní výdaje o devatenáct procent a jižní letoviska, která nejvíce těží z nových tras nízkonákladových dopravců, hlásí nejlepší čtvrtletí za poslední desetiletí." # todo: NEW TRANSLATION
 thailand.228.a: "Baty proudí." # todo: NEW TRANSLATION
 thailand_news.13.t: "Thajsko, brána Asie" # todo: NEW TRANSLATION
 thailand_news.13.d: "Thajská vláda formálně vyhlásila svůj jižní infrastrukturní koridor, ať už půjde o kanál či pozemní most, za „otevřený všem národům za spravedlivých podmínek“. Do Jižní ekonomické zóny již začaly proudit mezinárodní investice a Bangkok hostí delegace z dvanácti zemí, které usilují o přednostní tranzitní dohody." # todo: NEW TRANSLATION
 thailand_news.13.a: "Země úsměvů ovládá námořní trasy." # todo: NEW TRANSLATION
 thailand.250.t: "Vláda mrkla" # todo: NEW TRANSLATION
 thailand.250.d: "Stávka drží zemi v nehybnosti příliš dlouho a její náklady se pro muže u moci staly nesnesitelnými. Přístavy, železnice, ministerstva, všechno se zastavilo a ulice patří hnutí. Místo riskování, že armáda zahájí palbu na vlastní lid, vláda otevírá dveře vyjednávání. Toto je pokojná cesta k moci, vybojovaná odvahou, nikoli puškou." # todo: NEW TRANSLATION
 thailand.250.a: "Vyhráli jsme ulice. Teď převezmeme stát." # todo: NEW TRANSLATION
 thailand.259.t: "Generálové obnovují pořádek" # todo: NEW TRANSLATION
 thailand.259.d: "Stávka pokračovala, ale nikdy zcela nezlomila vůli vlády, a vrchnímu velení došla trpělivost jako prvnímu. Na třídách stojí tanky, vůdci stávky jsou zatýkáni a platí zákaz vycházení. Revoluce byla rozdrcena dříve, než mohla uchopit moc, a muži v uniformách nyní vládnou jménem pořádku. Rudá cesta je uzavřena." # todo: NEW TRANSLATION
 thailand.259.a: "Revoluce je zlomena." # todo: NEW TRANSLATION
 thailand.251.t: "Svět se odvrací" # todo: NEW TRANSLATION
 thailand.251.d: "Nová thajská vláda se představila světu. Washingtonská reakce dorazila dříve, než zaschl inkoust na zakládacích dokumentech strany. Hospodářské sankce, zmrazený tok pomoci a prohlášení ministerstva zahraničí, které dokázalo být zároveň povýšené i výhružné. Peking a Hanoj naopak zaslaly blahopřání." # todo: NEW TRANSLATION
 thailand.251.a: "Ať na nás uvalí sankce. Tuto revoluci jsme neudělali kvůli jejich schválení." # todo: NEW TRANSLATION
 thailand.252.t: "Royalisté odcházejí" # todo: NEW TRANSLATION
 thailand.252.d: "Pozemková reforma zodpověděla otázku, kterou se zdvořilá bangkocká společnost raději neptala. Ti, kteří vybudovali své bohatství na starém systému — nepřítomní vlastníci půdy, investiční síť kolem paláce i provinční rodiny, které držely deset tisíc rai na jméno každého ze svých dětí — se rozhodli. Většina z nich už odlétá do Singapuru, Londýna a Los Angeles." # todo: NEW TRANSLATION
 thailand.252.a: "Země není svými vlastníky půdy." # todo: NEW TRANSLATION
 thailand.253.t: "Čakrijské dilema" # todo: NEW TRANSLATION
 thailand.253.d: "Dynastie Čakri vládne Siamu a Thajsku již více než dvě století. Instituce monarchie, ať už si člověk myslí cokoli o jednotlivcích, kteří ji zastávali, je vetkána do občanského kalendáře, právního systému, geografie Bangkoku a emocionálního uspořádání značné části obyvatelstva. Strana se musí rozhodnout, co s ní udělá.\n\nOdhodlání strany k cílům revoluce není zpochybňováno. Jedinou otázkou je, zda jim lépe poslouží čistý rozchod, nebo řízený přechod." # todo: NEW TRANSLATION
 thailand.253.a: "Zrušit monarchii. V lidové republice nemá místo." # todo: NEW TRANSLATION
 thailand.253.b: "Ponechat ústavní symbol, zatímco strana bude vládnout." # todo: NEW TRANSLATION
 thailand_news.14.t: "Bambusová opona padá" # todo: NEW TRANSLATION
 thailand_news.14.d: "Thajsko formalizovalo své spojenectví s Laosem a Vietnamem v rámci regionálního solidárního uspořádání, kterému analytici již říkají „bambusová opona“. Poprvé od Kambodže Pol Pota vyhlásila vláda jihovýchodní Asie komunistickou orientaci. Západní metropole přepočítávají své kalkulace. Peking vítá rozhodnutí. Thajský bat byl přes noc nahrazen novou měnou." # todo: NEW TRANSLATION
 thailand_news.14.a: "Mapa jihovýchodní Asie se změnila." # todo: NEW TRANSLATION
 thailand_news.31.t: "Venkov obkličuje město" # todo: NEW TRANSLATION
 thailand_news.31.d: "Po letech povstání, které Bangkok odmítal jako pozůstatek mrtvé války, vyhlásila Komunistická strana Thajska otevřenou lidovou válku. Základny v severních vysočinách a na plošině Isaanu jsou nyní mimo dosah bezpečnostních sil a z vesnic, kterým stát dávno přestal sloužit, proudí noví rekruti. Vojenští analytici, kteří hnutí odepsali, potichu přehodnocují své odhady." # todo: NEW TRANSLATION
 thailand_news.31.a: "Kopce nyní patří jim." # todo: NEW TRANSLATION
 thailand_news.32.t: "Thajsko se připojuje k dračímu proudu" # todo: NEW TRANSLATION
 thailand_news.32.d: "Bangkok podepsal s Pekingem rozsáhlé partnerství. Přináší investice, přístup na trhy a bezpečnostní dohodu, která staví revoluční Thajsko pevně do čínské sféry. Státní média hovoří o přirozeném sblížení dvou socialistických sousedů. Západní diplomaté o satelitu, který získává vlastní slunce. Stavební jeřáby rostoucí nad Bangkokem naznačují, že peníze jsou přinejmenším skutečné." # todo: NEW TRANSLATION
 thailand_news.32.a: "Oběžná dráha je určena." # todo: NEW TRANSLATION
 thailand_news.33.t: "Federace tří řek" # todo: NEW TRANSLATION
 thailand_news.33.d: "Thajsko, Laos, Vietnam a Kambodža oznámily rámec indočínské socialistické federace, jejímž průmyslovým a diplomatickým srdcem bude Bangkok. Poprvé revoluce Mekongu promlouvají jedním hlasem a tento hlas je natolik silný, že na něj velmoci musí odpovědět, nikoli jej ignorovat. Zda mohou čtyři hrdá hlavní města sdílet jeden projekt, zůstává otevřenou otázkou." # todo: NEW TRANSLATION
 thailand_news.33.a: "Indočína promlouvá jedním hlasem." # todo: NEW TRANSLATION
 thailand.260.t: "Rudé košile obsazují Ratchaprasong" # todo: NEW TRANSLATION
 thailand.260.d: "Venkovský hlas dorazil do Bangkoku. Desítky tisíc rudých košil obsadily křižovatku Ratchaprasong, obchodní srdce hlavního města, a postavily barikády z naostřeného bambusu a navršených pneumatik. Obchodní centra jsou zavřená, doprava stojí a hnutí prohlašuje, že zůstane, dokud vláda nevyhlásí volby. Armáda čeká na rozkaz." # todo: NEW TRANSLATION
 thailand.260.a: "Nechte je zůstat. Město přežije jednu obsazenou křižovatku." # todo: NEW TRANSLATION
 thailand.260.b: "Vyčistěte křižovatku. Hlavní město nemůže zůstat zavřené donekonečna." # todo: NEW TRANSLATION
 thailand.270.t: "Tvůrce vlád" # todo: NEW TRANSLATION
 thailand.270.d: "Strana Anutina Čarnvíraku drží rozhodující blok v novém parlamentu. Jeho cena za vstup do koalice není nepřiměřená: několik ministerstev, závazek k výdajům na rozvoj venkova a jeden velmi konkrétní politický slib. Koalice však vždy stojí více, než naznačuje původní nabídka." # todo: NEW TRANSLATION
 thailand.270.a: "Vytvořme koalici. Vládní většina za tu cenu stojí." # todo: NEW TRANSLATION
 thailand.270.b: "Odmítnout. Můžeme vládnout bez nich, nebo nevládnout vůbec." # todo: NEW TRANSLATION
 thailand.271.t: "Ministerstvo ministerstev" # todo: NEW TRANSLATION
 thailand.271.d: "Jednání na úrovni vlády jsou uzavřena. Bhumdžaithaj získává ministerstvo zdravotnictví, ministerstvo zemědělství a post místopředsedy vlády. Dokumenty jsou podepsány, koalice je oficiální a handlování začíná okamžitě." # todo: NEW TRANSLATION
 thailand.271.a: "Koalice drží. Prozatím." # todo: NEW TRANSLATION
 thailand.272.t: "Hnutí za zrušení" # todo: NEW TRANSLATION
 thailand.272.d: "Konzervativní členové koalice a royalisticky orientované občanské skupiny mimo ni zahájili formální kampaň za zrušení zákona o dekriminalizaci konopí. Mají dostatek podpisů k vynucení parlamentní debaty. Otázkou je, zda bude vláda bojovat za zachování této politiky, nebo ji vymění za politický klid." # todo: NEW TRANSLATION
 thailand.272.a: "Zrušit zákon. Stabilita má větší cenu než zelená horečka." # todo: NEW TRANSLATION
 thailand.272.b: "Zůstaňme pevní. Politika zůstává. Ať to předloží soudům." # todo: NEW TRANSLATION
 thailand.273.t: "Nabídka z Bangkoku" # todo: NEW TRANSLATION
 thailand.273.d: "Thajsko podává ruku Šanům. Pro šanský stát, který se spojí s Královstvím, jsou na stole uznání, zbraně a fungující státní pokladna. Autonomie by byla skutečná. Stejně tak závislost, která s ní přichází, a Neipyijto tuto volbu neodpustí." # todo: NEW TRANSLATION
 thailand.273.a: "Přijmout bangkokskou ochranu." # todo: NEW TRANSLATION
 thailand.273.b: "Postavíme se na vlastní nohy." # todo: NEW TRANSLATION
 thailand.280.t: "První vítězství na cestě" # todo: NEW TRANSLATION
 thailand.280.d: "Vůz First Win 4x4 společnosti Chaiseri Metal and Rubber našel kupce po celém sdružení. Indonéská námořní pěchota, filipínské četnictvo, malajský pohraniční pluk. První série byla odeslána. Provize exportního agenta je menší než reputační dividenda. Jihovýchodní Asie nyní ví, že Thajsko vyrábí věci, které stojí za nákup." # todo: NEW TRANSLATION
 thailand.280.a: "Podepsat smlouvy. Trh ASEAN je náš." # todo: NEW TRANSLATION
 thailand.281.t: "Námořní pěchota cvičí v Sattahipu" # todo: NEW TRANSLATION
 thailand.281.d: "První specializované obojživelné cvičení Královské thajské námořní pěchoty za deset let nasazuje prapor do úseků pro nácvik útoku na pláž na námořní základně Sattahip. Nová doktrína je sepsána, rozšíření loděnic financováno a velitel sboru se přestal omlouvat za rozpočet a začal plánovat další cvičení." # todo: NEW TRANSLATION
 thailand.281.a: "Z moře." # todo: NEW TRANSLATION
 thailand_news.15.t: "Thajsko, rozvíjející se arzenál ASEAN" # todo: NEW TRANSLATION
 thailand_news.15.d: "Vlna kontraktů na vývoz obranného materiálu podepsaných v Bangkoku v tomto čtvrtletí přiměla regionální analytiky přehodnotit postavení Thajska na trhu obrany jihovýchodní Asie. Vozidla First Win MRAP jsou ve výzbroji Filipín a Indonésie a dělostřelecké zapalovače thajské výroby jsou v malajských zásobách. Královský thajský arzenál již není programem domácích nákupů. Je regionálním dodavatelem." # todo: NEW TRANSLATION
 thailand_news.15.a: "Továrny Království pracují." # todo: NEW TRANSLATION
 thailand_news.16.t: "Bangkok oznamuje doktrínu operací ve více doménách" # todo: NEW TRANSLATION
 thailand_news.16.d: "Vrchní velení Královských thajských ozbrojených sil zveřejnilo první oficiální thajskou doktrínu operací ve více doménách, která sjednocuje kybernetické operace, elektronický boj, útoky dronů a konvenční pozemní manévry do jednotného operačního rámce. Doktrína MDO, vyvinutá během společných cvičení s americkými a australskými partnery, signalizuje, že Thajsko již nevnímá válčení jako zápas v jediné doméně." # todo: NEW TRANSLATION
 thailand_news.16.a: "Království bojuje na všech frontách." # todo: NEW TRANSLATION
 thailand.310.t: "Reaktor dosáhl kritičnosti" # todo: NEW TRANSLATION
 thailand.310.d: "Ve 3:47 ráno přístroje v kontrolní místnosti překračují nulu. První thajský tlakovodní reaktor dosáhl kritičnosti. Hlavní inženýr to označuje za technický milník a vláda za energetickou bezpečnost. Obojí je pravda. Národní elektrická síť bude do rána vypadat jinak." # todo: NEW TRANSLATION
 thailand.310.a: "Nová éra základního výkonu." # todo: NEW TRANSLATION
 thailand.311.t: "Phnompenh reaguje" # todo: NEW TRANSLATION
 thailand.311.d: "Kambodžské ministerstvo zahraničí odpovědělo na bangkokské návrhy formálněji, než se očekávalo, a vřeleji, než se obávalo. Kalkulace vlády v Phnompenhu je jasná. Blízký vztah s Thajskem je pojistkou proti přílišné závislosti na Pekingu a zdrojem příjmů, který může poskytnout nejrychleji rostoucí ekonomika regionu." # todo: NEW TRANSLATION
 thailand.311.a: "Vítáme partnerství." # todo: NEW TRANSLATION
 thailand.311.b: "Postupujme opatrně. Pokrok vyžaduje čas." # todo: NEW TRANSLATION
 thailand.312.t: "Jakartský dialog" # todo: NEW TRANSLATION
 thailand.312.d: "Indonéská delegace přijíždí bez připraveného společného komuniké. Jakarta chce vědět, co Bangkok zamýšlí. Skutečné partnerství regionálních rovných, nebo soutěž o vedoucí úlohu v ASEAN, kterou Indonésie dlouho považovala za vlastní? Na stole jsou obě možnosti. Ani jedna není levná." # todo: NEW TRANSLATION
 thailand.312.a: "Partnerství. Společná cvičení, sdílená doktrína, vzájemný prospěch." # todo: NEW TRANSLATION
 thailand.312.b: "Soutěž. Vlastní čtvrť Jakarty ovlivníme více než ona." # todo: NEW TRANSLATION
 thailand.313.t: "Spis čínských smluv" # todo: NEW TRANSLATION
 thailand.313.d: "Hodnocení ministerstva financí je jednoznačné. Infrastrukturní smlouvy uzavřené v rámci BRI přinesly silnice a železnice, které Thajsko potřebovalo, ale podmínky financování vtiskly Pekingu vliv do projektových toků na celou generaci. Otázkou před vládou je, zda dál čerpat čínský kapitál, nebo přijmout krátkodobou bolest nového vyjednávání." # todo: NEW TRANSLATION
 thailand.313.a: "Ponechat financování. Projekty přinášejí výsledky." # todo: NEW TRANSLATION
 thailand.313.b: "Znovu vyjednat. Suverenita něco stojí." # todo: NEW TRANSLATION
 thailand.314.t: "Washington žádá přezkum" # todo: NEW TRANSLATION
 thailand.314.d: "Americké tichomořské velitelství formálně požádalo o dvoustranný bezpečnostní přezkum. V praxi jde o pozvání k prohloubení thajského smluvního spojenectví, přijetí výcvikových balíčků a politické viditelnosti, která přichází s rolí nejspolehlivějšího partnera Ameriky v jihovýchodní Asii. Alternativou je zachovat pojistku." # todo: NEW TRANSLATION
 thailand.314.a: "Prohloubit spojenectví. Přijmout výcvik i závazek." # todo: NEW TRANSLATION
 thailand.314.b: "Odstup. Pojistka slouží Thajsku lépe." # todo: NEW TRANSLATION
 thailand_news.17.t: "Thajsko rozsvítilo svůj první jaderný reaktor" # todo: NEW TRANSLATION
 thailand_news.17.d: "Královská thajská vláda uvedla první thajskou komerční jadernou elektrárnu do plného provozu a stala se první zemí jihovýchodní Asie s civilní jadernou energetikou. Šestisetmegawattový tlakovodní reaktor v provincii Čačengsao bude dodávat přibližně osm procent celostátní poptávky po elektřině. Analytici upozorňují na dvojí význam reaktoru. Nabízí energetickou bezpečnost i novou osu technické prestiže v regionu, kde je jaderná schopnost stále více známkou ambicí střední mocnosti." # todo: NEW TRANSLATION
 thailand_news.17.a: "Království vstupuje do jaderného věku." # todo: NEW TRANSLATION
 thailand.315.t: "Nástražná mina u Ta Muen Thom" # todo: NEW TRANSLATION
 thailand.315.d: "Výbuch nášlapné miny poblíž sporného chrámového komplexu Ta Muen Thom zranil tři vojáky Královské thajské armády. Obě strany obviňují z jejího položení tu druhou. Incident vyvolal nacionalistické protesty v Bangkoku a Phnompenhu." # todo: NEW TRANSLATION
 thailand.315.a: "Požadovat odpovědi a mobilizovat nacionalistické nálady." # todo: NEW TRANSLATION
 thailand.315.b: "Požádat ASEAN o zprostředkování a nechat vést diplomaty." # todo: NEW TRANSLATION
 thailand.316.t: "U Ta Muen Thom se střílí" # todo: NEW TRANSLATION
 thailand.316.d: "Podél sporné hranice vypukly potyčky. Obě vlády čelí tlaku svých armád a nacionalistických hnutí. Generální tajemník ASEAN vydal prohlášení vyzývající ke zdrženlivosti." # todo: NEW TRANSLATION
 thailand.316.a: "Využít výhody." # todo: NEW TRANSLATION
 thailand.316.b: "Přijmout příměří ASEAN." # todo: NEW TRANSLATION
 thailand.317.t: "Červencová válka, plné vojenské nasazení" # todo: NEW TRANSLATION
 thailand.317.d: "Thajské a kambodžské síly se střetly během týdenního pohraničního konfliktu poblíž Ta Muen Thom a Preah Vihear. Výměna dělostřelecké palby si vyžádala oběti na obou stranách. ASEAN svolal mimořádný summit." # todo: NEW TRANSLATION
 thailand.317.a: "Po demonstraci síly přijmout příměří ASEAN." # todo: NEW TRANSLATION
 thailand.317.b: "Zakopat se a udržet zisky." # todo: NEW TRANSLATION
 thailand.318.t: "Napětí na hranici znovu vzplanulo" # todo: NEW TRANSLATION
 thailand.318.d: "Navzdory dohodě o příměří se podél sporné hranice znovu rozpoutaly střety. Prosincové vzplanutí prověřuje, zda obě země dokážou dohodu dodržet, nebo opět sklouznou k otevřenému konfliktu." # todo: NEW TRANSLATION
 thailand.318.a: "Znovu potvrdit příměří." # todo: NEW TRANSLATION
 thailand.318.b: "Obnovit nepřátelství." # todo: NEW TRANSLATION
 thailand.319.t: "Washington říká F-35 ne" # todo: NEW TRANSLATION
 thailand.319.d: "Spojené státy odmítly oficiální žádost Thajska o stíhačky F-35 Lightning II s odvoláním na omezení převodu technologií a obavy ze vztahů Thajska s Čínou." # todo: NEW TRANSLATION
 thailand.319.a: "Usilovat o program Gripen E/F." # todo: NEW TRANSLATION
 thailand.319.b: "Místo toho přijmout F-16V Block 70." # todo: NEW TRANSLATION
 thailand.319.c: "Přiklonit se k J-10CE. Peking je dodá." # todo: NEW TRANSLATION
 thailand.320.t: "Paetongtarn odvolána soudem" # todo: NEW TRANSLATION
 thailand.320.d: "Thajský ústavní soud odvolal premiérku Paetongtarn Shinawatraovou z funkce po úniku telefonního hovoru, v němž zjevně zpochybňovala nezávislou instituci. Anutin Charnvirakul ze strany Bhumjaithai byl jmenován úřadujícím premiérem." # todo: NEW TRANSLATION
 thailand.320.a: "Přijmout rozsudek." # todo: NEW TRANSLATION
 thailand.320.b: "Napadnout rozhodnutí." # todo: NEW TRANSLATION
 thailand.321.t: "Anutin přebírá kormidlo" # todo: NEW TRANSLATION
 thailand.321.d: "Anutin Charnvirakul vede úřednickou vládu s podporou Strany lidu při hlasování o důvěře a rozpočtu. Slíbil nové volby do čtyř měsíců." # todo: NEW TRANSLATION
 thailand.321.a: "Úřednická vláda zahajuje svou práci." # todo: NEW TRANSLATION
 thailand.322.t: "Thajsko jde k volbám, únor 2026" # todo: NEW TRANSLATION
 thailand.322.d: "Thajci hlasují v parlamentních volbách, které určí politický směr země na příští čtyři roky. Pohraniční válka posílila nacionalistické nálady ve prospěch Bhumjaithai. Strana lidu vede v městských průzkumech." # todo: NEW TRANSLATION
 thailand.322.a: "Bhumjaithai vítězí a Anutinův mandát je potvrzen." # todo: NEW TRANSLATION
 thailand.322.b: "Koalice Strany lidu přebírá moc." # todo: NEW TRANSLATION
 thailand_news.18.t: "ASEAN zprostředkoval thajsko-kambodžské příměří" # todo: NEW TRANSLATION
 thailand_news.18.d: "Asociace národů jihovýchodní Asie úspěšně zprostředkovala dohodu o příměří mezi Thajskem a Kambodžou, čímž ukončila týdny pohraničních střetů poblíž chrámového komplexu Ta Muen Thom. Generální tajemník ASEAN označil výsledek za důkaz, že regionální instituce dokážou udržet dvoustranné krize pod kontrolou dříve, než přerostou v otevřenou válku." # todo: NEW TRANSLATION
 thailand_news.18.a: "Region zatím drží pohromadě." # todo: NEW TRANSLATION
 thailand_news.19.t: "Anutinova strana ovládla thajské volby" # todo: NEW TRANSLATION
 thailand_news.19.d: "Bhumjaithai získala v parlamentních volbách v Thajsku v únoru 2026 celkem 193 křesel, čímž Anutinu Charnvirakulovi poskytla silný mandát a ukončila měsíce nejistoty úřednické vlády. Výsledek upevňuje thajský konzervativně-populistický politický střed a otevírá cestu k plnému čtyřletému období." # todo: NEW TRANSLATION
 thailand_news.19.a: "Nový mandát pro Království." # todo: NEW TRANSLATION
 thailand.330.t: "Duše důstojnického sboru" # todo: NEW TRANSLATION
 thailand.330.d: "Generálním štábem tiše probíhá spor. Jedna frakce chce profesionální, apolitickou armádu schopných techniků. Druhá touží po oslavované válečnické kastě, pýše a meči národa. Volba, kterou Království nyní učiní, utváří důstojnický sbor na celou generaci." # todo: NEW TRANSLATION
 thailand.330.a: "Vybudovat profesionální sbor." # todo: NEW TRANSLATION
 thailand.330.b: "Pěstovat vojenskou prestiž." # todo: NEW TRANSLATION
 thailand.334.t: "Ponorka byla uvedena do služby" # todo: NEW TRANSLATION
 thailand.334.d: "Roky po kontroverzi kolem motoru byla první loď S26T konečně zařazena do služby Královského thajského námořnictva. Posádka se na tento den usilovně připravovala. Ať už byla politika nákupu jakákoli, Thajsko nyní provozuje moderní ponorku a regionální rovnováha se mírně posouvá na jih." # todo: NEW TRANSLATION
 thailand.334.a: "Flotila vyplouvá na moře." # todo: NEW TRANSLATION
 thailand_news.26.t: "Gripeny nad Bangkokem" # todo: NEW TRANSLATION
 thailand_news.26.d: "Královské thajské letectvo převzalo své první víceúčelové stíhačky JAS 39 Gripen a při této příležitosti s nimi proletělo v sestavě nad hlavním městem. Proudové letouny švédské výroby dávají Thajsku skutečnou schopnost vzdušného boje čtvrté generace a oporu v moderním leteckém boji založeném na datových spojích." # todo: NEW TRANSLATION
 thailand_news.26.a: "Obloha Království je střežena." # todo: NEW TRANSLATION
 thailand_news.27.t: "Thajské zbraně na světovém trhu" # todo: NEW TRANSLATION
 thailand_news.27.d: "Nový thajský Úřad pro vývoz obranného materiálu oznámil první vlnu zahraničních kontraktů. Obrněná vozidla, dělostřelectvo a munice míří ke kupcům napříč jihovýchodní Asií i dále. Obranný průmysl Království, kdysi jen rozpočtová položka, se stává zdrojem exportních příjmů." # todo: NEW TRANSLATION
 thailand_news.27.a: "Vyrobeno v Thajsku, prodáváno světu." # todo: NEW TRANSLATION
 thailand_news.28.t: "Národ ve zbrani" # todo: NEW TRANSLATION
 thailand_news.28.d: "Bangkok představil program totální obrany. Přináší rozšířené zálohy, cvičení civilní obrany v každé provincii a doktrínu, která považuje celou společnost za poslední linii odporu. Kritici tomu říkají militarizace, vláda obezřetnost." # todo: NEW TRANSLATION
 thailand_news.28.a: "Celý národ je připraven." # todo: NEW TRANSLATION
 SIA_expansionism_threat: "Thajský expanzionismus" # todo: NEW TRANSLATION
 thailand.380.t: "Inženýři na šíji" # todo: NEW TRANSLATION
 thailand.380.d: "Komise pro proveditelnost vydala své rozhodnutí. Průkop je náročný, ale možný. Zbývá jediná otázka, která projekt po celé století zabíjela: kdo ho zaplatí. Na stole vlády leží tři zahraniční nabídky vedle možnosti financovat jej vlastními prostředky. Každá má svou cenu, která se neměří pouze v bahtech." # todo: NEW TRANSLATION
 thailand.380.a: "Přijmout pekingské financování v rámci Pásu a stezky. Levné, rychlé a podmínky vyřešíme později." # todo: NEW TRANSLATION
 thailand.380.b: "Zvolit Japonsko. Pomalejší a dražší, ale postavené tak, aby vydrželo, a bez skrytých doložek." # todo: NEW TRANSLATION
 thailand.380.c: "Přizvat mezinárodní konsorcium. Postupné, sdílené a nezávislé na jediné mocnosti." # todo: NEW TRANSLATION
 thailand.380.e: "Postavit to sami. Kanál bude thajský až po poslední patník." # todo: NEW TRANSLATION
 thailand.381.t: "Práce byly zahájeny" # todo: NEW TRANSLATION
 thailand.381.d: "Štětovnice jsou zaraženy, první kubické metry vytěžené zeminy jsou odvezeny a velký průkop na Kra začal doopravdy. Práce budou probíhat po etapách a každá z nich bude novou zkouškou odhodlání státní pokladny." # todo: NEW TRANSLATION
 thailand.381.a: "Ať výkopové práce začnou." # todo: NEW TRANSLATION
 thailand.382.t: "Etapa dokončena" # todo: NEW TRANSLATION
 thailand.382.d: "Další etapa kanálu je dokončena a inženýři ji schválili. Průkop je hlubší, stavba pokročila a vláda si dovoluje chvíli opatrné hrdosti, než dorazí další účet." # todo: NEW TRANSLATION
 thailand.382.a: "Vpřed k další etapě." # todo: NEW TRANSLATION
 thailand.383.t: "Překročení nákladů" # todo: NEW TRANSLATION
 thailand.383.d: "Poslední etapa výrazně překročila rozpočet. Tvrdá hornina, zatopená štola a upravený odhad dodavatele přiměly projektový úřad požádat vládu o rozhodnutí. Najít peníze, nebo přijmout, že kanál bude otevřen později, než bylo slíbeno." # todo: NEW TRANSLATION
 thailand.383.a: "Nalít do projektu peníze a dodržet harmonogram." # todo: NEW TRANSLATION
 thailand.383.b: "Přijmout zpoždění. Státní pokladna je přednější." # todo: NEW TRANSLATION
 thailand.384.t: "Kanál je připraven" # todo: NEW TRANSLATION
 thailand.384.d: "Poslední vrata plavební komory jsou zavěšena, vrcholový úsek zaplaven a lodivodi provedli první průjezdy v balastu. Kra kanál je dokončen až na slavnostní otevření. Království nyní může prohlásit megaprojekt za hotový." # todo: NEW TRANSLATION
 thailand.384.a: "Přestřihnout pásku a otevřít kanál." # todo: NEW TRANSLATION
 thailand.385.t: "Sabotáž na průkopu" # todo: NEW TRANSLATION
 thailand.385.d: "Výbuch na čerpací stanici a přerušená přístupová silnice nesou rukopis povstalců z hlubokého jihu. Kanál vede sporným územím a odpůrci Bangkoku našli cíl hodný novinových titulků. Projektový úřad žádá o rozhodnutí. Zabezpečit staveniště, nebo jednat s místními obyvateli." # todo: NEW TRANSLATION
 thailand.385.a: "Posílit bezpečnost podél koridoru." # todo: NEW TRANSLATION
 thailand.385.b: "Vyjednávat s místními vůdci. Kupovat mír, ne jen stráže." # todo: NEW TRANSLATION
 thailand.386.t: "Peking požaduje splacení půjčky" # todo: NEW TRANSLATION
 thailand.386.d: "Překročení nákladů aktivovalo doložku v dohodě o Pásu a stezce a pekingská delegace dorazila do Bangkoku se složkou plnou možností, z nichž všechny zvýhodňují Čínu. Dluh denominovaný v jüanech se stal pákou a samotný kanál zástavou. Vláda musí zvolit, jak na požadavek odpoví." # todo: NEW TRANSLATION
 thailand.386.a: "Přenechat provozní koncesi a dovolit Pekingu získat podíl na mýtném." # todo: NEW TRANSLATION
 thailand.386.b: "Restrukturalizovat dluh za tvrdých podmínek. Splácet jej a zachovat kanál thajský." # todo: NEW TRANSLATION
 thailand.386.c: "Nesplácet. Kanál je náš, ať si trhy dělají nejhorší." # todo: NEW TRANSLATION
 thailand.388.t: "Útěk kapitálu" # todo: NEW TRANSLATION
 thailand.388.d: "Nesplácení vyděsilo trhy. Zahraniční investoři odcházejí, baht klesá a centrální banka utrácí rezervy, aby paniku zpomalila. Škody jsou vážné, ale svrchovaný stát, který se postavil na odpor, je časem překoná." # todo: NEW TRANSLATION
 thailand.388.a: "Přečkat bouři." # todo: NEW TRANSLATION
 thailand.389.t: "Washington a Dillí zpozorněly" # todo: NEW TRANSLATION
 thailand.389.d: "Čínská provozní koncese na Kra vyvolala poplach od Washingtonu po Dillí. Obě hlavní města se obávají strategického hrdla v pekingských rukou a sledují, zda je Bangkok uklidní, nebo se přikloní ještě více na východ." # todo: NEW TRANSLATION
 thailand.389.a: "Uklidnit obě strany a vynaložit politický kapitál na jejich podporu." # todo: NEW TRANSLATION
 thailand.389.b: "Přiklonit se k Pekingu. Partnerství je rozhodnuto, Západ se přizpůsobí." # todo: NEW TRANSLATION
 thailand.390.t: "Průliv ztrácí monopol" # todo: NEW TRANSLATION
 thailand.390.d: "První plně naložené tankery proplouvají přes Kra a velké přístavy Malackého průlivu počítají ztráty. Singapur a Kuala Lumpur, které vybudovaly své bohatství na starém hrdle, sledují, jak jejich příjmy z tranzitu odtékají na sever, a Království, které je o ně připravilo, mu to brzy neodpustí." # todo: NEW TRANSLATION
 thailand.390.a: "Dva oceány nyní odpovídají Bangkoku." # todo: NEW TRANSLATION
 thailand.391.t: "Jaký bude kanál?" # todo: NEW TRANSLATION
 thailand.391.d: "Kanál je otevřen, ale čím má být? Pevností, kterou námořnictvo drží silou, uzavřenou soupeřům a posetou bateriemi? Nebo neutrální mezinárodní cestou otevřenou všem vlajkám a zaručenou smlouvou? Tato volba určí postavení Thajska mezi námořními mocnostmi na celou generaci." # todo: NEW TRANSLATION
 thailand.391.a: "Opevnit Kra, bránit jej a odepírat přístup." # todo: NEW TRANSLATION
 thailand.391.b: "Otevřít Kra všem, kdo v míru zaplatí mýtné." # todo: NEW TRANSLATION
 thailand_news.20.t: "Dva oceány, jedno Království" # todo: NEW TRANSLATION
 thailand_news.20.d: "Po letech práce, miliardách bahtů a geopolitice, kterou žádný inženýr nemohl předvídat, je Kra kanál otevřen. Poprvé mohou lodě proplouvat mezi Andamanským mořem a Thajským zálivem, aniž by obeplouvaly Malajský poloostrov. Mapa asijského obchodu byla překreslena a Bangkok drží pero." # todo: NEW TRANSLATION
 thailand_news.20.a: "Kanál budovaný celé století." # todo: NEW TRANSLATION
 thailand.393.t: "Vyvrhel regionu" # todo: NEW TRANSLATION
 thailand.393.d: "Maska spadla. Snaha Bangkoku podrobit si sousedy odňala veškeré zdání vůdčí role v ASEAN. Hlavní města jihovýchodní Asie se stahují a širší svět přepočítává své možnosti. Thajsko už není předsedou regionu. Je jeho hrozbou a diplomatické i hospodářské zdi už vyrůstají." # todo: NEW TRANSLATION
 thailand.393.a: "Ať se nás bojí. Říše nikdy nevznikla díky přátelům." # todo: NEW TRANSLATION
 thailand.394.t: "Washington odsuzuje Bangkok" # todo: NEW TRANSLATION
 thailand.394.d: "Spojené státy vydaly ostré odsouzení thajské agrese v jihovýchodní Asii. Washington naznačuje, že bude stát po boku ohrožených států regionu, zvažovat bezpečnostní záruky a tlačit své partnery k semknutí proti potenciálnímu hegemonovi. Americký vliv, o který Bangkok kdysi usiloval, mizí." # todo: NEW TRANSLATION
 thailand.394.a: "Americký nesouhlas pochod nezastaví." # todo: NEW TRANSLATION
 thailand.395.t: "Peking podává otevřenou ruku" # todo: NEW TRANSLATION
 thailand.395.d: "Tam, kde Washington ustupuje, Peking přichází. Čína vidí v izolovaném a agresivním Thajsku užitečného partnera, mocnost, která spálila mosty k Západu i regionu a nyní nemá kam jinam se obrátit. Postavení Bangkoku jako vyvrhele je příležitostí Pekingu a otevřená ruka přichází s podmínkami, které si Království už nemůže dovolit odmítnout." # todo: NEW TRANSLATION
 thailand.395.a: "Pokud nás Východ přijme, budiž." # todo: NEW TRANSLATION
 thailand.431.t: "Pozvání z Bangkoku" # todo: NEW TRANSLATION
 thailand.431.d: "Thajsko oficiálně pozvalo naši zemi ke vstupu do své Organizace smlouvy jihovýchodní Asie. Pakt nabízí společné velení, vzájemnou bezpečnost a jednotný regionální hlas pod vedením Bangkoku. ASEAN si však vždy střežil svou nezávislost a svázat svůj osud s Thajskem není malý krok. Volbu můžeme učinit svobodně a také ji odvolat, pokud nám přestane sloužit." # todo: NEW TRANSLATION
 thailand.431.a: "Přijímáme. Naše bezpečnost je silnější, když ji sdílíme." # todo: NEW TRANSLATION
 thailand.431.b: "Odmítáme. Naše nezávislost není na prodej." # todo: NEW TRANSLATION
 thailand.425.t: "[FROM.GetNameDefCap] podepisuje smlouvu" # todo: NEW TRANSLATION
 thailand.425.d: "Odpověď od [FROM.GetNameDefCap] zní ano. Jejich delegace míří do Bangkoku, aby smlouvu podepsala, a Organizace smlouvy jihovýchodní Asie získává dalšího člena. Každý podpis usnadňuje získání dalšího." # todo: NEW TRANSLATION
 thailand.425.a: "Ještě jedno místo u stolu." # todo: NEW TRANSLATION
 thailand.426.t: "[FROM.GetNameDefCap] odmítá pozvání" # todo: NEW TRANSLATION
 thailand.426.d: "[FROM.GetNameDefCap] nám poděkoval za nabídku a odmítl ji. Slova jsou vřelá, odpověď však zní ne. Pakt tohoto druhu nelze nikomu vnutit a dveře zůstávají otevřené." # todo: NEW TRANSLATION
 thailand.426.a: "Je to jejich volba. Nabídka trvá." # todo: NEW TRANSLATION
 SIA_kra_fortress_threat: "Opevnění Kra kanálu" # todo: NEW TRANSLATION
 SIA_kra_default_threat: "Thajské státní nesplácení" # todo: NEW TRANSLATION
 SIA_kra_chokepoint_threat: "Hrdlo Kra" # todo: NEW TRANSLATION
 SIA_asean_hegemon_threat: "Thajská snaha o hegemonii v ASEAN" # todo: NEW TRANSLATION
 thailand.410.t: "Mapa většího Království" # todo: NEW TRANSLATION
 thailand.410.d: "Znovu se objevily staré mapy, ty, které zobrazují Lan Na, šanské kopce, ztracené provincie Kambodže a Laosu i malajský jih jako právoplatně thajské. Pantaijské hnutí nyní promlouvá ve vládě a klade otázku přímo. Má Království vyhlásit své iredenty celému světu, nebo sledovat stejné cíle mírnějšími prostředky? Každá velmoc sleduje, jak Bangkok odpoví." # todo: NEW TRANSLATION
 thailand.410.a: "Vyhlásit to. Tyto země jsou thajské a svět by to měl vědět." # todo: NEW TRANSLATION
 thailand.410.b: "Tiše. Vybudujeme si pozici, aniž bychom chrastili šavlí." # todo: NEW TRANSLATION
 thailand.411.t: "Jeden lid, jeden osud" # todo: NEW TRANSLATION
 thailand.411.d: "Pantaijská myšlenka už není okrajovým romantickým snem důstojníků a historiků. Náměstí Sanam Luang zaplňují demonstrace a tisk přináší prapory jediného Taiského národa rozprostírajícího se od Jün-nanu až po šíji. Hnutí nyní získalo veřejnou tvář a vláda se mu rozhodla propůjčit také svou." # todo: NEW TRANSLATION
 thailand.411.a: "Nechat národ slyšet své vlastní jméno." # todo: NEW TRANSLATION
 thailand.412.t: "Bambus ve větru" # todo: NEW TRANSLATION
 thailand.412.d: "Thajsko se ohne, ale nezlomí. Tím, že Bangkok odmítl volit mezi Washingtonem a Pekingem, přiměl oba, aby se o něj ucházeli — stará bambusová diplomacie praktikovaná moderní rukou. Obě hlavní města vysílají přátelské signály a žádné si nemůže dovolit zatlačit Království do náruče toho druhého." # todo: NEW TRANSLATION
 thailand.412.a: "Necháváme si otevřené možnosti a naše přátele v nejistotě." # todo: NEW TRANSLATION
 thailand.413.t: "Otázka palivového cyklu" # todo: NEW TRANSLATION
 thailand.413.d: "Nové thajské reaktory fungují na svrchovaném palivovém cyklu, což znamená obohacování, a obohacování ztenčuje hranici mezi civilní energetikou a možností výroby zbraní. MAAE chce posílené záruky, Washington žádá ujištění a region chce vědět, co Bangkok zamýšlí. V dokumentech není žádný program bomby, schopnost je však nyní na dosah a Království se musí rozhodnout, jak daleko se k ní vydá." # todo: NEW TRANSLATION
 thailand.413.a: "Vzepřít se jim. Svrchované obohacování je naším právem, ať už jako pojistka, či nikoli." # todo: NEW TRANSLATION
 thailand.413.b: "Uklidnit je. Přijmout úplné záruky a zachovat důvěru." # todo: NEW TRANSLATION
 thailand.413.a_tooltip: "§RPoplach kvůli šíření jaderných zbraní.§! Thajsko získá pojmenovanou hrozbu §YSvrchované odmítnutí omezení obohacování§!, Spojené státy se ostře obrátí proti Bangkoku, zatímco Indie začne být obezřetná, a §Rvlyv USA v Thajsku klesne o 15 %§!." # todo: NEW TRANSLATION
 thailand.414.t: "Listina strážců" # todo: NEW TRANSLATION
 thailand.414.d: "Ústava je přepsána tak, aby strážci nikdy nemuseli spát. Jmenované rady, vyhrazené pravomoci a senát odpovídající kasárnám. Hluboký stát už není neformálním zvykem, ale písemnou zárukou. Pořádek je zajištěn a cena se platí tichou smrtí neomezené politiky." # todo: NEW TRANSLATION
 thailand.414.a: "Stabilita učiněná trvalou." # todo: NEW TRANSLATION
 SIA_guardianship_cost_tt: "Mezinárodní společenství se zděsí trvalého upevnění moci strážců.\n - §RPokladna -20§!\n - §Rnázor Spojených států a Spojeného království klesne§!" # todo: NEW TRANSLATION
 thailand.415.t: "Pax Aseana" # todo: NEW TRANSLATION
 thailand.415.d: "Od Manily po Jakartu, od Hanoje po Singapur, hlavní města jihovýchodní Asie pozvedají číše k Bangkoku. Tam, kde se kdysi obávala thajské snahy o nadvládu, nyní vidí garanta, Království, které vede důvěrou, zakládá svůj pakt na souhlasu a zachovává mír, který slíbilo. Toto je Pax Aseana a Thajsko stojí v jejím čele nikoli jako dobyvatel, ale jako partner." # todo: NEW TRANSLATION
 thailand.415.a: "Region v míru a Thajsko jeho základním kamenem." # todo: NEW TRANSLATION
 thailand.416.t: "Po generálovi" # todo: NEW TRANSLATION
 thailand.416.d: "Generála ještě čeká premiérské období, líbánky i řízený přechod. Establishment se může dále upevnit obsazením institucí a utažením stranické kontroly nad státním aparátem, nebo může vycítit náladu, institucionalizovat své zisky a ustoupit k civilnějšímu vystupování, než veřejnosti dojde trpělivost." # todo: NEW TRANSLATION
 thailand.416.a: "Upevnit se. Establishment utahuje svou kontrolu." # todo: NEW TRANSLATION
 thailand.416.b: "Institucionalizovat. Upevnit zisky a zjemnit tvář." # todo: NEW TRANSLATION
 thailand.417.t: "Východní motor se rozbíhá" # todo: NEW TRANSLATION
 thailand.417.d: "Jeřáby podél východního pobřeží se nikdy nezastaví. Nové železnice, nové ranveje, nové průmyslové parky. Východní hospodářský koridor se rozbíhá a investice se začínají samy násobit. Chonburi, Rayong a Chachoengsao se stávají strojovnou thajské ekonomiky." # todo: NEW TRANSLATION
 thailand.417.a: "Koridor ožívá." # todo: NEW TRANSLATION
 SIA_nuclear_defiance_threat: "Vzdor vůči omezení svrchovaného obohacování" # todo: NEW TRANSLATION
 SIA_tsunami_warning: "Síť varování před tsunami" # todo: NEW TRANSLATION
 thailand.363.t: "Past produktivity" # todo: NEW TRANSLATION
 thailand.363.d: "Léta růstu skončila. Jedna generace dokončila univerzitu v ochromené ekonomice stagnujících mezd, práce v továrnách přesunuté do zahraničí a trhu s nemovitostmi, na který nikdy nedosáhne. Jde o nejvzdělanější kohortu v thajských dějinách, přesto nikam nesměřuje — a přesně ví, koho obviňovat. Bangkokské křižovatky plní pozdravy třemi prsty a hashtagy se šíří rychleji, než je policie dokáže číst. Move Forward mluví jejich jazykem. Pomalá a pohodlná politika minulosti je neudrží." # todo: NEW TRANSLATION
 thailand.363.a: "Otevřít systém. Přistoupit na reformu a nechat novou politiku dýchat." # todo: NEW TRANSLATION
 thailand.363.b: "Nejprve pořádek. Vyčistit ulice a změnit téma na národ." # todo: NEW TRANSLATION
 thailand.363.c: "Koupit čas růstem. Přiklonit se ke stimulům a zmírnit tlak." # todo: NEW TRANSLATION
 thailand.364.t: "Dvě Thajska" # todo: NEW TRANSLATION
 thailand.364.d: "Uvnitř království existují dvě země. Jednou je Bangkok a provinční metropole, absolventi, kancelářské věže a kavárny, kde je reforma samozřejmostí. Druhou je rýžový pás a severovýchod, kde populisté vybudovali svou mašinérii na vesnických fondech a dotacích na rýži a nikdy se jí nevzdali. Chtějí jiné věci, bojí se jiných budoucností a volí jiné strany. Vláda si musí vybrat, kam zasadí svou vlajku, nebo předstírat, že dokáže stát zcela nad touto hranicí." # todo: NEW TRANSLATION
 thailand.364.a: "Dvořit se metropoli a absolventům, městské budoucnosti Thajska." # todo: NEW TRANSLATION
 thailand.364.b: "Dvořit se rýžovému pásu, venkovské základně, která přináší vítězství." # todo: NEW TRANSLATION
 thailand.364.c: "Stát nad rozdělením. Jen trůn sjednocuje obě Thajska." # todo: NEW TRANSLATION
 thailand.365.t: "Ozvěna zásahu" # todo: NEW TRANSLATION
 thailand.365.d: "Vyklizení ulic nevyřešilo křivdu. Naopak ji zostřilo. Hnutí, které se rozprchlo, se znovu shromáždilo, větší a rozzlobenější, jeho vůdci se nyní stali mučedníky a jeho požadavky nepřekročitelnými. Z protestu se stává určující záležitost celé generace a každý obušek použitý loni získal letos deset dalších příznivců." # todo: NEW TRANSLATION
 thailand.365.a: "Tohle už nelze vrátit. Přečkat bouři." # todo: NEW TRANSLATION
 thailand.418.t: "Džungle se probouzí" # todo: NEW TRANSLATION
 thailand.418.d: "Bída trvá příliš dlouho. V okresech zapomenutého venkova se znovu vynořují stará jména. Kádry, které před amnestií nosily pušky za Komunistickou stranu Thajska, nyní prošedivělé, ale nezapomenuté, i generace jejich vnuků, jimž už nezbylo co ztratit. Studijní kroužky se scházejí při světle lamp a rudá vlajka, odložená na čtyřicet let, je znovu rozvinována. Džungle, která pohltila poslední povstání, stále existuje. Stejně jako křivda, která ji naplnila." # todo: NEW TRANSLATION
 thailand.418.a: "Nechat buňky organizovat se. Venkov můžeme ztratit jen vlastní vinou." # todo: NEW TRANSLATION
 thailand.418.b: "Rozdrtit podzemí. Zadržet kádry, než se to rozšíří." # todo: NEW TRANSLATION
 thailand.418.c: "Odstranit bažinu křivdy. Nalít peníze do okresů." # todo: NEW TRANSLATION
 thailand.74.t: "Případ majetku" # todo: NEW TRANSLATION
 thailand.74.d: "Ústavní soud zvažuje, zda premiér ukryl podíly ve firmách za svou služebnou, řidičem a bodyguardem. Usvědčující rozsudek ukončí jeho premiérství dříve, než začne. Soudci jsou rozděleni a palác, tisk i generálové sledují, jak bude rozsudek vynesen." # todo: NEW TRANSLATION
 thailand.74.a: "Zatlačit na senát. Rozsudek dopadne v náš prospěch." # todo: NEW TRANSLATION
 thailand.74.b: "Podřídit se procesu a nechat soud rozhodnout." # todo: NEW TRANSLATION
 thailand.75.t: "Tak Bai" # todo: NEW TRANSLATION
 thailand.75.d: "Na muslimském hlubokém jihu vojáci nakládají stovky spoutaných demonstrantů do armádních nákladních vozů. Než konvoj dorazí do cíle, pětaosmdesát jich zemře, většina udušením. Záběry obletí svět. Důstojnický sbor se semkne kolem svých a otázkou zůstává, zda se civilní vláda odváží zeptat, co se stalo." # todo: NEW TRANSLATION
 thailand.75.a: "Postavit se za armádu. Žádné vyšetřování." # todo: NEW TRANSLATION
 thailand.75.b: "Nařídit vyšetřování. Armáda se zodpovídá nám." # todo: NEW TRANSLATION
 thailand.76.t: "Skenery CTX" # todo: NEW TRANSLATION
 thailand.76.d: "Účet za detektory bomb na novém letišti se ztrojnásobil a přirážka zmizela v řetězci prostředníků blízkých vládě. Poctivý audit by vládu zahanbil. Pohřbení auditu zachová rozdíl, ale posílí narůstající příběh vlády, která se ke státní pokladně chová jako k rodinnému účtu." # todo: NEW TRANSLATION
 thailand.76.a: "Pohřbít audit a ponechat si rozdíl." # todo: NEW TRANSLATION
 thailand.76.b: "Zrušit smlouvu a omezit ztráty." # todo: NEW TRANSLATION
 thailand.77.t: "Umlčování kritiků" # todo: NEW TRANSLATION
 thailand.77.d: "Večerní vysílání mediálního magnáta se stalo shromaždištěm protivládní ulice a nezávislá stanice iTV uniká z vodítka. Žaloby za pomluvu, tlak na licenci a přátelští vlastníci by je mohli přivést k poslušnosti, ovšem za cenu potvrzení všeho, co kritici říkají o plíživé vládě jednoho muže." # todo: NEW TRANSLATION
 thailand.77.a: "Přivést tisk k poslušnosti." # todo: NEW TRANSLATION
 thailand.77.b: "Nechat tisk pracovat a odpovídat na slova slovy." # todo: NEW TRANSLATION
 thailand.78.t: "Parlament jednoho" # todo: NEW TRANSLATION
 thailand.78.d: "Vládnoucí strana získala naprostou většinu, první jednobarevnou vládu v thajských dějinách. Bez koalice, kterou by bylo třeba řídit, a s nezávislými úřady obsazenými loajalisty může premiér vládnout bez kontroly. Pro rýžový pás jde o mandát, pro bangkocký establishment a kasárna o vznikající volební diktaturu." # todo: NEW TRANSLATION
 thailand.78.a: "Vládnout bez kontroly. Lid nám to svěřil." # todo: NEW TRANSLATION
 thailand.78.b: "Dvořit se opozici a sdílet stůl." # todo: NEW TRANSLATION
 thailand.73.t: "Prodej Shin Corp" # todo: NEW TRANSLATION
 thailand.73.d: "Rodina premiéra prodává své telekomunikační impérium singapurskému státnímu fondu za přibližně sedmdesát tři miliard bahtů a díky vhodné restrukturalizaci nezaplatí ani satang na daních. Z právního hlediska je vše bezchybné, politický obraz je však katastrofální. Během několika dní zaplní třídy davy ve žlutých košilích a armáda se začne nahlas ptát, zda ústava stále zavazuje muže, který prodal národní majetek bez daně." # todo: NEW TRANSLATION
 thailand.73.a: "Strčit si miliardy do kapsy. Všechno bylo legální." # todo: NEW TRANSLATION
 thailand.73.b: "Zaplatit daň a utišit zuřivost." # todo: NEW TRANSLATION
 thailand.420.t: "Populistický mandát" # todo: NEW TRANSLATION
 thailand.420.d: "Moc přešla do rukou populistického tábora. Rýžový pás a městská chudina znovu získaly svou vládu a s ní i thaksinistický program vesnických fondů, levné zdravotní péče a vůdce, který mluví jejich jazykem. Starý establishment ztrácí půdu pod nohama, síť paláce i reformní klub ustupují, zatímco nová mašinérie přebírá páky moci. Kasárna jako vždy sledují situaci." # todo: NEW TRANSLATION
 thailand.420.a: "Venkov má svou vládu." # todo: NEW TRANSLATION
 thailand.421.t: "Establishment se vrací" # todo: NEW TRANSLATION
 thailand.421.d: "Páky moci přešly ke kralovskému establishmentu, ať už prostřednictvím voleb, dohody s palácem nebo tanků za úsvitu. Síťová monarchie znovu upevňuje svou pozici. Tajní radové, generálové a velké rody se semknou kolem trůnu. Populistická mašinérie se rozpouští spolu se svým mandátem a reformní hnutí je odsunuto od stolu. Říše se stabilizuje pod známými rukama." # todo: NEW TRANSLATION
 thailand.421.a: "Říše je v pořádku." # todo: NEW TRANSLATION
 thailand.422.t: "Reformní vlna" # todo: NEW TRANSLATION
 thailand.422.d: "K moci nastoupila nová generace. Reformní hnutí, které pochodovalo ulicemi, nyní sedí ve vládě a na pořadu dne je rozebrání starého řádu, branné povinnosti, monopolů a nedotknutelných institucí. Vliv předchozí vlády slábne, jak její představitelé odcházejí. Otázkou je, zda establishment nechá tento experiment pokračovat." # todo: NEW TRANSLATION
 thailand.422.a: "Budoucnost je nyní." # todo: NEW TRANSLATION
 thailand.423.t: "Soud rozhoduje" # todo: NEW TRANSLATION
 thailand.423.d: "Ústavní soud si vzal na mušku vládnoucí stranu. Připravuje se příkaz k jejímu rozpuštění a vláda by mohla být sesazena soudním rozhodnutím, stejně jako mnohé předchozí. Vláda se může rozsudku podřídit a předat moc soupeřům, nebo vzdorovat soudu a odvážit se čelit následkům." # todo: NEW TRANSLATION
 thailand.423.a: "Přijmout rozsudek a důstojně odstoupit." # todo: NEW TRANSLATION
 thailand.423.b: "Vzdorovat soudu. Zodpovídáme se voličům, ne soudcům." # todo: NEW TRANSLATION
 thailand.424.t: "Demokraté přečkali" # todo: NEW TRANSLATION
 thailand.424.d: "Moc se vrátila Demokratické straně, nejstarší straně Království, ať už obratem u volebních uren, nebo rozhodnutím soudu, který předal výkonnou moc opozici. Žádné drtivé vítězství, žádný charismatický miliardář, jen trpělivá a neokázalá práce široké civilní koalice, která sází na instituce namísto jediného vůdce. Vliv předchozí vlády se rozpouští spolu s jejím mandátem. A v rýžovém pásu už Thaksinova mašinérie znovu nabírá sílu pro další kolo." # todo: NEW TRANSLATION
 thailand.424.a: "Establishment drží linii." # todo: NEW TRANSLATION
 thailand.430.t: "K čemu jsou ty bomby?" # todo: NEW TRANSLATION
 thailand.430.d: "První thajské hlavice jsou skutečné, ale zbraň, která není přiznaná, nikoho neodstrašuje. Rada národní bezpečnosti musí vyřešit otázku, na kterou musí odpovědět každý jaderný stát. Za jakých okolností by je Království někdy použilo? Postoj, který vyhlásíme, ovlivní, jak region i velmoci vyloží naše záměry." # todo: NEW TRANSLATION
 thailand.430.a: "Pouze odveta. Zaútočíme jen tehdy, budeme-li zasaženi strategickými zbraněmi." # todo: NEW TRANSLATION
 thailand.430.b: "Taktická i strategická odveta. Na jakýkoli jaderný útok odpovíme stejným způsobem." # todo: NEW TRANSLATION
 thailand.430.c: "Přiznané první použití. Nechť naši nepřátelé přemýšlejí a bojí se." # todo: NEW TRANSLATION
 thailand_news.30.t: "Thajsko vstupuje do jaderného klubu" # todo: NEW TRANSLATION
 thailand_news.30.d: "Bangkok potvrdil to, o čem zpravodajské služby šeptaly celé měsíce. Království Thajska vlastní jaderné zbraně. Hlavní města napříč Asií i mimo ni horečně přepočítávají rovnováhu sil, protože nový účastník překročil práh." # todo: NEW TRANSLATION
 thailand_news.30.a: "Mapa se změnila." # todo: NEW TRANSLATION
 SIA_threat_thai_bomb: "Thajský program jaderných zbraní" # todo: NEW TRANSLATION
 SIA_threat_thai_enrichment: "Thajský program obohacování uranu" # todo: NEW TRANSLATION
 SIA_threat_thai_first_use: "Thajská doktrína přiznaného prvního použití" # todo: NEW TRANSLATION
 thailand.432.t: "Strategie nemůže čekat" # todo: NEW TRANSLATION
 thailand.432.d: "Léta průmyslové výroby učinila Thajsko dostatečně bohatým na odkládání rozhodnutí a ministerstva se o únikovém plánu přou příliš dlouho. Hranice nečeká a Vietnam nás dohání. Národní strategie musí být přijata nyní." # todo: NEW TRANSLATION
 thailand.432.a: "Přijmout ji dekretem" # todo: NEW TRANSLATION
 thailand.432.b: "Nejprve vybudovat konsenzus" # todo: NEW TRANSLATION
 thailand.433.t: "Štít ze severu" # todo: NEW TRANSLATION
 thailand.433.d: "Bangkok požádal Peking, aby rozšířil formální záruku nad Královstvím. Čínský závazek by ukotvil thajský příklon k pevnině a odradil každého soupeře pokoušeného vyzkoušet jeho hranice. Cenou je trvalý závazek daleko od domova." # todo: NEW TRANSLATION
 thailand.433.a: "Rozšířit naši ochranu" # todo: NEW TRANSLATION
 thailand.433.b: "Bangkok může stát sám" # todo: NEW TRANSLATION
 SIA_frontier_overextension_idea: "Přetížení hranice" # todo: NEW TRANSLATION
 SIA_frontier_overextension_idea_desc: "Divize nasazené na západních pochodech nejsou divizemi sledujícími Bangkok. Královská thajská armáda je více roztažená, než si vláda připouští, a veřejnost pociťuje napětí závazku učiněného ještě před prvním výstřelem." # todo: NEW TRANSLATION
 SIA_regional_pariah: "Vyvrhel regionu" # todo: NEW TRANSLATION
 SIA_regional_pariah_desc: "Bangkok spolkl barmské pohraničí celé. Washington a Peking odsuzují zabrání území, hlavní města ASEAN nervózně sledují vlastní hranice a thajští vývozci platí za pošramocené jméno království v každém zahraničním kontraktu." # todo: NEW TRANSLATION
 SIA_frontier_partners: "Partneři na hranici" # todo: NEW TRANSLATION
 SIA_frontier_partners_desc: "Znovuzískaná pohraniční území jsou spravována prostřednictvím klientů a dohod namísto okupace. Měkká síla je levnější než posádky. Správa zůstává úsporná a stavební čety se pohybují volně, bez diplomatického odporu, který by přinesla anexe." # todo: NEW TRANSLATION
 SIA_kings_moral_authority: "Morální autorita krále" # todo: NEW TRANSLATION
 SIA_kings_moral_authority_desc: "Sedm desetiletí na trůně propůjčilo panovníkovi morální postavení, kterému se žádný politik nepřibližuje. V krizových chvílích slovo z paláce vyřešilo to, co armády nedokázaly." # todo: NEW TRANSLATION
 SIA_royal_guidance_idea: "Pod královským dohledem" # todo: NEW TRANSLATION
 SIA_royal_guidance_idea_desc: "Každoroční pokyny paláce stabilizují království a chrání je před zahraničním vměšováním, avšak zvolená vláda, která se podřizuje trůnu, zjišťuje, že její vlastní pravomoc sahá jen tak daleko." # todo: NEW TRANSLATION
 SIA_three_pillars_idea: "Národ, náboženství, král" # todo: NEW TRANSLATION
 SIA_three_pillars_idea_desc: "Oficiální nacionalismus spojený s trůnem a sanghou. Buddhistická většina je pevně semknuta proti podvracení a cizím myšlenkám, ovšem za cenu méně kritického a poddajnějšího veřejného smýšlení." # todo: NEW TRANSLATION
 SIA_deep_south_grievance: "Křivda na jihu" # todo: NEW TRANSLATION
 SIA_deep_south_grievance_desc: "V malajsko-muslimských provinciích působí buddhisticko-royalistické krédo jako vyloučení. Křivdy Patani tvrdnou a Bangkok platí stabilitou a politickým kapitálem, aby udržel víko." # todo: NEW TRANSLATION
 SIA_scarred_coast: "Zjizvené pobřeží" # todo: NEW TRANSLATION
 SIA_scarred_coast_desc: "Bez státních peněz na obnovu zůstávají andamanská letoviska po léta napůl zničená. Hotely zejí prázdnotou, suť není odklizena a turisté míří jinam." # todo: NEW TRANSLATION
 SIA_new_reign_mourning: "Království ve smutku" # todo: NEW TRANSLATION
 SIA_new_reign_mourning_desc: "Národ truchlí za zesnulým králem. Veřejný život je utlumen, zábava pozastavena a politika dodržuje neklidné příměří." # todo: NEW TRANSLATION
 SIA_ninth_reign_barami: "Barami deváté vlády" # todo: NEW TRANSLATION
 SIA_ninth_reign_barami_desc: "Král Bhumibol vládl více než půl století, déle než kterýkoli panovník na světě. Jeho barami, morální autorita získaná během těchto desetiletí, stála nad každým politikem i generálem. V krizové chvíli slovo z paláce vyřešilo to, co žádná vláda nedokázala, a trůn chránil království před zahraničními záměry." # todo: NEW TRANSLATION
 SIA_ninth_reign_zenith: "Síťová monarchie na vzestupu" # todo: NEW TRANSLATION
 SIA_ninth_reign_zenith_desc: "Palác už pouze nevládne. Prostřednictvím Tajné rady, soudů a sítě loajálních důstojníků a podnikatelů zasahuje Koruna do každé státní instituce. Královo slovo má váhu zákona, odpor nenachází oporu a zahraniční vliv se rozbíjí o zeď royalistického konsenzu." # todo: NEW TRANSLATION
 SIA_tenth_reign_barami: "Barami desáté vlády" # todo: NEW TRANSLATION
 SIA_tenth_reign_barami_desc: "Trůn přešel na krále Vajiralongkorna, úcta se však nedědí. Nový panovník zastává úřad, který držel jeho otec, bez morální autority, jež jej kdysi naplňovala. Palác stále stabilizuje říši a chrání ji před zahraničním vměšováním, přesto je každá páka jen bledší ozvěnou deváté vlády." # todo: NEW TRANSLATION
 SIA_two_thailands: "Dvě Thajska" # todo: NEW TRANSLATION
 SIA_two_thailands_desc: "Uvnitř jedné hranice existují dvě země. Bangkok a centrální pláně drží bohatství, ministerstva a starý establishment. Venkovský sever a severovýchod drží hlasy a sílící přesvědčení, že jejich volební lístky kradou soudy a převraty. Propast mezi nimi polarizuje každé volby a nutí státní pokladnu kupovat mír, který si sotva může dovolit." # todo: NEW TRANSLATION
 SIA_three_pillars_start: "Národ, náboženství, král" # todo: NEW TRANSLATION
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$" # todo: NEW TRANSLATION
 SIA_populist_machine: "Populistická mašinérie" # todo: NEW TRANSLATION
 SIA_populist_machine_desc: "Vesnické fondy, zdravotní karty, oddlužení. Politická mašinérie, která proměňuje poskytování vládních služeb ve volební loajalitu, cyklus za cyklem." # todo: NEW TRANSLATION
 SIA_yellow_shirts_idea: "Žluté košile" # todo: NEW TRANSLATION
 SIA_yellow_shirts_idea_desc: "Lidová aliance pro demokracii je royalistická, městská, středostavovská a přesvědčená, že volební většina je kupována. Když zaplní ulice, vlády se otřásají." # todo: NEW TRANSLATION
 SIA_red_shirts_idea: "Červené košile" # todo: NEW TRANSLATION
 SIA_red_shirts_idea_desc: "Sjednocená fronta pro demokracii proti diktatuře je venkovská, severní a severovýchodní. Vyhrála každé volby, kterých se účastnila, a ztratila každou vládu, kterou vytvořila. Je většinou a ví to." # todo: NEW TRANSLATION
 SIA_junta_government: "Vláda junty" # todo: NEW TRANSLATION
 SIA_junta_government_desc: "Vojenská rada vládne dekretem. Pořádek je vynucován, nesouhlas je „usměrňován“ a na otázku, kdy se vrátí volby, se odpovídá úsměvem a odkladem." # todo: NEW TRANSLATION
 SIA_guided_democracy: "Systém z roku 2017" # todo: NEW TRANSLATION
 SIA_guided_democracy_desc: "Jmenovaný senát, závazná dvacetiletá strategie a soudy spolehlivého směřování. Volby se konají, ale hřiště je oplocené." # todo: NEW TRANSLATION
 SIA_network_monarchy_idea: "Síťová monarchie" # todo: NEW TRANSLATION
 SIA_network_monarchy_idea_desc: "Palác, tajná rada, armáda a justice tvoří neformální síť autority, která působí nad volební politikou a přežívá každou vládu." # todo: NEW TRANSLATION
 SIA_reform_momentum: "Dynamika reforem" # todo: NEW TRANSLATION
 SIA_reform_momentum_desc: "Poprvé za celou generaci patří energie v thajské politice těm, kdo chtějí systém změnit, nikoli jej pouze spravovat." # todo: NEW TRANSLATION
 SIA_consolidated_democracy_idea: "Konsolidovaná demokracie" # todo: NEW TRANSLATION
 SIA_consolidated_democracy_idea_desc: "Civilní kontrola, ústavní vláda a veřejnost, která očekává, že převraty patří minulosti. Thajské demokratické instituce konečně stojí na vlastních základech." # todo: NEW TRANSLATION
 SIA_republic_turmoil: "Ústavní zmatek" # todo: NEW TRANSLATION
 SIA_republic_turmoil_desc: "Otázka republiky rozdělila každou instituci, každou provincii i mnoho rodin. Stát přetrvává, ale konsenzus pod ním zmizel." # todo: NEW TRANSLATION
 SIA_pan_thai_irredentism: "Pantaijský iredentismus" # todo: NEW TRANSLATION
 SIA_pan_thai_irredentism_desc: "Vyprávění o ztracených územích se znovu stalo státní doktrínou. Taiské národy tvoří jeden národ, ústupky z let 1893–1909 jsou nelegitimní a dějiny dluží Thajsku nápravu." # todo: NEW TRANSLATION
 SIA_drug_war_stain: "Mezinárodní odsouzení" # todo: NEW TRANSLATION
 SIA_drug_war_stain_desc: "Tisíce mimosoudních zabití během války proti drogám pronásledují Thajsko na každém fóru o lidských právech a při každém diplomatickém jednání." # todo: NEW TRANSLATION
 SIA_tourism_powerhouse: "Turistická velmoc" # todo: NEW TRANSLATION
 SIA_tourism_powerhouse_desc: "Desítky milionů návštěvníků ročně činí z turismu pilíř ekonomiky a z thajské značky globální aktivum." # todo: NEW TRANSLATION
 SIA_tourism_powerhouse_2: "Průmyslová politika cestovního ruchu" # todo: NEW TRANSLATION
 SIA_tourism_powerhouse_2_desc: "Cestovní ruch se z nárazového sezónního příjmu stává řízeným pilířem státní politiky. Diverzifikovaná základna návštěvníků s vyššími výdaji platí skutečné firemní daně a je méně závislá na zahraničních cestovních konglomerátech než kdy dříve." # todo: NEW TRANSLATION
 SIA_tourism_luxury_boom: "Nárůst luxusního cestování" # todo: NEW TRANSLATION
 SIA_tourism_luxury_boom_desc: "Vlna návštěvníků s vysokými výdaji plní pětihvězdičková letoviska a zvyšuje příjmy. S příchodem konce sezóny vlna opadne." # todo: NEW TRANSLATION
 SIA_credit_boom_overheating: "Přehřívání úvěrového boomu" # todo: NEW TRANSLATION
 SIA_credit_boom_overheating_desc: "Levné peníze proudily rychleji, než je bankovní systém dokázal vstřebat, a dlužníci nyní rozdíl splácejí vyššími úroky. Tlak poleví, jakmile se cyklus ochladí." # todo: NEW TRANSLATION
 SIA_sustainable_extraction: "Spravované zdroje" # todo: NEW TRANSLATION
 SIA_sustainable_extraction_desc: "Povolení se vydávají pomalu a koncese zůstávají omezené, stát však pevněji kontroluje, kdo těží ze surovin, a je méně závislý na zahraničním kapitálu, který jinde financuje rychlejší těžbu." # todo: NEW TRANSLATION
 SIA_digital_national_champions: "Národní digitální šampioni" # todo: NEW TRANSLATION
 SIA_digital_national_champions_desc: "Několik státem zvýhodněných platforem záměrně ovládá trh, snadno se zdaňují a regulují, ale jejich pohodlné postavení je přestává nutit ke zlepšování." # todo: NEW TRANSLATION
 SIA_detroit_of_asia_idea: "Detroit Asie" # todo: NEW TRANSLATION
 SIA_detroit_of_asia_idea_desc: "Východní pobřeží montuje pickupy pro celý svět. Automobilové dodavatelské řetězce ukotvují thajskou výrobu a udržují exportní bilanci zdravou." # todo: NEW TRANSLATION
 SIA_bamboo_diplomacy: "Bambusová diplomacie" # todo: NEW TRANSLATION
 SIA_bamboo_diplomacy_desc: "Ohýbat se ve větru, nikdy se nezlomit. Bangkok si současně udržuje americké spojenectví, čínské investice i vlastní úsudek." # todo: NEW TRANSLATION
 SIA_deep_south_insurgency: "Povstání na jihu" # todo: NEW TRANSLATION
 SIA_deep_south_insurgency_desc: "Ozbrojené separatistické povstání v malajsko-muslimských provinciích Pattani, Yala a Narathiwat. Jeho intenzita roste a klesá podle toho, zda vláda volí sílu, rozvoj nebo dialog." # todo: NEW TRANSLATION
 SIA_war_on_drugs_campaign: "Válka proti drogám" # todo: NEW TRANSLATION
 SIA_war_on_drugs_campaign_desc: "Černé seznamy, kvóty a nejasná možnost zastřelení. Obchod s metamfetaminem ustupuje — a s ním i vláda práva." # todo: NEW TRANSLATION
 SIA_deep_south_insurgency_1: "Povstání na jihu" # todo: NEW TRANSLATION
 SIA_deep_south_insurgency_1_desc: "$SIA_deep_south_insurgency_desc$" # todo: NEW TRANSLATION
 SIA_deep_south_insurgency_2: "Povstání na jihu" # todo: NEW TRANSLATION
 SIA_deep_south_insurgency_2_desc: "$SIA_deep_south_insurgency_desc$" # todo: NEW TRANSLATION
 SIA_deep_south_insurgency_3: "Povstání na jihu" # todo: NEW TRANSLATION
 SIA_deep_south_insurgency_3_desc: "$SIA_deep_south_insurgency_desc$" # todo: NEW TRANSLATION
 SIA_pacified_but_smoldering: "Uklidněno, ale doutná" # todo: NEW TRANSLATION
 SIA_pacified_but_smoldering_desc: "Železná pěst zabrala. Podle jediného měřítka, které armáda uznává, je jih klidný. Celá generace však vyrostla pod zákazem vycházení a na kontrolních stanovištích a křivda se místo zmizení stáhla do podzemí. Občas stále vzplane incident a studny pro nábor nejsou vyschlé." # todo: NEW TRANSLATION
 SIA_royal_pacification: "Královské uklidnění" # todo: NEW TRANSLATION
 SIA_royal_pacification_desc: "Řízený a sledovaný klid udržovaný patronátem a přítomností pod královskou záštitou. Rozvoj pokračuje, místní hodnostáři jsou kooptováni a legitimita monarchie na jihu se tiše obnovuje. Nejde o smír, ale o správcovství." # todo: NEW TRANSLATION
 SIA_pattani_autonomy: "Autonomie Patani" # todo: NEW TRANSLATION
 SIA_pattani_autonomy_desc: "Samosprávná zvláštní správa uvnitř unitárního Thajska s volenou regionální radou, výukou v místních jazycích a podílem jižních příjmů ponechaným na jihu. Mírová dividenda je skutečná a precedent zneklidňuje bangkocké centralisty." # todo: NEW TRANSLATION
 SIA_limited_devolution: "Omezená decentralizace" # todo: NEW TRANSLATION
 SIA_limited_devolution_desc: "Rámec autonomie byl oslaben, aby uklidnil establishment. Určitá míra místní správy, ale žádná skutečná samospráva. Zbraně jsou prozatím zticha, avšak dohoda zanechává nespokojený jih i centrum." # todo: NEW TRANSLATION
 SIA_hearts_minds_education_strain: "Program srdcí a myslí" # todo: NEW TRANSLATION
 SIA_hearts_minds_education_strain_desc: "Výuka v malajštině, náboženská osvěta a vesnické zprostředkování jsou financovány z rozpočtu školství. Mapa incidentů se uklidňuje, ale školský systém účet zaplatí." # todo: NEW TRANSLATION
 SIA_southern_development_levy: "Poplatek na rozvoj jihu" # todo: NEW TRANSLATION
 SIA_southern_development_levy_desc: "Rozvojová ofenziva ve třech provinciích vytlačuje civilní průmysl z výroby pro spotřebu. Peníze rok proudí na jih a domácí regály to pociťují." # todo: NEW TRANSLATION
 SIA_peoples_constitution: "Lidová ústava" # todo: NEW TRANSLATION
 SIA_peoples_constitution_desc: "Nový základní zákon sepsaný za široké občanské účasti zakotvuje práva, civilní dohled nad armádou a nezávislé instituce a obnovuje veřejnou důvěru v ústavní pořádek." # todo: NEW TRANSLATION
 SIA_worlds_rice_bowl: "Rýžnice světa" # todo: NEW TRANSLATION
 SIA_worlds_rice_bowl_desc: "Thajská rýže Hom Mali a jasmínová rýže dosahují prémiových cen na každém kontinentu. Příjmy ze zemědělského vývozu ukotvují běžný účet a každá sklizeň znovu upevňuje diplomatickou váhu Bangkoku." # todo: NEW TRANSLATION
 SIA_bri_debt: "Dluhová expozice Pásu a stezky" # todo: NEW TRANSLATION
 SIA_bri_debt_desc: "Půjčky na infrastrukturu v rámci Pásu a stezky zaplňují mezery, které rozpočet nedokáže pokrýt, jejich podmínky jsou však psány v Pekingu. Fiskální svrchovanost Thajska se s každou podepsanou dohodou zmenšuje." # todo: NEW TRANSLATION
 SIA_landslide_mandate: "Mandát lidu" # todo: NEW TRANSLATION
 SIA_landslide_mandate_desc: "Drtivé vítězství poskytlo vládě skutečný lidový mandát. Stranická mašinérie je povzbuzená, venkovská základna mobilizovaná a opozice zatlačená do defenzivy, generálové však čísla velmi pozorně sledují." # todo: NEW TRANSLATION
 SIA_ceo_state: "Stát generálního ředitele" # todo: NEW TRANSLATION
 SIA_ceo_state_desc: "Vláda se změnila v zasedací místnost a ministerstva v holdingovou společnost. Rozhodnutí se pohybují rychle a odpovědnost pomaleji. Kontroly a rovnováhy nezmizely. Jen se přestavují." # todo: NEW TRANSLATION
 SIA_cult_of_the_ceo: "Kult generálního ředitele" # todo: NEW TRANSLATION
 SIA_cult_of_the_ceo_desc: "Premiér upustil od divadla konzultací. Jeho hodnocení oblíbenosti je zbraní, kritici překážkami a vnitrostranické postupy jsou tento týden tím, co řekne on. Royalistická síť se schází poněkud častěji než obvykle." # todo: NEW TRANSLATION
 SIA_dynasty_politics: "Dynastická politika" # todo: NEW TRANSLATION
 SIA_dynasty_politics_desc: "Jméno Shinawatra se nyní stalo dynastií, značkou, patronátní sítí a nástupnickým plánem spojenými v jediné rodině. Loajalita ke straně a rodině se staly nerozlišitelnými." # todo: NEW TRANSLATION
 SIA_institutionalized_party: "Institucionalizovaná strana" # todo: NEW TRANSLATION
 SIA_institutionalized_party_desc: "Hnutí přežilo exil, dva převraty a rozpuštění sedmnácti stran. Stalo se něčím trvalejším než kterýkoli jednotlivý vůdce, skutečnou politickou institucí zakořeněnou v každé provincii." # todo: NEW TRANSLATION
 SIA_privy_council_idea: "Síť tajné rady" # todo: NEW TRANSLATION
 SIA_privy_council_idea_desc: "Desetiletí budování aliancí generála Prema Tinsulanondy vytvořila síť prostupující vyšší armádou, justicí i státní službou. Její členové od sítě nedostávají žádný plat. Nepotřebují ho." # todo: NEW TRANSLATION
 SIA_judicialization: "Politika soudní síně" # todo: NEW TRANSLATION
 SIA_judicialization_desc: "Ústavní soud se stal samostatným politickým aktérem. Každá petice je zbraní a každý rozsudek vítězstvím jedné frakce a ranou pro druhou. Opozice studuje právo, aby přežila." # todo: NEW TRANSLATION
 SIA_isoc_network: "Síť ISOC" # todo: NEW TRANSLATION
 SIA_isoc_network_desc: "Velitelství operací vnitřní bezpečnosti prostupuje každou provincií a podléhá armádě, nikoli voleným ministrům. Jeho zpravodajská síť činí dosah státu neviditelným, všudypřítomným a pozoruhodně účinným." # todo: NEW TRANSLATION
 SIA_crown_property_idea: "Úřad královského majetku" # todo: NEW TRANSLATION
 SIA_crown_property_idea_desc: "Obchodní rameno paláce drží podíly v půdě, bankovnictví a pojišťovnictví v hodnotě stovek miliard bahtů. Absolutní monarchie skončila. Ekonomická monarchie si vede velmi dobře." # todo: NEW TRANSLATION
 SIA_uncle_tu_honeymoon: "Líbánky strýčka Tua" # todo: NEW TRANSLATION
 SIA_uncle_tu_honeymoon_desc: "Pořádek obnoven, PDRC z ulic pryč a vláda s dvacetiletým plánem. Prozatím dává veřejná touha po stabilitě novému premiérovi neobvyklou míru tolerance." # todo: NEW TRANSLATION
 SIA_uncle_tu_fatigue: "Únava z Prayutha" # todo: NEW TRANSLATION
 SIA_uncle_tu_fatigue_desc: "Premiér, který slíbil, že politika bude nudná, uspěl — jen špatným způsobem. Reformní agenda ustrnula, slíbené volby se neustále odkládají a mladší Thajci se začínají ptát, kdy přesně mělo skončit to „dočasné“." # todo: NEW TRANSLATION
 SIA_reform_spring: "Reformní jaro" # todo: NEW TRANSLATION
 SIA_reform_spring_desc: "Vlna občanské energie strhla reformní hnutí. Nové tváře, nové požadavky a nálada v ulicích, jakou starší politici nezažili celou generaci. Establishment si toho všímá, ne vždy s potěšením." # todo: NEW TRANSLATION
 SIA_youthquake: "Otřes mladých" # todo: NEW TRANSLATION
 SIA_youthquake_desc: "Univerzitní kampusy, sociální sítě a nároží překypují politickou energií. Mladí Thajci, kteří nikdy nevolili, nyní kandidují, pracují ve stranických kancelářích a získávají peníze online. Technokraté ve výcviku jsou vzdělanější než kterákoli předchozí generace." # todo: NEW TRANSLATION
 SIA_barracks_pushback: "Odpor kasáren" # todo: NEW TRANSLATION
 SIA_barracks_pushback_desc: "Vyšší důstojníci dali prostřednictvím vysloužilých prostředníků, výmluvných mlčení a kousavých tiskových brífinků najevo, že tempo civilní reformy zkouší institucionální trpělivost armády. Armáda stále kontroluje vlastní povyšování, rozpočty i přidělování základen." # todo: NEW TRANSLATION
 SIA_thai_republic: "Thajská republika" # todo: NEW TRANSLATION
 SIA_thai_republic_desc: "Nejdéle přežívající konstituční monarchie světa se proměnila. Přímo volený prezident, plně svrchovaný parlament a ústava sepsaná bez vojenského veta. Změna nebyla bez krve, ale obstála." # todo: NEW TRANSLATION
 SIA_mandate_recovery: "Mandát obnovy" # todo: NEW TRANSLATION
 SIA_mandate_recovery_desc: "Vláda prohlásila hospodářskou obnovu za svou první prioritu. Náklady na spotřebu jsou stlačeny a stavební programy urychleny. Každý baht produktivní investice má po následující dva roky plnou podporu vlády." # todo: NEW TRANSLATION
 SIA_mandate_order: "Mandát pořádku" # todo: NEW TRANSLATION
 SIA_mandate_order_desc: "Prvním krokem vlády je stabilizace před reformou. Instituce posílené, soudy respektované a politické tápání potlačené. Sázkou je, že přesvědčivě nastolený pořádek získá důvěru, kterou bude později reforma potřebovat." # todo: NEW TRANSLATION
 SIA_mandate_outreach: "Mandát otevřenosti" # todo: NEW TRANSLATION
 SIA_mandate_outreach_desc: "Diplomacie a obchod jsou vyhlášenými prioritami vlády. Velvyslanectví jsou plně obsazena, ministerské delegace četné a ministerstvo obchodu dostalo rozšířený rozpočet i přímou linku do premiérova diáře." # todo: NEW TRANSLATION
 SIA_uneasy_compromise: "Nejistý kompromis" # todo: NEW TRANSLATION
 SIA_uneasy_compromise_desc: "Generálové sedí ve vládě a politici si ponechávají mandát — národní vláda, která drží Království pohromadě silou vzájemné nedůvěry. Stabilita je vykoupena cenou rozhodné akce. Každé ministerstvo je sledováno a každá iniciativa se vyjednává dvakrát. Uspořádání stabilizuje zemi (§G+5% stabilita§!), ale dusí volnost vlády jednat (§R-10% zisk politické moci§!), dokud dohoda trvá." # todo: NEW TRANSLATION
 SIA_gfc_headwinds: "Protivítr globální finanční krize" # todo: NEW TRANSLATION
 SIA_gfc_headwinds_desc: "Zhroucení západních úvěrových trhů zpomalilo thajské exportní objednávky a ztížilo financování obchodu. Ceny spotřebního zboží pomalu rostou a objem obchodu klesá. Bouře není vinou Thajska, ekonomika ji však bude dva roky pociťovat." # todo: NEW TRANSLATION
 SIA_coup_risk_modifier: "Tlak rizika převratu" # todo: NEW TRANSLATION
 SIA_coup_risk_modifier_desc: "Zvýšené riziko převratu zatěžuje politickou stabilitu a potlačuje hromadění politické moci. Čím vyšší riziko, tím těžší brzda. Každý bod ukazatele rizika se projevuje ve schopnosti vlády vládnout." # todo: NEW TRANSLATION
 SIA_coup_tier_watchful: "Kasárna bdí" # todo: NEW TRANSLATION
 SIA_coup_tier_watchful_desc: "Generálové jsou prozatím spokojeni. Čtou noviny, počítají rozpočtové položky a mlčí. Žádný postih, ale ukazatel stoupá nebo klesá s každým rozhodnutím vlády.\n\n§YRiziko převratu§!: [?ROOT.SIA_coup_risk|0]/100" # todo: NEW TRANSLATION
 SIA_coup_tier_restless: "Kasárna jsou neklidná" # todo: NEW TRANSLATION
 SIA_coup_tier_restless_desc: "Kousavé úvodníky v tisku vlastněném armádou, vysloužilí důstojníci reptající v talk show, změna vlády, o které vrchní velení nebylo informováno. Nálada v důstojnických jídelnách se zhoršila. Vládnout čistě, nebo si je znovu koupit, než se situace zhorší.\n\n§YRiziko převratu§!: [?ROOT.SIA_coup_risk|0]/100" # todo: NEW TRANSLATION
 SIA_coup_tier_plotting: "Generálové kují pikle" # todo: NEW TRANSLATION
 SIA_coup_tier_plotting_desc: "Neobvyklé přesuny vojsk, večeře, na které premiér nebyl pozván, palác přijímající návštěvníky v uniformách. Každý v Bangkoku dokáže znamení přečíst. Vláda může stále ustoupit od propasti, okno se však zavírá.\n\n§YRiziko převratu§!: [?ROOT.SIA_coup_risk|0]/100" # todo: NEW TRANSLATION
 SIA_coup_tier_tanks: "Tanky se zahřívají" # todo: NEW TRANSLATION
 SIA_coup_tier_tanks_desc: "Kolony jsou natankované a scénář vysílání napsaný. Vrchnímu velení chybí jediná provokace, aby vyrazilo na Úřad vlády. Snižte riziko převratu pod 70, a to rychle, jinak mise §RUklidnit vrchní velení§! vyprší a tanky vyjedou.\n\n§YRiziko převratu§!: [?ROOT.SIA_coup_risk|0]/100" # todo: NEW TRANSLATION
 SIA_rice_pledge: "Program garantovaných cen rýže" # todo: NEW TRANSLATION
 SIA_rice_pledge_desc: "Vláda zaručuje zemědělcům nadtržní ceny za sklizeň rýže a drží strategické zásoby. Venkovské příjmy rostou a spolu s nimi i rozpočtová expozice vůči světovým cenám komodit." # todo: NEW TRANSLATION
 SIA_red_shirts_mobilized_idea: "Červené košile na pochodu" # todo: NEW TRANSLATION
 SIA_red_shirts_mobilized_idea_desc: "Venkovská síť je mobilizována a v ulicích. Masové demonstrace v Udon Thani, Khon Kaen a na předměstích Bangkoku burcují základnu a přesvědčují palác i vrchní velení, že zvolená vláda ztratila kontrolu. Každý pochod přibližuje zúčtování s armádou." # todo: NEW TRANSLATION
 SIA_kings_moral_authority_2: "Nová vláda" # todo: NEW TRANSLATION
 SIA_kings_moral_authority_2_desc: "Desátá vláda si upevnila autoritu, ta je však jiná. Viditelnější, komerčnější a kontroverznější než autorita předchůdce. Morální váha šedesáti let na jednom trůně se nepřenese jedinou korunovací." # todo: NEW TRANSLATION
 SIA_kra_mobilization: "Národní mobilizace pro Kra kanál" # todo: NEW TRANSLATION
 SIA_kra_mobilization_desc: "Každý jeřáb, bagr a ženijní prapor, který může Království shromáždit, je nasazen do koridoru Kra. Spotřebitelské ceny rostou, politický kapitál se vyčerpává a podpora vlády se pod tíhou ohýbá, rychlost výstavby je však mimořádná. Tento názor zmizí po dokončení kanálu." # todo: NEW TRANSLATION
 SIA_kra_canal: "Kra kanál" # todo: NEW TRANSLATION
 SIA_kra_canal_desc: "Kanál spojující Thajský záliv s Andamanským mořem činí z Thajska hrdlo druhé nejvytíženější námořní trasy světa. Mýtné proudí do státní pokladny, námořnictva zdvořile čekají na tranzitní práva a na názor Bangkoku se nyní vyplatí ptát v každém asijském hlavním městě." # todo: NEW TRANSLATION
 SIA_kra_debt_trap: "Dluh Pásu a stezky" # todo: NEW TRANSLATION
 SIA_kra_debt_trap_desc: "Kanál se začal stavět levně, protože jej zaplatil Peking. Splátkový kalendář je veden v jüanech, zástavou je samotná vodní cesta a každý rozpočtový převis závazek prohlubuje. Spotřebitelské ceny pomalu rostou a politický kapitál uniká, zatímco půjčka v pozadí narůstá." # todo: NEW TRANSLATION
 SIA_kra_debt_serviced: "Dluh restrukturalizován" # todo: NEW TRANSLATION
 SIA_kra_debt_serviced_desc: "Půjčka byla znovu vyjednána za tvrdých, ale přežitelných podmínek. Krize je za námi, kanál je thajský a vláda získala určitou důvěryhodnost tím, že se Pekingu postavila u vyjednávacího stolu, nikoli v zadní místnosti." # todo: NEW TRANSLATION
 SIA_kra_default_pariah: "Státní nesplácení" # todo: NEW TRANSLATION
 SIA_kra_default_pariah_desc: "Thajsko odstoupilo od půjčky v rámci Pásu a stezky. Kanál je jeho, ale mezinárodní úvěrové trhy si pamatují, obchodní partneři se zajišťují a cena kapitálu je pro zemi, která ukázala ochotu odmítnout dluh, když si to politika žádá, vysoká." # todo: NEW TRANSLATION
 SIA_kra_lease_concession: "Pekingská provozní koncese" # todo: NEW TRANSLATION
 SIA_kra_lease_concession_desc: "Za účelem vyrovnání dluhu byla čínskému státnímu podniku přiznána dlouhodobá provozní koncese na část kanálu. Království stále vztyčuje vlajku u zdymadel, část každého mýtného však nyní odplouvá do Pekingu a svět si všiml, kdo koncesi skutečně drží." # todo: NEW TRANSLATION
 SIA_kra_capital_flight: "Útěk kapitálu" # todo: NEW TRANSLATION
 SIA_kra_capital_flight_desc: "Nesplácení vyděsilo trhy. Zahraniční kapitál míří k východům, baht je pod tlakem a centrální banka pálí rezervy, aby zpomalila krvácení. Šok je silný, ale dočasný; důvěra se vrátí, až se prach usadí." # todo: NEW TRANSLATION
 SIA_kra_delay: "Zpoždění výstavby" # todo: NEW TRANSLATION
 SIA_kra_delay_desc: "Vláda místo nalití dalších peněz do etapy, která překročila rozpočet, přijala pomalejší harmonogram. Rychlost výstavby utrpí a obraz vlády je poškozen, státní pokladna však unikne nejhoršímu." # todo: NEW TRANSLATION
 SIA_kra_canal_sovereign: "Svrchovaný kanál" # todo: NEW TRANSLATION
 SIA_kra_canal_sovereign_desc: "Kanál vybudovaný bez zahraničního věřitele a zahraniční doložky je thajský až po poslední patník. Příplatek za absolutní svrchovanost přináší hlubší námořně-průmyslovou základnu, silnější režim mýtného a národní prestiž, které se žádná koncese nemůže vyrovnat." # todo: NEW TRANSLATION
 SIA_kra_fortress: "Kanál-pevnost" # todo: NEW TRANSLATION
 SIA_kra_fortress_desc: "Pobřežní baterie, opevněné bunkry a stálá námořní posádka činí z Kra vodní cestu, kterou může Královské thajské námořnictvo držet silou. Flotila si zostřuje schopnosti při střežení hrdla, militarizovaný průjezd však Bangkok stojí část dobré vůle lodních společností." # todo: NEW TRANSLATION
 SIA_kra_neutral_transit: "Režim neutrálního tranzitu" # todo: NEW TRANSLATION
 SIA_kra_neutral_transit_desc: "Kra je otevřen všem vlajkám za rovných podmínek, zaručen smlouvou a důvěryhodný pro každou námořní mocnost. Provoz a dobrá vůle proudí společně. Mýtné je vysoké, názor obchodních národů se zlepšuje a kanál se stává globálním statkem namísto národní zbraně." # todo: NEW TRANSLATION
 SIA_red_revival: "Přízraky CPT" # todo: NEW TRANSLATION
 SIA_red_revival_desc: "Kádry Komunistické strany Thajska, přeživší bojů ze 70. let, jejich děti i studenti vystoupili z okraje společnosti. Strana má politickou energii, teorii dějin a chuť po moci. Má také nepřátele a její přítomnost v celonárodní debatě stojí zemi několik procentních bodů stability za každý měsíc, kdy odmítá pracovat v rámci stávajícího systému." # todo: NEW TRANSLATION
 SIA_general_strike_idea: "Generální stávka (probíhá)" # todo: NEW TRANSLATION
 SIA_general_strike_idea_desc: "Země je záměrně ochromována. Přístavy, železnice, školy a nemocnice fungují s minimálními stavy. Stabilita klesá o jedno procento každý týden trvání stávky. Zvyšte její dynamiku na 100 prostřednictvím rozhodnutí Generální stávky a vláda kapituluje. Pokud uplyne 180 dní dříve, převezme moc armáda.\n\n§RDynamika stávky§!: [?ROOT.SIA_strike_momentum|0]/100" # todo: NEW TRANSLATION
 SIA_western_sanctions: "Západní hospodářské sankce" # todo: NEW TRANSLATION
 SIA_western_sanctions_desc: "Spojené státy a jejich spojenci uvalili na Thajsko po změně vlády sankční balíček. Investice zamrzly, obchodní financování se obtížně zajišťuje a několik dvoustranných dohod bylo pozastaveno. Cena je skutečná, stejně jako politický prospěch z jasného vnějšího nepřítele." # todo: NEW TRANSLATION
 SIA_asean_pariah: "Vyvrhel regionu" # todo: NEW TRANSLATION
 SIA_asean_pariah_desc: "Snaha Thajska podrobit si sousedy z něj učinila vyvrhele v celé jihovýchodní Asii i mimo ni. Partneři v ASEAN vyloučili Bangkok z regionálního obchodu, zahraniční kapitál uprchl před agresorem a cena každé cihly a barelu nyní odráží království ve válce s regionem, kterému kdysi vedlo. Izolace má cenu a thajská ekonomika ji platí." # todo: NEW TRANSLATION
 SIA_peoples_siam: "Blok lidové solidarity" # todo: NEW TRANSLATION
 SIA_peoples_siam_desc: "Thajsko se ukotvilo v regionálním uskupení s Laosem a Vietnamem. Rámec vzájemného uznání poskytuje diplomatické krytí, snižuje izolaci a zemi, která právě znárodnila hlavní průmyslová odvětví, zajišťuje obchodní vztahy udržující regály zásobené. Vojenská spolupráce napříč blokem je základem skutečně nezávislé obranné pozice." # todo: NEW TRANSLATION
 SIA_green_rush: "Zelená horečka" # todo: NEW TRANSLATION
 SIA_green_rush_desc: "Dekriminalizace konopí otevřela nový trh se zemědělskou komoditou. Zemědělci z Isánu diverzifikují, vývozci bylinných produktů se registrují rychleji, než je licenční úřad dokáže zpracovat, a část bangkockého pohostinství se tiše přeorientovala. Kritici tomu říkají sociální experiment. Příjmy státní pokladny tomu říkají výnos." # todo: NEW TRANSLATION
 SIA_war_plan_brm: "Válečný plán Barma" # todo: NEW TRANSLATION
 SIA_war_plan_brm_desc: "Thajští operační plánovači podrobně propracovali tažení podél Salwin. Infiltrační koridory, logistické uzly, šanští nepravidelní bojovníci jako násobitel síly. Plán je aktuální, základna pro přesun připravena a důstojnický sbor zná terén." # todo: NEW TRANSLATION
 SIA_war_plan_lao: "Válečný plán Laos" # todo: NEW TRANSLATION
 SIA_war_plan_lao_desc: "Přechody přes Mekong, horské průsmyky a zranitelnost Vientianu vůči úderu ze směru Nong Khai. Plán tažení existuje v každém operačním pořadači 3. armádního velitelství. Pohraniční infrastruktura byla tiše modernizována na podporu rychlého postupu." # todo: NEW TRANSLATION
 SIA_war_plan_cbd: "Válečný plán Kambodža" # todo: NEW TRANSLATION
 SIA_war_plan_cbd_desc: "Koridor Preah Vihear, sráz Dangrek a rovinaté přístupy k Siem Reapu. Thajští plánovači vytyčili operační hranice a třikrát procvičili logistiku. Předsunutá základna je připravena." # todo: NEW TRANSLATION
 SIA_war_plan_may: "Válečný plán Malajsie" # todo: NEW TRANSLATION
 SIA_war_plan_may_desc: "Hranice z roku 1909 je plánovacím omezením, nikoli přírodním faktem. Podrobné rozkazy pro tažení směrem k Narathiwatu a koridoru Kelantan existují v červeném pořadači označeném PŘÍSNĚ TAJNÉ. Investice do infrastruktury hlubokého jihu slouží zároveň jako shromaždiště." # todo: NEW TRANSLATION
 SIA_protector_of_the_realm: "Ochránce říše" # todo: NEW TRANSLATION
 SIA_protector_of_the_realm_desc: "Thajské ozbrojené síly nyní zajišťují okupaci znovuzískané hranice a udržují pořádek na šanském, laoském, khmerském a malajském území získaném v pantaijských válkách, zatímco civilní správa dohání situaci. Únava z války mizí s upevněným vítězstvím a hrdost na znovusjednocenou říši stabilizuje domácí frontu." # todo: NEW TRANSLATION
 SIA_comprehensive_security_idea: "Komplexní bezpečnost" # todo: NEW TRANSLATION
 SIA_comprehensive_security_idea_desc: "Integrovaný rámec národní bezpečnosti omezuje duplicity mezi vnitřními, obrannými a zpravodajskými agenturami. Režijní náklady na spotřebu klesají se zlepšením koordinace. Směřování k jakémukoli vnějšímu patronovi je měřitelně obtížnější." # todo: NEW TRANSLATION
 SIA_cambodia_partnership: "Partnerství s Kambodžou" # todo: NEW TRANSLATION
 SIA_cambodia_partnership_desc: "Strukturované dvoustranné vztahy s Phnompenhem zahrnují usnadnění obchodu, společné rozvojové zóny a diplomatickou dohodu, která staví Thajsko do role preferovaného hospodářského partnera Kambodže. Vliv proudí oběma směry, obchodní příjmy však jedním." # todo: NEW TRANSLATION
 SIA_fuel_reserves: "Strategické zásoby paliva" # todo: NEW TRANSLATION
 SIA_fuel_reserves_desc: "Tři měsíce celostátní spotřeby paliva držené ve strategických rezervách v rozptýlených nádržích ve všech pěti regionech. Zásoby vyrovnávají cenové špičky, poskytují krizovou rezervu a signalizují partnerům, že thajská vojenská logistika není rukojmím jediné zásobovací trasy." # todo: NEW TRANSLATION
 SIA_medical_tourism_boom: "Rozmach zdravotní turistiky" # todo: NEW TRANSLATION
 SIA_medical_tourism_boom_desc: "Zpráva se rozšířila. Bangkocké soukromé nemocnice jsou plně obsazené zahraničními pacienty a rekonvalescenti zůstávají jako turisté. Příjmy a počty příjezdů měsíc za měsícem rostou, zatímco oddělení se přetěžují a místní déle čekají na lůžko." # todo: NEW TRANSLATION
 SIA_aec_tailwind: "Vítr v zádech integrace ASEAN" # todo: NEW TRANSLATION
 SIA_aec_tailwind_desc: "Snaha o usnadnění obchodu se vyplácí napříč regionem. Menší tření na hranicích, hlubší dodavatelské řetězce a thajské továrny získávající regionální kontrakty. Růst tažený exportem se po léta násobí, i když přizpůsobení doma stlačuje kapacitu výroby spotřebního zboží." # todo: NEW TRANSLATION
 SIA_arms_export_orders: "Kniha objednávek obranného exportu" # todo: NEW TRANSLATION
 SIA_arms_export_orders_desc: "Kniha objednávek je plná. MRAPy, munice, povalující se drony a licenčně vyráběné systémy míří podle průběžného harmonogramu ke kupcům v ASEAN. Zbrojní linky pracují na plnou kapacitu a postavení Thajska jako preferovaného dodavatele regionu se upevňuje za cenu diplomatického tření, které vyzbrojování sousedství vždy přináší." # todo: NEW TRANSLATION
 SIA_royal_development_lands: "Královské rozvojové pozemky" # todo: NEW TRANSLATION
 SIA_royal_development_lands_desc: "Projekty podporované korunou otevřely novou půdu pro pěstování a těžbu a stabilizovaly provincie, kterých se dotkly. Venkov je klidnější a základna zdrojů širší, ačkoli samotné práce během svého trvání odčerpávají národní produkci." # todo: NEW TRANSLATION
 SIA_eec_construction_boom: "Stavební rozmach EHK" # todo: NEW TRANSLATION
 SIA_eec_construction_boom_desc: "Východní hospodářský koridor je živým staveništěm, jeřáby se tyčí nad přístavy, železniční lože jsou připravena a rostou obrysy továren. Výstavba postupuje rychleji a produkce roste, rozmach však po dobu trvání váže kapacitu spotřebního zboží." # todo: NEW TRANSLATION
 SIA_asean_chair_spotlight: "Pozornost předsednictví ASEAN" # todo: NEW TRANSLATION
 SIA_asean_chair_spotlight_desc: "Bangkok drží předsednické kladívko i pozornost kamer. Předsednictví přináší snadnou dobrou vůli a levnější diplomatické vystupování v rámci sdružení, dokud světla reflektorů svítí." # todo: NEW TRANSLATION
 SIA_purge_disruption: "Narušení protikorupční čistkou" # todo: NEW TRANSLATION
 SIA_purge_disruption_desc: "Zátah proti korupci zmrazil nákupy a znervóznil patronátní sítě. Smluvní procesy se zastavily a politická mašinérie se durdí. To je cena čistšího systému placená předem." # todo: NEW TRANSLATION
 SIA_army_wage_inflation: "Nafouknuté platy důstojníků" # todo: NEW TRANSLATION
 SIA_army_wage_inflation_desc: "Úsluhy umlčely mosazné nárameníky, cena však spočívala v nafouknuté výplatnici. Důstojnické platy, příplatky a fiktivní zařazení byly napříč hodnostmi navýšeny a účet za armádu zůstane vysoký, dokud nebude rozpočet znovu zkrocen." # todo: NEW TRANSLATION
 SIA_chuan_leekpai_desc: "Veterán Demokratické strany a státník, který působil jako premiér v letech 1992–1995 a 1997–2001. Jeho druhé období provedlo Thajsko asijskou finanční krizí v rámci programu MMF. Známý svou neochvějnou osobní integritou v systému prolezlém korupcí." # todo: NEW TRANSLATION
 SIA_thaksin_shinawatra_desc: "Miliardářský telekomunikační magnát, který založil Thai Rak Thai a v roce 2001 drtivě zvítězil. Jeho populistické programy, třicetibahtový zdravotní program a fondy rozvoje vesnic proměnily venkovskou politiku. Po svržení vojenským převratem v roce 2006 řídil Thajsko z exilu prostřednictvím několika spřízněných stran." # todo: NEW TRANSLATION
 SIA_bhumibol_adulyadej_desc: "Ráma IX., devátý panovník dynastie Chakri a nejdéle vládnoucí hlava státu na světě. Jeho morální autorita jako sjednocujícího symbolu byla využívána v každé politické krizi. Jeho úmrtí v říjnu 2016 ukončilo sedmdesátiletou vládu a zahájilo období hlubokého národního smutku." # todo: NEW TRANSLATION
 SIA_vajiralongkorn_desc: "Ráma X., Mahá Vajiralongkorn, který nastoupil na trůn po smrti svého otce v roce 2016. Uplatnil přímou kontrolu nad majetkem koruny a Královskou gardou a zasáhl do politických záležitostí příměji než jeho předchůdci. Jeho vláda se kryje s nejbouřlivějším obdobím thajských ústavních dějin." # todo: NEW TRANSLATION
 SIA_abhisit_vejjajiva_desc: "Vůdce Demokratické strany vzdělaný v Oxfordu, který se stal premiérem parlamentním hlasováním v roce 2008 po rozpuštění Strany lidové moci Ústavním soudem. Jeho vláda dohlížela na zásah proti demonstrantům v červených košilích v Bangkoku od dubna do května 2010." # todo: NEW TRANSLATION
 SIA_yingluck_shinawatra_desc: "Vůdkyně Pheu Thai a mladší sestra Thaksina Shinawatry, která zvítězila ve volbách v červenci 2011 největší většinou od roku 2001. Její vláda zahájila program garantovaných cen rýže, jenž se později stal rozsáhlým korupčním skandálem. Ústavní soud ji v roce 2014 odvolal a před trestním rozsudkem uprchla ze země." # todo: NEW TRANSLATION
 SIA_prayut_chanocha_desc: "Velitel Královské thajské armády, který vedl převrat v květnu 2014, dvanáctý thajský převrat, a devět let působil jako premiér pod juntou NCPO a stranou Palang Pracharath. Architekt ústavy z roku 2017 a jejího poměrného systému se smíšenými členy, navrženého k rozštěpení opozičních stran." # todo: NEW TRANSLATION
 SIA_sonthi_boonyaratglin_desc: "Velitel armády, který vedl převrat v září 2006, jenž svrhl Thaksina Shinawatru v době, kdy byl premiér v zahraničí. Předsedal juntě Radě národní bezpečnosti, dokud nebyla ustavena prozatímní civilní vláda. Později vstoupil do volební politiky jako vůdce menší strany." # todo: NEW TRANSLATION
 SIA_anutin_charnvirakul_desc: "Vůdce strany Bhumjaithai a potomek rodiny ze stavebnictví, který se proslavil jako místopředseda vlády. Strategické postavení jeho strany mezi vojenskými a civilními bloky z něj učinilo jazýček na vahách ve třech po sobě jdoucích koaličních vládách. Na konci roku 2025 se stal úřadujícím premiérem po odvolání Paetongtarn Ústavním soudem." # todo: NEW TRANSLATION
 SIA_pita_limjaroenrat_desc: "Vůdce strany Move Forward, která zvítězila ve volbách v květnu 2023 s největším podílem hlasů, ale armádou jmenovaný senát jí zabránil sestavit vládu. Ústavní soud stranu následně rozpustil a zakázal mu na pět let politickou činnost." # todo: NEW TRANSLATION
 SIA_natthaphong_ruengpanyawut_desc: "Nástupce Pity Limjaroenrata v čele rekonstituované Strany lidu a nejmladší zvolený guvernér Bangkoku. Představuje generační posun v thajské progresivní politice směrem k místní správě a klimatické politice spolu s ústavní reformou." # todo: NEW TRANSLATION
 SIA_songkhram_phaendin_desc: "Maršál pantaijské školy, jehož jméno znamená „válka země“. Prošel důstojnickým sborem a kázal, že ústupky z let 1893 a 1909 jsou stále otevřenými ranami a že je dokáže uzavřít pouze vláda vojáka." # todo: NEW TRANSLATION
 SIA_somchai_ratchaphruek_desc: "Veterán z džunglových let Komunistické strany, pojmenovaný po zlatém dešťovém stromu. Přežil amnestie, které vyprázdnily tábory, a vrátil se k organizování na severovýchodě s přesvědčením, že revoluce selhala načasováním, nikoli svými cíli." # todo: NEW TRANSLATION
 SIA_banharn_silpaarcha_desc: "Vůdce strany Chart Thai a stavební patron ze Suphanburi, který byl premiérem v letech 1995–1996. Jeho vláda nalévala provinční infrastrukturu do jeho domovského kraje tak mohutně, že mu tisk přezdíval chodící bankomat. Koalice se během roku rozpadla amid korupčních obvinění a ekonomických varovných signálů předcházejících krachu v roce 1997." # todo: NEW TRANSLATION
 SIA_chavalit_yongchaiyudh_desc: "Zakladatel a vůdce Strany nové aspirace a bývalý vrchní velitel Královské thajské armády, který se v listopadu 1996 stal premiérem. Jeho vláda byla u moci, když v polovině roku 1997 vypukla krize bahtu, a téhož listopadu pod tlakem měnového kolapsu, který nedokázala zvládnout, odstoupil." # todo: NEW TRANSLATION
 SIA_thanathorn_juangroongruangkit_desc: "Magnát v automobilových součástkách, který v roce 2018 spoluzaložil stranu Future Forward a stal se tváří její reformní politiky vedené mladými. Jeho rychlý vzestup znepokojil establishment. Ústavní soud stranu v únoru 2020 rozpustil a zakázal mu na deset let výkon funkce kvůli půjčce, kterou jí osobně poskytl." # todo: NEW TRANSLATION
 SIA_virot_paoin_desc: "Policejní generálporučík, který převzal vedení Pheu Thai poté, co Thaksinova linie ustoupila, a pokračoval v populistické koalici strany spíše zpoza uniformy než z tribuny. Jeho styl vlády se opírá o institucionální loajalitu v policii a státní službě namísto masové venkovské mobilizace, na níž jeho předchůdce stranu vybudoval." # todo: NEW TRANSLATION
 SIA_srettha_thavisin_desc: "Manažer developerské společnosti a kandidát Pheu Thai na premiéra v roce 2023, který se v srpnu téhož roku stal premiérem v koalici při návratu strany k moci s bývalými rivaly. Ústavní soud jej v srpnu 2024 odvolal kvůli etickému pochybení spojenému se jmenováním člena vlády; šlo o jedno z nejkratších funkčních období zvoleného thajského premiéra za poslední desetiletí." # todo: NEW TRANSLATION
 SIA_paetongtarn_shinawatra_desc: "Nejmladší dcera Thaksina Shinawatry a třetí premiérka Pheu Thai z rodiny Shinawatrových, která nastoupila do úřadu v srpnu 2024 jako odpověď strany na odvolání svého předchůdce soudem. Únik telefonního hovoru s kambodžským Hun Senem kvůli pohraničnímu sporu ji během roku stál premiérské křeslo a znovu vyvolal otázky, nakolik směřování vlády stále určoval její otec." # todo: NEW TRANSLATION
 SIA_greater_thailand_consolidated: "Velké Thajsko upevněno" # todo: NEW TRANSLATION
 SIA_greater_thailand_consolidated_desc: "Iredentistická tažení skončila. Království je větší a silnější než dříve, jeho zásoby pracovních sil hlubší, průmysl sebevědomější a lid sjednocený společnou obětí i vítězstvím. Státní aparát, který vedl válku, nyní pohání výstavbu." # todo: NEW TRANSLATION
 SIA_pax_aseana_idea: "Pax Aseana" # todo: NEW TRANSLATION
 SIA_pax_aseana_idea_desc: "Thajsko vede stabilní, soudržný a soběstačný bezpečnostní blok. Z hlavních měst spojenců proudí politický kapitál a stabilitu posiluje vědomí, že Bangkok nezůstane sám — stejně jako žádný spojenec. Mír v regionu zajišťuje thajská moc." # todo: NEW TRANSLATION
 SIA_asean_defense_member: "Člen SEATO" # todo: NEW TRANSLATION
 SIA_asean_defense_member_desc: "Tento národ se z vlastní vůle rozhodl vstoupit do thajského regionálního obranného paktu. Společné velení a jednotný účel stabilizují domácí frontu a posilují obranu. Jeho závazek spočívá na souhlasu, nikoli nátlaku, a proto přetrvá tam, kde by vynucené spojenectví ztroskotalo." # todo: NEW TRANSLATION
 SIA_rally_round_flag: "Semknutí kolem vlajky" # todo: NEW TRANSLATION
 SIA_rally_round_flag_desc: "Pohraniční incident sjednotil thajskou veřejnost za ozbrojenými silami. Nacionalistické nálady zesílily a fronty branců jsou dlouhé, nálada je však nestálá a líbánky nebudou trvat věčně." # todo: NEW TRANSLATION
 SIA_anti_graft_idea: "Prosazování boje proti korupci" # todo: NEW TRANSLATION
 SIA_anti_graft_idea_desc: "Posílená Národní protikorupční komise začala rozebírat nákupní a celní sítě, které odčerpávají příjmy thajského státu. Dodavatelé soutěží podle zásluh a cla proudí do státní pokladny namísto k prostředníkům. Po dobu šesti měsíců samotná kampaň zatěžuje politickou moc — to je cena za rozbití zakořeněných zájmů." # todo: NEW TRANSLATION
 SIA_strait_patrol_posture: "Režim hlídkování v průlivu" # todo: NEW TRANSLATION
 SIA_strait_patrol_posture_desc: "Královské thajské námořnictvo udržuje posílený cyklus hlídek v průlivu. Doprovody sledují námořní trasy, hlídkové linie střeží přístupy a flotila se po dobu trvání režimu vzdaluje od přístavů více než dříve." # todo: NEW TRANSLATION
 SIA_asean_security_pledge: "Bezpečnostní závazek ASEAN" # todo: NEW TRANSLATION
 SIA_asean_security_pledge_desc: "Thajsko se zavázalo být štítem jihovýchodní Asie, nikoli jejím dobyvatelem. První záruky míří k sousedům, kteří přijmou ochranu Bangkoku, a diplomatický sbor se věnuje trpělivé práci na ujišťování. Záruky jsou levnější, vztahy se udržují s menšími náklady a síly Království se zakopávají, aby byl slib věrohodný." # todo: NEW TRANSLATION
 SIA_protector_of_asean: "Ochránce ASEAN" # todo: NEW TRANSLATION
 SIA_protector_of_asean_desc: "Thajsko si zvolilo roli garanta místo dobyvatele. Rozšířením svého bezpečnostního deštníku nad jihovýchodní Asií získává Království důvěru sousedů a postavení regionální velmoci. Stálý diplomatický sbor nyní promítá thajský vliv do několika hlavních měst ASEAN současně, financován stabilním politickým kapitálem, který tato role přináší. Diplomacie je levnější, obrana pevnější a dobrá vůle ASEAN proudí k Bangkoku." # todo: NEW TRANSLATION
 SIA_frontier_buffer_idea: "Nárazníkové státy na hranici" # todo: NEW TRANSLATION
 SIA_frontier_buffer_idea_desc: "Šanové a Karenové jsou udržováni ozbrojení a přátelští jako živý štít podél barmské hranice. Levnější záruky, stabilnější hranice a obranná výhoda proti jakémukoli postupu z Naypyidawu." # todo: NEW TRANSLATION
 SIA_shan_campaign: "Šanské tažení" # todo: NEW TRANSLATION
 SIA_shan_campaign_desc: "Armáda je mobilizována a připravena k operacím v jižním Šanském státě, s bojovými bonusy proti šanským silám po dobu tažení." # todo: NEW TRANSLATION
 SIA_karen_campaign: "Karenské tažení" # todo: NEW TRANSLATION
 SIA_karen_campaign_desc: "Thajské síly postupují do karenských kopců, s bojovými bonusy proti karenským silám po dobu tažení." # todo: NEW TRANSLATION
 SIA_wa_campaign: "Tažení proti Wa" # todo: NEW TRANSLATION
 SIA_wa_campaign_desc: "Thajské síly postupují do kopců Wa proti UWSA, s bojovými bonusy proti silám Wa po dobu tažení." # todo: NEW TRANSLATION
 SIA_us_mech_standard: "Mechanizace podle standardů NATO" # todo: NEW TRANSLATION
 SIA_us_mech_standard_desc: "Americká doktrína a západní vozidla přinášejí lepší organizaci, průzkum a spolehlivost v poli, za cenu započtenou do obranného rozpočtu." # todo: NEW TRANSLATION
 SIA_reliability_woes: "Potíže se spolehlivostí" # todo: NEW TRANSLATION
 SIA_reliability_woes_desc: "Levná masová výroba přišla s levnou podporou. Poruchy převodovek a nedostatek náhradních dílů podkopávají morálku a spolehlivost techniky, dokud nebude flotila opravena." # todo: NEW TRANSLATION
 SIA_chd620_teething: "Počáteční potíže motoru" # todo: NEW TRANSLATION
 SIA_chd620_teething_desc: "Náhradní čínská pohonná jednotka se přehřívá a dosud nebyla ověřena. Dokud se neodstraní její chyby, jsou lodě pomalejší a jejich posádky méně sebejisté." # todo: NEW TRANSLATION
 SIA_bamboo_doctrine: "Bambusová doktrína" # todo: NEW TRANSLATION
 SIA_bamboo_doctrine_desc: "Přátelští ke všem a zavázaní nikomu. Diplomatická pružnost, široká dobrá vůle a domácí stabilita národa, který odmítá volit stranu." # todo: NEW TRANSLATION
 SIA_loyal_opposition: "Loajální opozice" # todo: NEW TRANSLATION
 SIA_loyal_opposition_desc: "Ať vyhraje, nebo prohraje, strana přetrvá. Sto let stará organizace s kořeny v každé provincii a pevnou základnou voličů, kteří se nemění s politickým počasím. Jde o nejstálejší voličskou základnu v thajské politice a tu nejhůře odtrhnutelnou od jakéhokoli soupeřícího hnutí, populistického či palácového." # todo: NEW TRANSLATION
 SIA_democratic_institutionalism: "Demokratický institucionalismus" # todo: NEW TRANSLATION
 SIA_democratic_institutionalism_desc: "Pravidla nyní přežívají vládce. Nezávislé soudy, fungující parlament, profesionální ministerstva a veřejnost očekávající předávání moci u volebních uren. Thajská demokracie se stala systémem místo sezóny a odolává ovládnutí z ulic, paláce i kasáren." # todo: NEW TRANSLATION
 SIA_pt_tier_dormant: "Sledování populistického přílivu" # todo: NEW TRANSLATION
 SIA_pt_tier_dormant_desc: "Venkovské hlasy prozatím drží a Demokraté vládnou v klidu. Thaksinova mašinérie však nikdy skutečně nespí. Na severu a severovýchodě čekají staré loajality připravené shromáždit se, jakmile bude vládnoucí strana působit samolibě. Udržujte si náskok pomocí voličské mašinérie a příliv zůstane takto klidný.\n\n§YPopulistický příliv§!: [?ROOT.SIA_pheu_thai_pressure|0]/100" # todo: NEW TRANSLATION
 SIA_pt_tier_rising: "Populistický příliv stoupá" # todo: NEW TRANSLATION
 SIA_pt_tier_rising_desc: "Na severovýchodě jsou znovu vyvěšeny rudé prapory. Thaksinova mašinérie sílí a vláda, která jí nedokáže odpovědět, začíná vypadat jako úřednická vláda čekající na odvolání voliči.\n\n§YPopulistický příliv§!: [?ROOT.SIA_pheu_thai_pressure|0]/100" # todo: NEW TRANSLATION
 SIA_red_shirt_encampment: "Tábor Ratchaprasong" # todo: NEW TRANSLATION
 SIA_red_shirt_crackdown: "Zásah v Ratchaprasongu" # todo: NEW TRANSLATION
 SIA_red_shirt_encampment_desc: "Desítky tisíc červených košil drží centrální nákupní čtvrť Bangkoku za barikádami z bambusu a pneumatik. Obchodní centra jsou zavřená, kanceláře prázdné a obchodní čtvrť přestala fungovat. Vláda se rozhodla vyčkat, až protestující odejdou." # todo: NEW TRANSLATION
 SIA_red_shirt_crackdown_desc: "Armáda vyčistila křižovatku ostrou municí. Barikády i okupace zmizely, budovy jsou však vypálené, policie stojí více než dříve a země sledovala v televizi vojáky střílející na civilisty." # todo: NEW TRANSLATION
 SIA_pt_tier_surge: "Rýsuje se populistické drtivé vítězství" # todo: NEW TRANSLATION
 SIA_pt_tier_surge_desc: "Průzkumy vypadají jako očekávaná porážka. Červené košile mluví o příchodu do Bangkoku a vláda, která nechá příliv dosáhnout 100, zjistí, zda to myslely vážně.\n\n§YPopulistický příliv§!: [?ROOT.SIA_pheu_thai_pressure|0]/100" # todo: NEW TRANSLATION
 SIA_thaksin_ascendant: "Thai Rak Thai na vzestupu" # todo: NEW TRANSLATION
 SIA_thaksin_ascendant_desc: "Krach v roce 1997 zlomil staré strany a do vzniklého vakua vstupuje Thaksin Shinawatra s telekomunikačním jměním, disciplinovanou mašinérií a slibem, který vesnice severu a severovýchodu čekaly celou generaci. Levná zdravotní péče, oddlužení a rozvojový fond pro každou vesnici. Měsíc za měsícem se venkovské hlasy shromažďují za jeho Thai Rak Thai a Chuanovi Demokraté vládnou na vypůjčený čas.\n\nKaždý měsíc získávají Thai Rak Thai a širší nezařazený blok přibližně 2% podporu odebranou establishmentu, dokud přeskupení v roce 2001 otázku nerozhodne.\n\n§YMěsíce do zúčtování§!: [?ROOT.SIA_thaksin_rise_months|0]/12" # todo: NEW TRANSLATION
 SIA_broad_coalition_idea: "Široká koalice" # todo: NEW TRANSLATION
 SIA_broad_coalition_idea_desc: "Ministerstva jsou předána malým stranám a provinčním bossům výměnou za parlamentní ochrannou zeď. Koalice je široká a stabilní, každé rozhodnutí je však vyjednáváním a vláda se pohybuje tempem nejváhavějšího partnera. Dohoda platí rok." # todo: NEW TRANSLATION
 SIA_mekong_soft_power_idea: "Měkká síla Mekongu" # todo: NEW TRANSLATION
 SIA_mekong_soft_power_idea_desc: "Thajské banky, dodavatelé a vysílatelé nesou vliv Bangkoku proti proudu Mekongu. Hlasitější slovo v sousedství a diplomatická kapacita dvořit se současně ještě jednomu národu." # todo: NEW TRANSLATION
 SIA_occupation_administration: "Okupační správa" # todo: NEW TRANSLATION
 SIA_occupation_administration_desc: "Vojenské guvernérství, přesídlovací rady a rekonstrukční úřady nyní řídí dobyté provincie. Poslušnost roste rychleji, ozbrojený odpor je drcen a silnice i železnice integrace vznikají rychleji. Aparát pro udržení toho, co armáda získala." # todo: NEW TRANSLATION
 SIA_deep_south_category: "Hluboký jih" # todo: NEW TRANSLATION
 SIA_deep_south_category_desc: "Malajsko-muslimské provincie Yala, Pattani a Narathiwat jsou v povstání. Potlačení, rozvoj i dialog mají své zastánce a své náklady.\n§YIntenzita povstání§! (0–100) označuje sílu povstání na jihu. Vyšší úroveň znamená smrtelnější týdenní incidenty a větší zátěž pro jih. Síla, rozvoj a dialog ji snižují. Zvěrstva a zanedbávání ji zvyšují. Taktika železné pěsti zanechává trvalé §Yminimum křivdy§!, pod které intenzita nikdy neklesne.\n\n§YIntenzita povstání§!: [?ROOT.SIA_insurgency_intensity|0]%\n§YMinimum křivdy§!: [?ROOT.SIA_ds_intensity_floor|0]%" # todo: NEW TRANSLATION
 SIA_greater_thailand_category: "Velké Thajsko" # todo: NEW TRANSLATION
 SIA_greater_thailand_category_desc: "Program ztracených území. Milice, nároky a integrace znovuzískaných zemí." # todo: NEW TRANSLATION
 SIA_ds_security_operations: "Bezpečnostní razie" # todo: NEW TRANSLATION
 SIA_ds_security_operations_desc: "Operace obklíčení a prohlídek napříč jižními provinciemi. Pořádek se během operací zlepšuje. Zda povstání ukončí, nebo přiživí, se probírá v každé zprávě po akci." # todo: NEW TRANSLATION
 SIA_ds_development_fund: "Fond rozvoje jihu" # todo: NEW TRANSLATION
 SIA_ds_development_fund_desc: "Silnice, školy a pracovní místa pro nejchudší provincie země. Pomalejší než vojáci, levnější než válka." # todo: NEW TRANSLATION
 SIA_ds_emergency_decree: "Mimořádný dekret" # todo: NEW TRANSLATION
 SIA_ds_emergency_decree_desc: "Zvláštní pravomoci pro bezpečnostní síly v jižních provinciích. Zadržení bez obvinění, ustanovení o imunitě, zákaz vycházení. Účinné a rozkladné." # todo: NEW TRANSLATION
 SIA_ds_peace_dialogue: "Otevřený mírový dialog" # todo: NEW TRANSLATION
 SIA_ds_peace_dialogue_desc: "Povolit formální rozhovory se separatistickým hnutím za malajsijského zprostředkování. Jednat s nimi znamená přiznat jejich existenci. Je to také jediný způsob, jak to ukončit u jednacího stolu." # todo: NEW TRANSLATION
 SIA_arm_shan_militias: "Vyzbrojit šanské milice" # todo: NEW TRANSLATION
 SIA_arm_shan_militias_desc: "Tiše zásobovat šanské armády za barmskou hranicí. Každý konvoj kupuje vliv nad tím, čím se Šanský stát stane." # todo: NEW TRANSLATION
 SIA_shan_client_state: "Podpořit Šanský stát" # todo: NEW TRANSLATION
 SIA_shan_client_state_desc: "Uznat a podporovat šanský stát spojený s Bangkokem. Naši bratři získají svou zemi a my její oddanost." # todo: NEW TRANSLATION
 SIA_integrate_shan: "Integrovat šanské země" # todo: NEW TRANSLATION
 SIA_integrate_shan_desc: "Rozšířit thajskou správu na šanskou náhorní plošinu a přivést guvernéry, školy i baht. Obyvatelstvo musí být dostatečně uklidněno, než Bangkok upevní kontrolu." # todo: NEW TRANSLATION
 SIA_integrate_laos: "Integrovat laoské země" # todo: NEW TRANSLATION
 SIA_integrate_laos_desc: "Rozšířit thajskou správu na nárokované laoské provincie. Než bude možné formální začlenění, je vyžadována vysoká poslušnost a nízký odpor v jádrovém státě." # todo: NEW TRANSLATION
 SIA_all_laos_claimed: "Vzneseny maximalistické laoské nároky" # todo: NEW TRANSLATION
 SIA_integrate_cambodia: "Integrovat khmerské provincie" # todo: NEW TRANSLATION
 SIA_integrate_cambodia_desc: "Rozšířit thajskou správu na Battambang a Siem Reap, stejně jako v letech 1941–1946. Khmerské obyvatelstvo musí přijmout thajskou vládu, než bude možné zavést formální správu." # todo: NEW TRANSLATION
 SIA_integrate_malaya: "Integrovat jižní provincie" # todo: NEW TRANSLATION
 SIA_integrate_malaya_desc: "Rozšířit thajskou správu na bývalé sultanáty odstoupené v roce 1909. Integrace vyžaduje, aby bylo obyvatelstvo před formální anexí pevně přivedeno pod vliv Bangkoku." # todo: NEW TRANSLATION
 SIA_full_1909_demand: "Požadována plná území smlouvy z roku 1909" # todo: NEW TRANSLATION
 SIA_cost_1_0: "£treasury 1.0" # todo: NEW TRANSLATION
 SIA_cost_1_5: "£treasury 1.5" # todo: NEW TRANSLATION
 SIA_thaksinite_party_governs_tt: "§Y[neutral_Social_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_cost_2_0: "£treasury 2.0" # todo: NEW TRANSLATION
 SIA_cost_2_0_blocked: "£treasury 2.0 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_otpc_education_strain: "Zavedení jednoho tabletu pro každé dítě" # todo: NEW TRANSLATION
 SIA_otpc_education_strain_desc: "Nabíječky, rozbité přístroje, náhradní kusy a rozpočet na školení, který nikdo nezapočítal. Ministerstvo školství vstřebává skutečnou cenu programu." # todo: NEW TRANSLATION
 SIA_packed_senate: "Senát podle našich představ" # todo: NEW TRANSLATION
 SIA_packed_senate_desc: "Loajalisté v horní komoře a nezávislých úřadech. Prozatím procházejí vládní zákony bez odporu." # todo: NEW TRANSLATION
 SIA_cost_5_0: "£treasury 5.0" # todo: NEW TRANSLATION
 SIA_economy_category: "Thajská strategická a hospodářská rozhodnutí" # todo: NEW TRANSLATION
 SIA_economy_category_desc: "Turismus, zdravotnictví, výroba, zbraně a megaprojekty spolu s pákami diplomacie ASEAN a velké strategie. Motory thajského státu reagují na investice a politický kapitál, když si je státní pokladna a vláda mohou dovolit." # todo: NEW TRANSLATION
 SIA_ds_hearts_and_minds: "Srdce a mysli" # todo: NEW TRANSLATION
 SIA_ds_hearts_and_minds_desc: "Výuka v malajštině, náboženská osvěta, kompenzační rady a vesničtí prostředníci. Nikdo kvůli tomu neuspořádá přehlídku, mapa incidentů se však uklidňuje." # todo: NEW TRANSLATION
 SIA_contain_the_crisis: "Omezit krizi" # todo: NEW TRANSLATION
 SIA_contain_the_crisis_desc: "Hluboký jih se vymkl kontrole. Snižte intenzitu povstání pod bod varu do šesti měsíců, jinak násilí nabere spirálu a cena ve stabilitě a legitimitě poroste." # todo: NEW TRANSLATION
 SIA_choose_a_path: "Zvolit cestu na jihu" # todo: NEW TRANSLATION
 SIA_choose_a_path_desc: "Krize probíhá a vláda má jasný politický mandát, žádná jižní strategie však nebyla přijata. Zvolte do roka směr (síla, královský rozvoj nebo dialog), jinak bude nerozhodnost Království drahá." # todo: NEW TRANSLATION
 SIA_medical_tourism_campaign: "Kampaň zdravotní turistiky" # todo: NEW TRANSLATION
 SIA_medical_tourism_campaign_desc: "Propagovat thajské nemocnice po celém světě a nabídnout operace i rekonvalescenci za zlomek západních cen, s pláží navíc. Kampaň se zaplatí sama, pokud oddělení zvládnou nápor." # todo: NEW TRANSLATION
 SIA_eec_investment_phase: "Investiční etapa EHK" # todo: NEW TRANSLATION
 SIA_eec_investment_phase_desc: "Uvolnit další tranši prostředků Východního hospodářského koridoru na vyklízení pozemků, inženýrské sítě a práce na přístavech a železnici ve východních provinciích." # todo: NEW TRANSLATION
 SIA_cost_3_0: "£treasury 3.0" # todo: NEW TRANSLATION
 SIA_cost_4_0: "£treasury 4.0" # todo: NEW TRANSLATION
 SIA_cost_6_0: "£treasury 6.0" # todo: NEW TRANSLATION
 SIA_cost_7_0: "£treasury 7.0" # todo: NEW TRANSLATION
 SIA_cost_1_0_blocked: "£treasury 1.0 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_cost_1_5_blocked: "£treasury 1.5 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_cost_3_0_blocked: "£treasury 3.0 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_cost_4_0_blocked: "£treasury 4.0 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_cost_5_0_blocked: "£treasury 5.0 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_cost_6_0_blocked: "£treasury 6.0 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_cost_7_0_blocked: "£treasury 7.0 §R(nedostatek)§!" # todo: NEW TRANSLATION
 SIA_family_holdings: "Rodinné podíly" # todo: NEW TRANSLATION
 SIA_family_holdings_desc: "Rodina Shinawatra ovládá významné podíly v telekomunikacích, satelitních službách, satelitní televizi a tuctu souvisejících podniků. Proměňovat vztahy s vládou v dividendy je rodinnou tradicí a zdrojem příjmů, na který strana spoléhá." # todo: NEW TRANSLATION
 SIA_royal_projects: "Královské rozvojové projekty" # todo: NEW TRANSLATION
 SIA_royal_projects_desc: "Vyslat královské rozvojové týmy do venkovských provincií k demonstračním farmám, mobilním zdravotním klinikám, správě povodí a odbornému výcviku. Každý projekt doprovází osobní prestiž krále a vesničtí předáci si pamatují, kdo je poslal." # todo: NEW TRANSLATION
 SIA_isoc_surveillance_sweep: "Dozorová razie ISOC" # todo: NEW TRANSLATION
 SIA_isoc_surveillance_sweep_desc: "Vyslat zpravodajské týmy ISOC, aby prohledaly mobilní sítě, vesnické informátorské sítě a hraniční přechody na hlubokém jihu. Bez povolení, bez záznamů a s obrazem jihu, jaký armáda dosud neměla." # todo: NEW TRANSLATION
 SIA_isoc_grid_disruption: "Narušení sítě ISOC" # todo: NEW TRANSLATION
 SIA_isoc_grid_disruption_desc: "Zaměřit se na finanční kanály, velitelská centra a kurýrní sítě, které udržují operační tempo povstání. Každý narušený uzel znamená bombu, která nevybuchne." # todo: NEW TRANSLATION
 SIA_ds_cordon_and_search: "Obklíčit a prohledat" # todo: NEW TRANSLATION
 SIA_ds_cordon_and_search_desc: "Uzavřít vesnice a prohledat je dům od domu kvůli zbraním a bojovníkům. Tempo povstalců se zlomí rychle, ale každé vyražené dveře a zadržený příbuzný prohloubí křivdu, z níž hnutí čerpá." # todo: NEW TRANSLATION
 SIA_ds_fund_religious_schools: "Financovat pondokové školy" # todo: NEW TRANSLATION
 SIA_ds_fund_religious_schools_desc: "Státní granty pro malajsko-muslimské náboženské školy a kulturní instituce, kterých si jih váží, podle podmínek samotného jihu. Tento týden násilí příliš nezmění, tvrdě však zasáhne odcizení, které jej udržuje." # todo: NEW TRANSLATION
 SIA_asean_rotating_summit: "Hostit summit ASEAN" # todo: NEW TRANSLATION
 SIA_asean_rotating_summit_desc: "Využít thajské předsednictví k pořádání významného summitu a představit Bangkok jako diplomatické hlavní město jihovýchodní Asie. Výsledná dobrá vůle se doma promění v politický kapitál a v zahraničí v prestiž." # todo: NEW TRANSLATION
 SIA_asean_mediate_myanmar: "Zprostředkovat krizi v Myanmaru" # todo: NEW TRANSLATION
 SIA_asean_mediate_myanmar_desc: "Postavit Thajsko do role poctivého prostředníka mezi myanmarskou juntou a mezinárodním společenstvím. Tichý úspěch vybuduje v Naypyidawu trvalý vliv. Veřejné selhání je stále užitečným signálem pro zbytek regionu." # todo: NEW TRANSLATION
 SIA_asean_free_trade_push: "Prosadit opatření volného obchodu ASEAN" # todo: NEW TRANSLATION
 SIA_asean_free_trade_push_desc: "Využít předsednictví k prosazení opatření usnadňujících obchod, například harmonizace cel, omezení netarifních překážek a digitálních obchodních koridorů. Základy si vyžádají čas, exportní příjmy však dorazí podle plánu. Sousedé v ASEAN si konstruktivního vedení Bangkoku všimnou." # todo: NEW TRANSLATION
 SIA_retry_section_112: "Znovu předložit novelu" # todo: NEW TRANSLATION
 SIA_retry_section_112_desc: "První pokus reformovat paragraf 112 v zákonodárném sboru selhal. Veřejný odpor byl hlasitý, stejně jako protimobilizace mladých voličů. Druhý pokus, lépe připravený a úžeji formulovaný, může při správném načasování stále projít." # todo: NEW TRANSLATION
 SIA_112_amended: "Paragraf 112 novelizován" # todo: NEW TRANSLATION
 SIA_ds_autonomy_framework: "Rámec autonomie jihu" # todo: NEW TRANSLATION
 SIA_ds_autonomy_framework_desc: "Pilotně zavést skromný režim správní autonomie pro malajsko-muslimské provincie s regionální poradní radou, oficiálním statusem malajštiny a decentralizovaným financováním škol. Nezávislost, ani zdaleka, ale dost na ukázku, že Bangkok umí naslouchat. Šest měsíců na návrh, generace na posouzení." # todo: NEW TRANSLATION
 SIA_isr_persistent_sweep: "Trvalý průzkum ISR" # todo: NEW TRANSLATION
 SIA_isr_persistent_sweep_desc: "Pověřit prostředky Očí na obloze nepřetržitým dohledem nad hlubokým jihem: hraničními přechody, mobilním provozem a pohybem vozidel. Povstalci ztrácejí schopnost pohybovat se nepozorovaně a jediný voják nemusí vstoupit do vesnice." # todo: NEW TRANSLATION
 SIA_political_gambits_category: "Politické tahy" # todo: NEW TRANSLATION
 SIA_political_gambits_category_desc: "Mezi zaměřeními má vláda stále k dispozici páky: změny ministrů, nasměrované prokurátory, peníze poslané do vnitrozemí a v případě potřeby dohoda s palácem nebo den u soudu.\n\n§YTlak reforem§!: [?ROOT.SIA_reform_pressure|0]/100. Nespokojenost měst a mladých směřující k Move Forward. Nad 60 přetéká do protestů.\n§YPopulistický příliv§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. Venkov se vrací k Pheu Thai. Tento ukazatel ovlivňuje pouze demokratickou vládu." # todo: NEW TRANSLATION
 SIA_cabinet_reshuffle: "Rekonstrukce vlády" # todo: NEW TRANSLATION
 SIA_cabinet_reshuffle_desc: "Proházet ministry, umlčet kritiky a vyřadit nejslabšího výkonu z televizního programu. Odejde Únava z Prayutha nebo Politika soudní síně, podle toho, co se právě drží vlády. Strana prohlásí obnovu, aniž by změnila cokoli podstatného." # todo: NEW TRANSLATION
 SIA_lese_majeste_lever: "Stisknout páku majestátu" # todo: NEW TRANSLATION
 SIA_lese_majeste_lever_desc: "Selektivně uplatnit paragraf 112 proti nejhlasitějším reformním kritikům. Obvinění podána, kauce zamítnuta, prohlášení odvolána. Opozice přijde o hlas a každý, kdo to sleduje, se od systému vzdálí o další krok." # todo: NEW TRANSLATION
 SIA_coup_watch_category: "Kasárna sledují situaci" # todo: NEW TRANSLATION
 SIA_coup_watch_category_desc: "Každá zvolená populistická vláda v thajských dějinách vládla ve stínu armády. Rychlé výhry jako telekomunikační úsluhy, předražené smlouvy a rodinná korupce nyní kupují peníze a hlasy, každý z nich však zvyšuje §YRiziko převratu§!. To samo roste každý týden o 0,5, běžně, a o 1,0, když je stabilita pod 50 %, a bez zásahu nikdy neklesá. Níže uvedená rozhodnutí riziko snižují, každé vás však něco stojí. Nechte jej překročit 85 a aktivuje se mise §RUklidnit vrchní velení§!. Zažehnejte je, jinak armáda převezme vládu.\n\n§YRiziko převratu§!: [?ROOT.SIA_coup_risk|0]/100" # todo: NEW TRANSLATION
 SIA_shin_corp_tax_holiday: "Ušít daňové prázdniny telekomunikacím" # todo: NEW TRANSLATION
 SIA_shin_corp_tax_holiday_desc: "Tiše přepsat podmínky koncese tak, aby rodinné telekomunikační impérium při příštím zisku zaplatilo téměř nic. Státní pokladna i strana získají. Generálové počítají." # todo: NEW TRANSLATION
 SIA_school_milk_contract: "Přidělit smlouvu na školní mléko" # todo: NEW TRANSLATION
 SIA_school_milk_contract_desc: "Celostátní program bezplatného mléka pro venkovské školáky, nesmírně oblíbený ve vesnicích, vedený přes kartel dodavatelů, který přesně ví, komu děkovat. Vesnice jsou vděčné. Důstojníci nikoli." # todo: NEW TRANSLATION
 SIA_otpc_tablet_procurement: "Spustit program Jeden tablet pro každé dítě" # todo: NEW TRANSLATION
 SIA_otpc_tablet_procurement_desc: "Okázalý plán dát tablet do rukou každého prvňáčka. Kamery jej milují a stranická čísla rostou. Platí se v hotovosti, rozpočet školství nese zátěž půl roku a nákupy jsou strojem na provize, o kterém každý v uniformě ví." # todo: NEW TRANSLATION
 SIA_family_business_favors: "Směřovat zakázky rodinné firmě" # todo: NEW TRANSLATION
 SIA_family_business_favors_desc: "Veřejné práce, dovozní licence, jedna či dvě přístavní koncese — všechno firmám, které náhodou vlastní příbuzní premiéra. Peníze pro státní pokladnu i rodinu. Armáda to přidává do spisu proti vám." # todo: NEW TRANSLATION
 SIA_court_the_generals: "Dvořit se generálům" # todo: NEW TRANSLATION
 SIA_court_the_generals_desc: "Nenápadné rozpočtové položky, prestižní umístění a několik vhodně načasovaných povýšení. Nic z toho není levné, spokojený důstojnický sbor je však trpělivý. Snižuje riziko převratu." # todo: NEW TRANSLATION
 SIA_military_budget_boost: "Schválit rozhazovačný obranný nákup" # todo: NEW TRANSLATION
 SIA_military_budget_boost_desc: "Ponorky, stíhačky, nové křídlo velitelství. Schválit armádní seznam přání a mosazné nárameníky si zapamatují, kdo platí účty. Civilní ekonomika kvůli tomu poněkud strádá, riziko převratu však prudce klesá." # todo: NEW TRANSLATION
 SIA_anti_corruption_gesture: "Předhodit prokurátorům kumpána" # todo: NEW TRANSLATION
 SIA_anti_corruption_gesture_desc: "Vybrat postradatelného spojence, předat spis protikorupční komisi a nechat kamery pracovat. Stoupenci strany sledují, jak je přítel obětován za dobré titulky, a průzkumy klesají. Generálové vidí vládu, která trestá vlastní lidi." # todo: NEW TRANSLATION
 SIA_promote_loyalists: "Povýšit loajální důstojníky" # todo: NEW TRANSLATION
 SIA_promote_loyalists_desc: "Přeskupit každoroční seznam povýšení a dosadit spolehlivé lidi do důležitých velení — První armády, Královské gardy a posádky hlavního města. Stojí to politický kapitál, ale mezi vládu a tanky staví přátelštější muže. Snižuje riziko převratu." # todo: NEW TRANSLATION
 SIA_reassure_high_command: "Uklidnit vrchní velení" # todo: NEW TRANSLATION
 SIA_reassure_high_command_desc: "Kolony jsou natankované a scénář vysílání napsaný. Snižte riziko převratu pod 70, než vyprší časovač, pomocí rozpočtů, povýšení nebo veřejného zúčtování s kumpány. Selžete-li, armáda převezme vládu." # todo: NEW TRANSLATION
 SIA_canal_tolls: "Vybírat mýtné na kanálu" # todo: NEW TRANSLATION
 SIA_canal_tolls_desc: "Kra kanál přepravuje část nejcennějšího námořního provozu na světě. Výběr mýtného od obchodních plavidel, jako jsou kontejnerové lodě, tankery, nákladní lodě a výletní lodě, proudí každých šest měsíců přímo do státní pokladny." # todo: NEW TRANSLATION
 SIA_kra_construction: "Kra kanál" # todo: NEW TRANSLATION
 SIA_kra_construction_desc: "Kra kanál po celou dobu své existence. Nejprve postupné práce na velkém průkopu přes šíji Kra, každá etapa financovaná zvlášť, přičemž zanedbání přivolává překročení nákladů a na sporném území sabotáž. Poté námořní správa dokončeného průlivu: rozvrhy hlídek, tranzitní protokoly a zabezpečení nejnovějšího strategického hrdla světa.\nVelký průkop pokračuje ve třech financovaných etapách. §YPokrok výstavby§!: [?ROOT.SIA_kra_progress|0]%" # todo: NEW TRANSLATION
 SIA_kra_phase_1: "Etapa I, prokopat šíji" # todo: NEW TRANSLATION
 SIA_kra_phase_1_desc: "První velký výkop. Protlačit kanál páteří poloostrova. Financovat etapu před koncem stavební sezóny, jinak se projektový úřad vrátí s překročením nákladů." # todo: NEW TRANSLATION
 SIA_kra_phase_1_funding_tt: "Vyžaduje uplynutí cooldownu studie proveditelnosti a stav státní pokladny převyšující údržbu (aktuálně §Y$[?ROOT.SIA_kra_upkeep|0]§! miliard) i platbu §Y$20§! miliard za etapu I." # todo: NEW TRANSLATION
 SIA_kra_phase_2: "Etapa II, zdymadla a kanál" # todo: NEW TRANSLATION
 SIA_kra_phase_2_desc: "Obložit průkop, zapustit zdymadla a vybudovat kanálová díla, která zadrží dvě moře. Udržet státní pokladnu za harmonogramem, jinak čelit dalšímu překročení nákladů." # todo: NEW TRANSLATION
 SIA_kra_phase_2_funding_tt: "Vyžaduje uplynutí cooldownu předchozí etapy a stav státní pokladny převyšující údržbu (aktuálně §Y$[?ROOT.SIA_kra_upkeep|0]§! miliard) i platbu §Y$30§! miliard za etapu II." # todo: NEW TRANSLATION
 SIA_kra_phase_3: "Etapa III, zkoušky na moři" # todo: NEW TRANSLATION
 SIA_kra_phase_3_desc: "Zaplavení vrcholového úseku, zavěšení vrat a provedení lodivodů v balastu. Poslední etapa před otevřením kanálu. Financovat ji a megaprojekt bude dokončen." # todo: NEW TRANSLATION
 SIA_kra_phase_3_funding_tt: "Vyžaduje uplynutí cooldownu předchozí etapy a stav státní pokladny převyšující údržbu (aktuálně §Y$[?ROOT.SIA_kra_upkeep|0]§! miliard) i platbu §Y$40§! miliard za etapu III." # todo: NEW TRANSLATION
 SIA_strait_patrol: "Hlídka v průlivu" # todo: NEW TRANSLATION
 SIA_strait_patrol_desc: "Nasadit plavidla Královského thajského námořnictva k pravidelným hlídkám tranzitního koridoru Kra. Přítomnost odrazuje pirátství, uklidňuje lodní dopravu a dává flotile čas na moři, jaký nikdy neměla." # todo: NEW TRANSLATION
 SIA_red_path_category: "Operace vesnických výborů" # todo: NEW TRANSLATION
 SIA_red_path_category_desc: "Rozšířit organizační přítomnost strany do venkovských komunit, pracovišť a sousedství. Každý zakořeněný výbor posiluje lidovou základnu hnutí a zkouší toleranci vlády." # todo: NEW TRANSLATION
 SIA_spread_flame_isaan: "Organizovat isánské vesnice" # todo: NEW TRANSLATION
 SIA_spread_flame_isaan_desc: "Vyslat stranické kádry do isánských vesnic a okresních měst. Zakládat vesnické výbory, alfabetizační skupiny a družstevní sítě. Severovýchod je přirozenou základnou hnutí, proto ji prohloubit." # todo: NEW TRANSLATION
 SIA_spread_flame_north: "Organizovat severní komunity" # todo: NEW TRANSLATION
 SIA_spread_flame_north_desc: "Sever má dlouhou historii odborového organizování a agrárního radikalismu. Straničtí organizátoři pracují v horských družstvech a dřevařských odborech. Základna zde znamená, že hnutí je víc než Isán." # todo: NEW TRANSLATION
 SIA_mass_education_campaign: "Kampaň masového politického vzdělávání" # todo: NEW TRANSLATION
 SIA_mass_education_campaign_desc: "Celostátní osnovy politického vzdělávání zahrnující dějiny práce, ekonomickou teorii a dějiny imperialismu v jihovýchodní Asii. Probíhá prostřednictvím odborů, družstev a komunitních center spojených se stranou. Investice nyní stojí politický kapitál. Odměnou je skutečně politicky uvědomělá voličská základna." # todo: NEW TRANSLATION
 SIA_asean_arms_export: "Kontrakt na vývoz zbraní do ASEAN" # todo: NEW TRANSLATION
 SIA_asean_arms_export_desc: "Thajští výrobci obranného materiálu mají výrobní kapacitu a regionální vztahy potřebné k udržení pravidelného exportního programu. Každý roční kontrakt, ať už na MRAPy, dělostřelecké zapalovače, dávky munice nebo povalující se munici, přidává přímo do státní pokladny a upevňuje postavení Thajska jako preferovaného dodavatele druhé úrovně v regionu." # todo: NEW TRANSLATION
 SIA_defense_export_contract: "Kontrakt na vývoz obranného materiálu" # todo: NEW TRANSLATION
 SIA_defense_export_contract_desc: "S fungujícím Úřadem pro vývoz obranného materiálu a arzenály království certifikovanými k prodeji může vláda schválit nový exportní kontrakt. Vozidla Chaiseri First Win, rakety a munice DTI i licenčně vyráběné systémy míří pravidelně ke kupcům v ASEAN. Politický kapitál vynaložený na zajištění dohody se vrací do státní pokladny jako tvrdé exportní příjmy a obranně-průmyslové křídlo si na sebe vydělává." # todo: NEW TRANSLATION
 SIA_counter_chinese_influence: "Čelit čínskému vlivu" # todo: NEW TRANSLATION
 SIA_counter_chinese_influence_desc: "Nasadit diplomatické, hospodářské a informační zdroje k potlačení pekingského vlivu v sousedství Bangkoku. Operace potrvá měsíce a něco stojí, alternativou je však podřízení." # todo: NEW TRANSLATION
 SIA_counter_indian_influence: "Čelit indickému vlivu" # todo: NEW TRANSLATION
 SIA_counter_indian_influence_desc: "Měkká síla Dillí v jihovýchodní Asii, od investic přes kulturní programy po strategická partnerství, se tiše rozšiřuje. Koordinovaná protivlivová kampaň přesměruje regionální partnery k Bangkoku." # todo: NEW TRANSLATION
 SIA_renegotiate_china_contracts: "Znovu vyjednat čínské kontrakty" # todo: NEW TRANSLATION
 SIA_renegotiate_china_contracts_desc: "Infrastrukturní kontrakty Pásu a stezky vybudovaly silnice a železnice, které Thajsko potřebovalo, finanční podmínky však na generaci vtělují pekingský vliv. Vláda může tuto závislost přijmout, nebo zaplatit politickou cenu za nové vyjednání podmínek." # todo: NEW TRANSLATION
 SIA_us_security_review: "Bezpečnostní revize USA–Thajsko" # todo: NEW TRANSLATION
 SIA_us_security_review_desc: "Washington požádal o formální dvoustrannou bezpečnostní revizi. Výsledek určí, zda Thajsko prohloubí smluvní spojenectví s výcvikovými balíčky, přístupem k nákupu a politickou viditelností, které to přináší, nebo zachová strategickou pojistku." # todo: NEW TRANSLATION
 SIA_strategic_fuel_reserve: "Vybudovat strategickou rezervu paliva" # todo: NEW TRANSLATION
 SIA_strategic_fuel_reserve_desc: "Zřídit tříměsíční celostátní zásoby paliva v rozptýlených nádržích. Investice vyrovná cenovou volatilitu, poskytne vojenskou logistickou rezervu a vyšle regionálním partnerům signál o odolnosti dodavatelských řetězců." # todo: NEW TRANSLATION
 SIA_anti_corruption_drive: "Protikorupční tažení" # todo: NEW TRANSLATION
 SIA_anti_corruption_drive_desc: "Cílená kampaň proti korupci při nákupech, celním podvodům a patronátním sítím zakořeněným v provinční správě. Čisté smlouvy jsou zpočátku pomalejší a z dlouhodobého hlediska levnější." # todo: NEW TRANSLATION
 SIA_tax_modernization: "Modernizace daňového systému" # todo: NEW TRANSLATION
 SIA_tax_modernization_desc: "Nahradit papírový systém vyměřování Daňového úřadu povinným elektronickým podáním, algoritmickými audity a pobídkami pro hodnotitele založenými na výběru. Zavedení je bolestivé. Trvalá dividenda efektivity splatí kapitálové náklady do pěti let." # todo: NEW TRANSLATION
 SIA_gripen_ef_upgrade: "Kontrakt Gripen E/F" # todo: NEW TRANSLATION
 SIA_gripen_ef_upgrade_desc: "Kontrakt na 12 letounů Gripen E/F podepsaný v srpnu 2025 představuje závazek RTAF ke stíhačce schopné operací páté generace. První dodávky se očekávají v roce 2029. Kontrakt upevňuje dlouhodobé vztahy RTAF se společností SAAB a zajišťuje švédskou údržbu do 40. let." # todo: NEW TRANSLATION
 SIA_imf_program_active: "Standby program MMF stále probíhá" # todo: NEW TRANSLATION
 SIA_ds_active: "Povstání na hlubokém jihu probíhá" # todo: NEW TRANSLATION
 SIA_ds_resolved_force: "Povstání na hlubokém jihu bylo potlačeno silou" # todo: NEW TRANSLATION
 SIA_ds_resolved_peace: "Povstání na hlubokém jihu bylo vyřešeno mírovými rozhovory" # todo: NEW TRANSLATION
