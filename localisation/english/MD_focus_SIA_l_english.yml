 SIA_coup_risk_below_70_tt: "Riziko převratu pod §Y70§! (nyní §Y[?ROOT.SIA_coup_risk|0]§!/100)" # todo: NEW TRANSLATION
 SIA_coup_risk_reset_tt: "Převrat uspěje. Riziko převratu je za vojenské vlády vynulováno." # todo: NEW TRANSLATION
 SIA_army_patience_exhausted_tt: "Trpělivost armády je vyčerpána: riziko převratu nad 60 po 1. lednu 2010." # todo: NEW TRANSLATION
 SIA_ds_force_track_increase_tt: "Roste vojenský postup k násilnému řešení." # todo: NEW TRANSLATION
 SIA_ds_peace_track_increase_tt: "Roste vyjednávací postup k mírovému urovnání." # todo: NEW TRANSLATION
 SIA_reform_pressure_increase_tt: "§RTlak reforem [?reform_delta|0+]§! (nyní §Y[?ROOT.SIA_reform_pressure|0]§!/100)" # todo: NEW TRANSLATION
 SIA_reform_pressure_decrease_tt: "§GTlak reforem [?reform_delta|0+]§! (nyní §Y[?ROOT.SIA_reform_pressure|0]§!/100)" # todo: NEW TRANSLATION
 SIA_engage_reform_movement: "Zapojit reformní hnutí" # todo: NEW TRANSLATION
 SIA_engage_reform_movement_desc: "Pozvat studentské odbory a reformní klub k jednacímu stolu, financovat program pracovních míst pro mladé a nechat kamery zachytit potřesení rukou. Ulice se uklidní. Přizvání hnutí ke stolu mu také dodá respekt a Move Forward z toho získá." # todo: NEW TRANSLATION
 SIA_rural_development_package: "Balíček rozvoje venkova" # todo: NEW TRANSLATION
 SIA_rural_development_package_desc: "Vesnické fondy, minimální cena rýže, oddlužení zemědělců a nová silnice do okresního města. Jedna platba ze státní pokladny koupí rok, během něhož venkov přestane naslouchat populistické mašinérii." # todo: NEW TRANSLATION
 SIA_rural_package_active: "Balíček rozvoje venkova" # todo: NEW TRANSLATION
 SIA_rural_package_active_desc: "Vesnické fondy vyplácejí peníze, minimální cena platí a stavební čety pracují na okresní silnici. Spotřební zboží je po dobu trvání o něco dražší a po tento rok patří venkov vládě." # todo: NEW TRANSLATION
 SIA_palace_bargain: "Uzavřít dohodu s palácem" # todo: NEW TRANSLATION
 SIA_palace_bargain_desc: "Převrat vyřešený vyjednáváním. Namísto čekání na tanky dát paláci a jeho generálům to, co by si stejně vzali. Royalistický establishment vstoupí do vlády jako seniorní partner, naše strana si ponechá křesla a ztratí prvenství a Království se obrátí bez jediného výstřelu." # todo: NEW TRANSLATION
 SIA_face_the_court: "Postavit se Ústavnímu soudu" # todo: NEW TRANSLATION
 SIA_face_the_court_desc: "Předložit osud vládnoucí strany soudcům, jak to Thajsko činí už dvě desetiletí. Na rozdíl od dohody s palácem jde o sázku, nikoli urovnání: rozhoduje soud. Podřídit se rozpuštění a předat moc soupeřům, nebo vzdorovat rozsudku a zaplatit stabilitou i trpělivostí armády." # todo: NEW TRANSLATION
 SIA_pack_the_senate: "Naplnit senát" # todo: NEW TRANSLATION
 SIA_pack_the_senate_desc: "Napěchovat horní komoru a nezávislé úřady loajalisty, dokud vládu nebude nic kontrolovat. Zákony půl roku procházejí bez odporu. Generálové to vidí jako otevřený pokus o uchvácení moci." # todo: NEW TRANSLATION
 SIA_populist_trunk_entry_tt: "§Y[neutral_Social_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_royalist_trunk_entry_tt: "§Y[Nat_Autocracy_L]§! nebo §Y[Monarchist_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_democrat_trunk_entry_tt: "§Y[conservatism_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_telecom_excise_favor: "Změna spotřební daně z telekomunikací" # todo: NEW TRANSLATION
 SIA_telecom_excise_favor_desc: "Proměnit poplatky za telekomunikační koncesi ve spotřební daň nastavenou tak, aby rodinný AIS zůstal ve vedení a noví účastníci převzali břemeno. Státní pokladna i vděčná podnikatelská základna vás odmění. Vrchní velení si všímá, že stát je řízen pro rozvahu jedné rodiny. §RRiziko převratu roste.§!" # todo: NEW TRANSLATION
 SIA_exim_myanmar_loan: "Půjčka EXIM Rangúnu" # todo: NEW TRANSLATION
 SIA_exim_myanmar_loan_desc: "Poskytnout myanmarské juntě měkkou státní půjčku účelově určenou, vhodně, na nákup satelitních a telekomunikačních služeb od rodinného Shin Satellite. Gesto zahraniční politiky, které je zároveň úhledným kontraktem pro rodinnou firmu. Učebnicový střet zájmů, který generálům neunikne. §RRiziko převratu roste.§!" # todo: NEW TRANSLATION
 SIA_state_lottery_scheme: "Státní loterie" # todo: NEW TRANSLATION
 SIA_state_lottery_scheme_desc: "Začlenit podzemní číselnou hru do státního programu. Mimorozpočtové peníze na patronát a oblíbené projekty, oblíbené mezi sázejícími a přesně takový nekontrolovatelný fond, který každý manifest převratu uvádí jako první." # todo: NEW TRANSLATION
 SIA_democrat_machine_category: "Stranická mašinérie" # todo: NEW TRANSLATION
 SIA_democrat_machine_category_desc: "Výhodou Demokratů je organizace, Thaksinova mašinérie je však vždy jen jedno venkovské drtivé vítězství od návratu k moci. Pracujte s volebními obvody a držte linii.\n\n§YPopulistický příliv§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. Roste o 1 týdně, rychleji během útlumu nebo při poklesu stability, zatímco silná ekonomika a klidná země jej pouze udržují na stejné úrovni. Snižovat jej lze níže uvedenými rozhodnutími, předmostím v Isánu nebo balíčkem rozvoje venkova. Nad 35 stojí stabilitu a růst. Nad 70 stojí mnohem více." # todo: NEW TRANSLATION
 SIA_constituency_machine: "Pracovat s volebními obvody" # todo: NEW TRANSLATION
 SIA_constituency_machine_desc: "Poslat členy zpět do okresů pořádat poradny, opravovat odtoky, řešit spory a pamatovat si jména. Nudná práce a jediný druh, který udrží mandát. §YObliba Demokratické strany roste§! a populistický příliv slábne." # todo: NEW TRANSLATION
 SIA_pt_pressure_increase_tt: "§RPopulistický příliv [?pt_delta|0+]§! (nyní §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)" # todo: NEW TRANSLATION
 SIA_pt_pressure_decrease_tt: "§GPopulistický příliv [?pt_delta|0+]§! (nyní §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)" # todo: NEW TRANSLATION
 SIA_match_the_populists: "Vyrovnat se populistům" # todo: NEW TRANSLATION
 SIA_match_the_populists_desc: "Když nemůžete porazit vesnický fond, vybudujte lepší. Levná zdravotní péče, oddlužení a venkovské úvěry pod hlavičkou Demokratů. Vyčerpá to státní pokladnu a odebere téma Pheu Thai." # todo: NEW TRANSLATION
 SIA_expose_corruption: "Odhalit síť" # todo: NEW TRANSLATION
 SIA_expose_corruption_desc: "Obrátit protikorupční úřady a soudy proti populistické mašinérii. Majetkové kauzy, vyšetřování kupování hlasů a dlouhé soudní boje, které už svrhly více než jednu thaksinistickou vládu." # todo: NEW TRANSLATION
 SIA_broaden_the_coalition: "Rozšířit koalici" # todo: NEW TRANSLATION
 SIA_broaden_the_coalition_desc: "Předejte ministerstva malým stranám a provinčním bossům výměnou za jejich mandáty. Cenou je rozhádaný kabinet plný handrkování (§Rpožadavky koalice§!), ale vytvoří parlamentní hráz, kterou žádná jediná populistická volební vlna neprorazí. §GPopulistická vlna prudce ustoupí.§!" # todo: NEW TRANSLATION
 SIA_democrat_machine_active: "Vláda stranického aparátu Demokratické strany" # todo: NEW TRANSLATION
 SIA_counter_messaging: "Proti populistickému poselství" # todo: NEW TRANSLATION
 SIA_counter_messaging_desc: "Odpovězte na populistickou rétoriku tam, kde ji lidé skutečně slyší: v ranních talk show, vesnických rozhlasových věžích a odborových sálech. Malý, opakovatelný tlak, který podkopává rozmach Pheu Thai." # todo: NEW TRANSLATION
 SIA_reconstruction_category: "Rozvoj znovu získaných území" # todo: NEW TRANSLATION
 SIA_reconstruction_category_desc: "Území dobytá na západní frontě nebo během tažení za hegemonii ASEAN jsou držena, ale dosud nebyla integrována. Uklidněte provincie, nalijte do nich peníze na obnovu a jakmile budou dostatečně klidné, prohlaste je přímo za součást národa." # todo: NEW TRANSLATION
 SIA_reconstruction_pacify: "Uklidnit provincie" # todo: NEW TRANSLATION
 SIA_reconstruction_pacify_desc: "Zaplavte okupované provincie správci, informátory a amnestijními programy. Poslušnost vzroste v každé provincii, kterou držíme, ale dosud jsme ji neintegrovali. Pomalá a trpělivá práce, ale základ, na němž stojí vše ostatní." # todo: NEW TRANSLATION
 SIA_reconstruction_develop: "Financovat obnovu" # todo: NEW TRANSLATION
 SIA_reconstruction_develop_desc: "Uvolněte prostředky na obnovu silnic, energetiky a veřejných staveb napříč znovu získanými územími. Infrastruktura a počet stavebních slotů vzroste v každé držené provincii, čímž se propojí s národním hospodářstvím a obyvatelstvo získá zájem na thajské vládě." # todo: NEW TRANSLATION
 SIA_reconstruction_integrate: "Vyhlásit znovusjednocené provincie" # todo: NEW TRANSLATION
 SIA_reconstruction_integrate_desc: "Tam, kde je poslušnost dostatečně vysoká, okupace končí a provincie se stávají thajskou půdou. Každá pacifikovaná provincie, kterou držíme, bude začleněna do Království jako jádro — trvalý zisk, který žádná mírová konference nemůže zvrátit." # todo: NEW TRANSLATION
 SIA_ghosts_5pct_tt: "§Y[Communist-State_L]§! má alespoň 5% popularitu." # todo: NEW TRANSLATION
 SIA_reform_5pct_tt: "§Y[socialism_L]§! má alespoň 5% popularitu." # todo: NEW TRANSLATION
 SIA_reform_trunk_entry_tt: "§Y[socialism_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_communist_trunk_entry_tt: "§Y[Communist-State_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_seize_power_gate_tt: "Vyhrajte generální stávku, aby vláda kapitulovala, nebo se nejprve odhodlejte k ozbrojenému boji." # todo: NEW TRANSLATION
 SIA_strike_momentum_tt: "§RTempo stávky [?strike_delta|0+]§! (nyní §Y[?ROOT.SIA_strike_momentum|0]§!/100). Při hodnotě 100 vláda kapituluje." # todo: NEW TRANSLATION
 SIA_general_strike_category: "Generální stávka" # todo: NEW TRANSLATION
 SIA_general_strike_category_desc: "Země se zastavila a hnutí tlačí na pád vlády. Zvyšte tempo stávky na 100 dříve, než uplyne 180 dní, a vláda kapituluje na pokojné cestě k moci. Pokud neuspějete, armáda stávku rozdrtí převratem.\n\n§RTempo stávky§!: [?ROOT.SIA_strike_momentum|0]/100" # todo: NEW TRANSLATION
 SIA_strike_mass_pickets: "Masové demonstrace" # todo: NEW TRANSLATION
 SIA_strike_mass_pickets_desc: "Postavte na hlídky desítky tisíc lidí a den za dnem udržujte náměstí. Levný a rychlý každodenní nástroj, který udržuje zemi ochromenou a zvyšuje tlak." # todo: NEW TRANSLATION
 SIA_strike_paralyze_transport: "Paralyzovat přístavy a železnice" # todo: NEW TRANSLATION
 SIA_strike_paralyze_transport_desc: "Financujte přístavní dělníky a železničáře ze stávkového fondu, dokud se do země ani z ní nic nepohybuje. Nejtěžší úder, který může hnutí zasadit, a také nejnákladnější na udržení." # todo: NEW TRANSLATION
 SIA_strike_win_the_conscripts: "Získat brance" # todo: NEW TRANSLATION
 SIA_strike_win_the_conscripts_desc: "Pošlete organizátory do kasáren. Každý branec, který nebude střílet do vlastních lidí, je jedním vojákem, na kterého generálové nemohou spoléhat, a kapitulace se přiblíží." # todo: NEW TRANSLATION
