l_english:
 charoenchai_hinthao: "Charoenchai Hinthao" # todo: NEW TRANSLATION
 charoenchai_hinthao_desc: "Velitel Královské thajské armády generace 20. let 21. století, který si vybudoval pověst na obranné doktríně a tvrdých lekcích z jižní hranice. Cvičí své jednotky, aby držely pozice a útočníka vykrvácely." # todo: NEW TRANSLATION
 songwit_noonpakdee: "Songwit Noonpakdee" # todo: NEW TRANSLATION
 songwit_noonpakdee_desc: "Vysoce postavený důstojník Královské thajské armády známý spíše štábní prací a organizací než okázalostí. Udržuje jednotky armády v plných stavech, zásobuje je a udržuje připravené; zároveň se dobře orientuje v politice spojené s vrchním velením." # todo: NEW TRANSLATION
 adung_phaniam: "Adung Phan-iam" # todo: NEW TRANSLATION
 adung_phaniam_desc: "Vlajkový důstojník moderního loďstva Královského thajského námořnictva, který se cítí jako doma mezi velkými válečnými loděmi a v doktríně hladinových operací. Prosazuje námořnictvo, jehož síla bude znát i za hranicemi Thajského zálivu." # todo: NEW TRANSLATION
 punpakdee_pattanakul: "Punpakdee Pattanakul" # todo: NEW TRANSLATION
 punpakdee_pattanakul_desc: "Důstojník Královského thajského letectva z reformní generace, který tlačí letectvo k profesionálním standardům, moderním letounům a výcvikovému systému, jenž produkuje letecké posádky místo přehlídkových útvarů." # todo: NEW TRANSLATION
 intel_chief_nia: "Ředitel Národní zpravodajské agentury" # todo: NEW TRANSLATION
 intel_chief_nia_desc: "Šéf thajské Národní zpravodajské agentury řídí civilní zpravodajské úsilí země a propojuje hlášení z provincií, hranic a palácové sítě do jediného obrazu pro vládu." # todo: NEW TRANSLATION
 thailand_focus: "Thajský strom zaměření" # todo: NEW TRANSLATION
 SIA_the_2001_election_shortcut: "Volby v roce 2001" # todo: NEW TRANSLATION
 SIA_lost_territories_shortcut: "Ztracená území" # todo: NEW TRANSLATION
 SIA_armed_forces_modernization_shortcut: "Modernizace ozbrojených sil" # todo: NEW TRANSLATION
 SIA_recover_from_97_crisis_shortcut: "Krize Tom Yum Kung" # todo: NEW TRANSLATION
 SIA_asean_centrality_shortcut: "Ústřední postavení ASEAN" # todo: NEW TRANSLATION
 SIA_the_southern_question_shortcut: "Jižní otázka" # todo: NEW TRANSLATION
 SIA_kra_gateway_shortcut: "Kra jako brána" # todo: NEW TRANSLATION
 SIA_recover_from_97_crisis: "Obnova po krizi Tom Yum Kung" # todo: NEW TRANSLATION
 SIA_recover_from_97_crisis_desc: "V roce 1997 začala v Bangkoku krize Tom Yum Kung. Poté, co Thajsko vyčerpalo své devizové rezervy při obraně pevného kurzu bahtu, bylo nuceno měnu nechat plavat a přijmout pohotovostní dohodu s MMF. Tento balíček udržel zemi solventní, ovšem za cenu vtíravého dohledu a ztráty ekonomické důstojnosti. Zbývá poslední krok: dokončit obnovu, předčasně splatit Fond a znovu získat plnou suverenitu." # todo: NEW TRANSLATION
 SIA_the_1997_constitution: "Lidová ústava" # todo: NEW TRANSLATION
 SIA_the_1997_constitution_desc: "Ústava z roku 1997 vzniká za bezprecedentní účasti veřejnosti a slibuje volený Senát, záruky lidských práv a silné protikorupční orgány. Zda přežije thajskou politiku, je ovšem jiná otázka." # todo: NEW TRANSLATION
 SIA_repay_the_imf: "Předčasně splatit MMF" # todo: NEW TRANSLATION
 SIA_repay_the_imf_desc: "Thajsko v červenci 2003 splatilo poslední část pohotovostního úvěru, o dva roky dříve, než bylo plánováno. Předčasné splacení není tolik otázkou jistiny jako signálu. Trhy přestanou thajský dluh oceňovat jako riziko záchranného balíčku a Království si znovu půjčuje levně." # todo: NEW TRANSLATION
 SIA_amazing_thailand: "Úžasné Thajsko" # todo: NEW TRANSLATION
 SIA_amazing_thailand_desc: "Turistická kampaň, která nás provedla krizovými lety, se stává národní strategií. Od Phuketu po Chiang Mai zveme celý svět do Země úsměvů a svět platí tvrdou měnou." # todo: NEW TRANSLATION
 SIA_rice_and_rubber: "Rýžová mísa Asie" # todo: NEW TRANSLATION
 SIA_rice_and_rubber_desc: "Thajsko je předním světovým vývozcem rýže a gumárenskou velmocí. Modernizujme zemědělské hospodářství Isánu a jihu a přeměňme zemědělskou sílu v příjmy z vývozu." # todo: NEW TRANSLATION
 SIA_detroit_of_asia: "Detroit Asie" # todo: NEW TRANSLATION
 SIA_detroit_of_asia_desc: "Japonští a američtí výrobci automobilů učinili z východního pobřeží svou regionální tovární základnu. Posilme automobilový průmysl a udělejme z označení „vyrobeno v Thajsku“ globální standard." # todo: NEW TRANSLATION
 SIA_suvarnabhumi_airport: "Letiště Suvarnabhumi" # todo: NEW TRANSLATION
 SIA_suvarnabhumi_airport_desc: "Nové bangkokské letiště, plánované po desetiletí, se stane velkým leteckým uzlem jihovýchodní Asie. Provinční brány jako Phuket do něj přivádějí dopravu a pozvedají thajské letectví jako celek, pokud se nám podaří stavbu dokončit." # todo: NEW TRANSLATION
 SIA_eastern_economic_corridor: "Východní pobřeží" # todo: NEW TRANSLATION
 SIA_eastern_economic_corridor_desc: "Prohlubme průmyslový koridor od Chonburi po Rayong pomocí přístavů, rafinerií, továren a železnic. Strojovna thajské ekonomiky." # todo: NEW TRANSLATION
 SIA_medical_hub: "Asijské zdravotnické centrum" # todo: NEW TRANSLATION
 SIA_medical_hub_desc: "Nemocnice světové úrovně za ceny rozvojového světa. Zdravotní turistika přivádí pacienty i prestiž z celého světa." # todo: NEW TRANSLATION
 SIA_education_for_the_future: "Vzdělávání Království" # todo: NEW TRANSLATION
 SIA_education_for_the_future_desc: "Thajské učebny stále upřednostňují memorování před řešením problémů a kvalita učitelů se mezi Bangkokem a provinciemi výrazně liší. Moderní osnovy, lépe vyškolení učitelé a odborné obory odpovídající potřebám průmyslu jsou základem každého úsilí o přechod k vysokopříjmové ekonomice." # todo: NEW TRANSLATION
 SIA_asean_centrality: "Ústřední postavení ASEAN" # todo: NEW TRANSLATION
 SIA_asean_centrality_desc: "Bangkok byl místem založení ASEAN v roce 1967. Znovu investujme do sousedství, protože stabilní a přátelská jihovýchodní Asie je nejlepší bezpečnostní zárukou Thajska." # todo: NEW TRANSLATION
 SIA_treaty_ally: "Významný spojenec mimo NATO" # todo: NEW TRANSLATION
 SIA_treaty_ally_desc: "Nejstarší americké smluvní spojenectví v Asii. Prohlubme Cobra Gold, přivítejme americkou techniku a využívejme bezpečnostní záruky, dokud trvají." # todo: NEW TRANSLATION
 SIA_bamboo_bends_east: "Bambus se sklání na východ" # todo: NEW TRANSLATION
 SIA_bamboo_bends_east_desc: "Thajská diplomacie se sklání podle větru a ten vane z Pekingu. Čínské investice, čínské železnice, čínské trhy — vše za cenu, o níž se stále vyjednává." # todo: NEW TRANSLATION
 SIA_the_2001_election: "Volby v roce 2001" # todo: NEW TRANSLATION
 SIA_the_2001_election_desc: "První volby podle Lidové ústavy. Krize rozbila starý konsenzus. O směr národa nyní soupeří nové populistické síly, tradiční mocenská síť a Demokraté." # todo: NEW TRANSLATION
 SIA_thai_rak_thai: "Thai Rak Thai" # todo: NEW TRANSLATION
 SIA_thai_rak_thai_desc: "Thajci milují Thajce. Vítězství Thaksina Šinavatry překresluje volební mapu. O tom, kdo bude vládnout, nyní rozhoduje venkovský sever a severovýchod — a ty si zvolily svého šampiona." # todo: NEW TRANSLATION
 SIA_thaksinomics: "Thaksinonomika" # todo: NEW TRANSLATION
 SIA_thaksinomics_desc: "Dvoustopá ekonomika. První trať upřednostňuje globální vývoz a druhá místní a domácí podnikání. Tento přístup posiluje růst, kritici však tvrdí, že prohlubuje rozdíl mezi bohatými a chudými." # todo: NEW TRANSLATION
 SIA_30_baht_healthcare: "Zdravotnictví za 30 bahtů" # todo: NEW TRANSLATION
 SIA_30_baht_healthcare_desc: "Jakákoli nemoc, jakákoli nemocnice, třicet bahtů. Univerzální pokrytí mění životy milionů venkovských Thajců a upevňuje jejich loajalitu ke straně Šinavatry." # todo: NEW TRANSLATION
 SIA_village_fund: "Milionbahtový vesnický fond" # todo: NEW TRANSLATION
 SIA_village_fund_desc: "Milion bahtů revolvingového mikroúvěru pro každou vesnici a městskou komunitu v Království — jeden z největších mikrofinančních programů, o jaký se kdy kdo pokusil." # todo: NEW TRANSLATION
 SIA_otop: "Jeden tambon, jeden produkt" # todo: NEW TRANSLATION
 SIA_otop_desc: "Každý podokres vyvíjí, značkuje a vyváží charakteristický místní produkt. Domácí výroba se stává národní strategií." # todo: NEW TRANSLATION
 SIA_dual_track_economy: "Dvoustopá ekonomika" # todo: NEW TRANSLATION
 SIA_dual_track_economy_desc: "Vývoz roste, příjmy venkova rostou, dluh je splacen předčasně. Ať už kritici říkají o způsobu provedení cokoli, výsledková tabule hraje ve prospěch vlády." # todo: NEW TRANSLATION
 SIA_war_on_drugs: "Válka proti drogám" # todo: NEW TRANSLATION
 SIA_war_on_drugs_desc: "Tříměsíční kampaň s cílem rozbít obchod s metamfetaminem. Bude populární. Zároveň přitáhne vážnou pozornost ochránců lidských práv, která bude vládu pronásledovat po celé roky." # todo: NEW TRANSLATION
 SIA_ceo_premier: "Premiér jako generální ředitel" # todo: NEW TRANSLATION
 SIA_ceo_premier_desc: "Řídit zemi jako společnost. Klíčové ukazatele výkonnosti pro ministerstva, zasedání vlády v provinciích, netrpělivost s byrokracií. Efektivní, ale rozkladné pro každou instituci, jejímž úkolem je říkat ne." # todo: NEW TRANSLATION
 SIA_dominant_party_state: "Jedna strana, jedno Thajsko" # todo: NEW TRANSLATION
 SIA_dominant_party_state_desc: "Pohlcujme koaliční partnery, ovládněme vysílání, vyhrajme každé doplňovací volby. Volební politika pokračuje, ale existuje jen jedna naprosto převládající volba." # todo: NEW TRANSLATION
 SIA_consolidate_democracy: "Upevnit demokracii" # todo: NEW TRANSLATION
 SIA_consolidate_democracy_desc: "Získejme moc prostřednictvím hlasovacích lístků, udržme si ji výsledky a ponechme instituce stát. Populistický stroj se podřizuje Lidové ústavě." # todo: NEW TRANSLATION
 SIA_normalization_friction: "Tření při normalizaci" # todo: NEW TRANSLATION
 SIA_normalization_friction_desc: "Klientelistické sítě starého stroje se nerozpustí podle plánu. Odmítají deregistraci, i když se strana vydává přímou cestou." # todo: NEW TRANSLATION
 SIA_thaksin_forever: "Thaksin navždy" # todo: NEW TRANSLATION
 SIA_thaksin_forever_desc: "Opozice je bezvýznamná, soudy jsou koupené a Senát loajální. Proč by měl tento projekt někdy skončit? Dominantní strana se stává stranou trvalou." # todo: NEW TRANSLATION
 SIA_shinawatra_dynasty: "Dynastie Šinavatrových" # todo: NEW TRANSLATION
 SIA_shinawatra_dynasty_desc: "Hnutí přežije každého jednotlivého vůdce. Tvář strany se může změnit na sestru či dceru, skutečná moc však stále patří Thaksinu Šinavatrovi a jeho lidem." # todo: NEW TRANSLATION
 SIA_the_old_order: "Síťová monarchie" # todo: NEW TRANSLATION
 SIA_the_old_order_desc: "Palác, armáda, soudnictví, byrokracie. To jsou instituce, které vedly Thajsko každou bouří. Sedm desetiletí otřesů nepřežily tím, že by nechaly volby rozhodovat o všem." # todo: NEW TRANSLATION
 SIA_privy_council: "Královská rada" # todo: NEW TRANSLATION
 SIA_privy_council_desc: "Královi poradci, penzionovaní generálové, soudci a státníci sedí v tichém středu sítě establishmentu. Posilme kanály, které obcházejí volenou vládu." # todo: NEW TRANSLATION
 SIA_sufficiency_economy: "Ekonomika soběstačnosti" # todo: NEW TRANSLATION
 SIA_sufficiency_economy_desc: "Královská rozvojová filozofie umírněnosti, odolnosti a imunity vůči otřesům. Promyšlený protipól populistickému růstu poháněnému dluhem." # todo: NEW TRANSLATION
 SIA_royal_guidance: "Královo slovo" # todo: NEW TRANSLATION
 SIA_royal_guidance_desc: "Každý prosinec král promlouvá a národ naslouchá. Narozeninový projev může vládě požehnat nebo jí tiše své požehnání odepřít — je to síla respektu, proti níž se žádný volební lístek ani ministr neodváží bojovat. Hlas trůnu stahuje zemi zpět z politického šílenství." # todo: NEW TRANSLATION
 SIA_three_pillars: "Národ, náboženství, král" # todo: NEW TRANSLATION
 SIA_three_pillars_desc: "Chat, Sasana, Phra Maha Kasat — tříbarevná vlajka proměněná v občanský katechismus. Mniši ve školách, král na každé zdi, národ jako jediné morální tělo. Je to mocné pojivo, s výjimkou míst, kde jsou mešity plné a katechismus působí jako zavřené dveře." # todo: NEW TRANSLATION
 SIA_yellow_shirts: "Shromáždění Lidové aliance" # todo: NEW TRANSLATION
 SIA_yellow_shirts_desc: "Lidová aliance pro demokracii zaplňuje ulice Bangkoku královskou žlutí a požaduje odstranění zvolené vlády. Městská střední třída si zvolila svou stranu." # todo: NEW TRANSLATION
 SIA_the_2006_coup: "Zářijový převrat" # todo: NEW TRANSLATION
 SIA_the_2006_coup_desc: "Zatímco je premiér v zahraničí, do Bangkoku vjíždějí tanky. Ústava je pozastavena a Rada pro demokratickou reformu přebírá kontrolu. Cyklus začíná znovu." # todo: NEW TRANSLATION
 SIA_guardian_of_the_nation: "Strážce národa" # todo: NEW TRANSLATION
 SIA_guardian_of_the_nation_desc: "Sebeobraz armády proměněný v doktrínu. Nad politikou, přesto oprávněná ukončit jakoukoli politiku, která ohrožuje národ. Institucionalizujme vojenské veto." # todo: NEW TRANSLATION
 SIA_judicial_activism: "Judicializace" # todo: NEW TRANSLATION
 SIA_judicial_activism_desc: "Proč posílat tanky, když postačí soudní rozhodnutí? Rozpouštění stran a zbavování funkcí se stává skalpelem establishmentu." # todo: NEW TRANSLATION
 SIA_the_2014_coup: "Národní rada pro mír a pořádek" # todo: NEW TRANSLATION
 SIA_the_2014_coup_desc: "Nejprve stanné právo, potom převrat. Národní rada pro mír a pořádek pozastavuje politiku na neurčito — náprava postojů pro celou zemi." # todo: NEW TRANSLATION
 SIA_lese_majeste_enforcement: "Bránit posvátnou instituci" # todo: NEW TRANSLATION
 SIA_lese_majeste_enforcement_desc: "Článek 112 trestního zákoníku chrání monarchii před urážkami. Vymáhejme jej bez omezení a sledujme, jak každé opoziční hnutí váží svá slova." # todo: NEW TRANSLATION
 SIA_isoc_state: "Stát ISOC" # todo: NEW TRANSLATION
 SIA_isoc_state_desc: "Velitelství operací vnitřní bezpečnosti, politické rameno armády v každé provincii, se stává paralelní vládou pro otázky „bezpečnosti“, především na hlubokém jihu." # todo: NEW TRANSLATION
 SIA_isoc_overreach_backlash: "Tichý veřejný neklid" # todo: NEW TRANSLATION
 SIA_isoc_overreach_backlash_desc: "Aparát vnitřní bezpečnosti zasahuje do každodenního života dál než jen na hlubokém jihu. Obyčejní Thajci si toho začínají všímat a příliš se jim to nelíbí." # todo: NEW TRANSLATION
 SIA_the_2017_constitution: "Řízená demokracie" # todo: NEW TRANSLATION
 SIA_the_2017_constitution_desc: "Plně jmenovaný Senát, ustanovení umožňující nevoleného premiéra a dvacetiletá národní strategie zavazující budoucí vlády. Volby se vrátí, ale uvnitř klece." # todo: NEW TRANSLATION
 SIA_perpetual_guardianship: "Trvalé opatrovnictví" # todo: NEW TRANSLATION
 SIA_perpetual_guardianship_desc: "Formalizujme to, co bylo vždy jen implicitní. Ozbrojené síly se stanou stálým ústavním rozhodčím. Stabilita, svého druhu, navždy." # todo: NEW TRANSLATION
 SIA_royal_restoration: "Obnova trůnu" # todo: NEW TRANSLATION
 SIA_royal_restoration_desc: "Zajděme dál než kterákoli vláda před námi. Shromážděme vlákna sítě a formálně je vložme do rukou paláce. Dynastie Chakri obnoví přímou správu říše." # todo: NEW TRANSLATION
 SIA_seeds_of_reform: "Semena reformy" # todo: NEW TRANSLATION
 SIA_seeds_of_reform_desc: "Mimo staré rozdělení na populisty a royalisty se shromažďuje třetí síla. Mladá, městská, online a unavená z převratů." # todo: NEW TRANSLATION
 SIA_future_forward: "Budoucnost vpřed" # todo: NEW TRANSLATION
 SIA_future_forward_desc: "Nová strana politiků, kteří kandidují poprvé, slibuje prolomit tento cyklus. Demilitarizovat, decentralizovat, demokratizovat. Establishment sahá po svých obvyklých nástrojích, ale cíl se pohybuje." # todo: NEW TRANSLATION
 SIA_three_demands: "Tři požadavky" # todo: NEW TRANSLATION
 SIA_three_demands_desc: "Rozpusťte parlament. Přestaňte zastrašovat lid a sepište novou ústavu. Studenti nahlas říkají to, co dříve nebylo možné vyslovit, a strop thajské politiky se posouvá." # todo: NEW TRANSLATION
 SIA_demilitarize_politics: "Vojáci pryč z politiky" # todo: NEW TRANSLATION
 SIA_demilitarize_politics_desc: "Ukončeme zneužívání branné povinnosti, omezme mediální říše a místa v představenstvech generálů a vyškrtněme armádu z politiky. Nebudou nám za to vděční." # todo: NEW TRANSLATION
 SIA_civilian_control: "Nadvláda civilistů" # todo: NEW TRANSLATION
 SIA_civilian_control_desc: "Ministerstvo obrany vedené civilisty, povýšení přezkoumávaná parlamentem a vojenský rozpočet podléhající auditorům. Radikální pouze v Bangkoku." # todo: NEW TRANSLATION
 SIA_amend_section_112: "Pozměnit článek 112" # todo: NEW TRANSLATION
 SIA_amend_section_112_desc: "Reformujme zákon o urážce majestátu. Omezme, kdo může podávat stížnosti, zastropujme tresty a ukončeme jeho používání proti politickému projevu. Považován za nejnebezpečnější návrh zákona v Thajsku, možná neexistuje cesta vpřed ani cesta zpět." # todo: NEW TRANSLATION
 SIA_decentralize: "Za hranice Bangkoku" # todo: NEW TRANSLATION
 SIA_decentralize_desc: "Volení guvernéři pro každou provincii a rozpočty, které neprocházejí hlavním městem. Bangkok byl celou zemí příliš dlouho." # todo: NEW TRANSLATION
 SIA_break_the_monopolies: "Rozbít monopoly" # todo: NEW TRANSLATION
 SIA_break_the_monopolies_desc: "Duopoly v oblasti alkoholu, telekomunikační koncese, křížové vlastnictví konglomerátů. Otevřme úzká hrdla thajské ekonomiky a pusťme dovnitř spravedlivou konkurenci." # todo: NEW TRANSLATION
 SIA_welfare_state: "Thajský sociální stát" # todo: NEW TRANSLATION
 SIA_welfare_state_desc: "Od směsice dotací ke skutečné záchranné síti důchodů, péče o děti a pojištění v nezaměstnanosti. Drahé — a žádná vláda po této se neodváží systém zrušit." # todo: NEW TRANSLATION
 SIA_marriage_equality: "První v jihovýchodní Asii" # todo: NEW TRANSLATION
 SIA_marriage_equality_desc: "Rovnost v manželství se stává zákonem, jako první v jihovýchodní Asii. Reforma, které si všimne celý svět, a vzácná věc, proti níž establishment nebojuje." # todo: NEW TRANSLATION
 SIA_deep_south_peace: "Mír na hlubokém jihu" # todo: NEW TRANSLATION
 SIA_deep_south_peace_desc: "Autonomie v rámci Království, spravedlnost za minulé zneužívání, respekt k identitě Patani-Malajců. Povstání skončí u vyjednávacího stolu, ne na kontrolním stanovišti." # todo: NEW TRANSLATION
 SIA_consolidated_democracy: "Upevněná demokracie" # todo: NEW TRANSLATION
 SIA_consolidated_democracy_desc: "Ústava sepsaná občany, vojáci v kasárnách, soudy, které soudí a nevládnou. Cyklus převratů je prolomen a konečně učiněn nemyslitelným." # todo: NEW TRANSLATION
 SIA_reform_transition_costs: "Daňová základna v přechodu" # todo: NEW TRANSLATION
 SIA_reform_transition_costs_desc: "Přebudování institucí znamená přebudování způsobu jejich financování. Výběr příjmů zaostává za novým systémem, než se usadí." # todo: NEW TRANSLATION
 SIA_a_new_republic: "Nová republika" # todo: NEW TRANSLATION
 SIA_a_new_republic_desc: "Otázka, kterou nikdy nebylo dovoleno položit, je předložena k hlasování. Ať už bude výsledek jakýkoli, Thajsko, které se vynoří, bude k nepoznání — pokud vůbec zůstane pohromadě." # todo: NEW TRANSLATION
 SIA_lost_territories: "Ztracená území" # todo: NEW TRANSLATION
 SIA_lost_territories_desc: "1893. 1904. 1907. 1909. Každé thajské dítě se ve škole učí data, kdy Siam rozparcelovaly Francie a Británie. Phibunova generace kdysi pochodovala, aby je získala zpět. Mapy jsou stále v archivech." # todo: NEW TRANSLATION
 SIA_pan_thai_movement: "Jedna tajská rasa" # todo: NEW TRANSLATION
 SIA_pan_thai_movement_desc: "Obnovme velkou tezi Wichita Wathakana. Thajci, Laosané, Šanové — jeden tajský lid rozdělený koloniálními hranicemi, čekající na sjednocení pod thajskou vlajkou." # todo: NEW TRANSLATION
 SIA_rearmament: "Přezbrojit Království" # todo: NEW TRANSLATION
 SIA_rearmament_desc: "Ambice vyžaduje ocel. Zvyšte rozpočet na obranu nad cokoli, co auditoři kdy viděli, a uveďte průmysl Království na válečnou základnu." # todo: NEW TRANSLATION
 SIA_modernize_the_rta: "Modernizovat Královskou thajskou armádu" # todo: NEW TRANSLATION
 SIA_modernize_the_rta_desc: "Nové hlavní bojové tanky, nová bojová vozidla pěchoty, profesionální vojáci namísto branců vybraných loterií. Královská thajská armáda se připravuje na války přesahující povinnost provádět převraty." # todo: NEW TRANSLATION
 SIA_blue_water_navy: "Námořnictvo dvou oceánů" # todo: NEW TRANSLATION
 SIA_blue_water_navy_desc: "Letadlová loď Chakri Naruebet konečně dostane skutečné letecké křídlo a skutečný doprovod a program ponorek přestane být terčem vtipů. Dvě pobřeží, dvě loďstva." # todo: NEW TRANSLATION
 SIA_gripen_squadrons_rearm: "Mír Suvarnabhumi" # todo: NEW TRANSLATION
 SIA_gripen_squadrons_rearm_desc: "Gripeny, letouny včasné výstrahy, síťově propojená protivzdušná obrana. Malé letectvo vybudované tak, aby vyhrálo první týden regionální války." # todo: NEW TRANSLATION
 SIA_dti_self_reliance: "Soběstačnost DTI" # todo: NEW TRANSLATION
 SIA_dti_self_reliance_desc: "Ústav obranných technologií přechází od výzkumných prací k výrobním linkám. Thajské pušky, thajské obrněnce, thajské rakety — a žádné embargo nezastaví to, co si vyrobíme sami." # todo: NEW TRANSLATION
 SIA_thai_yai: "Naši bratři Tai Yai" # todo: NEW TRANSLATION
 SIA_thai_yai_desc: "Šanové z Barmy mluví jazykem, kterému každý Thajec rozumí. Jejich milice bojují proti Rangúnu po celé generace. Chybí jim pouze patron a vlajka, pod níž by bojovali." # todo: NEW TRANSLATION
 SIA_mekong_destiny: "Osud na Mekongu" # todo: NEW TRANSLATION
 SIA_mekong_destiny_desc: "Sainyabuli a Champasak byly ještě v živé paměti siamské a Laosané jsou nejbližšími příbuznými Thajců. Řeka, která nás rozděluje, by mohla protékat jedinou zemí." # todo: NEW TRANSLATION
 SIA_preah_vihear: "Chrám patří nám" # todo: NEW TRANSLATION
 SIA_preah_vihear_desc: "Rozhodnutí Mezinárodního soudního dvora o Preah Vihear z roku 1962 stále pálí. Battambang a Siem Reap byly ještě v živé paměti pod thajskou vlajkou. Hraniční spory s Phnompenhem přestávají být řízeny a začínají být využívány." # todo: NEW TRANSLATION
 SIA_lost_sultanates: "Smlouva z roku 1909 je neplatná" # todo: NEW TRANSLATION
 SIA_lost_sultanates_desc: "Kelantan, Terengganu, Kedah, Perlis. Vazalská území Bangkoku byla postoupena Britskému impériu, aniž by se kdokoli z jejich obyvatel mohl vyjádřit. Odsuďte anglo-siamskou smlouvu." # todo: NEW TRANSLATION
 SIA_suwannaphum: "Sjednocená Suwannaphum" # todo: NEW TRANSLATION
 SIA_suwannaphum_desc: "Suwannaphum, Zlatá země dávnověku, je znovu sjednocena pod thajskou vlajkou. Zahajte začleňování znovuzískaných území do Království." # todo: NEW TRANSLATION
 SIA_victory_monument: "Nový Památník vítězství" # todo: NEW TRANSLATION
 SIA_victory_monument_desc: "Obelisk na ulici Ratchawithi uctívá padlé z let 1940–41, poslední války o ztracená území. Postavte jeho nástupce a nechte region, aby si vyvodil vlastní závěry." # todo: NEW TRANSLATION
 SIA_thailand_4_0: "Thajsko 4.0" # todo: NEW TRANSLATION
 SIA_thailand_4_0_desc: "Přidaná hodnota ve všem. Robotika, biotechnologie, digitální služby. Čtvrtá průmyslová revoluce plánovaná z vládního paláce a ověřená ve Východním ekonomickém koridoru. Každá provincie získá podíl na růstu produktivity díky zavedení národní strategie." # todo: NEW TRANSLATION
 SIA_three_airport_rail: "Železnice spojující tři letiště" # todo: NEW TRANSLATION
 SIA_three_airport_rail_desc: "Don Mueang, Suvarnabhumi a U-Tapao, všechna propojená jedinou vysokorychlostní tratí, která urazí celou trasu za hodinu. Jde o nejdražší železnici v thajských dějinách a páteř EEC." # todo: NEW TRANSLATION
 SIA_u_tapao_aerotropolis: "Aerotropolie U-Tapao" # todo: NEW TRANSLATION
 SIA_u_tapao_aerotropolis_desc: "Námořní letiště z období války ve Vietnamu se promění v bránu pro 60 milionů cestujících, s údržbářskými hangáry, bezcelní zónou a prosperujícím městem vybudovaným kolem existence ranveje." # todo: NEW TRANSLATION
 SIA_eastern_aviation_city: "Východní letecké město" # todo: NEW TRANSLATION
 SIA_eastern_aviation_city_desc: "Ranvej byla teprve začátek. Airbus a Thai Airways vloží do bezcelní zóny komplex pro údržbu a generální opravy, letecká akademie vyškolí mechaniky a nákladní terminály promění U-Tapao v leteckou dílnu regionu stejně jako v jeho bránu. Práce s vysokou přidanou hodnotou, ale náročná na zajištění dostatku pracovníků." # todo: NEW TRANSLATION
 SIA_eec_take_off: "Koridor startuje" # todo: NEW TRANSLATION
 SIA_eec_take_off_desc: "Továrny na elektromobily v Rayongu, biotechnologie v Chonburi, avionika v Chachoengsao. Východní ekonomický koridor přestává být plánem a stává se regionem." # todo: NEW TRANSLATION
 SIA_hedge_the_bets: "Pojistit si všechny možnosti" # todo: NEW TRANSLATION
 SIA_hedge_the_bets_desc: "Bambus se ohýbá ve větru a pak se narovná. Ať už si Washington nebo Peking myslí, že Thajsko něco slíbilo, Thajsko neslíbilo nic, co by nemohlo později vyložit jinak." # todo: NEW TRANSLATION
 SIA_armed_forces_modernization: "Thajské královské ozbrojené síly" # todo: NEW TRANSLATION
 SIA_armed_forces_modernization_desc: "Armáda, námořnictvo a letectvo pod jednou korunou, meč a štít Království. Krize z roku 1997 zmrazila nákupy uprostřed procesu a zanechala po sobě napůl dodané letky a letadlovou loď bez letadel. Uchopme ozbrojené síly pevně do rukou a určeme směr, kterým se budou ubírat příští desetiletí." # todo: NEW TRANSLATION
 SIA_gripen_deal: "Dohoda o Gripenech" # todo: NEW TRANSLATION
 SIA_gripen_deal_desc: "Saab nabízí to, co Washington ne. Součástí balíčku je úplný převod technologií, průmyslové kompenzace a letoun včasné výstrahy Erieye, navíc bez přednášek o převratech." # todo: NEW TRANSLATION
 SIA_gripen_ef_program: "Gripen E/F" # todo: NEW TRANSLATION
 SIA_gripen_ef_program_desc: "F-35 byl odmítnut a F-16 jsou starší než jejich piloti. Gripen E/F nové generace zachová ekosystém, který thajské posádky již znají, a udrží švédskou výrobní linku v chodu." # todo: NEW TRANSLATION
 SIA_eyes_in_the_sky: "Oči na obloze" # todo: NEW TRANSLATION
 SIA_eyes_in_the_sky_desc: "Izraelské bezpilotní systémy Searcher, Hermes a Dominator poskytnou thajským velitelům to, co jim džungle a hranice vždy upíraly. Trvalý dohled." # todo: NEW TRANSLATION
 SIA_chinese_steel: "Čínská ocel" # todo: NEW TRANSLATION
 SIA_chinese_steel_desc: "VT-4 od NORINCO stojí polovinu toho, co západní tank, a přichází bez kázání o koncovém uživateli. Americké M60 thajské armády stárnou a její dodavatelé se přesouvají na východ." # todo: NEW TRANSLATION
 SIA_s26t_program: "Ponorka S26T" # todo: NEW TRANSLATION
 SIA_s26t_program_desc: "Byly slíbeny tři čluny třídy Yuan. Možná dorazí jeden. Mezi německými motory, které nelze vyvézt, a rozpočty, jež nelze obhájit, ponorkový sen námořnictva pokouší trpělivost všech." # todo: NEW TRANSLATION
 SIA_chakri_modernization: "Západní modernizace vlajkové lodi" # todo: NEW TRANSLATION
 SIA_chakri_modernization_desc: "Západní cesta pokračuje na palubě vlajkové lodi. HTMS Chakri Naruebet, postavená ve Španělsku a dlouho kotvící v Sattahipu, dostane americké a evropské bojové systémy a senzory. Přestavba podle standardů NATO konečně poskytne královské letadlové lodi úkol hodný její posádky." # todo: NEW TRANSLATION
 SIA_uxv_carrier_conversion: "Západní bezpilotní křídlo" # todo: NEW TRANSLATION
 SIA_uxv_carrier_conversion_desc: "Harriery jsou muzejní exponáty, ale skokanský můstek zůstává. Pomocí západních bezpilotních systémů zakoupených od spojeneckých výrobců přestavíme vlajkovou loď tak, aby vypouštěla bezpilotní letouny, hladinová plavidla a podvodní prostředky. První nosič UXV v jihovýchodní Asii, vybavený technikou partnerů." # todo: NEW TRANSLATION
 SIA_telecom_empire: "Telekomunikační koncese" # todo: NEW TRANSLATION
 SIA_telecom_empire_desc: "Satelity, mobilní sítě a mediální impérium, to vše pozoruhodně prosperuje pod vládou telekomunikačních magnátů. Hranice mezi národním šampionem a rodinným podnikem nikdy nebyla tenčí." # todo: NEW TRANSLATION
 SIA_prayuth_premiership: "Generálovo premiérství" # todo: NEW TRANSLATION
 SIA_prayuth_premiership_desc: "Vůdce převratu vymění uniformu za oblek a titul junty za volenou funkci. 250 jmenovaných senátorů, kteří hlasují o premiérovi, činí aritmetiku pohodlnou." # todo: NEW TRANSLATION
 SIA_senate_of_appointees: "Senát jmenovaných" # todo: NEW TRANSLATION
 SIA_senate_of_appointees_desc: "Dvě stě padesát senátorů, každý vybraný vojenskou radou, každý s hlasem o tom, kdo bude vládnout. Opozice může vyhrát volby. Získat moc je něco jiného." # todo: NEW TRANSLATION
 SIA_2020_protest_response: "Mládež v ulicích" # todo: NEW TRANSLATION
 SIA_2020_protest_response_desc: "Studenti zaplavují památníky se třemi požadavky a pozdravem se třemi prsty. Každá možnost, ať už rozehnání, dialog nebo odklad, naučí další generaci něco o státu." # todo: NEW TRANSLATION
 SIA_orange_wave: "Oranžová vlna" # todo: NEW TRANSLATION
 SIA_orange_wave_desc: "Nová politická generace se organizuje online, financuje se z drobných darů a na staré klientelistické sítě pohlíží jako na problém, který je třeba odstranit, nikoli zdědit." # todo: NEW TRANSLATION
 SIA_digital_democracy: "Digitální demokracie" # todo: NEW TRANSLATION
 SIA_digital_democracy_desc: "Otevřená data, online služby, stát, který odpovídá na e-maily. Transparentnost jako infrastruktura, a infrastrukturu na rozdíl od slibů nelze snadno zrušit." # todo: NEW TRANSLATION
 SIA_creative_economy: "Kreativní ekonomika" # todo: NEW TRANSLATION
 SIA_creative_economy_desc: "Film, jídlo, festivaly, design. Thajská měkká síla se stává vývozním odvětvím s pozorností ministerstva a vlastní položkou v rozvaze." # todo: NEW TRANSLATION
 SIA_truth_and_reconciliation: "Pravda a usmíření" # todo: NEW TRANSLATION
 SIA_truth_and_reconciliation_desc: "Mrtví z války proti drogám, represe, zmizelí z hlubokého jihu. Komise s pravomocí předvolávat svědky sepíše oficiální zprávu, protože demokracie si vede vlastní záznamy." # todo: NEW TRANSLATION
 SIA_the_2005_landslide: "Vítězství se 377 mandáty" # todo: NEW TRANSLATION
 SIA_the_2005_landslide_desc: "Thai Rak Thai získává 377 z 500 parlamentních křesel, největší většinu jedné strany v thajských dějinách. Síť starého establishmentu mlčky sleduje sčítání hlasů." # todo: NEW TRANSLATION
 SIA_rice_pledging_scheme: "Program výkupu rýže" # todo: NEW TRANSLATION
 SIA_rice_pledging_scheme_desc: "Vlajkový venkovský program vlády Yingluck nechává stát vykupovat rýži od zemědělců za ceny nad úrovní trhu a skladovat ji. Vesnice profitují. Státní pokladna závisí na spolupráci světových cen." # todo: NEW TRANSLATION
 SIA_red_shirts_mobilized: "Ulice za volební urnou" # todo: NEW TRANSLATION
 SIA_red_shirts_mobilized_desc: "Vyveďme venkovskou základnu do ulic. Sítě rudých košil napříč severovýchodem pochodují ve statisících, ale populistický dav plnící hlavní město generály nezastraší. Znepokojí palác i vrchní velení a poskytne jim záminku. Konfrontace, která skončí tanky před vládní budovou, se blíží. §RCoup risk rises.§!" # todo: NEW TRANSLATION
 SIA_heartland_development: "Rozvoj rudého srdce země" # todo: NEW TRANSLATION
 SIA_heartland_development_desc: "Vesnice Isaanu a severu přinesly drtivé vítězství a nyní za něj dostávají politiku. Nové silnice a železnice se táhnou přes plošinu Khorat i do údolí Chiang Mai a provinční úřady přinášejí správu i pracovní místa tam, kde skutečně žije základna hnutí, nikoli do hlavního města, které pro něj nikdy nehlasovalo." # todo: NEW TRANSLATION
 SIA_crown_property_bureau: "Úřad královského majetku" # todo: NEW TRANSLATION
 SIA_crown_property_bureau_desc: "Úřad spravuje miliardy v královském majetku, od hotelů přes nemovitosti až po významné průmyslové podíly. Uvést tyto výnosy do služeb národního rozvoje vyžaduje tichá jednání na nejvyšší úrovni." # todo: NEW TRANSLATION
 SIA_eastern_tigers: "Východní tygři" # todo: NEW TRANSLATION
 SIA_eastern_tigers_desc: "2. armádní oblast a obrněné jednotky, Burapha Phayak, Tygři východu. Jejich loajalita je šlachou royalistického státu a jejich velitelé představují další generaci generálů." # todo: NEW TRANSLATION
 SIA_buddhist_nationalism: "Buddhistický národ" # todo: NEW TRANSLATION
 SIA_buddhist_nationalism_desc: "Junta přijímá mnichy jako partnery společenského řádu. Šafránová roucha při státních obřadech, buddhismus ve školních osnovách a tiché povýšení Sanghy na morální autoritu. Hluboký jih to nepřijme tiše." # todo: NEW TRANSLATION
 SIA_royal_succession_managed: "Předání vlády" # todo: NEW TRANSLATION
 SIA_royal_succession_managed_desc: "Palác a vláda připravují přechod několik let dopředu, jako institucionální předání namísto šoku. Když Devátá vláda skončí, barami přejde neporušená, místo aby se zhroutila do své nejslabší podoby, období smutku se zkrátí a monarchistický establishment se sjednotí za novým trůnem. Řízený přechod stojí méně než alternativa." # todo: NEW TRANSLATION
 SIA_conscription_abolished: "Profesionální armáda" # todo: NEW TRANSLATION
 SIA_conscription_abolished_desc: "Ukončete povinnou vojenskou službu. Dobrovolnické síly budou menší, lépe placené a lépe vycvičené a svou loajalitu budou dlužit Ústavě, nikoli generálům, kteří je odvedli." # todo: NEW TRANSLATION
 SIA_open_skies_open_borders: "Otevřené nebe, otevřené hranice" # todo: NEW TRANSLATION
 SIA_open_skies_open_borders_desc: "Liberalizujte přistávací práva, zjednodušte vízová pravidla a nechte aerolinky soutěžit. Turisté, kteří přijedou, přinesou peníze, a pracovníci, kteří přijdou, přinesou dovednosti. Hranice je největším aktivem Thajska, přestaňme s ní proto zacházet jako s pevností." # todo: NEW TRANSLATION
 SIA_chao_phraya_megaprojects: "Protipovodňová ochrana Chao Phraya a zelená energie" # todo: NEW TRANSLATION
 SIA_chao_phraya_megaprojects_desc: "Řeka, která dvakrát zaplavila hlavní město, bude zkrocena retenčními nádržemi, protipovodňovými bariérami a řetězcem průtočných turbín. Projekt je drahý. Další velká povodeň nikoli." # todo: NEW TRANSLATION
 SIA_asean_customs_window: "Jednotné celní okno ASEAN" # todo: NEW TRANSLATION
 SIA_asean_customs_window_desc: "Harmonizujte celní deklarace, bezpečnostní osvědčení a rostlinolékařská pravidla napříč členskými státy sdružení. Kamion z Chiang Rai do Kuala Lumpur projede méně okénky než dříve." # todo: NEW TRANSLATION
 SIA_the_southern_question: "Jižní otázka" # todo: NEW TRANSLATION
 SIA_the_southern_question_desc: "Pattani, Yala a Narathiwat doutnají povstáním už celou generaci. Pálení mešit, stínání hlav a bomby u silnic zabily tisíce lidí a postavily malajsko-muslimský jih proti buddhistickému Bangkoku. Království už nemůže považovat hluboký jih za pouhou poznámku v policejních záznamech. Musí si zvolit, jak odpoví na požár na jihu. Podoba této odpovědi bude určena tím, kdo vládne v Bangkoku." # todo: NEW TRANSLATION
 SIA_kra_gateway: "Brána Kra" # todo: NEW TRANSLATION
 SIA_kra_gateway_desc: "Sto let starý sen se vrací na jednací stůl vlády, tentokrát však s rozvahou. Je ustavena komise proveditelnosti, geodeti jsou vysláni na šíji a v Songkhle je uvolněn první společný stavební pozemek. Zatím není nic závazné. Další otázkou je, kdo, pokud vůbec někdo, projekt zaplatí." # todo: NEW TRANSLATION
 SIA_kra_patron_china: "Financování Pásu a stezky" # todo: NEW TRANSLATION
 SIA_kra_patron_china_desc: "Nabídka Pekingu je zdaleka nejlevnější, s plným financováním BRI, čínskými inženýrskými týmy a kanálem na klíč postaveným v rekordním čase. Podmínky jsou nyní velkorysé a později obtížné. Dluh je denominován v jüanech, zástavou je samotný kanál a může přijít den, kdy Peking půjčku zesplatní." # todo: NEW TRANSLATION
 SIA_kra_patron_japan: "Kvalitní japonská infrastruktura" # todo: NEW TRANSLATION
 SIA_kra_patron_japan_desc: "JICA a konsorcium japonských megabank stavějí pomalu, draze a bezchybně. Žádná dluhová past, žádná skrytá nájemní klauzule, jen vyšší počáteční účet a partner, který očekává splacení v dobré vůli stejně jako v bahtech. Úcta Tokia k Bangkoku odpovídajícím způsobem roste." # todo: NEW TRANSLATION
 SIA_kra_patron_consortium: "Mezinárodní konsorcium" # todo: NEW TRANSLATION
 SIA_kra_patron_consortium_desc: "Mnohostranné konsorcium vedené ADB rozloží náklady a riziko mezi mnoho účastníků a trvá na pragmatickém pořadí, které inženýři vždy upřednostňovali. Nejprve etapový pozemní most, poté úplný průkop na úrovni moře. Žádný jediný věřitel nezíská kontrolu nad úžinou a Washington, Tokio i Manila si díky tomu oddechnou." # todo: NEW TRANSLATION
 SIA_kra_patron_solo: "Zvládnout to sami" # todo: NEW TRANSLATION
 SIA_kra_patron_solo_desc: "Žádný zahraniční věřitel, žádná cizí klauzule, žádná cizí vlajka u zdymadel. Království financuje kanál z vlastní pokladny a vlastního dluhopisového trhu a přijímá ohromující náklady jako cenu za absolutní suverenitu nad nejnovější strategickou vodní cestou." # todo: NEW TRANSLATION
 SIA_kra_debt_trap_warning_tt: "Financování Pásu a stezky je nyní levné, ale překročení stavebních nákladů otevře výchozí krizový řetězec §RPeking zesplatňuje půjčku§!." # todo: NEW TRANSLATION
 SIA_two_oceans_one_kingdom: "Dva oceány, jedno království" # todo: NEW TRANSLATION
 SIA_two_oceans_one_kingdom_desc: "Poslední hráz byla odstraněna. Slaná voda z Andamanského moře a Thajského zálivu se poprvé mísí na úrovni vrcholu průplavu. Thajsko již nekontroluje jediné pobřeží. Ovládá dvě." # todo: NEW TRANSLATION
 SIA_kra_militarize: "Pevnost na dvou mořích" # todo: NEW TRANSLATION
 SIA_kra_militarize_desc: "Kanál je příliš cenný na to, aby zůstal nechráněný. Pobřežní baterie, opevněná námořní základna a trvalý mandát pro kontrolu průjezdu promění vodní cestu v pevnost, kterou může královské thajské námořnictvo ubránit proti každému vetřelci. Svět si všimne děl a plátci mýtného budou reptat nad militarizací." # todo: NEW TRANSLATION
 SIA_kra_internationalize: "Kanál pro všechny národy" # todo: NEW TRANSLATION
 SIA_kra_internationalize_desc: "Prohlašme Krau za neutrální mezinárodní tranzitní režim, otevřený všem vlajkám za stejných podmínek a zaručený smlouvou. Thajsko se vzdá možnosti kanál uzavřít. Na oplátku získá dopravu, investice a tichou vděčnost každé námořní mocnosti, která se obávala úžiny v rukou jediného státu." # todo: NEW TRANSLATION
 SIA_gateway_of_asia: "Brána Asie" # todo: NEW TRANSLATION
 SIA_gateway_of_asia_desc: "Lodě Thajskem dříve jen proplouvaly. Nyní se zde zastavují. Dokončeme proměnu mezinárodními investicemi, hlubším přístavem na jihu a, pokud byla zvolena trasa kanálu, mandátem pro hlídkování, který zajistí bezpečnost úžiny pro všechny, kdo zaplatí mýtné." # todo: NEW TRANSLATION
 SIA_ghosts_of_the_jungle: "Duchové džungle" # todo: NEW TRANSLATION
 SIA_ghosts_of_the_jungle_desc: "Hluboko v kopcích Isaanu a na severních vysočinách kádry Komunistické strany Thajska nikdy skutečně nezmizely. Učili ve vesnických školách, organizovali odbory, pamatovali si. Nyní, když se země štěpí, stabilita se stává vzpomínkou a vláda mluví jen sama k sobě, jejich poselství nachází novou generaci připravenou naslouchat." # todo: NEW TRANSLATION
 SIA_isaan_soviets: "Isaanští sověti" # todo: NEW TRANSLATION
 SIA_isaan_soviets_desc: "Severovýchod je srdcem země, nejchudším regionem, politicky nejneklidnějším a tím, s nímž bangkokský establishment vždy zacházel jako s rezervoárem levné práce a levných hlasů. Vesnické výbory, odborové domy a družstevní rady se stávají organizační kostrou hnutí. Strana nežádá o loajalitu. Žádá lidi, aby si vládli sami, a sleduje, co se stane." # todo: NEW TRANSLATION
 SIA_general_strike: "Generální stávka" # todo: NEW TRANSLATION
 SIA_general_strike_desc: "Má-li být hnutí něč víc než venkovskou poznámkou pod čarou, musí zastavit města. Přístavní dělníci, tovární dělníci, řidiči autobusů i učitelé, všichni vyzváni ke stávce naráz. Sázka je úplná. Pokud vláda nebude dost dlouho schopná fungovat, buď kapitulovala, nebo vystupňuje konflikt. Střední cesta neexistuje." # todo: NEW TRANSLATION
 SIA_general_strike_tt: "Vyhlásí generální stávku a na 180 dní otevře rozhodnutí §YGenerální stávka§!.\n - Zvyšte dynamiku stávky na §Y100§! a vláda kapituluje, čímž se otevře mírová cesta k moci\n - Stávka stojí §R1 %§! stability za každý týden jejího trvání\n - Pokud 180 dní skončí s hodnotou pod 100, generálové stávku rozdrtí a převezmou moc převratem" # todo: NEW TRANSLATION
 SIA_people_seize_power: "Lid přebírá moc" # todo: NEW TRANSLATION
 SIA_people_seize_power_desc: "Stará vláda skončila. Ať padla v jednací místnosti, nebo před barikádou, výsledek je stejný. Komunistická strana Thajska přebírá vládní pravomoc. Nová vlajka zatím nevlaje, ale správní aparát je nyní v rukou lidí, kteří desítky let v džungli přemýšleli, jak jej využít." # todo: NEW TRANSLATION
 SIA_land_to_the_tiller: "Půda rolníkům" # todo: NEW TRANSLATION
 SIA_land_to_the_tiller_desc: "Velkostatky centrální nížiny, rýžová pole Isaanu, kaučukové plantáže jihu. Systém, který je vytvořil, skončil. Přerozdělení půdy, skutečné přerozdělení, nikoli vládní program končící s příští vládou, je zároveň příslibem hnutí i jeho nejnebezpečnějším činem. Rodiny, které tyto statky vlastnily, neodejdou všechny tiše." # todo: NEW TRANSLATION
 SIA_five_year_plan: "Pětiletý plán" # todo: NEW TRANSLATION
 SIA_five_year_plan_desc: "Trh přiděloval zdroje špatně. Stát je bude přidělovat záměrně. Továrny, ocel, chemikálie i obráběcí stroje, vše plánované z centra a vybudované prací mobilizovaného národa. Obchodní deficit se stává strukturálním přebytkem fyzického kapitálu. Cenou, viditelnou ve statistikách spotřebního zboží prvního roku, je izolace." # todo: NEW TRANSLATION
 SIA_red_chakri_dilemma: "Chakrijské dilema" # todo: NEW TRANSLATION
 SIA_red_chakri_dilemma_desc: "Jednu otázku, kterou vedení strany odkládalo tak dlouho, jak to šlo, už nelze odkládat. Jaké je ústavní postavení monarchie v komunistickém Thajsku? Historie nabízí dva precedenty. Ani jeden není pohodlný." # todo: NEW TRANSLATION
 SIA_positive_trade_relations: "Pozitivní obchodní vztahy" # todo: NEW TRANSLATION
 SIA_nuclear_proliferation_concern: "Thajské obohacování uranu" # todo: NEW TRANSLATION
 SIA_nuclear_proliferation_tt: "§RKaždá země mimo naše aliance bude mít na thajský program obohacování trvalý názor.§!" # todo: NEW TRANSLATION
 SIA_tt_has_reclaimed: "Držíme znovuzískané území, které ještě nebylo integrováno" # todo: NEW TRANSLATION
 SIA_tt_has_unpacified_reclaimed: "Znovuzískané území s mírou spolupráce pod §Y90 %§!" # todo: NEW TRANSLATION
 SIA_tt_has_corable_reclaimed: "Znovuzískané území s mírou spolupráce alespoň §Y80 %§!" # todo: NEW TRANSLATION
 SIA_bamboo_curtain: "Bambusová opona" # todo: NEW TRANSLATION
 SIA_bamboo_curtain_desc: "Thajská revoluce nemůže přežít jako izolovaný experiment. Vietnam a Laos jsou sousedé, souputníci a potenciální partneři. Regionální rámec solidarity založený na vzájemném uznání a koordinovaném odporu vůči západnímu ekonomickému tlaku je architekturou udržitelného revolučního státu v jihovýchodní Asii." # todo: NEW TRANSLATION
 SIA_protracted_peoples_war: "Vleklá lidová válka" # todo: NEW TRANSLATION
 SIA_protracted_peoples_war_desc: "Strana sedmdesátých let nezvítězila ve městech. Své řemeslo se naučila v kopcích, kde byl dosah Bangkoku slabý a puška znamenala více než manifest. Vybudujme základny na vysočině a nechme venkov obklíčit město. Pomalejší než generální stávka a mnohem obtížněji vratné." # todo: NEW TRANSLATION
 SIA_peoples_tribunals: "Lidové tribunály" # todo: NEW TRANSLATION
 SIA_peoples_tribunals_desc: "Revoluce, která se nedokáže bránit, trvá jednu sezónu. Udavači, finančníci i plukovníci, kteří čekali, kterým směrem se vítr obrátí, jsou stále na svých místech. Revoluční soudy, rychlé a veřejné, vyřeší otázku loajality dříve, než ji bude možné položit straně." # todo: NEW TRANSLATION
 SIA_broad_united_front: "Široká jednotná fronta" # todo: NEW TRANSLATION
 SIA_broad_united_front_desc: "Revoluce, která vládne strachem, ovládá každý rok menší zemi. Těžší cestou je souhlas. Přiveďme rolnické svazy, odbory, reformní intelektuály, drobné obchodníky a vesnické mnichy pod jednu střechu a nechme je cítit, že nový stát vybudovali, nikoli jen přežili. Moc je na papíře sdílená a v praxi střežená, ale hnutí, které dokáže vládnout dohodou, nemusí vládnout zbraní." # todo: NEW TRANSLATION
 SIA_peoples_army: "Lidová armáda" # todo: NEW TRANSLATION
 SIA_peoples_army_desc: "Plán vybudoval továrny. Nyní kuje štít. Revoluční stát v nepřátelském regionu potřebuje armádu, která bude početná, loajální a vlastní, s branci cvičenými k obrazu strany a vybavenými z thajských arzenálů namísto zahraniční dobré vůle. Každé tělo schopné nést pušku je občanem-vojákem a každá dílna schopná vyrobit hlaveň je článkem zásobovacího řetězce. Sousedé si dvakrát rozmyslí, než zaútočí." # todo: NEW TRANSLATION
 SIA_socialist_education: "Každý učí jednoho" # todo: NEW TRANSLATION
 SIA_socialist_education_desc: "Plán vybudoval továrny. Nyní buduje lidi, kteří je budou řídit. Masová kampaň gramotnosti dosáhne poslední vesnice v Isaanu a kádrové školy promění rolníky v inženýry a úředníky ve správce, kteří odpovídají zásluhám, nikoli tomu, do jaké rodiny se narodili. Gramotné a organizované obyvatelstvo se hůře klame a levněji spravuje, zatímco hniloba klientelismu, která vyhloubila staré království, nenajde místo, kde by zapustila kořeny." # todo: NEW TRANSLATION
 SIA_the_beijing_road: "Pekingská cesta" # todo: NEW TRANSLATION
 SIA_the_beijing_road_desc: "Přežití má sponzora a ten sídlí v Zhongnanhai. Plně přijměme objetí Pekingu. Čínský kapitál dokončí průmyslový plán, čínské trhy nahradí ty, které Západ uzavřel, a stín velmoci odradí každého souseda od výzvy. Cena je napsána drobným písmem. Hlas Číny v thajských radách sílí více, než by kterýkoli Thajec dříve dovolil. Mladší partner je stále partnerem a živený národ přežije pyšný národ." # todo: NEW TRANSLATION
 SIA_indochina_federation: "Indočínská federace" # todo: NEW TRANSLATION
 SIA_indochina_federation_desc: "Nebo odmítněme roli klienta a nárokujme si roli vůdce. Laos, Vietnam a Kambodža jsou tři revoluce, které krváceli za stejnou myšlenku, žádná však nemá thajský průmysl ani jeho centrální postavení. Federace tří řek s Bangkokem jako starším partnerem namísto mladšího Pekingu promění jihovýchodní Asii v celek, s nímž musí velmoci vyjednávat, místo aby si jej rozebraly. Je to troufalejší tvrzení a také hrdější." # todo: NEW TRANSLATION
 SIA_kingmaker_coalition: "Koalice tvůrce králů" # todo: NEW TRANSLATION
 SIA_kingmaker_coalition_desc: "Strana Bhumjaithai Anutina Charnvirakula drží v parlamentu z roku 2019 rovnováhu sil. Vytvoření koalice s ní stojí ministerstva a politické ústupky, ale zároveň přináší vládní většinu a přístup k venkovské severovýchodní základně strany." # todo: NEW TRANSLATION
 SIA_cannabis_decriminalized: "Dekriminalizace konopí" # todo: NEW TRANSLATION
 SIA_cannabis_decriminalized_desc: "Charakteristická politika Bhumjaithai z roku 2022 odstraňuje konopí ze seznamu omamných látek. Zemědělci v Buriramu i napříč Isaanem přecházejí na novou tržní plodinu. Příjmy státní pokladny rostou. Konzervativní hlasy varují před morálním hazardem. Obojí je pravda." # todo: NEW TRANSLATION
 SIA_million_rai_farms: "Milion rai moderních farem" # todo: NEW TRANSLATION
 SIA_million_rai_farms_desc: "Venkovská rozvojová platforma Bhumjaithai přináší na jih precizní zavlažování, certifikaci smluvního zemědělství a dotace na obnovu kaučukovníkových plantáží. Severovýchod získá nová odvětví a jih rozšíření plantáží. Thajský zemědělský export roste." # todo: NEW TRANSLATION
 SIA_defence_industry_act: "Zákon o obranném průmyslu" # todo: NEW TRANSLATION
 SIA_defence_industry_act_desc: "Právní rámec pro domácí výrobu obranné techniky, s předností při nákupech pro lokálně vyráběné systémy, povinným převodem technologií u všech zahraničních kontraktů a sekretariátem obranného průmyslu uvnitř ministerstva. První zbrojovka, která vznikne, bude skromná. Institucionální základ nikoli." # todo: NEW TRANSLATION
 SIA_dti_expansion: "Rozšíření DTI" # todo: NEW TRANSLATION
 SIA_dti_expansion_desc: "Ústav obranných technologií získá kapitálovou injekci a mandát dodat rakety, potulující se munici a modernizované prototypy obrněných vozidel. Isaanské zařízení se promění z projekční kanceláře ve výrobní linku a spolu s ním se spustí nová zbrojní výroba. Výzkumné bonusy následují techniku." # todo: NEW TRANSLATION
 SIA_chaiseri_and_friends: "Chaiseri a přátelé" # todo: NEW TRANSLATION
 SIA_chaiseri_and_friends_desc: "First Win MRAP společnosti Chaiseri Metal and Rubber se již prodává do Indonésie a na Filipíny. S podporou zákona o obranném průmyslu se rozšiřuje skupina soukromých obranných dodavatelů, mezi nimi Chaiseri, Thonburi Automotive a Thai Optical. Co začíná jako domácí nákup, se mění ve vývozní účetnictví a vlastní výrobní linka Chaiseri díky výnosům postoupí na vyšší úroveň." # todo: NEW TRANSLATION
 SIA_arms_exporter: "Arzenál ASEAN" # todo: NEW TRANSLATION
 SIA_arms_exporter_desc: "Thajsko vybudovalo výrobní základnu, právní rámec i vývozní vztahy, aby se stalo preferovaným dodavatelem zbraní druhé kategorie v regionu. Ne tanky a stíhačky, ale MRAPy, dělostřelecké zapalovače, drony a munice. Spolehlivě, dostupně a včas. Opakovatelný vývozní kontrakt se stává pevnou součástí příjmů státní pokladny." # todo: NEW TRANSLATION
 SIA_regional_defense_pact: "Regionální obranný pakt" # todo: NEW TRANSLATION
 SIA_regional_defense_pact_desc: "Vývozní účetnictví se stalo diplomatickým nástrojem. Bangkok formalizuje trvalá ujednání o dodávkách obranné techniky se svými partnery v ASEAN, včetně zaručených nákupních kanálů, společných programů údržby a stálého konzultačního rámce pro regionální bezpečnost. Továrny pracují intenzivněji, přidělenci se vracejí s podepsanými dohodami a vliv Thajska v jihovýchodní Asii se měří příděly munice a kontrakty na náhradní díly." # todo: NEW TRANSLATION
 SIA_stream_of_the_navy: "Proud námořnictva" # todo: NEW TRANSLATION
 SIA_stream_of_the_navy_desc: "Královská thajská námořní pěchota získá doktrinální podporu pro obojživelné útoky a pobřežní obranu. Rozšíření loděnic na jihu podpoří novou obojživelnou eskadru. Thajští mariňáci cvičí po boku svých indonéských a filipínských protějšků na cvičeních, která již nejsou čistě ceremoniální." # todo: NEW TRANSLATION
 SIA_cavalry_of_the_sky: "Jízda oblohy" # todo: NEW TRANSLATION
 SIA_cavalry_of_the_sky_desc: "Letecké jednotky armády dostanou přednost. Nové víceúčelové vrtulníky pro výsadkovou pěchotu, útočné varianty na podporu pozemních operací v kopcích a doktrína vzdušného útoku, která uznává, že thajský terén je spíše džungle než step." # todo: NEW TRANSLATION
 SIA_cyber_command: "Kybernetické velitelství" # todo: NEW TRANSLATION
 SIA_cyber_command_desc: "Specializované velitelství kybernetických operací podle rámců amerického CYBERCOM a izraelské jednotky 8200. Obrana sítí, signálové zpravodajství a v tiché příloze rozpočtového návrhu také rozvoj útočných schopností. Pokud již infrastruktura dohledu ISOC existuje, velitelství ji převezme a rozšíří její dosah do digitální dimenze." # todo: NEW TRANSLATION
 SIA_us_coin_legacy: "Dědictví amerického protipovstaleckého boje" # todo: NEW TRANSLATION
 SIA_us_coin_legacy_desc: "Thajská armáda vstřebala tvrdé lekce americké protipovstalecké doktríny v desetiletích po válce ve Vietnamu, včetně programů obrany vesnic, psychologických operací a zpravodajské spolupráce s ISOC. Tento rámec stále utváří způsob, jakým Thajsko bojuje se svými vnitřními nepřáteli. Jeho systematizace přináší výsledky." # todo: NEW TRANSLATION
 SIA_development_is_security: "Rozvoj je bezpečnost" # todo: NEW TRANSLATION
 SIA_development_is_security_desc: "Silnice, školy a kliniky v neklidném severu a severovýchodě jsou nejlevnější dostupnou protipovstaleckou strategií. Infrastruktura, která dorazí do vesnice dříve než agitátor, má tendenci zůstat. Nové železniční terminály v Isaanu a na severu urychlí každý následující projekt." # todo: NEW TRANSLATION
 SIA_post_cold_war_professionalization: "Profesionalizace po studené válce" # todo: NEW TRANSLATION
 SIA_post_cold_war_professionalization_desc: "Studená válka formovala důstojnický sbor Thajska pro protikomunistické operace, loajalitu k vnitřnímu pořádku a podřízenost paláci. Nová generace důstojníků, cvičená ve společných cvičeních se západními partnery a vzdělaná v mezinárodním právu, nově definuje účel Královských thajských ozbrojených sil." # todo: NEW TRANSLATION
 SIA_multi_domain_operations: "Operace ve více doménách" # todo: NEW TRANSLATION
 SIA_multi_domain_operations_desc: "Bitevní pole již není čárou na mapě. Kybernetika, elektronický boj, družicové snímkování a přesné údery dronů se spojují s konvenčním manévrem. Thajská koncepce MDO, vyvinutá společně s americkými a australskými partnery, uznává, že příští válka bude probíhat současně ve všech doménách." # todo: NEW TRANSLATION
 SIA_mdo_integration_strain: "Napětí z integrace" # todo: NEW TRANSLATION
 SIA_mdo_integration_strain_desc: "Zřízení struktur velení napříč doménami, od kybernetiky po družicové snímkování, stojí peníze dlouho předtím, než se doktrína začne vyplácet." # todo: NEW TRANSLATION
 SIA_ministry_of_defence: "Ministerstvo obrany" # todo: NEW TRANSLATION
 SIA_ministry_of_defence_desc: "Obranu Království vždy řídily samotné složky, přičemž každá střežila vlastní rozpočet, vlastní doktrínu a vlastní území. Konečně jí dáme institucionální páteř: ministerstvo nad armádou, námořnictvem a letectvem, které spojí územní obranu, politiku národní bezpečnosti a zpravodajství do jediného aparátu odpovědného státu." # todo: NEW TRANSLATION
 SIA_comprehensive_security: "Komplexní bezpečnost" # todo: NEW TRANSLATION
 SIA_comprehensive_security_desc: "Vnitro, obrana a zpravodajské služby po desetiletí sledovaly stejné hranice se třemi sadami spisů a bez zvyku je sdílet. Jedna doktrína je spojí a současně otevře tři směry úsilí: ekonomiku, domácí frontu a ozbrojené síly." # todo: NEW TRANSLATION
 SIA_protector_of_the_realm_focus: "Ochránce říše" # todo: NEW TRANSLATION
 SIA_protector_of_the_realm_focus_desc: "Po vysvěcení Památníku vítězství leží šanské, laoské, khmerské a malajské území pod thajskou vlajkou. Zvítězit a vládnout jsou dva různé úkoly. Za posádkami vzniká správa znovuzískaného pohraničí a začíná práce na jeho uklidnění, rozvoji a pozdějším začlenění." # todo: NEW TRANSLATION
 SIA_atoms_for_peace: "Atomy pro mír" # todo: NEW TRANSLATION
 SIA_atoms_for_peace_desc: "Thajsko podepisuje protokoly MAAE o mírovém využití a zahajuje dlouhou institucionální přípravu. Úřad pro jadernou bezpečnost, dohody o vyhořelém palivu a první domácí výzkumný reaktor. Civilní program stojí na přesvědčení, že základní energie z uranu je levnější, čistší a suverénnější než ropa dovážená za geopolitické ceny." # todo: NEW TRANSLATION
 SIA_smr_initiative: "Iniciativa SMR" # todo: NEW TRANSLATION
 SIA_smr_initiative_desc: "Malé modulární reaktory jsou technologií, díky níž je jaderná energie uskutečnitelná pro zemi, která si nemůže dovolit kapitálové náklady plnohodnotné elektrárny. Iniciativa financuje studie proveditelnosti, průzkumy lokalit ve Východním pobřežním regionu a dohodu o převodu technologií s jihokorejským nebo francouzským konsorciem. První beton se začne lít za deset let. Rozhodnutí padne dnes." # todo: NEW TRANSLATION
 SIA_nuclear_power_program: "Program jaderné energetiky" # todo: NEW TRANSLATION
 SIA_nuclear_power_program_desc: "Vyvrcholením je národní program jaderné energetiky s pevným datem uvedení do provozu, suverénním palivovým cyklem a prvním reaktorem připojeným k síti. Thajsko se stane prvním státem jihovýchodní Asie, který připojí civilní reaktor k síti, a připojí se k Japonsku, Jižní Koreji, Číně, Indii, Pákistánu a Tchaj-wanu mezi jaderné provozovatele regionu. Energetická nezávislost už není teoretická." # todo: NEW TRANSLATION
 SIA_bangkok_phnom_penh_axis: "Osa Bangkok–Phnompenh" # todo: NEW TRANSLATION
 SIA_bangkok_phnom_penh_axis_desc: "Geografie Kambodže z ní činí přirozený thajský hospodářský koridor k moři a její politický vývoj zase přirozenou diplomatickou protiváhu Vietnamu. Tento záměr buduje vztahy prostřednictvím obchodních misí, silničních spojení a společného bezpečnostního rámce, který udrží Phnompenh blízko Bangkoku a dále od oběžné dráhy Pekingu." # todo: NEW TRANSLATION
 SIA_jakarta_dialogue: "Dialog v Jakartě" # todo: NEW TRANSLATION
 SIA_jakarta_dialogue_desc: "Indonésie je demografickým gigantem jihovýchodní Asie a po Kuala Lumpuru nejdůležitějším bilaterálním vztahem Thajska. Dialog v Jakartě je platformou pro bilaterální ministry, společná vojenská cvičení a otevřený rozhovor o tom, kdo povede příští desetiletí ASEAN. Výsledek závisí na tom, zda Bangkok vnímá Jakartu jako partnera, nebo rivala." # todo: NEW TRANSLATION
 SIA_asean_crossroads: "Křižovatka ASEAN" # todo: NEW TRANSLATION
 SIA_asean_crossroads_desc: "Před Královstvím leží dvě cesty. První je partnerství, řád vedený Thajskem, který spojuje ASEAN na základě souhlasu. Druhou je nadvláda, jihovýchodní Asie pod thajskou kontrolou vynucenou mečem." # todo: NEW TRANSLATION
 SIA_the_2001_election_choice_tt: "Podpořte jednu sílu v kampani roku 2001. Volby rozhodnou, kdo bude vládnout, a otevře se pouze cesta vítěze.\n - £SIA_neutral_Social §YThai Rak Thai§!\n - £SIA_Nat_Autocracy §YPalácová síť a její generálové§!\n - £SIA_western_conservative §YSedící demokraté§!" # todo: NEW TRANSLATION
 SIA_the_2006_coup_choice_tt: "Zvolte charakter junty.\n - §YTvrdá linie§!: Pozastaví volby a přepíše ústavu za cenu stability a názoru Západu\n - §YSmířlivá linie§!: Zachová demokratické volby a zaplatí menší cenu" # todo: NEW TRANSLATION
 SIA_a_new_republic_choice_tt: "Zvolte osud monarchie.\n - §YZrušit§!: Přestát otřesy\n - §YStáhnout se§!: Zachovat korunu kvůli stabilitě a politické moci" # todo: NEW TRANSLATION
 SIA_the_southern_question_choice_tt: "Zvolte bezpečnostní doktrínu pro hluboký jih." # todo: NEW TRANSLATION
 SIA_red_chakri_dilemma_choice_tt: "Zvolte revoluční odpověď na trůn.\n - §YZrušit monarchii§!: Čelit royalistickému povstání\n - §YZachovat ústavní symbol§!: Následovat laoský model a vstřebat hněv radikálů" # todo: NEW TRANSLATION
 SIA_lost_territories_choice_tt: "Zvolte, jak otevřeně bude nárok prosazován.\n - §YOtevřený iredentismus§!: Podpora války za cenu mezinárodního postavení\n - §YTichý popíratelný revizionismus§!: Chrání stabilitu" # todo: NEW TRANSLATION
 SIA_nuclear_power_program_choice_tt: "Zvolte směr palivového cyklu.\n - §YVzepřít se inspektorům§!: Obohacování schopné vyrábět zbraně pod sankcemi\n - §YPřijmout záruky MAAE§!: Napravit vztahy s Washingtonem" # todo: NEW TRANSLATION
 SIA_prayuth_premiership_choice_tt: "Zvolte, jak generál naplánuje své nástupnictví.\n - §YŘízený přechod§!: Upevnit establishment\n - §YInstitucionalizovat urovnání§!: Ustoupit zpět k civilnější tváři" # todo: NEW TRANSLATION
 SIA_2020_protest_response_choice_tt: "Zvolte reakci na protesty.\n - §YPotlačit je§!: Stojí stabilitu a zvyšuje riziko převratu\n - §YPřistoupit na reformu§!: Uklidnění a podpora reformního hnutí\n - §YPočkat, až je to přejde§!" # todo: NEW TRANSLATION
 SIA_found_the_pact: "Objevit Organizaci smlouvy pro jihovýchodní Asii" # todo: NEW TRANSLATION
 SIA_found_the_pact_desc: "Slova se mění v instituce. Thajsko obnovuje název, který vnější mocnosti v roce 1977 opustily, a dává mu regionálního vlastníka: Organizaci smlouvy pro jihovýchodní Asii, pakt vzájemné obrany s Bangkokem v jeho středu a sousedy mezi jeho členy. Thajsko přebírá roli zakládajícího vůdce. Vlajka je vztyčena. Pakt je skutečný." # todo: NEW TRANSLATION
 SIA_invite_mainland: "Pozvat pozemní partnery" # todo: NEW TRANSLATION
 SIA_invite_mainland_desc: "Vietnam, Laos, Kambodža a Myanmar sdílejí s Thajskem hranice i společné hrozby. Bangkok rozesílá formální pozvání pevninským státům a vysvětluje, že bezpečnost v kontinentálním vnitrozemí závisí na společném postupu, nikoli na soupeřícím zajišťování." # todo: NEW TRANSLATION
 SIA_invite_mainland_tt: "Pozve naše pevninské sousedy ke vstupu do SEATO.\n - Každý z nich sám rozhodne, zda nabídku přijme\n - Člen, který nabídku přijme, získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_invite_maritime: "Pozvat námořní partnery" # todo: NEW TRANSLATION
 SIA_invite_maritime_desc: "Indonésie, Filipíny, Malajsie, Singapur a Brunej ovládají moře, na nichž Thajsko závisí kvůli obchodu. Námořní partneři jsou pozváni ke vstupu do paktu, čímž se souostroví a poloostrov spojí do jediného strategického společenství." # todo: NEW TRANSLATION
 SIA_invite_maritime_tt: "Pozve námořní státy jihovýchodní Asie ke vstupu do SEATO.\n - Každý z nich sám rozhodne, zda nabídku přijme\n - Člen, který nabídku přijme, získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_invite_breakaways: "Pozvat pohraniční státy" # todo: NEW TRANSLATION
 SIA_invite_breakaways_desc: "Jižní Šan, Karenové a Wa ovládají území mezi Thajskem a barmským vnitrozemím a žádný z nich nedokáže přežít sám. Bangkok jim nabízí to, co Najpjijto nikdy nenabídne: místo u stolu, podpis smlouvy a postavení státu namísto povstaleckého hnutí." # todo: NEW TRANSLATION
 SIA_invite_breakaways_tt: "Pozve barmské separatistické státy ke vstupu do SEATO, pokud existují.\n - Každý z nich sám rozhodne, zda nabídku přijme\n - Člen, který nabídku přijme, získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_seato_invite_line_tt: " - §Y[THIS.GetNameDefCap]§! je pozván ke vstupu do SEATO" # todo: NEW TRANSLATION
 SIA_seato_invite_accept_tt: " - Vstoupí do §YSEATO§! a získá ideu, která ho zaváže k paktu" # todo: NEW TRANSLATION
 SIA_seato_accession_category: "Přistoupení k SEATO" # todo: NEW TRANSLATION
 SIA_seato_accession_category_desc: "První Organizace smlouvy pro jihovýchodní Asii byla podepsána v Manile v roce 1954 a řízena z Bangkoku, ale pouze dva z jejích osmi členů pocházeli z jihovýchodní Asie a v roce 1977 se rozpadla, aniž by byla kdy použita. Tato organizace je regionálním paktem, kterým ta první nikdy nebyla: Thajsko v čele, sousedé jako členové a záruka zaměřená na obranu jihovýchodní Asie, nikoli na zadržování někoho jiného. Místa je třeba obsadit jedno po druhém.\n\nPřed pozváním do frakce si prohlédněte vstřícnost jednotlivých zemí." # todo: NEW TRANSLATION
 SIA_renew_seato_invitation: "Obnovit pozvání" # todo: NEW TRANSLATION
 SIA_renew_seato_invitation_desc: "Pošlete delegaci zpět do [FROM.GetNameDefCap] s textem smlouvy a novou nabídkou. Odmítnutí není trvalé a podmínky se nezměnily." # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_major: "Dvořit se zemi [FROM.GetNameDefCap]" # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_major_desc: "Státní návštěvy, úvěrová linka, stipendia pro jejich důstojníky a thajský pavilon na jejich veletrhu. Ministerstvo zahraničí se po tři měsíce věnuje výhradně tomu. Nic z toho není smlouva. Všechno to však usnadní její podpis, až se příště zeptáme." # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_minor: "Dvořit se zemi [FROM.GetNameDefCap]" # todo: NEW TRANSLATION
 SIA_seato_charm_offensive_minor_desc: "Státní návštěvy, úvěrová linka, stipendia pro jejich důstojníky a thajský pavilon na jejich veletrhu. Ministerstvo zahraničí se po tři měsíce věnuje výhradně tomu. Nic z toho není smlouva. Všechno to však usnadní její podpis, až se příště zeptáme." # todo: NEW TRANSLATION
 SIA_courting_mission: "Dvoření sousedům" # todo: NEW TRANSLATION
 SIA_courting_mission_desc: "Vyšší diplomatičtí pracovníci, ministerský kalendář i většina volně použitelného rozpočtu jsou až do konce mise věnovány jedinému hlavnímu městu. Všechno ostatní ve vládě musí počkat." # todo: NEW TRANSLATION
 SIA_seato_rec_opinion_yes: "§GNázor na Thajsko je vyšší než 40§! (+25)" # todo: NEW TRANSLATION
 SIA_seato_rec_opinion_no: "§RNázor na Thajsko je 40 nebo nižší§! (+25)" # todo: NEW TRANSLATION
 SIA_seato_rec_faction_yes: "§VNení v jiné frakci§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_faction_no: "§RUž je v jiné frakci§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_influence_yes: "§GThajsko patří mezi tři největší zdroje vlivu a drží 20 procent nebo více§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_influence_no: "§RThajsko nepatří mezi tři největší zdroje vlivu s podílem 20 procent nebo více§! (+20)" # todo: NEW TRANSLATION
 SIA_seato_rec_threat_yes: "§GJe ve válce nebo sousedí se zemí, která je ve válce§! (+15)" # todo: NEW TRANSLATION
 SIA_seato_rec_threat_no: "§ROn ani žádná země, se kterou sousedí, není ve válce§! (+15)" # todo: NEW TRANSLATION
 SIA_seato_rec_trade_yes: "§GMá s Thajskem obchodní dohodu§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_trade_no: "§RNemá s Thajskem obchodní dohodu§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_momentum_yes: "§GSEATO již má tři nebo více členů§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_momentum_no: "§RSEATO má méně než tři členy§! (+10)" # todo: NEW TRANSLATION
 SIA_seato_rec_total: "§YVstřícnost vůči SEATO§!: §Y[?SIA_seato_temp|0]§!/100. Pozvání přijmou při hodnotě §Y60§!." # todo: NEW TRANSLATION
 SIA_joint_command: "Společné velení ASEAN" # todo: NEW TRANSLATION
 SIA_joint_command_desc: "V Bangkoku je zřízena stálá struktura společného velení, která integruje doktrínu, logistiku a zpravodajství všech členských států. Vyšší posty zastávají thajští důstojníci, štáb je však skutečně mnohostranný. Cvičení se stávají interoperabilními. Plány se stávají skutečností." # todo: NEW TRANSLATION
 SIA_asean_rapid_reaction: "Síly rychlé reakce ASEAN" # todo: NEW TRANSLATION
 SIA_asean_rapid_reaction_desc: "Pakt činí další krok: vytváří stálou brigádu rychlé reakce složenou ze všech členských států, schopnou nasazení do 72 hodin na jakémkoli místě jihovýchodní Asie. Je to meč paktu — malý, rychlý a nepochybně skutečný." # todo: NEW TRANSLATION
 SIA_arsenal_integration: "Integrace arzenálu ASEAN" # todo: NEW TRANSLATION
 SIA_arsenal_integration_desc: "Thajský obranný průmysl, již nyní dílna jihovýchodní Asie, sjednocuje zbraně a munici ozbrojených sil všech členských států. Pušky, vozidla a dělostřelecké granáty thajské výroby nahrazují směs sovětské, čínské a západní techniky. Armády paktu nyní používají stejné náboje." # todo: NEW TRANSLATION
 SIA_pax_aseana: "Pax Aseana" # todo: NEW TRANSLATION
 SIA_pax_aseana_desc: "Práce je dokončena a pakt drží. Thajsko vybudovalo to, co žádná vnější mocnost nedokázala: skutečnou bezpečnostní architekturu zakořeněnou v regionu a dostatečně silnou, aby odradila jakéhokoli vyzyvatele. Sousedé podepsali, protože chtěli, a právě proto pakt vydrží." # todo: NEW TRANSLATION
 SIA_war_economy_push: "Přechod na válečné hospodářství" # todo: NEW TRANSLATION
 SIA_war_economy_push_desc: "Národ přešel na válečnou nohu. Továrny, které vyráběly spotřební zboží, jsou přestavovány na výrobu dělostřeleckých granátů a hlavní pušek. Limit vojenských výdajů je zrušen, zakázky jsou podepisovány bez obvyklých průtahů a na narychlo vyklizených pozemcích v bangkocké metropolitní oblasti vyrůstají tři nové zbrojovky." # todo: NEW TRANSLATION
 SIA_friends_abroad: "Přátelé v zahraničí" # todo: NEW TRANSLATION
 SIA_friends_abroad_desc: "Thajské ozbrojené síly po desetiletí cvičily po boku zahraničních partnerů. Dvoustranné vazby vytvořené společnými cvičeními, výměnami důstojníků a transfery zbraní jsou tichým pilířem thajské bezpečnosti — méně viditelným než spojenectví, ale trvalejším než většina z nich. Nastal čas formalizovat to, co již funguje." # todo: NEW TRANSLATION
 SIA_cobra_gold_focus: "Cobra Gold" # todo: NEW TRANSLATION
 SIA_cobra_gold_focus_desc: "Cobra Gold je největší každoroční společné vojenské cvičení v Asii, jehož hostiteli jsou Thajsko a Spojené státy. Prohloubení programu cvičení přinese Královské thajské armádě americkou doktrínu, výcvik logistiky a znalost vybavení a upevní Bangkok jako hlavního partnera Washingtonu v pevninské jihovýchodní Asii." # todo: NEW TRANSLATION
 SIA_partner_japan: "Obranné vazby s Japonskem" # todo: NEW TRANSLATION
 SIA_partner_japan_desc: "Japonské reformy vývozu obranné techniky otevřely nové kanály pro thajské nákupy. Tokio nabízí know-how v přesné výrobě, elektroniku dvojího užití a financování infrastruktury, které doplňují thajské schopnosti bez politických podmínek spojených s čínskými či americkými balíčky." # todo: NEW TRANSLATION
 SIA_partner_korea: "Obranné partnerství s ROK" # todo: NEW TRANSLATION
 SIA_partner_korea_desc: "Korejská republika vybudovala během jediné generace konkurenceschopný zbrojní průmysl. Tanky K-2, letouny FA-50 a houfnice K9 se za konkurenční ceny prodávají partnerům po celé jihovýchodní Asii. Thajsko se řadí do fronty a přiváží si korejské standardy leteckého výcviku i průmyslové postupy." # todo: NEW TRANSLATION
 SIA_partner_australia: "Soused z Five Eyes" # todo: NEW TRANSLATION
 SIA_partner_australia_desc: "Austrálie je nejbližším anglofonním partnerem Thajska a zároveň nečlenským spojencem Spojených států v rámci NATO. Společná cvičení v Andamanském moři a Thajském zálivu prohloubila vazby mezi námořnictvy. Rozšíření partnerství přinese interoperabilitu armád a spolupráci v námořním průzkumu, kterou by si žádná ze zemí nemohla dovolit sama." # todo: NEW TRANSLATION
 SIA_partner_taiwan: "Tichá obranná spolupráce" # todo: NEW TRANSLATION
 SIA_partner_taiwan_desc: "Tchajwanský obranný průmysl je diskrétní, technicky vyspělý a politicky motivovaný hledat přátele. Bangkok Tchaj-pej neuznává, ale Královská thajská armáda a armáda ROC dlouhodobě udržují neformální kanály pro dodávky vybavení a výcvik. Tiché formalizování této spolupráce je kalkulovaným rizikem. Peking si toho všimne." # todo: NEW TRANSLATION
 SIA_hedging_partners: "Přátelé na Dálném východě" # todo: NEW TRANSLATION
 SIA_hedging_partners_desc: "Tokio, Soul i Peking nabízejí Bangkoku něco, co Washington nemůže: trpělivý kapitál, technologie dvojího užití a obrovský sousední trh. Nikdo z nich nepožaduje výhradní postavení. Thajsko se uchází o všechny tři a drží si vysokou cenu, odmítá být kotvou kohokoli i klientem kohokoli. Království, které se již zavázalo k balancování, z těchto vazeb získává dvojnásobek." # todo: NEW TRANSLATION
 SIA_national_grid: "Napájet Království" # todo: NEW TRANSLATION
 SIA_national_grid_desc: "Rychlá industrializace Thajska předběhla jeho elektrickou síť. Východní pobřeží hučí továrnami, ale síť stárne, přenosové ztráty jsou ostudné a další desetiletí růstu vyžaduje základ, který unese zátěž. Vláda se zavazuje k celostátní modernizaci infrastruktury s novými rozvodnami, modernizovanými přenosovými vedeními a novými továrnami v regionech, které síť konečně dokáže zásobovat." # todo: NEW TRANSLATION
 SIA_renewable_push: "Rozvoj obnovitelné energie" # todo: NEW TRANSLATION
 SIA_renewable_push_desc: "Vítr z Thajského zálivu, solární energie v centrálních nížinách, malé vodní elektrárny na severu. Geografie Thajska představuje obnovitelný zdroj, který je chronicky nevyužitý. Tento program zadává velkokapacitní obnovitelné instalace v každém regionu Království a jejich výkon přímo napojuje do celostátní sítě." # todo: NEW TRANSLATION
 SIA_green_grid: "Zelená síť" # todo: NEW TRANSLATION
 SIA_green_grid_desc: "Jedna věc je obnovitelná kapacita, druhá je síť, která ji dokáže využít. Akumulace, inteligentní řízení a modernizovaný přenos propojí solární farmy a větrné hřebeny Království do spolehlivých dodávek. Každý nový panel či turbína se na posílené páteři připojí rychleji. Zde začíná energetická nezávislost Království." # todo: NEW TRANSLATION
 SIA_fossil_fuels_deal: "Energetické partnerství se Zálivem" # todo: NEW TRANSLATION
 SIA_fossil_fuels_deal_desc: "Rafinerie Království fungují na ropě ze Zálivu a elektrárny spalují dovážený plyn. Namísto boje proti této závislosti ji Bangkok formalizuje. Dlouhodobé dodavatelské dohody se Saúdskou Arábií, Katarem a Spojenými arabskými emiráty přinášejí jistotu cen, skromné úspory paliva díky modernizaci elektráren a diplomatickou vřelost, která přichází spolu s šekem." # todo: NEW TRANSLATION
 SIA_gulf_energy_ties: "Strategické zásoby paliva" # todo: NEW TRANSLATION
 SIA_gulf_energy_ties_desc: "Tanker, který nikdy nevypluje, je elektrárna, která nikdy nenastartuje. V jižním průmyslovém koridoru a na Východním pobřeží vyrůstají dvě strategická skladovací zařízení paliva. Partneři ze Zálivu financují polovinu výstavby a thajští inženýři postaví zbytek." # todo: NEW TRANSLATION
 SIA_iron_fist_doctrine: "Doktrína železné pěsti" # todo: NEW TRANSLATION
 SIA_iron_fist_doctrine_desc: "O křivdách se již nebude mluvit. Tři provincie jsou zaplaveny vojáky, kontrolními stanovišti a mimořádnými pravomocemi. Povstání je bezpečnostní problém a jako takový bude také řešeno — rychle, tvrdě a bez omluv. Svět bude protestovat. Jih ztichne." # todo: NEW TRANSLATION
 SIA_martial_law_south: "Stanné právo na jihu" # todo: NEW TRANSLATION
 SIA_martial_law_south_desc: "Mimořádný dekret podřizuje Pattani, Jalu a Narathiwat vojenské správě. Zákazy vycházení, prohlídky bez povolení a zadržování bez obvinění se stávají každodenní realitou života na jihu. Armáda nyní může jednat na základě zpravodajství okamžitě po jeho obdržení a obyvatelstvo poznává cenu ukrývání mužů se zbraněmi." # todo: NEW TRANSLATION
 SIA_search_and_destroy: "Pátrat a ničit" # todo: NEW TRANSLATION
 SIA_search_and_destroy_desc: "Speciální jednotky a letectvo provádějí razie proti domnělé síti buněk. Operace jsou rozhodné a počet mrtvých vysoký. Každý úspěšný nájezd povstání o něco více oslabí a každý nájezd, který zasáhne svatbu, jim naopak daruje generaci nových rekrutů." # todo: NEW TRANSLATION
 SIA_pacification_complete: "Pacifikace dokončena" # todo: NEW TRANSLATION
 SIA_pacification_complete_desc: "Silniční bomby umlkly a kontrolní stanoviště zmizela. Mešity jsou sledovány, školy monitorovány a křivda pod tichem nezemřela. Zbraně ztichly, ale žhavé uhlíky zůstávají." # todo: NEW TRANSLATION
 SIA_royal_development_projects: "Královské rozvojové projekty" # todo: NEW TRANSLATION
 SIA_royal_development_projects_desc: "Z iniciativy krále je na jih přenesen rozvojový model koruny: zavlažování, zemědělství, silnice a družstva podporovaná královským dvorem. Poselství zní, že pro malajsko-muslimský jih zajišťuje výsledky monarchie, nikoli povstání. Patronát a přítomnost, nejen hlídky." # todo: NEW TRANSLATION
 SIA_isoc_southern_command: "Jižní velitelství ISOC" # todo: NEW TRANSLATION
 SIA_isoc_southern_command_desc: "Velitelství operací vnitřní bezpečnosti přebírá jednotné velení nad jižním bojištěm. Civilně-vojenská koordinace, slučování zpravodajských informací i aparát měkké síly jsou nyní pod jednou střechou. Pokud je síť ISOC již vyspělá, může se jižní velitelství přesunout od reakcí k předvídání." # todo: NEW TRANSLATION
 SIA_winning_hearts_royally: "Královské získávání srdcí" # todo: NEW TRANSLATION
 SIA_winning_hearts_royally_desc: "Stipendia, renovace mešit, rozvojové zóny s halal certifikací a záměrné začleňování místních malajsko-muslimských představitelů do systému patronátu. Stát nepřichází jako okupant, ale jako dobrodinec, a kalkulace mladých mužů se pomalu a místy mění." # todo: NEW TRANSLATION
 SIA_southern_calm: "Jižní klid" # todo: NEW TRANSLATION
 SIA_southern_calm_desc: "Násilí ustoupilo do kontrolovaného a sledovaného ticha. Neexistuje smlouva ani autonomie, přesto provincie fungují a královská záštita trvá. Klid udržovaný přítomností a patronátem." # todo: NEW TRANSLATION
 SIA_peace_dialogue_initiative: "Iniciativa mírového dialogu" # todo: NEW TRANSLATION
 SIA_peace_dialogue_initiative_desc: "Bangkok formálně otevírá malajsijský kanál za účasti Malajsie jako prostředníka. Stát poprvé usedá ke stolu s muži, které pronásledoval, a připouští, že budoucnost jihu je otázkou vyjednávání, nikoli pouze síly. Doma to stojí politický kapitál, ale otevírá cestu, kterou kulky nikdy otevřít nemohly." # todo: NEW TRANSLATION
 SIA_mara_patani_talks: "Jednání s MARA Patani" # todo: NEW TRANSLATION
 SIA_mara_patani_talks_desc: "Formální jednání se zastřešující skupinou MARA Patani začínají vážně. Na stole jsou opatření k budování důvěry, bezpečné zóny a skutečný rámec příměří. Kuala Lumpur se zapojuje a povstalecké vedení, roztříštěné, ale skutečné, začíná věřit, že dohoda je možná." # todo: NEW TRANSLATION
 SIA_autonomy_framework: "Rámec zvláštní autonomie" # todo: NEW TRANSLATION
 SIA_autonomy_framework_desc: "Vyjednavači připravují zákon o zvláštní správě tří provincií s volenou regionální radou, vzděláváním v místních jazycích, náboženskými soudy a podílem rozvojových příjmů ponechaným na jihu. Jde o nejdalekosáhlejší ústupek v dějinách Království a bangkocký establishment již mobilizuje proti němu." # todo: NEW TRANSLATION
 SIA_pattani_peace_accord: "Mírová dohoda z Pattani" # todo: NEW TRANSLATION
 SIA_pattani_peace_accord_desc: "Podepsaná dohoda ukončuje nejdelší povstání v moderních dějinách Království. Jih získává určitou míru samosprávy v rámci unitárního Thajska, zbraně jsou odevzdány a vysídlení se vracejí. Je nedokonalá, sporná a historická. Konflikt skončil." # todo: NEW TRANSLATION
 SIA_ds_tier_to_1: "§GHluboký jih se uklidňuje na nízkou úroveň (úroveň 1, -2 % stability).§!" # todo: NEW TRANSLATION
 SIA_ds_tier_to_2: "§YNásilí v Pattani stoupá (úroveň 2, -4 % stability, -5 % politické moci).§!" # todo: NEW TRANSLATION
 SIA_ds_tier_to_3: "§RJih hoří (úroveň 3, -7 % stability, -10 % politické moci, -5 % podpory války).§!" # todo: NEW TRANSLATION
 SIA_ds_intensity_down: "§GIntenzita povstalců klesá o [?ds_delta] bodů.§!" # todo: NEW TRANSLATION
 SIA_ds_intensity_up: "§RIntenzita povstalců stoupá o [?ds_delta] bodů.§!" # todo: NEW TRANSLATION
 SIA_ds_grievance_up: "§RTvrdé metody prohlubují křivdu komunity o [?ds_grievance_delta]. Spolu s ní roste i hranice intenzity a konflikt již nelze vyčerpat pouze silou.§!" # todo: NEW TRANSLATION
 SIA_ds_grievance_down: "§GSkutečný ústupek zmírňuje křivdu komunity ([?ds_grievance_delta]). Hranice intenzity, na níž násilí spočívá, klesá a skutečné řešení se dostává na dosah.§!" # todo: NEW TRANSLATION
 SIA_iron_fist_doctrine_tt: "Zaplaví tři provincie vojáky.\n - Intenzita povstání §G-10§!\n - Riziko převratu §R+10§!\n - Výrazně prohloubí křivdu komunity a zvýší hranici, pod níž konflikt nikdy neklesne" # todo: NEW TRANSLATION
 SIA_martial_law_south_tt: "Mimořádný dekret nad Pattani, Jalou a Narathiwatem. Intenzita -8, prohloubí křivdu, názor Malajsie/Indonésie -." # todo: NEW TRANSLATION
 SIA_search_and_destroy_tt: "Razie proti ozbrojencům. Intenzita -12, prohloubí křivdu. Ke spuštění vyžaduje intenzitu na jihu pod 50. Hrozí zvěrstvo, které se obrátí proti nám." # todo: NEW TRANSLATION
 SIA_pacification_complete_tt: "Zbraně ztichnou, ale žhavé uhlíky zůstanou." # todo: NEW TRANSLATION
 SIA_royal_development_projects_tt: "Projekty z královské iniciativy na jihu. Intenzita -6, zmírní křivdu, +2 % stability, pokladna -3." # todo: NEW TRANSLATION
 SIA_isoc_southern_command_tt: "ISOC přebírá velení na jihu. Intenzita -7 (rychleji, pokud je síť ISOC aktivní), ale sledovací síť mírně podněcuje křivdu." # todo: NEW TRANSLATION
 SIA_winning_hearts_royally_tt: "Patronát a rozvoj. Intenzita -7, výrazně zmírní křivdu, +3 % stability. Ke spuštění vyžaduje intenzitu na jihu pod 40." # todo: NEW TRANSLATION
 SIA_southern_calm_tt: "Kontrolovaný a sledovaný klid pod královskou záštitou." # todo: NEW TRANSLATION
 SIA_peace_dialogue_initiative_tt: "Otevře malajsijský kanál. Intenzita -5, zmírní křivdu, politická moc -75, zahájí jednání." # todo: NEW TRANSLATION
 SIA_mara_patani_talks_tt: "Formální jednání s MARA Patani. Intenzita -8, výrazně zmírní křivdu, názor Malajsie +, vyžaduje 45% stabilitu." # todo: NEW TRANSLATION
 SIA_autonomy_framework_tt: "Připraví zákon o zvláštní zóně. Establishment se postaví na odpor.\n - Intenzita povstání §G-7§!\n - Nejhlubší snížení křivdy komunity ze všech možností\n - Ke spuštění vyžaduje intenzitu na jihu pod §Y35§!" # todo: NEW TRANSLATION
 SIA_pattani_peace_accord_tt: "Podepsaná dohoda a cesta k autonomii. Konflikt končí." # todo: NEW TRANSLATION
 SIA_anti_narcotics_bureau: "Úřad pro boj proti narkotikům" # todo: NEW TRANSLATION
 SIA_anti_narcotics_bureau_desc: "Thajský Úřad rady pro kontrolu narkotik je rozšířen a získává pravomoci: vyhrazený rozpočet, chráněné vyšetřovací pravomoci a formální mandát k pronásledování pašeráckých sítí namísto pouličních dealerů. Úřad cílí na celý dodavatelský řetězec, od laboratoří ve Šanském státě až po distribuční centra v Bangkoku." # todo: NEW TRANSLATION
 SIA_golden_triangle_interdiction: "Zastavení obchodu ve Zlatém trojúhelníku" # todo: NEW TRANSLATION
 SIA_golden_triangle_interdiction_desc: "Trojmezí, kde se setkávají Thajsko, Myanmar a Laos, je zdrojem většiny heroinu a metamfetaminu zaplavujících thajská města a proudících na světové trhy. Hraniční hlídky jsou posíleny, letecký dohled rozšířen a vzniká společná pracovní skupina se šanskými milicemi, která má zásilky zadržet ještě před překročením Mekongu. Drogoví bossové se přizpůsobí, jako vždy, ale náklady se zvýší." # todo: NEW TRANSLATION
 SIA_golden_triangle_interdiction_tt: "Naruší pašerácké trasy přes Mekong a upevní sevření Království nad severem." # todo: NEW TRANSLATION
 SIA_anti_graft_push: "Tažení proti korupci" # todo: NEW TRANSLATION
 SIA_anti_graft_push_desc: "Národní komise pro boj proti korupci získává pravomoci díky rozšířenému vyšetřovacímu mandátu, chráněnému rozpočtu a právní ochraně oznamovatelů. Jako první jsou zacíleny zneužívání zakázek v obraně, stavebnictví a celnictví — tři nejvýnosnější kanály korupce. Čisté zadávání zakázek se buduje pomaleji, než se upevňovalo staré uspořádání. Prosazení reformy spotřebuje politický kapitál a zneklidní veřejnost zvyklou na staré pořádky." # todo: NEW TRANSLATION
 SIA_transparency_watchdog: "Dozor nad transparentností" # todo: NEW TRANSLATION
 SIA_transparency_watchdog_desc: "Je zřízen nezávislý Úřad fiskální transparentnosti, který podléhá přímo parlamentu, nikoli ministerstvu financí. Povinné zveřejňování majetku vyšších úředníků, zveřejňování veřejných zakázek v reálném čase a občanský auditní portál uzavírají mezery, které umožňovaly přetrvávat systematickému odčerpávání renty. Korupce nezmizí, ale její udržování se měřitelně prodraží — a po šest měsíců budou sítě, které úřad odhalí, vzdorovat prostřednictvím procedur a průtahů." # todo: NEW TRANSLATION
 SIA_watchdog_backlash: "Systém vrací úder" # todo: NEW TRANSLATION
 SIA_watchdog_backlash_desc: "Sítě odhalené novým režimem transparentnosti nezmizely. Po šest měsíců budou reformám vzdorovat prostřednictvím procedur, průtahů a tichých obstrukcí, čímž oslabí politickou moc a v provinciích, které jsou s nimi nejvíce propletené, i důvěru veřejnosti." # todo: NEW TRANSLATION
 SIA_decentralize_governance: "Posílit provincie" # todo: NEW TRANSLATION
 SIA_decentralize_governance_desc: "Po tažení proti korupci jsou pravomoci správy a přidělování rozpočtu přesunuty z Bangkoku do provincií. Provinční správní organizace získávají širší mandáty, volení guvernéři kontrolují výdaje na místní infrastrukturu a Chiang Mai, Khon Kaen a Songkhla se stávají skutečnými druhotnými centry hospodářské aktivity. Růst se soustřeďuje pomaleji, ale klidnější a stabilnější cesta udržuje zemi pevnou." # todo: NEW TRANSLATION
 SIA_bangkok_primacy: "Nejprve Bangkok" # todo: NEW TRANSLATION
 SIA_bangkok_primacy_desc: "Výnosy z boje proti korupci jsou znovu investovány do hlavního města. Průmyslové čtvrti Bangkoku jsou modernizovány, výzkumné instituce soustředěny a veřejná doprava rozšířena. Efektivita a výzkumný výkon prudce rostou, kritici však upozorňují, že prosperita se hromadí ve městě s deseti miliony obyvatel, zatímco provincie čekají — a odpor, který to plodí, skutečně zhoršuje náladu v zemi." # todo: NEW TRANSLATION
 SIA_asean_hegemony: "Hegemonie ASEAN" # todo: NEW TRANSLATION
 SIA_asean_hegemony_desc: "Projekt Velkého Thajska je na pevnině dokončen. Nyní Království obrací svůj pohled ke zbytku jihovýchodní Asie. ASEAN byl vždy v duchu thajským projektem. Nechť se jím stane i ve skutečnosti, v případě nutnosti mečem. Generální štáb připravuje plány na podrobení souostroví a městského státu." # todo: NEW TRANSLATION
 SIA_maritime_claims: "Námořní hranice" # todo: NEW TRANSLATION
 SIA_maritime_claims_desc: "Za šíjí leží velké souostrovní státy — Manila, Jakarta a na ropu bohatý sultanát Brunej. Rozvoj námořní síly bude vyžadovat plnou váhu Královského thajského námořnictva a námořní pěchoty. Admiralitní štáb začíná plánovat obojživelné operace přes Jihočínské moře a přístupy k Jávě." # todo: NEW TRANSLATION
 SIA_maritime_claims_threat: "Thajské námořní zbrojení v souostroví" # todo: NEW TRANSLATION
 SIA_claim_philippines: "Podrobit Filipíny" # todo: NEW TRANSLATION
 SIA_claim_philippines_desc: "Filipínské souostroví ovládá východní přístupy k Jihočínskému moři. Přivedení Manily pod správu Bangkoku zajistí námořní křídlo a práci sta milionů Filipínců pro nový řád. Uplatníme svůj nárok na každý ostrov Republiky." # todo: NEW TRANSLATION
 SIA_claim_indonesia: "Podrobit Indonésii" # todo: NEW TRANSLATION
 SIA_claim_indonesia_desc: "Indonésie je obrem jihu — rozlehlým, lidnatým a bohatým na zdroje. Aby Bangkok ovládl ASEAN, musí ovládnout Jakartu. Tažení bude dlouhé a ostrovů bude mnoho, ale odměnou je největší ekonomika a populace jihovýchodní Asie." # todo: NEW TRANSLATION
 SIA_claim_brunei: "Zmocnit se Bruneje" # todo: NEW TRANSLATION
 SIA_claim_brunei_desc: "Malý Brunej leží na jedněch z nejbohatších ložisek uhlovodíků v regionu. Bohatství sultanátu a jeho strategická poloha na Borneu z něj činí neodolatelnou kořist. Přistoupíme k začlenění sultanátu do Království." # todo: NEW TRANSLATION
 SIA_mainland_claims: "Uspořádání pevniny" # todo: NEW TRANSLATION
 SIA_mainland_claims_desc: "Na pevnině dosud nepoklekly dvě mocnosti. Vietnam, starý rival za Annamitským pohořím, a Singapur, bohatý městský stát střežící Malacký průliv. Oba musí být přivedeni k poslušnosti, aby byla thajská převaha v jihovýchodní Asii úplná." # todo: NEW TRANSLATION
 SIA_mainland_claims_threat: "Thajská mobilizace proti posledním pevninským odpůrcům" # todo: NEW TRANSLATION
 SIA_claim_vietnam: "Podrobit Vietnam" # todo: NEW TRANSLATION
 SIA_claim_vietnam_desc: "Vietnam dlouhodobě soupeří s Thajskem o pevninskou jihovýchodní Asii, od dvorů starého Siamu po vražedná pole dvacátého století. Nyní bude historické soupeření rozhodnuto. Uplatníme svůj nárok od Mekongu až k annamitskému pobřeží." # todo: NEW TRANSLATION
 SIA_claim_singapore: "Zmocnit se Singapuru" # todo: NEW TRANSLATION
 SIA_claim_singapore_desc: "Singapur je klenotem průlivu, finanční velmocí a strážcem nejrušnější námořní trasy světa. Kdo drží Lví město, drží hrdlo asijského obchodu. Přeměníme ho v thajské území." # todo: NEW TRANSLATION
 SIA_asean_protector: "Ochránce ASEAN" # todo: NEW TRANSLATION
 SIA_asean_protector_tt: "Cesta partnerství je otevřena každé vládě, včetně mandátu §YVelkého Thajska§!." # todo: NEW TRANSLATION
 SIA_asean_protector_desc: "Velké Thajsko nemusí být říší dobyvačných válek. Po zajištění pevniny se Království může místo toho stát garantem bezpečnosti jihovýchodní Asie — benevolentním hegemonem, který své sousedy chrání, namísto aby je anektoval. Bangkok rozšiřuje svou ochranu po celém regionu a spojuje ASEAN s thajskou korunou aliancí, nikoli okupací." # todo: NEW TRANSLATION
 SIA_guarantee_maritime: "Štít souostroví" # todo: NEW TRANSLATION
 SIA_guarantee_maritime_desc: "Thajsko poskytuje formální bezpečnostní záruky námořním státům — Filipínám, Indonésii a Bruneji. Královské thajské námořnictvo se zaručí za jejich nezávislost a Bangkok se na oplátku stane nepostradatelnou mocností jižních moří." # todo: NEW TRANSLATION
 SIA_guarantee_mainland: "Strážce pevniny" # todo: NEW TRANSLATION
 SIA_guarantee_mainland_desc: "Bangkok zaručuje bezpečnost Vietnamu, Singapuru a Malajsii a ukončuje staletí soupeření dohodou vedenou Thajskem. Starý nepřítel, bohatý městský stát i poloostrovní soused nyní nacházejí útočiště pod ochranou Království a pevnina žije v míru podle thajských podmínek." # todo: NEW TRANSLATION
 SIA_guarantee_indochina: "Deštník nad Indočínou" # todo: NEW TRANSLATION
 SIA_guarantee_indochina_desc: "Nejchudší a nejzranitelnější sousedé Thajska jsou přesně ti, které hegemon obvykle přehlíží. Bangkok jim přesto poskytne záruky: Laosu, Kambodži a Myanmaru i barmským pohraničním státům, kde existují. Ochrana, která dosáhne k nejslabším, je jediným druhem ochrany, který dokazuje, že Království myslí svá slova vážně." # todo: NEW TRANSLATION
 SIA_protector_of_asean_focus: "Jeden ASEAN, jeden štít" # todo: NEW TRANSLATION
 SIA_protector_of_asean_focus_desc: "Jediný podepsaný ochranný deštník stačí ke změně politické dynamiky regionu. Bez ohledu na to, kterou záruku Bangkok rozšířil jako první, Království nyní slouží jako ochránce jihovýchodní Asie a bezpečnostní architektura vedená Thajskem začíná nahrazovat starou rovnováhu strachu. Obrana regionu se stává nedělitelnou a Bangkok drží její základní kámen." # todo: NEW TRANSLATION
 SIA_professional_officer_corps_focus: "Profesionální důstojnický sbor" # todo: NEW TRANSLATION
 SIA_professional_officer_corps_focus_desc: "Reformní frakce vítězí v argumentaci. Povýšení podle schopností, skutečná cesta přes vojenské školy a velitelská kultura založená na doktríně, nikoli patronátu. Zvyk převratů slábne, když se armáda učí být hrdá na vojenství místo politiky." # todo: NEW TRANSLATION
 SIA_martial_prestige_focus: "Sláva meče" # todo: NEW TRANSLATION
 SIA_martial_prestige_focus_desc: "Tradicionalisté vítězí. Ozbrojené síly jsou oslavovány jako duše národa a přehlídkové prostranství je stejně posvátné jako chrám. Morálka a bojový duch prudce rostou, ale kult uniformy udržuje generály blízko centra moci." # todo: NEW TRANSLATION
 SIA_jointness_reform: "Reforma společného velení" # todo: NEW TRANSLATION
 SIA_jointness_reform_desc: "Společné velení spojuje tři složky do jediného bojového nástroje. Sloučením štábů, sdílením doktrín a sjednocením řetězce velení se paralelní velitelská struktura mění v soudržnou sílu schopnou operací ve více doménách." # todo: NEW TRANSLATION
 SIA_defense_export_office: "Úřad pro vývoz obranné techniky" # todo: NEW TRANSLATION
 SIA_defense_export_office_desc: "Specializovaná agentura přivádí systémy thajské výroby na světový trh, zprostředkovává kontrakty, zajišťuje financování a mění obranně-průmyslovou základnu ze zátěže rozpočtu ve zdroj příjmů." # todo: NEW TRANSLATION
 SIA_self_reliant_defense_base: "Soběstačná obranná základna" # todo: NEW TRANSLATION
 SIA_self_reliant_defense_base_desc: "Nové zbrojovky a prohloubený dodavatelský řetězec osvobozují Království od závislosti na zahraničních dodavatelích. Thajsko dokáže vyzbrojit sebe i své zákazníky z vlastních továren, vlastními návrhy a podle vlastního harmonogramu." # todo: NEW TRANSLATION
 SIA_total_defense_doctrine: "Doktrína totální obrany" # todo: NEW TRANSLATION
 SIA_total_defense_doctrine_desc: "Obrana se stává celonárodním úsilím s rozšířenou brannou povinností, pravidelnými cvičeními civilní obrany a posíleným domácím zázemím. Království připravuje nejen armádu, ale celou společnost odhodlanou vzdorovat." # todo: NEW TRANSLATION
 SIA_doctrine_professional_tt: "Vylepší ideu §YProfesionální síly§! na další úroveň a zaváže Království k cestě profesionalizace." # todo: NEW TRANSLATION
 SIA_doctrine_prestige_tt: "Udělí §YBojovou slávu§! a zaváže Království k cestě prestiže, s vysokou podporou války a velitelskou mocí za cenu stability." # todo: NEW TRANSLATION
 SIA_national_rnd_network: "Vybudovat vědecké parky" # todo: NEW TRANSLATION
 SIA_national_rnd_network_desc: "Veřejné laboratoře, partnerství s univerzitami a specializovaný vědecký park v Pathum Thani dávají Království vlastní výzkumnou základnu. Národní agentura pro rozvoj vědy a technologií ukotvuje síť výzkumných a vývojových zařízení, která urychluje zavádění technologií a posouvá celou ekonomiku k průmyslu s vyšší přidanou hodnotou." # todo: NEW TRANSLATION
 SIA_civilian_rnd_center: "Civilní výzkumné a vývojové centrum" # todo: NEW TRANSLATION
 SIA_civilian_rnd_center_desc: "Specializované civilní výzkumné a prototypovací zařízení s laboratořemi, zkušebními stoly a skupinou inženýrů, kteří mohou pracovat na čemkoli, co Království příště potřebuje. Čtvrté výzkumné centrum jako protiváha jediné námořní loděnici, se kterou Království začínalo, a prostor pro vlastní projekty." # todo: NEW TRANSLATION
 SIA_air_rnd_center: "Výzkumné a vývojové centrum letectví" # todo: NEW TRANSLATION
 SIA_air_rnd_center_desc: "Letecké a avionické zařízení s aerodynamickými tunely, vybaveným letovým zkušebním prostorem a inženýry, kteří je dokážou provozovat. Thajský průmysl získává zázemí pro vývoj prototypů leteckých systémů doma, místo aby nakupoval hotové výrobky ze zahraničí." # todo: NEW TRANSLATION
 SIA_army_rnd_center: "Výzkumné a vývojové centrum pozemního vojenství" # todo: NEW TRANSLATION
 SIA_army_rnd_center_desc: "Zkušební polygon pozemních systémů s testovacími drahami pro obrněnou techniku, střelnicemi a konstrukční kanceláří. Armáda může vyvíjet a prototypovat vlastní vozidla a vybavení, místo aby čekala na zahraniční dodavatele a jejich podmínky." # todo: NEW TRANSLATION
 SIA_gistda_space_agency: "Posílit GISTDA" # todo: NEW TRANSLATION
 SIA_gistda_space_agency_desc: "Agentura pro rozvoj geoinformatiky a kosmických technologií dostává skutečný mandát a skutečný rozpočet. GISTDA, založená ke zpracování satelitních dat, se stává kosmickou institucí Království: provozuje pozemní stanice, školí inženýry a poskytuje thajskému výzkumu výhled na vše z výšky. Malý kosmický program již není zahraničním luxusem, ale národní schopností." # todo: NEW TRANSLATION
 SIA_theos_earth_observation: "Pozorování Země pomocí THEOS" # todo: NEW TRANSLATION
 SIA_theos_earth_observation_desc: "První thajská družice pro pozorování Země, THEOS, otevírá Království vlastní oči na oběžné dráze, mapuje území, sleduje povodně a úrodu a poskytuje zpravodajským službám snímky, které jim žádný soused nemůže upřít. Navazující program prohlubuje odbornost agentury v optice, přenosu dat a zpracování snímků a mění surové průlety v použitelný průzkum." # todo: NEW TRANSLATION
 SIA_space_krenovation_park: "Kosmický inovační park" # todo: NEW TRANSLATION
 SIA_space_krenovation_park_desc: "Na Východním pobřeží vyrůstá letecký a kosmický průmyslový park s čistými prostory, montážními halami a dodavatelským řetězcem pro družicové součástky a malé nosné rakety. Z někdejší výzkumné agentury se nyní stává základ domácího kosmického průmyslu, který přitahuje soukromé firmy a dává thajskému inženýrství vlastní odvětví s vysokou přidanou hodnotou." # todo: NEW TRANSLATION
 SIA_sovereign_launch_capability: "Suverénní schopnost vynášení" # todo: NEW TRANSLATION
 SIA_sovereign_launch_capability_desc: "Království se rozhoduje uzavřít poslední mezeru: schopnost navrhnout, vyrobit a vynést na oběžnou dráhu vlastní družice bez svolení kohokoli jiného. Domácí program nosných raket a družicových konstelací korunuje dvě desetiletí práce a řadí Thajsko mezi hrstku států se suverénním opěrným bodem ve vesmíru a zpravodajským dosahem, který se nikomu jinému nezodpovídá." # todo: NEW TRANSLATION
 SIA_ptt_energy_champion: "PTT, národní energetický šampion" # todo: NEW TRANSLATION
 SIA_ptt_energy_champion_desc: "Státní energetická společnost vstupuje na burzu a je uvolněna jako obchodní gigant. S kapitálem z IPO a mandátem k průzkumu od Thajského zálivu po Myanmar zajišťuje PTT dodávky paliva pro Království a stává se jeho největší společností." # todo: NEW TRANSLATION
 SIA_scg_industrial_titan: "Siam Cement Group" # todo: NEW TRANSLATION
 SIA_scg_industrial_titan_desc: "Nejstarší a největší průmyslový konglomerát Království expanduje z cementu do petrochemie, stavebních materiálů a obalů. Zakázky SCG financují stavební boom a ukotvují domácí dodavatelský řetězec, bez něhož se žádný infrastrukturní program neobejde. Spolu s tím rostou i daňové příjmy, i když se skupina stále více opírá o povolovací byrokracii." # todo: NEW TRANSLATION
 SIA_packaging_empire: "Obalové impérium" # todo: NEW TRANSLATION
 SIA_packaging_empire_desc: "Obalová divize SCG vstupuje na burzu a nakupuje po celém regionu, začleňuje papírny od Indonésie po Vietnam, až tiskne a lisuje pro polovinu jihovýchodní Asie. Heslem je oběhové hospodářství: recyklované vlákno, lehčí plasty, nižší uhlíková stopa. Náklady nesou malé tiskárny a výrobci krabic, které skupina vykoupí nebo převálcuje cenami." # todo: NEW TRANSLATION
 SIA_cp_agribusiness_giant: "Charoen Pokphand Group" # todo: NEW TRANSLATION
 SIA_cp_agribusiness_giant_desc: "Od továren na krmiva po 7-Eleven se konglomerát CP stává thajským kolosem zemědělství a maloobchodu. Smluvní zemědělství zvyšuje venkovské příjmy a plní regály, zatímco exportní síla CP nese thajské potraviny na každý asijský trh. Produktivita komercializovaného zemědělství roste napříč sítí smluvních farem a v rýžovém pásu Isánu vyrůstá druhý okres." # todo: NEW TRANSLATION
 SIA_buffer_states: "Pás nárazníkových států" # todo: NEW TRANSLATION
 SIA_buffer_states_desc: "Namísto pohlcení je Thajsko udrží Šany a Kareny naživu a ozbrojené — jako pás přátelských nárazníků, který pohltí barmský tlak dříve, než dosáhne Království. Přeshraniční zásobovací linie, výcvikové tábory a tiché záruky mění pohraniční povstalce ve štít." # todo: NEW TRANSLATION
 SIA_protectorate_doctrine: "Doktrína protektorátu" # todo: NEW TRANSLATION
 SIA_protectorate_doctrine_desc: "Generální štáb se rozhoduje pro mírnější nástroj impéria — ne dobytí, ale vazalství. Pohraniční státečky budou podřízeny thajské ochraně jako klientské státy a jejich prapory zůstanou vlát nad hlavními městy, která odpovídají Bangkoku." # todo: NEW TRANSLATION
 SIA_annexation_doctrine: "Doktrína anexe" # todo: NEW TRANSLATION
 SIA_annexation_doctrine_desc: "Žádná polovičatá řešení. Pohraniční oblasti budou přímo zabrány, jejich území začleněno do Království a separatistické vlády rozpuštěny. Bangkok vznáší nároky na šanské a karenské srdce a připravuje armádu na jejich prosazení." # todo: NEW TRANSLATION
 SIA_subdue_the_shan: "Podrobit Šany" # todo: NEW TRANSLATION
 SIA_subdue_the_shan_desc: "Královská thajská armáda postupuje do Jižního Šanského státu. Zda skončí jako thajský protektorát, nebo thajská provincie, záleží na zvolené doktríně. V každém případě však bude moc Bangkoku sahat až k Salwině." # todo: NEW TRANSLATION
 SIA_subdue_the_karen: "Podrobit Kareny" # todo: NEW TRANSLATION
 SIA_subdue_the_karen_desc: "Thajské síly překračují karenské kopce. Desetiletí útočiště a tichého patronátu končí a Království nyní přichází jako pán — aby podle politiky loutkový stát vytvořilo, nebo území anektovalo." # todo: NEW TRANSLATION
 SIA_burma_breakaway_question: "Odštěpenecké státy" # todo: NEW TRANSLATION
 SIA_burma_breakaway_question_desc: "Na druhé straně Salwiny se barmská moc rozpadla v mozaiku ozbrojených státečků — Šany, Karenové a Wa. Jsou slabí, rozdělení a zcela v dosahu Thajska. Bangkok musí rozhodnout, čím mají tyto odtržené země být pro Království. Štítem, kořistí, nebo problémem ke správě." # todo: NEW TRANSLATION
 SIA_subdue_the_wa: "Podrobit Wa" # todo: NEW TRANSLATION
 SIA_subdue_the_wa_desc: "United Wa State Army řídí nejmocnější a narkotiky nejvíce prosycenou z odštěpeneckých armád. Přivést kopce Wa k poslušnosti znamená tvrdý boj, ale uzavře pašeráckou trasu na prahu Království a zasadí thajskou vlajku hluboko do barmského pohraničí." # todo: NEW TRANSLATION
 SIA_rta_looks_abroad: "Šedesát let s M48" # todo: NEW TRANSLATION
 SIA_rta_looks_abroad_desc: "Královská thajská armáda stále provozuje tanky a transportéry z jiného století. Přezbrojení již není otázkou zda, ale čí ocel projede branami v Koratu a jaké podmínky budou s ní svařeny. Nová výrobní linka vzniká všude, kde to kapacita dovolí." # todo: NEW TRANSLATION
 SIA_stryker_brigades: "Kola Západu" # todo: NEW TRANSLATION
 SIA_stryker_brigades_desc: "Brigády Stryker, americká doktrína a logistický řetězec zapojený přímo do nejschopnější armády světa. Výbava je vynikající a interoperabilita neocenitelná, ale každý náboj se platí dolary i ústupky Washingtonu." # todo: NEW TRANSLATION
 SIA_eda_blackhawks: "Výbava po supervelmoci" # todo: NEW TRANSLATION
 SIA_eda_blackhawks_desc: "Prostřednictvím programů Excess Defense Articles a Foreign Military Sales přilétají repasované Black Hawky a Cobry za zlomek katalogové ceny. Draky již létaly, ale leteckomobilní dosah za dostupnou cenu je výhodou, kterou aliance umožňuje." # todo: NEW TRANSLATION
 SIA_vn1_mechanization: "Obrněný transportér pro každou četu" # todo: NEW TRANSLATION
 SIA_vn1_mechanization_desc: "Transportéry VN1 a VN16 z čínské výrobní linky, po stovkách, za cenu, kterou by na Západě stála hrstka vozidel. Pěchota konečně jede a továrny, které je vyrábějí, jsou zaplaceny ještě před koncem roku." # todo: NEW TRANSLATION
 SIA_norinco_fires: "Kompletní katalog NORINCO" # todo: NEW TRANSLATION
 SIA_norinco_fires_desc: "Houfnice SH1, raketové dělostřelectvo SR5, celý katalog za cenu celého balíčku. Palebná síla je skutečná, stejně jako fronty na náhradní díly a převodovky selhávající v poli. Levná ocel nedá zásobovači spát." # todo: NEW TRANSLATION
 SIA_tavor_standard: "Vlastní puška" # todo: NEW TRANSLATION
 SIA_tavor_standard_desc: "Licencovaná výroba Tavorů mění thajské továrny ve zdroj standardní pušky armády. Žádné embargo, žádné pořadníky, žádné zahraniční veto nad tím, koho vyzbrojíme — jen první kámen arzenálu, který odpovídá výhradně Bangkoku." # todo: NEW TRANSLATION
 SIA_oplot_and_rotors: "Bazarní diplomacie" # todo: NEW TRANSLATION
 SIA_oplot_and_rotors_desc: "Ukrajinské korby Oplot, ruské rotory Mi-17, cokoli trh nabízí kupci, který si nevybírá stranu. Schopnosti proudí ze všech směrů najednou a dráždí Washington i Peking stejnou, zvládnutelnou měrou." # todo: NEW TRANSLATION
 SIA_dti_black_widow: "Černá vdova" # todo: NEW TRANSLATION
 SIA_dti_black_widow_desc: "Vlastní osmikolové vozidlo Defence Technology Institute spolu s bojově prověřeným First Win od Chaiseri. Navrženo v Thajsku, vyrobeno v Thajsku a dost dobré na to, aby ho chtěli kupovat i ostatní. Arzenál se začíná sám financovat." # todo: NEW TRANSLATION
 SIA_first_army_modernized: "Nová Královská thajská armáda" # todo: NEW TRANSLATION
 SIA_first_army_modernized_desc: "Ať už cesta přezbrojení vedla kamkoli, výsledek nyní konečně stojí na přehlídkovém prostranství. Moderní Královská thajská armáda, znovu vybavená, přeškolená a připravená na století, v němž skutečně musí bojovat." # todo: NEW TRANSLATION
 SIA_gripen_globaleye: "Oči celé oblohy" # todo: NEW TRANSLATION
 SIA_gripen_globaleye_desc: "GlobalEye AEW&C od Saabu mění hrstku Gripenů v síťovanou sílu, která uvidí první a vystřelí první. Palubní radar je násobičem síly, díky němuž malé letectvo udeří hluboko nad svou početní váhu." # todo: NEW TRANSLATION
 SIA_j10_squadrons: "Draci nad Don Mueang" # todo: NEW TRANSLATION
 SIA_j10_squadrons_desc: "Víceúčelové stíhačky J-10CE po letkách za cenu, které Washington nikdy nemohl konkurovat a kterou Washington nikdy neodpustí. Volba Čcheng-tu místo Fort Worthu přepojí oblohu Království — i jeho spojenectví." # todo: NEW TRANSLATION
 SIA_hq9_air_defense: "Střecha z raket" # todo: NEW TRANSLATION
 SIA_hq9_air_defense_desc: "Dálkové protiletadlové baterie HQ-9 a FK-3 vytvářejí nad Centrální nížinou deštník. Levný, hustý a integrovaný. Odepření prostoru po čínsku." # todo: NEW TRANSLATION
 SIA_wing_loong_uav: "Trpěliví lovci" # todo: NEW TRANSLATION
 SIA_wing_loong_uav_desc: "Drony Wing Loong a řady CH vydrží kroužit celý den a na povel udeří. Masový bezpilotní průzkum a přesné údery za cenu jediné pilotované letky." # todo: NEW TRANSLATION
 SIA_f5th_super_tigris: "Nové triky starého tygra" # todo: NEW TRANSLATION
 SIA_f5th_super_tigris_desc: "Izraelská avionika, radar AESA a střely Python-5 mění úctyhodný F-5 na F-5TH „Super Tigris“. Není to nový letoun, ale bojová síla vyždímaná z draků, které již byly zaplaceny, bez dluhu vůči kterékoli supervelmoci." # todo: NEW TRANSLATION
 SIA_dti_uav_command: "Suverénní oči" # todo: NEW TRANSLATION
 SIA_dti_uav_command_desc: "Dronové křídlo Defence Technology Institute navržené a provozované v zemi poskytuje Thajsku vlastní obraz průzkumu i výrobek k prodeji sousedům." # todo: NEW TRANSLATION
 SIA_air_dominance_doctrine: "Páni thajského nebe" # todo: NEW TRANSLATION
 SIA_air_dominance_doctrine_desc: "Ať už bylo vybaveno jakkoli, Královské thajské letectvo končí jako moderní, síťovaná a víceúčelová síla, pán vzdušného prostoru, který přísahalo bránit." # todo: NEW TRANSLATION
 SIA_korean_frigates: "Standard Bhumibol" # todo: NEW TRANSLATION
 SIA_korean_frigates_desc: "Západní volba pro flotilu. Moderní fregata DW3000 z Koreje se západními bojovými systémy, oblastní protivzdušnou obranou a nejschopnější hladinovou lodí, jakou flotila kdy provozovala. Kvalita má svou cenu a Soul ji uvádí v dolarech." # todo: NEW TRANSLATION
 SIA_chinese_engine_compromise: "Čínské srdce" # todo: NEW TRANSLATION
 SIA_chinese_engine_compromise_desc: "Německé motory nikdy nepřijdou a loď čeká již deset let. Přijměte čínský pohon CHD620 a ponorka konečně vypluje — levně, suverénně a s obdobím dětských nemocí, které budou inženýři rok proklínat." # todo: NEW TRANSLATION
 SIA_type071_flotilla: "Trupy z Hudongu" # todo: NEW TRANSLATION
 SIA_type071_flotilla_desc: "Výsadková doková loď Type 071E a skupina čínských hlídkových plavidel dají flotile přes noc obojživelnou složku za cenu, kterou by stál jediný západní trup." # todo: NEW TRANSLATION
 SIA_krabi_class_opv: "Vlastní kýly" # todo: NEW TRANSLATION
 SIA_krabi_class_opv_desc: "Nezávislá volba pro flotilu. Pobřežní hlídkové plavidlo třídy Krabi, postavené v Bangkok Dock, pokládá kýl suverénního loďařského průmyslu. Pomalu dozrává, ale odpovídá pouze samo sobě, nikoli zahraniční loděnici." # todo: NEW TRANSLATION
 SIA_european_propulsion: "Licencovaná srdce, thajské trupy" # todo: NEW TRANSLATION
 SIA_european_propulsion_desc: "Nákup, nikoli partnerství. Jednou nakoupit diesely MTU a bojové systémy v licenci, rozebrat je až na šroubky a zbytek postavit doma. Dovezené know-how pohlcené suverénním programem, který nic nedluží žádnému patronovi." # todo: NEW TRANSLATION
 SIA_naval_self_reliance: "Fregaty z Bangkok Dock" # todo: NEW TRANSLATION
 SIA_naval_self_reliance_desc: "Thajské loděnice nyní staví válečné lodě vlastní konstrukce a budují obranně-průmyslovou základnu, která se rozvíjí a exportuje. Flotila je konečně postavena doma." # todo: NEW TRANSLATION
 SIA_command_of_the_seas: "Dva zálivy, jedna flotila" # todo: NEW TRANSLATION
 SIA_command_of_the_seas_desc: "Ať už byla postavena jakkoli, Královské thajské námořnictvo nyní představuje skutečnou oceánskou sílu schopnou držet Thajský záliv a dosáhnout do Andamanského moře, velící mořím omývajícím dvě pobřeží Království." # todo: NEW TRANSLATION
 SIA_the_western_anchor: "Washingtonská kotva v Asii" # todo: NEW TRANSLATION
 SIA_the_western_anchor_desc: "Armáda, letectvo i námořnictvo nakoupené na Západě a aliance jako základní kámen národní obrany. Interoperabilita, sdílení zpravodajství a implicitní americká záruka výměnou za pevné místo ve washingtonské orbitě." # todo: NEW TRANSLATION
 SIA_the_bamboo_bloc: "Do dračího stínu" # todo: NEW TRANSLATION
 SIA_the_bamboo_bloc_desc: "Tři složky vybavené Pekingem činí z Thajska předního čínského klienta v oblasti zbrojení v regionu. Levná masová výroba, sdílený obraz C4ISR a mocný patron — za cenu důvěry Západu." # todo: NEW TRANSLATION
 SIA_strategic_autonomy: "Nikomu zavázáni" # todo: NEW TRANSLATION
 SIA_strategic_autonomy_desc: "Síla budovaná stále více doma a prodávaná do zahraničí. Defence Technology Institute se stává regionálním zbrojním domem a Království již nemusí kvůli prostředkům vlastní obrany odpovídat žádnému cizímu hlavnímu městu." # todo: NEW TRANSLATION
 SIA_the_bamboo_doctrine: "Ohýbat se ve větru" # todo: NEW TRANSLATION
 SIA_the_bamboo_doctrine_desc: "Švédské letouny, čínské tanky, ponorka z Pekingu a fregata ze Soulu. Thajsko nakupuje od všech a nepatří nikomu. Rákos, který se v bouři ohne, ji přežije. Nejstarší thajská strategie vtělená do sestavy ozbrojených sil." # todo: NEW TRANSLATION
 SIA_dual_use_threshold: "Práh dvojího užití" # todo: NEW TRANSLATION
 SIA_dual_use_threshold_desc: "Každý civilní energetický program obsahuje stejné mechanismy, které potřebuje zbrojní program. Tiše zvládnout palivový cyklus, s obohacováním uranu pod rouškou energetické nezávislosti, a ponechat Království všechny možnosti otevřené, aniž by zatím některou vyhlásilo." # todo: NEW TRANSLATION
 SIA_minimum_deterrent: "Minimální odstrašení" # todo: NEW TRANSLATION
 SIA_minimum_deterrent_desc: "Hrstka hlavic, nic víc — dost na to, aby žádný soused ani velmoc již nikdy nepovažovali Království za samozřejmost. Thajsko vstupuje do jaderného klubu za vlastních podmínek a vláda nyní musí nahlas rozhodnout, k čemu jeho bomby slouží." # todo: NEW TRANSLATION
 SIA_the_democrats_endure: "Demokraté přetrvávají" # todo: NEW TRANSLATION
 SIA_the_democrats_endure_desc: "Demokratická strana, nejstarší v Království, si udržuje kontrolu nad vládou místo toho, aby ustoupila populistické vlně. Žádný drtivý triumf, žádný charismatický miliardář, jen trpělivé a neokázalé vládnutí široké civilní koalice. Strana sází svou budoucnost na instituce, nikoli na jediného vůdce." # todo: NEW TRANSLATION
 SIA_chuan_clean_government: "Čistá vláda" # todo: NEW TRANSLATION
 SIA_chuan_clean_government_desc: "Pan Čistý přebírá kormidlo. Pověst osobní neúplatnosti se stává značkou strany — s otevřenými rozpočty, profesionálními ministerstvy a válkou proti obálkám. Nebude to okázalé, ale vytvoří to mechanismus, který promění poctivé vládnutí v trvalou voličskou základnu." # todo: NEW TRANSLATION
 SIA_rule_of_law: "Právní stát" # todo: NEW TRANSLATION
 SIA_rule_of_law_desc: "Vláda, která žije podle ústavy, k jejímuž dodržování se zavázala. Řádný proces, předvídatelná správa a soudy odpovídající zákonu, nikoli kasárnám. Každý převrat začíná pozastavením pravidel, a proto se Království učí je zachovávat." # todo: NEW TRANSLATION
 SIA_judicial_independence: "Nezávislé soudnictví" # todo: NEW TRANSLATION
 SIA_judicial_independence_desc: "Izolovat soudnictví od sítě paláce i generálů. Soud, na který nelze tlačit, je nejjistější brzdou cyklu rozpouštění a převratů a oblíbená zbraň establishmentu — soudní aktivismus — je otupena již u zdroje." # todo: NEW TRANSLATION
 SIA_strengthen_parliament: "Posílit parlament" # todo: NEW TRANSLATION
 SIA_strengthen_parliament_desc: "Dát volené komoře personál, výbory a postavení potřebné ke skutečnému vládnutí. Fungující zákonodárný sbor umožní straně vládnout hlasováním namísto mimořádných dekretů a dá veřejnosti podíl na výsledku každého zasedání." # todo: NEW TRANSLATION
 SIA_liberal_market_stewardship: "Správa liberálního trhu" # todo: NEW TRANSLATION
 SIA_liberal_market_stewardship_desc: "Stabilní měna, otevřený obchod a stát, který reguluje, místo aby utrácel. Demokraté nabízejí technokratickou protiváhu Thaksinově ekonomice, s růstem taženým financemi, exportem a soukromým podnikáním namísto venkovských rozdávání peněz." # todo: NEW TRANSLATION
 SIA_southern_stronghold: "Jižní bašta" # todo: NEW TRANSLATION
 SIA_southern_stronghold_desc: "Srdcem strany je jih a jih má své křivdy. Odpovězme na ně silnicemi, školami a klinikami namísto kontrolních stanovišť, financovanými z pokladny místo slibů na papíře. Mír prostřednictvím rozvoje udrží základnu loajální a připraví povstání o rekruty." # todo: NEW TRANSLATION
 SIA_coalition_government: "Koaliční vláda" # todo: NEW TRANSLATION
 SIA_coalition_government_desc: "Moc je sestavena obtížnou cestou — z mozaiky partnerů, regionálních bloků a malých stran sešitých do fungující většiny. Je pomalá a plná kompromisů, přesto jde o jedinou formu vlády, proti níž se tankům nejhůře zdůvodňuje postup. Volený řád přežívá sdílením moci." # todo: NEW TRANSLATION
 SIA_mature_democracy: "Vyspělá demokracie" # todo: NEW TRANSLATION
 SIA_mature_democracy_desc: "Království překračuje práh pokojného střídání moci s loajální opozicí a veřejností, která může považovat převraty za minulost. Instituce jsou důležitější než jakákoli kampaň: čistší správa a trvalá autorita, zaplacené pomalejším růstem preferencí, než jaký by přinesla širší koalice." # todo: NEW TRANSLATION
 SIA_grand_coalition: "Velká koalice" # todo: NEW TRANSLATION
 SIA_grand_coalition_desc: "Namísto boje se starým řádem jej pohltit. Demokraté se stávají volenou tváří konzervativního establishmentu, získávají vlastníky půdy a podnikatele, zatímco palác, byrokracie a obchodní kruhy vládnou prostřednictvím volebních uren namísto kasáren. Stabilita zakoupená konsensem, za cenu živení stejných patronátních sítí, proti nimž strana kdysi vystupovala." # todo: NEW TRANSLATION
 SIA_coalition_overhead: "Náklady koalice" # todo: NEW TRANSLATION
 SIA_coalition_overhead_desc: "Každý partner přivedený do velkého stanu chce svůj díl. Udržet koalici pohromadě stojí více politického kapitálu než kdy stálo samostatné vládnutí." # todo: NEW TRANSLATION
 SIA_democrat_revival: "Návrat Demokratů" # todo: NEW TRANSLATION
 SIA_democrat_revival_desc: "Ze samoty opoziční pustiny se strana vyškrábe zpět do premiérského úřadu prostřednictvím koaličního bazaru po roce 2019. Demokraté znovu vládnou — starší, pokoření a tentokrát odhodlaní zajistit, aby civilní řád vydržel." # todo: NEW TRANSLATION
 SIA_answer_thaksinomics: "Odpověď na Thaksinovu ekonomiku" # todo: NEW TRANSLATION
 SIA_answer_thaksinomics_desc: "Thaksinův génius spočíval ve sjednocení vesnic, protože Bangkok to nikdy nedokázal. Nepohrdejme vesnickým fondem. Vybudujme lepší. Demokratický program venkovských úvěrů, moratorium na dluhy zemědělců a levné zdravotnictví spuštěný dříve, než to dokáže Thai Rak Thai, otupí populistický apel u jeho zdroje, namísto aby přenechal venkov a získával moc zpět pouze prostřednictvím soudů.\n\n§GPopulistická vlna ustupuje.§!" # todo: NEW TRANSLATION
 SIA_pracha_wiwat: "Lidová agenda" # todo: NEW TRANSLATION
 SIA_pracha_wiwat_desc: "Pracha Wiwat je devět opatření představených jako novoroční dary. Bezplatná elektřina pro nejchudší domácnosti, dotace na vaření plynem, sociální podpora a registrace řidičů mototaxi a pouličních prodejců neformální ekonomiky a spořicí možnost pro pracovníky mimo systém. Důkaz, že liberálně-konzervativní strana dokáže reagovat na nouzi, aniž by zruinovala pokladnu.\n\n§GPopulistická vlna ustupuje.§!" # todo: NEW TRANSLATION
 SIA_broaden_the_coalition_desc: "Předejte ministerstva malým stranám a provinčním bossům výměnou za jejich mandáty. Cenou je rozhádaný kabinet plný handrkování (§Rpožadavky koalice§!), ale vytvoří parlamentní hráz, kterou žádná jediná populistická volební vlna neprorazí. §GPopulistická vlna prudce ustoupí.§!" # todo: NEW TRANSLATION
 SIA_democrat_machine_active: "Vláda stranického aparátu Demokratické strany" # todo: NEW TRANSLATION
 SIA_counter_messaging: "Proti populistickému poselství" # todo: NEW TRANSLATION
 SIA_counter_messaging_desc: "Odpovězte na populistickou rétoriku tam, kde ji lidé skutečně slyší: v ranních talk show, vesnických rozhlasových věžích a odborových sálech. Malý, opakovatelný tlak, který podkopává rozmach Pheu Thai." # todo: NEW TRANSLATION
 SIA_reconstruction_category: "Rozvoj znovu získaných území" # todo: NEW TRANSLATION
 SIA_reconstruction_category_desc: "Území dobytá na západní frontě nebo během tažení za hegemonii ASEAN jsou držena, ale dosud nebyla integrována. Uklidněte provincie, nalijte do nich peníze na obnovu a jakmile budou dostatečně klidné, prohlaste je přímo za součást národa." # todo: NEW TRANSLATION
 SIA_reconstruction_pacify: "Uklidnit provincie" # todo: NEW TRANSLATION
 SIA_reconstruction_pacify_desc: "Zaplavte okupované provincie správci, informátory a amnestijními programy. Poslušnost vzroste v každé provincii, kterou držíme, ale dosud jsme ji neintegrovali. Pomalá a trpělivá práce, ale základ, na němž stojí vše ostatní." # todo: NEW TRANSLATION
 SIA_reconstruction_develop: "Financovat obnovu" # todo: NEW TRANSLATION
 SIA_reconstruction_develop_desc: "Uvolněte prostředky na obnovu silnic, energetiky a veřejných staveb napříč znovu získanými územími. Infrastruktura a počet stavebních slotů vzroste v každé držené provincii, čímž se propojí s národním hospodářstvím a obyvatelstvo získá zájem na thajské vládě." # todo: NEW TRANSLATION
 SIA_reconstruction_integrate: "Vyhlásit znovusjednocené provincie" # todo: NEW TRANSLATION
 SIA_reconstruction_integrate_desc: "Tam, kde je poslušnost dostatečně vysoká, okupace končí a provincie se stávají thajskou půdou. Každá pacifikovaná provincie, kterou držíme, bude začleněna do Království jako jádro — trvalý zisk, který žádná mírová konference nemůže zvrátit." # todo: NEW TRANSLATION
 SIA_ghosts_5pct_tt: "§Y[Communist-State_L]§! má alespoň 5% popularitu." # todo: NEW TRANSLATION
 SIA_reform_5pct_tt: "§Y[socialism_L]§! má alespoň 5% popularitu." # todo: NEW TRANSLATION
 SIA_reform_trunk_entry_tt: "§Y[socialism_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_communist_trunk_entry_tt: "§Y[Communist-State_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_seize_power_gate_tt: "Vyhrajte generální stávku, aby vláda kapitulovala, nebo se nejprve odhodlejte k ozbrojenému boji." # todo: NEW TRANSLATION
 SIA_strike_momentum_tt: "§RTempo stávky [?strike_delta|0+]§! (nyní §Y[?ROOT.SIA_strike_momentum|0]§!/100). Při hodnotě 100 vláda kapituluje." # todo: NEW TRANSLATION
 SIA_general_strike_category: "Generální stávka" # todo: NEW TRANSLATION
 SIA_general_strike_category_desc: "Země se zastavila a hnutí tlačí na pád vlády. Zvyšte tempo stávky na 100 dříve, než uplyne 180 dní, a vláda kapituluje na pokojné cestě k moci. Pokud neuspějete, armáda stávku rozdrtí převratem.\n\n§RTempo stávky§!: [?ROOT.SIA_strike_momentum|0]/100" # todo: NEW TRANSLATION
 SIA_strike_mass_pickets: "Masové demonstrace" # todo: NEW TRANSLATION
 SIA_strike_mass_pickets_desc: "Postavte na hlídky desítky tisíc lidí a den za dnem udržujte náměstí. Levný a rychlý každodenní nástroj, který udržuje zemi ochromenou a zvyšuje tlak." # todo: NEW TRANSLATION
 SIA_strike_paralyze_transport: "Paralyzovat přístavy a železnice" # todo: NEW TRANSLATION
 SIA_strike_paralyze_transport_desc: "Financujte přístavní dělníky a železničáře ze stávkového fondu, dokud se do země ani z ní nic nepohybuje. Nejtěžší úder, který může hnutí zasadit, a také nejnákladnější na udržení." # todo: NEW TRANSLATION
 SIA_strike_win_the_conscripts: "Získat brance" # todo: NEW TRANSLATION
 SIA_strike_win_the_conscripts_desc: "Pošlete organizátory do kasáren. Každý branec, který nebude střílet do vlastních lidí, je jedním vojákem, na kterého generálové nemohou spoléhat, a kapitulace se přiblíží." # todo: NEW TRANSLATION
