 SIA_aligned_west_tt: "Přijaty nejméně dvě volby západního směřování (aktuálně §Y[?SIA_pick_west|0]§!)" # todo: NEW TRANSLATION
 SIA_aligned_china_tt: "Přijaty nejméně dvě volby čínského směřování (aktuálně §Y[?SIA_pick_china|0]§!)" # todo: NEW TRANSLATION
 SIA_aligned_self_tt: "Přijaty nejméně dvě volby soběstačnosti (aktuálně §Y[?SIA_pick_self|0]§!)" # todo: NEW TRANSLATION
 SIA_no_bloc_dominant_tt: "Žádný blok nebyl zvolen více než jednou. Západní §Y[?SIA_pick_west|0]§!, čínské §Y[?SIA_pick_china|0]§!, soběstačné §Y[?SIA_pick_self|0]§!" # todo: NEW TRANSLATION
 SIA_bamboo_east_gate_tt: "Nejsme zároveň pod vládou §Y[Nat_Autocracy_L]§! nebo §Y[Monarchist_L]§! a ve frakci se §Y[Spojené státy]§!." # todo: NEW TRANSLATION
 SIA_outlook_western_tt: "£western_outlook_campaign_cost_modifier_texticon obliba §YZápadního směřování§!: [?temp_outlook_increase|%+]\n" # todo: NEW TRANSLATION
