 SIA_asean_hegemony_government_tt: "Ani §Y[conservatism_L]§!, ani §Y[socialism_L]§! není vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_path_populist: "§Y[neutral_Social_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_path_royalist: "§Y[Nat_Autocracy_L]§! nebo §Y[Monarchist_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_path_reform: "§Y[socialism_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
