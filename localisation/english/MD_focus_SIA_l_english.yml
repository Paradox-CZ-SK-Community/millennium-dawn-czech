 SIA_path_democrat: "§Y[conservatism_L]§! je vládnoucí stranou." # todo: NEW TRANSLATION
 SIA_committed_to_ballot: "Oddáni volebním urnám" # todo: NEW TRANSLATION
 SIA_bhumjaithai_coalition: "§Y[Neutral_conservatism_L]§! drží rozhodující moc." # todo: NEW TRANSLATION
 SIA_tt_peace_dialogue_intensity: "Vyžaduje, aby intenzita povstání na hlubokém jihu klesla pod 50." # todo: NEW TRANSLATION
 SIA_tt_shan_militia_support: "Vyžaduje podporu šanských milicí alespoň 60." # todo: NEW TRANSLATION
 SIA_tt_reform_pressure: "Vyžaduje tlak na reformy vyšší než 20." # todo: NEW TRANSLATION
 SIA_tt_populist_tide_20: "Vyžaduje populistickou vlnu vyšší než 20." # todo: NEW TRANSLATION
 SIA_tt_palace_bargain_support: "Vyžaduje, aby royalistický blok rodu Mahidol držel více než 15 procent hlasů." # todo: NEW TRANSLATION
 SIA_tt_china_contracts_renegotiated: "Čínské smlouvy dosud nebyly znovu vyjednány." # todo: NEW TRANSLATION
 SIA_tt_us_security_reviewed: "Bezpečnostní přezkum mezi USA a Thajskem dosud nebyl uzavřen." # todo: NEW TRANSLATION
 SIA_tt_tax_modernized: "Výběr příjmů dosud nebyl modernizován." # todo: NEW TRANSLATION
 SIA_tt_gripen_ef_contracted: "Smlouva na Gripen E/F dosud nebyla podepsána." # todo: NEW TRANSLATION
 SIA_the_quiet_word: "Tiché slovo" # todo: NEW TRANSLATION
 SIA_the_quiet_word_desc: "Telefonát ze správné kanceláře dokáže to, co dříve dokázaly tanky. Síť dává jasně najevo, čí vláda to ve skutečnosti je, a poselství je přijato bez jediného výstřelu." # todo: NEW TRANSLATION
 SIA_judicial_review_route: "Vláda soudním příkazem" # todo: NEW TRANSLATION
 SIA_judicial_review_route_desc: "Ústavní soud nalezne technickou překážku a vládnoucí strana se přes noc rozpustí. Žádná kasárna, žádný zákaz vycházení, jen verdikt a velmi tichý převod moci." # todo: NEW TRANSLATION
 SIA_the_appointed_senate: "Horní komora vybraná z ruky" # todo: NEW TRANSLATION
 SIA_the_appointed_senate_desc: "Dvě stě padesát křesel, kterých se žádné volby nikdy nedotknou, obsazených sítí a odpovědných pouze jí. Každá vláda nyní vládne z milosti Senátu." # todo: NEW TRANSLATION
 SIA_coalition_kingmakers: "Tvůrci koalice" # todo: NEW TRANSLATION
 SIA_coalition_kingmakers_desc: "Kabinetní křesla, rozpočtové příděly a diskrétní slovo správným mocenským prostředníkům sestaví vládu, která se nejprve zodpovídá palácové síti a teprve poté voličům." # todo: NEW TRANSLATION
 SIA_constitutional_engineering: "Konstruování ústavy" # todo: NEW TRANSLATION
 SIA_constitutional_engineering_desc: "Nová ústava, sepsaná v jednacích místnostech namísto pod hlavněmi, uzamkne výhody sítě do základního zákona země. Nic z toho nevyžadovalo jediného vojáka." # todo: NEW TRANSLATION
 SIA_the_establishment_consensus: "Konsenzus establishmentu" # todo: NEW TRANSLATION
 SIA_the_establishment_consensus_desc: "Soudy, Senát, armáda a podniky nyní postupují společně a volby se staly formalitou, kterou síť vždy vyhraje. Nikdo nemusel přivolat tanky." # todo: NEW TRANSLATION
 SIA_judicial_review_route_choice_tt: "Zvolte, kam až dosáhne rozhodnutí Ústavního soudu.\n - §YÚplné rozpuštění§!: oslabí popularitu strany, ale zvýší tlak na reformy\n - §YUžší technické rozhodnutí§!: stojí méně" # todo: NEW TRANSLATION
 SIA_coalition_kingmakers_choice_tt: "Zvolte koaličního partnera.\n - §YProvinční mocenské prostředníky§!: uplatit pokladnou\n - §YPodnikatelskou elitu§!: získat na svou stranu za malou cenu stability" # todo: NEW TRANSLATION
 SIA_royalist_no_coup_path: "Oddáni royalistické cestě bez převratu (síťová monarchie)" # todo: NEW TRANSLATION
 SIA_establishment_category: "Správa establishmentu" # todo: NEW TRANSLATION
 SIA_establishment_category_desc: "Nástroje síťové monarchie, která nikdy nepotřebovala převrat: jmenovaný Senát, spolupracující soudní dvůr a vlastní přesvědčovací kanály paláce." # todo: NEW TRANSLATION
 SIA_senate_procedural_vote: "Vyvolat procedurální hlasování" # todo: NEW TRANSLATION
 SIA_senate_procedural_vote_desc: "Sjednoťte jmenovanou komoru za opatřením, které by volená sněmovna nikdy neschválila. Stojí to politický kapitál, ale o výsledku se ve skutečnosti nikdy nepochybuje. §GStabilita vzroste.§!" # todo: NEW TRANSLATION
 SIA_court_referral: "Předat soudu" # todo: NEW TRANSLATION
 SIA_court_referral_desc: "Předejte nejnovější tah populistů spřízněnému soudu a nechte rozhodnutí vykonat práci, kterou volby odmítají. §RPopularita vládnoucí strany klesne, ale časté používání této taktiky zvyšuje tlak na reformy.§!" # todo: NEW TRANSLATION
 SIA_palace_audience: "Požádat o audienci u paláce" # todo: NEW TRANSLATION
 SIA_palace_audience_desc: "Formální audience udrží armádu a staré pozemkové rodiny v přesvědčení, že síť za ně stále mluví. §GNázory armády a vlastníků půdy se zlepší.§!" # todo: NEW TRANSLATION
 thailand.434.t: "Soud rozhodl" # todo: NEW TRANSLATION
 thailand.434.d: "Ústavní soud vynesl verdikt o jednání vládnoucí strany. Každý v soudní síni už ví, jakým směrem se věci vydají." # todo: NEW TRANSLATION
 thailand.434.a: "Rozpustit stranu úplně" # todo: NEW TRANSLATION
 thailand.434.b: "Omezit rozhodnutí na technickou překážku" # todo: NEW TRANSLATION
 thailand.435.t: "Dohoda tvůrců moci" # todo: NEW TRANSLATION
 thailand.435.d: "Sestavit vládu, se kterou může síť žít, znamená někoho zaplatit. Jedinou otázkou je koho a jakou měnou." # todo: NEW TRANSLATION
 thailand.435.a: "Uplatit provinční bossy" # todo: NEW TRANSLATION
 thailand.435.b: "Dvořit se podnikatelské elitě" # todo: NEW TRANSLATION
 SIA_no_lar_dlc_tt: "Vyžaduje rozšíření La Resistance pro plné mechaniky zpravodajské agentury. Místo toho bude udělena politická moc." # todo: NEW TRANSLATION
 SIA_the_national_intelligence: "Národní zpravodajská agentura" # todo: NEW TRANSLATION
 SIA_the_national_intelligence_desc: "Nad policií, armádou a civilními službami, které dříve soupeřily o stejné informace, nyní stojí jediná Národní zpravodajská agentura. Její založení je nákladné a agentury, které pohlcuje, se svého území nevzdají bez boje." # todo: NEW TRANSLATION
 SIA_special_branch_police: "Zvláštní oddělení" # todo: NEW TRANSLATION
 SIA_special_branch_police_desc: "Specializované politické a protiteroristické policejní křídlo poskytne státu ostřejší přehled o podvratné činnosti a nepokojích. Důstojníci očekávají financování odpovídající mandátu a toto očekávání nezmizí ani po zřízení jednotky." # todo: NEW TRANSLATION
 SIA_counter_insurgency_south: "Jižní požár" # todo: NEW TRANSLATION
 SIA_counter_insurgency_south_desc: "Zpravodajské prostředky se přesouvají na jih k povstání v Pattani, Yala a Narathiwat a hledají sítě, které by samotná armáda nikdy nedokázala zmapovat. Zásah získá půdu proti militantům, ale zaplatí za ni trpělivostí provincie." # todo: NEW TRANSLATION
 SIA_signals_intelligence: "Naslouchající stát" # todo: NEW TRANSLATION
 SIA_signals_intelligence_desc: "Oddělení signálového zpravodajství a kryptografie dá Thajsku vlastní uši v regionálních rádiových vlnách a sítích. Luštitelé kódů a serverové farmy jsou trvalým výdajem, který se nikdy sám nevypne." # todo: NEW TRANSLATION
 SIA_humint_networks: "Muži v terénu" # todo: NEW TRANSLATION
 SIA_humint_networks_desc: "Příslušníci zpravodajských služeb a placení informátoři vybudují lidskou síť napříč hranicemi, kterou žádný satelit nenahradí. Nábor a řízení agentů tímto způsobem je nákladná a neokázalá práce, placená politickým kapitálem, nikoli fanfárami." # todo: NEW TRANSLATION
 SIA_cia_partnership: "Spojení s Langley" # todo: NEW TRANSLATION
 SIA_cia_partnership_desc: "Formální styčný kanál s Ústřední zpravodajskou službou vymění přístup a výcvik za příklon k Washingtonu. Každý drát vedoucí do Langley je drát, který může Langley číst oběma směry." # todo: NEW TRANSLATION
 SIA_mss_cooperation: "Podání ruky s Guoanbu" # todo: NEW TRANSLATION
 SIA_mss_cooperation_desc: "Tichý kanál k čínskému ministerstvu státní bezpečnosti vymění spolupráci za příklon k Pekingu. Vztah prohloubí čínsko-thajské vazby, ale nese stejnou obousměrnou zranitelnost jako každé zahraniční spojení." # todo: NEW TRANSLATION
 SIA_the_watchful_state: "Bdělý stát" # todo: NEW TRANSLATION
 SIA_the_watchful_state_desc: "Domácí policie a zahraniční zpravodajství se sloučí do jediného stálého bezpečnostního aparátu, jehož dosah rozšíří nové modernizace agentur a čerství důstojníci v terénu. Udržování celého systému v chodu je nyní trvalou rozpočtovou položkou." # todo: NEW TRANSLATION
 SIA_surveillance_state: "Panoptikon" # todo: NEW TRANSLATION
 SIA_surveillance_state_desc: "Mandát agentury je natažen na samou hranici, schopnosti odhalování a obrany zvýšeny tak vysoko, jak dovoluje zákon, a ještě o něco dál. Podniky pod dohledem trpí, státní pokladna krvácí politický kapitál a stabilita platí rozdíl." # todo: NEW TRANSLATION
 SIA_accountable_oversight: "Právní stát" # todo: NEW TRANSLATION
 SIA_accountable_oversight_desc: "Soudní přezkum, parlamentní dohled a povinnosti veřejného vykazování jsou připojeny k agentuře výměnou za menší schopnost odhalování, vyšší legitimitu a nižší korupci. Služba je pomalejší a méně vševědoucí, ale zodpovídá se někomu jinému než sama sobě." # todo: NEW TRANSLATION
 SIA_national_intelligence_idea: "Doktrína národního zpravodajství" # todo: NEW TRANSLATION
 SIA_national_intelligence_idea_desc: "Zakládající étos nové agentury se šíří byrokracií: informace je moc a každé ministerstvo je nyní posílá vzhůru. Zvyk dohlížet přetrvá bez ohledu na to, která vláda je právě u moci." # todo: NEW TRANSLATION
 SIA_territorial_defense: "Doktrína obrany vlasti" # todo: NEW TRANSLATION
 SIA_territorial_defense_desc: "Vojáci Království jsou cvičeni k udržení území, nikoli k jeho dobývání. Jednotky se zakopávají, ženisté zkoumají hranici kvůli trvalým opevněním a obranná doktrína se ujímá v ozbrojených silách, zpevňuje pěchotu a urychluje výstavbu opevnění ještě před prvním výstřelem." # todo: NEW TRANSLATION
 SIA_shorad_defense: "Protivzdušná obrana krátkého dosahu" # todo: NEW TRANSLATION
 SIA_shorad_defense_desc: "Rakety krátkého dosahu, radarem naváděná děla a zodolněná protiletadlová stanoviště jsou spleteny do jediného překrývajícího se štítu. Nepřátelská letadla, která zabloudí nad thajské nebe, zjistí, že každý přístup je již zaměřen a každá baterie připravena odpovědět." # todo: NEW TRANSLATION
 SIA_border_fortification_program: "Program opevnění hranic" # todo: NEW TRANSLATION
 SIA_border_fortification_program_desc: "Ženijnímu sboru je svěřen trvalý mandát a trvalý rozpočet: zmapovat, vybudovat a opevnit celou hranici, včetně dlouhé a řídce obsazené laoské hranice, aby nová opevnění vznikala rychleji a zakopané jednotky držely pevněji všude, kde je jich třeba." # todo: NEW TRANSLATION
 SIA_anti_amphibious_command: "Velitelství proti obojživelným výsadkům" # todo: NEW TRANSLATION
 SIA_anti_amphibious_command_desc: "Specializované velitelství zkoumá každou pláž a ústí řeky, které by mohl vetřelec využít. Pobřežní baterie, vrstvené senzory a vycvičené reakční síly činí vylodění na březích Království krvavou a nejistou sázkou." # todo: NEW TRANSLATION
 SIA_defend_myanmar_border: "Opevnit myanmarskou hranici" # todo: NEW TRANSLATION
 SIA_defend_myanmar_border_desc: "Drsné západní pomezí s Myanmarem se táhne po celé délce Království. Linie bunkrů a připravená postavení jsou vyhloubena v průsmycích a říčních údolích a mění obtížný terén ve zeď." # todo: NEW TRANSLATION
 SIA_defend_cambodia_border: "Opevnit kambodžskou hranici" # todo: NEW TRANSLATION
 SIA_defend_cambodia_border_desc: "Vzpomínky na střety u Preah Vihear jsou stále čerstvé. Východní hranice je zpevněna novými opevněními, aby při žádném budoucím sporu nestáli vojáci Království na otevřeném prostranství." # todo: NEW TRANSLATION
 SIA_defend_malaysia_border: "Opevnit malajsijskou hranici" # todo: NEW TRANSLATION
 SIA_defend_malaysia_border_desc: "Nepokojný hluboký jih je protkán bunkry a opěrnými body, které ukotvují hranici s Malajsií a poskytují posádkám v Pattani pevnou půdu k ústupu." # todo: NEW TRANSLATION
 SIA_fortress_thailand: "Pevnostní Thajsko" # todo: NEW TRANSLATION
 SIA_fortress_thailand_desc: "Každá hranice je opevněná, každý přístup zaměřený. V boji na vlastní půdě thajské jednotky útočí a drží s jistotou obránce, který zná terén. Vetřelec vykrvácí v horku, kopcích a nekonečných připravených liniích." # todo: NEW TRANSLATION
 SIA_defend_myanmar_border_tt: "Okamžitě vybuduje pozemní pevnosti §Yúrovně 2§! v §Y9§! pohraničních provinciích.\n - §YSeverní Thajsko§!: 4 provincie\n - §YStřední Thajsko§!: 2 provincie\n - §YJižní Thajsko§!: 3 provincie" # todo: NEW TRANSLATION
 SIA_defend_cambodia_border_tt: "Okamžitě vybuduje pozemní pevnosti §Yúrovně 2§! v §Y6§! pohraničních provinciích.\n - §YStřední Thajsko§!: 3 provincie\n - §YIsán§!: 3 provincie" # todo: NEW TRANSLATION
 SIA_defend_malaysia_border_tt: "Okamžitě vybuduje pozemní pevnosti §Yúrovně 2§! v §Y5§! pohraničních provinciích.\n - §YPattani§!: 4 provincie\n - §YJižní Thajsko§!: 1 provincie" # todo: NEW TRANSLATION
 SIA_sovereign_wealth_fund_allocation: "Přidělit prostředky státnímu investičnímu fondu" # todo: NEW TRANSLATION
 SIA_sovereign_wealth_fund_allocation_desc: "Převeďte další část příjmů z těžby zdrojů do zahraničního portfolia státního fondu. Příděl zablokuje kapitál na rok, než se jeho výnosy začnou vracet do rozpočtu." # todo: NEW TRANSLATION
 SIA_state_resource_stake: "Získat státní podíl na zdrojích" # todo: NEW TRANSLATION
 SIA_state_resource_stake_desc: "Ministerstvo financí přímo investuje do těžebních a energetických koncesí, místo aby je pouze zdaňovalo. Peníze přicházejí rychle; stejně tak dokumentace, na kterou se nikdo nechce dívat příliš zblízka." # todo: NEW TRANSLATION
 thailand.436.t: "Únik ze středněpříjmové pasti" # todo: NEW TRANSLATION
 thailand.436.d: "Statističtí odborníci to potvrzují: Thajsko překročilo příjmovou hranici, která po generaci držela tolik jeho sousedů v pasti. Továrny, které dříve jen montovaly součástky pro jiné, je nyní samy navrhují. Otázkou v kabinetu je, co s touto chvílí udělat." # todo: NEW TRANSLATION
 thailand.436.a: "Vyhlásit úspěch" # todo: NEW TRANSLATION
 thailand.436.b: "Uložit dividendu" # todo: NEW TRANSLATION
 SIA_the_army_question: "Otázka armády" # todo: NEW TRANSLATION
 SIA_the_army_question_desc: "Generál na každých pár stovek vojáků, povyšování založené na třídě a frakci místo zásluh a mzdový účet nafouknutý podniky, které nemají s obranou nic společného. Armáda Království funguje, ale ne jako vojsko. Někdo musí rozhodnout, jakým druhem armády se stane." # todo: NEW TRANSLATION
 SIA_the_professional_turn: "Profesionalizace" # todo: NEW TRANSLATION
 SIA_the_professional_turn_desc: "Méně vojáků, lépe vycvičených a odpovídajících za zásluhy místo seznamu přesunů. Je to těžší cesta a každý generál s podnikem, který musí chránit, dostane varování." # todo: NEW TRANSLATION
 SIA_the_reshuffle_list: "Seznam přesunů není válečný plán" # todo: NEW TRANSLATION
 SIA_the_reshuffle_list_desc: "Každoroční přesuny jsou skutečným rytmem fungování RTARF a nyní je podřídíme podpisu civilního ministra namísto vlastní kasárenské aritmetiky. Velení se začne zodpovídat vládě dne." # todo: NEW TRANSLATION
 SIA_retire_the_experts: "Penzi pro experty" # todo: NEW TRANSLATION
 SIA_retire_the_experts_desc: "Každému vyššímu absolventovi náleží nadpočetné místo „experta“ nebo „specialisty“ s generálskou hvězdou, bez ohledu na to, zda tato pozice něco dělá. Vyplaťte čestné generály a tato místa za nimi uzavřete." # todo: NEW TRANSLATION
 SIA_close_the_ledger: "Uzavřít účetní knihu" # todo: NEW TRANSLATION
 SIA_close_the_ledger_desc: "Armádní televizní kanál, golfová hřiště, pozemky a sociální programy provozované neplacenou prací vojáků budou předány civilní správě. Život v kasárnách se zmenší. Rozpočet bude poctivý." # todo: NEW TRANSLATION
 SIA_break_the_class_ladder: "Zlomit třídní žebřík" # todo: NEW TRANSLATION
 SIA_break_the_class_ladder_desc: "Povyšování podle předkadetské třídy a frakce jednotky, Wongthewan proti Burapha Phayak, ustoupí povyšování podle výsledků. Staré sítě tím přijdou o sevření nad tím, kdo bude velet příště." # todo: NEW TRANSLATION
 SIA_all_volunteer_force: "Plně dobrovolnická armáda" # todo: NEW TRANSLATION
 SIA_all_volunteer_force_desc: "Armáda postavená zcela na těch, kteří si ji zvolí: lépe vycvičená, lépe organizovaná a placená tak, jak to vyžaduje. Široce schopná síla za stálý žold, který pokladna ponese natrvalo." # todo: NEW TRANSLATION
 SIA_the_elite_spearhead: "Elitní hrot" # todo: NEW TRANSLATION
 SIA_the_elite_spearhead_desc: "Namísto profesionalizace celé armády soustřeďte investice. Malý hrot speciálních sil, nákladně vybavený a nákladně udržovaný, vybudovaný tak, aby udeřil daleko nad svou váhu." # todo: NEW TRANSLATION
 SIA_high_readiness_army: "Armáda vysoké připravenosti" # todo: NEW TRANSLATION
 SIA_high_readiness_army_desc: "Stálé jednotky udržované ve válečné pohotovosti: cvičené, plánované a průzkumně připravené před kontaktem. Taková připravenost není nikdy zdarma, ale znamená, že armáda, která dorazí, je armádou, kterou jsme slíbili." # todo: NEW TRANSLATION
 SIA_the_minister_decides: "Rada radí, ministr rozhoduje" # todo: NEW TRANSLATION
 SIA_the_minister_decides_desc: "Nejvyšší velitelská rada si ponechá místo u stolu, ale rozhodnutí náleží civilnímu ministrovi a generálům jejich provedení. Je to reforma, proti níž stará garda bojuje nejtvrději, a právě ta zajistí trvalost všech ostatních reforem." # todo: NEW TRANSLATION
 SIA_the_conscript_host: "Branecké vojsko" # todo: NEW TRANSLATION
 SIA_the_conscript_host_desc: "Počty nad uhlazenost. Širší odvody levně zaplní řady, pokladna přestane krvácet kvůli přerostlému profesionálnímu mzdovému účtu a důstojnický sbor si zachová všechna dosavadní privilegia." # todo: NEW TRANSLATION
 SIA_fill_the_quota: "Naplnit kvótu" # todo: NEW TRANSLATION
 SIA_fill_the_quota_desc: "Každoroční odvodová loterie zasáhne hlouběji do způsobilé populace. Více vylosovaných jmen znamená více zaplněných bot a nižší laťku pro oblečení uniformy." # todo: NEW TRANSLATION
 SIA_the_boys_in_black: "Černí hoši se vracejí" # todo: NEW TRANSLATION
 SIA_the_boys_in_black_desc: "Thahan Phran, dobrovolní pohraniční strážci, budou početně zdvojnásobeni. Lehce placení a místně rekrutovaní budou držet pohraniční vesnice a krvácet vetřelce na půdě, kterou znají lépe než jakákoli pravidelná jednotka." # todo: NEW TRANSLATION
 SIA_or_sor_grid: "Or Sor v každém tambonu" # todo: NEW TRANSLATION
 SIA_or_sor_grid_desc: "Vesničtí obranní dobrovolníci Or Sor budou zřízeni tambon po tambonu napříč venkovem. Je to milicionářská síť, která nepotřebuje zásobovací linii, protože nikdy neopouští domov." # todo: NEW TRANSLATION
 SIA_cheap_steel_many_hulls: "Levná ocel, mnoho trupů" # todo: NEW TRANSLATION
 SIA_cheap_steel_many_hulls_desc: "Vyzbrojte masy z thajských továren místo zahraničních katalogů. Výbava je jednodušší a její ostří tupější, ale zbrojovky ji vyrábějí rychle a levně." # todo: NEW TRANSLATION
 SIA_the_barracks_economy: "Kasárenské hospodářství" # todo: NEW TRANSLATION
 SIA_the_barracks_economy_desc: "Nechte generálské podniky financovat mobilizaci, místo abyste s nimi bojovali. Kanál, golfová hřiště a zbytek portfolia otevřou své účetní knihy válečné pokladně — peníze nyní a korupce navždy." # todo: NEW TRANSLATION
 SIA_reserve_of_the_realm: "Záloha Království" # todo: NEW TRANSLATION
 SIA_reserve_of_the_realm_desc: "Každý muž, který kdy nosil uniformu, je registrován, sledován a připraven k povolání. Řady záloh nabobtnají a povolání proběhne rychleji, za cenu řidšího výcvikového proudu, který je musí pokrýt." # todo: NEW TRANSLATION
 SIA_the_old_guard_endures: "Velení, které nikdy nespí" # todo: NEW TRANSLATION
 SIA_the_old_guard_endures_desc: "Masová armáda se stane trvalou, mzdový účet bude konečně navrácen na úroveň, kterou pokladna unese, a s ním i důstojnický sbor, který vedle ní funguje. Civilní kontrola je definitivně mimo hru. Stará garda se jednoduše naučila žít v rámci svých možností." # todo: NEW TRANSLATION
 SIA_swf_windfall: "Neočekávaný výnos státního fondu" # todo: NEW TRANSLATION
 SIA_swf_windfall_desc: "Letošní příděl se vyplácí. Výnosy podepřou rozpočet, dokud nebude pozice vyčerpána." # todo: NEW TRANSLATION
