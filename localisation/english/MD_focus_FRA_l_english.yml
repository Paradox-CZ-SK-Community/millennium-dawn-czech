 FRA_4th_empire: "Třetí francouzské císařství" # todo: NEW TRANSLATION
 threat_FRA_napo_empire: "Napoleon je zpět" # todo: NEW TRANSLATION
 FRA_liberal_arms_contracts: "Liberální politika vývozu zbraní" # todo: NEW TRANSLATION
 FRA_liberal_arms_contracts_desc: "Dassault, Naval Group, Thales a MBDA vedou jeden z nejvyspělejších obranných průmyslů na světě. Liberální exportní politika nám umožňuje usilovat o lukrativní zakázky se státy, které chtějí modernizovat, plnit objednávkové knihy našich továren a zároveň rozšiřovat francouzský vliv prostřednictvím vojenských partnerství." # todo: NEW TRANSLATION
 FRA_liberal_arms_contracts_tt: "V nadcházejících měsících navrhneme zbrojní kontrakty §YSaúdské Arábii§!, §YSpojeným arabským emirátům§!, §YSrbsku§!, §YŘecku§!, §YEgyptu§! a §YIndii§!." # todo: NEW TRANSLATION
 FRA_arms_contract_opinion: "Partnerství v oblasti zbrojních kontraktů" # todo: NEW TRANSLATION
 france_md.323.t: "Dvoření Rijádu" # todo: NEW TRANSLATION
 france_md.323.d: "Rijád hledá stíhačku, která by létala po boku jeho Eurofighterů, a inženýři Naval Group stále zajišťují servis fregat třídy Al Riyadh vyrobených v rámci programu Sawari. Naše ministerstvo obrany připravilo návrh pro [SAU.GetNameWithFlag]. Co bychom měli nabídnout?" # todo: NEW TRANSLATION
 france_md.323.a: "Lehký balíček zbraní (5 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.323.b: "Těžký balíček zbraní (15 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.323.c: "Prémiový balíček Rafale (30 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.323.e: "O tento kontrakt neusilujme" # todo: NEW TRANSLATION
 france_md.324.t: "Rijád zvažuje francouzskou nabídku" # todo: NEW TRANSLATION
 france_md.324.d: "[FRA.GetNameWithFlag] nabízí Rafale jako alternativu k našim letkám Eurofighterů spolu s rozšířením programu fregat Sawari, o které se Naval Group stará již desítky let." # todo: NEW TRANSLATION
 france_md.324.a: "Přijmout kontrakt" # todo: NEW TRANSLATION
 france_md.324.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 france_md.325.t: "Dvoření Abú Zabí" # todo: NEW TRANSLATION
 france_md.325.d: "Emirátské letectvo stále používá Mirage 2000-9, variantu, kterou Dassault v 90. letech vytvořil přímo pro Abú Zabí. Vzhledem ke stárnutí této flotily vidí naše ministerstvo obrany příležitost nabídnout [UAE.GetNameWithFlag] jejího nástupce, Rafale. Co bychom měli nabídnout?" # todo: NEW TRANSLATION
 france_md.325.a: "Lehký balíček zbraní (5 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.325.b: "Těžký balíček zbraní (15 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.325.c: "Prémiový balíček Rafale (30 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.325.e: "O tento kontrakt neusilujme" # todo: NEW TRANSLATION
 france_md.326.t: "Abú Zabí zvažuje francouzskou nabídku" # todo: NEW TRANSLATION
 france_md.326.d: "[FRA.GetNameWithFlag] navrhuje Rafale jako nástupce naší flotily Mirage 2000-9, speciální varianty, kterou pro nás Dassault vyrobil před třiceti lety." # todo: NEW TRANSLATION
 france_md.326.a: "Přijmout kontrakt" # todo: NEW TRANSLATION
 france_md.326.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 france_md.327.t: "Dvoření Bělehradu" # todo: NEW TRANSLATION
 france_md.327.d: "[SER.GetNameWithFlag] stále používá MiGy-29 ze sovětské éry a nakupuje krátkodosahovou protivzdušnou obranu od Moskvy. Můžeme nabídnout Rafale jako jejich náhradu, podpořený přenosnými střelami Mistral od MBDA pro jejich jednotky protivzdušné obrany. Co bychom měli navrhnout?" # todo: NEW TRANSLATION
 france_md.327.a: "Lehký balíček zbraní (3 miliardy dolarů)" # todo: NEW TRANSLATION
 france_md.327.b: "Těžký balíček zbraní (8 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.327.c: "Prémiový balíček Rafale (15 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.327.e: "O tento kontrakt neusilujme" # todo: NEW TRANSLATION
 france_md.328.t: "Bělehrad zvažuje francouzskou nabídku" # todo: NEW TRANSLATION
 france_md.328.d: "[FRA.GetNameWithFlag] nabízí Rafale jako západní alternativu k naší stárnoucí flotile MiGů-29 spolu s raketami Mistral od MBDA pro naše jednotky protivzdušné obrany. Přijetí by znamenalo naši první významnou zbrojní dohodu mimo ruskou sféru." # todo: NEW TRANSLATION
 france_md.328.a: "Přijmout kontrakt" # todo: NEW TRANSLATION
 france_md.328.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 france_md.329.t: "Dvoření Athénám" # todo: NEW TRANSLATION
 france_md.329.d: "[GRE.GetNameWithFlag] již používá naše Rafale a chce rozšířit spolupráci na námořnictvo. Naval Group navrhla balíček fregat odvozených od typu FREMM, který by doplnil objednávku letectva. Co bychom měli navrhnout našim helénským spojencům?" # todo: NEW TRANSLATION
 france_md.329.a: "Lehký balíček zbraní (4 miliardy dolarů)" # todo: NEW TRANSLATION
 france_md.329.b: "Těžký balíček zbraní (12 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.329.c: "Prémiový balíček Rafale (20 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.329.e: "O tento kontrakt neusilujme" # todo: NEW TRANSLATION
 france_md.330.t: "Athény zvažují francouzskou nabídku" # todo: NEW TRANSLATION
 france_md.330.d: "[FRA.GetNameWithFlag] navrhuje balíček založený na fregatách odvozených od typu FREMM, čímž rozšiřuje obranné vztahy již založené na naší dřívější objednávce Rafale." # todo: NEW TRANSLATION
 france_md.330.a: "Přijmout kontrakt" # todo: NEW TRANSLATION
 france_md.330.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 france_md.331.t: "Dvoření Káhiře" # todo: NEW TRANSLATION
 france_md.331.d: "[EGY.GetNameWithFlag] již používá naše Rafale, provozuje dvě nosiče vrtulníků třídy Mistral vyrobené pro Rusko a následně přesměrované do Káhiry a zařadilo do služby fregatu FREMM Tahya Misr z objednávky našeho vlastního námořnictva. Co bychom měli navrhnout k prohloubení partnerství?" # todo: NEW TRANSLATION
 france_md.331.a: "Lehký balíček zbraní (4 miliardy dolarů)" # todo: NEW TRANSLATION
 france_md.331.b: "Těžký balíček zbraní (12 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.331.c: "Prémiový balíček Rafale (25 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.331.e: "O tento kontrakt neusilujme" # todo: NEW TRANSLATION
 france_md.332.t: "Káhira zvažuje francouzskou nabídku" # todo: NEW TRANSLATION
 france_md.332.d: "[FRA.GetNameWithFlag] nabízí rozšíření partnerství, které již zahrnuje naše letky Rafale, nosiče třídy Mistral a fregatu FREMM Tahya Misr." # todo: NEW TRANSLATION
 france_md.332.a: "Přijmout kontrakt" # todo: NEW TRANSLATION
 france_md.332.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 france_md.333.t: "Dvoření Novému Dillí" # todo: NEW TRANSLATION
 france_md.333.d: "[IND.GetNameWithFlag] provozuje jeden z největších obranných trhů na světě. Nové Dillí již používá třicet šest letounů Rafale a v loděnicích Mazagon Dock vyrábí ponorky třídy Scorpène v licenci. Co bychom měli navrhnout k rozšíření partnerství?" # todo: NEW TRANSLATION
 france_md.333.a: "Lehký balíček zbraní (6 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.333.b: "Těžký balíček zbraní (20 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.333.c: "Prémiový balíček Rafale (40 miliard dolarů)" # todo: NEW TRANSLATION
 france_md.333.e: "O tento kontrakt neusilujme" # todo: NEW TRANSLATION
 france_md.334.t: "Nové Dillí zvažuje francouzskou nabídku" # todo: NEW TRANSLATION
 france_md.334.d: "[FRA.GetNameWithFlag] navrhuje navázat na letouny Rafale již sloužící v indickém letectvu a ponorky třídy Scorpène vyráběné v licenci v loděnicích Mazagon Dock." # todo: NEW TRANSLATION
 france_md.334.a: "Přijmout kontrakt" # todo: NEW TRANSLATION
 france_md.334.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 FRA_joint_weapon_projects_category: "Společné projekty vývoje zbraní" # todo: NEW TRANSLATION
 FRA_joint_weapon_projects_category_desc: "Francie má dlouhou historii společných obranných programů, od útočného letounu Jaguar s Británií po vrtulník Tiger s Německem. Nové společné projekty nám umožňují rozdělit náklady na vývoj a nasadit vybavení, které by si žádný partner nemohl dovolit sám." # todo: NEW TRANSLATION
 FRA_joint_project_germany: "Navrhnout společný projekt SCAF/MGCS" # todo: NEW TRANSLATION
 FRA_joint_project_germany_desc: "SCAF (Système de Combat Aérien du Futur) spojuje Dassault s Airbusem při návrhu stíhačky šesté generace, která nahradí Rafale a Eurofighter. MGCS (Main Ground Combat System) pověřuje KNDS vývojem nového hlavního bojového tanku, který nahradí Leclerc a Leopard 2. Společně by šlo o největší obranné programy, jaké kterýkoli z obou států uskutečnil od studené války." # todo: NEW TRANSLATION
 FRA_socialist_government_required_tt: "Vyžaduje vládu §YSocialistů§! nebo §Ylevicovou§! vládu" # todo: NEW TRANSLATION
 FRA_joint_project_russia: "Navrhnout francouzsko-ruský projekt ATOM" # todo: NEW TRANSLATION
 FRA_joint_project_russia_desc: "Navrhujeme bojové vozidlo pěchoty ATOM jako společný program s Moskvou, který spojí konstrukční týmy Nexteru s ruskými inženýry obrněných vozidel. Tak hluboký rozchod se západními spojenci vyžaduje nejprve vystoupení z EU." # todo: NEW TRANSLATION
 FRA_nationalist_government_required_tt: "Vyžaduje vládu §Ynacionalistů§! nebo §YNárodního sdružení§!" # todo: NEW TRANSLATION
 FRA_joint_project_opinion: "Partner pro společný vývoj zbraní" # todo: NEW TRANSLATION
 france_md.335.t: "Návrh francouzsko-německého projektu SCAF/MGCS" # todo: NEW TRANSLATION
 france_md.335.d: "[FRA.GetNameWithFlag] navrhuje zahájit SCAF (Système de Combat Aérien du Futur) a MGCS (Main Ground Combat System) jako společné programy: stíhačku šesté generace, která nahradí Rafale a Eurofighter, a hlavní bojový tank, který nahradí Leclerc a Leopard 2. Dassault, Airbus a KNDS by si rozdělily konstrukční práce mezi Paříž a Berlín." # todo: NEW TRANSLATION
 france_md.335.a: "Vybudujme společně budoucnost evropské obrany" # todo: NEW TRANSLATION
 france_md.335.b: "Dáváme přednost samostatnému vývoji našich systémů" # todo: NEW TRANSLATION
 france_md.336.t: "Německo přijímá projekt SCAF/MGCS" # todo: NEW TRANSLATION
 france_md.336.d: "[GER.GetNameWithFlag] přijalo náš návrh SCAF a MGCS. Inženýři Dassaultu a Airbusu budou na programu stíhačky pracovat po boku svých německých protějšků, zatímco KNDS povede vývoj tanku." # todo: NEW TRANSLATION
 france_md.336.a: "Výborně! Ať žije francouzsko-německá spolupráce!" # todo: NEW TRANSLATION
 france_md.337.t: "Návrh francouzsko-ruského projektu ATOM" # todo: NEW TRANSLATION
 france_md.337.d: "[FRA.GetNameWithFlag] navrhuje bojové vozidlo pěchoty ATOM jako společný francouzsko-ruský program, který spojí inženýry Nexteru s ruskými konstruktéry obrněných vozidel. Paříž, která se již odklonila od tradičních západních spojenců, nyní hledá obranné partnery na východě." # todo: NEW TRANSLATION
 france_md.337.a: "Začíná nová éra francouzsko-ruské spolupráce" # todo: NEW TRANSLATION
 france_md.337.b: "Tento návrh je příliš kontroverzní" # todo: NEW TRANSLATION
 france_md.338.t: "Rusko přijímá projekt ATOM" # todo: NEW TRANSLATION
 france_md.338.d: "[RUS.GetNameWithFlag] přijalo náš návrh programu ATOM. Inženýři Nexteru budou pracovat po boku svých ruských protějšků na novém bojovém vozidle pěchoty, našem prvním významném obranném partnerství s Moskvou od studené války." # todo: NEW TRANSLATION
 france_md.338.a: "Nová kapitola francouzsko-ruských vztahů!" # todo: NEW TRANSLATION
 FRA_FCAS_MGCS_project: "Program vývoje SCAF/MGCS" # todo: NEW TRANSLATION
 FRA_FCAS_MGCS_project_desc: "Francie a Německo společně vyvíjejí SCAF (Système de Combat Aérien du Futur), stíhačku šesté generace vedenou Dassaultem a Airbusem, a MGCS (Main Ground Combat System), nový hlavní bojový tank vedený KNDS. Společně jde o největší obranné programy, jaké která z obou zemí uskutečnila od studené války." # todo: NEW TRANSLATION
 GER_FCAS_MGCS_project: "Program vývoje SCAF/MGCS" # todo: NEW TRANSLATION
 GER_FCAS_MGCS_project_desc: "Německo a Francie společně vyvíjejí SCAF (Système de Combat Aérien du Futur), stíhačku šesté generace vedenou Airbusem a Dassaultem, a MGCS (Main Ground Combat System), nový hlavní bojový tank vedený KNDS. Společně jde o největší obranné programy, jaké která z obou zemí uskutečnila od studené války." # todo: NEW TRANSLATION
 FRA_RUS_joint_project: "Francouzsko-ruský program ATOM" # todo: NEW TRANSLATION
 FRA_RUS_joint_project_desc: "Francie a Rusko zahájily společný vojenský vývojový program, projekt bojového vozidla pěchoty ATOM. Inženýři Nexteru spolupracují s ruskými konstruktéry obrněných vozidel na výrobě nové platformy BVP." # todo: NEW TRANSLATION
 RUS_FRA_joint_project: "Francouzsko-ruský program ATOM" # todo: NEW TRANSLATION
 RUS_FRA_joint_project_desc: "Rusko a Francie zahájily společný vojenský vývojový program, projekt bojového vozidla pěchoty ATOM. Ruští konstruktéři obrněných vozidel spolupracují s inženýry Nexteru na výrobě nové platformy BVP." # todo: NEW TRANSLATION
 FRA_constitutional_crisis_pcf: "Revoluční pokušení" # todo: NEW TRANSLATION
 FRA_constitutional_crisis_pcf_desc: "V naší levicové koalici získává vliv radikální frakce. Tito revoluční zastánci tvrdé linie věří, že demokratický socialismus postupuje příliš pomalu, a požadují okamžitou, úplnou transformaci. Umírněné vedení La France Insoumise a PCF se snaží udržet na uzdě extremisty, kteří generální stávku považují za první krok k revoluci." # todo: NEW TRANSLATION
 FRA_abolish_fifth_republic_pcf: "Extremisté se ujímají kontroly" # todo: NEW TRANSLATION
 FRA_abolish_fifth_republic_pcf_desc: "Radikální frakce levice přelstila umírněné vedení. Mélenchon a reformisté PCF byli odsunuti stranou revolučními zastánci tvrdé linie, kteří zcela odmítají „buržoazní demokracii“ páté republiky. Požadují ustavující shromáždění k sepsání nové ústavy, podpořené dostatečnou silou ulice k prosazení jejich vůle." # todo: NEW TRANSLATION
 FRA_sixth_republic: "Vyhlášení šesté republiky" # todo: NEW TRANSLATION
 FRA_sixth_republic_desc: "Umírněná frakce znovu získala část svého vlivu a směřuje revoluci k demokratické socialistické šesté republice namísto otevřeného komunismu. Tento kompromis zachovává republikánské instituce a zároveň zásadně proměňuje francouzskou společnost parlamentní cestou." # todo: NEW TRANSLATION
 FRA_french_commune_peaceful: "Ustavení Francouzské komuny" # todo: NEW TRANSLATION
 FRA_french_commune_peaceful_desc: "Revoluční zastánci tvrdé linie zcela zvítězili. V duchu Pařížské komuny z roku 1871 se Francie stane skutečným dělnickým státem. Výrobní prostředky budou kolektivizovány, dělnické rady budou vládnout na všech úrovních a umírnění reformisté zcela ztratili kontrolu." # todo: NEW TRANSLATION
 FRA_republic_safe_pcf: "Naše nejcennější vlastnictví" # todo: NEW TRANSLATION
 FRA_republic_safe_pcf_desc: "Zatkli jsme vůdce radikální frakce a rozpustili jejich polovojenské buňky. Republika přežívá. Mélenchon a umírnění reformisté si zachovávají kontrolu nad levicí. Revoluční sen skončil a nahradila jej pomalejší, stabilnější cesta demokratických reforem." # todo: NEW TRANSLATION
 FRA_question_republic_fn: "Pochybná republika" # todo: NEW TRANSLATION
 FRA_question_republic_fn_desc: "V Národním sdružení získává vliv tradicionalistická frakce. Zatímco [FRA.GetLeader] a hlavní vedení zůstávají oddáni republice, tito extremisté inspirovaní Action Française a katolickým tradicionalistickým hnutím otevřeně pochybují, zda demokracie samotná Francii nezklamala. Musíme jednat, než bude příliš pozdě." # todo: NEW TRANSLATION
 FRA_referendum_republic: "Zastánci tvrdé linie vynucují referendum" # todo: NEW TRANSLATION
 FRA_referendum_republic_desc: "Tradicionalistická frakce přelstila umírněné republikány Le Penové. Bojovníci Action Française, katoličtí integristé a monarchisté toužící po minulosti převzali kontrolu nad stranickým aparátem. Požadují referendum o samotné existenci republiky a hlavní vedení jim již nedokáže zabránit." # todo: NEW TRANSLATION
 FRA_restore_kingdom_fn: "Obnovení království" # todo: NEW TRANSLATION
 FRA_restore_kingdom_fn_desc: "Monarchistická frakce uvnitř hnutí zvítězila. Ať už korunujeme orleánského pretendenta Jeana d'Orléans jako „krále Francouzů“, nebo legitimistického uchazeče Louise de Bourbona jako „francouzského krále“, republikánští umírnění z vládní koalice byli tradicionalistickými extremisty zcela odsunuti." # todo: NEW TRANSLATION
 FRA_restore_empire_fn: "Obnovení císařství" # todo: NEW TRANSLATION
 FRA_restore_empire_fn_desc: "Bonapartistická frakce zvítězila. Jean-Christophe Napoléon Bonaparte bude korunován Napoleonem VII. Umírnění republikáni, kteří kdysi vedli vládu, byli smeteni těmi, kdo sní o císařské slávě: o silné Francii sjednocené pod císařem, nikoli pod hašteřícími se poslanci." # todo: NEW TRANSLATION
 FRA_republic_safe_fn: "Záchrana republiky" # todo: NEW TRANSLATION
 FRA_republic_safe_fn_desc: "Zatkli jsme vůdce tradicionalistické frakce a rozpustili jejich polovojenské buňky. Republika přežívá! Naše vláda a umírnění nacionalisté si zachovávají kontrolu. S využitím krize jako ospravedlnění schvalujeme reformy posilující moc státu: rozšířené bezpečnostní služby, přísnější kontrolu extremistických organizací a větší pravomoci výkonné moci. Pátá republika trvá, silnější než kdy dříve." # todo: NEW TRANSLATION
 france_md.370.t: "Udržet si čisté ruce" # todo: NEW TRANSLATION
 france_md.370.d: "Náš vzestup k moci již zřejmě upoutal pozornost politických hnutí. Dnes ráno nás kontaktovaly revoluční komunistické buňky. Nabídly nám pomoc při upevňování naší moci, zejména shromažďováním informací o našich politických oponentech a pátráním po krajně pravicových odštěpeneckých skupinách, aby nám nemohly uškodit. Neměli bychom se do takových skupin zapojovat, protože jsme se nyní zavázali reformám a Republice. Přesto by bylo užitečné mít tento nástroj k dispozici." # todo: NEW TRANSLATION
 france_md.370.a: "Dovolme jim organizovat se: potřebujeme jejich podporu" # todo: NEW TRANSLATION
 france_md.370.b: "Odmítněme je: jsme demokraté, nikoli revolucionáři" # todo: NEW TRANSLATION
 france_md.371.t: "Hlasy ze stínů" # todo: NEW TRANSLATION
 france_md.371.d: "Náš volební úspěch a naše efektivita při prosazování nacionalistického programu nezůstaly bez povšimnutí. Obdrželi jsme nabídky od různých tradicionalistických odštěpeneckých skupin: sympatizantů Action Française, katolických intégristes a těch, kteří sní o obnovení monarchie. Naše výsledky na ně udělaly dojem a nabízejí nám své polovojenské sítě a politické kontakty výměnou za povolení otevřeně se organizovat. Jejich skutečné záměry zůstávají zahalené." # todo: NEW TRANSLATION
 france_md.371.a: "Dovolme jim organizovat se: jejich podpora nás posílí" # todo: NEW TRANSLATION
 france_md.371.b: "Odmítněme je: stojíme na straně republiky" # todo: NEW TRANSLATION
 france_md.372.t: "Republika obstála" # todo: NEW TRANSLATION
 france_md.372.d: "Radikální frakce byla zlomena. Její vůdci jsou zatčeni, její buňky rozpuštěny a její sny o revoluci rozdrceny. Umírnění reformisté zůstávají u moci a Francie zůstává republikou, možná proměněnou, ale stále rozpoznatelně demokratickou. Extremisté zariskovali a prohráli." # todo: NEW TRANSLATION
 france_md.372.a: "Reformismus vždy zvítězí" # todo: NEW TRANSLATION
 france_md.373.t: "Ať žije republika!" # todo: NEW TRANSLATION
 france_md.373.d: "Tradicionalistický převrat byl zmařen! DGSI rychle zasáhla: vůdci Action Française jsou ve vazbě, monarchistické buňky byly přepadeny a sny o obnově leží v troskách. Lidé slaví v ulicích, zatímco Le Pen oslovuje národ: Pátá republika pevně stojí. Tuto krizi využíváme jako ospravedlnění k prosazení rozsáhlých reforem, které posílí státní autoritu a zajistí, že se podobné hrozby již nikdy neobjeví." # todo: NEW TRANSLATION
 france_md.373.a: "Republika je zachráněna a silnější než kdy dříve!" # todo: NEW TRANSLATION
 france_md.374.t: "Frakce bojují o moc" # todo: NEW TRANSLATION
 france_md.374.d: "Převrat uspěl. Republika padla. Nyní se však tradicionalistické frakce obracejí proti sobě. Monarchisté požadují obnovu bourbonské nebo orleánské linie. Bonapartisté sní o císařské slávě pod Napoleonem VII. Zvítězit může pouze jedna frakce. Která vize převládne?" # todo: NEW TRANSLATION
 france_md.374.a: "Monarchisté vítězí: obnovme království!" # todo: NEW TRANSLATION
 france_md.374.b: "Bonapartisté triumfují: obnovme císařství!" # todo: NEW TRANSLATION
 france_md.340.t: "Blížící se povstání" # todo: NEW TRANSLATION
 france_md.340.d: "Radikální frakce se stala příliš troufalou. Její polovojenské buňky byly odhaleny a její infiltrace stranického aparátu vyšla najevo. Dokonce se šíří zvěsti, že infiltrovala vrchní velení naší armády a připravuje státní převrat. Musíme se rozhodnout: tvrdě proti ní zasáhnout a zachovat Republiku, nebo ji nechat pokračovat v činnosti a zjistit, kam to povede. DGSI čeká na naše rozkazy." # todo: NEW TRANSLATION
 france_md.340.a: "Tvrdě zasáhnout: zatknout radikální vůdce" # todo: NEW TRANSLATION
 france_md.340.b: "Nechat je být: revoluce musí pokračovat" # todo: NEW TRANSLATION
 france_md.341.t: "Radikálové se chopili moci" # todo: NEW TRANSLATION
 france_md.341.d: "Stalo se to během jediné noci. Radikální frakce postupovala přesně: její polovojenské buňky obsadily klíčové budovy a její infiltrátoři v armádě zajistili důležité základny. [FRA.GetLeader] a umírnění reformisté se probudili a zjistili, že jsou prakticky vězni. Revoluční radikálové provedli převrat. Pátá republika je mrtvá." # todo: NEW TRANSLATION
 france_md.341.a: "Revoluce začala" # todo: NEW TRANSLATION
 france_md.345.t: "Komuna znovu povstává" # todo: NEW TRANSLATION
 france_md.345.d: "Revoluční radikálové zcela zvítězili. Odmítli jakýkoli kompromis s „buržoazní demokracií“ a vyhlásili Francouzskou komunu, skutečný dělnický stát v tradici roku 1871. Umírnění reformisté, kteří původní koalici vybudovali, byli vyčištěni nebo uprchli. Nad Elysejským palácem vlaje rudý prapor a revoluce teprve začíná." # todo: NEW TRANSLATION
 france_md.345.a: "Ať žije Komuna! Internacionála bude lidským pokolením!" # todo: NEW TRANSLATION
 france_md.375.t: "Boj, nebo ústup" # todo: NEW TRANSLATION
 france_md.375.d: "Tradicionalistická frakce příliš zpychla. Její polovojenské sítě byly odhaleny a její infiltrace stranického aparátu vyšla najevo. Dokonce se šíří zvěsti, že infiltrovala vrchní velení naší armády a připravuje státní převrat. Musíme se rozhodnout: tvrdě proti ní zasáhnout a zachovat Republiku, nebo ji nechat pokračovat v činnosti a zjistit, kam to povede. DGSI čeká na naše rozkazy." # todo: NEW TRANSLATION
 france_md.375.a: "Tvrdě zasáhnout: zatknout tradicionalistické vůdce" # todo: NEW TRANSLATION
 france_md.375.b: "Nechat je být: obnova musí pokračovat" # todo: NEW TRANSLATION
 france_md.376.t: "Tradicionalisté se chopili moci" # todo: NEW TRANSLATION
 france_md.376.d: "Stalo se to během jediné noci. Tradicionalistická frakce postupovala přesně: její polovojenské buňky zajistily klíčové budovy a její spojenci v armádě se postarali o nezasahování. [FRA.GetLeader] a umírnění republikáni se probudili a zjistili, že byli zcela odsunuti stranou. Extremisté provedli převrat. Pátá republika je mrtvá. Kdo však bude vládnout nové Francii?" # todo: NEW TRANSLATION
 france_md.376.a: "Frakce nyní musí rozhodnout" # todo: NEW TRANSLATION
 france_md.354.t: "Monarchisté vybírají svého krále" # todo: NEW TRANSLATION
 france_md.354.d: "Monarchistická frakce uvnitř hnutí nyní musí vybrat svého panovníka. Představují se dva uchazeči: Jean d'Orléans, hrabě pařížský, zastupuje orleánskou linii a byl by konstitučním monarchou, „králem Francouzů“. Louis de Bourbon, vévoda z Anjou, zastupuje legitimistickou linii Ludvíka XIV. a z božího práva by byl „králem Francie“. Tradicionalisté z Action Française musí rozhodnout." # todo: NEW TRANSLATION
 france_md.354.a: "Korunovat Jeana d'Orléans, krále Francouzů" # todo: NEW TRANSLATION
 france_md.354.b: "Korunovat Louise de Bourbon, krále Francie" # todo: NEW TRANSLATION
 france_md.357.t: "Bonapartisté triumfují" # todo: NEW TRANSLATION
 france_md.357.d: "Bonapartistická frakce uvnitř hnutí zvítězila ve vnitřním boji. Jean-Christophe Napoléon Bonaparte bude korunován Napoleonem VII. Armáda a ti, kteří sní o císařské slávě, zvítězili nad monarchisty. Marine Le Pen a stará republikánská garda Národního sdružení byli zcela smeteni. Francie bude opět císařstvím." # todo: NEW TRANSLATION
 france_md.357.a: "Ať žije císař! Ať žije Francie!" # todo: NEW TRANSLATION
 france_md.358.t: "Bonapartisté se chopili moci ve Francii" # todo: NEW TRANSLATION
 france_md.358.d: "Šokující zprávy z [FRA.GetNameWithFlag]: extremistické frakce uvnitř vládnoucí strany se chopily kontroly a zrušily Pátou republiku. Umírněné vedení bylo odsunuto stranou, zatímco radikálové obnovují císařskou vládu. Tento dramatický převrat proti demokracii šokoval celý svět. Jak bychom měli reagovat?" # todo: NEW TRANSLATION
 france_md.358.a: "Odsoudit toto extremistické převzetí moci" # todo: NEW TRANSLATION
 france_md.358.b: "Jde o vnitřní francouzskou záležitost" # todo: NEW TRANSLATION
 france_md.359.t: "Monarchisté se chopili moci ve Francii" # todo: NEW TRANSLATION
 france_md.359.d: "Šokující zprávy z [FRA.GetNameWithFlag]: extremistické frakce uvnitř vládnoucí strany převzaly kontrolu a zrušily Pátou republiku. Umírněné vedení bylo odsunuto stranou, zatímco radikálové obnovují monarchistickou vládu. Tento dramatický puč proti demokracii šokoval celý svět. Jak bychom měli reagovat?" # todo: NEW TRANSLATION
 france_md.359.a: "Odsoudit toto extremistické převzetí moci" # todo: NEW TRANSLATION
 france_md.359.b: "Je to vnitřní francouzská záležitost" # todo: NEW TRANSLATION
 FRA_extremist_paramilitary_left: "Revoluční paramilitární jednotky" # todo: NEW TRANSLATION
 FRA_extremist_paramilitary_left_desc: "Dovolili jsme radikální frakci otevřeně organizovat její paramilitární sítě. Tyto revoluční buňky nám poskytují pouliční sílu a kontrolu nad možným odporem. Ale za jakou cenu? Jejich skutečná loajalita patří revoluci, nikoli vedení strany." # todo: NEW TRANSLATION
 FRA_extremist_paramilitary_right: "Tradicionalistické paramilitární jednotky" # todo: NEW TRANSLATION
 FRA_extremist_paramilitary_right_desc: "Dovolili jsme tradicionalistické frakci otevřeně organizovat její paramilitární sítě. Tyto buňky Action Française nám poskytují pouliční sílu a kontrolu nad možným odporem. Ale za jakou cenu? Jejich skutečná loajalita patří obnově monarchie, nikoli vedení strany." # todo: NEW TRANSLATION
 FRA_radical_infiltration: "Radikální infiltrace" # todo: NEW TRANSLATION
 FRA_radical_infiltration_desc: "Radikální frakce potichu proniká do stranického aparátu a armády. Její revoluční buňky se šíří institucemi a budují síť, kterou budou potřebovat, až přijde čas. Umírněné vedení si stále neuvědomuje, jak hluboko infiltrace sahá." # todo: NEW TRANSLATION
 FRA_traditionalist_infiltration: "Tradicionalistická infiltrace" # todo: NEW TRANSLATION
 FRA_traditionalist_infiltration_desc: "Tradicionalistická frakce potichu proniká do stranického aparátu a armády. Její monarchistické buňky se šíří institucemi a budují síť, kterou budou potřebovat, až přijde čas. Umírněné vedení si stále neuvědomuje, jak hluboko infiltrace sahá." # todo: NEW TRANSLATION
 FRA_republic_stabilized_left: "Republika stabilizována" # todo: NEW TRANSLATION
 FRA_republic_stabilized_left_desc: "Radikální hrozba byla neutralizována. DGSI zatkla extremistické vůdce a rozložila jejich paramilitární buňky. Francie zůstává republikou a umírnění reformisté si udržují kontrolu nad levicí. K revoluci nedojde, ale postaráme se, abychom lidem poskytli nástroje k sebevyjádření jinými způsoby." # todo: NEW TRANSLATION
 FRA_republic_stabilized_right: "Silná republika" # todo: NEW TRANSLATION
 FRA_republic_stabilized_right_desc: "Tradicionalistická hrozba byla rozdrcena a krizi jsme využili k prosazení rozsáhlých reforem posilujících moc státu. DGSI nyní disponuje rozšířenými pravomocemi v oblasti dohledu, policie získala nové pravomoci proti extremistickým organizacím a výkonná moc byla posílena. Pátá republika trvá: silnější, centralizovanější a pevně pod nacionalistickou kontrolou." # todo: NEW TRANSLATION
 FRA_general_strike: "Revoluční generální stávka" # todo: NEW TRANSLATION
 FRA_general_strike_desc: "Radikální frakce uvnitř levicové koalice mobilizovala dělníky ke generální stávce, čímž překročila záměry umírněného vedení. CGT ovládli revoluční radikálové, kteří to považují za první krok k úplnému ukončení republiky. Vedení strany ztratilo kontrolu nad hnutím, které samo započalo." # todo: NEW TRANSLATION
 FRA_country_chaos: "Znepokojivé zvěsti" # todo: NEW TRANSLATION
 FRA_country_chaos_desc: "Zemí se přehnala vlna paniky. Šíří se zvěsti o vyrabovaných skladech zbraní a hromadných dezercích. Něco se chystá..." # todo: NEW TRANSLATION
 FRA_sixth_republic_idea: "Šestá republika" # todo: NEW TRANSLATION
 FRA_sixth_republic_idea_desc: "Pátou republiku už nikdo nechtěl, a tak jsme ji demokraticky ukončili a založili novou republiku, která je blíže lidu." # todo: NEW TRANSLATION
 FRA_commune_reborn_idea: "Francouzská komuna" # todo: NEW TRANSLATION
 FRA_commune_reborn_idea_desc: "Revoluční radikálové zcela zvítězili. Umírnění reformisté, kteří kdysi vedli levici, byli v rámci přeměny Francie v dělnický stát odstraněni. V duchu roku 1871 nyní vládnou dělnické rady a výrobní prostředky byly kolektivizovány. Rudý prapor vlaje tam, kde kdysi vlála trikolóra." # todo: NEW TRANSLATION
 FRA_kingdom_restored_idea: "Obnovené království" # todo: NEW TRANSLATION
 FRA_kingdom_restored_idea_desc: "Tradicionalističtí extremisté uvnitř nacionalistického hnutí dosáhli svého snu: Francie má opět krále. Umírnění republikáni z Národního sdružení sledují s nevěřícným úžasem, jak Action Française oslavuje a fleur-de-lis nahrazuje trikolóru." # todo: NEW TRANSLATION
 FRA_exploitation: "Metropole nás vyždímala" # todo: NEW TRANSLATION
 FRA_exploitation_desc: "Naše továrny, náš obchod a naše daně směřují nejprve do Paříže a teprve potom k našim vlastním lidem. Každá zásilka, která opouští doky, v nás zanechává o trochu více odporu doma a o trochu větší odstup od Impéria." # todo: NEW TRANSLATION
 FRA_empire_restored_idea: "Obnovené císařství" # todo: NEW TRANSLATION
 FRA_empire_restored_idea_desc: "Bonapartistická frakce uvnitř hnutí obnovila Francouzské císařství pod Napoleonem VII. Umírnění republikáni, kteří vybudovali Národní sdružení, byli smeteni těmi, kdo sní o imperiální slávě. Francii opět vládne císař a vojensko-tradicionalistické spojenectví slaví své úplné vítězství." # todo: NEW TRANSLATION
 FRA_investing_eu: "Investice v zemi EU" # todo: NEW TRANSLATION
 FRA_investing_eu_desc: "V současnosti pomáháme jiné zemi EU s rozvojem" # todo: NEW TRANSLATION
 FRA_election_result: "Výsledky" # todo: NEW TRANSLATION
 FRA_election_result_desc: "Prezidentské volby skončily nebo se blíží ke konci; volební preference se po nějakou dobu pravděpodobně nezmění." # todo: NEW TRANSLATION
 FRA_spy_napoleon_lar: "Bonapartistická tajná služba" # todo: NEW TRANSLATION
 FRA_spy_napoleon_lar_desc: "Nová generace tajných agentů vycvičených k rozsévaní sváru mezi našimi nepřáteli a k předávání zpravodajských informací v reálném čase našemu pozemnímu vojsku, námořnictvu a letectvu, zatímco se znovudobytí blíží." # todo: NEW TRANSLATION
 FRA_spy_napoleon_non_lar: "Bonapartistická tajná služba" # todo: NEW TRANSLATION
 FRA_spy_napoleon_non_lar_desc: "Nová generace tajných agentů vycvičených k rozsévaní sváru mezi našimi nepřáteli, kteří sledují naše vlastní kasárny a ministerstva kvůli dalšímu spiknutí proti trůnu." # todo: NEW TRANSLATION
 FRA_5th_republic: "Pátá republika" # todo: NEW TRANSLATION
 FRA_5th_republic_desc: "Současný francouzský politický systém zavedený v roce 1958. Republika ustavená pod vedením generála de Gaulla a přizpůsobená jeho potřebám. Stabilní systém, který však začíná odhalovat své meze v zemi stále více vychýlené z rovnováhy, kde má prezident neomezenou moc." # todo: NEW TRANSLATION
 FRA_war_against_republic: "Válka proti republikánství" # todo: NEW TRANSLATION
 FRA_war_against_republic_desc: "Francouzská monarchie byla za absolutismu nejsilnější. Od té doby naše země strpěla desetiletí republik, z nichž každá byla nestabilnější než ta předchozí. Republikánské a demokratické hodnoty jsou pro naši zemi nebezpečné a šíří se světem jako rakovina. Musíme s tím skoncovat." # todo: NEW TRANSLATION
 FRA_EU_strong: "Síla s EU" # todo: NEW TRANSLATION
 FRA_EU_strong_desc: "Být pilířem Evropské unie je velkou odpovědností, ale také velkou silou. Náš osud je spojen s osudem Evropské unie, ať se nám to líbí, nebo ne." # todo: NEW TRANSLATION
 FRA_NOTRe_law: "Zákon NOTRe" # todo: NEW TRANSLATION
 FRA_NOTRe_law_desc: "Decentralizace nebyla ve Francii řádně provedena a zanechala po sobě četné právní mezery a nesrovnalosti. Zákon o nové organizaci území republiky umožní tyto nedostatky napravit a zjednodušit organizaci a plánování našich území." # todo: NEW TRANSLATION
 FRA_military_indus_boost: "Investice do našeho obranného průmyslu" # todo: NEW TRANSLATION
 FRA_military_indus_boost_desc: "Vzhledem k rostoucímu mezinárodnímu napětí nesmíme šetřit na přípravě na možný konflikt." # todo: NEW TRANSLATION
 FRA_civilian_jobs_boost: "Zaměření na tvorbu pracovních míst" # todo: NEW TRANSLATION
 FRA_civilian_jobs_boost_desc: "Musíme více investovat na trhu práce, abychom našim občanům poskytli pestrou škálu pracovních příležitostí." # todo: NEW TRANSLATION
 FRA_internal_investment_boost: "Zaměření na domácí investice" # todo: NEW TRANSLATION
 FRA_internal_investment_boost_desc: "Poskytováním dotací soukromému sektoru jej budeme moci povzbudit k vytváření většího počtu pracovních míst." # todo: NEW TRANSLATION
 FRA_direct_construction_boost: "Investice do veřejných prací" # todo: NEW TRANSLATION
 FRA_direct_construction_boost_desc: "Protože trh nefunguje dobře, musíme využít naši pracovní sílu k vybudování ekonomiky zítřka." # todo: NEW TRANSLATION
 FRA_indusfarm_boost: "Dotování zemědělství" # todo: NEW TRANSLATION
 FRA_indusfarm_boost_desc: "Musíme pomoci našemu zemědělství získat zpět evropské trhy zvýšením produkce, ať už to bude vyžadovat cokoli." # todo: NEW TRANSLATION
 FRA_civilian_infra_boost: "Investice do infrastruktury" # todo: NEW TRANSLATION
 FRA_civilian_infra_boost_desc: "Musíme investovat do nemetropolitních oblastí, aby tamní obyvatelé měli přístup ke stejným službám jako v metropolitních oblastech." # todo: NEW TRANSLATION
 FRA_indusbuild_services_boost: "Investice do sektoru služeb" # todo: NEW TRANSLATION
 FRA_indusbuild_services_boost_desc: "Budujeme ekonomiku zítřka, osvobozenou od nekonkurenceschopných a znečišťujících průmyslových odvětví." # todo: NEW TRANSLATION
 FRA_techno_boost: "Investice do vzdělávání" # todo: NEW TRANSLATION
 FRA_techno_boost_desc: "Potřebujeme umožnit každému dosáhnout nejpokročilejšího vzdělání." # todo: NEW TRANSLATION
 FRA_res_health_boost: "Zaměření na veřejné služby" # todo: NEW TRANSLATION
 FRA_res_health_boost_desc: "Musíme obnovit poskytování služeb, které se příliš dlouho stalo terčem ultraliberálních politik." # todo: NEW TRANSLATION
 FRA_local_consumption_boost: "Podpora lokalizace našich potravinových dodávek" # todo: NEW TRANSLATION
 FRA_local_consumption_boost_desc: "Naše stoly zásobuje druhý konec světa, zatímco francouzské farmy krachují. Zkrácení cesty mezi polem a talířem udrží tuto hodnotu v zemi." # todo: NEW TRANSLATION
 FRA_job_planned_boost: "Investice do našeho průmyslu" # todo: NEW TRANSLATION
 FRA_job_planned_boost_desc: "Musíme pomoci našim podnikům vytvářet více pracovních míst a zabránit jim v propouštění. To nám umožní ukončit nezaměstnanost a zároveň zvýšit jistotu zaměstnání." # todo: NEW TRANSLATION
 FRA_ps_EUtrain: "Francouzská výcviková mise" # todo: NEW TRANSLATION
 FRA_ps_EUtrain_desc: "Francouzská vláda nás pozvala k účasti na společných vojenských cvičeních po boku dalších zemí Evropské unie." # todo: NEW TRANSLATION
 FRA_PCF_EUtrain: "Příprava eskalace na východě" # todo: NEW TRANSLATION
 FRA_PCF_EUtrain_desc: "Tváří v tvář možné ruské agresi se musíme připravit na její odvrácení na bojišti." # todo: NEW TRANSLATION
 FRA_EU_LEAVE: "Obnova naší ekonomiky" # todo: NEW TRANSLATION
 FRA_EU_LEAVE_desc: "Naše ekonomika byla příliš úzce integrována s Evropskou unií; odchod z ní měl dalekosáhlé následky. Obnovíme ji tak, aby byla ještě silnější a nezávislejší." # todo: NEW TRANSLATION
 FRA_patriotic_fervor: "Vlastenecký zápal" # todo: NEW TRANSLATION
 FRA_patriotic_fervor_desc: "Znovudobytí našeho Impéria teprve začalo." # todo: NEW TRANSLATION
 FRA_learning_from_worforce: "Integrace společnosti" # todo: NEW TRANSLATION
 FRA_learning_from_worforce_desc: "Právě integrujeme znalosti a pracovní sílu sesterského národa." # todo: NEW TRANSLATION
 FRA_attack_UK_king: "La Royale" # todo: NEW TRANSLATION
 FRA_attack_UK_king_desc: "Naše pozornost může být zaměřena na Spojené království jakožto bývalého nepřítele Francie. Tak jako tak budeme muset dříve či později bojovat s námořní mocností. Francouzské námořnictvo proto musí být připraveno k boji na moři." # todo: NEW TRANSLATION
 FRA_french_papacy: "Papežství pod kontrolou" # todo: NEW TRANSLATION
 FRA_french_papacy_desc: "Rozhodli jsme se hostit sídlo katolické církve ve Francii. Můžeme je proto chránit a získat tak větší legitimitu v očích ostatních křesťanských zemí." # todo: NEW TRANSLATION
 FRA_gaullist_foreign_policy: "Gaullistická zahraniční politika" # todo: NEW TRANSLATION
 FRA_gaullist_foreign_policy_desc: "V návaznosti na vizi generála de Gaulla Francie prosazuje strategickou nezávislost na obou supervelmocích. Udržujeme si odstup od americké hegemonie a zároveň pragmaticky spolupracujeme s Ruskem a Čínou. Francie musí být velmocí sama o sobě, nikoli vazalem Washingtonu." # todo: NEW TRANSLATION
 FRA_anti_american_stance: "Protiamerický postoj" # todo: NEW TRANSLATION
 FRA_anti_american_stance_desc: "Francouzská vláda zaujala otevřeně nepřátelský postoj vůči Spojeným státům. Americké vojenské operace se nedočkají francouzské podpory a diplomatické vztahy se výrazně ochladily. Francie kráčí vlastní cestou, osvobozena od atlantických omezení." # todo: NEW TRANSLATION
 FRA_fn_russia_alignment_idea: "Sladění Národního sdružení s Ruskem" # todo: NEW TRANSLATION
 FRA_fn_russia_alignment_idea_desc: "Vláda Národního sdružení rozvinula úzké vztahy s Ruskem, odrážející historická spojení a společný odpor k americkému liberalismu. Chvála Marine Le Penové na Putinovy „tradiční hodnoty“ se promítla do konkrétního politického sbližování v mnoha otázkách." # todo: NEW TRANSLATION
 FRA_fn_protectionism: "Hospodářský patriotismus" # todo: NEW TRANSLATION
 FRA_fn_protectionism_desc: "Cla a veřejné zakázky nyní zvýhodňují francouzského výrobce před levnějším dovozem a naše továrny pracují naplno jako už roky ne. Naši obchodní partneři si toho všimli a nejsou za to vděční." # todo: NEW TRANSLATION
 FRA_fn_nationalist_policy: "Národní preference" # todo: NEW TRANSLATION
 FRA_fn_nationalist_policy_desc: "Jedním z našich klíčových opatření je národní preference: odsunout vše, co není francouzské, do pozadí." # todo: NEW TRANSLATION
 FRA_communist_foreign_policy: "Komunistická zahraniční politika" # todo: NEW TRANSLATION
 FRA_communist_foreign_policy_desc: "Komunistická strana uskutečnila radikální přesměrování francouzské zahraniční politiky: spojenectví se Spojenými státy je nemožné a Francie místo toho hledá solidaritu se socialistickými státy po celém světě. Členství v NATO je zásadně neslučitelné s naší ideologií." # todo: NEW TRANSLATION
 FRA_lfi_non_aligned_policy: "Neangažovaná Francie" # todo: NEW TRANSLATION
 FRA_lfi_non_aligned_policy_desc: "La France Insoumise zavedla politiku neangažovanosti a odmítá americkou hegemonii i ruský autoritarismus. Francie se nebude účastnit amerických vojenských dobrodružství a zachová si nezávislost na velitelských strukturách NATO, přičemž bude usilovat o vedení nového hnutí nezúčastněných." # todo: NEW TRANSLATION
 FRA_lfi_anti_nato: "Protinatovské politiky" # todo: NEW TRANSLATION
 FRA_lfi_anti_nato_desc: "Úspěšně jsme vystoupili z NATO; už jsme nemohli tolerovat činy amerického imperialismu. Naše současné postavení nám nyní poskytuje větší kontrolu nad zahraniční politikou." # todo: NEW TRANSLATION
 FRA_worker_internationalism: "Maják internacionalismu" # todo: NEW TRANSLATION
 FRA_worker_internationalism_desc: "Komunismus byl ve Francii úspěšný, a to je fakt. Tento úspěch znamená, že máme spokojenou pracovní sílu a dokážeme přilákat dělníky z celého světa." # todo: NEW TRANSLATION
 FRA_lfi_social_europe: "Reforma evropských veřejných služeb" # todo: NEW TRANSLATION
 FRA_lfi_social_europe_desc: "Francie vedená LFI dokázala prosadit novou sociální agendu Evropské unie. Je to velké vítězství proti této hluboce neoliberální instituci." # todo: NEW TRANSLATION
 FRA_strategic_independance: "Strategická nezávislost" # todo: NEW TRANSLATION
 FRA_strategic_independance_desc: "Francie se zavázala k úplné strategické autonomii, zachovává svůj nezávislý jaderný odstrašující prostředek a odmítá podřízenost jakékoli cizí mocnosti. Americké základny nejsou na francouzské půdě vítány a Francie bude o vojenských intervencích rozhodovat sama." # todo: NEW TRANSLATION
 FRA_global_south_solidarity: "Solidarita s globálním Jihem" # todo: NEW TRANSLATION
 FRA_global_south_solidarity_desc: "Kolonialismus měl nepochybně významný dopad na rozvoj zemí globálního Jihu. Uděláme správnou věc a pomůžeme jim z této situace se zotavit." # todo: NEW TRANSLATION
 FRA_sovereigntist_eu_policy: "Suverenistická politika vůči EU" # todo: NEW TRANSLATION
 FRA_sovereigntist_eu_policy_desc: "Francie blokuje další federalizaci EU a brání národní suverenitu před bruselskou technokracií. Přestože zůstáváme v EU, vetujeme jakýkoli převod suverenity a odmítáme vytvoření evropského superstátu. Francie se nestane provincií." # todo: NEW TRANSLATION
 FRA_distance_nato: "Odstup od NATO" # todo: NEW TRANSLATION
 FRA_distance_nato_desc: "V návaznosti na de Gaullův precedens z roku 1966 si Francie udržuje odstup od integrované velitelské struktury NATO, přičemž zůstává členem aliance. Američtí vojáci nejsou rozmístěni na francouzské půdě a Francie si vyhrazuje právo na nezávislou vojenskou akci." # todo: NEW TRANSLATION
 FRA_left_nato: "Odchod z NATO" # todo: NEW TRANSLATION
 FRA_left_nato_desc: "Francie zcela vystoupila ze Severoatlantické aliance. Již není vázána článkem 5 a kráčí skutečně nezávislou cestou ve vojenských záležitostech, přičemž otevřeně odmítá americkou hegemonii." # todo: NEW TRANSLATION
 FRA_political_balance: "Trendy veřejného mínění" # todo: NEW TRANSLATION
 FRA_political_balance_desc: "Ačkoli byly naše instituce navrženy tak, aby zajišťovaly stabilitu, politická rovnováha nikdy nebyla tak nejistá. Strany stoupají a padají. Ať už jste kdokoli, budete muset upevnit naši kontrolu nad veřejným míněním." # todo: NEW TRANSLATION
 FRA_econ_policy: "Stav francouzské ekonomiky" # todo: NEW TRANSLATION
 FRA_econ_policy_desc: "Francouzská ekonomika je dobrým příkladem západní ekonomiky na úsvitu nového tisíciletí, která přechází z průmyslové velmoci v ekonomiku procházející restrukturalizací. Uvidíme, jak vaše reformy ovlivní její budoucí směřování." # todo: NEW TRANSLATION
 FRA_social_balance: "Francouzská sociální politika" # todo: NEW TRANSLATION
 FRA_social_balance_desc: "Francie je zemí, která na všech úrovních výrazně investuje do sociální politiky. Většina stran s ní však má problémy. Každý má vlastní představu o tom, jak by se měla změnit. Uvidíme, jak ji ovlivní vaše rozhodnutí." # todo: NEW TRANSLATION
 FRA_ps_political_balance: "Politická linie Socialistické strany" # todo: NEW TRANSLATION
 FRA_ps_political_balance_desc: "Politické klima utvářené vládou Socialistické strany. Platí pouze po dobu její vlády." # todo: NEW TRANSLATION
 FRA_ps_econ_policy: "Hospodářský program Socialistické strany" # todo: NEW TRANSLATION
 FRA_ps_econ_policy_desc: "Hospodářské reformy přijaté za vlády Socialistické strany. Směřují ekonomiku pouze po dobu její vlády." # todo: NEW TRANSLATION
