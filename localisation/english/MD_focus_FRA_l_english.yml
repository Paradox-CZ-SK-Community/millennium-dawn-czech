l_english:
 france_focus: "Francouzský strom zaměření" # todo: NEW TRANSLATION
 Francosphere: "Frankosféra" # todo: NEW TRANSLATION
 Continental_system: "Kontinentální systém" # todo: NEW TRANSLATION
 Holy_league: "Svatá liga" # todo: NEW TRANSLATION
 world_revolution_commune: "Světová revoluční komuna" # todo: NEW TRANSLATION
 FRA_state_of_french_politics: "Stav francouzské politiky" # todo: NEW TRANSLATION
 FRA_state_of_french_politics_desc: "Země Francie se nachází na jedné z nejzajímavějších - a nejnestabilnějších pozic na světě. Komunistické strany ve Francii zaznamenaly v volbách bezprecedentní úspěch. Národní fronta je také nastupující stranou, která reprezentuje rostoucí nacionalistickou rétoriku mezi lidmi." # todo: NEW TRANSLATION
 FRA_PS: "Socialistická strana" # todo: NEW TRANSLATION
 FRA_PS_desc: "Socialistická strana, znovu založená na kongresu v Épinay pod vedením Françoise Mitterranda, předstihla komunisty jako dominantní síla francouzské levice a od té doby se střídá u moci s republikánskou pravicí. Naše základna je široká a rozprostírá se napříč většinou tříd. Náš návrat do Elysejského paláce je jen otázkou času." # todo: NEW TRANSLATION
 FRA_UDF_LREM: "Centristická unie" # todo: NEW TRANSLATION
 FRA_UDF_LREM_desc: "Unie pro francouzskou demokracii, založená v roce 1978 na podporu Valéryho Giscarda d'Estainga, je spíše konfederací liberálů, křesťanských demokratů a radikálů než jedinou stranou. Po dvě desetiletí jsme byli odsunuti do role mladšího koaličního partnera. Nyní hodláme vybudovat střed, který bude vládnout sám za sebe." # todo: NEW TRANSLATION
 FRA_LR: "Republikánská pravice" # todo: NEW TRANSLATION
 FRA_LR_desc: "Gaullistická pravice je stejně stará jako Pátá republika a od roku 1995 drží prezidentský úřad. Nezdařilé rozpuštění parlamentu nás však stálo mnoho a dosadilo socialistu do Matignonu. Musíme upevnit středopravici, než nás naši soupeři na obou křídlech předstihnou." # todo: NEW TRANSLATION
 FRA_RPF: "Shromáždění pro Francii" # todo: NEW TRANSLATION
 FRA_RPF_desc: "Charles Pasqua a Philippe de Villiers založili v roce 1999 Shromáždění pro Francii pro gaullisty, kteří považovali hlavní pravici za příliš vstřícnou vůči Bruselu. Náš vliv je dnes malý, ale každý ústupek Evropské unii pro nás získává nové příznivce." # todo: NEW TRANSLATION
 FRA_FN: "Národní fronta" # todo: NEW TRANSLATION
 FRA_FN_desc: "Národní fronta, založená v roce 1972 kolem Jeana-Marie Le Pena, strávila tři desetiletí mimo úctyhodnou politiku, zatímco všechny ostatní strany proti ní semkly řady. Sanitární kordon začíná praskat a my chceme být připraveni, až se prolomí." # todo: NEW TRANSLATION
 FRA_LFI: "Nepoddajná Francie" # todo: NEW TRANSLATION
 FRA_LFI_desc: "Socialistická strana se vyčerpala obsluhou centristů a umírá mezi svými dvěma proudy. La France Insoumise je jedinou skutečnou levicovou opozicí neoliberálnímu řádu a my s ním nebudeme hledat kompromis." # todo: NEW TRANSLATION
 FRA_EELV: "Zelení" # todo: NEW TRANSLATION
 FRA_EELV_desc: "Ekologické hnutí se účastní francouzských voleb od roku 1984, aniž by ho kdy někdo bral vážně, a naše základna sotva přesahuje hranice měst. Čas je jediný zdroj, o který nemůžeme vést kampaň, takže musíme ostatní strany získat, nebo je nahradit." # todo: NEW TRANSLATION
 FRA_PCF: "Francouzská komunistická strana" # todo: NEW TRANSLATION
 FRA_PCF_desc: "Francouzská komunistická strana padla spolu se Sovětským svazem, k němuž byla připoutána, a naše dělnická základna se přesouvá ke krajní pravici nebo k neúčasti ve volbách. Zvrátit tento úpadek je naším jediným úkolem." # todo: NEW TRANSLATION
 FRA_friend_eu: "Spřátelit se s EU" # todo: NEW TRANSLATION
 FRA_friend_eu_desc: "Evropská unie je domovem mnoha národů vedených stranami podobnými té naší. Měli bychom tuto ideologickou shodu využít ke zdůraznění našeho proevropského postoje jako hráze proti nacionalismu." # todo: NEW TRANSLATION
 FRA_eternal_challenge: "Věčný vyzyvatel" # todo: NEW TRANSLATION
 FRA_eternal_challenge_desc: "Po desetiletí jsme jedinou stranou, která bojuje v ulicích i v parlamentu za obranu pracujících. Naši nepřátelé jsou jasní: pravice a extremisté. Lidé vědí, že nám mohou důvěřovat, že se jim postavíme. Naši nepřátelé nikdy nespí a my na to nesmíme zapomínat. Sjednoceni můžeme odvrátit jakoukoli hrozbu." # todo: NEW TRANSLATION
 FRA_eu_federalism: "Federalismus EU" # todo: NEW TRANSLATION
 FRA_eu_federalism_desc: "Ostatní národy si musí připomínat hodnoty, které jako Evropská unie zastáváme: chránit je, rozvíjet je a šířit je mezi ostatní evropské národy." # todo: NEW TRANSLATION
 FRA_let_industry: "Nechat průmysl odejít" # todo: NEW TRANSLATION
 FRA_let_industry_desc: "Těžký průmysl je ztrátou času a energie; v globalizované ekonomice, jako je ta naše, již není dostatečně produktivní. Nesmíme bránit jeho přesunu do nových průmyslových center světa. Místo toho bychom měli obrátit pozornost k nové podobě ekonomiky: sektoru služeb. Kanceláře se v nadcházejících letech stanou naším hlavním zaměřením. Jejich upřednostněním můžeme snížit nezaměstnanost a zvýšit příjmy, které vytvářejí." # todo: NEW TRANSLATION
 FRA_finance_minister: "Nová hospodářská politika" # todo: NEW TRANSLATION
 FRA_finance_minister_desc: "Ve světě procházejícím proměnou se musíme také vyvíjet a měnit své ekonomické zaměření. Hospodářské krize poukázaly na omezení keynesiánské ekonomie, takže musíme změnit způsob uvažování. Proto musíme zvolit náš další ekonomický program pro finanční sektor. Umožní nám snížit výdaje, ale jedinou otázkou je, komu můžeme důvěřovat." # todo: NEW TRANSLATION
 FRA_atlantist_drift: "Atlantický posun" # todo: NEW TRANSLATION
 FRA_atlantist_drift_desc: "NATO je nejsilnější aliancí, která v současnosti existuje. Pokud to tak chceme zachovat, musíme zlepšit výcvik našich ozbrojených sil." # todo: NEW TRANSLATION
 FRA_greece_eurozone: "Řecko v eurozóně" # todo: NEW TRANSLATION
 FRA_greece_eurozone_desc: "Řecko je známé svými dluhovými problémy. Můžeme mu pomoci finančními prostředky a ukázat mu, že zemím v Evropské unii na sobě skutečně záleží." # todo: NEW TRANSLATION
 FRA_tax_evasion: "Boj proti daňovým únikům" # todo: NEW TRANSLATION
 FRA_tax_evasion_desc: "Příliš mnoho lidí se nadále vyhýbá placení daní pomocí různých schémat. Musíme tomu učinit přítrž, protože jsme se k tomu zavázali." # todo: NEW TRANSLATION
 FRA_liberal_turn: "Liberální obrat" # todo: NEW TRANSLATION
 FRA_liberal_turn_desc: "Příliš dlouho jsme se snažili kontrolovat ekonomiku a finanční sektor, ale v globalizovaném světě je stále obtížnější kontrolovat tok kapitálu. Měli bychom tedy nechat trh, aby se reguloval sám. Co by se mohlo pokazit?" # todo: NEW TRANSLATION
 FRA_ease_interventionism: "Omezit intervencionismus" # todo: NEW TRANSLATION
 FRA_ease_interventionism_desc: "Měli bychom se soustředit na zlepšování diplomatických vztahů v Evropě, ne posílat naše lidi bojovat v cizí válce. Evropa je v současnosti kontinentem míru a jako významná regionální mocnost bychom měli jít všem dobrým příkladem." # todo: NEW TRANSLATION
 FRA_modern_interest: "Moderní zájem" # todo: NEW TRANSLATION
 FRA_modern_interest_desc: "Příliš dlouho jsme trávili čas obranou neproduktivní třídy, která je neustále v krizi. Je nejvyšší čas hledět do budoucnosti a budoucnost spočívá ve službách a technologiích." # todo: NEW TRANSLATION
 FRA_cut_with_unions: "Rozejít se s odbory" # todo: NEW TRANSLATION
 FRA_cut_with_unions_desc: "Odbory již nejsou pro naši zemi tak užitečné jako kdysi. Už bychom neměli ustupovat jejich požadavkům; koneckonců nejsme jejich rukojmí." # todo: NEW TRANSLATION
 FRA_vigipirate: "Posílit bezpečnost" # todo: NEW TRANSLATION
 FRA_vigipirate_desc: "Operace Vigipirate bude naším systémem národní bezpečnosti a protiteroristické pohotovosti. Má jít o trvalý mechanismus zapojující vládu, ozbrojené síly, místní samosprávy a občany, jehož cílem je předvídat, předcházet a chránit naši zemi před teroristickými hrozbami." # todo: NEW TRANSLATION
 FRA_not_done: "Ještě jsme neskončili" # todo: NEW TRANSLATION
 FRA_not_done_desc: "Jednadvacátý duben byl bezprecedentním ponížením. Náš kandidát byl vyřazen v prvním kole a republika byla nucena volit mezi pravicí a krajní pravicí. Aktivisté se však nevytratili, místní organizace se stále scházejí a voliči, kteří se přesunuli ke krajní levici, nemají kam jinam jít. Obnovíme se od základů a usmíříme se s odbory, které jsme odcizili." # todo: NEW TRANSLATION
 FRA_meet_friends: "Setkání s přáteli" # todo: NEW TRANSLATION
 FRA_meet_friends_desc: "Nyní je vhodná chvíle uspořádat setkání s dalšími socialistickými zeměmi a prodiskutovat současnou světovou situaci i cestu k socialismu." # todo: NEW TRANSLATION
 FRA_turn_ecology: "Obrat k ekologii" # todo: NEW TRANSLATION
 FRA_turn_ecology_desc: "Zelení nám v příštích legislativních volbách neustoupí bez ceny a ta cena je napsaná na reaktorech. Čtyřiadvacet z nich, počínaje Fessenheimem, a polovina našeho energetického mixu obětovaná do konce desetiletí. Energetické federace CGT již svůj názor jasně vyjádřily. Musíme rozhodnout, zda aliance stojí za obětování flotily." # todo: NEW TRANSLATION
 FRA_military_coop: "Vojenská spolupráce" # todo: NEW TRANSLATION
 FRA_military_coop_desc: "Na základě naší úzké spolupráce s NATO bychom měli pozvat další země ke společnému vojenskému výcviku. Všichni z toho budou těžit a našim nepřátelům to ukáže, jak jsme jednotní a připraveni." # todo: NEW TRANSLATION
 FRA_party_unity: "Jednota strany" # todo: NEW TRANSLATION
 FRA_party_unity_desc: "Každý sjezd končí stejně. Proudům trvá tři dny hádat se, nikdo nevyhraje a přes noc je sepsán syntetizující návrh, aby si všichni mohli připsat vítězství. Reims nás málem rozbil kvůli dvaačtyřiceti hlasům. Jednota je možná, ale kupuje se ministerstvy a sekretariáty a účet se vždy platí protekcí." # todo: NEW TRANSLATION
 FRA_strenght_throught_EU: "Posílit prostřednictvím EU" # todo: NEW TRANSLATION
 FRA_strenght_throught_EU_desc: "EU představuje demokratické hodnoty a stejně tak i my. To by mělo být dostatečným důvodem k udržení této organizace při životě, silné a stabilní. Pokud EU padne, Evropa se může znovu rozdělit." # todo: NEW TRANSLATION
 FRA_stole_voter: "Znovu se spojit s našimi voliči" # todo: NEW TRANSLATION
 FRA_stole_voter_desc: "Bassin minier a Midi nám po celé století patřily, ale nyní jsou nejbezpečnější půdou krajní pravice. Přednášky těmto voličům nepomohly. Pokud je chceme získat zpět, musíme za nimi přijít s něčím v rukou: znovu zažehnutými pecemi, otevřenými pracovními místy a veřejně daným průmyslovým slibem. Daným a následně dodrženým, protože porušený slib by nás v regionu stál celou generaci." # todo: NEW TRANSLATION
 FRA_ps_lgbt: "Zajistit práva LGBT" # todo: NEW TRANSLATION
 FRA_ps_lgbt_desc: "Občanský solidární pakt byl vždy jen polovičním opatřením. Manželství, adopce a plná rovnost párů před zákonem: to je reforma, kterou naši voliči očekávají a proti níž pravice slíbila bojovat v ulicích. La Manif pour Tous již rezervuje Champ de Mars. Můžeme prosadit zákon v plném rozsahu, nebo jej ořezat a zachovat klid." # todo: NEW TRANSLATION
 FRA_ps_win: "Socialismus byl zachráněn" # todo: NEW TRANSLATION
 FRA_ps_win_desc: "Dokázali jsme to! Dosáhli jsme nemožného. Po těsném odvrácení zhroucení a ponižující porážce z rukou Francouzů i dějin se nám podařilo věci obrátit. Naši odpůrci si mysleli, že jsme skončili, ale podařilo se nám získat zpět voliče a odvést je od vábení extremismu. Naše vítězství je známkou stability socialismu po celém světě. Naše vítězství je však teprve začátkem; vyzbrojeni touto zkušeností již podruhé neuděláme stejné chyby." # todo: NEW TRANSLATION
 FRA_Neither_right_nor_left: "Ani pravice, ani levice" # todo: NEW TRANSLATION
 FRA_Neither_right_nor_left_desc: "Nejlepším způsobem, jak rozvíjet naši zemi, je vyhýbat se rozdělující politice. Zaujměme středovou pozici, ne příliš napravo ani nalevo." # todo: NEW TRANSLATION
 FRA_Get_indecisives: "Získat nerozhodnuté" # todo: NEW TRANSLATION
 FRA_Get_indecisives_desc: "Ani pravice, ani levice. V této zemi jsou voliči, kteří nikdy nenašli stranu hodnou cesty k volební urně, a tisíce dobrovolníků ochotných zaklepat na jejich dveře a zeptat se, co chtějí. La Grande Marche je k nám přivede z obou starých stran zároveň. Nepřinese nám však jedinou místní federaci." # todo: NEW TRANSLATION
 FRA_abolish_ISF: "Zrušit ISF" # todo: NEW TRANSLATION
 FRA_abolish_ISF_desc: "Solidární daň z majetku vynáší málo a vyhání mnoho. Kapitál po třicet let odcházel do Bruselu a Ženevy a výnosy nikdy neospravedlnily tento odliv. Nahradíme ji daní pouze z nemovitostí. Peníze se vrátí domů. Stejně jako obvinění, že vládneme ve prospěch bohatých, které bude až do příštích voleb v každém titulku." # todo: NEW TRANSLATION
 FRA_Fight_Deficit: "Bojovat s deficitem" # todo: NEW TRANSLATION
 FRA_Fight_Deficit_desc: "Náš dluh je vysoký. Musíme proti němu bojovat bez ohledu na cenu, pokud se nechceme utopit v dluhu, který nedokážeme splatit. Lidé jistě pochopí nezbytnost těchto kroků." # todo: NEW TRANSLATION
 FRA_Reconize_Mistakes: "Uznat chyby" # todo: NEW TRANSLATION
 FRA_Reconize_Mistakes_desc: "Předchozí francouzští představitelé zacházeli s koloniálními národy hluboce nespravedlivě. Musíme konečně napravit křivdy tím, že za jejich činy zaplatíme. Nechme tuto kapitolu našich dějin konečně uzavřít." # todo: NEW TRANSLATION
 FRA_Western_policy: "Západní politika" # todo: NEW TRANSLATION
 FRA_Western_policy_desc: "Evropská unie a atlantická aliance udržují tento kontinent v bezpečí a nemáme žádný prospěch z předstírání opaku. Užší integrace s našimi spojenci nám přinese vliv v Bruselu a dobrou vůli ve Washingtonu. Zároveň však dává suverenistům, ať už gaullistickým či nacionalistickým, jediný argument, který kdy potřebovali: že se republika stala vazalem." # todo: NEW TRANSLATION
 FRA_independant_Euro: "Nezávislá Evropa" # todo: NEW TRANSLATION
 FRA_independant_Euro_desc: "Ostatní země musí vědět, že v rámci sjednocené Evropy neusilujeme o nadměrný vliv na jejich stabilitu. Sami můžeme být zranitelní, ale společně musíme být dostatečně silní, abychom tyto problémy překonali." # todo: NEW TRANSLATION
 FRA_reduce_tax: "Snížit daně" # todo: NEW TRANSLATION
 FRA_reduce_tax_desc: "Daň z bydlení nejvíce dopadá na domácnosti, které ji mohou nejméně unést, a daňová úleva na zaměstnávání již ukázala, co může úleva udělat pro nábor. Postupně ji zcela zrušíme. Obce přijdou o zdroj příjmů, takže je stát bude muset kompenzovat z Paříže a každý starosta ve Francii nám kvůli tomu bude psát." # todo: NEW TRANSLATION
 FRA_increase_pension_age: "Zvýšit důchodový věk" # todo: NEW TRANSLATION
 FRA_increase_pension_age_desc: "Lidem se to možná nebude líbit, ale s rostoucí délkou života díky novým pokrokům v medicíně musíme nadále financovat náš sociální systém. S klesajícím počtem mladých lidí, kteří financují důchody stále rostoucího počtu seniorů, však nemáme na výběr. Pracující obyvatelstvo musí pracovat déle, aby tento nedostatek generační obměny vykompenzovalo." # todo: NEW TRANSLATION
 FRA_growing_tensions: "Rostoucí napětí" # todo: NEW TRANSLATION
 FRA_growing_tensions_desc: "Náš svět je stále méně bezpečný a do Evropy se může vrátit válka. Abychom nebyli zaskočeni, musíme se na ni připravit." # todo: NEW TRANSLATION
 FRA_befriend_china: "Spřátelit se s Čínou" # todo: NEW TRANSLATION
 FRA_befriend_china_desc: "Čína je významným obchodním partnerem Francie; je v našem zájmu vyjednat s ní výhodné smlouvy." # todo: NEW TRANSLATION
 FRA_nuclear_eu: "Jaderná EU" # todo: NEW TRANSLATION
 FRA_nuclear_eu_desc: "Padesát šest reaktorů a nikdo v Bruselu ochotný označit je za ekologické. Taxonomie se píše právě teď a pokud z ní bude jaderná energie vyloučena, celá naše flotila se na papíře stane přítěží. Berlín a Vídeň budou bojovat proti nám. Praha, Varšava a Helsinky nikoli. Vybudujeme alianci, vyhrajeme hlasování a smíříme se s tím, že si to Německo zapamatuje." # todo: NEW TRANSLATION
 FRA_reise_tertiary: "Vzestup terciéru" # todo: NEW TRANSLATION
 FRA_reise_tertiary_desc: "Dnešní západní ekonomika je ekonomikou služeb, která propojuje různé aktéry zapojené do výroby. Francie musí v této ekonomické transformaci sehrát svou roli; jiná cesta neexistuje." # todo: NEW TRANSLATION
 FRA_reduce_public_service: "Omezit veřejné služby" # todo: NEW TRANSLATION
 FRA_reduce_public_service_desc: "Omezením vládních výdajů budeme moci znovu snížit náš dluh. Lidé nás budou nenávidět, ale musíme zvolit menší zlo. Pokud země padne kvůli dluhu, omezené sociální výdaje budou jejich nejmenším problémem." # todo: NEW TRANSLATION
 FRA_strat_indus: "Financování strategického průmyslu" # todo: NEW TRANSLATION
 FRA_strat_indus_desc: "Přestože naše průmyslová odvětví již nejsou tak konkurenceschopná jako dříve, existují určitá odvětví, bez nichž se neobejdeme. Jedním z nich je obranný průmysl, protože se nemůžeme spoléhat na jiné země, pokud jde o naši obranu. Francie vždy vyráběla vlastní zbraně. Je proto nanejvýš důležité, aby tomu tak zůstalo, zejména ve světě, kde roste napětí." # todo: NEW TRANSLATION
 FRA_arms_deal: "Zvýšit vývoz zbraní" # todo: NEW TRANSLATION
 FRA_arms_deal_desc: "Je všeobecně známo, že náš vojensko-průmyslový komplex vyrábí vynikající zbraně. Po mnoho let jsme proto jedním z předních vývozců zbraní. Tento obchod nám umožňuje nejen promítat naši sílu do světa, ale také získávat značné množství peněz a vlivu. Může to být jedině dobrá věc." # todo: NEW TRANSLATION
 FRA_eu_mil: "Pomoci s vojenským budováním EU" # todo: NEW TRANSLATION
 FRA_eu_mil_desc: "Zatímco naše země je relativně dobře připravena na návrat války do Evropy, totéž nelze říci o všech našich evropských partnerech. Většina z nich nemá šanci se ubránit. Měli bychom jim pomoci rozvinout jejich schopnosti, protože jejich bezpečnost je i naší bezpečností." # todo: NEW TRANSLATION
 FRA_finance_student: "Financovat nejlepší studenty" # todo: NEW TRANSLATION
 FRA_finance_student_desc: "Díky dokonalému uplatnění neoliberálního vzorce je naše ekonomika pevněji integrována do mezinárodní dynamiky než kdy dříve. To je dobře, protože nám to umožní těžit z pokroku ostatních zemí a investovat po celém světě, abychom sklízeli odměny." # todo: NEW TRANSLATION
 FRA_right_left_money: "Samotný střed" # todo: NEW TRANSLATION
 FRA_right_left_money_desc: "Příliš dlouho byla naše země držena jako rukojmí rozdělením na levici a pravici. Díky všem našim pokrokům ve financích a geopolitice jsme prokázali sílu ordoliberalismu. Naší úlohou je umožnit trhu ve Francii rozkvést a dovolit Francouzům těžit z bohatství, které vytváří." # todo: NEW TRANSLATION
 FRA_demograph_arms: "Podpora demografického zbrojení" # todo: NEW TRANSLATION
 FRA_demograph_arms_desc: "Dobrá kampaň za růst populace je dlouhodobou investicí do budoucnosti naší země." # todo: NEW TRANSLATION
 FRA_share_eu: "Sdílet naši moc s EU" # todo: NEW TRANSLATION
 FRA_share_eu_desc: "Naši nepřátelé musí vědět, že ochranu nezávislosti členských států Evropské unie myslíme vážně. V případě potřeby pohrozíme jakémukoli utlačovateli naším jaderným arzenálem." # todo: NEW TRANSLATION
 FRA_handle: "Zvládnout situaci" # todo: NEW TRANSLATION
 FRA_handle_desc: "Přišli kvůli dani z pohonných hmot a zůstali kvůli všemu ostatnímu. Kruhové objezdy jsou obsazené, Champs-Élysées dvakrát hořely a střely z nesmrtících zbraní nás stály oči i titulky ve stejné míře. Můžeme přijmout zákon proti výtržníkům a vyčistit je silou, nebo otevřít celonárodní debatu a koupit mír deseti miliardami eur, které nemáme." # todo: NEW TRANSLATION
 FRA_startup_nation: "Start-upová země" # todo: NEW TRANSLATION
 FRA_startup_nation_desc: "Díky naší odvážné politice a odmítnutí ustoupit před těmito vzpurnými Galy jsme dosáhli svého cíle. Proměnili jsme společnost, která byla kdysi nepřátelská k podnikání, a osvobodili ji od daní a regulací, které ji brzdily. Čeká nás světlá budoucnost inovací a liberalismu. To je naše vize." # todo: NEW TRANSLATION
 FRA_Neo_gaulism: "Neogaullismus" # todo: NEW TRANSLATION
 FRA_Neo_gaulism_desc: "Neogaullismus je francouzské politické hnutí, které přizpůsobilo původní zásady generála Charlese de Gaulla. Zdůrazňoval národní suverenitu, silné výkonné prezidentské pravomoci a nezávislost zahraniční politiky tak, aby odpovídaly moderní, globalizované době." # todo: NEW TRANSLATION
 FRA_known: "Nejistá jistota" # todo: NEW TRANSLATION
 FRA_known_desc: "Od založení Třetí republiky a vzniku stabilní podoby republikánství tu vždy byli konzervativci. Jsme jednoduše jejich nejnovějším vtělením. Po desetiletí jsme byli přítomni v každém druhém kole voleb. Není důvod, proč by příští volby měly být jiné. Naše nové tisíciletí je plné nejistot, a proto musíme být hlasem stability a zdravého rozumu tváří v tvář extremistům." # todo: NEW TRANSLATION
 FRA_oppose_immigration: "Postavit se imigraci" # todo: NEW TRANSLATION
 FRA_oppose_immigration_desc: "Imigranti již prokázali, jak nebezpeční mohou být, zejména ti z oblastí nekonečných válek. Musíme jednat, abychom zabránili jejich příchodu." # todo: NEW TRANSLATION
 FRA_continue_liberal: "Pokračovat v liberální politice" # todo: NEW TRANSLATION
 FRA_continue_liberal_desc: "Budeme pokračovat v provádění našeho programu ekonomické liberalizace, protože tak ekonomika funguje nejlépe." # todo: NEW TRANSLATION
 FRA_patriotism: "Vlastenectví" # todo: NEW TRANSLATION
 FRA_patriotism_desc: "Francouzi by měli být hrdí na svou národnost a historii, která s ní souvisí. V důsledku toho si musí zvyknout požadovat od státu méně. Na velkorysost minulosti si již nemůžeme dovolit. Musí se naučit stát na straně státu a přestat neustále požadovat více veřejných peněz." # todo: NEW TRANSLATION
 FRA_turn_west: "Obrat na Západ" # todo: NEW TRANSLATION
 FRA_turn_west_desc: "Měli bychom zlepšit vztahy s našimi zámořskými přáteli v Americe. Jejich politici se mohou měnit, ale musíme zajistit, aby se žádný z nich nikdy neobrátil k Francii zády." # todo: NEW TRANSLATION
 FRA_third_voice: "Třetí hlas Francie" # todo: NEW TRANSLATION
 FRA_third_voice_desc: "Ve světě stále rozděleném mezi NATO a trosky SSSR musí Francie kráčet vlastní cestou, jak to vždy dělala. Nemůžeme se spoléhat na vzdáleného spojence, který by nám nepřišel na pomoc; proto musíme utvářet svůj vlastní osud po boku těch, kteří odmítají útlak z Východu i Západu." # todo: NEW TRANSLATION
 FRA_austerity: "Použít úsporná opatření" # todo: NEW TRANSLATION
 FRA_austerity_desc: "Deficit je strukturální a ratingové agentury krouží kolem. Škrtáme všude, kde je to možné: na každé dva odcházející státní zaměstnance přijmeme jednoho, sloučíme ministerstva a odložíme výstavbu. Odbory to nazvou pravým jménem a kvůli důchodovému věku přivedou do ulic milion lidí, zatímco levice stráví desetiletí bojem proti jedinému rozhodnutí." # todo: NEW TRANSLATION
 FRA_question_ref: "Urychlit evropskou integraci" # todo: NEW TRANSLATION
 FRA_question_ref_desc: "Ačkoli je Francie jedním ze základních pilířů Evropské unie, její obyvatelé k ní nyní patří mezi nej skeptičtější. Francouzi opakovaně odmítali zavedení nových smluv. Měli bychom se jich přestat ptát na názor ke každé jednotlivé otázce, protože to výrazně zpomaluje proces evropské integrace. Mnozí to přijmou špatně a stanou se vůči Evropské unii ještě odmítavějšími, ale alespoň přestaneme být těmi, kdo ji brzdí." # todo: NEW TRANSLATION
 FRA_nato_integration: "Integrace do NATO" # todo: NEW TRANSLATION
 FRA_nato_integration_desc: "Další krok ke zlepšení naší bezpečnosti na tomto kontinentu. Kdo ví, v jakém stavu by dnes Evropa bez NATO byla." # todo: NEW TRANSLATION
 FRA_national_indep: "Národní nezávislost" # todo: NEW TRANSLATION
 FRA_national_indep_desc: "Přijetím pozice někde mezi Východem a Západem může Francie hájit své vlastní zájmy a již nemusí brát v úvahu názory úředníka ve Washingtonu." # todo: NEW TRANSLATION
 FRA_end_proximity_police: "Ukončit místní policii" # todo: NEW TRANSLATION
 FRA_end_proximity_police_desc: "Policie by neměla být směšována s lidmi, na které má dohlížet. Síly rychlé reakce by byly nákladově efektivnější." # todo: NEW TRANSLATION
 FRA_reform_wealth: "Reformovat sociální stát" # todo: NEW TRANSLATION
 FRA_reform_wealth_desc: "Francie byla příliš dlouho sociálním státem; je čas, aby se Francouzi postarali sami o sebe, aniž by se vždy spoléhali na veřejné peníze." # todo: NEW TRANSLATION
 FRA_looming_crisis: "Blížící se krize" # todo: NEW TRANSLATION
 FRA_looming_crisis_desc: "V lednu Société Générale zjistila, že jediný obchodník prodělal téměř pět miliard eur, aniž by si toho kdokoli všiml. To bylo varování. Americký hypoteční trh je na tom hůře, naše banky jsou mu vystaveny a Dexia má již potíže. Můžeme nyní vybudovat dohledový aparát a přitom zpomalit vlastní ekonomiku, nebo můžeme věřit cyklu a doufat." # todo: NEW TRANSLATION
 FRA_defend_interest: "Obrana francouzských zájmů" # todo: NEW TRANSLATION
 FRA_defend_interest_desc: "Nezávislost znamená, že se musíme chránit před zahraničním vlivem, a to jak ve vlastní zemi, tak všude, kde máme zájmy. Musíme v tomto směru podniknout kroky, abychom zajistili, že Francie zůstane velkým národem." # todo: NEW TRANSLATION
 FRA_lower_expanse: "Přestat financovat neproduktivní podniky" # todo: NEW TRANSLATION
 FRA_lower_expanse_desc: "Dotování ekonomické aktivity s sebou nese náklady, které jsou stále významnější. Měli bychom důkladně prověřit své výdaje a dotovat pouze efektivní a konkurenceschopná odvětví." # todo: NEW TRANSLATION
 FRA_oppose_lgbt: "Jednat proti wokeismu" # todo: NEW TRANSLATION
 FRA_oppose_lgbt_desc: "Myšlenkové proudy stále nepřátelštější tradičním normám pronikají do naší společnosti. Tyto normy existují z nějakého důvodu a vždy převládaly. Musíme této infiltraci zabránit." # todo: NEW TRANSLATION
 FRA_return_rurality: "Přijmout venkov" # todo: NEW TRANSLATION
 FRA_return_rurality_desc: "Velká města se stále více stávají ohnisky úpadku a kriminality. Musíme povzbudit naše občany, aby se z nich odstěhovali do oblastí, které jsou sice méně prosperující, ale blíže zdravému rozumu." # todo: NEW TRANSLATION
 FRA_end_assisted: "Ukončit kulturu závislosti" # todo: NEW TRANSLATION
 FRA_end_assisted_desc: "Příliš velká část naší populace spoléhá na nepodmíněné dávky, které jí byly přiznány, aniž by musela pracovat. Tato situace je nepřijatelná a zatěžuje naše finance. Musíme tyto dávky ukončit; lidé tak začnou pracovat." # todo: NEW TRANSLATION
 FRA_hostile_bear: "Nepřátelství vůči medvědovi" # todo: NEW TRANSLATION
 FRA_hostile_bear_desc: "Rusko se znovu stává hrozbou pro evropské zájmy a bezpečnost. Země v první linii se musí začít připravovat na obranu pro případ nepřátelské akce z východu." # todo: NEW TRANSLATION
 FRA_wake_up: "Probudit Francii" # todo: NEW TRANSLATION
 FRA_wake_up_desc: "Francouzi, osvobození od úpadku a pokušení nečinnosti, se mohou vrátit k práci." # todo: NEW TRANSLATION
 FRA_eternal_france: "Věčná Francie" # todo: NEW TRANSLATION
 FRA_eternal_france_desc: "Učinili jsme naši zemi silnější než kdy dříve. Posílili jsme vlastní ochranu před zahraničními hrozbami, omezili vnitřní problémy a snížili dluh. Zajistili jsme budoucnost naší země. Francie tu vždy byla a vždy bude." # todo: NEW TRANSLATION
 FRA_enought_soc: "Dost bylo socialismu" # todo: NEW TRANSLATION
 FRA_enought_soc_desc: "Jako konzervativní strana jsou našimi hlavními soupeři Progresivisté a Socialistická strana. Prosazují liberální Evropu, přesně to, co lidé již nechtějí, a my budeme pracovat na osvobození od ní. Musíme lidem ukázat, že jsme a vždy budeme nástrojem, jímž se uskutečňuje jejich touha po stabilitě a ochraně. Jsme proti liberální Evropské unii a progresivismu." # todo: NEW TRANSLATION
 FRA_sovereignism: "Zpochybnit naši suverenitu" # todo: NEW TRANSLATION
 FRA_sovereignism_desc: "Francouzský lid byl příliš dlouho přehlížen; nikdo v naší zemi nechtěl, aby Evropská unie nabyla takových rozměrů. Ať už šlo o smlouvy nebo rozšíření, lidé byli pokaždé skeptičtí a pokaždé ignorováni. Je čas, aby strana znovu otevřela otázku suverenity Francie." # todo: NEW TRANSLATION
 FRA_sacrifice: "Nezbytná oběť" # todo: NEW TRANSLATION
 FRA_sacrifice_desc: "Míříme do obtížných časů a náročná cesta před námi bude od Francouzů vyžadovat disciplínu a dobrou vůli. Francouzi se musí znovu naučit, že oběti pro Francii musí přinášet oni, nikoli naopak." # todo: NEW TRANSLATION
 FRA_elder_view: "Náš pohled starších" # todo: NEW TRANSLATION
 FRA_elder_view_desc: "Národní rada odboje odvedla při obnově naší země z trosek druhé světové války ohromnou práci a tím se stala vazalem Spojených států. Po desetiletí však její dílo postupně podkopávali politici, každý liberálnější než ten předchozí. Musíme se vrátit ke kořenům, následovat příklad generála, investovat do našeho průmyslu a začít znovu budovat zemi zdevastovanou desetiletími evropské integrace a deindustrializace." # todo: NEW TRANSLATION
 FRA_neccesity_leaving: "Potřeba odejít" # todo: NEW TRANSLATION
 FRA_neccesity_leaving_desc: "Naše cesta k odchodu z Evropské unie teprve začala. Musíme lidem vysvětlit, že z této Evropy musíme odejít, než bude příliš pozdě." # todo: NEW TRANSLATION
 FRA_fight_renouncement: "Boj proti zastáncům zřeknutí se" # todo: NEW TRANSLATION
 FRA_fight_renouncement_desc: "Generál nevěřil, že ostatní evropské mocnosti budou mít vůli vytvořit Evropu nezávislou na Spojených státech. Měl pravdu: několik desetiletí po jeho smrti se naši partneři více zajímají o podlézání Spojeným státům a nákup jejich vybavení než o práci na nezávislosti Evropy. Musíme tento sestupný trend odsoudit. Již sám o sobě je důvodem k odchodu z této Evropy, která je vazalem Spojených států." # todo: NEW TRANSLATION
 FRA_back_gaulism: "Strategický gaullismus" # todo: NEW TRANSLATION
 FRA_back_gaulism_desc: "Francie musí mít zahraniční politiku nezávislou na vůli Washingtonu. Nesmíme nikomu dovolit vměšovat se do naší politiky, rozhodně ne Spojeným státům, které se nás vždy snažily přimět k podřízenosti." # todo: NEW TRANSLATION
 FRA_social_gaulism: "Sociální gaullismus" # todo: NEW TRANSLATION
 FRA_social_gaulism_desc: "Tváří v tvář konci šťastné globalizace a lákadlu extremismu musíme Francouze vrátit na cestu rozumu. Sociální gaullismus odmítá kapitalismus i komunismus. Zahrnuje zásahy státu, které zaručí nezávislost a bezpečnost zaměstnání. S touto stabilitou lidé nepotřebují všechny tyto sociální dávky." # todo: NEW TRANSLATION
 FRA_return_nation: "Návrat k národu" # todo: NEW TRANSLATION
 FRA_return_nation_desc: "Musíme povzbudit francouzské společnosti působící v zahraničí, aby se jakýmikoli prostředky vrátily do země původu." # todo: NEW TRANSLATION
 FRA_anti_eu: "Kampaň proti EU" # todo: NEW TRANSLATION
 FRA_anti_eu_desc: "Nyní, když si lidé začínají uvědomovat, že Evropská unie již neslouží zájmům svých zakladatelů a snaží se narušovat jejich identitu, můžeme zintenzivnit naši kampaň proti Evropské unii. Musíme lidem vysvětlit, že většina jejich problémů pochází právě odtud." # todo: NEW TRANSLATION
 FRA_anti_usa: "Nepřátelství vůči USA" # todo: NEW TRANSLATION
 FRA_anti_usa_desc: "Spojené státy hledí na návrat gaullismu k moci s nelibostí. Mají důvod k obavám; náš nástup k moci jim rychle objasní, že již nejsme jejich spojenci. Koneckonců je dobře známo, že Spojené státy nemají spojence; mají především zájmy." # todo: NEW TRANSLATION
 FRA_RPF_death: "Obnovit trest smrti" # todo: NEW TRANSLATION
 FRA_RPF_death_desc: "Trest smrti byl před desítkami let zrušen navzdory přání většiny francouzské veřejnosti. Od té doby pachatelé všeho druhu stále více nabývali na drzosti, jistí si tím, že je stát nikdy skutečně nepotrestá. Suverénní národ musí být schopen plně prosazovat vlastní zákony. Obnovíme jej." # todo: NEW TRANSLATION
 FRA_destroy_liberalism: "Zničit ekonomický liberalismus" # todo: NEW TRANSLATION
 FRA_destroy_liberalism_desc: "Příliš dlouho byla naše hospodářská politika ovládána odporným ultraliberalismem. Naši občané viděli, jak jeden po druhém mizí jejich pracovní místa i průmyslová síla. Již ve své době generál varoval, že kapitalismus je z lidského hlediska špatná věc. Musíme se vrátit ke státním zásahům. Musíme obnovit pořádek ve veřejných financích i v tom, co zbylo z naší ekonomiky." # todo: NEW TRANSLATION
 FRA_campaign_frexit: "Kampaň za Frexit" # todo: NEW TRANSLATION
 FRA_campaign_frexit_desc: "Francouzi konečně pochopili, že Evropská unie je špatná věc. Zbývá jen dát jim prostředek, jak ventilovat svůj hněv. K ukončení rozebírání Francie bude stačit hlasovací lístek v urně." # todo: NEW TRANSLATION
 FRA_rebalance_foreign_policy: "Nově vyvážit naši zahraniční politiku" # todo: NEW TRANSLATION
 FRA_rebalance_foreign_policy_desc: "Ačkoli jsme jasně vyjádřili záměr rozejít se se Spojenými státy, naše politická třída je stále infiltrována jejich politikou, způsobem života a korporacemi. Musíme vyslat silný signál těm, kteří by si mohli myslet, že náš rozchod se Spojenými státy není skutečný. Obnovíme dialog s mocnostmi, které se vždy stavěly proti americké hegemonii." # todo: NEW TRANSLATION
 FRA_leave_nato: "Rozejít se s NATO" # todo: NEW TRANSLATION
 FRA_leave_nato_desc: "Abychom ochránili svou nezávislost, musíme se zbavit aliance, kterou jsme nikdy nepotřebovali a která nám přinesla jen velmi málo. Své zájmy dokážeme hájit sami." # todo: NEW TRANSLATION
 FRA_frexit_ref: "Referendum o Frexitu" # todo: NEW TRANSLATION
 FRA_frexit_ref_desc: "Nastal čas jednou provždy opustit Evropskou unii. Náš lid byl dostatečně připraven na to, aby Evropskou unii definitivně odmítl." # todo: NEW TRANSLATION
 FRA_strategic_autonomy: "Zajistit strategickou autonomii" # todo: NEW TRANSLATION
 FRA_strategic_autonomy_desc: "Podařilo se nám obnovit nezávislost Francie; můžeme svobodně dělat, co chceme. Francie je silná a svobodná a my jsme připraveni ji bránit." # todo: NEW TRANSLATION
 FRA_strong_people: "Silný lid" # todo: NEW TRANSLATION
 FRA_strong_people_desc: "Žádné další pobídky k zahálce; kapitalismus pod státní kontrolou. Obnovili jsme společenskou smlouvu s naším lidem. Ví, že jej chráníme a že nám dluží poslušnost a dobrou vůli." # todo: NEW TRANSLATION
 FRA_recover: "Obnovit ekonomiku" # todo: NEW TRANSLATION
 FRA_recover_desc: "Navzdory veškerému našemu úsilí připravit se na odchod z Evropské unie naše ekonomika utrpěla. Než vůbec pomyslíme na pomstu našim utlačovatelům, musíme ji znovu vybudovat na pevných základech." # todo: NEW TRANSLATION
 FRA_our_own_sphere: "Naše vlastní sféra" # todo: NEW TRANSLATION
 FRA_our_own_sphere_desc: "Nejsme jediní, kterým se podařilo zbavit amerického imperialismu. Můžeme najít spojence a vytvořit alianci založenou na vzájemném respektu mezi nezávislými mocnostmi." # todo: NEW TRANSLATION
 FRA_paid_reconnexion: "Blokáda Evropy" # todo: NEW TRANSLATION
 FRA_paid_reconnexion_desc: "Nyní, když jsme bezpečně a úspěšně opustili Evropskou unii, můžeme začít přemýšlet, jak jí to oplatit. Evropská unie a její sítě musí procházet naší zemí. To nám poskytuje obrovskou příležitost k pomstě." # todo: NEW TRANSLATION
 FRA_certain_idea: "Určitá idea Francie" # todo: NEW TRANSLATION
 FRA_certain_idea_desc: "Během několika let se nám podařilo obnovit Francii do podoby, jakou by měla mít: hrdou a svobodnou velmoc. Generál by byl hrdý, že jsme obnovili jeho odkaz. Měl pravdu: Francie může být pouze velmocí, jinak by nebyla Francií." # todo: NEW TRANSLATION
 FRA_salvage_mondialisation: "Zachránit oběti globalizace" # todo: NEW TRANSLATION
 FRA_salvage_mondialisation_desc: "Naši lidé v důsledku globalizace velmi trpěli. Platí to zejména pro pracující, kteří přišli o práci, viděli rozpad své země a pošlapání svých hodnot. Musíme jim ukázat, že jsme stranou, která přinese změnu, odváží se klást správné otázky a nabídne velmi jednoduché řešení těchto problémů." # todo: NEW TRANSLATION
 FRA_raise_tariff: "Zvýšit cla" # todo: NEW TRANSLATION
 FRA_raise_tariff_desc: "Zvýšení cel nám umožní ukončit nespravedlivou zahraniční konkurenci a dovolí Francouzům nakupovat výrobky vyrobené ve Francii." # todo: NEW TRANSLATION
 FRA_dynamise_periph: "Oživit okrajové oblasti" # todo: NEW TRANSLATION
 FRA_dynamise_periph_desc: "Venkovské a předměstské oblasti byly plánovací politikou vždy zanedbávány. Investuje se do nich nedostatečně a často v nich žijí lidé v nejistých podmínkách, ale s velkou dobrou vůlí. Musíme jim pomoci získat přístup ke stejné infrastruktuře, jaká je dostupná ve velkých městech." # todo: NEW TRANSLATION
 FRA_focus_insecurity: "Zaměřit se na nejistotu" # todo: NEW TRANSLATION
 FRA_focus_insecurity_desc: "Imigrace vedla k výraznému nárůstu nejistoty v naší zemi. Musíme obyvatelstvu ukázat, že tento problém bereme velmi vážně, zvýšením počtu policistů, zavedením přísnějších kontrol a tvrdým postupem proti zločinu." # todo: NEW TRANSLATION
 FRA_eurosepticism: "Pohrozit Evropské unii" # todo: NEW TRANSLATION
 FRA_eurosepticism_desc: "Evropská unie se vždy snažila umlčet země jako ta naše, které se stavěly proti její ultraglobalistické politice. Musíme jí vysvětlit, že věci se musí změnit a že můžeme ve Francii znovu zažehnout euroskeptické hnutí." # todo: NEW TRANSLATION
 FRA_sovergnism_policies: "Suverenistická politika" # todo: NEW TRANSLATION
 FRA_sovergnism_policies_desc: "Francie musí uplatňovat větší kontrolu nad svou ekonomikou, zahraniční politikou a především hranicemi. Bez toho bude naše snaha postavit zemi zpět na nohy marná. Musíme potvrdit své odhodlání vládnout vlastní zemi." # todo: NEW TRANSLATION
 FRA_economical_patriotism: "Ekonomické vlastenectví" # todo: NEW TRANSLATION
 FRA_economical_patriotism_desc: "Musíme naléhat na francouzské společnosti, které se přestěhovaly do zahraničí, aby se vrátily do Francie. Pokud odmítnou, ponesou jejich podnikatelské aktivity ve Francii důsledky." # todo: NEW TRANSLATION
 FRA_social_populism: "Sociální populismus" # todo: NEW TRANSLATION
 FRA_social_populism_desc: "Stačí dát lidem to, co požadují, a tvrdě zakročit proti těm, které nenávidí, abychom si zajistili voličskou základnu a zůstali u moci." # todo: NEW TRANSLATION
 FRA_criticize_eu_migrant: "Kritizovat evropskou migrační politiku" # todo: NEW TRANSLATION
 FRA_criticize_eu_migrant_desc: "Evropská unie nedělá dost pro zastavení přílivu migrantů a nutí členské státy je přijímat. Musíme vyvinout tlak, abychom tomu učinili přítrž." # todo: NEW TRANSLATION
 FRA_common_accord_eu: "Dohoda s EU" # todo: NEW TRANSLATION
 FRA_common_accord_eu_desc: "Evropská komise pochopila, že nás nemůže ignorovat. Nyní jí musíme vysvětlit, že pokud nám dá, co chceme, zajistí si naši podporu." # todo: NEW TRANSLATION
 FRA_reinforce_nuke: "Posílit naši jadernou kapacitu" # todo: NEW TRANSLATION
 FRA_reinforce_nuke_desc: "Jaderná energie prokázala svou spolehlivost. Proč přecházet k jiným zdrojům energie, když máme tuto odbornost k dispozici? Musíme rozšířit jadernou kapacitu, abychom zvládli případnou krizi." # todo: NEW TRANSLATION
 FRA_FN_death: "Obnovit trest smrti" # todo: NEW TRANSLATION
 FRA_FN_death_desc: "Trest smrti byl před desítkami let zrušen a násilná kriminalita od té doby jen nabývá na drzosti. Naši občané si zaslouží znovu se cítit bezpečně ve své vlastní zemi. Obnovíme jej a nejhorší zločiny budou opět nést nejtvrdší následky." # todo: NEW TRANSLATION
 FRA_reject_immigration: "Odmítnout imigraci" # todo: NEW TRANSLATION
 FRA_reject_immigration_desc: "Nyní, když máme lepší kontrolu nad hranicemi, můžeme uskutečnit svou politiku tvrdého postupu proti nelegální imigraci." # todo: NEW TRANSLATION
 FRA_pro_russian_fn: "Proruská politika" # todo: NEW TRANSLATION
 FRA_pro_russian_fn_desc: "EU nepřestane být ultraglobalistická. Musíme se přiblížit Rusku, které se vždy dokázalo držet dál od zvráceností Západu. Společně to dotáhneme daleko." # todo: NEW TRANSLATION
 FRA_oppose_lgbt_fn: "Ukončit wokeismus" # todo: NEW TRANSLATION
 FRA_oppose_lgbt_fn_desc: "Některým lidem by nemělo být dovoleno vstoupit do naší země. Skoncujme s tímto nesmyslem a zaměřme se na obnovení pořádku založeného na jediném správném modelu rodiny." # todo: NEW TRANSLATION
 FRA_end_right_soil: "Ukončit právo půdy" # todo: NEW TRANSLATION
 FRA_end_right_soil_desc: "Narodit se ve Francii by nemělo stačit k tomu, aby byl člověk Francouzem. Musíme skoncovat s principem jus soli; zasloužíme si rozhodovat o tom, kdo může být francouzským občanem." # todo: NEW TRANSLATION
 FRA_support_rus_claim: "Podpořit ruské nároky" # todo: NEW TRANSLATION
 FRA_support_rus_claim_desc: "Rusko má plné právo cítit se ohroženo rozšiřováním NATO. Musíme prokázat ochotu pomoci mu napravit bezpráví, kterému čelilo." # todo: NEW TRANSLATION
 FRA_electoral_reform: "Volební reforma" # todo: NEW TRANSLATION
 FRA_electoral_reform_desc: "Volby ve Francii jsou stále více zpochybňovány kvůli volebnímu systému a reprezentativnosti stran. Tyto reformy můžeme uskutečnit a zároveň zajistit, aby pracovaly v náš prospěch, takže zůstaneme u moci." # todo: NEW TRANSLATION
 FRA_our_identity: "Naše identita" # todo: NEW TRANSLATION
 FRA_our_identity_desc: "Být nacionalistou v rámci útvaru, jako je Evropa, je obtížné. Opustili jsme myšlenku odchodu, takže musíme vytvořit novou identitu odpovídající našemu postavení v Evropské unii, která nás však nemá rozředit mezi zahraniční pracovní síly." # todo: NEW TRANSLATION
 FRA_boreal_space: "Náš postoj k Rusku" # todo: NEW TRANSLATION
 FRA_boreal_space_desc: "Prokázali jsme touhu spolupracovat s Ruskem a naše úsilí nezůstalo bez povšimnutí. Nyní je čas rozhodnout, co od Ruska chceme; je čas navázat kontakt." # todo: NEW TRANSLATION
 FRA_long_travel: "Francie vítězí" # todo: NEW TRANSLATION
 FRA_long_travel_desc: "Během několika posledních let ve funkci jsme Francouzům ukázali, že s odhodláním lze problémy země vyřešit velmi snadno. Učinili jsme Francii větší a méně závislou na sousedech i migračních tocích, které se nám podařilo omezit." # todo: NEW TRANSLATION
 FRA_sound_fury: "Zvuk a zuřivost" # todo: NEW TRANSLATION
 FRA_sound_fury_desc: "Francouzi již nechtějí smíření; umírnění je zklamali a nikdy nepřinesli skutečnou změnu. Jsme stranou změny a musíme Francouzům ukázat, že jsme odhodláni zpochybnit zavedený řád." # todo: NEW TRANSLATION
 FRA_silent_france: "Mobilizovat nevoliče" # todo: NEW TRANSLATION
 FRA_silent_france_desc: "Mnoho občanů ztratilo víru v naši republiku a její instituce. Musíme je povzbudit k návratu k volebním urnám, aby přinesli skutečnou změnu." # todo: NEW TRANSLATION
 FRA_end_privatisation: "Ukončit privatizaci" # todo: NEW TRANSLATION
 FRA_end_privatisation_desc: "Mnoho společností nadále přesouvá výrobu mimo Francii, aby zvýšily ziskovost. To zvyšuje nezaměstnanost a připravuje nás o odbornost. Musíme toto krvácení zastavit a v případě potřeby znovu získat kontrolu nad těmito společnostmi." # todo: NEW TRANSLATION
 FRA_pro_lgbt_lfi: "Prosazovat pozitivní diskriminaci" # todo: NEW TRANSLATION
 FRA_pro_lgbt_lfi_desc: "Musíme skoncovat s diskriminací, jíž byli příliš dlouho vystaveni lidé odchylující se od toho, co je nesprávně považováno za normu. Naše společnost se musí naučit přijímat všechny odlišnosti." # todo: NEW TRANSLATION
 FRA_toward_6th_rep: "Směrem k Šesté republice" # todo: NEW TRANSLATION
 FRA_toward_6th_rep_desc: "Nyní můžeme zahájit nejdůležitější část mandátu, který nám lid svěřil. Slíbili jsme změnu a lidé ji dostanou. Nastal čas utvářet novou republiku, která bude vyhovovat všem." # todo: NEW TRANSLATION
 FRA_distance_nato_lfi: "Odmítnout blokovou politiku" # todo: NEW TRANSLATION
 FRA_distance_nato_lfi_desc: "Vazby s NATO nás poutají k washingtonským válkám stejně jistě, jako by nás aliance s Moskvou poutala k jejím. Odmítáme oba bloky stejně; skutečné nezúčastněné postavení je jedinou zahraniční politikou hodnou nezávislé Francie." # todo: NEW TRANSLATION
 FRA_oppose_eu_treaty: "Postavit se smlouvě EU" # todo: NEW TRANSLATION
 FRA_oppose_eu_treaty_desc: "Našim občanům byly vnuceny nespravedlivé smlouvy. Nemáme povinnost se jimi řídit. Chceme-li tuto nespravedlivou Evropu změnit, musíme začít zpochybněním jejího legislativního rámce." # todo: NEW TRANSLATION
 FRA_guarante_employment: "Zaručit zaměstnání" # todo: NEW TRANSLATION
 FRA_guarante_employment_desc: "Naše země je plná talentovaných lidí, kteří nemohou naplnit svůj potenciál kvůli nedostatku pracovních míst způsobenému krizí. Musíme každému zaručit stabilní a důstojné zaměstnání; to by mělo být základem každé společenské smlouvy." # todo: NEW TRANSLATION
 FRA_state_power: "Moc státu" # todo: NEW TRANSLATION
 FRA_state_power_desc: "Instituce Páté republiky jsou příliš soustředěné kolem úřadu prezidenta republiky. Měli bychom podporovat veřejnou debatu, aby lidé mohli rozhodnout, jak má naše nová republika vypadat." # todo: NEW TRANSLATION
 FRA_democracy: "Individuální svobody" # todo: NEW TRANSLATION
 FRA_democracy_desc: "Mnoho krizí, kterým naše země čelila, vyvolalo praktické otázky týkající se bezpečnosti obyvatelstva. Dohled je nezbytný k ochraně našich občanů, ale kam až může stát zajít? Měli bychom občanům umožnit vyjádřit svůj názor." # todo: NEW TRANSLATION
 FRA_foreign_recognition_lfi: "Obnovit naši zahraniční politiku" # todo: NEW TRANSLATION
 FRA_foreign_recognition_lfi_desc: "Příliš dlouho naše země podporovala diktatury a odmítala uznat existenci suverénních států. Musíme s tím skoncovat." # todo: NEW TRANSLATION
 FRA_oppose_eu_immigration_lfi: "Zpochybnit postoj EU k imigraci" # todo: NEW TRANSLATION
 FRA_oppose_eu_immigration_lfi_desc: "Evropská unie je stále shovívavější vůči populistům krajní pravice. Nedělá dost pro pomoc našim potřebným sousedům a považuje je pouze za zdroj levné pracovní síly. Musíme se od tohoto přístupu distancovat a navrhnout humánnější politiku." # todo: NEW TRANSLATION
 FRA_economic_question: "Směřování ekonomiky" # todo: NEW TRANSLATION
 FRA_economic_question_desc: "Státní rozpočet a jeho správa jsou důležitými otázkami, na nichž závisí vše ostatní. I naši občané k nim musí mít co říci." # todo: NEW TRANSLATION
 FRA_ho_topic: "Dekonstrukce francouzských zvláštností" # todo: NEW TRANSLATION
 FRA_ho_topic_desc: "Mnohé zákony a zvyklosti vlastní francouzské kultuře neusnadňují integraci jiných kultur. Měli bychom občany vyzvat k diskusi o integraci menšin." # todo: NEW TRANSLATION
 FRA_balance_tax: "Vyvážit zdanění" # todo: NEW TRANSLATION
 FRA_balance_tax_desc: "Je nepřijatelné, aby střední třída a lidé v nejistých poměrech byli daněmi vyždímáni, zatímco bohatí neplatí spravedlivý podíl. Musíme obnovit rovnováhu." # todo: NEW TRANSLATION
 FRA_climate_war_eco: "Výzva našeho tisíciletí" # todo: NEW TRANSLATION
 FRA_climate_war_eco_desc: "Životní prostředí a klima se rychle zhoršují. Musíme chránit to, co zbylo z naší biologické rozmanitosti, a připravit společnost na obtížné časy, které nás čekají." # todo: NEW TRANSLATION
 FRA_dawn_6th_rep: "Úsvit Šesté republiky" # todo: NEW TRANSLATION
 FRA_dawn_6th_rep_desc: "Naše práce na Šesté republice je dokončena. Ať už bude výsledek jakýkoli, naše práce je hotová. Pravděpodobně jsme se zapsali do dějin." # todo: NEW TRANSLATION
 FRA_creolisation: "Kreolizace" # todo: NEW TRANSLATION
 FRA_creolisation_desc: "Staletí kulturní výměny, jimiž naše země prošla, utvořila novou kulturu. Mnozí ji však popírají; musíme občanům vysvětlit, že budoucnost spočívá ve společném soužití. Stále se máme tolik co učit od světa." # todo: NEW TRANSLATION
 FRA_work_less: "Pracovat méně, pracovat lépe" # todo: NEW TRANSLATION
 FRA_work_less_desc: "Naši předchůdci byli odhodláni nutit Francouze pracovat stále delší hodiny v čím dál horších podmínkách. Musíme tento trend zvrátit a pomoci občanům, aby si svou práci více užívali. Pak budou ve své práci o to kreativnější a nadšenější." # todo: NEW TRANSLATION
 FRA_reform_police: "Reformovat francouzskou policii" # todo: NEW TRANSLATION
 FRA_reform_police_desc: "Příliš dlouho byla policie používána jako nástroj nespravedlivé represe proti našim občanům. Musíme provést nezbytné reformy, abychom zmírnili tlak na občany a zároveň zajistili bezpečnost všech." # todo: NEW TRANSLATION
 FRA_post_empire: "Dekolonizovat naši mezinárodní politiku" # todo: NEW TRANSLATION
 FRA_post_empire_desc: "Naše koloniální minulost způsobila bývalým koloniím velké škody. Mnohé z nich se z ní stále snaží zotavit. Musíme podporovat jejich obnovu a přestat se je snažit ovládat." # todo: NEW TRANSLATION
 FRA_push_social_green_eu: "Šířit vzdor v Evropě" # todo: NEW TRANSLATION
 FRA_push_social_green_eu_desc: "Ve Francii jsme dosáhli mnoha úspěchů, ale musíme také povzbudit naše evropské partnery, aby se vydali stejnou cestou. Můžeme mobilizovat jejich lid, aby tlačil na vlády a my nebyli jediní, kdo v Evropě prosazuje progresivismus." # todo: NEW TRANSLATION
 FRA_social_green_fair_rep: "L'Insoumission" # todo: NEW TRANSLATION
 FRA_social_green_fair_rep_desc: "Během několika let jsme toho dosáhli tolik. Odklonili jsme Francii od ekonomického liberalismu a nejistoty a vytvořili humánnější Francii. Nikdy však nepřestaneme zpochybňovat zavedený řád, ať už doma nebo ve zbytku světa." # todo: NEW TRANSLATION
 FRA_no_time: "Nemáme čas" # todo: NEW TRANSLATION
 FRA_no_time_desc: "Vědci po desetiletí varují před ničivými účinky klimatické změny. Jejich předpovědi se nyní naplňují: stále extrémnější povětrnostní jevy. Lidé se musí probudit, pokud má mít příští generace šanci na život." # todo: NEW TRANSLATION
 FRA_strong_eu: "Síla EU" # todo: NEW TRANSLATION
 FRA_strong_eu_desc: "Francie nemůže přimět svět, aby bral klimatickou změnu vážně. Evropská unie však může sloužit jako vzor pro zbytek světa." # todo: NEW TRANSLATION
 FRA_ecology_available: "Zpřístupnit ekologii" # todo: NEW TRANSLATION
 FRA_ecology_available_desc: "Příliš dlouho byla ekologie považována za výsadu vyhrazenou bohatým. Musíme ji nadále prosazovat jako způsob, jak šetřit peníze a předcházet tragédiím pro všechny." # todo: NEW TRANSLATION
 FRA_right_vote: "Rozšířit volební právo" # todo: NEW TRANSLATION
 FRA_right_vote_desc: "Starost o životní prostředí a jeho budoucnost by neměla čekat do osmnácti let. Měli bychom rozšířit volební právo na širší část obyvatelstva." # todo: NEW TRANSLATION
 FRA_question_growth: "Zpochybnit ekonomický růst" # todo: NEW TRANSLATION
 FRA_question_growth_desc: "Po desetiletí byli lidé vedeni k přesvědčení, že nejlepším způsobem pomoci životnímu prostředí je udržitelný rozvoj. Proč však musíme stále rozvíjet a růst? Planeta a její zdroje mají své limity. Měli bychom místo toho směřovat ke zpomalení růstu." # todo: NEW TRANSLATION
 FRA_cooperate_eu: "Spolupracovat s partnery z EU" # todo: NEW TRANSLATION
 FRA_cooperate_eu_desc: "Ne všichni naši evropští partneři mají stejné zdroje nebo stejné odhodlání proměnit své ekonomiky v boji proti klimatické změně. Klíčovým partnerům můžeme pomoci investicemi do zelené infrastruktury v jejich zemích." # todo: NEW TRANSLATION
 FRA_push_eco_eu: "Prosazovat zelenou budoucnost" # todo: NEW TRANSLATION
 FRA_push_eco_eu_desc: "Naši evropští partneři nedělají v boji proti klimatické změně tolik co my. Můžeme povzbudit jejich obyvatelstvo k akci tím, že vyzveme jejich ekologické aktivisty, aby jednali a následovali příklad Francie." # todo: NEW TRANSLATION
 FRA_question_agriculture: "Udržitelné zemědělství" # todo: NEW TRANSLATION
 FRA_question_agriculture_desc: "Zemědělství ve Francii přešlo k masové produkci, aby uspokojilo potřeby minulého století. Z ekologického hlediska je odpovědnější než mnohé jiné formy zemědělství, ale stále je co zlepšovat. Kromě evropských norem musíme zemědělce povzbudit ke změně metod ve prospěch odpovědné a kvalitní produkce. Zajistíme propagaci jejich výrobků a jejich ziskovost." # todo: NEW TRANSLATION
 FRA_cooperation_no_compet: "Spolupráce, ne konkurence" # todo: NEW TRANSLATION
 FRA_cooperation_no_compet_desc: "Model společenského úspěchu u nás i ve světě je založen na individuálním úspěchu a okázalém vystavování bohatství. Toto chování škodí planetě, protože podporuje nadměrnou spotřebu a toxickou soutěživost mezi občany. Chceme-li snížit dopad našich společností na planetu, musíme tyto společenské modely zpochybnit." # todo: NEW TRANSLATION
 FRA_nuke_choice: "Diverzifikovat energetický mix" # todo: NEW TRANSLATION
 FRA_nuke_choice_desc: "Po desetiletí se energie ve Francii vyrábí v desítkách jaderných reaktorů. Tato technologie může být krátkodobě spolehlivá a relativně bezpečná, produkuje však odpad, který nedokážeme likvidovat. Není proto ideálním zdrojem energie pro udržitelnou budoucnost. Měli bychom diverzifikovat dodávky energie většími investicemi do obnovitelných zdrojů." # todo: NEW TRANSLATION
 FRA_green_eu: "Směrem k zelenější EU" # todo: NEW TRANSLATION
 FRA_green_eu_desc: "Naše úspěchy doma i v zahraničí v boji proti klimatické změně slouží jako vzor pro ostatní země Evropské unie. Můžeme na ně být hrdí." # todo: NEW TRANSLATION
 FRA_eco_life: "Ekologický způsob života" # todo: NEW TRANSLATION
 FRA_eco_life_desc: "Přijetí udržitelnějších výrobních metod samo o sobě stačit nebude. Musíme občany povzbudit k menší spotřebě. To znamená omezit všudypřítomnou reklamu a podporovat umírněnost. To všechno nepotřebujeme; můžeme být spokojeni s menším množstvím." # todo: NEW TRANSLATION
 FRA_upgrade_transport: "Modernizovat dopravní síť" # todo: NEW TRANSLATION
 FRA_upgrade_transport_desc: "Naše dopravní síť může být efektivní, ale je velmi nerovnoměrná a nutí lidi v odlehlých oblastech cestovat dražšími a znečišťujícími dopravními prostředky. Musíme zpřístupnit alternativu ve všech regionech; to znamená zlepšit spojení do odlehlých oblastí namísto dalšího rozvoje stále rychlejší sítě spojující jen několik evropských měst." # todo: NEW TRANSLATION
 FRA_dynamise_research: "Oživit výzkum" # todo: NEW TRANSLATION
 FRA_dynamise_research_desc: "Musíme pokračovat v rozvoji výzkumu; nikdy nepřestaneme hledat způsoby, jak dělat více s menšími prostředky a rozvíjet obnovitelnou energii." # todo: NEW TRANSLATION
 FRA_help_transi: "Pomoci evropské transformaci" # todo: NEW TRANSLATION
 FRA_help_transi_desc: "Naši evropští partneři si začínají uvědomovat, že klimatická změna je vážným problémem, který je bude stále více ovlivňovat. Někteří však ještě nedosáhli stupně rozvoje, jenž by jim umožnil do tohoto sektoru investovat. Můžeme jim pomoci vytvořením společného fondu našich zemí určeného na přechod k nízkouhlíkové ekonomice." # todo: NEW TRANSLATION
 FRA_end_fossile: "Ukončit používání fosilních paliv" # todo: NEW TRANSLATION
 FRA_end_fossile_desc: "Nyní, když je význam zelené transformace v Evropské unii obecněji uznáván, můžeme své úsilí zintenzivnit. Můžeme partnerům navrhnout postupné ukončení používání fosilních paliv." # todo: NEW TRANSLATION
 FRA_opti_indus: "Optimalizovat náš průmysl" # todo: NEW TRANSLATION
 FRA_opti_indus_desc: "Musíme vedoucím představitelům velkých společností vysvětlit, že zavedení skutečných ekologických opatření je v jejich nejlepším zájmu. I oni mohou dělat více s menší spotřebou zdrojů. Musíme však dbát na to, aby je to nepovzbudilo k ještě větší výrobě." # todo: NEW TRANSLATION
 FRA_promote_local: "Podporovat místní spotřebu" # todo: NEW TRANSLATION
 FRA_promote_local_desc: "Nyní, když máme odpovědnější průmysl, musíme zajistit, aby si jeho výrobky naši občané skutečně mohli dovolit. Tržní síly však upřednostňují levnou výrobu. Musíme proto zajistit, aby byly výrobky z našeho průmyslu dostupnější než výrobky z druhého konce světa. To bude vyžadovat ohnutí pravidel volného obchodu. Měli bychom to však zvládnout." # todo: NEW TRANSLATION
 FRA_subsidies_green: "Dotovat zelený průmysl" # todo: NEW TRANSLATION
 FRA_subsidies_green_desc: "Povzbuzování podniků k ekologickým změnám nepřesvědčí všechny. Musíme poskytnout potřebné zdroje a nabídnout dotace podnikům podle jejich závazku vůči planetě a jejich efektivity. Tentokrát nebude prostor pro greenwashing." # todo: NEW TRANSLATION
 FRA_pressure_supply: "Tlačit na dodavatelské řetězce" # todo: NEW TRANSLATION
 FRA_pressure_supply_desc: "Je skutečností, že naše země nedokáže vyrábět všechny potřebné suroviny sama. Evropská unie dováží mnoho zdrojů ze zemí s laxními ekologickými normami. Je nepřijatelné dovážet zdroje, které nesplňují naše výrobní kritéria. Jinak jaký smysl mají regulace? Musíme spojit síly s dalšími evropskými mocnostmi a vyvinout tlak na vývozní země, aby přinesly změnu." # todo: NEW TRANSLATION
 FRA_reduce_extraction: "Omezit těžbu zdrojů" # todo: NEW TRANSLATION
 FRA_reduce_extraction_desc: "Těžba nerostů a ropy je znečišťující proces, který často překračuje schopnost naší planety tyto zdroje obnovovat. Přestože nesedíme na ropném poli, musíme jít světu příkladem zavedením přísnějších regulací těžby nerostů a paliv." # todo: NEW TRANSLATION
 FRA_power_rail: "Rozšířit železnici EU" # todo: NEW TRANSLATION
 FRA_power_rail_desc: "Evropská unie již má rozsáhlou železniční síť, ale můžeme si vést ještě lépe. Příliš mnoho nákladů se stále přepravuje kamiony; musíme to omezit." # todo: NEW TRANSLATION
 FRA_altermondialism: "Prosazovat alterglobalismus" # todo: NEW TRANSLATION
 FRA_altermondialism_desc: "To, že globalizace přestala prospívat veřejnosti, nikoho nepřekvapuje. Musíme však veřejnost odvést od antiglobalizačního hnutí. Tyto tendence jsou nebezpečné, protože staví globalizaci proti nacionalistickému řešení, které je často agresivní. Musíme jim ukázat, že hlavním nepřítelem je kapitalismus." # todo: NEW TRANSLATION
 FRA_unite_struggle: "Konvergence bojů" # todo: NEW TRANSLATION
 FRA_unite_struggle_desc: "Musíme sjednotit všechny utlačované, ať už kvůli pohlaví, náboženství, barvě kůže nebo jakékoli jiné charakteristice. Všichni jsou oběťmi kapitalismu a jeho sociálních důsledků. Musíme jim ukázat, že všechny jejich problémy mají příčinu i řešení." # todo: NEW TRANSLATION
 FRA_retake_past: "Získat zpět dělníky" # todo: NEW TRANSLATION
 FRA_retake_past_desc: "Po rozpadu SSSR a konci „šťastné globalizace“ se velká část naší bývalé dělnické voličské základny obrátila ke krajně pravicovým populistům nebo většinou přestala volit úplně. Dnes se nám podařilo vyhrát volby, ale abychom zajistili dlouhodobé přežití, musíme obnovit dělnickou základnu, která je samotnou DNA naší strany. Musíme brát její požadavky vážně, počínaje návratem pracovních míst, která naši liberální předchůdci poslali do Číny." # todo: NEW TRANSLATION
 FRA_turn_reform: "Reforma místo revoluce" # todo: NEW TRANSLATION
 FRA_turn_reform_desc: "Nyní, když jsme se vrátili do čela těchto institucí, již nemusíme uvažovat o akcích proti státu, protože jsme nyní jeho součástí. Budeme moci reformovat společnost zevnitř a odložit revoluční ideály." # todo: NEW TRANSLATION
 FRA_leave_nato_PCF: "Rozejít se s americkým imperialismem" # todo: NEW TRANSLATION
 FRA_leave_nato_PCF_desc: "NATO je nástrojem amerického imperialismu a prostředkem jeho nadvlády nad Evropou. Musíme se s ním rozejít a místo toho stát v solidaritě se všemi národy, které odporují washingtonské hegemonii." # todo: NEW TRANSLATION
 FRA_renogociate_treaty: "Znovu vyjednat smlouvu EU" # todo: NEW TRANSLATION
 FRA_renogociate_treaty_desc: "Naši lidé byli nuceni přijmout evropské smlouvy, proti nimž se však stavěli. Abychom mohli uskutečnit svůj program, musíme změnit legislativní rámec vnucený Evropskou unií. Nepochybně dojde k mocenskému zápasu s evropskými institucemi a sankcím, ale pokud skutečně chceme jednat v zájmu Francouzů, nemáme jinou volbu." # todo: NEW TRANSLATION
 FRA_undo_lib_PCF: "Uzavřít liberální závorku" # todo: NEW TRANSLATION
 FRA_undo_lib_PCF_desc: "Od prezidentství Françoise Mitterranda museli Francouzi snášet liberální politiku zleva i zprava. Je čas s tím skoncovat a ukázat, že jsme jiní. Že jsme odhodláni bojovat proti kapitalismu, i kdyby to znamenalo konflikt se Světovou obchodní organizací nebo Evropskou unií." # todo: NEW TRANSLATION
 FRA_protect_indus_pcf: "Chránit náš průmysl" # todo: NEW TRANSLATION
 FRA_protect_indus_pcf_desc: "Nestačí pouze investovat do průmyslu ve Francii; musíme zabránit jeho přesunu tam, kde je práce levnější a méně regulací. Jde o ochranu naší suverenity nad výrobními prostředky a zajištění důstojných pracovních míst a životních podmínek našich dělníků." # todo: NEW TRANSLATION
 FRA_left_front: "Rozšířit koalici" # todo: NEW TRANSLATION
 FRA_left_front_desc: "Naše vláda existuje, ale není příliš stabilní a chybí nám spojenci. Možná bychom měli hledat spojence mezi ostatními radikálně levicovými stranami. Do vlády se připojit nechtěly, ale možná bychom je mohli přesvědčit. Mohli bychom jim nabídnout několik ministerských postů výměnou za podporu." # todo: NEW TRANSLATION
 FRA_deal_devil_pcf: "Dohoda se socialisty" # todo: NEW TRANSLATION
 FRA_deal_devil_pcf_desc: "Ostatní radikálně levicové strany nebudou k zajištění stability, v niž doufáme, stačit. Možná bychom mohli najít společnou půdu se Socialistickou stranou. Koneckonců odchod z Evropy nikdy nebyl součástí našich plánů. Určitě s nimi najdeme společnou řeč a zajistíme je v naší koalici." # todo: NEW TRANSLATION
 FRA_tie_moscow: "Pouto s Moskvou" # todo: NEW TRANSLATION
 FRA_tie_moscow_desc: "Během studené války i po ní naše strana vždy stála na straně Moskvy. Éra SSSR sice skončila, ale zdá se, že současné ruské úřady jsou nakloněny komunistickým ideálům. Od našeho odchodu jsme pod hrozbou bývalých spojenců. Ruský spojenec by byl splněným snem; mohli bychom navázat ekonomickou spolupráci." # todo: NEW TRANSLATION
 FRA_eu_communism_PCF: "Prosazovat eurokomunismus" # todo: NEW TRANSLATION
 FRA_eu_communism_PCF_desc: "SSSR je nyní jen vzdálenou vzpomínkou a dnes se bez něj musíme obejít ve světě, kde Rusko, náš bývalý vzor, kolísá mezi oligarchií a ultranacionalismem. Komunismus a Evropská unie nejsou neslučitelné; ostatní evropské země vůči němu nejsou nepřátelské. Můžeme zůstat v Evropě a snažit se ji odvést od kapitalismu a fašismu." # todo: NEW TRANSLATION
 FRA_retake_sovereign: "Získat zpět naši suverenitu" # todo: NEW TRANSLATION
 FRA_retake_sovereign_desc: "Nyní, když jsme znovu získali kontrolu nad výrobním aparátem, máme prostředky k dalšímu postupu. Musíme se zbavit zahraničního vlivu, když nyní můžeme jednat nezávisle." # todo: NEW TRANSLATION
 FRA_empower_union_PCF: "Prosazovat odbory" # todo: NEW TRANSLATION
 FRA_empower_union_PCF_desc: "Navzdory své někdejší moci dnes odbory mnoho neznamenají. Úřady je záměrně oslabily rozdělením dělnické třídy a podkopáním jistoty zaměstnání. Přesto je v naší zemi nezbytná síla schopná postavit se zaměstnavatelům. Nemůžeme být všude najednou; dělnická třída musí znovu převzít kontrolu nad svou budoucností. Musíme jí pomoci získat zpět legitimitu v očích dělnictva." # todo: NEW TRANSLATION
 FRA_green_communism: "Obrátit se na Zelené" # todo: NEW TRANSLATION
 FRA_green_communism_desc: "Lidstvo není jedinou obětí kapitalismu; naše planeta je také v nebezpečí kvůli bezohlednému jednání lidstva. Se Zelenými můžeme najít společnou půdu; mohou nám pomoci navrhnout ekologický program, který budeme také potřebovat." # todo: NEW TRANSLATION
 FRA_no_russian_claim: "Ruská hrozba" # todo: NEW TRANSLATION
 FRA_no_russian_claim_desc: "Je vysoce pravděpodobné, že se Evropská unie dříve či později ocitne v konfliktu s Ruskem. Jelikož Rusko pravděpodobně zaměří svou pozornost na ukrajinská a pobaltská území, musíme začít oslovením Ukrajinců a nabídnout jim pomoc." # todo: NEW TRANSLATION
 FRA_green_turn: "Zelený komunismus" # todo: NEW TRANSLATION
 FRA_green_turn_desc: "Ve spolupráci s našimi zelenými spojenci jsme vypracovali ekologický program, který nám umožní připravit Francii na výzvy klimatické změny. Bude to od nás vyžadovat velké úsilí při obnově výrobních prostředků a současném omezení jejich uhlíkové stopy. Musíme to však udělat; i dělnická třída má děti, které musí vyrůstat ve světě vhodném k životu." # todo: NEW TRANSLATION
 FRA_favor_lgbt: "Ukončit diskriminaci" # todo: NEW TRANSLATION
 FRA_favor_lgbt_desc: "Nyní, když jsme naší populaci zajištěním pracovních míst a budoucnosti poskytli základní prostředky k obživě, musíme se věnovat také diskriminaci uvnitř společenských tříd. Musíme lidem připomenout, že diskriminace z jakéhokoli důvodu je nepřijatelná. Naše společnost se musí naučit přijímat všechny odlišnosti." # todo: NEW TRANSLATION
 FRA_dna_restored: "Obnovená DNA" # todo: NEW TRANSLATION
 FRA_dna_restored_desc: "S upevněnou koalicí se můžeme soustředit na obnovení významu dělnické třídy. Zavedením rozsáhlých zákonů na ochranu zaměstnanosti bychom měli být schopni získat zpět naši voličskou základnu. Obchodní komunitu to nepotěší, ale to nikdy nebylo naším cílem." # todo: NEW TRANSLATION
 FRA_condemn_rus: "Chránit východní Evropu" # todo: NEW TRANSLATION
 FRA_condemn_rus_desc: "Ruská agrese se nemusí zastavit na Ukrajině. Abychom ochránili naši vznikající Evropu, musíme zajistit, aby země východní a severní Evropy dokázaly odolat případné ruské invazi." # todo: NEW TRANSLATION
 FRA_by_ourself: "Triumf reformismu" # todo: NEW TRANSLATION
 FRA_by_ourself_desc: "Vybudováním silné koalice jsme položili základy pro to, aby Francie zůstala levicovým národem. Obnovili jsme důvěru voličů v levici a její instituce. Bez zavrhování minulosti, dokud jsme zde, nikdy nepřestaneme bojovat proti kapitalismu a fašismu v Evropě i ve světě." # todo: NEW TRANSLATION
 FRA_friend_of_past_pcf: "Směrem k nové Kominterně" # todo: NEW TRANSLATION
 FRA_friend_of_past_pcf_desc: "Zdá se, že ruská komunistická vláda je také dostatečně konsolidovaná. Mohli bychom navrhnout rozšíření spolupráce. Je čas vrátit komunismu jeho bývalou slávu. Kapitalisté a fašisté se nás musí znovu naučit bát." # todo: NEW TRANSLATION
 FRA_struggle_end: "Boj teprve začíná" # todo: NEW TRANSLATION
 FRA_struggle_end_desc: "Během těchto několika let ve funkci jsme vrátili komunismus na politickou mapu. Znovu jsme se spojili s voliči a zajistili budoucnost příštím generacím. Zdaleka však nekončíme. Vždy budou další výzvy k řešení. Alespoň jsme zajistili, že levice již nebude trojským koněm neoliberalismu." # todo: NEW TRANSLATION
 FRA_new_18th_brumaire: "Nový 18. brumaire" # todo: NEW TRANSLATION
 FRA_new_18th_brumaire_desc: "My bonapartisté jsme získali nejvyšší úřady republiky. Republikánská opozice byla umlčena a pouze my jsme schopni vést tuto zemi. Naši nepřátelé jsou početní, ale mezi Francií a jejím osudem nic stát nebude." # todo: NEW TRANSLATION
 FRA_revolution_bonapart: "Revoluční odkaz" # todo: NEW TRANSLATION
 FRA_revolution_bonapart_desc: "Napoleon I. a Francouzské císařství jsou přímými dědici Francouzské revoluce. Protože Francouzi jsou k těmto hodnotám hluboce připoutáni, musíme jim ukázat, že naše císařství není restaurací. Naše císařství je předzvěstí nové revoluce." # todo: NEW TRANSLATION
 FRA_despotism: "Despotismus místo nepořádku" # todo: NEW TRANSLATION
 FRA_despotism_desc: "Nepokoje posledních měsíců vyvolaly mezi našimi lidmi i na finančních trzích značné obavy. Musíme je ujistit, že dokud jsme u moci, žádný nepořádek nebude tolerován." # todo: NEW TRANSLATION
 FRA_napoleon_constitution: "Napoleonská ústava" # todo: NEW TRANSLATION
 FRA_napoleon_constitution_desc: "Instituce bývalé republiky již neodpovídají současnosti ani naší autoritě. Musíme je přetvořit a vytvořit stát silnější než kdy dříve." # todo: NEW TRANSLATION
 FRA_reform_military_napoleon: "Nová Velká armáda" # todo: NEW TRANSLATION
 FRA_reform_military_napoleon_desc: "Naše ozbrojené síly jsou pro zemi, jako je ta naše, více než dostačující. Nejsou však schopny udržet dlouhodobý konflikt proti několika zahraničním mocnostem. Musíme začít od nuly a vybudovat armádu, kterou nikdo nedokáže porazit." # todo: NEW TRANSLATION
 FRA_question_eu: "Evropa, nebo císařství" # todo: NEW TRANSLATION
 FRA_question_eu_desc: "Jelikož je naše země zakládajícím členem Evropské unie, je do ní hluboce integrována a odtržení nebude snadné. Jenže my hodláme bojovat proti ostatním evropským mocnostem. Máme znovu vstoupit do institucí Evropské unie jako nová francouzská vláda, nebo ji máme definitivně opustit? V každém případě budeme nuceni s nimi bojovat." # todo: NEW TRANSLATION
 FRA_centralised_admin: "Administrativní centralismus" # todo: NEW TRANSLATION
 FRA_centralised_admin_desc: "Decentralizace byla pro naši zemi chybou. Potřebujeme jasný řetězec velení a vertikální organizační strukturu." # todo: NEW TRANSLATION
 FRA_blame_ennemy: "Agresivní rétorika" # todo: NEW TRANSLATION
 FRA_blame_ennemy_desc: "Naše vznikající císařství je obklopeno budoucími nepřáteli. Dříve či později s nimi budeme nuceni bojovat, ale naše společnost není připravena vést válku proti bývalým spojencům. Svedli jsme je na scestí, když jsme jim slibovali mírovou budoucnost; dříve či později je přivedeme zpět do reality. Za tímto účelem je můžeme připravit podkopáním jejich důvěry v bývalé partnery a přimět je pochopit, že stojíme sami proti všem ostatním." # todo: NEW TRANSLATION
 FRA_proclaim_empire: "Císařské prohlášení" # todo: NEW TRANSLATION
 FRA_proclaim_empire_desc: "Během krátké doby se nám podařilo upevnit naši moc a vytvořit podmínky pro návrat Francie na mezinárodní scénu. Nyní je čas odhodit přetvářku. Po přehlídce demonstrující plný rozsah našich vojenských schopností vyhlásíme návrat Francouzského císařství. Přehlídka síly, varování, úsvit nové éry Francie. Poté uvidíme věci jasně: potenciální spojenci k nám přijdou a protivníci se odhalí." # todo: NEW TRANSLATION
 FRA_la_grande_armee: "Páteř naší armády" # todo: NEW TRANSLATION
 FRA_la_grande_armee_desc: "Po reformě řetězce velení nyní můžeme obrátit pozornost ke konkrétnějším reformám naší vojenské struktury. Nejprve se můžeme zaměřit na naši útočnou doktrínu z hlediska skutečně dostupných zdrojů k provádění operací." # todo: NEW TRANSLATION
 FRA_europe_nationalism: "Posílit evropský nacionalismus" # todo: NEW TRANSLATION
 FRA_europe_nationalism_desc: "Jen málo evropských národů nám přislíbilo podporu. Na návrat Francie vedené nacionalistickou stranou hledí s nelibostí. Jejich postoj je chybou; měli by vědět, že je lepší být s námi než proti nám. Donutíme je zaplatit za jejich nečinnost. Podpoříme nacionalistické skupiny v jejich zemích. To by mělo doma způsobit pořádný nepořádek, a pokud se dostanou k moci, získáme spojence." # todo: NEW TRANSLATION
 FRA_plebiscites: "Vláda prostřednictvím plebiscitů" # todo: NEW TRANSLATION
 FRA_plebiscites_desc: "Konec republiky v žádném případě neznamenal, že lidé zůstanou bez možnosti vyjádřit svůj názor. Musíme jim ukázat, že stále mají slovo, a pozvat je k rozhodování o různých otázkách naší politiky. Císař je bez potíží přesvědčí a tato předstíraná demokracie bude většině stačit." # todo: NEW TRANSLATION
 FRA_firepower: "Moderní palebná síla" # todo: NEW TRANSLATION
 FRA_firepower_desc: "Během napoleonských válek těžila Velká armáda z řady inovací, které jí umožnily rozpoutat bezprecedentní palebnou sílu proti kontrarevolučním silám. Dnes se pravidla bombardování s příchodem útočných letadel a dronů na bojiště výrazně změnila. Naše země má to štěstí, že vyniká jak v dělostřelectvu, tak v letectví. Musíme proto rozhodnout, čemu dát přednost, abychom zefektivnili výrobu pro podporu bojiště." # todo: NEW TRANSLATION
 FRA_8th_coalition: "Obklopeni nepřáteli" # todo: NEW TRANSLATION
 FRA_8th_coalition_desc: "Stejně jako v dobách napoleonských válek se zjevně rýsuje politická hra. Naši nepřátelé se nás obávají a čekají na první známku slabosti, aby se proti nám spojili. Tuto radost jim nedopřejeme. Naše hranice zůstanou militarizované tak dlouho, jak bude třeba. Francouzské císařství přežije pouze střetnutím se svými protivníky; rozdíl oproti minulosti spočívá v tom, že tentokrát koalice nebude mít čas vzniknout, protože je rozdrtíme jednoho po druhém." # todo: NEW TRANSLATION
 FRA_renew_meritocracy: "Meritokratické císařství" # todo: NEW TRANSLATION
 FRA_renew_meritocracy_desc: "První císařství mělo své nedostatky, ale za svůj úspěch vděčilo upřednostňování zkušeností a profesionality před společenskou třídou. Dnes musíme tento příslib společenského vzestupu pro Francouze obnovit. Musí pochopit, že tvrdou prací pro císařství a Francii se mohou vyšplhat výše než kdykoli předtím." # todo: NEW TRANSLATION
 FRA_last_deluge: "Silnější než kdy dříve" # todo: NEW TRANSLATION
 FRA_last_deluge_desc: "Provedli jsme rozsáhlé reformy našeho řetězce velení, doktrín i zásobovacích řetězců. Nyní již zbývá jen otevřít dveře naší armády masovému náboru. Branná povinnost již dlouho není skutečností, ale Francouzi jsou připraveni bojovat za své císařství. Velká armáda bude připravena vyrazit k dobytí Evropy." # todo: NEW TRANSLATION
 FRA_ennemy_isolate: "Infiltrovat naše protivníky" # todo: NEW TRANSLATION
 FRA_ennemy_isolate_desc: "Máme prostředky k infiltraci systémů civilní obrany našich protivníků a k úderu na jejich nejcitlivější místa. To poskytne vynikající výcvik našim zpravodajským službám, ale zároveň to může způsobit, že si nás začnou dávat větší pozor." # todo: NEW TRANSLATION
 FRA_history_allies: "Spojenci císařství" # todo: NEW TRANSLATION
 FRA_history_allies_desc: "Přestože jsme obklopeni nepřáteli, nejsme sami; mnoho zemí s námi stále udržuje přátelské vztahy a mohlo by mít zájem připojit se k naší alianci. Mohli bychom zdůraznit naši společnou historii a ospravedlnit tak budoucí spojenectví. Můžeme jim nabídnout významné výhody a oni nám budou velmi nápomocní." # todo: NEW TRANSLATION
 FRA_imperial_pride: "Císařská hrdost" # todo: NEW TRANSLATION
 FRA_imperial_pride_desc: "Francouzi znovu získali svou hrdost. Ukázali jsme jim, že mír a republika nebyly ničím jiným než iluzemi a že budoucnost Francie spočívá v císařství. Jsou hrdí na svou zemi a nenávidí naše protivníky. Naše společnost i ekonomika jsou zaměřeny na dlouhodobý konflikt." # todo: NEW TRANSLATION
 FRA_declare_hostile: "Otestovat jejich obranu" # todo: NEW TRANSLATION
 FRA_declare_hostile_desc: "Již nemáme důvod skrývat před budoucími nepřáteli své expanzionistické ambice. Je čas ukázat jejich lidem, že mají všechny důvody se nás bát a bez protestů se podřídit." # todo: NEW TRANSLATION
 FRA_our_own_system: "Náš vlastní systém" # todo: NEW TRANSLATION
 FRA_our_own_system_desc: "Každé císařství má vlastní alianci a pokus zvítězit osamoceně by byl nákladný. Několik zemí již vyjádřilo ochotu vytvořit s námi alianci. Je čas tuto spolupráci formalizovat vytvořením silného spojenectví mezi partnery, kteří se navzájem respektují." # todo: NEW TRANSLATION
 FRA_reclaim_empire: "Získat zpět císařství" # todo: NEW TRANSLATION
 FRA_reclaim_empire_desc: "Nastal čas vyrazit a získat zpět naše císařství. Strávili jsme roky přípravou společnosti, ekonomiky a armády. Je čas, aby tato práce přinesla ovoce a Francie znovu získala své právoplatné místo ve světovém řádu." # todo: NEW TRANSLATION
 FRA_french_commune: "Vítězná revoluce" # todo: NEW TRANSLATION
 FRA_french_commune_desc: "Podařilo se nám vyrvat kontrolu nad institucemi umírněným komunistům a dalším slabým silám či loutkám kapitalismu. Francouzi nám tím, že přijali náš nástup k moci, projevují důvěru. I oni věří, že kapitalismus lze porazit, a právě o to se hodláme zasadit. Obnovíme naši společnost a připravíme se na střet s kapitalistickými silami." # todo: NEW TRANSLATION
 FRA_purge_military: "Zajistit generální štáb" # todo: NEW TRANSLATION
 FRA_purge_military_desc: "Ačkoli se nám podařilo převzít kontrolu nad institucemi, armáda, která nezasáhla, nemusí vždy zůstat na naší straně. Dříve či později budeme muset vojensky čelit jiné mocnosti. Abychom zajistili její loajalitu, musíme začít na vrcholu řetězce velení. Poměrně snadno pochopí, že nemají na výběr, ale několik měsíců budou nepochybně klást odpor. Jakmile se vrchol řetězce podřídí, zbytek bude poslouchat rozkazy." # todo: NEW TRANSLATION
 FRA_worker_right_comm: "Uklidnit dělníky" # todo: NEW TRANSLATION
 FRA_worker_right_comm_desc: "Ačkoli obtížná fáze naší revoluce skončila, občanská společnost vyjádřila vážné obavy ohledně situace v naší zemi. Musíme uklidnit pracovní sílu zárukou zaměstnání a jistoty práce. To bude vyžadovat přizpůsobení výrobních linek, ale tyto záruky budou pro naši budoucnost přínosné." # todo: NEW TRANSLATION
 FRA_people_constitution_comm: "Diktatura proletariátu" # todo: NEW TRANSLATION
 FRA_people_constitution_comm_desc: "Instituce staré republiky byly zásadně nespravedlivé. Malá, zkorumpovaná kasta měla nad zemí úplnou kontrolu. Naše revoluce musí dělníkům dát nástroje k účasti na politickém životě země, kterou pomáhají řídit. Je čas ukončit nespravedlivou republiku a vytvořit novou formu vlády." # todo: NEW TRANSLATION
 FRA_revolution_soil: "Země revoluce" # todo: NEW TRANSLATION
 FRA_revolution_soil_desc: "Od Jacquerie až po Francouzské revoluce Francouzi dokazovali, že se staví proti nespravedlnosti autoritářských systémů. Po naší revoluci jim musíme ukázat, že jejich modlitby byly vyslyšeny, a vybudovat rovnostářskou společnost schopnou odolat všem útokům kontrarevolucionářů." # todo: NEW TRANSLATION
 FRA_hostile_nato_comm: "Zkažený Západ" # todo: NEW TRANSLATION
 FRA_hostile_nato_comm_desc: "NATO je loutkou Spojených států a kapitalismu. Protože oba jsou našimi úhlavními nepřáteli, nesmíme v této alianci zůstat déle. Dříve či později se stanou našimi protivníky." # todo: NEW TRANSLATION
 FRA_fate_eurocommunism: "Opustit evropský experiment" # todo: NEW TRANSLATION
 FRA_fate_eurocommunism_desc: "I kdybychom se snažili ze všech sil, nedokázali bychom instituce Evropské unie vrátit na správnou cestu. Jsou prolezlé korupcí kapitalismu a lobbingu. Tyto země jsou navíc pevně proti naší domácí politice. Rozkol poškodí naši hluboce integrovanou ekonomiku, ale toto oddělení je nezbytné." # todo: NEW TRANSLATION
 FRA_legacy_patriwar: "Odkaz Velké vlastenecké války" # todo: NEW TRANSLATION
 FRA_legacy_patriwar_desc: "V minulém století SSSR ukázal světu, že fašismus lze porazit silou zbraní. Tato válka, kterou úspěšně vedl, nás naučila, že národ musí stát jednotně se svou armádou. Rudá armáda by nikdy nezvítězila bez odolnosti sovětské společnosti. Musíme zajistit, aby v budoucích konfliktech zůstalo veřejné nadšení na nejvyšší úrovni. Pro to, co nás čeká, budeme potřebovat veškerou svou sílu." # todo: NEW TRANSLATION
 FRA_focus_education: "Lidové vzdělávání" # todo: NEW TRANSLATION
 FRA_focus_education_desc: "Ať už jde o zapojení do politiky nebo o efektivní a spokojenou práci, naši lidé potřebují informace. Musíme dát každému možnost naučit se vše, co potřebuje k pochopení světa, aniž by podlehl propagandě kapitalistů a fašistů." # todo: NEW TRANSLATION
 FRA_loyalty_cause: "Věrnost věci" # todo: NEW TRANSLATION
 FRA_loyalty_cause_desc: "Dali jsme našim lidem řadu práv, od lepších pracovních podmínek po politické zastoupení, a napravili mnoho křivd. Tato nová práva však přicházejí s odpovědností. Nesouhlas je povolen, ale každý občan se musí plně podřídit vůli kolektivu. Tuto společnost řídíme společně; každý proto odpovídá za to, že bude řádně fungovat." # todo: NEW TRANSLATION
 FRA_paris_commune: "Poučení z Pařížské komuny" # todo: NEW TRANSLATION
 FRA_paris_commune_desc: "Ačkoli spojení mezi Pařížskou komunou a komunistickou ideologií, kterou vyznáváme, není zdaleka samozřejmé, stále se z tohoto bouřlivého období můžeme poučit. Pařížská komuna zahynula kvůli nedostatku zdrojů a vůle bojovat proti silám kontrarevoluce. V tomto krutém světě zkaženém globalizací musíme mít na paměti, že přežití naší revoluce závisí na rozdrcení kontrarevolučních sil. Naše společnost si toho musí být vědoma a stát jednotně proti protivníkům." # todo: NEW TRANSLATION
 FRA_unleash_agent: "Destabilizovat kapitalisty" # todo: NEW TRANSLATION
 FRA_unleash_agent_desc: "Ne vždy budeme moci čelit protivníkům na bojišti; bylo by to příliš nákladné a mohli bychom skončit poraženi. Můžeme si však usnadnit život ničením jejich společnosti zevnitř. S DGSE máme zpravodajskou službu vycvičenou ve špionáži a destabilizaci a mohli bychom ji dobře využít. Vyvezeme revoluci bez války a kapitalisté jí nebudou moci zabránit." # todo: NEW TRANSLATION
 FRA_spread_communism_eu: "Šířit komunismus v Evropě" # todo: NEW TRANSLATION
 FRA_spread_communism_eu_desc: "Evropské instituce změnit nemůžeme, ale můžeme povzbudit některé členské státy ke vzpouře. Protože neoliberální politika uplatňovaná v celé EU není po chuti každému, nebude těžké přesvědčit část jejich obyvatelstva, aby se k nám připojila." # todo: NEW TRANSLATION
 FRA_red_army_comm: "Nová Rudá armáda" # todo: NEW TRANSLATION
 FRA_red_army_comm_desc: "Díky našim reformám je armáda plně pod kontrolou komuny a občanská společnost je připravena bojovat po boku ozbrojených sil. Naše reformy také odemkly její plný potenciál; naši vojáci vědí, že spravedlnost je na naší straně. Komuna nesmí padnout, protože nese pochodeň revoluce." # todo: NEW TRANSLATION
 FRA_collectivisation: "Kolektivizace ekonomiky" # todo: NEW TRANSLATION
 FRA_collectivisation_desc: "Kontrola nad ekonomikou vždy unikala dělnické třídě a zůstávala v rukou několika rodin. Před revolucí v této zemi vládla oligarchie. Nyní je však konec; Francouzi znovu získávají kontrolu nad výrobními prostředky. Tím zajistíme loajalitu výrobních prostředků i finanční bezpečnost obyvatelstva." # todo: NEW TRANSLATION
 FRA_enforce_unions: "Posílit odbory" # todo: NEW TRANSLATION
 FRA_enforce_unions_desc: "Nyní, když jsme kolektivizovali francouzskou ekonomiku a dali dělníkům větší politickou odpovědnost, musíme zajistit, aby si mohli udržet kontrolu, pokud by stát začal jednat méně obezřetně. Odbory sice naši umírnění předchůdci obnovili, ale můžeme udělat více. Dáme odborům ještě větší moc a povzbudíme dělníky, aby se k nim připojili. Sjednocení dělníci musí nepřetržitě hrát významnou roli v rozhodování naší země." # todo: NEW TRANSLATION
 FRA_glorious_past_comm: "Pochybná minulost komunismu" # todo: NEW TRANSLATION
 FRA_glorious_past_comm_desc: "Ačkoli ne celá Evropa, zejména východní, vzpomíná na stalinistický komunismus v dobrém, musíme jí připomenout, že jsme jiní. Tyto země byly rozdrceny stalinistickým totalitarismem, který lid neosvobodil, ale pouze mu dal nového pána. Našimi jedinými nepřáteli jsou kapitalismus a fašismus; pokud se od nich tyto země potřebují osvobodit, můžeme jim pomoci. Naším cílem však nebude zotročit je, nýbrž začlenit do naší Unie proletariátu všech národů." # todo: NEW TRANSLATION
 FRA_befriend_comm: "Jednota dělníků" # todo: NEW TRANSLATION
 FRA_befriend_comm_desc: "Ačkoli komunismus v tomto novém tisíciletí není tolik v módě, nejsme sami, kdo následuje jeho učení. V boji, který nás čeká, potřebujeme spojence a můžeme je najít mezi zeměmi, které se stejně jako my rozhodly vzdorovat kapitalismu. Musíme těmto zemím navrhnout, abychom si navzájem pomohli zničit kapitalismus po celém světě. Nejsou samy a nejsme sami ani my." # todo: NEW TRANSLATION
 FRA_final_struggle: "Konečný boj" # todo: NEW TRANSLATION
 FRA_final_struggle_desc: "Naše společnost i armáda jsou připraveny bojovat proti kapitalismu. Uvědomují si pokrok, jehož jsme dosáhli, i odhodlání kapitalistických mocností vymazat nás z mapy. Budeme bojovat do hořkého konce, abychom kapitalismus porazili." # todo: NEW TRANSLATION
 FRA_UFSR_born: "Komunismus s francouzskými rysy" # todo: NEW TRANSLATION
 FRA_UFSR_born_desc: "Spojení komunistické ideologie a odhodlání Francouzů bránit svá práva bylo velmi dobrým nápadem. Veřejnosti jsme objasnili, že se musí zapojit do politiky a že k tomu má prostředky. Stejně jako Fête de la Fédération označuje náš státní svátek, lze říci, že revoluce byla nyní Francouzi skutečně přijata. Pro naši zemi je to historický den." # todo: NEW TRANSLATION
 FRA_new_kommintern: "Směrem k nové internacionále" # todo: NEW TRANSLATION
 FRA_new_kommintern_desc: "Mnoho skupin po celém světě odpovědělo na naši výzvu ke světové revoluci. Je čas uvést naši alianci do praxe a připravit se na střet s kapitalismem." # todo: NEW TRANSLATION
 FRA_cold_war_round2: "Světová revoluce" # todo: NEW TRANSLATION
 FRA_cold_war_round2_desc: "Nastal čas bojovat proti kapitalismu a fašismu. Přineseme svobodu dělníkům v každé zemi. Oligarchie bude poražena." # todo: NEW TRANSLATION
 FRA_kingdom_history: "Dlouhá historie monarchie" # todo: NEW TRANSLATION
 FRA_kingdom_history_desc: "Monarchie se ve Francii vrátila. Naši stoupenci převzali kontrolu nad institucemi bývalé republiky a vyzvali k našemu návratu. A jsme zde, dvě století po pádu absolutní monarchie, zpět na francouzském trůnu. Čeká nás dlouhá cesta. Musíme odstranit republikánské dědictví revoluce a zároveň znovu vybudovat Francouzské království. Naši nepřátelé na nás mezitím číhají ve stínech, ale zvítězíme, protože Bůh je s námi, jako vždy byl." # todo: NEW TRANSLATION
 FRA_camelot: "Královi kameloti" # todo: NEW TRANSLATION
 FRA_camelot_desc: "Abychom zajistili poslušnost obyvatelstva a zabránili snům o nové republice, musíme posílit dohled a k tomu potřebujeme politickou policii. Za tímto účelem můžeme využít bývalé členy Action Française vycvičené DGSI. Tyto organizace sloučíme do nového útvaru nazvaného Královi kameloti, na počest našich royalistických aktivistů z minulého století." # todo: NEW TRANSLATION
 FRA_decentralisation_king: "Úplná decentralizace" # todo: NEW TRANSLATION
 FRA_decentralisation_king_desc: "Centralizace zděděná po jakobínství a revoluci neudělala z Francouzů občany, nýbrž poddané. Systémy zvykového práva působící na nižších úrovních velmi dobře sloužily jako spojení mezi občanem a centrálním státem. Naštěstí se naše země již začala od centralismu vzdalovat, aby vyhověla standardům Evropské unie. Můžeme tento přechod dokončit, nikoli abychom se přizpůsobili vzoru evropských regionů, ale abychom obnovili systém místní autority z doby před revolucí." # todo: NEW TRANSLATION
 FRA_king_rule: "Regnum Regis" # todo: NEW TRANSLATION
 FRA_king_rule_desc: "Prvním krokem k vymazání vzpomínky na revoluci je vybudovat nový systém na troskách starého. Můžeme tedy oznámit zrušení republiky a sepsání nové ústavy. Tato ústava bude soustředěna kolem krále, který bude mít absolutní moc, stejně jako za starých dobrých časů." # todo: NEW TRANSLATION
 FRA_national_integralism: "Integrální nacionalismus" # todo: NEW TRANSLATION
 FRA_national_integralism_desc: "Abychom Francouzům pomohli pochopit, jakým selháním revoluce byla a jaké měla důsledky, musíme zdůraznit slavnou teorii myslitele Charlese Maurrase. Integrální nacionalismus vykresluje republiku, která opustila vlastenectví v důsledku revoluce zosnované svobodnými zednáři, heretiky a cizinci. Prosazuje návrat k národní jednotě a morálnímu řádu ztělesněnému katolickou církví. Tato učení jsou plná ctnosti a na naše vznikající království se zcela hodí. Naše království právě nalezlo svůj manifest." # todo: NEW TRANSLATION
 FRA_no_more_eu: "Opustit Evropskou unii" # todo: NEW TRANSLATION
 FRA_no_more_eu_desc: "Evropská unie ztělesňuje vše, proti čemu bojujeme: bezuzdný liberalismus, odporný idealismus, katastrofální naivitu a všudypřítomnou korupci. Jediným cílem této organizace je rozebrat naše národy a kultury. Nemáme tedy důvod zůstat její součástí. Musíme odejít, než bude příliš pozdě, bez ohledu na důsledky." # todo: NEW TRANSLATION
 FRA_eu_kingdom: "Padlé monarchie" # todo: NEW TRANSLATION
 FRA_eu_kingdom_desc: "Před několika staletími byla Evropa kontinentem monarchií. Tehdejší mezinárodní řád byl do jisté míry utvářen rovnováhou sil a aliancemi. Tyto dny jsou však dávno pryč. Nacionalismus buď monarchie smetl, nebo je zredukoval na turistické atrakce. Nejlepší, co můžeme udělat při hledání spojenců, je proto pomoci stoupencům absolutismu v Evropě povstat proti jejich republikánským utlačovatelům." # todo: NEW TRANSLATION
 FRA_king_modern_chivalry: "Moderní rytířství" # todo: NEW TRANSLATION
 FRA_king_modern_chivalry_desc: "Francouzské království bylo vždy proslulé svou jízdou a rozhodující úlohou, kterou hrála v bitvách. Dnes se jízda podobá šedesátitunovému ocelovému monstru. Její úloha však zůstává rozhodující. Naše ozbrojené síly by se měly zaměřit na rozsáhlé využití obrněné jízdy." # todo: NEW TRANSLATION
 FRA_no_deceit: "Ukončit úpadek" # todo: NEW TRANSLATION
 FRA_no_deceit_desc: "Naším hlavním nepřítelem je úpadek, který republika zasadila do naší společnosti: občané, kteří se odchýlili od morálního řádu a očekávají, že stát zaplatí za všechno. Musíme je vrátit do reality. Éra republiky skončila. Naše království chce ctnostné občany." # todo: NEW TRANSLATION
 FRA_frankish_ancestor: "Naši předkové, Frankové" # todo: NEW TRANSLATION
 FRA_frankish_ancestor_desc: "My Francouzi pocházíme od Franků; to je náš lid a naše identita. Republikáni chtěli monarchii a Franky vykořenit, ale nikdo nemůže zevnitř vymazat civilizaci a kulturu. Je to naše dědictví a je na nás, abychom si je vzali zpět." # todo: NEW TRANSLATION
 FRA_against_liberalism: "Proti liberalismu a socialismu" # todo: NEW TRANSLATION
 FRA_against_liberalism_desc: "Republika vedla naše občany k přesvědčení, že potřebují více svobod a práv. Naše království chce tyto křivdy napravit. Naši občané především potřebují znovu objevit cestu k morálnímu řádu a jednotě našeho národa kolem jeho krále. Všechno ostatní je druhořadé." # todo: NEW TRANSLATION
 FRA_historical_ennemy: "Věčný nepřítel" # todo: NEW TRANSLATION
 FRA_historical_ennemy_desc: "Pokud existuje protivník, s nímž jsme se po staletí střetávali, je to nepochybně Spojené království. I ono je monarchií, ačkoli panovník dnes nemá skutečnou moc. Dříve či později se s ním jistě ocitneme tváří v tvář. Ať už to bude ono nebo někdo jiný, naše námořnictvo musí být připraveno bojovat proti námořním mocnostem." # todo: NEW TRANSLATION
 FRA_friend_pope: "Chránit papežství" # todo: NEW TRANSLATION
 FRA_friend_pope_desc: "Jako nejstarší dcera církve má Francie povinnost chránit papežství před všemi, kdo by na něj mohli zaútočit." # todo: NEW TRANSLATION
 FRA_army_of_elites: "Elitní síly" # todo: NEW TRANSLATION
 FRA_army_of_elites_desc: "Byla to revoluce, která zavedla koncept branné povinnosti. Během posledních dvou světových válek jsme viděli, že to nemuselo být nejlepší rozhodnutí. Vojáci, kteří nebyli vždy řádně vycvičeni, byli posíláni na smrt. Tato rozhodnutí v minulém století zdecimovala francouzské obyvatelstvo. Musíme zajistit, aby naše armáda zůstala profesionální zpřísněním náborových kritérií. Zabráníme tak také tomu, aby se v našich řadách ocitli potížisté." # todo: NEW TRANSLATION
 FRA_positive_inequality: "Pozitivní nerovnost" # todo: NEW TRANSLATION
 FRA_positive_inequality_desc: "Ne všechno musí být rovnostářské. Myšlenka, že bychom si měli být všichni rovni, je dalším vynálezem revoluce. Někteří lidé jsou předurčeni k vedení, zatímco jiní k následování. Francouzi si to musí uvědomit, protože trávení času stěžováním si na úspěch druhých snižuje efektivitu všech." # todo: NEW TRANSLATION
 FRA_destroy_republicanism: "Zničit republikánství" # todo: NEW TRANSLATION
 FRA_destroy_republicanism_desc: "Absolutismus se vrátil do našeho království. Již není důvod udržovat tuto politickou iluzi demokracie. Jedinou stranou, která má právo existovat, je Králova strana. Francouzi musí pochopit, že já jsem stát!" # todo: NEW TRANSLATION
 FRA_catholic_league: "Založit katolickou ligu" # todo: NEW TRANSLATION
 FRA_catholic_league_desc: "Naše sblížení s církví nenechalo všechny lhostejnými. Některé země nám vyjádřily podporu. Možná bychom mohli naši křížovou výpravu rozšířit na další katolické mocnosti. Koneckonců i ony mají právo bojovat za znovuzískání Svaté země." # todo: NEW TRANSLATION
 FRA_burry_revolution: "Pohřbít revoluci" # todo: NEW TRANSLATION
 FRA_burry_revolution_desc: "Francouzi konečně pochopili, že revoluce nepřinesla nic než bídu a že prvenství francouzské monarchie bylo přirozeným řádem věcí. Naše instituce byly také očištěny od revolučních prvků. Můžeme tedy říci, že jsme stránku prokleté revoluce úspěšně obrátili." # todo: NEW TRANSLATION
 FRA_elder_daughter: "Nejstarší dcera církve" # todo: NEW TRANSLATION
 FRA_elder_daughter_desc: "Francie znovu získala své místo ve světovém řádu. Budeme, jako jsme byli po dlouhou dobu, obránci křesťanstva a znovu získáme Svatou zemi, jak jsme to již tolikrát učinili." # todo: NEW TRANSLATION
 FRA_republican_cancer: "Republikánská rakovina" # todo: NEW TRANSLATION
 FRA_republican_cancer_desc: "Naše země se dokázala zbavit republikánství, ale v Evropě jsme víceméně jediní, kdo již není pod jeho vládou. Je samozřejmé, že pokud budeme v bitvě poraženi, naši protivníci nás uvrhnou zpět do republikánské noční můry. Republikánskou hrozbu musíme zničit všude, kde se objeví. Jen tak budeme v bezpečí." # todo: NEW TRANSLATION
 FRA_crusade_time: "Získat zpět naše dědictví" # todo: NEW TRANSLATION
 FRA_crusade_time_desc: "Ať už půjde o znovuzískání země našich franských předků nebo Svaté země, v každém případě se budeme muset střetnout s mocnostmi Evropy a Blízkého východu. Je čas vyrazit do války." # todo: NEW TRANSLATION
 FRA_economic_policy: "Ekonomická politika" # todo: NEW TRANSLATION
 FRA_economic_policy_desc: "Naše ekonomika je na světě až pátá. Možná bychom mohli být proaktivní a ukázat, jaká by mohla být dobrá ekonomická politika." # todo: NEW TRANSLATION
 FRA_free_market: "Volný trh" # todo: NEW TRANSLATION
 FRA_free_market_desc: "Světové trhy by měly zůstat, aby se o nich rozhodovalo samy o sobě, a ne regulovány. Volný trh je lepší než regulovaný trh!" # todo: NEW TRANSLATION
 FRA_total_sa: "Total SA" # todo: NEW TRANSLATION
 FRA_total_sa_desc: "Total SA je jednou z největších ropných společností na světě. Můžeme využít jejich aktiv k rozšíření našich ropných odvětví pro potřeby Republiky." # todo: NEW TRANSLATION
 FRA_french_economic_intervention: "Ekonomické zásahy" # todo: NEW TRANSLATION
 FRA_french_economic_intervention_desc: "Nejlepší způsob, jak působit na ekonomiku, je do ní pravidelně zasahovat. Příliš mnoho zásahů však způsobuje problémy. Nakonec je to na vládě, aby rozhodla, co je správné. Neviditelná ruka trhu Francii neublíží a my ji nebudeme vyzývat." # todo: NEW TRANSLATION
 FRA_reduction_in_taxes: "Snížení daní" # todo: NEW TRANSLATION
 FRA_reduction_in_taxes_desc: "Dane jsou šílené! Snižme je. Doufejme, že to přiláká nové investice a podpoří soukromý sektor." # todo: NEW TRANSLATION
 FRA_deregulation: "Deregulace" # todo: NEW TRANSLATION
 FRA_deregulation_desc: "Deregulace. Prvním krokem k vybudování ekonomiky je deregula ce. Uvolnění výstavby v jinak omezených oblastech by mohlo být tím pravým trikem." # todo: NEW TRANSLATION
 FRA_state_stock_in_sa: "Státní zásoby v SA" # todo: NEW TRANSLATION
 FRA_state_stock_in_sa_desc: "Total SA odvedla skvělou práci v posledních zakázkách. Měly by být částečně investovány do zvýšení, nejen našich zisků, ale i naší nezávislosti na zahraničním hospodářství." # todo: NEW TRANSLATION
 FRA_paris_employment_projects: "Pařížské projekty zaměstnanosti" # todo: NEW TRANSLATION
 FRA_paris_employment_projects_desc: "Paříž v minulosti zažila období vysoké nezaměstnanosti. Dejte jim něco na práci." # todo: NEW TRANSLATION
 FRA_nationalization_of_steel: "Národní znárodnění oceli" # todo: NEW TRANSLATION
 FRA_nationalization_of_steel_desc: "Znàrodnění oceli by mělo zlepšit naši průmyslovou kapacitu." # todo: NEW TRANSLATION
 FRA_private_contracting: "Soukromé zakázky" # todo: NEW TRANSLATION
 FRA_private_contracting_desc: "Uzavírání smluv s místními firmami by mohlo pomoci urychlit stavební projekty. Nicméně bude to vyčerpávající, protože nebudeme určovat cenu." # todo: NEW TRANSLATION
 FRA_tapping_resources: "Vytěžování zdrojů" # todo: NEW TRANSLATION
 FRA_tapping_resources_desc: "Po celé Francii se nacházejí zdroje. Měli bychom prozkoumat využití našich přírodních zdrojů a snížit naši závislost." # todo: NEW TRANSLATION
 FRA_offshore_oilrigs: "Ropné plošiny na moři" # todo: NEW TRANSLATION
 FRA_offshore_oilrigs_desc: "Kourou má ropní zásoby těsně za pobřežím, které by šlo vytěžit pro naši potřebu. Ropa je černé zlato, a my se musíme zbohatnout!" # todo: NEW TRANSLATION
 FRA_state_run_construction: "Státem řízená výstavba" # todo: NEW TRANSLATION
 FRA_state_run_construction_desc: "Stát určuje cenu, datum zahájení a počet zaměstnanců. Jediný problém je, že to může být neefektivní, pokud projekt není dostatečně financován, nebo pokud je nastaven na příliš dlouhou dobu a zaměstnanci stojí nečinně." # todo: NEW TRANSLATION
 FRA_infrastructure_projects: "Infrastrukturní projekty" # todo: NEW TRANSLATION
 FRA_infrastructure_projects_desc: "Místní infrastruktura měla v minulosti některé problémy. Zlepšeme systém." # todo: NEW TRANSLATION
 FRA_decentralization: "Decentralizace" # todo: NEW TRANSLATION
 FRA_decentralization_desc: "Decentralizace vlády přinese mnoho výhod. Státy budou nezávislejší, podobně jako Spojené státy. Může nám to potenciálně přinést více daňových příjmů snížením centralizovaných ekonomických opatření." # todo: NEW TRANSLATION
 FRA_centralization: "Centralizace" # todo: NEW TRANSLATION
 FRA_centralization_desc: "Centralizace vlády nás posune k větší kontrole nad nezávislými proměnnými na každém místě a ovlivní každý aspekt života." # todo: NEW TRANSLATION
 FRA_french_healthcare: "Francouzské zdravotnictví" # todo: NEW TRANSLATION
 FRA_french_healthcare_desc: "Francouzské zdravotnictví patří k nejlépe vybudovaným systémům zdravotní péče na světě. Je jedním z mála, kteří skutečně poskytují univerzální zdravotní péči." # todo: NEW TRANSLATION
 FRA_french_arms_industries: "Francouzské zbrojní průmysly" # todo: NEW TRANSLATION
 FRA_french_arms_industries_desc: "Francouzské zbrojní průmysly zůstávají jedněmi z nejziskovějších firem na světě. Ať už jde o Nexter, Dassault či Thales Group. Vždy stojí za investici nebo vládní smlouvu." # todo: NEW TRANSLATION
 FRA_research_and_dev_projects: "Projekty výzkumu a vývoje" # todo: NEW TRANSLATION
 FRA_research_and_dev_projects_desc: "Státem řízený výzkum a vývoj umožňují vyšší standardy vědecké dokonalosti." # todo: NEW TRANSLATION
 FRA_reformed_universal_healthcare: "Reformované univerzální zdravotnictví" # todo: NEW TRANSLATION
 FRA_reformed_universal_healthcare_desc: "Přes to, že máme některé z nejlepších zdravotních zákonů v zemi, vždy budou mít své nedostatky." # todo: NEW TRANSLATION
 FRA_nexter: "Nexter" # todo: NEW TRANSLATION
 FRA_nexter_desc: "Nexter je franouzská zbrojní společnost ve státním vlastnictví, která se specializuje na vývoj francouzských zbraní a vozidel." # todo: NEW TRANSLATION
 FRA_dassault: "Dassault" # todo: NEW TRANSLATION
 FRA_dassault_desc: "Základní funkcí Dassaultu je letecká společnost. Jedním z jejich nejvýznamnějších výtvorů byl Mirage." # todo: NEW TRANSLATION
 FRA_thales_group: "Thales Group" # todo: NEW TRANSLATION
 FRA_thales_group_desc: "Ačkoliv Thales Group je především elektronická společnost. Odvedli skvělou práci na většině našich nejmodernějších lodí." # todo: NEW TRANSLATION
 FRA_usa_fra_collaboration: "USA–francouzská spolupráce" # todo: NEW TRANSLATION
 FRA_usa_fra_collaboration_desc: "Spolupráce se Spojenými státy není jen prospěšná, ale je i zřejmou volbou." # todo: NEW TRANSLATION
 FRA_the_french_agriculture: "Francouzské zemědělství" # todo: NEW TRANSLATION
 FRA_the_french_agriculture_desc: "Ve světě, kde šest miliard lidí usiluje o dostatek jídla, je zemědělství sektorem s jasnou budoucností. Máme to štěstí, že máme tak kvalitní půdu, a měli bychom prozkoumat její různorodé využití, abychom potvrdili naši potravinovou soběstačnost." # todo: NEW TRANSLATION
 FRA_the_vineyard_industries: "Vinařské průmysly" # todo: NEW TRANSLATION
 FRA_the_vineyard_industries_desc: "Francouzský vinařský průmysl má mezinárodní reputaci a významně přispívá k naší měkké moci jako znak dobrého vkusu a štěstí." # todo: NEW TRANSLATION
 FRA_the_dairy_industry: "Mléčný průmysl" # todo: NEW TRANSLATION
 FRA_the_dairy_industry_desc: "Kromě produkce kvalitního masa mohou naše stáda také vyprodukovat velké množství mléka, které se v poslední době dostalo do široké škály výrobků." # todo: NEW TRANSLATION
 FRA_wheat_industry: "Průmysl pšenice" # todo: NEW TRANSLATION
 FRA_wheat_industry_desc: "Pšenice je jedním z nejdůležitějších zdrojů v potravinově závislém světě, a proto máme štěstí, že zde dobře roste." # todo: NEW TRANSLATION
 FRA_mechanized_agriculture: "Mechanizované zemědělství" # todo: NEW TRANSLATION
 FRA_mechanized_agriculture_desc: "Na počátku tohoto nového milénia musíme posílit naši schopnost efektivně využívat naše půdy a vývoj těžkých vozidel nám s tím může pomoci." # todo: NEW TRANSLATION
 FRA_packaging_industries: "Průmysl balení" # todo: NEW TRANSLATION
 FRA_packaging_industries_desc: "Průmysl balení je důležitou součástí našeho projektu potravinové nezávislosti a zajišťuje, že naše výrobky jsou baleny do pevných, ekologických a francouzsky vyráběných obalů." # todo: NEW TRANSLATION
 FRA_agriculture_industry: "Zemědělský průmysl" # todo: NEW TRANSLATION
 FRA_agriculture_industry_desc: "Úspěšně jsme zajistili potravinovou soběstačnost naší země v rozvíjejícím se světě." # todo: NEW TRANSLATION
 FRA_improved_railways: "Vylepšené železnice" # todo: NEW TRANSLATION
 FRA_improved_railways_desc: "Železnice je efektivní prostředek propojení metropolí a menších měst a měli bychom tuto oblast rozšířit vývojem s ní souvisejících technologií." # todo: NEW TRANSLATION
 FRA_focus_on_rails: "Zaměření na železnici" # todo: NEW TRANSLATION
 FRA_focus_on_rails_desc: "Nyní, když jsme vylepšili naše komunikační kanály, můžeme přidat více vozidel, která je budou používat." # todo: NEW TRANSLATION
 FRA_high_speed_rail_lines: "Vysokorychlostní železniční tratě" # todo: NEW TRANSLATION
 FRA_high_speed_rail_lines_desc: "S rozvojem a masovou výstavbou vysokorychlostních tratí jsme nyní schopni propojit naši zemi jak po vnitrozemí, tak tam, kde existují železnice v Evropě." # todo: NEW TRANSLATION
 FRA_luxury_goods: "Luxusní zboží" # todo: NEW TRANSLATION
 FRA_luxury_goods_desc: "Průmysl luxusního zboží je doménou soukromých francouzských firem, jako jsou Louis Vuitton, Chanel a Hermès, které jsou známé po celém světě. Možná investicí do tohoto sektoru bychom mohli těžit z jeho dopadů na naši ekonomiku." # todo: NEW TRANSLATION
 FRA_tourism_industry: "Průmysl cestovního ruchu" # todo: NEW TRANSLATION
 FRA_tourism_industry_desc: "Od roku 1990 je Francie světovou jedničkou v turistice, jako destinace, což již značně prospívá naší ekonomice a naší „měkké síle“, ale masová přítomnost turistů je problémem ve velkých městech. Možná bychom měli na tom pracovat." # todo: NEW TRANSLATION
 FRA_the_gorgeous_coasts: "Okouzlující pobřeží" # todo: NEW TRANSLATION
 FRA_the_gorgeous_coasts_desc: "Francie je velká pobřežní země s přístupem ke třem různým mořím a s impozantními krajinami kolem nich. Měli bychom tyto ráje zpřístupnit, aby turisté proudili mimo města." # todo: NEW TRANSLATION
 FRA_the_spaces_between: "Prostory mezi" # todo: NEW TRANSLATION
 FRA_the_spaces_between_desc: "Naše země je velmi krásná, ale velmi prázdná. Existuje mnoho vnitrozemských oblastí s obrovským historickým významem a identitou pro naši zemi a možná rozvojem těchto míst bychom mohli získat prospěch." # todo: NEW TRANSLATION
 FRA_beaches_of_france: "Pláže Francie" # todo: NEW TRANSLATION
 FRA_beaches_of_france_desc: "Podařilo se nám přilákat nové turisty a rozšířit je po naší krásné zemi v udržitelném rytmu. Tento sektor, který neustále zaměstnává lidi, bude naší slávou a naší budoucností." # todo: NEW TRANSLATION
 FRA_energy_sector: "Energetický sektor" # todo: NEW TRANSLATION
 FRA_energy_sector_desc: "Naše země dlouhodobě buduje svou energetickou nezávislost, která se primárně opírá o intenzivní využívání jaderné energie. Již dlouho je nezávislá na ostatních národech a budoucnost naší velké země spočívá v využívání jaderné energie. Investice a výzkum v oblasti jaderných reaktorů a nahrazení starých reaktorů účinnějšími zajistí, že Francie bude i nadále držet krok s těmi, kteří si ji chtějí zpochytnout." # todo: NEW TRANSLATION
 FRA_renewable_investments: "Investice do obnovitelných zdrojů" # todo: NEW TRANSLATION
 FRA_renewable_investments_desc: "Naše země je protkaná několika významnými řekami, což je zdroj energie, který vydrží tak dlouho, jak bude na Zemi voda. Můžeme začít stavět hráze, abychom využili výhod vodních toků naší země." # todo: NEW TRANSLATION
 FRA_solar_investments: "Solární investice" # todo: NEW TRANSLATION
 FRA_solar_investments_desc: "V některých částech Francie svítí slunce jasně, a znovu je to nevyčerpatelný, i když nákladný, zdroj energie. Abychom zajistili naši budoucí energetickou autonomii, musíme diverzifikovat." # todo: NEW TRANSLATION
 FRA_wind_investments: "Investice do větrné energie" # todo: NEW TRANSLATION
 FRA_wind_investments_desc: "Pro doplnění naší řady obnovitelných energií by bylo zajímavé pořídit větrné turbíny, protože vítr fouká navždy." # todo: NEW TRANSLATION
 FRA_the_northern_reactors: "Severní reaktory" # todo: NEW TRANSLATION
 FRA_the_northern_reactors_desc: "Ačkoli již jsme velkými uživateli jaderné energie, musíme pracovat na konsolidaci tohoto sektoru, udržovat reaktory aktuální a zlepšovat jejich komponenty. Můžeme začít výstavbou dvou plně modernizovaných reaktorů." # todo: NEW TRANSLATION
 FRA_improved_nuclear_waste_management: "Vylepšené nakládání s jaderným odpadem" # todo: NEW TRANSLATION
 FRA_improved_nuclear_waste_management_desc: "Osud jaderného odpadu vrhá na tuto energii budoucnosti ponurý stín, proto musíme zajistit, že bude nakládáno tak, aby se vyhnulo budoucím katastrofám." # todo: NEW TRANSLATION
 FRA_expanded_enrichment_facilities: "Rozšířené obohacovací zařízení" # todo: NEW TRANSLATION
 FRA_expanded_enrichment_facilities_desc: "Proces jaderného obohacování vyžaduje velké množství struktur, pokud chceme zajistit naši energetickou soběstačnost." # todo: NEW TRANSLATION
 FRA_the_new_energy_dawn: "Nový energetický úsvit" # todo: NEW TRANSLATION
 FRA_the_new_energy_dawn_desc: "Úspěšně jsme zajistili naši budoucnost ve světě závislém na energii a nyní jsme opět v pozici prodávat naši energii našim spojencům." # todo: NEW TRANSLATION
 FRA_french_armed_forces: "Francouzské ozbrojené síly" # todo: NEW TRANSLATION
 FRA_french_armed_forces_desc: "Po většinu francouzské historie byly Francouzské ozbrojené síly zdrojem nesmírné hrdosti naší země. Armády, které pochodovaly proti Angličanům, aby obhájily naše právo na francouzského krále, nebo muži, kteří sloužili pod Napoleonem. V každém případě je vojenství jednou z našich předností, která nás odlišuje od ostatních." # todo: NEW TRANSLATION
 FRA_the_french_army: "Armée de Terre" # todo: NEW TRANSLATION
 FRA_the_french_army_desc: "'Armée de Terre', neboli Francouzská armáda, je jednou ze tří klíčových větví naší struktury ozbrojených sil. Úspěchy naší armády jsou po celém světě chváleny. Vojenské síly by měly být nadále ctěny a rozšiřovány, aby naše země lépe postupovala vpřed." # todo: NEW TRANSLATION
 FRA_the_french_air_force: "Armée de l'Air" # todo: NEW TRANSLATION
 FRA_the_french_air_force_desc: "Naše letectvo je jedním z nejstarších na světě. První oddíl francouzské letecké síly byl založen v roce 1909 jako křídlo francouzské armády. Nyní jde o samostatný sbor a vyvážíme jeden z nejlepších leteckých prostředků na světě." # todo: NEW TRANSLATION
 FRA_french_navy: "Marine Nationale" # todo: NEW TRANSLATION
 FRA_french_navy_desc: "Francouzské námořnictvo pomáhalo prosazovat naše ambice a touhy na globální úrovni. Pomohlo založit jednu z největších koloniálních říší, kterou svět kdy viděl, mezi Španělskem a Anglií. Investice do tohoto nám umožní dále působit v zahraničí." # todo: NEW TRANSLATION
 FRA_amx_leclerc: "AMX Leclerc" # todo: NEW TRANSLATION
 FRA_amx_leclerc_desc: "AMX Leclerc a jeho nástupci jsou MBT třídy francouzské armády. Jsou robustní a všestranní jako většina moderních tanků. Další investice do jejich vývoje mohou posílit náš obrněný sbor." # todo: NEW TRANSLATION
 FRA_network_centric_warfare: "Síťově řízená válka" # todo: NEW TRANSLATION
 FRA_network_centric_warfare_desc: "Podobně jako Američané a další evropské velmoci bychom měli investovat do technicky vyspělejších metod války, abychom se oprostili od používání lidí a začali se spoléhat na technologie. Změna bude nákladná, ale nakonec zachrání více francouzských životů." # todo: NEW TRANSLATION
 FRA_land_air_coordination: "Koordinace pozemních a vzdušných sil" # todo: NEW TRANSLATION
 FRA_land_air_coordination_desc: "Koordinace mezi pozemními a vzdušnými silami je klíčová pro každou společnou operační jednotku. Bez pozemních sil nemůžeme posouvat frontu; bez vzdušných sil nemůžeme očekávat účinnou palebnou podporu. Proto bychom měli usilovat o lepší koordinaci mezi vzdušnou válkou a pozemní válkou." # todo: NEW TRANSLATION
 FRA_the_mirage: "The Mirage" # todo: NEW TRANSLATION
 FRA_the_mirage_desc: "„The Mirage“ se stalo jedním z ikonických stíhačů pro Francouzské letectvo. Je ve službě v devíti dalších zemích světa a mnohé z nich je dováží." # todo: NEW TRANSLATION
 FRA_maritime_fighters: "Námořní stíhače" # todo: NEW TRANSLATION
 FRA_maritime_fighters_desc: "Vylepšení našich letectva i námořnictva budou vyžadovat účinnější námořní bojové stíhače." # todo: NEW TRANSLATION
 FRA_lafayette_class: "Frégate Légère Furtive" # todo: NEW TRANSLATION
 FRA_lafayette_class_desc: "Třída Frégate Légère Furtive byla poprvé navržena v pozdních 80. letech k nahrazení stárnoucích torpédoborců. Tato plavidla jsou lehká, víceúčelová a vhodná pro obranné role ve francouzské flotile." # todo: NEW TRANSLATION
 FRA_de_gaulle_class: "De Gaulle Class" # todo: NEW TRANSLATION
 FRA_de_gaulle_class_desc: "Letadlová loď třídy De Gaulle je desátou letadlovou lodí určenou pro službu ve francouzském námořnictvu. Je také jedinou letadlovou lodí poháněnou jadernou energií mimo Spojené státy námořnictvo, což z ní činí impozantní a silnou letadlovou loď." # todo: NEW TRANSLATION
 FRA_amx_10: "AMX-10" # todo: NEW TRANSLATION
 FRA_amx_10_desc: "AMX-10 je lehký průzkumný tank pro francouzskou armádu. AMX se může pochlubit působivou rychlostí 85 km/h na ideálním terénu. Není třeba dodávat, AMX se pohybuje rychle." # todo: NEW TRANSLATION
 FRA_vbci: "VBCI" # todo: NEW TRANSLATION
 FRA_vbci_desc: "VBCI měl nahradit stárnoucí AMX-10P; byl vyvinut a plánován k uvedení do služby do roku 2008 v pozdních 2000. VBCI má mnoho vylepšení, včetně vyšší rychlosti než AMX, s maximální rychlostí 100 km/h. Avšak VBCI obětuje velká děla ve prospěch lehčí výzbroje a vyšších rychlostí." # todo: NEW TRANSLATION
 FRA_forward_air_bases: "Přední letecké základny" # todo: NEW TRANSLATION
 FRA_forward_air_bases_desc: "Abychom byli připraveni na jakýkoli výsledek, musíme posílit naše přední letecké základny, abychom zajistili správně načasované ofenzivní nebo defensivní plány." # todo: NEW TRANSLATION
 FRA_mirage_2000d: "Mirage 2000D" # todo: NEW TRANSLATION
 FRA_mirage_2000d_desc: "Mirage 2000D je běžný útočný plán, který nám věrně sloužil od svého vzniku. Usilování o budoucí a lepší plány bude jen ctít odkaz Mirage." # todo: NEW TRANSLATION
 FRA_carrier_fighters: "Rafale Marine" # todo: NEW TRANSLATION
 FRA_carrier_fighters_desc: "Rafale Marine je carrier verzí běžného stíhače Rafale. Má podobnou konstrukci jako jeho pevninská varianta. Celkově je tento stíhač obrovskou silou v boji o moře." # todo: NEW TRANSLATION
 FRA_med_naval_bases: "Středozemní námořní základny" # todo: NEW TRANSLATION
 FRA_med_naval_bases_desc: "Korsika je hlavním územím pro vylepšenou námořní základnu. Je odlehlá od pevniny a zároveň relativně dobře bránitelná." # todo: NEW TRANSLATION
 FRA_triomphant_class: "Třída Triomphant" # todo: NEW TRANSLATION
 FRA_triomphant_class_desc: "Ponorky třídy Triomphant měly být náhradou a nyní tvoří základ oceánského křídla jaderného odstrašování." # todo: NEW TRANSLATION
 FRA_ifv_investment: "Investice do obrněných vozidel pěšího útvaru (IFV)" # todo: NEW TRANSLATION
 FRA_ifv_investment_desc: "Investice do lepších obrněných vozidel pěšího útvaru (IFV) a dalších lehkých obrněných vozidel by nám mělo pomoci posílit naši armádu a ekonomiku!" # todo: NEW TRANSLATION
 FRA_national_arms_exports: "Národní vývoz zbraní" # todo: NEW TRANSLATION
 FRA_national_arms_exports_desc: "Francie se stala významným hráčem v obranním průmyslu a měli bychom tuto cestu nadále rozvíjet." # todo: NEW TRANSLATION
 FRA_the_space_program: "Vesmírný program" # todo: NEW TRANSLATION
 FRA_the_space_program_desc: "Vesmír je nová fronta, a nedávno jsme prokázali, že se z vesmíru můžeme učit spoustu skvělých věcí! Stojí za to obnovit důvěru ve náš vesmírný program." # todo: NEW TRANSLATION
 FRA_floreal_class: "Třída Floreal" # todo: NEW TRANSLATION
 FRA_floreal_class_desc: "Třída Floreal představuje většinu lehkých fregat ve francouzské flotile. Třída Floreal a její následníci jsou aktivní lodě určené pro víceúčelový boj, zahrnující boj proti plavidlům, námořně-pevninskou podporu, protivzdušnou obranu a středně silný protiponorkový boj." # todo: NEW TRANSLATION
 FRA_laredoubtable_class: "La Redoubtable Class" # todo: NEW TRANSLATION
 FRA_laredoubtable_class_desc: "Ponorky třídy La Redoutable patří k některým ze starších ponorek ve službě francouzského námořnictva. Není však možno je podceňovat, protože hrají klíčovou roli v jaderném odstrašování Francie na moři." # todo: NEW TRANSLATION
 FRA_honour_and_fidelity: "Čest a věrnost" # todo: NEW TRANSLATION
 FRA_honour_and_fidelity_desc: "Moto Francouzské legie ladí s naší zemí. Lidé jsou spojeni v mateřské zemi, jsme naplněni ctí a statečností a naši odvážní lidé jsou disciplinovaní." # todo: NEW TRANSLATION
 FRA_cnes_budgeting: "Rozpočet CNES" # todo: NEW TRANSLATION
 FRA_cnes_budgeting_desc: "CNES je hlavní součástí francouzského letectví a kosmické techniky. Měli bychom umožnit financování CNES, abychom mohli nadále posouvat hranice a zůstat konkurenceschopní v této nové frontě." # todo: NEW TRANSLATION
 FRA_international_space_research: "Mezinárodní vesmírná iniciativa" # todo: NEW TRANSLATION
 FRA_international_space_research_desc: "Měli bychom spolupracovat s dalšími zeměmi, například se Spojenými státy, abychom zahájili posun vpřed v této frontě!" # todo: NEW TRANSLATION
 FRA_kourou_launch_pad: "Kourou startovací plocha" # todo: NEW TRANSLATION
 FRA_kourou_launch_pad_desc: "Kourou v Francouzské Guyaně je strategickým místem pro starty kosmických lodí a zároveň přímým územím vlastněným námi. Můžeme také uzavírat dohody s jinými kosmickými agenturami o jejich využívání." # todo: NEW TRANSLATION
 FRA_honour_homeland_valour_discipline: "Čest, Vlast, Odvaha, Disciplína" # todo: NEW TRANSLATION
 FRA_honour_homeland_valour_discipline_desc: "Moto francouzského námořnictva vyjadřuje víc než jen to, co znamená být v ozbrojených silách. Lidé jsou spojeni s mateřskou zemí, jsme naplněni ctí a odvahou a naši stateční lidé jsou disciplinovaní." # todo: NEW TRANSLATION
 FRA_french_space: "Francouzský vesmír" # todo: NEW TRANSLATION
 FRA_french_space_desc: "Naše dominance ve vesmíru, která bude pokračovat, je klíčová pro budoucnost zdrojů a výnosů, jež lze získat na obloze nad námi." # todo: NEW TRANSLATION
 FRA_francosphere: "Francosféra" # todo: NEW TRANSLATION
 FRA_francosphere_desc: "Francie již od konce druhé světové války praktikovala metodu neokoloniálního vlivu. Ačkoliv nepřímo neokupuje území dalších národů, Francie bývala loutkou, která tahala za provázky ve svůj prospěch. S počátkem jednadvacátého století je mnoho zemí připraveno snížit svou závislost na Paříži jako zdroji vedení. Proto je nyní čas, aby Francie jednala podle toho." # todo: NEW TRANSLATION
 FRA_the_levant_problem: "Problém Levantu" # todo: NEW TRANSLATION
 FRA_the_levant_problem_desc: "Levant je často přehlíženou částí Francosféry. Krajina kdysi poskytovala cenné obilí, ovoce a olej Francouzskému impériu." # todo: NEW TRANSLATION
 FRA_antagonize_syria: "Antagonizovat Sýrii" # todo: NEW TRANSLATION
 FRA_antagonize_syria_desc: "Sýrie pod vládou al‑Asasů učinila příliš mnoho špatných rozhodnutí. Měli bychom destabilizovat režim a pomoci směrovat Sýrii k naší ideologii a sesadit diktátory." # todo: NEW TRANSLATION
 FRA_supporting_armenia: "Podpora Arménie" # todo: NEW TRANSLATION
 FRA_supporting_armenia_desc: "Arménie je nováčkem ve francofonní sféře, ale i tak je to strategický spojenec. Boje této země nám hodně připomínají naše vlastní a musíme Arménii v jejích bojích v Kárabachu podpořit." # todo: NEW TRANSLATION
 FRA_anti_assad_regime_message: "Zpráva proti režimu Asada" # todo: NEW TRANSLATION
 FRA_anti_assad_regime_message_desc: "Ačkoliv jsme vůči Sýrii byli obecně antagonističtí, nastal čas být zcela otevření a už se nevyhýbáme tomu, co skutečně myslíme. Sýrie pod Asadovou vládou zhoršuje situaci a musíme nadále vyjadřovat svůj odpor vůči al-Asadům." # todo: NEW TRANSLATION
 FRA_escalation_from_the_damascus_spring: "Eskalace Damaského jara" # todo: NEW TRANSLATION
 FRA_escalation_from_the_damascus_spring_desc: "Damaské jaro se rozhořelo v plné síle. Nyní je klíčové, abychom nadále podporovali pro-demokratické proudy v Sýrii a po celém Středním východě." # todo: NEW TRANSLATION
 FRA_collaboration_with_the_fsa: "Spolupráce se syrskými rebely" # todo: NEW TRANSLATION
 FRA_collaboration_with_the_fsa_desc: "Rebelové budou potřebovat značné množství zdrojů, aby mohli čelit al-Asadovým. Měli bychom prozkoumat naše možnosti a to, co můžeme této skupině poskytnout, která povede Sýrii vpřed." # todo: NEW TRANSLATION
 FRA_oil_and_gas_investments: "Investice do ropy a zemního plynu" # todo: NEW TRANSLATION
 FRA_oil_and_gas_investments_desc: "Levánt má zvlášť značné zásoby ropy a zemního plynu. Bude navždy výhodné investovat prostředky a personál do ropných a plynových odvětví v regionu." # todo: NEW TRANSLATION
 FRA_reminder_of_the_taif_agreement: "Připomenutí Taífské dohody" # todo: NEW TRANSLATION
 FRA_reminder_of_the_taif_agreement_desc: "Taífská dohoda, oficiálně známá jako Národní dohoda o smíření, byla dosažena k poskytnutí rámcové dohody, která znamená konec Libanonské občanské války a nastolení normality a konce občanské války. Musíme Libanon a Blízký východ připomenout Taífskou dohodu a hledat způsoby, jak ukončit Hizballáh." # todo: NEW TRANSLATION
 FRA_root_out_hezbollah: "Vykořenit Hizballáh" # todo: NEW TRANSLATION
 FRA_root_out_hezbollah_desc: "Hizballáh je přímým útokem na Libanon a Taífskou dohodu a mír v regionu. Vykořenit Hizballáh je jedním z prvních kroků k pomoci nastolit mír na Blízkém Východě." # todo: NEW TRANSLATION
 FRA_agriculture_works_in_the_levant: "Zemědělství na Levantu" # todo: NEW TRANSLATION
 FRA_agriculture_works_in_the_levant_desc: "Vyplatí se usilovat o různé druhy zemědělských investic po Levantu. Na rozdíl od většiny zahraničních představ o regionu je oblast připravena na potenciál. Mnoho plodin lze pěstovat na bujných pobřežích Levantu nebo v říčních údolích Sýrie. Měli bychom prozkoumat naše investice v regionu a pomoci využít zemědělský potenciál Levantu." # todo: NEW TRANSLATION
 FRA_francafrique: "Françafrique" # todo: NEW TRANSLATION
 FRA_francafrique_desc: "Afrika byla kdysi jedním z pilířů naší bývalé koloniální říše. Národy bývalé Françafrique musí i v novém století nadále následovat naše vedení. Měli bychom prozkoumat nejlepší způsob, jak jim pomoci a udržet si vliv nad regionem." # todo: NEW TRANSLATION
 FRA_francophone_solidarity: "Francofonní solidarita" # todo: NEW TRANSLATION
 FRA_francophone_solidarity_desc: "Jednalo se o iniciativu zaměřenou na podporu frankofonní kultury a francouzských hodnot mezi frankofonními národy. Iniciativa zahrnovala lepší přístup ke vzdělání pro chudší národy a hospodářskou podporu rozvojovým zemím v naději, že získají a dále rozvinou oporu, kterou si zachovaly od období po dekolonizaci. Zejména v afrických zemích se Francie aktivně podílela na podpoře partnerství mezi africkými národy, což udržovalo její vliv a přinášelo zisk." # todo: NEW TRANSLATION
 FRA_continue_cold_war_mentality: "Pokračovat v mentalitě studené války" # todo: NEW TRANSLATION
 FRA_continue_cold_war_mentality_desc: "Mnozí z veřejnosti i mezinárodního společenství věří, že naše postavení globální mocnosti upadá. Musíme za každou cenu udržet své postavení předního světového národa. Návrat ke starým metodám nebude mít mezinárodní podporu, ale je třeba jednat. Kritika časem utichne." # todo: NEW TRANSLATION
 FRA_NEPAD_development: "Rozvoj NEPAD" # todo: NEW TRANSLATION
 FRA_NEPAD_development_desc: "Nové partnerství pro rozvoj Afriky (zkráceně NEPAD) je program hospodářského rozvoje vytvořený Africkou unií ve spolupráci s Evropskou unií, Čínou, Japonskem a dalšími členy G8. O rozvoj NEPAD se zajímáme obzvlášť a v rámci Evropské unie jsme se stali jeho hlavním finančním a politickým podporovatelem. Měli bychom pomoci rozšířit jeho působnost a zvýšit financování i podporu programu, abychom pomohli celé Africe." # todo: NEW TRANSLATION
 FRA_CFA_Reforms: "CFA Reforms" # todo: NEW TRANSLATION
 FRA_CFA_Reforms_desc: "Řešení otázky CFA je jednou z našich největších starostí. S postupným úbytkem vlivu jsme nuceni přistoupit k reformě, abychom udrželi neokoloniální říši při životě. Některé naše reformy cílí na větší autonomii bankovního systému, snazší využívání měnových prostředků a kontrolu směny." # todo: NEW TRANSLATION
 FRA_introduce_the_eco: "Zavést ECO" # todo: NEW TRANSLATION
 FRA_introduce_the_eco_desc: "Musíme se vzdát kontroly nad frankem CFA a odstranit závislost našich bývalých kolonií na nás. ECO je navrhovaná nová měna, která by měla západoafrickým národům poskytnout určitou míru hospodářské autonomie a spolupráce mezi novými národy, které ji přijaly. Měli bychom je podpořit v jejich úsilí vytvořit novou společnou měnu a potenciálně přesvědčit celou bývalou francouzskou Afriku, aby tuto novou měnu používala." # todo: NEW TRANSLATION
 FRA_unrestricted_subjugation: "Neomezené podmanění" # todo: NEW TRANSLATION
 FRA_unrestricted_subjugation_desc: "Naše kroky byly dosud pouze vykořisťovatelské a zaměřené na těžbu. Nyní bychom však měli přehodnotit svůj postoj a zvážit, zda nepřehodnotit diplomatický přístup a nevstoupit do nové fáze správy a kontroly. Tato volba nebude oblíbená, ale činíme ji pouze v zájmu národa a jeho globálního postavení." # todo: NEW TRANSLATION
 FRA_intervention_in_africa: "Françafrique Interventionism" # todo: NEW TRANSLATION
 FRA_intervention_in_africa_desc: "Naše bývalé koloniální državy potřebují pomoc. Nyní je čas následovat další politiku intervencí v regionu a poskytovat vojenskou pomoc tam, kde je potřeba." # todo: NEW TRANSLATION
 FRA_sahel_region: "Sahel Region" # todo: NEW TRANSLATION
 FRA_sahel_region_desc: "Region Sahelu nabízí možnosti těžby nerostů a zdrojů a představuje prostor pro francouzské geopolitické postavení i firemní zájmy. S rostoucím extremismem nového tisíciletí musíme jednat, abychom zaručili bezpečnost francouzského majetku a občanů v regionu. Džihádistické povstání se šíří celým Sahelem a ohrožuje tam naše zájmy. Musíme převzít iniciativu, ochránit své postavení a za každou nutnou cenu tuto hrozbu odstranit." # todo: NEW TRANSLATION
 FRA_afrique_centrale: "Afrique Centrale" # todo: NEW TRANSLATION
 FRA_afrique_centrale_desc: "Srdce a duše Afriky, Afrique Centrale, je pokryta nesčetnými přírodními divy a oplývá obrovským bohatstvím zdrojů a potenciálu, z nichž značná část stále zůstává nevyužita." # todo: NEW TRANSLATION
 FRA_CAR_intervention: "Opération Sangaris" # todo: NEW TRANSLATION
 FRA_CAR_intervention_desc: "Opération Sangaris byl název navrhované operace a intervence v občanské válce Centrální Africké republiky." # todo: NEW TRANSLATION
 FRA_operation_artemis: "Opération Artemis" # todo: NEW TRANSLATION
 FRA_operation_artemis_desc: "S Druhou konžskou válkou v plném proudu vedla Francie a další evropské země autonomní intervenci ve východní části země po stažení ugandských sil. Označilo to zásadní zlom v zahraniční politice Evropské unie a ve vojenských společných operacích." # todo: NEW TRANSLATION
 FRA_resources_prospects: "Zdroje a perspektivy" # todo: NEW TRANSLATION
 FRA_resources_prospects_desc: "Přírodně bohaté oblasti subsaharské Afriky jsou plné zdrojů a francouzské společnosti již těží z mnoha tamních partnerství. S rostoucí poptávkou po těchto zdrojích musíme převzít iniciativu a investovat do našeho majetku v zahraničí, abychom si zajistili a dobře udrželi oporu." # todo: NEW TRANSLATION
 FRA_oef_hoa: "OEF - Roh Afrika" # todo: NEW TRANSLATION
 FRA_oef_hoa_desc: "Somálská občanská válka trvá už příliš dlouho. Musíme zasáhnout na straně somálské vlády, pomoci jí znovu získat kontrolu nad válkou zpustošenou zemí a podpořit její úsilí o stabilizaci státu." # todo: NEW TRANSLATION
 FRA_operation_licorne: "Opération Licorne" # todo: NEW TRANSLATION
 FRA_operation_licorne_desc: "Opération Licorne je označení pro francouzské mírové síly nasazené do Pobřeží slonoviny v reakci na občanskou válku mezi Forces Nouvelles de Côte d'Ivoire a Forces Armées de Côte d'Ivoire." # todo: NEW TRANSLATION
 FRA_the_second_ivory_coast_civil_war: "The Second Ivorian Civil War" # todo: NEW TRANSLATION
 FRA_the_second_ivory_coast_civil_war_desc: "Druhá občanská válka na Pobřeží slonoviny byla druhým ozbrojeným konfliktem vycházejícím ze střetu stoupenců Laurenta Gbagba a nově zvoleného prezidenta Alassaneho Ouattary. Konflikt mezi oběma stranami přerostl v otevřenou válku. Měli bychom zasáhnout a pomoci konflikt stabilizovat, než se vymkne kontrole." # todo: NEW TRANSLATION
 FRA_Industrial_expansion: "Průmyslová Expanzie" # todo: NEW TRANSLATION
 FRA_Industrial_expansion_desc: "Naše bývalé koloniální země zoufale potřebují ekonomické oživení. Převážně agrární společnosti by uvítaly malý impuls do svých ekonomik vložením investičních prostředků do regionu." # todo: NEW TRANSLATION
 FRA_educational_development: "Vzdělávací rozvoj" # todo: NEW TRANSLATION
 FRA_educational_development_desc: "Poskytování prostředků na vzdělání v našich bývalých koloniích pomůže jejich obyvatelstvu stát se vzdělanějšími a tím pádem zvýšit jejich produktivitu." # todo: NEW TRANSLATION
 FRA_operation_serval: "Opération Serval" # todo: NEW TRANSLATION
 FRA_operation_serval_desc: "Opération Serval je označení pro sérii francouzských a malijských intervencí během Mali občanské války jako první fáze konfliktu proti islámským extremistům v regionu." # todo: NEW TRANSLATION
 FRA_French_pillar_of_counterterrorism: "Pilíř boje proti terorismu" # todo: NEW TRANSLATION
 FRA_French_pillar_of_counterterrorism_desc: "Naše protiteroristické a protiextremistické síly jsou světově proslulé a stali jsme se pilířem a tváří boje proti terorismu po celém světě." # todo: NEW TRANSLATION
 FRA_french_pillar_of_counterterrorism_tt: "Odesílání §YZahraničních poradců§! do zemí pro §Yústely boje proti terorismu§! naši poradci zdvojnásobí bonus poskytovaný §Yporadované zemi§!." # todo: NEW TRANSLATION
 FRA_the_french_foreign_legion: "Francouzská cizinecká legie" # todo: NEW TRANSLATION
 FRA_the_french_foreign_legion_desc: "Francouzská cizinecká legie je elitní sbor francouzské armády tvořený řadou specializací. Byla založena roku 1831 tehdejším králem Louisem-Philippem a měla zahraničním rekrutům umožnit působit v řadách francouzských sil. Legie je proto mnohonárodnostní a multikulturní bojovou silou, která je po celém světě proslulá svou disciplínou a týmovým duchem." # todo: NEW TRANSLATION
 FRA_sahel_support_initiative: "Iniciativa podpory Sahelu" # todo: NEW TRANSLATION
 FRA_sahel_support_initiative_desc: "Vojenské síly Sahelu jsou často nedostatečně vybavené. Mohli bychom část zdrojů přesměrovat jejich směrem, ať už finančně, nebo vojensky, a pomoci tak posílit naše postavení v Africe." # todo: NEW TRANSLATION
 FRA_sahel_officer_training: "Důstojnické školení Sahelu" # todo: NEW TRANSLATION
 FRA_sahel_officer_training_desc: "Ozbrojené síly národů Sahelu by potřebovaly další trénink, aby se z nich stala efektivnější bojová síla. Měli bychom zvažovat investice do ozbrojených sil našich spojenců v regionu a zlepšit úroveň jejich důstojníků." # todo: NEW TRANSLATION
 FRA_takuba_task_force: "Takuba úderná skupina" # todo: NEW TRANSLATION
 FRA_takuba_task_force_desc: "Takuba úderná skupina byla dalším souborem společných operací mezi francouzskými, malijskými, unijními a americkými silami, aby se pokračovalo ve střetu s islamistickými extremisty během Malijské občanské války. Je to strategický cíl, abychom znovu zahájili naši intervenci v Mali a zajistili stabilitu v regionu." # todo: NEW TRANSLATION
 FRA_haitian_coup: "Haitský puč" # todo: NEW TRANSLATION
 FRA_haitian_coup_desc: "Jean-Bertrand Aristide je pro naši zemi stále trnem v oku. Požadavek na odškodnění je odporný. Mohlo by být v našem zájmu pokusit se pro Haiti najít nové vedení." # todo: NEW TRANSLATION
 FRA_repeal_the_ordiance: "Zrušit nařízení" # todo: NEW TRANSLATION
 FRA_repeal_the_ordiance_desc: "Nařízení Charlese X. z roku 1825 by mělo být zrušeno, aby se normalizovaly haitско-francouzské vztahy. Nařízení z roku 1825 je příčinou a důvodem plateb za haitskou nezávislost, které probíhaly téměř tři čtvrtě století. Je čas tento starobylý právní předpis zrušit jako jeden z prvních kroků ke smíření." # todo: NEW TRANSLATION
 FRA_senegalese_civil_war: "Senegalská občanská válka" # todo: NEW TRANSLATION
 FRA_senegalese_civil_war_desc: "Senegalská občanská válka začala jako lokalizovaný konflikt po nedávných volbách. Senegal je jako pobřežní stát důležitý pro přepravu materiálu z vnitrozemí a severu do Francie. Zásah v regionu je nezbytný, chceme-li pokračovat v našich ambicích v Africe." # todo: NEW TRANSLATION
 FRA_returning_to_indochina: "Návrat do Indočíny" # todo: NEW TRANSLATION
 FRA_returning_to_indochina_desc: "Indočína byla až do vietnamských válek za nezávislost vrcholem francouzských držav na Dálném východě. Je čas vrátit se do Indočíny, možná ne jako kolonizátor, ale tentokrát jako přítel. Naše zájmy v regionu spolu s vzestupem Číny označily tuto oblast za mimořádně důležitou." # todo: NEW TRANSLATION
 FRA_former_indian_colonial: "Záležitosti Indického oceánu" # todo: NEW TRANSLATION
 FRA_former_indian_colonial_desc: "Francouzská držba v Indickém oceánu a francouzsky mluvící země v Indickém oceánu jsou strategicky důležité pro potírání a countering nežádoucího zahraničního vlivu. Je načase se připravit na návrat do těchto strategicky důležitých regionů a přinést s sebou investice a další strategické zlepšení." # todo: NEW TRANSLATION
 France_news.99.t1: "Návrat krále" # todo: NEW TRANSLATION
 France_news.99.t2: "Návrat císaře" # todo: NEW TRANSLATION
 France_news.99.d1: "Královský rod Bourbonů se vrátil do královského sídla ve Versailles, které kdysi nechal vybudovat jejich předek Louis XIV., aby se znovu ujal vlády nad Francií.\n\nKrál [FRA.GetLeader] přislíbil Francii i světu nový a velkolepý věk. „Právoplatní vládci Francie a ochránci západní Evropy se vrátili na své právoplatné místo.“ Tak zněla závěrečná věta jeho projevu, kterou ostatní evropští představitelé a francouzští republikáni okamžitě kritizovali jako šovinistickou a přehnaně sebejistou." # todo: NEW TRANSLATION
 France_news.99.d2: "Samozvaný 'Imperiální dům' Bonapartů, potomci samo-korunovaného císaře Napoleona I. Bonaparta (1769-1821), se vrátili do Versailles. Zatímco Napoleon (a jeho potomci) bývali ve Francii vždy populární, v zahraničí byli méně oblíbení - jak u zahraničních šlechticů, tak u zahraničních obyčejných lidí.\n\nNedávná jingoistická rétorika [FRA.GetLeader], který nedávno nastoupil jako císař Francouzů, byla vůdci Německa, Británie, Itálie a Ruska zpochybněna. Noví vládci Francie mají málo přátel.\n\nSpolečně s novým vládním systémem Francie odhalila novou vlajku: stejná jako stará, ale vyvěšena s červeným pruhem u stožáru – návrat k Francouzské revoluci, kdy byla podobná vlajka vyvěšena krátce před prvním Bonapartovým císařstvím." # todo: NEW TRANSLATION
 France_news.99.o1: "Long live the King!" # todo: NEW TRANSLATION
 France_news.99.o2: "Long live the Emperor!" # todo: NEW TRANSLATION
 France_news.99.o3: "Oh well." # todo: NEW TRANSLATION
 France_news.100.t1: "Rudé vlajky nad Elysejským palácem" # todo: NEW TRANSLATION
 France_news.100.d1: "Francouzská státní televize před úsvitem zčernala. Když se vysílání obnovilo, studio ovládli muži v maskáčích, kteří četli komuniké od tělesa nazývajícího se Výbor veřejné bezpečnosti. Obrněná technika obklíčila Elysejský palác a Národní shromáždění a od půlnoci nebyl spatřen žádný ministr Páté republiky. Brusel svolal mimořádné zasedání a Washington nařídil zaměstnancům svého velvyslanectví ukrýt se na místě." # todo: NEW TRANSLATION
 France_news.100.t2: "Paříž padla tradicionalistům" # todo: NEW TRANSLATION
 France_news.100.d2: "Četnické jednotky loajální tradicionalistickým sítím se přes noc přesunuly do vládní čtvrti a nesetkaly se s žádným odporem armádního velení, které zjevně dostalo rozkaz ustoupit stranou. Ráno vlála trikolóra nad Elysejským palácem vedle praporů, které žádná francouzská vláda netolerovala od roku 1944. Instituce republiky jsou pozastaveny do doby, než bude dokončeno to, čemu spiklenci říkají národní obnova." # todo: NEW TRANSLATION
 France_news.100.a: "Pátá republika skončila." # todo: NEW TRANSLATION
 France_news.100.b: "Evropa to nesmí připustit." # todo: NEW TRANSLATION
 France_news.100.c: "Francie pohřbila další republiku." # todo: NEW TRANSLATION
 France_news.101.t: "Francie jde k urnám" # todo: NEW TRANSLATION
 France_news.101.d: "Volební místnosti se dnes ráno otevřely po celé Francii v prvním kole prezidentských voleb. Očekává se žalostná účast: levice rozdělená na čtyři části, pravice rozpolcená mezi republikány a suverenisty a Národní fronta, o níž se komentátoři během celé kampaně odmítali bavit. Druhé kolo se uskuteční za dva týdny a tentokrát v Paříži nikdo neřekne, kdo do něj postoupí." # todo: NEW TRANSLATION
 France_news.101.a: "Druhé kolo můžeme jen prohrát." # todo: NEW TRANSLATION
 France_news.101.b: "Paříž je třeba sledovat." # todo: NEW TRANSLATION
 France_news.102.t1: "Revoluční buňky zatčeny" # todo: NEW TRANSLATION
 France_news.102.d1: "Koordinované razie DGSI a GIGN rozbily radikální sítě ještě před rozedněním. Vedoucí buněk byli zatčeni ve svých bytech v Saint-Denis a Villeurbanne, sklady zbraní byly zabaveny ve třech departementech a stranický aparát, do něhož se dva roky infiltrovali, byl očištěn. Vláda trvá na tom, že republika nikdy nebyla v ohrožení. Zatykače tvrdí něco jiného." # todo: NEW TRANSLATION
 France_news.102.t2: "Restaurátorské spiknutí rozbito" # todo: NEW TRANSLATION
 France_news.102.d2: "Koordinované razie DGSI a GIGN rozbily tradicionalistické sítě ještě před rozedněním. Organizátoři Action Française byli zatčeni ve svých domovech, sklady zbraní byly zabaveny ve třech departementech a důstojníci, kteří spiklencům slíbili mlčení armády, nyní stanou před vojenským tribunálem. Pátá republika přežila svou nejvážnější krizi za posledních čtyřicet let." # todo: NEW TRANSLATION
 France_news.102.a: "Republika obstála." # todo: NEW TRANSLATION
 France_news.102.b: "Úleva i varování." # todo: NEW TRANSLATION
 france_md.20.t: "Stav centristické strany" # todo: NEW TRANSLATION
 france_md.20.d: "UDF, původně středopravicová strana, se etablovala jako centristická strana a v minulosti jsme dokázali vládnout za prezidenta Valérie Giscarda d'Estainga. Od té doby jsme však byli odsunuti do pozadí, někdy jsme působili během období kohabitace, ale byli jsme zastíněni republikánskou pravicí a Socialistickou stranou. Svět se však mění a neoliberální trend na Západě sílí. Dnes nejsme příliš velcí, ale není pochyb o tom, že jednoho dne budeme vládnout." # todo: NEW TRANSLATION
 france_md.20.a: "Ano, už se nemohu dočkat!" # todo: NEW TRANSLATION
 france_md.21.t: "Stav republikánské pravice" # todo: NEW TRANSLATION
 france_md.21.d: "Naše strana je stejně stará jako republika a od roku 1995 vládla za Jacquese Chiraca, ten však už nemá vítr v plachtách. Po neúspěšném rozpuštění parlamentu, které ho donutilo jmenovat socialistického premiéra, sledujeme vzestup našich soupeřů, ať už Socialistické strany, nebo Národní fronty. Naše země se jako vždy potýká s finančními problémy a její zájmy jsou v zahraničí všude ohroženy. Jedno je jisté: doma i v zahraničí budeme muset bojovat, abychom prosadili sílu Francie před těmi, kteří o ní pochybují." # todo: NEW TRANSLATION
 france_md.21.a: "Pusťme se do práce" # todo: NEW TRANSLATION
 france_md.22.t: "Stav RPF" # todo: NEW TRANSLATION
 france_md.22.d: "Rassemblement Pour la France (RPF), založené v roce 1999, je pravicová suverenistická strana. Vytvořil ji Charles Pasqua a je silně proti Evropské unii, proti níž tvrdě bojovala. Naše vliv je zatím malý, ale karta se obrací: Evropská unie není po chuti každému a přichází k nám stále více disidentů z jiných stran, zklamaných lidí, kteří jinde nenacházejí vůli uskutečnit Frexit. Jsme samozřejmě nejgaullističtější stranou, která existuje, a protože tuto republiku založil de Gaulle, nemáme v ní jiné místo než v Matignonu!" # todo: NEW TRANSLATION
 france_md.22.a: "Ať žije generál de Gaulle, ať žije Francie!" # todo: NEW TRANSLATION
 france_md.23.t: "Stav Národní fronty" # todo: NEW TRANSLATION
 france_md.23.d: "Front National založil v roce 1972 Jean-Marie Le Pen a jde o krajně pravicovou stranu. Od svého vzniku jsme nebyli považováni za seriózní stranu, protože celé politické prostředí stálo proti nám kvůli našemu odporu k imigraci. Situace se od té doby změnila a ostatní strany si začínají uvědomovat, že jejich postoj uvrhl naši zemi do chaosu. Jsme předvojem toho, co se stane všeobecným trendem proti imigraci. Stále jsme však odmítáni jako nedotknutelní a označováni za extremisty, takže musíme pracovat na tom, aby byla naše strana přijatelná pro shromáždění i voliče." # todo: NEW TRANSLATION
 france_md.23.a: "Dokážeme to!" # todo: NEW TRANSLATION
 france_md.24.t: "Stav Socialistické strany" # todo: NEW TRANSLATION
 france_md.24.d: "Naše strana, historický rival republikánské pravice, dosáhla kanonického věku. Republikánská pravice je nyní v potížích, protože byla donucena ke kohabitaci. Máme pevnou volební základnu napříč většinou společenských vrstev a naše vítězství u volebních uren je nevyhnutelné. Prosazujeme liberálnější přístup než naši předchůdci, abychom se přizpůsobili Evropě, kterou budujeme. Naše strana však čelí vnitřním rozporům: pravicovému křídlu dychtícímu po liberálním středu a levicovému křídlu, kterému hrozí radikalizace. Nepochybně zvítězíme, ale jakmile se dostaneme na vrchol, budeme kráčet po špičkách." # todo: NEW TRANSLATION
 france_md.24.a: "Všechno bude v pořádku." # todo: NEW TRANSLATION
 france_md.25.t: "Stav Nepoddajné Francie" # todo: NEW TRANSLATION
 france_md.25.d: "Socialistická strana nedokázala přivést levicové ideály k moci, protože byla rozpolcena mezi dvěma směry. Naše strana La France Insoumise představuje jedinou skutečnou levicovou opozici neoliberálnímu řádu. Socialistická strana se pohřbila tím, že bez rozdílu hledala kompromis, takže naši rétoriku založíme na protestu, i za cenu kritiky v médiích. Naším hlavním projektem je vybudovat novou republiku a ukončit prezidentskou monarchii, kterou snášíme už příliš dlouho. Naše strana je úspěšná mezi mladými lidmi, ale nesmíme se spokojit, pokud chceme jednoho dne vládnout." # todo: NEW TRANSLATION
 france_md.25.a: "Jiný svět je možný." # todo: NEW TRANSLATION
 france_md.26.t: "Stav Zelených" # todo: NEW TRANSLATION
 france_md.26.d: "Ekologická strana ve Francii existuje od roku 1984, ale nedosáhla úspěchu, v který jsme doufali. Nikdy nás neberou vážně a naši volební základnu je téměř nemožné najít mimo městská centra. Pokud se chceme prosadit, budeme muset spolupracovat s ostatními stranami a přizpůsobit se jejich názorům. Vzhledem ke stavu planety se však naše přítomnost v Matignonu nakonec ukáže jako logická. Jakmile tam budeme, budeme usilovat o proměnu způsobu, jakým žijeme a vyrábíme, abychom zajistili budoucnost dalším generacím. Překážek je mnoho, ale potenciálních spojenců je dost." # todo: NEW TRANSLATION
 france_md.26.a: "Dochází nám čas." # todo: NEW TRANSLATION
 france_md.27.t: "Stav Francouzské komunistické strany" # todo: NEW TRANSLATION
 france_md.27.d: "Francouzská komunistická strana padla spolu se SSSR, k němuž byla pevně připoutána. Nikdy není snadné ocitnout se na straně poražených. Naše situace je více než kritická: jak ztrácíme důvěryhodnost, naše dělnická volební základna se přesouvá ke krajní pravici nebo k neúčasti. Musíme tento trend zvrátit a najít nové způsoby, jak si ji získat. Nějakou dobu nepochybně budeme muset vyjednávat s ostatními stranami, ale možná po převzetí moci dokážeme znovu získat důvěru bývalých voličů a obnovit svou autonomii. Naše strana má dlouhou historii a ta nyní nemůže skončit." # todo: NEW TRANSLATION
 france_md.27.a: "Vrátíme se." # todo: NEW TRANSLATION
 france_md.30.t: "Směřování ekonomiky" # todo: NEW TRANSLATION
 france_md.30.d: "Nastal čas vybrat našeho ministra financí. Naše země naléhavě potřebuje reformu, a proto jsme našli dva kandidáty, kteří by měli splnit naše finanční očekávání. První pochází z našich řad, muž jménem Olivier Ferrand, který se během své kariéry v ekonomice s touto oblastí dobře seznámil. Druhý, bývalý finanční inspektor, je v politice nováčkem a podporoval naši kampaň. Jeho sociálně-liberální vize společnosti se podobá tomu, čím se chceme stát, a možná nám jeho přítomnost ve vládě přinese podporu liberálního bloku." # todo: NEW TRANSLATION
 france_md.30.a: "Obnova hnutí! Okamžitě jmenujte Emmanuela Macrona do Bercy!" # todo: NEW TRANSLATION
 france_md.30.b: "Ne, lépe bychom udělali, kdybychom dosadili někoho, komu skutečně důvěřujeme. Jmenujte Oliviera Ferranda." # todo: NEW TRANSLATION
 france_md.11.t: "Spolupráce CNES a NASA" # todo: NEW TRANSLATION
 france_md.11.d: "Vedoucí představitelé CNES nás oslovili s návrhem na rozšíření spolupráce mezi NASA a CNES. Domnívají se, že vesmír nás může mnoho naučit a spojení zdrojů dvou velkých vesmírných programů by mohlo výrazně prospět oběma stranám. Navrhovaná dohoda stanoví, že každá strana poskytne 10 miliard dolarů na rozvoj vědecké spolupráce." # todo: NEW TRANSLATION
 france_md.11.a: "Důležitá dohoda" # todo: NEW TRANSLATION
 france_md.11.b: "Ne" # todo: NEW TRANSLATION
 france_md.100.t: "Podpora Arménie" # todo: NEW TRANSLATION
 france_md.100.d: "Arménský boj proti Ázerbájdžánu v Arcachu nám v mnohém připomíná nás samotné. Podpora jejich úsilí není pouze žádoucí, ale také nezbytná pro naše zájmy v regionu. V jejich konfliktu můžeme poskytnout materiální, finanční nebo politickou podporu. Jak máme pomoci našim přátelům v Jerevanu?" # todo: NEW TRANSLATION
 france_md.100.a: "Podpořit Arménii politicky" # todo: NEW TRANSLATION
 france_md.100.b: "Podpořit Arménii finančně" # todo: NEW TRANSLATION
 france_md.100.c: "Podpořit Arménii vojensky" # todo: NEW TRANSLATION
 france_md.101.t: "Francie nás podporuje!" # todo: NEW TRANSLATION
 france_md.101.d: "Francie se rozhodla nám poskytnout podporu v naší probíhající snaze etablovat se. Konflikty s Ázerbájdžánem i turecké problémy nám nadále působí potíže, ale nyní máme v Evropě spojence." # todo: NEW TRANSLATION
 france_md.101.a: "Další krok správným směrem" # todo: NEW TRANSLATION
 france_md.102.t: "První občanská válka v Pobřeží Slonoviny" # todo: NEW TRANSLATION
 france_md.102.d: "První občanská válka na Pobřeží slonoviny naplno propukla. Konflikt zuří a nejeví žádné známky útlumu. Tento národ, kdysi klenot Françafrique, se proměnil v bojiště mezi znepřátelenými stranami. Stabilita regionu visí na vlásku, zatímco se země trhá na kusy. Která strana nejlépe odpovídá našim současným zájmům?" # todo: NEW TRANSLATION
 france_md.102.a: "Podpořit Laurenta Gbagba" # todo: NEW TRANSLATION
 france_md.102.b: "Podpořit Guillaume Soro" # todo: NEW TRANSLATION
 france_md.102.c: "Podpořit Třetí frakci" # todo: NEW TRANSLATION
 france_md.103.t: "Druhá občanská válka v Pobřeží Slonoviny" # todo: NEW TRANSLATION
 france_md.103.d: "Druhá občanská válka na Pobřeží slonoviny naplno zuří mezi FNC a vládou [CDI.GetName]. Konflikt začal po prezidentských volbách, v nichž Gbagbo odmítl odstoupit navzdory svobodnému a spravedlivému vítězství Ouattary. Která strana nejlépe odpovídá našim současným zájmům?" # todo: NEW TRANSLATION
 france_md.103.a: "Podpořit Laurenta Gbagba" # todo: NEW TRANSLATION
 france_md.103.b: "Podpořit Alassane Ouattaru" # todo: NEW TRANSLATION
 france_md.104.t: "Operace Artemis" # todo: NEW TRANSLATION
 france_md.104.d: "Operace Artemis, navrhovaný zásah Evropské unie v Ituri, by do Demokratické republiky Kongo vyslal mírové síly. Mnozí v naší vládě chtějí, aby Francie vedla vojenskou akci Evropské unie. Mezi účastníky si můžeme vybrat, koho chceme podpořit. Rwanda a [RWA.GetLeader] by mohly být silným spojencem, ačkoli působí na východě a neusilují o kontrolu celé země. [UGA.GetLeader] a [RCD.GetName] jsou další možností, ale nacházejí se převážně na severu. Vždy můžeme podpořit Kinshasu, současnou vládnoucí vládu, což může být nejbezpečnější volba. Koho podpoříme?" # todo: NEW TRANSLATION
 france_md.104.a: "Podpořit Demokratickou republiky Kongo" # todo: NEW TRANSLATION
 france_md.104.b: "Podpořit Ugandu" # todo: NEW TRANSLATION
 france_md.104.c: "Podpořit Rwanda" # todo: NEW TRANSLATION
 france_md.105.t: "Senegalská občanská válka" # todo: NEW TRANSLATION
 france_md.105.d: "Rozšíření senegalské občanské války v mnohem širší konflikt překvapilo všechny zúčastněné. Kombinace otázky Casamance a obvinění z manipulace voleb destabilizovala další africkou zemi. Naše možnosti se značně liší podle našich cílů. Můžeme podpořit [SEN.GetLeader] a jeho vládu, povstalecké frakce nebo obyvatele Casamance. Ať už zvolíme kohokoli, pomůžeme Senegalu vykročit v regionu k nové budoucnosti." # todo: NEW TRANSLATION
 france_md.105.a: "Podpořit Senegal" # todo: NEW TRANSLATION
 france_md.105.b: "Podpořit rebely" # todo: NEW TRANSLATION
 france_md.105.c: "Podpořit Casamance" # todo: NEW TRANSLATION
 france_md.106.t: "Opération Sangaris" # todo: NEW TRANSLATION
 france_md.106.d: "Národní shromáždění a armáda naší země navrhly nový zásah ve Středoafrické republice v reakci na tamní nový konflikt. Navrhovaná operace známá jako Operace Sangaris nasadí naše jednotky na podporu jedné z frakcí v občanském konfliktu. Koho v tomto konfliktu podpoříme?" # todo: NEW TRANSLATION
 france_md.106.a: "Podpořit Středoafrickou republiku" # todo: NEW TRANSLATION
 france_md.106.b: "Podpořit UFDR" # todo: NEW TRANSLATION
 france_md.106.c: "Podpořit Seleka" # todo: NEW TRANSLATION
 france_md.106.d1: "Podpořit Logone" # todo: NEW TRANSLATION
 france_md.106.e: "Podpořit Anti-Balaka" # todo: NEW TRANSLATION
 france_md.107.t: "Operace Serval" # todo: NEW TRANSLATION
 france_md.107.d: "Operace Serval byla navržena Národnímu shromáždění jako reakce na Tuaregskou vzpouru v Mali. Serval je momentálně orientován na nasazení francouzských sil na podporu vlády [MAL.GetName] a [MAL.GetLeader]. Máme možnost změnit naši zahraniční politiku a podpořit věc Tuaregů, pokud si to přejeme. Na kterou stranu konfliktu bychom měli intervenovat?" # todo: NEW TRANSLATION
 france_md.107.a: "Podpořit malijskou vládu" # todo: NEW TRANSLATION
 france_md.107.b: "Podpořit Tuaregy" # todo: NEW TRANSLATION
 france_md.108.t: "Úderná skupina Takuba" # todo: NEW TRANSLATION
 france_md.108.d: "Islámští povstalci zahájili boje proti vládě [MAL.GetAdjective] i tuarégským silám. Operace Serval probíhá již nějakou dobu, ale můžeme poskytnout dodatečnou podporu frakci, kterou jsme podporovali dříve, nebo radikálně změnit kurz a podpořit v Mali nového spojence. Kterou frakci budeme v budoucnu podporovat?" # todo: NEW TRANSLATION
 france_md.108.a: "Podpořit malijskou vládu" # todo: NEW TRANSLATION
 france_md.108.b: "Podpořit Tuaregy" # todo: NEW TRANSLATION
 france_md.108.c: "Podpořit Ansar Dine" # todo: NEW TRANSLATION
 france_md.109.t: "Haitský převrat" # todo: NEW TRANSLATION
 france_md.109.d: "Vládnoucí orgány Haiti nám v současnosti nejsou nakloněny. Příklad, který vládnoucí strana dává, není pro naši zahraniční politiku prospěšný. Podněcování převratu a podpora opozice patří k nejlepším možnostem, jak zajistit, aby ostatní kolonie nezačaly požadovat odškodnění za naše koloniální prohřešky." # todo: NEW TRANSLATION
 france_md.109.a: "Vyvolat převrat" # todo: NEW TRANSLATION
 france_md.109.b: "Podpořit povstalce" # todo: NEW TRANSLATION
 france_md.150.t: "Dodatečná pomoc z Francie" # todo: NEW TRANSLATION
 france_md.150.d: "Francouzská vláda nám nabídla další pomoc ve finanční krizi, kterou procházíme od vstupu do Evropské unie. Máme ji přijmout?" # todo: NEW TRANSLATION
 france_md.150.a: "Ty peníze samozřejmě potřebujeme!" # todo: NEW TRANSLATION
 france_md.150.b: "Ne, nepotřebujeme je." # todo: NEW TRANSLATION
 france_md.151.t: "Francie navrhuje mezinárodní setkání" # todo: NEW TRANSLATION
 france_md.151.d: "Francouzská Socialistická strana se rozhodla uspořádat setkání socialistických vůdců z celého světa a napadlo ji pozvat nás. Mohli bychom toho využít k získání legitimity. Máme jet, nebo zdvořile odmítnout?" # todo: NEW TRANSLATION
 france_md.151.a: "Budeme tam!" # todo: NEW TRANSLATION
 france_md.151.b: "Ne, mám na práci důležitější věci." # todo: NEW TRANSLATION
 france_md.160.t: "Kolaps Socialistické strany" # todo: NEW TRANSLATION
 france_md.160.d: "Po roce nestability a rozkolů uvnitř Socialistické strany z ní téměř nic nezbylo. Je to historický okamžik, ale je škoda sledovat konec strany, která hrála v dějinách Francie tak zásadní roli. Pro toho, kdo zdědí post prvního tajemníka, bude úkol nesmírně obtížný." # todo: NEW TRANSLATION
 france_md.160.a: "Chyby se staly" # todo: NEW TRANSLATION
 france_md.161.t: "Rozkol pokračuje" # todo: NEW TRANSLATION
 france_md.161.d: "Velká část našich členů a podporovatelů se od našeho uskupení postupně distancuje. Je jasné, že pokud se chceme vyhnout pádu, budeme muset využít všechny dostupné páky, abychom si udrželi podporu politiků i veřejnosti." # todo: NEW TRANSLATION
 france_md.161.a: "Není času nazbyt!" # todo: NEW TRANSLATION
 france_md.162.t: "Naše strana je ohrožena" # todo: NEW TRANSLATION
 france_md.162.d: "Mnoho nepopulárních reforem, které jsme navzdory všeobecnému nesouhlasu uskutečnili, nám vyneslo hněv obyvatelstva, které přemýšlí, zda udělalo správně, když pro nás hlasovalo. Naše četná spojenectví s liberálním středem, který jsme se snažili napodobit, navíc způsobila v naší straně mnoho rozkolů. Naše levé křídlo, zklamané našimi rozhodnutími, hrozí přechodem ke krajní levici, zatímco pravé křídlo nás považuje za příliš měkké ve srovnání s liberálními kandidáty, kterým jsme někdy navzdory sobě pomáhali. Pokud ještě existuje šance, budeme muset tvrdě pracovat, abychom ji využili." # todo: NEW TRANSLATION
 france_md.162.a: "Ach, k čertu." # todo: NEW TRANSLATION
 france_md.163.t: "Kdo za to může?" # todo: NEW TRANSLATION
 france_md.163.d: "Po našem zhroucení se někteří naši voliči přesunuli ke středovým stranám, jiní k levicovějším uskupením, která prosazují svůj „radikalismus“ a říkají si „rupturistická“ levice. Tento postoj vyvolává silnou kritiku médií a sjednocuje proti nim opozici. To, proti kterému křídlu se nyní postavíme, rozhodne, zda se k nám naši bývalí voliči někdy vrátí." # todo: NEW TRANSLATION
 france_md.163.a: "Extremisté jakéhokoli ražení ohrožují naši společnost" # todo: NEW TRANSLATION
 france_md.163.b: "To není nic ve srovnání s nebezpečím, které představuje krajní střed" # todo: NEW TRANSLATION
 france_md.164.t: "Francie navrhuje společná vojenská cvičení" # todo: NEW TRANSLATION
 france_md.164.d: "Francouzští diplomaté nám zaslali návrh společného vojenského výcviku. Nedávný nárůst mezinárodního napětí nás skutečně vybízí ke sjednocení evropských států a přípravě na nejhorší. Mohla by to být velmi dobrá iniciativa k výcviku našich ozbrojených sil pro konflikty vysoké intenzity, které mohou vypuknout kdykoli. Co jim odpovíme?" # todo: NEW TRANSLATION
 france_md.164.a: "S potěšením, budeme cvičit po jejich boku" # todo: NEW TRANSLATION
 france_md.164.b: "Ne, děkujeme, jejich pomoc nepotřebujeme" # todo: NEW TRANSLATION
 france_md.165.t: "Přichází bouře" # todo: NEW TRANSLATION
 france_md.165.d: "Několik odborníků z různých oblastí nám již nějakou dobu navrhuje, abychom zavedli regulační opatření pro případ, že by kdekoli na Zemi vypukla hospodářská krize. Nebyla by první ani poslední, ale tato opatření by nám umožnila udržet si odstup od komplikací, které takové krize provázejí. Znamenalo by to však regulaci ekonomického sektoru a placení mnoha odborníků, kteří by dohlíželi na jeho fungování. Opravdu to chceme? Naši finanční partneři by to mohli přijmout špatně." # todo: NEW TRANSLATION
 france_md.165.a: "Situace je skutečně velmi znepokojivá; musíme naléhavě zavést regulační opatření" # todo: NEW TRANSLATION
 france_md.165.b: "Jsou to jen domněnky, které se zdají být špatné pro podnikání" # todo: NEW TRANSLATION
 france_md.170.t: "Francie nabízí válečné reparace" # todo: NEW TRANSLATION
 france_md.170.d: "Francouzská vláda se rozhodla odškodnit nás za krvavou indočínskou válku, která se na našem území odehrávala sedm let. Tyto peníze nikdy nenahradí životy 500 000 Vietnamců, kteří zemřeli za nezávislost, ale jde o čestné gesto, které bychom neměli odmítnout." # todo: NEW TRANSLATION
 france_md.170.a: "Teď počkáme na Američany" # todo: NEW TRANSLATION
 france_md.171.t: "Francie nabízí válečné reparace" # todo: NEW TRANSLATION
 france_md.171.d: "Zdá se, že francouzská vláda konečně souhlasila s uznáním některých zločinů spáchaných v naší zemi a nabízí odškodnění za válku za nezávislost. Tyto peníze nenahradí životy 600 000 Alžířanů, kteří zemřeli za svobodu, ale pro jednou Západoevropan uznává své zločiny; bylo by pošetilé ho odmítnout." # todo: NEW TRANSLATION
 france_md.171.a: "Ve správný čas." # todo: NEW TRANSLATION
 france_md.172.t: "Francie nabízí své jaderné know-how" # todo: NEW TRANSLATION
 france_md.172.d: "Francouzské prezidentské úřady nám navrhly sdílet své jaderné know-how za skromnou finanční částku. Mohlo by se ukázat jako velmi užitečné zvládnout tento nestabilní atom a co nejlépe ho využít. Pokud nabídku přijmeme, výrazně nám to pomůže osvětlit náš lid a usnadní výzkum v této oblasti. Možná bychom však tyto peníze mohli využít jinak, než abychom Francii poskytli místo, které si u nás nezaslouží." # todo: NEW TRANSLATION
 france_md.172.a: "Dohoda o uranu 235" # todo: NEW TRANSLATION
 france_md.172.b: "Ne, své časované bomby si nechte" # todo: NEW TRANSLATION
 france_md.173.t: "Francie nabízí svou ochranu" # todo: NEW TRANSLATION
 france_md.173.d: "Tváří v tvář světu zmítanému četnými krizemi se Francie rozhodla zaručit ochranu svým evropským spojencům. Francouzské prezidentské úřady nás dnes ráno ujistily, že v případě agrese ze strany evropské cizí mocnosti nebudou váhat zasáhnout, a to ani s použitím jaderných zbraní. Ačkoli tato ochrana sama o sobě znamená ztrátu suverenity, v takových časech by se mohla ukázat jako zásadní." # todo: NEW TRANSLATION
 france_md.173.a: "Opatrnosti není nikdy dost" # todo: NEW TRANSLATION
 france_md.173.b: "Jejich ochranu nepotřebujeme" # todo: NEW TRANSLATION
 france_md.175.t: "Evropská unie na nás uvalila sankce" # todo: NEW TRANSLATION
 france_md.175.d: "V návaznosti na naše nedávné postoje a naši touhu vystoupit ze smluv, které nás zavazují k členským státům, nám tito prokletí evropští byrokraté uložili pokutu. Nic nás však nenutí ji zaplatit; naši voliči, kteří touží po změně, by to dokonce považovali za známku slabosti nebo zrady. Odmítnutí platby by však mohlo poškodit naše vztahy s evropskými členskými státy a vyvolat proti nám sankce. Máme jít až do konce?" # todo: NEW TRANSLATION
 france_md.175.a: "Pokutu zaplatíme, protože hrajeme podle pravidel; právě jejich dodržováním zvítězíme" # todo: NEW TRANSLATION
 france_md.175.b: "A co ještě? Už nás dostatečně vysáli" # todo: NEW TRANSLATION
 france_md.180.t: "Historické hlasování" # todo: NEW TRANSLATION
 france_md.180.d: "Lid promluvil. Po dlouhých kampaních za Frexit a poté, co jsme unikli nástrahám těchto prokletých europeistů i odporných populistů, kteří se pokusili přivlastnit si naše úspěchy, jsme to dokázali. Francie opouští Evropu tak rychle, jak jen to jde. Tito bruselští hadi nás samozřejmě nenechají bez trestu a pokusí se nás nechat zaplatit co nejvíce, ale tyto sankce nejsou ničím ve srovnání se svobodou, kterou jsme znovu získali." # todo: NEW TRANSLATION
 france_md.180.a: "Nyní i navždy je Francie svobodná" # todo: NEW TRANSLATION
 france_md.181.t: "Francie opouští Evropskou unii" # todo: NEW TRANSLATION
 france_md.181.d: "Po četných kampaních euroskeptických dezinformací se francouzskému nacionalistickému hnutí konečně podařilo nasměrovat Francii k Frexitu. Odchod Francie je pouze otázkou času; přesto je velmi vážné sledovat, jak tak významný zakládající a strukturující člen EU tak rychle odchází." # todo: NEW TRANSLATION
 france_md.181.a: "Tváří v tvář populismu musíme být obezřetní" # todo: NEW TRANSLATION
 france_md.182.t: "Francie uznává naše nároky" # todo: NEW TRANSLATION
 france_md.182.d: "Francouzská vláda nedávno oznámila, že podporuje naše stanovisko k různým územím, která nám historicky náležela, ale byla nám odňata. Navrhla také zahájení vojenské spolupráce mezi našimi dvěma národy; prozatím jde pouze o zařízení umožňující přístup k naší vojenské infrastruktuře. Tato náhlá francouzská podpora je vítaná, ale měli bychom jim skutečně umožnit využívat naši infrastrukturu?" # todo: NEW TRANSLATION
 france_md.182.a: "Samozřejmě nás podporují; jsou vítáni" # todo: NEW TRANSLATION
 france_md.182.b: "O jejich pomoc jsme nikdy nežádali; ať si drží odstup" # todo: NEW TRANSLATION
 france_md.183.t: "Francie navrhuje prohloubit naši spolupráci" # todo: NEW TRANSLATION
 france_md.183.d: "Po četných prohlášeních v náš prospěch a po oznámení jasného odmítnutí NATO nám Paříž navrhla prohloubit naši spolupráci, od hospodářských vazeb až po plné vojenské spojenectví proti našim společným nepřátelům. Můžeme skutečně důvěřovat Západoevropanům, kteří tak rychle opustili své dřívější spojence?" # todo: NEW TRANSLATION
 france_md.183.a: "Vezmu tři bedny toho parfému; platí" # todo: NEW TRANSLATION
 france_md.183.b: "Dáváte přednost sahelským dunám, nebo našim zamrzlým stepím pro výcvik? Naše armády vyjdou jen silnější" # todo: NEW TRANSLATION
 france_md.183.c: "Mohou zůstat sami" # todo: NEW TRANSLATION
 france_md.184.t: "Moskva přijímá hospodářskou spolupráci" # todo: NEW TRANSLATION
 france_md.184.d: "Odpověď Moskvy na sebe nenechala dlouho čekat; z této dohody mohou těžit obě naše ekonomiky. Kromě toho, že nám otevře významný trh pro naše luxusní a technologicky vyspělé výrobky, budou se naše průmyslová odvětví potřebující suroviny cítit bezpečněji. Tato historická dohoda je pro nás darem z nebes a hřebíčkem do rakve Evropské unie. My, kteří jsme ji vytvořili, nyní obchodujeme s jejím nejhorším nepřítelem." # todo: NEW TRANSLATION
 france_md.184.a: "Ať proudí šampaňské i ropa" # todo: NEW TRANSLATION
 france_md.185.t: "Moskva přijímá hospodářskou a vojenskou spolupráci" # todo: NEW TRANSLATION
 france_md.185.d: "Odpověď Moskvy na sebe nenechala dlouho čekat; z této dohody mohou těžit naše ekonomiky i armády. Kromě toho, že nám otevře významný trh pro naše luxusní a technologicky vyspělé výrobky, budou se naše průmyslová odvětví potřebující suroviny cítit bezpečněji. Posílená spolupráce mezi našimi ozbrojenými silami nám navíc umožní získat zkušenosti v nových bojištích a těžit z jejich technologického a strategického pokroku. Tato historická dohoda je pro nás darem z nebes a hřebíčkem do rakve NATO. Nyní máme důvěryhodného partnera pro plavbu tímto novým tisíciletím." # todo: NEW TRANSLATION
 france_md.185.a: "Znovu se setkáme v Sahelu, ale tentokrát ne proto, abychom proti sobě bojovali" # todo: NEW TRANSLATION
 france_md.187.t: "Rusové přerušují jednání" # todo: NEW TRANSLATION
 france_md.187.d: "Navzdory veškerému úsilí našich diplomatů se jim nepodařilo dosáhnout dohody s ruskými protějšky. Jako by neměli zájem s námi obchodovat. Je to politováníhodné; potenciál dvoustranné dohody by byl pro naše dvě země neocenitelný. Není také vyloučeno, že na ně naši bývalí západní přátelé vyvíjeli tlak, aby nás udrželi pod svou kontrolou. Není to však tragédie; najdeme si jiné partnery." # todo: NEW TRANSLATION
 france_md.187.a: "Americká rakovina tedy dosáhla Uralu; lépe sám než ve špatné společnosti" # todo: NEW TRANSLATION
 france_md.188.t: "Francie požaduje ústupky" # todo: NEW TRANSLATION
 france_md.188.d: "Po vítězství populismu ve Francii a jejím vystoupení z Evropské unie nám Francie nadále dokazuje své nepřátelství. Hospodářské sankce uvalené po jejím odchodu ji nezasáhly bez následků; nyní se zotavila a požaduje náhradu. Dnes přijeli diplomaté s hrozbou, že nám odepřou přístup na své území, pokud neovlivníme Evropskou banku, aby snížila úrokové sazby na jejich dluh. Důsledky této ztráty přístupu na jejich území by mohly výrazně zkomplikovat výměnu uvnitř Evropské unie. Ustoupit jejich vydírání by nás však přimělo zneužít naše výhody." # todo: NEW TRANSLATION
 france_md.188.a: "Ať jsou prokletí; zvolíme menší zlo" # todo: NEW TRANSLATION
 france_md.188.b: "Vydírání několika populistů nepodlehneme" # todo: NEW TRANSLATION
 france_md.189.t: "Německo ustupuje našim požadavkům" # todo: NEW TRANSLATION
 france_md.189.d: "Po tlaku, který jsme na ně vyvinuli, německá vláda neochotně souhlasila s nátlakem na ECB, aby snížila naše úrokové sazby. Je to skvělá pomsta našim bývalým trýznitelům. Tito Němci si mohou dál užívat naše kruhové objezdy, ale díky nim jíme na účet Bruselu." # todo: NEW TRANSLATION
 france_md.189.a: "Oko za oko, zub za zub, pokud možno latinsky" # todo: NEW TRANSLATION
 france_md.190.t: "Německo odmítá naše požadavky" # todo: NEW TRANSLATION
 france_md.190.d: "Naši diplomaté se z Berlína vrátili s prázdnýma rukama, odmítnuti našimi německými bratranci. Možná byly naše požadavky příliš vysoké, nebo chtějí hledat jinde než u nás. Dnes se své pomsty proti Evropské unii nedočkáme, ale nemůže čekat." # todo: NEW TRANSLATION
 france_md.190.a: "My zůstáváme svobodní a oni ne; uzavřete východní hranice" # todo: NEW TRANSLATION
 france_md.191.t: "Francie požaduje ústupky" # todo: NEW TRANSLATION
 france_md.191.d: "Po vítězství populismu ve Francii a jejím vystoupení z Evropské unie nám Francie nadále dokazuje své nepřátelství. Hospodářské sankce uvalené po jejím odchodu ji nezasáhly bez následků; nyní se zotavila a požaduje náhradu. Dnes přijeli diplomaté s hrozbou, že nám odepřou přístup na své území, pokud nenahradíme jejich námořní a pobřežní policii při operacích zadržování migrantů. Důsledky této ztráty přístupu na jejich území by mohly výrazně zkomplikovat výměnu uvnitř Evropské unie. Ustoupit jejich vydírání by nás však přimělo zneužít naše výhody." # todo: NEW TRANSLATION
 france_md.191.a: "Ať jsou prokletí; zvolíme menší zlo" # todo: NEW TRANSLATION
 france_md.191.b: "Vydírání několika populistů nepodlehneme" # todo: NEW TRANSLATION
 france_md.192.t: "Itálie ustupuje našim požadavkům" # todo: NEW TRANSLATION
 france_md.192.d: "Po tlaku, který jsme na ně vyvinuli, italská vláda neochotně souhlasila s nahrazením naší policie na našich námořních hranicích. Je to skvělá pomsta našim bývalým trýznitelům. Tito Italové budou jistě potěšeni přílivem migrantů, ale díky nim jíme na účet Bruselu." # todo: NEW TRANSLATION
 france_md.192.a: "Oko za oko, zub za zub, pokud možno latinsky" # todo: NEW TRANSLATION
 france_md.193.t: "Itálie odmítá naše požadavky" # todo: NEW TRANSLATION
 france_md.193.d: "Naši diplomaté se z Říma vrátili s prázdnýma rukama, odmítnuti našimi latinskými sousedy. Možná byly naše požadavky příliš vysoké, nebo se hodlají poohlédnout jinde než u nás. Dnes se své pomsty na Evropské unii nedočkáme, ale ta nemůže čekat." # todo: NEW TRANSLATION
 france_md.193.a: "My zůstáváme svobodní, oni ne; uzavřete hranice na jihovýchodě" # todo: NEW TRANSLATION
 france_md.194.t: "Francie požaduje ústupky" # todo: NEW TRANSLATION
 france_md.194.d: "Po vítězství populismu ve Francii a jejím vystoupení z Evropské unie nám Francie nepřestala dokazovat své nepřátelství. Hospodářské sankce uvalené po jejím vystoupení ji nezasáhly bez následků; nyní se zotavila a požaduje náhradu škod. Dnes přijeli diplomaté, kteří pohrozili přerušením přístupu na naše území, pokud nevyužijeme instituce, které hostíme, v jejich prospěch. Žádají nás, abychom ovlivnili rozhodování evropských institucí a jejich špionážních služeb. Důsledky této ztráty přístupu na jejich území by mohly značně zkomplikovat výměnu v rámci Evropské unie. Podvolit se jejich vydírání by nás však přinutilo zneužít naše výhody." # todo: NEW TRANSLATION
 france_md.194.a: "Ať je proklejí; zvolíme menší zlo" # todo: NEW TRANSLATION
 france_md.194.b: "Vydírání několika populistů nepodlehneme" # todo: NEW TRANSLATION
 france_md.195.t: "Belgie ustupuje našim požadavkům" # todo: NEW TRANSLATION
 france_md.195.d: "Po nátlaku, který jsme na ně vyvinuli, belgická vláda souhlasila s nátlakem na evropské instituce v náš prospěch. Je to velkolepá pomsta našim bývalým trýznitelům. Tito Belgičané budou nadšeni, že mohou pracovat přesčas v parlamentu, a díky nim hodujeme na účet Bruselu." # todo: NEW TRANSLATION
 france_md.195.a: "Oko za oko, zub za zub, pokud možno latinsky" # todo: NEW TRANSLATION
 france_md.196.t: "Belgie odmítá naše požadavky" # todo: NEW TRANSLATION
 france_md.196.d: "Naši diplomaté se z Bruselu vrátili s prázdnýma rukama, odmítnuti našimi valonskými a vlámskými bratry. Možná byly naše požadavky příliš vysoké, nebo se hodlají poohlédnout jinde než u nás. Dnes se své pomsty na Evropské unii nedočkáme, ale ta nemůže čekat." # todo: NEW TRANSLATION
 france_md.196.a: "My zůstáváme svobodní, oni ne; uzavřete hranice na severu" # todo: NEW TRANSLATION
 france_md.197.t: "Francie požaduje ústupky" # todo: NEW TRANSLATION
 france_md.197.d: "Po svém vystoupení z Evropské unie a zotavení ze sankcí, které z něj vyplynuly, Francie nadále dokazuje své nepřátelství vůči nám. Dnes její diplomaté přijeli s hrozbou přerušení přístupu na francouzské území, pokud jim nepředáme podrobný seznam bankovních účtů vedených na našem území, což je závažné porušení bankovního tajemství, které se snažíme zachovat. Ztráta tohoto přístupu by zkomplikovala náš obchod v celé Unii, ale podvolení by z nás učinilo spoluviníky jejich vydírání." # todo: NEW TRANSLATION
 france_md.197.a: "Ať je proklejí; zvolíme menší zlo" # todo: NEW TRANSLATION
 france_md.197.b: "Vydírání několika populistů nepodlehneme" # todo: NEW TRANSLATION
 france_md.198.t: "Lucembursko ustupuje našim požadavkům" # todo: NEW TRANSLATION
 france_md.198.d: "Po nátlaku, který jsme na ně vyvinuli, lucemburská vláda souhlasila s nátlakem na své bankovní služby, aby nám poskytly podrobný seznam účtů, které vedou. Objevili jsme mnoho zrádců, kteří se snažili uniknout své povinnosti, ale také informace o mnoha soukromých společnostech sídlících na našem území. Tyto objevy pomohou daňové správě při stíhání špatných vlastenců a přimějí společnosti, které se nás pokusily oklamat, aby zaplatily. Lucemburčané možná v bankovnictví výrazně ztratili důvěryhodnost, ale díky nim hodujeme na účet Bruselu a za cenu jejich prokletého volného obchodu." # todo: NEW TRANSLATION
 france_md.198.a: "Oko za oko, zub za zub, pokud možno latinsky" # todo: NEW TRANSLATION
 france_md.199.t: "Lucembursko odmítá naše požadavky" # todo: NEW TRANSLATION
 france_md.199.d: "Naši diplomaté se z Lucemburska vrátili s prázdnýma rukama, odmítnuti našimi milionářskými sousedy. Možná byly naše požadavky příliš vysoké, nebo se hodlají poohlédnout jinde než u nás. Dnes se své pomsty na Evropské unii nedočkáme, ale ta nemůže čekat." # todo: NEW TRANSLATION
 france_md.199.a: "My zůstáváme svobodní, oni ne; uzavřete hranice na severovýchodě" # todo: NEW TRANSLATION
 france_md.200.t: "Francie požaduje ústupky" # todo: NEW TRANSLATION
 france_md.200.d: "Po svém vystoupení z Evropské unie a zotavení ze sankcí, které z něj vyplynuly, Francie nadále dokazuje své nepřátelství vůči nám. Dnes její diplomaté přijeli s hrozbou přerušení přístupu na francouzské území, pokud nepomůžeme jejich zemědělskému sektoru, který na jihu rozvíjí citrusový projekt přímo konkurující našemu vlastnímu. Ztráta tohoto přístupu by zkomplikovala náš obchod v celé Unii, ale podvolení by z nás učinilo spoluviníky jejich vydírání." # todo: NEW TRANSLATION
 france_md.200.a: "Ať je proklejí; zvolíme menší zlo" # todo: NEW TRANSLATION
 france_md.200.b: "Vydírání několika populistů nepodlehneme" # todo: NEW TRANSLATION
 france_md.201.t: "Španělsko ustupuje našim požadavkům" # todo: NEW TRANSLATION
 france_md.201.d: "Po nátlaku, který jsme na ně vyvinuli, španělská vláda souhlasila s poskytnutím technické a obchodní pomoci při výrobě a prodeji naší nové řady citrusů, která zaplaví francouzský a španělský trh. Španělé si možná nyní mohou jen kousat prsty, ale díky nim hodujeme na účet Bruselu a prokázali jsme svou potravinovou hegemonii nad kontinentem." # todo: NEW TRANSLATION
 france_md.201.a: "Oko za oko, zub za zub, pokud možno latinsky" # todo: NEW TRANSLATION
 france_md.202.t: "Španělsko odmítá naše požadavky" # todo: NEW TRANSLATION
 france_md.202.d: "Naši diplomaté se z Madridu vrátili s prázdnýma rukama, odmítnuti našimi iberskými sousedy. Možná byly naše požadavky příliš vysoké, nebo se hodlají poohlédnout jinde než u nás. Dnes se své pomsty na Evropské unii nedočkáme, ale ta nemůže čekat." # todo: NEW TRANSLATION
 france_md.202.a: "My zůstáváme svobodní, oni ne; uzavřete hranice na jihozápadě" # todo: NEW TRANSLATION
 france_md.203.t: "Konec cesty" # todo: NEW TRANSLATION
 france_md.203.d: "Po měsících dialogu a sporů o jeho obsah je text ústavní reformy konečně připraven k hlasování. Naši političtí odpůrci možná využili proces tvorby k propašování klauzulí sloužících jejich vlastním ideálům, ale odepřít lidu hlas po tak dlouhém procesu by v nich zanechalo oprávněný pocit zrady. Vypsání referenda je podle článku 11 ústavy výhradně naší pravomocí a za jeho důsledky odpovíme pouze my." # todo: NEW TRANSLATION
 france_md.203.a: "Je čas to ukončit; vyhlašuji referendum" # todo: NEW TRANSLATION
 france_md.203.b: "Tento text je příliš nebezpečný a nesmí se o něm hlasovat" # todo: NEW TRANSLATION
 france_md.204.t: "Text prošel" # todo: NEW TRANSLATION
 france_md.204.d: "Dnešek je historickým dnem; poprvé se celý lid podílí na tvorbě své ústavy. Výsledek hlasování není překvapivý, drtivě zvítězilo ano; když totiž Francouzovi dáte právo rozhodovat o jeho vlastních právech, jistě se ho nevzdá. Tento text možná není dokonalý, ale odráží novou éru, která dnes začíná, a my jsme udělali vše pro to, aby hájil práva našich občanů a zároveň zabránil lidu podlehnout svůdným písním našich politických protivníků. Zde končí Pátá republika a s tímto upřímným a masivním ano začíná Šestá republika." # todo: NEW TRANSLATION
 france_md.204.a: "Den slávy nadešel" # todo: NEW TRANSLATION
 france_md.205.t: "Text byl výrazně odmítnut" # todo: NEW TRANSLATION
 france_md.205.d: "Navzdory všem očekáváním byla ústavní reforma, kterou jsme měsíce připravovali, u volebních uren odmítnuta. Možná naše zapojení do řízení debat vyvolalo dojem, že se lid snažíme manipulovat, nebo možná naši občané chtěli změnu, ale nikdy se neshodli na její podobě. Vše není ztraceno: stále můžeme prosazovat svou vizi republiky krok za krokem prostřednictvím zákonů, ale rozsáhlá reforma, v kterou jsme doufali, bude muset počkat." # todo: NEW TRANSLATION
 france_md.205.a: "Naprosto nepochopitelné" # todo: NEW TRANSLATION
 france_md.206.t: "Debata o institucích, část 1" # todo: NEW TRANSLATION
 france_md.206.d: "Otázka institucí rozděluje Francii od založení Páté republiky v roce 1958, kdy prezidentská moc nahradila nestabilitu Čtvrté republiky. Tato moc je nyní považována za přehnanou, protože prezidentovi se zlými úmysly umožňuje blokovat pokrok s několika málo kontrolami, zatímco reprezentativnější Národní shromáždění má jen malou výhradní pravomoc. Obnova této zastaralé ústavy je nyní na stole a rozsah změn určí, zda se moc vrátí k parlamentu, nebo zůstane u prezidenta." # todo: NEW TRANSLATION
 france_md.206.a: "Je docela praktické nebýt neustále ohrožován shromážděním" # todo: NEW TRANSLATION
 france_md.206.b: "Pryč s prezidentskou republikou, prezident bude slavnostně zahajovat výstavy chryzantém" # todo: NEW TRANSLATION
 france_md.206.c: "Soustřeďme se jednoduše na podporu aktivní účasti občanů" # todo: NEW TRANSLATION
 france_md.207.t: "Vítězství kompromisu" # todo: NEW TRANSLATION
 france_md.207.d: "Po dnech jednání se občané zřejmě dohodli na novém vyvážení pravomocí. Článek 49.3 se přirozeně stal prvním terčem lidového hněvu. Prezidentské pravomoci vyšly téměř bez újmy a lid se zdá být se svou prací spokojen. Demokratický převrat nyní vypadá méně pravděpodobně; naše instituce získávají na legitimitě i účinnosti. Můžeme jen litovat mírného zklamání našich nejoddanějších stoupenců, kterým jsme slíbili konec prezidentské monarchie. Ať si myslíme cokoli, lid rozhodl; nyní můžeme obrátit pozornost k následujícím debatám." # todo: NEW TRANSLATION
 france_md.207.a: "Velmi dobře, další otázka! Můj úřad z toho vyšel docela dobře." # todo: NEW TRANSLATION
 france_md.208.t: "Konec prezidentské diktatury" # todo: NEW TRANSLATION
 france_md.208.d: "Občané se konečně dohodli: Pátá republika v sobě nashromáždila příliš mnoho odporu kvůli zneužívání prezidentských rozhodnutí a již nemůžeme riskovat, že tolik moci spočine na rozmaru jediného člověka. Pravomoci prezidenta jsou nyní omezeny na funkci vrchního velitele a ceremoniální postavu v Elysejském paláci, zatímco Národní shromáždění se opět stává všemocným. Reformy možná přinesou méně stability, ale budou probíhat mnohem snadněji a důvěra Francouzů v naše instituce by díky nim měla růst." # todo: NEW TRANSLATION
 france_md.208.a: "Budiž; nechť debaty pokračují." # todo: NEW TRANSLATION
 france_md.209.t: "Debaty o institucích, část 2:" # todo: NEW TRANSLATION
 france_md.209.d: "Když se institucionální debata chýlí ke konci, rozděluje naše občany jedna otázka: dohled nad tajnými službami, které odpovídají prezidentovi. Tyto služby dlouho hájily francouzské zájmy, ale dřívější excesy, včetně vražd Auriolových z roku 1981, a jejich svoboda jednat mimo zákon vyvolaly obavy o transparentnost. Větší otevřenost by posílila důvěru v naše instituce, ale naši bezpečnost v čím dál nestabilnějším světě nelze brát na lehkou váhu." # todo: NEW TRANSLATION
 france_md.209.a: "Bezpečnost našich občanů především! Jen zajistíme, aby jejich soukromí nebylo příliš ohroženo." # todo: NEW TRANSLATION
 france_md.209.b: "Lid potřebuje transparentnost! Lid potřebuje spravedlnost; stát se musí zodpovídat svým občanům." # todo: NEW TRANSLATION
 france_md.209.c: "Tato debata vyvolává přílišné napětí; bude lepší držet si odstup." # todo: NEW TRANSLATION
 france_md.210.t: "Tajné služby vyšly bez úhony" # todo: NEW TRANSLATION
 france_md.210.d: "Občané se rozhodli ponechat tajné služby pod kontrolou výkonné moci. Právě v této době musí být naše pasivní obrana v první linii, aby nás chránila před zlovolnými činy ze zahraničí a před terorismem. Tento výsledek však zklamal naše aktivisty, kteří chtěli více transparentnosti a demokracie. Mnoho našich občanů stále věří, že obrana země by v době míru neměla být vykoupena jejich soukromím. Někteří se také obávají zneužití těchto služeb zlovolnými vládami ke špehování opozice nebo bránění únikům informací k opozici. Voliči rozhodli a zvolili bezpečnost před svobodou. Koneckonců je to jejich volba." # todo: NEW TRANSLATION
 france_md.210.a: "Jednoduše není správný čas polevit v ostražitosti ve světě, kde síla převážila nad mezinárodním právem." # todo: NEW TRANSLATION
 france_md.211.t: "Opona se zvedá" # todo: NEW TRANSLATION
 france_md.211.d: "Po namáhavých jednáních jsme se konečně rozhodli ukončit naprostou neprůhlednost našich tajných služeb. Mnoho občanů se již necítilo bezpečně, když věděli, že jsou bez svého vědomí neustále sledováni, a naše zahraniční intervence často vyvolávají kontroverze, o nichž by se raději nedozvídali z novin. Tato nová transparentnost by měla našim občanům dodat větší důvěru v policii a ozbrojené síly, i když nás bude stát část vnitřní bezpečnosti a vnějšího vlivu." # todo: NEW TRANSLATION
 france_md.211.a: "K ochraně před zahraničními zásahy tajné služby nepotřebujeme." # todo: NEW TRANSLATION
 france_md.212.t: "Debata o osobních právech, část 1:" # todo: NEW TRANSLATION
 france_md.212.d: "Otázka osobních práv stojí v samotném středu ústavní debaty. Měli bychom posílit individuální svobody vůči státu, nebo dát přednost kolektivní bezpečnosti? Diskuse se soustřeďuje na ochranu osobních údajů, právo na soukromí a meze státního dohledu. Pokrokáři prosazují rozšíření základních práv, zatímco konzervativci se obávají oslabení veřejné autority. Náš postoj k této otázce částečně určí směr nové ústavy." # todo: NEW TRANSLATION
 france_md.212.a: "Důsledně hájit individuální svobody." # todo: NEW TRANSLATION
 france_md.212.b: "Kolektivní bezpečnost musí mít přednost." # todo: NEW TRANSLATION
 france_md.212.c: "Nechme debatu pokračovat bez nás." # todo: NEW TRANSLATION
 france_md.213.t: "Vítězství individuálních svobod" # todo: NEW TRANSLATION
 france_md.213.d: "Debata skončila ve prospěch posílení individuálních svobod. Nová ústava zaručí větší ochranu před zásahy státu do soukromého života občanů. Toto vítězství pokrokářů představuje obrat v našem vztahu k veřejné autoritě, i když se někteří obávají důsledků pro národní bezpečnost." # todo: NEW TRANSLATION
 france_md.213.a: "Naši občané se mohou z těchto nových záruk radovat." # todo: NEW TRANSLATION
 france_md.214.t: "Bezpečnost vítězí" # todo: NEW TRANSLATION
 france_md.214.d: "Navzdory úsilí zastánců svobody zvítězila v ústavních debatách vize zaměřená na bezpečnost. Stát si zachová rozsáhlé pravomoci v oblasti dohledu a zásahů. Zatímco část obyvatelstva to uklidňuje, aktivisté za občanská práva odsuzují demokratický ústup." # todo: NEW TRANSLATION
 france_md.214.a: "Stabilita něco stojí." # todo: NEW TRANSLATION
 france_md.215.t: "Debata o osobních právech, část 2:" # todo: NEW TRANSLATION
 france_md.215.d: "Náš národ je známý svými nepokoji a ať už volby dopadnou jakkoli, nespokojenost nakonec vyjde do ulic. Na pořad dne se nyní dostává otázka ochrany občanů během protestů: na jedné straně policejní excesy, na druhé nedostatečná ochrana, přičemž mnoho protestů končí zraněními. Omezení policie by obnovilo důvěru veřejnosti, ale zvýšilo náklady, zatímco její podpora zachová pořádek, avšak riskuje další incidenty s radikalizací hnutí." # todo: NEW TRANSLATION
 france_md.215.a: "Musíme regulovat naše policejní síly." # todo: NEW TRANSLATION
 france_md.215.b: "Nechte je dělat jejich práci." # todo: NEW TRANSLATION
 france_md.215.c: "Rozhodne lid; koneckonců právě on bude v ulicích protestovat proti tomuto zákonu." # todo: NEW TRANSLATION
 france_md.216.t: "Lid se rozhodl omezit policii" # todo: NEW TRANSLATION
 france_md.216.d: "Po hodinách debat se většina shodla, že policejní síly je třeba regulovat, aby se předešlo novým skandálům. Technologie pro udržování pořádku se zlepšují a my jsme již v tomto ohledu vysoce efektivním národem; není třeba zacházet dál. Navíc předcházení vážným fyzickým zraněním mezi demonstranty jistě sníží výdaje na zdravotnictví. Stát se také bude muset svému lidu více zodpovídat, protože ten bude moci protestovat v ulicích s menším nebezpečím. Je však třeba očekávat dodatečné náklady na policii, protože účinnost vymáhání práva bude nižší." # todo: NEW TRANSLATION
 france_md.216.a: "Náš lid nás tedy bude i nadále držet na uzdě. Další otázka!" # todo: NEW TRANSLATION
 france_md.217.t: "Lid volí pořádek" # todo: NEW TRANSLATION
 france_md.217.d: "I když bychom si to nepřáli, zvítězila účinnost policie. Je pravda, že některé protesty se zvrhnou a způsobí rozsáhlé škody na majetku, takže vzhledem ke snížené účinnosti bezpečnostních složek je nutný vnější dohled. Čelíme rozpočtovým a sociálním krizím bezprecedentního rozsahu; v určitém okamžiku budeme muset část lidu obrátit proti sobě. Proto je důležité být schopni čelit každému sociálnímu hnutí, které přijde. Koneckonců, zvolili si nás, nebo ne?" # todo: NEW TRANSLATION
 france_md.217.a: "Lid zvolil bezpečnost před právem volat nás k odpovědnosti; můžeme mu to vyčítat? Další otázka." # todo: NEW TRANSLATION
 france_md.218.t: "Debata o ekonomice, část 1" # todo: NEW TRANSLATION
 france_md.218.d: "Ačkoli řízení ekonomiky připadne budoucím vládám, můžeme již nyní zakotvit v ústavě sociální, ekologické nebo ekonomické základy a učinit zákony, které je porušují, protiústavními. Upřednostnění sociální ochrany zajistí pracovní místa a sociální zabezpečení, ale může upozadit ekologii a kvůli vzniklému dluhu zneklidnit investory. Upřednostnění ekologie zlepší kvalitu života a nasměruje nás k novým zdrojům energie, ale ponechá stranou některé příjmy a investice. Mohli bychom také předstírat podporu ekonomiky, abychom zaseli nesvár mezi ostatní frakce, nebo otázku přenechat zcela jim." # todo: NEW TRANSLATION
 france_md.218.a: "Nejdříve sociální podpora! Musíme stát při našich občanech." # todo: NEW TRANSLATION
 france_md.218.b: "Planeta se zhoršuje příliš rychle na to, abychom nečinně seděli." # todo: NEW TRANSLATION
 france_md.218.c: "Dobrý nápad; přimějeme je myslet si, že za tím stojí liberálové." # todo: NEW TRANSLATION
 france_md.218.e: "Nechme ostatní strany, ať se kvůli této otázce navzájem roztrhají." # todo: NEW TRANSLATION
 france_md.219.t: "Lid volí přednostní sociální podporu" # todo: NEW TRANSLATION
 france_md.219.d: "Po dlouhých hodinách váhání se občané konečně shodli na sociálním pilíři republiky. Ochrana obyčejných lidí a jejich pracovních míst nám zajistí zdravý přechod k lepší budoucnosti. Navíc je lepší, když jsou naše továrny postaveny podle norem a znečišťují zde, než aby byly přesunuty do zemí, které se tím zabývají méně. Tento výsledek není překvapivý ani špatný." # todo: NEW TRANSLATION
 france_md.219.a: "Další otázka, na kterou jsme mohli odpovědět; dobře odvedeno." # todo: NEW TRANSLATION
 france_md.220.t: "Lid volí ekologii" # todo: NEW TRANSLATION
 france_md.220.d: "Tento výsledek nám nevadí. Zdraví planety se totiž odráží ve zdraví jejích obyvatel. Není proto překvapivé, ba dokonce prospěšné, že k tomuto probuzení došlo na více úrovních společnosti. Budeme se tedy muset naučit proměnit své způsoby života a výroby zboží i energie. Cesta bude plná překážek a nebude vždy sloužit zájmům většiny. Ale právě touto cestou musíme jít." # todo: NEW TRANSLATION
 france_md.220.a: "Teď už zbývá jen recyklovat ty, kteří hlasovali pro velký byznys." # todo: NEW TRANSLATION
 france_md.221.t: "Lid volí ekonomiku" # todo: NEW TRANSLATION
 france_md.221.d: "Překvapivý výsledek dnešních debat. Lid se rozhodl chránit podniky všeho druhu, aby podpořil rozvoj této země. Je vidět, že někteří stále věří teorii prosakování bohatství. Dalo se také očekávat, že média, často ovládaná několika oligarchy, udělají vše pro naklonění vah. Pro naše aktivisty je to značně zklamávající den. Nyní však nemůžeme zpochybnit názor svrchovaného lidu." # todo: NEW TRANSLATION
 france_md.221.a: "Byl opravdu tak dobrý nápad ptát se na názor lidu?" # todo: NEW TRANSLATION
 france_md.222.t: "Debata o ekonomice, část 2" # todo: NEW TRANSLATION
 france_md.222.desc: "Ostatní společenské otázky počkají na budoucí republiky, ale ústavní směřování můžeme určit již nyní: kdo má platit naše výjimečné, avšak nákladné sociální zabezpečení? Ať už tato reforma rozhodne o zdanění, rozpočtovém financování nebo škrtech ve výdajích, ovlivní finanční základ našeho sociálního státu na celé generace." # todo: NEW TRANSLATION
 france_md.222.a: "Pryč s kapitalismem!" # todo: NEW TRANSLATION
 france_md.222.b: "Systém bude financovat stát; uděláme vše pro to, abychom se vyhnuli novým daním." # todo: NEW TRANSLATION
 france_md.222.c: "Nemůžeme riskovat, že naši občané přijdou o práci." # todo: NEW TRANSLATION
 france_md.222.d: "Bylo by lepší, kdybychom se do této debaty nezapojovali." # todo: NEW TRANSLATION
 france_md.223.t: "Lid volí zdanění kapitálu" # todo: NEW TRANSLATION
 france_md.223.d: "Dlouhé debaty posledních týdnů skončily naším vítězstvím v této ideologické konfrontaci. Sociální zabezpečení obyvatelstva bude financovat kapitál a příjmy nejbohatších. Tento symbolický čin znamená velké vítězství lidu nad velkým kapitálem. Vítězství Francie nad finančnictvím je vítězstvím všeho lidu sjednoceného proti svým bývalým pánům. Naše debaty o ekonomice prozatím končí, ale připravili jsme půdu pro budoucí generace. Během několika reforem jsme tak uskutečnili revoluci." # todo: NEW TRANSLATION
 france_md.223.a: "Velké vítězství francouzského lidu." # todo: NEW TRANSLATION
 france_md.224.t: "Lid potvrzuje roli státu" # todo: NEW TRANSLATION
 france_md.224.d: "Výsledek debat z minulého týdne je jasný: lid nechce převrátit ekonomiku tak, jak existuje. Je to kvůli neoliberální propagandě, kterou je každý den bombardován v televizi? Pravděpodobně, ale jeho verdikt musíme přijmout, protože jedině na něm záleží. Přinejmenším se nám podařilo nepodpořit škrty v jiných státních službách kvůli financování této, ale je možné, že naši nástupci budou vůči společnosti při financování našeho systému méně benevolentní. Zajistíme, aby se tak nestalo." # todo: NEW TRANSLATION
 france_md.224.a: "Není to vítězství, v které jsme doufali, ale budeme se s tím muset spokojit." # todo: NEW TRANSLATION
 france_md.225.t: "Lid volí škrty jinde" # todo: NEW TRANSLATION
 france_md.225.d: "Kdybychom věděli, že verdikt bude takový, možná bychom tuto debatu nepředložili k hlasování, ale na to je už pozdě. Lid právě rozhodl o osudu našeho sociálního systému. Doporučil, aby budoucí zákonodárci zachovali základní státní služby, ale omezili jiné státní výdaje. Jejich hlavním cílem budou pravděpodobně zaměstnanci veřejné správy a mnohé dotace, které nepovažují za nezbytné. Systém sociální ochrany bude financován, ale právě jsme ospravedlnili vstup liberálního vlka do účtů státu. Dokud jsme u moci, můžeme tomu zabránit, ale kdo ví, co udělají budoucí vlády." # todo: NEW TRANSLATION
 france_md.225.a: "Tato ústavní reforma nejde přesně podle plánu." # todo: NEW TRANSLATION
 france_md.226.t: "Debata o společenských otázkách, část 1:" # todo: NEW TRANSLATION
 france_md.226.d: "Francouzský systém integrace menšin dlouho spočíval na ideálu „tavicího kotle“ republikánského školství a meritokracie, ale tento princip ukazuje své limity: klesající sociální mobilita podporuje nezaměstnanost a komunitarismus. Debata se nyní zaměřuje na reformu tohoto systému. Prosazování inkluzivnějšího modelu riskuje rozkolísání rámce, který platil po celé generace, ale jeho ponechání beze změny pouze dává našim protivníkům možnost ještě více jej zpřísnit. Ať už zvolíme cokoli, naše rozhodnutí zde ovlivní zemi na celé generace." # todo: NEW TRANSLATION
 france_md.226.a: "Aby co nejvíce lidí mohlo žít lépe, musí být systém inkluzivnější." # todo: NEW TRANSLATION
 france_md.226.b: "Nechme občany, aby o této otázce rozhodli sami." # todo: NEW TRANSLATION
 france_md.227.t: "Lid volí přizpůsobení systému" # todo: NEW TRANSLATION
 france_md.227.d: "Výsledek debat se zřejmě posunul směrem k přizpůsobení současného systému rozmanitosti našeho nového tisíciletí. Jistě budeme muset investovat prostředky, ale náš systém díky této inkluzi nebude ochuzen o nové talenty proudící do naší země. Tím, že jsme každému dali budoucnost na dosah, pomohli jsme uklidnit situaci a zároveň podpořili náš dlouhodobý rozvoj." # todo: NEW TRANSLATION
 france_md.227.a: "Od ostatních se máme tolik co učit." # todo: NEW TRANSLATION
 france_md.228.t: "Lid volí zpřísnění současného systému" # todo: NEW TRANSLATION
 france_md.228.d: "Navzdory našemu úsilí se zdá, že současná společnost není připravena zpochybnit základy naší republiky. Francouzský integrační systém má zřejmě stále před sebou světlou budoucnost. Toto hlasování potvrzuje, že Francouzi lpí na systému, který má navzdory svým nedostatkům tu výhodu, že již existuje. Tento systém lze z dlouhodobého hlediska stále reformovat, ale promarnili jsme příležitost zbořit další pevnost." # todo: NEW TRANSLATION
 france_md.228.a: "Škoda" # todo: NEW TRANSLATION
 france_md.229.t: "Debata o společenských otázkách, část 2:" # todo: NEW TRANSLATION
 france_md.229.d: "Svoboda vyznání je jednou z nejpalčivějších otázek našeho tisíciletí. Od zákonů o sekularismu Třetí republiky ji Francie horlivě chrání, dokonce za cenu svobody samotných občanů, především zákazem náboženských symbolů na veřejných základních školách, což je pravidlo stále více v centru napjaté celonárodní debaty. Uvolnění tohoto právního rámce by mohlo uklidnit vztahy mezi komunitami, ale znamenalo by zpochybnění základního zákona, kterého si naši občané váží." # todo: NEW TRANSLATION
 france_md.229.a: "Naše společnost se musí přizpůsobit potřebám náboženských komunit na uznání." # todo: NEW TRANSLATION
 france_md.229.b: "Nechme občany, aby o této otázce rozhodli sami." # todo: NEW TRANSLATION
 france_md.230.t: "Lid volí uvolnění sekularismu" # todo: NEW TRANSLATION
 france_md.230.d: "Debaty o sekularismu skončily ve prospěch uvolnění současného právního rámce. Nošení náboženských symbolů bude nakonec normalizováno na více místech než dříve. Různá vyznání také získají právo na větší zastoupení ve společnosti, při zachování nadřazenosti státu a jeho oddělení od náboženství. Je to vítězství, protože se nám podařilo zachovat to nejlepší ze starého systému a zároveň uvolnit jeho nejkontroverznější části. Můžeme jen doufat, že tato trhlina v základním zákoně nepovede k postupnému zpochybňování tohoto ochranného rámce svobody vyznání. V tomto ohledu můžeme důvěřovat našim nástupcům." # todo: NEW TRANSLATION
 france_md.230.a: "Tohle by mělo dopadnout dobře." # todo: NEW TRANSLATION
 france_md.231.t: "Lid volí zpřísnění zákona o sekularismu" # todo: NEW TRANSLATION
 france_md.231.d: "Nečekali jsme, že otevření debaty o sekularismu vytvoří přísnější systém, než jaký jsme měli. Bylo to riziko, které stálo za to podstoupit, a my jsme ho podstoupili. Náboženské symboly budou nyní ve veřejných institucích tolerovány ještě méně. Předvídali naši předkové, že se tímto směrem vydáme tak daleko? Nyní jsme zde a uvidíme, kam tyto změny povedou. Jisté je, že náš ideál tolerance se zdá být dál než kdy dřív." # todo: NEW TRANSLATION
 france_md.231.a: "Alespoň svoboda svědomí zůstává zaručena." # todo: NEW TRANSLATION
 france_md.235.t: "Budování republiky zítřka" # todo: NEW TRANSLATION
 france_md.235.d: "Nyní, když náš mandát začal, je čas zahájit náš nejnetrpělivěji očekávaný slib: Šestou republiku. Tato nová republika, o níž chceme diskutovat, nikoli ji vnucovat, zaměstná naše občany na celé měsíce, zatímco budou pokládat základy zítřejší společnosti. Občas možná budeme muset debatu usměrnit, aby se neodchýlila, ale přílišná angažovanost by znamenala ztrátu důvěry lidu. Tento projekt musí být dokončen až do konce a dostatečně rychle, aby to nikdy nevypadalo, že odkládáme samotnou demokracii." # todo: NEW TRANSLATION
 france_md.235.a: "Pátá republika prožívá své poslední chvíle" # todo: NEW TRANSLATION
 france_md.236.t: "Šestá republika selhává" # todo: NEW TRANSLATION
 france_md.236.d: "Debatní prostory jsou již několik týdnů prázdné a projekt Šesté republiky stagnuje, nikoli kvůli válce nebo krizi, ale kvůli prostému nezájmu. Tím, že jsme příliš dlouho organizovali debaty a reagovali na příspěvky našich občanů, jsme nechali zemřít lidové nadšení, které jsme podnítili. Naše šance změnit systém nyní uniká. Stále můžeme část této práce prosadit jako běžné reformy, ale bez rozsahu, v nějž jsme doufali, a nepodařilo se nám napravit nespravedlnosti zakotvené v naší ústavě, nejvyšším zákoně země." # todo: NEW TRANSLATION
 france_md.236.a: "Promarnili jsme příležitost změnit systém" # todo: NEW TRANSLATION
 france_md.238.t: "Francie na nás uvaluje embargo" # todo: NEW TRANSLATION
 france_md.238.d: "Francie oznámila úplné embargo vůči nám, které zahrnuje vše od dodávek materiálu po běžný obchod. Od zvolení La France Insoumise Paříž kvůli palestinské otázce zostřila svou rétoriku vůči nám, obviňuje naši vládu z přiživování konfliktu v regionu a nyní přistoupila k úplnému embargu. Horší je, že lobbuje u zbytku Evropy, aby učinil totéž. Naši evropští obchodní partneři jsou zásadní a nemůžeme si dovolit, aby tato kampaň uspěla." # todo: NEW TRANSLATION
 france_md.238.a: "Mnoho lidí nepřesvědčí" # todo: NEW TRANSLATION
 france_md.239.t: "Francie nás žádá, abychom uvalili embargo na Stát Izrael" # todo: NEW TRANSLATION
 france_md.239.d: "Po rozhodnutí Francie uvalit embargo na Stát Izrael nás francouzští diplomaté kontaktovali s žádostí, abychom učinili totéž. Jako odůvodnění uvádějí agresivní politiku Státu Izrael vůči jeho sousedům, následnou destabilizaci regionu a tamní humanitární situaci. Tyto argumenty nejsou bez opodstatnění a významná část našich voličů je podporuje. Takové kroky nás však mohou mezinárodně draze stát a navíc nemáme žádný geopolitický zájem odvracet se od našeho izraelského spojence. Jak máme rozhodnout?" # todo: NEW TRANSLATION
 france_md.239.a: "Samozřejmě, Stát Izrael musí omezit svou expanzionistickou politiku" # todo: NEW TRANSLATION
 france_md.239.b: "Naše izraelské partnery neopustíme" # todo: NEW TRANSLATION
 france_md.240.t: "Francie navrhuje pomoc při stabilizaci našeho národa" # todo: NEW TRANSLATION
 france_md.240.d: "Po století kolonialismu a desetiletích neokolonialismu se zdá, že se francouzská politika v Africe změnila. Navrhují nám pomoci stabilizovat naši zemi a zároveň omezit svou kontrolu nad ní. Tato zpráva se zdá být požehnáním a naše země tuto pomoc potřebuje více než kdy dříve. Je však pravděpodobné, že tato pomoc přijde s nutnými přísliby míru, které půjdou ruku v ruce s uvolněním poměrů mezi obyvatelstvem. Zdá se, že náš bývalý kolonizátor nyní přemýšlí o důsledcích svých činů. Měli bychom učinit totéž?" # todo: NEW TRANSLATION
 france_md.240.a: "Pomoc je vždy vítaná" # todo: NEW TRANSLATION
 france_md.240.b: "Nepotřebujeme je; už tu nejsou ničím" # todo: NEW TRANSLATION
 france_md.244.t: "Francie prosazuje sociální zákony" # todo: NEW TRANSLATION
 france_md.244.d: "Po vítězství hnutí La France Insoumise ve Francii se v naší zemi ozývá mnoho hlasů volajících po přijetí podobných zákonů, jaké byly přijaty ve Francii. Zdá se, že úspěch levicového zlomu ve Francii se přelévá k nám i do dalších zemí Evropské unie. Napříč našimi zeměmi se organizují hnutí požadující stejné legislativní inovace jako naši francouzští sousedé. Většina těchto návrhů se týká především lidských práv, sociální spravedlnosti a ekologie. Měli bychom tyto zákony přijmout a zavést i u nás? Mohlo by to být pro naše občany prospěšné." # todo: NEW TRANSLATION
 france_md.244.a: "Tyto zákony by mohly být dobrým doplněním naší ústavy" # todo: NEW TRANSLATION
 france_md.244.b: "Ne, to nebude možné" # todo: NEW TRANSLATION
 france_md.245.t: "Francie prosazuje ekologickou legislativu" # todo: NEW TRANSLATION
 france_md.245.d: "Vítězství ekologů ve Francii vyslalo Evropou šokovou vlnu: zakládající člen naší Unie nyní upřednostňuje klimatickou legislativu před narativem volného obchodu a růstu, na němž byla EU vybudována. Aktivisté již začali tuto dynamiku přenášet do naší vlastní země. Měli bychom přijmout část jejich programu, jako gesto našim pokrokovým silám, ale za cenu zpomalení hospodářského rozvoje, nebo zaujmout jasné stanovisko dříve, než se situace bez nás posune ještě více jejich směrem?" # todo: NEW TRANSLATION
 france_md.245.a: "Měli bychom se také chránit před změnou klimatu" # todo: NEW TRANSLATION
 france_md.245.b: "Jaká změna klimatu?" # todo: NEW TRANSLATION
 france_md.246.t: "Zelená Francie ovládla Komisi" # todo: NEW TRANSLATION
 france_md.246.d: "Po posledním hlasování o jmenování Evropské komise se zdá, že ekologie zvítězila. Po vítězství ekologů ve Francii se Europe Écologie – Les Verts dostala na nejvyšší úroveň Evropské unie, což je výrazným znamením rostoucího zaměření Unie na klimatické otázky. Kromě zvyšování povědomí našich občanů toto vítězství posiluje jejich důvěru v Evropu, která bere jejich klimatickou bezpečnost vážně." # todo: NEW TRANSLATION
 france_md.246.a: "Směřujeme k zelené Evropě?" # todo: NEW TRANSLATION
 france_md.248.t: "Ekologičtí poslanci zintenzivňují činnost v Evropském parlamentu" # todo: NEW TRANSLATION
 france_md.248.d: "Od svého zvolení ve Francii se ekologičtí poslanci v Evropském parlamentu zdánlivě množí. Zdá se, že jsme svědky obnoveného zájmu o ekologické otázky v členských státech Evropské unie. Tento počet poslanců, který nabývá na významu, stále více utváří rovnováhu sil v Evropském parlamentu, až se stává důležitým faktorem pro nadcházející evropské komise. Rostoucí vliv ekologů na Evropskou unii se zdá přelévat i do naší země, kde ovlivňuje nejen popularitu našich ekologických stran, ale také posiluje důvěru v Evropskou unii, která věnuje větší pozornost zdravotním a ekologickým otázkám." # todo: NEW TRANSLATION
 france_md.248.a: "V Evropském parlamentu toho mnoho nezmůžou" # todo: NEW TRANSLATION
 france_md.249.t: "Francie navrhuje fond pro zelenou transformaci" # todo: NEW TRANSLATION
 france_md.249.d: "Tentokrát naši francouzští přátelé přišli s novým návrhem. Navrhují vytvoření společného fondu evropských zemí, který by pomáhal s ekologickou transformací evropských států. Tento fond by nám měl umožnit rozvíjet energetický sektor pomocí zelené energie, bude-li to možné. Zdůrazňují, že tento nástroj pomůže potvrdit naši energetickou suverenitu a postavit ji na udržitelných základech. Vyžadoval by však větší mobilizaci našeho civilního sektoru ve prospěch těchto investic. Měli bychom se zapojit?" # todo: NEW TRANSLATION
 france_md.249.a: "Kde se podepisuje?" # todo: NEW TRANSLATION
 france_md.249.b: "Ne, děkujeme, sami si vedeme velmi dobře" # todo: NEW TRANSLATION
 france_md.250.t: "Francie navrhuje snížit evropské emise uhlíku" # todo: NEW TRANSLATION
 france_md.250.d: "Naši francouzští ekologičtí přátelé se vrátili s návrhem na drastické snížení emisí uhlíku, který nám i našim sousedům předkládají právě ve chvíli, kdy EU dokončuje svou Zelenou dohodu. Tvrdí, že omezení využívání fosilních paliv by našim lidem umožnilo lépe dýchat a vybudovalo energetickou suverenitu Unie, protože žádná z našich zemí vlastní ropu netěží. Taková restrukturalizace by byla nákladná a pomalá, ale mohla by být rozhodující, pokud by napětí s Ruskem, naším hlavním zdrojem fosilních paliv, někdy přerostlo v otevřený konflikt." # todo: NEW TRANSLATION
 france_md.250.a: "Mají pravdu; fosilní paliva nás činí zranitelnými" # todo: NEW TRANSLATION
 france_md.250.b: "Nechápu, v jakém světě bychom mohli být v rozporu s Ruskem" # todo: NEW TRANSLATION
 france_md.251.t: "Francouzské vměšování do naší obchodní politiky" # todo: NEW TRANSLATION
 france_md.251.d: "Náš velvyslanec ve Francii hlásí, že prezidentství chce, abychom regulovali náš potravinářský sektor: některé z našich výrobků jsou podle něj nevhodné ke konzumaci, zejména maso vyrobené za použití růstových molekul zakázaných v EU. Pokud nevyhovíme, hrozí protekcionistická opatření proti našemu zboží a tlak na zbytek Unie, aby se přidal, přestože vlastní francouzský potravinářský průmysl má zjevný zájem označovat naše vývozy za nekalou konkurenci. Regulace by umožnila našim lidem více těžit ze zemědělství, ale omezila by růst našeho potravinářského sektoru." # todo: NEW TRANSLATION
 france_md.251.a: "Mají pravdu; tyto regulace jsou nezbytné" # todo: NEW TRANSLATION
 france_md.251.b: "Do svého dobytka si dávám, co chci." # todo: NEW TRANSLATION
 france_md.252.t: "Francie navrhuje zavést celní bariéry proti Brazílii" # todo: NEW TRANSLATION
 france_md.252.d: "Náš francouzský partner nás vyzývá k zákazu brazilského dovozu kvůli sporu vyvolanému odmítnutím Brazílie uplatňovat evropská zdravotní omezení na svou zemědělskou a potravinářskou výrobu. Jihoamerické potraviny jsou tak levnější, ale mohou obsahovat výrobky nebezpečné pro naše občany. Evropský průmysl to označuje za nekalou konkurenci, finančníci za volný obchod. Je zřejmé, že stížnost podnítil vlastní francouzský potravinářský průmysl, ale zdravotní riziko pro naše obyvatele je přesto skutečné." # todo: NEW TRANSLATION
 france_md.252.a: "Mají pravdu; je to nekalá konkurence" # todo: NEW TRANSLATION
 france_md.252.b: "A co v tom všem volný obchod?" # todo: NEW TRANSLATION
 france_md.253.t: "Francouzské vměšování do naší obchodní politiky" # todo: NEW TRANSLATION
 france_md.253.d: "Náš velvyslanec ve Francii hlásí, že prezidentství chce, abychom regulovali náš zpracovatelský a těžební sektor: velká část naší produkce ignoruje evropské průmyslové normy, přesto zaplavuje jejich trh, a jejich průmysl označuje vznikající obchodní nerovnováhu za nekalou konkurenci. Evropu potřebujeme jako obchodního partnera a odmítnutí jejich norem by mohlo vést k dovozním omezením našeho zboží, která by nám uškodila mnohem více. Dodržování norem by nám umožnilo vyrábět odpovědněji pro naše lidi i planetu, ale omezilo by růst našeho průmyslového sektoru." # todo: NEW TRANSLATION
 france_md.253.a: "Nemůžeme přijít o evropské partnery" # todo: NEW TRANSLATION
 france_md.253.b: "Tyto levné výrobky potřebují a vědí to." # todo: NEW TRANSLATION
 france_md.254.t: "Francie navrhuje zavést celní bariéry proti Číně" # todo: NEW TRANSLATION
 france_md.254.d: "Náš francouzský partner nás vyzývá k zákazu čínského dovozu kvůli sporu vyvolanému odmítnutím Číny uplatňovat evropská průmyslová omezení na vlastní výrobu. Vyrobené zboží a suroviny jsou tak levnější, ale pravděpodobně vznikají za pochybných podmínek. Evropský průmysl to označuje za nekalou konkurenci, finančníci za volný obchod. Je zřejmé, že stížnost podnítil vlastní francouzský průmyslový sektor, ale škody, které tyto výrobky působí planetě a našemu průmyslu, jsou přesto skutečné." # todo: NEW TRANSLATION
 france_md.254.a: "Mají pravdu; je to nekalá konkurence" # todo: NEW TRANSLATION
 france_md.254.b: "A co v tom všem volný obchod?" # todo: NEW TRANSLATION
 france_md.255.t: "Francouzské vměšování do naší obchodní politiky" # todo: NEW TRANSLATION
 france_md.255.d: "Náš velvyslanec ve Francii hlásí, že prezidentství chce, abychom regulovali těžbu a rafinaci ropy: velká část naší produkce ignoruje evropské těžební a průmyslové normy, přesto zaplavuje jejich trh, a jejich průmysl označuje vznikající obchodní nerovnováhu za nekalou konkurenci. Evropu potřebujeme a odmítnutí jejich norem by mohlo vést k dovozním omezením našeho zboží, která by nám uškodila mnohem více. Dodržování norem by nám umožnilo vyrábět odpovědněji pro naše lidi i planetu, ale omezilo by růst našich ropných společností." # todo: NEW TRANSLATION
 france_md.255.a: "Nemůžeme přijít o evropské partnery" # todo: NEW TRANSLATION
 france_md.255.b: "Hodně štěstí s vytápěním v této zimě." # todo: NEW TRANSLATION
 france_md.256.t: "Francie navrhuje zavést celní bariéry proti Rusku" # todo: NEW TRANSLATION
 france_md.256.d: "Náš francouzský partner nás vyzývá k omezení dovozu ruských uhlovodíků kvůli sporu vyvolanému odmítáním Ruska uplatňovat evropské předpisy pro těžbu a rafinaci, které vyrábí paliva za podmínek zhoubných pro planetu. Některé evropské těžební sektory to označují za nekalou konkurenci a požadují menší závislost na cizích mocnostech, ale Rusko možná představuje menší hrozbu, než si myslíme, a jeho laxní normy udržují naše náklady na palivo nízké." # todo: NEW TRANSLATION
 france_md.256.a: "Mají pravdu; měli bychom omezit závislost na palivech" # todo: NEW TRANSLATION
 france_md.256.b: "A co v tom všem volný obchod?" # todo: NEW TRANSLATION
 france_md.257.t: "Francie navrhuje velký železniční plán" # todo: NEW TRANSLATION
 france_md.257.d: "Naši francouzští partneři se vracejí s novým projektem: přesunout evropskou nákladní dopravu z kamionů na železnici, což je myšlenka prosazovaná francouzskými ekology s cílem učinit přepravu zboží efektivnější a ekologičtější. Vyžadovalo by to účinnou a jednotnou železniční síť, kterou dnes nemáme; nesoulady, jako je odlišný rozchod kolejí ve Španělsku, stále zpomalují přeshraniční dopravu. Protože přeprava nákladu je pro Unii klíčová a síť by mohla usnadnit i pohyb lidí, stojí za to tento projekt prosazovat, i kdyby se ukázal být nákladným pro již prosperující silniční dopravu." # todo: NEW TRANSLATION
 france_md.257.a: "Počítejte s námi" # todo: NEW TRANSLATION
 france_md.257.b: "Já dávám přednost svému náklaďáku" # todo: NEW TRANSLATION
 france_md.258.t: "Vítězství komunistů ve Francii narušuje naši vnitřní politiku" # todo: NEW TRANSLATION
 france_md.258.d: "Vítězství Francouzské komunistické strany vyslalo Evropou šokovou vlnu: zakládající člen Unie vybudované v opozici vůči komunistickému bloku nyní vyzývá vlastní lid, aby se zapojil do boje, a oživuje obavy ze SSSR, o nichž si mnohé země myslely, že jsou dávno pohřbené. Aktivisté již začali tuto dynamiku přenášet do naší vlastní země. Měli bychom přijmout část jejich programu a zkrátit tak vlnu protestů, jako gesto našim pokrokovým silám, ale za cenu zpomalení hospodářského rozvoje, nebo zaujmout jasné stanovisko dříve, než se situace bez nás posune dál?" # todo: NEW TRANSLATION
 france_md.258.a: "Není to zase tak špatný nápad" # todo: NEW TRANSLATION
 france_md.258.b: "Raději mrtvý než rudý" # todo: NEW TRANSLATION
 france_md.259.t: "Komunistická Francie nám podává pomocnou ruku" # todo: NEW TRANSLATION
 france_md.259.d: "Od svého vzniku náš stát nepřestal být pod nadvládou Ruska nebo se ho obávat. Tentokrát však zřejmě přichází pomoc. Francouzští diplomaté nám navrhli strategické partnerství, které by nás připravilo na možnost konfliktu s Ruskem. Zatím nejde o mnoho: několik dokumentů, určité vybavení, ale především příslib budoucí podpory. Nejpřekvapivější je, že tato podpora přichází od komunistické Francie. To nepochybně připomíná útlak, který jsme trpěli ze strany Sovětů v době, kdy byla PCF stalinistická. Můžeme Francii a Evropě důvěřovat, když to pouze posílí ruský postoj vůči nám?" # todo: NEW TRANSLATION
 france_md.259.a: "Toto partnerství je naší záchranou" # todo: NEW TRANSLATION
 france_md.259.b: "Dokážeme se o sebe postarat sami" # todo: NEW TRANSLATION
 france_md.260.t: "Francie nabízí pomoc proti Rusku" # todo: NEW TRANSLATION
 france_md.260.desc: "Několik desetiletí bez sovětského útlaku nezastavilo obavy z návratu Ruska, ale Francie nabídla pomoc v případě konfliktu a sdílí naše obavy, že by se ruský expanzionismus mohl znovu obrátit k východní Evropě. Její návrhy sahají od půjček vybavení po výměny zkušeností, což by nám mohlo dát šanci bojovat ještě před mobilizací NATO, ovšem pouze pokud nám NATO a Evropa skutečně přijdou na pomoc. Přijetí by poškodilo vztahy s Moskvou; možná je jejich zachování bezpečnější cestou." # todo: NEW TRANSLATION
 france_md.260.a: "Potřebujeme jen vybavení, abychom Rusy udrželi v odstupu" # todo: NEW TRANSLATION
 france_md.260.b: "Potřebujeme výcvik pro vedení vysoce intenzivní války" # todo: NEW TRANSLATION
 france_md.260.c: "Z dlouhodobého hlediska budeme muset vyrábět více zbraní" # todo: NEW TRANSLATION
 france_md.260.d: "Pomoc nepotřebujeme, Rusko není náš nepřítel" # todo: NEW TRANSLATION
 FRA_russian_aid_accept_tt: "§YFrancouzský vliv§! vzroste v každé zemi, která přijme balíček pomoci." # todo: NEW TRANSLATION
 FRA_russian_aid_reject_tt: "§YFrancouzský vliv§! klesne v každé zemi, která nabídku odmítne." # todo: NEW TRANSLATION
 france_md.261.t: "Francie navrhuje formalizovat naše spojenectví" # todo: NEW TRANSLATION
 france_md.261.desc: "Triumf kdysi stalinistické strany ve Francii otevírá otázku vztahů s potenciálním spojencem v západní Evropě, který vyjádřil nepřátelství vůči Západu i Američanům a ideologickou blízkost ke starému SSSR, jehož odkaz dokonce označuje za pozitivní. Paříž množí prohlášení odsuzující americký imperialismus a evropskou slepotu při jeho následování a nyní navrhuje spolupráci, která by mohla sahat od obchodu až po úplné vojenské a strategické partnerství, pokud usoudíme, že jejich bývalá sovětská oddanost je dostatečným důvodem k důvěře." # todo: NEW TRANSLATION
 france_md.261.a: "Vždy je potěšením s vámi obchodovat" # todo: NEW TRANSLATION
 france_md.261.b: "Skutečně, musíme se chránit před americkým imperialismem" # todo: NEW TRANSLATION
 france_md.261.c: "Nic nerozdělí komunistické bratrství" # todo: NEW TRANSLATION
 france_md.261.d: "S komunisty nespolupracujeme" # todo: NEW TRANSLATION
 france_md.262.t: "Rusko souhlasí s rozšířením obchodních vztahů s námi" # todo: NEW TRANSLATION
 france_md.262.d: "Rusko kladně odpovědělo na náš návrh na rozšíření vztahů. Nabídlo nám sdílení svých průmyslových a těžebních znalostí pod podmínkou, že mu pomůžeme vybudovat jaderný a terciární sektor. Jde o významný pokrok v našich vztazích s Ruskem. Naše návrhy potenciálního strategického partnerství však byly odloženy stranou. Je pravděpodobné, že nám Rusko zatím nepřiznává dostatečnou důvěryhodnost, ale tento první krok naším směrem je dobrou zprávou. Bude to trvat, ale tato dohoda je začátkem konce imperialistů." # todo: NEW TRANSLATION
 france_md.262.a: "Důvěra se vždy buduje dlouhodobě" # todo: NEW TRANSLATION
 france_md.263.t: "Rusko souhlasí s vytvořením vojenského a obchodního partnerství s námi" # todo: NEW TRANSLATION
 france_md.263.d: "Rusko kladně odpovědělo na náš návrh na rozšíření vztahů. Nabídlo nám sdílení svých průmyslových a těžebních znalostí pod podmínkou, že mu pomůžeme vybudovat jaderný a terciární sektor. Jde o významný pokrok v našich vztazích s Ruskem. Rusko navíc navrhlo rozšířit toto partnerství o vojenskou složku, která by nás společně připravila na chvíli, kdy imperialistická hrozba přejde k činům. Poskytne nám cvičiště a své zkušenosti z tundry, zatímco my mu zpřístupníme své zkušenosti s bojem v poušti a džungli." # todo: NEW TRANSLATION
 france_md.263.a: "Společně jsme nezastavitelní" # todo: NEW TRANSLATION
 france_md.264.t: "Rusko navrhuje spojenectví" # todo: NEW TRANSLATION
 france_md.264.d: "Tak pozitivní odpověď našeho ruského partnera jsme nečekali. Navrhli, abychom vytvořili spojenectví proti západnímu imperialismu. Toto spojenectví, spojující hospodářské a geopolitické prvky, nám umožní ekonomicky, vojensky a diplomaticky se připravit na střet se Západem. Budeme si vyměňovat znalosti a průmyslové tradice, stejně jako cvičiště, a poskytneme si záruku vzájemné pomoci v případě konfliktu. Od první světové války jsme s nimi takové spojenectví neuzavřeli; možná je to špatné znamení. Toto spojenectví je však více než vítané a umožní nám přežít ve světě z velké části nepřátelském komunismu." # todo: NEW TRANSLATION
 france_md.264.a: "Západní imperialismus bude proti nám bezmocný" # todo: NEW TRANSLATION
 france_md.265.t: "Rusko odmítá rozšířit vztahy s námi" # todo: NEW TRANSLATION
 france_md.265.d: "K velkému překvapení našich diplomatů se zdá, že Rusko odmítá jakoukoli formu spolupráce s Francouzskou republikou. Rozdílné zájmy. Nedostatek důvěry. Zdá se, že vzpomínka na SSSR je jim vzdálená. Možná západní korupce konečně dosáhla Ruska, kdysi bašty proti americkému imperialismu. Jedno je jisté: jsme sami, sami v Evropě, která nám nerozumí a vždy bude vůči nám nepřátelská." # todo: NEW TRANSLATION
 france_md.265.a: "My jsme praví komunisté!" # todo: NEW TRANSLATION
 france_md.266.t: "Francie se střetává s EU kvůli imigraci" # todo: NEW TRANSLATION
 france_md.266.d: "Naši kolegové z Národní fronty již několik měsíců vedou Francii a od svého nástupu do úřadu nepřetržitě kritizují evropskou migrační politiku jako příliš shovívavou. Liberální a socialistické síly v Unii dlouho umlčovaly náš hlas, ale nyní, když naši spojenci zvítězili v Paříži, nás již nemohou ignorovat. Naši vlastní lidé, kteří sami přijali nacionalistické ideály, vítají toto vítězství jako důkaz, že náš hlas měl od začátku pravdu v Evropě, která ztratila směr." # todo: NEW TRANSLATION
 france_md.266.a: "Je to začátek konce liberálů" # todo: NEW TRANSLATION
 france_md.267.t: "Francie se střetává s EU kvůli imigraci" # todo: NEW TRANSLATION
 france_md.267.d: "Od vítězství Národní fronty ve Francii proudí do Evropského parlamentu kritika a tento posun zřejmě spustil vlnu v evropské politice, protože nacionalistické a euroskeptické strany dosahují stále lepších výsledků. Debata se soustředí na imigraci a poslanci stále více odrážejí veřejné mínění, které se obrací k nacionalistické vizi vnitřní politiky a odsuzuje podle něj příliš shovívavou politiku. Ani naši voliči nejsou výjimkou a otřesy způsobené Francií začínají otřásat i jimi. Měli bychom tomuto nacionalistickému odklonu vzdorovat, nebo přijmout novou evropskou orientaci, která se formuje?" # todo: NEW TRANSLATION
 france_md.267.a: "Mají však pravdu" # todo: NEW TRANSLATION
 france_md.267.b: "Evropa již za nacionalismus zaplatila" # todo: NEW TRANSLATION
 france_md.268.t: "Francie vítězí se svým případem v Bruselu" # todo: NEW TRANSLATION
 france_md.268.d: "Francouzská politická linie nabrala nový směr: navzdory historickému euroskepticismu uzavřela strana dohodu s Evropskou unií. Pomocí euroskeptických kampaní doma i mezi spojenci přesvědčila Brusel o nebezpečí, které představuje, a nyní tento vliv využívá k tomu, aby přinutila EU deportovat nelegální migranty. Pro její prezidentství jde o skutečný úspěch. Naše vlastní nacionalistická vláda čelí stejné otázce suverenity: měli bychom usilovat o výhody EU výměnou za zmírnění našeho euroskepticismu, když víme, že velká část naší strany považuje tento postoj za základní hodnotu?" # todo: NEW TRANSLATION
 france_md.268.a: "Proč vyjednávat, když můžeme Evropu jednoduše opustit." # todo: NEW TRANSLATION
 france_md.268.b: "To je chytré, měli bychom udělat totéž" # todo: NEW TRANSLATION
 france_md.269.t: "Francie prosazuje evropskou identitu" # todo: NEW TRANSLATION
 france_md.269.d: "Po získání ústupků v oblasti migrace od Bruselu se zdá, že francouzské vedení nyní zcela opouští svou euroskeptickou rétoriku a dokonce podporuje příslušnost k Evropské unii, pokud se bude nadále vzdalovat liberálním a socialistickým tendencím. Nacionalistická hnutí se v samotné Unii zřejmě množí, takže Evropa národů je znovu přitažlivá, i když by takový posun mohl zneklidnit voliče oddané přímému odmítnutí EU. Měli bychom následovat Francii, zvláště pokud se vedení EU bude nadále ubírat naším směrem?" # todo: NEW TRANSLATION
 france_md.269.a: "To je velmi dobrá iniciativa" # todo: NEW TRANSLATION
 france_md.269.b: "Nelze být zároveň nacionalistou a Evropanem" # todo: NEW TRANSLATION
 france_md.270.t: "Francie navrhuje investovat do naší obrany" # todo: NEW TRANSLATION
 france_md.270.d: "V posledních letech se možnost nové války na evropském kontinentu zdá pravděpodobnější než kdy dříve. Ačkoli naše Unie zatím neutrpěla žádnou agresi, znepokojivé kroky našeho ruského souseda tyto obavy potvrzují. Francie za námi přišla s nabídkou: navrhuje pomoci nám vybudovat vojensko-průmyslový komplex prostřednictvím investic. Díky těmto zbrojním továrnám bychom se mohli účinně připravit na den, kdy budeme muset bojovat za svou zemi a evropské partnery. Umožnit jim investovat do našeho zbrojení by nás však učinilo závislejšími na Francii, což nemusí být dobrý nápad. Naše pacifistické obyvatelstvo by navíc mohlo mít z takové mobilizace kapitálu obavy." # todo: NEW TRANSLATION
 france_md.270.a: "Děkujeme za tuto zásadní pomoc" # todo: NEW TRANSLATION
 france_md.270.b: "Není důvod k obavám" # todo: NEW TRANSLATION
 france_md.271.t: "Francie uznává naše nároky na Ukrajině" # todo: NEW TRANSLATION
 france_md.271.d: "Od chvíle, kdy se ve Francii dostala k moci Národní fronta, je nám stále nakloněnější a rozchází se s Evropou, která vždy odmítala naše ambice na východě. Nejenže vystupuje ve prospěch našich nároků na ukrajinská území, ale nabídla nám přístup ke svému území a přístavům pro přesun vojsk a zboží, čímž usnadňuje naši logistiku a otupuje jakékoli budoucí evropské embargo. Tento nový spojenec nás utvrzuje na cestě k válce, kterou bychom mohli podniknout." # todo: NEW TRANSLATION
 france_md.271.a: "První domino padá" # todo: NEW TRANSLATION
 france_md.271.b: "Nemáme v úmyslu bojovat proti našim ukrajinským bratřím" # todo: NEW TRANSLATION
 france_md.272.t: "Francie navrhuje rozšířit naši spolupráci" # todo: NEW TRANSLATION
 france_md.272.desc: "Po mnoha prohlášeních a dohodách v náš prospěch se zdá, že Francie je připravena rozšířit vztahy s námi. Představuje se jako obránce morálky a víry v Evropě a na Západě, které nyní považuje za dekadentní. Naše vztahy by mohly postoupit od obchodu k úplnému vojenskému a strategickému partnerství, pokud v tomto novém spojenci spatříme dostatečný potenciál, nebo můžeme nabídku odmítnout, pokud stále spoléháme na dobré vztahy s Evropskou unií v její současné podobě." # todo: NEW TRANSLATION
 france_md.272.a: "Naše ekonomika z toho bude těžit" # todo: NEW TRANSLATION
 france_md.272.b: "Naše ekonomika a naše armády z toho budou těžit" # todo: NEW TRANSLATION
 france_md.272.c: "Svět se před námi zachvěje" # todo: NEW TRANSLATION
 france_md.272.d: "Nemáme v úmyslu spolupracovat s Francií" # todo: NEW TRANSLATION
 france_md.273.t: "Rusko souhlasí s rozšířením obchodních vztahů s námi" # todo: NEW TRANSLATION
 france_md.273.d: "Rusko kladně odpovědělo na náš návrh na rozšíření vztahů. Nabídlo nám sdílení svých průmyslových a těžebních znalostí pod podmínkou, že mu pomůžeme vybudovat jaderný a terciární sektor. Jde o významný pokrok v našich vztazích s Ruskem. Naše návrhy potenciálního strategického partnerství však byly odloženy stranou. Je pravděpodobné, že nám Rusko zatím nepřiznává dostatečnou důvěryhodnost, ale tento první krok naším směrem je dobrou zprávou. Bude to trvat, ale tato dohoda je začátkem konce ultraglobalistů." # todo: NEW TRANSLATION
 france_md.273.a: "Důvěra se vždy buduje dlouhodobě" # todo: NEW TRANSLATION
 france_md.274.t: "Rusko souhlasí s vytvořením vojenského a obchodního partnerství s námi" # todo: NEW TRANSLATION
 france_md.274.d: "Rusko kladně odpovědělo na náš návrh na rozšíření vztahů. Nabídlo nám sdílení svých průmyslových a těžebních znalostí pod podmínkou, že mu pomůžeme vybudovat jaderný a terciární sektor. Jde o významný pokrok v našich vztazích s Ruskem. Rusko navíc navrhlo rozšířit toto partnerství o vojenskou složku, která by nás společně připravila na chvíli, kdy ultraglobalistická hrozba přejde k činům. Poskytne nám cvičiště a své zkušenosti z tundry, zatímco my mu zpřístupníme své zkušenosti s bojem v poušti a džungli." # todo: NEW TRANSLATION
 france_md.274.a: "Společně jsme nezastavitelní" # todo: NEW TRANSLATION
 france_md.275.t: "Rusko navrhuje spojenectví" # todo: NEW TRANSLATION
 france_md.275.d: "Tak pozitivní odpověď našeho ruského partnera jsme nečekali. Navrhli, abychom vytvořili spojenectví zaručující vzájemnou pomoc v případě agrese cizích mocností. Toto spojenectví, spojující hospodářské a geopolitické prvky, nám umožní ekonomicky, vojensky a diplomaticky se připravit na střet se zbytkem světa. Poskytne nám sílu bojovat až do konce a bránit se ultraglobalismu, do něhož naši sousedé zabředli. Od první světové války jsme s nimi takové spojenectví neuzavřeli; možná je to špatné znamení. Toto spojenectví je však více než vítané a představuje velký úspěch naší politiky." # todo: NEW TRANSLATION
 france_md.275.a: "Jsme chráněni před liberální dekadencí" # todo: NEW TRANSLATION
 france_md.276.t: "Rusko odmítá rozšířit vztahy s námi" # todo: NEW TRANSLATION
 france_md.276.d: "K velkému překvapení našich diplomatů se zdá, že Rusko odmítá jakoukoli formu spolupráce s Francouzskou republikou. Rozdílné zájmy. Nedostatek důvěry. Možná západní korupce konečně dosáhla Ruska, kdysi silného a hrdého. Tento obrat však není tragický; možná jsme toho nakonec neměli tolik společného. Na kontinentu jistě najdeme jiné nacionalistické spojence." # todo: NEW TRANSLATION
 france_md.276.a: "To je škoda" # todo: NEW TRANSLATION
 france_md.277.t: "Francie nás navrhuje chránit před ruským vlivem" # todo: NEW TRANSLATION
 france_md.277.d: "Zdá se, že Rusové již několik let investují na africkém kontinentu a nabízejí své služby v boji proti džihádistickým a separatistickým povstáním, která kvetou v zemích bývalé francouzské Afriky. Francie a Rusko na tomto kontinentu zjevně soupeří o vliv. Střetávají se zde hodnoty: západní liberalismus a autoritářství. V této situaci, kdy jsme africké země terčem ruského vlivu, který někdy zhoršuje napětí mezi regionálními menšinami, nám Francie nabízí pomoc s omezením jejich přítomnosti. Znamenalo by to však sblížení s našimi bývalými kolonizátory, což nemusí být dobrý nápad. Jak se rozhodneme?" # todo: NEW TRANSLATION
 france_md.277.a: "Mají pravdu; ruský vliv je nebezpečný" # todo: NEW TRANSLATION
 france_md.277.b: "Naši bývalí kolonizátoři? V žádném případě" # todo: NEW TRANSLATION
 france_md.278.t: "Francouzská komuna opouští Evropskou unii" # todo: NEW TRANSLATION
 france_md.278.d: "Před několika měsíci Francie oznámila konec republiky ve prospěch Francouzské komuny, nového útvaru založeného na revolučním komunismu, a netrvalo dlouho, než opustila naši Evropskou unii, vybudovanou na ekonomickém liberalismu, který její nové směřování odmítá. Odchod byl okamžitý a konečný, bez zjevného úmyslu vyjednávat. To je špatné znamení pro kontinent, jehož Unie měla především bránit novým konfliktům; náhlý odchod spojený s tak revoluční ideologií bude dříve či později nutné řešit." # todo: NEW TRANSLATION
 france_md.278.a: "To se dalo očekávat" # todo: NEW TRANSLATION
 france_md.279.t: "Francouzská komuna tlačí na naši politiku" # todo: NEW TRANSLATION
 france_md.279.d: "Jak se dalo předvídat, odchod Francouzské komuny z Evropské unie nebyl slepou uličkou; sotva se osvobodili, již oživují svou ekonomiku a jejich úspěch začíná získávat obdiv těch doma, kteří příliš nemilují liberální evropské hodnoty. Francouzská rozvědka, přetvořená v mezinárodní propagandistickou službu, pomáhá tyto agitátory školit a my bychom to měli brát vážně, než skončíme v jejich postavení. Můžeme hájit evropské hodnoty a mír, který přinášejí, nebo sami přijmout jejich program a otupit přicházející násilí, což by však znamenalo přijmout komunistickou, protievropskou politiku." # todo: NEW TRANSLATION
 france_md.279.a: "Nemá smysl bojovat, když je můžeme porazit jejich vlastní hrou" # todo: NEW TRANSLATION
 france_md.279.b: "Musíme proti těmto extremistům bojovat" # todo: NEW TRANSLATION
 france_md.280.t: "Francouzská komuna nás zve na summit o světové revoluci" # todo: NEW TRANSLATION
 france_md.280.d: "Poté, co si doma zajistili moc, hodlají francouzští revoluční komunisté nyní vyvézt svou revoluci a zvou nás na summit o světové revoluci, protože naše vlastní vláda se již přiklonila ke komunistickým hodnotám, kterých si nová Francouzská komuna cení. Jsou odhodláni tyto hodnoty šířit po celém světě a tato pozvánka je jistě zkouškou, zda je budeme následovat. Taková revoluce se neobejde bez války, pravděpodobně krvavé, vzhledem k tomu, kolik velmocí ji nikdy nepřijme. Komunistické ideály jsou nám drahé, jsme však připraveni riskovat životy našich občanů, abychom jich dosáhli?" # todo: NEW TRANSLATION
 france_md.280.a: "Počítejte s námi, ať žije revoluce" # todo: NEW TRANSLATION
 france_md.280.b: "Dějiny dokázaly, že svobodu nelze přinést na hrotu zbraně" # todo: NEW TRANSLATION
 france_md.281.t: "Císař provádí hluboké reformy francouzských ozbrojených sil" # todo: NEW TRANSLATION
 france_md.281.d: "Náš císař zahájil hluboké reformy ozbrojených sil s cílem učinit je přizpůsobivějšími válkám, které možná budeme muset vést. Jejich provedení vyžaduje značné investice a naši plnou pozornost, takže budeme po určitou dobu méně připraveni na okamžité nasazení a zranitelnější, než budeme moci znovu budovat naše síly. První vlna se zaměřuje na samotné vedení armády, které se ukázalo jako nezpůsobilé pro nadcházející reformy, a na přepracování velitelského řetězce. To by mělo trvat o něco méně než rok, během něhož musíme omezit vojenské operace kvůli dlouhodobému zisku." # todo: NEW TRANSLATION
 france_md.281.a: "Tyto reformy jsou nezbytné" # todo: NEW TRANSLATION
 france_md.282.t: "Reforma našeho generálního štábu je dokončena" # todo: NEW TRANSLATION
 france_md.282.d: "Naše reformy byly dokončeny rekordně rychle. Někteří se bránili, ale většina generálního štábu přepracování velitelského řetězce přijala. Kromě zefektivnění vedení tyto reformy otevírají cestu talentovaným novým generálům za cenu pokročilejšího výcviku a jsou pouze prvním krokem k přeměně našich ozbrojených sil. V nadcházejících měsících další reformy určí prostředky a cíle našich sil a poskytnou našemu vojensko-průmyslovému komplexu jasnější objednávky. Byl to dlouhodobý risk a zdá se, že jsme jej vyhráli." # todo: NEW TRANSLATION
 france_md.282.a: "Vytrvali jsme. Nyní se můžeme věnovat důležitějším věcem" # todo: NEW TRANSLATION
 france_md.283.t: "Páteř naší armády" # todo: NEW TRANSLATION
 france_md.283.d: "Dorazila první sada reforem týkajících se našeho přístupu k bojišti a určuje strategii, kterou bychom měli použít v jakémkoli rozsáhlém konfliktu s budoucím protivníkem. Od přepracování po druhé světové válce naše armády vždy upřednostňovaly útočné strategie založené na pohybu a manévru. Mohli bychom je prohloubit tím, že naši doktrínu a objednávky vybavení zaměříme na útočné tanky a rychlé obsazování cílů. Alternativou je soustředit se na pěchotu, posílit její úlohu a vybavení tak, aby na nepřátelské protiútoky odpovídala převahou palebné síly. Je to bezpečnější přístup, který by však zpochybnil naši dosavadní doktrínu." # todo: NEW TRANSLATION
 france_md.283.a: "Pěchota vždy hrála ústřední roli; je to nejbezpečnější přístup" # todo: NEW TRANSLATION
 france_md.283.b: "Naše armáda je od studené války postavena na pohyblivé válce a není důvod to měnit" # todo: NEW TRANSLATION
 france_md.284.t: "Naše palebná síla" # todo: NEW TRANSLATION
 france_md.284.d: "Dorazila poslední vlna doktrinální reformy a nutí nás rozhodnout, jak bude naše armáda ničit nepřátelské síly na dálku. Dlouho jsme vyvažovali dělostřelectvo a letectvo, ale další cesta vyžaduje specializaci. Naše děla Caesar jsou pohyblivá a účinná a umožňují nám bombardovat nepřátelské jednotky z bezpečí. Naše letectvo a vrtulníky nabízejí všestrannou palebnou sílu, ale zůstávají zranitelné vůči nepřátelské protivzdušné obraně a ztráta kontroly nad oblohou by mohla být katastrofální. Musíme si vybrat mezi minimálním rizikem a větší palebnou silou." # todo: NEW TRANSLATION
 france_md.284.a: "Dělostřelectvo je nákladově efektivnější" # todo: NEW TRANSLATION
 france_md.284.b: "Naše letectvo je velmi účinné; bylo by pošetilé ho nevyužít" # todo: NEW TRANSLATION
 france_md.285.t: "Naše pozice vůči Evropské unii" # todo: NEW TRANSLATION
 france_md.285.d: "Příliš dlouho náš národ upřednostňoval Evropskou unii před vlastním rozvojem. Odložení našeho rozvoje a bezpečnosti nás přivedlo k bezprecedentní demokratické krizi, z níž jsme přesto vyšli vítězně. Dnes však máme možnost tento trend zvrátit. Osvobozeni od minulých demokratických institucí můžeme svobodně volit vlastní cestu a podle přání Evropskou unii opustit. Okamžitý odchod by však mohl zasadit těžkou ránu našemu národu, který se teprve vzpamatovává z liberálního útlaku. Měli bychom s Evropskou unií vyjednávat a zpeněžit náš návrat mezi její členy, nebo bychom měli náš rozchod zpečetit dokončením odchodu z Evropské unie?" # todo: NEW TRANSLATION
 france_md.285.a: "Vyprázdněte bruselské kapsy, nebo odcházíme!" # todo: NEW TRANSLATION
 france_md.285.b: "Evropská unie nám již dost uškodila. Frexit!" # todo: NEW TRANSLATION
 france_md.286.t: "Francie opouští Evropskou unii" # todo: NEW TRANSLATION
 france_md.286.d: "Po velkém otřesu v našem francouzském partnerském státě se nacionalistická hnutí hlásící se k bonapartismu zmocnila kontroly nad Francií. Okamžitě začala ničit zbytky proevropských nálad ve Francii. Nyní oznamují odchod Francie z Evropské unie. Kategoricky odmítly vyjednávat. Vítězství těchto nacionalistických hnutí není jen trhlinou v evropském projektu, ale také vzorem pro euroskeptiky napříč Unií." # todo: NEW TRANSLATION
 france_md.286.a: "Nacionalismus je nebezpečím pro naši Evropskou unii" # todo: NEW TRANSLATION
 france_md.287.t: "Evropská unie ustupuje našim požadavkům" # todo: NEW TRANSLATION
 france_md.287.d: "Zdá se, že jsme se při vyjednávání o návratu do evropských institucí rozhodli správně. Nejenže jsme se vyhnuli hospodářské krizi, ale také jsme z Evropské centrální banky získali finanční prostředky. Tomu se říká úspěšná finanční operace! Nepochybně se nakonec setkáme s našimi partnery na bojišti, ale ať zatím spí v bludu. Jedno je jisté: naši protivníci musí zuřit, že naše jednání s ECB uspěla." # todo: NEW TRANSLATION
 france_md.287.a: "Náš čas přijde" # todo: NEW TRANSLATION
 france_md.288.t: "Naše vyjednávání selhala" # todo: NEW TRANSLATION
 france_md.288.d: "Náš pokus byl odvážný, ale neúspěšný. Možná jsme požadovali příliš mnoho nebo nedokázali vzbudit důvěru našich evropských protějšků. V každém případě ECB odmítla zaplatit nám za setrvání. Je to její rozhodnutí, které neslouží našim zájmům, ale taková je realita. Nyní se musíme rozhodnout, zda v Evropské unii zůstaneme. Odchod by byl ekonomicky nákladný, ale setrvání by před Unií potvrdilo naše selhání. Nakonec se s nimi na bojišti střetneme tak či tak, s členstvím v EU nebo bez něj. Jedinou otázkou je, zda peněžní náklady odchodu převáží morální náklady setrvání." # todo: NEW TRANSLATION
 france_md.288.a: "Odchod z Unie by nás stál příliš mnoho; zatím si ho nemůžeme dovolit" # todo: NEW TRANSLATION
 france_md.288.b: "Už zde nemáme co dělat" # todo: NEW TRANSLATION
 france_md.289.t: "Francie uzavírá dohodu s Evropskou unií" # todo: NEW TRANSLATION
 france_md.289.d: "Po měsících diplomatického tlaku a hrozeb odchodem se bonapartistická Francie podřídila Evropské unii a zpeněžila své členství výměnou za další výhody, aby zůstala. Tato dohoda je pro nás i naše partnery katastrofální: nyní, když ji ovládají nacionalisté posedlí pomstou, neexistuje žádná záruka, že se Francie bude chovat rozumně. Francie zůstává nezbytným členem, dnes však představuje nebezpečí pro celý kontinent a naši lidé musí platit cenu za rozmary jejího partnera." # todo: NEW TRANSLATION
 france_md.289.a: "Byl to opravdu dobrý nápad?" # todo: NEW TRANSLATION
 france_md.290.t: "Úsvit nové říše" # todo: NEW TRANSLATION
 france_md.290.d: "Po měsících vnitřních nepokojů a ústavních reforem jsme uspěli. Úspěšně jsme odstranili instituce a moc hanebné republiky. Nyní se Francie musí stát tím, čím nikdy neměla přestat být: říší! Na oslavu návratu říše jsme připravili velkolepé oslavy vysílané po celé Francii. Díky této události naši lidé pochopí naši sílu a odhodlání obnovit Francii její někdejší slávu. Oslava vyšle našim protivníkům jasný vzkaz: demonstraci moci. Nyní nás nemohou ignorovat; jejich dny se krátí, než si Francie přijde pro to, co jí náleží. Tentokrát nás žádná koalice nezastaví!" # todo: NEW TRANSLATION
 france_md.290.a: "Říše znovu získá svou někdejší velikost!" # todo: NEW TRANSLATION
 france_md.291.t: "Francie vyzývá ke svazu nacionalismů" # todo: NEW TRANSLATION
 france_md.291.d: "Vítězství našich nacionalistických soudruhů ve Francii otřáslo Evropou a Bonapartové obrátili svou zahraniční politiku proti Evropské unii, jejím hodnotám a budoucnosti. Nyní nám podali ruku v domnění, že naše vláda sdílí dost jejich povahy, aby se spojila s Francií. Tiché spojenectví s Francií se zdá přitažlivé, ale nic nezaručuje, že se proti nám později neobrátí. Musíme pečlivě zvážit důsledky." # todo: NEW TRANSLATION
 france_md.291.a: "Jdou správnou cestou; udělali bychom dobře, kdybychom se přidali" # todo: NEW TRANSLATION
 france_md.291.b: "Tuto vizi nacionalismu nesdílíme" # todo: NEW TRANSLATION
 france_md.292.t: "Bonapartistická Francie tlačí na naši politiku" # todo: NEW TRANSLATION
 france_md.292.d: "Jak jsme předpokládali, francouzská nacionalistická a protievropská rétorika nebyla náhodná: od převzetí moci Bonaparty se Evropská unie stala terčem nacionalistů všude. Část našeho obyvatelstva se nyní obává návratu války, zatímco jiní se přidali k nacionalistické věci a podnikají destabilizační akce proti naší vládě, široce podporované a školené francouzskou rozvědkou, která působí jako mezinárodní propagandistický aparát. Musíme to brát s nejvyšší vážností, protože jejich cílem je nás rozdělit. Evropská unie musí zůstat jednotná!" # todo: NEW TRANSLATION
 france_md.292.a: "Evropa nakonec nacionalismus porazí" # todo: NEW TRANSLATION
 france_md.293.t: "Obklopeni nepřáteli" # todo: NEW TRANSLATION
 france_md.293.d: "Stejně jako v dobách revolučních válek se zdá, že nezbytné změny v našem národě plodí odpor. Zatímco obnovujeme zemi, naši nepřátelé již proti nám kují pikle a připravují se na střet. Mají důvod k opatrnosti, protože jsme připraveni v případě potřeby silou získat zpět naše území. V každém případě stojíme izolováni proti Evropě, která nás právem považuje za hrozbu. Prozatím se musíme především připravit na roky konfliktu s našimi protivníky. Možná se nám podaří vytvořit spojenectví, ale především se musíme spolehnout sami na sebe. Jedno je však jisté: jakmile porazíme evropskou a atlantickou hrozbu, budeme nezastavitelní." # todo: NEW TRANSLATION
 france_md.293.a: "Kolik koalic Napoleon porazil? Uděláme s nimi krátký proces" # todo: NEW TRANSLATION
 france_md.294.t: "Francie navrhuje, abychom se přidali k její alianci" # todo: NEW TRANSLATION
 france_md.294.d: "Právě jsme obdrželi návrh od francouzských diplomatů. Bonapartové, vědomi si své izolace v Evropě a obklíčení vlastními nepřáteli, se obrátili na nás, protože náš národ považují za dostatečně úctyhodný, aby si zasloužil spojenectví. Je samozřejmé, že nejde o pouhý obranný pakt a že připojení by nás rychle zapletlo do konfliktů, které nemusí být naše. Toto spojenectví by nám však mohlo pomoci při střetu s našimi vlastními protivníky a za stejných podmínek je lepší stát po jejich boku než proti nim. Spojenectví s Francií je lákavé, ale možná by připojení znamenalo přímou jízdenku do pekla, protože brzy přinesou válku do Evropy." # todo: NEW TRANSLATION
 france_md.294.a: "Z tohoto spojenectví můžeme těžit" # todo: NEW TRANSLATION
 france_md.294.b: "V žádném případě" # todo: NEW TRANSLATION
 france_md.295.t: "Francie navrhuje, abychom se přidali ke Kominterně" # todo: NEW TRANSLATION
 france_md.295.d: "Revoluční komunistické frakce vládnoucí Francii dostaly chuť ke konfliktu, usilují o světovou revoluci a získávají spojence, aby ji za každou cenu vyvezly do světa. Obrátily se na nás, zvláště protože i my jsme přijali socialismus, a nabídly nám šanci porazit kapitalismus a fašismus na bojišti. Nejde však o pouhý obranný pakt a připojení by nás rychle zatáhlo do konfliktů, které nemusí být naše." # todo: NEW TRANSLATION
 france_md.295.a: "Mají pravdu; je čas vyvézt revoluci" # todo: NEW TRANSLATION
 france_md.295.b: "V žádném případě" # todo: NEW TRANSLATION
 france_md.296.t: "Francouzi nás vyzývají k útoku" # todo: NEW TRANSLATION
 france_md.296.d: "Naše neúnavná nacionalistická propaganda fungovala až příliš dobře: veřejnost přesvědčená, že soupeřící mocnosti usilují o naše zničení, nyní očekává, že udeříme jako první. Milice se shromáždily na hranicích a jsou připraveny střetnout se s bezpečnostními složkami našich sousedů, zatímco veřejné mínění vře. Musíme být opatrní, abychom tyto mocnosti nepřiměli k předčasnému spojení proti nám." # todo: NEW TRANSLATION
 france_md.296.a: "Je čas vyrovnat účty" # todo: NEW TRANSLATION
 france_md.296.b: "Náš čas přijde" # todo: NEW TRANSLATION
 france_md.297.t: "Potyčky v tunelu pod Lamanšským průlivem" # todo: NEW TRANSLATION
 france_md.297.d: "Ultranacionalistické francouzské milice, povzbuzené svým novým bonapartistickým vůdcem, napadly naše občany a policisty v okolí tunelu pod Lamanšským průlivem. Přibližně dvacet lidí zabily a desítky zranily. Nebyli jsme sami: minulou noc tyto skupiny zaútočily na většinu francouzských sousedů, kteří sdílejí náš odpor k nové Napoleonově říši. Jsme zjevně jedním z hlavních cílů a střet s bonapartistickou Francií se nyní zdá nevyhnutelný." # todo: NEW TRANSLATION
 france_md.297.a: "Musíme francouzskou agresi omezit ochranou jejích potenciálních cílů" # todo: NEW TRANSLATION
 france_md.297.b: "Musíme se připravit na konflikt s nimi" # todo: NEW TRANSLATION
 france_md.298.t: "Potyčky na francouzských hranicích" # todo: NEW TRANSLATION
 france_md.298.d: "Ultranacionalistické francouzské milice, povzbuzené svým novým bonapartistickým vůdcem, napadly naše občany a policisty podél naší společné hranice. Přibližně patnáct lidí zabily a desítky zranily. Nebyli jsme sami: minulou noc tyto skupiny zaútočily na většinu francouzských sousedů, na všechny potenciální cíle bonapartistického expanzionismu. Jsme zjevně jedním z hlavních cílů a střet s novou Napoleonovou říší se nyní zdá nevyhnutelný." # todo: NEW TRANSLATION
 france_md.298.a: "Musíme francouzskou agresi omezit ochranou jejích potenciálních cílů" # todo: NEW TRANSLATION
 france_md.298.b: "Musíme se připravit na konflikt s nimi" # todo: NEW TRANSLATION
 france_md.298.c: "Není důvod k obavám" # todo: NEW TRANSLATION
 france_md.299.t: "[FROM.GetName] nás žádá o pomoc" # todo: NEW TRANSLATION
 france_md.299.d: "Tváří v tvář nové bezprostřední hrozbě ze strany Francie ostatní napadené národy neváhaly reagovat. Stejně jako mnozí další nás [FROM.GetName] žádá o pomoc při obraně proti možné invazi. Pravděpodobně budou napadeni dříve než my. Jsme však skutečně připraveni je chránit? Měli bychom obětovat měsíce příprav kvůli [FROM.GetName]? Tato krize převrátila naši zahraniční politiku a žádosti o pomoc přicházejí ze všech stran. Máme dvě možnosti: můžeme [FROM.GetName] pomoci a přidat je do našeho strategického partnerství, nebo je nechat čelit Napoleonovi samotné. Koneckonců může být výhodné nechat ho vyčerpat se proti protivníkovi, jako je [FROM.GetName]." # todo: NEW TRANSLATION
 france_md.299.a: "Musíme je chránit" # todo: NEW TRANSLATION
 france_md.299.b: "Proč umírat za [FROM.GetName]" # todo: NEW TRANSLATION
 france_md.300.t: "Francie navrhuje, abychom se přidali k její alianci" # todo: NEW TRANSLATION
 france_md.300.d: "Bonapartistický vůdce Francie si znepřátelil Evropu, prohlásil svou připravenost k válce za obnovení velikosti svého národa a nyní nám podává ruku. Francouzští diplomaté se odvolávají na historii a připomínají, jak Napoleon kdysi pomáhal polskému lidu proti slovanskému a německému útlaku, a navrhují tento pakt obnovit. Takové spojenectví by nás ochránilo před všudypřítomnou ruskou hrozbou, ale také by nás mohlo zatáhnout do nevyhratelných válek." # todo: NEW TRANSLATION
 france_md.300.a: "Budeme novými Dąbrowskými a Kniaziewiczi!" # todo: NEW TRANSLATION
 france_md.300.b: "Proč umírat za Paříž? Ptám se vás" # todo: NEW TRANSLATION
 france_md.301.t: "Francie navrhuje, abychom se přidali k její alianci" # todo: NEW TRANSLATION
 france_md.301.d: "Bonapartistický vůdce Francie si znepřátelil Evropu, prohlásil svou připravenost k válce za obnovení velikosti svého národa a nyní nám podává ruku. Francouzští diplomaté se odvolávají na původ našeho královského domu od Jeana Baptista Bernadotta, Napoleonova maršála, a navrhují spojit naše úsilí na památku našich předků. Takové spojenectví by nás ochránilo před všudypřítomnou ruskou hrozbou, ale také by nás mohlo zatáhnout do nevyhratelných válek." # todo: NEW TRANSLATION
 france_md.301.a: "Je čas vrátit se do služby" # todo: NEW TRANSLATION
 france_md.301.b: "Minulost je minulost" # todo: NEW TRANSLATION
 france_md.302.t: "USA: přítel, nebo nepřítel" # todo: NEW TRANSLATION
 france_md.302.desc: "Po odeslání návrhů spojenectví několika potenciálním spojencům, které v Evropě dokážeme najít, zůstává jedna otázka: jak bychom měli naložit se Spojenými státy? Během revoluce a za Napoleona jsme s nimi udržovali dobré vztahy a sdíleli společnou nenávist k Anglii. Časy se však změnily. Druhá světová válka a americké počínání v Evropě často odporovaly francouzským zájmům a zatímco vztahy vydržely až do našeho nástupu k moci, Washington nám nyní může zablokovat cestu k hegemonii." # todo: NEW TRANSLATION
 france_md.302.a: "Navrhnout jim vstup do naší aliance" # todo: NEW TRANSLATION
 france_md.302.b: "Jejich obchodní síla nám pomůže překonat mezinárodní sankce" # todo: NEW TRANSLATION
 france_md.302.c: "Připravit se na střet s nimi" # todo: NEW TRANSLATION
 france_md.302.d: "Zajištění Evropy zůstává naší prioritou" # todo: NEW TRANSLATION
 france_md.303.t: "Francie nám navrhuje spojenectví" # todo: NEW TRANSLATION
 france_md.303.d: "Bonapartistický vůdce Francie si znepřátelil Evropu a nyní navrhuje spojenectví pod podmínkou, že nebudeme zasahovat do jejich záležitostí. Francouzští diplomaté zdůrazňují, že Napoleon a revoluční Francie pro nás byli vždy zásadními spojenci. Francie se však zasvětila boji proti ostatním evropským mocnostem, z nichž mnohé jsou našimi vlastními spojenci, a Spojené království, náš historický spojenec a vzácný partner, prohlásila za hlavní cíl. Měli bychom se k Francii přidat a riskovat válku s Londýnem?" # todo: NEW TRANSLATION
 france_md.303.a: "Mohou s námi počítat" # todo: NEW TRANSLATION
 france_md.303.b: "Angličané jsou především naši spojenci" # todo: NEW TRANSLATION
 france_md.304.t: "Francie navrhuje rozšířit naše obchodní vztahy" # todo: NEW TRANSLATION
 france_md.304.d: "Bonapartistický vůdce Francie si znepřátelil Evropu a nyní navrhuje rozšíření našich obchodních vztahů, protože jeho ekonomika, izolovaná nepřátelstvím vůči bývalým partnerům, potřebuje naše odborné znalosti a průmyslovou sílu více než kdy dříve. Francouzští diplomaté zdůrazňují, že Napoleon a revoluční Francie pro nás byli vždy zásadními spojenci. Francie se však zasvětila boji proti ostatním evropským mocnostem, z nichž většina jsou našimi vlastními spojenci, a podpora jejího válečného úsilí prostřednictvím obchodu by mohla vyvolat jejich nesouhlas." # todo: NEW TRANSLATION
 france_md.304.a: "Více obchodu je vždy dobré" # todo: NEW TRANSLATION
 france_md.304.b: "Nebudeme jejich spolupachateli" # todo: NEW TRANSLATION
 france_md.305.t: "Francie opouští Evropskou unii" # todo: NEW TRANSLATION
 france_md.305.d: "Po velké krizi mezi našimi francouzskými partnery se nacionalistická hnutí volající po návratu absolutní monarchie zmocnila francouzského státu. Od té doby začala ničit zbytky proevropských nálad ve Francii. Nyní oznamují odchod Francie z Evropské unie. Kategoricky odmítli vyjednávat. Vítězství těchto nacionalistických hnutí není jen trhlinou v evropské jednotě, ale také vzorem pro všechny euroskeptiky v Unii." # todo: NEW TRANSLATION
 france_md.305.a: "Nacionalismus je hrozbou pro naši Evropskou unii" # todo: NEW TRANSLATION
 france_md.306.t: "Monarchisté vítězí ve Francii" # todo: NEW TRANSLATION
 france_md.306.d: "Vítězství našich monarchistických soudruhů ve Francii otřáslo celou Evropou: stačilo, aby pilíř Unie přijal nacionalismus, a Brusel zuří. Royalisté obrátili svou zahraniční politiku proti Evropské unii, jejím hodnotám a budoucnosti, stejně jako my monarchisté již dlouho čelíme Unii, která nás chtěla umlčet. Po celé Evropě se zdá, že francouzský příklad povzbuzuje odpor k evropské byrokracii. Naše vlastní země je již oddána monarchistické věci, takže francouzské vítězství je vítězstvím evropských nacionalistů všude." # todo: NEW TRANSLATION
 france_md.306.a: "Vítězství nacionalismu v Evropě" # todo: NEW TRANSLATION
 france_md.307.t: "Francouzské království tlačí na naši politiku" # todo: NEW TRANSLATION
 france_md.307.d: "Jak jsme předvídali, francouzská nacionalistická a protievropská rétorika nebyla náhodná: od vítězství monarchie se Evropská unie stala terčem nacionalistů všude a Francie projevila jasnou ochotu vést válku proti těm, které považuje za nepřátele. Část našeho obyvatelstva se nyní obává návratu války, zatímco jiní, již vlažní vůči Evropě, se přidali k nacionalistům a podnikají destabilizační akce proti naší vládě, podporované a školené francouzskými zpravodajskými službami přeměněnými v mezinárodní propagandistický aparát. Musíme to brát vážně: jejich cílem je nás rozdělit." # todo: NEW TRANSLATION
 france_md.307.a: "Evropa nakonec nacionalismus porazí" # todo: NEW TRANSLATION
 france_md.308.t: "Francie nás zve, abychom se přidali k její křížové výpravě" # todo: NEW TRANSLATION
 france_md.308.d: "Vítězství našich nacionalistických soudruhů ve Francii otřáslo celou Evropou. Francouzské království, které považuje Unii za svého protivníka, nyní prohlašuje, že ochrání křesťanskou víru v celé Evropě i ve světě. Odsuzuje západní demokracii jako zvrácenost, která odvrátila lid od náboženství, a volá po návratu církve k moci. Protože naše země má křesťanskou většinu, je tato výzva částečně určena nám: navrhují, abychom se spojili a obnovili křesťanství v jeho někdejší síle. Pozvání by nám mohlo přinést moc ve službě našemu Pánu, ale zaručuje návrat války do Evropy." # todo: NEW TRANSLATION
 france_md.308.a: "Přidáme se k jejich křížové výpravě" # todo: NEW TRANSLATION
 france_md.308.b: "Tuto vizi křesťanství nesdílíme" # todo: NEW TRANSLATION
 france_md.309.t: "Příprava desáté křížové výpravy" # todo: NEW TRANSLATION
 france_md.309.d: "Náš král již týdny projevuje neochvějné odhodlání získat zpět Svatou zemi, ačkoli v tomto regionu nemáme žádnou oporu. Naši libanonští partneři s námi udržují srdečné vztahy, ale jejich vláda je příliš nestabilní a ovlivněná Íránem, než aby nám pomohla. Významná maronitská křesťanská menšina v Libanonu z něj přesto činí ideální místo pro vylodění naší křížové výpravy. Mohli bychom připravit obojživelnou intervenci, která by posílila naše námořnictvo, ale označila nás za agresory proti nevinnému státu, nebo uplatnit politický tlak, což nese menší riziko, ale nezaručuje úspěch." # todo: NEW TRANSLATION
 france_md.309.a: "Nejprve bychom se jich měli zeptat (samozřejmě zdvořile)" # todo: NEW TRANSLATION
 france_md.309.b: "Kdo není s námi, je v každém případě proti nám" # todo: NEW TRANSLATION
 france_md.310.t: "Francouzské království ohrožuje naši nezávislost" # todo: NEW TRANSLATION
 france_md.310.d: "Francouzské království před několika měsíci oznámilo svůj záměr dobýt Svatou zemi a připravuje desátou křížovou výpravu směrem k Jeruzalému. K tomu potřebuje opěrný bod poblíž Jeruzaléma a silná maronitská menšina v naší zemi nás dostala do hledáčku. Francouzští agitátoři nyní pracují na podkopání naší legitimity a tlačí na Maronity, aby svrhli naši vládu. Francouzská kontrola by nás mohla ochránit před vměšováním Izraele a Hizballáhu, ale pravděpodobně by naši zemi rozervala bratrovražedná válka. Je to skutečně to, co chceme?" # todo: NEW TRANSLATION
 france_md.310.a: "Ochrání nás před našimi agresivními sousedy" # todo: NEW TRANSLATION
 france_md.310.b: "Přinesou jen další konflikt!" # todo: NEW TRANSLATION
 france_md.311.t: "Libanon se podřizuje našim požadavkům" # todo: NEW TRANSLATION
 france_md.311.d: "Dnešní ráno je velkým dnem. Po našem nátlaku libanonská vláda oznámila, že se podřídí požadavkům maronitských křesťanských demonstrantů. Bezprostředně poté byla jmenována vláda s maronitskou většinou a Libanon se ocitl pod naší ochranou. Rozhodli jsme se správně, když jsme dali přednost diplomacii; západní mocnosti nemají co namítat, protože jsme oslabili íránský vliv. Geopoliticky jsme manévrovali dobře. Zbývá jen připravit se na pozemní konflikt s těmi, kteří by se postavili mezi nás a Království nebeské." # todo: NEW TRANSLATION
 france_md.311.a: "Jeruzalém je na dosah" # todo: NEW TRANSLATION
 france_md.312.t: "Libanon nás odmítá" # todo: NEW TRANSLATION
 france_md.312.d: "Libanon dnes ráno veřejně oznámil, že odmítá podlehnout francouzskému tlaku na svou politiku. Naši agitátoři zřejmě neměli žádný účinek a maronitská podpora naší věci nebyla dostatečná. Naše selhání pravděpodobně pramení z toho, že Libanon zůstává pevně pod kontrolou Íránu a Hizballáhu. Libanonské odmítnutí spolupráce s námi však není konec. Vždy se k němu můžeme vrátit, až ho budeme potřebovat, a tentokrát nebude moci odporovat. Naše politické úsilí však zřejmě selhalo. Možná bychom se měli zaměřit na to, jak tlačit na ostatní a posílit mezinárodní diplomacii, protože ji v budoucnu můžeme potřebovat." # todo: NEW TRANSLATION
 france_md.312.a: "Připravit námořní intervenci" # todo: NEW TRANSLATION
 france_md.312.b: "Musíme posílit diplomacii; zřejmě to není naše silná stránka" # todo: NEW TRANSLATION
 france_md.313.t: "Francouzská komuna požaduje pád naší vlády" # todo: NEW TRANSLATION
 france_md.313.d: "Před několika měsíci Francouzská komuna oznámila přání přinést revoluci do celého světa a nyní na nás zřejmě tlačí. Propagandističtí agitátoři pronikli do našeho obyvatelstva a podněcují občany, aby se k jejich věci přidali. Skupiny demonstrantů a komunistických extremistů se již zorganizovaly. Francouzští vyslanci varovali před intervencí, pokud se nepodřídíme. Mohli bychom kapitulovat a přidat se k Francii, čímž bychom ztratili nezávislost, nebo uvěznit extremisty, kteří ohrožují naši vládu." # todo: NEW TRANSLATION
 france_md.313.a: "Ať žije revoluce" # todo: NEW TRANSLATION
 france_md.313.b: "Raději mrtvý než rudý" # todo: NEW TRANSLATION
 france_md.314.t: "[FROM.GetName] se připojuje ke světové revoluci" # todo: NEW TRANSLATION
 france_md.314.d: "[FROM.GetName] právě oznámil pád své vlády v důsledku našich protestů a diplomatického tlaku. To je pro nás vynikající zpráva; k revoluci se připojuje nová mocnost, a to bez krveprolití. Ostatní kapitalistické mocnosti oznámily své zděšení nad touto dramatickou změnou světového řádu. Mohou protestovat, ale proti vůli lidu se postavit nedokážou. Revoluce nakonec přijde i pro ně. Pád [FROM.GetName] je teprve začátek; další budou následovat." # todo: NEW TRANSLATION
 france_md.314.a: "Revoluce sílí" # todo: NEW TRANSLATION
 france_md.315.t: "[FROM.GetName] odmítá vůli lidu" # todo: NEW TRANSLATION
 france_md.315.d: "Zdá se, že protesty požadující pád vlády [FROM.GetName] se rozptýlily. Vláda [FROM.GetName] je totiž násilně potlačila a odmítla jakýkoli kompromis. Pokud toto vzepětí vůle lidu zdánlivě překonalo, možná bychom se měli do revoluce v [FROM.GetName] zapojit více. Naše síly jsou připraveny vojensky zasáhnout a prosadit vůli suverénního lidu. Tato intervence by však mohla přerůst v rozsáhlý konflikt. Máme zasáhnout?" # todo: NEW TRANSLATION
 france_md.315.a: "Revoluce přijde, ať se jim to líbí, nebo ne" # todo: NEW TRANSLATION
 france_md.315.b: "Vrátíme se" # todo: NEW TRANSLATION
 france_md.316.t: "Vítězná komuna v Evropě" # todo: NEW TRANSLATION
 france_md.316.d: "Pro naši Komunu je to velký den: přinesli jsme revoluci do celé Evropy. Od pádu Sovětského svazu byl kontinent plný kapitalistů a rodících se nacionalistů, ale nic nás nezastavilo — ani sankce, bombardování, ani války, které jsme vedli, abychom přivedli proletariát k moci. Někdy jsme museli utlačovatele poučit děly, ale triumf revoluce ospravedlňuje prostředky. Jak armáda lidu defiluje Paříží, Evropa začíná obnovu na pevných základech, daleko od kapitalismu. Naším dalším cílem je uskutečnit sen internacionalistů na celém světě: vytvořit velkou federaci, v níž se všichni dělníci budou cítit doma." # todo: NEW TRANSLATION
 france_md.316.a: "Internacionála bude lidstvem" # todo: NEW TRANSLATION
 france_md.317.t: "Přes Ardeny" # todo: NEW TRANSLATION
 france_md.317.d: "Náš císař dlouho hovořil o invazi do Beneluxu, který je životně důležitý pro naši vznikající říši. Belgie má ve Valonsku významnou frankofonní menšinu a je nervovým centrem Evropské unie, přesto je špatně bráněna — ideální první cíl pro obnovení našich legitimních hranic. Protože hodláme tyto země trvale obsadit, neboť nám právem náleží, císař nám nařídil vyhnout se bombardování a udeřit rychle, než se naši nepřátelé připraví. Je čas získat zpět kolébku franského národa za Ardenami." # todo: NEW TRANSLATION
 france_md.317.a: "Nemají žádnou šanci" # todo: NEW TRANSLATION
 france_md.318.t: "Druhé španělské tažení" # todo: NEW TRANSLATION
 france_md.318.d: "Náš císař nařídil dobytí Pyrenejského poloostrova, které je nezbytné k zajištění našeho západního křídla před pochodem na východ k Moskvě. Dobytí Španělska nás přiblíží ke Gibraltaru, klíčovému pro kontrolu Středomoří. Hornatý terén nahrává obránci, proto císař požaduje pomalý a jistý postup podporovaný alpskými myslivci, zároveň však naléhá na rychlost, než se naši nepřátelé připraví. Napoleonova porážka nás naučila, že dobytou půdu je třeba udržet: musíme zavést stabilní klientské státy nebo posílit okupační síly." # todo: NEW TRANSLATION
 france_md.318.a: "Tentokrát je budeme pečlivě sledovat" # todo: NEW TRANSLATION
 france_md.319.t: "Přes Rýn" # todo: NEW TRANSLATION
 france_md.319.d: "Náš císař určil našeho dalšího protivníka: Německo, hospodářské srdce Evropy oddané vizi Evropy, kterou opovrhujeme. Konflikt byl nevyhnutelný a představuje náš první krok na východ k Moskvě, našemu konečnému nepříteli. Od Napoleonova bleskového tažení proti Prusku přes Sedan až po dvě světové války tohoto nepřítele dobře známe. Císař nařizuje jistý a připravený postup se silnými tanky a letectvem k zajištění našich cílů, ačkoli úplná okupace není nutná. Tato válka je nešťastná, ale nevyhnutelná." # todo: NEW TRANSLATION
 france_md.319.a: "Už nikdy žádný Sedan!" # todo: NEW TRANSLATION
 france_md.320.t: "Válka o Alpy" # todo: NEW TRANSLATION
 france_md.320.d: "Během ústupu Napoleona I. z Ruska se spojenci vzbouřili v okamžiku, kdy oslabil. Proto nám náš císař před pochodem na Moskvu nařizuje zajistit jižní křídlo: Itálii a bývalá rakousko-uherská území. Nyní představují jen menší hrozbu, ale pokud se naše ruské tažení protáhne, mohly by se stát nebezpečnými. Jejich hornatý terén vyžaduje alpské myslivce a dělostřelectvo k vytlačení obránců z pevných pozic a zajištění našeho týlu bez plýtvání muži, které budeme potřebovat pro Rusko. Tyto země jsou na špatném místě ve špatnou dobu." # todo: NEW TRANSLATION
 france_md.320.a: "Jednou provždy pohřbíme Svatou říši římskou!" # todo: NEW TRANSLATION
 france_md.321.t: "Císař nás vyzývá k přípravě na válku" # todo: NEW TRANSLATION
 france_md.321.d: "Náš francouzský spojenec svolal schůzku s cílem projednat zničení Ruska, které považuje za hrozbu Evropě a říši, o niž se nyní dělíme. Vyzývá nás k budování vojenských schopností a vyslal odborníky na zbraně, aby optimalizovali naši výrobu, s jediným heslem: připravit se na dlouhou a obtížnou válku. Oznámení je pro naše občany chmurnou zprávou, protože někteří mohou být povoláni zemřít, ale tato válka je nezbytná a spravedlivá. Musíme Evropu chránit před Ruskem, než se jeho cílem staneme my." # todo: NEW TRANSLATION
 france_md.321.a: "Děkujeme, můj císaři" # todo: NEW TRANSLATION
 france_md.322.t: "Proražení glacisu" # todo: NEW TRANSLATION
 france_md.322.d: "Náš pochod na Moskvu je bezprostřední, nejprve však musíme zajistit naše výchozí postavení: východní Evropu, kdysi nárazník proti ruské expanzi, nyní překážku naší vlastní cestě. Těm, kteří se k nám chtěli připojit, jsme nabídli ruku; ostatní naši výzvu ignorovali a jejich den soudu nadešel. Tyto nově nezávislé národy nebude těžké rozdrtit. Postupujeme rychle obrněným průlomem podporovaným dělostřelectvem. Budou bojovat až do konce. Nesmíme mít slitování." # todo: NEW TRANSLATION
 france_md.322.a: "Francouzi dají světu mír i svobodu" # todo: NEW TRANSLATION
 france_md.475.t: "Druhé ruské tažení" # todo: NEW TRANSLATION
 france_md.475.d: "Po letech příprav nastal čas. Náš císař vydal konečné rozkazy pro ruské tažení proti našemu největšímu protivníkovi a nevyhnutelné hrozbě, stejně jako za Napoleona I. Tentokrát váhá: proti mocnosti, která vždy bránila vlastní půdu, není dovolena žádná chyba. Ať už se rozhodneme jakkoli, rychlost je zásadní, protože nepřítel se připravuje také. Zvolte správně, ale dejte jim na vědomí toto: suverénní lid bude postupovat, tyrani sestoupí do hrobů, aby se ukryli!" # todo: NEW TRANSLATION
 france_md.475.a: "Rychlá ofenziva, v Moskvě budeme za dva týdny!" # todo: NEW TRANSLATION
 france_md.475.b: "Připravme se na opotřebovací válku" # todo: NEW TRANSLATION
 france_md.476.t: "Prolomení blokády" # todo: NEW TRANSLATION
 france_md.476.d: "Naše ekonomika a lidé už dost trpěli rukou zrádného Albionu a nyní, když je Evropa zajištěna, se můžeme obrátit k našemu nejstaršímu protivníkovi. Naši cestu na jejich ubohý ostrov blokuje pouze Lamanšský průliv. Náš císař nabízí dvě možnosti: udeřit s leteckou převahou a rozdrtit je bombami před seskokem našich sil, nebo využít jejich oslabeného námořnictva a soustředit flotilu k přímému vylodění. Rychlost je zásadní. Občane, zvol správně. Naše vítězství je bezprostřední." # todo: NEW TRANSLATION
 france_md.476.a: "Jejich námořnictvo je nyní pouhým stínem své bývalé slávy. La Royale si s ním snadno poradí" # todo: NEW TRANSLATION
 france_md.476.b: "Blitz 2.0 zní dobře" # todo: NEW TRANSLATION
 france_md.477.t: "Císař vyhlašuje vítězství kontinentálního systému" # todo: NEW TRANSLATION
 france_md.477.d: "Uvalili na nás sankce. Uvalili na nás embargo. Bombardovali nás. Nikdy však nezlomili našeho ducha. Po letech války náš císař vyhlásil vítězství: Evropa se znovu sklání před Francouzskou říší. Tato dobytí stála životy tisíců Francouzů, mučedníků, na něž se nezapomene. Den vítězství je nyní státním svátkem na jejich památku. Náš triumf v Evropě však nic neřeší: dříve či později se střetneme s dalšími mocnostmi na dalších frontách. Francie je věčná. Stejně jako válka." # todo: NEW TRANSLATION
 france_md.477.a: "Den slávy nadešel" # todo: NEW TRANSLATION
 france_md.478.t: "Jaké poslání pro naše království?" # todo: NEW TRANSLATION
 france_md.478.d: "Naše pozice v čele Francouzského království je zajištěna: rozdrtili jsme revoluci a navrátili náboženství jeho právoplatné místo. Nyní je otázkou, kde začít obnovovat naši někdejší slávu. Mohli bychom získat zpět své předkové franské země, což by vyvolalo válku s bývalými spojenci, kteří se jich odmítají vzdát, nebo bychom mohli získat srdce křesťanů po celém světě a vyrazit nejprve osvobodit Svatou zemi, čímž bychom ušetřili vlastní půdu války. Ať už se rozhodneme jakkoli, nemusíme se ničeho bát, protože Bůh stojí na naší straně." # todo: NEW TRANSLATION
 france_md.478.a: "Především jsme Frankové" # todo: NEW TRANSLATION
 france_md.478.b: "Křížová výprava nepočká, musíme osvobodit naše svatá místa" # todo: NEW TRANSLATION
 france_md.479.t: "Francouzské království požaduje naši anexi" # todo: NEW TRANSLATION
 france_md.479.d: "Dnes ráno dorazil od našich francouzských kolegů velmi podivný požadavek. Jejich král již neuznává naši suverenitu a požaduje, abychom mu předali naše území, rezervy a armádu, přičemž slibuje, že naše obyvatelstvo bude hladce integrováno. Zní to jako aprílový žert, ale francouzský generální štáb oznámil zvláštní mobilizaci a všechny důkazy ukazují na bezprostřední intervenci na našem území. Kapitulovat, nebo bojovat: ať už se rozhodneme jakkoli, musíme jednat rychle." # todo: NEW TRANSLATION
 france_md.479.a: "Konflikt by našemu lidu způsobil zbytečné utrpení" # todo: NEW TRANSLATION
 france_md.479.b: "Jak se opovažují? Jsme suverénní země" # todo: NEW TRANSLATION
 france_md.480.t: "[FROM.GetName] splňuje naše požadavky" # todo: NEW TRANSLATION
 france_md.480.d: "Ještě před výstřelem prvního děla vláda [FROM.GetName] oznámila své rozpuštění a bezpodmínečnou kapitulaci našemu království. To je vynikající zpráva pro náš lid i naše diplomatické úsilí. Náš král slíbil, že status nových francouzských občanů bude co nejrychleji upraven a že budou co nejúčinněji integrováni. Bylo to nejmoudřejší rozhodnutí, jaké mohli učinit. Naší intervenci by nedokázali odolat." # todo: NEW TRANSLATION
 france_md.480.a: "Někdy stačí jen hezky požádat" # todo: NEW TRANSLATION
 france_md.481.t: "[FROM.GetName] odmítá ustoupit" # todo: NEW TRANSLATION
 france_md.481.d: "Vláda [FROM.GetName] právě oznámila, že odsuzuje náš pokus zastrašit její zemi. Naše etnické požadavky prý nemají u vyjednávacího stolu místo. Tento diplomatický neúspěch byl předvídatelný; bylo by podivné, kdyby suverénní země oznámila svou kapitulaci, aniž by se pokusila bojovat. To je příhodné, protože jsme se na tuto možnost ve skutečnosti připravili. Naše síly jsou připraveny zasáhnout na jejich území. Není však jisté, že otevřený konflikt je nejlepším způsobem, jak zajistit spravedlnost." # todo: NEW TRANSLATION
 france_md.481.a: "Budou toho litovat" # todo: NEW TRANSLATION
 france_md.481.b: "Tím naše věc nekončí" # todo: NEW TRANSLATION
 france_md.482.t: "Francouzské království požaduje naši podřízenost" # todo: NEW TRANSLATION
 france_md.482.d: "Dnes ráno dorazil od našich francouzských kolegů velmi podivný požadavek. Jejich král, odvolávaje se na dobu Karlovců, nám již nedůvěřuje v ochraně papežství před rostoucím napětím a požaduje úplnou kontrolu nad naší vládou i koridorem k Vatikánu, který hodlá spravovat přímo. To je nepřijatelné: papežství jsme nikdy nezklamali a náboženství nemůže ospravedlnit nacionalistické ambice našeho souseda. Nejde však o prázdné hrozby — francouzský generální štáb nařídil zvláštní mobilizaci a všechny důkazy ukazují na intervenci na našem území. Ustoupit, nebo bojovat: ať už se rozhodneme jakkoli, musíme jednat rychle." # todo: NEW TRANSLATION
 france_md.482.a: "Nemáme proti nim šanci" # todo: NEW TRANSLATION
 france_md.482.b: "Jak se opovažují? Jsme suverénní země" # todo: NEW TRANSLATION
 france_md.483.t: "[FROM.GetName] odmítá splnit naše požadavky" # todo: NEW TRANSLATION
 france_md.483.d: "Vláda [FROM.GetName] právě oznámila, že odsuzuje náš pokus zastrašit jejich zemi. Odmítají se sklonit před našimi požadavky a chtějí bránit svou suverenitu nad svými rozhodnutími a politikou. Zdá se, že odmítli naši výzvu k rozumu. Nemůžeme jim to nechat projít. Naše síly jsou připraveny vojensky zasáhnout v jejich zemi. Nemůžeme riskovat, že se naši protivníci spojí proti nám. Musíme z nich udělat příklad. Válka s [FROM.GetName] však možná není tím, co potřebujeme." # todo: NEW TRANSLATION
 france_md.483.a: "Neuvědomili si, že jsou na špatné straně hlavně" # todo: NEW TRANSLATION
 france_md.483.b: "Můžeme je ohnout jinými způsoby" # todo: NEW TRANSLATION
 france_md.484.t: "Francouzské království požaduje naši podřízenost" # todo: NEW TRANSLATION
 france_md.484.d: "Dnes ráno dorazil od našich francouzských kolegů velmi podivný požadavek. Jejich král nám již nedůvěřuje v ochraně našeho lidu a tvrdí, že naše vláda stojí na špatné straně současné rovnováhy aliancí, proto požaduje úplnou kontrolu nad naší vládou a ozbrojenými silami. Tyto požadavky jsou absurdní: při správě našeho území jsme nikdy neselhali a naše autorita pochází výhradně z mandátu našeho lidu. Nejde však o prázdné hrozby — francouzský generální štáb nařídil zvláštní mobilizaci a všechny důkazy ukazují na intervenci na našem území. Ustoupit, nebo bojovat: ať už se rozhodneme jakkoli, musíme jednat rychle." # todo: NEW TRANSLATION
 france_md.484.a: "Nemáme proti nim šanci" # todo: NEW TRANSLATION
 france_md.484.b: "Suverénní je pouze náš lid" # todo: NEW TRANSLATION
 france_md.485.t: "Vzestup západní říše" # todo: NEW TRANSLATION
 france_md.485.d: "Po letech bojů a zrad Frankové zvítězili. Když jsme svrhli uzurpující republiku, Evropa nás ostrakizovala a uvalila na nás sankce, ale Bůh vždy stál na naší straně: Francie, nejstarší dcera církve, nikdy nebyla předurčena k republice. Nepřátelé franského lidu byli odsouzeni k zániku a nyní Frankové získali zpět své země. Je čas vyhlásit naši říši, říši Západu, říši víry, posvěcenou papežstvím pro naši věčnou ochranu. Možná je také čas vydat se na východ a získat zpět Svatou zemi." # todo: NEW TRANSLATION
 france_md.485.a: "A tentokrát budu tím, kdo položí věnec" # todo: NEW TRANSLATION
 france_md.485.b: "Deus Vult!" # todo: NEW TRANSLATION
 france_md.486.t: "Francouzské království požaduje naši podřízenost" # todo: NEW TRANSLATION
 france_md.486.d: "Dnes ráno dorazil od našich francouzských kolegů velmi podivný požadavek. Jejich král, odhodlaný dokončit desátou křížovou výpravu, kterou zahájil, tvrdí, že naše ostrovní území mu stojí v cestě, a požaduje je spolu s úplnou kontrolou nad naší vládou. To je nepřijatelné: náboženství nemůže ospravedlnit nacionalistické ambice našeho souseda. Nejde však o prázdné hrozby — francouzský generální štáb nařídil zvláštní mobilizaci a všechny důkazy ukazují na intervenci na našem území. Ustoupit, nebo bojovat: ať už se rozhodneme jakkoli, musíme jednat rychle." # todo: NEW TRANSLATION
 france_md.486.a: "Je to nejlepší způsob, jak zajistit úspěch tažení; přijímáme" # todo: NEW TRANSLATION
 france_md.486.b: "Jak se opovažují? Jsme suverénní země" # todo: NEW TRANSLATION
 france_md.487.t: "Vítězná desátá křížová výprava" # todo: NEW TRANSLATION
 france_md.487.d: "Po měsících intenzivních bojů ve Středomoří a na Blízkém východě jsme zvítězili. Putovali jsme od ostrova k ostrovu, zajistili poslední křesťanské opěrné body a poté oblehli samotný Jeruzalém. V cestě nám stáli nesčetní protivníci a mnoho Francouzů zemřelo po boku nevinných, kteří padli naší pomstychtivé moci, ale účel světí prostředky. Po upevnění našich zisků a neutralizaci nestability Blízkého východu zůstává jediná otázka: měli bychom se zastavit, nebo dokončit to, co náboženské války v Evropě nedokázaly?" # todo: NEW TRANSLATION
 france_md.487.a: "Bude nová křížová výprava" # todo: NEW TRANSLATION
 france_md.487.b: "Obnovením Jeruzalémského království jsme dosáhli svého cíle. Není třeba jít dál" # todo: NEW TRANSLATION
 france_md.488.t: "Francouzské království nás vyzývá, abychom se přidali k jeho alianci" # todo: NEW TRANSLATION
 france_md.488.d: "Od francouzských diplomatů dorazil návrh. Po dokončení svého blízkovýchodního tažení francouzský král jako ochránce katolické církve nyní vyhlašuje válku všem, kteří odmítají jeho autoritu, a zve nás do aliance, kterou přirovnává k Noemově arše před blížící se potopou. Toto oznámení je stejně šílené jako děsivé a doprovází ho mobilizace křižácké armády, která se nyní vrací domů. Návrh vzhledem k zuřivosti, s jakou vedli svou křížovou výpravu, připomíná spíše ultimátum a musíme jej brát vážně. Ať už se rozhodneme jakkoli, musíme tak učinit rychle." # todo: NEW TRANSLATION
 france_md.488.a: "Je lepší mít je na své straně než proti sobě" # todo: NEW TRANSLATION
 france_md.488.b: "Zešíleli?" # todo: NEW TRANSLATION
 france_md.489.t: "Jedenáctá křížová výprava vítězí v Evropě" # todo: NEW TRANSLATION
 france_md.489.d: "Tato křížová výprava byla krvavější než předchozí. Bylo také obtížnější ji provést, protože jsme se postavili velmocem. Ale dokázali jsme to. Zvítězili jsme. Zatímco ošetřujeme svá zranění a obnovujeme svou zemi i země, které jsme dobyli, vyvstává otázka. Měli bychom nad jejich politikou zavést přísnou kontrolu, abychom zajistili, že zůstanou na správné cestě? Nebo bychom jim měli ukázat světlo a nechat je rozhodovat o sobě? Když jim umožníme volbu, prokážeme svou shovívavost a bude méně pravděpodobné, že se vzbouří. Naopak přísnější kontrola pomůže zajistit, aby žádná další ovce nesešla z cesty. Co bychom měli udělat?" # todo: NEW TRANSLATION
 france_md.489.a: "Musíme na ně dohlížet" # todo: NEW TRANSLATION
 france_md.489.b: "Náš Pán je odsoudí, až přijde čas" # todo: NEW TRANSLATION
 france_md.490.t: "Obnovení našich přirozených hranic" # todo: NEW TRANSLATION
 france_md.490.d: "Od Richelieua po de Gaulla nebyla myšlenka přirozených hranic Francie nikdy opuštěna: jde o zásadní zájem zakořeněný jak v etnických nárocích franského lidu, tak v naší bezpečnosti. Dnes můžeme tento osud naplnit. Vytlačili jsme naše protivníky od břehů Rýna, zajistili horské pozice a místní obyvatelstvo konečně přijalo nový řád. Zbývá už jen tuto anexi formalizovat. Tím pomstíme revoluci a otevřeme éru bezpečí a prosperity pro říši i francouzský lid." # todo: NEW TRANSLATION
 france_md.490.a: "Hranice Francie určuje příroda (Danton 1793)" # todo: NEW TRANSLATION
 france_md.491.t: "Jednota franského lidu" # todo: NEW TRANSLATION
 france_md.491.d: "Příliš dlouho mocnosti snažící se omezit vliv Francie mařily jednotu franského lidu, vytvářely státy jako Benelux coby bojiště mezi Franky a ostatními germánskými národy a přesvědčovaly nás, že skutečnou vlastí je Evropská unie. Osud Franků však patří pouze Frankům a nic je nemohlo navždy udržet rozdělené. Získali jsme zpět prastarou zemi, která dala vzniknout francouzskému národu, a po měsících naši pokrevní bratři pochopili, že jejich osud leží s námi. Nyní, když je království celé, bylo učiněno zadost spravedlnosti." # todo: NEW TRANSLATION
 france_md.491.a: "Stát pro všechny Franky" # todo: NEW TRANSLATION
 france_md.492.t: "Návrat Karlovců" # todo: NEW TRANSLATION
 france_md.492.d: "Po smrti Karla Velikého byla jeho říše rozdělena na Západní, Střední a Východní Franskou říši a odkaz franského císaře začal blednout, když byli Frankové zbavováni svých zemí. Tuto chybu jsme napravili. Po letech konfliktů jsme vyhnali uzurpátory ze svého území a ukázali jeho obyvatelům, že nikdy nebyli Němci, Italové ani Švýcaři, ale Frankové, kteří jen zapomněli. Tímto znovusjednocením napravujeme křivdy Verdunské smlouvy a tisíc let Evropy vybudované na falešných základech. Tento den označuje počátek nové, franské Evropy." # todo: NEW TRANSLATION
 france_md.492.a: "Říše a franský stát jsou jedno" # todo: NEW TRANSLATION
 france_md.493.t: "Jeruzalémské království znovu povstává" # todo: NEW TRANSLATION
 france_md.493.d: "Před téměř tisíciletím přišli naši křižáčtí předkové o svůj nejcennější majetek. Devět křížových výprav nestačilo k dobytí a udržení našich svatých míst, ale vrátili jsme se, abychom splnili slib daný Pánu. V posledních letech jsme získali opěrný bod na Blízkém východě v posledních křesťanských baštách Libanonu a znovu dobyli Jeruzalém a Svatou zemi. Následoval boj o založení našeho království na Blízkém východě a o vysvětlení obyvatelstvu, že svatá místa musí zůstat pod naší kontrolou, aby byla zajištěna jejich bezpečnost." # todo: NEW TRANSLATION
 france_md.493.a: "Desátá křížová výprava triumfuje!" # todo: NEW TRANSLATION
 france_md.494.t: "Znovuzrozená říše" # todo: NEW TRANSLATION
 france_md.494.d: "Před zhruba 150 lety padla Napoleonova Druhá říše před Pruskem a germánskými národy, čímž pro Francii začalo století pomsty a konfliktů. Všichni předpovídali náš pomalý úpadek jako bývalé koloniální mocnosti, ale my bonapartisté jsme jim dokázali opak, uchvátili moc od nestabilní republiky a navrátili Francii její někdejší slávu. Mělo to svou cenu, ale získali jsme zpět hranice První říše Napoleona I. a vyhnali nepřátelské mocnosti. Tímto historickým vítězstvím nad Osmou koalicí Francie ukázala světu, že je zpět, a kontinentální systém nyní vítězí v Evropě." # todo: NEW TRANSLATION
 france_md.494.a: "Do třetice všeho dobrého" # todo: NEW TRANSLATION
 france_md.495.t: "Návrat koloniální říše" # todo: NEW TRANSLATION
 france_md.495.d: "Bonapartistické říše se vždy soustředily na ovládnutí Evropy, ale důležité byly i kolonie, od haitské vzpoury po expanzi Napoleona III. do Afriky. Od pádu koloniálních říší jsme byli postupně vytlačováni ze zemí, které jsme kdysi ovládali, a nyní je čas obnovit přirozený řád. Náš císař nám nařídil připravit se na návrat Francie do jejích bývalých kolonií a mobilizovat vojska z našich zámořských departementů a regionů, která jsou pro toto prostředí vhodnější. Napadneme pobřežní města, abychom zajistili námořní základny, a poté budeme postupovat do vnitrozemí, kde je klima stále drsnější." # todo: NEW TRANSLATION
 france_md.495.a: "Ty požehnané dny kolonií" # todo: NEW TRANSLATION
 france_md.496.t: "Náš francouzský lenní pán požaduje naši anexi" # todo: NEW TRANSLATION
 france_md.496.d: "Měli jsme si uvědomit, že kontrola naší politiky vnucená Francií takto dříve či později dopadne. Francouzské úřady právě oznámily, že naše země bude brzy pohlcena Francií. Toto oznámení nepřišlo z ničeho nic — Francie již dlouho pokukovala po některých našich územích a tentokrát se je zdá odhodlána zabrat. Věří, že naši zemi dokáže spravovat lépe než my. V těchto temných hodinách musíme učinit volbu nejen pro svou nezávislost, ale i pro bezpečí našeho lidu. Ustoupit, nebo bojovat — to jsou naše možnosti. Ať už se rozhodneme jakkoli, musíme jednat rychle." # todo: NEW TRANSLATION
 france_md.496.a: "Nemáme prostředky, abychom tomu zabránili" # todo: NEW TRANSLATION
 france_md.496.b: "Tato země je naše, ať přijdou a vezmou si ji" # todo: NEW TRANSLATION
 france_md.497.t: "[FROM.GetName] se bouří proti naší nadvládě" # todo: NEW TRANSLATION
 france_md.497.d: "Vláda [FROM.GetName] odsuzuje náš pokus o anexi a je připravena za každou cenu bránit svou nezávislost. Přijímají vazalství, ale odmítají postoupit požadovaná území, vyhánějí naši správu a připravují se na střet s námi. Můžeme toto povstání nyní rozdrtit a udělat z nich příklad, nebo jejich potrestání odložit, protože nám nic nebrání se vrátit později." # todo: NEW TRANSLATION
 france_md.497.a: "To jim i všem ostatním, kteří by se nechali zlákat, poslouží jako lekce" # todo: NEW TRANSLATION
 france_md.497.b: "Rozdrtíme je později" # todo: NEW TRANSLATION
 france_md.498.t: "Francie navrhuje investovat do našeho průmyslu" # todo: NEW TRANSLATION
 france_md.498.d: "Naši francouzští partneři nám předložili lákavou nabídku: Evropa chce znovu soustředit výrobní kapacitu, kterou může kontrolovat, a proto Francie navrhuje investovat do naší ekonomiky a pomoci zřídit na našem území továrny jako součást širšího projektu na posílení evropské suverenity a odolnosti. To by nám velmi prospělo, ale také Francouzům, kteří by mohli získat podíl na našem kapitálu a v našich společnostech. Měli bychom obětovat trochu suverenity na podporu našeho průmyslu?" # todo: NEW TRANSLATION
 france_md.498.a: "Kde se podepisuje?" # todo: NEW TRANSLATION
 france_md.498.b: "Evropa a Francie nemají co zasahovat do naší ekonomiky" # todo: NEW TRANSLATION
 france_md.499.t: "Francie navrhuje investovat do naší infrastrukturní sítě" # todo: NEW TRANSLATION
 france_md.499.d: "Během příjemné diskuse s našimi francouzskými partnery nám předložili poměrně atraktivní nabídku. Hlavním cílem Evropy je usnadnit pohyb lidí a zboží mezi zeměmi EU a v tomto ohledu chtějí naší zemi pomoci. Francouzská vláda proto nabídla investice do naší dopravní sítě prostřednictvím modernizace infrastruktury. Tato nabídka je nedílnou součástí projektu zaměřeného na zvýšení evropské suverenity a pomoc členským státům čelit budoucím krizím. Nabídka by pro nás byla velmi prospěšná, ale prospěla by také Francouzům, kteří by mohli získat vliv nad správou naší infrastruktury. Měli bychom obětovat trochu suverenity, abychom svou infrastrukturu modernizovali?" # todo: NEW TRANSLATION
 france_md.499.a: "Kde se podepisuje?" # todo: NEW TRANSLATION
 france_md.499.b: "Naše infrastrukturní síť si bez nich vede velmi dobře" # todo: NEW TRANSLATION
 france_md.502.t: "Francie navrhuje investovat do naší ekologické transformace" # todo: NEW TRANSLATION
 france_md.502.d: "Během příjemné diskuse s našimi francouzskými partnery nám předložili velmi lákavou nabídku. Protože jejich dlouhodobým cílem je učinit Evropu šetrnější k životnímu prostředí, navrhují společně investovat do zelené transformace. Francouzská vláda proto navrhla investovat do naší infrastruktury výroby obnovitelné energie. Nabídka by pro nás byla velmi prospěšná, ale prospěla by také Francouzům, kteří by mohli získat oporu v naší výrobě elektřiny. Měli bychom obětovat trochu suverenity ve prospěch zelené transformace?" # todo: NEW TRANSLATION
 france_md.502.a: "Kde se podepisuje?" # todo: NEW TRANSLATION
 france_md.502.b: "Jejich ekologickou transformaci nepotřebujeme" # todo: NEW TRANSLATION
 france_md.520.t: "Fragmentace pokračuje" # todo: NEW TRANSLATION
 france_md.520.d: "Neštěstí nechodí nikdy samo. Jak klesáme v průzkumech, naše strana se rozpadá: naše liberální křídlo se přidalo ke středové straně a ministr Emmanuel Macron založil vlastní stranu La République en Marche, aby nás vyzval. Odtrhlo se i naše levé křídlo, zklamané našimi výsledky v sociálních a hospodářských otázkách, a přidalo se k Jeanu-Lucu Mélenchonovi při budování vlastní radikální levicové strany. Tento vývoj je katastrofální, ale také naznačuje, že můžeme situaci zvrátit a získat zpět voliče, než bude pozdě." # todo: NEW TRANSLATION
 france_md.520.a: "Proklatě!" # todo: NEW TRANSLATION
 france_md.521.t: "Francouzští agenti pronikli do našeho obranného systému" # todo: NEW TRANSLATION
 france_md.521.d: "Dnes za úsvitu nás probudil zvuk klaksonů a nárazů. Ulice našeho hlavního města jsou ochromeny tím, co se zdá být sabotáž našeho dopravního systému. Naši technici dělají vše pro obnovení situace, ale nehody si již vyžádaly životy několika příslušníků policie a obáváme se, že ohrožena může být i bezpečnost našich ozbrojených sil. Tento útok zjevně pochází z bonapartistické Francie, která vůči nám již několik měsíců používá nepřátelskou rétoriku. Musíme se připravit, než se tyto malé hry tajných agentů stanou normou." # todo: NEW TRANSLATION
 france_md.521.a: "Proklínáme je" # todo: NEW TRANSLATION
 france_md.522.t: "Naše policejní síly odrazily francouzský nájezd" # todo: NEW TRANSLATION
 france_md.522.d: "S úlevou jsme se dozvěděli, že našim policejním silám se podařilo zabránit rozsáhlé sabotáži v hlavním městě. Nepříteli se podařilo uprchnout, ale odvrátili jsme nejhorší. Tento útok si přesto vyžádal životy dvou policistů během sporadických střetů v ulicích našeho hlavního města. Operace zjevně pochází z bonapartistické Francie, která vůči nám již několik měsíců používá nepřátelskou rétoriku. Musíme se připravit, než se tyto malé hry tajných agentů stanou normou." # todo: NEW TRANSLATION
 france_md.522.a: "Ne vždy budeme mít takové štěstí" # todo: NEW TRANSLATION
 france_md.523.t: "Francie vyhlašuje třetí říši" # todo: NEW TRANSLATION
 france_md.523.d: "Francie právě vyhlásila návrat říše. Před nějakou dobou se ve Francii dostala k moci nacionalistická monarchistická frakce a zjevně upevnila svou moc. Uspořádala proto velkolepý obřad oznamující návrat říše a nyní se o tom mluví všude. Obřad pokrývala média a široce se šířil na sociálních sítích. Tato oslava není jen uměleckou událostí, ale také ukázkou síly Francie. Francie již několik měsíců veřejně projevuje touhu po dobývání a konfliktu. Toto vyhlášení proto není koncem, nýbrž začátkem: začátkem komplikací v Evropě i ve světě." # todo: NEW TRANSLATION
 france_md.523.a: "Tuto hrozbu bychom měli brát vážně" # todo: NEW TRANSLATION
 france_md.523.b: "Už dlouho nejsou hrozbou" # todo: NEW TRANSLATION
 france_md.524.t: "Více prostředků pro armádu?" # todo: NEW TRANSLATION
 france_md.524.d: "Naše nedávné investice do obrany byly zásadní pro zachování našeho místa v evropské obranné strategii, ale nemohli bychom udělat více? Tváří v tvář hrozbě návratu války do Evropy nasadilo mnoho spojeneckých zemí obrovské zdroje na přípravu svých sil pro vysoce intenzivní konflikt. Možná bychom měli udělat totéž a ještě více investovat do našich výrobních schopností v oblasti zbraní." # todo: NEW TRANSLATION
 france_md.524.a: "Opatrnosti není nikdy dost" # todo: NEW TRANSLATION
 france_md.524.b: "Už jsme utratili hodně" # todo: NEW TRANSLATION
 france_md.525.t: "Prostředky k dosažení našich ambicí" # todo: NEW TRANSLATION
 france_md.525.d: "Navzdory výzvám, aby Francouzi více pracovali a zbavili se kultury závislosti, je realita tvrdá: naše země postrádá stabilní pracovní místa, přestože má velkou, ochotnou a talentovanou pracovní sílu. Zaměstnanost bychom mohli podpořit vložením prostředků do strategických sektorů naší ekonomiky, protože čekání, až se trh napraví sám, by mohlo trvat staletí. Nebo bychom mohli financovat náš špičkový obranný průmysl zavalený objednávkami, které nemá prostředky splnit, a civilní sektor nechat, ať se postará sám o sebe." # todo: NEW TRANSLATION
 france_md.525.a: "Naši občané tato pracovní místa potřebují" # todo: NEW TRANSLATION
 france_md.525.b: "Náš obranný průmysl tyto prostředky využije lépe" # todo: NEW TRANSLATION
 france_md.526.t: "Oživení hospodářské aktivity" # todo: NEW TRANSLATION
 france_md.526.d: "Léta ultraliberalismu oslabila naši ekonomiku, ale přežití našeho odchodu z Evropské unie vyžaduje odolnou ekonomiku bez sankcí EU. Mohli bychom investovat do kapitálu francouzských soukromých společností a povzbudit je, aby se usadily ve Francii, čímž bychom usnadnili zapojení státu do obnovy, ačkoli nic nezaručuje, že nebudou investovat jinde, kde je práce levnější. Nebo bychom mohli přímo dotovat vznik a růst nových podniků, což by se finančnímu sektoru nelíbilo, ale zaručeně by to fungovalo." # todo: NEW TRANSLATION
 france_md.526.a: "Budeme investovat do trhu, aby oni investovali ve Francii." # todo: NEW TRANSLATION
 france_md.526.b: "Z lidského hlediska kapitalismus nenabízí uspokojivé řešení (Charles de Gaulle)" # todo: NEW TRANSLATION
 france_md.527.t: "Rozšíření podpory venkovským oblastem" # todo: NEW TRANSLATION
 france_md.527.d: "Náš projekt na oživení ekonomiky venkovských a příměstských oblastí již dobře pokračuje a nyní musíme rozhodnout o jeho dalším kroku: pokračovat v rozšiřování dopravního spojení a pracovních míst v méně obydlených regionech, nebo se zaměřit na zemědělství a navazující sektory, izolované od hlavních center rozhodování a připravené o stejné výhody. Jejich dotování by zlepšilo přístup k výrobním a spotřebním centrům a získalo jejich přízeň." # todo: NEW TRANSLATION
 france_md.527.a: "Budeme dál přinášet předměstím spojení a pracovní místa" # todo: NEW TRANSLATION
 france_md.527.b: "Dejme ty peníze raději zemědělsko-potravinářskému sektoru. Využijí je lépe." # todo: NEW TRANSLATION
 france_md.528.t: "Nová ekonomika" # todo: NEW TRANSLATION
 france_md.528.d: "Poté, co jsme se zbavili nákladných a neproduktivních průmyslových odvětví, která se nyní přesouvají jinam, musíme najít novou práci pro stále kvalifikovanější, ale stále nedostatečně zaměstnané obyvatelstvo. Sektor služeb je pro vyspělou zemi, jako je naše, nejbezpečnější sázkou: vytváří vysoké příjmy, produkuje jen málo přímého znečištění a propojuje soukromý sektor se spotřebiteli. Francie je však proslulá také výzkumem, od obrany po medicínu a chemii, a opakované krize si vynutily hluboké škrty ve financování vědy. Možná bychom do něj měli investovat více prostřednictvím dotování výzkumných programů." # todo: NEW TRANSLATION
 france_md.528.a: "Sektor služeb je výnosnější a pomůže snížit nezaměstnanost" # todo: NEW TRANSLATION
 france_md.528.b: "Měli bychom se stát součástí této znalostní společnosti" # todo: NEW TRANSLATION
 france_md.529.t: "Více pracovních míst, nebo více služeb?" # todo: NEW TRANSLATION
 france_md.529.d: "Naše nedávné investice do produktivních sektorů přinášejí výsledky: zastavili jsme spirálu zbídačování a začali obnovovat stabilní trh práce. Mohli bychom pokračovat ve vytváření pracovních míst, která prospějí budoucím generacím, nebo se zaměřit na obnovu veřejných služeb, které naši předchůdci spolu s pracovními místy rozebrali a občané za ně nyní platí vysoké daně, zatímco se jejich rozsah stále zmenšuje. Lepší vzdělání by zefektivnilo naše pracovníky a lepší zdravotnictví by jim umožnilo žít déle. Máme se znovu zaměřit na veřejné služby, nebo je pro nás trh práce stále prioritou?" # todo: NEW TRANSLATION
 france_md.529.a: "Naší prioritou je vytvářet více pracovních míst" # todo: NEW TRANSLATION
 france_md.529.b: "Na trhu práce jsme udělali dost, musíme obnovit veřejné služby" # todo: NEW TRANSLATION
 france_md.530.t: "Přesun našich potravinových zásob" # todo: NEW TRANSLATION
 france_md.530.d: "Když se připravujeme přivést naše potravinové zásoby domů, vyvstává otázka: jak? Náš zemědělsko-potravinářský sektor by nás dokázal uživit sám, ale nekalá konkurence nás nutí dovážet zboží, které nepotřebujeme, a poškozovat planetu dopravou a nezodpovědnou výrobou v zahraničí. Mohli bychom uvalit celní bariéry na potraviny, které nepotřebujeme nebo nesplňují naše normy, a riskovat hněv evropských partnerů a WTO. Nebo bychom mohli zůstat v rámci tržních pravidel, dotovat náš zemědělsko-potravinářský sektor, posílit jeho konkurenceschopnost a omezit závislost na dovozu. Ať už se rozhodneme jakkoli, prostředky máme; jde o vůli." # todo: NEW TRANSLATION
 france_md.530.a: "Trh a volná konkurence škodí našim obyvatelům i planetě" # todo: NEW TRANSLATION
 france_md.530.b: "Musíme hrát podle pravidel" # todo: NEW TRANSLATION
 france_md.531.t: "Francie porušuje zákony volného obchodu" # todo: NEW TRANSLATION
 france_md.531.d: "Právě jsme se z tiskové zprávy francouzské vlády dozvěděli, že se vláda rozhodla znovu zavést celní bariéry na dovoz potravin. Tento krok je začátkem toho, čemu říkají plán lokalizace potravinových dodávek. Přestože má tento plán mnoho zastánců, porušuje řadu zákonů Světové obchodní organizace a Evropské unie. Francouzi podepsali dohody o volném obchodu a měli by být nuceni je dodržovat. Není jisté, zda budou čelit sankcím, ale tento krok poškozuje evropskou integraci. Naši lidé však čekají, jak na tuto otázku odpovíme: udělali správnou, nebo špatnou věc?" # todo: NEW TRANSLATION
 france_md.531.a: "To je nepřijatelné" # todo: NEW TRANSLATION
 france_md.531.b: "Měli bychom udělat totéž" # todo: NEW TRANSLATION
 france_md.532.t: "Naše hospodářská suverenita" # todo: NEW TRANSLATION
 france_md.532.d: "Osvobození od mocností, které nás dlouho ovládaly, něco stojí: desetiletí kapitalistické vlády odprodala velkou část našeho průmyslu zahraničnímu kapitálu, který nyní může uprchnout, a my musíme soukromý sektor obnovit, než se zhroutí. Mohli bychom spustit rozsáhlý program pracovních míst, rychlý, ale nákladný na udržování, dokud nebudou vybudována nová centra, nebo vytvářet pracovní místa v existujících sektorech, což je levnější a udržitelnější, pokud dokážou absorbovat další pracovní sílu." # todo: NEW TRANSLATION
 france_md.532.a: "Tyto nové pracovní prostory dokážeme vytvořit během jednoho roku" # todo: NEW TRANSLATION
 france_md.532.b: "Bez další výstavby můžeme zaměstnat více lidí v existujících zařízeních" # todo: NEW TRANSLATION
 france_md.533.t: "Směrem k levicové koalici" # todo: NEW TRANSLATION
 france_md.533.d: "Po dlouhých měsících vyjednávání jsme našli společnou řeč s širokou škálou levicových stran, které souhlasily, že nebudou naší vládě odporovat a připojí se k naší koalici v rámci společného programu pro spravedlivější Francii. Je to mistrovský tah: naší vládě hrozily strany, které odmítaly uznat její legitimitu, a my jsme vybudovali pevnější většinu, aniž bychom ustoupili ze svých zásad. Dohoda znamená mírné zvýšení sociálních dávek, ale s tímto zvýšením jsme již počítali." # todo: NEW TRANSLATION
 france_md.533.a: "Hrozba vyslovení nedůvěry slábne" # todo: NEW TRANSLATION
 france_md.534.t: "Ostatní levicové strany naši koalici odmítají" # todo: NEW TRANSLATION
 france_md.534.d: "Poslanci ostatních levicových skupin dnes ráno oznámili, že nepodpoří naši navrhovanou koalici, protože mezi našimi programy a prioritami je příliš mnoho rozdílů. To je špatná zpráva pro vládu, která se již snaží udržet svou pozici v rozděleném Národním shromáždění. Stále můžeme vyjednávat o každém návrhu zvlášť, pokaždé však budeme čelit tlaku ze všech stran. Tyto strany se zachovaly nezodpovědně a přestože část veřejnosti náš jednotný přístup podporuje, nemusí to stačit k zajištění přežití vlády." # todo: NEW TRANSLATION
 france_md.534.a: "Byl to odvážný pokus" # todo: NEW TRANSLATION
 france_md.535.t: "Socialistická strana vstupuje do vlády" # todo: NEW TRANSLATION
 france_md.535.d: "Po dlouhých měsících vyjednávání jsme našli společnou řeč se Socialistickou stranou, která souhlasila, že nám přestane odporovat a vstoupí do vlády na základě společného programu z velké části podle našeho návrhu, protože neměla možnost prosadit svůj vlastní. Je to mistrovský tah: naší vládě hrozily strany, které odmítaly uznat její legitimitu, a my jsme vybudovali stabilnější většinu za minimální cenu. Dohoda vyžaduje investice do soukromého sektoru, což není přesně to, co naši voliči očekávali, ale stojí to za to, pokud nám to umožní přijímat zákony." # todo: NEW TRANSLATION
 france_md.535.a: "Léon Blum by byl hrdý" # todo: NEW TRANSLATION
 france_md.536.t: "Socialistická strana odmítá vstoupit do vlády" # todo: NEW TRANSLATION
 france_md.536.d: "Socialističtí poslanci dnes ráno oznámili, že nepodpoří náš návrh koalice, protože mezi našimi programy je příliš mnoho rozdílů a zjevně stále chovají zášť kvůli našim útokům na ně během kampaně. To je špatná zpráva pro vládu, která se již snaží udržet svou pozici v rozděleném Národním shromáždění. Stále můžeme vyjednávat o každém návrhu zvlášť, pokaždé však budeme čelit tlaku ze všech stran. Tyto strany se zachovaly nezodpovědně a přestože část veřejnosti náš jednotný přístup podporuje, nemusí to stačit k zajištění přežití vlády." # todo: NEW TRANSLATION
 france_md.536.a: "Léon Blum se obrací v hrobě" # todo: NEW TRANSLATION
 france_md.537.t: "Dokončení mandátu" # todo: NEW TRANSLATION
 france_md.537.d: "Prezidentovi zbývají do konce mandátu ještě dva roky a stranický aparát se již pře o to, co s nimi. Můžeme nyní vládnout pod barvami úřadujícího prezidenta a přijmout jeho program za svůj, nebo se držet zpátky a nechat volby v roce 2002 rozhodnout, která strana povede Francii, než se k něčemu zavážeme." # todo: NEW TRANSLATION
 france_md.537.a: "Vládnout nyní pod úřadujícím prezidentem" # todo: NEW TRANSLATION
 france_md.537.b: "Počkat na volby v roce 2002" # todo: NEW TRANSLATION
 france_md.538.t: "Jacques Chirac odchází z politiky" # todo: NEW TRANSLATION
 france_md.538.d: "Po porážce své strany v prezidentských volbách se bývalý prezident Chirac rozhodl ukončit politickou kariéru. Od ministra k prezidentovi ušel dlouhou cestu a sledoval, jak se Francie mění během Čtvrté a Páté republiky. Potíže, kterým jeho strana během kampaně čelila, však souvisely i s jeho politikou, která neoslovila všechny. Pokud si z jeho neúspěchu máme odnést jednu lekci, pak to, že se situace změnila; svět již není stejný a nemůžeme nadále uvažovat jako dříve, aniž bychom riskovali. Teď můžeme jen doufat, že si povedeme lépe než on." # todo: NEW TRANSLATION
 france_md.538.a: "Teď bude mít čas jíst svá jablka" # todo: NEW TRANSLATION
 france_md.539.t: "Pád menhiru" # todo: NEW TRANSLATION
 france_md.539.d: "Jean-Marie Le Pen, zakladatel a bývalý vůdce naší strany, se znovu objevuje ve zprávách ze špatných důvodů: po letech popírání holokaustu a antisemitských poznámek nyní odmítá označit maršála Pétaina za zrádce. Od svého odstoupení se střetává s novým směřováním strany v otázkách od důchodů po konflikty minulého století a jeho výroky nám brání konečně zaujmout místo v republikánském hlavním proudu. Mohli bychom ho vyloučit, což by však mohlo odcizit starou gardu, která sdílí jeho názory. Chceme skutečně naši stranu přetvořit podle republikánských standardů, nebo riskovat ztrátu identity?" # todo: NEW TRANSLATION
 france_md.539.a: "Stal se přítěží, musíme ho ze strany vyloučit" # todo: NEW TRANSLATION
 france_md.539.b: "Jen mu připomeňme, aby se choval slušně" # todo: NEW TRANSLATION
 france_md.540.t: "Z Frontu do Sdružení" # todo: NEW TRANSLATION
 france_md.540.d: "Po mnoha vnitřních debatách a stranických konferencích oznámili vedoucí představitelé Národní fronty významné změny v politice a statusu strany. Strana se nyní bude jmenovat Národní sdružení a je zjevně odhodlána zbavit se nálepky krajně pravicové strany. Za tímto účelem oznámila vyloučení řady aktivistů považovaných za příliš radikální a znovu potvrdila závazek zůstat v Evropské unii. Tento vývoj představuje poslední fázi úpadku staré Národní fronty, která se přetváří, aby působila přijatelněji. Přestože jsou tyto změny drobné, musíme udělat vše pro to, aby veřejnost neuvěřila, že se tím cokoli skutečně změnilo." # todo: NEW TRANSLATION
 france_md.540.a: "Přesto jsou nebezpeční" # todo: NEW TRANSLATION
 france_md.541.t: "Pád Svatého stolce" # todo: NEW TRANSLATION
 france_md.541.d: "Cizí mocnost v současnosti okupuje Vatikán. Nemůžeme proto zaručit bezpečnost papežství, dokud Vatikán zůstává pod kontrolou našich protivníků. Naše země však již poskytla papežství domov v Papežském paláci v Avignonu. Nic nám tedy nebrání přivést kardinálské kolegium a současného papeže do Avignonu. Pro křesťanstvo na celém světě to bude zásadní změna, ale s okupovaným Vatikánem jsme jediní, kdo má dostatečnou moc k zajištění ochrany církve, jak to naše království vždy činilo." # todo: NEW TRANSLATION
 france_md.541.a: "Papežství zde bude v bezpečí s námi." # todo: NEW TRANSLATION
 france_md.550.t: "Nicolas Sarkozy vítězí v prezidentských volbách" # todo: NEW TRANSLATION
 france_md.550.d: "Druhé kolo potvrdilo to, co naznačovaly průzkumy. Nicolas Sarkozy, ministr vnitra, který si vybudoval pověst tvrdým postojem proti městským nepokojům, dovedl Unii pro lidové hnutí do Elysejského paláce s jasným náskokem před Ségolène Royalovou. Kampaň se vedla kolem práce, autority a národní identity a účast byla nejvyšší za celou generaci. Nový prezident slibuje rozchod s Chirakovými lety: reformu důchodů, pružnější trh práce a návrat Francie do integrovaného velení Atlantické aliance. Jeho odpůrci varují, že tento rozchod nejtvrději pocítí ti, kteří si ho mohou dovolit nejméně." # todo: NEW TRANSLATION
 france_md.550.a: "Více pracovat, více vydělat." # todo: NEW TRANSLATION
 france_md.551.t: "François Hollande vítězí v prezidentských volbách" # todo: NEW TRANSLATION
 france_md.551.d: "Po pěti letech Sarkozyho prezidentství se socialisté vrátili k moci. François Hollande, dlouho považovaný spíše za stranického manažera než státníka, vyhrál druhé kolo s programem daňové spravedlnosti, znovu vyjednané evropské rozpočtové smlouvy a stažení z Afghánistánu. Finanční krize a krize eurozóny dominovaly každé debatě a odcházející prezident nedokázal uniknout své bilanci. Nová vláda přebírá stagnující ekonomiku, napjatý deficit a evropské partnerství, které očekává, že Francie povede, nikoli aby jen namítala." # todo: NEW TRANSLATION
 france_md.551.a: "Změna začíná nyní." # todo: NEW TRANSLATION
 france_md.552.t: "Emmanuel Macron vítězí v prezidentských volbách" # todo: NEW TRANSLATION
 france_md.552.d: "Starý stranický systém se zhroutil. Ani socialisté, ani republikáni nepostoupili do druhého kola, které se odehrálo mezi hnutím založeným sotva před rokem a Národní frontou. Emmanuel Macron, bývalý investiční bankéř a ministr hospodářství, pohodlně zvítězil s programem liberalizace trhu práce, evropské integrace a politiky, která tvrdí, že není ani pravicová, ani levicová. Jeho hnutí nyní čelí parlamentním volbám bez parlamentní základny a místního aparátu, zatímco jeho odpůrci na obou křídlech již organizují protesty v ulicích." # todo: NEW TRANSLATION
 france_md.552.a: "Ani pravice, ani levice." # todo: NEW TRANSLATION
 france_md.553.t: "Emmanuel Macron je znovu zvolen" # todo: NEW TRANSLATION
 france_md.553.d: "Podruhé proti sobě ve druhém kole stáli prezident a Národní sdružení a podruhé republikánská fronta vydržela, byť s menším náskokem než před pěti lety. Kampaň zastínila válka v Evropě, ceny energií a důchodová reforma, kterou prezident slíbil prosadit bez ohledu na cokoli. Stává se prvním francouzským prezidentem za posledních dvacet let, který získal druhý mandát, a prvním, kterému se to podařilo v době, kdy je krajní pravice blíže moci než kdy dříve." # todo: NEW TRANSLATION
 france_md.553.a: "Druhý mandát, ale těsnější." # todo: NEW TRANSLATION
 france_md.554.t: "Francie navrhuje společná vojenská cvičení" # todo: NEW TRANSLATION
 france_md.554.d: "Francouzští diplomaté nám zaslali návrh na společný vojenský výcvik. Nedávný růst mezinárodního napětí nás totiž vybízí, abychom se jako evropské státy spojili a připravili se na nejhorší. Mohla by to být velmi dobrá iniciativa, která by naše ozbrojené síly připravila na vysoce intenzivní konflikty, jež mohou kdykoli vypuknout. Co jim odpovíme?" # todo: NEW TRANSLATION
 france_md.554.a: "S potěšením, budeme cvičit po jejich boku" # todo: NEW TRANSLATION
 france_md.554.b: "Ne, děkujeme, jejich pomoc nepotřebujeme" # todo: NEW TRANSLATION
 france_md.555.t: "Průvodce politickými cestami" # todo: NEW TRANSLATION
 france_md.555.d: "Většinu cest v politickém stromu lze odemknout tím, že je necháte vyhrát volby v roce 2002, nebo je ručně zvolíte v následujících volbách. Některé cesty jsou však z důvodů realismu a logiky zpočátku nedostupné. Přístup k nim získáte následovně: \nChcete-li odemknout bonapartistickou a royalistickou cestu: zvolte Národní frontu/Národní sdružení (národní populismus). Dokončete fokus „Zaměřit se na nejistotu“, po němž se spustí událost, v níž vám radikální frakce nabídne pomoc. Umožněte jí získat vliv a nechte ji převratem odstranit z moci; poté budete moci přivést k moci bonapartisty nebo royalisty. \nU Francouzské komuny je postup stejný: dokončete fokus „Reforma místo revoluce“ a nechte extremisty, aby vás zbavili moci. \nPro cestu Nepokořené Francie: zvolte Socialistickou stranu (západní socialismus). Dokončete fokus „Rozejít se s odbory“. Tím se spustí rozpad Socialistické strany a odemkne cesta Nepokořené Francie. \nOstatní změny stran jsou rozloženy do různých událostí, ale prozatím jde pouze o kosmetické změny." # todo: NEW TRANSLATION
 france_md.555.a: "Děkuji za vedení" # todo: NEW TRANSLATION
 france_md.556.t: "Úspěšné rozpuštění" # todo: NEW TRANSLATION
 france_md.556.d: "Shromáždění již skutečně neodráželo to, co naši občané pro naši zemi chtěli. Rozpuštění shromáždění ukázalo našim spoluobčanům, o kolik horší mohla být situace vlády. Rozhodli se správně, když dali přednost nám před extremisty." # todo: NEW TRANSLATION
 france_md.556.a: "Byl to skvělý nápad" # todo: NEW TRANSLATION
 france_md.503.t: "Opozice vůči [FRA.GetLeader]: Jaký je trend?" # todo: NEW TRANSLATION
 france_md.503.d: "Jak se blíží konec mandátu prezidenta [FRA.GetLeader], prezidentská kampaň vstupuje do závěrečné fáze a rozložení volebních sil se vyjasňuje. Favorit Lionel Jospin působil za Chiraka jako premiér a prosazoval sociálnědemokratickou politiku v souladu s evropskými standardy, přičemž se distancoval od socialistické tradice: moderní, ale nikoli socialistický. Různí levicoví kandidáti ze Zelených a Francouzské komunistické strany nemají prostředky na úplné vítězství, přesto však mohou získat na síle. Je levice jako celek jasným favoritem, nebo by její rozdělení mohlo do druhého kola vynést jiného kandidáta?" # todo: NEW TRANSLATION
 france_md.503.a: "Levice si získává voliče" # todo: NEW TRANSLATION
 france_md.503.b: "Žádný z levicových kandidátů nezískal podporu, v niž doufal" # todo: NEW TRANSLATION
 france_md.986.t: "Lionel Jospin čelí kritice" # todo: NEW TRANSLATION
 france_md.986.d: "Ačkoli je Lionel Jospin favoritem levice v nadcházejících volbách, jeho program nemá uvnitř levice jednomyslnou podporu, protože někteří jej považují za příliš liberální a příliš podobný Chirakovu programu. Proti němu stojí Francouzská komunistická strana; od konce studené války je sice jen stínem své někdejší podoby, stále však má spojence v radikální levici a může oslovit ty, které zklamalo druhé funkční období bývalého prezidenta Mitterranda. Mohla by Jospina napadnout kvůli jeho posunu k liberalismu, ale udělá to?" # todo: NEW TRANSLATION
 france_md.986.a: "PCF se rozhodla na Lionela Jospina nezaútočit" # todo: NEW TRANSLATION
 france_md.986.b: "PCF si dokázala získat levicové voliče" # todo: NEW TRANSLATION
 france_md.986.c: "Neprůkazný útok PCF" # todo: NEW TRANSLATION
 france_md.987.t: "Lionel Jospin má výrazný náskok" # todo: NEW TRANSLATION
 france_md.987.d: "Triumf Lionela Jospina a Socialistické strany na levici nikdo nezpochybňuje. Ačkoli byl dříve terčem kritiky, jeho odpůrci nejsou v pozici, aby jej zpochybnili nebo postoupili do druhého kola. Ať už s jeho programem souhlasíme, či nikoli, ve druhém kole prezidentských voleb se utká s [FRA.GetLeader]." # todo: NEW TRANSLATION
 france_md.987.a: "Nemohlo to dopadnout jinak" # todo: NEW TRANSLATION
 france_md.988.t: "Komunistické znovuzrození" # todo: NEW TRANSLATION
 france_md.988.d: "Zaútočit na Jospina kvůli jeho vazbám na levici bylo správné rozhodnutí. Socialistické hlasy se rozdělily mezi levici a střed, což PCF dodalo důvěryhodnost, která jí chyběla k vedení opozice proti liberální a konzervativní politice, jež příliš dlouho převládala. PCF si zajistila spojenectví s dalšími levicovými partnery, jako jsou Revoluční komunistická liga a Dělnický boj. Centristé nespokojení s [FRA.GetLeader] by však dali před Jospinem přednost radikální alianci a ve druhém kole pravděpodobně budou hlasovat proti nám. Možná můžeme výměnou za jejich mlčení zajistit místní investice v jejich městech." # todo: NEW TRANSLATION
 france_md.988.a: "Centristé se zdrží hlasování" # todo: NEW TRANSLATION
 france_md.988.b: "Centristé vyzvou ke sjednocení proti krajní levici" # todo: NEW TRANSLATION
 france_md.989.t: "Nepravděpodobný favorit" # todo: NEW TRANSLATION
 france_md.989.d: "Závěr této prezidentské kampaně se ukázal být pro mnoho stran bouřlivý. Po útocích PCF na Lionela Jospina se komunisté a socialisté pustili do neúnavné mediální bitvy. Protože ani jedna strana nedokázala prosadit svůj případ, levicoví voliči se obrátili k méně kontroverznímu a umírněnějšímu kandidátovi. Strana zelených využila příležitosti a představila se jako hlas klidu a rozumu uprostřed bouře. Je proto velmi pravděpodobné, že Zelení postoupí do druhého kola, kde se utkají s bývalým prezidentem oslabeným koncem jeho mandátu." # todo: NEW TRANSLATION
 france_md.989.a: "Kdo by tomu byl věřil?" # todo: NEW TRANSLATION
 france_md.990.t: "Ani levice, ani pravice" # todo: NEW TRANSLATION
 france_md.990.d: "Když už jsou konzervativci ve druhém kole a levice je v rozkladu, bývalý prezident se zdá být jistým vítězem, přestože nejistoty přetrvávají. Někteří Francouzi jsou unaveni dělením na levici a pravici, které po desetiletí utvářelo politiku a již neodpovídá době zaměřené na stabilitu a evropskou integraci. Liberální Unie pro francouzskou demokracii má proto co nabídnout: Chirakova politika nezávislosti už nemá ve světě vznikajících nových mocností a bloků velkou váhu. Liberální střed má svou úlohu, ale přesvědčí voliče o této nové realitě?" # todo: NEW TRANSLATION
 france_md.990.a: "Liberálové dokážou upoutat pozornost veřejnosti" # todo: NEW TRANSLATION
 france_md.990.b: "Francouzi zůstanou věrní své suverenitě" # todo: NEW TRANSLATION
 france_md.991.t: "Suverenistický tábor je rozdělený" # todo: NEW TRANSLATION
 france_md.991.d: "Protože liberální střed nedokázal prosadit svůj program, voliči unavení dělením na levici a pravici se obrátili k suverenistům. Tento tábor však hovoří dvěma hlasy. Sdružení pro republiku přináší gaullistickou tradici národní nezávislosti do hlavního proudu, je úctyhodné a schopné vládnout, zatímco Národní fronta nabízí tvrdší kurz, který se zavedené strany dvě desetiletí snažily držet pod kontrolou. Obě strany si nárokují stejné rozčarované voliče. To, která z nich postoupí do druhého kola, rozhodne, zda francouzský euroskepticismus zůstane záležitostí vládnoucí pravice, nebo zcela prolomí sanitární kordon." # todo: NEW TRANSLATION
 france_md.991.a: "Gaullistická tradice stále ovládá suverenistické hlasy" # todo: NEW TRANSLATION
 france_md.991.b: "Národní fronta využije nespokojenosti" # todo: NEW TRANSLATION
 france_md.510.t: "Nikdo to nemohl předvídat" # todo: NEW TRANSLATION
 france_md.510.d: "Vzhledem k neschopnosti stran upoutat pozornost voličů nemá žádná z nich dost síly, aby proti [FRA.GetLeader] postoupila do druhého kola. Národní fronta těží ze zmizení svých soupeřů z centra pozornosti, unikla jejich kontroverzím a navzdory svému vůdci Jeanu-Mariemu Le Penovi by mohla postoupit. Zůstává to nepravděpodobné: Lionel Jospin je stále favoritem a proti [FRA.GetLeader] by jistě prohrál. Pokud by však FN do druhého kola postoupila, jak by reagovaly ostatní strany?" # todo: NEW TRANSLATION
 france_md.510.a: "Strany nebudou mít z nástupu extremismu obavy" # todo: NEW TRANSLATION
 france_md.510.b: "Všechny strany vyzvou voliče, aby hlasovali proti Národní frontě" # todo: NEW TRANSLATION
 france_md.511.t: "Den voleb" # todo: NEW TRANSLATION
 france_md.511.d: "Po měsících bouřlivé kampaně plné zvratů konečně nastal čas, aby Francouzi hlasovali. Jde teprve o první kolo, jehož cílem je zúžit pole na dva kandidáty, kteří získali největší podporu francouzské veřejnosti. Pokud žádný kandidát nezíská většinu, proběhne druhé kolo, které mezi nimi rozhodne." # todo: NEW TRANSLATION
 france_md.511.a: "Pojďme volit!" # todo: NEW TRANSLATION
 france_md.512.t: "Národní fronta má podle předpovědí vyhrát prezidentské volby" # todo: NEW TRANSLATION
 france_md.512.d: "K překvapení všech zvítězila v prvním kole Národní fronta, přestože všechny průzkumy předpovídaly souboj Jospina s [FRA.GetLeader]. Kvůli neschopnosti ostatních kandidátů získat voliče postoupila Fronta do druhého kola a pro [FRA.GetLeader] situace vypadá chmurně: ostatní strany nevyzvaly voliče, aby jej podpořili, protože jeho politika je pro některé příliš kontroverzní. Část voličů se pravděpodobně sjednotí proti kandidátovi krajní pravice, ale porážka Le Pena, který se staví do role kandidáta proti establishmentu, není zdaleka zaručena." # todo: NEW TRANSLATION
 france_md.512.a: "Co se právě stalo?" # todo: NEW TRANSLATION
 france_md.513.t: "Národní fronta postupuje do druhého kola" # todo: NEW TRANSLATION
 france_md.513.d: "K překvapení všech zvítězila v prvním kole Národní fronta, přestože všechny průzkumy předpovídaly souboj Jospina s [FRA.GetLeader]. Kvůli neschopnosti ostatních kandidátů získat voliče Fronta postoupila do druhého kola. Naštěstí by měl zvítězit [FRA.GetLeader]: politické strany a občanská společnost, šokované postupem strany krajní pravice do druhého kola, vyzvaly k masovému hlasování proti Le Penovi. Po celé zemi proběhly velké demonstrace na podporu odstupujícího prezidenta. Jde o historickou událost; doufejme, že zůstane jedinou." # todo: NEW TRANSLATION
 france_md.513.a: "Jak jsme se proboha dostali do této situace?" # todo: NEW TRANSLATION
 france_md.514.t: "PCF byla prohlášena vítězem prezidentských voleb" # todo: NEW TRANSLATION
 france_md.514.d: "K překvapení všech zvítězila v prvním kole Francouzská komunistická strana, jen několik měsíců poté, co se nacházela na nejnižším bodě od konce studené války. Slabost kandidáta Jospina a aliance radikální levice umožnily PCF sjednotit levici a získat jasný náskok před druhým kolem, přičemž socialisté a centristé souhlasili, že proti ní nebudou vystupovat, pokud neopustí EU. Její vůdce vyvážil odpor k liberálnímu řádu s reformismem, aby neodradil střed. Vítězství PCF je nepochybné, ale dokáže svou koalici udržet pohromadě?" # todo: NEW TRANSLATION
 france_md.514.a: "Lepší časy jsou konečně tady" # todo: NEW TRANSLATION
 france_md.515.t: "PCF postoupila do druhého kola" # todo: NEW TRANSLATION
 france_md.515.d: "K překvapení všech zvítězila v prvním kole Francouzská komunistická strana, jen několik měsíců poté, co se nacházela na nejnižším bodě od konce studené války. Slabost kandidáta Jospina a aliance radikální levice umožnily PCF zajistit si místo ve druhém kole. Její vítězství však není úplné: centristé oznámili, že budou hlasovat pro [FRA.GetLeader], protože vítězství radikální levice považují za špatné znamení pro evropskou integraci a trhy. Druhé kolo ještě neproběhlo, ale je velmi pravděpodobné, že [FRA.GetLeader] znovu zvítězí." # todo: NEW TRANSLATION
 france_md.515.a: "Bylo to o vlásek" # todo: NEW TRANSLATION
 france_md.516.t: "RPF postoupila do druhého kola" # todo: NEW TRANSLATION
 france_md.516.d: "K překvapení všech byl odstupující prezident vyřazen z druhého kola, poražen vlastní stranou: gaullista Charles Pasqua dokázal získat dost konzervativců a suverenistů z pravice, aby narušil kampaň [FRA.GetLeader]. RPF však ve druhém kole není sama. Ut affronter Lionel Jospin, socialistický kandidát, který navzdory vnitřnímu rozkolu na levici postoupil do druhého kola. Tento souboj bude nelítostný, protože nejde pouze o socialismus proti konzervatismu: příští týden Francouzi rozhodnou, zda chtějí více, nebo méně Evropy." # todo: NEW TRANSLATION
 france_md.516.a: "Suverenita zvítězí" # todo: NEW TRANSLATION
 france_md.516.b: "Protestní hlas zůstává v menšině" # todo: NEW TRANSLATION
 france_md.517.t: "UDF postupuje do druhého kola" # todo: NEW TRANSLATION
 france_md.517.d: "Sjednocení proevropských voličů za UDF umožnilo straně postoupit do druhého kola. Socialisté nebyli jediní, kdo prosazoval Evropskou unii, a liberálové měli blíže k liberálním hodnotám Evropské unie. Lidé často dávají přednost originálu před napodobeninou. UDF se proto podařilo připojit k úřadujícímu prezidentovi ve druhém kole. Jde tedy o souboj Chirakovy politiky nezávislosti s liberálním postojem Evropy za každou cenu. Volby budou pravděpodobně těsné, protože hlavní bloky jsou v této otázce samy hluboce rozdělené. Naštěstí nebudeme dlouho čekat, druhé kolo je za rohem." # todo: NEW TRANSLATION
 france_md.517.a: "Starý konzervativec je držen v šachu" # todo: NEW TRANSLATION
 france_md.517.b: "Program UDF se ukazuje být pro voliče příliš liberální" # todo: NEW TRANSLATION
 france_md.518.t: "Zelení postupují do druhého kola" # todo: NEW TRANSLATION
 france_md.518.d: "Po kampani mezi levicovými stranami se Zeleným k překvapení všech podařilo postoupit do druhého kola. Jejich sociální a environmentální program představuje špičku pokroku a díky tomu, že si zachovali klid během střetů PCF a PS, se stali ztělesněním nejmoudřejšího a nejspravedlivějšího řešení. Nyní se ve druhém kole připojují k odstupujícímu prezidentovi. Souboj bude pravděpodobně nelítostný, ale tentokrát panuje uvnitř každého bloku jednota: levice volí progresivismus, pravice konzervatismus a střet příštího týdne se bude týkat stejně životního prostředí jako sociálních otázek." # todo: NEW TRANSLATION
 france_md.518.a: "Zastaralý konzervativní software už nestačí výzvám našeho tisíciletí" # todo: NEW TRANSLATION
 france_md.518.b: "Životní prostředí stále nemá dostatečnou prioritu" # todo: NEW TRANSLATION
 france_md.519.t: "Lionel Jospin postoupil do druhého kola" # todo: NEW TRANSLATION
 france_md.519.d: "Jak předpovídaly všechny průzkumy, socialistický kandidát bez větších potíží postoupil do druhého kola. Jeho moderní, proevropský program získal socialisty i centristy, čímž si vybudoval silnou voličskou základnu, zatímco radikálnější levicové strany, hluboce rozdělené, nepředstavovaly pro bývalého premiéra hrozbu. Tento týden se utká se svým soupeřem v dalším střetu progresivismu a konzervatismu. Průzkumy jsou však těsné a Jospin možná bude potřebovat podporu levicových stran, protože RPR by mohla těžit z podpory pravicových skupin, které nejsou ochotny přijmout socialistického prezidenta." # todo: NEW TRANSLATION
 france_md.519.a: "Jospin si získá zbytek levice" # todo: NEW TRANSLATION
 france_md.519.b: "Jospin nedokázal získat voliče nalevo od sebe, protože jeho program byl příliš liberální" # todo: NEW TRANSLATION
 FRA_Macron_eco: "Macronův zákon" # todo: NEW TRANSLATION
 FRA_Macron_eco_desc: "Rozhodli jsme se řídit politikou našeho ministra financí Emmanuela Macrona. Zákon zjednoduší investice a zaměstnávání a zároveň omezí vládní výdaje." # todo: NEW TRANSLATION
 FRA_Ferrand_eco: "Ferrandův zákon" # todo: NEW TRANSLATION
 FRA_Ferrand_eco_desc: "Rozhodli jsme se řídit politikou našeho ministra financí Oliviera Ferranda. Zákon zjednoduší investice a zaměstnávání a zároveň omezí vládní výdaje." # todo: NEW TRANSLATION
 FRA_vigipirate_surveillance: "Plán Vigipirate" # todo: NEW TRANSLATION
 FRA_vigipirate_surveillance_desc: "Abychom ochránili naše občany před možnými teroristickými útoky, musíme být obezřetnější a více zasahovat do soukromí." # todo: NEW TRANSLATION
 FRA_ineluctable_collapse: "Hroutící se koalice" # todo: NEW TRANSLATION
 FRA_ineluctable_collapse_desc: "Naše strana a koalice se rozpadají; musíme to rychle napravit, než bude pozdě!" # todo: NEW TRANSLATION
 FRA_manif_pour_tous: "La Manif pour Tous" # todo: NEW TRANSLATION
 FRA_manif_pour_tous_desc: "Statisíce lidí v ulicích každý měsíc, konzervativní hnutí, které pravice nedokázala za dvacet let vybudovat, a vládní strana, která nyní musí prosazovat zákony navzdory němu." # todo: NEW TRANSLATION
 FRA_grand_debat: "Le Grand Débat National" # todo: NEW TRANSLATION
 FRA_grand_debat_desc: "Deset tisíc radnic, dva miliony příspěvků a balíček ústupků dostatečně velký na vyklizení kruhových objezdů. Mír byl skutečný. Stejně jako účet." # todo: NEW TRANSLATION
 FRA_bassin_minier: "Závazek těžební pánve" # todo: NEW TRANSLATION
 FRA_bassin_minier_desc: "Pece znovu hoří a ve staré uhelné oblasti a na jihu se otevřela pracovní místa. Slib drží krajní pravici zpátky tak dlouho, dokud jej dodržujeme." # todo: NEW TRANSLATION
 FRA_resist_inevitable: "Stabilizační úsilí" # todo: NEW TRANSLATION
 FRA_resist_inevitable_desc: "Úpadek není nevratný. Naši aktivisté se vrátili ke dveřím voličů a odklon od nás se zpomalil." # todo: NEW TRANSLATION
 FRA_resist_inevitable2: "Stabilizační úsilí" # todo: NEW TRANSLATION
 FRA_resist_inevitable2_desc: "Krvácení se zastavilo. Stranu jsme stabilizovali a obrátili pozornost k průmyslové základně, na níž jsou naši voliči závislí." # todo: NEW TRANSLATION
 FRA_resist_inevitable3: "Stabilizační úsilí" # todo: NEW TRANSLATION
 FRA_resist_inevitable3_desc: "Přežili jsme vlastní nekrology. Strana znovu stojí na pevných základech, s ustálenou základnou a programem, na který nyní naši soupeři musí reagovat." # todo: NEW TRANSLATION
 FRA_socialism_renew: "Obnovený socialismus" # todo: NEW TRANSLATION
 FRA_socialism_renew_desc: "Znovu jsme vybudovali legitimitu naší strany na pevných základech. Budoucnost leží před námi." # todo: NEW TRANSLATION
 FRA_pension_reform: "Důchodová reforma" # todo: NEW TRANSLATION
 FRA_pension_reform_desc: "Vzhledem k rozpočtové krizi, jíž čelíme, jsme museli zvýšit důchodový věk našich občanů; nebyli z toho nadšení, ale museli jsme to udělat." # todo: NEW TRANSLATION
 FRA_french_rearmament: "Přezbrojení – fáze 1" # todo: NEW TRANSLATION
 FRA_french_rearmament_desc: "Vzhledem k opětovnému růstu napětí v Evropě nemáme jinou možnost než se přezbrojit, abychom odvrátili nejhorší." # todo: NEW TRANSLATION
 FRA_french_rearmament2: "Přezbrojení – fáze 2" # todo: NEW TRANSLATION
 FRA_french_rearmament2_desc: "Výcvik většího počtu vojáků nestačí; musíme zvýšit naši schopnost vyrábět zbraně." # todo: NEW TRANSLATION
 FRA_french_rearmament3: "Dokončené přezbrojení" # todo: NEW TRANSLATION
 FRA_french_rearmament3_desc: "Naše obyvatelstvo i ozbrojené síly jsou připraveny čelit rozsáhlému konfliktu." # todo: NEW TRANSLATION
 french_nuclear_expert: "Francouzští jaderní odborníci" # todo: NEW TRANSLATION
 french_nuclear_expert_desc: "Přijali jsme pomoc francouzských odborníků na jaderné technologie. Pomohou nám vybudovat energetickou nezávislost." # todo: NEW TRANSLATION
 french_dissuasion: "Francouzské jaderné odstrašení" # todo: NEW TRANSLATION
 french_dissuasion_desc: "Souhlasili jsme s přijetím ochrany Francie a Evropské unie v případě konfliktu s nepřátelskou mocností." # todo: NEW TRANSLATION
 FRA_Our_project: "Náš projekt pro Francii" # todo: NEW TRANSLATION
 FRA_Our_project_desc: "Navzdory počátečnímu odporu veřejnosti si lidé uvědomili, že vše, co děláme, musí sloužit k ochraně budoucnosti Francie. Jsme více než kdy dříve chráněni před hospodářskými a geopolitickými otřesy. A tak tomu bude ještě dlouho." # todo: NEW TRANSLATION
 FRA_french_independant1: "Vlastní cesta" # todo: NEW TRANSLATION
 FRA_french_independant1_desc: "Francie se nezařadí za žádný z bloků. Díky odstupu máme sluch každé další mocnosti, která odmítá zvolit si pána." # todo: NEW TRANSLATION
 FRA_french_independant2: "Neodpovídáme žádnému hlavnímu městu" # todo: NEW TRANSLATION
 FRA_french_independant2_desc: "Naše odmítnutí přidat se k některému bloku se změnilo v pevnou politiku. Washington ani Moskva již neočekávají náš hlas a nezúčastněný svět nás považuje za jednoho ze svých." # todo: NEW TRANSLATION
 FRA_french_independant3: "Nezávislost ve zbrani" # todo: NEW TRANSLATION
 FRA_french_independant3_desc: "Nezávislost již není diplomatickým postojem, ale obrannou doktrínou. Národ, který se nikomu nezodpovídá, musí být schopen ubránit vlastní půdu bez pomoci, a my toho nyní schopni jsme." # todo: NEW TRANSLATION
 FRA_NATO_support: "Podpora NATO" # todo: NEW TRANSLATION
 FRA_NATO_support_desc: "Opětovným potvrzením podpory naší alianci jsme navázali partnerství s dalšími členskými zeměmi." # todo: NEW TRANSLATION
 FRA_entente_china: "Dohoda s Čínou" # todo: NEW TRANSLATION
 FRA_entente_china_desc: "Uzavřeli jsme s Čínou dohody, které usnadní obchod mezi našimi zeměmi." # todo: NEW TRANSLATION
 FRA_regulation: "Regulace trhu" # todo: NEW TRANSLATION
 FRA_regulation_desc: "Souhlasem s regulací trhu a jeho činností se můžeme vyhnout budoucím krizím." # todo: NEW TRANSLATION
 FRA_eternal_fra: "Věčná Francie" # todo: NEW TRANSLATION
 FRA_eternal_fra_desc: "Blížíme se ke konci našeho programu a jsme přesvědčeni, že jsme světu ukázali, že se Francie vrátila a nikdy nezmizí z mezinárodní scény." # todo: NEW TRANSLATION
 FRA_europhile_anger_idea: "Proevropské demonstrace" # todo: NEW TRANSLATION
 FRA_europhile_anger_idea_desc: "Někteří obyvatelé se zdráhají opustit Evropskou unii. Potrvá to jen nějakou dobu, ale musíme zajistit, aby Francouzi pochopili, že jde o jedinou cestu vpřed." # todo: NEW TRANSLATION
 FRA_EU_Retaliate: "Obnova ekonomiky" # todo: NEW TRANSLATION
 FRA_EU_Retaliate_desc: "Odchod z Evropské unie nás uvrhl do obtížné hospodářské situace, ale vzchopíme se, ať to stojí cokoli." # todo: NEW TRANSLATION
 FRA_EU_Retaliate2: "Počáteční obnova" # todo: NEW TRANSLATION
 FRA_EU_Retaliate2_desc: "Naše úsilí začíná přinášet výsledky; ekonomika se zotavuje a tentokrát na nás nikdo netlačí ani nám nebrání nakládat s vlastními penězi podle našeho uvážení." # todo: NEW TRANSLATION
 FRA_russian_cooperation1: "Ruská spolupráce" # todo: NEW TRANSLATION
 FRA_russian_cooperation1_desc: "Ruská vláda souhlasila, že se s námi podělí o své průmyslové znalosti. Kéž tato spolupráce pokračuje." # todo: NEW TRANSLATION
 FRA_russian_cooperation2: "Ruské partnerství" # todo: NEW TRANSLATION
 FRA_russian_cooperation2_desc: "Ruská vláda souhlasila, že se s námi podělí o své průmyslové a vojenské znalosti. Kéž tato spolupráce pokračuje." # todo: NEW TRANSLATION
 FRA_a_certain_idea: "Jistá idea Francie" # todo: NEW TRANSLATION
 FRA_a_certain_idea_desc: "Dokázali jsme dojít na konec naší cesty. Zachránili jsme Francii před odsunutím na vedlejší kolej ve prospěch Evropy. Nezávislost Francie je zajištěna. Náš mistr Charles de Gaulle by na nás byl hrdý." # todo: NEW TRANSLATION
 FRA_blocade: "Narušené obchodní toky" # todo: NEW TRANSLATION
 FRA_blocade_desc: "Odmítli jsme podlehnout francouzskému vydírání, a tak dělají vše, co mohou, aby nám zabránili v přístupu zboží ze zbytku Evropské unie." # todo: NEW TRANSLATION
 FRA_shocking: "Zklamané obyvatelstvo" # todo: NEW TRANSLATION
 FRA_shocking_desc: "Naši lidé byli plánem Šesté republiky velmi nadšeni, ale nakonec jsme se rozhodli ponechat ústavu beze změny. Nebyli z toho šťastní." # todo: NEW TRANSLATION
 FRA_draft6threp: "Politická nestabilita" # todo: NEW TRANSLATION
 FRA_draft6threp_desc: "Naše touha po radikální změně ústavy naší republiky vyvolala mezi obyvatelstvem velké nadšení. Otevírá lidem nové obzory. Zároveň však připravuje půdu pro vznik nových politických hnutí, která nám ne vždy budou nakloněna." # todo: NEW TRANSLATION
 FRA_fail6threp: "Selhání reformace" # todo: NEW TRANSLATION
 FRA_fail6threp_desc: "Nepodařilo se nám osvobodit náš lid od Páté republiky; tváří v tvář obtížím při hledání konsenzu nakonec ztratil naději. Možná se nám podaří prosadit změnu našich zákonů, ale z pohledu našeho lidu jsme selhali v tom, že jsme mu nepřinesli změnu, v niž doufal." # todo: NEW TRANSLATION
 FRA_ecological_transition: "Zajistit ekologickou transformaci" # todo: NEW TRANSLATION
 FRA_ecological_transition_desc: "Abychom zajistili budoucnost příštích generací, musíme chránit životní prostředí. K tomu musíme změnit způsob, jakým spotřebováváme a vyrábíme." # todo: NEW TRANSLATION
 FRA_insoumission: "L'Insoumission" # todo: NEW TRANSLATION
 FRA_insoumission_desc: "Úspěšně jsme uskutečnili program, pro který jsme byli zvoleni. Učinili jsme Francii sociálněji orientovanou, ohleduplnější k životnímu prostředí a humanističtější než kdykoli předtím. Stále však máme mnoho práce a této výzvě se postavíme. Musíme si vést ještě lépe." # todo: NEW TRANSLATION
 FRA_eu_social_climate: "Sociální a environmentální reformy" # todo: NEW TRANSLATION
 FRA_eu_social_climate_desc: "Souhlasili jsme, že budeme následovat příklad La France Insoumise. Naši lidé se jejich příkladem inspirovali. Přestože si to vybírá daň na našich financích, lze to považovat za dlouhodobou investici." # todo: NEW TRANSLATION
 FRA_research_boost: "Investice do výzkumu" # todo: NEW TRANSLATION
 FRA_research_boost_desc: "Výrazně jsme investovali do výzkumu a vzdělávání, aby byly budoucí generace ještě lépe vybaveny pro řešení moderních výzev. Z dlouhodobého hlediska by se to mělo vyplatit." # todo: NEW TRANSLATION
 FRA_refit_network: "Modernizace naší dopravní sítě" # todo: NEW TRANSLATION
 FRA_refit_network_desc: "Abychom optimalizovali přepravu zboží a cestujících, musíme nejprve modernizovat naši dopravní síť. Vyčlenili jsme na to potřebné prostředky." # todo: NEW TRANSLATION
 FRA_eden_garden: "Naše rajská zahrada" # todo: NEW TRANSLATION
 FRA_eden_garden_desc: "Tím, že jsme vynaložili veškeré úsilí na ochranu naší země a světa před ničivými dopady klimatických změn, položili jsme základy společnosti vybavené k řešení výzev našeho tisíciletí. Boj proti klimatickým změnám bude vyžadovat další úsilí, ale udělali jsme vše, co bylo v našich silách, abychom hnutí vedli." # todo: NEW TRANSLATION
 FRA_eu_green_reform: "Ekologické reformy" # todo: NEW TRANSLATION
 FRA_eu_green_reform_desc: "Rozhodli jsme se následovat příklad francouzských Zelených a investovat do zelené transformace. Ačkoli to zpomalí růst naší země, jde o investici do budoucích generací." # todo: NEW TRANSLATION
 FRA_EU_transit: "Fond podpory ekologické transformace" # todo: NEW TRANSLATION
 FRA_EU_transit_desc: "Souhlasili jsme s účastí ve fondu podpory ekologické transformace. Tuto iniciativu zahájili francouzští Zelení a jejím cílem je pomoci nám přejít od uhlíkového hospodářství k nízkouhlíkovému." # todo: NEW TRANSLATION
 FRA_eu_ban_fossile: "Postupné ukončení využívání fosilních paliv" # todo: NEW TRANSLATION
 FRA_eu_ban_fossile_desc: "Postupně ukončujeme využívání fosilních paliv. Naše vozidla budou jezdit na elektřinu a fosilní paliva se budou používat jen pro okrajové účely. Tato transformace, zahájená francouzskými Zelenými, bude nákladná. Je to však investice do naší budoucnosti a nezávislosti na státech těžících ropu." # todo: NEW TRANSLATION
 FRA_regulation_agra: "Zemědělské předpisy" # todo: NEW TRANSLATION
 FRA_regulation_agra_desc: "Souhlasili jsme s dodržováním předpisů Evropské unie týkajících se výroby potravin. Byla to naše jediná možnost, pokud jsme nechtěli přijít o klíčového obchodního partnera." # todo: NEW TRANSLATION
 FRA_regulation_indus: "Průmyslové předpisy" # todo: NEW TRANSLATION
 FRA_regulation_indus_desc: "Souhlasili jsme s dodržováním předpisů Evropské unie týkajících se výroby zboží. Byla to naše jediná možnost, pokud jsme nechtěli přijít o klíčového obchodního partnera." # todo: NEW TRANSLATION
 FRA_regulation_fuel: "Předpisy pro těžbu ropy" # todo: NEW TRANSLATION
 FRA_regulation_fuel_desc: "Souhlasili jsme s dodržováním předpisů Evropské unie týkajících se těžby paliv. Byla to naše jediná možnost, pokud jsme nechtěli přijít o klíčového obchodního partnera." # todo: NEW TRANSLATION
 FRA_EU_rail: "Budování evropské dopravní sítě" # todo: NEW TRANSLATION
 FRA_EU_rail_desc: "Souhlasili jsme s pomocí Francii a zbytku Evropské unie při společném budování lepší dopravní sítě, která usnadní obchod a optimalizuje přepravu zboží." # todo: NEW TRANSLATION
 FRA_eu_pcf_reform: "Kupování sociálního smíru" # todo: NEW TRANSLATION
 FRA_eu_pcf_reform_desc: "Souhlasili jsme s ústupky naší radikální levici poté, co se začala bouřit po vítězství komunismu ve Francii. Dali jsme jí, co chtěla, a nyní by měla mlčet." # todo: NEW TRANSLATION
 FRA_fr_military_assistance: "Francouzská vojenská pomoc" # todo: NEW TRANSLATION
 FRA_fr_military_assistance_desc: "Přijali jsme pomoc Francie s přípravou našich ozbrojených sil na konflikt vysoké intenzity s Ruskem. V den, kdy překročí naše hranice, budeme připraveni." # todo: NEW TRANSLATION
 FRA_european_internationale: "Evropská internacionála" # todo: NEW TRANSLATION
 FRA_european_internationale_desc: "Vytvořili jsme alianci s další komunistickou mocností v Evropě. Společně jednou provždy porazíme kapitalismus a fašismus." # todo: NEW TRANSLATION
 FRA_international_will_be_humankind: "Internacionála bude lidským rodem" # todo: NEW TRANSLATION
 FRA_international_will_be_humankind_desc: "Podařilo se nám upevnit naši těžce vydobytou moc. Dosáhli jsme nemožného: zajistili jsme trvalý triumf komunismu ve Francii. Stále je třeba mnoho vykonat, ale položili jsme správné základy pro boj proti kapitalismu a fašismu ve Francii." # todo: NEW TRANSLATION
 FRA_eu_FN_reform: "Zajištění bezpečnosti" # todo: NEW TRANSLATION
 FRA_eu_FN_reform_desc: "Pozitivně jsme reagovali na výzvu našeho lidu k zavedení národní preference a řešení nejistoty. Ačkoli jsou tyto reformy důsledkem vzestupu krajní pravice v Evropě, posilují také naši schopnost kontrolovat obyvatelstvo, což je dobře." # todo: NEW TRANSLATION
 FRA_nuke_boost: "Jaderná převaha" # todo: NEW TRANSLATION
 FRA_nuke_boost_desc: "Jaderná energie nám dodává energii již desítky let; je to fantastický způsob levné výroby nízkouhlíkové energie. Měli bychom pouze posílit dohled nad těmito reaktory, aby se nestalo nic vážného." # todo: NEW TRANSLATION
 FRA_Boreal_Space: "Boreální prostor" # todo: NEW TRANSLATION
 FRA_Boreal_Space_desc: "Boreální prostor je partnerství mezi Ruskou sférou a Frankosférou, jehož cílem je začlenit Rusko do evropské aliance. Naším dnešním cílem je bojovat proti ultraglobalistické hrozbě, nepříteli, kterého sdílíme." # todo: NEW TRANSLATION
 FRA_france_for_french: "Francie Francouzům" # todo: NEW TRANSLATION
 FRA_france_for_french_desc: "Od našeho založení jsme museli čelit proimigrační frakci, která proti nám vždy stála jednotně. Nyní, když jsme dokončili náš program, jsme prokázali schopnost vést a směřovat Francii k jejímu osudu; další odpor je nyní zbytečný." # todo: NEW TRANSLATION
 FRA_red_purges: "Čistka důstojnického sboru" # todo: NEW TRANSLATION
 FRA_red_purges_desc: "Starý důstojnický sbor nikdy nebyl náš, a tak jsme ho rozbili a povýšili vojáky z řad mužstva. Velení je nyní loajální a levné na nahrazení, ale profesionální armádu jsme vyměnili za armádu, která se své řemeslo stále učí pod palbou." # todo: NEW TRANSLATION
 FRA_people_constitution: "Lidová ústava" # todo: NEW TRANSLATION
 FRA_people_constitution_desc: "Naše revoluce byla úspěšná, ale svou moc musíme upevnit tím, že dělníkům dáme možnost rozhodnout, jak chtějí být spravováni." # todo: NEW TRANSLATION
 FRA_commies_redarmy1: "Nová Rudá armáda" # todo: NEW TRANSLATION
 FRA_commies_redarmy1_desc: "Naše revoluce potřebuje armádu, která se bude bránit a šířit její ideály. Na základech francouzské armády jsme vytvořili novou sílu, která bude bránit lid a revoluci." # todo: NEW TRANSLATION
 FRA_commies_redarmy2: "Nová Rudá armáda" # todo: NEW TRANSLATION
 FRA_commies_redarmy2_desc: "Naše revoluce potřebuje armádu, která se bude bránit a šířit její ideály. Na základech francouzské armády jsme vytvořili novou sílu, která bude bránit lid a revoluci." # todo: NEW TRANSLATION
 FRA_red_agent_lar: "Generální ředitelství revoluční akce" # todo: NEW TRANSLATION
 FRA_red_agent_lar_desc: "Náš přístup jsme vytvořili podle technik DGSE, abychom získali zásadní informace o našich reakčních a kapitalistických nepřátelích." # todo: NEW TRANSLATION
 FRA_red_agent_non_lar: "Generální ředitelství revoluční akce" # todo: NEW TRANSLATION
 FRA_red_agent_non_lar_desc: "Náš přístup jsme vytvořili podle technik DGSE, abychom získali zásadní informace o našich reakčních a kapitalistických nepřátelích." # todo: NEW TRANSLATION
 FRA_monarchist_anger: "Hněv monarchistů" # todo: NEW TRANSLATION
 FRA_monarchist_anger_desc: "Naši monarchističtí spojenci byli zklamáni naším odmítnutím obnovit aristokratická privilegia. Bonapartismus je dědicem revoluce; nemohlo tomu být jinak." # todo: NEW TRANSLATION
 FRA_bonapart_constitution: "Bonapartistická ústava" # todo: NEW TRANSLATION
 FRA_bonapart_constitution_desc: "Od dob třetí republiky již naše instituce nejsou uzpůsobeny k přijetí císaře našeho významu. Musíme proto přizpůsobit ústavu naší nadcházející vládě. Můžeme při této příležitosti napravit některé výtky, které náš lid vznesl vůči předchozím republikám; pro ně to bude krok správným směrem." # todo: NEW TRANSLATION
 FRA_bonapart_military_reform: "Reorganizace Velké armády" # todo: NEW TRANSLATION
 FRA_bonapart_military_reform_desc: "Naše ozbrojené síly stačí k zajištění bezpečnosti na našem území, nestačí však k uskutečnění našich plánů na obnovení říše. Restrukturalizace je nezbytná; vše rozebereme od samotného vrcholu, abychom pak mohli každou složku účinněji reformovat." # todo: NEW TRANSLATION
 FRA_army_reformed_1: "Restrukturalizovaný řetězec velení" # todo: NEW TRANSLATION
 FRA_army_reformed_1_desc: "Nyní, když byl náš řetězec velení restrukturalizován, můžeme provést rozsáhlejší reformu ozbrojených sil včetně jejich technologií a objednávek. Čeká nás velký úkol, který nám však poskytne zdroje k uskutečnění našich ambicí." # todo: NEW TRANSLATION
 FRA_army_reformed_infantry: "Reforma Velké armády: Linie pěchoty" # todo: NEW TRANSLATION
 FRA_army_reformed_infantry_desc: "Náš císař rozhodl ve prospěch pomalého a kontrolovaného postupu. Prioritu proto dostane pěchota a vybavení, které potřebuje." # todo: NEW TRANSLATION
 FRA_army_reformed_cavalry: "Reforma Velké armády: Obrněný klín" # todo: NEW TRANSLATION
 FRA_army_reformed_cavalry_desc: "Náš císař rozhodl ve prospěch rychlého a silného útoku. Prioritu proto dostanou tankové prapory a vybavení, které potřebují." # todo: NEW TRANSLATION
 FRA_army_reformed_artillery_infantry: "Reforma Velké armády: Pěchota a děla" # todo: NEW TRANSLATION
 FRA_army_reformed_artillery_infantry_desc: "Náš císař rozhodl ve prospěch pomalého a kontrolovaného postupu podporovaného dělostřelectvem. Prioritu proto dostane pěchota a dělostřelectvo spolu s příslušným vybavením." # todo: NEW TRANSLATION
 FRA_army_reformed_artillery_cavalry: "Reforma Velké armády: Obrněnce a děla" # todo: NEW TRANSLATION
 FRA_army_reformed_artillery_cavalry_desc: "Náš císař rozhodl ve prospěch rychlého a silného útoku podporovaného dělostřelectvem. Prioritu proto dostanou tankové prapory a dělostřelectvo spolu s příslušným vybavením." # todo: NEW TRANSLATION
 FRA_army_reformed_air_infantry: "Reforma Velké armády: Pěchota a letectvo" # todo: NEW TRANSLATION
 FRA_army_reformed_air_infantry_desc: "Náš císař rozhodl ve prospěch pomalého a kontrolovaného postupu podporovaného bitevními letouny. Prioritu proto dostanou pěší prapory a sériová výroba letadel." # todo: NEW TRANSLATION
 FRA_army_reformed_air_cavalry: "Reforma Velké armády: Obrněnce a letectvo" # todo: NEW TRANSLATION
 FRA_army_reformed_air_cavalry_desc: "Náš císař rozhodl ve prospěch rychlého a silného útoku podporovaného bitevními letouny. Prioritu proto dostanou tankové prapory a sériová výroba letadel." # todo: NEW TRANSLATION
 FRA_BCE_money: "Peníze Evropské unie" # todo: NEW TRANSLATION
 FRA_BCE_money_desc: "Podařilo se nám vyjednat návrat do institucí Evropské unie výměnou za pomoc Evropské banky. Tato pomoc bude zásadní při přípravě válek, které proti nim povedeme!" # todo: NEW TRANSLATION
 FRA_4th_empire_desc: "Bonapartistické císařství je zpět, silnější než kdy dříve, a tentokrát nás žádná koalice neporazí." # todo: NEW TRANSLATION
 FRA_grande_arme_art_inf: "Moderní Velká armáda" # todo: NEW TRANSLATION
 FRA_grande_arme_art_inf_desc: "Po měsících reforem je naše armáda plně připravena vyrazit a získat zpět ztracená území říše. Po kompletní přestavbě systému jsme ji založili na strategii pomalého a vytrvalého postupu podporovaného intenzivním ostřelováním nepřátelských linií. Pěchota zůstává králem bojiště, ale útočné letectvo jí značně usnadní úkol." # todo: NEW TRANSLATION
 FRA_grande_arme_art_cav: "Záplava ohně a oceli" # todo: NEW TRANSLATION
 FRA_grande_arme_art_cav_desc: "Po měsících reforem je naše armáda plně připravena vyrazit a získat zpět ztracená území říše. Po kompletní přestavbě systému jsme ji založili na strategii rychlého a brutálního postupu podporovaného intenzivním ostřelováním. Tato strategie závisí na technologicky vyspělých zdrojích, ale máme prostředky k překonání Napoleonovy záplavy." # todo: NEW TRANSLATION
 FRA_grande_arme_air_inf: "Obloha uvolňuje cestu" # todo: NEW TRANSLATION
 FRA_grande_arme_air_inf_desc: "Po měsících reforem je naše armáda plně připravena vyrazit a získat zpět ztracená území říše. Přestavěli jsme ji kolem umírněného postupu pěchoty, který probíhá zcela pod naším vlastním vzdušným krytím, přičemž úderné a průzkumné letouny rozbíjejí každé postavení ještě před nasazením jediného střelce. Pěšák stále obsazuje území, ale už na něj nevstupuje naslepo." # todo: NEW TRANSLATION
 FRA_grande_arme_air_cav: "Hrom před útokem" # todo: NEW TRANSLATION
 FRA_grande_arme_air_cav_desc: "Po měsících reforem je naše armáda plně připravena vyrazit a získat zpět ztracená území říše. Přestavěli jsme ji kolem obrněných kolon, které postupují jen tam, kde již prošlo letectvo, a místo dělostřeleckého vlaku používají úderné letky, jež drží krok s postupem. Nic útok nezpomalí a nic před ním nepřežije." # todo: NEW TRANSLATION
 FRA_nationalism_in_europe: "Nacionalismus v Evropě" # todo: NEW TRANSLATION
 FRA_nationalism_in_europe_desc: "Evropské nacionalisté hledají podporu a usilují o ni. Není jen naší povinností je sladit, ale i svrhnout vlády, které je potlačují!" # todo: NEW TRANSLATION
 FRA_surrounded: "Kontinentální blokáda" # todo: NEW TRANSLATION
 FRA_surrounded_desc: "Náš vzestup k moci nezůstal bez povšimnutí a je jasné, že ostatní evropské mocnosti již proti nám kují pikle. Zejména Velká Británie, která byla v minulosti naším zapřisáhlým nepřítelem. Musíme svrhnout každou z těchto evropských mocností; závisí na tom naše přežití i přežití revoluce." # todo: NEW TRANSLATION
 FRA_Sachons_vaincre: "Potopa" # todo: NEW TRANSLATION
 FRA_Sachons_vaincre_desc: "Po měsících příprav našeho lidu na konflikt vysoké intenzity jsou nyní připraveni na tuto dlouho očekávanou válku. Jejich nadšení a víra mohou hory přenášet, ale musíme jednat rychle, než opadnou. Musíme naše protivníky rozdrtit co nejrychleji." # todo: NEW TRANSLATION
 FRA_prepare_to_fight: "Příprava našeho návratu" # todo: NEW TRANSLATION
 FRA_prepare_to_fight_desc: "Zvolili jsme opatrný přístup; víme, že náš lid plně podporuje naše expanzionistické ambice, a nyní mu musíme poskytnout prostředky k jejich uskutečnění. Musíme zajistit, abychom byli ve správný čas připraveni." # todo: NEW TRANSLATION
 FRA_defense_napoleon: "Výjimečný stav" # todo: NEW TRANSLATION
 FRA_defense_napoleon_desc: "Po teroristických útocích bonapartistů na našich hranicích je naše země v nejvyšší pohotovosti. Ať se stane cokoli, budeme připraveni." # todo: NEW TRANSLATION
 FRA_thousands_planes: "Letecké závody ve zbrojení" # todo: NEW TRANSLATION
 FRA_thousands_planes_desc: "Rozhodli jsme se bojovat proti Spojeným státům, které se příliš dlouho snaží ovládnout nás i zbytek Evropy. Abychom Evropu ochránili, musíme je zničit, a k tomu musíme být schopni soupeřit ve vzduchu, protože nemáme prostředky k jejich porážce na moři." # todo: NEW TRANSLATION
 FRA_trade_USA: "Transatlantický obchod" # todo: NEW TRANSLATION
 FRA_trade_USA_desc: "Spojené státy a Francouzské císařství spojily síly za účelem obchodu přes Atlantik. Tyto dohody jim výměnou za mírové záruky přinesou mír a prosperitu." # todo: NEW TRANSLATION
 FRA_king_camelot_lar: "Královi Cameloti" # todo: NEW TRANSLATION
 FRA_king_camelot_lar_desc: "Naše tajná policie, pověřená potlačováním všech revolučních tendencí a dalších protimonarchistických hnutí." # todo: NEW TRANSLATION
 FRA_king_camelot_non_lar: "Královi Cameloti" # todo: NEW TRANSLATION
 FRA_king_camelot_non_lar_desc: "Naše tajná policie, pověřená potlačováním všech revolučních tendencí a dalších protimonarchistických hnutí." # todo: NEW TRANSLATION
 FRA_king_constitution: "Monarchistická ústava" # todo: NEW TRANSLATION
 FRA_king_constitution_desc: "Všechny tyto republiky, kterými naše země prošla, vybudovaly instituce na vratkých základech. Musíme tento nesmysl přepsat, protože každý stát, dokonce i pod naší absolutní vládou, potřebuje zákony." # todo: NEW TRANSLATION
 FRA_chivalry: "Moderní rytířství" # todo: NEW TRANSLATION
 FRA_chivalry_desc: "Francouzská monarchie se vždy opírala o silné jezdecké vojsko. Rozhodli jsme se v tomto směru pokračovat a dát přednost mechanizovanému jezdectvu před pěchotou." # todo: NEW TRANSLATION
 FRA_elite_army: "Armáda elit" # todo: NEW TRANSLATION
 FRA_elite_army_desc: "Revoluční války přinesly brannou povinnost. Mnohé konflikty, které jsme zažili, se však ukázaly být nesmírně nákladnými z hlediska lidských životů. Královi poddaní nejsou vždy pro válčení dobře vycvičeni. Proto jsme se rozhodli zaměřit na menší, ale mnohem lépe vycvičenou sílu." # todo: NEW TRANSLATION
 FRA_prepare_crusade: "Desátá křížová výprava" # todo: NEW TRANSLATION
 FRA_prepare_crusade_desc: "Naše síly jsou připraveny vyrazit a dobýt Svatou zemi." # todo: NEW TRANSLATION
 FRA_political_preassure: "Posílení naší diplomacie" # todo: NEW TRANSLATION
 FRA_political_preassure_desc: "Nedokázali jsme Libanon získat diplomatickou cestou, takže musíme zlepšit způsob, jakým jednáme s cizími mocnostmi." # todo: NEW TRANSLATION
 FRA_navy_crusade: "Námořní křížová výprava" # todo: NEW TRANSLATION
 FRA_navy_crusade_desc: "Rozhodli jsme se získat Svatou zemi zpět po moři. To vyžaduje účinné obojživelné útočné schopnosti." # todo: NEW TRANSLATION
 FRA_commie_europe_integration: "Evropská asimilace" # todo: NEW TRANSLATION
 FRA_commie_europe_integration_desc: "Přinesli jsme revoluci a komunismus do zbytku Evropy. Nyní nastal čas vytvořit z proletariátu všech zemí evropskou federaci schopnou zajistit trvání revoluce." # todo: NEW TRANSLATION
 FRA_counter_insurgency: "Účinná vojenská policie" # todo: NEW TRANSLATION
 FRA_counter_insurgency_desc: "Španělští partyzáni představovali pro Napoleona I. problém, pro nás však nebudou." # todo: NEW TRANSLATION
 FRA_attack_benelux: "Bojový plán: Benelux" # todo: NEW TRANSLATION
 FRA_attack_benelux_desc: "Musíme se zaměřit na zničení sil Beneluxu. Náš císař nám poskytl prostředky k jejich rychlé porážce." # todo: NEW TRANSLATION
 FRA_attack_iberia: "Bojový plán: Iberský poloostrov" # todo: NEW TRANSLATION
 FRA_attack_iberia_desc: "Musíme se zaměřit na zničení iberských sil. Náš císař nám poskytl prostředky k jejich rychlé porážce." # todo: NEW TRANSLATION
 FRA_attack_germany: "Bojový plán: Německo" # todo: NEW TRANSLATION
 FRA_attack_germany_desc: "Musíme se zaměřit na zničení německých sil. Náš císař nám poskytl prostředky k jejich rychlé porážce." # todo: NEW TRANSLATION
 FRA_attack_holy_roman: "Bojový plán: Jižní Evropa" # todo: NEW TRANSLATION
 FRA_attack_holy_roman_desc: "Musíme se zaměřit na zničení zbytků sil jižní Evropy. Náš císař nám poskytl prostředky k jejich rychlé porážce." # todo: NEW TRANSLATION
 FRA_BON_support_allies: "Příprava na dlouhou válku" # todo: NEW TRANSLATION
 FRA_BON_support_allies_desc: "Náš francouzský partner navrhl, abychom se připravili na konflikt vysoké intenzity s Ruskem." # todo: NEW TRANSLATION
 FRA_attack_east: "Bojový plán: Východní Evropa" # todo: NEW TRANSLATION
 FRA_attack_east_desc: "Musíme se zaměřit na zničení východoevropských sil. Náš císař nám poskytl prostředky k jejich rychlé porážce. Toto je poslední krok před naší závěrečnou kampaní." # todo: NEW TRANSLATION
 FRA_attack_russia_fast: "Květina v hlavni" # todo: NEW TRANSLATION
 FRA_attack_russia_fast_desc: "Za dva týdny budeme v Moskvě!" # todo: NEW TRANSLATION
 FRA_attack_russia_slow: "Opatrný postup" # todo: NEW TRANSLATION
 FRA_attack_russia_slow_desc: "Tentokrát žádná Berezina nebude." # todo: NEW TRANSLATION
 FRA_attack_UK_naval: "Překročení Lamanšského průlivu" # todo: NEW TRANSLATION
 FRA_attack_UK_naval_desc: "Královské námořnictvo pro nás již není hrozbou; vítězství je na dosah." # todo: NEW TRANSLATION
 FRA_attack_UK_air: "Přeskočení průlivu" # todo: NEW TRANSLATION
 FRA_attack_UK_air_desc: "Musíme udržet kontrolu nad vzdušným prostorem a zaskočit protivníka." # todo: NEW TRANSLATION
 FRA_BON_victory: "Císařský protektorát" # todo: NEW TRANSLATION
 FRA_BON_victory_desc: "Byli jsme dobyti Napoleonovým císařstvím." # todo: NEW TRANSLATION
 FRA_expansion_europe: "Dědic Karla Velikého" # todo: NEW TRANSLATION
 FRA_expansion_europe_desc: "Naším osudem je obnovit Karolínskou říši." # todo: NEW TRANSLATION
 FRA_expansion_europe_crusades: "Karolínská křížová výprava" # todo: NEW TRANSLATION
 FRA_expansion_europe_crusades_desc: "Frankové znovu získali svá území; nyní musíme vyrazit do Svaté země." # todo: NEW TRANSLATION
 FRA_expansion_crusades: "Dědic svatého Ludvíka" # todo: NEW TRANSLATION
 FRA_expansion_crusades_desc: "Povinností našeho království je sloužit Bohu a získat zpět Svatou zemi." # todo: NEW TRANSLATION
 FRA_EMPIRE_occident: "Západní císařství" # todo: NEW TRANSLATION
 FRA_EMPIRE_occident_desc: "Znovu jsme dobyli Karolínskou říši a byli korunováni císařem Západu." # todo: NEW TRANSLATION
 FRA_crusade_done_jerusalem: "Vítězná křížová výprava" # todo: NEW TRANSLATION
 FRA_crusade_done_jerusalem_desc: "Desátá křížová výprava dosáhla svého cíle znovudobytím Jeruzaléma a Svaté země." # todo: NEW TRANSLATION
 FRA_expansion_crusades_plus: "Poslední křížová výprava" # todo: NEW TRANSLATION
 FRA_expansion_crusades_plus_desc: "Po znovuzískání našich svatých míst jsme se rozhodli napravit chyby minulosti. Všechna schismata musí skončit." # todo: NEW TRANSLATION
 FRA_protestant_anger: "Protestantský odpor" # todo: NEW TRANSLATION
 FRA_protestant_anger_desc: "Naše agresivní rétorika vůči protestantům vyvolala v naší zemi jejich hněv." # todo: NEW TRANSLATION
 FRA_harsh_subjugation: "Tvrdé podrobení" # todo: NEW TRANSLATION
 FRA_harsh_subjugation_desc: "Náš suverén, francouzský král, se rozhodl kontrolovat naše hospodářství a politiku. Porážka má vysokou cenu." # todo: NEW TRANSLATION
 FRA_victory_crusade_2_conversion: "Pátý jezdec Apokalypsy" # todo: NEW TRANSLATION
 FRA_victory_crusade_2_conversion_desc: "Na naše nepřátele byl seslán božský hněv." # todo: NEW TRANSLATION
 FRA_enlightment: "Protektorát církve" # todo: NEW TRANSLATION
 FRA_enlightment_desc: "Náš suverén, francouzský král, se rozhodl pomoci nám obnovit naši zemi a podpořit nás ve fyzické i kulturní rekonstrukci naší společnosti." # todo: NEW TRANSLATION
 FRA_victory_crusade_2_freedom_light: "Nejstarší dcera církve" # todo: NEW TRANSLATION
 FRA_victory_crusade_2_freedom_light_desc: "Se ztracenými ovečkami musíme zacházet s nejvyšší laskavostí." # todo: NEW TRANSLATION
 FRA_attack_colonies: "Obnovení kolonií říše" # todo: NEW TRANSLATION
 FRA_attack_colonies_desc: "Kontinentální systém musí najít zdroje, aby zajistil své další trvání." # todo: NEW TRANSLATION
 france_md.110.t: "Referendum o statusu Mahoru" # todo: NEW TRANSLATION
 france_md.110.d: "Obyvatelé Mayotte se rozhodli uspořádat referendum, které určí jejich osud v rámci Francouzské republiky. Ostrov Mayotte je součástí Francouzské republiky od roku 1841, kdy jej Francii prodal bývalý madagaskarský král. Přední místní představitelé se snaží upevnit své postavení ve Francouzské republice tím, že se k ní oficiálně připojí, získají nezávislost na Francii, nebo se stanou součástí Komor. Co bychom měli udělat?" # todo: NEW TRANSLATION
 france_md.110.a: "Povolit referendum" # todo: NEW TRANSLATION
 france_md.110.b: "Odmítnout referendum" # todo: NEW TRANSLATION
 france_md.110.c: "Udělit jim omezenou autonomii." # todo: NEW TRANSLATION
 france_md.111.t: "Výsledky referenda o statusu Mahoru" # todo: NEW TRANSLATION
 france_md.111.d: "Referendum konečně dospělo ke svému přirozenému závěru a výsledky jsou známy. Budoucnost Mayotte spočívá v rukou těchto výsledků." # todo: NEW TRANSLATION
 france_md.111.a: "Dokonalé." # todo: NEW TRANSLATION
 france_md.350.t: "Francie nás vyhání z Libanonu!" # todo: NEW TRANSLATION
 france_md.350.d: "Prostřednictvím promyšlené kampaně diplomatického nátlaku a hospodářských pobídek Francouzi systematicky podkopali naše postavení v Libanonu. Jejich vlivové operace uspěly nad očekávání – místní politici nyní otevřeně požadují náš odchod a libanonská vláda formálně požádala o stažení naší přítomnosti. Jde o ponižující neúspěch, ale možná ne nevratný. Mohli bychom se pokusit svůj vliv znovu prosadit, přestože by to riskovalo mezinárodní incident." # todo: NEW TRANSLATION
 france_md.350.a: "Zrada! Za to zaplatíš!" # todo: NEW TRANSLATION
 france_md.350.b: "Vynutit nárok" # todo: NEW TRANSLATION
 france_md.355.t: "Francie vyvolává ve společnosti pocit vzpoury" # todo: NEW TRANSLATION
 france_md.355.d: "Francouzi pilně šíří své revoluční ideály mezi libanonským obyvatelstvem. Organizace občanské společnosti financované Paříží požadují demokratické reformy, transparentnost a svobodné volby. Protestní hnutí v Bejrútu i mimo něj nabývají na síle. Pokud nezasáhneme rychle a tuto situaci neomezíme, můžeme čelit otevřenému povstání inspirovanému francouzskými republikánskými principy." # todo: NEW TRANSLATION
 france_md.355.a: "Tohle bolelo" # todo: NEW TRANSLATION
 france_md.360.t: "Návrh francouzských investic do energetiky" # todo: NEW TRANSLATION
 france_md.360.d: "Francouzský energetický gigant TotalEnergies oslovil naši vládu s komplexním návrhem na rozvoj našich ropných a plynových zásob. Dohoda by přinesla značné zahraniční investice, technické know-how a vytvořila tisíce pracovních míst. Někteří domácí kritici však tvrdí, že přijetí francouzského kapitálu by zvýšilo vliv Paříže na naši hospodářskou politiku. Podmínky jsou výhodné, ale za jakou cenu pro naši suverenitu?" # todo: NEW TRANSLATION
 france_md.360.a: "Hospodářské výhody převažují nad riziky" # todo: NEW TRANSLATION
 france_md.360.b: "Nemůžeme prodat své zdroje zahraničním zájmům" # todo: NEW TRANSLATION
 france_md.400.t: "Francouzská rozvojová pomoc pro severní Libanon" # todo: NEW TRANSLATION
 france_md.400.d: "Agence Française de Développement navrhla rozsáhlý infrastrukturní program pro severní Libanon, včetně zlepšení silnic, čistíren vody a telekomunikačních sítí. Tento region byl dlouhodobě zanedbáván a francouzské investice by mohly proměnit životní úroveň místních obyvatel. Někteří to považují za skutečný humanitární zájem vycházející z historických vazeb Francie na Libanon, jiní za promyšlený krok k rozšíření francouzského vlivu ve strategicky důležité oblasti." # todo: NEW TRANSLATION
 france_md.400.a: "Toto partnerství prospěje našemu lidu" # todo: NEW TRANSLATION
 france_md.400.b: "Dáváme přednost rozvoji vlastní infrastruktury" # todo: NEW TRANSLATION
 france_md.401.t: "Francouzská infrastrukturní iniciativa na jihu" # todo: NEW TRANSLATION
 france_md.401.d: "Francie nabídla financování rozsáhlých infrastrukturních projektů v jižním Libanonu, oblasti, která po léta velmi trpěla konfliktem a zanedbáváním. Návrh zahrnuje nemocnice, školy a modernizaci elektrické sítě. Humanitární potřeba je nepopiratelná, avšak přijetí francouzské přítomnosti na jihu by mohlo zkomplikovat naše vztahy s dalšími regionálními mocnostmi, které pohlížejí na jakékoli západní angažmá s podezřením." # todo: NEW TRANSLATION
 france_md.401.a: "Jih tyto investice zoufale potřebuje" # todo: NEW TRANSLATION
 france_md.401.b: "Politické komplikace jsou příliš velké" # todo: NEW TRANSLATION
 france_md.402.t: "Program francouzských průmyslových investic" # todo: NEW TRANSLATION
 france_md.402.d: "Francouzské korporace navrhují významné investice do libanonské výroby a slibují vybudování továren, které by vytvořily pracovní místa pro tisíce našich občanů. Nezaměstnanost mladých je dlouhodobou krizí a tato místa by mohla pomoci zastavit odliv talentů z naší země. Průmyslová závislost na francouzském kapitálu by však mohla naši ekonomiku přetvořit způsoby, které by prospívaly především Paříži." # todo: NEW TRANSLATION
 france_md.402.a: "Pracovní místa jsou nyní naší prioritou" # todo: NEW TRANSLATION
 france_md.402.b: "Musíme rozvíjet vlastní průmyslovou základnu" # todo: NEW TRANSLATION
 france_md.403.t: "Francouzská humanitární mise v Libanonu" # todo: NEW TRANSLATION
 france_md.403.d: "V reakci na naši probíhající krizi nabídla Francie vyslání humanitární mise s lékařskými potřebami, potravinovou pomocí a technickou podporou. Francouzské nevládní organizace a vládní agentury by ve spolupráci s místními úřady koordinovaly pomoc. Prezident Macron osobně vyzval k mezinárodní podpoře Libanonu a poukázal na hluboké historické a kulturní vazby mezi našimi národy. Tato pomoc by mohla přinést zoufale potřebnou úlevu, zároveň však v této zranitelné chvíli zvyšuje francouzskou viditelnost a vliv." # todo: NEW TRANSLATION
 france_md.403.a: "S vděčností tuto pomoc přijímáme" # todo: NEW TRANSLATION
 france_md.403.b: "Své záležitosti zvládneme sami" # todo: NEW TRANSLATION
 france_md.404.t: "Dohoda se Zelenými" # todo: NEW TRANSLATION
 france_md.404.d: "Jednání skončila a text leží na stole. Dvacet čtyři reaktorů bude uzavřeno, jako první Fessenheim, a jaderná energie bude během desetiletí snížena na polovinu energetického mixu. Zelení se na oplátku stáhnou v šedesáti volebních obvodech a většina zůstane zachována. Energetické federace již hlasovaly proti a Montebourg veřejně řekl to, co polovina poslaneckého klubu říká v soukromí. Podepíšeme?" # todo: NEW TRANSLATION
 france_md.404.a: "Podepišme. Aliance má větší cenu než reaktory" # todo: NEW TRANSLATION
 france_md.404.b: "Flotila není vyjednávacím žetonem" # todo: NEW TRANSLATION
 france_md.405.t: "La Manif pour Tous" # todo: NEW TRANSLATION
 france_md.405.d: "Zdá se, že náš nedávný návrh zákona se nesetkal s jednomyslnou podporou spoluobčanů. Zaplnili Champ de Mars a hodlají to opakovat každý měsíc, dokud návrh nezanikne. Organizátoři jsou opatrní, transparenty jsou růžové a modré a za nimi stojí všechna konzervativní sdružení v zemi i značná část parlamentní pravice. Navržený text se týká manželství, adopce a filiace. Můžeme trvat na všech třech bodech, nebo odstranit to, co přitahuje největší davy, a zbytek tiše schválit." # todo: NEW TRANSLATION
 france_md.405.a: "Zákon projde celý. Ať pochodují" # todo: NEW TRANSLATION
 france_md.405.b: "Zkraťme text a vezměme, co můžeme" # todo: NEW TRANSLATION
 france_md.406.t: "Kruhové objezdy jsou obsazené" # todo: NEW TRANSLATION
 france_md.406.d: "Osm víkendů. Prefektury hlásí tisíc obsazených kruhových objezdů, Vítězný oblouk byl poničen a gumové projektily vzaly lidem před kamerami oči. Není s kým vyjednávat, protože demonstranti odmítají určit vedení. Ministerstvo vnitra chce zákon proti výtržníkům a volnou ruku. Ostatní chtějí celostátní debatu, radnice v každé obci a balík ústupků dostatečně velký, aby vše skončilo před evropskými volbami." # todo: NEW TRANSLATION
 france_md.406.a: "Schválit zákon proti výtržníkům a vyčistit kruhové objezdy" # todo: NEW TRANSLATION
 france_md.406.b: "Zahájit Velkou debatu a zaplatit za mír" # todo: NEW TRANSLATION
 france_md.500.t: "Útoky Lumio" # todo: NEW TRANSLATION
 france_md.500.d: "Malá obec v Lumio byla zasažena Korsickou národní osvobozovací frontou. Útok nezpůsobil žádné oběti, ale způsobil značné škody na malé vojenské infrastruktuře v obci a zranil několik gendarmerů." # todo: NEW TRANSLATION
 france_md.500.a: "Znepokojivý incident, nic víc" # todo: NEW TRANSLATION
 france_md.501.t: "Útoky na hotely v Marseille" # todo: NEW TRANSLATION
 france_md.501.d: "V Marseille došlo k sérii menších bombových útoků. K útokům se přihlásila Národní fronta osvobození Korsiky. Několik lidí bylo v důsledku incidentů hospitalizováno a zraněno, nezdá se však, že by měli v úmyslu provést další bombové útoky na jiné hotely." # todo: NEW TRANSLATION
 france_md.501.a: "Nenecháme se zastrašit" # todo: NEW TRANSLATION
 france_md.504.t: "Bombardování McDonald's" # todo: NEW TRANSLATION
 france_md.504.d: "Malé množství bretonských nacionalistů se rozhodlo odpálit místní McDonald's v Quévertu, Bretani. Výbuch zabil jednu osobu v McDonald's. Probíhající vyšetřování dosud nepřineslo mnoho důkazů, zda jde o širší spiknutí, ale jedná se o tragickou událost." # todo: NEW TRANSLATION
 france_md.504.a: "Nesmyslná ztráta životů" # todo: NEW TRANSLATION
 france_md.505.t: "Návrh na sloučení KMW a Nexteru" # todo: NEW TRANSLATION
 france_md.505.d: "Vlády Francie a Německa dokončují plán na sloučení společností Nexter Systems a Krauss-Maffei Wegmann do jediného francouzsko-německého obranného holdingu. Výsledné konsorcium KANT by sjednotilo výrobní linky Leclercu a Leopardu 2, vytvořilo společné portfolio dělostřelectva a munice a položilo základ budoucímu evropskému programu hlavního bojového tanku.\n\nMinistři chtějí politické schválení ještě před převodem akcií." # todo: NEW TRANSLATION
 france_md.505.a: "Schválit sloučení" # todo: NEW TRANSLATION
 france_md.505.b: "Ponechat Nexter nezávislý" # todo: NEW TRANSLATION
 TT_FRA_knds_merge_carry_traits: "§YVšechny vlastnosti již dokončené u Nexteru se přenesou do nové organizace KNDS.§!" # todo: NEW TRANSLATION
 france_md.506.t: "Arquus: průmyslová konsolidace" # todo: NEW TRANSLATION
 france_md.506.d: "Obranné dceřiné společnosti skupiny Volvo Group, Renault Trucks Defense a Panhard General Defense, dokončily sloučení do jediného subjektu. Nová firma Arquus spojuje Renaultovy platformy kolové mobility s průzkumnou tradicí Panhardu a staví Francii do pozice jednotného kandidáta na evropském trhu obrněných vozidel. Výrobní know-how, programy a modifikátory obou původních firem se přenesou do nové organizace." # todo: NEW TRANSLATION
 france_md.506.a: "Nová kapitola francouzské obrněné mobility" # todo: NEW TRANSLATION
 france_md.506_tt: "Renault a Panhard budou sloučeny do Arquusu" # todo: NEW TRANSLATION
 FRA_arguus_established: "Renault a Panhard byly v roce 2018 sloučeny do Arquusu" # todo: NEW TRANSLATION
 france_md.507.t: "Eurocopter se stává Airbus Helicopters" # todo: NEW TRANSLATION
 france_md.507.d: "Skupina Eurocopter je od dnešního dne přejmenována na Airbus Helicopters, čímž se podnikání EADS v oblasti rotorových letadel sjednocuje pod značkou Airbus. Závody v Marignane a Donauwörthu i dědictví Aérospatiale nyní působí pod jednou vlajkou." # todo: NEW TRANSLATION
 france_md.507.a: "Nová kapitola evropského leteckého průmyslu." # todo: NEW TRANSLATION
 FRA_airbus_change: "Eurocopter byl v roce 2014 přejmenován na Airbus Helicopters" # todo: NEW TRANSLATION
 TT_FRA_airbus_change_carry_traits: "§YVšechny vlastnosti již dokončené u $FRA_eurocopter_manufacturer$ se přenesou do $FRA_airbus_manufacturer$§!" # todo: NEW TRANSLATION
 france_md.508.t: "DCNS se stává Naval Group" # todo: NEW TRANSLATION
 france_md.508.d: "Historický státní arzenál Direction des Constructions Navales, dávno přejmenovaný na DCNS, od dnešního dne přijímá novou identitu Naval Group, čímž završuje svou proměnu v plně soukromou společnost. Loděnice v Lorientu, Cherbourgu a Brestu nyní působí pod jednou značkou spolu se společným podnikem Naviris s firmou Fincantieri a obnoveným exportním úsilím založeným na ponorce třídy Suffren a fregatě FDI Belharra." # todo: NEW TRANSLATION
 france_md.508.a: "Nová kapitola francouzské stavby lodí." # todo: NEW TRANSLATION
 FRA_naval_takeover: "DCNS byl v roce 2017 přejmenován na Naval Group" # todo: NEW TRANSLATION
 TT_FRA_naval_takeover_carry_traits: "§YVšechny vlastnosti již dokončené u $FRA_dcn_manufacturer$ se přenesou do $FRA_naval_group_naval_manufacturer$§!" # todo: NEW TRANSLATION
 FRA_french_space_decision_category: "Francouzský vesmírný program a CNES" # todo: NEW TRANSLATION
 FRA_french_space_decision_category_desc: "Vesmír: poslední hranice. Pokud chceme v očích světa zůstat velmocí, musíme tuto hranici začít skutečně dobývat, což však dokážeme pouze za vysokou cenu. Protože si nemůžeme být jisti skutečnými hospodářskými přínosy rozsáhlého vesmírného programu, musí francouzský lid zůstat přesvědčen, že jde o smysluplný podnik!\n§RPokud nadšení pro náš vesmírný program klesne pod 35, vesmírné operace ustanou!§! Každý týden navíc naše §Y nadšení pro vesmírný program§! klesne o §Y0.1§! kvůli všeobecnému nezájmu o §YCNES§!\n\n\nNaše současné nadšení pro vesmírný program: [?FRA.FRA_peoples_support|+50.0] \nTýdenní příjem z §Yvesmírných operací a akcí§!: $[?FRA.FRA_space_income_var|+3]b" # todo: NEW TRANSLATION
 FRA_run_support_campaigns_short: "Spustit krátkou veřejnou podporovací kampaň" # todo: NEW TRANSLATION
 FRA_run_support_campaigns_short_desc: "Jestliže naši špičkoví vědci teprve začínají odhalovat vědecké zázraky ukryté ve vesmíru, lidé jsou z celé záležitosti nesmírně zmatení. Krátká kampaň na sociálních médiích by nám měla zajistit nějakou podporu!" # todo: NEW TRANSLATION
 FRA_run_support_campaigns_long: "Spustit dlouhou veřejnou podporovací kampaň" # todo: NEW TRANSLATION
 FRA_run_support_campaigns_long_desc: "Jestliže naši špičkoví vědci teprve začínají odhalovat vědecké zázraky ukryté ve vesmíru, lidé jsou z celé záležitosti nesmírně zmatení. Podrobná vzdělávací kampaň by pro nás mohla znamenat obrovskou podporu mezi obyvatelstvem!" # todo: NEW TRANSLATION
 FRA_balance_the_cnes_budget: "Přerozdělit rozpočet CNES" # todo: NEW TRANSLATION
 FRA_balance_the_cnes_budget_desc: "Náš vesmírný program CNES měl v minulosti problémy s neefektivním vynakládáním prostředků a menší mírou korupce. Měli bychom vyslat státní auditory, aby pomohli omezit nadměrné výdaje a zlepšit pověst CNES, která to naléhavě potřebuje." # todo: NEW TRANSLATION
 FRA_launch_commercial_satellite: "Spustit komerční satelit" # todo: NEW TRANSLATION
 FRA_launch_commercial_satellite_desc: "Nyní, když je informační věk v plném proudu, soukromé společnosti se téměř předhánějí v tom, která vypustí satelit. Pokud některým z nich dovolíme startovat z našich zařízení, měli bychom získat rozumné hospodářské výhody. Buďme však opatrní; lidé by mohli začít být naším komerčně zaměřeným programem unaveni!" # todo: NEW TRANSLATION
 FRA_prep_international_space_station: "Připravit start ISS" # todo: NEW TRANSLATION
 FRA_prep_international_space_station_desc: "Zatímco jde o celosvětové prvenství a iniciativu, můžeme se připravit k odeslání našich zásobovacích raket na ISS, spolu s naším personálem." # todo: NEW TRANSLATION
 FRA_french_iss_launch: "Francouzský start ISS" # todo: NEW TRANSLATION
 FRA_french_iss_launch_desc: "Po měsících plánování a příprav je naše zásobovací mise raketoplánu připravena ke startu. Tři. Dva. Jedna. Start!" # todo: NEW TRANSLATION
 FRA_invest_LEB_decision_category: "Francouzsko-libanonské investice" # todo: NEW TRANSLATION
 FRA_invest_LEB_decision_category_desc: "Libanonci bývali kdysi naším koloniálním územím a proto je nezbytné vrátit se do regionu a investovat do velké země [LEB.GetNameWithFlag]." # todo: NEW TRANSLATION
 FRA_LEB_invest_infrastructure_south: "Investovat do jižního Libanonu" # todo: NEW TRANSLATION
 FRA_LEB_invest_infrastructure_south_desc: "Hospodářský rozvoj jižního Libanonu může pomoci zabránit radikalizaci v regionu. Čím více hospodářských příležitostí region získá, tím lépe pro všechny zúčastněné." # todo: NEW TRANSLATION
 FRA_LEB_invest_infrastructure_north: "Investovat do severního Libanonu" # todo: NEW TRANSLATION
 FRA_LEB_invest_infrastructure_north_desc: "Hospodářské srdce Libanonu se téměř vždy soustředilo kolem Bejrútu a okolních území. Rozšíření a investice do severní části země přinesou vynikající výsledky." # todo: NEW TRANSLATION
 FRA_LEB_invest_civilian_factory: "Investovat do libanonského civilního průmyslu" # todo: NEW TRANSLATION
 FRA_LEB_invest_civilian_factory_desc: "Libanonci by uvítali dodatečné investice do jejich civilního průmyslu. Rozvoj těchto odvětví by mohl dále pomoci hospodářskému rozvoji Libanonu a učinit jej soběstačnějším na světové scéně." # todo: NEW TRANSLATION
 FRA_LEB_financial_help: "Poskytnout Libanonu finanční pomoc" # todo: NEW TRANSLATION
 FRA_LEB_financial_help_desc: "Měli bychom Libanonu poskytnout finanční pomoc, abychom vyrovnali část jeho rozpočtových nedostatků." # todo: NEW TRANSLATION
 FRA_french_africa_decision_category: "Françafrique/Africké rozhodnutí" # todo: NEW TRANSLATION
 FRA_french_africa_decision_category_desc: "Afrika a Françafrique mohou pro nás často znamenat totéž. Kontinent v Africe potřebuje naši pomoc a naši péči, a proto bychom měli pokračovat v tom, aby Afrika zůstala středem naší zahraniční politiky a našich zájmů." # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_education_decision: "Investovat do vzdělávacích programů NEPAD" # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_education_decision_desc: "Vzdělávací programy NEPAD by využily dodatečné financování a podporu. Zvýšené financování zaplatíme my, africké země však zaznamenají nižší náklady na vzdělávání." # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_healthcare_decision: "Investovat do zdravotnických programů NEPAD" # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_healthcare_decision_desc: "Zdravotnické programy NEPAD by využily dodatečné financování a podporu. Zvýšené financování zaplatíme my, africké země však zaznamenají nižší náklady na zdravotnictví." # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_social_care_decision: "Investovat do programů sociální péče NEPAD" # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_social_care_decision_desc: "Programy sociální péče NEPAD by využily dodatečné financování a podporu. Zvýšené financování zaplatíme my, africké země však zaznamenají nižší náklady na sociální péči." # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_economic_program_decision: "Investovat do hospodářských programů NEPAD" # todo: NEW TRANSLATION
 FRA_invest_in_NEPAD_economic_program_decision_desc: "Hospodářské programy NEPAD by využily dodatečné financování a podporu. Zvýšené financování zaplatíme my, africké země však zaznamenají vyšší produktivitu a rychlost výstavby." # todo: NEW TRANSLATION
 FRA_extend_the_NEPAD_program_decision: "Rozšířit program NEPAD" # todo: NEW TRANSLATION
 FRA_extend_the_NEPAD_program_decision_desc: "Program je třeba rozšířit. Můžeme do něj vložit dodatečné prostředky a udržet ho v chodu." # todo: NEW TRANSLATION
