 FRA_nexter_firepower_ammo: "Palebná síla a munice" # todo: NEW TRANSLATION
 FRA_nexter_manufacturer_trait: "Doktrína palebné síly CAESAR" # todo: NEW TRANSLATION
 FRA_nexter_manufacturer_trait_desc: "Od kovárenských dílen arzenálu v Bourges až po houfnici CAESAR na nákladním podvozku si Nexter vybudoval pověst díky rychlé a přesné palebné síle dodávané lehkými pásovými a kolovými platformami." # todo: NEW TRANSLATION
 FRA_nexter_leclerc_programme: "Program Leclerc" # todo: NEW TRANSLATION
 FRA_nexter_leclerc_programme_desc: "Leclerc je hlavní bojový tank Nexteru, vyvíjený od konce 70. let a zavedený do služby v roce 1992. Jeho automatické nabíjení a modulární pancéřování stanovily měřítko francouzské obrněné doktríny." # todo: NEW TRANSLATION
 FRA_nexter_leclerc_mk2: "Leclerc série 2" # todo: NEW TRANSLATION
 FRA_nexter_leclerc_mk2_desc: "Modernizace série 2 zavedla hybridní klimatizaci, vylepšenou elektroniku a zdokonalené kompozitní pancéřové moduly, čímž prodloužila životnost platformy do 20. let 21. století." # todo: NEW TRANSLATION
 FRA_nexter_leclerc_xlr: "Modernizace Leclerc XLR" # todo: NEW TRANSLATION
 FRA_nexter_leclerc_xlr_desc: "Modernizace XLR v polovině životnosti přestavěla Leclerc kolem dálkově ovládané zbraňové stanice, modulárních pancéřových sad a integrace systému řízení boje SCORPION, takže zůstal konkurenceschopný vůči novějším konstrukcím hlavních bojových tanků." # todo: NEW TRANSLATION
 FRA_nexter_vbci: "Kolové bojové vozidlo pěchoty VBCI" # todo: NEW TRANSLATION
 FRA_nexter_vbci_desc: "Véhicule Blindé de Combat d'Infanterie poskytl francouzské armádě první moderní kolové bojové vozidlo pěchoty. Výroba začala v roce 2008 a platforma se stala páteří obrněné mobility motorizovaných pluků." # todo: NEW TRANSLATION
 FRA_nexter_famas: "Služební puška FAMAS" # todo: NEW TRANSLATION
 FRA_nexter_famas_desc: "Útočná puška FAMAS v konfiguraci bullpup sloužila od roku 1981 jako standardní zbraň francouzské pěchoty. Výrobní a podpůrná řada Nexteru vyrostla z její produkce a navazujících servisních smluv." # todo: NEW TRANSLATION
 FRA_nexter_scorpion_core: "Integrovaný boj Scorpion" # todo: NEW TRANSLATION
 FRA_nexter_scorpion_core_desc: "Program Scorpion, formalizovaný v roce 2014, propojil novou rodinu kolových bojových vozidel francouzské armády pod společný systém řízení boje a digitální páteř." # todo: NEW TRANSLATION
 FRA_nexter_griffon: "VBMR Griffon" # todo: NEW TRANSLATION
 FRA_nexter_griffon_desc: "Griffon je šestikolový víceúčelový taktický transportér rodiny Scorpion, který nahrazuje VAB jako standardní francouzské obrněné transportní vozidlo." # todo: NEW TRANSLATION
 FRA_nexter_jaguar: "EBRC Jaguar" # todo: NEW TRANSLATION
 FRA_nexter_jaguar_desc: "Šestikolové průzkumné a bojové vozidlo Jaguar nese kanón CTA ráže 40 mm a střely Akeron MP a přebírá koncepce palebné síly osvědčené na tanku Leclerc." # todo: NEW TRANSLATION
 FRA_nexter_serval: "VBMR-L Serval" # todo: NEW TRANSLATION
 FRA_nexter_serval_desc: "Lehký čtyřkolový Serval rozšiřuje mobilitu Scorpionu na varianty pro speciální síly, hlídkování a velení díky kompaktní hliníkové korbě." # todo: NEW TRANSLATION
 FRA_nexter_40cta: "Kanón CTA ráže 40 mm" # todo: NEW TRANSLATION
 FRA_nexter_40cta_desc: "Kanón s teleskopickou municí ráže 40 mm, vyvinutý společně s BAE Systems prostřednictvím CTA International, poskytuje celé flotile Scorpionu kompaktní vysokorychlostní protitankovou palebnou sílu." # todo: NEW TRANSLATION
 FRA_nexter_caesar: "Platforma CAESAR ráže 155 mm" # todo: NEW TRANSLATION
 FRA_nexter_caesar_desc: "Houfnice CAESAR ráže 155 mm na nákladním podvozku kombinuje strategickou mobilitu s přesnou palbou na dlouhou vzdálenost a stala se nejúspěšnější exportní dělostřeleckou platformou Nexteru." # todo: NEW TRANSLATION
 FRA_nexter_eurenco: "Hnací náplně EURENCO" # todo: NEW TRANSLATION
 FRA_nexter_eurenco_desc: "EURENCO dodává hnací náplně, výbušniny a energetické materiály, na nichž stojí francouzské dělostřelecké a ruční střelivo, a propojuje tak produkci Nexteru s bezpečným dodavatelským řetězcem." # todo: NEW TRANSLATION
 FRA_nexter_nbc_sys: "Souprava CBRN NBC-Sys" # todo: NEW TRANSLATION
 FRA_nexter_nbc_sys_desc: "Dceřiná společnost NBC-Sys se specializuje na vybavení pro detekci a dekontaminaci chemických, biologických, radiologických a jaderných látek pro francouzské i exportní síly." # todo: NEW TRANSLATION
 FRA_nexter_lu_family: "Munice rodiny LU" # todo: NEW TRANSLATION
 FRA_nexter_lu_family_desc: "Střely ráže 155 mm rodiny LU211 a LU prodlužují dostřel díky dnovému výtoku a lepší aerodynamice a sjednocují palbu na dlouhou vzdálenost napříč hlavněmi kompatibilními se standardy NATO." # todo: NEW TRANSLATION
 FRA_nexter_bonus: "Chytrá munice BONUS" # todo: NEW TRANSLATION
 FRA_nexter_bonus_desc: "Senzorová dělostřelecká střela BONUS ráže 155 mm vypouští samonaváděnou submunici proti obrněným kolonám a poskytuje dělostřeleckým jednotkám přesnou protitankovou schopnost ze standardních houfnic." # todo: NEW TRANSLATION
