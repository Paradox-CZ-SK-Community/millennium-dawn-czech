 FRA_corporate_systems_events.13.c: "Odprodejte podíl v bezdrátových technologiích" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.13.c_tt: "Polovodičová kapacita: §R-0.6§!\nStav STMicroelectronics: §G+0.4§!" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.13.d: "Společnosti STMicroelectronics a NXP se dohodly na spojení svých bezdrátových polovodičových aktivit. Podnik nabízí větší rozsah v oblasti mobilních čipů, koncentrace dvou obtížných činností však přináší značné riziko realizace." # todo: NEW TRANSLATION
