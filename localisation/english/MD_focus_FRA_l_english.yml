 FRA_pcf_social_balance_desc: "Sociální politika nastavená vládou francouzských komunistů. Platí pouze po dobu jejich vlády." # todo: NEW TRANSLATION
 FRA_6th_rep: "Reformy Šesté republiky" # todo: NEW TRANSLATION
 FRA_6th_rep_desc: "La France insoumise uspěla v reformě Páté republiky. Kromě institucí však tyto reformy budou mít dalekosáhlé důsledky pro francouzskou společnost a ekonomiku." # todo: NEW TRANSLATION
 FRA_Commies_agenda: "Politika Francouzské komuny" # todo: NEW TRANSLATION
 FRA_Commies_agenda_desc: "Komuna Francie se rozhodla radikálně rozejít s minulostí a je odhodlána vybudovat společnost od základů." # todo: NEW TRANSLATION
 FRA_Bonapartist_agenda: "Císařská společnost" # todo: NEW TRANSLATION
 FRA_Bonapartist_agenda_desc: "Náš nový císař se rozhodl reformovat francouzskou společnost, aby byla tváří v tvář nadcházejícím konfliktům větší a silnější." # todo: NEW TRANSLATION
 FRA_Royalist_agenda: "Společnost nových Franků" # todo: NEW TRANSLATION
 FRA_Royalist_agenda_desc: "Musíme skoncovat se všemi ďábelskými vynálezy prokleté revoluce. Obnovíme franskou společnost na pevných základech." # todo: NEW TRANSLATION
 FRA_World_revolution: "Světová revoluce" # todo: NEW TRANSLATION
 FRA_World_revolution_desc: "Jak osvobozujeme národy od kapitalismu, přidávají se k nám lidé, kteří s sebou přinášejí své znalosti i naděje. Brzy bude Internacionála zahrnovat celé lidstvo." # todo: NEW TRANSLATION
 FRA_arab_solidarity_tt: "Zlepšené vztahy s arabskými a muslimskými zeměmi" # todo: NEW TRANSLATION
 FRA_blocks_eu_federalization_tt: "Francie blokuje federalizaci EU kvůli suverenistické politice" # todo: NEW TRANSLATION
 FRA_cannot_ally_usa_hard_tt: "Nelze uzavřít spojenectví s USA" # todo: NEW TRANSLATION
 FRA_cannot_host_american_bases_tt: "Nelze hostit americké vojenské základny" # todo: NEW TRANSLATION
 FRA_cannot_join_american_coalitions_tt: "Nelze se připojit k vojenským koalicím vedeným Amerikou" # todo: NEW TRANSLATION
