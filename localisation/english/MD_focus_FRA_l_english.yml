 FRA_expansion_tooltip_TT: "§YTyto zaměření neukážou své skutečné účinky, dokud nedokončíme komunistické nebo nacionalistické větve.§!\n" # todo: NEW TRANSLATION
 FRA_french_canadian_TT1: "§YSpokojenost francouzsko-kanadského obyvatelstva je zvýšena díky Francii, která pomáhá kanadské vládě.§!\n" # todo: NEW TRANSLATION
