 FRA_napoleon_army_reform_tt: "Reformy Grande Armée dokončeny: §Y[?FRA_grande_armee_reforms_completed|0]/3§!" # todo: NEW TRANSLATION
 FRA_6threp_tt: "V nadcházejících událostech sepíšete ústavu, která může, ale nemusí být na konci procesu přijata. Nezapomeňte spěchat, než nadšení opadne" # todo: NEW TRANSLATION
 france_md.800.t: "Francie se obrací proti Americe" # todo: NEW TRANSLATION
 france_md.800.d: "Nová francouzská vláda zaujala otevřeně protiamerický postoj, odmítla spolupráci s Washingtonem a ostře kritizuje americkou zahraniční politiku. Jedná se o dramatický obrat v transatlantických vztazích. Jak by měly Spojené státy reagovat na tento nepřátelský obrat v Paříži?" # todo: NEW TRANSLATION
 france_md.800.a: "Odsoudit tuto nepřátelskou politiku" # todo: NEW TRANSLATION
 france_md.800.b: "Pokusit se o diplomatické oslovení" # todo: NEW TRANSLATION
 france_md.801.t: "Americké diplomatické gesto" # todo: NEW TRANSLATION
 france_md.801.d: "Navzdory našemu protiamerickému postoji vyslal Washington diplomatické signály ve snaze zachovat určitou úroveň spolupráce. Ministerstvo zahraničí zřejmě přehlédne naši rétoriku výměnou za omezenou spolupráci. Jak bychom měli na toto americké úsilí reagovat?" # todo: NEW TRANSLATION
 france_md.801.a: "Zcela odmítnout americké nabídky" # todo: NEW TRANSLATION
 france_md.801.b: "Zvážit omezenou spolupráci" # todo: NEW TRANSLATION
 france_md.802.t: "Francie se obrací k Rusku" # todo: NEW TRANSLATION
 france_md.802.d: "Nová francouzská vláda oznámila dramatický obrat v zahraniční politice a usiluje o užší vztahy s Moskvou, zatímco se vzdaluje Washingtonu. Je to příležitost rozšířit ruský vliv v západní Evropě. Jak bychom měli na toto francouzské přeskupení reagovat?" # todo: NEW TRANSLATION
 france_md.802.a: "Posílit vztahy s Francií" # todo: NEW TRANSLATION
 france_md.802.b: "Postupovat obezřetně" # todo: NEW TRANSLATION
 france_md.803.t: "Důsledky komunistické zahraniční politiky" # todo: NEW TRANSLATION
 france_md.803.d: "Naše komunistická zahraniční politika nás izolovala od tradičních západních spojenců, ale otevřela dveře socialistickým a antiimperialistickým hnutím po celém světě. Kuba, Venezuela a další levicové vlády vítají naše nové směřování. Má to však svou cenu v podobě zhoršení vztahů se spojenci v NATO a tradičními partnery." # todo: NEW TRANSLATION
 france_md.803.a: "Přijmout socialistickou solidaritu" # todo: NEW TRANSLATION
 france_md.803.b: "Zmírnit náš přístup" # todo: NEW TRANSLATION
 france_md.804.t: "Francie se vzdaluje NATO" # todo: NEW TRANSLATION
 france_md.804.d: "[FRA.GetNameWithFlag] oznámila politiku odstupu od NATO a navázala na de Gaullův odchod z integrované velitelské struktury v roce 1966. Francouzská vláda zdůraznila „strategickou nezávislost“ a odmítla podřízenost americkému vojenskému velení. Jak bychom měli tento vývoj vnímat?" # todo: NEW TRANSLATION
 france_md.804.a: "Vyjádřit obavy o soudržnost aliance" # todo: NEW TRANSLATION
 france_md.804.b: "Zůstat k francouzské politice neutrální" # todo: NEW TRANSLATION
 france_md.805.t: "Uznání Palestiny" # todo: NEW TRANSLATION
 france_md.805.d: "Naše krajně levicová zahraniční politika nás zavazuje uznat Stát Palestina a podporovat dvoustátní řešení. Zlepší to vztahy s arabskými státy a bude to v souladu s našimi antiimperialistickými zásadami, ale zhorší vztahy s Izraelem a potenciálně i se Spojenými státy. Máme přistoupit k formálnímu uznání?" # todo: NEW TRANSLATION
 france_md.805.a: "Okamžitě uznat Palestinu" # todo: NEW TRANSLATION
 france_md.805.b: "Uznání prozatím odložit" # todo: NEW TRANSLATION
 france_md.806.t: "Francie uznává Palestinu" # todo: NEW TRANSLATION
 france_md.806.d: "Francouzská vláda formálně uznala Stát Palestina, což představuje významný posun v pařížské zahraniční politice. Toto rozhodnutí staví Francii po bok mnoha evropských zemí, ale znamená odklon od dřívějšího opatrného přístupu. Jak by měl Izrael na tento diplomatický vývoj reagovat?" # todo: NEW TRANSLATION
 france_md.806.a: "Důrazně odsoudit francouzské uznání" # todo: NEW TRANSLATION
 france_md.806.b: "Vydat umírněnou reakci" # todo: NEW TRANSLATION
 france_md.807.t: "Dilema války na Ukrajině" # todo: NEW TRANSLATION
 france_md.807.d: "Ruská invaze na Ukrajinu představuje krizi pro naši proruskou zahraniční politiku. Naše předchozí spojenectví s Moskvou je nyní hluboce problematické, protože ruské tanky vjíždějí do suverénního evropského státu. Politické náklady zachování neutrality jsou obrovské, ale odsouzení Ruska by znamenalo úplný obrat. Jaký postoj by měla Francie zaujmout?" # todo: NEW TRANSLATION
 france_md.807.a: "Odsoudit ruskou agresi" # todo: NEW TRANSLATION
 france_md.807.b: "Zachovat neutralitu" # todo: NEW TRANSLATION
 france_md.807.c: "Podpořit ruské stanovisko" # todo: NEW TRANSLATION
 france_md.808.t: "Francouzská suverenistická politika" # todo: NEW TRANSLATION
 france_md.808.d: "[FRA.GetNameWithFlag] zaujala v Evropské unii silně suverenistický postoj, blokuje další integraci a vetuje převody suverenity na Brusel. Francouzská vláda prosazuje „Evropu národů“ namísto federálního superstátu. Jak bychom měli na tuto francouzskou obstrukci reagovat?" # todo: NEW TRANSLATION
 france_md.808.a: "Postavit se proti francouzské obstrukci" # todo: NEW TRANSLATION
 france_md.808.b: "Sympatizovat s obavami o suverenitu" # todo: NEW TRANSLATION
 france_md.809.t: "Iniciativa hnutí nezúčastněných" # todo: NEW TRANSLATION
 france_md.809.d: "Naše neangažovaná zahraniční politika přitáhla zájem dalších zemí hledajících alternativu k americkým i ruským sférám vlivu. Máme příležitost postavit Francii do čela nového hnutí nezúčastněných a spolupracovat s Indií, Brazílií a dalšími velmocemi mimo tradiční bloky." # todo: NEW TRANSLATION
 france_md.809.a: "Usilovat o vedení nezúčastněných" # todo: NEW TRANSLATION
 france_md.809.b: "Soustředit se na domácí priority" # todo: NEW TRANSLATION
 france_md.810.t: "Francouzská strategická nezávislost" # todo: NEW TRANSLATION
 france_md.810.d: "[FRA.GetNameWithFlag] oznámila politiku úplné strategické nezávislosti, odmítá podřízenost jakékoli cizí mocnosti a zdůrazňuje úlohu francouzského jaderného odstrašení. To může mít důsledky pro francouzsko-německé partnerství, které bylo základem evropské spolupráce. Jak by mělo Německo reagovat?" # todo: NEW TRANSLATION
 france_md.810.a: "Vyjádřit obavy o bilaterální vztahy" # todo: NEW TRANSLATION
 france_md.810.b: "Respektovat francouzskou suverenitu" # todo: NEW TRANSLATION
 france_md.811.t: "Francie přijímá multipolaritu" # todo: NEW TRANSLATION
 france_md.811.d: "Francouzská vláda oznámila podporu multipolárnímu světovému řádu, odmítá americkou hegemonii a usiluje o užší vztahy s rostoucími mocnostmi. To představuje příležitost, aby Čína rozšířila svůj vliv v Evropě. Jak by měl Peking na tuto francouzskou nabídku reagovat?" # todo: NEW TRANSLATION
 france_md.811.a: "Posílit vztahy s Francií" # todo: NEW TRANSLATION
 france_md.811.b: "Udržovat opatrnou spolupráci" # todo: NEW TRANSLATION
 france_md.812.t: "Francie opouští NATO" # todo: NEW TRANSLATION
 france_md.812.d: "Formálně jsme vystoupili ze Severoatlantické aliance a dokončili tak naše zpřetrhání s americkou hegemonií. Francie nyní stojí sama, není vázána článkem 5 ani nepodléhá americkému vojenskému velení. Toto rozhodnutí otevírá nové možnosti i skutečná nebezpečí. Jakou cestou by se měla Francie vydat?" # todo: NEW TRANSLATION
 france_md.812.a: "Přijmout úplnou strategickou nezávislost" # todo: NEW TRANSLATION
 france_md.812.b: "Hledat nová spojenectví" # todo: NEW TRANSLATION
 FRA_extremist_foreign_policy_category: "Extremistická zahraniční politika" # todo: NEW TRANSLATION
 FRA_extremist_foreign_policy_category_desc: "Diplomatické a zahraničněpolitické kroky dostupné Francii pod extremistickou nebo gaullistickou vládou." # todo: NEW TRANSLATION
 FRA_rejoin_nato_command: "Znovu se připojit k integrovanému velení NATO" # todo: NEW TRANSLATION
 FRA_rejoin_nato_command_desc: "Po našem odstupu od NATO se můžeme rozhodnout znovu připojit k integrované vojenské velitelské struktuře. Obnovilo by to naše postavení v alianci a zlepšilo vztahy s americkými a evropskými spojenci." # todo: NEW TRANSLATION
 FRA_seek_russian_partnership: "Usilovat o ruské partnerství" # todo: NEW TRANSLATION
 FRA_seek_russian_partnership_desc: "Naše nezávislá zahraniční politika vytváří příležitost k posílení vztahů s Moskvou. Můžeme usilovat o užší diplomatické a hospodářské vztahy s Ruskem, což však dále zatíží vztahy s Washingtonem." # todo: NEW TRANSLATION
 FRA_recognize_palestine: "Uznat Palestinu" # todo: NEW TRANSLATION
 FRA_recognize_palestine_desc: "Naše antiimperialistická zahraniční politika vyžaduje uznat Stát Palestina a podpořit právo palestinského lidu na sebeurčení. Zlepší to vztahy s arabskými státy, ale poškodí vztahy s Izraelem." # todo: NEW TRANSLATION
 FRA_condemn_russia_ukraine: "Odsoudit ruskou agresi" # todo: NEW TRANSLATION
 FRA_condemn_russia_ukraine_desc: "Ruská invaze na Ukrajinu učinila náš proruský postoj politicky neudržitelným. Můžeme agresi odsoudit a vzdálit se Moskvě, ačkoli by to znamenalo významný obrat v politice." # todo: NEW TRANSLATION
 FRA_non_aligned_initiative: "Iniciativa vedení nezúčastněných" # todo: NEW TRANSLATION
 FRA_non_aligned_initiative_desc: "Naše neangažovaná zahraniční politika staví Francii do pozice vůdce nového hnutí národů hledajících alternativu k americké hegemonii i ruskému vlivu. Můžeme posílit vztahy s Indií, Brazílií a dalšími velmocemi mimo tradiční bloky." # todo: NEW TRANSLATION
 FRA_socialist_solidarity: "Socialistická solidarita" # todo: NEW TRANSLATION
 FRA_socialist_solidarity_desc: "Naše komunistická zahraniční politika vyžaduje solidaritu se socialistickými státy celého světa. Můžeme posílit vztahy s Kubou, Venezuelou a dalšími levicovými vládami a vybudovat mezinárodní síť antikapitalistické spolupráce." # todo: NEW TRANSLATION
 FRA_veto_eu_federalization: "Vetovat federalizaci EU" # todo: NEW TRANSLATION
 FRA_veto_eu_federalization_desc: "Jako suverénní národ v rámci EU můžeme využít své právo veta k zablokování další federalizace a převodů suverenity na Brusel. Tím bráníme francouzskou nezávislost, ale zhoršujeme vztahy s členskými státy podporujícími integraci." # todo: NEW TRANSLATION
 FRA_immigration_wave: "Využít migrační vlnu" # todo: NEW TRANSLATION
 FRA_immigration_wave_desc: "Současná liberální imigrační politika Francie vedla k významnému přílivu migrantů. Zatímco někteří to považují za humanitární nutnost nebo hospodářskou příležitost, jiní se na to dívají s rostoucími obavami. Národní sdružení může těchto nálad využít a prezentovat se jako obránce francouzské identity a bezpečnosti. Čím otevřenější budou naše hranice, tím silnější odpor dokážeme využít." # todo: NEW TRANSLATION
 FRA_high_immigration_tooltip: "Francie musí mít zákon §YOtevřené hranice§! nebo §YMírně regulované přistěhovalectví§!" # todo: NEW TRANSLATION
 FRA_immigration_backlash: "Odpor proti přistěhovalectví" # todo: NEW TRANSLATION
 FRA_immigration_backlash_desc: "Francouzskou společností se šíří vlna protiimigračních nálad. Poselství Národního sdružení o přistěhovalectví, bezpečnosti a národní identitě oslovuje stále větší část obyvatelstva, posouvá politickou scénu doprava a oslabuje podporu statusu quo." # todo: NEW TRANSLATION
 FRA_end_extraction: "Omezit těžbu surovin" # todo: NEW TRANSLATION
 FRA_end_extraction_desc: "V rámci naší ekologické vize zavedeme přísné regulace těžby, dobývání ropy a těžkého průmyslu v celé pevninské Francii. Tím se domácí produkce surovin sníží přibližně o třetinu, jde však o nezbytný krok k ochraně životního prostředí. Budoucí vlády mohou tuto politiku zvrátit, pokud se okolnosti změní." # todo: NEW TRANSLATION
 FRA_green_extraction_ban: "Ekologická omezení těžby" # todo: NEW TRANSLATION
 FRA_green_extraction_ban_desc: "Francie zavedla komplexní ekologická omezení těžby surovin. Těžební operace čelí přísným limitům, vrtání ropy je silně regulováno a průmyslová těžba musí splňovat náročné ekologické standardy. Přestože to snížilo domácí dostupnost surovin přibližně o třetinu, pokles znečištění vedl k měřitelnému zlepšení zdraví: míra výskytu rakoviny v bývalých průmyslových regionech výrazně klesla a náklady na zdravotnictví se snižují." # todo: NEW TRANSLATION
 FRA_environmental_policy_decisions: "Ekologická politika" # todo: NEW TRANSLATION
 FRA_environmental_policy_decisions_desc: "Rozhodnutí týkající se francouzské ekologické politiky a regulace těžby surovin." # todo: NEW TRANSLATION
 FRA_reverse_extraction_ban: "Zrušit omezení těžebního zákoníku" # todo: NEW TRANSLATION
 FRA_reverse_extraction_ban_desc: "Přepracovaný těžební zákoník vytlačil náš těžební průmysl z trhu a zanechal rafinerie závislé na dovozu. Jeho zrušení obnoví domácí produkci a znamená rozchod se zelenými a ekologickými sdruženími, která jej vytvořila." # todo: NEW TRANSLATION
 france_md.960.t: "Francie přepracovává svůj těžební zákoník" # todo: NEW TRANSLATION
 france_md.960.d: "[FRA.GetNameWithFlag] přepracovala svůj těžební zákoník, ukončila povolování těžby uhlovodíků a omezila těžbu v celé metropolitní Francii. S tím zmizí přibližně třetina francouzské domácí produkce. Ekologická sdružení jásají a průmyslové federace už v Bruselu varují před tímto precedentem." # todo: NEW TRANSLATION
 france_md.960.a: "Precedent hodný následování" # todo: NEW TRANSLATION
 france_md.960.b: "Evropský průmysl za to zaplatí" # todo: NEW TRANSLATION
 france_md.900.t: "Tajný účet ministra rozpočtu" # todo: NEW TRANSLATION
 france_md.900.d: "Náš ministr rozpočtu, který z Bercy řídí kampaň proti daňovým podvodům, před samotným Národním shromážděním popřel, že by měl zahraniční účet. Vyšetřovací web nyní zveřejnil stopu: nejprve Ženeva, poté Singapur. Popření je zaznamenáno a byla to lež." # todo: NEW TRANSLATION
 france_md.900.a: "Odvolat ministra a předat spis státnímu zastupitelství" # todo: NEW TRANSLATION
 france_md.900.b: "Přijmout tichou rezignaci" # todo: NEW TRANSLATION
 france_md.900.c: "Postavit se za ministra" # todo: NEW TRANSLATION
 france_md.901.t: "Úřad pro transparentnost veřejného života" # todo: NEW TRANSLATION
 france_md.901.d: "Skandál učinil majetková přiznání nevyhnutelnými. Můžeme vytvořit nezávislý úřad pro transparentnost veřejného života, který by každého ministra, poslance a senátora zavázal uvádět své zájmy a majetek a měl pravomoc předávat pochybné případy státnímu zastupitelství. Národní shromáždění bude každou jeho řádku nenávidět." # todo: NEW TRANSLATION
 france_md.901.a: "Vytvořit úřad pro transparentnost" # todo: NEW TRANSLATION
 france_md.901.b: "Zveřejnit etický kodex a jít dál" # todo: NEW TRANSLATION
 france_md.902.t: "Fiktivní parlamentní asistent kandidáta" # todo: NEW TRANSLATION
 france_md.902.d: "Le Canard enchaîné otiskl výplatní pásky: přední prezidentský kandidát zaměstnal člena rodiny na parlamentní výplatní listině za práci, kterou nikdo v kanceláři nedokáže potvrdit. Parquet national financier zahájilo předběžné vyšetřování ještě téhož rána. Kandidát to označuje za institucionální spiknutí a odmítá odstoupit." # todo: NEW TRANSLATION
 france_md.902.a: "Stáhnout kandidáta z voleb" # todo: NEW TRANSLATION
 france_md.902.b: "Pokračovat v kampani bez ohledu na okolnosti" # todo: NEW TRANSLATION
 france_md.902.c: "Obvinit soudce a tisk" # todo: NEW TRANSLATION
 france_md.903.t: "Bývalý prezident před soudem" # todo: NEW TRANSLATION
 france_md.903.d: "Bývalý prezident republiky čelí obvinění z fiktivních obecních funkcí placených pařížskými daňovými poplatníky a z faktur za kampaň vystavených společnosti za mítinky, které se nikdy nekonaly. Prezidentská imunita skončila s jeho mandátem. Tribunal correctionnel stanovil datum jednání." # todo: NEW TRANSLATION
 france_md.903.a: "Nechat soud konat svou práci" # todo: NEW TRANSLATION
 france_md.903.b: "Odsoudit politický proces" # todo: NEW TRANSLATION
 france_md.910.t: "Žluté vesty na kruhových objezdech" # todo: NEW TRANSLATION
 france_md.910.d: "Daň z uhlíku na naftu postavila na každý kruhový objezd v zemi vesty s vysokou viditelností. Nestojí za tím žádný odbor, strana ani delegace, se kterou by se dalo vyjednávat: pouze řidiči, drobní obchodníci a důchodci, kteří už u čerpacích stanic nemohou snést ani další centim. Sobota se proměnila v permanentní demonstraci." # todo: NEW TRANSLATION
 france_md.910.a: "Zrušit zvýšení palivové daně" # todo: NEW TRANSLATION
 france_md.910.b: "Daň ponechat a zahájit jednání" # todo: NEW TRANSLATION
 france_md.910.c: "Trvat na zachování daně" # todo: NEW TRANSLATION
 france_md.911.t: "Champs-Élysées v sobotu hoří" # todo: NEW TRANSLATION
 france_md.911.d: "Sobotní pochody nyní končí slzným plynem na Champs-Élysées, s posprejovaným Vítězným obloukem a vyrabovanými brasseries na třídě. Préfecture de police docházejí odpočaté jednotky CRS a je obviňována za celé odpoledne. Obchody se na sezonu zabedňují." # todo: NEW TRANSLATION
 france_md.911.a: "Svolat Grand Débat National" # todo: NEW TRANSLATION
 france_md.911.b: "Zvýšit minimální mzdu a snížit CSG z důchodů" # todo: NEW TRANSLATION
 france_md.911.c: "Vyslat CRS" # todo: NEW TRANSLATION
 france_md.912.t: "Pátý měsíc na kruhových objezdech" # todo: NEW TRANSLATION
 france_md.912.d: "Okupace vstupují do pátého měsíce a gumové projektily vystřelené vlastní policií jsou samy předmětem soudního vyšetřování. Tržby v centrech měst se zhroutily a préfectures už nedokážou zajišťovat nové jednotky. Matignon požaduje rozhodnutí tento týden." # todo: NEW TRANSLATION
 france_md.912.a: "Vyhlásit hospodářský a sociální stav nouze" # todo: NEW TRANSLATION
 france_md.912.b: "Zakázat pochody a vyhlásit výjimečný stav" # todo: NEW TRANSLATION
 france_md.920.t: "Socialisté přicházejí o své sídlo" # todo: NEW TRANSLATION
 france_md.920.d: "Veřejné financování následuje počet mandátů a po posledních dvou kolech jich není dost na to, aby v Solférinu zůstala rozsvícená světla. Frondeurs chtějí stranu vrátit doleva, starostové a odcházející ministři ji chtějí udržet schopnou vládnout a obě křídla jsou dvořena zvenčí. Budova už má stanovenou cenu." # todo: NEW TRANSLATION
 france_md.920.a: "Vrátit stranu doleva" # todo: NEW TRANSLATION
 france_md.920.b: "Ukotvit stranu ve vládním středu" # todo: NEW TRANSLATION
 france_md.920.c: "Nechat křídla odejít" # todo: NEW TRANSLATION
 france_md.921.t: "Strana diskutuje o dédiabolisation" # todo: NEW TRANSLATION
 france_md.921.d: "Nové vedení Národního sdružení chce přijatelnost: ekonomické argumenty namísto etnických, žádné další provokace ohledně táborů a kandidáty, kteří obstojí v televizním rozhovoru. Cílem je front républicain, který stranu vyřadil z každého druhého kola. Zakládající generace to označuje za kapitulaci." # todo: NEW TRANSLATION
 france_md.921.a: "Nechat stranu normalizovat se" # todo: NEW TRANSLATION
 france_md.921.b: "Držet stranu její staré linie" # todo: NEW TRANSLATION
 france_md.921.c: "Nechat zakládající rodinu hádat se na veřejnosti" # todo: NEW TRANSLATION
 france_md.922.t: "Zakladatel proti vlastní straně" # todo: NEW TRANSLATION
 france_md.922.d: "Zakladatel zopakoval svou starou provokaci o táborech před kamerami uprostřed kampaně, které se neúčastní. Vedení svolalo disciplinární komisi a vypisuje čestné předsednictví ze stanov. Kongres rozhodne, zda si strana ponechá své jméno." # todo: NEW TRANSLATION
 france_md.922.a: "Předat stranu nové generaci" # todo: NEW TRANSLATION
 france_md.922.b: "Vyloučit zakladatele" # todo: NEW TRANSLATION
 france_md.923.t: "Pravice rozbíjí republikánskou frontu" # todo: NEW TRANSLATION
 france_md.923.d: "Vůdce tradiční pravice vystoupil ve večerních zprávách a oznámil volební pakt s Národním sdružením, aniž by jej předložil vlastnímu politickému byru. Byro se muselo sejít v pronajaté místnosti, protože nechal stranické sídlo zamknout. Čtyřicet let front républicain skončilo jediným vysíláním." # todo: NEW TRANSLATION
 france_md.923.a: "Vyloučit ho a odmítnout pakt" # todo: NEW TRANSLATION
 france_md.923.b: "Potvrdit pakt pro druhé kolo" # todo: NEW TRANSLATION
 france_md.923.c: "Nechat stranu rozdělit se na dvě" # todo: NEW TRANSLATION
 france_md.930.t: "Osm odborů proti důchodové reformě" # todo: NEW TRANSLATION
 france_md.930.d: "Zvýšení zákonného důchodového věku poprvé za jednu generaci postavilo všech osm reprezentativních odborů na stejnou platformu. SNCF a RATP pořádají průběžné stávky, rafinerie budou následovat a Národní shromáždění nemá pro návrh většinu. V Matignonu leží na stole článek 49.3." # todo: NEW TRANSLATION
 france_md.930.a: "Prosadit návrh pomocí článku 49.3" # todo: NEW TRANSLATION
 france_md.930.b: "Jednat s reformními odbory" # todo: NEW TRANSLATION
 france_md.930.c: "Stáhnout návrh" # todo: NEW TRANSLATION
 france_md.931.t: "Reformní odbory nabízejí podmínky" # todo: NEW TRANSLATION
 france_md.931.d: "Reformní konfederace přijmou pozdější důchodový věk, pokud bude zaveden po čtvrtletních krocích a dlouhé kariéry a namáhavá práce budou mít výjimky. Úspory se sníží na polovinu a radikální federace nepodepíší vůbec nic. Je to jediný návrh, pod kterým jsou podpisy." # todo: NEW TRANSLATION
 france_md.931.a: "Podepsat kompromis" # todo: NEW TRANSLATION
 france_md.931.b: "Odmítnout a nechat stávky pokračovat" # todo: NEW TRANSLATION
 france_md.932.t: "Univerzity jsou zablokované" # todo: NEW TRANSLATION
 france_md.932.d: "První pracovní smlouva, která zaměstnavatelům umožňuje propustit osoby mladší 26 let bez uvedení důvodu, přivedla odpadkové koše před brány Sorbonny a poloviny provinčních kampusů. Ke studentským odborům se přidala lycées a CGT. Préfecture žádá o povolení budovy vyklidit." # todo: NEW TRANSLATION
 france_md.932.a: "Stáhnout smlouvu" # todo: NEW TRANSLATION
 france_md.932.b: "Jednat se studentskými odbory" # todo: NEW TRANSLATION
 france_md.932.c: "Vyklidit kampusy" # todo: NEW TRANSLATION
 france_md.940.t: "Napjaté volby" # todo: NEW TRANSLATION
 france_md.940.d: "První kolo místních voleb vyřadilo vládní kandidáty ve většině francouzských měst a do druhého kola dostalo extremistickou stranu. Během hodiny se objevily výzvy k front républicain: volit toho, kdo zbyl, a hádat se o tom později. Jiní odpovídají, že hlas vynucený tímto způsobem není mandátem." # todo: NEW TRANSLATION
 france_md.940.a: "Vyzvat k front républicain" # todo: NEW TRANSLATION
 france_md.940.b: "Nechat druhé kolo na voličích" # todo: NEW TRANSLATION
 france_md.940.c: "Považovat výsledek za verdikt o nás" # todo: NEW TRANSLATION
 france_md.941.t: "Hnutí mimo staré strany" # todo: NEW TRANSLATION
 france_md.941.d: "Bývalý ministr opustil vládu, aby vybudoval vlastní hnutí, ani levicové, ani pravicové, financované placenými mítinky a založené na členském seznamu sestaveném ode dveří ke dveřím. Poslanci obou vládních stran se již ptají na místa na jeho kandidátkách. Ani jedna strana nemá kandidáta, který by v průzkumech překonal jeho." # todo: NEW TRANSLATION
 france_md.941.a: "Podpořit hnutí" # todo: NEW TRANSLATION
 france_md.941.b: "Odmítnout je jako pomíjivou módu" # todo: NEW TRANSLATION
 france_md.941.c: "Přinutit staré strany k obnově" # todo: NEW TRANSLATION
 france_md.950.t: "Noci nepokojů na předměstích" # todo: NEW TRANSLATION
 france_md.950.d: "Dva teenageři zemřeli při útěku před kontrolou totožnosti v cité v Seine-Saint-Denis. Třetí noc se počet zapálených aut vyšplhal na tisíce, od severních předměstí až po Toulouse a Štrasburk. Starostové žádají zákaz vycházení podle zákona z roku 1955." # todo: NEW TRANSLATION
 france_md.950.a: "Zavést zákaz vycházení podle zákona z roku 1955" # todo: NEW TRANSLATION
 france_md.950.b: "Financovat agenturu obnovy a prioritní čtvrti" # todo: NEW TRANSLATION
 france_md.950.c: "Slíbit vyčištění sídlišť" # todo: NEW TRANSLATION
 france_md.949.t: "Koordinované útoky napříč Paříží" # todo: NEW TRANSLATION
 france_md.949.d: "Útoky stále pokračují ve východních arrondissements a na Stade de France. BRI stojí u dveří koncertního sálu, uvnitř jsou rukojmí. Každá nemocnice v Île-de-France přešla na krizový plán." # todo: NEW TRANSLATION
 france_md.949.a: "Vyhlásit tři dny státního smutku" # todo: NEW TRANSLATION
 france_md.951.t: "Parlament se schází na kongresu" # todo: NEW TRANSLATION
 france_md.951.d: "Pochody skončily a obě komory byly svolány do Versailles. Beauvau chce prodloužit état d'urgence a zdvojnásobit Sentinelle, Quai d'Orsay chce vyslat svaz letadlové lodi na východ a Conseil d'État nás již varuje před administrativními prohlídkami." # todo: NEW TRANSLATION
 france_md.951.a: "Prodloužit état d'urgence" # todo: NEW TRANSLATION
 france_md.951.b: "Vyslat svaz letadlové lodi na východ" # todo: NEW TRANSLATION
 france_md.951.c: "Odmítnout nouzové pravomoci" # todo: NEW TRANSLATION
 france_md.952.t: "Referendum o evropské ústavě" # todo: NEW TRANSLATION
 france_md.952.d: "Smlouva půjde místo kongresu k lidu a kampaň rozštěpila obě vládní strany napůl. Levice argumentuje proti jako proti chartě vysílané práce a pravice jako proti konci francouzské suverenity. Poslední průzkumy ukazují oba tábory v rámci statistické chyby." # todo: NEW TRANSLATION
 france_md.952.a: "Tvrdě vést kampaň za schválení" # todo: NEW TRANSLATION
 france_md.952.b: "Držet se mimo kampaň" # todo: NEW TRANSLATION
 france_md.952.c: "Místo toho ratifikovat prostřednictvím kongresu" # todo: NEW TRANSLATION
 france_md.953.t: "Levice vyjednává společný program" # todo: NEW TRANSLATION
 france_md.953.d: "Socialisté, komunisté, Zelení a insoumis si mezi sebou rozdělují volební obvody, jednu kandidaturu za druhou. Sporné body se od posledního pokusu nezměnily: evropské smlouvy a otázka, kdo povede platformu. Každá strana zvažuje, zda jí dohoda přinese více mandátů, než kolik jich ztratí." # todo: NEW TRANSLATION
 france_md.953.a: "Postavit do čela bloku umírněného kandidáta" # todo: NEW TRANSLATION
 france_md.953.b: "Nechat insoumis určit program" # todo: NEW TRANSLATION
 france_md.953.c: "Nechat jednání ztroskotat" # todo: NEW TRANSLATION
 france_md.954.t: "Assemblée bez většiny" # todo: NEW TRANSLATION
 france_md.954.d: "Assemblée se vrátila ve třech blocích a žádný z nich nedokáže získat 289 mandátů. Každý kandidát na Matignon může být v den jmenování odvolán hlasováním o nedůvěře a rozpočet musí být schválen před koncem zasedání. Élysée přijímá předsedy stran jednoho po druhém, ale nikam se neposouvá." # todo: NEW TRANSLATION
 france_md.954.a: "Jmenovat vládu odborníků" # todo: NEW TRANSLATION
 france_md.954.b: "Rozpustit shromáždění a vrátit se k lidu" # todo: NEW TRANSLATION
 france_md.954.c: "Vybudovat koalici napříč bloky" # todo: NEW TRANSLATION
 FRA_ps_platform: "Program Socialistické strany" # todo: NEW TRANSLATION
 FRA_ps_platform_desc: "Strana staví na výsledcích pluralitní levice: pětatřicetihodinovém pracovním týdnu, všeobecném zdravotním pojištění a pracovních smlouvách pro mladé, přičemž vše je financováno širší daňovou základnou namísto půjček. Každý závazek přijatý na sjezdu má oporu v rozpočtu a Rue de Solférino chce být hodnocena podle toho, zda peníze skutečně dorazí." # todo: NEW TRANSLATION
 FRA_udf_platform: "Program centristické unie" # todo: NEW TRANSLATION
 FRA_udf_platform_desc: "Střed vede kampaň za nižší odvody pro podniky, méně svazující pracovní zákoník a konec zvyku řešit každý problém novým poplatkem. Tvrdí, že kapitál zůstane ve Francii pouze tehdy, pokud Francie přestane považovat investice za něco, co je třeba trestat." # todo: NEW TRANSLATION
 FRA_lr_platform: "Program republikánské pravice" # todo: NEW TRANSLATION
 FRA_lr_platform_desc: "Gaullistická pravice nabízí klasickou dohodu Páté republiky: armádu financovanou tak, aby mohla jednat samostatně, kdykoli to Republika vyžaduje, a stát zbavený vrstev administrativy, které se kolem něj nahromadily. Pořádek doma a nezávislost v zahraničí jsou představovány jako jedna a táž politika." # todo: NEW TRANSLATION
 FRA_rpf_platform: "Suverenistický program" # todo: NEW TRANSLATION
 FRA_rpf_platform_desc: "Pasqua a de Villiers vedou kampaň na základě jediné zásady: žádná smlouva nesmí převést pravomoci, které náleží francouzskému lidu, a tuto zásadu uplatňují na euro, Schengen i pravomoci Komise. Obchodní partneři tento program chápou jako hrozbu pro každé uspořádání, které s Paříží podepsali." # todo: NEW TRANSLATION
 FRA_fn_platform: "Program Národní fronty" # todo: NEW TRANSLATION
 FRA_fn_platform_desc: "Národní preference v oblasti bydlení, zaměstnanosti a sociálních dávek, zastavení slučování rodin a obnovení hraničních kontrol tvoří celý program. Přitahuje davy, které žádná jiná strana nedokáže shromáždit, a zároveň ve stejné míře posiluje odpor všech ostatních vůči straně." # todo: NEW TRANSLATION
 FRA_lfi_platform: "Program Nepokořené Francie" # todo: NEW TRANSLATION
 FRA_lfi_platform_desc: "Hnutí vede kampaň za ústavodárné shromáždění, které pohřbí prezidentskou monarchii, a své argumenty prosazuje spíše v ulicích a na shromážděních než v Národním shromáždění. Hlavním požadavkem je bezplatná zdravotní péče v místě poskytování a staré stranické loajality se všude, kudy kampaň projde, rozpouštějí." # todo: NEW TRANSLATION
 FRA_eelv_platform: "Ekologický program" # todo: NEW TRANSLATION
 FRA_eelv_platform_desc: "Zelení požadují ukončení programu výstavby reaktorů, podřízení stavebnictví ekologickému přezkumu a převedení peněz na výzkum toho, co oba zdroje nahradí. Přechod, který popisují, je skutečný, stejně jako desetiletí pomalejší výstavby, které vyžaduje." # todo: NEW TRANSLATION
 FRA_pcf_platform: "Program Komunistické strany" # todo: NEW TRANSLATION
 FRA_pcf_platform_desc: "Strana stále ovládá obce rudého pásu a odborové organizace ve velkých továrnách a vede kampaň tam, kde je nejsilnější: přímo na pracovištích, za mzdy, pracovní dobu a ochranu průmyslové zaměstnanosti. Tam, kde jsou buňky aktivní, fungují továrny lépe, než předpokládají účetní výkazy." # todo: NEW TRANSLATION
 FRA_idea_transparency_reforms: "Transparentnost veřejného života" # todo: NEW TRANSLATION
 FRA_idea_transparency_reforms_desc: "Každý ministr, poslanec a senátor nyní podává prohlášení o svých zájmech a majetku nezávislému úřadu, který je může zveřejnit a sporné případy předat státním zástupcům. Politická třída tuto povinnost nesnášela, ale splnila ji." # todo: NEW TRANSLATION
 FRA_idea_national_debate: "Velká národní debata" # todo: NEW TRANSLATION
 FRA_idea_national_debate_desc: "Po dobu dvou měsíců starostové otevírají své radnice každému, kdo přijde, a příspěvky jsou zaznamenávány po desítkách tisíc. Stojí to peníze i čas ministrů, ale přesouvá to debatu z kruhových objezdů do radnic." # todo: NEW TRANSLATION
 FRA_idea_social_emergency_measures: "Hospodářská a sociální nouze" # todo: NEW TRANSLATION
 FRA_idea_social_emergency_measures_desc: "Příplatek k minimální mzdě byl zvýšen, přesčasy byly osvobozeny od daně a zvýšení CSG bylo u menších důchodů zrušeno. Účet se ve stejném čtvrtletí promítá do deficitu a Brusel si toho všiml." # todo: NEW TRANSLATION
 FRA_idea_pension_reform_passed: "Důchodová reforma podle článku 49.3" # todo: NEW TRANSLATION
 FRA_idea_pension_reform_passed_desc: "Důchodový věk vzrostl bez hlasování podle článku, který spojuje odpovědnost vlády s návrhem zákona, a návrh na vyslovení nedůvěry postrádal několik poslanců. Důchodové účty se zlepšují a každý další text, který zašleme do Assemblée, bude posuzován prizmatem tohoto rozhodnutí." # todo: NEW TRANSLATION
 FRA_idea_pension_compromise: "Vyjednaná důchodová reforma" # todo: NEW TRANSLATION
 FRA_idea_pension_compromise_desc: "Důchodový věk se zvyšuje po čtvrtletních krocích, s výjimkami pro dlouhé kariéry a pro práci klasifikovanou jako namáhavá. Reformistické konfederace dohodu podepsaly, radikální federace nikoli, a úspory činí přibližně polovinu toho, co sliboval původní návrh." # todo: NEW TRANSLATION
 FRA_idea_political_renewal: "Obnova politické třídy" # todo: NEW TRANSLATION
 FRA_idea_political_renewal_desc: "Polovina lavic v Assemblée nikdy nezastávala volenou funkci a stranické aparáty již nekontrolují vlastní nominace. Noví poslanci jsou viditelní, energičtí a zcela nezkušení." # todo: NEW TRANSLATION
 FRA_idea_urban_renewal: "Obnova městských sídlišť" # todo: NEW TRANSLATION
 FRA_idea_urban_renewal_desc: "Agentura pro obnovu podepisuje se starosty prioritních čtvrtí patnáctileté dohody, bourá nejhorší věžové domy a za nimi staví nové školy. Výsledky se dostaví dlouho po vládě, která je nařídila." # todo: NEW TRANSLATION
 FRA_idea_national_unity: "Národní jednota po útocích" # todo: NEW TRANSLATION
 FRA_idea_national_unity_desc: "Opozice pozastavila své návrhy, trikolóry visí v oknech a záloha i četnictvo mají více dobrovolníků, než dokážou zpracovat. Nevydrží to celý rok, ale dokud to trvá, má to svou hodnotu." # todo: NEW TRANSLATION
 FRA_idea_technocratic_government: "Vláda odborníků" # todo: NEW TRANSLATION
 FRA_idea_technocratic_government_desc: "Ministerstva ovládají prefekti, finanční inspektoři a bývalí centrální bankéři jmenovaní z Élysée a tolerovaní Assemblée, která se na ničem jiném nedokáže shodnout. Dokážou schválit rozpočet. Nedokážou schválit reformu." # todo: NEW TRANSLATION
 FRA_heightened_security: "Aktivní plán Vigipirate" # todo: NEW TRANSLATION
 FRA_heightened_security_desc: "Vigipirate byl zvýšen na úroveň zesílené bezpečnosti a střežení citlivých míst přešlo od policie k armádě v rámci Opération Sentinelle. Tisíce vojáků nyní stojí před nádražími, školami a místy bohoslužeb a armáda účtuje náklady své připravenosti, nikoli Beauvau." # todo: NEW TRANSLATION
 FRA_state_of_emergency_terrorism: "Vyhlášen état d'urgence" # todo: NEW TRANSLATION
 FRA_state_of_emergency_terrorism_desc: "Platí zákon z roku 1955: prefekti mohou nařizovat prohlídky bez soudce, ukládat jednotlivcům domácí vězení a z vlastního rozhodnutí zakazovat shromáždění. Parlament jej každé tři měsíce obnovuje a Conseil d'État eviduje odvolání." # todo: NEW TRANSLATION
 FRA_terror_threat_elevated: "Zvýšená teroristická hrozba" # todo: NEW TRANSLATION
 FRA_terror_threat_elevated_desc: "DGSI vede více spisů o navrátilcích a radikalizovaných osobách, než kolik má důstojníků k jejich sledování, a seznam se stále rozrůstá. Velké akce jsou rušeny prefekturním nařízením, nikoli zabezpečovány." # todo: NEW TRANSLATION
 FRA_terror_threat_critical: "Kritická teroristická hrozba" # todo: NEW TRANSLATION
 FRA_terror_threat_critical_desc: "Bezpečnostní služby mají současně pod dohledem několik operačních buněk a již neočekávají, že je všechny zachytí. Dovolené byly zrušeny u policie i četnictva a ministr vnitra přestal uvádět termíny." # todo: NEW TRANSLATION
 FRA_national_mourning: "Dny národního smutku" # todo: NEW TRANSLATION
 FRA_national_mourning_desc: "Vlajky jsou na všech veřejných budovách spuštěny na půl žerdi, v poledne se drží minuta ticha a jména obětí se čtou v Invalidovně. Tento týden se nevyřizuje žádná běžná agenda." # todo: NEW TRANSLATION
 FRA_damaged_infrastructure: "Poškozená kritická infrastruktura" # todo: NEW TRANSLATION
 FRA_damaged_infrastructure_desc: "Útoky vyřadily přestupní stanici metra a část vysokonapěťové sítě a opravy zaostávají za nouzovým harmonogramem. Provozovatelé pracují na základě prefekturní rekvizice a účet hradí stát." # todo: NEW TRANSLATION
 FRA_tourism_crisis: "Krize cestovního ruchu" # todo: NEW TRANSLATION
 FRA_tourism_crisis_desc: "Obsazenost hotelů v Île-de-France se zhroutila a dálkoví turističtí operátoři zrušili zájezdy na celou sezónu. Cestovní ruch je naším největším zdrojem deviz a vrátí se tempem zahraničního zpravodajství, nikoli tempem naší bezpečnostní politiky." # todo: NEW TRANSLATION
 france_md.970.t: "Bomba v RER během dopravní špičky" # todo: NEW TRANSLATION
 france_md.970.d: "Zařízení ponechané ve vagónu vybuchlo během ranní špičky ve stanici s přestupem, v úseku tunelu, kam se záchranné složky mohou dostat pouze pěšky. Desítky lidí jsou mrtvé a počet zraněných stále roste. Celá síť je zastavena a platí plán pro hromadná neštěstí." # todo: NEW TRANSLATION
 france_md.970.a: "Rekvirovat nemocnice a záchranné složky" # todo: NEW TRANSLATION
 france_md.970.b: "Vyhlásit den státního smutku" # todo: NEW TRANSLATION
 france_md.970.c: "Znovu otevřít síť a odmítnout nouzové pravomoci" # todo: NEW TRANSLATION
 france_md.971.t: "Ozbrojenci zaútočili na policejní stanici" # todo: NEW TRANSLATION
 france_md.971.d: "Útočníci s útočnými puškami a vozidlem sváděli čtyřicet minut boj o policejní stanici na severním předměstí, než k nim dorazila BRI. Policisté jsou mrtví a budovu nelze používat. Ten, kdo útok naplánoval, znal čas střídání směn." # todo: NEW TRANSLATION
 france_md.971.a: "Uzavřít departement a dopadnout komplice" # todo: NEW TRANSLATION
 france_md.971.b: "Opevnit každou policejní stanici v zemi" # todo: NEW TRANSLATION
 france_md.972.t: "Sebevražedné týmy udeřily po celém hlavním městě" # todo: NEW TRANSLATION
 france_md.972.d: "Tři týmy s útočnými puškami a výbušnými pásy během jediné hodiny zaútočily v okolí stadionu, v řadě barů a v koncertní síni. Více než sto lidí je mrtvých a chirurgové z Île-de-France operují ve válečném režimu. Na naší půdě nebylo od války provedeno nic takového rozsahu." # todo: NEW TRANSLATION
 france_md.972.a: "Vyhlásit état d'urgence" # todo: NEW TRANSLATION
 france_md.972.b: "Uplatnit evropskou doložku vzájemné obrany" # todo: NEW TRANSLATION
 france_md.972.c: "Udeřit na základny organizace v zahraničí" # todo: NEW TRANSLATION
 france_md.973.t: "Útok na Louvre" # todo: NEW TRANSLATION
 france_md.973.d: "Muž s čepelí byl zastaven na kontrolním stanovišti Carrousel, ale tým, který stál za ním, pronikl vchodem z Tuilerií s výbušninami a nyní se nachází v Denonově křídle. Návštěvníci se zabarikádovali v galeriích nad nimi. Pracovníci památkové péče žádají čas na přesun toho, co lze ještě zachránit." # todo: NEW TRANSLATION
 france_md.973.a: "Nejprve dostat návštěvníky ven" # todo: NEW TRANSLATION
 france_md.973.b: "Zajistit sbírku před zahájením útoku" # todo: NEW TRANSLATION
 france_md.974.t: "Útočníci uvnitř vojenské základny" # todo: NEW TRANSLATION
 france_md.974.d: "Tým překonal obvod letecké základny v jediném místě, kde byly pozastaveny opravy plotu, a dostal se až k pohotovostnímu rozmístění, než jej zastavila stráž. Znali rozpis služeb i kódy u brány. Vojenská kontrašpionáž nyní vyšetřuje naše vlastní příslušníky." # todo: NEW TRANSLATION
 france_md.974.a: "Prověřit bezpečnost na každém vojenském objektu" # todo: NEW TRANSLATION
 france_md.974.b: "Nechat kontrašpionáž prověřit řady" # todo: NEW TRANSLATION
 france_md.975.t: "Rukojmí na Eiffelově věži" # todo: NEW TRANSLATION
 france_md.975.d: "Ozbrojení muži vyjeli výtahy s prvními turisty dne a drží horní plošinu s několika stovkami rukojmích. Mechanismus výtahů je zaminován a GIGN se nemůže přiblížit přes Champ de Mars, aniž by byl spatřen na vzdálenost jednoho kilometru. Požadují propuštění vězňů a televizní přenos." # todo: NEW TRANSLATION
 france_md.975.a: "Vyslat GIGN na věž" # todo: NEW TRANSLATION
 france_md.975.b: "Jednat s nimi a získat čas" # todo: NEW TRANSLATION
 france_md.975.c: "Odmítnout všechny požadavky" # todo: NEW TRANSLATION
 france_md.976.t: "Útok na jadernou elektrárnu" # todo: NEW TRANSLATION
 france_md.976.d: "Útočníci ovládají administrativní blok a budovu s vyhořelým palivem v elektrárně v údolí Loiry. Tvrdí, že jakmile se k areálu někdo přiblíží, otevřou bazén s palivem. Radiační institut vymodeloval oblak a ten překračuje tři hranice." # todo: NEW TRANSLATION
 france_md.976.a: "Odstavit reaktor a vyslat GIGN" # todo: NEW TRANSLATION
 france_md.976.b: "Zaútočit na areál se vším, co máme" # todo: NEW TRANSLATION
 france_md.980.t: "Koordinované útoky zpustošily Paříž" # todo: NEW TRANSLATION
 france_md.980.d: "Současné útoky v okolí stadionu, v koncertní síni a v řadě barů v Paříži si vyžádaly více než sto obětí. Francie uzavřela hranice a vyslala armádu do ulic. Ministerstva vnitra po celé Evropě znovu pročítají vlastní spisy o navrátilcích." # todo: NEW TRANSLATION
 france_md.980.a: "Stojíme při Francii" # todo: NEW TRANSLATION
 france_md.981.t: "Ozbrojenci vtrhli do Louvru" # todo: NEW TRANSLATION
 france_md.981.d: "Ozbrojení útočníci se nacházejí v Denonově křídle Louvru a návštěvníci se zabarikádovali v okolních galeriích. Muzeum ukrývá díla, která nelze nahradit žádným pojištěním ani restaurováním. Každá významná sbírka na kontinentu zvažuje, jak by postupovala." # todo: NEW TRANSLATION
 france_md.981.a: "Nabídnout Francii pomoc" # todo: NEW TRANSLATION
 france_md.982.t: "Rukojmí drženi na Eiffelově věži" # todo: NEW TRANSLATION
 france_md.982.d: "Několik stovek návštěvníků drží ozbrojení muži na horní plošině Eiffelovy věže, přičemž zaminovali mechanismus výtahů. Francouzské speciální jednotky se rozmísťují na Champ de Mars před zraky kamer celého světa. Ministerstva zahraničí podle seznamů návštěvníků zjišťují počet vlastních občanů." # todo: NEW TRANSLATION
 france_md.982.a: "Nabídnout veškerou pomoc, kterou Francie přijme" # todo: NEW TRANSLATION
 france_md.983.t: "Francouzská jaderná elektrárna pod útokem" # todo: NEW TRANSLATION
 france_md.983.d: "Po celé Evropě byla vydána mimořádná varování, když teroristé zaútočili na francouzské jaderné zařízení. Úřady sice tvrdí, že bezprostřední riziko úniku radiace neexistuje, ale možnost katastrofy černobylského rozsahu otřásla celým kontinentem. Vlády připravují krizové plány a obyvatelům v okolí zařízení bylo nařízeno ukrýt se ve svých domovech." # todo: NEW TRANSLATION
 france_md.983.a: "Připravit krizové plány" # todo: NEW TRANSLATION
 france_md.985.t: "Teroristické spiknutí zmařeno" # todo: NEW TRANSLATION
 france_md.985.d: "Francouzské zpravodajské služby úspěšně překazily rozsáhlé teroristické spiknutí. Měsíce sledování, operací v utajení a mezinárodní spolupráce vedly ke koordinovaným raziím, při nichž byli spiklenci zajati dříve, než mohli udeřit. Podrobnosti zůstávají utajeny, ale zdroje uvádějí, že plánovaný útok mohl být katastrofální. Tento úspěch potvrzuje význam rozsáhlých investic do schopností boje proti terorismu." # todo: NEW TRANSLATION
 france_md.985.a: "Ocenit zpravodajské služby" # todo: NEW TRANSLATION
 france_md.985.b: "Udržovat zvýšenou bezpečnost" # todo: NEW TRANSLATION
 FRA_counter_terrorism_category: "Protiteroristické operace" # todo: NEW TRANSLATION
 FRA_french_communism_expansionism_decision_category: "Válka proti kapitalismu" # todo: NEW TRANSLATION
 FRA_3rd_empire_decision_category: "Rozšířit třetí říši" # todo: NEW TRANSLATION
 FRA_LFI6th_decision_category: "Úsvit nové republiky" # todo: NEW TRANSLATION
 FRA_french_socialist_downfall_decision_category: "Pád socialismu" # todo: NEW TRANSLATION
 FRA_frexit_decision_category: "Odchod z Evropské unie" # todo: NEW TRANSLATION
 FRA_royalist_expansion_decision_category: "Znovudobytí" # todo: NEW TRANSLATION
 FRA_EU_assistance_decision_category: "Evropské hospodářské partnerství" # todo: NEW TRANSLATION
 FRA_GREEN_EU_assistance_decision_category: "Evropská ekologická transformace" # todo: NEW TRANSLATION
 FRA_activate_vigipirate: "Aktivovat Vigipirate" # todo: NEW TRANSLATION
 FRA_activate_vigipirate_desc: "Aktivovat francouzský systém národního bezpečnostního varování, vyslat ozbrojené vojáky k hlídkování na veřejných prostranstvích a zvýšit bezpečnost na citlivých místech. To poskytuje ochranu před teroristickými útoky, ale přináší trvalé náklady." # todo: NEW TRANSLATION
 FRA_declare_state_of_emergency: "Vyhlásit výjimečný stav" # todo: NEW TRANSLATION
 FRA_declare_state_of_emergency_desc: "V reakci na kritickou teroristickou hrozbu vyhlásit celostátní výjimečný stav. Ten bezpečnostním složkám poskytne rozšířené pravomoci, ale pozastaví některé občanské svobody." # todo: NEW TRANSLATION
 FRA_end_state_of_emergency: "Ukončit výjimečný stav" # todo: NEW TRANSLATION
 FRA_end_state_of_emergency_desc: "Po zmírnění bezprostřední hrozby ukončit výjimečný stav a obnovit běžné občanské svobody. Pomůže to normalizovat každodenní život a snížit politické napětí." # todo: NEW TRANSLATION
 FRA_intelligence_surge: "Posílit zpravodajství" # todo: NEW TRANSLATION
 FRA_intelligence_surge_desc: "Výrazně zvýšit financování a zdroje zpravodajských služeb s cílem zlepšit schopnosti sledování a protiteroristických operací. To umožní proaktivní operace proti teroristickým sítím." # todo: NEW TRANSLATION
 FRA_secure_critical_infrastructure: "Zabezpečit kritickou infrastrukturu" # todo: NEW TRANSLATION
 FRA_secure_critical_infrastructure_desc: "Investovat do posílení kritické infrastruktury – elektráren, dopravních uzlů a telekomunikací – proti teroristickým útokům. Je to nákladné, ale sníží to zranitelnost vůči rozsáhlým útokům." # todo: NEW TRANSLATION
 FRA_operation_sentinelle: "Operace Sentinelle" # todo: NEW TRANSLATION
 FRA_operation_sentinelle_desc: "Nasadit tisíce vojáků k úkolům vnitřní bezpečnosti, hlídkovat v ulicích, chránit citlivá místa a podporovat policejní operace. Tato viditelná vojenská přítomnost uklidní veřejnost, ale zatíží ozbrojené síly." # todo: NEW TRANSLATION
 FRA_anti_terror_raid: "Provést protiteroristický zásah" # todo: NEW TRANSLATION
 FRA_anti_terror_raid_desc: "Na základě shromážděných zpravodajských informací provést razie proti podezřelým teroristickým buňkám. Úspěch by mohl narušit plánované útoky a snížit celkovou úroveň hrozby." # todo: NEW TRANSLATION
 FRA_terrorism_defeated: "Vyhlásit vítězství nad terorismem" # todo: NEW TRANSLATION
 FRA_terrorism_defeated_desc: "Po obnovení stability a bez nedávných útoků formálně prohlásit teroristickou hrozbu za neutralizovanou. To posílí morálku a umožní národu vykročit vpřed." # todo: NEW TRANSLATION
 FRA_rebuild_after_attack: "Obnovit poškozenou infrastrukturu" # todo: NEW TRANSLATION
 FRA_rebuild_after_attack_desc: "Investovat do oprav infrastruktury poškozené teroristickými útoky. Obnova těchto zařízení je nezbytná pro návrat k běžnému životu a prokázání odolnosti." # todo: NEW TRANSLATION
 FRA_tourism_recovery_campaign: "Kampaň za obnovu cestovního ruchu" # todo: NEW TRANSLATION
 FRA_tourism_recovery_campaign_desc: "Zahájit rozsáhlou mezinárodní kampaň na propagaci Francie jako bezpečné turistické destinace. Obnova cestovního ruchu je pro ekonomiku zásadní a ukazuje, že teroristé nemohou zničit francouzský způsob života." # todo: NEW TRANSLATION
 FRA_6threp_mission: "Lidové nadšení" # todo: NEW TRANSLATION
 FRA_6threp_mission_desc: "Naše odhodlání reformovat politický systém udělalo radost mnoha lidem. Mnozí si přejí změnu, ale nesmíme působit jako ti, kteří se snaží proces zdržovat." # todo: NEW TRANSLATION
 FRA_rally_support: "Ukázat náš pokrok" # todo: NEW TRANSLATION
 FRA_rally_support_desc: "Naši protivníci se snaží proces zpomalit a zpochybňují každou změnu, kterou provedeme. Musíme však zůstat pevní. Dosáhli jsme mnohého a musíme to ukázat." # todo: NEW TRANSLATION
 FRA_rally_ennemy: "Opozice kritizuje naše reformy" # todo: NEW TRANSLATION
 FRA_rally_ennemy_desc: "Ačkoli jsou tyto změny nezbytné, ne každému se vždy zamlouvají. Naše opozice dělá vše, co je v jejích silách, aby kritizovala každé rozhodnutí týkající se budoucnosti naší republiky." # todo: NEW TRANSLATION
 FRA_timebomb_mission: "Neodvratný rozvod" # todo: NEW TRANSLATION
 FRA_timebomb_mission_desc: "Dvě hlavní frakce uvnitř Socialistické strany hrozí odchodem, pokud situaci nevyřešíme. Musíme jim ukázat, že v Socialistické straně existuje budoucnost, než bude pozdě." # todo: NEW TRANSLATION
 FRA_support_decrease_mission: "Naše strana se rozpadá" # todo: NEW TRANSLATION
 FRA_support_decrease_mission_desc: "Čím déle budeme otálet s uklidněním našich straníků, tím více jich odejde ke skupinám bližším jejich ideologiím. Musíme situaci rychle napravit." # todo: NEW TRANSLATION
 FRA_campaign_against_extremism: "Kampaň proti extremismu" # todo: NEW TRANSLATION
 FRA_campaign_against_extremism_desc: "V těchto neklidných časech musíme levici i středu připomenout, že my, socialisté, jsme správnou volbou proti narůstajícímu politickému extremismu." # todo: NEW TRANSLATION
 FRA_campaign_clash_traitors: "Odplata stranickým zrádcům" # todo: NEW TRANSLATION
 FRA_campaign_clash_traitors_desc: "Každý, kdo nás opustí kvůli módnější straně, musí očekávat, že ho odhalíme v médiích. Nejsou ničím jiným než oportunisty a agenty chaosu." # todo: NEW TRANSLATION
 FRA_boost_eurosceptism: "Kampaň proti Evropské unii" # todo: NEW TRANSLATION
 FRA_boost_eurosceptism_desc: "Od veřejných debat po plakáty v ulicích musí celá naše společnost vyzařovat euroskepticismus. Musíme Francouzům vysvětlit, že za všechny naše problémy mohou evropští byrokraté." # todo: NEW TRANSLATION
 FRA_disobey_treaties: "Porušení evropských smluv" # todo: NEW TRANSLATION
 FRA_disobey_treaties_desc: "Už se nesmíme klanět těmto hloupým zákonům. Ve vlastním domě jsme pány a v každém případě je jen otázkou času, než opustíme Evropskou unii." # todo: NEW TRANSLATION
 FRA_denounce_eu_policies: "Odhalit evropskou politiku" # todo: NEW TRANSLATION
 FRA_denounce_eu_policies_desc: "Musíme zaměřit náš protest na nespravedlivé zákony, které přicházejí z Evropského parlamentu, aniž bychom jim mohli odporovat. Jaký smysl má hlasovat ve volbách, když výsledek už skutečně nezávisí na nás?" # todo: NEW TRANSLATION
 FRA_threaten_media: "Vyhrožovat proevropským médiím" # todo: NEW TRANSLATION
 FRA_threaten_media_desc: "Proevropské smýšlení proniklo do našich institucí, až do médií. Měli bychom těmto pisálkům připomenout, aby se drželi témat odpovídajících jejich úrovni a přestali jít proti proudu." # todo: NEW TRANSLATION
 FRA_red_benelux: "Osvobodit Benelux" # todo: NEW TRANSLATION
 FRA_red_benelux_desc: "Musíme osvobodit Benelux od kapitalismu a evropského liberalismu" # todo: NEW TRANSLATION
 FRA_benelux_boost: "Integrovat kultury Beneluxu" # todo: NEW TRANSLATION
 FRA_benelux_boost_desc: "Nizozemští, vlámští a valonští dělníci se nyní připojují k revoluci jako jeden celek a jejich továrny a odbory jsou začleněny do našeho socialistického projektu." # todo: NEW TRANSLATION
 FRA_done_with_dumping: "Konec daňových rájů" # todo: NEW TRANSLATION
 FRA_done_with_dumping_desc: "Samotná existence těchto zemí, které zasvětily svou existenci fungování jako daňové ráje, je urážkou samotné myšlenky rovnosti a solidarity. Musíme s tím skoncovat." # todo: NEW TRANSLATION
 FRA_dumping_boost: "Integrovat švýcarskou kulturu" # todo: NEW TRANSLATION
 FRA_dumping_boost_desc: "Zničili jsme bankovní struktury, které udržovaly daňový ráj, a švýcarská pracovní síla se znovu začleňuje do našeho hospodářského projektu." # todo: NEW TRANSLATION
 FRA_red_iberia: "Už nikdy žádný diktátor" # todo: NEW TRANSLATION
 FRA_red_iberia_desc: "Musíme zajistit, aby naše jižní křídlo znovu nepadlo pod vliv fašismu." # todo: NEW TRANSLATION
 FRA_iberia_boost: "Integrovat iberské kultury" # todo: NEW TRANSLATION
 FRA_iberia_boost_desc: "Španělská a portugalská dělnická hnutí konečně spatřují příslib toho, co jim rok 1936 nemohl přinést, a připojují se k naší revoluci jako rovní." # todo: NEW TRANSLATION
 FRA_ciao_bella: "Ciao Bella" # todo: NEW TRANSLATION
 FRA_ciao_bella_desc: "Komunistická revoluce v Itálii selhala, ale na italský lid zanechala trvalý dojem. Je čas napravit křivdy minulosti." # todo: NEW TRANSLATION
 FRA_italy_boost: "Integrovat italskou kulturu" # todo: NEW TRANSLATION
 FRA_italy_boost_desc: "Dědictví PCI žije dál. Dokončíme biennio rosso, které italští dělníci započali, ale nikdy nedokončili." # todo: NEW TRANSLATION
 FRA_avenge_long_knife: "Noc dlouhých srpů" # todo: NEW TRANSLATION
 FRA_avenge_long_knife_desc: "Musíme vyvolat revoluci v germánských státech, osvobodit je od kapitalismu a zabránit tomu, aby nacionalismus znovu zvítězil." # todo: NEW TRANSLATION
 FRA_ger_aus_boost: "Integrovat germánské kultury" # todo: NEW TRANSLATION
 FRA_ger_aus_boost_desc: "Východoněmecké průmyslové kádry a rakouské odbory přinášejí do našeho revolučního projektu svou disciplínu a zkušenosti." # todo: NEW TRANSLATION
 FRA_ostalgia: "Vrátit revoluci do východní Evropy" # todo: NEW TRANSLATION
 FRA_ostalgia_desc: "Země východní Evropy velmi trpěly pod sovětskou okupací. Musíme jim ukázat, že i komunismus má své kladné stránky." # todo: NEW TRANSLATION
 FRA_ostalgia_boost: "Integrovat kultury východní Evropy" # todo: NEW TRANSLATION
 FRA_ostalgia_boost_desc: "Ostalgii, která stále přetrvává ve východní Evropě, přetavíme v opravdové nadšení pro naši revoluci." # todo: NEW TRANSLATION
 FRA_birthplace_revolution: "Znovu získat kolébku komunismu" # todo: NEW TRANSLATION
 FRA_birthplace_revolution_desc: "Musíme přinést revoluci zpět Rusům, kteří zapomněli na někdejší slávu komunismu." # todo: NEW TRANSLATION
 FRA_birthplace_boost: "Integrovat slovanské kultury" # todo: NEW TRANSLATION
 FRA_birthplace_boost_desc: "Znovu získáváme kolébku revoluce a vítáme ruské a slovanské národy zpět do hnutí, které kdysi vedly." # todo: NEW TRANSLATION
 FRA_no_more_neutrality: "Ukončit severní neutralitu" # todo: NEW TRANSLATION
 FRA_no_more_neutrality_desc: "Země severní Evropy se příliš dlouho vyhýbaly volbě mezi socialismem a kapitalismem. Je čas, aby tuto volbu učinily." # todo: NEW TRANSLATION
 FRA_neutrality_boost: "Integrovat nordické kultury" # todo: NEW TRANSLATION
 FRA_neutrality_boost_desc: "Severská sociální demokracie je konečně obrácena na naši stranu a její dělníci a instituce jsou začleněni do našeho širšího revolučního projektu." # todo: NEW TRANSLATION
 FRA_cold_war2: "Už žádná studená válka" # todo: NEW TRANSLATION
 FRA_cold_war2_desc: "Pomstíme SSSR a rozpad Varšavské smlouvy zničením toho, co zbylo z NATO." # todo: NEW TRANSLATION
