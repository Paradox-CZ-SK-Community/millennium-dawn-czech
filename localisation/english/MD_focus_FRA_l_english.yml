 FRA_worker_solidarity_tt: "Přitahuje dělníky z celého světa prostřednictvím mezinárodní dělnické solidarity" # todo: NEW TRANSLATION
 FRA_too_stable_tt: "§YStabilita pod 25 %§! poskytuje maximální nárůst popularity strany" # todo: NEW TRANSLATION
