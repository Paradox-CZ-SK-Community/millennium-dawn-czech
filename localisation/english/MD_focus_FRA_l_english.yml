 FRA_corporate_systems_events.10.b: "Získejte strategické duševní vlastnictví a aktiva" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.10.b_tt: "Polovodičová kapacita: §G+0.2§!\nStav STMicroelectronics: §G+0.3§!\nZískáte jeden výzkumný bonus §G5%§! pro §YMikročipovou technologii§!." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.10.c: "Akvizici odmítněte" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.10.c_tt: "Stav STMicroelectronics: §G+0.2§!" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.10.d: "Restrukturalizace Alcatelu zpochybnila budoucnost jeho mikroelektronických aktiv. STMicroelectronics může usilovat o celý podnik, zaměřit se pouze na strategické technologie, nebo zachovat kapitál pro jiné priority." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.10.t: "Mikroelektronika Alcatelu je na prodej" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.a: "Rozšiřte nadnárodní výzkumnou alianci" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.a_tt: "Strategická suverenita: §R-0.1§!\nPolovodičová kapacita: §G+0.6§!\nZískáte 2 výzkumné bonusy §G10%§! pro §YMikročipovou technologii§!." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.b: "Vybudujte program vedený Francií" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.b_tt: "Politická moc: §R-75§!\nStrategická suverenita: §G+0.5§!\nPolovodičová kapacita: §G+0.4§!\nZískáte jeden výzkumný bonus §G10%§! pro §YMikročipovou technologii§!." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.c: "Omezte naši kapitálovou expozici" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.c_tt: "Polovodičová kapacita: §G+0.1§!\nStav STMicroelectronics: §G+0.2§!" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.d: "Motorola je připravena připojit se ke společnostem STMicroelectronics a Philips v projektu Crolles2 a rozšířit alianci kolem vývoje pokročilých výrobních postupů. Větší rozsah by rozložil náklady a odborné znalosti, zároveň by však oslabil čistě francouzskou kontrolu." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.11.t: "Aliance Crolles2 se rozšiřuje" # todo: NEW TRANSLATION
