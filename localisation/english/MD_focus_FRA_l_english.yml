 FRA_corporate_systems_shift_plan_restructuring: "Restrukturalizace plánu Shift" # todo: NEW TRANSLATION
 FRA_corporate_systems_shift_plan_restructuring_desc: "Alcatel-Lucent se zaměřuje na IP sítě, cloudové systémy a infrastrukturu ultraširokopásmového připojení, přičemž snižuje náklady a prodává vedlejší aktiva. Přechod dočasně omezuje produkci, zatímco společnost obnovuje své technologické portfolio." # todo: NEW TRANSLATION
 FRA_corporate_systems_telecom_crash_restructuring: "Restrukturalizace po telekomunikačním kolapsu" # todo: NEW TRANSLATION
 FRA_corporate_systems_telecom_crash_restructuring_desc: "Alcatel zavírá provozy a omezuje kapacity poté, co se trh s telekomunikačními zařízeními zhroutil. Tato opatření zmírňují dlouhodobý tlak na jeho rozvahu, ale krátkodobě narušují průmyslovou výrobu a zaměstnanost." # todo: NEW TRANSLATION
 FRA_corporate_systems_vendor_replacement_burden: "Zátěž nahrazení dodavatele 5G" # todo: NEW TRANSLATION
 FRA_corporate_systems_vendor_replacement_burden_desc: "Omezení schvalování zařízení Huawei nutí operátory nahrazovat instalovaná zařízení a přepracovávat plány zavádění. Přechod posiluje dlouhodobou kontrolu nad kritickými sítěmi, ale zpomaluje jejich rozšiřování." # todo: NEW TRANSLATION
 FRA_corporate_systems_wireless_exit_costs: "Náklady na ukončení ST-Ericsson" # todo: NEW TRANSLATION
 FRA_corporate_systems_wireless_exit_costs_desc: "Rozpuštění ST-Ericsson vyžaduje odpisy, převody zaměstnanců a nákladné rozdělení technologií a aktiv. Odchod odstraňuje dlouhodobou zátěž, ale krátkodobě narušuje výzkum bezdrátových technologií." # todo: NEW TRANSLATION
