 FRA_alstom_manufacturer: "Alstom" # todo: NEW TRANSLATION
 FRA_alstom_manufacturer_desc: "Společnost Alstom, přejmenovaná z GEC Alsthom při uvedení na pařížskou burzu v roce 1998, vyrábí francouzské lokomotivy, vysokorychlostní soupravy, metra, tramvaje a železniční signalizaci. Záchrana státem v roce 2004 a prodej energetické divize společnosti General Electric v roce 2015 z ní udělaly čistě železniční podnik; koupě společnosti Bombardier Transportation v roce 2021 z ní učinila největšího výrobce kolejových vozidel mimo Čínu." # todo: NEW TRANSLATION
 FRA_alstom_manufacturer_trait: "Průmyslová základna kolejových vozidel" # todo: NEW TRANSLATION
 FRA_alstom_manufacturer_trait_desc: "Belfort, La Rochelle, Reichshoffen, Crespin, Le Creusot a Ornans tvoří ve Francii kompletní dodavatelský řetězec železničního průmyslu od trakce přes skříně, podvozky a finální montáž až po signalizaci, bez zahraničních dodávek." # todo: NEW TRANSLATION
 FRA_alstom_branch_high_speed: "Program vysokorychlostní železnice" # todo: NEW TRANSLATION
 FRA_alstom_branch_urban_transit: "Městská doprava" # todo: NEW TRANSLATION
 FRA_alstom_branch_freight_logistics: "Nákladní a logistická železnice" # todo: NEW TRANSLATION
 FRA_alstom_tgv_duplex: "TGV Duplex" # todo: NEW TRANSLATION
 FRA_alstom_tgv_duplex_desc: "Dvoupatrový TGV Duplex vstoupil do služby v roce 1996 a stal se standardní vysokorychlostní soupravou na přetížené trase Paříž–Lyon. Bez prodlužování nástupišť přepraví o 40 procent více cestujících v každém vlaku." # todo: NEW TRANSLATION
 FRA_alstom_belfort_power_cars: "Hnací vozy z Belfortu" # todo: NEW TRANSLATION
 FRA_alstom_belfort_power_cars_desc: "Závod v Belfortu vyrábí trakční čelní vozy pro všechny francouzské vysokorychlostní soupravy. Od uzavření kontraktu na Avelia Horizon získává tři čtvrtiny práce z jediného programu, což soustřeďuje náklady i riziko do jedné haly." # todo: NEW TRANSLATION
 FRA_alstom_avelia_horizon: "Avelia Horizon" # todo: NEW TRANSLATION
 FRA_alstom_avelia_horizon_desc: "Pátá generace TGV objednaná SNCF v roce 2018 zachovává dvoupatrové uspořádání, ale zkracuje hnací vozy. Nabízí o dvacet procent vyšší kapacitu při nižších nákladech na sedadlo a údajně o dvacet procent nižší spotřebě energie." # todo: NEW TRANSLATION
 FRA_alstom_avelia_liberty: "Avelia Liberty" # todo: NEW TRANSLATION
 FRA_alstom_avelia_liberty_desc: "Naklápěcí varianta vyrobená pro severovýchodní koridor společnosti Amtrak byla prvním vysokorychlostním exportem Alstomu do Spojených států. Zpoždění certifikace byla nákladná, objednávka však vytvořila oporu na trhu, který byl dříve francouzským kolejovým vozidlům uzavřen." # todo: NEW TRANSLATION
 FRA_alstom_la_rochelle_assembly: "Montáž v La Rochelle" # todo: NEW TRANSLATION
 FRA_alstom_la_rochelle_assembly_desc: "Závod v La Rochelle montuje osobní vozy pro rodinu Avelia a navrhuje tramvaj Citadis. Je největším samostatným zaměstnavatelem v železničním průmyslu na atlantickém pobřeží a místem, kde se nové technologie výroby skříní ověřují před přenesením do ostatních závodů." # todo: NEW TRANSLATION
 FRA_alstom_citadis_tramway: "Tramvaj Citadis" # todo: NEW TRANSLATION
 FRA_alstom_citadis_tramway_desc: "Nízkopodlažní modulární Citadis, uvedený na trh v roce 2000, se stal standardní evropskou tramvají a byl prodán do více než šedesáti měst. Jeho standardizované moduly umožňují navrhnout a dodat síť bez vlastního konstrukčního programu." # todo: NEW TRANSLATION
 FRA_alstom_metropolis_metro: "Metro Metropolis" # todo: NEW TRANSLATION
 FRA_alstom_metropolis_metro_desc: "Rodina Metropolis zahrnuje bezobslužné i konvenční soupravy metra na společné platformě, od lehkých automatických souprav po osmivozové soupravy pro hlavní tratě. Sériová výroba udržuje jednotkové náklady pod úrovní zakázkových národních konstrukcí." # todo: NEW TRANSLATION
 FRA_alstom_urbalis_cbtc: "Urbalis CBTC" # todo: NEW TRANSLATION
 FRA_alstom_urbalis_cbtc_desc: "Urbalis je vlakový zabezpečovací systém Alstomu založený na komunikaci, který umožňuje bezobslužný provoz a intervaly kratší než devadesát sekund. Vyvinutý v Crespinu a Villeurbanne tvoří signalizační vrstvu pod většinou automatizovaných kontraktů společnosti v oblasti metra." # todo: NEW TRANSLATION
 FRA_alstom_innovia_automated_transit: "Automatizovaná doprava Innovia" # todo: NEW TRANSLATION
 FRA_alstom_innovia_automated_transit_desc: "Automatický přepravník Innovia, zděděný po Bombardieru, spojuje letištní terminály s hustě osídlenými městskými čtvrtěmi. Jeho krátké soupravy a pevná vodicí dráha představují nejlevnější způsob, jak na existujícím místě rozšířit kapacitu kolejové dopravy." # todo: NEW TRANSLATION
 FRA_alstom_grand_paris_express: "Grand Paris Express" # todo: NEW TRANSLATION
 FRA_alstom_grand_paris_express_desc: "Největší dopravní projekt v Evropě přidává kolem Paříže čtyři automatizované linky metra a dvě stě kilometrů tratí. Alstom dodává kolejová vozidla i signalizaci a program na deset let zajišťuje jeho kapacitu v oblasti městské dopravy." # todo: NEW TRANSLATION
 FRA_alstom_prima_locomotives: "Lokomotivy Prima" # todo: NEW TRANSLATION
 FRA_alstom_prima_locomotives_desc: "Rodina elektrických a dieselových nákladních lokomotiv Prima, vyráběná od roku 2001 v Belfortu, nahradila stárnoucí vozový park SNCF a byla exportována do Maroka, Sýrie a Číny. Je tahounem francouzské nákladní železnice i vojenských přesunů po železnici." # todo: NEW TRANSLATION
 FRA_alstom_prima_h4_hybrid: "Hybridní Prima H4" # todo: NEW TRANSLATION
 FRA_alstom_prima_h4_hybrid_desc: "Posunovací lokomotiva H4 kombinuje dieselové generátory s bateriovým blokem, čímž při provozu v depech snižuje spotřebu paliva přibližně o polovinu a umožňuje tichý pohyb uvnitř dep a seřaďovacích nádraží." # todo: NEW TRANSLATION
 FRA_alstom_atlas_ertms: "Atlas ERTMS" # todo: NEW TRANSLATION
 FRA_alstom_atlas_ertms_desc: "Atlas je implementace Evropského systému řízení železniční dopravy od Alstomu, která nahrazuje nekompatibilní národní signalizaci jediným kontinentálním standardem. Palubní i traťová zařízení se vyrábějí v Crespinu." # todo: NEW TRANSLATION
 FRA_alstom_coradia_ilint: "Coradia iLint" # todo: NEW TRANSLATION
 FRA_alstom_coradia_ilint_desc: "První regionální vlak s vodíkovými palivovými články vstoupil do komerční služby v roce 2018 a provozuje neelektrifikované vedlejší tratě s vodou jako jedinou emisí. Odstraňuje potřebu instalovat trakční vedení na trasách, které by nikdy neospravedlnily kapitálové náklady." # todo: NEW TRANSLATION
 FRA_alstom_bombardier_transportation: "Bombardier Transportation" # todo: NEW TRANSLATION
 FRA_alstom_bombardier_transportation_desc: "Akvizice společnosti Bombardier Transportation, dokončená v lednu 2021 poté, co Evropská komise zablokovala fúzi se Siemens Mobility, zdvojnásobila počet závodů i objem objednávek Alstomu a učinila z něj druhého největšího výrobce železniční techniky na světě." # todo: NEW TRANSLATION
 france_md.509.t: "Zavedení ECO" # todo: NEW TRANSLATION
 france_md.509.d: "Francie navrhla nahradit frank CFA měnou ECO, novou společnou měnou západní Afriky. Její přijetí by nám poskytlo větší měnovou autonomii a užší vztahy s Francií." # todo: NEW TRANSLATION
 france_md.509.a: "Přijmout ECO" # todo: NEW TRANSLATION
 france_md.509.b: "Nabídku odmítnout" # todo: NEW TRANSLATION
 france_md.600.t: "Čipová divize, kterou už Alcatel nechce" # todo: NEW TRANSLATION
 france_md.600.d: "Telekomunikační bublina praskla a Alcatel prodává vše, co není síť. Jeho mikroelektronická divize je zisková, schopná a brzy bude patřit někomu jinému. Udržet ji ve francouzských rukou by státní pokladnu stálo skutečné peníze kvůli problému, o jehož existenci trh neví." # todo: NEW TRANSLATION
 france_md.600.a: "Udržet mikroelektronickou divizi ve francouzských rukou" # todo: NEW TRANSLATION
 france_md.600.b: "Přenechat ji evropskému kupci" # todo: NEW TRANSLATION
 france_md.601.t: "Úvěrová zeď" # todo: NEW TRANSLATION
 france_md.601.d: "France Telecom dluží více než kterákoli společnost v historii, akvizice, které tento dluh vytvořily, mají zlomek původní hodnoty a banky už jej znovu nepřevedou. Stát může vložit veřejné peníze do společnosti obchodované na burze, nebo nechat věřitele rozhodnout, čím se národní operátor stane." # todo: NEW TRANSLATION
 france_md.601.a: "Rekapitalizovat operátora veřejnými penězi" # todo: NEW TRANSLATION
 france_md.601.b: "Nechat věřitele provést restrukturalizaci" # todo: NEW TRANSLATION
 france_md.602.t: "Stát ztrácí většinu" # todo: NEW TRANSLATION
 france_md.602.d: "Prodej státního podílu ve France Telecom pod padesát procent by vynesl velké peníze a ukončil spor v Bruselu o státním dominantním operátorovi soutěžícím na otevřeném trhu. Znamenalo by to také, že o francouzské telefonní síti budou příště rozhodovat akcionáři." # todo: NEW TRANSLATION
 france_md.602.a: "Udržet státní většinu" # todo: NEW TRANSLATION
 france_md.602.b: "Prodat pod padesát procent" # todo: NEW TRANSLATION
 france_md.603.t: "Po Crolles2" # todo: NEW TRANSLATION
 france_md.603.d: "Společná aliance v Crolles poskytla třem společnostem špičkový výrobní proces, který by si žádná z nich nemohla dovolit sama, a dvě z nich nyní odcházejí. Financování náhrady znamená, že stát převezme výzkumný program, od něhož jeho partneři odstoupili. Odmítnutí znamená, že jedna francouzská společnost bude uzel vyvíjet sama, nebo se o to přestane pokoušet." # todo: NEW TRANSLATION
 france_md.603.a: "Financovat náhradu aliance" # todo: NEW TRANSLATION
 france_md.603.b: "Nechat národního šampiona, aby to zvládl sám" # todo: NEW TRANSLATION
 france_md.604.t: "Ukončení ST-Ericsson" # todo: NEW TRANSLATION
 france_md.604.d: "ST-Ericsson, společný podnik STMicroelectronics a Ericssonu vytvořený s cílem vybudovat evropského šampiona v bezdrátových technologiích, prodělával v každém čtvrtletí své existence a výrobci telefonů, pro které vznikl, nyní navrhují vlastní čipy. Jeho záchrana by pouze získala čas pro podnik, jehož trh se již přesunul jinam. Jeho ukončení odepíše poslední vážný evropský pokus o mobilní čipovou sadu." # todo: NEW TRANSLATION
 france_md.604.a: "Zachránit bezdrátový podnik" # todo: NEW TRANSLATION
 france_md.604.b: "Ukončit jej a přijmout ztráty" # todo: NEW TRANSLATION
 france_md.605.t: "IPCEI pro mikroelektroniku" # todo: NEW TRANSLATION
 france_md.605.d: "Brusel povolí to, co kdysi zakazoval: veřejné peníze ve velkém na polovodičové kapacity. Crolles lze rozšířit v něco, co bude významné pro celý kontinent, nejen pro jednu společnost. Je to dotační závod, který Francie nezačala a sama jej nemůže vyhrát; alternativou je v něm nesoutěžit." # todo: NEW TRANSLATION
 france_md.605.a: "Financovat rozšíření Crolles" # todo: NEW TRANSLATION
 france_md.605.b: "Přenechat kapacity trhu" # todo: NEW TRANSLATION
 france_md.606.t: "Co si republika ponechala" # todo: NEW TRANSLATION
 france_md.606.d: "Čtvrt století záchran, prodejů, aliancí a dotací rozhodlo o osudu společností Alcatel, France Telecom a STMicroelectronics: které části francouzské telefonní sítě a polovodičového průmyslu stát stále vlastní a které pouze spravuje." # todo: NEW TRANSLATION
 france_md.606.a: "Šampion, který republika stále vlastní" # todo: NEW TRANSLATION
 france_md.606.b: "Křemíková základna vybudovaná z veřejných peněz" # todo: NEW TRANSLATION
 france_md.606.c: "Operátor, kterého stát kdysi zachránil" # todo: NEW TRANSLATION
 france_md.606.e: "Trh jako každý jiný" # todo: NEW TRANSLATION
 FRA_cs_nationalised_systems_champion: "Znárodněný systémový šampion" # todo: NEW TRANSLATION
 FRA_cs_nationalised_systems_champion_desc: "Stát se nikdy nevzdal většinového podílu, takže síť i průmysl kolem ní se zodpovídají nejprve Paříži a teprve potom ceně akcií. Státní pokladnu to stojí tolik, kolik vždy stojí kontrolní podíl, a na oplátku přináší rozhodnutí, která zůstávají v zemi." # todo: NEW TRANSLATION
 FRA_cs_state_backed_silicon_base: "Státem podporovaná křemíková základna" # todo: NEW TRANSLATION
 FRA_cs_state_backed_silicon_base_desc: "Veřejné peníze vybudovaly výrobní kapacitu, kterou by žádná francouzská společnost sama nefinancovala, a destičky se vyrábějí ve Francii. Dotace je trvalá, protože trvalá je i tato kapacita, a obojí je nyní skutečností, nikoli předmětem sporů." # todo: NEW TRANSLATION
 FRA_cs_recapitalised_national_operator: "Rekapitalizovaný národní operátor" # todo: NEW TRANSLATION
 FRA_cs_recapitalised_national_operator_desc: "Stát vložil své peníze, když to nikdo jiný neudělal, a operátor přežil dluh, který by žádná společnost neměla nést. Byla to záchrana, nikoli trvalá struktura, a záchrany nevydrží." # todo: NEW TRANSLATION
 FRA_cs_market_like_any_other: "Trh jako každý jiný" # todo: NEW TRANSLATION
 FRA_cs_market_like_any_other_desc: "Šampioni byli prodáni, sloučeni nebo zlikvidováni za běžných obchodních podmínek a Francie nakupuje své sítě a čipy od toho, kdo je prodává nejlépe. Je to efektivní, ortodoxní a žádné strategické rozhodnutí se zde už nepřijímá." # todo: NEW TRANSLATION
 FRA_corporate_systems_ambition_ft_restructuring: "Restrukturalizace Ambition FT 2005" # todo: NEW TRANSLATION
 FRA_corporate_systems_ambition_ft_restructuring_desc: "Rekapitalizace, odprodej aktiv a provozní reformy ozdravují rozvahu společnosti France Télécom. Investice do sítě zůstávají omezené, zatímco skupina obnovuje peněžní tok." # todo: NEW TRANSLATION
 FRA_corporate_systems_french_national_champions: "Francouzští národní šampioni" # todo: NEW TRANSLATION
 FRA_corporate_systems_french_national_champions_desc: "Francie si ponechala klíčové společnosti, výzkumná pracoviště a infrastrukturu pod silným národním vedením. Suverenita a odolnost jsou vysoké, model však vyžaduje trvalou veřejnou podporu a připouští menší zahraniční integraci." # todo: NEW TRANSLATION
 FRA_corporate_systems_china_connected_infrastructure: "Infrastruktura napojená na Čínu" # todo: NEW TRANSLATION
 FRA_corporate_systems_china_connected_infrastructure_desc: "Čínští dodavatelé se stali ústřední součástí modernizace francouzské sítě. Rychlé nasazení a užší obchodní vazby s sebou přinášejí trvalou závislost v kritické infrastruktuře a vyšší rizika při nahrazování." # todo: NEW TRANSLATION
 FRA_corporate_systems_resilient_multivendor_network: "Odolná síť s více dodavateli" # todo: NEW TRANSLATION
 FRA_corporate_systems_resilient_multivendor_network_desc: "Francie rozdělila nákupy kritické síťové infrastruktury mezi několik dodavatelů a zachovala si schopnost kterékoli z nich nahradit. Výsledkem je menší koncentrace a větší odolnost, koordinace a nasazení jsou však pomalejší." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.a: "Proveďte agresivní restrukturalizaci" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.a_tt: "Stav Alcatelu: §G+0.8§!\nTlak podnikových dluhů: §G-0.6§!\nStabilita: §R-1.0%§!\nZískáte §YRestrukturalizaci telekomunikačního krachu§! na §Y730 dní§!.\nZískáte jeden výzkumný bonus §G5%§! pro §YInternetovou technologii§!." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.b: "Chraňte strategický výzkum a vývoj" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.b_tt: "Politická moc: §R-75§!\nStrategická suverenita: §G+0.4§!\nStav Alcatelu: §G+0.6§!\nZískáte jeden výzkumný bonus §G5%§! pro §YVelitelské a řídicí vybavení§!." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.c: "Udržte kurz" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.c_tt: "Stav Alcatelu: §R-1.0§!\nTlak podnikových dluhů: §R+0.8§!\nStabilita: §G+0.5%§!" # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.d: "Zhroucení boomu telekomunikačního vybavení zanechalo Alcatel s klesajícími objednávkami, nadbytečnou kapacitou a rostoucími ztrátami. Společnost se při restrukturalizaci musí rozhodnout, co zachovat." # todo: NEW TRANSLATION
 FRA_corporate_systems_events.1.t: "Telekomunikační bublina praská" # todo: NEW TRANSLATION
