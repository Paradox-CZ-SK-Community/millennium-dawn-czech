 FRA_left_nato_command_tt: "Francie opustila integrovanou velitelskou strukturu NATO" # todo: NEW TRANSLATION
 FRA_non_aligned_policy_tt: "Francie prosazuje politiku neangažovanosti" # todo: NEW TRANSLATION
 FRA_opposes_nato_expansion_tt: "Odmítá jakékoli další rozšiřování NATO" # todo: NEW TRANSLATION
 FRA_socialist_solidarity_tt: "Zlepšené vztahy se socialistickými a komunistickými státy" # todo: NEW TRANSLATION
 FRA_trade_protectionism_tt: "Domácí průmysl je chráněn před zahraniční konkurencí" # todo: NEW TRANSLATION
