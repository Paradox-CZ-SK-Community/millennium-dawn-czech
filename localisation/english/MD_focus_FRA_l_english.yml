 FRA_truly_absolutism_TT: "§gZakážeme§! §Rvšechny§! §gostatní strany a prohlásíme království za§! §Yskutečně absolutní monarchii§!" # todo: NEW TRANSLATION
 FRA_social_welf_need_tooltip_modifier_effect_TT: "Mění §Y$FRA_social_balance$§!: $FRA_SOC_welf_ned$ o [?temp_change|%-]\n" # todo: NEW TRANSLATION
 FRA_idea_the_francosphere: "Francosféra" # todo: NEW TRANSLATION
 FRA_idea_the_francosphere_desc: "Francosféra je politická a globální komunita francouzsky mluvících národů a lidí. Je to mechanismus, jak Francii pomoci prosadit svůj vliv nad bývalými koloniemi, avšak zůstává jako kooperace mezi francouzsky mluvícími národy." # todo: NEW TRANSLATION
 FRA_idea_administrative_reforms: "Správní reformy" # todo: NEW TRANSLATION
 FRA_idea_administrative_reforms_desc: "Byrokratický stroj Francie prošel sérií důležitých reforem, které snižují některé náklady a rozšiřují schopnost vlády prosazovat a uvádět do praxe řadu nových politik." # todo: NEW TRANSLATION
 FRA_idea_french_armored_production: "Francouzská obrněná vozidla" # todo: NEW TRANSLATION
 FRA_idea_french_armored_production_desc: "Francouzská obrněná vozidla patří mezi nejlepší bojová vozidla na světě. Musíme si i nadále udržet náskok a pokračovat ve výrobě obrněných vozidel, abychom čelili vzestupu nových globálních hrozeb." # todo: NEW TRANSLATION
 FRA_idea_central_decentral: "Byrokratická Reforma" # todo: NEW TRANSLATION
 FRA_idea_central_decentral_desc: "Pravomoci mezi Paříží a regiony se znovu rozdělují a každý převedený spis stojí peníze a čas, než začne přinášet výsledky." # todo: NEW TRANSLATION
 FRA_idea_military_improvement_army: "Vojenská reforma - armáda" # todo: NEW TRANSLATION
 FRA_idea_military_improvement_army_desc: "První z mnoha reforem začala tím, že jsme dali přednost armádě. Zvolili jsme ji jako nejdůležitější, protože může chránit hranice naší země i hranice našich spojenců." # todo: NEW TRANSLATION
 FRA_idea_military_improvement_navy: "Vojenská reforma - námořnictvo" # todo: NEW TRANSLATION
 FRA_idea_military_improvement_navy_desc: "První z mnoha reforem začala tím, že jsme dali přednost námořnictvu. Naše námořnictvo je důležité pro udržování zásobovacích spojení, projekci vojenské síly a zajištění našich zámořských území." # todo: NEW TRANSLATION
 FRA_idea_military_improvement_air_force: "Vojenská reforma - letectvo" # todo: NEW TRANSLATION
 FRA_idea_military_improvement_air_force_desc: "První z mnoha reforem začala tím, že jsme dali přednost letectvu. Bylo zvoleno díky své schopnosti zabránit komukoli ovládnout naši zemi ze vzduchu a poskytovat účinnou podporu námořním a pozemním silám." # todo: NEW TRANSLATION
 FRA_idea_military_improvement_army_and_navy: "Vojenská reforma - armáda a námořnictvo" # todo: NEW TRANSLATION
 FRA_idea_military_improvement_army_and_navy_desc: "Naše další série reforem se zaměřuje na armádu a námořnictvo. Armáda a námořnictvo musí být společně lépe reformovány kvůli koordinaci mezi složkami, účinné obraně lodí a efektivnějšímu využití námořních prostředků ve spolupráci s pozemními silami." # todo: NEW TRANSLATION
 FRA_idea_military_improvement_army_and_air_force: "Vojenská reforma - armáda a letectvo" # todo: NEW TRANSLATION
 FRA_idea_military_improvement_army_and_air_force_desc: "Výcvik a zdokonalení kombinovaných sil armády a letectva patří mezi nejzásadnější reformy, které můžeme provést. Spolupráce těchto dvou odlišných složek zajistí a může zajistit naše vítězství v nadcházejících konfliktech." # todo: NEW TRANSLATION
 FRA_idea_military_improvement_air_force_and_navy: "Vojenská reforma - letectvo a námořnictvo" # todo: NEW TRANSLATION
 FRA_idea_military_improvement_air_force_and_navy_desc: "Letectvo a námořnictvo jsou stejně neoddělitelné jako nepostradatelné. Zlepšení zaměřená na tyto dvě složky nám umožní chránit naše zájmy i zájmy našich přátel, spojenců a civilního obyvatelstva zde v Evropě i po celém světě." # todo: NEW TRANSLATION
 FRA_idea_the_french_military: "Reformovaná armáda" # todo: NEW TRANSLATION
 FRA_idea_the_french_military_desc: "Po letech, kdy jsme nechali armádu upadat do chaosu, jsme se konečně přinutili reformovat naše stárnoucí ozbrojené síly. Nyní můžeme dále zdůraznit, že Francie je zemí, se kterou není radno si zahrávat, ale také zemí, s níž je dobré se přátelit!" # todo: NEW TRANSLATION
 FRA_idea_space_agency_name: "CNES" # todo: NEW TRANSLATION
 FRA_idea_space_agency_name_desc: "Centre national d'études spatiales (CNES) je název francouzské národní vesmírné agentury. Byla založena v roce 1961 tehdejším prezidentem Charlesem de Gaullem, díky čemuž je třetí nejstarší vesmírnou agenturou na světě, po NASA a vesmírném programu Sovětského svazu a jeho nástupci Roskosmosu." # todo: NEW TRANSLATION
 FRA_idea_reformed_cnes: "Reformované CNES" # todo: NEW TRANSLATION
 FRA_idea_reformed_cnes_desc: "Centre national d'études spatiales (CNES) je název francouzské národní vesmírné agentury. Byla založena v roce 1961 tehdejším prezidentem Charlesem de Gaullem, díky čemuž je třetí nejstarší vesmírnou agenturou na světě, po NASA a vesmírném programu Sovětského svazu a jeho nástupci Roskosmosu. Nedávné rozpočtové změny a další politické proměny vedly k reformě CNES do podoby, kterou známe dnes." # todo: NEW TRANSLATION
 FRA_idea_cnes_failing: "Nedostatky rozpočtu CNES" # todo: NEW TRANSLATION
 FRA_idea_cnes_failing_desc: "CNES měl v uplynulém roce několik rozpočtových nedostatků, což vyvolalo značný odpor vůči odvětví, jelikož Evropská unie navrhuje vlastní vesmírnou agenturu." # todo: NEW TRANSLATION
 FRA_idea_prep_the_launch: "Příprava startu" # todo: NEW TRANSLATION
 FRA_idea_prep_the_launch_desc: "CNES se aktuálně připravuje na vypuštění kosmického nosiče. Bude to trvat nějaký čas, než bude připraven ke startu." # todo: NEW TRANSLATION
 FRA_idea_space_research: "Vesmírný výzkum" # todo: NEW TRANSLATION
 FRA_idea_space_research_desc: "Výzkum vesmíru je jedním z nejprospěšnějších způsobů, jak lépe porozumět světu kolem nás. Zaměření našeho výzkumu ve vesmíru nám může zajistit, že budeme o krok napřed před našimi soupeři a konkurencí." # todo: NEW TRANSLATION
 FRA_idea_nasa_partnership: "Partnerství CNES-NASA" # todo: NEW TRANSLATION
 FRA_idea_nasa_partnership_desc: "Partnerství mezi americkou vesmírnou agenturou NASA a naší CNES není jen o zisku, ale o vzájemném zájmu. Rozšiřování a jednání s naším spojencem může zlepšit vědecký výzkum napříč oborem a pomoci rozšířit obě agentury do nových oblastí." # todo: NEW TRANSLATION
 FRA_idea_Light_for_Europe: "Světlo Evropy" # todo: NEW TRANSLATION
 FRA_idea_Light_for_Europe_desc: "Přebytečná jaderná a obnovitelná elektřina proudí přes propojovací vedení. Sousedé platí za to, co elektrická síť nepotřebuje." # todo: NEW TRANSLATION
 FRA_cfa_franc_custodian: "Správce CFA franku" # todo: NEW TRANSLATION
 FRA_cfa_franc_custodian_desc: "Frank CFA jsme vytvořili, abychom ochránili naše kolonie před znehodnocením franku po druhé světové válce. Přestože již frank nepoužíváme, stále jsme správcem měny západoafrických zemí. Polovinu svých devizových rezerv udržují u nás, a proto můžeme těžit z aktiv, která nám poskytují.\n\n§YZískáváme 0,5 % celkového HDP§! národů, které mají §Yfrank CFA§! jako §Ydodatečný příjem§!. Současné §Ycelkové HDP§! §Yuživatelů franku CFA§!: [?FRA.FRA_cfa_franc_gdp_total]b" # todo: NEW TRANSLATION
 the_eco: "Eco" # todo: NEW TRANSLATION
 the_eco_desc: "ECO byla navrhovaná měna v západní Africe mezi národy ECOWAS a zeměmi západoafrické měnové zóny. Držitelé franku CFA z frankofonních zemí se rovněž snažili novou měnu podpořit. Sjednocuje region po měnové stránce, umožňuje další a snazší obchod se zbožím a poskytuje jednotné platidlo, za kterým se mohou národy semknout." # todo: NEW TRANSLATION
 FRA_idea_the_french_pillar_of_counterterroism: "Pilíř boje proti terorismu" # todo: NEW TRANSLATION
 FRA_idea_the_french_pillar_of_counterterroism_desc: "Terorismus sílí a je na nás, lidech Francie, abychom příliv zastavili a ochránili sebe, Evropu i všechny, kdo by mohli být poškozeni. Budoucnost Francie tváří v tvář nárůstu extremismu nebude vybojována jen slovy, ale silou našich rukou, když budeme čelit rostoucím hrozbám pro naši zemi." # todo: NEW TRANSLATION
 FRA_idea_the_french_foreign_legion: "Francouzská cizinecká legie" # todo: NEW TRANSLATION
 FRA_idea_the_french_foreign_legion_desc: "Cizinecká legie Francie je elitní sbor francouzské armády, který zahrnuje několik specializací, jako je pěchota, kavalerie, ženisté nebo výsadkové jednotky. Cizinecká legie je jedinečná bojová síla, protože umožňuje vstup všem cizím státním příslušníkům a je vysoce vycvičená." # todo: NEW TRANSLATION
 FRA_idea_Grand_ambitions: "Velké ambice v Africe" # todo: NEW TRANSLATION
 FRA_idea_Grand_ambitions_desc: "Afrika je zralá k získání a musíme postoupit vpřed a vyhlásit naše nové velké ambice. Je nesmírně důležité, abychom nadále upevňovali naši pozici v Africe, abychom se zajistili pro přítomnost i pro budoucnost všech Francouzů." # todo: NEW TRANSLATION
 FRA_idea_development_investment: "Investice do rozvoje" # todo: NEW TRANSLATION
 FRA_idea_development_investment_desc: "[FRA.GetNameWithFlag] nám poskytuje ekonomickou pomoc, která nám pomáhá rozvíjet naši zemi." # todo: NEW TRANSLATION
 AFRICA_idea_nepad_modifier: "Program rozvoje NEPAD" # todo: NEW TRANSLATION
 AFRICA_idea_nepad_modifier_desc: "Nové partnerství pro rozvoj Afriky (zkráceně NEPAD) je program hospodářského rozvoje vytvořený Africkou unií ve spolupráci s Evropskou unií, Čínou, Japonskem a dalšími členy G8. O rozvoj NEPAD se zajímáme obzvlášť a v rámci Evropské unie jsme se stali jeho hlavním finančním a politickým podporovatelem. Měli bychom pomoci rozšířit program a zvýšit jeho financování i podporu, abychom pomohli celé Africe.\n\n[FRA.GetNameWithFlag] je hlavním sponzorem tohoto programu." # todo: NEW TRANSLATION
 AFRICA_idea_nepad_modifier_tt: "Když je ovlivněn §Y[FRA.GetNameWithFlag]§!, $foreign_influence_defense_modifier$ se sníží o §Y10%§!\n" # todo: NEW TRANSLATION
 FRA_idea_nepad_modifier: "Sponzor programu rozvoje NEPAD" # todo: NEW TRANSLATION
 FRA_idea_nepad_modifier_desc: "Nové partnerství pro rozvoj Afriky (zkráceně NEPAD) je program hospodářského rozvoje vytvořený Africkou unií ve spolupráci s Evropskou unií, Čínou, Japonskem a dalšími členy G8. O rozvoj NEPAD se zajímáme obzvlášť a v rámci Evropské unie jsme se stali jeho hlavním finančním a politickým podporovatelem. Měli bychom pomoci rozšířit program a zvýšit jeho financování i podporu, abychom pomohli celé Africe.\n\n[FRA.GetNameWithFlag] je hlavním sponzorem tohoto programu, a proto získáme další výhody, například zvýšený zahraniční vliv v národech, které z programu v současnosti těží.\n" # todo: NEW TRANSLATION
 FRA_idea_nepad_modifier_cost_tt: "Naše sponzorství rozvoje AU NEPAD stojí $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b týdně." # todo: NEW TRANSLATION
 FRA_unrestricted_subjugation_idea: "Neomezené podrobení" # todo: NEW TRANSLATION
 FRA_unrestricted_subjugation_idea_desc: "Kolonie, které jsme vlastnili, nám přinesly neuvěřitelné bohatství a obrovský respekt na světové scéně. Musíme se v některých ohledech vrátit ke starším způsobům a znovu se prosadit vůči jiným národům a chránit to, co by nám mělo právoplatně patřit. Podrobení může nastat různými způsoby, například vojenskou silou, diplomatickým nátlakem a mnoha dalšími. Překážky, které nám v tom brání, musí být odstraněny." # todo: NEW TRANSLATION
 FRA_SYR_anti_assad_regime_message_idea: "Propaganda proti Asadovu režimu" # todo: NEW TRANSLATION
 FRA_SYR_anti_assad_regime_message_idea_desc: "[FRA.GetNameWithFlag] začala vysílat a poskytovat propagandu proti syrské vládě. Tato sdělení začala podkopávat vládu a nadále radikalizují mládež proti naší vládnoucí třídě. Rovněž ukazují, že vláda je náchylná k zahraničnímu vlivu." # todo: NEW TRANSLATION
 FRA_educational_development_idea: "Rozvoj vzdělávání" # todo: NEW TRANSLATION
 FRA_educational_development_idea_desc: "[FRA.GetNameWithFlag] pomáhá se vzdělávacími programy v naší zemi. Rozvoj vzdělávání snižuje některé náklady a zároveň nám umožňuje modernizovat a zlepšovat naši současnou vzdělávací nabídku." # todo: NEW TRANSLATION
 FRA_resource_prospects_idea: "Průzkum surovin" # todo: NEW TRANSLATION
 FRA_resource_prospects_idea_desc: "[FRA.GetNameWithFlag] v současnosti pomáhá při průzkumu surovin v naší zemi, aby potenciálně poskytl ekonomice více možností pro rozvoj." # todo: NEW TRANSLATION
 FRA_SYR_escalation_from_the_damascus_spring_idea: "Escalace z Damašského jara" # todo: NEW TRANSLATION
 FRA_SYR_escalation_from_the_damascus_spring_idea_desc: "[FRA.GetNameWithFlag] nadále šíří propagandu o demokratizaci našeho národa. Toto úsilí nadále podkopává našeho vůdce [SYR.GetLeader], zatímco se snažíme zemi stabilizovat." # todo: NEW TRANSLATION
 FRA_faction_the_paris_accord: "Pařížská dohoda" # todo: NEW TRANSLATION
 FRA_house_of_bonaparte_crowned: "Bonaparte je korunován!" # todo: NEW TRANSLATION
 FRA_a_peaceful_rise_flag: "Mírová zahraniční politika" # todo: NEW TRANSLATION
 FRA_an_aggressive_expansionism_flag: "Agresivní zahraniční politika" # todo: NEW TRANSLATION
