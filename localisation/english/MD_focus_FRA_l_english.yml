 FRA_knds_franco_german_synthesis: "Francouzsko-německá syntéza" # todo: NEW TRANSLATION
 FRA_knds_european_champion: "Evropský průmyslový šampion" # todo: NEW TRANSLATION
 FRA_knds_fg_partnership: "Francouzsko-německé partnerství" # todo: NEW TRANSLATION
 FRA_knds_fg_partnership_desc: "Holding KANT z roku 2015 sjednotil společnosti Krauss-Maffei Wegmann a Nexter pod francouzsko-německým vlastnictvím v poměru 50–50 a spojil dva národní šampiony do jediné průmyslové základny." # todo: NEW TRANSLATION
 FRA_knds_kant_holding: "Integrace holdingu KANT" # todo: NEW TRANSLATION
 FRA_knds_kant_holding_desc: "Přeshraniční konstrukční týmy, harmonizované nákupy a sdílené administrativní služby snižují náklady na souběžný provoz dvou tradičních obranných podniků." # todo: NEW TRANSLATION
 FRA_knds_embt: "Demonstrátor EMBT" # todo: NEW TRANSLATION
 FRA_knds_embt_desc: "Enhanced Main Battle Tank spojuje věž Leclercu s korbou Leoparda 2 a představuje hybridní konstrukční filozofii budoucího Main Ground Combat System." # todo: NEW TRANSLATION
 FRA_knds_joint_rnd: "Společný fond výzkumu a vývoje" # todo: NEW TRANSLATION
 FRA_knds_joint_rnd_desc: "Spojené francouzsko-německé výzkumné rozpočty urychlují paralelní vývoj v oblasti pancéřování, elektroniky a energetických materiálů, kterému by se žádná z firem nemohla věnovat samostatně." # todo: NEW TRANSLATION
 FRA_knds_mgcs_modular: "Modulární architektura MGCS" # todo: NEW TRANSLATION
 FRA_knds_mgcs_modular_desc: "Main Ground Combat System je navržen jako rodina více platforem s vyměnitelnými moduly ochrany, palebné síly a elektronického boje, která ve 40. letech nahradí Leopard 2 a Leclerc." # todo: NEW TRANSLATION
 FRA_knds_mgcs_integration: "Integrace systémů MGCS" # todo: NEW TRANSLATION
 FRA_knds_mgcs_integration_desc: "MGCS integruje společnou digitální páteř, řízení boje odvozené od SCORPIONu a společné slučování senzorových dat napříč francouzsko-německými obrněnými jednotkami." # todo: NEW TRANSLATION
 FRA_knds_turret_leadership: "Vedení vývoje věží (Nexter)" # todo: NEW TRANSLATION
 FRA_knds_turret_leadership_desc: "Konstrukce věží, vývoj automatických nabíječů a výroba kanonů se soustředí pod bývalými týmy Nexteru, které staví na zkušenostech s palebnou silou z éry Leclercu." # todo: NEW TRANSLATION
 FRA_knds_hull_leadership: "Vedení vývoje korby (KMW)" # todo: NEW TRANSLATION
 FRA_knds_hull_leadership_desc: "Vývoj korby, pohonné soustavy a podvozku se soustředí pod bývalými týmy KMW, které využívají zkušeností s konstrukcí Leoparda 2 a Pumy." # todo: NEW TRANSLATION
 FRA_knds_nato_standardisation: "Standardizace dělostřelectva NATO" # todo: NEW TRANSLATION
 FRA_knds_nato_standardisation_desc: "KNDS dodává Agentuře NATO pro podporu a pořizování 155mm munici odpovídající standardům STANAG a staví sloučený podnik do pozice výchozího evropského dodavatele dělostřelectva." # todo: NEW TRANSLATION
 FRA_knds_rch155: "Dálkově ovládaná houfnice RCH-155" # todo: NEW TRANSLATION
 FRA_knds_rch155_desc: "RCH-155 nese automatizovanou 155mm věž na podvozku Boxer a s dvoučlennou posádkou dokáže za pohybu zasahovat cíle na vzdálenost až 54 kilometrů." # todo: NEW TRANSLATION
 FRA_knds_leopard_sustainment: "Podpora flotily Leopard 2" # todo: NEW TRANSLATION
 FRA_knds_leopard_sustainment_desc: "Sjednocená logistika, výroba náhradních dílů a renovace flotily Leopard 2 přecházejí pod sloučený podnik, čímž KNDS získává dlouhodobý příjem z údržby po celé Evropě." # todo: NEW TRANSLATION
 FRA_knds_boxer_puma: "Správa programů Boxer a Puma" # todo: NEW TRANSLATION
 FRA_knds_boxer_puma_desc: "Modulární obrněný transportér Boxer a bojové vozidlo pěchoty Puma zůstávají programy vedenými KMW, nyní však podpořenými společnou průmyslovou vahou KNDS." # todo: NEW TRANSLATION
 FRA_knds_bonus_katana: "Munice BONUS a KATANA" # todo: NEW TRANSLATION
 FRA_knds_bonus_katana_desc: "Senzorová submunice BONUS a naváděné střely KATANA rozšiřují nabídku přesného dělostřelectva KNDS, která je nyní nabízena jako jediná celoevropská produktová řada." # todo: NEW TRANSLATION
 FRA_knds_export_leadership: "Vedoucí postavení ve vývozu" # todo: NEW TRANSLATION
 FRA_knds_export_leadership_desc: "Agresivní exportní politika láká zákazníky v Perském zálivu, jihovýchodní Asii a východní Evropě na balíčky obrněné techniky, dělostřelectva a munice." # todo: NEW TRANSLATION
 FRA_knds_strategic_autonomy: "Strategická autonomie" # todo: NEW TRANSLATION
 FRA_knds_strategic_autonomy_desc: "Doktrína upřednostňující domácí potřeby vyhrazuje nejlepší výrobní kapacity a citlivé technologie francouzsko-německým silám a posiluje evropskou strategickou autonomii namísto prodeje na otevřeném trhu." # todo: NEW TRANSLATION
