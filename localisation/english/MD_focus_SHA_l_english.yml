l_english:
 SHA_cross_the_sand_wall: "Překročit písečnou zeď" # todo: NEW TRANSLATION
 SHA_cross_the_sand_wall_desc: "Marocká zeď v Západní Sahaře je 2 700 km dlouhý val táhnoucí se podél hranice mezi Marokem okupovanou Západní Saharou a Volnou zónou. Zeď byla dokončena v roce 1987 jako součást série opevnění určených k zastavení infiltrace Fronty Polisario. Navzdory tomuto obrovskému obrannému úsilí to nebude stačit k zastavení našeho snažení a budeme pokračovat v našem tažení" # todo: NEW TRANSLATION
 SHA_the_fifth_column: "Pátá kolona" # todo: NEW TRANSLATION
 SHA_the_fifth_column_desc: "Fronta Polisario si udržuje monopol na kontrolu oblasti kolem Tindúfu, ale to nezastavuje infiltraci militantních skupin napojených na al-Káidu. Tyto skupiny procházejí přes Alžírsko do Mali, aby přepravovaly hašiš (drogy), pašované zboží či jiné nelegální materiály." # todo: NEW TRANSLATION
 SHA_the_unthinkable_alliance: "Nemyslitelné spojenectví" # todo: NEW TRANSLATION
 SHA_the_unthinkable_alliance_desc: "Měli bychom následovat příklad Lahbiba Ajúba a navázat vztahy se zahraničními militantními skupinami, abychom posílili naše řady. Tato politika otevřených dveří nám pomůže oslovit globální džihád a vyhlásit svatou válku našim okupantům." # todo: NEW TRANSLATION
 SHA_quash_the_bandits: "Potlačit bandity" # todo: NEW TRANSLATION
 SHA_quash_the_bandits_desc: "Fronta Polisario si udržuje monopol na kontrolu oblasti kolem Tindúfu, ale to nezastavuje infiltraci militantních skupin napojených na al-Káidu. Tyto skupiny procházejí přes Alžírsko do Mali, aby přepravovaly hašiš (drogy), pašované zboží či jiné nelegální materiály." # todo: NEW TRANSLATION
 SHA_establish_cross_border_bases: "Zřídit přeshraniční základny" # todo: NEW TRANSLATION
 SHA_establish_cross_border_bases_desc: "Naše jednotky pravidelně pronikají přes Mauritánii, aby získaly přístup do určitých oblastí Volné zóny. Musíme spolupracovat s mauritánskou vládou, zajistit bezpečný průchod a zřídit vojenské komplexy mimo dosah marockého cílení" # todo: NEW TRANSLATION
 SHA_mauritanian_sponsorship: "Mauritánská podpora" # todo: NEW TRANSLATION
 SHA_mauritanian_sponsorship_desc: "Mauritánie považuje Maroko za expanzionistickou hrozbu a je ochotna s námi vytvořit spojenectví, aby zpochybnila hegemonii Maročanů a podpořila naše tažení za nezávislost." # todo: NEW TRANSLATION
 SHA_invade_mauritania: "Napadnout Mauritánii" # todo: NEW TRANSLATION
 SHA_invade_mauritania_desc: "I po tom, co se Mauritánie vzdala nároků na Západní Saharu, stále podkopává naši věc. Měli bychom vytvořit spojenectví s mauritánskými disidenty a svrhnout feudální stát Mauritánie." # todo: NEW TRANSLATION
 SHA_our_sahara_is_homeland: "Naše Sahara je vlast" # todo: NEW TRANSLATION
 SHA_our_sahara_is_homeland_desc: "Naše Sahara, naše vlast. Naše země jsou konečně svobodné. Tažení, které před více než 30 lety zahájil El-Uálí Mustafá Sajjid, rozkvetlo a my můžeme začít budovat stát a návrat našeho lidu z Tindúfu." # todo: NEW TRANSLATION
 SHA_show_its_hand: "Odhalit své karty" # todo: NEW TRANSLATION
 SHA_show_its_hand_desc: "Fasáda padla a vrchní velení Fronty Polisario ztratilo svůj vliv, zatímco Lahbib Ajúb plánuje převrat s podporou svého spojence Mochtára Belmochtára. " # todo: NEW TRANSLATION
 SHA_incorporate_the_teknad: "Začlenit Tekny" # todo: NEW TRANSLATION
 SHA_incorporate_the_teknad_desc: "Teknové jsou etnický sahrawský národ žijící na našem severu. Historicky šlo o území Španělské Sahary a mělo by být nedílnou součástí našeho státu." # todo: NEW TRANSLATION
 SHA_uphold_the_oil_contracts: "Dodržet ropné smlouvy" # todo: NEW TRANSLATION
 SHA_uphold_the_oil_contracts_desc: "Fronta Polisario podepsala ropné smlouvy v naději, že je jednoho dne, až budou její země svobodné, dodrží. Nyní tento čas nastal a my bychom měli tento slib dodržet." # todo: NEW TRANSLATION
 SHA_the_maghreb_insurgency: "Povstání v Maghrebu " # todo: NEW TRANSLATION
 SHA_the_maghreb_insurgency_desc: "Nastal čas zahájit povstání napříč Maghrebem." # todo: NEW TRANSLATION
 SHA_pledge_allegiance_to_alqaeda: "Přísahat věrnost al-Káidě" # todo: NEW TRANSLATION
 SHA_pledge_allegiance_to_alqaeda_desc: "al-Káida je naším dlouhodobým spojencem, měli bychom hnutí prokázat svou loajalitu." # todo: NEW TRANSLATION
 SHA_align_with_bandits: "Spojit se s bandity" # todo: NEW TRANSLATION
 SHA_reclaim_the_sahara_TT: "§YJakmile Sahrawi ovládne celý stát Západní Sahara, [SHA.GetNameWithFlag], [MOR.GetNameWithFlag] může být přinuceno vyjednávat.§!" # todo: NEW TRANSLATION
 SHA_aligns_the_banditsTT: "§YSpojí nás s bandity§!" # todo: NEW TRANSLATION
 SHA_flip_to_salafist_TT: "Ideologie vlády se posune k §Hsalafistickému džihádismu§!\n\n" # todo: NEW TRANSLATION
 SHA_auto_complete_focus_TT: "§GZaměření dokončeno automaticky:§! Zajistili jsme úplnou kontrolu nad §YZápadní Saharou§!." # todo: NEW TRANSLATION
 SHA_effect_from_evemt_TT: "§GÚčinky události:§!" # todo: NEW TRANSLATION
 SHA_Cleaner_tooltip_for_MAU_investment_TT: "§YMožné cíle investic§!\n§g-§! [SHA.GetFlag] [SHA.GetNameDefCap] a [MAU.GetFlag] [MAU.GetNameDefCap] se nyní navzájem stanou §Ycíli investic§!" # todo: NEW TRANSLATION
 SHA_sahara_offensive: "Saharská ofenzíva" # todo: NEW TRANSLATION
 SHA_sahara_offensive_desc: "Ve jménu El-Uálího Mustafy Sajjida zvítězíme!" # todo: NEW TRANSLATION
 SHA_cross_border_bases: "Přeshraniční základny" # todo: NEW TRANSLATION
 SHA_reclaim_the_sahara: "Znovu získat Saharu" # todo: NEW TRANSLATION
 SHA_reclaim_the_sahara_desc: "„Pod velením [SHA.GetLeader] začíná osvobození Saguia el-Hamra a Río de Oro.“" # todo: NEW TRANSLATION
 SHA_cross_the_sand_wall_TT: "£decision_icon_small Umožňuje rozhodnutí §YZnovu získat Saharu§!" # todo: NEW TRANSLATION
 SHA_cross_the_sand_line_decision_cat: "Překročení písečné linie" # todo: NEW TRANSLATION
 SHA_cross_the_sand_line_decision_cat_desc: "Obrovská 2 700 km dlouhá bariéra z písku a kamení. Tato „písečná zeď“ vymezuje frontovou linii. Musíme do ní proniknout, prolomit ji a získat zpět naši vlast" # todo: NEW TRANSLATION
 SHA_unit_leader_trait_polisario: "Člen Fronty Polisario" # todo: NEW TRANSLATION
 SHA_unit_leader_trait_polisario_desc: "" # todo: NEW TRANSLATION
 SHA_AUTH_SS_fascism: "Al-Murábitún" # todo: NEW TRANSLATION
 Sahrawi.1.t: "Lahbib Ajúb přebíhá" # todo: NEW TRANSLATION
 Sahrawi.1.d: "Lahbib Ajúb se dostal do konfliktu s prezidentem Mohamedem Abdelazizem kvůli neshodám ohledně závislosti Fronty na Alžírsku, nedostatku vojenské eskalace a směřování sahrawské věci. Po svém odchodu Ajúb odcestoval do Mali, aby se připojil k Mochtáru Belmochtárovi, veteránovi sovětsko-afghánské války a veliteli militantních skupin v Sahelu. Ajúb naznačil, že by se mohl vrátit, pokud se postoj administrativy Fronty Polisario k Alžírsku změní." # todo: NEW TRANSLATION
 Sahrawi.1.a: "Prostě odřízněme hnilobu" # todo: NEW TRANSLATION
 Sahrawi.1.b: "Měli bychom se pokusit o příležitost s Mochtárem Belmochtárem" # todo: NEW TRANSLATION
 Sahrawi.2.t: "Rozčarování Al-Sahrawího" # todo: NEW TRANSLATION
 Sahrawi.2.d: "Pocházel z bohaté obchodnické rodiny v Laayoune, mládí strávil v alžírských uprchlických táborech a až do příměří podporovaného OSN sloužil v naší armádě. Selhání slíbeného referenda spolu s osobními zdravotními problémy a depresemi ho však odvedlo od společenského aktivismu. Po kontaktu s náboženskými studenty z Institutu Ibn Abbáse v Nuakšottu se obrátil k přísné formě islámu." # todo: NEW TRANSLATION
 Sahrawi.2.a: "Ach bože" # todo: NEW TRANSLATION
 Sahrawi.3.t: "Mauritánský přeběhlík" # todo: NEW TRANSLATION
 Sahrawi.3.d: "Pocházel z bohaté obchodnické rodiny v Laayoune, mládí strávil v alžírských uprchlických táborech a až do příměří podporovaného OSN sloužil v naší armádě. Selhání slíbeného referenda spolu s osobními zdravotními problémy a depresemi ho však odvedlo od společenského aktivismu. Po kontaktu s náboženskými studenty z Institutu Ibn Abbáse v Nuakšottu se obrátil k přísné formě islámu." # todo: NEW TRANSLATION
 Sahrawi.3.a: "Pryč s Maaouyou Ould Sid'Ahmedem Tayou" # todo: NEW TRANSLATION
 Sahrawi.4.t: "Výzva z Tirisu" # todo: NEW TRANSLATION
 Sahrawi.4.d: "Vedení Fronty Polisario hledí na jih. Do Nuakšottu byla vyslána delegace na vysoké úrovni, aby požádala o diskrétní dodávku ručních zbraní, protitankové munice a paliva. Tvrdí, že silnější Fronta Polisario slouží mauritánským zájmům tím, že působí jako nárazník proti marockému expanzionismu." # todo: NEW TRANSLATION
 Sahrawi.4.a: "Souhlasit" # todo: NEW TRANSLATION
 Sahrawi.4.b: "Odmítnout" # todo: NEW TRANSLATION
 Sahrawi.5.t: "[MAU.GetLeader] přijímá naši výzvu" # todo: NEW TRANSLATION
 Sahrawi.5.d: "Prezident [MAU.GetLeader] formálně odmítl sahrawskou žádost o vojenské vybavení. Mauritánská strana uvedla riziko vážné marocké diplomatické a ekonomické odvety a Mauritánie zůstává oddána mírové smlouvě z roku 1979." # todo: NEW TRANSLATION
 Sahrawi.5.a: "Ach" # todo: NEW TRANSLATION
 Sahrawi.6.t: "[MAU.GetNameWithFlag] odmítá žádost" # todo: NEW TRANSLATION
 Sahrawi.6.d: "[MAU.GetLeader] schválil tajný převod přebytečného vojenského vybavení Frontě Polisario. Jak nové vybavení proudí přes jižní hranici, můžeme je začlenit do naší armády. " # todo: NEW TRANSLATION
 Sahrawi.6.a: "Dobré zprávy" # todo: NEW TRANSLATION
 Sahrawi.7.t: "Máme to tady ukončit?" # todo: NEW TRANSLATION
 Sahrawi.7.d: "Byli jsme rozdrceni a otázka zní: máme pokračovat v boji, nebo odevzdat zbraně a ukončit to? " # todo: NEW TRANSLATION
 Sahrawi.7.a: "Poslat nabídku" # todo: NEW TRANSLATION
 Sahrawi.7.b: "Ne, musíme pokračovat v boji" # todo: NEW TRANSLATION
 Sahrawi.8.t: "[MOR.GetNameWithFlag] navrhuje mírovou nabídku" # todo: NEW TRANSLATION
 Sahrawi.8.d: "Navzdory všem předpokladům dosáhla Sahrawská lidová osvobozenecká armáda nemožného a osvobodila naše historická sídla. Zatímco marocká armáda v nepořádku ustupuje přes hranici, Rabat zaslal diplomatickou nabídku. Nabízí formální ukončení nepřátelství a uznání naší svrchovanosti nad Západní Saharou výměnou za okamžité příměří. " # todo: NEW TRANSLATION
 Sahrawi.8.a: "Dosáhli jsme toho, co jsme potřebovali" # todo: NEW TRANSLATION
 Sahrawi.8.b: "Ne, potáhneme až na Rabat" # todo: NEW TRANSLATION
 Sahrawi_news.1.t: "Sahrawská válka za osvobození končí vítězstvím" # todo: NEW TRANSLATION
 Sahrawi_news.1.d: "V obratu po desetiletích okupace Sahrawská lidová osvobozenecká armáda (SPLA) oficiálně vyhlásila úplné vítězství nad Marockým královstvím. Po zhroucení marockých obranných linií „valu“ a stažení Královských ozbrojených sil na hranice před rokem 1975 převzala Sahrawská arabská demokratická republika plnou kontrolu nad svým státním územím. Od Laayoune po Dakhlu vlaje sahrawská vlajka bez odporu." # todo: NEW TRANSLATION
 Sahrawi_news.1.a: "Další válka končí na Sahaře.. " # todo: NEW TRANSLATION
 Sahrawi_news.2.t: "Černé vlajky nad Saharou" # todo: NEW TRANSLATION
 Sahrawi_news.2.d: "Militantní skupina Al-Murábitún zahájila koordinovaný ranní útok na vedení Fronty Polisario. Jako důvod uvedla selhání sekulárního socialismu. V blízkosti tábora Polisario byla hlášena silná střelba a osud předchozího vedení zůstává neznámý. " # todo: NEW TRANSLATION
 Sahrawi_news.2.a: "Nad Saharou se vznáší stín" # todo: NEW TRANSLATION
