 SOV_mvd_category_desc: "\n\n\n\n\n\n£SOV_desctext_mvd \n\n\n\n\n\n\n\n\nBezpečnost země nezávisí pouze na ozbrojených silách. Spočívá také na bedrech státních orgánů, jako je ministerstvo vnitra, spolu s mnoha zvláštními službami zděděnými po SSSR. Tento rozsáhlý stroj agentur a úřadů bude při správném řízení chránit zemi před jakoukoli hrozbou.\nSeparatismus v [SOV.GetFlag]§Yruských§! regionech začne postupně §Rnarůstat§!, jakmile úroveň §Ystability§! klesne §Rpod 32 %§!." # todo: CHANGED
