 SOV_membership_east: "Členství Východu" # todo: NEW TRANSLATION
 SOV_membership_east_desc: "Zahrnutí východních zemí posílí naši alianci jejich zdroji, ekonomikami a vojenskými schopnostmi, což zvýší naši obranu a ochranu demokracie." # todo: NEW TRANSLATION
 SOV_membership_pribalt: "Členství Pobaltí" # todo: NEW TRANSLATION
 SOV_membership_pribalt_desc: "Zahrnutí pobaltských států nabízí strategický přístup k Baltskému moři a zvyšuje průmyslovou a technologickou sílu. Bez nich může aliance ztratit klíčové území a spojence." # todo: NEW TRANSLATION
 SOV_membership_caucasus: "Členství Kavkazu" # todo: NEW TRANSLATION
 SOV_membership_caucasus_desc: "Kavkaz přináší strategické zdroje a geopolitický význam. Jejich vyloučení by mohlo oslabit náš regionální vliv a demokratickou stabilitu." # todo: NEW TRANSLATION
 SOV_membership_ces: "Členství Střední Asie" # todo: NEW TRANSLATION
 SOV_membership_ces_desc: "Zdroje a poloha Střední Asie jsou klíčové. Jejich zahrnutí rozšíří trhy, posílí bezpečnost a zvýší náš regionální vliv." # todo: NEW TRANSLATION
 SOV_free_economic_zone: "Volná ekonomická zóna" # todo: NEW TRANSLATION
 SOV_free_economic_zone_desc: "Měli bychom přeměnit Kaliningrad na volnou ekonomickou zónu, sloužící jako most pro spolupráci mezi Ruskem a EU." # todo: NEW TRANSLATION
 SOV_transfer_state_shares_to_pension_funds: "Převod státních podílů do penzijních fondů" # todo: NEW TRANSLATION
 SOV_transfer_state_shares_to_pension_funds_desc: "Pro zlepšení životní úrovně občanů a jejich délky života budou státní podíly převedeny do ruského penzijního fondu s omezeními hlasovacích práv." # todo: NEW TRANSLATION
 SOV_kasyanov_political: "Velké demokratické Rusko" # todo: NEW TRANSLATION
