 SOV_begin_funding: "Nový dočasný domov pro Buran" # todo: NEW TRANSLATION
 SOV_begin_funding_desc: "Přemístit raketoplán ze stárnoucího hangáru a shromáždit tým zkušených inženýrů." # todo: CHANGED
 SOV_dissassemble_the_shuttle: "Zahájit první fázi oprav" # todo: NEW TRANSLATION
