 SOV_storm_z_central_russia: "Vězňové ze Storm Z" # todo: NEW TRANSLATION
 SOV_storm_z_central_russia_desc: "Mnozí vězni přežili boje, do nichž jsme je poslali. Nyní, oficiálně propuštění, se mnozí rozhodli vrátit k tomu, co znají nejlépe: loupežím a násilí." # todo: CHANGED
 SOV_start_volunteer_assault_coprs: "Obnovit dobrovolný útočný sbor" # todo: NEW TRANSLATION
 SOV_economic_russian: "Ruská ekonomika" # todo: NEW TRANSLATION
 SOV_economic_russian_desc: "Naše ekonomika zůstává oslabena krizemi 90. let, rozpadem SSSR a dalšími přetrvávajícími následky. Je čas podniknout rozhodné kroky k obnově a posílení hospodářských základů našeho národa." # todo: CHANGED
 SOV_economic_reform_gazprom: "Reforma Gazpromu" # todo: NEW TRANSLATION
 SOV_economic_reform_gazprom_desc: "Gazprom v 90. letech hodně utrpěl. Reforma této klíčové společnosti je zásadní pro zachování její role jako hnací síly našeho ekonomického růstu." # todo: NEW TRANSLATION
 SOV_economic_buy_sibur: "Získat aktiva SIBUR" # todo: NEW TRANSLATION
 SOV_economic_buy_sibur_desc: "Získáváme aktiva petrochemické společnosti SIBUR, abychom rozšířili naše průmyslové schopnosti a zajistili energetický sektor." # todo: NEW TRANSLATION
 SOV_economic_zapolyarnoe: "Ložisko plynu Zapolyarnoye" # todo: NEW TRANSLATION
 SOV_economic_zapolyarnoe_desc: "Objeveno v 60. letech, rozsáhlé zásoby plynu, ropy a kondenzátu v Zapolyarnom jsou nyní připraveny k těžbě a zvýšení naší energetické produkce." # todo: NEW TRANSLATION
 SOV_economic_gazprom_tes: "Rozvoj geotermální energie" # todo: CHANGED
 SOV_economic_gazprom_tes_desc: "Mutnovské pole na Kamčatce má největší geotermální potenciál v zemi a Kurilské ostrovy, Dagestán i Kubáň leží na využitelných ložiscích. Dokončení Mutnovské elektrárny a rozvoj menších polí zásobí odlehlé regiony, kam se celostátní síť ekonomicky nedokáže dostat." # todo: CHANGED
 SOV_economic_nat_gas_sakhalin: "Těžba plynu na Sachalinu" # todo: NEW TRANSLATION
 SOV_economic_nat_gas_sakhalin_desc: "Investice do plynného bohatství Sachalinu zajistí značné zisky a posílí naše energetické exporty." # todo: NEW TRANSLATION
 SOV_economic_gazprom_stream: "Výstavba potrubí" # todo: NEW TRANSLATION
 SOV_economic_gazprom_stream_desc: "Jsme připraveni vybudovat nová plynová potrubí, která obejdou některé země, a zajistit tak stabilní a spolehlivé exporty plynu." # todo: NEW TRANSLATION
 SOV_economic_gazprom_norstream: "Nord Stream" # todo: NEW TRANSLATION
 SOV_economic_gazprom_norstream_desc: "Po uvedení Nord Streamu do provozu a proudění německého plynu pod Baltem ztratily tranzitní státy vliv nad naším vývozem na západ. Restrukturalizace exportních smluv Gazpromu kolem nové trasy promění tuto pozici v příjmy." # todo: CHANGED
 SOV_economic_gazprom_bluestream: "Blue Stream" # todo: NEW TRANSLATION
 SOV_economic_gazprom_bluestream_desc: "Blue Stream nyní přepravuje plyn po dně Černého moře do Samsunu, aniž by se dotkl třetí země. Rozšíření kapacity a nové vyjednání podmínek odběru s Tureckem umožní surovinovému sektoru zaúčtovat plnou hodnotu této trasy." # todo: CHANGED
 SOV_economic_gazprom_turkeystream: "Turkish Stream" # todo: NEW TRANSLATION
 SOV_economic_gazprom_turkeystream_desc: "TurkStream činí z Turecka distribuční uzel pro jižní Evropu a spojuje energetickou bezpečnost Ankary s naší vlastní. Partner závislý na našem plynu je mnohem méně vnímavý k tlaku vyvíjenému z Washingtonu či Bruselu." # todo: CHANGED
 SOV_economic_gazprom_nordstream2: "Nord Stream 2" # todo: NEW TRANSLATION
 SOV_economic_gazprom_nordstream2_desc: "Po dokončení druhé baltské trasy již naše kapacita vývozu na západ nezávisí na žádném tranzitním státě. Plyn se stal nástrojem, jehož prostřednictvím vyjednáváme své postavení v Evropě." # todo: CHANGED
 SOV_join_wto: "Vstoupit do WTO" # todo: NEW TRANSLATION
 SOV_join_wto_desc: "Vstup do Světové obchodní organizace nás více integruje do světové ekonomiky a přinese prosperitu našim lidem." # todo: NEW TRANSLATION
 SOV_outer_space_initiative: "Rozvoj Roskosmosu" # todo: NEW TRANSLATION
 SOV_outer_space_initiative_desc: "Ruské ambice ve vesmíru vyžadují finančně stabilní a spolehlivý Roskosmos, který povede naše průzkumné a technologické úsilí." # todo: CHANGED
 SOV_outer_space_vostochniy: "Kosmodrom Vostočnyj" # todo: NEW TRANSLATION
 SOV_outer_space_vostochniy_desc: "Abychom snížili závislost na Bajkonuru, zahájíme výstavbu kosmodromu Vostočnyj pro budoucí starty." # todo: NEW TRANSLATION
 SOV_outer_space_asteroids_mining: "Zdroje z asteroidů" # todo: NEW TRANSLATION
 SOV_outer_space_asteroids_mining_desc: "Naše vesmírná technologie nyní umožňuje těžbu cenných zdrojů z asteroidů, čehož hodláme využít." # todo: NEW TRANSLATION
 SOV_outer_space_space_combat_wombat: "Připravit se na vesmírné závody" # todo: CHANGED
 SOV_outer_space_space_combat_wombat_desc: "Závod ve vesmíru po přestávce opět začíná a musíme zintenzivnit úsilí o znovuzískání vedení." # todo: NEW TRANSLATION
 SOV_outer_space_sateelites: "Investice do satelitů" # todo: NEW TRANSLATION
 SOV_outer_space_sateelites_desc: "Satelity jsou kritické oči ve vesmíru, důležité nejen pro závod, ale i pro případné budoucí konflikty." # todo: NEW TRANSLATION
 SOV_outer_space_weaponized_space: " Militarizace vesmíru" # todo: NEW TRANSLATION
 SOV_outer_space_weaponized_space_desc: "Vesmír se nevyhnutelně stane militarizovanou doménou, proto je důležité, abychom jednal první a zajistili své zájmy." # todo: NEW TRANSLATION
 SOV_outer_space_moon_base: "Měsíční základna" # todo: NEW TRANSLATION
 SOV_outer_space_moon_base_desc: "Zřízení lunární základny bude významným milníkem na naší cestě ke kolonizaci sluneční soustavy." # todo: NEW TRANSLATION
 SOV_outer_space_marines: "Ruské vesmírné mariňáky" # todo: NEW TRANSLATION
 SOV_outer_space_marines_desc: "Naše nová složka vesmírných mariňáků nebude mít slitování a porazí každého nepřítele ve vesmírném boji." # todo: NEW TRANSLATION
 SOV_found_rosatom: "Založit Rosatom" # todo: NEW TRANSLATION
 SOV_found_rosatom_desc: "Rosatom je státní korporace pro jadernou energetiku, která dohlíží na ruský jaderně-průmyslový komplex." # todo: CHANGED
 SOV_economic_floating_nuclear: "Plovoucí jaderné elektrárny" # todo: NEW TRANSLATION
 SOV_economic_floating_nuclear_desc: "Rosatom navrhuje samostatné plovoucí jaderné elektrárny k hromadné výrobě a nasazení poblíž míst, kde je potřeba elektřina." # todo: NEW TRANSLATION
 SOV_economic_securing_rosatom: "Průmyslová bezpečnost" # todo: NEW TRANSLATION
 SOV_economic_securing_rosatom_desc: "Posílíme bezpečnost jaderných zařízení, aby se zabránilo katastrofickým incidentům." # todo: NEW TRANSLATION
 SOV_rosatom_fuel_division: "Oddělení paliv Rosatomu" # todo: NEW TRANSLATION
 SOV_rosatom_fuel_division_desc: "Veškerá jaderná aktiva budou sjednocena do palivové divize pod vedením Rosatomu, aby se zefektivnil provoz." # todo: CHANGED
 SOV_rosatom_fuel_division2: "Sibiřský chemický kombinát" # todo: NEW TRANSLATION
 SOV_rosatom_fuel_division2_desc: "Založen v roce 1953 v Tomsk-7 (dnes Seversk), tento komplex zpracovává komponenty jaderných zbraní a funguje jako dceřiná společnost TVEL." # todo: NEW TRANSLATION
 SOV_rosatom_predmet_zoloto: "ARMZ Uranové holding" # todo: NEW TRANSLATION
 SOV_rosatom_predmet_zoloto_desc: "Atomredmetzoloto, těžební divize Rosatomu, se umisťuje na šestém místě v produkci uranu a druhém v zásobách uranu in-situ." # todo: NEW TRANSLATION
 SOV_economic_anti_terrorist_rosatom: "Proti-teroristická ochrana" # todo: NEW TRANSLATION
 SOV_economic_anti_terrorist_rosatom_desc: "Budeme spolupracovat s Národní gardou na plné ochraně našich jaderných zařízení před teroristickými hrozbami." # todo: NEW TRANSLATION
 SOV_economic_rao_ues: "Likvidace RAO UES" # todo: NEW TRANSLATION
 SOV_economic_rao_ues_desc: "Reforma energetického sektoru vyžaduje rozpuštění současného tržního monopolisty RAO UES." # todo: NEW TRANSLATION
 SOV_economic_rus_hydro: "Vytvoření RusHydro" # todo: NEW TRANSLATION
 SOV_economic_rus_hydro_desc: "Založíme RusHydro, abychom efektivně ovládali a spravovali energetické výrobní zařízení." # todo: NEW TRANSLATION
 SOV_economic_rus_hydro_expanded: "Rozšíření RusHydro" # todo: NEW TRANSLATION
 SOV_economic_rus_hydro_expanded_desc: "Investice posílily RusHydro, umožňující mu stavět novou energetickou infrastrukturu po celé zemi." # todo: NEW TRANSLATION
 SOV_economic_interrao: "Inter RAO" # todo: NEW TRANSLATION
 SOV_economic_interrao_desc: "Založen v roce 1997, Inter RAO se rozšíří získáváním domácích elektrických sítí v rámci naší energetické reformy." # todo: NEW TRANSLATION
 SOV_economic_interrao_expand: "Rozšíření Inter RAO" # todo: NEW TRANSLATION
 SOV_economic_interrao_expand_desc: "S podporou státu je Inter RAO připraven budovat nová energetická zařízení po celé zemi." # todo: NEW TRANSLATION
 SOV_seize_yukos_oil: "Zabavit Yukos Oil" # todo: NEW TRANSLATION
 SOV_seize_yukos_oil_desc: "S odstraněním Chodorkovského můžeme zabavit Yukos a přerozdělit jeho aktiva loajálním subjektům." # todo: NEW TRANSLATION
 SOV_khodorkovsky_trial: "Proces s Chodorkovským" # todo: NEW TRANSLATION
 SOV_khodorkovsky_trial_desc: "Po shromáždění dostatečných důkazů přistoupíme k procesu s Chodorkovským, ačkoli výsledek je již jasný." # todo: CHANGED
 SOV_khodorkovsky_case: "Případ Chodorkovského" # todo: NEW TRANSLATION
 SOV_khodorkovsky_case_desc: "Čelí obviněním z korupce a daňových úniků; je pravděpodobné, že ztratí své podíly v Yukos Oil." # todo: NEW TRANSLATION
 SOV_remove_guzinsky: "Odstranit Guzinského" # todo: NEW TRANSLATION
 SOV_remove_guzinsky_desc: "Mediální magnát Vladimir Guzinsky odmítá spolupracovat s vládou a oligarchy a musí být řešen." # todo: NEW TRANSLATION
 SOV_economic_trikolov_tv: "Tricolor TV" # todo: NEW TRANSLATION
 SOV_economic_trikolov_tv_desc: "Ačkoli jde o soukromou společnost, zachováme tajnou kontrolu nad vysílací sítí Tricolor TV." # todo: CHANGED
 SOV_economic_gazprom_media: "Gazprom Media" # todo: NEW TRANSLATION
 SOV_economic_gazprom_media_desc: "Gazprom plánuje vytvořit vlastní mediální holding; musíme tento vývoj řídit a ovlivnit." # todo: NEW TRANSLATION
 SOV_economic_tv6_broadcasting: "TV-6, nezávislí vysílatelé" # todo: NEW TRANSLATION
 SOV_economic_tv6_broadcasting_desc: "Po propuštění Gusinského zůstává redakce NTV nedotčena a přesouvá se na TV-6. Kanál udělíme do licence, místo abychom jej zabavili, a druhému celostátnímu vysílateli dovolíme, aby se zodpovídal svým akcionářům namísto Kremlu." # todo: NEW TRANSLATION
 SOV_economic_independent_press: "Charta nezávislého tisku" # todo: NEW TRANSLATION
 SOV_economic_independent_press_desc: "Charta zavazující stát k vydávání licencí, které nemůže svévolně odebrat. Redakční nezávislost se stává právní zárukou namísto ústupku, ovšem za cenu vlivu na veřejné mínění, který by nám státní podíl poskytl." # todo: NEW TRANSLATION
 SOV_delay_sibirneft_merger: "Zdržet fúzi Sibneft" # todo: NEW TRANSLATION
 SOV_delay_sibirneft_merger_desc: "Navrhovaná fúze Yukos a Sibneft byla zablokována pomocí vykonstruovaných obvinění proti Chodorkovskému, aby se zabránilo jeho kontrole." # todo: NEW TRANSLATION
 SOV_economic_gazprom_neft: "Gazprom Neft" # todo: NEW TRANSLATION
 SOV_economic_gazprom_neft_desc: "Po likvidaci Sibněfti získal Gazprom kontrolní podíl a plnou kontrolu nad jejími aktivy." # todo: CHANGED
 SOV_economic_gas_with_sibur: "Projekt ropy a plynu se SIBUR" # todo: NEW TRANSLATION
 SOV_economic_gas_with_sibur_desc: "Gazprom vyvíjí společný ropný a plynárenský projekt se SIBUR, aby zvýšil regionální produkci." # todo: NEW TRANSLATION
 SOV_economic_arctic_gas: "Arktická ložiska ropy a plynu" # todo: NEW TRANSLATION
 SOV_economic_arctic_gas_desc: "Gazprom plánuje průzkum a těžbu rozsáhlých zásob v arktických polích." # todo: NEW TRANSLATION
 SOV_economic_oil_nenets: "Projekt ropy a plynu v [NEE.GetName]" # todo: NEW TRANSLATION
 SOV_economic_oil_nenets_desc: "Gazprom pokračuje ve vývoji ropných a plynárenských projektů v této strategické oblasti." # todo: NEW TRANSLATION
 SOV_economic_oil_yamao: "Projekt ropy a plynu v [YAM.GetName]" # todo: NEW TRANSLATION
 SOV_economic_oil_yamao_desc: "Další rozvoj ropných a plynárenských zdrojů v této oblasti zůstává prioritou Gazpromu." # todo: NEW TRANSLATION
 SOV_economic_oil_khmao: "Projekt ropy a plynu v [KHM.GetName]" # todo: NEW TRANSLATION
 SOV_economic_oil_khmao_desc: "Gazprom má v úmyslu rozšířit těžbu ropy a plynu v tomto regionu." # todo: NEW TRANSLATION
 SOV_economic_slavneft: "Odkoupit aktiva Slavněfti" # todo: CHANGED
 SOV_economic_slavneft_desc: "Rosneft a Gazprom plánují rozdělit a získat aktiva Slavneft." # todo: NEW TRANSLATION
 SOV_economic_reform_rosneft: "Reforma Rosneftu" # todo: NEW TRANSLATION
 SOV_economic_reform_rosneft_desc: "Rosneft usiluje o restrukturalizaci a rozšíření činností, aby posílil svou pozici na trhu." # todo: NEW TRANSLATION
 SOV_economic_use_yukos: "Využít aktiva YUKOS" # todo: NEW TRANSLATION
 SOV_economic_use_yukos_desc: "Rosněfť využije aktiva získaná likvidací Jukosu k dalšímu rozvoji společnosti." # todo: CHANGED
 SOV_economic_buy_itera: "Akvizice ITERA" # todo: NEW TRANSLATION
 SOV_economic_buy_itera_desc: "Rosneft plánuje začlenit ITERA do svého portfolia jako nové strategické aktivum." # todo: NEW TRANSLATION
 SOV_economic_buy_severnaya_neft: "Akvizice SevernayaNeft" # todo: NEW TRANSLATION
 SOV_economic_buy_severnaya_neft_desc: "Akvizice SevernajaNeft rozšíří zdrojovou základnu Rosněfti." # todo: CHANGED
 SOV_economic_buy_thk_bp: "Akvizice TNK" # todo: NEW TRANSLATION
 SOV_economic_buy_thk_bp_desc: "Rosneft hodlá získat TNK k posílení své ropné produkce." # todo: NEW TRANSLATION
 SOV_economic_efko: "Efko" # todo: NEW TRANSLATION
 SOV_economic_efko_desc: "Efko je přední ruský výrobce tuků, margarínu, majonézy, rostlinných olejů a mléčných výrobků a patří mezi největší agro-průmyslové společnosti." # todo: NEW TRANSLATION
 SOV_economic_miratorg: "Miratorg" # todo: NEW TRANSLATION
 SOV_economic_miratorg_desc: "Miratorg je největší ruský vertikálně integrovaný zemědělský holding vyrábějící vepřové a masné produkty v celém dodavatelském řetězci." # todo: CHANGED
 SOV_economic_rusagro: "RusAgro" # todo: NEW TRANSLATION
 SOV_economic_rusagro_desc: "RusAgro, jedna z největších ruských zemědělských firem, se specializuje na výrobu vepřového masa, tuků a cukru; byla založena v roce 1995." # todo: CHANGED
 SOV_economic_efko_expanded: "Rozšíření Efko" # todo: NEW TRANSLATION
 SOV_economic_efko_expanded_desc: "Efko plánuje pokračovat v růstu s podporou státních subvencí pro urychlení rozvoje." # todo: NEW TRANSLATION
 SOV_economic_miratorg_expanded: "Rozšíření Miratorg" # todo: NEW TRANSLATION
 SOV_economic_miratorg_expanded_desc: "Miratorg se hodlá rozšířit v rámci vládní investiční podpory." # todo: NEW TRANSLATION
 SOV_economic_rusagro_expanded: "Rozšíření RusAgro" # todo: NEW TRANSLATION
 SOV_economic_rusagro_expanded_desc: "RusAgro usiluje o další rozvoj za podpory státního financování." # todo: NEW TRANSLATION
 SOV_economic_phos_agro: "PhosAgro" # todo: NEW TRANSLATION
 SOV_economic_phos_agro_desc: "PhosAgro se sídlem v Moskvě je největším evropským výrobcem fosfátových hnojiv a souvisejících chemikálií." # todo: CHANGED
 SOV_economic_belarus_integrate: "Integrace běloruského průmyslu" # todo: NEW TRANSLATION
 SOV_economic_belarus_integrate_desc: "Zintegrujeme běloruské továrny do ruské ekonomiky a převedeme tyto průmysly pod naši kontrolu." # todo: NEW TRANSLATION
 SOV_economic_mzkt_annex: "Integrace MZKT" # todo: NEW TRANSLATION
 SOV_economic_mzkt_annex_desc: "MZKT, běloruský výrobce těžkých a specializovaných vozidel, bude začleněn pod naši jurisdikci." # todo: NEW TRANSLATION
 SOV_economic_140_annex: "Integrace 140. opravny" # todo: NEW TRANSLATION
 SOV_economic_140_annex_desc: "140. opravna se specializuje na modernizaci obrněných vozidel a bude anektována k rozšíření naší vojensko-průmyslové kapacity." # todo: NEW TRANSLATION
 SOV_economic_peleng_annex: "Integrace Peleng" # todo: NEW TRANSLATION
 SOV_economic_peleng_annex_desc: "Peleng, přední běloruská firma v optoelektronice pro vojenské i civilní použití, se připojí k našemu průmyslovému systému." # todo: NEW TRANSLATION
 SOV_economic_grodno_annex: "Integrace Grodno Azot" # todo: NEW TRANSLATION
 SOV_economic_grodno_annex_desc: "Grodno Azot vyrábí hnojiva důležitá pro zemědělství; integrace zvýší náš tržní dosah." # todo: NEW TRANSLATION
 SOV_economic_evraz: "EVRAZ" # todo: NEW TRANSLATION
 SOV_economic_evraz_desc: "EVRAZ je nadnárodní ocelářská a těžební společnost, částečně vlastněná ruskými oligarchy, působící hlavně v Rusku, USA, Kanadě a Kazachstánu." # todo: NEW TRANSLATION
 SOV_economic_mechel: "Mechel" # todo: NEW TRANSLATION
 SOV_economic_mechel_desc: "Mechel je významný ruský výrobce uhlí, železné rudy a ocelových výrobků se sídlem v Moskvě s domácím i mezinárodním prodejem." # todo: NEW TRANSLATION
 SOV_economic_severstal: "Severstal" # todo: NEW TRANSLATION
 SOV_economic_severstal_desc: "Severstal je největší ruský výrobce oceli se sídlem v Čerepovci, ovládaný miliardářem Alexejem Mordašovem." # todo: CHANGED
 SOV_economic_evraz_asset: "Rozšíření EVRAZ" # todo: NEW TRANSLATION
 SOV_economic_evraz_asset_desc: "EVRAZ se má dále rozšiřovat za podpory státních dotací." # todo: NEW TRANSLATION
 SOV_mp_end_rentier_state: "Ukončit rentiérský stát" # todo: NEW TRANSLATION
 SOV_mp_end_rentier_state_desc: "Přerušit naši závislost na vývozu surovin a diverzifikovat ekonomiku, čímž odstraníme rentiérský stát. Dostupné pouze při aktivovaných rozšířeních pro více hráčů." # todo: NEW TRANSLATION
 SOV_economic_yakut_ugol: "Akvizice YakutUgol" # todo: NEW TRANSLATION
 SOV_economic_yakut_ugol_desc: "Mečel plánuje získat aktiva Jakutugolu, aby rozšířil svou kapacitu těžby uhlí." # todo: CHANGED
 SOV_economic_severstal_expanded: "Rozšíření Severstalu" # todo: NEW TRANSLATION
 SOV_economic_severstal_expanded_desc: "Severstal se snaží růst za podpory vlády pro nové projekty." # todo: NEW TRANSLATION
 SOV_economic_nornickel: "Nornickel" # todo: NEW TRANSLATION
 SOV_economic_nornickel_desc: "Nornickel je přední ruská těžební a hutní společnost specializující se na nikl a palladium, operující především v okolí Norilsku." # todo: NEW TRANSLATION
 SOV_economic_buy_polus: "Koupit Polyus" # todo: NEW TRANSLATION
 SOV_economic_buy_polus_desc: "Polyus je největším ruským producentem zlata a jednou z předních světových těžařských společností podle objemu produkce." # todo: CHANGED
 SOV_economic_alrosa: "Alrosa" # todo: NEW TRANSLATION
 SOV_economic_alrosa_desc: "Alrosa vede globální produkci diamantů podle objemu, představuje 95 % ruské produkce diamantů a 27 % světové." # todo: NEW TRANSLATION
 SOV_economic_nakynskoe: "Nyurbinský důlně‑zpracovatelský závod" # todo: NEW TRANSLATION
 SOV_economic_nakynskoe_desc: "Alrosa otevřela Nyurbinský závod, čímž zvýšila svou těžební a zpracovatelskou kapacitu." # todo: NEW TRANSLATION
 SOV_economic_rusal: "Rusal" # todo: NEW TRANSLATION
 SOV_economic_rusal_desc: "Rusal je druhým největším producentem hliníku na světě a zodpovídá za téměř 9 % celosvětové produkce." # todo: CHANGED
 SOV_economic_buy_sual: "Získat aktiva SUAL" # todo: NEW TRANSLATION
 SOV_economic_buy_sual_desc: "Dokončení integrace SUAL završí úplné vytvoření společnosti pod naší kontrolou." # todo: CHANGED
 SOV_economic_aeroflot: "Aeroflot" # todo: NEW TRANSLATION
 SOV_economic_aeroflot_desc: "Aeroflot je vlajkovou leteckou společností Ruska, která se vyvinula ze sovětského státního podniku a nyní působí mezinárodně." # todo: CHANGED
 SOV_economic_poebda: "Pobeda" # todo: NEW TRANSLATION
 SOV_economic_poebda_desc: "Pobeda je ruská nízkonákladová letecká společnost a dceřiná firma Aeroflotu se základnou na moskevském letišti Vnukovo." # todo: CHANGED
 SOV_economic_new_airports: "Výstavba nových letišť" # todo: NEW TRANSLATION
 SOV_economic_new_airports_desc: "Aeroflot plánuje investovat do výstavby nových letišť v celé zemi, aby zlepšil dostupnost letů." # todo: NEW TRANSLATION
 SOV_economic_rjd: "RZD" # todo: NEW TRANSLATION
 SOV_economic_rjd_desc: "Ruské dráhy jsou státní, vertikálně integrovaná společnost, která vlastní veřejnou infrastrukturu a je největším dopravcem na ruské železniční síti. Byla založena na základech bývalého ministerstva železnic. Společnost hraje klíčovou roli v propojování rozlehlých regionů země a podpoře ekonomického rozvoje." # todo: NEW TRANSLATION
 SOV_economic_rjd_sochi: "Infrastruktura v Soči" # todo: NEW TRANSLATION
 SOV_economic_rjd_sochi_desc: "Ruské železnice plánují výrazně investovat do infrastruktury Soči, aby podpořily cestovní ruch a zlepšily dopravní možnosti regionu. Cílem tohoto rozvoje je učinit Soči dostupnější a přitažlivější destinací pro domácí i zahraniční návštěvníky." # todo: CHANGED
 SOV_economic_rjd_more_trains: "Nákup vlaků" # todo: NEW TRANSLATION
 SOV_economic_rjd_more_trains_desc: "Ruské dráhy rozšiřují svůj vozový park naléhavým objednáním velkého počtu nových vozů. Tento krok modernizuje síť a zlepší přepravní kapacitu po celé zemi." # todo: NEW TRANSLATION
 SOV_economic_rjd_moscow_circle: "Moskevský okružní železniční okruh" # todo: NEW TRANSLATION
 SOV_economic_rjd_moscow_circle_desc: "Moskevský okružní železniční okruh (MCC), známý jako linka 14 a označen jahodově červenou a bílou barvou, je 54kilometrová městská trať obkružující historickou Moskvu. Poskytuje důležitou obchvatovou trasu, zmírňuje přetížení a spojuje klíčové oblasti kolem města." # todo: NEW TRANSLATION
 SOV_economic_rjd_transsib: "Transsibiřská magistrála" # todo: NEW TRANSLATION
 SOV_economic_rjd_transsib_desc: "Transsibiřská magistrála, historicky nazývaná Velká sibiřská trasa a často zkráceně Transsib, je rozsáhlá železniční síť spojující evropské Rusko s ruským Dálným východem. Je zásadní pro nákladní i osobní dopravu napříč kontinentem." # todo: NEW TRANSLATION
 SOV_economic_rjd_baikal_amure: "Bajkalsko‑amurská magistrála" # todo: NEW TRANSLATION
 SOV_economic_rjd_baikal_amure_desc: "Bajkalsko‑amurská magistrála (BAM) je širokorozchodná železnice dlouhá 4 324 kilometrů napříč Východní Sibiří a ruským Dálným východem. Leží přibližně 610 až 770 kilometrů severně od a paralelně k Transsibiřské magistrále, poskytuje důležitý alternativní dopravní koridor." # todo: NEW TRANSLATION
 SOV_economic_rjd_north_latitudinal: "Severní šířková železnice" # todo: NEW TRANSLATION
 SOV_economic_rjd_north_latitudinal_desc: "Severní šířková železnice, momentálně ve výstavbě v Jamalo‑Neněckém autonomním okruhu, bude mít délku 707 kilometrů. Propojí západní a východní části regionu a spojí Severní železnici na východě se Sverdlovskou oblastí, výrazně zlepšujíc regionální konektivitu." # todo: NEW TRANSLATION
 SOV_economic_rjd_sakhalin: "Dopravní infrastruktura na Sachalinu" # todo: NEW TRANSLATION
 SOV_economic_rjd_sakhalin_desc: "Dopravní infrastruktura Sachalinu vyžaduje modernizaci, aby podpořila hospodářský růst ostrova. Ruské železnice plánují projekty rozšíření, které modernizují a zlepší propojení na Sachalinu." # todo: CHANGED
 SOV_economic_rjd_mcd: "Moskevské centrální diametery" # todo: NEW TRANSLATION
 SOV_economic_rjd_mcd_desc: "Moskevské centrální diametery (MCD) jsou příměstské železniční linky provozované na existujících předměstských tratích v Moskvě a okolní Moskevské oblasti. Tyto linky zlepšují efektivitu dopravy propojením okrajových oblastí přímo s centrem města." # todo: NEW TRANSLATION
 SOV_economic_rubber: "Domácí průmysl pneumatik" # todo: NEW TRANSLATION
 SOV_economic_rubber_desc: "Náš domácí průmysl pneumatik zůstává nedostatečně rozvinutý a nutně potřebuje více investic. Alokací několika rozpočtových tranží chceme modernizovat výrobu a posílit tento důležitý sektor naší ekonomiky." # todo: NEW TRANSLATION
 SOV_economic_rubber_foreign: "Zahraniční investoři" # todo: NEW TRANSLATION
 SOV_economic_rubber_foreign_desc: "Plánujeme přilákat přední výrobce pneumatik a značky ze zahraničí, aby zřídily výrobní závody v Rusku. To přinese pokročilé technologie a podpoří rozvoj místního průmyslu." # todo: NEW TRANSLATION
 SOV_economic_auto: "Automobilový průmysl" # todo: NEW TRANSLATION
 SOV_economic_auto_desc: "Poptávka po automobilech v posledním desetiletí výrazně vzrostla, proto je důležité rozhodnout o budoucím směřování našeho automobilového průmyslu. Investice a strategická partnerství pomohou uspokojit rostoucí potřebu." # todo: NEW TRANSLATION
 SOV_economic_invite_investors: "Pozvat zahraniční značky" # todo: NEW TRANSLATION
 SOV_economic_invite_investors_desc: "Jsme připraveni přivítat zahraniční automobilové značky k výstavbě továren v Rusku. To diverzifikuje náš trh a přinese špičkové automobilové technologie." # todo: NEW TRANSLATION
 SOV_economic_cars_usa: "Americké automobilové značky" # todo: NEW TRANSLATION
 SOV_economic_cars_usa_desc: "Američtí výrobci automobilů jsou zváni ke vstupu a rozšíření své přítomnosti na našem trhu. Tato spolupráce rozšíří nabídku pro spotřebitele a podpoří konkurenci." # todo: NEW TRANSLATION
 SOV_economic_cars_europe: "Evropské automobilové značky" # todo: NEW TRANSLATION
 SOV_economic_cars_europe_desc: "Jsme připraveni plně integrovat evropské automobilové značky na ruský trh. Jejich účast přispěje k technologickému růstu a rozmanitosti trhu." # todo: NEW TRANSLATION
 SOV_economic_reno_nissan_autovaz: "AvtoVAZ Renault Nissan" # todo: NEW TRANSLATION
 SOV_economic_reno_nissan_autovaz_desc: "Aliance mezi AvtoVAZem, Renaultem a Nissanem má za cíl posílit náš automobilový sektor a pozitivně ovlivnit trh sdílenými znalostmi a zdroji." # todo: NEW TRANSLATION
 SOV_economic_cars_west_market: "Západní automobilový trh" # todo: NEW TRANSLATION
 SOV_economic_cars_west_market_desc: "Náš trh je stále více integrovaný se západními výrobci automobilů. Tento trend bude pokračovat, pomůže modernizovat průmysl a nabídnout spotřebitelům širší výběr vozidel." # todo: NEW TRANSLATION
 SOV_economic_cars_japan_market: "Japonský automobilový trh" # todo: NEW TRANSLATION
 SOV_economic_cars_japan_market_desc: "Plánujeme prohloubit partnerství s japonskými výrobci automobilů, abychom profitovali z jejich pokročilých technologií a výrobních standardů." # todo: NEW TRANSLATION
 SOV_economic_cars_china_market: "Čínský automobilový trh" # todo: NEW TRANSLATION
 SOV_economic_cars_china_market_desc: "Posílení vazeb s čínskými automobilkami otevře nové příležitosti a umožní přístup k inovativním modelům pro ruské spotřebitele." # todo: NEW TRANSLATION
 SOV_economic_cars_udar_market: "Široký přístup čínských výrobců" # todo: NEW TRANSLATION
 SOV_economic_cars_udar_market_desc: "Rozšíříme přítomnost čínských výrobců na našem domácím trhu. To zvýší konkurenci a nabídne kupujícím dostupnější možnosti." # todo: NEW TRANSLATION
 SOV_economic_cars_moskvich: "Moskvich" # todo: NEW TRANSLATION
 SOV_economic_cars_moskvich_desc: "Plánujeme oživit historickou značku Moskvich licencováním zahraničních automobilových návrhů. Tento přístup kombinuje dědictví s moderní technikou." # todo: NEW TRANSLATION
 SOV_economic_aurus: "Aurus" # todo: NEW TRANSLATION
 SOV_economic_aurus_desc: "Aurus je prestižní ruská značka známá výkonnými a luxusními vozy. Původně vyvíjena jako Unified Modular Platform a projekt Tuple, reprezentuje naše špičkové automobilové řemeslo." # todo: NEW TRANSLATION
 SOV_economic_domestic: "Zaměřit se na domácí automobilové značky" # todo: CHANGED
 SOV_economic_domestic_desc: "Je zásadní upřednostnit a chránit naše domácí výrobce automobilů místo spoléhaní se pouze na zahraniční řešení. Budování místních kapacit posiluje naši ekonomiku a automobilovou nezávislost." # todo: NEW TRANSLATION
 SOV_economic_avtovaz: "AvtoVAZ" # todo: NEW TRANSLATION
 SOV_economic_avtovaz_desc: "AvtoVAZ je významný ruský státní výrobce automobilů, dříve známý jako VAZ. Nejvíce proslul řadou Lada; jeho vozidla se kdysi prodávala pod různými názvy, například Žiguli, Oka a Sputnik, které byly v 90. letech postupně nahrazeny značkou Lada." # todo: CHANGED
 SOV_economic_kamaz: "KAMAZ" # todo: NEW TRANSLATION
 SOV_economic_kamaz_desc: "KAMAZ se sídlem v Naběrežnyje Čelny je předním ruským výrobcem nákladních vozidel, autobusů a motorů. Založen v roce 1969, společnost je zvláště známá svými kab‑over‑engine návrhy nákladních vozů." # todo: NEW TRANSLATION
 SOV_economic_gaz: "GAZ" # todo: NEW TRANSLATION
 SOV_economic_gaz_desc: "GAZ, či Gorkovskij avtomobilny zavod, je klíčový ruský automobilový výrobce se sídlem v Nižním Novgorodě. Působí jako zásadní dceřiná společnost holdingové skupiny GAZ, která je součástí průmyslové skupiny Basic Element." # todo: NEW TRANSLATION
 SOV_economic_national_proud: "Národní pýcha" # todo: NEW TRANSLATION
 SOV_economic_national_proud_desc: "Naše domácí automobily jsou zdrojem národní hrdosti. Jsme odhodláni podporovat jejich rozvoj a zajistit, aby se staly jedněmi z nejlepších vozidel na světě." # todo: NEW TRANSLATION
 SOV_economic_vaz_electro_car: "Elektrické vozy VAZ" # todo: NEW TRANSLATION
 SOV_economic_vaz_electro_car_desc: "VAZ plánuje spustit vlastní řadu elektrických vozidel. Tato iniciativa je součástí širší strategie modernizace automobilového průmyslu a naplnění budoucí poptávky." # todo: NEW TRANSLATION
 SOV_economic_own_mosnosti: "Naše kapacity" # todo: NEW TRANSLATION
 SOV_economic_own_mosnosti_desc: "Máme v úmyslu spoléhat se výhradně na naše vlastní výrobní zařízení pro růst automobilového průmyslu. To pomůže udržet kontrolu nad kvalitou a posílit domácí výrobu." # todo: NEW TRANSLATION
 SOV_economic_chaika: "Chaika" # todo: NEW TRANSLATION
 SOV_economic_chaika_desc: "Historická značka Chaika bude oživena s moderními vylepšeními a funkcemi. Tento návrat má smíchat klasické dědictví s moderním automobilovým designem." # todo: NEW TRANSLATION
 SOV_economic_rostelekom: "Rostelecom" # todo: NEW TRANSLATION
 SOV_economic_rostelekom_desc: "Rostelecom je největší ruský poskytovatel digitálních služeb, obsluhující domácnosti, podniky, vládu a telekomunikační operátory. Propojuje lokální sítě do jednotného národního systému pro dálkové hovory a internetové služby a hraje zásadní roli v ruské komunikační infrastruktuře." # todo: NEW TRANSLATION
 SOV_economic_inter_networks: "Interní síťoví operátoři" # todo: NEW TRANSLATION
 SOV_economic_inter_networks_desc: "Rostelecom plánuje získat mnoho menších síťových operátorů po celém Rusku a konsolidovat je pod svou kontrolou. Tato strategie zlepší efektivitu a rozšíří jeho tržní podíl." # todo: NEW TRANSLATION
 SOV_economic_gosuslugi: "Gosuslugi" # todo: NEW TRANSLATION
 SOV_economic_gosuslugi_desc: "Gosuslugi je federální digitální platforma provozovaná ruskou vládou, poskytující online přístup k informacím o státních a obecních službách. Nabízí elektronické formuláře a zjednodušuje interakci mezi občany, podniky a vládou." # todo: NEW TRANSLATION
 SOV_economic_mts: "MTS" # todo: NEW TRANSLATION
 SOV_economic_mts_desc: "Mobile TeleSystems (MTS) je největší ruský mobilní operátor se sídlem v Moskvě. Poskytuje služby v sítích GSM, UMTS a LTE, spolu s pevnou telefonní linkou, širokopásmovým internetem a různými televizními službami." # todo: NEW TRANSLATION
 SOV_economic_mts_expanding: "Expanze MTS" # todo: NEW TRANSLATION
 SOV_economic_mts_expanding_desc: "MTS investuje do výstavby mnoha vysílačů po celé zemi. Tato expanze zlepší pokrytí a kvalitu komunikace v Rusku a prospěje milionům uživatelů." # todo: NEW TRANSLATION
 SOV_economic_tele2: "Tele2 Russia" # todo: NEW TRANSLATION
 SOV_economic_tele2_desc: "Tele2 Russia, původně založená švédskou Tele2, je nyní plně vlastněnou dceřinou společností Rostelecomu. Je klíčovým hráčem na ruském telekomunikačním trhu." # todo: NEW TRANSLATION
 SOV_economic_megaphon: "MegaFon" # todo: NEW TRANSLATION
 SOV_economic_megaphon_desc: "MegaFon, dříve North-West GSM, je druhým největším ruským mobilním operátorem a třetím největším telekomunikačním poskytovatelem. Nabízí služby v sítích GSM, UMTS a LTE po celé zemi." # todo: CHANGED
 SOV_economic_it_sphere: "Ruský IT sektor" # todo: NEW TRANSLATION
 SOV_economic_it_sphere_desc: "Jsme odhodláni rozvíjet domácí IT sektor, protože technologie jsou základem budoucnosti. Investice do IT zajistí, že naše země zůstane konkurenceschopná a inovativní." # todo: NEW TRANSLATION
 SOV_economic_mmvb: "Moskevská mezibankovní burza" # todo: NEW TRANSLATION
 SOV_economic_mmvb_desc: "Moskevská mezibankovní měnová burza stanovuje kurz rublu a zúčtovává většinu domácího obchodování s měnami a cennými papíry. Umístění našich velkých státních společností na regulovanou burzu poskytne státní pokladně spolehlivý přehled o firemních ziscích a otevře cestu k uvedení Gazpromu, Rosněfti a ALROSA na burzu." # todo: CHANGED
 SOV_economic_mosbirja: "Moskevská burza" # todo: NEW TRANSLATION
 SOV_economic_mosbirja_desc: "Sloučení měnové burzy s trhem cenných papírů poskytne Rusku jedinou platformu pro akcie, dluhopisy, deriváty a měny. Větší objem kapitálu, který z toho vzejde, bude pohybovat £text_icon_sov_ruble §Ykapitalizací§! společností mnohem výrazněji než dříve, oběma směry: dobré zprávy budou odměňovány silněji a špatné zprávy tvrději trestány." # todo: CHANGED
 SOV_economic_sber_reorg: "Reforma Sberbank" # todo: NEW TRANSLATION
 SOV_economic_sber_reorg_desc: "Sberbank prochází komplexními reformami za účelem modernizace provozu a zlepšení služeb. Tato transformace má banka učinit více orientovanou na zákazníka a konkurenceschopnou v měnícím se finančním prostředí." # todo: NEW TRANSLATION
 SOV_economic_sber_ipo: "Lidové IPO Sberbank" # todo: NEW TRANSLATION
 SOV_economic_sber_ipo_desc: "Sberbank plánuje zahájit veřejné IPO, aby rozšířila vlastnictví a posílila kapitálovou základnu. Tento krok zvýší transparentnost a umožní širší účast veřejnosti." # todo: NEW TRANSLATION
 SOV_economic_vtb_ipo: "Lidové IPO VTB" # todo: NEW TRANSLATION
 SOV_economic_vtb_ipo_desc: "VTB Bank připravuje veřejné IPO za účelem přilákání investic a rozšíření tržní přítomnosti. Tento krok posílí její finanční stabilitu a podpoří růst." # todo: NEW TRANSLATION
 SOV_economic_vtb: "VTB Bank" # todo: NEW TRANSLATION
 SOV_economic_vtb_desc: "VTB Bank je významná ruská finanční instituce nabízející širokou škálu bankovních služeb pro jednotlivce a podniky. Hraje klíčovou roli v ruském bankovním sektoru." # todo: NEW TRANSLATION
 SOV_economic_alpha: "Alpha Bank" # todo: NEW TRANSLATION
 SOV_economic_alpha_desc: "Alpha Bank je přední soukromá banka v Rusku, známá svými komplexními finančními produkty a službami. Obsluhuje jak retailové, tak korporátní klienty." # todo: NEW TRANSLATION
 SOV_economic_alpha_lab: "Alpha Lab" # todo: NEW TRANSLATION
 SOV_economic_alpha_lab_desc: "Alpha Lab je inovační centrum Alpha Bank, zaměřené na vývoj špičkových finančních technologií a digitálních řešení ke zlepšení zákaznické zkušenosti." # todo: NEW TRANSLATION
 SOV_economic_destiny_sber: "Rebranding Sberbank" # todo: NEW TRANSLATION
 SOV_economic_destiny_sber_desc: "Je čas na rozsáhlý rebranding Sberbank. Staré struktury a vizuální styl jsou zastaralé. Dnes Sberbank není jen banka, ale plnohodnotné ekosystémové řešení nabízející různé finanční a digitální služby." # todo: NEW TRANSLATION
 SOV_economic_destiny_vk: "Budoucnost VK" # todo: NEW TRANSLATION
 SOV_economic_destiny_vk_desc: "VKontakte je největší ruskou sociální sítí s vlivem přesahujícím očekávání. Může nadejít čas, aby tato platforma byla uvedena pod státní kontrolu, aby její směřování odpovídalo národním zájmům." # todo: NEW TRANSLATION
 SOV_economic_kasperskyi: "Kaspersky Lab" # todo: NEW TRANSLATION
 SOV_economic_kasperskyi_desc: "Kaspersky Lab je celosvětově uznávaná kyberbezpečnostní společnost se sídlem v Rusku. Vyvíjí pokročilý antivirový a bezpečnostní software, který chrání uživatele po celém světě." # todo: NEW TRANSLATION
 SOV_economic_bilene: "Beeline" # todo: NEW TRANSLATION
 SOV_economic_bilene_desc: "Beeline je přední ruská telekomunikační společnost poskytující mobilní a internetové služby po celé zemi. Hraje významnou roli v propojování lidí a podniků." # todo: NEW TRANSLATION
 SOV_economic_mir: "Mir" # todo: NEW TRANSLATION
 SOV_economic_mir_desc: "Mir je ruský elektronický platební systém založený Centrální bankou Ruska. Nabízí finanční instituce značené platební produkty používané pro kreditní, debetní a další karty, čímž poskytuje domácí alternativu mezinárodním platebním systémům." # todo: NEW TRANSLATION
 SOV_economic_destiny_yandex: "Budoucnost Yandexu" # todo: NEW TRANSLATION
 SOV_economic_destiny_yandex_desc: "Yandex začínal jako malá společnost a vyrostl v dominantního hráče v ruském IT sektoru. Je nyní natolik vlivný, že může být nutná státní účast při určování jeho dalšího směřování." # todo: NEW TRANSLATION
 SOV_economic_glonass: "GLONASS" # todo: NEW TRANSLATION
 SOV_economic_glonass_desc: "GLONASS je ruský satelitní navigační systém poskytující globální pokrytí. Jako alternativa k systému GPS nabízí přesné polohovací služby zásadní pro civilní i vojenské využití." # todo: CHANGED
 SOV_sollers_idea: "Sollers" # todo: NEW TRANSLATION
 SOV_private_media_nationalisation_idea: "Nacionalizace soukromých médií" # todo: NEW TRANSLATION
 SOV_independent_media_idea: "Nezávislá média" # todo: NEW TRANSLATION
 SOV_foreign_cars_idea: "Zahraniční automobilový průmysl" # todo: NEW TRANSLATION
 SOV_vk_durov_idea: "VKontakte" # todo: NEW TRANSLATION
 SOV_vk_idea: "VK Group" # todo: NEW TRANSLATION
 SOV_foreign_chinacars_idea: "Čínský automobilový průmysl" # todo: NEW TRANSLATION
 SOV_our_cars_idea: "Domácí automobilový průmysl" # todo: NEW TRANSLATION
 SOV_auto_industry_idea: "Ruský automobilový průmysl" # todo: NEW TRANSLATION
 SOV_auto_industry_idea_desc: "AvtoVAZ, GAZ a KamAZ přežily devadesátá léta díky barterovým obchodům a nevyplaceným mzdám. Nyní, když továrny znovu fungují a daňový kodex byl přepsán, výrobní linky v Toljatti, Nižním Novgorodu a Naberežných Čelnech vyrábějí vozidla pro domácí trh, který si je konečně může dovolit." # todo: NEW TRANSLATION
 SOV_space_marines_idea: "Ruské kosmické mariňeři" # todo: NEW TRANSLATION
 PMR_gazprom_gaz: "Gazprom v Podněstří" # todo: NEW TRANSLATION
 SOV_inter_rao: "InterRao v Podněstří" # todo: NEW TRANSLATION
 SOV_turkey_stream_idea: "Turkish Stream" # todo: NEW TRANSLATION
 SOV_blue_stream_idea: "Blue Stream" # todo: NEW TRANSLATION
 SOV_nord_stream2_idea: "Nord Stream 2" # todo: NEW TRANSLATION
 SOV_nord_stream_idea: "Nord Stream" # todo: NEW TRANSLATION
 SOV_korean_stream_sov_idea: "Korean Stream" # todo: NEW TRANSLATION
 SOV_korean_stream_idea: "Korean Stream" # todo: NEW TRANSLATION
 SOV_baikonur_sov_kaz_idea: "Kosmodrom Bajkonur" # todo: NEW TRANSLATION
 SOV_baikonur_kaz_idea: "Kosmodrom Bajkonur" # todo: NEW TRANSLATION
 SOV_baikonur_sov_idea: "Kosmodrom Bajkonur" # todo: NEW TRANSLATION
 SOV_azod_phosagro_idea: "PhosAgro chemická hnojiva" # todo: NEW TRANSLATION
 SOV_azod_phosagro_idea_desc: "PhosAgro je ruský chemický holding vyrábějící hnojiva, fosfáty a krmné fosfáty. Společnost sídlí v Moskvě a jejími dceřinými podniky je Apatit v Murmanské oblasti, který se zabývá těžbou apatitového kamene. Společnost je největším evropským producentem fosfátových hnojiv." # todo: NEW TRANSLATION
 SOV_yukos_idea: "Yukos" # todo: NEW TRANSLATION
 SOV_yukos_idea_desc: "Jukos je největším a nejziskovějším producentem ropy v Rusku. Je řízen podle západních účetních standardů a stále více také podle vlastní politické agendy. Jeho agresivní daňová optimalizace odvádí značnou část příjmů z ropy mimo federální rozpočet.\n§W--------------§!\nTento národní duch bude §Rodstraněn§!, jakmile bude Chodorkovského aféra vyřešena. Jeho osvobození jej zruší okamžitě, zatímco odsuzující verdikt vyžaduje zaměření §HSoudní procesy s Chodorkovským§! a §HZabavit ropu Jukosu§!." # todo: NEW TRANSLATION
 SOV_broken_economy_idea_1: "Vážné ekonomické důsledky" # todo: NEW TRANSLATION
 SOV_broken_economy_idea_1_desc: "Zhroucení sovětského průmyslu a bankrot z roku 1998 zanechaly výrobu, výzkum i výběr daní v troskách. Celá odvětví přežívají díky barteru a nedoplatkům mezd a státní pokladna sotva financuje to, co z nich zbylo.\n§W--------------§!\nTento národní duch bude rozhodnutím §HOznámit růst ekonomiky§!, které vyžaduje £text_icon_sov_ruble §HEkonomické oživení§! ve výši alespoň §H10§! a stojí §H250§! politické moci, §Gzmírněn§! na §HVážné ekonomické důsledky§!.\n§W--------------§!\n£text_icon_sov_ruble §YEkonomické oživení§! roste při dokončování zaměření v §HEkonomické větvi§!. Aktuálně: §Y[?SOV.SOV_economic|0]§!" # todo: NEW TRANSLATION
 SOV_broken_economy_idea_2: "Závažné ekonomické důsledky" # todo: NEW TRANSLATION
 SOV_broken_economy_idea_2_desc: "Nejhorší část krize pominula a výroba znovu roste, ale škody z 90. let jsou stále patrné v nečinných továrnách, zastaralém vybavení a výzkumné základně, která přišla o celou generaci odborníků.\n§W--------------§!\nTento národní duch bude rozhodnutím §HOznámit růst ekonomiky§!, které vyžaduje zaměření §HRuská ekonomika§!, £text_icon_sov_ruble §HEkonomické oživení§! ve výši alespoň §H20§! a stojí §H250§! politické moci, §Gzmírněn§! na §HPrůměrné ekonomické důsledky§!.\n§W--------------§!\n£text_icon_sov_ruble §YEkonomické oživení§! roste při dokončování zaměření v §HEkonomické větvi§!. Aktuálně: §Y[?SOV.SOV_economic|0]§!" # todo: NEW TRANSLATION
 SOV_broken_economy_idea_3: "Průměrné ekonomické důsledky" # todo: NEW TRANSLATION
 SOV_broken_economy_idea_3_desc: "Růst se vrátil a rozpočet je v přebytku, přesto produktivita, infrastruktura a průmyslová kapacita stále výrazně zaostávají za stavem před rozpadem Sovětského svazu.\n§W--------------§!\nTento národní duch bude rozhodnutím §HOznámit růst ekonomiky§!, které vyžaduje zaměření §HRuská ekonomika§!, £text_icon_sov_ruble §HEkonomické oživení§! ve výši alespoň §H30§! a stojí §H350§! politické moci, §Rodstraněn§!.\n§W--------------§!\n£text_icon_sov_ruble §YEkonomické oživení§! roste při dokončování zaměření v §HEkonomické větvi§! a dosahuje maxima §H30§!. Aktuálně: §Y[?SOV.SOV_economic|0]§!" # todo: NEW TRANSLATION
 sov_economic.1.t: "Khodorkovského případ" # todo: NEW TRANSLATION
 sov_economic.1.d: "Michail Chodorkovskij byl zatčen podezření z vážné krádeže a korupce ve své ropné společnosti Yukos. Má značný vliv mezi oligarchy a mohl by představovat hrozbu vnitřní stability. Ačkoli neexistují jednoznačné důkazy viny, musíme opatrně rozhodnout, jak postupovat. Tato volba může mít dlouhodobé politické důsledky." # todo: NEW TRANSLATION
 sov_economic.1.a: "Vinen!" # todo: NEW TRANSLATION
 sov_economic.1.b: "Je to dobrý podnikatel, ne zloděj!" # todo: NEW TRANSLATION
 sov_economic.2.t: "Khodorkovského soud" # todo: NEW TRANSLATION
 sov_economic.2.d: "Po rychlém vyšetřování nastal čas vynést rozsudek nad Chodorkovským. Musíme rozhodnout o odpovídajícím trestu. Naše rozhodnutí pošle silný signál o tom, jak řešíme vysoce profilované případy korupce." # todo: NEW TRANSLATION
 sov_economic.2.a: "Dejte ho do vězení!" # todo: NEW TRANSLATION
 sov_economic.2.b: "Pokuta stačí." # todo: NEW TRANSLATION
 sov_economic.306.t: "Žalobce se odvolává" # todo: NEW TRANSLATION
 sov_economic.306.d: "Zproštění viny věc neuzavřelo. Generální prokuratura podala odvolání s tvrzením, že účty Jukosu nebyly nikdy řádně prověřeny a že rozsudek byl koupen, nikoli odůvodněn. Oligarchové sledují, zda bude zproštění viny potvrzeno." # todo: NEW TRANSLATION
 sov_economic.306.a: "Trvat na odvolání." # todo: NEW TRANSLATION
 sov_economic.306.b: "Ponechat rozsudek v platnosti." # todo: NEW TRANSLATION
 sov_economic.3.t: "Guzinského případ" # todo: NEW TRANSLATION
 sov_economic.3.d: "Vladimir Gusinskij, generální ředitel největší soukromé mediální společnosti v Rusku NTV, byl obviněn z vážného podvodu a zatčen. Nabídl prodat celé své mediální impérium vládě a opustit zemi. Měli bychom tento obchod přijmout, abychom se vyhnuli dalším komplikacím?" # todo: NEW TRANSLATION
 sov_economic.3.a: "Koupit akcie a nechat ho odejít." # todo: NEW TRANSLATION
 sov_economic.3.b: "Je nevinný! Propusťte ho!" # todo: NEW TRANSLATION
 sov_economic.3.c: "Jeho média nepotřebujeme. Zavřít ho!" # todo: CHANGED
 sov_economic.4.t: "Fúze Rosneft s TNK" # todo: NEW TRANSLATION
 sov_economic.4.d: "Rosneft navrhl fúzi se svým hlavním konkurentem TNK. Tento krok zpochybňuje principy volného trhu, ale prospěje vládě. Měli bychom tuto fúzi schválit i přes rizika?" # todo: NEW TRANSLATION
 sov_economic.4.a: "Ano! Rosneft by měl dominovat." # todo: NEW TRANSLATION
 sov_economic.4.b: "Ne! Chraňte volný trh, nechte TNK nezávislý." # todo: NEW TRANSLATION
 sov_economic.5.t: "Fúze Gazpromu se Sibnefť" # todo: NEW TRANSLATION
 sov_economic.5.d: "Gazprom plánuje získat Sibnefť, velkou ropnou společnost vlastněnou Romanem Abramovičem. Ačkoli to ohrožuje svobodu trhu, posílí to vládní korporace. Měli bychom tento obchod schválit?" # todo: NEW TRANSLATION
 sov_economic.5.a: "Schválit! Sibnefť bude naše." # todo: NEW TRANSLATION
 sov_economic.5.b: "Odmítnout! Volný trh je pro Rusko zásadní." # todo: NEW TRANSLATION
 sov_economic.7.t: "Nord Stream" # todo: NEW TRANSLATION
 sov_economic.7.d: "Rusko navrhuje výstavbu plynovodu Nord Stream. Tento projekt slibuje významné posílení naší ekonomiky a energetického sektoru." # todo: NEW TRANSLATION
 sov_economic.7.a: "Souhlasit" # todo: NEW TRANSLATION
 sov_economic.7.b: "Odmítnout" # todo: NEW TRANSLATION
 sov_economic.8.t: "Otevření plynovodu" # todo: NEW TRANSLATION
 sov_economic.8.d: "Náš návrh na otevření plynovodu do jejich země byl přijat. To znamená nový krok v naší ekonomické spolupráci." # todo: NEW TRANSLATION
 sov_economic.8.a: "Pozitivní vývoj" # todo: NEW TRANSLATION
 sov_economic.9.t: "Otevření plynovodu" # todo: NEW TRANSLATION
 sov_economic.9.d: "Naše nabídka na otevření plynovodu byla odmítnuta. Samotné potrubí je vybudováno a jeho kapacita nikam nezmizí, takže nabídku lze znovu předložit, až se politické počasí zlepší." # todo: CHANGED
 sov_economic.9.a: "Ať toho budou litovat" # todo: NEW TRANSLATION
 sov_economic.10.t: "Blue Stream" # todo: NEW TRANSLATION
 sov_economic.10.d: "Rusko nabízí výstavbu plynovodu Blue Stream, který zlepší naši energetickou infrastrukturu a ekonomický růst." # todo: NEW TRANSLATION
 sov_economic.10.a: "Přijmout" # todo: NEW TRANSLATION
 sov_economic.10.b: "Odmítnout" # todo: NEW TRANSLATION
 sov_economic.11.t: "Turkish Stream" # todo: NEW TRANSLATION
 sov_economic.11.d: "Rusko navrhuje plynovod Turkish Stream. Tento projekt by mohl výrazně zlepšit naše ekonomické vazby a energetickou bezpečnost." # todo: NEW TRANSLATION
 sov_economic.11.a: "Ano" # todo: NEW TRANSLATION
 sov_economic.11.b: "Ne" # todo: NEW TRANSLATION
 sov_economic.12.t: "Nord Stream 2" # todo: NEW TRANSLATION
 sov_economic.12.d: "Nabídka na výstavbu Nord Stream 2 slibuje posílení naší ekonomiky díky lepším vývozním kapacitám energie." # todo: NEW TRANSLATION
 sov_economic.12.a: "Schválit" # todo: NEW TRANSLATION
 sov_economic.12.b: "Odmítnout" # todo: NEW TRANSLATION
 sov_economic.13.t: "Investice do ruského průmyslu pneumatik" # todo: NEW TRANSLATION
 sov_economic.13.d: "Ruský průmysl pneumatik bojuje a potřebuje investice. Vláda je otevřena naší účasti, což nám umožní vybudovat výrobní závod dříve než konkurence." # todo: NEW TRANSLATION
 sov_economic.13.a: "Investovat" # todo: NEW TRANSLATION
 sov_economic.13.b: "Odmítnout" # todo: NEW TRANSLATION
 sov_economic.14.t: "Ruský průmysl pneumatik" # todo: NEW TRANSLATION
 sov_economic.14.d: "Vláda souhlasila investovat do našeho průmyslu pneumatik, nabízí nové příležitosti pro růst a modernizaci." # todo: NEW TRANSLATION
 sov_economic.14.a: "Dobré zprávy" # todo: NEW TRANSLATION
 sov_economic.15.t: "Ruský průmysl pneumatik" # todo: NEW TRANSLATION
 sov_economic.15.d: "Vláda odmítla investice do našeho průmyslu pneumatik, což může zpomalit pokrok a konkurenceschopnost." # todo: NEW TRANSLATION
 sov_economic.15.a: "Zklamání" # todo: NEW TRANSLATION
 sov_economic.16.t: "Rusko navrhuje obchodní dohodu o chemických hnojivech" # todo: CHANGED
 sov_economic.16.d: "Rusko nám nabídlo exkluzivní kontrakt na vysoce kvalitní chemická hnojiva. Přijetí této dohody by mohlo výrazně zlepšit naše zemědělské výnosy, ačkoliv někteří mohou zpochybňovat politické důsledky." # todo: NEW TRANSLATION
 sov_economic.16.a: "Přijmout" # todo: NEW TRANSLATION
 sov_economic.16.b: "Prozatím odmítnout" # todo: NEW TRANSLATION
 sov_economic.17.t: "[From.GetName] přijímá" # todo: NEW TRANSLATION
 sov_economic.17.d: "Naše jednání s [From.GetName] byla úspěšná. Kontrakt je podepsán a očekává se první platba. To je pozitivní krok vpřed." # todo: NEW TRANSLATION
 sov_economic.17.a: "Konečně, dobré zprávy." # todo: NEW TRANSLATION
 sov_economic.18.t: "[From.GetName] odmítl naši dohodu." # todo: NEW TRANSLATION
 sov_economic.18.d: "Naše dohoda s [From.GetName] selhala. Nedostali jsme odpověď a vyhlídky vypadají bledě. Musíme přehodnotit náš přístup." # todo: NEW TRANSLATION
 sov_economic.18.a: "Frustrující nezdar." # todo: NEW TRANSLATION
 sov_economic.19.t: "Rusko navrhuje obchodní dohodu o chemických hnojivech" # todo: CHANGED
 sov_economic.19.d: "Rusko nabídlo exkluzivní kontrakt na vysoce kvalitní chemická hnojiva. Tato dohoda slibuje vyšší výnosy plodin, ale může vyvolat politické obavy u některých stran." # todo: NEW TRANSLATION
 sov_economic.19.a: "Přijmout nabídku." # todo: NEW TRANSLATION
 sov_economic.19.b: "Prozatím odmítnout." # todo: NEW TRANSLATION
 sov_economic.20.t: "[From.GetName] přijímá" # todo: NEW TRANSLATION
 sov_economic.20.d: "Dohoda s [From.GetName] byla dokončena. Kontrakt je podepsán a platby brzy začnou, což představuje významný úspěch." # todo: NEW TRANSLATION
 sov_economic.20.a: "Skvělé zprávy." # todo: NEW TRANSLATION
 sov_economic.21.t: "[From.GetName] odmítl naši dohodu." # todo: NEW TRANSLATION
 sov_economic.21.d: "Jednání s [From.GetName] uvízla bez odpovědi. Dohoda je prozatím mrtvá." # todo: NEW TRANSLATION
 sov_economic.21.a: "Zklamávající odmítnutí." # todo: NEW TRANSLATION
 sov_economic.22.t: "Skandál Gazpromu" # todo: NEW TRANSLATION
 sov_economic.22.d: "Skandál týkající se Gazpromu se prostřednictvím médií dostal na veřejnost. To způsobilo pokles hodnoty akcií společnosti a vyvolalo obavy o její pověst." # todo: CHANGED
 sov_economic.22.a: "Obviňujte média." # todo: NEW TRANSLATION
 sov_economic.23.t: "Skandál Sberbank" # todo: NEW TRANSLATION
 sov_economic.23.d: "Sberbank je zapletena ve skandálu široce medializovaném, což negativně ovlivnilo ceny jejích akcií a otřáslo důvěrou investorů." # todo: NEW TRANSLATION
 sov_economic.23.a: "Média znovu útočí." # todo: NEW TRANSLATION
 sov_economic.24.t: "Skandál Rosneftu" # todo: NEW TRANSLATION
 sov_economic.24.d: "Rosněfť čelí skandálu, o němž se rozsáhle informovalo, což poškodilo pověst společnosti a způsobilo pokles hodnoty jejích akcií." # todo: CHANGED
 sov_economic.24.a: "Mediální manipulace." # todo: NEW TRANSLATION
 sov_economic.25.t: "Kolaps kapitalizace velkých společností" # todo: CHANGED
 sov_economic.25.d: "Sankce proti naší zemi způsobily, že mnoho zahraničních investorů odešlo z velkých společností, což vedlo k prudkému poklesu jejich tržní kapitalizace." # todo: NEW TRANSLATION
 sov_economic.25.a: "Obviňovat zahraniční zájmy." # todo: NEW TRANSLATION
 sov_economic.26.t: "Důsledky čistky oligarchů" # todo: NEW TRANSLATION
 sov_economic.26.d: "Náš tvrdý přístup k oligarchům vyvolal četné trestní řízení, které negativně ovlivnily hlavní společnosti, neboť investoři se zalekli a stáhli se." # todo: NEW TRANSLATION
 sov_economic.26.a: "Hloupí investoři." # todo: NEW TRANSLATION
 sov_economic.27.t: "Nehoda v zařízení Rosněfti" # todo: CHANGED
 sov_economic.27.d: "Únik v zařízení Rosneft způsobil vážné ekonomické a environmentální škody. Investoři se hromadně snažili prodat akcie v očekávání vysokých státních sankcí." # todo: NEW TRANSLATION
 sov_economic.27.a: "Kdo zapomněl zavřít ventil?" # todo: NEW TRANSLATION
 sov_economic.28.t: "Nehoda v zařízení Gazpromu" # todo: CHANGED
 sov_economic.28.d: "Ve velkém zařízení Gazpromu došlo k incidentu způsobujícímu ekonomické a ekologické následky. Investoři rychle prodávali akcie ze strachu z vládních sankcí." # todo: NEW TRANSLATION
 sov_economic.28.a: "Zase chyba ventilu?" # todo: NEW TRANSLATION
 sov_economic.29.t: "Uzavření plynového proudu Gazpromu" # todo: NEW TRANSLATION
 sov_economic.29.d: "Zpráva o uzavření plynového proudu zasáhla burzu tvrdě, což způsobilo propad akcií Gazpromu, protože investoři se obávali zpomalení růstu a ztrát." # todo: NEW TRANSLATION
 sov_economic.29.a: "Krátkozrací investoři." # todo: NEW TRANSLATION
 sov_economic.30.t: "Otevření nového plynového proudu" # todo: NEW TRANSLATION
 sov_economic.30.d: "Burza otevřela s pozitivními zprávami: akcie Gazpromu prudce vzrostly po oznámení spuštění nového plynového proudu." # todo: NEW TRANSLATION
 sov_economic.30.a: "Vynikající zprávy." # todo: NEW TRANSLATION
 sov_economic.31.t: "Panika z nationalizace" # todo: NEW TRANSLATION
 sov_economic.31.d: "Pověsti o přezkoumání privatizací z 90. let způsobily paniku mezi investory, kteří se báli ztráty aktiv a začali rychle prodávat akcie." # todo: NEW TRANSLATION
 sov_economic.31.a: "Přehnaně reagující investoři." # todo: NEW TRANSLATION
 sov_economic.32.t: "Reakce na vstup do WTO" # todo: NEW TRANSLATION
 sov_economic.32.d: "Po našem oficiálním vstupu do WTO zažila Moskevská burza nával, kdy investoři horlivě nakupovali akcie v očekávání velkého růstu." # todo: NEW TRANSLATION
 sov_economic.32.a: "Fantastické!" # todo: NEW TRANSLATION
 sov_economic.33.t: "Obnovení činnosti Moskevské burzy" # todo: NEW TRANSLATION
 sov_economic.33.d: "Po měsíční nucené uzavírce se Moskevská burza znovu otevřela a obchodování se vrátilo k normálu." # todo: NEW TRANSLATION
 sov_economic.33.a: "Vítejte zpět." # todo: NEW TRANSLATION
 sov_economic.34.t: "Privatizace elektrárny Cuciurgan" # todo: NEW TRANSLATION
 sov_economic.34.d: "Inter Rao, ruská společnost, plánuje privatizovat naši výkonnou GRES elektrárnu. Slíbili zajištění kontinuálního provozu a postupné technické modernizace, což prospěje našemu energetickému sektoru." # todo: NEW TRANSLATION
 sov_economic.34.a: "Souhlasíme." # todo: NEW TRANSLATION
 sov_economic.34.b: "Nesouhlasíme." # todo: NEW TRANSLATION
 sov_economic.35.t: "Privatizace elektrárny Cuciurgan" # todo: NEW TRANSLATION
 sov_economic.35.d: "Transnistrské orgány přijaly náš návrh na privatizaci, čímž jsme zvýšili náš vliv v regionu." # todo: NEW TRANSLATION
 sov_economic.35.a: "Pozitivní výsledek." # todo: NEW TRANSLATION
 sov_economic.36.t: "Privatizace elektrárny Cuciurgan" # todo: NEW TRANSLATION
 sov_economic.36.d: "Neočekávaně transnistrské orgány náš návrh na privatizaci odmítly. Musíme přijmout jejich rozhodnutí a jít dál." # todo: NEW TRANSLATION
 sov_economic.36.a: "Nedobré." # todo: NEW TRANSLATION
 sov_economic.37.t: "Zdarma plyn od Gazpromu" # todo: NEW TRANSLATION
 sov_economic.37.d: "Rusko podporuje naši nezávislost a nabízí bezplatné dodávky plynu. Tato štědrost však přichází s očekávanou politickou cenou, protože může být použita k ovlivňování naší politiky." # todo: NEW TRANSLATION
 sov_economic.37.a: "Přijmout." # todo: NEW TRANSLATION
 sov_economic.37.b: "Odmítnout." # todo: NEW TRANSLATION
 sov_economic.38.t: "Zdarma plyn pro Transnistrii" # todo: NEW TRANSLATION
 sov_economic.38.d: "Transnistrské orgány pozitivně zareagovaly na naši nabídku bezplatného plynu, což posílilo naši pozici v regionu." # todo: NEW TRANSLATION
 sov_economic.38.a: "Dobrá zpráva." # todo: NEW TRANSLATION
 sov_economic.39.t: "Zdarma plyn pro Transnistrii" # todo: NEW TRANSLATION
 sov_economic.39.d: "Transnistrské orgány odmítly naši nabídku bezplatného plynu, což je zklamáním pro naši regionální vliv." # todo: NEW TRANSLATION
 sov_economic.39.a: "Nedobré." # todo: NEW TRANSLATION
 sov_economic.40.t: "Osud sociální sítě Vkontakte" # todo: NEW TRANSLATION
 sov_economic.40.d: "Vkontakte začalo jako univerzitní sociální síť, ale vyrostlo v největší ruskou platformu. Nyní musíme rozhodnout o její budoucnosti, protože její vliv na společnost rychle roste." # todo: NEW TRANSLATION
 sov_economic.40.a: "Nechat ji nezávislou." # todo: NEW TRANSLATION
 sov_economic.40.b: "Uvést VK pod státní kontrolu." # todo: NEW TRANSLATION
 sov_economic.41.t: "Iniciativa národních projektů selhala!" # todo: NEW TRANSLATION
 sov_economic.41.d: "Nejnovější zpráva z Ministerstva hospodářství odhaluje, že jsme nesplnili cíle našich Národních projektů. Toto selhání poškozuje jak naši mezinárodní pověst, tak domácí důvěru. Jak bychom měli reagovat na toto zklamání?" # todo: NEW TRANSLATION
 sov_economic.41.o1: "Manipulovat fakty; stabilita je nejdůležitější." # todo: NEW TRANSLATION
 sov_economic.41.o2: "Přiznat selhání upřímně." # todo: NEW TRANSLATION
 sov_economic.42.t: "Iniciativa národních projektů úspěšná!" # todo: NEW TRANSLATION
 sov_economic.42.d: "Ministerstvo hospodářství hlásí, že jsme dosáhli cílů Národních projektů! Tento úspěch dokazuje sílu a schopnost našeho lidu. Je to hrdý okamžik pro Rusko." # todo: NEW TRANSLATION
 sov_economic.42.o1: "Dokázali jsme to! Ura!" # todo: NEW TRANSLATION
 sov_economic.43.t: "[From.GetName] a MTS" # todo: NEW TRANSLATION
 sov_economic.43.d: "[From.GetName] a naše společnost MTS podepsaly novou dohodu, která nám otevírá přístup na jejich trh. Toto partnerství by mělo výrazně zvýšit kapitalizaci naší společnosti." # todo: NEW TRANSLATION
 sov_economic.43.a: "Výborně" # todo: NEW TRANSLATION
 sov_economic.44.t: "[From.GetName] a Gazprom" # todo: NEW TRANSLATION
 sov_economic.44.d: "[From.GetName] a Gazprom dokončili dohodu, která nám otevírá přístup na jejich trh. Tento obchod pravděpodobně posílí naši kapitalizaci a tržní přítomnost." # todo: NEW TRANSLATION
 sov_economic.44.a: "Výborně" # todo: NEW TRANSLATION
 sov_economic.45.t: "[From.GetName] a VTB" # todo: NEW TRANSLATION
 sov_economic.45.d: "[From.GetName] a VTB podepsali dohodu, která nám umožní přístup na jejich trh přes jejich síť, což by mělo pozitivně ovlivnit naši kapitalizaci." # todo: NEW TRANSLATION
 sov_economic.45.a: "Výborně" # todo: NEW TRANSLATION
 sov_economic.46.t: "[From.GetName] a Rosneft" # todo: NEW TRANSLATION
 sov_economic.46.d: "[From.GetName] a Rosneft uzavřeli dohodu, která nám umožní přístup na jejich trh, slibující pozitivní efekt na naši kapitalizaci." # todo: NEW TRANSLATION
 sov_economic.46.a: "Výborně" # todo: NEW TRANSLATION
 sov_economic.47.t: "[From.GetName] a Alrosa" # todo: NEW TRANSLATION
 sov_economic.47.d: "[From.GetName] a Alrosa podepsali dohodu, která nám zajišťuje přístup na trh prostřednictvím této společnosti. Tato dohoda by měla zlepšit naši kapitalizaci." # todo: NEW TRANSLATION
 sov_economic.47.a: "Výborně" # todo: NEW TRANSLATION
 SOV_economy_category: "Ruská ekonomika" # todo: NEW TRANSLATION
 SOV_economy_category_desc: "[SOV.GetFlag]§Y[SOV.GetAdjectiveCap] ekonomika§! nyní prochází těžkými časy. Nestačí pouze oživit dědictví minulosti, musíme také proniknout mezi světové hospodářské lídry.\n\nK odstranění národního ducha §REkonomické důsledky§! je nutné §Gdokončit§! zaměření ve §Yhospodářské větvi§!. Čím více £text_icon_sov_ruble §Yhospodářské obnovy§! máte, tím rychleji tento §Rpostih§! §Godstraníte§!.\n\n£text_icon_sov_ruble §YKapitalizace§!: Největší společnosti v [SOV.GetFlag]§YRusku§! mají £text_icon_sov_ruble §Ykapitalizaci§!, která se zobrazí v jejich panelu. Neustále se mění v závislosti na různých podmínkách: získávání nových aktiv v Rusku i zahraničí, vysoká či nízká korupce, válka, hospodářský růst atd.\n\nPokud jsou u §Ymoci§! §Rkomunisté§!, £text_icon_sov_ruble §Ykapitalizace§! se přestane aktualizovat a měnit.\nPokud jsou u §Y moci§! §2oligarchové§!, £text_icon_sov_ruble §Ykapitalizace§! společností je výrazně §Rsnížena§!.\n\n£text_icon_sov_ruble §YHospodářská obnova§!: §Y[?SOV.SOV_economic|0]§!\n\n[SOV_MoexStatus_loc][SOV_CapGazprom_loc][SOV_CapRosneft_loc][SOV_CapSberbank_loc][SOV_CapVtb_loc][SOV_CapMts_loc][SOV_CapAlrosa_loc][SOV_SphereIntegration_loc]" # todo: CHANGED
