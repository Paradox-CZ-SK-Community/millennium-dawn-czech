 SOV_make_repairs_at_temp_hangar: "Provést závěrečné opravy v dočasném hangáru" # todo: NEW TRANSLATION
 SOV_make_repairs_at_temp_hangar_desc: "Dalším krokem je opravit strukturu raketoplánu a pečlivě jej znovu sestavit, obnovit jeho původní integritu." # todo: NEW TRANSLATION
 SOV_announce_full_restoration: "Proveďte zkušební let a přesuňte raketoplán do nového hangáru" # todo: NEW TRANSLATION
 SOV_announce_full_restoration_desc: "To je poslední potřebný krok, poslední tlak vpřed. Testovací posádka byla v uplynulých měsících vycvičena a raketoplán je připraven pro svůj zkušební let. Po dokončení bude přesunut do svého nového trvalého domova, připraven na novou kapitolu." # todo: NEW TRANSLATION
 SOV_againg_stabfund: "§GZnovu založit§! §YStabilizační fond§!" # todo: NEW TRANSLATION
