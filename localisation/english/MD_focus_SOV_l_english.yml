 SOV_interrao_open: "§ZOtevřít§! §YInterrao§!" # todo: NEW TRANSLATION
 SOV_interrao_close: "§Zavřít§! §YInterrao§!" # todo: NEW TRANSLATION
 SOV_interrao_buy_pmr_gres: "Koupit §YElektrárnu Cuciurgan§!" # todo: NEW TRANSLATION
