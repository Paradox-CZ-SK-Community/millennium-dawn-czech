 russia.52.t: "Ruská delegace na Tchaj-wanu" # todo: NEW TRANSLATION
 russia.52.d: "Dorazila ruská delegace s návrhem: koupit podíl v naší technologii mikroprocesorů výměnou za důležité ruské suroviny. Tato dohoda by mohla prospět oběma stranám." # todo: NEW TRANSLATION
 russia.52.a: "To je dobrý obchod" # todo: NEW TRANSLATION
 russia.52.b: "Rusko? A kolik má divizí?" # todo: NEW TRANSLATION
 russia.53.t: "Tchaj-wan odvolal dohodu" # todo: NEW TRANSLATION
 russia.53.d: "Tchajwanská vláda naši nabídku odmítla jako nevýhodnou. Jednání se zhroutila a napětí může vzrůst." # todo: NEW TRANSLATION
 russia.53.a: "Tchaj-wan prostě neuznává nadvládu procesorů Baikal" # todo: NEW TRANSLATION
 russia.54.t: "Ruské letecko-kosmické obranné síly" # todo: NEW TRANSLATION
 russia.54.d: "Ruské ozbrojené síly oficiálně zřídily nový útvar: Letecko-kosmické obranné síly. Reforma má za cíl efektivněji integrovat letecké a kosmické operace." # todo: NEW TRANSLATION
 russia.54.a: "Hurá!" # todo: NEW TRANSLATION
 russia.55.t: "Koronace cara Borise" # todo: NEW TRANSLATION
 russia.55.d: "Boris Jelcin se vrátil do veřejného života a mnozí ho nyní považují za symbolického cara celého Ruska. Toto oživení monarchie, byť převážně ceremoniální a neobvyklé, je historickou událostí." # todo: CHANGED
 russia.55.a: "Jaký nesmysl" # todo: NEW TRANSLATION
 russia.58.t: "Reformy armády" # todo: NEW TRANSLATION
 russia.58.d: "Naše vojenské reformy začínají přinášet ovoce. Do našich řad vstoupili noví talentovaní generálové, kteří přinášejí sílu a obnovený profesionalismus." # todo: NEW TRANSLATION
 russia.58.a: "Dobře" # todo: NEW TRANSLATION
 russia.59.t: "Reformy armády" # todo: NEW TRANSLATION
 russia.59.d: "Naše vojenské reformy začínají přinášet ovoce. Do našich řad vstoupili noví talentovaní generálové, kteří přinášejí sílu a obnovený profesionalismus." # todo: NEW TRANSLATION
 russia.59.a: "Dobře" # todo: NEW TRANSLATION
 russia.611.t: "Nový politický směr" # todo: CHANGED
 russia.611.d: "Politická krajina se dramaticky změnila. Objevilo se nové vedení s odlišnou vizí budoucího směřování země." # todo: CHANGED
 russia.611.a: "Začíná nová kapitola" # todo: CHANGED
 russia.62.t: "Katastrofa Mi-8 u vesnice Ermakovskoje" # todo: NEW TRANSLATION
 russia.62.d: "V dubnu 2002 zemřel generál Alexandr Lebed tragicky ve věku 53 let při havárii vrtulníku Mi-8 u jezera Ojskoye ve Východních Sajánech. Letoun narazil do elektrického vedení za špatného počasí, přičemž spolu s ním zahynulo dalších sedm osob. Zatímco oficiálně byla příčina přisouzena špatné přípravě posádky, alternativní teorie naznačují sabotáž nebo nátlak na let i za nebezpečných podmínek. Rozporuplné zprávy a absence podrobných aeronautických map nechávají přesnou příčinu nejasnou." # todo: NEW TRANSLATION
 russia.62.a: "Tragédie" # todo: NEW TRANSLATION
