 sov_final_strike.1.d: "Brzy ráno náš prezident oznámil zahájení Speciální operace na Ukrajině zaměřené na denacifikaci a demilitarizaci. Hrozí plnohodnotná invaze, která představuje vážné vyostření konfliktu." # todo: NEW TRANSLATION
