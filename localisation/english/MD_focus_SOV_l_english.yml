 SOV_adhere_to_nato_policy: "Přidržovat se politiky NATO" # todo: NEW TRANSLATION
 SOV_adhere_to_nato_policy_desc: "Spolupráce s NATO podporuje bezpečnost, stabilitu a vzájemné porozumění. Udržuje Rusko vlivné a vyrovnává globální zájmy." # todo: NEW TRANSLATION
