 sov_liberals.1.t: "Reformy dokončeny!" # todo: NEW TRANSLATION
 sov_liberals.1.d: "Úspěšně jsme zreformovali náš ekonomický systém za pouhých 500 dní! Je to velký úspěch, překonávající to, čeho dosáhli Gajdar a Jelcin. Nyní musíme udržet stabilní růst a zlepšit blahobyt našich občanů." # todo: NEW TRANSLATION
 sov_liberals.1.o1: "Oslavme to!" # todo: NEW TRANSLATION
 sov_liberals.2.t: "Reformy selhaly!" # todo: NEW TRANSLATION
 sov_liberals.2.d: "Naše snahy o reformu selhaly. Nepodařilo se nám vytvořit ekonomické zázraky, které jsme doufali. Nyní se musíme připravit na nejhorší, pravděpodobně čelit hospodářskému propadu připomínajícímu 90. léta." # todo: NEW TRANSLATION
 sov_liberals.2.o1: "Ach ne..." # todo: NEW TRANSLATION
 sov_liberals.2.o2: "Ach ne..." # todo: NEW TRANSLATION
 sov_liberals.2.o3: "Ach ne..." # todo: NEW TRANSLATION
 sov_liberals.3.t: "Velké ruské demokratické referendum" # todo: NEW TRANSLATION
 sov_liberals.3.d: "Nastal okamžik rozhodnout o budoucí státně-územní struktuře Ruska. Národní referendum konečně odhalí, jak si lidé představují územní budoucnost naší země." # todo: CHANGED
 sov_liberals.3.o1: "Lid rozhoduje o osudu země." # todo: CHANGED
 sov_liberals.4.t: "[FROM.GetNameWithFlag] nás zve do aliance" # todo: NEW TRANSLATION
 sov_liberals.4.d: "[FROM.GetNameWithFlag] nás zve, abychom se připojili k jejich Svobodné nezávislé alianci, zaměřené na obranu demokracie v bývalém sovětském prostoru a dále. Společně můžeme posílit obranu, rozvíjet ekonomiky a zvýšit geopolitický vliv. Odmítnutí znamená ztrátu klíčové podpory během konfliktů a stát osamoceně. Volba je na nás: připojit se a spolupracovat nebo jít sami." # todo: NEW TRANSLATION
 sov_liberals.4.a: "Přijímáme jejich nabídku" # todo: NEW TRANSLATION
 sov_liberals.4.b: "Není teď pravý čas" # todo: NEW TRANSLATION
 sov_liberals.5.t: "[FROM.GetNameWithFlag] souhlasí připojit se k naší alianci" # todo: NEW TRANSLATION
