 TT_SOV_russian_helicopters_carry_traits: "Všechny dokončené vlastnosti z §Yvrtulníků Mil§! budou převedeny na §YRussian Helicopters§!." # todo: NEW TRANSLATION
 SOV_Putting_out_the_fire_in_the_post-Soviet_space_accept_tt: "Každý člen, který přijme, se zavazuje k unii suverénních států a otevírá cestu k plné integraci s Ruskem." # todo: NEW TRANSLATION
 SOV_Sign_mutual_cooperation_agreements_accept_tt: "Každý stát, který přijme, souhlasí se zahájením vytváření unie suverénních států s Ruskem." # todo: NEW TRANSLATION
 SOV_membership_invite_accept_tt: "Pozvané národy souhlasí se sladěním s Ruskem a vstupem do Svobodné nezávislé aliance." # todo: NEW TRANSLATION
 SOV_peacekeeping_in_artsakh_accept_tt: "Arménie přijímá ruskou mírovou misi v Náhorním Karabachu, čímž posouvá návrh k Ázerbájdžánu." # todo: NEW TRANSLATION
 SOV_computing_sovereignty_chinese_substitution: "Čínská náhrada" # todo: NEW TRANSLATION
 SOV_computing_sovereignty_chinese_substitution_desc: "Čínští dodavatelé nahrazují západní vstupy v celém ruském výpočetním ekosystému. Nedostatky se zmírňují, ale závislost se pouze přesunula, nikoli zmizela." # todo: NEW TRANSLATION
 SOV_computing_sovereignty_mature_node_specialization: "Specializace na vyspělé výrobní uzly" # todo: NEW TRANSLATION
 SOV_computing_sovereignty_mature_node_specialization_desc: "Rusko se místo honby za špičkou soustředí na spolehlivou domácí výrobu ve vyspělých výrobních uzlech. Pokročilé procesory stále vyžadují zahraniční výrobní cestu." # todo: NEW TRANSLATION
 SOV_computing_sovereignty_parallel_import_economy: "Ekonomika paralelního dovozu" # todo: NEW TRANSLATION
 SOV_computing_sovereignty_parallel_import_economy_desc: "Neoficiální zásobovací trasy udržují zahraniční hardware dostupný za vyšší cenu a s menší předvídatelností. Nedostatek je řízen, nikoli vyřešen." # todo: NEW TRANSLATION
 SOV_computing_sovereignty_sovereign_computing_stack: "Suverénní výpočetní ekosystém" # todo: NEW TRANSLATION
 SOV_computing_sovereignty_sovereign_computing_stack_desc: "Domácí návrh procesorů, výroba, software a systémová integrace nyní tvoří soudržný národní ekosystém. Jeho udržování vyžaduje trvalé investice a odborné znalosti." # todo: NEW TRANSLATION
 sov_economic.300.a: "Podpořit architekturu Elbrus" # todo: NEW TRANSLATION
 sov_economic.300.b: "Stavět na osvědčené zahraniční architektuře" # todo: NEW TRANSLATION
 sov_economic.300.d: "Komerční procesorová řada založená na architektuře Elbrus společnosti MCST by mohla zachovat ruské konstrukční schopnosti mimo ekosystém x86. Přeměna tohoto příslibu v nasaditelný hardware bude vyžadovat trpělivou podporu, kompatibilní software a pokračující přístup k výrobě." # todo: NEW TRANSLATION
 sov_economic.300.t: "Elbrusový hazard" # todo: NEW TRANSLATION
 sov_economic.301.a: "Zaručit půjčku VEB" # todo: NEW TRANSLATION
 sov_economic.301.b: "Záruku neposkytnout, dokud se ekonomika nezlepší" # todo: NEW TRANSLATION
 sov_economic.301.d: "Angstrem-T navrhuje získat výrobní linku z bývalého závodu AMD v Drážďanech a instalovat ji v Zelenogradu. Projekt by mohl rozšířit domácí kapacitu, ale zadlužení, riziko instalace a zastarávající výrobní proces ohrožují jeho ekonomiku." # todo: NEW TRANSLATION
 sov_economic.301.t: "Projekt Angstrem-T" # todo: NEW TRANSLATION
 sov_economic.302.a: "Učinit nahrazování dovozu závazným napříč ministerstvy" # todo: NEW TRANSLATION
 sov_economic.302.b: "Tam, kde domácí vybavení nestačí, ponechat nákupy otevřené" # todo: NEW TRANSLATION
 sov_economic.302.d: "Sankce a strategické obavy proměnily nahrazování dovozu ze sloganu v doktrínu. Ministerstva nyní chtějí, aby procesory Elbrus, systémové čipy Bajkal a Astra Linux nahrazovaly zahraniční systémy, i když domácí alternativy zůstávají nákladné nebo nedostatečně vyspělé." # todo: NEW TRANSLATION
 sov_economic.302.t: "Doktrína nahrazování dovozu" # todo: NEW TRANSLATION
 sov_economic.303.a: "Připravit se na dlouhodobé embargo" # todo: NEW TRANSLATION
 sov_economic.303.d: "Koordinované kontroly vývozu nyní omezují ruský přístup k pokročilým polovodičům, automatizaci elektronického návrhu a výrobnímu vybavení a společnost TSMC zcela zastavila výrobu součástek Bajkal a Elbrus. Výpočetní sektor může embargo absorbovat a zaplatit nahrazování dovozu, nebo vybudovat sítě potřebné k jeho obcházení." # todo: NEW TRANSLATION
 sov_economic.303.t: "Technologické embargo" # todo: NEW TRANSLATION
 sov_economic.304.a: "Opřít se o výrobní uzly, které stále dokážeme vyrábět" # todo: NEW TRANSLATION
 sov_economic.304.b: "Obrátit se na čínskou slévárnu" # todo: NEW TRANSLATION
 sov_economic.304.c: "Financovat domácí výrobní linku" # todo: NEW TRANSLATION
 sov_economic.304.d: "TSMC již v rámci nového režimu kontroly vývozu nebude přijímat objednávky ruských procesorů. Produkty Elbrus vyráběné prostřednictvím TSMC nyní postrádají zavedenou výrobní cestu, čímž se šok v zásobování mění ve strategickou krizi." # todo: NEW TRANSLATION
 sov_economic.304.t: "Dveře TSMC se zavírají" # todo: NEW TRANSLATION
 sov_economic.305.a: "Přijmout čínské slévárny jako náhradu" # todo: NEW TRANSLATION
 sov_economic.305.e: "Ustoupit k vyspělým výrobním uzlům, které skutečně dokážeme vyrábět" # todo: NEW TRANSLATION
 sov_economic.305.d: "Roky investic a krizového řízení spojily řadu Elbrus společnosti MCST, Bajkal, zelenogradské továrny a domácí softwarové firmy do jediné národní strategie. Nyní dosažená rovnováha rozhodne, zda si Rusko udrží vlastní špičkovou technologii, bude žít s řízenou závislostí, nebo se spokojí s tím, co stále dokáže vyrábět." # todo: NEW TRANSLATION
 sov_economic.305.t: "Suverénní výpočetní ekosystém" # todo: NEW TRANSLATION
 sov_economic.303.b: "Vybudovat sítě k obcházení kontrol" # todo: NEW TRANSLATION
 sov_economic.305.b: "Formalizovat ekonomiku paralelního dovozu" # todo: NEW TRANSLATION
 sov_economic.305.c: "Prohlásit suverénní ekosystém za dokončený" # todo: NEW TRANSLATION
