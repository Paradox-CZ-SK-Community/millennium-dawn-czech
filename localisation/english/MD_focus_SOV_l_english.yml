 sov_liberals.6.a: "To je jejich volba." # todo: NEW TRANSLATION
 sov_liberals.6.b: "Nenecháme to být. Zakročíme silou!" # todo: CHANGED
 sov_liberals.7.t: "[FROM.GetNameWithFlag] nás zve do aliance" # todo: NEW TRANSLATION
 sov_liberals.7.d: "[FROM.GetNameWithFlag] nás zve, abychom se připojili k jejich Svobodné nezávislé alianci na obranu demokracie napříč postsovětským prostorem a dál. Připojení posílí naši obranu, ekonomiku a globální vliv. Odmítnutí hrozí izolací v konfliktu." # todo: NEW TRANSLATION
 sov_liberals.7.a: "Přijímáme" # todo: NEW TRANSLATION
 sov_liberals.7.b: "Teď nemůžeme" # todo: NEW TRANSLATION
 sov_liberals.8.t: "[FROM.GetNameWithFlag] nás zve do aliance" # todo: NEW TRANSLATION
 sov_liberals.8.d: "[FROM.GetNameWithFlag] nás zve, abychom se připojili k jejich Svobodné nezávislé alianci, jejímž cílem je chránit demokracii v bývalém Sovětském svazu i mimo něj. Společně můžeme posílit obranu, rozvíjet ekonomiku a rozšířit vliv. Odmítnutí riskuje ztrátu spojenců v konfliktu." # todo: NEW TRANSLATION
