 SOV_expand_conscription_desc: "Naše ekonomika je zastaralá. Náš lid je dost chytrý na to, aby používal počítače ku prospěchu Ruska. Naši vědci, dělníci ve fabrikách a zaměstnanci vojensko-průmyslového komplexu musí obsluhovat nejsilnější a nejefektivnější elektronické počítače pro zlepšení naší ekonomiky!" # todo: NEW TRANSLATION
