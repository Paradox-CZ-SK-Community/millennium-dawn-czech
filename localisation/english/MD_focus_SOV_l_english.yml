 SOV_rosgvardia: "Vytvořit Rosgvardii" # todo: NEW TRANSLATION
 SOV_rosgvardia_desc: "\n\n\n\n\n\n£SOV_desctext_rosguard \n\n\n\n\n\n\n\n\nNárodní garda Ruska je nezávislá vnitřní vojenská síla pověřená ochranou hranic, bojem proti terorismu, kontrolou zbraní a udržováním veřejného pořádku." # todo: CHANGED
