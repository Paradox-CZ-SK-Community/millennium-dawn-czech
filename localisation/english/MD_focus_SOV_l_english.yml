 sov_dissolution.1.t: "Rostoucí regionalismus" # todo: NEW TRANSLATION
 sov_dissolution.1.d: "S poslední válkou, která se zhoršila, více státních aktérů začíná prosazovat svou nezávislost. Je jen otázkou času, než se situace vymkne kontrole a povede k rozsáhlé nestabilitě." # todo: NEW TRANSLATION
 sov_dissolution.1.a: "Nemožné" # todo: NEW TRANSLATION
 sov_dissolution.2.t: "Část Ruska znovu integrována" # todo: NEW TRANSLATION
 sov_dissolution.2.d: "Po dlouhých jednáních se další region vlasti vrátil pod svou pravou vlajku. To je významný krok k sjednocení a národní stabilitě." # todo: NEW TRANSLATION
 sov_dissolution.2.a: "O krok blíže" # todo: NEW TRANSLATION
 sov_dissolution.3.t: "Rusko žádá o propuštění loutky" # todo: NEW TRANSLATION
 sov_dissolution.3.d: "Ruská vláda se obrátila v naději vyjednat plnou nezávislost jednoho ze svých bývalých území. Tento krok může změnit rovnováhu sil v regionu." # todo: NEW TRANSLATION
 sov_dissolution.3.a: "Monetární investice by mohly pomoci" # todo: NEW TRANSLATION
 sov_dissolution.3.b: "Můžeme koupit jejich státní aktiva" # todo: NEW TRANSLATION
 sov_dissolution.3.c: "Mimo otázku" # todo: NEW TRANSLATION
 sov_dissolution.4.t: "[FROM.GetName] žádá o peněžní kompenzaci" # todo: NEW TRANSLATION
 sov_dissolution.4.d: "Po jednáních s [FROM.GetNamewithFlag] ohledně možného propuštění částí jejich země navrhli peněžní kompenzaci výměnou za tento ústupek. Takové požadavky komplikují proces vyjednávání." # todo: NEW TRANSLATION
 sov_dissolution.4.a: "Malá cena k zaplacení" # todo: NEW TRANSLATION
 sov_dissolution.4.b: "Není možné" # todo: NEW TRANSLATION
 sov_dissolution.5.t: "[FROM.GetName] žádá o převod státních aktiv" # todo: NEW TRANSLATION
 sov_dissolution.5.d: "V diskuzích o propuštění určitých regionů požádal [FROM.GetNamewithFlag] o převod státních aktiv jako kompenzaci. Tento požadavek bude vyžadovat pečlivé zvážení před dalším postupem." # todo: NEW TRANSLATION
 sov_dissolution.5.a: "Malá cena k zaplacení" # todo: NEW TRANSLATION
 sov_dissolution.5.b: "Není možné" # todo: NEW TRANSLATION
 sov_dissolution.6.t: "[FROM.GetName] odmítá možné jednání" # todo: NEW TRANSLATION
 sov_dissolution.6.d: "Navzdory snahám o dohodu [FROM.GetNamewithFlag] úplně odmítl všechny návrhy na propuštění částí své půdy. Situace zůstává napjatá a nestabilní, s malou nadějí na okamžité řešení." # todo: NEW TRANSLATION
 sov_dissolution.6.a: "Arogantní hlupáci!" # todo: NEW TRANSLATION
 sov_dissolution.7.t: "[SOV.GetName] souhlasí s našimi podmínkami" # todo: NEW TRANSLATION
 sov_dissolution.7.d: "[SOV.GetName] přijal naše rozumné požadavky na kompenzaci za propuštění našeho přidruženého státu. Tato dohoda nás přibližuje k sjednocení a míru." # todo: NEW TRANSLATION
 sov_dissolution.7.a: "Jen byznys" # todo: NEW TRANSLATION
 sov_dissolution.8.t: "[SOV.GetName] odmítá naše podmínky" # todo: NEW TRANSLATION
 sov_dissolution.8.d: "[SOV.GetName] odmítl zvážit naše rozumné požadavky na kompenzaci za propuštění našeho přidruženého státu. Toto odmítnutí může zpozdit pokrok a zvýšit napětí." # todo: NEW TRANSLATION
 sov_dissolution.8.a: "Jejich ztráta" # todo: NEW TRANSLATION
 sov_dissolution.10.t: "Politické zmatky během jednání" # todo: NEW TRANSLATION
 sov_dissolution.10.d: "Během jednání o možném reintegraci s Ruskem vypluly na povrch citlivé otázky, které efektivně zablokovaly vyjednávání. Politické klima zůstává nejisté a křehké." # todo: NEW TRANSLATION
 sov_dissolution.10.a: "Využijme některé nástroje, které máme k dispozici" # todo: NEW TRANSLATION
 sov_dissolution.10.b: "Musíme to tentokrát vynechat" # todo: NEW TRANSLATION
 sov_dissolution.11.t: "Nedostatek prostředků na jednání" # todo: NEW TRANSLATION
 sov_dissolution.11.d: "Při jednáních o reintegraci byla navržena finanční kompenzace na pokrytí administrativních nákladů spojených se státním převodem. Nedostatek financí však hrozí zastavit pokrok a vyžaduje pečlivé rozpočtování." # todo: NEW TRANSLATION
 sov_dissolution.11.a: "Součást procesu" # todo: NEW TRANSLATION
 sov_dissolution.11.b: "Není peněz – ale vydržte!" # todo: NEW TRANSLATION
 sov_dissolution.12.t: "Nekompatibilní státní aktiva" # todo: NEW TRANSLATION
 sov_dissolution.12.d: "Ukázalo se, že některá státní aktiva by během reintegračních jednání mohla zkrachovat. Musíme přijmout rozhodná opatření k vyřešení těchto problémů a posunout jednání vpřed." # todo: NEW TRANSLATION
 sov_dissolution.12.a: "Prodat to nyní." # todo: NEW TRANSLATION
 sov_dissolution.12.b: "Potřebujeme ta aktiva" # todo: NEW TRANSLATION
