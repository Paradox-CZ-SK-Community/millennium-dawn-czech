 SOV_rocket_forces_idea: "Strategické raketové síly" # todo: NEW TRANSLATION
 SOV_outdated_army_idea: "£text_icon_sov_army Zastaralá armáda" # todo: NEW TRANSLATION
 SOV_outdated_army_idea_desc: "Ruská armáda je stínem svého někdejšího já, trpí nedostatkem moderního vybavení i peněz na výcvik branců, které stále povolává.\n§W--------------§!\nTento národní duch bude §Gzmírněn§! zaměřením §HDokončit vojenské reformy z roku 1998§! a znovu zaměřeními §HZahájit vojenské reformy§! a §HPokračovat ve vojenských reformách§!. Zcela jej §Rodstraní§! zaměření §HSystém výcviku záložních důstojníků§!." # todo: CHANGED
 SOV_outdated_army_idea_1: "£text_icon_sov_army Zastaralá armáda" # todo: NEW TRANSLATION
 SOV_outdated_army_idea_1_desc: "Nejhorší část kolapsu z roku 1998 je za námi, ale armáda stále bojuje se sovětskými zásobami a odvody, které nedokáže řádně vycvičit.\n§W--------------§!\nTento národní duch bude §Gzmírněn§! zaměřením §HZahájit vojenské reformy§! a znovu zaměřením §HPokračovat ve vojenských reformách§!. Zcela jej §Rodstraní§! zaměření §HSystém výcviku záložních důstojníků§!." # todo: CHANGED
 SOV_outdated_army_idea_2: "£text_icon_sov_army Zastaralá armáda" # todo: NEW TRANSLATION
 SOV_outdated_army_idea_2_desc: "Reformy Nového vzhledu rozložily zděděnou divizní strukturu na brigády stálé pohotovosti, vybavení za nimi se však z velké části nezměnilo.\n§W--------------§!\nTento národní duch bude §Gzmírněn§! zaměřením §HPokračovat ve vojenských reformách§! a zcela jej §Rodstraní§! zaměření §HSystém výcviku záložních důstojníků§!." # todo: CHANGED
 SOV_outdated_army_idea_3: "£text_icon_sov_army Zastaralá armáda" # todo: NEW TRANSLATION
 SOV_outdated_army_idea_3_desc: "Zůstává důstojnický sbor vycvičený pro válku, která již neexistuje, a systém záloh, který vytváří spíše počty než vojáky.\n§W--------------§!\nTento národní duch bude §Rodstraněn§! zaměřením §HSystém výcviku záložních důstojníků§!." # todo: CHANGED
 SOV_russian_airforce_idea_1: "£text_icon_sov_army Ruské letectvo" # todo: NEW TRANSLATION
 SOV_russian_airforce_idea_1_desc: "Letectvo provozuje flotilu, kterou nedokáže zásobovat palivem, a cvičí piloty, jejichž udržovací výcvik si nemůže dovolit. Počet nehod roste a bojeschopnost je pouze formální.\n§W--------------§!\nTento národní duch bude o jeden stupeň §Gzmírněn§! každým ze zaměření §HReorganizovat letectvo§!, §HReformy ve strukturách§! a §HVytvořit UAC§!, v libovolném pořadí. Zcela jej §Rodstraní§! zaměření §HRuské letecké a kosmické síly§!." # todo: CHANGED
 SOV_russian_airforce_idea_2: "£text_icon_sov_army Ruské letectvo" # todo: NEW TRANSLATION
 SOV_russian_airforce_idea_2_desc: "Letové hodiny se obnovují a nejhorší část zpoždění s draky byla odstraněna, výcvik posádek však stále výrazně zaostává za možnostmi letounů.\n§W--------------§!\nTento národní duch bude o jeden stupeň §Gzmírněn§! každým ze zbývajících zaměření §HReorganizovat letectvo§!, §HReformy ve strukturách§! nebo §HVytvořit UAC§!. Zcela jej §Rodstraní§! zaměření §HRuské letecké a kosmické síly§!." # todo: CHANGED
 SOV_russian_airforce_idea_3: "£text_icon_sov_army Ruské letectvo" # todo: NEW TRANSLATION
 SOV_russian_airforce_idea_3_desc: "Soustředění konstrukce a výroby pod jedinou korporaci stabilizovalo flotilu, výcvikový proces však stále zaostává za silou, kterou musí zásobovat.\n§W--------------§!\nTento národní duch bude o jeden stupeň §Gzmírněn§! posledním zbývajícím zaměřením §HReorganizovat letectvo§!, §HReformy ve strukturách§! nebo §HVytvořit UAC§!. Zcela jej §Rodstraní§! zaměření §HRuské letecké a kosmické síly§!." # todo: CHANGED
 SOV_russian_airforce_idea_4: "£text_icon_sov_army Ruské letectvo" # todo: NEW TRANSLATION
 SOV_russian_airforce_idea_4_desc: "Ze staré nevolnosti zbývá jen málo, kromě tempa výcviku, které dosud nedohnalo zbytek sil.\n§W--------------§!\nTento národní duch bude §Rodstraněn§! zaměřením §HRuské letecké a kosmické síly§!." # todo: CHANGED
 SOV_the_plundered_russian_navy1: "Obrabané ruské námořnictvo" # todo: NEW TRANSLATION
 SOV_the_plundered_russian_navy1_desc: "Deset let neplacených posádek a rozebíraných trupů zanechalo většinu loďstva v přístavech. To, co ještě pluje, tak činí díky vypůjčeným dílům a zkráceným patrolám.\n§W--------------§!\nTento národní duch bude zaměřením §HReformy ruského námořnictva§! §Gzmírněn§! na §HČástečně obnovené loďstvo§!." # todo: NEW TRANSLATION
 SOV_the_plundered_russian_navy2: "Částečně obnovená flotila" # todo: NEW TRANSLATION
 SOV_the_plundered_russian_navy2_desc: "Loděnice znovu pracují a nejhorší rez byla odstraněna, avšak loďstvo je stále vystavěno kolem trupů položených pro jiné námořnictvo.\n§W--------------§!\nTento národní duch bude zaměřením §HAktualizovaná námořní doktrína§! §Gzmírněn§! na §HTéměř obnovené loďstvo§!, které nejprve vyžaduje odstranění národního ducha §HZastaralá armáda§!." # todo: NEW TRANSLATION
 SOV_the_plundered_russian_navy3: "Téměř obnovená flotila" # todo: NEW TRANSLATION
 SOV_the_plundered_russian_navy3_desc: "Nyní existuje doktrína pro loďstvo, které si Rusko skutečně může dovolit. Zbývá už jen samotný modernizační program.\n§W--------------§!\nTento národní duch bude zaměřením §HZahájit modernizaci našeho loďstva§! §Rodstraněn§!." # todo: NEW TRANSLATION
 SOV_otkos_army_idea: "Odměna za vojenskou službu" # todo: NEW TRANSLATION
 SOV_otkos_army_idea_desc: "Branci, kteří si mohou dovolit zaplatit, neslouží. Úplatky udržují důstojnický sbor v klidu a Dumu spolupracující, ovšem za cenu odvodů, které armáda měla dostat.\n§W--------------§!\nTento národní duch bude §Rztracen§!, pokud se k moci dostanou §Y[Communist-State_L]§! nebo §Y[Neutral_Communism_L]§!." # todo: NEW TRANSLATION
 SOV_pmc_idea: "Ruské PMC" # todo: NEW TRANSLATION
 SOV_oligarch_supply_army_idea: "Finanční podpora od oligarchů" # todo: NEW TRANSLATION
 SOV_oligarch_supply_army_idea_desc: "Muži, kteří vlastní ruský průmysl, souhlasili s financováním jednotek rozmístěných poblíž jejich aktiv a hradí palivo, příděly i opravy, na něž rozpočet nestačí.\n§W--------------§!\nTento národní duch trvá pouze po dobu vlády §Y[Monarchist_L]§! nebo §Y[Nat_Populism_L]§! a je §Rztracen§! v okamžiku, kdy vládne kdokoli jiný." # todo: NEW TRANSLATION
 SOV_leib_guard_idea: "Císařská garda" # todo: NEW TRANSLATION
 SOV_leib_guard_idea_desc: "Historické gardové pluky byly znovu vytvořeny jako panovníkova ochranka, která do jediné formace přivádí nejlepší příslušníky speciálních sil a zodpovídá se trůnu.\n§W--------------§!\nTento národní duch bude §Rztracen§!, pokud se k moci dostanou §Y[Communist-State_L]§! nebo §Y[Neutral_Communism_L]§!." # todo: NEW TRANSLATION
 SOV_storm_z_idea: "Storm-Z" # todo: NEW TRANSLATION
 SOV_volunteer_assault_coprs_idea: "Dobrovolnický útočný sbor" # todo: NEW TRANSLATION
