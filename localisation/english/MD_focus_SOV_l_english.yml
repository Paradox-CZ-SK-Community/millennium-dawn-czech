 SOV_nazbol_inner_modifier: "Vnitřní politika [SOV.GetNamewithFlag]" # todo: NEW TRANSLATION
 SOV_nazbol_inner_modifier_desc: "Politika národně bolševického Ruska je výsledkem revanšismu za dvě současně zničená impéria: SSSR a Ruské impérium. Žádná jednání, pouze válka." # todo: CHANGED
 SOV_navalny_inner_modifier: "Vnitřní politika Nové Ruska" # todo: NEW TRANSLATION
 SOV_navalny_inner_modifier_desc: "Politika pod vládou liberálů se vyznačuje důrazem na ekonomický růst Ruska a menším zaměřením na vojenské a politické akce." # todo: NEW TRANSLATION
 SOV_koba_politic_modifier: "Koncept veřejné bezpečnosti" # todo: NEW TRANSLATION
 SOV_koba_politic_modifier_desc: "Koncept veřejné bezpečnosti dává pochopení, proč jsme šťastní nebo ne, šťastní či nemocní, proč má někdo štěstí a někdo ne, a jak na to působit. To jsou odpovědi na otázky: co je dobré a co je špatné, co je hanba a svědomí, co je intuice a proč někteří ji poslouchají, jiní ne, a je opravdu obtížné změnit osud?" # todo: NEW TRANSLATION
