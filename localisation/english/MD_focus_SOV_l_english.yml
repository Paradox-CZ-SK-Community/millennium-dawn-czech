 russia_news.13.o5: "Další válka na troskách Ruského impéria." # todo: NEW TRANSLATION
 sov_final_strike.2.t: "Armáda nedosáhla hlavních cílů" # todo: NEW TRANSLATION
 sov_final_strike.2.d: "Probíhající operace selhala v dosažení svých cílů, z velké části kvůli široce rozšířené korupci v našich obranných silách. Toto selhání odhaluje skutečný stav našich vojenských schopností." # todo: NEW TRANSLATION
 sov_final_strike.2.a: "Připravte se na dlouhou válku." # todo: NEW TRANSLATION
 SOV_slow_advance_idea: "Nepřipravená armáda" # todo: NEW TRANSLATION
 sov_final_strike.3.t: "Armáda dosáhla hlavních cílů" # todo: NEW TRANSLATION
 sov_final_strike.3.d: "Probíhající operace postupuje dobře a dokazuje vysokou kvalitu naší armády díky nedávným reformám a úspěšné protikorupční kampani." # todo: NEW TRANSLATION
 sov_final_strike.3.a: "Výborně." # todo: NEW TRANSLATION
 sov_final_strike.4.t: "Sankce proti Rusku" # todo: NEW TRANSLATION
 sov_final_strike.4.d: "Konflikt na Ukrajině musí skončit. Můžeme se pokusit Rusko zdecimovat ekonomickými sankcemi, ale to může poškodit i naši vlastní ekonomiku. Měli bychom se připravit na plnohodnotnou válku sankcí?" # todo: NEW TRANSLATION
 sov_final_strike.4.a: "Uvalit průmyslové sankce." # todo: NEW TRANSLATION
 sov_final_strike.4.b: "Nebudeme se toho účastnit." # todo: CHANGED
 sov_final_strike.5.t: "[FROM.GetName] nám uvaluje sankce!" # todo: NEW TRANSLATION
 sov_final_strike.5.d: "[FROM.GetName] na nás uvalil sankce na podporu Ukrajiny. Tato opatření mohou vážně poškodit naši ekonomiku." # todo: NEW TRANSLATION
 sov_final_strike.5.a: "Prokletí je." # todo: NEW TRANSLATION
 sov_final_strike.6.t: "Rusko nám nabízí účast na Speciální vojenské operaci na Ukrajině!" # todo: NEW TRANSLATION
 sov_final_strike.6.d: "Během osobního setkání nás ruský prezident pozval, abychom se připojili k speciální vojenské operaci na Ukrajině. Musíme tuto nabídku pečlivě zvážit, protože vstup do války bude mít dlouhodobé důsledky." # todo: NEW TRANSLATION
 sov_final_strike.6.a: "Pomůžeme našim bratrům!" # todo: NEW TRANSLATION
 sov_final_strike.6.b: "Myslím, že bychom se do toho neměli zapojovat." # todo: NEW TRANSLATION
 sov_final_strike.7.t: "Finanční kolaps po sankcích" # todo: NEW TRANSLATION
 sov_final_strike.7.d: "Západní sankce vyvolaly mezi naší populací těžkou finanční paniku, způsobily nebezpečnou nerovnováhu v nabídce a poptávce po rublu. Kolaps našeho Národního fondu blahobytu, který mohl tuto krizi zmírnit, situaci zhoršil. Nyní čelíme hrozícímu finančnímu kolapsu." # todo: NEW TRANSLATION
 sov_final_strike.7.a: "Kéž nám Bůh pomůže..." # todo: NEW TRANSLATION
 SOV_western_sanctions_modifier: "Západní sankce" # todo: NEW TRANSLATION
 SOV_western_sanctions_modifier_desc: "Naše agresivní kroky vedly západní země a jejich spojence k uvalení tvrdých sankcí proti nám. Je to vážné varování a musíme se připravit na větší hrozby z jejich strany." # todo: NEW TRANSLATION
 SOV_ruble_collapse: "Finanční kolaps" # todo: NEW TRANSLATION
