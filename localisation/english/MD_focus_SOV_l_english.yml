 SOV_Civil_nationalism: "Občanský nacionalismus" # todo: NEW TRANSLATION
 SOV_Civil_nationalism_desc: "Národ musí být na prvním místě. Upřednostníme národní zájmy nade vše a sjednotíme společnost kolem sdílené identity a společného cíle." # todo: NEW TRANSLATION
 SOV_embrace_the_legacy_of_the_USSR: "Přijmout odkaz SSSR" # todo: NEW TRANSLATION
 SOV_embrace_the_legacy_of_the_USSR_desc: "Odkaz Sovětského svazu nadále formuje naši politiku a kulturu. Jeho úspěchy zůstávají základem naší národní identity a ambicí." # todo: NEW TRANSLATION
 SOV_Introduce_visa_regime_with_Central_Asia: "Vízový režim se Střední Asií" # todo: NEW TRANSLATION
 SOV_Introduce_visa_regime_with_Central_Asia_desc: "Abychom lépe spravovali hranice a řešili ekonomické a sociální obavy, zavedeme vízový režim se Střední Asií. Toto opatření má snížit nelegální migraci a ochránit národní stabilitu." # todo: NEW TRANSLATION
 SOV_Utilize_the_country_economic_potential_100_percent: "Maximalizovat ekonomický potenciál" # todo: NEW TRANSLATION
 SOV_Utilize_the_country_economic_potential_100_percent_desc: "Plně odemkneme ekonomický potenciál země. Každý zdroj a příležitost musí být využit k podpoře růstu a prosperity." # todo: NEW TRANSLATION
 SOV_Cooperation_with_Taiwan: "Spolupráce s Taiwanem" # todo: NEW TRANSLATION
 SOV_Cooperation_with_Taiwan_desc: "Strategická spolupráce s Taiwanem nám zajistí přístup k pokročilým technologiím a značným ekonomickým výhodám. Toto partnerství může urychlit náš rozvoj." # todo: NEW TRANSLATION
 SOV_Buy_out_Taiwans_microchip_technology: "Získat tchajwanskou technologii mikročipů" # todo: NEW TRANSLATION
 SOV_Buy_out_Taiwans_microchip_technology_desc: "Zajistili jsme dohodu o koupi technologie výroby mikroprocesorů z Taiwanu. Tento nákup poslouží jako základ našeho technologického a ekonomického skoku." # todo: NEW TRANSLATION
 SOV_Promote_Russian_companies_in_the_post-Soviet_space: "Podpora ruských společností v postsovětském prostoru" # todo: NEW TRANSLATION
 SOV_Promote_Russian_companies_in_the_post-Soviet_space_desc: "Agresivně podpoříme ruské firmy expandující do postsovětského regionu. Naším cílem je získat dominantní postavení na těchto trzích." # todo: NEW TRANSLATION
 SOV_Monopoly_in_the_post-Soviet_space: "Monopol v postsovětském prostoru" # todo: NEW TRANSLATION
 SOV_Monopoly_in_the_post-Soviet_space_desc: "Ruské podniky by měly dosáhnout tržní dominance v postsovětském regionu. Strategickými investicemi a politickým vlivem to učiníme skutečností." # todo: NEW TRANSLATION
 SOV_Economic_Empire: "Ekonomické impérium" # todo: NEW TRANSLATION
 SOV_Economic_Empire_desc: "Silné Rusko nepotřebuje válku, aby si prosadilo vliv. Prostřednictvím ekonomické moci a vlivu si zajistíme místo světového lídra." # todo: NEW TRANSLATION
 SOV_Make_the_Anti-Corruption_Foundation_a_State_Company: "Anti-korupční nadace" # todo: NEW TRANSLATION
 SOV_Make_the_Anti-Corruption_Foundation_a_State_Company_desc: "Abychom institucionalizovali boj s korupcí, Anti-korupční nadace se stane státní organizací s plnou podporou vlády." # todo: NEW TRANSLATION
 SOV_Demonopolization_of_the_strategic_economy: "Demonopolizace strategické ekonomiky" # todo: NEW TRANSLATION
 SOV_Demonopolization_of_the_strategic_economy_desc: "Rozbijeme monopoly v strategických sektorech ekonomiky, abychom zlepšili transparentnost, konkurenci a efektivitu." # todo: NEW TRANSLATION
 SOV_Unite_the_network_of_state-owned_companies: "Sjednotit státní podniky" # todo: NEW TRANSLATION
 SOV_Unite_the_network_of_state-owned_companies_desc: "Konsolidujeme naše státní podniky do soudržné a efektivní sítě, sladěné s národními zájmy a schopné řídit dlouhodobý růst." # todo: NEW TRANSLATION
 SOV_Increase_salaries_and_pensions_for_the_military_and_the_population: "Zvýšit platy a důchody" # todo: NEW TRANSLATION
 SOV_Increase_salaries_and_pensions_for_the_military_and_the_population_desc: "Něco jsme slíbili a svůj slib dodržíme. Platy a důchody vojáků i civilního obyvatelstva výrazně zvýšíme." # todo: CHANGED
 SOV_Measures_of_rapprochement_with_the_West: "Přiblížení k Západu" # todo: NEW TRANSLATION
 SOV_Measures_of_rapprochement_with_the_West_desc: "Západ by měl být vnímán ne jako hrozba, ale jako partner. Prostřednictvím spolupráce a dialogu znovu vybudujeme důvěru a předefinujeme naše vztahy." # todo: NEW TRANSLATION
 SOV_The_way_of_free_russia: "Cesta svobodného Ruska" # todo: NEW TRANSLATION
 SOV_The_way_of_free_russia_desc: "Svobodné Rusko je silné Rusko. Budeme usilovat o svobodu, demokracii a národní hrdost jako základ lepší budoucnosti." # todo: NEW TRANSLATION
 SOV_eu_state: "Skutečný západní stát" # todo: NEW TRANSLATION
 SOV_new_pensions_reform: "Nová důchodová reforma" # todo: NEW TRANSLATION
 SOV_demonopolisation_reform: "Demonopolizační reforma strategického průmyslu" # todo: NEW TRANSLATION
 russian_legacy_empire: "£text_icon_sov_empire Impériální odkaz" # todo: NEW TRANSLATION
 russian_legacy_empire_desc: "Rusko vždy stálo jako velké impérium a tento odkaz neodhodíme ve jménu pomíjivých demokratických iluzí." # todo: NEW TRANSLATION
 russian_legacy_democratic: "£text_icon_sov_democratic Demokratický odkaz" # todo: NEW TRANSLATION
 russian_legacy_democratic_desc: "I když Rusko prožilo dlouhá období autokracie, znalo i okamžiky demokratické naděje. Budeme tento odkaz svobody uchovat a rozšířit." # todo: NEW TRANSLATION
 russian_legacy: "£text_icon_sov_empire Ruský odkaz" # todo: NEW TRANSLATION
 russian_legacy_desc: "Po staletí Rusko kráčelo svou vlastní cestou, často osamělé a pod silnou vládou. Změna přichází pomalu, ale čas může být zralý pro transformaci." # todo: NEW TRANSLATION
 SOV_idea_restalinization: "Restalinizace" # todo: NEW TRANSLATION
 SOV_idea_restalinization_desc: "Rusko se odklonilo od správné cesty. Abychom znovu získali sílu a nezávislost, musíme se vrátit k metodám a vizi Stalina." # todo: NEW TRANSLATION
 SOV_fbk_organization_category: "Kancelář Anti-korupční nadace" # todo: NEW TRANSLATION
 SOV_fbk_organization_category_desc: "Roky autokracie prolnuly náš stát korupcí. Anti-korupční nadace se zavázala ji vykor" # todo: NEW TRANSLATION
 SOV_democracy_taiwam_category: "Ruská demokracie na Tchaj-wanu" # todo: NEW TRANSLATION
 SOV_democracy_taiwam_category_desc: "Tchaj-wan zůstává trnem v oku Číny. Jak se naše rivalita s Čínou zintenzivňuje, získání vlivu nad Tchaj-wanem se stalo jednou z našich strategických priorit." # todo: NEW TRANSLATION
