 sov_liberals.10.b: "Prozatím odmítáme" # todo: NEW TRANSLATION
 sov_liberals.11.t: "[FROM.GetNameWithFlag] nás zve do SNS" # todo: NEW TRANSLATION
 sov_liberals.11.d: "[FROM.GetNameWithFlag] opět zkouší oživit SNS a zve nás, abychom se znovu připojili. S demokratickým vedením by se SNS mohla stát skutečným svazem nezávislých států místo nástroje moskevského vlivu." # todo: NEW TRANSLATION
 sov_liberals.11.a: "Souhlasíme se znovupřipojením" # todo: NEW TRANSLATION
 sov_liberals.11.b: "Ne" # todo: NEW TRANSLATION
 sov_liberals.12.t: "[FROM.GetNameWithFlag] souhlasí připojit se k SNS" # todo: NEW TRANSLATION
 sov_liberals.12.d: "[FROM.GetNameWithFlag] přijal naše pozvání a připravuje se podepsat dohodu o připojení k SNS, což posílí naši pozici a ukáže, že projekt stále žije." # todo: NEW TRANSLATION
 sov_liberals.12.a: "Dobře" # todo: NEW TRANSLATION
 sov_liberals.13.t: "[FROM.GetNameWithFlag] odmítl připojit se k SNS" # todo: NEW TRANSLATION
 sov_liberals.13.d: "[FROM.GetNameWithFlag] odmítl naši nabídku, což ukazuje malý zájem o spolupráci v postsovětském prostoru." # todo: NEW TRANSLATION
 sov_liberals.13.a: "Nedobré" # todo: NEW TRANSLATION
 sov_liberals.14.t: "[FROM.GetNameWithFlag] navrhuje vytvoření konfederace SNS" # todo: NEW TRANSLATION
 sov_liberals.14.d: "[FROM.GetNameWithFlag] navrhuje rozšíření SNS do konfederace, částečně obnovující její podobu z 90. let. Ačkoli to přináší výhody, hrozí to ztrátou autonomie, protože Moskva by získala větší kontrolu." # todo: NEW TRANSLATION
 sov_liberals.14.a: "Souhlasíme" # todo: NEW TRANSLATION
 sov_liberals.14.b: "Ne" # todo: NEW TRANSLATION
 sov_liberals.15.t: "[FROM.GetNameWithFlag] se stal členem konfederace SNS" # todo: NEW TRANSLATION
 sov_liberals.15.d: "[FROM.GetNameWithFlag] podepsal připojení ke konfederaci SNS s námi, což nás přibližuje k téměř sjednocenému státu a dělá kolaps 90. let vzdálenou vzpomínkou." # todo: NEW TRANSLATION
 sov_liberals.15.a: "Dobře" # todo: NEW TRANSLATION
 sov_liberals.16.t: "[FROM.GetNameWithFlag] odmítl stát se členem konfederace SNS" # todo: NEW TRANSLATION
 sov_liberals.16.d: "[FROM.GetNameWithFlag] odmítl dohodu o konfederaci SNS a rozzuřen ztrátou suverenity okamžitě vystoupil ze SNS." # todo: NEW TRANSLATION
 sov_liberals.16.a: "Nedobré" # todo: NEW TRANSLATION
 sov_liberals.17.t: "[FROM.GetNameWithFlag] navrhuje vytvoření ozbrojených sil SNS" # todo: NEW TRANSLATION
 sov_liberals.17.d: "[FROM.GetNameWithFlag] chce obnovit ozbrojené síly SNS pro lepší koordinaci mezi členskými státy. To by zvýšilo vojenskou sílu, ale i ruský vliv." # todo: NEW TRANSLATION
 sov_liberals.17.a: "Souhlasíme" # todo: NEW TRANSLATION
 sov_liberals.17.b: "Ne" # todo: NEW TRANSLATION
 sov_liberals.18.t: "[FROM.GetNameWithFlag] souhlasí účastnit se ozbrojených sil SNS" # todo: NEW TRANSLATION
 sov_liberals.18.d: "[FROM.GetNameWithFlag] souhlasil s připojením k ozbrojeným silám SNS, což výrazně posílí vojenskou sílu svazu." # todo: NEW TRANSLATION
 sov_liberals.18.a: "Dobře" # todo: NEW TRANSLATION
 sov_liberals.19.t: "[FROM.GetNameWithFlag] odmítl účast v ozbrojených silách SNS" # todo: NEW TRANSLATION
 sov_liberals.19.d: "[FROM.GetNameWithFlag] odmítl připojit se k obnově ozbrojených sil SNS, považuje své současné členství za dostačující." # todo: NEW TRANSLATION
 sov_liberals.19.a: "Nedobré" # todo: NEW TRANSLATION
 sov_liberals.21.t: "[FROM.GetNameWithFlag] opouští SNS" # todo: NEW TRANSLATION
 sov_liberals.21.d: "[FROM.GetNameWithFlag] nesouhlasí s novou vládou Ruska a politikou, podepsal dekret o vystoupení ze SNS a jejích struktur." # todo: NEW TRANSLATION
 sov_liberals.21.a: "Nedobré" # todo: NEW TRANSLATION
 sov_liberals.22.t: "[FROM.GetNameWithFlag] nabízí investice do Kaliningradu" # todo: NEW TRANSLATION
 sov_liberals.22.d: "[FROM.GetNameWithFlag] změnil politiku vůči Kaliningradu, otevírá ho zahraničním investicím a navrhuje spolupráci." # todo: NEW TRANSLATION
 sov_liberals.22.a: "Souhlasíme" # todo: NEW TRANSLATION
 sov_liberals.22.b: "Ne" # todo: NEW TRANSLATION
 sov_liberals.23.t: "[FROM.GetNameWithFlag] souhlasí s investicí v Kaliningradské oblasti" # todo: CHANGED
 sov_liberals.23.d: "[FROM.GetNameWithFlag] přijal naši investiční nabídku a připravuje uzavření dohody." # todo: NEW TRANSLATION
 sov_liberals.23.a: "Výborně" # todo: NEW TRANSLATION
 sov_liberals.24.t: "[FROM.GetNameWithFlag] odmítá investovat v Kaliningradské oblasti" # todo: CHANGED
 sov_liberals.24.d: "[FROM.GetNameWithFlag] odmítl naši nabídku, zřejmě nevidí pro sebe přínos." # todo: NEW TRANSLATION
 sov_liberals.24.a: "Nedobré" # todo: NEW TRANSLATION
 sov_liberals.25.t: "Výsledky investic v Kaliningradské oblasti" # todo: NEW TRANSLATION
 sov_liberals.25.d: "Oslovili jsme několik evropských zemí s investičními návrhy pro Kaliningrad a výsledky jsou slibné." # todo: NEW TRANSLATION
 sov_liberals.25.a: "Dobře" # todo: NEW TRANSLATION
 sov_liberals.26.t: "Rozvoj Dálného východu: druhá etapa" # todo: CHANGED
 sov_liberals.26.d: "Náš program rozvoje Dálného východu pokračuje oznámením další fáze financování růstu regionu." # todo: CHANGED
 sov_liberals.26.a: "Dobře" # todo: NEW TRANSLATION
 sov_liberals.27.t: "Osud Gruzie" # todo: NEW TRANSLATION
 sov_liberals.27.d: "Gruzie zůstává výzvou na Kavkaze. Musíme se rozhodnout, jak řídit naše vztahy s touto zemí." # todo: NEW TRANSLATION
 sov_liberals.27.a: "Pochod na Tbilisi" # todo: NEW TRANSLATION
 sov_liberals.27.b: "Upřednostňujeme mírové vztahy" # todo: NEW TRANSLATION
 sov_liberals.28.t: "Operace „Sladké dary“ byla úspěšně dokončena" # todo: NEW TRANSLATION
 sov_liberals.28.d: "Odhalili jsme a rozvrátili největší korupční síť v zemi, zatkli top oligarchy a poslance. Naším hlavním úkolem nyní je udržet tento nový pořádek." # todo: NEW TRANSLATION
 sov_liberals.28.a: "Protikorupční nadace splnila svou misi" # todo: NEW TRANSLATION
 sov_liberals.29.t: "Boris Němcov je zavražděn!" # todo: NEW TRANSLATION
 sov_liberals.29.d: "Boris Němcov byl zavražděn 27. února 2015 blízko Bolšogo Moskvoreckého mostu v Moskvě, když šel s ukrajinskou modelkou Annou Durickajou. Útočníci znali jeho trasu a vystřelili ze zálohy šest ran, zasahujících životně důležité orgány. Vrazi utekli v bílém autě. Několik podezřelých bylo odsouzeno na 11 až 20 let. Strůjce zůstává neznámý." # todo: NEW TRANSLATION
 sov_liberals.29.a: "Pozorováno" # todo: NEW TRANSLATION
 sov_liberals.30.t: "Jelcinovo dědictví" # todo: NEW TRANSLATION
 sov_liberals.30.d: "Po rozpadu SSSR Boris Jelcin, problematický vůdce, předsedal obtížným časům: rozpuštění Nejvyšší rady, čečenské války, ekonomické krize a neúspěšné reformy. Rusko později hledalo stabilitu pod novým vůdcem, který slíbil pořádek a růst. Politický systém se transformoval, konsolidoval národ po zmatku. Budoucnost zůstává nejistá." # todo: NEW TRANSLATION
 sov_liberals.30.a: "Dávejme pozor." # todo: NEW TRANSLATION
 sov_liberals.31.t: "Jelcinova smrt" # todo: NEW TRANSLATION
 sov_liberals.31.d: "RIA oznámila, že Boris Jelcin, první prezident nezávislého Ruska, zemřel po dlouhém boji se srdeční chorobou. Na univerzitě pojmenované po něm byla vyhlášena minuta ticha a mnoho západních vůdců poslalo kondolence." # todo: NEW TRANSLATION
 sov_liberals.31.a: "Odpočívej v pokoji, bojovníku za svobodu." # todo: NEW TRANSLATION
 sov_liberals.31.b: "Odpočívej v pokoji." # todo: NEW TRANSLATION
 sov_liberals_news.1.t: "Velké ruské demokratické referendum" # todo: NEW TRANSLATION
 sov_liberals_news.1.d: "Uskutečnilo se přelomové referendum o územní budoucnosti Ruska. Vnitřní hranice se dramaticky změnily a mnohé šokovalo, že obyčejní občané dostali možnost rozhodnout o osudu země." # todo: CHANGED
 sov_liberals_news.1.a: "Je to skutečná demokracie?" # todo: NEW TRANSLATION
 SOV_great_democratic_referendum_tt: "Výsledky §YReferenda§! závisí na stavu £text_icon_sov_empire §YDědictví Ruska§!. Čím více £text_icon_sov_empire §YDědictví Ruska§! inklinuje k £text_icon_sov_democratic §2demokracii§!, tím větší je šance na změnu územní struktury země v důsledku §Yreferenda§!." # todo: NEW TRANSLATION
 SOV_system_democratic_referendum_tt: "Zvolený §Ypolitický systém§! ovlivní výsledky nadcházejícího §Yreferenda§!." # todo: NEW TRANSLATION
 SOV_from_center_TT: "Odemýká rozhodnutí §YZ centra do regionů!§!" # todo: NEW TRANSLATION
 SOV_FSS_TT: "§YFSS bude transformováno na Federální kontrarozvědku§!" # todo: NEW TRANSLATION
 SOV_subjects_exist_tt: "§YRusko§! má alespoň jeden subjekt." # todo: NEW TRANSLATION
 SOV_subjects_federalization_buff_tt: "Národní duch §YSkutečný federalismus§! bude §Yzměněn§! a nyní bude §Yk dispozici§! jeho §Gvylepšená verze§!." # todo: CHANGED
 SOV_one_CIS_member_tt: "Alespoň §Yjedna jiná země§! je členem §2SNS§!" # todo: NEW TRANSLATION
 SOV_nazbols: "Rusko je vše. Zbytek je nic" # todo: NEW TRANSLATION
 SOV_nazbols_desc: "\n\n\n\n\n\n£SOV_desctext_nazbol \n\n\n\n\n\n\n\n\nNastal čas obnovit někdejší velikost Ruska. Jen my skutečně chápeme, co naše velká vlast potřebuje." # todo: CHANGED
 SOV_nazbols_new_russian_order: "Nový ruský řád" # todo: NEW TRANSLATION
 SOV_nazbols_new_russian_order_desc: "Pro Rusko nastává nový řád! Je čas ukončit roztříštěnost a vrátit národu jednotu." # todo: CHANGED
 SOV_nazbols_no_more_oligarch: "Vypořádat se s oligarchy" # todo: CHANGED
 SOV_nazbols_no_more_oligarch_desc: "Oligarchové musí přestat vykořisťovat Rusko. Při tom rozhodně zasáhneme a ukončíme jejich rabování!" # todo: NEW TRANSLATION
 SOV_nazbols_natiolalize: "Nacionalizace korporací" # todo: NEW TRANSLATION
 SOV_nazbols_natiolalize_desc: "Velké korporace jsou mrazivou připomínkou 90. let. Nacionalizujeme je k prospěchu země a jejích lidí." # todo: NEW TRANSLATION
 SOV_nazbols_west_nationalise: "Nacionalizace západních společností" # todo: NEW TRANSLATION
 SOV_nazbols_west_nationalise_desc: "Západní korporace, které v 90. letech vstoupily na naše území, musí odejít. Je čas získat zpět to, co nám patří." # todo: CHANGED
 SOV_nazbols_destroy_republic: "Zánik národních republik" # todo: NEW TRANSLATION
 SOV_nazbols_destroy_republic_desc: "Národní republiky nemají v Rusku místo. Neopakujeme chyby Sovětského svazu." # todo: NEW TRANSLATION
 SOV_nazbols_federalism: "Držet se idejí federalismu" # todo: CHANGED
 SOV_nazbols_federalism_desc: "Podporujeme pravý federalismus! Subjekty by měly být autonomní, ne jen regiony sloužící hlavnímu městu." # todo: NEW TRANSLATION
 SOV_nazbols_no_export: "Uzavřená ruská ekonomika" # todo: NEW TRANSLATION
 SOV_nazbols_no_export_desc: "Uzavřená ekonomika je silná ekonomika. Rusko si to může dovolit, protože má vše, co potřebuje." # todo: NEW TRANSLATION
 SOV_nazbols_cut_fsb: "Omezit rozpočet FSB" # todo: CHANGED
 SOV_nazbols_cut_fsb_desc: "Naše vláda přehnaně utrácí za tajné služby, které nadměrně špehují občany. Snížíme rozpočet FSB a omezíme tuto strukturu, protože jsme svobodná země!" # todo: NEW TRANSLATION
 SOV_nazbols_help_science: "Věda ve službách Ruska" # todo: NEW TRANSLATION
 SOV_nazbols_help_science_desc: "Věda pohání pokrok, a my tento motor plně podpoříme zvýšeným financováním." # todo: NEW TRANSLATION
 SOV_nazbols_hate_democracy: "Nenávist k liberalismu a komunismu" # todo: NEW TRANSLATION
 SOV_nazbols_hate_democracy_desc: "Liberalismus a komunismus vedly k úpadku našeho národa a ztrátě ruského ducha. Nedovolíme jim zničit naši zemi." # todo: NEW TRANSLATION
 SOV_nazbols_new_industrialization: "Nová industrializace" # todo: NEW TRANSLATION
 SOV_nazbols_new_industrialization_desc: "Zahájíme novou industrializační kampaň k oživení síly průmyslu z éry SSSR!" # todo: NEW TRANSLATION
 SOV_nazbols_capital_return: "Divize pro návrat kapitálu" # todo: NEW TRANSLATION
 SOV_nazbols_capital_return_desc: "Plánujeme vytvořit speciální agenturu pověřenou získáváním ruského kapitálu ze zahraničí, všemi dostupnými prostředky." # todo: NEW TRANSLATION
 SOV_nazbols_free_weapon: "Volné nošení zbraní" # todo: NEW TRANSLATION
 SOV_nazbols_free_weapon_desc: "Právo na volné nošení zbraní promění ruskou společnost! Každý občan by měl mít právo na sebeobranu." # todo: NEW TRANSLATION
 SOV_nazbols_back_russians: "Vrátit Rusy domů" # todo: NEW TRANSLATION
 SOV_nazbols_back_russians_desc: "Budeme aktivně podporovat a finančně podporovat návrat rusky mluvících lidí do vlasti." # todo: NEW TRANSLATION
 SOV_nazbols_foreign_legion: "Cizinecká legie" # todo: NEW TRANSLATION
 SOV_nazbols_foreign_legion_desc: "Inspirováni Francouzskou cizineckou legií vytvoříme ruskou legii, kde cizinci mohou sloužit a získat občanství." # todo: NEW TRANSLATION
 SOV_nazbols_ekb: "Přesunout hlavní město do Jekatěrinburgu" # todo: NEW TRANSLATION
 SOV_nazbols_ekb_desc: "Je čas přesunout hlavní město do srdce Ruska! Ural je ideální. Moskva je od mnoha regionů příliš vzdálená." # todo: CHANGED
 SOV_nazbols_empire: "Sovětské impérium" # todo: NEW TRANSLATION
 SOV_nazbols_empire_desc: "Naše moc je zpět! Sláva Sovětskému impériu!" # todo: NEW TRANSLATION
 SOV_nazbols_nato: "Proti-západní rétorika" # todo: NEW TRANSLATION
 SOV_nazbols_nato_desc: "Západ byl vždy a navždy naším nepřítelem. Naše rétorika se nikdy nezmění." # todo: NEW TRANSLATION
 SOV_nazbols_return_russian_territories: "Vrátit sporná ruská území" # todo: NEW TRANSLATION
 SOV_nazbols_return_russian_territories_desc: "Ruská otázka v bývalém Sovětském svazu zůstává nevyřešena. Vyřešíme ji rozhodně: buď ultimáty, nebo riskujeme, že budeme pohlceni." # todo: CHANGED
 SOV_nazbols_belarus_go_home: "Vrátit Bělorusko" # todo: NEW TRANSLATION
 SOV_nazbols_belarus_go_home_desc: "Bělorusko je část naší vlasti nesprávně odňatá. Neexistuje země přirozenější Rusům než tento malý region." # todo: NEW TRANSLATION
 SOV_nazbols_separatists_go_home: "Anexovat separatistické republiky" # todo: NEW TRANSLATION
 SOV_nazbols_separatists_go_home_desc: "Podněstří, Abcházie, Jižní Osetie: jejich takzvaná nezávislost je pozůstatkem chyby Jelcinova Ruska. Napravíme to." # todo: CHANGED
 SOV_nazbols_help_artsakh: "Chráníme Artsakh" # todo: NEW TRANSLATION
 SOV_nazbols_help_artsakh_desc: "Artsakh je nejpevněji křesťanské území v postsovětském prostoru, domov nejautentičtějších Arménů. Musíme je chránit!" # todo: NEW TRANSLATION
 SOV_nazbols_help_kurdistan: "Chráníme Kurdistán" # todo: NEW TRANSLATION
 SOV_nazbols_help_kurdistan_desc: "Kurdistán bude naším opěrným bodem v regionu, pokud získáme diplomatický vliv. Írán, Irák a Turecko si s námi budou muset počítat." # todo: NEW TRANSLATION
 SOV_nazbols_anti_westes: "Anti-západní doktrína" # todo: NEW TRANSLATION
 SOV_nazbols_anti_westes_desc: "Žádné milosrdenství pro západní okupanty ruského ducha!" # todo: NEW TRANSLATION
 SOV_nazbols_ayatolla: "Ruský ajatolláh" # todo: NEW TRANSLATION
 SOV_nazbols_ayatolla_desc: "Rusko, inspirované íránským ajatolláhem, potřebuje duchovního vůdce, který bude udržovat morální rovnováhu lidu, nikoli bezduchá ministerstva." # todo: CHANGED
 SOV_nazbols_our_irgc: "Sbor Strážců komunisticko-pravoslavné revoluce" # todo: NEW TRANSLATION
 SOV_nazbols_our_irgc_desc: "Vytvoříme ruský ekvivalent íránského IRGC k ochraně ideologických úspěchů našeho režimu." # todo: NEW TRANSLATION
 SOV_nazbols_ruralisation: "Ruralizace" # todo: NEW TRANSLATION
 SOV_nazbols_ruralisation_desc: "Silně investujeme do rozvoje agro-průmyslového sektoru naší ekonomiky." # todo: NEW TRANSLATION
 SOV_nazbols_new_religion: "Komunisticko-pravoslavný kostel" # todo: NEW TRANSLATION
 SOV_nazbols_new_religion_desc: "Pravoslavná církev ztratila důvěryhodnost, dokonce spolupracovala s nacisty během druhé světové války. Vybudujeme novou církev syntetizující celé ruské duchovní dědictví." # todo: CHANGED
 SOV_anti_west_idea: "Anti-západní doktrína" # todo: NEW TRANSLATION
 SOV_free_weapon: "Volné nošení zbraní" # todo: NEW TRANSLATION
 SOV_russians_back_idea: "Návrat krajanů" # todo: NEW TRANSLATION
 SOV_nazbol_irgc_idea: "Sbor Strážců komunisticko-pravoslavné revoluce" # todo: NEW TRANSLATION
 sov_nazbol.1.t: "Rusko nás chce anektovat" # todo: CHANGED
 sov_nazbol.1.d: "Ruská vláda vydala ultimátum požadující referendum o připojení k Rusku. Známe pravděpodobný výsledek, a tak je čas rozhodnout o naší odpovědi." # todo: CHANGED
 sov_nazbol.1.a: "Samozřejmě, je čas vrátit se domů, do Ruska" # todo: CHANGED
 sov_nazbol.1.b: "Ne dnes" # todo: NEW TRANSLATION
 sov_nazbol.2.t: "[FROM.GetName] je integrován do [SOV.GetName]" # todo: NEW TRANSLATION
 sov_nazbol.2.d: "[FROM.GetName] byl plně začleněn do naší slavné říše. Získáváme zpět to, co bylo během minulého století ztraceno, a nyní nepřestaneme." # todo: CHANGED
 sov_nazbol.2.a: "Naše země zesílila" # todo: NEW TRANSLATION
 sov_nazbol.3.t: "Rusko požaduje naše území!" # todo: NEW TRANSLATION
 sov_nazbol.3.d: "Rusko si nárokuje ultimátum na část naší země, kterou považuje za svou. Musíme rozhodnout, jak zareagujeme." # todo: NEW TRANSLATION
 sov_nazbol.3.a: "Ustoupíme" # todo: NEW TRANSLATION
 sov_nazbol.3.b: "Nikdy" # todo: NEW TRANSLATION
 sov_nazbol.4.t: "Nacionální bolševici vstupují do koalice" # todo: NEW TRANSLATION
 sov_nazbol.4.d: "Nacionální bolševici se připojili k naší vládnoucí koalici a získali vliv nad domácí politikou." # todo: NEW TRANSLATION
 sov_nazbol.4.a: "Ano, k vítězství!" # todo: NEW TRANSLATION
 SOV_nazbol_coup_TT: "Národní bolševici budou koaliční stranou přijati do vlády." # todo: CHANGED
 SOV_nazbol_destroy_republics_TT: "Všechny §Ynárodní republiky§! nebyly §Rzničeny§!" # todo: NEW TRANSLATION
 SOV_slavic_corps: "Vyřešit otázku Slovanského sboru" # todo: CHANGED
 SOV_slavic_corps_desc: "Slavic Corps je soukromá bezpečnostní společnost registrovaná v Hongkongu. Zajali jsme její majitele a jsme připraveni je uvěznit. Nicméně jejich odbornost by nám mohla být v budoucnu užitečná." # todo: NEW TRANSLATION
 SOV_wagner_minoboroni: "Dodávka od ministerstva obrany" # todo: NEW TRANSLATION
 SOV_wagner_minoboroni_desc: "Ministerstvo obrany nám poskytne potřebné zbraně k provádění našich operací. Tato podpora výrazně posílí naše schopnosti." # todo: NEW TRANSLATION
 SOV_co_op_wagner: "Pověřit Prigožina" # todo: NEW TRANSLATION
 SOV_co_op_wagner_desc: "Jelikož hlavní financování vychází od Jevgenije Prigožina, dává smysl postavit ho do čela PMC. Jeho vedení přinese více koordinace a efektivity." # todo: NEW TRANSLATION
 SOV_wagner_cadres: "Zahájit náborový proces" # todo: CHANGED
 SOV_wagner_cadres_desc: "Začneme nábor prvních kandidátů do našich PMC. Pečlivý výběr je klíčový pro úspěch našich operací." # todo: NEW TRANSLATION
 SOV_wagner_first_pmc: "První prapor PMC" # todo: NEW TRANSLATION
 SOV_wagner_first_pmc_desc: "Náš první prapor PMC byl vytvořen a jsme téměř připraveni zahájit první bojové mise. Je to významný milník v rozšiřování našeho vlivu." # todo: NEW TRANSLATION
 SOV_wagner_more_operations: "Rozšíření činnosti" # todo: NEW TRANSLATION
 SOV_wagner_more_operations_desc: "Náš PMC je nyní připraven podílet se na operacích po celém světě. Toto rozšíření zvýší náš globální dosah a vliv." # todo: NEW TRANSLATION
 SOV_wagner_african: "Africké zaměření" # todo: NEW TRANSLATION
 SOV_wagner_african_desc: "Afrika byla ztracena po rozpadu SSSR; je čas znovu získat náš vliv tam. Obnovení přítomnosti otevře nové strategické příležitosti." # todo: NEW TRANSLATION
 SOV_wagner_support_gru: "Podpora operací GRU" # todo: NEW TRANSLATION
 SOV_wagner_support_gru_desc: "Podpoříme mise GRU, aby se zvýšila účinnost ruské zahraniční politiky. Spolupráce zlepší úspěšnost tajných operací." # todo: NEW TRANSLATION
 SOV_wagner_rusich: "DshRG Rusich" # todo: NEW TRANSLATION
 SOV_wagner_rusich_desc: "Do našich řad integrujeme malý prapor nacionalistů, čímž posílíme naše PMC. Jejich ideologická oddanost z nich činí cenné spojence při misích." # todo: NEW TRANSLATION
 SOV_slavic_wagner_TT: "PMC Wagner bude vytvořen" # todo: NEW TRANSLATION
 SOV_russian_government_idea: "Ruská vláda" # todo: NEW TRANSLATION
 SOV_russian_government_idea_desc: "Politická situace v Rusku byla vždy nestabilní, zejména po rozpadu SSSR. Přispívá k tomu mnoho faktorů: vnitřní separatismus, politická nestabilita a apatie veřejnosti vůči osudu státu." # todo: CHANGED
