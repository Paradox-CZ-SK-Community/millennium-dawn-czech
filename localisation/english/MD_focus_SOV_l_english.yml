 RUS_establish_me: "Nové Rusko" # todo: NEW TRANSLATION
 RUS_establish_me_desc: "Po pádu ruské vlády je třeba vybudovat nový ruský stát." # todo: NEW TRANSLATION
 RUS_hold_kaliningrad_conference: "Uspořádat kaliningradskou konferenci" # todo: CHANGED
 RUS_hold_kaliningrad_conference_desc: "Ruský stát musí být jednotnou, soudržnou a kompetentní silou. Musíme uspořádat kaliningradskou konferenci, abychom zajistili, že Nové Rusko bude stabilním a demokratickým státem." # todo: CHANGED
 RUS_continue_reunification: "Pokračovat v úsilí o sjednocení" # todo: NEW TRANSLATION
 RUS_continue_reunification_desc: "Zdá se, že někteří lidé stále lpí na bývalých územích ruského státu a musíme do toho co nejdříve zasáhnout a vyřešit to vyjednáváním." # todo: NEW TRANSLATION
 RUS_continue_reunification_tt: "Alespoň jeden ruský nástupnický stát musí stále držet svá jádrová území" # todo: NEW TRANSLATION
 RUS_establish_rusfor: "Zřídit RUSFOR" # todo: NEW TRANSLATION
 RUS_establish_rusfor_desc: "Rusko již neexistuje, a to je v některých ohledech problém. Musíme zvážit vytvoření nového území pro ruský stát." # todo: NEW TRANSLATION
 SOV_army_category: "Ruská armáda" # todo: NEW TRANSLATION
 SOV_army_category_desc: "Ruská armáda je jen bledým stínem svého někdejšího sovětského já, kdysi obrovského a hrozivého. Rusko nyní stojí před úkolem obnovit vojenskou moc státu, který se vždy účastnil světové politiky a přímo ji ovlivňoval." # todo: CHANGED
