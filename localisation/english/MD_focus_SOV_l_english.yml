 SOV_jreci_usa_tooltip: "£text_icon_corrector §0Prediktor Korrektor§! §tzbude nakonec zničen§! Skrývá se v §Y[USA.GetNameWithFlag]§!.\n" # todo: NEW TRANSLATION
 SOV_jreci_1_tooltip: "Konečně přišla k moci vláda v §Y[SOV.GetNameWithFlag]§!, která zná pravdu o spiknutí £text_icon_jreci §0Egyptských kněží§! a £text_icon_corrector §0Prediktoru Korrektoru§!.\n" # todo: NEW TRANSLATION
 SOV_jreci_2_tooltip: "Každé ruské vojsko musí projít přeučením, aby vědělo, proti komu bojovat v budoucnu. Se služebníky £text_icon_corrector §0Prediktoru Korrektoru§!.\n" # todo: NEW TRANSLATION
 SOV_jreci_3_tooltip: "Každý poslanec, úředník a jiný regionální manažer absolvuje speciální teoretický kurz boje proti agentům £text_icon_jreci §0Egyptských kněží§!.\n" # todo: NEW TRANSLATION
 SOV_jreci_4_tooltip: "§tOligarchové§! jsou skuteční agenti £text_icon_jreci §0Egyptských kněží§! kteří byli posláni £text_icon_corrector §0Prediktorem Korrektorem§! k rozkladu Ruska. S tím uděláme pořádek.\n" # todo: NEW TRANSLATION
 SOV_jreci_5_tooltip: "§tNové náboženství§! je klíčem k vítězství ve válce se služebníky £text_icon_corrector §0Prediktoru Korrektoru§!.\n" # todo: NEW TRANSLATION
 SOV_jreci_6_tooltip: "§tInternetová propaganda§! konečně začne předkládat pravdu našim občanům, kterou £text_icon_jreci §0Egyptští kněží§! před nimi skrývali.\n" # todo: NEW TRANSLATION
 SOV_jreci_7_tooltip: "Všechno, co potřebujeme, je §tpravda!§!.\n" # todo: NEW TRANSLATION
 SOV_jreci_8_tooltip: "Abychom porazili £text_icon_corrector §0Prediktora Korrektora§!, musíme dominovat nejen ve vzduchu a na zemi. Musíme se stát pány kosmu!.\n" # todo: NEW TRANSLATION
 SOV_jreci_9_tooltip: "Skuteční ruští bojovníci jsou §tVityazi§!. Tuto šlechtu znovu obnovíme, abychom připravili posvátnou armádu proti našim nepřátelům.\n" # todo: NEW TRANSLATION
 SOV_jreci_10_tooltip: "§tBolshevismus§! je pro ruského člověka také přirozený jako touha po spravedlnosti a míru.\n" # todo: NEW TRANSLATION
 SOV_jreci_11_tooltip: "Přepišme ústavu a vyhoďme vše, co nám £text_icon_jreci §0Egyptští kněží§! donutili tam napsat.\n" # todo: NEW TRANSLATION
 SOV_jreci_12_tooltip: "Stalin byl §tmoudrý muž§!, jeho metody odložily dobytí Ruska £text_icon_corrector §0Prediktorem Korrektorem§!, je čas si staré metody připomenout.\n" # todo: NEW TRANSLATION
 SOV_jreci_13_tooltip: "Kniha §tDead Water§! je povinné čtení pro každého Rusa \n" # todo: NEW TRANSLATION
