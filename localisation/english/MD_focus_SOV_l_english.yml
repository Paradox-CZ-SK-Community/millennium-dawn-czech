 SOV_500_days_category_desc: "Program 500 dní byl iniciativou, kterou v roce 1990 navrhli sovětský ekonom Stanislav Šatalin a předseda Komise pro hospodářské reformy Grigorij Javlinskij. Hlavním účelem programu byl přechod od plánované ekonomiky k tržnímu kapitalismu omezením role státu v hospodářství. Program bohužel nikdy nebyl uskutečněn, protože sovětské vedení jej považovalo za příliš radikální.\nPo chybách Gajdarovy šokové terapie a ekonomickém špatném řízení předchozích vlád vyžaduje současná hospodářská situace, abychom to zkusili znovu a Program 500 dní plně uskutečnili, a dokončili tak přechod k moderní tržní ekonomice!" # todo: CHANGED
