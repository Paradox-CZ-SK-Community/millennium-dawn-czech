 russia_news.11.o5: "Další válka na troskách Unie." # todo: NEW TRANSLATION
 russia_news.13.t: "Rusko vyhlašuje vojenskou operaci!" # todo: NEW TRANSLATION
 russia_news.13.d: "Dnes ráno ruský prezident vyhlásil vojenskou operaci na Ukrajině s cíli denacifikace a demilitarizace. Ministerstvo obrany trvá na tom, že jsou zasahovány pouze vojenské cíle, ale západní vůdci slíbili podporu Kyjevu." # todo: NEW TRANSLATION
 russia_news.13.o1: "Vpřed!" # todo: NEW TRANSLATION
