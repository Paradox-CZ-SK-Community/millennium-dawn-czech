 SOV_FSB_expansion_desc: "FSB je naší hlavní bezpečnostní agenturou a musíme zajistit, aby disponovala moderním zázemím a zdroji k řešení dnešních výzev." # todo: CHANGED
 SOV_svr: "Zahraniční zpravodajská služba (SVR)" # todo: NEW TRANSLATION
 SOV_svr_desc: "SVR je hlavní ruskou zahraniční zpravodajskou službou, která působí pod pravomocí prezidenta. Jde o klíčovou státní polovojenskou službu odpovědnou za zpravodajství a tajné operace v zahraničí." # todo: CHANGED
 SOV_zaslon: "Zaslon" # todo: NEW TRANSLATION
 SOV_zaslon_desc: "Zaslon je vysoce utajená speciální jednotka SVR založená v roce 1997. Poskytuje vojenskou podporu zahraničním zpravodajským operacím, chrání ruská diplomatická zastoupení a zajišťuje bezpečnost vedení SVR při vysoce rizikových úkolech." # todo: NEW TRANSLATION
 SOV_alpha_omon_exp: "Skupina Alpha" # todo: NEW TRANSLATION
 SOV_alpha_omon_exp_desc: "Skupina Alpha, oficiálně Ředitelství A Střediska zvláštních účelů FSB, je elitní jednotka speciálních sil vytvořená sovětským KGB v roce 1974. Pod politickou kontrolou provádí vysoce rizikové tajné a paramilitární operace uvnitř i mimo Rusko." # todo: NEW TRANSLATION
 SOV_vimpel_omon_exp: "Skupina Vympel" # todo: NEW TRANSLATION
 SOV_vimpel_omon_exp_desc: "Skupina Vympel, neboli Ředitelství V, je jednotka spetsnaz FSB, často nazývaná KGB Ředitelství V. Je sesterskou jednotkou Alpha Group a specializuje se na strategické operace pod velením FSB." # todo: NEW TRANSLATION
 SOV_pogranci_fsb: "Pohraniční služba FSB Ruska" # todo: NEW TRANSLATION
 SOV_pogranci_fsb_desc: "Pohraniční služba je složkou FSB odpovědnou za hlídkování a ochranu rozsáhlých ruských pozemních hranic." # todo: CHANGED
 SOV_second_slujba: "Druhá služba" # todo: NEW TRANSLATION
 SOV_second_slujba_desc: "Druhá služba, známá také jako Služba ochrany ústavního pořádku a boje proti terorismu, bojuje proti terorismu, extremismu a vnitřním politickým hrozbám, chrání ruský ústavní pořádek a zajišťuje kontrarozvědku v citlivých společenských a kulturních oblastech." # todo: CHANGED
 SOV_inner_army: "Vnitřní vojska" # todo: NEW TRANSLATION
 SOV_inner_army_desc: "Vnitřní vojska Ministerstva vnitra jsou paramilitární síla pověřená potíráním davů, ochranou kritických zařízení a podporou policejních operací. Hrála klíčové role v domácích konfliktech, jako byly čečenské války." # todo: NEW TRANSLATION
 SOV_omon: "OMON" # todo: NEW TRANSLATION
 SOV_omon_desc: "OMON je systém zvláštních policejních jednotek v rámci ruských ozbrojených sil, původně vytvořený v roce 1988. OMON je známý potlačováním nepokojů a polovojenskou policejní činností a působí také v několika postsovětských státech v podobných úlohách." # todo: CHANGED
 SOV_upravlenie_k: "Úřad K" # todo: NEW TRANSLATION
 SOV_upravlenie_k_desc: "Úřad K Ministerstva vnitra se specializuje na boj proti kyberzločinu a nelegálnímu obchodování s elektronickými zařízeními a špionážním vybavením." # todo: NEW TRANSLATION
 SOV_centr_t: "Centrum boje proti extremismu" # todo: NEW TRANSLATION
 SOV_centr_t_desc: "Známé jako Centrum E, tato jednotka v rámci Ministerstva vnitra se zaměřuje na identifikaci a potlačování extremistických aktivit po celém Rusku." # todo: NEW TRANSLATION
 SOV_gusb: "Hlavní ředitelství vnitřní bezpečnosti" # todo: NEW TRANSLATION
 SOV_gusb_desc: "Hlavní ředitelství vnitřní bezpečnosti je nezávislá policejní jednotka v rámci Ministerstva vnitra odpovědná za prevenci korupce, vnitřních trestných činů a zajištění integrity mezi příslušníky bezpečnostních složek." # todo: NEW TRANSLATION
 SOV_sobr: "SOBR" # todo: NEW TRANSLATION
 SOV_sobr_desc: "SOBR je rychlá zásahová jednotka spetsnaz s vojenským výcvikem a vybavením. Spolupracuje s OMON a funguje jako paramilitární policejní taktická síla nasaditelná pro vysoce rizikové operace." # todo: NEW TRANSLATION
 SOV_anti_corrupt_upravlenie: "Generální ředitelství pro ekonomickou bezpečnost a protikorupci" # todo: NEW TRANSLATION
 SOV_anti_corrupt_upravlenie_desc: "Toto ředitelství vede úsilí ministerstva vnitra v boji proti hospodářské kriminalitě a korupci a provádí státní politiku a právní předpisy na ochranu ekonomické bezpečnosti Ruska." # todo: CHANGED
 SOV_gru: "GRU" # todo: NEW TRANSLATION
 SOV_gru_desc: "GRU je ruská vojenská zahraniční zpravodajská služba pod generálním štábem. Velí vojenskému zpravodajství a jednotkám specnazu a je známá prováděním složitých a vysoce rizikových operací po celém světě. Podléhá ministerstvu obrany." # todo: CHANGED
 SOV_gru_spetznaz: "Spetsnaz GRU" # todo: NEW TRANSLATION
 SOV_gru_spetznaz_desc: "Spetsnaz GRU jsou jednotky speciálních sil GRU, pověřené prováděním tajných vojenských operací a zpravodajských misí v zahraničí." # todo: NEW TRANSLATION
 SOV_outer: "Zahraniční zpravodajství" # todo: NEW TRANSLATION
 SOV_outer_desc: "Naše národní bezpečnost závisí na tom, jak dobře sledujeme a oslabujeme naše nepřátele. Musíme zůstat ostražití proti každému, kdo se nás pokouší podkopat." # todo: NEW TRANSLATION
 SOV_alpha_idea: "Speciální jednotka Alpha" # todo: NEW TRANSLATION
 SOV_alpha_idea_desc: "Speciální jednotka Centra zvláštního určení Federální služby bezpečnosti Ruské federace. Mezi hlavní úkoly ředitelství A patří provádění zvláštních bezpečnostních operací k prevenci teroristických činů, vyhledávání, zneškodňování či likvidace teroristů a osvobozování rukojmích. Bojovníci skupiny Alfa také provádějí další vysoce komplexní operace FSB a působí v aktivních konfliktních zónách." # todo: CHANGED
