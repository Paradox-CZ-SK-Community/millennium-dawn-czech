 SOV_establishment_of_free_independent_alliance_desc: "Musíme obnovit diplomatické vztahy se všemi postsovětskými státy a případně vytvořit svaz pro společný ekonomický a vojenský rozvoj." # todo: NEW TRANSLATION
 SOV_membership_in_a_free_independent_alliance: "Členství ve Svobodné nezávislé alianci" # todo: NEW TRANSLATION
 SOV_membership_in_a_free_independent_alliance_desc: "S naší aliancí založenou pozveme všechny bývalé sovětské republiky, aby se připojily a společně bránily demokracii." # todo: NEW TRANSLATION
