 russia_governorate.1.t: "Rusko se rozhodlo udělat z nás gubernii" # todo: NEW TRANSLATION
 russia_governorate.1.d: "Rusko je silně proti staré struktuře svého státu. Jedním z příkladů je návrat k administrativnímu členění. Rusko nás horlivě zve, abychom se stali jeho gubernií a součástí tohoto nového řádu." # todo: NEW TRANSLATION
 russia_governorate.1.o1: "Společně oživíme velkou říši!" # todo: NEW TRANSLATION
 russia_governorate.1.o2: "Odpor a kousnutí!" # todo: NEW TRANSLATION
 russia_governorate.2.t: "[LIT.GetName] se vrací domů" # todo: NEW TRANSLATION
 russia_governorate.2.d: "Vláda [LIT.GetName] jednala moudře, když se vyhnula konfrontaci s námi. [LIT.GetName] bude opět součástí Ruské říše, což posílí naši jednotu a společnou budoucnost." # todo: NEW TRANSLATION
 russia_governorate.2.o1: "Konečně" # todo: NEW TRANSLATION
 russia_governorate.3.t: "[LIT.GetName] se nám brání!" # todo: NEW TRANSLATION
 russia_governorate.3.d: "Vláda [LIT.GetName] odmítla naši štědrou nabídku mírně se stát jednou z našich provincií. Pokud odmítnou diplomacii, budeme nuceni zasáhnout silou." # todo: NEW TRANSLATION
 russia_governorate.3.o1: "Blázni" # todo: NEW TRANSLATION
 russia_governorate.4.t: "Rusko se rozhodlo udělat z nás gubernii" # todo: NEW TRANSLATION
 russia_governorate.4.d: "Rusko je pevně proti staré státní struktuře. Příkladem je znovuzavedení administrativního členění. Rusko nás hodlá pozvat, abychom se stali jednou z jeho gubernií." # todo: NEW TRANSLATION
 russia_governorate.4.o1: "Společně oživíme velkou říši!" # todo: NEW TRANSLATION
 russia_governorate.4.o2: "Odpor a kousnutí!" # todo: NEW TRANSLATION
 russia_governorate.5.t: "[LAT.GetName] se vrací domů" # todo: NEW TRANSLATION
 russia_governorate.5.d: "Vláda [LAT.GetName] jedná opatrně a vyhnula se konfliktu s námi. [LAT.GetName] se opět stane součástí Ruské říše a posílí naše pouto." # todo: NEW TRANSLATION
 russia_governorate.5.o1: "Konečně" # todo: NEW TRANSLATION
 russia_governorate.6.t: "[LAT.GetName] se nám brání!" # todo: NEW TRANSLATION
 russia_governorate.6.d: "Vláda [LAT.GetName] odmítla naši štědrou nabídku mírového připojení jako provincie. Nebudeme mít na vybranou a přinutíme je silou." # todo: NEW TRANSLATION
 russia_governorate.6.o1: "Blázni" # todo: NEW TRANSLATION
 russia_governorate.7.t: "Rusko se rozhodlo udělat z nás gubernii" # todo: NEW TRANSLATION
 russia_governorate.7.d: "Rusko je silně proti staré státní struktuře. Jedním z příkladů je znovuzavedení administrativních členění. Rusko nás chce pozvat, abychom se stali jednou z jeho gubernií." # todo: NEW TRANSLATION
 russia_governorate.7.o1: "Společně oživíme velkou říši!" # todo: NEW TRANSLATION
 russia_governorate.7.o2: "Odpor a kousnutí!" # todo: NEW TRANSLATION
 russia_governorate.8.t: "[EST.GetName] se vrací domů" # todo: NEW TRANSLATION
 russia_governorate.8.d: "Vláda [EST.GetName] moudře vyhnula konfrontaci s námi. [EST.GetName] bude opět součástí Ruské říše a připojí se k nám v obnovené síle." # todo: NEW TRANSLATION
 russia_governorate.8.o1: "Konečně" # todo: NEW TRANSLATION
 russia_governorate.9.t: "[EST.GetName] se nám brání!" # todo: NEW TRANSLATION
 russia_governorate.9.d: "Vláda [EST.GetName] odmítla naši štědrou nabídku mírového připojení jako provincie. Pokud budou trvat na svém, budeme muset podniknout rozhodné kroky." # todo: NEW TRANSLATION
