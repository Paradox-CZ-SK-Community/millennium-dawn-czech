 SOV_economy_modifier: "Ruská ekonomika" # todo: NEW TRANSLATION
 SOV_economy_modifier_desc: "Průběžná evidence společností, které stát vlastní, částečně vlastní nebo na ně tlačí. Každá firma navrácená pod kontrolu Moskvy zde zanechá svou stopu." # todo: NEW TRANSLATION
 SOV_capitalisation_modifier: "Kapitalizace společností" # todo: NEW TRANSLATION
 SOV_capitalisation_modifier_desc: "To, jak trh hodnotí naše národní šampiony. Čím vyšší je jejich kapitalizace, tím více z nich získá státní pokladna i výzkumné kapacity." # todo: NEW TRANSLATION
 SOV_landforce_modifier: "Pozemní síly" # todo: NEW TRANSLATION
 SOV_landforce_modifier_desc: "Největší složka ruských ozbrojených sil, vybudovaná kolem motostřeleckých a tankových formací vybavených rodinami BMP, BTR a T-72 až T-90. Reforma Nového vzhledu rozložila zděděnou divizní strukturu na brigády stálé připravenosti; toto rozhodnutí bylo později zvráceno, když byly divize podél západní hranice znovu vytvořeny." # todo: NEW TRANSLATION
 SOV_airforce_modifier: "Vzdušně-kosmické síly" # todo: NEW TRANSLATION
 SOV_airforce_modifier_desc: "Vznikly sloučením letectva s vojsky vzdušně-kosmické obrany, čímž byly letectví, protivzdušná obrana a vojenské kosmické operace podřízeny jedinému velení. Jejich bojová síla spočívá v odvozeninách Su-27, úderném letectvu Su-34 a síti včasného varování sledující odpaly raket." # todo: NEW TRANSLATION
 SOV_navy_modifier: "Válečné námořnictvo" # todo: NEW TRANSLATION
 SOV_navy_modifier_desc: "Rozdělené mezi Severní, Tichomořské, Baltské a Černomořské loďstvo a Kaspickou flotilu, přičemž jeho těžiště tvoří ponorky s balistickými raketami. Dlouho přežívalo díky stárnoucím sovětským trupům a čekalo, až programy Borej a Jaseň dodají náhrady." # todo: NEW TRANSLATION
 SOV_intelligence_modifier: "Bezpečnostní služby" # todo: NEW TRANSLATION
 SOV_intelligence_modifier_desc: "Za kryptografii a signální zpravodajství kdysi odpovídala FAPSI, Federální agentura pro vládní komunikace a informace, dokud nebyla rozpuštěna a její funkce rozděleny mezi FSB, SVR a GRU. Po jejich boku stojí služby, které dohlížejí na samotnou zemi: Rosgvardija, vytvořená z vojsk ministerstva vnitra a přímo podřízená prezidentovi, pořádkové jednotky OMON, které pohltila, a GRU, která řídí vojenské zpravodajství a brigády Specnazu v zahraničí." # todo: NEW TRANSLATION
 SOV_revived_politburo_modifier: "Oživené politbyro" # todo: NEW TRANSLATION
 SOV_revived_politburo_modifier_desc: "Dědictví strany Sovětského svazu bylo v roce 1991 zničeno. Nyní stojíme před úkolem obnovit vše, co bylo ztraceno a ukradeno." # todo: CHANGED
