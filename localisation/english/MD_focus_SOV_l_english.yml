 SOV_more_yunarmy: "Rozšíření Junarmije" # todo: NEW TRANSLATION
 SOV_more_yunarmy_desc: "Rozšíříme Junarmiju, aby zvýšila svůj dosah a účinnost jako nástroj vlasteneckého vzdělávání a propagandy." # todo: NEW TRANSLATION
 SOV_propaganda_army: "Technický průlom" # todo: NEW TRANSLATION
 SOV_propaganda_army_desc: "Náš technologický pokrok musí držet krok se světem. Vojensko povede cestu při zavádění nových inovací." # todo: NEW TRANSLATION
 SOV_leib_guard: "Reforma Prezidentského pluku" # todo: NEW TRANSLATION
 SOV_leib_guard_desc: "Prezidentský pluk bude přeměněn na Císařskou gardu, oživíme prestižní jednotku z éry Ruského impéria." # todo: NEW TRANSLATION
 SOV_ratnik_3: "Ratnik-3" # todo: NEW TRANSLATION
 SOV_ratnik_3_desc: "Významně investujeme do programu Ratnik-3, aby naši vojáci byli vybaveni nejnovějším a nejpokročilejším bojovým vybavením." # todo: NEW TRANSLATION
 SOV_pmc_patriot: "PMC Patriot" # todo: NEW TRANSLATION
 SOV_pmc_patriot_desc: "Ministerstvo obrany plánuje vytvořit novou soukromou vojenskou společnost pro rozšíření našeho vlivu a operačních schopností." # todo: NEW TRANSLATION
 SOV_morpeh_vdv: "Reforma výsadkových a námořních sil" # todo: NEW TRANSLATION
