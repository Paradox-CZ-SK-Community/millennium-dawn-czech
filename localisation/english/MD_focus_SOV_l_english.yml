 SOV_zhirinovsky_iron_regent_desc: "Revoluce z roku 1917 strhla Rusko do chaosu. Vladimir Zhirinovsky, osudově vyvolený stát se dalším carem, obnoví pořádek a vyřeší nejhlubší národní krize." # todo: NEW TRANSLATION
