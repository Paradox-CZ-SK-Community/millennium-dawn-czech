 SOV_kafedra_return: "Obnovit vojenská oddělení" # todo: NEW TRANSLATION
 SOV_kafedra_return_desc: "Vojenská oddělení ve vzdělávacích institucích budou znovu zřízena, aby vychovávala budoucí důstojníky a specialisty." # todo: NEW TRANSLATION
 SOV_fleet: "Slavné sovětské námořnictvo" # todo: NEW TRANSLATION
