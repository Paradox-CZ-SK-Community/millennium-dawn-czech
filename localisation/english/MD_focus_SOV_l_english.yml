 russia.118.t: "Osud křižníku 'Baku'" # todo: NEW TRANSLATION
 russia.118.d: "Osud křižníku Baku je po léta nejistý. Od 90. let o něj projevila zájem Indie. Nyní musíme rozhodnout, zda křižník zachovat a modernizovat pro naši flotilu, nebo jej prodat Indii a získat prostředky." # todo: NEW TRANSLATION
 russia.118.a: "Modernizovat ho" # todo: NEW TRANSLATION
 russia.118.b: "Prodat ho" # todo: NEW TRANSLATION
 russia.119.t: "Kanonizace rodu Romanovců" # todo: NEW TRANSLATION
 russia.119.d: "Ruská pravoslavná církev dnes ráno kanonizovala rodinu Romanovců. Proces se neobešel bez kontroverzí a vyvolal rozepře v různých kruzích, včetně hlasů uvnitř samotné církve. Mnozí se domnívají, že kanonizace řádně neuctívá posvátnost tohoto pojmu, církev však pokračovala." # todo: CHANGED
 russia.119.a: "Připomenout komunistům jejich činy!" # todo: NEW TRANSLATION
 russia.119.b: "Uctění mrtvých..." # todo: NEW TRANSLATION
 russia.120.t: "Neúspěšný zkušební let Su-37" # todo: NEW TRANSLATION
 russia.120.d: "Dnes se poblíž Šatury uskutečnil zkušební let, letoun však utrpěl závažnou poruchu. Ocasní křídlo se během manévru s vysokým přetížením odlomilo, což vedlo k pádu a úplnému zničení. Konstrukční selhání způsobilo opakované překračování projektovaného zatížení během šesti let zkoušek." # todo: CHANGED
 russia.120.a: "Nedobré..." # todo: NEW TRANSLATION
 NOV_limonka: "Novorossija" # todo: NEW TRANSLATION
 georgia_broken_relations: "Zničené vztahy s Gruzií" # todo: NEW TRANSLATION
 SOV_Georgian_question: "Osud Gruzie" # todo: NEW TRANSLATION
 SOV_Georgian_question_desc: "V tuto chvíli je hlavním úkolem naší zahraniční politiky co nejdříve vyřešit otázku další interakce s Gruzií." # todo: NEW TRANSLATION
 russia.200.t: "Dobrá zpráva z Bajkonuru" # todo: NEW TRANSLATION
 russia.200.d: "Tým opravující Buran dnes potvrdil, že raketoplán byl úspěšně přemístěn ze stárnoucího hangáru, což označuje začátek jeho demontáže. Byl sestaven tým zkušených inženýrů, který bude dohlížet na rozebrání konstrukce." # todo: CHANGED
 russia.200.a: "Jak zamýšleno" # todo: NEW TRANSLATION
 russia.300.t: "Peněžní prostředky na Buran zpronevěřeny" # todo: NEW TRANSLATION
 russia.300.d: "Finanční prostředky přidělené na program obnovy Buranu byly údajně zpronevěřeny a kritické zdroje odkloněny od projektu. Úsilí o identifikaci viníka bylo dosud neúspěšné. Zmizení finančních záznamů a korupce na vysokých místech ztížily vyšetřování." # todo: CHANGED
 russia.300.a: "Sakra!" # todo: NEW TRANSLATION
 russia.301.t: "Mezinárodní společenství šumí obdivem" # todo: CHANGED
 russia.301.d: "Díky našim drakonickým, ale úspěšným snahám o opravu Buranu bylo mezinárodní společenství uchváceno našimi úspěchy. Můžeme využít tohoto okamžiku globálního uznání a maximalizovat jeho dopad, dokud je reflektor zaměřen na nás." # todo: NEW TRANSLATION
 russia.301.a: "Vděk inženýrům!" # todo: NEW TRANSLATION
 russia.301.b: "Vděk [SOV.GetLeader]!" # todo: NEW TRANSLATION
 russia.302.t: "Raketoplán Buran opraven" # todo: NEW TRANSLATION
 russia.302.d: "Po měsících pečlivé práce byl raketoplán Buran plně obnoven a stojí připraven na novou kapitolu průzkumu vesmíru. Každý šroub i každá součástka byly dvakrát zkontrolovány a úspěšný zkušební let potvrdil jeho připravenost. Nyní je připraven na budoucí mise — jde o triumfální okamžik pro Rusko a oživení legendárního stroje, který byl kdysi považován za ztracený v čase." # todo: CHANGED
 russia.302.a: "Krok vpřed pro průzkum vesmíru!" # todo: NEW TRANSLATION
 russia.3022.t: "Raketoplán Buran opraven Ruskem" # todo: NEW TRANSLATION
 russia.3022.d: "Po měsících pečlivé práce byl raketoplán Buran plně obnoven a stojí připraven na novou kapitolu průzkumu vesmíru. Každý šroub i každá součástka byly dvakrát zkontrolovány a úspěšný zkušební let potvrdil jeho připravenost. Nyní je připraven na budoucí mise — jde o triumfální okamžik pro Rusko a oživení legendárního stroje, který byl kdysi považován za ztracený v čase." # todo: CHANGED
 russia.3022.a: "Krok vpřed pro průzkum vesmíru!" # todo: NEW TRANSLATION
 russia.303.t: "Buran při opravách zničen v požáru hangáru" # todo: NEW TRANSLATION
 russia.303.d: "16. června 2003 udeřila katastrofa, když požár zachvátil dočasný hangár, v němž byl raketoplán Buran opravován, a zcela jej zničil. Po veškerém úsilí vynaloženém na jeho obnovu a přípravu k budoucím misím se odkaz raketoplánu proměnil v popel. Ztráta byla zdrcující, tragický konec toho, co mohl být triumfálním návratem raketoplánu na oblohu." # todo: CHANGED
 russia.303.a: "Sny, které se nikdy nesplní" # todo: NEW TRANSLATION
 russia.3033.t: "Buran při opravách zničen v požáru hangáru" # todo: NEW TRANSLATION
 russia.3033.d: "Dne 16. června 2003 zasáhla katastrofa, když požár zachvátil dočasný hangár, kde se Buran opravoval, a zničil jej úplně. Po všech snahách o jeho obnovení a přípravu na budoucí mise se dědictví raketoplánu proměnilo v popel. Ztráta byla zničující, tragický konec toho, co mohlo být slavný návrat stroje." # todo: NEW TRANSLATION
 russia.3033.a: "Sny, které se nikdy nesplní" # todo: NEW TRANSLATION
 russia.304.t: "Buran zničen při zhroucení hangáru" # todo: NEW TRANSLATION
 russia.304.d: "12. května 2002 udeřila tragédie, když byl raketoplán Buran ztracen při ničivém zhroucení hangáru, které ukončilo jeho příběh hromadou trosek a vyžádalo si několik obětí. Tento kdysi hrdý symbol průzkumu vesmíru byl proměněn v trosky a už nikdy nevzlétne. Byl to srdcervoucí konec stroje, který představoval tolik naděje a ambicí." # todo: CHANGED
 russia.304.a: "Sny, které se nikdy nesplní" # todo: NEW TRANSLATION
 russia.3044.t: "Buran zničen při zhroucení hangáru" # todo: NEW TRANSLATION
 russia.3044.d: "12. května 2002 udeřila tragédie, když byl raketoplán Buran ztracen při ničivém zhroucení hangáru, které ukončilo jeho příběh hromadou trosek a vyžádalo si několik obětí. Tento kdysi hrdý symbol průzkumu vesmíru byl proměněn v trosky a už nikdy nevzlétne. Byl to srdcervoucí konec stroje, který představoval tolik naděje a ambicí." # todo: CHANGED
