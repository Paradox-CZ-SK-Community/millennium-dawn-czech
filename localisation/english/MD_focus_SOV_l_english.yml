 sov_liberals.10.t: "[FROM.GetNameWithFlag] nás zve do aliance" # todo: NEW TRANSLATION
 sov_liberals.10.d: "[FROM.GetNameWithFlag] nás zve, abychom se připojili k jejich Svobodné nezávislé alianci k obraně demokracie napříč bývalým Sovětským svazem a celosvětově. Připojení posílí obranu, ekonomický rozvoj a mezinárodní postavení. Odmítnutí znamená ztrátu klíčové podpory." # todo: NEW TRANSLATION
