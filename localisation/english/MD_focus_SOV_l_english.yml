 sov_liberals.9.d: "[FROM.GetNameWithFlag] nás zve, abychom se připojili k jejich Svobodné nezávislé alianci věnované obraně demokracie v postsovětském regionu a dál. Spolupráce slibuje silnější obranu, ekonomický růst a geopolitický vliv. Odmítnutí nás může nechat izolované." # todo: NEW TRANSLATION
