 russia.500.t: "Rostec konsoliduje vrtulníkový průmysl" # todo: NEW TRANSLATION
 russia.500.d: "Desetiletí konkurence mezi konstrukčními kancelářemi Mil a Kamov a montážními závody Rostvertol, Kazan a Ulan-Ude zanechala ruskou výrobu vrtulníků roztříštěnou. Pod průmyslovou koordinací Rostecu se dochované dědictví sovětské éry slučuje do jediného integrovaného holdingu, JSC Russian Helicopters, aby se zefektivnil výzkum, výroba a export." # todo: NEW TRANSLATION
