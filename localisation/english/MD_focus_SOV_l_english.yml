 SOV_Visa_regime_with_central_asia_idea: "Vízový režim se Střední Asií" # todo: NEW TRANSLATION
 SOV_Economic_Empire_idea: "Ekonomické impérium" # todo: NEW TRANSLATION
 SOV_Dependence_on_Russian_technologies_idea: "Závislost na ruských technologiích" # todo: NEW TRANSLATION
 SOV_FBK_TT: "Odemkne rozhodnutí §YFondu pro boj s korupcí§!" # todo: CHANGED
 SOV_cross_the_rubicon: "Přejít Rubikon" # todo: NEW TRANSLATION
 SOV_cross_the_rubicon_desc: "Nastal čas, aby pravý vůdce Ruska uchopil moc. Musíme jednat rozhodně, zajistit budoucnost našeho národa a převzít otěže dějin." # todo: CHANGED
 SOV_tandemokratia: "Tandemokracie" # todo: NEW TRANSLATION
 SOV_tandemokratia_desc: "Tandemokratie odkazuje na duumvirát Putina a Medveděva. Společně nyní povedou Rusko jako jednotná síla, spojující své síly do jediné moci." # todo: NEW TRANSLATION
 SOV_unlimited_samoderzhaviye: "Neomezené samoderžaví" # todo: NEW TRANSLATION
 SOV_unlimited_samoderzhaviye_desc: "Vracíme se k principu samoděržaví: absolutní vládě. Se dvěma cary v čele naše vláda odráží sílu staré ruské autokracie." # todo: CHANGED
 SOV_establish_new_oligarchate: "Zřídit novou oligarchii" # todo: NEW TRANSLATION
 SOV_establish_new_oligarchate_desc: "Oligarchové dlouho utvářeli ruskou politiku. Nahrazením Putinových věrných našimi vlastními spojenci zajistíme trvalou stabilitu a loajální podporu." # todo: CHANGED
 SOV_peace_with_the_west: "Mír se Západem" # todo: NEW TRANSLATION
 SOV_peace_with_the_west_desc: "Vzhledem k proměnlivé situaci v našich vnitřních záležitostech není konflikt se Západem proveditelný. Prozatím musí zavládnout mír, dokud nenastane správný čas." # todo: CHANGED
 SOV_continue_reformism: "Pokračovat v reformách" # todo: NEW TRANSLATION
 SOV_continue_reformism_desc: "Putinova konzervativní politika vedla ke stagnaci. Naše nová vláda oživí Rusko rozsáhlými reformami a novým vedením." # todo: CHANGED
 SOV_secure_the_FSB: "Zajistit FSB" # todo: NEW TRANSLATION
 SOV_secure_the_FSB_desc: "FSB zůstává baštou putinovského vlivu. Je nutné provést čistky, abychom rozložili tuto poslední baštu starého režimu." # todo: NEW TRANSLATION
 SOV_crush_putinism: "Zlomit putinismus" # todo: NEW TRANSLATION
 SOV_crush_putinism_desc: "Putinismus musí být zcela rozebrán: jeho politika, sítě i ideologie. Musíme ho nechat za sebou, abychom se mohli posunout vpřed." # todo: CHANGED
 SOV_western_russia: "Nová vlna ve starém stylu" # todo: NEW TRANSLATION
 SOV_western_russia_desc: "Ačkoli vládnoucí strana znovu získala moc, nyní ji vede reformní křídlo. Jejich cílem je přetvořit systém tak, aby byl kompatibilní s demokratickými partnerstvími a západní spoluprací." # todo: NEW TRANSLATION
 SOV_enforce_liberal_values: "Nadřazenost liberálních hodnot" # todo: NEW TRANSLATION
 SOV_enforce_liberal_values_desc: "Liberalismus je základem svobodného a prosperujícího Ruska. Musíme tyto hodnoty prosazovat a šířit, když budujeme zemi znovu." # todo: NEW TRANSLATION
 SOV_focus_on_economy: "Ruské ekonomické zázraky" # todo: NEW TRANSLATION
 SOV_focus_on_economy_desc: "Liberální éra slibuje ekonomické oživení. Otevřením trhů a provedením reforem přivedeme novou éru prosperity, míru a svobody." # todo: NEW TRANSLATION
 SOV_abandon_foreign_policy: "Opustit zahraniční politiku" # todo: NEW TRANSLATION
 SOV_abandon_foreign_policy_desc: "Studená válka skončila. Už nejsme komunistickou hrozbou pro Západ. Je čas odložit minulá křivdy a přijmout trvalý mír." # todo: NEW TRANSLATION
 SOV_age_of_stability: "Stabilní Rusko" # todo: NEW TRANSLATION
 SOV_age_of_stability_desc: "Po desetiletích zmatků a nerovnosti našlo Rusko mír. S vizionářským reformátorem u moci vstupujeme do doby trvalé stability a národní jednoty." # todo: NEW TRANSLATION
 SOV_establish_controlled_opposition: "Zřídit kontrolovanou opozici" # todo: NEW TRANSLATION
 SOV_establish_controlled_opposition_desc: "Kontrolovaná opozice v Dumě vytvoří zdání demokracie a zároveň nám umožní bez překážek prosazovat reformy." # todo: NEW TRANSLATION
 SOV_special_economic_operation: "Speciální ekonomická operace" # todo: NEW TRANSLATION
 SOV_special_economic_operation_desc: "Bělorusko a Ukrajina musí pochopit, že éra putinismu skončila. Zapojíme je prostřednictvím spolupráce, nikoli nátlaku, a obnovíme vztahy na nových základech." # todo: NEW TRANSLATION
 SOV_the_iron_dimon: "Železná vláda" # todo: NEW TRANSLATION
 SOV_the_iron_dimon_desc: "Lidé jsou unaveni slabostí. Požadují sílu. Povstane skutečný vůdce — pevný, neústupný a odhodlaný — aby na tuto výzvu odpověděl." # todo: CHANGED
 SOV_the_new_dictatorship: "Nová diktatura" # todo: NEW TRANSLATION
 SOV_the_new_dictatorship_desc: "Abychom upevnili svou autoritu, přivítáme strukturu a efektivitu nové diktatury, přizpůsobené moderním potřebám." # todo: NEW TRANSLATION
 SOV_medvedeism: "Medvedeismus" # todo: NEW TRANSLATION
 SOV_medvedeism_desc: "Putinismus zklamal národ. Nyní přichází nová doktrína: medveděvismus, jehož cílem je napravit minulost a vést Rusko do budoucnosti." # todo: CHANGED
 SOV_defend_national_interests: "Bránit národní zájmy" # todo: NEW TRANSLATION
 SOV_defend_national_interests_desc: "Po zabezpečení státu obrátíme své oči ven. Správné území ruského národa musí být vráceno pod naši ochranu." # todo: NEW TRANSLATION
 iron_dimon: "Železný Dimon" # todo: NEW TRANSLATION
 pro_western_dima: "Skutečný liberál" # todo: NEW TRANSLATION
 russian_duumviri: "Ruský duumvirát" # todo: NEW TRANSLATION
 SOV_dimon: "Velké Rusko" # todo: NEW TRANSLATION
 sov_medvedev.1.t: "Medveděv přebírá moc od Putina!" # todo: NEW TRANSLATION
 sov_medvedev.1.d: "Dmitrij Medveděv, původně dosazený do úřadu, aby obešel omezení prezidentských mandátů, nyní vystoupil z Putinova stínu. Po odstranění svého rivala stojí Medveděv sám v čele ruské moci. Začíná nová kapitola ruských dějin." # todo: CHANGED
 sov_medvedev.1.a: "Naše budoucnost je nejistá." # todo: NEW TRANSLATION
 sov_medvedev.5.t: "Diplomatická iniciativa odmítnuta" # todo: CHANGED
 sov_medvedev.5.d: "Naše diplomatická iniciativa byla odmítnuta. Cílový stát odmítl naše návrhy s odvoláním na obavy o suverenitu a politickou nezávislost." # todo: CHANGED
 sov_medvedev.5.a: "Neúspěch" # todo: CHANGED
 sov_student_rallies.t: "Vypukly studentské protesty" # todo: CHANGED
 sov_student_rallies.d: "Vysokoškolští studenti ve velkých městech vyšli do ulic a požadují politické reformy a větší občanské svobody. Protesty nabývají na rozsahu i intenzitě." # todo: CHANGED
 sov_student_rallies.a: "Potlačit protesty" # todo: CHANGED
 sov_student_rallies.b: "Dovolit jim demonstrovat" # todo: CHANGED
 SOV_putinism_system_protest: "Protest proti Putinovu systému" # todo: NEW TRANSLATION
 sov_medvedev.4.t: "Rusko navrhuje reset vztahů" # todo: NEW TRANSLATION
 sov_medvedev.4.d: "Nová ruská vláda, která zaujímá prozápadnější postoj než Putinův režim, nabídla obnovení vztahů. Její diplomaté navrhují nový začátek, „znovunačtení“ spolupráce." # todo: CHANGED
 sov_medvedev.4.a: "Jistě! Rusové mohou být dobří přátelé!" # todo: NEW TRANSLATION
 sov_medvedev.4.b: "S nimi nemůžeme být přátelé." # todo: NEW TRANSLATION
 sov_medvedev.6.t: "Putin a Medveděv vyhlašují duumvirát!" # todo: NEW TRANSLATION
 sov_medvedev.6.d: "Prezident a premiér Ruska společně oznámili, že budou vládnout v rámci formálního diarchátu. Tento bezprecedentní krok mění strukturu ruské moci." # todo: CHANGED
 sov_medvedev.6.a: "Dobře" # todo: NEW TRANSLATION
 sov_medvedev.7.t: "Nový ruský režim" # todo: NEW TRANSLATION
 sov_medvedev.7.d: "Náš prezident je na sociálních sítích stále hlasitější a vyjadřuje nové odvážné názory na Západ. Jeho rétorika se dramaticky změnila a signalizuje návrat Ruska na cestu sebevědomé nezávislosti." # todo: CHANGED
 sov_medvedev.7.a: "Nenávidím je, jsou to parchanti a degeneráti." # todo: NEW TRANSLATION
 sov_medvedev.8.t: "Ruský posun směrem k Západu" # todo: NEW TRANSLATION
 sov_medvedev.8.d: "Prezident oznámil odvážnou novou politiku. Rusko nyní nebude vnímat Západ jako nepřítele, ale jako životně důležitého partnera. Náš národ otevírá novou kapitolu." # todo: NEW TRANSLATION
 sov_medvedev.8.a: "Bůh žehnej Americe!... a Rusku!" # todo: NEW TRANSLATION
 SOV_kob_party_start: "Koncepční jednota strany" # todo: NEW TRANSLATION
 SOV_kob_party_start_desc: "Koncepční jednota strany vedená naším vizionářským vůdcem generálem Konstantinem Petrovem převzala moc. Je čas vést ideologickou válku proti Predictor Corrector a osvobodit Rusko z jeho skrytých řetězů." # todo: NEW TRANSLATION
 SOV_kobnod: "Ruské lidové hnutí za moc Boží" # todo: NEW TRANSLATION
 SOV_establish_militar_loyal: "Zajistit vojenskou loajalitu" # todo: NEW TRANSLATION
 SOV_establish_militar_loyal_desc: "Generál Petrov si musí zajistit úplnou loajalitu armády. Všechny složky mu musí přísahat věrnost jako Glavkoverchovi, vrchnímu veliteli celého Ruska." # todo: CHANGED
 SOV_establish_loyalistii: "Regionální loajalismus" # todo: NEW TRANSLATION
 SOV_establish_loyalistii_desc: "Musíme obsadit regionální pozice věrnými členy strany, abychom zajistili absolutní loajalitu a zabránili jakémukoli odporu vůči naší cestě." # todo: NEW TRANSLATION
 SOV_regional_control: "Očista oligarchie" # todo: NEW TRANSLATION
 SOV_regional_control_desc: "Oligarchové příliš dlouho vysáli život lidu. Nyní udeříme zpět a zbavíme zemi těchto parazitických elit." # todo: NEW TRANSLATION
 SOV_establish_new_religion: "Nová náboženská politika" # todo: NEW TRANSLATION
 SOV_establish_new_religion_desc: "Moderní organizovaná náboženství byla vytvořena k zotročení myslí a potlačování samostatného myšlení. Musíme osvobodit lid od tohoto duševního otroctví." # todo: NEW TRANSLATION
 SOV_internet_propaganda: "Propaganda na internetu" # todo: NEW TRANSLATION
 SOV_internet_propaganda_desc: "Málo kdo chápe skutečnou sílu internetu. Stejně jako Predictor Corrector před námi jej budeme využívat k přetvoření veřejného mínění a potlačení falešného povědomí." # todo: NEW TRANSLATION
 SOV_course_of_truth: "Kurz pravdy" # todo: NEW TRANSLATION
 SOV_course_of_truth_desc: "Příliš dlouho pravoslavné duchovenstvo skrývalo hlubší pravdy před lidmi. Nyní odhalíme tato tajemství a vyjevíme celou pravdu o naší historii." # todo: NEW TRANSLATION
 SOV_russian_knights: "Ruský vityaz" # todo: NEW TRANSLATION
 SOV_russian_knights_desc: "V srdci ruského ducha spočívá duše vityaze, ušlechtilého válečníka. Tito moderní rytíři, byť početní jen málo, nesou do bitvy odkaz Rusi." # todo: CHANGED
 SOV_new_cosmic_warfare: "Nové kosmické válčení" # todo: NEW TRANSLATION
 SOV_new_cosmic_warfare_desc: "Generál Petrov, specialista na vesmírné válčení, považuje hvězdy za další ruskou hranici. Musíme obnovit a rozvíjet dědictví sovětského vesmírného programu." # todo: CHANGED
 SOV_remaking_constitution: "Přepsání ústavy" # todo: NEW TRANSLATION
 SOV_remaking_constitution_desc: "Současná ústava omezuje naši vůli reformovat. Musí být zcela přepsána, aby odrážela naši vizi božské budoucnosti Ruska." # todo: CHANGED
 SOV_iron_hand_of_koba: "Stalinovské dědictví" # todo: NEW TRANSLATION
 SOV_iron_hand_of_koba_desc: "Stalin byl duchovním dědicem carů a architektem disciplinovaného, silného Ruska. Musíme obnovit jeho odkaz a kráčet po cestě, kterou vykoval." # todo: NEW TRANSLATION
 SOV_natural_bloshevism: "Přirozený bolševismus" # todo: NEW TRANSLATION
 SOV_natural_bloshevism_desc: "Pád carského režimu a vzestup bolševismu nebyly náhodami. Byly přirozeným vývojem našeho národa. Musíme tento osud plně přijmout." # todo: CHANGED
 SOV_slavic_reincarnation: "Slovanská reinkarnace" # todo: NEW TRANSLATION
 SOV_slavic_reincarnation_desc: "Skutečné duchovní probuzení leží v přesvědčeních našich předků. Všechna cizí náboženství musí být zrušena ve prospěch návratu k rodnému slovanskému pohanství." # todo: NEW TRANSLATION
 SOV_merge_pantheons: "Sjednotit se se Zvenyashie Kedry" # todo: NEW TRANSLATION
 SOV_merge_pantheons_desc: "Spojením se Zvenyashie Kedry můžeme smíchat naše posvátné víry do jediné mocné víry, která obstojí proti manipulacím Egyptských kněží." # todo: NEW TRANSLATION
 SOV_support_nod: "Podporovat NOD" # todo: NEW TRANSLATION
 SOV_support_nod_desc: "Hnutí NOD je silně proti západu. Jejich ideologie souzní s naší a měla by být integrována do naší administrativy." # todo: NEW TRANSLATION
 SOV_educational_water: "Mrtvá voda" # todo: NEW TRANSLATION
 SOV_educational_water_desc: "Mrtvá voda, nábožensko-politická doktrína inspirovaná ruským folklórem a původně vyvinutá tajemným Kněžským centrem SSSR, usiluje o duchovní oživení lidu. Nyní tvoří ideologický základ naší Koncepční jednoty strany." # todo: NEW TRANSLATION
 SOV_search_for_priests: "Pátrání po knězích" # todo: NEW TRANSLATION
 SOV_search_for_priests_desc: "Egyptští kněží příliš dlouho manipulovali světem ze stínů. Musíme odhalit jejich agenty ukryté v našich hranicích." # todo: NEW TRANSLATION
 SOV_purge_westernists: "Čistka západníků" # todo: NEW TRANSLATION
 SOV_purge_westernists_desc: "Západníci jsou slepí sluhové globálního kapitalismu. Jejich jedovatý vliv musí být vyloučen z naší vlády a společnosti." # todo: NEW TRANSLATION
 SOV_revolutions_in_other_slavic_states: "Bogorodičná revoluce" # todo: NEW TRANSLATION
 SOV_revolutions_in_other_slavic_states_desc: "Musíme rozšířit revoluci slovanskými zeměmi a osvobodit naše bratry od kontroly Prediktora Korektora. Věk osvobození nadešel." # todo: CHANGED
 SOV_seek_for_them_in_israel: "Hledat je v Izraeli" # todo: NEW TRANSLATION
 SOV_seek_for_them_in_israel_desc: "Podle generála Petrova mohou mít Egyptští kněží agenty i v Izraeli. Musíme tam vyšetřit a odhalit jejich skrytý vliv." # todo: NEW TRANSLATION
 SOV_seek_for_them_in_swiss: "Hledat je ve Švýcarsku" # todo: NEW TRANSLATION
 SOV_seek_for_them_in_swiss_desc: "O dlouho se šíří spekulace, že Švýcarsko je centrem Predictor Corrector. Prohledáme každý zákoutí, abychom našli pravdu." # todo: NEW TRANSLATION
 SOV_seek_for_them_in_egypt: "Hledat je v Egyptě" # todo: NEW TRANSLATION
 SOV_seek_for_them_in_egypt_desc: "Možná se Egyptští kněží skryli v kolébce své moci. Musíme hledat pravdu v jejich starobylé vlasti." # todo: NEW TRANSLATION
 SOV_kill_predictor_corrector: "Zabít Predictor Corrector!" # todo: NEW TRANSLATION
 SOV_kill_predictor_corrector_desc: "Odhalili jsme místo, kde se Prediktor Korektor nachází. Je čas zahájit naši svatou křížovou výpravu proti kapitalismu, manipulaci a nepřátelům pravdy." # todo: CHANGED
 SOV_semibankirshina_desc: "Semibankiršina, neboli 'skupina sedmi bankéřů', odkazuje na nejsilnější oligarchy, kteří kdysi měli obrovský vliv v ruské politice za éry Jelcina." # todo: NEW TRANSLATION
 SOV_enforce_oligarhic_rule: "Prosadit oligarchickou vládu" # todo: NEW TRANSLATION
 SOV_enforce_oligarhic_rule_desc: "Stát příliš dlouho utlačoval oligarchy a málo dělal pro ekonomický pokrok. Je čas přesunout moc k těm, kteří skutečně pohánějí růst." # todo: NEW TRANSLATION
 SOV_revive_oligarch_influence: "Oživit vliv oligarchů" # todo: NEW TRANSLATION
 SOV_revive_oligarch_influence_desc: "Je čas, aby se náš okruh oligarchů vrátil do popředí a znovu získal svůj vliv na ruskou vládu." # todo: CHANGED
 SOV_bring_the_old_gang_from_abroad: "Přivést starou gardu zpět ze zahraničí" # todo: NEW TRANSLATION
 SOV_bring_the_old_gang_from_abroad_desc: "Mnozí z našich bývalých spojenců byli nuceni do exilu. Nyní, kdy se situace změnila, je můžeme pozvat zpět a obnovit naše impérium vlivu." # todo: NEW TRANSLATION
 SOV_privatize_state_corporations: "Privatizovat státní korporace" # todo: NEW TRANSLATION
 SOV_privatize_state_corporations_desc: "Státní ekonomika pod Putinem byla neefektivní a nafouklá. Musíme tyto korporace rozebrat a vrátit je do soukromých rukou." # todo: NEW TRANSLATION
 SOV_move_oligarchic_entites_back_to_russia: "Přivést oligarchické subjekty zpět" # todo: NEW TRANSLATION
 SOV_move_oligarchic_entites_back_to_russia_desc: "Ruské bohatství ukryté v zahraničí musí vrátit domů. S naší ustálenou kontrolou můžeme tyto zdroje použít k financování zisku i pokroku." # todo: NEW TRANSLATION
 SOV_exploit_natural_wealth: "Využít přírodní bohatství Ruska" # todo: NEW TRANSLATION
 SOV_exploit_natural_wealth_desc: "Rusko disponuje obrovskými zásobami přírodních zdrojů. Budeme je těžit efektivně, udržíme lid spokojený a oligarchy bohaté." # todo: CHANGED
 SOV_semi_criminal_government: "Polokriminální vláda" # todo: NEW TRANSLATION
 SOV_semi_criminal_government_desc: "Oligarchové mají dlouhodobé vazby na organizovaný zločin. Proč s tím bojovat? Formalizujeme toto uspořádání a přivedeme je do vlády." # todo: NEW TRANSLATION
 SOV_end_lawsuits_against_oligarchs: "Ukončit soudní spory proti oligarchům" # todo: NEW TRANSLATION
 SOV_end_lawsuits_against_oligarchs_desc: "Putin vedl právní válku proti oligarchům, aby zajistil svou kontrolu. Ukončíme tuto nespravedlnost a obnovíme důstojnost našim nejúspěšnějším občanům." # todo: NEW TRANSLATION
 SOV_restore_semibankirshina: "Obnovit Semibankiršinu" # todo: NEW TRANSLATION
 SOV_restore_semibankirshina_desc: "Semibankirščina, sedm mocných bankéřů, se vrátila. Po odstranění Putina nyní stojí jednotně a jsou připraveni znovu utvářet osud Ruska." # todo: CHANGED
 SOV_back_to_the_west: "Návrat na Západ" # todo: NEW TRANSLATION
 SOV_back_to_the_west_desc: "Antagonizace Západu zdevastovala naši ekonomiku. Je čas opustit zastaralé nepřátelství studené války a budovat nová spojenectví pro prosperitu." # todo: CHANGED
 SOV_russian_laissez_faire: "Ruské Laissez-faire" # todo: NEW TRANSLATION
 SOV_russian_laissez_faire_desc: "Tržní kapitalismus se vrací do Ruska. Je čas na neomezené podnikání a bohatství pro ty, kteří jsou dost odvážní, aby se ho chopili." # todo: CHANGED
 SOV_oligarchs_democracy: "Oči poblíž svými sliby" # todo: NEW TRANSLATION
 SOV_oligarchs_democracy_desc: "Vítězství stran pro-oligarchů v volbách mnoho lidí šokovalo. Oči poblíž sliby, lid zvolil stejné elity, které kdysi rabovaly zemi v éře Jelcinovy." # todo: NEW TRANSLATION
 sov_oligarchs.1.t: "Přesuny ve vládě!" # todo: NEW TRANSLATION
 sov_oligarchs.1.d: "Oligarchové byli kdysi oslabeni, ale to už neplatí. Prezident jim ve snaze zajistit jejich podporu poskytl bezprecedentní vliv. Ministři loajální oligarchům přebírají moc a zahajují novou éru vlády elit." # todo: CHANGED
 sov_oligarchs.1.a: "Bůh chraň Rusko..." # todo: NEW TRANSLATION
 sov_oligarchs.2.t: "Guzinsky se vrací do Ruska!" # todo: NEW TRANSLATION
 sov_oligarchs.2.d: "Ruský mediální magnát Vladimir Gusinskij, kterého předchozí úřady kdysi vyhostily, se vrátil. Poměry se změnily a je vítán zpět." # todo: CHANGED
 sov_oligarchs.2.a: "Vítej zpět!" # todo: NEW TRANSLATION
 sov_oligarchs.3.t: "Berezovskij se vrací do Ruska!" # todo: NEW TRANSLATION
 sov_oligarchs.3.d: "Boris Berezovskij, jeden z nejbohatších a nejkontroverznějších ruských oligarchů, se vrátil. Je to jako v 90. letech." # todo: CHANGED
 sov_oligarchs.3.a: "Jako v 90. letech!" # todo: NEW TRANSLATION
 sov_oligarchs.4.t: "Semibankirshina uchvacuje moc v Rusku!" # todo: NEW TRANSLATION
 sov_oligarchs.4.d: "Vliv oligarchů dosáhl vrcholu. Sedm magnátů Jelcinovy éry rozdrtilo všechny soupeře a uchopilo moc. Budoucnost ruské vlády nyní spočívá v jejich rukou, otázkou však zůstává: kdo povede?" # todo: CHANGED
 sov_oligarchs.4.a: "Přímá vláda Rady!" # todo: NEW TRANSLATION
 sov_oligarchs.4.b: "Uspořádáme nové volby s jiným kandidátem." # todo: NEW TRANSLATION
 sov_oligarchs.4.c: "Můžeme zmanipulovat současného prezidenta." # todo: NEW TRANSLATION
 sov_oligarchs.5.t: "Soudem zmanipulované volby!" # todo: NEW TRANSLATION
 sov_oligarchs.5.d: "Abychom zlegitimizovali naši vládu, musíme uspořádat nové volby a zajistit vítězství strany Liberální Rusko. Jediným dilematem je výběr prezidentského kandidáta: loutka, nebo někdo z nás?" # todo: NEW TRANSLATION
 sov_oligarchs.5.a: "Nevzorov je náš kandidát!" # todo: NEW TRANSLATION
 sov_oligarchs.5.b: "Boris Berezovskij bude prezident." # todo: NEW TRANSLATION
 sov_oligarchs.5.c: "Michail Chodorkovskij bude prezident." # todo: NEW TRANSLATION
