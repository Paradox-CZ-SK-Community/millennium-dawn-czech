l_english:
 east_timor.1.t: "Krize roku 2006" # todo: NEW TRANSLATION
 east_timor.1.d: "Armáda Východního Timoru se rozštěpila podél regionálních linií. Téměř 600 vojáků ze západních okresů bylo propuštěno, což vyvolalo frakční násilí, které se šíří hlavním městem Dili. Vláda ztrácí kontrolu nad bezpečnostní situací." # todo: NEW TRANSLATION
 east_timor.1.a: "Požádat o mezinárodní mírovou pomoc" # todo: NEW TRANSLATION
 east_timor.1.b: "Obnovíme pořádek sami" # todo: NEW TRANSLATION
 east_timor.2.t: "Východní Timor žádá o mírové síly" # todo: NEW TRANSLATION
 east_timor.2.d: "Východní Timor upadl do frakčního násilí a žádá Austrálii o vojenskou pomoc s obnovením pořádku. Jako největší mocnost v regionu udá naše reakce tón mezinárodní intervenci." # todo: NEW TRANSLATION
 east_timor.2.a: "Nasadit Mezinárodní stabilizační síly" # todo: NEW TRANSLATION
 east_timor.2.b: "V tuto chvíli nemůžeme zasáhnout" # todo: NEW TRANSLATION
 east_timor.3.t: "Východní Timor žádá o pomoc" # todo: NEW TRANSLATION
 east_timor.3.d: "Naše bývalá kolonie Východní Timor žádá o vojenskou pomoc, protože se země propadá do chaosu. Portugalsko má vůči timorskému lidu historický závazek a silné vazby." # todo: NEW TRANSLATION
 east_timor.3.a: "Vyslat mírový kontingent" # todo: NEW TRANSLATION
 east_timor.3.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 east_timor.4.t: "Východní Timor žádá o pomoc" # todo: NEW TRANSLATION
 east_timor.4.d: "Východní Timor požádal Nový Zéland o pomoc s obnovením pořádku. Malý národ se potýká s rozsáhlým násilím a kolabujícím bezpečnostním aparátem." # todo: NEW TRANSLATION
 east_timor.4.a: "Vyslat mírové jednotky" # todo: NEW TRANSLATION
 east_timor.4.b: "Odmítnout" # todo: NEW TRANSLATION
 east_timor.5.t: "Krize ve Východním Timoru" # todo: NEW TRANSLATION
 east_timor.5.d: "Východní Timor požádal Malajsii o mírové síly, které by pomohly stabilizovat zemi. Jako spřátelená jihovýchodoasijská země by účast Malajsie demonstrovala regionální solidaritu." # todo: NEW TRANSLATION
 east_timor.5.a: "Nasadit jednotky do Dili" # todo: NEW TRANSLATION
 east_timor.5.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 east_timor.6.t: "Australské síly dorazily" # todo: NEW TRANSLATION
 east_timor.6.d: "Australské mírové síly dorazily do Dili a obnovují pořádek v hlavním městě. Mezinárodní stabilizační síly tvoří páteř mírové operace." # todo: NEW TRANSLATION
 east_timor.6.a: "Jsme vděční" # todo: NEW TRANSLATION
 east_timor.7.t: "Dorazily portugalské síly" # todo: NEW TRANSLATION
 east_timor.7.d: "Portugalské jednotky byly nasazeny ve Východním Timoru, čímž plní historický závazek vůči své bývalé kolonii." # todo: NEW TRANSLATION
 east_timor.7.a: "Vítejte, přátelé" # todo: NEW TRANSLATION
 east_timor.8.t: "Dorazily novozélandské mírové síly" # todo: NEW TRANSLATION
 east_timor.8.d: "Nový Zéland vyslal mírový kontingent, aby pomohl stabilizovat Východní Timor." # todo: NEW TRANSLATION
 east_timor.8.a: "Jejich pomoc si ceníme" # todo: NEW TRANSLATION
 east_timor.9.t: "Dorazily malajsijské jednotky" # todo: NEW TRANSLATION
 east_timor.9.d: "Malajsijské síly dorazily, aby pomohly mírové operaci ve Východním Timoru." # todo: NEW TRANSLATION
 east_timor.9.a: "Děkujeme Malajsii" # todo: NEW TRANSLATION
 east_timor.10.t: "Pátrání po Alfredovi Reinadovi" # todo: NEW TRANSLATION
 east_timor.10.d: "Vůdce povstalců Alfredo Reinado unikl úřadům a ukrývá se v horách jižně od Dili. Jeho pokračující svoboda podkopává autoritu vlády a dodává odvahu dalším disidentským frakcím." # todo: NEW TRANSLATION
 east_timor.10.a: "Požádat Austrálii o vyslání speciálních jednotek" # todo: NEW TRANSLATION
 east_timor.10.b: "Pátrat po něm vlastními silami" # todo: NEW TRANSLATION
 east_timor.11.t: "Východní Timor žádá o pomoc SAS" # todo: NEW TRANSLATION
 east_timor.11.d: "Východní Timor požádal Austrálii o nasazení jednotek pluku Special Air Service k zajetí uprchlého vůdce povstalců Alfreda Reinada, který stále uniká mírovým silám." # todo: NEW TRANSLATION
 east_timor.11.a: "Vyslat SAS" # todo: NEW TRANSLATION
 east_timor.11.b: "To přesahuje náš mandát" # todo: NEW TRANSLATION
 east_timor.12.t: "Reinado uniká" # todo: NEW TRANSLATION
 east_timor.12.d: "Navzdory operaci australských speciálních jednotek Alfredo Reinado uprchl do hor. Operace ho nedokázala zadržet, ale širší mezinárodní přítomnost stabilizovala bezpečnostní situaci v Dili." # todo: NEW TRANSLATION
 east_timor.12.a: "Dříve či později bude nalezen" # todo: NEW TRANSLATION
 east_timor_news.1.t: "Východní Timor žádá o mezinárodní mírové síly" # todo: NEW TRANSLATION
 east_timor_news.1.desc: "Východní Timor formálně požádal o mezinárodní mírovou pomoc poté, co frakční násilí v hlavním městě Dili připravilo o život či domov stovky lidí. Austrálie, Portugalsko, Nový Zéland a Malajsie byly požádány o vyslání jednotek do Mezinárodních stabilizačních sil." # todo: NEW TRANSLATION
 east_timor_news.1.a: "Spoléháme na pomoc světa" # todo: NEW TRANSLATION
 east_timor_news.1.b: "Obnovíme v Dili pořádek" # todo: NEW TRANSLATION
 east_timor_news.1.c: "Stabilita v regionu je v našem zájmu" # todo: NEW TRANSLATION
 east_timor_news.1.d: "Malý národ v krizi" # todo: NEW TRANSLATION
