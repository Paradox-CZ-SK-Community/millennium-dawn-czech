l_english:
 TAI_legacy_of_1949: "Dědictví roku 1949" # todo: NEW TRANSLATION
 TAI_legacy_of_1949_desc: "Konec čínské občanské války v roce 1949 přiměl nacionalistický Kuomintang (KMT) a jeho stoupence uprchnout na ostrovní provincii Tchaj-wan. Dědictví této události spolu s místním, nativistickým tchajwanským hnutím vedlo k silnému odmítání sjednocení s pevninou většinou tchajwanských občanů." # todo: NEW TRANSLATION
 TAI_the_great_chip_empire: "Velká čipová říše" # todo: NEW TRANSLATION
 TAI_the_great_chip_empire_desc: "Tchaj-wan využil výrobu polovodičů a mikročipů již v jejích počátcích a stal se atraktivnější investicí než jiné země. Tím se katapultoval do čela tohoto odvětví. Díky levné a efektivní výrobě a rozsáhlému vývozu do západních zemí Tchaj-wan vyvážil svou ekonomiku a národní bezpečnost na dodávkách mikročipů západnímu světu a díky neustálým a pravidelným inovacím zůstává lídrem odvětví." # todo: NEW TRANSLATION
 USA_tsmc_access_modifier: "Přístup k TSMC" # todo: NEW TRANSLATION
 USA_tsmc_access_modifier_desc: "Americký průmysl těží ze spolehlivého přístupu k tchajwanskému ekosystému polovodičů. Tento přínos je pozastaven, pokud Tchaj-wan přestane existovat, ztratí kontrolu nad Tchaj-pejem, vstoupí do války se Spojenými státy nebo omezí vývoz polovodičů." # todo: NEW TRANSLATION
 TAI_tsmc_trade_benefits_tier_1_tt: "Rozvoj TSMC zvyšuje §YResources per Factory§! na §G+1§! pro §YTchaj-wan§! a §YSpojené státy§!. Americký přínos vyžaduje pokračující přístup k Tchaj-wanu." # todo: NEW TRANSLATION
 TAI_tsmc_trade_benefits_tier_2_tt: "Rozvoj TSMC zvyšuje §YResources per Factory§! na §G+2§! pro §YTchaj-wan§! a §YSpojené státy§!. Americký přínos vyžaduje pokračující přístup k Tchaj-wanu." # todo: NEW TRANSLATION
 TAI_tsmc_trade_benefits_tier_3_tt: "Rozvoj TSMC zvyšuje §YResources per Factory§! na §G+3§! pro §YTchaj-wan§! a §YSpojené státy§!. Americký přínos vyžaduje pokračující přístup k Tchaj-wanu." # todo: NEW TRANSLATION
 TAI_flight_crew_strike: "Stávka palubního personálu v Tchaj-jüanu" # todo: MOVED KEY
 TAI_flight_crew_strike_desc: "Žádné výsledky! Žádné zastavení!" # todo: MOVED KEY
 TAI_foxconn_ev_pipeline: "Potenciál elektromobilů bez objemu" # todo: NEW TRANSLATION
 TAI_foxconn_ev_pipeline_desc: "Referenční vozidla a partnerské programy vytvářejí technické možnosti, ale ověřené produkty a solventní zákazníci zůstávají vzácní. Kapitál je vázán ještě předtím, než dorazí spolehlivý objem výroby." # todo: NEW TRANSLATION
 TAI_foxconn_factory_behind_brand: "Továrna za značkou" # todo: NEW TRANSLATION
 TAI_foxconn_factory_behind_brand_desc: "Hon Hai/Foxconn proměňuje návrhy zákazníků v opakovatelnou výrobu prostřednictvím nástrojů, nákupu, procesního inženýrství, testování a logistiky. Její obrovská průchodnost zůstává omezena nízkými maržemi a mocnými klienty." # todo: NEW TRANSLATION
 TAI_foxconn_factory_city_production: "Výroba v továrním městě" # todo: NEW TRANSLATION
 TAI_foxconn_factory_city_production_desc: "Husté sítě dodavatelů, ubytovny, doprava a průmyslové služby umožňují rychlé navyšování výroby. Soustředění práce i každodenního života do několika kampusů zároveň zesiluje rizika spojená s pracovní silou a narušením provozu." # todo: NEW TRANSLATION
 TAI_foxconn_resilient_manufacturing_network: "Odolná výrobní síť" # todo: NEW TRANSLATION
 TAI_foxconn_resilient_manufacturing_network_desc: "Síť Build, Operate, Localize propojuje kvalifikovaná regionální centra a zároveň zachovává cenné kapacity na pevnině. Redundance zlepšuje přístup na trh a obnovu po krizích za cenu trvalé potřeby koordinace." # todo: NEW TRANSLATION
 taiwan.300.a: "Vybudovat nejhustší síť na pevnině" # todo: NEW TRANSLATION
 taiwan.300.b: "Prosazovat vlastní značku místo výroby pro ostatní" # todo: NEW TRANSLATION
 taiwan.300.d: "Do roku 2000 se Hon Hai/Foxconn sídlící na Tchaj-wanu stal zavedeným výrobcem elektroniky s rychle se rozšiřujícím výrobním systémem na pevnině. Vedení se musí rozhodnout, zda bude ve velkém pokračovat ve výrobě pro značky jiných společností, nebo zda stejný kapitál vynaloží na vybudování vlastní značky." # todo: NEW TRANSLATION
 taiwan.300.t: "Továrna za značkou" # todo: NEW TRANSLATION
 taiwan.301.a: "Zvyšovat standardy a opatrně automatizovat" # todo: NEW TRANSLATION
 taiwan.301.b: "Držet náklady na uzdě a přesunout výrobu do vnitrozemí" # todo: NEW TRANSLATION
 taiwan.301.d: "Shluk úmrtí pracovníků v kampusu Foxconnu Longhua v Šen-čenu a zprávy o jejich strádání přitáhly pozornost k pracovní době, odměňování, bezpečnosti a životu v systému továrních měst. Příčiny jsou sporné, potřeba institucionální reakce nikoli." # todo: NEW TRANSLATION
 taiwan.301.t: "Šenčenská pracovní krize" # todo: NEW TRANSLATION
 taiwan.302.a: "Soustředit systém uvedení na trh v Čeng-čou" # todo: NEW TRANSLATION
 taiwan.302.b: "Vybudovat několik výrobních center ve vnitrozemí" # todo: NEW TRANSLATION
 taiwan.302.d: "Čeng-čou nabízí Foxconnu infrastrukturu, podporu náboru a dostatek prostoru pro obrovský výrobní kampus ve vnitrozemí. Projekt může vytvořit mimořádnou kapacitu pro uvedení iPhonu na trh, zároveň však prohloubí závislost na jednom zákazníkovi, místě a politickém prostředí." # todo: NEW TRANSLATION
 taiwan.302.t: "Město iPhonu" # todo: NEW TRANSLATION
 taiwan.303.a: "Vést rekapitalizaci Sharpu" # todo: NEW TRANSLATION
 taiwan.303.b: "Zachovat strategické partnerství" # todo: NEW TRANSLATION
 taiwan.303.d: "Sharp potřebuje partnera pro rekapitalizaci, zatímco Foxconn chce odborné znalosti v oblasti displejů, inženýry a užší vztah v oblasti komponentů. Kontrola by znamenala obtížnou japonskou restrukturalizaci, nikoli okamžitý převod technologií." # todo: NEW TRANSLATION
 taiwan.303.t: "Sharp na pokraji" # todo: NEW TRANSLATION
 taiwan.304.a: "Zavázat se k wisconsinskému projektu" # todo: NEW TRANSLATION
 taiwan.304.b: "Omezit projekt ještě před výstavbou" # todo: NEW TRANSLATION
 taiwan.304.d: "Washington odpověděl na návrh Foxconnu. Společnost se nyní musí rozhodnout, zda dostupná podpora ospravedlňuje plný závazek, nebo zda by měl být projekt omezen ještě před položením základů." # todo: NEW TRANSLATION
 taiwan.304.t: "Wisconsinský závazek" # todo: NEW TRANSLATION
 taiwan.305.a: "Výrobní síť, kterou nedokáže zlomit jediný otřes" # todo: NEW TRANSLATION
 taiwan.305.b: "Dodavatel pro éru elektromobilů" # todo: NEW TRANSLATION
 taiwan.305.c: "Tovární město vybudované kolem jediného uvedení produktu" # todo: NEW TRANSLATION
 taiwan.305.e: "Továrna za značkou všech ostatních" # todo: NEW TRANSLATION
 taiwan.305.d: "Kompletní AI racky kombinují desky, akcelerátory, napájení, chlazení, kabely a náročnou systémovou validaci a Nvidia chce, aby je Foxconn sestavoval. Čtvrt století růstu, krizí a diverzifikace již rozhodlo, jaký typ výrobce se této práce ujme." # todo: NEW TRANSLATION
 taiwan.305.t: "Továrna na AI" # todo: NEW TRANSLATION
 taiwan.310.t: "Dvanáct palců skrze krizi" # todo: NEW TRANSLATION
 taiwan.310.d: "Kolaps polovodičového průmyslu vyprázdnil čisté prostory, jejichž výstavba stála miliardy, a provozovna TSMC nevydělává nic, když stojí. Přechod na 300mm wafery by snížil náklady na každý wafer, ale až po letech pořizování zařízení, integrace a trpělivé práce na výtěžnosti. Vybudovat Fab 12 nyní znamená postavit ji na trh, který přestal nakupovat." # todo: NEW TRANSLATION
 taiwan.310.a: "Financovat náběh 300mm výroby během poklesu" # todo: NEW TRANSLATION
 taiwan.310.b: "Uchovat hotovost, dokud se nevrátí poptávka" # todo: NEW TRANSLATION
 taiwan.311.t: "Plány bez zrady" # todo: NEW TRANSLATION
 taiwan.311.d: "Zákazníci TSMC potřebují návrhové sady, knihovny, nástroje a kvalifikační data, aby mohli cokoli vyrábět v našem procesu, a každý z nich soutěží s ostatními. Open Innovation Platform by všem poskytla stejné materiály, aniž by kterémukoli z nich předala návrh konkurenta. Důvěra je produktem, který se zde vyrábí." # todo: NEW TRANSLATION
 taiwan.311.a: "Zveřejnit sady a otevřít platformu" # todo: NEW TRANSLATION
 taiwan.311.b: "Udržovat každý vztah se zákazníkem bilaterální" # todo: NEW TRANSLATION
 taiwan.312.t: "Mobilní kotva" # todo: NEW TRANSLATION
 taiwan.312.d: "Apple chce pro A8 více kapacity pokročilé výroby než většina ostatních zákazníků TSMC dohromady a zaplatí za její rezervaci s předstihem několika let. Tento objem by sám financoval další výrobní uzel. Zároveň by však způsobil, že osud slévárny bude záviset na produktovém cyklu jediné společnosti." # todo: NEW TRANSLATION
 taiwan.312.a: "Rezervovat pokročilou kapacitu pro klíčového zákazníka" # todo: NEW TRANSLATION
 taiwan.312.b: "Trvat na neutralitě slévárny" # todo: NEW TRANSLATION
 taiwan.313.t: "Arizona: Pojištění za cenu" # todo: NEW TRANSLATION
 taiwan.313.d: "Washington chce výrobu waferů pokročilé technologie na americké půdě, je ochoten pomoci za ně zaplatit a TSMC je společností, na kterou se obrátil. Oznámení není továrna: zařízení, inženýři, voda i zákazníci musí dorazit dříve, než vznikne jediný kvalifikovaný wafer, a v Arizoně každý z nich stojí více než v Sin-ču. Pojištění je skutečné a stejně tak i příplatek." # todo: NEW TRANSLATION
 taiwan.313.a: "Zavázat se k zámořským továrnám" # todo: NEW TRANSLATION
 taiwan.313.b: "Ponechat pokročilou výrobu na ostrově" # todo: NEW TRANSLATION
 taiwan.314.t: "Čipy jsou úzkým hrdlem" # todo: NEW TRANSLATION
 taiwan.314.d: "Výrobci automobilů, spotřebitelské značky i zákazníci z oblasti výpočetní techniky soupeří o produkci TSMC, která neexistuje, a jejich vlády začaly telefonovat samy. Přenechání přídělu státu by získalo značnou přízeň v důležitých metropolích. Zároveň by každému zákazníkovi sdělilo, že o jeho místě ve frontě nyní rozhoduje fronta, kterou nevidí." # todo: NEW TRANSLATION
 taiwan.314.a: "Nechat stát řídit příděl" # todo: NEW TRANSLATION
 taiwan.314.b: "Ponechat příděl komerční" # todo: NEW TRANSLATION
 taiwan.315.t: "Omezení CoWoS" # todo: NEW TRANSLATION
 taiwan.315.d: "Wafer již není hlavním problémem. Akcelerátory potřebují pokročilé pouzdření, vrstvenou paměť a substráty, než získají jakoukoli hodnotu, a kapacita CoWoS společnosti TSMC zdaleka nestačí. Vybudování této kapacity promění waferovou slévárnu v něco většího a zavede nás do podniků, v nichž dnes působí naši vlastní zákazníci." # todo: NEW TRANSLATION
 taiwan.315.a: "Vybudovat z pokročilého pouzdření samostatný podnik" # todo: NEW TRANSLATION
 taiwan.315.b: "Zůstat čistou waferovou slévárnou" # todo: NEW TRANSLATION
 taiwan.316.t: "Jaký typ slévárny jsme vybudovali?" # todo: NEW TRANSLATION
 taiwan.316.d: "Pětadvacet let výrobních uzlů, poklesů, klíčových zákazníků a zahajování zámořské výstavby rozhodlo, čím TSMC je, co ostrov skutečně vyrábí a kdo určuje jeho směřování." # todo: NEW TRANSLATION
 taiwan.316.a: "Slévárna řízená státem" # todo: NEW TRANSLATION
 taiwan.316.b: "Důvěryhodná síť spojenců" # todo: NEW TRANSLATION
 taiwan.316.c: "Systémová slévárna, nikoli waferová dílna" # todo: NEW TRANSLATION
 taiwan.316.e: "Čistá slévárna a nic víc" # todo: NEW TRANSLATION
 TAI_tsmc_state_directed_foundry: "Státem řízená slévárna" # todo: NEW TRANSLATION
 TAI_tsmc_state_directed_foundry_desc: "Příděl prochází ministerstvem dříve než prodejní kanceláří a fronta je otázkou politiky. Kapacita se nejprve řídí zájmy ostrova a teprve poté jeho zákazníků, čehož si zákazníci všimli." # todo: NEW TRANSLATION
 TAI_tsmc_trusted_allied_foundry_network: "Důvěryhodná síť spojeneckých sléváren" # todo: NEW TRANSLATION
 TAI_tsmc_trusted_allied_foundry_network_desc: "Zařízení v Arizoně, Kumamotu a Drážďanech byla kvalifikována a uvedena do provozu, takže pokročilá výroba již není jediným bodem na jediném ostrově. Náklady na wafer jsou vyšší než při soustředění všeho doma, ale získáváme něco, co by koncentrace nikdy nedokázala." # todo: NEW TRANSLATION
 TAI_tsmc_systems_foundry_platform: "Platforma systémové slévárny" # todo: NEW TRANSLATION
 TAI_tsmc_systems_foundry_platform_desc: "Wafery, pouzdření, vrstvená paměť a testování nyní odcházejí jako jediný kvalifikovaný produkt. Slévárna prodává hotovou schopnost namísto vrstvy pod ní, což je ostatně místo, kam se omezení přesunulo." # todo: NEW TRANSLATION
 TAI_tsmc_disciplined_pure_play_foundry: "Disciplinovaná čistá slévárna" # todo: NEW TRANSLATION
 TAI_tsmc_disciplined_pure_play_foundry_desc: "Žádné značky, žádné produkty, žádná konkurence lidem, kteří od nás nakupují. Disciplína, díky níž model fungoval, je samotným modelem a byla zachována přesně tak, jak byla." # todo: NEW TRANSLATION
 taiwan.320.t: "Acer odděluje značku od továrny" # todo: NEW TRANSLATION
 taiwan.320.d: "Když Acer vyrábí počítače jiných společností a prodává vlastní ve stejných regálech, zákazníci tento konflikt vidí na faktuře. Oddělení výroby do společnosti Wistron by každé polovině umožnilo usilovat o zakázky, o které by druhá připravila sama sebe. Zároveň však společnost rozděluje ve chvíli, kdy je konečně velká." # todo: NEW TRANSLATION
 taiwan.320.a: "Oddělit značku od továrny" # todo: NEW TRANSLATION
 taiwan.320.b: "Ponechat jednoho integrovaného výrobce" # todo: NEW TRANSLATION
 taiwan.321.t: "Otázka x86 je vyřešena" # todo: NEW TRANSLATION
 taiwan.321.d: "Léta soudních sporů mezi společnostmi VIA Technologies a Intel o instrukční sady a čipové sady končí desetiletou křížovou licencí namísto vítězství u soudu. Podmínky zajišťují právo VIA pokračovat ve výrobě, za podmínek stanovených zavedeným hráčem. Třetí dodavatel x86 zůstává právně možný a komerčně nepravděpodobný." # todo: NEW TRANSLATION
 taiwan.321.a: "Urovnat spor a zajistit licenci" # todo: NEW TRANSLATION
 taiwan.321.b: "Trvat na lepších podmínkách" # todo: NEW TRANSLATION
 taiwan.322.t: "Republika hráčů" # todo: NEW TRANSLATION
 taiwan.322.d: "Kupci komponent, kteří si vybírají vlastní základní desky, zaplatí prémii za součástky, které dávají svou příslušnost najevo. Uvedení specializované řady Republic of Gamers společností ASUS by přineslo marže, jaké komoditní podnik nikdy nepozná, a vyžaduje marketing, podporu a návrh, kterým se dodavatel komponent dosud nemusel zabývat." # todo: NEW TRANSLATION
 taiwan.322.a: "Vybudovat prémiovou značku" # todo: NEW TRANSLATION
 taiwan.322.b: "Zůstat dodavatelem komponent" # todo: NEW TRANSLATION
 taiwan.323.t: "Druhé oddělení" # todo: NEW TRANSLATION
 taiwan.323.d: "Stejný konflikt, který rozdělil Acer, nyní rozděluje jeho konkurenta: značka nemůže růst, když továrna slouží konkurentům této značky. Vyčlenění výrobní divize vytvoří jednoho z největších smluvních výrobců na světě. Zároveň však odevzdá továrnu, která značku umožnila." # todo: NEW TRANSLATION
 taiwan.323.a: "Vyčlenit výrobní divizi" # todo: NEW TRANSLATION
 taiwan.323.b: "Ponechat značku a továrnu pohromadě" # todo: NEW TRANSLATION
 taiwan.324.t: "Malý počítač pro každého" # todo: NEW TRANSLATION
 taiwan.324.d: "Netbook, který ASUS zahájil modelem Eee PC, se stal nejrychleji prodávanou kategorií výpočetní techniky a každý tchajwanský výrobce dokáže do víkendu vyrobit levný, lehký a nedostatečně výkonný notebook. Marže jsou mizerné a objemy obrovské. Zda jde o budoucnost tohoto odvětví, nebo o módní výstřelek, který naučí zákazníky nic neočekávat, zatím není jasné." # todo: NEW TRANSLATION
 taiwan.324.a: "Usilovat o přechod k mobilitě" # todo: NEW TRANSLATION
 taiwan.324.b: "Bránit marže stolních počítačů" # todo: NEW TRANSLATION
 taiwan.325.t: "Tlak na marže" # todo: NEW TRANSLATION
 taiwan.325.d: "Telefony získaly objem, značky regály a Acer, ASUS i další výrobci na ostrově soupeří o zbytek zmenšujícího se trhu. Koordinace odvětví shora by jim zabránila ve vzájemném podbízení. Znamenala by však také rozhodování na ministerstvu o tom, kdo z nich si zaslouží přežít." # todo: NEW TRANSLATION
 taiwan.325.a: "Koordinovat odvětví shora" # todo: NEW TRANSLATION
 taiwan.325.b: "Nechat trh, aby je konsolidoval" # todo: NEW TRANSLATION
 taiwan.326.t: "Zhodnocení tchajwanského ekosystému výpočetní techniky" # todo: NEW TRANSLATION
 taiwan.326.d: "Čtvrt století rozdělování, vyčleňování, prémiových značek a cenových válek rozhodlo, čím Acer, ASUS, Quanta a zbytek tchajwanského počítačového průmyslu jsou: čí jméno je na krabici a čí továrna za ním stojí." # todo: NEW TRANSLATION
 taiwan.326.a: "Komplexní ekosystém výpočetní techniky" # todo: NEW TRANSLATION
 taiwan.326.b: "Mocnost značkových systémů" # todo: NEW TRANSLATION
 taiwan.326.c: "Globální společenství komponent" # todo: NEW TRANSLATION
 taiwan.326.e: "Tlak na marže, kterému nikdo neunikl" # todo: NEW TRANSLATION
 TAI_pc_full_spectrum_computing_ecosystem: "Komplexní ekosystém výpočetní techniky" # todo: NEW TRANSLATION
 TAI_pc_full_spectrum_computing_ecosystem_desc: "Komponenty, smluvní výroba a hotové značky byly udržovány v jednom koordinovaném odvětví, místo aby se nechaly navzájem roztrhat. Ostrov vyrábí každou vrstvu počítače a záměrně mezi nimi volí." # todo: NEW TRANSLATION
 TAI_pc_branded_systems_powerhouse: "Mocnost značkových systémů" # todo: NEW TRANSLATION
 TAI_pc_branded_systems_powerhouse_desc: "Názvy na krabicích jsou tchajwanské a přinášejí prémii, což je postavení, jakého žádný dodavatel komponent nedosáhne. Značky se drží pozorností, která je pronajatá, nikoli vlastněná." # todo: NEW TRANSLATION
 TAI_pc_global_component_commonwealth: "Globální společenství komponent" # todo: NEW TRANSLATION
 TAI_pc_global_component_commonwealth_desc: "Téměř každý počítač prodávaný kdekoli obsahuje součástky vyrobené zde pod jménem někoho jiného. Objemy jsou mimořádné a marže patří tomu, kdo na výrobek umístí svůj odznak." # todo: NEW TRANSLATION
 TAI_pc_fragmented_margin_squeeze: "Roztříštěný tlak na marže" # todo: NEW TRANSLATION
 TAI_pc_fragmented_margin_squeeze_desc: "Příliš mnoho schopných firem usilovalo o stejný zmenšující se trh a po celou dobu se vzájemně podbí﻿zelo. Inženýrská kvalita nikdy nepřestala být vysoká; ceny však nepřestaly klesat." # todo: NEW TRANSLATION
