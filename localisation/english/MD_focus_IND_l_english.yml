 IND_finished_disaster_desc: "Páni, podařilo se vám včas předejít poslední katastrofě! Skvělá práce." # todo: NEW TRANSLATION
 IND_aceh_in_turmoil: "Aceh v nepokojích!" # todo: NEW TRANSLATION
 IND_aceh_in_turmoil_desc: "Aceh je od roku 1976 ve stavu chaosu a povstání, což našemu národu způsobuje nestabilitu a zbytečné krveprolití. Naše armáda se příliš soustředí na boj s těmito povstalci, a proto vojensky zaostáváme\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud v roce 2004 §Huzavřeme příměří s Acehem§!." # todo: CHANGED
 IND_rupiah_crisis: "Rupiah krize" # todo: NEW TRANSLATION
 IND_rupiah_crisis_desc: "Rupie, měna našeho národa, je velmi slabá. Je to důsledek desetiletí korupce a špatného řízení a nastal čas to napravit a vrátit naši ekonomiku na světovou scénu." # todo: CHANGED
