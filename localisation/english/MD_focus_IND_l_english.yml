 indonesia.76854.t: "Indonésie žádá o anexi" # todo: NEW TRANSLATION
 indonesia.76854.d: "Poté, co nám pomohli po zemětřesení, indonéská vláda žádá, abychom s nimi spojili síly. If we join them, we will lose everything we had fought for, but all in the name of peace. Pokud se k nim nepřipojíme, dojde k znovu rozhoření konfliktu..." # todo: NEW TRANSLATION
 indonesia.76854.a: "Pojďme na to" # todo: NEW TRANSLATION
 indonesia.76854.b: "Ne" # todo: NEW TRANSLATION
 IND_disasters_mechanic: "Indonésie má děsivou smůlu" # todo: NEW TRANSLATION
 IND_disasters_mechanic_desc: "Indonésie má velké štěstí, že disponuje bohatými přírodními zdroji, pracovní silou a odhodláním projít 21. stoletím.\nIndonésie však čelí mnoha výzvám, které brzdí její pokrok. Nehody jsou běžné a snadno by se jim dalo zabránit lepší péčí o konkrétní region.\n\nZ tohoto důvodu je naší povinností a odpovědností věnovat včas větší pozornost našim státům, abychom předešli katastrofálnímu osudu, který by nám způsobil vážné škody.\n\nPo značnou dobu budeme čelit dalším katastrofám, pokud se s nimi však rychle vypořádáme, po nějakém čase nakonec ustanou!" # todo: CHANGED
 IND_back_muslim: "Podpora muslimů" # todo: NEW TRANSLATION
 IND_back_muslim_desc: "Jsme islámská země! Proto musíme chránit naše muslimy za jakoukoli cenu. Tímto získáme popularitu a odstraníme nenávist vůči nám ve většinově islámské Sulawesi.\n\nVyjednávání je neocenitelné a musí začít okamžitě!" # todo: NEW TRANSLATION
