l_english:
 indonesia_focus: "Indonéský strom zaměření" # todo: NEW TRANSLATION
 IND_indonesias_future: "Budoucnost Indonésie" # todo: NEW TRANSLATION
 IND_indonesias_future_desc: "Jak naše země vstupuje do 21. století se všemi svými problémy, musíme najít způsoby, jak je řešit a naší zemi dopřát tolik potřebnou lásku, kterou si zaslouží." # todo: NEW TRANSLATION
 IND_asia_financial_crisis: "Zvládnout krizi!" # todo: NEW TRANSLATION
 IND_asia_financial_crisis_desc: "Finanční krize tvrdě zasáhla jihovýchodní Asii již v roce 1997 a náš národ nebyl ušetřen jejích ochromujících dopadů. Nyní přistoupíme k vytvoření plánu, jak tento problém vyřešit." # todo: CHANGED
 IND_grasberg_mine_exploitation: "Využití dolu Grasberg" # todo: NEW TRANSLATION
 IND_grasberg_mine_exploitation_desc: "Důl Grasberg na Západní Papui je jedním z největších dolů na světě z hlediska zlata a mědi. Měli bychom rozšířit a využít zásoby v této oblasti, abychom Indonésii lépe otevřeli trh se vzácnými kovy." # todo: NEW TRANSLATION
 IND_japanese_aid: "Výzva k japonské pomoci" # todo: NEW TRANSLATION
 IND_japanese_aid_desc: "Navzdory našim rozdílům během druhé světové války bylo Japonsko v našich ekonomických potížích poměrně laskavé. Měli bychom je a jejich západní spojence kontaktovat a požádat je o pomoc z této situace." # todo: CHANGED
 IND_japanese_aid_jica: "JICA" # todo: NEW TRANSLATION
 IND_japanese_aid_jica_desc: "JICA, známá také jako Japonská agentura pro mezinárodní spolupráci, může být velmi užitečnou organizací při rozvoji infrastruktury a silnic našeho národa." # todo: CHANGED
 IND_japanese_aid_metro_invest: "Japonské investice do metra" # todo: NEW TRANSLATION
 IND_japanese_aid_metro_invest_desc: "Naši lidé se potřebují po národě pohybovat rychle a s japonskou technologií metra a investicemi můžeme tohoto cíle dosáhnout." # todo: CHANGED
 IND_japanese_aid_java_airport: "Letiště Západní Jávy" # todo: NEW TRANSLATION
 IND_japanese_aid_java_airport_desc: "Potřebujeme více letišť pro rostoucí počet našich letců a turistů. Západní Jáva je nejlepším místem pro jejich výstavbu, protože se zde nachází hlavní město našeho národa." # todo: CHANGED
 IND_japanese_aid_ev: "Japonské elektrické vozy" # todo: NEW TRANSLATION
 IND_japanese_aid_ev_desc: "Japonsko je lídrem v elektrických vozidlech a s množstvím skvělých automobilů vyráběných v Japonsku je nejlepší zahájit proces přechodu našeho obyvatelstva na elektromobily, aby se snížilo znečištění." # todo: NEW TRANSLATION
 IND_japanese_aid_mitsubishi: "Továrny Mitsubishi" # todo: NEW TRANSLATION
 IND_japanese_aid_mitsubishi_desc: "Mitsubishi je úspěšný výrobce vozidel se sídlem v Japonsku. Pokud se nám podaří přivést jejich kanceláře sem do Indonésie, možná se od nich naučíme něco o automobilech." # todo: CHANGED
 IND_japanese_aid_expander_bagero: "Expander a Bagero!" # todo: NEW TRANSLATION
 IND_japanese_aid_expander_bagero_desc: "Expander a Bagero jsou skutečným zázrakem důvtipu a řemeslného zpracování, opravdovými divy průmyslu elektrických vozidel, která jsou nyní dostupná Indonésanům." # todo: CHANGED
 IND_japanese_aid_inf_finance: "Dohody IIF se Japonskem" # todo: NEW TRANSLATION
 IND_japanese_aid_inf_finance_desc: "IIF, známá také jako Indonesia Infrastructure Finance, je soukromá společnost. Pokud jde o budování infrastruktury našeho národa, je však nejlepší uzavírat dohody s Japonskem a šetřit náklady, nikoli kvalitu." # todo: CHANGED
 IND_japanese_aid_men_for_finance: "Japonská pracovní síla pro IIF" # todo: NEW TRANSLATION
 IND_japanese_aid_men_for_finance_desc: "Pokud se nám podaří získat pro IIF pracovní sílu z Japonska, můžeme prohloubit vzájemné vztahy a využít jejich odborné znalosti ke zlepšení naší infrastruktury." # todo: CHANGED
 IND_japanese_aid_rubber: "Kaučukové plantáže na Sumatrě" # todo: NEW TRANSLATION
 IND_japanese_aid_rubber_desc: "S pomocí Japonců můžeme efektivněji vyrábět kaučuk pro světový trh a potenciálně se dokonce stát jeho předním producentem v jihovýchodní Asii." # todo: CHANGED
 IND_new_capital: "Nové hlavní město!" # todo: NEW TRANSLATION
 IND_new_capital_desc: "Jakarta se stává zastaralým městem a zaostává za ostatními hlavními městy světa. Měli bychom začít plánovat zcela nové město s využitím všech odborných znalostí a vědomostí, které jsme získali od Japonců." # todo: CHANGED
 IND_chinese_aid: "Vyzvat Čínu!" # todo: NEW TRANSLATION
 IND_chinese_aid_desc: "Japonci během druhé světové války vyrabovali náš národ a zotročili naše lidi. Nesmíme na to zapomenout a nacionalisté v našem národě tlačí na užší vztahy s Čínou a východním světem. Možná bychom je dokonce mohli přimět k investicím do výstavby továren a infrastruktury v Indonésii." # todo: CHANGED
 IND_chin_aid_gas_plants: "Čínské plynové elektrárny" # todo: NEW TRANSLATION
 IND_chin_aid_gas_plants_desc: "Ropná pole na severní Sumatře zůstávají nevyužita a skrývají velký promarněný potenciál. S čínskými plynárenskými závody je můžeme dobře využít a stát se významnějším producentem ropy v jihovýchodní Asii." # todo: CHANGED
 IND_chin_aid_coal: "Uhelné továrny na Západní Javě" # todo: NEW TRANSLATION
 IND_chin_aid_coal_desc: "Sedíme na obrovských zásobách uhlí a je ostudné, že nemáme průmyslovou kapacitu k jeho efektivní přeměně na energii. Čína nám však nabídla neodolatelnou dohodu na výstavbu nových továren, které by urychlily těžbu a zpracování uhlí." # todo: CHANGED
 IND_chin_aid_coal_surplus: "Využít nadbytek uhlí" # todo: NEW TRANSLATION
 IND_chin_aid_coal_surplus_desc: "Nyní, když máme továrny pro zpracování našich zásob uhlí, měli bychom vybudovat rafinerie, které je přemění na energii pro náš národ." # todo: CHANGED
 IND_chin_aid_ev: "Čínská pomoc v oblasti elektrických vozidel" # todo: NEW TRANSLATION
 IND_chin_aid_ev_desc: "Číňané vědí, jak nejlépe hromadně vyrábět vozidla, a díky jejich odborným znalostem v oblasti elektrických vozidel můžeme pomoci v boji proti znečištění v našem národě." # todo: CHANGED
 IND_chin_aid_catl: "Dohody s CATL" # todo: NEW TRANSLATION
 IND_chin_aid_catl_desc: "Měli bychom uzavřít dohody mezi naším národem a společností CATL, aby vyráběla baterie pro stále rostoucí poptávku." # todo: CHANGED
 IND_chin_aid_pollution: "Zákon o snižování znečištění" # todo: NEW TRANSLATION
 IND_chin_aid_pollution_desc: "Přijmeme zákon o snižování znečištění, abychom bojovali proti znečištění v mnoha našich městech. Díky čínským investicím se to stalo možností, nikoli jen snem." # todo: CHANGED
 IND_chin_aid_inf: "Čínské investice do infrastruktury" # todo: NEW TRANSLATION
 IND_chin_aid_inf_desc: "Vzhledem k tomu, že čínská infrastruktura se den ode dne zlepšuje, není pochyb o tom, že by se našemu národu mělo dostat podobného zacházení. Požádáme o čínské investice do budování infrastruktury v Indonésii." # todo: CHANGED
 IND_chin_aid_high_railway: "Jakarta – Bandung vysokorychlostní železnice" # todo: NEW TRANSLATION
 IND_chin_aid_high_railway_desc: "Pokud máme být efektivním, industrializovaným národem, musíme nejprve propojit naše města. Čína nabídla výstavbu vysokorychlostní železnice spojující Jakartu s Bandungem." # todo: CHANGED
 IND_chin_aid_tollway: "Balikpapan – Samarinda Dálnice" # todo: NEW TRANSLATION
 IND_chin_aid_tollway_desc: "Dálnice Balikpapan–Samarinda umožní obyvatelům Východního Kalimantanu cestovat s tolik potřebným pohodlím. Pomocí čínských infrastrukturních postupů můžeme tuto dálnici pro náš národ vybudovat." # todo: CHANGED
 IND_new_silkroad: "Hedvábná stezka 21. století!" # todo: NEW TRANSLATION
 IND_new_silkroad_desc: "Pomoc našich čínských partnerů opět vynesla náš národ do centra mezinárodní pozornosti. Nyní jsme industrializovaným národem s průmyslovou kapacitou pro vstup do 21. století!" # todo: CHANGED
 IND_our_policies: "Investujte do našich politik" # todo: NEW TRANSLATION
 IND_our_policies_desc: "Naše politika potřebuje revizi. Musíme projít naše politiky, aby odpovídaly potřebám našeho národa ve 21. století." # todo: CHANGED
 IND_kemendegari: "Kemendegari" # todo: NEW TRANSLATION
 IND_kemendegari_desc: "Kemendegari je úřad pro vnitřní záležitosti našeho národa a pověříme jej řešením našich vnitřních politik." # todo: CHANGED
 IND_undertable_deals: "Tajné dohody" # todo: NEW TRANSLATION
 IND_undertable_deals_desc: "Můžeme potají uzavírat dohody s politiky, národy a organizacemi pro malý dodatečný příjem, ale zaplatíme tím korupcí v našem státě." # todo: NEW TRANSLATION
 IND_bribe_media: "Podplatit média" # todo: CHANGED
 IND_bribe_media_desc: "Naše strana by potřebovala tolik potřebnou podporu a pokud médiím něco málo dáme, možná tuto podporu získáme." # todo: CHANGED
 IND_save_corrupt_official: "Krytí zkorumpovaných úředníků" # todo: NEW TRANSLATION
 IND_save_corrupt_official_desc: "KPK je pro mnohé naše úředníky obtíží. Musíme jejich činy rychle zakrýt a zabránit tomu, aby byli stíháni." # todo: CHANGED
 IND_shun_corruption: "Vyhýbat se korupci" # todo: NEW TRANSLATION
 IND_shun_corruption_desc: "Musíme v našem národě tvrdě zakročit proti korupci! Pokud se máme stát úspěšným státem, musíme nejprve stíhat ty, kteří si chtějí naplnit kapsy těžce vydělanými penězi našeho lidu." # todo: CHANGED
 IND_kpk: " Financování KPK" # todo: NEW TRANSLATION
 IND_kpk_desc: "KPK, známá také jako Komise pro vymýcení korupce, odvádí skvělou práci v boji proti státní korupci. S trochou finančních prostředků jí však můžeme pomoci celý proces urychlit." # todo: CHANGED
 IND_trial_corrupt_official: "Stíhat zkorumpované úředníky" # todo: NEW TRANSLATION
 IND_trial_corrupt_official_desc: "Díky spolupráci s KPK se nám podařilo odhalit několik zkorumpovaných úředníků a připravujeme proti nim soudní procesy." # todo: CHANGED
 IND_more_jobs: "Vytvořit více pracovních míst" # todo: NEW TRANSLATION
 IND_more_jobs_desc: "Naši lidé potřebují peníze, aby uživili své rodiny. Vzhledem k nedostatku pracovních míst ve státě je naším úkolem vytvořit nová zařízení, kde si lidé budou moci vydělávat. Můžeme vybudovat nové továrny, podpořit naši ekonomiku a vymanit naše lidi z chudoby." # todo: CHANGED
 IND_rural_fortification: "Opevnění venkova" # todo: NEW TRANSLATION
 IND_rural_fortification_desc: "Naše venkovské obyvatelstvo by uvítalo tolik potřebnou ochranu před místními povstalci. Zatímco se budeme snažit povstalce zvládnout, můžeme vybudovat dočasná opevnění na ochranu našeho lidu." # todo: CHANGED
 IND_fund_industries: "Podpora národních průmyslů" # todo: NEW TRANSLATION
 IND_fund_industries_desc: "Indonésie je domovem mnoha průmyslových odvětví a díky pomoci našich přátel ze severu jsme schopni posílit své schopnosti. Nesmíme však dovolit, aby naše domácí průmyslová odvětví zaostala za zahraničními." # todo: CHANGED
 IND_education_question: "Kementerian Pendidikan" # todo: NEW TRANSLATION
 IND_education_question_desc: "Musíme revidovat naši vzdělávací politiku, aby odpovídala potřebám naší rostoucí mládeže. Můžeme zvolit islámsky zaměřené vzdělávání, nebo školy sekularizovat. Někteří v naší straně dokonce volají po kombinaci obojího, aby byly spokojeny všechny strany." # todo: CHANGED
 IND_religious_system: "Náboženský systém" # todo: NEW TRANSLATION
 IND_religious_system_desc: "Školy dosud fungují pod ministerstvem náboženských věcí, a bylo by strašné je nyní od této funkce odvolat." # todo: NEW TRANSLATION
 IND_quran_class: "Pokračovat ve výuce Koránu" # todo: NEW TRANSLATION
 IND_quran_class_desc: "Náš národ je islámským národem a naši lidé na to nesmí zapomenout! Musíme mezi mládeží šířit učení Koránu a učinit z něj povinný předmět." # todo: CHANGED
 IND_separate_school: "Oddělené školy pro chlapce a dívky" # todo: NEW TRANSLATION
 IND_separate_school_desc: "Naši studenti se budou ve třídách rozptylovat pohledem jeden na druhého. Musíme vybudovat nové oddělené školy pro chlapce a dívky." # todo: CHANGED
 IND_no_religious_system: "Sekulární systém" # todo: NEW TRANSLATION
 IND_no_religious_system_desc: "Musíme zbavit ministerstvo náboženských záležitostí správy našich škol. Abychom se modernizovali, musíme založit vlastní ministerstvo, které bude naše studenty lépe učit moderním ideálům." # todo: CHANGED
 IND_no_quran_class: "Zrušit výuku Koránu" # todo: NEW TRANSLATION
 IND_no_quran_class_desc: "Výuka Koránu je pro naše studenty zátěží. Navzdory většinově muslimskému obyvatelstvu musíme náboženství ze škol odstranit a soustředit se na důležité předměty." # todo: CHANGED
 IND_dont_separate_school: "Chlapci a dívky ve stejné škole" # todo: NEW TRANSLATION
 IND_dont_separate_school_desc: "Navzdory konzervativcům volajícím po oddělených školách by bylo hloupé podléhat jejich požadavkům. Pokud budeme budovat nové školy, zadlužíme se a zpozdíme vzdělávání našich studentů!" # todo: NEW TRANSLATION
 IND_mandatory_education: "Povinné vzdělávání" # todo: NEW TRANSLATION
 IND_mandatory_education_desc: "Musíme nařídit, aby veškerá naše mládež chodila do školy. Pokud bude naše obyvatelstvo negramotné, uvízneme v době kamenné." # todo: CHANGED
 IND_satisfied_nation: "Spokojený národ?" # todo: NEW TRANSLATION
 IND_satisfied_nation_desc: "Naše tvrdá práce snad nezůstane našimi lidmi bez povšimnutí. Přestože mnohé z našich problémů stále přetrvávají, nesmíme zapomenout na naše úspěchy." # todo: CHANGED
 IND_fix_rupiah: "Oprav Rupiah!" # todo: NEW TRANSLATION
 IND_fix_rupiah_desc: "Naše měna, rupie, je již nějakou dobu v rozvratu a s poklesem její hodnoty klesá i naše stabilita." # todo: CHANGED
 IND_crackdown_counterfeit: "Tvrdý postup proti padělkům" # todo: NEW TRANSLATION
 IND_crackdown_counterfeit_desc: "Padělané bankovky se v naší zemi nekontrolovaně šíří. To není dobré pro naši ekonomiku. Musíme proto začít proti těmto praktikám tvrdě zakročovat a přiblížit se hospodářskému oživení." # todo: NEW TRANSLATION
 IND_counterfeit: "Padělatelské praktiky" # todo: NEW TRANSLATION
 IND_counterfeit_desc: "Trocha padělání by naší zemi neuškodila. Dokud naši lidé neprotestují a jsou spokojení, jsou spokojené i naše kapsy." # todo: NEW TRANSLATION
 IND_cooperate_local_gov: "Spolupracovat s místními vládami" # todo: NEW TRANSLATION
 IND_cooperate_local_gov_desc: "Indonésie je rozmanitý národ s mnoha různými národy a mnoha místními vládami. Musíme s těmito místními vládami spolupracovat, abychom pro stát efektivněji vybírali daně." # todo: CHANGED
 IND_lower_interest_rates: "Nižší úrokové sazby" # todo: NEW TRANSLATION
 IND_lower_interest_rates_desc: "Naše úrokové sazby stoupají do děsivých výšin a musíme je začít snižovat, aby byli naši lidé spokojeni." # todo: CHANGED
 IND_farmers_in_industry: "Přesunout farmáře do průmyslového sektoru" # todo: NEW TRANSLATION
 IND_farmers_in_industry_desc: "Máme dost farmářů na venkově, musíme některé z nich dostat z farem a do továren, abychom pomohli naší ekonomice!" # todo: NEW TRANSLATION
 IND_begin_projects: "Zahájit projekty" # todo: NEW TRANSLATION
 IND_begin_projects_desc: "Abychom pomohli uvést rupii do oběhu, měli bychom zvážit financování nových projektů, aby naši lidé mohli utrácet svůj čas i peníze." # todo: CHANGED
 IND_fight_rising_prices: "Boj s rostoucími cenami" # todo: NEW TRANSLATION
 IND_fight_rising_prices_desc: "Naše strana rychle ztrácí popularitu kvůli nedostatečné boji s rostoucími cenami. Je načase to změnit!" # todo: NEW TRANSLATION
 IND_keep_high_prices: "Udržet vysoké ceny" # todo: NEW TRANSLATION
 IND_keep_high_prices_desc: "Možná z těchto vysokých cen dokážeme těžit prospěch... Kdo z národů vlastně pečuje o své lidi?" # todo: NEW TRANSLATION
 IND_proficient_supply: "Zdatné řízení zásob" # todo: NEW TRANSLATION
 IND_proficient_supply_desc: "Měli bychom začít revidovat řízení našeho dodavatelského řetězce, abychom udrželi ekonomiku zdravou. Pokud tak neučiníme, bude stále hrozit ekonomický kolaps." # todo: CHANGED
 IND_connect_docks: "Propojit dodavatelské řetězce" # todo: NEW TRANSLATION
 IND_connect_docks_desc: "Propojení dodavatelského řetězce nám pomůže mnohem efektivněji řídit zásobování. Také nám umožní být lépe propojeni s mezinárodními trhy." # todo: CHANGED
 IND_a_resilient_currency: "Pevná ekonomika!" # todo: NEW TRANSLATION
 IND_a_resilient_currency_desc: "S krví, potem a slzami obstojí naše skvělá měna Rupiah!" # todo: NEW TRANSLATION
 IND_ethnic_tension: "Potlačit etnické problémy" # todo: NEW TRANSLATION
 IND_ethnic_tension_desc: "Indonésie je etnicky, kulturně a nábožensky rozmanitý stát. To často vede k problémům mezi našimi národy. Způsobuje to nestabilitu a my musíme okamžitě najít řešení!" # todo: CHANGED
 IND_maluku_back_muslims: "Podpořte muslimy!" # todo: NEW TRANSLATION
 IND_maluku_back_muslims_desc: "Indonésie je muslimský stát. Nemůžeme proto zradit naši muslimskou populaci a musíme ji plně podpořit." # todo: CHANGED
 IND_back_muslims_arm_ulama: "Ozbrojit Ulama" # todo: NEW TRANSLATION
 IND_back_muslims_arm_ulama_desc: "Vyzbrojme ulámu! Uláma potřebuje naši pomoc při mobilizaci muslimů pro případ svatého konfliktu." # todo: CHANGED
 IND_back_muslims_medical_fee: "Snížit poplatky za lékařskou péči" # todo: NEW TRANSLATION
 IND_back_muslims_medical_fee_desc: "Abychom pomohli každému muslimovi zraněnému v náboženském konfliktu, musíme v našich nemocnicích snížit náklady a pomoci jim vrátit se do společnosti." # todo: CHANGED
 IND_back_muslims_workers: "Využívat muslimské dělníky" # todo: NEW TRANSLATION
 IND_back_muslims_workers_desc: "Nesmíme zapomenout na muslimské dělníky a jejich úsilí. Máme proto povinnost je využít a nasadit ve strategických odvětvích, abychom podpořili národní růst." # todo: CHANGED
 IND_back_muslims_factories: "Bezpečnostní fondy pro islamské průmysly" # todo: NEW TRANSLATION
 IND_back_muslims_factories_desc: "Pokud se nějaký průmyslový podnik ve vlastnictví muslimů ocitne v ekonomických potížích, investujeme do výstavby nových nouzových továren, které pomohou v těžkých časech." # todo: CHANGED
 IND_back_muslims_send_guns: "Pošlete jim zbraně" # todo: NEW TRANSLATION
 IND_back_muslims_send_guns_desc: "Vyzbrojení našeho muslimského obyvatelstva může pomoci udržet naše města v bezpečí a ochránit naše mešity před útoky z nenávisti." # todo: CHANGED
 IND_back_muslims_infantry: "Pěchota vyhrazená pro muslimy" # todo: NEW TRANSLATION
 IND_back_muslims_infantry_desc: "Musíme vytvořit čistě muslimské pěchotní jednotky, abychom zabránili jakémukoli druhu vnitřních konfliktů v naší armádě." # todo: CHANGED
 IND_call_saudis: "Kontaktovat Saúdskou Arábii" # todo: NEW TRANSLATION
 IND_call_saudis_desc: "Měli bychom kontaktovat Saúdy a zjistit, zda jsou ochotni podpořit naše muslimy svými finančními prostředky. Již financují naše mešity, takže nevidíme důvod, proč by nám neměli pomoci." # todo: CHANGED
 IND_ambon_for_muslims: "Ambon pro muslimy" # todo: NEW TRANSLATION
 IND_ambon_for_muslims_desc: "Ambon je ohniskem sektářského konfliktu. Díky našemu úsilí však údajně konflikt ve městě Ambon skončil rozhodným muslimským vítězstvím." # todo: CHANGED
 IND_maluku_just_fix_it: "Nikoho nepreferovat" # todo: NEW TRANSLATION
 IND_maluku_just_fix_it_desc: "V těchto konfliktech nesmíme stran- it žádné straně. Najděme řešení, které nebude zaujaté." # todo: CHANGED
 IND_maluku_call_army: "Povolat armádu" # todo: NEW TRANSLATION
 IND_maluku_call_army_desc: "Naše ozbrojené síly nečinně přihlížejí a s našimi sektářskými konflikty nic nedělají. Je čas je nasadit k deeskalaci konfliktů." # todo: CHANGED
 IND_maluku_militarize_villages: "Militarizovat vesnice" # todo: NEW TRANSLATION
 IND_maluku_militarize_villages_desc: "Některé malé vesnice jsou uvězněny uprostřed těchto sektářských konfliktů a nemají žádnou ochranu před rabujícími. Musíme tyto vesnice rychle opevnit a militarizovat, aby zůstaly v bezpečí." # todo: CHANGED
 IND_maluku_increase_policing: "Posílit policii" # todo: NEW TRANSLATION
 IND_maluku_increase_policing_desc: "Není pochyb o tom, že musíme posílit policejní dohled, abychom pomohli bojovat proti rostoucímu počtu konfliktů. Tím obnovíme tolik potřebný pořádek." # todo: CHANGED
 IND_maluku_civilian_shelter: "Továrny pro dělníky" # todo: NEW TRANSLATION
 IND_maluku_civilian_shelter_desc: "Musíme vybudovat továrny pro naše postižené dělníky, protože mnoho jejich továren bylo vypáleno kvůli jejich náboženskému přesvědčení." # todo: CHANGED
 IND_maluku_military_shelter: "Továrny pro ozbrojené síly" # todo: NEW TRANSLATION
 IND_maluku_military_shelter_desc: "Musíme vybudovat nové vojenské továrny pro naši rostoucí ozbrojenou přítomnost ve městech v důsledku sektářských konfliktů." # todo: CHANGED
 IND_maluku_back_christians: "Podpořme křesťany!" # todo: NEW TRANSLATION
 IND_maluku_back_christians_desc: "Musíme podpořit naši opomíjenou křesťanskou populaci. V těchto těžkých časech je to to nejmenší, co pro ně můžeme udělat." # todo: NEW TRANSLATION
 IND_maluku_mobilize_priests: "Mobilizovat kněze" # todo: NEW TRANSLATION
 IND_maluku_mobilize_priests_desc: "Svolání kněží pomůže probudit hněv našeho křesťanského obyvatelstva. To jim pomůže v případě mnoha sektářských konfliktů." # todo: CHANGED
 IND_maluku_mechanize_them: "Mechanizovaní křesťané" # todo: NEW TRANSLATION
 IND_maluku_mechanize_them_desc: "Díky úsilí kněží jsme schopni nasadit mechanizované křesťanské divize na ochranu kostelů." # todo: CHANGED
 IND_maluku_christian_volunteers: "Využívat křesťanské dobrovolníky" # todo: NEW TRANSLATION
 IND_maluku_christian_volunteers_desc: "Mnoho křesťanů obětuje svůj čas a dobrovolně pracuje na projektech pro národ. Jsme více než rádi, že takové úsilí přijmeme." # todo: CHANGED
 IND_maluku_christian_businesses: "Bezpečnostní fondy pro křesťanské podniky" # todo: NEW TRANSLATION
 IND_maluku_christian_businesses_desc: "Pokud nějaká křesťanská instituce zkrachuje, můžeme jí poskytnout půjčku, aby se znovu postavila na nohy." # todo: CHANGED
 IND_maluku_train_medics: "Vyškolit mediky" # todo: NEW TRANSLATION
 IND_maluku_train_medics_desc: "Musíme vyškolit více zdravotníků, aby pomáhali raněným a lidem zasaženým křížovou palbou sektářského konfliktu." # todo: CHANGED
 IND_maluku_give_trucks: "Pošlete jim nákladní auta!" # todo: NEW TRANSLATION
 IND_maluku_give_trucks_desc: "Když křesťanům poskytneme více nákladních vozů, budou se moci bez potíží efektivně přesouvat z místa na místo." # todo: CHANGED
 IND_maluku_contact_dutch: "Kontaktovat Nizozemsko" # todo: NEW TRANSLATION
 IND_maluku_contact_dutch_desc: "Vzhledem k tomu, že mnoho našich křesťanů má kořeny v Nizozemsku, je jisté, že kdybychom požádali Nizozemsko o pomoc, rádi by ji přijali... Správně?" # todo: NEW TRANSLATION
 IND_maluku_ambon_for_christians: "Ambon pro křesťany" # todo: NEW TRANSLATION
 IND_maluku_ambon_for_christians_desc: "Říká se, že město Ambon padlo do rukou křesťanů. Díky našemu úsilí začali křesťané ovládat město, které bylo v centru náboženských konfliktů." # todo: CHANGED
 IND_transfer_to_army: "Zesílit situaci armádou" # todo: NEW TRANSLATION
 IND_transfer_to_army_desc: "Zdá se, že naše řešení konflikt neukončilo, a proto je zapotřebí další vojenský zásah. Plná kontrola nad operací se převádí na TNI-AD." # todo: CHANGED
 IND_maluku_equip_police: "Militarizovat policii" # todo: NEW TRANSLATION
 IND_maluku_equip_police_desc: "Militarizací našich policejních sil můžeme armádu zbavit části jejího úsilí při potlačování sektářských konfliktů a konečně ji přesunout k jiným povstáním." # todo: CHANGED
 IND_maluku_crush_gangs: "Zničte gangy" # todo: NEW TRANSLATION
 IND_maluku_crush_gangs_desc: "Zničením zbývajících gangů v našich městech konečně vydechneme. Jejich loupeže, zabíjení a ničení přináší naší zemi jen nestabilitu!" # todo: NEW TRANSLATION
 IND_maluku_all_quiet_for_now: "Zatím klid." # todo: NEW TRANSLATION
 IND_maluku_all_quiet_for_now_desc: "Zdá se, že díky našemu tvrdšímu postupu byl v mnoha městech obnoven mír. Doufejme, že to vydrží." # todo: CHANGED
 IND_indonesian_armed_forces: "Ozbrojené síly Indonésie" # todo: NEW TRANSLATION
 IND_indonesian_armed_forces_desc: "Ozbrojené síly Indonésie patří mezi vojenské mocnosti Asie. Od našich pozemních sil až po piloty stojí muži a ženy národa připraveni bránit národ před jakoukoli hrozbou." # todo: CHANGED
 IND_tni_ad: "TNI-AD" # todo: NEW TRANSLATION
 IND_tni_ad_desc: "TNI-AD je naší hlavní složkou pozemních sil a je jí již více než 60 let. Dnes máme za úkol pokročit s novými metodami výcviku těchto mužů a žen, když vstupujeme do 21. století." # todo: CHANGED
 IND_chinese_model_inf: "Čínský pěší model" # todo: NEW TRANSLATION
 IND_chinese_model_inf_desc: "Je zřejmé, že se Číňané stanou světovou velmocí, a proto bychom za nimi neměli zaostávat. Pokud získáme jejich pomoc v oblasti zbraní a taktiky, možná se vedle nich dokážeme prosadit." # todo: CHANGED
 IND_homegrown_inf: "Domácí pěchota" # todo: NEW TRANSLATION
 IND_homegrown_inf_desc: "Pokud chceme být nezávislým, suverénním národem, musíme nejprve zavést naše taktiky. Pokud naši muži bojují stejně jako Číňané, jak se od nich lišíme?" # todo: NEW TRANSLATION
 IND_jungle_expertise: "Dovednosti v džungli" # todo: NEW TRANSLATION
 IND_jungle_expertise_desc: "Nepochybně bychom měli naše vojáky vycvičit k boji ve vlhkém a bujném prostředí jihovýchodní Asie. Pokud tak neučiníme, můžeme zaostat za našimi sousedy." # todo: CHANGED
 IND_strong_howitzers: "Silné houfnice" # todo: NEW TRANSLATION
 IND_strong_howitzers_desc: "Je důležité udržovat naše houfnice v perfektním stavu, aby se vyrovnaly nepříteli. Musíme okamžitě zahájit modernizaci našich starších kusů." # todo: CHANGED
 IND_most_advanced_tanks: "Největší tanky" # todo: NEW TRANSLATION
 IND_most_advanced_tanks_desc: "Není pochyb o tom, že naše tanky zastarávají. Proto jsme pověřili inženýry prováděním pokusů a výzkumu s cílem vybudovat největší tankové síly v jihovýchodní Asii." # todo: CHANGED
 IND_tank_factories: "Továrny na výrobu tanků" # todo: NEW TRANSLATION
 IND_tank_factories_desc: "Je bezpochyby nutné vybudovat nové továrny pro rostoucí počet našich tanků. Pokud zaostáváme ve výrobě, k čemu nám je tanková technologie?" # todo: NEW TRANSLATION
 IND_best_ifvs: "Nejlepší bojová vozidla pěchoty" # todo: CHANGED
 IND_best_ifvs_desc: "Naše bojová vozidla pěchoty si zaslouží stejné zacházení jako naše tanky. Koneckonců jsou na bojišti velmi důležitá. Abychom urychlili růst naší vojenské síly, je v našem nejlepším zájmu získat nejnovější a nejlepší technologie bojových vozidel pěchoty, která bezpečně přepraví naše muže." # todo: CHANGED
 IND_the_toughest_apcs: "Nejodolnější obrněné transportéry" # todo: NEW TRANSLATION
 IND_the_toughest_apcs_desc: "Naše obrněné transportéry jsou značně zastaralé a primitivní. Musíme to změnit. Proto sestavujeme tým, který vytvoří nové konstrukce schopné odolat i těm největším zbraním." # todo: CHANGED
 IND_tni_al: "TNI-AL" # todo: NEW TRANSLATION
 IND_tni_al_desc: "Naše námořnictvo je pýchou vojenské síly našeho národa. Jakožto souostrovní národ obklopený moři musíme vybudovat silné námořnictvo, které udrží ty, kdo nám chtějí ublížit, v bezpečné vzdálenosti." # todo: CHANGED
 IND_fortified_seas: "Pevně opevněné pobřeží" # todo: NEW TRANSLATION
 IND_fortified_seas_desc: "Musíme opevnit naše pobřeží, abychom zabránili nepřátelům vylodit se nebo poškodit naše lodě. V bojích se musíme snažit zůstat v defenzivě." # todo: CHANGED
 IND_new_corvettes: "Nové designy korvet" # todo: NEW TRANSLATION
 IND_new_corvettes_desc: "Naše flotila korvet začíná být značně zastaralá a skutečně by potřebovala obnovu. Měli bychom začít pracovat na návrhu nových konstrukcí." # todo: CHANGED
 IND_submarines: "Nové ponorky" # todo: NEW TRANSLATION
 IND_submarines_desc: "Ponorkové válčení se ve válce používá stále častěji. Několik ponorek sice máme, ale nedosahují úrovně zbytku světa. Musíme to změnit." # todo: CHANGED
 IND_industrialized_sea: "Průmyslově vyspělé moře" # todo: NEW TRANSLATION
 IND_industrialized_sea_desc: "Musíme zvýšit výrobu pro naše námořnictvo, abychom mohli boj přenést k nepříteli. Pokud budeme jednat defenzivně, může to vést ke zranění našich lidí." # todo: CHANGED
 IND_cruisers: "Křižníky ve výzkumu" # todo: NEW TRANSLATION
 IND_cruisers_desc: "Musíme získat lepší křižníky! Přestože jsou největšími loděmi ve flotile, jsou klíčem k vítězství v námořních bitvách." # todo: CHANGED
 IND_air_carrier_designs: "Nové letadlové lodě" # todo: NEW TRANSLATION
 IND_air_carrier_designs_desc: "Války dnes se bojují s leteckou podporou. Pokud naši námořníci nebudou mít leteckou podporu, jak je očekáváme, že zvítězí? Musíme začít navrhovat a stavět Indonéskou letadlovou loď!" # todo: NEW TRANSLATION
 IND_maritime_empire: "Námořská říše" # todo: NEW TRANSLATION
 IND_maritime_empire_desc: "Naše země musí zvítězit na mořích. Jak historie ukázala, námořnictvo národa často určuje jeho bezpečí a integritu" # todo: NEW TRANSLATION
 IND_tni_au: "TNI-AU" # todo: NEW TRANSLATION
 IND_tni_au_desc: "TNI-AU je hlavní složkou letectva našeho národa a musíme znovu vyhodnotit, jak budeme postupovat." # todo: CHANGED
 IND_refine_airbases: "Přepracovat letecké základny" # todo: NEW TRANSLATION
 IND_refine_airbases_desc: "Měli bychom vážně zvážit přestavbu našich leteckých základen, aby odpovídaly našim novým letadlům a potřebám pilotů. Pokud nezvýšíme jejich kvalitu, můžeme selhat na obloze." # todo: CHANGED
 IND_air_drills: "Provádějte domácí letecká cvičení" # todo: NEW TRANSLATION
 IND_air_drills_desc: "Abychom zdokonalili dovednosti našich pilotů, musíme se nejprve ujistit, že jsou připraveni k boji. Pověříme naše důstojníky, aby na připravenost pilotů dohlédli." # todo: CHANGED
 IND_expand_air_craft_designs: "Lepší návrhy letadel" # todo: NEW TRANSLATION
 IND_expand_air_craft_designs_desc: "Abychom v letectví nezaostali za zbytkem světa, je nejlepší začít financovat výzkumníky nových konstrukcí letadel." # todo: CHANGED
 IND_purchase_rafale_jets: "Rafale letadla" # todo: NEW TRANSLATION
 IND_purchase_rafale_jets_desc: "Naši západní přátelé nám nabídli své nejnovější a nejlepší víceúčelové stíhačky, avšak za určitou cenu. Měli bychom to zvážit, protože tím můžeme prohloubit vztahy a získat západní letadla." # todo: CHANGED
 IND_nato_drilling: "Cvičení NATO" # todo: NEW TRANSLATION
 IND_nato_drilling_desc: "Abychom upevnili naše přátelství se Západem, měli bychom s nimi provádět letecká cvičení. To nám umožní být připraveni pro případ koordinovaného útoku." # todo: CHANGED
 IND_funds_for_iae: "Financovat indonéskou leteckou společnost" # todo: CHANGED
 IND_funds_for_iae_desc: "Financování IAE by umožnilo, aby naše letadla byla na obloze vyspělejší a efektivnější. Umožní nám zajistit indonéskou vzdušnou převahu v jihovýchodní Asii." # todo: CHANGED
 IND_political_agenda: "Politická agenda" # todo: NEW TRANSLATION
 IND_political_agenda_desc: "Zaměřme se na politiku. Volby se blíží. Jak může Indonésie být prosperující demokracií bez agendy... Nebo ne?" # todo: NEW TRANSLATION
 IND_national_awakening: "Program Strany národního probuzení" # todo: NEW TRANSLATION
 IND_national_awakening_desc: "Strana národního probuzení, konzervativní indonéská politická strana, znovu vstoupila na politickou scénu. Jak tentokrát bude postupovat, to si může kdokoli domyslet." # todo: NEW TRANSLATION
 IND_naw_rural_folk: "Venkovský lid" # todo: NEW TRANSLATION
 IND_naw_rural_folk_desc: "Zaměřme se na venkovské obyvatelstvo. Je páteří našeho národa a pomoc jemu by měla být naší největší starostí." # todo: CHANGED
 IND_naw_reps_village: "Zastoupení vesničanů" # todo: NEW TRANSLATION
 IND_naw_reps_village_desc: "Naši lidé žijící ve vesnicích křičí, ale nikdo je neslyší. Je čas dát jim skutečný hlas v našich záležitostech." # todo: CHANGED
 IND_naw_health_fac: "Zaměřit se na zdravotnická zařízení" # todo: NEW TRANSLATION
 IND_naw_health_fac_desc: "Měli bychom pracovat na rozšíření zdravotní péče pro naše venkovské obyvatelstvo. Pokud je necháme zemřít, selžeme ve svém poslání pomáhat jim." # todo: CHANGED
 IND_naw_better_edu: "Rozšířit vzdělání" # todo: NEW TRANSLATION
 IND_naw_better_edu_desc: "Děti ze vesnic byly dlouho zanedbávány. Je na čase rozšířit vzdělání, aby každý měl příležitost se něco naučit" # todo: NEW TRANSLATION
 IND_naw_aid_village: "Zaměřit se na infrastrukturu vesnic" # todo: NEW TRANSLATION
 IND_naw_aid_village_desc: "Domy našich vesničanů se rozpadají a nemůžeme nečinně přihlížet. Vyslali jsme stavební dělníky, aby pro naše lidi postavili nové budovy." # todo: CHANGED
 IND_naw_dev_lacking_regions: "Průmyslově vyvíjet venkov" # todo: NEW TRANSLATION
 IND_naw_dev_lacking_regions_desc: "Nabídněme práci obyvatelům zanedbaných vesnic. Bude to vyžadovat určité školení, ale měli bychom postavit nové továrny, aby v nich mohli pracovat." # todo: CHANGED
 IND_naw_agri_dev: "Zemědělský rozvoj" # todo: NEW TRANSLATION
 IND_naw_agri_dev_desc: "Spolu s výstavbou nových domů bychom měli vybudovat také lepší zemědělská zařízení, aby mohli vyrábět potraviny pro naše trhy." # todo: CHANGED
 IND_naw_fishermen: "Financování rybářů" # todo: NEW TRANSLATION
 IND_naw_fishermen_desc: "Financování našich rybářů je skvělým způsobem, jak posílit jejich morálku, a také skvělým způsobem, jak nasytit náš lid." # todo: CHANGED
 IND_naw_women: "Ženy v strategických sektorech" # todo: NEW TRANSLATION
 IND_naw_women_desc: "Využití žen v práci ve strategických odvětvích by mohlo být velmi užitečné, nejen pro společenský, ale i vědecký pokrok." # todo: CHANGED
 IND_naw_aid_farmer: "Zaměřit se na farmáře" # todo: NEW TRANSLATION
 IND_naw_aid_farmer_desc: "Zaměřme se na jednotlivce, na zemědělce. Pokud těmto lidem věnujeme pozornost, možná je přimějeme vyrábět zboží levněji." # todo: CHANGED
 IND_naw_aid_laborer: "Pomozte dělníkům" # todo: NEW TRANSLATION
 IND_naw_aid_laborer_desc: "Pomoc obyčejnému člověku, například dělníkovi, bude klíčem k industrializaci zemědělství." # todo: CHANGED
 IND_naw_safety_reg: "Prosadit bezpečnostní nařízení" # todo: NEW TRANSLATION
 IND_naw_safety_reg_desc: "Přijetí bezpečnostních předpisů je klíčem k ochraně našich pracovníků. Pomůže to také našemu národu rozvíjet se ze společenského hlediska a uklidní to naše dělníky." # todo: CHANGED
 IND_way_forward_naw: "Cesta vpřed" # todo: NEW TRANSLATION
 IND_way_forward_naw_desc: "Je jasné, že budoucnost spočívá v rukou Strany národního probuzení. Od svého nástupu k moci přinášíme tomuto národu pouze velikost a demokracii." # todo: CHANGED
 IND_prosper_justice: "Vítězství Prosperous Justice" # todo: NEW TRANSLATION
 IND_prosper_justice_desc: "Je zřejmé, co si indonéský lid přeje: stranu, které záleží na národu a na ničem jiném než na národu. Toho lze dosáhnout pouze prostřednictvím Strany prosperující spravedlnosti." # todo: CHANGED
 IND_reform_system: "Systémové reformy" # todo: NEW TRANSLATION
 IND_reform_system_desc: "Pojďme reformovat tento chátrající systém a znovu probudit lásku ke státu v našem lidu!" # todo: NEW TRANSLATION
 IND_improve_network: "Lepší sítě" # todo: NEW TRANSLATION
 IND_improve_network_desc: "Jak budou naši lidé komunikovat, pokud je naše internetová infrastruktura zastaralá? Začněme budovat novou." # todo: CHANGED
 IND_efficient_tax: "Efektivní výběr daní" # todo: NEW TRANSLATION
 IND_efficient_tax_desc: "Lidé musí platit daně, aby stát mohl fungovat. Efektivní proces výběru daní je pro blahobyt státu zásadní." # todo: CHANGED
 IND_const_practices: "Lepší stavební postupy" # todo: NEW TRANSLATION
 IND_const_practices_desc: "Naši muži umírají při nehodách, kterým lze zabránit. Přestože to zpomalí práci, je to tak správně." # todo: CHANGED
 IND_upgrade_facilities: "Lepší nástroje" # todo: NEW TRANSLATION
 IND_upgrade_facilities_desc: "Měli bychom investovat do nových nástrojů, aby naši muži mohli pracovat snadněji." # todo: CHANGED
 IND_address_issues: "Řešit naše problémy" # todo: NEW TRANSLATION
 IND_address_issues_desc: "Měli bychom se zaměřit na naše vnitřní problémy." # todo: CHANGED
 IND_edu_to_disenfranchised: "Vzdělání pro marginalizované" # todo: NEW TRANSLATION
 IND_edu_to_disenfranchised_desc: "Přivedení škol k našim dětem v opomíjených částech státu může výrazně podpořit společenský pokrok." # todo: CHANGED
 IND_continue_pol_fund: "Pokračovat ve financování policie" # todo: NEW TRANSLATION
 IND_continue_pol_fund_desc: "Držme násilníky a zločince mimo naše ulice. Pokud budeme financovat policii, můžeme našim lidem zajistit klidný spánek." # todo: CHANGED
 IND_continue_cor_fight: "Pokračovat v boji proti korupci" # todo: NEW TRANSLATION
 IND_continue_cor_fight_desc: "Bojem proti korupci můžeme zajistit čistotu našich záznamů a důvěru našich lidí." # todo: CHANGED
 IND_equal_opportunities: "Rovné příležitosti" # todo: NEW TRANSLATION
 IND_equal_opportunities_desc: "Rovné příležitosti nejsou luxusem, který si mnozí mohou dovolit, zvláště zde v Indonésii. To však můžeme změnit tím, že lidem přidělíme pozemky." # todo: CHANGED
 IND_more_offices: "Více kanceláří" # todo: NEW TRANSLATION
 IND_more_offices_desc: "Výstavba nových kanceláří je skvělým a efektivním způsobem vytváření pracovních míst a může také usměrnit ekonomický tok." # todo: CHANGED
 IND_road_improvements: "Zlepšit naše silnice" # todo: NEW TRANSLATION
 IND_road_improvements_desc: "Pokud opravíme naše silnice, lidé v opomíjených městech se konečně budou moci vyrovnat obyvatelům našich významných měst." # todo: CHANGED
 IND_help_arm_industry: "Podpořte zbrojní průmysl" # todo: NEW TRANSLATION
 IND_help_arm_industry_desc: "Pomoc zbrojnímu průmyslu by nám mohla v budoucnu výrazně prospět. Poskytnutí pracovních míst potřebným podpoří naši ekonomiku i armádu." # todo: CHANGED
 IND_new_society: "Nová společnost" # todo: NEW TRANSLATION
 IND_new_society_desc: "Díky naší tvrdé práci se pozoruhodný pokrok Strany prosperující spravedlnosti rozšířil mezi Indonésany po celém národě." # todo: CHANGED
 IND_united_development: "Strana sjednoceného rozvoje" # todo: NEW TRANSLATION
 IND_united_development_desc: "UDP, známá také jako strana Kabaa, je umírněná islamistická strana zaměřená na řešení problémů každodenního života v Indonésii." # todo: CHANGED
 IND_und_national_dev: "Národní plán rozvoje" # todo: NEW TRANSLATION
 IND_und_national_dev_desc: "Vyhlašme Národní rozvojový plán. Posílí morálku našeho lidu i popularitu naší strany." # todo: CHANGED
 IND_und_clean_water: "Čistější voda" # todo: NEW TRANSLATION
 IND_und_clean_water_desc: "Filtrováním vody a budováním nových systémů zajistíme, aby lidé mohli pít bez zdravotních následků. Uvolníme tím také půdu pro budoucí projekty." # todo: CHANGED
 IND_und_bridge_port: "Lepší dopravní infrastruktura" # todo: NEW TRANSLATION
 IND_und_bridge_port_desc: "Lepší infrastruktura pro naše řidiče nákladních vozů pomůže bez problémů přepravovat zboží po celém národě." # todo: CHANGED
 IND_und_agri_invest: "Investice do zemědělství" # todo: NEW TRANSLATION
 IND_und_agri_invest_desc: "Investice do zemědělství jsou zásadní, chceme-li efektivně nasytit náš lid." # todo: CHANGED
 IND_und_more_science: "Více vědců" # todo: NEW TRANSLATION
 IND_und_more_science_desc: "Náš národ potřebuje vědce, aby se mohl rozvíjet, a musíme financovat jejich výcvik a vzdělávání." # todo: CHANGED
 IND_und_prot_muslims: "Ochrana muslimů" # todo: NEW TRANSLATION
 IND_und_prot_muslims_desc: "Výstavbou nouzových úkrytů pro naše muslimy můžeme zajistit integritu náboženství našeho národa i bezpečnost muslimů. To je zásadní, protože muslimové v našem národě čelí hrozbě útoků ve městech s jiným náboženským vyznáním." # todo: CHANGED
 IND_und_islam_schools: "Financování islámských škol" # todo: NEW TRANSLATION
 IND_und_islam_schools_desc: "Financování islámských škol je rychlým způsobem, jak naše lidi kulturně a nábožensky vzdělat. Může nám také získat přízeň duchovenstva." # todo: CHANGED
 IND_und_islam_banking: "Islámské bankovnictví" # todo: NEW TRANSLATION
 IND_und_islam_banking_desc: "Islámské bankovnictví je bezpochyby správným způsobem bankovnictví. Nesmíme na naše lidi uvalovat vysoké úroky a tímto je udržíme spokojené. Naše peněženky však mohou být o něco tenčí." # todo: CHANGED
 IND_und_better_social_welfare: "Péče o seniory" # todo: NEW TRANSLATION
 IND_und_better_social_welfare_desc: "Nesmíme zradit naše starší, vždyť stavíme na jejich práci. Tím, že jim umožníme lepší přístup ke zdravotní péči, uctíme jejich tvrdou práci a zároveň je udržíme spokojené." # todo: CHANGED
 IND_und_help_food: "Podpora výzkumu produkce potravin" # todo: NEW TRANSLATION
 IND_und_help_food_desc: "Financováním nových metod výroby potravin můžeme nasytit miliony hladových žaludků v Indonésii i vlastní obyvatelstvo." # todo: CHANGED
 IND_und_housing_act: "Zákon o bydlení" # todo: NEW TRANSLATION
 IND_und_housing_act_desc: "Zajištění toho, že nikdo nebude bez střechy nad hlavou, je klíčové v politice naší strany. Měli bychom stavět cenově dostupné bydlení pro lidi v Severních Molukách" # todo: NEW TRANSLATION
 IND_und_better_hospitals: "Lepší vybavení nemocnic" # todo: NEW TRANSLATION
 IND_und_better_hospitals_desc: "Lepší a vyspělejší zdravotnické vybavení pro naše lékaře může pomoci zachránit životy mnoha lidí." # todo: CHANGED
 IND_und_help_unemployment: "Pomoc s nezaměstnaností" # todo: NEW TRANSLATION
 IND_und_help_unemployment_desc: "Zaměstnání velké části obyvatelstva je pro ekonomický růst Indonésie zásadní, proto bychom měli postavit nové budovy a zajistit těmto lidem pracovní místa." # todo: CHANGED
 IND_und_united_indonesia: "Sjednocená Indonésie" # todo: NEW TRANSLATION
 IND_und_united_indonesia_desc: "Sjednoceni svou vírou a svým národem můžeme konečně v klidu sledovat, jak jsou naše politiky zaváděny v celé zemi." # todo: CHANGED
 IND_party_of_struggle: "Strana boje" # todo: NEW TRANSLATION
 IND_party_of_struggle_desc: "Levicová strana, Strana boje, tlačí na mnoho radikálních změn, ale zda je dokáže realizovat, je otázkou." # todo: NEW TRANSLATION
 IND_strug_brace_for_change: "Připravte se na změny" # todo: NEW TRANSLATION
 IND_strug_brace_for_change_desc: "Doufejme, že jsou naši lidé připraveni na rozsáhlé reformy, které jim naše strana nabídne." # todo: CHANGED
 IND_strug_expand_infrastructure: "Rozšíření infrastruktury" # todo: NEW TRANSLATION
 IND_strug_expand_infrastructure_desc: "Rozšíření infrastruktury je bezpečným způsobem, jak zajistit vysokou kvalitu života našich lidí a naplnit jejich očekávání." # todo: CHANGED
 IND_strug_acquire_bp: "Získat stavební plány" # todo: NEW TRANSLATION
 IND_strug_acquire_bp_desc: "Získáním nových stavebních plánů můžeme stavět bez zádrhelů" # todo: NEW TRANSLATION
 IND_strug_new_airports: "Nová letiště" # todo: NEW TRANSLATION
 IND_strug_new_airports_desc: "Výstavbou nových letišť zajistíme plynulý příliv turistů do národa. Pomůže to také našim lidem cestovat vnitrostátně i mezinárodně." # todo: CHANGED
 IND_strug_better_road: "Militarizovaný vzdušný prostor" # todo: NEW TRANSLATION
 IND_strug_better_road_desc: "Militarizace našeho vzdušného prostoru je dobrou alternativou k výstavbě dalších civilních letišť, protože nám pomůže bránit oblohu našeho národa v těžkých časech." # todo: CHANGED
 IND_strug_fight_corruption: "Boj proti korupci" # todo: NEW TRANSLATION
 IND_strug_fight_corruption_desc: "Není pochyb o tom, že korupce hraje v indonéské politice velkou roli. Měli bychom se proto ze všech sil snažit ji odstranit." # todo: CHANGED
 IND_strug_establish_investigations: "Výzva k vyšetřování" # todo: NEW TRANSLATION
 IND_strug_establish_investigations_desc: "Zahájení vyšetřování zkorumpovaných úředníků může naší straně snadno přinést větší popularitu a umožnit stíhání konkurenčních stran, které tak zaostanou." # todo: CHANGED
 IND_strug_purge_sus_members: "Očistka podezřelých členů" # todo: NEW TRANSLATION
 IND_strug_purge_sus_members_desc: "Bylo by velmi pokrytecké obviňovat jiné strany z korupce, aniž bychom vyšetřili naši vlastní. Proto budeme muset přijmout opatření k očištění našich vlastních zkorumpovaných úředníků." # todo: NEW TRANSLATION
 IND_strug_economic_growth: "Ekonomický růst" # todo: NEW TRANSLATION
 IND_strug_economic_growth_desc: "Vstříknutím peněz do trhu bychom mohli dosáhnout ekonomického boomu." # todo: CHANGED
 IND_strug_agri_funding: "Financování zemědělství" # todo: NEW TRANSLATION
 IND_strug_agri_funding_desc: "Zemědělství je v Indonésii velmi významné, a abychom udrželi naše zemědělce spokojené, měli bychom jejich projekty financovat." # todo: CHANGED
 IND_strug_seaports: "Nové námořní přístavy" # todo: NEW TRANSLATION
 IND_strug_seaports_desc: "Výstavba nových námořních přístavů nám výrazně pomůže v obchodu s okolním světem a umožní nám mnohem rychleji vyrábět lodě." # todo: CHANGED
 IND_strug_eastasian_unity: "Východoasijská jednota" # todo: NEW TRANSLATION
 IND_strug_eastasian_unity_desc: "V době, kdy se velká část světa rozpadá a upadá do chaosu, je důležité držet své nepřátele nablízku a přátele ještě blíže. Měli bychom spolupracovat s ostatními východoasijskými národy, abychom prosperovali." # todo: CHANGED
 IND_strug_host_regional_events: "Pořádat regionální akce" # todo: NEW TRANSLATION
 IND_strug_host_regional_events_desc: "Indonésie byla v minulosti centrem regionálních událostí a přivedla do státu mnoho nových tváří. V této praxi bychom měli pokračovat a nabídnout pořádání dalších akcí." # todo: CHANGED
 IND_strug_just_indonesia: "Spravedlivá Indonésie" # todo: NEW TRANSLATION
 IND_strug_just_indonesia_desc: "Díky veškeré naší tvrdé práci můžeme konečně říci, že vznikla nová a spravedlivá Indonésie." # todo: CHANGED
 IND_democrat_party: "Demokratická strana" # todo: NEW TRANSLATION
 IND_democrat_party_desc: "Demokratická strana patří mezi nejoblíbenější prozápadní strany v Indonésii a strana usiluje o liberálnější stát." # todo: NEW TRANSLATION
 IND_dem_greater_future: "Větší zítřek" # todo: NEW TRANSLATION
 IND_dem_greater_future_desc: "Musíme připravit národ na reformy a změny, protože zítřek musí být lepší než dnešek, a Indonésie bude prosperovat!" # todo: NEW TRANSLATION
 IND_dem_enviro_prot_plan: "Program ochrany životního prostředí" # todo: NEW TRANSLATION
 IND_dem_enviro_prot_plan_desc: "Podporou ochrany životního prostředí můžeme zajistit, že naše lesy, džungle a pláže budou chráněny proti vandalismu." # todo: NEW TRANSLATION
 IND_dem_resource_regulation: "Regulace zdrojů" # todo: NEW TRANSLATION
 IND_dem_resource_regulation_desc: "Regulujme těžbu našich zdrojů, aby se během procesu nic neztrácelo." # todo: CHANGED
 IND_dem_protected_areas: "Zřídte chráněné oblasti" # todo: NEW TRANSLATION
 IND_dem_protected_areas_desc: "Zřízením chráněných oblastí ochráníme kulturní památky našeho národa a zachováme naši historii." # todo: CHANGED
 IND_dem_for_the_oceans: "Strana boje za oceány" # todo: NEW TRANSLATION
 IND_dem_for_the_oceans_desc: "Jsme obklopeni mořem, a proto k němu musíme být ohleduplní. Výstavbou nových bezpečných zařízení zajistíme, že to bude prospěšné jak pro oceány, tak pro nás." # todo: CHANGED
 IND_dem_decentralization: "Decentralizace" # todo: NEW TRANSLATION
 IND_dem_decentralization_desc: "Decentralizace našeho národa může pomoci našim lidem více nám důvěřovat a také snížit náklady tam, kde je to možné." # todo: CHANGED
 IND_dem_regional_econ: "Podpora regionálních ekonomik" # todo: NEW TRANSLATION
 IND_dem_regional_econ_desc: "Financováním pracovních míst v regionálních ekonomikách bychom mohli získat značnou podporu a zároveň těžit z větší pracovní síly." # todo: CHANGED
 IND_dem_prot_local_cultures: "Chraňte místní kultury" # todo: NEW TRANSLATION
 IND_dem_prot_local_cultures_desc: "Ochrana menšin a jejich kultur je klíčem k zachování civilizovanosti Indonésie. Mnoho lidí páchá nenávistné činy proti ostatním a tato vláda to nebude tolerovat." # todo: CHANGED
 IND_dem_small_business_support: "Boj proti majitelům půdy" # todo: NEW TRANSLATION
 IND_dem_small_business_support_desc: "Boj proti majitelům půdy, kteří zabírají veškerou půdu, nám pomůže rozdělit půdu mezi lid a udržet rozvoj země" # todo: NEW TRANSLATION
 IND_dem_entrepreneur: "Podpora podnikatelství" # todo: NEW TRANSLATION
 IND_dem_entrepreneur_desc: "V stále digitalizovanějším světě je důležité financovat podnikatelství, aby naši lidé mohli Indonésii posunout na úroveň zbytku světa" # todo: NEW TRANSLATION
 IND_dem_promote_credit: "Pomoc pro seniory" # todo: NEW TRANSLATION
 IND_dem_promote_credit_desc: "Pomoc starším je jistým způsobem, jak lidem ukázat dobré úmysly naší strany." # todo: CHANGED
 IND_dem_technical_support: "Podpora technologického pokroku" # todo: NEW TRANSLATION
 IND_dem_technical_support_desc: "Většina obyvatel našeho národa stále nemá přístup k internetu, což nás staví do zaostávající pozice. Měli bychom to změnit a vybudovat novou internetovou infrastrukturu." # todo: CHANGED
 IND_dem_emergence_indonesia: "Vznik Indonésie" # todo: NEW TRANSLATION
 IND_dem_emergence_indonesia_desc: "S našimi novými politikami a cíli jsme světu ukázali, že Indonésie se ze svého oslabeného stavu vynoří za každou cenu." # todo: CHANGED
 IND_dem_civil_activity: "Podpora občanské aktivity" # todo: NEW TRANSLATION
 IND_dem_civil_activity_desc: "Podpora občanské aktivity je bezpečný způsob, jak zajistit, aby se lidé mohli lépe poznávat, a zároveň prospívá státu." # todo: NEW TRANSLATION
 IND_k.e.m.i.u: "The K.E.M.I.U" # todo: NEW TRANSLATION
 IND_k.e.m.i.u_desc: "K.E.M.I.U, náš útvar zahraničních záležitostí, je pověřen ochranou národního zájmu v zahraničí a budováním vztahů se zbytkem světa." # todo: NEW TRANSLATION
 IND_contact_west: "Západní vztahy" # todo: NEW TRANSLATION
 IND_contact_west_desc: "Je důležité udržovat blízké vztahy se Západem. Každý den sledujeme nové technologické a vědecké průlomy v jejich zemích. Kromě toho můžeme ekonomicky těžit z jejich společností." # todo: CHANGED
 IND_american_coop: "Indonésko-americká spolupráce" # todo: NEW TRANSLATION
 IND_american_coop_desc: "Spolupráce s Američany nám může pomoci rozvíjet ekonomiku, protože USA mají vedoucí ekonomiku na světě." # todo: CHANGED
 IND_american_armor: "Americká obrněná výzbroj" # todo: NEW TRANSLATION
 IND_american_armor_desc: "Nákup amerických konstrukcí obrněné techniky může být pro naše ozbrojené síly, konkrétně pozemní síly TNI-AD, přínosný." # todo: CHANGED
 IND_west: "Západní diplomacie" # todo: NEW TRANSLATION
 IND_east: "Východní diplomacie" # todo: NEW TRANSLATION
 IND_american_companies: "Spolupracovat s NASA" # todo: NEW TRANSLATION
 IND_american_companies_desc: "Spolupráce s NASA by výrazně zvýšila rychlost, s jakou můžeme dostat naše muže do vesmíru. Také by urychlila vesmírný výzkum." # todo: CHANGED
 IND_contact_netherlands: "Setkat se s Nizozemci" # todo: NEW TRANSLATION
 IND_contact_netherlands_desc: "Naši bývalí kolonizátoři jsou nyní našimi novými přáteli. Udržování kontaktu s Nizozemci může být pro Indonésii skvělou branou do evropského obchodu." # todo: CHANGED
 IND_spajik_frigate: "Pořiďte fregaty Spejik" # todo: NEW TRANSLATION
 IND_spajik_frigate_desc: "Nákup nových fregat může být prospěšný, zejména od Nizozemců. Jsou ochotni nám jednu poskytnout za velmi výhodnou cenu." # todo: CHANGED
 IND_sigma_corvette: "Pořiďte Sigma korvety" # todo: NEW TRANSLATION
 IND_sigma_corvette_desc: "Nizozemské korvety Sigma se zdají být na moři obávanou bojovou silou. Pokud se nám podaří dohodnout na jedné z nich, může to našemu námořnictvu výrazně prospět." # todo: CHANGED
 IND_ease_asean_trade: "Usnadnit vstup do ASEAN obchodu" # todo: NEW TRANSLATION
 IND_ease_asean_trade_desc: "Zapojení Nizozemska do obchodu ASEAN může prospět nám i našim sousedům. Výrazně by také zlepšilo vztahy východní Asie s Evropany." # todo: CHANGED
 IND_fund_dutch_churches: "Financovat nizozemské kostely" # todo: NEW TRANSLATION
 IND_fund_dutch_churches_desc: "Financování nizozemských kostelů by mohlo být poněkud riskantní. Abychom však potěšili naše přátele v Nizozemsku, měli bychom zvážit financování některých jejich kostelů, protože někteří zdejší křesťané se považují za potomky Nizozemců." # todo: CHANGED
 IND_contact_europe: "Jednání s EU" # todo: NEW TRANSLATION
 IND_contact_europe_desc: "Jednání s Evropskou unií nám může pomoci navázat lepší vztahy s velkou částí západní a východní Evropy." # todo: CHANGED
 IND_boost_econ_relations: "Posílení ekonomických vztahů" # todo: NEW TRANSLATION
 IND_boost_econ_relations_desc: "Posílení ekonomických vztahů nám pomůže navázat užší hospodářské vazby s EU. Zlepší se tím také každodenní život našich lidí, kteří nyní získají lepší přístup k západnímu zboží." # todo: CHANGED
 IND_national_development_plan: "Národní rozvojový plán" # todo: NEW TRANSLATION
 IND_national_development_plan_desc: "Uzavřeme s EU několik dohod o zlepšení naší národní infrastruktury." # todo: CHANGED
 IND_talks_east: "Podívej se na východ" # todo: NEW TRANSLATION
 IND_talks_east_desc: "Podívejme se na východ a promluvme si s našimi východními přáteli. Západ Indonésii jen škodil a přinášel jejímu lidu zoufalství." # todo: CHANGED
 IND_sino_cooperation: "Čínsko-indonéská spolupráce" # todo: NEW TRANSLATION
 IND_sino_cooperation_desc: "Číňané nám dosud neublížili… zatím. Budujme s nimi vztahy, aby se to nestalo." # todo: CHANGED
 IND_sino_science_coop: "Čínsko-vědecká spolupráce" # todo: NEW TRANSLATION
 IND_sino_science_coop_desc: "Spolupráce s Číňany ve vědě umožní našemu národu pokročit vpřed." # todo: CHANGED
 IND_principle_bandung: "Deset principů Bandung" # todo: NEW TRANSLATION
 IND_principle_bandung_desc: "Souhlas nevměšovat se do vnitřní politiky druhého je KLÍČEM k asijské jednotě. Po konferenci Číňané souhlasili s paktem o neútočení a nevměšování a slíbili, že naše vnitřní záležitosti nechají na pokoji." # todo: CHANGED
 IND_japanese_friendship: "Japonské přátelství" # todo: NEW TRANSLATION
 IND_japanese_friendship_desc: "Přestože nás Japonci kolonizovali, bylo by směšné nebudovat s nimi vztahy. Jednání může prospět nám i jim." # todo: CHANGED
 IND_port_exports: "Více přístavů pro vývoz" # todo: NEW TRANSLATION
 IND_port_exports_desc: "Výstavba nových přístavů může urychlit tok zboží do Japonska i z něj a také do zbytku světa." # todo: CHANGED
 IND_jap_tech_giants: "Japonské technologické giganty" # todo: NEW TRANSLATION
 IND_jap_tech_giants_desc: "Technologičtí giganti z Japonska nás mohou lecčemu naučit. Měli bychom zvážit spolupráci s nimi a s našimi domácími technologickými společnostmi." # todo: CHANGED
 IND_men_for_ports: "Personál pro přístavy" # todo: NEW TRANSLATION
 IND_men_for_ports_desc: "Tyto přístavy se samy neobslouží! Měli bychom požádat Japonsko o pracovní sílu pro obsazení míst v našich přístavech, protože můžeme využít kvalifikované pracovníky." # todo: CHANGED
 IND_jap_const_methods: "Japonské stavební metody" # todo: NEW TRANSLATION
 IND_jap_const_methods_desc: "Napodobování japonských stavebních metod by mělo být cílem našeho národa. Pokud se nám podaří vybudovat infrastrukturu podobně jako jim, brzy je překonáme." # todo: CHANGED
 IND_russia_coop: "Rusko-indonéská spolupráce" # todo: NEW TRANSLATION
 IND_russia_coop_desc: "Spolupráce s Ruskem je jasný způsob, jak Západu ukázat, že jsme toho s jejich výstřelky už dost unaveni. Můžeme také zajistit strategické partnerství s Ruskem" # todo: NEW TRANSLATION
 IND_sukhoi_jets: "Pořiďte letouny Sukhoi" # todo: NEW TRANSLATION
 IND_sukhoi_jets_desc: "Získání nejnovějších a nejlepších ruských stíhaček může prospět našemu letectvu TNI-AU. Měli bychom plánovat uzavření dohod s Ruskem o dodávkách několika stíhaček." # todo: CHANGED
 IND_russian_tourist: "Rozmazlovat ruské turisty" # todo: NEW TRANSLATION
 IND_russian_tourist_desc: "Rozmazlování ruských turistů zlepší obraz našeho národa v jejich očích. Měli bychom to zvážit, protože velká část našeho cestovního ruchu pochází z Ruska." # todo: CHANGED
 IND_talk_with_neighbors: "Jednání s našimi sousedy" # todo: NEW TRANSLATION
 IND_talk_with_neighbors_desc: "Jednání s našimi sousedy může skutečně rozšířit naše poselství po jihovýchodní Asii." # todo: CHANGED
 IND_australia: "Jednat s Austrálií" # todo: NEW TRANSLATION
 IND_australia_desc: "Musíme s Austrálií probrat několik skutečně důležitých věcí. Zejména Východní Timor a jejich zapojení." # todo: NEW TRANSLATION
 IND_apologize_australia: "Omluvit se Austrálii" # todo: NEW TRANSLATION
 IND_apologize_australia_desc: "Měli bychom se omluvit Australanům a rodinám dobrovolníků, kteří zemřeli. Možná jsme byli při udržování kontroly trochu příliš tvrdí." # todo: CHANGED
 IND_reparations_give: "Poskytnout odškodnění" # todo: NEW TRANSLATION
 IND_reparations_give_desc: "Poskytněme rodinám dobrovolníků finanční odškodnění jako omluvu a zároveň tím zlepšeme obraz našeho národa." # todo: CHANGED
 IND_high_prices: "Vysoké ceny!" # todo: NEW TRANSLATION
 IND_meet_minister_australia: "Setkat se s ministrem Austrálie" # todo: NEW TRANSLATION
 IND_meet_minister_australia_desc: "Nedávno jsme se setkali s premiérem Austrálie a naštěstí byly vyřešeny všechny problémy. Doufejme v lepší vztahy!" # todo: NEW TRANSLATION
 IND_confront_australia: "Konfrontovat Australané" # todo: NEW TRANSLATION
 IND_confront_australia_desc: "Musíme se s nimi konfrontovat kvůli jejich zapojení do Východního Timoru. Způsobili, že indonéský národ utrpěl újmu a smutek." # todo: CHANGED
 IND_demand_reparations: "Žádat o odškodnění" # todo: NEW TRANSLATION
 IND_demand_reparations_desc: "Rodiny našich mužů a žen potřebují okamžité finanční odškodnění. Pokud toto odškodnění nedostaneme, vezmeme si ho silou..." # todo: NEW TRANSLATION
 IND_malaysia: "Jednat s Malajsií" # todo: NEW TRANSLATION
 IND_malaysia_desc: "Malajsie a Indonésie jsou dvě blízké sousedé, avšak poslední problémy nás od sebe oddělují." # todo: NEW TRANSLATION
 IND_demand_riau: "Žádat o vydání Riau" # todo: NEW TRANSLATION
 IND_demand_riau_desc: "Riau je oprávněně indonéské území a neradi, když ho Malaysijci nárokují. Musíme je okamžitě vyzvat, aby se stáhli!" # todo: NEW TRANSLATION
 IND_cede_riau: "Přenejte Riau" # todo: NEW TRANSLATION
 IND_cede_riau_desc: "Postoupení Riau vyřeší mnoho našich problémů. Nestojí za to bojovat kvůli malému ostrovu." # todo: CHANGED
 IND_strategic_partnership: "Strategické partnerství" # todo: NEW TRANSLATION
 IND_strategic_partnership_desc: "Nyní se můžeme stát strategickými partnery Malajsie. Poté, co ustoupili od Riau, si nás skutečně oblíbili." # todo: CHANGED
 IND_combat_it: "Boj proti radikalismu" # todo: NEW TRANSLATION
 IND_combat_it_desc: "Boj proti radikalismu je nejlepší možností. Tímto bojem vyšleme důrazný signál těm, kteří jej praktikují. Může to také posílit naši vlastní moc a umožní nám to uplatňovat vliv na různé aspekty života našeho lidu." # todo: CHANGED
 IND_bolster_party_pop: "Posílit popularitu strany" # todo: NEW TRANSLATION
 IND_bolster_party_pop_desc: "Posílení popularity našich stran je win-win situace, lidé začnou naši zemi milovat a my získáme trochu více podpory pro nadcházející volby!" # todo: NEW TRANSLATION
 IND_derad_campaign: "Kampaňe de-radikálizace" # todo: NEW TRANSLATION
 IND_derad_campaign_desc: "Ještě není pozdě napravit ty, kteří byli radikalizováni. Po celé Indonésii můžeme pořádat vládou sponzorované kampaně, které pomohou lidem zbavit se radikalismu." # todo: CHANGED
 IND_investigate_growth: "Prozkoumejte jejich růst" # todo: NEW TRANSLATION
 IND_investigate_growth_desc: "Vyčlenění části našeho rozpočtu na lepší policejní dohled nám může napovědět, proč počet radikálů každým dnem roste." # todo: CHANGED
 IND_start_media_campaign: "Zahajte mediální kampaně" # todo: NEW TRANSLATION
 IND_start_media_campaign_desc: "Získání opory v médiích může být dobrým způsobem, jak změnit pohled některých radikálů." # todo: CHANGED
 IND_control_net: "Boj proti radikálnímu obsahu na síti" # todo: NEW TRANSLATION
 IND_control_net_desc: "Boj proti radikálům na internetu je jedním z mnoha způsobů, jak je i jejich myšlenky odstranit z stále více digitalizovaného indonéského národa." # todo: CHANGED
 IND_filter_net: "Filtrujte síť" # todo: NEW TRANSLATION
 IND_filter_net_desc: "Úplné filtrování internetu může naše lidi rozzlobit, ale umožní nám mnohem snadněji kontrolovat, jaký obsah se dostává dovnitř a ven, než kdybychom jen sledovali několik stránek." # todo: CHANGED
 IND_bolster_nationalism: "Podněcujte indonéský nacionalismus" # todo: NEW TRANSLATION
 IND_bolster_nationalism_desc: "Udělejme naše lidi hrdými na náš národ a trochu je odveďme od náboženství." # todo: CHANGED
 IND_rallies_schools: "Uspořádejte shromáždění ve školách" # todo: NEW TRANSLATION
 IND_rallies_schools_desc: "Pořádání shromáždění může mládeži ukázat nebezpečí radikalizace." # todo: NEW TRANSLATION
 IND_arrest_members: "Zadržte radikální vůdce" # todo: NEW TRANSLATION
 IND_arrest_members_desc: "Prohlídka našich věznic pro známé radikální vůdce ukáže jejich stoupencům, co je čeká." # todo: CHANGED
 IND_curb_fpi: "Omez FPI" # todo: NEW TRANSLATION
 IND_curb_fpi_desc: "FPI neboli Fronta islámských obránců je nebezpečná radikální organizace, která má největší vliv na extremistické ideologie. Omezení jejího vlivu a moci je klíčové pro boj proti radikalismu v našem národě." # todo: CHANGED
 IND_persecute: "Pronásledovat FPI" # todo: NEW TRANSLATION
 IND_persecute_desc: "Pronásledování FPI vyřadí extrémistické postoje z naší země a tito lidé budou souzeni podle našeho justice systému!" # todo: NEW TRANSLATION
 IND_embrace_it: "Zjemnit náš postoj" # todo: NEW TRANSLATION
 IND_embrace_it_desc: "Zmírnění našeho postoje může přimět tyto radikály změnit na nás názor, riskujeme však vytvoření situace, kterou v budoucnu nemusíme být schopni kontrolovat…" # todo: CHANGED
 IND_tell_police_backdown: "Zrušte bezpečnostní jednotky v radikálních oblastech" # todo: NEW TRANSLATION
 IND_tell_police_backdown_desc: "Rozpuštění těchto bezpečnostních jednotek ukáže radikálům, že pro ně nepředstavujeme hrozbu, a snad si nás oblíbí." # todo: CHANGED
 IND_fund_their_media: "Povolte FPI v médiích" # todo: NEW TRANSLATION
 IND_fund_their_media_desc: "Povolením FPI v médiích ukáže plody Indonéské demokracie. Každý má právo vyjadřovat se v této zemi a nebudeme diskriminovat podle ideologií!" # todo: NEW TRANSLATION
 IND_beyond_our_control: " Počkejte.. Proč bouří?!" # todo: NEW TRANSLATION
 IND_beyond_our_control_desc: "Ti nevděční radikálové! Zdá se, že vyvolávají výtržnosti a ničí naše ulice žádající svrhnutí vlády. Jak se to mohlo stát? Kdo by to čekal?" # todo: NEW TRANSLATION
 IND_parliament_stormed: "Parlament obsazen!" # todo: NEW TRANSLATION
 IND_parliament_stormed_desc: "Parlament byl obsazen a několik klíčových představitelů bylo zajato. Útočníci požadují jejich rezignaci výměnou za svobodu." # todo: NEW TRANSLATION
 IND_fpi: "FPI uchvátila moc" # todo: NEW TRANSLATION
 IND_fpi_desc: "Temný den v dějinách našeho národa… Úžasný den v dějinách našeho národa je dnes skutečně zde a díky moci, kterou nám dali naši stoupenci, tento národ očistíme cihlu po cihle!" # todo: CHANGED
 IND_touch_on_economy: "Dotkněte se ekonomiky" # todo: NEW TRANSLATION
 IND_touch_on_economy_desc: "Náš národ prochází těžkými časy. Pokud oživíme některé aspekty naší ekonomiky, mohli bychom uniknout spárům kolapsu." # todo: CHANGED
 IND_fund_for_holy: "Fatva továren" # todo: NEW TRANSLATION
 IND_fund_for_holy_desc: "Budují se nové továrny pro dělníky. To podpoří výrobu zboží a jeho tok v našem národě." # todo: CHANGED
 IND_oppose_invest: "Odmítání investic" # todo: NEW TRANSLATION
 IND_oppose_invest_desc: "Odmítání zahraničních investic je jeden ze způsobů, jak chránit naše zdroje a udržet naši zemi nezávislou!" # todo: NEW TRANSLATION
 IND_convert_tourist_destination: "Oživit turistické destinace" # todo: NEW TRANSLATION
 IND_convert_tourist_destination_desc: "Kdo se stará o pláž nebo dvě? Nebo o starou skalní formaci? Nebo o nějaký hloupý nevěřící chrám postavený před 500 lety? Potřebujeme co nejvíce prostoru, abychom posílili moc naší země!" # todo: NEW TRANSLATION
 IND_sharia_2: "Šaría!" # todo: NEW TRANSLATION
 IND_sharia: "Šaría!" # todo: NEW TRANSLATION
 IND_sharia_desc: "Se šaríjským zákonem můžeme konečně začít očistovat naši zemi a její společnosti. Ačkoliv na začátku bude odpor, naši lidé si na to časem zvyknou a začnou to milovat." # todo: NEW TRANSLATION
 IND_dress_code: "Vynutit dress code" # todo: NEW TRANSLATION
 IND_dress_code_desc: "Vynucení dress codeu je jistý způsob očisty indonéské společnosti. Pokud to neuděláme, naši lidé se stanou bezvěrci a budou v naší agendě působit problémy!" # todo: NEW TRANSLATION
 IND_gender_seg: "Segregace pohlaví" # todo: NEW TRANSLATION
 IND_gender_seg_desc: "Oddělení pohlaví a jejich přesunutí do příslušných rolí nás posune mnohem dál, než kdybychom jim dovolili dělat, co se jim zachce." # todo: CHANGED
 IND_raid_bar: "Zásahy do barů" # todo: NEW TRANSLATION
 IND_raid_bar_desc: "Navzdory novým zákonům někteří nevěřící stále provozují podzemní bary. Musíme takové operace okamžitě zlikvidovat!" # todo: NEW TRANSLATION
 IND_regional_purification: "Regionální očista" # todo: NEW TRANSLATION
 IND_regional_purification_desc: "Jak můžeme očistit náš lid, pokud naši sousedé jsou nevěřící a nečistí? Je čas vzít záležitosti do svých rukou!" # todo: NEW TRANSLATION
 IND_purify_philippines: "Očistěme Filipíny" # todo: NEW TRANSLATION
 IND_purify_philippines_desc: "Vydejme se na sever, na Filipíny. I když nejde o islámský stát, neznamená to, že se jím nemohou stát!" # todo: NEW TRANSLATION
 IND_purify_singapore: "Očistit Singapur" # todo: NEW TRANSLATION
 IND_purify_singapore_desc: "Singapur je islámská země jako my, avšak jejich absurdní politiky působí, že haní náboženství a čistotu regionu!" # todo: NEW TRANSLATION
 IND_purify_asia: "Očistit jižní Asii" # todo: NEW TRANSLATION
 IND_purify_asia_desc: "Očištění jižní Asie nám umožní získat oporu na celém kontinentu. Pokud to dokážeme, můžeme pokračovat v naší purifikační politice." # todo: CHANGED
 IND_holy_indonesia: "Očistěná Indonésie" # todo: NEW TRANSLATION
 IND_holy_indonesia_desc: "Dosáhli jsme očisty naší země, Indonésie. S tímto můžeme vstoupit do 21. století s islámským zápalem v našich lidech!" # todo: NEW TRANSLATION
 IND_help_aceh: "Pomoc Acehu" # todo: NEW TRANSLATION
 IND_help_aceh_desc: "Toto jsou těžké časy. Aceh postihla katastrofa a naši lidé, kteří tam žijí, jsou ve vážném nebezpečí. Musíme koordinovat úsilí a pomoci jim, jak jen to bude možné." # todo: CHANGED
 IND_send_aid_package: "Koordinovat pomoc při katastrofách" # todo: NEW TRANSLATION
 IND_send_aid_package_desc: "Musíme zorganizovat pomoc po katastrofě pro obyvatele Acehu, aby se mohli znovu postavit na nohy." # todo: CHANGED
 IND_bring_resistance_down_one: "Spřátelit si lokální vůdce" # todo: NEW TRANSLATION
 IND_bring_resistance_down_one_desc: "Spojenectví s místními vůdci nám může pomoci získat jejich důvěru a zahájit první fázi nápravy našich vztahů." # todo: CHANGED
 IND_bring_resistance_down_two: "Poskytnout finanční pomoc regionálním vůdcům" # todo: NEW TRANSLATION
 IND_bring_resistance_down_two_desc: "Poskytnutí peněz regionálním vůdcům je může přimět k zahájení financování obnovy poškozených budov." # todo: CHANGED
 IND_bring_resistance_down_three: "Zadržet potížisty" # todo: NEW TRANSLATION
 IND_bring_resistance_down_three_desc: "Někteří v Aceh nechtějí mír, navzdory strašné katastrofě, která nastala. Musíme si s nimi poradit, abychom se mohli posunout z tohoto zbytečného konfliktu." # todo: NEW TRANSLATION
 IND_bring_resistance_down_four: "Vraťte Aceh!" # todo: NEW TRANSLATION
 IND_bring_resistance_down_four_desc: "Je čas... je čas, abychom konečně vrátili Aceh lid Indonésie, abychom mohli po staletí prosperovat!" # todo: NEW TRANSLATION
 indonesia.8.t: "Indonésie požaduje odškodnění za Timor-Leste!" # todo: NEW TRANSLATION
 indonesia.8.d: "Indonésie požaduje, abychom zaplatili odškodné za naše úsilí o nezávislost Východního Timoru. Požadují nehoráznou částku peněz, která by vyšla z kapes Austrálie. Můžeme to odmítnout, tím bychom však mohli vyvolat situaci, kterou už nebudeme schopni kontrolovat." # todo: CHANGED
 indonesia.8.a: "Řekněte jim, ať si to přijedou vyzvednout" # todo: NEW TRANSLATION
 indonesia.8.b: "Dobře, pokud to znamená, že budou muset přijít" # todo: NEW TRANSLATION
 indonesia.800.t: "Přijali!" # todo: NEW TRANSLATION
 indonesia.800.d: "Australané nabídli zaplatit odškodnění za jejich zapojení do Timor-Leste, i když to možná nebude stačit, protože nám způsobili ztrátu našeho území..." # todo: NEW TRANSLATION
 indonesia.800.a: "Perfektní!" # todo: NEW TRANSLATION
 indonesia.80.t: "Odmítli!" # todo: NEW TRANSLATION
 indonesia.80.d: "Poté, co jsme Australanům předložili velmi milostnou a štědrou žádost, ji odmítli. Zdá se, že nejsou ochotni s námi spolupracovat, a co víme, necítí lítost nad způsobenou bolestí naší země!" # todo: NEW TRANSLATION
 indonesia.80.a: "Dobře, tedy získáme odškodnění jinak!" # todo: NEW TRANSLATION
 indonesia.7.t: "Indonésie požaduje, abychom se stáhli z Riau!" # todo: NEW TRANSLATION
 indonesia.7.d: "Velvyslanci Indonésie požadují, abychom se vzdali svých nároků na Riau. Tato otázka je mezi našimi dvěma národy předmětem vášnivých debat a zdá se, že konečně dosáhla bodu varu. Musíme připravit odpověď co nejdříve." # todo: CHANGED
 indonesia.7.a: "Ne, Riau je NAŠE!" # todo: NEW TRANSLATION
 indonesia.7.b: "Nechte je mít to, nepotřebujeme ten smutný malý ostrov" # todo: NEW TRANSLATION
 indonesia.70.t: "Malajsie odmítá postoupit Riau!" # todo: CHANGED
 indonesia.70.d: "Malayští diplomaté nás nedávno upozornili na jejich odmítnutí naší nabídky. To je porušení suverenity Indonésie a musí být vyřešeno odpovídající reakcí!" # todo: NEW TRANSLATION
 indonesia.70.a: "Požádali o to.." # todo: NEW TRANSLATION
 indonesia.700.t: "Postoupili Riau!" # todo: CHANGED
 indonesia.700.d: "Zdá se, že naše zpráva byla hlasitá a jasná, Riau je náš! Malayští diplomaté nám nedávno řekli, že stát se vzdal všech nároků na ostrov Riau. Indonésie může nyní zhluboka vydechnout" # todo: NEW TRANSLATION
 indonesia.700.a: "Dobré" # todo: NEW TRANSLATION
 indonesia.5865.t: "Přicházejí pohromy!" # todo: NEW TRANSLATION
 indonesia.5865.d: "V Indonésii dojde k velkému množství katastrof. Pro zajištění stability Indonésie nezapomeňte zkontrolovat záložku \"Rozhodnutí\" a dokončit zadané úkoly v části \"Strašné indonéské štěstí\". Vaším prvním úkolem bude vybudovat loděnici v Kalimantanu, abyste zabránili průmyslové katastrofě. Hodně štěstí!" # todo: CHANGED
 indonesia.5865.a: "Dobře" # todo: NEW TRANSLATION
 indonesia.923.t: "Budoucnost Indonésie" # todo: NEW TRANSLATION
 indonesia.923.d: "Naše země se už dlouho nachází v rozvratu, sahající až do doby, kdy jsme získali nezávislost na Nizozemsku. Od finančních problémů po sociální a etnické problémy Indonésie byla zasažena ze všech stran a už to dlouho nevydrží. Rozhodná akce musí být podniknuta, aby Indonésie přežila a prosperovala ve 21. století. Proto musíme nejprve začít řešit problémy blízko domova." # todo: NEW TRANSLATION
 indonesia.923.a: "Jdeme dál!" # todo: NEW TRANSLATION
 indonesia.69.t: "Násilí v Kalimantanu!" # todo: NEW TRANSLATION
 indonesia.69.d: "Řetězec násilí vznikl poté, co byli dva Madurejci napadeni několika Dayak v Sampi během migrační události. Tento konflikt se nyní zvrhl v plnohodnotnou krizi, při níž počet obětí stoupá den ze dne a mnoho lidí je vysídáváno ze svých domovů. Bezpečnostní složky jsou momentálně na pokyny." # todo: NEW TRANSLATION
 indonesia.69.a: "Oni to zvládnou sami!" # todo: NEW TRANSLATION
 indonesia.69.b: "Na co čekáš? Oprav to!" # todo: NEW TRANSLATION
 indonesia.5.t: "Indonésie žádá o finanční prostředky" # todo: NEW TRANSLATION
 indonesia.5.d: "Indonésie má doma skutečně vyhrocený náboženský konflikt a spoléhá na nás, že jí poskytneme finanční pomoc" # todo: NEW TRANSLATION
 indonesia.5.a: "Jistě, pokud je to pro větší dobro" # todo: NEW TRANSLATION
 indonesia.5.b: "Pfft... Ne." # todo: NEW TRANSLATION
 indonesia.50.t: "Nizozemci souhlasí s naší pomocí!" # todo: NEW TRANSLATION
 indonesia.50.d: "Po pečlivém zvážení nám nizozemští diplomaté nabídli malé množství peněz, které můžeme dát našim křesťanům, aby vyhráli konflikty" # todo: NEW TRANSLATION
 indonesia.50.a: "Perfektní" # todo: NEW TRANSLATION
 indonesia.500.t: "Nizozemci odmítají pomoc!" # todo: NEW TRANSLATION
 indonesia.500.d: "Nizozemští diplomaté nám přišli oznámit, že jejich vláda odmítla naši pomoc křesťanům!" # todo: NEW TRANSLATION
 indonesia.500.a: "Neuvěřitelné" # todo: NEW TRANSLATION
 indonesia.6.t: "Indonésie žádá o finanční prostředky" # todo: NEW TRANSLATION
 indonesia.6.d: "Indonésie má doma skutečně vyhrocený náboženský konflikt a spoléhá na nás, abychom jí poskytli finanční pomoc" # todo: NEW TRANSLATION
 indonesia.6.a: "Jistě, pokud je to pro větší dobro" # todo: NEW TRANSLATION
 indonesia.6.b: "Pfft... Ne." # todo: NEW TRANSLATION
 indonesia.60.t: "Saúdové souhlasí, že nám pomohou!" # todo: CHANGED
 indonesia.60.d: "Po pečlivém zvážení nám saudští diplomaté nabídli malé množství peněz, které můžeme dát našim muslimům, aby vyhráli konflikty" # todo: NEW TRANSLATION
 indonesia.60.a: "Perfektní" # todo: NEW TRANSLATION
 indonesia.600.t: "Saúdové pomoc odmítají!" # todo: CHANGED
 indonesia.600.d: "Saudští diplomaté nám přišli oznámit, že jejich vláda odmítla naši pomoc muslimům!" # todo: NEW TRANSLATION
 indonesia.600.a: "Neuvěřitelné" # todo: NEW TRANSLATION
 indonesia.772.t: "Radikální vůdce Rizieq Shihab zatčen!" # todo: NEW TRANSLATION
 indonesia.772.d: "Radikální vůdce organizace „FPI“, Rizieq Shihab, byl zatčen a nyní čeká na soud. Toto je významné vítězství pro indonéskou bezpečnost, protože naše demokracie už není v bezprostředním ohrožení radikálů a jejich zpátečnických ideálů!" # todo: NEW TRANSLATION
 indonesia.772.a: "Vítězství pro demokracii." # todo: NEW TRANSLATION
 indonesia.2.t: "Otázka Východního Timoru" # todo: NEW TRANSLATION
 indonesia.2.d: "Nadešel čas, hořký okamžik pro náš národ. Obyvatelé Východního Timoru, jednoho z našich mnoha ostrovů, požadují nezávislost. Brutální protesty, nepokoje a střety způsobily značnou nestabilitu a vážně zpomalily politický i společenský pokrok. Nyní je na nás, abychom rozhodli o osudu národa: buď vyhovíme přání OSN, nebo se vydáme vlastní cestou." # todo: CHANGED
 indonesia.2.a: "To je to, co chtějí lidé Východního Timoru... Ne my" # todo: NEW TRANSLATION
 indonesia.2.b: "Co teď chtějí udělat?!" # todo: NEW TRANSLATION
 indonesia.3.t: "OSN schvaluje ústavu!" # todo: NEW TRANSLATION
 indonesia.3.d: "Po našem schválení nezávislosti Východního Timoru schválila Organizace spojených národů ústavu tohoto národa. Demokratický a nezávislý Východní Timor se brzy stane naším sousedem…" # todo: CHANGED
 indonesia.3.a: "To je to, co chtěli" # todo: NEW TRANSLATION
 indonesia.4.t: "Timor-Leste is free!" # todo: NEW TRANSLATION
 indonesia.4.d: "Je to oficiální. Schválení jejich ústavy OSN bylo konečně provedeno, a nezávislý Timor-Leste je nyní naším sousedem." # todo: NEW TRANSLATION
 indonesia.4.a: "Doufám v dobré vztahy" # todo: NEW TRANSLATION
 indonesia.9.t: "Indonésie popírá nezávislost Východního Timoru!" # todo: NEW TRANSLATION
 indonesia.9.d: "Indonésijský režim popřel lidem Východního Timoru jejich svobodu a nezávislost. Mnoho povstaleckých skupin na nás hledí jako na možné osvoboditele a v současnosti se napětí v regionu i ve světě zvyšuje..." # todo: NEW TRANSLATION
 indonesia.9.a: "Dobře, stačilo!" # todo: NEW TRANSLATION
 indonesia.9.b: "Není to náš problém" # todo: NEW TRANSLATION
 indonesia.55.t: "Budoucnost našich studentů!" # todo: NEW TRANSLATION
 indonesia.55.d: "Nadešel čas prodiskutovat budoucnost vzdělávání našich dětí. Ministerstvo náboženských záležitostí spravuje školský systém odnepaměti a našim studentům předává umírněné množství islámského učení. Musíme znovu posoudit, zda je tento přístup skutečně účinný…" # todo: CHANGED
 indonesia.55.a: "Pokračovat ve vyučování náboženství!" # todo: NEW TRANSLATION
 indonesia.55.b: "Ukončit vyučování náboženství!" # todo: NEW TRANSLATION
 indonesia.77.t: "Rozsáhlé etnické napětí!" # todo: NEW TRANSLATION
 indonesia.77.d: "Nastal čas vyřešit etnické konflikty zuřící v naší zemi. Místa jako Ambon a Borneo zažívají násilí téměř každý den. Národ to nemůže zvládnout, pokud si lidé navzájem bojují kvůli náboženským přesvědčením. Nyní musíme dát jasně najevo, koho budeme podporovat, pokud vůbec někoho." # todo: NEW TRANSLATION
 indonesia.77.a: "Muslimové nás potřebují!" # todo: NEW TRANSLATION
 indonesia.77.b: "Neděláme si žádné oblíbence, jen to už opravte!" # todo: NEW TRANSLATION
 indonesia.77.c: "Křesťané nás potřebují!" # todo: NEW TRANSLATION
 indonesia.1000.t: "Parlament dobyt" # todo: NEW TRANSLATION
 indonesia.1000.d: "Měsíce nepokojů a střetů nás konečně dovedly až sem… Naši stoupenci úspěšně vtrhli do indonéského parlamentu a požadovali odstoupení několika klíčových osobností. Všichni vyhověli. Indonéský lid je nyní osvobozen od věčné tyranie této takzvané demokracie." # todo: CHANGED
 indonesia.1000.a: "Revoluce uspěla" # todo: NEW TRANSLATION
 indonesia.1001.t: "Ambon City under Christian control!" # todo: NEW TRANSLATION
 indonesia.1001.d: "Roky bojů v Ambonu konečně skončily a jeho obyvatelé si mohou oddechnout. Křesťané ve městě zvítězili a začali jsme jmenovat křesťanské vůdce místních měst a vesnic." # todo: CHANGED
 indonesia.1001.a: "Bylo jen otázkou času.." # todo: NEW TRANSLATION
 indonesia.1002.t: "Ambon City under Muslim control!!" # todo: NEW TRANSLATION
 indonesia.1002.d: "Roky bojů v Ambonu konečně skončily a jeho obyvatelé si mohou oddechnout. Muslimové ve městě zvítězili a začali jsme jmenovat muslimské vůdce místních měst a vesnic." # todo: CHANGED
 indonesia.1002.a: "Jak se dalo očekávat" # todo: NEW TRANSLATION
 indonesia.27.t: "Wahidovo odvolání!" # todo: NEW TRANSLATION
 indonesia.27.d: "Po plenárním zasedání se MPR rozhodlo odvolat prezidenta Wahida z důvodu nezpůsobilosti, způsobené jeho bezohlednou politikou a zvládáním finanční krize. Viceprezidentka Megawati Soekarnoputri byla nyní jmenována prezidentkou Indonésie!" # todo: CHANGED
 indonesia.27.a: "Zasloužil si to!" # todo: NEW TRANSLATION
 indonesia.37.t: "Útok na Bali!" # todo: NEW TRANSLATION
 indonesia.37.d: "V nočním klubu na Bali vybuchlo několik bomb a zabilo 202 lidí, včetně našich občanů i cizinců. Zahynulo 88 Australanů a nyní jsme pod tlakem australských úřadů i dalších stran, abychom proti této věci zasáhli. Prsty se ukazují na extremistickou skupinu Jemaah Islamiyah, o níž je známo, že stojí za podobnými útoky. Musíme o této záležitosti okamžitě rozhodnout, než se situace zhorší." # todo: CHANGED
 indonesia.37.a: "Zahajte vyšetřování, a odškodněte rodiny" # todo: NEW TRANSLATION
 indonesia.37.b: "Jak smutné" # todo: NEW TRANSLATION
 indonesia.477.t: "Přepadení" # todo: NEW TRANSLATION
 indonesia.477.d: "Rozhněvaná demonstrace dobyla zbrojnici v okrese Wamena a situace by mohla být katastrofální. Naše bezpečnostní složky začaly evakuovat civilisty, kteří by mohli být v ohrožení, a dostat je do bezpečí, nicméně motivy této davy jsou v současnosti neznámé." # todo: NEW TRANSLATION
 indonesia.477.a: "Pospěš a něco udělej!" # todo: NEW TRANSLATION
 indonesia.477.b: "Snad se to samo vyřeší" # todo: NEW TRANSLATION
 indonesia.577.t: "Tsunami v Acehu" # todo: NEW TRANSLATION
 indonesia.577.d: "Bandu Aceh a další části provincie zasáhla ničivá tsunami. Aceh byl centrem partyzánské války a odporu, což při katastrofách vedlo k nedostatku spolupráce mezi námi a jeho obyvateli. Tentokrát je však situace zcela jiná. Sami si již nemohou dovolit vypořádat se s událostí takového rozsahu a potřebují naši pomoc při obnově. GAM nabídla příměří a je ochotna spolupracovat na ukončení našeho konfliktu." # todo: CHANGED
 indonesia.577.d1: "Bandu Aceh a další části provincie zasáhla ničivá tsunami. Již tak ochromený region, který roky trpěl partyzánskou válkou a odporem, je nyní ještě více zdevastovaný. Je nezbytné začít se zabývat obnovou této oblasti, jinak riskujeme další povstání." # todo: CHANGED
 indonesia.577.a: "Další pohroma..." # todo: NEW TRANSLATION
 indonesia.67.t: "Problémy s uprchlíky ve Západní Papui" # todo: NEW TRANSLATION
 indonesia.67.d: "Znovu se Australané vměšují do našich vnitřních záležitostí, tentokrát však nabízejí azyl pro potížisty ve Západní Papui. Napětí mezi Jakartou a Canberrou dosáhlo bodu varu a jsme připraveni jednat, je-li to potřeba!" # todo: NEW TRANSLATION
 indonesia.67.a: "Fund surveillance stations to prevent this in the future!" # todo: NEW TRANSLATION
 indonesia.67.b: "Perhaps the funds can go.. Elsewhere..." # todo: NEW TRANSLATION
 indonesia.678.t: "Vzniká Národní výbor Západní Papuy" # todo: CHANGED
 indonesia.678.d: "Národní výbor Západní Papuy, známý také jako KNPB, je skupina působící v Západní Papui, která prosazuje referendum o statusu tohoto regionu. Přestože jejich poselství je mírové, dosažení jejich cílů by pro náš národ znamenalo katastrofu." # todo: CHANGED
 indonesia.678.a: "Disband the Committee" # todo: NEW TRANSLATION
 indonesia.678.b: "A little delay in construction isn't a big issue" # todo: NEW TRANSLATION
 indonesia_news.1.d: "Test" # todo: NEW TRANSLATION
 indonesia_news.1.a: "Test" # todo: NEW TRANSLATION
 indonesia.95.t: "Východní Timor vyhlásil nezávislost!" # todo: NEW TRANSLATION
 indonesia.95.d: "Po našem rozhodnutí ohledně zachování našeho oprávněného území se Východní Timor rozhodl vyhlásit nezávislost. Nicméně nejvíce šokující je, že Australané je tajně vyzbrojili zbraněmi a nyní se vzbouřují proti nám!" # todo: NEW TRANSLATION
 indonesia.95.a: "Pomstíme se v pravý čas!" # todo: NEW TRANSLATION
 indonesia.420.t: "Volání o pomoc!" # todo: NEW TRANSLATION
 indonesia.420.d: "Abychom řešili probíhající asijskou finanční krizi v naší zemi, musíme hledat pomoc u zahraničních subjektů. Japonsko je naším nejbližším partnerem, který je ochoten pomoci. Nicméně Japonsko nám v minulosti ublížilo a mnoho nacionalistických a anti-západních skupin žádá o jinou alternativu, a druhou alternativou je Čína. Čína je také otevřena pomoci naší zemi, avšak poskytnutí pomoci by nás postavilo do jejich přímé sféry vlivu, což by mohlo posunout naši politiku." # todo: NEW TRANSLATION
 indonesia.420.a: "Potřebujeme japonskou pomoc!" # todo: NEW TRANSLATION
 indonesia.420.b: "Čína ví, co dělá, zavolejte jim!" # todo: CHANGED
