 IND_popular_tourist_destination_desc: "Indonésie je velmi oblíbenou turistickou destinací. Je to výsledek naší skvělé kultury a historie." # todo: CHANGED
 IND_growing_radicalization: "Rostoucí radikalizace" # todo: NEW TRANSLATION
 IND_growing_radicalization_desc: "Jako islámská země je mládež a obyvatelstvo našeho národa náchylné k radikalizaci a tvrdě dogmatickým ideálům." # todo: CHANGED
 IND_asian_crisis: "Asijská finanční krize v Indonésii" # todo: NEW TRANSLATION
 IND_asian_crisis_desc: "Asijská finanční krize z roku 1997 tvrdě zasáhla Indonésii i její sousedy a zpomalila téměř všechny oblasti života v národě." # todo: CHANGED
