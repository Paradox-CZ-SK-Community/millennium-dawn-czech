l_english:
 gpu_development.1.t: "Radeon vyzývá GeForce" # todo: NEW TRANSLATION
 gpu_development.1.d_usa: "Měsíce poté, co GeForce společnosti NVIDIA představila hardwarovou transformaci a osvětlení, se ATI připravuje odhalit Radeon jako přímou výzvu v rychlosti, ovladačích a loajalitě vývojářů. Tato konkurence posouvá americký vývoj grafiky na samotnou hranici možností, přestože obě firmy nevlastní vlastní výrobní závody a každý pokrok prohlubuje jejich závislost na hrstce tchajwanských sléváren. Washington může ponechat grafické standardy a federální výzkum široce otevřené, nebo soustředit podporu za nejsilnější domácí návrhářské společnosti." # todo: NEW TRANSLATION
 gpu_development.1.a_usa: "Podpořit otevřené standardy a výzkum" # todo: NEW TRANSLATION
 gpu_development.1.b_usa: "Podpořit přední návrhářské společnosti" # todo: NEW TRANSLATION
 gpu_development.1.d_can: "ATI Technologies se ze svého sídla v Markhamu připravuje odhalit Radeon a vyzvat NVIDIA v boji o výkonnostní prvenství, které si GeForce připsala před několika měsíci. Tato firma je jedním z mála kanadských šampionů v polovodičovém průmyslu, avšak soutěž na hranici možností bude vyžadovat lepší přístup ke kapitálu, výrobním kapacitám a softwarovým vývojářům, kteří rozhodují o tom, který hardware uspěje. Ottawa může chránit nezávislost ATI jako národní návrhářské společnosti, nebo ji začlenit do kontinentálních dodavatelských řetězců propojujících kanadský vývoj s americkým kapitálem a asijskou výrobou." # todo: NEW TRANSLATION
 gpu_development.1.a_can: "Chránit nezávislost ATI" # todo: NEW TRANSLATION
 gpu_development.1.b_can: "Začlenit ATI do kontinentálního zásobování" # todo: NEW TRANSLATION
 gpu_development.1.d_tai: "Souboj mezi Radeonem a GeForce přichází v podobě nových objednávek waferů na Tchaj-wanu, kde oba návrháři bez vlastních továren závisejí na místních slévárnách při výrobě svých čipů. Tento vznikající trh s grafikou může rozšířit zákaznickou základnu ostrovního mikročipového průmyslu, nebo soustředit vzácné špičkové kapacity za nejrychleji rostoucími návrhářskými společnostmi. Tchaj-pej se musí rozhodnout, zda ponechá přístup ke slévárnám otevřený mnoha zákazníkům, nebo zajistí dlouhodobé smlouvy s několika hlavními návrháři." # todo: NEW TRANSLATION
 gpu_development.1.a_tai: "Rozšířit přístup ke slévárnám" # todo: NEW TRANSLATION
 gpu_development.1.b_tai: "Zajistit smlouvy s hlavními návrháři" # todo: NEW TRANSLATION
 gpu_development.2.t: "Shadery se stávají programovatelnými" # todo: NEW TRANSLATION
 gpu_development.2.d_usa: "DirectX 8 a nová generace grafických procesorů nahradily pevně dané pipeline programovatelnými vertexovými a pixelovými shadery. Dodavatelé hardwaru, herní studia a vývojáři operačních systémů nyní soupeří o definici rozhraní, která budou utvářet grafiku v reálném čase." # todo: NEW TRANSLATION
 gpu_development.2.a_usa: "Standardizovat rozhraní shaderů" # todo: NEW TRANSLATION
 gpu_development.2.b_usa: "Nechat dodavatele rozšiřovat své platformy" # todo: NEW TRANSLATION
 gpu_development.2.d_can: "Inženýři ATI pracují na podpoře programovatelných shaderů v rychle se rozvíjející grafické architektuře. Společná rozhraní by rozšířila trh pro kanadské návrhy, zatímco proprietární rozšíření by mohla ATI poskytnout dočasný technologický náskok." # todo: NEW TRANSLATION
 gpu_development.2.a_can: "Vybudovat systém kolem společných rozhraní" # todo: NEW TRANSLATION
 gpu_development.2.b_can: "Odlišit platformu Radeon" # todo: NEW TRANSLATION
 gpu_development.2.d_jap: "Programovatelná grafika mění způsob, jakým výrobci konzolí a herní studia rozdělují práci mezi hardware a software. Japonští vlastníci platforem mohou podporovat přenositelné standardy shaderů, nebo zachovat těsně optimalizované architektury pro své vlastní konzole." # todo: NEW TRANSLATION
 gpu_development.2.a_jap: "Podpořit přenositelné grafické standardy" # todo: NEW TRANSLATION
 gpu_development.2.b_jap: "Optimalizovat pro domácí konzolové platformy" # todo: NEW TRANSLATION
 gpu_development.3.t: "AMD kupuje ATI" # todo: NEW TRANSLATION
 gpu_development.3.d_usa: "AMD se dohodla na koupi ATI, čímž spojí procesory x86, čipové sady a grafiku pod jednu společnost. Fúze slibuje integrované výpočetní platformy, zároveň však snižuje počet nezávislých firem soupeřících o grafický vývoj a výrobní kapacity sléváren." # todo: NEW TRANSLATION
 gpu_development.3.a_usa: "Zachovat konkurenci kolem fúze" # todo: NEW TRANSLATION
 gpu_development.3.b_usa: "Podpořit integrovanou výpočetní platformu" # todo: NEW TRANSLATION
 gpu_development.4.t: "CUDA otevírá paralelní výpočty" # todo: NEW TRANSLATION
 gpu_development.4.d_usa: "NVIDIA vydala CUDA, která umožňuje programátorům využívat kompatibilní grafické procesory k úlohám dalece přesahujícím vykreslování. Vědecké výpočty, simulace a analýza dat nyní mohou využívat tisíce paralelních vláken, pokud se však vývojáři zavážou k softwarovému ekosystému NVIDIA." # todo: NEW TRANSLATION
 gpu_development.4.a_usa: "Podporovat přenositelné výpočetní standardy" # todo: NEW TRANSLATION
 gpu_development.4.b_usa: "Nasadit ekosystém CUDA" # todo: NEW TRANSLATION
 gpu_development.5.t: "AlexNet mění závod v umělé inteligenci" # todo: NEW TRANSLATION
 gpu_development.5.d_usa: "Rozhodující výsledek AlexNetu v soutěži ImageNet ukázal, že rozsáhlé neuronové sítě trénované na grafických procesorech mohou překonat zavedené metody počítačového vidění. Americké laboratoře a technologické firmy spěchají zajistit si akcelerátory, datové sady a výzkumníky dříve, než konkurenti dokážou tento průlom ve velkém zopakovat." # todo: NEW TRANSLATION
 gpu_development.5.a_usa: "Ponechat výzkum akcelerátorů široce dostupný" # todo: NEW TRANSLATION
 gpu_development.5.b_usa: "Rozšířit komerční AI clustery" # todo: NEW TRANSLATION
 gpu_development.5.d_can: "Výzkumníci z Torontské univerzity použili grafické procesory NVIDIA k trénování AlexNetu a zásadně změnili soutěž ImageNet. Kanada nyní disponuje neobvyklou koncentrací odborníků na strojové učení, zahraniční firmy však již soupeří o přijetí tohoto týmu a komercializaci jeho metod." # todo: NEW TRANSLATION
 gpu_development.5.a_can: "Rozšířit veřejnou výzkumnou síť" # todo: NEW TRANSLATION
 gpu_development.5.b_can: "Proměnit průlom v odvětví AI" # todo: NEW TRANSLATION
 gpu_development.6.t: "Tensorová jádra vstupují do datových center" # todo: NEW TRANSLATION
 gpu_development.6.d_usa: "Architektura Volta společnosti NVIDIA představuje Tensorová jádra navržená k urychlení maticových operací používaných při hlubokém učení. Grafické procesory se stávají specializovanými motory datových center, což zvyšuje poptávku po pokročilé výrobě, pamětech s vysokou propustností a těsně integrovaném softwaru." # todo: NEW TRANSLATION
 gpu_development.6.a_usa: "Rozšířit přístup k AI akcelerátorům" # todo: NEW TRANSLATION
 gpu_development.6.b_usa: "Soustředit se na platformy s kompletním zásobníkem" # todo: NEW TRANSLATION
 gpu_development.6.d_tai: "Akcelerátory třídy Volta vyžadují špičkovou výrobu a stále složitější pouzdření. Tchajwanské slévárny mohou s čipy AI zacházet jako s jednou zákaznickou skupinou z mnoha, nebo vyhradit vzácné pokročilé kapacity nejrychleji rostoucím návrhářům akcelerátorů." # todo: NEW TRANSLATION
 gpu_development.6.a_tai: "Ponechat pokročilé kapacity široce dostupné" # todo: NEW TRANSLATION
 gpu_development.6.b_tai: "Upřednostnit strategické objednávky akcelerátorů" # todo: NEW TRANSLATION
 gpu_development.6.d_kor: "AI akcelerátory potřebují paměti s vysokou propustností, aby zásobovaly tisíce výpočetních jednotek daty. Korejští výrobci pamětí mohou rozšířit HBM jako otevřený průmyslový standard, nebo nové kapacity těsně spojit s předními platformami akcelerátorů." # todo: NEW TRANSLATION
 gpu_development.6.a_kor: "Standardizovat a rozšířit dodávky HBM" # todo: NEW TRANSLATION
 gpu_development.6.b_kor: "Zajistit dlouhodobá partnerství pro akcelerátory" # todo: NEW TRANSLATION
 gpu_development.7.t: "Dodávky GPU vysychají" # todo: NEW TRANSLATION
 gpu_development.7.d_shortage: "Narušení způsobené pandemií, prudce rostoucí poptávka po elektronice a soupeření o výrobní kapacity sléváren zanechaly naši ekonomiku s nedostatkem mikročipů. Grafické karty, vozidla, servery a spotřební zařízení nyní soupeří o stejné omezené dodávky." # todo: NEW TRANSLATION
 gpu_development.7.d_resilient: "Narušení způsobené pandemií a prudce rostoucí poptávka po elektronice zatížily globální trh s mikročipy, naše současné dodávky však zůstávají odolné. Nedostatek v zahraničí je stále varováním i příležitostí k zajištění budoucích kapacit." # todo: NEW TRANSLATION
 gpu_development.7.a_usa: "Koordinovat přístup pro kritické uživatele" # todo: NEW TRANSLATION
 gpu_development.7.b_usa: "Urychlit rozšiřování domácích kapacit" # todo: NEW TRANSLATION
 gpu_development.7.a_can: "Chránit výzkum a malé návrháře" # todo: NEW TRANSLATION
 gpu_development.7.b_can: "Zajistit kontinentální dodavatelské smlouvy" # todo: NEW TRANSLATION
 gpu_development.7.a_tai: "Rozdělit wafery mezi více zákazníků" # todo: NEW TRANSLATION
 gpu_development.7.b_tai: "Urychlit rozšiřování sléváren" # todo: NEW TRANSLATION
 gpu_development.7.a_kor: "Stabilizovat dodávky pamětí" # todo: NEW TRANSLATION
 gpu_development.7.b_kor: "Rozšířit strategickou výrobu čipů" # todo: NEW TRANSLATION
 gpu_development.7.a_chi: "Přídělovat dovozy napříč civilním průmyslem" # todo: NEW TRANSLATION
 gpu_development.7.b_chi: "Urychlit domácí náhradu" # todo: NEW TRANSLATION
 gpu_development.7.a_jap: "Chránit výrobu automobilů a elektroniky" # todo: NEW TRANSLATION
 gpu_development.7.b_jap: "Obnovit domácí kapacity výroby polovodičů" # todo: NEW TRANSLATION
 gpu_development.8.t: "Hopper se stává motorem umělé inteligence" # todo: NEW TRANSLATION
 gpu_development.8.d_usa: "Architektura Hopper společnosti NVIDIA a akcelerátor H100 kombinují Transformer Engines, paměti s vysokou propustností a vysokorychlostní propojení pro rozsáhlé modely AI. Akcelerátor datového centra již není upravenou grafickou kartou, ale samostatným strategickým výpočetním systémem." # todo: NEW TRANSLATION
 gpu_development.8.a_usa: "Podpořit širší ekosystém akcelerátorů" # todo: NEW TRANSLATION
 gpu_development.8.b_usa: "Rozšířit přední platformu s kompletním zásobníkem" # todo: NEW TRANSLATION
 gpu_development.8.d_tai: "Hopper závisí na přizpůsobeném procesu společnosti TSMC a pokročilém pouzdření, které propojuje velké procesorové čipy s pamětí s vysokou propustností. Poptávka po AI mění zahajování výroby waferů i balicí linky ve strategická úzká místa tchajwanského mikročipového průmyslu." # todo: NEW TRANSLATION
 gpu_development.8.a_tai: "Rozšířit přístup k pokročilému pouzdření" # todo: NEW TRANSLATION
 gpu_development.8.b_tai: "Vyhradit kapacity hlavním zákazníkům" # todo: NEW TRANSLATION
 gpu_development.8.d_kor: "Akcelerátory třídy H100 spotřebovávají stohy HBM3, čímž staví korejské výrobce pamětí do středu dodavatelského řetězce AI. Kapacitu lze rozšířit pro rozmanitý trh, nebo ji prostřednictvím hlubokých partnerství zavázat předním dodavatelům platforem." # todo: NEW TRANSLATION
 gpu_development.8.a_kor: "Rozšířit dodávky HBM3" # todo: NEW TRANSLATION
 gpu_development.8.b_kor: "Upřednostnit strategické smlouvy pro platformy" # todo: NEW TRANSLATION
 gpu_development.9.t: "Budování výpočetní infrastruktury pro AI" # todo: NEW TRANSLATION
 gpu_development.9.d_usa: "Generativní AI vyvolala horečné budování datových center napěchovaných pokročilými akcelerátory. Hyperskalární firmy soupeří o mikročipy, elektrickou energii, síťová zařízení a kvalifikované pracovníky, čímž mění výpočetní kapacitu v národní průmyslovou otázku." # todo: NEW TRANSLATION
 gpu_development.9.a_usa: "Ponechat výpočetní trhy široce dostupné" # todo: NEW TRANSLATION
 gpu_development.9.b_usa: "Podpořit strategické národní budování kapacit" # todo: NEW TRANSLATION
 gpu_development.9.d_can: "Kanadská výzkumná základna v oblasti AI a hojnost elektřiny přilákaly návrhy na nové klastry akcelerátorů a datová centra. Toto budování může rozšířit přístup univerzit a startupů, nebo těsněji spojit domácí talenty s několika velkými zahraničními platformami." # todo: NEW TRANSLATION
 gpu_development.9.a_can: "Vyhradit výpočty pro otevřenou výzkumnou síť" # todo: NEW TRANSLATION
 gpu_development.9.b_can: "Využít hlavní firmy k rozšíření kapacit" # todo: NEW TRANSLATION
 gpu_development.9.d_tai: "Poptávka po procesorech pro AI zaplnila objednávkové knihy špičkových sléváren a pokročilého pouzdření. Tchaj-wan může rozšířit přístup k těmto kapacitám napříč polovodičovým ekosystémem, nebo soustředit investice za zákazníky schopnými financovat nejrychlejší expanzi." # todo: NEW TRANSLATION
 gpu_development.9.a_tai: "Diverzifikovat přístup k pokročilým kapacitám" # todo: NEW TRANSLATION
 gpu_development.9.b_tai: "Soustředit se na rychlé rozšiřování sléváren" # todo: NEW TRANSLATION
 gpu_development.9.d_kor: "HBM se stala jedním z největších omezení výroby AI akcelerátorů. Korejské firmy se musí rozhodnout, zda rozšíří kvalifikaci a dodávky napříč trhem, nebo věnují nové výrobní linky dlouhodobým strategickým zákazníkům." # todo: NEW TRANSLATION
 gpu_development.9.a_kor: "Rozšířit kvalifikaci a dodávky HBM" # todo: NEW TRANSLATION
 gpu_development.9.b_kor: "Vybudovat systém kolem strategických zákazníků" # todo: NEW TRANSLATION
 gpu_development.9.d_chi: "Poptávka po výpočetní technice pro AI roste, zatímco přístup k nejpokročilejším zahraničním akcelerátorům zůstává nejistý. Domácí návrháři, slévárny a výrobci pamětí musí sestavit kompletní dodavatelský řetězec, aniž by předpokládali, že každá přední součástka zůstane dostupná." # todo: NEW TRANSLATION
 gpu_development.9.a_chi: "Podpořit otevřené domácí standardy akcelerátorů" # todo: NEW TRANSLATION
 gpu_development.9.b_chi: "Soustředit zdroje na národní šampiony" # todo: NEW TRANSLATION
 gpu_development.9.d_jap: "Boom AI znovu zvýšil strategickou hodnotu japonských polovodičových materiálů, výrobního vybavení, odborných znalostí v oblasti pouzdření a nových výrobních projektů. Koordinované investice by mohly tyto přednosti propojit, průmysl si však musí vybrat mezi širokým přístupem dodavatelů a soustředěným národním programem." # todo: NEW TRANSLATION
 gpu_development.9.a_jap: "Posílit otevřený ekosystém dodavatelů" # todo: NEW TRANSLATION
 gpu_development.9.b_jap: "Koordinovat národní program kapacit" # todo: NEW TRANSLATION
 gpu_2000_graphics_market: "Boom grafického trhu" # todo: NEW TRANSLATION
 gpu_2000_graphics_market_desc: "Prudce rostoucí poptávka po nejnovějších grafických akcelerátorech přitahuje inženýry a objednávky k předním návrhům, urychluje výzkum a zároveň zatěžuje dodávky mikročipů, na nichž jsou všechny tyto technologie závislé." # todo: NEW TRANSLATION
 gpu_accelerator_demand: "Poptávka po akcelerátorech" # todo: NEW TRANSLATION
 gpu_accelerator_demand_desc: "Poptávka po grafických procesorech a AI akcelerátorech přitahuje investice, talenty a mikročipy k pokročilým výpočtům. Výsledná expanze podporuje výzkum a růst datových center, zároveň však vytváří další tlak na širší dodávky čipů." # todo: NEW TRANSLATION
 gpu_foundry_expansion: "Rozšiřování sléváren" # todo: NEW TRANSLATION
 gpu_foundry_expansion_desc: "Veřejné a soukromé investice rozšiřují kapacity továren na mikročipy, pokročilé pouzdření a výrobu pamětí s vysokou propustností, aby pokryly rostoucí poptávku po grafických procesorech a AI akcelerátorech." # todo: NEW TRANSLATION
