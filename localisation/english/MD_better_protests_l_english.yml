l_english:
 MD_protests_open_button_text: "§YMenu protestů§!" # todo: NEW TRANSLATION
 PROTEST_TITLE: "§YProtestní systém§!" # todo: CHANGED
 MD_protests_state_subtitle: "§gAktuální informace o nepokojích§!" # todo: NEW TRANSLATION
 MD_protests_state_warning_subtitle: "§gAktuální informace o protestech§!" # todo: NEW TRANSLATION
 MD_DRIFT_SPENDING_TEXT: "Dopad výdajů:" # todo: NEW TRANSLATION
 MD_DRIFT_SPENDING_VALUE: "[?drift_spending_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_spending_tt: "Občané očekávají základní úroveň sociálních dávek, zdravotnictví, školství, policie, administrativy a vojenských výdajů. Nedostatečné výdaje zvyšují sílu protestů; nadměrné výdaje zmírňují napětí, ale vyčerpávají státní pokladnu. Po vyčerpání paliva se přidává plochá hodnota §R+1§!.\n\nZvyšte zákony označené červeně v mřížce výdajů níže, abyste uzavřeli největší mezery. §YUklidněte protestující§! a §YPreventivní reforma§! vám mohou koupit čas, zatímco vyrovnáváte rozpočet." # todo: NEW TRANSLATION
 MD_DRIFT_STABILITY_TEXT: "Nízká stabilita + volby:" # todo: NEW TRANSLATION
 MD_DRIFT_STABILITY_VALUE: "[?drift_stability_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_stability_tt: "Stabilita klesla pod §Y20%§! a vláda stále pořádá volby, takže voliči vycházejí do ulic.\n\nPřijímejte zaměření a události, které zvyšují stabilitu, a pozastavte nákladné vojenské projekty, které ji snižují. §YSlib: Daňová úleva pro občany§! přidává na 300 dní faktor stability §G+5%§!, takže se každý další nárůst stability projeví rychleji. Nevvolená vláda tento faktor zcela odstraní, pokud vaše politická cesta umožňuje změnu." # todo: NEW TRANSLATION
 MD_DRIFT_INTEREST_TEXT: "Vysoká úroková sazba:" # todo: NEW TRANSLATION
 MD_DRIFT_INTEREST_VALUE: "[?drift_interest_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_interest_tt: "Sazba centrální banky je nad §Y8.9%§!. Půjčky jsou dražší, podniky propouštějí zaměstnance a veřejnost obviňuje vládu.\n\nSnižte sazbu na kartě §YPeníze§!. Jakákoli hodnota pod §G8.9%§! tento faktor odstraní. Čím výše je sazba nad prahem, tím větší je měsíční postih. Udržujte zvyšování sazeb krátké a používejte je pouze proti inflaci." # todo: NEW TRANSLATION
 MD_DRIFT_RECESSION_TEXT: "Recese:" # todo: NEW TRANSLATION
 MD_DRIFT_RECESSION_VALUE: "[?drift_recession_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_recession_tt: "Ekonomika je v recesi. Každý měsíc přidává náhodný postih v průměrné hodnotě kolem §R+3§! síly protestů.\n\nOdstranění ideje §Yrecese§! prostřednictvím ekonomického systému tento faktor zcela odstraní. Sledujte ekonomický panel kvůli událostem obnovy a využijte §YUklidněte protestující§! a §YPreventivní reforma§!, abyste překonali nejhorší období." # todo: NEW TRANSLATION
 MD_DRIFT_DEPRESSION_TEXT: "Deprese:" # todo: NEW TRANSLATION
 MD_DRIFT_DEPRESSION_VALUE: "[?drift_depression_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_depression_tt: "Ekonomika je v depresi, horším sourozenci recese. Každý měsíc přidává náhodný postih v průměrné hodnotě kolem §R+4§! síly protestů, což je přibližně o třetinu horší než recese.\n\nOdstranění ideje §Ydeprese§! prostřednictvím ekonomického systému tento faktor odstraní. §YSlib: Daňová úleva§! a §YSlib: Program pracovních míst§! snižují tlak protestů, pokud dokážete splnit cíle, zatímco §YUklidněte protestující§! a §YPreventivní reforma§! vám koupí čas." # todo: NEW TRANSLATION
 MD_DRIFT_WAR_TEXT: "Únava z války:" # todo: NEW TRANSLATION
 MD_DRIFT_WAR_VALUE: "[?drift_war_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_war_tt: "Jsme ve válce déle než §Y36§! měsíců a obyvatelstvo je vyčerpané. Každých dalších 24 měsíců války přidává další §R+1§! měsíčně. Čtyřletá válka znamená §R+2§!, šestiletá válka §R+3§!, bez ustálení.\n\nUkončení války okamžitě sníží tento faktor na nulu. Pokud již začaly vzpoury, §YKampaň za srdce a mysl§! zvyšuje poslušnost, zatímco válku ukončujete." # todo: NEW TRANSLATION
 MD_DRIFT_CORRUPTION_TEXT: "Slabost koalice:" # todo: NEW TRANSLATION
 MD_DRIFT_CORRUPTION_VALUE: "[?drift_corruption_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_corruption_tt: "Síla vládní koalice je pod §Y30%§!, zatímco je aktivní idea korupce nebo jsou pozastaveny volby. Čím slabší koalice, tím větší postih. Při síle koalice §Y10%§! činí náklad §R+0.2§! měsíčně, při §Y20%§! činí §R+0.1§!.\n\nSnižte úroveň ideje korupce prostřednictvím protikorupčních zaměření a událostí. Budujte podporu koalice prostřednictvím paktů subideologií. Obnovení voleb tento faktor zcela odstraní. §YSlib: Daňová úleva§! při úspěchu přidává §G+3%§! síly koalice, což je užitečné, jakmile stabilita roste." # todo: NEW TRANSLATION
 MD_DRIFT_CT_TEXT: "Protiteroristická politika:" # todo: NEW TRANSLATION
 MD_DRIFT_CT_VALUE: "[?drift_ct_last|=+1]" # todo: NEW TRANSLATION
 MD_drift_ct_tt: "Je aktivní monitorování internetu nebo zatýkání protestujících. Zátah přidává náhodný měsíční postih v průměrné hodnotě kolem §R+5§! síly protestů, což je nejtvrdší z náhodných zdrojů.\n\nTyto nástroje mají sloužit krátkodobě. Jakmile se aktivní mise dokončí, odstraňte ideu CT, jinak bude odliv pokračovat donekonečna. Během aktivní krize kombinace CT s §YSlib: Mimořádné financování policie§! sčítá snížení růstu odporu." # todo: NEW TRANSLATION
 MD_DRIFT_PASSIVE_TEXT: "Pasivní uklidňování:" # todo: NEW TRANSLATION
 MD_DRIFT_PASSIVE_VALUE: "[?drift_passive_last|=-1]" # todo: NEW TRANSLATION
 MD_drift_passive_tt: "Pozornost veřejnosti postupně opadá. Každý měsíc existuje §Y50%§! šance na samostatné snížení síly protestů o §G-2§!, což v průměru znamená přibližně §G-12§! ročně zdarma.\n\nZískání času pomocí §YUklidněte protestující§! a §YPreventivní reforma§! umožní pasivnímu uklidňování odvést většinu práce." # todo: NEW TRANSLATION
 MD_drift_total_text: "§YČistá změna za minulý měsíc:§!" # todo: NEW TRANSLATION
 MD_drift_total_value: "[?drift_total_last|-=1]" # todo: NEW TRANSLATION
 MD_protests_revolt_states_text: "§RStále vzdorující státy jádra:§!" # todo: NEW TRANSLATION
 MD_protests_revolt_states_value: "§Y[?cores_resisting_count|0]§!" # todo: NEW TRANSLATION
 MD_protests_revolt_states_tt: "Mise §YBlížící se vzpoura§! se dokončí, jakmile tato hodnota dosáhne §G0§!. Zasažené státy mimo hlavní město se automaticky vyčistí při §Y50% poslušnosti§! a méně než §Y40% odporu§!. Státy s hlavním městem se ke vzpouře připojit nemohou." # todo: NEW TRANSLATION
 MD_PROTESTS_STRENGTH_TEXT: "§YSíla§!" # todo: NEW TRANSLATION
 MD_PROTESTS_STRENGTH_VALUE: "§Y[?protest_strength|0]§! / §Y100§!" # todo: NEW TRANSLATION
 MD_PROTESTS_RADICALISATION_TEXT: "§YRadikalizace:§!" # todo: NEW TRANSLATION
 MD_PROTESTS_RADICALISATION_VALUE: "§Y[?protest_radicalisation|0]§! / §Y10§!" # todo: NEW TRANSLATION
 PROTESTS_SPENDING_TITLE: "§YOčekávané výdaje§!" # todo: NEW TRANSLATION
 expected_social_spending: "§CSociální§!" # todo: CHANGED
 expected_health_spending: "§CZdravotnictví§!" # todo: CHANGED
 expected_adm_spending: "§CAdministrativa§!" # todo: CHANGED
 expected_edu_spending: "§CVzdělávání§!" # todo: CHANGED
 expected_police_spending: "§CPolicie§!" # todo: CHANGED
 expected_defence_spending: "§CObrana§!" # todo: CHANGED
 protests_main_text: "Níže uvedená tabulka zobrazuje, co od vás občané očekávají a co v současnosti financujete. Mezery v červené barvě zvyšují protestní tendence; jejich odstranění je nejpřímějším způsobem, jak snížit napětí.[fuel_protests_TT]\n" # todo: CHANGED
 OPEN_PROTESTS_BUTTON: "Otevřít obrazovku §YProtestní systém§!" # todo: CHANGED
 OPEN_PROTESTS_BUTTON_TT: "Otevřít panel §YProtestní systém§!. Prohlédnout si měsíční zdroje tendencí, aktuální sílu protestů a radikalizaci a úrovně výdajů, které od vás občané očekávají." # todo: CHANGED
 CLOSE_PROTEST_SCREEN: "Zavřít obrazovku §YProtestní systém§!" # todo: CHANGED
 expected_law_mechanic_tt: "§YJak číst tabulku výdajů§!\n" # todo: CHANGED
 EL_green_square_explanation_tt: "§GZelená§!: §gočekávané výdaje, které veřejnost dostává. Každé zelené políčko je o jeden důvod k protestu méně.§!" # todo: CHANGED
 EL_blue_square_explanation_tt: "§BModrá§!: §gvýdaje nad rámec toho, co občané v současnosti očekávají. Každý měsíc stojí peníze, ale nepřinášejí žádné další zmírnění protestů.§!" # todo: CHANGED
 EL_red_square_explanation_tt: "§RČervená§!: §gočekávané výdaje, které §Rn nejsme schopni§! zajistit. Každé červené políčko zvyšuje řádek §YDopad výdajů§! ve výše uvedeném rozpisu tendencí.§!" # todo: CHANGED
 EL_white_square_explanation_tt: "Bílá: §gúrovně zákonů, které nejsou ani očekávané, ani financované. Zůstávají nevyužité, dokud očekávání občanů dostatečně nevzrostou a nezačnou je vyžadovat.§!" # todo: CHANGED
 expected_social_spending_tt: "Občané očekávají úroveň §YSociálních výdajů§! určenou vašimi zákony, národními duchy, technologiemi a HDP na obyvatele. Každé celé číslo představuje jednu úroveň, omezenou zákony dostupnými v této kategorii.\n\n§YOčekávaná úroveň:§! §Y[expected_social_spending_law_name]§! (aktuálně [?expected_welfare_spending|0Y])\n\n§YRozpis§!\nZákony, duchové, technologie: [?ROOT.modifier@expected_welfare_modifier]\nHDP na obyvatele: [calculate_gdp_c_modifier_welfare_spending]\n" # todo: CHANGED
 expected_health_spending_tt: "Občané očekávají úroveň §YZdravotních výdajů§! určenou vašimi zákony, národními duchy, technologiemi a HDP na obyvatele. Každé celé číslo představuje jednu úroveň, omezenou zákony dostupnými v této kategorii.\n\n§YOčekávaná úroveň:§! §Y[expected_healthcare_spending_law_name]§! (aktuálně [?expected_health_spending|0Y])\n\n§YRozpis§!\nZákony, duchové, technologie: [?ROOT.modifier@expected_healthcare_modifier]\nHDP na obyvatele: [calculate_gdp_c_modifier_healthcare_spending]\n" # todo: CHANGED
 expected_adm_spending_tt: "Občané očekávají úroveň §YAdministrativních výdajů§! určenou vašimi zákony, národními duchy, technologiemi a HDP na obyvatele. Každé celé číslo představuje jednu úroveň, omezenou zákony dostupnými v této kategorii.\n\n§YOčekávaná úroveň:§! §Y[expected_bureau_spending_law_name]§! (aktuálně [?expected_adm_spending|0Y])\n\n§YRozpis§!\nZákony, duchové, technologie: [?ROOT.modifier@expected_adm_modifier]\nHDP na obyvatele: [calculate_gdp_c_modifier_adm_spending]\n" # todo: CHANGED
 expected_edu_spending_tt: "Občané očekávají úroveň §YVýdajů na vzdělávání§! určenou vašimi zákony, národními duchy, technologiemi a HDP na obyvatele. Každé celé číslo představuje jednu úroveň, omezenou zákony dostupnými v této kategorii.\n\n§YOčekávaná úroveň:§! §Y[expected_education_spending_law_name]§! (aktuálně [?expected_edu_spending|0Y])\n\n§YRozpis§!\nZákony, duchové, technologie: [?ROOT.modifier@expected_education_modifier]\nHDP na obyvatele: [calculate_gdp_c_modifier_education_spending]\n" # todo: CHANGED
 expected_police_spending_tt: "Občané očekávají úroveň §YPolicejních výdajů§! určenou vašimi zákony, národními duchy, technologiemi a HDP na obyvatele. Každé celé číslo představuje jednu úroveň, omezenou zákony dostupnými v této kategorii.\n\n§YOčekávaná úroveň:§! §Y[expected_police_spending_law_name]§! (aktuálně [?expected_police_spending|0Y])\n\n§YRozpis§!\nZákony, duchové, technologie: [?ROOT.modifier@expected_police_modifier]\nHDP na obyvatele: [calculate_gdp_c_modifier_police_spending]\n" # todo: CHANGED
 expected_defence_spending_tt: "Občané očekávají úroveň §YVojenských výdajů§! určenou vašimi zákony, národními duchy, technologiemi a HDP na obyvatele. Každé celé číslo představuje jednu úroveň, omezenou zákony dostupnými v této kategorii.\n\n§YOčekávaná úroveň:§! §Y[expected_mil_spending_law_name]§! (aktuálně [?expected_military_sp|0Y])\n\n§YRozpis§!\nZákony, duchové, technologie: [?ROOT.modifier@expected_mil_modifier]\nHDP na obyvatele: [calculate_gdp_c_modifier_military_spending]\n" # todo: CHANGED
 MD_protests_state_calm_text: "§GKlid§!: není aktivní žádná mise nepokojů." # todo: NEW TRANSLATION
 MD_protests_state_calm_tt: "Není aktivní žádná varovná mise ani mise vzpoury. Tento panel zůstává viditelný, dokud je §YSíla protestů§! vyšší než 20. Reagujte na rostoucí přírůstek dříve, než vypukne krize." # todo: NEW TRANSLATION
 MD_protests_state_warning_text: "§YVarování§!: formuje se protestní hnutí." # todo: NEW TRANSLATION
 MD_protests_state_warning_tt: "Je aktivní mise §YBlížící se protesty§!. Pokud vyprší, nepokoje začnou v oprávněném státě jádra mimo hlavní město. Vyřešte ji stabilizací ekonomických a politických podmínek, které varování vyvolaly, nebo použijte §YUklidněte protestující§! a §YPreventivní reforma§!, abyste získali čas a snížili sílu." # todo: NEW TRANSLATION
 MD_protests_state_revolt_text: "§RVzpoura§!: odpor ve státech jádra." # todo: NEW TRANSLATION
 MD_protests_state_revolt_tt: "Je aktivní mise §YBlížící se vzpoura§!. Každý měsíc se mohou připojit nové regiony mimo hlavní město, s šancí rovnou aktuální §YSíle protestů§! minus §YÚnavě z protestů§!, nejvýše však §Y75%§!. Únava se každý aktivní měsíc zvyšuje o §G5§! bodů. Zasažené státy se vyčistí při §Y50% poslušnosti§! a méně než §Y40% odporu§!. Udržení síly protestů na §G0§! po dobu §Y60 dní§! vzpouru ukončí. Pokud hlavní mise vyprší dříve se silou vyšší než 0, občanská válka zabere podle nevyřešených států a radikalizace mezi §Y10%§! a §Y50%§! země." # todo: NEW TRANSLATION
 MD_protests_state_cooldown_text: "§BObdobí zotavení§!: zotavování z krize." # todo: NEW TRANSLATION
 MD_protests_state_cooldown_tt: "Období zotavení po krizi protestů. Po dobu §Y1000§! dní nemůže vypuknout žádná nová mise protestů. Využijte tento oddech k vyrovnání výdajů a obnovení stability, než tlak začne znovu růst." # todo: NEW TRANSLATION
 MD_drift_diagnosed_text: "[MD_top_resistant_state_display]" # todo: NEW TRANSLATION
 MD_top_resistant_state_active: "§YNejhorší stát:§! [event_target:MD_top_resistant_state_scope.GetName] (§R[?MD_top_resistant_state_value|0]%§!)" # todo: NEW TRANSLATION
 MD_top_resistant_state_none: "§YNejhorší stát:§! §Gžádný§!" # todo: NEW TRANSLATION
 MD_drift_diagnosed_tt: "Nevyřešený stát jádra mimo hlavní město s nejvyšším §Yodporem§!. Použijte rozhodnutí o vzpouře a dostatečnou posádku, abyste jej dostali pod §Y40% odporu§! a současně zvýšili poslušnost na §Y50%§!.\n\nZobrazuje §Gžádný§!, když je každý zasažený stát pacifikován." # todo: NEW TRANSLATION
 MD_drift_header_text: "§YMěsíční zdroje přírůstku§! (poslední aktualizace)" # todo: NEW TRANSLATION
 MD_protests_strength_readout_text: "§YSíla:§! §Y[?protest_strength|0]§!§Y / 100   ·   Radikalizace:§! §Y[?protest_radicalisation|0]§!§Y / 10§!" # todo: NEW TRANSLATION
 MD_protests_strength_readout_tt: "Životní cyklus protestů řídí dva ukazatele.\n\n§YSíla protestů§! (aktuálně [?protest_strength|0] / 100) sleduje, jak blízko je země krizi. Nad §Y50§! může vypuknout mise varování. Během aktivní vzpoury síla ovlivňuje pouze šanci na šíření nepokojů. Udržení na §G0§! po dobu §Y60 dní§! vzpouru ukončí.\n\nSíla každý měsíc roste ze zdrojů přírůstku uvedených výše. Klesá díky pasivnímu uklidňování, §YPreventivní reformě§! a úspěšným slibovým misím.\n\n§YRadikalizace protestů§! (aktuálně [?protest_radicalisation|0] / 10) má §Y20%§! měsíční šanci na růst, pokud je síla alespoň 50 nebo je aktivní mise protestů. Jinak má §Y10%§! šanci na pokles. Vyšší radikalizace zvyšuje rozsah občanské války po neúspěšné vzpouře." # todo: NEW TRANSLATION
 MD_drift_total_tt: "Součet všech aktivních zdrojů přírůstku a pasivního uklidňování. Kladná hodnota znamená, že síla protestů roste; záporná znamená, že klesá.\n\nChcete-li změnit čistou hodnotu na zápornou, zaměřte se na největší faktor uvedený výše. §YPreventivní reforma§! a §YUklidněte protestující§! vám koupí čas, než se projeví strukturální náprava.\n\nTři rozhodnutí §YSlib§! zavazují ke splnění cíle v rozmezí 200 až 350 dní. Uspějte a mise vzpoury získá více času; selžte a porušený slib přidá malý postih. §YSlib: Mimořádné financování policie§! trvá 200 dní a vyžaduje snížení síly protestů o §G10§!, za což přidá §G+75§! dní k misi vzpoury. §YSlib: Daňová úleva§! trvá 300 dní a vyžaduje zvýšení stability o §G5%§!, za což přidá §G+100§! dní. §YSlib: Program pracovních míst§! trvá 350 dní a vyžaduje snížení nezaměstnanosti o §G1.5%§!, za což přidá §G+120§! dní." # todo: NEW TRANSLATION
