 IP_communist_category_desc: "§YKomunisté§!\nSíly dostupné pro:\n[Communist-State_L]\n[Neutral_Communism_L]" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_socialist_category_desc: "§YSocialisté§!\nSíly dostupné pro:\n[socialism_L]\n[anarchist_communism_L]\n[Neutral_green_L]\n[neutral_Social_L]" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_conservative_category_desc: "§YKonzervativci§!\nSíly dostupné pro:\n[conservatism_L]\n[Conservative_L]\n[Mod_Vilayat_e_Faqih_L]\n[Neutral_Muslim_Brotherhood_L]\n[Neutral_conservatism_L]\n[Nat_Populism_L]" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_liberal_category_desc: "§YLiberálové§!\nSíly dostupné pro:\n[liberalism_L]\n[Neutral_Libertarian_L]\n[technocrats_scripted_loc]" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_autocrat_category_desc: "§YAutokrati§!\nSíly dostupné pro:\n[Western_Autocracy_scripted_loc]\n[Autocracy_L]\n[Neutral_Autocracy_L]\n[oligarchism_L]\n[Nat_Fascism_L]\n[Nat_Autocracy_L]" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_monarchist_category_desc: "§YMonarchisté§!\nPráva dostupná pro:\n[Kingdom_L]\n[Monarchist_L]" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_fundamentalist_symbol_desc: "§YFundamentalisté§!\nPráva dostupná pro:\n[Vilayat_e_Faqih_L]\n[Caliphate_L]" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_communist_category_desc_delayed: "§LKomunisté obvykle následují marxismus-leninský nebo podobnou ideologii. Jako zastánci státem řízené ekonomiky mají snazší industrializaci prostřednictvím znárodňování zahraničních průmyslů a jejich pětiletých plánů. Mohou také efektivněji posílit svůj výhled prostřednictvím svých špionů§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_socialist_category_desc_delayed: "§LSocialisté spojují prvky tržního a státního kapitalismu s progresivismem. Jejich cílem je často investovat veškeré úsilí vlády do samotné země. Socialisté snadno zlepšují vnitřní situaci své země prostřednictvím sociální politiky a státních zásahů do ekonomiky.§!" # todo: NEW TRANSLATION
 IP_conservative_category_desc_delayed: "§LKonzervativci obvykle chtějí, aby země zůstala taková, jaká je, nebo aby se vrátila k některým pokročilejším zákonům. Konzervatismus často bývá spojen s nacionalismem a hlubokými náboženskými vírami. Z tohoto důvodu mají konzervativní země snazší udržování politické a národní stability, protože radikální změny jsou vzácné.§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_liberal_category_desc_delayed: "§LLiberálové mají sklon prosazovat myšlenky svobody, ačkoliv některé strany zaujímají progresivnější (sociální liberalismus) přístup k problémům. Jádrem většiny liberálních stran je myšlenka volného trhu s velmi omezeným zásahem vlády.§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_autocrat_category_desc_delayed: "§LAutokrati spoléhají na moc silných mužů (a ve výjimečných případech i silných žen), aby vedli zemi. Demagogové se nebojí používat pochybná opatření a dohody v zadních místnostech, aby dosáhli toho, co chtějí. Autokratům bude snazší tolerovat vysokou korupci a udržovat kontrolu nad národem železnou pěstí§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_monarchist_category_desc_delayed: "§LMonarchisté spoléhají na rodovou linii a slávu, aby vládli zemím. Soustředění moci do jedné rodiny má své výhody. Tato rodina přináší moc a monarchové jsou dobří v povzbuzování svého lidu.§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_fundamentalist_symbol_desc_delayed: "§LFundamentalisté jsou tvrdí konzervativci, kteří vyznávají radikální, ultrakonzervativní formu islámu. Jejich hlavním cílem je šířit tyto konzervativní názory i do ostatních zemí.§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 IP_communist_powers_desc: "§YKomunisté§!\n\n§YPravomoci dostupné pro:§!\n  [Communist-State_L]\n  [Neutral_Communism_L]\n\n§YBonusy:§!\n  $BOOST_IDEOLOGY_MISSION_FACTOR$: §G+25%§!\n  Mohou zavádět vlastní §Ypětileté plány§! pomocí §Yrozhodnutí§!\n  Mohou §Yznárodnit§! majetek velkých zahraničních vlivových skupin pomocí §Yrozhodnutí§!\n\n§YNevýhoda:§!\n  $buildings_worker_requirement_modifier$: §R+15%§!" # todo: NEW TRANSLATION
 IP_socialist_powers_desc: "§YSocialisté§!\n\n§YPravomoci dostupné pro:§!\n  [socialism_L]\n  [anarchist_communism_L]\n  [Neutral_green_L]\n  [neutral_Social_L]\n\n§YBonusy:§!\n  $health_cost_multiplier_modifier$: §G-15.00%§!\n  $social_cost_multiplier_modifier$: §G-15.00%§!\n  $MODIFIER_POLITICAL_POWER_FACTOR$: §G+15%§! za každou úroveň pod §YOmezeným intervencionismem§!\n\n§YPouze [Neutral_green_L]:§!\n  $modifier_state_production_speed_renewable_energy_infra_factor$: §G+50.00%§!\n\n§YVšichni kromě [Neutral_green_L]:§!\n  $internal_investments_pp_cost_modifier$: §G-25.00%§!\n  $internal_investments_money_cost_modifier$: §G-25.00%§!\n\n§YNevýhoda:§!\n  $foreign_influence_defense_modifier$: §R-15%§!" # todo: NEW TRANSLATION
