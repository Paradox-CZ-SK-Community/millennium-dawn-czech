 prowestern_propaganda_button_tt: "§YProzápadní§! propagandistická kampaň \nPomocí informační války můžeme ovlivnit veřejné mínění o světové situaci. Každá taková kampaň však bude účinná jen po omezenou dobu, protože lidé postupně ztrácejí zájem.\n\n§YNáklady propagandistické kampaně§! – modifikátor: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YNáklady prozápadní propagandistické kampaně§! – modifikátor: [?ROOT.modifier@western_outlook_campaign_cost_modifier|-2%] \n\n§YPředpoklad:§! \n[!prowestern_propaganda_button_click_enabled] \n§YModifikátory během aktivace:§! \n[!prowestern_propaganda_button_click]" # todo: NEW TRANSLATION
 emerging_propaganda_button_tt: "§YPropagandistická kampaň rozvíjejících se zemí§! \nPomocí informační války můžeme ovlivnit veřejné mínění o světové situaci. Každá taková kampaň však bude účinná jen po omezenou dobu, protože lidé po čase ztrácejí zájem.\n\n§YNáklady propagandistické kampaně§! – modifikátor: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YNáklady propagandistické kampaně rozvíjejících se zemí§! – modifikátor: [?ROOT.modifier@emerging_outlook_campaign_cost_modifier|-2%] \n\n§YPředpoklad:§! \n[!emerging_propaganda_button_click_enabled] \n§YModifikátory během aktivace:§! \n[!emerging_propaganda_button_click]" # todo: NEW TRANSLATION
 nonaligned_propaganda_button_tt: "§YPropagandistická kampaň nezúčastněných§! \nPomocí informační války můžeme ovlivnit veřejné mínění o světové situaci. Každá taková kampaň však bude účinná jen po omezenou dobu, protože lidé postupně ztrácejí zájem.\n\n§YNáklady propagandistické kampaně§! – modifikátor: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YNáklady propagandistické kampaně nezúčastněných§! – modifikátor: [?ROOT.modifier@nonaligned_outlook_campaign_cost_modifier|-2%] \n\n§YPředpoklad:§! \n[!nonaligned_propaganda_button_click_enabled] \n§YModifikátory během aktivace:§! \n[!nonaligned_propaganda_button_click]" # todo: NEW TRANSLATION
 nationalist_propaganda_button_tt: "§YNacionalistická§! propagandistická kampaň \nPomocí informační války můžeme ovlivnit veřejné mínění o světové situaci a přimět ho nahlížet na ni z nacionalistické perspektivy. Každá taková kampaň však bude účinná jen po omezenou dobu, protože lidé postupně ztrácejí zájem.\n\n§YNáklady propagandistické kampaně§! – modifikátor: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YNáklady nacionalistické propagandistické kampaně§! – modifikátor: [?ROOT.modifier@nationalist_outlook_campaign_cost_modifier|-2%] \n\n§YPředpoklad:§! \n[!nationalist_propaganda_button_click_enabled] \n§YModifikátory během aktivace:§! \n[!nationalist_propaganda_button_click]" # todo: NEW TRANSLATION
 fascism_propaganda_button_tt: "§YFašistická§! propagandistická kampaň \nPomocí informační války, propagace ultrakonzervativních duchovních a podobných metod můžeme ovlivnit a radikalizovat veřejné mínění o světové situaci ve prospěch sálafismu. Každá taková kampaň však bude účinná jen po omezenou dobu, protože lidé postupně ztrácejí zájem.\n\n§YNáklady propagandistické kampaně§! – modifikátor: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YNáklady sálafistické indoktrinační kampaně§! – modifikátor: [?ROOT.modifier@salafist_outlook_campaign_cost_modifier|-2%] \n\n§YPředpoklad:§! \n[!fascism_propaganda_button_click_enabled] \n§YModifikátory během aktivace:§! \n[!fascism_propaganda_button_click]" # todo: NEW TRANSLATION
