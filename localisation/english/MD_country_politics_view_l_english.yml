 boost_party_TT: "§HPodpořit [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nVe snaze oslabit vliv našich skutečných politických protivníků můžeme využít náš politický aparát k posílení popularity ostatních stran.\n\n§YPředpoklad:§!\n[!boost_button_click_enabled]\n§YÚčinky:§!\n[!boost_button_click]" # todo: NEW TRANSLATION
 attack_party_TT: "§HZaútočit na [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nMůžeme využít dezinformační kampaně a kompromitující materiály, které jsme shromáždili o hlavních stranách mimo vládu, a tvrdě zaútočit na jejich popularitu – čímž zajistíme, že nebudou schopny ohrozit naši mocenskou pozici. Protože jakákoli pozornost zvýší popularitu malých stran, bude to fungovat pouze u velkých stran nad volebním prahem [?election_threshold|%0]\n\n§YPředpoklad:§!\n[!attack_button_click_enabled]\n§YÚčinky:§!\n[!attack_button_click]" # todo: NEW TRANSLATION
 ban_party_TT: "§HZakázat [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nPostavením politické strany nebo hnutí mimo zákon zajistíme, že nikdy nezíská moc prostřednictvím voleb, a usnadníme pronásledování jejích členů.\n\n§YPředpoklad:§!\n[!ban_button_click_enabled]\n§YÚčinky:§!\n[!ban_button_click]" # todo: NEW TRANSLATION
 allow_party_TT: "§HLegalizovat [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nNastal čas zrušit náš zákaz a umožnit jejím členům kandidovat do veřejných funkcí a legálně se organizovat.\n\n§YPředpoklad:§!\n[!allow_button_click_enabled]\n§YÚčinky:§!\n[!allow_button_click]" # todo: NEW TRANSLATION
