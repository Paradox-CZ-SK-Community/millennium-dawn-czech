l_english:
 north_korea_focus: "Strom zaměření Severní Koreje" # todo: NEW TRANSLATION
 NKO_economy_shortcut: "Ekonomika" # todo: NEW TRANSLATION
 NKO_military_shortcut: "Armáda" # todo: NEW TRANSLATION
 NKO_38th_parallel_shortcut: "38. rovnoběžka" # todo: NEW TRANSLATION
 NKO_political_shortcut: "Politika" # todo: NEW TRANSLATION
 NKO_solve_the_arduous_march: "Překonat náročný pochod" # todo: NEW TRANSLATION
 NKO_solve_the_arduous_march_desc: "Náročný pochod si vyžádal těžkou cenu pro naši zemi. Abychom zajistili budoucnost našich lidí, musíme zavést strategická opatření k překonání tohoto období těžkostí a dovést naši zemi k prosperitě. To zahrnuje posílení zemědělské produkce, zajištění humanitární pomoci a reformu našich vnitřních politik, aby byla zajištěna stabilita a růst." # todo: NEW TRANSLATION
 NKO_overcome_the_arduous_march: "Překonat Namáhavý pochod" # todo: NEW TRANSLATION
 NKO_overcome_the_arduous_march_desc: "Roky hladomoru jsou za námi. Zemědělství bylo obnoveno, Huichon přestavěn a vznikající tržní vrstvy začleněny. Konečně můžeme prohlásit Namáhavý pochod za překonaný a obrátit veškerou sílu státu k národní obnově." # todo: NEW TRANSLATION
 NKO_promote_songun: "Podpořit Songun" # todo: NEW TRANSLATION
 NKO_promote_songun_desc: "Songun, neboli politika 'militar-first', upřednostňuje Korejskou lidovou armádu v našich politických a ekonomických záležitostech. Prosazováním Songun zajistíme bezpečnost naší země a posílíme roli armády při ochraně našeho suverénního postavení a vedení naší socialistické výstavby." # todo: NEW TRANSLATION
 NKO_humanitarian_aid: "Humanitární pomoc" # todo: NEW TRANSLATION
 NKO_humanitarian_aid_desc: "V těchto náročných časech přijetí humanitární pomoci od mezinárodních organizací a přátelských zemí poskytne zásadní zdroje k zmírnění utrpení našich lidí. Tato pomoc bude pečlivě spravována, aby se dostala k potřebným a podpořila naši obnovu." # todo: NEW TRANSLATION
 NKO_food_production_boost: "Zvýšení produkce potravin" # todo: NEW TRANSLATION
 NKO_food_production_boost_desc: "Zvýšení produkce potravin je klíčové pro zajištění blahobytu našich občanů. Investicí do zemědělských technologií, zlepšením zavlažovacích systémů a podporou našich farmářů můžeme zvýšit výnosy plodin a zajistit stabilní zásobování potravinami pro naši zemi." # todo: NEW TRANSLATION
 NKO_healthcare_reform: "Zdravotnická reforma" # todo: NEW TRANSLATION
 NKO_healthcare_reform_desc: "Reforma našeho zdravotnického systému je klíčová pro zlepšení zdraví a produktivity našich lidí. Zaměříme se na modernizaci zdravotnických zařízení, školení zdravotnických profesionálů a zajištění přístupu k základním lékům a léčbě." # todo: NEW TRANSLATION
 NKO_punish_corruption: "Potrestat korupci" # todo: NEW TRANSLATION
 NKO_punish_corruption_desc: "Korupce podkopává naše socialistické principy a brzdí národní pokrok. Spustíme důslednou kampaň k identifikaci, odhalení a potrestání korupčních úředníků, čímž zajistíme transparentnost a integritu v naší vládě a institucích." # todo: NEW TRANSLATION
 NKO_infrastructure_development: "Rozvoj infrastruktury" # todo: NEW TRANSLATION
 NKO_infrastructure_development_desc: "Rozvoj naší infrastruktury je klíčový pro hospodářský růst a národní rozvoj. Investujeme do dopravních sítí, výroby energie a komunikačních systémů, abychom vytvořili pevný základ pro budoucí prosperitu." # todo: NEW TRANSLATION
 NKO_agricultural_funding: "Financování zemědělství" # todo: NEW TRANSLATION
 NKO_agricultural_funding_desc: "Poskytování finančních prostředků a podpory našemu zemědělskému sektoru posílí potravinovou bezpečnost a venkovské živobytí. Zaměříme se na mechanizaci, lepší semena a lepší zemědělské techniky pro zvýšení produktivity." # todo: NEW TRANSLATION
 NKO_fertiliser_factory: "Továrna na hnojiva" # todo: NEW TRANSLATION
 NKO_fertiliser_factory_desc: "Výstavba špičkové továrny na hnojiva významně zlepší úrodnost půdy a výnosy plodin. Tato investice zajistí, že naši farmáři budou mít potřebné zdroje k pěstování bohatých úrod." # todo: NEW TRANSLATION
 NKO_nutrition_programs: "Programy výživy" # todo: NEW TRANSLATION
 NKO_nutrition_programs_desc: "Zavedení celostátních programů výživy bude řešit podvýživu a zlepšovat veřejné zdraví. Zaměříme se na poskytování vyvážené stravy, zejména pro děti a zranitelné populace, aby byla zajištěna zdravější budoucnost." # todo: NEW TRANSLATION
 NKO_land_reclamation: "Rekultivace půdy" # todo: NEW TRANSLATION
 NKO_land_reclamation_desc: "Rekultivace pusté půdy pro zemědělské a průmyslové využití rozšíří naši zdrojovou základnu a podpoří hospodářský růst. Představíme ambiciózní projekty na přeměnu pustých půd na produktivní oblasti." # todo: NEW TRANSLATION
 NKO_renovate_water_supply_facilities: "Obnova vodárenských zařízení" # todo: NEW TRANSLATION
 NKO_renovate_water_supply_facilities_desc: "Obnova a rozšíření našich vodárenských zařízení jsou nezbytné pro veřejné zdraví a průmyslový rozvoj. Zajistíme čistý a spolehlivý přístup k vodě pro všechny občany i průmyslová odvětví." # todo: NEW TRANSLATION
 NKO_acquiesce_jangmadang: "Podvolit se Jangmadangu" # todo: NEW TRANSLATION
 NKO_acquiesce_jangmadang_desc: "Uvědomujeme si důležitost Jangmadangu, černého trhu, v naší ekonomice, a dovolíme jeho provoz pod regulovanými podmínkami. To povzbudí ekonomickou aktivitu a poskytne našim lidem nezbytné zboží." # todo: NEW TRANSLATION
 NKO_bureau_39: "Úřad 39" # todo: NEW TRANSLATION
 NKO_bureau_39_desc: "Úřad 39 má na starosti vydělávání tvrdé měny pro režim různými způsoby. Posílení tohoto úřadu posílí naše ekonomické schopnosti a zajistí stálý tok zdrojů na podporu národních projektů." # todo: NEW TRANSLATION
 NKO_admit_the_donju: "Přiznat Donju" # todo: NEW TRANSLATION
 NKO_admit_the_donju_desc: "Donju, neboli bohatí podnikatelé, hrají v naší ekonomice významnou roli. Uznáním jejich vlivu a začleněním jejich zdrojů můžeme využít jejich potenciálu pro národní rozvoj a zároveň udržet kontrolu nad jejich činnostmi." # todo: NEW TRANSLATION
 NKO_government_directed_drug_manufacture: "Státem řízená výroba drog" # todo: NEW TRANSLATION
 NKO_government_directed_drug_manufacture_desc: "Řízení výroby drog pod dohledem vlády vytvoří nové zdroje příjmů. Tato kontrolovaná produkce bude použita k získání prostředků pro národní projekty a zlepšení naší finanční stability." # todo: NEW TRANSLATION
 NKO_smuggling_operations: "Hackování zahraničních bank" # todo: NEW TRANSLATION
 NKO_smuggling_operations_desc: "Musíme využít vliv v nepřátelských zemích a technologické schopnosti našich hackerů, abychom pronikli do bankovních systémů našich nepřátel." # todo: NEW TRANSLATION
 NKO_counterfeit_production: "Výroba padělků" # todo: NEW TRANSLATION
 NKO_counterfeit_production_desc: "Podnikání v výrobě padělků zboží, včetně měny a luxusních předmětů, nám poskytne zahraniční měnu a podpoří naši ekonomiku. Tyto operace budou prováděny v co největším utajení, aby se vyhnuly mezinárodním důsledkům." # todo: NEW TRANSLATION
 NKO_huichon: "Huichon" # todo: NEW TRANSLATION
 NKO_huichon_desc: "Rozvoj průmyslového města Huichon posílí naši výrobní kapacitu. Zaměříme se na výstavbu klíčové infrastruktury a přilákání kvalifikovaných pracovníků, abychom Huichon proměnili v centrum ekonomické činnosti." # todo: NEW TRANSLATION
 NKO_huichon_hydroelectric_power: "Huichonova vodovodní elektrárna" # todo: NEW TRANSLATION
 NKO_huichon_hydroelectric_power_desc: "Budování hydroelektrické elektrárny v Huichonu posílí naši energetickou bezpečnost. Tyto projekty poskytnou čistou, obnovitelnou energii a podpoří náš průmyslový růst." # todo: NEW TRANSLATION
 NKO_manpo_line_railway: "Železniční trať Manpo" # todo: NEW TRANSLATION
 NKO_manpo_line_railway_desc: "Výstavba železniční trati Manpo zlepší dopravní infrastrukturu a usnadní pohyb zboží a lidí. Tato trať bude klíčovým spojením v naší národní logistické síti." # todo: NEW TRANSLATION
 NKO_coal_energy_supermacy: "Nadřazenost uhlí v energetice" # todo: NEW TRANSLATION
 NKO_coal_energy_supermacy_desc: "Zaměření na uhlí v energetice zajistí spolehlivý a hojný zdroj energie pro naše průmysly a domácnosti. Budeme investovat do modernizace uhelných dolů a elektráren, abychom maximalizovali efektivitu a produkci." # todo: NEW TRANSLATION
 NKO_ordnance_manufacture: "Zbrojní výroba" # todo: NEW TRANSLATION
 NKO_ordnance_manufacture_desc: "Zlepšení naší zbrojní výroby je klíčové pro národní obranu. Rozšíříme výrobní kapacity a zlepšíme technologie, abychom zajistili, že naše vojska budou dobře vyzbrojena." # todo: NEW TRANSLATION
 NKO_huichon_hard_glassware_factory: "Huichonova továrna na tvrzené sklo" # todo: NEW TRANSLATION
 NKO_huichon_hard_glassware_factory_desc: "Zřízení továrny na tvrzené sklo v Huichonu podpoří naši průmyslovou výrobu a poskytne vysoce kvalitní materiály pro různé aplikace." # todo: NEW TRANSLATION
 NKO_huichon_silk_mill: "Huichonova hedvábná továrna" # todo: NEW TRANSLATION
 NKO_huichon_silk_mill_desc: "Zřízení hedvábné továrny v Huichonu podpoří náš textilní průmysl a vytvoří pracovní místa. Tato investice posílí naši schopnost vyrábět jemné tkaniny a oděvy." # todo: NEW TRANSLATION
 NKO_huichon_machine_tool_factory: "Huichonova továrna na strojní nářadí" # todo: NEW TRANSLATION
 NKO_huichon_machine_tool_factory_desc: "Vytvoření továrny na strojní nářadí v Huichonu posílí naši výrobní kapacitu. Tato zařízení budou vyrábět nezbytné stroje a vybavení pro naše průmysly." # todo: NEW TRANSLATION
 NKO_bureau_38: "Úřad 38" # todo: NEW TRANSLATION
 NKO_bureau_38_desc: "Úřad 38 je zodpovědný za správu státních zdrojů a fondů. Posílení tohoto úřadu zajistí efektivní alokaci zdrojů a podporu národních vývojových projektů." # todo: NEW TRANSLATION
 NKO_sanction_evasions: "Obcházení sankcí" # todo: NEW TRANSLATION
 NKO_sanction_evasions_desc: "Zavedení propracovaných strategií k obcházení mezinárodních sankcí posílí naši ekonomiku. Budeme využívat utajované operace k zajištění životně důležitých zboží a finančních zdrojů." # todo: NEW TRANSLATION
 NKO_international_black_market: "Úřad 121" # todo: NEW TRANSLATION
 NKO_international_black_market_desc: "Úřad 121 je severokorejská kybernetická zpravodajská agentura a hlavní jednotka Průzkumného Generálního Úřadu severokorejské armády. Provádí útočné kybernetické operace, včetně špionáže a kyberneticky řízených finančních zločinů. Podle amerických úřadů RGB spravuje utajované operace a má šest úřadů." # todo: NEW TRANSLATION
 NKO_technological_boost: "Technologické posílení" # todo: NEW TRANSLATION
 NKO_technological_boost_desc: "Zaměření na technologický pokrok podpoří inovace a hospodářský růst. Budeme investovat do výzkumu a vývoje, abychom drželi krok s globálními technologickými trendy." # todo: NEW TRANSLATION
 NKO_purchase_stolen_tech_blueprint: "Nákup ukradených technických nákresů" # todo: NEW TRANSLATION
 NKO_purchase_stolen_tech_blueprint_desc: "Získání ukradených technických nákresů nám poskytne náskok při vývoji pokročilých technologií. To urychlí náš výzkum a inovační snahy." # todo: NEW TRANSLATION
 NKO_bribe_researchers_at_institues: "Nabídnout úplatky výzkumníkům na institucích" # todo: NEW TRANSLATION
 NKO_bribe_researchers_at_institues_desc: "Nabízení úplatků výzkumníkům na klíčových institucích urychlí náš technologický pokrok. Tato utajená strategie nám umožní získat cenné poznatky a pokroky." # todo: NEW TRANSLATION
 NKO_black_market_innovation: "Inovace na černém trhu" # todo: NEW TRANSLATION
 NKO_black_market_innovation_desc: "Využití geniality černého trhu posílí naše technologické schopnosti. Budeme podporovat podzemní inovátory, aby vyvíjeli nové a nekonvenční technologie." # todo: NEW TRANSLATION
 NKO_national_recovery_plan: "Národní plán obnovy" # todo: NEW TRANSLATION
 NKO_national_recovery_plan_desc: "Zavedení komplexního národního plánu obnovy stabilizuje a posílí naši ekonomiku. Tento plán se zaměří na obnovu klíčové infrastruktury, oživení průmyslu a zajištění sociálního zabezpečení." # todo: NEW TRANSLATION
 NKO_emphasis_self_reliance: "Důraz na soběstačnost" # todo: NEW TRANSLATION
 NKO_emphasis_self_reliance_desc: "Zaměření na soběstačnost sníží naši závislost na zahraniční pomoci a dovozu. Budeme podporovat domácí výrobu a využití zdrojů." # todo: NEW TRANSLATION
 NKO_financial_sector_reform: "Reforma finančního sektoru" # todo: NEW TRANSLATION
 NKO_financial_sector_reform_desc: "Reforma finančního sektoru zlepší ekonomickou stabilitu. Zaměříme se na posílení finančních institucí, zlepšení regulačních rámců a podporu zodpovědných finančních praktik." # todo: NEW TRANSLATION
 NKO_modernization_efforts: "Modernizační snahy" # todo: NEW TRANSLATION
 NKO_modernization_efforts_desc: "Modernizace našich průmyslů zvýší produktivitu a efektivitu. Budeme investovat do nových technologií, modernizovat stávající zařízení a vyškolit naši pracovní sílu, aby se přizpůsobila moderním výrobním metodám." # todo: NEW TRANSLATION
 NKO_renewable_energy_initiatives: "Iniciativy obnovitelné energie" # todo: NEW TRANSLATION
 NKO_renewable_energy_initiatives_desc: "Investice do obnovitelné energie zajistí udržitelný rozvoj a sníží naši závislost na fosilních palivech. Zaměříme se na projekty solárních, větrných a hydroelektrických elektráren, abychom vytvořili zelenější budoucnost." # todo: NEW TRANSLATION
 NKO_national_power_grid: "Národní elektrická síť" # todo: NEW TRANSLATION
 NKO_national_power_grid_desc: "Propojení našich obnovitelných zdrojů a vodních elektráren do jednotné národní sítě stabilizuje dodávky elektřiny pro továrny i domácnosti a ukončí pravidelné výpadky, které dlouhodobě ochromují výrobu." # todo: NEW TRANSLATION
 NKO_labor_force_training: "Školení pracovní síly" # todo: NEW TRANSLATION
 NKO_labor_force_training_desc: "Školení naší pracovní síly zlepší dovednosti a produktivitu. Zavedeme komplexní školící programy, které našim pracovníkům poskytnou nezbytné dovednosti pro moderní průmysl." # todo: NEW TRANSLATION
 NKO_50k_housing_project: "Projekt 50 000 domů" # todo: NEW TRANSLATION
 NKO_50k_housing_project_desc: "Výstavba 50 000 domů vyřeší nedostatek bydlení a zlepší životní úroveň. Tento ambiciózní projekt poskytne občanům kvalitní bydlení a podpoří stavebnictví." # todo: NEW TRANSLATION
 NKO_mansudae_peoples_theatre: "Divadlo lidu Mansudae" # todo: NEW TRANSLATION
 NKO_mansudae_peoples_theatre_desc: "Výstavba Mansudae Divadla lidu obohatí náš kulturní život. Tato velkolepá scéna bude hostit představení a akce, které oslavují naše dědictví a podporují umění." # todo: NEW TRANSLATION
 NKO_rare_metal_exploitation: "Využívání vzácných kovů" # todo: NEW TRANSLATION
 NKO_rare_metal_exploitation_desc: "Budeme rozvíjet těžební operace, abychom těžili tyto klíčové materiály a posílili naše technologické schopnosti." # todo: NEW TRANSLATION
 NKO_focus_on_quality: "Zaměření na kvalitu" # todo: NEW TRANSLATION
 NKO_focus_on_quality_desc: "Zaměření na kvalitu zlepší standardy našich výrobků. Zavedeme opatření kontroly jakosti a podpoříme inovace, aby naše zboží splňovalo mezinárodní standardy." # todo: NEW TRANSLATION
 NKO_light_industry_development: "Rozvoj lehkého průmyslu" # todo: NEW TRANSLATION
 NKO_light_industry_development_desc: "Rozvoj lehkého průmyslu diverzifikuje naši ekonomiku. Budeme podporovat malé a střední podniky, které vyrábějí spotřební zboží, textilie a další lehké průmyslové výrobky." # todo: NEW TRANSLATION
 NKO_modern_mining_operations: "Moderní těžební operace" # todo: NEW TRANSLATION
 NKO_modern_mining_operations_desc: "Zavedení moderních těžebních operací zvýší efektivitu a výstup. Budeme investovat do pokročilé těžební techniky a postupů, abychom zvýšili produktivitu a zajistili udržitelnou těžbu zdrojů." # todo: NEW TRANSLATION
 NKO_resource_extraction: "Těžba zdrojů" # todo: NEW TRANSLATION
 NKO_resource_extraction_desc: "Zaměření na těžbu zdrojů zajistí stabilní dodávky nezbytných materiálů. Budeme rozvíjet naše těžební a extrakční schopnosti, abychom podpořili naše průmysly a zajistili naši ekonomickou budoucnost." # todo: NEW TRANSLATION
 NKO_industrial_modernization: "Průmyslová modernizace" # todo: NEW TRANSLATION
 NKO_industrial_modernization_desc: "Modernizace našich průmyslů zvýší produktivitu a efektivitu. Budeme investovat do nových technologií, modernizovat stávající zařízení a školit naši pracovní sílu, aby se přizpůsobili moderním výrobním metodám." # todo: NEW TRANSLATION
 NKO_victory_of_juche_revolution: "Vítězství Juche revoluce" # todo: NEW TRANSLATION
 NKO_victory_of_juche_revolution_desc: "Dosažení vítězství Juche revoluce upevní naši nezávislost a soběstačnost. Budeme prosazovat principy Juche a zajistíme dlouhodobou sílu a autonomii naší země." # todo: NEW TRANSLATION
 NKO_pojon_field_responsibility: "Systém odpovědnosti za pole Pojon" # todo: NEW TRANSLATION
 NKO_pojon_field_responsibility_desc: "Systém Pojon poskytuje malým rodinným pracovním týmům autonomii nad zemědělskými přebytky nad rámec státních kvót. Tím, že rolníkům umožníme ponechat si motivační sklizeň, se rozšíří výroba a posílí potravinová bezpečnost." # todo: NEW TRANSLATION
 NKO_rason_ftz: "Zvláštní ekonomická zóna Rason" # todo: NEW TRANSLATION
 NKO_rason_ftz_desc: "Zóna volného obchodu Rason na severovýchodě, společně rozvíjená s čínskými a ruskými investicemi, otevírá Severní Koreji bránu k legálnímu přeshraničnímu obchodu. Kontrola přístavu Rajin a přístupu k hranicím odemyká trvalý hospodářský obchod." # todo: NEW TRANSLATION
 NKO_koryolink_network: "Mobilní síť Koryolink" # todo: NEW TRANSLATION
 NKO_koryolink_network_desc: "Koryolink, spuštěný v roce 2008 jako síť 3G vybudovaná společně s Orascom Telecom, poskytuje moderní telekomunikace milionům účastníků. Mobilní síť modernizuje tok informací a snižuje závislost na státem kontrolovaných médiích." # todo: NEW TRANSLATION
 NKO_pyongyang_prestige_streets: "Reprezentativní ulice Pchjongjangu" # todo: NEW TRANSLATION
 NKO_pyongyang_prestige_streets_desc: "Výstavní třídy, jako jsou Ulice vědců Mirae a Ulice Ryomyong, byly vybudovány mimořádně rychle, aby navzdory mezinárodním sankcím demonstrovaly národní modernitu a vzdor. Tyto městské symboly posilují morálku obyvatelstva a mezinárodní prestiž." # todo: NEW TRANSLATION
 NKO_ryugyong_hotel: "Dokončení hotelu Ryugyong" # todo: NEW TRANSLATION
 NKO_ryugyong_hotel_desc: "Pyramidový hotel Ryugyong se 105 podlažími, dlouho opuštěný, získal v letech 2008 až 2011 kompletní skleněný plášť. Tato architektonická dominanta symbolizuje národní technologické ambice a hospodářskou obnovu." # todo: NEW TRANSLATION
 NKO_national_recovery_plan1: "Národní plán obnovy" # todo: NEW TRANSLATION
 NKO_exporting_workforce: "Vývoz pracovní síly" # todo: NEW TRANSLATION
 NKO_chollima_speed: "Rychlost Čollima" # todo: NEW TRANSLATION
 NKO_field_responsibility_system: "Systém odpovědnosti za pole" # todo: NEW TRANSLATION
 NKO_field_responsibility_system_desc: "Systém odpovědnosti za pole Pojon umožňuje rolnickým brigádám ponechat si přebytky sklizně nad státními kvótami a vytváří tak výrobní motivaci. Trvalá zemědělská produkce zlepšuje potravinovou bezpečnost i morálku obyvatelstva." # todo: NEW TRANSLATION
 NKO_mobile_network: "Mobilní síť Koryolink" # todo: NEW TRANSLATION
 NKO_mobile_network_desc: "Moderní telekomunikační síť 3G oslovuje miliony účastníků a modernizuje komunikační infrastrukturu. Lepší přístup k informacím a menší závislost na státních médiích snižují společenské napětí." # todo: NEW TRANSLATION
 NKO_international_black_market_gain_tt: "§YZvyšte naše špionážní operace vytvořením BUREAU-121.§!\n" # todo: NEW TRANSLATION
 NKO_economic_expansion: "Ekonomický rozvoj" # todo: NEW TRANSLATION
 NKO_economic_expansion_desc: "Rozšíření ekonomiky vytvoří více příležitostí a růst. Budeme prosazovat politiky podporující investice, podporovat podnikání a stimulovat hospodářskou činnost." # todo: NEW TRANSLATION
 NKO_create_komid: "Vytvořit KOMID" # todo: NEW TRANSLATION
 NKO_create_komid_desc: "Zřízení KOMID posílí naše obchodní schopnosti. Tato organizace bude spravovat naše mezinárodní obchodní operace a zajistí efektivní a výdělečné výměny s ostatními zeměmi." # todo: NEW TRANSLATION
 NKO_illict_trade_routes: "Nelegální obchodní trasy" # todo: NEW TRANSLATION
 NKO_illict_trade_routes_desc: "Vytváření nelegálních obchodních tras obchází mezinárodní sankce. Budeme rozvíjet utajené sítě, které zajistí nezbytné zboží a zdroje a posílí odolnost naší ekonomiky." # todo: NEW TRANSLATION
 NKO_expand_black_market: "Rozšíření černého trhu" # todo: NEW TRANSLATION
 NKO_expand_black_market_desc: "Rozšíření černého trhu poskytne další zdroje příjmů. Budeme podporovat podzemní ekonomické aktivity k získání prostředků a zajištění nezbytných zboží." # todo: NEW TRANSLATION
 NKO_acquire_military_equipment: "Získat vojenské vybavení" # todo: NEW TRANSLATION
 NKO_acquire_military_equipment_desc: "Získání vojenského vybavení posílí naše obranné schopnosti. Zajistíme vyspělé zbraně a technologii, aby bylo naše vojsko dobře vybaveno k ochraně naší země." # todo: NEW TRANSLATION
 NKO_black_market_boom: "Růst černého trhu" # todo: NEW TRANSLATION
 NKO_black_market_boom_desc: "Růst černého trhu přinese ekonomické výhody. Využijeme podzemní obchod k získání prostředků a podpoře naší ekonomiky." # todo: NEW TRANSLATION
 NKO_advanced_weapons_trade: "Obchod s vyspělými zbraněmi" # todo: NEW TRANSLATION
 NKO_advanced_weapons_trade_desc: "Zapojení do obchodu s vyspělými zbraněmi posílí naši vojenskou sílu. Budeme vyvíjet a prodávat sofistikované zbraně, abychom získali prostředky a posílili naši obranné schopnosti." # todo: NEW TRANSLATION
 NKO_red_star_os: "OS Červená hvězda" # todo: NEW TRANSLATION
 NKO_red_star_os_desc: "Vývoj OS Červená hvězda posune naše technologické schopnosti. Tento operační systém posílí naši kybernetickou bezpečnost a podpoří naši technologickou nezávislost." # todo: NEW TRANSLATION
 NKO_the_kwangmyong: "Kwangmyong" # todo: NEW TRANSLATION
 NKO_the_kwangmyong_desc: "Rozvoj sítě Kwangmyong zlepší naši komunikační infrastrukturu. Tato interní síť bude poskytovat bezpečný a spolehlivý přístup k informacím a podpoří naše digitální iniciativy." # todo: NEW TRANSLATION
 NKO_technological_independence: "Technologická nezávislost" # todo: NEW TRANSLATION
 NKO_technological_independence_desc: "Dosažení technologické nezávislosti zajistí naši soběstačnost. Budeme se soustředit na vývoj vlastních technologií a snížíme závislost na dovozu ze zahraničí." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_vietnam: "Obchodní dohody s Vietnamem" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_vietnam_desc: "Uzavírání obchodních dohod s Vietnamem posílí hospodářskou spolupráci. Budeme vyjednávat výhodné podmínky, aby byly vzájemně výhodné výměny a posílily naše bilaterální vztahy." # todo: NEW TRANSLATION
 NKO_invite_the_russians: "Obchodní dohody s [SOV.GetName]" # todo: NEW TRANSLATION
 NKO_invite_the_russians_desc: "Forming trade agreements with [SOV.GetName] will enhance economic cooperation. We will negotiate favorable terms to ensure mutually beneficial exchanges and strengthen our bilateral relations." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_china: "Obchodní dohody s [CHI.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_china_desc: "Forming trade agreements with [CHI.GetName] will enhance economic cooperation. We will negotiate favorable terms to ensure mutually beneficial exchanges and strengthen our bilateral relations." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_egypt: "Obchodní dohody s [EGY.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_egypt_desc: "Forming trade agreements with [EGY.GetName] will enhance economic cooperation. We will negotiate favorable terms to ensure mutually beneficial exchanges and strengthen our bilateral relations." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_sirya: "Obchodní dohody s [SYR.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_sirya_desc: "Forming trade agreements with [SYR.GetName] will enhance economic cooperation. We will negotiate favorable terms to ensure mutually beneficial exchanges and strengthen our bilateral relations." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_iraq: "Obchodní dohody s [IRQ.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_iraq_desc: "Forming trade agreements with [IRQ.GetName] will enhance economic cooperation. We will negotiate favorable terms to ensure mutually beneficial exchanges and strengthen our bilateral relations." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_iran: "Obchodní dohody s [PER.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_iran_desc: "Forming trade agreements with [PER.GetName] will enhance economic cooperation. We will negotiate favorable terms to ensure mutually beneficial exchanges and strengthen our bilateral relations." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_venesuela: "Obchodní dohody s [VEN.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_venesuela_desc: "Forming trade agreements with [VEN.GetName] will enhance economic cooperation. We will negotiate favorable terms to ensure mutually beneficial exchanges and strengthen our bilateral relations." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_brazilia: "Obchodní dohody se [BRA.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_brazilia_desc: "Vytváření obchodních dohod se [BRA.GetName] posílí hospodářskou spolupráci. Budeme vyjednávat výhodné podmínky, které zajistí vzájemně prospěšné výměny a posílí naše bilaterální vztahy." # todo: NEW TRANSLATION
 NKO_trade_agreements_with_indonesia: "Obchodní dohody se [IND.GetName]" # todo: NEW TRANSLATION
 NKO_trade_agreements_with_indonesia_desc: "Vytváření obchodních dohod se [IND.GetName] posílí hospodářskou spolupráci. Budeme vyjednávat výhodné podmínky, které zajistí vzájemně prospěšné výměny a posílí naše bilaterální vztahy." # todo: NEW TRANSLATION
 NKO_people_army: "Lidová armáda" # todo: NEW TRANSLATION
 NKO_people_army_desc: "Lidová armáda musela být připravena na válku i během obtížného období „Namáhavého pochodu“, aby se ubránila americkému imperialismu a jeho jihokorejským loutkám." # todo: NEW TRANSLATION
 NKO_national_defence_force: "Národní obrana" # todo: NEW TRANSLATION
 NKO_national_defence_force_desc: "Zvýšíme naše vojenské výdaje na úroveň našeho jižního protějšku, abychom udrželi náš národ v bezpečí před jakoukoli hrozbou." # todo: NEW TRANSLATION
 NKO_red_dawn: "Rudý úsvit" # todo: NEW TRANSLATION
 NKO_red_dawn_desc: "Úsvit našeho revolučního ducha znovu zazáří, jakmile posílíme naši vojenskou sílu. Ať je toto začátkem našeho neúnavného pochodu k nadvládě." # todo: NEW TRANSLATION
 NKO_use_russian_model: "Používat ruské námořní modely" # todo: NEW TRANSLATION
 NKO_use_russian_model_desc: "V našem úsilí o silné námořnictvo adoptujeme a přizpůsobíme námořní strategie a návrhy našich ruských spojenců, čímž posuneme naši flotilu k vyšším schopnostem." # todo: NEW TRANSLATION
 NKO_armed_to_the_teeth: "Vyzbrojeni až na zuby" # todo: NEW TRANSLATION
 NKO_armed_to_the_teeth_desc: "Každá loď bude vyzbrojena nejmocnějším arzenálem. Uděláme z naší námořnictva nezlomnou sílu, která bude vzbuzovat hrůzu v našich nepřátelích." # todo: NEW TRANSLATION
 NKO_heavy_cruiser_focus: "Zaměření na těžké křižníky" # todo: NEW TRANSLATION
 NKO_heavy_cruiser_focus_desc: "Abychom projevili svou moc po mořích, zaměříme se na stavbu těžce pancéřovaných křižníků, kteří dominují vodám a odolají jakémukoli nepříteli." # todo: NEW TRANSLATION
 NKO_the_north_korean_carrier: "Severokorejská letadlová loď" # todo: NEW TRANSLATION
 NKO_the_north_korean_carrier_desc: "Letadlová flotila je symbolem naší technické zdatnosti. Budeme vyvíjet vlastní letadlové lodě, aby nesly prapor ideologie Juche nad vzdálenými vodami." # todo: NEW TRANSLATION
 NKO_the_korean_typhoon_class: "Severokorejská třída Typhoon" # todo: NEW TRANSLATION
 NKO_the_korean_typhoon_class_desc: "Inspirována silnými ponorkami po celém světě, naše vlastní třída Typhoon posílí naše podmořské schopnosti a bude tichou hrozbou pro každého, kdo se odváží nás vyzvat." # todo: NEW TRANSLATION
 NKO_ship_launched_cruise_missiles: "Raketové střely vypuštěné z lodí" # todo: NEW TRANSLATION
 NKO_ship_launched_cruise_missiles_desc: "Naše námořnictvo bude vyzbrojeno nejnovějšími lodními řízenými střelami, čímž rozšíříme dosah a sílu k útokům na cíle daleko za našimi břehy." # todo: NEW TRANSLATION
 NKO_korean_mariens: "Severokorejští mariňáci" # todo: NEW TRANSLATION
 NKO_korean_mariens_desc: "Elitní mariňácké jednotky nám umožní provádět amfibické operace a rychle a rozhodně získat kontrolu nad strategickými lokalitami." # todo: NEW TRANSLATION
 NKO_studying_their_airforce: "Studium nepřátelských letectev" # todo: NEW TRANSLATION
 NKO_studying_their_airforce_desc: "Abychom se připravili na nevyhnutelné konflikty, musíme studovat letectva našich nepřátel, poznat jejich silné a slabé stránky a vytvořit protistrategie." # todo: NEW TRANSLATION
 NKO_focus_on_the_f_35: "Zaměření na F-35" # todo: NEW TRANSLATION
 NKO_focus_on_the_f_35_desc: "Analyzujeme technologii F-35 a využijeme její konstrukci jako inspiraci ke zlepšení našich vzdušných schopností a k čelení každému, kdo tento pokročilý stíhací letoun používá." # todo: NEW TRANSLATION
 NKO_focus_on_the_f_16: "Zaměření na F-16" # todo: NEW TRANSLATION
 NKO_focus_on_the_f_16_desc: "F-16 se osvědčil jako schopný stíhací letoun. Rozebereme jeho taktiku a technologie a zároveň zdokonalíme naši vlastní stíhací flotilu." # todo: NEW TRANSLATION
 NKO_focus_on_the_future_kai_kf_21: "Zaměření na KF-21" # todo: NEW TRANSLATION
 NKO_focus_on_the_future_kai_kf_21_desc: "KF-21 je jihokorejský stíhací letoun nové generace. Analýzou jeho potenciálu připravíme naše letectvo na odvrácení každé hrozby, kterou by mohl představovat." # todo: NEW TRANSLATION
 NKO_get_russian_help: "Žádat o ruskou vojenskou pomoc" # todo: NEW TRANSLATION
 NKO_get_russian_help_desc: "Pro posílení naší vojenské technologie vyhledáme pomoc Ruska, důvěryhodného spojence, aby nás vybavil potřebnou odborností a zařízeními." # todo: NEW TRANSLATION
 NKO_get_chinese_help: "Žádat o čínskou vojenskou pomoc" # todo: NEW TRANSLATION
 NKO_get_chinese_help_desc: "Pro posílení naší vojenské technologie vyhledáme pomoc Číny, důvěryhodného spojence, aby nás vybavil potřebnou odborností a zařízeními." # todo: NEW TRANSLATION
 NKO_our_jet: "Domácí stíhací letouny" # todo: NEW TRANSLATION
 NKO_our_jet_desc: "Budeme pokračovat ve výzkumu v oblasti letectví, abychom urychlili získání nejnovějších stíhacích letounů, avšak již z domácí produkce." # todo: NEW TRANSLATION
 NKO_korean_ground_forces: "Posílit severokorejské pozemní síly" # todo: NEW TRANSLATION
 NKO_korean_ground_forces_desc: "Naše pozemní síly jsou páteří naší obrany. Budeme investovat do jejich výcviku a výbavy, aby byly připravené na jakékoli boje." # todo: NEW TRANSLATION
 NKO_doctrine_modernization: "Modernizovat naši doktrínu" # todo: NEW TRANSLATION
 NKO_doctrine_modernization_desc: "Zavážeme moderní přístup k válčení, aby naše doktríny odrážely realitu současných vojenských taktik a strategií." # todo: NEW TRANSLATION
 NKO_implement_new_doctrine: "Zavést novou doktrínu" # todo: NEW TRANSLATION
 NKO_implement_new_doctrine_desc: "Zavedením nových strategií posílíme naše síly o inovativní taktiky a zvýšíme jejich účinnost na bojišti." # todo: NEW TRANSLATION
 NKO_superior_firepower: "Doktrína nadřazené palebné síly" # todo: NEW TRANSLATION
 NKO_superior_firepower_desc: "Zaměřením na palebnou sílu budeme vyzbrojovat naše síly, aby dokázaly vyvinout ohromnou sílu a dosáhly rozhodujících vítězství." # todo: NEW TRANSLATION
 NKO_keep_our_doctrine: "Ponechat naši tradiční doktrínu" # todo: NEW TRANSLATION
 NKO_keep_our_doctrine_desc: "Naše tradiční doktrína nám sloužila dobře. Budeme ji vylepšovat a udržovat, čerpaje sílu z minulosti a přizpůsobovat ji budoucím konfliktům." # todo: NEW TRANSLATION
 NKO_train_the_south: "Výcvik pro jižní operace" # todo: NEW TRANSLATION
 NKO_train_the_south_desc: "S potenciálními konflikty na jihu musíme naše síly připravit specificky pro toto prostředí, připravené bojovat s odolností a rozhodností." # todo: NEW TRANSLATION
 NKO_mass_assault_prevails: "Masová ofenziva zvítězí" # todo: NEW TRANSLATION
 NKO_mass_assault_prevails_desc: "Naše doktrína masové ofenzivy založená na ohromující síle čísel zůstává účinná. Budeme udržovat strategii masové ofenzivy a vyčerpat jakoukoli opozici." # todo: NEW TRANSLATION
 NKO_special_mass_assault: "Speciální jednotky masové ofenzivy" # todo: NEW TRANSLATION
 NKO_special_mass_assault_desc: "Abychom zdokonalili naši strategii masové ofenzivy, vyvineme specializované jednotky trénované speciálně pro využití sil této taktiky." # todo: NEW TRANSLATION
 NKO_korean_iron_fist: "Severokorejská železná pěst" # todo: NEW TRANSLATION
 NKO_korean_iron_fist_desc: "Naše moc bude železnou pěstí, která drtí jakoukoli opozici. Prostřednictvím přísného výcviku a disciplíny připravíme naše síly, aby ztělesnily tuto nezlomnou vůli." # todo: NEW TRANSLATION
 NKO_defend_our_skies: "Bránit naše oblohy" # todo: NEW TRANSLATION
 NKO_defend_our_skies_desc: "Naše protivzdušná obrana musí být impozantní. Budeme klást důraz na obranu našeho vzdušného prostoru, aby žádné nepřátelské letadlo nepřistálo neodhaleně." # todo: NEW TRANSLATION
 NKO_defend_the_coast: "Bránit naše pobřeží" # todo: NEW TRANSLATION
 NKO_defend_the_coast_desc: "Naše pobřežní obrana musí být ostražitá. Budeme posílit pobřeží, odrazíme pokusy o invazi a ochráníme naši suverenitu." # todo: NEW TRANSLATION
 NKO_harts: "Taktiky průzkumu ve vysoké nadmořské výšce" # todo: NEW TRANSLATION
 NKO_harts_desc: "Budeme přijímat pokročilé taktiky průzkumu ve vysoké nadmořské výšce, abychom sledovali pohyby nepřátel a získali cenné zpravodajské informace." # todo: NEW TRANSLATION
 NKO_upgrade_our_radar: "Vylepšit naše radarové systémy" # todo: NEW TRANSLATION
 NKO_upgrade_our_radar_desc: "Abychom dokázali odhalit hrozby z dálky, vylepšíme naši radarovou technologii, čímž získáme včasný varovný systém proti přibližujícím se nebezpečím." # todo: NEW TRANSLATION
 NKO_counter_enemy_missiles: "Protiopatření proti nepřátelským raketám" # todo: NEW TRANSLATION
 NKO_counter_enemy_missiles_desc: "Abychom chránili naši vlast, musíme vyvinout protiopatření proti nepřátelským raketám, abychom zůstali chráněni vůči leteckým hrozbám." # todo: NEW TRANSLATION
 NKO_army_supply_hubs: "Zřídit armádní zásobovací uzly" # todo: NEW TRANSLATION
 NKO_army_supply_hubs_desc: "Abychom udrželi naše síly, vybudujeme zásobovací uzly, které zajistí, že naše armáda bude vždy připravena a dostatečně zásobena pro trvalé operace." # todo: NEW TRANSLATION
 NKO_mass_drones: "Hromadná výroba dronů" # todo: NEW TRANSLATION
 NKO_mass_drones_desc: "Začneme se zaměřovat na masovou výrobu dronů, abychom naší armádě poskytli ty nejlepší drony!" # todo: NEW TRANSLATION
 NKO_begin_uranium_enrichment: "Zahájit obohacování uranu" # todo: NEW TRANSLATION
 NKO_begin_uranium_enrichment_desc: "Ať už jde o osvobození jihokorejského lidu, nebo o obranu naší velké vlasti před jadernou hrozbou amerických imperialistů, musíme odhodlaně a statečně pokračovat ve vývoji jaderných zbraní!" # todo: NEW TRANSLATION
 NKO_remove_monitoring_devices: "Odstranit monitorovací zařízení" # todo: NEW TRANSLATION
 NKO_remove_monitoring_devices_desc: "Naše obohacování uranu se nepochybně setká s odporem mezinárodního společenství. To nejlepší, co můžeme udělat, abychom obohacování uranu skryli, je ----- učinit mezinárodní společenství neviditelným." # todo: NEW TRANSLATION
 NKO_expel_inspectors: "Vyhostit inspektory" # todo: NEW TRANSLATION
 NKO_expel_inspectors_desc: "Mezinárodní agentura pro atomovou energii vyslala do naší země mnoho inspektorů, aby zajistila, že jadernou technologii používáme pouze k dodávkám energie. Když se od nich hodláme odtrhnout, můžeme tyto imperialistické špiony rovnou deportovat." # todo: NEW TRANSLATION
 NKO_withdraw_from_npt: "Vystoupit ze Smlouvy o nešíření jaderných zbraní" # todo: NEW TRANSLATION
 NKO_withdraw_from_npt_desc: "Důležitým krokem pro náš jaderný program, který souvisí s naší nezávislostí a bezpečností, je vystoupení ze Smlouvy o nešíření jaderných zbraní. Kvůli nerovným smlouvám směšných imperialistů nesmíme omezovat svou schopnost bránit nezávislost a bezpečnost naší země!" # todo: NEW TRANSLATION
 NKO_missile_tests: "Raketové testy" # todo: NEW TRANSLATION
 NKO_missile_tests_desc: "Raketové testy Severní Koreje představují ukázku jejích rostoucích schopností v oblasti balistických raket, od systémů krátkého dosahu až po mezikontinentální balistické rakety (ICBM). Tyto testy jsou klíčové pro rozvoj vojenské technologie, prosazování regionálního vlivu a signalizaci strategických záměrů, často zvyšují napětí a vyvolávají mezinárodní reakce." # todo: NEW TRANSLATION
 NKO_nuclear_tests: "Jaderné testy" # todo: MOVED KEY
 NKO_nuclear_tests_desc: "KLDR každých několik let provádí testy jaderných zbraní. Tyto testy vyvolaly rozsáhlé odsouzení ze strany zahraničních mocností, včetně Číny, navzdory jejím úzkým vztahům se Severní Koreou. Ačkoli Severní Korea tvrdí, že její jaderný program má obranný charakter, mnozí se obávají možnosti, že by [NKO.GetLeader] mohl tyto zbraně použít proti Americe nebo jejím spojencům." # todo: MOVED KEY
 NKO_our_pride_and_joy: "Naše pýcha a radost" # todo: NEW TRANSLATION
 NKO_our_pride_and_joy_desc: "Radujte se! Tváří v tvář kruté blokádě amerických imperialistů a jejich podřízených zemí máme my, Korejská lidově demokratická republika, pod vedením milovaného soudruha [NKO.GetLeader] konečně vlastní jadernou odvetnou sílu! Dny, kdy se nás američtí imperialističtí agresoři pokoušeli vydírat jaderným klackem, jsou pryč!" # todo: NEW TRANSLATION
 NKO_nuclear_approval_not_sco: "Nesmíme být členem ŠOS" # todo: NEW TRANSLATION
 NKO_people_air_force: "Lidové letectvo" # todo: NEW TRANSLATION
 NKO_people_air_force_desc: "Obloha Čosonu musí být chráněna před jakýmkoli narušením americkými imperialisty nebo jejich jižními spojenci. Pokud nezlepšíme své vzdušné schopnosti, půjde o obtížný úkol." # todo: NEW TRANSLATION
 NKO_improve_our_air_doctrine: "Zlepšit naši leteckou doktrínu" # todo: NEW TRANSLATION
 NKO_improve_our_air_doctrine_desc: "" # todo: NEW TRANSLATION
 NKO_construct_air_bases: "Vybudovat vzdušné základny" # todo: NEW TRANSLATION
 NKO_construct_air_bases_desc: "" # todo: NEW TRANSLATION
 NKO_self_produced_rifles: "Vlastní výroba pušek" # todo: NEW TRANSLATION
 NKO_self_produced_rifles_desc: "Korejská lidová armáda se nemůže spoléhat na zahraniční dodavatele své standardní služební pušky. Domácí arzenály se připraví na sériovou výrobu ručních zbraní a zajistí, aby byl každý voják vyzbrojen zbraní vyrobenou ve vlasti." # todo: NEW TRANSLATION
 NKO_model_master: "Mistr konstrukce" # todo: NEW TRANSLATION
 NKO_model_master_desc: "Vývoj tanků v Severní Koreji se zaměřuje na výrobu domácích obrněných vozidel přizpůsobených zdejšímu terénu a vojenské doktríně. Od modelů inspirovaných Sovětským svazem až po modernizované konstrukce hrají tyto tanky klíčovou roli v pozemních silách země a kladou důraz na pohyblivost, palebnou sílu a schopnost působit v rozmanitých bojových podmínkách." # todo: NEW TRANSLATION
 NKO_artillery: "Naše dělostřelectvo" # todo: NEW TRANSLATION
 NKO_artillery_desc: "Dělostřelectvo Severní Koreje je základním kamenem její vojenské strategie a zahrnuje širokou škálu systémů od tradičních houfnic po pokročilé raketové dělostřelectvo. Je proslulé obrovskými zásobami a je určeno k ničivé palebné síle schopné zasahovat vojenská zařízení i civilní oblasti, zejména v sousední Jižní Koreji, což z něj činí klíčový prvek odstrašení i útoku." # todo: NEW TRANSLATION
 NKO_spaa: "Naše protivzdušná obrana" # todo: NEW TRANSLATION
 NKO_spaa_desc: "Protivzdušná obrana Severní Koreje kombinuje technologie ze sovětské éry s domácími systémy a je určena k ochraně kritické infrastruktury a odrážení vzdušných hrozeb. Zahrnuje protiletadlové rakety, protiletadlová děla a radarové systémy a spoléhá na vícevrstvou obranu. Navzdory omezením ve srovnání s moderními systémy odráží důraz země na soběstačnost a odstrašení." # todo: NEW TRANSLATION
 NKO_more_zavods: "Investice do našeho vojensko-průmyslového komplexu" # todo: NEW TRANSLATION
 NKO_more_zavods_desc: "" # todo: NEW TRANSLATION
 NKO_rocket_artillery: "Raketové dělostřelectvo" # todo: NEW TRANSLATION
 NKO_rocket_artillery_desc: "Raketové dělostřelectvo Severní Koreje je klíčovou součástí jejích ozbrojených sil a zahrnuje širokou škálu systémů včetně výkonných modelů KN-09 a KN-25. Tyto platformy jsou určeny k přesným úderům na dlouhou vzdálenost a mohou poskytovat značnou palebnou sílu proti vojenským i strategickým cílům. Jejich pohyblivost a rychlé nasazení posilují schopnost Severní Koreje promítat sílu a udržovat útočné operace." # todo: NEW TRANSLATION
 NKO_naval_modernization: "Modernizace námořnictva" # todo: NEW TRANSLATION
 NKO_naval_modernization_desc: "Modernizace námořnictva Severní Koreje se zaměřuje na posílení schopností pomocí menších, obratných plavidel a pokročilých raketových systémů. Zahrnuje vývoj ponorek schopných odpalovat balistické rakety (SLBM) a modernizaci hladinových lodí moderní výzbrojí. Toto úsilí odráží strategii asymetrické války, která využívá pobřežní a podvodní prostředky k vyvážení větších námořních mocností a k projekci síly v regionálních vodách." # todo: NEW TRANSLATION
 NKO_anti_submarine: "Protiponorkové schopnosti" # todo: NEW TRANSLATION
 NKO_anti_submarine_desc: "Protiponorkové schopnosti Severní Koreje jsou omezené, ale rozvíjejí se. Spoléhají na kombinaci hlídkových člunů, hlubinných pum a plavidel vybavených sonarem. Úsilí o zlepšení těchto systémů zahrnuje nasazování menších, obratných lodí a experimentování s domácími technologiemi. Tyto schopnosti jsou zaměřeny na obranu pobřežních vod a odrážení případných vpádů nepřátelských ponorek." # todo: NEW TRANSLATION
 NKO_infiltration_by_sea: "Pronikání po moři" # todo: NEW TRANSLATION
 NKO_infiltration_by_sea_desc: "Námořní infiltrační strategie Severní Koreje využívá flotilu malých rychlých plavidel, ponorek a poloponorných člunů k provádění skrytých operací. Tyto prostředky umožňují často nepozorovanou přepravu speciálních jednotek a vybavení pro průzkum, sabotáže nebo nekonvenční válku. Tento přístup zdůrazňuje důraz Severní Koreje na asymetrickou taktiku využívající slabin podél nepřátelských pobřeží." # todo: NEW TRANSLATION
 NKO_submarine_development: "Vývoj ponorek" # todo: NEW TRANSLATION
 NKO_submarine_development_desc: "" # todo: NEW TRANSLATION
 NKO_upgrade_shipyards: "Modernizovat loděnice" # todo: NEW TRANSLATION
 NKO_upgrade_shipyards_desc: "Vývoj ponorek Severní Koreje se zaměřuje na rozšíření flotily konvenčními i strategickými plavidly včetně ponorek s balistickými raketami (SLBM), jako je třída Sinpo. Tento program podtrhuje ambici země vybudovat věrohodné podvodní odstrašení a zvýšit utajení i přežitelnost své jaderné strategie. Kombinací domácích konstrukcí a modernizace starších modelů Severní Korea upřednostňuje asymetrické námořní schopnosti k posílení obrany a strategického dosahu." # todo: NEW TRANSLATION
 NKO_expand_bases: "Rozšířit základny" # todo: NEW TRANSLATION
 NKO_expand_bases_desc: "Strategie rozšiřování vojenských základen Severní Koreje odráží její zaměření na posílení obrany a připravenosti. Zahrnuje modernizaci stávajících zařízení, výstavbu nových podzemních krytů a zlepšování logistických uzlů pro podporu ozbrojených sil. Rozšiřování základen má zvýšit efektivitu nasazení jednotek, chránit kritická aktiva a poskytnout strategickou hloubku, čímž zajišťuje přežitelnost při případných útocích a umožňuje projekci síly podél klíčových strategických bodů." # todo: NEW TRANSLATION
 NKO_green_water_navy: "Pobřežní námořnictvo" # todo: NEW TRANSLATION
 NKO_green_water_navy_desc: "Rozvoj pobřežního námořnictva Severní Koreje se zaměřuje na rozšíření operačního dosahu za pobřežní vody do regionálních moří. Strategie zahrnuje nasazení malých fregat, korvet a raketových člunů spolu s úsilím o zlepšení ponorkových schopností. Cílem je chránit územní nároky, podporovat asymetrickou válku a promítat omezenou sílu v regionálních vodách, zejména ve Žlutém moři a Japonském moři." # todo: NEW TRANSLATION
 NKO_revolutionary_military_spirit: "Revoluční vojenský duch" # todo: NEW TRANSLATION
 NKO_revolutionary_military_spirit_desc: "Koncept „revolučního vojenského ducha“ v Severní Koreji je základní ideologií zdůrazňující neochvějnou loajalitu, disciplínu a oddanost státu i jeho vedení. Slouží jako motivační rámec pro ozbrojené síly a podporuje odolnost, soběstačnost a připravenost k oběti tváří v tvář nepřízni osudu. Tento národní duch podkládá vojenskou kulturu země a posiluje jednotu a odhodlání dosahovat strategických cílů navzdory hospodářským a technologickým problémům." # todo: NEW TRANSLATION
 NKO_expand_peasant_militia: "Rozšířit rolnické milice" # todo: NEW TRANSLATION
 NKO_domestic_naval_strategy: "Domácí námořní strategie" # todo: NEW TRANSLATION
 NKO_domestic_naval_strategy_desc: "Položme základy moderní námořní doktríny. Každá část programu   ponorky, raketové čluny, pobřežní obrana a speciální operace   obdrží svůj podíl zdrojů, aby mohl začít rozvoj." # todo: NEW TRANSLATION
 NKO_domestic_submarine_program: "Domácí ponorkový program" # todo: NEW TRANSLATION
 NKO_domestic_submarine_program_desc: "Soustřeďme úsilí úřadu na domácí stavbu ponorek. Zdokonalená výroba trupů a intenzivnější výcvik posádek nám poskytnou tichou údernou sílu potřebnou k ohrožení nepřátel daleko od našeho pobřeží." # todo: NEW TRANSLATION
 NKO_domestic_destroyer_buildup: "Budování domácích torpédoborců" # todo: NEW TRANSLATION
 NKO_domestic_destroyer_buildup_desc: "Sériově vyrábějme raketové čluny a malé hladinové bojové lodě, které v pobřežních vodách zahl­tí nepřátelské flotily. Naše loděnice mohou stavět trupy rychleji, než Jih dokáže nasadit těžké torpédoborce." # todo: NEW TRANSLATION
 NKO_destroyer_unleashed: "Uvolnit torpédoborce" # todo: NEW TRANSLATION
 NKO_destroyer_unleashed_desc: "Nasadíme novou generaci torpédoborců vybavených těžšími děly a specializovanými protiletadlovými bateriemi. Flotila konečně dokáže soupeřit v námořních střetnutích na otevřeném moři, místo aby se ukrývala podél pobřeží." # todo: NEW TRANSLATION
 NKO_navy_projects: "Projekty severokorejského námořnictva" # todo: NEW TRANSLATION
 NKO_navy_projects_desc: "Zaměření §YModernizace námořnictva§! otevírá tento program. Získávejte body námořního budování pomocí rozhodnutí o financování, loděnicích a čučche a utrácejte je za větve §Hponorkových sil§!, §Hraketových flotil§!, §Hsítě pobřežní obrany§! a §Hnámořních speciálních operací§!, dokud všechny čtyři nedosáhnou §Y100§!." # todo: NEW TRANSLATION
 NKO_expand_peasant_militia_desc: "Rozšíření rolnických milic Severní Koreje, známých jako Dělnicko-rolnické rudé gardy, je strategickým krokem k posílení národní obrany prostřednictvím masové mobilizace. Tato polovojenská síla složená z civilistů má doplňovat pravidelné vojenské operace, bránit místní komunity a zajišťovat vnitřní bezpečnost. Rozšíření zahrnuje intenzivnější výcvik, vybavení milicionářů lehkými zbraněmi a jejich začlenění do širších vojenských cvičení." # todo: NEW TRANSLATION
 NKO_bolster_young_red_guards: "Posílit Mladé rudé gardy" # todo: NEW TRANSLATION
 NKO_bolster_young_red_guards_desc: "Posílení Mladých rudých gard, severokorejské mládežnické polovojenské organizace, je klíčovou iniciativou zaměřenou na vštěpování ideologické loajality a vojenské připravenosti mladé generaci. Zahrnuje zlepšení vojenského výcviku, politického vzdělávání a fyzické přípravy studentů, často jejich zapojením do cvičení národní obrany. Vybavením Mladých rudých gard základními zbraněmi a dovednostmi přežití zajišťuje Severní Korea stálý přísun ideologicky oddaných a bojově připravených jednotlivců." # todo: NEW TRANSLATION
 NKO_rebuild_sso: "Reforma speciálních sil" # todo: NEW TRANSLATION
 NKO_rebuild_sso_desc: "Reforma speciálních sil Severní Koreje se zaměřuje na modernizaci a posílení schopností elitních jednotek provádět asymetrickou válku, nekonvenční operace a rychlé zásahové mise. Reforma zahrnuje zdokonalení výcviku, zavedení pokročilé taktiky a vybavení moderními zbraněmi a komunikačními systémy. Speciální síly jsou určeny k infiltraci, sabotáži, průzkumu a přímým akcím proti strategickým objektům nebo kritické infrastruktuře." # todo: NEW TRANSLATION
 NKO_rebuild_kim_il_sung_military_university: "Obnovit Vojenskou univerzitu Kim Ir-sena" # todo: NEW TRANSLATION
 NKO_rebuild_kim_il_sung_military_university_desc: "Vojenská univerzita Kim Ir-sena, klíčová národní obranná vysoká škola v Pchjongjangu, shromažďuje od roku 1952 mnoho nejlepších velitelů země. Jak vstupujeme do nového století, stará zařízení této univerzity jsou stále méně vhodná pro nový způsob vedení války. Je čas vrátit této instituci její někdejší slávu." # todo: NEW TRANSLATION
 NKO_revolutionary_spirits: "Revoluční vojenský duch" # todo: NEW TRANSLATION
 NKO_the_green_water_navy: "Pobřežní námořnictvo" # todo: NEW TRANSLATION
 NKO_the_green_water_navy_desc: "Tento národní duch bude §Yvylepšen§!, pokud dokončíme zaměření §HModernizace námořnictva§!. \n§W--------------§!\nPobřežní námořnictvo je námořní síla schopná působit v pobřežních vodách svého státu a s omezenou schopností operovat v okolních okrajových mořích. Jedná se o relativně nový pojem, který vznikl za účelem lepšího rozlišení a zpřesnění významu dvou dlouhodobě používaných označení: oceánské námořnictvo (hluboké vody otevřených oceánů) a říční námořnictvo (pobřežní vody a vody blízko břehu)." # todo: NEW TRANSLATION
 NKO_the_blue_water_navy: "Oceánské námořnictvo" # todo: NEW TRANSLATION
 NKO_the_blue_water_navy_desc: "Roky rozšiřování loděnic, reformy doktríny a společných cvičení proměnily naši flotilu z pobřežní síly v opravdové oceánské námořnictvo. Nyní můžeme vyplouvat daleko za naše břehy a naše posádky i trupy se mohou rovnat kterémukoli soupeři v regionu.\n§W--------------§!\nOceánské námořnictvo je námořní síla schopná dlouhodobě působit v hlubokých vodách otevřených oceánů a projektovat moc daleko za hranicemi svého domovského pobřeží." # todo: NEW TRANSLATION
 NKO_young_red_guard_idea: "Rudé mládežnické gardy" # todo: NEW TRANSLATION
 NKO_young_red_guard_idea1: "Mládežnická garda" # todo: NEW TRANSLATION
 NKO_army_sso: "Armádní speciální operační jednotky" # todo: NEW TRANSLATION
 NKO_war_university: "Kim Il-sungova vojenská univerzita" # todo: NEW TRANSLATION
 NKO_vpk: "Domácí vojensko-průmyslový komplex" # todo: NEW TRANSLATION
 NKO_sad_army_idea: "Zastaralá lidová armáda" # todo: NEW TRANSLATION
 NKO_sad_army_idea_desc: "Tento národní duch bude §Yvylepšen§! pokud dokončíme §HRevolutionary Military Spirit§! fokusech.\n§W--------------§!\nArmáda Severní Koreje, ač má značnou personální sílu, je silně závislá na zastaralém vybavení a technologii. Většina jejího arzenálu se skládá z tanků, dělostřelectva a letadel sovětské provenience s omezenou modernizací. Tato závislost na starších systémech odráží omezené zdroje a mezinárodní sankce, čímž armádu činí početně silnou, ale čelí problémům v efektivitě a schopnostech ve srovnání s moderními armádami." # todo: NEW TRANSLATION
 NKO_new_army_idea: "Nová severokorejská lidová armáda" # todo: NEW TRANSLATION
 NKO_new_army_idea_desc: "Modernizovaná armáda Severní Koreje kombinuje pokročilé domácí technologie s strategickými vylepšeními klíčových vojenských aktiv. Vylepšené raketové systémy, drony a schopnosti kybernetické války ukazují posun směrem k modernizaci. Ačkoliv je stále omezena sankcemi, důraz na inovace a taktiky asymetrického boje ji činí významnou silou v regionu." # todo: NEW TRANSLATION
 NKO_marines_idea: "Námořní pěchota" # todo: NEW TRANSLATION
 NKO_planned_economy: "Plánované hospodářství" # todo: NEW TRANSLATION
 NKO_planned_economy_desc: "Země Severní Korea, oficiálně známá jako Korejská lidově demokratická republika (KLDR), má izolované a přísně kontrolované direktivní hospodářství. V direktivním hospodářství je ekonomika centrálně plánována a koordinována vládou, což z něj činí běžnou součást každé komunistické země." # todo: NEW TRANSLATION
 38th_parallel_NKO: "Výbor pro pokojné znovusjednocení vlasti" # todo: NEW TRANSLATION
 NKO_the_38th_parallel: "38. rovnoběžka" # todo: NEW TRANSLATION
 NKO_the_38th_parallel_desc: "V červenci 1953 byla mezi oběma Korejemi a čínskými dobrovolníky, stejně jako silami Organizace spojených národů, podepsána Korejská dohoda o příměří. Ta stanovila demilitarizované pásmo založené na 38. rovnoběžce, které odděluje Severní a Jižní Koreu. Tato dělicí linie existuje již přibližně 50 let a možná nastal čas vydat se k znovusjednocení, tak či onak." # todo: NEW TRANSLATION
 NKO_the_road_to_peace: "Cesta k míru?" # todo: NEW TRANSLATION
 NKO_the_road_to_peace_desc: "„Sluneční politika“ Jižní Koreje se zdá dokazovat upřímnou touhu po znovusjednocení. Možná nastal čas, aby severokorejští a jihokorejští soudruzi společně usilovali o sjednocení." # todo: NEW TRANSLATION
 NKO_cross_border_initiatives: "Přeshraniční iniciativy" # todo: NEW TRANSLATION
 NKO_cross_border_initiatives_desc: "" # todo: NEW TRANSLATION
 NKO_cease_propaganda_broadcasts: "Ukončit propagandační vysílání" # todo: NEW TRANSLATION
 NKO_cease_propaganda_broadcasts_desc: "Propagační vysílání nám dnes nemají moc co nabídnout, spíše odvedou ty jižní občany, kteří byli vychováni k antikomunistickému postoji, aby se rozčilovali nad našimi činy. Ukončení tohoto chování by je mohlo trochu potěšit." # todo: NEW TRANSLATION
 NKO_invite_the_president: "Pozvat prezidenta" # todo: NEW TRANSLATION
 NKO_invite_the_president_desc: "Pozvat prezidenta Jižní Koreje na návštěvu naší země, abychom se lépe poznali a vyřešili naše rozdíly a předsudky." # todo: NEW TRANSLATION
 NKO_invite_southern_performers: "Pozvat jižní výkonné umělce" # todo: NEW TRANSLATION
 NKO_invite_southern_performers_desc: "Jižní umělci mají také velký vliv na mládež na severu. Pozvání do naší země by mladým lidem na severu ukázalo naši dobrou vůli." # todo: NEW TRANSLATION
 NKO_stress_historical_bonds: "Konziliatorní rétorika" # todo: NEW TRANSLATION
 NKO_stress_historical_bonds_desc: "" # todo: NEW TRANSLATION
 NKO_unite_sport_team: "Jednotný olympijský tým" # todo: NEW TRANSLATION
 NKO_unite_sport_team_desc: "" # todo: NEW TRANSLATION
 NKO_propose_confederation: "Otázka konfederace" # todo: NEW TRANSLATION
 NKO_propose_confederation_desc: "" # todo: NEW TRANSLATION
 NKO_pave_the_way_for_reunification: "Vybudovat cestu k znovusjednocení" # todo: NEW TRANSLATION
 NKO_pave_the_way_for_reunification_desc: "Nyní, když byly učiněny velké kroky k normalizaci mezikorejských vztahů, můžeme začít připravovat znovusjednocení." # todo: NEW TRANSLATION
 NKO_create_confederation: "Korejská konfederace" # todo: NEW TRANSLATION
 NKO_create_confederation_desc: "" # todo: NEW TRANSLATION
 NKO_offer_negotiations: "Nabídka jednání" # todo: NEW TRANSLATION
 NKO_offer_negotiations_desc: "Je načase jednat se D.. Jižním Koreou o mírovém znovusjednocení." # todo: NEW TRANSLATION
 NKO_propose_north_led_unification: "Navrhnout severem vedené znovusjednocení" # todo: NEW TRANSLATION
 NKO_propose_north_led_unification_desc: "Z našeho spravedlivého systému blahobytu k naší silnější jaderné zbrani je zřejmé, že severokorejský model je cestou vpřed pro Korejský poloostrov. Musíme trvat na tom, že bychom měli být těmi, kdo povedou Koreu ke silné budoucnosti po znovusjednocení." # todo: NEW TRANSLATION
 NKO_the_road_to_war: "Cesta k válce" # todo: NEW TRANSLATION
 NKO_the_road_to_war_desc: "Američtí imperialisté a jejich jihokorejští loutkoví představitelé nebyli, nejsou a nikdy nebudou schopni připustit skutečné sjednocení Koreje. Znovusjednocení silou je věčnou pravdou." # todo: NEW TRANSLATION
 NKO_threaten_the_south: "Hrozit Jihu" # todo: NEW TRANSLATION
 NKO_threaten_the_south_desc: "" # todo: NEW TRANSLATION
 NKO_shut_down_communications: "Vypnout komunikace" # todo: NEW TRANSLATION
 NKO_shut_down_communications_desc: "" # todo: NEW TRANSLATION
 NKO_accelerate_testing: "Zrychlit testování" # todo: NEW TRANSLATION
 NKO_accelerate_testing_desc: "" # todo: NEW TRANSLATION
 NKO_end_six_party_negotiations: "Jaderné zbraně připraveny" # todo: NEW TRANSLATION
 NKO_end_six_party_negotiations_desc: "Šestistranná jednání nepřinesla nic než odklady. Opustíme vyjednávací stůl a uvedeme náš jaderný odstrašující prostředek do plné pohotovosti. Jižní Korea, Japonsko a Spojené státy pochopí, že o naší bezpečnosti se nevyjednává." # todo: NEW TRANSLATION
 NKO_remilitarize_the_dmz: "Remilitarizovat demilitarizované pásmo" # todo: NEW TRANSLATION
 NKO_remilitarize_the_dmz_desc: "Remilitarizace demilitarizovaného pásma bude znamenat výraznou eskalaci našeho konfliktu s Jihem, ale nepochybně poskytne našim jednotkám výhodu v nadcházejícím střetu." # todo: NEW TRANSLATION
 NKO_demoralize_propaganda: "Demoralizující propaganda" # todo: NEW TRANSLATION
 NKO_demoralize_propaganda_desc: "." # todo: NEW TRANSLATION
 NKO_border_picture: "Pohraniční snímky Jižní Koreje" # todo: NEW TRANSLATION
 NKO_border_picture_desc: "." # todo: NEW TRANSLATION
 NKO_finance_rebels: "Financování povstalců" # todo: NEW TRANSLATION
 NKO_finance_rebels_desc: "." # todo: NEW TRANSLATION
 NKO_weapons_for_rebels: "Zbraně pro povstalecké síly" # todo: NEW TRANSLATION
 NKO_weapons_for_rebels_desc: "." # todo: NEW TRANSLATION
 NKO_united_again: "Znovu sjednoceni" # todo: NEW TRANSLATION
 NKO_united_again_desc: "." # todo: NEW TRANSLATION
 NKO_all_out_war: "Totální válka" # todo: NEW TRANSLATION
 NKO_all_out_war_desc: "Je čas! Nechť jižní loutky a naše KPA zápasí na bojišti!" # todo: NEW TRANSLATION
 NKO_foment_insurrection: "Podněcovat vzpouru" # todo: NEW TRANSLATION
 NKO_foment_insurrection_desc: "" # todo: NEW TRANSLATION
 NKO_send_support: "Odeslat podporu" # todo: NEW TRANSLATION
 NKO_send_support_desc: "Nikdo nemůže vyhrát jen s kameny a Molotovovými koktejly; musíme podpořit jiho-korejské partyzány některým vybavením, které zoufale potřebují." # todo: NEW TRANSLATION
 NKO_assert_control: "Upevnit kontrolu" # todo: NEW TRANSLATION
 NKO_assert_control_desc: "Integrujte velení partyzánů na jihu do našeho generálního štábu, aby naše KPA a partyzáni mohli lépe spolupracovat." # todo: NEW TRANSLATION
 NKO_struggle_for_power: "Boj o moc" # todo: NEW TRANSLATION
 NKO_struggle_for_power_desc: "Mocenský zápas mezi Kim Čong-unem a jeho bratrem Kim Čong-namem byl skrytým bojem o nástupnictví uvnitř vládnoucí rodiny Severní Koreje. Po smrti jejich otce Kim Čong-ila byli oba bratři možnými kandidáty na vedení režimu. Kim Čong-nam, kdysi považovaný za favorizovaného dědice, upadl v nemilost kvůli veřejné kritice režimu a exilu v Macau. Kim Čong-un mezitím s podporou vlivných elit upevnil své postavení prostřednictvím strategických spojenectví a vnitřních čistek. Boj skončil nástupem Kim Čong-una k moci v roce 2011, který byl v roce 2017 poznamenán záhadným zavražděním Kim Čong-nama, jež podle mnohých zosnovala severokorejská vláda. Tento konflikt zdůraznil bezohlednou povahu mocenských vztahů v jednom z nejutajenějších režimů světa." # todo: NEW TRANSLATION
 NKO_orthodox_successor: "Pravověrný nástupce" # todo: NEW TRANSLATION
 NKO_orthodox_successor_desc: "V 90. letech byl Kim Čong-un velkým generálem Kim Čong-ilem vybrán jako nástupce díky svým vynikajícím schopnostem. Milovaný soudruh Kim Čong-un, kterého Bůh v minulosti, přítomnosti i budoucnosti daroval korejskému lidu, bude vždy chránit bezpečnost a prosperitu čučche Koreje." # todo: NEW TRANSLATION
 NKO_promote_self_reliance: "Prosazovat soběstačnost" # todo: NEW TRANSLATION
 NKO_promote_self_reliance_desc: "Země nikdy nemůže být bohatá a silná tím, že se spoléhá na ostatní. Silná může být pouze tehdy, když je soběstačná!" # todo: NEW TRANSLATION
 NKO_ostracize_kim_jong_nam: "Vyloučit Kim Čong-nama" # todo: NEW TRANSLATION
 NKO_ostracize_kim_jong_nam_desc: "Tím, že Kim Čong-nama ostrakizujeme a přimějeme „otce“, aby mu ještě méně důvěřoval, zvýšíme svou šanci na získání moci." # todo: NEW TRANSLATION
 NKO_bribe_kpa_seniors: "Podplatit veterány KLA" # todo: NEW TRANSLATION
 NKO_bribe_kpa_seniors_desc: "Generálové KLA drží vojenskou moc. Získání podpory těchto veteránů nám s větší pravděpodobností umožní převzít kontrolu." # todo: NEW TRANSLATION
 NKO_oppose_to_chinese_reform_road: "Otevřeně odmítnout čínskou reformní cestu" # todo: NEW TRANSLATION
 NKO_oppose_to_chinese_reform_road_desc: "Čínský model reforem vychází z jejich modelu kolektivního vedení. Pokud by byl tento přístup přenesen do Severní Koreje, nevyhnutelně by vedl ke společenskému chaosu. A „otec“ ho rovněž nepodporuje. V zájmu pokračování linie hory Pektu bychom měli otevřeně odmítnout použití čínského modelu reforem." # todo: NEW TRANSLATION
 NKO_discredit_jang_seong_taek: "Zdiskreditovat Čang Song-tcheka" # todo: NEW TRANSLATION
 NKO_discredit_jang_seong_taek_desc: "Čang Song-tchek je v Severní Koreji známým představitelem pročínské frakce a také oblíbenou postavou z otcova okolí. Takový zrádce, který prodal zájmy národa, nesmí být tolerován. Abychom úspěšně získali moc, musíme shromáždit důkazy o jeho vině a odsoudit ho před Otcem." # todo: NEW TRANSLATION
 NKO_call_for_change: "Volání po změně" # todo: NEW TRANSLATION
 NKO_call_for_change_desc: "KLDR funguje na plánovaném hospodářství téměř 50 let. Následnost „revolucí roku 1989“ a „namáhavého pochodu“ však dokázala, že státem plánované hospodářství již není vhodné pro nové století. Aby Severní Korea znovu zesílila, je zapotřebí odvážná a hluboká reforma." # todo: NEW TRANSLATION
 NKO_pull_in_young_military_officers: "Získat mladé vojenské důstojníky" # todo: NEW TRANSLATION
 NKO_pull_in_young_military_officers_desc: "Získání mladých a otevřeně smýšlejících důstojníků z KLA nám neuškodí. Jsou blíže řadovým vojákům a budou pro naši kontrolu nad jednotkami přínosem." # todo: NEW TRANSLATION
 NKO_frame_opposition: "Obvinit opozici" # todo: NEW TRANSLATION
 NKO_frame_opposition_desc: "Strategie obvinění Kim Čong-una spočívá v tom, že ho vykreslíme jako bezohlednou a destabilizující sílu ve vedení Severní Koreje. Zdůrazněním jeho agresivních čistek, nestálého rozhodování a nedostatku diplomatického umu ho můžeme představit jako hrozbu pro stabilitu režimu i regionální bezpečnost. Toto vykreslení postaví jeho činy do kontrastu s představou stabilního a racionálního vedení a zdůrazní potřebu vyváženější a mezinárodně přijatelnější osobnosti. Prostřednictvím pečlivě vytvářených příběhů, cílených sdělení a využití svědectví zasvěcených osob je cílem podkopat jeho důvěryhodnost a ovlivnit domácí i mezinárodní veřejné mínění." # todo: NEW TRANSLATION
 NKO_stir_up_father_son_relations: "Podněcovat konflikt mezi otcem a synem" # todo: NEW TRANSLATION
 NKO_stir_up_father_son_relations_desc: "Podněcování konfliktu mezi Kim Čong-unem a Kim Čong-ilem nebude snadné, ale získáme tím větší podporu." # todo: NEW TRANSLATION
 NKO_place_loyalists_in_kpa: "Dosadit loajalisty do KLA" # todo: NEW TRANSLATION
 NKO_place_loyalists_in_kpa_desc: "Před dvaceti lety, když měli Kim Čong-il i jeho nevlastní bratr možnost převzít vedení Severní Koreje, byla podpora starých partyzánů Kim Čong-ilovi klíčovým faktorem jeho pozdějšího zvolení nejvyšším vůdcem země. Nyní tuto pozici zdědila Korejská lidová armáda. Dosadíme do KLA loajalisty a zvýšíme nad ní naši kontrolu." # todo: NEW TRANSLATION
 NKO_finding_reformist_of_party: "Najít reformisty ve straně" # todo: NEW TRANSLATION
 NKO_finding_reformist_of_party_desc: "Nejde o to, že by ve straně reformisté neexistovali. Bojí se však promluvit tváří v tvář odporu Kim Čong-ila. Pokud získáme jejich podporu, bude pravděpodobnější, že změníme Čoson." # todo: NEW TRANSLATION
 NKO_power_struggle: "Mocenský boj" # todo: NEW TRANSLATION
 NKO_power_struggle_desc: "Dříve či později velký vůdce dnešní Severní Koreje, soudruh Kim Čong-il, zemře a jeho nástupcem se nepochybně stane jeden z jeho dvou synů, Kim Čong-nam nebo Kim Čong-un. Jenže „země nemůže mít dva pány“ a oba musí najít způsob, jak získat otcovu důvěru. Podpora jednoho kandidáta proti druhému až do zvolení nástupce způsobí ztrátu £stability_texticon §Ystability§!.\n\nPokud nemáme více než 45 % £stability_texticon §Ystability§!, junta se po smrti Kim Čong-ila pokusí převzít moc.\n\nSoučasná £stability_texticon §Ystabilita§!: [?NKO.stability|1%]\n\nV současnosti,\n§OPravověrnost Kim Čong-una§!: §Y[?ROOT.NKO_kim_jong_un]%§!\n§GPravověrnost Kim Čong-nama§!: §Y[?ROOT.NKO_kim_jong_nam]%§!\n\n§YKim Čong-ilův vybraný nástupce§!: [ROOT.GetChosenSuccessor]\n§RNejpravděpodobnější současný nástupce§!: [ROOT.GetSuccessor]\n\nNáš vůdce, §YKim Čong-il§!, se nemusí dožít roku 2012, proto se připravte zvolit nástupce v roce §Y2011§!" # todo: NEW TRANSLATION
 Kim_Jong_un_support: "Kim Čong-un: Lobbování o vedení" # todo: NEW TRANSLATION
 Kim_Jong_Nam_support: "Kim Čong-nam: Lobbování o vedení" # todo: NEW TRANSLATION
 Kim_Jong_il_Death: "Smrt Kim Čong-ila" # todo: NEW TRANSLATION
 Kim_Jong_il_Death_desc: "Milovaný Velký vůdce, zakladatel Korejské lidově demokratické republiky a věčný prezident republiky, Kim Čong-il, zemřel v 8.30 dne 17. prosince 2011 na akutní infarkt myokardu komplikovaný kardiogenním šokem, když vlakem cestoval na návštěvu místní oblasti." # todo: NEW TRANSLATION
