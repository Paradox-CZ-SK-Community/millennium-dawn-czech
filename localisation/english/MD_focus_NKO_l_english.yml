 korea_china.1.d: "Severokorejská vláda má zájem o náš vojenský letecký průmysl a chce vytvořit společný projekt na vývoj severokorejského stíhače pro potřeby její armády. Můžeme jim s tím pomoct, ale na oplátku významně posílíme náš vliv na jejich zemi." # todo: NEW TRANSLATION
