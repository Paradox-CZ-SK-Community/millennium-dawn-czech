 NKO_social_security: "Ministry of Social Security" → "Ministerstvo sociálního zabezpečení" # todo: NEW TRANSLATION
 NKO_social_security_desc: "The Ministry of Social Security commonly known as BoAn or the Ministry of People's Security is the interior ministry and principal law enforcement agency within North Korea. The ministry serves as the official public and internal security force, responsibile for maintaining public order and protecting key facilities including railways and other forms of transport." → "Ministerstvo sociálního zabezpečení, běžně známé jako BoAn, nebo Ministerstvo lidové bezpečnosti, je vnitra a hlavní složkou vnitřní bezpečnosti v Severní Koreji. Ministerstvo slouží jako oficiální veřejná i vnitřní bezpečnostní síla, odpovědná za udržování veřejného pořádku a ochranu klíčových zařízení včetně železnic a dalších dopravních prostředků." # todo: NEW TRANSLATION
 NKO_security_forces: "Social Security Forces" → "Sociální bezpečnostní síly" # todo: NEW TRANSLATION
 NKO_security_forces_desc: "Social Security Forces is a North Korean paramilitary force which performs various internal security and border security tasks" → "Sociální bezpečnostní síly jsou severokorejské polovojenské síly, které vykonávají různé vnitřní bezpečnostní a hraniční bezpečnostní úkoly." # todo: NEW TRANSLATION
 NKO_railway_bureau: "Railway Security Bureau" → "Železniční bezpečnostní úřad" # todo: NEW TRANSLATION
 NKO_railway_bureau_desc: "Railway Security Bureau - guards important routes of travel and transport within the DPRK" → "Železniční bezpečnostní úřad – střeží důležité trasy cestování a přepravy v KLDR." # todo: NEW TRANSLATION
 NKO_finacial_bureau: "Financial Intelligence Agency" → "Finanční zpravodajská agentura" # todo: NEW TRANSLATION
 NKO_finacial_bureau_desc: "Financial Intelligence Agency - combats money-laundering, extortion and other financial crimes" → "Finanční zpravodajská agentura bojuje proti praní špinavých peněz, vydírání a dalším finančním zločinům." # todo: NEW TRANSLATION
 NKO_corrections_bureau: "Corrections Bureau" → "Korekční úřad" # todo: NEW TRANSLATION
 NKO_corrections_bureau_desc: "Corrections Bureau operates the brutal prison system in North Korea" → "Korekční úřad provozuje brutální vězeňský systém v Severní Koreji." # todo: NEW TRANSLATION
