 NKO_international_sanctions_idea: "Sankce Rady bezpečnosti OSN" # todo: NEW TRANSLATION
 NKO_international_sanctions_idea_desc: "Mezinárodní sankce proti Severní Koreji míří na její ekonomiku, obchod a vojenský rozvoj v reakci na její jaderné ambice a obavy o lidská práva. Tyto sankce omezují přístup k cizí měně, pokročilé technologii a klíčovým zdrojům, jejichž cílem je vyvíjet tlak na režim k denuklearizaci a zároveň výrazně ovlivňovat populaci a ekonomickou stabilitu." # todo: NEW TRANSLATION
 NKO_hermit_kingdom_desc: "Severní Korea je od svého vzniku izolovaný stát. Přestože patří mezi nejchudší země světa, dokáže si udržet jednu z největších armád na světě. Kimova rodina je u moci už více než 50 let, prakticky bez vnitřní opozice. Poustevnické království Severní Koreje je nevysvětlenou anomálií mezi zeměmi.\n\n§R Tento nápad bude odstraněn, pokud Kimova rodina již nebude u moci!§!" # todo: NEW TRANSLATION
 NKO_closed_nation: "Totalitní vláda" # todo: NEW TRANSLATION
 NKO_closed_nation_desc: "Abychom zachovali stabilitu národa a naši národní suverenitu, zcela jsme omezili přístup k internetu a uplatňujeme přímou kontrolu nad všemi ostatními médii. Nesouhlas nelze tolerovat." # todo: NEW TRANSLATION
 NKO_russian_friendship: "Rusko-severokorejské spojenectví" # todo: NEW TRANSLATION
 NKO_russian_friendship_desc: "Rusko bylo vždy jedním z našich hlavních spojenců a Sovětský svaz se ještě výrazněji podílel na našem vzniku a existenci. Máme v úmyslu pokusit se znovu oživit spojenecké vztahy mezi našimi zeměmi" # todo: NEW TRANSLATION
 korea_russia.1.t: "Ruská vojenská základna" # todo: NEW TRANSLATION
 korea_russia.1.d: "Ruská vláda nabízí umístit jejich vojenskou základnu na našem území. Pro nás to bude vynikající záruka ochrany před útoky našich agresivních sousedů, a navíc to zlepší naši spolupráci s Ruskem." # todo: NEW TRANSLATION
 korea_russia.1.a: "Souhlasíme" # todo: NEW TRANSLATION
 korea_russia.1.b: "Nepotřebujeme to." # todo: NEW TRANSLATION
 korea_russia.2.t: "Oni přijali nabídku." # todo: NEW TRANSLATION
 korea_russia.2.d: "Vláda s naší návrhovou dohodou souhlasila. To nás velmi potěšilo a pomůže posílit naše vztahy." # todo: NEW TRANSLATION
 korea_russia.2.a: "Dobré" # todo: NEW TRANSLATION
 korea_russia.3.t: "Odmítli nabídku" # todo: NEW TRANSLATION
 korea_russia.3.d: "Ruská vláda odmítla naši štědrou nabídku. Snad příště to zlepší." # todo: NEW TRANSLATION
 korea_russia.3.a: "Smutné" # todo: NEW TRANSLATION
 korea_russia.4.t: "Jaderná elektrárna v Severní Koreji" # todo: NEW TRANSLATION
 korea_russia.4.d: "Severokorejská vláda chce uzavřít smlouvu s naší ROSATOM na výstavbu elektrárny na jejich území, je to důležitý krok pro nás, protože nemůžeme poskytovat jadernou energii všem." # todo: NEW TRANSLATION
 korea_russia.4.a: "Postavíme pro ně elektrárnu." # todo: NEW TRANSLATION
 korea_russia.4.b: "Ne" # todo: NEW TRANSLATION
 korea_russia.5.t: "Jaderná elektrárna v Severní Koreji" # todo: NEW TRANSLATION
 korea_russia.5.d: "Ruská vláda souhlasila s udělením Rosatomu povolení postavit jadernou elektrárnu na našem území, je na čase začít." # todo: NEW TRANSLATION
 korea_russia.5.a: "Jaderná síla Severní Koreje by měla vstoupit do nové éry." # todo: NEW TRANSLATION
 korea_russia.6.t: "Nové vybavení" # todo: NEW TRANSLATION
 korea_russia.6.d: "Ruské Generální štáb je připraven dodat naší armádě nejnovější výstroj 'Ratnik', která zlepší bojové vlastnosti naší pěchoty." # todo: NEW TRANSLATION
 korea_russia.6.a: "Sláva ruským a severokorejským zbraním" # todo: NEW TRANSLATION
 korea_russia.7.t: "Plynovod Severní Koreje" # todo: NEW TRANSLATION
 korea_russia.7.d: "Severní Korea chce obnovit projekt plynovodu Koreje, ale s konečnou stanicí v Severní Koreji. To posílí Korejskou nezávislost na zdrojích z jiných zemí a získáme další páku vlivu nad nimi." # todo: NEW TRANSLATION
 korea_russia.7.a: "Je čas postavit plynovod" # todo: NEW TRANSLATION
 korea_russia.7.b: "Tento projekt pro nás není ziskový" # todo: NEW TRANSLATION
 korea_russia.8.t: "Dohoda o komplexním strategickém partnerství" # todo: NEW TRANSLATION
 korea_russia.8.d: "Rusko souhlasilo s podpisem dohody, kterou nám navrhlo. Snad se nyní poměr sil na Korejském poloostrově obrátí v náš prospěch!" # todo: NEW TRANSLATION
