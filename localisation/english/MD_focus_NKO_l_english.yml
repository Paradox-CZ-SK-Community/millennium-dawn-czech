 NKO_specialise_guerrilla_tt: "§GVelitelé vycvičení v partyzánském boji se naučí připravovat přepadení.§!" # todo: NEW TRANSLATION
 NKO_specialise_commando_tt: "§GVelitelé vycvičení pro komandové operace budou povýšeni do čela speciálních sil.§!" # todo: NEW TRANSLATION
 NKO_sso_new_general_tt: "§GSpeciální operační síly jmenují §!§YKim Jong Bok§!§G, specialistu na speciální síly, novým velitelem sboru.§!" # todo: NEW TRANSLATION
 NKO_spa_focus_lifts_economy_tt: "§GTrvale odstraňuje §!§Ystálý postih „Hromadění zdrojů“.§!" # todo: NEW TRANSLATION
 NKO_spa_focus_lifts_research_tt: "§GTrvale odstraňuje §!§Ystálý postih „Výzkumná stagnace“.§!" # todo: NEW TRANSLATION
 NKO_spa_focus_lifts_agriculture_tt: "§GTrvale odstraňuje §!§Ystálý postih „Samozásobitelské zemědělství“.§!" # todo: NEW TRANSLATION
 NKO_spa_focus_lifts_foreign_tt: "§GTrvale odstraňuje §!§Ystálý postih „Diplomatická izolace“.§!" # todo: NEW TRANSLATION
 NKO_spa_focus_lifts_construction_tt: "§GTrvale odstraňuje §!§Ystálý postih „Úzké hrdlo výstavby“§! (obranná infrastruktura)." # todo: NEW TRANSLATION
