 NKO_arms_export: "Úřad pro zahraniční vztahy" # todo: NEW TRANSLATION
 NKO_arms_export_desc: "Úřad stojící za organizací KOMID a zahraničním obchodem se zbraněmi. Dodávejte zbraně, rakety, vojáky a satelity válčícím státům výměnou za tvrdou měnu, technologie a trvale rostoucí průmyslovou základnu." # todo: NEW TRANSLATION
 NKO_arms_export_modifiers: "Úřad pro zahraniční vztahy" # todo: NEW TRANSLATION
 NKO_arms_export_modifiers_desc: "Pchjongjangský úřad pro vývoz zbraní. Každý národ, který zásobujeme, trvale zvyšuje naši §Yprůmyslovou výrobu§! a §Yefektivitu výroby§!, přičemž tento bonus roste s rozšiřováním multipolárního arzenálu." # todo: NEW TRANSLATION
 NKO_arms_export_title: "§YÚřad pro zahraniční vztahy§!" # todo: NEW TRANSLATION
 NKO_arms_export_clients_readout: "Zásobované národy: §Y[?NKO_arms_export_clients|0]§!    Uzavřené dohody: §Y[?NKO_arms_export_deals|0]§!" # todo: NEW TRANSLATION
 NKO_arms_export_output_readout: "Trvalá průmyslová výroba: §G+[?NKO_arms_export_clients|0]%§!" # todo: NEW TRANSLATION
 NKO_arms_export_revenue_readout: "Získaná tvrdá měna: §G$[?NKO_arms_export_revenue|0]§! miliard" # todo: NEW TRANSLATION
 NKO_arms_export_sanctions_readout: "Tlak sankcí: [NKO_arms_export_sanctions_status]" # todo: NEW TRANSLATION
 NKO_arms_export_hint: "§YOtevřete§! sekci Konvenční a vyzbrojte kterýkoli §Wnezápadní§! národ, který §Rprohrává válku§! (30 % a více kapitulace). Každý klient poskytuje §Gtrvalou +1% průmyslovou výrobu§!, tvrdou měnu a technologie, ale zvyšuje §Rsankce§!. Lobujte u svých patronů za jejich zmírnění." # todo: NEW TRANSLATION
 NKO_arms_export_capstone_status_progress: "§OArzenál multipolárního světa: zásobte 10 národů a odemkněte završení.§!" # todo: NEW TRANSLATION
 NKO_arms_export_capstone_status_ready: "§GArzenál multipolárního světa je na dosah. Svolejte úřad.§!" # todo: NEW TRANSLATION
 NKO_arms_export_capstone_status_done: "§GArzenál multipolárního světa dosažen.§!" # todo: NEW TRANSLATION
 NKO_arms_export_sanctions_max: "§RMaximum (Rada bezpečnosti OSN)§!" # todo: NEW TRANSLATION
 NKO_arms_export_sanctions_severe: "§RVelmi vysoké§!" # todo: NEW TRANSLATION
 NKO_arms_export_sanctions_heavy: "§OVysoké§!" # todo: NEW TRANSLATION
 NKO_arms_export_sanctions_moderate: "§OStřední§!" # todo: NEW TRANSLATION
 NKO_arms_export_sanctions_light: "§YNízké§!" # todo: NEW TRANSLATION
 NKO_arms_export_sanctions_none: "§GŽádné§!" # todo: NEW TRANSLATION
 NKO_arms_export_conv_open: "§YOtevřít§! vývoz konvenčních zbraní" # todo: NEW TRANSLATION
 NKO_arms_export_conv_open_desc: "Zobrazit rozhodnutí o konvenčních dodávkách: dělostřelecké granáty a dobrovolníci Bouřného sboru pro každý válčící národ." # todo: NEW TRANSLATION
 NKO_arms_export_conv_close: "§YZavřít§! vývoz konvenčních zbraní" # todo: NEW TRANSLATION
 NKO_arms_export_conv_close_desc: "Skrýt rozhodnutí o konvenčních dodávkách a udržet panel přehledný." # todo: NEW TRANSLATION
 NKO_export_munitions: "Odeslat balíček konvenčních zbraní do [FROM.GetNameWithFlag]" # todo: NEW TRANSLATION
 NKO_export_munitions_desc: "Přepravte balíček zbraní ze skladů Lidové armády na frontu. [FROM.GetName] si zvolí typ divize, který nejvíce potřebuje (§Ylehkou pěchotu§!, §Ymotorizovanou§!, §Yobrněnou§! nebo §Ymechanizovanou§!), a my odešleme dostatek moderního vybavení z roku 1995 nebo novějšího pro §Ytři prapory§!, přímo z našich vlastních zásob. Obrněné a mechanizované balíčky vyžadují moderní konstrukci tanku. Letadla nedodáváme. Budou bojovat tvrději a my dostaneme zaplaceno v tvrdé měně." # todo: NEW TRANSLATION
 NKO_deploy_storm_corps: "Nasadit Bouřný sbor do [FROM.GetNameWithFlag]" # todo: NEW TRANSLATION
 NKO_deploy_storm_corps_desc: "Nabídněte [FROM.GetName] severokorejskou intervenci. Pokud ji přijmou, odemkneme možnost posílat na jejich frontu §Ydobrovolnické divize§!, čímž upevníme naše patronátní vztahy a získáme jejich vděk. Nasazení v §YRusku§! nebo §YČíně§! otevře trvalou dotaci v tvrdé měně, která pokračuje i poté, co se sbor vrátí domů. Vyžaduje zahraniční politiku §YGlobální intervencionismus§!." # todo: NEW TRANSLATION
 NKO_arms_export_lobby_relief: "Lobovat za zmírnění sankcí" # todo: NEW TRANSLATION
 NKO_arms_export_lobby_relief_desc: "Využijte diplomatickou váhu našich dobře vyzbrojených partnerů a skrytou finanční částku k dosažení jednostupňového zmírnění mezinárodních sankcí v Organizaci spojených národů." # todo: NEW TRANSLATION
 NKO_arms_export_capstone: "Arzenál multipolárního světa" # todo: NEW TRANSLATION
 NKO_arms_export_capstone_desc: "Po vyzbrojení koalice národů proti imperialistickému řádu formalizujte roli Pchjongjangu jako dílny multipolárního světa." # todo: NEW TRANSLATION
 NKO_arms_export_relief_deals_tt: "Uzavřel alespoň §Y5§! vývozních dohod" # todo: NEW TRANSLATION
 NKO_arms_export_relief_sanctions_tt: "V současnosti čelí mezinárodním sankcím" # todo: NEW TRANSLATION
 NKO_arms_export_unlock_tt: "§GOdemkne Úřad pro zahraniční vztahy, program vývozu zahraničních zbraní a živé síly.§!" # todo: NEW TRANSLATION
 NKO_export_munitions_effect_tt: "Pokud nabídku přijmou, klient požádá o balíček pro jednu divizi a my dodáme dostatek vybavení z roku §Y1995 nebo novějšího§! pro §Ytři prapory§!, §Yčerpaného z našich vlastních zásob§!. Obrněné a mechanizované balíčky vyžadují §Ymoderní konstrukci tanku§! (alespoň polovinu modulů z období po studené válce). §RLetadla nejsou dodávána.§! Zaplaceno dostaneme v §Ytvrdé měně§! a nový klient poskytne trvalý bonus průmyslové výroby podle balíčku: §G+1%§! lehká pěchota, §G+2%§! motorizovaná, §G+3%§! obrněná nebo mechanizovaná. Tlak sankcí vzroste.\n\nKlient získá na §Y365§! dní §YSeverokorejskou munici§!:\n  §G+5%§! útok divize\n  §G+5%§! rychlost obnovy divize\n  §G-5%§! spotřeba zásobování" # todo: NEW TRANSLATION
 NKO_export_troops_effect_tt: "Nabídneme nasazení intervenčních sil. Pokud hostitel souhlasí, odemkneme možnost posílat do jeho války §Ydobrovolnické divize§! a získáme politickou přízeň a tvrdou měnu. Doma nepřijdeme o žádnou živou sílu." # todo: NEW TRANSLATION
 NKO_storm_corps_permanent_income_tt: "Jako velmocenský patron nám poskytují §Ytrvalou§! týdenní dotaci v tvrdé měně, která pokračuje i po návratu Bouřného sboru domů." # todo: NEW TRANSLATION
 NKO_arms_client_munitions: "Severokorejská munice" # todo: NEW TRANSLATION
 NKO_arms_client_munitions_desc: "Bedny severokorejských granátů a pušek udržují děla v palbě." # todo: NEW TRANSLATION
 NKO_arms_client_troops: "Dobrovolníci Korejské lidové armády" # todo: NEW TRANSLATION
 NKO_arms_client_troops_desc: "Veteráni Bouřného sboru posilují frontu a drží linii." # todo: NEW TRANSLATION
 NKO_storm_corps_abroad: "Bouřný sbor nasazen v zahraničí" # todo: NEW TRANSLATION
 NKO_storm_corps_abroad_desc: "Naše nejlepší jednotky bojují v cizí válce. Jejich nepřítomnost se doma projevuje nedostatkem živé síly a morálky." # todo: NEW TRANSLATION
 NKO_arms_export_capstone_spirit: "Arzenál multipolárního světa" # todo: NEW TRANSLATION
 NKO_arms_export_capstone_spirit_desc: "Pchjongjang se stal nepostradatelným dodavatelem pro národy vzdorující Západu. Naše továrny pracují naplno, chráněny před tlakem sankcí." # todo: NEW TRANSLATION
 NKO_export.1.t: "Moskva potřebuje granáty" # todo: NEW TRANSLATION
 NKO_export.1.d: "Ruská ofenziva spotřebovává munici rychleji, než ji jeho továrny dokážou dodávat. Kreml prostřednictvím tichých kanálů žádá Pchjongjang o dělostřelecké granáty, rakety a cokoli dalšího, co může Lidová armáda postrádat. Platba bude štědrá: hotovost, obilí a vojenské technologie, po nichž jsme dlouho toužili." # todo: NEW TRANSLATION
 NKO_export.1.a: "Splňte objednávku" # todo: NEW TRANSLATION
 NKO_export.1.b: "Tentokrát ne" # todo: NEW TRANSLATION
 NKO_export.10.t: "[FROM.GetNameWithFlag] nabízí balíček zbraní" # todo: NEW TRANSLATION
 NKO_export.10.d: "Pchjongjang nabízí přepravit našim zoufale potřebným silám balíček moderních zbraní, zaplacený v tvrdé měně. Můžeme požádat o vybavení pro typ divize, který nejvíce potřebujeme: dostatek vybavení pro §Ytři prapory§!, přímo ze severokorejských zásob." # todo: NEW TRANSLATION
 NKO_export.10.a: "Požádat o balíček §Ylehké pěchoty§!: pušky a velitelské vybavení" # todo: NEW TRANSLATION
 NKO_export.10.a.tt: "Dodá §Ypušky§! a §Yvelitelské vybavení§! dostačující pro §Ytři prapory lehké pěchoty§! (3× požadavek praporu)." # todo: NEW TRANSLATION
 NKO_export.10.c: "Požádat o balíček §Ymotorizované pěchoty§!: pušky, užitková vozidla a velitelské vybavení" # todo: NEW TRANSLATION
 NKO_export.10.c.tt: "Dodá §Ypušky§!, §Yužitková vozidla§! a §Yvelitelské vybavení§! dostačující pro §Ytři prapory motorizované pěchoty§! (3× požadavek praporu)." # todo: NEW TRANSLATION
 NKO_export.10.e: "Požádat o §Yobrněný§! balíček: hlavní bojové tanky a velitelské vybavení" # todo: NEW TRANSLATION
 NKO_export.10.e.tt: "Dodá §Yhlavní bojové tanky§! a §Yvelitelské vybavení§! dostačující pro §Ytři obrněné prapory§! (3× požadavek praporu). Vyžaduje moderní severokorejskou konstrukci tanku." # todo: NEW TRANSLATION
 NKO_export.10.f: "Požádat o balíček §Ymechanizované pěchoty§!: bojová vozidla pěchoty, obrněné transportéry, pušky a velitelské vybavení" # todo: NEW TRANSLATION
 NKO_export.10.f.tt: "Dodá §Ybojová vozidla pěchoty§!, §Yobrněné transportéry§!, §Ypušky§! a §Yvelitelské vybavení§! dostačující pro §Ytři prapory mechanizované pěchoty§! (3× požadavek praporu). Vyžaduje moderní severokorejské moduly vozidel." # todo: NEW TRANSLATION
 NKO_export.10.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 NKO_export.11.t: "[FROM.GetNameWithFlag] přijímá naše zbraně" # todo: NEW TRANSLATION
 NKO_export.11.d: "[FROM.GetName] přijal naši nabídku. Zásilka opouští naše sklady a míří na frontu, zatímco tvrdá měna je již na našich účtech." # todo: NEW TRANSLATION
 NKO_export.11.a: "Naložte vlaky" # todo: NEW TRANSLATION
 NKO_export.12.t: "[FROM.GetNameWithFlag] odmítá naše zbraně" # todo: NEW TRANSLATION
 NKO_export.12.d: "[FROM.GetName] odmítl naše zbraně. Bedny zůstávají v našich skladech." # todo: NEW TRANSLATION
 NKO_export.12.a: "Budiž" # todo: NEW TRANSLATION
 NKO_export.99.t: "Arzenál multipolárního světa" # todo: NEW TRANSLATION
 NKO_export.99.d: "Od Moskvy po Teherán zásobují severokorejské továrny zbraněmi armády tuctu národů. To, co začalo jako zoufalý obchod za tvrdou měnu, učinilo Demokratickou lidovou republiku nepostradatelnou pro každou mocnost, která vzdoruje Washingtonu. Dílnа revoluce našla své zákazníky." # todo: NEW TRANSLATION
 NKO_export.99.a: "Nechte svět, aby na nás závisel" # todo: NEW TRANSLATION
 NKO_export.22.t: "Pchjongjang nabízí intervenční síly" # todo: NEW TRANSLATION
 NKO_export.22.d: "[FROM.GetName] navrhuje nasadit na naši frontu korejské dobrovolnické divize. Jejich vojáci by bojovali po našem boku proti našim nepřátelům; nabídku intervence z Pchjongjangu si jen stěží můžeme dovolit odmítnout." # todo: NEW TRANSLATION
 NKO_export.22.a: "Přijmout jejich vojáky" # todo: NEW TRANSLATION
 NKO_export.22.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 NKO_export.20.t: "[FROM.GetNameWithFlag] potřebuje muže" # todo: NEW TRANSLATION
 NKO_export.20.d: "[FROM.GetName], kde již bojuje náš Bouřný sbor, vyčerpal své rezervy živé síly. Jejich velení žádá Pchjongjang o vyslání čerstvých mužů, kteří udrží linii." # todo: NEW TRANSLATION
 NKO_export.20.a: "Pošlete posily" # todo: NEW TRANSLATION
 NKO_export.20.b: "Muže nemůžeme postrádat" # todo: NEW TRANSLATION
 NKO_export_send_manpower_tt: "§GOdešle živou sílu ve výši §Y10%§! náborového fondu země [FROM.GetName], čerpanou z našich rezerv.§!" # todo: NEW TRANSLATION
 NKO_export.40.t: "Západ odpovídá sankcemi" # todo: NEW TRANSLATION
 NKO_export.40.d: "Naše vybavení se stále objevuje na frontách, které před námi imperialisté chtěli uzavřít. [USA.GetName], spolu s [FRA.GetName], [GER.GetName] a [JAP.GetName], zavedly nový balík sankcí: zmrazené účty, černou listinu obchodních domů a varování pro každého, kdo bude nadále nakupovat od Pchjongjangu. Jejich tlaku jsme již čelili." # todo: NEW TRANSLATION
 NKO_export.40.a: "Nechte imperialisty zuřit" # todo: NEW TRANSLATION
 NKO_export.40.b: "Tiše úder absorbujte" # todo: NEW TRANSLATION
 NKO_arms_contract_title: "§YZávazky dobrovolníků patronů§!" # todo: NEW TRANSLATION
 NKO_expeditions_readout: "Zavázané expedice: §G[?NKO_expeditions_completed|0]§!" # todo: NEW TRANSLATION
 NKO_commit_volunteers: "Zavázat dobrovolnickou expedici do [FROM.GetName]" # todo: NEW TRANSLATION
 NKO_commit_volunteers_desc: "Formalizujte nasazení našich dobrovolnických divizí bojujících v zemi [FROM.GetName]. Pchjongjang účtuje svému patronovi živou sílu a ukládá tvrdou měnu. [FROM.GetName] platí za naše divize prémii." # todo: NEW TRANSLATION
 NKO_commit_volunteers_req_tt: "[FROM.GetName] hostí alespoň §Y6§! našich dobrovolnických divizí" # todo: NEW TRANSLATION
 NKO_commit_volunteers_effect_tt: "Uloží prémii v tvrdé měně do naší §Ypokladny§!. Dokud naše §Ydobrovolnické divize§! bojují v zahraničí, trvalé nasazení cvičí naši armádu a každý týden poskytuje §Ymistrovství v pozemní doktríně§!." # todo: NEW TRANSLATION
 NKO_national_recovery_plan_started_tooltip: "§Y$NKO_national_recovery_plan$§! dokončen před více než §Y1§! rokem" # todo: NEW TRANSLATION
