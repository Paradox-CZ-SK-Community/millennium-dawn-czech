 NKO_naval_capstone_news_tt: "Vysílá §Hvelkou zpravodajskou událost§!: §Y„Pchjongjangský mořský pás je zformován“§!   doma oslavováno, v zahraničí zaznamenáno." # todo: NEW TRANSLATION
 NKO_naval_allocate_party_funds: "Přidělit stranické prostředky" # todo: NEW TRANSLATION
 NKO_naval_allocate_party_funds_desc: "Potají přesměrovat stranické příspěvky do námořního programu. Spolehlivý přísun zdrojů za cenu politického kapitálu." # todo: NEW TRANSLATION
 NKO_naval_mobilize_nampo_shipyards: "Mobilizovat loděnice v Nampchu" # todo: NEW TRANSLATION
 NKO_naval_mobilize_nampo_shipyards_desc: "Na tři měsíce přesčasové výroby přidělit civilní továrnu v Nampchu. Loděnice nás po dokončení práce odmění dodatečnou dávkou bodů budování." # todo: NEW TRANSLATION
 NKO_naval_juche_drive: "Zahájit námořní tažení čučche" # todo: NEW TRANSLATION
 NKO_naval_juche_drive_desc: "Národní mobilizace pro flotilu. Loděnice pojedou půl roku naplno, zatímco civilní hospodářství ponese náklady. Program najednou získá velké množství bodů. K jeho udržení je zapotřebí stabilní domácí fronta." # todo: NEW TRANSLATION
 NKO_naval_invest_submarine: "Investovat do ponorkových sil" # todo: NEW TRANSLATION
 NKO_naval_invest_submarine_desc: "Utraťte jeden bod budování námořnictva a posuňte stupeň ponorek. Posádky získají nové zkušenosti, jak budou konstrukce dospívat. Překročení postupu §Y25§!, §Y50§!, §Y75§! a §Y100§! odemkne další stupeň modernizace ponorek." # todo: NEW TRANSLATION
 NKO_naval_invest_missile_boat: "Investovat do flotil raketových člunů" # todo: NEW TRANSLATION
 NKO_naval_invest_missile_boat_desc: "Utraťte jeden bod budování námořnictva a rozšiřte program raketových člunů. Každý cyklus modernizace zlepší naše údery v pobřežních vodách. Překročení postupu §Y25§!, §Y50§!, §Y75§! a §Y100§! odemkne další stupeň raketových člunů." # todo: NEW TRANSLATION
 NKO_naval_invest_coastal_defense: "Investovat do sítě pobřežní obrany" # todo: NEW TRANSLATION
 NKO_naval_invest_coastal_defense_desc: "Utraťte jeden bod budování námořnictva a zodolněte pobřeží. Posádky bunkrů a pobřežní baterie získají zkušenosti. Překročení postupu §Y25§!, §Y50§!, §Y75§! a §Y100§! odemkne další stupeň pobřežní obrany." # todo: NEW TRANSLATION
 NKO_naval_invest_specops: "Investovat do námořních speciálních operací" # todo: NEW TRANSLATION
 NKO_naval_invest_specops_desc: "Utraťte jeden bod budování námořnictva a vycvičte žabí muže Průzkumného úřadu a námořní pěchotu. Speciální síly zdokonalí své obojživelné schopnosti. Překročení postupu §Y25§!, §Y50§!, §Y75§! a §Y100§! odemkne další stupeň námořních speciálních operací." # todo: NEW TRANSLATION
 NKO_naval_capstone_complete: "Vytvořit pobřežní pás" # todo: NEW TRANSLATION
 NKO_naval_capstone_complete_desc: "Všechny čtyři stupně dosáhly své konečné úrovně. Vyhlaste námořní doktrínu songun za dokončenou a udělte zemi trvalý bonus." # todo: NEW TRANSLATION
 NKO_naval_modern_fleet_milestone: "Uvést moderní flotilu do služby" # todo: NEW TRANSLATION
 NKO_naval_modern_fleet_milestone_desc: "Útočná ponorka třídy Sinpo i torpédoborec třídy Čche Hjon dosáhly připravenosti k výrobě. Zařaďte prvních pět trupů od každého typu do Korejského lidového námořnictva, založte vyhrazené výrobní linky a udělte prostředky oběma námořním úřadům." # todo: NEW TRANSLATION
 NKO_songun_navy_capstone: "Námořní doktrína songun" # todo: NEW TRANSLATION
 NKO_songun_navy_capstone_desc: "Roky cíleného budování vytvořily soudržné asymetrické námořnictvo. Ponorky s dlouhým dosahem, roje raketových člunů, vrstvená pobřežní obrana a elitní námořní speciální síly nyní působí podle jediné doktríny." # todo: NEW TRANSLATION
 NKO_sub_drill_momentum: "Tempo výcviku ponorkových sil" # todo: NEW TRANSLATION
 NKO_sub_drill_momentum_desc: "Nedávná cvičení pozvedla morálku a procedurální disciplínu napříč tichou službou." # todo: NEW TRANSLATION
 NKO_mb_swarm_momentum: "Tempo roje raketových člunů" # todo: NEW TRANSLATION
 NKO_mb_swarm_momentum_desc: "Flotily se vezou na vlně sebevědomí po svých posledních cvičeních." # todo: NEW TRANSLATION
 NKO_cd_bunker_momentum: "Vysoká pohotovost pásu bunkrů" # todo: NEW TRANSLATION
 NKO_cd_bunker_momentum_desc: "Pobřežní posádky jsou ve zvýšené pohotovosti; ženisté urychlili opevňovací práce na dvojnásobné tempo." # todo: NEW TRANSLATION
 NKO_so_recon_momentum: "Operační tempo průzkumného úřadu" # todo: NEW TRANSLATION
 NKO_so_recon_momentum_desc: "Průzkumný úřad pracuje naplno, týmy žabích mužů a kádry námořních speciálních sil se neustále střídají." # todo: NEW TRANSLATION
 NKO_naval_strategy_momentum: "Tempo námořní strategie" # todo: NEW TRANSLATION
 NKO_naval_strategy_momentum_desc: "Jednotná strategická doktrína povzbudila každý námořní úřad. Výzkum, výcvik i organizace flotily těží z obnoveného smyslu pro účel." # todo: NEW TRANSLATION
 NKO_sub_tier_1: "Modernizace Sang-O" # todo: NEW TRANSLATION
 NKO_sub_tier_1_desc: "Modernizace a výcvik posádek napříč flotilou pobřežních ponorek Sang-O." # todo: NEW TRANSLATION
 NKO_sub_tier_2: "Program trpasličích ponorek Yono" # todo: NEW TRANSLATION
 NKO_sub_tier_2_desc: "Infiltrační ponorky třídy Yono a zdokonalená sonarová protiopatření rozšiřují náš dosah." # todo: NEW TRANSLATION
 NKO_sub_tier_3: "Generální oprava třídy Romeo" # todo: NEW TRANSLATION
 NKO_sub_tier_3_desc: "Trupy Romeo dostávají novou elektroniku, baterie a tišší pohon." # todo: NEW TRANSLATION
 NKO_sub_tier_4: "Program Sinpo SLBM" # todo: NEW TRANSLATION
 NKO_sub_tier_4_desc: "Ponorka třídy Sinpo nese střely rodiny Pukkuksong. Strategický dosah, skutečné odstrašení." # todo: NEW TRANSLATION
 NKO_mb_tier_1: "Modernizace Komar" # todo: NEW TRANSLATION
 NKO_mb_tier_1_desc: "Staré trupy Komar dostávají nová odpalovací zařízení a výkonnější motory." # todo: NEW TRANSLATION
 NKO_mb_tier_2: "Výroba Soju a Nongo" # todo: NEW TRANSLATION
 NKO_mb_tier_2_desc: "Domácí raketové čluny Soju a Nongo vstupují do služby v rostoucích počtech." # todo: NEW TRANSLATION
 NKO_mb_tier_3: "Integrace Kumsong-3 ASCM" # todo: NEW TRANSLATION
 NKO_mb_tier_3_desc: "Protilodní střely s plochou dráhou letu Kumsong-3 dávají našim flotilám věrohodnou schopnost úderu na dlouhou vzdálenost." # todo: NEW TRANSLATION
 NKO_mb_tier_4: "Doktrína vlčí smečky" # todo: NEW TRANSLATION
 NKO_mb_tier_4_desc: "Koordinovaná taktika roje: salvové odpaly, vrstvené elektronické rušení a klamné čluny." # todo: NEW TRANSLATION
 NKO_cd_tier_1: "Pás bunkrů" # todo: NEW TRANSLATION
 NKO_cd_tier_1_desc: "Souvislý řetězec zesílených bunkrů podél východního i západního pobřeží." # todo: NEW TRANSLATION
 NKO_cd_tier_2: "Mobilní pobřežní dělostřelectvo" # todo: NEW TRANSLATION
 NKO_cd_tier_2_desc: "Baterie na nákladních vozidlech se přesouvají mezi připravenými pozicemi, aby unikly palbě z protibaterií." # todo: NEW TRANSLATION
 NKO_cd_tier_3: "Opevněné výběžky" # todo: NEW TRANSLATION
 NKO_cd_tier_3_desc: "Strategické výběžky získávají hluboké tunely, zodolněné sklady a integrované radary." # todo: NEW TRANSLATION
 NKO_cd_tier_4: "Pobřežní protilodní střely" # todo: NEW TRANSLATION
 NKO_cd_tier_4_desc: "Mobilní odpalovací zařízení Kumsong upírají nepřátelským flotilám možnost přiblížit se k našemu pobřeží." # todo: NEW TRANSLATION
 NKO_so_tier_1: "Žabí muži průzkumného úřadu" # todo: NEW TRANSLATION
 NKO_so_tier_1_desc: "Týmy žabích mužů Generálního průzkumného úřadu rozšiřují výcvik i zásoby vybavení." # todo: NEW TRANSLATION
 NKO_so_tier_2: "Brigáda mořských odstřelovačů" # todo: NEW TRANSLATION
 NKO_so_tier_2_desc: "Specializovaná brigáda mořských odstřelovačů se zaměřuje na rychlé pobřežní nájezdy." # todo: NEW TRANSLATION
 NKO_so_tier_3: "Námořní lehká pěchota" # todo: NEW TRANSLATION
 NKO_so_tier_3_desc: "Prapory lehké pěchoty jsou reorganizovány s námořní složkou pro obojživelné operace." # todo: NEW TRANSLATION
 NKO_so_tier_4: "Námořní jednotky Storm Corps" # todo: NEW TRANSLATION
 NKO_so_tier_4_desc: "Jednotky Storm Corps dostávají trvalé námořní přidělení. Náš hrot kopí dosáhne na jakékoli pobřeží." # todo: NEW TRANSLATION
 nko_naval_buildup.1.t: "Námořní doktrína pro novou éru" # todo: NEW TRANSLATION
 nko_naval_buildup.1.d: "Generální štáb připravil dlouhodobý plán: čtyři souběžné stupně rozvíjené prostřednictvím nashromážděných bodů budování námořnictva. Tři rozhodnutí body generují a čtyři investiční rozhodnutí je utrácejí. Dosáhněte konečného stupně na každém stupni a vytvořte námořní doktrínu songun." # todo: NEW TRANSLATION
 nko_naval_buildup.1.a: "Program povedeme my." # todo: NEW TRANSLATION
 nko_naval_buildup.11.t: "Posádky Sang-O se činí" # todo: NEW TRANSLATION
 nko_naval_buildup.11.d: "Opravárenské doky odbavují nahromaděné trupy Sang-O. Posádky cvičí nepřetržitě a důvěra v tichou službu roste." # todo: NEW TRANSLATION
 nko_naval_buildup.11.a: "Vpřed." # todo: NEW TRANSLATION
 nko_naval_buildup.12.t: "Trpasličí ponorky Yono proklouzly sítí" # todo: NEW TRANSLATION
 nko_naval_buildup.12.d: "Infiltrační plavidla třídy Yono úspěšně cvičí proti našim pobřežním radarům a proklouzávají detekčními liniemi, které je měly zachytit." # todo: NEW TRANSLATION
 nko_naval_buildup.12.a: "Skutečná výhoda." # todo: NEW TRANSLATION
 nko_naval_buildup.13.t: "Modernizace Romeí přináší ovoce" # todo: NEW TRANSLATION
 nko_naval_buildup.13.d: "Modernizované čluny Romeo nyní hlídkují dále a tišeji, než jejich původní konstruktéři považovali za možné." # todo: NEW TRANSLATION
 nko_naval_buildup.13.a: "Výborně." # todo: NEW TRANSLATION
 nko_naval_buildup.14.t: "Sinpo se vynořuje" # todo: NEW TRANSLATION
 nko_naval_buildup.14.d: "Ponorka třídy Sinpo se vynořuje podle plánu, s instalovanými a otestovanými šachtami pro Pukguksong. Strategické odstrašení již není snem." # todo: NEW TRANSLATION
 nko_naval_buildup.14.a: "Sláva programu." # todo: NEW TRANSLATION
 nko_naval_buildup.21.t: "Modernizace Komarů dokončena" # todo: NEW TRANSLATION
 nko_naval_buildup.21.d: "Stárnoucí trupy Komar opouštějí doky s novými odpalovacími zařízeními, výkonnějšími motory a překvapivě odhodlanými posádkami." # todo: NEW TRANSLATION
 nko_naval_buildup.21.a: "Dobrý začátek." # todo: NEW TRANSLATION
 nko_naval_buildup.22.t: "Vznikají flotily Soju a Nongo" # todo: NEW TRANSLATION
 nko_naval_buildup.22.d: "Formují se první specializované flotily Soju a Nongo. Jsou rychlejší, štíhlejší a mnohem nebezpečnější než jejich předchůdci." # todo: NEW TRANSLATION
 nko_naval_buildup.22.a: "Pokračujte." # todo: NEW TRANSLATION
 nko_naval_buildup.23.t: "Kumsong-3 vyplouvá" # todo: NEW TRANSLATION
 nko_naval_buildup.23.d: "Protilodní střely Kumsong-3 dokončují poslední lodní zkoušky. Naše flotily nyní mohou udeřit na vzdálenost, kterou nepřátelé nedokážou snadno pokrýt." # todo: NEW TRANSLATION
 nko_naval_buildup.23.a: "Dosah prodloužen." # todo: NEW TRANSLATION
 nko_naval_buildup.24.t: "Přijata doktrína smečky" # todo: NEW TRANSLATION
 nko_naval_buildup.24.d: "Salvové odpaly, vrstvené rušení a klamné čluny: doktrína smečky je formálně přijata v celé flotile raketových člunů." # todo: NEW TRANSLATION
 nko_naval_buildup.24.a: "Smečka je připravena." # todo: NEW TRANSLATION
 nko_naval_buildup.31.t: "Pás bunkrů dokončen" # todo: NEW TRANSLATION
 nko_naval_buildup.31.d: "Souvislý řetěz zpevněných bunkrů nyní pokrývá obě pobřeží. Místní velitelé hlásí, že morálka posádek se znatelně zlepšila." # todo: NEW TRANSLATION
 nko_naval_buildup.31.a: "Udržet linii." # todo: NEW TRANSLATION
 nko_naval_buildup.32.t: "Rozmístěno mobilní pobřežní dělostřelectvo" # todo: NEW TRANSLATION
 nko_naval_buildup.32.d: "Baterie namontované na nákladních vozech procvičují přesuny po výstřelu, dokud nedokážou opustit palebné postavení dříve, než dorazí odvetné dělostřelecké granáty." # todo: NEW TRANSLATION
 nko_naval_buildup.32.a: "Disciplinovaná práce." # todo: NEW TRANSLATION
 nko_naval_buildup.33.t: "Opevněné výběžky" # todo: NEW TRANSLATION
 nko_naval_buildup.33.d: "Nejstrategičtější výběžky získávají hluboké tunely, zesílené sklady munice a integrované radary. Plánovači protivníka nyní čelí skutečně bráněnému pobřeží." # todo: NEW TRANSLATION
 nko_naval_buildup.33.a: "Železné pobřeží." # todo: NEW TRANSLATION
 nko_naval_buildup.34.t: "Pobřežní protilodní střely připraveny" # todo: NEW TRANSLATION
 nko_naval_buildup.34.d: "Mobilní baterie Kumsong zaujímají pobřežní pozice. Každý přístup k našim břehům bude draze zaplacen." # todo: NEW TRANSLATION
 nko_naval_buildup.34.a: "Jen ať přijdou." # todo: NEW TRANSLATION
 nko_naval_buildup.41.t: "Rozšířen výcvik potápěčů" # todo: NEW TRANSLATION
 nko_naval_buildup.41.d: "Průzkumný generální úřad tiše zdvojnásobuje nábor bojových potápěčů a sjednocuje jejich potápěčské vybavení." # todo: NEW TRANSLATION
 nko_naval_buildup.41.a: "Budujte kádr." # todo: NEW TRANSLATION
 nko_naval_buildup.42.t: "Ustavena brigáda mořských odstřelovačů" # todo: NEW TRANSLATION
 nko_naval_buildup.42.d: "Je formálně aktivována specializovaná brigáda mořských odstřelovačů. Její první cvičení proti simulovaným pobřežním cílům překonala očekávání." # todo: NEW TRANSLATION
 nko_naval_buildup.42.a: "Zostřeno." # todo: NEW TRANSLATION
 nko_naval_buildup.43.t: "Lehká pěchota míří na moře" # todo: NEW TRANSLATION
 nko_naval_buildup.43.d: "Vybrané prapory lehké pěchoty jsou reorganizovány s námořní složkou. Obojživelná doktrína se rozšiřuje za hranice hrstky specializovaných jednotek." # todo: NEW TRANSLATION
 nko_naval_buildup.43.a: "Přes jakékoli pobřeží." # todo: NEW TRANSLATION
 nko_naval_buildup.44.t: "Úderné sbory ovládají moře" # todo: NEW TRANSLATION
 nko_naval_buildup.44.d: "Jednotky úderných sborů získávají stálé námořní přidělení. Naše úderná špice je nyní skutečnou námořně-pozemní silou." # todo: NEW TRANSLATION
 nko_naval_buildup.44.a: "Udeřit kdekoli." # todo: NEW TRANSLATION
 nko_naval_buildup.51.t: "Námořní cvičení ve Wonsanu" # todo: NEW TRANSLATION
 nko_naval_buildup.51.d: "Čtvrtletní cvičení ponorkové flotily ve Wonsanu je naplánováno. Posádky čekají na rozkazy, než vyplují." # todo: NEW TRANSLATION
 nko_naval_buildup.51.a: "Tlačte tvrdě, ať se potí" # todo: NEW TRANSLATION
 nko_naval_buildup.51.b: "Stačí uměřené, běžné tempo" # todo: NEW TRANSLATION
 nko_naval_buildup.51.c: "Zrušit, paliva a náhradních dílů je málo" # todo: NEW TRANSLATION
 nko_naval_buildup.52.t: "Spatřeno cizí průzkumné plavidlo" # todo: NEW TRANSLATION
 nko_naval_buildup.52.d: "Pobřežní radar zachytil neoznačené plavidlo, které se zdržuje v našich nárokovaných vodách. Velitel pobřeží žádá o rozhodnutí." # todo: NEW TRANSLATION
 nko_naval_buildup.52.a: "Zachytit a vytlačit" # todo: NEW TRANSLATION
 nko_naval_buildup.52.b: "Sledovat, ale nezahajovat střet" # todo: NEW TRANSLATION
 nko_naval_buildup.52.c: "Stáhnout se, vyhnout se incidentu" # todo: NEW TRANSLATION
 nko_naval_buildup.53.t: "Krize kolem zběhnutí ponorkáře" # todo: NEW TRANSLATION
 nko_naval_buildup.53.d: "Mladší důstojník na palubě jedné z našich hlídkových ponorek zmizel během návštěvy přístavu. Průzkumný úřad žádá povolení jednat." # todo: NEW TRANSLATION
 nko_naval_buildup.53.a: "Vyslat úderné sbory, získat ho nebo zlikvidovat" # todo: NEW TRANSLATION
 nko_naval_buildup.53.b: "Pasivně sledovat, žádná operace" # todo: NEW TRANSLATION
 nko_naval_buildup.53.c: "Zamést hlášení pod koberec" # todo: NEW TRANSLATION
 nko_naval_buildup.54.t: "Loděnice Nampo překonaly kvótu" # todo: NEW TRANSLATION
 nko_naval_buildup.54.d: "Předáci v loděnicích Nampo hlásí měsíc s překročením kvóty. Pracovníci jsou povzbuzení, ale unavení." # todo: NEW TRANSLATION
 nko_naval_buildup.54.a: "Veřejně je odměnit mimořádným přídělem" # todo: NEW TRANSLATION
 nko_naval_buildup.54.b: "Požadovat víc, kvóta byla vždy nízká" # todo: NEW TRANSLATION
 nko_naval_buildup.56.t: "Zadrženo pašerácké plavidlo" # todo: NEW TRANSLATION
 nko_naval_buildup.56.d: "Pobřežní hlídka zabavila malé plavidlo převážející kontraband. Místní velitel se ptá, jak s kořistí naložit." # todo: NEW TRANSLATION
 nko_naval_buildup.56.a: "Ukázat ho v televizi, propagandistické vítězství" # todo: NEW TRANSLATION
 nko_naval_buildup.56.b: "Tiché zabavení, náklad zařadit do zásob" # todo: NEW TRANSLATION
 nko_naval_buildup.56.c: "Přijmout kapitánův úplatek a dívat se jinam" # todo: NEW TRANSLATION
 nko_naval_buildup.60.t: "Tichá služba kráčí vzpřímeně" # todo: NEW TRANSLATION
 nko_naval_buildup.60.d: "Sinpo a její sesterská plavidla se vracejí do přístavu s vítěznými praporci. Ponorkové síly Korejského lidového námořnictva dospěly. Věrohodná podmořská síla chrání vlast." # todo: NEW TRANSLATION
 nko_naval_buildup.60.a: "Hlubiny patří nám." # todo: NEW TRANSLATION
 nko_naval_buildup.61.t: "Vlci pobřeží" # todo: NEW TRANSLATION
 nko_naval_buildup.61.d: "Doktrína smečky je formálně přijata v každé flotile. Salvové odpaly, vrstvené elektronické protiopatření a klamné čluny. Naše pobřežní úderné síly fungují jako jediný organismus." # todo: NEW TRANSLATION
 nko_naval_buildup.61.a: "Vypusťte vlky." # todo: NEW TRANSLATION
 nko_naval_buildup.62.t: "Železné pobřeží" # todo: NEW TRANSLATION
 nko_naval_buildup.62.d: "Od Sinuiju po Wonsan je každý přístup zajištěn zpevněnými bunkry, mobilním dělostřelectvem a protilodními střelami odpalovanými z pobřeží. Žádná flotila se k našemu pobřeží nepřiblíží bez úhony." # todo: NEW TRANSLATION
 nko_naval_buildup.62.a: "Zeď stojí." # todo: NEW TRANSLATION
 nko_naval_buildup.63.t: "Úderné sbory na moře" # todo: NEW TRANSLATION
 nko_naval_buildup.63.d: "Jednotky úderných sborů zaujímají své místo v námořním pořadí bitvy. Průzkumný úřad, mořští odstřelovači, bojoví potápěči a námořní lehká pěchota nyní tvoří jedinou elitní údernou sílu schopnou zasáhnout jakékoli pobřeží." # todo: NEW TRANSLATION
 nko_naval_buildup.63.a: "Udeřit kdekoli." # todo: NEW TRANSLATION
 nko_naval_buildup.70.t: "Strategická doktrína pro moře" # todo: NEW TRANSLATION
 nko_naval_buildup.70.d: "Námořní úřad generálního štábu ratifikuje jednotnou doktrínu: vrstvené ponorkové síly, roje raketových člunů, opevněná pobřeží a námořní komanda spolupracující v souladu. Každá loděnice, základna a výcviková škola nyní táhne stejným směrem." # todo: NEW TRANSLATION
 nko_naval_buildup.70.a: "Všichni do programu." # todo: NEW TRANSLATION
 nko_naval_buildup.71.t: "První domácí torpédoborce opouštějí kotviště" # todo: NEW TRANSLATION
 nko_naval_buildup.71.d: "Loděnice Nampo a Wonsan spouštějí na vodu první domácí raketové torpédoborce po mnoha letech. Posádky zaplavují nové trupy a připravují je k nasazení. Hladinové loďstvo znovu ožívá." # todo: NEW TRANSLATION
 nko_naval_buildup.71.a: "Vyšlete je na moře." # todo: NEW TRANSLATION
 nko_naval_buildup.72.t: "Domácí ponorkové trupy nabývají tvar" # todo: NEW TRANSLATION
 nko_naval_buildup.72.d: "Ponorkové loděnice vyrábějí nové útočné čluny v napjatém termínu. Posádky vycvičené na starších trupech Sang-O a Romeo se přesouvají na nové platformy, čímž urychlují kvalifikaci." # todo: NEW TRANSLATION
 nko_naval_buildup.72.a: "Tiše do hlubiny." # todo: NEW TRANSLATION
 nko_naval_buildup.73.t: "Eskadry torpédoborců vypuštěny" # todo: NEW TRANSLATION
 nko_naval_buildup.73.d: "Plná eskadra torpédoborců, postavená a obsazená doma, je nasazena u Východního loďstva. Spolu s flotilami raketových člunů vycvičenými podle doktríny smečky se pořadí hladinových sil stává vážným odstrašením." # todo: NEW TRANSLATION
 nko_naval_buildup.73.a: "Nechte eskadry vyrazit." # todo: NEW TRANSLATION
 nko_naval_buildup.74.t: "Probouzí se moderní loďstvo" # todo: NEW TRANSLATION
 nko_naval_buildup.74.d: "Trup torpédoborce z roku 2005 a útočná ponorka třídy z roku 1995 vstupují společně do našich loděnic, pokřtěny jako §YTřída Choe Hyon§! a §YTřída Sinpo§!. Do skladů bylo dodáno po pěti kusech a v loděnicích Nampo a Wonsan již byly položeny specializované výrobní linky pro obě třídy   §HÚřad ponorek§! a §HÚřad hladinových lodí§! přebírají přímé velení.\n\nTento milník odemyká pozdní vlastnosti MIO v obou úřadech: §YZbraně od moře k zemi§!, §YModerní materiály§! a §YZdokonalena konstrukce ponorek§! u Ponorkového úřadu a §YOptimalizovaná výroba§! a §YTechnologie radaru s vysokým rozlišením§! u Úřadu hladinových lodí." # todo: NEW TRANSLATION
 nko_naval_buildup.74.a: "Začíná éra oceli." # todo: NEW TRANSLATION
 nko_naval_buildup.99.t: "Pchjongjangský mořský pás je zformován" # todo: NEW TRANSLATION
 nko_naval_buildup.99.d: "Po letech soustředěného úsilí dokončuje Korejské lidové námořnictvo Songunskou námořní doktrínu. Ponorky s dlouhým dosahem, roje raketových člunů, vrstvená pobřežní obrana a elitní námořní speciální síly působí jako jeden celek. Asymetrické loďstvo je skutečností." # todo: NEW TRANSLATION
 nko_naval_buildup.99.a: "Mořský pás je zformován." # todo: NEW TRANSLATION
 nko_naval_buildup.99.b: "Pchjongjangské námořnictvo se modernizuje." # todo: NEW TRANSLATION
