 NKO_spa_umbrella: "Nejvyšší lidové shromáždění" # todo: NEW TRANSLATION
 NKO_spa_umbrella_desc: "Nejvyšší lidové shromáždění vám umožňuje mít současně aktivní §Ynejvýše dva mandáty produktivity§!. Každý mandát pozastaví jednu z osmi chronických poruch centrálního plánování na §Y365 dní§! a uplatní vlastní bonus; po jeho skončení se uvolní místo pro další. Trvalé postihy lze odstranit dokončením odpovídajících zaměření." # todo: NEW TRANSLATION
 NKO_spa_debuff_industry: "Průmyslová stagnace" # todo: NEW TRANSLATION
 NKO_spa_debuff_industry_desc: "Desetiletí centrálního přidělování zanechala továrny bez vstupů a kvalifikované pracovní síly. Výstavba se vleče." # todo: NEW TRANSLATION
 NKO_spa_debuff_production: "Úpadek výrobních linek" # todo: NEW TRANSLATION
 NKO_spa_debuff_production_desc: "Nástroje jsou opotřebované, dodavatelské řetězce improvizované a kontrola kvality závisí na tom, jakou náladu má toho rána předák." # todo: NEW TRANSLATION
 NKO_spa_debuff_military: "Prázdná síla" # todo: NEW TRANSLATION
 NKO_spa_debuff_military_desc: "Korejská lidová armáda má na papíře miliony vojáků. Ve skutečnosti je výcvik pouhou fraškou a morálka křehká." # todo: NEW TRANSLATION
 NKO_spa_debuff_economy: "Hromadění zdrojů" # todo: NEW TRANSLATION
 NKO_spa_debuff_economy_desc: "Provinční kádry si ukusují z toho, co prochází jejich okresy. Centrálně přidělované zdroje přicházejí pozdě, v nedostatečném množství, nebo vůbec." # todo: NEW TRANSLATION
 NKO_spa_debuff_research: "Výzkumná stagnace" # todo: NEW TRANSLATION
 NKO_spa_debuff_research_desc: "Sankce, odliv mozků a špatné laboratorní vybavení výrazně zpomalují i základní výzkum." # todo: NEW TRANSLATION
 NKO_spa_debuff_agriculture: "Samozásobitelské zemědělství" # todo: NEW TRANSLATION
 NKO_spa_debuff_agriculture_desc: "Družstevní farmy produkují sotva dost na uživení vlastních vesnic. Města trpí nedostatkem." # todo: NEW TRANSLATION
 NKO_spa_debuff_foreign: "Diplomatická izolace" # todo: NEW TRANSLATION
 NKO_spa_debuff_foreign_desc: "Sankce a status vyvrhele znamenají, že každé diplomatické gesto stojí více, než by mělo, a přináší méně, než by mohlo." # todo: NEW TRANSLATION
 NKO_spa_debuff_construction: "Úzké hrdlo výstavby" # todo: NEW TRANSLATION
 NKO_spa_debuff_construction_desc: "Nejhůře postiženým sektorem je obranné inženýrství. Pevnosti se rozpadají dříve, než jsou dokončeny, radarové stožáry se staví napůl zapojené, námořní základny zůstávají napůl vybagrované a letiště jsou rozbředlá kvůli špatné údržbě." # todo: NEW TRANSLATION
 NKO_spa_resolution_industry: "Průmyslové zrychlení" # todo: NEW TRANSLATION
 NKO_spa_resolution_industry_desc: "Shromáždění vydává závazný průmyslový pokyn. Civilní továrny porostou rychleji a vojenské komplexy je budou následovat." # todo: NEW TRANSLATION
 NKO_spa_resolution_production: "Mandát výroby vybavení" # todo: NEW TRANSLATION
 NKO_spa_resolution_production_desc: "Výrobní linky přejdou do plánovaného režimu zvýšeného výkonu. Limity efektivity se zvýší a nové vybavení se začne vyrábět rychleji." # todo: NEW TRANSLATION
 NKO_spa_resolution_military: "Rezoluce songun" # todo: NEW TRANSLATION
 NKO_spa_resolution_military_desc: "Vojenská první politika je opět na pořadu dne. Výcvikové rozvrhy se zpřísní, útočná doktrína se zostří a strana znovu potvrdí své priority." # todo: NEW TRANSLATION
 NKO_spa_resolution_economy: "Čučche a soběstačnost" # todo: NEW TRANSLATION
 NKO_spa_resolution_economy_desc: "Tažení za soběstačnost vytěží každý gram z půdy i dolů. Místní zdroje začnou proudit." # todo: NEW TRANSLATION
 NKO_spa_resolution_research: "Výzkumné tažení" # todo: NEW TRANSLATION
 NKO_spa_resolution_research_desc: "Všechny ústavy pracují přesčas a utajované laboratoře jedou nepřetržitě. Prolomení sankcí a odlivu mozků je nejdražším mandátem, který může shromáždění schválit." # todo: NEW TRANSLATION
 NKO_spa_resolution_agriculture: "Zemědělské tažení" # todo: NEW TRANSLATION
 NKO_spa_resolution_agriculture_desc: "Družstevní farmy překonávají plánované kvóty. Nedostatek civilního zboží polevuje a továrny zaznamenají mírný nárůst produkce." # todo: NEW TRANSLATION
 NKO_spa_resolution_foreign: "Směrnice zahraniční politiky" # todo: NEW TRANSLATION
 NKO_spa_resolution_foreign_desc: "Vyslanci ministerstva zahraničí se rozcházejí do všech stran. Zlepšování vztahů je levnější a obchodní partneři se na nás dívají o něco vlídněji." # todo: NEW TRANSLATION
 NKO_spa_resolution_construction: "Stavební prapor" # todo: NEW TRANSLATION
 NKO_spa_resolution_construction_desc: "Masově mobilizované vojenské ženijní brigády sestupují na každé obranné stanoviště. Pevnosti, radary, pozice protivzdušné obrany krátkého dosahu, letiště, námořní základny, palivová sila, železnice i zásobovací uzly rostou nebývalým tempem." # todo: NEW TRANSLATION
 NKO_spa.0.t: "Nejvyšší lidové shromáždění zasedá" # todo: NEW TRANSLATION
 NKO_spa.0.d: "Soudruhu generální tajemníku, vláda připravila program. Shromáždění se sešlo. Osm chronických problémů vyžaduje pozornost; kdykoli můžeme mít §Ylibovolné dva§! z nich pod závazným mandátem.\n\nKaždý mandát trvá §Y365 dní§!; po skončení jednoho se uvolní místo pro další." # todo: NEW TRANSLATION
 NKO_spa.0.a: "Svolat shromáždění." # todo: NEW TRANSLATION
 NKO_spa.20.t: "Stachanovští hrdinové" # todo: NEW TRANSLATION
 NKO_spa.20.d: "Pracovníci v průmyslovém pásu Hwanghae v prvních týdnech nové směrnice rozbili své kvóty. Jejich portréty již visí po celé zemi a vedoucí hlásí nárůst kapacity, který bude okamžitě využit." # todo: NEW TRANSLATION
 NKO_spa.20.a: "Odměňte hrdiny." # todo: NEW TRANSLATION
 NKO_spa.21.t: "Inovace v nástrojářství" # todo: NEW TRANSLATION
 NKO_spa.21.d: "Inženýři v Pchjongjangském závodě těžkého strojírenství vyvinuli nový způsob upínání, který zdvojnásobuje průchodnost linek obrněných vozidel. Z výrobní linky sjede mimořádná série 75 nejnovějších dostupných podvozků: tanků, bojových vozidel pěchoty, obrněných transportérů, průzkumných vozidel nebo samohybných děl, podle toho, která linka byla daný týden nasazena." # todo: NEW TRANSLATION
 NKO_spa.21.a: "Rozšiřte tuto techniku." # todo: NEW TRANSLATION
 NKO_spa.22.t: "Hrdina republiky" # todo: NEW TRANSLATION
 NKO_spa.22.d: "Příkladné vedení mladšího důstojníka během cvičení Songun upoutalo pozornost generálního štábu. Záložníci se hrnou do náborových kanceláří, inspirováni jeho příkladem." # todo: NEW TRANSLATION
 NKO_spa.22.a: "Povýšit a vyznamenat." # todo: NEW TRANSLATION
 NKO_spa.23.t: "Objeveno naleziště" # todo: NEW TRANSLATION
 NKO_spa.23.d: "Průzkumníci rozptýlení po severních horách identifikovali dosud neznámou žílu. Počáteční analýzy určí, jakou strategickou surovinu naleziště poskytuje. Státní úřad pro zdroje povolil okamžité zahájení těžby." # todo: NEW TRANSLATION
 NKO_spa.23.a: "Zahájit těžbu." # todo: NEW TRANSLATION
 NKO_spa.24.t: "Zběhnutí zahraničního vědce" # todo: NEW TRANSLATION
 NKO_spa.24.d: "Emigrantský inženýr pronikl přes sankční kontroly do výzkumného střediska KLDR. Jeho poznatky urychlují jeden z prioritních programů Státní akademie." # todo: NEW TRANSLATION
 NKO_spa.24.a: "Přivítejte soudruha." # todo: NEW TRANSLATION
 NKO_spa.25.t: "Bohatá sklizeň" # todo: NEW TRANSLATION
 NKO_spa.25.d: "Družstevní farmy v Severním Hamgjongu hlásí výnosy výrazně nad kvótou. Obilné rezervy rostou; venkovské náborové kanceláře se plní mladými zemědělci hledajícími práci v armádě." # todo: NEW TRANSLATION
 NKO_spa.25.a: "Rozdělte přebytek." # todo: NEW TRANSLATION
 NKO_spa.26.t: "Diplomatický triumf" # todo: NEW TRANSLATION
 NKO_spa.26.d: "Vyslanci ministerstva zahraničí proměnili novou směrnici v tiché diplomatické vítězství – tajný ústupek od významného partnera, který přináší tvrdou měnu." # todo: NEW TRANSLATION
 NKO_spa.26.a: "Využít zisk." # todo: NEW TRANSLATION
 NKO_spa.27.t: "Stavební předvoj" # todo: NEW TRANSLATION
 NKO_spa.27.d: "Dobrovolnické stavební prapory překonaly všechny prognózy. Kabinet s volnou kapacitou nabízí práci civilnímu projektu, který nejvíce zaostává za harmonogramem. Pokud pracovní síla nebude k dispozici, lze ji místo toho zpeněžit za tvrdou měnu." # todo: NEW TRANSLATION
 NKO_spa.27.factory_take: "Postavit civilní továrnu." # todo: NEW TRANSLATION
 NKO_spa.27.factory_cash: "Zpeněžit pracovní sílu. (§Y+0.5§! pokladna)" # todo: NEW TRANSLATION
 NKO_spa.27.offices_take: "Postavit kancelářskou budovu." # todo: NEW TRANSLATION
 NKO_spa.27.offices_cash: "Zpeněžit pracovní sílu. (§Y+0.75§! pokladna)" # todo: NEW TRANSLATION
 NKO_spa.27.refinery_take: "Postavit syntetickou rafinerii." # todo: NEW TRANSLATION
 NKO_spa.27.refinery_cash: "Zpeněžit pracovní sílu. (§Y+0.45§! pokladna)" # todo: NEW TRANSLATION
 NKO_spa.27.agri_take: "Postavit zemědělský okrsek." # todo: NEW TRANSLATION
 NKO_spa.27.agri_cash: "Zpeněžit pracovní sílu. (§Y+0.45§! pokladna)" # todo: NEW TRANSLATION
 NKO_spa.30.t: "Začíná pětiletý plán" # todo: NEW TRANSLATION
 NKO_spa.30.d: "U každé tovární brány rozkvétají transparenty. Shromáždění rozhodlo, že následujících 365 dní bude zmenšenou verzí pětiletého plánu s konkrétními výrobními kvótami pro každý průmyslový pás." # todo: NEW TRANSLATION
 NKO_spa.30.a: "Uvést plán do pohybu." # todo: NEW TRANSLATION
 NKO_spa.31.t: "Kvóty splněny před termínem" # todo: NEW TRANSLATION
 NKO_spa.31.d: "V polovině směrnice hlásí továrny podél Tedongu betonování a odlévání oceli výrazně nad plánem. Dělnické brigády soutěží o pocty." # todo: NEW TRANSLATION
 NKO_spa.31.a: "Odměnit vedoucí brigády." # todo: NEW TRANSLATION
 NKO_spa.32.t: "Stanoveny průmyslové rekordy" # todo: NEW TRANSLATION
 NKO_spa.32.d: "Směrnice končí triumfálním shromážděním na náměstí Kim Ir-sena. Do výrobní kapacity republiky byly přidány nové průmyslové sloty a prestiž strany prudce vzrostla." # todo: NEW TRANSLATION
 NKO_spa.32.a: "Oslavit úspěch." # todo: NEW TRANSLATION
 NKO_spa.33.t: "Nové nástroje dorazily" # todo: NEW TRANSLATION
 NKO_spa.33.d: "Náhradní nástroje dorazily do závodů na výrobu vybavení prostřednictvím šedého trhu. Mistři výroby přeškolují dílny podle nových specifikací." # todo: NEW TRANSLATION
 NKO_spa.33.a: "Zaveďte nové nástroje." # todo: NEW TRANSLATION
 NKO_spa.34.t: "Výrobní linky hučí" # todo: NEW TRANSLATION
 NKO_spa.34.d: "Výroba v pásmech závodů na vybavení v Pchjongjangu a Hamhungu je nejplynulejší za poslední desetiletí. Počet vad klesá a kvalita zpracování roste." # todo: NEW TRANSLATION
 NKO_spa.34.a: "Usilujte o další zdokonalení." # todo: NEW TRANSLATION
 NKO_spa.35.t: "Vítězství kontroly kvality" # todo: NEW TRANSLATION
 NKO_spa.35.d: "Mandát výroby vybavení končí státní inspekcí, která zjistí, že ukazatele kvality dosáhly nejvyšší úrovně v živé paměti. Zásobovací důstojníci KLA jsou spokojeni." # todo: NEW TRANSLATION
 NKO_spa.35.a: "Zaznamenejte nové standardy." # todo: NEW TRANSLATION
 NKO_spa.36.t: "Výcvik se zintenzivňuje" # todo: NEW TRANSLATION
 NKO_spa.36.d: "Songun je v plném proudu. Napříč všemi sbory se tempo výcviku zdvojnásobuje. Cvičení s ostrou střelbou, která byla po léta pozastavena, jsou obnovena." # todo: NEW TRANSLATION
 NKO_spa.36.a: "Tlačte na vojáky ještě více." # todo: NEW TRANSLATION
 NKO_spa.37.t: "Důstojnický sbor vyniká" # todo: NEW TRANSLATION
 NKO_spa.37.d: "Nová generace důstojníků na úrovni rot a praporů dospěla pod zesíleným výcvikovým režimem. Povýšení se šíří velitelským řetězcem." # todo: NEW TRANSLATION
 NKO_spa.37.a: "Odměňujte a povyšujte." # todo: NEW TRANSLATION
 NKO_spa.38.t: "Songun vítězí" # todo: NEW TRANSLATION
 NKO_spa.38.d: "Rezoluce Songun končí přehlídkou Velkého vítězství v Pchjongjangu. Povolání záložníků doplnilo stavy; KLA je nejsilnější za poslední roky." # todo: NEW TRANSLATION
 NKO_spa.38.a: "Pochodujte v sevřeném útvaru." # todo: NEW TRANSLATION
 NKO_spa.39.t: "Začínají průzkumy nerostů" # todo: NEW TRANSLATION
 NKO_spa.39.d: "Geologické průzkumné týmy se rozmisťují po severních horách. Staré mapy ze sovětské éry jsou oprášeny a aktualizovány moderními přístroji." # todo: NEW TRANSLATION
 NKO_spa.39.a: "Povolte průzkumy." # todo: NEW TRANSLATION
 NKO_spa.40.t: "Těžba roste" # todo: NEW TRANSLATION
 NKO_spa.40.d: "Nové průzkumy nasměrovaly horníky k žilám s vyšší jakostí. Těžba uhlí, magnezitu a vzácných zemin prudce vzrostla." # todo: NEW TRANSLATION
 NKO_spa.40.a: "Využijte této výhody." # todo: NEW TRANSLATION
 NKO_spa.41.t: "Dosažena soběstačnost" # todo: NEW TRANSLATION
 NKO_spa.41.d: "Mandát čučcheho soběstačnosti končí doplněním devizových rezerv díky exportním prodejům. Soudruhu generální tajemníku, republika stojí vzpřímeně." # todo: NEW TRANSLATION
 NKO_spa.41.a: "Uložte rezervy." # todo: NEW TRANSLATION
 NKO_spa.42.t: "Dveře laboratoří se otevírají" # todo: NEW TRANSLATION
 NKO_spa.42.d: "Státní akademie věd dostává rozkaz: každý prioritní program je odemčen a každý tajný spis je přístupný. Výzkumníci, kteří na povolení čekali celé roky, jsou přes noc zasvěceni do tajemství." # todo: NEW TRANSLATION
 NKO_spa.42.a: "Povolte priority." # todo: NEW TRANSLATION
 NKO_spa.43.t: "Urychlené programy přinášejí ovoce" # todo: NEW TRANSLATION
 NKO_spa.43.d: "Několik dlouho stagnujících programů napříč Státní akademií dosahuje v rychlém sledu průlomů. Generální štáb je informován o tom, který obor tentokrát překonal svůj dosavadní stav." # todo: NEW TRANSLATION
 NKO_spa.43.a: "Informujte Generální štáb." # todo: NEW TRANSLATION
 NKO_spa.44.t: "Dohánění zpoždění" # todo: NEW TRANSLATION
 NKO_spa.44.d: "Výzkumný rozmach končí tím, že KLDR je blíže technologické špičce než kdykoli od 70. let. Strana oslavuje tiché vítězství." # todo: NEW TRANSLATION
 NKO_spa.44.a: "Využijte nové výhody." # todo: NEW TRANSLATION
 NKO_spa.45.t: "Začíná jarní setí" # todo: NEW TRANSLATION
 NKO_spa.45.d: "Družstevní farmy po celé zemi se mobilizují na intenzivní období setí. Dobrovolnické brigády z měst posilují venkovskou pracovní sílu." # todo: NEW TRANSLATION
 NKO_spa.45.a: "Mobilizujte brigády." # todo: NEW TRANSLATION
 NKO_spa.46.t: "Letní péče" # todo: NEW TRANSLATION
 NKO_spa.46.d: "Kontroly uprostřed sezóny ukazují, že pole jsou v lepším stavu než po mnoho let. Zavlažovací kanály proudí; zásoby pesticidů dorazily z Číny." # todo: NEW TRANSLATION
 NKO_spa.46.a: "Udržujte úsilí." # todo: NEW TRANSLATION
 NKO_spa.47.t: "Bohatá sklizeň" # todo: NEW TRANSLATION
 NKO_spa.47.d: "Výnosy dosahují o 20 % více, než stanovoval plán. Obilné rezervy se zvětšují; poprvé po letech dostanou některé okresy plné příděly." # todo: NEW TRANSLATION
 NKO_spa.47.a: "Rozdělte přebytek." # todo: NEW TRANSLATION
 NKO_spa.48.t: "Diplomatické nabídky" # todo: NEW TRANSLATION
 NKO_spa.48.d: "Delegace KLDR jsou tiše vyslány do přátelských hlavních měst s výhodnými podmínkami a diskrétními žádostmi: Peking, Moskva, Teherán, Damašek." # todo: NEW TRANSLATION
 NKO_spa.48.a: "Pošlete vyslance." # todo: NEW TRANSLATION
 NKO_spa.49.t: "Tiché zadní kanály" # todo: NEW TRANSLATION
 NKO_spa.49.d: "Několik delegací se vrací s tajnými dohodami: společné podniky kryté schránkovými firmami, půjčky na infrastrukturu a tiché majetkové podíly od sympatizujících zahraničních partnerů. Vymáhání sankcí bylo o něco méně přísné než obvykle." # todo: NEW TRANSLATION
 NKO_spa.49.a: "Přijměte dodávky." # todo: NEW TRANSLATION
 NKO_spa.50.t: "Obchodní ústupky" # todo: NEW TRANSLATION
 NKO_spa.50.d: "Směrnice zahraniční politiky končí souborem nových dohod, které výrazně zlepšují příliv zahraničního kapitálu. Investiční závazky jsou podepsány na příští desetiletí." # todo: NEW TRANSLATION
 NKO_spa.50.a: "Podepište dohody." # todo: NEW TRANSLATION
 NKO_spa.51.t: "Stavební předvoj se mobilizuje" # todo: NEW TRANSLATION
 NKO_spa.51.d: "Mandát stavebního praporu je neočekávaným ziskem pro kteroukoli vnitřní frakci, které se kabinet rozhodne připsat zásluhy. Strana může politický zisk nasměrovat k frakci, jejíž spolupráci potřebuje více než spolupráci ostatních." # todo: NEW TRANSLATION
 NKO_spa.51.military: "Připište zásluhy §Yarmádě§!. (§G+15§! obliby)" # todo: NEW TRANSLATION
 NKO_spa.51.cadres: "Připište zásluhy §Ykomunistickým kádrům§!. (§G+15§! obliby)" # todo: NEW TRANSLATION
 NKO_spa.51.donju: "Připište zásluhy §Ydonju§!. (§G+15§! obliby)" # todo: NEW TRANSLATION
 NKO_spa.51.farmers: "Připište zásluhy §Yzemědělcům§!. (§G+15§! obliby)" # todo: NEW TRANSLATION
 NKO_spa.51.labour: "Připište zásluhy §Yodborům§!. (§G+15§! obliby)" # todo: NEW TRANSLATION
 NKO_spa.51.none: "Přivlastněte si politické zásluhy. (§G+25 PP§!)" # todo: NEW TRANSLATION
 NKO_spa.52.t: "Staveniště po celé republice" # todo: NEW TRANSLATION
 NKO_spa.52.d: "Ve všech provinciích probíhá výstavba. Silnice jsou upravovány, železniční odbočky svařovány a elektrické vedení znovu natahováno. Jde o nenápadnou infrastrukturní práci, jejíž výsledky se budou po desetiletí kumulovat." # todo: NEW TRANSLATION
 NKO_spa.52.a: "Dodržujte harmonogram." # todo: NEW TRANSLATION
 NKO_spa.53.t: "Projekty dokončeny" # todo: NEW TRANSLATION
 NKO_spa.53.d: "Mandát stavebního praporu končí slavnostním přestřižením pásek, vysílaným po celé republice. Strana sklízí politický zisk; obyvatelstvo je klidnější; státní pokladna získává malý neočekávaný příjem z přebytků projektů." # todo: NEW TRANSLATION
 NKO_spa.53.a: "Přestřihněte pásky." # todo: NEW TRANSLATION
