 NKO_arduous_march_desc: "§RHladomor v Severní Koreji§! byl obdobím masového hladovění spolu s všeobecnou hospodářskou krizí, které v Severní Koreji trvalo od roku 1994 a je známé také jako „namáhavý pochod“." # todo: NEW TRANSLATION
