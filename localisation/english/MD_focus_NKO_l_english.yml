 arduous_march_modifiers_desc: "Náročný pochod si vybral vysokou cenu pro naši zemi. Abychom zajistili budoucnost našeho lidu, musíme zavedd strategická opatření k překonání tohoto období těžkostí a vést naši zemi k prosperitě. To zahrnuje zvyšování zemědělské produkce, zajištění humanitární pomoci a reformu našich vnitřní politiky, aby byla zajištěna stabilita a růst." # todo: NEW TRANSLATION
