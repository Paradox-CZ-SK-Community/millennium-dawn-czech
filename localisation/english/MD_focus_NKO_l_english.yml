 korea_russia.16.d: "Severokorejská vláda chce uzavřít obchodní dohodu s námi a zaměřuje se na rozšíření spolupráce s naší zemí, možná stojí za to být skeptický ohledně toho, vzhledem k tomu, jaká Severní Korea je, nebo možná ne." # todo: NEW TRANSLATION
 korea_russia.16.a: "Souhlasíme" # todo: NEW TRANSLATION
 korea_russia.16.b: "Ne" # todo: NEW TRANSLATION
 korea_russia.17.t: "Obchodní dohoda s [FROM.GetName]" # todo: NEW TRANSLATION
 korea_russia.17.d: "Jejich vláda souhlasila s rozšířením obchodu s námi a se zavedením nových ujednání, která jsme jim navrhli k podpisu. Náš boj proti vlivu sankcí pokračuje!" # todo: NEW TRANSLATION
 korea_russia.17.a: "Dobré" # todo: NEW TRANSLATION
 korea_russia.18.t: "Obchodní dohoda s [FROM.GetName]" # todo: NEW TRANSLATION
 korea_russia.18.d: "Jejich vláda odmítla rozšířit obrat obchodu mezi zeměmi a v zásadě byla skeptická ohledně rozšíření spolupráce s námi v jakékoli oblasti." # todo: NEW TRANSLATION
 korea_russia.18.a: "Smutné" # todo: NEW TRANSLATION
 korea_russia.19.t: "Severní Korea navrhuje společný projekt" # todo: NEW TRANSLATION
 korea_russia.19.d: "Severokorejská vláda má zájem o náš vojenský letecký průmysl a chce vytvořit společný projekt na vývoj severokorejského stíhače pro potřeby její armády. Můžeme jim s tím pomoct, ale na oplátku významně posílíme náš vliv na jejich zemi." # todo: NEW TRANSLATION
 korea_russia.19.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 korea_russia.19.b: "Ne" # todo: NEW TRANSLATION
 korea_russia.20.t: "Společný projekt letadel se Ruskem" # todo: NEW TRANSLATION
 korea_russia.20.d: "Ruská vláda souhlasila se společným projektem na výrobu našeho vlastního stíhače, nyní bude naše letecká flotila mít větší sílu!" # todo: NEW TRANSLATION
 korea_russia.20.a: "Hurá!" # todo: NEW TRANSLATION
 korea_russia.21.t: "Rusko najalo naše dělníky" # todo: NEW TRANSLATION
 korea_russia.21.d: "S Ruskem jsme podepsali dohodu o najímání našich dělníků ve velkém počtu, aby pomohli při stavebních pracích. Podmínky jsou pro nás velmi příznivé, protože ruská strana platí štědré mzdy." # todo: NEW TRANSLATION
 korea_russia.21.a: "Dobré" # todo: NEW TRANSLATION
 korea_russia.22.t: "Vojenská cvičení se Severní Korejí" # todo: NEW TRANSLATION
 korea_russia.22.d: "Severokorejský generální štáb navrhuje uspořádat společná cvičení ozbrojených sil našich zemí, aby ukázal sílu našich armád a otestoval spolupráci našich ozbrojených sil." # todo: NEW TRANSLATION
 korea_russia.22.a: "To je skvělý nápad" # todo: NEW TRANSLATION
 korea_russia.22.b: "Ne" # todo: NEW TRANSLATION
 korea_russia.23.t: "Vojenská cvičení se Ruskem" # todo: NEW TRANSLATION
 korea_russia.23.d: "Ruský Generální štáb souhlasil s uspořádáním společných cvičení ozbrojených sil našich zemí." # todo: NEW TRANSLATION
 korea_russia.23.a: "Skvělé!" # todo: NEW TRANSLATION
 korea_russia.24.t: "Vojenská cvičení se Ruskem" # todo: NEW TRANSLATION
 korea_russia.24.d: "Ruský Generální štáb odmítl uspořádat společná cvičení ozbrojených sil našich zemí." # todo: NEW TRANSLATION
 korea_russia.24.a: "Smutné" # todo: NEW TRANSLATION
 korea_russia_news.1.t: "Aliance mezi [NKO.GetName] a [SOV.GetName]" # todo: NEW TRANSLATION
 korea_russia_news.1.d: "Dnes byla mezi [NKO.GetName] a [SOV.GetName] podepsána Smlouva o komplexním strategickém partnerství. Tato smlouva znamená ekonomickou, politickou a vojenskou pomoc mezi signatáři. Nyní jsou obě země blíže než kdy předtím." # todo: NEW TRANSLATION
 korea_russia_news.1.a: "Ať se nám bojí!" # todo: NEW TRANSLATION
 korea_russia_news.1.b: "Najednou" # todo: NEW TRANSLATION
