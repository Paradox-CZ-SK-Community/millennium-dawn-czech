 korea_china.2.d: "Čínská vláda souhlasila se společným projektem na výrobu našeho vlastního stíhače, nyní bude naše letecká flotila mít větší sílu!" # todo: NEW TRANSLATION
 korea_china.2.a: "Dobré" # todo: NEW TRANSLATION
 korea_china.3.t: "Odmítli nabídku" # todo: NEW TRANSLATION
 korea_china.3.d: "Čínská vláda odmítla naši štědrou nabídku. Možná si to příště rozmyslí." # todo: NEW TRANSLATION
 korea_china.3.a: "Smutné" # todo: NEW TRANSLATION
 korea_china.4.t: "Severní Korea žádá o ochranu" # todo: NEW TRANSLATION
 korea_china.4.d: "Severokorejská vláda nás požádala, abychom zajistili nezávislost jejich země, protože se cítí ohroženi složitou politickou situací v zemi." # todo: NEW TRANSLATION
 korea_china.4.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 korea_china.4.b: "Ne" # todo: NEW TRANSLATION
 korea_china.5.t: "Žádost o ochranu Číny" # todo: NEW TRANSLATION
 korea_china.5.d: "Čínská vláda souhlasila s tím, že nám poskytne záruky nezávislosti naší země. To výrazně usnadní naši politickou situaci." # todo: NEW TRANSLATION
 korea_china.5.a: "Dobré" # todo: NEW TRANSLATION
 korea_china.6.t: "Žádost o ochranu Číny" # todo: NEW TRANSLATION
 korea_china.6.d: "Čínská vláda odmítla naši štědrou nabídku. Možná si to příště rozmyslí." # todo: NEW TRANSLATION
 korea_china.6.a: "Smutné" # todo: NEW TRANSLATION
 korea_china.7.t: "Pomoc při hledání zdrojů" # todo: NEW TRANSLATION
 korea_china.7.d: "Severokorejská vláda žádá o naši pomoc při různých projektech na vyhledávání zdrojů, aby prozkoumali nové zásoby surovin na jejich území; samozřejmě, díky této dohodě posílíme náš vliv na ně." # todo: NEW TRANSLATION
 korea_china.7.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 korea_china.7.b: "Ne" # todo: NEW TRANSLATION
 korea_china.8.t: "Pomoc při hledání zdrojů" # todo: NEW TRANSLATION
 korea_china.8.d: "Čínská vláda souhlasila s pomocí při projektech hledání zdrojů" # todo: NEW TRANSLATION
 korea_china.8.a: "Dobré" # todo: NEW TRANSLATION
 korea_china.9.t: "Nové továrny v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.9.d: "Severokorejská vláda je velmi znepokojena ekonomickou situací země; dělníkům není kde pracovat a nové továrny jsou pro to naléhavě potřeba, a proto se obrátili na nás s žádostí o pomoc s vyřešením této záležitosti. Chápeme, že to pomůže posílit náš vliv na jejich vládu." # todo: NEW TRANSLATION
 korea_china.9.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 korea_china.9.b: "Ne" # todo: NEW TRANSLATION
 korea_china.10.t: "Nové továrny v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.10.d: "Čínská vláda souhlasila s tím, že nám pomůže s výstavbou nových továren na našem území." # todo: NEW TRANSLATION
 korea_china.10.a: "Dobré" # todo: NEW TRANSLATION
 korea_china.11.t: "Domácí banky v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.11.d: "Severokorejská vláda je znepokojena ekonomickou situací v zemi a hledá způsoby, jak okamžitě obnovit ekonomiku po minulých událostech. Aktivně zvou naše banky do jejich země a my jim hodláme odpovědět." # todo: NEW TRANSLATION
 korea_china.11.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 korea_china.11.b: "Ne" # todo: NEW TRANSLATION
 korea_china.12.t: "Čínské banky v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.12.d: "Čínská vláda umožnila, aby jejich banky působily v naší zemi." # todo: NEW TRANSLATION
 korea_china.12.a: "Dobré" # todo: NEW TRANSLATION
 korea_china.13.t: "Huawei v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.13.d: "Severokorejská vláda aktivně usiluje o účast Huawei v jejich zemi a chce, aby se zapojili do ekonomiky Severní Koreje. Je to pro nás vážný krok, pokud jim dovolíme působit tam." # todo: NEW TRANSLATION
 korea_china.13.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 korea_china.13.b: "Ne" # todo: NEW TRANSLATION
 korea_china.14.t: "Huawei v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.14.d: "Huawei bude působit na našem území, čínská vláda schválila povolení pro tento typ činnosti pro tuto společnost." # todo: NEW TRANSLATION
 korea_china.14.a: "Dobré" # todo: NEW TRANSLATION
 korea_china.15.t: "Naše vojenská základna v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.15.d: "Severokorejská armáda chce vidět naši vojenskou základnu na jejich území, aby udržela stabilitu země v případě možného útoku nepřítele." # todo: NEW TRANSLATION
 korea_china.15.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 korea_china.15.b: "Ne" # todo: NEW TRANSLATION
 korea_china.16.t: "Čínská vojenská základna v Severní Koreji" # todo: NEW TRANSLATION
 korea_china.16.d: "Čínská vojenská základna brzy bude na našem území, nyní se cítíme bezpečněji." # todo: NEW TRANSLATION
 korea_china.16.a: "Dobré" # todo: NEW TRANSLATION
