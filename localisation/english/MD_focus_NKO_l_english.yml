 NKO_spa_focus_lifts_production_tt: "§GTrvale odstraňuje §!§Ystálý postih „Úpadek výrobních linek“.§!" # todo: NEW TRANSLATION
 NKO_spa_focus_lifts_military_tt: "§GTrvale odstraňuje §!§Ystálý postih „Prázdná síla“.§!" # todo: NEW TRANSLATION
