 NKO_2_5_increase_kim_jong_un_tt: "Podpora Kim Čong-una se §Yzvyšuje§! o 2–5 %" # todo: NEW TRANSLATION
 NKO_2_5_increase_kim_jong_nam_tt: "Podpora Kim Čong-nama se §Yzvyšuje§! o 2–5 %" # todo: NEW TRANSLATION
 NKO_5_decrease_kim_jong_un_tt: "Podpora Kim Čong-una se §Ysnižuje§! o 5 %" # todo: NEW TRANSLATION
 NKO_5_increase_kim_jong_un_tt: "Podpora Kim Čong-una se §Yzvyšuje§! o 5 %" # todo: NEW TRANSLATION
 NKO_5_decrease_kim_jong_nam_tt: "Podpora Kim Čong-nama se §Ysnižuje§! o 5 %" # todo: NEW TRANSLATION
 NKO_2_decrease_kim_jong_nam_tt: "Podpora Kim Čong-nama se §Ysnižuje§! o 2 %" # todo: NEW TRANSLATION
 NKO_3_decrease_kim_jong_un_tt: "Podpora Kim Čong-una se §Ysnižuje§! o 3 %" # todo: NEW TRANSLATION
 NKO_4_increase_kim_jong_nam_tt: "Podpora Kim Čong-nama se §Yzvyšuje§! o 4 %" # todo: NEW TRANSLATION
 NKO_5_increase_kim_jong_nam_tt: "Podpora Kim Čong-nama se §Yzvyšuje§! o 5 %" # todo: NEW TRANSLATION
 NKO_kim_jong_il_death: "Smrt Kim Čong-ila" # todo: NEW TRANSLATION
 NKO_kim_jong_il_death_tt: "Kim Čong-il je mrtev" # todo: NEW TRANSLATION
 NKO_kim_jong_il_death_desc: "\n--------------\nToto zaměření se §Yodemkne§! v §Y8:30 dne 17. prosince 2011§!. Milovaný velký vůdce, zakladatel Korejské lidově demokratické republiky a věčný prezident republiky Kim Čong-il zemřel v 8:30 dne 17. prosince 2011 na akutní infarkt myokardu komplikovaný kardiogenním šokem, když byl vlakem na cestě navštívit místní oblast." # todo: NEW TRANSLATION
 NKO_junta: "Juntistický převrat" # todo: NEW TRANSLATION
 NKO_junta_desc: "Úspěšné reformy v Číně a Vietnamu nám poskytly dobrý příklad, ale jejich reformy nebyly hladké. Pokud by naše vlastní reformy selhaly, zemřeli bychom a byli anektováni Jihem. Kim Čong-un i Kim Čong-nam navíc chtějí různé úrovně reforem. Budeme muset učinit nejtěžší rozhodnutí, abychom neztratili svou zemi ani svou stranu..." # todo: NEW TRANSLATION
 NKO_preserve_songun: "Zachovat songun" # todo: NEW TRANSLATION
 NKO_preserve_songun_desc: "Songun je základem armády a jeho ideologii musíme podporovat." # todo: NEW TRANSLATION
 NKO_entrench_military_authority: "Upevnit vojenskou autoritu" # todo: NEW TRANSLATION
 NKO_entrench_military_authority_desc: "Ačkoli jsme k uchopení moci nad kimovskou dynastií využili armádu, v jejích řadách stále působí někteří loajalisté Kimů. Přesvědčíme je našimi „prostředky“..." # todo: NEW TRANSLATION
 NKO_smash_black_market: "Rozdrtit „trh“" # todo: NEW TRANSLATION
 NKO_smash_black_market_desc: "Síly „trhu“ působí naší zemi velké škody a musí být okamžitě zastaveny!" # todo: NEW TRANSLATION
 NKO_determining_the_loyalty_of_army: "Určit loajalitu armády" # todo: NEW TRANSLATION
 NKO_determining_the_loyalty_of_army_desc: "Nyní můžeme povýšit některé z našich loajalistů a učinit je poddajnějšími vůči nám." # todo: NEW TRANSLATION
 NKO_purge_dissenters: "Očistit odpůrce" # todo: NEW TRANSLATION
 NKO_purge_dissenters_desc: "Abychom v této kritické době předávání moci zachovali stabilitu země, musíme okamžitě zatknout všechny potenciální disidenty!" # todo: NEW TRANSLATION
 NKO_crush_the_kims: "Poprava Kimů" # todo: NEW TRANSLATION
 NKO_crush_the_kims_desc: "Ponechat syny Kim Čong-ila naživu je v konečném důsledku destabilizující faktor. Tajně je popravte!" # todo: NEW TRANSLATION
 NKO_constrain_the_donju: "Omezit donju" # todo: NEW TRANSLATION
 NKO_constrain_the_donju_desc: "Donju již dříve nepatrně přispěli k hospodářskému rozvoji naší země. Udržme je aktivní..." # todo: NEW TRANSLATION
 NKO_end_the_donju: "Zásah proti pašování" # todo: NEW TRANSLATION
 NKO_end_the_donju_desc: "Pašování je těžký zločin a navzdory jeho přínosu pro hospodářství země je čas tyto zločince jednou provždy odstranit." # todo: NEW TRANSLATION
 NKO_high_pressure_politics: "Politika vysokého tlaku" # todo: NEW TRANSLATION
 NKO_high_pressure_politics_desc: "Nespokojenost obyvatelstva vzrostla do takové míry, že k udržení naší vlády musíme použít násilné prostředky." # todo: NEW TRANSLATION
 NKO_empower_the_state_security_department: "Posílit Generální průzkumný úřad" # todo: NEW TRANSLATION
 NKO_empower_the_state_security_department_desc: "Nyní musíme pověřit Generální průzkumný úřad armády většími pravomocemi a učinit z něj dominantní zpravodajskou agenturu země. Generální průzkumný úřad odhalí, zatkne a odstraní potenciální sabotéry a imperialistické špiony." # todo: NEW TRANSLATION
 NKO_chi_military_support: "Čínská vojenská podpora" # todo: NEW TRANSLATION
 NKO_chi_military_support_desc: "Čína je naším věčným bratrem a spojencem. Abychom přežili na mezinárodní scéně, znovu se uchýlíme do náruče Pekingu." # todo: NEW TRANSLATION
 NKO_chi_invest_resources: "Pomoc s těžbou zdrojů" # todo: NEW TRANSLATION
 NKO_chi_invest_resources_desc: "Jsme připraveni vpustit čínské těžební společnosti na naše území" # todo: NEW TRANSLATION
 NKO_chi_banks: "Čínské banky" # todo: NEW TRANSLATION
 NKO_chi_banks_desc: "Jsme připraveni vpustit čínské banky do naší země" # todo: NEW TRANSLATION
 NKO_chi_help_factories: "Čínské továrny" # todo: NEW TRANSLATION
 NKO_chi_help_factories_desc: "Máme v úmyslu požádat čínskou vládu o pomoc s výstavbou nových továren na našem území" # todo: NEW TRANSLATION
 NKO_chi_huawei: "Spolupráce s Huawei" # todo: NEW TRANSLATION
 NKO_chi_huawei_desc: "Společnost Huawei je jednou z nejznámějších na světě a chceme, aby jí čínská vláda dovolila působit na našem území" # todo: NEW TRANSLATION
 NKO_perpetual_war_footing: "Žádat o čínskou ochranu" # todo: NEW TRANSLATION
 NKO_perpetual_war_footing_desc: "Naše vojenská vláda je potenciálním cílem zásahu. Musíme se vzdát části své suverenity Číně, abychom zajistili přežití. To je to, co je nutné." # todo: NEW TRANSLATION
 NKO_military_collectives: "Vláda junty" # todo: NEW TRANSLATION
 NKO_military_collectives_desc: "Náš lid není připraven přijmout Západ, proto musíme nadále udržovat naši vládu." # todo: NEW TRANSLATION
 NKO_expand_local_industry: "Investice do domácího průmyslu" # todo: NEW TRANSLATION
 NKO_expand_local_industry_desc: "Musíme rozšířit domácí výrobu, protože bez silného průmyslu nebude naše země schopna odolat hospodářskému tlaku našich nepřátel." # todo: NEW TRANSLATION
 NKO_encourage_private_enterprise: "Podpořit soukromé podnikání" # todo: NEW TRANSLATION
 NKO_encourage_private_enterprise_desc: "Soukromé podnikání je budoucím motorem rozvoje našeho hospodářství a hodláme ho podporovat" # todo: NEW TRANSLATION
 NKO_market_based_economy: "Tržně orientované hospodářství" # todo: NEW TRANSLATION
 NKO_market_based_economy_desc: "Náš hospodářský systém nám přinesl pouze problémy a neustálé krize. Je čas ho změnit" # todo: NEW TRANSLATION
 NKO_reorganising_government: "Reorganizovat vládu" # todo: NEW TRANSLATION
 NKO_reorganising_government_desc: "Je čas reorganizovat vládu. Země potřebuje novou vládu." # todo: NEW TRANSLATION
 NKO_more_arms_factories: "Více vojenských továren" # todo: NEW TRANSLATION
 NKO_more_arms_factories_desc: "Vojenský průmysl nesmí ustrnout. Budou postaveny nové zbrojní továrny, aby byla Korejská lidová armáda zásobována a linie songun zůstala silná." # todo: NEW TRANSLATION
 NKO_field_hospitals: "Polní nemocnice" # todo: NEW TRANSLATION
 NKO_field_hospitals_desc: "Zřídíme více polních nemocnic, abychom v případě války mohli vojáky co nejrychleji ošetřit." # todo: NEW TRANSLATION
 NKO_reform_youth: "Reforma Dělnické stráže" # todo: NEW TRANSLATION
 NKO_reform_youth_desc: "Bylo nutné tuto strukturu reformovat už dávno; její bývalá funkčnost je dávno mimo moderní dobu." # todo: NEW TRANSLATION
 NKO_kim_jong_un: "Kim Čong-un" # todo: NEW TRANSLATION
 NKO_kim_jong_un_desc: "Kim Čong-un, nástupce Kim Čong-ila, do něhož jsou vkládány velké naděje, chce provést vhodné hospodářské reformy, které podpoří ekonomiku země, zatímco země zůstane stabilní a sjednocená. Nechce však ztratit pevnou kontrolu nad mocí ani své vznešené postavení jakožto „linie krve hory Pektu“..." # todo: NEW TRANSLATION
 NKO_consolidate_power: "Upevnit moc" # todo: NEW TRANSLATION
 NKO_consolidate_power_desc: "" # todo: NEW TRANSLATION
 NKO_light_industry_develop: "Rozvíjet lehký průmysl" # todo: NEW TRANSLATION
 NKO_light_industry_develop_desc: "" # todo: NEW TRANSLATION
 NKO_criticize_ineptitude: "Kritizovat neschopnost" # todo: NEW TRANSLATION
 NKO_criticize_ineptitude_desc: "" # todo: NEW TRANSLATION
 NKO_improvement_of_people_live: "Zlepšení života lidu" # todo: NEW TRANSLATION
 NKO_improvement_of_people_live_desc: "" # todo: NEW TRANSLATION
 NKO_people_support: "Podpora lidu" # todo: NEW TRANSLATION
 NKO_people_support_desc: "" # todo: NEW TRANSLATION
 NKO_centralize_power: "Centralizovat moc" # todo: NEW TRANSLATION
 NKO_centralize_power_desc: "" # todo: NEW TRANSLATION
 NKO_root_out_corruption: "Vymýtit korupci" # todo: NEW TRANSLATION
 NKO_root_out_corruption_desc: "" # todo: NEW TRANSLATION
 NKO_formalize_power_structures: "Formalizovat mocenské struktury" # todo: NEW TRANSLATION
 NKO_formalize_power_structures_desc: "" # todo: NEW TRANSLATION
 NKO_assassinate_kim_jong_nam: "Zavraždit Kim Čong-nama" # todo: NEW TRANSLATION
 NKO_assassinate_kim_jong_nam_desc: "Pokud Kim Čong-nam zůstane naživu, bude vždy představovat hrozbu pro stabilitu našeho režimu. Odstraňte ho za každou cenu." # todo: NEW TRANSLATION
 NKO_appoint_loyalists: "Dosadit loajalisty" # todo: NEW TRANSLATION
 NKO_appoint_loyalists_desc: "" # todo: NEW TRANSLATION
 NKO_civilian_control_of_the_economy: "Civilní kontrola hospodářství" # todo: NEW TRANSLATION
 NKO_civilian_control_of_the_economy_desc: "" # todo: NEW TRANSLATION
 NKO_party_state_army: "Strana, stát, armáda" # todo: NEW TRANSLATION
 NKO_party_state_army_desc: "" # todo: NEW TRANSLATION
 NKO_party_unchecked: "Věčná strana" # todo: NEW TRANSLATION
 NKO_party_unchecked_desc: "" # todo: NEW TRANSLATION
 NKO_eternal_juche_sasang: "Věčné čučche sasang" # todo: NEW TRANSLATION
 NKO_eternal_juche_sasang_desc: "" # todo: NEW TRANSLATION
 NKO_kim_jong_nam: "Kim Čong-nam" # todo: NEW TRANSLATION
 NKO_kim_jong_nam_desc: "Kim Čong-nam, nejstarší syn Kim Čong-ila, byl dlouho kontroverzní postavou severokorejské politiky. Kdysi považovaný za následníka trůnu se kvůli veřejné kritice režimu a následnému exilu stal symbolem odporu. Kim Čong-nam prosazoval hospodářské reformy a spolupráci s mezinárodním společenstvím, takže jeho vize ostře kontrastovala s tradicionalistickým přístupem jeho mladšího bratra Kim Čong-una. Jeho návrat do Severní Koreje by mohl signalizovat posun k otevřenější politice a představovat možnou výzvu zavedenému řádu." # todo: NEW TRANSLATION
 NKO_face_world: "Postavit se světu" # todo: NEW TRANSLATION
 NKO_face_world_desc: "Institucionální reforma země se neobejde bez vnější podpory, a proto se musíme zaměřit na diplomatickou stránku vládnutí a mít dobré vztahy se světem." # todo: NEW TRANSLATION
 NKO_conciliatory_rhetoric: "Usmiřovací rétorika" # todo: NEW TRANSLATION
 NKO_conciliatory_rhetoric_desc: "" # todo: NEW TRANSLATION
 NKO_diplomatic_overtures: "Navázat diplomatické vztahy se zeměmi" # todo: NEW TRANSLATION
 NKO_diplomatic_overtures_desc: "Druhým krokem severokorejské diplomacie je navázání formálních diplomatických vztahů s různými zeměmi, což ulehčí cestu reformám v zemi." # todo: NEW TRANSLATION
 NKO_step_up_joint_ventures: "Pozvat více společných podniků" # todo: NEW TRANSLATION
 NKO_step_up_joint_ventures_desc: "Zahraniční investice jsou cestou, jak pomoci reformovat naše hospodářství, a vítáme je." # todo: NEW TRANSLATION
 NKO_embrace_the_people: "Přijmout lid" # todo: NEW TRANSLATION
 NKO_embrace_the_people_desc: "Naše země nemůže zůstat navždy uzavřená. Je čas otevřít náruč našemu lidu, přijmout ho a vytvořit jinou Severní Koreu." # todo: NEW TRANSLATION
 NKO_loosen_information_monopoly: "Uvolnit informační monopol" # todo: NEW TRANSLATION
 NKO_loosen_information_monopoly_desc: "Lidé mohou svobodně vyjadřovat své názory." # todo: NEW TRANSLATION
 NKO_tone_down_propaganda: "Omezit oficiální propagandu" # todo: NEW TRANSLATION
 NKO_tone_down_propaganda_desc: "Ačkoli oficiální média dříve ztělesňovala vůli státu, naše demokratizační reformy nyní nepotřebují lidem vnucovat „demokracii“." # todo: NEW TRANSLATION
 NKO_end_forced_labor: "Ukončit nucené práce" # todo: NEW TRANSLATION
 NKO_end_forced_labor_desc: "Žádné další nucené práce. Vykročíme do otevřeného světa." # todo: NEW TRANSLATION
 NKO_expand_sezs: "Rozšířit zvláštní ekonomické zóny" # todo: NEW TRANSLATION
 NKO_expand_sezs_desc: "Bez pomoci zvláštních ekonomických zón v Rasonu a Kesongu nemůžeme reformovat naše hospodářství. Můžeme vytvořit další zvláštní ekonomické zóny, aby někteří lidé mohli zbohatnout jako první." # todo: NEW TRANSLATION
 NKO_end_juche: "Ukončit čučche" # todo: NEW TRANSLATION
 NKO_end_juche_desc: "Čučche není všelék. Potřebujeme vědečtější model vedení." # todo: NEW TRANSLATION
 NKO_foreign_knowledge: "Odborníci ze zahraničí" # todo: NEW TRANSLATION
 NKO_foreign_knowledge_desc: "KLDR přišla v důsledku svých represivních politik v uplynulých desetiletích o mnoho talentů. Abychom překlenuli nedostatek odborníků, mohli bychom přizvat některé výzkumníky ze zahraničí." # todo: NEW TRANSLATION
 NKO_join_the_wto: "Vstoupit do WTO" # todo: NEW TRANSLATION
 NKO_join_the_wto_desc: "Příliš dlouho jsme byli vyloučeni z výhod světového obchodu, které sdílejí členové Světové obchodní organizace. Nyní to změníme a lépe využijeme mechanismy západního liberálního hospodářského řádu ve službě našim reformám." # todo: NEW TRANSLATION
 NKO_preserve_the_party: "Zachovat vedení Dělnické strany Koreje" # todo: NEW TRANSLATION
 NKO_preserve_the_party_desc: "Reforma a otevření se světu nejsou totéž jako ukončení vedení Dělnické strany, která může vést lid ke světlé a prosperující budoucnosti." # todo: NEW TRANSLATION
 NKO_appeal_to_the_youth: "Obrátit se na mládež" # todo: NEW TRANSLATION
 NKO_appeal_to_the_youth_desc: "Právě mládež je páteří našich reforem." # todo: NEW TRANSLATION
 NKO_the_choson_dream: "Čosonský sen" # todo: NEW TRANSLATION
 NKO_the_choson_dream_desc: "„Čosonský sen“ je nový koncept představený prezidentem [NKO.GetLeader], který zahrnuje osobní i národní cíle korejského národa. Obsahuje ambice v mnoha oblastech, včetně hospodářské, politické a mezinárodní sféry." # todo: NEW TRANSLATION
 NKO_democracy_with_north_characteristics: "Demokracie se severokorejskými rysy" # todo: NEW TRANSLATION
 NKO_democracy_with_north_characteristics_desc: "Demokracie západního typu není pro KLDR zcela vhodná a KLDR potřebuje vlastní demokracii s charakteristickými rysy KLDR." # todo: NEW TRANSLATION
 NKO_people_before_party: "Lid před stranou" # todo: NEW TRANSLATION
 NKO_people_before_party_desc: "Lid je pánem své země!" # todo: NEW TRANSLATION
 NKO_elections: "Místní volby" # todo: NEW TRANSLATION
 NKO_elections_desc: "Naše reformy zahrnují demokratizaci politického systému a lid získá moc volit vůdce, které chce." # todo: NEW TRANSLATION
 NKO_free_expression: "Svoboda projevu" # todo: NEW TRANSLATION
 NKO_free_expression_desc: "Lid Severní Koreje byl pod represivními politikami příliš dlouho potlačován a základní svobodou, kterou mu musíme poskytnout, je svoboda projevu." # todo: NEW TRANSLATION
 NKO_byungjin: "Pjongdžin" # todo: NEW TRANSLATION
 NKO_byungjin_desc: "Během namáhavého pochodu udržel moudrý generál Kim Čong-il naši zemi nad vodou přijetím politiky „songun“, aby zachoval její stabilitu. Nyní, když se hospodářství země zotavilo, je čas opustit starý přístup zaměřený na armádu a rozvíjet armádu i hospodářství současně!" # todo: NEW TRANSLATION
 NKO_scale_back_spending: "Omezit vládní výdaje" # todo: NEW TRANSLATION
 NKO_scale_back_spending_desc: "" # todo: NEW TRANSLATION
 NKO_encourage_consumption: "Podpořit spotřebu" # todo: NEW TRANSLATION
 NKO_encourage_consumption_desc: "" # todo: NEW TRANSLATION
 NKO_loosen_grip_on_soes: "Uvolnit sevření státních podniků" # todo: NEW TRANSLATION
 NKO_loosen_grip_on_soes_desc: "" # todo: NEW TRANSLATION
 NKO_state_owned_enterprises_competition: "Konkurence státních podniků" # todo: NEW TRANSLATION
 NKO_state_owned_enterprises_competition_desc: "" # todo: NEW TRANSLATION
 NKO_resorts_and_tourism: "Letoviska a cestovní ruch" # todo: NEW TRANSLATION
 NKO_resorts_and_tourism_desc: "Kvůli mezinárodním sankcím máme jen málo možností, jak získat devizy. Posilme cestovní ruch a dovolme lidem z celého světa přijet obdivovat krásy Severní Koreje!" # todo: NEW TRANSLATION
 NKO_samjiyon: "Samdžijon" # todo: NEW TRANSLATION
 NKO_samjiyon_desc: "Samdžijon je naší velkou revoluční svatyní v Severní Koreji. Má podobné postavení jako Jen-an v Číně. Měli bychom usilovně pracovat na jejím rozvoji, aby lidé mohli získat více vlasteneckého vzdělání." # todo: NEW TRANSLATION
 NKO_incentive_based_economy: "Hospodářství založené na pobídkách" # todo: NEW TRANSLATION
 NKO_incentive_based_economy_desc: "Uvolnění centrální kontroly nad podniky přineslo výsledky. Tím, že dovolíme manažerům odměňovat produktivitu a ponechat si podíl na produkci, stát využije vlastní zájem ve službě růstu, aniž by opustil rozhodující výšiny hospodářství." # todo: NEW TRANSLATION
 NKO_empower_the_donju: "Posílit donju" # todo: NEW TRANSLATION
 NKO_empower_the_donju_desc: "Ačkoli země nemůže být ve svém rozvoji příliš závislá na vnějším světě, bez donju by naše hospodářství nebylo udržitelné. Dejte jim více práv v oblasti obchodu, nechte je vést národní hospodářství a dovolte tisícijazyčnému koni korejské ekonomiky běžet!" # todo: NEW TRANSLATION
 NKO_weaken_the_donju: "Oslabit donju" # todo: NEW TRANSLATION
 NKO_weaken_the_donju_desc: "Přebalování a další prodej čínského a jihokorejského zboží naši zemi nezbohatily. Musíme se zaměřit na vlastní průmyslové značky a umožnit severokorejským značkám vystoupat na vrchol světového trhu!" # todo: NEW TRANSLATION
 NKO_protect_state_owned_business: "Chránit státní podniky" # todo: NEW TRANSLATION
 NKO_protect_state_owned_business_desc: "" # todo: NEW TRANSLATION
 NKO_encourage_foreign_investment: "Podpořit zahraniční investice" # todo: NEW TRANSLATION
 NKO_encourage_foreign_investment_desc: "Jakkoli jsou naše domácí průmyslová odvětví odolná, jejich plný hospodářský potenciál nelze uvolnit bez investic ze zámoří. Měli bychom nabídnout pobídky k přilákání přímých zahraničních investic do naší země." # todo: NEW TRANSLATION
 NKO_privatize_means_of_production: "Privatizovat výrobní prostředky" # todo: NEW TRANSLATION
 NKO_privatize_means_of_production_desc: "" # todo: NEW TRANSLATION
 NKO_economy_revival: "Hospodářské oživení" # todo: NEW TRANSLATION
 NKO_economy_revival_desc: "S koncem „namáhavého pochodu“ je čas znovu nastartovat naše hospodářství." # todo: NEW TRANSLATION
 NKO_priorit_for_civilian_industry: "Zaměřit se na civilní průmysl" # todo: NEW TRANSLATION
 NKO_priorit_for_civilian_industry_desc: "" # todo: NEW TRANSLATION
 NKO_priorit_for_army_industry: "Zaměřit se na vojenský průmysl" # todo: NEW TRANSLATION
 NKO_priorit_for_army_industry_desc: "Vojenský průmysl je pro nás zásadní, a to jak pro posílení domácí poptávky, tak pro posílení našich obranných sil." # todo: NEW TRANSLATION
 NKO_arms_trafficking: "Obchod se zbraněmi" # todo: NEW TRANSLATION
 NKO_arms_trafficking_desc: "Proč by měly být sklady neustále přeplněné nesčetnými zbraněmi? Mohli bychom je vyměnit za zlato." # todo: NEW TRANSLATION
 NKO_sinuiju: "Sinuidžu – zvláštní správní oblast" # todo: NEW TRANSLATION
 NKO_sinuiju_desc: "Sinuidžu byla vždy důležitým přístavem pro obchod mezi Severní Koreou a Čínou. Mohli bychom následovat čínský přístup „jedna země, dva systémy“ a učinit oblast vhodnější pro obchod se zahraničím." # todo: NEW TRANSLATION
 NKO_recognition_of_economic_backwardness: "Uznat hospodářskou zaostalost" # todo: NEW TRANSLATION
 NKO_recognition_of_economic_backwardness_desc: "Hospodářství Severní Koreje po „namáhavém pochodu“ zaostalo za dobou. Potřebujeme radikální reformy" # todo: NEW TRANSLATION
 NKO_2009_revaluation: "Revalvace" # todo: NEW TRANSLATION
 NKO_2009_revaluation_desc: "Během namáhavého pochodu bylo naše národní hospodářství, a zejména měnový systém, těžce zasaženo. Lidé naší měně nedůvěřovali a každodenní život byl dokonce naplněn směnným obchodem. Abychom tuto situaci změnili, potřebujeme odvážnou měnovou reformu a revalvaci." # todo: NEW TRANSLATION
 NKO_revaluation_failure: "Selhání revalvace..." # todo: NEW TRANSLATION
 NKO_revaluation_failure_desc: "" # todo: NEW TRANSLATION
 NKO_air_koryo: "Air Koryo" # todo: NEW TRANSLATION
 NKO_air_koryo_desc: "" # todo: NEW TRANSLATION
 NKO_reform_of_the_privatisation_of_collective_farms: "Privatizace kolektivních farem" # todo: NEW TRANSLATION
 NKO_reform_of_the_privatisation_of_collective_farms_desc: "Uvolnění kontroly nad místními kolektivními farmami s cílem zvýšit jejich motivaci k produkci." # todo: NEW TRANSLATION
 NKO_construction_of_hydraulic_facilities: "Výstavba vodohospodářských zařízení" # todo: NEW TRANSLATION
 NKO_construction_of_hydraulic_facilities_desc: "Abychom zvýšili zemědělské výnosy bez takové závislosti na chemických hnojivech, musíme vybudovat více vodohospodářských zařízení." # todo: NEW TRANSLATION
 NKO_free_housing: "Další bezplatné bydlení" # todo: NEW TRANSLATION
 NKO_free_housing_desc: "Postavme více bytů, aby si lidé mohli dovolit v nich žít!" # todo: NEW TRANSLATION
 NKO_expand_compulsory_education: "Rozšířit povinné vzdělávání" # todo: NEW TRANSLATION
 NKO_expand_compulsory_education_desc: "Vzdělání je základem silného národa. Rozšíříme povinné vzdělávání a umožníme více dětem přístup k vyšším úrovním vzdělání." # todo: NEW TRANSLATION
 NKO_chollima_speed_desc: "Rozvoj infrastruktury je důležitým krokem na cestě k obnově našeho hospodářství, a to nejen pro náš ekonomický rozvoj, ale také pro vojenské účely, jako jsou silnice schopné přepravovat těžkou techniku a železnice schopná přepravovat raketové vlaky." # todo: NEW TRANSLATION
 korea_north.1.t: "Severní Korea žádá stažení našich jednotek z Jižní Koreje" # todo: NEW TRANSLATION
 korea_north.1.d: "Severní Korea požaduje, abychom stáhli americké jednotky ze Jižní Koreje a přerušili vazby s Jižní Koreou, jinak použije jaderné zbraně v případě sjednocení. Zatímco Severní Korea bývá primárně zastrašující bez úmyslu své hrozby realizovat, tentokrát to vypadá, že to myslí vážně..." # todo: NEW TRANSLATION
 korea_north.1.a: "To je směšné!" # todo: NEW TRANSLATION
 korea_north.1.b: "Je pro nás lepší ustoupit..." # todo: NEW TRANSLATION
 korea_north.2.t: "Severní Korea vstupuje do WTO" # todo: NEW TRANSLATION
 korea_north.2.d: "Po dlouhých jednáních mezi DPRK a současnými členy WTO byla žádost Severní Koreje o vstup do WTO konečně schválena. DPRK musela WTO členům, zvláště Spojeným státům, Evropské unii a Číně, ukázat, že činí významné kroky k otevření své ekonomiky soutěži. Oficiální média DPRK tuto událost popsala jako historický okamžik v procesu reforem a modernizace Koreje." # todo: NEW TRANSLATION
 korea_north.2.a: "Severní Korea se nadále otevírá světu." # todo: NEW TRANSLATION
 korea_north.3.t: "Přecenění měny" # todo: NEW TRANSLATION
 korea_north.3.d: "Severokorejští úředníci oznámili rozsáhlou měnovou reformu k revalvaci měny, s limitem 100 000 starých mincí na domácnost. Jaký bude směnný kurz mezi starou a novou měnou?" # todo: NEW TRANSLATION
 korea_north.3.a: "25 (staré) k 1 (nové)" # todo: NEW TRANSLATION
 korea_north.3.b: "100 (staré) k 1 (nové)" # todo: NEW TRANSLATION
 korea_north.4.t: "Úspěšná revalvace" # todo: NEW TRANSLATION
 korea_north.4.d: "Po všech našich snahách byla měnová reforma konečně úspěšná!" # todo: NEW TRANSLATION
 korea_north.4.a: "Skvělé!" # todo: NEW TRANSLATION
 korea_north.5.t: "Zmírnění konfliktů" # todo: NEW TRANSLATION
 korea_north.5.d: "Naše nedávné reformy vedly k jistému chaosu, lidé panikaří při směně cizí měny a dokonce došlo k nepokojům v provincii Severní Hamgyŏng. Měli bychom učinit nějaké ústupky?" # todo: NEW TRANSLATION
 korea_north.5.a: "Zachovat současný stav." # todo: NEW TRANSLATION
 korea_north.5.b: "Zmírnění omezení směn měn." # todo: NEW TRANSLATION
 korea_north.6.t: "Neúspěšná revalvace..." # todo: NEW TRANSLATION
 korea_north.6.d: "Měnová reforma vyvolala hospodářský chaos, protože zboží se nedalo prodat, dokud stát nestanovil ceny, a populace panikařila při honbě za směnou cizí měny. Korejská won klesla o 96 % vůči americkému dolaru během týdne po reformě a cena rýže za kilogram vzrostla z 17 na 50 wonů za tři dny. Měnová reforma byla prohlášena za úplný neúspěch." # todo: NEW TRANSLATION
 korea_north.6.a: "Poprava odpovědné osoby!" # todo: NEW TRANSLATION
 korea_north.7.t: "Drogy se šíří našimi ulicemi" # todo: NEW TRANSLATION
 korea_north.7.d: "Ulice se potápí v chaosu, když silné drogy jako metamfetamin a kokainy zaplavují čtvrti a rozkládají komunity. Rodiny jsou rozpadlé, zločinnost roste a nikdo se necítí bezpečně." # todo: NEW TRANSLATION
 korea_north.7.a: "Naši nepřátelé padnou" # todo: NEW TRANSLATION
 korea_north.8.t: "Naše drogy byly zadrženy na hranicích" # todo: NEW TRANSLATION
 korea_north.8.d: "Vše šlo hladce—až přišla zpráva: zásilka byla zadržena na hranici. Nyní visí všechno na minutu. Měsíce plánování šly do koše." # todo: NEW TRANSLATION
 korea_north.8.a: "Zkusíme to znovu" # todo: NEW TRANSLATION
 korea_north.9.t: "Padělané peníze sužují náš bankovní systém" # todo: NEW TRANSLATION
 korea_north.9.d: "Padělané hotovost je všude, prochází z ruky do ruky a podniky jsou postiženy, chaos po sobě zanechává. Místní obchody, pouliční prodejci i velké řetězce jsou poškozeny, protože padělky kolují rychleji, než mohou reagovat orgány." # todo: NEW TRANSLATION
 korea_north.9.a: "Imperialismus padá" # todo: NEW TRANSLATION
 korea_north.10.t: "Naše padělané peníze byly zadrženy úřady" # todo: NEW TRANSLATION
 korea_north.10.d: "Úřady zadržely tuto zásilku, ale to není konec, to je jen začátek." # todo: NEW TRANSLATION
 korea_north.10.a: "Vyrobíme jich víc!" # todo: NEW TRANSLATION
 kim_jong_il_death.1.t: "Kdo bude dědicem trůnu?" # todo: NEW TRANSLATION
 kim_jong_il_death.1.d: "Kim Čong-il dlouho nežije a musí si vybrat nástupce z řad svých dvou synů. Kim Čong-un dává přednost konzervativní reformě politického a ekonomického systému země. Kim Čong-nam dává přednost reformám socialistické tržní ekonomiky a radikálnějším reformám politického systému." # todo: NEW TRANSLATION
 kim_jong_il_death.1.a: "Kim Čong-un!" # todo: NEW TRANSLATION
 kim_jong_il_death.1.b: "Kim Čong-nam!" # todo: NEW TRANSLATION
 kim_jong_il_death.2.t: "Soudruh Kim Čong-il je mrtev!" # todo: NEW TRANSLATION
 kim_jong_il_death.2.d: "Milovaný Velký vůdce, zakladatel Demokratické lidové republiky Koreje a věčný prezident, Kim Čong-Il, zemřel dne 17. prosince 2011 v 8:30 na akutní infarkt myokardu komplikovaný srdečním šokem na cestě vlakem, aby navštívil oblast." # todo: NEW TRANSLATION
 kim_jong_il_death.2.a: "Smutné zprávy..." # todo: NEW TRANSLATION
 kim_jong_il_death.3.t: "Zpráva od Kim Čong-una..." # todo: NEW TRANSLATION
 kim_jong_il_death.3.d: "Kim Jong-un vstúpil do otcovy kanceláře. Místnost silně voněla kouřem a otec vypadal, že právě dokončil celou cigáru a byl v dobré náladě.\n\"Otec, soudruh Jang Song-thaek se zdá, že tajně hájí zájmy země za jeho zády a já jsem připravil zprávu.\"\nPoložil zprávu na stůl, vedle popelníku plného nedopalků a napůl vypité sklenice whisky.\nKim Jong-il ji zvedl a podíval se na ni, \"Záležitost prodeje starožitností jsem vyřídil já spolu s Jang Sung-taekem a lidmi ze sálu 39, země skutečně neměla peníze, bylo to zoufalé opatření... a soudruh Jang Sung-taek jednal jen na rozkazy. Kromě toho to není žádná velká věc, o některých věcech se se mnou již dříve bavil a já s tím souhlasil.\"\nOtec vstal, přešel k Kim Jong-unovi a potřásl mu ramenem, \"Jong-un, to jsou maličkosti, měl bys najít soudruha Jang Sung-taeka, aby to vyřešil soukromě, nestoupej stále osobní zášť na politické výšiny.\" Otec zvedl svou sklenici a napil se, \"Jdi pryč, brzy budu mluvit s Jang Sung-taekem.\"" # todo: NEW TRANSLATION
 kim_jong_il_death.3.a: "\"Chang Sung-taek doesn't seem to be that reliable either...\"" → "\"Chang Sung-taek vypadá, že také není příliš spolehlivý...\"" # todo: NEW TRANSLATION
 kim_jong_il_death.4.t: "Kim Jong-nam takes the North Korean power!" → "Kim Jong-nam převezím moc v Severní Koreji!" # todo: NEW TRANSLATION
 kim_jong_il_death.4.d: "This morning, Kim Jong-nam has officially become the President of the State Affairs Commission and General Secretary of the Workers' Party of Korea. It is reported that his brother Kim Jong-un has fled the country and is living in hiding somewhere." → "Dnes ráno se Kim Jong-nam oficiálně stal předsedou Státního výboru pro záležitosti a generálním tajemníkem Korejské dělnické strany. Bylo oznámeno, že jeho bratr Kim Jong-un uprchl ze země a žije někde v utajení." # todo: NEW TRANSLATION
 kim_jong_il_death.4.a: "What does this have to do with us?" → "Co s tím má tato záležitost společného?" # todo: NEW TRANSLATION
 kim_jong_il_death.4.b: "Unexpected." → "Neočekávané." # todo: NEW TRANSLATION
 kim_jong_il_death.5.t: "Kim Jong-un takes power in North Korea!" → "Kim Jong-un získává moc v Severní Koreji!" # todo: NEW TRANSLATION
 kim_jong_il_death.5.d: "This morning, Kim Jong-un has officially become the President of the State Affairs Commission and General Secretary of the Workers' Party of Korea. It is reported that his brother Kim Jong-nam has moved overseas." → "Dnes ráno se Kim Jong-un oficiálně stal předsedou Státního výboru pro záležitosti a generálním tajemníkem Korejské dělnické strany. Bylo hlášeno, že jeho bratr Kim Jong-nam se odstěhoval do zahraničí." # todo: NEW TRANSLATION
 kim_jong_il_death.5.a: "What does this have to do with us?" → "Co s tím má tato záležitost společného?" # todo: NEW TRANSLATION
 kim_jong_il_death.5.b: "Expected." → "Očekávané." # todo: NEW TRANSLATION
 kim_jong_il_death.6.t: "The People's Army Conduct a Surprise Coup in North Korea!" → "Lidová armáda provede překvapivý převrat v Severní Koreji!" # todo: NEW TRANSLATION
 kim_jong_il_death.6.d: "In surprising news, a military coup by the KPA took place in North Korea this morning, with the new junta government announcing that it would take over power left vacant by the death of Kim Jong-il. The new Junta claimed that it was a coup d'état to preserve the purity of Juche's ideology at the \"strong request of the Korean state and nation\"." → "Ve překvapivých zprávách se dnes ráno v Severní Koreji uskutečnil vojenský převrat KPA, přičemž nová Junta oznámila, že převezme moc po smrti Kim Jong-ila. Nová Junta prohlásila, že šlo o převrat k zachování čistoty ideologie Juche na „silnou žádost korejského státu a národa“." # todo: NEW TRANSLATION
 kim_jong_il_death.6.a: "What does this have to do with us?" → "Co s tím máme společného?" # todo: NEW TRANSLATION
 kim_jong_il_death.6.b: "Surprising news, does this represent the complete demise of the Kim dynasty?" → "Překvapivá zpráva, znamená to úplný zánik dynastie Kimů?" # todo: NEW TRANSLATION
 kim_jong_il_death.6.c: "Oh God..." → "Ó Bože..." # todo: NEW TRANSLATION
 kim_jong_il_death.7.t: "Jang Song-thaek's Request" → "Žádost Jang Song-thaeka" # todo: NEW TRANSLATION
 kim_jong_il_death.7.d: "Jang Song-thaek's visit to China to meet with [CHI.GetLeader], hoping that China would intervene to help Kim Jong-nam gain power." → "Návštěva Jang Song-thaeka v Číně k setkání s [CHI.GetLeader], doufající, že Čína zasáhne a pomůže Kim Jong-namovi získat moc." # todo: NEW TRANSLATION
 kim_jong_il_death.7.a: "Tell Kim Jong-un this information." → "Řekněte Kimovi Jong-un tyto informace." # todo: NEW TRANSLATION
 kim_jong_il_death.7.b: "Do nothing. What does Kim Jong-un have to do with me?" → "Nic nedělej. Co s tím má Kim Jong-un společného?" # todo: NEW TRANSLATION
 NKO_united_front_department: "[Root.38th_parallel]" # todo: NEW TRANSLATION
 NKO_united_front_department_desc: "Since the end of the Second World War, Korea has been a divided nation. Ideological polarization and great power conflict have separated families and hindered the realization of the Korean people's full potential. In the South, while older generations still remember a united Korea and yearn for reunification, the memory of a united peninsula is gradually beginning to fade away.\n\n§YSupport for Reunification§!, together with South Korean §Yopinion§! of us and §YEmerging§! popularity in the South determines how much the South Korean people will be willing to concede in reunification negotiations. It decreases at a rate of 0.1% per month and is affected by decisions, focuses, and events. If or when reunification takes place, it will need to be kept high to ensure that the country stays together." → "Od konce druhé světové války je Korea rozdělena země. Ideologická polarizace a konflikt velmocí rozdělily rodiny a brání naplnění plného potenciálu korejského lidu. Na jihu si starší generace ještě vzpomínají na sjednocenou Koreu a touží po znovusjednocení; vzpomínka na sjednocený poloostrov postupně mizí.\n\n§YPodpora znovusjednocení§!, spolu s §Ynázorem§! jihu vůči nám a §Ynastupující§! popularitou na jihu určuje, kolik korejského lidu bude ochotno ustoupit v jednání o znovusjednocení. Snižuje se tempem 0,1 % za měsíc a ovlivňují ji rozhodnutí, zaměření a události. Pokud k znovusjednocení dojde, bude ji třeba udržet na vysoké úrovni, aby zůstala země pohromadě." # todo: NEW TRANSLATION
 NKO_close_kaesong_industrial_park: "Close Kaesong Industrial Park" → "Uzavřít Kaesongský průmyslový park" # todo: NEW TRANSLATION
 NKO_close_kaesong_industrial_park_desc: "Our counterparts across the DMZ cannot be trusted. We should close down the Kaesong Industrial Park to prevent them from benefitting off of it." → "Naši protějše napříč DMZ nemůžeme důvěřovat. Měli bychom uzavřít Kaesongský průmyslový park, aby z něj nemohli těžit." # todo: NEW TRANSLATION
 NKO_reopen_kaesong_industrial_park: "Reopen Kaesong Industrial Park" → "Znovu otevřít Kaesongský průmyslový park" # todo: NEW TRANSLATION
 NKO_reopen_kaesong_industrial_park_desc: "We must show our compatriots that we are willing to pursue better relations. To that end, we should reopen access to Kaesong Industrial Park." → "Musíme ukázat našim krajanům, že jsme ochotni usilovat o lepší vztahy. Za tímto účelem bychom měli znovu otevřít přístup k Kaesongskému průmyslovému parku." # todo: NEW TRANSLATION
 NKO_restart_peace_talks: "Restart Peace Talks" → "Obnovit mírové rozhovory" # todo: NEW TRANSLATION
 NKO_restart_peace_talks_desc: "The South has rebuffed our peace offer, but that does not mean we cannot try again. However, we should first try to do what we can to prevent a repeat of the failure of the previous talks." → "Jižní Korea naši nabídku na mír odmítla, ale to neznamená, že nemůžeme zkusit znovu. Nicméně bychom měli nejprve udělat, co můžeme, abychom zabránili opakování selhání předchozích jednání." # todo: NEW TRANSLATION
