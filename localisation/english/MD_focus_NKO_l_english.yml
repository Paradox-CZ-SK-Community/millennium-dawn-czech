 korea.40.t: "Povstalci povstali" # todo: NEW TRANSLATION
 korea.40.d: "Jižní Korea povstala; musíme ji podpořit a znovu získat zemi." # todo: NEW TRANSLATION
 korea.40.a: "DO VÁLKY!" # todo: NEW TRANSLATION
 korea.50.t: "Sjednocení Koreje bylo konečně dosaženo" # todo: NEW TRANSLATION
 korea.50.d: "Poté, co roky panovalo rozdělení, se Koreje podařilo dosáhnout sjednocení, což je historický okamžik v celosvětové historii. Dříve oddělené severní a jižní Koreje se spojily, překonaly desetiletí politických, ekonomických a kulturních rozdílů a vytvořily jednu jednotnou zemi. Tento významný okamžik značí novou éru míru, spolupráce a prosperity pro korejský lid a překreslí geopolitickou scénu východní Asie i světa." # todo: NEW TRANSLATION
 korea.50.a: "Hurá!!!" # todo: NEW TRANSLATION
 korea.50.b: "Východní Asie už nikdy nebude stejná." # todo: NEW TRANSLATION
 korea.51.t: "Postavte více farem" # todo: NEW TRANSLATION
 korea.51.d: "Korea nemůže být skvělá bez korejského lidu; musíme se soustředit na co nejrychlejší vyřešení hladomoru." # todo: NEW TRANSLATION
 korea.51.a: "Zemědělství v Pchjongjangu" # todo: NEW TRANSLATION
 korea.51.b: "Zemědělství v Hwanghae" # todo: NEW TRANSLATION
 korea.51.c: "Zemědělství v Chagang" # todo: NEW TRANSLATION
 korea.51.e: "Zemědělství v Hamgyong" # todo: NEW TRANSLATION
 korea.52.t: "Vylepšete naše chybějící zásobovací uzly" # todo: NEW TRANSLATION
 korea.52.d: "Náš velký vůdce poskytl prostředky na vybudování dalších železničních tratí a zásobovacího uzlu a zanechal nám volbu, zda se zaměřit na ambice ekonomické zóny, nebo připravit logistiku na válku." # todo: NEW TRANSLATION
 korea.52.a: "Zásobovat Korejskou stranu" # todo: NEW TRANSLATION
 korea.52.b: "Zásobovat Budoucí ekonomickou zónu" # todo: NEW TRANSLATION
 korea_russia.53.t: "Technologie ponorek" # todo: NEW TRANSLATION
 korea_russia.53.d: "Rusko nám dodalo lepší technologie, abychom mohli zdokonalit naše ponorky. Za to vše vděčíme snaze severokorejského vůdce vyvinout ponorky s jaderným pohonem." # todo: NEW TRANSLATION
 korea_russia.53.a: "Požehnán buď náš vůdce" # todo: NEW TRANSLATION
 korea.135.t: "Hackerská operace uspěla" # todo: NEW TRANSLATION
 korea.135.d: "Naši hackeři pronikli do bankovní infrastruktury západních zemí a odčerpali značné finanční prostředky. Část se ztratila v tajných kanálech používaných k převozu peněz domů, ale operace byla úspěšná." # todo: NEW TRANSLATION
 korea.135.a: "Skvělá práce" # todo: NEW TRANSLATION
 korea.136.t: "Severní Korea nás napadla hackerstvím" # todo: NEW TRANSLATION
 korea.136.d: "Severokorejští hackeři zahájili kybernetický útok na naši bankovní infrastrukturu s cílem odčerpat finanční prostředky. Měli bychom odvetně provést vlastní operace, nebo se obrátit na mezinárodní společenství." # todo: NEW TRANSLATION
 korea.136.a: "Nečekané" # todo: NEW TRANSLATION
 korea.137.t: "Drogy zaplavují naše ulice" # todo: NEW TRANSLATION
 korea.137.d: "Naše ulice zaplavila nová vlna drog. Zdroj zůstává nepotvrzený, ale musíme postupovat opatrně, produktivita již trpí." # todo: NEW TRANSLATION
 korea.137.a: "Podpořit závislé" # todo: NEW TRANSLATION
 korea.137.b: "Co můžeme dělat" # todo: NEW TRANSLATION
 korea.138.t: "Drogová operace uspěla." # todo: NEW TRANSLATION
 korea.138.d: "Ulice našich nepřátel zaplavila nová vlna drog. Budou muset vynaložit prostředky na zvládnutí krize, zatímco my získáme skromný zisk. Pokračující investice do agentury udrží tok peněz." # todo: NEW TRANSLATION
 korea.138.a: "Výborně!" # todo: NEW TRANSLATION
 korea.139.t: "Operace s padělanými dolary" # todo: NEW TRANSLATION
 korea.139.d: "Vytiskli jsme padělané stodolarové bankovky a prostřednictvím tajných kanálů je rozšíříme na zahraniční trhy. Výnosy vypereme přes naši síť černého trhu. Stabilní příjem z tohoto schématu bude financovat další operace." # todo: NEW TRANSLATION
 korea.139.a: "Výborně!" # todo: NEW TRANSLATION
 NKO_korean_russian_friendship: "Severokorejsko-ruská smlouva o komplexním strategickém partnerství" # todo: NEW TRANSLATION
 NKO_korean_russian_friendship_desc: "Smlouva o partnerství z roku 2024 spojuje Pchjongjang a Moskvu do paktu vzájemné bezpečnosti, přičemž každá strana se zavazuje přijít druhé na pomoc. Obchodní, energetická a technologická spolupráce se prohlubuje spolu s formálními zárukami." # todo: NEW TRANSLATION
 NKO_railway_ministry_idea: "Státní železnice Severní Koreje" # todo: NEW TRANSLATION
 NKO_korean_repair_frontline_workers: "Severokorejští pracovníci na frontě" # todo: NEW TRANSLATION
 NKO_korean_repair_frontline_workers_desc: "Podle partnerské smlouvy z roku 2024 pracují severokorejské dělnické brigády v týlových oblastech západních okresů Ruska na obnově železničních stanic, letišť, loděnic a zbrojních továren. Pchjongjang dostává za jejich nasazení hotovost a palivo." # todo: NEW TRANSLATION
 NKO_korean_repair_frontline_workers_sov: "Severokorejští pracovníci na frontě" # todo: NEW TRANSLATION
 NKO_korean_repair_frontline_workers_sov_desc: "Na ruská rekonstrukční pracoviště byly na základě státní smlouvy vyslány tisíce dělníků. Jejich mzdy se v tvrdé měně vracejí do Pchjongjangu, ale muži pocházejí ze stejného okruhu, z něhož KLA verbuje své vojáky." # todo: NEW TRANSLATION
 NKO_korean_repair_civil_workers: "Severokorejští civilní dělníci" # todo: NEW TRANSLATION
 NKO_korean_repair_civil_workers_desc: "Severokorejské stavební čety jsou přiděleny k civilní obnově v celém Rusku, kde opravují továrny, bydlení a silnice. Moskva hradí jejich náklady a platí Pchjongjangu za zakázku." # todo: NEW TRANSLATION
 NKO_korean_repair_civil_workers_sov: "Severokorejští civilní dělníci" # todo: NEW TRANSLATION
 NKO_korean_repair_civil_workers_sov_desc: "Civilní pracovní čety jsou na základě státních smluv umisťovány do ruských stavebních kombinátů. Jejich nasazení vydělává v zahraničí tvrdou měnu za cenu úbytku pracovních sil doma." # todo: NEW TRANSLATION
 SOV_NKO_base: "Ruská vojenská základna" # todo: NEW TRANSLATION
 NKO_korean_ratnik_conversion: "Aktualizované vybavení" # todo: NEW TRANSLATION
 NKO_korean_ratnik_conversion_desc: "Výstroj pěchoty Ratnik dodávaná Ruskem se dostává ke Korejské lidové armádě: neprůstřelné vesty, nosné vybavení, optika a oděvy do chladného počasí. Výbava představuje výrazné zlepšení oproti domácím dodávkám, což se odpovídajícím způsobem odráží v nákladech na její údržbu." # todo: NEW TRANSLATION
 NKO_joint_exercises_sov_idea: "Ruské–Severokorejské cvičení" # todo: NEW TRANSLATION
 NKO_joint_exercises_nko_idea: "Ruské–Severokorejské cvičení" # todo: NEW TRANSLATION
 NKO_china_economic_assistant: "Čínská ekonomická pomoc" # todo: NEW TRANSLATION
 NKO_china_economic_assistant_desc: "Čínská ekonomická pomoc Severní Koreji představuje zhruba polovinu veškeré čínské zahraniční pomoci. Peking poskytuje tuto pomoc přímo Pchjongjangu, čímž mu umožňuje obejít Organizaci spojených národů. Během období vážného nedostatku potravin mezi lety 1996 a 1998 Čína poskytovala bezpodmínečnou potravinovou pomoc Severní Koreji." # todo: NEW TRANSLATION
 CHI_china_economic_assistant: "Čínská ekonomická pomoc" # todo: NEW TRANSLATION
 CHI_china_economic_assistant_desc: "Čínská ekonomická pomoc Severní Koreji představuje zhruba polovinu veškeré čínské zahraniční pomoci. Peking poskytuje tuto pomoc přímo Pchjongjangu, čímž mu umožňuje obejít Organizaci spojených národů. Během období vážného nedostatku potravin mezi lety 1996 a 1998 Čína poskytovala bezpodmínečnou potravinovou pomoc Severní Koreji." # todo: NEW TRANSLATION
 NKO_rus_friend_category: "Ruská‑Severokorejská aliance" # todo: NEW TRANSLATION
 NKO_rus_friend_category_desc: "Historie vztahů mezi [NKO.GetFlag]§YKorea§! a [SOV.GetFlag]§YRussia§! sahá do desítek let, od prvního vztahu s §YRuské císařství§! po pomoc §RSovětského svazu§! během §Rválky§! se [KOR.GetFlag]§YSouth Korea§!. Nyní nastupuje čas §Gobnovit§! staré vztahy mezi zeměmi a pozvednout je na novou úroveň, aby se chyby minulosti neopakovaly." # todo: NEW TRANSLATION
