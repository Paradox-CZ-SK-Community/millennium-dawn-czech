 korea_russia.14.t: "Severní Korea navrhuje společný projekt lodí" # todo: NEW TRANSLATION
 korea_russia.14.d: "Severní Korea navrhuje vytvořit společný projekt v oblasti námořnictva. Severokorejské námořnictvo má v současnosti jen velmi zastaralé lodě, které nedovolí jeho flotile postavit se nepříteli v případě války. Nabídli nám sponzorovat vznik společného projektu lodí, aby vyhověl potřebám severokorejského námořnictva." # todo: NEW TRANSLATION
