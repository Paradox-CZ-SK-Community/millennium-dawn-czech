l_english:
 internal_factions_events.53.t: "Loajalita strany pod drobnohledem" # todo: NEW TRANSLATION
 internal_factions_events.53.d: "Komunistické kádry předložily vládě seznam byrokratických úředníků, které považují za ideologicky nespolehlivé. Požadují formální vyšetřování loajality a odstranění těch, kteří nesplňují stranické standardy." # todo: NEW TRANSLATION
 internal_factions_events.53.o1: "Provést čistku" # todo: NEW TRANSLATION
 internal_factions_events.53.o2: "Odmítnout jejich požadavky" # todo: NEW TRANSLATION
 internal_factions_events.53.o3: "Zahájit omezenou prověrku" # todo: NEW TRANSLATION
 internal_factions_events.54.t: "Kádry volají po kolektivizaci" # todo: NEW TRANSLATION
 internal_factions_events.54.d: "Komunistické kádry ztratily trpělivost se soukromými zemědělskými usedlostmi. Tlačí na vládu, aby zahájila kolektivizaci a sjednotila zemědělskou půdu pod státní kontrolou s cílem zvýšit efektivitu a ideologickou konformitu." # todo: NEW TRANSLATION
 internal_factions_events.54.o1: "Podpořit kolektivizaci" # todo: NEW TRANSLATION
 internal_factions_events.54.o2: "Odmítnout návrh" # todo: NEW TRANSLATION
 internal_factions_events.54.o3: "Prosazovat omezenou pozemkovou reformu" # todo: NEW TRANSLATION
 internal_factions_events.55.t: "Průmysl požaduje rozšíření přístavů" # todo: NEW TRANSLATION
 internal_factions_events.55.d: "Námořní průmysl předložil návrh na rozšíření přístavních zařízení podél pobřeží s argumentem, že přetížení je každoročně stojí miliony. Místní vlastníci půdy a urbanisté vznesli námitky s odkazem na obavy z vysídlování a narušení městského prostředí." # todo: NEW TRANSLATION
 internal_factions_events.55.o1: "Schválit rozšíření" # todo: NEW TRANSLATION
 internal_factions_events.55.o2: "Zamítnout návrh" # todo: NEW TRANSLATION
 internal_factions_events.55.o3: "Vyjednat kompromis" # todo: NEW TRANSLATION
 internal_factions_events.56.t: "Pirátství narušuje námořní trasy" # todo: NEW TRANSLATION
 internal_factions_events.56.d: "Nárůst pirátství ohrožuje naše obchodní námořní trasy. Zástupci námořního průmyslu požadují zásah vlády na ochranu svých plavidel a nákladu a varují, že nečinnost zvýší náklady na pojištění a odradí investice." # todo: NEW TRANSLATION
 internal_factions_events.56.o1: "Financovat program námořních eskort" # todo: NEW TRANSLATION
 internal_factions_events.56.o2: "Ignorovat problém" # todo: NEW TRANSLATION
 internal_factions_events.56.o3: "Usilovat o mezinárodní spolupráci" # todo: NEW TRANSLATION
 internal_factions_events.57.t: "Odhalena síť zahraniční špionáže" # todo: NEW TRANSLATION
 internal_factions_events.57.d: "Zpravodajští analytici odhalili síť zahraničních špionů působící na našem území. Zpravodajská komunita tlačí na vládu, aby rozhodně zasáhla dříve, než síť získá další utajované informace." # todo: NEW TRANSLATION
 internal_factions_events.57.o1: "Veřejně odhalit síť" # todo: NEW TRANSLATION
 internal_factions_events.57.o2: "Tiše ji zneškodnit" # todo: NEW TRANSLATION
 internal_factions_events.57.o3: "Nepodnikat žádné kroky" # todo: NEW TRANSLATION
 internal_factions_events.58.t: "Zákonodárný sbor zpochybňuje výdaje na zpravodajství" # todo: NEW TRANSLATION
 internal_factions_events.58.d: "Před nadcházejícím volebním obdobím vznesli členové zákonodárného sboru důrazné otázky ohledně neprůhledného rozpočtu zpravodajských služeb. Občanské iniciativy volají po větší odpovědnosti, zatímco zpravodajská komunita varuje, že transparentnost ohrozí probíhající operace." # todo: NEW TRANSLATION
 internal_factions_events.58.o1: "Plně obhájit rozpočet" # todo: NEW TRANSLATION
 internal_factions_events.58.o2: "Zveřejnit část informací" # todo: NEW TRANSLATION
 internal_factions_events.58.o3: "Zavázat se k úplné transparentnosti" # todo: NEW TRANSLATION
 internal_factions_events.59.t: "Zahraniční bojovníci překračují hranici" # todo: NEW TRANSLATION
 internal_factions_events.59.d: "Vlna zahraničních bojovníků překročila naše území, přilákána probíhajícím konfliktem. Nabízejí své služby naší věci, ačkoli jejich spolehlivost a disciplína zůstávají nejisté. Zahraniční džihádistické sítě naléhají na vládu, aby jim našla uplatnění." # todo: NEW TRANSLATION
 internal_factions_events.59.o1: "Začlenit je do pravidelných jednotek" # todo: NEW TRANSLATION
 internal_factions_events.59.o2: "Okamžitě je nasadit na frontu" # todo: NEW TRANSLATION
 internal_factions_events.59.o3: "Odmítnout je na hranici" # todo: NEW TRANSLATION
 internal_factions_events.60.t: "Džihádistické brigády požadují autonomii" # todo: NEW TRANSLATION
 internal_factions_events.60.d: "Povzbuzeny rostoucími počty požadují zahraniční džihádistické brigády formální uznání jako autonomní síla působící pod vlastním velením. Tvrdí, že operační nezávislost jim umožní jednat účinněji bez byrokratických zásahů." # todo: NEW TRANSLATION
 internal_factions_events.60.o1: "Udělit jim operační autonomii" # todo: NEW TRANSLATION
 internal_factions_events.60.o2: "Odmítnout žádost" # todo: NEW TRANSLATION
 internal_factions_events.60.o3: "Začlenit je do národního velení" # todo: NEW TRANSLATION
 internal_factions_events.61.t: "Jednotky Quds žádají více zdrojů" # todo: NEW TRANSLATION
 internal_factions_events.61.d: "Vedení jednotek Quds předložilo formální žádost o dodatečné financování a materiál k rozšíření regionálních operací prostřednictvím zástupných sil. Tvrdí, že strategická příležitost nastala právě nyní a nedostatečné financování by mohlo vést ke ztrátě vlivu ve prospěch konkurenčních mocností." # todo: NEW TRANSLATION
 internal_factions_events.61.o1: "Poskytnout plné financování" # todo: NEW TRANSLATION
 internal_factions_events.61.o2: "Nabídnout částečnou podporu" # todo: NEW TRANSLATION
 internal_factions_events.61.o3: "Odmítnout žádost" # todo: NEW TRANSLATION
 internal_factions_events.62.t: "Zranitelnost souseda" # todo: NEW TRANSLATION
 internal_factions_events.62.d: "Zpravodajské zprávy jednotek Quds uvádějí, že sousední stát, který je nyní zmítán konfliktem, je zranitelný vůči nátlaku prostřednictvím zástupných sil. Okno příležitosti je úzké, ale potenciální strategické zisky jsou značné." # todo: NEW TRANSLATION
 internal_factions_events.62.o1: "Využít situaci" # todo: NEW TRANSLATION
 internal_factions_events.62.o2: "Sdílet zpravodajské informace se spřátelenými státy" # todo: NEW TRANSLATION
 internal_factions_events.62.o3: "Nechat příležitost projít" # todo: NEW TRANSLATION
 establish_political_commissars_decision: "Rozmístit politické komisaře" # todo: NEW TRANSLATION
 establish_political_commissars_decision_desc: "Rozmístit stranické komisaře v rámci vojenských jednotek, aby prosazovali ideologickou loajalitu a zvyšovali morálku. Komisaři budou podávat zprávy přímo komunistickým kádrům, čímž posílí jejich vliv nad ozbrojenými silami." # todo: NEW TRANSLATION
 worker_reeducation_programme_decision: "Program převýchovy dělníků" # todo: NEW TRANSLATION
 worker_reeducation_programme_decision_desc: "Financovat státní program převýchovy, který posílí stranickou ideologii mezi pracovní silou. Poslušnost vzroste a spotřebitelská poptávka klesne, protože dělníci přesměrují své úsilí ke státním prioritám." # todo: NEW TRANSLATION
 maritime_safety_inspections_decision: "Povinné kontroly námořní bezpečnosti" # todo: NEW TRANSLATION
 maritime_safety_inspections_decision_desc: "Zavést komplexní režim bezpečnostních kontrol ve všech domácích přístavních a loděničních zařízeních. Vyšší standardy uklidní průmysl a během kontrolního období zlepší výkon loděnic." # todo: NEW TRANSLATION
 naval_shipping_subsidy_decision: "Dotace námořní dopravy" # todo: NEW TRANSLATION
 naval_shipping_subsidy_decision_desc: "Poskytnout přímé vládní dotace domácím provozovatelům dálkové námořní dopravy. Program prodlouží operační dosah naší obchodní flotily a zvýší průchodnost loděnic." # todo: NEW TRANSLATION
 counter_intelligence_sweep_decision: "Kontrarozvědná prověrka" # todo: NEW TRANSLATION
 counter_intelligence_sweep_decision_desc: "Pověřit zpravodajskou komunitu systematickou prověrkou vládních a vojenských sítí s cílem odhalit zahraniční průnik. Náklady zahraniční špionáže klesnou a během operace se zlepší bezpečnost naší komunikace." # todo: NEW TRANSLATION
 expand_intelligence_network_decision: "Rozšířit zpravodajské sítě" # todo: NEW TRANSLATION
 expand_intelligence_network_decision_desc: "Financovat zřízení nových zámořských zpravodajských stanic a sítí lidských zdrojů. Rozšířená síť zlepší naši schopnost dešifrovat nepřátelskou komunikaci a sledovat pohyby zahraničních armád." # todo: NEW TRANSLATION
 jihadi_recruitment_drive_decision: "Náborová kampaň džihádistů" # todo: NEW TRANSLATION
 jihadi_recruitment_drive_decision_desc: "Sponzorovat aktivní náborovou kampaň napříč sympatizujícími sítěmi s cílem přilákat zahraniční bojovníky k naší věci. Přibude další živá síla a rozšíří se kapacita našich speciálních sil." # todo: NEW TRANSLATION
 martyr_glorification_campaign_decision: "Kampaň oslavující mučedníky" # todo: NEW TRANSLATION
 martyr_glorification_campaign_decision_desc: "Zahájit propagandistickou kampaň oslavující padlé bojovníky a vyzdvihující mučednictví jako kulturní ideál. Válečný zápal prudce vzroste, avšak radikalizující poselství může rozdmýchat extremistické nálady." # todo: NEW TRANSLATION
 support_proxy_networks_decision: "Podpořit sítě zástupných sil" # todo: NEW TRANSLATION
 support_proxy_networks_decision_desc: "Směrovat finanční prostředky a vybavení prostřednictvím jednotek Quds regionálním zástupným skupinám působícím v sousedních státech. Posílení těchto sítí rozšíří náš strategický dosah a sníží přímé náklady na udržování tlaku na soupeře." # todo: NEW TRANSLATION
 quds_force_training_programme_decision: "Výcvikový program jednotek Quds" # todo: NEW TRANSLATION
 quds_force_training_programme_decision_desc: "Pověřit jednotky Quds pokročilým výcvikem nepravidelného válčení pro vybrané vojenské jednotky. Zlepší se schopnosti nekonvenčního válčení a rozšíří se kapacita speciálních sil." # todo: NEW TRANSLATION
 internal_factions_events.63.t: "Dodavatelé lobbují za exportní kontrakty" # todo: NEW TRANSLATION
 internal_factions_events.63.d: "Dodavatelé obranného průmyslu tlačí na vládu, aby podpořila sérii zámořských kontraktů na vývoz zbraní. Tvrdí, že tyto dohody přinesou značné příjmy a udrží domácí výrobní linky v provozu, kritici však varují, že rozsáhlý prodej může vyhrotit regionální napětí a přitáhnout nežádoucí mezinárodní pozornost." # todo: NEW TRANSLATION
 internal_factions_events.63.o1: "Schválit úplný vývoz" # todo: NEW TRANSLATION
 internal_factions_events.63.o2: "Omezit prodej na spojenecké odběratele" # todo: NEW TRANSLATION
 internal_factions_events.63.o3: "Odmítnout lobbistické úsilí" # todo: NEW TRANSLATION
 defense_procurement_programme_decision: "Program obranných zakázek" # todo: NEW TRANSLATION
 defense_procurement_programme_decision_desc: "Zahájit specializovaný cyklus nákupů, který domácím výrobcům zbraní zaručí pravidelné objednávky. Trvalé kontrakty zvýší daňové příjmy vojenského průmyslu a sníží zátěž v podobě spotřebního zboží, čímž odmění obranný průmysl za jeho pokračující spolupráci." # todo: NEW TRANSLATION
 classified_research_programme_decision: "Program utajovaného výzkumu" # todo: NEW TRANSLATION
 classified_research_programme_decision_desc: "Vyčlenit utajované prostředky na výzkum vojenských technologií prováděný prostřednictvím partnerů z obranného průmyslu. Investice urychlí výzkumnou činnost a posílí bezpečnost komunikace, přičemž při zahájení programu dojde k finančnímu převodu." # todo: NEW TRANSLATION
 issue_government_bonds_decision: "Vydat státní dluhopisy kryté bankami" # todo: NEW TRANSLATION
 issue_government_bonds_decision_desc: "Pověřit vydáním státních dluhopisů krytých bankami, které budou spravovány prostřednictvím mezinárodních bankovních sítí. Okamžitý příliv kapitálu zvýší stabilitu, avšak obsluha dluhu po dobu trvání programu mírně zvýší úrokové sazby." # todo: NEW TRANSLATION
 attract_foreign_investment_decision: "Přilákat zahraniční investice" # todo: NEW TRANSLATION
 attract_foreign_investment_decision_desc: "Koordinovat postup s mezinárodními bankovními kontakty s cílem signalizovat stabilitu a snížit překážky vstupu. Kampaň zkrátí dobu potřebnou k získání zahraničních investic a zvýší daňové příjmy z přílivu kapitálu." # todo: NEW TRANSLATION
 internal_factions_cadre_purge: "Čistka kádrů" # todo: NEW TRANSLATION
 internal_factions_cadre_purge_desc: "Straničtí komisaři provádějí prověrky loajality napříč byrokracií, čímž posilují ideologickou disciplínu za cenu narušení administrativy." # todo: NEW TRANSLATION
 internal_factions_collectivisation_drive: "Kampaň kolektivizace" # todo: NEW TRANSLATION
 internal_factions_collectivisation_drive_desc: "Probíhá kolektivizace zemědělství, která narušuje dodavatelské řetězce a zvyšuje nedostatek spotřebního zboží, zatímco soukromé farmy přecházejí pod státní kontrolu." # todo: NEW TRANSLATION
 internal_factions_convoy_escort: "Program námořních eskort" # todo: NEW TRANSLATION
 internal_factions_convoy_escort_desc: "Vládou financované námořní eskorty chrání obchodní námořní trasy, čímž zvyšují sebejistotu a zkušenosti našeho námořního personálu." # todo: NEW TRANSLATION
 internal_factions_piracy_losses: "Narušení způsobené pirátstvím" # todo: NEW TRANSLATION
 internal_factions_piracy_losses_desc: "Nekontrolované pirátství narušuje naše námořní trasy, podkopává důvěru v obchod a destabilizuje širší ekonomiku." # todo: NEW TRANSLATION
 internal_factions_neutralised_spies: "Špionážní síť rozložena" # todo: NEW TRANSLATION
 internal_factions_neutralised_spies_desc: "Zahraniční zpravodajská síť byla tiše zneškodněna, což na určitou dobu zlepšilo naše schopnosti v boji proti špionáži." # todo: NEW TRANSLATION
 internal_factions_transparency_costs: "Náklady zpravodajské transparentnosti" # todo: NEW TRANSLATION
 internal_factions_transparency_costs_desc: "Veřejné zveřejnění zpravodajských operací oslabilo bezpečnost našeho šifrování, protože protivníci se přizpůsobují nově odhaleným metodám." # todo: NEW TRANSLATION
 internal_factions_jihadi_frontline: "Nasazení džihádistů na frontě" # todo: NEW TRANSLATION
 internal_factions_jihadi_frontline_desc: "Zahraniční bojovníci nasazení přímo na frontě agresivně tlačí na nepřátelské linie, jejich nedostatečné začlenění do pravidelných sil však ponechává křídla odkrytá." # todo: NEW TRANSLATION
 internal_factions_jihadi_autonomy: "Autonomní džihádistické síly" # todo: NEW TRANSLATION
 internal_factions_jihadi_autonomy_desc: "Uznané autonomní džihádistické brigády působí pod vlastním velením, čímž výrazně rozšiřují strop našich speciálních sil." # todo: NEW TRANSLATION
 internal_factions_jihadi_integrated: "Integrované džihádistické síly" # todo: NEW TRANSLATION
 internal_factions_jihadi_integrated_desc: "Zahraniční bojovníci formálně začlenění do struktury národního velení zlepšili soudržnost jednotek a rychlost obnovy organizace." # todo: NEW TRANSLATION
 internal_factions_quds_expanded: "Rozšířené operace jednotek Quds" # todo: NEW TRANSLATION
 internal_factions_quds_expanded_desc: "Dodatečné zdroje umožnily jednotkám Quds rozšířit operace prostřednictvím zástupných sil, čímž se snížily náklady na údržbu zahraničních podvratných aktivit." # todo: NEW TRANSLATION
 internal_factions_quds_operation: "Strategická operace jednotek Quds" # todo: NEW TRANSLATION
 internal_factions_quds_operation_desc: "Jednotky Quds aktivně využívají nestability v sousedním státě, čímž poskytují taktickou výhodu v probíhajících operacích." # todo: NEW TRANSLATION
 fund_religious_schools_decision: "Financovat náboženské školy" # todo: NEW TRANSLATION
 fund_religious_schools_decision_desc: "Směrovat vládní financování do sítě náboženských škol působících pod dohledem wahhábitských ulemů. S rozšiřováním jejich působnosti se zlepší gramotnost a vzroste sociální stabilita." # todo: NEW TRANSLATION
 enforce_moral_codes_decision: "Prosazovat morální zásady" # todo: NEW TRANSLATION
 enforce_moral_codes_decision_desc: "Zmocnit náboženské autority k prosazování veřejných morálních standardů v celé zemi. Opatření posílí vliv ulemů a zvýší sociální soudržnost, ačkoli přísnější omezení mírně zvýší spotřebitelské výdaje." # todo: NEW TRANSLATION
 agricultural_subsidies_decision: "Zemědělské dotace" # todo: NEW TRANSLATION
 agricultural_subsidies_decision_desc: "Poskytnout přímé dotace zemědělskému sektoru s cílem zvýšit produkci a odměnit frakci zemědělců za její spolupráci. Počáteční výdaje sníží státní rezervy, ale zvýšení produktivity udrží ekonomiku v chodu po dobu programu." # todo: NEW TRANSLATION
 rural_infrastructure_fund_decision: "Fond venkovské infrastruktury" # todo: NEW TRANSLATION
 rural_infrastructure_fund_decision_desc: "Vyčlenit vládní prostředky na zlepšení silnic, zavlažování a skladování ve venkovských oblastech. Investice sníží pracovní zátěž zemědělských okresů a získá přízeň zemědělských komunit." # todo: NEW TRANSLATION
 infrastructure_investment_programme_decision: "Program investic do infrastruktury" # todo: NEW TRANSLATION
 infrastructure_investment_programme_decision_desc: "Spolupracovat s velkými průmyslovými konglomeráty na financování rozsáhlého vylepšení infrastruktury napříč výrobní základnou země. Po dobu programu vzroste výroba továren a kanceláří, čímž se upevní role konglomerátů jako pilíře ekonomiky." # todo: NEW TRANSLATION
