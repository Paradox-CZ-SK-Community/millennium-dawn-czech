l_english:
 greenland_focus: "Strom zaměření Grónska" # todo: NEW TRANSLATION
 GRN_intro_to_greenland_shortcut: "Úvod do Grónska" # todo: NEW TRANSLATION
 GRN_greenland_foreign_policy_tree: "Zahraniční politika Grónska" # todo: NEW TRANSLATION
 GRN_focus_The_Great_Ice_Island: "Velký ledový ostrov" # todo: NEW TRANSLATION
 GRN_focus_The_Great_Ice_Island_desc: "Grónsko je po technicky vzato kontinentální Austrálii jedním z největších známých ostrovů na světě. Na ostrově žije přibližně 58 tisíc obyvatel, kteří pocházejí především z kulturní skupiny Inuitů. Grónsko je považováno za poslední velkou hranici rozvoje Země, hned po aktivní snaze něco podniknout se samotným severním či jižním pólem planety. Nyní, v 21. století, se Grónsko a jeho obyvatelé považují za poslední skutečnou kolonii a aktivně usilují o skutečnou nezávislost. Najdou však konečně svobodu, nebo selžou při dokazování, že ostrov dokáže skutečně stát na vlastních nohou?" # todo: NEW TRANSLATION
 GRN_focus_The_People: "Lidé" # todo: NEW TRANSLATION
 GRN_focus_The_People_desc: "Jedním z hlavních problémů, kterými náš národ trpí, je nedostatek lidí. Lidé potřebují jídlo, přístřeší a veřejné služby, které se o ně postarají a pomohou jim v nouzi. Proto se musíme těmito body zabývat, abychom zajistili budoucnost, ve které budou lidé chtít do našeho národa přicházet a zůstávat v něm. Musíme vytvořit vlastní budoucnost na místě, které se může zdát bez budoucnosti." # todo: NEW TRANSLATION
 GRN_focus_Food_Security: "Potravinová bezpečnost" # todo: NEW TRANSLATION
 GRN_focus_Food_Security_desc: "Naším hlavním zdrojem potravy na ostrově je rybolov. Rybolov je však zároveň hlavním ekonomickým úzkým hrdlem, takže jak se můžeme uživit, když dovážíme tytéž produkty? Právě toto je jeden z klíčových pilířů, které musíme vybudovat, chceme-li mít jakoukoli stabilní budoucnost." # todo: NEW TRANSLATION
 GRN_focus_Breaking_Ground_For_Farmlands: "Příprava půdy pro „zemědělské oblasti“" # todo: NEW TRANSLATION
 GRN_focus_Breaking_Ground_For_Farmlands_desc: "Projekty skleníků a vertikálního zemědělství. Tyto základní prvky budou základem nových potravinových zásob našeho národa, a proto musíme vytvořit zařízení pro pěstování a produkci těchto potravin. Tento proces bude energeticky náročný, ale pokud vybudujeme infrastrukturu a znovu se podíváme na naše zdroje, mohli bychom dát dohromady základy a rozjet celý projekt." # todo: NEW TRANSLATION
 GRN_focus_East_Farmland_Projects: "Projekty východních „zemědělských oblastí“" # todo: NEW TRANSLATION
 GRN_focus_East_Farmland_Projects_desc: "Stejně jako při naší počáteční západní zakládací práci budeme muset totéž provést na východě. Malá potravinová centra pomohou s logistikou a distribucí po celém národě i mezi našimi poměrně rozptýlenými osadami." # todo: NEW TRANSLATION
 GRN_focus_Growing_Staple_Foods: "Pěstování základních plodin" # todo: NEW TRANSLATION
 GRN_focus_Growing_Staple_Foods_desc: "Naše rané pokroky v náročných zemědělských projektech povedou prozatím především k pěstování základních potravin. Brambory, pšenice a menší množství klíčových potravin, které pomáhají s příjmem kalorií a lze je snadno využít k přípravě vydatných jídel." # todo: NEW TRANSLATION
 GRN_focus_Strategic_Cash_Crops: "Strategické tržní plodiny" # todo: NEW TRANSLATION
 GRN_focus_Strategic_Cash_Crops_desc: "Program SCC představuje omezenou část našich nových HFP, protože při snaze posílit domácí potravinové zásoby se můžeme zaměřit také na omezené tržní plodiny, jako je bavlna, a tím podpořit i domácí průmyslový růst." # todo: NEW TRANSLATION
 GRN_focus_National_Seed_Vault: "Národní trezor semen" # todo: NEW TRANSLATION
 GRN_focus_National_Seed_Vault_desc: "Jak rozšiřujeme naše HFP v celostátním měřítku i v místních provozech, musíme být schopni diverzifikovat a rozšířit druhy plodin, které dokážeme pěstovat. Proto vytvoříme národní trezor semen, který bude uchovávat a náležitě distribuovat střídající se plodiny, aby si náš národ mohl užít co nejvíce hojnosti světa." # todo: NEW TRANSLATION
 GRN_focus_Stable_Population_Growth: "Stabilní růst populace" # todo: NEW TRANSLATION
 GRN_focus_Stable_Population_Growth_desc: "Náš národ po celou dobu své existence trpěl neschopností stabilizovat svou populaci. Mnozí utíkají kvůli drsným podmínkám nebo touze poznat širý svět. Buďme upřímní, nemůžeme jim vyčítat, že chtějí v životě více, ale můžeme si vyčítat, že jsme nepracovali na tom, abychom lidem dali důvody zůstat. S počasím nic nezmůžeme, ale můžeme rozvíjet města a osady tak, aby byly přesvědčivějším důvodem pro setrvání a zvelebování domova." # todo: NEW TRANSLATION
 GRN_focus_Planning_New_Settlements: "Plánování nových osad" # todo: NEW TRANSLATION
 GRN_focus_Planning_New_Settlements_desc: "Schopnost růstu naší populace je omezována nedostatkem vhodného bydlení a celkového plánování nových měst. Vše se většinou soustředí kolem hlavního města Nuuku, takže v těchto raných fázích plánování a rozvoje budeme muset prozatím využívat hlavní město jako základnu pro přepravu logistiky." # todo: NEW TRANSLATION
 GRN_focus_Spread_Settlement_Planning_East: "Rozšíření plánování osad na východ" # todo: NEW TRANSLATION
 GRN_focus_Spread_Settlement_Planning_East_desc: "Zatímco hlavní město Nuuk je naší logistickou základnou pro západní část ostrova, budeme muset založit jakési „východní hlavní město“. Východní polovina tak získá logistické centrum pro plánování a distribuci rozvoje osad a růstu obou hlavních oblastí národa." # todo: NEW TRANSLATION
 GRN_focus_New_Hope_Settlement: "Osada Nová naděje" # todo: NEW TRANSLATION
 GRN_focus_New_Hope_Settlement_desc: "Ve snaze zajistit lepší zítřek, lepší budoucnost a jednoduše lepší život pro naše občany se pustíme do založení zcela nové centrální severozápadní osady jménem Neriunneq nutaaq, což se do angličtiny přibližně překládá jako Nová naděje. Chceme z ní učinit maják našeho pokroku při rozvoji národa a západní poloviny ostrova." # todo: NEW TRANSLATION
 GRN_focus_Great_Star_Settlement: "Osada Velká hvězda" # todo: NEW TRANSLATION
 GRN_focus_Great_Star_Settlement_desc: "Abychom se pokusili rovnoměrně rozprostřít náš rozvoj a zajistili rovnoměrné logistické potřeby v rámci pokračujícího rozvoje, vytvoříme východní osadu přibližně ve stejné zeměpisné oblasti jako západní osadu. Ponese jméno Annertuumik Stjerne, což se do angličtiny přibližně překládá jako Velká hvězda nebo „Velká hvězda“. Doufáme, že ji využijeme jako hlavní východní základnu pro šíření rozvojového úsilí, zatímco budeme podporovat růst pobřeží a obracet se do vnitrozemí směrem k Velkému ledovému šelfu." # todo: NEW TRANSLATION
 GRN_focus_Development_Living_Grants: "Rozvojové životní granty" # todo: NEW TRANSLATION
 GRN_focus_Development_Living_Grants_desc: "Program DLG je vládní grant, jehož cílem je podpořit přistěhovalectví do našeho národa. Základním principem je, že grant pokryje cestovní a osidlovací náklady. Jakmile se jednotlivec či skupina usadí a podaří se jim najít práci se stabilním příjmem, grant přestane být vyplácen. V podstatě jde o investici do lidských zdrojů, která má podpořit růst populace prostřednictvím aktivního rozvoje národa." # todo: NEW TRANSLATION
 GRN_focus_Developing_Public_Services: "Rozvoj veřejných služeb" # todo: NEW TRANSLATION
 GRN_focus_Developing_Public_Services_desc: "Zlepšení a rozšíření našich veřejných systémů a infrastruktury výrazně zvýší kvalitu života našich občanů. Provedeme řadu menších vylepšení ve vzdělávání, zdravotnictví a sociální péči a zároveň vytvoříme bezpečnější internetové služby pro budoucnost našeho národa." # todo: NEW TRANSLATION
 GRN_focus_Recruiting_More_Teachers: "Nábor dalších učitelů" # todo: NEW TRANSLATION
 GRN_focus_Recruiting_More_Teachers_desc: "Velkým problémem našeho vzdělávacího systému je nedostatek učitelů. Vzhledem k tomu, že na jednoho učitele připadá stále více žáků, mnoho studentů odchází ze školy jednoduše proto, že nemají skutečnou možnost se učit. Proto musíme nabírat a přilákat více domácích i zahraničních učitelů, kteří nám pomohou vzdělávat a rozvíjet naše děti. Tento klíč snad odemkne jasnější budoucnost pro všechny, kteří chtějí získat vzdělání a dále růst." # todo: NEW TRANSLATION
 GRN_focus_Improving_Medical_Stockpiles: "Zlepšení zásob zdravotnického materiálu" # todo: NEW TRANSLATION
 GRN_focus_Improving_Medical_Stockpiles_desc: "Léky, personál a vybavení. To jsou hlavní věci, které potřebujeme, abychom se mohli řádně starat o zdravotní potřeby našich občanů. Proto musíme zlepšit skladovací kapacity a manipulaci se zásobami, abychom dokázali uspokojit všechny potřeby, které mohou nastat." # todo: NEW TRANSLATION
 GRN_focus_Creating_Concentrated_Internet_Services: "Vytvoření soustředěných internetových služeb" # todo: NEW TRANSLATION
 GRN_focus_Creating_Concentrated_Internet_Services_desc: "Přístup k internetu je jako celek prakticky základním prvkem moderních společností a rozvinutých ekonomik. Musíme vytvořit omezené formy internetové infrastruktury, aby se náš národ mohl lépe propojit s širším světem. Naši občané i veřejné služby mohou také pasivně těžit z efektivity, kterou internetové služby v určitých oblastech poskytují." # todo: NEW TRANSLATION
 GRN_focus_Recruiting_More_Social_Workers: "Nábor dalších sociálních pracovníků" # todo: NEW TRANSLATION
 GRN_focus_Recruiting_More_Social_Workers_desc: "Zlepšení počtu i kvality zaměstnanců zajistí, že naše sociální služby budou držet krok s potřebami národa, jehož populace může díky našemu rozvoji růst. Náklady jsou sice důvodem k obavám, ale neznamenají nic, pokud nakonec lidi odradíme od příchodu tím, že budou vědět, že se o ně v opravdové nouzi nikdo nepostará." # todo: NEW TRANSLATION
 GRN_focus_Basic_Eastern_Roadworks: "Základní práce na východních silnicích" # todo: NEW TRANSLATION
 GRN_focus_Basic_Eastern_Roadworks_desc: "Východ je méně rozvinutým regionem národa, proto bychom mu měli pomoci zlepšením logistické podpory prostřednictvím lepších silnic. Nejde sice o nejvyšší prioritu, ale s pokračujícím rozvojem a růstem regionu bude prospěšné předem položit základy, kterými se bude moci řídit." # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_Economy: "Grónská ekonomika" # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_Economy_desc: "Lidé potřebují materiály, způsob obživy a možnost pracovat a vydělávat si na živobytí. Rozvoj ekonomiky, schopnost těžit zdroje a budování infrastruktury, která tyto činnosti podpoří, proto musí být naplánovány a financovány." # todo: NEW TRANSLATION
 GRN_focus_Economic_Diversification: "Diverzifikace ekonomiky" # todo: NEW TRANSLATION
 GRN_focus_Economic_Diversification_desc: "Vzhledem k omezením, kterým náš národ čelí, musíme položit základy pro rozšíření ekonomických možností. Pouhý rybolov nebo téměř feudální způsoby hospodářského přežití národ ani jeho obyvatele nikam neposunou. Musíme to napravit." # todo: NEW TRANSLATION
 GRN_focus_Western_Zoning: "Zónování západu" # todo: NEW TRANSLATION
 GRN_focus_Western_Zoning_desc: "Hlavní město leží na západě, takže počáteční fáze zónování a rozvoje zahájíme právě zde. Průzkum stability půdy, potřeb a možností pro spuštění specializovaného průmyslu bude stát mnohem více než obvykle. Pokud však chceme čelit živlům v jejich nejkrutější podobě, musíme tuto cenu přijmout a pochopit." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Groundworks: "Přípravné práce na východě" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Groundworks_desc: "Pokud se chceme ekonomicky posunout, dosáhnout růstu populace nebo přinejmenším stability, musíme využít veškerou dostupnou půdu. Proto bude v těchto raných fázích plánování zásadní zahájit přípravné práce na našich východních projektech." # todo: NEW TRANSLATION
 GRN_focus_Basic_Industrialization: "Základní industrializace" # todo: NEW TRANSLATION
 GRN_focus_Basic_Industrialization_desc: "Po dokončení přípravných prací a zónování můžeme založit malou, ale zásadní výrobu, kterou bude národ v budoucnu potřebovat. Dokud samozřejmě nevyřešíme těžbu, budeme se muset spoléhat na dovoz materiálů. Díky bohu, že k tomu můžeme využít naše spojení s EU prostřednictvím Dánska." # todo: NEW TRANSLATION
 GRN_focus_Basic_Coastal_Manufacturing: "Základní pobřežní výroba" # todo: NEW TRANSLATION
 GRN_focus_Basic_Coastal_Manufacturing_desc: "Vedle podpory stávajícího rybolovu můžeme také vytvořit podmínky pro výrobu vlastních obchodních plavidel, která bychom mohli využívat při jednání s Dánskem i s těmi, kteří nám chtějí pomoci rozvíjet a budovat náš národ." # todo: NEW TRANSLATION
 GRN_focus_Babys_First_Economy: "První krůčky ekonomiky" # todo: NEW TRANSLATION
 GRN_focus_Babys_First_Economy_desc: "Nyní máme základ, který připraví půdu pro příchod a práci lidí. Teď už jen musíme vybudovat infrastrukturu na jejich podporu a vyřešit přibližně sedm dalších kritických problémů, které národ stagnují. Ale pomalu, krok za krokem, jednou se tam dostaneme." # todo: NEW TRANSLATION
 GRN_focus_Infrastructure_Development: "Rozvoj infrastruktury" # todo: NEW TRANSLATION
 GRN_focus_Infrastructure_Development_desc: "Nejlepším způsobem, jak propojit a rozvíjet náš národ, je vytvořit standardizovanou a flexibilní infrastrukturu. Za tímto účelem budeme muset najmout odborníky na geologii, inženýrství a další obory, aby naplánovali potřebné typy infrastruktury. Také musíme zjistit, jak ji co nejlépe rozvíjet a naplánovat na co nejdelší dobu, než budou nutné zásadní opravy." # todo: NEW TRANSLATION
 GRN_focus_The_Network_Debate: "Debata o síti" # todo: NEW TRANSLATION
 GRN_focus_The_Network_Debate_desc: "Vybudování řádné silniční sítě bude stejně náročné jako prakticky cokoli dalšího, o co se pokusíme. Proto budeme muset provést průzkum a položit základy toho, jak budou naše silnice vypadat. Začneme v hlavním městě Nuuku, čímž stanovíme standard a vytvoříme alespoň v západních pobřežních oblastech tepající srdce, které bude rozvádět zdroje a lidi po celé zemi." # todo: NEW TRANSLATION
 GRN_focus_Narrow_Gauge_Standard: "Standard úzkého rozchodu" # todo: NEW TRANSLATION
 GRN_focus_Narrow_Gauge_Standard_desc: "Vytvoření národního standardu pro železniční vybavení a dopravu určí tempo i základní náklady budoucího rozvoje železnic. Úzký rozchod nám umožní větší flexibilitu v terénu, je levnější z hlediska výstavby i údržby a zároveň bude nákladově efektivnější řádně zabezpečit konstrukci a základy železničního lože." # todo: NEW TRANSLATION
 GRN_focus_Capital_Course: "Trať z hlavního města" # todo: NEW TRANSLATION
 GRN_focus_Capital_Course_desc: "Začátek v hlavním městě a rozvětvení do menších osad umožní pohodlnější cestování a lepší propojení na střední vzdálenosti. Samozřejmě jde jen o jediný krok, ale i při chůzi přes místnost musíte nejdříve položit jednu nohu před druhou." # todo: NEW TRANSLATION
 GRN_focus_Nuuk_Western_Railway: "Západní železnice Nuuku" # todo: NEW TRANSLATION
 GRN_focus_Nuuk_Western_Railway_desc: "Po založení NWR v Grónsku můžeme nyní lépe propojit rozptýlené osady v okolí hlavního města a zároveň tento projekt využít jako základ pro budoucí ekonomickou i osobní dopravu v rámci národa." # todo: NEW TRANSLATION
 GRN_focus_Infrastructure_Infancy: "Raná infrastruktura" # todo: NEW TRANSLATION
 GRN_focus_Infrastructure_Infancy_desc: "Po těchto zásadních, ale jednoduchých prvních krůčcích při budování národní infrastruktury nyní můžeme vytvořit nový a neustále se vyvíjející precedens pro růst a rozvoj těchto zemí, které ovládáme." # todo: NEW TRANSLATION
 GRN_focus_Ministry_For_Mineral_Affairs: "Ministerstvo pro nerostné suroviny" # todo: NEW TRANSLATION
 GRN_focus_Ministry_For_Mineral_Affairs_desc: "Ministerstvo pro nerostné suroviny, neboli MMA, jak mu někteří žertem říkají, je specializovaný vládní orgán, který najme odborníky na geologii, strukturální integritu a obecné těžařské postupy. Ti zajistí, že počáteční investice do těžby našich národních zdrojů budou od samého začátku bezpečné a efektivní. To zaručí, že jakékoli budoucí rozšíření bude v souladu se standardy stanovenými v těchto raných dnech." # todo: NEW TRANSLATION
 GRN_focus_Domesticating_Energy_Needs: "Pokrytí domácích energetických potřeb" # todo: NEW TRANSLATION
 GRN_focus_Domesticating_Energy_Needs_desc: "Náš národ potřebuje energii už z principu. Pro vytápění, elektřinu, základní potřeby ekonomiky i jejích dodavatelských řetězců. Proto prozkoumáme některá ložiska uhlí a zahájíme strategickou těžbu, abychom omezili dovoz a zlepšili domácí podmínky." # todo: NEW TRANSLATION
 GRN_focus_Limited_Strategic_Resource_Extraction: "Omezená strategická těžba zdrojů" # todo: NEW TRANSLATION
 GRN_focus_Limited_Strategic_Resource_Extraction_desc: "Projekt LSRE je plánem na rozvoj malých těžebních provozů zaměřených na těžké kovy a strategičtější nerosty v rámci národa. Patří sem například titan, který se nachází nedaleko samotného hlavního města, ale také ve slušných ložiscích na východě, pokud bychom se rozhodli těžbu rozšířit." # todo: NEW TRANSLATION
 GRN_focus_Cornerstone_Creation: "Vytvoření základního pilíře" # todo: NEW TRANSLATION
 GRN_focus_Cornerstone_Creation_desc: "Kromě betonu je jedním z hlavních pilířů moderní ekonomiky její schopnost vyrábět ocel. Máme ložiska uhlí a železné rudy, tak proč jednoduše nezačít s první malou ocelárnou? Možná bude malá, ale jistě dokážeme tyto materiály využít k rozvoji našeho národa." # todo: NEW TRANSLATION
 GRN_focus_Extracting_Natural_Capital: "Těžba přírodního kapitálu" # todo: NEW TRANSLATION
 GRN_focus_Extracting_Natural_Capital_desc: "Říká se, že v těch kopcích je zlato. A mají pravdu — zlato lze využít k mnohem větším účelům než jen k nošení na těle. Tento náš víceméně „volný kapitál“ můžeme použít k zahájení budoucích projektů a ke stabilizaci rozpočtů, které vyžadují nadprůměrné investice." # todo: NEW TRANSLATION
 GRN_focus_Securing_Mining_Futures: "Zajištění budoucnosti těžby" # todo: NEW TRANSLATION
 GRN_focus_Securing_Mining_Futures_desc: "Vypořádání se s byrokracií, úprava regulací a větší důraz na energeticky zaměřené těžební provozy nám umožní zabít několik much jedním energeticky nabitým kamenem." # todo: NEW TRANSLATION
 GRN_focus_The_Future: "Budoucnost" # todo: NEW TRANSLATION
 GRN_focus_The_Future_desc: "Náprava současnosti je nejvyšší prioritou, ale současnost nelze napravit bez přípravy na budoucnost. Konečným cílem našeho národa proto bude zajistit budoucnost nejen pro obyvatele pobřeží, ale také vytvořit a vybudovat budoucnost pro ty, kteří chtějí žít na šelfu. Koneckonců, led je jen zmrzlá voda a čerstvou vodu už dnes dokážeme destilovat." # todo: NEW TRANSLATION
 GRN_focus_Coastal_Economic_Zones: "Pobřežní ekonomické zóny" # todo: NEW TRANSLATION
 GRN_focus_Coastal_Economic_Zones_desc: "Konečným cílem růstu Grónska je naše schopnost zkrotit vnitrozemí. Mnozí říkají, že nelze žít pouze na ledu, a my jim odpovídáme: samozřejmě že ne. Co je však led jiného než čerstvá voda a jak získáme vodu z ledu? Roztavíme ho. Proto bychom měli na pobřeží vytvořit cílené ekonomické zóny, které nám poskytnou finanční prostředky k zahájení destilace vody z ledového šelfu. Bude to dlouhý a únavný proces, ale pokud si zachováme odhodlání, pomalý pochod na sever skrz vnitrozemí může začít." # todo: NEW TRANSLATION
 GRN_focus_Foreign_Logistics_Hub_One: "První zahraniční logistické centrum" # todo: NEW TRANSLATION
 GRN_focus_Foreign_Logistics_Hub_One_desc: "Nejvhodnější místo pro zřízení pobřežní ekonomické zóny se ve skutečnosti nachází na nejjižnějším cípu ostrova. Nedaleko Tasiusaqu využijeme mírnější fjordy k vytvoření rozsáhlého přístavu a jakéhosi přístavního „města“. Tato základna nám pomůže s postupem na západ při velké cestě na sever." # todo: NEW TRANSLATION
 GRN_focus_Foreign_Logistics_Hub_Two: "Druhé zahraniční logistické centrum" # todo: NEW TRANSLATION
 GRN_focus_Foreign_Logistics_Hub_Two_desc: "Doplníme nejvhodnější místo pro pobřežní ekonomickou zónu. V okolí města Itilleq vytvoříme podobné zařízení. Tato základna pomůže s postupem na východ při velké cestě na sever a spojí obě jižní zóny do jedné CCEZ, tedy propojené pobřežní ekonomické zóny." # todo: NEW TRANSLATION
 GRN_focus_West_Hub_Distillation_Facility: "Destilační zařízení západního centra" # todo: NEW TRANSLATION
 GRN_focus_West_Hub_Distillation_Facility_desc: "Vybudování komplexního destilačního zařízení pro zahájení těžby ledu z ledového šelfu nám umožní zvýšit domácí zásoby vody a zároveň pasivně vytvořit cestu na sever skrz ledový šelf. Tento proces bude nákladný a po delší dobu bude vyžadovat dovážený personál, než budeme schopni vyškolit a zaměstnat místní obyvatele. Dlouhodobý cíl rozvoje a využití území ukrytého pod zmrzlou pustinou však za to bude stát." # todo: NEW TRANSLATION
 GRN_focus_East_Hub_Distillation_Facility: "Destilační zařízení východního centra" # todo: NEW TRANSLATION
 GRN_focus_East_Hub_Distillation_Facility_desc: "Navážeme na obecné využití vytvořené CCEZ a zahájíme práce na druhém hlavním destilačním zařízení, které doplní postup na západě. Destilace ve východním centru bude plnit stejný účel, ale bude podporovat postup na východ prostřednictvím sjednoceného tažení na sever." # todo: NEW TRANSLATION
 GRN_focus_Southern_Fjords_Railway: "Železnice jižních fjordů" # todo: NEW TRANSLATION
 GRN_focus_Southern_Fjords_Railway_desc: "Vybudování železnice v tomto regionu nám umožní nejen lépe propojit celou CCEZ, ale také přepravovat zásoby vody do různých oblastí jižního regionu pro obytné i komerční využití, kdekoli to bude možné." # todo: NEW TRANSLATION
 GRN_focus_Staging_Zones_For_The_Shelf: "Nástupní zóny pro šelf" # todo: NEW TRANSLATION
 GRN_focus_Staging_Zones_For_The_Shelf_desc: "Než se pustíme do našeho velkého snu zkrotit Velký ledový šelf, musíme nejprve vytvořit strategické nástupní zóny, abychom dokázali zmrzlou vodu skutečně využívat, místo abychom ji jednoduše házeli do oceánu." # todo: NEW TRANSLATION
 GRN_focus_The_Great_Eastern_Staging_Grounds: "Velké východní nástupní základny" # todo: NEW TRANSLATION
 GRN_focus_The_Great_Eastern_Staging_Grounds_desc: "Východ je nejméně obydlenou částí ostrova. To znamená, že budeme muset najmout a nasmlouvat odborníky, kteří zde budou žít a položí základy pro budoucí pochod do vnitrozemí Velkého ledového šelfu. Jako klíčovou nástupní základnu využijeme ostrov Tingmiarmit a začneme těžbou a vyrovnáváním terénu na bezprostředním pobřeží samotného hlavního ostrova." # todo: NEW TRANSLATION
 GRN_focus_Capital_Staging_Works: "Nástupní práce v hlavním městě" # todo: NEW TRANSLATION
 GRN_focus_Capital_Staging_Works_desc: "Oblast kolem hlavního města Nuuku je jednou z nejrozvinutějších částí ostrova. Dává proto smysl zřídit hlavní západní nástupní základnu právě zde. Vybudujeme specializovaný a komplexní areál destilačních závodů, výzkumných a vývojových center a poskytneme značnou vládní podporu na dovoz odborníků a učitelů, aby bylo možné areál nakonec předat Gróňanům. Zabere to značné množství času a zdrojů, ale roztavit všechnu tu zmrzlou vodu a objevit skutečné podloží vnitrozemí není malý úkol." # todo: NEW TRANSLATION
 GRN_focus_Meeting_Needs: "Naplnění potřeb" # todo: NEW TRANSLATION
 GRN_focus_Meeting_Needs_desc: "Chceme-li vytvořit tak složitý systém, jaký plánujeme, musíme zřídit místní dodavatelské řetězce, nebo alespoň co nejvíce místní. Malé podniky, které pokryjí průmyslové a komerční potřeby, doplní rozvoj nástupních základen a stanoví standardy pro budoucí postup do vnitrozemí." # todo: NEW TRANSLATION
 GRN_focus_Supplying_Outposts: "Zásobování předsunutých stanovišť" # todo: NEW TRANSLATION
 GRN_focus_Supplying_Outposts_desc: "Přestože Grónsko oficiálně nemá vojenské síly, pokud chceme dosáhnout pokroku při vytváření zásobovací linie do Velkého šelfu, musíme zajistit veškeré potřeby zásobování. Proto vytvoříme velmi malý zbrojní průmysl zaměřený na zásobování předsunutých stanovišť zbraněmi a municí užitečnou k lovu a sebeobraně před případnými lupiči. Koneckonců, kdo vás uprostřed ničeho uslyší křičet?" # todo: NEW TRANSLATION
 GRN_focus_General_National_Investments: "Obecné národní investice" # todo: NEW TRANSLATION
 GRN_focus_General_National_Investments_desc: "Pro fiskální a vnitřní stabilitu našeho národa musíme investovat do těžby, dopravy a obecného rozvoje. Nyní, když je jeviště připravené a přípravné práce začínají nabývat na intenzitě, máme prostor, na němž sehrajeme příběh našeho lidu při krocení Velkého ledového šelfu v nadcházejících letech. Zároveň propojíme železniční společnosti NWR a SFR a vytvoříme Velkou západní železnici fjordů neboli GWFR." # todo: NEW TRANSLATION
 GRN_focus_Greater_Greenland_Act: "Zákon o Velkém Grónsku" # todo: NEW TRANSLATION
 GRN_focus_Greater_Greenland_Act_desc: "Vyčleníme finanční prostředky na zlepšení života rodin v národě a zároveň vyhledáme lidi s podobným kulturním a etnickým původem, kteří by chtěli žít ve sjednocenější říši než nyní. Tato část zákona se zaměřuje na osídlení západního regionu." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Population_Act: "Zákon o osídlení východu" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Population_Act_desc: "Vyčleníme finanční prostředky na zlepšení života rodin v národě a zároveň vyhledáme lidi s podobným kulturním a etnickým původem, kteří by chtěli žít ve sjednocenější říši než nyní. Tato část zákona, navazující na Zákon o Velkém Grónsku, se zaměřuje na osídlení východního regionu." # todo: NEW TRANSLATION
 GRN_focus_Battle_For_Independence: "Boj za nezávislost" # todo: NEW TRANSLATION
 GRN_focus_Battle_For_Independence_desc: "Dostali jsme se na rozcestí. Dánský parlament začal podnikat kroky související s naším postavením jako národa. Bez ohledu na to, zda bude návrh pozitivní, či negativní, se musíme zabezpečit. Začneme proto masivně investovat do nátlakových kampaní, abychom zvýšili naše uznání mezi národy a snad více či méně donutili všechny strany k pokojnému řešení nezávislosti." # todo: NEW TRANSLATION
 GRN_focus_Rushed_Mobilization_Efforts: "Urychlené mobilizační úsilí" # todo: NEW TRANSLATION
 GRN_focus_Rushed_Mobilization_Efforts_desc: "Rozhodli jsme se, že se již nechceme sklánět před dánským utlačovatelským manévrováním. Proto narychlo zmobilizujeme naprosté minimum sil, o nichž víme, že je budeme potřebovat k obraně ostrova před případným dánským vpádem." # todo: NEW TRANSLATION
 GRN_focus_Organizing_Fundamentals_In_Training: "Organizace základního výcviku" # todo: NEW TRANSLATION
 GRN_focus_Organizing_Fundamentals_In_Training_desc: "Rychle založíme základní výcvikové zařízení. To nám poskytne nejrychlejší možný zrychlený kurz, pokud máme svůj ostrov bránit před přicházející invazní armádou." # todo: NEW TRANSLATION
 GRN_focus_If_It_Floats_Its_A_Boat: "Když to plave, je to loď" # todo: NEW TRANSLATION
 GRN_focus_If_It_Floats_Its_A_Boat_desc: "Dánské námořnictvo pravděpodobně povede útok na převzetí ostrova. Bude to nákladné, ale musíme dát dohromady něco, co nám získá čas, chceme-li být někdy považováni za vážný národ na světové scéně." # todo: NEW TRANSLATION
 GRN_focus_Removing_The_Last_Loose_Ends: "Odstranění posledních nedostatků" # todo: NEW TRANSLATION
 GRN_focus_Removing_The_Last_Loose_Ends_desc: "Přerušením vazeb s dánskou korunou jsme se stali vlastním národem, a proto již nemáme původní výsady, které nám poskytovalo naše někdejší koloniální postavení. Musíme tedy reorganizovat některé oblasti a napravit případné nedostatky, na které narazíme." # todo: NEW TRANSLATION
 GRN_focus_Stabilizing_Domestic_Short_Comings: "Stabilizace domácích nedostatků" # todo: NEW TRANSLATION
 GRN_focus_Stabilizing_Domestic_Short_Comings_desc: "Přepracování administrativy a sjednocení všech vládních služeb pod naši národní vládu nám umožní získat skutečný obraz současné situace." # todo: NEW TRANSLATION
 GRN_focus_Greenland_Armed_Services: "Grónské ozbrojené síly" # todo: NEW TRANSLATION
 GRN_focus_Greenland_Armed_Services_desc: "Díky nově nabyté nezávislosti nyní plně kontrolujeme vlastní obranu. Nemáme toho mnoho, ale někde začít musíme. Nebo snad ne?" # todo: NEW TRANSLATION
 GRN_focus_A_New_Chapter: "Nová kapitola" # todo: NEW TRANSLATION
 GRN_focus_A_New_Chapter_desc: "Od tohoto dne obracíme nový list. Snažíme se budovat, prosperovat a zlepšovat národ i životy našich občanů, abychom mohli zamířit ke světlejší budoucnosti pro všechny, kteří chtějí Grónsko vidět a žít v něm." # todo: NEW TRANSLATION
 GRN_focus_Northern_Political_Lights: "Severní politická světla" # todo: NEW TRANSLATION
 GRN_focus_Northern_Political_Lights_desc: "S nově nabytými svobodami nyní můžeme otevřít dveře těm, kteří chtějí kandidovat do úřadů. Samozřejmě to znamená, že se budeme muset vypořádat i s těmi, kteří chtějí systém zneužívat. Jsme však demokraticky smýšlející národ, a proto vložíme důvěru do systému i do lidí." # todo: NEW TRANSLATION
 GRN_focus_Atassut_Claims_Victory: "Atassut slaví vítězství" # todo: NEW TRANSLATION
 GRN_focus_Atassut_Claims_Victory_desc: "Před získáním nezávislosti byla naše politika stagnující. Všichni se soustředili pouze na osvobození z dánského jha. Nyní, když jsme svobodní, můžeme začít razit novou cestu. Cestu postupného budování sociálních hodnot smíšeného s fiskálně konzervativním smýšlením, která náš národ vyváží do budoucna." # todo: NEW TRANSLATION
 GRN_focus_Making_New_Greenlandic_Standards: "Vytvoření nových grónských standardů" # todo: NEW TRANSLATION
 GRN_focus_Making_New_Greenlandic_Standards_desc: "Reforma vzdělávání založená na našem rodném jazyce, zvýšení počtu učitelů a obecné zvýšení nároků na schopnosti našich studentů výrazně zvýší potenciál národa." # todo: NEW TRANSLATION
 GRN_focus_Improving_Medical_Facilities: "Zlepšení zdravotnických zařízení" # todo: NEW TRANSLATION
 GRN_focus_Improving_Medical_Facilities_desc: "Díky lepšímu pořizování vybavení a zlepšení půdorysů zdravotnických zařízení můžeme nastavit nový standard péče a léčby s lepší orientací a snadnějším přístupem k potřebným zdrojům." # todo: NEW TRANSLATION
 GRN_focus_Casting_Better_Social_Nets: "Budování lepších sociálních sítí" # todo: NEW TRANSLATION
 GRN_focus_Casting_Better_Social_Nets_desc: "Reforma sociálních programů umožňující lepší přidělování zdrojů zajistí podporu těm v našem národě, kteří se ocitli v nesnázích nebo jednoduše dosáhli konce své životní cesty." # todo: NEW TRANSLATION
 GRN_focus_Domestic_Agriculture_Projects: "Domácí zemědělské projekty" # todo: NEW TRANSLATION
 GRN_focus_Domestic_Agriculture_Projects_desc: "Zajištění domácího zemědělství znamená stabilnější zdroj potravin. Spolu s našimi HFP, tedy „projekty náročného zemědělství“, bude tento krok nadále prospívat a rozvíjet ekonomiku i populaci našeho národa." # todo: NEW TRANSLATION
 GRN_focus_Increasing_Industrial_Development: "Rozšíření průmyslového rozvoje" # todo: NEW TRANSLATION
 GRN_focus_Increasing_Industrial_Development_desc: "Postupný růst a diverzifikace naší ekonomiky umožní stabilnější a odolnější přístup k domácím i potenciálním zahraničním záležitostem." # todo: NEW TRANSLATION
 GRN_focus_General_Armaments: "Obecná výzbroj" # todo: NEW TRANSLATION
 GRN_focus_General_Armaments_desc: "Menší investice do zlepšení kvality výzbroje a obecného pořizování vybavení posílí naše omezené ozbrojené síly při obraně národa a jeho občanů." # todo: NEW TRANSLATION
 GRN_focus_Growing_Power_Production: "Rozšíření výroby energie" # todo: NEW TRANSLATION
 GRN_focus_Growing_Power_Production_desc: "Zlepšení domácí výroby energie nám umožní rozvíjet ekonomiku a zároveň zvýšit kvalitu života občanů prostřednictvím levné elektřiny." # todo: NEW TRANSLATION
 GRN_focus_National_Alumina_Research_Institute: "Národní výzkumný ústav oxidu hlinitého" # todo: NEW TRANSLATION
 GRN_focus_National_Alumina_Research_Institute_desc: "Komplex NARI je specializované výzkumné a vývojové centrum pro oxid hlinitý a další obtížně těžitelné nerosty. Jeho cílem je hledat způsoby, jak zlepšit a zefektivnit získávání těchto nerostů. Oxid hlinitý se ve vysoké koncentraci nachází především v bauxitové rudě, my však bauxit nemáme. Máme ale mnoho ložisek živce, jehož minerály obsahují téměř až 20 % hmotnosti v podobě oxidu hlinitého. Díky nákladnějšímu postupu tak můžeme zajistit domácí zásoby. Není jich však mnoho a hliník se používá v celé řadě věcí, takže se v této oblasti musíme co nejvíce rozšířit." # todo: NEW TRANSLATION
 GRN_focus_Military_Investment_Package: "Balíček vojenských investic" # todo: NEW TRANSLATION
 GRN_focus_Military_Investment_Package_desc: "Tento obecný investiční balíček bude využit ke zlepšení kvality vybavení a zvýšení platů vojáků. Část prostředků bude také vyčleněna na lepší standardizaci výcvikových zařízení tam, kde to bude potřeba." # todo: NEW TRANSLATION
 GRN_focus_Demokraatit_Secures_Victory: "Demokraatit vítězí" # todo: NEW TRANSLATION
 GRN_focus_Demokraatit_Secures_Victory_desc: "Strana Demokraatit dlouhodobě zaujímala v grónské politice pozici téměř outsidera. Přestože byla do značné míry v souladu se dvěma hlavními stranami, existovaly mezi nimi jemné rozdíly, které stranu obvykle odsouvaly do jakéhosi „trvalého třetího místa“. To se však dnes mění, protože díky našemu vítězství v éře nezávislosti nyní můžeme podle svých nejlepších schopností zlepšovat národ i jeho občany." # todo: NEW TRANSLATION
 GRN_focus_Economic_Assimilation_Visas: "Víza pro ekonomickou asimilaci" # todo: NEW TRANSLATION
 GRN_focus_Economic_Assimilation_Visas_desc: "Využití vízového systému k rozvoji národa a stabilnímu růstu populace výrazně pomůže budoucímu plánování samotného národa." # todo: NEW TRANSLATION
 GRN_focus_Improved_Community_Programs: "Zlepšené komunitní programy" # todo: NEW TRANSLATION
 GRN_focus_Improved_Community_Programs_desc: "Vzájemné porozumění mezi policií a občany, které chrání, je hlavním faktorem soudržnosti namísto rozbrojů. Musíme zajistit důsledná opatření, která udrží většinu lidí na stejné lodi, abychom v případě, že se něco stane, nedopadli například jako v Americe." # todo: NEW TRANSLATION
 GRN_focus_Rewriting_Mining_Regulations: "Přepracování těžebních předpisů" # todo: NEW TRANSLATION
 GRN_focus_Rewriting_Mining_Regulations_desc: "Předpisy týkající se těžebních postupů jsou značně přehnané a jednoduše neodpovídají současnému stavu národa. Proto budeme muset k celé věci přistoupit nově, abychom mohli průmysl lépe standardizovat." # todo: NEW TRANSLATION
 GRN_focus_Hospice_Care_Funding: "Financování hospicové péče" # todo: NEW TRANSLATION
 GRN_focus_Hospice_Care_Funding_desc: "Poskytnutí lepšího a cílenějšího financování hospicové péče zajistí, že se rodiny budou moci lépe soustředit na to, co musí dělat, a zároveň se nebudou muset obávat, že jejich starší příbuzní budou zanedbáváni kvůli běžným každodenním povinnostem." # todo: NEW TRANSLATION
 GRN_focus_Creating_A_Basic_Office_Sector: "Vytvoření základního kancelářského sektoru" # todo: NEW TRANSLATION
 GRN_focus_Creating_A_Basic_Office_Sector_desc: "Další diverzifikace naší ekonomiky znamená, že budeme muset investovat do malých, ale významných kancelářských a technologických odvětví, abychom mohli nadále zlepšovat náš národ a životní podmínky jeho občanů." # todo: NEW TRANSLATION
 GRN_focus_Expanding_Existing_HFPs: "Rozšíření stávajících HFP" # todo: NEW TRANSLATION
 GRN_focus_Expanding_Existing_HFPs_desc: "Rozšíření našich současných projektů drsného zemědělství prostřednictvím vertikálních zemědělských zařízení a destilační infrastruktury potřebné k zásobování vodou z ledového šelfu vytvoří rostoucí domácí zásoby potravin a zároveň přispěje k našemu cíli proniknout do vnitrozemí." # todo: NEW TRANSLATION
 GRN_focus_Growing_REM_Industries: "Rozvoj průmyslu vzácných zemin" # todo: NEW TRANSLATION
 GRN_focus_Growing_REM_Industries_desc: "Pro zlepšení naší geostrategické hodnoty budeme muset rozvíjet průmysl vzácných zemin, tedy sektor kovů vzácných zemin. Cílená těžební a zpracovatelská zařízení nám umožní využívat tyto suroviny při vyjednávání budoucích obchodních dohod." # todo: NEW TRANSLATION
 GRN_focus_Growing_Domestic_Arms_Production: "Rozvoj domácí výroby zbraní" # todo: NEW TRANSLATION
 GRN_focus_Growing_Domestic_Arms_Production_desc: "Zajištění výzbroje pro naše vojáky nám poskytne jistotu, že naše armáda může a bude bránit naše území před jakýmikoli agresivními silami." # todo: NEW TRANSLATION
 GRN_focus_Expanding_Citizen_Development_Grants: "Rozšíření grantů pro rozvoj občanů" # todo: NEW TRANSLATION
 GRN_focus_Expanding_Citizen_Development_Grants_desc: "Cesta k občanství je vymezena výhradně přínosem k rozvoji národa, a proto rozšíříme stipendijní program, abychom zvýšili počet lidí, kteří mohou současně projít touto cestou a stát se novými grónskými občany." # todo: NEW TRANSLATION
 GRN_focus_Siumut_Wins_Once_More: "Siumut znovu vítězí" # todo: NEW TRANSLATION
 GRN_focus_Siumut_Wins_Once_More_desc: "Jednou z nejdéle vládnoucích stran je strana Siumut. V přednezávislostní éře získala většinu volebních vítězství a zdá se, že si svou pozici udržuje i v éře po získání nezávislosti. Nyní je čas soustředit se na víc než jen na nezávislost; nyní se zaměříme na zlepšení života občanů a pracovníků." # todo: NEW TRANSLATION
 GRN_focus_Encouraging_State_Sanctioned_Immigration: "Podpora státem schváleného přistěhovalectví" # todo: NEW TRANSLATION
 GRN_focus_Encouraging_State_Sanctioned_Immigration_desc: "Náš domácí růst není příliš dobrý. Pokud chceme zaplnit pracovní trh a rozvíjet ekonomiku, musíme se vždy, když to bude možné, zaměřit na určitou formu pravidelného přistěhovalectví." # todo: NEW TRANSLATION
 GRN_focus_Immigration_Quotas: "Přistěhovalecké kvóty" # todo: NEW TRANSLATION
 GRN_focus_Immigration_Quotas_desc: "S postupným rozvojem našeho národa vyvstává naše největší starost: najít lidi, které bychom mohli zaměstnat. Růst ekonomiky pomůže jen do určité míry, pokud nám jednoduše dojdou lidé na obsazení pracovních míst. Proto se začneme snažit dosáhnout stanovených přistěhovaleckých kvót, aby počet obyvatel odpovídal naší ekonomice." # todo: NEW TRANSLATION
 GRN_focus_Expanding_Schooling_Subjects: "Rozšíření školních předmětů" # todo: NEW TRANSLATION
 GRN_focus_Expanding_Schooling_Subjects_desc: "Rozšíření volitelných kurzů, které naše školy nabízejí, umožní studentům hledat si práci a budoucnost podle vlastních představ. Zároveň zachováme rozvoj základních všeobecných dovedností, které mohou našim studentům pomoci dospět a připravit se na dospělý život." # todo: NEW TRANSLATION
 GRN_focus_Social_Reserve_Funds: "Sociální rezervní fondy" # todo: NEW TRANSLATION
 GRN_focus_Social_Reserve_Funds_desc: "Jak náš národ roste co do počtu obyvatel i ekonomiky, narážíme na obtížnou rovnováhu ve financování a správném přidělování rozpočtů všem potřebným. Abychom tyto nedostatky udrželi pod kontrolou, vytvoříme Sociální rezervní fond, což bude v podstatě federální spoření pro sociální programy. Občanům, kteří budou tyto záchranné sítě potřebovat, by to mělo přinést větší klid." # todo: NEW TRANSLATION
 GRN_focus_Tungsten_Industries: "Wolframový průmysl" # todo: NEW TRANSLATION
 GRN_focus_Tungsten_Industries_desc: "Ve středovýchodních oblastech se nacházejí rozsáhlá ložiska wolframu, která čekají na vytěžení. Proto vytvoříme specializovaný průmyslový komplex pro těžbu, zpracování a rafinaci rudy na surové tyče nebo další produkty vyžadující tento zdroj." # todo: NEW TRANSLATION
 GRN_focus_Core_Industries_Complex: "Komplex základního průmyslu" # todo: NEW TRANSLATION
 GRN_focus_Core_Industries_Complex_desc: "Znovuotevření starých železných dolů, v nichž stále zbývá materiál k vytěžení, spolu s otevřením nových dolů nám umožní rozšířit průmyslové kapacity. S tímto vědomím vybudujeme podobný průmyslový komplex pro zpracování vytěžené rudy podle potřeb národa." # todo: NEW TRANSLATION
 GRN_focus_Growing_More_Crops: "Pěstování dalších plodin" # todo: NEW TRANSLATION
 GRN_focus_Growing_More_Crops_desc: "Díky našim iniciativám vertikálního zemědělství a předem plánované destilační infrastruktuře, která tato zařízení podporuje, můžeme pokračovat ve stabilním rozšiřování a doufat, že poptávka bude do ledového šelfu zasahovat rychleji, než se očekávalo." # todo: NEW TRANSLATION
 GRN_focus_Naval_Investments: "Námořní investice" # todo: NEW TRANSLATION
 GRN_focus_Naval_Investments_desc: "Rozvoj domácích schopností stavby lodí nám umožní vytvořit námořnictvo. Pokud budeme mít námořnictvo, můžeme zabezpečit naše pobřežní vody a zároveň získat určitou mezinárodní přítomnost, byť zpočátku sebemenší." # todo: NEW TRANSLATION
 GRN_focus_Strategic_Stockpiles: "Strategické zásoby" # todo: NEW TRANSLATION
 GRN_focus_Strategic_Stockpiles_desc: "Vytvoření strategických zásob zajistí rezervu snadno dostupných střelných zbraní pro vyzbrojení naší armády a v případě potřeby i samotného obyvatelstva. Samozřejmě doufáme, že k něčemu takovému nikdy nedojde, ale kdo ví, jaké zvrácené mysli se ve světě nacházejí." # todo: NEW TRANSLATION
 GRN_focus_Polar_Party_Wins: "Polární strana vítězí?" # todo: NEW TRANSLATION
 GRN_focus_Polar_Party_Wins_desc: "Polární strana, která byla považována za kdysi zaniklou, je pravděpodobně nejbližší tradičně konzervativní straně, jakou lze v Grónsku najít. Její vítězství je sice matoucí, ale vzbuzuje naději na stabilní vedení a společenský klid uprostřed vnějšího chaosu, s nímž se některé národy potýkají." # todo: NEW TRANSLATION
 GRN_focus_Family_Subsidies: "Rodinné dotace" # todo: NEW TRANSLATION
 GRN_focus_Family_Subsidies_desc: "Abychom zlepšili domácí růst populace a nebyli příliš závislí na přistěhovalectví, zavedeme zvláštní dotace na podporu rodin v prvních letech dětství. Hlavní problém, kterým obvykle bývají finanční možnosti, tak přestane být skutečnou překážkou. Abychom zabránili zneužívání, omezíme způsob využití dotací pouze na nákupy a umístíme je na bankovní kartu s celostátním standardem." # todo: NEW TRANSLATION
 GRN_focus_Childcare_Act: "Zákon o péči o děti" # todo: NEW TRANSLATION
 GRN_focus_Childcare_Act_desc: "Schopnost rodičů pečovat o děti a zároveň se snažit platit účty a vyřizovat další povinnosti představuje křehkou a často únavnou rovnováhu. Zákon o péči o děti proto představuje výdajový balíček na zlepšení a zřízení jeslí a zařízení raného vzdělávání, která se budou o děti starat." # todo: NEW TRANSLATION
 GRN_focus_Foreign_Leasing_Act: "Zákon o zahraničním pronájmu" # todo: NEW TRANSLATION
 GRN_focus_Foreign_Leasing_Act_desc: "Zákon FLA je dvoudílný právní předpis. První část zlepšuje vzdělávání a výzkum s cílem prohloubit naše znalosti těžby nerostů a nejlepších způsobů dobývání surovin pod naším územím. Druhá část má v podstatě přimět zahraniční společnosti, aby to dělaly za nás, nebo alespoň položily základy, které bychom v případě potřeby mohli kdykoli převzít." # todo: NEW TRANSLATION
 GRN_focus_Steeling_Resolve_Act: "Zákon o posílení odhodlání" # todo: NEW TRANSLATION
 GRN_focus_Steeling_Resolve_Act_desc: "Právní předpis SRA představuje cílený investiční balíček zaměřený na rozšíření domácích dodávek železa a uhlí. Tyto klíčové zdroje pomohou rozšířit základy naší ekonomiky a domácí schopnosti vyrábět pro průmysl i pro potřeby obyvatel, jako je bydlení a veřejné instituce." # todo: NEW TRANSLATION
 GRN_focus_Expand_Petrochemical_Industries: "Rozšíření petrochemického průmyslu" # todo: NEW TRANSLATION
 GRN_focus_Expand_Petrochemical_Industries_desc: "Schopnost vybudovat, natož rozšířit jakoukoli část petrochemického průmyslu výrazně posílí naši domácí bezpečnost tím, že omezí nadměrný obchodní deficit." # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_Forestries: "Grónské lesnictví" # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_Forestries_desc: "Vytvoření nových lesních farem prostřednictvím skleníkových a vertikálních zemědělských iniciativ, které již národ provozuje, nám umožní vybudovat rostoucí a rozmanitý dřevařský sektor." # todo: NEW TRANSLATION
 GRN_focus_Industrial_Projects: "Průmyslové projekty" # todo: NEW TRANSLATION
 GRN_focus_Industrial_Projects_desc: "Zlepšení rozvoje východu tak, aby se více přiblížil západnímu regionu, výrazně sníží rozdíly mezi nimi. Zlepšení průmyslového sektoru na východě by proto mělo být velmi přínosné." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Armaments: "Východní zbrojní průmysl" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Armaments_desc: "Náš projekt „Rozvoj východu“ pokračuje podle mého názoru velmi dobře. Zřizování nových průmyslových odvětví všeho druhu spolu se zajištěním přistěhovaleckých programů, které pomohou obsadit domácí pracovní místa, přispěje k vytvoření silné ekonomiky a světlé budoucnosti pro náš lid." # todo: NEW TRANSLATION
 GRN_focus_Defensive_Improvements: "Zlepšení obrany" # todo: NEW TRANSLATION
 GRN_focus_Defensive_Improvements_desc: "Zlepšení naší schopnosti bránit se náhlým nepřátelským vpádům bude základem národní bezpečnosti. Koneckonců vylodění na ostrově není nic snadného." # todo: NEW TRANSLATION
 GRN_focus_Qulleq_Party_Secures_Victory: "Strana Qulleq vítězí" # todo: NEW TRANSLATION
 GRN_focus_Qulleq_Party_Secures_Victory_desc: "V zajímavém vývoji událostí vyhrála volby strana Qulleq. Je známá jako proindustrialistická strana a kdysi byla hlavní stálicí hesla „nezávislost hned“, stojící mimo původní hlavní držitele moci z minulosti. Zatímco někteří se obávají, že to znamená nižší životní úroveň ve prospěch rozvoje, mnozí členové strany ujišťují, že vzhledem k neobvyklé situaci, v níž se národ nachází, se kvalita života pouze zlepší. Ať už to dopadne jakkoli, strana bude muset v nadcházejících týdnech dokázat své schopnosti činy." # todo: NEW TRANSLATION
 GRN_focus_On_Site_Family_Support: "Podpora rodin na pracovišti" # todo: NEW TRANSLATION
 GRN_focus_On_Site_Family_Support_desc: "Každý den je dnem, kdy můžete vzít děti do práce. Firmy začnou postupně začleňovat určité klíčové prvky péče o děti, aby rodinní příslušníci mohli nadále chodit do práce, aniž by měli pocit, že své děti opouštějí." # todo: NEW TRANSLATION
 GRN_focus_Contractual_Labor_Act: "Zákon o smluvní práci" # todo: NEW TRANSLATION
 GRN_focus_Contractual_Labor_Act_desc: "Zákon CLA dává správě pravomoc pomáhat pohraničním a přistěhovaleckým službám při hledání vhodných kandidátů pro pracovní víza. Tato víza umožní vstup do země na delší dobu těm, kteří zde chtějí pracovat. Nejde o návštěvnická víza, ale pouze o rozšíření programu rozvojových grantů, který již provozujeme." # todo: NEW TRANSLATION
 GRN_focus_Rewriting_The_Tax_Codes: "Přepracování daňových předpisů" # todo: NEW TRANSLATION
 GRN_focus_Rewriting_The_Tax_Codes_desc: "Daňové předpisy jsou v zásadě velmi nepřátelské vůči podnikání, a proto začneme znovu a přizpůsobíme je současné podobě ekonomiky." # todo: NEW TRANSLATION
 GRN_focus_Building_Up_Domestic_Capital: "Budování domácího kapitálu" # todo: NEW TRANSLATION
 GRN_focus_Building_Up_Domestic_Capital_desc: "Naše zlaté doly můžeme doplnit také těžbou malého množství diamantů. Tento surový kapitál můžeme prodejem do zahraničí využít k financování domácího rozvoje." # todo: NEW TRANSLATION
 GRN_focus_Securing_Energy_Needs: "Zajištění energetických potřeb" # todo: NEW TRANSLATION
 GRN_focus_Securing_Energy_Needs_desc: "Rozsáhlé potřeby našeho neustále se rozvíjejícího národa jsou základním kamenem samotného rozvoje. Máme zdroje, a proto nám musí být umožněno využívat je podle našeho uvážení." # todo: NEW TRANSLATION
 GRN_focus_Military_Production_Means: "Prostředky vojenské výroby" # todo: NEW TRANSLATION
 GRN_focus_Military_Production_Means_desc: "Naše schopnost bránit a chránit nejen občany, ale také přírodní bohatství a stále se zvyšující kvalitu jejich života je prvořadá. Nemůžeme se spokojit s pohodlím, pokud víme, že by se některý národ mohl kdykoli pokusit toto bohatství zneužít pro své vlastní škodlivé účely." # todo: NEW TRANSLATION
 GRN_focus_Continued_Crop_Diversification_Efforts: "Pokračující úsilí o diverzifikaci plodin" # todo: NEW TRANSLATION
 GRN_focus_Continued_Crop_Diversification_Efforts_desc: "Nadále využíváme projekty drsného zemědělství, které byly založeny v přednezávislostní éře, zatímco samotná národní semenná banka se dále rozrůstá a rozšiřuje rozmanitost uchovávaných plodin. Náš národ bude prosperovat díky nepřetržitému rozvoji destilačních center podporujících domácí zemědělská zařízení, v nichž budou růst rostliny tam, kde to mnozí považovali za nemožné." # todo: NEW TRANSLATION
 GRN_focus_Expanded_Eastern_Industries: "Rozšířený východní průmysl" # todo: NEW TRANSLATION
 GRN_focus_Expanded_Eastern_Industries_desc: "Pracovníci, podniky a další. To je rozvojový cyklus, v němž chceme pokračovat a více jej využívat na východě než na západě, protože rozdíl mezi oběma oblastmi, alespoň co do počtu obyvatel, je značný. Zaměřením na východ chceme snížit celkové rozdíly na národní úrovni a vytvořit soudržnější a rovnoměrněji rozloženou ekonomiku." # todo: NEW TRANSLATION
 GRN_focus_Economic_Automation_Act: "Zákon o automatizaci ekonomiky" # todo: NEW TRANSLATION
 GRN_focus_Economic_Automation_Act_desc: "Zákon EAA má za cíl projednat a následně vybrat ekonomický sektor, který chceme v podstatě úplně převést na automatizaci. Pracovníci se tak uvolní pro zaměstnání v jiných odvětvích a naše celková ekonomická situace se snad stabilizuje díky odstranění nerovnováhy mezi dostupnou pracovní silou a počtem pracovních míst." # todo: NEW TRANSLATION
 GRN_focus_Inuit_Ataqatigiit_Election_Victory: "Volební vítězství Inuit Ataqatigiit" # todo: NEW TRANSLATION
 GRN_focus_Inuit_Ataqatigiit_Election_Victory_desc: "IA, považovaná za jakéhosi outsidera grónské politiky, představuje mezistupeň mezi běžnějším demokratickým socialismem a tradičnějším tržním socialismem. Strana sice věří v některé marxistické principy, ale zdá se, že se řídí spíše titoistickou rovnováhou mezi ekonomickým vyjednáváním bloků národů a sociální soudržností, aby se nemusela přímo přiklonit k žádné straně. Přestože je Grónsko členem NATO, neexistuje žádná povinnost přizpůsobit se ekonomicky." # todo: NEW TRANSLATION
 GRN_focus_Greencare_Act: "Zákon o péči o Grónsko" # todo: NEW TRANSLATION
 GRN_focus_Greencare_Act_desc: "Zákon o péči o Grónsko je obecný rozpočtový zákon, jehož cílem je zlepšit mzdy zdravotnického personálu, kvalitu vybavení a školení a zároveň rozšířit nebo otevřít nová zařízení tam, kde jsou potřeba." # todo: NEW TRANSLATION
 GRN_focus_Steeled_Veins_Act: "Zákon o ocelových žilách" # todo: NEW TRANSLATION
 GRN_focus_Steeled_Veins_Act_desc: "Uhlí a železo jsou životní mízou každé moderní ekonomiky. Přestože uhlí již vzhledem k dostupným alternativám energie není tak užitečné jako dříve, nemůžeme jednoduše ignorovat množství a v některých oblastech ani skutečnou kvalitu našich ložisek uhlí a železa. Proto začneme investovat do menších provozů obou surovin, abychom posílili současné zásoby pro domácí potřebu i případný zahraniční vývoz." # todo: NEW TRANSLATION
 GRN_focus_Pro_Mining_And_Miners_Act: "Zákon na podporu těžby a horníků" # todo: NEW TRANSLATION
 GRN_focus_Pro_Mining_And_Miners_Act_desc: "Návrh PMMA je určen ke zlepšení kvality a množství těžby a zároveň k cílené automatizaci, která zlepší obecné postavení hornické profese tím, že omezí, jak často a kolik pracovníků bude v dole kdykoli zapotřebí." # todo: NEW TRANSLATION
 GRN_focus_Feldspar_Extractions_Act: "Zákon o těžbě živce" # todo: NEW TRANSLATION
 GRN_focus_Feldspar_Extractions_Act_desc: "Podle současných geologických průzkumů se jediný skutečný zdroj oxidů hliníku nachází v ložiscích živce na západě. Přestože minerál obsahuje až 20 % oxidu hlinitého, nejde o komerčně nejvýhodnější zdroj. Proto musí těžební provoz zůstat pod úplnou vládní kontrolou, dokud vědecký průlom tuto skutečnost nezmění. Hliník však pro naši ekonomiku potřebujeme, a proto budeme investovat do postupného rozšiřování těžby živce a zpracování potřebných materiálů z tohoto minerálu." # todo: NEW TRANSLATION
 GRN_focus_Feeding_The_People_Act: "Zákon o nasycení lidu" # todo: NEW TRANSLATION
 GRN_focus_Feeding_The_People_Act_desc: "Rozvoj domácí potravinové situace mimo hlavní rybolov je skvělým způsobem, jak podpořit naši ekonomiku i růst populace. Díky vytvoření národní semenné banky jsme již dobře pokročili v přeměně Grónska na vzor rozvoje skleníkového a vertikálního zemědělství." # todo: NEW TRANSLATION
 GRN_focus_The_Continual_Industry_Act: "Zákon o trvalém průmyslu" # todo: NEW TRANSLATION
 GRN_focus_The_Continual_Industry_Act_desc: "Růst ekonomiky znamená zlepšování výroby a obecné průmyslové základny. Díky malým investicím do primárního a sekundárního průmyslu můžeme pokračovat v růstu a rozvoji jako nikdy předtím." # todo: NEW TRANSLATION
 GRN_focus_Greenland_Technology_Center: "Grónské technologické centrum" # todo: NEW TRANSLATION
 GRN_focus_Greenland_Technology_Center_desc: "Investice do výzkumu a vývoje zaměřeného na obecný pokrok v rozvoji a udržitelnosti v našem ekologickém prostředí budou pro budoucí rozvoj klíčové." # todo: NEW TRANSLATION
 GRN_focus_Arming_The_Nation: "Vyzbrojení národa" # todo: NEW TRANSLATION
 GRN_focus_Arming_The_Nation_desc: "Naše obrana je klíčem k pokračování nezávislosti. Pokud chceme zůstat svobodní, musíme rozvinout prostředky, které nám to umožní." # todo: NEW TRANSLATION
 GRN_focus_Silver_And_Gold_Act: "Zákon o stříbře a zlatě" # todo: NEW TRANSLATION
 GRN_focus_Silver_And_Gold_Act_desc: "Zlepšení domácí bezpečnosti prostřednictvím vytvoření cenných vyjednávacích prostředků v mezinárodních jednáních nám umožní odrazovat případné útočníky o něco déle než bez nich. Proto zahájíme omezenou těžbu palladia a některých cenných kovů vzácných zemin, k nimž máme přístup." # todo: NEW TRANSLATION
 GRN_focus_Naleraq_Elective_Victory: "Volební vítězství Naleraq" # todo: NEW TRANSLATION
 GRN_focus_Naleraq_Elective_Victory_desc: "Vzhledem k tomu, že národ svírá čerstvá nezávislost, není divu, že zvítězila nacionalisticky orientovaná strana Naleraq. Její politika se snaží přímo posílit a prokázat grónskou ctnost ve vztahu k námi vybojované suverenitě. Někteří se však obávají, zda nejde o příliš rychlý krok k něčemu podstatně nepřátelštějšímu." # todo: NEW TRANSLATION
 GRN_focus_Efficiency_Education_Courses: "Kurzy energetické účinnosti" # todo: NEW TRANSLATION
 GRN_focus_Efficiency_Education_Courses_desc: "Program EE je vzdělávacím investičním projektem, jehož cílem je vyučovat a testovat nové způsoby přenosu, skladování a využívání energie v chladnějším klimatu. Zvyšování účinnosti v těchto oblastech umožní naší ekonomice fungovat efektivněji, aniž bychom se museli obávat problémů se zaměstnaností." # todo: NEW TRANSLATION
 GRN_focus_Family_Planning_And_Assistance_Board: "Rada pro plánování a podporu rodin" # todo: NEW TRANSLATION
 GRN_focus_Family_Planning_And_Assistance_Board_desc: "FPAB je vládní instituce věnovaná vytváření, udržování a rozvoji rodin v národě. Naše populace je malá a nechceme národ zaplavit náhodnými přistěhovalci, pokud se o sebe dokážeme řádně postarat sami." # todo: NEW TRANSLATION
 GRN_focus_Family_Homes_Act: "Zákon o rodinném bydlení" # todo: NEW TRANSLATION
 GRN_focus_Family_Homes_Act_desc: "Zákon o rodinném bydlení, neboli FHA, je program určený k zajištění toho, aby se domy určené rodinám dostaly k rodinám, které je potřebují. Zajistíme, aby nikdo nezneužíval omezené bytové kapacity, které v zemi máme." # todo: NEW TRANSLATION
 GRN_focus_Urban_Planning_Commission: "Komise pro urbanismus" # todo: NEW TRANSLATION
 GRN_focus_Urban_Planning_Commission_desc: "UPC je vládní agentura určená k předběžnému plánování a zahájení základních prací na budoucích bytových projektech a možných způsobech městského plánování, které bude možné použít, až se do nových domů nastěhují lidé, kteří budou potřebovat práci a místní dodavatelské řetězce." # todo: NEW TRANSLATION
 GRN_focus_Rapid_Agriculture_Expansions: "Rychlé rozšiřování zemědělství" # todo: NEW TRANSLATION
 GRN_focus_Rapid_Agriculture_Expansions_desc: "Návrh RAE je zaměřen na rozšíření naší zemědělské základny a výrobních metod, abychom mohli nadále živit občany a lépe rozvíjet populaci. Samozřejmě budeme muset prověřit a přivézt odborníky, kteří budou školit a později předávat zařízení rodilým občanům, ale prozatím jim můžeme udělit dočasná rozvojová víza." # todo: NEW TRANSLATION
 GRN_focus_Industry_Development_Act: "Zákon o rozvoji průmyslu" # todo: NEW TRANSLATION
 GRN_focus_Industry_Development_Act_desc: "Budeme investovat do výrobního a obecného průmyslového sektoru, abychom vytvořili spolehlivou, ale rozmanitou ekonomiku. Malá zlepšení a projekty se budou postupně nabalovat spolu s růstem populace a případné prověřené skupiny přistěhovalců se mohou také rozšiřovat." # todo: NEW TRANSLATION
 GRN_focus_Military_Forces_Investment_Act: "Zákon o investicích do ozbrojených sil" # todo: NEW TRANSLATION
 GRN_focus_Military_Forces_Investment_Act_desc: "Tento výdajový balíček a projekt rozvoje výzbroje budou společně rozvíjet naše pozemní a vzdušné schopnosti, zatímco se budeme snažit navrhnout vlastní konstrukce některých složitých zařízení." # todo: NEW TRANSLATION
 GRN_focus_Western_Strategic_Autarky_Act: "Zákon o strategické autarkii západu" # todo: NEW TRANSLATION
 GRN_focus_Western_Strategic_Autarky_Act_desc: "Zákon o národní autarkii je dvoufázový plán na vytvoření strategické těžby a obecné těžby zdrojů, který má zajistit omezené, ale stabilní domácí zásoby pro případ, že by se nám některý národ pokusil uškodit námořní nebo politickou blokádou. První fáze plánu je známá jako WSAA neboli zákon o strategické autarkii západu. Vytvoří omezené provozy na železnou rudu, živec pro hliník, ropu a uhlí pro energetiku i výrobu syntetického kaučuku." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Strategic_Autarky_Zone: "Východní zóna strategické autarkie" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Strategic_Autarky_Zone_desc: "Druhou fází zákona o národní autarkii je rozvoj těžby ropy a uhlí pro obecné energetické a průmyslové využití. Zahájíme také omezenou těžbu kovů vzácných zemin, lithia a podobných technologicky významných nerostů. Zdá se, že naše domácí bezpečnost a vyjednávací prostředky v zahraničí se začínají hromadit v náš prospěch." # todo: NEW TRANSLATION
 GRN_focus_Militarize_Greenland_Party_Wins: "Strana Militarizujte Grónsko vítězí?" # todo: NEW TRANSLATION
 GRN_focus_Militarize_Greenland_Party_Wins_desc: "Přestože je většina grónských stran téměř zaměnitelná, nikdo neočekával vojenský zásah, při němž zdánlivý outsider a nedávno založená strana MGP nějakým způsobem zvítězila. Strana, která je v podstatě politickým prodloužením nově vzniklých Ozbrojených sil Grónska neboli ASG, se zaměřuje na národní obranu a schopnost získat prostředky k obraně národa. Jistě jde o poněkud kruhovou logiku, ale mnozí se nemohou ubránit otázce, zda nešlo o podvědomou potřebu, kterou většina lidí pocítila po nezávislosti na Dánsku." # todo: NEW TRANSLATION
 GRN_focus_Military_Organized_Education_Act: "Zákon o vojensky organizovaném vzdělávání" # todo: NEW TRANSLATION
 GRN_focus_Military_Organized_Education_Act_desc: "Způsob výuky, předměty i obecná struktura našeho vzdělávání budou přepracovány do vojensky organizované podoby. Včasné vyučování disciplíny, organizace a schopnosti naslouchat i předávat rozkazy a informace je klíčové nejen pro zapamatování, ale také pro život po vzdělávání a případnou službu." # todo: NEW TRANSLATION
 GRN_focus_Production_Critical_Resources_Act: "Zákon o výrobě klíčových zdrojů" # todo: NEW TRANSLATION
 GRN_focus_Production_Critical_Resources_Act_desc: "Ocel a energie, tyto dva základní pilíře každé průmyslové společnosti, potřebujeme ze všeho nejvíce. Ať už pro civilní, nebo vojenské potřeby, budeme investovat do rozšíření provozů, abychom zajistili domácí potřeby i obranu." # todo: NEW TRANSLATION
 GRN_focus_Advanced_Materials_And_Minerals_Act: "Zákon o pokročilých materiálech a nerostech" # todo: NEW TRANSLATION
 GRN_focus_Advanced_Materials_And_Minerals_Act_desc: "Návrh AMMA se zaměřuje na rozšíření těžby nerostů považovaných za zdroje potřebné pro pokročilou výrobu. Mezi hlavní příklady patří suroviny spojené s rozvojem technologií a prvky vzácných zemin." # todo: NEW TRANSLATION
 GRN_focus_Army_Armaments_Improvement_Act: "Zákon o zlepšení armádní výzbroje" # todo: NEW TRANSLATION
 GRN_focus_Army_Armaments_Improvement_Act_desc: "Obecné zlepšení naší armády je klíčové pro jakoukoli pozemní obranu, kterou můžeme mít. Proto investujeme do rozšíření výrobních kapacit a do pasivního financování výzkumu a vývoje, aby tato zařízení mohla podle možností testovat nové konstrukce." # todo: NEW TRANSLATION
 GRN_focus_Air_Force_Advancements_Act: "Zákon o rozvoji letectva" # todo: NEW TRANSLATION
 GRN_focus_Air_Force_Advancements_Act_desc: "Financování výrobních zařízení, která nám skutečně umožní vytvořit určitou podobu letectva, bude lepší než nedělat nic. Jako bonus přidáme trochu financí na výzkum a vývoj, abychom rozběhli návrh nových letadel pro tuto složku ozbrojených sil." # todo: NEW TRANSLATION
 GRN_focus_Military_Garden_Act: "Zákon o vojenských zahradách" # todo: NEW TRANSLATION
 GRN_focus_Military_Garden_Act_desc: "Vyčlenit část pomalu, ale neustále se rozšiřujícího zemědělského aparátu, jímž jsou projekty drsného zemědělství, pro program vojenských přídělů je skutečně přínosné. Nejenže se tím oddělí civilní poptávka od vojenské, ale také se zlepší kontrola kvality a množství potravin pro naše vojáky." # todo: NEW TRANSLATION
 GRN_focus_Bolstering_Naval_Assets: "Posílení námořních sil" # todo: NEW TRANSLATION
 GRN_focus_Bolstering_Naval_Assets_desc: "Naše pobřeží je obrovské, a proto budeme muset rozšířit, nebo alespoň vytvořit lodě, které zvládnou překonávat potřebné vzdálenosti. Vedle armády je námořnictvo naší první skutečnou obrannou linií." # todo: NEW TRANSLATION
 GRN_focus_Civilian_Improvements_Act: "Zákon o zlepšení civilního sektoru" # todo: NEW TRANSLATION
 GRN_focus_Civilian_Improvements_Act_desc: "Abychom mohli posílit a udržet velkou vojenskou sílu, musíme mít také slušnou civilní ekonomiku, která vše podepře. Proto uskutečníme cílené rozvojové projekty, abychom zajistili, že vojenské potřeby příliš nepředběhnou možnosti naší skutečné ekonomiky." # todo: NEW TRANSLATION
 GRN_focus_Militarized_Economy_Act: "Zákon o militarizované ekonomice" # todo: NEW TRANSLATION
 GRN_focus_Militarized_Economy_Act_desc: "Tento zákon představuje komplexní nové pojetí organizace a fungování národní ekonomiky. Pokud ji předem zorganizujeme s ohledem na možné vysoké nároky na vojenskou pracovní sílu, můžeme se zaměřit na lepší integraci technologií a výrobních metod, které výrazně sníží potřebu přidělovat pracovní sílu na výrobu vojenské výzbroje. Tím se uvolní pracovníci a potenciální personál pro civilní ekonomiku i ozbrojené síly." # todo: NEW TRANSLATION
 GRN_focus_Greenland_Monarchist_Party_Victory: "Vítězství Grónské monarchistické strany" # todo: NEW TRANSLATION
 GRN_focus_Greenland_Monarchist_Party_Victory_desc: "Grónská monarchistická strana, známá také jako Strana grónského domu, je politická strana, která chce respektovat a napodobovat velmi, velmi dlouhou historii Grónska pod dánskou monarchií. Strana proto usiluje o převzetí stávajícího parlamentního systému a jeho začlenění do poměrně liberální konstituční monarchie. Mnoho lidí je samozřejmě zmateno, ale značná část, nebo alespoň dost na to, aby zajistila volební vítězství, věří, že dánská politická stabilita je klíčem k tomu, jak můžeme doma skutečně rozvíjet a budovat náš národ." # todo: NEW TRANSLATION
 GRN_focus_Education_Investments_Act: "Zákon o investicích do vzdělávání" # todo: NEW TRANSLATION
 GRN_focus_Education_Investments_Act_desc: "Zákon EIA představuje cílené zvýšení výdajů na lepší vybavení a obecné investice do kvality vzdělávání i do inovačních oddělení některých institucí. Doufáme, že zvýšíme efektivitu našeho národa a budeme dále rozvíjet a přizpůsobovat naše schopnosti stále tvrdším podmínkám našeho prostředí." # todo: NEW TRANSLATION
 GRN_focus_Medical_Research_Initiatives: "Iniciativy lékařského výzkumu" # todo: NEW TRANSLATION
 GRN_focus_Medical_Research_Initiatives_desc: "Plán MRI vytvoří samostatné financování nového specializovaného oddělení v rámci našich hlavních zdravotnických institucí. Toto oddělení se bude nazývat Oddělení lékařského rozvoje neboli MDD. MDD bude zodpovědné za testování a hledání nových způsobů rozšiřování našich znalostí a porozumění lékařské vědě a také za zajištění testování nového vybavení a postupů prostřednictvím plně dobrovolnického programu." # todo: NEW TRANSLATION
 GRN_focus_Public_Security_And_Safety_Act: "Zákon o veřejné bezpečnosti a ochraně" # todo: NEW TRANSLATION
 GRN_focus_Public_Security_And_Safety_Act_desc: "Naši občané musí mít možnost žít beze strachu. Po schválení tohoto zákona bude financování určeno nejen na komunitní programy, ale také na lepší standardy hodnocení uchazečů o zaměstnání a na výcvikový program pro budoucí policisty. Pamatujte, že klidný den je dobrý den a dobrý den pro vás je dobrým dnem pro veřejnost." # todo: NEW TRANSLATION
 GRN_focus_Agriculture_Advancements_Act: "Zákon o rozvoji zemědělství" # todo: NEW TRANSLATION
 GRN_focus_Agriculture_Advancements_Act_desc: "Navážeme na náš stále rostoucí program HRP a budeme nadále investovat do skleníkových a vertikálních zemědělských zařízení všude, kde to bude možné. Bezpečnost a stabilita našeho národa koneckonců závisí na získání rozmanitých a stabilních dodávek potravin." # todo: NEW TRANSLATION
 GRN_focus_Economic_Strengthening_Act: "Zákon o posílení ekonomiky" # todo: NEW TRANSLATION
 GRN_focus_Economic_Strengthening_Act_desc: "Rozvoj hospodářského základu znamená, že se standard celé země zvýší buď nepřímo, nebo jako vedlejší produkt, podle toho, jak cynicky nebo obecně pozitivně se na život díváte. Bez ohledu na to, pokud chceme zlepšit život našich občanů, musíme investovat do podniků a průmyslu, abychom diverzifikovali a rozšířili produkty i prostředky, které mohou naši lidé během života získat a využívat." # todo: NEW TRANSLATION
 GRN_focus_Petrochemical_Development_Efforts: "Úsilí o rozvoj petrochemie" # todo: NEW TRANSLATION
 GRN_focus_Petrochemical_Development_Efforts_desc: "Petrochemický průmysl je jedním z nejvlivnějších a nejrozmanitějších ekonomických sektorů moderní doby, nemluvě o tom, že jeho dopady pociťujeme prakticky v každodenním životě. Proto musíme převzít iniciativu a rozvíjet vlastní sektor, pokud chceme skutečně vybudovat silnou a rozmanitou ekonomiku. Schopnost syntetizovat například kaučuk a další cenné chemikálie či materiály je téměř otázkou národní bezpečnosti." # todo: NEW TRANSLATION
 GRN_focus_Lithium_Expansion_Act: "Zákon o rozšíření těžby lithia" # todo: NEW TRANSLATION
 GRN_focus_Lithium_Expansion_Act_desc: "Investice do těžby klíčových zdrojů jsou zásadní pro rostoucí vliv technologií a dalších moderních inovací, zatímco náš národ pokračuje v růstu. Máme domácí ložiska prvků vzácných zemin, lithia a dalších nerostů potřebných pro technologickou výrobu. Proto začneme rozšiřovat a rozvíjet těžbu, abychom doplnili domácí poptávku a případně tyto zdroje využili v budoucích obchodních dohodách." # todo: NEW TRANSLATION
 GRN_focus_Royal_Military_Development_Efforts: "Úsilí o rozvoj královské armády" # todo: NEW TRANSLATION
 GRN_focus_Royal_Military_Development_Efforts_desc: "Program RMD představuje obecný investiční balíček na zlepšení kvality vývoje vybavení pro armádu a námořnictvo a zároveň na zajištění nových výcvikových standardů pro neustále se vyvíjející vybavení." # todo: NEW TRANSLATION
 GRN_focus_Establishing_The_Kingdom: "Založení království" # todo: NEW TRANSLATION
 GRN_focus_Establishing_The_Kingdom_desc: "Po dokončení všech příprav jsme nyní připraveni oficiálně přejmenovat národ na Grónské království. Lidé jsou radostní a jednotní, když vyrážíme vytvořit prosperující a hrdou budoucnost pro všechny naše občany." # todo: NEW TRANSLATION
 GRN_focus_Armed_Services_Of_Greenland: "Ozbrojené síly Grónska" # todo: NEW TRANSLATION
 GRN_focus_Armed_Services_Of_Greenland_desc: "Nyní, když je naše nezávislost zajištěna, musíme převzít odpovědnost za vlastní národní obranu. Budeme muset začít prakticky od nuly a vytvořit něco, co dokáže bránit rozsáhlé vody, území a vzdušný prostor, které ovládáme." # todo: NEW TRANSLATION
 GRN_focus_The_Frozen_Army: "Zamrzlá armáda" # todo: NEW TRANSLATION
 GRN_focus_The_Frozen_Army_desc: "Naše území je chladné, zamrzlé a téměř v každém ročním období obtížně prostupné. Musíme přizpůsobit naši armádu tak, aby tyto podmínky vnímala spíše jako hřiště než jako výzvu." # todo: NEW TRANSLATION
 GRN_focus_Training_Facilities_And_Standards: "Výcviková zařízení a standardy" # todo: NEW TRANSLATION
 GRN_focus_Training_Facilities_And_Standards_desc: "Abychom vytvořili řádnou armádu, musíme vybudovat výcviková zařízení a stanovit přijatelné standardy pro řádného vojáka. Tyto standardy musí vycházet z podmínek naší vlasti, pokud máme skutečně bránit své občany." # todo: NEW TRANSLATION
 GRN_focus_Setting_Equipment_Standards: "Stanovení standardů vybavení" # todo: NEW TRANSLATION
 GRN_focus_Setting_Equipment_Standards_desc: "Vytvořením jednotného standardu vybavení dosáhneme větší jednotnosti ve výcviku a zlepšíme logistiku našich vojáků." # todo: NEW TRANSLATION
 GRN_focus_Securing_Domestic_Smallarms: "Zajištění domácí výroby ručních zbraní" # todo: NEW TRANSLATION
 GRN_focus_Securing_Domestic_Smallarms_desc: "Vybudování vlastní schopnosti vyrábět ruční zbraně a obecné vybavení související s pěchotou nám umožní zvýšit bojové schopnosti a připravenost armády." # todo: NEW TRANSLATION
 GRN_focus_Crude_Combat_Designs: "Primitivní bojové konstrukce" # todo: NEW TRANSLATION
 GRN_focus_Crude_Combat_Designs_desc: "CCDs jsou v podstatě návrhy vozidel ve stylu „chrastících kostí“. Jsou směšně jednoduché, ale jde o domácí modely. Můžeme je využít a případně nakoupit hrstku vybavení jiných národů k testování a řádnému navrhování, abychom při budování armády skutečně mohli nasadit vybavení určené pro moderní boj." # todo: NEW TRANSLATION
 GRN_focus_Vehicle_Manufacturing_Plants: "Továrny na výrobu vozidel" # todo: NEW TRANSLATION
 GRN_focus_Vehicle_Manufacturing_Plants_desc: "Se základními návrhy vozidel, které máme k dispozici, bychom měli být schopni vyrábět tyto cvičné prototypy a využít získané zkušenosti k návrhu a vybudování potenciálního obrněného jádra naší armády." # todo: NEW TRANSLATION
 GRN_focus_Institute_For_Army_Developments: "Institut rozvoje armády" # todo: NEW TRANSLATION
 GRN_focus_Institute_For_Army_Developments_desc: "Vzhledem k tomu, že naše armáda je prakticky menší než batole, musíme výrazně investovat do prostředků pro rozvoj a zlepšení všech aspektů jejího fungování. Děláme to v zájmu národa, lidu i personálu, který v armádě slouží." # todo: NEW TRANSLATION
 GRN_focus_Frozen_Battlefield_Doctrine: "Doktrína zamrzlého bojiště" # todo: NEW TRANSLATION
 GRN_focus_Frozen_Battlefield_Doctrine_desc: "Naše armáda pravděpodobně nikdy nedosáhne velikosti armád na evropském kontinentu. Můžeme však bránit a chránit. Využijeme naše klima a vlast jako konečné bojiště a přimějeme každou nepřátelskou sílu, ať už agresivní, nebo ne, aby na nás zaútočila. Myslí si, že jsme snadný cíl? Uvidíme, až sem přijdou a pokusí se nám to říct do očí." # todo: NEW TRANSLATION
 GRN_focus_FBD_Leadership_Promotions: "Povýšení velitelů FBD" # todo: NEW TRANSLATION
 GRN_focus_FBD_Leadership_Promotions_desc: "Abychom upevnili a začali reorganizovat armádu kolem této nové doktríny, budeme potřebovat velitele, kteří ji skutečně chtějí zavést a rozumějí jejím myšlenkám a konceptům. Proto povýšíme specializovaný generální štáb armády, který bude tyto reformy lépe vést a provádět." # todo: NEW TRANSLATION
 GRN_focus_From_Field_To_Staff_Command: "Z velení v poli do štábního velení" # todo: NEW TRANSLATION
 GRN_focus_From_Field_To_Staff_Command_desc: "Po povýšení polních velitelů si uvědomujeme, že se tyto nešťastné duše musí také seznámit s širší správou. Proto budou jejich polní velení dočasně doplněna o pozice na generálním štábu, dokud nevyškolíme a nepovýšíme další schopné důstojníky pro tento nový směr." # todo: NEW TRANSLATION
 GRN_focus_Frozen_Warfare_Training_Program: "Výcvikový program boje v mrazu" # todo: NEW TRANSLATION
 GRN_focus_Frozen_Warfare_Training_Program_desc: "Zaměřujeme se na obranu vlasti. Tato vlast je chladná a zamrzlá, takže musíme naše vojáky cvičit a zajistit, aby v těchto podmínkách dokázali bojovat co nejdéle." # todo: NEW TRANSLATION
 GRN_focus_Polar_Logistics: "Polární logistika" # todo: NEW TRANSLATION
 GRN_focus_Polar_Logistics_desc: "Předpokládat, že se všechny naše boje odehrají na ostrově, není sice nejlepší metoda, ale pro obranu národa jde o bezpečný způsob uvažování. Proto začneme zdokonalovat a zlepšovat náš logistický aparát, aby bylo zvládání bojů v extrémním počasí snazší." # todo: NEW TRANSLATION
 GRN_focus_General_Improvement_Programs: "Obecné zlepšovací programy" # todo: NEW TRANSLATION
 GRN_focus_General_Improvement_Programs_desc: "Obrana našeho ostrova je samozřejmě hlavní prioritou. Jak jej ale můžeme bránit, když víme jen málo nebo vůbec nic o bojových podmínkách ve světě kolem nás? Musíme zajistit vyvážené a obecné zlepšení armády, aby byla ochotná a schopná zvládnout co nejvíce různých situací." # todo: NEW TRANSLATION
 GRN_focus_GIP_Leadership_Promotions: "Povýšení velitelů GIP" # todo: NEW TRANSLATION
 GRN_focus_GIP_Leadership_Promotions_desc: "Zajištění nového směru růstu a rozvoje armády bude vyžadovat polní i generálské velitelské pozice. Proto vybereme nejlepší možné kandidáty, aby pomohli posunout tento způsob myšlení k novým standardům dokonalosti." # todo: NEW TRANSLATION
 GRN_focus_General_Staff_Roles: "Role generálního štábu" # todo: NEW TRANSLATION
 GRN_focus_General_Staff_Roles_desc: "Přestože je naše armáda malá, budeme se muset prozatím spoléhat na ty, kterým jsme právě svěřili polní velení, a pověřit je také správními úkoly." # todo: NEW TRANSLATION
 GRN_focus_Artillery_Corps_Specialist: "Specialisté dělostřeleckého sboru" # todo: NEW TRANSLATION
 GRN_focus_Artillery_Corps_Specialist_desc: "Rozvoj a specializace dělostřeleckých operací v obranných i útočných opatřeních nám umožní způsobit nepříteli větší škody na personálu i morálce, než může způsobit on nám. Dělostřelectvo se však obtížně přesouvá a snadno přemístitelné kusy jsou drahé. Pokud chceme, aby tento taktický přístup měl skutečný význam, budeme muset najít způsoby, jak omezit ztráty." # todo: NEW TRANSLATION
 GRN_focus_Clear_Skys_Project: "Projekt Jasné nebe" # todo: NEW TRANSLATION
 GRN_focus_Clear_Skys_Project_desc: "CSP je specializovaný program vývoje protiletadlového vybavení, který má zajistit, aby schopnost našich vojáků bojovat nezávisela pouze na tom, zda se nepřítel rozhodne použít letectvo. Letadla jsou drahá; pro běžného pěšáka jsou sice zábavnými novými hračkami, ale tím to končí." # todo: NEW TRANSLATION
 GRN_focus_Army_Officer_Training_Corps: "Sbor výcviku armádních důstojníků" # todo: NEW TRANSLATION
 GRN_focus_Army_Officer_Training_Corps_desc: "AOTC představuje vyvrcholení a zasvěcení personálu do role taktických i strategických vůdců. Náš národ je malý, a proto musíme rozvíjet a omezovat špatné návyky dříve, než vyrosteme do bodu, kdy se přirozeně zakoření." # todo: NEW TRANSLATION
 GRN_focus_Navy_Of_Greenland: "Grónské námořnictvo" # todo: NEW TRANSLATION
 GRN_focus_Navy_Of_Greenland_desc: "Naše námořnictvo se skládá pouze z rybářských a hlídkových člunů. Pokud vůbec chceme pomýšlet na obranu pobřežních vod, musíme nejprve zajistit, že nějaké námořnictvo máme, a také že dokáže v určitých chvílích zvládat tak nevyzpytatelné podmínky." # todo: NEW TRANSLATION
 GRN_focus_Naval_Research_Institute: "Námořní výzkumný institut" # todo: NEW TRANSLATION
 GRN_focus_Naval_Research_Institute_desc: "Založení Námořního výzkumného institutu Itilleq nám umožní rozvíjet námořní znalosti a praktické využití pro naše námořnictvo. Tento základní pilíř rozvoje nám umožní vytvořit námořnictvo podle našich představ a řádně bránit naše vody před zahraniční agresí." # todo: NEW TRANSLATION
 GRN_focus_Nuuk_Naval_Shipyards: "Nuukské námořní loděnice" # todo: NEW TRANSLATION
 GRN_focus_Nuuk_Naval_Shipyards_desc: "Rozvoj loděnic v hlavním regionu nám umožní stavět nová plavidla pro vojenské i případné civilní účely." # todo: NEW TRANSLATION
 GRN_focus_Expanding_The_Design_Department: "Rozšíření konstrukčního oddělení" # todo: NEW TRANSLATION
 GRN_focus_Expanding_The_Design_Department_desc: "Strategické námořní loděnice poblíž NRI na jihu národa nám umožní zlepšovat, navrhovat a testovat námořní plavidla a poskytovat našemu námořnictvu nejlepší možné výsledky. Pomůže to také lépe modernizovat současné třídy lodí a podle možností je přestavovat podle novějších návrhů." # todo: NEW TRANSLATION
 GRN_focus_Tasiilaq_Shipyards_Complex: "Komplex loděnic Tasiilaq" # todo: NEW TRANSLATION
 GRN_focus_Tasiilaq_Shipyards_Complex_desc: "Vyrovnání obecného námořního rozvoje mezi strategickými koncovými body nám umožní logisticky podporovat a nasazovat naše flotily podle potřeby v libovolné části ostrova." # todo: NEW TRANSLATION
 GRN_focus_Rough_Raft_Designs: "Hrubé návrhy vorů" # todo: NEW TRANSLATION
 GRN_focus_Rough_Raft_Designs_desc: "Navrhnout a nasadit alespoň nějakou námořní sílu znamená, že budeme muset vynaložit mimořádné úsilí na výzkum a vývoj, abychom v budoucnu skutečně získali a pokusili se postavit opravdové konstrukce." # todo: NEW TRANSLATION
 GRN_focus_Small_Surface_Fleet_Doctrine: "Doktrína malé hladinové flotily" # todo: NEW TRANSLATION
 GRN_focus_Small_Surface_Fleet_Doctrine_desc: "Náš národ nemá dostatek lidí k nasazení velkého počtu lodí. Proto začneme naši námořní doktrínu stavět na menších hladinových plavidlech. V zásadě je učiníme modulárními a přizpůsobivými, přičemž kvůli problémům s výcvikem a personálem nepůjde o nic většího než torpédoborec." # todo: NEW TRANSLATION
 GRN_focus_Corvette_Design_Department: "Konstrukční oddělení korvet" # todo: NEW TRANSLATION
 GRN_focus_Corvette_Design_Department_desc: "Prvním programem naší doktríny SSF je konstrukční oddělení korvet. Oddělení se bude zabývat navrhováním, testováním a zlepšováním inovací kolem standardního typu trupu." # todo: NEW TRANSLATION
 GRN_focus_Small_Vessel_Fleet_Organization: "Organizace flotily malých plavidel" # todo: NEW TRANSLATION
 GRN_focus_Small_Vessel_Fleet_Organization_desc: "Naše SVF neboli malé flotily budou organizovány kolem velké trojice: korvet, fregat a torpédoborců. Tyto tři třídy plavidel budou nejvhodnější pro obsazování posádkami, úpravy a tvorbu nových dynamických konstrukcí, díky nimž budou naše flotily představovat pro nepřátelské síly vážnou hrozbu." # todo: NEW TRANSLATION
 GRN_focus_Submersival_Fleet_Doctrine: "Doktrína ponorkové flotily" # todo: NEW TRANSLATION
 GRN_focus_Submersival_Fleet_Doctrine_desc: "Ponorky jsou skryté a nevyžadují příliš mnoho personálu. Pokud jsou však správně organizovány, mohou zasadit velmi silný úder. Od protilodních střel po stará dobrá torpéda dokážeme s menšími prostředky udělat mnohem více." # todo: NEW TRANSLATION
 GRN_focus_Attack_Submarine_Pillar: "Pilíř útočných ponorek" # todo: NEW TRANSLATION
 GRN_focus_Attack_Submarine_Pillar_desc: "Prvním hlavním pilířem zajištění základů našeho námořnictva je útočná ponorka. Je navržena především pro přímé útočné taktiky, jako jsou torpéda a minová válka, a stane se kopím našeho námořnictva." # todo: NEW TRANSLATION
 GRN_focus_Missile_Submarine_Pillar: "Pilíř raketových ponorek" # todo: NEW TRANSLATION
 GRN_focus_Missile_Submarine_Pillar_desc: "Druhým pilířem naší námořní bezpečnosti jsou raketové ponorky. Střely jsou ničivé zbraně, ale také poměrně nákladné. Musíme zlepšit a zdokonalit efektivní bojové schopnosti tohoto pilíře námořní síly, pokud máme správně čelit zahraničním nepřátelům na moři." # todo: NEW TRANSLATION
 GRN_focus_Naval_Command_Corps: "Sbor námořního velení" # todo: NEW TRANSLATION
 GRN_focus_Naval_Command_Corps_desc: "Naše námořnictvo potřebuje velitelský aparát a dnes jej vytvoříme. Je to začátek a od této chvíle už se můžeme jen zlepšovat. Doufám." # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_Air_Force: "Grónské letectvo" # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_Air_Force_desc: "Obloha nad naším ostrovem je zatažená, chladná a pustá. Musíme zjistit, jak vybudovat a vytvořit dostatečné letectvo k obraně našeho nebe." # todo: NEW TRANSLATION
 GRN_focus_West_Craft_Manufacturing: "Západní letecká výroba" # todo: NEW TRANSLATION
 GRN_focus_West_Craft_Manufacturing_desc: "Výrobní zařízení Western Craft je připraveno vyrábět a testovat návrhy pro naše letectvo, kdykoli to bude možné. Doufáme, že tento nový průmyslový komplex využijeme k vybavení a přípravě letectva na obranu našeho nebe." # todo: NEW TRANSLATION
 GRN_focus_Preparing_Air_Institute_Manufacturing: "Příprava výroby leteckého institutu" # todo: NEW TRANSLATION
 GRN_focus_Preparing_Air_Institute_Manufacturing_desc: "Schopnost vyrábět a testovat letadla je zásadní pro učení a inovace. Zřídíme výrobní kapacity poblíž plánovaného Leteckého výzkumného institutu, abychom usnadnili logistiku a plánování vývoje nových konstrukcí a testování technologií." # todo: NEW TRANSLATION
 GRN_focus_Tingmiarmit_Air_Research_Institute: "Letecký výzkumný institut Tingmiarmit" # todo: NEW TRANSLATION
 GRN_focus_Tingmiarmit_Air_Research_Institute_desc: "TARI je instituce věnovaná vývoji a inovacím v oblasti letadel a schopností vzdušného boje. Přestože je náš národ poměrně rozlehlý, zároveň je malý, a proto musíme tyto první roky věnovat specializaci na skutečnou leteckou doktrínu a ochranu vzdušného prostoru před nepřátelskými silami." # todo: NEW TRANSLATION
 GRN_focus_Infrequent_Flyer_Designs: "Jednoduché návrhy letadel" # todo: NEW TRANSLATION
 GRN_focus_Infrequent_Flyer_Designs_desc: "Levné konstrukce určené pro role, které jim byly přiděleny. Nejsou nejlepší, ale představují určitý výchozí bod pro skutečný rozvoj našeho letectva." # todo: NEW TRANSLATION
 GRN_focus_Air_Supremacy_Prioritization: "Upřednostnění vzdušné převahy" # todo: NEW TRANSLATION
 GRN_focus_Air_Supremacy_Prioritization_desc: "Nepřítel může přemoci naše námořnictvo, ale nikdy mu nesmíme dovolit ovládnout naše nebe. Měli bychom se plně soustředit na výrobu a inovace v oblasti přímého vzdušného boje. Zajištění této schopnosti nám následně umožní dělat, co chceme, ve vzduchu, na moři i na zemi." # todo: NEW TRANSLATION
 GRN_focus_General_Aviation_Innovations: "Inovace v letectví" # todo: NEW TRANSLATION
 GRN_focus_General_Aviation_Innovations_desc: "Zařízení TARI tvrdě pracovalo, díky bohu, protože jsme do něj vložili spoustu peněz. Každopádně obecná zlepšení, jako je detekce radarem, palivová účinnost a snížení spotřeby, spolu s řadou dalších inovací by měla být brzy nasazena k terénním testům." # todo: NEW TRANSLATION
 GRN_focus_Air_Dominance_Research_Programs: "Výzkumné programy vzdušné dominance" # todo: NEW TRANSLATION
 GRN_focus_Air_Dominance_Research_Programs_desc: "Výhradním zaměřením na výzkum a vývoj stíhaček vyčistíme oblohu od nepřátel, kteří chtějí naše nebe zatemnit svými nenávistnými úmysly." # todo: NEW TRANSLATION
 GRN_focus_Naval_Bombing_Superiority_Force: "Síly námořní bombardovací převahy" # todo: NEW TRANSLATION
 GRN_focus_Naval_Bombing_Superiority_Force_desc: "Ovládnutí moří prostřednictvím vzdušných prostředků by mohlo otevřít cestu preventivním obranným opatřením a zajistit útočné schopnosti pro případ, že by jich někdy bylo zapotřebí." # todo: NEW TRANSLATION
 GRN_focus_Bombing_Research_Priorities: "Priority výzkumu bombardování" # todo: NEW TRANSLATION
 GRN_focus_Bombing_Research_Priorities_desc: "Investice do výzkumu zaměřeného na inovace v oblasti bombardování a vzdušného boje proti pozemním a námořním cílům se ukážou jako přínosné pro preventivní odražení případných invazních sil." # todo: NEW TRANSLATION
 GRN_focus_Bomber_Air_Fleets: "Bombardovací letecké flotily" # todo: NEW TRANSLATION
 GRN_focus_Bomber_Air_Fleets_desc: "Naše letectvo bude mít specializované letecké flotily pro všechny druhy bombardovacích operací. Od strategického bombardování po přímou leteckou podporu připravíme půdu tak, aby žádná nepřátelská síla nemohla dlouhodobě ohrožovat naše území." # todo: NEW TRANSLATION
 GRN_focus_Air_Officer_Training_Corps: "Sbor výcviku leteckých důstojníků" # todo: NEW TRANSLATION
 GRN_focus_Air_Officer_Training_Corps_desc: "Rozvoj sboru důstojníků letectva bude nadále zlepšovat rozvojové snahy, o něž usilujeme, zatímco budeme růst a zdokonalovat to, čím naše letectvo skutečně je." # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_General_Staff_Corps: "Grónský sbor generálního štábu" # todo: NEW TRANSLATION
 GRN_focus_Greenlandic_General_Staff_Corps_desc: "S neustále se rozšiřující armádou jsme dospěli do bodu, kdy potřebujeme jednotnější velení generálního štábu. Proto vytvoříme tento národní velitelský štáb a budeme pracovat na zlepšení národa i na neustálém posilování naší národní obrany." # todo: NEW TRANSLATION
 GRN_focus_Thawing_The_Economy: "Rozmrazování ekonomiky" # todo: NEW TRANSLATION
 GRN_focus_Thawing_The_Economy_desc: "Ekonomika našeho národa se původně skládá jen z rybolovu a, no, rybolovu. Samozřejmě máme nepatrné zastoupení v obchodních a dalších hospodářských odvětvích, ale skutečná většina ekonomiky pochází z našeho rybolovu. To musíme změnit. Samozřejmě jsme se již pokoušeli diverzifikovat, abychom mohli bojovat za naši nezávislost, ale musíme dál zjišťovat, co můžeme dělat a jak to dělat. Naše ekonomika má potenciál růst, ale musíme něco podniknout." # todo: NEW TRANSLATION
 GRN_focus_Energizing_Greenland: "Energetizace Grónska" # todo: NEW TRANSLATION
 GRN_focus_Energizing_Greenland_desc: "Jak náš národ roste, naše poptávka po energii stále stoupá. Musíme vytvořit stabilní energetický sektor, který bude i nadále zvládat naše požadavky." # todo: NEW TRANSLATION
 GRN_focus_Fossil_Fuelin: "Fosilní paliva" # todo: NEW TRANSLATION
 GRN_focus_Fossil_Fuelin_desc: "Náš národ má velká, dosud nevyužitá ložiska uhlí i ropy. Můžeme je využít k rychlé a levné výrobě energie a držet tak krok s našimi energetickými potřebami." # todo: NEW TRANSLATION
 GRN_focus_Oil_Charter_Dominance: "Dominance ropných koncesí" # todo: NEW TRANSLATION
 GRN_focus_Oil_Charter_Dominance_desc: "Upřednostněním vytváření nových těžebních koncesí můžeme i nadále pokrývat energetickou poptávku rozšiřováním celkového těžebního úsilí." # todo: NEW TRANSLATION
 GRN_focus_Renewable_Revivals: "Obroda obnovitelných zdrojů" # todo: NEW TRANSLATION
 GRN_focus_Renewable_Revivals_desc: "Naše země oplývá větrem, slunečním svitem a tekoucí vodou. Máme snad nejlepší prostředí pro investice do stabilní obnovitelné energie, a proto zahájíme všeobecné a komplexní investice jak do výstavby zařízení pro obnovitelné zdroje, tak do vývoje lepších metod výroby energie." # todo: NEW TRANSLATION
 GRN_focus_Harnessing_The_Winds_Of_Fortune: "Využití větrů štěstí" # todo: NEW TRANSLATION
 GRN_focus_Harnessing_The_Winds_Of_Fortune_desc: "Budeme i nadále upřednostňovat náš celkový rozvoj a zajistíme, že dokážeme využít samotnou povahu našeho národa ve prospěch občanů, aby mohli žít lépe než dříve." # todo: NEW TRANSLATION
 GRN_focus_Greenlands_Green_Energy: "Zelená energie Grónska" # todo: NEW TRANSLATION
 GRN_focus_Greenlands_Green_Energy_desc: "Náš ostrov je ideálním místem pro rozvoj a využití jaderné energie. Má poměrně stabilní počasí, chladné a studené teploty téměř po celý rok a dostatek slané i sladké, respektive zmrzlé vody pro výrobu páry." # todo: NEW TRANSLATION
 GRN_focus_Unlimited_Power: "Neomezená energie" # todo: NEW TRANSLATION
 GRN_focus_Unlimited_Power_desc: "Díky domácím ložiskům jaderných materiálů můžeme zásobovat vlastní zařízení. Můžeme také začít budovat a připravovat provoz. Touto masivní investicí dáváme najevo, že jsme národ, který se již nemusí obávat nedostatku energie." # todo: NEW TRANSLATION
 GRN_focus_Secured_Electrical_Grid: "Zabezpečená elektrická síť" # todo: NEW TRANSLATION
 GRN_focus_Secured_Electrical_Grid_desc: "Nyní, když máme jasno v energetickém směřování, jsou naše energetické potřeby stabilnější, nebo se přinejmenším stávají předvídavějšími namísto reaktivních. Doufejme, že jsme zvolili správně, a pokračujme vpřed ke světlejší budoucnosti." # todo: NEW TRANSLATION
 GRN_focus_Agricultural_Futurism_Plan: "Plán zemědělského futurismu" # todo: NEW TRANSLATION
 GRN_focus_Agricultural_Futurism_Plan_desc: "Naše původní HFP neboli projekty náročného zemědělství položily základy ekonomických a vědeckých inovací. Přestože vedou k energeticky náročnějším opatřením, můžeme je využít k nastolení dominance zemědělského sektoru, a to jak v soběstačnosti, tak v případném zahraničním obchodu a investicích." # todo: NEW TRANSLATION
 GRN_focus_Western_Farming_Complexes: "Západní zemědělské komplexy" # todo: NEW TRANSLATION
 GRN_focus_Western_Farming_Complexes_desc: "Vytvoření základů, infrastruktury a celkových struktur na podporu těchto metod vyžaduje čas, ale v budoucnu přinese ovoce. Tyto VFC neboli vertikální zemědělské komplexy umožňují pěstovat nejrůznější potraviny prakticky po celý rok. Zároveň nám dovolí rozšířit naše destilační zařízení a pokračovat v postupném odtěžování Velkého ledového šelfu." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Farming_Complexes: "Východní zemědělské komplexy" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Farming_Complexes_desc: "Neustálý rozvoj našeho sektoru vertikálního zemědělství sníží náklady na potraviny v našem národě na nová minima, díky čemuž budou potraviny velmi levné a budeme je moci téměř po celý rok obchodovat s ostatními národy výměnou za zboží, které je u nás sezónně nedostupné." # todo: NEW TRANSLATION
 GRN_focus_Supplemental_Industries: "Doplňková průmyslová odvětví" # todo: NEW TRANSLATION
 GRN_focus_Supplemental_Industries_desc: "Rozvoj našeho průmyslového sektoru nám poskytne omezenou diverzitu vedle silně podporovaného zemědělského sektoru." # todo: NEW TRANSLATION
 GRN_focus_First_International_Farm: "První mezinárodní farma" # todo: NEW TRANSLATION
 GRN_focus_First_International_Farm_desc: "Díky všem našim investicím do výzkumu a ekonomického rozvoje širšího zemědělského sektoru jsme si uvědomili, že s ohledem na poptávku, kterou dokážeme uspokojit, bychom mohli být prvním mezinárodním zemědělským národem. Jistě, po celém světě existují obilnice, ale zamyslete se nad tím: mohli bychom být SVĚTOVOU potravinovou bankou." # todo: NEW TRANSLATION
 GRN_focus_Infrastructure_Projects: "Infrastrukturní projekty" # todo: NEW TRANSLATION
 GRN_focus_Infrastructure_Projects_desc: "Růst ekonomiky je sice skvělý, ale abychom ho udrželi, potřebujeme silnice, železnice a veškerou infrastrukturu, která propojí lidi i služby a umožní ekonomice skutečně fungovat. Proto zavedeme obecný seznam projektů, které lépe začlení náš řídce osídlený národ." # todo: NEW TRANSLATION
 GRN_focus_Greater_West_Highway_Project: "Projekt Velké západní dálnice" # todo: NEW TRANSLATION
 GRN_focus_Greater_West_Highway_Project_desc: "Vytvoření přímé „dálnice“ spojující západní města zlepší podmínky cestování občanů a zkrátí náročnost i dobu přesunů z jednoho místa na druhé." # todo: NEW TRANSLATION
 GRN_focus_Improving_Western_Internet_Towers: "Modernizace západních internetových věží" # todo: NEW TRANSLATION
 GRN_focus_Improving_Western_Internet_Towers_desc: "Modernizace stávajících věží a výstavba nových internetových věží umožní našim občanům a institucím efektivněji a soudržněji vykonávat každodenní činnosti." # todo: NEW TRANSLATION
 GRN_focus_Sisimuit_Northern_Railway: "Severní železnice Sisimuit" # todo: NEW TRANSLATION
 GRN_focus_Sisimuit_Northern_Railway_desc: "Rozšíření současné železniční sítě tak, aby pokryla co největší část západního regionu, je zásadní pro logistiku a soudržnost hospodářského dodavatelského řetězce. Tato investice nám značně prospěje, protože železnice jsou nejlepším způsobem hromadné dopravy." # todo: NEW TRANSLATION
 GRN_focus_Great_Eastern_Highway_Project: "Projekt Velké východní dálnice" # todo: NEW TRANSLATION
 GRN_focus_Great_Eastern_Highway_Project_desc: "Podobně jako u našeho západního projektu uděláme vše pro propojení východních měst, aby byl národ co nejvíce propojený, i kdyby jen těmi nejzákladnějšími prostředky." # todo: NEW TRANSLATION
 GRN_focus_East_Region_Internet_Expansions: "Rozšíření internetu ve východním regionu" # todo: NEW TRANSLATION
 GRN_focus_East_Region_Internet_Expansions_desc: "Východní region je obvykle méně rozvinutý než západ, a proto musíme udělat vše pro růst a vyrovnání těchto nedostatků. Rozšíříme tedy internetovou infrastrukturu, kterou v regionu máme, aby dosáhla požadované úrovně." # todo: NEW TRANSLATION
 GRN_focus_Great_Greenlandic_Eastern_Railroad: "Velká grónská východní železnice" # todo: NEW TRANSLATION
 GRN_focus_Great_Greenlandic_Eastern_Railroad_desc: "GGERR je jednou z největších infrastrukturních investic, jejímž cílem je propojit co největší část pobřežních území do jednotné železniční sítě. Jedinou překážkou kratší doby cestování je Velký ledový šelf, ale možná ho jednou dokážeme změnit." # todo: NEW TRANSLATION
 GRN_focus_Connecting_Greenland: "Propojení Grónska" # todo: NEW TRANSLATION
 GRN_focus_Connecting_Greenland_desc: "Jak náš národ roste, roste i naše potřeba infrastruktury. Proto musíme nadále investovat nejen do infrastruktury samotné, ale i do způsobů její údržby a do toho, jak ji lépe přizpůsobit prostředí, v němž ji budujeme." # todo: NEW TRANSLATION
 GRN_focus_Economic_Modernism_Plan: "Plán ekonomického modernismu" # todo: NEW TRANSLATION
 GRN_focus_Economic_Modernism_Plan_desc: "Pokračující diverzifikace naší ekonomiky je zásadní pro její stabilitu a zdraví. Musíme zlepšit nedostatky v širším civilním sektoru a v sektoru kanceláří a technologií." # todo: NEW TRANSLATION
 GRN_focus_Office_District_West: "Západní kancelářská čtvrť" # todo: NEW TRANSLATION
 GRN_focus_Office_District_West_desc: "Rozvoj obecného kancelářského sektoru v západním regionu nám umožní rozšířit produkty a služby, které si občané budou moci užívat." # todo: NEW TRANSLATION
 GRN_focus_Tech_Sector_Growth: "Růst technologického sektoru" # todo: NEW TRANSLATION
 GRN_focus_Tech_Sector_Growth_desc: "Růst kancelářského a služebního sektoru obvykle doprovází také celkový rozvoj technologického sektoru. Měli bychom ho zajistit, abychom dosáhli co největší možné rozmanitosti naší ekonomiky." # todo: NEW TRANSLATION
 GRN_focus_Civilian_Sector_Investments: "Investice do civilního sektoru" # todo: NEW TRANSLATION
 GRN_focus_Civilian_Sector_Investments_desc: "Tyto podniky potřebují průmyslové zázemí pro výrobu a případné využití svých produktů, což doplní naše úsilí o rozvoj a diverzifikaci kancelářského sektoru." # todo: NEW TRANSLATION
 GRN_focus_National_Economic_Modernity: "Národní ekonomická modernita" # todo: NEW TRANSLATION
 GRN_focus_National_Economic_Modernity_desc: "Naše investice byly přinejmenším rozmanité a plodné, ale to je teprve začátek. Musíme udělat vše pro nejlepší možný výsledek pro naše občany i budoucnost našeho národa." # todo: NEW TRANSLATION
 GRN_focus_Resource_Extraction_Projects: "Projekty těžby surovin" # todo: NEW TRANSLATION
 GRN_focus_Resource_Extraction_Projects_desc: "Ostrov překypuje dosud nevyužitými zdroji. Pokud chceme dosáhnout domácí bezpečnosti, zahraničních investic či obchodu, musíme rozvinout sektor těžby surovin podle toho, co považujeme za nejlepší pro národ." # todo: NEW TRANSLATION
 GRN_focus_Iron_Mining_Operations: "Těžba železa" # todo: NEW TRANSLATION
 GRN_focus_Iron_Mining_Operations_desc: "Železo je základní ruda, kterou je třeba těžit a využívat v celé ekonomice. Zahájíme národní investice do rozvoje těžebních operací, aby co nejlépe odpovídaly našim potřebám." # todo: NEW TRANSLATION
 GRN_focus_Project_Alumina_Oxide: "Projekt oxidu hlinitého" # todo: NEW TRANSLATION
 GRN_focus_Project_Alumina_Oxide_desc: "Dosud jsme sice neobjevili přímá ložiska bauxitu, ale zjistili jsme, že potřebný oxid hlinitý lze získávat z jiných minerálů a vyrábět z něj hliník. Budeme proto potřebovat rozsáhlé investice do provozů a výzkumu izolace, abychom co nejlépe využili i to málo, co máme." # todo: NEW TRANSLATION
 GRN_focus_Lithium_Mining_Operations: "Těžba lithia" # todo: NEW TRANSLATION
 GRN_focus_Lithium_Mining_Operations_desc: "Ložiska lithia a podobných stavebních minerálů budou klíčová pro rozšíření našich schopností inovovat a růst technologického a služebního sektoru. Investice do těžby lithia, kobaltu a dalších surovin výrazně zvýší naši ekonomickou flexibilitu." # todo: NEW TRANSLATION
 GRN_focus_Project_Rare_Minerals: "Projekt vzácných minerálů" # todo: NEW TRANSLATION
 GRN_focus_Project_Rare_Minerals_desc: "Rozsáhlé investice do prvků vzácných zemin, jako je neodym, a dalších dostupných ložisek výrazně posílí naše mezinárodní postavení při obchodních jednáních. Doufáme, že díky těmto investicím dosáhneme jako národ nových výšin a přilákáme více kapitálových investic." # todo: NEW TRANSLATION
 GRN_focus_Black_Gold_Extraction_Efforts: "Těžba černého zlata" # todo: NEW TRANSLATION
 GRN_focus_Black_Gold_Extraction_Efforts_desc: "Investice do našich ropných ložisek nám poskytnou dostatek levné energie a také silnou vyjednávací kartu pro budoucí obchodní dohody. Kromě toho můžeme vytěženou ropu a uhlí využít k posílení našeho syntetického a petrochemického průmyslu." # todo: NEW TRANSLATION
 GRN_focus_Project_Glacial_Rubber: "Projekt ledovcového kaučuku" # todo: NEW TRANSLATION
 GRN_focus_Project_Glacial_Rubber_desc: "Rozsáhlé experimenty a investice do specializovaných VFF, určených konkrétně k pěstování kaučukovníků, spolu s využitím uhlí a ropy pro výrobu syntetiky a petrochemikálií znamenají, že můžeme prozkoumat všechny dostupné cesty k zajištění domácích dodávek kaučuku." # todo: NEW TRANSLATION
 GRN_focus_Polar_Bear_Policies: "Politika ledního medvěda" # todo: NEW TRANSLATION
 GRN_focus_Polar_Bear_Policies_desc: "Nyní, když je náš národ stabilní, rozvinutý a připravený k obraně i případnému útoku, můžeme začít hledět za hranice ostrova. Naše zahraniční politika určí naši skutečnou budoucnost a cíle, kterých chceme dosáhnout vlastními silami." # todo: NEW TRANSLATION
 GRN_focus_The_Atlantic_Stepping_Stone: "Atlantický odrazový můstek" # todo: NEW TRANSLATION
 GRN_focus_The_Atlantic_Stepping_Stone_desc: "Buďme k sobě upřímní: jakýkoli skutečný směr zahraniční politiky bude v určité chvíli zahrnovat Island. Tak to vyřešme a zjistěme, co přesně budeme dělat. To nejen určí tempo našich budoucích zahraničněpolitických snah, ale bude i vhodnou zkouškou naší schopnosti orientovat se v moderním světě." # todo: NEW TRANSLATION
 GRN_focus_Investing_In_Brotherhood: "Investice do bratrství" # todo: NEW TRANSLATION
 GRN_focus_Investing_In_Brotherhood_desc: "Pokud chceme užší vazby a vztahy, natož případný budoucí svazek mezi námi, musíme vybudovat důvěru. Můžeme toho dosáhnout řadou investic, které prospějí více jim než nám. Pokud budeme hrát dlouhou hru, nakonec z toho budeme těžit oba. Pamatujte, pomalu, ale jistě." # todo: NEW TRANSLATION
 GRN_focus_Reykjavik_Investment_Firm: "Islandská investiční společnost" # todo: NEW TRANSLATION
 GRN_focus_Reykjavik_Investment_Firm_desc: "Island je v NATO, což představuje problém. Musíme najít způsob, jak omezit jeho závislost a domnělou potřebu cizinců, zejména americké pomoci, pokud chceme ostrov zajistit pro sebe. Nabídněme jim tedy nabídku, kterou nemohou odmítnout. Na drobný text se neohlížejte, podepište tady." # todo: NEW TRANSLATION
 GRN_focus_Operation_Real_Green: "Operace: Skutečná zeleň" # todo: NEW TRANSLATION
 GRN_focus_Operation_Real_Green_desc: "Vyčerpali jsme všechny možnosti. Musíme ostrov zajistit kvůli naší subregionální obraně oblasti severního Atlantiku. Zajistíme rybolov i obchod v našem zájmu a pro naši ekonomiku. Předběžné hlídkování proti agresivním průzkumným opatřením navíc přinese oblasti větší stabilitu." # todo: NEW TRANSLATION
 GRN_focus_Passive_Administration_Act: "Zákon o pasivní správě" # todo: NEW TRANSLATION
 GRN_focus_Passive_Administration_Act_desc: "Nyní, když je Island pod naší přímější kontrolou, musíme pomoci s jeho začleněním a vytvořit užší svazek podobných národů. Zvolíme proto pasivnější přístup a v podstatě vytvoříme měkkou konfederaci navzdory federálnějšímu uspořádání." # todo: NEW TRANSLATION
 GRN_focus_The_North_Sea_Gambit: "Gambit Severního moře" # todo: NEW TRANSLATION
 GRN_focus_The_North_Sea_Gambit_desc: "Faerské ostrovy leží uprostřed Severního moře. Zajistíme je jakýmikoli prostředky a připravíme půdu pro vyvolání dánské reakce. Doufáme, že Dánsko vyhlásí válku nám, čímž obejdeme doktrínu článku 5 NATO. Zároveň získáme opěrný bod na kontinentu a bližší základnu pro operace na severu či jihu." # todo: NEW TRANSLATION
 GRN_focus_Friends_On_The_Other_Side: "Přátelé na druhé straně" # todo: NEW TRANSLATION
 GRN_focus_Friends_On_The_Other_Side_desc: "Abychom si získali srdce a mysl obyvatel Faerských ostrovů, musíme působit laskavě. Uděláme tedy vše v našem zájmu, abychom sloužili jejich zájmům. K nastolení správného tempa a tónu stačí několik nenápadných rozhovorů s místními obyvateli a pracovníky projektů o tom, jak dobře se k nim Dánsko nikdy nechovalo." # todo: NEW TRANSLATION
 GRN_focus_Operation_Fair_Oh: "Operace: Fér, no" # todo: NEW TRANSLATION
 GRN_focus_Operation_Fair_Oh_desc: "Faerské ostrovy jsou pod dánskou kontrolou, ale zdá se, že Dánům na ničem nezáleží víc než na zachování statu quo. Co kdybychom ostrovy prostě sebrali a sledovali, co se stane? Pokud při převzetí neprolijeme krev, je to vůbec útok? A pokud přesvědčíme obyvatele, aby se k nám přidali dříve, než se Dánsko odvolá, kdo by se skutečně vydal na pomoc Dánsku proti národu, o němž si nejspíš všichni myslí, že si s ním Dánsko poradí samo? Je to dokonalý agresivní, ale neagresivní plán." # todo: NEW TRANSLATION
 GRN_focus_Continental_Shenanigans: "Kontinentální alotria" # todo: NEW TRANSLATION
 GRN_focus_Continental_Shenanigans_desc: "Nyní, když máme zajištěné odrazové můstky v Severním moři, obracíme pozornost ke kontinentu. Jinými slovy se vracíme ke svému někdejšímu vládci, abychom se vylodili na kontinentu, než zjistíme, kam přesně zamíříme dál." # todo: NEW TRANSLATION
 GRN_focus_Family_Investments: "Rodinné investice" # todo: NEW TRANSLATION
 GRN_focus_Family_Investments_desc: "Dánsko už prohlédlo naše alotria, takže ho musíme zmást pasivnějším přístupem. Vzhledem k naší nedávné historii ho musíme nechat uvolnit se a polevit v ostražitosti, abychom mohli věci pokud možno řešit mírumilovněji." # todo: NEW TRANSLATION
 GRN_focus_Jylland_Investment_Firm: "Jutská investiční společnost" # todo: NEW TRANSLATION
 GRN_focus_Jylland_Investment_Firm_desc: "Budeme postupovat stejně jako na Islandu. Série rozsáhlých investic nám umožní zasít drobné veřejné problémy a politicky izolovat Dánsko od jeho aliančních závazků." # todo: NEW TRANSLATION
 GRN_focus_Operation_Middleman: "Operace: Prostředník" # todo: NEW TRANSLATION
 GRN_focus_Operation_Middleman_desc: "Dánsko je prostředníkem mezi severskými členy rodiny a kontinentálním bojem všech proti všem. Musíme ho zajistit, chceme-li později hladce pokračovat v cestě k našemu konečnému cíli." # todo: NEW TRANSLATION
 GRN_focus_Civil_Service_Integration: "Integrace státní správy" # todo: NEW TRANSLATION
 GRN_focus_Civil_Service_Integration_desc: "Standardizace a začlenění dánských veřejných služeb do současného aparátu státní správy umožní soudržnější a méně rušivé každodenní fungování programů i lidí, kteří je potřebují." # todo: NEW TRANSLATION
 GRN_focus_Nordic_Regional_Operations: "Severské regionální operace" # todo: NEW TRANSLATION
 GRN_focus_Nordic_Regional_Operations_desc: "Po získání Dánska a vytvoření centrálního velitelského centra můžeme lépe zobecnit naše strategické cíle a schopnosti. Formát zůstane stejný, ale nyní bude mít širší záběr a přinejmenším nepřímější přístupy pro lepší soudržnost." # todo: NEW TRANSLATION
 GRN_focus_West_Nordic_Interests: "Západoseverské zájmy" # todo: NEW TRANSLATION
 GRN_focus_West_Nordic_Interests_desc: "Postupem času se pokusíme získat vnitřní vliv, zajistit norské zdroje a získat civilní podporu větší severské unie." # todo: NEW TRANSLATION
 GRN_focus_North_Fjords_Investment_Firm: "Investiční společnost Severních fjordů" # todo: NEW TRANSLATION
 GRN_focus_North_Fjords_Investment_Firm_desc: "Podobně jako v případě Islandu a Grónska budeme rozvíjet vlastní zájmy prostřednictvím rozvoje norských zájmů." # todo: NEW TRANSLATION
 GRN_focus_Operation_Fjordsland: "Operace: Fjordská země" # todo: NEW TRANSLATION
 GRN_focus_Operation_Fjordsland_desc: "Zajištění Norska nám poskytne neomezený přístup k obchodním trasám a zdrojům Severního moře. Získáme vyjednávací kartu vůči NATO při obraně proti Rusku a opěrný bod v širším severském regionu." # todo: NEW TRANSLATION
 GRN_focus_North_Sea_Negotiations: "Jednání o Severním moři" # todo: NEW TRANSLATION
 GRN_focus_North_Sea_Negotiations_desc: "Spolupráce s obyvatelstvem a zjišťování jeho očekávání od nového statu quo pomůže zlepšit a usnadnit celý proces integrace." # todo: NEW TRANSLATION
 GRN_focus_Central_Nordic_Interests: "Středoseverské zájmy" # todo: NEW TRANSLATION
 GRN_focus_Central_Nordic_Interests_desc: "Uděláme vše pro zajištění našich zájmů ve Švédsku a ve střední části severských národů, což bude velmi prospěšné pro naše budoucí záměry." # todo: NEW TRANSLATION
 GRN_focus_Karlstad_Central_Investments_Agency: "Ústřední investiční agentura Karlstadu" # todo: NEW TRANSLATION
 GRN_focus_Karlstad_Central_Investments_Agency_desc: "Investice a rozvoj oblasti kolem Karlstadu a dalších měst nám přinesou příznivější veřejné mínění a umožní investovat nejen do budoucnosti Švédska, ale i do té naší." # todo: NEW TRANSLATION
 GRN_focus_Operation_Great_Northern_War: "Operace: Velká severní válka" # todo: NEW TRANSLATION
 GRN_focus_Operation_Great_Northern_War_desc: "Přátelská stránka politiky nás navzdory obecnému postoji Švédska v regionu zklamala. Proto jsme nuceni uchýlit se k ráznějším prostředkům k dosažení našich konečných cílů." # todo: NEW TRANSLATION
 GRN_focus_Stockholm_Community_Programs: "Komunitní programy Stockholmu" # todo: NEW TRANSLATION
 GRN_focus_Stockholm_Community_Programs_desc: "Kontakt s komunitami a větší úsilí o stabilní a obecně pozitivnější dojmy pomůže lépe usadit integrační snahy mezi obyvatelstvem i místními správami." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Nordic_Interests: "Východoseverské zájmy" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Nordic_Interests_desc: "Zajištění Finska by z nás učinilo významnou vyjednávací kartu mezi soupeřícími mocnostmi USA a Ruska. Jelikož Finsko sdílí významnou hranici s Velkým východním medvědem, měli bychom zjistit, co můžeme udělat pro dosažení našich budoucích cílů." # todo: NEW TRANSLATION
 GRN_focus_Suomen_Investment_Agency: "Investiční agentura Suomen" # todo: NEW TRANSLATION
 GRN_focus_Suomen_Investment_Agency_desc: "Zajištění rozvoje a budoucnosti, kterou si zřejmě přejí Finové, spolu s úsilím usnadnit budoucnost, po níž toužíme my, je vhodným způsobem, jak zjistit, zda můžeme Finsko zajistit pro vlastní účely." # todo: NEW TRANSLATION
 GRN_focus_Operation_Mannerheim: "Operace: Mannerheim" # todo: NEW TRANSLATION
 GRN_focus_Operation_Mannerheim_desc: "Zajištění zamrzlých finských zemí bude jako zajištění domova daleko od domova. Terén je obecně mnohem rovinatější, ale jeho prostředí je podobně nehostinné. Proto bychom měli být schopni tato území zajistit bez větších obtíží." # todo: NEW TRANSLATION
 GRN_focus_Continued_Peaceable_Autonomy: "Pokračující mírová autonomie" # todo: NEW TRANSLATION
 GRN_focus_Continued_Peaceable_Autonomy_desc: "Finové jsou vážený národ, který si cení samoty stejně jako solidarity mezi kulturně spřízněnými národy. Na základě vzájemného porozumění a rovnoprávné dohody tak budeme moci území ovládat s dostatečnou pomocí, pokud bude zacházení spravedlivé a civilisté ani vláda nebudou nuceni jednat proti své vůli. Zní to pro nás nevýhodně, ale ve skutečnosti je to mnohem snazší, než si mnozí uvědomují." # todo: NEW TRANSLATION
 GRN_focus_Solidifying_Nordic_Unity: "Upevnění severské jednoty" # todo: NEW TRANSLATION
 GRN_focus_Solidifying_Nordic_Unity_desc: "Nyní, když se naše ambice blíží skromnému závěru, musíme jednoduše odpočívat a užívat si plody naší práce, zatímco vytváříme novou severskou unii, která bude soupeřit s ostatními uniími po celém světě." # todo: NEW TRANSLATION
 GRN_focus_Continental_Ambitions: "Kontinentální ambice" # todo: NEW TRANSLATION
 GRN_focus_Continental_Ambitions_desc: "Nyní, když jsou severské národy sjednocené, můžeme obrátit pozornost k jihu. Tyto cíle jsou sice mnohem větší, než si dokážeme prakticky představit, ale pokud použijeme náš dosavadní diplomatický vzor, měli bychom být schopni učinit další krok v našich zahraničních ambicích. Kontinentální unie Inuitů." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Continental_Interests: "Východní kontinentální zájmy" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Continental_Interests_desc: "Nyní, když jsme položili základy severní konsolidace, můžeme hledět k jihu. Vytvoříme velkou východní hranici získáním opěrného bodu v baltském regionu." # todo: NEW TRANSLATION
 GRN_focus_Operation_Nordic_Adjacent: "Operace: Severské sousedství" # todo: NEW TRANSLATION
 GRN_focus_Operation_Nordic_Adjacent_desc: "Estonsko je z našich finských držav nejbližší oblastí pro vylodění. Můžeme buď provést výsadek, nebo zahájit rozsáhlou námořní invazi z Helsinek a rychle zajistit zemi, než ostatní mocnosti vůbec pomyslí na protest." # todo: NEW TRANSLATION
 GRN_focus_Operation_Riga_River: "Operace: Řeka Riga" # todo: NEW TRANSLATION
 GRN_focus_Operation_Riga_River_desc: "Zajištění Lotyšska nám poskytne centrální základnu pro rozšíření a zabezpečení zbytku baltského regionu." # todo: NEW TRANSLATION
 GRN_focus_Operation_Vilnius: "Operace: Vilnius" # todo: NEW TRANSLATION
 GRN_focus_Operation_Vilnius_desc: "Litva je pravděpodobně nejrozvinutější mocností v baltském regionu. Vyřadíme ji a další dvě země budou jako nedělní procházka městem." # todo: NEW TRANSLATION
 GRN_focus_Baltic_Behestment: "Baltská integrace" # todo: NEW TRANSLATION
 GRN_focus_Baltic_Behestment_desc: "Místní úřady i civilní obyvatelstvo se začínají uklidňovat a přijímat nový status quo, takže nyní můžeme začít integrovat bývalé baltské státy. Jako národ mají silnou vůli, a proto bychom jim snad mohli poskytnout podobné postavení, jaké jsme vyjednali s finskými místními úřady." # todo: NEW TRANSLATION
 GRN_focus_North_Sea_Security: "Bezpečnost Severního moře" # todo: NEW TRANSLATION
 GRN_focus_North_Sea_Security_desc: "Zajištění celého Severního moře a severního Atlantiku se ukáže jako nesmírně užitečné z hlediska globálního vlivu. Měli bychom pracovat na sjednocení Keltských ostrovů a jejich příslušných okupantů, abychom připravili cestu naší velkorysejší vládě." # todo: NEW TRANSLATION
 GRN_focus_Operation_Albion: "Operace: Albion" # todo: NEW TRANSLATION
 GRN_focus_Operation_Albion_desc: "Zajištění jádra toho, čím Spojené království je či kdysi bylo, bude klíčové pro další operace na Keltských ostrovech. Nemluvě o vytvoření kriticky důležité základny pro jakékoli západní kontinentální výstřelky." # todo: NEW TRANSLATION
 GRN_focus_Operation_Highlander: "Operace: Highlander" # todo: NEW TRANSLATION
 GRN_focus_Operation_Highlander_desc: "Zajištění skotského regionu nám umožní téměř úplnou kontrolu strategické oblasti Severního moře. Tím položíme základy pro obecný jižní postup na hlavní ostrov." # todo: NEW TRANSLATION
 GRN_focus_Operation_Great_Western_Nation: "Operace: Velký západní národ" # todo: NEW TRANSLATION
 GRN_focus_Operation_Great_Western_Nation_desc: "Strategická okupace Walesu a území někdejší Great Western Railway nám umožní využít infrastrukturu ke koordinaci zájmů na západě v Irsku i na jihovýchodě v Anglii." # todo: NEW TRANSLATION
 GRN_focus_Operation_Be_My_Mann: "Operace: Buď můj Mann" # todo: NEW TRANSLATION
 GRN_focus_Operation_Be_My_Mann_desc: "Zajištění strategicky položeného ostrova Man nám poskytne důležitou poznámku pod čarou při řešení jakýchkoli námořních problémů týkajících se celých Keltských ostrovů." # todo: NEW TRANSLATION
 GRN_focus_Operation_Ulster: "Operace: Ulster" # todo: NEW TRANSLATION
 GRN_focus_Operation_Ulster_desc: "Vzhledem k tomu, že je ostrov dodnes rozdělen, bude nejlepší vyřadit slabší severoirský stát Ulster. Jeho zajištění nám umožní pochodovat na jih a zabezpečit zbytek smaragdového ostrova." # todo: NEW TRANSLATION
 GRN_focus_Operation_Emerald_Isle: "Operace: Smaragdový ostrov" # todo: NEW TRANSLATION
 GRN_focus_Operation_Emerald_Isle_desc: "Zajištění celého Irska nám umožní lépe připravovat postupy do nejzápadnějších částí kontinentu. Nemluvě o tom, že poslouží jako základna pro druhý ostrov se „Spojeným“ královstvím." # todo: NEW TRANSLATION
 GRN_focus_Celtic_Consolidations: "Keltská konsolidace" # todo: NEW TRANSLATION
 GRN_focus_Celtic_Consolidations_desc: "Zahájení integračního úsilí a normalizace naší vlády a autority nad územím i lidmi si vyžádá čas. Poskytnutí pomoci a služeb a ukázka, že pod novým praporem dokážeme spolupracovat, však umožní všem vrátit se do běžného života." # todo: NEW TRANSLATION
 GRN_focus_Western_European_Advances: "Postup v západní Evropě" # todo: NEW TRANSLATION
 GRN_focus_Western_European_Advances_desc: "Náš stálý pochod kontinentem bude obrovským skokem vpřed, když obrátíme pozornost k západnímu centrálnímu pásmu národů." # todo: NEW TRANSLATION
 GRN_focus_Operation_Bonaparte: "Operace: Bonaparte" # todo: NEW TRANSLATION
 GRN_focus_Operation_Bonaparte_desc: "Francie je základním kamenem západoevropského válčiště. Slouží také jako brána do Iberie, až se rozhodneme vydat tímto směrem. Je čas upevnit nejzápadnější stát centrální osy kontinentu." # todo: NEW TRANSLATION
 GRN_focus_Operation_Windmill: "Operace: Větrný mlýn" # todo: NEW TRANSLATION
 GRN_focus_Operation_Windmill_desc: "Nizozemsko nám poslouží jako výborné západní předmostí na kontinentu. Jelikož většinu země tvoří pobřeží, měli bychom ji zajistit během okamžiku." # todo: NEW TRANSLATION
 GRN_focus_Operation_Rhine_Rumble: "Operace: Rýnský rachot" # todo: NEW TRANSLATION
 GRN_focus_Operation_Rhine_Rumble_desc: "Německo představuje nejcentrálnější bod celého evropského kontinentu. Zajistíme je a postupně zajistíme celý kontinent." # todo: NEW TRANSLATION
 GRN_focus_Operation_Chocolate_Waffle: "Operace: Čokoládová vafle" # todo: NEW TRANSLATION
 GRN_focus_Operation_Chocolate_Waffle_desc: "Belgie, národ, který by rozumně vzato neměl existovat. Jako britský výtvor před několika stovkami let představuje trn v oku skutečné evropské jednoty. Tento trn odstraníme s nejvyšší možnou rychlostí." # todo: NEW TRANSLATION
 GRN_focus_Operation_Speed_Bump: "Operace: Zpomalovací práh" # todo: NEW TRANSLATION
 GRN_focus_Operation_Speed_Bump_desc: "Je to Lucembursko, není to hrozba, pokud se nepřipojí ke koalici dalších národů. Vezmeme si ho teď, dobře? Tak zatím." # todo: NEW TRANSLATION
 GRN_focus_French_Values_Greenlandic_Leadership: "Francouzské hodnoty, grónské vedení" # todo: NEW TRANSLATION
 GRN_focus_French_Values_Greenlandic_Leadership_desc: "Zajištění poslušnosti silně rozjitřeného obyvatelstva Francie vůči novému statusu quo si vyžádá značné množství času a úsilí. Pokud však ukážeme, že nechceme měnit jejich hodnoty, pouze vyměnit vedení, které jim vládne, snad se nám podaří s lidmi lépe spolupracovat." # todo: NEW TRANSLATION
 GRN_focus_German_Traditions_Greenlandic_Initiative: "Německé tradice, grónské iniciativy" # todo: NEW TRANSLATION
 GRN_focus_German_Traditions_Greenlandic_Initiative_desc: "Německo má bohatou historii vojenských tradic. Pokud toho dokážeme využít, kontinentální hegemonie bude naše. Německá vojenská zdatnost smíšená s grónskými ambicemi a sebeúctou." # todo: NEW TRANSLATION
 GRN_focus_Low_Countries_Low_Maintainance: "Nízké země, nízká údržba" # todo: NEW TRANSLATION
 GRN_focus_Low_Countries_Low_Maintainance_desc: "Od zemí Beneluxu se očekává pouze férové zacházení a možnost zůstat svobodomyslnými. Vzhledem k tomu, že se pokoušíme vytvořit unii rovných, ukazuje se to mnohem snazší, než se očekávalo." # todo: NEW TRANSLATION
 GRN_focus_Iberian_Atlantic_Interests: "Iberské atlantické zájmy" # todo: NEW TRANSLATION
 GRN_focus_Iberian_Atlantic_Interests_desc: "Iberský region představuje strategickou překážku mezi převážně centrálním Atlantikem a hlavním přístupovým bodem do Středomoří. Pokud chceme zajistit celý kontinent, musíme zabezpečit tento životně důležitý obchodní a logistický uzel." # todo: NEW TRANSLATION
 GRN_focus_Operation_Castile: "Operace: Kastilie" # todo: NEW TRANSLATION
 GRN_focus_Operation_Castile_desc: "Španělsko je hlavním hráčem v Iberii. Zajistíme je a prakticky tím zajistíme celý region." # todo: NEW TRANSLATION
 GRN_focus_Operation_Fontainebleau: "Operace: Fontainebleau" # todo: NEW TRANSLATION
 GRN_focus_Operation_Fontainebleau_desc: "Napoleon se kdysi pokusil dobýt Portugalce prostřednictvím smlouvy se Španělskem. Dnes je všechno jinak, protože Portugalsko dobydeme v zájmu iberské jednoty a evropského federalismu. Čeká nás nový úsvit a Portugalsko je branou ke konsolidaci Iberie." # todo: NEW TRANSLATION
 GRN_focus_Operation_The_Other_Galicia: "Operace: Druhá Galicie" # todo: NEW TRANSLATION
 GRN_focus_Operation_The_Other_Galicia_desc: "Většina lidí mimo Evropu si při zmínce o Galicii představí region kolem západní Ukrajiny. My však máme na mysli galicijský národ na severozápadě Iberie." # todo: NEW TRANSLATION
 GRN_focus_Operation_Basquing_In_the_Sun: "Operace: Baskování na slunci" # todo: NEW TRANSLATION
 GRN_focus_Operation_Basquing_In_the_Sun_desc: "Vypořádat se s baskickým národem bude snadné, pokud jsme to už neudělali. Udělali? Zapomněl jsem." # todo: NEW TRANSLATION
 GRN_focus_Operation_Barcelona: "Operace: Barcelona" # todo: NEW TRANSLATION
 GRN_focus_Operation_Barcelona_desc: "Zajištění severovýchodní části Iberie nám umožní vytvořit předmostí na druhé straně horských pásem, která vymezují francouzsko-španělskou hranici." # todo: NEW TRANSLATION
 GRN_focus_Operation_Casablanca: "Operace: Casablanca" # todo: NEW TRANSLATION
 GRN_focus_Operation_Casablanca_desc: "Jižní region známý jako Andalusie nám v rámci Iberie poskytne nezpochybnitelnou kontrolu nad naší polovinou Gibraltarského průlivu." # todo: NEW TRANSLATION
 GRN_focus_Iberian_Idealism: "Iberský idealismus" # todo: NEW TRANSLATION
 GRN_focus_Iberian_Idealism_desc: "Nyní, když máme region zcela pod kontrolou, můžeme začít pěstovat pocit regionální jednoty. Využijeme kultury a národy, jejich dějiny i ducha, abychom podpořili nový pocit hrdosti. Jednota skrze sílu a prosperitu, soudržnost v dobrém i zlém." # todo: NEW TRANSLATION
 GRN_focus_Alpine_Block_Nations: "Alpské blokové národy" # todo: NEW TRANSLATION
 GRN_focus_Alpine_Block_Nations_desc: "Jižní centrální region ovládají horské terény. Od alpských pásem na nejsevernějších částech italských hranic až po různá pohoří táhnoucí se samotnou Itálií. Pokud chceme postupovat dále na východ, musíme tento přirozeně obranný region zajistit." # todo: NEW TRANSLATION
 GRN_focus_Operation_Neutral_No_More: "Operace: Neutralita končí" # todo: NEW TRANSLATION
 GRN_focus_Operation_Neutral_No_More_desc: "Švýcarsko je národ hor. Dobudeme ho a budeme moci dobýt prakticky cokoli." # todo: NEW TRANSLATION
 GRN_focus_Operation_Vienna_Calling: "Operace: Volá Vídeň" # todo: NEW TRANSLATION
 GRN_focus_Operation_Vienna_Calling_desc: "Od Alp až po maďarské roviny zajistíme Rakousko a otevřeme cestu na východ i jih." # todo: NEW TRANSLATION
 GRN_focus_Operation_Slovene_And_Slide: "Operace: Slovinsko a skluz" # todo: NEW TRANSLATION
 GRN_focus_Operation_Slovene_And_Slide_desc: "Získání předmostí na severním Balkáně nám pomůže zajistit region, jakmile k němu obrátíme pozornost." # todo: NEW TRANSLATION
 GRN_focus_Operation_Gelato: "Operace: Gelato" # todo: NEW TRANSLATION
 GRN_focus_Operation_Gelato_desc: "Itálie leží strategicky v jižním středu Evropy a ve Středozemním moři. Jejím zajištěním získáme důležitý námořní aparát pro další operace." # todo: NEW TRANSLATION
 GRN_focus_Securing_Local_Interests: "Zajištění místních zájmů" # todo: NEW TRANSLATION
 GRN_focus_Securing_Local_Interests_desc: "Ohled na zájmy místního obyvatelstva a jeho potřeby pomůže vrhnout na situaci nové a pozitivnější světlo. Doufáme, že díky lepšímu kontaktu s lidmi bude předání moci plynulejší." # todo: NEW TRANSLATION
 GRN_focus_Great_Eastern_Interests: "Velké východní zájmy" # todo: NEW TRANSLATION
 GRN_focus_Great_Eastern_Interests_desc: "Nyní, když je naše předmostí na východě zajištěno, můžeme se rozšířit do zbytku východní Evropy. Od polských a českých pohraničí až po běloruské a ukrajinské hranice. Zahájíme pochod na východ." # todo: NEW TRANSLATION
 GRN_focus_Operation_Heartbeat: "Operace: Tep srdce" # todo: NEW TRANSLATION
 GRN_focus_Operation_Heartbeat_desc: "Polsko je tlukoucím srdcem východní Evropy. Kvůli velkým investicím do vojenské připravenosti se mu přezdívá evropský Texas. Nyní to podrobíme nejvyšší zkoušce." # todo: NEW TRANSLATION
 GRN_focus_Operation_Carpathia: "Operace: Karpaty" # todo: NEW TRANSLATION
 GRN_focus_Operation_Carpathia_desc: "Většina slovenského národa leží na severním oblouku velkého karpatského pohoří. Pokud chceme získat základnu pro postup na jih do Balkánu, musíme tyto hory překročit." # todo: NEW TRANSLATION
 GRN_focus_Operation_Final_Rhapsody: "Operace: Závěrečná rapsodie" # todo: NEW TRANSLATION
 GRN_focus_Operation_Final_Rhapsody_desc: "Zajištění Česka nám umožní prakticky upevnit celý severní přístup na Balkán. Je to další krok k evropské jednotě." # todo: NEW TRANSLATION
 GRN_focus_Operation_White_Russian: "Operace: Bělorus" # todo: NEW TRANSLATION
 GRN_focus_Operation_White_Russian_desc: "Bělorusko je klíčovým článkem, který drží ruské zájmy v Evropě, pomineme-li samozřejmě staré historické ambice. Pokud chceme skutečně upevnit kontrolu nad kontinentem, musíme jim vzít vítr z plachet." # todo: NEW TRANSLATION
 GRN_focus_Operation_Bread_Basket: "Operace: Obilnice" # todo: NEW TRANSLATION
 GRN_focus_Operation_Bread_Basket_desc: "Zajištění obilnice kontinentu by nám prospělo mnoha způsoby. Jistě toho musíme dosáhnout." # todo: NEW TRANSLATION
 GRN_focus_Operation_Soviet_Storm: "Operace: Sovětská bouře" # todo: NEW TRANSLATION
 GRN_focus_Operation_Soviet_Storm_desc: "Podněstří je samo o sobě časovou kapslí. Jako jedna z posledních bašt SSSR je tento národ, ač malý, nesmírně hrdý a vzdorovitý díky svým téměř stínovým mechanismům, které ho nějak udržují při životě." # todo: NEW TRANSLATION
 GRN_focus_Operation_Your_Right_No_Your_Other_Right: "Operace: Vaše pravá, ne druhá pravá" # todo: NEW TRANSLATION
 GRN_focus_Operation_Your_Right_No_Your_Other_Right_desc: "Musíme zaútočit na Moldavsko... ne, ne na rumunský region, ale na tento národ. Ano, vím, že je to matoucí, ale neptejte se mě. Zeptejte se jich, až tam dorazíme." # todo: NEW TRANSLATION
 GRN_focus_Eastern_Territorial_Authority_Bureau: "Úřad pro východní územní správu" # todo: NEW TRANSLATION
 GRN_focus_Eastern_Territorial_Authority_Bureau_desc: "ETAB je specializovaná agentura určená k řešení svobodomyslnějších východních národů. Tito lidé mají rozsáhlé venkovské oblasti, které jsou z hlediska centralizace víceméně stále nezkrocené. Můžeme provádět infrastrukturní projekty a programy práce s komunitami, abychom snad uklidnili a vyřešili všechny dlouhodobé problémy, na které narazíme." # todo: NEW TRANSLATION
 GRN_focus_Balkan_Bounties: "Balkánské kořisti" # todo: NEW TRANSLATION
 GRN_focus_Balkan_Bounties_desc: "Poslední hřeby do rakve našeho rozsáhlého projektu: balkánské národy. Země válek a dějin, kterou budeme rozsáhle krotit, abychom zkrotili tuto nestabilní zoologickou zahradu." # todo: NEW TRANSLATION
 GRN_focus_Operation_Nosferatu: "Operace: Nosferatu" # todo: NEW TRANSLATION
 GRN_focus_Operation_Nosferatu_desc: "Transylvánská kotlina v Karpatech je strategickou obrannou pozicí. Samotné Rumunsko navíc disponuje značnou energetickou produkcí, a proto můžeme tyto zdroje lépe využít ve prospěch všech." # todo: NEW TRANSLATION
 GRN_focus_Operation_Bulgar: "Operace: Bulhar" # todo: NEW TRANSLATION
 GRN_focus_Operation_Bulgar_desc: "Upevnění východního úseku podél Černého moře nám pomůže zkonsolidovat úsilí směřující do vnitrozemí Balkánu." # todo: NEW TRANSLATION
 GRN_focus_Operation_Alexander_Not_So_Great: "Operace: Alexandr ne tak velký" # todo: NEW TRANSLATION
 GRN_focus_Operation_Alexander_Not_So_Great_desc: "Makedonie tvrdí, že se může pyšnit historickou postavou Alexandra Velikého. Já ho však nyní nevidím, takže od této chvíle převezmeme vládu my." # todo: NEW TRANSLATION
 GRN_focus_Operation_Trianon: "Operace: Trianon" # todo: NEW TRANSLATION
 GRN_focus_Operation_Trianon_desc: "Maďarský národ se rozkládá přes severní centrální plošinu Balkánu. Pokud ji zajistíme, otevře se nám jasná cesta na jih ke Středozemnímu moři." # todo: NEW TRANSLATION
 GRN_focus_Operation_Princip: "Operace: Princip" # todo: NEW TRANSLATION
 GRN_focus_Operation_Princip_desc: "Od Černé ruky, která rozpoutala světovou válku, nyní dáme srbskému národu políček a vypořádáme se s jedním z největších podněcovatelů požárů v regionu." # todo: NEW TRANSLATION
 GRN_focus_Operation_Koso_Woah: "Operace: Koso wow" # todo: NEW TRANSLATION
 GRN_focus_Operation_Koso_Woah_desc: "Zpomalení, kterým je Kosovo, představuje pro Srbsko větší trn v oku než pro nás. Proto by to měla být rychlá záležitost." # todo: NEW TRANSLATION
 GRN_focus_Operation_Scissors: "Operace: Nůžky" # todo: NEW TRANSLATION
 GRN_focus_Operation_Scissors_desc: "Zajištění Chorvatska nám poskytne významné pobřežní zázemí a pozice pro útoky z boku, zatímco budeme sledovat naše jižnější ambice." # todo: NEW TRANSLATION
 GRN_focus_Operation_Minefield: "Operace: Minové pole" # todo: NEW TRANSLATION
 GRN_focus_Operation_Minefield_desc: "Naší největší obavou při podmaňování hluboce rozděleného národa Bosny je skutečnost, že celá země je prakticky předem položeným minovým polem. Pokud se chceme v dohledné době skutečně někam dostat, budeme muset přivézt dostatek vybavení k jejich likvidaci." # todo: NEW TRANSLATION
 GRN_focus_Operation_Mountain_Man: "Operace: Horák" # todo: NEW TRANSLATION
 GRN_focus_Operation_Mountain_Man_desc: "Černohorské hory se dobývají těžko, ale dostaneme se tam dříve či později." # todo: NEW TRANSLATION
 GRN_focus_Operation_Adriatic_Gateway: "Operace: Jadranská brána" # todo: NEW TRANSLATION
 GRN_focus_Operation_Adriatic_Gateway_desc: "Zajištění Albánie nám umožní uzavřít Jaderské moře. Tím získáme obrovský potenciál pro stavbu námořnictva a v podstatě i rozsáhlou síť přístavů, kterou můžeme využít pro operace ve Středozemním moři." # todo: NEW TRANSLATION
 GRN_focus_Operation_This_Is_Sparta: "Operace: Tohle je Sparta" # todo: NEW TRANSLATION
 GRN_focus_Operation_This_Is_Sparta_desc: "Řecko, poloostrovní a ostrovní národ s významnými kulturními a historickými poklady. Zajistíme tento samotný uzel historie, ale musíme se ze všech sil snažit nezničit historická místa." # todo: NEW TRANSLATION
 GRN_focus_Southern_Territorial_Authority_Commission: "Komise pro jižní územní správu" # todo: NEW TRANSLATION
 GRN_focus_Southern_Territorial_Authority_Commission_desc: "Vytvoření specializované komise nám umožní soustředit integrační a sjednocovací opatření, abychom neměli celonárodní problém kvůli potížím určité oblasti s tím, že si nedokáže hledět svého." # todo: NEW TRANSLATION
 GRN_focus_Establishing_The_Frozen_Federation: "Založení Ledové federace" # todo: NEW TRANSLATION
 GRN_focus_Establishing_The_Frozen_Federation_desc: "Konečně jsme to dokázali. Vytvořili jsme sjednocený federální národ, který spojuje zamrzlé severní národy se zbytkem národů Evropské kontinentální unie. Samozřejmě není dokonalý, a proto nezahrnuje celý geografický kontinentální region Evropy. Přesto jde o náš vklad do dějin a ze všech sil budeme hájit hodnoty a národy, které nyní držíme pod svými křídly. Za Federaci!" # todo: NEW TRANSLATION
 GRN_focus_The_Great_Ice_Shelf: "Velký ledový šelf" # todo: NEW TRANSLATION
 GRN_focus_The_Great_Ice_Shelf_desc: "Rozsáhlé vnitrozemí našeho národa není nic jiného než obrovská ledová plocha. S tím, jak se rozvíjí náš národ, jsme však dokázali šelf postupně odsekávat kontrolovaným využíváním zmrzlé vody. Nyní můžeme plně zaměřit pozornost na vnitrozemí, připravit jeho osídlení a řádný rozvoj. Budoucnost je zelená a my objevíme země pod ledem." # todo: NEW TRANSLATION
 GRN_focus_Southern_Interior_Development_Projects: "Projekty rozvoje jižního vnitrozemí" # todo: NEW TRANSLATION
 GRN_focus_Southern_Interior_Development_Projects_desc: "Začneme se zabývat jižní oblastí vnitrozemí, kterou jsme vyčlenili pro rozvoj a logistickou přípravu." # todo: NEW TRANSLATION
 GRN_focus_Southern_Settlement_Projects: "Projekty osídlení jihu" # todo: NEW TRANSLATION
 GRN_focus_Southern_Settlement_Projects_desc: "Z logistických důvodů začneme zakládat několik strategicky umístěných osad, které zvýší nejen místní populaci, ale vytvoří také určitý zásobovací řetězec v regionu. To nám pomůže uskutečnit budoucí projekty, jejichž prostřednictvím se konečně pokusíme zkrotit značnou část Velkého ledového šelfu." # todo: NEW TRANSLATION
 GRN_focus_Southern_Infrastructure_Projects: "Projekty jižní infrastruktury" # todo: NEW TRANSLATION
 GRN_focus_Southern_Infrastructure_Projects_desc: "Abychom propojili naše osady a zahájili jakoukoli hospodářskou činnost, budeme potřebovat určitou infrastrukturu, která zajistí, že nastavíme zlatý standard skutečného zkrocení přírody." # todo: NEW TRANSLATION
 GRN_focus_Southern_Economic_Projects: "Projekty jižního hospodářství" # todo: NEW TRANSLATION
 GRN_focus_Southern_Economic_Projects_desc: "Nyní, když jsou v jižním vnitrozemí lidé a infrastruktura, můžeme pomalu začít budovat vnitřní či místní ekonomickou základnu. Tento základ připraví půdu pro značný růst s postupem času." # todo: NEW TRANSLATION
 GRN_focus_Southern_Mining_Projects: "Projekty těžby na jihu" # todo: NEW TRANSLATION
 GRN_focus_Southern_Mining_Projects_desc: "Region se pomalu stabilizuje po hospodářské i společenské stránce, a tak nastal čas zahájit hlubinné vrtné těžební projekty. Led využijeme k nepřetržitému vrtání do hloubky, abychom získali skutečná geologická data a zároveň zabránili přehřívání zařízení kvůli teplotnímu rozdílu." # todo: NEW TRANSLATION
 GRN_focus_Taming_The_Southern_Interior: "Zkrocení jižního vnitrozemí" # todo: NEW TRANSLATION
 GRN_focus_Taming_The_Southern_Interior_desc: "Nyní, když máme k dispozici lidi, infrastrukturu i zdroje, můžeme říci, že jsme skutečně zkrotili část Velkého ledového šelfu. Naše práce samozřejmě nekončí, ani zdaleka. Nyní však můžeme s jistotou pohlédnout k velkému severnímu obzoru a říci, že jsme na velkolepé a plodné cestě." # todo: NEW TRANSLATION
 GRN_focus_Central_Plateau_Development_Projects: "Projekty rozvoje centrální plošiny" # todo: NEW TRANSLATION
 GRN_focus_Central_Plateau_Development_Projects_desc: "Nyní, když je jižní region v základních rysech zkrocen, můžeme velkou ledovou výpravu zahájit v centrální oblasti. Díky většímu množství ledu a potenciální rozlohy půdy budeme moci investovat do dalších základních ukazatelů." # todo: NEW TRANSLATION
 GRN_focus_Central_Settlement_Projects: "Projekty osídlení středu" # todo: NEW TRANSLATION
 GRN_focus_Central_Settlement_Projects_desc: "Stejně jako v jižním regionu začneme na celé plošině budovat strategické osady." # todo: NEW TRANSLATION
 GRN_focus_Central_Infrastructure_Projects: "Projekty centrální infrastruktury" # todo: NEW TRANSLATION
 GRN_focus_Central_Infrastructure_Projects_desc: "Po založení našich osad můžeme začít vytvářet dostatečnou infrastrukturní síť, která vše řádně propojí." # todo: NEW TRANSLATION
 GRN_focus_Central_Economic_Projects: "Projekty centrálního hospodářství" # todo: NEW TRANSLATION
 GRN_focus_Central_Economic_Projects_desc: "Obyvatelstvo, splněno. Infrastruktura, splněno. Nyní vykročíme vpřed a vytvoříme místní hospodářský aparát." # todo: NEW TRANSLATION
 GRN_focus_Central_Mining_Projects: "Projekty těžby ve středu" # todo: NEW TRANSLATION
 GRN_focus_Central_Mining_Projects_desc: "Stejně jako v jižním regionu jsme konečně vytvořili ekonomické i společenské sítě potřebné k přípravě těžby zdrojů. Oblast je mnohem větší než jih, takže doufejme v plodný podnik." # todo: NEW TRANSLATION
 GRN_focus_Taming_The_Central_Plateau: "Zkrocení centrální plošiny" # todo: NEW TRANSLATION
 GRN_focus_Taming_The_Central_Plateau_desc: "Nyní, když jsou na místě lidé, osady, potraviny, hospodářství i zdroje, můžeme oficiálně a s jistotou říci, že jsme zkrotili Velký ledový šelf. Časem nás čeká mnoho obtíží, ale prozatím i v dohledné budoucnosti se můžeme těšit z polární slávy našeho velkého a prosperujícího národa." # todo: NEW TRANSLATION
 GRN_eu_adjacent_nation: "Národ přidružený k EU" # todo: NEW TRANSLATION
 GRN_eu_adjacent_nation_desc: "Grónsko se nachází v zajímavé situaci. Jelikož leží nejdále od evropského kontinentu, není a pravděpodobně nikdy nebude členským státem EU. Díky svému statusu dánské korunní kolonie však získává stejné migrační a cestovní podmínky jako kterýkoli jiný členský stát EU. Mnoho Gróňanů toho využívá k hledání lepších vzdělávacích příležitostí kvůli nedostatečnému rozvoji ostrova." # todo: NEW TRANSLATION
 GRN_economic_pains: "Hospodářské potíže" # todo: NEW TRANSLATION
 GRN_economic_pains_desc: "Počet obyvatel Grónska se po desetiletí pohybuje kolem padesáti tisíc a stále se zmenšuje, zatímco drsné klima a logistika se stávají hlavními překážkami rozvoje. V novém tisíciletí problém pokračuje a představitelé národa musí najít způsob, jak přizpůsobit a upravit potřeby hospodářství, pokud se on i samotný národ mají stát něčím víc než jen stagnující zemí." # todo: NEW TRANSLATION
 GRN_idea_colonial_subsidy: "Koloniální dotace" # todo: NEW TRANSLATION
 GRN_idea_colonial_subsidy_desc: "Náš národ je natolik nerozvinutý, že jsme při každodenním fungování silně závislí na dánských dotacích. Pokud vůbec chceme pomýšlet na nezávislost na dánské koruně, musíme najít způsob, jak tuto dotaci již nepotřebovat k pouhému přežití." # todo: NEW TRANSLATION
 GRN_colonial_subsidy_TT: "§GDodatečný příjem:§! §Y$0.300§!" # todo: NEW TRANSLATION
 GRN_idea_narrow_gauge_nation: "Národ úzkorozchodných tratí" # todo: NEW TRANSLATION
 GRN_idea_narrow_gauge_nation_desc: "Flexibilita a cenová efektivita úzkorozchodných tratí i vybavení nám umožní urychlit rozvoj a propojení celého národa. Navíc poskytují bezpečnostní výhodu, protože jejich výroba je levnější a lze je zabezpečit lépe než běžné tratě a vybavení standardního rozchodu." # todo: NEW TRANSLATION
 GRN_idea_battle_for_independence: "Boj za nezávislost" # todo: NEW TRANSLATION
 GRN_idea_battle_for_independence_desc: "Dosáhli jsme bodu, kdy je naše nezávislost zajištěna. Zahájíme rozsáhlé nátlakové kampaně, abychom zajistili, že se naše nezávislost uskuteční ještě za našeho života." # todo: NEW TRANSLATION
 GRN_ideas_political_freedoms: "Politické svobody" # todo: NEW TRANSLATION
 GRN_ideas_political_freedoms_desc: "Náš národ si může svobodně zvolit, po čem jeho lid touží, a proto se necítíme omezeni jedinou ideologií." # todo: NEW TRANSLATION
 GRN_ideas_emerging_political_influences: "Vznikající politické vlivy" # todo: NEW TRANSLATION
 GRN_ideas_emerging_political_influences_desc: "Nyní, když je náš národ nezávislý, se můžeme soustředit na moderní přístup k politice, když vstupujeme do tohoto odvážného nového světa." # todo: NEW TRANSLATION
 GRN_ideas_non_aligned_political_influences: "Neangažované politické vlivy" # todo: NEW TRANSLATION
 GRN_ideas_non_aligned_political_influences_desc: "Náš národ si může svobodně zvolit vlastní cestu. Žádná geopolitická strana nám skutečně neprospěje, a proto se zaměříme sami na sebe neutrálním způsobem." # todo: NEW TRANSLATION
 GRN_ideas_nationalist_political_influences: "Nacionalistické politické vlivy" # todo: NEW TRANSLATION
 GRN_ideas_nationalist_political_influences_desc: "Náš národ je svobodný, naši lidé jsou sjednocení a náš národ je nejvyšší prioritou našeho zaměření na budoucnost. Grónský nacionalismus nám dává klid." # todo: NEW TRANSLATION
 GRN_idea_alumina_research_institute: "Výzkumný ústav oxidu hlinitého" # todo: NEW TRANSLATION
 GRN_idea_alumina_research_institute_desc: "Založení ARI je zásadní pro pochopení těžby, zpracování a efektivního využívání zdrojů. Tento specializovaný výzkumný a vývojový komplex posune náš národ na novou úroveň při vyjednávání o zahraničním obchodu i při praktičtějším uplatňování autarkních politik." # todo: NEW TRANSLATION
 GRN_idea_economic_development_visas: "Víza hospodářského rozvoje" # todo: NEW TRANSLATION
 GRN_idea_economic_development_visas_desc: "Ti, kteří se chtějí přestěhovat a usadit v našem národě, mohou požádat o vízum 1. třídy známé jako vízum hospodářského rozvoje. EDV je v podstatě nástupní proces, který novým občanům pomůže usadit se a najít zaměstnání, v němž mohou přispět k rozvoji a celkovému růstu národa." # todo: NEW TRANSLATION
 GRN_idea_sanctioned_immigration_efforts: "Schválené imigrační úsilí" # todo: NEW TRANSLATION
 GRN_idea_sanctioned_immigration_efforts_desc: "Prostřednictvím cíleného úsilí se pokusíme zajistit stabilní růst populace prostřednictvím imigrace." # todo: NEW TRANSLATION
 GRN_idea_strategic_mineral_leasing: "Strategický pronájem nerostných surovin" # todo: NEW TRANSLATION
 GRN_idea_strategic_mineral_leasing_desc: "Prohlášení o pronájmu těžby nerostů zahraničním společnostem je velmi ostrý meč. Musíme přesně regulovat, co mohou těžit, kde mohou těžit a kam budou tyto nerosty směřovat. Doufejme, že tak co nejvíce omezíme nadměrné zahraniční vměšování do naší politické struktury a zároveň tyto společnosti využijeme k rozvoji našich vyjednávacích trumfů." # todo: NEW TRANSLATION
 GRN_idea_contracting_a_workforce: "Najímání pracovní síly" # todo: NEW TRANSLATION
 GRN_idea_contracting_a_workforce_desc: "Využití celního a pohraničního bezpečnostního aparátu k zajištění smluvní pracovní síly nám umožní rozšiřovat podniky a průmysl stabilním a spolehlivějším tempem. Koneckonců si smlouvu přečetli a podepsali." # todo: NEW TRANSLATION
 GRN_idea_agriculture_automations: "Automatizace zemědělství" # todo: NEW TRANSLATION
 GRN_idea_agriculture_automations_desc: "Hlavním problémem našeho národa je jednoduše udržet stabilní pracovní sílu, kterou lze zaměstnat. Proto jsme se rozhodli masivně investovat do zemědělského sektoru, abychom výrazně snížili potřebu dalších lidských zdrojů v tomto odvětví." # todo: NEW TRANSLATION
 GRN_idea_war_production_automations: "Automatizace válečné výroby" # todo: NEW TRANSLATION
 GRN_idea_war_production_automations_desc: "Hlavním problémem našeho národa je jednoduše udržet stabilní pracovní sílu, kterou lze zaměstnat. Proto jsme se rozhodli masivně investovat do sektoru válečné výroby, abychom výrazně snížili potřebu dalších lidských zdrojů v tomto odvětví. V případě potřeby tak uvolníme pracovníky i potenciální vojáky pro armádu." # todo: NEW TRANSLATION
 GRN_idea_industrial_automations: "Automatizace průmyslu" # todo: NEW TRANSLATION
 GRN_idea_industrial_automations_desc: "Hlavním problémem našeho národa je jednoduše udržet stabilní pracovní sílu, kterou lze zaměstnat. Proto jsme se rozhodli masivně investovat do výrobního sektoru, abychom výrazně snížili potřebu dalších lidských zdrojů v tomto odvětví. Toto neustále se rozšiřující odvětví obvykle vyžaduje nejvíce pracovníků kvůli růstu výroby, takže by nám to mělo přinést největší prospěch." # todo: NEW TRANSLATION
 GRN_idea_corporate_automations: "Automatizace korporací" # todo: NEW TRANSLATION
 GRN_idea_corporate_automations_desc: "Hlavním problémem našeho národa je jednoduše udržet stabilní pracovní sílu, kterou lze zaměstnat. Proto jsme se rozhodli masivně investovat do sektorů kancelářských služeb a technologií, abychom výrazně snížili potřebu dalších lidských zdrojů. Toto odvětví náročné na pracovní sílu obvykle vyžaduje nejvíce pracovníků kvůli svým nárokům, takže by nám to mohlo přinést značný prospěch." # todo: NEW TRANSLATION
 GRN_idea_strategic_mining_automations: "Automatizace strategické těžby" # todo: NEW TRANSLATION
 GRN_idea_strategic_mining_automations_desc: "Přepracováním způsobu těžby zdrojů a zaměřením se na možnost vysílat do dolů co nejméně lidí můžeme maximalizovat těžební úsilí bez hrozby ztrát na životech. Samozřejmě to nebude dokonalé, ale tato autonomní vozidla a vybraná zařízení by měla nabídnout mnohem lepší možnosti." # todo: NEW TRANSLATION
 GRN_idea_pro_military_economic_organization: "Ekonomická organizace ve prospěch armády" # todo: NEW TRANSLATION
 GRN_idea_pro_military_economic_organization_desc: "Přeorientováním hospodářství kolem civilních a náborových potřeb zlepšíme výrobní schopnosti našich zbrojních závodů a snížíme celkový počet pracovníků potřebných k provozu zařízení. Tak rozsáhlá přestavba samozřejmě ochromí samotnou výrobní kapacitu, ale jakmile se provoz stabilizuje a obnoví, budou tato zařízení schopna vyrábět více s mnohem menšími nároky." # todo: NEW TRANSLATION
 GRN_idea_frozen_warfare_training: "Výcvik boje v mrazu" # todo: NEW TRANSLATION
 GRN_idea_frozen_warfare_training_desc: "Naše výcvikové programy se zaměří především na boj v zimě a chladném podnebí. Samozřejmě se budeme snažit provádět i jiný výcvik, kdykoli a kdekoli to bude možné, ale náš domov je chladný, a proto se musíme řádně připravit na jeho obranu." # todo: NEW TRANSLATION
 GRN_idea_polar_logistics_doctrine: "Doktrína polární logistiky" # todo: NEW TRANSLATION
 GRN_idea_polar_logistics_doctrine_desc: "Základní konstrukce našeho vybavení tak, aby bylo lépe použitelné v extrémním chladu, nám umožní účinněji bojovat podle našich představ, pokud se nepřátelské síly rozhodnou vylodit na našem ostrově." # todo: NEW TRANSLATION
 GRN_idea_artillery_specialist_corps: "Sbor dělostřeleckých specialistů" # todo: NEW TRANSLATION
 GRN_idea_artillery_specialist_corps_desc: "Dělostřelectvo je základem schopnosti způsobovat větší škody, než utrpíme, pokud jsme v dobré pozici. Abychom tuto výhodu zachovali, budeme muset rozvíjet a rozšiřovat dělostřelecký sbor na úroveň, která udrží naše ztráty na minimu." # todo: NEW TRANSLATION
 GRN_idea_heavy_anti_air_investments: "Investice do těžké protivzdušné obrany" # todo: NEW TRANSLATION
 GRN_idea_heavy_anti_air_investments_desc: "V moderním způsobu boje je novou královnou bojiště letectvo. Stíhačky, bombardéry, cokoli potřebujete, to dokážou. Jelikož je naše armáda tak malá, musíme najít způsob, jak nepříteli zabránit v tom, aby dělal, co chce. Proto zahájíme rozsáhlé investice do návrhu a vývoje protiletadlového vybavení, abychom našim vojákům na zemi poskytli skutečnou šanci k boji." # todo: NEW TRANSLATION
 GRN_idea_army_officer_corps: "Sbor armádních důstojníků" # todo: NEW TRANSLATION
 GRN_idea_army_officer_corps_desc: "Založení a standardizace sboru pro výcvik armádních důstojníků nám umožní formovat, zdokonalovat a zlepšovat naše taktické a strategické vůdce, aby lépe rozuměli nejen sami sobě, ale i vojákům, které vedou." # todo: NEW TRANSLATION
 GRN_idea_small_ship_developments: "Vývoj malých lodí" # todo: NEW TRANSLATION
 GRN_idea_small_ship_developments_desc: "První vývojové práce přinášejí ovoce. Naše rané návrhy korvet ukazují, že ačkoli je můžeme zdokonalovat a vylepšovat, tento strategický zisk bude k něčemu jen tehdy, pokud najdeme dostatek lidí schopných plavidla řádně obsadit." # todo: NEW TRANSLATION
 GRN_idea_expanding_small_vessel_designs: "Rozšíření návrhů malých plavidel" # todo: NEW TRANSLATION
 GRN_idea_expanding_small_vessel_designs_desc: "Abychom naše oddělení korvet doplnili podobnými inovacemi, zaměříme se na typy fregat a torpédoborců a plně rozvineme naše flotily malých plavidel." # todo: NEW TRANSLATION
 GRN_idea_attack_submarine_programs: "Programy útočných ponorek" # todo: NEW TRANSLATION
 GRN_idea_attack_submarine_programs_desc: "ASP je série vývojových a testovacích programů určených k ověření limitů a nejúčinnějších způsobů využití nových technologií." # todo: NEW TRANSLATION
 GRN_idea_missile_submarine_programs: "Programy raketových ponorek" # todo: NEW TRANSLATION
 GRN_idea_missile_submarine_programs_desc: "MSP je série vývojových a testovacích programů určených k ověření nejúčinnějšího způsobu využití raketové techniky v námořním boji." # todo: NEW TRANSLATION
 GRN_idea_navy_officer_corps: "Sbor námořních důstojníků" # todo: NEW TRANSLATION
 GRN_idea_navy_officer_corps_desc: "Založení sboru pro výcvik námořních důstojníků nám umožní zlepšit standardy dokonalosti v boji a velení naší námořní složky." # todo: NEW TRANSLATION
 GRN_idea_aviation_innovations: "Letecké inovace" # todo: NEW TRANSLATION
 GRN_idea_aviation_innovations_desc: "První výsledky začínají přinášet ovoce, protože zařízení TARI začalo uvádět své inovace do obecných konstrukčních a výrobních modelů pro testování a zdokonalování. Mohly by se ukázat jako užitečné, když budeme pokračovat v reformě a zdokonalování našeho akčního plánu vzdušné nadvlády." # todo: NEW TRANSLATION
 GRN_idea_air_dominance_program: "Program vzdušné nadvlády" # todo: NEW TRANSLATION
 GRN_idea_air_dominance_program_desc: "ADP se věnuje konkrétní třídě stíhacích letounů a způsobům, jak zlepšit jejich celkové bojové schopnosti a uchránit naše nebe před nepřátelským obtěžováním." # todo: NEW TRANSLATION
 GRN_idea_bombing_innovations: "Inovace bombardování" # todo: NEW TRANSLATION
 GRN_idea_bombing_innovations_desc: "Inovace ve schopnostech boje vzduch-země i vzduch-loď nám umožnily specializovat naše všeobecné bombardovací úsilí a učinit je účinnějšími než kdykoli předtím. Pokud chceme zabránit skutečnému vylodění nepřátelských sil na našem ostrově, musíme tyto snahy dále rozvíjet." # todo: NEW TRANSLATION
 GRN_idea_bomber_design_department: "Oddělení konstrukce bombardérů" # todo: NEW TRANSLATION
 GRN_idea_bomber_design_department_desc: "BDD se věnuje zlepšování a rozšiřování účinnosti našich bombardovacích leteckých flotil a představuje vrchol leteckých inovací našeho národa." # todo: NEW TRANSLATION
 GRN_idea_air_officer_corps: "Sbor leteckých důstojníků" # todo: NEW TRANSLATION
 GRN_idea_air_officer_corps_desc: "Rozvoj sboru důstojníků letectva nám umožní zvýšit celkovou účinnost a inovovat ve vedení i uplatňované taktice leteckých bojových operací." # todo: NEW TRANSLATION
 GRN_idea_general_staff_corps: "Sbor generálního štábu" # todo: NEW TRANSLATION
 GRN_idea_general_staff_corps_desc: "Nyní, když je naše armáda konečně natolik rozvinutá, že mezi jednotlivými složkami potřebuje jednotný velitelský štáb, náš národ učinil a bude nadále činit velké kroky v oblasti národní obrany." # todo: NEW TRANSLATION
 GRN_idea_agricultural_futurist_policies: "Futuristická zemědělská politika" # todo: NEW TRANSLATION
 GRN_idea_agricultural_futurist_policies_desc: "Upřednostnění výzkumu i hospodářských investic v širším zemědělském sektoru nám umožní držet krok s inovacemi a nadále správně přizpůsobovat kapacitu požadavkům, které budeme potřebovat, pokud se zaměříme na víc než jen domácí potřeby." # todo: NEW TRANSLATION
 GRN_idea_polar_infrastructure_developments: "Rozvoj polární infrastruktury" # todo: NEW TRANSLATION
 GRN_idea_polar_infrastructure_developments_desc: "Naše pokračující investice do budování infrastruktury i do způsobů, jak tyto investice učinit trvalejšími, nám umožnily inovovat v oblastech, o nichž by mnozí ani neuvažovali." # todo: NEW TRANSLATION
 GRN_idea_economic_modernity_policies: "Politika hospodářské modernity" # todo: NEW TRANSLATION
 GRN_idea_economic_modernity_policies_desc: "Náš národ stojí v čele rozvoje. Tento velkolepý pochod k prosperitě národa a jeho občanů budeme jistě dále rozvíjet." # todo: NEW TRANSLATION
 GRN_ideas_mining_needs: "Těžba podle potřeb" # todo: NEW TRANSLATION
 GRN_ideas_mining_needs_desc: "Rozhodli jsme se zaměřit těžební sektor na národní potřeby, nikoli na cokoli nad jejich rámec. To nám umožnilo strategicky vyjednávat o vývozních cenách a zároveň snížit nároky sektoru na lidské zdroje." # todo: NEW TRANSLATION
 GRN_ideas_mining_greeds: "Těžba podle chamtivosti" # todo: NEW TRANSLATION
 GRN_ideas_mining_greeds_desc: "Rozhodli jsme se zaměřit těžební sektor na národní i mezinárodní potřeby, nikoli pouze na to, co je potřeba v daný okamžik. Díky tomu jsme mohli své zdroje výrazně zhodnotit a vyjednat skutečně výhodné podmínky vývozu. Přestože hospodářský sektor zatížila zvýšená poptávka po pracovnících, celkový přínos zřejmě ospravedlňuje vynaložené prostředky." # todo: NEW TRANSLATION
 GRN_ideas_intense_foreign_affairs_budgeting: "Intenzivní financování zahraničních vztahů" # todo: NEW TRANSLATION
 GRN_ideas_intense_foreign_affairs_budgeting_desc: "Pokud chceme v zahraničí skutečně získat diplomatický vliv, musíme se na toto úsilí vážně zaměřit. Vzhledem k naší současné síle nám kvůli populačním problémům v poměru k hospodářství chybí vnitřní stabilita. Pokud nezahrajeme správně, jsme v podstatě tvrdá skořápka s prázdným vnitřkem." # todo: NEW TRANSLATION
 GRN_ideas_political_shenanigans: "Politické kejkle" # todo: NEW TRANSLATION
 GRN_ideas_political_shenanigans_desc: "Nedávno vyšly najevo nespokojené snahy uvnitř našeho národa. Vzhledem k našemu zdravému stavu se nezdají být ničím víc než obtíží, ale pokud se chceme vrátit ke klidnějšímu stavu, musíme zjistit, kdo za těmi nesmysly stojí." # todo: NEW TRANSLATION
 GRN_ideas_domesticating_foreign_policy: "Zdomácnění zahraniční politiky" # todo: NEW TRANSLATION
 GRN_ideas_domesticating_foreign_policy_desc: "Zajištění našich zahraničních ambicí znamená zajistit také domácí frontu a prostředky k využití našeho zahraničního vlivu." # todo: NEW TRANSLATION
 GRN_ideas_the_frozen_federation: "Ledová federace" # todo: NEW TRANSLATION
 GRN_ideas_the_frozen_federation_desc: "Nuže, sjednotili jsme kontinent podle svých nejlepších schopností. Jediným problémem je, že jsme pod jedním praporem sjednotili i všechny potíže. Není to konec světa, ale v dohledné budoucnosti nás čeká obtížná jízda." # todo: NEW TRANSLATION
 GRN_domestic_and_civil_affairs_administration: "Správa vnitřních a občanských záležitostí" # todo: NEW TRANSLATION
 GRN_domestic_and_civil_affairs_administration_desc: "Grónsko má řadu problémů a jádro většiny z nich vychází z nízkého počtu obyvatel. Správa vnitřních a občanských záležitostí má pečovat o grónské občany a průběžně reformovat, přidávat či rušit politiky, aby zajistila co nejlepší a nejspravedlivější výsledek pro obyvatele ostrova." # todo: NEW TRANSLATION
 GRN_federal_budgets: "Národní výdaje" # todo: NEW TRANSLATION
 GRN_federal_budgets_desc: "Na ostrově nežije mnoho lidí, přesto jsou k údržbě a řádnému rozvoji zapotřebí značné výdaje. Pokud chceme stabilní fiskální budoucnost, budeme muset hledat lepší způsoby rozvoje nebo celkového rozpočtování." # todo: NEW TRANSLATION
 GRN_revenue_collection_administration: "Správa výběru příjmů" # todo: NEW TRANSLATION
 GRN_revenue_collection_administration_desc: "RCA je určena jako agentura národní vlády pro výběr a vymáhání daní. Musí spolupracovat s tvůrci vládní politiky, aby byly daně vyměřovány spravedlivě a účinně a aby byly řádně vymáhány ve prospěch vyrovnaného národního rozpočtu." # todo: NEW TRANSLATION
 GRN_economic_development_board: "Rada pro hospodářský rozvoj" # todo: NEW TRANSLATION
 GRN_economic_development_board_desc: "EDB je páteří tvorby hospodářské politiky a obecného národního růstu a rozvoje. Tato část vlády se snaží zavádět politiky a programy, budovat národní hospodářství a všude, kde je to možné, zvyšovat kvalitu života občanů. Největší překážkou jsou v tomto ohledu logistika, pracovní síla a kapitál, stejně jako prostá vůle něco uskutečnit." # todo: NEW TRANSLATION
 GRN_national_armed_services_of_greenland: "Národní ozbrojené síly Grónska" # todo: NEW TRANSLATION
 GRN_national_armed_services_of_greenland_desc: "Ozbrojené síly Grónska jsou zajímavou institucí, protože populace ostrova je tak malá, že toho nemohou příliš mnoho vykonat. Přesto má ostrov určitý druh vojenské síly a teoreticky ji může rozšířit. Nyní už jen budoucí události ukážou, jak se tato expanze uskuteční." # todo: NEW TRANSLATION
 GRN_idea_the_great_ice_shelf: "Velký ledový šelf" # todo: NEW TRANSLATION
 GRN_idea_the_great_ice_shelf_desc: "Grónský ledový šelf je jedním z největších ledových útvarů na světě, který pokrývá značnou část pevniny. Může být až dvě míle hluboký a představuje největší překážku jakémukoli skutečnému rozvoji mimo pobřežní oblasti." # todo: NEW TRANSLATION
