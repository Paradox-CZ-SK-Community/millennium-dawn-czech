 greenland_influence_event.10000.d: "Když Island odmítl náš návrh, oficiálně nám diplomaticky nezbyly žádné možnosti. Pokusíme se čekat tak dlouho, jak to půjde, ale nastal čas na závěrečnou fázi." # todo: NEW TRANSLATION
 greenland_influence_event.10000.o1: "Připravit operaci Skutečná zeleň" # todo: NEW TRANSLATION
 greenland_subterfuge_event.1.t: "Velká grónská investice" # todo: NEW TRANSLATION
 greenland_subterfuge_event.1.d: "Grónsko nám předložilo mimořádně výhodnou nabídku. Je ochotno provést rozsáhlé investice do růstu našeho národa. Taková příležitost působí téměř neuvěřitelně, ale ostrov toho stejně nemá mnoho co nabídnout. Kromě toho, co by nám Grónsko mohlo v širším měřítku skutečně udělat?" # todo: NEW TRANSLATION
 greenland_subterfuge_event.1.o1: "Děkujeme za vaši velkorysost" # todo: NEW TRANSLATION
 greenland_subterfuge_event.1.o2: "Tohle je příliš dobré, než aby to byla pravda. Zamítnuto" # todo: NEW TRANSLATION
 greenland_subterfuge_event.2.t: "Island přijímá naši velkorysost" # todo: NEW TRANSLATION
 greenland_subterfuge_event.2.d: "Nyní, když islandská vláda přijala naše rozsáhlé investice, můžeme je využít k narušení míru a změně statusu quo natolik, abychom ostrov izolovali od zásahů NATO." # todo: NEW TRANSLATION
 greenland_subterfuge_event.2.o1: "Teď počkáme" # todo: NEW TRANSLATION
 greenland_subterfuge_event.3.t: "Odhalení zdroje" # todo: NEW TRANSLATION
 greenland_subterfuge_event.3.d: "Zdá se, že nedávné vlny nepokojů a společenských sporů mají původ v určitých investicích Grónska. Tyto nové fronty vytvořily v naší společnosti mírné nepohodlí, ale pokud je necháme být, mohli bychom se později dostat do skutečných potíží. Bude to riskantní, ale můžeme buď bojovat proti pokračujícím kejklům, nebo problém trvale vyřešit porážkou jejich původce." # todo: NEW TRANSLATION
 greenland_subterfuge_event.3.o1: "Mají vůbec armádu?" # todo: NEW TRANSLATION
