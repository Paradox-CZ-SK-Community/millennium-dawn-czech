 greenland_subterfuge_event.6.t: "Občané žádají vládu" # todo: NEW TRANSLATION
 greenland_subterfuge_event.6.d: "Nedávné události začaly eskalovat, protože stále více obyvatel ostrovů žádá vládu o referendum o vytvoření západní severské unie s Grónskem. Mnozí poukazují na zdánlivě dobročinné investice pro blaho ostrovanů, které kontrastují s dánským přístupem poskytujícím pouhé minimum. Pod takovým tlakem jsme nuceni jejich požadavky přijmout a obrátit se na grónskou vládu." # todo: NEW TRANSLATION
