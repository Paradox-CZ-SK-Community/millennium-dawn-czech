 GRN_national_decisions: "Národní rozhodnutí Grónska" # todo: NEW TRANSLATION
 GRN_national_decisions_desc: "Na ostrově Grónsko panuje velmi uvolněná, ale zároveň napjatá situace. Kromě snahy politických představitelů dělat cokoli pro rozvoj ostrova a jeho obyvatel se musí vypořádat také s neustálou otázkou blížící se nezávislosti. Někteří ji chtějí nyní, jiní raději počkají na pevnější základ. Ať tak či onak, o tom, zda bude ostrov nakonec skutečně svobodný, rozhodne Grónsko i Dánsko." # todo: NEW TRANSLATION
 GRN_decision_independence_war: "Válka za nezávislost" # todo: NEW TRANSLATION
 GRN_decision_independence_war_desc: "Čas nadešel a politici donutili lid jednat. Byla vyhlášena válka a nyní jde o závod, zda si Dánsko udrží svou korunu, nebo zda koruna padne, když veřejný tlak vynutí mír mezi všemi stranami." # todo: NEW TRANSLATION
 GRN_decision_capital_city_expansion: "Rozšíření hlavního města" # todo: NEW TRANSLATION
 GRN_decision_capital_city_expansion_desc: "Vzhledem k tomu, že počet obyvatel našeho národa roste do dříve nepředstavitelných rozměrů, budeme muset přestavět hlavní město Nuuk, aby lépe odráželo a začleňovalo celkový regionální i národní růst." # todo: NEW TRANSLATION
 GRN_decision_development_visa_grants: "Udělování rozvojových víz" # todo: NEW TRANSLATION
 GRN_decision_development_visa_grants_desc: "Hlavním problémem rozvoje našeho národa je prostý nedostatek lidských zdrojů. Abychom se někam dostali, musíme masivně investovat do získávání zahraničních pracovníků, kteří jsou ochotni snášet spíše zdejší prostředí než potenciální velkorysé finanční pobídky a zaměstnání, které jim můžeme nabídnout." # todo: NEW TRANSLATION
 GRN_decision_global_recruitment_efforts: "Celosvětový nábor" # todo: NEW TRANSLATION
 GRN_decision_global_recruitment_efforts_desc: "Nyní, když je národní obrana pod naší přímou kontrolou, čelíme stejnému problému jako celý národ: nedostatku pracovních sil. Budeme muset udělat něco podobného jako u rozvojových grantů, tentokrát však pro armádu. Doufejme, že jak se naše hospodářství stane odolnějším a rozpočet pružnějším, budeme moci dostatečně motivovat žoldnéře nebo bloudící duše bez trvalého domova, aby si jako svůj poslední domov zvolili právě náš národ." # todo: NEW TRANSLATION
 GRN_decision_naval_priority_act: "Zákon o prioritě námořnictva" # todo: NEW TRANSLATION
 GRN_decision_naval_priority_act_desc: "Abychom měli jakoukoli přítomnost v oblasti, která je nám nejbližší, potřebujeme námořnictvo. Problém spočívá v tom, že nemáme ekonomickou kapacitu na jeho průběžnou výstavbu. Proto musíme v co největší blízkosti soustředit a převzít co nejvíce zařízení a komplexů pro stavbu lodí, abychom rychle vybudovali základní flotilu. Bude to nesmírně nákladné, ale stejně nákladné bude i sedět se založenýma rukama a čekat, až se stane něco, co nám skutečně prospěje." # todo: NEW TRANSLATION
 GRN_decision_project_vortex: "Projekt Vortex" # todo: NEW TRANSLATION
 GRN_decision_project_vortex_desc: "Zajištění námořní cesty na dalekém severu je obtížné kvůli nutnosti získat námořní převahu ve strategických oblastech. Proto vytvoříme nejlepší demonstraci námořní síly, jaké jsme za současných možností schopni." # todo: NEW TRANSLATION
 GRN_decision_national_commission: "Národní komise" # todo: NEW TRANSLATION
 GRN_decision_national_commission_desc: "Po dokončení konstrukčních prací a prohlášení prototypů za uspokojivé nyní zorganizujeme národní komisi, která pomůže postavit naši první bitevní loď." # todo: NEW TRANSLATION
 GRN_decision_project_northern_projection: "Projekt Severní projekce" # todo: NEW TRANSLATION
 GRN_decision_project_northern_projection_desc: "Nyní, když je situace stabilní a připravená na skutečné ambice našeho národa, budeme muset ovládnout několik mořských oblastí. To zajistíme spoluprací s loďaři z celého národa na vytvoření toho, co se stane druhou arktickou bojovou skupinou." # todo: NEW TRANSLATION
 GRN_southern_interior_development_decisions: "Projekty rozvoje jižního vnitrozemí" # todo: NEW TRANSLATION
 GRN_southern_interior_development_decisions_desc: "Nyní, když se náš národ díky populačním iniciativám stabilizoval hospodářsky i společensky, můžeme obrátit pozornost do jeho vnitrozemí. Jižní plošina bude prvním velkým krokem ke zkrocení Velkého ledového šelfu." # todo: NEW TRANSLATION
 GRN_decision_fort_vortex: "Fort Vortex" # todo: NEW TRANSLATION
 GRN_decision_fort_vortex_desc: "Cestu do jižního vnitrozemí zahájíme založením pevnostního města jménem Fort Vortex." # todo: NEW TRANSLATION
 GRN_decision_glacial_shine: "Glacial Shine" # todo: NEW TRANSLATION
 GRN_decision_glacial_shine_desc: "Naše další, více centrálně položená osada ponese jméno Glacial Shine." # todo: NEW TRANSLATION
 GRN_decision_frostbury: "Frostbury" # todo: NEW TRANSLATION
 GRN_decision_frostbury_desc: "Osadu Frostbury založíme východně od hlavního města." # todo: NEW TRANSLATION
 GRN_decision_fort_seal: "Fort Seal" # todo: NEW TRANSLATION
 GRN_decision_fort_seal_desc: "Založíme strategickou centrální východní pevnostní osadu na hranici jižního vnitrozemí a centrální plošiny." # todo: NEW TRANSLATION
 GRN_decision_southern_interior_basic_roads: "Základní silnice jižního vnitrozemí" # todo: NEW TRANSLATION
 GRN_decision_southern_interior_basic_roads_desc: "Nyní, když jsou naše osady plně založeny, můžeme s jistotou vytvořit základní pozemní dopravu, která je propojí a zajistí zásobování těchto nových bašt civilizace." # todo: NEW TRANSLATION
 GRN_decision_southern_interior_improved_roads: "Vylepšené silnice jižního vnitrozemí" # todo: NEW TRANSLATION
 GRN_decision_southern_interior_improved_roads_desc: "Průběžné investice do silniční sítě umožní větší objem dopravy a zároveň zavedení řádných a trvalejších bezpečnostních opatření pro cestování v tak dlouhých a nebezpečných podmínkách." # todo: NEW TRANSLATION
 GRN_decision_great_polar_railway: "Velká polární železnice" # todo: NEW TRANSLATION
 GRN_decision_great_polar_railway_desc: "Zajištění rozvoje efektivní a účelné železniční sítě nám umožní přepravovat lidi a materiál ve velkém. Konečně tak můžeme naplno začít budovat hospodářství regionu od úplných základů." # todo: NEW TRANSLATION
 GRN_decision_basic_industrial_jobs: "Základní průmyslová pracovní místa" # todo: NEW TRANSLATION
 GRN_decision_basic_industrial_jobs_desc: "Zajištění základní hospodářské činnosti nám umožní přímo financovat rozvoj vnitrozemí a případně se rozšířit do dalších hospodářských odvětví." # todo: NEW TRANSLATION
 GRN_decision_local_food_supply: "Místní zásobování potravinami" # todo: NEW TRANSLATION
 GRN_decision_local_food_supply_desc: "Strategický rozvoj HFF nám umožní vytvořit místní zásoby potravin pro osady. Nejenže tak využijeme více zmrzlé vody, ale pomůžeme také domácímu růstu těchto mladých populačních center. Zařízení pro drsné zemědělství budou kopím, které probodne zmrzlou šelmu představovanou šelfem." # todo: NEW TRANSLATION
 GRN_decision_extensive_geological_surveying: "Rozsáhlý geologický průzkum" # todo: NEW TRANSLATION
 GRN_decision_extensive_geological_surveying_desc: "Vzhledem k rozsáhlosti vnitrozemí budeme muset výrazně investovat do těchto strategických operací a také zřídit specializovaná zařízení pro drsné zemědělství určená k pěstování rostlin produkujících kaučuk. Tyto výsledky by měly být vzhledem k vynaloženému času a kapitálu mimořádně přínosné." # todo: NEW TRANSLATION
 GRN_decision_creating_dedicated_mining_operations: "Vytvoření specializovaných těžebních provozů" # todo: NEW TRANSLATION
 GRN_decision_creating_dedicated_mining_operations_desc: "Po odhalení malých a řídce známých ložisek různých nerostných surovin jsme také začali rozšiřovat základní práce na dalších zařízeních HFF pro výrobu kaučuku. Pokračování těchto iniciativ nám jistě pomůže." # todo: NEW TRANSLATION
 GRN_decision_regional_economic_sector_synergy: "Synergie regionálních hospodářských sektorů" # todo: NEW TRANSLATION
 GRN_decision_regional_economic_sector_synergy_desc: "Díky rozsáhlým investicím do pracovní síly, zdrojů a finančních prostředků budeme moci rozšířit těžební provozy do bodu, kdy vytvoříme místní hospodářskou rozmanitost. Brzy budeme schopni vytvořit regionální synergii, stejně jako ve zbytku národního hospodářství." # todo: NEW TRANSLATION
 GRN_central_plateau_development_decisions: "Projekty rozvoje centrální plošiny" # todo: NEW TRANSLATION
 GRN_central_plateau_development_decisions_desc: "Nyní, když je jižní vnitrozemí hospodářsky i společensky propojené, můžeme začít budovat základy pro totéž na centrální plošině. To vše bude nákladné, ale z dlouhodobého hlediska se to jistě vyplatí." # todo: NEW TRANSLATION
 GRN_decision_fort_frostfields: "Fort Frostfields" # todo: NEW TRANSLATION
 GRN_decision_fort_frostfields_desc: "V západní oblasti, nedaleko města Sisimuit, vytvoříme pevnostní osadu jménem Fort Frostfields." # todo: NEW TRANSLATION
 GRN_decision_frigidville: "Frigidville" # todo: NEW TRANSLATION
 GRN_decision_frigidville_desc: "Vydáme se na východ a založíme osadu Frigidville. Docházejí už někomu tematicky vhodné názvy?" # todo: NEW TRANSLATION
 GRN_decision_aurora: "Aurora" # todo: NEW TRANSLATION
 GRN_decision_aurora_desc: "V samotném středu plošiny podle mého názoru založíme příhodně pojmenovanou osadu Aurora." # todo: NEW TRANSLATION
 GRN_decision_snowdenson: "Snowdenson" # todo: NEW TRANSLATION
 GRN_decision_snowdenson_desc: "Otočíme se na jih a založíme osadu Snowdenson, která překlene mezeru mezi Glacial Shine a Aurorou pro meziregionální hospodářskou činnost." # todo: NEW TRANSLATION
 GRN_decision_blizzards_peak: "Blizzard's Peak" # todo: NEW TRANSLATION
 GRN_decision_blizzards_peak_desc: "Vrátíme se na sever a budeme pokračovat na východ, kde založíme osadu Blizzard's Peak, protože se v okolí nacházejí některé z nejvyšších bodů." # todo: NEW TRANSLATION
 GRN_decision_crystal_flake: "Crystal Flake" # todo: NEW TRANSLATION
 GRN_decision_crystal_flake_desc: "Dále na východ, jako druhou nejbližší osadu k východnímu pobřeží, založíme osadu Crystal Flake." # todo: NEW TRANSLATION
 GRN_decision_snowberry: "Snowberry" # todo: NEW TRANSLATION
 GRN_decision_snowberry_desc: "Na severovýchodní hranici mezi plošinou a východními pobřežními oblastmi založíme malebně znějící město Snowberry." # todo: NEW TRANSLATION
 GRN_decision_plateau_interior_basic_roads: "Základní silniční síť centrální plošiny" # todo: NEW TRANSLATION
 GRN_decision_plateau_interior_basic_roads_desc: "Nyní, když jsou osady vytvořeny, můžeme začít budovat základy silniční sítě napříč plošinou. Tato základní práce pomůže učinit cestování plynulejším a přímějším než pouhá jízda přes nebezpečný terén." # todo: NEW TRANSLATION
 GRN_decision_plateau_interior_improved_roads: "Vylepšené silnice centrální plošiny" # todo: NEW TRANSLATION
 GRN_decision_plateau_interior_improved_roads_desc: "Po dokončení základních prací můžeme investovat do standardizace bezpečnostních opatření a dalších zařízení potřebných k překonání rozsáhlé krajiny." # todo: NEW TRANSLATION
 GRN_decision_central_arctic_railroad: "Centrální arktická železnice" # todo: NEW TRANSLATION
 GRN_decision_central_arctic_railroad_desc: "Nyní můžeme propojením s GPR v jižním vnitrozemí a pobřežní železniční sítí upevnit hlavní hromadnou přepravu v celém národě. Plošina se tak stane domovem Centrální arktické železnice neboli CARR." # todo: NEW TRANSLATION
 GRN_decision_basic_industrial_jobs_two: "Základní trh průmyslové práce" # todo: NEW TRANSLATION
 GRN_decision_basic_industrial_jobs_two_desc: "Nyní, když jsou lidé i infrastruktura připraveni, můžeme začít vytvářet určitou hospodářskou činnost na centrální plošině." # todo: NEW TRANSLATION
 GRN_decision_local_food_supply_two: "Zavedení místního zásobování potravinami" # todo: NEW TRANSLATION
 GRN_decision_local_food_supply_two_desc: "S využitím modelů HFF, které jsme použili po celém národě, můžeme vytvořit specializovaná zařízení, jež pomohou snížit zátěž při budování místních potravinových řetězců." # todo: NEW TRANSLATION
 GRN_decision_extensive_geological_surveying_two: "Centrální plošina: rozsáhlé geologické průzkumy" # todo: NEW TRANSLATION
 GRN_decision_extensive_geological_surveying_two_desc: "Lidé, místa, infrastruktura, pracovní místa a potraviny. Vše je zajištěno a připraveno k hlubokému vrtání do ledu a zemí skrytých pod samotným časem." # todo: NEW TRANSLATION
 GRN_decision_creating_dedicated_mining_operations_two: "Centrální plošina: specializované těžební provozy" # todo: NEW TRANSLATION
 GRN_decision_creating_dedicated_mining_operations_two_desc: "Nyní, když máme v rukou výsledky průzkumu a založili jsme první průzkumné doly, můžeme začít rozšiřovat a vytvářet specializovanější doly i provozní aparát kolem nich." # todo: NEW TRANSLATION
 GRN_decision_regional_economic_sector_synergy_two: "Centrální plošina: mezisektorová hospodářská synergie" # todo: NEW TRANSLATION
 GRN_decision_regional_economic_sector_synergy_two_desc: "Čeká nás nejdelší a nejnákladnější část cesty. Když však hledíme na zářící ledovou krajinu rozsáhlé centrální plošiny, můžeme to vše vstřebat a pocítit čisté, blažené uspokojení, že jsme to konečně dokázali. Grónsko je skutečně zemí šelem." # todo: NEW TRANSLATION
 GRN_faction_polar_defense_league: "Liga polární obrany" # todo: NEW TRANSLATION
 greenland_event.1.t: "Referendum o samosprávě" # todo: NEW TRANSLATION
 greenland_event.1.d: "Parlament bude brzy hlasovat o rozšíření pravomocí stanovených zákonem o domovské samosprávě z roku 1979. Pokud bude návrh schválen, školství, zdravotnictví, soudní systém i plná kontrola pobřežní stráže přejdou pod úplnou kontrolu grónské vlády." # todo: NEW TRANSLATION
 greenland_event.1.o1: "Parlament schvaluje zákon o samosprávě" # todo: NEW TRANSLATION
 greenland_event.1.o2: "Parlament zachovává status quo" # todo: NEW TRANSLATION
 greenland_event.2.t: "Grónský zákon o samosprávě" # todo: NEW TRANSLATION
 greenland_event.2.d: "Grónsko hlasovalo pro rozšíření svých práv podle zákona o domovské samosprávě z roku 1979 a jeho nahrazení zákonem o samosprávě z roku 2008. Tento zákon jim dává kontrolu nad několika vládními orgány i pobřežní stráží. Hlasování můžeme schválit, protože získalo většinu, nebo ho můžeme zablokovat s odvoláním na to, že finance národa by nedokázaly udržet samostatný provoz všech těchto systémů bez zvýšení koloniálních dotací, které poskytujeme." # todo: NEW TRANSLATION
 greenland_event.2.o1: "Schválit hlasování" # todo: NEW TRANSLATION
 greenland_event.2.o2: "Zamítnout hlasování" # todo: NEW TRANSLATION
 greenland_event.300.t: "Dánsko schvaluje hlasování" # todo: NEW TRANSLATION
 greenland_event.300.d: "Dnes jsme obdrželi zprávu, že dánský parlament podle očekávání schválil naše hlasování o novém zákonu o samosprávě. To bude velký krok vpřed na cestě k naší nezávislosti, a tedy k budoucnosti, kterou si budeme moci určovat sami." # todo: NEW TRANSLATION
 greenland_event.300.o1: "Počkat, oni to mohli zamítnout?" # todo: NEW TRANSLATION
 greenland_event.3.t: "Dánsko blokuje hlasování" # todo: NEW TRANSLATION
 greenland_event.3.d: "Dánský parlament se rozhodl zamítnout naše hlasování o rozšíření zákona o domovské samosprávě prostřednictvím nového zákona o samosprávě. Odvolává se na údajné fiskální obavy a tvrdí, že převzetí kontroly by vyžadovalo vyšší dánské dotace. Mohli bychom vyhlásit nezávislost, což by vyvolalo místní konflikt, nebo situaci přijmout a připravit se na potenciálně horší výsledky." # todo: NEW TRANSLATION
 greenland_event.3.o1: "Bojovat. S jakou armádou?" # todo: NEW TRANSLATION
 greenland_event.3.o2: "Za svobodnou vládu Grónska!!!" # todo: NEW TRANSLATION
 greenland_event.4.t: "Vyhlášena válka!" # todo: NEW TRANSLATION
 greenland_event.4.d: "Po zablokování hlasování o grónském zákonu o samosprávě se grónská vláda rozhodla vynutit si nezávislost. Musíme proto zajistit všechny korunní državy a znovu dostat pod kontrolu všechna zámořská území." # todo: NEW TRANSLATION
 greenland_event.4.o1: "Od Faerských ostrovů po Grónsko" # todo: NEW TRANSLATION
 greenland_event.5.t: "Přepracování investic do automatizace" # todo: NEW TRANSLATION
 greenland_event.5.d: "Naše hospodářství neustále zápasí a důvodem je jednoduše nedostatek lidí. Náš příjem na obyvatele je téměř nestabilní a účetní někdy ani nechtějí vést naše účetnictví kvůli divoce se měnícím vlivům domácích výdajů, které vyplývají z neustálých změn našeho hospodářství. Potřebujeme proto zásadní stabilizační faktor, kterým budou v tomto případě přímé a rozsáhlé investice do automatizace konkrétního hospodářského sektoru. Celkové snížení potřeby pracovníků v daném sektoru snad výrazně omezí nestabilní povahu hospodářství." # todo: NEW TRANSLATION
 greenland_event.5.o1: "Zemědělský sektor" # todo: NEW TRANSLATION
 greenland_event.5.o2: "Sektor válečné výroby" # todo: NEW TRANSLATION
 greenland_event.5.o3: "Sektor civilní výroby" # todo: NEW TRANSLATION
 greenland_event.5.o4: "Sektor kancelářství a technologií" # todo: NEW TRANSLATION
 greenland_event.6.t: "Otázka těžby" # todo: NEW TRANSLATION
 greenland_event.6.d: "S úsilím o rozšíření a zahájení komerční těžby přichází hlavní otázka. Máme těžit podle potřeb, nebo podle chamtivosti? Těžba podle potřeb by znamenala mírné získávání zdrojů přizpůsobené domácím potřebám národa. Těžba podle chamtivosti by naopak výrazně rozšířila provoz pro domácí i zahraniční poptávku za cenu zvýšených nároků na pracovní sílu." # todo: NEW TRANSLATION
 greenland_event.6.o1: "Potřeby našeho národa" # todo: NEW TRANSLATION
 greenland_event.6.o2: "Prostředky ospravedlňují cíl" # todo: NEW TRANSLATION
 greenland_event.7.t: "Politické ambice" # todo: NEW TRANSLATION
 greenland_event.7.d: "Jeviště je připraveno a naši lidé jsou nadšení i znepokojení. Nikdy předtím se nezdálo možné tak svobodně přemýšlet, když jsme byli dánskou korunní kolonií. Nyní však díky nově získaným svobodám můžeme dosáhnout klidu a vytvořit politickou budoucnost, po které toužíme." # todo: NEW TRANSLATION
 greenland_event.7.o1: "Naprostá svoboda myšlení" # todo: NEW TRANSLATION
 greenland_event.7.o2: "Nové myšlenky obstojí" # todo: NEW TRANSLATION
 greenland_event.7.o3: "Zvítězí neutrální mysli" # todo: NEW TRANSLATION
 greenland_event.7.o4: "Národní hrdost pohání pokrok" # todo: NEW TRANSLATION
 greenland_influence_event.1.t: "Grónské investice" # todo: NEW TRANSLATION
 greenland_influence_event.1.d: "Grónsko nám nabídlo pomoc s investicemi do budování našeho národa. Přestože existují určité obavy ohledně jejich povahy, ostrov Grónsko nepředstavuje ani se svým rozvojem skutečnou hrozbu pro naši domácí situaci ve srovnání s ostatními zainteresovanými stranami." # todo: NEW TRANSLATION
 greenland_influence_event.1.o1: "Dárky zdarma jsou příjemné" # todo: NEW TRANSLATION
 greenland_influence_event.1.o2: "Děkujeme, ale ne" # todo: NEW TRANSLATION
 greenland_influence_event.2.t: "Island přijímá infrastrukturu" # todo: NEW TRANSLATION
 greenland_influence_event.2.d: "Naše první investice byla přijata, což zvýší náš vliv a vazby na tento národ." # todo: NEW TRANSLATION
 greenland_influence_event.2.o1: "Další investici, prosím" # todo: NEW TRANSLATION
 greenland_influence_event.3.t: "Grónská energie" # todo: NEW TRANSLATION
 greenland_influence_event.3.d: "Grónsko za námi přišlo s další investicí, tentokrát do energetického sektoru. Chce zřídit užitečná zařízení na výrobu energie bez konkrétní preference typu výroby. Bezplatná energetická zařízení bychom mohli využít k podpoře lepších obchodních vztahů, někteří se však obávají, že Grónsko se jejich prostřednictvím snaží podkopat naši vládu." # todo: NEW TRANSLATION
 greenland_influence_event.3.o1: "Levnější energie je příjemná" # todo: NEW TRANSLATION
 greenland_influence_event.3.o2: "Do našich energetických potřeb vám nic není" # todo: NEW TRANSLATION
 greenland_influence_event.4.t: "Island přijímá energetická zařízení" # todo: NEW TRANSLATION
 greenland_influence_event.4.d: "Naše druhé kolo investic do rozvoje jejich schopností výroby energie bylo přijato. Můžeme jen doufat, že pokud budou potřebovat palivo pro fosilní elektrárny, budou s námi obchodovat a dál podporovat lepší vztahy." # todo: NEW TRANSLATION
 greenland_influence_event.4.o1: "Pošlete další investici" # todo: NEW TRANSLATION
 greenland_influence_event.5.t: "Investice polárního průmyslu" # todo: NEW TRANSLATION
 greenland_influence_event.5.d: "Grónsko se do toho opět pustilo, tentokrát rozsáhlými investicemi do našeho hospodářského rozvoje. Od průmyslových investic po sektor kanceláří vidíme, že Grónsko začíná do našeho národa vkládat možná až příliš mnoho. Ne že by mělo mnoho jiných možností, za co utrácet, ale možná bychom měli věci trochu přibrzdit." # todo: NEW TRANSLATION
 greenland_influence_event.5.o1: "Lepší hospodářství? Proč ne" # todo: NEW TRANSLATION
 greenland_influence_event.5.o2: "Néé. Myslím, že vím, o co vám jde" # todo: NEW TRANSLATION
 greenland_influence_event.6.t: "Island přijímá hospodářské investice" # todo: NEW TRANSLATION
 greenland_influence_event.6.d: "Naše rostoucí investiční portfolio zaznamenalo velký úspěch, protože jsme našli strategické způsoby, jak přimět islandskou vládu přijímat naše velkorysé nabídky. Nyní musíme tyto úspěchy využít." # todo: NEW TRANSLATION
 greenland_influence_event.6.o1: "Ještě jedno hurá a bude to" # todo: NEW TRANSLATION
 greenland_influence_event.7.t: "Strategické investice do zdrojů" # todo: NEW TRANSLATION
 greenland_influence_event.7.d: "Grónsko pomohlo provést rozsáhlé geologické průzkumy a objevilo omezená komerční ložiska železa, mědi, niklu a dalších zdrojů, které by mohly prospět našemu domácímu hospodářství. Nabídlo také rozšíření našeho hliníkového průmyslu, aby vyrovnalo případné ztráty. Tyto zdroje bychom skutečně mohli využít ke snížení závislosti na určitých zahraničních dodavatelích, ale můžeme si dovolit zadlužit se vůči našemu sousedovi?" # todo: NEW TRANSLATION
 greenland_influence_event.7.o1: "Tyto zdroje opravdu potřebujeme" # todo: NEW TRANSLATION
 greenland_influence_event.7.o2: "Je to příliš riskantní, zamítnuto" # todo: NEW TRANSLATION
 greenland_influence_event.8.t: "Umění dohody" # todo: NEW TRANSLATION
 greenland_influence_event.8.d: "Island přijal naši strategickou investici do zdrojů, a tak jsme mohli dokončit celé kolo investic. Nyní jsme připravili půdu pro možné sjednocení v relativně blízké budoucnosti." # todo: NEW TRANSLATION
 greenland_influence_event.8.o1: "Stálo to za to" # todo: NEW TRANSLATION
