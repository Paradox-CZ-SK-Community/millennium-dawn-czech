 greenland_subterfuge_event.4.t: "Velká grónská investice" # todo: NEW TRANSLATION
 greenland_subterfuge_event.4.d: "Grónsko nám předložilo nabídku. Komplexní investici a exkluzivní obchodní dohodu. Grónsko je ochotno vybudovat naši infrastrukturu, územní plánování a základnu civilního průmyslu a zřejmě také poskytnout exkluzivní pronájem potřebných materiálů výměnou za tyto investice. Posledním lákadlem celého velkolepého investičního balíčku je přímá rozsáhlá investice do budování a těžby známých ložisek ropy v našich vodách. Je to mimořádně výhodná dohoda a upřímně na ní vidíme jen velmi málo špatného. Co bychom však měli dělat s Dánskem, když se zadlužíme vůči konkrétnímu národu?" # todo: NEW TRANSLATION
 greenland_subterfuge_event.4.o1: "Uzavřeme dohodu!" # todo: NEW TRANSLATION
 greenland_subterfuge_event.4.o2: "Ne, tohle není správné" # todo: NEW TRANSLATION
 greenland_subterfuge_event.5.t: "Faerské ostrovy přijímají" # todo: NEW TRANSLATION
 greenland_subterfuge_event.5.d: "Vláda Faerských ostrovů přijala naše hojné investice, a proto nyní můžeme začít pracovat na naší budoucnosti." # todo: NEW TRANSLATION
