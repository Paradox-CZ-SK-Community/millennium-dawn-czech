 plane_bba_radar_upgrade: "Radar"
 plane_bba_engine_upgrade: "Motor"
 ENGINE_INFO: "\n\n§GTip návrháře: Motory poskytují různé výhody podle jejich počtu. U malých a středních letounů dva motory zvyšují rychlost, tah a spolehlivost, ale zároveň zvyšují výrobní náklady.§!\n\n§BU letounů se čtyřmi, šesti a osmi motory více motorů zvyšuje tah a spolehlivost, ale snižuje rychlost a zvyšuje cenu výroby.§!\n\n§RVrtulové motory jsou obvykle levnější než proudové, spotřebují méně paliva i zásob a dosahují nižších rychlostí, avšak mají mírně vyšší tah.§!"
