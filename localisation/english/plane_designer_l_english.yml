 air_module_pdl_1: "Laser bodové obrany I" # todo: NEW TRANSLATION
 air_module_pdl_1_desc: "Lasery bodové obrany poskytují aktivní obrannou vrstvu tím, že odhalují a napadají přilétající střely před dopadem, čímž zvyšují odolnost proti moderním hrozbám vzduch-vzduch a země-vzduch.\n\n§GTip konstruktéra: Lasery bodové obrany zlepšují protiraketovou obranu letounů, jsou však těžší a nákladnější na výrobu.§!" # todo: NEW TRANSLATION
