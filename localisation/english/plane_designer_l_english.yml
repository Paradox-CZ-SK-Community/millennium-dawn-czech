 air_module_hypersonic_engine_1: "Hypersonický motor I" # todo: NEW TRANSLATION
 air_module_hypersonic_engine_1_desc: "Hypersonické motory poskytují extrémní tah a vysokorychlostní letové vlastnosti, umožňují rychlé zachycovací a úderné profily s lepší manévrovatelností při vysoké rychlosti.\n\n§GTip konstruktéra: Hypersonické motory jsou velmi nákladné na výrobu, poskytují však výjimečnou rychlost a vysokou manévrovatelnost.§!" # todo: NEW TRANSLATION
 air_module_hypersonic_engine_2: "Hypersonický motor II" # todo: NEW TRANSLATION
