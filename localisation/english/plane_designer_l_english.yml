 air_module_hypersonic_engine_jet_2_desc: "$air_module_hypersonic_engine_1_desc$" # todo: NEW TRANSLATION
 air_module_railgun_cannon_1: "Railgunový kanón I" # todo: NEW TRANSLATION
 air_module_railgun_cannon_1_desc: "Railgunové kanóny využívají elektromagnetické urychlování k palbě vysokorychlostních projektilů, čímž poskytují mimořádnou účinnost vzduch-vzduch a lepší pravděpodobnost zásahu rychle se pohybujících letounů. Jejich specializované palebné systémy a manipulace s municí jsou optimalizovány pro vzdušné střety, takže jsou mnohem méně účinné při víceúčelových úkolech a mimo boj vzduch-vzduch mají omezené využití.\n\n§GTip konstruktéra: Railgunové kanóny poskytují velmi silný výkon vzduch-vzduch při sestřelování letounů, jsou však nákladné a vysoce specializované, takže mimo role určené pro vzdušnou nadvládu mají omezenou hodnotu.§!" # todo: NEW TRANSLATION
