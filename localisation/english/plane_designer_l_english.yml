 future_wingform_designs_3_desc: "" # todo: NEW TRANSLATION
 stealth_tech_1: "Raný stealth"
 stealth_tech_1_desc: "Vývoj prvních nízce zjistitelných letounů zahájil éru stealth letectví."
 stealth_tech_2: "Pokročilá technologie stealth" # todo: CHANGED
 stealth_tech_2_desc: "Další vývoj materiálů a konstrukce reagující na pokročilé radarové technologie."
 stealth_tech_3: "Špičkový stealth" # todo: NEW TRANSLATION
 stealth_tech_3_desc: "S tím, jak se radarová technologie stávala stále pokročilejší a staré techniky méně účinnými, bylo nutné dále zdokonalovat stealth materiály a principy konstrukce letounů." # todo: NEW TRANSLATION
 stealth_tech_4: "Hyperpokročilý stealth" # todo: NEW TRANSLATION
 stealth_tech_4_desc: "S tím, jak se radarová technologie stávala stále pokročilejší a staré techniky méně účinnými, bylo nutné dále zdokonalovat stealth materiály a principy konstrukce letounů." # todo: NEW TRANSLATION
