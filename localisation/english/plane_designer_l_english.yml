 internal_weapons_1: "Raní interní výzbroj"
 internal_weapons_1_desc: "Integrace zbraní do trupu pro zvýšení stealth."
 internal_weapons_2: "Moderní interní výzbroj"
 internal_weapons_2_desc: "Zvětšené vnitřní šachty pro vyšší nosnost."
 internal_weapons_3: "Špičkové interní zbraně" # todo: CHANGED
 internal_weapons_3_desc: "Další rozšíření vnitřních prostor pro maximální výzbroj."
 internal_weapons_4: "Hyperpokročilé interní zbraně" # todo: NEW TRANSLATION
 internal_weapons_4_desc: "Po stížnostech stíhacích pilotů na neschopnost nést velké množství výzbroje kvůli omezené velikosti interních šachet se konstruktéři snažili tyto šachty ještě zvětšit a dále zvýšit nosnost." # todo: NEW TRANSLATION
 internal_weapons_5: "Ultrapokročilé interní zbraně" # todo: NEW TRANSLATION
 internal_weapons_5_desc: "Po stížnostech stíhacích pilotů na neschopnost nést velké množství výzbroje kvůli omezené velikosti interních šachet se konstruktéři snažili tyto šachty ještě zvětšit a dále zvýšit nosnost." # todo: NEW TRANSLATION
 redundant_1: "Ochranné technologie I"
 redundant_1_desc: "Redundance systémů a první samoregenerační materiály zvyšují odolnost."
 redundant_2: "Ochranné technologie II"
 redundant_2_desc: "Záložní řízení letu a autopiloty zajišťují provoz i při poškození."
 early_weapons: "Raní letecká výzbroj"
 early_weapons_desc: "Kulomety a kanóny bez pokročilých naváděcích systémů."
 naval_weapons_1: "Námořní výzbroj studené války"
 naval_weapons_1_desc: "První protilodní střely a torpéda umožňující útoky z odstupu."
 naval_weapons_2: "Pokročilé námořní zbraně" # todo: CHANGED
 naval_weapons_2_desc: "Lepší navádění a větší dosah."
 naval_weapons_3: "Moderní námořní výzbroj"
 naval_weapons_3_desc: "Komplexní trajektorie a vyšší odolnost proti protiopatřením."
 naval_weapons_4: "Špičkové námořní zbraně" # todo: CHANGED
 naval_weapons_4_desc: "Hypersonické střely a pokročilá torpéda s extrémním dosahem a ničivostí."
 naval_weapons_5: "Hyperpokročilé námořní zbraně" # todo: NEW TRANSLATION
 naval_weapons_5_desc: "Tyto zbraně, tvořené pokročilými naváděnými torpédy a hypersonickými protilodními střelami, mají výrazně větší dosah i bojovou hlavici a dokážou ničit nepřátelské síly s minimálními náklady." # todo: NEW TRANSLATION
 naval_weapons_6: "Ultrapokročilé námořní zbraně" # todo: NEW TRANSLATION
 naval_weapons_6_desc: "Tyto zbraně, tvořené pokročilými naváděnými torpédy a hypersonickými protilodními střelami, mají výrazně větší dosah i bojovou hlavici a dokážou ničit nepřátelské síly s minimálními náklady." # todo: NEW TRANSLATION
 special_mad_1: "Protiponorkové technologie studené války"
 special_mad_1_desc: "Vzduchem shazované sonarové bóje umožnily letounům účinně se podílet na lovu ponorek. Letadla mohla pokrýt rozsáhlé oblasti na velké vzdálenosti a provádět protiponorkové operace."
 special_mad_2: "Pokročilá protiponorková technologie" # todo: CHANGED
 special_mad_2_desc: "S nástupem MAD senzorů a spouštěných sonarů se letouny staly ještě nebezpečnějšími pro ponorky, protože dokázaly snadněji detekovat a sledovat kontakt i bez použití sonarových bójí."
 special_mad_3: "Moderní protiponorková technologie" # todo: CHANGED
 special_mad_3_desc: "Ještě pokročilejší sonarové detekční systémy umožňují letounům vyhledávat, sledovat a ničit ponorkové hrozby během námořních operací."
 special_mad_4: "Špičková technologie ASW" # todo: NEW TRANSLATION
 special_mad_4_desc: "Ještě pokročilejší sonarové detekční systémy umožňují letounům odhalovat, sledovat a ničit ponorkové hrozby v námořních střetnutích." # todo: NEW TRANSLATION
 special_mad_5: "Hyperpokročilá technologie ASW" # todo: NEW TRANSLATION
 special_mad_5_desc: "Ještě pokročilejší sonarové detekční systémy umožňují letounům odhalovat, sledovat a ničit ponorkové hrozby v námořních střetnutích." # todo: NEW TRANSLATION
 special_mad_6: "Ultrapokročilá technologie ASW" # todo: NEW TRANSLATION
 special_mad_6_desc: "Ještě pokročilejší sonarové detekční systémy umožňují letounům odhalovat, sledovat a ničit ponorkové hrozby v námořních střetnutích." # todo: NEW TRANSLATION
 tech_air_anti_ship_drone_1: "Úderné protilodní drony II" # todo: NEW TRANSLATION
 tech_air_anti_ship_drone_1_desc: "První protilodní drony odpalované z letounů představují levnější způsob ohrožení hladinových plavidel díky přesnému navádění a použití z bezpečné vzdálenosti. Prodlužují dosah námořního letectva a umožňují hromadné útoky, které nutí nepřátelské flotily spotřebovávat drahé stíhací prostředky." # todo: NEW TRANSLATION
 tech_air_anti_ship_drone_2: "Úderné protilodní drony III" # todo: NEW TRANSLATION
 tech_air_anti_ship_drone_2_desc: "Vylepšené vyhledávače a datové spoje umožňují lepší rozlišování cílů, aktualizace během letu a opakované útoky proti unikajícím lodím. Díky většímu dosahu a odolnosti mohou tyto drony využívat mezery v protivzdušné obraně a ohrožovat svazová uskupení daleko od pobřeží." # todo: NEW TRANSLATION
 tech_air_anti_ship_drone_3: "Úderné protilodní drony IV" # todo: NEW TRANSLATION
 tech_air_anti_ship_drone_3_desc: "Síťově propojené úderné drony dokážou koordinovat směry přiblížení, sdílet data o cílech a provádět saturační útoky navržené k překonání vrstvené obrany. Odolné navádění a elektronická protiopatření udržují jejich účinnost i při rušení a mění početní převahu ve spolehlivou schopnost námořního úderu." # todo: NEW TRANSLATION
 ag_weapons_1: "Zbraně vzduch-země studené války"
 ag_weapons_1_desc: "Raně vyvinuté zbraně vzduch-země využívaly menší nálože a první laserem naváděné systémy, které umožňovaly přesnější zásahy než za druhé světové války."
 ag_weapons_2: "Pokročilé zbraně vzduch-země" # todo: CHANGED
 ag_weapons_2_desc: "Pokroky v konstrukci letecké výzbroje umožnily nést větší množství munice a výrazně zvýšily přesnost laserem naváděných zbraní, čímž se rozšířilo využití přesně naváděného bombardování."
 ag_weapons_3: "Moderní zbraně vzduch-země"
 ag_weapons_3_desc: "Munice s vysokou průbojností a GPS naváděním poskytuje maximální přesnost a umožňuje ničit cíle s výrazně vyšší efektivitou."
 ag_weapons_4: "Špičkové zbraně vzduch-země" # todo: CHANGED
 ag_weapons_4_desc: "Zásadní pokroky ve stand-off zbraních a brzděných pumách umožňují letounům ničit cíle rychle a často i bez vstupu do dosahu nepřátelských zbraní."
 ag_weapons_5: "Hyperpokročilé zbraně A2Z" # todo: NEW TRANSLATION
 ag_weapons_5_desc: "Výrazný pokrok ve zbraních odpalovaných z bezpečné vzdálenosti a v bombách s brzdicími padáky umožňuje letounům rychle zasahovat a ničit cíle, někdy dokonce bez vstupu do dosahu zbraní protivníka." # todo: NEW TRANSLATION
 ag_weapons_6: "Ultrapokročilé zbraně A2Z" # todo: NEW TRANSLATION
 ag_weapons_6_desc: "Výrazný pokrok ve zbraních odpalovaných z bezpečné vzdálenosti a v bombách s brzdicími padáky umožňuje letounům rychle zasahovat a ničit cíle, někdy dokonce bez vstupu do dosahu zbraní protivníka." # todo: NEW TRANSLATION
 tgp_recon_1: "Zaměřovací kontejnery studené války"
 tgp_recon_1_desc: "Raně vyvinuté zaměřovací kontejnery umožňovaly laserové označování cílů pro naváděné zbraně a zlepšovaly průzkumné schopnosti letounů."
 tgp_recon_2: "Pokročilé zaměřovací kontejnery" # todo: CHANGED
 tgp_recon_2_desc: "Lepší obrazové senzory, zavedení FLIR a schopnost získávat a předávat GPS souřadnice letounům i zbraním představovaly výrazný pokrok oproti variantám ze studené války."
 tgp_recon_3: "Moderní zaměřovací kontejnery" # todo: CHANGED
 tgp_recon_3_desc: "Fúze senzorů, datové propojení a další schopnosti činí zaměřovací kontejnery významným multiplikátorem bojové síly letounu."
 tgp_recon_4: "Špičkové zaměřovací kontejnery" # todo: NEW TRANSLATION
 tgp_recon_4_desc: "Fúze senzorů, datové spoje a další schopnosti činí z instalace zaměřovacích kontejnerů na letouny významný násobitel bojové síly." # todo: NEW TRANSLATION
 tgp_recon_5: "Hyperpokročilé zaměřovací kontejnery" # todo: NEW TRANSLATION
 tgp_recon_5_desc: "Fúze senzorů, datové spoje a další schopnosti činí z instalace zaměřovacích kontejnerů na letouny významný násobitel bojové síly." # todo: NEW TRANSLATION
 tgp_recon_6: "Ultrapokročilé zaměřovací kontejnery" # todo: NEW TRANSLATION
 tgp_recon_6_desc: "Fúze senzorů, datové spoje a další schopnosti činí z instalace zaměřovacích kontejnerů na letouny významný násobitel bojové síly." # todo: NEW TRANSLATION
 air_tech_gunship_railgun_1: "Letouny s railguny II" # todo: NEW TRANSLATION
 air_tech_gunship_railgun_1_desc: "Počáteční integrace railgunů do bitevních letounů soustřeďuje obrovskou přímou palebnou sílu do stabilní vzdušné platformy a umožňuje rychlé ničení dronů, letounů i pozemních cílů, pokud jsou v přímé viditelnosti. Koncepce je brutálně účinná, vyžaduje však vysokou výrobu energie, intenzivní chlazení a nákladné materiály." # todo: NEW TRANSLATION
 air_tech_gunship_railgun_2: "Letouny s railguny III" # todo: NEW TRANSLATION
 air_tech_gunship_railgun_2_desc: "Vylepšené kondenzátory, řízení zpětného rázu a řízení palby umožňují letounům s railguny udržovat vyšší kadenci bez kritického opotřebení. Lepší fúze senzorů zkracuje předání cíle a zvyšuje přesnost, takže se z těchto letounů stávají spolehlivé bitevní drtiče namísto okrajových demonstrátorů." # todo: NEW TRANSLATION
 air_tech_gunship_railgun_3: "Letouny s railguny IV" # todo: NEW TRANSLATION
 air_tech_gunship_railgun_3_desc: "Konstrukce nové generace optimalizují energetickou účinnost a tepelnou stabilitu a zároveň integrují pokročilé zaměřování a odolnost proti elektronickému boji. Letouny s railguny se tak mění na vytrvalé platformy s vysokou ničivostí, schopné přežít v napadeném vzdušném prostoru a rozebírat vrstvenou obranu za cenu, kterou si mohou ospravedlnit jen velmoci." # todo: NEW TRANSLATION
 air_tech_gunship_railgun_4: "Letouny s railguny V" # todo: NEW TRANSLATION
 air_tech_gunship_railgun_4_desc: "Konstrukce nové generace optimalizují energetickou účinnost a tepelnou stabilitu a zároveň integrují pokročilé zaměřování a odolnost proti elektronickému boji. Letouny s railguny se tak mění na vytrvalé platformy s vysokou ničivostí, schopné přežít v napadeném vzdušném prostoru a rozebírat vrstvenou obranu za cenu, kterou si mohou ospravedlnit jen velmoci." # todo: NEW TRANSLATION
 air_tech_gunship_railgun_5: "Letouny s railguny VI" # todo: NEW TRANSLATION
 air_tech_gunship_railgun_5_desc: "Konstrukce nové generace optimalizují energetickou účinnost a tepelnou stabilitu a zároveň integrují pokročilé zaměřování a odolnost proti elektronickému boji. Letouny s railguny se tak mění na vytrvalé platformy s vysokou ničivostí, schopné přežít v napadeném vzdušném prostoru a rozebírat vrstvenou obranu za cenu, kterou si mohou ospravedlnit jen velmoci." # todo: NEW TRANSLATION
 air_tech_gunship_railgun_6: "Letouny s railguny VII" # todo: NEW TRANSLATION
 air_tech_gunship_railgun_6_desc: "Konstrukce nové generace optimalizují energetickou účinnost a tepelnou stabilitu a zároveň integrují pokročilé zaměřování a odolnost proti elektronickému boji. Letouny s railguny se tak mění na vytrvalé platformy s vysokou ničivostí, schopné přežít v napadeném vzdušném prostoru a rozebírat vrstvenou obranu za cenu, kterou si mohou ospravedlnit jen velmoci." # todo: NEW TRANSLATION
 gunship_1: "Zbraně malorážových gunshipů"
 gunship_1_desc: "Ve snaze zajistit dlouhodobou a účinnou leteckou podporu byly nákladní letouny upraveny pro instalaci minigunů, které dokázaly poskytovat vysokou hustotu palby proti měkkým a lehce pancéřovaným cílům."
 gunship_2: "Zbraně velkorážových gunshipů"
 gunship_2_desc: "Na základě úspěchu prvních gunshipů byly do výzbroje zařazeny těžší systémy, včetně automatických kanónů ráže 30 mm a 40 mm a přímopalných kanónů ráže 105 mm a větší."
 air_weapons_1: "Zbraně vzduch-vzduch studené války"
 air_weapons_1_desc: "Raně vyvinuté střely trpěly řadou problémů, ale přinesly zásadní výhody. Letouny mohly útočit mimo vizuální dosah pomocí střel středního dosahu a krátkodosahové střely byly obtížněji vyhýbatelné než kanónová palba. Standardem se staly poloaktivně radarově naváděné střely středního dosahu a infračervené střely s navedením na zadní polosféru."
 air_weapons_2: "Moderní zbraně vzduch-vzduch"
 air_weapons_2_desc: "S technologickým pokrokem se výrazně zlepšily naváděcí systémy střel. Dlouhodosahové střely vzduch-vzduch se staly běžnými díky výkonnějším radarům, zatímco celosférické IR střely a aktivně radarově naváděné střely zvýšily efektivitu boje."
 air_weapons_3: "Zbraně vzduch-vzduch blízké budoucnosti"
 air_weapons_3_desc: "Datově propojené střely, střely s vysokým úhlem odchylky a zaměřování pomocí přilbových systémů učinily vzdušný boj ještě nebezpečnějším pro stíhačy."
 air_weapons_4: "Budoucí zbraně vzduch-vzduch"
 air_weapons_4_desc: "Třírežimové naváděcí hlavice, vícepulsní motory a extrémně manévrovatelné střely činí z těchto zbraní nejnebezpečnější střely vzduch-vzduch, jaké kdy byly vyvinuty."
 air_weapons_5: "Hyperpokročilé zbraně A2A" # todo: NEW TRANSLATION
 air_weapons_5_desc: "Třírežimové vyhledávače, střely s motory s vícenásobným impulzem a střely s hypermanévrovatelností činí z těchto zbraní nejnebezpečnější střely vzduch-vzduch, jaké kdy existovaly." # todo: NEW TRANSLATION
 air_weapons_6: "Ultrapokročilé zbraně A2A" # todo: NEW TRANSLATION
 air_weapons_6_desc: "Třírežimové vyhledávače, střely s motory s vícenásobným impulzem a střely s hypermanévrovatelností činí z těchto zbraní nejnebezpečnější střely vzduch-vzduch, jaké kdy existovaly." # todo: NEW TRANSLATION
 rocket_weapons_1: "Neřízené rakety studené války"
 rocket_weapons_1_desc: "Raně vyvinuté raketové bloky umožňovaly letounům rychle zasypat cíle přesnou saturací vysoce explozivních hlavic za výrazně nižší cenu než u naváděné munice."
 rocket_weapons_2: "Moderní neřízené rakety"
 rocket_weapons_2_desc: "Přesnější rakety a pokroky v konstrukci hlavic učinily tyto systémy výrazně účinnějšími než jejich předchůdci, přičemž si zachovaly nízkou cenu a efektivitu pro blízkou leteckou podporu a úderné mise."
 air_tech_railgun_cannons_1: "Palubní railgunové kanóny II" # todo: NEW TRANSLATION
 air_tech_railgun_cannons_1_desc: "Miniaturizované energetické systémy a zesílené lafety činí railgunové kanóny použitelnými na vysoce výkonných letounech. Poskytují extrémní úsťovou rychlost a plošší geometrii střetu než konvenční kanóny. Výsledkem je vyšší ničivost v krátkých časových oknech, avšak za cenu tepla, spotřeby energie a složité údržby." # todo: NEW TRANSLATION
 air_tech_railgun_cannons_2: "Palubní railgunové kanóny III" # todo: NEW TRANSLATION
 air_tech_railgun_cannons_2_desc: "Palubní railguny třetí generace zlepšují životnost hlavně, cyklování kondenzátorů a integraci řízení palby, což umožňuje udržovat dávky bez kritického opotřebení. Díky lepšímu tepelnému řízení a chytřejšímu zaměřování se tyto kanóny stávají praktickým řešením pro drcení letounů, dronů a dokonce některých raketových hrozeb na krátkou vzdálenost." # todo: NEW TRANSLATION
 countermeasures_1: "Protiopatření a raný REB"
 countermeasures_1_desc: "S rozšířením raketových zbraní bylo nutné chránit letouny jinak než jen úhybnými manévry. Plevy a klamné světlice poskytovaly návnady pro zmatení střel, zatímco přijímače radarového varování upozorňovaly piloty na zaměření radarem."
 countermeasures_2: "Protiopatření a moderní REB"
 countermeasures_2_desc: "Ačkoli se samotná protiopatření příliš nezměnila, moderní REB zobrazují klíčové informace, jako je typ radaru a vzdálenost hrozby. Moderní systémy varování před střelami dokážou také automaticky nasazovat protiopatření."
 countermeasures_3: "Systémy elektronického boje"
 countermeasures_3_desc: "Letouny jsou nyní vybaveny pokročilými systémy elektronického boje, které snižují závislost na specializovaných rušicích letounech. Tyto systémy poskytují vysokou úroveň ochrany proti sofistikovaným hrozbám a multispektrální světlice zvyšují obranu proti moderním infračerveně naváděným střelám."
 countermeasures_4: "Laserová hard-kill protiopatření"
 countermeasures_4_desc: "S rostoucí obtížností klamání střel se ochrana přesouvá od vyhýbání k jejich ničení. Tyto systémy využívají výkonné lasery k oslepení naváděcích systémů střel nebo k předčasné detonaci hlavice."
 countermeasures_5: "Hyperpokročilá aktivní protiopatření" # todo: NEW TRANSLATION
 countermeasures_5_desc: "S tím, jak je raketové hrozby stále obtížnější oklamat, se úkol mění z uhýbání na ničení. Tyto systémy umístěné na letounech používají výkonné lasery k vyřazení naváděcích systémů přilétající střely nebo k odpálení bojové hlavice dříve, než dosáhne cíle." # todo: NEW TRANSLATION
 countermeasures_6: "Ultrapokročilá aktivní protiopatření" # todo: NEW TRANSLATION
 countermeasures_6_desc: "S tím, jak je raketové hrozby stále obtížnější oklamat, se úkol mění z uhýbání na ničení. Tyto systémy umístěné na letounech používají výkonné lasery k vyřazení naváděcích systémů přilétající střely nebo k odpálení bojové hlavice dříve, než dosáhne cíle." # todo: NEW TRANSLATION
 air_tech_pdl_1: "Palubní lasery bodové obrany II" # todo: NEW TRANSLATION
 air_tech_pdl_1_desc: "Kompaktní laserové zářiče a vylepšené sledování umožňují letounům napadat přilétající střely na krátkou vzdálenost a před dopadem narušit jejich vyhledávače a řídicí plochy. Tyto systémy nenahrazují manévrování a protiopatření, přidávají však novou obrannou vrstvu, když o přežití rozhodují sekundy." # todo: NEW TRANSLATION
 air_tech_pdl_2: "Palubní lasery bodové obrany III" # todo: NEW TRANSLATION
 air_tech_pdl_2_desc: "Výkonnější paprsky a lepší tepelné řízení umožňují delší dobu palby a spolehlivější ničení moderních raketových vyhledávačů. Integrované navádění z palubních senzorů zkracuje reakční dobu a zvyšuje účinnost ve složitých vysokorychlostních střetech." # todo: NEW TRANSLATION
 air_tech_pdl_3: "Palubní lasery bodové obrany IV" # todo: NEW TRANSLATION
 air_tech_pdl_3_desc: "Palubní laserová obrana nové generace kombinuje obratné řízení paprsku, odolnou optiku a automatizované určování priorit hrozeb pro boj proti salvovým útokům a rojům dronů. Díky silnějším energetickým vyrovnávacím systémům a integraci elektronického boje mohou letouny zůstat odolné i pod tlakem zahlcující raketové palby." # todo: NEW TRANSLATION
 air_tech_pdl_4: "Palubní lasery bodové obrany V" # todo: NEW TRANSLATION
 air_tech_pdl_4_desc: "" # todo: NEW TRANSLATION
 air_tech_pdl_5: "Palubní lasery bodové obrany VI" # todo: NEW TRANSLATION
 air_tech_pdl_5_desc: "" # todo: NEW TRANSLATION
 rapid_dragon: "Paletizované střely s plochou dráhou letu"
 rapid_dragon_desc: "Experimenty s paletami umožňujícími odpal střel s plochou dráhou letu přímo z transportních letounů zásadně mění roli, kterou mohou velká dopravní letadla plnit."
 weap_drone_hand_grenade: "Ruční granát pro drony"
 weap_drone_hand_grenade_desc: "Ruční granát vybavený dálkovým uvolňovacím mechanismem, určený ke shazování na cíle pomocí kvadrokoptér."
 avionics_drone_quadcopter: "Systémy dronů - kvadrokoptéry"
 avionics_drone_quadcopter_desc: "Běžné komerční drony upravené a využívané k agresivnějším vojenským účelům."
