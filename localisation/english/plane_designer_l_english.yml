 air_module_anti_ship_drone_missile_1: "Protilodní dronová střela I" # todo: NEW TRANSLATION
 air_module_anti_ship_drone_missile_1_desc: "Protilodní dronové střely poskytují specializovanou schopnost námořního úderu kombinací bezpilotního nosiče s vyhledávači optimalizovanými k nalezení a napadení hladinových plavidel. Jejich zaměřovací systémy zlepšují přesnost námořních úderů a zvyšují jejich celkovou účinnost proti lodím, avšak specializovaná konstrukce omezuje jejich flexibilitu pro jiné typy misí.\n\n§GTip konstruktéra: Protilodní dronové střely zlepšují zaměřování námořních úderů a jejich útočnou sílu, jsou však specializované a mimo protilodní úkoly méně užitečné, přičemž spotřebovávají více zdrojů.§!" # todo: NEW TRANSLATION
