 norway.300.t: "Dvě odvětví pod jednou střechou" # todo: NEW TRANSLATION
 norway.300.d: "Kongsberg Gruppen prodává armádám dálkově ovládané zbraňové stanice a pobřežní flotile navigační systémy a dynamické určování polohy. Obě poloviny sdílejí inženýry, software i rozvahu. Rozdělení by každé z nich umožnilo poctivě ocenit na trhu, který té druhé nerozumí. Právě jejich spojení však umožňuje norské firmě této velikosti financovat kteroukoli z nich během špatného desetiletí." # todo: NEW TRANSLATION
 norway.300.a: "Ponechat obrannou a námořní část pohromadě" # todo: NEW TRANSLATION
 norway.300.b: "Rozdělit skupinu a nechat každou část stát samostatně" # todo: NEW TRANSLATION
 norway.301.t: "Naše vlastní střela" # todo: NEW TRANSLATION
 norway.301.d: "Protilodní střela Naval Strike Missile je připravena k výrobě a Kongsberg ji zkonstruoval tak, aby letěla nízko nad fjordem a dokázala najít loď v členitém pobřežním prostředí, což je přesně problém, kterému Norsko čelí. Financování výrobní linky znamená platit vývojové ceny za zbraň, kterou země této velikosti nakoupí v malém množství. Alternativou je Harpoon, dostupný okamžitě a navržený pro oceán někoho jiného." # todo: NEW TRANSLATION
 norway.301.a: "Financovat výrobu Naval Strike Missile" # todo: NEW TRANSLATION
 norway.301.b: "Nakoupit osvědčenou protilodní střelu v zahraničí" # todo: NEW TRANSLATION
 norway.302.t: "Cena F-35" # todo: NEW TRANSLATION
 norway.302.d: "Norsko si vybralo F-35 před Gripenem a podmínkou průmyslové spolupráce je integrace střely Joint Strike Missile od Kongsbergu. Norská zbraň se tak dostane do letounu, který nakupuje polovina aliance. Znamená to však také roky integračních prací podle cizího harmonogramu, které zaplatí země, jež se právě zavázala k nejdražšímu nákupu ve své historii." # todo: NEW TRANSLATION
 norway.302.a: "Prosadit integraci JSM do F-35" # todo: NEW TRANSLATION
 norway.302.b: "Ponechat střelu na norských platformách" # todo: NEW TRANSLATION
 norway.303.t: "Pobřežní zima" # todo: NEW TRANSLATION
 norway.303.d: "Cena ropy se zhroutila a zákazníci Kongsberg Maritime přestali objednávat: žádné nové plošiny, žádná nová plavidla pro těžbu na moři, žádný důvod vybavovat jedno či druhé. Obrana drží skupinu nad vodou. Udržování námořní části během poklesu stojí roky peněz bez objednávek v záloze; omezení na obrannou část by bylo ziskovým rozhodnutím a ukončilo by polovinu společnosti, která se nezabývá zbraněmi." # todo: NEW TRANSLATION
 norway.303.a: "Udržet námořní podnikání během poklesu" # todo: NEW TRANSLATION
 norway.303.b: "Omezit činnost na obranné podnikání" # todo: NEW TRANSLATION
 norway.304.t: "Nákup flotily Rolls-Royce" # todo: NEW TRANSLATION
 norway.304.d: "Rolls-Royce prodává Commercial Marine a její koupě by přes noc přibližně zdvojnásobila Kongsberg Maritime: pohonné systémy, palubní stroje, konstrukci lodí a instalovanou základnu na tisících trupů. Jde o největší šek, jaký kdy Kongsberg vystavil, za podnik, který se posledních pět let učil přežít bez něj." # todo: NEW TRANSLATION
 norway.304.a: "Koupit Commercial Marine a využít rozsahu" # todo: NEW TRANSLATION
 norway.304.b: "Zůstat malí a udržet čistou rozvahu" # todo: NEW TRANSLATION
 norway.305.t: "Čím se Kongsberg stal" # todo: NEW TRANSLATION
 norway.305.d: "Čtvrt století dálkově ovládaných věží, střela zkonstruovaná pro norské vody, boj o integraci do F-35 a jedna velmi rozsáhlá námořní akvizice rozhodly, čím Kongsberg je: zda Norsko dodává úderné zbraně alianci, systémy světové námořní dopravě, nebo obojí." # todo: NEW TRANSLATION
 norway.305.a: "Skupina pro úderné a námořní systémy, na níž aliance závisí" # todo: NEW TRANSLATION
 norway.305.b: "Aliancí podporovaný výrobce střel" # todo: NEW TRANSLATION
 norway.305.c: "Lídr v námořních systémech" # todo: NEW TRANSLATION
 norway.305.e: "Specializovaný dodavatel pro větší programy" # todo: NEW TRANSLATION
 NRY_kongsberg_strike_and_sea_group: "Skupina pro úderné a námořní systémy" # todo: NEW TRANSLATION
 NRY_kongsberg_strike_and_sea_group_desc: "Kongsberg vyrábí střely, které aliance nakupuje, i systémy, na nichž fungují lodě po celém světě, v továrnách a provozech, které jsou norské. Vlastnictví obou částí znamená, že žádnou z nich nemůže odříznout rozhodnutí někoho jiného." # todo: NEW TRANSLATION
 NRY_kongsberg_allied_missile_house: "Aliancí podporovaný výrobce střel" # todo: NEW TRANSLATION
 NRY_kongsberg_allied_missile_house_desc: "Joint Strike Missile létá na letounech napříč aliancí a Kongsberg je jejím jediným dodavatelem. Tato pozice je silná, spočívá však na jediné produktové řadě." # todo: NEW TRANSLATION
 NRY_kongsberg_maritime_systems_leader: "Lídr v námořních systémech" # todo: NEW TRANSLATION
 NRY_kongsberg_maritime_systems_leader_desc: "Kongsberg Maritime se nachází na můstku značné části světové obchodní a pobřežní flotily. Objednávky se řídí spíše cykly námořní dopravy než rozpočty na obranu, což má své výhody i nevýhody." # todo: NEW TRANSLATION
 NRY_kongsberg_niche_supplier: "Specializovaný dodavatel" # todo: NEW TRANSLATION
 NRY_kongsberg_niche_supplier_desc: "Kongsberg dodává věže a podsystémy do programů, které vedou jiní. Inženýrství je respektováno, ale vliv zůstává v rukou integrátorů." # todo: NEW TRANSLATION
