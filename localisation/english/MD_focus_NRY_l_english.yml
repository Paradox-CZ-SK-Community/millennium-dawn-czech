l_english:
 norway_focus: "Norsko Zaměření stromu" # todo: NEW TRANSLATION # todo: MOVED KEY
 NRY_the_norwegian_economy: "Norské hospodářství" # todo: NEW TRANSLATION
 NRY_the_norwegian_economy_desc: "Norské hospodářství je rozmanité, bohaté na zdroje a nabízí mnohem více. Musíme prozkoumat možnosti, které naši ekonomiku povedou do nového tisíciletí a nasměrují Norsko na cestu velikosti." # todo: NEW TRANSLATION
 NRY_north_sea_oil: "Ropa ze Severního moře" # todo: NEW TRANSLATION
 NRY_north_sea_oil_desc: "Abychom udrželi naše nákladné politiky, musíme zachovat stabilní tok našich již tak bohatých zásob ropy a plynu. Při této příležitosti musíme říct: „Vrtej, baby, vrtej!“" # todo: NEW TRANSLATION
 NRY_increased_cooperation_with_uk: "Prohloubení spolupráce se Spojeným královstvím" # todo: NEW TRANSLATION
 NRY_increased_cooperation_with_uk_desc: "Spojené království se může ukázat jako velmi užitečný obchodní partner díky své rostoucí konzumní populaci. Můžeme jej dobře využít a ono může získávat své přírodní zdroje od přátelských evropských sousedů." # todo: NEW TRANSLATION
 NRY_investments_into_shetland: "Investice na Shetlandách" # todo: NEW TRANSLATION
 NRY_investments_into_shetland_desc: "Investice do vzájemné důvěry by upevnila naše vztahy se Spojeným královstvím a zlepšila náš obchod. Naše přebytečná likvidita ve státní pokladně musí přece začít pracovat, ne?" # todo: NEW TRANSLATION
 NRY_statoil: "Statoil" # todo: NEW TRANSLATION
 NRY_statoil_desc: "Nákup dalších podílů v rafinaci ropy zlepší naši schopnost rozšířit dosah, abychom mohli naše bohaté zásoby ropy využít ve prospěch našeho lidu. Myšlenka je jednoduchá: kupovat, kupovat, kupovat, a potom prodávat, prodávat, prodávat." # todo: NEW TRANSLATION
 NRY_encourage_union_workers: "Přilákání pracovníků z Unie" # todo: NEW TRANSLATION
 NRY_encourage_union_workers_desc: "Ačkoli má Evropská unie své úspěchy, má také své nedostatky, a proto jsme s připojením váhali. Úřady Evropské unie pro přerozdělování zaměstnání mají potíže najít práci pro všechny své unijní pracovníky. Pokud jsou ochotni pracovat, my jsme ochotni je ubytovat!" # todo: NEW TRANSLATION
 NRY_european_investments: "Evropské investice" # todo: NEW TRANSLATION
 NRY_european_investments_desc: "Naše ropa se sama z oceánu nevytěží, možná by nám naši evropští bratři mohli pomoci zmírnit náklady na její těžbu. Naše ropná ložiska mohou být bohatá, ale pokud se pokusíme celé náklady vrtání nést sami, naše bankovní vklady se mohou ztenčit." # todo: NEW TRANSLATION
 NRY_sintef_research_org: "SINTEF" # todo: NEW TRANSLATION
 NRY_sintef_research_org_desc: "SINTEF je zkratkou pro Stiftelsen for industriell og teknisk forskning, anglicky Nadace pro průmyslový a technický výzkum. Jde o největší výzkumnou a vývojovou společnost v celé Skandinávii, která působí ve všech částech světa. V současnosti je společnost plně nezávislá, avšak pobídky k užší spolupráci s „doporučenými“ obchodními spojenci by přece nikomu neublížily, že?" # todo: NEW TRANSLATION
 NRY_ekofisk_oil_field: "Ropná pole Ekofisk" # todo: NEW TRANSLATION
 NRY_ekofisk_oil_field_desc: "Při rozvoji ropného sektoru musíme zohlednit náš nejvýznamnější zdroj, ropná pole Ekofisk. V těchto ložiscích stále zbývají miliony krychlových tun ropy. Pokud tam zvýšíme intenzitu těžby, naše obyvatelstvo bude zajištěno na dlouhé roky. Ochrana životního prostředí přijde na řadu později, samozřejmě." # todo: NEW TRANSLATION
 NRY_production_twenty_fifty: "Produkce 2050" # todo: NEW TRANSLATION
 NRY_production_twenty_fifty_desc: "Zdá se, že se musíme na naši ropu v dohledné budoucnosti ještě více spoléhat. Tedy řekněme… do roku 2050?" # todo: NEW TRANSLATION
 NRY_renewable_investments: "Investice do obnovitelných zdrojů" # todo: NEW TRANSLATION
 NRY_renewable_investments_desc: "Naše ropa nás bude podporovat jen po určitou dobu. Musíme začít dělat kroky správným směrem, směrem k zelené budoucnosti." # todo: NEW TRANSLATION
 NRY_scan_wind: "ScanWind" # todo: NEW TRANSLATION
 NRY_scan_wind_desc: "Naše geografická poloha nám umožňuje plně využívat větrnou energii. V Norsku je mnoho hor, které nás vždy chránily, nyní tak budou činit i díky síle elektřiny!" # todo: NEW TRANSLATION
 NRY_statkraft: "Statkraft" # todo: NEW TRANSLATION
 NRY_statkraft_desc: "V Norsku existuje mnoho příležitostí k rozšíření vodní energetiky. Ta nám může poskytnout potřebný náskok na cestě k soběstačnému státu poháněnému zelenou energií." # todo: NEW TRANSLATION
 NRY_electric_vehicle_incentives: "Pobídky pro elektromobily" # todo: NEW TRANSLATION
 NRY_electric_vehicle_incentives_desc: "Mnozí odmítají přejít z vozidel poháněných ropou na elektrický pohon, protože nevidí ekologicky šetrnou budoucnost Norska. Možná jim trochu peněz pomůže spatřit zelenou barvu naší budoucnosti." # todo: NEW TRANSLATION
 NRY_green_cities: "Zelená města" # todo: NEW TRANSLATION
 NRY_green_cities_desc: "Městská infrastruktura musí být upravena pro kompletní přechod mnoha veřejných i soukromých služeb na elektrický pohon." # todo: NEW TRANSLATION
 NRY_charging_stations: "Dobíjecí stanice" # todo: NEW TRANSLATION
 NRY_charging_stations_desc: "Mnozí nechtějí elektrická vozidla, protože je pro ně nedostatek dobíjecích stanic, a právem tomu tak věří. Naším úkolem je zajistit více dobíjecích stanic a zpřístupnit je všem. Pak už přece nebudou žádné výmluvy, že?" # todo: NEW TRANSLATION
 NRY_standardize_infrastructure: "Standardizace infrastruktury" # todo: NEW TRANSLATION
 NRY_standardize_infrastructure_desc: "Někteří dodavatelé jsou méně efektivní než jiní. Pokud prosadíme státní model, můžeme snížit zmatky při stavebních projektech." # todo: NEW TRANSLATION
 NRY_contract_veidekke: "Zakázka pro Veidekke" # todo: NEW TRANSLATION
 NRY_contract_veidekke_desc: "Mezinárodní dálniční projekt je přesně to, co potřebujeme ke sblížení našich skandinávských bratrů. Podpoříme tím obchod a dobré vztahy mezi všemi našimi národy." # todo: NEW TRANSLATION
 NRY_gothenburg_cultural_center: "ZEB Flexible Lab" # todo: NEW TRANSLATION
 NRY_gothenburg_cultural_center_desc: "ZEB Flexible Lab v Trondheimu patří mezi nejudržitelnější stavby na světě a je první stavbou na světě s ověřeným klimatickým účetnictvím, které zachycuje celkové emise CO2 s kompenzací odpovídající výrobě energie." # todo: NEW TRANSLATION
 NRY_contract_bilfinger_se: "Zakázka pro Bilfinger SE" # todo: NEW TRANSLATION
 NRY_contract_bilfinger_se_desc: "Nic nevystihuje efektivitu tak jako Němci. Bilfinger SE nám nabídla úžasnou obchodní příležitost. Norsko se bude rozvíjet rychlostí blesku!" # todo: NEW TRANSLATION
 NRY_gas_industry_renovation: "Modernizace plynárenského průmyslu" # todo: NEW TRANSLATION
 NRY_gas_industry_renovation_desc: "Prozatím musíme rozšířit náš průmysl zemního plynu, protože přechod k zelené ekonomice je dlouhý a náročný proces. Navíc až ozeleníme naši ekonomiku, můžeme ropu a plyn využívat výhradně k vývozu a dostat tak trochu zeleně do našich kapes." # todo: NEW TRANSLATION
 NRY_ministry_of_transport_communication: "Ministerstvo dopravy a komunikací" # todo: NEW TRANSLATION
 NRY_ministry_of_transport_communication_desc: "Měli bychom rozšířit některé základní veřejné služby a zlepšit tak kvalitu života. Koneckonců jsme sociální stát." # todo: NEW TRANSLATION
 NRY_avinor: "Avinor" # todo: NEW TRANSLATION
 NRY_avinor_desc: "Efektivitu rozšiřování naší letecké sítě můžeme zvýšit vytvořením dceřiné společnosti z Luftfartsverket, v níž budeme vlastnit 100 % podílů. Budeme tak moci spravovat veškerý její majetek v souladu s naším dokonalejším plánováním, které bude probíhat na celostátní úrovni a zaručeně v nejlepším zájmu národa." # todo: NEW TRANSLATION
 NRY_oslo_airport_expansion: "Rozšíření letiště v Oslu" # todo: NEW TRANSLATION
 NRY_oslo_airport_expansion_desc: "Jak roste naše populace a příliv turistů, naše letiště se začínají přeplňovat a cestování bude brzy nepříjemné a obtížné. Měli bychom naše velké hlavní město učinit co nejpřitažlivějším a nejpohodlnějším." # todo: NEW TRANSLATION
 NRY_statens_vangsen: "Statens Vegvesen" # todo: NEW TRANSLATION
 NRY_statens_vangsen_desc: "Norsko je velká země a jednotlivá zajímavá místa jsou značně rozptýlená. Zvýšením dotací pro Správu veřejných komunikací bychom našim obyvatelům prokázali velkou službu." # todo: NEW TRANSLATION
 NRY_facilities_for_norde_norge: "Zařízení pro Nord-Norge" # todo: NEW TRANSLATION
 NRY_facilities_for_norde_norge_desc: "Nejodlehlejší oblast pevninského Norska a jedno z nejhůře dostupných míst na světě se nazývá Nord-Norge. Změňme to, ano?" # todo: NEW TRANSLATION
 NRY_baneservice: "Baneservice" # todo: NEW TRANSLATION
 NRY_baneservice_desc: "Naše železnice zaostávají. Iniciativa na výstavbu dalších tratí by pomohla s přepravou spotřebního zboží po celé zemi a trochu více nás všechny sblížila." # todo: NEW TRANSLATION
 NRY_innovations_in_dovre_line: "Inovace na trati Dovre" # todo: NEW TRANSLATION
 NRY_innovations_in_dovre_line_desc: "Trať Dovre byla neustále zlepšována a rozšiřována. Je čas na další kolo modernizace." # todo: NEW TRANSLATION
 NRY_migration_to_norway: "Migrace do Norska" # todo: NEW TRANSLATION
 NRY_migration_to_norway_desc: "Díky našemu pohostinnému prostředí je Norsko velmi přitažlivé pro uprchlíky hledající azyl. Po čase se z toho stal problém, protože národ je rozdělen v otázce, zda bychom měli tyto uprchlíky nadále přijímat, nebo říct, že už jich bylo dost. Ať už zvolíme cokoli, musíme se rychle rozhodnout pro určitý postoj." # todo: NEW TRANSLATION
 NRY_norge_ming: "Norge Mining" # todo: NEW TRANSLATION
 NRY_norge_ming_desc: "Druhým největším přispěvatelem k našemu hospodářství je těžební sektor. Jelikož tu s námi v dohledné budoucnosti zůstane, měli bychom toto odvětví rozšířit." # todo: NEW TRANSLATION
 NRY_deep_sea_expansion: "Rozšíření hlubokomořské těžby" # todo: NEW TRANSLATION
 NRY_deep_sea_expansion_desc: "V našich rozsáhlých vodních oblastech lze nalézt další ložiska. Měli bychom se pokusit je lokalizovat a rozšířit tak naše zásoby." # todo: NEW TRANSLATION
 NRY_norsk_industri: "Norsk Industri" # todo: NEW TRANSLATION
 NRY_norsk_industri_desc: "Norský průmysl zaostává. Pokusme se to napravit." # todo: NEW TRANSLATION
 NRY_bergen_engines_domestic: "Bergen Engines Domestic" # todo: NEW TRANSLATION
 NRY_bergen_engines_domestic_desc: "Velké investice do našeho automobilového průmyslu by z nás mohly učinit výrobní velmoc a poskytnout našemu hospodářství potřebnou diverzifikaci." # todo: NEW TRANSLATION
 NRY_bergen_engines_rolls_royce: "Bergen Engines Rolls Royce" # todo: NEW TRANSLATION
 NRY_bergen_engines_rolls_royce_desc: "Náš automobilový průmysl bychom měli rozvíjet nejen co do počtu, ale také z hlediska luxusu a kvality. Partnerství s Němci způsobí rozmach tohoto podnikání." # todo: NEW TRANSLATION
 NRY_shipbuilding_investments: "Investice do stavby lodí" # todo: NEW TRANSLATION
 NRY_shipbuilding_investments_desc: "Norsko má přibližně 100 tisíc kilometrů pobřeží. Byla by škoda nechat jej přijít vniveč, že? Jsme národ mořeplavců, vraťme se k tomuto duchu!" # todo: NEW TRANSLATION
 NRY_aker_yards: "Aker Yards" # todo: NEW TRANSLATION
 NRY_aker_yards_desc: "Představujeme nejnovější odvětví našeho námořního průmyslu, Aker Yards! Sledujte, jak staví! Sledujte, jak se rozvíjí! Tomu se říká ekonomika odchytu a vypouštění." # todo: NEW TRANSLATION
 NRY_fishing_ports_regulations: "Regulace rybářských přístavů" # todo: NEW TRANSLATION
 NRY_fishing_ports_regulations_desc: "Protože máme obrovský rybářský průmysl a rybolov je tradiční norskou zábavou, je obtížné zavádět omezení. Životní prostředí však již nemůže dále trpět, a proto jsme přišli s řešením. Velké rybářské společnosti pod naším dohledem sloučí značné množství menších společností, centralizují rybolov a odstraní zmatky kolem jeho regulace." # todo: NEW TRANSLATION
 NRY_ministry_of_agriculture_and_food: "Ministerstvo zemědělství a potravinářství" # todo: NEW TRANSLATION
 NRY_ministry_of_agriculture_and_food_desc: "Zde je nutná reforma, protože kterýkoli hlupák, kterého si vybereme k dohledu nad zemědělstvím a potravinářstvím, už svou funkci očividně zastává příliš dlouho..." # todo: NEW TRANSLATION
 NRY_food_safety_regulations: "Předpisy bezpečnosti potravin" # todo: NEW TRANSLATION
 NRY_food_safety_regulations_desc: "Aby byla naše reforma ministerstva úspěšná, musíme zavést mnohé z dříve tolik potřebných potravinových politik." # todo: NEW TRANSLATION
 NRY_pesticide_distribution: "Distribuce pesticidů" # todo: NEW TRANSLATION
 NRY_pesticide_distribution_desc: "Nikdy jsme si nemysleli, že to v našem podnebí bude problém, ale Norsko možná čelí útoku... hmyzu." # todo: NEW TRANSLATION
 NRY_norwegian_armed_forces: "Norské ozbrojené síly" # todo: NEW TRANSLATION
 NRY_norwegian_armed_forces_desc: "Statečnost a přizpůsobivost velkých ozbrojených sil jsou připraveny bránit nás před jakýmkoli nebezpečím ve dne i v noci. Jsou vycvičeny pro všechny podmínky a znají své poslání: chránit norský lid a jeho trvalý mír a svobodu." # todo: NEW TRANSLATION
 NRY_norwegian_navy_forces: "Norské námořnictvo" # todo: NEW TRANSLATION
 NRY_norwegian_navy_forces_desc: "Hlavním účelem našeho námořnictva je chránit zájmy našeho obchodu, přestože je příliš často nikdo neohrožuje. Stále však potřebujeme odstrašující sílu, která bude velet mořím, na něž máme právo." # todo: NEW TRANSLATION
 NRY_haakonsvern_naval_base: "Námořní základna Haakonsvern" # todo: NEW TRANSLATION
 NRY_haakonsvern_naval_base_desc: "Haakonsvern, hlavní základna norského loďstva, vyžaduje rozsáhlou modernizaci, protože již nesplňuje standardy potřebné k účinné službě našemu lidu." # todo: NEW TRANSLATION
 NRY_fleet_logistics_command: "Velitelství logistiky loďstva" # todo: NEW TRANSLATION
 NRY_fleet_logistics_command_desc: "Dozvěděli jsme se, že naše námořnictvo neefektivně využívá zdroje, které má pod svým velením. Důkladně to prošetříme, v naší armádě nesmí docházet k plýtvání." # todo: NEW TRANSLATION
 NRY_norwegian_naval_academy: "Norská námořní akademie" # todo: NEW TRANSLATION
 NRY_norwegian_naval_academy_desc: "Je zřejmé, že v čele první obranné linie Norska nemůžeme mít neschopné lidi." # todo: NEW TRANSLATION
 NRY_norwegian_land_forces: "Norské pozemní síly" # todo: NEW TRANSLATION
 NRY_norwegian_land_forces_desc: "Norská armáda je pozemní složkou norských ozbrojených sil. Pozemní síly jsou nejstarší ze všech norských složek a jako moderní vojenská organizace byly založeny pod velením norského krále." # todo: NEW TRANSLATION
 NRY_quality_over_quantity: "Kvalita nad kvantitou" # todo: NEW TRANSLATION
 NRY_quality_over_quantity_desc: "Vždy jsme byli známí svým pragmatickým přístupem k výrobě. Každý úkol je prováděn pečlivě, v Norsku není místo pro nedbalost!" # todo: NEW TRANSLATION
 NRY_quantity_over_quality: "Kvantita nad kvalitou" # todo: NEW TRANSLATION
 NRY_quantity_over_quality_desc: "Nechceme zcela přehlížet sílu kvality, ale nemusíme dbát na to, aby bylo všechno dokonalé do posledního detailu. Pokud je to dost dobré, prostě to vyrábějme. Naše produktivita nesmí trpět perfekcionismem." # todo: NEW TRANSLATION
 NRY_norwegian_military_academy: "Norská vojenská akademie" # todo: NEW TRANSLATION
 NRY_norwegian_military_academy_desc: "Naši akademii navštěvují někteří z nejbystřejších myslitelů v oblasti bojové strategie a geopolitiky. Díky péči, kterou věnujeme našim vojenským institucím, těžíme z geniálních strategicky zaměřených myslí ve vládním kabinetu." # todo: NEW TRANSLATION
 NRY_norwegian_air_forces: "Norské letectvo" # todo: NEW TRANSLATION
 NRY_norwegian_air_forces_desc: "Letectvo je pro první obranu Norska stejně nezbytné jako námořnictvo. Náš terén je velmi náročný, což z Norska činí potenciální bojiště ve vzduchu, pokud by vůbec k nějaké válce došlo. Nejužitečněji lze naše letectvo v případě potřeby využít jako mírové síly po celém světě." # todo: NEW TRANSLATION
 NRY_orland_main_air_station: "Ørland Hovedflystasjon" # todo: NEW TRANSLATION
 NRY_orland_main_air_station_desc: "Letecká základna Ørland je největším letištěm v Norsku. Sídlí na ní většina našich letadel a její strategická poloha umožňuje pohodlně pokrýt většinu Norska." # todo: NEW TRANSLATION
 NRY_technical_advice_from_our_friends: "Technické rady od našich přátel" # todo: NEW TRANSLATION
 NRY_technical_advice_from_our_friends_desc: "Naše letectvo je dobré, ale ne skvělé. Sdílení technologií s našimi spojenci by nám mělo pomoci tento stav zlepšit." # todo: NEW TRANSLATION
 NRY_norwegian_airforce_academy: "Norská letecká akademie" # todo: NEW TRANSLATION
 NRY_norwegian_airforce_academy_desc: "Jako mírumilovný národ nezažíváme mnoho konfliktů, což nám umožňuje stát se brilantními stratégy a vojenskými mysliteli Evropy." # todo: NEW TRANSLATION
 NRY_cyber_defense_force: "Síly kybernetické obrany" # todo: NEW TRANSLATION
 NRY_cyber_defense_force_desc: "Jak se svět neustále digitalizuje, musíme také směřovat k technologicky přívětivější budoucnosti. Bohužel ne každý má dobré úmysly, a proto potřebujeme tým, který bude dohlížet na bezpečnost norských sítí." # todo: NEW TRANSLATION
 NRY_german_technicians: "Investice do tanků" # todo: NEW TRANSLATION
 NRY_german_technicians_desc: "Naše tanky v poslední době zaostávají. Možná bychom je měli prozkoumat a zjistit, jak je vylepšit." # todo: NEW TRANSLATION
 NRY_party_of_labour: "Arbeiderpartiet" # todo: NEW TRANSLATION
 NRY_party_of_labour_desc: "Dělnická strana, kterou si nelze plést s komunisty, je hlasem pracujících a řešením pro náš lid. Jsme vzorovým příkladem fungující sociální demokracie a od svého založení patříme mezi nejpopulárnější strany. Můžeme světu ukázat, že sociální demokracie je spravedlivý systém, který pomáhá a chrání své občany, jak by vláda skutečně měla. Vpřed, za trygghet, muligheter, og fellesskap!" # todo: NEW TRANSLATION
 NRY_modernization_of_the_welfare_state: "Modernizace sociálního státu" # todo: NEW TRANSLATION
 NRY_modernization_of_the_welfare_state_desc: "Naše obrovské bohatství nám umožňuje podporovat tisíce Norů, kteří to potřebují. Naše sociální záchranná síť je rozsáhlá, ale stále ji lze zlepšovat." # todo: NEW TRANSLATION
 NRY_workers_youth_league: "Liga pracující mládeže" # todo: NEW TRANSLATION
 NRY_workers_youth_league_desc: "Má-li být naše země socialistická, děti potřebují socialistické vzdělání. Naučí se fungovat v takové společnosti a přispějí svými svěžími myslí k produktivitě a blahobytu naší země." # todo: NEW TRANSLATION
 NRY_privitization_of_state_industries: "Privatizace státních podniků" # todo: NEW TRANSLATION
 NRY_privitization_of_state_industries_desc: "Společnosti, které nejsou nezbytné pro státní kontrolu, musíme vrátit lidu. Lidé tak pocítí finanční svobodu, zatímco my si ponecháme pouze nezbytnou kontrolu nad hospodářstvím." # todo: NEW TRANSLATION
 NRY_forest_conservation_plans: "Plány na ochranu lesů" # todo: NEW TRANSLATION
 NRY_forest_conservation_plans_desc: "Naše nádherná příroda je tím nejposvátnějším, co Norsko má, a musíme vždy dbát na to, aby nebyla znesvěcena." # todo: NEW TRANSLATION
 NRY_solar_investments: "Investice do solární energie" # todo: NEW TRANSLATION
 NRY_solar_investments_desc: "Budoucnost nespočívá v ropě a plynu. Přichází z přírody, Slunce, větru a tekoucích řek. Ačkoli jsme ve všech těchto oblastech bohatí, s výjimkou slunečního svitu, měli bychom se odklonit od znečišťující energie a vykročit ke světlejší budoucnosti." # todo: NEW TRANSLATION
 NRY_vaccinations_against_poverty: "Očkování proti chudobě" # todo: NEW TRANSLATION
 NRY_vaccinations_against_poverty_desc: "Zvýšení rozpočtu našich občanů je jistě postaví na nohy." # todo: NEW TRANSLATION
 NRY_transatlantic_cooperation: "Transatlantická spolupráce" # todo: NEW TRANSLATION
 NRY_transatlantic_cooperation_desc: "Musíme své přátele ujistit, že jsme vůči Západu zcela přátelští. To by mělo rozptýlit případné nepřátelství, které vůči nám chovají." # todo: NEW TRANSLATION
 NRY_intensify_cooperation_with_partners: "Prohloubení spolupráce s partnery" # todo: NEW TRANSLATION
 NRY_intensify_cooperation_with_partners_desc: "Několik výcvikových cvičení by mělo našim nejbližším přátelům ukázat přednosti velké sociální demokracie, jakou je Norsko." # todo: NEW TRANSLATION
 NRY_modernization_quota: "Kvóta modernizace" # todo: NEW TRANSLATION
 NRY_modernization_quota_desc: "Naše vojenská technika je zastaralá. Možná nám naši spojenci mohou poslat své lepší vybavení." # todo: NEW TRANSLATION
 NRY_weight_behind_gaza: "Podpora Gazy" # todo: NEW TRANSLATION
 NRY_weight_behind_gaza_desc: "V posledních letech stát Izrael jasně ukázal svou brutalitu vůči Palestincům a stává se stejně špatným jako jejich utlačovatelé. Stojíme za našimi bratry v Palestině!" # todo: NEW TRANSLATION
 NRY_packages_of_aid: "Balíčky pomoci" # todo: NEW TRANSLATION
 NRY_packages_of_aid_desc: "Dopad Izraele na chudé Palestince a válkou zpustošené okolní národy byl ničivý. Můžeme využít norský úspěch k pozitivnímu ovlivnění těchto zemí a zmírnění jejich břemen." # todo: NEW TRANSLATION
 NRY_constructive_dialogue_with_russia: "Konstruktivní dialog s Ruskem" # todo: NEW TRANSLATION
 NRY_constructive_dialogue_with_russia_desc: "Od pádu Sovětského svazu rostou mezi Ruskem a západním světem napětí. To budoucnosti našeho národa nepřinese nic než chaos. Rozhovory o míru a přátelství by mohly toto napětí zmírnit a zajistit bezpečnější svět." # todo: NEW TRANSLATION
 NRY_the_political_earthquake: "Politické zemětřesení" # todo: NEW TRANSLATION
 NRY_the_political_earthquake_desc: "Protože jsme měli v norské politice pouze menšinové zastoupení, využívali jsme svůj vliv jen k nátlaku na vládu, aby dodržovala naše ideální politiky. Nyní, když jsme ve vládě většinou, bude pokrok naší agendy ohromující!" # todo: NEW TRANSLATION
 NRY_christan_peoples_party: "Kristelig Folkeparti" # todo: NEW TRANSLATION
 NRY_christan_peoples_party_desc: "Nastal čas obnovit Křesťanskou lidovou stranu a nadále vštěpovat křesťanské hodnoty. Norové zapomínají na norské hodnoty a tradice. Pokud je nyní nezajistíme, uvidíme úpadek naší strany a všeho, za čím stojí." # todo: NEW TRANSLATION
 NRY_question_of_homosexuality: "Otázka homosexuality" # todo: NEW TRANSLATION
 NRY_question_of_homosexuality_desc: "Naše strana je v této otázce již nějakou dobu rozdělena. Ačkoli byla homosexualita legalizována, nastal čas učinit rozhodnutí v rámci naší vlastní strany. Pro, nebo proti?" # todo: NEW TRANSLATION
 NRY_abortion_matter: "Otázka potratů" # todo: NEW TRANSLATION
 NRY_abortion_matter_desc: "Křesťanská lidová strana obecně potraty odmítá, ale důrazně schvaluje výjimky v případě znásilnění a ohrožení života matky." # todo: NEW TRANSLATION
 NRY_contraception_support: "Podpora antikoncepce" # todo: NEW TRANSLATION
 NRY_contraception_support_desc: "Naše strana podporuje používání antikoncepce, která pouze brání početí, ale neškodí potenciálnímu dítěti, s cílem snížit počet potratů." # todo: NEW TRANSLATION
 NRY_developmental_aid: "Rozvojová pomoc" # todo: NEW TRANSLATION
 NRY_developmental_aid_desc: "Socialistické politiky nejsou všechny špatné a liberální prvky v naší straně navrhují, že státní pomoc rozvojovým projektům zabrání budoucí realitní bublině a podpoří rostoucí odvětví nemovitostí." # todo: NEW TRANSLATION
 NRY_poverty_and_climate_change_reduction: "Snižování chudoby a změny klimatu" # todo: NEW TRANSLATION
 NRY_poverty_and_climate_change_reduction_desc: "Ačkoli jsme výrazně přispěli ke snížení znečištění a patříme mezi přední národy podle indexu bohatství, totéž nelze říci o našich přátelích po celém světě. Jižní Amerika se s tím potýká obzvlášť, protože se soustředí na industrializaci na udržitelnou úroveň a tyto problémy zatím odkládá. Prozatím bychom jim měli co nejlépe pomoci." # todo: NEW TRANSLATION
 NRY_security_advancements: "Pokrok v oblasti bezpečnosti" # todo: NEW TRANSLATION
 NRY_security_advancements_desc: "V nebezpečném světě je nezbytné připravit se na hrozby. Samozřejmě především na hrozby namířené proti naší ropě." # todo: NEW TRANSLATION
 NRY_for_minorities: "Za menšiny" # todo: NEW TRANSLATION
 NRY_for_minorities_desc: "Norsko je celkově pokrokový národ s velmi malým počtem konzervativních extremistických prvků, z nichž žádný nemá vliv na morálku obyvatel. Zvýšení financování menšin by si mělo získat srdce našich občanů, kteří je vítají s otevřenou náručí, i samotných menšin, protože budou uznány." # todo: NEW TRANSLATION
 NRY_refugee_quota: "Kvóta pro uprchlíky" # todo: NEW TRANSLATION
 NRY_refugee_quota_desc: "Ostatní vlády bohužel nejsou tak ideální jako ta naše a mnoho lidí je nuceno opustit své domovy. Na mezinárodní scéně musíme přispět k záchraně těchto lidí. Všichni mírumilovní lidé jsou v Norsku vždy vítáni!" # todo: NEW TRANSLATION
 NRY_relieve_pressure_from_greece: "Zmírnění tlaku na Řecko" # todo: NEW TRANSLATION
 NRY_relieve_pressure_from_greece_desc: "Řecko přijalo mnohem více než svůj podíl uprchlíků a zdá se, že sotva drží pohromadě. Nedokáže své uprchlíky ubytovat, natož přijímat další. V Norsku pro ně máme domov, podejme našemu evropskému příteli pomocnou ruku." # todo: NEW TRANSLATION
 NRY_fair_refugee_distribution: "Spravedlivé rozdělení uprchlíků" # todo: NEW TRANSLATION
 NRY_fair_refugee_distribution_desc: "Každý Nor, který toho je schopen, musí pracovat. To zahrnuje i uprchlíky, které tak velkoryse přijímáme. Naši průmyslovou produkci můžeme optimalizovat tím, že tyto lidi umístíme do domovů poblíž továren, kde potřebujeme pracovníky." # todo: NEW TRANSLATION
 NRY_our_european_allies: "Naši evropští spojenci" # todo: NEW TRANSLATION
 NRY_our_european_allies_desc: "Vyhlašme přátelství našim přátelům v Organizaci Severoatlantické smlouvy, aby svět věděl, na čí straně stojíme." # todo: NEW TRANSLATION
 NRY_nato_drilling: "Doktrína NATO" # todo: NEW TRANSLATION
 NRY_nato_drilling_desc: "Měli bychom využít model výcviku jednotek NATO, který máme k dispozici, a jejich vojenské akademické studie ke zlepšení norské armády." # todo: NEW TRANSLATION
 NRY_eea_free_zones: "Volné zóny EHP" # todo: NEW TRANSLATION
 NRY_eea_free_zones_desc: "Měli bychom snížit hospodářský odstup mezi severskými národy a zvýšit spolupráci mezi našimi zeměmi, abychom podpořili hospodářský růst." # todo: NEW TRANSLATION
 NRY_tighten_arms_sales: "Omezení prodeje zbraní" # todo: NEW TRANSLATION
 NRY_tighten_arms_sales_desc: "Musíme pro naši pěchotu obstarat více zbraní, protože současná výzbroj není příliš použitelná." # todo: NEW TRANSLATION
 NRY_maintain_eu_distance: "Udržování odstupu od EU" # todo: NEW TRANSLATION
 NRY_maintain_eu_distance_desc: "Ačkoli našim přátelům v Evropské unii přejeme mír, vidíme také její nedostatky, a proto se k ní v dohledné době nepřipojíme. Přesto jim přejeme hodně štěstí!" # todo: NEW TRANSLATION
 NRY_party_of_progress: "Fremskrittspartiet" # todo: NEW TRANSLATION
 NRY_party_of_progress_desc: "Strana pokroku. Naším cílem je posunout lid vpřed prostřednictvím konsolidovanějšího způsobu vlády. Víme, co lidé chtějí: základní potřeby a svobodu. A my to dokážeme." # todo: NEW TRANSLATION
 NRY_shortened_wait_times: "Kratší čekací doby v nemocnicích" # todo: NEW TRANSLATION
 NRY_shortened_wait_times_desc: "V zemi, kde máme bezplatnou zdravotní péči dostupnou všem, jako by všichni čekali ve frontě! Je naprosto nezbytné, abychom pokračovali ve výstavbě dalších nemocnic. Naši lidé nemohou čekat, až na ně přijde řada, zatímco krvácejí v hale!" # todo: NEW TRANSLATION
 NRY_nursing_capacity: "Kapacita ošetřovatelství" # todo: NEW TRANSLATION
 NRY_nursing_capacity_desc: "Potřebujeme více zdravotních sester, které se budou starat o norský lid. Možná pomohou pobídky v podobě půdy?" # todo: NEW TRANSLATION
 NRY_removal_of_inheritence_tax: "Zrušení dědické daně" # todo: NEW TRANSLATION
 NRY_removal_of_inheritence_tax_desc: "Dědická daň je jedním z nejodpornějších zákonů norské legislativy a už ji nadále nebudeme trpět. Peníze lidu patří lidu!" # todo: NEW TRANSLATION
 NRY_elderly_focus: "Zaměření na seniory" # todo: NEW TRANSLATION
 NRY_elderly_focus_desc: "V posledních letech byli senioři našeho národa při tvorbě zákonů opomíjeni, což je přímo ostudné. Senioři udělali pro naši zemi nejvíce. Neměli bychom je chránit?" # todo: NEW TRANSLATION
 NRY_free_fundemental_society: "Svobodná základní společnost" # todo: NEW TRANSLATION
 NRY_free_fundemental_society_desc: "Byrokraté a vláda příliš často zasahují do života běžných občanů. Vláda byla vytvořena, aby chránila lid. Omezena by měla být vláda, nikoli lidé." # todo: NEW TRANSLATION
 NRY_youth_discipline: "Disciplína mládeže" # todo: NEW TRANSLATION
 NRY_youth_discipline_desc: "Můžeme inspirovat, a tím mobilizovat mládež k podpoře národní prosperity. Za Norsko!" # todo: NEW TRANSLATION
 NRY_equal_action: "Rovné jednání" # todo: NEW TRANSLATION
 NRY_equal_action_desc: "Můžeme odmítnout jiné, méně žádoucí strany, které brání naší agendě pokroku lidu." # todo: NEW TRANSLATION
 NRY_law_and_order: "Zákon a pořádek" # todo: NEW TRANSLATION
 NRY_law_and_order_desc: "Norsko je země zákonů. Pokud zákony neporušujete, pak přece není důvod namítat proti přítomnosti policie, že?" # todo: NEW TRANSLATION
 NRY_immigration_control: "Kontrola imigrace" # todo: NEW TRANSLATION
 NRY_immigration_control_desc: "Přijali jsme dost uprchlíků a imigrantů a je čas tento příliv zpomalit. Pokud dokážeme stavět stejně rychle, jako oni přicházejí, je rozhodně čas přestat." # todo: NEW TRANSLATION
 NRY_avoid_illiterates: "Vyhýbání se negramotným" # todo: NEW TRANSLATION
 NRY_avoid_illiterates_desc: "Pokud začneme negramotné od společnosti odcizovat, poskytneme jim dokonalou motivaci začít se učit." # todo: NEW TRANSLATION
 NRY_state_of_norway: "Norský stát" # todo: NEW TRANSLATION
 NRY_state_of_norway_desc: "Byrokracie Norska musí být efektivnější. K tomu je nutné podřídit ji přísnému dohledu nadřízených federálních úřadů, aby vše probíhalo hladce." # todo: NEW TRANSLATION
 NRY_reaffirm_oil_state: "Potvrzení ropného státu" # todo: NEW TRANSLATION
 NRY_reaffirm_oil_state_desc: "Stále jsme národem ropy a plynu. Od plně obnovitelné energie máme daleko a ještě dlouho tomu tak zůstane." # todo: NEW TRANSLATION
 NRY_privatization_of_state_dockyards: "Privatizace státních loděnic" # todo: NEW TRANSLATION
 NRY_privatization_of_state_dockyards_desc: "Bohatství Norska patří norskému lidu. Mezi největší hospodářská odvětví v naší zemi patří rybolov a lodní průmysl. Zde můžeme začít vracet moc lidu." # todo: NEW TRANSLATION
 NRY_the_nrk: "NRK" # todo: NEW TRANSLATION
 NRY_the_nrk_desc: "Norská rozhlasová a televizní společnost je státem vlastněná vysílací společnost, která slouží jako hlavní zdroj zpráv pro naše obyvatele. Můžeme využít svůj vliv k jejímu přizpůsobení našim zájmům, a tím sjednotit a informovat lid a chránit jej před překážkami či hrozbami pro naši zemi." # todo: NEW TRANSLATION
 NRY_oslo_hydro_TT: "Udělí [NRY.GetFlag] §HØstlandet§! modifikátor státu §HVodní infrastruktura§!" # todo: NEW TRANSLATION
 NRY_bergen_engines_TT: "Dodatečný příjem: §G$0.400§!" # todo: NEW TRANSLATION
 NRY_productivity_state_TT: "Zvýší §HProduktivitu§! v [NRY.GetFlag] §HØstlandet§! o §H75§!" # todo: NEW TRANSLATION
 haakons_marriage_announced: "§YHaakonův sňatek oznámen!§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 haakon_married: "§YKorunní princ se oženil!§!" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.1.t: "Srážka vlaku Åsta" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.1.d: "Dne [GetDateText] došlo v okrese Østerdalen k železniční nehodě Åsta, při níž místní vlak na trati Røros střetl s národním vlakem přijíždějícím z Trondheimu.\n\n179 lidí zahynulo, což bylo první velkou katastrofou na norské půdě v [GetYear]. 67 cestujících nehodu přežilo.\n\nNehodu připisují vláda a norská Národní železniční správa, která snížila nároky na to, aby železnice byla skutečně čistá před cestou." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.1.o1: "Spustit plné vyšetřování" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.1.o2: "Zůstat zticha" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.2.t: "Sňatek korunního prince Haakona" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.2.d: "Král Harald předložil parlamentu, že jeho dědic trůnu Haakon, korunní princ Norska, si vezme svou přítelkyni Mette-Marit Tjessem Høiby.\n\nVýběr nevěsty vyvolal určité podezření, protože Høiby není jen obyčejnou osobou, ale má i mladého syna narozeného mimo manželství. Samozřejmě vládní podpora a financování sňatku korunního prince zůstávají v platnosti.\n\nA co když ne?" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.2.o1: "Zajímavé." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.3.t: "Haakon se ožení s Mette-Marit Tjessem Høiby" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.3.d: "Norský parlament nezvedl námitky proti volbě budoucí manželky korunního prince Haakona. Šťastný pár byl vynesen za manžela a manželku při velké ceremoni titulů 25. srpna 2001. Královské potomstvo se zdá být jen otázkou času." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.3.o1: "Gratulace!" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.4.t: "Norsko se připojuje k výrobě ropy." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.4.d: "Po jednání s britským parlamentem se Norsko nyní připojuje k britské dohodě o výrobě ropy, která nyní umožňuje Norsku těžit ropu v Severním moři." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.4.o1: "Je čas získat toto černé zlato!" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.5.t: "[NOR.GetName] Navrhuje možné investice do ropy" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.5.d: "Norská delegace oslovila naše diplomaty a navrhuje možnou dohodu o ropě ve své zemi. Můžeme investovat do jejich země, abychom získali lepší podíl na jejich ropných podílech a jistý vliv ve jejich státě." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.5.a: "Zní to jako skvělý plán" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.5.b: "Ne" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.6.t: "[FROM.GetName] Souhlasí s investicí!" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.6.d: "Delegace z [FROM.GetName] souhlasily s investicí a jejich státní podniky se brzy vypraví do Norska." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.6.a: "Skvělé" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.7.t: "[FROM.GetName] Odmítá návrh" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.7.d: "Delegace z [FROM.GetName] se rozhodly, že nechtějí mít žádný podíl na investicích do naší země. Je to pro nás oba nešťastná ztráta." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.7.a: "Nešťastné" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.81.t: "Norsko navrhuje balíčky pomoci" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.81.d: "Norská vláda nedávno zaslala žádost o poskytnutí našemu lidu balíčků pomoci, zejména pro místní podniky. Uvolnění toku těchto balíčků pomoci by mohlo znamenat, že Norové získají výrazný vliv v naší zemi." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.81.a: "Nechte je to poslat" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.81.b: "Ne" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.82.t: "Palestinská vláda odmítá návrh pomoci" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.82.d: "Palestinská vláda odmítla náš návrh pomoci a neposkytla žádný jasný důvod." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.82.a: "OK" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.8.t: "Palestinská vláda schvaluje balíčky pomoci" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.8.d: "Palestinská vláda nedávno schválila naši žádost o poskytování pomoci jejich podnikům. Jak bychom měli postupovat?" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.8.a: "Malý balíček" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.8.b: "Střední balíček" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.8.c: "Velký balíček" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.91.t: "Kde hledáme zbraně?" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.91.d: "V současnosti hledáme vhodnou zemi, od které bychom mohli získat zbraně, a Spojené státy americké a Německo jsou naše nejlepší možnosti." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.91.a: "Zeptej se Německa" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.91.b: "Zeptej se USA" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.92.t: "Německá vláda schvaluje prodej zbraní" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.92.d: "Německá vláda schválila naše žádosti o zbraně a jejich balíčky dorazí brzy." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.92.a: "Skvělé" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.92.b: "Vlastně, tohle stojí příliš..." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.9.t: "Vláda Spojených států schvaluje prodej zbraní" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.9.d: "Americká vláda schválila naše žádosti o zbraně a jejich balíčky dorazí brzy." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.9.a: "Skvělé" # todo: NEW TRANSLATION # todo: MOVED KEY
