 norway.10.t: "Norská vláda by ráda svolala schůzku" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.10.d: "Norská vláda má zájem o ochotu naší vlády nastavit nové komunikační kanály v dobách napětí, zvláště tlačit nás k podepsání dohody, v níž nebudeme moci reagovat vojenskou silou, pokud dojde k selhání komunikačních kanálů. Také uvedla, že mají zájem o uzavření obchodních dohod pro lepší obchod mezi našimi státy." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.10.a: "Proč ne" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.10.b: "Ne" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.11.t: "Ruská vláda souhlasí" # todo: NEW TRANSLATION # todo: MOVED KEY
