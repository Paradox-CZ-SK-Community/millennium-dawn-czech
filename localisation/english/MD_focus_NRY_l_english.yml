 norway.16.t: "Migrační zákony" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.16.d: "Umožňovali jsme migrantům vstoupit do našeho státu poměrně snadno, vzhledem k nízké populaci, a že právě migrantli vybudovali tuto zemi, když byla na nejnižším bodě. Dnes se však debata změnila a budeme muset učinit rozhodnutí." # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.16.b: "Všichni jsou zde vítáni" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.16.a: "Je na čase, abychom zavedli určité regulace" # todo: NEW TRANSLATION # todo: MOVED KEY
