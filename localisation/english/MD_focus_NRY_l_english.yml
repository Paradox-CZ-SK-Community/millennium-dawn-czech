 norway.14.d: "Náš stát uznává právo na občanské svazky mezi dvěma jednotlivci, avšak plné manželství homosexuálních jedinců dosud nebylo plně legalizováno. Můžeme dnes debatu ukončit." # todo: NEW TRANSLATION # todo: MOVED KEY
