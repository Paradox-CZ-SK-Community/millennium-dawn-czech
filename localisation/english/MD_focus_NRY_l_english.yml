 norway.103.t: "Norsko chce pro nás vybudovat infrastrukturu" # todo: NEW TRANSLATION # todo: MOVED KEY
 norway.103.d: "Ve snaze vybudovat projekt, který zlepší cestování a hospodářskou efektivitu po Skandinávii, Norsko uzavřelo smlouvu se společností Veidekke, která má vybudovat nezbytnou infrastrukturu v naší zemi." # todo: NEW TRANSLATION # todo: MOVED KEY
