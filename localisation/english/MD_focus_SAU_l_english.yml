 SAU_research_modifery_01: "§HDiverzifikace§! – výzkum a vývoj" # todo: NEW TRANSLATION
 SAU_research_modifery_01_desc: "Cílené financování univerzit a výzkumných ústavů urychluje snahu Království vybudovat znalostní ekonomiku mimo ropu." # todo: NEW TRANSLATION
 SAU_research_modifery_02: "§HDiverzifikace§! – světová špička ve výzkumu" # todo: NEW TRANSLATION
 SAU_research_modifery_02_desc: "Vlajkové instituce jako KAUST učinily ze Saúdské Arábie rostoucí regionální centrum vědy a inovací, které přitahuje talenty z celého světa." # todo: NEW TRANSLATION
 SAU_research_modifier_01: "Probouzení myslí" # todo: NEW TRANSLATION
 SAU_research_modifier_01_desc: "Programy základní gramotnosti rozšiřují počet Saúdů schopných vstoupit do formálního vzdělávání." # todo: NEW TRANSLATION
 SAU_research_modifier_02: "Čtenářský národ" # todo: NEW TRANSLATION
 SAU_research_modifier_02_desc: "Rostoucí gramotnost vytvořila širší čtenářskou veřejnost a zvýšila poptávku po školách a vzdělávacích materiálech." # todo: NEW TRANSLATION
 SAU_research_modifier_03: "Rozšiřování vzdělávání" # todo: NEW TRANSLATION
 SAU_research_modifier_03_desc: "Rozšíření škol a zápisu umožňuje více Saúdům přístup k základnímu a střednímu vzdělání." # todo: NEW TRANSLATION
 SAU_research_modifier_04: "Základy vzdělávání" # todo: NEW TRANSLATION
 SAU_research_modifier_04_desc: "Království vybudovalo instituce a vyškolilo pracovníky potřebné pro širší národní vzdělávací systém." # todo: NEW TRANSLATION
 SAU_research_modifier_06: "Pěstování intelektu" # todo: NEW TRANSLATION
 SAU_research_modifier_06_desc: "Univerzity a výzkumné instituce vytvářejí větší skupinu vysoce vzdělaných saúdských odborníků." # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_content: "§HKrálovsko-ulámácká aliance§!" # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_content_desc: "§LUlámá§! a §Hrod al-Saud§! spolupracují produktivně. Běžné fatwy podporují trůn a běžná politika respektuje duchovenstvo. Ani jedna strana nemá důvod ke stížnostem." # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_high: "§HKrálovsko-ulámácká aliance§!" # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_high_desc: "§LRada předních učenců§! silně podporuje trůn a náboženský establishment představuje královskou politiku jako legitimní. Toto úzké spojení výrazně posiluje dynastii." # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_neutral: "§HKrálovsko-ulámácká aliance§!" # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_neutral_desc: "Trůn a duchovenstvo udržují §Yformální, ale omezený§! vztah. Ani jedna strana druhou aktivně nepodporuje ani neblokuje, takže rovnováha moci neposkytuje bonus ani postih." # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_neutral_tt: "§YVztah trůnu a ulámá je vyvážený – bez bonusu či postihu.§! \n§Yzměna rovnováhy moci = 0,00§!" # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_strained: "§RNapětí mezi královstvím a ulámá§!" # todo: NEW TRANSLATION
 SAU_royal_ulema_alliance_strained_desc: "Členové §Lulámá§! soukromě kritizují trůn a využívají kázání ke zpochybňování vládních reforem. Tento odpor snižuje náboženskou legitimitu dynastie." # todo: NEW TRANSLATION
 SAU_sabic_01: "SABIC" # todo: NEW TRANSLATION
 SAU_sabic_01_desc: "Saudi Basic Industries Corporation je významným výrobcem petrochemie. SABIC stále roste, přispívá k průmyslové diverzifikaci a poskytuje zaměstnání mimo ropný sektor." # todo: NEW TRANSLATION
 SAU_sabic_agrinutrients: "§HSABIC§! – zemědělské živiny a speciální chemikálie" # todo: NEW TRANSLATION
 SAU_sabic_agrinutrients_desc: "SABIC Agri-Nutrients přeměňuje saúdský plyn na močovinu a amoniak, zásobuje farmy v Asii a Africe a činí z Království hnojivovou velmoc." # todo: NEW TRANSLATION
 SAU_sabic_foreign_jv: "§HSABIC§! – zahraniční společné podniky" # todo: NEW TRANSLATION
 SAU_sabic_foreign_jv_desc: "Společné podniky se Shell, ExxonMobil a Mitsubishi přinesly do továren SABIC technologie světové úrovně a zároveň udržely zisky v Království." # todo: NEW TRANSLATION
 SAU_sabic_ge_plastics: "§HSABIC§! – akvizice GE Plastics" # todo: NEW TRANSLATION
 SAU_sabic_ge_plastics_desc: "Akvizice GE Plastics v roce 2007 za více než jedenáct miliard dolarů vynesla SABIC přes noc mezi přední světové výrobce technických plastů." # todo: NEW TRANSLATION
 SAU_sabic_global_champion: "§HSABIC§! – globální chemický šampion" # todo: NEW TRANSLATION
 SAU_sabic_global_champion_desc: "SABIC patří mezi největší chemické společnosti na Zemi a dokazuje, že saúdský průmysl může konkurovat daleko za hranicemi ropného barelu." # todo: NEW TRANSLATION
 SAU_sabic_hadeed: "§HSABIC§! – ocelářský komplex HADEED" # todo: NEW TRANSLATION
 SAU_sabic_hadeed_desc: "Hadeed, ocelářská divize SABIC v Džubajlu, zásobuje saúdské stavebnictví miliony tun armovací oceli a ploché oceli, které se dříve musely dovážet." # todo: NEW TRANSLATION
 SAU_sabic_ibn_affiliates: "§HSABIC§! – pobočky Ibn" # todo: NEW TRANSLATION
 SAU_sabic_ibn_affiliates_desc: "Pobočky Ibn Sina, Ibn Zahr a Ibn Rushd rozšiřují petrochemickou produkci SABIC do plastů, metanolu a vláken." # todo: NEW TRANSLATION
 SAU_sabic_jubail_yanbu: "§HSABIC§! – průmyslová města Džubajl a Janbú" # todo: NEW TRANSLATION
 SAU_sabic_jubail_yanbu_desc: "Města královské komise Džubajl a Janbú proměnila prázdné pobřeží ve dva z největších průmyslových komplexů na světě a položila základy saúdského těžkého průmyslu." # todo: NEW TRANSLATION
 SAU_sabic_rnd: "§HSABIC§! – domácí technologie" # todo: NEW TRANSLATION
 SAU_sabic_rnd_desc: "Výzkumná centra SABIC v Rijádu, Bengalúru a Geleenu udržují její katalyzátory a polymery na technologické špičce." # todo: NEW TRANSLATION
 SAU_sagia_initiative: "§HIniciativa SAGIA§!" # todo: NEW TRANSLATION
 SAU_sagia_initiative_02: "§HSAGIA – investiční reformy§!" # todo: NEW TRANSLATION
 SAU_sagia_initiative_02_desc: "§LSAGIA§! uvolnila omezení vlastnictví a zkrátila prodlevy při licencování. Tyto reformy přitahují více zahraničních podniků a usnadňují vstup na saúdský trh." # todo: NEW TRANSLATION
 SAU_sagia_initiative_03: "§HSAGIA – centrum zahraničního kapitálu§!" # todo: NEW TRANSLATION
 SAU_sagia_initiative_03_desc: "Saúdská Arábie otevřela §Hstrategická odvětví§!, zavedla §Hdaňové pobídky§! a rozvinula §Hhospodářská města§! podél svého pobřeží. Tyto politiky učinily z Království významnou regionální destinaci pro přímé zahraniční investice." # todo: NEW TRANSLATION
 SAU_sagia_initiative_04: "§GSAGIA – investiční velmoc§!" # todo: NEW TRANSLATION
 SAU_sagia_initiative_04_desc: "Saúdská Arábie nyní kombinuje §Hdiverzifikovanou ekonomiku§! s §Hotevřeným investičním trhem§!. Dokončené reformy SAGIA přitahují značný zahraniční kapitál a kvalifikované pracovníky." # todo: NEW TRANSLATION
 SAU_sagia_initiative_desc: "§LSaúdský úřad pro všeobecné investice§!, založený královským dekretem v §Ydubnu 2000§!, je první agenturou Království zaměřenou na přilákání zahraničních investic. Je odpovědný za zjednodušení obchodního práva, poskytnutí §Hjediného kontaktního místa§! investorům a zlepšení přístupu na saúdský trh." # todo: NEW TRANSLATION
 SAU_salman_health_critical: "§HZdraví krále§! – §Rkritické§!" # todo: NEW TRANSLATION
 SAU_salman_health_critical_desc: "Král již necestuje a často chybí na zasedáních Rady. Palác poskytuje jen málo informací, takže se přední představitelé připravují na nástupnictví." # todo: NEW TRANSLATION
 SAU_salman_health_declining: "§HZdraví krále§! – §Yzhoršující se§!" # todo: NEW TRANSLATION
 SAU_salman_health_declining_desc: "Král zkracuje nebo ruší stále více oficiálních audiencí, ačkoli palác neoznámil vážnou nemoc. Jeho omezený program začíná ovlivňovat chod vlády." # todo: NEW TRANSLATION
 SAU_salman_health_near_death: "§HZdraví krále§! – §Rna prahu smrti§!" # todo: NEW TRANSLATION
 SAU_salman_health_near_death_desc: "Král je blízko smrti a fakticky přenesl vládu na své nástupce. Politickou činnost nyní ovládají přípravy na nástupnictví." # todo: NEW TRANSLATION
 SAU_salman_health_serious: "§HZdraví krále§! – §Yvážné§!" # todo: NEW TRANSLATION
 SAU_salman_health_serious_desc: "Král se objevuje na veřejnosti jen zřídka a ministři stále častěji dostávají pokyny prostřednictvím královského dvora, nikoli přímo od něj." # todo: NEW TRANSLATION
 SAU_salman_health_stable: "§HZdraví krále§! – §Gstabilní§!" # todo: NEW TRANSLATION
 SAU_salman_health_stable_desc: "Král udržuje plný oficiální program, přijímá velvyslance, předsedá Radě ministrů a kontroluje vládní dokumenty. Jeho pokračující účast udržuje dvůr a ministerstva v pořádku." # todo: NEW TRANSLATION
 SAU_shura_led_notables: "Rada významných osobností" # todo: NEW TRANSLATION
 SAU_shura_led_notables_desc: "Kmenoví vůdci a významné obchodnické rodiny ovládají Radu šúry prostřednictvím neformálních dohod uzavřených před formálním hlasováním. Toto uspořádání odráží zavedené saúdské mocenské struktury, ale zpomaluje rozhodování." # todo: NEW TRANSLATION
 SAU_shura_led_technocrats: "Rada ministerstev" # todo: NEW TRANSLATION
 SAU_shura_led_technocrats_desc: "Technokraté učinili Radu šúry účinnější při kontrole rozpočtů a vládní politiky. Její členové jsou vysoce schopní, ale špatně zastupují komunity mimo Rijád." # todo: NEW TRANSLATION
 SAU_shura_led_ulema: "Rada ulámá" # todo: NEW TRANSLATION
 SAU_shura_led_ulema_desc: "Náboženští učenci ovládají Radu šúry a brání tomu, aby se ke králi dostaly návrhy odporující náboženskému establishmentu." # todo: NEW TRANSLATION
 SAU_sp_abrams_combined: "Obrněné síly: kombinované zbraně" # todo: NEW TRANSLATION
 SAU_sp_abrams_combined_desc: "Tanky, pěchota a dělostřelectvo bojující jako jeden vyvážený tým.\n§G+5 %§! útoku divizí\n§G+5 %§! obrany divizí\n§G+5 %§! organizace divizí\n§R+10 %§! doby výcviku armády" # todo: NEW TRANSLATION
 SAU_sp_abrams_defensive: "Obrněné síly: obranná zeď" # todo: NEW TRANSLATION
 SAU_sp_abrams_defensive_desc: "Zakopané obrněné jednotky jako nepohnutelný štít Království.\n§G+10 %§! obrany divizí\n§G+10 %§! rychlosti opevňování\n§R-10 %§! rychlosti divizí" # todo: NEW TRANSLATION
 SAU_sp_abrams_shock: "Obrněné síly: šok a průlom" # todo: NEW TRANSLATION
