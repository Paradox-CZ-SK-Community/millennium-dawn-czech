 SAU_decree_salman_cpsa_council: "Rada pro politické a bezpečnostní záležitosti" # todo: NEW TRANSLATION
 SAU_decree_salman_cpsa_council_desc: "Jediná rada nyní schvaluje politická i bezpečnostní rozhodnutí a její práce postupuje rychlostí muže, který jí předsedá." # todo: NEW TRANSLATION
 SAU_decree_salman_ksrelief: "Operace KSrelief" # todo: NEW TRANSLATION
