 SAU_events.317.a: "Letectvo: mistrovství v manévrovém boji" # todo: NEW TRANSLATION
 SAU_events.317.b: "Letectvo: boj mimo vizuální dohled" # todo: NEW TRANSLATION
 SAU_events.317.c: "Letectvo: doktrína protivzdušné obrany" # todo: NEW TRANSLATION
