 SAU_succession_panel_dormant: "Trůn je obsazen a nástupnictví není předmětem sporu. Pokud se znovu otevře, princové a jejich frakce budou uvedeni zde.[ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]" # todo: NEW TRANSLATION
 SAU_succession_panel_named: "Korunní princ byl jmenován: §H[ROOT.GetSAUCrownPrinceName]§!. Spor skončil a uspořádání vydrží přesně tak dlouho jako král.\n\n§YZdraví krále:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]" # todo: NEW TRANSLATION
 SAU_succession_panel_race1: "Král Fahd zemřel a nyní vládne král Abdalláh, ale i on je starý a nástupnictví není vyřešeno. O jmenování dědicem soupeří tři princové: Salmán bin Abdulazíz, praporečník sudajrského establishmentu; Muhammad bin Nájif, pán bezpečnostních služeb; a Mutajb bin Abdalláh, velitel Národní gardy.\n\nPodpořte jednoho prince a sjednoťte za ním rodinu i stát, zatímco budete podkopávat jeho soupeře. Každá frakce zároveň intrikuje ve svůj prospěch, takže rovnováha vlivu se každý měsíc posouvá. Až král Abdalláh zemře, na trůn nastoupí princ s největším podílem vlivu.\n\n§YSalmán bin Abdulazíz:§! [?SAU_salman_share|0]%\n§YMuhammad bin Nájif:§! [?SAU_mbn_share|0]%\n§YMutajb bin Abdalláh:§! [?SAU_mutaib_share|0]%\n\n§YZjevný dědic, kdyby Abdalláh zemřel dnes:§! §H[ROOT.GetSAUCrownFrontrunner]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]" # todo: NEW TRANSLATION
 SAU_succession_panel_race2: "Král Salmán vládne a spor se zúžil na dva muže a jeden titul. Muhammad bin Nájif ovládá ministerstvo vnitra, agendu boje proti terorismu a důvěru Washingtonu. Muhammad bin Salmán ovládá ekonomiku, obranný resort a přízeň svého otce, která v této rodině vždy znamenala víc.\n\nPodpořte jednoho a sjednoťte za ním stát, zatímco budete podkopávat druhého. Kdo bude mít větší podíl ve chvíli, kdy král jmenuje svého dědice — nebo když zemře, aniž by ho jmenoval — nastoupí po něm na trůn.\n\n§YMuhammad bin Salmán:§! [?SAU_heir_mbs_share|0]%\n§YMuhammad bin Nájif:§! [?SAU_heir_mbn_share|0]%\n\n§YDnešní zjevný dědic:§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§YZdraví krále:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]" # todo: NEW TRANSLATION
 SAU_succession_tree_shortcut: "Strom nástupnictví" # todo: NEW TRANSLATION
 SAU_tornado_approved: "§GLondýn schválil prodej letounů Tornado§!" # todo: NEW TRANSLATION
 SAU_traditionalist_bop_advanced_range: "§HPravoslavné království§!" # todo: NEW TRANSLATION
 SAU_traditionalist_bop_left_side: "§HTradicionalisté§!" # todo: NEW TRANSLATION
 SAU_traditionalist_bop_low_range: "§HMírný tradicionalismus§!" # todo: NEW TRANSLATION
 SAU_traditionalist_bop_medium_range: "§HKonzervativní království§!" # todo: NEW TRANSLATION
 SAU_traditionalist_bop_win_range: "§RDržet se tradic§!" # todo: NEW TRANSLATION
 SAU_transitional_council_desc: "Dočasný orgán složený z důstojníků, právníků a prominentních osobností, který převzal moc po pádu monarchie. Vládne pouze do chvíle, než si Arabská republika zvolí vlastní směr." # todo: NEW TRANSLATION
 SAU_tt_extend_turkey: "[TUR.GetFlag]§HTurecko bude požádáno, aby vedlo ropovod do Evropy. Musí souhlasit.§!" # todo: NEW TRANSLATION
 SAU_tt_not_houthi: "§RHútíové nesmí ovládnout jižní Jemen.§!" # todo: NEW TRANSLATION
 SAU_throttle_pipeline_yemen: "Omezit Arabský mořský ropovod" # todo: NEW TRANSLATION
 SAU_throttle_pipeline_yemen_desc: "Snížíme kapacitu jižní trasy o jeden stupeň. Přepravíme méně a méně vyděláme — ale zároveň klesne tranzitní poplatek San'á a tlak pocítí dávno před námi." # todo: NEW TRANSLATION
 SAU_throttle_pipeline_syria: "Omezit Levantský ropovod" # todo: NEW TRANSLATION
 SAU_throttle_pipeline_syria_desc: "Snížíme kapacitu středomořské trasy o jeden stupeň. Ammán i Damašek dostanou menší podíl a oba si připomenou, čí ropa potrubím proudí." # todo: NEW TRANSLATION
 SAU_throttle_pipeline_iraq: "Omezit evropský ropovod" # todo: NEW TRANSLATION
 SAU_throttle_pipeline_iraq_desc: "Snížíme kapacitu severní trasy o jeden stupeň. Bagdádský poplatek se odpovídajícím způsobem zmenší — vyvineme tlak, aniž bychom ventily úplně uzavřeli." # todo: NEW TRANSLATION
 SAU_tt_pipeline_shutdown_dependence: "§GSnižuje závislost na ropě.§! Po uzavření trasy se království méně spoléhá na vývoz ropy." # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_yemen: "Uzavřít Arabský mořský ropovod" # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_yemen_desc: "Uzavřeme ventily u Al Mahrah. Příjmy z vývozu se zastaví, stejně jako tranzitní poplatky, které platíme San'á — a Jemen nám odříznutí neodpustí." # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_syria: "Uzavřít Levantský ropovod" # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_syria_desc: "Uzavřeme středomořskou trasu. Ammán i Damašek přijdou o tranzitní poplatky a oba si zapamatují, kdo vypnul čerpadla." # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_iraq: "Uzavřít evropský ropovod" # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_iraq_desc: "Uzavřeme severní hlavní trasu. Turecké prodloužení už nebude mít co přepravovat a uzavře se s ní; Bagdád i Ankara přijdou o své poplatky." # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_turkey: "Uzavřít turecké prodloužení" # todo: NEW TRANSLATION
 SAU_shutdown_pipeline_turkey_desc: "Zastavíme čerpání za iráckou hranicí. Hlavní trasa zůstane otevřená — o svůj podíl přijde pouze Ankara a ta si toho všimne." # todo: NEW TRANSLATION
 SAU_tt_pipeline_oil_dependence: "§RZvyšuje závislost na ropě.§! Království se dále zavazuje k vývozu své ropy." # todo: NEW TRANSLATION
 SAU_tt_sabotage_chance: "§Y50% šance§! na přerušení ropovodu. Pokud uspěje, Saúdská Arábie přijde o trasu a všechny její výhody." # todo: NEW TRANSLATION
 SAU_tt_saddam_talks: "§HBagdád obdrží náš návrh. Neočekává se, že Saddám souhlasí.§!" # todo: NEW TRANSLATION
 SAU_tt_via_jordan: "§HTrasa nejprve vede přes Jordánsko. Ammán musí souhlasit, než oslovíme Damašek.§!" # todo: NEW TRANSLATION
 SAU_typhoon_approved: "§GProdej letounů Eurofighter byl schválen§!" # todo: NEW TRANSLATION
 SAU_UK_stratgic_friendship_loc: "[ENG.GetFlag]Saúdsko-britské partnerství\n §HModifikátor nákladů zahraničních investic§!: §G-2.00%§!\n§HNávratnost investic§!: §G+2.00%§!" # todo: NEW TRANSLATION
 SAU_UK_stratgic_friendship_UKOne: "Saúdsko-britské partnerství" # todo: NEW TRANSLATION
 YEM_south_yemen: "Jižní Jemen" # todo: NEW TRANSLATION
 SAU_corporate_policy: "Firemní a pracovní politika" # todo: NEW TRANSLATION
 SAU_corporate_policy_tt: "§HJak království reguluje své společnosti a koho smějí zaměstnávat.§!" # todo: NEW TRANSLATION
 SAU_corporate_policy_2_tt: "§YKvóty Nitaqat a pravidla Kafala přežijí jakoukoli vládu — tyto podmínky přečkají změnu režimu.§!" # todo: NEW TRANSLATION
 SAU_the_dynamic_tiering_formula: "Dynamický vzorec odstupňování" # todo: NEW TRANSLATION
 SAU_the_dynamic_tiering_formula_desc: "Kvóta, která znamená něco jiného pro firmu s devíti tisíci zaměstnanci a pro firmu s devíti, nemůže být jediné číslo. Vzorec přizpůsobuje požadavek počtu zaměstnanců, příjmům a odvětví a každý kvartál jej přepočítává.\n\nFirmy přestanou obcházet práh tím, že se rozdělí na dvě." # todo: NEW TRANSLATION
 SAU_high_green_zone_incentives: "Výhody vysoké zelené zóny" # todo: NEW TRANSLATION
 SAU_high_green_zone_incentives_desc: "Pod platinovou úrovní se nachází pásmo, v němž skutečně působí většina vážných zaměstnavatelů v království. Dodržují pravidla, nejsou však výjimeční, a systém jim za to dosud nic nenabízel.\n\nPřednostní vyřizování a mírnější harmonogram auditů vycházejí z předpokladu, že odměnit téměř vyhovující je levnější než je trestat." # todo: NEW TRANSLATION
 SAU_the_yellow_band_warnings: "Varování žlutého pásma" # todo: NEW TRANSLATION
 SAU_the_yellow_band_warnings_desc: "Firmě v žlutém pásmu je písemně a s uvedeným datem přesně sděleno, v čem zaostává a co se stane po uzavření čtvrtletí.\n\nVětšina z nich to napraví. Varování stojí ministerstvo jeden dopis a ušetří mu zmrazení." # todo: NEW TRANSLATION
 SAU_shura_rebalanced_tt: "§YVšechny tři lavice se resetují na 40 křesel§! – Rada zůstává sporná a žádná charta není vydána" # todo: NEW TRANSLATION
 SAU_shura_charter_ulema: "Rada vyšších učenců" # todo: NEW TRANSLATION
 SAU_shura_charter_ulema_desc: "Náboženské křídlo Rady je zapsáno do Základního zákona. Zákony se nejprve posuzují podle souladu s ním, a teprve potom podle čehokoli jiného; učenci odpovídají pouze králi.\n\nKrálovstvím je těžší pohnout a ještě těžší je podvracet. Zároveň se však přestává učit stejně rychle jako jeho sousedé." # todo: NEW TRANSLATION
 SAU_shura_charter_technocrats: "Plánovací rada" # todo: NEW TRANSLATION
 SAU_shura_charter_technocrats_desc: "Rada se stává tím, čím podle technokratů vždy měla být – plánovacím orgánem složeným z lidí, kteří umějí číst rozvahu, s trvalým mandátem nad průmyslovou a vzdělávací politikou.\n\nKrálovství se modernizuje rychleji, než kdokoli očekával. Muži, se kterými se přestalo konzultovat, si toho všimnou." # todo: NEW TRANSLATION
 SAU_shura_charter_notables: "Komora rodin" # todo: NEW TRANSLATION
 SAU_shura_charter_notables_desc: "Velké obchodnické a kmenové rody získávají stálá křesla a Rada se stává místem, kde se o královském patronátu otevřeně vyjednává namísto toho, aby se řešil v soukromí.\n\nFunguje hladce a levně. Po zemi nebude žádat nic obtížného." # todo: NEW TRANSLATION
 SAU_events.220.t: "Plánovači žádají o mandát" # todo: NEW TRANSLATION
 SAU_events.220.d: "Technokraté nyní ovládají Radu bez výhrad. Vypracovali návrh, který by tento stav učinil trvalým – stálý plánovací mandát nad průmyslem, vzděláváním a rozpočtem, přičemž složení Rady by bylo zakotveno v Základním zákoně.\n\nKrál jej může podepsat a získat vládu, která funguje, nebo odmítnout a ponechat si komoru, jejíž rovnováhu může stále měnit, kdykoli se mu to hodí." # todo: NEW TRANSLATION
 SAU_events.220.a: "Ustavte Plánovací radu." # todo: NEW TRANSLATION
 SAU_events.220.b: "Rada zůstane taková, jakou ji učiním." # todo: NEW TRANSLATION
 SAU_events.221.t: "Rodiny předkládají svůj případ" # todo: NEW TRANSLATION
 SAU_events.221.d: "Významné rodiny ovládají Radu a přišly do Diwanu s návrhem sepsaným muži, kteří s touto rodinou vyjednávají už celé století – stálá křesla pro velké rody výměnou za klid, na který se král vždy spoléhal.\n\nJe to nejlevnější dostupná vláda a zároveň ta nejméně ambiciózní." # todo: NEW TRANSLATION
 SAU_events.221.a: "Ustavte Komoru rodin." # todo: NEW TRANSLATION
 SAU_events.221.b: "Rada zůstane taková, jakou ji učiním." # todo: NEW TRANSLATION
 SAU_events.222.t: "Učenci žádají, aby byli zapsáni" # todo: NEW TRANSLATION
 SAU_events.222.d: "Ulema ovládá Radu a přeje si, aby byla zapsána do Základního zákona – jako stálý orgán vyšších učenců s právem prvního čtení každého opatření, které Království přijme.\n\nNa generaci by to vyřešilo otázku náboženské autority v Království ve prospěch učenců a pozdější král ve špatné náladě by to nemohl změnit." # todo: NEW TRANSLATION
 SAU_events.222.a: "Ustavte Radu vyšších učenců." # todo: NEW TRANSLATION
 SAU_events.222.b: "Rada zůstane taková, jakou ji učiním." # todo: NEW TRANSLATION
 SAU_junta_grip_firm: "Rozkazy Rady platí" # todo: NEW TRANSLATION
 SAU_junta_grip_firm_desc: "Rozkazy vydané v Rijádu jsou v Džázánu provedeny ještě tentýž týden. Provinční guvernéři zvedají telefon, bezpečnostní služby podávají hlášení směrem vzhůru, nikoli do stran, a nikdo potají nečeká, jakým směrem se věci vydají.\n\nJe to jediná výhoda, kterou má vláda důstojníků oproti té, kterou nahradila." # todo: NEW TRANSLATION
 SAU_junta_grip_uneven: "Nerovnoměrná moc rozkazů" # todo: NEW TRANSLATION
 SAU_junta_grip_uneven_desc: "Rada řádně spravuje hlavní město a Východní provincii, zbytek Království přibližně. Pokyny se dodržují tam, kde na ně někdo dohlíží.\n\nStačí to k udržení země. Nestačí to k její změně." # todo: NEW TRANSLATION
 SAU_junta_grip_slipping: "Moc rozkazů končí u okruhu" # todo: NEW TRANSLATION
 SAU_junta_grip_slipping_desc: "Mimo Rijád jsou rozkazy Rady přijaty, založeny a ignorovány muži, kteří počítají, jak dlouho to ještě potrvá. Velitelé posádek si začali dopisovat mezi sebou, nikoli s hlavním městem.\n\nVláda, kterou nelze poslouchat, ještě není vládou, která padla, ale rozdíl se ztenčuje." # todo: NEW TRANSLATION
 SAU_regency_deadline_tt: "§YZúčtování přijde za pět let§! – dekret musí být obnoven, prodloužen, nebo ponechán vypršet" # todo: NEW TRANSLATION
 SAU_debug_shura_seat_jump: "§Y(DEBUG) Technokraté +30 křesel§!" # todo: NEW TRANSLATION
 SAU_debug_shura_seat_jump_desc: "Posune technokratickou lavici nad hranici 70 křesel potřebnou pro chartu, takže se spustí událost charty." # todo: NEW TRANSLATION
 SAU_debug_corp_readout: "§Y(DEBUG) Firemní politika§!: daň [?SAU_corp_tax|%1] migrace [?SAU_corp_migration|%1] pracovníci [?SAU_corp_civ_workers|%1] PZI [?SAU_corp_fdi_cost|%1]" # todo: NEW TRANSLATION
 SAU_debug_corp_readout_desc: "Zobrazuje proměnné firemní a pracovní politiky, do nichž zapisují cesty Nitaqat a Kafala." # todo: NEW TRANSLATION
 SAU_debug_junta_control_up: "§Y(DEBUG) Kontrola junty +25§!" # todo: NEW TRANSLATION
 SAU_debug_junta_control_up_desc: "Zvyšuje moc Rady pro testování úrovní kontroly." # todo: NEW TRANSLATION
 SAU_debug_junta_control_down: "§Y(DEBUG) Kontrola junty -25§!" # todo: NEW TRANSLATION
 SAU_debug_junta_control_down_desc: "Snižuje moc Rady pro testování postihů za slábnoucí moc rozkazů." # todo: NEW TRANSLATION
 SAU_water_national_company: "Národní vodárenská společnost" # todo: NEW TRANSLATION
 SAU_water_national_company_desc: "Odsolování, distribuce a účtování jsou sloučeny do jediné státní utility podřízené ministerstvu. Staví tam, kde Království vodu potřebuje, nikoli tam, kde je nejvyšší marže – což je její účel i problém.\n\nVoda se dostane do vnitrozemí. Utility nikdy nebude zisková a nikdo to po ní ani nechtěl." # todo: NEW TRANSLATION
 SAU_water_foreign_operators: "Zahraniční provozovatelé vody" # todo: NEW TRANSLATION
 SAU_water_foreign_operators_desc: "Závody staví, provozují a udržují na základě smlouvy firmy, které to už stokrát dělaly, podle standardu, jehož by Království zatím samo nedosáhlo.\n\nVoda je čistší a levnější na metr krychlový. Smlouvy jsou vedeny v dolarech a odbornost odchází, když odcházejí i ony." # todo: NEW TRANSLATION
 SAU_events.223.t: "Království ve zkratce" # todo: NEW TRANSLATION
 SAU_events.223.d: "Krátká poznámka o tom, jak se toto Království hraje, od mužů, kteří je budou muset řídit.\n\n§HBudoucnost Království§! – rovnováha, nikoli tlačítko. Mění se s fokusy, událostmi a reformami, které král prosadí, a určuje, jak je země otevřená modernizaci. Sledujte ji; nelze jí poručit.\n§HZávislost na ropě§! – číslo od 0 do 100, které samo roste §Yjeden bod každé tři měsíce§!. Rozhodnutí a fokusy zaměřené na diverzifikaci ji snižují. Je to hlavní spor celé kampaně.\n§HFiremní a pracovní politika§! – v ekonomickém stromu. Zvolte §Okvóty Nitaqat§! (zdaňovat a najímat Saúdy, přijít o zahraniční pracovní sílu) nebo §Yliberalizaci Kafaly§! (levní pracovníci a zahraniční kapitál za cenu daňových příjmů a pracovních míst pro občany). Obě možnosti ovlivňují skutečnou nezaměstnanost v Království.\n§HRady§! – Madžlis aš-Šúrá existuje od začátku. Usaďte §Oulemu§!, §Ytechnokraty§! nebo §Gvýznamné rodiny§!; vedoucí lavice určí jeho charakter a po dosažení §Y70 křesel§! jej můžete trvale ustavit. Lidová rada dorazí později, schvaluje zákony a lze ji vetovat – za určitou cenu.\n§HNástupnictví§! – až Fahd zemře, princové začnou manévrovat. Podpořte jednoho prostřednictvím rozhodnutí korunního prince; kdo vede v okamžiku královy smrti, usedne na trůn a přinese vlastní směrnice. §YNajednou může dvůr zaměstnávat pouze jedna směrnice.§!\n§Armáda§! – důstojníci vedou vlastní účet toho, co jim náleží. Nechte jej běžet a jednají podle něj. §RSledujte přehled křivd a vyřešte je dříve, než bude pozdě§! – převratu lze zabránit, nikoli jej zvrátit.\n§HArabské jaro§! – pokud zachvátí region, nepokoje rostou jako číslo. V bodě zlomu si král vybere: přečkat je a obětovat stabilitu, nebo §Rnechat monarchii padnout§! a předat zemi přechodné radě.\n§HArabská republika§! – trůn není věčný a existují §Ytři cesty, jak z něj odejít§!: nechat důstojníky ovládnout Rijád a §Ovyhlásit republiku§! pod vojenskou vládou; zachovat trůn, ale §Opředat moc jiné straně než rodu Al Saúd§!, čímž se z Královského centra otevře možnost Vyhlásit Arabskou republiku; nebo nechat §OArabské jaro dosáhnout bodu zlomu§! a odstoupit, čímž ji vyhlásíte za vás. §RVojenská cesta uzavírá obě ostatní§! – Království, které už zažilo převrat, nemůže zvolit civilní cestu.\n\nVše výše uvedené je viditelné na kartách rozhodnutí. Nic z toho si nemusíte pamatovat – vše je napsáno na tlačítkách." # todo: NEW TRANSLATION
 SAU_events.223.a: "Rozumím. Začněme." # todo: NEW TRANSLATION
 SAU_tadawul_needs_market_tt: "§RVyžaduje, aby byl nejprve uveden Tadawul§! – dokončete §HTadawul, saúdskou burzu§! a každý fokus v této větvi jej posune o úroveň výše:" # todo: NEW TRANSLATION
 SAU_tadawul_matured_tt: "§GTadawul dosáhl úplného uvedení§! – burzu již nelze posunout výše, takže výnos z emise místo toho financuje §Hnové kancelářské prostory§!:" # todo: NEW TRANSLATION
 SAU_the_secularization_of_finance_choice_tt: "§YNásleduje volba§! – „Plně anglosaský – všechny nástroje povoleny“ / „Postupný – západní praxe s šarí‘atským nátěrem“." # todo: NEW TRANSLATION
