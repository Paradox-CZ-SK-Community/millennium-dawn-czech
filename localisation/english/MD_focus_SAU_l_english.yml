 SAU_events.319.a: "Přesně naváděná munice: přesný úder" # todo: NEW TRANSLATION
 SAU_events.319.b: "Přesně naváděná munice: potlačení obrany" # todo: NEW TRANSLATION
 SAU_events.319.c: "Přesně naváděná munice: izolace bojiště" # todo: NEW TRANSLATION
 SAU_events.319.desc: "Jak bude Království používat své chytré zbraně? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte na možnost kurzorem a zjistěte, co přesně poskytuje a stojí.§!" # todo: NEW TRANSLATION
 SAU_events.319.t: "Kurz doktríny přesných úderů" # todo: NEW TRANSLATION
 SAU_events.32.a: "Vzít jejich peníze." # todo: NEW TRANSLATION
 SAU_events.32.b: "Nikdy. Ať se udusí u Hormuzu." # todo: NEW TRANSLATION
 SAU_events.32.d: "Naši staří rivalové z Rijádu chtějí vést svou ropu přes naše území k moři. Za tranzitní poplatky zaplatí nemalé peníze. Hrdost je jedna věc, ale státní pokladna je prázdná." # todo: NEW TRANSLATION
 SAU_events.32.t: "Saúdský návrh" # todo: NEW TRANSLATION
 SAU_events.320.a: "Reforma: program rychlé modernizace" # todo: NEW TRANSLATION
 SAU_events.320.b: "Reforma: systematické budování" # todo: NEW TRANSLATION
 SAU_events.320.c: "Reforma: zahraniční dodavatelé" # todo: NEW TRANSLATION
 SAU_events.320.desc: "Reforma začíná. Jak silně máme tlačit? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte na možnost kurzorem a zjistěte, co přesně poskytuje a stojí.§!" # todo: NEW TRANSLATION
 SAU_events.320.t: "Fáze I: zahájení reformního programu" # todo: NEW TRANSLATION
 SAU_events.321.a: "Bojové složky: obrněná pěst" # todo: NEW TRANSLATION
 SAU_events.321.b: "Bojové složky: palebná síla" # todo: NEW TRANSLATION
 SAU_events.321.c: "Bojové složky: profesionální pěchota" # todo: NEW TRANSLATION
 SAU_events.321.desc: "Která bojová složka povede moderní síly? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte na možnost kurzorem a zjistěte, co přesně poskytuje a stojí.§!" # todo: NEW TRANSLATION
 SAU_events.321.t: "Fáze II: modernizace bojových složek" # todo: NEW TRANSLATION
 SAU_events.322.a: "Postoj: projekce síly" # todo: NEW TRANSLATION
 SAU_events.322.b: "Postoj: strategické odstrašení" # todo: NEW TRANSLATION
 SAU_events.322.c: "Postoj: obrana vlasti" # todo: NEW TRANSLATION
 SAU_events.322.desc: "Modernizace je dokončena. Jaký postoj Království zaujme? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte na možnost kurzorem a zjistěte, co přesně poskytuje a stojí.§!" # todo: NEW TRANSLATION
 SAU_events.322.t: "Fáze III: dosažení plně moderních sil" # todo: NEW TRANSLATION
 SAU_events.33.a: "Stát se mostem do Evropy." # todo: NEW TRANSLATION
 SAU_events.33.b: "Rusko nevyprovokujeme." # todo: NEW TRANSLATION
 SAU_events.33.d: "Saúdská Arábie nás žádá, abychom její ropovod vedli dál do Evropy. Stali bychom se strážcem brány pro ropu ze Zálivu na Západ a vybírali mýtné z každého barelu, za což by nám Moskva nepoděkovala." # todo: NEW TRANSLATION
 SAU_events.33.t: "Cesta do Evropy" # todo: NEW TRANSLATION
 SAU_events.330.a: "Nakoupit v Americe: M1A2 Abrams" # todo: NEW TRANSLATION
 SAU_events.330.b: "Diverzifikovat dodavatele zbraní" # todo: NEW TRANSLATION
 SAU_events.330.c: "Vybudovat domácí zbrojní průmysl" # todo: NEW TRANSLATION
 SAU_events.330.d: "Rozšířit Národní gardu" # todo: NEW TRANSLATION
 SAU_events.330.desc: "Válka v Zálivu odhalila, jak nepřipravená byla naše armáda bránit Království vlastními silami. Královské saúdské pozemní síly musí být znovu vybudovány – ale s čími zbraněmi a podle jakých zásad?" # todo: NEW TRANSLATION
 SAU_events.330.t: "Obnova pozemních sil" # todo: NEW TRANSLATION
 SAU_events.331.a: "Francouzské fregaty: program Sawari" # todo: NEW TRANSLATION
 SAU_events.331.b: "Americké lodě a výcvik" # todo: NEW TRANSLATION
 SAU_events.331.c: "Pobřežní obrana a hlídkové čluny" # todo: NEW TRANSLATION
 SAU_events.331.d: "Usilovat o oceánskou flotilu" # todo: NEW TRANSLATION
 SAU_events.331.desc: "Od Perského zálivu po Rudé moře musí Království střežit dvě dlouhá pobřeží a ropnou tepnu světa. Jaký druh flotily vybudujeme?" # todo: NEW TRANSLATION
 SAU_events.331.t: "Námořnictvo pro dvě moře" # todo: NEW TRANSLATION
 SAU_events.332.a: "Američtí orli: program Peace Sun" # todo: NEW TRANSLATION
 SAU_events.332.b: "Britské stíhačky: dohoda Al Yamamah" # todo: NEW TRANSLATION
 SAU_events.332.c: "Ruská síla: MIG-31" # todo: NEW TRANSLATION
 SAU_events.332.desc: "Letectvo je prvním štítem Království a jeho nejostřejším mečem. Kterou cestou se vydá Královské saúdské letectvo?" # todo: NEW TRANSLATION
 SAU_events.332.t: "Vláda nad oblohou" # todo: NEW TRANSLATION
 SAU_events.333.a: "Americké: M1A2 Abrams" # todo: NEW TRANSLATION
 SAU_events.333.b: "Ruské: T-90" # todo: NEW TRANSLATION
 SAU_events.333.c: "Francouzské: Leclerc" # todo: NEW TRANSLATION
 SAU_events.333.d: "Německé: Leopard 2" # todo: NEW TRANSLATION
 SAU_events.333.desc: "Armáda potřebuje moderní hlavní bojový tank. Od které mocnosti jej koupíme – nebo jej vyrobíme doma? Volba určí, na kom bude Království závislé." # todo: NEW TRANSLATION
 SAU_events.333.t: "Volba hlavního bojového tanku" # todo: NEW TRANSLATION
 SAU_events.334.a: "Namířit rakety na Teherán" # todo: NEW TRANSLATION
 SAU_events.334.b: "Držet je jako tiché odstrašení" # todo: NEW TRANSLATION
 SAU_events.334.c: "Rozšířit raketový arzenál" # todo: NEW TRANSLATION
 SAU_events.334.desc: "Strategické raketové síly dávají Království zbraň poslední volby. Jaký postoj zaujmou?" # todo: NEW TRANSLATION
 SAU_events.334.t: "Strategické odstrašení" # todo: NEW TRANSLATION
 SAU_events.335.a: "Boj proti terorismu doma" # todo: NEW TRANSLATION
 SAU_events.335.b: "Projekce síly v zahraničí" # todo: NEW TRANSLATION
 SAU_events.335.c: "Cvičit se západními speciálními silami" # todo: NEW TRANSLATION
 SAU_events.335.desc: "Naše speciální síly jsou připraveny. Kam zaměříme jejich ostří?" # todo: NEW TRANSLATION
 SAU_events.335.t: "Doktrína speciálních sil" # todo: NEW TRANSLATION
 SAU_events.336.a: "Americké fregaty (MMSC)" # todo: NEW TRANSLATION
 SAU_events.336.b: "Ruské fregaty (Gorškov)" # todo: NEW TRANSLATION
 SAU_events.336.c: "Francouzské fregaty (Sawari)" # todo: NEW TRANSLATION
 SAU_events.336.d: "Německé fregaty (MEKO)" # todo: NEW TRANSLATION
 SAU_events.336.desc: "Námořnictvo potřebuje moderní fregaty k ochraně dvou moří. Čí loděnice je postaví – nebo si vybudujeme vlastní?" # todo: NEW TRANSLATION
 SAU_events.336.t: "Volba dodavatele fregat" # todo: NEW TRANSLATION
 SAU_events.337.a: "Obojživelná útočná síla" # todo: NEW TRANSLATION
 SAU_events.337.b: "Obrana pobřeží a ostrovů" # todo: NEW TRANSLATION
 SAU_events.337.c: "Úloha rychlé reakce GCC" # todo: NEW TRANSLATION
 SAU_events.337.desc: "Nové námořní síly potřebují úlohu. Jaká bude?" # todo: NEW TRANSLATION
 SAU_events.337.t: "Námořní pěchota" # todo: NEW TRANSLATION
 SAU_events.338.a: "Koupit maximální počet F-15" # todo: NEW TRANSLATION
 SAU_events.338.b: "Udržet vyvážené letectvo" # todo: NEW TRANSLATION
 SAU_events.338.c: "Investovat do výcviku pilotů" # todo: NEW TRANSLATION
 SAU_events.338.desc: "Program Peace Sun přinesl do Království stíhačky F-15 Eagle. Jak daleko jej posuneme?" # todo: NEW TRANSLATION
 SAU_events.338.t: "Peace Sun" # todo: NEW TRANSLATION
 SAU_events.34.a: "Drahá rána." # todo: NEW TRANSLATION
 SAU_events.34.d: "Sabotéři zaútočili na ropovod vedoucí na západ ke Středozemnímu moři. Ropa přestala proudit a trasa je ztracena, dokud nebude obnovena." # todo: NEW TRANSLATION
 SAU_events.34.t: "Levantinský ropovod je přerušen" # todo: NEW TRANSLATION
 SAU_events.340.a: "Ofenzivní letecká doktrína" # todo: NEW TRANSLATION
 SAU_events.340.b: "Obranný letecký štít" # todo: NEW TRANSLATION
 SAU_events.340.c: "Integrované letecké velení GCC" # todo: NEW TRANSLATION
 SAU_events.340.desc: "Velitelství leteckých operací sjednocuje letectvo. Jaká doktrína ho povede?" # todo: NEW TRANSLATION
 SAU_events.340.t: "Vláda nad oblohou" # todo: NEW TRANSLATION
 SAU_events.341.a: "Agresivně modernizovat s pomocí Západu" # todo: NEW TRANSLATION
 SAU_events.341.b: "Vyvážené a uvážlivé budování" # todo: NEW TRANSLATION
 SAU_events.341.c: "Upřednostnit vnitřní bezpečnost a loajalitu" # todo: NEW TRANSLATION
 SAU_events.341.desc: "Po znovuzaložení ozbrojených sil musí Království určit svůj celkový směr. Jak armádu utvářet?" # todo: NEW TRANSLATION
 SAU_events.341.t: "Postavení ozbrojených sil" # todo: NEW TRANSLATION
 SAU_events.342.a: "Americké: M109 Paladin" # todo: NEW TRANSLATION
 SAU_events.342.b: "Ruské: 2S19 Msta" # todo: NEW TRANSLATION
 SAU_events.342.c: "Francouzské: CAESAR" # todo: NEW TRANSLATION
 SAU_events.342.d: "Německé: PzH 2000" # todo: NEW TRANSLATION
 SAU_events.342.desc: "Děla musí držet krok s obrněnci. Čí samohybné dělostřelectvo nasadíme – nebo si vybudujeme vlastní?" # todo: NEW TRANSLATION
 SAU_events.342.t: "Volba samohybného dělostřelectva" # todo: NEW TRANSLATION
 SAU_events.343.a: "Americké: M270 MLRS" # todo: NEW TRANSLATION
 SAU_events.343.b: "Ruské: BM-30 Smerč" # todo: NEW TRANSLATION
 SAU_events.343.desc: "Hromadná raketová palba může rozbít nepřátelský postup. Čí odpalovací zařízení získáme – nebo si vybudujeme vlastní?" # todo: NEW TRANSLATION
 SAU_events.343.t: "Volba raketového dělostřelectva" # todo: NEW TRANSLATION
 SAU_events.344.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.344.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.344.desc: "Saúdská Arábie požádala o nákup amerických stíhacích letounů. Schválení prodeje by prohloubilo závislost Rijádu na našem obranném průmyslu." # todo: NEW TRANSLATION
 SAU_events.344.t: "Saúdská žádost o americké stíhačky" # todo: NEW TRANSLATION
 SAU_events.345.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.345.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.345.desc: "Saúdská Arábie požádala o nákup britských stíhacích letounů. Schválení prodeje by posílilo výnosné obranné partnerství." # todo: NEW TRANSLATION
 SAU_events.345.t: "Saúdská žádost o britské stíhačky" # todo: NEW TRANSLATION
 SAU_events.346.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.346.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.346.desc: "Saúdská Arábie požádala o nákup ruských stíhacích letounů. Schválení prodeje by otevřelo významný nový trh v Zálivu." # todo: NEW TRANSLATION
 SAU_events.346.t: "Saúdská žádost o ruské stíhačky" # todo: NEW TRANSLATION
 SAU_events.347.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.347.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.347.desc: "Saúdská Arábie požádala o nákup velké dodávky tanků M1A2 Abrams. Prodej by Království pevněji připoutal k americké logistice a výcviku." # todo: NEW TRANSLATION
 SAU_events.347.t: "Saúdská žádost o americké tanky" # todo: NEW TRANSLATION
 SAU_events.348.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.348.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.348.desc: "Saúdská Arábie požádala o nákup velké dodávky tanků T-90. Dohoda by ruskému průmyslu zajistila oporu na trhu, který byl tradičně západní." # todo: NEW TRANSLATION
 SAU_events.348.t: "Saúdská žádost o ruské tanky" # todo: NEW TRANSLATION
 SAU_events.349.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.349.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.349.desc: "Saúdská Arábie požádala o nákup tanků Leclerc. Schválení prodeje by prohloubilo francouzské obranné vazby s Královstvím." # todo: NEW TRANSLATION
 SAU_events.349.t: "Saúdská žádost o francouzské tanky" # todo: NEW TRANSLATION
 SAU_events.35.a: "Obnovit, co můžeme." # todo: NEW TRANSLATION
 SAU_events.35.d: "Naše trasa do Evropy byla přerušena. Sabotéři vyhodili do povětří kritický úsek a ropa se už nedostává na Západ. Moskva dnes večer dýchá snáz." # todo: NEW TRANSLATION
 SAU_events.35.t: "Evropský ropovod je přerušen" # todo: NEW TRANSLATION
 SAU_events.350.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.350.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.350.desc: "Saúdská Arábie požádala o nákup tanků Leopard 2. Schválení prodeje by rozšířilo německý zbrojní vývoz do Zálivu." # todo: NEW TRANSLATION
 SAU_events.350.t: "Saúdská žádost o německé tanky" # todo: NEW TRANSLATION
 SAU_events.355.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.355.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.355.desc: "Rijád chce Paladin, a chce ho ve velkém. Království používá americká 155mm děla od 70. let, takže obsluhy, ráže i celý řetězec řízení palby už jsou naše; kupují digitální věž, která baterii umožní vypálit a přesunout se dříve, než odpoví protibaterijní radar. Saúdové zaplatí v hotovosti a včas a dohoda udrží konkurenci mimo dělostřelecký park, který držíme třicet let. Naše houfnice však také dostane do dosahu pohraniční války, kterou nekontrolujeme." # todo: NEW TRANSLATION
 SAU_events.355.t: "Saúdská žádost o americké dělostřelectvo" # todo: NEW TRANSLATION
 SAU_events.356.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.356.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.356.desc: "Z Rijádu přišla neobvyklá žádost: Saúdové chtějí Msta-S. Království nikdy nekoupilo ruské dělo a jeho dělostřelci celou kariéru cvičili se západními rážemi, takže praktický argument je slabý. Politický argument nikoli. Prodej nejlépe financované armádě v Zálivu by prolomil trh, který Washington od ropného embarga považuje za uzavřený, a každé další hlavní město Zálivu by si všimlo, kam se Rijád podíval." # todo: NEW TRANSLATION
 SAU_events.356.t: "Saúdská žádost o ruské dělostřelectvo" # todo: NEW TRANSLATION
 SAU_events.357.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.357.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.357.desc: "Rijád požádal o CAESAR a tentokrát se prodejní argument píše sám. Dělo na nákladním podvozku překonává vzdálenosti Království vlastní silou, nepotřebuje transportér a minutu po posledním výstřelu může být znovu v pohybu. Saúdové sledovali, co kolová houfnice dokáže na jejich jižní hranici, a vyvodili zjevný závěr. Objednávka udrží linku v Roanne v provozu na roky a připoutá Rijád k francouzským granátům, hlavním a technikům." # todo: NEW TRANSLATION
 SAU_events.357.t: "Saúdská žádost o francouzské dělostřelectvo" # todo: NEW TRANSLATION
 SAU_events.358.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.358.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.358.desc: "Saúdové chtějí PzH 2000, což je zároveň lichotivé i nepříjemné. Je to nejlepší houfnice na světě a každý v oboru to ví; zároveň je důvodem, proč bude Bundestag dva týdny debatovat o tom, kam tato děla zamíří. Království je platící zákazník s válkou na jižní hranici a licenci musí podepsat vláda, která slíbila, že bude přesně v tomto ohledu opatrná. Průmysl chce zakázku. Koalice její schválení možná nepřežije." # todo: NEW TRANSLATION
 SAU_events.358.t: "Saúdská žádost o německé dělostřelectvo" # todo: NEW TRANSLATION
 SAU_events.364.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.364.b: "Žádost zamítnout." # todo: NEW TRANSLATION
 SAU_events.364.desc: "Rijád žádá o M270 a nejde o další prodej dělostřelectva. Odpalovací zařízení, které během minuty dopraví na čtverec mapy množství oceli odpovídající praporu, je strategickou zbraní a rakety, které odpalují, můžeme dodávat nebo zadržovat tak dlouho, dokud Království odpalovací zařízení vlastní. To je páka, ale také riziko: o čemkoli, k čemu budou tato zařízení použita, se bude informovat s naší vlajkou na bedně." # todo: NEW TRANSLATION
 SAU_events.364.t: "Saúdská žádost o americké raketové dělostřelectvo" # todo: NEW TRANSLATION
 SAU_events.365.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.365.b: "Odmítnout žádost." # todo: NEW TRANSLATION
 SAU_events.365.desc: "Rijád požádal o koupi raketometu Smerč a tato žádost nám říká víc, než by kdy vydělal samotný obchod. Nikdo neprodává 300mm raketomet zemi, která může nakupovat americké zbraně, pokud jí nebyla odmítnuta. Království chce dosah, který ve Washingtonu získat nemůže, a je ochotno přijet do Moskvy, aby ho našlo. Zbraně jsou dobrým obchodem. Precedens je ještě lepší." # todo: NEW TRANSLATION
 SAU_events.365.t: "Saúdská žádost o ruské raketové dělostřelectvo" # todo: NEW TRANSLATION
 SAU_events.351.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.351.b: "Odmítnout žádost." # todo: NEW TRANSLATION
 SAU_events.351.desc: "Saúdská Arábie požádala americké loděnice o stavbu moderní fregaty pro Královské saúdské námořnictvo. Smlouva by prohloubila námořní spolupráci s Rijádem." # todo: NEW TRANSLATION
 SAU_events.351.t: "Saúdská žádost o americkou fregatu" # todo: NEW TRANSLATION
 SAU_events.352.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.352.b: "Odmítnout žádost." # todo: NEW TRANSLATION
 SAU_events.352.desc: "Saúdská Arábie požádala ruské loděnice o stavbu moderní fregaty pro Královské saúdské námořnictvo. Smlouva by otevřela ruským válečným lodím nový trh v Perském zálivu." # todo: NEW TRANSLATION
 SAU_events.352.t: "Saúdská žádost o ruskou fregatu" # todo: NEW TRANSLATION
 SAU_events.353.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.353.b: "Odmítnout žádost." # todo: NEW TRANSLATION
 SAU_events.353.desc: "Saúdská Arábie požádala francouzské loděnice o stavbu moderní fregaty pro Královské saúdské námořnictvo. Smlouva by prodloužila dlouhodobé obranné vztahy s Rijádem." # todo: NEW TRANSLATION
 SAU_events.353.t: "Saúdská žádost o francouzskou fregatu" # todo: NEW TRANSLATION
 SAU_events.354.a: "Schválit prodej." # todo: NEW TRANSLATION
 SAU_events.354.b: "Odmítnout žádost." # todo: NEW TRANSLATION
 SAU_events.354.desc: "Saúdská Arábie požádala německé loděnice o stavbu moderní válečné lodi pro Královské saúdské námořnictvo. Smlouva by posílila německé obranné vazby v Perském zálivu." # todo: NEW TRANSLATION
 SAU_events.354.t: "Saúdská žádost o německou válečnou loď" # todo: NEW TRANSLATION
 SAU_events.360.a: "§HZaložit státní investiční fond.§! Uložit neočekávané příjmy a investovat je do budoucna." # todo: NEW TRANSLATION
 SAU_events.360.b: "§HFinancovat velkolepé megaprojekty.§! Vložit peníze do továren a měst doma." # todo: NEW TRANSLATION
 SAU_events.360.c: "§HRozdělit je lidu.§! Dotace a bonusy si koupí loajalitu a klid." # todo: NEW TRANSLATION
 SAU_events.360.d: "Cena ropy stoupá z 25 dolarů na více než §G140 dolarů za barel§!. Petrodolary zaplavují státní pokladnu rychleji, než je Království dokáže počítat. §YNeočekávané příjmy z let 2003–2008§! představují jedinečnou šanci celé generace – a způsob, jakým budou utraceny, ovlivní Království na celá desetiletí. Rada diskutuje: §Lšetřit, budovat, nebo se podělit§!?" # todo: NEW TRANSLATION
 SAU_events.360.t: "§HObdobí ropného rozmachu§!" # todo: NEW TRANSLATION
 SAU_events.361.a: "§RNeuvěřitelná rána!§!" # todo: NEW TRANSLATION
 SAU_events.361.b: "Najít nové dodavatele a přečkat to." # todo: NEW TRANSLATION
 SAU_events.361.d: "Rijád se k nám připojil v arabském ropném embargu. Tankery nečinně stojí v Perském zálivu, naše rafinerie vysychají a ceny u čerpacích stanic se vymykají kontrole. Továrny stojí a motoristé čekají celé hodiny.\n\nSaúdové tvrdí, že kohoutky zůstanou zavřené, dokud nezměníme svou politiku vůči regionu. Naše ekonomika bude pociťovat tlak tak dlouho, jak bude embargo trvat." # todo: NEW TRANSLATION
 SAU_events.361.t: "§RSaúdská Arábie nám odřízla ropu§!" # todo: NEW TRANSLATION
 SAU_events.362.a: "§GRopa je náš meč.§!" # todo: NEW TRANSLATION
 SAU_events.362.b: "§RCo přijde, to přečkáme.§!" # todo: NEW TRANSLATION
 SAU_events.362.c: "Nebezpečná eskalace." # todo: NEW TRANSLATION
 SAU_events.362.d: "V ozvěně §Hroku 1973§! vyhlásilo Království Saúdské Arábie embargo na dodávky ropy Západu a přátelům Izraele. §LSpojené státy, Británie, Francie, Německo a Nizozemsko§! nyní čelí nedostatku paliva, přídělovému systému a prudce rostoucím cenám.\n\nNapříč arabským a muslimským světem davy oslavují vzdor Rijádu. V západních metropolích vlády horečně hledají alternativní dodavatele a varují před recesí. Ropa, kdysi pouhá komodita, se stala nástrojem státní politiky." # todo: NEW TRANSLATION
 SAU_events.362.t: "§HSaúdská Arábie používá ropnou zbraň§!" # todo: NEW TRANSLATION
 SAU_events.363.a: "§YBarely vždy volají.§! (§RZávislost na ropě +2§!)" # todo: NEW TRANSLATION
 SAU_events.363.d: "I když Království diverzifikuje, gravitace ropy nepolevuje. Každé ministerstvo, každá rozpočtová položka, každý snadno získaný petrodolar táhne ekonomiku zpět k ropě. Zájmové skupiny, levná energie i cesta nejmenšího odporu směřují stejným směrem.\n\nBez neustálého úsilí Království znovu sklouzne k závislosti na ropě." # todo: NEW TRANSLATION
 SAU_events.363.t: "§RPřitažlivost ropy§!" # todo: NEW TRANSLATION
 SAU_events.370.a: "§GPřijmout tržní reformu.§! Nechat vést soukromý sektor." # todo: NEW TRANSLATION
 SAU_events.370.b: "§RChránit zavedený řád.§! Změna může počkat." # todo: NEW TRANSLATION
 SAU_events.370.d: "Technokraté z ministerstva hospodářství prosazují §Lderegulaci, privatizaci a otevřené trhy§!. Konzervativci varují, že příliš rychlý postup rozvrátí společenskou smlouvu, na níž je Království postaveno. Rada musí naznačit směr." # todo: NEW TRANSLATION
 SAU_events.370.t: "§HEkonomické změny§!" # todo: NEW TRANSLATION
 SAU_events.371.a: "§GRozšířit příležitosti pro ženy.§! Ekonomika potřebuje každý talent." # todo: NEW TRANSLATION
 SAU_events.371.b: "§RZachovat tradiční role.§! Uchovat rodinnou strukturu." # todo: NEW TRANSLATION
 SAU_events.371.d: "Nová generace vzdělaných saúdských žen chce pracovat a ekonomika je potřebuje. Reformátoři vidí nevyužitý talent; §Lulema§! a konzervativní rodiny vidí hranici, která nesmí být překročena." # todo: NEW TRANSLATION
 SAU_events.371.t: "§HŽeny na pracovním trhu§!" # todo: NEW TRANSLATION
 SAU_events.372.a: "§GPovolit otevřený přístup.§! Království se nemůže před světem skrývat." # todo: NEW TRANSLATION
 SAU_events.372.b: "§RFiltrovat a cenzurovat.§! Chránit veřejnou morálku." # todo: NEW TRANSLATION
 SAU_events.372.d: "Satelitní televize a počínající internet přinášejí do saúdských obývacích pokojů zahraniční myšlenky. Liberálové vítají otevření světu; tradicionalisté požadují, aby stát filtroval, co se dostane k věřícím." # todo: NEW TRANSLATION
 SAU_events.372.t: "§HSatelitní antény a internet§!" # todo: NEW TRANSLATION
 SAU_events.373.a: "§GOmezit jejich pravomoc.§! Zkrotit hlídky." # todo: NEW TRANSLATION
 SAU_events.373.b: "§RPotvrdit jejich mandát.§! Ctnost musí být vynucována." # todo: NEW TRANSLATION
 SAU_events.373.d: "§LVýbor pro podporu ctnosti§! hlídkuje v ulicích a vynucuje pravidla oblékání, modlitby a oddělování pohlaví. Obyvatelé měst a podniky se proti jeho moci bouří; duchovenstvo ho považuje za strážce duše národa." # todo: NEW TRANSLATION
 SAU_events.373.t: "§Náboženská policie§!" # todo: NEW TRANSLATION
 SAU_events.380.a: "Povolit běžné úročené účty." # todo: NEW TRANSLATION
 SAU_events.380.b: "Přísný zákaz riba – šaría je nejvyšší." # todo: NEW TRANSLATION
 SAU_events.380.c: "Sukúky na veřejnosti, pragmatické úroky v soukromí." # todo: NEW TRANSLATION
 SAU_events.380.d: "Království se musí vyjádřit k §Lribě§! – zákazu úroku. §LSekulární reformáři§! tvrdí, že běžné úročené účty přilákají zahraniční kapitál a zmodernizují bankovnictví. §LRada předních učenců§! požaduje přísný zákaz v souladu se šaríou. §HHybridní§! přístup umožní sukúky na veřejnosti a neformální úroky za zavřenými dveřmi." # todo: NEW TRANSLATION
 SAU_events.380.t: "§HZákon o standardizaci úroků§!" # todo: NEW TRANSLATION
 SAU_events.381.a: "Moderní bankovnictví s částečnými rezervami – růst za cenu stability." # todo: NEW TRANSLATION
 SAU_events.381.b: "Pouze kryté aktivy – stabilní, ale pomalejší." # todo: NEW TRANSLATION
 SAU_events.381.c: "Mírné požadavky na rezervy." # todo: NEW TRANSLATION
 SAU_events.381.d: "Kolik úvěrů mohou banky vytvořit z každého rijálu vkladů? §LZápadní model§! používá §Hbankovnictví s částečnými rezervami§! – pákový poměr 10:1, více úvěrů, vyšší růst a větší riziko. §LIslámská alternativa§! vyžaduje §Hplné krytí aktivy§! – každý úvěr je spojen se skutečným majetkem, což je pomalejší, ale stabilní. §HHybrid§! stanoví mírné požadavky na rezervy." # todo: NEW TRANSLATION
 SAU_events.381.t: "§HPožadavky na částečné rezervy§!" # todo: NEW TRANSLATION
 SAU_events.382.a: "Lehká regulace – povolit deriváty a futures." # todo: NEW TRANSLATION
 SAU_events.382.b: "Přísný zákaz – žádná gharar, žádné hazardování." # todo: NEW TRANSLATION
 SAU_events.382.c: "Pouze regulované deriváty – vyvážený přístup." # todo: NEW TRANSLATION
 SAU_events.382.d: "Jak přísně by mělo Království regulovat §Lspekulace, deriváty a futures§!? §LZápadní pohled§! je považuje za zásadní nástroje řízení rizik. §LIslámský pohled§! je odsuzuje jako §Lgharar§! (nadměrnou nejistotu) – jen o málo lepší než hazard. §HHybrid§! povolí pouze regulované deriváty." # todo: NEW TRANSLATION
 SAU_events.382.t: "§HSměrnice proti spekulacím§!" # todo: NEW TRANSLATION
 SAU_events.383.a: "Konvenční mezibankovní trh založený na úroku." # todo: NEW TRANSLATION
 SAU_events.383.b: "Islámský mezibankovní trh založený na murábahě." # todo: NEW TRANSLATION
 SAU_events.383.c: "Hybridní model – obojí, provozované odděleně." # todo: NEW TRANSLATION
 SAU_events.383.d: "Za jakých podmínek si mají banky navzájem půjčovat? §LZápadní model§! používá §Hkonvenční úroková pásma§! (ve stylu LIBORu). §LIslámská alternativa§! vede mezibankovní toky přes §Hmurábahu§! – financování s navýšením ceny kryté aktivy. §HHybrid§! povoluje obojí, odděleně podle sektoru." # todo: NEW TRANSLATION
 SAU_events.383.t: "§HKodex mezibankovních půjček§!" # todo: NEW TRANSLATION
 SAU_events.384.a: "SAMA – nezávislý sekulární regulátor." # todo: NEW TRANSLATION
 SAU_events.384.b: "SAMA + rada šaría s závazným právem veta." # todo: NEW TRANSLATION
 SAU_events.384.c: "Hybridní model – dvě paralelní struktury." # todo: NEW TRANSLATION
 SAU_events.384.d: "Kdo dohlíží na banky Království? §LZápadní model§! činí ze §LSAMA§! (Saúdské arabské měnové agentury) §Hnezávislého technokratického regulátora§!. §LIslámská alternativa§! spojuje SAMA s §Hdozorčí radou šaría§! – duchovními s závazným právem veta. §HHybrid§! znamená dvě paralelní struktury." # todo: NEW TRANSLATION
 SAU_events.384.t: "§HZákon o bankovním dohledu§!" # todo: NEW TRANSLATION
 SAU_events.385.a: "Přísná ortodoxie – žádné kompromisy." # todo: NEW TRANSLATION
 SAU_events.385.b: "Pragmatický přístup – stát se světovým lídrem islámských financí." # todo: NEW TRANSLATION
 SAU_events.385.d: "Království se plně zavazuje k §Hislamickým financím§!. Jak přísně? §LPřísná ortodoxie§! – žádné kompromisy, každá transakce posvěcená šaríou – získá bezpodmínečnou podporu §Lulemy§! a stabilitu na celé generace. §LPragmatické islámské finance§! – globální centrum islámských financí přitahující muslimský kapitál z §LMalajsie§!, §LIndonésie§!, §LIránu§! a §LPerského zálivu§! – obětuje část čistoty ve prospěch vlivu." # todo: NEW TRANSLATION
 SAU_events.385.t: "§HOpevnost islámských financí§!" # todo: NEW TRANSLATION
 SAU_events.386.a: "Plně anglosaské – povoleny všechny nástroje." # todo: NEW TRANSLATION
 SAU_events.386.b: "Postupně – západní praxe s fasádou šaríi." # todo: NEW TRANSLATION
 SAU_events.386.d: "Království se odvrací od tradice a §Hsekularizuje§! svůj finanční sektor. Cesta §LPlně anglosaská§! přijímá každý západní nástroj – §Hderiváty§!, §Hdluhopisy§!, §Hobchodování na marži§! – přiláká maximum zahraničního kapitálu, ale rozzuří §Lulemu§!. Cesta §LPostupná§! zachovává nad západní praxí fasádu šaríi – méně příjmů, menší odpor." # todo: NEW TRANSLATION
 SAU_events.386.t: "§HSekularizace financí§!" # todo: NEW TRANSLATION
 SAU_events.39.a: "Bouře propukla." # todo: NEW TRANSLATION
 SAU_events.39.d: "Saúdská a koaliční letadla zasáhla cíle po celém Jemenu ovládaném HúSíji v rozsáhlé letecké kampani. Rijád vyhlásil záměr obnovit uznávanou vládu a zatlačit hnutí podporované Íránem. Blízký východ zadržuje dech." # todo: NEW TRANSLATION
 SAU_events.39.t: "Začíná operace Rozhodná bouře" # todo: NEW TRANSLATION
 SAU_events.390.a: "Schválit prodej Rijádu" # todo: NEW TRANSLATION
 SAU_events.390.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 SAU_events.390.d: "Království Saúdské Arábie formálně požádalo o koupi F-15 Strike Eagle – naší nejlepší exportní stíhačky. Rijád je klíčovým spojencem v Perském zálivu a významným odběratelem zbraní. Máme prodej schválit?" # todo: NEW TRANSLATION
 SAU_events.390.t: "Saúdská žádost: F-15 Strike Eagle" # todo: NEW TRANSLATION
 SAU_events.391.a: "Výborné zprávy." # todo: NEW TRANSLATION
 SAU_events.391.d: "Spojené státy souhlasily s prodejem F-15 Strike Eagle Království. Dohoda je uzavřena – Královské saúdské letectvo bude brzy létat na nejlepších amerických stíhačkách." # todo: NEW TRANSLATION
 SAU_events.391.t: "Washington schválil dohodu o F-15" # todo: NEW TRANSLATION
 SAU_events.392.a: "Neúspěch." # todo: NEW TRANSLATION
 SAU_events.392.d: "Spojené státy v tuto chvíli odmítly F-15 prodat. Po nějaké době můžeme žádost obnovit." # todo: NEW TRANSLATION
 SAU_events.392.t: "Washington odmítá" # todo: NEW TRANSLATION
 SAU_events.393.a: "Schválit export" # todo: NEW TRANSLATION
 SAU_events.393.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 SAU_events.393.d: "Saúdská Arábie požádala v rámci programu Al Salam o Eurofighter Typhoon. Má Německo jako partner konsorcia schválit export do Rijádu?" # todo: NEW TRANSLATION
 SAU_events.393.t: "Saúdská žádost: Eurofighter Typhoon" # todo: NEW TRANSLATION
 SAU_events.394.a: "Výborné zprávy." # todo: NEW TRANSLATION
 SAU_events.394.d: "Konsorcium schválilo export Eurofighteru Typhoon do Království. Program Al Salam nyní může pokračovat." # todo: NEW TRANSLATION
 SAU_events.394.t: "Dohoda o Typhoonu schválena" # todo: NEW TRANSLATION
 SAU_events.395.a: "Neúspěch." # todo: NEW TRANSLATION
 SAU_events.395.d: "Evropané zatím odmítli Typhoon vyvézt. Později se můžeme pokusit znovu." # todo: NEW TRANSLATION
 SAU_events.395.t: "Dohoda o Typhoonu odmítnuta" # todo: NEW TRANSLATION
 SAU_events.396.a: "Schválit prodej Rijádu" # todo: NEW TRANSLATION
 SAU_events.396.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 SAU_events.396.d: "Království Saúdské Arábie si přeje rozšířit program Al Yamamah a zakoupit modernizovaný Tornado GR4. Rijád je po desetiletí loajálním zákazníkem britského průmyslu. Máme prodej schválit?" # todo: NEW TRANSLATION
 SAU_events.396.t: "Saúdská žádost: Tornado GR4" # todo: NEW TRANSLATION
 SAU_events.397.a: "Výborné zprávy." # todo: NEW TRANSLATION
 SAU_events.397.d: "Spojené království souhlasilo s dodávkou Tornada GR4 Království v rámci rozšířené dohody Al Yamamah. Naše úderné letky budou závistí celého Perského zálivu." # todo: NEW TRANSLATION
 SAU_events.397.t: "Londýn schválil dohodu o Tornadech" # todo: NEW TRANSLATION
 SAU_events.398.a: "Neúspěch." # todo: NEW TRANSLATION
 SAU_events.398.d: "Spojené království v tuto chvíli odmítlo dohodu o Tornadech rozšířit. Po nějaké době můžeme žádost obnovit." # todo: NEW TRANSLATION
 SAU_events.398.t: "Londýn odmítá" # todo: NEW TRANSLATION
 SAU_events.399.a: "Schválit export" # todo: NEW TRANSLATION
 SAU_events.399.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 SAU_events.399.d: "Saúdská Arábie požádala o Panavia Tornado IDS, odolný mnohonárodní úderný letoun. Má Itálie jako partner konsorcia schválit export do Rijádu?" # todo: NEW TRANSLATION
 SAU_events.399.t: "Saúdská žádost: Panavia Tornado" # todo: NEW TRANSLATION
 SAU_events.4.a: "Výborné zprávy." # todo: NEW TRANSLATION
 SAU_events.4.d: "[FROM.GetNameDefCap] přijalo naši nabídku. Dohoda nyní může pokračovat." # todo: NEW TRANSLATION
 SAU_events.4.t: "[FROM.GetNameDefCap] přijímá nabídku" # todo: NEW TRANSLATION
 SAU_events.40.a: "Zadržování: izolovat a zardousit režim." # todo: NEW TRANSLATION
 SAU_events.40.b: "Opatrné uvolnění napětí: prozatím zmírnit situaci." # todo: NEW TRANSLATION
 SAU_events.40.c: "Válečná pohotovost: udeříme dřív, než udeří on." # todo: NEW TRANSLATION
 SAU_events.40.d: "Saddám stále vládne v Bagdádu a vzpomínky na Kuvajt a Chafdží tíží Perský záliv. Království se musí rozhodnout, jak se vypořádá s tímto nebezpečným sousedem, než se znovu rozhodne riskovat." # todo: NEW TRANSLATION
 SAU_events.40.t: "Saddámův stín" # todo: NEW TRANSLATION
 SAU_events.400.a: "Výborné zprávy." # todo: NEW TRANSLATION
 SAU_events.400.d: "Itálie souhlasila s exportem Panavia Tornado IDS do Království. Konsorcium vítá nového váženého provozovatele." # todo: NEW TRANSLATION
 SAU_events.400.t: "Řím schválil dohodu o Tornadech" # todo: NEW TRANSLATION
 SAU_events.401.a: "Neúspěch." # todo: NEW TRANSLATION
 SAU_events.401.d: "Itálie zatím odmítla Tornado vyvézt. Později se můžeme pokusit znovu." # todo: NEW TRANSLATION
 SAU_events.401.t: "Řím odmítá" # todo: NEW TRANSLATION
 SAU_events.5.a: "Neúspěch." # todo: NEW TRANSLATION
 SAU_events.5.d: "[FROM.GetNameDefCap] naši nabídku odmítlo. Vztahy mezi našimi zeměmi utrpí." # todo: NEW TRANSLATION
 SAU_events.5.t: "[FROM.GetNameDefCap] odmítá nabídku" # todo: NEW TRANSLATION
 SAU_events.56.a: "Hostit jednání v Pekingu." # todo: NEW TRANSLATION
 SAU_events.56.b: "Tohle není náš spor." # todo: NEW TRANSLATION
 SAU_events.56.d: "Saúdská Arábie nás žádá o zprostředkování mezi Rijádem a Teheránem. Obě strany Perského zálivu nám prodávají ropu a jejich spor ohrožuje každý tanker, na němž jsme závislí. Hostitelství jednání by korunovalo Peking jako nepostradatelnou mocnost regionu." # todo: NEW TRANSLATION
 SAU_events.56.t: "Žádost z Rijádu" # todo: NEW TRANSLATION
 SAU_events.57.a: "Podepsat dohodu." # todo: NEW TRANSLATION
 SAU_events.57.b: "Nebudeme s nimi jednat." # todo: NEW TRANSLATION
 SAU_events.57.d: "Čína nás zve do Pekingu k podpisu dohody se Saúdskou Arábií: obnovení vztahů, znovuotevření ambasád a ukončení krveprolití prostřednictvím zástupných sil. Saúdové už souhlasili. Pero čeká na nás." # todo: NEW TRANSLATION
 SAU_events.57.t: "Pozvání do Pekingu" # todo: NEW TRANSLATION
 SAU_events.58.a: "Nová kapitola." # todo: NEW TRANSLATION
 SAU_events.58.d: "Pod čínskou záštitou Království a Islámská republika podepsaly dohodu. Ambasády se znovu otevřou, zástupné síly utichnou a Perský záliv si oddechne. Rivalita nekončí, ale nože jsou zastrčené." # todo: NEW TRANSLATION
 SAU_events.58.t: "Pekingská dohoda" # todo: NEW TRANSLATION
 SAU_events.59.a: "Tak budiž." # todo: NEW TRANSLATION
 SAU_events.59.d: "Jednání se zhroutila ještě předtím, než začala. Rivalita pokračuje a Perský záliv zůstává nebezpečný." # todo: NEW TRANSLATION
 SAU_events.59.t: "Mediace selhává" # todo: NEW TRANSLATION
 SAU_events.402.t: "Rivalita odložena" # todo: NEW TRANSLATION
 SAU_events.402.d: "Teheránova nabídka byla přijata. Velvyslanectví znovu otevřou své brány, tažení proti Islámské republice bude ukončeno a duchovní, kteří nás označovali za uzurpátory, najdou svá kázání nenápadně upravená. Hizballáhovy zbraně se od nás odvracejí spolu se svým patronem. Rivalita není zapomenuta – ale prozatím je odložena." # todo: NEW TRANSLATION
 SAU_events.402.a: "Chladnější mír než přátelství, ale lepší než alternativa." # todo: NEW TRANSLATION
 SAU_events.6.a: "Připojit se ke koridoru." # todo: NEW TRANSLATION
 SAU_events.6.b: "Odmítnout návrh." # todo: NEW TRANSLATION
 SAU_events.6.d: "Saúdská Arábie navrhuje Ekonomický koridor Indie–Blízký východ–Evropa, obchodní trasu spojující Indii s Evropou přes Perský záliv a obcházející Suezský průplav." # todo: NEW TRANSLATION
 SAU_events.6.t: "[SAU.GetFlag] Koridor Indie–Blízký východ–Evropa [RAJ.GetFlag]" # todo: NEW TRANSLATION
 SAU_events.60.a: "Armáda zasáhne proti Hizballáhu." # todo: NEW TRANSLATION
 SAU_events.60.b: "Libanon nebude krvácet za Rijád." # todo: NEW TRANSLATION
 SAU_events.60.d: "Saúdské peníze znovu vybudovaly naši armádu; saúdské pušky plní její arzenály. Nyní Rijád žádá svou cenu: zaútočit na Hizballáh a rozbít jeho stát ve státě. Armáda je připravenější než kdy dříve. Zda Libanon tento pokus přežije, je jiná otázka." # todo: NEW TRANSLATION
 SAU_events.60.t: "Mandát z Rijádu" # todo: NEW TRANSLATION
 SAU_events.61.a: "Na jih se vrací pořádek." # todo: NEW TRANSLATION
 SAU_events.61.d: "Kolony libanonské armády míří na jih, zatímco Bejrút usiluje o obnovení státní autority v jižním Libanonu. Po desetiletích života vedle státu ve státě vláda nařídila své znovu vybudované armádě odzbrojit Hizballáh silou. Hlavní města Perského zálivu tleskají; Teherán to označuje za zradu odporu." # todo: NEW TRANSLATION
 SAU_events.61.t: "Libanonská armáda zasahuje proti Hizballáhu" # todo: NEW TRANSLATION
 SAU_events.63.a: "Důkazy mluví samy za sebe." # todo: NEW TRANSLATION
 SAU_events.63.d: "Saúdská Arábie předložila Arabské lize složku úlomků raket, nákladních manifestů a zachycené komunikace, které spojují arzenál Hútíů s Íránem. Arabská hlavní města reagují s nebývalou jednotou a teheránská popírání nacházejí jen málo posluchačů." # todo: NEW TRANSLATION
 SAU_events.63.t: "Složka odhaluje íránskou úlohu v Jemenu" # todo: NEW TRANSLATION
 SAU_events.64.a: "Ulice jsou neklidné." # todo: NEW TRANSLATION
 SAU_events.64.d: "Od Teheránu po Bejrút jsou v ulicích davy protestující proti vládám Osy odporu. Stížnosti demonstrantů jsou místní, ale jejich financování má podle pozorovatelů zřetelně zálivský přízvuk. Osa obviňuje cizí ruce; cizí ruce všechno popírají." # todo: NEW TRANSLATION
 SAU_events.64.t: "Protesty zachvacují Osu odporu" # todo: NEW TRANSLATION
 SAU_events.65.a: "Umma má jedinou adresu." # todo: NEW TRANSLATION
 SAU_events.65.d: "Islámský svět se na saúdské pozvání shromáždil ve svém nejposvátnějším městě a íránská delegace zasedla mezi ostatními. Ať už se za zavřenými dveřmi rozhodne cokoli, obraz je nepopiratelný: když se umma shromažďuje, schází se v Mekce a Rijád sedí v čele stolu." # todo: NEW TRANSLATION
 SAU_events.65.t: "Summit v Mekce" # todo: NEW TRANSLATION
 SAU_events.67.a: "Podání rukou v Pekingu." # todo: NEW TRANSLATION
 SAU_events.67.d: "Na ceremoniálu, který málokdo považoval za možný, podepsaly Saúdská Arábie a Írán v Pekingu dohodu o obnovení diplomatických vztahů po letech rivality. Velvyslanectví znovu otevřou své brány a zástupné války mají utichnout. Dohodu zprostředkovala Čína a vzkaz Washingtonu je nepopiratelný: na Blízkém východě je nový prostředník." # todo: NEW TRANSLATION
 SAU_events.67.t: "Pekingská dohoda" # todo: NEW TRANSLATION
 SAU_events.68.a: "Vyslechněme je." # todo: NEW TRANSLATION
 SAU_events.68.b: "Není o čem jednat." # todo: NEW TRANSLATION
 SAU_events.68.d: "Prostřednictvím zprostředkovatelů v hlavním městě třetí země se Saúdská Arábie ptá, zda by Izrael přistoupil na jednání o normalizaci. Zatím nebyly stanoveny žádné podmínky. Otázkou je, zda naslouchat." # todo: NEW TRANSLATION
 SAU_events.68.t: "Tichý přístup z Rijádu" # todo: NEW TRANSLATION
 SAU_events.69.a: "Pokrok." # todo: NEW TRANSLATION
 SAU_events.69.d: "Izraelská odpověď přišla vstřícnější, než se očekávalo. Jednání pokračují a rozhovory se pomalu posouvají vpřed." # todo: NEW TRANSLATION
 SAU_events.69.t: "Pozitivní signály z Tel Avivu" # todo: NEW TRANSLATION
 SAU_events.7.a: "Přijmout partnerství." # todo: NEW TRANSLATION
 SAU_events.7.b: "Odmítnout nabídku." # todo: NEW TRANSLATION
 SAU_events.7.d: "Rijád navrhuje strategické investiční partnerství zaměřené na Saudi Telecom Company a jihokorejskou infrastrukturu. Obě země by získaly přístup na trh té druhé." # todo: NEW TRANSLATION
 SAU_events.7.t: "[SAU.GetFlag] Saúdsko-korejské partnerství [KOR.GetFlag]" # todo: NEW TRANSLATION
 SAU_events.70.a: "Zklamání." # todo: NEW TRANSLATION
 SAU_events.70.d: "Izraelská odpověď přišla strohá a chladná. Jednání uvízla na mrtvém bodě a s nimi pohasínají i rozhovory." # todo: NEW TRANSLATION
 SAU_events.70.t: "Chladná odpověď" # todo: NEW TRANSLATION
 SAU_events.71.a: "Přijmout hranice z roku 1967. Stát za mír." # todo: NEW TRANSLATION
 SAU_events.71.b: "Hranice z roku 1967 jsou nemožné." # todo: NEW TRANSLATION
 SAU_events.71.d: "Saúdská Arábie formálně nabídla Arabskou mírovou iniciativu: uznání, velvyslanectví, obchod a mír s celým arabským světem výměnou za nezávislý palestinský stát v hranicích z roku 1967. Jde o největší cenu, jaká kdy byla nabídnuta, za podmínek, které Izrael po desetiletí odmítal." # todo: NEW TRANSLATION
 SAU_events.71.t: "Arabská mírová iniciativa" # todo: NEW TRANSLATION
 SAU_events.72.a: "Přijmout dohodu." # todo: NEW TRANSLATION
 SAU_events.72.b: "Peníze nejsou problém." # todo: NEW TRANSLATION
 SAU_events.72.d: "Saúdští vyjednavači přihazují na stůl: investiční fondy, otevřené nebe, technologické koridory a přístup na největší trh Perského zálivu. Mír s Rijádem by vynášel jako žádný mír před ním." # todo: NEW TRANSLATION
 SAU_events.72.t: "Bohatství Perského zálivu" # todo: NEW TRANSLATION
 SAU_events.73.a: "Mír za stát. Historie." # todo: NEW TRANSLATION
 SAU_events.73.d: "Saúdská Arábie a Izrael podepsaly Rijádské dohody: úplnou normalizaci vztahů výměnou za izraelské přijetí nezávislého palestinského státu v hranicích z roku 1967, garantovaného Saúdskou Arábií a Jordánskem. Arabská mírová iniciativa, po generaci odmítaná, překreslila mapu Blízkého východu během jediného odpoledne." # todo: NEW TRANSLATION
 SAU_events.73.t: "Rijádské dohody" # todo: NEW TRANSLATION
 SAU_events.74.a: "Staré linie se vracejí." # todo: NEW TRANSLATION
 SAU_events.74.d: "Jednání mezi Rijádem a Tel Avivem skončila bez dohody. Izrael nepřijal palestinský stát; Saúdská Arábie neustoupila od tohoto požadavku. Nejodvážnější diplomatické otevření za celou generaci končí prásknutím dveří." # todo: NEW TRANSLATION
 SAU_events.74.t: "Saúdsko-izraelská jednání se hroutí" # todo: NEW TRANSLATION
 SAU_events.75.a: "Sázka století." # todo: NEW TRANSLATION
 SAU_events.75.d: "Bez podmínek, bez palestinského státu a bez varování Saúdská Arábie uznala Izrael a navázala s ním plné vztahy. Washington slaví, Tel Aviv jásá a arabské ulice hoří. Strážce dvou svatých mešit uzavřel sázku století." # todo: NEW TRANSLATION
 SAU_events.75.t: "Saúdská Arábie uznává Izrael" # todo: NEW TRANSLATION
 SAU_events.76.a: "Okamžik pominul." # todo: NEW TRANSLATION
 SAU_events.76.d: "Jednání s Izraelem vypršela. Příliš mnoho otázek zůstalo příliš dlouho otevřených a okamžik pominul. Delegace se tiše balí a staré linie se vracejí na mapu." # todo: NEW TRANSLATION
 SAU_events.76.t: "Okno se uzavírá" # todo: NEW TRANSLATION
 SAU_events.77.a: "Připravit dohody." # todo: NEW TRANSLATION
 SAU_events.77.d: "Izrael přijal dostatek našich podmínek, aby se dohoda stala skutečností. Zbývá už jen podpis a místo v dějepisných knihách." # todo: NEW TRANSLATION
 SAU_events.77.t: "Průlom v jednáních" # todo: NEW TRANSLATION
 SAU_events.79.a: "Zahájit jednání." # todo: NEW TRANSLATION
 SAU_events.79.b: "Není o čem jednat." # todo: NEW TRANSLATION
 SAU_events.79.d: "Z Washingtonu a Ammánu přichází zpráva, že Saúdská Arábie je připravena jednat o normalizaci otevřeně a na nejvyšší úrovni. Cena bude vysoká a jednání bude sledovat celý svět. Žádná arabská ruka tak velká však nikdy nebyla natažena." # todo: NEW TRANSLATION
 SAU_events.79.t: "Nabídka z Rijádu" # todo: NEW TRANSLATION
 SAU_events.8.a: "Podepsat obranný pakt." # todo: NEW TRANSLATION
 SAU_events.8.b: "Odmítnout pakt." # todo: NEW TRANSLATION
 SAU_events.8.d: "Saúdská Arábie navrhuje vzájemný obranný pakt s Pákistánem, zatímco napětí na Blízkém východě sílí. Dohoda by zahrnovala záruky a vojenský přístup pro obě země." # todo: NEW TRANSLATION
 SAU_events.8.t: "[SAU.GetFlag] Saúdsko-pákistánský obranný pakt [PAK.GetFlag]" # todo: NEW TRANSLATION
 SAU_events.80.a: "Nemyslitelné má svůj termín." # todo: NEW TRANSLATION
 SAU_events.80.d: "Rijád a Tel Aviv to potvrdily: byla zahájena formální jednání o normalizaci vztahů. Delegace jsou již ve vzduchu. Každé kancléřství na Zemi přehodnocuje své předpoklady o Blízkém východě a každý odpůrce dohody spouští vlastní odpočet." # todo: NEW TRANSLATION
 SAU_events.80.t: "Saúdsko-izraelská jednání začínají" # todo: NEW TRANSLATION
 SAU_events.81.a: "Jejich odmítnutí je jejich odpovědí." # todo: NEW TRANSLATION
 SAU_events.81.d: "Tel Aviv odmítl dokonce i zahájit jednání. Nabídka je mrtvá ještě před příjezdem a ruka Království, natažená před zraky celého světa, zůstává viset ve vzduchu. V této generaci k žádné dohodě nedojde." # todo: NEW TRANSLATION
 SAU_events.81.t: "Izrael odmítá jednání" # todo: NEW TRANSLATION
 SAU_events.82.a: "Budoucnost postavená z betonu a skla." # todo: NEW TRANSLATION
 SAU_events.82.d: "Termín nadešel a Království navzdory všem předpovědím svůj úkol splnilo. NEOM září u Rudého moře, Rijád byl přebudován a turisté přijíždějí tam, kde kdysi stály jen ropné věže. Saúdská Arábie si koupila budoucnost, která neběží na ropě." # todo: NEW TRANSLATION
 SAU_events.82.t: "Vize 2030 naplněna" # todo: NEW TRANSLATION
 SAU_events.83.a: "Sliby se naplnily." # todo: NEW TRANSLATION
 SAU_events.83.d: "Je rok 2030 a Vize je z větší části nepostavena. Napůl dokončené věže rezivějí v poušti, slibovaná města zejí prázdnotou a stovky miliard, které byly utraceny, nepřinesly téměř nic. Kritici, kteří ji označovali za fantazii, slaví své vítězství a lidé naslouchají." # todo: NEW TRANSLATION
 SAU_events.83.t: "Bílí sloni" # todo: NEW TRANSLATION
 SAU_events.84.a: "Odepsat to." # todo: NEW TRANSLATION
 SAU_events.84.d: "Další z vlajkových projektů Vize překročil svůj termín a zůstal nedokončený. Dodavatelé dostali zaplaceno, jeřáby mizí a tisk má svůj titulek. Kapitál prchá a pochybnosti se šíří o něco dál." # todo: NEW TRANSLATION
 SAU_events.84.t: "Projekt nestihl termín" # todo: NEW TRANSLATION
 SAU_events.88.a: "Nástupnictví je již zpochybněno" # todo: NEW TRANSLATION
 SAU_events.88.d: "Král Fahd bin Abdulaziz Al-Saud je mrtev. Před deseti lety ho ranila mrtvice, vládl jménem, zatímco jeho nevlastní bratr Abdalláh působil jako regent, a nyní Abdalláh nastupuje na trůn vlastním právem. Abdalláhovi je však již přes osmdesát a v celém madžlisu rodu Saúdů princové už zvažují, kdo po něm nastoupí.\n\n§YSoutěž o nástupnictví krále Abdalláha nyní začíná. Viz rozhodnutí o korunním princi.§!" # todo: NEW TRANSLATION
 SAU_events.88.t: "Smrt krále Fahda" # todo: NEW TRANSLATION
 SAU_events.89.a: "Koruna přechází" # todo: NEW TRANSLATION
 SAU_events.89.d: "Král Abdalláh bin Abdulaziz Al-Saud je mrtev. Po deset let princové rodu Saúdů zvažovali a vyjednávali o tom, kdo po něm nastoupí. Tato otázka už nemůže čekat a princ s největším podílem vlivu bude prohlášen králem.\n\n§Salman bin Abdulaziz:§! [?SAU_salman_share|0]%\n§Mohammed bin Nayef:§! [?SAU_mbn_share|0]%\n§Mutaib bin Abdullah:§! [?SAU_mutaib_share|0]%" # todo: NEW TRANSLATION
 SAU_events.89.t: "Smrt krále Abdalláha" # todo: NEW TRANSLATION
 SAU_events.9.a: "Přijmout partnerství." # todo: NEW TRANSLATION
 SAU_events.9.b: "Odmítnout nabídku." # todo: NEW TRANSLATION
 SAU_events.9.d: "Saúdská Arábie navrhuje strategické investiční partnerství s Čínou. Dohoda by rozšířila čínské infrastrukturní projekty a posílila pozici Pekingu v Perském zálivu." # todo: NEW TRANSLATION
 SAU_events.9.t: "[SAU.GetFlag] Saúdsko-čínské strategické partnerství [CHI.GetFlag]" # todo: NEW TRANSLATION
 SAU_events.90.a: "Stát za korunou" # todo: NEW TRANSLATION
 SAU_events.90.b: "Zrušit Království" # todo: NEW TRANSLATION
 SAU_events.90.d: "Horečka zachvacující arabský svět překročila hranice Království. Davy plní ulice Východní provincie a města Hidžázu a požadují konec absolutní vlády. Mutaween váhají, Národní garda čeká na rozkazy a rod Saúdů se musí rozhodnout, zda lidem odpoví silou, nebo nechá starý řád padnout." # todo: NEW TRANSLATION
 SAU_events.90.t: "Arabské jaro dosahuje Království" # todo: NEW TRANSLATION
 SAU_events.91.a: "Uzavřít ji nyní" # todo: NEW TRANSLATION
 SAU_events.91.b: "Držet ji jako páku" # todo: NEW TRANSLATION
 SAU_events.91.b.tt: "Rozhodnutí §YBlokáda průlivu§! zůstane dostupné, aby bylo možné průliv uzavřít v okamžiku, který si zvolíte." # todo: NEW TRANSLATION
 SAU_events.91.d: "Válka dorazila do Zálivu. Naše raketové baterie a rychlé útočné čluny jsou připraveny podél Hormuzského průlivu, tepny, kterou musí procházet pětina světové ropy. Můžeme jej nyní uzavřít a srazit světovou ekonomiku na kolena, nebo hrozbu držet nad našimi nepřáteli a uzavřít jej v okamžiku, který si zvolíme." # todo: NEW TRANSLATION
 SAU_events.91.t: "Uzavřít Hormuzský průliv?" # todo: NEW TRANSLATION
 SAU_events.92.a: "Vyhlásit Islámskou republiku" # todo: NEW TRANSLATION
 SAU_events.92.b: "Ponechat Arabskou republiku" # todo: NEW TRANSLATION
 SAU_events.92.d: "S rostoucím vlivem šíitského hnutí musí ustavující shromáždění rozhodnout, jakým státem republika bude: Islámskou republikou založenou na náboženské autoritě, nebo sekulární Arabskou republikou." # todo: NEW TRANSLATION
 SAU_events.92.t: "Charakter republiky" # todo: NEW TRANSLATION
 SAU_events.93.a: "Připojit se k íránské Ose odporu" # todo: NEW TRANSLATION
 SAU_events.93.b: "Vytvořit nezávislou antiimperialistickou frontu" # todo: NEW TRANSLATION
 SAU_events.93.d: "Teherán podává nové šíitské republice ruku. Tvrdá linie musí rozhodnout: zaujmout místo v íránské Ose odporu pod vedením Nejvyššího vůdce, nebo vytvořit nezávislou frontu, která se nezodpovídá žádnému zahraničnímu hlavnímu městu." # todo: NEW TRANSLATION
 SAU_events.93.t: "Osa odporu" # todo: NEW TRANSLATION
 SAU_events.94.a: "Připojit se k frontě" # todo: NEW TRANSLATION
 SAU_events.94.b: "Odmítnout pozvání" # todo: NEW TRANSLATION
 SAU_events.94.d: "Arabská republika vztyčuje proti Ose odporu konkurenční prapor a vyzývá náš národ, aby se rozešel s Teheránem a připojil se k nezávislé frontě vedené z Rijádu." # todo: NEW TRANSLATION
 SAU_events.94.t: "Pozvání z Arábie" # todo: NEW TRANSLATION
 SAU_events.95.a: "Připojit se k Arabskému Kominternu" # todo: NEW TRANSLATION
 SAU_events.95.b: "Zůstat stranou" # todo: NEW TRANSLATION
 SAU_events.95.d: "Rudá Arábie vyzývá dělníky a revolucionáře arabského světa, aby se sjednotili pod jediným praporem." # todo: NEW TRANSLATION
 SAU_events.95.t: "Arabský Komintern" # todo: NEW TRANSLATION
 SAU_events.96.a: "Vychází rudý úsvit" # todo: NEW TRANSLATION
 SAU_events.96.d: "Rudá vlajka vlaje nad Rijádem. Rod Saúdů je smeten a je vyhlášena Lidová republika Arábie, která přísahá rozšířit revoluci po celém arabském světě." # todo: NEW TRANSLATION
 SAU_events.96.t: "Lidová republika Arábie" # todo: NEW TRANSLATION
 SAU_events.97.a: "Tak bylo vyhlášeno" # todo: NEW TRANSLATION
 SAU_events.97.d: "Ústavodárné shromáždění vyhlásilo Islámskou republiku Arábie, založenou na poručnictví právníka a vládě věřících." # todo: NEW TRANSLATION
 SAU_events.97.t: "Islámská republika Arábie" # todo: NEW TRANSLATION
 SAU_events.98.a: "Nebezpečná roztržka" # todo: NEW TRANSLATION
 SAU_events.98.d: "Arábie se rozešla s Teheránem a odmítla íránský dohled, aby vedla vlastní antiimperialistickou frontu. Šíitský svět je rozdělen mezi dvě soupeřící centra odporu." # todo: NEW TRANSLATION
 SAU_events.98.t: "Rozkol v ose" # todo: NEW TRANSLATION
 SAU_events.99.a: "Za tohle ponesou odpovědnost" # todo: NEW TRANSLATION
 SAU_events.99.d: "Rijád se rozešel s Osou a odlákal naše spojence. Teherán se musí rozhodnout, jak odpovědět na tuto zradu odporu." # todo: NEW TRANSLATION
 SAU_events.99.t: "Saúdský rozkol" # todo: NEW TRANSLATION
