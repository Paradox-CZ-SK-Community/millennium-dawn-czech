 SAU_decree_salman_spark_park: "Energetický park krále Salmána" # todo: NEW TRANSLATION
 SAU_decree_salman_spark_park_desc: "Domácí výroba energetických zařízení získává více z každého ložiska a každého skladovacího areálu." # todo: NEW TRANSLATION
 SAU_div_construction: "§HDiverzifikace§! – stavebnictví a nemovitosti" # todo: NEW TRANSLATION
 SAU_div_construction_desc: "Stavebnictví a rozvoj nemovitostí se stávají významnými složkami saúdské neropné ekonomiky." # todo: NEW TRANSLATION
 SAU_div_defence: "§HDiverzifikace§! – obranný průmysl" # todo: NEW TRANSLATION
 SAU_div_defence_desc: "Domácí zbrojní průmysl udržuje výdaje na obranu uvnitř Království a buduje továrny i odbornost namísto pouhého nákupu." # todo: NEW TRANSLATION
 SAU_div_energy: "§HDiverzifikace§! – obnovitelná energie" # todo: NEW TRANSLATION
 SAU_div_energy_desc: "Velké solární projekty snižují domácí poptávku po energii vyráběné z ropy, takže více surové ropy zůstává na export a zvyšuje příjmy vlády." # todo: NEW TRANSLATION
 SAU_div_governance: "§HDiverzifikace§! – správa a právní stát" # todo: NEW TRANSLATION
 SAU_div_governance_desc: "Důslednější soudy a odpovědnější ministerstva zlepšují podnikatelské prostředí a usnadňují prosazování vládní politiky." # todo: NEW TRANSLATION
 SAU_div_logistics: "§HDiverzifikace§! – logistika a doprava" # todo: NEW TRANSLATION
 SAU_div_logistics_desc: "Investice do přístavů, železnic a dálnic posilují roli Saúdské Arábie v obchodu mezi Asií, Afrikou a Evropou." # todo: NEW TRANSLATION
 SAU_div_social: "§HDiverzifikace§! – sociální rozvoj" # todo: NEW TRANSLATION
 SAU_div_social_desc: "Školy, nemocnice a bydlení dávají obyčejným Saúdům podíl na nové ekonomice a důvod v ni věřit." # todo: NEW TRANSLATION
 SAU_div_tech: "§HDiverzifikace§! – technologie a inovace" # todo: NEW TRANSLATION
 SAU_div_tech_desc: "Výzkumné parky a kapitál pro začínající podniky pokládají základy saúdského technologického sektoru, který zaměstnává absolventy, jaké ropný průmysl nikdy nedokázal." # todo: NEW TRANSLATION
 SAU_div_tourism: "§HDiverzifikace§! – cestovní ruch a zábava" # todo: NEW TRANSLATION
 SAU_div_tourism_desc: "Letoviska, památky a zábavní čtvrti otevírají Království návštěvníkům, které kdysi odmítalo, a jejich peníze zde zůstávají." # todo: NEW TRANSLATION
 SAU_diversification: "§HHospodářská diverzifikace§!" # todo: NEW TRANSLATION
 SAU_diversification_desc: "Království rozvíjí §Lneropnou ekonomiku§!, aby snížilo svou zranitelnost vůči změnám cen ropy. Každý dokončený pilíř včetně správy, průmyslu, turismu, technologií, energetiky a sociálního rozvoje se zde objeví a §Gsnižuje závislost na ropě§!." # todo: NEW TRANSLATION
 SAU_diversification_tt: "[SAU_div_governance_loc][SAU_div_construction_loc][SAU_div_tourism_loc][SAU_div_logistics_loc][SAU_div_tech_loc][SAU_div_defence_loc][SAU_div_energy_loc][SAU_div_social_loc]" # todo: NEW TRANSLATION
 SAU_doctrine_american: "Doktrína: americké partnerství" # todo: NEW TRANSLATION
 SAU_doctrine_american_desc: "Cvičte s americkými silami, nakupujte americké vybavení a bojujte americkým způsobem. Nejschopnější cesta – za cenu závislosti a tiché domácí nespokojenosti.\n\n§G+10 %§! zisku armádních zkušeností\n§G+10 %§! zisku leteckých zkušeností\n§G+5 %§! organizace divizí\n§R-10 %§! zisku politické moci" # todo: NEW TRANSLATION
 SAU_doctrine_domestic: "Doktrína: domácí soběstačnost" # todo: NEW TRANSLATION
 SAU_doctrine_domestic_desc: "Vybudujte domácí obranný průmysl a sílu, která nebude nic dlužit zahraničním dodavatelům. Hrdá a soběstačná, byť o krok za špičkou.\n\n§G+10 %§! produkce zbrojních továren\n§G+5 %§! rychlosti obnovy divizí\n§R-5 %§! zisku armádních zkušeností" # todo: NEW TRANSLATION
 SAU_doctrine_gcc: "Doktrína: kolektivní obrana GCC" # todo: NEW TRANSLATION
 SAU_doctrine_gcc_desc: "Ukotvěte obranu Království v Radě pro spolupráci v Zálivu a v Silách štítu poloostrova. Mohutná na domácí půdě, ale při útoku svázaná výbory a opatrností.\n\n§G+15 %§! obrany divizí na území jádra\n§G+5 %§! rekrutovatelné populace\n§R-5 %§! útoku divizí" # todo: NEW TRANSLATION
 SAU_doctrine_nato: "Doktrína: profesionalita NATO" # todo: NEW TRANSLATION
 SAU_doctrine_nato_desc: "Přijměte standardy NATO: profesionální důstojnický sbor, plánování kombinovaných zbraní a důslednou štábní práci. Vynikající velení a řízení – ale nákladná síla na udržování.\n\n§G+10 %§! rychlosti plánování\n§G+10 %§! maximálního plánování\n§G+5 %§! organizace divizí\n§R+5 %§! spotřeby spotřebního zboží" # todo: NEW TRANSLATION
 SAU_eco_bureau_bad: "§RSaúdská ekonomika§! – byrokratická zátěž" # todo: NEW TRANSLATION
 SAU_eco_bureau_bad_desc: "Saúdské podniky čelí pomalému licencování, překrývajícím se schválením a rozsáhlému klientelismu. Tyto byrokratické překážky snižují hodnotu veřejných investic." # todo: NEW TRANSLATION
 SAU_eco_bureau_good: "§GSaúdská ekonomika§! – zefektivněný stát" # todo: NEW TRANSLATION
 SAU_eco_bureau_good_desc: "Povolení během dnů namísto let. Zefektivněný stát umožňuje saúdskému podnikání postupovat tempem trhu." # todo: NEW TRANSLATION
 SAU_eco_capital_bad: "§RSaúdská ekonomika§! – únik kapitálu" # todo: NEW TRANSLATION
 SAU_eco_capital_bad_desc: "Saúdské soukromé bohatství leží v Londýně, Ženevě a New Yorku. Nejbohatší muži Království investují všude, jen ne doma." # todo: NEW TRANSLATION
 SAU_eco_capital_good: "§GSaúdská ekonomika§! – národní kapitál" # todo: NEW TRANSLATION
 SAU_eco_capital_good_desc: "Saúdský kapitál zůstává v Království a pracuje zde, financuje továrny a podniky místo zahraničních penthousů." # todo: NEW TRANSLATION
 SAU_eco_diversify_bad: "§RSaúdská ekonomika§! – rentiérský stát" # todo: NEW TRANSLATION
 SAU_eco_diversify_bad_desc: "Vláda závisí na příjmech z ropy, zatímco mnoho občanů závisí na státním zaměstnání a dávkách. Změny ceny jediné komodity proto ovlivňují celou ekonomiku." # todo: NEW TRANSLATION
 SAU_eco_diversify_good: "§GSaúdská ekonomika§! – diverzifikovaná" # todo: NEW TRANSLATION
 SAU_eco_diversify_good_desc: "Cestovní ruch, průmysl, logistika a finance nyní vedle ropného barelu nesou skutečnou váhu. Příjem Království již nezávisí na jediné ceně." # todo: NEW TRANSLATION
 SAU_eco_industry_bad: "§RSaúdská ekonomika§! – závislost na dovozu" # todo: NEW TRANSLATION
 SAU_eco_industry_bad_desc: "Téměř vše na saúdském regálu připlouvá lodí. Mimo ropný sektor Království vyrábí jen málo z toho, co spotřebovává." # todo: NEW TRANSLATION
 SAU_eco_industry_good: "§GSaúdská ekonomika§! – domácí průmysl" # todo: NEW TRANSLATION
 SAU_eco_industry_good_desc: "Saúdské továrny nyní dodávají to, co Království dříve dováželo, a obchodní bilance to ukazuje." # todo: NEW TRANSLATION
 SAU_eco_labour_bad: "§RSaúdská ekonomika§! – práce přistěhovalců" # todo: NEW TRANSLATION
 SAU_eco_labour_bad_desc: "Miliony přistěhovalců vykonávají práci Království, zatímco mladí Saúdové čekají na státní sinekury, které již neexistují." # todo: NEW TRANSLATION
 SAU_eco_labour_good: "§GSaúdská ekonomika§! – saúdská pracovní síla" # todo: NEW TRANSLATION
 SAU_eco_labour_good_desc: "Saúdové obsazují saúdská pracovní místa od výrobní haly po ředitelské křeslo. Výplatní listina zůstává v Království." # todo: NEW TRANSLATION
 SAU_econ_industry_first: "§HHospodářský model§! – nejprve průmysl" # todo: NEW TRANSLATION
 SAU_econ_industry_first_desc: "Království dává přednost oceli, hutnictví, zpracování a dalším těžkým průmyslům. To zvyšuje průmyslovou produkci, ale vyžaduje více spotřebního zboží a pracovní síly." # todo: NEW TRANSLATION
 SAU_econ_mixed: "§HHospodářský model§! – smíšená cesta" # todo: NEW TRANSLATION
 SAU_econ_mixed_desc: "Království rozvíjí průmysl a služby současně. Růst je méně soustředěný než při strategii jediného sektoru, takže ekonomika je odolnější." # todo: NEW TRANSLATION
 SAU_econ_services: "§HHospodářský model§! – nejprve služby" # todo: NEW TRANSLATION
 SAU_econ_services_desc: "Království upřednostňuje bankovnictví, logistiku, finance a cestovní ruch jako zdroje kvalifikovaného zaměstnání pro Saúdy. To zlepšuje znalostní ekonomiku, ale poskytuje menší průmyslovou kapacitu." # todo: NEW TRANSLATION
 SAU_economic_cities: "Iniciativa hospodářských měst" # todo: NEW TRANSLATION
 SAU_economic_cities_desc: "Hospodářské město krále Abdalláha a další plánovaná městská centra přitahují investice do kanceláří, průmyslu a služeb. Tato účelově vybudovaná města slouží jako motory neropného hospodářského růstu." # todo: NEW TRANSLATION
 SAU_economy: "§HSaúdská ekonomika§!" # todo: NEW TRANSLATION
 SAU_economy_desc: "Saúdská ekonomika roku 2000: §Lbohatá na ropu, ale nediverzifikovaná§!, zatížená únikem kapitálu, závislostí na dovozu, byrokratickou zátěží, závislostí na přistěhovalecké práci a závislostí na jediné komoditě. Každý fokus v §Hhospodářském stromu§! napravuje jednu slabinu a buduje průmyslovou základnu SABIC. Dokončete strom a §Rtěžký debuff§! se promění v §Gvyváženou, diverzifikovanou ekonomiku§!.\n\n§YNíže: každý hospodářský podsystém, červený, pokud je stále rozbitý, zelený po reformě.§!" # todo: NEW TRANSLATION
 SAU_economy_tt: "[SAU_eco_capital_loc][SAU_eco_industry_loc][SAU_eco_bureau_loc][SAU_eco_labour_loc][SAU_eco_diversify_loc][SAU_eco_model_loc][SAU_eco_cities_loc]" # todo: NEW TRANSLATION
 SAU_faisalite_balanced: "Faisalova rovnováha" # todo: NEW TRANSLATION
 SAU_faisalite_balanced_desc: "Království spojuje domácí soběstačnost s omezeným zapojením v zahraničí, aniž by z jednoho přístupu učinilo pevnou doktrínu. Udržovat tuto rovnováhu je s rostoucími zahraničními závazky stále obtížnější." # todo: NEW TRANSLATION
 SAU_faisalite_closed_schools: "Školy jsou zavřené" # todo: NEW TRANSLATION
 SAU_faisalite_closed_schools_desc: "Zahraniční osnovy zmizely a nic zatím nebylo sepsáno, aby je nahradilo. Jedna generace kvůli této mezeře přijde o několik let." # todo: NEW TRANSLATION
 SAU_faisalite_conviction_decided: "Faisalistický kruh: rozhodnuto" # todo: NEW TRANSLATION
 SAU_faisalite_conviction_dormant: "Faisalistický kruh: spící" # todo: NEW TRANSLATION
 SAU_faisalite_conviction_gathering: "Faisalistický kruh: shromažďuje se" # todo: NEW TRANSLATION
 SAU_faisalite_conviction_insistent: "Faisalistický kruh: naléhavý" # todo: NEW TRANSLATION
 SAU_faisalite_conviction_stirring: "Faisalistický kruh: probouzející se" # todo: NEW TRANSLATION
 SAU_faisalite_creditor_of_the_ummah: "Věřitel ummy" # todo: NEW TRANSLATION
 SAU_faisalite_creditor_of_the_ummah_desc: "Dlouhodobé saúdské půjčky muslimským zemím dávají Rijádu vliv na dlužnické vlády. Odklad splátek posiluje jejich krátkodobou závislost a dobrou vůli." # todo: NEW TRANSLATION
 SAU_faisalite_foreign_endowments: "Nadace v zahraničí" # todo: NEW TRANSLATION
 SAU_faisalite_foreign_endowments_desc: "Saúdské peníze financují katedry a knihovny na tuctu zahraničních univerzit a saúdští studenti do nich vstupují bez překážek." # todo: NEW TRANSLATION
 SAU_faisalite_import_rationing: "Příděly dovozu" # todo: NEW TRANSLATION
 SAU_faisalite_import_rationing_desc: "Licence se vydávají střídmě a před ministerstvem se tvoří fronty. Co Království nemůže koupit, musí najít doma – a nachází toho podstatně více, než čekalo." # todo: NEW TRANSLATION
 SAU_faisalite_interventionist_dominant: "§RIntervencionismus na vzestupu§!" # todo: NEW TRANSLATION
 SAU_faisalite_interventionist_dominant_desc: "Summity, dotace a vojenští poradci učinili ze Saúdské Arábie ústřední mocnost muslimského světa. Tento vliv zároveň činí Království odpovědným za nákladné spory za jeho hranicemi." # todo: NEW TRANSLATION
 SAU_faisalite_interventionist_leaning: "§RSměřování k intervencionismu§!" # todo: NEW TRANSLATION
 SAU_faisalite_interventionist_leaning_desc: "Království opět utrácí v zahraničí a je za to slyšet. Faisal by směr poznal, i když zatím ne rozsah." # todo: NEW TRANSLATION
 SAU_faisalite_isolationist_dominant: "§OIzolacionismus na vzestupu§!" # todo: NEW TRANSLATION
 SAU_faisalite_isolationist_dominant_desc: "Saúdská Arábie se uzavřela před většinou zahraničního vlivu a závazků. Zachovává si tím nezávislost, ale omezuje přístup k vnějším znalostem a zůstává diplomaticky izolovaná." # todo: NEW TRANSLATION
 SAU_faisalite_isolationist_leaning: "§OSměřování k izolacionismu§!" # todo: NEW TRANSLATION
 SAU_faisalite_isolationist_leaning_desc: "Království se uzavírá. Méně cizích rukou, méně zahraničních závazků a diplomatický sbor, který má stále méně práce." # todo: NEW TRANSLATION
 SAU_faisalite_labour_shortage: "Nedostatek pracovních sil" # todo: NEW TRANSLATION
 SAU_faisalite_labour_shortage_desc: "Polovina lešení v Království zeje prázdnotou. Muži, kteří je drželi, odešli domů, a ti, kteří je měli nahradit, nedorazili." # todo: NEW TRANSLATION
 SAU_faisalite_nationalised_management: "Znárodněné řízení" # todo: NEW TRANSLATION
 SAU_faisalite_nationalised_management_desc: "Zahraniční manažeři jsou pryč a jejich nástupci se práci učí za pochodu. Továrny stále fungují, svým způsobem." # todo: NEW TRANSLATION
 SAU_faisalite_officers_abroad: "Důstojnický sbor v zahraničí" # todo: NEW TRANSLATION
 SAU_faisalite_officers_abroad_desc: "Nejlepší štábní důstojníci radí armádám někoho jiného. Jejich vlastní jednotky si nepřítomnosti všímají." # todo: NEW TRANSLATION
 SAU_faisalite_street_movement: "Ulice si pamatují Faisala" # todo: NEW TRANSLATION
 SAU_faisalite_street_movement_desc: "Lidové hnutí představuje krále Faisala jako vzor saúdské nezávislosti a zdůrazňuje ropné embargo a jeho odpor vůči západnímu tlaku. Jeho zjednodušený výklad vlády se rozšířil z mešit na univerzitní kampusy a nyní podporuje organizované opoziční hnutí." # todo: NEW TRANSLATION
 SAU_forces_modernized: "Modernizované ozbrojené síly" # todo: NEW TRANSLATION
 SAU_forces_modernized_desc: "Plně moderní profesionální armáda – rovnocenná kterékoli v regionu a skutečná protiváha Íránu." # todo: NEW TRANSLATION
 SAU_forces_modernizing: "Modernizující se síly" # todo: NEW TRANSLATION
 SAU_forces_modernizing_desc: "Výcvik, doktrína a vybavení dohánějí západní standardy. Síly se nyní vyrovnají svým sousedům." # todo: NEW TRANSLATION
 SAU_forces_reforming: "Síly v reformě" # todo: NEW TRANSLATION
 SAU_forces_reforming_desc: "První reformy se ujímají a nejhorší staré slabiny ustupují. Pokračujte v modernizaci." # todo: NEW TRANSLATION
 SAU_forces_unmodernized: "Nemodernizované ozbrojené síly" # todo: NEW TRANSLATION
 SAU_forces_unmodernized_desc: "Desetiletí závislosti na zahraničních dodavatelích a zastaralá doktrína zanechaly ozbrojené síly nepřipravené. K jejich postupné reformě použijte rozhodnutí §YModernizovat ozbrojené síly§!." # todo: NEW TRANSLATION
 SAU_fortified_kingdom: "Pevnost Arábie" # todo: NEW TRANSLATION
 SAU_fortified_kingdom_desc: "Zodolněné základny, vrstvená protivzdušná obrana a pobřežní posádky zlepšují schopnost Saúdské Arábie odolat íránskému útoku." # todo: NEW TRANSLATION
 SAU_french_investment_pact_FRA: "Saúdsko-francouzský investiční pakt" # todo: NEW TRANSLATION
 SAU_french_investment_pact_FRA_desc: "Státem podporovaný pakt otevírá saúdské trhy francouzskému průmyslu a přivádí kapitál ze Zálivu do Francie." # todo: NEW TRANSLATION
 SAU_grievance_bitter: "Důstojnický sbor: zahořklý" # todo: NEW TRANSLATION
 SAU_grievance_brink: "Důstojnický sbor: na pokraji" # todo: NEW TRANSLATION
 SAU_grievance_contained: "Důstojnický sbor: pod kontrolou" # todo: NEW TRANSLATION
 SAU_grievance_mutinous: "Důstojnický sbor: vzbouřený" # todo: NEW TRANSLATION
 SAU_grievance_restive: "Důstojnický sbor: neklidný" # todo: NEW TRANSLATION
 SAU_guardian_of_palestine: "Strážce Palestiny" # todo: NEW TRANSLATION
 SAU_guardian_of_palestine_desc: "Podporou palestinské věci si Království získalo uznání v celém muslimském světě a dodalo trůnu legitimitu doma i v zahraničí." # todo: NEW TRANSLATION
 SAU_gulf_war_lessons: "Poučení z války v Zálivu" # todo: NEW TRANSLATION
 SAU_gulf_war_lessons_desc: "Válka v Zálivu roku 1991 odhalila vážné slabiny saúdského vybavení, doktríny a velení. Generální štáb studuje konkurenční modely vojenské reformy, ale zatím žádný nevybral.\n\n§G+5 %§! zisku armádních zkušeností\n§G+5 %§! rychlosti plánování\n\n§YSpusťte rozhodnutí „Válečné hry: Poučení ze Zálivu“ a zvolte doktrínu.§!" # todo: NEW TRANSLATION
 SAU_hajj_management_01: "Strážce dvou svatých mešit" # todo: NEW TRANSLATION
 SAU_hajj_management_01_desc: "Jako strážce Mekky a Medíny saúdská vláda dohlíží na každoroční pouť hadždž a každoročně vítá přibližně dva miliony muslimů z celého světa. Pouť vytváří značné příjmy z cestovního ruchu, dopravy a pohostinství a zároveň Království poskytuje bezkonkurenční náboženskou prestiž v celém muslimském světě." # todo: NEW TRANSLATION
 SAU_hormuz_shield: "Hormuzský štít" # todo: NEW TRANSLATION
 SAU_hormuz_shield_desc: "Saúdské námořní eskorty chrání tankery proplouvající Hormuzským průlivem a omezují schopnost Íránu narušovat přepravu ropy." # todo: NEW TRANSLATION
 SAU_IMEC_india_deal_new: "Koridor IMEC" # todo: NEW TRANSLATION
 SAU_IMEC_india_deal_new_desc: "Koridor Indie–Blízký východ–Evropa vede indický obchod přes saúdské přístavy a železnice. Království vybírá mýtné na nové Hedvábné stezce." # todo: NEW TRANSLATION
 SAU_IMEC_india_deal_new_loc: "\n§H[RAJ.GetFlag] Hospodářský koridor Indie–Blízký východ–Evropa§! (IMEC) [SAU.GetFlag]\nRychlost výstavby: §G+5,00 %§!\nZisk paliva z fosilních paliv: §G+3,00 %§!\n§HMultiplikátor příjmů z exportu zdrojů§!: §G+1,50 %§!\n" # todo: NEW TRANSLATION
 SAU_India_one_IMEC_india_deal: "[RAJ.GetFlag] §H Hospodářský koridor Indie–Blízký východ–Evropa§![SAU.GetFlag] (IMEC)" # todo: NEW TRANSLATION
 SAU_India_one_IMEC_india_deal_desc: "Hospodářský koridor Indie–Blízký východ–Evropa spojuje indické přístavy přes Perský záliv s evropskými trhy po železnici a po moři. Indie stojí u východní brány koridoru a profituje z každé zásilky." # todo: NEW TRANSLATION
 SAU_iraq_border_defense: "Obrana severní hranice" # todo: NEW TRANSLATION
 SAU_iraq_border_defense_desc: "Armáda je zakopána podél irácké hranice a připravena na opakování roku 1990. +10 % obrany proti Iráku. Odstraní se po pádu Saddáma." # todo: NEW TRANSLATION
 SAU_iraq_pipeline_t1: "Evropský ropovod (úroveň I)" # todo: NEW TRANSLATION
 SAU_iraq_pipeline_t1_desc: "Saúdská ropa proudí na sever přes Irák směrem k Turecku a evropskému trhu, který Moskva tak žárlivě střeží. §GPříjem navíc: 2,25 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 1,00 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+1,25 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_iraq_pipeline_t2: "Evropský ropovod (úroveň II)" # todo: NEW TRANSLATION
 SAU_iraq_pipeline_t2_desc: "Saúdská ropa proudí na sever přes Irák směrem k Turecku a evropskému trhu, který Moskva tak žárlivě střeží. §GPříjem navíc: 2,75 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 1,15 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+1,60 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_iraq_pipeline_t3: "Evropský ropovod (úroveň III)" # todo: NEW TRANSLATION
 SAU_iraq_pipeline_t3_desc: "Saúdská ropa proudí na sever přes Irák směrem k Turecku a evropskému trhu, který Moskva tak žárlivě střeží. §GPříjem navíc: 3,25 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 1,25 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+2,00 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_islamic_leadership: "Vůdce islámského světa" # todo: NEW TRANSLATION
 SAU_islamic_leadership_desc: "Saúdská správa Mekky a Medíny a její role na významných islámských summitech poskytují Rijádu značný vliv v celém muslimském světě." # todo: NEW TRANSLATION
 SAU_israel_tech_partnership: "Křemík a písek" # todo: NEW TRANSLATION
 SAU_israel_tech_partnership_desc: "Rijádské dohody kombinují saúdské investice s izraelskými technologiemi a podporují společný výzkum v obou zemích." # todo: NEW TRANSLATION
 SAU_junta_accepted: "Rada: přijata" # todo: NEW TRANSLATION
 SAU_junta_contested: "Rada: zpochybňována" # todo: NEW TRANSLATION
 SAU_junta_illegitimate: "Rada: nelegitimní" # todo: NEW TRANSLATION
 SAU_junta_rejected: "Rada: odmítnuta" # todo: NEW TRANSLATION
 SAU_junta_tolerated: "Rada: tolerována" # todo: NEW TRANSLATION
 SAU_laf_offensive: "Operace Cedrové odhodlání" # todo: NEW TRANSLATION
 SAU_laf_offensive_desc: "Saúdské financování a vybavení zvýšily schopnost a ochotu libanonské armády provádět útočné operace proti Hizballáhu." # todo: NEW TRANSLATION
 SAU_national_water_pride_minus1: "§HSuverénní vody§! – §Ypochybné§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_minus1_desc: "Při stabilitě 35–44 % slábne veřejná důvěra v §Lsaúdský vodohospodářský program§!. To způsobuje §Ymalou ztrátu legitimity§! dynastie." # todo: NEW TRANSLATION
 SAU_national_water_pride_minus2: "§HSuverénní vody§! – §Rnapjaté§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_minus2_desc: "Nízká stabilita zvýšila soukromou kritiku §Lnárodního vodohospodářského programu§!. Jeho špatná výkonnost poškozuje pověst dynastie." # todo: NEW TRANSLATION
 SAU_national_water_pride_minus3: "§HSuverénní vody§! – §Rselhávající§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_minus3_desc: "Vodohospodářský program se stal významným příkladem špatné správy vlády. Pokračující nedostatky způsobují §Rvážnou ztrátu podpory§! dynastie." # todo: NEW TRANSLATION
 SAU_national_water_pride_minus4: "§HSuverénní vody§! – §Rkatastrofální§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_minus4_desc: "V podmínkách §Rextrémní nestability§! nedostatek vody vážně poškodil legitimitu §Hrodu al-Saud§!. Tento postih skončí pouze obnovením stability nebo pádem dynastie." # todo: NEW TRANSLATION
 SAU_national_water_pride_neutral: "§HSuverénní vody§! – §Ystabilní§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_neutral_desc: "Při přibližně 50% stabilitě nepřináší národní vodohospodářský program politický prospěch ani postih. Změna stability jej posune do kladné nebo záporné úrovně." # todo: NEW TRANSLATION
 SAU_national_water_pride_plus1: "§HSuverénní vody§! – §Guspokojivé§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_plus1_desc: "Dostatečná stabilita a spolehlivé zásobování vodou zachovávají pověst dynastie a poskytují §Gskromný§! politický prospěch." # todo: NEW TRANSLATION
 SAU_national_water_pride_plus2: "§HSuverénní vody§! – §Gprosperující§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_plus2_desc: "Silná stabilita a spolehlivý provoz §Lsaúdského§! odsolovacího systému dokazují schopnost vlády a zlepšují respekt k §Hrodu al-Saud§!." # todo: NEW TRANSLATION
 SAU_national_water_pride_plus3: "§HSuverénní vody§! – §Gsebevědomé§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_plus3_desc: "Vysoká stabilita učinila z národního vodohospodářského programu §Hzdroj domácí prestiže§!. Poptávka po odbornosti §LKAUST§! v zahraničí a finanční návratnost programu poskytují další výhody." # todo: NEW TRANSLATION
 SAU_national_water_pride_plus4: "§HSuverénní vody§! – §Gvítězné§!" # todo: NEW TRANSLATION
 SAU_national_water_pride_plus4_desc: "Při nejvyšší úrovni stability je §Lsaúdský§! vodohospodářský program široce považován za významný národní úspěch. Jeho úspěch poskytuje §Hrodu al-Saud§! maximální legitimizační prospěch z programu." # todo: NEW TRANSLATION
 SAU_nda_free_press: "Svobodný tisk" # todo: NEW TRANSLATION
 SAU_nda_free_press_loc: "[SAU.GetFlag]Svobodný tisk\n§HZisk politické moci:§! §G+5,00 %§! \n§HObrana proti zahraničnímu vlivu:§! §G+20,00 %§!\n\n" # todo: NEW TRANSLATION
 SAU_nda_free_world: "Člen svobodného světa" # todo: NEW TRANSLATION
 SAU_nda_free_world_loc: "[SAU.GetFlag]Člen svobodného světa\n§HNázor na obchod:§! §G+15,00 %§!\n§HMěsíční zisk názoru:§! §G+20,00 %§!\n\n" # todo: NEW TRANSLATION
 SAU_nda_knowledge_economy: "Znalostní ekonomika" # todo: NEW TRANSLATION
 SAU_nda_knowledge_economy_loc: "[SAU.GetFlag]Znalostní ekonomika\n§HRychlost výzkumu:§! §G+5,00 %§!\n§HStabilita:§! §G+3,00 %§!\n\n" # todo: NEW TRANSLATION
 SAU_nda_open_market: "Otevřené trhy" # todo: NEW TRANSLATION
 SAU_nda_open_market_loc: "[SAU.GetFlag]Otevřené trhy\n§HSpotřební zboží:§! §G-10,00 %§!\n§HNáklady zahraničních investic:§! §G-5,00 %§!\n§HNávratnost investic:§! §G+5,00 %§!\n\n" # todo: NEW TRANSLATION
 SAU_neom_aqaba_zone: "Hospodářská zóna NEOM–Akaba" # todo: NEW TRANSLATION
 SAU_neom_aqaba_zone_desc: "Saúdské megaměsto NEOM a jordánský přístav Akaba fungují jako jediná přeshraniční hospodářská zóna, urychlují výstavbu a plní státní pokladnu." # todo: NEW TRANSLATION
 SAU_oil_defend_price_idea: "Bránit cenu" # todo: NEW TRANSLATION
 SAU_oil_defend_price_idea_desc: "Saúdská Arábie snížila produkci, aby podpořila světovou cenu ropy. To zvyšuje příjem za barel, ale obětuje tržní podíl producentům, kteří svou produkci udržují." # todo: NEW TRANSLATION
 SAU_oil_dependence_t1: "§GHospodářství ropy§! – diverzifikované" # todo: NEW TRANSLATION
 SAU_oil_dependence_t1_desc: "§HZávislost na ropě: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RAutomaticky se mění každé 3 měsíce§!\n\nModerní, diverzifikovaná ekonomika. Ropa je jedním z mnoha vývozních artiklů – Království je §Godolné§! vůči tomu, co se může stát s cenou surové ropy. Vize 2030 byla naplněna." # todo: NEW TRANSLATION
 SAU_oil_dependence_t2: "§YHospodářství ropy§! – široce založené" # todo: NEW TRANSLATION
 SAU_oil_dependence_t2_desc: "§HZávislost na ropě: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RAutomaticky se mění každé 3 měsíce§!\n\nPrůmysl, služby a technologie nyní nesou skutečnou váhu. Ropný šok lze přežít, není katastrofický." # todo: NEW TRANSLATION
 SAU_oil_dependence_t3: "§YHospodářství ropy§! – diverzifikující se" # todo: NEW TRANSLATION
 SAU_oil_dependence_t3_desc: "§HZávislost na ropě: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RAutomaticky se mění každé 3 měsíce§!\n\nEkonomika se rozšiřuje. Ropa zůstává největším pilířem, ale již není jediným důležitým." # todo: NEW TRANSLATION
 SAU_oil_dependence_t4: "§RHospodářství ropy§! – závislé na ropě" # todo: NEW TRANSLATION
 SAU_oil_dependence_t4_desc: "§HZávislost na ropě: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RAutomaticky se mění každé 3 měsíce§!\n\nNeropná odvětví rostou, ale surová ropa stále platí téměř za vše. Propad ceny by stále bolel – a hodně." # todo: NEW TRANSLATION
 SAU_oil_dependence_t5: "§RHospodářství ropy§! – úplný petrostát" # todo: NEW TRANSLATION
 SAU_oil_dependence_t5_desc: "§HZávislost na ropě: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RAutomaticky se mění každé 3 měsíce§!\n\nKrálovství žije a umírá s barelem. Ropa tvoří §Gtéměř celý§! rozpočet – nesmírně ziskový, ale §Rnebezpečně vystavený§! jakémukoli zhroucení světové ceny.\n§YZávislost na ropě se mění pouze prostřednictvím vašich fokusů a rozhodnutí – ropná rozhodnutí ji zvyšují, diverzifikace snižuje. Království začíná hluboce závislé; pouze trvalé reformy ji sníží a zůstane na úrovni, na které ji zanecháte.§!" # todo: NEW TRANSLATION
 SAU_oil_embargoed: "§RRopné embargo§!" # todo: NEW TRANSLATION
 SAU_oil_embargoed_desc: "Saúdská Arábie a její partneři v OPECu zastavili vývoz ropy. Dokud embargo neskončí, ekonomiku svírají fronty na palivo, uzavírání továren a prudce rostoucí ceny." # todo: NEW TRANSLATION
 SAU_oil_for_security_pact: "Ropa za bezpečnost" # todo: NEW TRANSLATION
 SAU_oil_for_security_pact_desc: "Království udržuje americké trhy zásobené ropou a Washington garantuje saúdskou bezpečnost. Ujednání ukotvuje rijál, dolar i rod Saudů." # todo: NEW TRANSLATION
 SAU_oil_for_security_pact_loc: "[USA.GetFlag]Ropa za bezpečnost\n§HMultiplikátor příjmů z vývozu fosilních paliv:§! §G+5,00 %§!\n" # todo: NEW TRANSLATION
 SAU_oil_for_security_pact_USA: "Ropa za bezpečnost" # todo: NEW TRANSLATION
 SAU_oil_for_security_pact_USA_desc: "Rijád zaručuje tok ropy na americké trhy: levné a spolehlivé palivo výměnou za americký bezpečnostní deštník." # todo: NEW TRANSLATION
 SAU_oil_market_share_idea: "Bránit tržní podíl" # todo: NEW TRANSLATION
 SAU_oil_market_share_idea_desc: "Saúdská Arábie udržuje vysokou produkci a přijímá nižší ceny, aby si zachovala podíl na ropném trhu. Nízké těžební náklady jí umožňují přečkat dražší producenty." # todo: NEW TRANSLATION
 SAU_oil_price_collapse_idea: "Kolaps ceny ropy" # todo: NEW TRANSLATION
 SAU_oil_price_collapse_idea_desc: "Ceny ropy jsou hluboko pod úrovní, s níž počítal státní rozpočet. Příjmy z vývozu klesly, zatímco výdaje na sociální zabezpečení zůstávají vysoké, a vláda musí čerpat z rezerv." # todo: NEW TRANSLATION
