 SAU_sp_arty_mass: "Dělostřelectvo: soustředěná palba" # todo: NEW TRANSLATION
 SAU_sp_arty_mass_desc: "Drtivé palebné přehrady, které rozemelou nepřítele bez ohledu na zásobování.\n§G+10 %§! útoku na území jádra\n§R+10 %§! spotřeby zásob" # todo: NEW TRANSLATION
 SAU_sp_arty_mobile: "Dělostřelectvo: vystřel a zmiz" # todo: NEW TRANSLATION
