 SAU_the_republic_endures: "Republika přetrvává" # todo: NEW TRANSLATION
 SAU_the_republic_endures_desc: "Prozatímní léta skončila. Šíitská republika nyní vládne prostřednictvím stálých institucí a občané ji musí přijmout jako trvalý stát Arábie." # todo: NEW TRANSLATION
 SAU_the_resistance: "Odpor" # todo: NEW TRANSLATION
 SAU_the_resistance_desc: "Shromážděte věrné k ozbrojenému boji v duchu Hizballáhu Hidžázu." # todo: NEW TRANSLATION
