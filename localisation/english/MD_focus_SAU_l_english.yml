 SAU_reconcile_with_the_republic: "Smířit se s republikou" # todo: NEW TRANSLATION
 SAU_reconcile_with_the_republic_desc: "Pohřběte staré křivdy a přijměte místo v národním rámci; vyměňte revoluci za zastoupení." # todo: NEW TRANSLATION
 SAU_guarantee_religious_freedom: "Zaručit náboženskou svobodu" # todo: NEW TRANSLATION
