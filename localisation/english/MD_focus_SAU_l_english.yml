 SAU_sp_awacs_groundlink: "AWACS: společné pozemní spojení" # todo: NEW TRANSLATION
 SAU_sp_awacs_groundlink_desc: "Obraz z výšky řídí armádu pod ním.\n§G+5 %§! útoku divizí\n§G+5 %§! rychlosti plánování\n§R-5 %§! zisku leteckých zkušeností" # todo: NEW TRANSLATION
 SAU_sp_combat_armor: "Bojové zbraně: obrněná pěst" # todo: NEW TRANSLATION
