 SAU_communist_state_2_tt: "[SAU_communist_state_1_loc][SAU_communist_state_2_loc][SAU_communist_state_3_loc][SAU_communist_state_4_loc][SAU_communist_state_5_loc]" # todo: NEW TRANSLATION
 SAU_Cooperation_West_East: "[USA.GetFlag] Spolupráce v rozděleném světě [CHI.GetFlag]" # todo: NEW TRANSLATION
 SAU_Cooperation_West_East_desc: "V rozděleném světě dvou hlavních bloků – ve východním světě stojícím na straně vzestupné supervelmoci [CHI.GetFlag] Číny a na západní straně vedené [USA.GetFlag] Amerikou v tomto světě a novém tisíciletí." # todo: NEW TRANSLATION
 SAU_Cooperation_West_East_tt: "[SAU_IMEC_india_deal_new_loc][SAU_OPEC_Russia_deal_new_loc]" # todo: NEW TRANSLATION
