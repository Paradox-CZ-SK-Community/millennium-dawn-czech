 SAU_events.316.c: "Námořnictvo: pobřežní obrana" # todo: NEW TRANSLATION
 SAU_events.316.desc: "Na jakém poslání má být postaveno Královské saúdské námořnictvo? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte na možnost kurzorem a zjistěte, co přesně poskytuje a stojí.§!" # todo: NEW TRANSLATION
