 SAU_events.318.b: "AWACS: společné pozemní spojení" # todo: NEW TRANSLATION
 SAU_events.318.c: "AWACS: síť včasného varování" # todo: NEW TRANSLATION
 SAU_events.318.desc: "Jak má flotila E-3 utvářet bitvu? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte na možnost kurzorem a zjistěte, co přesně poskytuje a stojí.§!" # todo: NEW TRANSLATION
