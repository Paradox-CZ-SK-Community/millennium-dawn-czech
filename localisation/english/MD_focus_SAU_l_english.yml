 SAU_sp_combat_infantry: "Bojové zbraně: profesionální pěchota" # todo: NEW TRANSLATION
 SAU_sp_combat_infantry_desc: "Zkušená, pevná profesionální pěchota udrží bojiště.\n§G+7,5 %§! obrany divizí\n§G+5 %§! organizace divizí\n§R-5 %§! útoku na území jádra" # todo: NEW TRANSLATION
 SAU_sp_fleet_bluewater: "Námořnictvo: ambice na oceánské loďstvo" # todo: NEW TRANSLATION
 SAU_sp_fleet_bluewater_desc: "Vydejte se za hranice Zálivu do otevřeného oceánu.\n§G+15 %§! dosahu námořnictva\n§G+5 %§! útoku velkých lodí\n§R-5 %§! námořní morálky" # todo: NEW TRANSLATION
 SAU_sp_fleet_coastal: "Námořnictvo: pobřežní obrana" # todo: NEW TRANSLATION
 SAU_sp_fleet_coastal_desc: "Zeď malých plavidel střežících každý přístav a útes.\n§G+5 %§! námořní morálky\n§G+10 %§! obrany eskortních lodí\n§R-5 %§! útoku velkých lodí" # todo: NEW TRANSLATION
 SAU_sp_fleet_gulf: "Námořnictvo: kontrola vod Zálivu" # todo: NEW TRANSLATION
 SAU_sp_fleet_gulf_desc: "Ovládněte těsné a přeplněné vody Perského zálivu.\n§G+10 %§! útoku eskortních lodí\n§G+5 %§! námořní koordinace\n§R-10 %§! dosahu námořnictva" # todo: NEW TRANSLATION
 SAU_sp_pgm_interdiction: "Přesně naváděná munice: izolace bojiště" # todo: NEW TRANSLATION
 SAU_sp_pgm_interdiction_desc: "Odřízněte nepřítele od týlu, než vůbec začne bojovat.\n§G+5 %§! organizace divizí\n§G+5 %§! útoku blízké letecké podpory\n§R+10 %§! ceny letecké doktríny" # todo: NEW TRANSLATION
 SAU_sp_pgm_sead: "Přesně naváděná munice: potlačení obrany" # todo: NEW TRANSLATION
 SAU_sp_pgm_sead_desc: "Nejprve oslepte a rozbijte nepřátelskou síť protivzdušné obrany.\n§G+7,5 %§! vzdušné převahy\n§G+5 %§! leteckého útoku\n§R-5 %§! obratnosti letadel" # todo: NEW TRANSLATION
 SAU_sp_pgm_strike: "Přesně naváděná munice: přesný úder" # todo: NEW TRANSLATION
 SAU_sp_pgm_strike_desc: "Chytré bomby, které srovnají cíl se zemí a zbytek ušetří.\n§G+10 %§! útoku blízké letecké podpory\n§G+5 %§! leteckého útoku\n§R+5 %§! spotřeby spotřebního zboží" # todo: NEW TRANSLATION
 SAU_sp_posture_deterrence: "Postoj: strategické odstrašení" # todo: NEW TRANSLATION
 SAU_sp_posture_deterrence_desc: "Vyvážený štít, který přiměje každého agresora dvakrát si rozmyslet útok.\n§G+5 %§! obrany divizí\n§G+5 %§! protivzdušné obrany\n§G+5 %§! stability\n§R-5 %§! útoku divizí" # todo: NEW TRANSLATION
 SAU_sp_posture_homeland: "Postoj: obrana vlasti" # todo: NEW TRANSLATION
 SAU_sp_posture_homeland_desc: "Vše je obráceno dovnitř, aby se Království stalo pevností.\n§G+10 %§! obrany území jádra\n§G+5 %§! maximálního opevnění\n§R-5 %§! rychlosti divizí" # todo: NEW TRANSLATION
 SAU_sp_posture_projection: "Postoj: projekce síly" # todo: NEW TRANSLATION
 SAU_sp_posture_projection_desc: "Armáda schopná dosáhnout daleko od domova a udeřit.\n§G+5 %§! rychlosti divizí\n§G+10 %§! dosahu námořnictva\n§G+5 %§! leteckého útoku\n§R+5 %§! spotřeby spotřebního zboží" # todo: NEW TRANSLATION
 SAU_sp_redflag_bvr: "Letectvo: za hranicí vizuálního dohledu" # todo: NEW TRANSLATION
 SAU_sp_redflag_bvr_desc: "Zabijte z dálky, než vás nepřítel vůbec spatří.\n§G+7,5 %§! leteckého útoku\n§G+5 %§! vzdušné převahy\n§R+10 %§! ceny letecké doktríny" # todo: NEW TRANSLATION
 SAU_sp_redflag_defensive: "Letectvo: doktrína protivzdušné obrany" # todo: NEW TRANSLATION
 SAU_sp_redflag_defensive_desc: "Přežít, vydržet a chránit oblohu nad Královstvím.\n§G+10 %§! protivzdušné obrany\n§G+5 %§! obratnosti letadel\n§R-5 %§! leteckého útoku" # todo: NEW TRANSLATION
 SAU_sp_redflag_dogfight: "Letectvo: mistrovství v soubojích" # todo: NEW TRANSLATION
 SAU_sp_redflag_dogfight_desc: "Otočit a spálit – ovládnout boj zblízka.\n§G+10 %§! obratnosti letadel\n§G+5 %§! leteckého útoku\n§R-5 %§! protivzdušné obrany" # todo: NEW TRANSLATION
 SAU_sp_reform_crash: "Reforma: šokový program" # todo: NEW TRANSLATION
 SAU_sp_reform_crash_desc: "Reformovat nyní, reformovat rychle – a k čertu s narušením.\n§G+10 %§! zisku armádních zkušeností\n§G+5 %§! organizace divizí\n§R-5 %§! stability" # todo: NEW TRANSLATION
 SAU_sp_reform_foreign: "Reforma: zahraniční dodavatelé" # todo: NEW TRANSLATION
 SAU_sp_reform_foreign_desc: "Najměte zahraniční odborníky, aby vše rychle a dobře provedli – za určitou cenu.\n§G-15 %§! doby výcviku armády\n§G+5 %§! zisku armádních zkušeností\n§R-5 %§! zisku politické moci" # todo: NEW TRANSLATION
 SAU_sp_reform_steady: "Reforma: metodické budování" # todo: NEW TRANSLATION
 SAU_sp_reform_steady_desc: "Trpělivá, spořádaná reforma, kterou armáda dokáže vstřebat.\n§G+5 %§! organizace divizí\n§G+5 %§! rychlosti obnovy divizí\n§R-3 %§! útoku divizí" # todo: NEW TRANSLATION
 SAU_sp_sang_regime: "Národní garda: stráž režimu" # todo: NEW TRANSLATION
 SAU_sp_sang_regime_desc: "Především a nakonec SANG chrání trůn a dvě svatá města.\n§G+10 %§! obrany území jádra\n§G+5 %§! stability\n§R-5 %§! útoku divizí" # todo: NEW TRANSLATION
 SAU_sp_sang_security: "Národní garda: vnitřní bezpečnost" # todo: NEW TRANSLATION
 SAU_sp_sang_security_desc: "Bdělá garda proti podvracení a nepokojům doma.\n§G-25 %§! nepřátelské podvratné aktivity\n§G+5 %§! stability\n§R-5 %§! podpory války" # todo: NEW TRANSLATION
 SAU_sp_sang_tribal: "Národní garda: kmenové odvody" # todo: NEW TRANSLATION
 SAU_sp_sang_tribal_desc: "Loajální kmenová pracovní síla rozšiřuje řady, i když ne jejich uhlazenost.\n§G+10 %§! rekrutovatelné populace\n§G+5 %§! rychlosti obnovy divizí\n§R-5 %§! organizace divizí" # todo: NEW TRANSLATION
 SAU_sp_sf_counterterror: "Speciální síly: boj proti teroru" # todo: NEW TRANSLATION
 SAU_sp_sf_counterterror_desc: "Malá, smrtící síla pro záchranu rukojmích a boj proti teroru.\n§G+10 %§! útoku speciálních sil\n§G+5 %§! obrany speciálních sil\n§R-3 %§! limitu speciálních sil" # todo: NEW TRANSLATION
 SAU_sp_sf_raiders: "Speciální síly: hluboké nájezdy" # todo: NEW TRANSLATION
 SAU_sp_sf_raiders_desc: "Více operátorů útočících hluboko, za cenu jejich odolnosti.\n§G+5 %§! limitu speciálních sil\n§G+7,5 %§! útoku speciálních sil\n§R-5 %§! obrany speciálních sil" # todo: NEW TRANSLATION
 SAU_sp_sf_recon: "Speciální síly: průzkum" # todo: NEW TRANSLATION
 SAU_sp_sf_recon_desc: "Tiché oči, díky nimž celá armáda vidí dál.\n§G+5 %§! limitu speciálních sil\n§G+5 %§! rychlosti plánování\n§R-5 %§! útoku speciálních sil" # todo: NEW TRANSLATION
 SAU_spirit_king_in_name: "Král jménem, dědic v uniformě" # todo: NEW TRANSLATION
 SAU_spirit_king_in_name_desc: "Monarchie zůstává formálně nedotčena, zatímco korunní princ slouží jako vojenský důstojník pod autoritou Rady. Tento kompromis zabraňuje otevřenému rozkolu mezi královskými a vojenskými institucemi, aniž by plně uspokojil kteroukoli stranu." # todo: NEW TRANSLATION
 SAU_spirit_national_service: "Přehlídky národní služby" # todo: NEW TRANSLATION
 SAU_spirit_national_service_desc: "Vojenské přehlídky na Fahdově silnici, konané dvakrát ročně, využívají obrněnou techniku, školní skupiny a přímé přenosy k budování veřejné podpory národní službě. Jejich inscenovaná povaha nezabránila vysoké účasti." # todo: NEW TRANSLATION
 SAU_spirit_officer_housing: "Program bydlení pro důstojníky" # todo: NEW TRANSLATION
 SAU_spirit_officer_housing_desc: "Vláda rychle buduje bydlení, školy a kliniky pro důstojníky a jejich rodiny. Tyto výhody posilují loajalitu důstojnického sboru k režimu." # todo: NEW TRANSLATION
 SAU_spirit_officer_purge: "Čistka důstojnického sboru" # todo: NEW TRANSLATION
 SAU_spirit_officer_purge_desc: "Důstojníci, kteří během převzetí moci váhali, byli penzionováni, zatímco ti, kteří jej podpořili, si zachovali velení. Čistka zmenšila armádu, ale učinila zbývající důstojnický sbor poslušnějším." # todo: NEW TRANSLATION
 SAU_spirit_public_accounts: "Veřejné účty Rady" # todo: NEW TRANSLATION
 SAU_spirit_public_accounts_desc: "Ministerstva nyní poprvé v saúdských dějinách zveřejňují své výdaje. Tato politika rozhněvala rodiny, které těžily z utajení, ale u veřejnosti je velmi oblíbená." # todo: NEW TRANSLATION
 SAU_spirit_quincy_reaffirmed: "Quincyho ujednání" # todo: NEW TRANSLATION
 SAU_spirit_quincy_reaffirmed_desc: "Spojené státy a Rada pokračují v neformálním ropném a bezpečnostním ujednání poprvé uzavřeném v roce 1945. Americké síly chrání plavbu v Zálivu, zatímco saúdské tankery zásobují světové trhy, a obě vlády dávají přednost tomu, aby dohoda zůstala nedokumentovaná." # todo: NEW TRANSLATION
 SAU_spirit_security_directorate: "Bezpečnostní ředitelství" # todo: NEW TRANSLATION
 SAU_spirit_security_directorate_desc: "Rada sloučila záznamy Mabahith, sítě ministerstva vnitra a vojenské zpravodajství do jediného ředitelství pod vedením jednoho generála. Jeho rozsáhlé sledovací pravomoci jsou účinné, ale široce nedůvěryhodné." # todo: NEW TRANSLATION
 SAU_spirit_unbeholden: "Nezávislé Království" # todo: NEW TRANSLATION
 SAU_spirit_unbeholden_desc: "Saúdská Arábie odmítla zahraniční bezpečnostní záruky a posádky. Nyní nakupuje vlastní protivzdušnou obranu a cvičí vlastní důstojníky, čímž získává nezávislost za velmi vysokou finanční cenu." # todo: NEW TRANSLATION
 SAU_succession_instability: "§RNestabilita nástupnictví§!" # todo: NEW TRANSLATION
 SAU_succession_instability_desc: "Král Fahd je od mrtvice v roce 1995 neschopen vládnout a korunní princ Abdalláh se stal faktickým vládcem. Královský dvůr je rozdělen mezi Abdalláhovy stoupence a mocnou sudajrskou frakci, což vytváří atmosféru politické nejistoty. Dokud nebude nástupnictví formálně vyřešeno, rozhodování Království zůstane ochromeno soupeřením frakcí." # todo: NEW TRANSLATION
 SAU_syria_landbridge_severed: "Íránský pozemní most přerušen" # todo: NEW TRANSLATION
 SAU_syria_landbridge_severed_desc: "Spřátelená vláda v Damašku přerušila teheránskou pozemní trasu k Hizballáhu. Strategické vítězství povzbudilo Království a stabilizovalo říši." # todo: NEW TRANSLATION
 SAU_syria_pipeline_t1: "Levantinský ropovod (úroveň I)" # todo: NEW TRANSLATION
 SAU_syria_pipeline_t1_desc: "Saúdská ropa prochází Jordánskem a Sýrií ke Středozemnímu moři a zpochybňuje ruský plyn u bran Evropy. §GPříjem navíc: 3,50 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 2,00 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+1,50 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_syria_pipeline_t2: "Levantinský ropovod (úroveň II)" # todo: NEW TRANSLATION
 SAU_syria_pipeline_t2_desc: "Saúdská ropa prochází Jordánskem a Sýrií ke Středozemnímu moři a zpochybňuje ruský plyn u bran Evropy. §GPříjem navíc: 4,25 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 2,30 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+1,95 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_syria_pipeline_t3: "Levantinský ropovod (úroveň III)" # todo: NEW TRANSLATION
 SAU_syria_pipeline_t3_desc: "Saúdská ropa prochází Jordánskem a Sýrií ke Středozemnímu moři a zpochybňuje ruský plyn u bran Evropy. §GPříjem navíc: 5,00 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 2,50 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+2,50 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_syrian_quagmire: "Syrská bažina" # todo: NEW TRANSLATION
 SAU_syrian_quagmire_desc: "Roky podpory neúspěšné války v Sýrii snížily veřejnou podporu i dostupné prostředky státní pokladny. Syrská vláda zůstává u moci navzdory výdajům Království." # todo: NEW TRANSLATION
 SAU_tadawul_market: "§GTadawul, saúdská burza, ÚROVEŇ 0§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_desc: "§LSaúdská burza§! je v počáteční fázi, se zavedenými základními obchodními a regulačními funkcemi. Dokončení relevantních fokusů prohloubí trh a zvýší jeho hospodářské přínosy." # todo: NEW TRANSLATION
 SAU_tadawul_market_t1: "§GTadawul, saúdská burza, ÚROVEŇ 1§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t10: "§GTadawul, saúdská burza, ÚROVEŇ 10§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t10_desc: "Reformní program je dokončen, všechny plánované zákony, regulátoři a kotace jsou zavedeny. §LTadawul§! je nyní §Gnejvětší burzou v regionu MENA§!, s tržní kapitalizací větší než všechny ostatní burzy arabského světa dohromady." # todo: NEW TRANSLATION
 SAU_tadawul_market_t1_desc: "První etapa reformy Tadawulu zlepšila fungování trhu a důvěru investorů. Další relevantní fok­usy budou pokračovat v jeho rozvoji." # todo: NEW TRANSLATION
 SAU_tadawul_market_t2: "§GTadawul, saúdská burza, ÚROVEŇ 2§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t2_desc: "Na Tadawulu kotuje více firem a objemy obchodů rostou, čímž se zvyšují příjmy z kancelářských a podnikových daní." # todo: NEW TRANSLATION
 SAU_tadawul_market_t3: "§GTadawul, saúdská burza, ÚROVEŇ 3§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t3_desc: "Tři etapy reformy Tadawulu zvýšily přístup burzy ke kapitálu a její příspěvek ke státním příjmům." # todo: NEW TRANSLATION
 SAU_tadawul_market_t4: "§GTadawul, saúdská burza, ÚROVEŇ 4§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t4_desc: "Tadawul nyní financuje civilní průmysl i kotované společnosti, zatímco silnější regulace zlepšuje důvěru investorů a stabilitu." # todo: NEW TRANSLATION
 SAU_tadawul_market_t5: "§GTadawul, saúdská burza, ÚROVEŇ 5§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t5_desc: "Tadawul dokončil polovinu reformního programu a vykazuje silnější obchodní aktivitu, příjmy a důvěru investorů." # todo: NEW TRANSLATION
 SAU_tadawul_market_t6: "§GTadawul, saúdská burza, ÚROVEŇ 6§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t6_desc: "Šest etap reforem rozšířilo roli Tadawulu při financování saúdských podniků a přitahování investic." # todo: NEW TRANSLATION
 SAU_tadawul_market_t7: "§GTadawul, saúdská burza, ÚROVEŇ 7§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t7_desc: "Sedm etap reforem učinilo z Tadawulu vyspělou regionální burzu s významným kapitálem pod správou." # todo: NEW TRANSLATION
 SAU_tadawul_market_t8: "§GTadawul, saúdská burza, ÚROVEŇ 8§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t8_desc: "Vyspělý Tadawul směruje kapitál do stavebnictví a průmyslu a dává vládě větší vliv na hospodářskou politiku." # todo: NEW TRANSLATION
 SAU_tadawul_market_t9: "§GTadawul, saúdská burza, ÚROVEŇ 9§!" # todo: NEW TRANSLATION
 SAU_tadawul_market_t9_desc: "Tadawul se blíží plnému rozvoji, vytváří vysoké příjmy z podnikových a průmyslových daní a hraje větší roli v národní hospodářské politice." # todo: NEW TRANSLATION
 SAU_tenth_five_year_plan: "Desátý pětiletý plán" # todo: NEW TRANSLATION
 SAU_tenth_five_year_plan_desc: "Ministerstvo hospodářství a plánování vydává pětileté plány od roku 1970, ale mnohé sloužily především jako prohlášení záměru. Tento plán zajišťuje plné financování přístavů, železnic, obchvatů a reforem ministerstev.\n\n§GTrvá pět let§!." # todo: NEW TRANSLATION
 SAU_vision_2030_delivered: "Vize 2030: splněna" # todo: NEW TRANSLATION
 SAU_vision_2030_delivered_desc: "Vize 2030 přinesla velké stavební a diverzifikační projekty včetně NEOM, přestavby Rijádu a nových turistických zařízení. Saúdská Arábie nyní závisí na surové ropě méně." # todo: NEW TRANSLATION
 SAU_vision_2030_expectations: "Vize 2030: příslib" # todo: NEW TRANSLATION
 SAU_vision_2030_expectations_desc: "Oznámení megaprojektů Vize 2030 přilákalo investice a zvýšilo veřejnou důvěru. Jejich rozsah však do dokončení slíbených projektů vytváří velké rozpočtové a politické náklady." # todo: NEW TRANSLATION
 SAU_vision_2030_progress: "Vize 2030: nabývá podoby" # todo: NEW TRANSLATION
 SAU_vision_2030_progress_desc: "Po celém Království probíhá výstavba a první projekty Vize 2030 jsou v provozu. Tento viditelný pokrok snížil veřejné pochybnosti o programu." # todo: NEW TRANSLATION
 SAU_vision_2030_white_elephant: "Vize 2030: bílí sloni" # todo: NEW TRANSLATION
 SAU_vision_2030_white_elephant_desc: "Vize 2030 zmeškala svůj termín a po utracení stovek miliard zanechala velké projekty nedokončené nebo nevyužité. Selhání potvrdilo kritiky programu a poškodilo důvěru ve vedení." # todo: NEW TRANSLATION
 SAU_water_crisis_01: "§HZvládnutelná vodní krize§!" # todo: NEW TRANSLATION
 SAU_water_crisis_01_desc: "Rozšířené odsolování, účinnější zemědělská politika a nižší veřejná spotřeba snížily vodní krizi na §Gzvládnutelnou§! úroveň. Království stále čelí strukturálnímu nedostatku vody, ale zásobování zůstává spolehlivé." # todo: NEW TRANSLATION
 SAU_water_crisis_02: "§HVážná vodní krize§!" # todo: NEW TRANSLATION
 SAU_water_crisis_02_desc: "Saúdská Arábie vyčerpává fosilní zvodně §LSaq§! a §LWajid§! rychleji, než se mohou obnovovat. Zemědělství spotřebovává většinu zbývající podzemní vody, zatímco závislost na odsolování zvyšuje §Ynákklady na spotřební zboží§!, snižuje §Yefektivitu§! a oslabuje §Yveřejnou trpělivost§!." # todo: NEW TRANSLATION
 SAU_yemen_attack_buff: "Koordinovaná ofenziva" # todo: NEW TRANSLATION
 SAU_yemen_attack_buff_desc: "Saúdské plánování a palebná podpora poskytují našim silám rozhodující výhodu při útoku. +15 % útoku proti Hútíům." # todo: NEW TRANSLATION
 SAU_yemen_pipeline_t1: "Ropovod k Arabskému moři (úroveň I)" # todo: NEW TRANSLATION
 SAU_yemen_pipeline_t1_desc: "Saúdská ropa proudí na jih přes Al Mahrah k Arabskému moři a obchází Hormuzský průliv. §GPříjem navíc: 2,00 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 1,00 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+1,00 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_yemen_pipeline_t2: "Ropovod k Arabskému moři (úroveň II)" # todo: NEW TRANSLATION
 SAU_yemen_pipeline_t2_desc: "Saúdská ropa proudí na jih přes Al Mahrah k Arabskému moři a obchází Hormuzský průliv. §GPříjem navíc: 2,50 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 1,15 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+1,35 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_yemen_pipeline_t3: "Ropovod k Arabskému moři (úroveň III)" # todo: NEW TRANSLATION
 SAU_yemen_pipeline_t3_desc: "Saúdská ropa proudí na jih přes Al Mahrah k Arabskému moři a obchází Hormuzský průliv. §GPříjem navíc: 3,00 mld. $§! z vývozu ropovodem oproti §RNákladům navíc: 1,25 mld. $§! na tranzitní poplatky zemím, jimiž trasa prochází – čistě §G+1,75 mld. $§! týdně. Sabotáž sníží ropovod o jednu úroveň a zkrátí obě částky; přerušená trasa úrovně I cestu uzavře." # todo: NEW TRANSLATION
 SAU_baath_state: "Arabský Baas" # todo: NEW TRANSLATION
 SAU_baath_state_tt: "§YJednota, svoboda, socialismus.§!\n\nStrana je předvojem arabského národa a spojuje důstojníka a dělníka, rolníka a studenta v jedinou revoluční vůli. Každá hranice je jen zastávkou na cestě k jedné arabské vlasti." # todo: NEW TRANSLATION
 SAU_communist_state: "Socialistický stát" # todo: NEW TRANSLATION
 SAU_communist_state_tt: "Diktatura proletariátu v Arábii. Tyto zisky trvají pouze po dobu vlády Saúdské komunistické strany. Pokud ztratí moc, zmizí." # todo: NEW TRANSLATION
 SAU_Military_Rule: "Vojenská vláda" # todo: NEW TRANSLATION
 SAU_Monarchy_house_of_al_saud: "Rod al-Saud" # todo: NEW TRANSLATION
 SAU_nda_state: "Národní demokratické shromáždění" # todo: NEW TRANSLATION
 SAU_nda_state_tt: "Instituce liberální republiky se prohlubují s každou reformou prosazenou u volebních uren." # todo: NEW TRANSLATION
 SAU_nlf_doctrine: "Neangažovaný socialismus" # todo: NEW TRANSLATION
 SAU_nlf_doctrine_tt: "§YArabská cesta k socialismu (pouze Národní fronta osvobození):§!\n§G+15 % zisku politické moci, +10 % podpory války§!" # todo: NEW TRANSLATION
 SAU_peoples_council_works: "Veřejné práce Rady" # todo: NEW TRANSLATION
 SAU_peoples_council_works_tt: "Zadáno §YLidovou radou§! a postaveno podle jejích standardů" # todo: NEW TRANSLATION
 SAU_rep_shia_hardline_doctrine: "Revoluční teokracie" # todo: NEW TRANSLATION
 SAU_rep_shia_hardline_doctrine_tt: "Hezbollah al-Hidžáz vládne jménem právníka, národ je mobilizován pro odboj." # todo: NEW TRANSLATION
 SAU_rep_shia_moderate_doctrine: "Reformní správa" # todo: NEW TRANSLATION
 SAU_rep_shia_moderate_doctrine_tt: "Reformní hnutí vládne prostřednictvím smíření, sociální péče a volebních uren." # todo: NEW TRANSLATION
 SAU_rep_shia_state: "Šíitská republika" # todo: NEW TRANSLATION
 SAU_rep_shia_state_tt: "Instituce šíitské republiky sílí s každou prosazenou reformou a každým dosaženým vítězstvím." # todo: NEW TRANSLATION
 SAU_scp_doctrine: "Marxisticko-leninský předvoj" # todo: NEW TRANSLATION
 SAU_scp_doctrine_tt: "§YOrtodoxní marxismus-leninismus (pouze Saúdská komunistická strana):§!\n§G+10 % efektivity továren, +10 % rychlosti výstavby, +5 % stability§!" # todo: NEW TRANSLATION
