 SAU_two_state_champion: "Obhájce řešení dvou států" # todo: NEW TRANSLATION
 HOU_break_ceasefire_category: "Saúdské příměří" # todo: NEW TRANSLATION
 HOU_drop_north_yemen_name: "Obnovit jméno Jemenu" # todo: NEW TRANSLATION
 HOU_drop_north_yemen_name_desc: "Odložte identitu Severního Jemenu a znovu vládněte pod vlastní vlajkou." # todo: NEW TRANSLATION
 PER_houthi_militia: "Mobilizovat lidové milice" # todo: NEW TRANSLATION
 PER_houthi_militia_desc: "Mobilizujte kmenové stoupence, aby poskytli hnutí Húsiů další lidské zdroje s nízkými náklady." # todo: NEW TRANSLATION
 PER_houthi_old_weapons: "Propašovat zbraně Húsíům" # todo: NEW TRANSLATION
 PER_houthi_old_weapons_desc: "Pošlete zásilku starých pušek přes Rudé moře a přes hranici k bojovníkům Húsíů." # todo: NEW TRANSLATION
 PER_houthi_raise_brigade: "Posílit obranu" # todo: NEW TRANSLATION
 PER_houthi_raise_brigade_desc: "Pošlete ženijní jednotky Kuds k zakopání Húsíů v horách. Bude mnohem obtížnější je vytlačit z území, které drží." # todo: NEW TRANSLATION
 PER_houthi_support_category: "Podpora Húsíů" # todo: NEW TRANSLATION
 SAU_abdullah_kaec_construction: "Urychlit výstavbu KAEC" # todo: NEW TRANSLATION
 SAU_abdullah_kaec_construction_desc: "Urychlete výstavbu Ekonomického města krále Abdalláha zrušením povolení a najmutím dalších dodavatelů podél pobřeží Rudého moře." # todo: NEW TRANSLATION
 SAU_abdullah_kasp_scholarship: "Rozšířit zahraniční stipendia KASP" # todo: NEW TRANSLATION
 SAU_abdullah_kasp_scholarship_desc: "Rozšiřte státem financovaná zahraniční stipendia, aby více saúdských studentů mohlo studovat obory, v nichž Království postrádá vyškolené odborníky. Jejich vzdělání po návratu posílí domácí pracovní sílu." # todo: NEW TRANSLATION
 SAU_abdullah_kaust_grants: "Financovat technologické granty KAUST" # todo: NEW TRANSLATION
 SAU_abdullah_kaust_grants_desc: "Poskytněte KAUST rozsáhlé výzkumné granty k náboru předních odborníků a založení pokročilých laboratoří v Thuwalu." # todo: NEW TRANSLATION
 SAU_abdullah_national_dialogue: "Svolat fóra národního dialogu" # todo: NEW TRANSLATION
 SAU_abdullah_national_dialogue_desc: "Svolejte duchovní, reformátory, šíitské představitele a ženy do fór národního dialogu. Setkání poskytnou vyloučeným skupinám formální kanál k předkládání jejich obav." # todo: NEW TRANSLATION
 SAU_abdullah_sang_subsidies: "Subvence na modernizaci SANG" # todo: NEW TRANSLATION
 SAU_abdullah_sang_subsidies_desc: "Dotujte nové smlouvy na vozidla pro Saúdskou arabskou národní gardu, snižte náklady její modernizace a posilte její loajalitu vůči vládě." # todo: NEW TRANSLATION
 SAU_Among_Major_powers_Open_east: "Odemknout rozhodnutí §RSpolupráce s Východem§!" # todo: NEW TRANSLATION
 SAU_appoint_provincial_governor: "Jmenovat guvernéra provincie" # todo: NEW TRANSLATION
 SAU_appoint_provincial_governor_desc: "Guvernérské místo je prázdné. Vyberte na mapě provincii a Rada rozhodne, kdo ji převezme.\n\nKaždou provincii lze rozdělit pouze jednou." # todo: NEW TRANSLATION
 SAU_arm_arab_revolutionaries: "Vyzbrojit arabské revolucionáře" # todo: NEW TRANSLATION
 SAU_arm_arab_revolutionaries_desc: "Dodávejte pušky a vyškolené organizátory komunistickým hnutím působícím v dalších arabských zemích." # todo: NEW TRANSLATION
 SAU_arm_lebanese_army: "Vyzbrojit libanonskou armádu" # todo: NEW TRANSLATION
 SAU_arm_lebanese_army_desc: "Poskytněte libanonské armádě saúdské zbraně a výcvik, aby mohla působit nezávisle na Hizballáhu." # todo: NEW TRANSLATION
 SAU_back_mbn: "Podpořit Mohammeda bin Nayefa" # todo: NEW TRANSLATION
 SAU_back_mbn_desc: "Postavte se za ministra vnitra, architekta protiteroristického státu Království a oblíbence Washingtonu. Zavázání se kandidátovi připoutá dvůr k jeho věci po zbytek nástupnictví." # todo: NEW TRANSLATION
 SAU_back_mbn_heir: "Podpořit Mohammeda bin Nayefa" # todo: NEW TRANSLATION
 SAU_back_mbn_heir_desc: "Podpořte korunního prince Mohammeda bin Nayefa na základě jeho působení na ministerstvu vnitra, protiteroristické kariéry a silných vztahů s Washingtonem." # todo: NEW TRANSLATION
 SAU_back_mbs_heir: "Podpořit Mohammeda bin Salmana" # todo: NEW TRANSLATION
 SAU_back_mbs_heir_desc: "Podpořte Mohammeda bin Salmana, mladého syna krále, který navzdory omezeným zkušenostem upevňuje svou autoritu nad stále větším počtem ministerstev." # todo: NEW TRANSLATION
 SAU_back_mutaib: "Podpořit Mutaiba bin Abdalláha" # todo: NEW TRANSLATION
 SAU_back_mutaib_desc: "Postavte se za syna krále Abdalláha, velitele Národní gardy a dědice otcovy kmenové podpory. Zavázání se kandidátovi připoutá dvůr k jeho věci po zbytek nástupnictví." # todo: NEW TRANSLATION
 SAU_back_salman: "Podpořit Salmana bin Abdulazize" # todo: NEW TRANSLATION
 SAU_back_salman_desc: "Postavte se za nejstaršího prince ze Sudajrů a dlouholetého guvernéra Rijádu. Zavázání se kandidátovi připoutá dvůr k jeho věci po zbytek nástupnictví." # todo: NEW TRANSLATION
 SAU_bahrain_restore_khalifa: "Obnovit rod Khalífů" # todo: NEW TRANSLATION
 SAU_bahrain_restore_khalifa_desc: "Rozmístěte jednotky přes hráz a obnovte rod Khalífů, pokud v Bahrajnu ztratí moc.\n\n§YDostupné, když§! Bahrajnu již nevládne rod Khalífů.\n\n§GObnoví rod Khalífů u moci§!, odstraní Bahrajn z každé frakce, která není naše, a přivede jej pod §YŠtít poloostrova§!.\n\n§R-15 miliard dolarů, -2 % stability§!, vztahy s Teheránem se zhorší. §G+5 % podpory války§!." # todo: NEW TRANSLATION
 SAU_bop_note: "§HJak se mění budoucnost Království§!" # todo: NEW TRANSLATION
 SAU_bop_note_desc: "Rovnováhu §HBudoucnosti Království§! nelze změnit přímo prostřednictvím rozhodnutí. Mění se prostřednictvím §Ldokončených fokusů§! v Tadavulu, SAGIA a dalších větvích, stejně jako prostřednictvím §Lklíčových událostí§! a králových §Lreforem§!." # todo: NEW TRANSLATION
 SAU_break_houthi_ceasefire: "Porušit příměří" # todo: NEW TRANSLATION
 SAU_break_houthi_ceasefire_desc: "Roztrhejte příměří s Húsíi a obnovte operaci Rozhodná bouře." # todo: NEW TRANSLATION
 SAU_broadcast_revolution: "Vysílat revoluci" # todo: NEW TRANSLATION
 SAU_broadcast_revolution_desc: "Využijte Rádio Svobodná Arábie k podpoře komunismu mezi dělníky a dalšími nespokojenými skupinami napříč arabskými zeměmi." # todo: NEW TRANSLATION
 SAU_coalition_member_arm_yemen: "Vyzbrojit republiku" # todo: NEW TRANSLATION
 SAU_coalition_member_arm_yemen_desc: "Zbraně a muži poslaní uznávané vládě naším jménem, nikoli jménem Rijádu.\n\n§GJemen obdrží 1 500 pěchotních zbraní, 8 000 mužů a zkušenosti armády§!. Opakovatelné každých 30 dní." # todo: NEW TRANSLATION
 SAU_coalition_member_category: "Jemenská koalice" # todo: NEW TRANSLATION
 SAU_coalition_member_leave: "Opustit koalici" # todo: NEW TRANSLATION
 SAU_coalition_member_leave_desc: "Stáhněte se z koalice vedené Saúdskou Arábií a ukončete naši účast v její jemenské kampani.\n\n§RRijád ztratí koaličního partnera a vezme si to osobně§!; §G+50 politické moci, +3 % stability§!." # todo: NEW TRANSLATION
 SAU_coalition_member_strike: "Provést náš nálet" # todo: NEW TRANSLATION
 SAU_coalition_member_strike_desc: "Náš podíl na plánu vzdušných operací, provedený proti provincii držené Húsii.\n\n§RPoškodí infrastrukturu, zbrojní průmysl a protivzdušnou obranu§! v cílové provincii. Opakovatelné každých 21 dní." # todo: NEW TRANSLATION
 SAU_communist_invite_to_comintern: "Pozvat [FROM.GetName] do arabské Kominterny" # todo: NEW TRANSLATION
 SAU_communist_invite_to_comintern_desc: "Pozvěte [FROM.GetName] ke vstupu do arabské Kominterny. Bratrský dělnický stát nemusí být osvobozen silou; může pozvání přijmout nebo odmítnout." # todo: NEW TRANSLATION
 SAU_communist_seize_power: "Zahájit socialistickou revoluci v [FROM.GetName]" # todo: NEW TRANSLATION
 SAU_communist_seize_power_desc: "Tam, kde dělníci ovládají ulice, udeřte. S převažující podporou starý režim padne; tam, kde je hnutí pouze silné, se země propadne do revoluční občanské války." # todo: NEW TRANSLATION
 SAU_council_national_service: "Přehlídky národní služby" # todo: NEW TRANSLATION
 SAU_council_national_service_desc: "Uspořádejte celostátně vysílanou vojenskou přehlídku na ulici krále Fahda za přítomnosti Rady. Přehlídka podpoří veřejnou podporu ozbrojených sil a nové vlády." # todo: NEW TRANSLATION
 SAU_council_officer_housing: "Program bydlení pro důstojníky" # todo: NEW TRANSLATION
 SAU_council_officer_housing_desc: "Postavte bytové komplexy, školy a kliniky pro důstojnický sbor. Zlepší to vojenskou podporu Rady, ale odvede veřejné prostředky od jiných potřeb." # todo: NEW TRANSLATION
 SAU_council_officer_purge: "Očistit důstojnický sbor" # todo: NEW TRANSLATION
 SAU_council_officer_purge_desc: "Penziujte důstojníky, jejichž loajalita byla během převzetí moci nejistá, a odstraňte další odhalené následným vyšetřováním. Armáda bude menší, ale spolehlivější." # todo: NEW TRANSLATION
 SAU_council_public_accounts: "Zveřejnit veřejné účty" # todo: NEW TRANSLATION
 SAU_council_public_accounts_desc: "Zveřejněte účty ministerstev, abyste prokázali odhodlání Rady k transparentní vládě. Zlepší to její pověst poctivosti, ale omezí účelové výdaje dříve používané k neformálním dohodám." # todo: NEW TRANSLATION
 SAU_council_security_directorate: "Zřídit bezpečnostní ředitelství" # todo: NEW TRANSLATION
 SAU_council_security_directorate_desc: "Sjednoťte Mabáhith, sítě ministerstva vnitra a vojenskou rozvědku pod jedno ředitelství. Centralizované hlášení zlepší schopnost Rady sledovat hrozby v celém Království." # todo: NEW TRANSLATION
 SAU_councils_category: "Rady Království" # todo: NEW TRANSLATION
 SAU_councils_category_desc: "§HMadžlis aš-Šúrá§! - [ROOT.GetSAUShuraBench]\n§OUlamá§! [?SAU_shura_ulema|0]    §YTechnokraté§! [?SAU_shura_technocrats|0]    §GVýznamní představitelé§! [?SAU_shura_notables|0]\n§HLidová rada§! - [ROOT.GetSAUPCStanding], [ROOT.GetSAUPCBloc]\n§OReformisté§! [?SAU_pc_reformists|0]    §YTradicionalisté§! [?SAU_pc_traditionalists|0]    §GProvinciálové§! [?SAU_pc_provincials|0]\n\nV Rijádu nyní zasedají dvě komory a žádná z nich nemůže krále k ničemu přinutit.\n\n§HMadžlis aš-Šúrá§! je jmenován a radí v otázkách, které mu jsou předloženy. Lavice s největším počtem křesel určuje jeho charakter a tento charakter má svou cenu:\n§OVedení ulamá§!  §G+8 % stability, +10 % obrany proti driftu§!  /  §R-5 % výzkumu, -5 % migrace§!\n§YVedení technokratů§!  §G+8 % výzkumu, +6 % výkonu úřadů, +5 % produktivity§!  /  §R-5 % stability§!\n§GVedení významných představitelů§!  §G+8 % politické moci, -8 % nákladů na korupci§!  /  §R+3 % spotřebního zboží, -3 % podpory války§!\n\n§YZískejte lavici nad 70 křesel a král může radu trvale ustavit.§! Ustavení zdvojnásobí charakter dané lavice, zakotví jej v Základním zákoně a definitivně ukončí soutěž - počty křesel už nebudou o ničem rozhodovat. Odmítněte a všechny tři lavice se resetují na 40, přičemž komora zůstane vaše a budete ji moci znovu vyvážit.\n\n§HLidová rada§! odpovídá lidu. Je prvním orgánem v dějinách Království, který mluví za vládnuté, nikoli k nim, a může přijímat zákony o vnitřních záležitostech. Králi zůstává veto a §Rkaždé jeho použití stojí stabilitu a podporu války§!." # todo: NEW TRANSLATION
 SAU_crown_prince_category: "Korunní princ" # todo: NEW TRANSLATION
 SAU_cyber_defensive_op: "Obranná kybernetická operace" # todo: NEW TRANSLATION
 SAU_cyber_defensive_op_desc: "Posilte Království a sabotujte útočné systémy cíle po dobu §Y90 dní§!. Jeho síly budou proti nám při útoku bojovat o §Y10 % slabší§!, zatímco GIP ochrání naše vlastní sítě. Vyžaduje §G70%§! síť u cíle." # todo: NEW TRANSLATION
 SAU_cyber_offensive_op: "Útočná kybernetická operace" # todo: NEW TRANSLATION
 SAU_cyber_offensive_op_desc: "Proměňte síť ve zbraň. Kybernetický úder GIP trvající §Y90 dní§! ochromí velení a obranu cíle: jeho divize budou v obraně bojovat o §Y10 % slabší§! a průmysl se zastaví. Vyžaduje §G70%§! síť u cíle." # todo: NEW TRANSLATION
 SAU_debug_bop_left: "§Y(DEBUG) Posun k tradicionalismu§!" # todo: NEW TRANSLATION
 SAU_debug_bop_left_desc: "Pouze nástroj pro modování/debug. Posune rovnováhu §HBudoucnosti Království§! o §R-0,05 doleva§! (k tradicionalismu). Zobrazuje se pouze při spuštění hry s parametrem -debug." # todo: NEW TRANSLATION
 SAU_debug_bop_right: "§Y(DEBUG) Posun k liberalizaci§!" # todo: NEW TRANSLATION
 SAU_debug_bop_right_desc: "Pouze nástroj pro modování/debug. Posune rovnováhu §HBudoucnosti Království§! o §G+0,05 doprava§! (k liberalizaci). Zobrazuje se pouze při spuštění hry s parametrem -debug." # todo: NEW TRANSLATION
 SAU_debug_category: "DEBUG - Saúdské nástupnictví" # todo: NEW TRANSLATION
 SAU_debug_clear_decree_lock: "DEBUG: Zrušit 60denní blokaci dekretu" # todo: NEW TRANSLATION
 SAU_debug_clear_decree_lock_desc: "Zruší SAU_royal_decree_active, takže rozhodnutí vládnoucího monarchy lze okamžitě přijmout znovu, bez čekání 60 dní." # todo: NEW TRANSLATION
 SAU_debug_drain_salman_health: "DEBUG: Zhoršit zdraví krále Salmana" # todo: NEW TRANSLATION
 SAU_debug_drain_salman_health_desc: "Nastaví SAU_salman_health na 0. Řetězec nástupnictví se spustí při příštím měsíčním tiknutí a korunuje toho, kdo je právě korunním princem." # todo: NEW TRANSLATION
 SAU_debug_faisalite_conviction_up: "(DEBUG) Fajsalistické přesvědčení +25" # todo: NEW TRANSLATION
 SAU_debug_faisalite_conviction_up_desc: "Přidá 25 bodů přesvědčení a znovu vyhodnotí úroveň. Opakováním překročíte 45 a 75." # todo: NEW TRANSLATION
 SAU_debug_faisalite_open: "(DEBUG) Otevřít fajsalistický řetězec" # todo: NEW TRANSLATION
 SAU_debug_faisalite_open_desc: "Spustí událost summitu v Mekce, která zahajuje řetězec, bez čekání 140 dní." # todo: NEW TRANSLATION
 SAU_debug_faisalite_pivot: "(DEBUG) Spustit irácký obrat" # todo: NEW TRANSLATION
 SAU_debug_faisalite_pivot_desc: "Spustí událost obratu americké okupace bez ohledu na válečnou situaci." # todo: NEW TRANSLATION
 SAU_debug_faisalite_readout: "(DEBUG) Fajsalismus: [ROOT.GetSAUFaisaliteConviction]" # todo: NEW TRANSLATION
 SAU_debug_faisalite_readout_desc: "§HPřesvědčení§!: §Y[?SAU_faisalite_conviction|0]§! ze §Y100§!\n§HSociální konzervatismus za měsíc§!: §Y[?SAU_social_conservatism|0]§!\n§HÚroveň§!: [ROOT.GetSAUFaisaliteConviction]" # todo: NEW TRANSLATION
 SAU_debug_grievance_open: "(DEBUG) Otevřít řetězec převratu" # todo: NEW TRANSLATION
 SAU_debug_grievance_open_desc: "Nastaví příznak ropného krachu z roku 2008 a spustí událost nespokojenosti důstojníků, která řetězec zahajuje, bez čekání na rok 2008." # todo: NEW TRANSLATION
 SAU_debug_grievance_readout: "(DEBUG) Důstojníci: [ROOT.GetSAUArmyGrievance]" # todo: NEW TRANSLATION
 SAU_debug_grievance_readout_desc: "§HNespokojenost§!: §Y[?SAU_army_grievance|0]§! ze §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n§HOchrana gardy§! (zdvojnásobuje měsíční míru): kontrolováno příznakem SAU_sang_shielded." # todo: NEW TRANSLATION
 SAU_debug_grievance_up: "(DEBUG) Nespokojenost důstojníků +25" # todo: NEW TRANSLATION
 SAU_debug_grievance_up_desc: "Přidá 25 bodů nespokojenosti a znovu vyhodnotí úroveň. Opakováním překročíte 50 (rozkaz k nasazení) a 75 (převrat)." # todo: NEW TRANSLATION
 SAU_debug_junta_legitimacy_up: "(DEBUG) Legitimita junty +25" # todo: NEW TRANSLATION
 SAU_debug_junta_legitimacy_up_desc: "Zvýší postavení Rady, aby se ověřilo, že krize skončí místo vypršení časového limitu." # todo: NEW TRANSLATION
 SAU_debug_junta_legitimacy_zero: "(DEBUG) Legitimita junty na 0" # todo: NEW TRANSLATION
 SAU_debug_junta_legitimacy_zero_desc: "Sníží legitimitu Rady na nulu, aby se při další kontrole aktivovala krize legitimity." # todo: NEW TRANSLATION
 SAU_debug_junta_open: "(DEBUG) Vynutit převrat důstojníků" # todo: NEW TRANSLATION
 SAU_debug_junta_open_desc: "Aktivuje řetězec nespokojenosti a okamžitě spustí událost převzetí moci." # todo: NEW TRANSLATION
 SAU_debug_king_abdullah: "DEBUG: Korunovat krále Abdalláha" # todo: NEW TRANSLATION
 SAU_debug_king_abdullah_desc: "Nastaví SAU_current_king na 1, dosadí Abdalláha jako vůdce země a znovu otevře soutěž o nástupnictví z Abdalláhovy éry (Salman 45 / MBN 30 / Mutaib 25)." # todo: NEW TRANSLATION
 SAU_debug_king_mbn: "DEBUG: Korunovat Mohammeda bin Nayefa" # todo: NEW TRANSLATION
 SAU_debug_king_mbn_desc: "Nastaví SAU_current_king na 3 a dosadí Mohammeda bin Nayefa jako vůdce země." # todo: NEW TRANSLATION
 SAU_debug_king_mbs: "DEBUG: Korunovat Mohammeda bin Salmana" # todo: NEW TRANSLATION
 SAU_debug_king_mbs_desc: "Nastaví SAU_current_king na 5 a dosadí Mohammeda bin Salmana jako vůdce země." # todo: NEW TRANSLATION
 SAU_debug_king_mutaib: "DEBUG: Korunovat Mutaiba bin Abdalláha" # todo: NEW TRANSLATION
 SAU_debug_king_mutaib_desc: "Nastaví SAU_current_king na 4 a dosadí Mutaiba bin Abdalláha jako vůdce země." # todo: NEW TRANSLATION
 SAU_debug_king_salman: "DEBUG: Korunovat krále Salmana" # todo: NEW TRANSLATION
 SAU_debug_king_salman_desc: "Nastaví SAU_current_king na 2, dosadí Salmana jako vůdce země, obnoví jeho zdraví na 100 a otevře soutěž o korunního prince mezi MBS a MBN." # todo: NEW TRANSLATION
 SAU_debug_oil_dep_readout: "(DEBUG) Závislost na ropě: [?oil_dependence|0] (čtvrtinový tik [?SAU_oil_dep_quarter|0]/3)" # todo: NEW TRANSLATION
 SAU_debug_oil_dep_readout_desc: "Zobrazí hodnotu závislosti a to, jak daleko probíhá tříměsíční tik." # todo: NEW TRANSLATION
 SAU_debug_pc_open: "(DEBUG) Vytvořit lidovou radu" # todo: NEW TRANSLATION
 SAU_debug_pc_open_desc: "Nastaví příznak a obsadí komoru v poměru 40/40/40 s postavením 50, bez použití fokusu." # todo: NEW TRANSLATION
 SAU_debug_pc_readout: "(DEBUG) Stav lidové rady" # todo: NEW TRANSLATION
 SAU_debug_pc_readout_desc: "§HOtevřena§! (SAU_peoples_council_open, nastaveno fokusem SAU_establish_the_peoples_council)\n§HPostavení§!: §Y[?SAU_pc_standing|0]§! - Veřejné práce vyžadují 60+\n§HKřesla§! - reformisté §Y[?SAU_pc_reformists|0]§!, tradicionalisté §Y[?SAU_pc_traditionalists|0]§!, provinciálové §Y[?SAU_pc_provincials|0]§! - lavice potřebuje 21+ křesel, aby mohla mluvit\n§HPoužitá veta§!: §Y[?SAU_pc_vetoes|0]§!" # todo: NEW TRANSLATION
 SAU_debug_pc_reset_cycle: "(DEBUG) Vymazat příznaky zasedání" # todo: NEW TRANSLATION
 SAU_debug_pc_reset_cycle_desc: "Vymaže SAU_pc_debate_ongoing a SAU_pc_doing_bill, pokud se zasedání zasekne." # todo: NEW TRANSLATION
 SAU_debug_pc_standing_up: "(DEBUG) Postavení Rady +20" # todo: NEW TRANSLATION
 SAU_debug_pc_standing_up_desc: "Zvýší postavení o 20, aby bylo možné otestovat veřejné práce." # todo: NEW TRANSLATION
 SAU_debug_shura_dissolve: "(DEBUG) Rozpustit Madžlis aš-Šúrá" # todo: NEW TRANSLATION
 SAU_debug_shura_dissolve_desc: "Spustí SAU_shura_dissolve: vymaže příznak, vynuluje lavice a odstraní ducha." # todo: NEW TRANSLATION
 SAU_debug_shura_open: "(DEBUG) Otevřít Madžlis aš-Šúrá" # todo: NEW TRANSLATION
 SAU_debug_shura_open_desc: "Nastaví SAU_shura_open a obsadí Radu v poměru 50/50/50, bez SAU_reorganization_of_the_majlis_ash_shura nebo Miteba na trůnu." # todo: NEW TRANSLATION
 SAU_debug_shura_readout: "(DEBUG) Kontrola podmínek Šúrá" # todo: NEW TRANSLATION
 SAU_debug_shura_readout_desc: "§HVšechny podmínky kategorie:§!\n§YOtevření Rady§! (SAU_shura_open, nastaveno fokusem SAU_reorganization_of_the_majlis_ash_shura)\n§YVládnoucí rod Al Saud§!: [?ruling_party|0] musí být 10\n§YŽádný převrat§! (SAU_military_coup_ready musí být vypnutý)\n§YZachovaná monarchie§! (SAU_monarchy_abolished musí být vypnutý)\n\n§HKřesla§! - ulamá [?SAU_shura_ulema|0], technokraté [?SAU_shura_technocrats|0], významní představitelé [?SAU_shura_notables|0]" # todo: NEW TRANSLATION
 SAU_debug_storm_complete_civil_war: "(DEBUG) Dokončit fokus jemenské občanské války" # todo: NEW TRANSLATION
 SAU_debug_storm_complete_civil_war_desc: "Vynutí dokončení SAU_the_yemeni_civil_war bez čekání na měsíční kontrolu." # todo: NEW TRANSLATION
 SAU_debug_storm_open: "(DEBUG) Spustit schůzku v Rijádu" # todo: NEW TRANSLATION
 SAU_debug_storm_open_desc: "Spustí přímo událost 194 a přeskočí fokus i jeho předpoklady." # todo: NEW TRANSLATION
 SAU_debug_storm_readout: "(DEBUG) Koalice: [?SAU_coalition_partners|0]" # todo: NEW TRANSLATION
 SAU_debug_storm_readout_desc: "§HKoaliční partneři§!: §Y[?SAU_coalition_partners|0]§!\n§HZahájena bouře§!: příznak SAU_decisive_storm_launched\n§HFokus občanské války§!: SAU_the_yemeni_civil_war" # todo: NEW TRANSLATION
 SAU_debug_water_pride_down: "§Y(DEBUG) Vynutit -1 úroveň Pýchy vody§!" # todo: NEW TRANSLATION
 SAU_debug_water_pride_down_desc: "Nástroj pro modování/debug. Vynutí ducha §HSuverénních vod§! o jednu úroveň níže bez ohledu na stabilitu. Zobrazuje se pouze s parametrem -debug." # todo: NEW TRANSLATION
 SAU_debug_water_pride_up: "§Y(DEBUG) Vynutit +1 úroveň Pýchy vody§!" # todo: NEW TRANSLATION
 SAU_debug_water_pride_up_desc: "Nástroj pro modování/debug. Vynutí ducha §HSuverénních vod§! o jednu úroveň výše bez ohledu na stabilitu. Zobrazuje se pouze s parametrem -debug." # todo: NEW TRANSLATION
 SAU_div_arms: "Lokalizovat výrobu zbraní" # todo: NEW TRANSLATION
 SAU_div_arms_desc: "Rozvíjejte §HSAMI§! a domácí obranný průmysl. Zbraně vyrobené v Saúdské Arábii snižují výdaje za dovoz, zaměstnávají inženýry a §Grozevírají průmyslovou základnu§! mimo ropu." # todo: NEW TRANSLATION
 SAU_div_digital: "Rozvíjet digitální ekonomiku" # todo: NEW TRANSLATION
 SAU_div_digital_desc: "Podpořte §Hfintech, elektronický obchod a startupy§!, abyste vytvořili kvalifikovaná pracovní místa a větší daňovou základnu mimo ropný sektor. Tím se §Gsnižuje závislost na surové ropě§! rozšiřováním soukromých digitálních odvětví." # todo: NEW TRANSLATION
 SAU_div_giga_project: "Financovat gigaprojekt" # todo: NEW TRANSLATION
 SAU_div_giga_project_desc: "Vyčleňte rozsáhlé prostředky na §HNEOM§! a jeho plánované město na severozápadě. Projekt poskytne značnou poptávku po stavebnictví a posune ekonomiku §Gpryč od ropy§!, avšak za velmi vysokou fiskální cenu." # todo: NEW TRANSLATION
 SAU_div_pif_invest: "Strategická investice PIF" # todo: NEW TRANSLATION
 SAU_div_pif_invest_desc: "Nasměrujte kapitál §HVerejného investičního fondu§! do domácích továren, stavebních kapacit a zaměstnanosti v Rijádu. Za značné náklady pro státní pokladnu to výrazně sníží §Gzávislost na ropě§!." # todo: NEW TRANSLATION
 SAU_div_renewables: "Rozšířit kapacitu obnovitelných zdrojů" # todo: NEW TRANSLATION
 SAU_div_renewables_desc: "Vybudujte §Hsolární a větrné elektrárny§! v Prázdné končině. Čistá energie uvolní ropu pro vývoz a §Guvolní závislost ekonomiky na ropě§!." # todo: NEW TRANSLATION
 SAU_div_tourism_event: "Uspořádat globální turistickou akci" # todo: NEW TRANSLATION
 SAU_div_tourism_event_desc: "Propagujte letoviska, festivaly, poutě a mezinárodní cestovní ruch na §Hpobřeží Rudého moře§!. Výdaje návštěvníků §Gdiverzifikují§! příjmy Království nad rámec ropy." # todo: NEW TRANSLATION
 SAU_domestic_external_category: "§HSaúdské vnitřní a zahraniční záležitosti§!" # todo: NEW TRANSLATION
 SAU_east_belt_road: "Investice v rámci iniciativy Pás a stezka" # todo: NEW TRANSLATION
 SAU_east_belt_road_desc: "Přijměte čínské investice v rámci iniciativy Pás a stezka do saúdských přístavů, železnic a průmyslových měst. Projekty rozšíří infrastrukturu bez politických podmínek, které obvykle vyžadují západní partneři." # todo: NEW TRANSLATION
 SAU_east_energy_markets: "Asijské energetické trhy" # todo: NEW TRANSLATION
 SAU_east_energy_markets_desc: "Rozšiřte vývoz ropy do Číny a dalších asijských ekonomik. Širší zákaznická základna posílí saúdský vliv a sníží závislost na západní poptávce." # todo: NEW TRANSLATION
 SAU_east_trade: "Obchodní dohoda s Východem" # todo: NEW TRANSLATION
 SAU_east_trade_desc: "Uzavřete obchodní dohody, které vymění saúdský vývoz energie za průmyslové zboží z rostoucích asijských ekonomik." # todo: NEW TRANSLATION
 SAU_faisalite_category: "Faisalova otázka" # todo: NEW TRANSLATION
 SAU_faisalite_endowments: "Financovat náboženské nadace" # todo: NEW TRANSLATION
 SAU_faisalite_endowments_desc: "Poskytněte dodatečné financování náboženským nadacím, které od poklesu příjmů z ropy čelí schodkům. Neevidované prostředky zajistí podporu duchovních ovlivňujících kázání v celém Království." # todo: NEW TRANSLATION
 SAU_faisalite_guard_petition: "Petice gardy" # todo: NEW TRANSLATION
 SAU_faisalite_guard_petition_desc: "Dovolte vysokým důstojníkům Národní gardy předložit Mutaibovi veřejnou petici. Její podpis označí důstojníky podporující jeho nárok na nástupnictví." # todo: NEW TRANSLATION
 SAU_faisalite_int_buy_satellite_channels: "Koupit arabské satelitní kanály" # todo: NEW TRANSLATION
 SAU_faisalite_int_buy_satellite_channels_desc: "Kupte hlavní arabské satelitní sítě a jmenujte personál spojený s Rijádem. Tím rozšíříte saúdský vliv nad regionálními médii, ale znepokojíte ulamá." # todo: NEW TRANSLATION
 SAU_faisalite_int_endow_universities: "Obdarovat zahraniční univerzity" # todo: NEW TRANSLATION
 SAU_faisalite_int_endow_universities_desc: "Financujte stálé katedry islámských studií na zahraničních univerzitách od Káhiry po Kuala Lumpur. Rijád poskytne financování a určí schválené osnovy." # todo: NEW TRANSLATION
 SAU_faisalite_int_hard_currency_loans: "Půjčovat v tvrdé měně" # todo: NEW TRANSLATION
 SAU_faisalite_int_hard_currency_loans_desc: "Nabídněte úvěry denominované v dolarech vládám, které jinde nemohou získat dostupné financování. Výhodné podmínky zvýší jejich závislost na saúdské podpoře." # todo: NEW TRANSLATION
 SAU_faisalite_int_officers_abroad: "Vyslat důstojnický sbor do zahraničí" # todo: NEW TRANSLATION
 SAU_faisalite_int_officers_abroad_desc: "Přidělte saúdské důstojníky jako poradce a instruktory ozbrojeným silám napříč muslimským světem. Tato nasazení zlepší saúdské vojenské zkušenosti a rozšíří vliv Rijádu." # todo: NEW TRANSLATION
 SAU_faisalite_int_pilgrimage_quotas: "Rozšířit poutní kvóty" # todo: NEW TRANSLATION
 SAU_faisalite_int_pilgrimage_quotas_desc: "Zvyšte kvóty pro hadždž navzdory dodatečnému tlaku na infrastrukturu Mekky. Více poutníků zažije saúdskou správu svatých míst a vrátí se domů s pevnějšími vazbami na Království." # todo: NEW TRANSLATION
 SAU_faisalite_iso_buy_foreign_firms: "Vykoupit zahraniční společnosti" # todo: NEW TRANSLATION
 SAU_faisalite_iso_buy_foreign_firms_desc: "Kupte společnosti v zahraničním vlastnictví působící v Království a převeďte jejich majetek na státní ministerstva. Tím zvýšíte saúdskou kontrolu nad ekonomikou, ale noví provozovatelé přijdou o dosavadní odborné znalosti těchto firem." # todo: NEW TRANSLATION
 SAU_faisalite_iso_cancel_visas: "Zrušit víza zahraničních pracovníků" # todo: NEW TRANSLATION
 SAU_faisalite_iso_cancel_visas_desc: "Nechte bez prodloužení vypršet jeden milion zahraničních pracovních povolení. Tím zvýšíte saúdský podíl na pracovní síle, ale zdržíte projekty závislé na zahraniční pracovní síle." # todo: NEW TRANSLATION
 SAU_faisalite_iso_close_foreign_schools: "Uzavřít zahraniční školy" # todo: NEW TRANSLATION
 SAU_faisalite_iso_close_foreign_schools_desc: "Uzavřete mezinárodní školy a přeřaďte jejich žáky do státního systému. Vzdělávání se bude řídit saúdskými osnovami, ale školy nejsou připraveny na další studenty." # todo: NEW TRANSLATION
 SAU_faisalite_iso_import_licences: "Přídělovat dovozní licence" # todo: NEW TRANSLATION
 SAU_faisalite_iso_import_licences_desc: "Snižte počet dovozních licencí vydávaných každé čtvrtletí. Dovoz bude vzácnější a dražší, což domácím výrobcům poskytne větší prostor na trhu." # todo: NEW TRANSLATION
 SAU_faisalite_iso_repatriate_reserves: "Repatriovat státní rezervy" # todo: NEW TRANSLATION
 SAU_faisalite_iso_repatriate_reserves_desc: "Převeďte saúdské státní rezervy z New Yorku a Londýna zpět do Království. Posílíte přímou kontrolu nad národními aktivy, ale vážně poškodíte vztahy se západními finančními partnery." # todo: NEW TRANSLATION
 SAU_faisalite_score_interventionist: "§RIntervencionisté§!   §Y[?SAU_faisalite_interventionist|0]§!" # todo: NEW TRANSLATION
 SAU_faisalite_score_interventionist_desc: "Intervencionismus využívá summity, finanční podporu a vojenské poradce k postavení Rijádu do čela ummy. Současně mohou probíhat dvě intervencionistické směrnice a každá přinese výsledek až po dokončení; udržujte toto skóre nad skóre §Oizolacionistů§!, abyste odemkli poslední pilíř §RTřetí cesta§!." # todo: NEW TRANSLATION
 SAU_faisalite_score_isolationist: "§OIzolacionisté§!   §Y[?SAU_faisalite_isolationist|0]§!" # todo: NEW TRANSLATION
 SAU_faisalite_score_isolationist_desc: "Izolacionismus soustřeďuje saúdskou politiku na hranice, náboženství a ropu a vyhýbá se zahraničním závazkům. Současně mohou probíhat dvě izolacionistické směrnice a každá přinese výsledek až po dokončení; udržujte toto skóre nad skóre §Rintervencionistů§!, abyste odemkli poslední pilíř §OSkvělá izolace§!." # todo: NEW TRANSLATION
 SAU_faisalite_sermons: "Šířit kázání" # todo: NEW TRANSLATION
 SAU_faisalite_sermons_desc: "Znovu vydejte nahrané Faisalovy projevy a distribuujte jejich přepisy mezi kruhy Národní gardy. Kampaň oživí jeho politickou doktrínu, přestože ministerstvo pochopí její důsledky pro současnou vládu." # todo: NEW TRANSLATION
 SAU_Foregin_affairs_category: "§GSaúdské zahraniční záležitosti§!" # todo: NEW TRANSLATION
 SAU_Foreign_affairs_unlocked: "§HZahraniční záležitosti odemčeny§!" # todo: NEW TRANSLATION
 SAU_Foreign_affairs_unlocked_desc: "Ministerstvo zahraničí je opět podřízeno Království. Níže uvedená rozhodnutí jsou k dispozici." # todo: NEW TRANSLATION
 SAU_found_arab_comintern: "Založit arabský Komintern" # todo: NEW TRANSLATION
 SAU_found_arab_comintern_desc: "Arábie svolá komunistické státy arabského světa do jediného revolučního bloku pod vlastním vedením." # todo: NEW TRANSLATION
 SAU_fsa_foreign_fighters: "Otevřít kanál pro zahraniční bojovníky" # todo: NEW TRANSLATION
 SAU_fsa_foreign_fighters_desc: "Dovolte zahraničním dobrovolníkům cestujícím přes Perský záliv připojit se k Svobodné syrské armádě a zvýšit její dostupné lidské zdroje." # todo: NEW TRANSLATION
 SAU_fsa_send_cash: "Převést prostředky Svobodné syrské armádě" # todo: NEW TRANSLATION
 SAU_fsa_send_cash_desc: "Zřiďte tajný finanční kanál pro platy, nákupy a politickou organizaci Svobodné syrské armády." # todo: NEW TRANSLATION
 SAU_fsa_smuggle_weapons: "Pašovat zbraně povstalcům" # todo: NEW TRANSLATION
 SAU_fsa_smuggle_weapons_desc: "Přesunujte ruční zbraně přes Jordánsko, abyste posílili Svobodnou syrskou armádu proti syrské vládě." # todo: NEW TRANSLATION
 SAU_heir_mbn_maneuver: "Manévry korunního prince" # todo: NEW TRANSLATION
 SAU_heir_mbn_maneuver_desc: "Využijte pravomoci Mohammeda bin Nayefa na ministerstvu vnitra, bezpečnostní záznamy a pověst bojovníka proti terorismu k posílení jeho nároku na nástupnictví." # todo: NEW TRANSLATION
 SAU_heir_mbs_maneuver: "Manévry mladého prince" # todo: NEW TRANSLATION
 SAU_heir_mbs_maneuver_desc: "Převeďte další pravomoci na Mohammeda bin Salmana a odstraňte úředníky, kteří se staví proti jeho nároku na nástupnictví." # todo: NEW TRANSLATION
 SAU_heir_rally_support: "Shromáždit podporu pro dědice" # todo: NEW TRANSLATION
 SAU_heir_rally_support_desc: "Setkejte se s vysokými princi a informujte vlivné redaktory, abyste před formálním oznámením nástupnictví vybudovali podporu pro zvoleného dědice." # todo: NEW TRANSLATION
 SAU_heir_undermine_mbn: "Podkopat Mohammeda bin Nayefa" # todo: NEW TRANSLATION
 SAU_heir_undermine_mbn_desc: "Šiřte obavy o zdraví a vytrvalosti Mohammeda bin Nayefa i o jeho blízký vztah se Spojenými státy, abyste oslabili jeho podporu u dvora." # todo: NEW TRANSLATION
 SAU_heir_undermine_mbs: "Podkopat Mohammeda bin Salmana" # todo: NEW TRANSLATION
 SAU_heir_undermine_mbs_desc: "Zdůrazňujte vedení války v Jemenu Mohammedem bin Salmanem, jeho vysoké výdaje a spory s vysokými princi, abyste oslabili jeho podporu u dvora." # todo: NEW TRANSLATION
 SAU_houthi_break_ceasefire: "Porušit saúdské příměří" # todo: NEW TRANSLATION
 SAU_houthi_break_ceasefire_desc: "Děla Království ztichla, ale válka není vyhrána. Zrušte příměří a obnovte ofenzivu proti Saúdům." # todo: NEW TRANSLATION
 SAU_if_cross_border_raid: "Přeshraniční nájezd" # todo: NEW TRANSLATION
 SAU_if_cross_border_raid_desc: "Zahajte ozbrojený vpád proti izraelským vojenským skladům a předsunutým stanovištím. Nejodvážnější možnost, která s největší pravděpodobností vyvolá prudkou odpověď." # todo: NEW TRANSLATION
 SAU_if_rocket_barrage: "Raketová palba na izraelská města" # todo: NEW TRANSLATION
 SAU_if_rocket_barrage_desc: "Nařiďte frontě odpálit rakety na izraelská města, narušit ekonomiku a donutit obyvatelstvo ukrýt se v krytech." # todo: NEW TRANSLATION
 SAU_if_suicide_bombing: "Spustit bombardovací kampaň" # todo: NEW TRANSLATION
 SAU_if_suicide_bombing_desc: "Nařiďte buňkám fronty provést sebevražedné atentáty v izraelských městech, snížit veřejnou morálku a zvýšit izraelské bezpečnostní náklady." # todo: NEW TRANSLATION
 SAU_intel_counterintel_sweep: "Protišpionážní razie" # todo: NEW TRANSLATION
 SAU_intel_counterintel_sweep_desc: "GIP se na jednu sezónu obrátí dovnitř – bezpečné domy odhaleny, šifranté vystřídáni a každý zahraniční agent v Království dostane důvod mlčet.\n\n§GPotlačí zahraniční podvracení a posílí naše šifry na 90 dní§! a po skončení potěší zpravodajskou komunitu.\n\n§YOpakovatelné§! – razie vydrží jen tak dlouho, jak dlouho je budete provádět." # todo: NEW TRANSLATION
 SAU_intel_counterterror: "Ředitelství pro boj proti terorismu" # todo: NEW TRANSLATION
 SAU_intel_counterterror_desc: "Koordinujte razie a zpravodajské operace proti al-Káidě a džihádistickým buňkám. Zásah posílí stabilitu a sjednotí rod Saúdů za GIP, přičemž přímo udeří na zahraniční bojovníky působící v Království." # todo: NEW TRANSLATION
 SAU_intel_expand_gip: "Rozšířit Generální zpravodajské předsednictvo" # todo: NEW TRANSLATION
 SAU_intel_expand_gip_desc: "Nové stanice, nové krytí, nové výcvikové nábory. Předsednictvo nenajme člověka a neskončí – vybuduje místo, kam ho umístí.\n\n§GPermanentně přidá slot pro agenta§!, takže Království může natrvalo udržovat v terénu dalšího důstojníka.\n\n§YOpakovatelné až 3krát.§!" # todo: NEW TRANSLATION
 SAU_intel_foreign_stations: "Síť zahraničních stanic" # todo: NEW TRANSLATION
 SAU_intel_foreign_stations_desc: "Otevřete stanice GIP v zahraničí, abyste zatlačili íránský vliv a rozšířili dosah Saúdské Arábie v regionu." # todo: NEW TRANSLATION
 SAU_intel_mabahith: "Posílit Mabáhith" # todo: NEW TRANSLATION
 SAU_intel_mabahith_desc: "Rozšiřte dohled a operace Mabáhith proti domácímu nesouhlasu. Větší vnitřní kontrola zlepší stabilitu a podporu náboženského establishmentu." # todo: NEW TRANSLATION
 SAU_intel_surveillance_tech: "Získat pokročilou sledovací technologii" # todo: NEW TRANSLATION
 SAU_intel_surveillance_tech_desc: "Místo čekání na vlastní inženýry Království GIP rovnou nakoupí monitorovací a analytické systémy a nechá je nainstalovat zahraničními dodavateli.\n\n§GNainstaluje počítače agentury okamžitě§!, §Ybez výzkumu a institucionální přípravy, kterou by agentura běžně vyžadovala§!.\n\n§RZa zkratku zaplatíte§! – je dražší než vlastní výstavba a lze ji využít jen jednou." # todo: NEW TRANSLATION
 SAU_Intelligence_category: "§GVšeobecné zpravodajské předsednictvo§!" # todo: NEW TRANSLATION
 SAU_islamic_rivalry_close: "Pozastavit kampaň proti Íránu" # todo: NEW TRANSLATION
 SAU_islamic_rivalry_close_desc: "Tiše ukončete kampaň. Uzavře rozhodnutí Islámské rivality, dokud je znovu neotevřete." # todo: NEW TRANSLATION
 SAU_islamic_rivalry_open: "Zahájit kampaň proti Íránu" # todo: NEW TRANSLATION
 SAU_islamic_rivalry_open_desc: "Uveďte aparát Království do pohybu proti Teheránu. Otevře rozhodnutí Islámské rivality." # todo: NEW TRANSLATION
 SAU_isr_talks_backchannel: "Otevřít tajný komunikační kanál" # todo: NEW TRANSLATION
 SAU_isr_talks_backchannel_desc: "Využijte prostředníky ve třetích zemích ke zjištění podmínek, které by Izrael mohl přijmout, než kterákoli vláda zahájí veřejná jednání." # todo: NEW TRANSLATION
 SAU_isr_talks_clock: "Uzavřít jednání s Izraelem" # todo: NEW TRANSLATION
 SAU_isr_talks_clock_desc: "Od okamžiku, kdy Izrael souhlasí s jednáním, běží lhůta 120 dní. Izrael musí přijmout Arabskou mírovou iniciativu a alespoň jednu další oblast jednání, než ji uzavře trpělivost, politika a nepřátelé regionu." # todo: NEW TRANSLATION
 SAU_isr_talks_palestine: "Nabídnout Arabskou mírovou iniciativu" # todo: NEW TRANSLATION
 SAU_isr_talks_palestine_desc: "Písemně předložte iniciativu z roku 2002: úplnou normalizaci s arabským světem výměnou za nezávislý palestinský stát v hranicích z roku 1967." # todo: NEW TRANSLATION
 SAU_isr_talks_sweeten: "Vylepšit nabídku" # todo: NEW TRANSLATION
 SAU_isr_talks_sweeten_desc: "Nabídněte investice, otevřené nebe a přístup na trh Perského zálivu jako ekonomické pobídky k uzavření dohody." # todo: NEW TRANSLATION
 SAU_isr_talks_us_mediation: "Přizvat Washington" # todo: NEW TRANSLATION
 SAU_isr_talks_us_mediation_desc: "Požádejte Spojené státy, aby jednání garantovaly a využily svého vlivu na Izrael k podpoře dohody." # todo: NEW TRANSLATION
 SAU_junta_address_the_nation: "Promluvit k národu" # todo: NEW TRANSLATION
 SAU_junta_address_the_nation_desc: "Nechte významného člena Rady vystoupit v televizním projevu, který vysvětlí novou vládu a její program. Projev část veřejnosti ujistí, že stát zůstává pod účinnou kontrolou." # todo: NEW TRANSLATION
 SAU_junta_category: "Nejvyšší vojenská rada" # todo: NEW TRANSLATION
 SAU_junta_control_readout: "§HKontrola§! §W[?SAU_junta_control|0]§!" # todo: NEW TRANSLATION
 SAU_junta_control_readout_desc: "Kontrola měří schopnost Rady prosazovat své rozkazy prostřednictvím posádek, kontrolních stanovišť, zpravodajských spisů a loajálního personálu. Každý měsíc klesá o jednu a dočasné programy Rady při spuštění spotřebovávají další kontrolu." # todo: NEW TRANSLATION
 SAU_junta_legitimacy_crisis: "Rada se musí zodpovídat" # todo: NEW TRANSLATION
 SAU_junta_legitimacy_crisis_desc: "Rada přišla o svou zbývající legitimitu a podpora duchovních i provinčních úřadů se začíná hroutit. Má šest měsíců na dohodu s důstojníky, řešení kmenových požadavků a obnovení svého postavení na §H20§!.\n\n§RPokud uplyne sto osmdesát dní bez dosažení této hranice, Království vstoupí do otevřeného konfliktu.§!" # todo: NEW TRANSLATION
 SAU_junta_legitimacy_readout: "§HLegitimita§! §W[?SAU_junta_legitimacy|0]§!" # todo: NEW TRANSLATION
 SAU_junta_legitimacy_readout_desc: "Legitimita měří přijetí Rady, za níž nestojí volby, fatva ani zákonné nástupnictví. Každý měsíc klesá o jednu a po dosažení nuly má Rada 180 dní na návrat k hodnotě 20." # todo: NEW TRANSLATION
 SAU_junta_reinforce_garrisons: "Posílit posádky" # todo: NEW TRANSLATION
 SAU_junta_reinforce_garrisons_desc: "Rozmístěte další prapory v provinčních hlavních městech, plně obsadťe kontrolní stanoviště a obnovte vojenské spojení mezi Rijádem a posádkami." # todo: NEW TRANSLATION
 SAU_junta_standing_readout: "§HPostavení§! [ROOT.GetSAUJuntaStanding]" # todo: NEW TRANSLATION
 SAU_junta_standing_readout_desc: "[ROOT.GetSAUJuntaStandingEffect]" # todo: NEW TRANSLATION
 SAU_junta_tour_the_provinces: "Procestovat provincie" # todo: NEW TRANSLATION
 SAU_junta_tour_the_provinces_desc: "Pošlete zástupce Rady na setkání s místními vůdci v Burajdě, Džiddě, Džizánu a vnitrozemí. Naslouchání stížnostem a financování místních požadavků zlepší provinční podporu." # todo: NEW TRANSLATION
 SAU_king_abdullah_category: "Král Abdullah bin Abdulaziz" # todo: NEW TRANSLATION
 SAU_king_mbn_category: "Král Mohammed bin Nayef" # todo: NEW TRANSLATION
 SAU_king_mbs_category: "Král Mohammed bin Salman" # todo: NEW TRANSLATION
 SAU_king_mutaib_category: "Král Mutaib bin Abdullah" # todo: NEW TRANSLATION
 SAU_king_salman_category: "Král Salman bin Abdulaziz" # todo: NEW TRANSLATION
 SAU_mbn_border_surveillance: "Posílit sledovací sítě pohraniční stráže" # todo: NEW TRANSLATION
 SAU_mbn_border_surveillance_desc: "Nainstalujte věže, senzorové ploty a termální kamery podél jemenských a iráckých hranic, abyste zlepšili odhalování neoprávněných přechodů." # todo: NEW TRANSLATION
 SAU_mbn_mabahith_campaign: "Povolit kampaň Mabáhith proti podvracení" # todo: NEW TRANSLATION
 SAU_mbn_mabahith_campaign_desc: "Pověřte Generální vyšetřovací ředitelství rozbitím podezřelých podvratných sítí v celém Království. Kampaň rovněž zadrží některé osoby, jejichž zapojení je nejisté." # todo: NEW TRANSLATION
 SAU_mbn_maneuver: "Manévry frakce bin Nayefa" # todo: NEW TRANSLATION
 SAU_mbn_maneuver_desc: "Bezpečnostní služby pracují na prosazení nároku Mohammeda bin Nayefa a mohou obrátit dvůr proti vašemu vlastnímu kandidátovi." # todo: NEW TRANSLATION
 SAU_mbn_rehabilitation_center: "Aktivovat rehabilitační centrum prince Nayefa" # todo: NEW TRANSLATION
 SAU_mbn_rehabilitation_center_desc: "Umístěte zadržené do rehabilitačního programu zahrnujícího duchovní, psychology a jejich rodiny. Program může snížit recidivu, ačkoli někteří účastníci se vrátí k militantní činnosti." # todo: NEW TRANSLATION
 SAU_mbn_special_security_forces: "Nasadit speciální bezpečnostní síly ministerstva vnitra" # todo: NEW TRANSLATION
 SAU_mbn_special_security_forces_desc: "Nasadit speciální bezpečnostní síly ministerstva vnitra ve velkých městech, čímž ministrovi poskytnete ozbrojenou sílu nezávislou na pravidelné armádě." # todo: NEW TRANSLATION
 SAU_mbn_western_intel_networks: "Aktivovat západní společné zpravodajské sítě" # todo: NEW TRANSLATION
 SAU_mbn_western_intel_networks_desc: "Rozšiřte zpravodajské styky mezi Rijádem, CIA a britskými službami. Saúdská Arábie bude výměnou za lepší přístup k západním zpravodajským informacím sdílet citlivá data." # todo: NEW TRANSLATION
 SAU_mbs_anticorruption_drive: "Provést protikorupční tažení" # todo: NEW TRANSLATION
 SAU_mbs_anticorruption_drive_desc: "Zadržte prince a podnikatele v luxusním hotelu a vyžadujte finanční vyrovnání se státem. Tím vrátíte prostředky do státní pokladny a ukážete kontrolu korunního prince nad elitou." # todo: NEW TRANSLATION
 SAU_mbs_aramco_liquidity: "Strategické přidělení likvidity Aramca" # todo: NEW TRANSLATION
 SAU_mbs_aramco_liquidity_desc: "Převeďte část dostupného kapitálu Aramca do programů kontrolovaných korunním princem a omezte roli představenstva při rozhodování." # todo: NEW TRANSLATION
 SAU_mbs_gami_localization: "Mobilizovat lokalizaci obrany GAMI" # todo: NEW TRANSLATION
 SAU_mbs_gami_localization_desc: "Vyžadujte, aby zahraniční obranní dodavatelé utratili polovinu rozpočtů na nákupy v Království, jinak ztratí přístup k saúdským zakázkám." # todo: NEW TRANSLATION
 SAU_mbs_pif_neom: "Přidělit financování PIF na NEOM a průkopnické projekty" # todo: NEW TRANSLATION
 SAU_mbs_pif_neom_desc: "Přidělte kapitál Veřejného investičního fondu na projekty lineárního města NEOM, přístavu a horského letoviska navzdory jejich vysokým technickým a finančním rizikům." # todo: NEW TRANSLATION
 SAU_mbs_vision2030_blitz: "Spustit bleskovou kampaň Vize 2030" # todo: NEW TRANSLATION
 SAU_mbs_vision2030_blitz_desc: "Spusťte koordinovanou reklamní a konferenční kampaň na vybudování veřejné a institucionální podpory pro Vizi 2030." # todo: NEW TRANSLATION
 SAU_military_category: "§HModernizace ozbrojených sil§!" # todo: NEW TRANSLATION
 SAU_militia_back_dflp: "Financovat Demokratickou frontu" # todo: NEW TRANSLATION
 SAU_militia_back_dflp_desc: "Financujte sekulární palestinské frakce jako protiváhu konkurenčním hnutím a zvyšte saúdský vliv v palestinské politice." # todo: NEW TRANSLATION
 SAU_militia_back_hamas: "Financovat Hamás" # todo: NEW TRANSLATION
 SAU_militia_back_hamas_desc: "Poskytněte Hamásu peníze, zbraně a rekruty výměnou za užší spojenectví s Rijádem namísto s Teheránem." # todo: NEW TRANSLATION
 SAU_militia_islamic_front: "Vytvořit islámistickou frontu loajální Saúdské Arábii" # todo: NEW TRANSLATION
 SAU_militia_islamic_front_desc: "Vytvořte a financujte novou islamistickou frakci, jejíž organizace a velení zůstanou závislé na saúdské podpoře." # todo: NEW TRANSLATION
 SAU_mod_abrams_gunnery: "Výcvik střelby z Abramsů" # todo: NEW TRANSLATION
 SAU_mod_abrams_gunnery_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! hlavní bojový tank M1A2 Abrams.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze I – dokončete všechny tři reformy fáze I k odemčení fáze II.]§!" # todo: NEW TRANSLATION
 SAU_mod_apache_training: "Výcvik bojových vrtulníků Apache" # todo: NEW TRANSLATION
 SAU_mod_apache_training_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! armádní letectvo a bojové vrtulníky Apache.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze II – dokončete všechny tři reformy fáze II k odemčení fáze III.]§!" # todo: NEW TRANSLATION
 SAU_mod_artillery_livefire: "Dělostřelecké cvičení s ostrou municí" # todo: NEW TRANSLATION
 SAU_mod_artillery_livefire_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! samohybné dělostřelectvo M109.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze II – dokončete všechny tři reformy fáze II k odemčení fáze III.]§!" # todo: NEW TRANSLATION
 SAU_mod_awacs_battle: "Výcvik řízení vzdušné bitvy AWACS" # todo: NEW TRANSLATION
 SAU_mod_awacs_battle_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! AWACS E-3 Sentry.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze III – poslední série.]§!" # todo: NEW TRANSLATION
 SAU_mod_complete: "Fáze III: Dosáhnout plně moderních sil" # todo: NEW TRANSLATION
 SAU_mod_complete_desc: "§HFáze III ze III – plně moderní síly.§!\n\n§RToto zůstane uzamčeno, dokud nedokončíte všechny tři reformy fáze II:§!\n  §Y- Dělostřelecké cvičení s ostrou municí\n  - Výcvik bojových vrtulníků Apache\n  - Společné cvičení loďstva§!\n(v každé zvolte doktrínu).\n\n§GCo se stane:§! ozbrojené síly dosáhnou stavu §GPlně modernizované§! – skutečné protiváhy Íránu – a objeví se poslední reformy: §Yspeciální síly, AWACS a přesné údery§!. Spustí se jednou." # todo: NEW TRANSLATION
 SAU_mod_construction: "Podpořit průmyslovou výstavbu" # todo: NEW TRANSLATION
 SAU_mod_construction_desc: "Financujte nové továrny a silnice ve Východní provincii, abyste rozšířili průmyslovou kapacitu v hlavním regionu těžby ropy." # todo: NEW TRANSLATION
 SAU_mod_devfund: "Kapitalizovat Rozvojový fond" # todo: NEW TRANSLATION
 SAU_mod_devfund_desc: "Obdařte národní rozvojový fond a otevřete novou stavební kapacitu ve Východní provincii." # todo: NEW TRANSLATION
 SAU_mod_fleet_exercise: "Společné cvičení loďstva" # todo: NEW TRANSLATION
 SAU_mod_fleet_exercise_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! Královské saúdské námořní síly.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze II – dokončete všechny tři reformy fáze II k odemčení fáze III.]§!" # todo: NEW TRANSLATION
 SAU_mod_gulf_lessons: "Válečné hry: Poučení z Perského zálivu" # todo: NEW TRANSLATION
 SAU_mod_gulf_lessons_desc: "Uspořádejte velké cvičení k otestování armády proti tvrdým lekcím roku 1991 a rozhodněte, podle jakého modelu ji znovu vybudovat.\n\n§YOdemkne:§! Poučení z války v Perském zálivu.\n§GOdemkne výběr ze čtyř doktrín§! – americké, GCC, NATO nebo domácí – každé s vlastními silnými stránkami a nevýhodou. Později válečné hry zopakujte a §Yzměňte doktrínu§!." # todo: NEW TRANSLATION
 SAU_mod_modernize: "Fáze II: Modernizovat bojové jednotky" # todo: NEW TRANSLATION
 SAU_mod_modernize_desc: "§HFáze II ze III – přezbrojení bojových jednotek.§!\n\n§RToto zůstane uzamčeno, dokud nedokončíte všechny tři reformy fáze I:§!\n  §Y- Cvičení připravenosti Národní gardy\n  - Výcvik střelby z Abramsů\n  - Letecký bojový výcvik Red Flag§!\n(v každé zvolte doktrínu).\n\n§GCo se stane:§! ozbrojené síly přejdou ze stavu §YV reformě§! do stavu §YModernizace§! a objeví se tři nové reformy – §Ydělostřelectvo, Apache a společné loďstvo§!. Než se odemkne §Yfáze III§!, musíte dokončit všechny tři. Spustí se jednou." # todo: NEW TRANSLATION
 SAU_mod_pgm_doctrine: "Kurz doktríny přesných úderů" # todo: NEW TRANSLATION
 SAU_mod_pgm_doctrine_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! přesně naváděnou munici.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze III – poslední série.]§!" # todo: NEW TRANSLATION
 SAU_mod_red_flag: "Letecký bojový výcvik Red Flag" # todo: NEW TRANSLATION
 SAU_mod_red_flag_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! Královské saúdské letectvo.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze I – dokončete všechny tři reformy fáze I k odemčení fáze II.]§!" # todo: NEW TRANSLATION
 SAU_mod_reform: "Fáze I: Zahájit reformní program" # todo: NEW TRANSLATION
 SAU_mod_reform_desc: "§HFáze I ze III – první etapa modernizace.§!\n\n§GJak ji spustit:§! dokončete fokus §YGenerální štáb§! a poté vyhrajte §YVálečné hry: Poučení z Perského zálivu§! (zvolte doktrínu války v Perském zálivu).\n\n§GCo se stane:§! ozbrojené síly přejdou ze stavu §RNemodernizované§! do stavu §YV reformě§! a objeví se tři nové reformy – §YNárodní garda, Abrams a Red Flag§!.\n\n§RDůležité:§! poté musíte dokončit §Rvšechny tři§! reformy, než se odemkne §Yfáze II§!. Spustí se jednou." # todo: NEW TRANSLATION
 SAU_mod_sang_drills: "Cvičení připravenosti Národní gardy" # todo: NEW TRANSLATION
 SAU_mod_sang_drills_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! Saúdskou arabskou národní gardu.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze I – dokončete všechny tři reformy fáze I k odemčení fáze II.]§!" # todo: NEW TRANSLATION
 SAU_mod_sf_selection: "Výběrový kurz speciálních sil" # todo: NEW TRANSLATION
 SAU_mod_sf_selection_desc: "Proveďte program, který určí, jak bude tato část ozbrojených sil bojovat.\n\n§YOdemkne:§! velení speciálních sil.\n§GOdemkne výběr ze tří doktrín§!, každé se silnou stránkou a nevýhodou. Později program spusťte znovu a §Yzměňte§! volbu. §H[Reforma fáze III – poslední série.]§!" # todo: NEW TRANSLATION
 SAU_mod_workforce: "Vyškolit národní pracovní sílu" # todo: NEW TRANSLATION
 SAU_mod_workforce_desc: "Odborné programy zapojí více Saúdů do kvalifikované práce, stabilizují společnost a posílí národní morálku." # todo: NEW TRANSLATION
 SAU_mutaib_capital_garrison: "Posílit systém posádek v hlavním městě" # todo: NEW TRANSLATION
 SAU_mutaib_capital_garrison_desc: "Zřiďte kolem Rijádu kontrolní stanoviště Národní gardy, obrněná postavení a nezávislé spojení. Ochráníte tím hlavní město a posílíte kontrolu gardy nad ním." # todo: NEW TRANSLATION
 SAU_mutaib_janadriyah_festival: "Uspořádat národní festival dědictví Džanádiríja" # todo: NEW TRANSLATION
 SAU_mutaib_janadriyah_festival_desc: "Nechte Národní gardu pořádat festival Džanádiríja s velbloudími závody, tancem s meči, poezií a televizními kmenovými obřady. Událost posílí Mutaibovy vazby na kmenové vůdce." # todo: NEW TRANSLATION
 SAU_mutaib_maneuver: "Manévry Mutaibovy frakce" # todo: NEW TRANSLATION
 SAU_mutaib_maneuver_desc: "Národní garda pracuje na prosazení Mutaibova nároku a může obrátit dvůr proti vašemu vlastnímu kandidátovi." # todo: NEW TRANSLATION
 SAU_mutaib_sang_logistics: "Autonomní logistika SANG" # todo: NEW TRANSLATION
 SAU_mutaib_sang_logistics_desc: "Vytvořte nezávislý zásobovací systém Národní gardy namísto spoléhání na sklady pravidelné armády. Logistická autonomie zvýší operační a politickou nezávislost gardy." # todo: NEW TRANSLATION
 SAU_mutaib_sang_procurement: "Urychlit letecké a obrněné nákupy SANG" # todo: NEW TRANSLATION
 SAU_mutaib_sang_procurement_desc: "Upřednostněte vrtulníky Apache a obrněná vozidla pro Národní gardu před objednávkami pravidelné armády, včetně samostatné letecké složky gardy." # todo: NEW TRANSLATION
 SAU_mutaib_tribal_reserves: "Mobilizovat kmenové zálohy SANG" # todo: NEW TRANSLATION
 SAU_mutaib_tribal_reserves_desc: "Vyzvěte kmenové šejky, aby poskytli placený záložní personál Národní gardě v rámci zavedeného odvodového systému." # todo: NEW TRANSLATION
 SAU_officer_crisis_category: "Stížnost důstojníků" # todo: NEW TRANSLATION
 SAU_officer_grievance_readout: "Důstojnický sbor: [ROOT.GetSAUArmyGrievance]" # todo: NEW TRANSLATION
 SAU_officer_grievance_readout_desc: "§HStížnost§!: §Y[?SAU_army_grievance|0]§! ze §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n\nTato položka zobrazuje současnou úroveň stížností a nemá žádný účinek na rozhodnutí." # todo: NEW TRANSLATION
 SAU_officers_pay_arrears: "Vyplatit nedoplatky" # todo: NEW TRANSLATION
 SAU_officers_pay_arrears_desc: "Vyplaťte jedenáct měsíců příplatků, příspěvků na bydlení a odložených mezd v jediném zpětném převodu. Poskytnete tím dočasnou úlevu, aniž byste vyřešili příčinu stížnosti důstojníků.\n\n§G-20 stížností§!, §R-12 miliard $§!, opakovatelné každých 60 dní." # todo: NEW TRANSLATION
 SAU_officers_promote_colonels: "Povýšit plukovníky" # todo: NEW TRANSLATION
 SAU_officers_promote_colonels_desc: "Svěřte velení brigád zkušeným profesionálním důstojníkům namísto jejich vyhrazení pro prince. Změna posílí důvěru sboru v povyšování podle zásluh.\n\n§G-15 stížností§!, §G+2% stabilita§!, opakovatelné každých 90 dní." # todo: NEW TRANSLATION
 SAU_officers_restore_defence_budget: "Obnovit rozpočet obrany" # todo: NEW TRANSLATION
 SAU_officers_restore_defence_budget_desc: "Obnovte financování odebrané pravidelným silám a převeďte náklady do rozpočtu Národní gardy. Tím řešíte hlavní příčinu stížností důstojníků.\n\n§G-25 stížností§!, §R-25 miliard $§!, a garda přestane být chráněna, takže stížnosti porostou poloviční rychlostí; lze provést jednou." # todo: NEW TRANSLATION
 SAU_officers_settle_for_good: "Urovnat spor s důstojníky" # todo: NEW TRANSLATION
 SAU_officers_settle_for_good_desc: "Zřiďte komisi vybranou důstojníky, zveřejněte rozvrh povyšování a nechte krále osobně schválit dohodu. Dokončit ji lze až po odstranění všech nevyřešených stížností.\n\n§GTrvale ukončí krizi a zabrání převratu§!; vyžaduje stížnosti na hodnotě §Y0§!." # todo: NEW TRANSLATION
 SAU_oil_conserve: "Šetřit rezervy" # todo: NEW TRANSLATION
 SAU_oil_conserve_desc: "Snižte těžbu a uchovejte zásoby pro budoucí využití. Obětujete tím současné příjmy, ale §Gsnížíte závislost ekonomiky na ropě§! a zlepšíte stabilitu." # todo: NEW TRANSLATION
 SAU_oil_embargo: "Vyhlásit ropné embargo" # todo: NEW TRANSLATION
 SAU_oil_embargo_desc: "Opakujte politiku z roku §H1973§! ukončením vývozu ropy do §LZápadu a zemí přátelských Izraeli§!, konkrétně do §LSpojených států, Británie, Francie, Německa a Nizozemska§!. Jejich ekonomiky utrpí nabídkovým šokem, zatímco Saúdská Arábie získá podporu v arabských a muslimských zemích.\n\nKrálovství přijde o západní příjmy z vývozu a poškodí vztahy s Washingtonem, ale získá §Hprestiž, jednotu a požehnání duchovenstva§!." # todo: NEW TRANSLATION
 SAU_oil_increase_output: "Zvýšit těžbu ropy" # todo: NEW TRANSLATION
 SAU_oil_increase_output_desc: "Zvyšte těžbu surové ropy ve Východní provincii pro §Gvíce ropy a okamžité příjmy§!. Ekonomika se tím zároveň stane §Rzávislejší§! na vývozu ropy." # todo: NEW TRANSLATION
 SAU_oil_new_field: "Rozvinout nové ropné pole" # todo: NEW TRANSLATION
 SAU_oil_new_field_desc: "Financujte průzkum a nové vrty v Prázdné čtvrti. Projekt přidá velké §Gro pné ložisko§!, ale zvýší závislost Království na ropě." # todo: NEW TRANSLATION
 SAU_oil_new_field_tt: "§GNové ložisko bylo potvrzeno§! – v jedné z provincií Království se objeví §Y+15 ropy§!, za cenu §R150 miliard $§!" # todo: NEW TRANSLATION
 SAU_opec_cut_production: "Omezit těžbu ropy" # todo: NEW TRANSLATION
 SAU_opec_cut_production_desc: "Využijte postavení Saúdské Arábie jako producenta OPECu vyrovnávajícího trh ke snížení těžby a §Gzvýšení světové ceny ropy§!, čímž zvýšíte příjmy za barel. Použitelné každých 180 dní." # todo: NEW TRANSLATION
 SAU_opec_flood_market: "Zaplavit trh ropou" # todo: NEW TRANSLATION
 SAU_opec_flood_market_desc: "Zvyšte těžbu natolik, abyste §Rsnížili světovou cenu ropy§!. Saúdská Arábie krátkodobě přijde o příjmy, ale konkurenční vývozci (§LRusko, Írán, Irák, Venezuela§!) utrpí větší ekonomické ztráty. Použitelné jednou ročně." # todo: NEW TRANSLATION
 SAU_operation_decisive_storm: "Operace Rozhodná bouře (Amaliyat Asifat al-Hazm)" # todo: NEW TRANSLATION
 SAU_operation_decisive_storm_desc: "Zahajte §YAmaliyat Asifat al-Hazm§!, koaliční leteckou kampaň proti území ovládanému Húsií v Jemenu. Saúdská letadla zaútočí na pozice Húsiů, ochrání vládní síly a odemknou pokračující podporu jemenské armádě." # todo: NEW TRANSLATION
 SAU_pal_aid_package: "Balíček pomoci Palestincům" # todo: NEW TRANSLATION
 SAU_pal_aid_package_desc: "Poskytujte čtvrtletní saúdské financování platů Palestinské samosprávy, nemocnic, veřejných služeb a obnovy v Ramalláhu." # todo: NEW TRANSLATION
 SAU_pal_fund_development: "Financovat palestinský rozvoj" # todo: NEW TRANSLATION
 SAU_pal_fund_development_desc: "Financujte silnice, školy a kliniky napříč palestinskými územími, abyste zlepšili životní podmínky a podpořili životaschopné dvoustátní řešení." # todo: NEW TRANSLATION
 SAU_pal_invest_gaza: "Investovat v Gaze a na Západním břehu" # todo: NEW TRANSLATION
 SAU_pal_invest_gaza_desc: "Investujte do továren a infrastruktury v Gaze a na Západním břehu, abyste vytvořili pracovní místa a snížili podporu militantních skupin." # todo: NEW TRANSLATION
 SAU_pc_convene: "Svolat Lidovou radu" # todo: NEW TRANSLATION
 SAU_pc_convene_desc: "Svolejte sněmovnu a dejte každému bloku s dostatkem mandátů tři týdny na předložení návrhu zákona. Po jeho předložení jej král musí ratifikovat, nebo vetovat; ratifikace posílí sponzorující blok, zatímco veto jej oslabí.\n\nOpakovatelné každých 90 dní." # todo: NEW TRANSLATION
 SAU_pc_convene_tt: "Otevře jednání – blok s §Y21+ mandáty§! může během §Y21 dní§! předložit návrh zákona" # todo: NEW TRANSLATION
 SAU_pc_dissolve: "Rozpustit Lidovou radu" # todo: NEW TRANSLATION
 SAU_pc_dissolve_desc: "Rozpusťte Lidovou radu královským výnosem bez stanovení data jejího návratu.\n\n§R-10% stabilita, -8% podpora války§!, §G+150 politické moci§!. Nelze vrátit zpět." # todo: NEW TRANSLATION
 SAU_pc_enact_provincial: "Přijmout zákon provincií" # todo: NEW TRANSLATION
 SAU_pc_enact_provincial_desc: "Proveďte ratifikované saúdské pracovní kvóty, reformu sponzorského systému a nezávislý inspektorát navzdory odporu hlavních obchodních zájmů.\n\n§HPostavení§! měří veřejnou autoritu Lidové rady; §Groste§!, když je návrh projednán a přijat, a §Rklesá§! po vetu, zanedbání nebo vypršení návrhu. Pod hodnotou §Y40§! Rada nedokáže prosadit zákon prostřednictvím ministerstev." # todo: NEW TRANSLATION
 SAU_pc_enact_provincial_tt: "Vyžaduje §Y300 politické moci§! a Rada musí návrh stále podporovat – její §Hpostavení§! musí být nad §Y40§! (nyní §Y[?SAU_pc_standing|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_pc_enact_reformist: "Přijmout zákon reformistů" # todo: NEW TRANSLATION
 SAU_pc_enact_reformist_desc: "Proveďte ratifikovaný reformistický zákon pověřením ministerstev přípravou jeho předpisů, harmonogramů a rozpočtu.\n\n§HPostavení§! měří veřejnou autoritu Lidové rady; §Groste§!, když je návrh projednán a přijat, a §Rklesá§! po vetu, zanedbání nebo vypršení návrhu. Pod hodnotou §Y40§! Rada nedokáže prosadit zákon prostřednictvím ministerstev." # todo: NEW TRANSLATION
 SAU_pc_enact_reformist_tt: "Vyžaduje §Y300 politické moci§! a Rada musí návrh stále podporovat – její §Hpostavení§! musí být nad §Y40§! (nyní §Y[?SAU_pc_standing|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_pc_enact_traditionalist: "Přijmout zákon tradicionalistů" # todo: NEW TRANSLATION
 SAU_pc_enact_traditionalist_desc: "Proveďte ratifikovaný program náboženských nadací, příspěvků na bydlení a provinčních klinik prostřednictvím odpovědných ministerstev.\n\n§HPostavení§! měří veřejnou autoritu Lidové rady; §Groste§!, když je návrh projednán a přijat, a §Rklesá§! po vetu, zanedbání nebo vypršení návrhu. Pod hodnotou §Y40§! Rada nedokáže prosadit zákon prostřednictvím ministerstev." # todo: NEW TRANSLATION
 SAU_pc_enact_traditionalist_tt: "Vyžaduje §Y300 politické moci§! a Rada musí návrh stále podporovat – její §Hpostavení§! musí být nad §Y40§! (nyní §Y[?SAU_pc_standing|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_pc_public_works: "Zadávat veřejné práce" # todo: NEW TRANSLATION
 SAU_pc_public_works_desc: "Rada vybere provincii a stanoví standard §Y[?SAU_pc_req_civ|0]§! civilních továren, §Y[?SAU_pc_req_off|0]§! kanceláří a §Y[?SAU_pc_req_inf|0]§! infrastruktury, který musí vláda splnit bez bezplatné výstavby; standard se po každém úspěšném mandátu zvýší. §HDva roky na splnění§!: úspěch poskytne provincii trvalý §G+1 stavební slot, +10% rychlost výstavby a +5% lidských zdrojů§!, zatímco neúspěch §Rzastaví práce a odebere civilní továrnu§!. §YVyžaduje§! postavení Rady §G60 nebo vyšší§!; cena: §R-4 miliardy $§!." # todo: NEW TRANSLATION
 SAU_pc_readout: "Lidová rada: [ROOT.GetSAUPCBloc]" # todo: NEW TRANSLATION
 SAU_pc_readout_desc: "§HLidová rada§! – [ROOT.GetSAUPCBloc], [ROOT.GetSAUPCStanding] (§Y[?SAU_pc_standing|0]§! ze §Y100§!)\n§YReformisté§!: [?SAU_pc_reformists|0]   §YTradicionalisté§!: [?SAU_pc_traditionalists|0]   §YProvinciálové§!: [?SAU_pc_provincials|0]\n§HPoužitá královská veta§!: §Y[?SAU_pc_vetoes|0]§!\n\n§HPostavení§! měří veřejnou autoritu; §Groste§!, když je návrh projednán a přijat, §Rklesá§! po vetu, zanedbání nebo vypršení návrhu a musí zůstat na §Y40+§!, aby bylo možné prosadit zákon prostřednictvím ministerstev, nebo na §Y60+§! pro zadávání veřejných prací. Tato položka je pouze informativní a nemá žádný účinek na rozhodnutí." # todo: NEW TRANSLATION
 SAU_pc_session_clock: "Rada čeká na odpověď" # todo: NEW TRANSLATION
 SAU_pc_session_clock_desc: "Rada se sešla a kvalifikovaný blok má tři týdny na předložení zákona, než zasedání skončí bez odpovědi." # todo: NEW TRANSLATION
 SAU_pc_take_provincial_bill: "Vyslechnout provinciály" # todo: NEW TRANSLATION
 SAU_pc_take_provincial_bill_desc: "Dovolte provinčnímu bloku předložit zákon zavádějící saúdské pracovní kvóty, reformující sponzorský systém a vytvářející nezávislý pracovní inspektorát." # todo: NEW TRANSLATION
 SAU_pc_take_reformist_bill: "Vyslechnout reformisty" # todo: NEW TRANSLATION
 SAU_pc_take_reformist_bill_desc: "Dovolte reformistickému bloku mladších právníků a navrátivších se absolventů předložit zákon zaměřený na výkon vlády a institucionální reformu." # todo: NEW TRANSLATION
 SAU_pc_take_traditionalist_bill: "Vyslechnout tradicionalisty" # todo: NEW TRANSLATION
 SAU_pc_take_traditionalist_bill_desc: "Dovolte tradicionalistickému bloku předložit zákon financující náboženské nadace, příspěvky na bydlení a kliniky v nedostatečně obsluhovaných provinciích." # todo: NEW TRANSLATION
 SAU_pc_works_mandate: "Mandát Rady: [SAU_pc_works_province.GetName]" # todo: NEW TRANSLATION
 SAU_pc_works_mandate_desc: "Rada vybrala [SAU_pc_works_province.GetName] a vláda má dva roky na splnění zveřejněného rozvojového standardu. Žádná výstavba nebude poskytnuta automaticky.\n\nPožadovaný standard je v provincii §Y[?SAU_pc_req_civ|0]§! civilních továren, §Y[?SAU_pc_req_off|0]§! kanceláří a §Y[?SAU_pc_req_inf|0]§! infrastruktury." # todo: NEW TRANSLATION
 SAU_pipeline_iraq: "Evropský ropovod" # todo: NEW TRANSLATION
 SAU_pipeline_iraq_desc: "Po odstranění Saddáma vybudujte irácký úsek ropovodu směrem k turecké hranici. Než se saúdská ropa dostane do Evropy, bude nutná samostatná dohoda s Ankarou." # todo: NEW TRANSLATION
 SAU_pipeline_iraq_talks: "Zahájit jednání s Bagdádem" # todo: NEW TRANSLATION
 SAU_pipeline_iraq_talks_desc: "Požádejte Saddámovu vládu, aby navzdory nepřátelství vůči rodu Saúdů povolila saúdský ropovod přes Irák. Bagdád pravděpodobně nesouhlasí." # todo: NEW TRANSLATION
 SAU_pipeline_sabotage_category: "Sabotovat saúdské ropovody" # todo: NEW TRANSLATION
 SAU_pipeline_syria_assad: "Vyjednat levantinský ropovod" # todo: NEW TRANSLATION
 SAU_pipeline_syria_assad_desc: "Zajistěte tranzit přes Jordánsko a poté vyjednávejte s nepřátelskou Asadovou vládou o ropovodu přes Sýrii ke Středozemnímu moři. Damašek si za to vyžádá značné tranzitní poplatky a politické ústupky." # todo: NEW TRANSLATION
 SAU_pipeline_syria_fsa: "Levantinský ropovod (Svobodná Sýrie)" # todo: NEW TRANSLATION
 SAU_pipeline_syria_fsa_desc: "Zajistěte tranzit přes Jordánsko a poté nabídněte přátelské syrské vládě saúdské investice výměnou za trasu ropovodu ke Středozemnímu moři." # todo: NEW TRANSLATION
 SAU_pipeline_turkey_extend: "Prodloužit ropovod do Turecka" # todo: NEW TRANSLATION
 SAU_pipeline_turkey_extend_desc: "Vyjednávejte s Ankarou o prodloužení iráckého ropovodu do Turecka a přímém napojení saúdské ropy na evropské trhy." # todo: NEW TRANSLATION
 SAU_pipeline_yemen: "Ropovod k Arabskému moři" # todo: NEW TRANSLATION
 SAU_pipeline_yemen_desc: "Vybudujte ropovod přes spřátelený jižní Jemen a Al Mahrah k Arabskému moři. Dokud pokračuje jemenská válka, zůstane trasa zranitelná vůči narušení." # todo: NEW TRANSLATION
 SAU_proj_alula: "Vybudovat AlUlu" # todo: NEW TRANSLATION
 SAU_proj_alula_desc: "Rozvinout starověké nabatejské hrobky a oázu AlUly v reprezentativní kulturní a historickou destinaci. §Y(Cena: 50 miliard $, výstavba ~450 dní)§! §RLhůta: zbývá [?SAU_remain_alula|0] dní.§! §HPo dobu výstavby zabere 5 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_amaala: "Vybudovat Amaalu" # todo: NEW TRANSLATION
 SAU_proj_amaala_desc: "Wellness a ultraluxusní turistická enkláva na severozápadním pobřeží Rudého moře, „Riviéra Blízkého východu“. §Y(Cena: 50 miliard $, výstavba ~450 dní)§! §RLhůta: zbývá [?SAU_remain_amaala|0] dní.§! §HPo dobu výstavby zabere 5 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_diriyah: "Vybudovat Diriyah" # todo: NEW TRANSLATION
 SAU_proj_diriyah_desc: "Obnovit rodiště Království v podobě historické a kulturní čtvrti kolem města At-Turaif z nepálených cihel. §Y(Cena: 50 miliard $, výstavba ~450 dní)§! §RLhůta: zbývá [?SAU_remain_diriyah|0] dní.§! §HPo dobu výstavby zabere 5 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_green_riyadh: "Vybudovat Zelený Rijád" # todo: NEW TRANSLATION
 SAU_proj_green_riyadh_desc: "Program výsadby milionů stromů v hlavním městě, který ochladí město a zjemní poušť. §Y(Cena: 30 miliard $, výstavba ~365 dní)§! §RLhůta: zbývá [?SAU_remain_green_riyadh|0] dní.§! §HPo dobu výstavby zabere 4 civilní továrny.§!" # todo: NEW TRANSLATION
 SAU_proj_jeddah_central: "Vybudovat centrální Džiddu" # todo: NEW TRANSLATION
 SAU_proj_jeddah_central_desc: "Přestavět nábřeží Džiddy v moderní centrum s stadionem, marinou a kulturní čtvrtí. §Y(Cena: 60 miliard $, výstavba ~450 dní)§! §RLhůta: zbývá [?SAU_remain_jeddah_central|0] dní.§! §HPo dobu výstavby zabere 6 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_king_salman_park: "Vybudovat park krále Salmana" # todo: NEW TRANSLATION
 SAU_proj_king_salman_park_desc: "Vybudujte v Rijádu jeden z největších městských parků na světě. §Y(Cena: 40 miliard $, výstavba ~270 dní)§! §RLhůta: zbývá [?SAU_remain_king_salman_park|0] dní.§! §HPo dobu výstavby zabere 4 civilní továrny.§!" # todo: NEW TRANSLATION
 SAU_proj_neom: "Vybudovat NEOM" # todo: NEW TRANSLATION
 SAU_proj_neom_desc: "Rozvíjejte NEOM jako hlavní městský a průmyslový region Království po skončení ropné éry na pobřeží Rudého moře. §Y(Cena: 150 miliard $, výstavba ~730 dní)§! §RLhůta: zbývá [?SAU_remain_neom|0] dní.§! §HPo dobu výstavby zabere 10 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_new_murabba: "Vybudovat Novou Murabbu" # todo: NEW TRANSLATION
 SAU_proj_new_murabba_desc: "Nové centrum Rijádu vybudované kolem Mukaabu, krychlové věže dostatečně velké pro dvacet budov Empire State Building. §Y(Cena: 100 miliard $, výstavba ~730 dní)§! §RLhůta: zbývá [?SAU_remain_new_murabba|0] dní.§! §HPo dobu výstavby zabere 10 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_oxagon: "Vybudovat Oxagon" # todo: NEW TRANSLATION
 SAU_proj_oxagon_desc: "Vybudujte plovoucí přístav a výrobní centrum v NEOMu zaměřené na čistou energetiku. §Y(Cena: 80 miliard $, výstavba ~540 dní)§! §RLhůta: zbývá [?SAU_remain_oxagon|0] dní.§! §HPo dobu výstavby zabere 8 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_qiddiya: "Vybudovat Qiddiyu" # todo: NEW TRANSLATION
 SAU_proj_qiddiya_desc: "Zábavní, sportovní a kulturní velkoměsto u Rijádu s tematickými parky, stadiony a motoristickým okruhem. §Y(Cena: 80 miliard $, výstavba ~540 dní)§! §RLhůta: zbývá [?SAU_remain_qiddiya|0] dní.§! §HPo dobu výstavby zabere 8 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_red_sea: "Vybudovat projekt Rudé moře" # todo: NEW TRANSLATION
 SAU_proj_red_sea_desc: "Ultraluxusní turistická destinace na desítkách nedotčených ostrovů, vybudovaná podle přísných ekologických standardů. §Y(Cena: 80 miliard $, výstavba ~540 dní)§! §RLhůta: zbývá [?SAU_remain_red_sea|0] dní.§! §HPo dobu výstavby zabere 7 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_roshn: "Vybudovat ROSHN" # todo: NEW TRANSLATION
 SAU_proj_roshn_desc: "Národní bytový developer budující celé integrované komunity, aby miliony Saúdů získaly moderní domovy. §Y(Cena: 60 miliard $, výstavba ~365 dní)§! §RLhůta: zbývá [?SAU_remain_roshn|0] dní.§! §HPo dobu výstavby zabere 7 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_sindalah: "Vybudovat Sindalah" # todo: NEW TRANSLATION
 SAU_proj_sindalah_desc: "Rozvíjejte Sindalah jako luxusní ostrovní destinaci NEOMu v Rudém moři a jeho první projekt otevřený návštěvníkům. §Y(Cena: 40 miliard $, výstavba ~270 dní)§! §RLhůta: zbývá [?SAU_remain_sindalah|0] dní.§! §HPo dobu výstavby zabere 4 civilní továrny.§!" # todo: NEW TRANSLATION
 SAU_proj_soudah_peaks: "Vybudovat vrcholy Súdah" # todo: NEW TRANSLATION
 SAU_proj_soudah_peaks_desc: "Rozvíjejte horskou turistickou destinaci ve vysokých vrcholcích Asiru a využijte chladnější podnebí a zelenou krajinu regionu. §Y(Cena: 40 miliard $, výstavba ~450 dní)§! §RLhůta: zbývá [?SAU_remain_soudah_peaks|0] dní.§! §HPo dobu výstavby zabere 5 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_sports_blvd: "Vybudovat Sportovní bulvár" # todo: NEW TRANSLATION
 SAU_proj_sports_blvd_desc: "Rekreační koridor dlouhý 135 kilometrů napříč Rijádem pro cyklistiku, běh a jízdu. §Y(Cena: 30 miliard $, výstavba ~270 dní)§! §RLhůta: zbývá [?SAU_remain_sports_blvd|0] dní.§! §HPo dobu výstavby zabere 4 civilní továrny.§!" # todo: NEW TRANSLATION
 SAU_proj_the_line: "Vybudovat THE LINE" # todo: NEW TRANSLATION
 SAU_proj_the_line_desc: "Vybudujte THE LINE jako 170 kilometrů dlouhé město bez automobilů mezi dvěma zrcadlovými stavbami vysokými 500 metrů. §Y(Cena: 200 miliard $, výstavba ~900 dní)§! §RLhůta: zbývá [?SAU_remain_the_line|0] dní.§! §HPo dobu výstavby zabere 12 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_proj_trojena: "Vybudovat Trojenu" # todo: NEW TRANSLATION
 SAU_proj_trojena_desc: "Celoroční horské letovisko ve vysočině NEOMu, včetně venkovního lyžování v arabské poušti. §Y(Cena: 60 miliard $, výstavba ~450 dní)§! §RLhůta: zbývá [?SAU_remain_trojena|0] dní.§! §HPo dobu výstavby zabere 5 civilních továren.§!" # todo: NEW TRANSLATION
 SAU_rally_support: "Shromáždit podporu pro našeho kandidáta" # todo: NEW TRANSLATION
 SAU_rally_support_desc: "Získejte pro svého prince podporu královské rodiny, náboženského establishmentu a tisku. Zisk může být malý, solidní nebo může znamenat zásadní průlom." # todo: NEW TRANSLATION
 SAU_repair_pipeline_iraq: "Rozšířit evropský ropovod" # todo: NEW TRANSLATION
 SAU_repair_pipeline_iraq_desc: "Posuňte severní hlavní trasu o úroveň výš – obnovte to, co zničila sabotáž, nebo položte dodatečnou čerpací kapacitu pro přepravu většího množství ropy směrem k Turecku." # todo: NEW TRANSLATION
 SAU_repair_pipeline_syria: "Rozšířit levantský ropovod" # todo: NEW TRANSLATION
 SAU_repair_pipeline_syria_desc: "Posuňte středomořskou trasu o úroveň výš – obnovte to, co zničila sabotáž, nebo rozšiřte koridor přes Ammán a Damašek." # todo: NEW TRANSLATION
 SAU_repair_pipeline_yemen: "Rozšířit ropovod k Arabskému moři" # todo: NEW TRANSLATION
 SAU_repair_pipeline_yemen_desc: "Posuňte jižní trasu o úroveň výš – obnovte to, co zničila sabotáž, nebo položte dodatečnou kapacitu pro přepravu většího množství ropy za Hormuz." # todo: NEW TRANSLATION
 SAU_request_f15: "Požádat Spojené státy o F-15" # todo: NEW TRANSLATION
 SAU_request_f15_desc: "Zahajte jednání s Washingtonem o získání letounů F-15 Strike Eagle. Pokud Američané souhlasí, odemkne se zaměření §YF-15 Strike Eagle§!.\n\n§RJde o výlučnou volbu:§! první dodavatel, který přijme, nám zajistí stíhačku a ostatní tři programy (§YTornado GR4§!, §YPanavia Tornado§!, §YEurofighter Typhoon§!) budou navždy uzavřeny. Volte moudře." # todo: NEW TRANSLATION
 SAU_request_panavia: "Požádat Itálii o Panavia Tornado" # todo: NEW TRANSLATION
 SAU_request_panavia_desc: "Obraťte se na Řím kvůli letounům Panavia Tornado IDS, mnohonárodnímu údernému stíhači. Pokud Italové souhlasí, odemkne se zaměření §YPanavia Tornado§!.\n\n§R Jde o výlučnou volbu:§! první dodavatel, který přijme, nám zajistí stíhačku a ostatní tři programy (§YF-15 Strike Eagle§!, §YTornado GR4§!, §YEurofighter Typhoon§!) budou navždy uzavřeny. Volte moudře." # todo: NEW TRANSLATION
 SAU_request_tornado: "Požádat Spojené království o Tornado GR4" # todo: NEW TRANSLATION
 SAU_request_tornado_desc: "Obraťte se na Londýn kvůli úderným letounům Tornado GR4, páteři historického programu Al Yamamah. Pokud Britové souhlasí, odemkne se zaměření §YTornado GR4§!.\n\n§RJde o výlučnou volbu:§! první dodavatel, který přijme, nám zajistí stíhačku a ostatní tři programy (§YF-15 Strike Eagle§!, §YPanavia Tornado§!, §YEurofighter Typhoon§!) budou navždy uzavřeny. Volte moudře." # todo: NEW TRANSLATION
 SAU_request_typhoon: "Požádat o Eurofighter Typhoon" # todo: NEW TRANSLATION
 SAU_request_typhoon_desc: "Obraťte se na evropské konsorcium (Německo) kvůli letounům Eurofighter Typhoon v rámci programu Al Salam. Pokud schválí vývoz, odemkne se zaměření §YAl Salam: Eurofighter Typhoon§!.\n\n§RJde o výlučnou volbu:§! první dodavatel, který přijme, nám zajistí stíhačku a ostatní tři programy (§YF-15 Strike Eagle§!, §YTornado GR4§!, §YPanavia Tornado§!) budou navždy uzavřeny. Volte moudře." # todo: NEW TRANSLATION
 SAU_rivalry_back_separatists: "Podpořit separatisty" # todo: NEW TRANSLATION
 SAU_rivalry_back_separatists_desc: "Prezidium všeobecné rozvědky posílá peníze a zbraně do Ahvázu, Balúčistánu a Kurdistánu. Íránské pohraničí se bouří." # todo: NEW TRANSLATION
 SAU_rivalry_propaganda_blitz: "Mediální kampaň proti Íránu" # todo: NEW TRANSLATION
 SAU_rivalry_propaganda_blitz_desc: "Zaplavte vysílání a mešity argumenty proti Teheránu." # todo: NEW TRANSLATION
 SAU_rivalry_strait_patrols: "Hlídky v průlivu" # todo: NEW TRANSLATION
 SAU_rivalry_strait_patrols_desc: "Udržujte flotilu ve cvičení v úzkých vodách Hormuzu." # todo: NEW TRANSLATION
 SAU_royal_patronage: "Královská přízeň" # todo: NEW TRANSLATION
 SAU_royal_patronage_desc: "Využijte královská jmenování a smlouvy k zajištění podpory vybraného kandidáta mezi staršími členy rodiny. Tato možnost je dostupná jednou v každém nástupnickém souboji.\n\n§G+20 vlivu§! pro prince, kterého již podporujete, §Yjednou za vlády krále Abdalláha a jednou za vlády krále Salmána§!." # todo: NEW TRANSLATION
 SAU_royal_patronage_tt: "§G+20§! vlivu podporovaného prince" # todo: NEW TRANSLATION
 SAU_sabotage_pipeline_iraq: "Zaútočit na evropský ropovod" # todo: NEW TRANSLATION
 SAU_sabotage_pipeline_iraq_desc: "Zasáhněte ropovod přepravující saúdskou ropu přes Irák do Evropy. Přerušte jej a Rijádova výzva Moskvě se zhroutí spolu s ním." # todo: NEW TRANSLATION
 SAU_sabotage_pipeline_syria: "Zaútočit na levantský ropovod" # todo: NEW TRANSLATION
 SAU_sabotage_pipeline_syria_desc: "Zaměřte se na saúdský ropovod vedoucí ke Středozemnímu moři. Úspěšný útok přeruší trasu a připraví království o tuto cestu." # todo: NEW TRANSLATION
 SAU_sabotage_pipeline_yemen: "Zaútočit na ropovod k Arabskému moři" # todo: NEW TRANSLATION
 SAU_sabotage_pipeline_yemen_desc: "Pošlete sabotéry proti saúdské trase přes jižní Jemen. Pokud projdou, ropa přestane proudit a království ztratí svou jižní cestu." # todo: NEW TRANSLATION
 SAU_salman_burden_of_state: "Zatížit krále státními povinnostmi" # todo: NEW TRANSLATION
 SAU_salman_burden_of_state_desc: "Uložte králi vyřizování spisů, delegací a obřadů, které by za běžných okolností delegoval. Zvýšená zátěž urychlí zhoršování jeho zdravotního stavu." # todo: NEW TRANSLATION
 SAU_salman_cpsa_council: "Svolat Radu pro politické a bezpečnostní záležitosti" # todo: NEW TRANSLATION
 SAU_salman_cpsa_council_desc: "Nahraďte stávající bezpečnostní výbory jedinou Radou pro politické a bezpečnostní záležitosti, která se bude scházet v královském paláci. Soustředění pravomocí zkrátí dobu potřebnou k přijímání zásadních rozhodnutí." # todo: NEW TRANSLATION
 SAU_salman_health_status: "§HZdravotní stav krále§!: [GetSAUKingHealth]" # todo: NEW TRANSLATION
 SAU_salman_health_status_desc: "O králově stavu se uvádí, že je [GetSAUKingHealth]. Jakmile jeho zdraví selže, korunní princ se stane králem." # todo: NEW TRANSLATION
 SAU_salman_ksrelief: "Mobilizovat operace KSrelief" # todo: NEW TRANSLATION
 SAU_salman_ksrelief_desc: "Vyšlete do zahraničí konvoje pomoci KSrelief, polní nemocnice a potravinové zásoby pod oficiálním saúdským patronátem. Operace poskytne humanitární pomoc a zároveň zlepší domácí podporu vlády." # todo: NEW TRANSLATION
 SAU_salman_maneuver: "Salmanovy frakční intriky" # todo: NEW TRANSLATION
 SAU_salman_maneuver_desc: "Sudajrský blok pracuje na prosazení Salmanova nároku a může poštvat dvůr proti vašemu vlastnímu kandidátovi." # todo: NEW TRANSLATION
 SAU_salman_riyadh_metro_plan: "Rozšířit metropolitní plán Rijádu" # todo: NEW TRANSLATION
 SAU_salman_riyadh_metro_plan_desc: "Rozšiřte Rijád pomocí šesti linek metra a řady nových čtvrtí uspořádaných kolem dopravní sítě." # todo: NEW TRANSLATION
 SAU_salman_royal_decrees: "Vydat královské strukturální dekrety" # todo: NEW TRANSLATION
 SAU_salman_royal_decrees_desc: "Využijte královské dekrety ke slučování, rušení a reorganizaci ministerstev bez zdlouhavého legislativního procesu." # todo: NEW TRANSLATION
 SAU_salman_royal_physicians: "Povolat královské lékaře" # todo: NEW TRANSLATION
 SAU_salman_royal_physicians_desc: "Přiveďte specialisty z Evropy a Spojených států, aby krále léčili a uvolnili mu čas na odpočinek. Jeho stav se dočasně zlepší, dlouhodobému zhoršování však zabránit nelze." # todo: NEW TRANSLATION
 SAU_salman_spark_park: "Dotovat energetický park krále Salmána" # todo: NEW TRANSLATION
 SAU_salman_spark_park_desc: "Dotujte třicetikilometrový energetický park krále Salmána poblíž Dammámu, aby se v zemi vyráběla čerpadla, ventily a vrtné vybavení." # todo: NEW TRANSLATION
 SAU_shura_convene_session: "Svolat radu" # todo: NEW TRANSLATION
 SAU_shura_convene_session_desc: "Uspořádejte zasedání Madžlisu aš-Šúrá se zápisem, na něž se musí dostavit ministři a odpovídat na otázky. Jednání bude zveřejněno a může ovlivnit veřejnou debatu, přestože král si ponechá konečnou pravomoc.\n\nToto rozhodnutí lze přijmout jednou." # todo: NEW TRANSLATION
 SAU_shura_seat_notables: "Usadit významné osobnosti" # todo: NEW TRANSLATION
 SAU_shura_seat_notables_desc: "Jmenujte do rady kmenové šejky a přední obchodnické rodiny z Džiddy a Burajdy.\n\nLze opakovat každých 60 dní." # todo: NEW TRANSLATION
 SAU_shura_seat_notables_tt: "§G+10 křesel významných osobností§!, §R-5 křesel§! pro ulemu a technokraty\n§GVedení významnými osobnostmi§!: §G+8 % politické moci, -8 % nákladů na korupci§! / §R+3 % spotřebního zboží, -3 % podpory války§!\n§YPři 70 křeslech může král radu ustavit natrvalo.§!" # todo: NEW TRANSLATION
 SAU_shura_seat_technocrats: "Usadit technokraty" # todo: NEW TRANSLATION
 SAU_shura_seat_technocrats_desc: "Jmenujte do rady ekonomy, inženýry a zkušené úředníky ministerstev, včetně Saúdů vzdělaných v zahraničí.\n\nLze opakovat každých 60 dní." # todo: NEW TRANSLATION
 SAU_shura_seat_technocrats_tt: "§G+10 křesel technokratů§!, §R-5 křesel§! pro ulemu a významné osobnosti\n§GVedení technokraty§!: §G+8 % výzkumu, +6 % výkonu úřadů, +5 % růstu produktivity§! / §R-5 % stability§!\n§YPři 70 křeslech může král radu ustavit natrvalo.§!" # todo: NEW TRANSLATION
 SAU_shura_seat_ulema: "Usadit ulemu" # todo: NEW TRANSLATION
 SAU_shura_seat_ulema_desc: "Jmenujte do rady přední náboženské učence a jejich schválené kandidáty, čímž zvýšíte klerikální vliv na její práci.\n\nLze opakovat každých 60 dní." # todo: NEW TRANSLATION
 SAU_shura_seat_ulema_tt: "§G+10 křesel ulemy§!, §R-5 křesel§! pro technokraty a významné osobnosti\n§OVedení ulemou§!: §G+8 % stability, +10 % obrany proti ideologickému posunu§! / §R-5 % výzkumu, -5 % migrace§!\n§YPři 70 křeslech může král radu ustavit natrvalo.§!" # todo: NEW TRANSLATION
 SAU_spread_revolution_category: "Šířit revoluci" # todo: NEW TRANSLATION
 SAU_storm_air_campaign: "Zaútočit na pozice Húsiů" # todo: NEW TRANSLATION
 SAU_storm_air_campaign_desc: "Vyberte provincii ovládanou hnutím Húsiů a zaútočte na její sklady, letiště a zásobovací silnice. Útok také poškodí okolní infrastrukturu a způsobí ztráty.\n\n§RPoškozuje infrastrukturu, zbrojní průmysl a protivzdušnou obranu§! v cílové provincii a stojí obránce živou sílu. Lze opakovat každých 14 dní." # todo: NEW TRANSLATION
 SAU_storm_partner_readout: "Koalice: [?SAU_coalition_partners|0] partnerů" # todo: NEW TRANSLATION
 SAU_storm_partner_readout_desc: "§HStáty bojující po boku království§!: §Y[?SAU_coalition_partners|0]§!\n\nKaždý člen koalice může nezávisle odstoupit." # todo: NEW TRANSLATION
 SAU_storm_stand_down: "Ukončit tažení" # todo: NEW TRANSLATION
 SAU_storm_stand_down_desc: "Ukončete koaliční nálety a rozpusťte tažení bez dalších vojenských operací.\n\n§G+4 % stability§!, §R-3 % podpory války§!. Tažení bude navždy ukončeno." # todo: NEW TRANSLATION
 SAU_undermine_mbn: "Podkopat Mohammeda bin Nájifa" # todo: NEW TRANSLATION
 SAU_undermine_mbn_desc: "Využijte kontakty u dvora, kompromitující odhalení a odepřenou přízeň ke snížení podpory Mohammeda bin Nájifa. Výsledek může být nulový, nebo může znamenat zásadní ztrátu vlivu." # todo: NEW TRANSLATION
 SAU_undermine_mutaib: "Podkopat Mutajba bin Abdalláha" # todo: NEW TRANSLATION
 SAU_undermine_mutaib_desc: "Využijte kontakty u dvora, kompromitující odhalení a odepřenou přízeň ke snížení podpory Mutajba bin Abdalláha. Výsledek může být nulový, nebo může znamenat zásadní ztrátu vlivu." # todo: NEW TRANSLATION
 SAU_undermine_salman: "Podkopat Salmána bin Abd al-Azíze" # todo: NEW TRANSLATION
 SAU_undermine_salman_desc: "Využijte kontakty u dvora, kompromitující odhalení a odepřenou přízeň ke snížení podpory Salmána bin Abd al-Azíze. Výsledek může být nulový, nebo může znamenat zásadní ztrátu vlivu." # todo: NEW TRANSLATION
 SAU_unleash_laf: "Uvolnit libanonskou armádu" # todo: NEW TRANSLATION
 SAU_unleash_laf_desc: "Armáda je obnovena, placena a vyzbrojena. Nyní Rijád žádá od Bejrútu jedinou důležitou odměnu: odzbrojit Hizballáh, v případě potřeby i silou." # todo: NEW TRANSLATION
 SAU_vision2030_category: "Projekty Vize 2030" # todo: NEW TRANSLATION
 SAU_west_free_trade: "Volný obchod se Západem" # todo: NEW TRANSLATION
 SAU_west_free_trade_desc: "Snižte cla a podepište obchodní dohody napříč blokem NATO. Vztahy se západní aliancí se oteplí a otevřená obchodní dohoda připoutá jejich trhy ke království." # todo: NEW TRANSLATION
 SAU_west_joint_training: "Společný americko-saúdský výcvik" # todo: NEW TRANSLATION
 SAU_west_joint_training_desc: "Provádějte společná cvičení s americkými instruktory, zlepšujte saúdský výcvik kombinovaných zbraní a poskytujte zkušenosti napříč ozbrojenými silami." # todo: NEW TRANSLATION
 SAU_west_petrodollar: "Recyklace petrodolarů" # todo: NEW TRANSLATION
 SAU_west_petrodollar_desc: "Příjmy Saúdské Arábie z ropy se recyklují do amerických státních dluhopisů a společných amerických podniků. Království získá méně okamžitě, Washington však zbohatne a bude více zavázán rodu Saúdů." # todo: NEW TRANSLATION
 SAU_yemen_old_weapons: "Odeslat přebytečné zbraně" # todo: NEW TRANSLATION
 SAU_yemen_old_weapons_desc: "Pošlete jemenské vládě zastaralé saúdské pěchotní zbraně z vojenských skladů s minimálními domácími náklady." # todo: NEW TRANSLATION
 SAU_yemen_raise_brigade: "Koordinovat ofenzivu" # todo: NEW TRANSLATION
 SAU_yemen_raise_brigade_desc: "Začleňte saúdské důstojníky do jemenského velení a naplánujte koordinovaný postup. Vládní síly získají trvalou výhodu při útoku na Húsiů." # todo: NEW TRANSLATION
 SAU_yemen_war_funds: "Financovat válečné úsilí" # todo: NEW TRANSLATION
 SAU_yemen_war_funds_desc: "Pošlete peníze do Adenu na výplaty, nákup paliva a udržení vládních vojáků v poli o něco déle." # todo: NEW TRANSLATION
 YEM_drop_south_yemen_name: "Obnovit jméno Jemenu" # todo: NEW TRANSLATION
 YEM_drop_south_yemen_name_desc: "Odložte identitu Jižního Jemenu a vládněte znovu jednoduše jako Jemen." # todo: NEW TRANSLATION
 yemen_partition_category: "Dva Jemeny" # todo: NEW TRANSLATION
 SAU_events.1.a: "Kéž Alláh smiluje nad jeho duší." # todo: NEW TRANSLATION
 SAU_events.1.d: "Král Fahd bin Abdulaziz Al-Saud, strážce dvou svatých mešit, zemřel po letech zhoršujícího se zdraví po mrtvici v roce 1995. Korunní princ Abdalláh, který království de facto vládl téměř deset let, nyní nastoupí na trůn jako král. Nástupnická krize, která nad královstvím visela roky, je konečně vyřešena." # todo: NEW TRANSLATION
 SAU_events.1.t: "Smrt krále Fahda" # todo: NEW TRANSLATION
 SAU_events.10.a: "Připojit se k OPEC+." # todo: NEW TRANSLATION
 SAU_events.10.b: "Odmítnout dohodu." # todo: NEW TRANSLATION
 SAU_events.10.d: "Rijád navrhuje koordinovat těžbu ropy s Moskvou v rámci OPEC+, což oběma vývozcům poskytne větší vliv na světové ceny." # todo: NEW TRANSLATION
 SAU_events.10.t: "[SAU.GetFlag] Dohoda OPEC+ [SOV.GetFlag]" # todo: NEW TRANSLATION
 SAU_events.100.a: "Region zadržuje dech" # todo: NEW TRANSLATION
 SAU_events.100.d: "Írán vyhlásil válku odtržené Arabské republice a uvrhl Perský záliv do otevřeného konfliktu mezi dvěma soupeřícími centry šíitské moci." # todo: NEW TRANSLATION
 SAU_events.100.t: "Válka v Perském zálivu" # todo: NEW TRANSLATION
 SAU_events.101.a: "Vytrváme" # todo: NEW TRANSLATION
 SAU_events.101.d: "Teherán se zastavil před válkou, jeho zuřivost je však zřejmá. Íránští agenti podněcují nepokoje v našich městech a íránská média označují republiku za kacířský stát." # todo: NEW TRANSLATION
 SAU_events.101.t: "Teherán vře" # todo: NEW TRANSLATION
 SAU_events.102.a: "Usmířit se s monarchiemi Perského zálivu" # todo: NEW TRANSLATION
 SAU_events.102.b: "Prosazovat arabskou demokracii" # todo: NEW TRANSLATION
 SAU_events.102.d: "S parlamentem na místě a republikou pevně stojící už nelze odkládat otázku, jaké místo bude mít Arábie ve světě. Uzavře mír s monarchiemi Perského zálivu, nebo povede boj za arabskou demokracii?" # todo: NEW TRANSLATION
 SAU_events.102.t: "Republika a region" # todo: NEW TRANSLATION
 SAU_events.103.a: "Připojit se k lize" # todo: NEW TRANSLATION
 SAU_events.103.b: "Zůstat nezávislí" # todo: NEW TRANSLATION
 SAU_events.103.d: "Arabská republika zve náš národ do ligy arabských demokracií, bloku odpovědného svým lidem, nikoli králům či duchovním." # todo: NEW TRANSLATION
 SAU_events.103.t: "Výzva demokraciím" # todo: NEW TRANSLATION
 SAU_events.104.a: "Nová kapitola Arábie" # todo: NEW TRANSLATION
 SAU_events.104.d: "Desítky let absolutní monarchie skončily. Zatímco davy zaplňují ulice Rijádu, Přechodná národní rada převzala otěže státu a slibuje vládnout pouze do chvíle, než si Arábie bude moci zvolit vlastní cestu u volebních uren." # todo: NEW TRANSLATION
 SAU_events.104.t: "Pád rodu Saúdů" # todo: NEW TRANSLATION
 SAU_events.107.a: "Vyhlásit Arabskou republiku Arábie" # todo: NEW TRANSLATION
 SAU_events.107.b: "Ponechat Arabskou republiku" # todo: NEW TRANSLATION
 SAU_events.107.d: "Baas drží otěže státu. Vyhlásí Arábie sama sebe Arabskou republikou, předvojem arabského národa, nebo ponechá skromný název Arabská republika?" # todo: NEW TRANSLATION
 SAU_events.107.t: "Název republiky" # todo: NEW TRANSLATION
 SAU_events.109.a: "Připojit se k Arabskému Kominternu" # todo: NEW TRANSLATION
 SAU_events.109.b: "Budeme stát sami" # todo: NEW TRANSLATION
 SAU_events.109.d: "[FROM.GetName] nás zve do Arabského Kominternu, svazu dělnických států spojených věcí revoluce. Můžeme se připojit k našim soudruhům, nebo si ponechat vlastní cestu." # todo: NEW TRANSLATION
 SAU_events.109.t: "Výzva Arabskému Kominternu" # todo: NEW TRANSLATION
 SAU_events.11.a: "Přijmout dohodu." # todo: NEW TRANSLATION
 SAU_events.11.b: "Odmítnout nabídku." # todo: NEW TRANSLATION
 SAU_events.11.d: "Rijád nabízí Washingtonu trvalou dohodu: spolehlivý tok saúdské ropy na americké trhy výměnou za užší bezpečnostní spolupráci. Království čeká na odpověď." # todo: NEW TRANSLATION
 SAU_events.11.t: "[SAU.GetFlag] Ropa za bezpečnost" # todo: NEW TRANSLATION
 SAU_events.110.a: "Draze zaplacená lekce." # todo: NEW TRANSLATION
 SAU_events.110.d: "Svobodná syrská armáda byla rozdrcena. Povstalci, které jsme vyzbrojili a financovali, jsou rozptýleni nebo mrtví a Damašek zůstal neporušen. Roky peněz a důvěry vložené do Sýrie nepřinesly království nic než ponižující porážku a režim, který se nyní opírá o Teherán více než kdy dříve." # todo: NEW TRANSLATION
 SAU_events.110.t: "Syrský gambit se hroutí" # todo: NEW TRANSLATION
 SAU_events.111.a: "Přijmout příměří" # todo: NEW TRANSLATION
 SAU_events.111.b: "Válka pokračuje" # todo: NEW TRANSLATION
 SAU_events.111.d: "Rijád předložil podmínky příměří. Království by zastavilo letecké tažení a ukončilo přímé nepřátelství, přičemž by nechalo vládu v Saná bojovat vlastní válku. Nabídka leží na stole." # todo: NEW TRANSLATION
 SAU_events.111.t: "Saúdská nabídka příměří" # todo: NEW TRANSLATION
 SAU_events.112.a: "Pauza v bojích" # todo: NEW TRANSLATION
 SAU_events.112.d: "Saná souhlasilo s příměřím. Operace Rozhodná bouře je utlumena a království ustupuje z jemenské fronty. Příměří potrvá jen tak dlouho, jak si budeme přát." # todo: NEW TRANSLATION
 SAU_events.112.t: "Húsiové přijímají" # todo: NEW TRANSLATION
 SAU_events.113.a: "Budiž" # todo: NEW TRANSLATION
 SAU_events.113.d: "Saná naše podmínky bezvýhradně odmítlo. Válka v Jemenu pokračuje a operace Rozhodná bouře trvá." # todo: NEW TRANSLATION
 SAU_events.113.t: "Húsiové odmítají" # todo: NEW TRANSLATION
 SAU_events.114.a: "Pak budeme bojovat" # todo: NEW TRANSLATION
 SAU_events.114.d: "Příměří skončilo. Ansar Alláh, povzbuzený a znovu vyzbrojený, roztrhal dohodu o příměří a obnovil své útoky. Válka v Jemenu je zpět, ať si to království přálo, nebo ne." # todo: NEW TRANSLATION
 SAU_events.114.t: "Húsiové porušují příměří" # todo: NEW TRANSLATION
 SAU_events.115.a: "Prohlásit ho králem. Čekal dost dlouho." # todo: NEW TRANSLATION
 SAU_events.115.b: "Nastalý čas není správný. Ať slouží jako korunní princ." # todo: NEW TRANSLATION
 SAU_events.115.d_mbn: "Rozkaz platí. Mohammed bin Nájif zůstává korunním princem, jeho nárok potvrzený králem a veřejně nezpochybněný. Mladší muž se prozatím poražený intrikami stahuje ke svým ministerstvům – a království si oddechne." # todo: NEW TRANSLATION
 SAU_events.115.d_mbs: "Je rozhodnuto. Mohammed bin Nájif byl zbaven úřadů a před kamerami políbil ruku mladému muži, který ho sesadil. Mohammed bin Salmán je korunním princem a linie nástupnictví přeskočila jednu generaci. Starší princové mlčí. Mlčení je samo o sobě odpovědí." # todo: NEW TRANSLATION
 SAU_events.115.t: "Jmenování korunního prince" # todo: NEW TRANSLATION
 SAU_events.116.a: "Ať vládne dlouho." # todo: NEW TRANSLATION
 SAU_events.116.d_mbn: "Král Salmán je mrtev a korunní princ nastupuje, jak mu bylo vždy určeno. Mohammed bin Nájif usedá na trůn s bezpečnostními službami za zády a pověstí muže, který udržel království na nohou." # todo: NEW TRANSLATION
 SAU_events.116.d_mbs: "Král Salmán je mrtev a trůn přechází na jeho syna. Mohammed bin Salmán vládne království naplno ve věku, kdy většina jeho předchůdců stále čekala na ministerský post. Muži, kteří o něm pochybovali, byli už dávno penzionováni, zatčeni nebo usmířeni." # todo: NEW TRANSLATION
 SAU_events.116.t: "Nový král v Rijádu" # todo: NEW TRANSLATION
 SAU_events.117.a: "Poslat je domů." # todo: NEW TRANSLATION
 SAU_events.117.b: "Užitečné naturalizovat." # todo: NEW TRANSLATION
 SAU_events.117.d: "Devět milionů zahraničních pracovníků drží ekonomiku království vzpřímenou. Pokládají potrubí, obsazují nemocnice, řídí nákladní vozy a plní staveniště – nejsou však a nikdy nebudou součástí národa, který chtějí Fajsalovci obnovit. Rada se nedokáže shodnout, zda jsou lešením určeným k odstranění, nebo základem, na němž se má stavět." # todo: NEW TRANSLATION
 SAU_events.117.t: "Otázka zahraniční pracovní síly" # todo: NEW TRANSLATION
 SAU_events.118.a: "Odstoupit od toho, co jsme nenapsali." # todo: NEW TRANSLATION
 SAU_events.118.b: "Pracovat v jejich nitru." # todo: NEW TRANSLATION
 SAU_events.118.d: "Organizace spojených národů, Fond i Banka vznikly bez souhlasu království. Odstoupení by Rijád osvobodilo od institucí, které nevytvořil, zároveň by o něm však mluvili místo toho, aby mu naslouchali. Rada musí volit mezi odstupem a vlivem." # todo: NEW TRANSLATION
 SAU_events.118.t: "Otázka mezinárodních fór" # todo: NEW TRANSLATION
 SAU_events.119.a: "Přivést vše domů." # todo: NEW TRANSLATION
 SAU_events.119.b: "Nechat to tam, kde to vydělává." # todo: NEW TRANSLATION
 SAU_events.119.d: "Stovky miliard leží v západních státních pokladnách a bankách, v bezpečí a se ziskem, avšak zranitelné vůči zahraničnímu nátlaku. Přivedení bohatství domů by financovalo rozvoj království; ponechání v zahraničí zachová výnosy i vliv Rijádu v západních metropolích." # todo: NEW TRANSLATION
 SAU_events.119.t: "Otázka zahraničního bohatství" # todo: NEW TRANSLATION
 SAU_events.12.a: "Přijmout partnerství." # todo: NEW TRANSLATION
 SAU_events.12.b: "Odmítnout nabídku." # todo: NEW TRANSLATION
 SAU_events.12.d: "Saúdská Arábie navrhuje dlouhodobé partnerství s Británií. Příjmy z ropy by financovaly britský průmysl a odborné znalosti a oživily ducha Al-Jamámá." # todo: NEW TRANSLATION
 SAU_events.12.t: "[SAU.GetFlag] Saúdsko-britské partnerství" # todo: NEW TRANSLATION
 SAU_events.120.a: "Mešity jsou povinnost, nikoli mandát." # todo: NEW TRANSLATION
 SAU_events.120.b: "Mluvíme za věřící." # todo: NEW TRANSLATION
 SAU_events.120.d: "Více než miliarda muslimů nemá jediný politický hlas. Království drží Mekku a Medínu a ulamá se ptají, zda je tato důvěra povinností, kterou je třeba tiše naplnit, nebo mandátem otevřeně vést ummu." # todo: NEW TRANSLATION
 SAU_events.120.t: "Otázka globální ummy" # todo: NEW TRANSLATION
 SAU_events.121.a: "Mandát soběstačnosti." # todo: NEW TRANSLATION
 SAU_events.121.b: "Ozbrojená ekvidistance." # todo: NEW TRANSLATION
 SAU_events.121.d: "Dva bloky jsou přesvědčeny, že Království je jejich, pokud by o něj přišly. Rijád může zůstat ozbrojený a stejně vzdálený, nakupovat od obou, aniž by patřil kterémukoli, nebo přijmout náklady na budování vlastních zbraní a nezávislost na cizích arzenálech." # todo: NEW TRANSLATION
 SAU_events.121.t: "Otázka vztahů se supervelmocemi" # todo: NEW TRANSLATION
 SAU_events.122.a: "Almužny, svobodně poskytované." # todo: NEW TRANSLATION
 SAU_events.122.b: "Pomoc s podmínkami." # todo: NEW TRANSLATION
 SAU_events.122.d: "Saúdské peníze pronikají do všech koutů muslimského světa: k mešitám, klinikám, vládám i armádám. Fajsal je poskytoval jako almužnu a písemně za ni nic nepožadoval; jeho dědicové tvrdí, že pomoc bez podmínek nepřináší trvalý vliv. Království si musí vybrat mezi charitou a pákou." # todo: NEW TRANSLATION
 SAU_events.122.t: "Otázka suverénní pomoci" # todo: NEW TRANSLATION
 SAU_events.123.a: "Srazit cizí vlajky. Půjdou domů." # todo: NEW TRANSLATION
 SAU_events.123.a_tt: "Každá cizí mocnost ztratí vojenský přístup do Království" # todo: NEW TRANSLATION
 SAU_events.123.b: "Dohoda platí. Nutnost dovoluje to, co princip zakazuje." # todo: NEW TRANSLATION
 SAU_events.123.d: "Nad saúdskou půdou stále vlají cizí vlajky a s každým rokem, kdy tomu tak je, se hůře odpovídá na kázání. Posádky zaručují Království ochranu před sousedy a zároveň je ponižují před vlastním duchovenstvem. Rada už vyčerpala všechny způsoby, jak rozhodnutí odkládat." # todo: NEW TRANSLATION
 SAU_events.123.t: "Otázka cizích základen" # todo: NEW TRANSLATION
 SAU_events.124.a: "Vyhlásit to z kazatelny." # todo: NEW TRANSLATION
 SAU_events.124.b: "Vyhlásit to z paláce." # todo: NEW TRANSLATION
 SAU_events.124.d: "Když Faisal v roce 1964 převzal trůn po svém bratrovi, měl v ruce fatvu a Rada ministrů už byla pod ním reorganizována – mešita i státní aparát se pohnuly v témže týdnu. Saud dovedl Království na pokraj bankrotu; Faisal odpověděl úsporami, o které nikdo nežádal, a Desetibodovým programem, o němž nikdo nehlasoval.\n\nProgram má být obnoven. Jedinou zbývající otázkou je, pod čím jménem bude obnoven – duchovní si pamatují krále, který vládl spolu s nimi, zatímco ministerstva si pamatují krále, který řídil stát sám." # todo: NEW TRANSLATION
 SAU_events.124.t: "Faisalistické obrození" # todo: NEW TRANSLATION
 SAU_events.125.a: "Odkupte jejich výsady." # todo: NEW TRANSLATION
 SAU_events.125.b: "Nahraďte je bez okolků." # todo: NEW TRANSLATION
 SAU_events.125.d: "Abdulaziz spojil poloostrov sňatky a stipendii a zanechal své syny jako správce provincií, které byly v každém praktickém ohledu jejich vlastní. Faisal strávil jedenáct let uvolňováním ministerstev z tohoto uspořádání a nikdy to zcela nedokončil.\n\nVýsady lze odkoupit za cenu, kterou pocítí státní pokladna, nebo je lze jednoduše zrušit – což je levnější a vytvoří nepřátele uvnitř rodiny, kteří přežijí krále, jenž je zplodil." # todo: NEW TRANSLATION
 SAU_events.125.t: "Centralizace provinčních emirátů" # todo: NEW TRANSLATION
 SAU_events.126.a: "Dejte jim soudy." # todo: NEW TRANSLATION
 SAU_events.126.b: "Dejte jim školy." # todo: NEW TRANSLATION
 SAU_events.126.d: "Faisal vládl s učenci po boku a platil za to po částech. Když v roce 1965 přivedl do Království televizi, jeho vlastní synovec zemřel při útoku na stanici v Rijádu a o deset let později vešel bratr tohoto muže do medžlisu a zastřelil krále. Spojenectví s ulemou nikdy nebylo pouhou ozdobou a nikdy nebylo zadarmo.\n\nTo, co jim nyní vrátíme, rozhodne, o jaké Království jde. Soudy by z nich učinily arbitry práva. Školy by z nich učinily tvůrce příští generace." # todo: NEW TRANSLATION
 SAU_events.126.t: "Posílení autority ulemy" # todo: NEW TRANSLATION
 SAU_events.127.a: "Vyžeňte je." # todo: NEW TRANSLATION
 SAU_events.127.b: "Převychovejte je." # todo: NEW TRANSLATION
 SAU_events.127.d: "Ironie neušla nikomu: Faisal vybudoval technokracii vlastníma rukama, posílal Saúdy do Káhiry, Londýna a Kalifornie a po návratu jim svěřoval ministerstva. Zaki Yamani vedl ropný resort s diplomem z Harvardu v kapse a dělal to lépe než kdokoli, koho mohlo Království vychovat doma.\n\nMuži se však vrátili s více než jen kvalifikací a Rada nyní diskutuje, zda je odpovědí letiště, nebo učebna." # todo: NEW TRANSLATION
 SAU_events.127.t: "Čistka mezi pozápadnělou elitou" # todo: NEW TRANSLATION
 SAU_events.128.a: "Jmenujte na základě zkoušek." # todo: NEW TRANSLATION
 SAU_events.128.b: "Jmenujte na základě loajality." # todo: NEW TRANSLATION
 SAU_events.128.d: "Před Faisalem zde téměř nebyl stát, který by bylo třeba personálně obsadit. Finance Království procházely domácností samotného krále a hrstkou důvěryhodných obchodníků a rozdíl mezi státní pokladnou a královskou peněženkou byl otázkou názoru. Vybudoval ministerstva tam, kde dříve byli jen služebníci.\n\nK čemu má nová byrokracie skutečně sloužit, nebylo nikdy rozhodnuto. Služba vybraná zkouškami bude schopná, ale nebude vděčná. Služba vybraná podle loajality nebude ani jedno." # todo: NEW TRANSLATION
 SAU_events.128.t: "Suverénní státní služba" # todo: NEW TRANSLATION
 SAU_events.129.a: "Nechte je hlídkovat v plné síle." # todo: NEW TRANSLATION
 SAU_events.129.b: "Ponechte je v poradní roli." # todo: NEW TRANSLATION
 SAU_events.129.d: "Výbor pro podporu ctnosti a prevenci neřesti byl jen rozptýlenou skupinou místních vykonavatelů, dokud mu stát neposkytl rozpočet, uniformu a řetězec velení. Faisal potřeboval usmířit duchovní s televizí, dívčími školami a zahraničními inženýry procházejícími ulicemi Dhahránu a Výbor byl součástí ceny, kterou za to zaplatil.\n\nNikdy to nebyla tak docela policejní síla a zároveň jí nikdy tak docela nebyla." # todo: NEW TRANSLATION
 SAU_events.129.t: "Návrat výborů ctnosti" # todo: NEW TRANSLATION
 SAU_events.13.a: "Přijměte investiční dohodu." # todo: NEW TRANSLATION
 SAU_events.13.d: "Rijád odkládá stará podezření stranou a nabízí Paříži rozsáhlou investiční dohodu: saúdský kapitál pro francouzský průmysl a francouzské know-how pro Království. Obě vlády mohou získat." # todo: NEW TRANSLATION
 SAU_events.13.t: "[SAU.GetFlag] Francouzsko-saúdská investiční dohoda" # todo: NEW TRANSLATION
 SAU_events.130.a: "Rušte satelity." # todo: NEW TRANSLATION
 SAU_events.130.b: "Kupte sítě." # todo: NEW TRANSLATION
 SAU_events.130.d: "Faisal vedl svou první mediální válku proti Násirovu Hlasu Arabů, který vysílal do saúdských kasáren a říkal saúdským vojákům, že jejich král je americkým sluhou. Rijád odpověděl vlastními vysílači a velkým množstvím peněz tiše umístěných u redaktorů v Bejrútu a Káhiře.\n\nPonaučení zůstalo: vysílání nelze přesvědčit argumenty. Lze je pouze rušit, nebo koupit." # todo: NEW TRANSLATION
 SAU_events.130.t: "Zákaz zahraničních médií" # todo: NEW TRANSLATION
 SAU_events.131.a: "Posaďte významné osobnosti." # todo: NEW TRANSLATION
 SAU_events.131.b: "Rozšiřte členství." # todo: NEW TRANSLATION
 SAU_events.131.d: "Desetibodový program z roku 1962 slíbil Království poradní radu. Faisal vládl dalších třináct let a nikdy ji nesvolal; nakonec ji v roce 1992 ustavil Fahd – o třicet let později a jmenovanou, nikoli volenou.\n\nSlib se nyní dává znovu a složení je celým jádrem sporu. Významné osobnosti by z ní učinily dvůr. Širší členství by z ní učinilo něco, co dvůr nedokáže zcela předvídat." # todo: NEW TRANSLATION
 SAU_events.131.t: "Reorganizace Madžlis aš-Šúrá" # todo: NEW TRANSLATION
 SAU_events.132.a: "Technické instituty." # todo: NEW TRANSLATION
 SAU_events.132.b: "Vojenské akademie." # todo: NEW TRANSLATION
 SAU_events.132.d: "Rozmach vybudovaly ruce jiných – jemenští dělníci, egyptští učitelé, palestinští úředníci a časem více než milion lidí z jižní Asie. Faisalovou odpovědí bylo vzdělávání v měřítku, o jaké se poloostrov nikdy nepokusil: Univerzita krále Abdulazize byla otevřena v roce 1967, stipendijní programy vyslaly tisíce lidí do zahraničí a Království začalo vyrábět vlastní střední třídu.\n\nK čemu má být tato třída vyrobena, je rozhodnutí, které stojí před Radou." # todo: NEW TRANSLATION
 SAU_events.132.t: "Iniciativa národních kádrů" # todo: NEW TRANSLATION
 SAU_events.133.a: "Úplně ji uzavřete." # todo: NEW TRANSLATION
 SAU_events.133.b: "Přijměte ty, které potřebujeme." # todo: NEW TRANSLATION
 SAU_events.133.d: "V 70. letech se zahraniční pracovní síla blížila třetině všech lidí uvnitř hranic a vykonávala většinu práce, která udržovala světla v chodu. Faisal přijal pracovní sílu a obával se politiky, která s ní přicházela – Palestinci přinesli svou věc, Jemenci početnost a Egypťané Násira.\n\nUzavření hranice vrátí národ sám sobě a předá ministerstvům nedostatek pracovních sil, na který nemají vůbec žádný plán." # todo: NEW TRANSLATION
 SAU_events.133.t: "Uzavřená hranice" # todo: NEW TRANSLATION
 SAU_events.134.a: "Opevněte pobřeží." # todo: NEW TRANSLATION
 SAU_events.134.b: "Opevněte vnitrozemí." # todo: NEW TRANSLATION
 SAU_events.134.d: "Faisalovo Království obklopovali lidé, kteří si přáli jeho zánik: Násirův Egypt přes Rudé moře, republikáni v Saná, baasisté v Bagdádu a Damašku a Sovětský svaz, který odepsal rod Saúdů jako relikt čekající na pohřeb. Vybudoval Národní gardu proti převratu a nakoupil americká letadla proti invazi, přičemž si nikdy nebyl zcela jistý, co přijde dříve.\n\nKrálovství nyní musí rozhodnout, na jakou hrozbu se skutečně připravuje." # todo: NEW TRANSLATION
 SAU_events.134.t: "Pevnostní království" # todo: NEW TRANSLATION
 SAU_events.135.a: "Svolejte ji do Mekky." # todo: NEW TRANSLATION
 SAU_events.135.b: "Svolejte ji v zahraničí." # todo: NEW TRANSLATION
 SAU_events.135.d: "Když v srpnu 1969 hořel al-Aksá, Faisal během několika týdnů svolal představitele muslimského světa do Rabatu a ještě před koncem roku vznikla Organizace islámské konference. Byla odpovědí na Násirovu Arabskou ligu – ne arabskou a sekulární, nýbrž muslimskou a vedenou z Mekky.\n\nMísto, kde Království svolá věřící, je samo o sobě prohlášením. Svatá města propůjčují legitimitu, kterou žádný konferenční sál v zahraničí poskytnout nemůže." # todo: NEW TRANSLATION
 SAU_events.135.t: "Konference islámské solidarity" # todo: NEW TRANSLATION
 SAU_events.136.a: "Otevřeně pohrozte embargem." # todo: NEW TRANSLATION
 SAU_events.136.b: "Uplatněte je potichu." # todo: NEW TRANSLATION
 SAU_events.136.d: "Sedmnáctého října 1973 Faisal omezil těžbu a uzavřel kohouty Spojeným státům. Cena barelu během jediné sezóny vzrostla ze tří dolarů téměř na dvanáct, Západ zjistil, jakou cenu má jeho pohodlí, a Království zjistilo, že drží zbraň, o níž nikdy neuvažovalo, že ji použije.\n\nOd té doby nebyla použita. Ministerstvo po celou dobu udržovalo údaje aktuální." # todo: NEW TRANSLATION
 SAU_events.136.t: "Duch roku 1973" # todo: NEW TRANSLATION
 SAU_events.137.a: "Nejprve zbraně." # todo: NEW TRANSLATION
 SAU_events.137.b: "Nejprve všechno ostatní." # todo: NEW TRANSLATION
 SAU_events.137.d: "Království těží ropu, prodává ji do zahraničí a zpět nakupuje vše, co potřebuje – včetně potrubí, kterým ropa proudí. Faisalovy pětileté plány měly tento kruh prolomit a do značné míry uspěly ve vybudování věcí, které ropu přepravují rychleji.\n\nSubstituce musí někde začít a místo, kde začne, rozhodne o tom, co může Království dělat bez ptaní se kohokoli o svolení." # todo: NEW TRANSLATION
 SAU_events.137.t: "Odstranění zahraniční závislosti" # todo: NEW TRANSLATION
 SAU_events.138.a: "Financujte ji." # todo: NEW TRANSLATION
 SAU_events.138.b: "Personálně ji obsadťe." # todo: NEW TRANSLATION
 SAU_events.138.d: "Faisal založil Muslimskou světovou ligu v Mekce v roce 1962 a o sedm let později přivedl k životu Organizaci islámské konference. Obě sídlily tam, kam dosáhly saúdské peníze, a obě byly vybudovány jako odpověď na panarabismus, v němž nebylo místo pro krále.\n\nJeho nástupci dál platili účty a postupně přestali určovat agendu. Peníze kupují úctu; úředníci kupují kontrolu. Není to totéž." # todo: NEW TRANSLATION
 SAU_events.138.t: "Obnovení vedení OIC" # todo: NEW TRANSLATION
 SAU_events.139.a: "Přísná kvóta." # todo: NEW TRANSLATION
 SAU_events.139.b: "Postupná kvóta." # todo: NEW TRANSLATION
 SAU_events.139.d: "Aramco mělo nakupovat saúdské zboží tam, kde existovalo, a tam, kde neexistovalo, Království platilo zahraničním firmám, aby postavily továrnu, která je vyrobí. Bylo to pomalé, drahé a zůstává to jediným způsobem, jak země dovážející vlastní vrtáky přestane tak činit.\n\nTo, jak tvrdě je hranice nastavena, rozhodne, zda ministerstva vyhoví, nebo se jednoduše naučí podávat žádosti o výjimky." # todo: NEW TRANSLATION
 SAU_events.139.t: "Kvóta domácích dodávek" # todo: NEW TRANSLATION
 SAU_events.14.a: "Přijměte investici." # todo: NEW TRANSLATION
 SAU_events.14.b: "Nabídku odmítněte." # todo: NEW TRANSLATION
 SAU_events.14.d: "Saúdská Arábie nabízí investice do našeho průmyslu výměnou za hlubší hospodářské vazby. Přijetí by přineslo nové továrny a saúdský vliv." # todo: NEW TRANSLATION
 SAU_events.14.t: "[SAU.GetFlag] Investice v zemích NATO" # todo: NEW TRANSLATION
 SAU_events.140.a: "Nechte ho následovat Faisala. Garda to unese." # todo: NEW TRANSLATION
 SAU_events.140.b: "Faisalovo Království zemřelo s Faisalem. Nechte ho odpočívat." # todo: NEW TRANSLATION
 SAU_events.140.d: "Fahd je pohřben a Abdullah je konečně králem vlastním jménem, po deseti letech vlády jménem jiného muže. Nástupnictví je otevřené a princové už začali počítat.\n\nKrálův vlastní syn za ním přichází s argumentem, nikoli s nárokem. Miteb velí Národní gardě – kmenovým oddílům, mužům z vnitrozemí a síle vytvořené přesně proto, že běžné armádě nebylo možné věřit v blízkosti trůnu. Čte Faisala: úspornost, soběstačnost, Království, které mluvilo za ummu a o nic nežádalo Washington. Strýc, který takto vládl, byl zastřelen vlastním synovcem a každý muž v místnosti to ví.\n\nFaisalův program nemá dědice. Miteb žádá, aby se jím stal." # todo: NEW TRANSLATION
 SAU_events.140.t: "Faisalistické obrození" # todo: NEW TRANSLATION
 SAU_events.141.a: "Nechte trh, ať si najde vlastní dno." # todo: NEW TRANSLATION
 SAU_events.141.b: "Stát bude nakupovat. Nesmíme dovolit, aby se z toho stala politika." # todo: NEW TRANSLATION
 SAU_events.141.d: "Dvacátého pátého února uzavřel index všech akcií Tadawulu na hodnotě 20 634 a poté přestal růst. Od té doby nepřestal klesat.\n\nNejde o krach bank a institucí. Téměř polovina dospělé populace Království byla na tomto trhu – učitelé, řidiči, vojáci a státní zaměstnanci – mnozí s akciemi koupenými za vypůjčené peníze za ceny, které žádné výnosy nemohly ospravedlnit. Makléřská pracoviště byla otevřena v nákupních centrech. Ženy obchodovaly z oddělených místností. Po dva roky to byla národní zábava.\n\nNež index najde své dno, ztratí téměř dvě třetiny hodnoty a s nimi několik set miliard rijálů úspor domácností. Úřad pro kapitálový trh existuje tři roky a nikdy nic podobného nezažil. Rada musí rozhodnout, zda stát chytí padající nůž, nebo nechá trh předat lekci, kterou právě udílí." # todo: NEW TRANSLATION
 SAU_events.141.t: "Černý únor" # todo: NEW TRANSLATION
 SAU_events.142.a: "Omezte těžbu. Braňte cenu." # todo: NEW TRANSLATION
 SAU_events.142.b: "Udržte těžbu. Nechte nejprve zkrachovat drahé producenty." # todo: NEW TRANSLATION
 SAU_events.142.d: "Cena barelu klesá a nevykazuje žádné známky zastavení. Rozpočet byl sestaven na předpokladech, které už neplatí, a každé ministerstvo brzy zjistí, které jeho programy byly dostupné a které byly jen financované.\nRijád už tu bylo. Na začátku 80. let omezilo vlastní těžbu, aby udrželo cenu, sledovalo, jak každý jiný producent tiše prodává do uvolněného prostoru, a vidělo, jak saúdská produkce klesla přibližně o tři čtvrtiny, zatímco cena se stejně zhroutila. Lekce byla drahá a na ministerstvu se o ní stále diskutuje.\nKrálovství drží nejlevnější barely na světě. To je jeho jediná skutečná výhoda a lze ji utratit za obranu ceny pro všechny, nebo za přežití producentů, kteří si nemohou dovolit prodávat za tyto částky." # todo: NEW TRANSLATION
 SAU_events.142.t: "Kolaps ceny ropy" # todo: NEW TRANSLATION
 SAU_events.143.a: "Tvrdá lekce v drahé učebně." # todo: NEW TRANSLATION
 SAU_events.143.d: "Saúdská burza během několika měsíců přišla o většinu své hodnoty a vymazala několik set miliard rijálů majetku domácností. Na trh této velikosti neobvykle dopadly ztráty téměř výhradně na běžné Saúdy, nikoli na instituce – učitele, řidiče a státní zaměstnance, kteří nakupovali na vrcholu, mnozí na úvěr. Analytici v zahraničí poznamenávají, že největší světový vývozce ropy právě zjistil, že má také třídu drobných investorů, a vůbec netuší, co s ní." # todo: NEW TRANSLATION
 SAU_events.143.t: "Rijád: Tadawul se hroutí" # todo: NEW TRANSLATION
 SAU_events.144.a: "Barel rozhoduje, jako vždy." # todo: NEW TRANSLATION
 SAU_events.144.d: "Cena ropy prorazila každé dno, které jí analytici vytyčili. Vývozní státy přepisují rozpočty vyrovnané na předpokladech, které jsou nyní viditelně bezcenné, zatímco dovozci si užívají neočekávaný zisk, který si netroufají příliš hlasitě oslavovat. Všechny oči míří na Rijád, jenž drží nejlevnější barely na světě, a tedy jediné rozhodnutí, na kterém záleží: omezit těžbu a držet cenu pro všechny, nebo dál čerpat a zjistit, kdo se zhroutí jako první." # todo: NEW TRANSLATION
 SAU_events.144.t: "Cena ropy se hroutí" # todo: NEW TRANSLATION
 SAU_events.145.a: "Chraňte Gardu. Ona chrání nás." # todo: NEW TRANSLATION
 SAU_events.145.b: "Obě služby to ponesou stejně." # todo: NEW TRANSLATION
 SAU_events.145.d: "Rezervy se tenčí a rozpočet nevychází. Nejprve přijdou na řadu dotace, pak kapitálové projekty a nyní ministerstvo financí sáhlo na rozpočtovou položku obrany.\n\nPotíž je v tom, že Království nemá jednu armádu. Má pravidelné síly pod ministerstvem obrany a Národní gardu – rekrutovanou z loajálních kmenů vnitrozemí, posádkou kolem Rijádu a ropných polí a podřízenou přímo trůnu. Garda existuje proto, že synové Abdulazize armádě nevěřili, a od té doby je podle toho placena.\n\nŠkrty mohou dopadnout na obě, nebo může být Garda ochráněna a pravidelným důstojníkům řečeno, aby si poradili. Jedna z těchto voleb udrží trůn v bezpečí letos. Druhá za deset let.\n\n§HDůstojnický sbor§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! ze §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]" # todo: NEW TRANSLATION
 SAU_events.145.t: "Nerovnoměrné škrty" # todo: NEW TRANSLATION
 SAU_events.146.a: "Pošlete Gardu. Vyčistěte ulice." # todo: NEW TRANSLATION
 SAU_events.146.b: "Nikdo nebude nasazen. Najděte peníze a kupte si klid." # todo: NEW TRANSLATION
 SAU_events.146.d: "Úsporná opatření dorazila do ulic. V Katífu a Dammámu jsou davy a menší shromáždění v Rijádu, o nichž ministerstva tvrdí, že to žádné davy nejsou.\n\nNárodní garda je nástrojem pro tento účel – vždy jím byla, to je celý její smysl – a je připravena, financovaná a ochotná. Pravidelný důstojnický sbor osloven nebyl a velmi pozorně sleduje, kdo osloven bude.\n\nKaždý plukovník ministerstva obrany chápe, co znamená, pokud je nasazena Garda, zatímco jejich vlastní jednotky sedí bez žoldu v kasárnách. Znamená to, že trůn veřejně a natrvalo rozhodl, které armádě důvěřuje.\n\n§HDůstojnický sbor§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! ze §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]" # todo: NEW TRANSLATION
 SAU_events.146.t: "Rozkaz k nasazení" # todo: NEW TRANSLATION
 SAU_events.147.a: "Postupte na Rijád. Garda nebude mít čas reagovat." # todo: NEW TRANSLATION
 SAU_events.147.b: "Tohle ne. Jsme vojáci, ne politici." # todo: NEW TRANSLATION
 SAU_events.147.d: "Je tedy rozhodnuto. Garda je placená a důvěryhodná; armáda není ani jedno. Mužům, kteří létají s letadly, velí obrněncům a drží hranici, bylo bez jediného přímého slova sděleno, že jsou ve vlastní zemi druhou armádou.\n\nPro to, co bude následovat, existuje precedens. V roce 1969 se spiknutí letectva a armádních důstojníků – násirovců, Hidžázců a mužů unavených vládou jedné rodiny – přiblížilo svržení Faisala na vzdálenost jediné zpravodajské zprávy. Stovky lidí byly zatčeny. Království se poučilo, že pravidelným silám nelze věřit, posílilo Gardu a nikdy se nezeptalo, proč po tom důstojníci toužili.\n\nŠtáb se už několik týdnů schází. O rozpočtech už nediskutuje.\n\n§HDůstojnický sbor§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! ze §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]" # todo: NEW TRANSLATION
 SAU_events.147.t: "Důstojníci rozhodují" # todo: NEW TRANSLATION
 SAU_events.148.a: "Království má novou vládu." # todo: NEW TRANSLATION
 SAU_events.148.d: "Jednotky saúdské pravidelné armády před úsvitem vstoupily do Rijádu a drží ministerstva, vysílací úřad a přístupy ke královským palácům. Kasárna Národní gardy byla obklíčena ve stejnou hodinu a nekladla odpor. Nejvyšší vojenská rada oznámila, že obnovuje veřejný pořádek a že ústavní postavení trůnu zůstává nezměněno – formule, kterou lze podle pozorovatelů vykládat několika způsoby.\n\nAramco hlásí běžné nakládání v Ras Tanúře. To je jediná věta z celého hlášení, kterou čtou ropné trhy." # todo: NEW TRANSLATION
 SAU_events.148.t: "Rijád: obrněnce v ulicích" # todo: NEW TRANSLATION
 SAU_events.149.a: "Vyhlaste arabskou socialistickou republiku." # todo: NEW TRANSLATION
 SAU_events.149.b: "Vyhlaste islámskou republiku." # todo: NEW TRANSLATION
 SAU_events.149.c: "Vyhlaste konstituční republiku." # todo: NEW TRANSLATION
 SAU_events.149.d: "Trůn skončil. Rada má ministerstva, vysílací úřad i přístupy ke každému paláci v Rijádu a zjistila to, co zjistí každá junta: zmocnit se země trvá noc, ale vládnout jí vyžaduje jméno.\nMusí být vyhlášena republika a republika musí být vyhlášena jako něco. Důstojníci v místnosti se neshodnou na čem. Někteří sloužili po boku Iráčanů a Syřanů a vrátili se s obdivem k Baas – jeden arabský národ, jedna strana, armáda jako jeho páteř. Jiní ukazují na Katíf a Východní provincii a tvrdí, že jedinou masovou komunitou, kterou Království kdy potlačovalo, je ta, která by republiku nesla na svých bedrech. Mladší frakce, muži vyslaní studovat do zahraničí, chce ústavu, parlament a to, aby slovo republika znamenalo totéž jako všude jinde. A několik tišších mužů čte věci, za něž by je Mabhith kdysi zatkl.\nAť bude dnes večer oznámeno cokoli, bude to oznámeno jménem saúdského lidu – a nikdo se ho na nic neptal." # todo: NEW TRANSLATION
 SAU_events.149.e: "Vyhlaste lidovou republiku." # todo: NEW TRANSLATION
 SAU_events.149.t: "Al-Džumhúríja" # todo: NEW TRANSLATION
 SAU_events.15.a: "Přijměte námořní partnerství." # todo: NEW TRANSLATION
 SAU_events.15.b: "Nabídku odmítněte." # todo: NEW TRANSLATION
 SAU_events.15.d: "Rijád přichází do Madridu s námořní nabídkou: španělské loděnice by stavěly pro Královské saúdské námořnictvo a saúdské peníze by proudily do španělského průmyslu." # todo: NEW TRANSLATION
 SAU_events.15.t: "[SAU.GetFlag] Saúdsko-španělské partnerství" # todo: NEW TRANSLATION
 SAU_events.150.a: "Pohlťte je. Mohou nosit naši uniformu." # todo: NEW TRANSLATION
 SAU_events.150.b: "Gardu zcela rozpusťte. Pošlete je domů." # todo: NEW TRANSLATION
 SAU_events.150.c: "Ponechte zbytek pod naším velením." # todo: NEW TRANSLATION
 SAU_events.150.d: "Sedmdesát pět tisíc mužů, povolaných z kmenů Nadždu, protože synové Abdulazize nedůvěřovali profesionální armádě, a vyzbrojených natolik dobře, že žádná profesionální armáda nemohla postoupit na Rijád, aniž by se s nimi nejprve utkala. Té noci byli obklíčeni v kasárnách a nevystřelili. Nyní musí Rada rozhodnout, co s nimi.\n\nNejde o nepřátelskou formaci. Její důstojníci jsou bratranci a sousedé mužů, kteří na ně míří zbraněmi, a každý její voják patří ke kmeni s nárokem na stát. Rozpuštění ušetří Radě velké peníze a vytvoří velké množství nepřátel ve vnitrozemí. Pohlcení zdvojnásobí její stav a spolkne sedmdesát pět tisíc mužů, jejichž loajalita až do minulého týdne výslovně patřila někomu jinému." # todo: NEW TRANSLATION
 SAU_events.150.t: "Rozpuštění Gardy" # todo: NEW TRANSLATION
 SAU_events.151.a: "Budou odpovídat státu, nebo nikomu." # todo: NEW TRANSLATION
 SAU_events.151.b: "Obnovit dávky. Každý rijál z nich." # todo: NEW TRANSLATION
 SAU_events.151.d: "Dávky ustaly spolu s Gardou. Ve vnitrozemí to nebylo chápáno jako rozpočtové opatření – platby kmenům Nadždu a Šammarů předcházely samotnému Království, byly dohodou, díky níž ho Abdulazíz sestavil, a nikdy nebyly přerušeny.\n\nŠejkové nejsou ve vzpouře. Jednoduše neodpovídají, a v zemi této velikosti znamená neodpovídat téměř totéž." # todo: NEW TRANSLATION
 SAU_events.151.t: "Kmeny odpovídají" # todo: NEW TRANSLATION
 SAU_events.152.a: "Zatknout je. Všechny, ještě dnes v noci." # todo: NEW TRANSLATION
 SAU_events.152.b: "Přivést je. Rozšířit Radu a podělit se o vinu." # todo: NEW TRANSLATION
 SAU_events.152.d: "Rada, která nedokáže platit, vládnout ani se vysvětlit, je Radou, o níž její vlastní plukovníci začínají mluvit ve třetí osobě. Schůze se znovu konají – ve stejných místnostech, se stejnými hodnostmi a stejnými opatrnými formulacemi, které předcházely té minulé.\n\nMuži, kteří dobyli Rijád, přesně vědí, jak se to dělá, protože to udělali. To je potíž s vládnutím převratem: způsob jste zveřejnili." # todo: NEW TRANSLATION
 SAU_events.152.t: "Důstojníci se obracejí" # todo: NEW TRANSLATION
 SAU_events.153.a: "Lepší být chudý než oběšený." # todo: NEW TRANSLATION
 SAU_events.153.d: "Dávky jsou obnoveny, tribunály tiše rozpuštěny a je stanoveno datum poradního shromáždění, o němž všichni chápou, že bude jmenováno, nikoli zvoleno. Není to mnoho. Stačí, že muži, kteří odpočítávali poslední týdny Rady, přestali odpočítávat nahlas.\n\nPokladna je lehčí o částku, kterou nikdo nezveřejní, a důstojníci, kteří dobyli Rijád, vrátili značnou část toho, kvůli čemu se ho zmocnili." # todo: NEW TRANSLATION
 SAU_events.153.t: "Rada si kupuje návrat" # todo: NEW TRANSLATION
 SAU_events.154.a: "Pak se to rozhodne v poli." # todo: NEW TRANSLATION
 SAU_events.154.d: "Devadesát dní a Rada nenašla co říct. Posádka v Há'ilu dnes ráno vyhlásila věrnost králi, Východní provincie ji do poledne následovala a kmenové odvody, na něž se Garda dříve spoléhala, přestaly předstírat cokoli jiného.\n\nArmáda, která během jediné noci ovládla zemi, je nyní jedinou institucí, která ji brání, a zjišťuje, že stát držený výhradně silou vyžaduje podstatně více síly, než kdokoli rozpočtoval." # todo: NEW TRANSLATION
 SAU_events.154.t: "Království se rozděluje" # todo: NEW TRANSLATION
 SAU_events.155.a: "Svět sleduje Východní provincii." # todo: NEW TRANSLATION
 SAU_events.155.d: "Po celém saúdském vnitrozemí byly hlášeny boje mezi jednotkami věrnými Nejvyšší vojenské radě a formacemi hlásícími se k rodu Saúdů. Východní provincie, kde se nachází ropa, je sporná. Brent otevřel o jedenáct dolarů výše a nepřestává růst.\n\nKaždé ministerstvo zahraničí s ambasádou v Rijádu vydává stejné prohlášení o zdrženlivosti a každé z nich potají zvažuje, kterou stranu bude lepší podporovat později než dříve." # todo: NEW TRANSLATION
 SAU_events.155.t: "Rijád: občanská válka v Saúdské Arábii" # todo: NEW TRANSLATION
 SAU_events.156.a: "Ponechat Abdalláha. Trůn stojí za to, co nás stojí." # todo: NEW TRANSLATION
 SAU_events.156.b: "Najít nám krále, který této dohodě rozumí." # todo: NEW TRANSLATION
 SAU_events.156.d: "Guvernérská místa nyní náleží Radě, což vyvolává otázku, kterou se pečlivě snaží nevznášet. Král stále existuje.\n\nAbdalláh je starý, osobně přísný způsobem, který země vždy oceňovala, a čtyřicet let velel Národní gardě, než ji Rada rozpustila – což znamená, že muži, kteří dobyli Rijád, zvažují, zda si ponechat muže, jehož armádu právě zrušili. V jeho prospěch hovoří, že nikdo v Království nezpochybňuje jeho legitimitu a trůn, který nikdo nezpochybňuje, má větší cenu než několik divizí.\n\nProti němu stojí skutečnost, že od přírody nikdy nebyl loutkou. Ponechat si ho znamená vrátit část toho, co Rada vzala, prakticky i veřejně. Alternativou je najít prince, který chápe, že dohoda funguje opačně." # todo: NEW TRANSLATION
 SAU_events.156.t: "Otázka trůnu" # todo: NEW TRANSLATION
 SAU_events.157.a: "Salmán bin Abd al-Azíz." # todo: NEW TRANSLATION
 SAU_events.157.b: "Muhammad bin Najíf." # todo: NEW TRANSLATION
 SAU_events.157.c: "Mutajb bin Abdalláh." # todo: NEW TRANSLATION
 SAU_events.157.d: "Král Abdalláh byl sesazen z trůnu a Nejvyšší vojenská rada musí mezi staršími princi rodu Saúdů vybrat nástupce.\n\nKaždý kandidát za sebou má jinou základnu – sudajrské establishment, bezpečnostní složky, kmeny vnitrozemí a mladší generaci rodiny. Volba Rady určí, která část Království nové uspořádání uzná jako první a kterou bude třeba přesvědčit." # todo: NEW TRANSLATION
 SAU_events.157.e: "Muhammad bin Salmán." # todo: NEW TRANSLATION
 SAU_events.157.t: "Pohodlnější král" # todo: NEW TRANSLATION
 SAU_events.158.a: "Sloužící důstojník. §H+5 kontrola, -5 legitimita§!" # todo: NEW TRANSLATION
 SAU_events.158.b: "Princ z rodu Saúdů. §H-5 kontrola, +5 legitimita§!" # todo: NEW TRANSLATION
 SAU_events.158.c: "Místní významný muž. §H+2 kontrola, +2 legitimita§!" # todo: NEW TRANSLATION
 SAU_events.158.d: "Místo je prázdné a Rada ho musí obsadit. Byla navržena tři jména a každé z nich Radě kupuje něco jiného.\n\nDůstojník bude poslouchán a nenáviděn. Princ bude uznán a ignorován. Místní významný muž nebude ani jedno, což je zároveň užitečné i nebezpečné." # todo: NEW TRANSLATION
 SAU_events.158.t: "Guvernorát [SAU_governor_province.GetName]" # todo: NEW TRANSLATION
 SAU_events.159.a: "Úzké regentství. Ponechá mu trůn a mešity." # todo: NEW TRANSLATION
 SAU_events.159.b: "Úplné regentství. Veškerou moc, bez výjimky." # todo: NEW TRANSLATION
 SAU_events.159.c: "Regentství na pět let. Stanovit datum." # todo: NEW TRANSLATION
 SAU_events.159.d: "Dokument je krátký. Uvádí, že Jeho Veličenstvo, jsouc indisponováno, svěřuje výkonnou moc a portfolio obrany Radě jednající jeho jménem, a pod odstavcem, který neměl možnost změnit, je jeho podpis.\n\nZbývá vyřešit, kolik toho dekret skutečně odebírá. Regentství, které králi ponechá jeho mešitu, titul a obřady, je regentstvím, s nímž může země žít, zatímco regentství, které mu nenechá nic, je pouze pravdou zapsanou na papíře. Právníci nevyžádaně upozorňují, že dekret s datem se podepisuje snáze než dekret bez něj.\n\nNeexistuje ústava, kterou by bylo třeba pozastavit. To vždy představovalo výhodu tohoto Království." # todo: NEW TRANSLATION
 SAU_events.159.t: "Dekret o regentství" # todo: NEW TRANSLATION
 SAU_events.16.a: "Rozšířit protivzdušný deštník." # todo: NEW TRANSLATION
 SAU_events.16.b: "Odmítnout žádost." # todo: NEW TRANSLATION
 SAU_events.16.d: "Království žádá Washington o rozšířený protivzdušný deštník. Baterie Patriot by obklopily saúdská města a ropná pole, přičemž Rijád by vše zaplatil." # todo: NEW TRANSLATION
 SAU_events.16.t: "[SAU.GetFlag] Americký štít" # todo: NEW TRANSLATION
 SAU_events.160.a: "Celý aparát. Zákaz vycházení, tribunály, cenzory." # todo: NEW TRANSLATION
 SAU_events.160.b: "Pouze mimořádné pravomoci. Ulice nechat být." # todo: NEW TRANSLATION
 SAU_events.160.d: "Shromáždění, pohyb mezi provinciemi i tiskařské lisy dnes ráno přešly pod vojenskou pravomoc. Právníci Rady podotýkají, že Království nikdy nemělo ústavu, kterou by bylo třeba pozastavit, což šetří mnoho práce s formulacemi.\n\nOtázkou je, kam až to zajde. Zákaz vycházení, tribunály a cenzura udrží zemi v klidu a budou se na ně vzpomínat po celou generaci. Mimořádné pravomoci bez zákazu vycházení udrží pod kontrolou méně a budou dříve odpuštěny." # todo: NEW TRANSLATION
 SAU_events.160.t: "Stanné právo" # todo: NEW TRANSLATION
 SAU_events.161.a: "Dekret říkal pět let. Pět let uplynulo." # todo: NEW TRANSLATION
 SAU_events.161.b: "Indispozice pokračuje. Neomezeně." # todo: NEW TRANSLATION
 SAU_events.161.d: "Před pěti lety Rada stanovila datum ukončení vlastní moci a právníci, kteří jí to poradili, strávili následující roky tichým přeřazováním. Datum nastalo. Všichni v Království vědí, že nastalo.\n\nDodržet ho znamená vrátit výkonnou moc trůnu, který Rada pět let vyprázdňovala, a věřit, že vděčnost skutečně existuje. Porušit ho znamená, že slovo Rady má přesně takovou cenu, jakou mu všichni přisuzovali, a už nikdy nebude mít větší.\n\n§HDodržený slib stojí Radu její moc. Porušený slib ji stojí všechno ostatní.§!" # todo: NEW TRANSLATION
 SAU_events.161.t: "Regentství končí" # todo: NEW TRANSLATION
 SAU_events.162.a: "Licencovat návrhy. Potřebujeme výrobu, ne hrdost." # todo: NEW TRANSLATION
 SAU_events.162.b: "Vybudovat to sami, od rudy až po výsledek." # todo: NEW TRANSLATION
 SAU_events.162.d: "Království nakupovalo zbraně v zahraničí od chvíle, kdy nějaké mělo k nákupu, a muži, kteří mu nyní vládnou, strávili kariéry čekáním na zahraniční náhradní díly, které dorazily, až když to dovolil parlament někoho jiného. Zákon nařizuje domácí výrobu toho, co lze vyrábět zde.\n\nZačít lze dvěma způsoby. Nakoupit licence a výrobní zařízení a do tří let mít továrny vyrábějící cizí návrhy za cizích podmínek. Nebo začít od nuly – metalurgie, inženýři, neúspěchy – a výsledek zcela vlastnit za cenu, kterou pokladna pocítí po celé desetiletí." # todo: NEW TRANSLATION
 SAU_events.162.t: "Zákon o obranném průmyslu" # todo: NEW TRANSLATION
 SAU_events.163.a: "Princové. Ať je země sleduje, jak skládají účty." # todo: NEW TRANSLATION
 SAU_events.163.b: "Disidenti. Složky jsou už připravené." # todo: NEW TRANSLATION
 SAU_events.163.c: "Obojí. Stát jsme nezabírali proto, abychom byli vybíraví." # todo: NEW TRANSLATION
 SAU_events.163.d: "Soud zasedá pod vojenskou pravomocí, bez odvolání, a přebírá jurisdikci, která běžným soudcům nikdy nebyla svěřena. Ulamá byli konzultováni ohledně formy řízení, nikoli verdiktů, čehož si všimli.\n\nRada musí rozhodnout, kdo před něj předstoupí. Existují princové, jejichž účty nepřežijí audit a jejichž pád by si země náramně užila. Existují organizátoři, duchovní a signatáři, jejichž složky Mabáhis uchovává dvacet let. Soudit první je populární a výnosné. Soudit druhé je nutné a bude se na to vzpomínat." # todo: NEW TRANSLATION
 SAU_events.163.t: "Mimořádný tribunál" # todo: NEW TRANSLATION
 SAU_events.164.a: "Všeobecná služba. Každý muž v odpovídajícím věku, bez výjimek." # todo: NEW TRANSLATION
 SAU_events.164.b: "Výběrová služba. Kmeny si ponechají výjimky." # todo: NEW TRANSLATION
 SAU_events.164.d: "Al Saúd nikdy nikoho neodváděl. Armáda dobrovolníků z důvěryhodných kmenů je loajální; armáda všech je pouze početná a početná armáda v zemi této velikosti si začne vytvářet názory na to, jak má být země řízena.\n\nRada sama je názorem, jehož se minulý režim obával, což celé debatě dodává jistou nepříjemnost. Přesto hodlá toto riziko podstoupit – jedinou otázkou je, zda odvod dopadne na všechny, nebo na všechny, které si Rada může dovolit rozzlobit." # todo: NEW TRANSLATION
 SAU_events.164.t: "Odvod do armády Království" # todo: NEW TRANSLATION
 SAU_events.165.a: "Starší princové. Jejich jména stále něco znamenají." # todo: NEW TRANSLATION
 SAU_events.165.b: "Opomíjení bratranci. Vděčnost je levnější než prestiž." # todo: NEW TRANSLATION
 SAU_events.165.c: "Bohatí nespokojenci. Přivést je a auditovat později." # todo: NEW TRANSLATION
 SAU_events.165.d: "Rodina není jedna věc. Tvoří ji tisíce lidí s nesmírně rozdílnými nároky a mnozí z nich strávili celý život přehlíženi větví, která držela trůn. Rada právě tuto větev odstranila z rovnice.\n\nExistují starší princové, jejichž jména by sama o sobě uklidnila provincii. Existují bratranci bez zvláštního významu, kteří by byli vděční za guvernorát a pamatovali si, kdo jim ho dal. A pak jsou tu ti s penězi a křivdami, které lze levně přivést a později auditovat." # todo: NEW TRANSLATION
 SAU_events.165.t: "Loajalisté v provinciích" # todo: NEW TRANSLATION
 SAU_events.166.a: "Dvořit se jim. Ustoupit v tom, v čem je třeba." # todo: NEW TRANSLATION
 SAU_events.166.b: "Obsadit provincii posádkou. Přizpůsobí se." # todo: NEW TRANSLATION
 SAU_events.166.d: "Provincie Mekka znamená Džiddu, kupecké rody, pouť a Hidžáz – oblast, která byla do roku 1925 vlastním královstvím a nikdy nepřestala to připomínat. Její rodiny financovaly stát ještě před ropou a nikdy se zcela nesmířily s nadždskou vládou.\n\nLze si je koupit a jsou drahé. Nebo lze provincii obsadit posádkou a připomenout jim, že pouť nyní vede přes kontrolní stanoviště." # todo: NEW TRANSLATION
 SAU_events.166.t: "Provincie Mekka" # todo: NEW TRANSLATION
 SAU_events.167.a: "Dvořit se jim. Ustoupit v tom, v čem je třeba." # todo: NEW TRANSLATION
 SAU_events.167.b: "Přeobsadit křesla. Potřebujeme nyní správné znění." # todo: NEW TRANSLATION
 SAU_events.167.d: "Medína ukrývá Prorokovu mešitu a učené prostředí, které kolem ní vznikalo třináct století. Její právníci mohou Radu popsat jako nutnost, kterou musí obec přijmout, nebo jako uzurpaci, kterou musí snášet, a toto znění doputuje dál než jakékoli komuniké, které Rada vydá.\n\nLze se jim dvořit, což znamená ústupky a trpělivost. Nebo lze vyšší křesla přidělit mužům, kteří už souhlasí, což je rychlejší a čehož si všimne každý učenec v muslimském světě." # todo: NEW TRANSLATION
 SAU_events.167.t: "Provincie Al-Madína" # todo: NEW TRANSLATION
 SAU_events.168.a: "Postavit se za krále. Vypůjčit si titul, nikoli si ho vzít." # todo: NEW TRANSLATION
 SAU_events.168.b: "Opatrovnictví patří státu, nikoli člověku." # todo: NEW TRANSLATION
 SAU_events.168.d: "Fahd přijal v roce 1986 titul Strážce dvou svatých mešit a odložil oslovení Veličenstvo za něco, co si nárokovalo to, co si nemohl nárokovat žádný jiný muslimský vládce. Je to nejcennější věc, kterou rod Saúdů vlastní, a nepřevádí se.\n\nRada ho žijícímu králi nemůže vzít. Může za ním stát, když ho používá, a být při tom viděna – čímž Radě propůjčuje jeho legitimitu a všem připomíná, čí legitimita to je. Nebo může oznámit, že opatrovnictví spočívá ve státě, nikoli v člověku, a zjistit, jak to muslimský svět přijme." # todo: NEW TRANSLATION
 SAU_events.168.t: "Strážci dvou mešit" # todo: NEW TRANSLATION
 SAU_events.169.a: "Začít výbory Východní provincie." # todo: NEW TRANSLATION
 SAU_events.169.b: "Podrobit kázání přezkumu." # todo: NEW TRANSLATION
 SAU_events.169.c: "Začít signatáři petic." # todo: NEW TRANSLATION
 SAU_events.169.d: "Mabáhis nemusel nic budovat. Kartotéky ministerstva vnitra obsahují jména a ulice organizátorů Východní provincie, kázání a data kazatelů Sahwy i muže, kteří podepsali petici z roku 2003 a znovu ji podepsali v roce 2007. Ministerstvo, které to vše shromáždilo, s tím vždy zacházelo opatrně, protože muži ve složkách měli na ministerstvu bratrance. Rada bratrance nemá." # todo: NEW TRANSLATION
 SAU_events.169.e: "Vzít všechny tři složky najednou." # todo: NEW TRANSLATION
 SAU_events.169.t: "Složky jsou již otevřené" # todo: NEW TRANSLATION
 SAU_events.17.a: "Na to odpovíme." # todo: NEW TRANSLATION
 SAU_events.17.d: "Militanti z [ROOT.SAU_GetFrontName] odpálili přes hranici raketovou palbu. Nad našimi městy kvílejí sirény, rodiny spěchají do krytů a škody se sčítají." # todo: NEW TRANSLATION
 SAU_events.17.t: "Rakety zasáhly naše města" # todo: NEW TRANSLATION
 SAU_events.170.a: "Před otevřeným soudem a v televizi." # todo: NEW TRANSLATION
 SAU_events.170.b: "Vyřešit to v Ritzu jako dřív." # todo: NEW TRANSLATION
 SAU_events.170.c: "Milosti za běžnou cenu." # todo: NEW TRANSLATION
 SAU_events.170.d: "Účetní skončili a čísla jsou horší než zvěsti. Ministerstva, která nic nepostavila, provize za letadla, jež nikdy nebyla dodána, desetiletí příjmů Království, která se jednoduše ztratila někde mezi pokladnou a dodavatelem. Část z toho se země dozví. Jedinou otázkou je, kolik toho proběhne před kamerami a kolik se vyřeší v hotelu za zavřenými dveřmi." # todo: NEW TRANSLATION
 SAU_events.170.t: "Princové v lavici obžalovaných" # todo: NEW TRANSLATION
 SAU_events.171.a: "Dát jim štědré a doživotní penze." # todo: NEW TRANSLATION
 SAU_events.171.b: "Vyhostit starší linie." # todo: NEW TRANSLATION
 SAU_events.171.c: "Stíhat je a zabavit, co se najde." # todo: NEW TRANSLATION
 SAU_events.171.d: "Abdulazíz měl pětačtyřicet zaznamenaných synů a Království strávilo sedmdesát let vyrovnáváním se s následky. Nyní jich jsou tisíce, pobírají stipendia, drží guvernérství a jsou provdáni či přiženěni do každého kupeckého rodu od Džiddy po Hofúf. Nikdo z nich není samostatně pro Radu hrozbou. Všichni dohromady jsou jedinou alternativní vládou, jakou země kdy poznala, a nelze je jednoduše ponechat tam, kde jsou." # todo: NEW TRANSLATION
 SAU_events.171.e: "Nechat je bohaté a okrasné." # todo: NEW TRANSLATION
 SAU_events.171.t: "Každý z nich si činí nárok" # todo: NEW TRANSLATION
 SAU_events.172.a: "Uznat Radu. Vztah je se zemí." # todo: NEW TRANSLATION
 SAU_events.172.b: "Uznat je a něco za to získat." # todo: NEW TRANSLATION
 SAU_events.172.c: "S radou plukovníků nejednáme." # todo: NEW TRANSLATION
 SAU_events.172.d: "Dopis je stručný. Uvádí, že závazky Království se nemění, výrobní cíle budou splněny, američtí pracovníci jsou v bezpečí a Rada uvítá brzké setkání. Nezmiňuje krále, zatčení ani ústavu. Washington nyní musí rozhodnout, na co se dívá: na vládu, nebo na skupinu důstojníků, kteří náhodou sedí tam, kde kdysi vláda bývala." # todo: NEW TRANSLATION
 SAU_events.172.t: "Rada píše Washingtonu" # todo: NEW TRANSLATION
 SAU_events.173.a: "Přístavy, železnice a severní koridor." # todo: NEW TRANSLATION
 SAU_events.173.b: "Kapitál bez jakýchkoli podmínek." # todo: NEW TRANSLATION
 SAU_events.173.d: "Čínský velvyslanec dorazil čtyři dny po samotné noci, poblahopřál Radě k obnovení pořádku a přešel přímo k tématu průchodnosti v Janbú. O králi, zatčeních ani ústavě nepadla zmínka. Je to nejpřímočařejší rozhovor, jaký ministerstvo zahraničí Království za deset let vedlo, a všichni v místnosti přesně chápou, co se prodává." # todo: NEW TRANSLATION
 SAU_events.173.t: "Bez kladení otázek" # todo: NEW TRANSLATION
 SAU_events.174.a: "Přijmout je, až Rijád urovná vztahy s Teheránem." # todo: NEW TRANSLATION
 SAU_events.174.b: "Žádost se zamítá." # todo: NEW TRANSLATION
 SAU_events.174.c: "Přijmout je. Bez podmínek." # todo: NEW TRANSLATION
 SAU_events.174.d: "Saúdská žádost o plné členství dorazí na sekretariát bez úvodu a bez připojených podmínek, což samo o sobě něco znamená. Organizace nikdy nepřijala žádný stát Perského zálivu. Také nikdy neodmítla zakládajícího producenta ropy, který o to slušně požádal. Otázkou v Pekingu není, zda je Rijád užitečný – to bylo vyřešeno před lety – ale zda jeho přijetí znamená import sporu, kterému se Organizace dvě desetiletí vyhýbala." # todo: NEW TRANSLATION
 SAU_events.174.t: "Žádost z Rijádu" # todo: NEW TRANSLATION
 SAU_events.175.a: "Obnovit dohodu s Teheránem." # todo: NEW TRANSLATION
 SAU_events.175.b: "Nenecháme si říkat, kdo jsou naši sousedé." # todo: NEW TRANSLATION
 SAU_events.175.d: "Odpověď je zdvořilá a zcela jednoznačná. Čína žádost podpoří, povede hlasování a získá menší členy – a výměnou má být písemně obnovena dohoda zprostředkovaná v Pekingu v roce 2023, včetně velvyslanectví. Organizace nechce člena, který bude každý summit trávit hádkami s jiným členem. Rijád si má své místo koupit podpisem, nikoli ropou." # todo: NEW TRANSLATION
 SAU_events.175.t: "Podmínky Pekingu" # todo: NEW TRANSLATION
 SAU_events.176.a: "Vzít na vědomí a jít dál." # todo: NEW TRANSLATION
 SAU_events.176.d: "Důvod se neuvádí, protože žádný není třeba. Komuniké děkuje Království za zájem, upozorňuje na význam pokračujícího dialogu a končí. Rijád byl odmítnut organizací, o níž ho ujišťovali, že přijme kohokoli, a toto odmítnutí bude správně přečteno v každém důležitém hlavním městě." # todo: NEW TRANSLATION
 SAU_events.176.t: "Žádost se zamítá" # todo: NEW TRANSLATION
 SAU_events.177.a: "Vzít místo." # todo: NEW TRANSLATION
 SAU_events.177.d: "Hlasování je jednomyslné, což znamená, že bylo rozhodnuto ještě před jeho konáním. Království vstupuje jako plnoprávný člen bez předběžných podmínek, zkušební lhůty či jakékoli zmínky o způsobu, jakým se jeho současná vláda dostala k moci. Toto mlčení je celým tím, co bylo zakoupeno." # todo: NEW TRANSLATION
 SAU_events.177.t: "Přijati bez podmínek" # todo: NEW TRANSLATION
 SAU_events.178.a: "Sudy se přepravují jako dřív." # todo: NEW TRANSLATION
 SAU_events.178.d: "Uznání přichází ve formě dvouřádkového prohlášení vydaného v pátek odpoledne, což je chvíle, kdy Washington zveřejňuje věci, které by raději nikdo nezkoumal. Velvyslanec se následující týden vrací. V obchodních vztazích se nic znovu nevyjednává a žádná ze stran tehdy ani později nezmiňuje nic z posledních šesti měsíců." # todo: NEW TRANSLATION
 SAU_events.178.t: "Obchod jako obvykle" # todo: NEW TRANSLATION
 SAU_events.179.a: "Poskytnout přístup. To je cena uznání." # todo: NEW TRANSLATION
 SAU_events.179.b: "Uznání za těchto podmínek není uznáním." # todo: NEW TRANSLATION
 SAU_events.179.d: "Washington Radu uzná a k nabídce připojil seznam požadavků: rozšířený přístup na základnu Prince Sultan, práva na předběžné rozmístění ve Východní provincii a trvalé povolení k přeletům. Důvod není skrytý. Vláda, která uznání potřebuje natolik, že o něj požádá, je vládou, které lze vystavit účet – a Rada požádala jako první." # todo: NEW TRANSLATION
 SAU_events.179.t: "Uznání za cenu" # todo: NEW TRANSLATION
 SAU_events.18.a: "Zbabělci zaplatí." # todo: NEW TRANSLATION
 SAU_events.18.d: "Koordinovaná bombardovací kampaň [ROOT.SAU_GetFrontName] rozervala naše města. Mrtví se sčítají, zatímco veřejnost požaduje, aby vláda jednala." # todo: NEW TRANSLATION
 SAU_events.18.t: "Bombardování našich měst" # todo: NEW TRANSLATION
 SAU_events.180.a: "Pak se bez nich obejdeme." # todo: NEW TRANSLATION
 SAU_events.180.d: "Prohlášení obsahuje čtyři odstavce o ústavní vládě a právním státu a vydává ho ministerstvo zahraničí, které o ničem podobném neřeklo o polovině sousedů Království. Rada si ho přečte, všimne si, kteří z jejích důstojníků byli cvičeni v Kansasu, a založí ho. Vztah nekončí. Jen se o něm přestává mluvit." # todo: NEW TRANSLATION
 SAU_events.180.t: "Washington odmítá" # todo: NEW TRANSLATION
 SAU_events.181.a: "Potvrdit jej v plném rozsahu. Bezpečnost za ropu jako dřív." # todo: NEW TRANSLATION
 SAU_events.181.b: "Ropa ano. Záruka ne." # todo: NEW TRANSLATION
 SAU_events.181.c: "Nechat ji vypršet. Nikdy nebyla sepsána." # todo: NEW TRANSLATION
 SAU_events.181.d: "V únoru 1945 se Roosevelt a Abdulazíz setkali na palubě křižníku ve Velkém Hořkém jezeře a dohodli uspořádání, které podložilo osmdesát let politiky: americká bezpečnost za saúdskou ropu. Ani jeden nic nepodepsal, což každé další vládě vyhovovalo. Rijád nyní formálně a písemně žádá odpověď na otázku, které se tato neurčitost měla vyhnout – byla dohoda uzavřena s králem, nebo se zemí?" # todo: NEW TRANSLATION
 SAU_events.181.t: "Otázka Quincy" # todo: NEW TRANSLATION
 SAU_events.182.a: "Nic se nepodepisuje. Nic není třeba." # todo: NEW TRANSLATION
 SAU_events.182.d: "Neexistuje žádný dokument, protože nikdy žádný nebyl. Je tu svaz letadlových lodí, který neodplouvá, vzkaz předávaný mezi dvěma vládami, jenž nebude zveřejněn v žádné zemi, a dohoda o doplňování paliva obnovená na dvacet let za starých podmínek. Po osmdesáti letech přežilo toto uspořádání změnu dynastie prostou metodou: nikdy nebylo sepsáno." # todo: NEW TRANSLATION
 SAU_events.182.t: "Dohoda trvá" # todo: NEW TRANSLATION
 SAU_events.183.a: "Vezmeme polovinu, která se přepravuje." # todo: NEW TRANSLATION
 SAU_events.183.d: "Obchodní vztah je podrobně potvrzen a bezpečnostní vztah je dvakrát popsán jako věc, která se přezkoumává. Rijád přesně chápe význam: tankery jsou zajištěny, Království nikoli. Je to ta část Quincyho dohody, která Washington nic nestojí, nabídnutá vládou, jež spočítala cenu druhé poloviny." # todo: NEW TRANSLATION
 SAU_events.183.t: "Poloviční dohoda" # todo: NEW TRANSLATION
 SAU_events.184.a: "Pak se Království zaručí samo." # todo: NEW TRANSLATION
 SAU_events.184.d: "Žádné prohlášení, žádné odmítnutí, žádné setkání. Žádost je potvrzena náměstkem pomocného ministra a nikdy není zodpovězena; po několika měsících je jasné, že neodpověď byla odpovědí. Osmdesát let trvající uspořádání nebylo odmítnuto. Bylo jednoduše ponecháno svému tichému zániku, způsobem, jakým takové věci vždy končí." # todo: NEW TRANSLATION
 SAU_events.184.t: "Záruka nikoho" # todo: NEW TRANSLATION
 SAU_events.185.a: "Nechte je číst." # todo: NEW TRANSLATION
 SAU_events.185.b: "Království má jednu zahraniční politiku." # todo: NEW TRANSLATION
 SAU_events.185.d: "Čtyři měsíce po začátku nové vlády se v Mekce sešla Organizace islámské konference – těleso, které král Faisal vybudoval poté, co v roce 1969 vyhořela Al-Aksá, a které svolal ve svém vlastním městě jeho mladší bratr. Byl dohodnut desetiletý akční program a všichni se vrátili domů. V jídelnách Národní gardy však čtou starší projevy, ty z roku 1973, a připomínají si, že Faisal u programů neskončil. Mutajb bin Abdalláh velí gardě. A se čtením nepřestal." # todo: NEW TRANSLATION
 SAU_events.185.t: "Summit v Mekce" # todo: NEW TRANSLATION
 SAU_events.186.a: "Financujte to otevřeně, jménem Království." # todo: NEW TRANSLATION
 SAU_events.186.b: "Nechte gardu, ať to potichu zaplatí." # todo: NEW TRANSLATION
 SAU_events.186.c: "Držte ho na uzdě." # todo: NEW TRANSLATION
 SAU_events.186.d: "V roce 1969 vyhořela Al-Aksá a Faisal nechal do měsíce shromáždit představitele muslimského světa v Rabatu; Organizace islámské konference existuje právě díky tomu. Kruh kolem Mutajba chce summit znovu svolat a otevřeně financovat Muslimskou světovou ligu – jménem Království, na náklady Království, s vlajkou Království na pódiu. Není to malá žádost. Je to však přesně to, co udělal jeho strýc.\n\n§HFaisalistické smýšlení§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_events.186.t: "Vzpomínka na Rabat" # todo: NEW TRANSLATION
 SAU_events.187.a: "Faisal přece jen má dědice." # todo: NEW TRANSLATION
 SAU_events.187.d: "RIJÁD – Velitel saúdskoarabské Národní gardy strávil týden tím, že v malém zopakoval to, co jeho strýc udělal v plném rozsahu. Rozpočet Muslimské světové ligy byl obnoven téměř na úroveň svého podílu ze 70. let, Islámská rozvojová banka má být rekapitalizována z prostředků napojených na gardu a Mutajb bin Abdalláh – vůbec poprvé jako sloužící saúdský velitel, nikoli ministr – vyzval ke svolání Organizace islámské spolupráce na mimořádné zasedání.\n\nKrál Faisal založil Ligu v Mekce v roce 1962 a v roce 1969 svolal Organizaci do Rabatu; v říjnu 1973 ukázal, čeho může Království dosáhnout, když se rozhodne jednat místo zprostředkování. Garda není stát a její velitel není král. Oba tyto body se v Rijádu zmiňují mnohem častěji než před měsícem." # todo: NEW TRANSLATION
 SAU_events.187.t: "Faisal má dědice" # todo: NEW TRANSLATION
 SAU_events.188.a: "Řekněte nahlas to, co se už říká soukromě." # todo: NEW TRANSLATION
 SAU_events.188.b: "Válka Washingtonu není naše, abychom ji vyprávěli." # todo: NEW TRANSLATION
 SAU_events.188.d: "Na druhé straně hranice, kterou Království nikdy nedokázalo uzavřít, se v Mezopotámii nacházejí americké divize. Ať už Washington toto uspořádání nazývá jakkoli, každý kazatel od Burajdy po Abhá je popisuje stejně a fakta jim neodporují. Kruh kolem Mutajba přestal diskutovat o tom, zda měl Faisal ohledně Západu pravdu. Zaměřil se na to, co z jeho pravdy vyplývá.\n\n§HFaisalistické smýšlení§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_events.188.t: "Okupace za humny" # todo: NEW TRANSLATION
 SAU_events.189.a: "Království se nereformuje kvůli potlesku ze zahraničí." # todo: NEW TRANSLATION
 SAU_events.189.b: "Století na nás nepočká." # todo: NEW TRANSLATION
 SAU_events.189.d: "Jednotlivě jsou dekrety skromné – zde uvolněné pravidlo, tam restrukturalizované ministerstvo, jinde otevřená profese lidem, kterým do ní dříve nebyl povolen vstup. Dohromady jde o největší společenskou změnu od doby, kdy školy přijaly dívky, a nikdo v Rijádu nepředstírá, že nebyly sepsány s jedním okem upřeným na to, jak budou čteny ve Washingtonu a Londýně. Kazatelny si všimly druhé části o něco více než té první.\n\n§HFaisalistické smýšlení§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_events.189.t: "Království se otevírá" # todo: NEW TRANSLATION
 SAU_events.19.a: "Posilte hranici." # todo: NEW TRANSLATION
 SAU_events.19.d: "Bojovníci z [ROOT.SAU_GetFrontName] překročili hranici a udeřili na vojenské sklady, než se rozplynuli v noci. Naše síly se horečně snaží reagovat." # todo: NEW TRANSLATION
 SAU_events.19.t: "Vpád přes hranici" # todo: NEW TRANSLATION
 SAU_events.190.a: "Položte Faisalovu otázku nahlas." # todo: NEW TRANSLATION
 SAU_events.190.b: "Rezerva není zbraň." # todo: NEW TRANSLATION
 SAU_events.190.d: "Další muslimské hlavní město, další americká letecká kampaň, další saúdské prohlášení vyzývající všechny strany ke zdrženlivosti. Kruh kolem Mutajba přestal sepisovat prohlášení. Místo toho šíří jednu otázku, přesně tu, na kterou Faisal odpověděl v říjnu 1973: k čemu je největší ropná rezerva na světě, pokud po ní nikdy nesáhneme?\n\n§HFaisalistické smýšlení§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_events.190.t: "Příští válka" # todo: NEW TRANSLATION
 SAU_events.191.a: "Nechte to běžet. Měl by stát v jeho čele." # todo: NEW TRANSLATION
 SAU_events.191.b: "Veďte to prostřednictvím ministerstev." # todo: NEW TRANSLATION
 SAU_events.191.c: "Rozpusťte to, než pojmenuje krále." # todo: NEW TRANSLATION
 SAU_events.191.d: "Přestalo jít o rozhovor mezi důstojníky. Faisalův portrét je ve výlohách na ulici Olaya; páteční kázání v Burajdě a Unaizahu se šest týdnů věnují stejnému tématu a vlastní branci gardy citují vysílání z roku 1973 svým instruktorům. Nikdo to nezorganizoval a každý poznává, kam to směřuje. Mutajb bin Abdalláh veřejně nic neřekl, což se nyní samo čte jako prohlášení.\n\n§HFaisalistické smýšlení§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_events.191.t: "Ulice si pamatují Faisala" # todo: NEW TRANSLATION
 SAU_events.192.a: "Faisalova odpověď. Řekněte ji jeho slovy." # todo: NEW TRANSLATION
 SAU_events.192.b: "Otevřete pokladnu těm, kteří jsou pod palbou." # todo: NEW TRANSLATION
 SAU_events.192.c: "Prohlášení vyzývající všechny strany ke zdrženlivosti." # todo: NEW TRANSLATION
 SAU_events.192.d: "Izraelské síly zasahují proti arabskému státu a televize Království to vysílá živě a bez přerušení. Během jediného dne jsou nápisy stejně americké jako izraelské – letadla, munice i veto, které bude následovat v Radě bezpečnosti. To je půda, kterou si Faisal zvolil v roce 1973, a argument se mezitím nezměnil: Království drží největší ropnou rezervu na světě a nikdy nebylo ochotné po ní sáhnout.\n\n§HFaisalistické smýšlení§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! ze §Y100§!)" # todo: NEW TRANSLATION
 SAU_events.192.t: "Další válka a stejná otázka" # todo: NEW TRANSLATION
 SAU_events.193.a: "Ať záznam ukáže, že to bylo vyřešeno u stolu." # todo: NEW TRANSLATION
 SAU_events.193.d: "Má šedesát stran a doporučuje téměř přesně to, o co plukovníci žádali od začátku – což se stává, když komisi dovolíte vybrat si vlastní členy. Povýšení jsou zveřejněna, nedoplatky vyrovnány a důstojníkům uvedeným ve spisech ministerstva vnitra je potichu sděleno, že i tyto spisy byly uzavřeny.\n\nK žádnému převratu nedojde. Vojáci Království dostali důvod nebýt těmi, kdo to ukončí, a armádě to obvykle stačí." # todo: NEW TRANSLATION
 SAU_events.193.t: "Komise podává zprávu" # todo: NEW TRANSLATION
 SAU_events.194.a: "Pak je dohodnuto. Předložte otázku všem." # todo: NEW TRANSLATION
 SAU_events.194.b: "Království odpoví Jemenu samo." # todo: NEW TRANSLATION
 SAU_events.194.d: "Dorazí během jediného víkendu a program není nikdy zveřejněn. Kuvajt vysílá šejka Mohammeda Al-Chálida Al-Sabáha, místopředsedu vlády a ministra vnitra; Katar vysílá svého premiéra, šejka Abdalláha bin Násira Al Tháního, který rovněž vede resort vnitra. Emiráťané už v budově jsou.\n\nHlavní město padlo Húsiům a uznávaný prezident je někde na jih od něj, bez armády, která by stála za řeč. Otázkou před místností není, zda může Perský záliv jednat. Jde o to, zda bude jednat jedním podpisem, nebo několika – a každý stát v koridoru si o tom rozhodne sám." # todo: NEW TRANSLATION
 SAU_events.194.t: "Jednání v Rijádu" # todo: NEW TRANSLATION
 SAU_events.195.a: "Podepište to. Všemi nezbytnými prostředky." # todo: NEW TRANSLATION
 SAU_events.195.b: "Jemen nebude zachráněn jako protektorát." # todo: NEW TRANSLATION
 SAU_events.195.d: "Saúdská žádost je předložena přímo prezidentovi a nejde ani tak o nabídku pomoci jako o žádost o svolení. Rijád chce dopis: výzvu Radě bezpečnosti a samostatnou výzvu státům Rady pro spolupráci v Zálivu, aby zasáhly §Yvšemi nezbytnými prostředky§!.\n\nUznaná vláda může podle práva pozvat cizí síly na vlastní území a tento dopis je celým právním základem toho, co následuje. Podepsaný přivede letectva Perského zálivu. Nepodepsaný ponechá republiku čelit Húsiům s tím, co jí ještě zbylo – a zachová jí právo později tvrdit, že nikdy nebyla něčím klientem." # todo: NEW TRANSLATION
 SAU_events.195.t: "Otázka z Rijádu" # todo: NEW TRANSLATION
 SAU_events.196.a: "Operace Rozhodná bouře začíná." # todo: NEW TRANSLATION
 SAU_events.196.b: "Pouze vzduch a moře. Žádný saúdský voják nepřekročí hranici." # todo: NEW TRANSLATION
 SAU_events.196.d: "Oznámení není učiněno v Rijádu. Adel al-Džubajr, velvyslanec Království ve Spojených státech, jej čte na ambasádě ve Washingtonu, zatímco první letadla už jsou ve vzduchu – volba místa, která každému hlavnímu městu světa říká, kdo byl konzultován a kdy.\n\nOperace Rozhodná bouře. Státy, které na pozvání odpověděly, jsou jmenovány jako účastníci; někteří z nich se z vysílání dozvídají rozsah své účasti. Deklarovaným cílem je obnova legitimní vlády. Žádné datum konce není uvedeno a nikdo se na něj neptá.\n\n§HPartneři koalice§!: §Y[?SAU_coalition_partners|0]§!" # todo: NEW TRANSLATION
 SAU_events.196.t: "Prohlášení" # todo: NEW TRANSLATION
 SAU_events.197.a: "Perský záliv vstoupil do války." # todo: NEW TRANSLATION
 SAU_events.197.d: "WASHINGTON – Koalice vedená Saúdskou Arábií dnes zahájila letecké operace nad Jemenem, oznámené ze saúdské ambasády zde, nikoli z Rijádu. Království odkazuje na písemnou žádost uznávaného prezidenta Jemenu a na ustanovení o kolektivní obraně Rady pro spolupráci v Zálivu.\n\nTeherán operaci odsoudil a popírá, že by vyzbrojoval hnutí Húsíů. Washington potvrdil poskytování logistické a zpravodajské podpory, přičemž do operace nezapojí žádná vlastní letadla. Žádný člen koalice neuvedl odhad, jak dlouho má kampaň trvat." # todo: NEW TRANSLATION
 SAU_events.197.t: "Operace Rozhodná bouře" # todo: NEW TRANSLATION
 SAU_events.198.a: "Budeme létat po boku Království." # todo: NEW TRANSLATION
 SAU_events.198.b: "Tohle není naše válka." # todo: NEW TRANSLATION
 SAU_events.198.d: "Žádost přichází prostřednictvím saúdského velvyslance a je neobvykle přímá: letadla, posádky k jejich obsluze, nebo v krajním případě jméno v komuniké. Království sestavuje koalici proti postupu Húsiů a raději by ji nesestavovalo samo.\n\nPřipojení přináší v Rijádu značný kredit a podíl na tom, co bude následovat. Odmítnutí stojí tento kredit a nic dalšího – a válka nemá stanovené datum konce." # todo: NEW TRANSLATION
 SAU_events.198.t: "Rijád nás žádá, abychom létali" # todo: NEW TRANSLATION
 SAU_events.199.a: "Pak nepůjdeme tam, kam jsme nebyli pozváni." # todo: NEW TRANSLATION
 SAU_events.199.b: "Jejich podpis nepotřebujeme." # todo: NEW TRANSLATION
 SAU_events.199.d: "San'á odpovídá zdvořile, bez spěchu a zcela záporně. K Radě bezpečnosti nepřijde žádná výzva a Záliv nebude o nic požádán; Království je za svou starost poděkováno jazykem, který vlády používají pro starost, již hodlají ignorovat.\n\nBez tohoto dopisu není pozvání a bez pozvání je letecká kampaň nad Jemenem jednoduše leteckou kampaní nad Jemenem. Rijád může přesto jednat. Udělá to na vlastní účet a každé hlavní město to tak zaznamená." # todo: NEW TRANSLATION
 SAU_events.199.t: "Dopis nepřichází" # todo: NEW TRANSLATION
 SAU_events.2.a: "Ať žije král!" # todo: NEW TRANSLATION
 SAU_events.2.d: "Abdalláh bin Abd al-Azíz Al-Saud byl formálně prohlášen králem Saúdské Arábie a strážcem dvou svatých mešit. Po faktickém vládnutí od roku 1995 přináší jeho formální nástup do úřadu Království stabilitu a kontinuitu. Král Abdalláh je znám svými opatrnými reformními sklony a snahou podporovat mezináboženský dialog." # todo: NEW TRANSLATION
 SAU_events.2.t: "Král Abdalláh nastupuje na trůn" # todo: NEW TRANSLATION
 SAU_events.20.a: "Džajš al-Islám (Armáda islámu)" # todo: NEW TRANSLATION
 SAU_events.20.b: "Ansár al-Haramajn (Obránci dvou svatých mešit)" # todo: NEW TRANSLATION
 SAU_events.20.c: "Katáib al-Aksá (Brigády al-Aksá)" # todo: NEW TRANSLATION
 SAU_events.20.d: "Nové hnutí podporované Saúdskou Arábií potřebuje jméno, než se představí světu. Jeho zvolený prapor určí, jak o něm budou mluvit příznivci i nepřátelé." # todo: NEW TRANSLATION
 SAU_events.20.e: "Liwá at-Tawhíd (Brigáda monoteismu)" # todo: NEW TRANSLATION
 SAU_events.20.t: "Jméno fronty" # todo: NEW TRANSLATION
 SAU_events.200.a: "Reformujte tak daleko, jak to ministerstva unesou." # todo: NEW TRANSLATION
 SAU_events.200.b: "Změnilo se jen jméno na dekretech." # todo: NEW TRANSLATION
 SAU_events.200.c: "Otevřete ekonomiku a nechte politiku následovat." # todo: NEW TRANSLATION
 SAU_events.200.d: "Fahd je pohřben v Al Oud v neoznačeném hrobě, jak vyžaduje doktrína, a Abdalláh je králem vlastním jménem po desetiletí vládnutí jménem někoho jiného. Soustrast přichází z devadesáti hlavních měst a první zasedání vlády se koná ještě tentýž týden.\n\nVšechno, co chtěl od mrtvice udělat, může nyní nařídit, nikoli pouze navrhovat, a ministerstva to vědí. Co zatím nevědí, je, kolik z toho stále hodlá uskutečnit. V této vládě jsou muži, kteří deset let předpokládali, že odpovědí bude jen velmi málo." # todo: NEW TRANSLATION
 SAU_events.200.t: "Nové Království" # todo: NEW TRANSLATION
 SAU_events.201.a: "Nechte o nástupnictví rozhodnout Radu oddanosti." # todo: NEW TRANSLATION
 SAU_events.201.b: "Král jmenuje svého dědice. Rada mu zatleská." # todo: NEW TRANSLATION
 SAU_events.201.c: "Místo toho si kupte souhlas rodiny." # todo: NEW TRANSLATION
 SAU_events.201.d: "Nástupnictví se od roku 1953 řídí senioritou mezi bratry, což fungovalo, dokud byli bratři a dokázali se dohodnout. Každým rokem je jich méně a obojího ubývá; poslední dvě předání moci řídili muži, kteří už nebudou naživu, aby řídili to příští.\n\nNávrh na stole počítá se stálou radou synů a vnuků Abd al-Azíze, která by měla pravomoc potvrdit korunního prince a rozhodovat o způsobilosti krále. Byla by to první písemná procedura, jakou trůn kdy měl. Zároveň by šlo o první orgán v dějinách Království, který by měl nárok rozhodovat o samotném králi, a ne každý v místnosti si toho nevšiml." # todo: NEW TRANSLATION
 SAU_events.201.t: "Upevnění koruny" # todo: NEW TRANSLATION
 SAU_events.202.a: "Nechte je mluvit a zveřejněte, co řeknou." # todo: NEW TRANSLATION
 SAU_events.202.b: "Mohou se sejít. Program je náš." # todo: NEW TRANSLATION
 SAU_events.202.d: "Sál je uspořádán tak, aby šíitský duchovní z Qatífu seděl na doslech od salafistického učence z Rijádu, a ženy jsou poprvé v dějinách Království přítomny za zástěnou. Nic, o čem se zde rozhodne, nikoho nezavazuje. To je smyslem tohoto shromáždění i námitkou proti němu.\n\nDelegáti řeknou to, co jim bude dovoleno říct. Kolik toho bude, zatím nebylo rozhodnuto, a dva muži, kteří o tom rozhodnou, se neshodují: jeden tvrdí, že zasedání, které nic nezmění, je horší než žádné zasedání; druhý, že zasedání, které něco změní, je prvním z řady, kterou nikdo neovládne." # todo: NEW TRANSLATION
 SAU_events.202.t: "Národní dialog" # todo: NEW TRANSLATION
 SAU_events.203.a: "Přijměte Washingtonskou nabídku v plném rozsahu." # todo: NEW TRANSLATION
 SAU_events.203.b: "Mabáhith si poradí sám." # todo: NEW TRANSLATION
 SAU_events.203.c: "Rehabilitujte je. Vězení jen vytvoří další." # todo: NEW TRANSLATION
 SAU_events.203.d: "Komplexy v Al Hamře a Išbilíji vybombardovali muži, kteří zde vyrostli, chodili zde do školy a byli financováni prostřednictvím zde registrovaných charit. Ať už se předpokládalo, že spor se týká čehokoli, nyní je prokazatelně veden proti samotnému Království.\n\nWashington nabízí styčnou buňku, propojení seznamů sledovaných osob a přístup k signálům, které nikdy s nikým v regionu nesdílel. Přijetí znamená americké důstojníky čtoucí saúdské spisy. Odmítnutí znamená dělat to sám v zemi, kde mnoho lidí v tichosti souhlasí s atentátníky." # todo: NEW TRANSLATION
 SAU_events.203.t: "Protiteroristická spolupráce" # todo: NEW TRANSLATION
 SAU_events.204.a: "Polovinu míst a muže na seznamech." # todo: NEW TRANSLATION
 SAU_events.204.b: "Jmenujte je všechny a nazvěte to konzultací." # todo: NEW TRANSLATION
 SAU_events.204.c: "Zařaďte na seznamy také ženy." # todo: NEW TRANSLATION
 SAU_events.204.d: "Polovina míst v obecních radách bude volena, druhá polovina jmenována; samotné rady získají pravomoc nad odvodňováním, pouličním osvětlením a stavebními povoleními. V paláci nikdo nepředstírá, že jde o předání moci.\n\nNámitkou není, že rady napáchají škodu. Jde o to, že Saúdové budou hlasovat a že precedens, na rozdíl od dekretu, nelze následující rok potichu odvolat." # todo: NEW TRANSLATION
 SAU_events.204.t: "Obecní volby" # todo: NEW TRANSLATION
 SAU_events.205.a: "Naposledy to bylo poradní." # todo: NEW TRANSLATION
 SAU_events.205.d: "Rada právě zasedala, když dorazil příkaz, který se nijak nevysvětloval. Členům bylo v čtyřřádkovém komuniké poděkováno za službu, budova byla uzavřena a spisy, které směli roky číst, se vrátily na ministerstva, odkud pocházely.\n\nZasedala z králova svolení. Král už není, nebo už není z rodu Saúdů, a tak není ani Rada. Nikdo v Rijádu nečekal, že přežije týden, a nikdo to neřekl nahlas." # todo: NEW TRANSLATION
 SAU_events.205.t: "Rada je rozpuštěna" # todo: NEW TRANSLATION
 SAU_events.206.a: "Nechte to projít." # todo: NEW TRANSLATION
 SAU_events.206.b: "Koruna souhlas odepře." # todo: NEW TRANSLATION
 SAU_events.206.d: "Reformní křídlo si návrh samo vyčíslilo, což je nové, a vyčíslení je optimistické, což nové není. Silnice do vesnic, které minula hlavní síť, voda do čtvrtí, jež ji stále nakupují z cisteren, a ustanovení vyžadující, aby ministerstvo zveřejnilo, za co utrácí.\n\nMinisterstvu vadí právě poslední ustanovení." # todo: NEW TRANSLATION
 SAU_events.206.t: "Návrh reformistů" # todo: NEW TRANSLATION
 SAU_events.207.a: "Nechte to projít." # todo: NEW TRANSLATION
 SAU_events.207.b: "Koruna souhlas odepře." # todo: NEW TRANSLATION
 SAU_events.207.d: "Tradicionalistické křídlo navrhuje to, co navrhovalo vždy a co nikdy předtím nedokázalo předložit k hlasování: řádně financované nadace, zvýšení příspěvků na bydlení a plán klinik pro provincie, které od ropného boomu žádnou nemají.\n\nMinisterstvo financí označuje výpočty za aspirativní. Křídlo odpovídá, že opačným směrem byly výpočty aspirativní už třicet let." # todo: NEW TRANSLATION
 SAU_events.207.t: "Návrh tradicionalistů" # todo: NEW TRANSLATION
 SAU_events.208.a: "Nechte to projít." # todo: NEW TRANSLATION
 SAU_events.208.b: "Koruna souhlas odepře." # todo: NEW TRANSLATION
 SAU_events.208.d: "Provinční členové se spojili, což nikdo v Rijádu nečekal, že zvládnou. Saúdské kvóty na zaměstnávání s opravdovou vahou, konec sponzorských ujednání, která vážou pracovníka k jednomu zaměstnavateli, a inspektorát podřízený Radě, nikoli ministerstvu, které kontroluje.\n\nKaždý obchodní dům v Džiddě tento týden napsal paláci. Křídlo to ví a přesto hlasování naplánovalo." # todo: NEW TRANSLATION
 SAU_events.208.t: "Návrh provinčních poslanců" # todo: NEW TRANSLATION
 SAU_events.209.a: "Třicet míst královským dekretem." # todo: NEW TRANSLATION
 SAU_events.209.b: "Komora zůstane taková, jaká je." # todo: NEW TRANSLATION
 SAU_events.209.d: "Třicet míst zaručených dekretem, aby žádný budoucí král nemohl jejich počet potichu nechat zaniknout – pětina komory. Vstupovaly by samostatnými dveřmi a seděly v oddělené části; fotografie by však cestovaly mnohem dál než zasedací plán.\n\nDopis podepsalo přes čtyřicet předních učenců. Dopis ničím nevyhrožuje, protože to není potřeba." # todo: NEW TRANSLATION
 SAU_events.209.t: "Ženy v Radě šúry" # todo: NEW TRANSLATION
 SAU_events.21.a: "Pozorně sledujte vývoj." # todo: NEW TRANSLATION
 SAU_events.21.d: "Dosud neznámé hnutí, které si říká [ROOT.SAU_GetFrontName], oznámilo svou existenci na celém Západním břehu a uvnitř samotných hranic Izraele. V koordinovaných prohlášeních přísahá ozbrojený odpor až do osvobození a přisuzuje si vlnu nedávných útoků. Zpravodajské služby se horečně snaží vysledovat jeho původ, financování a dosah." # todo: NEW TRANSLATION
 SAU_events.21.t: "Ve Svaté zemi povstává nová fronta" # todo: NEW TRANSLATION
 SAU_events.210.a: "Perský záliv o monarchii nepřijde." # todo: NEW TRANSLATION
 SAU_events.210.d: "MANÁMA – Saúdská obrněná vozidla před úsvitem překročila hráz krále Fahda a bez jediného výstřelu dorazila do hlavního města. Rijád popisuje nasazení jako operaci Sil štítu poloostrova provedenou na žádost legitimní vlády Bahrajnu a odmítá upřesnit, která vláda o něj požádala.\n\nTeherán to označil za okupaci. Washington vyzval všechny strany ke zdrženlivosti a nikoho nepožádal o odchod. Rodina Chalífa je zpět v paláci a uspořádání, které ji tam vrátilo, je nyní veřejným záznamem, nikoli soukromým porozuměním." # todo: NEW TRANSLATION
 SAU_events.210.t: "Hráz" # todo: NEW TRANSLATION
 SAU_events.211.a: "Čerpejte. Ropná pole jsou strategií." # todo: NEW TRANSLATION
 SAU_events.211.b: "Vybudujte průmysl, který přežije vrty." # todo: NEW TRANSLATION
 SAU_events.211.c: "Provádějte průzkum. Tam venku toho je víc." # todo: NEW TRANSLATION
 SAU_events.211.d: "Abkajk zpracovává většinu ropy Království v jediném zařízení a Ras Tanura ji nakládá v jiném. Dva úspěšné útoky by světové ekonomice způsobily větší škody, než by dokázala kterákoli armáda v regionu za rok, a ministerstvo bylo konečně požádáno, aby nahlas řeklo, co s tím hodlá dělat.\n\nPeníze jsou jen na jednu odpověď, ne na tři. Čerpat více, dokud jsou pole v bezpečí; vybudovat průmysl, který přežije jejich ztrátu; nebo přestat předpokládat, že ropná pole, která už Království má, jsou všechna, která existují." # todo: NEW TRANSLATION
 SAU_events.211.t: "Strategie ochrany ropy" # todo: NEW TRANSLATION
 SAU_events.212.a: "Nechte soudní lavici mířit vzhůru." # todo: NEW TRANSLATION
 SAU_events.212.d: "Zákon byl vždy dostačující. Chyběla pouze lavice ochotná uplatnit jej výše – soud, který by mohl předvolat ministra, komise, která by mohla otevřít účty prince, a soudce, který by poté stále měl kariéru.\n\nBude fungovat přesně tak dobře, jak dobře s ním bude král trpělivý, a každý, kdo by mohl být předvolán, to ví. Peníze se přestanou pohybovat už v týdnu, kdy budou soudy oznámeny." # todo: NEW TRANSLATION
 SAU_events.212.t: "Soudy pro korupci" # todo: NEW TRANSLATION
 SAU_events.213.a: "Nikdo nestojí nad spisem." # todo: NEW TRANSLATION
 SAU_events.213.d: "Přibližně dvě stě princů, ministrů a podnikatelů je po měsíce drženo v nejdražším hotelu v zemi. Údajně se podařilo získat zpět sto miliard dolarů. Obvinění nejsou zveřejněna, rozsudky nejsou vyneseny a propuštění se vyjednává jedno po druhém.\n\nJe to popisováno jako protikorupční kampaň. Ve skutečnosti jde o okamžik, kdy rodina přestala být kolektivem a stala se publikem; každý investor na světě sledoval, jak k tomu došlo." # todo: NEW TRANSLATION
 SAU_events.213.t: "Ritz-Carlton" # todo: NEW TRANSLATION
 SAU_events.214.a: "Vyřešte to potichu. Stejně k tomu mělo dojít." # todo: NEW TRANSLATION
 SAU_events.214.d: "Propuštění se vyjednává jedno po druhém a podmínky nejsou nikdy zveřejněny: zde převedená společnost, tam rozpuštěná nadace, jinde potichu zajištěné místo pro syna. Všichni zúčastnění chápou, že nejde o právní, nýbrž politické nástroje.\n\nPeníze se téměř okamžitě vracejí do země, protože muži, kteří je vracejí, mají nyní důvod držet je tam, kde je lze sledovat. Spis o každém z nich zůstává otevřený v zásuvce v Rijádu." # todo: NEW TRANSLATION
 SAU_events.214.t: "Dohody zadními vrátky" # todo: NEW TRANSLATION
 SAU_events.215.a: "Rodina si bude muset najít něco jiného, o čem se bude hádat." # todo: NEW TRANSLATION
 SAU_events.215.d: "Princové si stále počítali vzájemnou podporu, když důstojníci přestali počítat úplně se vším. Není koho jmenovat dědicem, protože není trůn, který by se dědil – Rada otázku odložila a nemá v úmyslu ji znovu otevřít.\n\nMuži, kteří poslední roky budovali své frakce, zjistili, že frakce má cenu pouze podle hodnoty instituce, která za ní stojí, a institucí stojící za všemi z nich byla monarchie." # todo: NEW TRANSLATION
 SAU_events.215.t: "Nástupnictví je uzavřeno" # todo: NEW TRANSLATION
 SAU_events.216.a: "Nechte je kázat otevřeně." # todo: NEW TRANSLATION
 SAU_events.216.b: "Nechte to jen v jídelnách." # todo: NEW TRANSLATION
 SAU_events.216.c: "Řekněte jim, že Království má vždy jednoho krále." # todo: NEW TRANSLATION
 SAU_events.216.d: "Mutajbovi lidé položili stejnou otázku Dívánu už potřetí v tomto roce a tentokrát se ani neobtěžovali formulovat ji jako otázku. Království se označuje za strážce dvou mešit a chová se jako klient. Faisal takový nebyl. To je celý argument a při bližším zkoumání se nestává složitějším.\n\nNástupnictví je nejisté, což znamená, že vše, co se nyní řekne, se říká před muži, kteří si vybírají stranu." # todo: NEW TRANSLATION
 SAU_events.216.t: "Kruh se ptá znovu" # todo: NEW TRANSLATION
 SAU_events.217.a: "Království pokračuje." # todo: NEW TRANSLATION
 SAU_events.217.d: "Rijád oznámil smrt krále Fahda bin Abd al-Azíze Al Saúda, který držel trůn dvacet tři let a od mrtvice v roce 1995 vykonával jen málo práce, jež s ním souvisela. Království, které opouští, bylo deset let spravováno jeho jménem a rukou jeho bratra; přechod oznámený dnes ráno mění na dokumentech titul, nikoli muže, který je podepisuje.\n\nKorunní princ Abdalláh nastupuje. Je mu už přes osmdesát. Muži, na nichž záleží, se nedívají na něj – dívají se za něj, na toho, kdo bude jmenován příště." # todo: NEW TRANSLATION
 SAU_events.217.t: "Smrt krále Fahda" # todo: NEW TRANSLATION
 SAU_events.218.a: "Nástupnictví je nyní hlavním příběhem." # todo: NEW TRANSLATION
 SAU_events.218.d: "Král Abdalláh bin Abd al-Azíz Al Saud zemřel a s ním odchází poslední z bratrů, kteří mohli uplatnit nárok na trůn pouze na základě seniority, aniž by se někdo ptal podruhé. Byl pohřben v neoznačeném hrobě v al-Oudu, jak vyžaduje obřad a jak byli pohřbeni všichni králové před ním.\n\nSalman nastupuje během několika hodin. Následuje část, kterou Království odkládalo třicet let: koruna nakonec musí přejít na generaci, která k ní nemá automatický nárok, a každý nyní žijící princ to ví." # todo: NEW TRANSLATION
 SAU_events.218.t: "Smrt krále Abdalláha" # todo: NEW TRANSLATION
 SAU_events.219.a: "Ať žije král." # todo: NEW TRANSLATION
 SAU_events.219.d: "Král je mrtev. Rijád zveřejnil oznámení s úsporností jazyka, kterou si vyhrazuje pro trůn, a korunní princ již obdržel bay'u od starších princů, ulamá a mužů velících gardě.\n\nVláda, která dnes končí, začala starým mužem a Královstvím, které stále fungovalo na představě, že koruna přechází mezi bratry do strany. Končí s touto představou, kterou rozebral sám král ve prospěch nástupnictví, jež bylo světu předloženo jako vyřešené." # todo: NEW TRANSLATION
 SAU_events.219.t: "Smrt krále Salmana" # todo: NEW TRANSLATION
 SAU_events.22.a: "Nechte ropu proudit na jih." # todo: NEW TRANSLATION
 SAU_events.22.b: "Naše země není saúdská dálnice." # todo: NEW TRANSLATION
 SAU_events.22.d: "Saúdové žádají, aby jejich jižními provinciemi vedl ropovod k Arabskému moři. Tranzitní poplatky by naplnily naši pokladnu a Rijád by nám dlužil laskavost, kterou by jen těžko splatil." # todo: NEW TRANSLATION
 SAU_events.22.t: "Ropovod k moři" # todo: NEW TRANSLATION
 SAU_events.24.a: "Postavte ropovod." # todo: NEW TRANSLATION
 SAU_events.24.b: "Nabídku odmítněte." # todo: NEW TRANSLATION
 SAU_events.24.d: "Saúdská Arábie nabízí vést svou ropu přes naše území směrem k Turecku a Evropě. Irák by se stal mostem mezi Zálivem a Západem a tranzitní příjmy by znovu vybudovaly národ." # todo: NEW TRANSLATION
 SAU_events.24.t: "Ropovod do Evropy" # todo: NEW TRANSLATION
 SAU_events.25.a: "Pošlete je domů s prázdnýma rukama." # todo: NEW TRANSLATION
 SAU_events.25.d: "Rod Saúdů vysílá vyslance s návrhem ropovodu přes naši půdu. Zapomínají, kdo zde vládne. Irák se nikomu neklaní, nejméně ze všech Rijádu." # todo: NEW TRANSLATION
 SAU_events.25.t: "Saúdský vyslanec v Bagdádu" # todo: NEW TRANSLATION
 SAU_events.26.a: "Výborně." # todo: NEW TRANSLATION
 SAU_events.26.d: "Svářeči pokládají poslední úsek a ventily se otevírají. Saúdská ropa nyní proudí novou tepnou k moři a sevření Království nad světovou energií se utahuje." # todo: NEW TRANSLATION
 SAU_events.26.t: "Ropa proudí" # todo: NEW TRANSLATION
 SAU_events.27.a: "Najdeme jinou cestu." # todo: NEW TRANSLATION
 SAU_events.27.d: "Dohoda ztroskotala. Prozatím zůstává tato cesta k moři mimo náš dosah a Hormuz je stále našimi jedinými dveřmi." # todo: NEW TRANSLATION
 SAU_events.27.t: "Cesta je uzavřena" # todo: NEW TRANSLATION
 SAU_events.28.a: "Drahý neúspěch." # todo: NEW TRANSLATION
 SAU_events.28.d: "Válka dorazila k ropovodu. Sabotéři zničili jeho část a ropa přestala proudit. Dokud nebude jižní Jemen zajištěn, je cesta k Arabskému moři ztracena." # todo: NEW TRANSLATION
 SAU_events.28.t: "Ropovod je přerušen" # todo: NEW TRANSLATION
 SAU_events.29.a: "Otevřete trasu." # todo: NEW TRANSLATION
 SAU_events.29.b: "Saúdy odmítněte." # todo: NEW TRANSLATION
 SAU_events.29.d: "Rijád žádá o vedení ropovodu přes naše království směrem ke Středozemnímu moři. Samotné tranzitní poplatky by stabilizovaly naše finance a Saúdové jsou štědří přátelé." # todo: NEW TRANSLATION
 SAU_events.29.t: "Ropovod přes Jordánsko" # todo: NEW TRANSLATION
 SAU_events.3.a: "Přijměte saúdskou nabídku." # todo: NEW TRANSLATION
 SAU_events.3.b: "Odmítněte saúdskou nabídku." # todo: NEW TRANSLATION
 SAU_events.3.d: "Rijád nabízí čínským společnostem přístup k saúdským zemědělským a energetickým projektům. Přijetí by prohloubilo hospodářské vazby mezi Čínou a Královstvím." # todo: NEW TRANSLATION
 SAU_events.3.t: "[SAU.GetFlag] Saúdsko-čínská dohoda [CHI.GetFlag]" # todo: NEW TRANSLATION
 SAU_events.30.a: "Přivítejte ropovod." # todo: NEW TRANSLATION
 SAU_events.30.b: "Sýrie není na prodej." # todo: NEW TRANSLATION
 SAU_events.30.d: "Poté, co souhlasilo Jordánsko, navrhují Saúdové vést svou ropu přes naše území k moři. Svobodná a prosperující Sýrie by na tom značně vydělala a přátelství s Rijádem stojí za to." # todo: NEW TRANSLATION
 SAU_events.30.t: "Nabídka z Rijádu" # todo: NEW TRANSLATION
 SAU_events.300.a: "Nezávislí technokraté." # todo: NEW TRANSLATION
 SAU_events.300.b: "Královský dohled je nezbytný." # todo: NEW TRANSLATION
 SAU_events.300.c: "Přiveďte zahraniční experty." # todo: NEW TRANSLATION
 SAU_events.300.d: "Zákon o §Lkapitálovém trhu§! je podepsán. Nyní musíme rozhodnout: kdo usedne do čela nové §LAutority kapitálového trhu§!? Technokraté požadují nezávislost; §HKrálovský dvůr§! žádá dohled; zahraniční poradci nabízejí své zkušenosti. Tato volba určí finanční architekturu království na celou generaci." # todo: NEW TRANSLATION
 SAU_events.300.t: "§HKrálovský dekret M/30 – provedení§!" # todo: NEW TRANSLATION
 SAU_events.301.a: "Anglosaský rámec." # todo: NEW TRANSLATION
 SAU_events.301.b: "Rámec s prioritou šaríy." # todo: NEW TRANSLATION
 SAU_events.301.c: "Hybridní model." # todo: NEW TRANSLATION
 SAU_events.301.d: "Formální začlenění mění podobu podnikové krajiny. Akciové společnosti, společnosti s ručením omezeným – §LKrálovství§! si musí zvolit svůj model. §LAnglosaský§! rámec nabízí efektivitu za cenu zahraničního vlivu; rámec s prioritou §Lšaríy§! nabízí legitimitu za cenu rychlosti; §Lhybrid§! volí umírněnou střední cestu." # todo: NEW TRANSLATION
 SAU_events.301.t: "§HPrávní reformy roku 2007§!" # todo: NEW TRANSLATION
 SAU_events.310.a: "Americký výcvik a partnerství" # todo: NEW TRANSLATION
 SAU_events.310.b: "Kolektivní obrana GCC" # todo: NEW TRANSLATION
 SAU_events.310.c: "Profesionalita ve stylu NATO" # todo: NEW TRANSLATION
 SAU_events.310.d: "Domácí soběstačnost" # todo: NEW TRANSLATION
 SAU_events.310.desc: "Operace Pouštní bouře pokořila každou armádu, která ji sledovala. Královské saúdské pozemní síly si vedle koaličních partnerů vedly přijatelně – generální štáb však zná pravdu: bez americké vzdušné síly, logistiky a velení nebyla armáda Království připravena.\n\nVálečné hry skončily a verdikt je znám. Nyní si Království musí zvolit model, podle něhož obnoví své ozbrojené síly. Každá cesta nás jedním způsobem posílí a jiným oslabí – žádná volba není bez ceny.\n\n§YNajeďte kurzorem na každou možnost a zjistěte, co přesně přináší a co stojí.§!" # todo: NEW TRANSLATION
 SAU_events.310.t: "Válečné hry: Poučení z války v Zálivu" # todo: NEW TRANSLATION
 SAU_events.311.a: "Národní garda: Stráž režimu" # todo: NEW TRANSLATION
 SAU_events.311.b: "Národní garda: Kmenové odvody" # todo: NEW TRANSLATION
 SAU_events.311.c: "Národní garda: Vnitřní bezpečnost" # todo: NEW TRANSLATION
 SAU_events.311.desc: "Saúdskoarabská Národní garda musí rozhodnout, k čemu skutečně slouží. Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte kurzorem na možnost a zjistěte, co přesně přináší a co stojí.§!" # todo: NEW TRANSLATION
 SAU_events.311.t: "Cvičení připravenosti Národní gardy" # todo: NEW TRANSLATION
 SAU_events.312.a: "Obrněné síly: Úder a průlom" # todo: NEW TRANSLATION
 SAU_events.312.b: "Obrněné síly: Kombinované zbraně" # todo: NEW TRANSLATION
 SAU_events.312.c: "Obrněné síly: Obranná zeď" # todo: NEW TRANSLATION
 SAU_events.312.desc: "Jak bude obrněný sbor bojovat se svými novými Abramsy? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte kurzorem na možnost a zjistěte, co přesně přináší a co stojí.§!" # todo: NEW TRANSLATION
 SAU_events.312.t: "Výcvik střelby z Abramsů" # todo: NEW TRANSLATION
 SAU_events.313.a: "Dělostřelectvo: hromadná palba" # todo: NEW TRANSLATION
 SAU_events.313.b: "Dělostřelectvo: přesná palba" # todo: NEW TRANSLATION
 SAU_events.313.c: "Dělostřelectvo: palba a přesun" # todo: NEW TRANSLATION
 SAU_events.313.desc: "Dělostřelci zdokonalují své umění – ale kterým směrem? Každá cesta představuje trvalý kompromis – jedním způsobem nás posílí a jiným oslabí.\n\n§YNajeďte na možnost kurzorem a zjistěte, co přesně poskytuje a stojí.§!" # todo: NEW TRANSLATION
 SAU_events.313.t: "Dělostřelecké cvičení s ostrou municí" # todo: NEW TRANSLATION
 SAU_events.314.a: "Armádní letectvo: ničitelé tanků" # todo: NEW TRANSLATION
 SAU_events.314.b: "Armádní letectvo: blízká podpora" # todo: NEW TRANSLATION
 SAU_events.314.c: "Armádní letectvo: průzkum a nájezdy" # todo: NEW TRANSLATION
