 SAU_sp_awacs_control: "AWACS: řízení letecké bitvy" # todo: NEW TRANSLATION
 SAU_sp_awacs_control_desc: "Řídící pracovníci propojují všechny stíhačky do jediné smrtící sítě.\n§G+10 %§! vzdušné převahy\n§G+5 %§! zisku leteckých zkušeností\n§R+3 %§! spotřeby spotřebního zboží" # todo: NEW TRANSLATION
