 SAU_free_trade_agreements: "Dohody o volném obchodu" # todo: NEW TRANSLATION
 SAU_free_trade_agreements_desc: "Podepište dohody o volném obchodu, které připoutají Arábii k trhům světa." # todo: NEW TRANSLATION
 SAU_an_independent_central_bank: "Nezávislá centrální banka" # todo: NEW TRANSLATION
 SAU_an_independent_central_bank_desc: "Osvoboďte měnovou autoritu od politických zásahů." # todo: NEW TRANSLATION
 SAU_champion_the_private_sector: "Prosazovat soukromý sektor" # todo: NEW TRANSLATION
 SAU_champion_the_private_sector_desc: "Podpořte podnikatele a malé firmy, které pohánějí svobodnou ekonomiku." # todo: NEW TRANSLATION
 SAU_equality_for_women: "Rovnost žen" # todo: NEW TRANSLATION
 SAU_equality_for_women_desc: "Zrušte zákony o poručnictví a posaďte ženy jako rovné účastnice veřejného života." # todo: NEW TRANSLATION
 SAU_reform_the_schools: "Reformovat školy" # todo: NEW TRANSLATION
 SAU_reform_the_schools_desc: "Nahraďte mechanickou klerikální výuku moderní, sekulární osnovou." # todo: NEW TRANSLATION
 SAU_an_elected_majlis_al_shura: "Volený Madžlis aš-šúrá" # todo: NEW TRANSLATION
 SAU_an_elected_majlis_al_shura_desc: "Proměňte jmenovanou poradní radu ve svobodně volený národní parlament." # todo: NEW TRANSLATION
 SAU_freedom_of_religion: "Svoboda náboženství" # todo: NEW TRANSLATION
 SAU_freedom_of_religion_desc: "Zaručte každé víře právo svobodně a veřejně se modlit." # todo: NEW TRANSLATION
 SAU_nda_secular_republic: "Sekulární republika" # todo: NEW TRANSLATION
 SAU_nda_secular_republic_desc: "Vytvořte pevnou hranici mezi mešitou a státem." # todo: NEW TRANSLATION
 SAU_empower_civil_society: "Posílit občanskou společnost" # todo: NEW TRANSLATION
 SAU_empower_civil_society_desc: "Legalizujte odbory, charity a sdružení, která spojují svobodný lid." # todo: NEW TRANSLATION
 SAU_guarantee_labor_rights: "Zaručit pracovní práva" # todo: NEW TRANSLATION
 SAU_guarantee_labor_rights_desc: "Zajistěte právo organizovat se, stávkovat a dostávat spravedlivou mzdu." # todo: NEW TRANSLATION
 SAU_a_human_rights_charter: "Charta lidských práv" # todo: NEW TRANSLATION
 SAU_a_human_rights_charter_desc: "Zavažte republiku k univerzálním právům všech jejích obyvatel." # todo: NEW TRANSLATION
 SAU_realign_with_the_west: "Přeorientovat se na Západ" # todo: NEW TRANSLATION
 SAU_realign_with_the_west_desc: "Obraťte republiku k Washingtonu a Bruselu jako partnera mezi demokraciemi." # todo: NEW TRANSLATION
 SAU_mend_the_gulf: "Napravit vztahy v Zálivu" # todo: NEW TRANSLATION
 SAU_mend_the_gulf_desc: "Usmiřte se se státy Zálivu jako s ostatními arabskými zeměmi, včetně monarchií." # todo: NEW TRANSLATION
 SAU_join_the_worlds_institutions: "Připojit se ke světovým institucím" # todo: NEW TRANSLATION
 SAU_join_the_worlds_institutions_desc: "Zaujměte arabské místo v radách mezinárodního řádu." # todo: NEW TRANSLATION
 SAU_open_the_borders: "Otevřít hranice" # todo: NEW TRANSLATION
 SAU_open_the_borders_desc: "Uvolněte tok lidí a zboží přes svobodnější hranici." # todo: NEW TRANSLATION
 SAU_an_arab_democratic_league: "Liga arabských demokracií" # todo: NEW TRANSLATION
 SAU_an_arab_democratic_league_desc: "Shromážděte demokracie arabského světa pod jediným praporem vedeným z Rijádu." # todo: NEW TRANSLATION
 SAU_the_first_free_elections: "První svobodné volby" # todo: NEW TRANSLATION
 SAU_the_first_free_elections_desc: "Otevřete volební urny každému občanovi a nechte lid zvolit vlastní vládu." # todo: NEW TRANSLATION
 SAU_an_independent_judiciary: "Nezávislé soudnictví" # todo: NEW TRANSLATION
 SAU_an_independent_judiciary_desc: "Osvoboďte soudy od paláce a založte soudnictví odpovědné pouze zákonu." # todo: NEW TRANSLATION
 SAU_freedom_of_the_press: "Svoboda tisku" # todo: NEW TRANSLATION
 SAU_freedom_of_the_press_desc: "Sejměte cenzorovu ruku z novin a rozhlasového vysílání." # todo: NEW TRANSLATION
 SAU_the_anti_corruption_commission: "Protikorupční komise" # todo: NEW TRANSLATION
 SAU_the_anti_corruption_commission_desc: "Založte nezávislý dohled, který vymýtí korupci z vysokých úřadů." # todo: NEW TRANSLATION
 SAU_decentralize_the_provinces: "Decentralizovat provincie" # todo: NEW TRANSLATION
 SAU_decentralize_the_provinces_desc: "Přeneste skutečnou moc na volené provinční rady po celém království." # todo: NEW TRANSLATION
 SAU_limit_the_executive: "Omezit výkonnou moc" # todo: NEW TRANSLATION
 SAU_limit_the_executive_desc: "Omezte prezidenta funkčními obdobími, aby žádný vůdce nevládl doživotně." # todo: NEW TRANSLATION
 SAU_the_provisional_government: "Prozatímní vláda" # todo: NEW TRANSLATION
 SAU_convene_the_national_assembly: "Svolat národní shromáždění" # todo: NEW TRANSLATION
 SAU_convene_the_national_assembly_desc: "Prozatímní vláda svolá politické strany nové republiky a určí, které hnutí povede trvalý stát." # todo: NEW TRANSLATION
 SAU_the_communist_party: "Komunistická strana" # todo: NEW TRANSLATION
 SAU_the_communist_party_desc: "Saúdská komunistická strana strávila čtyři desetiletí v ilegalitě, exilu nebo vězení. Její přeživší vedení se vrací do Rijádu s malým, ale dobře organizovaným hnutím." # todo: NEW TRANSLATION
 SAU_the_national_democratic_assembly: "Národní demokratické shromáždění" # todo: NEW TRANSLATION
 SAU_the_national_democratic_assembly_desc: "Předejte novou republiku liberálním demokratům z Národního demokratického shromáždění. Slibují psanou ústavu, volený parlament a otevřenou ekonomiku odpovědnou voličům." # todo: NEW TRANSLATION
 SAU_the_arab_baath_party: "Strana arabského Baas" # todo: NEW TRANSLATION
 SAU_the_arab_baath_party_desc: "Předejte republiku Arabské socialistické straně Baas, sekulárním panarabským nacionalistům, kteří sní o jediném sjednoceném arabském národě." # todo: NEW TRANSLATION
 SAU_the_islamic_parties: "Islámské strany" # todo: NEW TRANSLATION
 SAU_the_islamic_parties_desc: "Duchovní hnutí Sahwa, sítě Muslimského bratrstva a islámské charitativní společnosti přežily opakované zákazy a nyní požadují roli v porevoluční vládě." # todo: NEW TRANSLATION
 SAU_the_provisional_government_desc: "Přechodná národní rada vládne zemi bez ústavy, bez voleb a bez ustálené budoucnosti. Jejím prvním úkolem je jednoduše udržet pořádek a připravit půdu pro republiku, která bude následovat." # todo: NEW TRANSLATION
 SAU_restoration_of_relations: "Obnovení vztahů" # todo: NEW TRANSLATION
 SAU_restoration_of_relations_desc: "Po letech přerušených vztahů se opatrně znovu otevírají ambasády. Řiďte nebezpečné uvolnění napětí s Islámskou republikou, aniž byste obětovali zájmy Království." # todo: NEW TRANSLATION
 SAU_the_house_that_rules_the_kingdom: "Rod, který vládne Království" # todo: NEW TRANSLATION
 SAU_the_house_that_rules_the_kingdom_desc: "Dynastie Ál Saúd vládne střední Arábii po celé generace. Od mrtvice krále Fahda v roce 1995 se §Yefektivní moc§! přesunula na starší prince soupeřící o kontrolu nad nástupnictvím." # todo: NEW TRANSLATION
 SAU_sanction_the_southern_bloc: "Uvalit sankce na jižní blok" # todo: NEW TRANSLATION
 SAU_sanction_the_southern_bloc_desc: "Zaduste finance proíránských frakcí v celém regionu. Sankce a černé listiny připraví teheránské spojence o peníze, které udržují jejich loajalitu." # todo: NEW TRANSLATION
 SAU_saddam_falls: "Saddám padá" # todo: NEW TRANSLATION
 SAU_saddam_falls_desc: "Sochy padají a režim se hroutí, takže po velkém arabském státě zůstává vakuum. Rijád musí jednat dříve, než ho zaplní Teherán." # todo: NEW TRANSLATION
 SAU_saddam_endures: "Saddám přežívá" # todo: NEW TRANSLATION
 SAU_saddam_endures_desc: "Baathistický režim přežil bouři, zraněný, ale nezlomený. Starý nepřítel zůstává za severní hranicí a Království bude muset s bagdádským tyranem žít ještě nějaký čas." # todo: NEW TRANSLATION
 SAU_saudi_economic_focus_tree: "Strom saúdských ekonomických zaměření" # todo: NEW TRANSLATION
 SAU_saudi_economic_focus_tree_desc: "Ropa platí účty, zahraniční pracovníci vykonávají většinu práce a saúdský kapitál příliš často opouští zemi. Příští ekonomika musí vyrábět více doma, zaměstnávat více Saúdů a dát městům za Rijádem podíl na růstu." # todo: NEW TRANSLATION
 SAU_national_water_company: "Národní vodárenská společnost" # todo: NEW TRANSLATION
 SAU_national_water_company_desc: "Království si vybuduje vlastní vodárenství. Jedna státní společnost, jeden mandát a potrubí vedoucí do měst, která by komerčně nikdy neospravedlnila takovou investici.\n\n§GPoskytuje Národní vodárenskou společnost§! a §Gjednu infrastrukturu v Nadždu§! a §Ysnižuje vodní krizi o jeden stupeň§!.\n\nPomalejší a dražší než zadat práci externě. Zůstává však saúdská." # todo: NEW TRANSLATION
 SAU_a_saudi_spanish_partnership: "Saúdsko-španělské partnerství" # todo: NEW TRANSLATION
 SAU_a_saudi_spanish_partnership_desc: "Španělské loděnice staví nové korvety Království a španělské firmy jeho vysokorychlostní železnici do Mekky. Pěstujte Madrid jako užitečného evropského partnera mimo obvyklý okruh." # todo: NEW TRANSLATION
 SAU_sermons_from_the_ministry: "Kázání z ministerstva" # todo: NEW TRANSLATION
 SAU_sermons_from_the_ministry_desc: "Ministerstvo přepracuje páteční khutbu distribuovanou mešitám po celém Království. Společný text čtený z přibližně patnácti tisíc kazatelen dá vládě přímý vliv na náboženská poselství." # todo: NEW TRANSLATION
 SAU_recognize_the_shia_clergy: "Uznat šíitské duchovenstvo" # todo: NEW TRANSLATION
 SAU_recognize_the_shia_clergy_desc: "Udělejte §Yšíitským ulamá§! oficiální postavení po boku wahhábistického establishmentu.\n\n§G+Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_crackdown_on_shia_dissent: "Tvrdě zasáhnout proti šíitskému nesouhlasu" # todo: NEW TRANSLATION
 SAU_crackdown_on_shia_dissent_desc: "Odpovězte na nesouhlas pomocí §YMabahith§! a §YNárodní gardy§!. Šíité budou sledováni, zadržováni a vytlačeni na okraj společnosti – a sunnitská většina si díky tomu oddechne.\n\n§R+Šíitský odpor§!, §R-Šíitská populace§!, §G+Stabilita, +Podpora války§!." # todo: NEW TRANSLATION
 SAU_sunni_shia_dialogue: "Sunnitsko-šíitský dialog" # todo: NEW TRANSLATION
 SAU_sunni_shia_dialogue_desc: "Národní dialog, který zahájí hojení čtrnácti století rozkolu.\n\n§G-Šíitský odpor, +Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_invest_in_the_eastern_province: "Investovat do Východní provincie" # todo: NEW TRANSLATION
 SAU_invest_in_the_eastern_province_desc: "Nalijte petrodolary do šíitského srdce země – do silnic, nemocnic a přístavů.\n\n§G+Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_resettling_the_eastern_province: "Přesídlit Východní provincii" # todo: NEW TRANSLATION
 SAU_resettling_the_eastern_province_desc: "Šíitská otázka je konečně vyřešena. §YVýchodní provincie§! bude po celou generaci uklidňována trpělivým přesídlováním.\n\n§R--Šíitská populace§!, §Godpor zlomen§!, §G++Stabilita§!." # todo: NEW TRANSLATION
 SAU_economic_inclusion: "Ekonomické začlenění" # todo: NEW TRANSLATION
 SAU_economic_inclusion_desc: "Podělte se o bohatství ropných polí s lidmi, kteří nad nimi žijí. Sektářská rána se konečně začíná zacelovat.\n\n§Godpor ukončen, +Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_equal_educational_access: "Rovný přístup ke vzdělání" # todo: NEW TRANSLATION
 SAU_equal_educational_access_desc: "Vybudujte školy a univerzity v §Qatif§! a §YAl-Ahsa§! na úrovni těch v Nadždu.\n\n§G+Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_embrace_shia_citizens: "Přijmout šíitské občany" # todo: NEW TRANSLATION
 SAU_embrace_shia_citizens_desc: "Přivítejte šíity jako plnoprávné občany – a zahajte cestu, která by mohla skončit tím, že samotný §YRod Saúdů§! přehodnotí víru, jejímuž potlačování byl vybudován.\n\n§G+Šíitská populace, -Šíitský odpor§!." # todo: NEW TRANSLATION
 SAU_sectarian_harmony: "Sektářská harmonie" # todo: NEW TRANSLATION
 SAU_sectarian_harmony_desc: "Sunnité a šíité, jeden národ pod jednou korunou.\n\n§Godpor ukončen, +Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_integrate_the_communities: "Integrovat komunity" # todo: NEW TRANSLATION
 SAU_integrate_the_communities_desc: "Otevřete armádu, policii a byrokracii šíitským občanům, kteří přísahají věrnost koruně.\n\n§G-Šíitský odpor, +Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_the_shia_question: "Šíitská otázka" # todo: NEW TRANSLATION
 SAU_the_shia_question_desc: "V ropné §YVýchodní provincii§! žijí přibližně dva miliony §Yšíitských§! občanů. §YRod Saúdů§! si musí vybrat mezi útlakem, přizpůsobením nebo zásadní změnou náboženské politiky." # todo: NEW TRANSLATION
 SAU_rehabilitate_the_detainees: "Rehabilitovat zadržené" # todo: NEW TRANSLATION
 SAU_rehabilitate_the_detainees_desc: "Propusťte politické vězně z Východní provincie a začleňte je zpět do saúdské společnosti.\n\n§G-Šíitský odpor, +Stabilita§!." # todo: NEW TRANSLATION
 SAU_shia_political_representation: "Politické zastoupení šíitů" # todo: NEW TRANSLATION
 SAU_shia_political_representation_desc: "Křesla v §YRádě šúrá§! pro šíity z Východní provincie.\n\n§G-Šíitský odpor, +Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_shia_rights_reform: "Reforma práv šíitů" # todo: NEW TRANSLATION
 SAU_shia_rights_reform_desc: "Zakotvěte práva šíitů v zákonech země.\n\n§G-Šíitský odpor, +Stabilita, +Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_security_clampdown: "Bezpečnostní represe" # todo: NEW TRANSLATION
 SAU_security_clampdown_desc: "Zaplavte Východní provincii kontrolními stanovišti, informátory a jednotkami rychlé reakce.\n\n§R+Šíitský odpor§!, §R-Šíitská populace§!, §G+Podpora války§!." # todo: NEW TRANSLATION
 SAU_sectarian_settlement: "Sektářské urovnání" # todo: NEW TRANSLATION
 SAU_sectarian_settlement_desc: "Království vyřešilo šíitskou otázku represí, přizpůsobením nebo konverzí a nyní může výslednou politiku upevnit.\n\n§G+Stabilita, +Politická moc§!." # todo: NEW TRANSLATION
 SAU_the_house_of_saud_embraces_shiaism: "Rod Saúdů přijímá šíitství" # todo: NEW TRANSLATION
 SAU_the_house_of_saud_embraces_shiaism_desc: "Nemyslitelné: §Ykrálovská rodina§! formálně přijímá §Ydvanáctnické šíitství§!. Staletí wahhábistické ortodoxie jsou zvrácena jediným dekretem. §YVýchodní provincie§! jásá; §YNadžd§! a §Yulamá§! jsou otřeseni.\n\n§G++Šíitská populace§!, §Godpor ukončen§!, §Rpřijměte šíitskou víru§!, §R-Stabilita§! (prozatím)." # todo: NEW TRANSLATION
 SAU_sunni_supremacy: "Sunnitská nadřazenost" # todo: NEW TRANSLATION
 SAU_sunni_supremacy_desc: "Zakotvěte sunnitské prvenství v zákonech, školách a mešitách. V Království existuje jediná pravá víra – a není to jejich víra.\n\n§R-Šíitská populace§!, §G+Stabilita, +Podpora války§!." # todo: NEW TRANSLATION
 SAU_suppress_the_clerics: "Potlačit duchovenstvo" # todo: NEW TRANSLATION
 SAU_suppress_the_clerics_desc: "Umlčte bojovné kazatele z §YQatif§! a §YAwamiyah§!, než se jejich kázání promění ve slogany.\n\n§R+Šíitský odpor§!, §R-Šíitská populace§!." # todo: NEW TRANSLATION
 SAU_sunni_shia_tolerance: "Sunnitsko-šíitská tolerance" # todo: NEW TRANSLATION
 SAU_sunni_shia_tolerance_desc: "Ani nepronásledovat, ani nekonvertovat – jednoduše spolu žít. Uvolněte omezení, nechte šíity v klidu uctívat svou víru a nechte Království dýchat.\n\n§G-Šíitský odpor, +Stabilita, +Šíitská populace§! (bez změny víry)." # todo: NEW TRANSLATION
 SAU_stir_the_axis_of_resistance: "Rozdmýchat osu odporu" # todo: NEW TRANSLATION
 SAU_stir_the_axis_of_resistance_desc: "Síla Íránu spočívá v řetězci zástupných sil od Libanonu po Jemen a každý článek má své nespokojence. Financujte protesty a rozkoly, které promění teheránské spojence v přítěž." # todo: NEW TRANSLATION
 SAU_foreign_volunteers_for_the_rebels: "Zahraniční dobrovolníci pro povstalce" # todo: NEW TRANSLATION
 SAU_foreign_volunteers_for_the_rebels_desc: "Samotné peníze válku nevyhrají. Otevřete trasy, které přivedou bojovníky a materiál přes hranice k frontovým liniím opozice." # todo: NEW TRANSLATION
 SAU_direct_intervention_in_yemen: "Přímá intervence v Jemenu" # todo: NEW TRANSLATION
 SAU_direct_intervention_in_yemen_desc: "Pošlete saúdskou armádu. Přímé tažení slibuje rychlejší rozhodnutí a jasnější vítězství, ale hrozí bažinou, která bude Království krvácet celé roky." # todo: NEW TRANSLATION
 SAU_a_proxy_war_in_yemen: "Zástupná válka v Jemenu" # todo: NEW TRANSLATION
 SAU_a_proxy_war_in_yemen_desc: "Veďte válku prostřednictvím jiných. Financujte exilovou vládu, jižní milice a kmeny a nechte Jemence umírat, zatímco saúdská letadla budou přihlížet shora." # todo: NEW TRANSLATION
 SAU_supreme_military_council: "Nejvyšší vojenská rada" # todo: NEW TRANSLATION
 SAU_supreme_military_council_desc: "Prozatímní vojenská rada obdrží trvalou chartu a formální pravidla členství. Členství určí hodnost, zatímco velení během převratu bude nadále utvářet vliv uvnitř Rady." # todo: NEW TRANSLATION
 SAU_the_amman_bailout: "Záchrana Ammánu" # todo: NEW TRANSLATION
 SAU_the_amman_bailout_desc: "Hášimovské království je křehkou hrází proti chaosu na severu a je na mizině. Udržujte Jordánsko solventní a loajální pomocí šekové knížky Království." # todo: NEW TRANSLATION
 SAU_the_battle_for_the_straits: "Bitva o průlivy" # todo: NEW TRANSLATION
 SAU_the_battle_for_the_straits_desc: "Kdo ovládá Hormuzský průliv, ovládá pětinu světové ropy. Připravte Království a jeho spojence, aby zlomili íránské sevření nejdůležitější vodní cesty světa." # todo: NEW TRANSLATION
 SAU_the_islamic_rivalry: "Islámské soupeření" # todo: NEW TRANSLATION
 SAU_the_islamic_rivalry_desc: "Írán prosazuje svůj revoluční model a podporuje ozbrojené skupiny od Libanonu po Jemen. Saúdská Arábie bude íránskému vedení čelit prostřednictvím médií, regionálních partnerů a příprav na možný konflikt v Zálivu." # todo: NEW TRANSLATION
 SAU_the_levant_strategy: "Levantinská strategie" # todo: NEW TRANSLATION
 SAU_the_levant_strategy_desc: "Sýrie hoří a Jordánsko se kymácí, za nimi leží cesta ke Středozemnímu moři. Utvářejte Levantu ve prospěch Saúdské Arábie dříve, než to udělá Írán a jeho spojenci." # todo: NEW TRANSLATION
 SAU_the_new_order_over_the_kingdom: "Nový řád nad Královstvím" # todo: NEW TRANSLATION
 SAU_the_new_order_over_the_kingdom_desc: "Nouzová vláda se stala trvalým politickým řádem. Opakované prodlužování vojenské moci odstranilo jakýkoli praktický rozdíl mezi dočasnými opatřeními a běžnou vládou." # todo: NEW TRANSLATION
 SAU_the_silk_road_pivot: "Obrat k Hedvábné stezce" # todo: NEW TRANSLATION
 SAU_the_silk_road_pivot_desc: "Čína je největším odběratelem saúdské ropy a nepodmiňuje ekonomickou spolupráci domácí politickou reformou. Iniciativa Pás a stezka nabízí přístavy, železnice a kapitál, ale vztah zůstává především transakční." # todo: NEW TRANSLATION
 SAU_the_silk_web_network: "Síť hedvábné pavučiny" # todo: NEW TRANSLATION
 SAU_the_silk_web_network_desc: "Informace jsou zbraní a Království s nimi hodlá zacházet. Spřádejte síť médií, duchovních a hlasů na internetu, která ponese poselství Rijádu celým regionem." # todo: NEW TRANSLATION
 SAU_the_american_shield: "Americký štít" # todo: NEW TRANSLATION
 SAU_the_american_shield_desc: "Nezvratně spojte obranu Království se Spojenými státy: základny, zpravodajství a nevyřčená záruka, že útok na Rijád je útokem na zájmy Washingtonu. Cenou je závislost na jediném patronovi." # todo: NEW TRANSLATION
 SAU_the_succession_question: "Otázka nástupnictví" # todo: NEW TRANSLATION
 SAU_the_succession_question_desc: "Tisíce princů si v rámci starého řádu zachovávají postavení a potenciální nároky. Vláda musí rozhodnout, zda je penzionovat, vyhnat, stíhat nebo politicky odsunout na okraj." # todo: NEW TRANSLATION
 SAU_the_spirit_of_taif: "Duch Táifu" # todo: NEW TRANSLATION
 SAU_the_spirit_of_taif_desc: "Saúdská Arábie kdysi zprostředkovala Táifskou dohodu, která ukončila libanonskou občanskou válku a poskytla Království vliv v Bejrútu. Obnovte tuto roli a vyrvěte Libanon z íránské sféry." # todo: NEW TRANSLATION
 SAU_the_yemen_quagmire: "Jemenská bažina" # todo: NEW TRANSLATION
 SAU_the_yemen_quagmire_desc: "Válka v Jemenu byla nákladná, ale také vlákala Írán do pasti a odhalila ho jako patrona húsijských raket dopadajících na Rijád. Proměňte bažinu v diplomatickou zbraň." # todo: NEW TRANSLATION
 SAU_the_yemeni_peace_talks: "Jemenská mírová jednání" # todo: NEW TRANSLATION
 SAU_the_yemeni_peace_talks_desc: "Každá válka končí u stolu. Přiveďte jemenské frakce k dohodě za podmínek, které zajistí jižní hranici Království." # todo: NEW TRANSLATION
 SAU_defeat_in_syria: "Porážka v Sýrii" # todo: NEW TRANSLATION
 SAU_defeat_in_syria_desc: "Režim přežívá, podpíraný ruskými letadly a íránskými milicemi. Království musí omezit ztráty a zachránit z války, kterou nemohlo vyhrát, tolik vlivu, kolik dokáže." # todo: NEW TRANSLATION
 SAU_total_victory_in_the_civil_war: "Naprosté vítězství v občanské válce" # todo: NEW TRANSLATION
 SAU_total_victory_in_the_civil_war_desc: "Rozdrťte Húsíje a obnovte jedinou vládu zcela podřízenou Rijádu. Jemen se stane saúdským protektorátem, byť ne podle jména." # todo: NEW TRANSLATION
 SAU_victory_in_syria: "Vítězství v Sýrii" # todo: NEW TRANSLATION
 SAU_victory_in_syria_desc: "Damašek padá a s ním i íránský pozemní most k Hizballáhu. Přátelská vláda v Sýrii otevírá Levantu saúdskému vlivu a Středozemní moře saúdským ropovodům." # todo: NEW TRANSLATION
 SAU_trials_of_the_old_order: "Procesy se starým řádem" # todo: NEW TRANSLATION
 SAU_trials_of_the_old_order_desc: "Rada bude členy bývalého královského řádu stíhat před veřejnými soudy. Na rozdíl od soukromých dohod při čistce v Ritz-Carltonu v roce 2017 tato řízení otevřeně představí obvinění i rozsudky a zároveň poslouží politickým zájmům Rady." # todo: NEW TRANSLATION
 SAU_a_partnership_with_britain: "Partnerství s Británií" # todo: NEW TRANSLATION
 SAU_a_partnership_with_britain_desc: "Od kontraktů Al-Jamamah po výcvik saúdských důstojníků byl Londýn tišším, ale stabilnějším přítelem než většina ostatních. Formalizujte strategické partnerství se Spojeným královstvím." # todo: NEW TRANSLATION
 SAU_benign_dominance: "Dobrotivá dominance" # todo: NEW TRANSLATION
 SAU_benign_dominance_desc: "Rijád vede s §Glehčí rukou§!: investicemi, patronátem a respektem k důstojnosti menších emirátů. Hegemonie bez ponižování." # todo: NEW TRANSLATION
 SAU_command_and_control: "Velení a řízení" # todo: NEW TRANSLATION
 SAU_command_and_control_desc: "Společné velitelské centrum, integrovaná protivzdušná obrana a sdílené zpravodajství poskytnou Štítu poloostrova jednotnou operační strukturu." # todo: NEW TRANSLATION
 SAU_unif_command_control_tt: "§HNapříč ozbrojenými silami GCC je vytvořena jednotná velitelská a řídicí struktura.§!" # todo: NEW TRANSLATION
 SAU_common_market: "Společný trh" # todo: NEW TRANSLATION
 SAU_common_market_desc: "Jednotný regulační rámec: jedna sada norem, jeden celní dokument, jeden regionální trh s §Y50 miliony spotřebitelů§!." # todo: NEW TRANSLATION
 SAU_cross_border_transit_systems: "Přeshraniční tranzitní systémy" # todo: NEW TRANSLATION
 SAU_cross_border_transit_systems_desc: "Dálnice, železnice a potrubí propojují celý poloostrov. §YŽeleznice GCC§! – dlouho diskutovaná, nikdy nepostavená – konečně zahajuje výstavbu." # todo: NEW TRANSLATION
 SAU_unif_cross_border_tt: "§YVyžaduje rozvinutou přeshraniční infrastrukturu v pohraniční oblasti (úroveň infrastruktury 3 nebo vyšší).§!" # todo: NEW TRANSLATION
 SAU_economic_union: "Hospodářská unie" # todo: NEW TRANSLATION
 SAU_economic_union_desc: "Jednotná §Ycelní zóna§!, harmonizované předpisy a základy §Yspolečného trhu§! napříč poloostrovem. Obchodníci z §Džiddy§! a §Dubaje§! čekají už celou generaci." # todo: NEW TRANSLATION
 SAU_exploit_authority: "Využít autoritu" # todo: NEW TRANSLATION
 SAU_exploit_authority_desc: "Saúdská Arábie bude prosazovat svou hegemonii prostřednictvím §Yekonomického tlaku§! a dalších donucovacích opatření proti neposlušným členským státům. Aliance bude fungovat jako §Gblok ovládaný Saúdy§!." # todo: NEW TRANSLATION
 SAU_unif_exploit_authority_tt: "§YVyžaduje, aby Království mělo vedoucí zahraniční vliv v každém dalším členském státě GCC.§!" # todo: NEW TRANSLATION
 SAU_the_gulf_cooperation_council: "Rada pro spolupráci v Zálivu" # todo: NEW TRANSLATION
 SAU_the_gulf_cooperation_council_desc: "Po dvě desetiletí §YGCC§! fungovala především jako poradní fórum mezi monarchiemi Perského zálivu. Rijád ji rozšíří v účinnější regionální organizaci." # todo: NEW TRANSLATION
 SAU_the_gulf_academy: "Akademie Zálivu" # todo: NEW TRANSLATION
 SAU_the_gulf_academy_desc: "Jednotná důstojnická akademie v §Rijádu§!. Budoucí generálové ze všech států GCC budou sdílet učebnu, doktrínu a §Yloajalitu k Alianci§!." # todo: NEW TRANSLATION
 SAU_increase_autonomy: "Zvýšit autonomii" # todo: NEW TRANSLATION
 SAU_increase_autonomy_desc: "Nezávislejší §Yzahraniční politika§!. GCC bude na mezinárodních fórech hovořit samo za sebe – nikoli jako americký klient, ale jako §Yregionální mocnost§!.\n\n§YJedna ze tří cest pro patrona Rady§! – §YWashington§!, §Ynoví partneři§! nebo §Ynikdo§!. Otevírají se v tomto pořadí: k novým partnerům se můžete obrátit teprve poté, co vás Američané §Rodmítnou§!, a osamostatnit se můžete až po obojím. §RKaždá cesta, kterou zvolíte, navždy uzavře cesty nad ní.§!" # todo: NEW TRANSLATION
 SAU_unif_increase_autonomy_tt: "§HVětší regionální autonomie zmírňuje sektářské křivdy. Domácí vliv roste a radikalizace ustupuje.§!" # todo: NEW TRANSLATION
 SAU_intra_gcc_trade: "Obchod uvnitř GCC" # todo: NEW TRANSLATION
 SAU_intra_gcc_trade_desc: "Odstraňte poslední celní bariéry mezi členskými státy. Zboží, kapitál a pracovní síla volně proudí od §Maskatu§! po §Kuvajt§!." # todo: NEW TRANSLATION
 SAU_joint_defense_agreement: "Dohoda o společné obraně" # todo: NEW TRANSLATION
 SAU_joint_defense_agreement_desc: "Vzájemný obranný pakt ve stylu §Yčlánku 5§!: útok na jednoho je útokem na všechny. §Írán§! si toho všimne." # todo: NEW TRANSLATION
 SAU_joint_research_initiatives: "Společné výzkumné iniciativy" # todo: NEW TRANSLATION
 SAU_joint_research_initiatives_desc: "Společný §Ytechnologický fond§! sdružuje zdroje na odsolování, solární energii a výzkum petrochemie. §YKAUST§! se stane regionálním centrem." # todo: NEW TRANSLATION
 SAU_gcc_joint_ventures: "Společné podniky GCC" # todo: NEW TRANSLATION
 SAU_gcc_joint_ventures_desc: "GCC bude koordinovat výrobu, nákup a údržbu obranné techniky. Saúdský kapitál, §Gemirátská logistika§! a §bahrajnské loděnice§! podpoří společný vojensko-průmyslový systém." # todo: NEW TRANSLATION
 SAU_the_khaleeji_union: "Chalídžská unie" # todo: NEW TRANSLATION
 SAU_the_khaleeji_union_desc: "Šest monarchií vytvoří konfederaci se sdílenou pravomocí nad zahraniční politikou, obranou a měnou. §YChalídžská unie§! bude vedena z §Rijádu§!." # todo: NEW TRANSLATION
 SAU_military_union: "Vojenská unie" # todo: NEW TRANSLATION
 SAU_military_union_desc: "§YŠtít poloostrova§! existuje od roku 1984, ale jeho praktická integrace je omezená. Rijád zřídí společné velení, sdílené nákupy a společnou doktrínu." # todo: NEW TRANSLATION
 SAU_new_partners: "Noví partneři" # todo: NEW TRANSLATION
 SAU_new_partners_desc: "Mimo Washington: dohody s §Pekingem§!, §Moskvou§!, §Dillí§! a §Bruselem§!. Poloostrov diverzifikuje své patrony.\n\n§YJedna ze tří cest pro patrona Rady§! – §YWashington§!, §Ynoví partneři§! nebo §Ynikdo§!. Otevírají se v tomto pořadí: k novým partnerům se můžete obrátit teprve poté, co vás Američané §Rodmítnou§!, a osamostatnit se můžete až po obojím. §RKaždá cesta, kterou zvolíte, navždy uzavře cesty nad ní.§!" # todo: NEW TRANSLATION
 SAU_political_union: "Politická unie" # todo: NEW TRANSLATION
 SAU_political_union_desc: "Koordinovaná zahraniční politika. Společná diplomatická linie. Menší emiráty se obávají §Ysaúdské nadvlády§! – Rijád však trvá na tom, že jde o partnerství §Yrovných monarchů§!." # todo: NEW TRANSLATION
 SAU_solidify_pro_american_alignment: "Upevnit proamerické směřování" # todo: NEW TRANSLATION
 SAU_solidify_pro_american_alignment_desc: "§YGCC§! formalizuje své bezpečnostní partnerství s Washingtonem. Základny, výcvik, zbraně a zpravodajství – to vše bude proudit přes Rijád.\n\n§YJedna ze tří cest pro patrona Rady§! – §YWashington§!, §Ynoví partneři§! nebo §Ynikdo§!. Otevírají se v tomto pořadí: k novým partnerům se můžete obrátit teprve poté, co vás Američané §Rodmítnou§!, a osamostatnit se můžete až po obojím. §RKaždá cesta, kterou zvolíte, navždy uzavře cesty nad ní.§!" # todo: NEW TRANSLATION
 SAU_pursue_hegemony: "Usilovat o hegemonii" # todo: NEW TRANSLATION
 SAU_pursue_hegemony_desc: "Rijád nahradí neformální vedení přímou autoritou nad ostatními monarchiemi GCC. Mohou protestovat, ale saúdský ekonomický a vojenský tlak omezí jejich schopnost odporovat." # todo: NEW TRANSLATION
 SAU_a_robust_alliance: "Silná aliance" # todo: NEW TRANSLATION
 SAU_a_robust_alliance_desc: "§YŠtít poloostrova§! se stane operační silou o 100 000 vojácích s moderním vybavením a jednotnou doktrínou." # todo: NEW TRANSLATION
 SAU_shared_currency: "Společná měna" # todo: NEW TRANSLATION
 SAU_shared_currency_desc: "§YChalídžský dinár§! – jediná měna GCC, navázaná nikoli na dolar, ale na měnový koš. Nejodvážnější ekonomický krok, jaký poloostrov kdy podnikl." # todo: NEW TRANSLATION
 SAU_the_yemeni_civil_war: "Jemenská občanská válka" # todo: NEW TRANSLATION
 SAU_the_yemeni_civil_war_desc: "Hútíové obsadili hlavní město a zahnali uznávanou vládu do exilu, zatímco na prahu Arábie zapouští kořeny íránská základna. Království musí rozhodnout, jak daleko půjde, aby tento stav zvrátilo." # todo: NEW TRANSLATION
 SAU_sabotage_the_regimes_backers: "Sabotovat podporovatele režimu" # todo: NEW TRANSLATION
 SAU_sabotage_the_regimes_backers_desc: "Na každý kanón, který Království pošle, Teherán a Moskva pošlou dva. Pracujte ve stínech a narušujte zásobovací linie a zástupné síly podpírající Damašek." # todo: NEW TRANSLATION
 HOU_houthi_resilience: "Odolnost Ansár Alláhu" # todo: NEW TRANSLATION
 HOU_houthi_resilience_desc: "Ansár Alláh působí v hornatém severu Jemenu už desítky let. Znalost terénu a zavedená postavení ve vysočině činí síly Hútíů obtížně vytlačitelnými." # todo: NEW TRANSLATION
 PER_houthi_defense_buff: "Horská opevnění" # todo: NEW TRANSLATION
 PER_houthi_defense_buff_desc: "Íránem vybudovaná obrana proměňuje vysočinu v pevnost. +15 % obrany proti vládním silám." # todo: NEW TRANSLATION
 SAU_arab_shield_member: "Člen Arabského štítu" # todo: NEW TRANSLATION
 SAU_arab_shield_member_desc: "Tento národ se účastní společných obranných mechanismů Arabského štítu, čímž zlepšuje obranu a morálku svých ozbrojených sil." # todo: NEW TRANSLATION
 SAU_aramco_01: "Saudi Aramco" # todo: NEW TRANSLATION
 SAU_aramco_01_desc: "Saudi Arabian Oil Company je největší ropnou společností na světě, plně znárodněnou od roku 1980. Aramco ovládá rozsáhlé ropné rezervy Království a slouží jako páteř saúdské ekonomiky, přičemž vytváří většinu příjmů vlády. Společnost je nesmírně zisková, ale funguje s omezenou transparentností a dosud nemodernizovala svou podnikovou strukturu." # todo: NEW TRANSLATION
 SAU_aramco_02: "Saudi Aramco – rozšířený provoz" # todo: NEW TRANSLATION
 SAU_aramco_02_desc: "Aramco rozšířilo své aktivity za hranice těžby surové ropy a investuje do rafinačních kapacit, petrochemických podniků a mezinárodních partnerství. Rostoucí efektivita a diverzifikované portfolio společnosti posílily její pozici základního pilíře saúdské ekonomiky." # todo: NEW TRANSLATION
 SAU_aramco_03: "Saudi Aramco – světový energetický lídr" # todo: NEW TRANSLATION
 SAU_aramco_03_desc: "Saudi Aramco se proměnilo v moderního globálního energetického giganta. Díky úspěšnému vstupu na burzu, rozšířeným následným operacím a strategickým mezinárodním investicím nyní patří mezi nejhodnotnější společnosti na světě. Její příjmy financují nejen rozpočet Království, ale také ambiciózní rozvojové programy po celé zemi." # todo: NEW TRANSLATION
 SAU_aramco_downstream: "§HSaudi Aramco§! – integrace následných operací" # todo: NEW TRANSLATION
 SAU_aramco_downstream_desc: "Aramco rozšířilo své působení do rafinace a chemické výroby, což mu umožňuje získávat příjmy z každé fáze mezi těžbou surové ropy a prodejem paliva." # todo: NEW TRANSLATION
 SAU_aramco_engineers: "§HSaudi Aramco§! – saúdští ropní inženýři" # todo: NEW TRANSLATION
 SAU_aramco_engineers_desc: "Generace saúdských ropných inženýrů, vyškolených na KFUPM i v zahraničí, nahradila zahraniční odborníky, kteří kdysi řídili ropná pole." # todo: NEW TRANSLATION
 SAU_aramco_export: "§HSaudi Aramco§! – exportní velmoc" # todo: NEW TRANSLATION
 SAU_aramco_export_desc: "Aramco je vybudováno jako exportní stroj; jeho terminály a flotily tankerů jsou vyladěny tak, aby dodávaly více surové ropy na více trhů než kterýkoli konkurent." # todo: NEW TRANSLATION
 SAU_aramco_gas: "§HSaudi Aramco§! – hlavní plynový systém" # todo: NEW TRANSLATION
 SAU_aramco_gas_desc: "Hlavní plynový systém zachycuje zemní plyn, který byl dříve spalován, a přepravuje jej do elektráren a průmyslových zařízení po celé Saúdské Arábii." # todo: NEW TRANSLATION
 SAU_aramco_ghawar: "§HSaudi Aramco§! – ložisko Ghawar" # todo: NEW TRANSLATION
 SAU_aramco_ghawar_desc: "Ghawar je největším konvenčním ropným ložiskem na světě a produkuje miliony barelů denně. Jeho produkce je klíčová pro Aramco i saúdskou ekonomiku." # todo: NEW TRANSLATION
 SAU_aramco_giant: "§HSaudi Aramco§! – nejhodnotnější společnost světa" # todo: NEW TRANSLATION
 SAU_aramco_giant_desc: "Aramco je nejhodnotnější společností na Zemi; její produkce, rezervy a zisky nemají v dějinách podnikání obdoby." # todo: NEW TRANSLATION
 SAU_aramco_megafields: "§HSaudi Aramco§! – nová obří ložiska" # todo: NEW TRANSLATION
 SAU_aramco_megafields_desc: "Rozsáhlý rozvoj polí Shaybah, Khurais a pobřežního ložiska Manifa zvýšil saúdskou produkční kapacitu a pokračoval v investicích Království do velkých ropných projektů." # todo: NEW TRANSLATION
 SAU_aramco_national: "§HSaudi Aramco§! – úplné znárodnění" # todo: NEW TRANSLATION
 SAU_aramco_national_desc: "Výkup amerických akcionářů dokončený v roce 1980 učinil z Aramca plně saúdskou společnost. Ropa Království nyní odpovídá pouze Rijádu." # todo: NEW TRANSLATION
 SAU_aramco_opec: "§HSaudi Aramco§! – pohyblivý producent OPEC" # todo: NEW TRANSLATION
 SAU_aramco_opec_desc: "Saúdská Arábie udržuje dostatečnou rezervní produkční kapacitu, aby mohla zvyšovat či snižovat nabídku OPEC a ovlivňovat světové ceny ropy více než kterýkoli jiný člen." # todo: NEW TRANSLATION
 SAU_aramco_petrochem: "§HSaudi Aramco§! – integrovaná rafinace" # todo: NEW TRANSLATION
 SAU_aramco_petrochem_desc: "PetroRabigh a SATORP, společné podniky se Sumitomo a Total, spojují rafinaci a petrochemii do jednotných integrovaných komplexů u Rudého moře a Perského zálivu." # todo: NEW TRANSLATION
 SAU_aramco_production: "§HSaudi Aramco§! – maximalizovat produkci" # todo: NEW TRANSLATION
 SAU_aramco_production_desc: "Aramco upřednostňuje maximální udržitelnou produkci při zachování rezervní kapacity. To umožňuje Saúdské Arábii rychle reagovat na změny poptávky nebo vládní produkční politiky." # todo: NEW TRANSLATION
 SAU_aramco_rastanura: "§HSaudi Aramco§! – Ras Tanura a Abqaiq" # todo: NEW TRANSLATION
 SAU_aramco_rastanura_desc: "Exportní terminál Ras Tanura a zpracovatelský komplex Abqaiq zpracovávají velkou část saúdské surové ropy před jejím vstupem na světové trhy. Společně patří k největším zařízením svého druhu." # todo: NEW TRANSLATION
 SAU_aramco_rnd: "§HSaudi Aramco§! – výzkum EXPEC" # todo: NEW TRANSLATION
 SAU_aramco_rnd_desc: "Centrum pokročilého výzkumu EXPEC v Dhahránu vede svět v oblasti rezervoárového inženýrství a získává více ropy z každého ložiska při nižších nákladech." # todo: NEW TRANSLATION
 SAU_baathist_party_1: "Bašta arabského nacionalismu" # todo: NEW TRANSLATION
 SAU_baathist_party_1_loc: "\n[SAU.GetFlag]Bašta arabského nacionalismu\n§HMultiplikátor zahraničního vlivu§! : §G+5,00 %§!\n§HFaktor úspěchu převratu zahraničního vlivu§! : §G+25,0 %§!\n\n" # todo: NEW TRANSLATION
 SAU_baathist_party_3: "Jednota, svoboda, socialismus" # todo: NEW TRANSLATION
 SAU_baathist_party_3_loc: "[SAU.GetFlag]Jednota, svoboda, socialismus\nRychlost výstavby: §G+10,00 %§!\nMultiplikátor nákladů nacionalistické propagandistické kampaně: §G-10,00 %§!\nMěsíční růst produktivity: §G+0,05§!\n\n" # todo: NEW TRANSLATION
 SAU_banking_649_hybrid: "§HZákon o úroku§! – §Yhybridní (sukúk + neformální)§!" # todo: NEW TRANSLATION
 SAU_banking_649_hybrid_desc: "Sukúk a islámské bankovní služby fungují vedle neformálních konvenčních půjček. Systém zůstává oficiálně v souladu se šaríou, přičemž umožňuje omezenou praktickou flexibilitu." # todo: NEW TRANSLATION
 SAU_banking_649_hybrid_loc: "\n§HZákon o úroku:§! §Ysukúk + neformální úrok§!\n  §G+2,0 %§! daň z kancelářských parků\n  §G+1,0 %§! politické moci\n  §G+0,5 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_649_islamic: "§HZákon o úroku§! – §Rpřísný zákaz riba§!" # todo: NEW TRANSLATION
 SAU_banking_649_islamic_desc: "Riba je bez výjimky zakázána. Finance proudí prostřednictvím struktur sdílení zisku a murabahy a věřící mohou bankovat s čistým svědomím." # todo: NEW TRANSLATION
 SAU_banking_649_islamic_loc: "\n§HZákon o úroku:§! §Bpřísný zákaz riba§!\n  §G+3,0 %§! politické moci\n  §G+2,0 %§! stability\n  §G+0,5 %§! salafistického odklonu\n" # todo: NEW TRANSLATION
 SAU_banking_649_secular: "§HZákon o úroku§! – §Gkonvenční§!" # todo: NEW TRANSLATION
 SAU_banking_649_secular_desc: "Úrok je legální a otevřeně stanovovaný. Konvenční bankovnictví prosperuje a kapitál volně proudí bez ohledu na páteční kázání duchovních." # todo: NEW TRANSLATION
 SAU_banking_649_secular_loc: "\n§HZákon o úroku:§! §Gkonvenční§!\n  §G+4,0 %§! daň z kancelářských parků\n  §G+3,0 %§! daň z podniků\n  §G+0,5 %§! demokratického odklonu\n  §R-1,0 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_650_hybrid: "§HPovinné rezervy§! – §Yumírněné§!" # todo: NEW TRANSLATION
 SAU_banking_650_hybrid_desc: "Umírněné požadavky na rezervy umožňují bankám rozšiřovat úvěry a zároveň zachovávat větší finanční polštáře než v systému s lehkou regulací." # todo: NEW TRANSLATION
 SAU_banking_650_hybrid_loc: "\n§HPovinné rezervy:§! §Yumírněné rezervy§!\n  §G+1,0 %§! rychlosti výstavby\n  §G+0,5 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_650_islamic: "§HPovinné rezervy§! – §Rplné krytí aktivy§!" # todo: NEW TRANSLATION
 SAU_banking_650_islamic_desc: "Každý vklad je krytý skutečnými aktivy. Úvěry rostou pomalu, ale žádná saúdská banka nemůže při náporu vkladatelů zkrachovat." # todo: NEW TRANSLATION
 SAU_banking_650_islamic_loc: "\n§HPovinné rezervy:§! §Bplné krytí aktivy (šaría)§!\n  §G+2,5 %§! stability\n  §G+2,0 %§! podpory války\n  §R-2,0 %§! rychlosti výstavby\n" # todo: NEW TRANSLATION
 SAU_banking_650_secular: "§HPovinné rezervy§! – §Gčástečné rezervy§!" # todo: NEW TRANSLATION
 SAU_banking_650_secular_desc: "Banky půjčují proti části svých vkladů a západním způsobem násobí úvěry v celé ekonomice." # todo: NEW TRANSLATION
 SAU_banking_650_secular_loc: "\n§HPovinné rezervy:§! §Gčástečné rezervy (západní)§!\n  §G+3,0 %§! rychlosti výstavby\n  §G+5,0 %§! oprav průmyslu\n  §R-2,0 %§! spotřeby spotřebního zboží\n  §R-1,5 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_651_hybrid: "§HKodex spekulací§! – §Yregulované deriváty§!" # todo: NEW TRANSLATION
 SAU_banking_651_hybrid_desc: "Obchodování s deriváty probíhá v přísných mezích, zajištění je povoleno a spekulace kontrolována." # todo: NEW TRANSLATION
 SAU_banking_651_hybrid_loc: "\n§HKodex spekulací:§! §Ypouze regulované deriváty§!\n  §G+1,5 %§! daňového výnosu\n  §G+0,5 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_651_islamic: "§HKodex spekulací§! – §Rbez ghararu§!" # todo: NEW TRANSLATION
 SAU_banking_651_islamic_desc: "Zákaz ghararu blokuje deriváty, krátké prodeje a další finanční produkty založené na nadměrné nejistotě nebo spekulaci." # todo: NEW TRANSLATION
 SAU_banking_651_islamic_loc: "\n§HKodex spekulací:§! §Bbez ghararu – bez hazardu§!\n  §G+2,5 %§! stability\n  §G+2,0 %§! politické moci\n  §G+3§! přijetí neutrality\n" # todo: NEW TRANSLATION
 SAU_banking_651_secular: "§HKodex spekulací§! – §Glehká regulace§!" # todo: NEW TRANSLATION
 SAU_banking_651_secular_desc: "Opce, futures a další deriváty jsou povoleny pod omezeným regulačním dohledem." # todo: NEW TRANSLATION
 SAU_banking_651_secular_loc: "\n§HKodex spekulací:§! §Gpovolené deriváty a futures§!\n  §G+3,0 %§! daňového výnosu\n  §G+2,0 %§! rychlosti výzkumu\n  §R-2,0 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_652_hybrid: "§HMezibankovní kodex§! – §Ydvojí kanály§!" # todo: NEW TRANSLATION
 SAU_banking_652_hybrid_desc: "Vedle sebe fungují dva mezibankovní kanály, konvenční a islámský, a každá banka si vybírá svého partnera." # todo: NEW TRANSLATION
 SAU_banking_652_hybrid_loc: "\n§HMezibankovní kodex:§! §Ydvojí kanály§!\n  §G+1,5 %§! daň z kancelářských parků\n  §G+1,0 %§! politické moci\n" # todo: NEW TRANSLATION
 SAU_banking_652_islamic: "§HMezibankovní kodex§! – §Rmurabaha§!" # todo: NEW TRANSLATION
 SAU_banking_652_islamic_desc: "Mezibankovní likvidita proudí prostřednictvím komoditní murabahy, takže i jednodenní peníze zůstávají v mezích šaríi." # todo: NEW TRANSLATION
 SAU_banking_652_islamic_loc: "\n§HMezibankovní kodex:§! §Bzaložený na murabahe§!\n  §G+2,5 %§! politické moci\n  §G+1,5 %§! stability\n  §G+0,5 %§! salafistického odklonu\n" # todo: NEW TRANSLATION
 SAU_banking_652_secular: "§HMezibankovní kodex§! – §Gve stylu LIBORu§!" # todo: NEW TRANSLATION
 SAU_banking_652_secular_desc: "Banky si navzájem půjčují za referenční úrokové sazby a propojují saúdské finance s globálními peněžními trhy." # todo: NEW TRANSLATION
 SAU_banking_652_secular_loc: "\n§HMezibankovní kodex:§! §Gkonvenční úrokový koridor§!\n  §G+3,0 %§! daň z kancelářských parků\n  §G+2,0 %§! daň z podniků\n  §G+0,5 %§! demokratického odklonu\n  §R-1,0 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_653_hybrid: "§HKontrola bankovnictví§! – §Yparalelní struktury§!" # todo: NEW TRANSLATION
 SAU_banking_653_hybrid_desc: "Konvenční a islámské banky odpovídají paralelním dohledovým strukturám pod střechou jedné centrální banky." # todo: NEW TRANSLATION
 SAU_banking_653_hybrid_loc: "\n§HKontrola bankovnictví:§! §Yparalelní struktury SAMA a šaríi§!\n  §G+2,0 %§! daňového výnosu\n  §G+1,5 %§! politické moci\n" # todo: NEW TRANSLATION
 SAU_banking_653_islamic: "§HKontrola bankovnictví§! – §RSAMA a rada šaríi§!" # todo: NEW TRANSLATION
 SAU_banking_653_islamic_desc: "SAMA sdílí pravomoc s dozorčí radou šaríi a žádná bankovní licence nepřežije veto učenců." # todo: NEW TRANSLATION
 SAU_banking_653_islamic_loc: "\n§HKontrola bankovnictví:§! §BSAMA a dohled šaríi§!\n  §G+4,0 %§! politické moci\n  §G+2,5 %§! stability\n  §G+1,0 %§! salafistického odklonu\n" # todo: NEW TRANSLATION
 SAU_banking_653_secular: "§HKontrola bankovnictví§! – §Gnezávislá SAMA§!" # todo: NEW TRANSLATION
 SAU_banking_653_secular_desc: "SAMA reguluje bankovnictví jako nezávislá centrální banka, odpovědná důvěře trhu a téměř ničemu jinému." # todo: NEW TRANSLATION
 SAU_banking_653_secular_loc: "\n§HKontrola bankovnictví:§! §Gnezávislá SAMA§!\n  §G+4,0 %§! daňového výnosu\n  §G+2,0 %§! rychlosti výzkumu\n  §G+1,0 %§! demokratického odklonu\n  §R-1,0 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_654_pragmatic: "§HIslámské finance§! – §Yglobální islámské centrum§!" # todo: NEW TRANSLATION
 SAU_banking_654_pragmatic_desc: "Rijád se rozvíjí v mezinárodní centrum islámských financí. Jeho předpisy si zachovávají důvěryhodnost šaríi a zároveň vycházejí vstříc institucím z dalších významných finančních trhů." # todo: NEW TRANSLATION
 SAU_banking_654_pragmatic_loc: "\n§HBašta islámských financí:§! §Yglobální centrum islámských financí§!\n  §G+3,0 %§! politické moci\n  §G+2,5 %§! stability\n  §G+5,0 %§! daně z kancelářských parků\n  §G+4,0 %§! daně z podniků\n  §G+5§! přijetí neutrality\n" # todo: NEW TRANSLATION
 SAU_banking_654_strict: "§HIslámské finance§! – §Rpřísná ortodoxie§!" # todo: NEW TRANSLATION
 SAU_banking_654_strict_desc: "Království vyžaduje úplné dodržování ortodoxních islámských finančních pravidel. To omezuje flexibilitu, ale přitahuje klienty, kteří upřednostňují přísný soulad se šaríou." # todo: NEW TRANSLATION
 SAU_banking_654_strict_loc: "\n§HBašta islámských financí:§! §Bpřísná ortodoxie§!\n  §G+5,0 %§! politické moci\n  §G+5,0 %§! stability\n  §G+2,0 %§! salafistického odklonu\n  §G+10§! přijetí neutrality\n  §G+10,0 %§! obrany proti odklonu\n" # todo: NEW TRANSLATION
 SAU_banking_655_full: "§HSekularizované finance§! – §Gplně anglosaské§!" # todo: NEW TRANSLATION
 SAU_banking_655_full_desc: "Saúdská Arábie plně přijala anglosaský model bankovnictví. Změna rozšiřuje konvenční kapitálové trhy, ale čelí odporu náboženského establishmentu." # todo: NEW TRANSLATION
 SAU_banking_655_full_loc: "\n§HSekularizované finance:§! §Gplně anglosaské§!\n  §G+10,0 %§! daň z kancelářských parků\n  §G+7,0 %§! daň z podniků\n  §G+5,0 %§! daňový výnos\n  §G+4,0 %§! rychlost výzkumu\n  §G+2,0 %§! demokratický odklon\n  §R-3,0 %§! stability\n  §R-2,0 %§! spotřeby spotřebního zboží\n" # todo: NEW TRANSLATION
 SAU_banking_655_gradual: "§HSekularizované finance§! – §Ypostupné§!" # todo: NEW TRANSLATION
 SAU_banking_655_gradual_desc: "Konvenční finanční pravidla se zavádějí postupně, aby se omezil organizovaný náboženský odpor vůči sekularizaci." # todo: NEW TRANSLATION
 SAU_banking_655_gradual_loc: "\n§HSekularizované finance:§! §Ypostupný přechod§!\n  §G+6,0 %§! daň z kancelářských parků\n  §G+4,0 %§! daň z podniků\n  §G+3,0 %§! daňový výnos\n  §G+1,0 %§! demokratický odklon\n  §R-1,0 %§! stability\n" # todo: NEW TRANSLATION
 SAU_banking_system: "§HBankovní systém§!" # todo: NEW TRANSLATION
 SAU_banking_system_desc: "Finanční sektor Království. Každý fokus bankovního práva dává hráči volbu §Lsekulární§!, §Lislamistickou§! nebo §Lhybridní§!; výsledek zde existuje jako §Hpodsystém§!. Celkový modifikátor vychází ze součtu všech zvolených podsystémů." # todo: NEW TRANSLATION
 SAU_banking_system_tt: "[SAU_banking_649_loc][SAU_banking_650_loc][SAU_banking_651_loc][SAU_banking_652_loc][SAU_banking_653_loc][SAU_banking_654_loc][SAU_banking_655_loc]" # todo: NEW TRANSLATION
 SAU_black_february_bailout_idea: "Únorová intervence" # todo: NEW TRANSLATION
 SAU_black_february_bailout_idea_desc: "Stát vynaložil veřejné prostředky na zpomalení kolapsu Tadawulu a ochranu drobných investorů před nejhoršími ztrátami. Intervence omezuje dostupné prostředky státní pokladny a vytváří nákladný precedens pro budoucí krize trhu." # todo: NEW TRANSLATION
 SAU_black_february_idea: "Černý únor" # todo: NEW TRANSLATION
 SAU_black_february_idea_desc: "Tadawul ztratil dvě třetiny své hodnoty a zničil značnou část úspor investovaných saúdskými domácnostmi. Neschopnost vlády zasáhnout vyvolala rozsáhlý veřejný hněv." # todo: NEW TRANSLATION
