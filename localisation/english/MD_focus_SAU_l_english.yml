l_english:
 saudi_focus_tree: "Strom zaměření Saúdské Arábie" # todo: NEW TRANSLATION
 SAU_accession_to_the_sco: "Přistoupení k SCO" # todo: NEW TRANSLATION
 SAU_accession_to_the_sco_desc: "Rijád se v roce 2023 stal partnerem pro dialog Šanghajské organizace pro spolupráci. Plné členství by prohloubilo vztahy s Čínou a Ruskem, ale vyžadovalo by také užší spolupráci s Íránem." # todo: NEW TRANSLATION
 SAU_the_royal_saudi_air_force: "Královské saúdskoarabské letectvo" # todo: NEW TRANSLATION
 SAU_the_royal_saudi_air_force_desc: "Rozvinout Královské saúdskoarabské letectvo (RSAF) v nejsilnější leteckou sílu v Perském zálivu." # todo: NEW TRANSLATION
 SAU_peace_sun_f_15_eagle_program: "Peace Sun: Program F-15 Eagle" # todo: NEW TRANSLATION
 SAU_peace_sun_f_15_eagle_program_desc: "Spustit program Peace Sun se Spojenými státy a přivést F-15 Eagle do Království." # todo: NEW TRANSLATION
 SAU_f_15c_d_eagle_squadrons: "Letky F-15C/D Eagle" # todo: NEW TRANSLATION
 SAU_f_15c_d_eagle_squadrons_desc: "Nasadit letky F-15C/D Eagle k získání a udržení vzdušné převahy nad saúdským nebem." # todo: NEW TRANSLATION
 SAU_f_15s_eagle: "F-15S Eagle" # todo: NEW TRANSLATION
 SAU_f_15s_eagle_desc: "Získat F-15S Eagle v rámci Peace Sun IX, schopný bojovat o vzdušnou převahu a provádět hluboké údery." # todo: NEW TRANSLATION
 SAU_tornado_gr4: "Tornado GR4" # todo: NEW TRANSLATION
 SAU_tornado_gr4_desc: "Dohoda Al-Yamamah s Británií přivede Tornado GR4 do saúdské služby. Jeho úderné schopnosti jsou spojeny s dlouhodobou závislostí na britském výcviku, náhradních dílech a údržbě." # todo: NEW TRANSLATION
 SAU_panavia_tornado: "Panavia Tornado" # todo: NEW TRANSLATION
 SAU_panavia_tornado_desc: "Nasadit letky Panavia Tornado v úderných, průzkumných a protivzdušných rolích." # todo: NEW TRANSLATION
 SAU_the_european_typhoon_al_salam_deal: "Evropský Typhoon: Dohoda Al Salam" # todo: NEW TRANSLATION
 SAU_the_european_typhoon_al_salam_deal_desc: "Podepsat dohodu Al Salam na dodávku Typhoonu, moderního víceúčelového stíhacího letounu pro nové století." # todo: NEW TRANSLATION
 SAU_f_15sa_advanced_eagle: "F-15SA Advanced Eagle" # todo: NEW TRANSLATION
 SAU_f_15sa_advanced_eagle_desc: "F-15SA je víc než pouhý nákup. Jeho avionika, výzbroj a nároky na údržbu vyžadují saúdskou podpůrnou základnu schopnou udržet Advanced Eagle ve vzduchu." # todo: NEW TRANSLATION
 SAU_e_3_sentry_awacs: "E-3 Sentry AWACS" # todo: NEW TRANSLATION
 SAU_e_3_sentry_awacs_desc: "Provozovat E-3 Sentry AWACS k pozorování a řízení celé vzdušné situace a k navádění stíhaček." # todo: NEW TRANSLATION
 SAU_aerial_refueling_fleet: "Flotila pro doplňování paliva za letu" # todo: NEW TRANSLATION
 SAU_aerial_refueling_fleet_desc: "Vybudovat flotilu tankerů, aby saúdské letouny mohly hlídkovat nad celým Královstvím a útočit na dlouhou vzdálenost." # todo: NEW TRANSLATION
 SAU_c_130_hercules_airlift: "Letecká přeprava C-130 Hercules" # todo: NEW TRANSLATION
 SAU_c_130_hercules_airlift_desc: "Rozšířit flotilu C-130 Hercules k rychlé přepravě vojáků a zásob kamkoli v zemi." # todo: NEW TRANSLATION
 SAU_king_abdulaziz_air_base: "Letecká základna krále Abdulazize" # todo: NEW TRANSLATION
 SAU_king_abdulaziz_air_base_desc: "Rozvinout leteckou základnu krále Abdulazize v Dhahránu, která střeží Východní provincii a Perský záliv." # todo: NEW TRANSLATION
 SAU_king_khalid_air_base: "Letecká základna krále Chálida" # todo: NEW TRANSLATION
 SAU_king_khalid_air_base_desc: "Rozvinout leteckou základnu krále Chálida v Chamis Mušajtu, opevněnou jižní základnu kryjící jemenskou hranici." # todo: NEW TRANSLATION
 SAU_prince_sultan_air_base: "Letecká základna prince Sultána" # todo: NEW TRANSLATION
 SAU_prince_sultan_air_base_desc: "Rozvinout leteckou základnu prince Sultána v Al Kharji, centrální uzel hluboko uvnitř Království." # todo: NEW TRANSLATION
 SAU_precision_guided_munitions: "Přesně naváděná munice" # todo: NEW TRANSLATION
 SAU_precision_guided_munitions_desc: "Skladovat přesně naváděné bomby a střely, aby jediný výpad dokázal zničit to, k čemu dříve bylo zapotřebí mnoha útoků." # todo: NEW TRANSLATION
 SAU_saudi_uav_program: "Saúdský program bezpilotních letounů" # todo: NEW TRANSLATION
 SAU_saudi_uav_program_desc: "Zahájit saúdský program dronů pro vytrvalý průzkum a přesné údery." # todo: NEW TRANSLATION
 SAU_air_operations_command: "Velitelství leteckých operací" # todo: NEW TRANSLATION
 SAU_air_operations_command_desc: "Zřídit ústřední Velitelství leteckých operací, které bude plánovat a vést celou leteckou kampaň jako jeden celek." # todo: NEW TRANSLATION
 SAU_secure_support_in_the_al_madinah_province: "Zajistit podporu v provincii Al-Madína" # todo: NEW TRANSLATION
 SAU_secure_support_in_the_al_madinah_province_desc: "Medína ukrývá Prorokovu mešitu a vlivné duchovní zázemí. Zajištění podpory jejích učenců pomůže legitimizovat Radu a snížit náboženský odpor." # todo: NEW TRANSLATION
 SAU_the_house_of_al_saud: "Rod Al Saud" # todo: NEW TRANSLATION
 SAU_the_house_of_al_saud_desc: "Abdulaziz ibn Saud vytvořil systém nástupnictví, v němž trůn přecházel mezi jeho syny podle seniority. Po šesti králích a sedmdesáti letech zbývající způsobilí bratři stárnou a Království se musí připravit na nástup další generace." # todo: NEW TRANSLATION
 SAU_ground_broken_at_rabigh: "Zahájení výstavby v Rabighu" # todo: NEW TRANSLATION
 SAU_ground_broken_at_rabigh_desc: "Království zahájí výstavbu hospodářského města o rozloze 68 kilometrů čtverečních u Rabighu, plánovaného pro dva miliony obyvatel a velký přístav v Rudém moři. Jde o největší ze šesti hospodářských měst, jejichž cílem je přilákat soukromé investice vedle státního financování." # todo: NEW TRANSLATION
 SAU_hold_municipal_elections: "Uspořádat komunální volby" # todo: NEW TRANSLATION
 SAU_hold_municipal_elections_desc: "Muži starší jednadvaceti let zvolí polovinu křesel v obecních radách, zatímco vláda jmenuje zbytek. Rady mají omezené pravomoci nad službami, jako je kanalizace, pouliční osvětlení a povolení, ale hlasování vytváří důležitý politický precedens." # todo: NEW TRANSLATION
 SAU_establish_the_peoples_council: "Zřídit Lidovou radu" # todo: NEW TRANSLATION
 SAU_establish_the_peoples_council_desc: "Království zřídí volenou radu s pravomocí navrhovat zákony o vnitřních záležitostech. Král si zachová absolutní veto, ale jeho uplatnění ponese viditelné politické náklady." # todo: NEW TRANSLATION
 SAU_securing_our_future: "Zajistit naši budoucnost" # todo: NEW TRANSLATION
 SAU_securing_our_future_desc: "Království zpřísní kontrolu publikací prostřednictvím licencí, schválených editorů a omezení citlivých témat. To oslabí organizovanou opozici a posílí režim, ale také odradí kvalifikované absolventy od návratu a zabrání ministerstvům přijímat upřímnou kritiku." # todo: NEW TRANSLATION
 SAU_intervention_in_bahrain: "Intervence v Bahrajnu" # todo: NEW TRANSLATION
 SAU_intervention_in_bahrain_desc: "Síly Peninsula Shield zasáhly v Bahrajnu v březnu 2011 na žádost bahrajnské vlády a pomohly potlačit nepokoje v Manámě. Království tento závazek obnoví a připraví se bránit rod Chalífa bez čekání na další summit GCC." # todo: NEW TRANSLATION
 SAU_investigate_the_east: "Vyšetřovat Východ" # todo: NEW TRANSLATION
 SAU_investigate_the_east_desc: "Protesty v Katífu a Awamíji se rozšířily od požadavků týkajících se nezaměstnanosti a zadržovaných osob k širším politickým křivdám. Ministerstvo vnitra prošetří opoziční činnost ve Východní provincii a zakročí proti identifikovaným hrozbám." # todo: NEW TRANSLATION
 SAU_women_in_the_shura_council: "Ženy v Radě šúrá" # todo: NEW TRANSLATION
 SAU_women_in_the_shura_council_desc: "V Poradní radě dosud nesloužila žádná žena, ačkoli základní zákon jejich jmenování nezakazuje. Král může ženy jmenovat přímo, ale musí tak učinit navzdory očekávanému odporu konzervativních učenců." # todo: NEW TRANSLATION
 SAU_the_oil_defense_strategy: "Strategie obrany ropy" # todo: NEW TRANSLATION
 SAU_the_oil_defense_strategy_desc: "Království závisí na malém počtu ropných zařízení podél pobřeží Perského zálivu. Jednotná strategie obrany ropy zkoordinuje rozpočet a ochrání tato zařízení, zatímco stát bude rozvíjet jejich alternativy." # todo: NEW TRANSLATION
 SAU_national_security_threats: "Hrozby národní bezpečnosti" # todo: NEW TRANSLATION
 SAU_national_security_threats_desc: "Saúdská národní bezpečnost čelí čtyřem propojeným hrozbám: válce na jižní hranici, džihádistickému náboru, nepokojům mezi šíitským obyvatelstvem poblíž ropných polí a skupinám podporovaným Íránem na hranicích Království. K posuzování a koordinaci politiky proti všem čtyřem bude financována jediná služba." # todo: NEW TRANSLATION
 SAU_the_riyadh_meeting_operation_decisive_storm: "Schůzka v Rijádu: Operace Rozhodná bouře" # todo: NEW TRANSLATION
 SAU_the_riyadh_meeting_operation_decisive_storm_desc: "V Rijádu se shromáždila koalice devíti států a 26. března 2015 zahájila operaci Rozhodná bouře, která spojila letecké operace s námořní blokádou. Saúdští plánovači očekávali krátkou kampaň navzdory varováním Jemenců obeznámených s konfliktem." # todo: NEW TRANSLATION
 SAU_the_tenth_five_year_plan: "Desátý pětiletý plán" # todo: NEW TRANSLATION
 SAU_the_tenth_five_year_plan_desc: "Desátý pětiletý plán stanovuje cíle pro růst mimo ropný sektor, zaměstnanost Saúdů a diverzifikaci ekonomiky. Předchozí plány slibovaly podobné věci, ale klesající rezervy činí jejich provedení stále naléhavějším." # todo: NEW TRANSLATION
 SAU_defying_the_ajam: "Vzdorovat Ajamům" # todo: NEW TRANSLATION
 SAU_defying_the_ajam_desc: "Poprava Nimra al-Nimra, vypálení saúdského velvyslanectví v Teheránu a přerušení diplomatických vztahů prudce vyhrotily soupeření s Íránem. Království přijme ekonomické a diplomatické náklady, místo aby vypadalo, že ustupuje." # todo: NEW TRANSLATION
 SAU_aramco_ipo: "IPO Aramca" # todo: NEW TRANSLATION
 SAU_aramco_ipo_desc: "Saúdská Aramco nabídla v prosinci 2019 na burze Tadawul 1,5 % svých akcií a získala přibližně 25 miliard dolarů. Prodej nedosáhl korunním princem navrhovaného ocenění ve výši dvou bilionů dolarů ani zahraničního uvedení na burzu, přesto zůstal největším prodejem státního majetku v regionu." # todo: NEW TRANSLATION
 SAU_vision_2030_announced: "Vyhlášení Vize 2030" # todo: NEW TRANSLATION
 SAU_vision_2030_announced_desc: "Vize 2030 byla vyhlášena v dubnu 2016 s cíli vytvořit státní fond v hodnotě dvou bilionů dolarů, snížit závislost na ropě, zvýšit zaměstnanost v soukromém sektoru a provést rozsáhlé sociální reformy. Na rozdíl od dřívějších diverzifikačních plánů stanovuje pevný termín pro jejich uskutečnění." # todo: NEW TRANSLATION
 SAU_saudi_israel_normalization_track: "Cesta k normalizaci vztahů mezi Saúdskou Arábií a Izraelem" # todo: NEW TRANSLATION
 SAU_saudi_israel_normalization_track_desc: "Saúdská Arábie nemá s Izraelem smluvní ani ambasádní vztahy, ale povoluje izraelské přelety a udržuje diskrétní zpravodajské kontakty. Rijád veřejně nadále požaduje pokrok v otázce Palestiny, zatímco v soukromí diskutuje o normalizaci za odlišných podmínek." # todo: NEW TRANSLATION
 SAU_establish_corruption_courts: "Zřídit protikorupční soudy" # todo: NEW TRANSLATION
 SAU_establish_corruption_courts_desc: "Království zřídí specializované protikorupční soudy a stálou komisi s pravomocí nad ministry a princi. Jejich důvěryhodnost bude záviset na tom, zda budou stíhat vysoce postavené obžalované stejně jako běžné úředníky." # todo: NEW TRANSLATION
 SAU_the_ritz_carlton_purge: "Čistka v Ritz-Carltonu" # todo: NEW TRANSLATION
 SAU_the_ritz_carlton_purge_desc: "Protikorupční kampaň zadržela v hotelu Ritz-Carlton přibližně dvě stě princů a podnikatelů a získala značný majetek. Zároveň upevnila pravomoc korunního prince nad královskou rodinou." # todo: NEW TRANSLATION
 SAU_backdoor_deals: "Dohody v zákulisí" # todo: NEW TRANSLATION
 SAU_backdoor_deals_desc: "Zadržení v Ritz-Carltonu budou propuštěni po soukromě vyjednaných finančních vyrovnáních namísto veřejných procesů. To rychle obnoví majetek, ale nedostatek transparentních řízení poškodí důvěru v právní stát." # todo: NEW TRANSLATION
 SAU_a_new_kingdom: "Nové království" # todo: NEW TRANSLATION
 SAU_a_new_kingdom_desc: "Abdullah vládl jménem Fahda po většinu desetiletí před Fahdovou smrtí. Jeho nástup nezmění ústavní pořádek, ale poskytne mu přímou pravomoc uskutečňovat politiky, které dříve pouze navrhoval." # todo: NEW TRANSLATION
 SAU_consolidating_the_crown: "Upevnění koruny" # todo: NEW TRANSLATION
 SAU_consolidating_the_crown_desc: "Královský dekret vytvoří Radu věrnosti složenou ze synů a vnuků Abdulazize, která bude potvrzovat korunní prince a posuzovat způsobilost krále. Tím vznikne první písemný postup nástupnictví, ačkoli schopnost Rady omezovat krále zůstane nejistá." # todo: NEW TRANSLATION
 SAU_scholarship_programs_abroad: "Zahraniční stipendijní programy" # todo: NEW TRANSLATION
 SAU_scholarship_programs_abroad_desc: "Stipendijní program bude financovat studium desítek tisíc Saúdů a jejich rodin v zahraničí. Rozšíří kvalifikovanou pracovní sílu Království a zároveň vystaví studenty politickým a společenským systémům odlišným od těch v Saúdské Arábii." # todo: NEW TRANSLATION
 SAU_expand_the_national_guard: "Rozšířit Národní gardu" # todo: NEW TRANSLATION
 SAU_expand_the_national_guard_desc: "Národní garda je rekrutována z kmenů historicky loajálních Abdulazizovi a působí mimo běžné vojenské velení. Její rozšíření ochrání trůn a zabrání pravidelnému důstojnickému sboru ovládnout veškerou ozbrojenou moc v Království." # todo: NEW TRANSLATION
 SAU_joining_the_wto: "Připojení k WTO" # todo: NEW TRANSLATION
 SAU_joining_the_wto_desc: "Po dvanácti letech vyjednávání se Království připojí k WTO prostřednictvím závazných cel, otevření sektoru služeb, přijetí zahraničních bank a pojišťoven a revize obchodního práva. Členství omezí část obchodní autonomie, ale poskytne Saúdské Arábii hlas v systému řídícím její vývoz ropy." # todo: NEW TRANSLATION
 SAU_al_saud_national_dialogue: "Národní dialog" # todo: NEW TRANSLATION
 SAU_al_saud_national_dialogue_desc: "Národní dialog spojí šíitské duchovní, salafistické učence, ženy a muže k diskusi o celostátních otázkách a předložení závěrů králi. Nemá zákonodárnou pravomoc, ale umožňuje neobvykle širokou veřejnou debatu." # todo: NEW TRANSLATION
 SAU_counter_terrorism_cooperation: "Spolupráce v boji proti terorismu" # todo: NEW TRANSLATION
 SAU_counter_terrorism_cooperation_desc: "Bombové útoky na obytné komplexy v roce 2003 ukázaly, že al-Káida cílí na saúdský stát stejně jako na Američany v Království. Saúdská Arábie odpoví raziemi, seznamy sledovaných osob, finančním vyšetřováním a programy rehabilitace bojovníků v úzké spolupráci s americkými zpravodajskými službami." # todo: NEW TRANSLATION
 SAU_the_atlantic_realignment: "Atlantické přeskupení" # todo: NEW TRANSLATION
 SAU_the_atlantic_realignment_desc: "Rada bude usilovat o uznání a podporu Washingtonu tím, že zdůrazní, že saúdský vývoz ropy bude za nové vlády pokračovat. Tím se prověří, zda Spojené státy oceňují vztah se saúdským státem více než sesazenou monarchii." # todo: NEW TRANSLATION
 SAU_foreign_water_operators: "Zahraniční provozovatelé vody" # todo: NEW TRANSLATION
 SAU_foreign_water_operators_desc: "Odsolovací program je zadán v mezinárodním výběrovém řízení. Závody rostou rychleji než cokoli, co Království vybudovalo samo, a muži, kteří je řídí, odpovídají centrále v zahraničí.\n\n§GPoskytuje zahraniční provozovatele vody§! a §Yzmírňuje vodní krizi o jeden stupeň§!, za cenu §Rvlívu Ameriky v Království§!.\n\nEfektivní, ale s trvalou rukou na kohoutku." # todo: NEW TRANSLATION
 SAU_among_the_major_powers: "Mezi velmocemi" # todo: NEW TRANSLATION
 SAU_among_the_major_powers_desc: "Ropa činí Království nepostradatelným, ale nepostradatelnost není totéž co bezpečí. Překročme hranice regionu k mocnostem, které utvářejí světový řád, a rozhodněme, o kterou z nich se Rijád opře." # todo: NEW TRANSLATION
 SAU_anti_iranian_propaganda: "Protiíránská propaganda" # todo: NEW TRANSLATION
 SAU_anti_iranian_propaganda_desc: "Království využije své mediální sítě ke kritice Islámské republiky a k budování sunnitské podpory proti íránskému vlivu." # todo: NEW TRANSLATION
 SAU_appoint_loyalists_in_the_provinces: "Jmenovat loajalisty v provinciích" # todo: NEW TRANSLATION
 SAU_appoint_loyalists_in_the_provinces_desc: "Nová vláda nahradí královské guvernéry provincií loajálními sloužícími důstojníky. Tím odstraní důležitý zdroj knížecí moci a podřídí provincie vojenské kontrole." # todo: NEW TRANSLATION
 SAU_unity_freedom_socialism: "Jednota, svoboda, socialismus" # todo: NEW TRANSLATION
 SAU_unity_freedom_socialism_desc: "Tři slova Ba'athu se stanou zákonem země: jednota arabského národa, osvobození od kolonizátora a socialismus pro lid." # todo: NEW TRANSLATION
 SAU_cells_across_the_arab_world: "Buňky napříč arabským světem" # todo: NEW TRANSLATION
 SAU_cells_across_the_arab_world_desc: "Strana zřídí buňky Ba'athu v arabských metropolích, aby organizovala a podporovala budoucí revoluce." # todo: NEW TRANSLATION
 SAU_the_sword_of_unity: "Meč jednoty" # todo: NEW TRANSLATION
 SAU_the_sword_of_unity_desc: "Arabské státy, které odmítnou dobrovolné sjednocení, budou silou přivedeny do nového pořádku." # todo: NEW TRANSLATION
 SAU_purge_the_reactionaries: "Očistit reakcionáře" # todo: NEW TRANSLATION
 SAU_purge_the_reactionaries_desc: "Revoluční vláda odstraní monarchisty, islamisty a zahraniční agenty, kteří ohrožují vládu Ba'athu." # todo: NEW TRANSLATION
 SAU_the_united_arab_republic: "Sjednocená arabská republika" # todo: NEW TRANSLATION
 SAU_the_united_arab_republic_desc: "Arabské země budou sjednoceny v jediném revolučním státě zvaném Sjednocená arabská republika." # todo: NEW TRANSLATION
 SAU_one_arab_nation: "Jeden arabský národ" # todo: NEW TRANSLATION
 SAU_one_arab_nation_desc: "Vymazat hranice narýsované Sykesem a Picotem a naučit celou generaci, že existuje pouze jediný arabský národ nesoucí věčné poselství." # todo: NEW TRANSLATION
 SAU_the_vanguard_of_the_arabs: "Předvoj Arabů" # todo: NEW TRANSLATION
 SAU_the_vanguard_of_the_arabs_desc: "Arábie si nárokuje vedení arabského světa od Atlantiku po Perský záliv a bude řídit širší nacionalistické hnutí." # todo: NEW TRANSLATION
 SAU_expel_the_imperialists: "Vyhnat imperialisty" # todo: NEW TRANSLATION
 SAU_expel_the_imperialists_desc: "Vyhnat poslední zahraniční základny a poradce z arabské půdy a roztrhat nerovné smlouvy koloniální éry." # todo: NEW TRANSLATION
 SAU_industrialize_the_nation: "Industrializovat národ" # todo: NEW TRANSLATION
 SAU_industrialize_the_nation_desc: "Národní průmyslový plán vybuduje ocelárny, přehrady a továrny, aby republika mohla vyrábět vlastní základní zboží a zbraně." # todo: NEW TRANSLATION
 SAU_the_revolutionary_command_council: "Revoluční velitelská rada" # todo: NEW TRANSLATION
 SAU_the_revolutionary_command_council_desc: "Svěřit nejvyšší pravomoc radě vůdců strany a spojit stranu se státem v jedinou revoluční vůli." # todo: NEW TRANSLATION
 SAU_pan_arab_solidarity: "Všearabská solidarita" # todo: NEW TRANSLATION
 SAU_pan_arab_solidarity_desc: "Stát při každém arabském boji od Palestiny po Maghreb a učinit z Arábie patrona nacionalistické věci." # todo: NEW TRANSLATION
 SAU_build_the_party: "Budovat stranu" # todo: NEW TRANSLATION
 SAU_build_the_party_desc: "Revoluce zorganizuje disciplinovanou stranu s buňkami sahajícími od vesnic až k národnímu vedení." # todo: NEW TRANSLATION
 SAU_arab_republic_secular_republic: "Sekulární republika" # todo: NEW TRANSLATION
 SAU_arab_republic_secular_republic_desc: "Oddělit mešitu od státu a svázat národ arabskou identitou namísto sektářství, aby sunnité a šíité, muslimové a křesťané stáli jako jeden." # todo: NEW TRANSLATION
 SAU_the_arab_socialist_path: "Arabská socialistická cesta" # todo: NEW TRANSLATION
 SAU_the_arab_socialist_path_desc: "Odmítnout kapitalismus i sovětský komunismus ve prospěch zřetelně arabského socialismu: rozhodující odvětví v rukou lidu, drobný obchodník ponechán svobodě." # todo: NEW TRANSLATION
 SAU_nationalize_the_heights: "Znárodnit vrcholy" # todo: NEW TRANSLATION
 SAU_nationalize_the_heights_desc: "Zabavit ropu, banky a velké podniky zahraničním koncesionářům a starým rodinám a obrátit jejich bohatství ve prospěch národa." # todo: NEW TRANSLATION
 SAU_land_to_the_peasants: "Půdu rolníkům" # todo: NEW TRANSLATION
 SAU_land_to_the_peasants_desc: "Rozdělit velkostatky a dát půdu felláhům, kteří ji obdělávají, čímž skončí feudální sevření venkova." # todo: NEW TRANSLATION
 SAU_the_officer_corps: "Důstojnický sbor" # todo: NEW TRANSLATION
 SAU_the_officer_corps_desc: "Strana bude rekrutovat mladé důstojníky a využívat ozbrojené síly k výuce a prosazování doktríny Ba'athu." # todo: NEW TRANSLATION
 SAU_arm_the_vanguard: "Vyzbrojit předvoj" # todo: NEW TRANSLATION
 SAU_arm_the_vanguard_desc: "Vedle pravidelné armády budou zřízeny politicky spolehlivé stranické milice." # todo: NEW TRANSLATION
 SAU_forge_the_national_army: "Ukout národní armádu" # todo: NEW TRANSLATION
 SAU_forge_the_national_army_desc: "Vybudovat moderní mechanizovanou armádu hodnou arabského národa a schopnou nést revoluci za naše hranice." # todo: NEW TRANSLATION
 SAU_saudi_aramco: "Saudi Aramco" # todo: NEW TRANSLATION
 SAU_saudi_aramco_desc: "§YSaúdská arabská ropná společnost§! je největším ropným podnikem na Zemi a páteří Království. Tato větev buduje ropný sektor pole po poli a poté zavazuje Aramco ke §Ystrategické doktríně§! – §Yčerpat více, více rafinovat nebo vyvážet za maximální příjem§! – přičemž vše napájí jediného §Ynárodního ducha Saudi Aramco§!." # todo: NEW TRANSLATION
 SAU_arm_the_anti_iranian_groups: "Vyzbrojit protiíránské skupiny" # todo: NEW TRANSLATION
 SAU_arm_the_anti_iranian_groups_desc: "Království vyzbrojí protivládní skupiny mezi íránskými Balúči a Araby a rozšíří konflikt na íránské území." # todo: NEW TRANSLATION
 SAU_the_saudi_armed_forces: "Saúdské ozbrojené síly" # todo: NEW TRANSLATION
 SAU_the_saudi_armed_forces_desc: "Sjednotit a modernizovat pozemní, námořní a letecké síly Království v jedinou profesionální armádu." # todo: NEW TRANSLATION
 SAU_lessons_of_the_gulf_war: "Poučení z války v Perském zálivu" # todo: NEW TRANSLATION
 SAU_lessons_of_the_gulf_war_desc: "V roce 1990 Saddamův Irák obsadil Kuvajt a shromáždil síly na naší hranici; Království zachránila pouze zahraniční koalice a bitva o Chafdží se odehrála na saúdské půdě. Operace Pouštní bouře odhalila, jak závislí jsme na ostatních – už nikdy více." # todo: NEW TRANSLATION
 SAU_ministry_of_defence_and_aviation: "Ministerstvo obrany a letectví" # todo: NEW TRANSLATION
 SAU_ministry_of_defence_and_aviation_desc: "Reorganizovat Ministerstvo obrany a letectví (MODA) v moderní velení schopné plánovat, rozpočtovat a řídit všechny ozbrojené síly." # todo: NEW TRANSLATION
 SAU_the_general_staff: "Generální štáb" # todo: NEW TRANSLATION
 SAU_the_general_staff_desc: "Vybudovat profesionální Generální štáb, který bude vytvářet válečné plány, vést cvičení a řídit operace." # todo: NEW TRANSLATION
 SAU_the_royal_saudi_land_forces: "Královské saúdskoarabské pozemní síly" # todo: NEW TRANSLATION
 SAU_the_royal_saudi_land_forces_desc: "Vybudovat Královské saúdskoarabské pozemní síly (RSLF) v moderní, mobilní armádu se sídlem v Rijádu." # todo: NEW TRANSLATION
 SAU_saudi_arabian_national_guard: "Saúdskoarabská národní garda" # todo: NEW TRANSLATION
 SAU_saudi_arabian_national_guard_desc: "Rozšířit Saúdskoarabskou národní gardu (SANG), kmenovou sílu loajální trůnu, která střeží královskou rodinu a svatá města." # todo: NEW TRANSLATION
 SAU_king_abdulaziz_royal_guard: "Královská garda krále Abdulazize" # todo: NEW TRANSLATION
 SAU_king_abdulaziz_royal_guard_desc: "Posílit pluk Královské gardy, elitní jednotku přísahající chránit osobu krále." # todo: NEW TRANSLATION
 SAU_m1a2_abrams_main_battle_tank: "Hlavní bojový tank M1A2 Abrams" # todo: NEW TRANSLATION
 SAU_m1a2_abrams_main_battle_tank_desc: "Získat americký M1A2 Abrams, nejtěžší a nejschopnější tank v regionu a páteř saúdských obrněných sil." # todo: NEW TRANSLATION
 SAU_armored_brigades: "Obrněné brigády" # todo: NEW TRANSLATION
 SAU_armored_brigades_desc: "Vytvořit a vybavit těžké obrněné brigády pro rozhodující manévrovou válku v otevřené poušti." # todo: NEW TRANSLATION
 SAU_mechanized_infantry: "Mechanizovaná pěchota" # todo: NEW TRANSLATION
 SAU_mechanized_infantry_desc: "Vytvořit mechanizovanou pěchotu k držení území a podpoře obrněných hrotů." # todo: NEW TRANSLATION
 SAU_m109_self_propelled_artillery: "Samohybné dělostřelectvo M109" # todo: NEW TRANSLATION
 SAU_m109_self_propelled_artillery_desc: "Nasadit samohybnou houfnici M109 a poskytnout divizím mobilní, chráněnou palebnou podporu." # todo: NEW TRANSLATION
 SAU_astros_ii_rocket_artillery: "Raketové dělostřelectvo ASTROS II" # todo: NEW TRANSLATION
 SAU_astros_ii_rocket_artillery_desc: "Získat brazilský raketomet ASTROS II pro hromadné bombardování na velkou vzdálenost." # todo: NEW TRANSLATION
 SAU_royal_saudi_strategic_missile_force: "Královské saúdskoarabské strategické raketové síly" # todo: NEW TRANSLATION
 SAU_royal_saudi_strategic_missile_force_desc: "Zřídit Strategické raketové síly jako samostatný druh vojska a strategický odstrašující prostředek Království." # todo: NEW TRANSLATION
 SAU_df_3_ballistic_missiles: "Balistické střely DF-3" # todo: NEW TRANSLATION
 SAU_df_3_ballistic_missiles_desc: "Tajný nákup čínských střel DF-3 v roce 1988 poskytl Rijádu strategický dosah, který žádné sousední hlavní město nemohlo ignorovat. Vybudovat síly, jež udrží tento odstrašující prostředek důvěryhodným." # todo: NEW TRANSLATION
 SAU_army_aviation_and_apache_gunships: "Armádní letectvo a bitevní vrtulníky Apache" # todo: NEW TRANSLATION
 SAU_army_aviation_and_apache_gunships_desc: "Zřídit Velitelství armádního letectva a získat AH-64 Apache, ničitele tanků pro vlastní leteckou složku armády." # todo: NEW TRANSLATION
 SAU_special_forces_command: "Velitelství speciálních sil" # todo: NEW TRANSLATION
 SAU_special_forces_command_desc: "Vybudovat Velitelství speciálních sil pro nájezdy, boj proti terorismu a průzkum za nepřátelskými liniemi." # todo: NEW TRANSLATION
 SAU_roll_back_iran_in_the_gulf: "Vytlačit Írán z Perského zálivu" # todo: NEW TRANSLATION
 SAU_roll_back_iran_in_the_gulf_desc: "Írán využívá politické a milicionářské sítě k rozšiřování svého vlivu v Bahrajnu, Iráku a jinde podél Perského zálivu. Království podpoří místní vlády a frakce, které mohou tento vliv omezit." # todo: NEW TRANSLATION
 SAU_the_basra_grid_connection: "Připojení Basry k elektrické síti" # todo: NEW TRANSLATION
 SAU_the_basra_grid_connection_desc: "Jih Iráku se během výpadků elektřiny dusí, zatímco dováží íránskou energii. Připojme Basru k síti Perského zálivu a nahraďme íránskou elektřinu saúdským proudem." # todo: NEW TRANSLATION
 SAU_counter_iranian_influence: "Čelit íránskému vlivu" # todo: NEW TRANSLATION
 SAU_counter_iranian_influence_desc: "Íránské milice a peníze zaplavily vakuum po Saddámovi. Zahajme dlouhé tažení za vyproštění Iráku ze sevření Islámské republiky." # todo: NEW TRANSLATION
 SAU_buy_the_iraqi_parliament: "Koupit irácký parlament" # todo: NEW TRANSLATION
 SAU_buy_the_iraqi_parliament_desc: "Království využije finanční podporu k zajištění podpory iráckých parlamentních bloků a ministrů. Cílem je odklonit Bagdád od Teheránu směrem k Rijádu." # todo: NEW TRANSLATION
 SAU_chinese_mediation: "Čínské zprostředkování" # todo: NEW TRANSLATION
 SAU_chinese_mediation_desc: "Čína je významným odběratelem jak Saúdské Arábie, tak Íránu a nabídla se jako prostředník mezi nimi. Přijetí její role by mohlo stabilizovat vztahy, aniž by vyřešilo širší strategické soupeření." # todo: NEW TRANSLATION
 SAU_the_agrarian_revolution: "Zemědělská revoluce" # todo: NEW TRANSLATION
 SAU_the_agrarian_revolution_desc: "Proměna venkova je dokončena, jeho přebytky živí města i revoluci." # todo: NEW TRANSLATION
 SAU_collectivization: "Kolektivizace" # todo: NEW TRANSLATION
 SAU_collectivization_desc: "Soukromé farmy se slučují do rozsáhlých kolektivů, na nichž se pracuje společně a které se řídí plánem." # todo: NEW TRANSLATION
 SAU_dictatorship_of_the_proletariat: "Diktatura proletariátu" # todo: NEW TRANSLATION
 SAU_dictatorship_of_the_proletariat_desc: "Moc je soustředěna v rukou dělnické třídy prostřednictvím jediné revoluční strany, která netoleruje žádný odpor." # todo: NEW TRANSLATION
 SAU_ignite_the_gulf: "Zapálit Perský záliv" # todo: NEW TRANSLATION
 SAU_ignite_the_gulf_desc: "Dělnický stát poskytne agentům a zbraně revolučním hnutím v monarchiích Perského zálivu." # todo: NEW TRANSLATION
 SAU_land_to_the_fellahin: "Půda felláhům" # todo: NEW TRANSLATION
 SAU_land_to_the_fellahin_desc: "Velkostatky jsou rozparcelovány a předány rolníkům, kteří je obdělávají." # todo: NEW TRANSLATION
 SAU_embrace_moscow: "Přiklonit se k Moskvě" # todo: NEW TRANSLATION
 SAU_embrace_moscow_desc: "Arábie se připojí k sovětskému bloku a vymění ropu za zbraně a politickou podporu." # todo: NEW TRANSLATION
 SAU_nationalize_the_oil_fields: "Znárodnit ropná pole" # todo: NEW TRANSLATION
 SAU_nationalize_the_oil_fields_desc: "Bohatství pod pískem patří lidu, nikoli princům. ARAMCO je zabaveno a svěřeno pod kontrolu dělníků." # todo: NEW TRANSLATION
 SAU_the_new_arab_man: "Nový arabský člověk" # todo: NEW TRANSLATION
 SAU_the_new_arab_man_desc: "Pěstuje se nová revoluční kultura, která odstraňuje pověry a hierarchie starého řádu." # todo: NEW TRANSLATION
 SAU_the_non_aligned_road: "Cesta nezúčastněnosti" # todo: NEW TRANSLATION
 SAU_the_non_aligned_road_desc: "Arábie nastupuje nezávislý kurz a vede nezúčastněné národy proti imperialismu i sovětské nadvládě." # todo: NEW TRANSLATION
 SAU_soviets_of_the_oil_workers: "Sověty ropných dělníků" # todo: NEW TRANSLATION
 SAU_soviets_of_the_oil_workers_desc: "Volené dělnické rady budou spravovat ropná pole a vytvoří ústřední instituci proletářského státu." # todo: NEW TRANSLATION
 SAU_toward_pan_arab_union: "Směrem k panarabské unii" # todo: NEW TRANSLATION
 SAU_toward_pan_arab_union_desc: "Revoluce se šíří navenek a usiluje o sjednocení s ostatními pokrokovými arabskými státy." # todo: NEW TRANSLATION
 SAU_the_peoples_republic_of_arabia: "Lidová republika Arábie" # todo: NEW TRANSLATION
 SAU_the_peoples_republic_of_arabia_desc: "Prozatímní řád ustupuje plně ustavenému dělnickému státu: Lidové republice Arábie." # todo: NEW TRANSLATION
 SAU_progressive_islam: "Pokrokový islám" # todo: NEW TRANSLATION
 SAU_progressive_islam_desc: "Namísto potlačení víry strana získá pokrokové duchovní, aby hlásali socialismus slučitelný s islámem." # todo: NEW TRANSLATION
 SAU_a_proletarian_nation: "Proletářský národ" # todo: NEW TRANSLATION
 SAU_a_proletarian_nation_desc: "Arábie bude definovat národní identitu prostřednictvím dělníků a práce, nikoli kmenové příslušnosti či věrnosti monarchii." # todo: NEW TRANSLATION
 SAU_form_the_red_guard: "Vytvořit Rudou gardu" # todo: NEW TRANSLATION
 SAU_regularize_the_red_guard: "Uspořádat Rudou gardu" # todo: NEW TRANSLATION
 SAU_regularize_the_red_guard_desc: "Přetvořit revoluční milice v profesionální Rudou armádu se standardizovaným vybavením, vycvičenými důstojníky a válečným průmyslem, který je vyzbrojí." # todo: NEW TRANSLATION
 SAU_the_peoples_militia: "Lidové milice" # todo: NEW TRANSLATION
 SAU_the_peoples_militia_desc: "Ponechat revoluci v rukou lidu a vyzbrojit každého dělníka a rolníka jako milicionáře připraveného bránit republiku." # todo: NEW TRANSLATION
 SAU_form_the_red_guard_desc: "Revoluční milice složená z ropných dělníků a městské chudiny, která přísahala bránit revoluci." # todo: NEW TRANSLATION
 SAU_rural_literacy_brigades: "Venkovské brigády gramotnosti" # todo: NEW TRANSLATION
 SAU_rural_literacy_brigades_desc: "Kádry se rozptýlí po venkově, aby učily číst, psát a revoluční nauku." # todo: NEW TRANSLATION
 SAU_state_atheism: "Státní ateismus" # todo: NEW TRANSLATION
 SAU_state_atheism_desc: "Náboženství je prohlášeno za opium lidu. Duchovní jsou zbaveni moci a mešity umlknou." # todo: NEW TRANSLATION
 SAU_state_industrialization: "Státní industrializace" # todo: NEW TRANSLATION
 SAU_state_industrialization_desc: "Vláda využije urychlené státní programy k výstavbě oceláren, přehrad a továren po celé Arábii." # todo: NEW TRANSLATION
 SAU_vanguard_of_the_region: "Předvoj regionu" # todo: NEW TRANSLATION
 SAU_vanguard_of_the_region_desc: "Arábie se staví do čela revoluce v arabském světě a Perském zálivu." # todo: NEW TRANSLATION
 SAU_womens_emancipation: "Emancipace žen" # todo: NEW TRANSLATION
 SAU_womens_emancipation_desc: "Ženy vstoupí do pracovních sil i strany jako právně a politicky rovnocenné občanky, čímž skončí omezení jejich účasti ve starém řádu." # todo: NEW TRANSLATION
 SAU_a_strategic_partnership_with_china: "Strategické partnerství s Čínou" # todo: NEW TRANSLATION
 SAU_a_strategic_partnership_with_china_desc: "Zvolit Peking namísto Washingtonu za hlavního velmocenského partnera Království. Čínský kapitál a čínské zbraně přicházejí bez kázání, ale také bez starých amerických záruk." # todo: NEW TRANSLATION
 SAU_conscript_the_kingdom: "Mobilizovat Království" # todo: NEW TRANSLATION
 SAU_conscript_the_kingdom_desc: "Království se tradičně spoléhalo na dobrovolníky z důvěryhodných kmenů namísto odvodu. Rada přijme politická rizika masové armády, aby zvýšila dostupnou živou sílu." # todo: NEW TRANSLATION
 SAU_oil_for_security: "Ropa za bezpečnost" # todo: NEW TRANSLATION
 SAU_oil_for_security_desc: "Tato dohoda je stará jako setkání na palubě USS Quincy: saúdská ropa udržuje americkou ekonomiku v chodu a americké zbraně udržují Království v bezpečí. Prohlubme petrodolarové partnerství, které zajišťuje fungování říše." # todo: NEW TRANSLATION
 SAU_cooperation_with_the_east: "Spolupráce s Východem" # todo: NEW TRANSLATION
 SAU_cooperation_with_the_east_desc: "Těžiště světové ekonomiky se posouvá k Asii a Asie prahne po ropě. Otevřeme Království rostoucím mocnostem Východu a pojistíme se proti nespolehlivému Západu." # todo: NEW TRANSLATION
 SAU_cooperation_with_the_west: "Spolupráce se Západem" # todo: NEW TRANSLATION
 SAU_cooperation_with_the_west_desc: "Washington a jeho spojenci zajišťují bezpečnost Perského zálivu již od dob krále Abdulazize. Pevně zakotvěme Království v západním táboře a vyměňme světovou ropu za světovou ochranu." # todo: NEW TRANSLATION
 SAU_engage_the_new_baghdad: "Navázat vztahy s novým Bagdádem" # todo: NEW TRANSLATION
 SAU_engage_the_new_baghdad_desc: "V Bagdádu vládne nová vláda vedená šíity, o kterou se uchází Teherán. Spolkněme staré nepřátelství a přitáhněme nový Irák do arabského společenství." # todo: NEW TRANSLATION
 SAU_counter_the_baathist_remnant: "Čelit pozůstatkům Baas" # todo: NEW TRANSLATION
 SAU_counter_the_baathist_remnant_desc: "Ať už Saddám padl, nebo pouze zaváhal, Baas zůstává ve stínech Iráku silou. Odepřeme zatvrzelým stoupencům starého režimu jakoukoli cestu zpět k moci." # todo: NEW TRANSLATION
 SAU_crackdown_on_the_opposition: "Zásah proti opozici" # todo: NEW TRANSLATION
 SAU_crackdown_on_the_opposition_desc: "Mabahith vede rozsáhlé spisy o šíitských organizátorech, duchovních Sahwy a liberálních petentech. Rada tyto záznamy využije k identifikaci a potlačení opozice proti vojenské vládě." # todo: NEW TRANSLATION
 SAU_declare_the_republic_of_arabia: "Vyhlásit Republiku Arábie" # todo: NEW TRANSLATION
 SAU_declare_the_republic_of_arabia_desc: "Monarchie padla a prozatímní rada drží moc jménem lidu. Nyní je staré království definitivně rozpuštěno a je vyhlášen nový stát: Republika Arábie, založená na vůli svých občanů, nikoli na pokrevní linii dynastie." # todo: NEW TRANSLATION
 SAU_the_defense_industries_act: "Zákon o obranném průmyslu" # todo: NEW TRANSLATION
 SAU_the_defense_industries_act_desc: "Saúdská Arábie je dlouhodobě závislá na dovozu zbraní a zahraničních náhradních dílů. Zákon o obranném průmyslu vyžádá domácí výrobu tam, kde je to možné, a licenční výrobu tam, kde je to nutné, navzdory vyšším nákladům a nižší krátkodobé efektivitě." # todo: NEW TRANSLATION
 SAU_disband_the_national_guard: "Rozpustit Národní gardu" # todo: NEW TRANSLATION
 SAU_disband_the_national_guard_desc: "Národní garda byla vytvořena z loajálních kmenů, aby chránila trůn před pravidelnou armádou. Rada rozpustí její pluky a nabídne jejich příslušníkům místa v pravidelných ozbrojených silách, čímž odstraní nezávislou vojenskou základnu monarchie." # todo: NEW TRANSLATION
 SAU_the_economy_under_military_order: "Ekonomika pod vojenskou správou" # todo: NEW TRANSLATION
 SAU_the_economy_under_military_order_desc: "Důstojníci převezmou kontrolu nad společnostmi Aramco a SABIC, přístavy a hlavními dodavateli. Ropné operace mohou pokračovat pod vedením dosavadních inženýrů, ale vojenská správa pravděpodobně sníží efektivitu ve zbytku ekonomiky." # todo: NEW TRANSLATION
 SAU_emergency_tribunal: "Mimořádný tribunál" # todo: NEW TRANSLATION
 SAU_emergency_tribunal_desc: "Soudy svolané pod vojenskou pravomocí, rozhodující bez možnosti odvolání, budou soudit trestné činy, nad nimiž běžné soudy nikdy neměly pravomoc. Ulamá jsou konzultováni ohledně podoby řízení, nikoli verdiktů." # todo: NEW TRANSLATION
 SAU_energy_subsidies_for_jordan: "Energetické dotace pro Jordánsko" # todo: NEW TRANSLATION
 SAU_energy_subsidies_for_jordan_desc: "Jordánsko nemá vlastní ropu a pociťuje každý výkyv trhu. Připoutejme království k saúdské velkorysosti prostřednictvím levného paliva a zlevněné ropy." # todo: NEW TRANSLATION
 SAU_aid_sudan: "Pomoc Súdánu" # todo: NEW TRANSLATION
 SAU_aid_sudan_desc: "Chartúm potřebuje financování, které mu Teherán neposkytl. Saúdská pomoc může koupit rozchod s Íránem, ale také připoutá Rijád k vládě, která je již izolována západními sankcemi." # todo: NEW TRANSLATION
 SAU_side_with_algeria: "Postavit se na stranu Alžírska" # todo: NEW TRANSLATION
 SAU_side_with_algeria_desc: "Rijád nemůže stejně vřele usilovat o přízeň Alžíru a Rabatu, zatímco jejich rivalita rozděluje Maghreb. Alžírsko nabízí těžce získané zkušenosti s islamistickými povstáními, ale jeho volba znamená ochlazení vztahů s monarchistickým spojencem v Maroku." # todo: NEW TRANSLATION
 SAU_back_the_brotherhood: "Podpořit Bratrstvo" # todo: NEW TRANSLATION
 SAU_back_the_brotherhood_desc: "Egypt je rodištěm Bratrstva i centrem arabského světa. Podpora hnutí by Rijádu poskytla populární islamistickou síť v zahraničí, ale hrozila by třenice s vládami, které se Bratrstva obávají u volebních uren." # todo: NEW TRANSLATION
 SAU_back_the_strongman: "Podpořit silného vůdce" # todo: NEW TRANSLATION
 SAU_back_the_strongman_desc: "Egyptští generálové slibují pořádek, nepřátelství vůči Bratrstvu a stát dostatečně silný, aby udržel centrum arabského světa. Saúdské peníze mohou tento pořádek udržet a Káhiru sladit s Rijádem." # todo: NEW TRANSLATION
 SAU_befriend_the_turks: "Spřátelit se s Turky" # todo: NEW TRANSLATION
 SAU_befriend_the_turks_desc: "[befriend_the_turks_description]" # todo: NEW TRANSLATION
 SAU_contain_the_turks: "Zadržet Turky" # todo: NEW TRANSLATION
 SAU_contain_the_turks_desc: "Nemůžeme Turecku dovolit prosazovat jeho zájmy na Blízkém východě. [TUR.GetLeader]'s podpora politického islámu hrozí posílením nebezpečného populistického hnutí, které se může pokusit svrhnout naši vládu." # todo: NEW TRANSLATION
 SAU_influence_muslim_europe: "Ovlivnit muslimskou Evropu" # todo: NEW TRANSLATION
 SAU_influence_muslim_europe_desc: "Balkán je domovem muslimských komunit, které mají jen málo důvodů hledět k Rijádu. Stipendia, mešity a charitativní sítě mohou proměnit sdílenou víru v trvalý saúdský vliv v Evropě." # todo: NEW TRANSLATION
 SAU_influence_north_africa: "Ovlivnit severní Afriku" # todo: NEW TRANSLATION
 SAU_influence_north_africa_desc: "Maghreb hledí na sever k Evropě a na jih k Africe častěji než na východ k Rijádu. Saúdské peníze a diplomacie to mohou změnit, ale každý krok vstupuje do rivality mezi Alžírskem a Marokem." # todo: NEW TRANSLATION
 SAU_side_with_morocco: "Postavit se na stranu Maroka" # todo: NEW TRANSLATION
 SAU_side_with_morocco_desc: "Maroko sdílí zájem Království na zachování monarchistické vlády a omezení alžírského vlivu. Postavení se na stranu Rabatu posílí přirozeného partnera, ale uzavře dveře v Alžíru." # todo: NEW TRANSLATION
 SAU_sanction_sudan: "Uvalit sankce na Súdán" # todo: NEW TRANSLATION
 SAU_sanction_sudan_desc: "[SUD.GetLeader]'s vláda byla sužována mezinárodními kontroverzemi. Za jeho vlády byl Súdán obviněn, že je státním sponzorem terorismu i významným porušovatelem lidských práv. Západní země následně na tento darebácký stát uvalily sankce, což bychom měli následovat." # todo: NEW TRANSLATION
 SAU_sanction_turkey: "Uvalit sankce na Turecko" # todo: NEW TRANSLATION
 SAU_sanction_turkey_desc: "Navzdory našim varováním Turecko pokračuje v zasahování do arabského světa. Nemáme jinou možnost než použít donucovací prostředky, abychom Turecko odradili od naplňování jeho imperialistických ambicí." # todo: NEW TRANSLATION
 SAU_security_guarantees: "Bezpečnostní záruky" # todo: NEW TRANSLATION
 SAU_security_guarantees_desc: "Úzké vztahy s Ankarou mají malou cenu, pokud zmizí v krizi. Vzájemná záruka by spojila tureckou a saúdskou bezpečnost a varovala každého nepřítele, že útok na jednoho znamená čelit oběma." # todo: NEW TRANSLATION
 SAU_turkish_bases: "Turecké základny" # todo: NEW TRANSLATION
 SAU_turkish_bases_desc: "Poskytnutí vojenského přístupu Turecku by Ankaře dalo přímý důvod chránit Království. Zároveň by však poskytlo konkurenční regionální mocnosti opěrný bod na saúdské půdě." # todo: NEW TRANSLATION
 SAU_libyan_arms_shipments: "Dodávky zbraní do Libye" # todo: NEW TRANSLATION
 SAU_libyan_arms_shipments_desc: "Rozštěpený libyjský stát se stal tržištěm zahraničních zbraní a peněz. S ústupem západních mocností mohou saúdské dodávky koupit přátelskou frakci i místo v boji o její ropu a přístavy." # todo: NEW TRANSLATION
 SAU_the_faisalite_resurgence: "Faisalitské obrození" # todo: NEW TRANSLATION
 SAU_the_faisalite_resurgence_desc: "Faisalitský program se po generaci zanedbávání vrací. Volá po úspornosti, soběstačnosti a Království, které zastupuje ummu, místo aby záviselo na Washingtonu." # todo: NEW TRANSLATION
 SAU_centralization_of_the_provincial_emirates: "Centralizace provinčních emirátů" # todo: NEW TRANSLATION
 SAU_centralization_of_the_provincial_emirates_desc: "Provinční emíři spravovali své oblasti jako soukromá panství od jejich založení. Rijád odvolá jejich listiny a vydá nové — kratší, odvolatelné a podepsané králem." # todo: NEW TRANSLATION
 SAU_the_sovereign_civil_service: "Suverénní státní služba" # todo: NEW TRANSLATION
 SAU_the_sovereign_civil_service_desc: "Státní služba bude využívat zkoušky pro jmenování a služební záznamy pro povyšování. Tím se omezí vliv rodinných vazeb na zaměstnávání ve vládě." # todo: NEW TRANSLATION
 SAU_reorganization_of_the_majlis_ash_shura: "Reorganizace Madžlisu aš-Šúrá" # todo: NEW TRANSLATION
 SAU_reorganization_of_the_majlis_ash_shura_desc: "Miteb rozšíří a reorganizuje Madžlis aš-Šúrá a poskytne mu přístup k podstatným vládním záležitostem. Zůstane podřízen králi, ale získá jasnější poradní a správní úlohu." # todo: NEW TRANSLATION
 SAU_the_national_cadre_initiative: "Iniciativa národních kádrů" # todo: NEW TRANSLATION
 SAU_the_national_cadre_initiative_desc: "Království vycvičí saúdské občany, aby nahradili zahraniční pracovníky ve strategicky důležitých povoláních. Krátkodobá efektivita může klesnout, zatímco národní pracovní síla získá zkušenosti." # todo: NEW TRANSLATION
 SAU_the_fortress_kingdom: "Království pevnosti" # todo: NEW TRANSLATION
 SAU_the_fortress_kingdom_desc: "Faisalitská vláda upevnila své instituce, odstranila své protivníky a omezila zahraniční vliv. Království se nyní musí rozhodnout, zda tato autonomie podpoří izolaci, nebo aktivnější nezávislou politiku." # todo: NEW TRANSLATION
 SAU_the_spirit_of_73: "Duch roku 1973" # todo: NEW TRANSLATION
 SAU_the_spirit_of_73_desc: "Ropné embargo z roku 1973 ukázalo, že saúdská produkční politika může ovlivňovat západní vlády. Království zváží využití této páky k získání dalších politických ústupků." # todo: NEW TRANSLATION
 SAU_the_international_forums_question: "Otázka mezinárodních fór" # todo: NEW TRANSLATION
 SAU_the_international_forums_question_desc: "Království se musí rozhodnout, zda bude prosazovat své zájmy prostřednictvím institucí, jako jsou Organizace spojených národů a MMF, nebo se stáhne ze systému, při jehož tvorbě pravidel mělo jen malou roli." # todo: NEW TRANSLATION
 SAU_the_superpower_engagement_question: "Otázka vztahů se supervelmocemi" # todo: NEW TRANSLATION
 SAU_the_superpower_engagement_question_desc: "Oba bloky supervelmocí usilují o saúdské spojenectví. Rijád může zůstat nezávislý a nakupovat od obou stran, nebo snížit svou závislost rozvojem domácí výroby zbraní." # todo: NEW TRANSLATION
 SAU_eradicate_foreign_dependency: "Odstranit zahraniční závislost" # todo: NEW TRANSLATION
 SAU_eradicate_foreign_dependency_desc: "Království bude závislost na nezbytném dovozu považovat za strategickou zranitelnost. Domácí náhrada proto dostane přednost, i když by dovážené zboží bylo levnější." # todo: NEW TRANSLATION
 SAU_the_foreign_wealth_question: "Otázka zahraničního bohatství" # todo: NEW TRANSLATION
 SAU_the_foreign_wealth_question_desc: "Saúdská Arábie drží stovky miliard dolarů v západních bankách a státních cenných papírech. Navrácení tohoto bohatství by omezilo zahraniční páku, jeho ponechání v zahraničí je však bezpečnější a výnosnější." # todo: NEW TRANSLATION
 SAU_increase_the_ulemas_authority: "Posílit autoritu ulemy" # todo: NEW TRANSLATION
 SAU_increase_the_ulemas_authority_desc: "Učenci jsou navráceni do rad, z nichž byli potichu vytlačeni. Faisal vládl s ulemou po svém boku a jeho dědicové nebudou předstírat opak." # todo: NEW TRANSLATION
 SAU_the_domestic_supply_quota: "Kvóta domácích dodávek" # todo: NEW TRANSLATION
 SAU_the_domestic_supply_quota_desc: "Každé ministerstvo, dodavatel a rafinerie budou muset nakupovat minimální podíl zboží vyrobeného v Saúdské Arábii. Domácí výrobky mohou zpočátku stát více a mít horší parametry, ale kvóty vybudují národní kapacity." # todo: NEW TRANSLATION
 SAU_the_sovereign_aid_question: "Otázka státní pomoci" # todo: NEW TRANSLATION
 SAU_the_sovereign_aid_question_desc: "Saúdská pomoc může být rozdělena jako bezpodmínečná podpora muslimským komunitám nebo využita k získání politických ústupků. Království se musí rozhodnout, zda bude jeho pomoc řízena náboženskou solidaritou, nebo strategickým vlivem." # todo: NEW TRANSLATION
 SAU_islamic_solidarity_conference: "Konference islámské solidarity" # todo: NEW TRANSLATION
 SAU_islamic_solidarity_conference_desc: "Rijád svolá konferenci islámské solidarity a bude financovat její průběh. Setkání oživí Faisalův přístup využívající saúdské instituce ke koordinaci muslimského světa." # todo: NEW TRANSLATION
 SAU_the_expatriate_workforce_question: "Otázka zahraniční pracovní síly" # todo: NEW TRANSLATION
 SAU_the_expatriate_workforce_question_desc: "Devět milionů zahraničních pracovníků podporuje saúdskou ekonomiku, ale je v rozporu s faisalitským cílem národní soběstačnosti. Omezení jejich role bude ekonomicky nákladné, zatímco jejich ponechání omezí saúdizaci." # todo: NEW TRANSLATION
 SAU_reclaim_the_oic_leadership: "Obnovit vedení OIC" # todo: NEW TRANSLATION
 SAU_reclaim_the_oic_leadership_desc: "Organizace islámské spolupráce sídlí v Džiddě. Rijád využije své financování a postavení hostitelské země k aktivnějšímu řízení agendy organizace." # todo: NEW TRANSLATION
 SAU_the_global_ummah_question: "Otázka globální ummy" # todo: NEW TRANSLATION
 SAU_the_global_ummah_question_desc: "Kontrola Království nad dvěma svatými mešitami mu dává jedinečný nárok na vedení muslimů celého světa. Musí se rozhodnout, zda tento status promění v aktivní odpovědnost vůči globální ummě." # todo: NEW TRANSLATION
 SAU_splendid_isolation: "Skvělá izolace" # todo: NEW TRANSLATION
 SAU_splendid_isolation_desc: "Království se stáhne z bloků, vztahů s klienty a zahraničních tažení. Soustředí se na obranu svých hranic, ochranu víry a správu svých ropných zdrojů." # todo: NEW TRANSLATION
 SAU_the_virtue_committees_return: "Návrat výborů pro ctnost" # todo: NEW TRANSLATION
 SAU_the_virtue_committees_return_desc: "Výbor pro podporu ctnosti a prevenci neřesti znovu získá ulice, o které přišel. Jeho hlídky jsou opět viditelné a stejně tak poselství, které nesou." # todo: NEW TRANSLATION
 SAU_the_third_way_doctrine: "Doktrína třetí cesty" # todo: NEW TRANSLATION
 SAU_the_third_way_doctrine_desc: "Království odmítne přiklonění k Washingtonu i Moskvě a zorganizuje nezávislý blok muslimských států vedený z Rijádu. Tento blok se bude opírat o vlastní výrobu zbraní a zodpovídat se pouze ummě." # todo: NEW TRANSLATION
 SAU_ban_foreign_media: "Zakázat zahraniční média" # todo: NEW TRANSLATION
 SAU_ban_foreign_media_desc: "Satelitní antény mizí, kanceláře se zavírají a zprávy Království se píší v Království. To, co svět říká o Saúdské Arábii, už není domácí záležitostí." # todo: NEW TRANSLATION
 SAU_the_closed_frontier: "Uzavřená hranice" # todo: NEW TRANSLATION
 SAU_the_closed_frontier_desc: "Víza se zpřísňují, smlouvy končí a čtvrti zahraničních pracovníků se začínají vyprazdňovat. Království se rozhoduje, že bude raději chudší, ale vlastní." # todo: NEW TRANSLATION
 SAU_purge_the_westernized_elite: "Očistit pozápadněnou elitu" # todo: NEW TRANSLATION
 SAU_purge_the_westernized_elite_desc: "Ministerstva se začínají plnit muži vzdělanými v Rijádu, nikoli v Bostonu. Ti, kteří se vrátili s cizími tituly a cizími zvyky, zjišťují, že jejich složky jsou prověřovány a jejich úřady přeobsazovány." # todo: NEW TRANSLATION
 SAU_the_foreign_bases_question: "Otázka zahraničních základen" # todo: NEW TRANSLATION
 SAU_the_foreign_bases_question_desc: "Zahraniční vojenský přístup poskytuje Království ochranu zvenčí, ale rozhněvává duchovní, kteří považují cizí vojska v Arábii za urážku. Rijád musí rozhodnout, zda tato ochrana stojí za cenu pro jeho suverenitu a náboženskou legitimitu." # todo: NEW TRANSLATION
 SAU_sever_the_western_pact: "Přerušit západní pakt" # todo: NEW TRANSLATION
 SAU_sever_the_western_pact_desc: "Království uzavře zahraniční základny a vyžádá si odchod jejich posádek. Tím obnoví saúdskou kontrolu nad svým územím, ale ukončí důležitou vnější bezpečnostní záruku." # todo: NEW TRANSLATION
 SAU_the_base_retention_edict: "Nařízení o zachování základen" # todo: NEW TRANSLATION
 SAU_the_base_retention_edict_desc: "Zahraniční základny a jejich zásobovací uspořádání zůstanou zachovány. Vláda toto rozhodnutí obhájí před ulemou jako bezpečnostní nutnost navzdory jejím náboženským námitkám." # todo: NEW TRANSLATION
 SAU_fight_iran_indirectly: "Bojovat s Íránem nepřímo" # todo: NEW TRANSLATION
 SAU_fight_iran_indirectly_desc: "Otevřená válka s Islámskou republikou by zničila obě strany. Místo toho vykrvácet Teherán prostřednictvím jeho zástupců a neklidných provincií, aniž by se kdy překročila hranice otevřené války." # todo: NEW TRANSLATION
 SAU_modon_industrial_cities: "Průmyslová města MODON" # todo: NEW TRANSLATION
 SAU_modon_industrial_cities_desc: "Janbú, Ras al-Chajr a Džubajl mají prostor pro víc než ropné terminály. MODON je zaplní cementárnami, hliníkárnami a továrnami na hnojiva a nahradí dovoz domácí výrobou." # todo: NEW TRANSLATION
 SAU_the_return_of_national_capital: "Návrat národního kapitálu" # todo: NEW TRANSLATION
 SAU_the_return_of_national_capital_desc: "Saúdské jmění leží v zahraničních nemovitostech, bankách a cenných papírech, zatímco domácí projekty čekají na peníze. Ministerstvo obchodu tomuto kapitálu poskytne důvod vrátit se a působit uvnitř Království." # todo: NEW TRANSLATION
 SAU_jeddah_islamic_port_expansion: "Rozšíření islámského přístavu Džidda" # todo: NEW TRANSLATION
 SAU_jeddah_islamic_port_expansion_desc: "Džidda je branou Království k Rudému moři. Nové terminály typu roll-on/roll-off a železniční spojení přepraví více nákladu do vnitrozemí a udrží přístav před rostoucím obchodem." # todo: NEW TRANSLATION
 SAU_the_supreme_economic_council: "Nejvyšší hospodářská rada" # todo: NEW TRANSLATION
 SAU_the_supreme_economic_council_desc: "Čtyři ministerstva si nárokují část hospodářské politiky a žádné se nezodpovídá ostatním. Nejvyšší hospodářská rada jim poskytne jeden stůl, jednu agendu a jednu autoritu pro řešení sporů." # todo: NEW TRANSLATION
 SAU_sabics_global_expansion: "Globální expanze SABIC" # todo: NEW TRANSLATION
 SAU_sabics_global_expansion_desc: "SABIC přerostl domácí trh. Akvizice, jako například GE Plastics, poskytnou společnosti nové materiály, patenty a zákazníky daleko za hranicemi Perského zálivu." # todo: NEW TRANSLATION
 SAU_the_jubail_ii_expansion: "Rozšíření Džubajlu II" # todo: NEW TRANSLATION
 SAU_the_jubail_ii_expansion_desc: "Džubajl II vyroste kolem více než jen petrochemie. Rozšíření ocelářského komplexu Hadeed poskytne saúdskému stavebnictví domácí zdroj armovací a ploché oceli." # todo: NEW TRANSLATION
 SAU_the_saudi_export_program: "Saúdský vývozní program" # todo: NEW TRANSLATION
 SAU_the_saudi_export_program_desc: "Saúdské továrny nemohou růst pouze na domácím trhu. Vývozní program dopraví plasty, rafinovaná paliva a cement na asijské, africké a latinskoamerické trhy, které Království dosud znaly především jako vývozce surové ropy." # todo: NEW TRANSLATION
 SAU_sabic_agri_nutrients: "Zemědělské živiny SABIC" # todo: NEW TRANSLATION
 SAU_king_abdullah_financial_district: "Finanční čtvrť krále Abdalláha" # todo: NEW TRANSLATION
 SAU_king_abdullah_financial_district_desc: "Finanční čtvrť krále Abdalláha poskytne bankám, investičním fondům a nadnárodním partnerům jednu adresu v Rijádu. Obchody uzavřené v jejích věžích mohou přivést zahraniční kapitál a know-how do saúdského průmyslu." # todo: NEW TRANSLATION
 SAU_sabic_agri_nutrients_desc: "SABIC již mění saúdský plyn na chemikálie. Rozšíření výroby amoniaku a močoviny učiní z Království významného dodavatele hnojiv a zásobí farmy daleko za hranicemi Arábie." # todo: NEW TRANSLATION
 SAU_economic_diversification: "Hospodářská diverzifikace" # todo: NEW TRANSLATION
 SAU_economic_diversification_desc: "Ropa zůstane největším podnikáním Království, ale nemusí být jediným. Kapitál se přesune do výroby, služeb a logistiky, aby pokles cen surové ropy již nezasáhl každou saúdskou výplatní listinu." # todo: NEW TRANSLATION
 SAU_non_oil_exports: "Neropný vývoz" # todo: NEW TRANSLATION
 SAU_non_oil_exports_desc: "Cisternový tanker by neměl být jediným saúdským vývozním artiklem, který někdo pozná. Plasty, chemikálie, cement a stroje si mohou vydobýt vlastní místo v obchodní bilanci a učinit zahraniční příjmy méně závislými na ropě." # todo: NEW TRANSLATION
 SAU_economic_liberalization: "Hospodářská liberalizace" # todo: NEW TRANSLATION
 SAU_economic_liberalization_desc: "Soukromá firma by neměla potřebovat prince, dotaci a rok podpisů, aby mohla otevřít své dveře. Omezme licenční bludiště a nechme podniky soutěžit o zákazníky namísto přízně." # todo: NEW TRANSLATION
 SAU_sabic_technology_and_innovation: "Technologie a inovace SABIC" # todo: NEW TRANSLATION
 SAU_sabic_technology_and_innovation_desc: "Samotná levná surovina neudrží SABIC konkurenceschopný navždy. Výzkum katalyzátorů, polymerů a výrobních metod může postavit saúdské patenty vedle saúdských továren." # todo: NEW TRANSLATION
 SAU_the_2000s_oil_boom: "Ropný boom v letech 2000–2009" # todo: NEW TRANSLATION
 SAU_the_2000s_oil_boom_desc: "Cena ropy roste, plní státní pokladnu a spolu s ní zvyšuje Tadawul. Boom může financovat nový průmysl, pokud Království investuje dříve, než se cyklus znovu obrátí." # todo: NEW TRANSLATION
 SAU_the_national_industrial_strategy: "Národní průmyslová strategie" # todo: NEW TRANSLATION
 SAU_the_national_industrial_strategy_desc: "Desetiletá průmyslová strategie spojí ministerstva a firmy prostřednictvím společných cílů pro ocel, stroje, saúdskou zaměstnanost a růst vývozu. Pokrok bude konečně možné měřit podle něčeho víc než jen velikosti rozpočtu." # todo: NEW TRANSLATION
 SAU_the_mining_sector: "Těžební sektor" # todo: NEW TRANSLATION
 SAU_the_mining_sector_desc: "Ma'aden, založený v roce 1997, činí z těžby §Ytřetí pilíř§! ekonomiky vedle ropy a petrochemie – fosfáty v Al-Džalamídu, zlato v Mahd adh-Dhahabu a bauxit a hliník směřující do Ras al-Chajru." # todo: NEW TRANSLATION
 SAU_the_tourism_sector: "Turistický sektor" # todo: NEW TRANSLATION
 SAU_the_tourism_sector_desc: "§YNejvyšší komise pro cestovní ruch§!, vytvořená v roce 2000, proměňuje dědictví království, pobřeží Rudého moře a – především – §Ypouť do Mekky a Medíny§! v trvalé celoroční odvětví." # todo: NEW TRANSLATION
 SAU_the_construction_boom: "Stavební boom" # todo: NEW TRANSLATION
 SAU_the_construction_boom_desc: "Investice z ropného boomu budou financovat rozsáhlou výstavbu v Rijádu, Džiddě a Dammámu, včetně věží, nákupních center, silnic a další městské infrastruktury." # todo: NEW TRANSLATION
 SAU_the_digital_economy: "Digitální ekonomika" # todo: NEW TRANSLATION
 SAU_the_digital_economy_desc: "§YKomise pro komunikace a informační technologie§! (2001) ukončí monopol v telekomunikacích a propojí království – mobilní sítě, širokopásmové připojení a první služby elektronické vlády dorazí do každé provincie." # todo: NEW TRANSLATION
 SAU_the_eighth_development_plan: "Osmý rozvojový plán" # todo: NEW TRANSLATION
 SAU_the_eighth_development_plan_desc: "Pět let výdajů vyžaduje víc než seznam ministerstev. Osmý rozvojový plán zkoordinuje hospodářské a sociální projekty vlády do roku 2009." # todo: NEW TRANSLATION
 SAU_the_industrial_path: "Průmyslová cesta" # todo: NEW TRANSLATION
 SAU_the_industrial_path_desc: "Ocel, hutnictví a zpracování staví továrny před kanceláře. Průmyslová cesta vytváří domácí průmyslové kapacity, ale vyžaduje více kapitálu, pracovní síly a dovážených strojů." # todo: NEW TRANSLATION
 SAU_the_services_path: "Cesta služeb" # todo: NEW TRANSLATION
 SAU_the_services_path_desc: "Bankovnictví, logistika, finance a cestovní ruch mohou zaměstnat saúdské absolventy, aniž by se čekalo na nové ocelárny. Ekonomika vedená službami vyžaduje menší investice do těžkého průmyslu a ponechává větší část fyzických potřeb Království na dovozu." # todo: NEW TRANSLATION
 SAU_the_balanced_path: "Vyvážená cesta" # todo: NEW TRANSLATION
 SAU_the_balanced_path_desc: "Průmysl a služby budou postupovat společně a investice se rozdělí mezi oba sektory. Tento kompromis zabrání závislosti na jediném odvětví. Ani jedna strana však nezíská veškerý kapitál, který požaduje." # todo: NEW TRANSLATION
 SAU_the_ninth_development_plan: "Devátý rozvojový plán" # todo: NEW TRANSLATION
 SAU_the_ninth_development_plan_desc: "Saúdská ekonomika roku 2015 se vůbec nepodobá ekonomice z roku 1995. Samotný zpracovatelský průmysl již překonává hodnotu, kterou měl vývoz ropy před deseti lety." # todo: NEW TRANSLATION
 SAU_the_saudi_landbridge: "Saúdský pozemní most" # todo: NEW TRANSLATION
 SAU_the_saudi_landbridge_desc: "Saúdský pozemní most spojí železnicí islámský přístav Džidda u Rudého moře s Rijádem a Dammámem u Perského zálivu. Náklad bude moci překročit poloostrov bez plavby kolem Arábie." # todo: NEW TRANSLATION
 SAU_stc_privatization: "Privatizace STC" # todo: NEW TRANSLATION
 SAU_stc_privatization_desc: "STC se již nemůže rozšiřovat tempem ministerstva. Privatizace vloží nový kapitál do optických a mobilních sítí, ale oslabí veřejnou kontrolu nad národním operátorem." # todo: NEW TRANSLATION
 SAU_the_saudi_electricity_company: "Saúdská elektrárenská společnost" # todo: NEW TRANSLATION
 SAU_the_saudi_electricity_company_desc: "Továrny a města rostou rychleji než elektrická síť. Saúdská elektrárenská společnost propojí nové plynové turbíny s přenosem elektřiny od pobřeží k pobřeží a zabrání tomu, aby výpadky určovaly hranice rozvoje." # todo: NEW TRANSLATION
 SAU_urban_development: "Rozvoj měst" # todo: NEW TRANSLATION
 SAU_urban_development_desc: "Rijád, Džidda a Dammám rostou rychleji než jejich silnice, sítě a bydlení. Městské plánování musí dohnat tento růst, než se přetížení stane další překážkou Království." # todo: NEW TRANSLATION
 SAU_the_real_estate_development_fund: "Fond rozvoje nemovitostí" # todo: NEW TRANSLATION
 SAU_the_real_estate_development_fund_desc: "Bydlení ve velkých městech se stává pro běžné saúdské rodiny nedostupným. Fond rozvoje nemovitostí bude financovat nové čtvrti a zkrátí pořadník žadatelů o bydlení." # todo: NEW TRANSLATION
 SAU_the_north_south_railway: "Železnice Sever–Jih" # todo: NEW TRANSLATION
 SAU_the_north_south_railway_desc: "Železnice Sever–Jih bude přepravovat fosfáty a bauxit ze severních dolů k Perskému zálivu a zároveň propojí vnitrozemská města dlouho závislá na silnicích. Železnice sníží náklady na přepravu nákladu napříč Královstvím." # todo: NEW TRANSLATION
 SAU_king_abdullah_economic_city: "Ekonomické město krále Abdalláha" # todo: NEW TRANSLATION
 SAU_king_abdullah_economic_city_desc: "Plánovaná města v Rabighu, Medíně a Džizánu mají uniknout úředním postupům, které zpomalují zbytek ekonomiky. Jejich zjednodušená pravidla prověří, zda nové město dokáže předběhnout starou byrokracii." # todo: NEW TRANSLATION
 SAU_the_labour_law_of_2005: "Pracovní zákon z roku 2005" # todo: NEW TRANSLATION
 SAU_the_labour_law_of_2005_desc: "Zahraniční pracovníci vybudovali moderní Království, ale sponzorský systém je váže k zaměstnavatelům a Saúdy vytlačuje ze soukromých pracovních míst. Zákon z roku 2005 uvolní některé části systému kafala a zároveň přiměje firmy zaměstnávat občany." # todo: NEW TRANSLATION
 SAU_tatweer_education_reform: "Reforma vzdělávání Tatweer" # todo: NEW TRANSLATION
 SAU_tatweer_education_reform_desc: "Memorování nedokáže zajistit inženýry a manažery, které nová ekonomika potřebuje. Tatweer upraví osnovy, omezí počet hodin náboženské výuky a zavede angličtinu do tříd od čtvrtého ročníku." # todo: NEW TRANSLATION
 SAU_king_fahd_medical_city: "Lékařské město krále Fahda" # todo: NEW TRANSLATION
 SAU_king_fahd_medical_city_desc: "Specializovaná péče je soustředěna v několika nemocnicích a městech. Lékařské město krále Fahda a nová provinční zařízení zpřístupní tuto úroveň péče Saúdům, kteří nemohou cestovat za léčbou do Rijádu." # todo: NEW TRANSLATION
 SAU_kaust: "KAUST" # todo: NEW TRANSLATION
 SAU_kaust_desc: "Univerzita získává pověst prací, která se v ní odvádí, nikoli jménem nad její branou. Větší výzkumné rozpočty pro KAUST, KFUPM a KAU poskytnou saúdským vědcům laboratoře a granty potřebné ke konkurenci v zahraničí." # todo: NEW TRANSLATION
 SAU_k_a_care_renewable_energy: "Obnovitelná energie K.A.CARE" # todo: NEW TRANSLATION
 SAU_k_a_care_renewable_energy_desc: "Království spaluje cennou ropu k výrobě elektřiny navzdory jednomu z nejsilnějších slunečních svitů na světě. K.A.CARE otestuje jinou budoucnost v Sakace a Dumatu al-Džandal a spojí sluneční energii se severním větrem." # todo: NEW TRANSLATION
 SAU_royal_decree_m_30_capital_market_law: "Královský dekret M/30, zákon o kapitálovém trhu" # todo: NEW TRANSLATION
 SAU_royal_decree_m_30_capital_market_law_desc: "Královský dekret M/30, vydaný králem Fahdem 31. července 2003, přijal zákon o kapitálovém trhu. Stanovuje moderní právní rámec pro Tadawul a regulaci saúdského kapitálového trhu." # todo: NEW TRANSLATION
 SAU_the_2007_legal_reforms: "Právní reformy z roku 2007" # todo: NEW TRANSLATION
 SAU_the_2007_legal_reforms_desc: "Právní reformy Království z roku 2007 kodifikují formální vznik společností a zavádějí jasná pravidla pro vytváření uznaných právních subjektů. Společnosti nyní mohou fungovat v předvídatelnějším korporátním rámci." # todo: NEW TRANSLATION
 SAU_the_qualified_foreign_investor_program: "Program kvalifikovaných zahraničních investorů" # todo: NEW TRANSLATION
 SAU_the_qualified_foreign_investor_program_desc: "Dne §Y15 June 2015§! otevírá §YCapital Market Authority§! §YTadawul§! poprvé přímým zahraničním institucionálním investicím. Fondy s majetkem ve správě nejméně §Y$5 billion§! mohou nakupovat saúdské akcie bez místních zprostředkovatelů, čímž začíná cesta k zařazení do §YMSCI Emerging Markets§!." # todo: NEW TRANSLATION
 SAU_msci_emerging_markets_inclusion: "Zařazení do MSCI Emerging Markets" # todo: NEW TRANSLATION
 SAU_msci_emerging_markets_inclusion_desc: "V §YJune 2018§! oznamuje §YMSCI§! povýšení Saúdské Arábie ze statusu samostatného trhu na rozvíjející se trh. Provádění začíná v §YMay 2019§! a končí druhou fází v §YAugust 2019§!. Dokončené zařazení dává §YTadawul§! přibližně §G2.83%§! indexu a očekává se, že přinese §G$14 to 16 billion§! pasivních investic." # todo: NEW TRANSLATION
 SAU_the_kafalah_sme_program: "Program Kafalah pro malé a střední podniky" # todo: NEW TRANSLATION
 SAU_the_kafalah_sme_program_desc: "Program Kafalah poskytne výhodné půjčky, jednodušší postupy a školení na pomoc saúdským podnikatelům při zakládání malých a středních podniků." # todo: NEW TRANSLATION
 SAU_the_aramco_ipo: "IPO Aramco" # todo: NEW TRANSLATION
 SAU_the_aramco_ipo_desc: "Dne §Y11 December 2019§! vstupuje §YSaudi Aramco§! na §YTadawul§!, kde původně získává §G$ 25.6 billion§! a po využití opce greenshoe §G$ 29.4 billion§!. Stává se §Glargest IPO in history§!, překonává §YAlibaba's 2014 listing§! a zůstává kótována v §YRiyadh§!, nikoli v §YNew York§! nebo §YLondýn§!." # todo: NEW TRANSLATION
 SAU_the_saudi_financial_and_banking_laws: "Saúdské finanční a bankovní zákony" # todo: NEW TRANSLATION
 SAU_the_saudi_financial_and_banking_laws_desc: "Zákon o bankovní kontrole z roku 1966 a zákony o kapitálovém trhu a družstevním pojištění přijaté v roce 2003 poskytují hlavní právní rámec saúdských financí. Společně stanovují jasné povinnosti a sankce pro banky, pojišťovny a účastníky trhu." # todo: NEW TRANSLATION
 SAU_the_capital_market_authority: "Úřad pro kapitálový trh" # todo: NEW TRANSLATION
 SAU_the_capital_market_authority_desc: "Burza se nemůže kontrolovat sama, když na jejích cenách závisí majetek saúdských domácností. Úřad pro kapitálový trh stanoví pravidla kotace, bude vyšetřovat zneužití a podřídí Tadawul regulátorovi." # todo: NEW TRANSLATION
 SAU_edaa_the_securities_depository: "Edaa: depozitář cenných papírů" # todo: NEW TRANSLATION
 SAU_edaa_the_securities_depository_desc: "§YEdaa§!, Centrum depozitáře cenných papírů, bude vypořádávat obchody na Tadawulu a vést elektronické záznamy o vlastnictví. Tato moderní infrastruktura zvýší spolehlivost trhu pro domácí i zahraniční investory." # todo: NEW TRANSLATION
 SAU_the_saudi_logistics_hub: "Saúdské logistické centrum" # todo: NEW TRANSLATION
 SAU_the_saudi_logistics_hub_desc: "Království využije Džiddu, Dammám a Rijád k vytvoření logistického centra propojujícího obchodní trasy napříč Asií, Afrikou a Evropou." # todo: NEW TRANSLATION
 SAU_establish_joint_stock_conglomerates_jsc: "Založit akciové konglomeráty (JSC)" # todo: NEW TRANSLATION
 SAU_establish_joint_stock_conglomerates_jsc_desc: "Přeměna hlavních státních subjektů na veřejné akciové společnosti umožní občanům a institucionálním investorům poskytovat kapitál pro průmyslovou expanzi. Tím se sníží závislost nových projektů na přímém financování ze státní pokladny." # todo: NEW TRANSLATION
 SAU_the_saudi_sukuk_programme: "Saúdský program sukuk" # todo: NEW TRANSLATION
 SAU_the_saudi_sukuk_programme_desc: "Od §Y2017§! zahajuje §YMinistry of Finance§! trvalý program státních sukuk – jen první mezinárodní emise vynese §G$9 billion§!. Dluhopisy v souladu se šaríou se stávají hlavním nástrojem financování saúdské vlády a získávání kapitálu podniky. Království a §YMalaysia§! si mezi sebou rozdělují světový trh islámských dluhopisů." # todo: NEW TRANSLATION
 SAU_limited_liability_company_llc: "Společnost s ručením omezeným (LLC)" # todo: NEW TRANSLATION
 SAU_limited_liability_company_llc_desc: "Zákon o společnostech z roku 2015, účinný od roku 2016, zavádí moderní právní strukturu pro společnosti s ručením omezeným vedle akciových společností. Chráněný kapitál a uznané právní postavení pomohou domácím firmám budovat dodavatelské řetězce a vstupovat do partnerství s mezinárodními společnostmi." # todo: NEW TRANSLATION
 SAU_the_gulfs_economic_engine: "Hospodářský motor Zálivu" # todo: NEW TRANSLATION
 SAU_the_gulfs_economic_engine_desc: "Silnější ekonomika Království přiláká regionální pracovníky, finanční odborníky a kapitál do Rijádu, místo aby o ně přicházela ve prospěch sousedních trhů." # todo: NEW TRANSLATION
 SAU_one_stop_shop: "Jednotné kontaktní místo" # todo: NEW TRANSLATION
 SAU_one_stop_shop_desc: "Zahraniční společnosti dříve strávily §Yyears§! jednáním s několika ministerstvy při registraci podniku. §YOne-Stop Shop§! SAGIA spojí tyto licenční kroky u §Gsingle counter§!, čímž omezí průtahy a příležitosti ke §Ycorruption§!." # todo: NEW TRANSLATION
 SAU_open_strategic_sectors: "Otevřít strategická odvětví" # todo: NEW TRANSLATION
 SAU_open_strategic_sectors_desc: "§YTelecommunications§!, §Yinsurance§! a §Ymining§! se otevřou zahraničnímu kapitálu. Noví konkurenti přinesou §Ytechnology§! a §Yexpertise§! a zároveň donutí státem podporované firmy modernizovat se." # todo: NEW TRANSLATION
 SAU_foreign_investment_law_of_2000: "Zákon o zahraničních investicích z roku 2000" # todo: NEW TRANSLATION
 SAU_foreign_investment_law_of_2000_desc: "Zákon o zahraničních investicích z §YApril 2000§! umožňuje cizincům vlastnit ve většině odvětví §G100%§! saúdských společností. Odstranění předchozích vlastnických omezení má přilákat podstatně více mezinárodního kapitálu." # todo: NEW TRANSLATION
 SAU_economic_cities_drive: "Rozvoj ekonomických měst" # todo: NEW TRANSLATION
 SAU_economic_cities_drive_desc: "Je plánováno šest nových ekonomických měst, včetně §YKing Abdullah Economic City§! u Rudého moře, §YKnowledge Economic City§! v Medíně a §YPrince Abdulaziz bin Mousaed City§! v Há'ilu. Každé bude §Ypurpose-built center§! průmyslu, služeb a obchodu mimo hlavní oblasti těžby ropy." # todo: NEW TRANSLATION
 SAU_international_partnerships: "Mezinárodní partnerství" # todo: NEW TRANSLATION
 SAU_international_partnerships_desc: "Společné podniky s §YGeneral Electric§!, §YDow Chemical§!, §YSumitomo§! a §YMitsubishi§! přinesou do Království §Ytechnology§! a §Ymanagerial expertise§!. Saúdští inženýři budou s těmito partnery spolupracovat a rozvinou dovednosti potřebné k domácímu řízení budoucích projektů." # todo: NEW TRANSLATION
 SAU_tax_incentive_package: "Daňový motivační balíček" # todo: NEW TRANSLATION
 SAU_tax_incentive_package_desc: "Sazba daně z příjmů právnických osob pro zahraniční investory klesne z §Y45%§! na §G20%§!, zatímco osobní příjem zůstane §Guntaxed§!. SAGIA bude tyto podmínky propagovat v zahraničí, aby přilákala zahraniční kapitál." # todo: NEW TRANSLATION
 SAU_saudi_arabia_open_for_business: "Saúdská Arábie otevřená podnikání" # todo: NEW TRANSLATION
 SAU_saudi_arabia_open_for_business_desc: "Licence nyní procházejí jedním úřadem namísto mnoha, zahraniční firmy mohou vlastnit to, co vybudují, a nová ekonomická města soutěží o jejich kapitál. Saúdská Arábie již nežádá investory, aby přehlíželi byrokracii; je otevřená podnikání." # todo: NEW TRANSLATION
 SAU_ras_tanura_and_abqaiq: "Ras Tanura a Abqaiq" # todo: NEW TRANSLATION
 SAU_complete_nationalization: "Úplné znárodnění" # todo: NEW TRANSLATION
 SAU_complete_nationalization_desc: "Mezi §Y1973 and 1980§! Království vykupuje americké partnery Arabian American Oil Company. ARAMCO se stává zcela saúdským podnikem – §YSaudi Aramco§!." # todo: NEW TRANSLATION
 SAU_the_master_gas_system: "Hlavní plynový systém" # todo: NEW TRANSLATION
 SAU_the_master_gas_system_desc: "Hlavní plynový systém, spuštěný v §Y1975§!, zachytává plyn dříve §Yflared off§! u vrtů a dodává levnou energii a suroviny novým průmyslovým odvětvím Království." # todo: NEW TRANSLATION
 SAU_saudi_petroleum_engineers: "Saúdští ropní inženýři" # todo: NEW TRANSLATION
 SAU_saudi_petroleum_engineers_desc: "§YKFUPM§! v Dhahránu vychovává generaci saúdských ropných inženýrů a geologů. Pracovní síla Aramca se stává nejvíce §YSaudized§! v celém Království." # todo: NEW TRANSLATION
 SAU_the_ghawar_field: "Ložisko Ghawar" # todo: NEW TRANSLATION
 SAU_the_ghawar_field_desc: "§YGhawar§! – největší kdy objevené konvenční ropné ložisko, táhnoucí se 280 km pod Východní provincií. Po desetiletí samo produkuje více než polovinu ropy Království." # todo: NEW TRANSLATION
 SAU_ras_tanura_and_abqaiq_desc: "§YRas Tanura§!, největší ropný přístav na světě, a stabilizační komplex §YAbqaiq§! shromažďují, zpracovávají a vyvážejí velkou část produkce Aramca. Rozšíření a ochrana těchto zařízení jsou pro ropný sektor Království zásadní." # todo: NEW TRANSLATION
 SAU_downstream_integration: "Integrace navazujících odvětví" # todo: NEW TRANSLATION
 SAU_downstream_integration_desc: "Přestaňme prodávat surovou ropu. Rafinerie a petrochemické komplexy v §YJubail, Yanbu and Rabigh§! mění každý barel na hodnotnější paliva a plasty §Yat home§! a zásobují SABIC." # todo: NEW TRANSLATION
 SAU_petrorabigh_and_satorp: "PetroRabigh a SATORP" # todo: NEW TRANSLATION
 SAU_petrorabigh_and_satorp_desc: "§YPetroRabigh§! (se společností Sumitomo z Japonska, 2005) a §YSATORP§! v Džubajlu (s francouzským Totalem) jsou společné podniky světového měřítka, které zpracovávají saúdskou ropu na paliva a chemikálie. Království přestává vyvážet surové barely a začíná vyvážet §Yproducts§!." # todo: NEW TRANSLATION
 SAU_doctrine_maximize_production: "Doktrína: Maximalizovat těžbu" # todo: NEW TRANSLATION
 SAU_doctrine_maximize_production_desc: "Zvýšit udržitelnou kapacitu Aramca na přibližně §Y12 million barrels a day§!. Otevřít nová ložiska napříč Východní provincií a Prázdnou končinou.\n\n§GSpawns oil§! napříč Královstvím a zvyšuje množství paliva – základ §Ywar economy§!.\n§YMutually exclusive with the other two doctrines.§!" # todo: NEW TRANSLATION
 SAU_doctrine_export_powerhouse: "Doktrína: Vývozní velmoc" # todo: NEW TRANSLATION
 SAU_doctrine_export_powerhouse_desc: "Surová ropa proudí na východ i západ supertankery. Jako §Yswing producer§! OPEC mění Království svou ropu v nejspolehlivější světový proud příjmů z §Ypetrodollar§!.\n\n§GResource export income§! a pravidelné příjmy státní pokladny – základ §Ymoney economy§!.\n§YMutually exclusive with the other two doctrines.§!" # todo: NEW TRANSLATION
 SAU_new_mega_fields: "Nová obří ložiska" # todo: NEW TRANSLATION
 SAU_new_mega_fields_desc: "§YShaybah§! (1998) hluboko v Prázdné končině, §YKhurais§! (2009) a pobřežní §YManifa§! (2013) – nová generace obřích ložisek neustále zvyšuje kapacitu Aramca. §GMore oil flows.§!" # todo: NEW TRANSLATION
 SAU_opec_swing_producer: "Rovnovážný producent OPEC" # todo: NEW TRANSLATION
 SAU_opec_swing_producer_desc: "Volná těžební kapacita Království mu umožňuje působit jako §Yswing producer§! OPEC a ovlivňovat světové ceny ropy. Tím se odemykají rozhodnutí §YOPEC Oil Lever§!, která umožní zvýšit ceny kvůli příjmům nebo je snížit s cílem zatlačit na konkurenty." # todo: NEW TRANSLATION
 SAU_the_council_of_economic_and_development_affairs: "Rada pro hospodářské a rozvojové záležitosti" # todo: NEW TRANSLATION
 SAU_the_council_of_economic_and_development_affairs_desc: "Rada pro §YCouncil of Economic and Development Affairs§!, vytvořená v roce 2015, koordinuje ministerstva a dohlíží na provádění vládního programu hospodářských reforem." # todo: NEW TRANSLATION
 SAU_the_worlds_most_valuable_company: "Nejhodnotnější společnost na světě" # todo: NEW TRANSLATION
 SAU_the_worlds_most_valuable_company_desc: "Saudi Aramco se stalo §Ymost valuable company on Earth§! a zůstává ústředním bodem ropného sektoru i veřejných financí Království.\n§YRequires a national GDP over $1,800 billion.§!" # todo: NEW TRANSLATION
 SAU_the_national_transformation_program: "Národní transformační program" # todo: NEW TRANSLATION
 SAU_the_national_transformation_program_desc: "Vize 2030 potřebuje termíny, které přežijí slavnostní oznámení. §YNational Transformation Program§! dá každému ministerstvu cíl, rozpočet a veřejné měřítko toho, zda jej splnilo." # todo: NEW TRANSLATION
 SAU_nazaha_the_anti_corruption_authority: "Nazaha: Protikorupční úřad" # todo: NEW TRANSLATION
 SAU_nazaha_the_anti_corruption_authority_desc: "§YNazaha§!, Národní protikorupční komise, byla založena v roce 2011 k vyšetřování finanční a správní korupce ve veřejných institucích. Její mandát posiluje dohled nad vládními úřady a představiteli." # todo: NEW TRANSLATION
 SAU_the_judicial_reform_of_2007: "Soudní reforma z roku 2007" # todo: NEW TRANSLATION
 SAU_the_judicial_reform_of_2007_desc: "§Y2007 judicial reform§! krále Abdalláha kodifikuje soudní postupy, vytváří Nejvyšší soud a specializované tribunály a poskytuje podnikům předvídatelnější právní systém." # todo: NEW TRANSLATION
 SAU_tayseer_regulatory_reform: "Tayseer: Regulační reforma" # todo: NEW TRANSLATION
 SAU_tayseer_regulatory_reform_desc: "Národní centrum konkurenceschopnosti (§YTayseer§!) omezí počet licencí, schválení a dalších administrativních požadavků, které zdržují investice." # todo: NEW TRANSLATION
 SAU_the_ministry_of_investment_misa: "Ministerstvo investic (MISA)" # todo: NEW TRANSLATION
 SAU_the_ministry_of_investment_misa_desc: "SAGIA se v roce 2020 stane §YMinistry of Investment§! a centralizuje vládní služby a politiku pro zahraniční investory." # todo: NEW TRANSLATION
 SAU_expec_research_centre: "Výzkumné centrum EXPEC" # todo: NEW TRANSLATION
 SAU_expec_research_centre_desc: "§YExploration and Petroleum Engineering Center§! bude rozvíjet domácí technologie modelování ložisek a vrtání. Aramco tím získá pokročilé technické schopnosti a lepší porozumění saúdské geologii." # todo: NEW TRANSLATION
 SAU_strong_saudi_banks: "Silné saúdské banky" # todo: NEW TRANSLATION
 SAU_strong_saudi_banks_desc: "Al Rajhi, NCB, Riyad Bank a Samba se rozšíří natolik, že saúdské banky budou patřit mezi sto největších na světě." # todo: NEW TRANSLATION
 SAU_insurance_for_all: "Pojištění pro všechny" # todo: NEW TRANSLATION
 SAU_insurance_for_all_desc: "Království rozšíří zdravotní, automobilové a majetkové pojištění po desetiletích omezeného rozvoje trhu." # todo: NEW TRANSLATION
 SAU_grow_the_capital_markets: "Rozvíjet kapitálové trhy" # todo: NEW TRANSLATION
 SAU_grow_the_capital_markets_desc: "Více IPO, větší likvidita a přístup zahraničních kvalifikovaných investorů rozvinou Tadawul v rozsáhlejší a vyspělejší burzu." # todo: NEW TRANSLATION
 SAU_a_saudi_bond_market: "Saúdský dluhopisový trh" # todo: NEW TRANSLATION
 SAU_a_saudi_bond_market_desc: "Království rozvine trhy se státními sukuk, podnikovými sukuk a konvenčními dluhopisy, které mohou přilákat investory od Londýna po Tokio." # todo: NEW TRANSLATION
 SAU_the_sakani_housing_program: "Program bydlení Sakani" # todo: NEW TRANSLATION
 SAU_the_sakani_housing_program_desc: "Program §YSakani§! zpřístupní vlastnictví bydlení běžným Saúdům – pozemky, financování a hotové jednotky budou dodávány ve velkém." # todo: NEW TRANSLATION
 SAU_the_national_housing_company: "Národní bytová společnost" # todo: NEW TRANSLATION
 SAU_the_national_housing_company_desc: "§YNational Housing Company§! využije standardizovanou výstavbu a územní plánování k rozšíření bydlení v okolí velkých měst." # todo: NEW TRANSLATION
 SAU_the_saudi_cement_industry: "Saúdský cementářský průmysl" # todo: NEW TRANSLATION
 SAU_the_saudi_cement_industry_desc: "Saudi Cement, Yamama a další domácí producenti budou zásobovat stavební program a sníží dovoz cementu." # todo: NEW TRANSLATION
 SAU_glass_and_building_materials: "Sklo a stavební materiály" # todo: NEW TRANSLATION
 SAU_glass_and_building_materials_desc: "Království bude vyrábět plavené sklo, keramiku a konstrukční ocel doma, aby zásobovalo svůj stavební sektor." # todo: NEW TRANSLATION
 SAU_vision_2030: "Vize 2030" # todo: NEW TRANSLATION
 SAU_vision_2030_desc: "§YVision 2030§! je plán korunního prince na snížení závislosti na ropě prostřednictvím cestovního ruchu, průmyslu, zábavy a rozsáhlých rozvojových projektů. Veřejný termín do roku 2030 činí vládu přímo odpovědnou za provedení těchto reforem." # todo: NEW TRANSLATION
 SAU_qiddiya_and_the_line: "Qiddiya a The Line" # todo: NEW TRANSLATION
 SAU_qiddiya_and_the_line_desc: "§YQiddiya§! a §YThe Line§! představí koncepty zábavy a městského rozvoje, které předcházejí větší skupině megaprojektů Království." # todo: NEW TRANSLATION
 SAU_the_red_sea_project: "Projekt Rudé moře" # todo: NEW TRANSLATION
 SAU_the_red_sea_project_desc: "§YRed Sea Project§! rozvine luxusní turistiku podél pobřeží a otevře vybrané saúdské ostrovy mezinárodním návštěvníkům." # todo: NEW TRANSLATION
 SAU_king_salman_international_airport: "Mezinárodní letiště krále Salmána" # todo: NEW TRANSLATION
 SAU_king_fahd_international_airport: "Mezinárodní letiště krále Fahda" # todo: NEW TRANSLATION
 SAU_king_fahd_international_airport_desc: "Rozlehlé mezinárodní letiště krále Fahda v Dammámu má potenciál stát se něčím víc než držitelem rekordu. Rozšiřte jeho ranveje a kapacitu letiště, aby se stalo východní branou pro saúdské cestující a náklad." # todo: NEW TRANSLATION
 SAU_king_salman_international_airport_desc: "Nové §YKing Salman International Airport§! v Rijádu bude navrženo pro 100 milionů cestujících ročně a podpoří turistické a logistické cíle Království." # todo: NEW TRANSLATION
 SAU_king_abdullah_port: "Přístav krále Abdalláha" # todo: NEW TRANSLATION
 SAU_king_abdullah_port_desc: "§YKing Abdullah Port§!, první plně soukromý přístav v regionu, se rozšíří v hlavní kontejnerový uzel." # todo: NEW TRANSLATION
 SAU_the_digital_government_authority: "Úřad digitální vlády" # todo: NEW TRANSLATION
 SAU_the_digital_government_authority_desc: "§YDigital Government Authority§! umístí veřejné služby na společnou online platformu a omezí administrativu založenou na papírování." # todo: NEW TRANSLATION
 SAU_the_e_commerce_boom: "Rozmach elektronického obchodu" # todo: NEW TRANSLATION
 SAU_the_e_commerce_boom_desc: "Růst společností Salla, Noon a dalších startupů přesune více saúdského maloobchodu online a rozšíří sektor elektronického obchodu." # todo: NEW TRANSLATION
 SAU_fintech_saudi: "Fintech Saudi" # todo: NEW TRANSLATION
 SAU_fintech_saudi_desc: "STC Pay, Tamara a rámec otevřeného bankovnictví umožní §YFintech Saudi§! rozvinout Rijád v regionální centrum finančních technologií." # todo: NEW TRANSLATION
 SAU_kacst_science_and_technology: "KACST: Věda a technologie" # todo: NEW TRANSLATION
 SAU_kacst_science_and_technology_desc: "§YKing Abdulaziz City for Science and Technology§! tvoří základ výzkumné infrastruktury Království od pokročilých materiálů po vesmír." # todo: NEW TRANSLATION
 SAU_the_human_capability_program: "Program rozvoje lidských schopností" # todo: NEW TRANSLATION
 SAU_the_human_capability_program_desc: "Nová průmyslová odvětví potřebují Saúdy vyškolené k jejich řízení. §YHuman Capability Development Program§! propojí školy, odborná učiliště a profesní výcvik s pracovními místy, která se Království snaží vytvořit." # todo: NEW TRANSLATION
 SAU_the_national_technology_development_program: "Národní program technologického rozvoje" # todo: NEW TRANSLATION
 SAU_the_national_technology_development_program_desc: "Národní program technologického rozvoje financuje startupy a hluboké technologie, které bude Království potřebovat, až příjmy z ropy zeslábnou." # todo: NEW TRANSLATION
 SAU_the_saudi_space_commission: "Saúdská vesmírná komise" # todo: NEW TRANSLATION
 SAU_the_saudi_space_commission_desc: "§YSaudi Space Commission§!, založená v roce 2018, bude rozvíjet mise astronautů, startovací kapacity a saúdskou účast v mezinárodním vesmírném sektoru." # todo: NEW TRANSLATION
 SAU_saudi_satellites_and_arabsat: "Saúdské satelity a Arabsat" # todo: NEW TRANSLATION
 SAU_saudi_satellites_and_arabsat_desc: "Program SaudiSat a podíl Království v §YArabsat§! rozšíří saúdské komunikační a pozorovací schopnosti na oběžné dráze." # todo: NEW TRANSLATION
 SAU_sami_saudi_arabian_military_industries: "SAMI: Saúdský vojenský průmysl" # todo: NEW TRANSLATION
 SAU_sami_saudi_arabian_military_industries_desc: "§YSaudi Arabian Military Industries§! byl založen v roce 2017 s cílem lokalizovat obranu – polovinu rozpočtu na zbraně utratit doma do roku 2030." # todo: NEW TRANSLATION
 SAU_gami_localise_the_arms_industry: "GAMI: Lokalizovat zbrojní průmysl" # todo: NEW TRANSLATION
 SAU_gami_localise_the_arms_industry_desc: "§YGeneral Authority for Military Industries§! licencuje a rozvíjí domácí zbrojní sektor téměř od nuly." # todo: NEW TRANSLATION
 SAU_the_saudi_drone_program: "Saúdský program dronů" # todo: NEW TRANSLATION
 SAU_the_saudi_drone_program_desc: "Vyčkávací munice a průzkumné §Ydrones§!, navržené a vyrobené v Království." # todo: NEW TRANSLATION
 SAU_the_national_cybersecurity_authority: "Národní úřad pro kybernetickou bezpečnost" # todo: NEW TRANSLATION
 SAU_the_national_cybersecurity_authority_desc: "§YNational Cybersecurity Authority§! (2017) posiluje sítě Království po desetiletí útoků na Aramco a ministerstva." # todo: NEW TRANSLATION
 SAU_sdaia_data_and_artificial_intelligence: "SDAIA: Data a umělá inteligence" # todo: NEW TRANSLATION
 SAU_sdaia_data_and_artificial_intelligence_desc: "§YSaudi Data and AI Authority§!, založený v roce 2019, bude koordinovat národní strategii umělé inteligence, rozšiřovat supervýpočetní kapacity a zpřístupňovat vládní data k praktickému využití." # todo: NEW TRANSLATION
 SAU_the_national_data_centres: "Národní datová centra" # todo: NEW TRANSLATION
 SAU_the_national_data_centres_desc: "Datová centra vyžadují dostatek energie a rozsáhlou výstavbu. Království může poskytnout obojí a kampusy hyperscale mohou podpořit domácí cloudový průmysl sloužící širšímu regionu." # todo: NEW TRANSLATION
 SAU_the_5g_network: "Síť 5G" # todo: NEW TRANSLATION
 SAU_the_5g_network_desc: "STC a Mobily pokryjí Království sítí §Y5G§!, jednou z nejrychleji zaváděných sítí na světě." # todo: NEW TRANSLATION
 SAU_absher_and_yesser_e_government: "Elektronická vláda Absher a Yesser" # todo: NEW TRANSLATION
 SAU_absher_and_yesser_e_government_desc: "Yesser, §YAbsher§! a Tawakkalna umístí vládní služby na mobilní platformy a nahradí miliony osobních návštěv." # todo: NEW TRANSLATION
 SAU_the_health_sector_transformation: "Transformace zdravotního sektoru" # todo: NEW TRANSLATION
 SAU_the_health_sector_transformation_desc: "Transformace zdravotního sektoru uspořádá nemocnice do odpovědných klastrů, rozšíří virtuální nemocnici Seha a zvýší úlohu soukromého pojištění." # todo: NEW TRANSLATION
 SAU_madrasati_and_curriculum_reform: "Madrasati a reforma osnov" # todo: NEW TRANSLATION
 SAU_madrasati_and_curriculum_reform_desc: "Platforma §YMadrasati§! a přepracované osnovy zvýší výuku kritického myšlení, angličtiny a programování a zároveň omezí závislost na memorování." # todo: NEW TRANSLATION
 SAU_the_riyadh_metro: "Rijádské metro" # todo: NEW TRANSLATION
 SAU_the_riyadh_metro_desc: "Šest linek pod hlavním městem – §YRiyadh Metro§!, jeden z největších projektů městské dopravy vybudovaných v jediné fázi." # todo: NEW TRANSLATION
 SAU_the_national_renewable_energy_program: "Národní program obnovitelné energie" # todo: NEW TRANSLATION
 SAU_the_national_renewable_energy_program_desc: "§YNational Renewable Energy Program§! rozvine desítky gigawattů solární a větrné výroby, což umožní vyvážet více ropy namísto jejího spalování při výrobě elektřiny." # todo: NEW TRANSLATION
 SAU_the_sakaka_solar_plant: "Solární elektrárna Sakaka" # todo: NEW TRANSLATION
 SAU_the_sakaka_solar_plant_desc: "Výstavba elektrárny §YSakaka§! začala v roce 2018 a v roce 2021 byla slavnostně otevřena jako první velká solární elektrárna Království. Její nízká cena elektřiny dokládá komerční potenciál saúdské solární výroby." # todo: NEW TRANSLATION
 SAU_the_dumat_al_jandal_wind_farm: "Větrná farma Dumat al-Džandal" # todo: NEW TRANSLATION
 SAU_the_dumat_al_jandal_wind_farm_desc: "Větrná farma §YDumat al-Jandal§! o výkonu 400 megawattů využije silné severní větry k dodávce obnovitelné elektřiny a stane se největší větrnou elektrárnou na Blízkém východě." # todo: NEW TRANSLATION
 SAU_neom_green_hydrogen: "Zelený vodík NEOM" # todo: NEW TRANSLATION
 SAU_neom_green_hydrogen_desc: "NEOM bude hostit největší závod na výrobu §Ygreen-hydrogen§! na světě. Projekt má přeměňovat levnou obnovitelnou elektřinu na palivo určené k vývozu." # todo: NEW TRANSLATION
 SAU_the_civil_nuclear_program: "Civilní jaderný program" # todo: NEW TRANSLATION
 SAU_the_civil_nuclear_program_desc: "Sluneční energie každý večer mizí, zatímco poptávka po elektřině a odsolené vodě nikoli. Civilní jaderný program může dodávat obojí nepřetržitě, pokud Království přijme náklady a dohled spojené s každým reaktorem." # todo: NEW TRANSLATION
 SAU_battery_energy_storage: "Bateriové ukládání energie" # todo: NEW TRANSLATION
 SAU_battery_energy_storage_desc: "Baterie v měřítku elektrické sítě budou uchovávat polední solární výrobu pro večerní špičku poptávky a zvýší spolehlivost obnovitelné energie." # todo: NEW TRANSLATION
 SAU_modernise_the_national_grid: "Modernizovat národní síť" # todo: NEW TRANSLATION
 SAU_modernise_the_national_grid_desc: "Chytrá §Ynational grid§!, propojená se sítí GCC, omezí výpadky a vyrovná proměnlivou výrobu z obnovitelných zdrojů." # todo: NEW TRANSLATION
 SAU_ceer_the_saudi_electric_car: "Ceer: Saúdský elektromobil" # todo: NEW TRANSLATION
 SAU_ceer_the_saudi_electric_car_desc: "§YCeer§!, založený v roce 2022, a závod Lucid poblíž Džiddy vytvoří domácí výrobu elektrických vozidel. Saúdská Arábie tak bude moci vyrábět automobily, místo aby zcela závisela na dovozu." # todo: NEW TRANSLATION
 SAU_fund_vision_2030: "Financovat Vizi 2030" # todo: NEW TRANSLATION
 SAU_fund_vision_2030_desc: "Tak rozsáhlý plán nemůže žít pouze z oznámení. Věnujme prostředky státní pokladny a kapitál Fondu veřejných investic projektům, které mohou omezit závislost na ropě, vytvořit pracovní místa v soukromém sektoru a dokázat, že Vize 2030 překročila rýsovací prkno." # todo: NEW TRANSLATION
 SAU_the_standardized_interest_law: "Standardizovaný zákon o úroku" # todo: NEW TRANSLATION
 SAU_the_standardized_interest_law_desc: "Úrok leží na rozhraní mezi šaríou a moderním bankovnictvím. Království se musí rozhodnout, zda ribá zcela zakáže, povolí konvenční půjčky, nebo bude tolerovat úrok skrytý za islámskými formami." # todo: NEW TRANSLATION
 SAU_fractional_reserve_mandates: "Požadavky částečných rezerv" # todo: NEW TRANSLATION
 SAU_fractional_reserve_mandates_desc: "Nižší rezervy uvolní více vkladů pro půjčky, ale zanechají banky méně schopné odolávat výběrům. Nové nařízení musí určit, kolik úvěrů mohou saúdské banky vytvořit z každého uloženého rijálu." # todo: NEW TRANSLATION
 SAU_the_anti_speculation_directives: "Směrnice proti spekulacím" # todo: NEW TRANSLATION
 SAU_the_anti_speculation_directives_desc: "Deriváty umožňují firmám zajišťovat se proti cenovým výkyvům, ale stejné nástroje mohou proměnit trhy v kasino. Regulátoři musí stanovit hranici mezi užitečným řízením rizik a nadměrným ghararem zakázaným šaríou." # todo: NEW TRANSLATION
 SAU_the_interbank_lending_code: "Kodex mezibankovních půjček" # todo: NEW TRANSLATION
 SAU_the_interbank_lending_code_desc: "Saúdské banky potřebují jednodenní trh pro přesouvání hotovosti mezi sebou. Rijád musí rozhodnout, zda tato likvidita poteče prostřednictvím konvenčního úroku, komoditní murabahy, nebo dvou souběžných systémů." # todo: NEW TRANSLATION
 SAU_the_banking_control_law: "Zákon o bankovním dohledu" # todo: NEW TRANSLATION
 SAU_the_banking_control_law_desc: "Spor o bankovnictví končí otázkou pravomoci. Bude SAMA regulovat jako nezávislý technokratický orgán, bude mít rada šaríi právo veta, nebo budou oba orgány dohlížet na své vlastní instituce?" # todo: NEW TRANSLATION
 SAU_bastion_of_islamic_finance: "Bašta islámských financí" # todo: NEW TRANSLATION
 SAU_bastion_of_islamic_finance_desc: "Islámské finance mohou být chráněnou saúdskou ortodoxií nebo obchodem prodávaným širšímu muslimskému světu. Přísná pravidla si získají důvěru ulemy; pragmatická pravidla přivedou do Rijádu více klientů." # todo: NEW TRANSLATION
 SAU_the_secularization_of_finance: "Sekularizace financí" # todo: NEW TRANSLATION
 SAU_the_secularization_of_finance_desc: "Otevření všech západních finančních nástrojů by přilákalo zahraniční kapitál a oddělilo bankovnictví od duchovního dohledu. Pozvolný přechod může zmírnit odpor, ale rozchod s tradicí zůstane." # todo: NEW TRANSLATION
 SAU_a_defensive_deal_with_pakistan: "Obranná dohoda s Pákistánem" # todo: NEW TRANSLATION
 SAU_a_defensive_deal_with_pakistan_desc: "Pákistán disponuje největší armádou v muslimském světě a jeho bomba je jedinou, kterou vlastní sunnitský stát. Zavážeme Islámábád k obraně Dvou svatých mešit." # todo: NEW TRANSLATION
 SAU_sabic_industrialization: "Industrializace SABIC" # todo: NEW TRANSLATION
 SAU_sabic_industrialization_desc: "§GSABIC§! (Saudi Basic Industries Corporation) je petrochemický gigant Království, založený v roce 1976. Proměňuje saúdskou ropu v plasty, hnojiva a chemikálie – základní stavební prvky moderní ekonomiky." # todo: NEW TRANSLATION
 SAU_establish_sagia: "Založit SAGIA" # todo: NEW TRANSLATION
 SAU_establish_sagia_desc: "Královský dekret založí §YSaúdský úřad pro obecné investice§!, aby přilákal §Gzahraniční kapitál§!. SAGIA zjednoduší licencování, bude přímo spolupracovat s mezinárodními investory a propagovat §YRijád§! jako centrum §Yglobálního podnikání§!." # todo: NEW TRANSLATION
 SAU_tadawul_the_saudi_stock_exchange: "Tadawul, saúdská burza" # todo: NEW TRANSLATION
 SAU_tadawul_the_saudi_stock_exchange_desc: "Obchodování saúdských akcií se z neformálního trhu rozrostlo v §Gburzu Tadawul§!. Moderní kapitálový trh nyní potřebuje formální pravidla pro kotaci, zveřejňování informací a obchodování, než bude moci naplnit investiční ambice Království." # todo: NEW TRANSLATION
 SAU_the_water_crisis: "Vodní krize" # todo: NEW TRANSLATION
 SAU_the_water_crisis_desc: "Podzemní vody Království se vyčerpávají, §Yodsolovací zařízení§! jsou pod stále větším tlakem a spotřeba vody na obyvatele patří k §Ynejvyšším na světě§!. Vláda musí krizi formálně uznat, než bude moci zavést celostátní řešení." # todo: NEW TRANSLATION
 SAU_saudi_foreign_policy: "Saúdská zahraniční politika" # todo: NEW TRANSLATION
 SAU_saudi_foreign_policy_desc: "Trůn, svatá města i každý tanker opouštějící Perský záliv závisí na tom, co Rijád činí v zahraničí. Saúdská diplomacie musí udržet velmoci nablízku, aniž by kterékoli z nich dovolila převzít bezpečnost Království." # todo: NEW TRANSLATION
 SAU_fortify_the_kingdom: "Opevnit Království" # todo: NEW TRANSLATION
 SAU_fortify_the_kingdom_desc: "Pokud se studená válka s Íránem rozpoutá naplno, úder dopadne na Východní provincii a průliv. Posilte obranu země pro den, kdy odstrašení selže." # todo: NEW TRANSLATION
 SAU_freedom_or_death: "Svoboda, nebo smrt" # todo: NEW TRANSLATION
 SAU_freedom_or_death_desc: "Syrská válka se stala zkouškou vůle mezi Rijádem a Teheránem. Plně se zavážeme povstání a vsadíme saúdskou prestiž na pád Asadova režimu." # todo: NEW TRANSLATION
 SAU_fund_the_jordanian_army: "Financovat jordánskou armádu" # todo: NEW TRANSLATION
 SAU_fund_the_jordanian_army_desc: "Silná jordánská armáda střeží dlouhé severní křídlo Království. Financujme vojáky Ammánu, aby v rozhodující chvíli odpovídali Rijádu." # todo: NEW TRANSLATION
 SAU_fund_the_lebanese_army: "Financovat libanonskou armádu" # todo: NEW TRANSLATION
 SAU_fund_the_lebanese_army_desc: "V Libanonu je národní armáda jedinou protiváhou Hizballáhu, státu ve státě. Financujme LAF jako konkurenční pól íránské milice." # todo: NEW TRANSLATION
 SAU_fund_the_free_syrian_army: "Financovat Svobodnou syrskou armádu" # todo: NEW TRANSLATION
 SAU_fund_the_free_syrian_army_desc: "Povstání proti rodu Asadů je příležitostí přerušit íránský most k moři. Směrujme peníze a zbraně rebelům bojujícím ve jménu svobodné Sýrie." # todo: NEW TRANSLATION
 SAU_guardians_of_the_two_mosques: "Strážci Dvou mešit" # todo: NEW TRANSLATION
 SAU_guardians_of_the_two_mosques_desc: "Titul správce Dvou svatých mešit dává králi náboženský nárok nedostupný ostatním muslimským vládcům. Rada si tento titul nemůže přivlastnit, ale může posílit svou legitimitu veřejnou podporou krále v této roli." # todo: NEW TRANSLATION
 SAU_the_hormuz_shield: "Hormuzský štít" # todo: NEW TRANSLATION
 SAU_the_hormuz_shield_desc: "Írán hrozí uzavřením průlivu při prvním náznaku války. S pomocí spojenců vybudujme letecký a námořní štít, který udrží tankery v pohybu bez ohledu na hrozby Teheránu." # todo: NEW TRANSLATION
 SAU_the_india_middle_east_corridor: "Indicko-středovýchodní koridor" # todo: NEW TRANSLATION
 SAU_the_india_middle_east_corridor_desc: "Nová cesta železnic, přístavů a potrubí by mohla vést z Bombaje přes Arábii do srdce Evropy. Učiňme z Království nepostradatelný článek koridoru obcházejícího úzká místa íránského dosahu." # todo: NEW TRANSLATION
 SAU_install_a_loyalist_in_the_government: "Dosadit loajalistu do vlády" # todo: NEW TRANSLATION
 SAU_install_a_loyalist_in_the_government_desc: "Do každého důležitého ministerstva bude přidělen sloužící důstojník s pravomocí spolupodepisovat jeho rozhodnutí. Ministři si ponechají své tituly, ale armáda získá přímou kontrolu nad státní správou." # todo: NEW TRANSLATION
 SAU_king_fahd_university_of_petroleum_and_minerals: "Univerzita ropy a nerostů krále Fahda" # todo: NEW TRANSLATION
 SAU_king_fahd_university_of_petroleum_and_minerals_desc: "Prioritu získají věda, technologie, inženýrství a matematika. Království potřebuje inženýry, nikoli duchovní. Učební plán se tomu přizpůsobí." # todo: NEW TRANSLATION
 SAU_the_tatweer_education_project: "Vzdělávací projekt Tatweer" # todo: NEW TRANSLATION
 SAU_the_tatweer_education_project_desc: "Projekt Tatweer bude klást důraz na kritické myšlení, analýzu a diskusi namísto memorování. Tato reforma změní metody výuky i širší vzdělávací kulturu." # todo: NEW TRANSLATION
 SAU_english_language_education: "Výuka angličtiny" # todo: NEW TRANSLATION
 SAU_english_language_education_desc: "Angličtina se bude vyučovat již od základní školy, aby se saúdští absolventi mohli účinněji zapojit do globální ekonomiky." # todo: NEW TRANSLATION
 SAU_the_teachers_colleges: "Učitelské školy" # todo: NEW TRANSLATION
 SAU_the_teachers_colleges_desc: "Učitelé získají moderní výcvik v pedagogice, řízení třídy a vzdělávacích technologiích." # todo: NEW TRANSLATION
 SAU_tatweer_smart_schools: "Chytré školy Tatweer" # todo: NEW TRANSLATION
 SAU_tatweer_smart_schools_desc: "Chytré školy Tatweer zavedou do tříd tablety, platformy pro online výuku a doučování s pomocí umělé inteligence." # todo: NEW TRANSLATION
 SAU_king_abdulaziz_university: "Univerzita krále Abdulazize" # todo: NEW TRANSLATION
 SAU_king_abdulaziz_university_desc: "Univerzity včetně Univerzity krále Saúda, KAUST, KFUPM a Univerzity princezny Nourah se rozšíří po celém Království a zlepší přístup k vysokoškolskému vzdělání." # todo: NEW TRANSLATION
 SAU_king_abdullah_university_of_science_and_technology: "Univerzita vědy a technologie krále Abdulláha" # todo: NEW TRANSLATION
 SAU_king_abdullah_university_of_science_and_technology_desc: "Partnerství s MIT, Oxfordem a Sorbonnou spolu se zahraničními kampusy v Saúdské Arábii přinesou do Království mezinárodní akademické znalosti." # todo: NEW TRANSLATION
 SAU_the_king_abdullah_scholarship_program: "Stipendijní program krále Abdulláha" # todo: NEW TRANSLATION
 SAU_the_king_abdullah_scholarship_program_desc: "Stipendijní program krále Abdulláha bude financovat tisíce saúdských studentů na předních zahraničních univerzitách. Absolventi se vrátí s pokročilou kvalifikací a mezinárodními zkušenostmi." # todo: NEW TRANSLATION
 SAU_integrate_gosi_payrolls: "Integrovat mzdové evidence GOSI" # todo: NEW TRANSLATION
 SAU_integrate_gosi_payrolls_desc: "Všeobecná organizace sociálního pojištění již ví, kdo je na každé výplatní listině v Království, protože vybírá odvody. Nikoho nenapadlo nasměrovat tuto databázi k otázce kvót.\n\nJakmile se propojí, pásmo Nitaqat firmy se vypočítá samo a počet skutečně zaměstnaných Saúdů přestane být tím, co firma naposledy napsala do formuláře." # todo: NEW TRANSLATION
 SAU_reform_the_kafala_system: "Reformovat systém kafala" # todo: NEW TRANSLATION
 SAU_reform_the_kafala_system_desc: "Miliony zahraničních pracovníků žijí v Království připoutány k jedinému zaměstnavateli, který drží jejich doklady i povolení k odjezdu. Reforma toto uspořádání neukončí – učiní je přehledným, přenositelným a mnohem snazším pro vstup.\n\nPříliv roste a stává se uspořádaným. Firmy přestanou platit za obcházení systému, který nikdo nemohl veřejně obhájit." # todo: NEW TRANSLATION
 SAU_platinum_tier_privileges: "Privilegia platinového pásma" # todo: NEW TRANSLATION
 SAU_platinum_tier_privileges_desc: "Firmy v nejvyšším pásmu si nechávají povolení obnovit na počkání, jejich smlouvy jsou schvalovány přednostně a jejich expanze prochází, zatímco konkurence stále čeká ve frontě.\n\nStátní pokladnu to nic nestojí a přináší to větší míru dodržování pravidel než jakákoli pokuta, kterou kdy ministerstvo uložilo." # todo: NEW TRANSLATION
 SAU_red_zone_visa_freezes: "Zmrazení víz v červeném pásmu" # todo: NEW TRANSLATION
 SAU_red_zone_visa_freezes_desc: "Firmy v nejnižším pásmu nesmějí obnovit jediné pracovní povolení, dokud se z něj nedostanou. Ne omezeno – zmrazeno.\n\nNěkteré se během čtvrtletí restrukturalizují. Některé najmou Saúdy, které nepotřebují. Některé jednoduše přestanou fungovat a ministerstvo se rozhodlo, že s tím dokáže žít." # todo: NEW TRANSLATION
 SAU_launch_the_qiwa_platform: "Spustit platformu Qiwa" # todo: NEW TRANSLATION
 SAU_launch_the_qiwa_platform_desc: "Jeden portál pro každou pracovní transakci v Království – smlouvy, převody, stav kvót, žádosti o povolení. Co dříve trvalo měsíc doručování dokumentů, nyní zabere odpoledne.\n\nJe to nejméně okázalá část tohoto programu a jediná, na které se shodnou oba tábory." # todo: NEW TRANSLATION
 SAU_repeal_the_expatriate_levy: "Zrušit poplatek za zahraniční pracovníky" # todo: NEW TRANSLATION
 SAU_repeal_the_expatriate_levy_desc: "Měsíční poplatek za každého zahraničního pracovníka měl učinit Saúdy znovu dostupnými pro soukromé výplatní listiny. Ve skutečnosti však zavřel firmy s nejnižšími maržemi a zbytek přiměl k zaměstnávání načerno.\n\nJeho zrušení vrátí pracovní sílu, na níž ekonomika stojí, ale do státní pokladny nevrátí nic." # todo: NEW TRANSLATION
 SAU_high_skill_visa_fast_track: "Zrychlená víza pro vysoce kvalifikované" # todo: NEW TRANSLATION
 SAU_high_skill_visa_fast_track_desc: "Inženýři, chirurgové a systémoví architekti, které Království zatím neumí vychovat, projdou během dnů místo měsíců – i se svými rodinami a bez sponzora držícího jejich pas.\n\nKrálovství si kupuje odborné znalosti, jejichž vlastní rozvoj ještě nedokončilo." # todo: NEW TRANSLATION
 SAU_abolish_the_noc_requirement: "Zrušit požadavek NOC" # todo: NEW TRANSLATION
 SAU_abolish_the_noc_requirement_desc: "Pracovník může změnit zaměstnavatele bez písemného svolení svého současného zaměstnavatele. Je to jediná věta vyškrtnutá z pracovního kodexu a ukončuje uspořádání, které celý systém utvářelo.\n\nKapitál si toho všimne. Stejně jako každý, kdo ze starého pravidla těžil." # todo: NEW TRANSLATION
 SAU_the_doroob_training_initiative: "Vzdělávací iniciativa Doroob" # todo: NEW TRANSLATION
 SAU_the_doroob_training_initiative_desc: "Celostátní platforma elektronického vzdělávání pro dovednosti, které soukromý sektor skutečně inzeruje, bezplatná a otevřená každému s národním průkazem.\n\nTrh práce to nenapraví. Odstraňuje však výmluvu, že nikdo nebyl proškolen." # todo: NEW TRANSLATION
 SAU_the_taqat_employment_portal: "Portál zaměstnanosti Taqat" # todo: NEW TRANSLATION
 SAU_the_taqat_employment_portal_desc: "Národní brána trhu práce: každý uchazeč o zaměstnání v jednom registru, každé vyhovující volné místo v druhém a ministerstvo, které konečně vidí rozdíl mezi nimi.\n\nDžizán a Severní hranice se v datech objevují poprvé." # todo: NEW TRANSLATION
 SAU_the_saudization_quotas: "Kvóty saúdizace" # todo: NEW TRANSLATION
 SAU_the_saudization_quotas_desc: "Kvóta přestane být jedním celostátním číslem a stane se rozvrhem – stavebnictví, maloobchod, telekomunikace a doprava dostanou každý vlastní minimum, vážené podle toho, kolik Saúdů může dané odvětví realisticky absorbovat.\n\nMinisterstvo se v tomto čísle už dříve mýlilo." # todo: NEW TRANSLATION
 SAU_subsidize_sme_compliance: "Dotovat dodržování pravidel malými a středními podniky" # todo: NEW TRANSLATION
 SAU_subsidize_sme_compliance_desc: "Konglomerát kvótu unese. Firma o třiceti lidech nikoli, přesto tyto firmy zaměstnávají na rijál příjmů více Saúdů než kterýkoli konglomerát v Království.\n\nLevné úvěry, mírnější kontrolní plán a kancelářské prostory, do nichž lze dorůst." # todo: NEW TRANSLATION
 SAU_the_industrial_cadre_mandate: "Požadavek průmyslových kádrů" # todo: NEW TRANSLATION
 SAU_the_industrial_cadre_mandate_desc: "Těžký průmysl dostane příkaz, jaký podíl jeho technických pracovníků musí být saúdský, a deset let na splnění. Petrochemické giganty to dokážou absorbovat; dodavatelé kolem nich se budou muset naučit totéž.\n\nKrálovství přestane dovážet každého inženýra, který se dotkne potrubí." # todo: NEW TRANSLATION
 SAU_hrdf_wage_subsidies: "Mzdové dotace HRDF" # todo: NEW TRANSLATION
 SAU_hrdf_wage_subsidies_desc: "Fond rozvoje lidských zdrojů hradí část mzdy saúdského zaměstnance během prvních let zaměstnání, v přesvědčení, že rozdíl mezi občanem a zahraničním pracovníkem je především rozdílem ve zkušenostech.\n\nFirmy dotaci přijmou. Zda zaměstnanec přežije její vypršení, je část, kterou nikdo nevyřešil." # todo: NEW TRANSLATION
 SAU_the_wusool_transport_subsidy: "Dopravní dotace Wusool" # todo: NEW TRANSLATION
 SAU_the_wusool_transport_subsidy_desc: "Polovina absolventů v Království jsou ženy a téměř žádná není zaměstnaná. Rozhodující překážkou není talent ani povolení – je to skutečnost, že se nedokážou dostat do kanceláře.\n\nStát dotuje cestu. Pracovní síla se rozroste o počet, kterému by se žádná migrační politika nevyrovnala." # todo: NEW TRANSLATION
 SAU_foreign_ownership_deregulation: "Deregulace zahraničního vlastnictví" # todo: NEW TRANSLATION
 SAU_foreign_ownership_deregulation_desc: "Zahraniční firma může svou saúdskou pobočku vlastnit zcela, bez námitek repatriovat zisky a obejít místního partnera, který přispěl podpisem a odnesl si třetinu.\n\nKapitál přichází rychle. Stejně rychle přichází otázka, komu patří průmysl Království." # todo: NEW TRANSLATION
 SAU_secondary_education_expansion: "Rozšíření středního vzdělávání" # todo: NEW TRANSLATION
 SAU_secondary_education_expansion_desc: "Střední školy se rozšiřují. Odborná příprava roste. Každý saúdský teenager má přístup ke střednímu vzdělání – akademickému nebo odbornému." # todo: NEW TRANSLATION
 SAU_technical_and_vocational_training_corporation: "Korporace technického a odborného vzdělávání" # todo: NEW TRANSLATION
 SAU_technical_and_vocational_training_corporation_desc: "Technické školy připravují instalatéry, elektrikáře, mechaniky a svářeče. Ne každý Saúd potřebuje univerzitní titul. Ekonomika potřebuje kvalifikovaná řemesla." # todo: NEW TRANSLATION
 SAU_saudi_internal_affairs: "Saúdské vnitřní záležitosti" # todo: NEW TRANSLATION
 SAU_saudi_internal_affairs_desc: "Vnitřní politika Království se zaměří na veřejnou bezpečnost, vzdělávání, zdravotnictví a ekonomický blahobyt. Tyto systémy tvoří základ dlouhodobé stability a rozvoje." # todo: NEW TRANSLATION
 SAU_confront_the_literacy_crisis: "Postavit se krizi gramotnosti" # todo: NEW TRANSLATION
 SAU_the_anglo_style_curriculum: "Anglosaský učební plán" # todo: NEW TRANSLATION
 SAU_the_anglo_style_curriculum_desc: "Anglosaský učební plán přinese do saúdských škol více kritického myšlení, vědeckého zkoumání a diskusí ve třídě. Ekonomika tyto návyky potřebuje, i když je ulema považuje za cizí zásah." # todo: NEW TRANSLATION
 SAU_confront_the_literacy_crisis_desc: "V roce 2000 neumí více než každý pátý Saúd číst, takže Království má §Ymíru gramotnosti pouhých 79 %§!. Peníze z ropy nemohou modernizovat zemi bez učitelů, inženýrů a úředníků. Rijád musí volit mezi §Yanglosaským učebním plánem§! a §Ydomácím systémem akademických a odborných směrů§!.\n\n§GKaždé zaměření na vzdělávání zvyšuje míru gramotnosti§! směrem k úplné gramotnosti." # todo: NEW TRANSLATION
 SAU_education_transformation_complete: "Proměna vzdělávání dokončena" # todo: NEW TRANSLATION
 SAU_education_transformation_complete_desc: "Univerzity se rozšířily, učební plány se změnily a gramotnost v celém Království roste. Reformy nevyřešily každou slabinu, ale saúdské třídy jsou lépe připraveny na práci, která je čeká." # todo: NEW TRANSLATION
 SAU_domestic_secondary_tracks: "Domácí středoškolské směry" # todo: NEW TRANSLATION
 SAU_domestic_secondary_tracks_desc: "Saúdské střední školy se rozdělí na akademické a odborné směry, z nichž každý bude postaven na dovednostech potřebných doma. Vybudování systému bude stát více než převzetí zahraničního modelu, ale bude odpovídat saúdským prioritám." # todo: NEW TRANSLATION
 SAU_ministry_of_human_resources_mandate: "Mandát ministerstva lidských zdrojů" # todo: NEW TRANSLATION
 SAU_the_nitaqat_decree: "Dekret Nitaqat" # todo: NEW TRANSLATION
 SAU_the_nitaqat_decree_desc: "Království přestane žádat firmy, aby najímaly Saúdy, a začne je hodnotit podle toho, zda tak učinily. Každá firma dostane barvu, ta určí, co smí dělat, a barva se vypočítá z výplatní listiny, kterou ministerstvo již vidí.\n\nJe to první pracovní politika v dějinách Království s připojeným mechanismem vymáhání." # todo: NEW TRANSLATION
 SAU_ministry_of_human_resources_mandate_desc: "Ministerstvo získá pravomoc, o níž se vždy předpokládalo, že ji má: stanovovat kvóty podle odvětví, odmítnout vízum bez vysvětlení a zavřít firmu, která nebude spolupracovat.\n\nFirmy, které roky lobbovaly u nesprávného oddělení, zjistí, že nyní existuje to správné – a to nemá zájem." # todo: NEW TRANSLATION
 SAU_fast_track_government_contracts: "Urychlené státní zakázky" # todo: NEW TRANSLATION
 SAU_fast_track_government_contracts_desc: "Každý rijál, který stát utratí za infrastrukturu, se stává nástrojem pracovní politiky. Firmy dodržující pravidla se účastní nabídek jako první, jsou placeny jako první a veřejně se jim to oznamuje.\n\nKrálovství je největším zákazníkem v Království. Konečně se podle toho rozhodlo nakupovat." # todo: NEW TRANSLATION
 SAU_gip: "GIP" # todo: NEW TRANSLATION
 SAU_gip_desc: "GIP se profesionalizuje. Výcvik, vybavení a postupy splňují mezinárodní standardy. Vnitřní bezpečnost Království se stává účinnější – a viditelnější." # todo: NEW TRANSLATION
 SAU_the_open_market: "Otevřený trh" # todo: NEW TRANSLATION
 SAU_the_open_market_desc: "Řešením je přestat se ptát státu. Pravidla vlastnictví zmizí, kapitálové kontroly zmizí a trh rozhodne, které firmy si zaslouží existovat a které Saúdy potřebují.\n\nJe to rychlejší a zároveň tvrdší cesta. Koho na ní připraví o práci, toho nic nezachytí." # todo: NEW TRANSLATION
 SAU_opec_agreement: "Dohoda OPEC+" # todo: NEW TRANSLATION
 SAU_opec_agreement_desc: "Moskva a Rijád jsou soupeři na trhu s ropou i na opačných stranách v Sýrii, společně však mohou určovat cenu ropy. Uzavřeme dohodu, která udrží kartel těchto dvou zemí pohromadě." # todo: NEW TRANSLATION
 SAU_command_of_the_gulf: "Vláda nad Perským zálivem" # todo: NEW TRANSLATION
 SAU_command_of_the_gulf_desc: "S íránským námořnictvem poraženým a průlivem udržovaným otevřeným stojí Království jako pán vod Perského zálivu. Dlouhý zápas o moře je vyhraný." # todo: NEW TRANSLATION
 SAU_the_iraq_war: "Válka v Iráku" # todo: NEW TRANSLATION
 SAU_the_iraq_war_desc: "Americké tanky míří k Bagdádu a starý řád v Mezopotámii bude smeten. Království se musí připravit na cokoli, co povstane z trosek." # todo: NEW TRANSLATION
 SAU_king_in_name_heir_in_uniform: "Král jménem, následník v uniformě" # todo: NEW TRANSLATION
 SAU_king_in_name_heir_in_uniform_desc: "Trůn zůstane zachován, ale následníkem bude zároveň princ a sloužící důstojník přijatelný pro Radu. Tento kompromis zachová dynastii a zároveň podřídí nástupnictví vojenskému dohledu." # todo: NEW TRANSLATION
 SAU_the_kingdom_unbeholden: "Království nezávislé na všech" # todo: NEW TRANSLATION
 SAU_the_kingdom_unbeholden_desc: "Království odmítne zahraniční bezpečnostní záruky i patrony a bude se zcela spoléhat na vlastní obranu. Je to nejdražší možnost, ale zachovává úplnou strategickou nezávislost." # todo: NEW TRANSLATION
 SAU_martial_law_issues: "Otázky stanného práva" # todo: NEW TRANSLATION
 SAU_martial_law_issues_desc: "Vojenské orgány převezmou kontrolu nad veřejnými shromážděními, pohybem mezi provinciemi a tiskem. Protože Království nemá ústavu, kterou by bylo třeba pozastavit, lze tato omezení zavést přímo dekretem." # todo: NEW TRANSLATION
 SAU_secure_support_in_the_mecca_province: "Zajistit podporu v provincii Mekka" # todo: NEW TRANSLATION
 SAU_secure_support_in_the_mecca_province_desc: "Provincie Mekka zahrnuje Džiddu, poutní centra, vlivné obchodnické rodiny a hidžázskou identitu, která předchází saúdské vládě. Rada využije patronát, bezpečnostní síly a politické ústupky k zajištění provincie." # todo: NEW TRANSLATION
 SAU_the_mecca_summit: "Summit v Mekce" # todo: NEW TRANSLATION
 SAU_the_mecca_summit_desc: "Království bude hostit jednání v Mekce a využije summit k posílení postavení Rijádu jako prostředníka v muslimském světě." # todo: NEW TRANSLATION
 SAU_memories_of_khafji: "Vzpomínky na Chafdží" # todo: NEW TRANSLATION
 SAU_memories_of_khafji_desc: "V roce 1991 irácké obrněné jednotky krátce obsadily saúdské pohraniční město, což bylo ponížení, na které Království nikdy nezapomnělo. Nechť vzpomínka na Chafdží posílí obranu země proti jakémukoli opakování." # todo: NEW TRANSLATION
 SAU_the_military_takeover: "Vojenské převzetí moci" # todo: NEW TRANSLATION
 SAU_the_military_takeover_desc: "Ozbrojené síly obsadily ministerstva, vysílací úřad a přístupy ke královským palácům. Národní garda vytvořená k zabránění takovému převratu byla obklíčena a armáda tak získala kontrolu nad Královstvím." # todo: NEW TRANSLATION
 SAU_modernisation_balance_of_power_category: "§HBudoucnost Království§!" # todo: NEW TRANSLATION
 SAU_the_monarchy_under_military_rule: "Monarchie pod vojenskou vládou" # todo: NEW TRANSLATION
 SAU_the_monarchy_under_military_rule_desc: "Král zůstane v paláci a bude dál podepisovat dekrety, ale Rada bude kontrolovat ozbrojené síly a určovat vládní politiku. Monarchie přežije jako formální instituce bez nezávislé moci." # todo: NEW TRANSLATION
 SAU_the_royal_saudi_naval_forces: "Královské saúdské námořní síly" # todo: NEW TRANSLATION
 SAU_the_royal_saudi_naval_forces_desc: "Vybudujme Královské saúdské námořní síly (RSNF), rozdělené mezi dvě moře, aby střežily dlouhé pobřeží Království." # todo: NEW TRANSLATION
 SAU_eastern_fleet_jubail: "Východní flotila (Džubajl)" # todo: NEW TRANSLATION
 SAU_eastern_fleet_jubail_desc: "Umístěme Východní flotilu v Džubajlu, aby ovládala Arabský záliv a chránila ropné terminály." # todo: NEW TRANSLATION
 SAU_western_fleet_jeddah: "Západní flotila (Džidda)" # todo: NEW TRANSLATION
 SAU_western_fleet_jeddah_desc: "Umístěme Západní flotilu v Džiddě, aby zajistila pobřeží Rudého moře a přístupy k Báb al-Mandabu." # todo: NEW TRANSLATION
 SAU_sawari_ii_frigate_programme: "Program fregat Sawari II" # todo: NEW TRANSLATION
 SAU_sawari_ii_frigate_programme_desc: "Pořiďme fregaty třídy Al Riyadh vyrobené ve Francii v rámci programu Sawari II, nejmocnější lodě flotily." # todo: NEW TRANSLATION
 SAU_badr_class_corvettes: "Korvety třídy Badr" # todo: NEW TRANSLATION
 SAU_badr_class_corvettes_desc: "Zařaďme do služby korvety třídy Badr vyrobené v USA pro hlídkování, doprovod a pobřežní údery." # todo: NEW TRANSLATION
 SAU_royal_saudi_marines: "Královská saúdská námořní pěchota" # todo: NEW TRANSLATION
 SAU_royal_saudi_marines_desc: "Vytvořme Královskou saúdskou námořní pěchotu pro obojživelné výsadky a obranu pobřeží a ostrovů." # todo: NEW TRANSLATION
 SAU_king_faisal_naval_base: "Námořní základna krále Faisala" # todo: NEW TRANSLATION
 SAU_king_faisal_naval_base_desc: "Rozvíjejme velké námořní základny v Džiddě a Džubajlu, aby dokázaly zásobovat námořnictvo se dvěma flotilami." # todo: NEW TRANSLATION
 SAU_neom_aqaba_synergy: "Synergie NEOM–Akaba" # todo: NEW TRANSLATION
 SAU_neom_aqaba_synergy_desc: "Tam, kde saúdské velkoměsto NEOM sousedí s jordánským přístavem Akaba, by mohla jediná ekonomická zóna překlenout záliv mezi nimi. Propojme obě pobřeží do jediného motoru růstu." # todo: NEW TRANSLATION
 SAU_deal_with_the_french: "Dohoda s Francouzi" # todo: NEW TRANSLATION
 SAU_deal_with_the_french_desc: "Paříž prodává zbraně každému a káže všem, ale obchod je obchod. Pečlivě ohraničený investiční pakt umožní Království těžit z francouzského průmyslu, přičemž lepší možnosti zůstanou na dosah." # todo: NEW TRANSLATION
 SAU_a_new_iraqi_alignment: "Nové irácké spojenectví" # todo: NEW TRANSLATION
 SAU_a_new_iraqi_alignment_desc: "Roky trpělivé diplomacie a patronátu přinášejí ovoce: Bagdád se konečně naklání k Rijádu. Ukotvěme nové spojenectví, než se znovu vrátí k Teheránu." # todo: NEW TRANSLATION
 SAU_major_non_nato_ally: "Významný spojenec mimo NATO" # todo: NEW TRANSLATION
 SAU_major_non_nato_ally_desc: "Nejbližším postavením, jaké může stát bez smluvního spojenectví zaujmout po boku atlantických mocností, je status privilegovaného partnera. Zajistěme Království postavení významného spojence mimo NATO." # todo: NEW TRANSLATION
 SAU_the_palestine_question: "Palestinská otázka" # todo: NEW TRANSLATION
 SAU_the_cause_above_all: "Věc nade vše" # todo: NEW TRANSLATION
 SAU_the_cause_above_all_desc: "Království učiní podporu Palestiny ústředním bodem svého nároku na vedení muslimského světa a své role správce Dvou svatých mešit." # todo: NEW TRANSLATION
 SAU_open_the_backchannel: "Otevřít tajný kanál" # todo: NEW TRANSLATION
 SAU_open_the_backchannel_desc: "Tiší muži ve třetích zemích, popíratelní a trpěliví, zjišťují, co by Tel Aviv mohl přijmout, než kterákoli strana cokoli vysloví nahlas." # todo: NEW TRANSLATION
 SAU_the_arab_peace_initiative: "Arabská mírová iniciativa" # todo: NEW TRANSLATION
 SAU_the_arab_peace_initiative_desc: "Vlastní plán Království, předložený v Bejrútu v roce 2002 a nikdy neodvolaný: úplná normalizace s celým arabským světem výměnou za nezávislou Palestinu v hranicích z roku 1967. Rijád jej znovu formálně a písemně položí na stůl." # todo: NEW TRANSLATION
 SAU_sweeten_the_deal: "Vylepšit dohodu" # todo: NEW TRANSLATION
 SAU_sweeten_the_deal_desc: "Investiční fondy, technologické koridory a otevřené nebe. Rijád ukáže Tel Avivu, jakou cenu má mír s největší ekonomikou Perského zálivu." # todo: NEW TRANSLATION
 SAU_the_talks_collapse: "Jednání se hroutí" # todo: NEW TRANSLATION
 SAU_the_talks_collapse_desc: "Izrael odmítl zaplatit cenu a Rijád ji odmítl snížit. Delegace odlétají domů a otázka se vrací ke své staré odpovědi." # todo: NEW TRANSLATION
 SAU_the_riyadh_accords: "Rijádské dohody" # todo: NEW TRANSLATION
 SAU_the_riyadh_accords_desc: "Izrael přijal Arabskou mírovou iniciativu. Uznání státnosti v hranicích z roku 1967, přičemž novou Palestinu zaručí Saúdská Arábie a Jordánsko: dohoda století podepsaná v Rijádu." # todo: NEW TRANSLATION
 SAU_embassies_and_trade: "Velvyslanectví a obchod" # todo: NEW TRANSLATION
 SAU_embassies_and_trade_desc: "Mezi Rijádem a Tel Avivem proudí lety, obchodní mise a kapitál. Mír se začíná vyplácet sám." # todo: NEW TRANSLATION
 SAU_silicon_and_sand: "Křemík a písek" # todo: NEW TRANSLATION
 SAU_silicon_and_sand_desc: "Izraelské technologie a saúdský kapitál jsou přirozenými partnery. Společné podniky v kybernetice, vodohospodářství a zemědělských technologiích zapouštějí kořeny v obou pouštích." # todo: NEW TRANSLATION
 SAU_double_down_on_palestine: "Zdvojnásobit podporu Palestině" # todo: NEW TRANSLATION
 SAU_double_down_on_palestine_desc: "Pokud Izrael neposkytne stát, Království jej vybuduje samo: peníze, instituce a saúdská váha za Ramalláhem." # todo: NEW TRANSLATION
 SAU_rally_the_arab_league: "Sjednotit Arabskou ligu" # todo: NEW TRANSLATION
 SAU_rally_the_arab_league_desc: "Neúspěšná jednání dokázala pointu každému váhajícímu hlavnímu městu. Rijád sjednotí Ligu kolem jediné linie: žádná normalizace bez Palestiny." # todo: NEW TRANSLATION
 SAU_no_peace_without_palestine: "Žádný mír bez Palestiny" # todo: NEW TRANSLATION
 SAU_the_fate_of_palestine: "Osud Palestiny" # todo: NEW TRANSLATION
 SAU_the_fate_of_palestine_desc: "Ať už smlouvou, nebo vzdorem, Království spojilo svou budoucnost s budoucností Palestiny. Správce Dvou svatých mešit neopustí Jeruzalém." # todo: NEW TRANSLATION
 SAU_no_peace_without_palestine_desc: "Dokud Palestina zůstane okupovaná, nebude v Tel Avivu žádné velvyslanectví. Království drží linii, kterou arabský svět načrtl v roce 2002." # todo: NEW TRANSLATION
 SAU_normalization_with_conditions: "Normalizace s podmínkami" # todo: NEW TRANSLATION
 SAU_normalization_with_conditions_desc: "Cena Rijádu se od Arabské mírové iniciativy nezměnila: uznání státnosti. Pokud chce Izrael ruku Království, přijme nezávislou Palestinu." # todo: NEW TRANSLATION
 SAU_normalization_without_conditions: "Normalizace bez podmínek" # todo: NEW TRANSLATION
 SAU_normalization_without_conditions_desc: "Království uzná Izrael, aniž by vyžadovalo ústupky ohledně Palestiny. Zlepší to vztahy se Spojenými státy a podpoří obchod, ale vyvolá to značný odpor v celém arabském světě." # todo: NEW TRANSLATION
 SAU_normalization_champion_the_palestinian_cause: "Podporovat palestinskou věc" # todo: NEW TRANSLATION
 SAU_normalization_champion_the_palestinian_cause_desc: "Saúdské peníze udržují světla v Ramalláhu rozsvícená a věc živou v každém arabském hlavním městě." # todo: NEW TRANSLATION
 SAU_strengthen_the_resistance: "Posílit odpor" # todo: NEW TRANSLATION
 SAU_strengthen_the_resistance_desc: "Frakce vzdorující okupaci nebudou postrádat prostředky ani přátele, dokud za nimi stojí Rijád." # todo: NEW TRANSLATION
 SAU_boycott_israeli_goods: "Bojkot izraelského zboží" # todo: NEW TRANSLATION
 SAU_boycott_israeli_goods_desc: "Ani jediný rijál saúdských peněz se nedotkne izraelského regálu. Trh Království zavře své dveře." # todo: NEW TRANSLATION
 SAU_pressure_the_normalizers: "Tlačit na stoupence normalizace" # todo: NEW TRANSLATION
 SAU_pressure_the_normalizers_desc: "Každá arabská vláda pokoušená podáním ruky Tel Avivu nejprve pocítí nelibost Rijádu. Řady drží, protože je drží Království." # todo: NEW TRANSLATION
 SAU_an_arab_consensus: "Arabský konsenzus" # todo: NEW TRANSLATION
 SAU_an_arab_consensus_desc: "Od Rabatu po Bagdád Království vytváří jeden arabský hlas k Izraeli: žádné uznání, žádné vztahy, žádné výjimky." # todo: NEW TRANSLATION
 SAU_the_palestine_question_desc: "Každé arabské hlavní město má na izraelskou otázku odpověď; žádné se neshodnou. Rijád si nyní musí zvolit vlastní: mír bez podmínek, mír za určitou cenu, nebo žádný mír." # todo: NEW TRANSLATION
 SAU_a_deal_with_south_korea: "Dohoda s Jižní Koreou" # todo: NEW TRANSLATION
 SAU_a_deal_with_south_korea_desc: "Korejské loděnice, reaktory a stavební giganti vybudovali velkou část moderního Perského zálivu. Získejme Soul jako partnera v jaderné energetice, obranném průmyslu a megaprojektech Vize 2030." # todo: NEW TRANSLATION
 SAU_saudi_china_deal: "Saúdsko-čínská dohoda" # todo: NEW TRANSLATION
 SAU_saudi_china_deal_desc: "Čínské firmy dychtí po ropných kontraktech a opěrném bodu v Perském zálivu. Nabídněme jim přístup k saúdským zemědělským a energetickým projektům výměnou za investice v Království." # todo: NEW TRANSLATION
 SAU_operation_red_gulf: "Operace Rudý záliv" # todo: NEW TRANSLATION
 SAU_operation_red_gulf_desc: "Pokud vypukne studená válka, Království musí být připraveno přenést boj na íránské pobřeží. Vypracujte plány rozhodujícího tažení ve vodách Zálivu." # todo: NEW TRANSLATION
 SAU_palestine_champion_the_palestinian_cause: "Prosazovat palestinskou věc" # todo: NEW TRANSLATION
 SAU_bankroll_the_resistance: "Financovat odpor" # todo: NEW TRANSLATION
 SAU_bankroll_the_resistance_desc: "Slova jsou levná. Směřujte skutečné peníze a zbraně palestinským frakcím, aby saúdský, nikoli íránský vliv určoval podobu tohoto boje." # todo: NEW TRANSLATION
 SAU_arm_the_militants: "Vyzbrojit militanty" # todo: NEW TRANSLATION
 SAU_arm_the_militants_desc: "Otevřeně podpořte ozbrojené frakce. Rijád se stane hlavním sponzorem zbraní a bude s Teheránem soupeřit o loajalitu každého bojovníka v Gaze." # todo: NEW TRANSLATION
 SAU_guardian_of_al_aqsa: "Strážce Al-Aksá" # todo: NEW TRANSLATION
 SAU_guardian_of_al_aqsa_desc: "Saúdská podpora zajistila Rijádu trvalou roli v Palestině a posílila jeho nárok na ochranu Al-Aksá." # todo: NEW TRANSLATION
 SAU_broker_a_two_state_peace: "Zprostředkovat mír dvou států" # todo: NEW TRANSLATION
 SAU_broker_a_two_state_peace_desc: "Království zprostředkuje řešení založené na dvou státech. Úspěšná dohoda podporovaná Saúdskou Arábií by rozšířila diplomatický vliv Rijádu po celém arabském světě." # todo: NEW TRANSLATION
 SAU_palestine_champion_the_palestinian_cause_desc: "Palestina zůstává jednou z politicky nejvýznamnějších otázek arabského světa. Podpora palestinské věci posílí nárok Království na vedení muslimů a bude čelit íránskému vlivu." # todo: NEW TRANSLATION
 SAU_ceasefire_with_the_houthis: "Příměří s Húsíji" # todo: NEW TRANSLATION
 SAU_ceasefire_with_the_houthis_desc: "Nabídněte Húsíjům příměří, které zastaví saúdské ztráty a zmrazí frontu. Pokud ho přijmou, mír bude znamenat život s ozbrojeným nepřítelem na jižní hranici." # todo: NEW TRANSLATION
 SAU_the_great_pipeline_game: "Velká potrubní hra" # todo: NEW TRANSLATION
 SAU_the_great_pipeline_game_desc: "Většina saúdského vývozu ropy prochází Hormuzským průlivem, takže je zranitelná vůči íránskému narušení. Království zváží tři alternativní trasy potrubí: přes Jemen k Arabskému moři, přes Sýrii ke Středozemnímu moři nebo přes Irák a Turecko do Evropy; každá prochází nestabilním regionem a soupeří s ruskými energetickými zájmy." # todo: NEW TRANSLATION
 SAU_prepare_defences_against_saddam: "Připravit obranu proti Saddámovi" # todo: NEW TRANSLATION
 SAU_prepare_defences_against_saddam_desc: "Zahnán do kouta je Saddám nebezpečný. Opevněte severní hranici proti armádě, která kdysi stála v Kuvajtu, jen den jízdy od ropných polí." # todo: NEW TRANSLATION
 SAU_proclaim_the_republic: "Vyhlásit republiku" # todo: NEW TRANSLATION
 SAU_proclaim_the_republic_desc: "Rada formálně zruší monarchii a vyhlásí republiku. Instituce nového státu zůstávají neuspořádané, ale trůn Ál Saúd vyhlášení nepřežije." # todo: NEW TRANSLATION
 SAU_reaffirming_the_quincy_agreement: "Potvrdit dohodu z Quincy" # todo: NEW TRANSLATION
 SAU_reaffirming_the_quincy_agreement_desc: "Roosevelt a Abdulazíz položili základ saúdsko-amerických vztahů na palubě USS Quincy v únoru 1945: americká bezpečnostní podpora výměnou za spolehlivou saúdskou ropu. Rada se pokusí potvrdit, že toto uspořádání platí pro saúdský stát, nikoli pouze pro monarchii." # todo: NEW TRANSLATION
 SAU_the_regency_decree: "Dekret o regentství" # todo: NEW TRANSLATION
 SAU_the_regency_decree_desc: "Král podepíše dekret převádějící výkonné a obranné pravomoci na Radu po dobu blíže neurčené nezpůsobilosti. Dekret zachovává zdání legality, zatímco vládu staví pod vojenskou kontrolu." # todo: NEW TRANSLATION
 SAU_master_the_crisis: "Zvládnout krizi" # todo: NEW TRANSLATION
 SAU_master_the_crisis_desc: "Ať už byla voda přivedena jakýmkoli způsobem, nyní teče a ministerstvo může konečně plánovat na rok místo na sezónu.\n\n§YOdstraňuje poslední následky vodní krize§!. Dostupné, jakmile je Ras Al-Khair nebo Shuaibah uvedena do provozu.\n\nKrálovství přestává přidělovat vodu a začíná budovat." # todo: NEW TRANSLATION
 SAU_arm_the_faithful: "Vyzbrojit věrné" # todo: NEW TRANSLATION
 SAU_arm_the_faithful_desc: "Rozdělte zbraně a výcvik milicím revoluce." # todo: NEW TRANSLATION
 SAU_hezbollah_brigades: "Brigády Hizballáhu" # todo: NEW TRANSLATION
 SAU_hezbollah_brigades_desc: "Přetvořte milice v disciplinované brigády po vzoru libanonského odboje." # todo: NEW TRANSLATION
 SAU_shia_civil_rights: "Občanská práva šíitů" # todo: NEW TRANSLATION
 SAU_shia_civil_rights_desc: "Zaručte šíitské komunitě rovnoprávné postavení před zákonem a ukončete desetiletí oficiální diskriminace." # todo: NEW TRANSLATION
