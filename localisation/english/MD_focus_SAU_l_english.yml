 SAU_the_islamic_republic_of_arabia_desc: "Vyhlaste islámskou republiku pod poručnictvím právníka, spojenou s osou odporu." # todo: NEW TRANSLATION
 SAU_shia_national_dialogue: "Národní dialog" # todo: NEW TRANSLATION
