 SAU_establish_corruption_courts_choice_tt: "§YVláda se mění§! – soudy omezí korupci a spolu s ní vzroste daňová i politická moc. §RInvestoři započítají nové riziko§! a obvinění mají přátele." # todo: NEW TRANSLATION
 SAU_the_ritz_carlton_purge_choice_tt: "§YVláda se mění§! – čistka přinese politickou moc, levnější korupci a lepší zpravodajství. §RZahraniční kapitál ji vyhodnotí jako vyvlastnění§! a podle toho ocení Království." # todo: NEW TRANSLATION
 SAU_backdoor_deals_choice_tt: "§YVláda se mění§! – výnosy, tržní příjmy i investice se zlepší. §RKorupce se prohloubí dvojnásobně§! a dvůr za to zaplatí politickou mocí." # todo: NEW TRANSLATION
 SAU_new_partners_choice_tt: "§YNásleduje volba§! – Rada vybere ručitele mimo Záliv: „Turecko“ / „Írán“ / „Indie“ / „Pákistán“ / „Rusko“. Vyvolený bude vyzván k odpovědi." # todo: NEW TRANSLATION
 SAU_the_khaleeji_union_choice_tt: "§GZáliv se stává jediným státem§! – každý zbývající člen GCC je §Hpřipojen i se svými ozbrojenými silami§!, jeho území je začleněno a Království přijímá název §HChalídž§!." # todo: NEW TRANSLATION
 SAU_ras_al_khair_complex: "Komplex Ras Al-Khair" # todo: NEW TRANSLATION
 SAU_ras_al_khair_complex_desc: "Na pobřeží Zálivu severně od Džubajlu Království lije beton pro odsolovací a energetický komplex v měřítku, o jaké se nikdo nepokusil. Jsou to státní peníze, státní půda a státní práce a komplex bude fungovat ještě dlouho poté, co muži, kteří jej podepsali, zmizí.\n\n§GVybuduje elektrárnu na fosilní paliva a infrastrukturu v Hasá§! a stabilizuje zemi.\n\n§RStojí 60 mld.§!. Vybudováno Královstvím, vlastněno Královstvím." # todo: NEW TRANSLATION
 SAU_the_shuaibah_iwpp: "Nezávislý vodárenský a energetický projekt Šu’ajba" # todo: NEW TRANSLATION
 SAU_the_shuaibah_iwpp_desc: "Jižně od Džiddy konsorcium vezme vodárenskou a energetickou elektrárnu na vlastní rozvahu a prodává její výkon Království na základě dvacetileté smlouvy. Je to levnější, rychlejší a měřidlo se odečítá v jiném hlavním městě.\n\n§GVybuduje elektrárnu na fosilní paliva a energetickou infrastrukturu v Hidžázu§!.\n\n§RStojí 30 mld. a prohlubuje americký vliv§!. Poloviční cena, ale ne zcela vaše." # todo: NEW TRANSLATION
 SAU_the_sovereign_saudi_water_company: "Suverénní saúdská vodárenská společnost" # todo: NEW TRANSLATION
 SAU_the_sovereign_saudi_water_company_desc: "Ať potrubí položil kdokoli, Království nyní staví nad vším jedinou suverénní společnost – tarify, rezervy i přidělování mezi provinciemi. Poprvé existuje jediný stůl, u něhož má otázka „kolik vody má Království“ odpověď.\n\n§GOtevírá Suverénní vody§!, postavení Království ve vodárenství, a poskytuje politickou moc.\n\nNevyrábí vodu. Činí Království za ni odpovědným." # todo: NEW TRANSLATION
 SAU_water_pride_open_tt: "§YOtevírá Suverénní vody§! – devět stupňů od Katastrofálního po Triumfální. Sleduje §Hstabilitu§!: sebevědomá země věří, že kohoutky potečou, otřesená nikoli. Každý měsíc se samo ustálí." # todo: NEW TRANSLATION
 SAU_unif_road_still_open_tt: "§YRada se ještě neobrátila jinam§! – žádost o nové partnery nebo vyhlášení autonomie navždy uzavírá americkou cestu." # todo: NEW TRANSLATION
 SAU_unif_usa_refused_tt: "§YWashington dosud nevzal Záliv pod svá křídla§! – otevřené, pokud jste se nikdy nezeptali nebo pokud Američané §Rodmítli§!." # todo: NEW TRANSLATION
 SAU_unif_partners_refused_tt: "§YŽádný vnější partner nevzal Záliv pod svá křídla§! – otevřené, pokud jste se nikdy nezeptali nebo pokud §Rodmítli§!." # todo: NEW TRANSLATION
 SAU_unif_not_yet_autonomous_tt: "§YRada nevyhlásila nezávislost§! – cesta vlastní silou tuto možnost uzavírá." # todo: NEW TRANSLATION
 SAU_unif_no_member_aligned_tt: "§YŽádný člen Rady nepozval cizí mocnost§! – turecké či indické základny, ruští poradci, vnější bezpečnostní záruky, nákupy zbraní nebo zahraniční dodávky tuto cestu uzavírají." # todo: NEW TRANSLATION
 SAU_intel_surveillance_bypass_tt: "§YObchází vlastní požadavky agentury§! – není potřeba výzkum §Hzdokonalené výpočetní techniky§! ani vylepšení §Hformovacího oddělení§!" # todo: NEW TRANSLATION
 SAU_Intelligence_category_desc: "Generální zpravodajské předsednictvo (GIP) je hlavní zpravodajskou agenturou Království, odpovědnou za shromažďování a analýzu domácích i zahraničních informací. Hraje klíčovou úlohu v národní bezpečnosti, boji proti terorismu a strategickém plánování.\n\n§GOdemknutí GIP§! vám umožní přijímat rozhodnutí, která zlepší vaše zpravodajské schopnosti a poskytnou cenné poznatky i výhody v domácích i mezinárodních záležitostech.\n\nRozhodnutí se otevřou, až dosáhnete §G70%§! proniknutí sítě GIP v zemi, a čím vyšší proniknutí bude, tím pravděpodobněji se objeví. Nebudou dostupná, pokud proniknutí klesne pod 70 %." # todo: NEW TRANSLATION
 SAU_Foregin_affairs_category_desc: "§G Zahraniční věci Saúdské Arábie §!\nZahraniční politika Království je definována citlivým diplomatickým balancováním. Jako regionální mocnost a strážce nejposvátnějších míst islámu musíme proplouvat složitými spojenectvími, zajišťovat své hospodářské zájmy a udržovat stabilitu na Blízkém východě. Ať už se úzce spojíme s tradičními západními spojenci, obrátíme se k rozvíjejícím se východním trhům, nebo se prosadíme jako nezávislý regionální hegemon, naše diplomatické sbory připraví cestu.\n\n Chcete-li otevřít další rozhodnutí týkající se zahraničních věcí, musíte dokončit fok­usy nebo získat zvláštní událost při dalším postupu.\n\n Všechna rozhodnutí se znovu objeví rok po vašem výběru." # todo: NEW TRANSLATION
 SAU_domestic_external_category_desc: "Páky Království nad domácí scénou, ropou a budoucností za jejími hranicemi.\n\n§HJak se tato rozhodnutí objevují:§!\n§GDomácí§! opatření – stavební programy, rozvojový fond a reforma pracovní síly – se odemykají s §Y„Ekonomickou liberalizací“§!.\n§GRopná§! opatření – zvýšení těžby, nová pole, ochrana rezerv, ropné embargo a nástroje OPEC – se odemykají se §Y„Saúdským Aramcem“§! a jeho exportní doktrínou.\n§GDiverzifikační§! projekty – investice PIF, megaprojekty, obnovitelné zdroje, digitální ekonomika, cestovní ruch a obranný průmysl – se odemykají při dokončování stromu §Y„Vize 2030“§!.\n\n§HNěkterá rozhodnutí od vás žádají více:§! §Ynové ropné pole§! potřebuje strategii těžby Aramca; §Yropné embargo§! lze vyhlásit pouze §Gv době míru§!, zatímco vaše ropná ekonomika funguje. Každé stojí čas a pokladnu a většina zvyšuje nebo snižuje §Hzávislost na ropě§!." # todo: NEW TRANSLATION
 SAU_vision2030_category_desc: "Megaprojekty Saúdské Arábie, každý s vlastním termínem. Financujte je a dokončete včas, aby se Vize 2030 stala skutečností. Nechte termíny uplynout a projekty se promění v nákladné pomníky ambicí, které stáhnou Vizi k neúspěchu.\n\n Pro každý projekt bude existovat rozhodnutí k jeho výstavbě; každý projekt má termín, který uvidíte po najetí kurzorem. Aktualizuje se týdně – pokud je rok 1848, další aktualizace termínu rozhodnutí bude v roce 1841 (-7 dní).\n\n pokud projekt neprovedete a termín skončí, způsobí to postih Vize 2030; pokud projekt dokončíte, místo toho zvýší bonus." # todo: NEW TRANSLATION
 SAU_military_category_desc: "Dlouhý program obnovy ozbrojených sil Království po otřesu §LOperace Pouštní bouře§! – od armády, která ke svému boji potřebovala §Lamerickou§! leteckou sílu, logistiku a velení, k moderní síle a skutečné protiváze §LÍránu§!.\n\n§HJak to funguje:§!\nKaždá reforma je §Yrozhodnutí§! odemčené vojenským §Yfokusem§!. Každá otevírá §Gvolbu doktrín§! – a každá doktrína je záměrným §Rkompromisem§!, který posiluje síly jedním způsobem a zároveň je oslabuje jiným. Reformu můžete později spustit znovu a §Yzměnit doktrínu§!.\n\n§H Tři fáze:§!\nPřipravenost postupuje ve fázích – od §RNezmodernizované§! přes §YV reformě§! a §YModernizující se§! po §GModernizované§!. Každá fáze odhalí vlastní soubor reforem a před otevřením další fáze musíte §Ydokončit všechny§!. Vše začíná vítězstvím v §Lválečných hrách: Poučení ze Zálivu§!.\n\nKaždá zvolená doktrína se promítá do národního ducha §LSaúdská armáda§!, kde je zobrazen její kombinovaný účinek." # todo: NEW TRANSLATION
 SAU_crown_prince_category_desc: "[ROOT.GetSAUSuccessionPanel]" # todo: NEW TRANSLATION
 SAU_king_abdullah_category_desc: "Abdalláh drží Království od počátečního roku – regent, dokud žije Fahd, a od roku 2005 král z vlastního práva. Jeho smrt v lednu 2015 rozhodne závod o nástupnictví a ten z §YSalmána§!, §YMohammeda bin Nájifa§! nebo §YMutaiba§!, kdo nashromáždil největší vliv, zdědí trůn i vlastní soubor směrnic. Během jeho vlády používejte rozhodnutí §YKorunní princ§! a rozhodněte, který z nich to bude. Každá směrnice zaměstnává dvůr §Y60 dní§! a druhou nelze vydat, dokud první neskončí." # todo: NEW TRANSLATION
 SAU_king_salman_category_desc: "Salmánova vláda otevírá druhý souboj, §YMohammed bin Salmán§! proti §YMohammedu bin Nájifovi§!, který se uzavře v červnu 2017 – vítěze můžete okamžitě korunovat, nebo jej ponechat korunním princem. Pokud počkáte, usedne na trůn, až královo zdraví definitivně selže, nejpozději do roku 2032. Sledujte to na kartě §YKorunní princ§! a podle libosti jej podporujte nebo oslabujte. Každá směrnice zaměstnává dvůr §Y60 dní§! a druhou nelze vydat, dokud první neskončí." # todo: NEW TRANSLATION
 SAU_king_mbs_category_desc: "Dosažitelné podporou Mohammeda bin Salmána v závodě o korunního prince za krále Salmána a následným buď okamžitým vyhlášením králem v roce 2017, nebo čekáním na selhání Salmánova zdraví. Každá směrnice zaměstnává dvůr §Y60 dní§! a druhou nelze vydat, dokud první neskončí." # todo: NEW TRANSLATION
 SAU_king_mbn_category_desc: "Dosažitelné dvěma způsoby: prosadit Mohammeda bin Nájifa před Salmána a Mutaiba v nástupnickém závodě za Abdalláhovy vlády, nebo jej nechat jmenovat korunním princem za krále Salmána a přežít krále. Každá směrnice zaměstnává dvůr §Y60 dní§! a druhou nelze vydat, dokud první neskončí." # todo: NEW TRANSLATION
 SAU_king_mutaib_category_desc: "Dosažitelné pouze vítězstvím v nástupnickém závodě za Abdalláhovy vlády před Salmánem i Mohammedem bin Nájifem – cesta outsidera. Po něm není naplánováno žádné další nástupnictví. Každá směrnice zaměstnává dvůr §Y60 dní§! a druhou nelze vydat, dokud první neskončí." # todo: NEW TRANSLATION
 SAU_faisalite_category_desc: "Faisal ibn Abdulazíz nikdy nebyl izolacionista. Založil Muslimskou světovou ligu a když v roce 1969 vyhořela Al-Aksá, během několika týdnů svolal muslimské hlavy států do Rabatu — Organizace islámské konference byla jeho dílem. Po roce 1967 otevřel v Chartúmu pokladnici Egyptu a Jordánsku, v jemenských horách zastavil expediční armádu Násira, založil Islámskou rozvojovou banku a v roce 1973 proměnil samotnou ropu ve zbraň a přiměl Západ, aby to pocítil. Soběstačnost nikdy nebyla jeho cílem. Byla prostředkem — silou, kterou království potřebovalo, než mohlo mluvit za ummu a nikoho přitom nežádat o svolení.\n\nJeho dědicové přebírají doktrínu bez muže a s ní i otázku, na kterou nikdy nemusel odpovědět. §OIzolacionismus§! považuje soběstačnost za odměnu samu o sobě: uzavřenou hranici, žádné klienty, žádné křížové výpravy, království odpovědné nikomu. §RIntervencionismus§! ji chápe stejně jako Faisal — jako základ položený proto, aby Rijád mohl vést věřící a ozbrojeně stát mezi bloky, nikoli za jedním z nich.\n\n§HPostavení království dnes§! — [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§HProbíhající směrnice§!: §Y[?SAU_faisalite_active|0]§! z §Y2§!. Zároveň mohou probíhat dvě, z kterékoli strany, a každá přinese výsledek až po dokončení.\n\nFocusy, události a rozhodnutí níže tyto počty mění a nic z toho není levné. To, co bude při vztyčení pilířů stát výše, rozhodne o posledním z nich — §RDoktríně třetí cesty§! nebo §OUšlechtilé izolaci§!." # todo: NEW TRANSLATION
 SAU_junta_category_desc: "Rada vládne pomocí dvou věcí a ani jednu nevlastní zcela. §HKontrola§! je to, co dokáže vynutit — posádky, kontrolní stanoviště, spisy, muži, kteří odpovědí na povolání. §HLegitimita§! je to, co jí náleží, a nenáleží jí nic: žádné volby, žádná fatwa, žádné nástupnictví, pouze skutečnost, že obrněná technika dorazila jako první.\n\nVše, co zvyšuje jednu, se platí z druhé. Legitimita každý měsíc bez ohledu na okolnosti klesá o jedna — junta, která pouze tiše vládne, je junta, které dochází čas.\n\n§HNa nule má Rada devadesát dní, aby našla důvod ke své existenci. Pokud ho nenajde, království tuto otázku vyřeší v poli.§!" # todo: NEW TRANSLATION
 SAU_officer_crisis_category_desc: "Pravidelná armáda nesla náklady kolapsu, Národní garda nikoli, a důstojnický sbor si ujasnil, která z těchto skutečností je záměrná. Nic z toho nemusí skončit tanky na ulici Olaya. Takto to skončí pouze tehdy, pokud se s tím nic neudělá.\n\n§HDůstojnický sbor§! — [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! ze §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]\n\nNespokojenost každý měsíc sama roste. Snižte ji až na §Y0§! a můžete se s důstojníky trvale dohodnout; nechte ji překročit §Y75§! s vydaným rozkazem k nasazení a vyřeší si to sami." # todo: NEW TRANSLATION
 SAU_modernisation_balance_of_power_category_desc: "O duši §LSaúdského království§! soupeří dvě vize. §RTradicionalistický§! tábor — §LRada vyšších učenců§!, §Lkrálovský dvůr§!, §Lkmenoví starší§! — střeží staré pořádky. Tábor §Gliberalizace§! — technokraté, inženýři vyškolení v zahraničí a zastánci §LVize 2030§! — tlačí na otevřenost, reformy a místo u stolu moderního světa. Rovnováha se posouvá s každým dokončeným fokusem a přijatým rozhodnutím." # todo: NEW TRANSLATION
 SAU_spread_revolution_category_desc: "Lidová republika Arábie je pouze první jiskrou. Revoluce se musí šířit, dokud každý arabský dělník neshodí své okovy.\n\nTato kategorie se odemkne po dokončení §YLidové republiky Arábie§! a nástupu komunistické vlády. §YŠíření revoluce§! zvyšuje podporu komunismu v arabských zemích, zatímco §YZaložit arabský Komintern§! shromažďuje státy dělníků. Rozhodnutí §YZahájit socialistickou revoluci§! zůstává v každé arabské zemi §Rskryté§!, dokud její komunisté nezískají §Y30%§! podporu, takže pokračujte ve vysílání, dokud se neobjeví. Jakmile se objeví, udeřte: při §Y50%§! nebo vyšší podpoře revoluce stát přímo ovládne, zatímco §Y30–50%§! zažehne revoluční občanskou válku. Státy dělníků nelze nikdy svrhnout, pouze přivítat v §Yarabském Kominternu§! prostřednictvím §YPozvat do arabského Kominternu§!." # todo: NEW TRANSLATION
 SAU_pipeline_sabotage_category_desc: "Ropa království odchází ropovodem — stejně jako ropa všech ostatních.\n\n§RUdeřit na trasu soupeře znamená zvýšit cenu ropy i napětí v regionu stejnou měrou§!." # todo: NEW TRANSLATION
 SAU_coalition_member_category_desc: "Odpověděli jsme na pozvání Rijádu a naše letadla jsou v rotaci. Co to stojí — a jak dlouho za to hodláme platit — je otázka pouze pro nás a východ není zamčený." # todo: NEW TRANSLATION
 SAU_debug_category_desc: "Testovací nástroje pro systémy nástupnictví, vlády a zdraví krále Salmána. Tato kategorie existuje pouze v debugovací sestavě — při běžném spuštění a ve hře více hráčů není viditelná." # todo: NEW TRANSLATION
 SAU_proxy_aggression_desc: "Financujeme útoky proti jejich lidu. Brzy na to nezapomenou." # todo: NEW TRANSLATION
 SAU_traditionalist_bop_left_side_desc: "§LWahhábovští duchovní§!, konzervativní princové a kmenoví šejkové. Zachovávají charakter království, ale brání změnám, které svět vyžaduje." # todo: NEW TRANSLATION
 SAU_liberalisation_bop_right_side_desc: "§LTechnokraté§!, inženýři vyškolení v zahraničí a reformní princové. Otevírají dveře království — za cenu narušení zavedeného pořádku." # todo: NEW TRANSLATION
 SAU_modernisation_bop_centre_range_desc: "Ani tradice, ani reformy nepřevažují. Království zůstává stabilní — prozatím." # todo: NEW TRANSLATION
 SAU_traditionalist_bop_low_range_desc: "Duchovní a konzervativci mají §Ymírnou převahu§!. Království postupuje opatrně." # todo: NEW TRANSLATION
 SAU_traditionalist_bop_medium_range_desc: "Tradice je §Hvodící rukou§!. Návrhy reforem se poměřují se staletími precedentu — a obvykle neobstojí." # todo: NEW TRANSLATION
 SAU_traditionalist_bop_advanced_range_desc: "§LRada vyšších učenců§! určuje agendu. Modernizátoři jsou §Ymarginalizováni§! nebo §Yvyhnáni§!. Království se uzavírá do sebe." # todo: NEW TRANSLATION
 SAU_traditionalist_bop_win_range_desc: "§LUlemá§! vládnou, byť ne podle jména. Svět volá, království neodpovídá. Tradice §Rzvítězila§! a cena se platí ztracenými desetiletími." # todo: NEW TRANSLATION
 SAU_liberalisation_bop_low_range_desc: "Reformátoři získali §Gopěrný bod§!. Nové úřady, nové školy a nové myšlenky prosakují trhlinami." # todo: NEW TRANSLATION
 SAU_liberalisation_bop_medium_range_desc: "Program §Lkorunního prince§! je novou ortodoxií. Univerzity se rozšiřují, turistika se otevírá, ženy řídí." # todo: NEW TRANSLATION
 SAU_liberalisation_bop_advanced_range_desc: "Reforma vrší reformu. §LUlemá§! reptají, §Lkmeny§! reptají, ale §Gtempo§! se nezpomaluje. Království se mění rychleji, než to jeho lidé dokážou vstřebat." # todo: NEW TRANSLATION
 SAU_liberalisation_bop_win_range_desc: "Saúdská Arábie je oproti království z roku 2000 §Gk nepoznání§!. Zahraniční kapitál, zahraniční turistika, zahraniční kultura. Reformátoři §Gzvítězili§! — ale §Yduchovní§! nezapomněli." # todo: NEW TRANSLATION
 SAU_Monarchy_house_of_al_saud_desc: "Rod Al Saud je vládnoucí rodinou Saúdského království. Založil jej Abdulazíz Ibn Saud v roce 1932 a od té doby si udržuje kontrolu nad zemí kombinací politických aliancí, náboženské legitimity a ekonomické moci plynoucí z ropného bohatství." # todo: NEW TRANSLATION
 SAU_Military_Rule_desc: "Nejvyšší vojenská rada řídí království. Trůn zůstává, ministerstva se zodpovídají jinam a důstojníci, kteří ovládli Rijád, zjišťují, že udržet zemi je podstatně těžší než ji uchvátit." # todo: NEW TRANSLATION
 SAU_gip_network: "§HSíť stanic GIP§!" # todo: NEW TRANSLATION
 SAU_gip_network_tt: "Stanice, krytí a operativci — stálá kapacita prezidentského úřadu.\n" # todo: NEW TRANSLATION
 SAU_gip_slots_cap_tt: "§YPrezidentský úřad může mít nejvýše 3 další operativce§! — stanice jsou vybudované a žádné další nelze otevřít." # todo: NEW TRANSLATION
