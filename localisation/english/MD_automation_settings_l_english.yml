 AUTOMATION_SETTINGS_ECONOMY_DESC: "Zvolte, které daně a veřejné výdaje se mají spravovat automaticky. Změny se vyhodnocují každý týden a respektují rezervu politické moci." # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_TAX_HEADER: "Daňové sazby" # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_BUDGET_HEADER: "Rozpočtové zákony" # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Aktivní daně se v reakci na rozpočtovou bilanci, dluh a stabilitu mění nejvýše o jeden procentní bod týdně.\n\nRuční změny ponechají automatizaci aktivní." # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Aktivní rozpočty se posouvají o jednu úroveň směrem k očekávaným výdajům. Každý týden se změní nejvýše jeden rozpočet, přičemž priorita se střídá. Zvýšení vyžaduje rozpočtový přebytek. Ruční změny zákonů ponechají automatizaci aktivní." # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_POPULATION_TAX: "Daň z obyvatelstva: [?population_tax_rate|0]%" # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_CORPORATE_TAX: "Daň z příjmu právnických osob: [?corporate_tax_rate|0]%" # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Automaticky upravovat daň z obyvatelstva o jeden procentní bod týdně podle rozpočtové bilance, dluhu a stability. Respektuje omezení změn daní a hradí běžné náklady politické moci nad rámec rezervy. Ruční změny daní ponechají tuto možnost aktivní." # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Automaticky upravovat daň z příjmu právnických osob o jeden procentní bod týdně podle rozpočtové bilance, dluhu a dostupných civilních továren. Respektuje omezení změn daní a hradí běžné náklady politické moci nad rámec rezervy. Ruční změny daní ponechají tuto možnost aktivní." # todo: NEW TRANSLATION
