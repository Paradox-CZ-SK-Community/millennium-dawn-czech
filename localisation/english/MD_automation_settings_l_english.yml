 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Po dobu aktivace denně spotřebovávat £pol_power §R0.05§! politické moci. Automaticky spotřebovat £pol_power §Y125§! k zahájení 60denní kampaně proti nejsilnější způsobilé zahraniční vlivové osobě. Současně probíhá pouze jedna kampaň. Nezpůsobilé cíle, cíle pod nátlakem lobbistů a cíle v období zotavení se přeskočí. Automatizace se pozastaví, pokud by některý z nákladů snížil politickou moc pod rezervu." # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Každá aktivní možnost stojí denně £pol_power §R0.05§!. Obě možnosti dohromady stojí denně £pol_power §R0.10§!." # todo: NEW TRANSLATION
