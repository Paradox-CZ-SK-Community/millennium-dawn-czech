 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Automaticky objednávat palivo pro naši antarktickou stanici, pokud od listopadu do března zbývá 15 nebo méně dní, nebo od dubna do října 30 nebo méně dní. Dodávky stojí §R$0.25b za 1000 paliva§!, během antarktické zimy dvojnásobek. Objednávky počkají, dokud státní pokladna nebude moci uhradit plné náklady." # todo: NEW TRANSLATION
