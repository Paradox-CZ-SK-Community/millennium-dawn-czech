 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Automatický nákup paliva" # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Nakoupit palivo okamžitě, poté kontrolovat stav každých 28 dní a znovu nakoupit, kdykoli zásoby paliva klesnou pod 20 procent. Deaktivací zrušíte budoucí nákupy." # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Opakovat vybrané domácí investice" # todo: NEW TRANSLATION
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Po dobu aktivace denně spotřebovávat £pol_power §R0.15§! politické moci. Kliknutím pravým tlačítkem na tlačítka domácích investic v zobrazení státu vyberte stát a typy investic k opakování. Vybrané investice se kontrolují každý týden a provedou se, pokud je volný slot, státní pokladna může uhradit aktuální náklady a lze zachovat rezervu politické moci." # todo: NEW TRANSLATION
