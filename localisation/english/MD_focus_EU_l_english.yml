 pre_accession_assistance_program: "Program předvstupní pomoci" # todo: NEW TRANSLATION
 pre_accession_assistance_program_desc: "§C[EUU.GetFlag][EUU.GetName]§! podporuje reformy kandidátů na členství, aby splnili kritéria pro členství §C[EUU.GetFlag][EUU.GetName]§!. Pomoc je primárně zaměřena na odstraňování korupce a poskytování určitého ekonomického oživení, aby se naše finance uspořádaly." # todo: NEW TRANSLATION
