 european_council_header_tt: "Právní akty §C[EUU.GetFlag][EUU.GetName]§!\n--------------\nAktuálně schválené právní akty §C[EUU.GetFlag][EUU.GetName]§!.\n\nRada Evropské unie funguje na systému kvalifikované většiny (QMV), známém jako dvojí většina. Požaduje 55 % Členských států a 65 % populace Evropské unie." # todo: NEW TRANSLATION
