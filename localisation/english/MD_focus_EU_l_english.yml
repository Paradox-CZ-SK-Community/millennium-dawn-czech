 EU_show_available_desc_110_loc_key: "§YThis proposed law is a Federalization EU Law.§!\n\nProces evropské integrace dosáhl stavu, kdy jakákoli další integrace povede k federalizaci §C[EUU.GetFlag][EUU.GetName]§!." # todo: NEW TRANSLATION
 EU_show_available_desc_111_loc_key: "§YThis proposed law is a Federalization EU Law.§!\n\nPo více než 70 letech evropské integrace se členské státy §C[EUU.GetFlag][EUU.GetName]§! rozhodly vzdát se své suverenity a vytvořit §C[EUU.GetFlag] Spojené státy evropské§!." # todo: NEW TRANSLATION
