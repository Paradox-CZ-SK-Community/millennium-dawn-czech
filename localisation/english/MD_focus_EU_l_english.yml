 system_of_eu_values_tt: "Systém evropských hodnot:\nHodnota EU:\nproblém porušení – úroveň porušení\n\nPrávní stát:\nParalyzující korupce – 5\nOchromující korupce – 4\nRozšířená korupce – 3\nNespoutaná korupce – 2\nSystematická korupce – 1\n\nRespekt k lidské důstojnosti a svobodě:\nvede útočnou válku s členským státem EU – 10\nmá komunistickou vládu – 2\nmá reakční vládu – 2\nmá komunisty ve vládní koalici – 1\nmá reakcionáře ve vládní koalici – 1\n\nDemokracie:\nŽádné volby – 5\nDiktatura – 5\nKomunistická diktatura – 5\nFašistická diktatura – 5\nje loutkovým státem – 4\nNeokolonialismus – 1\n\nPráva žen a menšin:\nZákaz služby žen – 1\nVolební práh 10 % – 1\n\nDoložka o zákazu záchranného balíčku:\nNesplácení dluhů – 1\nPoskytnutý záchranný balíček – 1" # todo: CHANGED
