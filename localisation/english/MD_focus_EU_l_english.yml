 EU_Tech_Share_name: "Evropská obranná agentura (EDA)" # todo: NEW TRANSLATION
 EU_Tech_Share_desc: "Členské státy spojují své výzkumné snahy. Evropská obranná agentura (EDA) koordinuje snahy mezi členskými státy Evropské unie." # todo: NEW TRANSLATION
 tooltip_ECB_Start_OMT_effect: "§GPo levém kliknutí§! §YOMT Program§! bude k dispozici.\n\n§GPo pravém kliknutí§! §YOMT Size Limit§! > $0." # todo: NEW TRANSLATION
 tooltip_ECB_adjust_OMT_limit_effect: "§GPři levém kliknutí§! §YOMT Size Limit§!: Přidejte §G+$200§! miliard.\nVšechny členské státy s §Yúrokovou sazbou§! < §R4.0%§!: Přidejte §R+5%§! Euroskepticismus.\nVšechny členské státy s §Yúrokovou sazbou§! > §R4.0%§!: Přidejte §G-5%§! Euroskepticismus.\n\n§GPři pravém kliknutí§! §YOMT Size Limit§!: Přidejte §R-$200§! miliard.\nVšechny členské státy s §Yúrokovou sazbou§! < §R4.0%§!: Přidejte §G-5%§! Euroskepticismus.\nVšechny členské státy s §Yúrokovou sazbou§! > §R4.0%§!: Přidejte §R+5%§! Euroskepticismus.\n" # todo: NEW TRANSLATION
 tooltip_ECB_Outright_Monetary_Transactions_available: "§YOMT Limit velikosti§! > $0." # todo: NEW TRANSLATION
 tooltip_ECB_Outright_Monetary_Transactions_complete_effect: "Všechny členské státy s §Yúrokovou sazbou§! > §R4.0%§!: Dluh se sníží, dokud §Yúroková sazba§! < §R4.0%§! A §GOMT Limit velikosti§! > §BOMT Total Value§!." # todo: NEW TRANSLATION
 tooltip_ECB_Outright_Monetary_Transactions_remove_effect: "Všechny členské státy s §BOMT účet§! > $0: §RPřidat§! §BOMT účet§! do dluhu." # todo: NEW TRANSLATION
 EU_exit_category: "Odstoupení od Evropské unie" # todo: NEW TRANSLATION
 EU_exit_category_desc: "Se vzrůstajícím euroskepticismem v celé Unii některé členské státy budou uvažovat o opuštění §C[EUU.GetFlag] Evropské unie§!.\n\nVlajka a název členských států, které aktivovaly článek 50:\n\n [ALB_EU_exit_Loc][ARM_EU_exit_Loc][AUS_EU_exit_Loc][AZE_EU_exit_Loc][BEL_EU_exit_Loc][BLR_EU_exit_Loc][BOS_EU_exit_Loc][BUL_EU_exit_Loc][CAT_EU_exit_Loc][CRE_EU_exit_Loc][CRO_EU_exit_Loc][CYP_EU_exit_Loc][CZE_EU_exit_Loc][DEN_EU_exit_Loc][ENG_EU_exit_Loc][EST_EU_exit_Loc][FIN_EU_exit_Loc][FRA_EU_exit_Loc][FYR_EU_exit_Loc][GEO_EU_exit_Loc][GER_EU_exit_Loc][GRE_EU_exit_Loc][HOL_EU_exit_Loc][HUN_EU_exit_Loc][ICE_EU_exit_Loc][IRE_EU_exit_Loc][ITA_EU_exit_Loc][KOS_EU_exit_Loc][LAT_EU_exit_Loc][LIT_EU_exit_Loc][LUX_EU_exit_Loc][MLT_EU_exit_Loc][MLV_EU_exit_Loc][MNT_EU_exit_Loc][NOR_EU_exit_Loc][POL_EU_exit_Loc][POR_EU_exit_Loc][ROM_EU_exit_Loc][SCL_EU_exit_Loc][SCO_EU_exit_Loc][SER_EU_exit_Loc][SLO_EU_exit_Loc][SLV_EU_exit_Loc][SPR_EU_exit_Loc][SWE_EU_exit_Loc][SWI_EU_exit_Loc][TUR_EU_exit_Loc][UKR_EU_exit_Loc][WAS_EU_exit_Loc][HLS_EU_exit_Loc][SMA_EU_exit_Loc][MNC_EU_exit_Loc][ADO_EU_exit_Loc][LIC_EU_exit_Loc][VOJ_EU_exit_Loc][GAL_EU_exit_Loc][SIL_EU_exit_Loc][SPA_EU_exit_Loc][CNR_EU_exit_Loc][NAV_EU_exit_Loc][BAY_EU_exit_Loc][GRL_EU_exit_Loc]" # todo: NEW TRANSLATION
 Article_50: "[THIS.GetName] aktivoval Článek 50" # todo: NEW TRANSLATION
 EU_Article_50: "Opustit Evropskou unii! (Článek 50)" # todo: NEW TRANSLATION
 EU_Article_50_desc: "\"Každý členský stát se může rozhodnout odstoupit od Unie v souladu se svými vlastními ústavními požadavky.\"\\n- Článek 50(1), Smlouva o Evropské unii.\\n\\n První ustanovení článku 50 bylo vypracováno pro Ústavní smlouvu pro Evropskou unii. Po neúspěšném ratifikačním procesu Evropské ústavy byl tento článek začleněn do Lisabonské smlouvy." # todo: NEW TRANSLATION
 EU_Revoke_Article_50: "Zrušit Článek 50" # todo: NEW TRANSLATION
 EU_Revoke_Article_50_desc: "Odvolat článek 50 a zůstat v §C[EUU.GetFlag] Evropské unii§!\n„Článek 50 SEU musí být vykládán v tom smyslu, že pokud členský stát oznámil Evropské radě v souladu s tímto článkem svůj záměr vystoupit z Evropské unie, tento článek umožňuje tomuto členskému státu po dobu, kdy dohoda o vystoupení uzavřená mezi tímto členským státem a Evropskou unií nevstoupila v platnost, nebo pokud žádná taková dohoda nebyla uzavřena, po dobu dvou let stanovených v čl. 50 odst. 3 SEU, případně prodloužených podle tohoto odstavce, jednostranně, jednoznačně a bezpodmínečně odvolat toto oznámení písemným oznámením adresovaným Evropské radě poté, co dotčený členský stát přijal rozhodnutí o odvolání v souladu se svými ústavními požadavky. Účelem tohoto odvolání je potvrdit členství dotčeného členského státu v EU za podmínek, které se nemění, pokud jde o jeho postavení členského státu, a toto odvolání ukončuje postup vystoupení.“\n– Rozsudek Soudního dvora Evropské unie ve věci C-621/18" # todo: CHANGED
 EU_exit: "Odchod z EU" # todo: CHANGED
 EU_exit_desc: "§Y[ROOT.GetNameWithFlag]§! oznámil Evropské radě svůj záměr opustit §C[EUU.GetFlag] Evropskou unii§!. §Y[ROOT.GetNameWithFlag]§! opustí Unii dva roky po oznámení." # todo: NEW TRANSLATION
 EU_extend_Article_50: "Prodloužení článku 50" # todo: NEW TRANSLATION
