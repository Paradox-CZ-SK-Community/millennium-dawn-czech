 EU_mff_draft_mission: "Jednání o víceletém finančním rámci" # todo: CHANGED
 EU_mff_draft_mission_desc: "Během vyjednávání mohou všechny členské státy investovat politickou sílu, aby návrh změnily podle své představy. Změny návrhu ovlivní názor politických skupin Evropského parlamentu na návrh."
