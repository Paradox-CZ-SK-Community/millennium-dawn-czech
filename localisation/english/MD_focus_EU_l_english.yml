 EU_influence_on_leader_of_foreign_policy_25_percent_TT: "§Y[ROOT.GetNameWithFlag]§! musí mít více než 25% vliv na §Cleadera zahraniční politiky [EUU.GetFlag] Evropské unie§! (v tomto pořadí §Yvysokého představitele Unie pro zahraniční věci a bezpečnostní politiku§!, §Yprezidenta Evropské komise§!, §Y předsedu Evropského parlamentu§!).\nPokud v současnosti není obsazena žádná funkce EU v oblasti zahraniční politiky, vyžaduje se místo toho více než 5% vliv na každého dalšího člena EU." # todo: NEW TRANSLATION
