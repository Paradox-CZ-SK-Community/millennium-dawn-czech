 EU_total_member_vote_desc_tt: "§C[EUU.GetFlag][EUU.GetName]'s§! primárny systém hlasovania je kvalifikovaná väčšina (QMV). QMV vyžaduje, že [?global.EU_majority_qmv_state] Členské štáty (alebo 55 % aktuálneho počtu členských štátov) podpoří súčasné uznesenie. Akonáhle budeme mať viac než [?global.EU_majority_qmv_state] Členských štátov, zákon môže byť prijatý, za predpokladu, že máme požadovanú väčšinu populácie 65 %.\n\nPodiel % populácie EÚ §GPodporované§!: [?global.var_EUpopRatioYes|%+]\nPodiel % populácie EÚ §ROdmietnuté§!: [?global.var_EUpopRatioNo|%-]" # todo: NEW TRANSLATION
