 EU_pre_accession_assistance_desc: "§C[EUU.GetFlag][EUU.GetName]§! podporuje reformy kandidátů na členství, aby splnili kritéria pro členství §C[EUU.GetFlag][EUU.GetName]§!. Pomoc je primárně zaměřena na odstranění korupce a poskytování ekonomického oživení, aby pomohla uspořádat naše finance." # todo: NEW TRANSLATION
