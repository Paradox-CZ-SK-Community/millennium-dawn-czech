 EU_apply_for_membership_category: "Přistoupení k EU" # todo: NEW TRANSLATION
 EU_apply_for_membership_category_desc: "Stát se členem EU je složitý proces, který se neuskuteční přes noc. Jakmile kandidátská země splní podmínky členství, musí zavést pravidla a předpisy EU ve všech oblastech.\nO členství může požádat každá země, která splňuje podmínky členství. Tyto podmínky jsou známé jako „kodaňská kritéria“ a zahrnují tržní ekonomiku, stabilní demokracii a právní stát a přijetí veškeré legislativy EU včetně eura." # todo: CHANGED
 EU_apply_for_membership: "Přistoupení k EU" # todo: NEW TRANSLATION
 EU_apply_for_membership_desc: "§Y[ROOT.GetNameWithFlag]§! může vstoupit do §C[EUU.GetFlag] Evropské unie§! nechť zazní Óda na radost:\nRadost, krásný záblesk božství,\nDcera Elyseje,\nVstupujeme, opilí ohněm,\nNebeský Jeden, tvá svatyně!\nTvá magie znovu svazuje\nTo, co zvyk přísně rozděloval;\nVšichni lidé se stanou bratry,\nKde tvé jemné křídlo spočine." # todo: NEW TRANSLATION
 EU_join_the_euro_decision: "Přijetí eura" # todo: NEW TRANSLATION
 EU_join_the_euro_decision_desc: "Pro přijetí eura musí země EU uvést své vnitrostátní právní předpisy do souladu s příslušným právem EU a splnit konkrétní podmínky zajišťující hospodářské sbližování. Tyto požadavky, na kterých se členské státy EU dohodly v Maastrichtu v roce 1991, se nazývají konvergenční kritéria." # todo: NEW TRANSLATION
 EU_joined_the_eurozone: "Připojil se k eurozóně" # todo: NEW TRANSLATION
 USoE_integrate_new_members: "Integrovat nové členské státy" # todo: NEW TRANSLATION
 USoE_integrate_new_members_desc: "Další státy se rozhodly pokračovat vpřed a vstoupit do Unie. Je čas integrovat tyto nové členské státy a učinit Spojené státy evropské ještě silnějšími do budoucna." # todo: NEW TRANSLATION
 instrument_for_pre_accession_assistance: "Nástroj pro předvstupní pomoc (IPA)" # todo: NEW TRANSLATION
 instrument_for_pre_accession_assistance_desc: "Nástroj pro předvstupní pomoc (IPA) je způsob, jak EU podporuje reformy v regionu rozšíření prostřednictvím finanční a technické pomoci." # todo: NEW TRANSLATION
