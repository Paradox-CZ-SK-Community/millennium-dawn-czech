 EU_voting_category_desc: "[ROOT.GetFlag] Evropanství: [?ROOT.europeanism|%G1]\n[EUU.GetFlag] Evropanství: [?global.var_europeanism|%G1]\n\nEvropanství, známé také jako proevropanství nebo evropanství Evropské unie, je politický postoj podporující evropskou integraci a členství v Evropské unii (EU), včetně radikálnějších evropských federalistů, kteří usilují o jediný superstát neformálně známý jako Spojené státy evropské. Souvisejícím pojmem je „eurofil“. U země tento podíl odhaduje podíl obyvatel, kteří by v referendu o členství hlasovali pro setrvání v EU. U Unie jako celku odhaduje podíl eurofilních obyvatel ze všech členských států.\n\n[ROOT.GetFlag] Porušení hodnot Evropské unie: [?ROOT.breach_of_EU_value|g0]\n„Unie je založena na hodnotách úcty k lidské důstojnosti, svobodě, demokracii, rovnosti, právnímu státu a dodržování lidských práv, včetně práv příslušníků menšin. Tyto hodnoty jsou společné členským státům ve společnosti, v níž převládá pluralismus, nediskriminace, tolerance, spravedlnost, solidarita a rovnost žen a mužů.“\n– Článek 2 Smlouvy o Evropské unii\n\n" # todo: CHANGED
