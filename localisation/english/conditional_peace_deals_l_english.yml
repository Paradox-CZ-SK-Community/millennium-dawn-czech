 CPD_resource_rights_button_TT: "§YPráva na zdroje§!" # todo: NEW TRANSLATION
 CPD_resource_rights_button_TT_DELAYED: "Zajištění §Ypráv na těžbu zdrojů§! odkloní produkci zdrojů vybraných států k nám. Samotné státy zůstanou pod současným vlastníkem; do naší ekonomiky bude proudit pouze ropa, ocel, hliník, kaučuk, wolfram a chrom, které produkují. Ujednání platí, dokud nebude zrušeno jinou mírovou dohodou." # todo: NEW TRANSLATION
 CPD_military_basing_button_TT: "§YVojenské základny§!" # todo: NEW TRANSLATION
 CPD_military_basing_button_TT_DELAYED: "§YPráva na vojenské základny§! poskytují našim silám volný průchod územím tohoto národa. Naše jednotky se mohou volně přesouvat a rozmísťovat, dokud nebude přístup odebrán." # todo: NEW TRANSLATION
 CPD_full_puppet_button_TT: "§YPlná loutková závislost§!" # todo: NEW TRANSLATION
 CPD_full_puppet_button_TT_DELAYED: "Požadavek na §Yplnou loutkovou závislost§! promění celý tento národ v našeho podřízeného. Zachová si své hranice a obyvatelstvo, ale ztratí nezávislost v zahraniční politice; jeho ekonomika, lidské zdroje a armáda se budou řídit námi. Jakékoli požadavky na podřízení států, které již jsou součástí této dohody, budou tímto nahrazeny." # todo: NEW TRANSLATION
 CPD_ceasefire_button_TT: "§YPříměří§!" # todo: NEW TRANSLATION
 CPD_ceasefire_button_TT_DELAYED: "§YPříměří§! ukončí válku s frontovou linií v jejím současném stavu. Každá strana si ponechá státy, které právě ovládá, bez ohledu na to, kdo je držel dříve. Příměří potrvá §Y720 dní§!, než bude moci kterákoli strana znovu vyhlásit válku druhé straně.\n\nPříměří a územní požadavky nemohou být součástí jedné dohody. Aktivací příměří se z aktuálního návrhu odstraní všechny položky na úrovni států." # todo: NEW TRANSLATION
 CPD_war_reparations_button_TT: "§YVálečné reparace§!" # todo: NEW TRANSLATION
 CPD_war_reparations_button_TT_DELAYED: "§YVálečné reparace§! zavazují poraženého po dobu jednoho roku týdně odvádět část svého HDP. Převod se v rozpočtu plátce objeví jako nový výdaj a v rozpočtu příjemce jako nový příjem.\n\n[CPD_reparations_preview]" # todo: NEW TRANSLATION
 CPD_reparations_preview_TT: "Předpokládaný převod pro tuto dohodu: §Y£[?CPD_rep_preview_temp|.2]B týdně§! (~§Y£[?CPD_rep_preview_total_temp|.0]B§! za rok)" # todo: NEW TRANSLATION
 CPD_forced_neutrality_button_TT: "§YNucená neutralita§!" # todo: NEW TRANSLATION
 CPD_forced_neutrality_button_TT_DELAYED: "§YNucená neutralita§! při podpisu odstraní tento národ z jeho frakce a na §Ypět let§! mu zabrání připojit se k jiné frakci nebo ji vytvořit." # todo: NEW TRANSLATION
 CPD_regime_change_button_TT: "§YZměna režimu§!" # todo: NEW TRANSLATION
 CPD_regime_change_button_TT_DELAYED: "§YZměna režimu§! nahradí vládnoucí stranu cíle stranou, která je právě u moci v našem národě. Jeho koalice bude rozpuštěna a do čela bude dosazen vůdce našeho politického směru. Nová vláda bude po dobu dvou let trpět §Ypoválečnou nestabilitou§! a v islámských národech může proti vládě vnucené cizí mocností dojít k §Ysalafistickému odporu§!." # todo: NEW TRANSLATION
 additional_income_war_reparations_tt: "$$[?CPD_reparations_weekly|+3] z §Yválečných reparací§!\n" # todo: NEW TRANSLATION
 additional_expense_war_reparations_tt: "$$[?CPD_reparations_weekly|-3] na §Yválečné reparace§!\n" # todo: NEW TRANSLATION
 CPD_war_reparations_payer: "Válečné reparace (plátce)" # todo: NEW TRANSLATION
 CPD_war_reparations_payer_desc: "V důsledku mírové dohody platíme válečné reparace. Týdenní peněžní převod se po dobu §Y1 roku§! objeví v našem rozpočtu jako dodatečný výdaj." # todo: NEW TRANSLATION
 CPD_war_reparations_receiver: "Válečné reparace (příjemce)" # todo: NEW TRANSLATION
 CPD_war_reparations_receiver_desc: "V důsledku mírové dohody přijímáme válečné reparace. Týdenní peněžní převod se po dobu §Y1 roku§! objeví v našem rozpočtu jako dodatečný příjem." # todo: NEW TRANSLATION
 CPD_forced_neutrality_spirit: "Vynucená neutralita" # todo: NEW TRANSLATION
 CPD_forced_neutrality_spirit_desc: "Na základě podmínek mírové dohody má náš národ zakázáno připojovat se k vojenským aliancím nebo je vytvářet." # todo: NEW TRANSLATION
 CPD_regime_change_instability: "Poválečná politická nestabilita" # todo: NEW TRANSLATION
 CPD_regime_change_instability_desc: "Vynucená změna režimu destabilizovala náš politický systém." # todo: NEW TRANSLATION
 CPD_peace_deal_explainer_ICON_TT: "Jak fungují mírové dohody" # todo: NEW TRANSLATION
 CPD_peace_deal_explainer_ICON_TT_DELAYED: "Sestavení mírové dohody je tak jednoduché, jako vybrat záložku výše a poté v státě zvolit, co postoupit nebo požadovat.\n\nMírová dohoda s §Ynegativní§! cenou bude pravděpodobně přijata AI, zatímco dohoda s §Ypozitivní§! cenou bude méně pravděpodobná k přijetí. Celé rozpis odhodlání AI přijmout dohodu můžete vidět, když najedete myší na políčko přijetí.\n\nJakákoli mírová dohoda vytvořená pro hráče není těmito hodnotami ovlivněna." # todo: NEW TRANSLATION
 CPD_annex_state_button_TT: "[CPD_ANNEX_STATE_TT_LOC]" # todo: NEW TRANSLATION
 CPD_annex_state_button_TT_DELAYED: "[CPD_ANNEX_STATE_TT_DELAYED_LOC]" # todo: NEW TRANSLATION
 CPD_annex_state_button_TT_DEMAND: "Požadovat státy" # todo: NEW TRANSLATION
 CPD_annex_state_button_TT_CONCESSION: "Postoupit státy" # todo: NEW TRANSLATION
 CPD_annex_state_button_TT_DELAYED_DEMAND: "Vybraná nepřátelská území jsou připojena k našemu národu spolu s jejich obyvateli, továrnami a zdroji. Státy, na něž máme nárok, stojí polovinu strategické hodnoty; nárokované státy třetinu. Požadování území, které původní vlastník stále drží, zdvojnásobuje cenu." # todo: CHANGED
 CPD_annex_state_button_TT_DELAYED_CONCESSION: "§YPostoupení států§! znamená jejich předání nepříteli. Každé postoupené území snižuje celkovou cenu dohody a činí naše další požadavky přijatelnějšími." # todo: CHANGED
 CPD_make_puppet_button_TT: "[CPD_MAKE_PUPPET_TT_LOC]" # todo: NEW TRANSLATION
 CPD_make_puppet_button_TT_DELAYED: "[CPD_MAKE_PUPPET_TT_DELAYED_LOC]" # todo: NEW TRANSLATION
 CPD_make_puppet_button_TT_DEMAND: "Vytvořit loutkovou vládu" # todo: NEW TRANSLATION
 CPD_make_puppet_button_TT_CONCESSION: "Přenechat loutkovou vládu" # todo: NEW TRANSLATION
 CPD_make_puppet_button_TT_DELAYED_DEMAND: "Požadavek na §Yloutkovou vládu§! vytvoří z vybraného nepřátelského území nový podřízený stát. Nová loutka převezme kulturu svého mateřského státu, ale v zahraniční politice bude podřízena nám. Pokud již vlastníme podřízený stát s nároky na mateřský národ, tyto státy se připojí k němu namísto vytvoření nového." # todo: CHANGED
 CPD_make_puppet_button_TT_DELAYED_CONCESSION: "Postoupení §Yloutkové vlády§! umožní nepříteli vytvořit podřízený stát z území, která v současnosti držíme. Nová loutková vláda se mu bude zodpovídat." # todo: CHANGED
 CPD_demilitarise_state_button_TT: "[CPD_DEMILITARISE_TT_LOC]" # todo: NEW TRANSLATION
 CPD_demilitarise_state_button_TT_DELAYED: "[CPD_DEMILITARISE_TT_DELAYED_LOC]" # todo: NEW TRANSLATION
 CPD_demilitarise_state_button_TT_DEMAND: "Požadovat demilitarizaci států" # todo: NEW TRANSLATION
 CPD_demilitarise_state_button_TT_CONCESSION: "Navrhnout demilitarizaci států" # todo: NEW TRANSLATION
 CPD_demilitarise_state_button_TT__DELAYED_DEMAND: "Požadavek na §Ydemilitarizaci§! promění vybrané nepřátelské státy v zóny, v nichž nesmí působit žádná armáda. Jejich vlastník tam nebude moci rozmístit jednotky ani budovat opevnění." # todo: CHANGED
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION: "Postoupení §Ydemilitarizace§! uvalí stejná omezení na naše vlastní státy. V postoupených územích nebudeme moci přesouvat ani rozmísťovat síly." # todo: CHANGED
 CPD_liberate_in_state_button_TT: "[CPD_LIBERATE_TT_LOC]" # todo: NEW TRANSLATION
 CPD_liberate_in_state_button_TT_DELAYED: "[CPD_LIBERATE_TT_DELAYED_LOC]" # todo: NEW TRANSLATION
 CPD_liberate_in_state_button_TT_DEMAND: "Osvobodit státy" # todo: NEW TRANSLATION
 CPD_liberate_in_state_button_TT_CONCESSION: "Udělit nezávislost" # todo: NEW TRANSLATION
 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "Požadavek na §Yosvobození§! vrátí vybrané státy národu, který si na ně oprávněně činí nárok. Stále existujícímu držiteli jádra bude území předáno přímo; dávno zaniklý držitel bude oživen, aby je obdržel. Pokud již žádný držitel jádra nezůstal, bude z toho, co zbývá současnému vlastníkovi, vytvořen nový odštěpenecký stát." # todo: NEW TRANSLATION
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "Přiznání §Ynezávislosti§! uvolní vybrané státy, které držíme, jejich oprávněnému nárokovateli, ať už tento národ stále existuje, nebo musí být obnoven z historie." # todo: NEW TRANSLATION
