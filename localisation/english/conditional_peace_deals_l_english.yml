 CPD_demanding_annexation_of_state_TT: "Anektace tohoto státu je §Gpožadavkem§! od [ROOT.GetNameWithFlag]. Pokud bude mírová dohoda přijata, tento stát bude anektován do naší země a my se staneme jeho novým vlastníkem." # todo: NEW TRANSLATION
 CPD_demanding_puppeting_in_state_TT: "Zřízení loutkové vlády v tomto státě je §Gpožadavkem§! od [ROOT.GetNameWithFlag]. Pokud bude dohoda přijata, tento stát bude umístěn pod kontrolu nové loutkové vlády." # todo: NEW TRANSLATION
 CPD_demanding_demilitarisation_of_state_TT: "Demilitarizace tohoto státu je §Gpožadavkem§! [ROOT.GetNameWithFlag]. Pokud bude mír přijat, tento stát již nebude moci provozovat žádné vojenské síly." # todo: CHANGED
