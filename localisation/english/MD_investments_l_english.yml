 state_based_investments_screen_delayed_tt: "Níže uvedená nabídka obsahuje rozhodnutí, která můžete učinit za účelem podpory různých typů rozvoje v rámci [THIS.GetName]. Kliknutím pravým tlačítkem na tlačítko investice ji vyberete k automatickému opakování. V nastavení automatizace povolte §YOpakovat vybrané interní investice§!, aby se vybrané investice zpracovávaly.\n\nVšechny národy budou mít k dispozici minimálně dva sloty, které mohou využít pro kterýkoli ze svých států v rámci celé země. Můžete se rozhodnout provést více projektů v jednom státě, nebo projekty rozdělit po celé zemi. Další sloty můžete získat zvýšením §Yhodnocení moci§! svého národa.\n\nSloty podle hodnocení moci:\n- §YSupervelmoc§!: 6\n- §YVelmoc§!: 5\n- §YHlavní mocnost§!: 4\n- §YRegionální mocnost§!: 3\n" # todo: CHANGED
