 investments_build_button_tt: "[investments_get_build_button_tt]" # todo: NEW TRANSLATION
 investments_build_button_tt_1: "Investice do stavebních projektů zvýší váš vliv v cílové zemi a zajistí vaší zemi investiční příjem.\n\n§YÚroveň korupce země i úroveň infrastruktury státu ovlivní celkovou dobu výstavby. Výstavba má ve výchozím nastavení o 35 % delší dobu bez ohledu na modifikátory.§!\n\n§LPokud cílová země vaši investiční nabídku přijme, na konci výstavby získá budovu.§!\nAI bude investice odmítat, pokud má problémy s ekonomikou nebo je její domácí vliv příliš nízký.\nPo zrušení projektu ve státě také musíme 3 dny počkat, než do něj znovu investujeme.\n\n[investments_gain_tooltip]" # todo: NEW TRANSLATION
 investments_build_button_tt_delayed: "§YPředpoklady§!:\n[!invest_button_click_enabled]\n§YÚčinky§!:\n[!invest_button_click]" # todo: NEW TRANSLATION
 investments_14_cooldown_tt: "Pokud to země přijme, po přijetí začne běžet §Y14denní§! časovač. Během této doby nezískáte žádný další vliv bez ohledu na to, kolik peněz do tohoto národa vložíte." # todo: NEW TRANSLATION
 investments_30_cooldown_tt: "Pokud to země přijme, po přijetí začne běžet §Y30denní§! časovač. Během této doby nezískáte žádný další vliv bez ohledu na to, kolik peněz do tohoto národa vložíte." # todo: NEW TRANSLATION
 investments_build_button_tt_2: "Zrušit aktivní projekt (V tomto státě můžete provést pouze jednu investici denně)." # todo: NEW TRANSLATION
 investments_build_button_tt_b: "Stisknutím tohoto tlačítka požádáte správce státu o povolení. Pokud žádost přijme, na kartě rozhodnutí se objeví stavební projekt. Tento projekt se bude opakovat, dokud nebudou dokončeny všechny budovy ve frontě.\n\n§YRychlost výstavby má postih -25 % oproti běžné hodnotě (uplatní se modifikátory rychlosti výstavby vaší země).§!\n\n§LV jednu chvíli můžete mít pouze jeden aktivní stavební projekt.\n\nStát nemůže mít aktivní stavební projekt od více zemí.\n\nSprávce tohoto státu žádost odmítne, pokud k vám má negativní vztah.§!" # todo: NEW TRANSLATION
