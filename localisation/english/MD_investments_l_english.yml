 investments_construction_NUCLEAR_REACTOR: "§YJaderný reaktor§!\nBudova jaderného reaktoru přeměňuje jadernou energii na elektrickou a při tom spotřebovává středně obohacený uran.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^13|3]§! miliard" # todo: NEW TRANSLATION
