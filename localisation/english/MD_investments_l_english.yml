 investments_construction_CIC: "§YCivilní průmysl§!\nTato budova poskytuje státu průmysl pro výrobu civilního zboží nebo výstavbu nových budov. V případě potřeby ji lze přeměnit na vojenský průmysl.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^1|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_CIC_delayed: "§YPředpoklady§!:\n[!select_civ_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_MIC: "§Vojenský průmysl§!\nTato budova poskytuje státu průmysl pro výrobu nového vojenského vybavení. V případě potřeby ji lze přeměnit na civilní průmysl.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^2|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_MIC_delayed: "§YPředpoklady§!:\n[!select_mil_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_NIC: "§YLoděnice§!\nTato budova poskytuje státu průmysl pro stavbu nových lodí.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^3|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_NIC_delayed: "§YPředpoklady§!:\n[!select_dockyard_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_INF: "§YInfrastruktura§!\nTato budova zlepšuje infrastrukturu státu. Zvyšuje zásobovací kapacitu ve strategických regionech a rychlost vašich divizí a zároveň zvyšuje těžbu surovin.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^4|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_INF_delayed: "§YPředpoklady§!:\n[!select_infrastructure_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_offices: "§YKancelářský sektor§!\nKancelářský sektor představuje všechna ostatní odvětví hospodářství mimo těžký průmysl a těžbu. Zahrnuje finančnictví, spotřebitelské služby, informační technologie, maloobchod a mnoho dalšího.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^5|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_offices_delayed: "§YPředpoklady§!:\n[!select_office_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_AA: "§YStanoviště PVO krátkého dosahu§!\n§YStanoviště PVO krátkého dosahu§! jsou komplexy a skupiny protiletadlových zbraní a prostředků, které zajišťují protivzdušnou obranu proti vzdušným hrozbám v malé výšce. Tato stanoviště společně rozdělují vzdušný prostor na bránitelné oblasti a poskytují místní vojenské cíle a krytí infrastruktury před hrozbami od vrtulníků přes nízko letící letadla až po proudové stíhačky.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^6|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_AA_delayed: "§YPředpoklady§!:\n[!select_antyair_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_RAD: "§YRadarová stanice§!\nRadarové stanice vám umožňují získávat informace o nepřátelských jednotkách v okolních státech. Skládají se z různých radarů a senzorů, zpravodajských prostředků a kapacit pro analýzu vyvíjející se situace.\nVyšší úroveň zvýší jejich účinný dosah.\nJejí radary také poskytují státu lepší detekci nepřátelských vzdušných sil, čímž vašim letadlům dávají větší šanci je napadnout.\nRadary navíc zvyšují detekci nepřátelských flotil na moři.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^7|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_RAD_delayed: "§YPředpoklady§!:\n[!select_radar_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_AIR: "§YLetecká základna§!\nTato budova poskytuje státu základnu pro nasazení vašich vzdušných sil.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^8|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_AIR_delayed: "§YPředpoklady§!:\n[!select_airbase_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_fuel_silo: "§YStrategické zásoby zdrojů§!\nTato budova poskytuje vašemu národu více prostoru pro skladování §Hpaliva§!.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^9|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_fuel_silo_delayed: "§YPředpoklady§!:\n[!select_strategic_resource_reserve_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_internet_station: "§YSíťová infrastruktura§!\nSíťová infrastruktura sestává z vysokých konstrukcí používaných v telekomunikacích a rádiové komunikaci k přenosu signálů na velké vzdálenosti, podzemních optických kabelů a systémů cloud computingu.\n\nKaždá úroveň §Ysítěové infrastruktury§! zvyšuje rychlost růstu místní produktivity o §G+5,00 %§!.\nKaždá úroveň §Ysíťové infrastruktury§! zkracuje trvání §Ymezinárodních investic§! o §G-5,00 %§!.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^10|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_internet_station_delayed: "§YPředpoklady§!:\n[!select_internet_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_REF: "§YInfrastruktura obnovitelné energie§!\nInfrastruktura obnovitelné energie zahrnuje všechny obnovitelné zdroje energie. Patří sem mimo jiné solární parky, větrné turbíny, rafinerie biopaliv, uhelné provozy, elektrárny na biopaliva a další. Využívá obnovitelné zdroje a vyrábí z nich palivo.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^11|3]§! miliard" # todo: NEW TRANSLATION
 investments_construction_REF_delayed: "§YPředpoklady§!:\n[!select_renewable_power_plant_button_click_enabled]" # todo: NEW TRANSLATION
 investments_construction_POWER_PLANT: "§YElektrárna na fosilní paliva§!\nElektrárna na fosilní paliva zahrnuje všechny termoelektrické zdroje energie založené na fosilních palivech. Patří sem mimo jiné uhlí, zemní plyn a ropa.\n\n§YZákladní náklady za budovu:§! §R$[?global.build_cost_array^12|3]§! miliard" # todo: NEW TRANSLATION
