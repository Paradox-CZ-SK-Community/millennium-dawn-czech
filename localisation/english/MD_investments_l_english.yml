 internal_investment_slot_number: "§YSlot interní investice§!" # todo: NEW TRANSLATION
 investments_event.1.t: "Investiční nabídka od [FROM.GetNameWithFlag]" # todo: NEW TRANSLATION
 investments_event.1.d: "[FROM.GetName] navrhuje postavit [?pending_offer_amount]x [investments_get_pending_offer_construction_type] ve státě [?pending_offer_state.GetName].\n\nCelkové náklady projektu se odhadují na $$[?pending_offer_total_cost] miliard. Dokončení projektu potrvá odhadem [?pending_offer_duration] dní. [FROM.GetName] nám nabízí dohodu, podle níž bychom přispěli 10 % z celkové stavební částky. [FROM.GetNameWithFlag] tímto projektem potenciálně získá vliv. [FROM.GetNameWithFlag] bude z tohoto projektu profitovat.\n\n\nDny do dokončení: [?pending_offer_duration]\nCelkové náklady projektu ([FROM.GetNameWithFlag]): $$[?pending_offer_total_cost] miliard\nTyp budovy: [investments_get_pending_offer_construction_type]\nNáklady příjemce ([THIS.GetNameWithFlag]): $$[?investor_cost]\nMísto: [?pending_offer_state.GetName]" # todo: NEW TRANSLATION
 investments_event.1.o1: "Přijmout nabídku" # todo: NEW TRANSLATION
 investments_event.1.o2: "Odmítnout nabídku" # todo: NEW TRANSLATION
 investments_event.2.t: "Povolení stavby odmítnuto" # todo: NEW TRANSLATION
 investments_event.2.d: "Obdrželi jsme odmítnutí od našeho potenciálního nového investičního partnera. Je neuvěřitelné, že by odmítli náš projekt! Vždyť bychom přece získali nějaký vliv či kontrolu nad jejich vládou tím, že bychom pomohli rozvíjet jejich země! Nu což, investiční dohoda s [FROM.GetName] ve státě [?ROOT.investments_state_target.GetName] ztroskotala, takže bychom mohli nabídnout investiční dohodu někomu jinému." # todo: NEW TRANSLATION
 investments_event.2.o1: "Možná jejich sousedovi…" # todo: NEW TRANSLATION
 investments_event.3.t: "Stavební projekt zrušen" # todo: NEW TRANSLATION
 investments_event.3.d: "Bohužel se nám nepodařilo dokončit investiční dohodu s našimi přáteli ve státě [FROM.GetName]. Může to mít mnoho důvodů, například vztahy s vládou, nedostatek finančních prostředků nebo prostý nezájem místních obyvatel. Vždy to můžeme zkusit jindy." # todo: NEW TRANSLATION
 investments_event.3.o1: "Jejich škoda!" # todo: NEW TRANSLATION
 investments_build_cost_tt: "§YNáklady zahraniční investice§!\n\n§YNáklady zahraniční investice§! §gzahrnují počáteční náklady projektu, který zvažujeme zahájit. Po přijetí projektu jsou odečteny přímo z pokladny našeho národa a přidány k našim§! §Ymezinárodním investicím§!§!.\n\n§gPokud jste právě klikli na jinou zemi nebo stát, nezapomeňte zvýšit počet budov nebo kliknout na jinou budovu, aby se nápověda aktualizovala a zobrazila skutečné náklady.§!\n\n§gKorupce, národní duchové a další faktory mohou ovlivnit náklady investičního projektu. Korupce země příjemce zvýší náklady projektu podle její úrovně korupce.§!\n" # todo: NEW TRANSLATION
