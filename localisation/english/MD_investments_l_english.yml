 state_owned_local_renewable_capacity_modifier_desc: "Po sérii cílených investic do místní infrastruktury obnovitelné energie nyní stát vyrábí více energie z obnovitelných zdrojů." # todo: NEW TRANSLATION
 state_owned_encouraged_productivity: "Podpora místní produktivity" # todo: NEW TRANSLATION
 state_owned_encouraged_productivity_desc: "Po sérii cílených investic do místní ekonomiky se produktivita státu měsíc po měsíci zvyšuje." # todo: NEW TRANSLATION
 state_owned_local_infrastructure_modifier: "Rozšiřování místní infrastruktury" # todo: NEW TRANSLATION
 state_owned_local_infrastructure_modifier_desc: "Rozšiřování místní infrastruktury ve státě vedlo k řadě krátkodobých projektů, které podstatně zlepšují místní infrastrukturu." # todo: NEW TRANSLATION
 state_owned_local_military_infrastructure_modifier: "Rozšiřování místní vojenské infrastruktury" # todo: NEW TRANSLATION
 state_owned_local_military_infrastructure_modifier_desc: "Po významných investicích do místních vojenských zařízení a modernizace infrastruktury jsou vojenská zařízení v tomto regionu nyní plně modernizována. Vojenské výrobní kapacity státu byly výrazně posíleny." # todo: CHANGED
 state_owned_local_energy_infrastructure_modifier: "Rozšiřování místní energetické infrastruktury" # todo: NEW TRANSLATION
 state_owned_local_energy_infrastructure_modifier_desc: "Cílené investice do místní energetické sítě vedly ke komplexní modernizaci infrastruktury výroby a distribuce energie v tomto státě. Stát nyní disponuje zlepšenými kapacitami výroby energie ve všech energetických odvětvích." # todo: CHANGED
 state_owned_build_forward_logistics_base_modifier: "Postav Frontovou logistickou základnu" # todo: NEW TRANSLATION
 state_owned_build_forward_logistics_base_modifier_desc: "V celém státě byly zřízeny strategické logistické základny, čímž vznikla síť zásobování v předsunutých pozicích. Tato zařízení výrazně zlepšují přesun vojsk a materiálu regionem a snižují celkovou spotřebu zásob." # todo: CHANGED
 state_owned_improve_rebuilding_efforts_modifier: "Vylepšené snahy o obnovu" # todo: NEW TRANSLATION
 state_owned_improve_rebuilding_efforts_modifier_desc: "Úsilí o obnovu si získalo místní obyvatelstvo, zlepšilo spolupráci veřejnosti a snížilo občanské nepokoje. Investice do místní infrastruktury a projektů obnovy komunit zvýšily míru poslušnosti místního obyvatelstva." # todo: CHANGED
 state_owned_hire_extra_primary_sector_workers_modifier: "Najmout další pracovníky primárního sektoru" # todo: NEW TRANSLATION
 state_owned_hire_extra_primary_sector_workers_modifier_desc: "Pracovní síla v primárním sektoru státu byla rozšířena díky cíleným náborovým a školicím programům. Zemědělství, těžba a další činnosti spojené s těžbou zdrojů nyní těží z větší dostupnosti pracovní síly, což vede k vyšší produkci zdrojů." # todo: CHANGED
 state_owned_local_naval_infrastructure_modifier: "Rozšiřování místní námořní infrastruktury" # todo: NEW TRANSLATION
 state_owned_local_naval_infrastructure_modifier_desc: "Investice do pobřežní obrany a námořní infrastruktury proměnily námořní schopnosti státu. Nová námořní zařízení a zásobovací uzly nyní poskytují komplexní podporu námořním operacím v regionu." # todo: NEW TRANSLATION
 state_owned_local_fortification_efforts_modifier: "Místní opevňovací práce" # todo: NEW TRANSLATION
 state_owned_local_fortification_efforts_modifier_desc: "Po celém státě byla vybudována rozsáhlá obranná díla včetně bunkrů, pobřežního opevnění a sítí pevností. Tato vojenská zařízení výrazně zvyšují obranné schopnosti státu proti invazi a pozemním útokům." # todo: NEW TRANSLATION
