 available_internal_investments_tt: "Všechny národy budou mít k dispozici minimálně dva sloty, které mohou využít pro kterýkoli ze svých států v rámci celé země. Můžete se rozhodnout provést více projektů v jednom státě, nebo projekty rozdělit po celé zemi. Další sloty můžete získat zvýšením §Yhodnocení moci§! svého národa.\n\nProbíhající projekty:\n[ROOT.soi_timer_6][ROOT.soi_timer_5][ROOT.soi_timer_4][ROOT.soi_timer_3][ROOT.soi_timer_2][ROOT.soi_timer_1]" # todo: CHANGED
