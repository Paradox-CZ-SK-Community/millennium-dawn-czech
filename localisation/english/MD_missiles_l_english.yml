 OLV_LAUNCH_BUTTON_TT_trigger_3: "§YPočet startů§! > 0"
 OLV_LAUNCH_BUTTON_TT_DELAYED: "§YLetecký program§! je zrušen, pokud vybrané užitečné zatížení není dostupné."
 CLEAR_PAYLOAD_BUTTON: "Vymazat náklad"
 SPACE_AUTO_TITLE: "§YAutomatizace programu§!" # todo: NEW TRANSLATION
 SPACE_AUTO_TITLE_TT: "Provozuje váš vesmírný program bez mikromanagementu: každý týden objedná satelity a nosné rakety podle zvoleného plánu a vypustí je, jakmile zásoby stačí na jednu rotaci.\n\nVždy vyrábí §Ynejnovější vámi vyzkoumanou generaci§!, nikdy starší, a sám se zastaví, jakmile souhvězdí dosáhne maximální kapacity.\n\n§YÚdaje na tomto panelu se přepočítávají každý měsíc§! a také při každém opětovném otevření této záložky – pokud tedy údaj po dokončení technologie vypadá zastarale, přepněte na jinou záložku a zpět.\n\n§RKILLSATy nejsou automatizovány§! – jde o orbitální zbraně, nikoli o souhvězdí zajišťující pokrytí, takže není třeba naplňovat žádný kapacitní cíl." # todo: NEW TRANSLATION
 SPACE_AUTO_STATUS: "[space_auto_status_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_STATUS_TT: "§YNeaktivní§! – automatizace je vypnutá.\n§YAktivní§! – objednávání a vypouštění; údaj představuje aktuální týdenní platbu.\n§YČeká§! – výroba zatím nedodala dostatek kusů pro celý let.\n§YNa kapacitě§! – všechna souhvězdí v plánu jsou plná; čeká se na výzkum nové generace.\n§YZastaveno§! – žádný náklad v plánu se nevejde do nosné rakety.\n§YPozastaveno§! – státní pokladna nepokryje další sérii; snižte rotaci nebo povolte deficitní financování.\n§YUkončeno§! – státní pokladna je prázdná a deficitní financování je vypnuté.\n\nTento stav se přepočítává každý měsíc a při každém opětovném otevření této záložky." # todo: NEW TRANSLATION
 SPACE_AUTO_TOGGLE_TT: "[!space_auto_toggle_button_click_enabled]Zapnout nebo vypnout automatizaci." # todo: NEW TRANSLATION
 SPACE_AUTO_TOGGLE_TT_DELAYED: "Vypnutí zastaví pouze nové objednávky. Série, které se již vyrábějí, budou dokončeny a jejich platby budou pokračovat až do dodání, takže nic, za co jste zaplatili, se neztratí.\n\nPo opětovném zapnutí se program obnoví podle aktuálního stavu vašich souhvězdí." # todo: NEW TRANSLATION
 SPACE_AUTO_PRESET: "§gPlán:§! [space_auto_preset_name_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_PRESET_DESC: "[space_auto_preset_desc_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_PRESET_TT: "Které satelity bude automatizace vyrábět. Ruční návrh není nutný – každý plán sám vybere nejnovější vámi vyzkoumanou generaci.\n\n§YAutomatický§! nejprve obnovuje nejzastaralejší síť a poté přejde k další, jakmile je první plná.\n§YZaměřený§! plán věnuje všechny sloty jedné rodině.\n§YKombinovaný§! a §YVyvážený§! plán rozdělí manifest a předává sloty rodině, která nejvíce zaostává, zatímco ostatní se zaplňují.\n§YVlastní§! vyšle manifest, který jste připravili výše a uložili." # todo: NEW TRANSLATION
 SPACE_AUTO_PRESET_NEXT_TT: "Další plán" # todo: NEW TRANSLATION
 SPACE_AUTO_PRESET_PREV_TT: "Předchozí plán" # todo: NEW TRANSLATION
 space_auto_preset_0: "§YAutomatický§!" # todo: NEW TRANSLATION
 space_auto_preset_1: "§YZaměření na GNSS§!" # todo: NEW TRANSLATION
 space_auto_preset_2: "§YZaměření na COMSAT§!" # todo: NEW TRANSLATION
 space_auto_preset_3: "§YZaměření na SPYSAT§!" # todo: NEW TRANSLATION
 space_auto_preset_4: "§YGNSS + COMSAT§!" # todo: NEW TRANSLATION
 space_auto_preset_5: "§YGNSS + SPYSAT§!" # todo: NEW TRANSLATION
 space_auto_preset_6: "§YCOMSAT + SPYSAT§!" # todo: NEW TRANSLATION
 space_auto_preset_7: "§YVyvážený§!" # todo: NEW TRANSLATION
 space_auto_preset_8: "§YVlastní§!" # todo: NEW TRANSLATION
 space_auto_preset_0_desc: "Obnovuje nejzastaralejší síť a poté přejde k další. Momentálně není třeba nic vyrábět." # todo: NEW TRANSLATION
 space_auto_preset_0_desc_gnss: "Nejprve se obnovuje nejzastaralejší síť: v současnosti §GGNSS§!. Po dosažení kapacity automaticky pokračuje dál." # todo: NEW TRANSLATION
 space_auto_preset_0_desc_com: "Nejprve se obnovuje nejzastaralejší síť: v současnosti §GCOMSAT§!. Po dosažení kapacity automaticky pokračuje dál." # todo: NEW TRANSLATION
 space_auto_preset_0_desc_spy: "Nejprve se obnovuje nejzastaralejší síť: v současnosti §GSPYSAT§!. Po dosažení kapacity automaticky pokračuje dál." # todo: NEW TRANSLATION
 space_auto_preset_1_desc: "Všechny čtyři sloty GNSS. Rychlost armády, přesnost leteckých a námořních úderů, rychlost výstavby a těžba surovin." # todo: NEW TRANSLATION
 space_auto_preset_2_desc: "Všechny čtyři sloty COMSAT. Velitelská síla, organizace armády, rychlost plánování, politická síla a zpravodajské operace." # todo: NEW TRANSLATION
 space_auto_preset_3_desc: "Všechny čtyři sloty SPYSAT. Limit plánování, průzkum, odhalování, efektivita konvojů, rychlost výzkumu a zpravodajské pokrytí." # todo: NEW TRANSLATION
 space_auto_preset_4_desc: "Dva GNSS a dva COMSAT na jeden let. Zaměřování a výstavba spolu s velením a řízením." # todo: NEW TRANSLATION
 space_auto_preset_5_desc: "Dva GNSS a dva SPYSAT na jeden let. Zaměřování a výstavba spolu s průzkumem a výzkumem." # todo: NEW TRANSLATION
 space_auto_preset_6_desc: "Dva COMSAT a dva SPYSAT na jeden let. Velení a řízení spolu s průzkumem a zpravodajstvím." # todo: NEW TRANSLATION
 space_auto_preset_7_desc: "Dva GNSS, jeden COMSAT a jeden SPYSAT. GNSS má dvojnásobnou váhu, protože je nejlevnější a nejlehčí na vynesení." # todo: NEW TRANSLATION
 space_auto_preset_8_desc: "Vysílá manifest připravený a uložený na obrazovce vypouštění. Náklady se každý týden stále vylepšují na nejnovější generaci." # todo: NEW TRANSLATION
 SPACE_AUTO_ROTATION: "§gRotace:§! [?var_space_auto_flights|C0]" # todo: NEW TRANSLATION
 SPACE_AUTO_ROTATION_TT: "Počet vypuštěných letů v jedné rotaci. Každý let nese jednu nosnou raketu a celý manifest nákladu.\n\nRotace se uskuteční až tehdy, když zásoby obsahují kompletní sadu pro každý let, takže skutečný počet může být během dohánění výroby nižší.\n\nToto je ovladač vašich výdajů. Jedna rotace této velikosti stojí přibližně §Y$[?var_space_auto_est_cost|C1] mld.§!, rozložených do týdenních plateb po dobu výroby.\n\n§YZměny se projeví okamžitě§! – automatizaci není nutné vypínat a zapínat. Nic, co se již vyrábí, se nepřecení; nová velikost se účtuje až po objednání další série." # todo: NEW TRANSLATION
 SPACE_AUTO_ROTATION_PLUS_TT: "O jeden let více na rotaci (maximum 10)" # todo: NEW TRANSLATION
 SPACE_AUTO_ROTATION_MINUS_TT: "O jeden let méně na rotaci (minimum 1)" # todo: NEW TRANSLATION
 SPACE_AUTO_BUDGET: "§gTýdně:§! $[?space_prod_expense|C1] mld." # todo: NEW TRANSLATION
 SPACE_AUTO_FUNDS: "[space_auto_funds_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_FUNDS_TT: "Prostředky, které má automatizace ještě k dispozici: vaše státní pokladna minus částky, které stále dluží rozpracované série.\n\nSérie začne teprve tehdy, když to pokryje její celou cenu. Nejde o týdenní údaj – týdenní platba je zobrazena vlevo." # todo: NEW TRANSLATION
 SPACE_AUTO_BUDGET_TT: "Kolik vaše probíhající výroba účtuje každý týden a s jakými prostředky může automatizace pracovat.\n\nSérie začne pouze tehdy, když §Ystátní pokladna pokryje její celou cenu§!. Po zahájení se splácí týdně po dobu výroby, nikoli jednorázově – to platí i pro ručně zadané objednávky.\n\nCelá rotace v aktuální velikosti stojí přibližně §Y$[?var_space_auto_est_cost|C1] mld.§!. Změna rotace nikdy neovlivní to, co se již vyrábí: série si ponechají velikost a cenu, za které byly objednány, a nová hodnota se účtuje až po zadání další série.\n\nPři zapnutém §Ydeficitním financování§! se kontrola pokladny zcela přeskočí a objednávky pokračují na úvěr." # todo: NEW TRANSLATION
 SPACE_AUTO_SAVE_BUTTON: "Uložit vlastní" # todo: NEW TRANSLATION
 SPACE_AUTO_SAVE_BUTTON_TT: "[!space_auto_save_button_click_enabled]Uložit výše připravený manifest nákladu jako plán §YVlastní§! a přepnout na něj." # todo: NEW TRANSLATION
 SPACE_AUTO_SAVE_TT_trigger_2: "Výše je naložen alespoň jeden §Ynáklad§!" # todo: NEW TRANSLATION
 SPACE_AUTO_SAVE_BUTTON_TT_DELAYED: "Ukládají se pouze sloty nákladu. Nosná raketa je vždy nejnovější vámi vyzkoumaná, takže ji není třeba vybírat." # todo: NEW TRANSLATION
 SPACE_AUTO_UPGRADE_BUTTON: "Vylepšit nyní" # todo: NEW TRANSLATION
 SPACE_AUTO_UPGRADE_BUTTON_TT: "[!space_auto_upgrade_button_click_enabled]Povýšit každé souhvězdí na nejnovější vámi vyzkoumanou generaci, pokud to již obíhající satelity umožňují bez ztráty pokrytí." # todo: NEW TRANSLATION
 SPACE_AUTO_UPGRADE_BUTTON_TT_DELAYED: "Žádný mechanismus sám od sebe souhvězdí nepovýší – může se pouze zhoršovat, takže bez této funkce budou vaše novější satelity na oběžné dráze k ničemu.\n\nAutomatizace to provádí po každém vypuštění; toto tlačítko slouží pro případy, kdy vypouštíte ručně." # todo: NEW TRANSLATION
 SPACE_AUTO_MANIFEST: "[space_auto_manifest_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_MANIFEST_TT: "Nosná raketa a náklady, které nese jeden let v této rotaci.\n\nAutomatizace používá §Ynejstarší raketu v hangáru, která ještě dokáže vynést náklad§!, takže přebytečné starší stupně spotřebuje před novějšími. Nová výroba vždy vytváří nejnovější generaci, takže staré zásoby se postupně samy spotřebují.\n\nSloty souhvězdí, která jsou již plná, se předají rodině, které ještě něco chybí, a manifest se zmenší podle toho, co daná raketa dokáže vynést – proto může být počet nižší než čtyři sloty a proč starší raketa nese na jeden let méně satelitů." # todo: NEW TRANSLATION
 SPACE_AUTO_BUILDING: "[space_auto_building_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_BUILDING_TT: "Co se právě vyrábí. Jde o běžné výrobní série – zobrazují se také na záložce §YVýroba§! tohoto okna se zbývajícím časem a započítávají se do limitu jedné série na typ.\n\nNosné rakety se vyrábějí mnohem déle než satelity, takže první rotace po zapnutí může být vzdálena téměř celý rok." # todo: NEW TRANSLATION
 SPACE_AUTO_DEFICIT: "Deficitní financování" # todo: NEW TRANSLATION
 SPACE_AUTO_DEFICIT_TT: "Povolit objednávky bez ohledu na stav státní pokladny a vést náklady jako dluh.\n\nJe-li vypnuto, série začne pouze tehdy, pokud pokladna pokrývá její celou cenu, takže program nikdy neutratí peníze, které nemáte. Automatizace raději zůstane nečinná, než aby překročila možnosti.\n\n§RBlížící se bankrot ji vždy zastaví bez ohledu na toto nastavení§! – tuto pojistku nelze vypnout." # todo: NEW TRANSLATION
 SPACE_AUTO_DEFICIT_TT_DELAYED: "Toto přepínač umožňuje vesmírnému programu předběhnout ekonomiku, která jej financuje." # todo: NEW TRANSLATION
 SPACE_AUTO_STOCKPILE: "Výroba do zásoby" # todo: NEW TRANSLATION
 SPACE_AUTO_STOCKPILE_TT: "Vybudovat celý program předem namísto jedné rotace po druhé.\n\nNosné rakety se vyrábějí 240–440 dní oproti 80–260 dnům u satelitu, takže objednávání pouze toho, co potřebuje další rotace, nechává rampu čekat na rakety. Po zapnutí automatizace objedná všechny starty, které program bude potřebovat, a celou zbývající kapacitu souhvězdí v jedné sérii.\n\nStojí mnohem více týdně, ale kapacity dosáhne podstatně dříve a umožní vypouštění bez přestávek." # todo: NEW TRANSLATION
 SPACE_AUTO_STOCKPILE_TT_DELAYED: "Dobře se kombinuje s §Ydeficitním financováním§!: zásoba představuje to, co nakupuje váš rozpočet, a deficitní financování odstraňuje její horní limit." # todo: NEW TRANSLATION
 SPACE_AUTO_LATEST_OLV: "Pouze nejnovější OLV" # todo: NEW TRANSLATION
 SPACE_AUTO_LATEST_OLV_TT: "Používat pouze nejnovější nosnou raketu, kterou jste vyzkoumali.\n\nJe-li vypnuto, automatizace používá §Ynejstarší raketu v zásobách, která ještě dokáže vynést manifest§!, a zároveň objednává nejnovější generaci, takže starší stupně nezůstávají v hangáru. Starší raketa vynese méně, a proto tyto lety nesou menší manifest.\n\nJe-li zapnuto, starší stupně se zcela ignorují. Každý let nese celý manifest, ale program čeká na nové rakety, místo aby vypouštěl ty, které již má." # todo: NEW TRANSLATION
 SPACE_AUTO_LATEST_OLV_TT_DELAYED: "Zapněte, když jsou vaše zbývající stupně příliš malé na to, aby stály za slot pro start, a vypněte, když chcete raději vyprázdnit hangár než čekat.\n\n§RNáklady SPYSAT váží přesně tolik, kolik dokáže vynést odpovídající raketa§!. U plánu se špionážními satelity nemůže starší stupeň nikdy vynést nejnovější generaci, takže toto nastavení tam nic nemění." # todo: NEW TRANSLATION
 SPACE_AUTO_NET_GNSS: "[space_auto_net_gnss_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_NET_GNSS_TT: "§YNavigační satelity§! – rychlost armády, přesnost blízké letecké podpory a námořních úderů, strategické bombardování, určování polohy a šance na zásah námořních jednotek; dále rychlost výstavby a těžba surovin v civilní oblasti.\n\nNejlevnější a nejlehčí rodina pro vynesení na oběžnou dráhu." # todo: NEW TRANSLATION
 SPACE_AUTO_NET_COM: "[space_auto_net_com_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_NET_COM_TT: "§YKomunikační satelity§! – velitelská síla, organizace armády, rychlost plánování, letecký doprovod a zachytávání, námořní koordinace; dále politická síla, šifrování, získávání zpravodajské sítě a výsledky operací.\n\nÚčinnost závisí také na technologii pozemních přijímačů." # todo: NEW TRANSLATION
 SPACE_AUTO_NET_SPY: "[space_auto_net_spy_loc]" # todo: NEW TRANSLATION
 SPACE_AUTO_NET_SPY_TT: "§YPrůzkumné satelity§! – limit plánování, průzkum, snížení postihu počasí, odhalování a efektivita konvojů; dále rychlost výzkumu, zpravodajské pokrytí všech oblastí a potlačování odboje.\n\nPřebytečné satelity nad rámec souhvězdí lze přidělit špionážním misím." # todo: NEW TRANSLATION
