l_english:
 afghanistan_focus: "Afghánistán strom zaměření" # todo: NEW TRANSLATION
 AFG_civil_war_shortcut: "Občanská válka" # todo: NEW TRANSLATION
 AFG_panjshir_shortcut: "Pandžšír" # todo: NEW TRANSLATION
 AFG_foreign_policy_shortcut: "Zahraniční politika" # todo: NEW TRANSLATION
 AFG_government_shortcut: "Vláda" # todo: NEW TRANSLATION
 AFG_reconstruction_shortcut: "Obnova" # todo: NEW TRANSLATION
 AFG_national_policy_shortcut: "Národní politika" # todo: NEW TRANSLATION
 AFG_national_assembly: "Národní shromáždění" # todo: NEW TRANSLATION
 AFG_anjuman_pass: "Lev z Pandžšíru" # todo: NEW TRANSLATION
 AFG_law_of_faith: "Zákon víry" # todo: NEW TRANSLATION
 AFG_law_of_faith_idea: "Zákon víry" # todo: NEW TRANSLATION
 AFG_law_of_faith_idea_desc: "Náboženské právo je zapsáno v zákoníku. Duchovenstvo je spokojeno a venkov odpoví na výzvu do zbraně, politický prostor pro cokoli mimo konsenzus se však uzavřel." # todo: NEW TRANSLATION
 AFG_law_of_faith_desc: "Zákon víry bude v našem státě platit a posílí naše islámské zásady. Naši lidé budou vedeni naším islámským přesvědčením, aby náš stát zůstal čistý a spravedlivý." # todo: NEW TRANSLATION
 AFG_training_of_local_police_officers: "Výcvik místních policistů" # todo: NEW TRANSLATION
 AFG_training_of_local_police_officers_desc: "V rámci přípravy na budoucí osvobození a stabilizaci Afghánistánu musí Severní aliance vybudovat disciplinované a efektivní policejní síly. Ty budou klíčové pro udržení zákona a pořádku na územích, která hodláme znovu získat." # todo: NEW TRANSLATION
 AFG_heirs_o_the_mujahideen: "Dědicové mudžáhidů" # todo: NEW TRANSLATION
 AFG_heirs_o_the_mujahideen_desc: "Současné vedení, inspirované legendárními bojovníky minulosti, se snaží obnovit ducha a taktiku mudžáhidů." # todo: NEW TRANSLATION
 AFG_the_lions_guard: "Lví garda" # todo: NEW TRANSLATION
 AFG_the_lions_guard_desc: "V reakci na bezprostřední hrozbu vznikla nová zásahová jednotka, která má zabránit možným útokům na Ahmada Šáha Masúda." # todo: NEW TRANSLATION
 AFG_the_francesc_vendrell_talks: "Jednání Francesca Vendrella" # todo: NEW TRANSLATION
 AFG_the_francesc_vendrell_talks_desc: "V Dušanbe v Tádžikistánu vede zvláštní vyslanec OSN Francesc Vendrell mírová jednání s klíčovými afghánskými představiteli: velitelem Severní aliance Ahmedem Šáhem Masúdem, bývalým guvernérem Nangarháru Hadžím Abdulem Kádirem a bývalým členem Rabbáního vlády Sajjedem Husajnem Anwárím. Jednání se týkají problémů Muhammada Ásifa Mohseního." # todo: NEW TRANSLATION
 AFG_assault_on_mazar_i_sharif: "Útok na Mazáre Šaríf" # todo: NEW TRANSLATION
 AFG_assault_on_mazar_i_sharif_desc: "Důležité město Mazáre Šaríf musí být znovu dobyto a můžeme shromáždit naše muže a povzbudit je, aby toho dosáhli." # todo: NEW TRANSLATION
 AFG_massoud_s_mig_and_sukho: "Masúdův MiG a Suchoj" # todo: NEW TRANSLATION
 AFG_massoud_s_mig_and_sukho_desc: "Podpora Indie byla utajovaná. Indie již nějakou dobu pomáhá Masúdovi penězi, radarovým vybavením a součástkami letadel. Vyslala přibližně 30 techniků, kteří podle zpráv udržují Masúdovy stíhací letouny MiG a Suchoj. Indičtí vojenští poradci rovněž poskytli rady ohledně boje proti Tálibánu. Přestože není oficiálně přiznaná, indická pomoc se stala oporou Masúdových sil." # todo: NEW TRANSLATION
 AFG_russian_air_lift_idea: "Ruský letecký most" # todo: NEW TRANSLATION
 AFG_russian_air_lift_idea_desc: "Z Ruska přicházejí letecky zbraně a náhradní díly sovětského typu. Naše posádky toto vybavení již znají, takže se levně dostává na frontu bez nutnosti přeškolení." # todo: NEW TRANSLATION
 AFG_russian_air_lift: "Ruský letecký most" # todo: NEW TRANSLATION
 AFG_russian_air_lift_desc: "Rusko dlouhodobě udržuje tajné spojenectví se Severní aliancí a dodává zbraně a nezbytné zásoby na podporu zbytků naší vlády. Teprve včera ruský ministr obrany Sergej Ivanov oznámil, že naše milice vybaví osvědčenou technikou ze sovětské éry, kterou členové Severní aliance již znají." # todo: NEW TRANSLATION
 AFG_technical_specialists: "Techničtí specialisté" # todo: NEW TRANSLATION
 AFG_technical_specialists_desc: "Rusko plánuje nasadit technické specialisty, kteří pomohou v našich snahách poskytovat nezbytné plánování, logistickou podporu pro naše bojové plány a potřebné odborné znalosti pro výcvik a provoz vybavení." # todo: NEW TRANSLATION
 AFG_mil_mi_24_gunships: "Útočný vrtulník Mil Mi-24" # todo: NEW TRANSLATION
 AFG_mil_mi_24_gunships_desc: "Rusko oznámilo plány dodat nám 12 útočných vrtulníků Mil Mi-24, které poskytnou cennou podporu našemu postupu proti Tálibánu." # todo: NEW TRANSLATION
 AFG_cia_predator_surveillance_drones: "Průzkumné drony Predator CIA" # todo: NEW TRANSLATION
 AFG_cia_predator_surveillance_drones_idea: "Průzkumné drony Predator CIA" # todo: NEW TRANSLATION
 AFG_cia_predator_surveillance_drones_idea_desc: "Americké drony krouží nad průsmyky a předávají nám, co vidí. Poprvé plánujeme na základě skutečných zpravodajských informací a naše vlastní sítě rostou díky jejich podpoře." # todo: NEW TRANSLATION
 AFG_cia_predator_surveillance_drones_desc: "Průzkumné drony Predator CIA sehrály zásadní roli při poskytování rozsáhlého přehledu o terénu, určování klíčových míst a identifikaci nepřátelských cílů." # todo: NEW TRANSLATION
 AFG_appeal_to_washington_for_support: "Požádat Washington o podporu" # todo: NEW TRANSLATION
 AFG_appeal_to_washington_for_support_desc: "Tváří v tvář pokračujícímu konfliktu a hrozbě extremistických frakcí musí Afghánistán požádat mezinárodní spojence o podporu pro posílení svých vojenských schopností." # todo: NEW TRANSLATION
 AFG_imu_countermeasures: "Protiopatření proti IMU" # todo: NEW TRANSLATION
 AFG_imu_countermeasures_desc: "V boji proti této hrozbě žádá Afghánistán Uzbekistán o pomoc s provedením cílených leteckých úderů proti základnám IMU. Tato spolupráce má oslabit schopnosti IMU, narušit její operace a obnovit bezpečnost v pohraničních oblastech." # todo: NEW TRANSLATION
 AFG_shura_system: "Posílit systém šúry" # todo: NEW TRANSLATION
 AFG_shura_system_desc: "Posílení systému šúry v rámci Severní aliance je zásadní pro zachování jednoty a efektivní správu. Obnovením této tradiční struktury rozhodování založené na radě zajistíme zastoupení všech frakcí." # todo: NEW TRANSLATION
 AFG_anjuman_pass_desc: "Ahmad Šáh Masúd, známý také jako Lev z Pandžšíru, je symbolem odporu a taktického vedení. Semknutím kolem jeho myšlenek chce národ přijmout jeho strategie, inspirovat vojáky a upevnit svou obranu. Jeho zásady vedení Afghánistánem provázely a budou provázet zemi během současných zápasů." # todo: NEW TRANSLATION
 AFG_ghanis_plan: "Ghaniho plán" # todo: NEW TRANSLATION
 AFG_ghanis_plan_desc: "Ghani zahajuje plán na omezení podpory Tálibánu prostřednictvím cílených vojenských akcí a rozvojových projektů s cílem stabilizovat klíčové oblasti a obnovit kontrolu vlády." # todo: NEW TRANSLATION
 AFG_secretly_support_the_opium_industry: "Tajná podpora opiového průmyslu" # todo: NEW TRANSLATION
 AFG_secretly_support_the_opium_industry_desc: "Pod rouškou industrializace bude naše městská základna věřit, že směřujeme k nové éře modernizace. Nesmíme však odcizit základ národa, zemědělce. Tajně podpoříme obchod s opiem jako prostředek ke zlepšení naší hospodářské prosperity a k uspokojení všech částí afghánské společnosti." # todo: NEW TRANSLATION
 AFG_parliamentary_illusion: "Parlamentní iluze" # todo: NEW TRANSLATION
 AFG_parliamentary_illusion_idea: "Parlamentní iluze" # todo: NEW TRANSLATION
 AFG_parliamentary_illusion_idea_desc: "Komora zasedá, diskutuje a hlasuje, ale o ničem důležitém nerozhoduje. Její udržování nás stojí jen málo a zdání souhlasu má větší cenu než jeho skutečnost." # todo: NEW TRANSLATION
 AFG_parliamentary_illusion_desc: "K čemu vlastně parlament je? Má naše lidi uklidnit a přesvědčit je, že mají na svou vládu vliv. Demokratický proces nemůžeme zcela vyloučit, ale můžeme ho manipulovat tak, aby lépe sloužil našim vlastním potřebám." # todo: NEW TRANSLATION
 AFG_the_western_kleptocracy: "Západní kleptokracie" # todo: NEW TRANSLATION
 AFG_ashraf_ghani: "Ahmadzajové" # todo: NEW TRANSLATION
 AFG_ashraf_ghani_desc: "Ašraf Ghaní byl zvolen novým prezidentem Afghánistánu. S mandátem k reformám se snaží stabilizovat zemi a obnovit její instituce." # todo: NEW TRANSLATION
 AFG_endorse_the_american_candidate: "Podpořit amerického kandidáta" # todo: NEW TRANSLATION
 AFG_endorse_the_american_candidate_desc: "S blížícím se koncem přechodné vlády zůstává kontrola Hamída Karzáího nad vládou silná. Karzáí, jako kandidát vybraný Bonnskou dohodou, vytvořil široce založenou vládu zaměřenou na obnovu Afghánistánu a prosazování trvalého míru s našimi novými americkými spojenci." # todo: NEW TRANSLATION
 AFG_karzai_installed: "Karzáího vláda ustavena" # todo: NEW TRANSLATION
 AFG_political_path_chosen: "Politická cesta byla zvolena" # todo: NEW TRANSLATION
 AFG_the_new_chairman: "Nový předseda" # todo: NEW TRANSLATION
 AFG_the_new_chairman_desc: "Po skončení volebního cyklu musí hlava státu nejen uplatňovat kontrolu, ale také být tváří národa. Když je úřad zcela otevřený, musí Karzáí převzít velení a vést Afghánistán vlastním příkladem." # todo: NEW TRANSLATION
 AFG_aptta: "APTTA" # todo: NEW TRANSLATION
 AFG_aptta_desc: "Dohoda o tranzitním obchodu mezi Afghánistánem a Pákistánem, neboli APTTA, je dvoustranná obchodní dohoda mezi Pákistánem a Afghánistánem podepsaná za Karzáího vlády. Jejím cílem je podpořit obchod mezi oběma zeměmi, podpořit protiteroristické operace a přinést rozvoj do pohraničních oblastí." # todo: NEW TRANSLATION
 AFG_saarc_membership: "Členství v SAARC" # todo: NEW TRANSLATION
 AFG_saarc_membership_idea: "Členství v SAARC" # todo: NEW TRANSLATION
 AFG_saarc_membership_idea_desc: "Místo u jihoasijského stolu. Úvěry jsou levnější, daňová základna stabilnější a Kábul je vnímán spíše jako soused než jako problém." # todo: NEW TRANSLATION
 AFG_saarc_membership_desc: "Členství Afghánistánu v Jihoasijském sdružení pro regionální spolupráci, neboli SAARC, dokládá integraci země do regionálního hospodářského a politického rámce. Poskytuje také příležitost vymanit Afghánistán z bídy." # todo: NEW TRANSLATION
 AFG_rebuilding_the_state: "Obnova státu" # todo: NEW TRANSLATION
 AFG_rebuilding_the_state_desc: "Po pádu Tálibánu je jedním z hlavních cílů budování národa v Afghánistánu obnova státu od základů. Afghánistán, země s upadající ekonomikou a téměř bez zpevněných silnic či železnic, musí být nyní přebudován v zemi schopnou zaujmout své místo ve světovém řádu." # todo: NEW TRANSLATION
 AFG_drafting_the_constitution: "Sepsání ústavy" # todo: NEW TRANSLATION
 AFG_drafting_the_constitution_desc: "Podepsání ústavy představuje významný zlom pro stát, neboť pokládá na papír kroky zaručující lidská práva." # todo: NEW TRANSLATION
 AFG_national_solidarity_program: "Program národní solidarity" # todo: NEW TRANSLATION
 AFG_national_solidarity_program_desc: "Afghánský program národní solidarity, neboli NSP, byl vládní iniciativou zaměřenou na obnovu a rozvoj přibližně 5 000 vesnic v Afghánistánu s rozpočtem 900 milionů dolarů rozloženým do tří let. Jeho cílem bylo vytvořit místní demokraticky volené instituce a dohlížet na obnovu." # todo: NEW TRANSLATION
 AFG_symbolic_new_start: "Symbolický nový začátek" # todo: NEW TRANSLATION
 AFG_symbolic_new_start_desc: "Někteří by to označili za příležitost pro Afghánistán reorganizovat vládu a vstoupit do nové éry." # todo: NEW TRANSLATION
 AFG_cautious_approach: "Opatrný přístup" # todo: NEW TRANSLATION
 AFG_cautious_approach_desc: "Někteří věřili, že Afghánistán vstoupí do epochy rychlého růstu, následované rozsáhlými reformami, ale spíše zažil mírný růst a opatrnější přístup." # todo: NEW TRANSLATION
 AFG_reformist_path: "Reformní cesta" # todo: NEW TRANSLATION
 AFG_reformist_path_desc: "Reformní cesta má nahradit staré novým a není pro to lepší čas než nyní, kdy se Afghánistán stále nachází v raných fázích budování národa." # todo: NEW TRANSLATION
 AFG_next_in_line_of_succession: "Následník v pořadí" # todo: NEW TRANSLATION
 AFG_next_in_line_of_succession_desc: "S blížícím se koncem funkčního období Hamída Karzáího musí na jeho místo nastoupit nástupce." # todo: NEW TRANSLATION
 AFG_sway_local_warlords: "Získat místní vojevůdce" # todo: NEW TRANSLATION
 AFG_sway_local_warlords_desc: "Místní vojevůdci ovládají afghánské vedení od sovětské invaze a jejich odstranění nebude snadné. Místo toho bychom měli vytipovat klíčové silné muže a spolupracovat s nimi na posílení našeho postavení." # todo: NEW TRANSLATION
 AFG_the_islamic_republic: "Islámská republika" # todo: NEW TRANSLATION
 AFG_the_islamic_republic_desc: "S ústupem afghánského státu začíná pro republiku nový věk, který znamená nový začátek a novou podobu našeho národa." # todo: NEW TRANSLATION
 AFG_the_mujahideen: "Mudžáhidové" # todo: NEW TRANSLATION
 AFG_the_mujahideen_desc: "Mudžáhidové, neboli afghánští mudžáhidové, představují širokou koalici bývalých velitelů odboje a vojevůdců, z nichž mnozí podporovali někdejší Severní alianci. Měli bychom se soustředit na zachování současného stavu." # todo: NEW TRANSLATION
 AFG_age_of_republican_leadership: "Nová éra vedení" # todo: NEW TRANSLATION
 AFG_age_of_republican_leadership_desc: "Se vznikem islámské republiky bychom měli postupně nahradit staré velitele-vojevůdce novými důstojníky v nových národních obranných silách." # todo: NEW TRANSLATION
 AFG_islamic_democracy: "Islámská demokracie" # todo: NEW TRANSLATION
 AFG_islamic_democracy_desc: "Nová kapitola pokračuje, když islámská společnost přebírá vedení afghánského státu, snad i do budoucna. Nyní však není čas na odpočinek, protože zemí se potulují vojevůdci a gangsteři, kteří představují hrozbu spojenectvím s tálibánskými silami." # todo: NEW TRANSLATION
 AFG_reinforce_the_government: "Posílit vládu" # todo: NEW TRANSLATION
 AFG_reinforce_the_government_desc: "S novou kontrolou nad jižními oblastmi země věříme, že jde o dobrý začátek k potlačení opozice a uvedení našeho vedení do povědomí širší veřejnosti." # todo: NEW TRANSLATION
 AFG_agricultural_modernisation: "Modernizace zemědělství" # todo: NEW TRANSLATION
 AFG_agricultural_modernisation_desc: "Modernizace zavlažování, mechanizace a zemědělských postupů by zvýšila produkci v našich venkovských provinciích a poskytla státní pokladně nový zdroj příjmů ze zemědělského sektoru." # todo: NEW TRANSLATION
 AFG_the_farmer_and_their_rifle: "Zemědělec a jeho puška" # todo: NEW TRANSLATION
 AFG_the_farmer_and_their_rifle_desc: "Afghánští venkované, odhodlaní prolévat krev a drtit kosti na obranu své vlasti, prokázali, že jsou oporou státu. Ztráta podpory této komunity by byla prvním kamenem vedoucím k našemu pádu." # todo: NEW TRANSLATION
 AFG_inheritor_of_afghanistan: "Dědic Afghánistánu" # todo: NEW TRANSLATION
 AFG_inheritor_of_afghanistan_desc: "Afghánistán byl skutečně mírumilovný pouze pod naší vládou. Stali jsme se dědici afghánského státu a za tento úspěch bychom měli být chváleni, nikoli odmítáni světovými mocnostmi." # todo: NEW TRANSLATION
 AFG_second_man_of_the_state: "Druhý muž státu" # todo: NEW TRANSLATION
 AFG_second_man_of_the_state_desc: "Atta, bývalý velitel odboje, se začal výrazně zajímat o moc. Vybudoval si postavení významného vůdce Afghánistánu a nevyhýbal se rozsáhlým konfliktům s ostatními vojevůdci." # todo: NEW TRANSLATION
 AFG_dismantle_the_warlords: "Rozložit moc vojevůdců" # todo: NEW TRANSLATION
 AFG_dismantle_the_warlords_desc: "Některé oblasti země ovládají násilníci a gangsteři. Abychom se skutečně proměnili v moderní národní stát, musíme se s problémem vojevůdců vypořádat." # todo: NEW TRANSLATION
 AFG_a_tolerant_state: "Tolerantní stát" # todo: NEW TRANSLATION
 AFG_a_tolerant_state_desc: "Afghánistán je domovem mnoha různých lidí. Musíme dodržet svůj slib považovat každého Afghánce za součást jednoho celku a stát jednotně." # todo: NEW TRANSLATION
 AFG_naveen: "Naveen" # todo: NEW TRANSLATION
 AFG_naveen_desc: "Nová afghánská strana, neboli Naveen, je politická strana v Afghánistánu vedená Junusem Kánúním. Strana vznikla poté, co se Kánúní odklonil od Národního hnutí Afghánistánu vedeného Ahmadem Valím Masúdem. Junus Kánúní usiluje o pokračování odkazu Severní aliance." # todo: NEW TRANSLATION
 AFG_new_class_of_jam_iat_reformers: "Nová třída reformátorů Džamíat" # todo: NEW TRANSLATION
 AFG_new_class_of_jam_iat_reformers_desc: "Junus Kánúní představuje novou vlnu reformátorů Džamíat, kteří více přijímají islámské a tradiční hodnoty. Tato skupina má tendenci volit reformnější přístup a zaměřuje se spíše na postupné změny než na radikální přeměnu." # todo: NEW TRANSLATION
 AFG_counite_masouds_works: "Pokračovat v Masúdově díle" # todo: NEW TRANSLATION
 AFG_counite_masouds_works_desc: "Po porážce Severní aliance a konci Masúdova vedení zůstáváme odhodláni zachovat jejího ducha, zatímco usilujeme o vybudování moderního Afghánistánu." # todo: NEW TRANSLATION
 AFG_foster_innovation: "Podporovat inovace" # todo: NEW TRANSLATION
 AFG_foster_innovation_desc: "Junus Kánúní jako bývalý ministr školství chápe zásadní potřebu inovací ve vzdělávacím sektoru." # todo: NEW TRANSLATION
 AFG_combat_electoral_corruption: "Bojovat proti volební korupci" # todo: NEW TRANSLATION
 AFG_combat_electoral_corruption_desc: "V Afghánistánu úředníci často využívali úplatky k hromadění majetku a udržení své moci. Od této chvíle musíme zajistit, aby volební podvody již nebyly tolerovány." # todo: NEW TRANSLATION
 AFG_empowering_provincial_governance: "Posílit provinční správu" # todo: NEW TRANSLATION
 AFG_empowering_provincial_governance_desc: "Posílení provinční správy v Afghánistánu je nezbytné. Jak ukázalo Německo, decentralizovaná správa umožňuje regionům rozvíjet se a dohánět zbytek národa." # todo: NEW TRANSLATION
 AFG_centralise_the_apparatus_of_the_state: "Centralizovat státní aparát" # todo: NEW TRANSLATION
 AFG_centralise_the_apparatus_of_the_state_desc: "Centralizace posílí naši kontrolu a zajistí, že všechny kontroly i opozice budou řízeny přímo námi." # todo: NEW TRANSLATION
 AFG_expand_the_education_ministry: "Rozšířit ministerstvo školství" # todo: NEW TRANSLATION
 AFG_expand_the_education_ministry_desc: "Rozšíření ministerstva školství by našemu státu výrazně prospělo, neboť by podpořilo kvalifikovanější pracovní sílu a vzdělanější společnost." # todo: NEW TRANSLATION
 AFG_propose_a_new_constitution: "Navrhnout novou ústavu" # todo: NEW TRANSLATION
 AFG_propose_a_new_constitution_desc: "Současná afghánská ústava zaostává za moderními standardy a vyžaduje významné změny." # todo: NEW TRANSLATION
 AFG_embezzle_foreign_funds: "Zpronevěřit zahraniční prostředky" # todo: NEW TRANSLATION
 AFG_embezzle_foreign_funds_desc: "Zpronevěra zahraničních prostředků byla způsobem, jak si udržet pevnou kontrolu nad zemí a zachovat naši správu po boku Národního shromáždění." # todo: NEW TRANSLATION
 AFG_enforce_afghan_centralism: "Prosadit centralismus" # todo: NEW TRANSLATION
 AFG_enforce_afghan_centralism_desc: "Afghánci jsou venkovský a kmenový národ a historicky reagovali na jakoukoli formu centralizace negativně. Jak však může být naše vláda k něčemu, pokud jsme omezováni tím, co můžeme a nemůžeme dělat? Musíme se vzepřít a centralismus prosadit." # todo: NEW TRANSLATION
 AFG_urban_tribal_divisions: "Ústupky vůdcům šúry" # todo: NEW TRANSLATION
 AFG_urban_tribal_divisions_desc: "Přesunem některých našich kmenových příslušníků do urbanizovaných oblastí budeme moci určitým regionům poskytnout větší autonomii a kontrolu nad jejich územím, protože budou lépe organizované." # todo: NEW TRANSLATION
 AFG_atlanticism: "Atlantismus" # todo: NEW TRANSLATION
 AFG_atlanticism_desc: "Atlantismus je přesvědčení o úzké spolupráci mezi Severní Amerikou a Evropou, doktrína, která se prosadila po druhé světové válce. Afghánistán chce v oblasti pokroku a správy přijmout více západní model." # todo: NEW TRANSLATION
 AFG_arsenal_of_democracy: "Arzenál demokracie" # todo: NEW TRANSLATION
 AFG_arsenal_of_democracy_desc: "Americký zbrojní průmysl vzkvétá, a proto bychom toho měli využít, zásobit se a připravit se na výzvy, které nás čekají." # todo: NEW TRANSLATION
 AFG_the_republic_survives_another_day: "Republika přežila další den" # todo: NEW TRANSLATION
 AFG_the_republic_survives_another_day_desc: "Jak noc ustupuje dni, prapor afghánského lidu stále pevně vlaje. Připraveni na cokoli, co přijde, ať už mír nebo válka. Jedno zůstává jisté: republika vytrvá do posledního dechu." # todo: NEW TRANSLATION
 AFG_defenders_of_democracy: "Obránci demokracie" # todo: NEW TRANSLATION
 AFG_defenders_of_democracy_desc: "Přechod od státu s jen malou představou o demokracii k novému režimu, který ji plně přijímá, je bezprecedentní. Musíme splnit svou povinnost a za každou cenu chránit tento národ i jeho ideály." # todo: NEW TRANSLATION
 AFG_root_out_the_old_cabinet: "Vymýtit starý kabinet" # todo: NEW TRANSLATION
 AFG_root_out_the_old_cabinet_desc: "Lidé z minulých vládních úřadů stále působí v parlamentním systému. Musíme je odzbrojit a odhalit jako podvodníky, kterými jsou." # todo: NEW TRANSLATION
 AFG_moderate_islamism: "Umírněný islamismus" # todo: NEW TRANSLATION
 AFG_moderate_islamism_desc: "Umírněný islamismus označuje pasivní či tradiční přístup k islámu, který se odlišuje od radikálnějších a revolučních výkladů." # todo: NEW TRANSLATION
 AFG_basej_e_milli: "Zelený proud" # todo: NEW TRANSLATION
 AFG_basej_e_milli_desc: "Basej-e Milli, známá také jako Rávand-e Sabz-e Afghánistán, je protitálibánská, afghánsky nacionalistická a prodemokratická politická strana. Hraje významnou roli při prosazování demokratické budoucnosti a národní jednoty v Afghánistánu." # todo: NEW TRANSLATION
 AFG_knife_to_the_warlords: "Nůž na vojevůdce" # todo: NEW TRANSLATION
 AFG_knife_to_the_warlords_desc: "Vojevůdci sužují tento národ a představují přežitý koncept. Tvrdí, že jednají jménem lidu, ale my všichni stojíme proti nim." # todo: NEW TRANSLATION
 AFG_standardised_taxation: "Jednotné zdanění" # todo: NEW TRANSLATION
 AFG_standardised_taxation_desc: "Standardizované zdanění umožní naší ekonomice zotavit se z let války." # todo: NEW TRANSLATION
 AFG_enlist_the_support_of_the_people: "Získat podporu lidu" # todo: NEW TRANSLATION
 AFG_enlist_the_support_of_the_people_desc: "Získání podpory lidu zachrání republiku před hrozbami, které ji čekají." # todo: NEW TRANSLATION
 AFG_recraft_the_healthcare_system: "Přebudovat zdravotnictví" # todo: NEW TRANSLATION
 AFG_recraft_the_healthcare_system_desc: "Nemocnice jsou staré a potřebují obnovu a opravy. Musíme se zasadit o řešení tohoto problému." # todo: NEW TRANSLATION
 AFG_local_organisation: "Místní organizace" # todo: NEW TRANSLATION
 AFG_local_organisation_desc: "Musíme se semknout, abychom byli soběstační a nespoléhali na podporu zbytku světa." # todo: NEW TRANSLATION
 AFG_lift_the_press_restrictions: "Zrušit omezení tisku" # todo: NEW TRANSLATION
 AFG_lift_the_press_restrictions_desc: "Svobodný a nezávislý tisk je základním kamenem živé a demokratické společnosti." # todo: NEW TRANSLATION
 AFG_progressive_tax: "Progresivní daň" # todo: NEW TRANSLATION
 AFG_progressive_tax_desc: "Aby bylo zajištěno spravedlivé rozdělení bohatství a zdrojů, Afghánistán zavádí progresivní daňový systém." # todo: NEW TRANSLATION
 AFG_local_military_pressure: "Místní vojenský tlak" # todo: NEW TRANSLATION
 AFG_local_military_pressure_desc: "Taktická doktrína známá jako \\\"Místní vojenský tlak.\\\" Tato strategie se zaměřuje na vyvíjení trvalého, lokalizovaného tlaku na nepřátelské síly, narušování jejich operací a podkopávání jejich morálky." # todo: CHANGED
 AFG_return_of_dostum: "Návrat Dostuma" # todo: NEW TRANSLATION
 AFG_return_of_dostum_desc: "Generál Abdul Rašíd Dostum, významný afghánský vojenský vůdce a vlivná osobnost, se vrací na národní scénu. Je známý svým pevným velením uzbeckým silám a strategickým nadáním." # todo: NEW TRANSLATION
 AFG_mission_to_tehran: "Mise do Teheránu" # todo: NEW TRANSLATION
 AFG_mission_to_tehran_desc: "Ve snaze posílit regionální spojenectví a čelit vnějším hrozbám se Afghánistán vydává na diplomatickou misi do Teheránu. Připojením k Íránem vedené Ose odporu chce Afghánistán získat mocné spojence, posílit své vojenské schopnosti a upevnit své geopolitické postavení." # todo: NEW TRANSLATION
 AFG_take_command_of_rabbanis_feyzabad_forces: "Převzít velení nad Rabbáního silami ve Fajzábádu" # todo: NEW TRANSLATION
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "Síly Burhánuddína Rabbáního rozmístěné ve Fajzábádu jsou klíčové pro kontrolu severovýchodních oblastí Afghánistánu. Přímým převzetím velení nad těmito silami chce ústřední vedení sjednotit velitelské struktury, zlepšit koordinaci a posílit obranu této strategicky významné oblasti." # todo: NEW TRANSLATION
 AFG_karim_khalilis_new_offensive: "Nová ofenziva Karíma Chalílího" # todo: NEW TRANSLATION
 AFG_karim_khalilis_new_offensive_desc: "Karím Chalílí, významný vůdce a stratég, stojí v čele odvážné nové ofenzivy s cílem znovu získat klíčová území a zatlačit nepřátelské síly. Jeho plán kombinuje partyzánskou taktiku, mobilizaci místních milicí a strategickou koordinaci se spojeneckými silami." # todo: NEW TRANSLATION
 AFG_western_klep_tt1: "Dopad §Yúnosu zahraniční pomoci§! na §Ydodatečný příjem§! $§G0.18§! miliardy" # todo: NEW TRANSLATION
 AFG_agriculture_mech: "Zemědělství" # todo: NEW TRANSLATION
 AFG_agriculture_mech_desc: "Mandle a granátová jablka jsou jediným afghánským vývozem, který svět bez váhání nakupuje. Státní peníze vložené do sadů, dopravy a odběratelů promění úrodu zemědělců v příjem státní pokladny." # todo: NEW TRANSLATION
 AFG_state_northern_stronghold_dynamic_modifier: "Brány průsmyku Anžuman" # todo: NEW TRANSLATION
 AFG_taliban_assault_on_taloqan: "Tálibánský útok na Taloqán" # todo: NEW TRANSLATION
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "Ofenziva na Mazáre Šaríf" # todo: NEW TRANSLATION
 Militia_Bat_ShuraeNazar: "Milice" # todo: NEW TRANSLATION
 AFG_increase_road_toll_tt: "Zvýšit mýtné\nÚroveň mýtného: [?AFG_toll_level]\nPeněžní zisk státu: $§G[?AFG_Toll_display_var]§!\nSpotřební zboží: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!" # todo: NEW TRANSLATION
 AFG_increase_road_toll_tt_desc: "Úroveň mýtného lze zvýšit až pětkrát; každé zvýšení navyšuje příjmy ze státních dálnic podle provozu a objemu obchodovaného zboží. Každá úroveň nad první stojí celostátně §Y2%§! spotřebního zboží, což odráží zátěž, kterou mýtné představuje pro širší ekonomiku." # todo: NEW TRANSLATION
 AFG_lower_road_toll_tt: "Snížit mýtné\nÚroveň mýtného: [?AFG_toll_level]\nPeněžní zisk státu: $§G[?AFG_Toll_display_var]§!\nSpotřební zboží: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!" # todo: NEW TRANSLATION
 AFG_lower_road_toll_tt_desc: "Snížení úrovně mýtného vrátí §Y2%§! spotřebního zboží, které stála, výměnou za ztrátu příjmu, který tato úroveň přinášela. Mýtné nelze snížit pod první úroveň." # todo: NEW TRANSLATION
 AFG_toll_below_maximum_tt: "Mýtné v tomto státě je §Rna nejvyšší úrovni§!." # todo: NEW TRANSLATION
 AFG_toll_above_minimum_tt: "Mýtné v tomto státě je §Rna nejnižší úrovni§!." # todo: NEW TRANSLATION
 AFG_info_box: "§GMýtné§!\nÚroveň mýtného: [?AFG_toll_level]\nPeněžní zisk státu: $§G[?AFG_Toll_display_var]§!\nNárodní peněžní zisk z mýtného: $§G[?ROOT.additional_income_AFG_tolls_income1]§!\nNárodní spotřební zboží: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!" # todo: NEW TRANSLATION
 AFG_info_box_desc_lore: "Afghánské dálnice ovládají skupiny jako Tálibán a místní vojevůdci, kteří využívali místní mýtné k vytváření příjmů z obchodních cest spojujících Střední Asii, Írán a Pákistán. Toto mýtné, zakořeněné v tradicích Hedvábné stezky, je významným zdrojem financování jak pro tálibánský režim, tak pro vojevůdce, přičemž kontrola klíčových cest je zásadní pro moc a bohatství." # todo: NEW TRANSLATION
 AFG_civil_war: "Bojujeme proti Talibánu" # todo: NEW TRANSLATION
 AFG_civil_war_desc: "Naše země byla rozdělena extremisty. Nyní stojíme na pokraji, bojujeme o přežití našeho způsobu života. Musíme se postavit těmto teroristům, kteří chtějí rozdělit naši zemi." # todo: NEW TRANSLATION
 AFG_enlisting_personal: "Naverbovat personál" # todo: NEW TRANSLATION
 AFG_enlisting_personal_desc: "Musíme oslovit místní vesnické starší a pokusit se naverbovat mládež, aby se přidala do boje proti Talibanovi." # todo: NEW TRANSLATION
 AFG_foreign_loyalist: "Afghánské menšinové milice" # todo: NEW TRANSLATION
 AFG_foreign_loyalist_desc: "Mnoho etnických menšin v Afghánistánu uprchlo před útlakem Talibanem. Většina z nich patří ke stejné etnické skupině jako lidé v okolních zemích. Můžeme mobilizovat ty, kteří uprchli Talibanovi a chtějí s námi bojovat, a také vyhledat dobrovolníky z našich sousedů." # todo: NEW TRANSLATION
 AFG_updating_equipment: "Aktualizujme naše vybavení" # todo: NEW TRANSLATION
 AFG_updating_equipment_desc: "Naši vojáci bojují proti Talibanovi se zastaralým vybavením, musíme jim poskytnout lepší výstroj, pokud chceme tuto válku vyhrát." # todo: NEW TRANSLATION
 AFG_infrastructure_equal_war: "Silnice jsou ve válce klíčové" # todo: NEW TRANSLATION
 AFG_infrastructure_equal_war_desc: "Dokonce i staří Římané věděli, že správné válečné úsilí vyžaduje správné silnice. Musíme tyto silnice vybudovat, abychom zásobili část země, kterou ovládáme, jinak tuto válku nemůžeme vyhrát." # todo: NEW TRANSLATION
 AFG_foreign_equipment: "Ruské zbraně" # todo: NEW TRANSLATION
 AFG_foreign_equipment_desc: "Rusi už si sotva zamilovali Talibanův režim, protože podporují čečenské rebely. Rozhodli se nám dodat staré sovětské zbraně." # todo: NEW TRANSLATION
 AFG_minor_military_construction: "Méně rozsáhlá vojenská výstavba" # todo: NEW TRANSLATION
 AFG_minor_military_construction_desc: "Nemáme z hlediska výroby moc vojenských kapacit, žádný průmysl. Ale při boji s Talibanem budeme potřebovat vyrábět některé zbraně doma, abychom udrželi zásoby pro naše jednotky." # todo: NEW TRANSLATION
 AFG_adjusting_our_economy: "Upravit naše hospodářství" # todo: NEW TRANSLATION
 AFG_adjusting_our_economy_desc: "S občanskou válkou v plném proudu je velká policejní síla pro nás málo užitečná. Měli bychom část zdrojů přesunout do našich nemocnic, abychom zlepšili situaci pro naše vojáky." # todo: NEW TRANSLATION
 AFG_better_officers: "Vzdělávání důstojníků" # todo: NEW TRANSLATION
 AFG_better_officers_desc: "Opět musíme protonat zdroje policajního výcviku na naléhavější problém; důkladné vojenské vzdělání našich důstojníků. Musí být stejně ostrí jako nože, aby vedli naše vojáky do boje." # todo: NEW TRANSLATION
 AFG_elite_help: " jednotky horské války" # todo: NEW TRANSLATION
 AFG_elite_help_desc: "Ovládáme provinci Badakhšán, domov velkého počtu etnických Tádžiků, kteří dobře znají terén, značná část z nich byla zapojena do sovětsko-afghánské války. Ačkoliv většina z nich už dosáhla středního věku, jsou stále připraveni bojovat o přežití naší země." # todo: NEW TRANSLATION
 AFG_enhanced_recruitment_efforts: "Posílené snahy o nábor" # todo: NEW TRANSLATION
 AFG_enhanced_recruitment_efforts_desc: "Nemůžeme si dovolit prohrát tuto válku, a je čas, aby naši občané pochopili, že musíme posílit nábor." # todo: NEW TRANSLATION
 AFG_going_offensive: "Začít naši ofenzivu" # todo: NEW TRANSLATION
 AFG_going_offensive_desc: "Příliš dlouho jsme čekali, bránili to málo, co nám zbylo. Je čas, abychom útočili na Taliban a znovu získali to, co nám právoplatně náleží." # todo: NEW TRANSLATION
 AFG_getting_new_tech: "Získat novou technologii" # todo: NEW TRANSLATION
 AFG_getting_new_tech_desc: "Vedeme války, jako by to bylo ještě ve 20. století. Musíme investovat do nové technologie a modernizovat naši armádu. Bojujeme s nadřazeným nepřítelem – je čas, abychom ho překonali lepší výzbrojí." # todo: NEW TRANSLATION
 AFG_planes: "Založit naše letectvo" # todo: NEW TRANSLATION
 AFG_planes_desc: "Nemáme žádná letadla, ale pokud ovládneme nebe, bude pro nás mnohem snazší vytlačit Taliban." # todo: NEW TRANSLATION
 AFG_usa_equipment: "Zapojení CIA" # todo: NEW TRANSLATION
 AFG_usa_equipment_desc: "Američanům se nelíbí opěrný bod, který má Tálibán v současnosti, a proto nám nabídli, že nám levně prodají určité vybavení." # todo: NEW TRANSLATION
 AFG_specialize_equipment: "Speciální vybavení" # todo: NEW TRANSLATION
 AFG_specialize_equipment_desc: "Pokud chceme vyhrát, musíme mít co nejvíce výhod." # todo: NEW TRANSLATION
 AFG_cars_over_donkeys: "Americké Humvee" # todo: NEW TRANSLATION
 AFG_cars_over_donkeys_desc: "Zatímco osli nám sloužili v horách našeho domova, na rovinách nejsou tak užiteční. Když potřebujeme rychlost, bude lepší pořídit starší Humvee od Američanů." # todo: NEW TRANSLATION
 AFG_fuel_for_economy: "Palivo pro naši ekonomiku" # todo: NEW TRANSLATION
 AFG_fuel_for_economy_desc: "Naše ekonomika je v troskách a korupce bují. Musíme stabilizovat situaci nejen pro vítězství ve válce, ale i pro budoucí obnovu." # todo: NEW TRANSLATION
 AFG_war_experience: "Válečná zkušenost" # todo: NEW TRANSLATION
 AFG_war_experience_desc: "Dlouhodobé boje nás naučily a adaptovaly na naše chyby, umožnily zlepšit naši armádu a taktiku na cestě." # todo: NEW TRANSLATION
 AFG_army_budget: "Rozpočet armády" # todo: NEW TRANSLATION
 AFG_army_budget_desc: "I přes současná vylepšení armády musíme více financovat naše ozbrojené síly, abychom udrželi morálku a pomohli vyhrát válku." # todo: NEW TRANSLATION
 AFG_improving_our_economy: "Nečekané výhody" # todo: NEW TRANSLATION
 AFG_improving_our_economy_desc: "Zatímco děláme změny v naší zemi, abychom vyhráli válku proti Talibanovi, přineslo to nečekaný vedlejší efekt – mírně zlepšit naši ekonomiku a dokonce i vztahy s mezinárodními investory. Ačkoli mnozí z těchto investorů se stále bojí zapojit do válkou sužované země." # todo: NEW TRANSLATION
 AFG_equipment_production: "Vybavení" # todo: NEW TRANSLATION
 AFG_equipment_production_desc: "Po zahájení výroby vybavení jsme rychle našli způsoby, jak zlepšit naše návrhy." # todo: NEW TRANSLATION
 AFG_large_equipment_production: "Masová výroba vybavení" # todo: NEW TRANSLATION
 AFG_large_equipment_production_desc: "Rozhodli jsme se investovat ještě více peněz do domácí výroby vybavení. To znamená, že Talibanovi dříve či později budeme mít zbraňový náskok." # todo: NEW TRANSLATION
 AFG_huge_equipment_production: "Obrovská výroba vybavení" # todo: NEW TRANSLATION
 AFG_huge_equipment_production_desc: "I když je naše ekonomika skromná, naši vůdci pochopili, že je čas vložit všechno, co máme, do domácí vojenské výroby, abychom Talibanovi definitivně porazili." # todo: NEW TRANSLATION
 AFG_loyal_guards: "Věrní strážci" # todo: NEW TRANSLATION
 AFG_loyal_guards_desc: "Potřebujeme najmout strážce, o kterých si můžeme být jisti, že jsou loajální Ahmadovi Shah Massoudovi, natolik loajální, že ho ochrání svým životem." # todo: NEW TRANSLATION
 AFG_elite_guards: "Elitní stráže" # todo: NEW TRANSLATION
 AFG_elite_guards_desc: "Musíme zajistit, aby stráže nejblíže našim vůdcům byly nejvyšší kvality a mimořádně dobře vycvičené; Talibanští vrazi nesmí dostat šanci zaútočit." # todo: NEW TRANSLATION
 AFG_the_end_of_war: "Konec války" # todo: NEW TRANSLATION
 AFG_the_end_of_war_desc: "Konečně... Naše země je chráněná před nájezdy Talibanů, naši vůdci nás dovedli k vítězství, chvála Alláhovi, že umožnil, aby jeho spravedliví synové a dcery vyhráli tuto strašlivou válku." # todo: NEW TRANSLATION
 AFG_civil_war_recovery: "Obnova po občanské válce" # todo: NEW TRANSLATION
 AFG_civil_war_recovery_desc: "Po konečném poražení Taliban a navrácení naší země do rukou vlády je čas soustředit se na obnovu. Naše ekonomika byla během občanské války značně zasažena." # todo: NEW TRANSLATION
 AFG_pleasing_the_ulema: "Potěšit Ulemu" # todo: NEW TRANSLATION
 AFG_pleasing_the_ulema_desc: "Jednou z hlavních příčin občanské války byly náboženské rozdíly. Stále věříme v islám, ale nesdílíme stejnou interpretaci jako Taliban. Po jejich důkladném poražení musíme zajistit, aby naši loajální imámové souhlasili s naším způsobem vlády." # todo: NEW TRANSLATION
 AFG_rebuild_mosques: "Obnovit mešity" # todo: NEW TRANSLATION
 AFG_rebuild_mosques_desc: "Mnoho mešit v zemi bylo tragicky zničeno nebo ponecháno v havarijním stavu během nekonečných konfliktů a válek, které nás sužovaly od Saurovy revoluce v roce 1978. Je načase je vrátit do jejich bývalé slávy." # todo: NEW TRANSLATION
 AFG_spread_our_religion: "Šířit naši víru" # todo: NEW TRANSLATION
 AFG_spread_our_religion_desc: "Naše země má velké množství zbožně věřících muslimů a s naším hospodářstvím procházejícím výrazným oživením bychom měli šířit naši interpretaci a vizi islámu prostřednictvím mezinárodních kontaktů mezi našimi občany a občany sousedních zemí." # todo: NEW TRANSLATION
 AFG_un_troops: "OSN mírotvůrci" # todo: NEW TRANSLATION
 AFG_un_troops_desc: "Po občanské válce je velká část naší země v troskách a dosud ji nemůžeme plně kontrolovat. Měli bychom požádat OSN mírotvůrce, aby pomohli naší armádě při patrolování naší země." # todo: NEW TRANSLATION
 AFG_sticking_with_opium: "Zůstaňte u opia" # todo: NEW TRANSLATION
 AFG_sticking_with_opium_desc: "Vyrábět a prodávat velké množství opia nám dříve vždy vycházelo, a jak se říká, pokud něco funguje, neopravuj." # todo: NEW TRANSLATION
 AFG_industrial_economy: "Průmyslování" # todo: NEW TRANSLATION
 AFG_industrial_economy_desc: "Je čas, abychom začali průmyslovět, abychom vybudovali naši ekonomiku. Musíme stavět obrovské továrny, abychom vyráběli všechny produkty, které naši občané potřebují pro každodenní život." # todo: NEW TRANSLATION
 AFG_changing_our_economy: "Naše budoucí ekonomika" # todo: NEW TRANSLATION
 AFG_changing_our_economy_desc: "Stojíme na křižovatce; musíme se rozhodnout, zda znovu vsadíme na naši současnou ekonomiku založenou na opiu, nebo zda bychom měli zkusit průmyslování země místo toho?" # todo: NEW TRANSLATION
 AFG_opium_barons: "Opiumoví baroni" # todo: NEW TRANSLATION
 AFG_opium_barons_desc: "Jak rozšiřujeme naše trhy, některé frakce naopak zvýšily svůj vliv na trhu. Tyto frakce si efektivně podmanily trh s opiem." # todo: NEW TRANSLATION
 AFG_focusing_on_infrastructure: "Zničit opiová pole" # todo: NEW TRANSLATION
 AFG_focusing_on_infrastructure_desc: "Je čas, abychom se zbavili opiových polí v naší zemi. Musíme modernizovat naši ekonomiku a začít klást základ pro naše průmyslové ambice." # todo: NEW TRANSLATION
 AFG_selling_large_quantities: "Prodat velké množství opia" # todo: NEW TRANSLATION
 AFG_selling_large_quantities_desc: "Vzhledem k centralizované kontrole nad naší produkcí opia získáme z toho velké zisky. Je načase prodat část této produkce a realizovat tento zisk." # todo: NEW TRANSLATION
 AFG_focusing_on_factories: "Založit náš průmysl" # todo: NEW TRANSLATION
 AFG_focusing_on_factories_desc: "S většinou polí maku zničena je načase vybudovat továrny na nyní prázdných pozemcích, aby naši lidé mohli těžit z našich snah." # todo: NEW TRANSLATION
 AFG_relief_effort: "Pomoc při katastrofách" # todo: NEW TRANSLATION
 AFG_relief_effort_desc: "OSN sledovala, jak byla naše země rozdělena občanskou válkou bez výrazného zapojení. Po uklizení prachu nic, mírotvůrci dorazili a působili jako stabilizační faktor, a OSN se rozhodla poslat finanční prostředky, aby nám pomohla dále obnovit a stabilizovat naši zemi." # todo: NEW TRANSLATION
 AFG_building_society: "Obnovit naši společnost" # todo: NEW TRANSLATION
 AFG_building_society_desc: "Většina našeho rozpočtu mířila během války na naše jednotky. Nyní, když už nemáme hrozbu Taliban, OSN žádá, abychom zaměřili úsilí na naši společnost a péči o lidi." # todo: NEW TRANSLATION
 AFG_wounded_veterans: "Péče o zraněné veterány" # todo: NEW TRANSLATION
 AFG_wounded_veterans_desc: "Většina naší populace byla vystavena hrůzám války. Musíme se snažit zajistit léčbu těm, kteří byli zraněni nejvíce, nejen kvůli obnově naší země, ale také abychom mohli v budoucnu čerpat ze zkušeností našich veteránů." # todo: CHANGED
 AFG_economic_recovery: "Částečná obnova" # todo: NEW TRANSLATION
 AFG_economic_recovery_desc: "Se zapojením OSN do našich snah jsme učinili dobrý pokrok na cestě k obnově. Dosáhli jsme bodu, kdy se už nemusíme soustředit jen na přežití; konečně můžeme zlepšovat životní úroveň v naší zemi." # todo: NEW TRANSLATION
 AFG_un_troops_removal: "Odstavení jednotek OSN" # todo: NEW TRANSLATION
 AFG_un_troops_removal_desc: "Udělali jsme velké pokroky při stabilizaci země a po tomto kroku již nepotřebujeme OSN mírotvůrce k asistenci při patroláži naší země." # todo: NEW TRANSLATION
 AFG_tribes_or_cities: "Kmeny nebo města" # todo: NEW TRANSLATION
 AFG_tribes_or_cities_desc: "ostro kontrast mezi kmenovou a modernizační politikou je součástí politického procesu v Afghánistánu a problém, který nelze vyřadit z budování moderního Afghánistánu. Musíme pečlivě vybrat, zda zůstaneme u starých zvyklostí, nebo přijmeme modernější systém." # todo: NEW TRANSLATION
 AFG_the_mountains: "Kmeny" # todo: NEW TRANSLATION
 AFG_the_mountains_desc: "Kmene jsou páteří Afghánistánu, nemůžeme riskovat ztrátu naší stability a národní identity ve prospěch rozvoje mezinárodního kapitálu." # todo: NEW TRANSLATION
 AFG_the_rural_areas: "Rozvíjet venkovské oblasti" # todo: NEW TRANSLATION
 AFG_the_rural_areas_desc: "Téměř všechny naše venkovské oblasti jsou nevyvinuté, měli bychom začít rozvíjet venkovské oblasti, abychom odemkli jejich skutečný potenciál." # todo: NEW TRANSLATION
 AFG_the_tribal_leaders: "Posílit vůdce kmenů" # todo: NEW TRANSLATION
 AFG_the_tribal_leaders_desc: "V historii naší země byl dialog mezi kmeny a centrální vládou vždy příčinou cyklu národního neklidu a poté zahraniční intervence či invaze. Zapojením kmenových vůdců do vlády neuděláme stejnou chybu." # todo: NEW TRANSLATION
 AFG_the_towns: "Rozvíjet městské oblasti" # todo: NEW TRANSLATION
 AFG_the_towns_desc: "Pro modernizaci země je nutné více investovat do městských oblastí, počínaje městy. To jistě odcizí kmeny, ale dokud funguje centrální vláda, všechno bude pod kontrolou." # todo: NEW TRANSLATION
 AFG_the_cities: "Rozvíjet města" # todo: NEW TRANSLATION
 AFG_the_cities_desc: "Naše města mají po desetiletích války velký potenciál pro rozvoj; některé poškozené budovy mohou být renovovány a přeměněny na továrny, aby lépe sloužily potřebám občanů." # todo: NEW TRANSLATION
 AFG_the_capital: "Rozvíjet Kábul" # todo: NEW TRANSLATION
 AFG_the_capital_desc: "Uprostřed 20. století byl Kábul oblíbeným rekreačním místem, avšak desetiletí válek z něj učinila ruinu. Obnova a modernizace Kábulu nejenže obnoví jeho prosperitu, ale také posílí autoritu centrální vlády." # todo: NEW TRANSLATION
 AFG_getting_running_water: "Zajištění tekoucí vody" # todo: NEW TRANSLATION
 AFG_getting_running_water_desc: "Afghánistán je jednou z nejvíce suchem postižených zemí na světě a naši spolu Občané trpěli příliš dlouho kvůli nedostatku čisté vody. Je načase, aby vláda vyřešila problém s nedostatkem vody vybudováním odpovídající infrastruktury." # todo: NEW TRANSLATION
 AFG_feed_the_nation: "Nakrmit národ" # todo: NEW TRANSLATION
 AFG_feed_the_nation_desc: "Většina našich občanů trpí podvýživou. Válka skončila a již neexistuje omluva. Musíme se naléhavě postarat o blaho našich občanů, zvláště o děti." # todo: NEW TRANSLATION
 AFG_spread_electricity: "Rozšířit elektrickou síť" # todo: NEW TRANSLATION
 AFG_spread_electricity_desc: "Během války byla většina elektrické sítě země poškozena nebo zničena a lidé se nyní spoléhají na generátory kvůli častým výpadkům. Je čas znovu vybudovat a rozšířit naši elektrickou síť." # todo: NEW TRANSLATION
 AFG_means_of_communication: "Komunikační prostředky" # todo: NEW TRANSLATION
 AFG_means_of_communication_desc: "Nyní, když byla naše elektrická síť obnovena, můžeme našim občanům poskytnout nejzákladnější televizi a internetové připojení na místech, kde je Taliban zničil." # todo: NEW TRANSLATION
 AFG_rebuild_the_roads: "Obnovit silnice" # todo: NEW TRANSLATION
 AFG_rebuild_the_roads_desc: "Většina naší silniční sítě byla během války poškozena a mnoho zbylých cest je minováno Talibanem. Je nutné vyčistit tyto IED a znovu vybudovat naše silnice." # todo: NEW TRANSLATION
 AFG_public_transportation: "Veřejná doprava" # todo: NEW TRANSLATION
 AFG_public_transportation_desc: "Naše země má veřejnou dopravu, ale kvůli obavám z teroristických útoků ze strany Talibánu funguje téměř nefunkčně. Nyní, když mír konečně přišel, je na čase veřejnou dopravu vrátit pro prospěch našich obyvatel." # todo: NEW TRANSLATION
 AFG_our_nation_recovered: "Naše země se zotavila" # todo: NEW TRANSLATION
 AFG_our_nation_recovered_desc: "S odchodem mírových sil OSN to jistě znamená, že naše země je zpět na správné cestě a je čas vyhrnout si rukávy a dále budovat Afghánistán." # todo: NEW TRANSLATION
 AFG_future_national_policy: "Budoucnost Afghánistánu" # todo: NEW TRANSLATION
 AFG_future_national_policy_desc: "Válka skončila. Země je však stále v ruinách a je čas utvářet budoucnost země." # todo: NEW TRANSLATION
 AFG_approaching_nato: "Přiblížit se Západu" # todo: NEW TRANSLATION
 AFG_approaching_nato_desc: "Západní mocnosti mají silné ekonomiky a vyspělou technologii; pokud se rozhodneme naklonit k Západu, poskytnou významnou pomoc v budoucnu, jak ekonomickou, tak vojenskou." # todo: NEW TRANSLATION
 AFG_aspiring_nato: "Staňte se významným spojencem mimo NATO" # todo: NEW TRANSLATION
 AFG_aspiring_nato_desc: "Naše geografická poloha činí oficiální členství v NATO vysoce nepravděpodobným, ale můžeme se stát významným spojencem mimo NATO. Tímto krokem získáme řadu vojenských a finančních výhod, které nejsou k dispozici zemím mimo NATO ze strany Spojených států." # todo: NEW TRANSLATION
 AFG_emerging: "Přiblížit se Východu" # todo: NEW TRANSLATION
 AFG_emerging_desc: "Západní země často nesplňují své sliby při jednání s třetím světem a v minulosti spolupráce s nimi vedla k podmanění a vykořisťování našich občanů ze strany západní kapitalistické třídy. Tato vykořisťování bude profitovat jen několika oligarchům. Existuje mnoho nových příležitostí pro spolupráci s rozvíjejícími se zeměmi Východu, jako je Čína a Rusko." # todo: NEW TRANSLATION
 AFG_join_sco: "Připojit se k SCO" # todo: NEW TRANSLATION
 AFG_join_sco_desc: "SCO vedou Čína a Rusko a tato organizace klade důraz na regionální mír, bezpečnost, boj proti terorismu a hospodářskou spolupráci. Může poskytnout mnoho zdrojů, které považujeme za nezbytné pro naši zemi, například protiteroristická cvičení a rozvojovou pomoc. V zájmu naší země bychom se měli ke SCO připojit." # todo: NEW TRANSLATION
 AFG_seek_american_protection: "Žádat o americkou ochranu" # todo: NEW TRANSLATION
 AFG_seek_american_protection_desc: "USA jsou nejsilnější vojenskou silou na světě, a vzhledem k naší jedinečné geografické poloze, kterou obklopují silné státy, by vyhledávání americké ochrany nebylo jen zajištěním naší ochrany před zahraniční invazí, ale také by pomohlo udržet vnitřní stabilitu země." # todo: NEW TRANSLATION
 AFG_monarchy: "Návrat dynastie Barakzijů" # todo: NEW TRANSLATION
 AFG_monarchy_desc: "Bývalý premiér Mohammed Daoud Khan udělal chybu tím, že svrhl svého bratrance, krále Mohammeda Zahir Šáha, a zavedl republikánskou diktaturu. To vedlo k desetiletím občanského napětí v Afghánistánu. Je čas připravit návrat království a přinést zemi stabilitu." # todo: NEW TRANSLATION
 AFG_prepare_the_king: "Připravte návrat krále" # todo: NEW TRANSLATION
 AFG_prepare_the_king_desc: "Náš milovaný bývalý král, Mohammed Zahir Šáh, má stále rodinu v exilu v Itálii, je čas je připravit na jejich návrat do Afghánistánu, aby znovu vládli naší zemi jako království." # todo: NEW TRANSLATION
 AFG_the_king_returns: "Návrat krále" # todo: NEW TRANSLATION
 AFG_the_king_returns_desc: "Po položení základů a potřebných přechodů je čas přivítat našeho krále s otevřenou náručí a předat mu žezlo." # todo: NEW TRANSLATION
 AFG_restore_the_constitution: "Obnovit Ústavu z roku 1964" # todo: NEW TRANSLATION
 AFG_restore_the_constitution_desc: "Ústava z roku 1964 je charakterizována jako projev moderní demokracie; parlamentní volby, práva žen a občanská práva. Důležité je, že zajišťuje, že monarchie zůstane na trůnu. Musíme tuto ústavu obnovit, aby se naše království vrátilo k dávné slávě." # todo: NEW TRANSLATION
 AFG_pro_establishment: "Puč Hezb-i Islami" # todo: NEW TRANSLATION
 AFG_pro_establishment_desc: "Je čas přivést Afghánistán pod centralizovanou páshtunskou islámskou vládu! Příslušnické války ovlivnily modernizaci a stabilitu našeho státu. Západ nás opustil a východní mocnosti se nás snaží zničit. Budeme usilovat o to, aby Afghánistán konečně spadl pod islámskou vládu." # todo: NEW TRANSLATION
 AFG_bring_military_to_our_side: "Přilákat vojáky na naši stranu" # todo: NEW TRANSLATION
 AFG_bring_military_to_our_side_desc: "Naše armáda má chránit naši zemi a udržovat stabilitu ve státě. Kvůli vysoké míře korupce za bývalé vlády a častému zadržování vojenské mzdy vrcholnými činiteeli je armáda skeptická vůči nové vládě. Je nezbytné tuto situaci řešit, abychom zajistili stabilitu našeho nového režimu." # todo: NEW TRANSLATION
 AFG_secure_the_power: "Upevnit naši moc" # todo: NEW TRANSLATION
 AFG_secure_the_power_desc: "Nyní, když máme vojáky na svou stranu, je čas vybudovat policejní síly, stabilizovat zemi a nasadit je spolu s naší armádou, abychom odstranili vliv kmenů a dosáhli našeho konečného cíle silné, centralizované, Pashtúnmi ovládané islámské vlády." # todo: NEW TRANSLATION
 AFG_declare_the_emirate: "Vyhlásit emirát" # todo: NEW TRANSLATION
 AFG_declare_the_emirate_desc: "Je čas našim spoluobčanům nabídnout silné, centralizované vedení, které bude sloužit nejlepším zájmům země. Hekmatyar bude naším laskavým Emírem." # todo: NEW TRANSLATION
 AFG_future_diplomacy: "Náš diplomatický postoj" # todo: NEW TRANSLATION
 AFG_future_diplomacy_desc: "V moderním světě si žádná země nemůže dovolit zůstat izolovaná. Vzhledem k naší situaci musíme pečlivě stanovit způsob, jak budeme jednat s ostatními zeměmi." # todo: NEW TRANSLATION
 AFG_invite_western_investors: "Pozvat západní investory" # todo: NEW TRANSLATION
 AFG_invite_western_investors_desc: "Můžeme pozvat některé západní investory, aby přispěli k několika projektům v naší zemi, které podpoří ekonomiku naší země a usnadní budoucí hospodářskou spolupráci se Západem." # todo: NEW TRANSLATION
 AFG_invite_eastern_investors: "Pozvat východní investory" # todo: NEW TRANSLATION
 AFG_invite_eastern_investors_desc: "Východní mocnosti jsou země, které skutečně chtějí pomoci naší zemi, bez podmíněných požadavků na tzv. „demokracii“ a „lidská práva“. Můžeme je pozvat, aby investovali do naší země, posílit naše hospodářské vazby a otevřít více příležitostí pro budoucí spolupráci." # todo: NEW TRANSLATION
 AFG_request_chinese_protection: "Žádat o čínskou ochranu" # todo: NEW TRANSLATION
 AFG_request_chinese_protection_desc: "Čína je naším sousedem, ale nikdy neměla v úmyslu nás okupovat ani podrobit. Oba sdílíme stejné obavy ohledně vnitřní bezpečnosti. Proto můžeme s Čínou navázat obrannou smlouvu výměnou za poskytnutí některých výhod podnikání v naší zemi." # todo: NEW TRANSLATION
 AFG_internal_policy: "Zaměřit se na vnitřní politiku" # todo: NEW TRANSLATION
 AFG_internal_policy_desc: "Nyní, když je naše země stabilizovaná, musíme určit směr, kterým se budeme ubírat." # todo: NEW TRANSLATION
 AFG_aggresive_foreign_policy: "Aggresivní zahraniční politika" # todo: NEW TRANSLATION
 AFG_aggresive_foreign_policy_desc: "Jak se říká, útok je nejlepší obranou. Důvod, proč byla naše země historicky napadena zahraničními říšemi, spočívá v tom, že jsme vždy zvolili politiku pasivní obrany. Musíme být agresivní, aby se historie neopakovala." # todo: NEW TRANSLATION
 AFG_isolism: "Obranná zahraniční politika" # todo: NEW TRANSLATION
 AFG_isolism_desc: "Ačkoli byl Afghánistán kdysi historicky silnou zemí a porazil dvě bývalé supervelmoci, dnes již není regionální velmocí. Blahobyt lidu je nejvyšší prioritou této vlády. Můžeme přijmout politiku aktivní obrany diplomaticky, abychom se vyhnuli dalším zahraničním zásahům či invazi." # todo: NEW TRANSLATION
 AFG_increased_mobilization: "Zvýšit povinnou vojenskou službu" # todo: NEW TRANSLATION
 AFG_increased_mobilization_desc: "Naše země je obklopena silnými nepřáteli, ale naši občané nejsou připraveni bojovat, a musíme zavést povinnou vojenskou službu, abychom zajistili připravenost našich občanů pro válku." # todo: NEW TRANSLATION
 AFG_eyes_on_pakistan: "Veřejně odsuzovat Durandovu linii" # todo: NEW TRANSLATION
 AFG_eyes_on_pakistan_desc: "Durandova linie, stanovená Britskou ve 20. století, je ostudou a urážkou naší země; ponechává většinu našich Paštún bratří žijících uvnitř hranic Pakistánu, země, o níž věříme, že by neměla existovat. Nikdy neuznáme Durandovu linii a nezapomeneme na desítky let utrpení, které Pakistan historicky způsobil našemu lidu." # todo: NEW TRANSLATION
 AFG_defending_our_borders: "Bránit naše hranice" # todo: NEW TRANSLATION
 AFG_defending_our_borders_desc: "I když naše země sleduje přísnou neutrální diplomacii, ne každá země kolem nás je stabilní a proto nemůžeme zůstat lhostejní. Jako součást aktivní obranné doktríny vybudujeme obranné struktury na naší hranici s Pakistanem." # todo: NEW TRANSLATION
 AFG_leg_infantry: "Vylepšit naši pěchotu" # todo: NEW TRANSLATION
 AFG_leg_infantry_desc: "Naše zbraně v minulosti pocházely převážně od sousedních a regionálních sil a naši vojáci byli převážně pěšáci. Ačkoliv znovuvybavení naší armády lze odložit, naše zbraně postrádají moderní standardy; musíme zrenovovat výzbroj pěchoty." # todo: NEW TRANSLATION
 AFG_afghan_sof: "Zaměření na speciální síly" # todo: NEW TRANSLATION
 AFG_afghan_sof_desc: "Ve 21. století jsou speciální síly často první jednotky, které vstupují do boje, a poslední, které z něj odstoupí. Jsou jim svěřovány nejtěžší, ale nedoceněné úkoly, včetně průzkumu, boje proti terorismu, pomoci při řešení katastrof a podobně. Měli bychom tyto jednotky rozvíjet." # todo: NEW TRANSLATION
 AFG_mobile_units: "Zaměřit se na mobilní jednotky" # todo: NEW TRANSLATION
 AFG_mobile_units_desc: "V moderní válce je pěchota bezpochyby kanóvá oběť v situacích s vysokou intenzitou boje. Kdyby byla pěchota mechanizována, jejich účinnost a přežití by se drasticky zvýšily." # todo: NEW TRANSLATION
 AFG_preparing_invasion: "Připravte se na válku" # todo: NEW TRANSLATION
 AFG_preparing_invasion_desc: "Abychom získali Pashtúnistán, který nám právem patří, musíme začít s přípravami na válku. Pakistan nebude snadným protivníkem." # todo: NEW TRANSLATION
 AFG_invade_pakistan: "Získat zpět naši zemi" # todo: NEW TRANSLATION
 AFG_invade_pakistan_desc: "Přišel čas osvobodit naše Paštúnské bratry od tyranského vládnutí Pakistánu." # todo: NEW TRANSLATION
 AFG_armoured_units: "Rozvíjejme naše obrněné jednotky" # todo: NEW TRANSLATION
 AFG_armoured_units_desc: "Moderní armáda není účinnou bojovou silou bez slušné obrněné jednotky. Měli jsme v minulých válkách tanky, které naštěstí utrpěly jen drobné poškození, vytržené pásy a další snadno opravitelné problémy. Tyto tanky můžeme opravit, zatímco vyvíjíme domácí tankový návrh, abychom složili účinný obrněný sbor." # todo: NEW TRANSLATION
 AFG_defensive_army: "Defenzivní armáda" # todo: NEW TRANSLATION
 AFG_defensive_army_desc: "Naše národní situace nám neumožňuje utrácet příliš velkou část rozpočtu na armádu, a přesto v mnoha ohledech bojová účinnost ozbrojených sil nezávisí na modernosti zbraní ani na počtu jednotek, což dokládají naše dřívější snahy vyhnat Sověty a Británii. Můžeme zlepšit bojovou účinnost naší armády aniž bychom nadměrně zvyšovali výdaje na zbrojní sektor tím, že budeme vyučovat defenzivní taktiky." # todo: NEW TRANSLATION
 AFG_army_engineer_school: "Armádní inženýrská škola" # todo: NEW TRANSLATION
 AFG_army_engineer_school_desc: "Při zvyšování bojové účinnosti našich důstojníků a poddůstojníků je důležité mít vojenské akademie, které vyučují naše budoucí důstojníky. S dlouhodobými veterány jako profesory si vláda je jistá, že naši budoucí důstojníci povedou naši armádu k úspěchu." # todo: NEW TRANSLATION
 AFG_homeguard: "Domobrana" # todo: NEW TRANSLATION
 AFG_homeguard_desc: "Podle vojenského velení samotná pravidelná armáda nestačí na efektivní obranu naší země. Naštěstí naše jedinečná geografie nám umožňuje vycvičit milice, odborníky na horskou válku. Tito milice obvykle žijí normální civilní životy, ale budou dostávat pravidelný vojenský výcvik a budou schopni rychle zasáhnout do boje k obraně naší země v případě zahraniční invaze." # todo: NEW TRANSLATION
 AFG_the_swiss_way: "Švýcarská cesta" # todo: NEW TRANSLATION
 AFG_the_swiss_way_desc: "Afghánistán byl v polovině minulého století nejvíce poklidný a stabilní a tehdy byl nazýván Švýcarskem Blízkého východu. Měli bychom se pokusit tento historický status obnovit. Naše geografie je do jisté míry podobná Švýcarsku a vláda si myslí, že se od Švýcarska můžeme naučit budovat opevnění kolem klíčových bodů v zemi." # todo: NEW TRANSLATION
 AFG_superior_firepower: "Nadřazená palebná síla" # todo: NEW TRANSLATION
 AFG_superior_firepower_desc: "Pro některé země by čistá vojenská síla odradila útočníka od nákladné invaze. Měli bychom investovat do doktríny nadřené palebné síly, abychom co nejúčinněji bránili naše hranice." # todo: NEW TRANSLATION
 AFG_military_research: "Vojenský výzkum" # todo: NEW TRANSLATION
 AFG_military_research_desc: "Nyní je naše země stabilizovaná, můžeme část národního rozpočtu investovat do vojenského výzkumu, zejména do technologií s dvojím užitím pro vojenské i civilní účely." # todo: NEW TRANSLATION
 AFG_moderate_islamists: "Jamiat-e Islami Government" # todo: NEW TRANSLATION
 AFG_moderate_islamists_desc: "Ahmad Shah Massoud a Burhanuddin Rabbani mají agendu pro posílení jednoty naší země. Zní to jako program, který by v budoucnu mohl oživit zemi. Jamiat-e Islami je v současnosti u moci a měli bychom zajistit, aby centrální vláda otevřela cestu pro naši agendu." # todo: NEW TRANSLATION
 AFG_fight_corruption: "Boj proti vládní korupci" # todo: NEW TRANSLATION
 AFG_fight_corruption_desc: "Klíčem k získání důvěry lidu je, aby naše vláda zakročila proti rozšířené korupci v zemi. Je důležité, aby lidé věděli, že naše vláda slouží zájmům lidu, nikoli zájmům mocné a urozené třídy." # todo: CHANGED
 AFG_decentralization: "Decentralizace" # todo: NEW TRANSLATION
 AFG_decentralization_desc: "Jedním z klíčových bodů agendy Jamiat-e Islami je decentralizace; Ahmad Šá Massúd uvedl, že mocenské vztahy v Afghánistánu by měly následovat švýcarský model, čímž by vznikla decentralizovaná vláda a devolution moci z Kábulu. To umožní provinciím země rozdělovat zdroje a moc efektivněji, což přinese prosperitu a stabilitu celé zemi." # todo: NEW TRANSLATION
 AFG_jamiate_islami: "Švýcarský politický model" # todo: NEW TRANSLATION
 AFG_jamiate_islami_desc: "Zreformovali jsme strukturu naší vlády a podpora lidí je jednoznačně za těmito plány. Je načase začít novou éru pro Afghánistán." # todo: NEW TRANSLATION
 AFG_authortarian: "Junbish-i-Milli Government" # todo: NEW TRANSLATION
 AFG_authortarian_desc: "Junbish-i-Milli je populistická strana širokého spektra s vojenským vůdcem Abdul Rashid Dostumem v čele. Usiluje o prosazování sekularismu, ochranu zájmů Afghánistánu, Turkmenistánu a Uzbekistánu a obnovit prosperity, kterou jsme měli minulý století za republikánského režimu. Dostum povede zemi do nové éry." # todo: NEW TRANSLATION
 AFG_helping_our_friends: "Politické čistky" # todo: NEW TRANSLATION
 AFG_helping_our_friends_desc: "Ačkoli jsme převzali moc, někteří z našich bývalých spojenců představují pro autoritu ústřední vlády velkou hrozbu. Musíme je odstranit z jejich funkcí a na jejich místo dosadit ty, kteří jsou nám loajální." # todo: CHANGED
 AFG_secularism_campaign: "Sekulárizační kampaň" # todo: NEW TRANSLATION
 AFG_secularism_campaign_desc: "Jedním z klíčových bodů Dostumovy agendy je oddělení náboženství od politiky; tento krok má posílit moc centrální vlády a vytlačit mullahy z politiky. To jistě vyvolá hněv v některých náboženských komunitách, ale proti tomu budeme postupovat několika způsoby." # todo: NEW TRANSLATION
 AFG_junbishi_milli: "Obnovit sekulární republiku" # todo: NEW TRANSLATION
 AFG_junbishi_milli_desc: "Pod republikánskou vládou minulého století se Afghánistán rychle modernizoval a ženy byly emancipovány, mohly se rovnoprávně podílet na afghánské společnosti. Republikánský způsob vlády prokázal, že Afghánistán může skutečně opustit zastaralé zvyky a modernizovat zemi." # todo: NEW TRANSLATION
 AFG_pro_western: "Pro-západní nezávislí" # todo: NEW TRANSLATION
 AFG_pro_western_desc: "Podpořeni Západem, nezávislá vláda se téměř určitě nakloní ke Západu a udrží status quo v regionu." # todo: NEW TRANSLATION
 AFG_supported_by_west: "Západní podpora" # todo: NEW TRANSLATION
 AFG_supported_by_west_desc: "Naše vláda v současnosti postrádá podporu lidu kvůli korupci uvnitř ní. Musíme chránit náš vládnoucí elitu před hněvem lidu, a vzhledem k naší orientaci na Západ, Západ nám jistě poskytne podporu, včetně tlaku na opozici, aby vytvořila koalici." # todo: NEW TRANSLATION
 AFG_increase_opium_trade: "Tajně podporovat opiový průmysl" # todo: NEW TRANSLATION
 AFG_increase_opium_trade_desc: "Navzdory veřejnému prohlášení o našem záměru řešit problém s opiem, můžeme potají podporovat opiový průmysl tím, že nic neuděláme a maková pole budeme hlídat civilními policisty. Zřejmě obdržíme politické dary od opiových baronů." # todo: NEW TRANSLATION
 AFG_afghan_independents: "Povolit kleptokracii" # todo: NEW TRANSLATION
 AFG_afghan_independents_desc: "Změna? Kdo ji potřebuje? Máme Západ, který nám pomůže a situace se zlepší podle plánu." # todo: NEW TRANSLATION
 AFG_the_western_kleptocracy_desc: "Změna? Kdo změnu potřebuje? Máme Západ, který nám pomůže, a situace se zlepší podle plánu." # todo: NEW TRANSLATION
 AFG_hezb_i_wahdat: "Khalili's Government" # todo: NEW TRANSLATION
 AFG_hezb_i_wahdat_desc: "Islámská Jednotná strana Afghánistánu je afghánská politická strana založená v roce 1989 na bázi šiítského islámu." # todo: NEW TRANSLATION
 AFG_invite_fatemiyoun: "Vyzvat Fatemiyoun" # todo: NEW TRANSLATION
 AFG_invite_fatemiyoun_desc: "Divize Fatemiyoun byla vytvořena z afghánských šíitských dobrovolníků a vycvičena Íránskými revolučními gardami. Povolení návratu jejích veteránů domů by dalo Khalilimu k dispozici ostřílené bojovníky, pokud by Teherán souhlasil s jejich vyzbrojením." # todo: CHANGED
 AFG_join_axis_of_resistance: "Osa odporu" # todo: NEW TRANSLATION
 AFG_join_axis_of_resistance_desc: "Teherán vede síť spojeneckých hnutí napříč regionem a šíitská vláda v Kábulu do ní patří. Formální sladění našeho duchovenstva s íránským modelem by ukončilo sunnitské prvenství ve státě a spojilo naši obranu s Íránem." # todo: CHANGED
 AFG_declare_hazaristan: "Vyhlásit Hazaristán" # todo: NEW TRANSLATION
 AFG_declare_hazaristan_desc: "Hazárové byli po celé století pronásledovanou menšinou každého afghánského režimu. Vyhlášení Hazáristánu přejmenuje stát po nich a vyřeší otázku, komu nyní Afghánistán patří." # todo: CHANGED
 AFG_remain_neutral: "Cesta neutrálnosti" # todo: NEW TRANSLATION
 AFG_remain_neutral_desc: "Prosperita Afghánistánu ve střední části 20. století prokázala, že naklánění se ani k Západu, ani k Východu nám umožňuje těžit z obou stran a neubližovat žádnému z nich. To je v dnešním Afghánistánu nejlepší politika zahraničních vztahů." # todo: NEW TRANSLATION
 AFG_economy_first: "Ekonomika na prvním místě" # todo: NEW TRANSLATION
 AFG_economy_first_desc: "Jelikož usilujeme o neutrální diplomatické vztahy, zaměření našeho národního rozvoje by mělo být na civilní ekonomice a vojenské výdaje by měly zůstat nízké, jen natolik, abychom se mohli bránit a zvládnout jakoukoli nespokojenost, se kterou se potýkáme." # todo: NEW TRANSLATION
 AFG_looking_for_protection: "Vyžadovat uznání neutrality OSN" # todo: NEW TRANSLATION
 AFG_looking_for_protection_desc: "Zatím jsme prokázali naši schopnost plnit závazky jako trvale neutrální země. Nyní potřebujeme jen, aby nás OSN uznala a aby měl alespoň jeden stálý člen Rady bezpečnosti OSN, aby bylo zaručeno, že zůstaneme trvale neutrální zemí." # todo: NEW TRANSLATION
 TAL_money: "Fond Talibanů" # todo: NEW TRANSLATION
 AFG_afghan_morning_taliban_by_night: "A.N.A. přes den, Taliban v noci" # todo: NEW TRANSLATION
 AFG_afghan_morning_taliban_by_night_desc: "Podstatná část našeho personálu v Afghánské národní armádě vede dvojí život. Mnozí z nich jsou v Talibanovi během služeb v armádě, což Talibanovi dává velkou výhodu nad našimi silami. Tato korupce umožnila masivní korupci v ozbrojených silách a velký úbytek morálky vojáků bojujících za národ." # todo: NEW TRANSLATION
 AFG_safed_koh_supply_network: "Safed Koh zásobovací síť" # todo: NEW TRANSLATION
 AFG_safed_koh_supply_network_desc: "Využívajíc složitou síť silnic, hor a podzemních jeskyní, zásobovací síť Safed Koh zmírnila dopad drsného a izolovaného terénu regionu." # todo: NEW TRANSLATION
 AFG_liberal_society: "Liberální společnost" # todo: NEW TRANSLATION
 AFG_liberal_society_desc: "Uvolnění sevření duchovního establishmentu poskytlo Kábulu tisk, bazar a veřejnou debatu. Obchodní partneři nás díky tomu berou vážněji, politický kapitál vynaložený na udržení tohoto směru je však skutečný." # todo: NEW TRANSLATION
 AFG_preserve_democracy: "Zachovat demokracii" # todo: NEW TRANSLATION
 AFG_preserve_democracy_desc: "S osvobozeným tiskem a nedotčenými soudy dostává republika skutečnou šanci zapustit kořeny, než ji další krize podrobí zkoušce." # todo: NEW TRANSLATION
 AFG_indian_support_and_arms_trade: "Indická podpora a obchod se zbraněmi" # todo: NEW TRANSLATION
 AFG_indian_support_and_arms_trade_desc: "Indové souhlasili s podporou a vyzbrojením našeho národa proti našim nepřátelům." # todo: NEW TRANSLATION
 AFG_establishing_supply_lines: "Budování zásobovacích tras" # todo: NEW TRANSLATION
 AFG_establishing_supply_lines_desc: "Vybudováním dobře udržovaných a zabezpečených zásobovacích tras zajistíme našim jednotkám dostatek zásob, aby mohly pokračovat v boji." # todo: NEW TRANSLATION
 AFG_russian_technical_specialists: "Ruští techničtí specialisté" # todo: NEW TRANSLATION
 AFG_russian_technical_specialists_desc: "Přivezli jsme specialisty z [SOV.GetFlag] Ruska, aby pracovali na našich mechanizovaných jednotkách." # todo: NEW TRANSLATION
 AFG_the_shura_system_idea: "Systém šúry" # todo: NEW TRANSLATION
 AFG_the_shura_system_idea_desc: "Systém šúry v Severní alianci je tradiční formou správy založené na radě, zakořeněnou v kmenových a komunitních rozhodovacích postupech. Tento systém sdružuje vojenské vůdce, kmenové starší a vlivné osobnosti, aby společně projednávali otázky a přijímali kolektivní rozhodnutí. Systém šúry posiluje jednotu a zajišťuje, že různé frakce v Severní alianci jsou zastoupeny a mají hlas ve strategických a politických záležitostech." # todo: NEW TRANSLATION
 AFG_civilian_exodus_taloqan: "Odchod civilistů z Taloqánu" # todo: NEW TRANSLATION
 AFG_civilian_exodus_taloqan_desc: "Boje kolem Taloqánu vyhnaly tisíce rodin na sever a západ. Tábory zatěžují naše omezené zdroje, ale uprchlíci s sebou odvádějí část provincie a méně hladových krků v první linii ulehčuje našemu zásobování." # todo: NEW TRANSLATION
 AFG_iranian_airbridge: "Íránský letecký most" # todo: NEW TRANSLATION
 AFG_iranian_airbridge_desc: "Poté, co Tálibán obsadil Kábul, íránská pomoc Severní alianci zesílila. Írán zřídil letecký most mezi Mašhadem a afghánskými leteckými základnami Bagrám a Kuljab, aby Severní alianci dodával obrovské množství zbraní. Zprávy uvádějí, že během jediného dne v roce 1997 přistálo v Bagrámu 13 íránských letů a Írán je stále podezírán z toho, že přes Tádžikistán poslal 700 tun zbraní." # todo: NEW TRANSLATION
 AFG_junbishis: "Džunbišové" # todo: NEW TRANSLATION
 AFG_junbishis_desc: "§RNemůžeme ručně zvýšit popularitu §W[Conservative_L]§!, dokud je Abdul Rašíd Dostum v exilu§!\n\nDžunbiš-e Millí Islámí Afghánistán, běžně známý jako Džunbiš, je významnou frakcí Severní aliance, tvořenou především etnickými Uzbeky. Tálibánské síly ji nedávno vyhnaly z její bašty v Mazáre Šarífu, Džunbiš však v Severní alianci nadále hraje významnou roli. Skupinu vede generál Abdul Rašíd Dostum, významný vojevůdce, který byl v minulosti v rozporu s ostatními členy Severní aliance a během svého exilu s nimi udržuje napjaté vztahy." # todo: NEW TRANSLATION
 AFG_taloqan_text1: "§gIt can be broken only with great iron hammers.§!" # todo: NEW TRANSLATION
 AFG_taloqan_text2: "§gThey will be led by a young Hashemite man riding a gray mule and wearing a red headband. It is as if I can see him crossing the Euphrates. Should you hear of his coming, rush to him even if you have to crawl over the snow§!" # todo: NEW TRANSLATION
 AFG_northern_alliance_taloqan_siege: "Obléhání Taloqánu" # todo: NEW TRANSLATION
 AFG_northern_alliance_taloqan_siege_desc: "V nedávné historii sloužil Taloqán jako strategické velitelství Ahmada Šáha Masúda, významného vůdce mezi frakcemi mudžáhidů během jejich odporu proti sovětské armádě. Poté se stal velitelstvím [AFG.GetFlag] [AFG.GetNameDefCap] poté, co město Mazáre Šaríf v roce 1997 obsadily tálibánské síly." # todo: NEW TRANSLATION
 AFG_idea_opium_economy: "Afghánská opiová ekonomika" # todo: NEW TRANSLATION
 AFG_idea_opium_economy_desc: "Velká část afghánských zemědělců se živí pěstováním a prodejem máku na opium. Rozsáhlá maková pole zabírají velkou část naší orné půdy." # todo: NEW TRANSLATION
 AFG_idea_opium_barons: "Afghánští opioví baroni" # todo: NEW TRANSLATION
 AFG_idea_opium_barons_desc: "Velká část afghánských zemědělců se živí pěstováním a prodejem máku na opium. Rozsáhlá maková pole zabírají velkou část naší orné půdy. Nová vládní politika umožnila vznik situace, v níž velká skupina opiových baronů provozuje několik rozsáhlých obchodních sítí. Vliv těchto opiových baronů ve vládě je nepopiratelný." # todo: NEW TRANSLATION
 AFG_idea_afghan_defence: "Rozsáhlá obranná opatření" # todo: NEW TRANSLATION
 AFG_idea_afghan_defence_desc: "Naše země je pohlcena občanskou válkou. Ztrácíme území, ale neustoupíme už ani o krok!" # todo: NEW TRANSLATION
 AFG_idea_un_troops: "Mírové jednotky OSN" # todo: NEW TRANSLATION
 AFG_idea_un_troops_desc: "Požádali jsme o nasazení mírových jednotek OSN v naší zemi v naději, že přinesou stabilitu." # todo: NEW TRANSLATION
 AFG_idea_enhanced_recruitment_efforts: "Posílené náborové snahy" # todo: NEW TRANSLATION
 AFG_idea_enhanced_recruitment_efforts_desc: "Naši lidé jsou motivováni k nástupu do armády. Tuto válku nevyhrajeme, pokud nebudeme mít dostatek personálu." # todo: NEW TRANSLATION
 AFG_idea_starting_offensive: "Zahájení ofenzivy" # todo: NEW TRANSLATION
 AFG_idea_starting_offensive_desc: "Museli jsme být příliš dlouho na defenzivní pozici. Je čas otočit vývoj a začít postupovat, abychom dobyli ztracená území." # todo: NEW TRANSLATION
 AFG_idea_changing_economy: "Průmyslová ekonomika" # todo: NEW TRANSLATION
 AFG_idea_changing_economy_desc: "Jak jsme změnili směr od naší ekonomiky založené na opiu, mezinárodní investoři a mocnosti začali na naši zemi hledět s velkým zájmem." # todo: NEW TRANSLATION
 AFG_idea_war_experience: "Válečné zkušenosti" # todo: NEW TRANSLATION
 AFG_idea_war_experience_desc: "Dlouhodobá válka z naší generace udělala generaci bojovníků." # todo: NEW TRANSLATION
 AFG_idea_equipment_production: "Malá produkce výstroje" # todo: NEW TRANSLATION
 AFG_idea_equipment_production_desc: "Dílny v Kábulu a Herátu začaly vyrábět vlastní ruční zbraně a lehkou výbavu. Objemy jsou skromné, ale každá puška smontovaná doma je jedna, kterou už nemusíme kupovat v zahraničí." # todo: CHANGED
 AFG_idea_large_equipment_production: "Výroba velkého vybavení" # todo: NEW TRANSLATION
 AFG_idea_large_equipment_production_desc: "Naše zbrojní dílny se rozrostly v řádné továrny a k ručním zbraním a lehké výbavě, které již vyrábějí, přidaly užitková vozidla. Afghánistán nyní dokáže zásobovat většinu toho, co jeho vlastní vojáci používají." # todo: CHANGED
 AFG_idea_water_infrastructure_construction: "Zahájení výstavby vodohospodářské infrastruktury" # todo: NEW TRANSLATION
 AFG_idea_water_infrastructure_construction_desc: "Naše země nedávno zahájila projekt vodohospodářské infrastruktury. Bude to vyžadovat velké množství mladých lidí v pracovní síle, aby byl dokončen včas." # todo: NEW TRANSLATION
 AFG_idea_recent_public_transportation: "Nedávno znovu zavedená veřejná doprava" # todo: NEW TRANSLATION
 AFG_idea_recent_public_transportation_desc: "Naše země nedávno znovu zavedla veřejnou dopravu, která přinese období hospodářského rozkvětu, neboť většina lidí v naší zemi nevlastní vlastní vozidla a budou si užívat výhod dopravních spojů." # todo: NEW TRANSLATION
 AFG_idea_recovered_from_war: "Vzpamatování z občanské války" # todo: NEW TRANSLATION
 AFG_idea_recovered_from_war_desc: "Po desetiletích války konečně přišel mír. Lidé jsou motivováni pracovat pro zemi, která opět má budoucnost." # todo: NEW TRANSLATION
 AFG_idea_tribal_support: "Kmenová podpora" # todo: NEW TRANSLATION
 AFG_idea_tribal_support_desc: "Naše kmenově orientované politiky získaly podporu kmenů, které jsou nyní ochotny respektovat autoritu centrální vlády, pokud budou jejich zájmy dobře uspokojovány." # todo: NEW TRANSLATION
 AFG_idea_diplomatic_interaction: "Diplomatické interakce" # todo: NEW TRANSLATION
 AFG_idea_diplomatic_interaction_desc: "Naše vláda se konečně začala zapojovat do mezinárodních vztahů na mezinárodní scéně, v prvních měsících z toho budeme čerpat krátkodobé výhody. Avšak nezapomeneme na utrpení, kterým jsme prošli." # todo: NEW TRANSLATION
 AFG_idea_prepare_king_return: "Příprava na návrat krále" # todo: NEW TRANSLATION
 AFG_idea_prepare_king_return_desc: "Náš král bohužel stále pobývá v exilu v Itálii. Před jeho nevyhnutelným návratem je nutné provést přípravy dopředu." # todo: NEW TRANSLATION
 AFG_idea_internal_policy_debate: "Vnitřní politika — debata" # todo: NEW TRANSLATION
 AFG_idea_internal_policy_debate_desc: "Vláda začala debatovat o možných politikách, které budou určovat budoucnost země pro domácí obyvatelstvo." # todo: NEW TRANSLATION
 AFG_idea_tribal_culture: "Afghánská kmenová kultura" # todo: NEW TRANSLATION
 AFG_idea_tribal_culture_desc: "Afghánistán je známý svou premoderní kmenovou kulturou a celý stát je rozdělen na rozdíl mezi „Kábulem“ a „ne-Kábulem“. Historicky bylo obtížné pro centrální vládu prosazovat zájmy na místní úrovni. Lidé z každého kmene dávají přednost loajalitě svým starším. Zda budou vojáci patřící ke kmenům bojovat, závisí na rozhodnutí jejich starších." # todo: NEW TRANSLATION
 AFG_idea_factional_infighting: "Northern Alliance Factional Infighting" # todo: NEW TRANSLATION
 AFG_idea_factional_infighting_desc: "Afghánská Severní aliance se skládá z různých vládnoucích vládců, kteří si dříve navzájem vyhrožovali a museli se spojit, aby odolali Tálibánu. Přes to je boje mezi válečníky stále častý a někteří vůdci tajně spolupracují s Tálibánem, aby porazili nepřátelskou frakci.\n§W--------------§!\nBude §Rodstraněno§!, pokud bude režim £GFX_AFG_salafist_jihadism §YTaliban§! svržen, ale boje uvnitř budou §Rpokračovat§!." # todo: NEW TRANSLATION
 AFG_idea_offensive_army: "Agresivní armáda" # todo: NEW TRANSLATION
 AFG_idea_offensive_army_desc: "Pod vlivem civilního vedení si armáda vybrala prosazovat agresivní zahraniční politiku." # todo: NEW TRANSLATION
 AFG_idea_defensive_army: "Defenzivní armáda" # todo: NEW TRANSLATION
 AFG_idea_defensive_army_desc: "Pod vlivem civilního vedení si armáda vybrala prosazovat defenzivní zahraniční politiku." # todo: NEW TRANSLATION
 AFG_offensive_war_preparation: "Přípravy na válku" # todo: NEW TRANSLATION
 AFG_offensive_war_preparation_desc: "Abychom připravili naši armádu na válku, musíme vynaložit zvláštní úsilí, abychom ji plně mobilizovali a vycvičili." # todo: NEW TRANSLATION
 AFG_idea_state_sponsored_opium_industry: "Státem podporovaný opiový průmysl" # todo: NEW TRANSLATION
 AFG_idea_state_sponsored_opium_industry_desc: "Přestože si uvědomujeme, že afghánští farmáři nemohou vydělat dost na živobytí bez pěstování maků, vláda oznámila, že se vypořádá s problémem opia; ve skutečnosti vláda nic neudělá a dokonce částečně tajně podporuje produkci opia v zemi." # todo: NEW TRANSLATION
 AFG_economic_recovery_research_boost: "Ekonomické zotavení" # todo: NEW TRANSLATION
 AFG_economic_recovery_research_boost_desc: "S pomocí OSN jsme dosáhli bodu, kdy můžeme začít soustředit naše zdroje na civilní projekty." # todo: NEW TRANSLATION
 AFG_military_research_boost: "Vojenský výzkum" # todo: NEW TRANSLATION
 AFG_military_research_boost_desc: "Do výzkumu nových vojenských technologií jsme investovali část našeho rozpočtu." # todo: NEW TRANSLATION
 AFG_political_events.1.t: "[AFG.GetNameDef] Žádost o zbraně" # todo: NEW TRANSLATION
 AFG_political_events.1.d: "[AFG.GetNameDef] vyslal vyslance do [ROOT.capital.GetName], aby vyjednal dohodu, podle níž bychom jim poskytli potřebné vybavení k pokračování v bojových operacích." # todo: NEW TRANSLATION
 AFG_political_events.1.a: "Přijmeme" # todo: NEW TRANSLATION
 AFG_political_events.1.b: "Dnes ne" # todo: NEW TRANSLATION
 AFG_political_events.2.t: "[FROM.GetNameDef] odmítá naši žádost o zbraně" # todo: NEW TRANSLATION
 AFG_political_events.2.d: "[FROM.GetNameDef] zamítl naši žádost o zbraně. Toto odmítnutí nás nezlomí a budeme pokračovat ve svých současných cílech." # todo: NEW TRANSLATION
 AFG_political_events.2.a: "Vpřed" # todo: NEW TRANSLATION
 AFG_political_events.3.t: "[FROM.GetNameDef] podepisuje dodávku zbraní" # todo: NEW TRANSLATION
 AFG_political_events.3.d: "Vyjadřujeme hlubokou vděčnost [FROM.GetNameDef] za poskytnutí tolik potřebného vybavení, na které jsme dlouho čekali." # todo: NEW TRANSLATION
 AFG_political_events.3.a: "Skvělé!" # todo: NEW TRANSLATION
 AFG_political_events.4.t: "První afghánské volby" # todo: NEW TRANSLATION
 AFG_political_events.4.d: "Dnes končí sčítání hlasů. Konečně stojíme na prahu zvolení prvního vůdce Afghánistánu." # todo: NEW TRANSLATION
 AFG_political_events.4.a: "Vláda Hamída Karzáího" # todo: NEW TRANSLATION
 AFG_political_events.4.b: "Naveen" # todo: NEW TRANSLATION
 AFG_political_events.4.c: "Džamáate Islámí" # todo: NEW TRANSLATION
 AFG_political_events.4.e: "Salehova vláda" # todo: NEW TRANSLATION
 AFG_political_events.0.t: "Attá zavádí vojenskou diarchii" # todo: NEW TRANSLATION
 AFG_political_events.0.d: "Attá Muhammad Núr, bývalý velitel mudžáhidínského odboje, vpochodoval se svými silami do Kábulu a požaduje kontrolu nad určitými složkami všech vojenských sil. Většina mužů se přidala k jeho věci, takže naše možnosti jsou přinejmenším značně omezené." # todo: NEW TRANSLATION
 AFG_political_events.0.a: "Máme svázané ruce" # todo: NEW TRANSLATION
 AFG_events.8.t: "[AFG.GetNameDef] žádá o naši ochranu" # todo: NEW TRANSLATION
 AFG_events.8.d: "Po desetiletích nepokojů se afghánská vláda obává obnovení války nebo vnějšího vměšování a invaze. Prezident [AFG.GetNameWithFlag] [AFG.GetLeader] navštívil Bílý dům a požádal našeho prezidenta [USA.GetLeader] o obrannou smlouvu. Pokud souhlasíme s jejich ochranou, zajistíme si jejich začlenění do naší sféry vlivu, ale zároveň budeme mít povinnost bránit [AFG.GetNameWithFlag] před vnějšími hrozbami a pomáhat udržovat stabilitu jejich země, zejména čelit povstání Tálibánu £GFX_AFG_salafist_jihadism. S ohledem na situaci v naší zemi bychom měli s [AFG.GetLeader] podepsat obrannou smlouvu?" # todo: NEW TRANSLATION
 AFG_events.8.a: "Souhlasíme s jejich ochranou." # todo: NEW TRANSLATION
 AFG_events.8.b: "Na tohle nemáme čas!" # todo: NEW TRANSLATION
 AFG_events.9.t: "[USA.GetNameDef] souhlasí s naší ochranou" # todo: NEW TRANSLATION
 AFG_events.9.d: "Díky našemu obezřetnému diplomatickému úsilí prezident [USA.GetNameWithFlag] [USA.GetLeader] formálně podepsal s naším prezidentem [AFG.GetLeader] obrannou smlouvu. Jejím podpisem nás [FROM.GetNameWithFlag] nejen ochrání před vnější agresí, ale také nám poskytne pomoc při udržování vnitřní stability." # todo: NEW TRANSLATION
 AFG_events.9.a: "Výborně!" # todo: NEW TRANSLATION
 AFG_events.10.t: "[USA.GetNameDef] odmítly podepsat!" # todo: NEW TRANSLATION
 AFG_events.10.d: "Přestože náš prezident [AFG.GetLeader] navštívil [USA.GetNameWithFlag] a žádal o bezpečnostní pomoc, [USA.GetLeader] se k jakékoli smlouvě odmítl vyjádřit. [USA.GetLeader] na tiskové konferenci prohlásil: \"Vždy budeme stát za svobodou, demokracií a lidskými právy v Afghánistánu.\" Je však zřejmé, že jeho závazek zůstává pouze u slov. Budeme se muset bránit sami." # todo: NEW TRANSLATION
 AFG_events.10.a: "Jaká katastrofální návštěva..." # todo: NEW TRANSLATION
 AFG_events.11.t: "[AFG.GetNameDef] žádá o naši ochranu" # todo: NEW TRANSLATION
 AFG_events.11.d: "Po desetiletích nepokojů se afghánská vláda obává obnovení války nebo vnějšího vměšování a invaze. Prezident [AFG.GetNameWithFlag] [AFG.GetLeader] navštívil Čung-nan-chaj a požádal generálního tajemníka [CHI.GetLeader] o obrannou smlouvu. Pokud souhlasíme s jejich ochranou, zajistíme si jejich začlenění do naší sféry vlivu, ale zároveň budeme mít povinnost bránit [AFG.GetNameWithFlag] před vnějšími hrozbami a pomáhat udržovat stabilitu země, zejména čelit povstání Tálibánu £GFX_AFG_salafist_jihadism. S ohledem na situaci v naší zemi bychom měli s [AFG.GetLeader] podepsat obrannou smlouvu?" # todo: NEW TRANSLATION
 AFG_events.11.a: "Další železný bratr!" # todo: NEW TRANSLATION
 AFG_events.11.b: "Na smlouvu nemáme co dát!" # todo: NEW TRANSLATION
 AFG_events.12.t: "[CHI.GetNameDef] souhlasí s naší ochranou" # todo: NEW TRANSLATION
 AFG_events.12.d: "Díky našemu diplomatickému úsilí generální tajemník [CHI.GetNameWithFlag] [CHI.GetLeader] formálně podepsal s naším prezidentem [AFG.GetLeader] obrannou smlouvu. Jejím podpisem nás [FROM.GetNameWithFlag] nejen ochrání před vnější agresí, ale také nám poskytne pomoc při udržování vnitřní stability." # todo: NEW TRANSLATION
 AFG_events.12.a: "Výborně!" # todo: NEW TRANSLATION
 AFG_events.13.t: "[CHI.GetNameDef] odmítly podepsat!" # todo: NEW TRANSLATION
 AFG_events.13.d: "Přestože náš prezident [AFG.GetLeader] navštívil [CHI.GetNameWithFlag] a žádal o bezpečnostní pomoc, [CHI.GetLeader] se k jakékoli smlouvě odmítl vyjádřit. [CHI.GetLeader] našemu prezidentovi řekl: \"Vždy budeme oddáni regionální bezpečnosti a stabilitě.\" Je však zřejmé, že jeho závazek zůstává pouze u slov. Budeme se muset bránit sami." # todo: NEW TRANSLATION
 AFG_events.13.a: "Jaké zklamání..." # todo: NEW TRANSLATION
 AFG_events.14.t: "[AFG.GetNameDef] veřejně odsuzuje Durrandovu linii" # todo: NEW TRANSLATION
 AFG_events.14.d: "Před několika okamžiky prezident [AFG.GetNameWithFlag] [AFG.GetLeader] oznámil, že [AFG.GetNameWithFlag] nikdy neuzná Durrandovu linii, kterou Britové ve 20. století svévolně stanovili jako hranici mezi oběma zeměmi, a důrazně prohlásil: \"Možná v tuto chvíli nedokážeme získat zpět naši posvátnou paštunskou zemi, ale naši potomci v dalších generacích ji rozhodně získají zpět, protože nám právem náleží. Čas ukáže vše!\" Je zcela jasné, že [AFG.GetNameWithFlag] nyní zaujímá vůči naší zemi nepřátelskou zahraniční politiku." # todo: NEW TRANSLATION
 AFG_events.14.a: "Nemají pro to vůbec žádné ospravedlnění!" # todo: NEW TRANSLATION
 AFG_events.15.t: "Atentát na Burhánuddína Rabbáního" # todo: NEW TRANSLATION
 AFG_events.15.d: "Dnes večer byl Burhánuddín Rabbání zavražděn při sebevražedném atentátu ve svém domě v Kábulu. Dnes měl také 71. narozeniny. Dva muži vydávající se za představitele Tálibánu se k němu přiblížili s nabídkou objetí a jeden z nich odpálil výbušninu ukrytou ve svém turbanu. Sebevražedný atentátník tvrdil, že je velitelem Tálibánu a že přináší velmi důležitou a pozitivní zprávu od vůdců Tálibánu v Pákistánu. Tvrdili, že Tálibán chce s Rabbáním jednat o míru. Výbuch zabil také čtyři další členy Nejvyšší mírové rady naší vlády. Naše zdroje potvrdily, že za atentát nese odpovědnost kvétská šúra, vedení Tálibánu ukrývající se v pákistánské Kvétě.\n\nRabbání působil jako předseda Nejvyšší mírové rady naší země poté, co opustil vedoucí funkci ve vládě. Během této doby úspěšně přesvědčil stovky bojovníků Tálibánu, aby pokojně složili zbraně. Atentát je pro mírový proces v naší zemi velkou ranou, protože bude obtížné najít někoho s jeho prestiží, kdo by tuto funkci zastával." # todo: NEW TRANSLATION
 AFG_events.15.a: "Uspořádejte státní pohřeb." # todo: NEW TRANSLATION
 AFG_events.16.t: "[AFG.GetNameDef] usiluje o uznání neutrality" # todo: NEW TRANSLATION
 AFG_events.16.d: "[AFG.GetNameDef] se nedávno rozhodl vydat cestou neutrality, aby se stal trvale neutrálním státem. Prokázal ochotu plnit povinnosti trvale neutrální země, ale teprve se ukáže, zda je skutečně splní.\n\nAfghánská vláda nyní žádá naši zemi, aby se stala garantem jejího neutrálního statusu. Pokud souhlasíme, budeme mít povinnost chránit Afghánistán v případě invaze. Pokud odmítneme, mohou jeho status zaručit jiné země a my tím nic neztratíme." # todo: NEW TRANSLATION
 AFG_events.16.a: "Souhlasíme se zárukou jejich statusu neutrální mocnosti" # todo: NEW TRANSLATION
 AFG_events.16.b: "Na Afghánistán nemáme čas" # todo: NEW TRANSLATION
 AFG_events.17.t: "[FROM.GetNameDef] garantuje náš neutrální status" # todo: NEW TRANSLATION
 AFG_events.17.d: "Prohlášení vlády [FROM.GetAdjective] uvádí, že [FROM.GetNameDef] je ochoten garantovat náš neutrální status a přijde nám na pomoc v případě vnější invaze do naší země.\n\nJde o významný úspěch, neboť jsme získali uznání neutrality alespoň od jednoho stálého člena Rady bezpečnosti OSN." # todo: NEW TRANSLATION
 AFG_events.17.a: "Výborně!" # todo: NEW TRANSLATION
 AFG_events.18.t: "Afghánský lid povstává proti Tálibánu" # todo: NEW TRANSLATION
 AFG_events.18.d: "Po operaci Trvalá svoboda zahájily milice několika kmenových a etnických menšin povstání proti Tálibánu, zejména v Herátu. S pomocí Spojených států a Íránu tyto milice převzaly kontrolu nad několika oblastmi od Tálibánu a připojily se pod velení Severní aliance.\n\nMístní obyvatelé povstání přivítali oslavnou střelbou. Některé oslavy dokonce zahrnovaly „tanec na střechách“ a troubení automobilů. Mohammad Ismail Khan, jeden z hlavních velitelů Severní aliance známý také jako „Herátský lev“, udělil bývalým bojovníkům Tálibánu amnestii, varoval však před následky, pokud by znovu pozvedli zbraně." # todo: NEW TRANSLATION
 AFG_events.18.a: "Vítězství je blízko!" # todo: NEW TRANSLATION
 AFG_news.7.t: "[AFG.GetNameDef] vznáší nároky na pákistánské území" # todo: NEW TRANSLATION
 AFG_news.7.d: "Před několika okamžiky prezident [AFG.GetNameWithFlag] [AFG.GetLeader] oznámil, že [AFG.GetNameWithFlag] nikdy neuzná Durrandovu linii, kterou Britové ve 20. století svévolně stanovili jako hranici mezi oběma zeměmi, a důrazně prohlásil: \"Možná v tuto chvíli nedokážeme získat zpět naši posvátnou paštunskou zemi, ale naši potomci v dalších generacích ji rozhodně získají zpět, protože nám právem náleží. Čas ukáže vše!\" Prezident [PAK.GetNameWithFlag] [PAK.GetLeader] odpověděl odmítnutím všech nároků vznesených [AFG.GetLeader] a tento krok ostře kritizoval: \"Nepřátelské diplomatické kroky [AFG.GetLeader] nepřinesou nic jiného než další poškození vztahů mezi našimi dvěma zeměmi.\" Zároveň vyzval afghánskou vládu k respektování mezinárodního práva. Je zcela jasné, že diplomatické vztahy mezi oběma zeměmi se dále zhoršily." # todo: NEW TRANSLATION
 AFG_news.7.a: "Uvidíme, co bude dál." # todo: NEW TRANSLATION
 AFG_news.8.t: "Převrat v Afghánistánu" # todo: NEW TRANSLATION
 AFG_news.8.d: "Kvůli korupci ústřední vlády, ekonomickému strádání a chudobě obyvatel se mnoho Afghánců, kteří přišli o živobytí a byli nespokojeni se současným stavem, připojilo k Hekmatjárovu Hezb-e Islámí £GFX_AFG_kingdom. Skupina afghánských důstojníků, kteří dlouho nedostávali plat, provedla převrat, svrhla republikánskou vládu, pozastavila platnost současné afghánské ústavy a dočasně zavedla vojenskou správu. Gulbuddín Hekmatjár, který v 90. letech dvakrát působil jako afghánský premiér, oficiálně ukončil svůj exil a vrátil se do Afghánistánu jako jeho nový prezident. Hekmatjár slíbil vymýtit korupci, oživit ekonomiku a vést afghánský lid do nové kapitoly. V reakci na převrat vydal mluvčí Tálibánu prohlášení: \"My jsme skuteční Afghánci a budeme Hekmatjára, ‚Kábulského řezníka‘, nadále likvidovat.\"" # todo: NEW TRANSLATION
 AFG_news.8.a: "Další kapitola nekonečné války..." # todo: NEW TRANSLATION
 AFG_news.9.t: "[AFG.GetNameDef] nasazuje armádu do měst" # todo: NEW TRANSLATION
 AFG_news.9.d: "Kvůli nedávné radikální politice vlády [AFG.GetLeader], jako je potlačování politických a osobních svobod, zavádění šaríi v talibanském stylu a odstraňování kmenového vlivu, vypukl proti vládnoucí vládě rozsáhlý protest. Vláda [AFG.GetLeader] reagovala nasazením vojáků do měst a obcí a někteří demonstranti byli smrtelně postřeleni vojáky Afghánské národní armády nebo jednotkami Afghánské národní policie. Zdá se, že [AFG.GetNameDef] upadá do totalitarismu." # todo: NEW TRANSLATION
 AFG_news.9.a: "Tohle je v Afghánistánu každodenní život..." # todo: NEW TRANSLATION
 AFG_news.10.t: "Atentát na Burhánuddína Rabbáního" # todo: NEW TRANSLATION
 AFG_news.10.d: "Burhánuddín Rabbání byl dnes večer zavražděn při sebevražedném atentátu ve svém domě v Kábulu. Dva sebevražední atentátníci vydávající se za představitele Tálibánu, kteří tvrdili, že chtějí s Rabbáním jednat o míru, se k němu přiblížili s nabídkou objetí a jeden z nich odpálil výbušninu ve svém turbanu. Výbuch zabil také čtyři další členy Nejvyšší mírové rady Afghánistánu.\n\nRabbání působil jako předseda afghánské Nejvyšší mírové rady poté, co opustil vedoucí funkci ve vládě. Během této doby úspěšně přesvědčil stovky bojovníků Tálibánu, aby pokojně složili zbraně. Jeho atentát je velkou ranou pro mírový proces v Afghánistánu." # todo: NEW TRANSLATION
 AFG_news.10.a: "Tragická zpráva." # todo: NEW TRANSLATION
 AFG_news.11.t: "Únos letu Ariana Airlines 805" # todo: NEW TRANSLATION
 AFG_news.11.d: "Skupina devíti Afghánců vedená bratry Alim a Mohammedem Safi, kteří prchali před režimem Tálibánu, unesla let Ariana Afghan Airlines 805, letoun Boeing 727 s registrací YA-FAY, na jehož palubě bylo 180 cestujících a 7 členů posádky. Let 805 byl vnitrostátní linkou z Kábulu na letiště Mazár-e Šaríf.\n\nÚnosci donutili posádku letět na letiště London Stansted ve Spojeném království s mezipřistáními v Taškentu, Aktöbe a Moskvě. Obléhání letadla trvalo až do 10. února. Zda budou únosci odsouzeni, není známo, protože čekají na soudní proces v příštím roce." # todo: NEW TRANSLATION
 AFG_news.11.a: "Měli jsme je zachytit jedním z našich MiGů." # todo: NEW TRANSLATION
 AFG_news.12.t: "Únos letu Ariana Airlines 805" # todo: NEW TRANSLATION
 AFG_news.12.d: "Skupina devíti Afghánců vedená bratry Alim a Mohammedem Safi, kteří prchali před režimem Tálibánu, unesla let Ariana Afghan Airlines 805, letoun Boeing 727 s registrací YA-FAY, na jehož palubě bylo 180 cestujících a 7 členů posádky. Let 805 byl vnitrostátní linkou z Kábulu na letiště Mazár-e Šaríf.\n\nÚnosci donutili posádku letět na letiště London Stansted ve Spojeném království s mezipřistáními v Taškentu, Aktöbe a Moskvě. Obléhání letadla trvalo až do 10. února. Zda budou únosci odsouzeni, není známo, protože čekají na soudní proces v příštím roce." # todo: NEW TRANSLATION
 AFG_news.12.a: "Zajímavé" # todo: NEW TRANSLATION
 AFG_news.12.b: "Terorismus je metlou lidstva." # todo: NEW TRANSLATION
 AFG_news.13.t: "Írán posílá uprchlíky zpět do Afghánistánu" # todo: NEW TRANSLATION
 AFG_news.13.d: "Po dosažení dohody s UNHCR zahájil Írán repatriační program, v jehož rámci se během následujících tří týdnů vrátí do vlasti 7 700 afghánských uprchlíků." # todo: NEW TRANSLATION
 AFG_news.13.a: "Má tato válka vůbec konec?" # todo: NEW TRANSLATION
 AFG_news.14.t: "Válka v Afghánistánu připravuje tisíce lidí o jídlo" # todo: NEW TRANSLATION
 AFG_news.14.d: "Světový potravinový program oznámil, že situace způsobená suchem v provinciích Kandahár a Zábul je zoufalá. Kočovní Kúčíové přišli až o 80 % svého dobytka a zavlažovací systémy vybudované ke shromažďování dešťové vody vyschly. Meruňkové a mandlové stromy uschly a nenesly ovoce. Umírali velbloudi. Od února WFP v regionu zásoboval potravinami 30 000 rodin a v květnu plánoval přidat dalších 10 000. WFP nabízel Afgháncům další mouku jako pobídku, aby zůstali ve svých vesnicích." # todo: NEW TRANSLATION
 AFG_news.14.a: "Afghánský lid nás potřebuje." # todo: NEW TRANSLATION
 AFG_events.32.t: "Pevnost zvaná Talokán padla" # todo: NEW TRANSLATION
 AFG_events.32.d: "Nelítostné dobytí města Tálibánem vyvolalo masový exodus, když civilisté prchali směrem k Imám Sáhibu a údolí Pandžšíru. Po brutálním obléhání, které si vyžádalo stovky civilních životů, naši vojáci zastavili postup Tálibánu na sever a východ od města, ale nedokázali je znovu dobýt. Opustili jsme velitelství Severní aliance ve městě a přesunuli základnu operací do Fajzábádu." # todo: NEW TRANSLATION
 AFG_events.32.a: "Temný den" # todo: NEW TRANSLATION
 AFG_events.31.t: "Talokán odolává další den" # todo: NEW TRANSLATION
 AFG_events.31.d: "Po brutálním obléhání utrpěl Tálibán porážku. Toto vítězství odráží odolnost našich předchozích vítězství. Ať je to další krok k definitivnímu zániku Tálibánu, neboť: \"Talakán je místem pokladů Alláha. Tyto poklady nejsou ze zlata a stříbra, ale skládají se z lidí, kteří poznali Alláha tak, jak měli.\"" # todo: NEW TRANSLATION
 AFG_events.31.a: "Temný den" # todo: NEW TRANSLATION
 AFG_investment.1.t: "[AFG.GetNameDef] nás zve k investicím do svých projektů" # todo: NEW TRANSLATION
 AFG_investment.1.desc: "Vláda [AFG.GetNameWithFlag], která se nedávno zotavila z války proti Tálibánu, nás zve k investicím do některých projektů ve své zemi. Zda investovat, je však na nás. Pokud se rozhodneme investovat, můžeme získat určitý vliv na jejich vládu; pokud hrozba terorismu v Afghánistánu zůstává vysoká, bude lepší neriskovat." # todo: NEW TRANSLATION
 AFG_investment.1.a: "Investujte do jejich infrastruktury!" # todo: NEW TRANSLATION
 AFG_investment.1.b: "Investujte do jejich civilního průmyslu!" # todo: NEW TRANSLATION
 AFG_investment.1.c: "Investujte do jejich sektoru služeb!" # todo: NEW TRANSLATION
 AFG_investment.1.d: "Raději to nebudeme riskovat." # todo: NEW TRANSLATION
 AFG_investment.2.t: "[FROM.GetNameDef] investoval do naší infrastruktury!" # todo: NEW TRANSLATION
 AFG_investment.2.d: "Po několika dnech vyjednávání [FROM.GetNameWithFlag] souhlasil s investicí do naší infrastruktury výměnou za několik menších ústupků. Investice prospěje venkovskému obyvatelstvu naší země." # todo: NEW TRANSLATION
 AFG_investment.2.a: "Jsme za jejich pomoc vděční!" # todo: NEW TRANSLATION
 AFG_investment.3.t: "[FROM.GetNameDef] investoval do našeho civilního průmyslu!" # todo: NEW TRANSLATION
 AFG_investment.3.d: "Po několika dnech vyjednávání [FROM.GetNameWithFlag] souhlasil s pomocí při výstavbě několika civilních továren výměnou za několik menších ústupků. Investice prospěje průmyslovému sektoru naší země a usnadní její modernizaci." # todo: NEW TRANSLATION
 AFG_investment.3.a: "Jsme za jejich pomoc vděční!" # todo: NEW TRANSLATION
 AFG_investment.4.t: "[FROM.GetNameDef] investoval do našeho sektoru služeb!" # todo: NEW TRANSLATION
 AFG_investment.4.d: "Po několika dnech vyjednávání [FROM.GetNameWithFlag] souhlasil s investicí do našeho sektoru služeb prostřednictvím výstavby několika kanceláří výměnou za několik menších ústupků. Investice prospěje finančnímu sektoru naší země a usnadní její modernizaci." # todo: NEW TRANSLATION
 AFG_investment.4.a: "Jsme za jejich pomoc vděční!" # todo: NEW TRANSLATION
 AFG_investment.5.t: "[FROM.GetNameDef] odmítl investovat!" # todo: NEW TRANSLATION
 AFG_investment.5.d: "Po několika dnech vyjednávání [FROM.GetNameWithFlag] odmítl naši investiční nabídku s tím, že podnikatelské prostředí v naší zemi zatím není dostatečně bezpečné, a budoucí investiční dohody s námi bude pečlivě posuzovat." # todo: NEW TRANSLATION
 AFG_investment.5.a: "Zdá se, že musíme ještě zapracovat!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.0.t: "Začátek povstání Tálibánu" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.0.d: "Po zhroucení hlavních sil Tálibánu se jejich prapory rozpadly do různých odštěpeneckých buněk, které zahájily partyzánskou válku v každém koutě Afghánistánu a začaly páchat odporné teroristické útoky. Odhaduje se, že potlačení povstání potrvá řadu let, ale pokud nezasáhneme, v naší zemi nikdy nebude stabilita." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.0.a: "Je čas dát se do práce!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.1.t: "Úspěšný nájezd na úkryt Tálibánu" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.1.d: "Díky našim statečným komandům byl objevený úkryt Tálibánu zničen. Někteří bojovníci Tálibánu se pokusili klást odpor, ale naše komanda je zabila, zatímco většina ostatních se vzdala a jen málokomu se podařilo uniknout spravedlnosti. Celkově byla operace naprostým úspěchem!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.1.a: "Výborně!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.2.t: "Neúspěšný nájezd" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.2.d: "Neschopnost nájezd přesvědčivě dokončit zasadila naší protiteroristické jednotce komand velkou ránu. Zdálo se, že Tálibán znal naše plány předem, a proto zahájil preventivní útok na některé naše konvoje. Na naši plánovanou trasu rozmístil improvizovaná výbušná zařízení a po výbuchu přepadl naše komanda. Několik komandérů při tom bohužel zahynulo.\n\nPři následném rozboru někteří vojenští generálové vyslovili podezření, že mezi organizátory operace mohli být sympatizanti, kteří plán vyzradili Tálibánu. Zpráva z rozboru také kritizovala vládní korupci, která mohla vést ke ztrátě životů komandérů. Musíme toto selhání přezkoumat a poučit se z něj!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.2.a: "Čest památce našich hrdinů!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.3.t: "Letecký úder úspěšný" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.3.d: "Dobré zprávy! Protipovstalecký letoun našeho letectva, pilotovaný jedním z našich zkušených vojáků, úspěšně zničil tábor Tálibánu na základě souřadnic poskytnutých naší zpravodajskou službou. Tábor byl zcela zničen a zahynulo v něm mnoho bojovníků Tálibánu.\n\nTento úspěch ukázal účinnost vnitřního bezpečnostního sektoru naší zpravodajské služby a dokazuje, že technologie bude v budoucích protipovstaleckých operacích zásadní." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.3.a: "Velký úspěch!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.4.t: "Letecký úder zabil civilisty" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.4.d: "Hrozné zprávy! Naše letectvo bombardovalo cíl na základě souřadnic poskytnutých naší zpravodajskou službou, nyní je však zřejmé, že bomby zasáhly civilní cíle a místo zamýšlených bojovníků Tálibánu zabily nevinné civilisty.\n\nMístní obyvatelstvo truchlí a je právem rozhořčeno tímto neúspěšným zásahem. Z oblasti již přicházejí zprávy o protestech. Musíme přezkoumat důvody selhání této konkrétní operace, abychom mohli občanům podat vysvětlení." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.4.a: "Tragédie!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.5.t: "Bojovníci Tálibánu sestřelili letoun" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.5.d: "Tragické zprávy z operace leteckého úderu! Jeden z našich protipovstaleckých letounů sestřelili bojovníci Tálibánu pomocí přenosné protiletadlové střely; pilot při tom zahynul.\n\nToto operační selhání ukázalo, že musíme pro budoucí operace reorganizovat naše letectvo a získávat lepší informace o cílech Tálibánu." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.5.a: "Hrdinskému pilotovi budiž země lehká!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.6.t: "Úspěch propagandy jednoty" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.6.d: "Díky našemu úsilí o propagandu jednoty přišli někteří bojovníci Tálibánu na kontrolní stanoviště policie a armády a složili zbraně. Někteří objímali naše vojáky a místní policisty. Naši vojáci a policisté jim nečinili potíže; naopak dali mnoha bojovníkům Tálibánu, kteří složili zbraně, peníze na cestu domů. To posílilo důvěru veřejnosti ve vládu i národní jednotu." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.6.a: "Úspěšný vývoj!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.7.t: "Selhání propagandy jednoty" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.7.d: "Naši vládu velmi zklamalo, že naše nedávné úsilí o propagandu jednoty nepřineslo pozitivní výsledky. Podle některých velitelů Tálibánu z nižších řad považuje vedení Tálibánu současnou afghánskou vládu za vládu zlodějů, loutku cizí vlády a vůbec ne za představitele afghánského národa. Sami sebe považují za skutečné Afghánce." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.7.a: "Možná bychom měli udělat více..." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.8.t: "Zničení povstání Tálibánu" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.8.d: "Afghánská vláda před několika hodinami oficiálně potvrdila, že úspěšně zlikvidovala povstání Tálibánu. Podle informací zveřejněných afghánskou vládou naprostá většina bojovníků Tálibánu pokojně složila zbraně a vrátila se domů.\n\nNěkolik zocelených bojovníků Tálibánu uprchlo přes afghánsko-pákistánskou hranici do pákistánských kmenových oblastí a připojilo se k místním ozbrojeným skupinám. Jelikož afghánská vláda dostatečně zabezpečila afghánsko-pákistánskou hranici, je nepravděpodobné, že by se bojovníci usazení v Pákistánu přes hranici znovu infiltrovali." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.8.a: "Skončil konečně tento dlouhotrvající konflikt?" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.10.t: "Tálibán zahajuje rozsáhlé povstání" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.10.d: "Nedávný nárůst útoků Tálibánu a zesílení násilí poskytly Tálibánu příležitost znovu povýšit povstání na občanskou válku. Tálibán ovládl rozsáhlou část venkovského území a vytvořil hlavní jihozápadní opěrný bod, zatímco některé další venkovské oblasti rovněž padly pod jeho nadvládu.\n\nV malé části Afghánské národní armády začali vojáci dezertovat a někteří z těchto dezertérů se připojili k Tálibánu. Většina však zůstala a rozhodla se proti Tálibánu bojovat, protože se obávala jeho likvidace.\n\nZda nás mezinárodní společenství podpoří, zůstává nejisté, ale musíme shromáždit vojáky a bojovat za vítězství." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.10.a: "Nemáme na výběr, musíme bojovat!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.11.t: "Tálibán zahajuje rozsáhlé povstání" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.11.d: "Nedávný nárůst útoků Tálibánu a zesílení násilí poskytly Tálibánu příležitost znovu povýšit povstání na občanskou válku. Tálibán ovládl rozsáhlou část venkovského území a vytvořil hlavní jihozápadní opěrný bod, zatímco některé další venkovské oblasti rovněž padly pod jeho nadvládu.\n\nV malé části Afghánské národní armády začali vojáci dezertovat a někteří z těchto dezertérů se připojili k Tálibánu. Většina však zůstala a rozhodla se proti Tálibánu bojovat, protože se obávala jeho likvidace.\n\nAfghánský vůdce [AFG.GetLeader] oznámil, že povstání bude rozdrceno, a slíbil, že bude bojovat až do nastolení míru." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.11.a: "Afghánistán je znovu ve válce..." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.14.t: "Situace v Afghánistánu" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.14.d: "Víme, že nám afghánská vláda dovolila rozmístit vojáky na svém území, ale naše vojenská zpravodajská služba varuje, že Tálibán v současnosti vede povstání v každém koutě Afghánistánu a že nestabilní situace v zemi využívá množství dalších teroristických skupin. Teroristická hrozba dosáhla kritické úrovně, která může představovat skutečné nebezpečí pro naše tamní vojáky.\n\nPokud budeme své vojáky v Afghánistánu nadále držet, pravděpodobně se stanou cílem Tálibánu a dalších teroristických skupin působících v zemi. Pokud však zůstaneme, můžeme se rozhodnout pomáhat afghánským vládním silám s jejich protipovstaleckými operacemi. Rozhodneme-li se tak učinit, naše armáda může získat cenné zkušenosti, například s různými technikami protipovstaleckého a protipartyzánského boje, a může chránit naše občany v Afghánistánu.\n\n[ROOT.GetLeader], pokud se rozhodnete ponechat vojáky v Afghánistánu, nebudeme vám bránit, ale pečlivě zvažte, zda to skutečně stojí za riziko." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.14.a: "Přispějeme k afghánskému protipovstaleckému úsilí." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.14.b: "Raději nebudeme riskovat životy našich vojáků." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.15.t: "[FROM.GetNameDef] se připojuje k našemu boji" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.15.d: "[FROM.GetLeader], vůdce [FROM.GetNameDef], informoval naši vládu, že jednotky [FROM.GetAdjective] rozmístěné v naší zemi jsou ochotny připojit se k našemu boji proti Tálibánu a zároveň chránit své občany v naší zemi.\n\n[FROM.GetName] nám navíc poskytne bezpečnostní pomoc, například zařízení k detekci výbušnin a další modernější vojenské vybavení." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.15.a: "Jsme za pomoc vděční!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef] zahajuje stahování vojsk" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.16.d: "[FROM.GetLeader], vůdce [FROM.GetNameDef], informoval naši vládu, že jednotky [FROM.GetAdjective] rozmístěné v naší zemi dokončily svou misi a vojáci se vracejí domů.\n\nVelitel jednotek [FROM.GetAdjective] v naší zemi již zahájil proces předávání základen našim velitelům." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.16.a: "Sbohem!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.17.t: "Úspěšný nájezd na úkryt Tálibánu" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.17.d: "Díky našim statečným komandům byl objevený úkryt Tálibánu zničen. Někteří bojovníci Tálibánu se pokusili klást odpor, ale naše komanda je zabila, zatímco většina ostatních se vzdala a jen málokomu se podařilo uniknout spravedlnosti. Celkově byla operace naprostým úspěchem!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.17.a: "Výborně!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.18.t: "Neúspěšný nájezd" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.18.d: "Neschopnost nájezd přesvědčivě dokončit zasadila naší protiteroristické jednotce komand velkou ránu. Zdálo se, že Tálibán znal naše plány předem, a proto zahájil preventivní útok na některé naše konvoje. Na naši plánovanou trasu rozmístil improvizovaná výbušná zařízení a po výbuchu přepadl naše komanda. Několik komandérů při tom bohužel zahynulo.\n\nPři následném rozboru někteří vojenští generálové vyslovili podezření, že mezi organizátory operace mohli být sympatizanti, kteří plán vyzradili Tálibánu. Zpráva z rozboru také kritizovala vládní korupci, která mohla vést ke ztrátě životů komandérů. Musíme toto selhání přezkoumat a poučit se z něj!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.18.a: "Čest jejich památce!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.21.t: "Úder dronem úspěšný" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.21.d: "Náš úder dronem proti Tálibánu byl úspěšný! Náš dron dokázal odhalit, zasáhnout a zničit několik úkrytů Tálibánu poblíž městské oblasti, ochromil jeho vojenské schopnosti v daném prostoru a dočasně zcela dezorganizoval místní velitelskou strukturu.\n\nMístní obyvatelstvo bylo zpočátku úderem dronů vyděšeno, nyní však oslavuje ústup povstalců Tálibánu, alespoň prozatím." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.21.a: "Drony jsou budoucností válčení!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.22.t: "Neúspěšný úder dronem zabil civilisty" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.22.d: "Dnes jeden z našich dronů zaměřil a zničil to, co vypadalo jako úkryt Tálibánu poblíž obytné oblasti. Nedávné zpravodajské zprávy však dospěly k závěru, že zasažená budova byla ve skutečnosti malým bytovým domem obývaným civilisty.\n\nMédia již o incidentu informují a mnoho skupin kritizuje naši účast v této válce." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.22.a: "Byla to technická chyba!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.23.t: "Bombardovací operace úspěšná" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.23.d: "Podle zpravodajských zpráv dnes jeden z našich strategických bombardérů zničil komplex tunelů Tálibánu ukrytý v horách východního Afghánistánu.\n\nNaše úspěšná bombardovací kampaň začíná ochromovat operace Tálibánu v odlehlých oblastech země a zhroucení jeho infrastruktury ho časem donutí ke kapitulaci." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.23.a: "Džihádisté se naučí bát naší vzdušné síly!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.24.t: "Chybné bombardování zabilo civilisty" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.24.d: "Dnes došlo ke katastrofálnímu incidentu!\n\nNaše letectvo bombardovalo horskou oblast ve východním Afghánistánu, dokud jsme nezjistili, že se v oblasti nenachází žádný tábor Tálibánu, nýbrž malá vesnice mezi horami. Vesnice byla v důsledku našeho náletu zcela zničena.\n\nDůvěryhodnost naší letecké kampaně byla vážně zpochybněna. Naši politici a vojenské velení čelí obvinění z válečných zločinů proti afghánskému lidu." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.24.a: "To je strašné!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef] poskytuje technické vybavení" # todo: NEW TRANSLATION
 AFG_taliban_insurgency.25.d: "Vzkaz vlády [FROM.GetAdjective] našemu vedení uvádí, že [FROM.GetNameDef] nám poskytne technické vybavení pro boj proti povstalcům, včetně zařízení k detekci výbušnin, která lze instalovat na dálnicích nebo u vchodů, psů speciálně vycvičených k odhalování skrytých výbušnin a další elektroniky ke zvýšení účinnosti naší armády a policie při boji proti povstání Tálibánu.\n\nOčekává se, že vybavení dorazí do měsíce a snad alespoň na krátkou dobu zpomalí růst povstání Tálibánu." # todo: NEW TRANSLATION
 AFG_taliban_insurgency.25.a: "Jsme za pomoc vděční!" # todo: NEW TRANSLATION
 AFG_taliban_attack.0.t: "Bojovníci Tálibánu útočí na místní policejní stanici" # todo: NEW TRANSLATION
 AFG_taliban_attack.0.d: "Dnes skupina bojovníků Tálibánu bez varování přepadla jedno z policejních kontrolních stanovišť naší vlády. Naše policejní síly byly zcela nepřipravené a zaskočené, bojovaly však statečně, dokud jejich nadřízení nenařídili evakuaci stanoviště.\n\nBojovníci Tálibánu kontrolní stanoviště obsadili, dokud nebyla informována armáda, která poskytla našim policistům podporu. V muničním skladu stanoviště byly zbraně, které Tálibán zabavil. Během útoku naše policejní a vojenské síly zabily několik bojovníků Tálibánu, ale naše policie přišla o několik statečných důstojníků." # todo: NEW TRANSLATION
 AFG_taliban_attack.0.a: "Za to zaplatí!" # todo: NEW TRANSLATION
 AFG_taliban_attack.1.t: "Afghánský Tálibán útočí na policejní stanici" # todo: NEW TRANSLATION
 AFG_taliban_attack.1.d: "Dnes skupina bojovníků afghánského Tálibánu bez varování přepadla jedno z policejních kontrolních stanovišť afghánské vlády. Afghánské policejní síly byly zcela nepřipravené a zaskočené, bojovaly však statečně, dokud jejich nadřízení nenařídili evakuaci stanoviště.\n\nBojovníci Tálibánu kontrolní stanoviště obsadili, dokud nebyla informována afghánská armáda, která policii poskytla podporu. V muničním skladu stanoviště byly zbraně, které Tálibán zabavil. Během útoku afghánské policejní a vojenské síly zabily několik bojovníků Tálibánu, ale policie přišla o několik statečných důstojníků." # todo: NEW TRANSLATION
 AFG_taliban_attack.1.a: "Znepokojivý vývoj." # todo: NEW TRANSLATION
 AFG_taliban_attack.2.t: "Tálibán odpaluje bombu v autobuse" # todo: NEW TRANSLATION
 AFG_taliban_attack.2.d: "Dnes skupina bojovníků Tálibánu donutila nákladním vozem zastavit autobus, kalašnikovy postřílela civilisty uvnitř a poté poblíž autobusu odpálila bombu v automobilu. Po příjezdu vojenské policie bojovníci Tálibánu uprchli. Někteří byli zastřeleni, zatímco ti, kterým se nepodařilo uniknout, byli zajati a odvedeni k vojenské policii k výslechu.\n\nZ výsledků výslechu a následného vyšetřování víme, že teroristický útok byl záměrně namířen proti turistům a cizincům. Tálibán vypsal odměnu za zabíjení cizinců v Afghánistánu. Útok si vyžádal také oběti mezi zahraničními občany a země postižených již požadují, aby naše vláda provedla úplné vyšetřování." # todo: NEW TRANSLATION
 AFG_taliban_attack.2.a: "Musíme tyto teroristy z Tálibánu dopadnout!" # todo: NEW TRANSLATION
 AFG_taliban_attack.3.t: "Bomba Tálibánu v autobuse zabila naše občany" # todo: NEW TRANSLATION
 AFG_taliban_attack.3.d: "Dnes skupina bojovníků afghánského Tálibánu donutila nákladním vozem zastavit autobus, kalašnikovy postřílela civilisty uvnitř a poté poblíž autobusu odpálila bombu v automobilu. Po příjezdu afghánské vojenské policie bojovníci Tálibánu uprchli. Někteří byli zastřeleni, zatímco ti, kterým se nepodařilo uniknout, byli zajati a odvedeni k vojenské policii k výslechu.\n\nÚtok si vyžádal také oběti mezi našimi občany. Náš velvyslanec v Afghánistánu kontaktoval afghánské představitele, aby se pokusil řešit následky." # todo: NEW TRANSLATION
 AFG_taliban_attack.3.a: "Pošlete soustrast rodinám obětí!" # todo: NEW TRANSLATION
 AFG_taliban_attack.4.t: "Cizinci zabiti při bombovém útoku Tálibánu na autobus" # todo: NEW TRANSLATION
 AFG_taliban_attack.4.d: "Dnes skupina bojovníků afghánského Tálibánu donutila nákladním vozem zastavit autobus, kalašnikovy postřílela civilisty uvnitř a poté poblíž autobusu odpálila bombu v automobilu. Po příjezdu afghánské vojenské policie bojovníci Tálibánu uprchli. Někteří byli zastřeleni, zatímco ti, kterým se nepodařilo uniknout, byli zajati a odvedeni k vojenské policii k výslechu.\n\nÚtok si vyžádal oběti mezi místními Afghánci i zahraničními občany a vyvolal široké odsouzení mezinárodního společenství." # todo: NEW TRANSLATION
 AFG_taliban_attack.4.a: "Pošlete obětem soustrast!" # todo: NEW TRANSLATION
 AFG_taliban_attack.5.t: "Tálibán útočí na konvoj cisteren s palivem" # todo: NEW TRANSLATION
 AFG_taliban_attack.5.d: "Dnes bojovníci Tálibánu napadli konvoj cisteren s palivem, které měly dodat životně důležité palivo armádě a vojenské policii. Bojovníci Tálibánu cisterny zapálili a jejich řidiče unesli. Jejich osud zatím není znám.\n\nZatím nejsou hlášeny žádné oběti mezi místními obyvateli, ale cisterny zcela shořely a okolní silnice armáda z bezpečnostních důvodů úplně uzavřela. Očekává se, že návrat života místních obyvatel k normálu potrvá nějakou dobu." # todo: NEW TRANSLATION
 AFG_taliban_attack.5.a: "Musíme ty řidiče zachránit!" # todo: NEW TRANSLATION
 AFG_taliban_attack.6.t: "Afghánský Tálibán pálí cisterny s palivem" # todo: NEW TRANSLATION
 AFG_taliban_attack.6.d: "Dnes bojovníci afghánského Tálibánu napadli konvoj cisteren s palivem, které měly dodat životně důležité palivo armádě a vojenské policii. Bojovníci Tálibánu cisterny zapálili a jejich řidiče unesli. Jejich osud zatím není znám.\n\nZatím nejsou hlášeny žádné oběti mezi místními obyvateli, ale cisterny zcela shořely a okolní silnice armáda z bezpečnostních důvodů úplně uzavřela. Očekává se, že návrat života místních obyvatel k normálu potrvá nějakou dobu." # todo: NEW TRANSLATION
 AFG_taliban_attack.6.a: "Afghánistán je skutečně nebezpečné místo..." # todo: NEW TRANSLATION
 AFG_taliban_attack.7.t: "Tálibán útočí na vojenský konvoj" # todo: NEW TRANSLATION
 AFG_taliban_attack.7.d: "Dnes bojovníci Tálibánu zahájili šokující sebevražedný bombový útok proti jednomu z našich vojenských konvojů. Bojovníci Tálibánu přijeli ve dvou automobilech a oba odpálili, když se přiblížili k vojenským nákladním vozům.\n\nSebevražedný útok vedl k výraznému poškození několika vojenských nákladních vozů tlakovou vlnou a způsobil několik obětí mezi našimi vojáky. Naštěstí většina našich vojáků utrpěla pouze zranění; bojovníci Tálibánu zapojení do útoku však okamžitě zahynuli vlastními bombami." # todo: NEW TRANSLATION
 AFG_taliban_attack.7.a: "Musíme zpřísnit kontroly vozidel!" # todo: NEW TRANSLATION
 AFG_taliban_attack.8.t: "Sebevražedný útok Tálibánu zasáhl afghánskou armádu" # todo: NEW TRANSLATION
 AFG_taliban_attack.8.d: "Dnes bojovníci afghánského Tálibánu zahájili šokující sebevražedný bombový útok proti jednomu z vojenských konvojů Afghánistánu. Bojovníci Tálibánu přijeli ve dvou automobilech a oba odpálili, když se přiblížili k vojenským nákladním vozům.\n\nSebevražedný útok vedl ke zničení několika vojenských nákladních vozů tlakovou vlnou a způsobil několik obětí mezi vojáky afghánské armády. Bojovníci Tálibánu zapojení do útoku však okamžitě zahynuli vlastními bombami." # todo: NEW TRANSLATION
 AFG_taliban_attack.8.a: "Jak to mohla afghánská armáda dopustit?" # todo: NEW TRANSLATION
 AFG_taliban_attack.9.t: "Tálibán útočí na zahraniční vojska" # todo: NEW TRANSLATION
 AFG_taliban_attack.9.d: "Dnes se bojovník Tálibánu převlečený za místního obyvatele nenápadně přiblížil ke konvoji zahraničních vojáků vyslaných do naší země a odpálil bombu ukrytou ve svém turbanu. Přestože při prvním výbuchu nebyl nikdo zraněn, další skupina bojovníků Tálibánu využila chaosu způsobeného výbuchem a pomocí RPG odpálila rakety na zahraniční vojáky.\n\nSituace se uklidnila po příjezdu vojenských posil, ale tento útok si bohužel vyžádal mnoho obětí a několik vojenských vozidel bylo zničeno." # todo: NEW TRANSLATION
 AFG_taliban_attack.9.a: "Sakra" # todo: NEW TRANSLATION
 AFG_taliban_attack.10.t: "Naši vojáci zabiti při útoku Tálibánu" # todo: NEW TRANSLATION
 AFG_taliban_attack.10.d: "Dnes se bojovník Tálibánu převlečený za místního obyvatele nenápadně přiblížil ke konvoji zahraničních vojáků vyslaných do naší země a odpálil bombu ukrytou ve svém turbanu. Přestože při prvním výbuchu nebyl nikdo zraněn, další skupina bojovníků Tálibánu využila chaosu způsobeného výbuchem a pomocí RPG odpálila rakety na zahraniční vojáky.\n\nSituace se uklidnila po příjezdu posil, ale tento útok si bohužel vyžádal mnoho obětí mezi našimi vojáky a několik vojenských vozidel bylo zničeno. Náš místní velitel je v kontaktu s veliteli afghánské armády, aby se vypořádali s následky." # todo: NEW TRANSLATION
 AFG_taliban_attack.10.a: "Pošlete soustrast padlým vojákům!" # todo: NEW TRANSLATION
 AFG_taliban_attack.11.t: "Zahraniční vojáci zabiti při útoku Tálibánu" # todo: NEW TRANSLATION
 AFG_taliban_attack.11.d: "Dnes se bojovník Tálibánu převlečený za místního obyvatele nenápadně přiblížil ke konvoji zahraničních vojáků vyslaných do naší země a odpálil bombu ukrytou ve svém turbanu. Přestože při prvním výbuchu nebyl nikdo zraněn, další skupina bojovníků Tálibánu využila chaosu způsobeného výbuchem a pomocí RPG odpálila rakety na zahraniční vojáky.\n\nSituace se uklidnila po příjezdu vojenských posil, ale tento útok si vyžádal mnoho obětí a několik vojenských vozidel bylo zničeno." # todo: NEW TRANSLATION
 AFG_taliban_attack.11.a: "Proč nedokážou Tálibán zlikvidovat?" # todo: NEW TRANSLATION
 AFG_taliban_attack.12.t: "Tálibán bombarduje budovu" # todo: NEW TRANSLATION
 AFG_taliban_attack.12.d: "Dnes otřásl jednou z budov, v níž sídlí kanceláře zahraničních investorů, mohutný výbuch. Následné vyšetřování dospělo k závěru, že bomba byla pravděpodobně sestavena z dělostřeleckých granátů ukradených nebo ztracených ze zbrojnice Afghánské národní armády. Tálibán se k tomuto bombardování následně přihlásil.\n\nMezi zabitými jsou i cizinci a naši vládní představitelé jsou v kontaktu s jejich velvyslanci, aby se vypořádali s následky." # todo: NEW TRANSLATION
 AFG_taliban_attack.12.a: "To poškodí naši národní pověst!" # todo: NEW TRANSLATION
 AFG_taliban_attack.13.t: "Naši kontraktoři zabiti při bombardování Tálibánu" # todo: NEW TRANSLATION
 AFG_taliban_attack.13.d: "Dnes otřásl jednou z budov, v níž sídlí kanceláře jednoho z našich kontraktorů, mohutný výbuch. Následné vyšetřování dospělo k závěru, že bomba byla pravděpodobně sestavena z dělostřeleckých granátů ukradených nebo ztracených ze zbrojnice Afghánské národní armády. Tálibán se k tomuto bombardování následně přihlásil.\n\nMezi oběťmi jsou i někteří naši občané a náš velvyslanec v Afghánistánu je v kontaktu s představiteli afghánské vlády, aby se vypořádali s následky." # todo: NEW TRANSLATION
 AFG_taliban_attack.13.a: "Musí chránit naše investory!" # todo: NEW TRANSLATION
 AFG_taliban_attack.14.t: "Cizinci zabiti při bombardování budovy Tálibánem" # todo: NEW TRANSLATION
 AFG_taliban_attack.14.d: "Dnes otřásl jednou z budov, v níž sídlí kanceláře zahraničních kontraktorů ve významném afghánském městě, mohutný výbuch. Následné vyšetřování dospělo k závěru, že bomba byla pravděpodobně sestavena z dělostřeleckých granátů ukradených nebo ztracených ze zbrojnice Afghánské národní armády. Tálibán se k tomuto bombardování následně přihlásil.\n\nMezi oběťmi jsou zahraniční občané a představitelé afghánské vlády jsou v kontaktu s velvyslanci dotčených zemí, aby se vypořádali s následky." # todo: NEW TRANSLATION
 AFG_taliban_attack.14.a: "Proč by někdo investoval v Afghánistánu?" # todo: NEW TRANSLATION
 AFG_taliban_attack.15.t: "Tálibán bombarduje letiště" # todo: NEW TRANSLATION
 AFG_taliban_attack.15.d: "Dnes bylo jedno z našich letišť s dvojím využitím zasaženo bombou v automobilu. Nákladní vůz s výbušným zařízením prorazil závoru u vjezdu na letiště a odpálil zařízení umístěné ve voze. Výbuch způsobil letišti značné škody kvůli mimořádně vysoké ničivé síle bomby ve vozidle. Krátce po zveřejnění prvních zpráv se k útoku přihlásila síť Haqqání, nejradikálnější větev Tálibánu.\n\nÚtok si vyžádal velké množství obětí mezi pozemním personálem a cestujícími čekajícími v terminálu. Naše bezpečnostní služby byly zcela zaskočeny a veřejnost se ptá, jak se nákladní vůz naložený výbušninami vůbec dostal k bráně střeženého letiště." # todo: NEW TRANSLATION
 AFG_taliban_attack.15.a: "Teroristé z Tálibánu musí být dopadeni!" # todo: NEW TRANSLATION
 AFG_taliban_attack.16.t: "Velký útok na letiště v Afghánistánu" # todo: NEW TRANSLATION
 AFG_taliban_attack.16.d: "Dnes bylo jedno z afghánských letišť s dvojím využitím zasaženo bombou v automobilu. Nákladní vůz s výbušným zařízením prorazil závoru u vjezdu na letiště a odpálil zařízení umístěné ve voze. Výbuch způsobil letišti značné škody kvůli mimořádně vysoké ničivé síle bomby ve vozidle. Krátce po zveřejnění zpráv se k útoku přihlásila síť Haqqání, nejradikálnější větev Tálibánu.\n\nÚtok si vyžádal velké množství obětí, ale nejsou hlášeni žádní zabití ani zranění občané [ROOT.GetAdjective] v Afghánistánu. Náš vůdce [ROOT.GetLeader] vyjádřil [AFG.GetLeader] soustrast nad útokem a důrazně odsoudil jednání Tálibánu." # todo: NEW TRANSLATION
 AFG_taliban_attack.16.a: "Povstání Tálibánu dosáhlo kritické úrovně!" # todo: NEW TRANSLATION
 AFG_news.17.t: "Protitalibanské povstání v Afghánistánu" # todo: NEW TRANSLATION
 AFG_news.17.d: "Po operaci Trvalá svoboda zažívá Herát vlnu odporu, když místní milice s podporou USA a Íránu zpochybňují kontrolu Tálibánu. Ulice zaplňují oslavné scény, zatímco milice obsazují klíčové oblasti a spojují se se Severní aliancí. „Herátský lev“ Mohammad Ismail Khan nabízí bývalým bojovníkům Tálibánu amnestii, ale varuje před budoucími nepřátelskými akcemi. Povstání představují zásadní okamžik v afghánském boji za stabilitu." # todo: NEW TRANSLATION
 AFG_news.17.a: "Zajímavý vývoj událostí" # todo: NEW TRANSLATION
 AFG_events.27.t: "Úloha žen" # todo: NEW TRANSLATION
 AFG_events.27.d: "Ačkoli se pojetí úlohy žen v naší společnosti může zdát nekonvenční, stát má různé představy o tom, jak postupovat vpřed." # todo: NEW TRANSLATION
 AFG_events.27.a: "Měly by zastávat tradičnější úlohu" # todo: NEW TRANSLATION
 AFG_events.27.b: "Dejme jim nějakou úlohu" # todo: NEW TRANSLATION
 AFG_events.28.t: "Úloha náboženství" # todo: NEW TRANSLATION
 AFG_events.28.d: "Úloha náboženství a otázka, zda by se Afghánistán měl otevřít, nebo si zachovat přísné dodržování sunnitského islámu, jsou spornými tématy." # todo: NEW TRANSLATION
 AFG_events.28.a: "Zůstaneme uzavření" # todo: NEW TRANSLATION
 AFG_events.28.b: "Měli bychom se otevřít" # todo: NEW TRANSLATION
 AFG_events.35.t: "Letecký most pro Severní alianci" # todo: NEW TRANSLATION
 AFG_events.35.d: "Uprostřed probíhajícího konfliktu v Afghánistánu se Rusko zapojuje do záležitostí tohoto regionu. Od roku 1996 ruská vláda skrytě podporuje Severní alianci a poskytuje zbraně a zásoby na posílení odporu sesazené afghánské vlády. Tato podpora vychází z obav, že se konflikt rozšíří do Střední Asie, jak se již dříve stalo s UTO během občanské války v Tádžikistánu. Nyní, když ministr obrany Ivanov odhalil rozsah této pomoci, čelí ruské vedení zásadnímu rozhodnutí: pokračovat v pomoci Severní alianci navzdory ekonomické zátěži, nebo podporu zcela stáhnout." # todo: NEW TRANSLATION
 AFG_events.35.a: "Požádejte Spojené státy, aby převzaly náklady" # todo: NEW TRANSLATION
 AFG_events.35.b: "Náklady uhradíme sami" # todo: NEW TRANSLATION
 AFG_events.35.c: "Zastavte tok pomoci" # todo: NEW TRANSLATION
 AFG_events.36.t: "Afghánská Severní aliance je ochotna hostit drony" # todo: NEW TRANSLATION
 AFG_events.36.d: "Po bombových útocích na americká velvyslanectví v roce 1998 a následných amerických raketových úderech na výcvikové tábory al-Káidy v Afghánistánu zintenzivnily Spojené státy snahy o rozbití teroristických sítí, včetně požadavku na vydání Usámy bin Ládina. Schůzka nejvyšších představitelů národní bezpečnosti dospěla k dohodě, že Tálibánu bude předloženo ultimátum k vydání bin Ládina. Navzdory předchozí neochotě spolupracovat se Severní aliancí se nyní naskýtá příležitost ke společnému pátrání po bin Ládinově úkrytu." # todo: NEW TRANSLATION
 AFG_events.36.a: "Pošlete průzkumné drony" # todo: NEW TRANSLATION
 AFG_events.36.b: "Cíl jsme již zadali" # todo: NEW TRANSLATION
 AFG_events.37.t: "Větší podpora Severní alianci v Afghánistánu" # todo: NEW TRANSLATION
 AFG_events.37.d: "Jak konflikt v Afghánistánu zuří, Severní aliance potřebuje větší podporu v boji proti Tálibánu a al-Káidě. Skrytá pomoc Indie je klíčová; poskytuje finanční prostředky, radarové vybavení, součástky letadel a technickou podporu pro údržbu stíhacích letounů. Vzhledem k tomu, že indičtí vojenští poradci jsou v boji proti Tálibánu cenní, jejich pomoc se stala pro vojáky [AFG.GetLeader] nepostradatelnou." # todo: NEW TRANSLATION
 AFG_events.37.a: "Odstranění pákistánských zmocněnců je nezbytné." # todo: NEW TRANSLATION
 AFG_events.37.b: "V tomto procesu nechceme pokračovat." # todo: NEW TRANSLATION
 AFG_events.38.t: "Ruské vybavení pro letecký most dorazilo do Afghánistánu" # todo: NEW TRANSLATION
 AFG_events.38.d: "Ruské vojenské vybavení včetně zbraní, zásob a vozidel začalo do Afghánistánu přicházet leteckým mostem. Jeho příjezd otevírá ve válce nové možnosti." # todo: NEW TRANSLATION
 AFG_events.38.a: "Dobré zprávy" # todo: NEW TRANSLATION
 AFG_events.39.t: "USA schválily podporu dronů" # todo: NEW TRANSLATION
 AFG_events.39.d: "Spojené státy schválily žádost o podporu dronů k zasažení výcvikových táborů al-Káidy a sledování Usámy bin Ládina. Nyní můžeme využívat zpravodajské informace a koordinovat úsilí s americkými silami." # todo: NEW TRANSLATION
 AFG_events.39.a: "Skvělé zprávy" # todo: NEW TRANSLATION
 AFG_events.40.t: "Indická podpora pokračuje" # todo: NEW TRANSLATION
 AFG_events.40.d: "Afghánistánu se dostává podpory z Indie, včetně finančních prostředků, radarového vybavení, součástek letadel a vojenských poradců." # todo: NEW TRANSLATION
 AFG_events.40.a: "Skvělé" # todo: NEW TRANSLATION
 AFG_events.41.t: "Žádost o podporu zamítnuta" # todo: NEW TRANSLATION
 AFG_events.41.d: "Navzdory snahám zajistit dodatečnou podporu byla žádost o pomoc zamítnuta. Budeme se muset spolehnout na stávající zdroje." # todo: NEW TRANSLATION
 AFG_events.41.a: "Zklamání" # todo: NEW TRANSLATION
 AFG_events.42.t: "Rusko žádá, abychom účet zaplatili my" # todo: NEW TRANSLATION
 AFG_events.42.d: "Rusko není ochotné pokrýt náklady na nákladnou leteckou operaci zásobující Severní alianci v Afghánistánu. Pan Ivanov požádal Spojené státy o pomoc a jednání proběhla také s britskými představiteli obrany. USA nyní čelí rozhodnutí, zda Rusku v této operaci pomoci." # todo: NEW TRANSLATION
 AFG_events.42.a: "Dokážeme to" # todo: NEW TRANSLATION
 AFG_events.42.b: "Nemůžeme" # todo: NEW TRANSLATION
 AFG_news.18.t: "Ruská žádost, aby USA zaplatily letecký most do Afghánistánu" # todo: NEW TRANSLATION
 AFG_news.18.d: "Ruská žádost o pomoc s financováním leteckého mostu zásobujícího Severní alianci v Afghánistánu se setkala s posměchem světového společenství. Navzdory své vojenské síle si Rusko vysloužilo kritiku za neochotu zaplatit účet a mnozí zpochybňují jeho odhodlání k této věci. Někteří dokonce navrhli, aby Rusko přehodnotilo své priority a zaměřilo se na řešení vlastních ekonomických problémů. Zásoby začaly do Afghánistánu proudit koncem září. Munice a vojenský materiál byly dodávány přes pontonové mosty, které ruská 201. divize vybudovala přes řeku Pjandž oddělující Tádžikistán a Afghánistán, jak uvedly Nezavismaya Gazeta." # todo: NEW TRANSLATION
 AFG_news.18.a: "Kam zmizely všechny peníze?" # todo: NEW TRANSLATION
 AFG_news.18.c: "Přijde orel znovu zachránit zraněného medvěda?" # todo: NEW TRANSLATION
 AFG_news.18.b: "Vlastně…" # todo: NEW TRANSLATION
 AFG_news.19.t: "USA nasazují v Afghánistánu drony Predator" # todo: NEW TRANSLATION
 AFG_news.19.d: "Spojené státy nasadily v Afghánistánu drony Predator k útokům na teroristické základny al-Káidy. Tato eskalace v Afghánistánu zahajuje novou éru vojenské přítomnosti Spojených států v regionu. Očekává se, že drony budou poskytovat zpravodajské informace a provádět dohled, čímž posílí vojenské operace Spojených států v zemi." # todo: NEW TRANSLATION
 AFG_news.19.a: "Zajímavé" # todo: NEW TRANSLATION
 AFG_news.20.t: "Projev [AFG.GetLeader] v Evropském parlamentu" # todo: NEW TRANSLATION
 AFG_news.20.d: "Během tiskové konference v Evropském parlamentu vyzval [AFG.GetLeader] světové vůdce, aby zatlačili na Pákistán kvůli jeho podpoře Tálibánu, a požádal o humanitární pomoc ke zmírnění utrpení afghánského lidu. Tato výzva přichází v době, kdy zároveň varuje před plánovaným útokem al-Káidy na západní státy." # todo: NEW TRANSLATION
 AFG_news.20.a: "To by mohlo být znepokojivé" # todo: NEW TRANSLATION
 AFG_news.21.t: "Dostum se připojuje k plánům útoku na Mazáre Šaríf" # todo: NEW TRANSLATION
 AFG_news.21.d: "Dostumův návrat z exilu do Afghánistánu byl vnímán jako příležitost znovu dobýt Mazáre Šaríf. Nyní se po boku velitele Ahmada Šáha Masúda, Ismaila Khana a Mohammada Mohaqiqa připravuje na ofenzivu proti městu Mazáre Šaríf ovládanému Tálibánem.\n\nDostum, původně velitel vojenské jednotky 374 komunistických sil PDPA, přeběhl po pádu Kábulu v roce 1992 k mudžáhidům. Poté v Mazáre Šarífu založil svůj protostát, běžně známý jako Severní autonomní zóna. Vydával vlastní měnu a provozoval dokonce vlastní leteckou společnost Balkh Air.\n\nPo krátké ztrátě kontroly nad Mazáre Šarífem ve prospěch Tálibánu se Dostum v říjnu 1997 vrátil z exilu, aby znovu převzal moc. Navzdory jeho úsilí se Tálibán v roce 1998 vrátil, což přimělo Dostuma znovu uprchnout do Turecka." # todo: NEW TRANSLATION
 AFG_news.21.a: "Uvidíme, co se stane." # todo: NEW TRANSLATION
 AFG_events.45.t: "Mahmoud Surkha přeběhl k Tálibánu" # todo: NEW TRANSLATION
 AFG_events.45.d: "Velitel Mahmoud Surkha přeběhl k Tálibánu s tvrzením, že je nespokojen s ruským vměšováním do války. [AFG.GetLeader] toto obvinění popírá, zároveň však tvrdí, že má právo hledat mezinárodní podporu jako de facto uznávaná vláda Afghánistánu." # todo: NEW TRANSLATION
 AFG_events.48.t: "Abdullah Jan Wahidi přeběhl" # todo: NEW TRANSLATION
 AFG_events.48.d: "Haji Abdul Qadeer přiznal, že jeden z jejich klíčových velitelů, Abdullah Jan Wahidi, přeběhl k Tálibánu." # todo: NEW TRANSLATION
 AFG_events.48.a: "Nemůžeme nic dělat" # todo: NEW TRANSLATION
 AFG_events.44.t: "Ismail Khan uprchl z věznice v Kandaháru" # todo: NEW TRANSLATION
 AFG_events.44.d: "Ismail Khan, bývalý guvernér Herátu a vůdce odporu proti vládnoucímu režimu Tálibánu, uprchl z vězení v Kandaháru.\nKhan byl považován za jednoho z nejuznávanějších vůdců mudžáhidů v povstání proti Sovětům. V roce 1992 dobyly jednotky mudžáhidů Herát a Ismail Khan se stal guvernérem. V roce 1995 bránil město proti Tálibánu ve spolupráci s Ahmadem Šáhem Masúdem. Khan dokonce přešel do ofenzivy proti baště Tálibánu Kandaháru, ale byl odražen. To se změnilo, když generál Abdul Rashid Dostum zaútočil na Herát a donutil Ismaila Khana a jeho 8 000 mužů uprchnout do Íránu, než Tálibán vtrhl dovnitř a převzal kontrolu nad provincií Herát. O dva roky později, při organizování odporu proti Tálibánu v oblasti Fárjábu, byl zrazen a zajat Abdulem Majidem Rouzim, který přeběhl k Tálibánu spolu s Abdulem Malikem Pahlawanem, tehdy jedním z Dostumových zástupců." # todo: NEW TRANSLATION
 AFG_events.44.a: "Zkusíme štěstí znovu" # todo: NEW TRANSLATION
 AFG_events.45.a: "Co už můžeme dělat" # todo: NEW TRANSLATION
 AFG_events.65.t: "Afghánistán žádá o podporu" # todo: NEW TRANSLATION
 AFG_events.65.d: "Afghánistán, který čelí úbytku vybavení a zdrojů, naléhavě žádá o pomoc v podobě vyslání operativců k výcviku místních afghánských bojovníků a poskytnutí potřebného vybavení a vozidel, aby mohli samostatně bojovat proti Tálibánu a minimalizovala se tak potřeba přímého vojenského zásahu." # todo: NEW TRANSLATION
 AFG_events.65.a: "Ano, pomůžeme" # todo: NEW TRANSLATION
 AFG_events.65.b: "Ne, nepomůžeme" # todo: NEW TRANSLATION
 AFG_events.66.t: "Přijali to" # todo: NEW TRANSLATION
 AFG_events.66.d: "Spojené státy žádost přijaly a vyšlou poradce spolu s vybavením na pomoc Afghánistánu v boji proti Tálibánu. Jde o významný krok k posílení afghánských sil a spolupráce v boji proti povstání a ke stabilizaci regionu." # todo: NEW TRANSLATION
 AFG_events.66.a: "Dáme se do pohybu" # todo: NEW TRANSLATION
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName] vyhrává pohraniční válku" # todo: NEW TRANSLATION
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName] vyhrál pohraniční válku proti [event_target:AFG_DEFENDER.GetName] a postoupil do nového území. Po tomto vítězství bude pravděpodobně pokračovat v ofenzivě." # todo: NEW TRANSLATION
 AFG_border_wars.1.a: "Hurá!" # todo: NEW TRANSLATION
 AFG_border_wars.1.b: "Sakra" # todo: NEW TRANSLATION
 AFG_border_wars.1.c: "Eskalujme!" # todo: NEW TRANSLATION
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName] prohrává pohraniční válku" # todo: NEW TRANSLATION
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName] prohrál pohraniční válku proti [event_target:AFG_DEFENDER.GetName]." # todo: NEW TRANSLATION
 AFG_border_wars.2.a: "Hurá!" # todo: NEW TRANSLATION
 AFG_border_wars.2.b: "Sakra" # todo: NEW TRANSLATION
 AFG_border_wars.3.t: "Tálibán se připravuje na přesun do kmenových oblastí" # todo: NEW TRANSLATION
 AFG_border_wars.3.d: "Tálibán plánuje přesun do kmenových oblastí, především do regionů Severní Vazíristán a Paráčinar. Jeden z vyjednavačů Tálibánu nás o jejich plánech informoval a doufá, že jim dovolíme zůstat v oblasti po „přechodnou dobu“. Přestože je tento region v širším měřítku poměrně bezvýznamný, stále jde o ztrátu území a proniknutí radikálních teroristů do země." # todo: NEW TRANSLATION
 AFG_border_wars.3.a: "Dokud jsou užiteční, mohou zůstat" # todo: NEW TRANSLATION
 AFG_border_wars.3.b: "Rozhodně ne" # todo: NEW TRANSLATION
 AFG_border_wars.4.t: "Pákistán odsuzuje plány na přesun do kmenových oblastí" # todo: NEW TRANSLATION
 AFG_border_wars.4.d: "Pákistánská vláda nás nedávno kontaktovala a vyjádřila nespokojenost s možností, že síly Tálibánu zůstanou v regionech Severní Vazíristán a Paráčinar. Přestože tento výsledek není překvapivý, stále představuje překážku v našem úsilí o znovudobytí Afghánistánu." # todo: NEW TRANSLATION
 AFG_border_wars.4.a: "Dobře" # todo: NEW TRANSLATION
 AFG_border_wars.4.b: "K čertu s jejich námitkami!" # todo: NEW TRANSLATION
 AFG_border_wars.5.t: "Pákistán povoluje přesun do kmenových oblastí" # todo: NEW TRANSLATION
 AFG_border_wars.5.d: "Pákistánská vláda naznačila, že bude ignorovat náš přesun do regionů Severní Vazíristán a Paráčinar. To znamená, že můžeme pokračovat v rozšiřování našich operací a zvýšit své šance v případě zahájení velkého afghánského útoku." # todo: NEW TRANSLATION
 AFG_border_wars.5.a: "Dobře" # todo: NEW TRANSLATION
 AFG_border_wars.6.t: "Tálibán nás ignoruje" # todo: NEW TRANSLATION
 AFG_border_wars.6.d: "Tálibán ignoroval nás i naše námitky proti jeho nedávnému přesunu do oblasti Severního Vazíristánu a Paráčinaru. Zdá se, že nemáme jinou možnost než použít sílu a naučit je, že po nás nemohou šlapat." # todo: NEW TRANSLATION
 AFG_border_wars.6.a: "Začali si s tím oni" # todo: NEW TRANSLATION
 AFG_border_wars.7.t: "Afghánské ozbrojené síly vítězí" # todo: NEW TRANSLATION
 AFG_border_wars.7.d: "Po potyčce s Tálibánem dosáhly afghánské ozbrojené síly vítězství nad jeho jednotkami. [AFG.GetLeader] tuto bitvu prezentuje jako celonárodní vítězství." # todo: NEW TRANSLATION
 AFG_border_wars.7.a: "Alláhu akbar!" # todo: NEW TRANSLATION
 AFG_border_wars.7.b: "Inšalláh vítězství přijde" # todo: NEW TRANSLATION
 AFG_border_wars.7.c: "To je věc Afghánců" # todo: NEW TRANSLATION
 AFG_border_wars.8.t: "Síly Tálibánu vítězí" # todo: NEW TRANSLATION
 AFG_border_wars.8.d: "Po potyčce s Afghánskou národní armádou dosáhly síly Tálibánu vítězství nad jednotkami Afghánské národní armády. [TAL.GetLeader] tuto bitvu prezentuje jako vítězství celého Tálibánu." # todo: NEW TRANSLATION
 AFG_border_wars.8.a: "Alláhu akbar!" # todo: NEW TRANSLATION
 AFG_border_wars.8.b: "Inšalláh vítězství přijde" # todo: NEW TRANSLATION
 AFG_border_wars.8.c: "To je věc Afghánců" # todo: NEW TRANSLATION
 AFG_border_wars.9.t: "Po potyčce Tálibánu s Afghánci nebylo rozhodnuto" # todo: NEW TRANSLATION
 AFG_border_wars.9.d: "Po potyčce sil Tálibánu a Afghánské národní armády zaznamenaly mezinárodní síly zamrzlou frontovou linii. Podle zpráv obě strany zpomalily své útoky a stáhly se do oblastí, které držely před potyčkou." # todo: NEW TRANSLATION
 AFG_border_wars.9.a: "Dobře" # todo: NEW TRANSLATION
