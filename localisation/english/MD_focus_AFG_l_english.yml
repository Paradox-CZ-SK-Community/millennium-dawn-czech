 TAL_begin_insurgency_in_registan_desc: "Zmobilizujte kolony milicí napříč pouští Registán a zmocněte se provincie, čímž otevřete druhou frontu na jihu." # todo: NEW TRANSLATION
 TAL_begin_war_again: "Obnovit válku" # todo: NEW TRANSLATION
 TAL_begin_war_again_desc: "Po odchodu zahraničních vojsk a obnovení našich sil opusťte příměří a vyrazte na Kábul, abychom válku dokončili." # todo: NEW TRANSLATION
 AFG_pomegranate_investment1_collect: "Sběr granátových jablek" # todo: NEW TRANSLATION
 AFG_pomegranate_investment1_collect_desc: "Zemědělci jsou připraveni, abychom odvezli náklad granátových jablek." # todo: NEW TRANSLATION
 AFG_almond_investment1_collect: "Sběr mandlí" # todo: NEW TRANSLATION
 AFG_almond_investment1_collect_desc: "Zemědělci jsou připraveni, abychom odvezli náklad mandlí." # todo: NEW TRANSLATION
 AFG_almond_investment1: "Investovat do produkce mandlí" # todo: NEW TRANSLATION
 AFG_almond_investment1_desc: "Mandle jsou pro mnoho Afghánců významným zdrojem příjmů. Vláda může investovat do mandlového průmyslu poskytováním infrastruktury, dopravy a přístupu zemědělců na trh. Tento investiční program je omezen na 5 velkých iniciativ, poté trh dosáhne nasycení. Investice: 5 % HDP, výnos: 6 % HDP (zisková marže 20 %)." # todo: NEW TRANSLATION
 AFG_pomegranate_investment1: "Investovat do produkce granátových jablek" # todo: NEW TRANSLATION
 AFG_pomegranate_investment1_desc: "Afghánská granátová jablka jsou po celém světě proslulá svou kvalitou. Vláda může investovat do výrobních zařízení a obchodních sítí, aby využila tento přírodní zdroj. Tento investiční program je omezen na 5 velkých iniciativ, poté trh dosáhne nasycení. Investice: 5 % HDP, výnos: 6 % HDP (zisková marže 20 %)." # todo: NEW TRANSLATION
 AFG_import_westernism: "Import západních hodnot" # todo: NEW TRANSLATION
 AFG_import_westernism_desc: "Afghánistán dlouho lpěl na svých tradičních hodnotách. Nedávné otevření novým myšlenkám nám však umožnilo selektivně začlenit aspekty západních konceptů. Tímto způsobem čerpáme z rozmanité škály západních myšlenek, vybíráme ty, které odpovídají našim potřebám, a odmítáme ty, které do našeho kontextu nepasují." # todo: NEW TRANSLATION
 AFG_invite_nahzat_e_melli_ye_into_government: "Pozvat Hezb-e-Nuhzhat-e-Mili Afghanistan do vlády" # todo: NEW TRANSLATION
 AFG_atta_installs_leadership: "Atta Muhammad Nur přebírá vedení" # todo: NEW TRANSLATION
 AFG_atta_installs_leadership_desc: "Od vojevůdce po velitele, Atta Muhammad Nur se s věcmi příliš nemaže." # todo: CHANGED
 AFG_domestic_decisions: "Vnitrostátní cíle" # todo: NEW TRANSLATION
 AFG_domestic_decisions_desc: "S obnovující se zemí jsme stanovili cíle pro obnovu státu a vytvoření nové budoucnosti." # todo: NEW TRANSLATION
 AFG_taloqan_siege_mission: "Udržet město" # todo: NEW TRANSLATION
 AFG_taloqan_siege_mission_desc: "Zajištění města je klíčové, protože se naše území zmenšuje a rozlehlé pláně na severozápadě představují lákavý cíl budoucí ofenzivy." # todo: NEW TRANSLATION
 AFG_headquarters_taloqan: "Velitelství v Talikánu" # todo: NEW TRANSLATION
 AFG_headquarters_taloqan_desc: "Talikán se během sovětské invaze stal klíčovou baštou Ahmada Šáha Masúda. Následně se stal hlavním velitelským centrem pro [AFG.GetFlag] [AFG.GetNameDefCap] a po pádu Mazáre Šarífu do rukou Tálibánu v roce 1997 sloužil jako důležitý přístupový bod do Tádžikistánu." # todo: NEW TRANSLATION
 taliban_insurgency_category: "Povstání Tálibánu" # todo: NEW TRANSLATION
 taliban_insurgency_category_desc: "Ačkoli byly síly £GFX_AFG_salafist_jihadism §YTálibánu§! koaličními silami poraženy, nebyly zcela zlikvidovány. Bojovníci Tálibánu se rozptýlili do všech koutů Afghánistánu a zahájili §Rpovstání§! a různé §Rteroristické útoky§! proti nové vládě a koaličním silám. Očekává se, že likvidace povstání Tálibánu potrvá roky v závislosti na mnoha faktorech.\n\n§YSíla Tálibánu§! určuje sílu bojovníků Tálibánu v zemi. Její růst i naše účinnost při likvidaci povstání budou záviset na §Ydůvěře v centrální vládu (stabilitě, korupci nebo zahraničním vměšování)§! a na §Ysituaci na afghánsko-pákistánské hranici§!. Pokud je §YSíla Tálibánu§! příliš vysoká, £GFX_AFG_salafist_jihadism §YTálibán§! bude schopen provádět §Rteroristické útoky§! a může je dokonce vystupňovat v §Robnovenou občanskou válku§!, zatímco některé metody mohou být při řešení hrozby Tálibánu krátkodobě účinné.\n\n§YSíla Tálibánu§!: [?AFG.taliban_strength]%" # todo: NEW TRANSLATION
 raid_taliban_hideouts: "Útok na talibánské úkryty" # todo: NEW TRANSLATION
 raid_taliban_hideouts_desc: "Naši komanda nalezla polohy talibánských militantů, můžeme vyslat jednotku našich komand provést nájezd za účelem likvidace nebo zajetí těchto militantů." # todo: NEW TRANSLATION
 bomb_taliban_targets: "Zbombardovat talibánské základny" # todo: NEW TRANSLATION
 bomb_taliban_targets_desc: "Naše zpravodajské služby identifikovaly několik koncentrací Talibanu a můžeme použít naši leteckou sílu k bombovým náletům na tyto militanty." # todo: NEW TRANSLATION
 secure_afghan_pakistani_border: "Zajistit afghánsko-pákistánskou hranici" # todo: NEW TRANSLATION
 secure_afghan_pakistani_border_desc: "Jedním z hlavních důvodů naší potíže s eliminací talibanského povstání je, že se bojovníci Talibanu uchylují do Pákistánu, znovu se konsolidují a pak se vrací pokračovat v povstání. Většina naší hranice s Pákistánem je nehlídaná, musíme zintenzivnit úsilí o vybudování bezpečnostního mechanismu podél hranice." # todo: NEW TRANSLATION
 afghan_unity_propaganda: "Propaganda afghánského sjednocení" # todo: NEW TRANSLATION
 afghan_unity_propaganda_desc: "Taliban se skládá většinou z Afghánců. Afghánci jsou soukmenovci, ale už dlouho jsme v občanském konfliktu kvůli ideologickým rozdílům. Můžeme vynaložit úsilí přesvědčit talibánské militanty, aby odložili zbraně a přispěli k rozvoji země tím, že jim slíbíme odpuštění za jejich minulé činy." # todo: NEW TRANSLATION
 show_supporting_counter_insurgency_countries: "Zobrazit země podporující naši protipovstaleckou operaci" # todo: NEW TRANSLATION
 show_supporting_counter_insurgency_countries_desc: "Zobrazuje země, které podporují naši protipovstaleckou misi proti Talibanu; tyto země nám poskytnou nejen vojenskou pomoc, ale i technickou podporu." # todo: NEW TRANSLATION
 eliminate_taliban_insurgency: "Zlikvidovat talibanské povstání" # todo: NEW TRANSLATION
 eliminate_taliban_insurgency_desc: "Nyní, když jsou naše vojenské síly rozmístěny na klíčových místech a hranice zajištěna, můžeme vyvinout poslední úsilí k rozbití talibanského povstání a ukončení tohoto dlouho trvajícího konfliktu." # todo: NEW TRANSLATION
 isaf_raid_taliban_hideouts: "Výpady proti Talibanu" # todo: NEW TRANSLATION
 isaf_raid_taliban_hideouts_desc: "Naše vojenské rozvědky v Afghánistánu úspěšně lokalizovaly několik koncentrací Talibanu; můžeme provést výpady, abychom tyto povstalce dopadli." # todo: NEW TRANSLATION
 isaf_launch_drone_strike: "Spustit údery dronů" # todo: NEW TRANSLATION
 isaf_launch_drone_strike_desc: "Naše vojenské rozvědky v Afghánistánu úspěšně lokalizovaly četné talibánské úkryty v blízkosti městských oblastí; můžeme zahájit údery dronů, abychom oslabili jejich schopnosti útočit na cíle afghánské vlády nebo naše jednotky v Afghánistánu." # todo: NEW TRANSLATION
 isaf_bomb_taliban_hotspots: "Zbombardovat talibánská ohniska" # todo: NEW TRANSLATION
 isaf_bomb_taliban_hotspots_desc: "Síla talibanského povstání vzrostla na kritickou úroveň a afghánská armáda je při jeho potírání velmi neúčinná; musíme nasadit naše strategické bombardéry k bombardování jejich ohnisek." # todo: NEW TRANSLATION
 isaf_provide_technical_equipment: "Poskytnout protipovstalecké vybavení" # todo: NEW TRANSLATION
 isaf_provide_technical_equipment_desc: "Ačkoli Afghánistán sám nemá odpovídající protipovstalecké vybavení, můžeme jim jej poskytnout, což pravděpodobně zvýší efektivitu Afghánské národní armády a policie v provádění protipovstaleckých operací." # todo: NEW TRANSLATION
 isaf_withdraw_from_afghanistan: "Stáhnout se z Afghánistánu" # todo: NEW TRANSLATION
 isaf_withdraw_from_afghanistan_desc: "Naše mise v Afghánistánu je u konce, je čas stáhnout naše jednotky z této nikdy nekončící války." # todo: NEW TRANSLATION
 TT_AFG_NOT_FACTION_WITH_PAK: "Nespojeno s žádnou pákistánskou frakcí" # todo: NEW TRANSLATION
 TT_AFG_BORDER_WAR_WARN_OF_WAR: "§RJe pravděpodobné, že pokud obsadíme území, náš nepřítel nám vyhlásí válku!§!" # todo: NEW TRANSLATION
 AFG_Baluchistan: "Nárokovaný Balúčistán" # todo: NEW TRANSLATION
 AFG_invasion: "Invaze do Pákistánu" # todo: NEW TRANSLATION
 AFG_pashtunistan_decisions: "Sjednocení Paštúnistánu" # todo: NEW TRANSLATION
 AFG_pashtunistan_decisions_desc: "Téměř 16 % obyvatel Pákistánu se hlásí k Paštúnům, nejpočetnější etnické skupině Afghánistánu. Většina pákistánských Paštúnů žije v severozápadních částech země. Kvůli občanské válce v Pákistánu nyní mnoho z těchto lidí trpí pod děsivým režimem. Je naší povinností je chránit." # todo: NEW TRANSLATION
 claim_pashtunistan: "Uplatnit nárok na Paštúnistán" # todo: NEW TRANSLATION
 claim_pashtunistan_desc: "Oblast Paštúnistánu zahrnuje severozápadní Pákistán a východní Afghánistán. Vzhledem k tomu, že oblast je pod kontrolou extremistů, můžeme prohlásit, že jsme skuteční ochránci tohoto území." # todo: NEW TRANSLATION
 claim_baluchistan: "Uplatnit nárok na Balúčistán" # todo: NEW TRANSLATION
 claim_baluchistan_desc: "Velmi často rétorika o sjednoceném Paštúnistánu zahrnuje i oblast Balúčistánu na západě Pákistánu. Tato oblast je obydlena Balúči a dlouhodobě usiluje o nezávislost. Oblast kdysi patřila Afghánistánu a umožnila by nám přístup k moři, což ji činí strategicky důležitou." # todo: NEW TRANSLATION
 afg_claims_advance_to_baluchistan: "Postoupit do Balúčistánu" # todo: NEW TRANSLATION
 afg_claims_advance_to_baluchistan_desc: "Severní Balúčistán a hlavní město Quetta by měly být naším prvním cílem. To nám umožní pokračovat v postupu směrem k moři." # todo: NEW TRANSLATION
 afg_claims_advance_to_the_sea: "Dokončit okupaci Balúčistánu" # todo: NEW TRANSLATION
 afg_claims_advance_to_the_sea_desc: "Musíme dokončit okupaci Balúčistánu postupem a obsazením přístavního města Gwadar." # todo: NEW TRANSLATION
 afg_claims_advance_into_tribal_areas: "Postup do paštúnských kmenových oblastí" # todo: NEW TRANSLATION
 afg_claims_advance_into_tribal_areas_desc: "Prvním cílem by mělo být proniknutí do Federálně spravovaných kmenových oblastí. Začneme vyčisťováním strongholdů Pákistánského Talibanu." # todo: NEW TRANSLATION
 afg_claims_clear_tribal_areas: "Pacifikovat kmenové oblasti" # todo: NEW TRANSLATION
 afg_claims_clear_tribal_areas_desc: "Dalším krokem je pacifikace zbývajících kmenových oblastí poté, co byly odstraněny talibánské základny." # todo: NEW TRANSLATION
 afg_claims_invade_peshawar: "Obsadit Peshawar" # todo: NEW TRANSLATION
 afg_claims_invade_peshawar_desc: "Perla pákistánských paštúnských oblastí, velkolepé město Peshawar, je v našem hledáčku. Nesmíme nyní selhat!" # todo: NEW TRANSLATION
 afg_invade_pakistan: "Vtrhnout do Pákistánu" # todo: NEW TRANSLATION
 afg_invade_pakistan_desc: "Místo pomalého postupu a obsazování území můžeme provést přímou invazi a překvapit nepřítele. To však bude odsouzeno mezinárodním společenstvím a je možné, že zasáhnou ochránci Pákistánu." # todo: NEW TRANSLATION
 afg_integrate_pashtunistan: "Integrovat Paštúnistán" # todo: NEW TRANSLATION
 afg_integrate_pashtunistan_desc: "I když Paštúni sdílejí dominantní etnickou pozici Afghánistánu, mnoho Paštúnů v nových oblastech stále naší vládě nedůvěřuje. Musíme vynaložit prostředky, abychom je přesvědčili, že jsou s námi lépe." # todo: NEW TRANSLATION
 unite_with_pakistan_taliban: "Spojit se s pákistánským Talibanem" # todo: NEW TRANSLATION
 unite_with_pakistan_taliban_desc: "Naši bratři v Pákistánu bojují za osvobození muslimů. Musíme se s nimi spojit!" # todo: NEW TRANSLATION
 AFG_taliban_insurgency_eliminated: "Povstání Tálibánu bylo potlačeno" # todo: NEW TRANSLATION
 AFG_active_taliban_insurgency: "Povstání Tálibánu je aktivní" # todo: NEW TRANSLATION
 wot_supporting_afghan_counter_insurgency: "Podpořit afghánské protipovstalecké operace" # todo: NEW TRANSLATION
 AFG_russian_airlift_is_active: "Má ruský letecký most" # todo: NEW TRANSLATION
 PAK_objected: "Ustoupili jsme po pákistánských námitkách [PAK.GetFlag]" # todo: NEW TRANSLATION
 AFG_doing_border_raid: "Právě provádíme hraniční nájezd" # todo: NEW TRANSLATION
 AFG_donkey_logistics_tech: "Logistika využívající soumary" # todo: NEW TRANSLATION
 AFG_donkey_logistics_tech_desc: "Karavany mezků a oslů přepravují zásoby průsmyky, kam se žádný nákladní vůz nedostane." # todo: NEW TRANSLATION
 AFG_donkey_logistics_tech2: "Logistika využívající soumary II" # todo: NEW TRANSLATION
 AFG_donkey_logistics_tech2_desc: "Větší karavany a zavedená shromaždiště podél severních tras." # todo: NEW TRANSLATION
 AFG_donkey_logistics_tech3: "Logistika využívající soumary III" # todo: NEW TRANSLATION
 AFG_donkey_logistics_tech3_desc: "Stálý dopravní sbor založený na karavanách soumarů, které nikdy nepřestaly fungovat." # todo: NEW TRANSLATION
 AFG_legacy_of_the_mujahideen: "Odkaz mudžáhidů" # todo: NEW TRANSLATION
 AFG_legacy_of_the_mujahideen_desc: "Veteráni války se Sověty předávají své zkušenosti z boje milicím." # todo: NEW TRANSLATION
 AFG_tech_the_farmer_and_their_rifle: "Rolník a jeho puška" # todo: NEW TRANSLATION
 AFG_tech_the_farmer_and_their_rifle_desc: "Venkovští odvedenci bojující za vlastní údolí, kteří znají každý přístup k nim." # todo: NEW TRANSLATION
 AFG_tech_training_of_local_police_officers: "Výcvik místních policistů" # todo: NEW TRANSLATION
 AFG_tech_training_of_local_police_officers_desc: "Milice vycvičené nejen k boji a policejní službě, ale také k udržení dobytého území." # todo: NEW TRANSLATION
 AFG_tech_return_of_dostum: "Dostumův návrat" # todo: NEW TRANSLATION
 AFG_tech_return_of_dostum_desc: "Dostum je zpět na severu a uzbecké milice bojují stejně jako on." # todo: NEW TRANSLATION
 AFG_the_lion_of_panjshir: "Paňdšírský lev" # todo: NEW TRANSLATION
 AFG_the_lion_of_panjshir_desc: "Masúdova doktrína držet výšiny a udeřit z nich." # todo: NEW TRANSLATION
