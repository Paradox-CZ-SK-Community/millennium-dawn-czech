 inuit_nunangat_focus: "Strom zaměření Inuitů" # todo: NEW TRANSLATION
 INU_Learning_from_Crested_Ice: "Učení se od Hřebenového ledu" # todo: NEW TRANSLATION
 INU_Learning_from_Crested_Ice_desc: "V 50. a 60. letech Spojené státy provozovaly v oblasti vysoké Arktidy sérii letounů B-52 Stratofortress vyzbrojených jadernými zbraněmi v rámci operace známé jako Chrome Dome. V roce 1968 jeden Stratofortress havaroval při pokusu o přistání na letecké základně Thule, kontaminoval životní prostředí a úřady incident ututlaly. Nyní se musíme ohlédnout zpět a analyzovat etiku této situace, než si začneme zahrávat s jaderným ohněm." # todo: NEW TRANSLATION
 INU_Buy_Spare_Parts: "Nákup náhradních dílů" # todo: NEW TRANSLATION
 INU_Buy_Spare_Parts_desc: "Abychom dále rozvinuli náš program obnovy jaderných zbraní, musíme se pokusit získat součástky a stroje, abychom mohli zbraně, které plánujeme používat, znovu vytvořit nebo obnovit." # todo: NEW TRANSLATION
 INU_Project_S: "Projekt Sanna" # todo: NEW TRANSLATION
 INU_Project_S_desc: "Sanna neboli Sedna je jméno inuitské bohyně moře a paní mořského života. Na její počest a jako poctu její roli důležitého zdroje obživy pojmenujeme náš program balistických ponorek na její počest." # todo: NEW TRANSLATION
 INU_Project_Ice_Shield: "Projekt Ledový štít" # todo: NEW TRANSLATION
 INU_Project_Ice_Shield_desc: "Nyní nastal čas podrobit naši práci zkoušce. Ukažme světu, čeho jsme schopni, když národ dokáže s jadernou zbraní řádně zacházet a využít ji jako nástroj diplomacie, nikoli jako prostředek k vyhrožování ostatním. Použijeme ji k ochraně zájmů původních obyvatel Arktidy." # todo: NEW TRANSLATION
 INU_Project_N: "Projekt Nuutuittuq" # todo: NEW TRANSLATION
 INU_Project_N_desc: "Nuutuittuq je jméno hvězdy na severním pólu, Polárky. Na její počest pojmenujeme náš program balistických raket, protože nám umožní stále se přibližovat ke hvězdám." # todo: NEW TRANSLATION
 INU_Qaanaaq_Space_base: "Vesmírná základna Qaanaaq" # todo: NEW TRANSLATION
 INU_Looking_to_the_Stars: "Pohled ke hvězdám" # todo: NEW TRANSLATION
 INU_Atmospheric_Monitoring: "Monitorování atmosféry" # todo: NEW TRANSLATION
 INU_Lidar_Climate_Research: "Klimatický výzkum pomocí LIDARu" # todo: NEW TRANSLATION
 INU_Recover_B52_Thermonuclear_Arm: "Obnova termonukleární výzbroje B-52" # todo: NEW TRANSLATION
