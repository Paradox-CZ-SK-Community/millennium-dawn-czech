 advanced_production_modifier: "Pokročilá výrobní omezení" # todo: NEW TRANSLATION
 advanced_production_modifier_desc: "Když nám začnou docházet technologické kovy ([?THIS.resource@tungsten|+]), drahé kovy ([?THIS.resource@chromium|+]), ropa ([?THIS.resource@oil|+]) nebo kaučuk ([?THIS.resource@rubber|+]), utrpí naše výroba mikročipů a/nebo kompozitů. Jakýkoli nedostatek kteréhokoli zdroje povede k poklesu výroby mikročipů a/nebo kompozitů. Protože výroba mikročipů navíc vyžaduje značné množství energie, nedostatek energie výrobu dále sníží o [?unfulfilled_energy_demand_dynmod_var|%]\n\n§YSnížení výroby bude vždy omezeno na§! §R95%§! §Yzákladních výrobních hodnot.§!" # todo: NEW TRANSLATION
 civilian_microchip_consumption_modifier: "Spotřeba mikročipů civilním a průmyslovým sektorem" # todo: NEW TRANSLATION
 civilian_microchip_consumption_modifier_desc: "Naše obyvatelstvo a vyspělý průmysl začnou spotřebovávat mikročipy, protože podnikům i běžným lidem bude k dispozici stále více technologií. Budeme muset této poptávce držet krok, jinak budou naše výrobní linky mít potíže. Za války bude vojenská výroba upřednostněna před civilním využitím, což však může vést k nepokojům mezi obyvatelstvem, protože jeho požadavky nebudou naplněny." # todo: NEW TRANSLATION
