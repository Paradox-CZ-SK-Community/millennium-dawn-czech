 total_ffp_amount_tt: "Tato hodnota představuje celkový počet §Yfosilních elektráren§! v naší zemi."
 total_ffp_amount_tt_delayed: "§YFosilní elektrárny§! jsou souhrnným označením pro všechny termoelektrické zdroje energie založené na fosilních palivech. Patří mezi ně mimo jiné uhlí, zemní plyn a ropa. §YFosilní elektrárny§! se uvedou do nečinnosti, pokud je výroba energie vyšší než spotřeba.\n\nPoskytují státu:\nZákladní počet potřebných pracovníků: §Y7,5 tis.§!\nZákladní výstup HDP na §Yfosilní elektrárnu§!: $§Y1,7 miliardy§!\nZákladní zisk energie: §G+2§! GW\n\nSoučasný §Yzisk energie na elektrárnu§!: [?fossil_pp_energy_per_plant_display|+2] GW" # todo: CHANGED
 total_nuclear_reactor_amount: "[?nuclear_reactors]"
 total_nuclear_reactor_amount_tt: "Tato hodnota představuje celkový počet §Yjaderných reaktorů§! v naší zemi."
 total_nuclear_reactor_amount_tt_delayed: "Tato budova přeměňuje jadernou energii na elektrickou a přitom spotřebovává středně obohacený uran.\n\nPoskytuje státu:\nZákladní počet potřebných pracovníků: §Y115 tis.§!\nZákladní výstup HDP na §Yjaderný reaktor§!: $§Y4 miliardy§!\nZákladní zisk energie: §G+4§! GW\n\nSoučasný §Yzisk energie na reaktor§!: [?nuclear_energy_per_reactor_display|+2] GW" # todo: CHANGED
 total_renewable_energy_amount_tt: "Tato hodnota představuje celkový počet §Yinfrastruktury obnovitelné energie§! v naší zemi."
 total_renewable_energy_amount_tt_delayed: "§YInfrastruktura obnovitelné energie§! je souhrnným označením pro všechny obnovitelné zdroje energie. Patří mezi ně mimo jiné solární parky, větrné turbíny, rafinerie biopaliv, závody na dřevěné uhlí, elektrárny na biopaliva a další. Využívá tedy obnovitelné zdroje a vyrábí z nich palivo.\n\nPoskytuje státu:\nZákladní počet potřebných pracovníků: §Y22,5 tis.§!\nZákladní výstup HDP na §Yinfrastrukturu obnovitelné energie§!: $§Y2 miliardy§!\nZákladní zisk energie: §G+0,5§! GW\n" # todo: CHANGED
