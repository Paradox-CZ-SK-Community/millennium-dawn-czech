l_english:
 BNL_dynmod_union: "Beneluxká unie" # todo: NEW TRANSLATION
 BNL_benelux_union_treaty: "Smlouva o Beneluxké unii" # todo: NEW TRANSLATION
 BNL_benelux_union_treaty_desc: "Nová smlouva, podepsaná v Haagu v roce 2008, nahrazuje končící dohodu z roku 1958 a přejmenovává naši spolupráci na Beneluxkou unii. Navazuje na společný trh a rozšiřuje naši spolupráci o justici, bezpečnost a udržitelný rozvoj, čímž třem státům poskytuje jednotný moderní rámec pro další rozvoj." # todo: NEW TRANSLATION
 BNL_single_market: "Vnitřní trh Beneluxu" # todo: NEW TRANSLATION
 BNL_single_market_desc: "Benelux jde dál než širší evropský trh a odstraňuje administrativní překážky, které stále rozdělují tyto tři ekonomiky. Unie, která je již dlouho laboratoří evropské integrace, zavádí společné normy a vzájemné uznávání, díky nimž mohou firmy obchodovat a působit, jako by hranice neexistovaly." # todo: NEW TRANSLATION
 BNL_capital_integration: "Integrace kapitálového trhu" # todo: NEW TRANSLATION
 BNL_capital_integration_desc: "Amsterodamská burza, bruselské banky a rozsáhlý lucemburský průmysl investičních fondů již tvoří jeden z nejhlubších zdrojů kapitálu v Evropě. Sladění finančního dohledu a přeshraničních pravidel umožní tomuto kapitálu volně proudit k nejproduktivnějším firmám v celé unii." # todo: NEW TRANSLATION
 BNL_port_cooperation: "Rotterdam a Antverpy" # todo: NEW TRANSLATION
 BNL_port_cooperation_desc: "Rotterdam a Antverpy jsou dva největší přístavy v Evropě. Koordinace antverpsko-rotterdamsko-amsterodamského přístavního komplexu namísto soupeření o stejný náklad promění beneluxkou logistiku v jednotnou prvotřídní bránu do světa." # todo: NEW TRANSLATION
 BNL_freight_corridors: "Nákladní koridory" # todo: NEW TRANSLATION
 BNL_freight_corridors_desc: "Vyhrazená železniční spojení, jako Betuweroute a Železný Rýn, propojují námořní přístavy s evropským vnitrozemím. Společné investice do těchto koridorů posilují průmyslovou páteř unie." # todo: NEW TRANSLATION
 BNL_north_sea_wind: "Větrná energie Severního moře" # todo: NEW TRANSLATION
 BNL_north_sea_wind_desc: "V rámci Spolupráce v oblasti energetiky Severního moře Benelux společně rozvíjí pobřežní větrnou energetiku. Propojení elektrických sítí promění Severní moře ve sdílený zdroj obnovitelné energie." # todo: NEW TRANSLATION
 BNL_gas_hub: "Plynárenský uzel Beneluxu" # todo: NEW TRANSLATION
 BNL_gas_hub_desc: "Gröningenské ložisko a terminál LNG v Zeebrugge činí z Beneluxu plynárenský obchodní uzel. Koordinace dodávek prostřednictvím Pentalaterálního energetického fóra zajišťuje energetickou bezpečnost unie." # todo: NEW TRANSLATION
 BNL_research_cooperation: "Špičkový technologický region" # todo: NEW TRANSLATION
 BNL_research_cooperation_desc: "Eindhoven a Leuven, sahající směrem k Cáchám, tvoří Špičkový technologický region, jednu z nejhustších koncentrací výzkumu špičkových technologií v Evropě. Sdílením laboratoří, financování a talentů napříč tímto přeshraničním trojúhelníkem může Benelux inovovat rychleji než soupeři mnohonásobně větší než on sám." # todo: NEW TRANSLATION
 BNL_university_network: "Síť univerzit" # todo: NEW TRANSLATION
 BNL_university_network_desc: "Delft, Leuven, Eindhoven a Wageningen tvoří oporu husté akademické sítě. Propojení jejich programů a titulů vytváří společný fond talentů a znalostí." # todo: NEW TRANSLATION
 BNL_hightech_triangle: "Trojúhelník špičkových technologií" # todo: NEW TRANSLATION
 BNL_hightech_triangle_desc: "Brainport Eindhoven, domov společností ASML a NXP, a imec v Lovani tvoří srdce evropského výzkumu polovodičů. Společná podpora tohoto klastru udrží Benelux na čele špičkových technologií." # todo: NEW TRANSLATION
 BNL_space_cooperation: "Spolupráce ve vesmíru" # todo: NEW TRANSLATION
 BNL_space_cooperation_desc: "Technologické srdce Evropské kosmické agentury, ESTEC, se nachází v Noordwijku. Koordinace beneluxkých příspěvků k evropskému vesmírnému úsilí buduje kapacity pro pokročilé strojírenství." # todo: NEW TRANSLATION
 BNL_nuclear_research: "Jaderný výzkum" # todo: NEW TRANSLATION
 BNL_nuclear_research_desc: "Petten v Nizozemsku a SCK CEN v belgickém Molu s projektem reaktoru MYRRHA vedou evropský výzkum reaktorů a lékařských izotopů. Společný program posouvá jadernou vědu unie." # todo: NEW TRANSLATION
 BNL_innovation_area: "Beneluxká inovační oblast" # todo: NEW TRANSLATION
 BNL_innovation_area_desc: "Propojení výzkumné sítě, technologického klastru a jaderných a vesmírných programů do jediné inovační oblasti činí z Beneluxu jeden z vědecky nejintenzivnějších regionů na Zemi." # todo: NEW TRANSLATION
 BNL_benelux_parliament: "Beneluxký parlament" # todo: NEW TRANSLATION
 BNL_benelux_parliament_desc: "Smlouva z roku 2015 nahrazuje starou Poradní radu z roku 1955 Beneluxkým meziparlamentním shromážděním a poskytuje unii parlamentní fórum složené ze zástupců tří národních zákonodárných sborů. Jeho posílení pokládá základy hlubší politické integrace mezi třemi státy." # todo: NEW TRANSLATION
 BNL_benelux_court: "Beneluxký soudní dvůr" # todo: NEW TRANSLATION
 BNL_benelux_court_desc: "Protokol z roku 2012 modernizuje Beneluxký soudní dvůr a rozšiřuje jeho působnost ze společného trhu do nových oblastí, jako je duševní vlastnictví. Společný soud harmonizuje právo ve všech třech jurisdikcích a dává unii společný právní řád." # todo: NEW TRANSLATION
 BNL_shared_foreign_policy: "Společná zahraniční politika" # todo: NEW TRANSLATION
 BNL_shared_foreign_policy_desc: "V návaznosti na tradici starou jako sama unie koordinují tři vlády své postoje před každou Evropskou radou a summitem NATO. Benelux, který hovoří jedním hlasem, má v Bruselu vliv daleko přesahující velikost jeho členů." # todo: NEW TRANSLATION
 BNL_political_union: "Politická unie" # todo: NEW TRANSLATION
 BNL_political_union_desc: "Se společným parlamentem, soudem a jednotnou zahraniční politikou tři vlády překračují pouhou spolupráci a spojují své politické instituce do jediné unie, která se od státu liší už jen názvem." # todo: NEW TRANSLATION
 BNL_treaty_of_union: "Smlouva o unii" # todo: NEW TRANSLATION
 BNL_treaty_of_union_desc: "Po desetiletích společných institucí přichází tento okamžik. Tři národy jsou hluboce integrovány a vedoucí vláda předkládá svým partnerům otázku vytvoření jediného beneluxkého státu. Pouze s jejich souhlasem může oddělenou suverenitu nahradit jeden národ." # todo: NEW TRANSLATION
 BNL_treaty_of_union_tt: "Otevírá cestu ke sjednocenému beneluxkému státu" # todo: NEW TRANSLATION
 BNL_integration_requirement_tt: "$BNL_integration$ je vyšší než §G100§!" # todo: NEW TRANSLATION
 BNL_integration: "§YBeneluxká integrace§!" # todo: NEW TRANSLATION
 BNL_integration_tt: "£GFX_benelux_icon $BNL_integration$: $RIGHT|+=1$" # todo: NEW TRANSLATION
 BNL_integration_tooltip: "£GFX_benelux_icon $BNL_integration$: §G[?BNL_integration]§!" # todo: NEW TRANSLATION
 BNL_benelux_defence: "Beneluxká deklarace obrany" # todo: NEW TRANSLATION
 BNL_benelux_defence_desc: "Beneluxká deklarace z roku 2012 zavázala Belgii, Nizozemsko a Lucembursko ke sdílení obranného úsilí a nákladů a ke zvýšení společné vojenské produkce. Je rámcem, v němž tři ozbrojené síly prohlubují svou spolupráci." # todo: NEW TRANSLATION
 BNL_mio_sharing_tt: "§Y[BEL.GetNameWithFlag]§!, §Y[HOL.GetNameWithFlag]§! a §Y[LUX.GetNameWithFlag]§! sdílejí všechny §Yvojensko-průmyslové organizace§!." # todo: NEW TRANSLATION
 BNL_benelux_air_policing: "Benelukská ochrana vzdušného prostoru" # todo: NEW TRANSLATION
 BNL_benelux_air_policing_desc: "Od roku 2017 se Belgie a Nizozemsko střídají při ochraně vzdušného prostoru všech tří zemí v rámci jednotné pohotovosti rychlé reakce a s právem zasahovat přes hranice druhé země." # todo: NEW TRANSLATION
 BNL_air_defence_command: "Velitelství a řídicí středisko letectva" # todo: NEW TRANSLATION
 BNL_air_defence_command_desc: "Společné velitelství a řídicí středisko letectva propojuje radarový obraz a pozemní protivzdušnou obranu tří národů do jediného koordinovaného systému." # todo: NEW TRANSLATION
 BNL_binational_air_command: "Binacionální letecké velitelství" # todo: NEW TRANSLATION
 BNL_binational_air_command_desc: "Sloučení operačních leteckých velitelství umožňuje beneluxkým vzdušným silám plánovat a provádět mise jako jediná organizace a sdílet základny, řídící personál i postupy." # todo: NEW TRANSLATION
 BNL_mrtt_fleet: "Mnohonárodní flotila MRTT" # todo: NEW TRANSLATION
 BNL_mrtt_fleet_desc: "Sdílená flotila letounů Airbus A330 Multi Role Tanker Transport, umístěná v Eindhovenu a sdílená mezi beneluxkými partnery a dalšími evropskými státy, poskytuje všem členům doplňování paliva za letu a strategickou leteckou přepravu." # todo: NEW TRANSLATION
 BNL_eatc: "Evropské velitelství letecké dopravy" # todo: NEW TRANSLATION
 BNL_eatc_desc: "Evropské velitelství letecké dopravy se sídlem v Eindhovenu sdružuje vojenské transportní, tankovací a zdravotnické letouny svých členů pod jediným velením." # todo: NEW TRANSLATION
 BNL_belux_a400m: "Jednotka BELUX A400M" # todo: NEW TRANSLATION
 BNL_belux_a400m_desc: "Belgie a Lucembursko sdružují své transportní letouny A400M Atlas do jediné binacionální jednotky v Melsbroeku a sdílejí posádky, údržbu i společné výcvikové středisko. Jediný lucemburský letoun létá v belgických barvách a oba národy dělí náklady i letové hodiny jediné flotily." # todo: NEW TRANSLATION
 BNL_f35_cooperation: "Společná údržba F-35" # todo: NEW TRANSLATION
 BNL_f35_cooperation_desc: "Belgie a Nizozemsko koordinují výcvik a údržbu svých flotil F-35 a sdílejí zařízení i odborné znalosti napříč oběma letectvy." # todo: NEW TRANSLATION
 BNL_benesam: "Námořní dohoda BENESAM" # todo: NEW TRANSLATION
 BNL_benesam_desc: "Belgie a Nizozemsko provozují svá dvě námořnictva jako jedno, sdílejí výcvik, logistiku a údržbu, zatímco každá země si ponechává velení nad vlastním nasazením. Prohloubení této dlouholeté dohody činí ze spojené flotily mnohem více než pouhý součet jejích částí." # todo: NEW TRANSLATION
 BNL_admiral_benelux: "Admirál Beneluxu" # todo: NEW TRANSLATION
 BNL_admiral_benelux_desc: "Jediný binacionální námořní štáb v Den Helderu velí operacím belgického a nizozemského loďstva, přičemž velitelé obou námořnictev sdílejí společné velitelství." # todo: NEW TRANSLATION
 BNL_vlissingen_class: "Minolovky třídy Vlissingen" # todo: NEW TRANSLATION
 BNL_vlissingen_class_desc: "Společný belgicko-nizozemský program náhrady minolovek, jehož cílem je dvanáct lodí nahrazujících stárnoucí minolovky třídy Tripartite Alkmaar. Tyto mateřské lodě s odstupem, postavené společností Naval Group, vyhledávají miny z bezpečné vzdálenosti pomocí autonomních hladinových a podvodních dronů. Nizozemsko provozuje svých šest plavidel jako třídu Vlissingen vedle belgických lodí stejné konstrukce." # todo: NEW TRANSLATION
 BNL_hollandklasse_frigate: "Vývoj fregat třídy Hollandklasse" # todo: NEW TRANSLATION
 BNL_hollandklasse_frigate_desc: "Nizozemsko pokládá kýly nových fregat třídy Hollandklasse, aby obnovilo své námořní hlídkové a protiponorkové loďstvo. Jsou vybaveny moderními senzory, raketovými systémy a trupem se sníženou zjistitelností, chrání nizozemské vody a podporují operace v zámoří." # todo: NEW TRANSLATION
 BNL_aswf_frigate: "Protiponorková fregata" # todo: NEW TRANSLATION
 BNL_aswf_frigate_desc: "Belgie a Nizozemsko společně nahrazují své fregaty třídy M novou protiponorkovou konstrukcí a sdílejí vývoj, radar i bojové systémy." # todo: NEW TRANSLATION
 BNL_para_school: "Beneluxká parašutistická škola" # todo: NEW TRANSLATION
 BNL_para_school_desc: "Beneluxké parašutistické školy jsou sloučeny do jediného výcvikového střediska v Schaffenu, které kvalifikuje výsadkové jednotky všech tří národů podle společného standardu." # todo: NEW TRANSLATION
 BNL_csomtg: "Společná skupina zvláštních operací" # todo: NEW TRANSLATION
 BNL_csomtg_desc: "Belgie a Nizozemsko vytvářejí společnou námořní skupinu zvláštních operací připravenou k souběžnému nasazení na zemi i na moři při rychlých misích NATO." # todo: NEW TRANSLATION
 benelux.1.t: "Smlouva o beneluxké unii" # todo: NEW TRANSLATION
 benelux.1.d: "[FROM.GetName] navrhuje, abychom odložili svou oddělenou suverenitu a připojili se k jedinému beneluxkému státu. Desetiletí společných institucí připravila půdu, avšak vzdát se státnosti není malý krok." # todo: NEW TRANSLATION
 benelux.1.a: "Připojíme se k unii" # todo: NEW TRANSLATION
 benelux.1.b: "Zůstaneme vlastním národem" # todo: NEW TRANSLATION
 benelux.2.t: "Náš partner přijímá unii" # todo: NEW TRANSLATION
 benelux.2.d: "[FROM.GetName] souhlasí s připojením ke sjednocenému Beneluxu. Nyní, když je náš partner s námi spojen, můžeme dokončit vytvoření unie." # todo: NEW TRANSLATION
 benelux.2.a: "Rodí se nový národ" # todo: NEW TRANSLATION
 benelux.3.t: "Náš partner odmítá unii" # todo: NEW TRANSLATION
 benelux.3.d: "[FROM.GetName] zatím není ochoten vzdát se své nezávislosti. Unie bude muset počkat, nebo být vybudována na pevnějších základech." # todo: NEW TRANSLATION
 benelux.3.a: "Budeme trpěliví" # todo: NEW TRANSLATION
 benelux.4.t: "Smlouva o beneluxké unii" # todo: NEW TRANSLATION
 benelux.4.d: "[FROM.GetName] navrhuje, abychom odložili svou oddělenou suverenitu a připojili se k jedinému beneluxkému státu. Již nyní jsme oporou beneluxké spolupráce, naše ekonomika a ozbrojené síly dalece převyšují síly našich partnerů a unii fakticky vedeme, byť ne formálně. Formální sjednocení by vyměnilo toto faktické prvenství a naši výhradní kontrolu nad státem, kterému již dominujeme, za společné instituce, které bychom nemohli jednostranně řídit." # todo: NEW TRANSLATION
 benelux.4.a: "Připojíme se k unii" # todo: NEW TRANSLATION
 benelux.4.b: "Zůstaneme vlastním národem" # todo: NEW TRANSLATION
 benelux.5.t: "Smlouva o beneluxké unii" # todo: NEW TRANSLATION
 benelux.5.d: "[FROM.GetName] navrhuje, abychom odložili svou oddělenou suverenitu a připojili se k jedinému beneluxkému státu. Jako zdaleka nejmenší ze tří zemí riskujeme, že nás naši dva mnohem větší sousedé politicky a kulturně pohltí a naše velkovévodství se stane pouhou poznámkou v unii, kterou nemáme naději řídit." # todo: NEW TRANSLATION
 benelux.5.a: "Připojíme se k unii" # todo: NEW TRANSLATION
 benelux.5.b: "Zůstaneme vlastním národem" # todo: NEW TRANSLATION
 BNL_retry_treaty_of_union_BEL: "Obnovit návrh unie Belgii" # todo: NEW TRANSLATION
 BNL_retry_treaty_of_union_BEL_desc: "Belgie odmítla poslední návrh na vytvoření sjednoceného beneluxkého státu. Upravený přístup podpořený novými argumenty a obnoveným diplomatickým tlakem by mohl Brusel ještě přesvědčit." # todo: NEW TRANSLATION
 BNL_retry_treaty_of_union_HOL: "Obnovit návrh unie Nizozemsku" # todo: NEW TRANSLATION
 BNL_retry_treaty_of_union_HOL_desc: "Nizozemsko odmítlo poslední návrh na vytvoření sjednoceného beneluxkého státu. Upravený přístup podpořený novými argumenty a obnoveným diplomatickým tlakem by mohl Haag ještě přesvědčit." # todo: NEW TRANSLATION
 BNL_retry_treaty_of_union_LUX: "Obnovit návrh unie Lucembursku" # todo: NEW TRANSLATION
 BNL_retry_treaty_of_union_LUX_desc: "Lucembursko odmítlo poslední návrh na vytvoření sjednoceného beneluxkého státu. Upravený přístup podpořený novými argumenty a obnoveným diplomatickým tlakem by mohl přesvědčit velkovévodství." # todo: NEW TRANSLATION
 BNL_retry_shared_outlook_tt: "Je pravděpodobnější, že přijmou, pokud budeme mít stejnou formu vlády." # todo: NEW TRANSLATION
 BNL_retry_influence_tt: "Je pravděpodobnější, že přijmou, pokud nad nimi budeme mít značný vliv." # todo: NEW TRANSLATION
 BNL_retry_opinion_tt: "Je pravděpodobnější, že přijmou, pokud jejich názor na nás bude vyšší než §G200§!." # todo: NEW TRANSLATION
