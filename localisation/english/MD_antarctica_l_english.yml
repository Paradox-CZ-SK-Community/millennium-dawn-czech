 ANTARCTICA_STATION_SEND_SUPPLIES_TEXT_DELAYED: "§YPožadavky:§!\n[!antarctica_station_send_supplies_button_click_enabled]\n§YÚčinky:§!\nDoplní palivo stanice na maximální kapacitu.\nCena: §R$0.25b za 1000 jednotek paliva§! (během antarktické zimy dvojnásobná).\nPokladna bude zatížena při objednání, palivo dorazí po uplynutí doby dodání.\n\n§YDoba dodání:§! §G15 dní (listopad–březen)§! nebo §R30 dní (duben–říjen)§!." # todo: NEW TRANSLATION
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT: "Odeslat pozorovatele" # todo: NEW TRANSLATION
