 antarctica_leave_ccas_effect_tt: "Opustit §YCCAS§! a odstranit laboratorní bonusy CCAS." # todo: NEW TRANSLATION
 antarctica_join_ccamlr_effect_tt: "Připojit se k §YCCAMLR§!.\nZvyšuje příslušné výstupy laboratoří o §G+20%§! (násobitel), nikoli o pevné hodnoty:\n- Výstup §Yvýzkumu ponorek§!\n- Výstup §Yvýzkumu námořních modulů§!\n- Výstup detekce námořnictva\nPříklad: §Y+6%§! výzkumu ponorek se změní na §G+7.2%§!." # todo: NEW TRANSLATION
 antarctica_leave_ccamlr_effect_tt: "Opustit §YCCAMLR§! a odstranit laboratorní bonusy CCAMLR." # todo: NEW TRANSLATION
 join_antarctica_treaty_tt: "Po jednom měsíci:" # todo: NEW TRANSLATION
 leave_antarctica_treaty_tt: "Po 2 letech:" # todo: NEW TRANSLATION
 leave_antarctica_cannot_be_stopped_tt: "§RTuto akci nelze zastavit.§!" # todo: NEW TRANSLATION
 leave_antarctica_treaty_warning_tt: "§RVAROVÁNÍ:§!\nOpustit §CAntarktickou smlouvu§! v době, kdy máte v §CAntarktidě§! §Yvýzkumnou stanici§!, vyvolá globální reakci členů smlouvy včetně možných sankcí a diplomatického odporu. Doporučuje se před opuštěním smlouvy demontovat všechny výzkumné stanice v §CAntarktidě§!, abyste se vyhnuli negativním následkům.\n\nPokud se však rozhodnete smlouvu opustit a stanici si ponecháte, žádný článek vám nezabrání zahájit v §CAntarktidě§! zakázané činnosti, například těžbu zdrojů nebo vojenskou přítomnost, což může mít vážné důsledky pro globální pověst vašeho státu." # todo: NEW TRANSLATION
 antarctica_post_treaty_activity_category: "Antarktické aktivity po opuštění smlouvy" # todo: NEW TRANSLATION
 antarctica_post_treaty_activity_category_desc: "Tyto akce jsou viditelné, protože jsme opustili Antarktickou smlouvu a stále udržujeme stanici v Antarktidě." # todo: NEW TRANSLATION
 antarctica_post_treaty_resource_extraction: "Využívat antarktické zdroje" # todo: NEW TRANSLATION
 antarctica_post_treaty_resource_extraction_desc: "Můžeme využít zbývající infrastrukturu stanice k těžbě zdrojů z Antarktidy. Zvýší to příjmy, ale vyvolá diplomatický odpor členů smlouvy." # todo: NEW TRANSLATION
 antarctica_post_treaty_military_preparations: "Připravit vojenskou infrastrukturu" # todo: NEW TRANSLATION
 antarctica_post_treaty_military_preparations_desc: "Přestavět zařízení stanice pro vojenské plánování a logistiku. Poskytne to vojenské výhody, ale bude to považováno za závažnou provokaci." # todo: NEW TRANSLATION
 antarctica_laboratory_dynamic_modifier: "Výstup antarktické výzkumné stanice" # todo: NEW TRANSLATION
 antarctica_lab_tech_bonus: "Bonus technologií laboratoře antarktické výzkumné stanice" # todo: NEW TRANSLATION
 has_startup_antarctica_station_TT: "Měl výzkumnou stanici před rokem 2000" # todo: NEW TRANSLATION
 antarctica_atcp_application_pending: "[ROOT.GetNameWithFlag] – žádost o ATCP čeká na vyřízení" # todo: NEW TRANSLATION
 is_antarctica_atcp_consultative_member: "[ROOT.GetNameWithFlag] je již členem ATCP" # todo: NEW TRANSLATION
 increase_antarctica_station_reports_tt: "Zvýší počet hlášení antarktické stanice o §R[?antarctica_station_reports_temp]§! (aktuálně §R[?antarctica_station_reports]§!/§R7§!)" # todo: NEW TRANSLATION
 antarctica_reports_warning_tt: "§RVarování:§!\nPokud počet hlášení překročí 7, mohou Konzultativní strany Antarktické smlouvy podniknout proti vašemu státu diplomatické kroky včetně možných tvrdých sankcí a ztráty statusu ATCP, pokud jej máte. Doporučuje se udržet počet hlášení pod 7, abyste se vyhnuli negativním následkům.\n\nPokud k překročení dojde po odhalení jaderného výzkumu, každý stát Antarktické smlouvy obdrží událost umožňující uvalit na váš stát embargo." # todo: NEW TRANSLATION
 antarctica_ccas_member: "Aktuálně člen CCAS" # todo: NEW TRANSLATION
 antarctica_ccamlr_member: "Aktuálně člen CCAMLR" # todo: NEW TRANSLATION
 antarctica_lab_iteration_progress_modifier: "Bonus postupu iterace antarktické výzkumné stanice" # todo: NEW TRANSLATION
 antarctica_treaty_leave_pending: "[ROOT.GetNameWithFlag] – opuštění Antarktické smlouvy čeká na vyřízení" # todo: NEW TRANSLATION
 antarctica_has_active_station: "Má aktivní §Yvýzkumnou stanici§! v §CAntarktidě§!" # todo: NEW TRANSLATION
 ANT_CATERPILLAR_3512B_EFFECT: "Elektrárna §YCaterpillar 3512B§! je dostupná k instalaci v §Yantarktické stanici§!." # todo: NEW TRANSLATION
 ANT_PREMIUM_LIVING_QUARTERS_EFFECT: "Obytný modul §YPrémiové obytné prostory§! je dostupný k instalaci v §Yantarktické stanici§!." # todo: NEW TRANSLATION
 MD_antarctica_news.1.t: "[FROM.GetName] žádá o připojení k Antarktické smlouvě" # todo: NEW TRANSLATION
 MD_antarctica_news.1.d: "[FROM.GetName] požádal o připojení k Antarktické smlouvě, což naznačuje možný posun v jeho zahraniční politice a závazku k ochraně životního prostředí. Antarktická smlouva je mezinárodní dohoda upravující využívání Antarktidy k mírovým účelům a vědeckému výzkumu a zároveň chránící jedinečný ekosystém kontinentu. Žádost [FROM.GetName] o připojení ke smlouvě se setkala s vřelými reakcemi mezinárodního společenství; někteří tento krok chválí jako pozitivní příspěvek ke globální spolupráci, zatímco jiní vyjadřují skepsi ohledně záměrů [FROM.GetName] a jeho odhodlání dodržovat zásady smlouvy. Proces žádosti potrvá měsíc." # todo: NEW TRANSLATION
 MD_antarctica_news.1.a: "Čas ukáže" # todo: NEW TRANSLATION
 MD_antarctica_news.1.b: "Bylo načase" # todo: NEW TRANSLATION
 MD_antarctica_news.2.t: "[FROM.GetName] se připojuje k Antarktické smlouvě" # todo: NEW TRANSLATION
 MD_antarctica_news.2.d: "Dnes, dne [GetDateText], [FROM.GetName] oficiálně přistoupil k Antarktické smlouvě a stal se členem mezinárodní dohody upravující využívání Antarktidy k mírovým účelům a vědeckému výzkumu. Připojením ke smlouvě se [FROM.GetName] zavázal dodržovat zásady ochrany životního prostředí a mezinárodní spolupráce v Antarktidě. Tento krok se setkal s pozitivními reakcemi světového společenství a mnozí chválí [FROM.GetName] za jeho odhodlání chránit jedinečný ekosystém Antarktidy a podporovat mírovou spolupráci mezi státy." # todo: NEW TRANSLATION
 MD_antarctica_news.2.a: "Další člen" # todo: NEW TRANSLATION
 MD_antarctica_news.2.b: "Pusťme se do práce!" # todo: NEW TRANSLATION
 MD_antarctica_news.3.t: "[FROM.GetName] usiluje o opuštění Antarktické smlouvy" # todo: NEW TRANSLATION
 MD_antarctica_news.3.d: "[FROM.GetName] se dnes rozhodl opustit Antarktickou smlouvu. Komise pro zachování živých mořských zdrojů Antarktidy (CCAMLR) mu poskytuje 2 roky na demontáž všech výzkumných stanic v Antarktidě a na zdržení se zakázaných činností, jako je těžba zdrojů nebo vojenská přítomnost. Rozhodnutí opustit smlouvu vyvolalo smíšené reakce mezinárodního společenství; někteří vyjadřují zklamání a obavy z možných důsledků pro životní prostředí a globální spolupráci, zatímco jiní podporují právo [FROM.GetName] rozhodovat o své účasti v mezinárodních dohodách. Proces opuštění smlouvy potrvá 2 roky." # todo: NEW TRANSLATION
 MD_antarctica_news.3.a: "Jaká škoda" # todo: NEW TRANSLATION
 MD_antarctica_news.3.b: "Máme důležitější věci na práci" # todo: NEW TRANSLATION
 MD_antarctica_news.4.t: "[FROM.GetName] opouští Antarktickou smlouvu" # todo: NEW TRANSLATION
 MD_antarctica_news.4.d: "[MD_antarctica_news_4_desc]" # todo: NEW TRANSLATION
 MD_antarctica_news.4.a: "Smlouva je oslabena" # todo: NEW TRANSLATION
 MD_antarctica_news.4.b: "No a co" # todo: NEW TRANSLATION
 MD_antarctica_news_4_desc_1: "Po 2 letech od oznámení odchodu z Antarktické smlouvy [FROM.GetName] oficiálně opustil mezinárodní dohodu upravující využívání Antarktidy k mírovým účelům a vědeckému výzkumu. Navzdory varováním [FROM.GetName] smlouvu opustil, přestože měl v Antarktidě výzkumnou stanici, což vyvolalo globální reakci členů smlouvy včetně možných sankcí a diplomatického odporu." # todo: NEW TRANSLATION
 MD_antarctica_news_4_desc_2: "Po 2 letech od oznámení odchodu z Antarktické smlouvy [FROM.GetName] oficiálně opustil mezinárodní dohodu upravující využívání Antarktidy k mírovým účelům a vědeckému výzkumu. [FROM.GetName] úspěšně demontoval všechny výzkumné stanice v Antarktidě a vyhnul se zakázaným činnostem, jako je těžba zdrojů nebo vojenská přítomnost, čímž pomohl zmírnit možné důsledky pro životní prostředí a globální spolupráci." # todo: NEW TRANSLATION
 MD_antarctica_news.5.t: "Na antarktické stanici [FROM.GetAdjective] byly odhaleny otevřené utility" # todo: NEW TRANSLATION
 MD_antarctica_news.5.d: "Během nedávné pozorovatelské mise odhalili pozorovatelé smlouvy využívání otevřených utilit na jedné z antarktických výzkumných stanic [FROM.GetAdjective]. Jedná se o porušení Antarktické smlouvy, která zakazuje jakoukoli činnost, jež může poškodit životní prostředí nebo narušit ekosystém Antarktidy. Odhalení otevřených utilit vyvolalo mezi členy smlouvy obavy a může vést k diplomatickým následkům." # todo: NEW TRANSLATION
 MD_antarctica_news.5.a: "Někteří lidé musí šetřit" # todo: NEW TRANSLATION
 MD_antarctica_news.5.b: "No dobře" # todo: NEW TRANSLATION
 MD_antarctica_news.6.t: "Na antarktické stanici [FROM.GetAdjective] byla odhalena nelegální laboratorní činnost" # todo: NEW TRANSLATION
 MD_antarctica_news.6.d: "Během nedávné pozorovatelské mise odhalili pozorovatelé smlouvy nelegální laboratorní činnost na jedné z antarktických výzkumných stanic [FROM.GetAdjective]. Toto jednání je nepřijatelné a představuje jasné porušení Antarktické smlouvy. Konzultativní strany smlouvy se touto otázkou budou zabývat a přijmou vhodná opatření k zajištění ochrany jedinečného ekosystému Antarktidy a integrity smlouvy." # todo: NEW TRANSLATION
 MD_antarctica_news.6.a: "To je nepřijatelné" # todo: NEW TRANSLATION
 MD_antarctica_news.6.b: "Musíme s tím něco udělat" # todo: NEW TRANSLATION
 MD_antarctica_news.7.t: "Na antarktické stanici [FROM.GetAdjective] byl odhalen výzkum jaderných zbraní" # todo: NEW TRANSLATION
 MD_antarctica_news.7.d: "Během nedávné pozorovatelské mise odhalili pozorovatelé smlouvy výzkum jaderných zbraní na jedné z antarktických výzkumných stanic [FROM.GetAdjective]. Jedná se o závažné porušení Antarktické smlouvy, která zakazuje jakoukoli vojenskou činnost i jakoukoli činnost, jež může poškodit životní prostředí nebo narušit ekosystém Antarktidy. Využití mírové výzkumné stanice ke konstrukci a testování jaderných zbraní je pobuřujícím činem ohrožujícím bezpečnost celého světa. Konzultativní strany smlouvy přijmou okamžitá a rozhodná opatření, aby tento problém vyřešily a pohnaly odpovědné osoby k odpovědnosti. Mezinárodní společenství musí odsoudit toto jednání a zajistit, aby Antarktida zůstala mírovým a chráněným prostředím pro vědecký výzkum a spolupráci." # todo: NEW TRANSLATION
 MD_antarctica_news.7.a: "To je pobuřující!" # todo: NEW TRANSLATION
 MD_antarctica_news.7.b: "Bylo to důležitější" # todo: NEW TRANSLATION
 MD_antarctica_news.8.t: "[FROM.GetName] příliš často porušoval Antarktickou smlouvu" # todo: NEW TRANSLATION
 MD_antarctica_news.8.d: "Po několika porušeních Antarktické smlouvy dosáhl [FROM.GetName] kritického bodu, kdy se Konzultativní strany smlouvy rozhodly jej ze smlouvy vyloučit a uvalit na něj závažné diplomatické důsledky. Opakovaná porušení zásad a předpisů smlouvy podkopala integritu dohody a ohrozila ochranu jedinečného ekosystému Antarktidy. Konzultativní strany smlouvy přijmou rozhodná opatření, aby byl [FROM.GetName] pohnán k odpovědnosti a aby Antarktická smlouva zůstala silným a účinným rámcem mezinárodní spolupráce a ochrany životního prostředí." # todo: NEW TRANSLATION
 MD_antarctica_news.8.a: "Může si za to sám" # todo: NEW TRANSLATION
 MD_antarctica_news.8.b: "To už je příliš" # todo: NEW TRANSLATION
 MD_antarctica_news.9.t: "Silný vítr nad Antarktidou" # todo: NEW TRANSLATION
 MD_antarctica_news.9.d: "Nad Antarktidou byl hlášen silný vítr, který zasáhl výzkumné stanice. Konzultativní strany smlouvy situaci sledují a poskytují podporu, aby zajistily bezpečí personálu a průběh probíhajícího výzkumu. Pozorovatelské mise jsou do zlepšení povětrnostních podmínek dočasně pozastaveny." # todo: NEW TRANSLATION
 MD_antarctica_news.9.a: "Nic moc" # todo: NEW TRANSLATION
 MD_antarctica_news.10.t: "[FROM.GetName] zahajuje výstavbu antarktické výzkumné stanice" # todo: NEW TRANSLATION
 MD_antarctica_news.10.d: "[FROM.GetName] zahájil výstavbu nové antarktické výzkumné stanice, čímž dává najevo své odhodlání věnovat se vědeckému výzkumu a ochraně životního prostředí v regionu. Očekává se, že výstavba stanice potrvá několik měsíců. Konzultativní strany smlouvy budou její postup pečlivě sledovat, aby zajistily soulad se zásadami a předpisy Antarktické smlouvy." # todo: NEW TRANSLATION
 MD_antarctica_news.10.a: "Skvělé!" # todo: NEW TRANSLATION
 MD_antarctica.1.t: "Příchozí pozorovatelská mise" # todo: NEW TRANSLATION
 MD_antarctica.1.d: "[FROM.GetName] vyslal pozorovatele smlouvy, aby zkontrolovali jednu z našich antarktických výzkumných stanic. Očekává se, že mise dorazí za §Y7 dní§!." # todo: NEW TRANSLATION
 MD_antarctica.1.a: "Počkáme na jejich příjezd" # todo: NEW TRANSLATION
 MD_antarctica.3.t: "Zpráva pozorovatelské mise: odhaleny otevřené utility" # todo: NEW TRANSLATION
 MD_antarctica.3.d: "Pozorovatelé smlouvy dokončili kontrolu naší antarktické výzkumné stanice a oznámili odhalení využívání otevřených utilit. Jedná se o porušení Antarktické smlouvy a může vést k diplomatickým následkům. Konzultativní strany smlouvy požadují, abychom utility nahradili ekologičtějšími možnostmi." # todo: NEW TRANSLATION
 MD_antarctica.3.a: "Musíme se toho zbavit" # todo: NEW TRANSLATION
 MD_antarctica.4.t: "Zpráva pozorovatelské mise: odhalena nelegální laboratorní činnost" # todo: NEW TRANSLATION
 MD_antarctica.4.d: "Pozorovatelé smlouvy dokončili kontrolu naší antarktické výzkumné stanice a oznámili odhalení nelegální laboratorní činnosti. Konzultativní strany nepřijmou další opatření, pokud veškerou nelegální činnost na naší stanici ukončíme." # todo: NEW TRANSLATION
 MD_antarctica.4.a: "Musíme s tím něco udělat" # todo: NEW TRANSLATION
 MD_antarctica.5.t: "Zpráva pozorovatelské mise: odhalen výzkum jaderných zbraní" # todo: NEW TRANSLATION
 MD_antarctica.5.d: "Pozorovatelé smlouvy dokončili kontrolu naší antarktické výzkumné stanice a oznámili odhalení výzkumu jaderných zbraní. Jedná se o závažné porušení Antarktické smlouvy a povede k okamžitým diplomatickým následkům. Konzultativní strany smlouvy přijmou rozhodná opatření k vyřešení tohoto problému a pohnání odpovědných osob k odpovědnosti a požadují okamžité ukončení veškerého jaderného výzkumu na naší stanici." # todo: NEW TRANSLATION
 MD_antarctica.5.a: "Musíme se toho okamžitě zbavit!" # todo: NEW TRANSLATION
 MD_antarctica.6.t: "Porušení Antarktické smlouvy: příliš mnoho přestupků" # todo: NEW TRANSLATION
 MD_antarctica.6.d: "Vážený [ROOT.GetLeader],\n\ns politováním vám oznamujeme, že váš stát, [ROOT.GetName], porušil Antarktickou smlouvu příliš mnohokrát, celkem [?antarctica_station_reports]krát. V důsledku toho se Konzultativní strany smlouvy rozhodly [ROOT.GetName] ze smlouvy během 2 let vyloučit a uvalit na něj závažné diplomatické následky. Opakovaná porušení zásad a předpisů smlouvy podkopala integritu dohody a ohrozila ochranu jedinečného ekosystému Antarktidy. Vyzýváme vás, abyste tuto záležitost brali vážně a výzkumnou stanici odstranili dříve, než bude vaše členství zrušeno.\n\nS pozdravem,\nKonzultativní strany Antarktické smlouvy" # todo: NEW TRANSLATION
 MD_antarctica.6.a: "Můžeme si za to sami" # todo: NEW TRANSLATION
 MD_antarctica.7.t: "Uvalit embargo na [FROM.GetName]?" # todo: NEW TRANSLATION
 MD_antarctica.7.d: "Vzhledem k nedávnému odhalení výzkumu jaderných zbraní na jedné z antarktických výzkumných stanic [FROM.GetAdjective] zvažují Konzultativní strany Antarktické smlouvy uvalení embarga na [FROM.GetName]. To by znamenalo omezení obchodu a diplomatických vztahů s [FROM.GetName] v reakci na porušení zásad a předpisů smlouvy." # todo: NEW TRANSLATION
 MD_antarctica.7.a: "Za své činy musí zaplatit" # todo: NEW TRANSLATION
 MD_antarctica.7.b: "Nestojí to za to" # todo: NEW TRANSLATION
 MD_antarctica.9.t: "Modul antarktické stanice poškozen" # todo: NEW TRANSLATION
 MD_antarctica.9.d: "Modul na jedné z našich antarktických výzkumných stanic byl poškozen vánicí. Inženýři připravují opravy a zahájí je, jakmile se zlepší povětrnostní podmínky.\n\nOpravy začnou po skončení vánice (zbývá §Y[?global.antarctica_blizzard_days_remaining|0]§! dní vánice) a jejich dokončení potrvá §Y14§! dní. Zbývající čas můžete vidět v přehledu stanice a v popisu poškozeného modulu." # todo: NEW TRANSLATION
 MD_antarctica.9.a: "Zatracené počasí!" # todo: NEW TRANSLATION
 MD_antarctica.10.t: "Demontáž antarktické výzkumné stanice anektované země" # todo: NEW TRANSLATION
 MD_antarctica.10.d: "V důsledku anexe země s výzkumnou stanicí byla stanice demontována." # todo: NEW TRANSLATION
 MD_antarctica.10.a: "Dobře" # todo: NEW TRANSLATION
 ANT_nukes_research_discovered_idea: "Na antarktické stanici odhalen výzkum jaderných zbraní" # todo: NEW TRANSLATION
 ANT_nukes_research_discovered_idea_desc: "Tato země porušila zásadu úplného zákazu vojenského výzkumu v Antarktidě prováděním výzkumu souvisejícího s jadernými zbraněmi." # todo: NEW TRANSLATION
 antarctica_small_treaty_admin_cost_1: "Správa menší antarktické smlouvy" # todo: NEW TRANSLATION
 antarctica_small_treaty_admin_cost_1_desc: "Tato země podepsala jednu z menších antarktických smluv (CCAS nebo CCAMLR), čímž zvýšila administrativní zátěž politických akcí." # todo: NEW TRANSLATION
 antarctica_small_treaty_admin_cost_2: "Rozšířená správa Antarktické smlouvy" # todo: NEW TRANSLATION
 antarctica_small_treaty_admin_cost_2_desc: "Tato země podepsala obě menší antarktické smlouvy (CCAS a CCAMLR), což vyžaduje rozsáhlejší zdroje na správu smluv a dodržování závazků." # todo: NEW TRANSLATION
 ANT_kicked_from_treaty_idea: "Vyloučen z Antarktické smlouvy" # todo: NEW TRANSLATION
 ANT_kicked_from_treaty_idea_desc: "Kvůli opakovanému porušování Antarktické smlouvy byla tato země z dohody vyloučena a po následující dva roky se nemůže znovu připojit." # todo: NEW TRANSLATION
 ANT_illegal_extraction_idea: "Nelegální těžba antarktických zdrojů" # todo: NEW TRANSLATION
 ANT_illegal_extraction_idea_desc: "Naše vztahy s ostatními zeměmi se zhoršily, protože patříme k několika málo státům, které nechtějí obchodovat s cennými zdroji kvůli zachování pěkného výhledu na ledovou pustinu. Příliš jim na tom zamrzlém kusu záleží." # todo: NEW TRANSLATION
