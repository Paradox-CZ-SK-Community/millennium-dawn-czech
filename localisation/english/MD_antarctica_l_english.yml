 ANTARCTICA_CCAMLR_TEXT: "Komise pro zachování živých mořských zdrojů Antarktidy (CCAMLR) je organizace odpovědná za ochranu mořského života v Jižním oceánu. Byla založena v roce 1982 s cílem spravovat a chránit jedinečný ekosystém Antarktidy." # todo: NEW TRANSLATION
