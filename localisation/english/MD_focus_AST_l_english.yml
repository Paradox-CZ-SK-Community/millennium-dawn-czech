 the_australian_century_tt: "§YUrychlí schválení řady návrhů na nové doly, které v současnosti čekají na schválení.§!" # todo: NEW TRANSLATION
 kevin_rudd_desc: "Geopolitický odborník na Asii a pravidelný televizní host Kevin Rudd se stal novou tváří labouristického hnutí. Je to osobnost schopná spojit Howardovu stabilitu s příslibem reforem, které národ požaduje. Rudd prokázal cit pro vyvažování stranických zájmů, přičemž si zachovává přízeň veřejnosti. \n\nDíky reformám Gougha Whitlama mohl Rudd studovat na univerzitě a své vzdělání využil ke vstupu na ministerstvo zahraničních věcí v roce 1981. Tyto zkušenosti využíval po celou svou kariéru. Od té doby ve straně rychle stoupal a jako člen v období neustálého střídání vedení labouristů není Ruddovi nelítostná politika cizí. Jeho optimismus ho však přiměl stranu znovu vybudovat. \n\nMuž z Queenslandu, který se snaží rozšířit její přitažlivost a napravit frakcionářství, jež ji po desetiletí udržovalo v nehybnosti, nyní stojí u kormidla. Je to pozice, kterou obdivoval od svého vstupu do strany v patnácti letech a které hodlá dostát." # todo: NEW TRANSLATION
