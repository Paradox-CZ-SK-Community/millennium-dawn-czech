 the_roulettes_tt: "V záložce §2Vojenská rozhodnutí§! bude k dispozici možnost předvést Roulettes." # todo: NEW TRANSLATION
 john_howard_desc: "John Howard představuje poslední baštu starých liberálů. Jako žák Roberta Menziese a zastánce vzestupu středopravice vedla Howardova politika stranu ke střední třídě. Upřednostňoval individuální svobodu, vlastnictví domů a svobodné podnikání, aby zastavil příliv sílícího odborářství a vyvedl stranu z desetiletí bezvýznamnosti. \n\nNež vstoupil do Liberální strany, byl obchodním právníkem. Howard stoupal po žebříčku od předsedy Mladých liberálů až po poslance za Bennelong v roce 1974. Tím vstoupil do světa parlamentní politiky. Netrvalo dlouho a následující rok si ho vybral Fraserův kabinet a jmenoval ho ministrem pro obchod a ochranu spotřebitelů. \n\nHowardův bezproblémový vzestup a rostoucí odbornost v ekonomických otázkách z něj učinily nejmladšího ministra financí za téměř 75 let. Jako zastánce svobodnějších trhů se snažil reformovat stárnoucí hospodářský systém, jeho úsilí však zmařila slábnoucí ekonomika a následná recese 80. let vyhnala liberály z úřadu. \n\nJeho postavení ve straně se během dalšího desetiletí měnilo, což lze snadno popsat jako sérii převratů, dvojitých převratů a Howardových neúspěšných pokusů o vítězství ve volbách. Howardova chvíle konečně přišla v roce 1996, kdy drtivě zvítězil nad úřadujícím Paulem Keatingem s předvolebním slibem snížit rozpočtový deficit a vyvést Austrálii z hospodářského útlumu. Tento slib se nadále různě proměňuje." # todo: NEW TRANSLATION
 sydney_declaration_idea_ast: "Sydneyská deklarace" # todo: NEW TRANSLATION
 AST_MOD_MILLENNIUM_DAWN_DESC: "S přelomem století spatřila Austrálie první známky hospodářské prosperity od 80. let. S premiérem Johnem Howardem v čele, vůdcem známým progresivní hospodářskou politikou a průměrnou popularitou, země během krátké doby prošla významnými změnami. Nyní stojí na kulturním prahu a blížící se olympijské hry v Sydney ji staví do pozice národa připraveného na velikost, pokud bude vedena pevnou rukou. \n\nNavzdory pokroku roste nespokojenost. Léta, během nichž vláda zanedbávala nápravu utrpení domorodých komunit, zanechala hluboké rány a pobouření nad ustrnulými reformami se dál šíří. Dominance těžebního průmyslu rovněž vzrostla natolik, že australská ekonomika balancuje na hraně přeměny v petrostát, což národ staví do velmi nejisté situace." # todo: NEW TRANSLATION
 mining_industrialists_ast: "Těžební průmyslníci" # todo: NEW TRANSLATION
 mining_industrialists_ast_desc: "Neviditelná ruka se už po desetiletí vměšuje do australské politiky a průmyslu. Zákony namířené proti ní vždy vyšumí do ztracena a směr naší ekonomiky byl úspěšný pouze tehdy, když nahrával těžebním konglomerátům. Ať už prostřednictvím lobbingu nebo médií, nakonec vždy vyjdou na vrchol." # todo: NEW TRANSLATION
