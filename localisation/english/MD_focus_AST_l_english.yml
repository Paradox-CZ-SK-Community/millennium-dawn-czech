 inter_department_recruiting: "Nábor napříč odděleními" # todo: NEW TRANSLATION
 inter_department_recruiting_desc: "Přesunem nebo povýšením stávajících členů ADF z jiných oddělení můžeme zaplnit volná místa a odměnit ty, kteří si vedou dobře." # todo: NEW TRANSLATION
