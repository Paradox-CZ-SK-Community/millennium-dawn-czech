 malaysianflight_event_ast.1.t: "Zmizení letu MH370" # todo: NEW TRANSLATION
 malaysianflight_event_ast.1.d: "Mezinárodní dopravní letadlo provozované Malaysia Airlines včera při letu nad Jihočínským mořem zmizelo z radarů. Jeho zmizení zanechalo rodiny zdrcené a leteckou společnost v rozpacích. \n\nLetadlo, které mělo původně přistát v Pekingu, záhadně zmizelo ze senzorů před třemi dny na cestě z malajsijského hlavního města. Zatímco úřady dál pátrají po troskách, příbuzní pohřešovaných cestujících byli vyzváni, aby se připravili na nejhorší. Pátrání se účastní 40 lodí a 34 letadel z devíti různých zemí, ačkoli malajsijští představitelé tvrdí, že stále netuší, co se stalo." # todo: NEW TRANSLATION
