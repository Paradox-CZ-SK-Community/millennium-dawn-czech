 family_reunion_services_ast_desc: "Můžeme začít vytvářet program zajišťující pátrání po rodinách, jejich sjednocování a poradenské služby pro Aborigince a obyvatele Torresova průlivu, kteří byli během ukradených generací násilně odebráni svým rodinám." # todo: NEW TRANSLATION
