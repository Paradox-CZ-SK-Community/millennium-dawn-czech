 problem_with_the_boats_desc: "Po celé zemi vypukly protesty, naše policie je přetížená a protiprotesty přerostly v nepokoje. V důsledku toho se těší pravicové politické skupiny rostoucí podpoře a spolu s médii stále přilévají olej do ohně. \n\n§RTrhliny se začínají projevovat.§!" # todo: NEW TRANSLATION
