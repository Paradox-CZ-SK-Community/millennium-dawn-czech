 paid_parental_scheme_ast_2: "Program rodičovských příspěvků" # todo: NEW TRANSLATION
 paid_parental_scheme_ast_desc: "Novým rodičům poskytuje až 26 týdnů placené dovolené. Umožňuje jim vzít si volno z práce, lépe se starat o novorozence či adoptované děti a podpořit růst populace." # todo: NEW TRANSLATION
 paid_parental_scheme_ast_2_desc: "Spojení našich programů rodičovské podpory, které nahrazuje dřívější porodné finančními dávkami na pomoc novým rodičům. Novým rodičům také poskytuje až 26 týdnů placené dovolené a jednorázové platby, aby se mohli lépe starat o novorozence či adoptované děti a podpořit růst populace." # todo: NEW TRANSLATION
 social_capitalism_ast: "Sociální kapitalismus" # todo: NEW TRANSLATION
 social_capitalism_ast_desc: "Náš aktivnější přístup k řízení ekonomiky přinesl určité výhody i několik drobných nevýhod. Díky regulaci a přímému řízení můžeme svou ekonomiku ovlivňovat přímočařeji a zajistit, aby zůstala zaměřena na prospěch našich občanů. Jak budeme tento přístup zavádět, naše metody se budou zdokonalovat." # todo: NEW TRANSLATION
