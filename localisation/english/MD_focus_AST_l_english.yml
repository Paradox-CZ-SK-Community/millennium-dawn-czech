 ast_urban_expansion_initiative_tt: "V záložce Průmyslová rozhodnutí budou k dispozici §2rozhodnutí§! o rozšíření našich stavebních kapacit." # todo: NEW TRANSLATION
 recruitment_campaigns_tt: "Náborové kampaně budou k dispozici v záložce §2Vojenská rozhodnutí§!." # todo: NEW TRANSLATION
 adf_acq_astuirement_program: "Program pořizování vybavení ADF" # todo: NEW TRANSLATION
 the_white_paper: "Bílá kniha z roku 2000" # todo: NEW TRANSLATION
 the_white_paper_desc: "Dokument Obrana 2000 vznikl jako komplexní přezkum našich současných vojenských schopností a požadavků současné vlády. S větším důrazem na sílu Austrálie jako významného poskytovatele bezpečnosti a mírových sil v Tichomoří se požadavky zaměřily především na rozšíření." # todo: NEW TRANSLATION
 the_second_white_paper_1: "Druhá bílá kniha" # todo: NEW TRANSLATION
 the_second_white_paper_1_desc: "V návaznosti na úspěch první bílé knihy byla ADF pověřena uskutečněním řady rozsáhlejších programů a restrukturalizací, aby i nadále naplňovala požadavky obrany Tichomoří." # todo: NEW TRANSLATION
 ast_we_are_many_tt: "§GBudoucnost§! demografie našeho národa je v našich rukou." # todo: NEW TRANSLATION
 sol_islands_intervention: "Regionální pomocná mise na Šalomounových ostrovech" # todo: NEW TRANSLATION
 sol_islands_intervention_desc: "Současná situace v zemi je rozhodně méně než ideální. Přepadení a boje militantů jsou na denním pořádku, veřejné služby se zhroutily a zbývající policie se rozdělila mezi válčící skupiny. Pokud chceme na ostrovech obnovit pořádek, musí co nejdříve začít rozsáhlé úsilí o stabilizaci a obnovu." # todo: NEW TRANSLATION
 sol_situation_countdown: "Situace se zhoršuje..." # todo: NEW TRANSLATION
 organise_occupation_force: "Zorganizovat okupační síly" # todo: NEW TRANSLATION
 organise_occupation_force_desc: "Než zahájíme rozsáhlé operace, bude nutné vytvořit okupační síly. V současnosti přislíbila podporu řada dalších národů, většina sil však bude muset být naše. Dva tisíce vojáků a přibližně dvě stě osob vyškolených pro udržování míru budou na ostrově sloužit jako donucovací složky." # todo: NEW TRANSLATION
 operation_anode: "Operace Anode" # todo: NEW TRANSLATION
 operation_anode_desc: "Naše hlavní ofenziva na ostrovy proběhne v několika etapách, částečně po moři a částečně vzduchem s našimi Chinooky. Prvním cílem bude obsadit řadu klíčových pozic na ostrově a využít je jako logistická a předsunutá operační střediska. Poté můžeme zahájit obnovu. Z důvodu dobrého obrazu ji nazýváme „Operace Helpem Fren“, což v jejich jazyce znamená „pomoc příteli“." # todo: NEW TRANSLATION
 secure_honiara: "Zajistit Honiaru" # todo: NEW TRANSLATION
 secure_weather_coast: "Zajistit Weather Coast" # todo: NEW TRANSLATION
 secure_rural_guadalcanal: "Zajistit venkovskou Tambeu" # todo: NEW TRANSLATION
 secure_malaita_province: "Zajistit provincii Malaita" # todo: NEW TRANSLATION
 sol_disarm_the_militias: "Odzbrojit milice" # todo: NEW TRANSLATION
 sol_red_cross: "Koordinovat s Červeným křížem" # todo: NEW TRANSLATION
 sol_red_cross_desc: "Červený kříž už má na ostrově výraznou přítomnost. Koordinace s ním by našim týmům umožnila ošetřovat a evakuovat ohrožené civilisty." # todo: NEW TRANSLATION
 negotiate_with_the_militias: "Jednat s militanty" # todo: NEW TRANSLATION
 negotiate_with_the_militias_desc: "Jednání s ozbrojenými militanty není zrovna stabilizační misí, ale pokud oslovíme ty rozumnější a zorganizujeme příměří, mohlo by nám to získat více času." # todo: NEW TRANSLATION
 disband_the_local_police: "Rozpustit místní policii" # todo: NEW TRANSLATION
 disband_the_local_police_desc: "Místní policejní sbor na ostrovech je prolezlý korupcí a frakcionalismem do té míry, že už neslouží lidem. Pokud chceme něco napravit, budeme muset rozebrat současnou strukturu vymáhání práva." # todo: NEW TRANSLATION
 rebuild_the_local_policeforce: "Obnovit místní policejní sbor" # todo: NEW TRANSLATION
 rebuild_the_local_policeforce_desc: "Chceme-li v zemi obnovit vymáhání práva, musíme vytvořit nadnárodní komisi, která začne prověřovat a školit nové policisty a prosazovat ochranná opatření, aby systém v budoucnu fungoval." # todo: NEW TRANSLATION
 run_anticorruption_campaign: "Provést protikorupční kampaň" # todo: NEW TRANSLATION
 run_anticorruption_campaign_desc: "Politická scéna v zemi je v současnosti sotva funkční, natožpak poctivá. Jen málokdo z těch, kteří zůstali ve vládě, nemá poskvrněnou pověst. Bude nutné zahájit celostátní tažení proti nezákonným praktikám a poté můžeme začít budovat nové základy." # todo: NEW TRANSLATION
 recruit_public_servants: "Naverbovat státní zaměstnance" # todo: NEW TRANSLATION
 recruit_public_servants_desc: "V návaznosti na naše úsilí pročistit scénu budou státní zaměstnanci z účastnických mezinárodních národů dočasně přijati do nové vlády, zatímco připravíme jejich postupné nahrazení místními obyvateli. Tato zahraniční odbornost pomůže vládě s rychlou obnovou." # todo: NEW TRANSLATION
 reorganise_the_army: "Reorganizovat armádu" # todo: NEW TRANSLATION
 reorganise_the_army_desc: "Země nemá účinnou stálou armádu od získání nezávislosti v roce 1978. To málo, co měla, zahrnovalo námořní pozorovací jednotku a několik vojáků převedených ze zrušené policie. Zatímco naše mírové jednotky převezmou úlohu stálé armády, můžeme začít cvičit místní jednotky, aby na nás přenesly část zátěže a pomáhaly s operacemi." # todo: NEW TRANSLATION
 loans_to_the_new_government: "Půjčky nové vládě" # todo: NEW TRANSLATION
 loans_to_the_new_government_desc: "Zatímco pokračujeme v budování nového systému správy Šalomounových ostrovů, jejich mezinárodní dluh zůstává nesplacený. Poskytneme jim půjčku na výplaty nového personálu a obnovu vlády." # todo: NEW TRANSLATION
 send_our_reconstruction_teams: "Vyslat naše rekonstrukční týmy" # todo: NEW TRANSLATION
 send_our_reconstruction_teams_desc: "Situace se zlepšila natolik, že můžeme bezpečně vyslat naše rekonstrukční týmy, aby pomohly s obnovou a výstavbou veřejných služeb." # todo: NEW TRANSLATION
 sol_intervention: "Intervence na Šalomounových ostrovech probíhá" # todo: NEW TRANSLATION
 sol_intervention_success: "Intervence byla úspěšná." # todo: NEW TRANSLATION
