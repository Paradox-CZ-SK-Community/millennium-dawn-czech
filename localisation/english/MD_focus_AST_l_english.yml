 aus_china_visit: "Státní návštěva Číny" # todo: NEW TRANSLATION
 aus_norm_nk: "Normalizace vztahů se Severní Koreou" # todo: NEW TRANSLATION
 aus_sk_visit: "Státní návštěva z Jižní Koreje" # todo: NEW TRANSLATION
 aus_tur_visit: "Gallipolský obřad v Turecku" # todo: NEW TRANSLATION
 aus_rus_visit: "Státní návštěva Ruska" # todo: NEW TRANSLATION
 aus_eng_visit: "Státní návštěva monarchie" # todo: NEW TRANSLATION
 ast_political_decisions: "Politická rozhodnutí" # todo: NEW TRANSLATION
 ast_political_decisions_desc: "Schopnost řídit národ vyžaduje, abychom si občas vyhrnuli rukávy a namazali si něčí dlaň. Ať už jde o průmyslové giganty nebo lidi blíže vládě, naše zákulisní činnost udržuje zemi v chodu. Není to poctivá práce, ale je jí hodně." # todo: NEW TRANSLATION
 ast_approach_the_unions: "Navázat kontakt s odbory" # todo: NEW TRANSLATION
 ast_approach_the_unions_desc: "Nikdo z nás nemá rád jednání s odbory, ale pokud chceme v průmyslu dosáhnout pokroku, musíme přistoupit na kompromis. Naše reformní úsilí na tom závisí." # todo: NEW TRANSLATION
 ast_manufacturer_subsidies: "Dotace výrobcům" # todo: NEW TRANSLATION
 ast_manufacturer_subsidies_desc: "Dotace jsou pro výrobní závody jako WD-40. Když některé nefungují úplně hladce, vytáhnete dotace a doufáte, že se zase dají do pořádku." # todo: NEW TRANSLATION
 ast_cabinet_reshuffle: "Rekonstrukce kabinetu" # todo: NEW TRANSLATION
 ast_cabinet_reshuffle_desc: "V poslední době kabinet zaostává za stranickou linií. Někteří se pro svou práci jednoduše nehodí, jiní jsou naprosto neposlušní. Naštěstí můžeme jako předseda strany využít jednu z mála pravomocí, které máme. Rekonstrukcí kabinetu můžeme do popředí postavit některé své oblíbenější kandidáty a odstranit ty, kteří nám nejsou ochotni pomáhat." # todo: NEW TRANSLATION
 ast_loosen_gambling_restrictions: "Uvolnit omezení hazardu" # todo: NEW TRANSLATION
 ast_loosen_gambling_restrictions_desc: "Hazardní hry jsou neřestí mnoha Australanů. Tak či onak prostupují téměř každou žilou naší ekonomiky. V posledních letech naše politika na toto odvětví tvrdě dopadla, ale můžeme některá omezení mírně uvolnit, dosáhnout krátkodobých zisků a všechny potěšit." # todo: NEW TRANSLATION
 ast_revisit_zoning_laws: "Přehodnotit územní zákony" # todo: NEW TRANSLATION
 ast_revisit_zoning_laws_desc: "V současnosti státní vláda a místní rady určují při výstavbě na pozemcích „co, kde a jak“. V poslední době nás developeři bombardují žádostmi o zrušení některých omezení. Přehodnocení pravidel by mohlo zmírnit některé z těchto obav." # todo: NEW TRANSLATION
 cdep: "Projekty zaměstnanosti v rámci rozvoje komunit" # todo: NEW TRANSLATION
 cdep_desc: "Původní program vznikl z touhy umožnit domorodým komunitám, aby samy plánovaly a stavěly rozvojové projekty. Program fungoval dostatečně dobře, ale rozsah projektů můžeme zvětšit vysláním vládních odborníků a zvýšením dostupného financování." # todo: NEW TRANSLATION
 nielns: "Národní strategie gramotnosti a numerické gramotnosti původních obyvatel" # todo: NEW TRANSLATION
 nielns_desc: "Míra gramotnosti Aboridžinců a obyvatel Torresova průlivu v posledních letech klesla. V kombinaci s již tak nízkou docházkou to vypadá jako recept na katastrofu. Pokud budeme se školami spolupracovat na rozvoji programů pomáhajících studentům, může to změnit mnoho životů." # todo: NEW TRANSLATION
 fam_violence_proj: "Projekty prevence domácího násilí" # todo: NEW TRANSLATION
 fam_violence_proj_desc: "Domácí násilí bylo ošklivou pravdou, které se v 90. letech chtělo dotknout jen málo politiků. Nové přístupy založené na důkazech učinily tento proces odbornějším a méně politicky riskantním, takže jejich financování je pro nás snadným krokem." # todo: NEW TRANSLATION
 construct_recon_place: "Vybudovat Místo usmíření" # todo: NEW TRANSLATION
 construct_recon_place_desc: "Na našem stole leží ke schválení řada návrhů na úpravu městské krajiny. Mezi nimi vyniká Místo usmíření v Canbeře. Pokud jej schválíme, mohlo by být nádherným svědectvím našeho úsilí." # todo: NEW TRANSLATION
 repatriate_remains: "Repatriovat ostatky původních obyvatel" # todo: NEW TRANSLATION
 repatriate_remains_desc: "Není žádným tajemstvím, že britská muzea uchovávají řadu odcizených předmětů z jiných zemí. Patří mezi ně i lidské ostatky. Několik domorodých skupin požádalo, aby byly ostatky vráceny do Austrálie k pohřbení." # todo: NEW TRANSLATION
 mabo_referendum: "Dodatek o stavu usmíření" # todo: NEW TRANSLATION
 mabo_referendum_desc: "Změnou ústavy bychom formálně zahrnuli Prohlášení o usmíření do preambule ústavy a uznali práva původních obyvatel Austrálie na jejich půdu." # todo: NEW TRANSLATION
 ast_walk_the_journey_tt: "V záložce Politická §2rozhodnutí§! se zpřístupní programy a kroky související s naším úsilím o usmíření." # todo: NEW TRANSLATION
 mabo_vibe_tt: "Dodatek o stavu usmíření bude k dispozici v §2rozhodnutích§!." # todo: NEW TRANSLATION
