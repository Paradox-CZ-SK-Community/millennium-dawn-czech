 syrian_refugees_event_ast.1.d: "Po vypuknutí konfliktu v Sýrii hledají v našem národě azyl tisíce uprchlíků. Prošli řádnými kanály a okolnosti, před nimiž prchají, by je jistě opravňovaly ke vstupu, volba je však nakonec na nás. Pokud je vpustíme dovnitř, můžeme povzbudit další, aby postupovali řádně, nebo tím můžeme otevřít stavidla další migrační krizi." # todo: NEW TRANSLATION
