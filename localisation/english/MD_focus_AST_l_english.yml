 julia_gilard_desc: "Gillardová, aktivistka narozená ve Walesu a právní partnerka, postupovala australskou vládou vzhůru a stala se první ženskou vůdkyní země. \n \nZpočátku socialistka levicové frakce viktoriánské ALP se Gillardová proslavila využíváním svých kontaktů v podnikatelském sektoru. Tuto schopnost získala během let působení jako průmyslová právnička. Díky úspěchu v tradičně mužském oboru a navzdory tomu, že zůstala svobodná a neměla žádné náboženské přesvědčení, Gillardová oficiálně prolomila parlamentní status quo. \n\nAť už se vydá jakýmkoli směrem, strana ji následuje s nejistým váháním, zatímco se vzdaluje tradiční jistotě. Jakýkoli chybný krok by mohl rozbít nově nalezenou stabilitu strany a sesadit Gillardovou dříve, než její vedení vůbec začne." # todo: NEW TRANSLATION
