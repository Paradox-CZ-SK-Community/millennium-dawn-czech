 nrf_ast_desc: "Chceme-li zajistit, aby rámec aktivního usmíření existoval i po skončení našeho mandátu, musíme vytvořit organizaci zaměřenou na financování projektů, které přinášejí skutečnou změnu." # todo: NEW TRANSLATION
 sihip_ast: "Strategický program bydlení a infrastruktury pro původní obyvatele (SIHIP)" # todo: NEW TRANSLATION
 sihip_ast_desc: "Aboriginští obyvatelé Severního teritoria to v posledních letech měli pravděpodobně nejtěžší. Bydlení i mnoho dalších věcí chátrá a zoufale potřebuje renovaci." # todo: NEW TRANSLATION
