 auslink_in_nt: "AusLink v Severním teritoriu" # todo: NEW TRANSLATION
 auslink_in_nt_desc: "Rámec AusLink v minulosti umožnil rychlé opravy a modernizaci našich regionálních silnic. Můžeme tento systém znovu využít k rychlému zlepšení logistických tras v našich severních komunitách, výstavbě mostů, tras pro těžkou nákladní dopravu a zemědělské infrastruktury." # todo: NEW TRANSLATION
 national_partnership_agreement_ast: "Národní partnerská dohoda" # todo: NEW TRANSLATION
 national_partnership_agreement_ast_desc: "Úzkou spoluprací s domorodými komunitami v Severním teritoriu a Západní Austrálii můžeme řešit vážnou přeplněnost výstavbou stovek nových domů pro místní obyvatele. Zakázky nám také získají podporu bytových zájmových skupin a poskytnou práci místním dodavatelům." # todo: NEW TRANSLATION
 foundation_for_regional_renewal_ast: "Granty na obnovu venkova" # todo: NEW TRANSLATION
 foundation_for_regional_renewal_ast_desc: "Můžeme vytvořit společné partnerství mezi federální vládou a fondem Sydney Myer Fund a založit nástroj pro místní zemědělské financování. Granty budou směřovat malým podnikům a radám v městečkách na financování komunitních sálů, venkovských vodních systémů a zemědělských projektů." # todo: NEW TRANSLATION
 grain_line_upgrades_ast: "Modernizace obilných tratí" # todo: NEW TRANSLATION
 grain_line_upgrades_ast_desc: "Vlády Nového Jižního Walesu a Victorie nám poskytly plány rozsáhlé strukturální modernizace regionálních obilných tratí. Téměř všichni regionální zemědělci používají tyto tratě k přepravě sklizně do přístavů a jejich modernizace by mohla výrazně zvýšit produkci a snížit závislost na silniční dopravě. Zároveň by se snížilo opotřebení silnic." # todo: NEW TRANSLATION
 grain_lines_upgraded_ast: "Regionální obilné tratě modernizovány" # todo: NEW TRANSLATION
 mining_indutrialists_opinion_tt: "Minimální názor §Yfosilního průmyslu§! §R-20§!" # todo: NEW TRANSLATION
 peter_costello_desc: "Jen málokdo v dějinách australské politiky se vyznal v hospodářském řízení tak jako Peter Costello. Po střídání práce barristera a právního poradce, než zakotvil v Liberální straně, Costello prosazoval radikální reorganizaci ekonomiky. Nakonec vstoupil do ekonomicky reformistické frakce strany, kde se setkal s bývalým opozičním vůdcem Johnem Howardem. \n\nPo volbách v roce 1996, jako místopředseda a ministr financí Howardovy vlády, Costello dohlížel na její rychlé reformy. V důsledku toho byl rozpočet poprvé po více než deseti letech v přebytku a společně úspěšně prosadili dříve „nemožnou“ daňovou reformu. \n\nI když se jejich vztah začal zhoršovat, Costello se nikdy nevzdálil od pák moci. Nyní, když ovládá největší páku v zemi, jsou jeho sny o hospodářské dominanci téměř na dosah." # todo: NEW TRANSLATION
 western_mining_corp_research_ast: "Výzkum Western Mining Corp" # todo: NEW TRANSLATION
