 AST_the_lucky_country: "Šťastná země" # todo: NEW TRANSLATION
 AST_the_lucky_country_desc: "Poté, co Donald Horne v roce 1964 zavedl toto rčení, většina Australanů tento výraz chybně pochopila jako popis šťastného úspěchu země v těžbě. Je pravda, že nám byl darován obrovský kus území, který je plný vzácných a cenných rud, ale Donald tímto rčením zesměšňoval tehdejší vůdce za to, že do tohoto odvětví investovali příliš mnoho a zanedbávali další ekonomické příležitosti. Stručně řečeno: nedostatečně jsme diverzifikovali. To nás přivedlo do situace, kdy Austrálii od plnohodnotného rentiérského státu dělí jen několik technologických či výrobních závodů. Jsme zcela závislí na vývozu a buď to přijmeme, nebo zahájíme proces odprodeje těchto podílů." # todo: NEW TRANSLATION
 AST_fuel_the_mining_boom: "Pohánět těžební boom" # todo: NEW TRANSLATION
 AST_fuel_the_mining_boom_desc: "Těžba je doslova od dob, kdy se Austrálie stala kolonií, oporou australské ekonomiky. Od zlaté horečky až po současnost udržovala těžba naši ekonomiku v chodu a podporovala její růst. To vše spotřebovává nesmírné množství paliva potřebného k přepravě rudy po silnici i po moři. Pokud se situace na Blízkém východě ještě zhorší, mohli bychom sledovat, jak se naše ekonomika zastaví. Než budeme dále expandovat, musíme doma zajistit naše strategické zásoby a udržovat dodávky připravené na horší časy." # todo: NEW TRANSLATION
 AST_acis_scheme: "Program ACIS" # todo: NEW TRANSLATION
 AST_acis_scheme_desc: "Program konkurenceschopnosti a investic v automobilovém průmyslu byl vytvořen s cílem poskytnout našemu automobilovému průmyslu celní úlevy a financování na podporu investic, výzkumu a vývoje. Ve srovnání s okolními zeměmi náš průmysl zaostává, takže podpora domácích společností rozhodně nebude nevítaná." # todo: NEW TRANSLATION
 AST_a_sea_of_panels: "Moře panelů" # todo: NEW TRANSLATION
 AST_a_sea_of_panels_desc: "Naše venkovské solární elektrárny jsou pozoruhodnou podívanou. Připomínají kruhové umělecké dílo a nasávají paprsky, které turistům obvykle způsobují jen spáleniny od slunce. Současná kombinace obnovitelných zdrojů a fosilních paliv není zrovna ideální a rozšíření našich solárních polí ji vyváží." # todo: NEW TRANSLATION
 AST_commit_to_renewables: "Vsadit na obnovitelné zdroje" # todo: NEW TRANSLATION
 AST_commit_to_renewables_desc: "Budoucnost naší výroby energie by neměla záviset na zásobách uhlí a plynu. Vývoj technologií obnovitelné energie v posledních letech překvapivě rychle pokročil. Je nejvyšší čas toho využít." # todo: NEW TRANSLATION
 AST_harness_the_wind: "Využít sílu větru" # todo: NEW TRANSLATION
 AST_harness_the_wind_desc: "V řecké mytologii byl Aiolos bohem, kterému Zeus svěřil kontrolu nad větry a který uvolňoval strašlivé bouře jen na jeho příkaz. Vítr sice ovládat nedokážeme, ale díky našim vědcům můžeme využít jeho sílu. Instalace dalších turbín tam, kde budou nejprospěšnější, nám poskytne spolehlivý zdroj čisté a významné energie." # todo: NEW TRANSLATION
 AST_rewire_the_nation: "Přepojit národ" # todo: NEW TRANSLATION
 AST_rewire_the_nation_desc: "Jen málo problémů, které jsme v této zemi našli, lze vyřešit tím, že na ně jednoduše nasypeme peníze. Tohle je jeden z nich. Inženýři už dokončili své porady a plánování a nyní jsme připraveni modernizovat elektrické sítě po celé zemi, aby vyhovovaly našim současným kapacitním potřebám." # todo: NEW TRANSLATION
 AST_fix_the_potholes: "Opravit výtluky" # todo: NEW TRANSLATION
 AST_fix_the_potholes_desc: "Metlou řízení v této zemi byly vždy výtluky. Zeptejte se kteréhokoli řidiče, ať už z města nebo venkova, a uslyšíte příběhy o opravách aut, téměř způsobených nehodách a dalších hrůzách. Protože povinnost chránit naše občany spadá pod vládu, je naší odpovědností tuto pohromu odstranit." # todo: NEW TRANSLATION
 AST_north_west_shelf_expansion: "Rozšíření North West Shelf" # todo: NEW TRANSLATION
 AST_north_west_shelf_expansion_desc: "North West Shelf je jedním z našich nejdéle fungujících a nejúspěšnějších plynárenských podniků na poloostrově. Zpracovává obrovskou část veškeré vytěžené ropy a plynu. Současný návrh počítá s prodloužením provozu projektu až do roku 2070, což nám do té doby poskytne tolik potřebné zpracovatelské kapacity." # todo: NEW TRANSLATION
 AST_its_just_coal: "Je to jen uhlí!" # todo: NEW TRANSLATION
 AST_its_just_coal_desc: "Někteří odpůrci našeho rozšiřování se možná obávají fosilních paliv. Těm říkáme: nebojte se, není čeho se bát, neublíží vám. Je to uhlí. Těžit ho jako Australané máme téměř v krvi. Toto tmavé, prašné ložisko si ceníme a pohání naše domovy. Obnovitelné zdroje jsou možná novinkou, ale uhlí tu pro nás bude vždy, aby hořelo." # todo: NEW TRANSLATION
 AST_high_speed_focus_ast: "Vysokorychlostní železnice" # todo: NEW TRANSLATION
 AST_high_speed_focus_ast_desc: "Prokletí vysokorychlostní železnice sužuje naše státy od osmdesátých let. Pokaždé, když federální vláda zahájí proces výstavby železnice s rychlostí přes 200 km/h, projekt se nikdy nedostane dál než do fáze plánování. Tentokrát ne. Nyní zasáhneme a dotáhneme ho do konce. Máme technologii i trasu: Brisbane–Sydney–Melbourne. Nic nám nestojí v cestě." # todo: NEW TRANSLATION
 AST_dig_deep: "Kopat hlouběji" # todo: NEW TRANSLATION
 AST_dig_deep_desc: "Rafinace oxidu hlinitého přinesla v našich odlehlých těžebních centrech řadu nedávných průlomů. Pokud budeme přímo tlačit na urychlení schvalování těžebních práv, mohou začít vrtat dříve a hlouběji." # todo: NEW TRANSLATION
 AST_lng_megaprojects: "Megaprojekty LNG" # todo: NEW TRANSLATION
 AST_lng_megaprojects_desc: "Naše zařízení LNG patří mezi nejmodernější způsoby přepravy zemního plynu do jiných zemí a výrazně nám snížila přepravní náklady. Při tomto procesu se plyn ochladí na velmi nízkou teplotu, až se změní na kapalinu, a objem plynu se zmenší šestsetkrát. Spolupráce se společnostmi na rozšíření těchto zařízení a částečné převzetí stavebních nákladů urychlí jejich uvedení do provozu." # todo: NEW TRANSLATION
 AST_the_boom_never_ends: "Boom nikdy nekončí" # todo: NEW TRANSLATION
 AST_the_boom_never_ends_desc: "Někdy máte štěstí a někdy jste prostě Austrálie. Těžební sektor zde zažívá boom a my bychom ho rádi udrželi. Investice, stimuly, všechno. Naše společnosti budou s naším souhlasem dál vrtat a nám nezbývá než se pohodlně usadit a užívat si to." # todo: NEW TRANSLATION
 AST_treat_the_farmers: "Odměnit zemědělce" # todo: NEW TRANSLATION
 AST_treat_the_farmers_desc: "Zemědělci v této zemi patří mezi ty nejpracovitější. Na konci dne mají ruce pokryté hlínou, aby naše mohly zdobit diamantové prsteny. Nebo jsem to alespoň slyšel. Každopádně je musíme za jejich práci odměnit. Malá odměna, chcete-li." # todo: NEW TRANSLATION
 AST_enjoy_the_prosperity: "Užívat si blahobytu" # todo: NEW TRANSLATION
 AST_enjoy_the_prosperity_desc: "Když odborníky přitlačíte ke zdi, všichni se shodnou, že náš těžební sektor nikam nemizí. Vývoz nyní pohání tuto zemi jako nikdy předtím a odměny si můžeme užívat. Dokud je železo žhavé, můžeme výrazně investovat do infrastruktury na podporu budoucí těžby a výroby paliv a zajistit, že z boomu vytěžíme maximum." # todo: NEW TRANSLATION
 AST_heavy_industry_projects: "Projekty těžkého průmyslu" # todo: NEW TRANSLATION
 AST_heavy_industry_projects_desc: "Naše státní stavební společnosti usilovně pracují na rozvoji této úžasné země, ale potřeba větší kapacity je zcela zřejmá. Zavedení plánů na rozšíření bude nákladné, ale přímočaré. Svět spatří Austrálii, kterou jsme předurčeni stát se." # todo: NEW TRANSLATION
 AST_urban_expansion_initiative: "Iniciativa městské expanze" # todo: NEW TRANSLATION
 AST_urban_expansion_initiative_desc: "Bez půdy nelze stavět a tento návrh byl vypracován tak, abychom mohli obejít řadu obvyklých požadavků na získávání půdy, což někteří protestující označují za „zabavení“, i když tomu tak není. Za půdu samozřejmě zaplatíme, proces bude pouze rychlejší." # todo: NEW TRANSLATION
 AST_defy_the_mantra: "Vzepřít se mantrě" # todo: NEW TRANSLATION
 AST_defy_the_mantra_desc: "Nebudeme navždy podřízeni nějaké přezdívce. Austrálie se buď vyvine, nebo zemře. Až doly vyschnou nebo přijde další ekonomická katastrofa, naše ekonomika zůstane stát, protože jsme investovali do její budoucnosti. Rozšířením do řady ekonomických oblastí můžeme diverzifikovat domácí výrobu. Nebudeme rentiérským státem, ale silným národem." # todo: NEW TRANSLATION
 AST_global_weapons_manufacturing: "Globální výroba zbraní" # todo: NEW TRANSLATION
 AST_global_weapons_manufacturing_desc: "Austrálie nikdy nebyla známá jako globální dodavatel zbraní, s výjimkou některých méně oficiálních závazků. Pokud je diverzifikace nutná, zvýšení výroby a případné zásobování dalších zemí by mohlo učinit investici výhodnou." # todo: NEW TRANSLATION
 AST_overseas_opportunities: "Příležitosti v zahraničí" # todo: NEW TRANSLATION
 AST_overseas_opportunities_desc: "Mnoho našich větších společností zabývajících se fosilními palivy už intenzivně působí v zahraničí, kdekoli se objeví příležitost. Tyto aktivity lze podpořit zmírněním současných předpisů a zavedením několika pobídek." # todo: NEW TRANSLATION
 AST_the_white_paper: "Bílá kniha" # todo: NEW TRANSLATION
 AST_the_white_paper_desc: "Naši vyšší velitelé doporučili zahájit restrukturalizaci s cílem nastavit směr. Máme několik možností, jak věci rozhýbat, ale nakonec záleží na tom, v jaké oblasti bychom mohli armádu nejlépe zlepšit. Výroba zbraní bude vždy faktorem, který bychom měli zvažovat. Stanovení výrobních cílů by mohlo urychlit naši připravenost. Další oblastí je počet vojáků, který lze upravit rychlejšími výcvikovými kvótami. A konečně bychom mohli část břemene přenést na náš obranný průmysl. Zkrácení dodacích lhůt u několika projektů by je mělo dostatečně motivovat." # todo: NEW TRANSLATION
 AST_hardening_our_units: "Zvýšit odolnost našich jednotek" # todo: NEW TRANSLATION
 AST_hardening_our_units_desc: "Během války v Zálivu a dalších intervencí se asymetrické hrozby staly novou a děsivou formou válčení, se kterou jsme se museli vypořádat. Někdy větší palebná síla nestačí a těch několik nešťastníků, kteří zažili tyto nové útoky, zejména improvizovaná výbušná zařízení, přežilo jen díky tomu, že jejich vozidla vydržela. Rozvoj naší odolnosti může být rozdílem, který naše jednotky potřebují k přežití a pokračování v operacích." # todo: NEW TRANSLATION
 AST_a_networked_army: "Síťovaná armáda" # todo: NEW TRANSLATION
 AST_a_networked_army_desc: "Digitální prostředí bylo pro náš průmysl dosud zázrakem. Podobně transformace pozemních sil v digitálně propojené síly od senzorů k střelcům umožní rychlejší rozhodování a okamžité předávání informací velení. Naše společné síly budou jednotnější než kdy dříve a operace lze řídit přímo z velení, aby byla ve správný čas přijímána správná rozhodnutí." # todo: NEW TRANSLATION
 AST_diisr_ast: "DIISR" # todo: NEW TRANSLATION
 AST_diisr_ast_desc: "Z nějakého důvodu nemáme jediný vládou řízený výzkumný ústav. Máme sice několik soukromých a dokonce i několik státních institucí, ale poptávka po zařízení, které by provádělo potřebný výzkum, vyžaduje něco velkolepějšího. Na náš stůl dorazily plány ministerstva inovací, průmyslu, vědy a výzkumu a výstavba nyní čeká pouze na schválení." # todo: NEW TRANSLATION
 AST_rnd_tax_incentive: "Daňové pobídky pro výzkum a vývoj" # todo: NEW TRANSLATION
 AST_rnd_tax_incentive_desc: "Nyní, když je DIISR v provozu, zajistíme přidělením části financování na výzkum a vývoj a řadou dotací na zahájení projektů, že budeme na špici inovací." # todo: NEW TRANSLATION
 AST_our_beloved_bushmaster: "Naše milované Bushmastery" # todo: NEW TRANSLATION
 AST_our_beloved_bushmaster_desc: "Bushmastery se staly ikonou naší armády a díky své všestrannosti, charakteristickému designu a schopnostem v poli si získaly srdce mnoha vojenských odborníků. Dobře nám sloužily v zámoří a výroba dalších kusů by měla být prioritou. Naštěstí byl tento požadavek již zahrnut v Bílé knize." # todo: NEW TRANSLATION
 AST_the_special_forces: "Kdo se odváží, vítězí" # todo: NEW TRANSLATION
 AST_the_special_forces_desc: "Australské SAS se pro mnohé stalo zdrojem hrdosti, a to z dobrého důvodu. Tento elitní pluk, původně vytvořený podle britské jednotky, se velmi osvědčil při citlivých zahraničních operacích. Pokud je vybavíme nejlepší technologií, kterou máme, zajistíme pokračování jejich úspěchů." # todo: NEW TRANSLATION
 AST_lessons_from_the_middle_east_ast: "Poučení z Blízkého východu" # todo: NEW TRANSLATION
 AST_lessons_from_the_middle_east_ast_desc: "Z řady operací na Blízkém východě jsme se mnohé naučili. Za zmínku stojí zejména neslučitelnost našich uniforem s prašným počasím, které je v tomto regionu běžné. Přestože byly navrženy pro australské horko, lze je vylepšit." # todo: NEW TRANSLATION
 AST_remembering_the_anzacs: "Vzpomínka na ANZAC" # todo: NEW TRANSLATION
 AST_remembering_the_anzacs_desc: "Náš ceremoniál ANZAC vždy uctíval ty, „kteří sloužili a padli ve všech válkách, konfliktech a mírových operacích“. To zahrnuje nejen ty, kteří zahynuli ve Velké válce, ale i naše vojáky v nedávných konfliktech, například ve válce v Zálivu a v Indonésii. Poučením, které si odnášíme, je posvátná povinnost udržet naše vojáky v bezpečí. Nyní, když se válka neustále mění, se musíme také měnit a inovovat, abychom našim silám poskytli největší šanci na bojišti. Jinak na ně budeme vzpomínat při příštím ceremoniálu." # todo: NEW TRANSLATION
 AST_never_another_darwin: "Už nikdy další Darwin" # todo: NEW TRANSLATION
 AST_never_another_darwin_desc: "Dne 19. února 1942 prorazil Darwin nálet přibližně 188 japonských letadel. Kromě zničení naší vojenské infrastruktury byly katastrofální i ztráty mezi personálem a civilisty, největší při jediném útoku proti nám během války. Pravidla válčení se změnila, ale poučení zůstalo stejné." # todo: NEW TRANSLATION
 AST_new_tools: "Nové nástroje" # todo: NEW TRANSLATION
 AST_new_tools_desc: "Pokud nás 21. století něco naučilo, pak to, že sebeuspokojení zabíjí. Mohli bychom si ponechat stejné pušky a stejnou doktrínu, ale naši nepřátelé to neudělají. Inovace napříč Atlantikem a Pacifikem přinesly lepší zbraně navržené pro širší škálu prostředí a typů hrozeb. Něco takového si nemůžeme dovolit ignorovat." # todo: NEW TRANSLATION
 AST_old_reliable: "Stará jistota" # todo: NEW TRANSLATION
 AST_old_reliable_desc: "Během studené války jsme se již poohlíželi v zahraničí a vybrali jsme si Rakušany. Steyr to s AUG zvládl správně. Elegantní, zjednodušená zbraň, kterou naši výrobci po desetiletí zdokonalovali. Proč měnit něco, co funguje? Místo toho můžeme investovat do rozšíření současné výroby a zajistit, že budeme připraveni na jakékoli nečekané požadavky." # todo: NEW TRANSLATION
 AST_lithgow_arms: "Lithgow Arms" # todo: NEW TRANSLATION
 AST_lithgow_arms_desc: "Továrna Lithgow Arms je od roku 1912 symbolem našich schopností a vytrvalosti. Věrně nám sloužila během první i druhé války a za tu dobu pro nás vyrobila více než milion pušek. Proto je těžké sledovat její současný žalostný stav. Je třeba něco udělat." # todo: NEW TRANSLATION
 AST_grow_our_command: "Rozšířit naše velení" # todo: NEW TRANSLATION
 AST_grow_our_command_desc: "Jedno z opatření Bílé knihy již bylo provedeno. Velitelství speciálních operací bylo navrženo ke sjednocení našich jednotek speciálních sil s komandosy. S neustále rostoucí hrozbou terorismu a obvyklými výzvami potřebují naše speciální síly veškerou dostupnou pomoc. Spojení úsilí může vytvořit jednotný úderný nástroj." # todo: NEW TRANSLATION
 AST_the_second_white_paper: "Druhá bílá kniha" # todo: NEW TRANSLATION
 AST_the_second_white_paper_desc: "Po víceméně úspěšné Bílé knize z roku 2000 nám vláda vydala novou, velmi podobnou směrnici. Pokračující expanze a technologický náskok nás mají udržet, libru za librou, na úrovni velmocí. Už jsme se této výzvě postavili a dokážeme to znovu." # todo: NEW TRANSLATION
 AST_strategic_reform: "Strategická reforma" # todo: NEW TRANSLATION
 AST_strategic_reform_desc: "Současný stav našich úřadů nestačí. Reforma našich strategických sil odshora dolů odstraní některé neefektivity, které se v posledních desetiletích nahromadily, a umožní nám vyvinout se v mnohem pružnější a pohotovější sílu schopnou čelit neustále se měnící situaci, kterou nám Pacifik přichystal." # todo: NEW TRANSLATION
 AST_incorporate_the_peacekeeping_training_ast: "Začlenit mírový výcvik" # todo: NEW TRANSLATION
 AST_incorporate_the_peacekeeping_training_ast_desc: "Austrálie je od konce druhé světové války součástí mírových operací Organizace spojených národů a poskytuje personál i zdroje. Během těchto desetiletí, zejména při nedávné intervenci ve Východním Timoru, jsme získali řadu poznatků o válčení, které lze lépe začlenit do naší vlastní doktríny a udržet naše vojáky v bezpečí i v těch nejnepravděpodobnějších prostředích." # todo: NEW TRANSLATION
 AST_recruitment_campaigns: "Náborové kampaně" # todo: NEW TRANSLATION
 AST_recruitment_campaigns_desc: "Od plakátu „Coo-ee, nepřidáš se?“ máme pro náborové kampaně cit. S rozvojem internetu se nám otevřela zcela nová oblast příležitostí. Můžeme vytvořit řadu reklam, které tento prostor využijí a osloví ty, kteří méně sledují běžnou televizi." # todo: NEW TRANSLATION
 AST_land_one_two_one: "ZEMĚ 121"
 AST_land_one_two_one_desc: "Projekt byl dlouhodobým úsilím nahradit mnoho našich zastaralých, nechráněných středních a těžkých nákladních vozidel zdokonalenými konstrukcemi Rheinmetallu, které měly zlepšit jejich logistiku a mobilitu a zároveň přinést lepší pancéřovou ochranu. Dosud byl projekt úspěšný a nyní přijdou na řadu naše protiletadlová a vozidla blízké podpory."
 AST_stop_panicking: "PŘESTAŇTE PANIKAŘIT"
 AST_stop_panicking_desc: "Všichni se musí UKLIDNIT. Jsme vláda, ekonomiku neovládáme. Když se věci začnou zhoršovat, byť jen na chvíli, všichni najednou ukazují prstem na nás. A co je horší, začínají panikařit. Stimuly pro téměř všechny by nám měly koupit trochu klidu, než se nám podaří situaci zvládnout."
 AST_guarantee_the_banks: "Zaručit bankám"
 AST_guarantee_the_banks_desc: "Pokud se banky bojí, udržíme je v plusu. Uděláme cokoliv, aby pokračovaly, a sakra, zaručíme VŠECHNY bankovní vklady. Žádná banka v této zemi nezkrachuje a my poskytneme dostatek fiskálních náplastí, aby HDP dál rostl jen díky vládním výdajům."
 AST_grab_the_securities: "Vykoupit cenné papíry"
 AST_grab_the_securities_desc: "Byl to americký trh s bydlením, který to všechno odstartoval, a tisíce australských majitelů domů se ptají, zda se totéž stane i jim. Veřejnost můžeme uklidnit odkupem cenných papírů krytých hypotékami, podpořit tak financování bydlení a zajistit, aby se nezhroutilo."
 AST_turn_things_around: "Obrátit situaci"
 AST_turn_things_around_desc: "Národní plán budov a pracovních míst se stal největším ekonomickým balíčkem, jaký jsme kdy sestavili. Zahrnuje školní infrastrukturu, sociální bydlení, výstavbu domů, daňové úlevy, železniční projekty a více stimulačních plateb, než dokážete spočítat. Vrchol naší podpory národu by měl ukázat, že to s návratem na správnou cestu myslíme vážně, a uklidnit všechny nervy."
 AST_the_royal_australian_navy: "Královské australské námořnictvo"
 AST_the_royal_australian_navy_desc: "Naší pýchou a radostí, která se pohybuje u našeho pobřeží, je RAAN. Pokud to nebylo zřejmé, Austrálie je ostrovní stát. Po staletí se k našim břehům mohla invazní armáda dostat pouze flotilou a kdysi nás před tím chránilo Královské britské námořnictvo. Nyní nás samozřejmě může zasáhnout mezikontinentální raketa a způsobit mnohem větší škody, aniž by kdokoli musel přistát na našich březích, ale o to tu tak docela nejde. Na počest role, kterou kdysi zastávalo, a s neméně důležitým úkolem pojmenujeme naše námořnictvo královským a vyšleme ho, aby udržovalo vlny v bezpečí stejně jako kdysi. Aby chránilo náš slavný národ."
 AST_embrace_the_support_role: "Přijmout podpůrnou roli"
 AST_embrace_the_support_role_desc: "Přijmout podpůrnou roli – Realita našeho postavení v Tichomoří spočívá v provizorním doplňování sil. Sami, jeden na jednoho, nemáme proti čínské nebo ruské flotile žádnou šanci. Budeme bojovat, ale jediný způsob, jak válku vyhrajeme, vede přes naše spojence. Naší rolí vždy bylo hrát druhé housle Američanům a dosud nám to vyhovovalo. Musíme jen vydržet, než dorazí, a pak zvítězíme. Na podpůrné roli není nic ostudného, zvlášť když ji budeme plnit dobře."
 AST_we_are_the_pacific: "My jsme Pacifik"
 AST_we_are_the_pacific_desc: "Doba se změnila. Sovětský svaz již neexistuje a Čína zatím není jeho nástupcem. Ve skutečnosti je námořní válka v dohledné době velmi nepravděpodobná. Pokud by k ní došlo, možná bychom se sami neudrželi. Ne s tímto námořnictvem. Pokud se zavážeme k jeho rozšíření, můžeme vytvořit sílu, se kterou bude muset počítat málokdo. S využitím všeho, co máme k dispozici, nemusí být role našeho národa pevně daná."
 AST_trade_support: "Podpora obchodu"
 AST_trade_support_desc: "Jednou z našich životně důležitých povinností bylo chránit obchod mezi námi a našimi cennými partnery. Udržování bezpečného toku zboží před narušováním našimi námořními rivaly, jako je Čína, zajišťuje, že obchod s našimi největšími dovozci, například Čínou, bude i nadále vzkvétat."
 AST_multidimensional_warfare: "Operace ve více doménách"
 AST_multidimensional_warfare_desc: "Integrací vojenské síly v pozemní, námořní, vzdušné, vesmírné a kybernetické doméně získáme výraznou převahu nad nepřáteli, kteří v těchto oblastech zaostávají. Letecké i námořní oddělení musí na tomto úkolu spolupracovat."
 AST_whetstone_training: "Výcvik na brusném kameni"
 AST_whetstone_training_desc: "Stejně jako meč ponechaný ladem zreziví, pokud naše námořnictvo nebude neustále zkoušeno a zdokonalováno, zreziví také. Cvičení námořního boje naše kadety a námořníky pořádně zocelí, nebo mě snad raní. Budou připraveni na jakékoli střetnutí kdykoli, protože to je jejich práce, a budou nám dělat čest."
 AST_wide_scanning: "Rozsáhlé skenování"
 AST_wide_scanning_desc: "Operační radarová síť Jindalee (JORN) prošla prototypovou fází a přešla k implementaci páté fáze, což v podstatě znamená, že jde velmi pravděpodobně o nejvyspělejší radarovou technologii na světě, která monitoruje vzdálenosti přesahující 3 000 kilometrů. Vynalézt ji byla snadná část, dostat ji na naše lodě bude mnohem těžší."
 AST_an_outside_review: "Nezávislé hodnocení"
 AST_an_outside_review_desc: "Abychom změřili naše schopnosti, zadali jsme nezávislé hodnocení. Výsledky přinesly poněkud znepokojivou kritiku naší výrobní kapacity, kterou budeme muset zásadně změnit, pokud chceme při rozvoji vážného námořnictva něčeho dosáhnout."
 AST_the_middle_ships: "Střední lodě"
 AST_the_middle_ships_desc: "Do vývoje torpédoborců třídy Hobart bylo vloženo mnoho potu a slz. Nahrazují naše lodě třídy Perth ze šedesátých let a byly navrženy k obnovení našich schopností v oblasti řízených střel. Mohou být naší nejdůležitější modernizací vůbec."
 AST_screening_role: "Úloha krytí"
 AST_screening_role_desc: "Pokud podporujeme naše spojence v Tichomoří, musíme pro ně být očima a ušima. Naše schopnost odhalit hrozby dříve, než se objeví u našich dveří, není jen taktickou výhodou pro ně, ale pomáhá i nám připravit se a ovládnout bojiště. Čím lepší v tom budeme, tím lépe si povedeme."
 AST_below_the_enemy: "Pod úrovní nepřítele"
 AST_below_the_enemy_desc: "Ačkoli některé naše ponorky byly zařazeny do služby teprve nedávno, velká část flotily je velmi stará. Většina byla modernizována, ale to nic nemění na skutečnosti, že nás technologicky znevýhodňují, zejména když je naší nejlepší šancí nepřímý boj."
 AST_containment_theory: "Teorie zadržování"
 AST_containment_theory_desc: "Během studené války jsme spolu s Američany uplatňovali „teorii zadržování“. Šlo o teorii výslovně navrženou k blokování sovětské expanze. Geopolitická šachovnice se změnila, ale v některých ohledech se úkol nezměnil. Naši nepřátelé uskutečňují zcela skutečný expanzionistický záměr. Ať už prostřednictvím diplomacie, nebo budováním ostrovů, naše suverenita je bezpochyby ohrožena, pokud tomu nedokážeme vzdorovat nebo to alespoň omezit. Důsledná námořní přítomnost spolu s úspěšnou diplomatickou činností je jediným způsobem, jak dosáhnout budoucnosti bez přímé války, což znamená, že je to naše jediná možnost."
 AST_the_groundwork: "Základy"
 AST_the_groundwork_desc: "Musíme vynaložit tvrdou práci na vybudování infrastruktury pro to, čeho se snažíme dosáhnout. Bude nutné rychle provést masivní rozšíření našich současných loděnic a prostor pro jednotlivá oddělení, což bude podle očekávání poněkud nákladné."
 AST_expand_command_capabilities: "Rozšířit velitelské kapacity"
 AST_expand_command_capabilities_desc: "Vzhledem k rozsahu našich plánů budeme muset rozšířit Velitelství námořnictva a ministerstvo obrany, aby je dokázaly řídit. Udržování úzkého propojení obou složek během přechodu a dohled nad zvýšením výroby bude nákladné, ale nezbytné."
 AST_carrier_project: "Projekt letadlových lodí"
 AST_carrier_project_desc: "Není to tak dávno, co měla Austrálie vlastní letadlové lodě. HMAS Sydney a Melbourne byly připraveny na jakékoli střetnutí a byly skutečnými kráskami moře. Jak se doba měnila a naše vojenské výdaje klesaly, takoví obři přestali být životaschopní. Až dosud. Letadlové lodě se vrátí do naší flotily a odkaz našich vyřazených lodí bude žít dál."
 AST_like_submarines_in_a_barrel: "Jako ponorky v sudu"
 AST_like_submarines_in_a_barrel_desc: "Musíme překlenout mezeru v oblasti letadlových lodí, a k tomu budeme muset využít naše vrtulníky. MH-60R Seahawk je vynikajícím příkladem pro dosažení našich cílů v oblasti mobility. Můžeme investovat do projektu, vyvinout konstrukci a zahájit výrobu."
 AST_ship_to_air: "Nekrmte torpédoborce"
 AST_ship_to_air_desc: "Naše torpédoborce mají hlad po raketách a jediný způsob, jak je nakrmit, je dodat jim více raket. Ne starou technologií, ta nebude stačit. Budeme potřebovat něco úplně nového, čím tyto tvory nakrmíme."
 AST_grants_to_contractors: "Granty pro dodavatele"
 AST_grants_to_contractors_desc: "Kdyby nám neustále nedávali přesně to, co chceme, řekl bych, že nás tyto společnosti využívají. Naštěstí se správné investice ukázaly jako dostatečně spolehlivé, aby partnerství pokračovalo. S trochou dalších investic bychom mohli zaznamenat zlepšení výroby, které potřebujeme."
 AST_adf_academies: "Akademie ADF"
 AST_adf_academies_desc: "Naše přední instituce kombinující vojenský výcvik s univerzitním vzděláním se nachází v Canbeře. Je to jen jedna budova, ale vzhledem k našim obranným potřebám bude třeba tento počet výrazně zvýšit. Vybudujeme jich několik ve všech našich velkých městech a možná také poněkud uvolníme požadavky."
 AST_the_raaf: "Královské australské letectvo"
 AST_the_raaf_desc: "Ach, Královské australské letectvo. Naše hlavní složka vzdušného boje, která nadále udržuje oblohu nad Austrálií v bezpečí. Mají nejlepší uniformy, nejlepší jídlo a nejúžasnější práci v rámci ADF. Ale nezabývejme se výhodami. Mandát byl vydán a zaměření je jednoduché: vzdušná převaha v Tichomoří a podpora našich expedičních operací. Jak toho dosáhneme, je na nás."
 AST_fourth_generation_striking: "Úderné letectvo čtvrté generace"
 AST_fourth_generation_striking_desc: "Získat letouny čtvrté generace nebude snadné a budeme muset plně využít naše kontakty i technologické schopnosti. Rozdíl mezi stíhačkami třetí a čtvrté generace není tak obrovský, ale vzhledem k rychlému nástupu páté generace je zřejmé, že nechceme zůstat pozadu."
 AST_globemasters: "Globemastery"
 AST_globemasters_desc: "Boeing Globemaster III je naším hlavním nákladním letounem pro strategickou leteckou přepravu a transport vojsk. Boeing se při tomto projektu rozhodně předvedl. Tento model je větší a mnohem výkonnější než předchozí, ale hádejte co – chceme další. Pošleme jim specifikace a budeme doufat, že výsledek bude dostačující."
 AST_shadow_in_the_sky: "Stín na obloze"
 AST_shadow_in_the_sky_desc: "AAI RQ-7 Shadow je v současnosti naše nejúčinnější průzkumná jednotka a bezpilotní bojový dron. Další šikovná technologie převzatá od Američanů, která znamená zásadní změnu povahy válčení. Jak roste naše mobilní infrastruktura a rozšiřuje se dosah našich operací, naše schopnost bojovat se účinně zvýšila daleko za hranice toho, čeho jsme byli dříve schopni."
 AST_the_roulettes: "The Roulettes"
 AST_the_roulettes_desc: "The Roulettes jsou vlastním akrobatickým týmem letectva. Létali po celém světě a předváděli řadu odvážných vystoupení, čímž si přirozeně získali obdiv těch, kteří měli to štěstí je vidět. Zkrátka, pokud každý jejich let prospívá naší pověsti, rozhodně jim v létání nebudeme bránit."
 AST_employ_ballistic_missiles: "Nasadit balistické rakety"
 AST_employ_ballistic_missiles_desc: "Dálkové přesné úderné rakety se často používají k odstrašení konfliktů. Jsou magickým nástrojem, který umožňuje tančit na šedé hranici mezi nekonfrontací a totální válkou. Pokud by například byla zasažena některá z našich základen v zámoří, mohli bychom nasadit „proporcionální odpověď“, při níž bychom našimi dálkovými raketami zasáhli stejně strategické místo. Všichni by pak mohli spokojeni odjet domů s jen mírně pošramoceným egem a bez obav z války. Teoreticky."
 AST_project_wedgetail: "Projekt Wedgetail"
 AST_project_wedgetail_desc: "Projekt Boeing E-7 je jedním z našich novějších úsilí v oblasti mobilních velitelských center. Díky radaru umístěnému na vrcholu nám poskytuje systém včasného varování a informace o poloze v reálném čase přímo z bojiště. Letoun lze samozřejmě podle našeho uvážení přestavět a využít k jiným účelům ve vzduchu."
 AST_keep_them_out: "Udržet je venku"
 AST_keep_them_out_desc: "Odhalit je je jedna věc, skutečně odradit nepřátelská letadla od ostřelování australských měst je věc druhá. Naše letadla nemohou být ve vzduchu neustále, a proto je nahradí přenosné a stacionární systémy „NASAMS“. V kombinaci s radarem představují mocnou obrannou sílu."
 AST_preserve_the_super_hornets: "Zachovat Super Hornety"
 AST_preserve_the_super_hornets_desc: "Po vyřazení F-111 převzalo jejich úlohu 24 letounů F/A-18F Super Hornet, které však také začínají stárnout. Můžeme tento model vylepšit a aktualizovat řadu vnitřních systémů, aby byl připraven na novou úlohu."
 AST_masters_of_command: "Mistři velení"
 AST_masters_of_command_desc: "Využití vrtulníkové logistiky při operacích způsobilo revoluci v našem mobilním potenciálu. Bez potřeby letišť představují nejlepší řešení pro vysoce napjaté zóny a proměnlivá bojiště. Zřízení agentury věnované logistickým vrtulníkovým operacím zvýší jejich efektivitu ve všech směrech."
 AST_reopen_cockatoo_island: "Znovu otevřít Cockatoo Island"
 AST_reopen_cockatoo_island_desc: "Rostoucí potřeba opravných doků začala zatěžovat naši současnou infrastrukturu. Cockatoo Island, který byl uzavřen teprve v devadesátých letech, ale mezitím se stal turistickým cílem, bude nutné znovu vybudovat od základů, abychom mohli opravovat nejnovější generaci poškozených lodí."
 AST_the_howard_government: "Howardova vláda"
 AST_the_howard_government_desc: "Nad naším národem vychází slunce. Národem bohatým na krásu, zlatou půdu a skutečně obklopeným mořem. Austrálie má jako regionální mocnost v Tichomoří jedinečné postavení – je zemí s mnoha přáteli a několika nepřáteli. Přesto Australané touží po lepším zítřku a mnozí propadli sítem společnosti. Dělnická třída se v posledních volbách sjednotila kolem Howardovy vlády a Liberálové si užívají pohodlnou většinu.\n\nNyní nám byl svěřen mandát k opatrným změnám a očekává se, že jej naplníme. Keatingova vláda nám zanechala značnou rozpočtovou díru, kterou jsme sice pečlivě začali zacelovat, ale stále před námi stojí úkol dostat rozpočet ještě více do plusu. Ulice zaplnily protesty požadující kroky a naše vlastní podniky volají po ekonomické reformě.\n\nŠťastná země je v našich rukou."
 AST_new_millennium_economics: "Ekonomika nového tisíciletí"
 AST_new_millennium_economics_desc: "Rozpočet byl předložen a schválen. Fiskální disciplína a přebytek rozpočtu jsou našimi nejžádanějšími politikami, ale to neznamená, že nemůžeme trochu utratit, abychom později vydělali. Různá přebujelá aktiva ve státní správě jsou připravena k prodeji a stále lze provést řadu škrtů, které budou financovat rozšíření jiných programů.\n\nRezervní banka již zvýšila základní úrokovou sazbu. Je na nás, abychom ji následovali. Budeme tvrdí, ale jako vždy spravedliví."
 AST_trim_taxes: "Ořezat daně"
 AST_trim_taxes_desc: "Během posledních voleb jsme slíbili snížit daně tvrdě pracujícím Australanům. Naše stanovisko se nezměnilo. Starší obyvatelé a lidé s vysokými příjmy mohou jako první získat daňové úlevy, což ponechá více peněz místním podnikům a více prostředků v bankách."
 AST_restrict_welfare: "Omezit příživníky"
 AST_restrict_welfare_desc: "Naše rozšíření podpory v nezaměstnanosti znervóznilo členy strany, kteří dbají na rozpočet. Bez způsobu, jak přibrzdit její bobtnání, zmaříme naši několikaletou práci na vyrovnání účtů. Pokud začneme omezením rozsahu programu a zavedeme přísné podmínky pro jeho zachování, možná to zvládneme. Zvýšení vzájemných povinností také odřízne některé méně produktivní účastníky."
 AST_another_round_of_tax_cuts: "Další kolo daňových škrtů"
 AST_another_round_of_tax_cuts_desc: "Jakou vládou bychom byli, kdybychom nemysleli na naše podniky? Během našeho funkčního období došlo k výraznému růstu, ale některé malé podniky, a dokonce i několik velkých, zaznamenaly zpomalení produktivity. Jejich potíže můžeme zmírnit dalšími daňovými škrty a trochou reforem, které rozvíří vody konkurence."
 AST_launch_the_gst: "Spustit GST"
 AST_launch_the_gst_desc: "Legislativa prošla a daň ze zboží a služeb může nyní nahradit zastaralé systémy minulosti. Lees a ostatní odpůrci si mohou stěžovat, ale GST prošla zkouškami. Podniky mohou těžit z jednotné velkoobchodní daně a rozpočet tím také neutrpí."
 AST_cater_to_the_seniors: "Vyjít vstříc seniorům"
 AST_cater_to_the_seniors_desc: "Každá zdravá vláda čas od času koketuje s politikou opozičních poslanců. Dokonce i politiky opačného směru bychom měli zvažovat v nejlepším zájmu našeho lidu. GST výrazně posílila rozpočet, ale mnozí naši senioři z toho necítí žádný přínos. Osvobození základních potravin od této daně a velkorysá kompenzace pro důchodce by měly zmírnit její dopad. Liberálové nebudou obětováni na hranici ideologické čistoty."
 AST_rethink_negative_gearing: "Přehodnotit záporné zadlužení"
 AST_rethink_negative_gearing_desc: "Naše změny podporující záporné zadlužení se neobešly bez kontroverzí. Majitelé domů, a zejména naše starší voličská základna, změny uvítali, avšak ti, kteří si nemohou dovolit vlastní bydlení, sledovali, jak ceny během krátké doby prudce vzrostly. Členové naší vlády více naklonění Labor vidí, jak se účinky vymykají kontrole ještě před koncem našeho období. Možná tím zničíme naši dobrou pověst u starší generace, ale dlouhodobě zdravá ekonomika by mohla škody napravit. Můžeme jen doufat, že lidé v nesnázích zůstanou loajální."
 AST_first_home_first_served: "První domov na prvním místě"
 AST_first_home_first_served_desc: "Dalšími předpokládanými oběťmi GST jsou lidé kupující svůj první dům. Vzhledem k růstu cen stavebních materiálů jsme vyčlenili grant ve výši 7 000 dolarů pro první kupující domů. Pomůžeme jim získat náskok na stále konkurenčnějším trhu."
 AST_meeting_the_mining_giants: "Setkání s těžařskými giganty"
 AST_meeting_the_mining_giants_desc: "Není neobvyklé, že se vůdce národa setká s velkými hráči. Obchodní a průmyslová komora v Boulderu požádala o osobní schůzku, pravděpodobně podnícenou našimi nedávnými daňovými škrty. Můžeme jen očekávat, že budou dostatečně povzbuzeni k předložení dalších požadavků. Nakonec je na nás, zda jim vyhovíme."
 AST_proud_and_free: "Hrdí a svobodní"
 AST_proud_and_free_desc: "Pokud se zaměříme na regiony nejvíce trpící nedostatkem kvalifikovaných pracovníků a nezaměstnaností, můžeme založit až 24 technických vysokých škol zaměřených na předčasně ukončivší školní docházku a nezaměstnané. Rozšířením programu Work for the Dole i na učně je postavíme na stejnou úroveň s univerzitními studenty. Obranné síly se také zavázaly vyčlenit část vybavení a údržby na další odborný výcvik.\n\nStudenti budou moci svobodněji následovat své kariérní ambice a zároveň posílíme náš zpracovatelský průmysl. Tím v podstatě oslovíme tucet nízkopříjmových skupin najednou a jistě rozšíříme naši voličskou základnu mezi mládeží TAFE."
 AST_invest_in_people: "Investovat do lidí"
 AST_invest_in_people_desc: "Pro ty, kteří se ocitli na úplném dně, může být těžké znovu se postavit na nohy. Aniž bychom podporovali dlouhodobou nezaměstnanost, můžeme se vyhnout jejich trestání tím, že nabídneme pobídky k účasti na vzdělávacích programech TAFE a dalších obranných a komunitních projektech. Nejde tolik o rozdávání peněz jako o investici do budoucnosti našich pracovníků."
 AST_beef_up_the_dole: "Posílit podporu v nezaměstnanosti"
 AST_beef_up_the_dole_desc: "Náš program Work for the Dole byl dosud naprostým úspěchem. Méně Australanů je nezaměstnaných a účastníci programu si zlepšují pracovní schopnosti. Můžeme podporu rozšířit o veřejné práce a zvýšit věkové rozpětí vhodných žadatelů."
 AST_the_baby_bonus: "Porodné"
 AST_the_baby_bonus_desc: "Mít dítě už nebude znamenat finanční riziko. Nahrazením mateřského příspěvku získají nové matky jednorázovou platbu 3 000 dolarů. Povzbudíme mladé rodiny, aby se rozhodly pro rodičovství, a zmírníme břemeno spojené s novou rodičovskou rolí."
 AST_protect_the_water: "Chránit vodu"
 AST_protect_the_water_desc: "Některé nejvzdálenější vnitrozemské řeky jsou jen týden špatného počasí od úplného vyschnutí, což by připravilo celé farmy a města o vodu. Národní vodní iniciativa je prvním krokem v našem úsilí o udržitelnost. Řízení spotřeby vody a zachování udržitelné úrovně odběru v nejodlehlejších komunitách udrží dodávky vody dostupné pro miliony lidí."
 AST_the_kyoto_protocol_ast: "Kjótský protokol"
 AST_the_kyoto_protocol_ast_desc: "V návrhu OSN jsme již vyjednali spravedlivé podmínky. Jeho ratifikací se připojíme k dalším 84 zemím, které se již zavázaly snížit emise skleníkových plynů. Ať už má naše působení na globální oteplování jakýkoli dopad, zajistíme, aby byl minimální a aby Austrálie byla v této otázce odpovědným národem."
 AST_the_carbon_pollution_reduction_scheme: "Program snižování uhlíkového znečištění"
 AST_the_carbon_pollution_reduction_scheme_desc: "Rudd navrhl program, který má snížit současnou úroveň emisí uhlíku z našeho průmyslu celkem o 25 % prostřednictvím „stropů“, pod nimiž by společnosti musely udržovat své znečištění. Rudd je typicky vznešený člověk a pokud jde o klimatické změny, také věčný stěžovatel, ale veřejnost stojí za ním. Pokud program upravíme tak, aby nepoškodil naši konkurenční výhodu v oblasti fosilních paliv, možná nám to projde."
 AST_the_drought_force: "Jednotky proti suchu"
 AST_the_drought_force_desc: "Přechod do nového století byl dosud trnitý. Snad největším důvodem k obavám je „tisícileté sucho“, které může být nejhorším suchem v historii našeho národa. Naši záchranáři již mají plné ruce práce a my hledáme možnosti blíže naší vládě. Účastníky programu Work for the Dole jsme již zapojili do veřejných prací a nyní je můžeme nasměrovat na soukromé pozemky postižené touto přírodní katastrofou."
 AST_a_nation_worth_preserving: "Národ, který stojí za zachování"
 AST_a_nation_worth_preserving_desc: "Dosáhli jsme trvalého zlepšení udržitelnosti našeho národa. Možná to neovlivní svět jako celek, ale pro Australany jejich milovaný národ vytrvá. Vody jsou čistší a městský smog zmizel. Stále je možná co dělat, například hledat další metody čistší energie nebo ochrany přírody, ale prozatím si můžeme odpočinout jako hrdější národ."
 AST_practical_reconciliation: "Praktické usmíření"
 AST_practical_reconciliation_desc: "\"Rád bych začal uznáním tradičních vlastníků půdy, na níž se dnes setkáváme. Také bych rád vzdal úctu starším generacím, minulým i současným.\"\n\nMůže to znít jako prázdné řeči, ale vztah s původními obyvateli Austrálie nebyl bez konfliktů. Každá vláda musí svou historii uznat důstojně a s respektem a vedení není bez odpovědnosti. Ať už půjdeme vpřed jakkoli, uznáváme minulost a přijímáme budoucnost. Sjednocujeme Australany uváženým přístupem."
 AST_walk_the_journey: "Projít cestu"
 AST_walk_the_journey_desc: "Pro mnoho Australanů to byla dlouhá a obtížná cesta. Stejně jako je mnoho těch, kterým jsme pomohli, bylo by naivní předstírat, že někteří stále nezůstávají opomenuti. Naše snaha zacelit tuto propast a pozvednout ty, kteří zůstali pozadu, musí začít programy zaměřenými na zdraví, vzdělávání, bydlení a zaměstnanost. Programy, o nichž se již diskutovalo v parlamentu, budou financovány a rozšířeny. Znevýhodnění a koalice půjdou ruku v ruce."
 AST_a_national_apology: "Národní omluva"
 AST_a_national_apology_desc: "Keating nás chce podkopat. Dobrá, budeme hrát Labor jejich vlastní hru. Dám těm kašparům z Guardianu, co chtějí. Přijmu odpovědnost předchozích generací, a pak se můžeme POSUNOUT DÁL. Původní obyvatelé Austrálie dostanou spravedlivou šanci a nikdo nebude moci říct, že jsem jim nepomohl."
 AST_its_mabo_its_the_vibe: "Je to Mabo, je to pocit"
 AST_its_mabo_its_the_vibe_desc: "Případ Mabo byl přelomovým rozhodnutím Nejvyššího soudu. Eddie bojoval za domorodý titul, uznání existence předkoloniálních území a definitivně ukončil princip terra nullius.\n\nSpoluprací s domorodými komunitami a předložením dodatku, který by do preambule ústavy zahrnul Prohlášení o usmíření, bychom uznali jejich práva k půdě a rozšířili stávající zákon o právech domorodců na půdu. Je to možná symbolické, ale ukazuje to, že rovnost myslíme vážně. Všichni voliči budou mít stejný hlas."
 AST_the_civil_partnership_act: "Zákon o registrovaném partnerství"
 AST_the_civil_partnership_act_desc: "V současnosti státy a teritoria brání tomu, aby byly páry stejného pohlaví uznány dokonce i jako partneři, což jim může způsobovat řadu menších právních problémů. Přestože se k tématu manželství osob stejného pohlaví stavíme bez morálního postoje, můžeme pomoci těm, kteří se nechtějí brát, a přinejmenším dát o této otázce hlasovat."
 AST_avoid_the_speech: "Vyhnout se projevu"
 AST_avoid_the_speech_desc: "Z principu nevěřím, že jedna generace může přijmout odpovědnost za činy generace předchozí. Z principu to nepřijímám. Tato vláda nebude rozdávat prázdná gesta ani odškrtávat domorodou otázku kvůli politickým bodům. Koalice by v tom měla působit jednotně. Jakékoli řeči o účasti na pochodu usmíření je třeba hned v zárodku potlačit."
 AST_crack_down_on_protests: "Tvrdě zakročit proti protestům"
 AST_crack_down_on_protests_desc: "Pokřikování, demonstrace, to všechno musí přestat. Všichni se musí uklidnit! Je mi jedno, jak to uděláme. Změňte titulky, posilte policii. Cokoli, co můžeme udělat, aby se skutečné problémy dostaly do centra pozornosti a tito výtržníci byli pod kontrolou. Jejich sebeoslavování nebudu poslouchat. Vlastně tomu nebudu věnovat žádnou pozornost! Naše politika bude chválena jako odmítnutí vydírání pocitem viny a davové politiky. Tím jsem si jistý."
 AST_abolish_the_atsic: "Zrušit ATSIC"
 AST_abolish_the_atsic_desc: "Experiment odděleného zastoupení byl dosud neúspěšný. Byla do něj po desetiletí nalévána finanční podpora, ale domorodé komunitě nepřinesla žádný praktický užitek. Horší jsou obvinění ze špatného řízení, korupce, podvodů a další. Už dost. Agenturu zrušíme a z jejího financování zachráníme, co se dá."
 AST_with_safer_communities: "Za bezpečnější komunity"
 AST_with_safer_communities_desc: "Zprávy o zneužívání dětí a rozpadu vzdálených domorodých komunit na severu jsou mírně řečeno národní katastrofou. Nadstranická podpora morální intervenci se získala snadno. Nasadíme vojáky, omezíme sociální podporu, zavedeme povinné zdravotní prohlídky a dohled. Pornografie a alkohol budou v komunitách zakázány a konečně můžeme vrátit práva k půdě vládě. Některé prvky si vyžádají pozastavení platnosti zákona o rasové diskriminaci, takže poslanci v zadních lavicích a komunitní skupiny si budou stěžovat, ale až bude obnoven zákon a pořádek, místní nám nebudou děkovat jako jediní."
 AST_we_are_many: "Je nás mnoho"
 AST_we_are_many_desc: "Bezpochyby jsme rozmanitá země. Dokonce i v době politiky „Bílé Austrálie“ byla země zaplavena Evropany nejrůznějšího původu. Nyní země otevřela své dveře mnoha lidem a za tento příliv jsme odpovědní. Způsob, jakým tuto otázku budeme řídit, určí podobu Austrálie na celá desetiletí. Ať už budeme bohatí nebo silní, politiku i životy milionů určujeme my."
 AST_widen_our_net: "Rozšířit naši síť"
 AST_widen_our_net_desc: "Imigrační úřad urazil od dob „politiky Bílé Austrálie“ dlouhou cestu, ale přiznejme si to – číslo je stále nízké, velmi nízké. Při tempu růstu naší ekonomiky se nedostatek pracovníků stane nově se rozvíjejícím problémem. Vyřešíme to rozšířením příjmu zahraničních pracovníků a vyvážíme to přísnějším důrazem na kvalifikované migranty a omezeným přístupem nových migrantů k sociální podpoře. To by mělo potěšit obě strany a zároveň oslovit velké podniky."
 AST_with_open_arms: "S otevřenou náručí"
 AST_with_open_arms_desc: "Tento národ byl vždy multikulturní a jeho existence si vyžádala příchod lidí po moři. Ne každý přišel správnými kanály, přesto lidé ze všech koutů světa žádali o azyl. Toužili se stát součástí milionů lidí užívajících si naši bohatou zemi. Neefektivitu našich současných politik lze odstranit a umožnit skutečným žadatelům o azyl kratší dobu zadržení. Rodiny s dětmi budou přesunuty z detenčních center do komunitního bydlení a u osob zadržovaných déle než dva roky budou zavedeny nezávislé kontroly."
 AST_girt_by_border_patrol: "Obklíčeni pohraniční hlídkou"
 AST_girt_by_border_patrol_desc: "Austrálie může být ostrovem, ale kvůli tomu je zranitelná vůči invazi po moři. Incidenty ve vodách vystavily naši stávající pohraniční hlídku většímu tlaku než obvykle. Jak můžeme očekávat, že naše síly udrží národ v bezpečí, když nedokážeme jasně ochránit naše břehy? Zákon o ochraně hranic odstraní veškeré pochybnosti o schopnosti našich flotil vracet lodě zpět a zároveň ochrání důstojníky před nespravedlivým právním postihem."
 AST_the_pacific_solution: "Pacifické řešení"
 AST_the_pacific_solution_desc: "Zatímco legální přistěhovalectví kleslo, nelegální nikoli. Každý rok přistávají na našich březích tisíce migrantů bez dokladů a zdá se, že jejich počet stále roste. Stávající infrastruktura je přetížená, proto budou na Nauru a ostrově Manus vybudována pobřežní detenční zařízení, v nichž budou žadatelé o azyl ubytováni, než určíme jejich status. Oběma národům poskytneme spravedlivou kompenzaci. Poté zmenšíme území pevniny vhodné pro oprávněné žádosti o azyl, čímž dále odradíme ty, kteří předbíhají ve frontě."
 AST_for_bright_minds: "Pro bystré mysli"
 AST_for_bright_minds_desc: "Zahraniční studenti se rychle stávají nezanedbatelným zdrojem příjmů pro naše přední univerzity. V současnosti jich kvůli omezeným studijním vízům může přijít jen několik, ale pokud požadavky trochu upravíme, bude sem ze zahraničí cestovat mnohem více studentů a do vzdělávacího sektoru přiteče více peněz."
 AST_strong_in_difference: "Silní v odlišnosti"
 AST_strong_in_difference_desc: "Podařilo se nám řídit populaci různých kulturně rozmanitých lidí, kteří se spojili v novou australskou identitu. Všichni vypadáme jinak a každý z nás má jiné přednosti, ale společně budujeme Austrálii. Pracoviště jsou naplněna bystrými lidmi a těmi, kteří uspěli ve snaze splnit si sen této země. Sen o sounáležitosti a také o tom, že spolu dokážeme vycházet."
 AST_tear_out_the_roots: "Vykořenit kořeny"
 AST_tear_out_the_roots_desc: "Je dobře známo, že mnohé naše bezpečnostní problémy začínají a končí v Indonésii. Je naším nejsilnějším bezprostředním sousedem a zároveň je velmi zranitelná vůči extremistickým živlům. Pokud bychom se s ní dokázali dohodnout, zejména na spolupráci při likvidaci povstaleckých buněk v její zemi, prospělo by to oběma stranám. Položili bychom tak základy užší spolupráce v budoucnu."
 AST_welcome_the_experts: "Přivítat odborníky"
 AST_welcome_the_experts_desc: "Možná už máme některé z nejbystřejších myslí, ale pozvat další ze zahraničí by nám neuškodilo. Mohlo by to dokonce zmírnit některé problémy, kterým čelíme ve výzkumu a vývoji. Pokud využijeme již existující systém SkillSelect, můžeme nabídnout víza kvalifikovaným migrantům ze všech koutů moderního světa."
 AST_protected_on_all_sides: "Chráněni ze všech stran"
 AST_protected_on_all_sides_desc: "Jak slunce zapadá nad našimi zlatými oceány, naši lidé mohou odpočívat s vědomím, že na každé straně jejich národa hlídkují ve vodách naše hlídky a udržují je v bezpečí. Když se v tisku objeví obavy z lidí z jiného národa, kteří by mohli vyskočit na naše pláže, budou vědět, že jde jen o strašení, protože vláda je ochrání. Jejich budoucnost je zajištěna."
 AST_the_howard_doctrine: "Howardova doktrína"
 AST_the_howard_doctrine_desc: "Po našem zásahu ve Východním Timoru v roce 1999 začali někteří novináři používat tento termín, který nás měl popsat jako první volbu pro poskytování pomoci mnoha národům v Tichomoří. I když to může být přesné hodnocení, domnívám se, že naše doktrína se na takový postoj neomezuje.\n\nNež jsem se stal předsedou vlády, tato země příliš úzce vymezovala své místo ve světě. Naše vláda má schopnost vyvážit australskou zahraniční politiku tak, aby lépe odrážela jedinečné propojení kultur a dějin, v němž žijeme. Čas jen posílil mou víru, že nemusíme volit mezi svou historií a geografií. Nacházíme se v jedinečné pozici flexibility, v níž můžeme zůstat věrní tradičním spojencům a spojenectvím a zároveň budovat a posilovat nová partnerství v regionu."
 AST_deputy_peacekeepers: "Zástupci mírotvorců"
 AST_deputy_peacekeepers_desc: "V seriálu The Andy Griffith Show je Barney Fife zástupcem městského šerifa Andyho Taylora. Když šerif není nablízku, je na Barneym, aby udržoval pořádek a vedl město místo něj. Globální policejní role Spojených států se od pádu Berlínské zdi stala nezpochybnitelnou, ale každý den se objevují nové hrozby a některé z nich jsou Austrálii nepříjemně blízko. Stejně jako Barney je Austrálie v pozici, kdy má za úkol hlídat Tichomoří, zatímco USA působí jinde. Není to snadná pozice, ale zvládneme ji ve velkém."
 AST_war_on_the_terrible: "Válka proti hrůze"
 AST_war_on_the_terrible_desc: "V naší době jsou klasické definice terorismu i metody boje proti němu žalostně zastaralé. Ti, kteří chtějí Australanům ublížit, se technologiím dneška přizpůsobují mnohem rychleji. Zavedení legislativy měnící právní definice terorismu a zákonů trestajících osoby, které se jej dopouštějí, bude účinným prvním krokem. Abychom udrželi krok, bude nutné posílit pravomoci ASIO k zadržování i jeho schopnosti sledování a poskytnout našim jednotkám mobilní reakci, která hrozby potlačí dříve, než vzniknou."
 AST_new_wave_counter_terrorism: "Nová vlna boje proti terorismu"
 AST_new_wave_counter_terrorism_desc: "Ani naše nové změny nestačí. Čím více informací dostáváme o bezprostředně hrozících teroristických útocích na australské půdě, tím zřejmější je, že naše pravomoci musí být znásobeny. ASIO i policejní sbor bude třeba rozšířit. Protiteroristické razie, preventivní zadržování a posílení místní policie o pravomoc „zastavit a prohledat“ vytlačí hrozbu na světlo. Víme, že to bude kontroverzní krok, ale naše situace vyžaduje mnohem víc než polovičatá opatření."
 AST_commit_to_foreign_intervention: "Zavázat se k zahraničním intervencím"
 AST_commit_to_foreign_intervention_desc: "Konflikt se rozšířil téměř na každý kontinent světa. Výjimkou je Austrálie. Jediný způsob, jak jsme dokázali tento stav udržet a pokračovat v něm, je zajistit, aby se otevřený konflikt nepřelil do našich vod. Schopnost zasáhnout proti těmto hrozbám dříve, než se vymknou kontrole, je zásadní. Oblasti Blízkého východu a jihovýchodní Asie jsou ohnisky teroristických buněk, ale můžeme si vybrat, kde a jak zasáhneme, pokud to poslouží bezpečnostním zájmům našeho národa."
 AST_place_rudd_in_the_fire: "Vrhnout Rudda do ohně"
 AST_place_rudd_in_the_fire_desc: "Zdá se, že Kevin Rudd se při pokusech o prosazení legislativy stal v opoziční straně stále větší přítěží. Horší je, že získává pozornost veřejnosti. V současnosti je stínovým ministrem zahraničí, ale co kdybychom ho přidělili do našeho vlastního zahraničního výboru? Nechali bychom ho pracovat na diplomacii v Tichomoří. Nejenže by nás to ochránilo před odvetou, ale také by to odvedlo jeho pozornost od protiteroristické legislativy."
 AST_our_capacity_for_peace: "Naše schopnost nastolit mír"
 AST_our_capacity_for_peace_desc: "Ruddovo úsilí zahájit dialog s Číňany skutečně přineslo ovoce. Jsou ochotni vyjednat společnou mírovou iniciativu v Tichomoří. Taková příležitost se nenaskytne často a mohla by nám umožnit ukázat se Číňanům jako rovný partner a vymezit budoucí spolupráci. Méně klanění, více sdíleného zájmu na bezpečnosti Tichomoří."
 AST_off_to_delhi: "Do Dillí"
 AST_off_to_delhi_desc: "Uran zůstává naším největším nevyužitým nerostným zdrojem a naše společnosti touží navázat spojení s novým vývozním partnerem ještě před zahájením těžby. Indie je podle všeho očividným klientem. Vznikající supervelmoc v jižní Asii, dostatečně silná na to, aby prosadila svou vůli v Arabském moři. Mohla by být velmi užitečným spojencem, jak se naše sféra rozrůstá, nebo přinejmenším spolehlivým dovozcem našeho uranu."
 AST_marks_gambit: "Markův gambit"
 AST_marks_gambit_desc: "Od získání singapurské nezávislosti byly naše vztahy pouze srdečné. Je přirozené, že nyní podnikneme další kroky. Náš spolehlivý ministr obchodu Mark Vaile pracuje na první vážné dvoustranné obchodní dohodě, kterou jsme jim za poslední dvě desetiletí nabídli. Současně navazuje kontakty s Thajskem ohledně podobné dohody o převážně bezcelním obchodu. Uvolnění pohybu zboží do Austrálie i z ní bylo jedním z hlavních bodů našeho znovuzvolení. Strana se sice pokusí získat co nejvíce publicity, ale australský lid bude sklízet výhody."
 AST_fossil_fuels_for_yuan: "Fosilní paliva za jüany"
 AST_fossil_fuels_for_yuan_desc: "Naše diplomacie s Čínou probíhá bez problémů. Její skryté úsilí o rychlou industrializaci jí vytvořilo hlad po uhlí, kterého máme naštěstí dostatek. Uzavření dohody s ní se jeví jako oboustranná výhra a mohlo by z nás učinit atraktivnějšího obchodního partnera pro další asijské národy."
 AST_partner_with_the_japanese: "Partnerství s Japonci"
 AST_partner_with_the_japanese_desc: "Asijský obchod rychle převyšuje naše vazby na Evropu. Právem, protože naše zájmy se posunuly mnohem více do místního regionu. Japonci patří v obchodě k nejprohnanějším protivníkům, s nimiž se můžete setkat. Z diplomatického hlediska tomu není jinak. Jsou připraveni přijímat naše zemědělské vývozy výměnou za ústupky z naší strany. Snížení cel na jejich elektroniku a automobily bylo samozřejmým požadavkem, ale máme podezření, že budou chtít víc."
 AST_to_promote_our_spirit: "Propagovat našeho ducha"
 AST_to_promote_our_spirit_desc: "Naše zámořské úsilí se vyplatilo. Stále více lidí vidí Austrálii v novém světle a vnímá nás jako významného partnera v Tichomoří. I lidé by měli vidět naše úspěchy a oslavovat australského ducha takového, jaký je. Můžeme financovat řadu televizních reklam a online příspěvků na propagaci našeho národa, které zároveň poslouží jako turistický marketing. Umístění loga naší strany do dolního rohu také neuškodí. To je nejmenší odměna, kterou za své úsilí můžeme získat."
 AST_the_coalition_convention: "Sjezd koalice"
 AST_the_coalition_convention_desc: "Sjezd je často místem, kde kariéry umírají, protože jejich projevy a prosby o význam zůstanou nevyslyšeny a někdo jiný je zvolen novým vůdcem koalice. Někdy však vytrvalost přináší výsledky. Koalice již nyní má dostatečně silného vůdce, který může převzít vedení, takže tentokrát jde jednoduše o to pronést dobrý projev."
 AST_wholesale_economics: "Velkoobchodní ekonomika"
 AST_wholesale_economics_desc: "Pojem velkoobchod se obvykle spojuje s maloobchodníky nebo průmyslovými prodejnami, ale někteří jej používají k označení privatizace státního majetku. Při rušení neefektivity státní správy jsme nebyli nemilosrdní. Ani zdaleka. Proto bychom měli své úsilí trochu zintenzivnit. Existuje řada agentur, které můžeme zeštíhlit, a mnoho příjmů, pokud najdeme správné zájemce. Na druhou stranu existuje několik možností investic do pracovních odvětví, které při moudré volbě příliš nezasáhnou naše skvělé příjmy."
 AST_finalize_the_telstra_sale: "Dokončit prodej Telstry"
 AST_finalize_the_telstra_sale_desc: "Prodej Telstry byl pro vládní účetní pověřené rozplétáním všech zkorodovaných součástí, které se pro nás staly břemenem, dlouholetou záležitostí. ASX nám nabídla více než férovou cenu za zbývající aktiva a každý ekonomický racionalista by prodej dokončil dříve, než si to rozmyslí. Přesně to hodláme udělat."
 AST_allow_foreign_interests: "Povolit zahraniční zájmy"
 AST_allow_foreign_interests_desc: "Stejně jako Faust někdy musíte uzavřít dohodu s ďáblem. Optimisté v parlamentu vás možná přesvědčují, že Austrálie může přežít sama. Že se tento ostrovní stát může tváří v tvář globalizaci stát soběstačným. Mýlí se. Naše průmyslová odvětví mohou přežít jen tehdy, pokud dovolíme zahraničnímu kapitálu pohánět naši ekonomiku hladovou po dolarech, a média nejsou výjimkou. Pokud mají přežít, potřebují investice."
 AST_crush_the_unions: "Rozdrtit odbory"
 AST_crush_the_unions_desc: "Přítomnost odborů v naší ekonomice, a dokonce i v naší politice, se v posledních letech rozrostla příliš široce a příliš bezostyšně. Žádná organizace jako jejich by neměla zasahovat do našich záležitostí, natož do záležitostí našich pracovníků. Zákon WorkChoices má tento problém napravit a zbavit odbory jejich vlivu v továrnách. Nevyžene je úplně, ale dá vlastníkům podniků šanci bojovat."
 AST_carve_up_medicare: "Rozparcelovat Medicare"
 AST_carve_up_medicare_desc: "V prvním funkčním období jsme se nikdy nedostali k přezkoumání Medicare. Tento program sice poskytuje mnoha Australanům spolehlivé a špičkové zdravotní služby zdarma, ale zdá se, že někteří této nabídky zneužívají. Neefektivita sužující program také za špatného vedení Labor nafoukla jeho náklady. Stejně jako dobře nabroušený nůž můžeme odříznout tuk, který na něm visí už příliš dlouho."
 AST_privatise_the_care: "Privatizovat péči"
 AST_privatise_the_care_desc: "Experiment s veřejným zdravotnictvím v Austrálii vedl k růstu nákladů nad přijatelnou, ba dokonce zvládnutelnou úroveň, aniž by došlo k výraznému zlepšení péče. Privatizací částí programu vítáme možnost širšího výběru a vyšší efektivity pro ty, kteří péči potřebují. Jde o osvědčený model a jsme připraveni jej přijmout."
 AST_broadband_blueprint: "Plán širokopásmového připojení"
 AST_broadband_blueprint_desc: "Máme technologii. Můžeme přestavět naši síťovou infrastrukturu tak, aby všem Australanům poskytovala špičkové internetové služby pro firmy i domácnosti. Pokud využijeme to, co známe, a zapracujeme to do současné infrastruktury, mohli bychom během velmi krátké doby vytvořit plán celostátního zavedení."
 AST_curb_outside_interference: "Omezit vnější vměšování"
 AST_curb_outside_interference_desc: "Otevření australského trhu a ekonomiky zbytku světa bylo dosud přínosné, ale při řízení národa existuje určitá hranice. Schvalování zahraničních investic je ve většině odvětví základem podnikání, s výjimkou médií. Vliv Kerryho Packera na naše zpravodajství nelze přeceňovat a dokážeme si živě představit, jaký horší zahraniční zájem bychom mohli přilákat, kdyby se brány otevřely. Prozatím tyto dveře necháme zavřené."
 AST_bat_for_the_battlers: "Zastat se obyčejných lidí"
 AST_bat_for_the_battlers_desc: "Austrálie by nikdy neměla být národem definovaným třídou nebo závistí, ale národem sjednoceným kamarádstvím a úspěchem. Naši obyčejní lidé, australská střední třída, nás k cílové čáře dovedli vícekrát než kdokoli jiný. Je jen spravedlivé, abychom jim na pracovišti něco vrátili. Aniž bychom jim dovolili přehánět požadavky, nasloucháme odborům a zavedeme několik dílčích politik. Takových, na kterých skutečně záleží."
 AST_back_australias_ability: "Podpořit schopnosti Austrálie"
 AST_back_australias_ability_desc: "Naší ekonomickou politikou představující „to nejlepší z nejlepšího“ byl program Back Australia's Ability. Rozsáhlý obnovovací program na podporu velkých stavebních projektů po dobu čtyř let, který by měl výrazně snížit nezaměstnanost a vrátit do oběhu velkou část daňových prostředků, které jsme spotřebovali."
 AST_feel_the_heef_ast: "Pocítit HEEF"
 AST_feel_the_heef_ast_desc: "Fond Higher Education Endowment Fund je jedním z našich nedávných politických návrhů zaměřených na směrování investic do institucí vyššího vzdělávání a našich výzkumných a vývojových pracovišť. Zpočátku budeme jediní, kdo do fondu investuje, ale nakonec se má nějakým způsobem vrátit vládě. Zní to trochu jako nesmysl, ale pokud jej podporují obě strany, možná v něm něco užitečného bude."
 AST_if_we_build_it: "Když to postavíme"
 AST_if_we_build_it_desc: "Nastal čas splnit náš předvolební slib postavit 21 nových nemocnic, ale náklady bohužel od našich předchozích odhadů vzrostly. Naši fiskální odborníci doporučili zadat výstavbu soukromému sektoru, což nás bude stále stát spoustu peněz. Na druhou stranu možná ušetříme na veřejných zdravotních nákladech díky všem novým zařízením."
 AST_australian_made: "Vyrobeno v Austrálii"
 AST_australian_made_desc: "Logo Australian Made bylo jednou z nejúspěšnějších marketingových strategií, jakou kdy vláda vytvořila. Symbol byl snadno rozpoznatelný a díky němu nakupovalo více lidí místní výrobky. Nyní veřejné výdaje klesly a je obtížné dát přednost místní produkci před levným dovozem z Vietnamu nebo Číny. Pokud marketingovou kampaň rozšíříme nejen na domácí trh, ale i do zahraničí, a prohlásíme, že Australian Made je zárukou kvality, možná pro ni najdeme nové uplatnění."
 AST_preserve_the_old_forests: "Zachovat prastaré lesy"
 AST_preserve_the_old_forests_desc: "Jednou z našich největších pých jsou pralesní porosty v Tasmánii. Rostou v nich některé z nejvyšších kvetoucích stromů na světě, které dosahují výšky přes 90 metrů! Je to pozoruhodný poklad a v mnoha ohledech pro tento národ stejně důležitý jako Velký bariérový útes. Rozšíření stávající ochrany o dalších 170 000 hektarů by mělo zabránit jejich zničení, aniž bychom zadusili dřevařský průmysl."
 AST_ets: "Obchodování s emisemi"
 AST_ets_desc: "Dalším klimatickým zákonem, o němž se mluví v parlamentu, je „systém obchodování s emisemi“. Labor stále něco podobného vymýšlí a z nějakého důvodu jim někteří členové strany naslouchají. Právě teď nám nabídli ústupek v podobě předběžného zavedení systému několika granty na rozvoj jaderné energetiky. Jadernou energii v současnosti nepodporujeme, ale nemůžeme ji zlikvidovat v zárodku. A pokud od nich můžeme získat cokoli, co pomůže zmírnit klimatické fanatiky vůči naší politice, vezmeme to."
 AST_the_new_liberals: "Noví Liberálové"
 AST_the_new_liberals_desc: "Ať se nám to líbí, nebo ne, strana se změnila. Už nejsme malí liberálové z devadesátých let, ale profesionální síla tradičních hodnot. Úspěšně jsme spojili ekonomický liberalismus s fiskálním konzervatismem. Geopolitické problémy uznáváme a řešíme, Australanům zůstává více peněz v kapsách a méně odchází na daně. Upřímně řečeno, národ je na tom díky tomu lépe a my se těšíme podpoře většinových voličů. Směr, kterým nyní stranu povedeme, může naši dynamiku posílit, nebo zničit, ale bude mít také výrazné dopady na generace závislé na našem vedení."
 AST_keep_them_in_line: "Udržet je v řadě"
 AST_keep_them_in_line_desc: "Naši stranu příliš dlouho sužují intriky a vnitřní převraty. Jak nám může veřejnost důvěřovat, když si nevěříme ani sami? Budeme muset „restrukturalizovat“ stranická pravidla pro výzvy k vedení a omezit tuto praxi na nejkrajnější okolnosti. Ke změně bude třeba povzbudit jen několik Nacionalistů."
 AST_secure_the_coalition: "Zajistit koalici"
 AST_secure_the_coalition_desc: "I když se ne vždy shodneme, naši přátelé z National s námi kráčejí po stejné linii téměř celé století. Jsme jako hrášky v lusku. Rozštěpení koalice by naše strany odsoudilo k tomu, že už nikdy nevyhrají federální volby. Něco takového nesmíme ponechat náhodě. Přepsání klauzulí o rozdělení tak, aby to bylo pro kteroukoli stranu prakticky nemožné, je udrží na naší straně, ať už se jim to líbí, nebo ne. Pak budeme skutečně sjednoceni – duchem i písemně."
 AST_entice_crossbenchers: "Nalákat nezávislé poslance"
 AST_entice_crossbenchers_desc: "Náš politický systém je po desetiletí závislý na práci nezávislých poslanců. Tito často bezpáteřní lidé nám pomohli schválit několik zákonů, přičemž přecházeli mezi podporou nás a opozice, nebo se zcela zdrželi. Některé stačí získat zpět drobnou laskavostí či dvěma. Pár potřesení rukou zde, trochu investic tam a získáme si dost z nich."
 AST_broaden_our_beliefs: "Rozšířit naše přesvědčení"
 AST_broaden_our_beliefs_desc: "Tvrdit, že naše strana uvízla v bahně, pokud jde o její přesvědčení, je téměř stereotypní. Koneckonců jsme tradicionalisté, což je rozumný postoj. Nevýhodou je, že nám mohou unikat cenné politiky, které nepodporuje celá strana. Možná nastal čas sednout si a promluvit s menšími stranami. Možná se něco přiučíme."
 AST_axe_the_governor_general: "Zrušit generálního guvernéra"
 AST_axe_the_governor_general_desc: "Referendum o republice možná v roce 1999 selhalo, ale to neznamená, že potřebujeme zástupce země na druhém konci světa, který nám zasahuje do rozhodování. Už jednou sesadili jednoho z našich vůdců a mohou to udělat znovu. Je načase sesadit je. Obejdeme je a půjdeme přímo ke královně, žádost podáme formálně a podpoříme ji několika „zprávami“ o pochybení. Pak se jich zbavíme sami."
 AST_our_own_kings: "Naši vlastní králové"
 AST_our_own_kings_desc: "Nyní, když monarchie hledá náhradu, můžeme využít současné procesy k co největšímu zpomalení přechodu. Budou plavat v moři právních sporů a úředních vyšetřování tak dlouho, že může trvat roky, než budou moci jmenovat dalšího, a my získáme volnou ruku pro svou politiku bez dohledu koruny."
 AST_prepare_the_successor: "Připravit nástupce"
 AST_prepare_the_successor_desc: "Někdy je nejlepší skončit, dokud je vše dobré. V předchozím období jsem slíbil, že před dalšími volbami odstoupím. Tato příležitost přišla a odešla, ale stále není pozdě odložit klobouk a připravit příštího vůdce, aby nás vedl dál. Pamatuji si, jak jsem bojoval, abych se sem dostal, a nyní zvažuji, že to nechám být."
 AST_peace_with_honour: "Čestný mír"
 AST_peace_with_honour_desc: "A budoucnost Liberální strany byla rozhodnuta..."
 AST_the_sydney_declaration: "Sydneyská deklarace"
 AST_the_sydney_declaration_desc: "Deklarace byla původně sepsána jako závazek Austrálie splnit na fóru APEC požadavky světa v oblasti klimatických změn. Slouží však většímu účelu než jen signalizování pokrokovosti našim východním přátelům. Samotná deklarace ukazuje váhu, kterou máme v diplomatickém jednání. Oznamuje, že Austrálie je připravena jednat se světem a že při tom dokážeme skutečně něco změnit. Možná se sotva držíme v první desítce, ale jsme v ní a nyní už jen stoupáme."
 AST_the_quad: "Quad"
 AST_the_quad_desc: "Jednání s Japonskem a Indií o pomoci při katastrofách byla natolik plodná, že naznačují vytvoření trvalejšího kanálu diplomatických rozhovorů. Americký viceprezident byl dokonce nakloněn myšlence vytvořit pakt, který by do jisté míry plánoval a sledoval nedávné kroky Číny v Tichomoří. Nakonec byl zvolen název „Čtyřstranný bezpečnostní dialog“, ale prozatím mu říkáme „Quad“."
 AST_negotiate_with_our_northern_neighbours: "Naši severní sousedé"
 AST_negotiate_with_our_northern_neighbours_desc: "Naše dějiny s Papuou-Novou Guineou byly v posledních desetiletích převážně pozitivní, přestože tu a tam došlo k několika zádrhelům. Zůstali jedním z našich největších obchodních partnerů v oblasti kaučuku a udržení tohoto uspořádání se stalo otázkou národní bezpečnosti. Pozvali jsme jejich premiéra, aby nám pomohl vyjednat neprůstřelnou dohodu."
 AST_anzus_collaboration: "Spolupráce ANZUS"
 AST_anzus_collaboration_desc: "Smlouva ANZUS měla bezpochyby své problematické momenty. Není to tak dávno, co Nový Zéland technicky dostal vyhazov poté, co odmítl vpustit americké jaderné ponorky do svých přístavů. Ať už se věci vyvinuly jakkoli, smlouva je něco jako bratrské pouto mezi námi. Přestože se americká politika odklonila od Evropy směrem k Blízkému východu, pokud jsou tam oni, jsme tam i my. Naše zaměření se může odklonit od místních záležitostí, ale koneckonců jde stejně o globální úsilí."
 AST_an_american_treaty: "Americká smlouva"
 AST_an_american_treaty_desc: "Jako možná největší ekonomika světa jsme kromě zjevné bezpečnostní výhody museli udržovat hospodářské vazby se Spojenými státy. Není snadné je rozzlobit, zvláště když už do naší země tolik investovaly. Občasná odměna za jejich podporu však nikdy neuškodila a my je jistě odměníme přednostní obchodní dohodou."
 AST_howard_of_arabia: "Howard z Arábie"
 AST_howard_of_arabia_desc: "Austrálie je stále převážně křesťanským národem. Naše morálka má kořeny na Blízkém východě. Izrael je již po desetiletí jedním z našich nejsilnějších partnerů a znovu a znovu prokázal odhodlání k principům demokracie. Když nás potřebují, nemůžeme je nechat na holičkách. Silnější přátelství s nimi je naší náboženskou povinností."
 AST_keep_security_regional: "Udržet bezpečnost v regionu"
 AST_keep_security_regional_desc: "Ačkoli jsme se angažovali v zámořských akcích na Blízkém východě, naše priority vždy směřovaly k bezprostředním sousedům. Ostrovní státy Tichomoří se nyní obracejí na nás s žádostí o bezpečnost, a právem. Austrálie má morální povinnost udržet je v bezpečí a bez radikálních živlů, jak se naše regionální mocnost rozrůstá. Naše úsilí s nimi to musí odrážet."
 AST_preventative_measures: "Preventivní opatření"
 AST_preventative_measures_desc: "Boty si neobouváte až poté, co vás uštkne had. Když jste v buši, první věc, kterou si musíte zajistit, jsou boty, a druhá je pořádný klacek. Tuto myšlenku, jakkoli hrubou, bychom měli používat při řešení obrany v zahraničí. Nevyrážíme s prázdnýma rukama a nenecháme své sousedy ohrožené bez alespoň nějaké ochrany."
 AST_dissuade_the_middle_kingdom: "Nároky v Papui"
 AST_dissuade_the_middle_kingdom_desc: "Naše dominance v regionu závisí na tom, zda zabráníme Indonésii, aby nás geopoliticky překonala. Situaci by mohlo usnadnit, kdybychom ji izolovali. Nacionalisté v Papui-Nové Guineji nás již léta žádají, abychom uznali jejich nárok na Západní Novou Guineu. Vyvolání určitého napětí na hranicích by mohlo být přesně tím, co potřebujeme k oslabení jejich přátelství a přiblížení PNG k našemu táboru."
 AST_the_indonesian_ultimatum: "Indonéské ultimátum"
 AST_the_indonesian_ultimatum_desc: "Konflikt s Indonésií se v poslední době stal běžnou událostí. Bez ohledu na náš postoj či rozsah spolupráce se zdá, že nedokáže zvládnout radikální živly uvnitř země. Můžeme jí vydat ultimátum, které nám umožní vyslat vlastní mírovou operaci do Acehu a účinně oblast okupovat, dokud nebude schopna fungovat jako nezávislý národ. Už jsme to jednou úspěšně udělali a můžeme to zopakovat. Pokud odmítnou, můžeme použít všechny sankce pod sluncem, dokud je nedostaneme zpět k jednacímu stolu."
 AST_a_visit_from_malaysia: "Návštěva z Malajsie"
 AST_a_visit_from_malaysia_desc: "Málokterá země komunikovala tak otevřeně a upřímně jako Malajsie. Její představitelé nás navštívili mnohokrát, od nejvyšších představitelů až po nižší ministry, a obchodní jednání vždy probíhala bez problémů. Možná je to naše společné dědictví Commonwealthu, ale mezi našimi národy vznikl hluboký respekt. Tentokrát se jednání týkají našeho zemědělského exportu, který je z bezpečnostních důvodů poněkud omezený. Pravděpodobně požádají o zmírnění zákonů."
 AST_peacekeeping_in_somalia: "Mírotvorba v Somálsku"
 AST_peacekeeping_in_somalia_desc: "Ačkoli přechodná vláda v Somálsku původně slibovala naději, po konfliktu válečných vůdců se ocitla v nejisté pozici a země se fakticky rozpadla. Probíhající humanitární krize nás přiměla zpozornět a nyní vláda žádá o zahraniční zásah. Mohla by to být příležitost procvičit naše mírotvorce, aniž bychom se přímo zapojili do konfliktu."
 AST_the_coal_family: "Rodina uhlí"
 AST_the_coal_family_desc: "Stejně jako americký sen padesátých let žije mnoho idealistických Australanů tradičním životem sebeurčení. Upřímně řečeno tvoří pravděpodobně velkou část naší voličské základny – a proč ne? Přesně tak chceme, aby australské rodiny žily. Nezávisle a šťastně. Můžeme jim oplatit laskavost tím, že omezíme politiky bránící výstavbě domů a snížíme některé pozemkové daně, abychom zmírnili jejich břemeno. Naše rodiny by neměly být trestány za to, že vlastní svůj kousek naší krásné země."
 AST_the_abbott_government: "Abbottova vláda"
 AST_the_abbott_government_desc: "Dnes prohlašuji, že Austrálie má nové vedení a že je opět otevřená podnikání. Otevřená a vedená vládou, která maximalizuje potenciál všech. Nejen těch, kteří pro nás hlasovali.\n\nVláda, jednoduše řečeno, pro všechny a pro mnohé. Pro ty, které velký Menzies popsal jako „ty, kteří pozvedávají, nikoli ty, kteří se vezou“. Zapomenutým rodinám bude věnována pozornost. Obtížné daně zmizí, lodě budou zastaveny a rozpočet se vrátí na cestu k přebytku, jaký jsme dosud neviděli ani neslyšeli.\n\nBez dalšího otálení se do toho pusťme."
 AST_expand_the_executive: "Rozšířit výkonnou moc"
 AST_expand_the_executive_desc: "Mezi naším posláním zmenšit vládu a současně zvýšit naši schopnost dokončit práci existuje paradox. Když kapitán řídí loď, jeho rozkazy musí být vyslyšeny bez ztráty času konzultacemi s celým parlamentem."
 AST_honour_the_party: "Ctít stranu"
 AST_honour_the_party_desc: "Náš kabinet musí odrážet odkaz strany, pokud chceme jít dál a získat přijetí. Práce Johna Howarda na předefinování Liberální strany byla zásadní pro přizpůsobení se nové éře moderní politiky a přijetí pracovníků z jeho vlády přinese množství zkušeností."
 AST_building_stronger: "Budovat silnější"
 AST_building_stronger_desc: "V hloubi duše chápeme, že společnost nemůže existovat bez ekonomiky, která ji udrží, a ekonomika nemůže existovat bez podniků schopných vytvářet zisk. Stejně tak důvěra v sílu našich financí klesla na minimum, přestože jsme obvykle optimističtí. Naším úkolem je nyní vše znovu vybudovat a učinit to dostatečně silné, aby na to mohl být každý Australan hrdý."
 AST_the_advisory_council: "Poradní rada"
 AST_the_advisory_council_desc: "Liberálové by neměli být vnímáni jako strana stojící proti usmíření. Koneckonců to byl Harold Holt, kdo ukončil politiku Bílé Austrálie. Vytvoříme radu, která nás bude informovat o domorodých záležitostech a udrží vyprávění zaměřené na praktické změny."
 AST_cut_the_programs: "Zrušit programy"
 AST_cut_the_programs_desc: "Nemůžeme donekonečna dotovat vzdálené komunity, které se nepodílejí na vládním úsilí o usmíření. Domorodým komunitám, které dostávají finanční prostředky, ale nejdou s námi, budou rozpočty zkráceny. Jednoduché."
 AST_its_the_constitution: "Jde o ústavu"
 AST_its_the_constitution_desc: "Nyní musíme ukončit to ozvěnou znějící mlčení v naší ústavě, opomenutí domorodého obyvatelstva. Takový krok vyžaduje rozhodnutí mimo parlament, tedy referendum, které uzná Aboriginy a obyvatele Torresova průlivu jako první národy naší země."
 AST_compete_on_the_farms: "Soutěžit na farmách"
 AST_compete_on_the_farms_desc: "Rodinné farmy byly od vzniku federace páteří zemědělského sektoru této země. Farmy od Tasmánie po Západní Austrálii, provozované generacemi Australanů, vytlačují větší korporace. Bez péče o naše zemědělce prostřednictvím dostupných půjček a lepších dodávek vody nemůžeme zůstat konkurenceschopní. Naše politika musí upřednostnit jejich nezávislost."
 AST_develop_the_northern_territory: "Rozvíjet obilnici"
 AST_develop_the_northern_territory_desc: "Byl předložen plán řady rozvojových projektů pro Severní teritorium, jejichž cílem je vybudovat z něj průmyslovou a zemědělskou velmoc. Jeho schválením podpoříme teritorium, které předchozí vlády obvykle přehlížely, a potenciálně vytvoříme obilnici Austrálie i Tichomoří na celá desetiletí."
 AST_getting_in_there: "Dostat se tam"
 AST_getting_in_there_desc: "Silnice vedoucí do Severního teritoria a z něj se bohužel ocitly v žalostném stavu. Kromě toho bude nutné modernizovat železniční trať Ghan, aby zvládla přepravu přiváženého materiálu."
 AST_funnel_in_workers: "Přivést pracovníky"
 AST_funnel_in_workers_desc: "K zahájení našich operací budeme potřebovat pracovní sílu. Nic, co by nevyřešilo několik přednostních víz a relokačních grantů."
 AST_project_manton: "Projekt Manton"
 AST_project_manton_desc: "Přehrada Manton bývala hlavním zdrojem vody a elektřiny v regionu, než si Darwin postavil vlastní přehradu. Náklady na renovaci a opětovné uvedení přehrady do provozu pro zásobování okolních komunit se překvapivě vejdou do rozpočtu a hmatatelně ukážou náš závazek k rozvoji Severního teritoria."
 AST_compassionate_government: "Spravedlivá šance"
 AST_compassionate_government_desc: "V této zemi platí, že když se snažíte, dostanete šanci. To by klidně mohlo být heslem strany pod naším vedením. Naši lidé by měli být odměněni za své úsilí a těm, kteří nejsou v nejlepší pozici začít, pomůžeme lehkou podpůrnou rukou. To není nárok, ale spravedlnost."
 AST_keep_the_fire_burning: "Udržet oheň"
 AST_keep_the_fire_burning_desc: "Díra, kterou sociální podpora vypaluje do vládní peněženky, nás potopí, pokud ji nezačneme řešit. Zároveň programy začínají přinášet naší populaci vážné pozitivní výsledky. Pokud nyní přestaneme, mohli bychom zmařit roky práce, které k nim vedly. Místo toho budeme muset přesunout část financování na pokrytí současných nákladů a doufat, že Keynes měl z dlouhodobého hlediska pravdu."
 AST_national_curriculum_review: "Přezkum osnov"
 AST_national_curriculum_review_desc: "Kromě obvyklé politické zaujatosti pronikající do našich osnov se zdá, že veřejné financování začalo opomíjet venkovské školy. Každá škola v Austrálii si zaslouží rovnou šanci a každý student vzdělání, které se může pochlubit úspěchy západní civilizace, ne pouze jejími problémy. Všichni bychom měli být hrdí na národ, v němž jsme vyrostli, i na jeho vzdělávací systém."
 AST_another_baby_boom: "Další baby boom"
 AST_another_baby_boom_desc: "Láska je krásná věc. Naše vláda to ví lépe než většina ostatních. Během voleb jsme slíbili přepracovat placenou rodičovskou dovolenou a poskytnout novým matkám 26 týdnů volna s náhradou ve výši jejich mzdy. Ve straně se proti tomu ozvalo mnoho odporu, ale dát matky našeho národa na první místo je důležitější."
 AST_responsible_governance: "Odpovědná vláda"
 AST_responsible_governance_desc: "Bezohledné výdaje naší vlády prakticky volají po rozpočtové krizi. Největší odpovědností vládnoucí strany je přijímat těžká rozhodnutí. Nemůžeme dál splácet hypotéku kreditní kartou."
 AST_the_welfare_bloat: "Taková společnost neexistuje"
 AST_the_welfare_bloat_desc: "Veřejná sociální podpora je v současném systému jednoduše příliš snadno dostupná. Každý, koho postihne smůla a bolí ho záda, může získat plné dávky Centrelinku a Medicare. Vstupní podmínky je třeba zpřísnit a některé zbytečné programy postupně ukončit, pokud chceme snížit rozpočtové přebujení."
 AST_cashless_welfare: "Bezhotovostní platby"
 AST_cashless_welfare_desc: "Po skončení zkoušek v komunitách Severního teritoria jsme přesvědčeni, že zavedení v menším měřítku je proveditelné. Nahrazení přímých vkladů vládními bankovními kartami a omezení výdajů na základní potřeby udrží zranitelné členy naší komunity mimo kasina a mimo ulice."
 AST_up_the_gst: "Ještě jedna daň"
 AST_up_the_gst_desc: "K největší reformě našeho daňového systému došlo teprve před několika lety, ale již přinesla zemi obrovské výhody. Přestože byla tehdy kontroverzní, naše podniky nyní využívají jednodušší systém a dodatečné příjmy financovaly naše nákladnější programy. Její nepatrné zvýšení nám pomůže překonat rozpočtové potíže, kterým právě čelíme."
 AST_national_audit_commission: "Národní auditní komise"
 AST_national_audit_commission_desc: "Zbytečné vládní výdaje se staly špínou pod botami, pokud jde o obtížnost jejich odstranění. Vytvoření komise jednou za generaci, která se bude věnovat jejich odstranění v celé správě, je nejlepší postup. Všechno se ocitne na řeznickém špalku."
 AST_investigate_union_corruption: "Válka s odbory"
 AST_investigate_union_corruption_desc: "Dejte bulváru vědět, že vyhlašujeme válku protiprávnímu jednání. Vyhlašujeme válku korupci a prohlašujeme, že v naší společnosti platí určité standardy. Ať už jste představitel společnosti nebo odborů, musíte dodržovat zákon."
 AST_the_energy_crisis: "Energetická krize"
 AST_the_energy_crisis_desc: "Posedlost ochranou klimatu nás připravila o výhodu právě ve chvíli, kdy stojíme před energetickým armagedonem. I když ji dokážeme kontrolovat, potřeby našeho lidu nejsou naplňovány a rostoucí ceny uvrhly do finančního ohrožení více lidí než jakákoli jiná krize, jíž tento národ čelil. Naše vláda musí tento problém jednou provždy vyřešit."
 AST_duttons_plan_focus: "Duttonův plán"
 AST_duttons_plan_focus_desc: "Náš ministr zdravotnictví Peter Dutton se zapojil do energetické debaty s řešením, které je přinejmenším rozdělující. Zrušení australských omezení jaderné energie by umožnilo výstavbu elektráren a jednou provždy vyřešilo nedostatek energie. Několik desetiletí jsme se této možnosti vyhýbali, a to z dobrého důvodu, ale možná jde o radikální řešení, které hledáme."
 AST_look_below: "Podívat se dolů"
 AST_look_below_desc: "Odpověď na všechny naše problémy byla vždy pod našima nohama. Zelení se jí bojí, Labor ji ignoruje, ale koalice ji respektuje. Žádný obnovitelný zdroj nenahradí Bohem daný zdroj energie, který pro nás vznikal od smrti dinosaurů."
 AST_build_it: "Postavit to"
 AST_build_it_desc: "Jednou z výhod uhelné energie je její krása. Máme jedny z nejlepších elektráren na zemní plyn na této straně světa a jsou mnohem hezčí než hlučné a ošklivé turbíny. Aktivací nouzových opatření AEMO k obstarání dalších generátorů a výstavbě vlastních elektráren můžeme během velmi krátké doby postavit další."
 AST_deny_it: "Popřít to"
 AST_deny_it_desc: "Duchovní malátnost podkopala morálku a ambice země, která kdysi nekladla žádné limity tomu, čeho může dosáhnout. Ústupky klimatickým změnám pokazily naši výrobu energie a povzbudily sousedy, aby převzali průmysl, který jsme ztratili. Čas vrátit nemůžeme, ale můžeme odstranit řetězy."
 AST_friend_of_the_mines: "Přítel dolů"
 AST_friend_of_the_mines_desc: "Po rozhovoru s naším přítelem z Newscorpu je jasné, že tlak na naše těžební korporace by mohl být o něco menší. Začneme změnou přístupu naší vlády k těžebním právům."
 AST_light_on_the_hill: "Světlo na kopci"
 AST_light_on_the_hill_desc: "Austrálie byla po desetiletí světlem demokracie v Tichomoří a nyní je skutečným světlem. Australané budou moci klidně spát s přístupem k dostupné a hojné elektřině, která vytopí a ochladí domovy po celé zemi. Bude to svědectví o úspěších naší vlády a pokroku, kterého jsme jako národ dosáhli."
 AST_acquire_enrichement: "Malé zelené kameny"
 AST_acquire_enrichement_desc: "Je ostudné, že toho tolik těžíme, a přesto nemáme žádná obohacovací zařízení, která by nám umožnila zdroj skutečně využít. Můžeme rychle dovézt a sestavit jedno od našich přátel ze Států a obejít několik doporučení, aby se zařízení včas rozběhlo."
 AST_convert_the_ansto_reactor: "Přestavět reaktor ANSTO"
 AST_convert_the_ansto_reactor_desc: "Zjevně už v Sydney reaktor máme. Jistě, nemusí jít o přesný model potřebný k výrobě energie, ale můžeme dát dohromady několik našich vědeckých hlav, aby zařízení připravily k výrobě. Koneckonců to není žádná raketová věda."
 AST_tweak_the_restrictions: "Už žádné brzdění"
 AST_tweak_the_restrictions_desc: "Zemi brání v bezemisní výrobě energie spousta věcí. Zejména zeleně zaměřené hlasy, které po celé zemi zřizují různé „zóny bez jaderné energie“. V rámci národní nouze musí tyto zóny ZMIZET."
 AST_first_stop_jakarta: "První zastávka: Jakarta"
 AST_first_stop_jakarta_desc: "Své funkční období můžeme zahájit vysláním silného poselství, že australská zahraniční politika zůstává regionální. Nemůžeme si dovolit potulovat se po Evropě, když národy zde potřebují naši pomoc více než kdy jindy. Méně Ženevy, více Jakarty."
 AST_sail_steady: "Plout klidně"
 AST_sail_steady_desc: "Naše ministryně zahraničí Julie Bishopová zdůraznila pro naše funkční období přístup „ekonomické diplomacie“ se zaměřením na pokračující programy pomoci a úsilí o volný obchod. Upřímně to není příliš odlišné od vlád před námi, ale když máte v rukou miliony životů, je nejlepší nerozhoupat loď."
 AST_the_anglosphere: "Anglosféra"
 AST_the_anglosphere_desc: "Austrálie má domorodé dědictví, britské základy a multikulturní charakter. Naše spojení s Angličany je proto blízké jako mezi bratry. Mluvíme stejným jazykem, milujeme ragby a bojujeme za stejné demokratické ideály. Naše společenství je posvátné a mělo by takové zůstat."
 AST_o_canada: "Ó, Kanado!"
 AST_o_canada_desc: "Naši bratři z Commonwealthu. Tak daleko, a přesto jsou naše vazby hluboké jako mezi dvěma starými přáteli. Neuškodilo by navázat kontakt a probrat investiční příležitost, kterou naši diplomaté připravili."
 AST_swell_the_support: "Rozšířit podporu"
 AST_swell_the_support_desc: "Není žádným tajemstvím, že nábor do obranných sil od devadesátých let klesá. Rozšíření podmínek způsobilosti, náborové kampaně a otevření obranných stáží jsou vhodným prvním krokem k obsazení povinných míst."
 AST_of_knights_and_dames: "Rytíři a dámy"
 AST_of_knights_and_dames_desc: "Titul „Rytíři a dámy Řádu Austrálie“ býval nejvyšším vyznamenáním za mimořádné služby zemi. Jak je u většiny vlád Labor obvyklé, titul byl za jejich vlády zrušen. Když jsme zpět, měli bychom obnovit část našeho dědictví, na kterou se nemělo zapomenout."
 AST_american_integration: "Americká integrace"
 AST_american_integration_desc: "Naši spojenci za Pacifikem již nějakou dobu navrhují společné cvičení. Samotné výhody možnosti prakticky využít naše nové vybavení by byly pro naše síly neocenitelné a mohly by nás udržet v užším kontaktu s USA."
 AST_square_kilometre_array: "Square Kilometre Array"
 AST_square_kilometre_array_desc: "V soutěži mezi námi a Novým Zélandem o účast na projektu jsme podle očekávání zvítězili. Společně s Jižní Afrikou a Spojeným královstvím se staneme součástí nejambicióznějších astronomických projektů našeho života. Naším úkolem je postavit více než 130 000 stromovitých antén na ploše 21 kilometrů. Teoreticky nám to umožní zkoumat oblohu více než 10 000krát rychleji než dnes. Je to velmi vyspělá technologie a vzrušující příležitost pro naše vědce v terénu."
 AST_joint_defense_tech: "Společné obranné technologie"
 AST_joint_defense_tech_desc: "Aliance Five Eyes se za posledních téměř 60 let stala jedním z našich nejsilnějších nástrojů v boji proti terorismu i při shromažďování zpravodajských informací. Zřízení výzkumné divize by bylo dost snadné a pomohlo by překlenout technologické rozdíly mezi námi."
 AST_the_submarine_corporation: "Ponorková korporace"
 AST_the_submarine_corporation_desc: "V našem úsilí podpořit flotilu novými ponorkami nám pomáhá ASC. Tato společnost je pro nás předním dodavatelem lodí od osmdesátých let a nedávno byla znárodněna. Nyní je k dispozici nám."
 AST_new_columbo_plan: "Nový Kolombův plán"
 AST_new_columbo_plan_desc: "Po druhé světové válce byl zaveden Kolombův plán na obnovu zničené Asie. Pomáhali jsme jí vysíláním technických odborníků a umožněním jejím studentům studovat u nás. Stejné principy můžeme uplatnit znovu a pomoci nové, rozvíjející se Asii tím, že jejím studentům umožníme studovat na našich univerzitách se zrychlenými vízy."
 AST_growing_demands: "Čelit výzvě"
 AST_growing_demands_desc: "Žádná vláda nemůže být ekonomicky odpovědná na úkor národní bezpečnosti. ADF musí být vždy v pozici, kdy dokáže reagovat na jakýkoli konflikt. Cokoli menšího nás dostane do nebezpečné situace."
 AST_visiting_the_rainbow_nation: "Duhový národ"
 AST_visiting_the_rainbow_nation_desc: "Naše dějiny s Jižní Afrikou jsou pestré a sahají až k podpoře jejích vojáků během druhé búrské války. V Austrálii žije téměř 200 000 jejích obyvatel a toto číslo stále roste, protože v poslední době výrazně přibylo žádostí uprchlíků. Jak napětí dále roste, sílí tlak, abychom zaujali stanovisko."
 AST_indonesian_intervention: "Zajistit souostroví"
 AST_indonesian_intervention_desc: "Situace v Indonésii se příliš dlouho nechávala zhoršovat. Ačkoli naše úsilí v roce 1999 bylo z velké části úspěšné, k potlačení hrozby islámského fundamentalismu bude nutné další zapojení v zemi."
 AST_an_oceanic_alliance: "Oceánská aliance"
 AST_an_oceanic_alliance_desc: "Záležitosti lidí v Tichomoří pociťujeme a řešíme my, kteří zde žijeme. Museli jsme se na sebe spoléhat častěji než ne a vypěstovali jsme si hlubokou jednotu."
 AST_aukus_abbott: "AUKUS"
 AST_aukus_abbott_desc: "Náš společný závazek k mezinárodnímu řádu založenému na pravidlech se Spojeným královstvím a Spojenými státy americkými je pevný jako máloco. V posledním století jsme prošli zákopy téměř každého velkého konfliktu. Prohloubení této spolupráce je proto nejlepší cestou k bezpečnějšímu světu."
 AST_the_greatest_statesman: "Největší státník"
 AST_the_greatest_statesman_desc: "Postavení Austrálie v Tichomoří bylo upevněno. Krásný národ už není pozorovatelem růstu Asie, ale aktivním účastníkem jejího vzestupu. Historici se ohlédnou a uvidí, že právě zde jsme zemi nasměrovali správným směrem."
 AST_the_asian_century: "Asijské století"
 AST_the_asian_century_desc: "Navzdory tomu, co mohou říkat kritici, neženeme se do Asie bez plánu. Stačí malý průzkum a uvidíme, že země severní Asie dosáhly během několika desetiletí hospodářské transformace, která nemá v lidských dějinách obdoby. Musíme těmto národům dát najevo, že Austrálie je otevřená podnikání a připravená získat svůj díl této proměny."
 AST_our_greatest_partner: "Náš nejbližší partner"
 AST_our_greatest_partner_desc: "Čína dokázala zázrak, když stovky milionů lidí pozvedla z chudoby do střední třídy. Stejně tak naše partnerství s ní stále rozkvétá v něco mnohem většího než s kterýmkoli jiným tichomořským národem. Navzdory těm ve vládě, kteří Austrálii nabádají, aby volila mezi ekonomickými a bezpečnostními zájmy, platí, že nové přátele nezískáte ztrátou starých a některá přátelství neposílíte oslabením jiných."
 AST_indian_investments: "Indické investice"
 AST_indian_investments_desc: "Několik indických korporací projevilo zájem rozšířit výrobu v zemi a otevřít provoz v Sydney. Současná omezení zahraničních společností tento proces zpomalila, ale přímé schválení od [GetASTLeaderTitle] by bylo vše, co potřebují k rychlému zahájení činnosti a vytvoření pracovních míst."
 AST_sanpou_yoshi: "Sanpo Yoshi"
 AST_sanpou_yoshi_desc: "Sanpo Yoshi je starý japonský termín, podle něhož musí každá transakce prospět prodávajícímu, kupujícímu i společnosti jako celku. Jakási „trojitá výhra“. Naše současné obchodní dohody s Japonci jsou všechno jiné než výhra. Existuje mezi námi vážná obchodní nerovnováha, která mezi naše národy vráží klín, dokud ji nenapravíme."
 AST_seoul_refineries: "Rafinérie v Soulu"
 AST_seoul_refineries_desc: "Od korejské války udržujeme s jihokorejskou vládou velmi úzké vojenské i ekonomické vztahy. Vzhledem k úspěchu její nové průmyslové základny v Soulu by uzavření dohody o rafinaci naší vlastní ropy jistě ušetřilo starosti s vlastní výrobou a vše by se rozběhlo mnohem dříve."
 AST_australian_exceptionalism: "Australská výjimečnost"
 AST_australian_exceptionalism_desc: "Tento národ se vyznačuje jedinečným souborem ctností. Nejde o božský mandát ani nezaslouženou vrozenou vlastnost, ale o dědictví generací před námi, které činily obtížná rozhodnutí a přinášely oběti, aby nás přivedly k novému úsvitu. Tato tradice musí pokračovat a Austrálie bude zachována za každou cenu."
 AST_stop_the_boats: "Zastavit lodě"
 AST_stop_the_boats_desc: "Množství nelegálních vstupů a utonutí způsobených převaděči lidí je největší krizí, jaké národ čelil za poslední roky. Náš specialista na ochranu hranic Scott Morrison navrhl vojensky pojatou operaci na ochranu našich břehů a odvrácení přílivu, s posílenými hlídkami a zrušením trvalých ochranných víz, aby odradil ty, kteří riskují předbíhání ve frontě."
 AST_raise_the_threat_level: "Zvýšit úroveň hrozby"
 AST_raise_the_threat_level_desc: "Hrozba terorismu se bohužel stala skutečností a mezi australskými občany a obyvateli jsou lidé, kteří by nám chtěli ublížit. Posílení bezpečnosti na letištích, základnách, ve vládních budovách a na velkých veřejných akcích bude nezbytné."
 AST_tighten_the_flow: "Utáhnout tok"
 AST_tighten_the_flow_desc: "Myšlenka multikulturní Austrálie možná neselhala, ale při současné úrovni je příliv jednoduše příliš vysoký na to, aby byl udržitelný. S ohledem na potřeby našich občanů je zpřísnění tohoto toku jediným dalším krokem."
 AST_prevention_measures: "Preventivní opatření"
 AST_prevention_measures_desc: "Při intervenci musí být u kormidla obratná ruka. Správný rozhodný úder může hrozbu zastavit v zárodku. Přinejmenším musíme mít možnost jednat, když je třeba, a tuto možnost udržet dostupnou ve chvíli, kdy ji nejvíce potřebujeme."
 AST_wielding_the_stick: "Třímat hůl"
 AST_wielding_the_stick_desc: "Ve spolupráci s jedním z největších a nejdůvěryhodnějších výrobců zbraní jsme zorganizovali výstavbu dvou nových výrobních závodů, které nám mají dodávat dnešní zbraně pro zítřejší bitvy. Šikovné heslo, já vím."
 AST_deployment_mandate: "Mandát k nasazení"
 AST_deployment_mandate_desc: "Naše rychlá mobilizace k bojové připravenosti byla doprovázena několika cíli, abychom se ujistili, že postupujeme správně. Jejich splnění nám poskytne důvěru potřebnou k ospravedlnění náhlého zvýšení výdajů a ukáže, čeho jsme skutečně schopni."
 AST_employ_reserves: "Nasadit zálohy"
 AST_employ_reserves_desc: "Primární povinností záloh našeho národa je pomáhat při přírodních katastrofách a domácích krizích. Vzhledem k tomu, že naše obrana je domácí krizí, nasadíme je do oblastí, které nepokrývá náš personál na plný úvazek, a uvolníme tak síly pro nasazení."
 AST_let_them_serve: "Nechat je sloužit"
 AST_let_them_serve_desc: "Současná náborová politika je pro naše plány rozšíření příliš restriktivní. Otevření programu obranným stážím a nabídka úlevy od dluhů uchazečům zvýší počet na požadovanou úroveň."
 AST_incorporate_them: "Začlenit je"
 AST_incorporate_them_desc: "Již máme rozsáhlý program zaměřený na zapojení příjemců sociální podpory do veřejných prací. Nyní je můžeme přesměrovat do vojenského průmyslu a část zátěže odebrat našim silám ADF."
 AST_a_shining_fleet: "Zářící flotila"
 AST_a_shining_fleet_desc: "Od konce studené války bylo naší námořní infrastruktuře dovoleno chátrat natolik, že se stala zranitelností naší obrany. Naše schopnost stavět lodě se prakticky rozplynula. Úsilí začne obnovením státních loděnic, které bude řídit nově organizovaná Australian Naval Infrastructure, a náš národ se brzy znovu vrátí na vlny."
 AST_assistance_from_langley: "Pomoc z Langley"
 AST_assistance_from_langley_desc: "Strýček Sam nám již dříve pomohl, a pokud ho požádáme, jistě nám ochotně podá pomocnou ruku v oblasti zpravodajství. Jak se říká, vědět znamená polovinu vítězství."
 AST_our_fight: "Náš boj"
 AST_our_fight_desc: "Cesta před námi je taková, kterou musíme ujít sami. Ne úplně sami, samozřejmě, ale musíme ukázat, že Austrálie má schopnost vyzbrojit se a bojovat ve vlastních bitvách. Koneckonců jsme národ lidí činu."
 AST_asian_partnership: "Asijské partnerství"
 AST_asian_partnership_desc: "Bez přátel jste jen polovinou toho, kým jste. Asijské země pro nás byly v průběhu let více než přáteli a zejména Japonsko stálo bok po boku s námi během našeho zbrojení. Dosud jsme s nimi připravovali dohodu o nákupu několika ponorek, které by posílily početní stav naší flotily, a je zásadní ji dokončit."
 AST_accelerate_the_timeline: "Urychlit časový plán"
 AST_accelerate_the_timeline_desc: "Jak se naše přípravné období chýlí ke konci, bude třeba urychlit poslední výrobní práce. Musíme naše… ehm, vejce uvařit o něco rychleji."
 AST_in_our_backyard: "Na našem dvorku"
 AST_in_our_backyard_desc: "Královské námořnictvo brázdí Indopacifik už přibližně století, od svého vzniku v roce 1911. Během dvou světových válek jsme se naučili neocenitelné lekce, včetně toho, jak promítat sílu přes tyto břehy. Tato zkušenost bude podrobena zkoušce v nadcházejících střetech."
 AST_counter_the_island_chain: "Čelit ostrovnímu řetězci"
 AST_counter_the_island_chain_desc: "Od čtyřicátých let Čína používá zastrašování a zabírání ostrovů k upevnění svých nároků v Jihočínském moři. Zatímco expanze byla v minulosti do určité míry zvládnutelná, její poslední úspěchy s umělými ostrovy hrozbu zesílily. Pokud se nepostavíme na odpor, dokud můžeme, vše na sever od nás by se mohlo stát dalším „Východočínským mořem“."
 AST_dealings_in_kuala_lumpur: "Jednání v Kuala Lumpuru"
 AST_dealings_in_kuala_lumpur_desc: "Obchod s nerosty mezi námi a Malajsií vzrostl natolik, že její diplomaté navázali kontakt s cílem projednat obchodní dohodu. Ta by mohla zefektivnit již nyní velmi výnosný tok zboží. Zároveň bychom mohli navrhnout podmínky dohody o neutralitě. Zabránili bychom jí tak zapojit se do rostoucí čínské sféry vlivu."
 AST_guadalcanal_garrison: "Posádka na Guadalcanalu"
 AST_guadalcanal_garrison_desc: "Po vypuknutí druhé světové války a následné invazi císařského Japonska na Šalamounovy ostrovy se Japonci pokusili využít ostrov jako odrazový můstek k útokům na naši zemi. Na těchto ostrovech probíhaly jedny z nejintenzivnějších bojů a nemůžeme riskovat, že podobné opěrné postavení znovu získá jiná země."
 AST_mutual_defense: "Vzájemná obrana"
 AST_mutual_defense_desc: "Nemůžeme hlídat Tichomoří sami a jedním z našich nejbližších spojenců od konce studené války, navzdory smíšené minulosti, je Japonsko. Způsob, jakým se přetvořilo, je třeba obdivovat. Budeme ho potřebovat pro nadcházející konflikt."
 AST_due_reparations: "Dlužné reparace"
 AST_due_reparations_desc: "Ačkoli je společná bezpečnost lákavá, získat to, co nám náleží za druhou světovou válku, je o něco důležitější. O život přišlo přes 27 000 Australanů, z toho více než 64 % při boji proti japonským silám, a během války jsme utratili téměř 3 miliardy liber. Nemluvě o bombardování Darwinu. Odškodnění musí být zaplaceno."
 AST_pukpuk_treaty: "Smlouva Pukpuk"
 AST_pukpuk_treaty_desc: "Už roky opatrně našlapujeme kolem myšlenky užší obranné spolupráce s Papuou-Novou Guineou. Spojení našich vojenských velení představuje účinnou příležitost čelit rostoucí čínské sféře vlivu a prosadit přímější vliv na našeho přátelského souseda."
 AST_the_indonesian_solution: "Převzít Indonésii"
 AST_the_indonesian_solution_desc: "Indonésie je již desetiletí trnem v našem boku a čas vyjednávání skončil. Bude nutná přímá správa. V regionu obnovíme pořádek."
 AST_island_leasing: "Pronájem ostrovů"
 AST_island_leasing_desc: "Ostrovy Nové Kaledonie leží ve strategicky klíčové pozici na našem severovýchodním křídle. Možnost umístit tam naše vojáky by nám umožnila vytvořit jakousi železnou zeď kolem celého Korálového moře. Naštěstí jsme v pozici, kdy bychom mohli od našich francouzských přátel pronajmout práva na základny na těchto ostrovech."
 AST_the_middle_power: "Střední mocnost"
 AST_the_middle_power_desc: "Získání Jižní Koreje na naši stranu by v Číně vytvořilo takzvanou Achillovu patu. Nůž přímo v břiše, pokud by mezi námi vypukl konflikt, a příležitost je příliš dobrá na to, abychom ji nevyužili."
 AST_fuel_the_grudge: "Přiživit zášť"
 AST_fuel_the_grudge_desc: "Poslední dílek na šachovnici. Jakmile překročíme práh, nebude návratu. Naše politika se bude muset odklonit od Číny směrem k Tchaj-wanu. Pokud ho získáme na svou stranu, vše ostatní by mělo zapadnout na své místo."
 AST_shirt_front_the_dragon: "Postavit se drakovi"
 AST_shirt_front_the_dragon_desc: "Čínská flotila se již několik týdnů snaží silou vytlačit Filipíny ze sporného atolu Scarborough Shoal. Stejně jako u většiny tyranů, pokud Filipíny podpoříme vlastními loděmi a kolem ostrova zřídíme perimetr, čínská chvástavost rychle opadne."
 AST_the_canberra_treaty: "Canberrská smlouva"
 AST_the_canberra_treaty_desc: "Válce se podařilo zabránit a Drakovi bylo ukázáno, že země Tichomoří se nenechají zastrašovat."
 AST_the_lottery_draft: "Losovaný odvod"
 AST_the_lottery_draft_desc: "Když jsme naposledy zavedli národní službu, nebyl tento krok příliš populární. Přesto potřebujeme více připravených sil, pokud chceme z této války vyjít vítězně. „Los narozenin“ se musí vrátit."
 AST_stock_up: "Udělat zásoby"
 AST_stock_up_desc: "Naše námořnictvo nemůže být všude. Dojde k nedostatku a můžeme se jen modlit, že do té doby budeme mít ve skladech dostatek kriticky důležitého zboží."
 AST_border_commanders: "Velitelé hranic"
 AST_border_commanders_desc: "Technicky vzato naše země nemá pobřežní stráž. Námořní pohraniční velitelství obvykle zajišťuje ochranu hranic bez samostatné síly, zpravidla pomocí kombinace jednotek ADF a RANPF. Můžeme to napravit začleněním zbývajících záloh do vlastní bojové síly, jejímž úkolem bude chránit naše břehy před jakoukoli hrozbou."
 AST_remember_the_squander_bug: "Pamatovat na plýtvajícího brouka"
 AST_remember_the_squander_bug_desc: "Rozmařilé výdaje v době, kdy národ čelí největší finanční výzvě od druhé světové války, se rovnají vlastizradě. Můžeme znovu využít starou klasiku k zesměšnění našich rozhazovačných občanů, aby během konfliktu neutráceli příliš, a mezitím prodávat válečné dluhopisy."
 AST_secure_a_landing: "Zajistit vylodění"
 AST_secure_a_landing_desc: "Vzhledem k našemu odlišnému geografickému postavení proběhne každá invaze po moři. Budeme muset zabavit poměrně mnoho soukromých lodí, abychom splnili logistické požadavky úkolu, a posílit naše znalosti obojživelných operací."
 AST_all_in: "Všechno do toho"
 AST_all_in_desc: "Průmysl našeho národa musí být plně zasvěcen současné hrozbě. Bude vyhlášen stav totální války. Některé svobody mohou být dočasně pozastaveny, ale potřeby státu a armády musí být upřednostněny."
 canberra_treaty_idea: "Canberrská smlouva"
 AST_the_rudd_government: "Ruddova vláda" # todo: NEW TRANSLATION
 AST_the_rudd_government_desc: "Austrálie pohlédla do budoucnosti. Lidé rozhodli, že jako národ půjdeme vpřed – budeme plánovat budoucnost a společně ji přijmeme. Sjednoceni při psaní nové stránky dějin země učiníme tuto naši velikou zemi ještě větší. \n\nTéto posvátné důvěry nesmíme zneužít. \n\nZlepšení vzdělávacího systému už dávno nemělo být odkládáno. Kapacita našich veřejných nemocnic a sociální péče zoufale potřebuje pozornost. Naše infrastruktura neodpovídá tomu, co vyžaduje 21. století, a nedostatek iniciativy při řešení klimatické krize nás vrátil o desetiletí zpět. Nepřicházíme jako zastánci status quo, ale jako nástroj obyčejných lidí. Řešení těchto oblastí a větších hrozeb, kterým tato země čelí, je teprve začátek. \n\nNaše politika musí být v kontaktu s Australany a s jejich potřebami. Na naší schopnosti vést národ do nové dekády toho záleží opravdu mnoho." # todo: NEW TRANSLATION
 AST_mend_the_rift: "Zacelit rozkol" # todo: NEW TRANSLATION
 AST_mend_the_rift_desc: "Zanedbávání koaliční vlády dovolilo těm, kteří balancovali nad trhlinami společnosti, propadnout skrz. Znevýhodnění, marginalizovaní; jak byli odstrkováni, trhliny se také zvětšovaly. Cestu ke sjednocení Australanů můžeme zahájit návštěvou nejhůře zasažených oblastí. Odlehlých komunit čelících nejhorší bytové krizi, komunit bez domova, strádajících farmářů a dělníků. Když posvítíme na jejich situaci, můžeme jim ukázat, že vládě na nich záleží a že změna přichází." # todo: NEW TRANSLATION
 AST_heal_the_people: "Uzdravit lid" # todo: NEW TRANSLATION
 AST_heal_the_people_desc: "Naše veřejné zdravotnictví je právě teď v naprostém chaosu. Čekací lhůty odsouvají lidi potřebující život zachraňující operaci až o rok a pohotovosti jsou přetížené natolik, že se někteří pacienti ani nedostanou na operační sál. Naléhavým přijetím národních standardů můžeme okamžitě rozšířit požadavky na kapacitu veřejných nemocnic a zvýšit minimální počet personálu v celé zemi." # todo: NEW TRANSLATION
 AST_unite_the_country: "Sjednotit zemi" # todo: NEW TRANSLATION
 AST_unite_the_country_desc: "Nyní je naším úkolem řídit loď, a pokud nedokážeme udržet všechny na palubě, neděláme to dobře. Mezi Australany stále existuje propast, která nám brání být jednotní, a odmítání uznat minulost nám brání přijmout budoucnost. Chceme-li dosáhnout obojího, musíme prozkoumat nerovnost, která se v této zemi po staletí stala nezlomnou zhoubou. Možná ji nedokážeme zcela rozebrat, ale můžeme se o to pokusit." # todo: NEW TRANSLATION
 AST_economic_revolution: "Ekonomická revoluce" # todo: NEW TRANSLATION
 AST_economic_revolution_desc: "K rozpoznání toho, že velký neoliberální experiment posledních 30 let selhal, není potřeba mnoho. Fundamentalismus volného trhu, který vytvořil, se ukázal být jen osobní chamtivostí převlečenou za ekonomickou filozofii. Ironií je, že nyní připadá sociálním demokratům úkol zabránit této formě kapitalismu, aby sama sebe sežrala. \n\nMusíme vytvořit nový systém sociálního kapitalismu odpovědný lidem, který vyváží soukromé pobídky s veřejnou odpovědností. Díky regulaci a větším základním sociálním jistotám můžeme dosáhnout silnější ekonomiky sloužící národu." # todo: NEW TRANSLATION
 AST_a_voice_for_all_australians: "Hlas pro všechny Australany" # todo: NEW TRANSLATION
 AST_a_voice_for_all_australians_desc: "Nebyli jsme zvoleni proto, abychom prosazovali vlažné reformy. Ať strana půjde kamkoli, bude ji následovat, a pokud ne, najdeme způsob, jak ji přivést do latě. Skutečným bojištěm bude Senát, kde nemáme většinu. K prosazení čehokoli budeme potřebovat posílit počty hlasy opozičních stran a nezávislých. \n\nKdyž zatřeseme stromem dostatečně silně a své plány správně prodáme, několik hlasů by mohlo spadnout do našeho košíku a konečně bychom mohli prosadit něco smysluplného." # todo: NEW TRANSLATION
 AST_work_with_the_party: "Spolupracovat se stranou" # todo: NEW TRANSLATION
 AST_work_with_the_party_desc: "Labouristická strana znovu a znovu prokázala, že je nejlepší nadějí Austrálie. Díky moudrému vedení a prověřené morální empatii pokračujeme v trendu přijímání zákonů, které prospívají nejen lidem tohoto národa, ale i těm, kteří přijdou po nás. \n\nMoudrý vůdce také ví, kdy naslouchat své straně. Bez jednotné strany naše reformy neprosadíme a cesta k přijetí politiky je nyní příliš úzká na to, abychom si mohli dovolit neopatrnost. Předkládání rozumné politiky je jediný způsob, jak ji dostat přes Poslaneckou sněmovnu i Senát." # todo: NEW TRANSLATION
 AST_form_the_pact: "Uzavřít pakt" # todo: NEW TRANSLATION
 AST_form_the_pact_desc: "Chceme-li prosadit některé z našich radikálnějších návrhů, budeme muset oslovit Zelené. Jsou to přehnaně optimističtí hippies parlamentu. Schůzka s jejich vůdcem Bobem Brownem by mohla stačit ke sjednocení všech, i když bychom tím zcela odcizili podporu Liberální strany a možná ztratili i některé vlastní členy. \n\nPřesto budeme jejich pomoc k překročení cílové čáry potřebovat." # todo: NEW TRANSLATION
 AST_something_has_to_give: "Něco musí povolit" # todo: NEW TRANSLATION
 AST_something_has_to_give_desc: "Pod dřevěnými prkny naší společnosti se šíří hniloba. Navzdory veškerému pokroku a sociálnímu úsilí může za dost špatných okolností v Austrálii propadnout každý – a mnozí také propadají. Samozřejmě existují sociální záchranné sítě, ale když jsou naše sociální dávky pod hranicí chudoby a dokonce i staří lidé jsou nuceni hledat zaměstnání, aby nehladověli, něco musí povolit. \n\nNaše systémy podpory jsou rozbité a mnozí v naší zemi to už pociťují. Nemůžeme jen přihlížet a dovolit, aby se situace dál zhoršovala." # todo: NEW TRANSLATION
 AST_meet_with_the_unions: "Setkat se s odbory" # todo: NEW TRANSLATION
 AST_meet_with_the_unions_desc: "Chceme-li s reformami pokročit, nejlepším místem, kde začít, jsou odbory. Labouristická strana byla koneckonců založena odborovými svazy a právě ony jsou našimi největšími podporovateli. \n\nUrčitě nám to pomůže navázat kontakt s pracujícími a ukázat, že jsme otevřeni spolupráci." # todo: NEW TRANSLATION
 AST_earnest_cheques_for_the_needy: "Poctivé šeky pro potřebné" # todo: NEW TRANSLATION
 AST_earnest_cheques_for_the_needy_desc: "Těm, kdo žijí na hranici chudoby, může jediná nehoda nebo nečekaný účet podrazit nohy. Součástí naší podpory veřejnosti bude několik jednorázových přímých peněžních bonusů, které pomohou zlepšit jejich rozpočet a ochrání zranitelné před náhlým finančním úpadkem." # todo: NEW TRANSLATION
 AST_new_consensus: "Nový konsenzus" # todo: NEW TRANSLATION
 AST_new_consensus_desc: "Washingtonský konsenzus je od 80. let standardním receptem pro ekonomiky. Nyní, s nástupem nových globalizovaných ekonomik, které tento konsenzus zpochybňují, musí svůj vlastní konsenzus najít i Austrálie. Nebude tak volnomyšlenkářský jako ve Washingtonu ani tak autoritářský jako v Pekingu; náš zásah bude vyvážený a obratný." # todo: NEW TRANSLATION
 AST_insulate_the_homes: "Zateplit domy" # todo: NEW TRANSLATION
 AST_insulate_the_homes_desc: "Je ostudné, že každou noc spí tisíce australských rodin v chladu. Naše odhady hovoří o přibližně 40 % nezateplených domů, což vede k vyšším účtům za elektřinu vynakládanou na vytápění pro ty, kteří si je mohou dovolit, a tím spíš pro ty, kteří nemohou. Po celé zemi zavedeme program, který pokryje náklady, jimž mohou vlastníci domů při instalaci izolace čelit." # todo: NEW TRANSLATION
 AST_fair_shake_of_the_sauce_bottle: "Spravedlivý podíl" # todo: NEW TRANSLATION
 AST_fair_shake_of_the_sauce_bottle_desc: "Největším problémem, kterému každý pár čelí při rozhodování o dítěti, jsou finanční omezení. Vzít si volno potřebné k péči o dítě v jeho nejdůležitějších letech je něco, o čem může jen málokdo vůbec uvažovat, zvláště v současné, měnící se ekonomice. Jelikož je naší odpovědností pečovat o Australany, měli bychom je podporovat, jak jen můžeme. \n\nKaždý rodič v Austrálii, včetně těch adoptivních, bude mít nárok na 26 týdnů placené rodičovské dovolené. Každý, kdo se chce stát rodičem, dostane spravedlivou šanci, protože toto je vláda spravedlnosti." # todo: NEW TRANSLATION
 AST_housing_initiative: "Postavit domy" # todo: NEW TRANSLATION
 AST_housing_initiative_desc: "Dosáhli jsme dohody se soukromými dodavateli, kteří nám během příštích 10 let pomohou postavit více než 20 000 nových jednotek sociálního bydlení a opravit přibližně 12 000 neobyvatelných nemovitostí po celé Austrálii. Jen v prvním roce tak získají střechu nad hlavou tisíce lidí trpících bezdomovectvím." # todo: NEW TRANSLATION
 AST_the_care_act: "Novela sociálního zabezpečení" # todo: NEW TRANSLATION
 AST_the_care_act_desc: "Po dlouhých jednáních se stranou i s Liberály se nám podařilo uzavřít naši sociální legislativu. Centrelink, po přepracování pravidel nároku a programů pro pracující, bude dostupný téměř milionu dalších Australanů. Důchodci zaznamenají výrazné zvýšení dávek, zatímco změnu vyvážíme zvýšením věku nároku a zpřísněním Medicare, abychom uklidnili opozici. Přibudou stovky stipendií a zvýší se invalidní dávky. \n\nStále více Australanů bude žít snadněji, protože vláda bude stát za nimi." # todo: NEW TRANSLATION
 AST_shelter_for_all: "Střecha pro všechny" # todo: NEW TRANSLATION
 AST_shelter_for_all_desc: "Pokud naše současné investice do země nebyly dostatečné, plány na řešení bezdomovectví přivedly rozpočtové jestřáby k hysterii. Původní plán 20 000 jednotek sociálního bydlení na 10 let jsme zrušili a nahradili jej 100 000 jednotkami ve stejném období. První z nich, postavené během příštího roku, půjdou přímo těm nejohroženějším. \n\nDokonce i ti nejprogresivnější členové strany označují plán za odvážný a někteří dokonce za nemožný. Aby byl uskutečnitelný, bude muset být pro počáteční fázi využita většina našich stavebních kapacit." # todo: NEW TRANSLATION
 AST_root_and_branch_approach: "Přístup od kořenů" # todo: NEW TRANSLATION
 AST_root_and_branch_approach_desc: "Mnohé z našich rozsáhlejších reforem lze popsat jako změny „od kořenů“, kdy přístup k reformě něčeho, jako je zdravotnictví nebo bydlení, musí začít u základů. To znamená zavádět nezávislé kontroly nebo zcela přepracovat proces, aby pomáhal mnohem většímu počtu Australanů a fungoval efektivněji. Naše plány na přestavbu systému sociálního zabezpečení vyšly dráž, než si nyní můžeme dovolit, což nám zanechává značný deficit. \n\nAčkoli bychom rádi uspokojili všechny, financování musí přijít odněkud." # todo: NEW TRANSLATION
 AST_a_stronger_net: "Silnější záchranná síť" # todo: NEW TRANSLATION
 AST_a_stronger_net_desc: "S přispěním Zelených jsme sestavili možná nejrozsáhlejší sociální legislativu, jakou kdy země viděla. Rozsáhlá reforma současné kapacity a podmínek sociálního zabezpečení, masivní programy zaměřené na miliony lidí v chudobě a zvýšení dávek na důstojnou úroveň, spolu se zvýšením minimální mzdy ve veřejném sektoru. Nepochybně to otřese průmyslem a možná půjde o nejbližší ekvivalent univerzálního základního příjmu, jaký může země naší velikosti mít. Pokud však chceme uskutečnit společenskou změnu, která přežije naši generaci, pak je to právě ono. \n\nPřijdeme o některé rozpočtové jestřáby ve straně, ale za to, čeho jsme dosáhli, to bude stát." # todo: NEW TRANSLATION
 AST_bill_of_rights: "Naše listina práv" # todo: NEW TRANSLATION
 AST_bill_of_rights_desc: "Po volbách řada hlasů vyjádřila přání po „listině práv“, která by zásadně zaměřila naši vládu na práva občanů. Nyní máme příležitost navrhnout zákon Commonwealthu, který by přesně toto uskutečnil. Zavedeme ochranná práva, změny soudního systému a pravomocí úřadů a předložíme parlamentu chartu s odpovědností, kterou vůči Australanům máme: zachovat jejich rovnost, svobodu a bezpečí. Zkrátka úplně všechno." # todo: NEW TRANSLATION
 AST_the_social_contract: "Společenská smlouva" # todo: NEW TRANSLATION
 AST_the_social_contract_desc: "Systémy péče a podpory se zmenšily a zchátraly natolik, že rostoucí počet lidí bez prostředků se stal většinou. Nic nedokládá svobodu Australanů lépe než skutečnost, že systém, který je znovu a znovu zklamal, je odkázal na závislost na státu i v těch nejzákladnějších potřebách. Jinde tentýž systém zanedbal ty, kteří péči potřebují. \n\nNyní je naší odpovědností věci změnit. Opomíjeným a znevýhodněným se budeme věnovat. Tento systém nemůže pokračovat." # todo: NEW TRANSLATION
 AST_a_national_congress: "Národní kongres" # todo: NEW TRANSLATION
 AST_a_national_congress_desc: "Ačkoli ATSIC představoval krok ke sjednocenému pokroku, někde na cestě ztratil směr a jeho účel skutečného zastoupení se nikdy plně nenaplnil. Ve spolupráci s Australskou komisí pro lidská práva můžeme zorganizovat nový Národní kongres prvních národů Austrálie, který jej nahradí. Umožní nám aktivněji spolupracovat s domorodými Australany na zavádění politik zaměřených na rovnost a proaktivní změnu." # todo: NEW TRANSLATION
 AST_visit_the_schools: "Navštívit školy" # todo: NEW TRANSLATION
 AST_visit_the_schools_desc: "Stejně jako naše ekonomická revoluce bude zapotřebí reforma školství shora dolů. Už jsme vypracovali plány na rozsáhlé investice do obnovy a výstavby nových odborných škol a můžeme začít návštěvou některých místních škol v Queenslandu, abychom získali představu o situaci přímo v terénu." # todo: NEW TRANSLATION
 AST_digital_education: "Digitální vzdělávání" # todo: NEW TRANSLATION
 AST_digital_education_desc: "Průlom v podobě internetu je pro Australany, a zejména pro naši mládež, něco obdivuhodného. Pokud se děti od útlého věku naučí internet lépe využívat, bude naše příští generace vybavena k zvládnutí nového digitálního prostoru a k vyhnutí se nebezpečím, která může přinášet. Instalace řady počítačů do učeben spolu s dalšími rekonstrukcemi nás připraví na moderní éru." # todo: NEW TRANSLATION
 AST_a_national_agreement: "Národní dohoda" # todo: NEW TRANSLATION
 AST_a_national_agreement_desc: "Řada opozičních členů je ochotna spolupracovat s námi na politice vůči domorodým obyvatelům. Pokud je přesvědčíme, aby tyto problémy vnímali jako krizi, kterou skutečně jsou, můžeme návrhy prosadit jako nouzová opatření. Rychle zavedeme programy zaměřené na chronické nemoci, gramotnost a dostupnost základní péče v odlehlých oblastech." # todo: NEW TRANSLATION
 AST_state_health_reform: "Reforma státního zdravotnictví" # todo: NEW TRANSLATION
 AST_state_health_reform_desc: "Veřejné nemocnice obvykle spravují místní státy z vlastních rozpočtů. V poslední době však buď polevily, nebo čelí vážným problémům s financováním, protože současná péče zdaleka nestačí. Jediným způsobem, jak zvládnout reformu financování, bude převzít správu financování nemocnic a ponechat obecný provoz v místních rukou.  \n\nMůžeme provést vlastní kontroly a zjistit, které oblasti je třeba zlepšit, a podle toho postupovat. Pokud budou protestovat, budeme jim muset pohrozit ústavním referendem, které dá federální vládě plnou kontrolu nad veřejnými nemocnicemi. Pak uvidíme, zda budou stále štěkat. \n\nTentokrát odpovědnost spočívá na nás." # todo: NEW TRANSLATION
 AST_equal_opportunity: "Rovné příležitosti" # todo: NEW TRANSLATION
 AST_equal_opportunity_desc: "Nemáme právo stát v cestě požadavku na rovná manželská práva. I když sami nejsme jejich zastánci, můžeme otázku předložit v referendu a zjistit, jak se na ni veřejnost dívá. Pokud projde a opozice bude stále proti nám, můžeme toho využít v příštích volbách." # todo: NEW TRANSLATION
 AST_respect_traditional_values: "Respektovat tradiční hodnoty" # todo: NEW TRANSLATION
 AST_respect_traditional_values_desc: "Spravedlivá vláda má povinnost naslouchat potřebám většiny a zároveň respektovat živobytí menšiny. Austrálie vzkvétala díky uvážlivému a opatrnému vedení. Nebudeme nikoho nutit péct dort proti jeho náboženskému přesvědčení ani rozdmýchávat kulturní války. Je čas na změnu ustoupit o krok zpět." # todo: NEW TRANSLATION
 AST_clean_feed: "Čistý obsah" # todo: NEW TRANSLATION
 AST_clean_feed_desc: "Ani s našimi programy digitálního vzdělávání nedokážeme zabránit tomu, aby nejhorší stránky internetu působily na mládež. Už nyní online šikana a kyberkriminalita ohrožují samotnou strukturu australského života. Poskytovatelům internetových služeb předáme seznam nejhorších pachatelů online, což od nich bude vyžadovat" # todo: NEW TRANSLATION
 AST_close_the_gap: "Uzavřít propast" # todo: NEW TRANSLATION
 AST_close_the_gap_desc: "Naší hlavní a dlouhodobou politikou v otázkách domorodého obyvatelstva bylo uzavření propasti v očekávané délce života, vzdělávacích výsledcích a ekonomických příležitostech. Očekávaná délka života domorodých Australanů je v průměru téměř o 10 let kratší než u ostatních občanů. Míra gramotnosti je také výrazně nižší a dětská úmrtnost dvojnásobná. \n\nChápete pointu. Musíme předložit legislativu zahrnující širokou škálu programů věnovaných této věci a stanovit konkrétní cíle pro zlepšení života našich prvních národů." # todo: NEW TRANSLATION
 AST_tackle_the_mining_oligarchy: "Postavit se těžební oligarchii" # todo: NEW TRANSLATION
 AST_tackle_the_mining_oligarchy_desc: "Zhoubné síly, které ovlivňovaly naši vládu, tak činí dodnes díky bohatství, jež odčerpaly z naší půdy. Po staletí hromadily jmění a odmítaly se o něj dělit, zatímco dělníci, které zaměstnávaly, byli placeni příliš málo a příliš snadno odhazováni. Je nejvyšší čas, aby zaplatily svůj díl a aby australský lid dostal odměnu za rudu, která vychází z jeho země." # todo: NEW TRANSLATION
 AST_draft_the_legislation: "Navrhnout legislativu" # todo: NEW TRANSLATION
 AST_draft_the_legislation_desc: "Vzhledem k rozsahu toho, čeho se snažíme dosáhnout, budeme muset navrhnout dokonalý daňový zákon, prostý jakýchkoli mezer, a zapojit všechny odborníky, kteří mohou přispět. Pokud se do toho pustíme, uděláme to správně." # todo: NEW TRANSLATION
 AST_tax_the_super_profits: "Zdanit nadměrné zisky" # todo: NEW TRANSLATION
 AST_tax_the_super_profits_desc: "Mnoho pozdních nocí strávených v parlamentu nám přineslo účinnou zbraň proti velkým korporacím. Dynamická daňová sazba zaměřená na největší společnosti a zdaňující pouze „nadměrné zisky“ dosažené tehdy, když firma výrazně překročí svůj běžný příjem, konečně přivede část výdělků z těžebního boomu dolů k lidem. Měla by také zabránit označení za nespravedlivé zdanění, protože daň bude nulová, pokud společnost nesplní očekávání nebo její provozní náklady převýší výnosy." # todo: NEW TRANSLATION
 AST_throw_businesses_a_bone: "Hodit firmám kost" # todo: NEW TRANSLATION
 AST_throw_businesses_a_bone_desc: "Regulace mezi našimi vlastními státy je přinejmenším přehnaná. Stojí velké i malé podniky značné prostředky a zpomaluje obchod, což pouze zvyšuje místní ceny zboží. Chceme-li průmyslu hodit kost a ukázat, že nám nejde jen o to dostat je, můžeme spolupracovat s obchodní radou na vytvoření plynulé národní ekonomiky. Takové, která omezí horu byrokracie výměnou za snadnější cestování a větší tok zboží." # todo: NEW TRANSLATION
 AST_tear_off_special_interests: "Odstranit zvláštní zájmy" # todo: NEW TRANSLATION
 AST_tear_off_special_interests_desc: "Zájmové skupiny se staly zhoubnou součástí našeho politického systému a měly být řešeny už dávno. Mají nespravedlivý vliv na volební cyklus i politický proces. Za druhou stranu u stolu mluvit nemůžeme, ale vyšetřením vlastní strany kvůli nespravedlivému vlivu bychom mohli některá chapadla uvolnit. Možná se jich nezbavíme navždy, ale jejich odstranění bude v budoucnu snazší." # todo: NEW TRANSLATION
 AST_own_our_resources: "Vlastnit naše zdroje" # todo: NEW TRANSLATION
 AST_own_our_resources_desc: "Jednou z největších chyb vlád bylo umožnit zahraniční vlastnictví našich zdrojů, aniž bychom v nich sami měli podíl. Je pravda, že jsme z jejich pokračujícího růstu dobře profitovali a globální ekonomika má svůj důvod k úspěchu, ale nesmíme zanedbávat zájmy vlastního národa. \n\nOd těžebních společností již dostáváme licenční poplatky za těžbu naší půdy. Pokud zvýšíme cenu, mohou krátkodobě protestovat, ale nakonec usednou k jednacímu stolu a my budeme moci lépe vyjednat, jak se s nerosty naší země naloží." # todo: NEW TRANSLATION
 AST_spirit_of_gough: "Goughův duch" # todo: NEW TRANSLATION
 AST_spirit_of_gough_desc: "Tragický příběh Gougha Whitlama patří do učebnic dějepisu. Muž s příliš velkými ambicemi, kterého srazily síly kolem něj. Navzdory krátkému působení zazářil jako velký revolucionář progresivní politiky a zničil ho teprve jeho pokus o omezení rostoucí kontroly těžebního průmyslu. \n\nMožná už je pozdě na zavedení takového rozsahu vlastnictví, jaký plánoval, ale stále mu můžeme udělat čest. Vytvořením první vládou řízené těžební společnosti můžeme obejít korporace, těžit rudu z vlastních dolů a ponechat si všechny zisky i odměny." # todo: NEW TRANSLATION
 ast_spirit_of_gough_tt: "Vytvoří §0Úřad pro ropu a nerostné suroviny.§!" # todo: NEW TRANSLATION
 AST_twenty_twenty_summit: "Summit 2020" # todo: NEW TRANSLATION
 AST_twenty_twenty_summit_desc: "Summit 2020 byl základem aktivnějšího přístupu naší vlády k řízení země. Otevřené demokratické fórum pozvalo 1 000 komunitních vůdců, odborníků a občanů k hledání strategie pro budoucnost národa. Australany utvářená vlastní budoucnost je skvělým způsobem, jak zahájit naše funkční období, a ukazuje, že jsme odhodláni ke změně." # todo: NEW TRANSLATION
 AST_kyoto_accords: "Kjótský závazek" # todo: NEW TRANSLATION
 AST_kyoto_accords_desc: "Ratifikace Kjótského protokolu je teprve začátek. Chceme-li naplnit jeho potenciál, budeme muset pokračovat dále. Nenecháme žádný kus uhlí neobrácený." # todo: NEW TRANSLATION
 AST_big_australia: "Velká Austrálie" # todo: NEW TRANSLATION
 AST_big_australia_desc: "Tento koncept vznikl během summitu 2020. Naše menší populace byla jednou z mála věcí, které nás brzdily na cestě mezi velmoci. Právě teď můžeme mít jen omezený počet dětí. Nový plán zahrnuje kroky k dosažení 36 milionů obyvatel do roku 2050, především zvýšením příjmu v rámci našeho migračního systému. Všechno je třeba zefektivnit." # todo: NEW TRANSLATION
 AST_seasonal_labour_scheme: "Program sezónních pracovníků" # todo: NEW TRANSLATION
 AST_seasonal_labour_scheme_desc: "Svazující omezení způsobená menší populací lze krátkodobě zmírnit přílivem dovážené pracovní síly. Rozšíření omezení tak, aby do našich průmyslových odvětví proudilo více zahraničních pracovníků, je mezitím udrží v růstu a oddálí úbytek, který bychom mohli později očekávat." # todo: NEW TRANSLATION
 AST_our_sibling_state: "Náš sesterský stát" # todo: NEW TRANSLATION
 AST_our_sibling_state_desc: "Málokdo by dokázal změřit intenzivní rivalitu mezi námi a zemí s menším počtem obyvatel než Sydney. Ať už jde o sport nebo cokoli jiného, pokud se dostanou na vrchol, nikdy to neuslyšíte naposledy. Naše ekonomiky jsou už poměrně propojené, ale pracujeme na obchodní dohodě, která by naše národy finančně účinně spojila. Pokud bude úspěšná, obchod a investice mezi námi potečou jako voda." # todo: NEW TRANSLATION
 AST_pacific_islands_forum: "Fórum tichomořských ostrovů" # todo: NEW TRANSLATION
 AST_pacific_islands_forum_desc: "Každých několik let se náš národ, Nový Zéland a ostrovní státy scházejí, aby projednaly regionální zájmy a řešily výzvy, kterým čelí. Je to účinný způsob, jak udržovat přehled o našich oceánských sousedech. Letos jsou hlavním bodem programu pracovní povolení a několik národů diskutovalo o dočasných povoleních pro společný rozvoj zahradnictví. Ať už se rozhodneme je přijmout, nebo ne, plán má jistě své přednosti." # todo: NEW TRANSLATION
 AST_end_the_imperialism: "Ukončit imperialismus" # todo: NEW TRANSLATION
 AST_end_the_imperialism_desc: "Možná nám sezení v nejvyšším křesle národa poskytlo určitý nadhled. V zakořeněném prostředí, které vytvořili naši předchůdci, máme někdy skutečně na výběr. Buď budeme pokračovat v nepotřebném vměšování a škodění po celém světě, nebo se stáhneme a budeme respektovat hranice, které kolem nás vyrostly." # todo: NEW TRANSLATION
 AST_maintain_obligations: "Dodržet závazky" # todo: NEW TRANSLATION
 AST_maintain_obligations_desc: "Neseme určitou míru odpovědnosti za vlády, které tu byly před námi, a za zájmy, které vytvořily v Tichomoří i mimo něj. Když naše politika, jak se často stává, ovlivňuje životy milionů, musíme postupovat citlivě. Rozbít naše vztahy hned na začátku by pro nás skončilo špatně. Nejlepší bude zachovat, co máme, a tam, kde to půjde, to zlepšit." # todo: NEW TRANSLATION
 AST_the_free_trade_area: "Zóna volného obchodu" # todo: NEW TRANSLATION
 AST_the_free_trade_area_desc: "Měsíce vyjednávání se státy ASEAN nám přinesly neuvěřitelně výnosnou příležitost. Přestože naše země ani Nový Zéland nesplňují podmínky pro vstup do obchodního bloku, můžeme získat některé jeho výhody tím, že se staneme vnějšími „partnery“ a v podstatě vytvoříme zónu volného obchodu mezi námi a Asií." # todo: NEW TRANSLATION
 AST_the_beginning_of_something_new: "Začátek něčeho nového" # todo: NEW TRANSLATION
 AST_the_beginning_of_something_new_desc: "Ačkoli pakt ASEAN v posledních desetiletích dobře sjednocoval asijské státy, tři největší ekonomiky Tichomoří zůstávají jen volně propojené. Japonsko, Indie a Čína možná mají vlastní dohody, ale ty blednou ve srovnání s unií vytvořenou v Evropě. \n\nPokud bychom tyto země, včetně té naší, dokázali spojit do společné ekonomické unie, finanční prosperita by byla teprve začátkem. Mír v Tichomoří by byl dosažen pouhou jednotnou měnou." # todo: NEW TRANSLATION
 AST_address_the_tiger: "Promluvit k tygrovi" # todo: NEW TRANSLATION
 AST_address_the_tiger_desc: "Vztahy s Indií nyní probíhají hladce. Někteří by dokonce řekli, že skvěle. Neměli bychom se snažit zničit něco dobrého, ale kdo říká, že to nemůžeme zlepšit? Jejich vztahy s Čínou jsou jednou z největších překážek, jimž bychom při vytváření unie čelili. Pokud se nám podaří dosáhnout průlomu, zbytek práce bude snadný." # todo: NEW TRANSLATION
 AST_an_asian_pacific_union: "Asijsko-pacifická unie" # todo: NEW TRANSLATION
 AST_an_asian_pacific_union_desc: "Každý dílek musí být na dokonalém místě, chceme-li uskutečnit to, o co se pokoušíme. Jak daleko můžeme zajít a jak výraznou stopu zanecháme v geopolitických dějinách, to určí tato jednání. Naše práce se konečně vyplatí." # todo: NEW TRANSLATION
 AST_renegotiate_with_papua: "Vyřešit krizi lodí" # todo: NEW TRANSLATION
 AST_renegotiate_with_papua_desc: "Každý rok přistávají na našich březích tisíce neregistrovaných migrantů a zdá se, že jejich počet stále roste. Stávající infrastruktura je přetížená, takže řešení mimo naše území bude třeba znovu přezkoumat, aby dokázalo zvládnout současnou krizi." # todo: NEW TRANSLATION
 AST_keep_the_gears_turning: "Udržet soukolí v chodu" # todo: NEW TRANSLATION
 AST_keep_the_gears_turning_desc: "Jsme s okolním světem příliš propojeni na to, abychom se jednoduše stáhli. Politika zadržování prostřednictvím zástupců funguje jen tehdy, pokud udržujeme soukolí promazané a dokazujeme, že naše sliby platí. Riziko, že se otočíme zády, je příliš vysoké. Žádné vyšší dobro. Žádná spravedlivá věc." # todo: NEW TRANSLATION
 AST_world_hold_on: "Světe, vydrž" # todo: NEW TRANSLATION
 AST_world_hold_on_desc: "Musíme ostatním zemím vyslat zprávu, že Austrálie ještě nedosáhla vrcholu. Stále jsme zde a vydáváme se do světa. Podpora zahraničních investic omezením regulací, které brzdí naše velké podniky, je druh ekonomického kolonialismu, na který můžeme být hrdí. Fox News a Outback Steakhouse byly jen malou ukázkou toho, čeho jsme schopni. Uvidí." # todo: NEW TRANSLATION
 AST_assure_the_other_side: "Ujistit druhou stranu" # todo: NEW TRANSLATION
 AST_assure_the_other_side_desc: "Bez našich podniků nepřežijeme. Obchod je jako krev proudící naším průmyslem. Bez ohledu na stranické závazky by se bez skutečného zájmu podporovat je během současného finančního posunu mohlo samotné srdce naší ekonomiky zastavit. Musíme najít rovnováhu v jejich podpoře, stejně jako oni nepřímo podporují nás." # todo: NEW TRANSLATION
 AST_forward_with_fairness: "Vpřed se spravedlností" # todo: NEW TRANSLATION
 AST_forward_with_fairness_desc: "Jsme pro zlepšování života našich pracovníků, ale dušení růstu podniků v této době jednoduše nepřipadá v úvahu. Zrušení AWA a zavedení kolektivního vyjednávání ukáže, že jsme ochotni pracovat v zájmu podniků. Koneckonců právo pracovat by mělo zůstat v rukou pracovníka, nikoli odborů." # todo: NEW TRANSLATION
 AST_represent_the_worker: "Zastupovat pracovníka" # todo: NEW TRANSLATION
 AST_represent_the_worker_desc: "Práce je v zásadě tvořena lidskými bytostmi s vrozenou důstojností, nikoli pouhou ekonomickou komoditou. Pokud naši pracovníci nevěří, že za nimi stojíme, jak můžeme očekávat, že budou hájit svá vlastní práva? Nesmíme působit dojmem, že přání podniků stavíme nad vlastní lid." # todo: NEW TRANSLATION
 AST_the_emissions_trading_scheme: "Systém obchodování s emisemi" # todo: NEW TRANSLATION
 AST_the_emissions_trading_scheme_desc: "Klimatická změna se stala největší morální výzvou naší doby. Nejen pro nás, ale pro celý svět. Stovky národů jsou nyní varovány před hrozícím nebezpečím, ale jejich schopnost jednat je zpochybňována. Dokážeme odložit pohodlí našeho průmyslu ve prospěch budoucích generací? Dokážeme skutečně nést břemeno hospodářského růstu a zároveň chránit životní prostředí? Naše odpověď bude vždy ano. \n\nTento systém byl jedním z našich nejdéle trvajících předvolebních slibů. Zavede limity na množství CO2 vypouštěného společností. Pokud budou firmy chtít vypouštět více, budou potřebovat povolenky od vlády, nebo za ně draze zaplatí, což krátkodobě povede k nižší výrobě energie. Cílem je snížit naše emise na úroveň před rokem 2000 a zároveň podpořit obnovitelnou energii; nepochybně nám však přinese značné nové příjmy." # todo: NEW TRANSLATION
 AST_cut_the_csiro: "Omezit CSIRO" # todo: NEW TRANSLATION
 AST_cut_the_csiro_desc: "Commonwealth Scientific and Industrial Research Organisation bohužel neplní svou úlohu. Člověk by očekával, že dostatek přebujelých grantů k úplnému financování jiných agentur něco přinese, ale v posledních desetiletích náklady rostly a výsledků bylo jen málo. Budeme muset její část zlikvidovat, abychom věci vrátili do správných kolejí, a naše pokladna tím neutrpí." # todo: NEW TRANSLATION
 AST_green_energy_incentives: "Pobídky pro čistou energii" # todo: NEW TRANSLATION
 AST_green_energy_incentives_desc: "Pokud fosilní paliva upadají, obnovitelné zdroje musí růst. Více než to – musíme je podporovat, chceme-li v budoucnu dosáhnout celostátního rozšíření. Rozvoj geotermálních možností a investice do Fondu inovací zelených automobilů nás nasměrují správným směrem." # todo: NEW TRANSLATION
 AST_fair_work_australia: "Fair Work Australia" # todo: NEW TRANSLATION
 AST_fair_work_australia_desc: "Vzhledem k odcizení našich podniků a vlády strana doporučila vytvoření úřadu pro vztahy, který bude pracovat jménem podnikatelských zájmů a lépe sladí naše zaměření s jejich. Tím bychom se měli zbavit zákona o pracovních vztazích i obávaných reforem WorkChoices. Pokud jej zavedeme s připomínkami odborů, můžeme zapracovat obvyklou ochranu pracovníků a zároveň usmířit obě strany sporu." # todo: NEW TRANSLATION
 AST_snip_the_red_tape: "Přestřihnout byrokracii" # todo: NEW TRANSLATION
 AST_snip_the_red_tape_desc: "Navzdory poměrně jednotnému Commonwealthu naše státní vlády rozhodně nespolupracují tak dobře, jak bychom si přáli. Pokud se chce podnik zaregistrovat, musí projít formuláři a poplatky každého jednotlivého státu, v němž působí. Ve dvou státech to znamená dvojnásobné poplatky a dvojnásobek formulářů. Vytvoření jediného celostátního online registru umožní komukoli v zemi zaregistrovat se jednou a provždy a pak se rovnou pustit do podnikání." # todo: NEW TRANSLATION
 AST_for_the_common_farmer: "Pro obyčejného farmáře" # todo: NEW TRANSLATION
 AST_for_the_common_farmer_desc: "Od přelomu století to naši farmáři nemají lehké. Příznačně největším důvodem k obavám je miléniové sucho, které navzdory naší politice nadále brzdí obnovu zemědělství. Setkání se zástupci nám pomůže pracovat na skutečných řešeních." # todo: NEW TRANSLATION
 AST_walkable_cities: "Města do 20 minut" # todo: NEW TRANSLATION
 AST_walkable_cities_desc: "Náš největší boj se odehrává v ulicích. Na začátku průmyslové revoluce byli občané namačkáni do úzkých uliček a nuceni přijmout asfaltovou krajinu jako místo společenského života. Od té doby náš pocit sounáležitosti uschl a stal se obětí zábavy uvnitř domovů. Nemůžeme lidi nutit chodit ven, ale můžeme je nalákat. \n\nZačleněním plánu města do 20 minut, který vypracovala melbournská rada, můžeme uvolnit omezení hluku v hlavních ulicích a financovat řadu tvůrčích projektů a festivalů, které lidi přivedou zpět do ulic a obnoví pocit komunity. Přidejme bezplatné programy pro mládež a rozšíření infrastruktury a naše čtvrti se během několika let stanou rušnými kulturními centry." # todo: NEW TRANSLATION
 AST_keep_them_safe: "Udržet je v bezpečí" # todo: NEW TRANSLATION
 AST_keep_them_safe_desc: "Austrálie nemá národní zvíře, ačkoli většina lidí by řekla, že jím je klokan rudý. Je to téměř všeobecně uznávaný symbol, ale stejně mnoho lidí ví o roztomilých tvorech obývajících naše vnitrozemské lesy. Ať už kvůli těžebním společnostem nebo nemocem, populace koal každým rokem klesá a přesto se pro jejich ochranu dělá jen málo. Pokud je vyhlásíme za chráněný druh, konečně můžeme udělat více pro zachování těchto nezapomenutelných vačnatců a jejich ochranu před vyhynutím." # todo: NEW TRANSLATION
 AST_industry_research_bank: "Výzkumná banka Commonwealthu" # todo: NEW TRANSLATION
 AST_industry_research_bank_desc: "Naše výzkumná činnost upadá jen proto, že jsme jí to dovolili. Nedostatek investic do klíčových oblastí brání našim organizacím vykonávat práci, pro kterou byly vytvořeny – překonávat překážky. Zvyšte rozpočet a zvyšte cíle." # todo: NEW TRANSLATION
 AST_natos_best_friend: "Nejlepší přítel NATO" # todo: NEW TRANSLATION
 AST_natos_best_friend_desc: "Austrálie již nyní patří mezi nejbližší spojence NATO mimo členské státy. Cvičíme s nimi, účastníme se s nimi mírových misí a sdílíme zpravodajské informace. Naše pozice v Pacifiku by mohla být s odpovídající podporou výrazně posílena, a přestože má naše neutralita své výhody, nastal čas pro užší spolupráci." # todo: NEW TRANSLATION
 AST_from_the_ashes: "Z popela" # todo: NEW TRANSLATION
 AST_from_the_ashes_desc: "Nyní, když jsme znovu u kormidla, se musíme soustředit na vítězství v příštích volbách. Naše politika se musí zaměřit na krátkodobé cíle a sjednocení strany za naším vedením bude vyžadovat špetku inspirace a pořádnou dávku nátlaku." # todo: NEW TRANSLATION
 AST_a_new_dawn: "Nový úsvit" # todo: NEW TRANSLATION
 AST_a_new_dawn_desc: "Veřejnost musí Labor vnímat jako znovuzrozenou stranu. Starou slupku vnitrostranických bojů je třeba odhodit a vytvořit nový obraz kompetentnosti a spolehlivosti, abychom zachránili svou voličskou základnu." # todo: NEW TRANSLATION
 AST_repair_the_party: "Opravit stranu" # todo: NEW TRANSLATION
 AST_repair_the_party_desc: "Naše staré vztahy s frakcemi ve straně jsou víceméně v troskách. Ještě horší je, že systém, který umožnil naše svržení, stále existuje. Odstranění současných mechanismů, aby byly převraty ve vedení méně časté, a přepsání stranických pravidel jsou jedinou cestou, jak dát věci do pořádku." # todo: NEW TRANSLATION
 AST_fight_back: "Bránit se" # todo: NEW TRANSLATION
 AST_fight_back_desc: "Pokud si média Newscorp myslela, že nás mohou dál vláčet blátem a my na to nebudeme mít odpověď, pak se hluboce mýlila. Aréna veřejné debaty je obousměrná a my jim to tvrdě vrátíme." # todo: NEW TRANSLATION
 AST_on_the_campaign_trail: "Na předvolební kampani" # todo: NEW TRANSLATION
 AST_on_the_campaign_trail_desc: "Posledních několik let skutečně nebylo ideálních a Labor se bezpochybyšel z cesty. Návštěvy Australanů na venkově i ve městech napříč celou zemí a snaha porozumět skutečným problémům, které je trápí, ukazují, že jsme připraveni znovu být stranou, která naslouchá. Začneme oznámením naší kandidatury na národní konferenci." # todo: NEW TRANSLATION
 AST_win_manufacturers: "Získat výrobce" # todo: NEW TRANSLATION
 AST_win_manufacturers_desc: "Druhé volební období zahajujeme ve velkém zákonem o australských pracovních místech. Balíček v hodnotě 2 miliard dolarů umožní rekvalifikaci 7 000 pracovníků ve výrobě a pomůže jim přejít do výrobních odvětví, zatímco naše tradiční automobilové a textilní trhy čelí útlumu. Praktické řešení přetrvávajícího poklesu průmyslu." # todo: NEW TRANSLATION
 AST_cast_the_die: "Hodit kostkou" # todo: NEW TRANSLATION
 AST_cast_the_die_desc: "Všechny karty jsou rozdány a Australané jsou připraveni zvolit svého dalšího vůdce. Udělali jsme vše, co jsme mohli, abychom se připravili a představili svou vizi. Můžeme jen doufat, že s ní voliči souhlasí." # todo: NEW TRANSLATION
 AST_the_gillard_gov: "Vláda Julie Gillardové" # todo: NEW TRANSLATION
 AST_the_gillard_gov_desc: "Tato vláda věří v odměňování těch, kteří pracují nejtvrději, nikoli těch, kteří si nejhlasitěji stěžují. Věří v odměňování těch, kteří den co den pracují v našich továrnách a na farmách, v dolech a hutích, ve školách a nemocnicích; těch, jejichž tvrdá práce, slušnost a úsilí si zaslouží uznání. Lidé, kteří dodržují pravidla, brzy ráno si nastavují budík, vypravují děti do školy, stojí při svých sousedech a milují svou zemi. \n\nNaše země je v mnoha ohledech požehnaná, ale stav financí našeho národa se zhoršil a nabobtnal natolik, že je zanedbáván. Ujišťuji každého Australana, že pod naším vedením se rozpočet vrátí do dobré kondice. Přijímáme povinnost, kterou nám uložili naši předchůdci, a zavazujeme se vést fiskálně odpovědnou a silnou vládu, která chápe potřeby více než jen hlasité menšiny. \n\nPolitika založená na mediálních hrách skončí. Skončí lhostejnost k potřebám našeho průmyslu a vrátí se důstojnost a rozumnost." # todo: NEW TRANSLATION
 AST_form_the_minority_coalition: "Vytvořit menšinovou koalici" # todo: NEW TRANSLATION
 AST_form_the_minority_coalition_desc: "Budoucnost Labor nyní závisí na naší schopnosti sestavit vládu." # todo: NEW TRANSLATION
 AST_go_green: "Zelená cesta" # todo: NEW TRANSLATION
 AST_go_green_desc: "Když nás zrovna nezrazují, jsou Zelení užitečnou stranou pro naši věc. Vyjednávání s nimi nebude nijak obtížné a většina jejich politických preferencí se shoduje s našimi. Jistě budeme muset tu a tam provést několik symbolických reforem, ale v rozhodujících chvílích nás podpoří." # todo: NEW TRANSLATION
 AST_wrangle_liberal_defectors: "Získat přeběhlíky z Liberální strany" # todo: NEW TRANSLATION
 AST_wrangle_liberal_defectors_desc: "Několik současných členů Liberální a Národní strany projevilo zájem o náš program a někteří již kvůli nedávným stranickým sporům změnili tábor. Najít je a nabídnout jim místo v naší vládě výměnou za podporu by mělo být dost snadné a ukáže to, že při zachování konzervativních hodnot nejsme proti spolupráci s opozicí." # todo: NEW TRANSLATION
 AST_clean_energy_act: "Zákon o čisté energii" # todo: NEW TRANSLATION
 AST_clean_energy_act_desc: "Po neúspěchu při zavádění systému obchodování s emisemi byl vypracován méně rozdělující nástroj, který má řešit naše rostoucí emise uhlíku. Rozsah zákona ještě není zcela definován, ale stejně jako u systému obchodování s emisemi je jeho cílem omezit množství CO2 pomocí nově zavedených daní a podpořit výrobu čisté energie." # todo: NEW TRANSLATION
 AST_clean_energy_creation: "Rozvoj čisté energie" # todo: NEW TRANSLATION
 AST_clean_energy_creation_desc: "Při řešení klimatické krize jsme na správné cestě a je čas investovat část našich prostředků do pokračování tohoto plánu. Dlouhodobým cílem vždy bylo dosáhnout energetické nezávislosti na našich zásobách uhlí. Začněme s přechodem." # todo: NEW TRANSLATION
 AST_address_the_stolen_generations: "Vypořádat se s ukradenými generacemi" # todo: NEW TRANSLATION
 AST_address_the_stolen_generations_desc: "V opozici je dostatečná podpora k přednesení projevu o Ukradených generacích, aniž bychom působili, že se vezeme na vlně Národní omluvy. Určitě budeme působit velmi nestranicky a pro některé členy společnosti by to mohlo být zdrojem útěchy." # todo: NEW TRANSLATION
 AST_correct_the_mouthboxes: "Napravit veřejný prostor" # todo: NEW TRANSLATION
 AST_correct_the_mouthboxes_desc: "Korporacím a politickým kampaním bylo dovoleno beztrestně lhát na internetu i v televizi. I když je obtížné prokázat zlý úmysl nebo škodu způsobenou laxním přístupem k pravdě, nemůžeme dovolit, aby tento znepokojivý trend pokračoval. Zavedení zákonů trestajících klamavé reklamy či příspěvky by mohlo tento trend zvrátit a vrátit do politiky alespoň trochu reality." # todo: NEW TRANSLATION
 AST_let_debate_decide: "Nechat rozhodnout debatu" # todo: NEW TRANSLATION
 AST_let_debate_decide_desc: "Jeden z návrhů zákonů, které nám předali Zelení, má rozšířit práva osob stejného pohlaví. Naše vláda stále váhá, ne-li přímo nesouhlasí s náhlými kroky tímto směrem, ale můžeme nechat sněmovnu, aby o něm spravedlivě rozhodla." # todo: NEW TRANSLATION
 AST_ndis: "Vytvořit NDIS" # todo: NEW TRANSLATION
 AST_ndis_desc: "Prostou pravdou je, že postižení může postihnout kohokoli z nás, a proto se týká nás všech. Jen málokdo je finančně připraven na jeho důsledky a lidé čelící izolaci, chudobě a ztrátě důstojnosti se nyní mohou spolehnout jen na omezenou podporu, kterou naše sociální služby poskytují konkrétně postiženým. \n\nZavedení Národního systému pojištění pro osoby se zdravotním postižením by mohlo být nejvýznamnější podporou od zavedení všeobecné zdravotní péče Gough Whitlamem. Miliony potřebných lidí získají podporu, kterou potřebují, a národ na to bude hrdý." # todo: NEW TRANSLATION
 AST_the_gonski_review: "Gonského přezkum" # todo: NEW TRANSLATION
 AST_the_gonski_review_desc: "Na začátku našeho volebního období jsme zadali přezkum školského systému, abychom odhalili nedostatky vyžadující nápravu. Přezkum odhalil prohlubující se rozdíly ve vzdělávacích výsledcích způsobené socioekonomickým postavením a neefektivním financováním. Stručně řečeno, veřejné školy s menším financováním dosahovaly ve všech ohledech horších výsledků. \n\nAbychom tento problém vyřešili a pomohli našim studentům, je třeba zavést zásadní přepracování financování vzdělávání. Koneckonců právě oni jsou budoucností našeho národa." # todo: NEW TRANSLATION
 AST_keep_them_aligned: "Udržet je v souladu" # todo: NEW TRANSLATION
 AST_keep_them_aligned_desc: "Národní strana se snaží vyvolat rozruch kolem naší zemědělské politiky, nebo jejího nedostatku. Tyto nátlakové taktiky možná fungovaly u předchozích vlád, ale nebudou určovat způsob, jakým povedeme tento kabinet. Zavedeme vlastní granty pro zemědělce podle našich podmínek a v médiích je představíme jako naše vítězství. \n\nUkazuje to, že pokud s námi chtějí spolupracovat, musí to být podle našich pravidel." # todo: NEW TRANSLATION
 AST_take_less: "Brát méně" # todo: NEW TRANSLATION
 AST_take_less_desc: "Liberální strana má pravdu jen málokdy, ale správně chápe potřebu nízkých daní. Jak můžeme očekávat, že si průměrný Australan bude vážit odměny za svou práci, když mu z ní většinu vezmeme? Silnější obyvatelstvo je takové, kterému v kapse zůstane více peněz." # todo: NEW TRANSLATION
 AST_get_more: "Získat více" # todo: NEW TRANSLATION
 AST_get_more_desc: "Daně z neřestí se používají od založení našeho národa, ačkoli v poslední době byly opomíjeny kvůli právu nižší třídy oddávat se zvrhlým aktivitám. Volba mezi dojmem „společensky tolerantních“ a zachováním jakékoli morální páteře je pro nás snadná." # todo: NEW TRANSLATION
 AST_regulate_the_unions: "Regulovat odbory" # todo: NEW TRANSLATION
 AST_regulate_the_unions_desc: "Ať se nám to líbí, nebo ne, odbory jsou už ze své podstaty překážkou hospodářského růstu. Podkopávají svobodu pracovníků pracovat i právo firem zaměstnávat. Politická moc odborů, kterou využívají k ovládání vlády a potlačování prosperity, nás prakticky drží pod krkem. \n\nJe třeba umožnit legislativu omezující jejich dosah a udržet politiku tohoto národa v rukou vlády, nikoli pod nadvládou těchto malicherných krajně levicových byrokratů." # todo: NEW TRANSLATION
 AST_national_broadband_network: "Národní širokopásmová síť" # todo: NEW TRANSLATION
 AST_national_broadband_network_desc: "NBN se v této chvíli buduje téměř deset let a do projektu již byly investovány miliardy, aby rychlost připojení v celé Austrálii odpovídala moderní době. Projekt se možná protáhl déle, než bylo nutné, a opozice stále naříká nad jeho cenou. Pokud měly naše škrty nějaký smysl, pak takovéto výdaje za tuto cenu rozhodně stojí." # todo: NEW TRANSLATION
 AST_back_in_black: "Zpět do černých čísel" # todo: NEW TRANSLATION
 AST_back_in_black_desc: "Aniž bychom na někoho ukazovali prstem, naše výdaje se nebezpečně vymkly kontrole. Náš rozpočet sužuje plýtvání a žádná vláda by neměla platit za hříchy té předchozí. Musíme využít všechny dostupné prostředky, abychom se vrátili do černých čísel a udrželi inflaci nízko. Žádné „kdyby“, žádné „ale“. Zde nepřipadá neúspěch v úvahu a my neprohrajeme." # todo: NEW TRANSLATION
 AST_slam_the_door_on_them: "Zabouchnout jim dveře" # todo: NEW TRANSLATION
 AST_slam_the_door_on_them_desc: "Vzhledem k tomu, jak se naše sociální výdaje nafoukly, by naším prvním úkolem mělo být přezkoumání kritérií způsobilosti pro naše služby pro osoby se zdravotním postižením. Zvýšení požadavků na rozumnou úroveň by mělo vyřadit některé příživníky, kteří podporu ve skutečnosti nepotřebují, a omezení několika nehospodárných programů vrátí výdaje na přijatelnější úroveň." # todo: NEW TRANSLATION
 AST_scrounge_a_penny: "Ušetřit každý cent" # todo: NEW TRANSLATION
 AST_scrounge_a_penny_desc: "Ve snaze najít úspory všemi možnými způsoby musíte být někdy kreativní, zvláště pokud jde o zvyšování daní. Hlasité oznámení zvýšení daní je jistý způsob, jak zmenšit naši podporu hned na začátku. Pokud místo toho nenápadně zvýšíme odvod na zdravotní péči z 1,5 % na 2 %, ti, kdo jej platí, si toho téměř nevšimnou a my získáme pro rozpočet pěkný dodatečný příjem." # todo: NEW TRANSLATION
 AST_digitise_the_tvs: "Digitalizovat televizní kanály" # todo: NEW TRANSLATION
 AST_digitise_the_tvs_desc: "Po úspěšném pilotním programu v Mildurě zavádíme přechod na digitální vysílání v celé zemi a nahrazujeme stará připojení set-top boxy. Celý proces řídíme sami a měl by i Australanům na venkově umožnit přístup k řadě nových kanálů v mnohem vyšší kvalitě. Velké zrovnoprávnění zábavy začíná právě zde." # todo: NEW TRANSLATION
 AST_our_own_white_paper: "Naše vlastní bílá kniha" # todo: NEW TRANSLATION
 AST_our_own_white_paper_desc: "Australské obranné síly hrály ústřední roli posvátného štítu nesčetných národů blízkých i vzdálených. S rostoucími požadavky na ochranu rostl i rozpočet a žádná část vlády není imunní vůči plýtvání. Armáda zůstane stejně účinná jako dosud, ale bude nutné důkladně odstranit její nedostatky." # todo: NEW TRANSLATION
 AST_plain_cigarette_packaging: "Jednotné balení cigaret" # todo: NEW TRANSLATION
 AST_plain_cigarette_packaging_desc: "Kromě rozpočtových škrtů bylo řešení krize spojené s rakovinou jednou z našich největších priorit. Vládní reklamy již odvedly svou práci, ale dostupnost cigaret téměř v každém obchodě stále představuje zásadní problém. Namísto úplného zákazu kouření nahradíme značková balení minireklamami varujícími před nebezpečím kouření, čímž bude spojení s rakovinou nemožné ignorovat. \n\nRodiče tak zůstanou odpovědní a mladí se pořádně vyděsí." # todo: NEW TRANSLATION
 AST_put_the_squeeze_on_them: "Přitáhnout šrouby" # todo: NEW TRANSLATION
 AST_put_the_squeeze_on_them_desc: "Součástí naší reformy zdravotnictví byla revize současných výdajů spravovaných státy a jejich úprava tak, aby péče byla poskytována včas a efektivně. Tentokrát předložíme jiný druh přezkumu zaměřený na odstranění plýtvání. Stejně jako minule se nám v tom pravděpodobně pokusí zabránit, ale nakonec z nich vytlačíme každou kapku zpět do rozpočtu." # todo: NEW TRANSLATION
 AST_australia_works: "Austrálie pracuje" # todo: NEW TRANSLATION
 AST_australia_works_desc: "Program, příhodně pojmenovaný, má začlenit princip „Práce za podporu“ do státní celostátní stavební služby, která poskytne lidem pobírajícím sociální podporu stabilní práci a vytvoří nová pracovní místa, aby udržela současný upadající stavební průmysl nad vodou. Je to neuvěřitelně ambiciózní, ale nezbytné pro návrat naší země na správnou cestu." # todo: NEW TRANSLATION
 AST_free_the_market: "Svobodnější trh" # todo: NEW TRANSLATION
 AST_free_the_market_desc: "Náš krásný národ je nyní ochromen přebujelou vládou a vyždímaným soukromým sektorem. Jsme zpomalováni a zároveň odmítáme nechat podniky růst vlastním tempem. Omezení tohoto sevření snížením daňového útlaku a privatizací nevyužívaných kancelářských prostor bude oživením, které potřebujeme, a umožní volnému trhu, aby se vydal svou vlastní cestou." # todo: NEW TRANSLATION
 AST_mediate_with_the_mines: "Zprostředkovat dohodu s těžaři" # todo: NEW TRANSLATION
 AST_mediate_with_the_mines_desc: "Vztahy mezi Labor a těžebním průmyslem jsme zdědili v ne zrovna ideálním stavu. Pokud s nimi máme spolupracovat na reformě, musí dojít k zásadnímu posunu a nejlepším místem, kde začít, je střed. Pořádání různých setkání k projednání požadavků a možností spolupráce položí základy naší budoucí práce." # todo: NEW TRANSLATION
 AST_endorse_the_magnates: "Podpořit magnáty" # todo: NEW TRANSLATION
 AST_endorse_the_magnates_desc: "Jedna z našich největších těžebních společností, vedená Ginou Rinehartovou, se přímo obrátila na vládu s žádostí o schválení příchodu 1 700 kvalifikovaných zahraničních pracovníků, kteří by doplnili nově vznikající doly v Západní Austrálii. Gina naši novou vládu dosud bezvýhradně podporovala a dobrý začátek vztahů s ní by mohl být tím správným místem, kde začít, pokud se chceme pustit do spolupráce s těžaři." # todo: NEW TRANSLATION
 AST_entice_competition: "Přilákat konkurenci" # todo: NEW TRANSLATION
 AST_entice_competition_desc: "Pokud se odbory obávají vzniku monopolů, otevřeme trh zahraničním společnostem. Konkurence po staletí usměrňuje ekonomiky a australská ekonomika není výjimkou. Směsice nápadů je součástí toho, co tuto zemi vůbec vybudovalo." # todo: NEW TRANSLATION
 AST_minerals_resource_tax: "Daň z nerostných surovin" # todo: NEW TRANSLATION
 AST_minerals_resource_tax_desc: "Daň z nadměrných zisků byla příliš ambiciózní a přišla v nejhorší možnou dobu. Pokud máme z této bouře vyjít bez úhony, musíme spolupracovat s těžebním průmyslem. Právě spolupráce nám přinesla tento skromný zákon. Rozhodně nestačí k narušení monopolizace našich zdrojů, ale prozatím si s tím budeme muset vystačit." # todo: NEW TRANSLATION
 AST_bauxite_investment: "Investice do bauxitu" # todo: NEW TRANSLATION
 AST_bauxite_investment_desc: "Hliník se ukazuje jako jeden z nejdůležitějších kovů 21. století. Je všude, je nesmírně užitečný a máme ho zde dostatek. Naštěstí na náš stůl dorazil návrh na takový důl, předložený k posouzení v rámci žádosti o investici. Když se naskytne taková příležitost, je moudré ji neodmítnout." # todo: NEW TRANSLATION
 AST_pilbara_expansion: "Rozšíření Pilbary" # todo: NEW TRANSLATION
 AST_pilbara_expansion_desc: "Většina žádostí o těžební pozemky se řeší na místní úrovni, tentokrát však přišla žádost o lokalitu v Pilbaře, která zasahuje přes hranici jednoho z tamních národních parků. Místo je poměrně daleko od chráněných území, ale případ nyní řeší nejvyšší soud. Mohli bychom přiklonit misky vah v jeho prospěch a urychlit schválení, samozřejmě v zájmu našeho hospodářství." # todo: NEW TRANSLATION
 AST_ease_on_restrictions: "Uvolnit omezení" # todo: NEW TRANSLATION
 AST_ease_on_restrictions_desc: "Každý rok je kvůli ekologickým omezením zrušeno mnoho těžebních projektů. Dokonce i ty nejmenší výkopové práce mohou být zastaveny kvůli chráněným pásmům nebo nové klimatické legislativě. V tuto chvíli je největší brzdou hospodářského růstu nedostatek dostupných lokalit. Vzhledem k rozloze Austrálie je to absurdní. To se musí změnit." # todo: NEW TRANSLATION
 AST_train_it_out: "Vyřešit to železnicí" # todo: NEW TRANSLATION
 AST_train_it_out_desc: "Těžební scéna v Západní Austrálii prakticky volá po volně přístupných tratích těžké železnice, které by spojily vzdálené doly, například v Pilbaře, s přístavy. Výstavba vlastních státních tratí by prolomila monopol velkých společností na železniční infrastrukturu a umožnila desítkám středně velkých a začínajících těžařů dopravit své produkty do přístavu, což by výrazně zvýšilo objem našeho národního vývozu." # todo: NEW TRANSLATION
 AST_champion_the_mets_sector: "Prosazovat sektor METS" # todo: NEW TRANSLATION
 AST_champion_the_mets_sector_desc: "Protože se naše země stala pro těžební projekty tak efektivní, korporace s ní začaly zacházet jako s „lomem pro celý svět“. Těžba zdrojů se stala úzce zaměřenou činností. Austrálie musí být vnímána jako Silicon Valley těžebních technologií. \n\nFinancování organizací METS (těžební vybavení, technologie a služby) a zaměření vlastního výzkumu a vývoje na dálkově řízenou těžbu urychlí rozvoj autonomní přepravy a zdokonalí naše současné těžební postupy. Budoucnost těžby vznikne zde." # todo: NEW TRANSLATION
 AST_the_australian_century: "Australské století" # todo: NEW TRANSLATION
 AST_the_australian_century_desc: "Zlaté věky se obvykle neobjeví náhodou ani nejsou dílem šťastné náhody. Jsou výsledkem práce trvající desítky, ba i stovky let a nastávají jen zřídka, pokud vůbec. Na rozdíl od národů minulosti naše vláda netápe ve tmě. Vše, co dnes děláme, se připravovalo roky a náš úspěch byl od počátku pečlivě plánován. Nyní je naše chvíle." # todo: NEW TRANSLATION
 AST_the_foreign_ministry: "Ministerstvo zahraničí" # todo: NEW TRANSLATION
 AST_the_foreign_ministry_desc: "Vzestup Asie, a zejména Číny, postavil Austrálii po hospodářské stránce do trvale podřadnější pozice vůči okolním zemím. Pro někoho může být tato realita alarmující, ale 21. století nebude pokračováním unipolarity, což nám přináší příležitosti. Pokud jsme ochotni soutěžit a překonat své předsudky, Pacifik představuje nový svět, který můžeme buď využít, nebo přijmout ve prospěch našeho národa." # todo: NEW TRANSLATION
 AST_foreign_minister_rudd: "Ministr zahraničí Rudd" # todo: NEW TRANSLATION
 AST_foreign_minister_rudd_desc: "Bývalý vůdce může být nejzkušenějším odborníkem na zahraniční otázky, kterého máme k dispozici. Kevin Rudd strávil desetiletí budováním dialogu s asijskými národy a již sehrál klíčovou roli při prohlubování propojení vlády. Rudd navrhl sérii diplomatických cest, které mají posílit naše postavení a představit Austrálii jako olivovou ratolest Pacifiku." # todo: NEW TRANSLATION
 AST_papua_residency: "Papua Nová Guinea" # todo: NEW TRANSLATION
 AST_papua_residency_desc: "Ekonomika Papuy Nové Guineje se pomalu začlenila do té naší, až na absenci oficiální dohody. Nápravou této situace prostřednictvím vyjednání úplného hospodářského paktu konečně stvrdíme naši dohodu." # todo: NEW TRANSLATION
 AST_soften_the_emerald: "Obměkčení Smaragdu" # todo: NEW TRANSLATION
 AST_soften_the_emerald_desc: "U sousedního národa, který je nám tak blízko, bychom očekávali vzájemně přátelské vztahy. Bohužel se rozkol v poslední době pouze prohloubil a vyslání Rudda, aby urovnal situaci, může být jediným způsobem, jak vztahy zachránit." # todo: NEW TRANSLATION
 AST_the_new_bear: "Nový medvěd" # todo: NEW TRANSLATION
 AST_the_new_bear_desc: "Celá podstata Ruska se v postsovětských letech změnila. Země pomalu přijala ideologii kapitalismu a vpustila cizí zájmy pod svůj kožich. Mohla by to být naše příležitost diplomaticky vztyčit vlajku a dohodnout něco, co nám bude navzdory vzdálenosti vyhovovat." # todo: NEW TRANSLATION
 AST_entente_with_north_korea: "Dohoda se Severní Koreou" # todo: NEW TRANSLATION
 AST_entente_with_north_korea_desc: "Rudd navrhl cestu do korejského demilitarizovaného pásma, kde by se setkal se severokorejským vůdcem v naději, že oba národy přiblíží mírovému soužití. Možná trochu příliš míří ke hvězdám, ale plán je v zásadě rozumný a půjde o první přímé gesto, které jsme vůči Severokorejcům učinili." # todo: NEW TRANSLATION
 AST_foreign_minister_smith: "Ministr zahraničí Smith" # todo: NEW TRANSLATION
 AST_foreign_minister_smith_desc: "Stephen Smith je výrazným členem strany již od dob Keatinga a jako první nabídl své služby ministerstvu zahraničí. Jeho politika se s tou naší dostatečně shoduje: Smith chce, aby se Austrálie stala místem, kde se protíná obchod v Pacifiku. Chce využít nový svět jako základ pro růst našeho hospodářského významu v zahraničí jakýmkoli způsobem, který prospěje zemi." # todo: NEW TRANSLATION
 AST_our_glowing_deposits: "Naše zářivá ložiska" # todo: NEW TRANSLATION
 AST_our_glowing_deposits_desc: "Ložiska tu jsou, musíme je pouze vyvézt. Náš současný klient nás již nějakou dobu obtěžuje kvůli těžebním právům a je jen spravedlivé, abychom mu nabídli zboží." # todo: NEW TRANSLATION
 AST_the_best_of_both_worlds: "To nejlepší z obou světů" # todo: NEW TRANSLATION
 AST_the_best_of_both_worlds_desc: "Balancujeme mezi složitými vztahy: udržujeme hluboké bezpečnostní a obranné spojenectví se Spojenými státy a zároveň usilujeme o stabilizovanou obchodní vzájemnou závislost s Čínou. Díky tomu, že jsme se vyhnuli nutnosti volby mezi nimi, jsme dokázali zůstat nad vodou." # todo: NEW TRANSLATION
 AST_made_in_vietnam: "Vyrobeno ve Vietnamu" # todo: NEW TRANSLATION
 AST_made_in_vietnam_desc: " Pro mnoho Australanů to byl zvláštní pocit, když se podívali na zboží, které vždy kupovali, a náhle spatřili malý nápis dole, který jim říkal, že nebylo vyrobeno zde, ale na místě zvaném \"Vietnam\". Nebylo snadné to přijmout, ale když měli plnější kapsy a obchody nabízely větší výběr, rychle se přes to přenesli." # todo: NEW TRANSLATION
 AST_foreign_minister_carr: "Ministr zahraničí Carr" # todo: NEW TRANSLATION
 AST_foreign_minister_carr_desc: "Bob Carr může být největším realistou na našem seznamu, nebo přinejmenším nejpragmatičtějším. V jádru Carr věří, že zahraniční politika je sérií improvizací. Austrálie musí současně usilovat o pověst morálního centra Pacifiku a zároveň se nebát umazat si ruce při ochraně našich zájmů. Skutečnou zkouškou je způsob, jakým tuto rovnováhu zvládneme." # todo: NEW TRANSLATION
 AST_smother_the_pot: "Rozvířit kotel" # todo: NEW TRANSLATION
 AST_smother_the_pot_desc: "Australské zájmy se na Blízkém východě natolik propletly, že cokoli se tam stane, ovlivňuje nás zde. Poslední desetiletí proměnilo vroucí kotel nepokojů v zuřící požár, od kterého si nemůžeme dovolit držet odstup." # todo: NEW TRANSLATION
 AST_the_big_boys_club: "Klub velkých hráčů" # todo: NEW TRANSLATION
 AST_the_big_boys_club_desc: "V Radě bezpečnosti Organizace spojených národů je pět stálých křesel a přibližně patnáct nestálých míst, která se každých několik let obměňují. Politika ovlivňující celý svět se v komnatách OSN rozhoduje mezi těmito zeměmi. Vzhledem k tomu, že naše vlastní odpovědnost je tak úzce propojena se zbytkem světa, je jen spravedlivé, abychom získali místo u stolu. Musíme pracovat na zvýšení našich šancí." # todo: NEW TRANSLATION
 AST_global_weapon_trading: "Globální obchod se zbraněmi" # todo: NEW TRANSLATION
 AST_global_weapon_trading_desc: "Carr využívá naše postavení v OSN k intenzivnímu prosazování globální smlouvy o obchodu se zbraněmi. Ta má sledovat a omezit dodávky zbraní nepříznivým státům a teroristickým skupinám a zároveň zatraktivnit prodej zbraní z naší země i dalších západních států. Je to odvážné, ale v New Yorku již shromažďuje podporu, aby smlouvu prosadil." # todo: NEW TRANSLATION
 AST_myanmar_intervention: "Intervence v Myanmaru" # todo: NEW TRANSLATION
 AST_myanmar_intervention_desc: "Kolaps Myanmaru se proměnil v humanitární noční můru. Každá volba, kterou učiníme, abychom se zapojili, bude mít vlastní důsledky, stejně jako naše nečinnost." # todo: NEW TRANSLATION
 AST_consuls_of_peace: "Konzulové míru" # todo: NEW TRANSLATION
 AST_consuls_of_peace_desc: "Osud Austrálie je pevně zakořeněn v globální spolupráci. Naše mise v zahraničí a mírové operace měly vždy za cíl podporovat a občas obnovovat řád založený na pravidlech. Je to role, v níž se snažíme vynikat, a pověst, kterou bychom měli zachovat." # todo: NEW TRANSLATION
 AST_centurians_of_the_pacific: "Centurioni Pacifiku" # todo: NEW TRANSLATION
 AST_centurians_of_the_pacific_desc: "Pravidla globálních intervencí se od přelomu nového století změnila. Národní bezpečnost nahradila tradiční občanské svobody a rámec prevence přijala po fundamentalistických útocích téměř každá západní země. Omezením se na pravidla minulosti nezískáme nové přátele ani neochráníme tuto zemi, ale pokud nezareagujeme správně, staneme se terčem." # todo: NEW TRANSLATION
 AST_the_costello_government: "Costellova vláda" # todo: NEW TRANSLATION
 AST_the_costello_government_desc: "Austrálie je nyní starší než 100 let a od federace ušla dlouhou cestu. Přestože máme jen zlomek obyvatelstva našich sousedních zemí, naše ekonomika se rychle stává jednou z největších na světě. Naši lidé viděli, jak země kolem nich bohatne a prosperuje více, než si předchozí generace kdy dokázaly představit, a přesto skutečné bohatství zůstává nevyužité. \n\nNáš potenciál zůstává těsně pod povrchem jako ropná žíla čekající na otevření. Peněžní správa dolů ustala a mnohá z našich největších odvětví zpohodlněla. Sociální dávky se staly mrtvou vahou našeho rozpočtu a malé podniky stále bojují o přístup ke stále se zmenšujícímu trhu. \n\nZpůsob našeho vládnutí se musí změnit." # todo: NEW TRANSLATION
 AST_a_bastion_for_commerce: "Bašta obchodu" # todo: NEW TRANSLATION
 AST_a_bastion_for_commerce_desc: "Jak se národy propojené Pacifikem sbližují, potřeba centrálního bodu pro obchod je stále zřejmější. Austrálie má nyní příležitost stát se majákem obchodu a spojit různé ekonomiky v jeden přístav, stejně jako před ní Konstantinopol a Benátky." # todo: NEW TRANSLATION
 AST_bring_in_the_chains: "Přiveďme řetězce" # todo: NEW TRANSLATION
 AST_bring_in_the_chains_desc: "Z dovozu kultur z celého světa jsme výrazně těžili. Korporace nejsou výjimkou. Již nyní máme přede dveřmi zástup těch, kteří žádají o možnost založit zde podnik. Říkám, pusťme je dovnitř." # todo: NEW TRANSLATION
 AST_domestic_demands: "Domácí požadavky" # todo: NEW TRANSLATION
 AST_domestic_demands_desc: "Názor, který sdílíme s dělníky naší země, je, že místní průmysl má význam. Silný domácí průmysl by měl odolat jakémukoli globálnímu hospodářskému poklesu, a proto se o něj s trochou péče postaráme." # todo: NEW TRANSLATION
 AST_outsource_the_troubles: "Přenesení problémů do zahraničí" # todo: NEW TRANSLATION
 AST_outsource_the_troubles_desc: "Nedostatek pracovníků se v posledních letech stal naší největší překážkou dalšího růstu. Jednoduše nemáme dost pracovníků, abychom zaplnili mezeru, a každé dlouhodobé řešení by znamenalo promarnit nejlepší roky pro expanzi. Musíme se poohlédnout v zahraničí." # todo: NEW TRANSLATION
 AST_come_one_come_all: "Přijďte všichni" # todo: NEW TRANSLATION
 AST_come_one_come_all_desc: "Naše peníze musí zůstat v Austrálii, přinejmenším naše mzdy. Nejlepší způsob, jak zaplnit mezeru na trhu práce, je zaměřit se na konečný výsledek. Tisíce lidí si chtějí vyzkoušet práci v Austrálii. Jediné, co musíme udělat, je otevřít dveře." # todo: NEW TRANSLATION
 AST_off_with_tariffs: "Uvolnění trhu" # todo: NEW TRANSLATION
 AST_off_with_tariffs_desc: "Liberální ekonomie zrodila koncept „hojnosti“. Myšlenku, že svobodnější trhy a volnější možnosti utrácení peněz nevyhnutelně vedou k lepší společnosti. Lákavý koncept, který naše podniky touží vyzkoušet. Zbývající zatěžující daně musí být odstraněny." # todo: NEW TRANSLATION
 AST_negotiate_with_the_rba_ast: "Vyjednávání s RBA" # todo: NEW TRANSLATION
 AST_negotiate_with_the_rba_ast_desc: "Trocha lichocení u Rezervní banky by nám mohla poskytnout prostor potřebný k nastartování hospodářského růstu. Naštěstí máme potřebné kontakty, abychom banku přesvědčili ke snížení úrokových sazeb a mezitím podpořili spotřebitelské výdaje." # todo: NEW TRANSLATION
 AST_fix_the_trade_woes: "Náprava obchodních potíží" # todo: NEW TRANSLATION
 AST_fix_the_trade_woes_desc: "Zatímco dovoz a vývoz zboží přes naši zemi vzrostl během velmi krátké doby na obrovskou úroveň, mezi našimi podniky se rozšířil i všeobecný zmatek ohledně obchodního systému. Obchodní deficity a neefektivní řízení snižují naše ziskové marže a zpomalují obchodní procesy. Bude zapotřebí vytvořit novou agenturu, která se bude věnovat uhlazení celého procesu." # todo: NEW TRANSLATION
 AST_adventure_in_the_usa: "Dobrodružství v USA" # todo: NEW TRANSLATION
 AST_adventure_in_the_usa_desc: "Amerika byla vždy a možná vždy bude naším největším investorem. Země Big Macu, domov svobodných a přítel všech. Bylo by pošetilé, kdybychom se na ni neobrátili s žádostí o další krok v našem hospodářském vývoji." # todo: NEW TRANSLATION
 AST_im_an_oil_man: "Jsem ropný magnát" # todo: NEW TRANSLATION
 AST_im_an_oil_man_desc: "Přímo se nabízí, abychom v této zemi rozvíjeli vlastní těžbu ropy. Máme vrty i vhodnou krajinu. Celý proces však trval příliš dlouho a naše vláda ho nyní urychlí. Ropa začne proudit." # todo: NEW TRANSLATION
 AST_for_queen_and_company: "Za královnu a společnost" # todo: NEW TRANSLATION
 AST_for_queen_and_company_desc: "Naše vstřícnost vůči Spojeným státům dostatečně rozvířila vody, aby nalákala některé anglické korporace k rozšíření podílu v našem zemědělském sektoru." # todo: NEW TRANSLATION
 AST_rail_endeavors: "Železniční úsilí" # todo: NEW TRANSLATION
 AST_rail_endeavors_desc: "S korporací Bechtel jsme již dříve spolupracovali na dálkových železničních tratích. Nyní chtějí spolu se státními vládami připravit výzkumný projekt rozvoje. Již nabídli parametry nových elektrických a dieselových modelů. Teď už je jen musíme schválit." # todo: NEW TRANSLATION
 AST_the_miracle_economy: "Zázračná ekonomika" # todo: NEW TRANSLATION
 AST_the_miracle_economy_desc: "Média již označují úspěch naší ekonomiky v této době za zázrak. Samozřejmě o žádný zázrak nejde. Náš úspěch vždy závisel na tom, zda zůstane naše úsudek a péče správný. A tak se výsledek našeho řízení, jako dobře udržovaná zahrada, rozkvetl v něco velkolepého." # todo: NEW TRANSLATION
 AST_ride_the_bubble: "Využít bublinu" # todo: NEW TRANSLATION
 AST_ride_the_bubble_desc: "Když před několika lety praskla internetová bublina, měli jsme pocit, jako by se na nás doslova řítilo nebe. Ceny akcií, které se vyšplhaly díky miliardovým investicím do výpočetní techniky, náhle splaskly a s nimi se ztratily další miliardy. Tentokrát zajistíme pevné základy pro investice do výpočetní techniky, infrastrukturu podporující růst a jen takovou regulaci, která zabrání dalšímu zhroucení systému." # todo: NEW TRANSLATION
 AST_silicon_dreams: "Křemíkové sny" # todo: NEW TRANSLATION
 AST_silicon_dreams_desc: "Ambice stát se jednoho dne technologicky nezávislým národem začíná naší schopností vyrábět komerční čipy. Začneme v malém: poskytneme finanční prostředky výzkumným skupinám zabývajícím se čipy a umožníme zkušební provoz ve Victorii." # todo: NEW TRANSLATION
 AST_jobs_for_the_needy: "Práce pro potřebné" # todo: NEW TRANSLATION
 AST_jobs_for_the_needy_desc: "Za přehlédnutí při zavádění programu Work For the Dole stále platíme. Pracovníci nikdy neměli být odebíráni soukromému průmyslu a využíváni na veřejné práce. Smyslem sociální péče má být dostat ty, kteří mohou pracovat, do zaměstnání. Jejím nástupcem se musí stát nový program." # todo: NEW TRANSLATION
 AST_keep_it_competitive: "Udržet konkurenceschopnost" # todo: NEW TRANSLATION
 AST_keep_it_competitive_desc: "Čím více průmyslově rosteme, tím větší je riziko pokřiveného trhu. Monopoly se mohou změnit v pohromu, pokud jim to dovolíme, a smutnou skutečností je, že regulace je nejbližší věcí k jisté obraně proti nim. Můžeme pracovat na úrovni států, koordinovat politiku a odtud pokračovat." # todo: NEW TRANSLATION
 AST_shatter_the_iron_curtain: "Rozbít železnou oponu" # todo: NEW TRANSLATION
 AST_shatter_the_iron_curtain_desc: "Studená válka pro Austrálii skončila, když jsme si v roce 73' potřásli rukou s Maem. Od té doby jsme si užívali přátelství, které přežilo stranickou politiku i globální krize. Bude třeba vytvořit fórum, které zajistí, že budoucnost naší spolupráce zůstane bezpečná a transparentní." # todo: NEW TRANSLATION
 AST_our_man_in_beijing: "Náš muž v Pekingu" # todo: NEW TRANSLATION
 AST_our_man_in_beijing_desc: "Alexander Downer, náš dlouholetý ministr zahraničí a nyní náměstek, se s čínskou vládou a její podnikatelskou třídou sblížil natolik, že někteří členové naší vlastní strany začali zpochybňovat, kde leží jeho loajalita. Bez ohledu na to budeme jeho vhled potřebovat, abychom z našeho nového partnerství získali něco smysluplného. Začneme příštím letem do Pekingu." # todo: NEW TRANSLATION
 AST_the_lithium_projects: "Projekty Greenbushe" # todo: NEW TRANSLATION
 AST_the_lithium_projects_desc: "Lithiové projekty společnosti Greenbushe se staly slibným rozvojem pro komunity v Západní Austrálii. Cílem je do konce projektu vyrábět ročně 1 milion tun lithia, čímž se staneme jedním z největších světových vývozců zpracovaného lithia. Nyní potřebují jen malý finanční impuls." # todo: NEW TRANSLATION
 AST_cater_to_investors: "Vyjít vstříc investorům" # todo: NEW TRANSLATION
 AST_cater_to_investors_desc: "Čínští developeři tvoří více než 60 procent našich zahraničních vlastníků půdy. Takové investice začínají tvořit páteř našeho odvětví rozvoje půdy a udržení jejich zájmů v souladu je nezbytné pro hladké pokračování těchto vztahů." # todo: NEW TRANSLATION
 AST_the_future_fund: "Fond budoucnosti" # todo: NEW TRANSLATION
 AST_the_future_fund_desc: "Původní myšlenkou fondu bylo pomoci pokrýt penze našich státních zaměstnanců, ale tento koncept by se dal velmi dobře využít k podpoře zahraničních investic našeho národa. Již nyní přinesl překvapivé částky od zahraničních investorů, zejména od belgické skupiny Euroclear, a nastal čas jej uvést do praxe." # todo: NEW TRANSLATION
 AST_a_friendly_union: "Přátelštější unie" # todo: NEW TRANSLATION
 AST_a_friendly_union_desc: "Jedna unie, která nám neleze na záda, je ta evropská. Dosáhli jsme pokroku při organizaci omezení prodeje evropských automobilů v naší zemi, alespoň na několik příštích let. Návštěva sídla EU by mohla věci uvést do pohybu a dát našim spotřebitelům několik zajímavých nových možností." # todo: NEW TRANSLATION
 AST_fechado: "Fechado!" # todo: NEW TRANSLATION
 AST_fechado_desc: "Rostoucí prosperita brazilského těžebního průmyslu neušla našim těžařům, kteří nás požádali o uvolnění dovozních předpisů pro těžební zařízení. Náklady by pro nás byly malé a přiblížili bychom se našim přátelům ze skupiny G20." # todo: NEW TRANSLATION
 AST_the_republic_question: "Otázka republiky" # todo: NEW TRANSLATION
 AST_the_republic_question_desc: "Od federace zůstává Austrálie de facto poddaným anglické koruny. Naše ústava je monarchistická a hlavou státu je stále panovník Spojeného království. Nějakou dobu to fungovalo, ale duch doby je demokratický. Lidi do úřadů nejmenujeme dědičně. V naší společnosti a naší době dáváme přednost jmenování podle zásluh. \n\nAustrálie bude mít svůj den jako skutečně nezávislý národ." # todo: NEW TRANSLATION
 AST_how_we_sell_it: "Jak to prodáme" # todo: NEW TRANSLATION
 AST_how_we_sell_it_desc: "Získání lidové podpory pro naše referendum bude poslední překážkou v závodu. Bude zapotřebí celostátní většina všech voličů a podpora čtyř ze šesti našich států a teritorií. Bez získání srdcí a myslí veřejnosti půjde o nemožný úkol. Musíme rozhýbat mediální stroje a začít osobně shromažďovat podporu." # todo: NEW TRANSLATION
 AST_send_it_through: "Prosadit to" # todo: NEW TRANSLATION
 AST_send_it_through_desc: "Po neúspěchu referenda v roce 1999 se téma republiky pro většinu parlamentu znechutilo jako špatné znamení. Oproti minule jsme ve značné nevýhodě. Možná budeme muset někomu zakroutit rukou, aby se věci daly do pohybu." # todo: NEW TRANSLATION
 AST_our_commonwealth: "Náš Commonwealth" # todo: NEW TRANSLATION
 AST_our_commonwealth_desc: "Nemůžeme téměř dvě století historie a příbuzenství jen tak zahodit do větru. Zvláště během přechodného období, jako je toto. Opětovné potvrzení našeho závazku vůči Commonwealthu by mohlo uklidnit některé monarchisty, kteří stále váhají." # todo: NEW TRANSLATION
 AST_free_from_binds: "Osvobození od pout" # todo: NEW TRANSLATION
 AST_free_from_binds_desc: "Náš odchod od monarchie nemůže být polovičatý. Naše vazby na korunu musí být přerušeny a s nimi i měkká přikrývka, která nám po všechna ta léta poskytovala pohodlí. Změna, kterou potřebujeme, je taková, po níž zůstanou řezné rány a modřiny poté, co prorazíme skleněný strop. Nebude to snadné." # todo: NEW TRANSLATION
 AST_run_the_games: "Pořádat hry" # todo: NEW TRANSLATION
 AST_run_the_games_desc: "Každé čtyři roky se naši sportovci oblékají, aby soutěžili na Hrách Commonwealthu, multisportovní podívané podobné olympijským hrám, která sdružuje lidi z celého světa Commonwealthu národů. Načasování by mohlo být ideální pro žádost o pořádání nadcházejících her." # todo: NEW TRANSLATION
 AST_kowtow_to_the_crown: "Poklonit se koruně" # todo: NEW TRANSLATION
 AST_kowtow_to_the_crown_desc: "Obdržení oficiálního požehnání monarchie konečně umlčí opoziční frakci, byť za cenu odcizení několika našich vlastních republikánů. Jakmile však začnou přicházet hlasy, sotva zůstanou kritičtí." # todo: NEW TRANSLATION
 AST_crossing_the_floor: "Přeběhnutí přes lavice" # todo: NEW TRANSLATION
 AST_crossing_the_floor_desc: "Hlavy labouristů se budou smíchy válet po zemi, až uslyší, že je potřebujeme k hlasování. Nebude snadné je pokořit a nepochybně si budou klást vlastní podmínky, ale cesta vpřed vede vpřed. Ať chceme, nebo ne, prozatím jsou našimi novými spojenci." # todo: NEW TRANSLATION
 AST_approaching_the_governor: "Přiblížit se generálnímu guvernérovi" # todo: NEW TRANSLATION
 AST_approaching_the_governor_desc: "Poslední krok procesu. Situace je poněkud trapná, vzhledem k tomu, že generálnímu guvernérovi předáváme jeho vlastní rezignaci. Můžeme jen doufat, že to přijme dobře." # todo: NEW TRANSLATION
 AST_a_shining_example: "Zářný příklad" # todo: NEW TRANSLATION
 AST_a_shining_example_desc: "Musíme být příkladem úspěšné demokracie pro národy Pacifiku. Náš úspěch v tomto velkém úkolu bude svědectvím nejen pro region, ale i pro celý svět. I v tomto věku naší země můžeme odhodit okovy kontroly." # todo: NEW TRANSLATION
 AST_no_kings: "Žádní králové" # todo: NEW TRANSLATION
 AST_no_kings_desc: "Mechanismy naší nové ústavy musí odrážet realitu moderních politických změn. Žádný systém nemůže být imunní vůči vlastnímu zániku, ale může být odolný. Moc bude rozdělena a pod dohledem, s pojistkami třetích stran, které zajistí, aby autoritářské a reakční myšlenky zůstaly pod kontrolou." # todo: NEW TRANSLATION
 AST_endow_the_arts: "Podpořit umění" # todo: NEW TRANSLATION
 AST_endow_the_arts_desc: "Svoboda projevu je jedním ze základů demokracie a platí to již od Eureka Stockade. Upřímně řečeno, investice do umění bývá obvykle plýtváním, ale pokud je nyní něco, vůči čemu musíme působit citlivě, je to kultura." # todo: NEW TRANSLATION
 AST_hold_onto_the_wild: "Uchovat divočinu" # todo: NEW TRANSLATION
 AST_hold_onto_the_wild_desc: "Ve snaze podpořit více lesů na předměstích získají vlastníci půdy, kteří se rozhodnou trvale vyčlenit část nebo celý svůj pozemek na ochranu přírody, nižší daňovou povinnost v rámci daně z kapitálových výnosů. Zároveň můžeme zajistit, aby ochrana národních parků byla zakotvena v naší nové ústavě. Tím je uchováme v bezpečí po desetiletí." # todo: NEW TRANSLATION
 AST_a_generation_to_persevere: "Generace, která vytrvá" # todo: NEW TRANSLATION
 AST_a_generation_to_persevere_desc: "Budoucnost našeho národa je zcela v rukou generací, které přijdou po nás. Péče o ně a zajištění dostatečných znalostí pro jejich rozkvět je zásadní pro zachování našeho způsobu života. Vzdělání se musí stát ústavním právem, zaručeným naším commonwealthem." # todo: NEW TRANSLATION
 AST_enshrine_the_protections: "Zakotvit ochranu" # todo: NEW TRANSLATION
 AST_enshrine_the_protections_desc: "Další krok při úpravě naší ústavy by měl být významný. Nejen pro systémy správy, ale i pro naše občany. O úrovni práv těch nejzranitelnějších by neměl rozhodovat ten, kdo právě sedí v největším křesle v Canbeře. Jejich práva musí být zakotvena v ústavě a do budoucna učiněna trvalými. \n\nAustrálie není zemí, kde jsou chráněni jen někteří, ale zemí, kde jsou chráněni všichni. Tečka." # todo: NEW TRANSLATION
 AST_modernize_the_communities: "Modernizovat komunity" # todo: NEW TRANSLATION
 AST_modernize_the_communities_desc: "Připravujeme řadu programů zaměřených na směrování většího počtu zakázek do komunit s nižšími příjmy. Cílem je přinést práci těm, kteří ji nemají, a zlepšit obraz menších, zápasících měst." # todo: NEW TRANSLATION
 AST_with_heritage_to_remember: "S dědictvím, na které lze vzpomínat" # todo: NEW TRANSLATION
 AST_with_heritage_to_remember_desc: "Cesta usmíření v mnoha ohledech vstupuje do další fáze. Ruka podpory se musí znovu natáhnout, tentokrát však proto, aby sama něco předala. \n\nZměna ústavy, která místním tradičním vlastníkům umožní vyjednávat formální smlouvy týkající se ochrany a suverenity nad půdou spolu s právy schvalovat rozvoj, předá vedení procesu usmíření komunitě. Místní komunity tak získají právo na vlastní budoucnost a schopnost chránit svou minulost." # todo: NEW TRANSLATION
 AST_one_last_push: "Ještě jeden poslední tah" # todo: NEW TRANSLATION
 AST_one_last_push_desc: "Máme mandát. Hlasy se sčítají. Můžeme jen doufat, že tentokrát stojí historie na naší straně." # todo: NEW TRANSLATION
 AST_a_new_constitution: "Nová ústava" # todo: NEW TRANSLATION
 AST_a_new_constitution_desc: "Další éra australské správy leží před námi. Krok, který nyní učiníme, hlučný, možná dokonce trochu pošetilý, připraví půdu pro historické knihy. Na tomto kameni budujeme budoucnost národa, naši novou ústavu." # todo: NEW TRANSLATION
 AST_the_mining_snag: "Těžební zádrhel" # todo: NEW TRANSLATION
 AST_the_mining_snag_desc: "Těžební průmysl byl v posledních letech skutečně nejednou nešetrně zacházen, přesto nemůžeme ignorovat hříchy tohoto sektoru. Musí vzniknout porozumění mezi námi, potřebami vlády a právy průmyslníků. Bude zprostředkováno příměří." # todo: NEW TRANSLATION
 AST_a_little_of_this: "Trochu od každého" # todo: NEW TRANSLATION
 AST_a_little_of_this_desc: "Několik velkých společností s podíly v dolech investuje také do těžby dřeva. Toto odvětví po letech odporu ekologických skupin přišlo o své výnosy. Otevření části státních lesů těžbě a zrušení jednoho či dvou předpisů nám může získat část přízně, kterou potřebujeme." # todo: NEW TRANSLATION
 AST_formal_investigation: "Formální vyšetřování" # todo: NEW TRANSLATION
 AST_formal_investigation_desc: "Systematické donucování a klientelismus jsou běžným výsledkem toho, že se těžební průmysl stal příliš politizovaným. Nemůžeme odstranit veškerou hnilobu, ale můžeme věci rozvířit formální komisí pro vyšetřování dolů, jejímž cílem bude odhalit část zjevné korupce na povrchu." # todo: NEW TRANSLATION
 AST_for_a_bit_of_that: "Trochu z toho" # todo: NEW TRANSLATION
 AST_for_a_bit_of_that_desc: "Každá stížnost z dolů se obvykle týká příliš tvrdé regulace. Lobují proti ní a jejich mediální kampaně se jí staví na odpor. Prakticky nám buší na dveře a žádají její odstranění. Když jim zároveň nabídneme dočasné zmírnění, mohlo by jim to otevřít mysl reformě." # todo: NEW TRANSLATION
 AST_training_the_next_miners: "Výcvik nové generace horníků" # todo: NEW TRANSLATION
 AST_training_the_next_miners_desc: "Odborné vzdělávání na TAFE by nám mělo poskytnout nejrychlejší způsob, jak vycvičit nové pracovníky pro toto odvětví, s malými náklady pro ně a dokonce s drobnou pobídkou pro ty, kteří si tuto cestu zvolí." # todo: NEW TRANSLATION
 AST_when_opportunity_calls: "Když příležitost klepe" # todo: NEW TRANSLATION
 AST_when_opportunity_calls_desc: "Ministerstvo zahraničí se vrátilo z Blízkého východu s nabídkou přímo od rodu Saúdů na zajímavou spolupráci v oblasti těžby. Jde o první kontakt, který jsme s nimi na toto téma měli, a ať už zamýšlejí cokoli, mohlo by to být příliš lukrativní na odmítnutí." # todo: NEW TRANSLATION
 AST_tussle_with_the_media: "Přetahovaná s médii" # todo: NEW TRANSLATION
 AST_tussle_with_the_media_desc: "Nemůžeme nechat těžařské korporace, aby rozhodovaly o všem. I přes odpor Murdochových médií můžeme v tisku prosadit svůj názor a odhalit některé z našich zjištění v celostátní televizi." # todo: NEW TRANSLATION
 AST_war_with_the_party: "Válka se stranou" # todo: NEW TRANSLATION
 AST_war_with_the_party_desc: "Vzhledem k současné síle kampaně proti nám se někteří členové strany začínají rozcházet. Buď se přidávají k médiím v odmítání naší vlády, nebo se od nás snaží distancovat. Musíme přejít do útoku. Shromáždit dezertéry a izolovat hlasité kritiky od médií. Musíme jim dát najevo, že stále velíme." # todo: NEW TRANSLATION
 AST_no_gas_all_breaks: "Žádný plyn, plné brzdy" # todo: NEW TRANSLATION
 AST_no_gas_all_breaks_desc: "Musíme se rozejít se stranickou tradicí podpory dolů. Příležitosti v našem sektoru obnovitelných zdrojů se každý den rozvíjejí a zlepšují. Iberdrola má ve Victorii několik úspěšných elektráren. S trochou vládního financování a souhlasu začne působit po celé zemi." # todo: NEW TRANSLATION
 AST_the_processing_debacle: "Fiasko zpracování" # todo: NEW TRANSLATION
 AST_the_processing_debacle_desc: "V důsledku našich zjištění na nás byl vyvinut značný tlak, abychom našli řešení pro tyto přistěhovalce. Nebude to snadná volba, ale pro nás tomu tak málokdy bývá." # todo: NEW TRANSLATION
 AST_bowen_expansion: "Rozšíření Bowenu" # todo: NEW TRANSLATION
 AST_bowen_expansion_desc: "Společnost BHP požádala o urychlené schválení svého nového potrubí v Bowenově pánvi v Queenslandu. Jeho účelem je výrazně zrychlit tamní výrobu oceli. Ekologické skupiny se ozvaly proti trase, která prochází biotopy koal, ale zástupci projektu nás ujistili, že škody budou minimální." # todo: NEW TRANSLATION
 AST_fortescue_lines: "Linie Fortescue" # todo: NEW TRANSLATION
 AST_fortescue_lines_desc: "Naše největší centrum těžby železné rudy se nachází v Západní Austrálii a spravuje ho společnost Fortescue. Pozvali nás ke společné investici do projektu Magnetite, který by dodával větší objemy rudy s nižšími emisemi. V tomto případě by to mohlo zmírnit tlak na nás, pokud bychom vyšli vstříc dolům i ekologům." # todo: NEW TRANSLATION
 AST_secure_resource_tax: "Zajistit daň z přírodních zdrojů" # todo: NEW TRANSLATION
 AST_secure_resource_tax_desc: "Konečně máme naši první komplexní daň z renty přírodních zdrojů, zaměřenou na řešení některých daňových neefektivit během těžebního boomu. Díky ustanovením, která zajistí, že naše menší podniky a doly nebudou znevýhodněny, začne do rozpočtu proudit nový zdroj příjmů bez dopadu na produktivitu." # todo: NEW TRANSLATION
 AST_an_open_ear: "Naslouchat" # todo: NEW TRANSLATION
 AST_an_open_ear_desc: "Klimatická omezení našich předchůdců uvrhla celý průmysl do chaosu tím, jak omezující se stala. Jak můžeme doufat v konkurenceschopnost, když okolní národy nesou jen malou část nákladů? Je třeba přijmout mírnější regulační přístup a současná omezení dočasně pozastavit, dokud nenajdeme rozumné řešení." # todo: NEW TRANSLATION
 AST_olympic_dam_developments: "Rozvoj Olympic Dam" # todo: NEW TRANSLATION
 AST_olympic_dam_developments_desc: "Společnost Western Mining Corporation nás oslovila s návrhem společného výzkumného projektu využívajícího uranový důl Olympic Dam. Zároveň jsme obdrželi velmi hlasité protesty proti dolu, uvnitř i vně parlamentu, kvůli jeho dopadům na místní komunitu. Jakékoli rozšíření dolu a tamních zařízení vyvolá odpor, ale jen stěží jde o něco, co bychom nedokázali ustát." # todo: NEW TRANSLATION
 AST_changing_the_system: "Změnit systém" # todo: NEW TRANSLATION
 AST_changing_the_system_desc: "V řízení tohoto odvětví jsme ušli dlouhou cestu. Zisky nyní přicházejí čistší a ve větším objemu než kdy dříve. Stále lze mnoho zlepšit, ale prozatím se můžeme ohlédnout a obdivovat vykonanou práci." # todo: NEW TRANSLATION
 AST_the_turnbull_government: "Turnbullova vláda" # todo: NEW TRANSLATION
 AST_the_turnbull_government_desc: "Tento fokus je zástupný. Fokusový strom Turnbullovy vlády se vyvíjí a brzy bude vydán!" # todo: NEW TRANSLATION
 corroboree_event.1.t: "Projev na Corroboree" # todo: NEW TRANSLATION
 corroboree_event.1.d: "Howard stál za starším mužem, když uváděl [GetASTLeaderTitle]. Ten měl pronést svůj projev na Corroboree, což se od jeho zvolení stalo charakteristickým rysem jeho kampaní i stylu vedení. Tentokrát však bude dav chladný. Když pronášel svou rétoriku o „praktickém usmíření“ a umírněném přístupu, neozývaly se žádné vášnivé výkřiky. Mnozí z davu čekali celé hodiny a zdálo se, že nikdo z nich nebyl ohromen tím, co vypadalo jako další prázdné sliby pokroku. Někteří odešli a další při odchodu skandovali, zatímco na protest otáčeli zády. \n\nPo projevu a vlažném potlesku hovořil Howard dlouze se staršími. Nepřistoupil na omluvu ani na žádná gesta, která považoval za „prázdná“. Strany se nakonec rozešly a po nějakou dobu viselo ve vzduchu zklamání." # todo: NEW TRANSLATION
 corroboree_event.1.a: "Mohlo to dopadnout hůř..." # todo: NEW TRANSLATION
 mining_giants_talk.1.t: "Setkání s obry" # todo: NEW TRANSLATION
 mining_giants_talk.1.d: "Jak se očekávalo, různí šéfové těžebních společností požádali o prodloužení našich daňových úlev, aby mohli využít pokračujícího těžebního boomu. Tvrdí, že ušetřené prostředky jim umožní dlouhodobě rozšířit provoz. Dodatečná úleva je malá a naše finance pravděpodobně neohrozí, ale můžeme žádost odmítnout a jednoduše ponechat vše při starém. Případně můžeme zvýšit daňovou sazbu a sami získat část zisků z boomu, s malými okamžitými důsledky." # todo: NEW TRANSLATION
 mining_giants_talk.1.a: "Dejte jim daňovou úlevu." # todo: NEW TRANSLATION
 mining_giants_talk.1.b: "Ponechme vše při starém." # todo: NEW TRANSLATION
 mining_giants_talk.1.c: "Zvyšte daňovou sazbu a vezměme si svůj podíl." # todo: NEW TRANSLATION
 civil_partnership_act.1.t: "Zákon o registrovaném partnerství schválen v celé zemi" # todo: NEW TRANSLATION
 civil_partnership_act.1.d: "Tisíce zastánců shromážděných před Capital Hill byly prvními svědky toho, jak Peter Costello oznámil, že první legislativa uznávající manželství prošla téměř jednomyslně. Návrh napříč stranami prošel poté, co celostátní poštovní průzkum dodal reformě bezprecedentní momentum. \n\nNávrh předložila Koalice, která dříve uznávala pouze koncept tradičního manželství, a podpořili jej téměř všichni členové Labouristů a Zelených. Schválení proto mnohé v davu šokovalo a vyvolalo směs slz a radosti. Costello poznamenal, že zákon není jen krokem pro práva gayů, ale „právy všech Australanů“ a že dveře budoucím reformám zůstávají otevřené. Páry budou stále muset uzavřít sňatek mimo zemi, ale ti, kteří již sezdaní jsou, nyní budou moci své partnerství právně uznat." # todo: NEW TRANSLATION
 civil_partnership_act.1.a: "Dobře jim tak." # todo: NEW TRANSLATION
 the_national_apology.1.t: "Národní omluva" # todo: NEW TRANSLATION
 the_national_apology.1.d: "Po počátečním dojmu, že se věci zbytečně protahují, pronesl John Howard oficiální celostátní „omluvu“ za historická bezpráví vůči původnímu obyvatelstvu země: Aboridžincům a obyvatelům Torresova průlivu. \nHistorické gesto, založené na zprávě Bringing Them Home z roku 1997, přednesl v parlamentu [GetASTLeaderTitle] a vyvolalo emocionální otřes napříč Austrálií. Davy ve Velkém sále i na trávnících před parlamentem jásaly a tleskaly. Několik tisíc lidí se v dešti shromáždilo v ulicích Sydney, aby sledovalo tento významný projev. Komunitu naplnil hluboký pocit úlevy a uzdravení a mnozí v ní označují snahy Koalice o usmíření za nepochybný úspěch." # todo: NEW TRANSLATION
 the_national_apology.1.a: "Je čas jít dál." # todo: NEW TRANSLATION
 pacific_solution.1.t: "Pacifické řešení" # todo: NEW TRANSLATION
 pacific_solution.1.d: "Australská vláda nás oslovila s návrhem týkajícím se zařízení pro zpracování žádostí mimo území Austrálie. Výměnou za hostování těchto zařízení nabídla výrazné zmodernizování místní infrastruktury a zařízení námořních přístavů na podporu jejich provozu." # todo: NEW TRANSLATION
 pacific_solution.1.a: "Přijmout australské investice." # todo: NEW TRANSLATION
 pacific_solution.1.b: "Naše suverenita není na prodej." # todo: NEW TRANSLATION
 pacific_solution.3.t: "Papua-Nová Guinea přijímá" # todo: NEW TRANSLATION
 pacific_solution.3.d: "Naštěstí vláda Papuy-Nové Guineje s naším návrhem souhlasila. Výstavba nových zařízení pro zpracování žádostí brzy začne." # todo: NEW TRANSLATION
 pacific_solution.3.a: "Podle očekávání." # todo: NEW TRANSLATION
 pacific_solution.4.t: "Papua-Nová Guinea odmítá" # todo: NEW TRANSLATION
 pacific_solution.4.d: "Naši sousedé návrh odmítli s odvoláním na obavy o suverenitu a odpor místního obyvatelstva. Budeme muset najít jinou cestu." # todo: NEW TRANSLATION
 pacific_solution.4.a: "Zklamání." # todo: NEW TRANSLATION
 pacific_solution.5.t: "Nauru přijímá" # todo: NEW TRANSLATION
 pacific_solution.5.d: "Regionální vláda Nauru náš návrh přijala. Další krok v našich pacifických operacích proběhl bez potíží." # todo: NEW TRANSLATION
 pacific_solution.5.a: "Podle očekávání" # todo: NEW TRANSLATION
 pacific_solution.6.t: "Pacifické řešení odmítnuto" # todo: NEW TRANSLATION
 pacific_solution.6.d: "Nauru návrh odmítlo. Zdá se, že nám nepomůže s našimi imigračními problémy a místo toho se rozhodlo zůstat izolované v Pacifiku." # todo: NEW TRANSLATION
 pacific_solution.6.a: "To je katastrofa..." # todo: NEW TRANSLATION
 stomp_out_the_roots.1.t: "Austrálie nabízí spolupráci v boji proti terorismu" # todo: NEW TRANSLATION
 stomp_out_the_roots.1.d: "Australská vláda navrhla společnou bezpečnostní iniciativu zaměřenou na likvidaci extremistických buněk v naší zemi. Nabízí rozsáhlou taktickou podporu a sdílení zpravodajských informací." # todo: NEW TRANSLATION
 stomp_out_the_roots.1.a: "Spolupracujme pro bezpečnější Indonésii." # todo: NEW TRANSLATION
 stomp_out_the_roots.1.b: "O svou vnitřní bezpečnost se dokážeme postarat sami." # todo: NEW TRANSLATION
 stomp_out_the_roots.2.t: "Indonésie souhlasí se spoluprací" # todo: NEW TRANSLATION
 stomp_out_the_roots.2.d: "Jakarta náš návrh oficiálně přijala. Naše operace na jejím území mohou okamžitě začít a naše zpravodajské služby již zajišťují přesun." # todo: NEW TRANSLATION
 stomp_out_the_roots.2.a: "Začátek silného partnerství." # todo: NEW TRANSLATION
 stomp_out_the_roots.3.t: "Jakarta odmítá společnou iniciativu" # todo: NEW TRANSLATION
 stomp_out_the_roots.3.d: "Indonéská vláda naši nabídku vojenské spolupráce odmítla a dává přednost tomu, aby se s touto záležitostí vypořádala sama." # todo: NEW TRANSLATION
 stomp_out_the_roots.3.a: "Jejich škoda." # todo: NEW TRANSLATION
 state_visit: "Státní návštěva" # todo: NEW TRANSLATION
 ast_off_to_delhi.1.t: "Návštěva Indie" # todo: NEW TRANSLATION
 ast_off_to_delhi.1.d: "Když Howard vystoupil z letadla, až k pódiu ho provázely úsměvy a potřásání rukama. Od získání nezávislosti jsme spolu udržovali vlažné vztahy. Dostatečně dobré na to, abychom se neurazili. Nyní jsme se setkávali už počtvrté během tohoto měsíce. Místní média si vychutnávala příležitost ukázat zahraničním představitelům přitažlivost Indie a neztrácela čas kritikou Howardovy domácí politiky. To však vládu neodradilo. Uran bychom vyváželi rychleji než kterýkoli jiný okolní stát a oni by se usmívali a přikyvovali při slibu, že nedojde k obohacování, zatímco my bychom se usmívali s nimi. Na konci dne to byl další krok vpřed pro Austrálii. Výhody jsme sklízeli my a každé potřesení rukou nás přibližovalo k pozici největšího vývozce v Pacifiku." # todo: NEW TRANSLATION
 ast_off_to_delhi.1.a: "Výhra pro oba národy." # todo: NEW TRANSLATION
 ast_trade_deal: "Velká obchodní dohoda" # todo: NEW TRANSLATION
 ast_trade_agreement: "Obchodní dohoda" # todo: NEW TRANSLATION
 refused_trade_deal: "Naše obchodní dohoda odmítnuta" # todo: NEW TRANSLATION
 marks_trade.1.t: "Austrálie nabízí obchodní spolupráci" # todo: NEW TRANSLATION
 marks_trade.1.d: "Ve snaze posílit regionální hospodářské vazby nás australská vláda oslovila s návrhem obchodní dohody bez cel. Návrh zahrnuje zmírnění omezení dovozu naší elektroniky výměnou za výhradní práva k těžbě nerostných surovin. Oba naše národy by z většího toku zboží mezi námi výrazně prosperovaly, volba však zůstává na nás." # todo: NEW TRANSLATION
 marks_trade.1.a: "Čeká nás prosperující partnerství." # todo: NEW TRANSLATION
 marks_trade.1.b: "Naše trhy musí zůstat chráněné." # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.1.t: "Austrálie navrhuje mírovou iniciativu" # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.1.d: "Vláda v Canbeře nás oslovila s plánem společných mírových operací s cílem chránit stabilitu Pacifiku. Návrh by se stal základem vojenské spolupráce mezi námi, konkrétně v oblasti boje proti terorismu. Zahrnuje také budoucí plány na sdílení zpravodajských informací. Můžeme nabídku nyní přijmout a případné změny řešit později, nebo ji rovnou odmítnout." # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.1.a: "Mír je jedinou cestou vpřed." # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.1.b: "O bezpečnost Pacifiku se postaráme sami." # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.2.t: "Dohoda uzavřena" # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.2.d: "Peking na náš návrh reagoval příznivě. Naše mírová iniciativa je oficiálně zahájena a přislíbili, že se k nám brzy připojí, aby tento krok upevnili." # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.2.a: "Budeme je bedlivě sledovat." # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.3.t: "Návrh odmítnut" # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.3.d: "Naše nabídka vzájemného mírového paktu se setkala s chladnou lhostejností pekingské vlády. Jejich diplomaté odpověděli obavami o vlastní suverenitu v Pacifiku." # todo: NEW TRANSLATION
 ast_our_capacity_for_peace.3.a: "Pak budeme stát sami." # todo: NEW TRANSLATION
 fossil_fuels.1.t: "Fosilní paliva za jüany" # todo: NEW TRANSLATION
 fossil_fuels.1.d: "Austrálie navrhla masivní rozšíření vývozu uhlí, které má zásobovat naše rostoucí průmyslová odvětví. Výměnou za výhodné směnné kurzy jsou připraveni stát se naším hlavním energetickým partnerem." # todo: NEW TRANSLATION
 fossil_fuels.1.a: "Průmyslové stroje potřebují palivo." # todo: NEW TRANSLATION
 fossil_fuels.1.b: "Uhlí si zajistíme po svém." # todo: NEW TRANSLATION
 fossil_fuels.2.t: "Fosilní paliva za jüany" # todo: NEW TRANSLATION
 fossil_fuels.2.d: "V návaznosti na naši stávající mírovou iniciativu Austrálie navrhla komplexní obchodní pakt. Zajištěním dodavatelských tras energie prostřednictvím programu „Fosilní paliva za jüany“ dále upevníme naši energetickou bezpečnost a zásobování." # todo: NEW TRANSLATION
 fossil_fuels.2.a: "Naše partnerství ještě více sílí." # todo: NEW TRANSLATION
 fossil_fuels.2.b: "Jejich spolupráce bude dostačující." # todo: NEW TRANSLATION
 fossil_fuels.3.t: "Dohoda o uhlí podepsána" # todo: NEW TRANSLATION
 fossil_fuels.3.d: "Čínská vláda se zdráhala zavázat k dlouhodobým závazkům v oblasti fosilních paliv. Prozatím přijala skromný návrh vývozu, který doplní její zásoby. Náš těžební sektor již připravuje provedení dohody." # todo: NEW TRANSLATION
 fossil_fuels.3.a: "Vynikající." # todo: NEW TRANSLATION
 fossil_fuels.4.t: "Návrh na vývoz fosilních paliv odmítnut" # todo: NEW TRANSLATION
 fossil_fuels.4.d: "Čína odmítla všechny naše nabídky na rozšíření vývozu uhlí a odvolala se na svou snahu o energetickou nezávislost." # todo: NEW TRANSLATION
 fossil_fuels.4.a: "Promarněná příležitost." # todo: NEW TRANSLATION
 fossil_fuels.5.t: "Čínský protinávrh" # todo: NEW TRANSLATION
 fossil_fuels.5.d: "Čínští delegáti po obdržení našeho návrhu na rozšíření vývozu uhlí překvapivě přišli s vlastní nabídkou. Nabídli prioritní obchodní dohody pokrývající širokou škálu čínské elektroniky a zboží výměnou za téměř bezcelní obchod s naším uhlím a dalšími nerostnými surovinami. Lepší výsledek jsme si nemohli přát. Vedoucí představitelé našeho průmyslu horečně zajišťují vývoz, dokud dohoda platí." # todo: NEW TRANSLATION
 fossil_fuels.5.a: "Naše šťastná série pokračuje." # todo: NEW TRANSLATION
 ast_jap_trade.1.t: "Obchodní jednání s Austrálií" # todo: NEW TRANSLATION
 ast_jap_trade.1.d: "Po týdnech jednání s Australany vznikla první podoba komplexní obchodní dohody. Její podmínky zahrnují vývoz velkého množství zemědělských produktů k nám výměnou za snížení jejich cel na naši elektroniku a automobily. To by mohlo zajistit stabilní dodávky potravin, ale mohli bychom využít příležitosti a požadovat více." # todo: NEW TRANSLATION
 ast_jap_trade.1.a: "Přijmout navržené podmínky" # todo: NEW TRANSLATION
 ast_jap_trade.1.b: "Požadovat přednostní práva na jejich drahé nerosty" # todo: NEW TRANSLATION
 ast_jap_trade.1.c: "Podmínky jsou nevýhodné" # todo: NEW TRANSLATION
 ast_jap_trade.2.t: "Japonská obchodní dohoda podepsána" # todo: NEW TRANSLATION
 ast_jap_trade.2.d: "Delegace v Tokiu oznámila, že jednání byla úspěšná. Je to poprvé, co Japonsko sjednalo komplexní dohodu o hospodářském partnerství nebo dohodu o volném obchodu s významnou ekonomikou, natož s námi. To představuje zásadní obrat v našich vztazích a může být základem silnějšího partnerství na mnoho let." # todo: NEW TRANSLATION
 ast_jap_trade.2.a: "Na zdraví!" # todo: NEW TRANSLATION
 ast_jap_trade.3.t: "Japonsko požaduje práva k nerostným surovinám" # todo: NEW TRANSLATION
 ast_jap_trade.3.d: "Jednání nabrala nový směr. Nyní požadují přednostní přístup k našim ložiskům drahých nerostů, aby podpořili svůj rostoucí technologický průmysl a vyrovnali náklady na snížení cel. To by vážně zatížilo dostupnost zdrojů pro naši domácí ekonomiku a celkově učinilo dohodu méně výhodnou. Mohli bychom je přimět k návratu k původní dohodě, ale tím bychom mohli ohrozit celá jednání." # todo: NEW TRANSLATION
 ast_jap_trade.3.a: "Souhlasit s novými podmínkami a zajistit dohodu" # todo: NEW TRANSLATION
 ast_jap_trade.3.b: "Trvat na svém. Požadovat původní dohodu" # todo: NEW TRANSLATION
 ast_jap_trade.4.t: "Obchodní návrh odmítnut" # todo: NEW TRANSLATION
 ast_jap_trade.4.d: "Delegace v Tokiu oznámila, že jednání ztroskotala. Zdá se, že opustili zasedací místnost bez sebemenšího náznaku další diskuse. Naše plány na uzavření dohody jsou v podstatě mrtvé. To sice vážně omezuje naše obchodní plány, ale stále můžeme prozkoumat jiné možnosti." # todo: NEW TRANSLATION
 ast_jap_trade.4.a: "Prozatímní neúspěch" # todo: NEW TRANSLATION
 ast_jap_trade.5.t: "Austrálie trvá na svém" # todo: NEW TRANSLATION
 ast_jap_trade.5.d: "Delegáti z Canberry trvají na původní nabídce a odmítají jakákoli jednání o právech k nerostným surovinám. Jasně uvedli, že nabídka zemědělských dovozů výměnou za snížení cel je konečná." # todo: NEW TRANSLATION
 ast_jap_trade.5.a: "Možná jsme jednali unáhleně." # todo: NEW TRANSLATION
 ast_jap_trade.5.b: "Pak není o čem jednat." # todo: NEW TRANSLATION
 base_state_visit.1.t: "Návštěva Spojených států" # todo: NEW TRANSLATION
 base_state_visit.1.d: "Howard již v roce 1999 navštívil Bílý dům během jednání o clech. Tehdy pršelo a symbolicky pršelo i tentokrát. Po setkání s prezidentem prošel hlavními dveřmi k zástupu reportérů s deštníky. V USA bylo všechno velké. Jejich obchody byly velké, jejich kostely byly velké. Prezidentovo sídlo bylo obzvlášť velké. Austrálie neměla nic srovnatelného, a už vůbec ne tak velkolepého. Dalo by se říct, že si tím něco kompenzovali, ale skutečně měli všechno a my bychom si nakonec museli sednout k jednacímu stolu, abychom získali svůj podíl. Ať už šlo o záruky pacifické obrany nebo obchodní zakázky, Austrálie by musela dokázat, že je cenným partnerem. Stejně jako ve Vietnamu a Koreji bychom byli připraveni i na další konflikt." # todo: NEW TRANSLATION
 base_state_visit.1.a: "Pro náš klid." # todo: NEW TRANSLATION
 base_state_visit.2.t: "Návštěva Číny" # todo: NEW TRANSLATION
 base_state_visit.2.d: "Když Howard přistál v Pekingu, jako první ho přivítal čínský premiér. Kolem nich se vznášela čínská média a premiér je odvedl do nedaleké restaurace, kde měli prodiskutovat možnosti obchodu. Čína byla velmi dychtivým partnerem pro jednání, ale spolupráce s ní měla vždy své podmínky. Howard nezapomínal na realitu jejího autoritářství a při každé diskusi bylo zřejmé, že Číňané musí mít pocit, že získávají převahu. Jednání s nimi se stala jemným tancem, při němž jsme vytyčovali budoucnost, kterou si Austrálie přála, a nějak ji slaďovali s jejich představami. Před příštími obchodními rozhovory bylo nutné zahrát všechny karty, abychom si udrželi férovou pozici. Když oba vstali k odchodu, Howard měl pocit, že zahrál právě dost dobře." # todo: NEW TRANSLATION
 base_state_visit.2.a: "A scéna byla připravena." # todo: NEW TRANSLATION
 base_state_visit.3.t: "Normalizace vztahů se Severní Koreou" # todo: NEW TRANSLATION
 base_state_visit.3.d: "Jednání se Severokorejci byla jedinečná v tom, že jsme s touto zemí několik desetiletí neměli vybudované základy vztahů a Howard vstupoval prakticky do neprobádaného území. Ještě horší bylo jejich vzájemné odcizení. Každý kontakt probíhal nepřímo prostřednictvím našich vazeb v Číně, která jej následně tlumočila Korejcům. Nikdy se neočekávalo osobní setkání, ale skutečnost, že Howard sám nemluvil se skutečným představitelem, dávala celé věci zvláštní nádech. Nakonec souhlasili s otevřením velvyslanectví v Canbeře, což Howardovi od začátku nebylo příjemné, ale pokud jsme chtěli v jednáních pokračovat, muselo se tak stát." # todo: NEW TRANSLATION
 base_state_visit.3.a: "Lepší než nic." # todo: NEW TRANSLATION
 base_state_visit.4.t: "Návštěva z Jižní Koreje" # todo: NEW TRANSLATION
 base_state_visit.4.d: "Jihokorejský prezident dorazil onoho rána do Canberry s jediným jasným cílem. Když vypukla korejská válka, Austrálie stála po boku Američanů. Od té doby jsme byli snadnou volbou pro zajištění obrany v Pacifiku a dokud bude mít jejich severní soused jaderné zbraně, tak to i zůstane. Právě tato otázka nyní přišla na řadu. Prezident byl zdvořilý, ale nakonec jsme museli něco konkrétního dohodnout. Při procházce botanickými zahradami [KOR.GetLeader] hovořil o přetrvávajících hospodářských potížích a o tom, že jednání se Severní Koreou uvízla na mrtvém bodě. Mezitím jsme se dohodli na obchodním paktu, ale nic dalšího nebylo přislíbeno." # todo: NEW TRANSLATION
 base_state_visit.4.a: "Prozatím to bude muset stačit." # todo: NEW TRANSLATION
 base_state_visit.5.t: "Gallipolský obřad" # todo: NEW TRANSLATION
 base_state_visit.5.d: "Obyvatelé Turecka vždy projevovali pochopení pro tradici ANZAC. Asi je snadné být ohleduplný, když jste tehdy stáli na vítězné straně, ale byli natolik chápaví, že nám každoročně vyčlenili místo k návštěvě a uctění mrtvých. Většina lidí vnímá obřad jako chvíli smutku nebo si z něj odnáší poselství, že válka je zbytečná a podobně. Jen málokdo považuje tento den za chybu mezinárodních spojenectví a uvědomuje si, že bez toho, aby nás Britové poslali na poloostrov, by toho dne možná nemusely zemřít statisíce lidí. Naši předchozí vůdci si to uvědomovali, když jsme přešli od Anglie k Americe, a od té doby je důraz na spojenectví hluboce zakořeněn v programu každé strany. Naštěstí Turecko zůstalo věrným přítelem." # todo: NEW TRANSLATION
 base_state_visit.5.a: "Abychom nezapomněli." # todo: NEW TRANSLATION
 base_state_visit.6.t: "Návštěva monarchie" # todo: NEW TRANSLATION
 base_state_visit.6.d: "Její Veličenstvo královna Alžběta II., doprovázená Jeho královskou Výsostí vévodou z Edinburghu, dorazila do Austrálie v rámci oslav svého zlatého jubilea. \n\nKrálovský pár přistál v Adelaide 27. února 2002 a navštíví několik měst včetně Cairns a Canberry, kde se bude konat zasedání předsedů vlád zemí Commonwealthu. \n\nDavy mávající britskou vlajkou Union Jack jásaly z veřejné tribuny připravené k třinácté návštěvě královny a lemovaly pětimílovou trasu od letiště k Admiralty House. [GetASTLeaderTitle] ji má brzy přivítat a je možné, že neúspěšné referendum o republice bude mezi tématy jednání." # todo: NEW TRANSLATION
 base_state_visit.6.a: "Zachovejme slušnost." # todo: NEW TRANSLATION
 rudd_state_visit.1.t: "Návštěva Ruska" # todo: NEW TRANSLATION
 rudd_state_visit.1.d: "Na světě je jen málo zemí, které jsou rozlohou větší než Austrálie. Nikdo by nepopíral, že Ruská federace mezi ně patří. Howard nebyl na chlad připraven, když vystoupil z letadla. Ani po dvou dnech v zemi se nemohl zbavit pocitu vyčerpání, který se dostavoval pokaždé, když vyšel ven a ledový vítr jím pronikl. Před hotelem se shromáždilo několik lidí s australskými a ruskými vlajkami, což působilo uklidňujícím dojmem. Kevin Rudd toto setkání zorganizoval a Howard měl pocit, že byl hozen do hluboké vody. Byl zápas s medvědem skutečně správnou cestou? Rusko se stále vzpamatovávalo z hospodářského šoku devadesátých let. Teoreticky by ruský prezident hledal jakoukoli obchodní pomoc, která by mu pomohla udržet zemi nad vodou, Howard se však od příjezdu sotva cítil vítán. Musel je přesvědčit, že australský uran stojí za jednání." # todo: NEW TRANSLATION
 rudd_state_visit.1.a: "Začátek něčeho..." # todo: NEW TRANSLATION
 leaked_memo.1.t: "Uniklé memorandum"
 leaked_memo.1.d: "Nějak se jeden z těch novinářů dostal k dopisu od jednoho z našich straníků, Shanea Stonea, který obsahoval řadu ostrých kritik naší vlády. The Guardian už frázi \"Mean and Tricky Howard\" vykresluje jako svůj titulek. Nevím, jak se to dostalo ven, ale média kolem toho rozpoutala cirkus a teď musíme dohánět ztrátu, abychom zakryli vlastní stopy. Část strany včetně Petera požaduje, abychom Stonea politicky pověsili jako při nějakém zoufalém davovém honu. Dokud zprávy neutichnou, nemůžeme nic dělat, a to bolestně zpomaluje naši dynamiku změn. Jestli něco, nedokážu si představit, že by to mohlo být ještě horší."
 leaked_memo.1.a: "Vážně?"
 reconciliation_journey.1.t: "Cesta ke smíření"
 reconciliation_journey.1.d: "Howard a mediálním týmem se vměstnali do malé místnosti, kde čekal jeden z členů domorodé rady. Podepsalo se ještě několik dokumentů a poté zapózovali před kamerami. Když se člen rady otočil a potřásl Howardovi rukou, [GetASTLeaderTitle] si všiml, jak tvrdé jeho ruce jsou, pokryté mozoly a kostnaté. Tvrdě působila i jeho tvář, ale oči měl plné slz. Howard v mužově tváři viděl roky strádání i naději, které se nyní držel. Opatrně, aby o ni nepřišel. \"Děkuji vám, pane Howarde,\" řekl, než odešel s novináři. \n\nTeď byl sám a chvíli tam stál a přemýšlel. K politikám usmíření se přiklonil vícekrát, než mu bylo příjemné, a přesto se zdálo, že je země díky tomu na tom lépe. Po všem, co udělal, se Austrálie konečně krok za krokem posouvala vpřed. Když tam mlčky stál, zmocnil se ho pocit uspokojení. Nakonec přišli další lidé z médií a den pokračoval jako obvykle." # todo: NEW TRANSLATION
 reconciliation_journey.1.a: "Ještě je co dělat."
 ast_the_coalition_convention.1.t: "Konference Koalice"
 ast_the_coalition_convention.1.d: "\"Dosáhli jsme mnohého, porazili jsme opozici. Austrálie stojí hrdě a vzpřímeně před celým světem. Jsme respektováni za to, čeho jsme dosáhli s naší ekonomikou, a jsme vnímáni jako národ připravený zaujmout stanovisko k mezinárodním otázkám. Mnoha politikami Koalice se vine zlatá nit a tou je velký princip volby. Větší možnost volby pro všechny Australany, aby si mohli zvolit svou budoucnost. Náš národ je svobodnější než kdy dříve. Jeho obyvatelé více vydělávají, více nakupují a žijí hrději.\" \n\n\"Výzva, která před námi stojí, je stejně velká jako tehdy, když jsme se v roce 1996 snažili vrátit do vlády, a stejně velká bude i v příštích volbách. Mezitím lze udělat mnoho pro další zlepšení stavu našich výdajů a rostoucí ekonomiky. Mnoho stoupenců očekává další politiky, které zlepší jejich životy i životy mnoha dalších lidí v Austrálii i mimo ni. Naše břemeno vychází z našeho morálního jádra. Jsme národem, který každému poskytuje „férovou šanci“. Každý z nás zná svou odpovědnost vést. Tato odpovědnost nepominula.\"" # todo: NEW TRANSLATION
 ast_the_coalition_convention.1.a: "Výzva ještě neskončila."
 the_white_paper.1.t: "Provádění Bílé knihy"
 the_white_paper.1.d: "Dokument Obrana 2000 vznikl jako komplexní přezkum našich současných vojenských schopností a požadavků současné vlády. S větším důrazem na obranné schopnosti Austrálie jako významného poskytovatele bezpečnosti a mírových operací v Pacifiku bylo hlavním požadavkem rozšíření kapacit. Nejen personálu. Je třeba zlepšit nebo rozšířit velení, technologie i výrobu zbraní. Naštěstí máme ve vývoji řadu programů, které by nám s tím mohly pomoci."
 the_white_paper.1.a: "Naše výroba je nejdůležitější."
 the_white_paper.1.b: "Bez našich sil nemůžeme bojovat."
 the_white_paper.1.c: "S poptávkou si poradí."
 the_white_paper.2.t: "Provádění druhé Bílé knihy"
 the_white_paper.2.d: "Ať už trpíme úspěchem, nebo ne, opět jsme pověřeni zahájením restrukturalizace s počátečním cílem. Prvním návrhem je přepracování způsobů přesunu, které polní jednotky používají, aby byly efektivnější. Navrženy byly také změny naší politiky posil. Jinak bychom se mohli spolehnout na vrchní velení a urychlit jeho současný výzkum našich doktrín."
 the_white_paper.2.a: "Pohyb bude naším klíčem."
 the_white_paper.2.b: "Posily jsou vždy potřeba."
 the_white_paper.2.c: "Zpět k rýsovacímu prknu."
 lithgow_arms.1.t: "Prodej ručních zbraní Lithgow"
 lithgow_arms.1.d: "Thales nabídl částku za odkup a renovaci staré továrny, která by sloužila našim výrobním účelům. Už dříve byli spolehliví v našem úsilí o výrobu zbraní a továrna je poněkud zchátralá. Dát jí s nimi nový život by mohlo být nejlepší řešení. Mohli bychom však budovu renovovat sami."
 lithgow_arms.1.a: "Prodat ji."
 lithgow_arms.1.b: "Opravíme ji sami."
 governor_general_sacked.1.t: "Generální guvernér odvolán"
 governor_general_sacked.1.d: "Snad poprvé v dějinách Austrálie byl generální guvernér odvolán z funkce samotnou královnou Alžbětou. Překvapivá zpráva přišla po sérii rozhovorů mezi britskými představiteli a premiérem a ať už to bylo záměrem, nebo ne, zdá se, že vedla k jeho odvolání. Není jasné, jak to ovlivní tvorbu politiky současné vlády, ale pro mnoho příznivců královské rodiny v zemi to byl šok. Mluvčí liberální vlády se k odvolání zatím nevyjádřili."
 governor_general_sacked.1.a: "Konečně."
 solomon_islands_intervention.1.t: "Kolaps Šalomounových ostrovů"
 solomon_islands_intervention.1.d: "Po sérii militantních povstání a neúspěšných odzbrojovacích akcí se vláda Šalomounových ostrovů fakticky zhroutila a na jejím místě zůstal stav bezpráví. Mezi znepřátelenými militantními skupinami nyní kvůli etnickému napětí probíhají rozsáhlé boje a veřejné služby se zcela rozpadly, takže mnoho lidí zůstává bez ochrany před násilím a následnou humanitární krizí. Premiér Allan Kemakeza formálně zaslal sousedním zemím zoufalou žádost o pomoc se selhávajícím státem, k případné intervenci se však australská vláda zatím nevyjádřila. Bez jakékoli změny se očekává, že se situace na ostrovech bude pouze zhoršovat."
 solomon_islands_intervention.1.a: "Znepokojivý vývoj."
 solomon_islands_intervention.2.t: "Intervence na Šalomounových ostrovech"
 solomon_islands_intervention.2.d: "Od bombových útoků na Bali jsou všichni v senátu na téma terorismu velmi citliví. Současná situace na Šalomounových ostrovech nás rozhodně neuklidnila. Je velmi pravděpodobné, že čím horší věci budou, tím více by se mohly přelít do našich vod a vytvořit zcela novou živnou půdu pro typy vyrábějící bomby. Tamní premiér nás již požádal o intervenci a pokud bychom tuto myšlenku předložili k hlasování, výsledek by byl téměř jednomyslný. Máme morální povinnost jednat, ale náš zásah by nás mohl uvěznit v bažině horší, než jakou jsme kdy poznali, a situaci by mohl ještě zhoršit. Ať už se rozhodneme jakkoli, nebude to snadné."
 solomon_islands_intervention.2.a: "Musíme zasáhnout."
 solomon_islands_intervention.2.b: "Není to náš konflikt."
 sol_intervention_tt: "§2Budou odemčena rozhodnutí zasáhnout na Šalomounových ostrovech.§!"
 sol_intervention_failure_tt: "§RSituace se bude pouze zhoršovat...§!"
 solomon_islands_intervention.3.t: "Úspěšná intervence"
 solomon_islands_intervention.3.d: "Situace v terénu se zatím zlepšila natolik, že se obchody začínají znovu otevírat, silnice jsou bez militantů a začaly rekonstrukční práce. Naše síly budou muset v zemi zůstat ještě několik let, ale můžeme si oddechnout, že se národ stabilizuje a snad se začíná uzdravovat. Vláda Šalomounových ostrovů nám dluží a bude s námi nadále úzce spolupracovat na organizaci prozatímního státu. Mezinárodní reakce na naše úsilí je mezitím výhradně pozitivní. Nadále sklízíme politické body, zatímco naše bezpečnost v Pacifiku sílí."
 solomon_islands_intervention.3.a: "Dobrá práce."
 solomon_islands_intervention.4.t: "Národ bez naděje"
 solomon_islands_intervention.4.d: "Situace na Šalomounových ostrovech se během našich intervenčních snah pouze zhoršovala a stala se tak nestabilní, že jsme byli nuceni vyčíslit ztráty a intervenci opustit. Militantní skupiny nadále bojují v ulicích a zbylá vláda se prakticky rozpadla. Mezinárodní reakce byla tichým šokem a zbývající země zapojené do intervence své snahy podobně ukončily. Pro ty, kteří na ostrovech stále přežívají, nyní zůstává jen málo naděje."
 solomon_islands_intervention.4.a: "Jaká katastrofa..."
 solomon_islands_intervention.6.t: "Válečný vůdce se zmocňuje moci na Šalomounových ostrovech"
 solomon_islands_intervention.6.d: "Jimmy Lusibaea, vůdce nechvalně známé militantní skupiny „Malaita Eagle Force“, včera pozdě odpoledne vtrhl do budovy parlamentu a dosadil se do funkce prozatímního vůdce. Po měsících bojů na Guadalcanalu mezi posledními zbytky státní policie a Lusibaeovými silami bylo vyjednáno příměří, které skupině umožnilo vstup do hlavního města a následný převrat. \n\nOd faktického zhroucení vlády před několika měsíci a nastolení bezpráví na ostrovech se vládní ochromení stalo živnou půdou pro boje militantů a vyvolalo v regionu migrační krizi. Vůdce povstalců tvrdí, že nová vláda bude pracovat na ukončení současné krize a navrácení malajských obyvatel do jejich hlavního ostrovního domova, odkud byli v předchozích letech nuceni uprchnout." # todo: NEW TRANSLATION
 solomon_islands_intervention.6.a: "Nad ostrovy se snáší temnota."
 walk_for_reconciliation.1.t: "Pochod za smíření"
 walk_for_reconciliation.1.d: "Více než 250 000 domorodých i ned domorodých demonstrantů dnes pochodovalo přes sydneyský Harbour Bridge na veřejnou podporu smíření. Tato politická demonstrace, která v nepřetržitém proudu trvala téměř šest hodin, byla největší v australských dějinách. Jedna z organizátorek, Evelyn Scott, přiznala, že dav byl mnohem větší, než očekávali, a že doufali, že si ho vláda všimne, protože ta se podle všeho odchýlila od veřejného mínění ohledně smíření. Během demonstrace jásali pochodující, když letec na obloze nad přístavem napsal slovo \"sorry\". Podle organizátorky se plánují další pochody, které navážou na úspěch tohoto."
 walk_for_reconciliation.1.a: "Mají na to právo."
 sydney_olympic_games.1.t: "Začínají olympijské hry v Sydney"
 sydney_olympic_games.1.d: "Letní olympijské hry byly oficiálně zahájeny v Sydney v Austrálii. Přenosy vysílá 220 zemí a teritorií, což těmto hrám zajišťuje nejvyšší pokrytí v olympijské historii. Zahájení zahrnovalo sprinterku Cathy Freemanovou s olympijskou pochodní, která také vybojovala stou zlatou medaili země ve finále běhu na 400 metrů. Akce se účastní 199 zemí včetně Severní Koreje, která byla spatřena při společném pochodu s Jižní Koreou pod jedinou vlajkou, což poprvé po půl století symbolicky ukázalo jejich jednotu. Očekává se, že akce potrvá ještě dva týdny, během nichž budou zúčastněné země soupeřit mezi sebou."
 sydney_olympic_games.1.a: "To je podívaná."
 shell_takeover.1.t: "Převzetí Woodside Petroleum společností Shell"
 shell_takeover.1.d: "Dorazila k nám zpráva, že Royal Dutch Shell usiluje o převzetí společnosti Woodside Petroleum v hodnotě 10 miliard dolarů. Obě společnosti měly v posledních letech úzké vztahy a Shell dal jasně najevo, že jeho technická podpora projektu North-West LG by se změnila v intenzivnější rozšíření zařízení. Náš místopředseda a stranický pokladník Peter Costello je však proti tomuto kroku a radí nám dohodu zablokovat s odůvodněním, že tak velká společnost vlastnící většinu plynárenských projektů je v rozporu s našimi národními zájmy."
 shell_takeover.1.a: "Nabídku zablokovat."
 shell_takeover.1.b: "Převzetí povolit."
 tampa_affair.1.t: "Aféra Tampa"
 tampa_affair.1.d: "Nová vládní politika vůči žadatelům o azyl se stala katalyzátorem politické bouře, která vypukla poté, co byla norská loď odkloněna od pobřeží Vánočního ostrova. Kapitán Arne Rinnan, velitel nákladní lodi MV Tampa, zachránil stovky zoufalých žadatelů o azyl z indonéské rybářské lodi a pokoušel se je dopravit do bezpečí v Austrálii. \n\nNavzdory špatnému zdravotnímu stavu 433 žadatelů o azyl na palubě Tampy loď obsadily jednotky SAS a nařídily jí otočit se. Norská ambasáda reagovala převážně negativně na změnu politiky Howardovy vlády, která se zaměřila na ilegální přistěhovalce. Jak daleko tato politika může zajít, si může každý jen domýšlet." # todo: NEW TRANSLATION
 tampa_affair.1.a: "Nešťastná okolnost."
 bali_bombings.1.t: "Bombové útoky na Bali"
 bali_bombings.1.d: "Po indonéském ostrově Bali se rozšířil teror, když byly odpáleny tři bomby a podle odhadů zabily 202 lidí, včetně 88 Australanů. Pocit míru a odstupu, který národ pociťoval během růstu teroristické aktivity v zahraničí, byl minulou noc náhle rozbit. Dvě bomby se údajně nacházely v rušných nočních podnicích, kam běžně míří australští turisté, zatímco třetí vybuchla před americkým konzulátem v Denpasaru. Ačkoli spojení s al-Káidou není jasné, útok byl bezpochyby teroristickým činem. \n\nNásledujícího rána leželo na chodníku kdysi rušné ulice více než 50 těl přikrytých bílými prostěradly. Kruté poselství, že Austrálie už není pouhým přihlížejícím v pokračujícím boji proti teroru." # todo: NEW TRANSLATION
 bali_bombings.1.a: "Bože..."
 embassy_attacked.1.t: "Napadení australského velvyslanectví"
 embassy_attacked.1.d: "Přicházejí zprávy, že dnes ráno kolem desáté hodiny došlo před jedním z našich velvyslanectví v Indonésii k výbuchu. Naštěstí nebyl zabit nikdo z našich zaměstnanců, ale podle dosavadních zpráv zahynulo 9 lidí a přibližně 150 bylo zraněno, pravděpodobně při výbuchu automobilové bomby. Zdá se zřejmé, že cílem jsme byli my, a zatím nevíme, zda to souvisí s předchozími bombovými útoky na Bali, přestože se jedná o podobný útok. Indonéská vláda nás osobně kontaktovala, aby zorganizovala vyšetřování. To může být teprve začátek dalších cílených útoků."
 embassy_attacked.1.a: "Mění se to v noční můru."
 asian_earthquakes.1.t: "Pomoc Indii"
 asian_earthquakes.1.d: "Při zemětřeseních napříč Asií dosud zahynulo více než 11 000 lidí. Tisíce domů a automobilů smetly tsunami pustošící pobřeží, což v postižených oblastech způsobilo rozsáhlé výpadky komunikace a nepředstavitelné škody na silnicích a železnicích. Indie čelí jedné z nejhorších situací, ačkoli rozsah škod v tuto chvíli není znám. Mezinárodní Červený kříž vyhlásil naléhavou výzvu k okamžité pomoci postiženým zemím. Mohli bychom využít této příležitosti a poslat Indii podpůrný balíček, čímž bychom posílili naše stávající vztahy."
 asian_earthquakes.1.a: "Podpoříme je."
 asian_earthquakes.1.b: "Jsou na to sami."
 asian_earthquakes.2.t: "Austrálie nabízí pomoc"
 asian_earthquakes.2.d: "V reakci na zemětřesení, která nyní postihují nás i zbytek Asie, nám Canberra nabídla balíček pomoci na podporu obnovy."
 asian_earthquakes.2.a: "Překvapení, ale vítané."
 cronulla_riots.1.t: "Rasové nepokoje v Cronulle"
 cronulla_riots.1.d: "V pobřežní čtvrti Cronulla se místní gangy čítající až 200 mužů střetly s místní policií před mešitou, v události popisované jako rasové nepokoje. Následuje to po řadě konfrontací, z nichž při jedné přibližně 5 000 účastníků shromáždění napadlo osoby blízkovýchodního vzhledu. Boje se rozšířily do dalších částí Sydney v sérii odvetných útoků členů muslimské komunity. Nepokoje si dosud vyžádaly více než 30 zraněných včetně policistů a zdravotníků a vedly k 16 zatčením. Několik náboženských skupin útoky otevřeně odsoudilo a místní policie označila obnovení pořádku za prioritu, vysoké napětí v ulicích Sydney však přetrvává."
 cronulla_riots.1.a: "Asi mají právo si stěžovat."
 cronulla_riots.1.b: "Tvrdě proti nim zakročit."
 rip_steve_irwin.1.t: "Smrt ikony"
 rip_steve_irwin.1.d: "Přírodovědec Steve Irwin, který se celosvětově proslavil jako televizní Lovec krokodýlů, tragicky zemřel při potápěčské nehodě, při níž mu rejnok probodl hrudník. K incidentu došlo při natáčení podvodního dokumentu u Port Douglas. Štáb se ho pokusil dopravit k záchrannému vrtulníku, ale zemřel dříve, než dorazili záchranáři. Jeho smrt šokovala mnoho Australanů i fanoušků po celém světě. \n\n\"Je to strašlivá ztráta pro turistický průmysl a ochranu přírody. Každý, kdo Steva poznal, byl ohromen jeho energií a nadšením, byl to opravdový australský darebák.\" Tak vysvětlila queenslandská ministryně cestovního ruchu Margaret Keech. Smrt národního symbolu vyvolala hluboké reakce i mezi poslanci, kteří ji uctili projevy soustrasti, mimo jiné od [AST.GetLeader] a členů opozice." # todo: NEW TRANSLATION
 rip_steve_irwin.1.a: "Austrálie ztratila úžasného a osobitého syna."
 a_global_financial_crisis.1.t: "Globální finanční krize"
 a_global_financial_crisis.1.d: "Kolaps amerického trhu s bydlením a následné uzavírání bank se přes oceán dostaly až k nám. Naše měna již rychle oslabuje a důvěra spotřebitelů se propadla. Reserve Bank v reakci zvýšila sazby a snížila hotovostní sazbu, zatímco desítky firem se tváří v tvář recesi zavírají. Pokud situaci nezvládneme a nezpomalíme pád, nezaměstnanost může prudce vzrůst a nám může hrozit deprese, jakou jsme nezažili celá desetiletí."
 a_global_financial_crisis.1.a: "Ještě se to zhoršilo."
 rus_deal_ast.1.t: "Dohoda od Australanů"
 rus_deal_ast.1.d: "Canberra nám nabídla obchodní dohodu o výhodných vývozních právech k jejich ložiskům uranu. Australané trvají na tom, že minerály mají být použity pro energetické projekty, nikoli k obohacování pro zbraně. Dohoda by skutečně dobře posloužila k zásobování našich reaktorů a později můžeme svůj názor vždy změnit. Na druhou stranu, můžeme jim věřit, že nám budou dodávat?"
 rus_deal_ast.1.a: "Dobrá tedy."
 rus_deal_ast.1.b: "Ne, děkujeme."
 rus_deal_ast.2.t: "Ruská obchodní dohoda"
 rus_deal_ast.2.d: "Moskva s naší obchodní dohodou souhlasila. Budeme jim za férovou cenu dodávat náš uran a rubly budou proudit do australské státní pokladny. Jejich obchodní úřad již začal organizovat dodávky."
 rus_deal_ast.2.a: "Výborně."
 rus_deal_ast.3.t: "Ruská obchodní dohoda"
 rus_deal_ast.3.d: "Moskva naši obchodní dohodu odmítla s odůvodněním, že jejich zdroj uranu zůstane více lokalizovaný."
 rus_deal_ast.3.a: "Nuže, pokusili jsme se."
 isr_ast_visit.1.t: "Návštěva Svaté země"
 isr_ast_visit.1.d: "Howard měl Izraelce rád. Jejich odolnost se podobala té, kterou nacházel u Australanů, a jejich diplomaté patřili k nejlepším. Nikdy však nepromarnili příležitost připomenout vám jejich utrpení na Blízkém východě. Neustále trpící národ, jehož oddanost hodnotám demokracie však byla obdivuhodná. \n\nNyní stál před zdí a Howarda zaplavoval hluboký smutek. V zemi byl snad potřetí, ale Zeď nářků viděl poprvé. Emoce z jejího spatření ho téměř přemohla a uvnitř se v něm hromadila. Možná právě tak se Izraelci cítili neustále. Taková ztráta. Jeden z pomocníků se Howarda zeptal, zda se chce zdi dotknout, jak velela tradice. Beze slova přikývl a přistoupili k ní. Na hlavu mu nasadili tenký kulatý klobouk a když se zdi dotkl, cítil, jak do něj proniká její duch." # todo: NEW TRANSLATION
 isr_ast_visit.1.a: "Biblický zážitek."
 adf_acq_astuirement.1.t: "Uchazeči o dodávky pro ADF"
 adf_acq_astuirement.1.d: "Náš výběr hlavního dodavatele byl zúžen na tři možnosti. První a nejsnáze odůvodnitelnou volbou jsou Spojené státy. Dosáhly dobrého pokroku v oblasti hlavních bojových pušek a jejich zkušenosti ze zahraničí spolu s našimi společnými obrannými závazky z nich na strategické úrovni činí snadnou volbu. Druhou možností je Německo. Pokud nechceme Rakousko, mohli bychom stejně dobře vybrat jeho souseda. Heckler and Koch se stali jedním z nejlepších výrobců pušek na světě. Tím bychom nic nezkazili. Poslední možností je osvědčená Belgie. Nikdo nepopře, že řada FN je kvalitní vybavení, a naši přátelé ze Commonwealthu ve Spojeném království vyvinuli vlastní řadu podle svých potřeb. Totéž můžeme snadno udělat i my."
 adf_acq_astuirement.1.a: "Držme se Američanů."
 adf_acq_astuirement.1.b: "Volme kvalitu."
 adf_acq_astuirement.1.c: "Staré a osvědčené."
 ast_high_speed_rail.1.t: "Projekt vysokorychlostní železnice čelí zpoždění"
 ast_high_speed_rail.1.d: "Zdá se téměř očekávatelné, že projekt narazil na komplikaci. Trasa jižně od Brisbane má vést dlouhým horským pásmem. Odhady hustoty hornin byly chybné a současné razicí práce budou stát výrazně více."
 ast_high_speed_rail.1.a: "S tím se počítalo."
 ast_high_speed_rail.1.b: "Projekt zrušit."
 ast_high_speed_rail.2.t: "Problémy s výkupem pozemků sužují vysokorychlostní železnici"
 ast_high_speed_rail.2.d: "V předměstských oblastech potřebných pro průchod železnice se objevily další problémy. Řada skupin NIMBY (Ne na mém dvorku) se staví proti návrhu výstavby a právní spory by mohly projekt na neurčito zastavit. Objízdná trasa by znamenala zrušení současného směru a vypracování nového."
 ast_high_speed_rail.2.a: "Co pro nás kdy NIMBY udělali?"
 ast_high_speed_rail.2.b: "Rozhodně ne."
 ast_high_speed_rail.3.t: "Náklady na suroviny zpomalují železnici"
 ast_high_speed_rail.3.d: "Další rána pro projekt vysokorychlostní železnice. Dříve sjednané dodávky železa náhle padly, protože ceny oceli prudce vzrostly. Dodavatelé nyní požadují trojnásobek původní sazby, což je vzhledem k původní výši nákladů značná část celého rozpočtu."
 ast_high_speed_rail.3.a: "Kolik že to bylo?"
 ast_high_speed_rail.3.b: "Řekněte mu, že se mu to jen zdá."
 ast_high_speed_rail.4.t: "Náklady vysokorychlostní železnice přepočítány"
 ast_high_speed_rail.4.d: "Po téměř pěti letech výstavby projektu byly původní i dodatečné finanční prostředky téměř vyčerpány. Vzhledem k rekordně vysokým nákladům na práci, povolení a materiály se investice do projektu přepracovává a zahrnuje dalších 80 miliard dolarů. Někteří plánovači jsou přesvědčeni, že světlo na konci tunelu je na dohled, ale po tolika nezdarech není nic jisté."
 ast_high_speed_rail.4.a: "Prosím, ať už je konec."
 ast_high_speed_rail.4.b: "Na tohle už mě znovu nenachytají."
 ast_high_speed_rail.5.t: "Vysokorychlostní železnice odhalena"
 ast_high_speed_rail.5.d: "Po řadě nezdarů a překročení rozpočtu byla odhalena síť vysokorychlostní železnice a první vlak opustil nádraží v Brisbane. Železniční trať, označovaná za naprostou špičku techniky, v současnosti vede z Brisbane do Melbourne a podle údajů zvládne cestu za necelých 6 hodin. U nádraží, které bylo přestavěno pro novou trať, se shromáždilo mnoho lidí, aby sledovali příjezd vlaku."
 ast_high_speed_rail.5.a: "Zázrak techniky!"
 base_state_visit.7.t: "Cesta do Indonésie" # todo: NEW TRANSLATION
 base_state_visit.7.d: "Po bombových útocích byla situace natolik napjatá, že Howard nemohl po vystoupení z letadla udělat ani krok, aniž by ho obklopoval kordón vojáků. Indonésané se pečlivě snažili zachovat zdání pořádku, ale pokračující povstání v Acehu bylo ostudou. Indonéský premiér se zdál být více než ochotný diskutovat o probíhajících bezpečnostních závazcích, přestože jednání právě o tomto tématu znovu a znovu selhávala. Vztahy mezi našimi národy se staly nejistými a měly daleko k „kumbajá“ postkoloniálních let. Praskliny byly zcela zjevné." # todo: NEW TRANSLATION
 base_state_visit.7.a: "Do příště." # todo: NEW TRANSLATION
 generic_bushfires_ast.1.t: "Rozsáhlé požáry v australském vnitrozemí" # todo: NEW TRANSLATION
 generic_bushfires_ast.1.d: "Neobvykle horké a suché léto zažehlo zuřící požáry napříč Victorií. Dosud shořelo více než 1 milion hektarů půdy, protože se mnoho menších požárů spojilo ve Velkém předělovém pohoří. Naštěstí se požáry omezily převážně na neobydlená pohoří a národní parky, přestože došlo ke ztrátě některých budov a hospodářských zvířat. Hasiči nadále úspěšně omezují jejich šíření. Kouř však v současnosti narušuje lety na melbournském letišti." # todo: NEW TRANSLATION
 generic_bushfires_ast.1.a: "Znepokojivé." # todo: NEW TRANSLATION
 papua_affair.1.t: "Diplomatická jednání na pokraji zhroucení" # todo: NEW TRANSLATION
 papua_affair.1.d: "Po komplikaci na letišti v Brisbane, kam kvůli jednáním dorazil premiér Papuy-Nové Guineje [PAP.GetLeader], se zdá, že naše vyjednávání možná vyletí komínem. \n\nJeden ze zaměstnanců letiště požádal vůdce, aby si během bezpečnostní kontroly zul boty, což byl údajně standardní postup. Premiér to však zřejmě považoval za ponížení. Jeho vyslanci už mají sbaleno a chystají se odletět, zatímco naši diplomaté je prosí, aby se k jednáním vrátili. Pokud chceme něco zachránit, budeme muset osobně zasáhnout." # todo: NEW TRANSLATION
 papua_affair.1.a: "Pokusit se něco zachránit." # todo: NEW TRANSLATION
 papua_affair.1.b: "Ať si klidně postěžují." # todo: NEW TRANSLATION
 papua_affair.2.t: "Australský návrh na kaučuk" # todo: NEW TRANSLATION
 papua_affair.2.d: "Vláda v Canbeře navrhla státní podporu několika našich kaučukových plantáží v okolí Port Moresby. Podle nich má dohoda posílit a zajistit stabilní obchod mezi námi a zároveň zrušit některá naše cla. Místní drobní pěstitelé návrh podporují kvůli vyhlídce na vyšší vývoz, ale dohoda by nás v budoucnu mohla učinit závislejšími na Austrálii." # todo: NEW TRANSLATION
 papua_affair.2.a: "To je dobrý obchod." # todo: NEW TRANSLATION
 papua_affair.2.b: "Žádná dohoda." # todo: NEW TRANSLATION
 papua_affair.3.t: "Kaučuk zajištěn" # todo: NEW TRANSLATION
 papua_affair.3.d: "Naštěstí premiér souhlasil s druhým kolem jednání a podpořil náš návrh. Zemědělci v okolí Port Moresby budou těžit z vyšší poptávky a štědrých dotací, zatímco my získáme stabilní přísun kaučuku pro naše rozvíjející se průmyslové podniky. Z tohoto uspořádání by měl těžit celý region." # todo: NEW TRANSLATION
 papua_affair.3.a: "Další úspěšná dohoda." # todo: NEW TRANSLATION
 papua_affair.4.t: "Žádná odpověď" # todo: NEW TRANSLATION
 papua_affair.4.d: "Delegace Papuy-Nové Guineje bohužel v tuto chvíli není našim jednáním nakloněna. Anebo jednoduše zapomněli, jak zvednout telefon. Je to zklamání, ale mezitím můžeme rozšířit naše úsilí o získávání kaučuku z místních zdrojů." # todo: NEW TRANSLATION
 papua_affair.4.a: "Nemůžeme vyhrát pokaždé." # todo: NEW TRANSLATION
 ast_howard_of_arabia.1.t: "Howard z Arábie" # todo: NEW TRANSLATION
 ast_howard_of_arabia.1.d: "Auto poskočilo přes další hluboký výmol a Howard málem narazil hlavou do střechy džípu. Diplomat na předním sedadle se otočil a začal rychle vysvětlovat, že silnici poškodily trosky padajících raket v důsledku Železné kopule. Howard přikývl a souhlasil, že je to lepší než alternativa, ale nemohl se ubránit pocitu, že obraz země, který si vytvořil ve městě, neodpovídá realitě zde venku. IDF se zdálo být za každým rohem, když vůz zabočil ke konzulátu, kde měl Howard pronést projev o regionální bezpečnosti. \n\nAustrálie už zapustila své boty do Blízkého východu a nyní zde hodlala zřídit stálou základnu, aby pomohla Izraelcům udržet situaci pod kontrolou. V mnoha ohledech se zdálo, že navzdory velmi západnímu smýšlení je Izrael stále rozvojovou zemí bez základů pro mírovou budoucnost. Dokonce i jejich obavy z íránské invaze bledly ve srovnání s nejednotou, která panovala mezi nimi a jejich bezprostředním sousedem, Palestinci. Howard najednou začal celou dohodu přehodnocovat." # todo: NEW TRANSLATION
 ast_howard_of_arabia.1.a: "Naše budoucnost je s Izraelem." # todo: NEW TRANSLATION
 ast_howard_of_arabia.1.b: "Prozatím nemůžeme nic slíbit..." # todo: NEW TRANSLATION
 indonesian_ultimatum.1.t: "Australské ultimátum" # todo: NEW TRANSLATION
 indonesian_ultimatum.1.d: "Austrálie otevřeně požaduje, abychom předali provincii Aceh jejich mírovým jednotkám, čímž bychom fakticky umožnili okupaci jednoho z našich území jejich silami. Tvrdí, že by to nakonec vedlo k nezávislosti regionu bez povstalců, ale nemáme jak to zaručit a stále by šlo o ztrátu vlastní půdy. Pokud odmítneme, pohrozili nám sankcemi." # todo: NEW TRANSLATION
 indonesian_ultimatum.1.a: "Nemáme na výběr." # todo: NEW TRANSLATION
 indonesian_ultimatum.1.b: "To je pobuřující!" # todo: NEW TRANSLATION
 indonesian_ultimatum.2.t: "Indonésie souhlasí" # todo: NEW TRANSLATION
 indonesian_ultimatum.2.d: "Jakarta souhlasila s předloženými podmínkami a vzdala se území Acehu. Naše mírové jednotky brzy vyrazí a obnoví v provincii pořádek. Indonéský lid bude brzy osvobozen od povstalců." # todo: NEW TRANSLATION
 indonesian_ultimatum.2.a: "Mír zvítězil!" # todo: NEW TRANSLATION
 indonesian_ultimatum.3.t: "Indonésie odmítá ultimátum" # todo: NEW TRANSLATION
 indonesian_ultimatum.3.d: "Jakarta odmítla naše podmínky a nechce vpustit naše mírové jednotky do Acehu. Tvrdohlavě přísahají, že povstání potlačí sami." # todo: NEW TRANSLATION
 indonesian_ultimatum.3.a: "Budiž." # todo: NEW TRANSLATION
 indonesian_ultimatum.4.t: "Australské ultimátum" # todo: NEW TRANSLATION
 indonesian_ultimatum.4.d: "Austrálie otevřeně požaduje, abychom předali provincii Aceh jejich mírovým jednotkám, čímž bychom fakticky umožnili okupaci jednoho z našich území jejich silami. Tvrdí, že by to nakonec vedlo k nezávislosti regionu bez povstalců, ale nemáme jak to zaručit a stále by šlo o ztrátu vlastní půdy. Pokud odmítneme, pohrozili nám sankcemi." # todo: NEW TRANSLATION
 indonesian_ultimatum.4.a: "Nemáme na výběr." # todo: NEW TRANSLATION
 indonesian_ultimatum.4.b: "To je pobuřující!" # todo: NEW TRANSLATION
 us_aus_trade_howrd.1.t: "Obchodní jednání s Austrálií" # todo: NEW TRANSLATION
 us_aus_trade_howrd.1.d: "Vláda v Canbeře nám nabídla obchod s přednostními právy na těžbu nerostů výměnou za snížení cel na vývoz vysoce hodnotných strojů do Austrálie. Ztráta příjmů z cel by byla zanedbatelná a práva na těžbu nerostů by ji více než vyvážila." # todo: NEW TRANSLATION
 us_aus_trade_howrd.1.a: "To jsou výhodné podmínky." # todo: NEW TRANSLATION
 us_aus_trade_howrd.1.b: "Ne, děkujeme." # todo: NEW TRANSLATION
 us_aus_trade_howrd.2.t: "Spojené státy souhlasí s obchodní dohodou" # todo: NEW TRANSLATION
 us_aus_trade_howrd.2.d: "Američané bez námitek souhlasili se snížením cel na vývoz vysoce hodnotných strojů výměnou za nabídku práv na těžbu nerostů." # todo: NEW TRANSLATION
 us_aus_trade_howrd.2.a: "Na zdraví přátelství!" # todo: NEW TRANSLATION
 us_aus_trade_howrd.3.t: "Obchodní jednání s USA ochladla" # todo: NEW TRANSLATION
 us_aus_trade_howrd.3.d: "Zdá se, že veškerý pokrok v obchodních jednáních vyšel naprázdno. Američané nehodlají ustoupit ve změně cel a nás nechali tak trochu na holičkách." # todo: NEW TRANSLATION
 us_aus_trade_howrd.3.a: "Neočekávaný pokles." # todo: NEW TRANSLATION
 trip_to_malaysia_ast.1.t: "Návštěva z Malajsie" # todo: NEW TRANSLATION
 trip_to_malaysia_ast.1.d: "Malajsijská ministryně obchodu a průmyslu Rafidah Aziz nás oslovila s dodatkem k naší současné smlouvě o vývozu masa. Nová dohoda nabízí smlouvy na vývoz výměnou za uvolnění některých daní a předpisů, které se na ně vztahují. Je to solidní nabídka, ačkoli požadavky mohou později představovat mezeru, kterou by mohli využít. Stále nám však nabízí výhodnou cenu za naše zboží." # todo: NEW TRANSLATION
 trip_to_malaysia_ast.1.a: "Pro naše přátele samozřejmě!" # todo: NEW TRANSLATION
 trip_to_malaysia_ast.1.b: "Dnes ne." # todo: NEW TRANSLATION
 internal_talk_liberal.1.t: "Spor mezi kolegy" # todo: NEW TRANSLATION
 internal_talk_liberal.1.d: "Howard měl pocit, že Peter Costello, jeho schopný zástupce ve straně od prvních voleb, s ním vždy měl nějaký problém. Zdálo se, že se střetnou při každé příležitosti, ale to jim nezabránilo spolupracovat pro vyšší dobro a Peter byl částečně zodpovědný za pokračující ekonomický růst. Nyní se hádali kvůli migraci. Peter pevně hájil ekonomické přínosy, ale Howard, znepokojený „beztvarostí“ multikulturalismu, zůstával neochvějný v otázce integrace. \n\nPosílení pohraniční hlídky mělo také výhodu v podobě omezení pašování lidí, které se stalo aktuálním tématem ve zprávách. Peter naopak tvrdil, že tento záměr se může obrátit proti nim a skončí jen plýtváním rozpočtem. Dohoda mezi nimi nebyla na dohled." # todo: NEW TRANSLATION
 internal_talk_liberal.1.a: "A přesto bylo třeba rozhodnout." # todo: NEW TRANSLATION
 internal_talk_liberal.2.t: "Návštěva Tonyho" # todo: NEW TRANSLATION
 internal_talk_liberal.2.d: "Howard právě vyřizoval dokumenty ke změně stranických pravidel, když se ozvalo zaklepání na dveře. Věděl, že do další schůzky má přibližně dvě hodiny, a tak ho překvapilo, když dovnitř vešel ministr zdravotnictví Tony Abbott. Muž, který skvěle řídil ministerstvo a vypořádal se s nejedním odborářským rváčem, předložil Howardovi další změny systému Medicare. Někteří členové strany Abbotta částečně označovali za stranického fanatika, ale Howard to tak neviděl. Jemu Abbott připadal oddaný lidem. Nacionalista podle všech definic. \n\nBezpochyby měl ambice stát se premiérem, ale nikdy mu to nezabránilo prokazovat Howardovi loajalitu a mezi oběma se vytvořil vzájemný respekt. Když odešel, Howard se vrátil k psaní a v hlavě mu zůstala jedna myšlenka. Možná by po všech těch letech ve funkci mohl Tonyho považovat za dobrého přítele." # todo: NEW TRANSLATION
 internal_talk_liberal.2.a: "Tak zpátky do práce." # todo: NEW TRANSLATION
 internal_talk_liberal.3.t: "Volba nástupce" # todo: NEW TRANSLATION
 internal_talk_liberal.3.d: "Když došlo na volbu dalšího vůdce strany, Howard stál na rozcestí. Zdálo se, že jeho největším nepřítelem v parlamentu je častěji než kdokoli jiný jeho vlastní zástupce Peter Costello. Dostávali se do sporů častěji než Howard s ostatními stranami. Peter o tento post vždy usiloval a neškodilo mu, že měl u zbytku strany dobré postavení. Jeho vize ekonomicky nezávislé Austrálie byla skutečně zajímavá a s ním v čele by si mohl být jistý, že strana bude pokračovat hladce. \n\nByl tu však ještě někdo jiný. Tony Abbott byl v mnoha ohledech Howardovým chráněncem, přestože trval na tom, aby Howard sloužil ještě jedno období. Ačkoli byl Abbott ve straně považován za jakéhosi stoupence a někteří ho pokládali za trochu vyhaslého, John v něm viděl přesvědčení, které mu téměř připomínalo jeho samotného. Abbott si představoval nejen nezávislou Austrálii, ale také silnější Austrálii. Před příštími volbami toto rozhodnutí mohlo stranu posílit, nebo zničit." # todo: NEW TRANSLATION
 internal_talk_liberal.3.a: "Peter je přirozený nástupce." # todo: NEW TRANSLATION
 internal_talk_liberal.3.b: "Tony na to má." # todo: NEW TRANSLATION
 internal_talk_liberal.3.c: "Když se nad tím zamyslím..." # todo: NEW TRANSLATION
 internal_talk_liberal.4.t: "Howard odstupuje z vedení" # todo: NEW TRANSLATION
 internal_talk_liberal.4.d: "\"Každý den mého života pro mě bylo obrovskou výsadou být [GetASTLeaderTitle] této krásné země a chci australskému lidu za tuto výsadu poděkovat. Respektuji ji a ctím. Po letech úsilí bylo vedení tohoto národa tou nejneuvěřitelnější zkušeností mého života.\" \n\n\"Přijímám plnou odpovědnost za Liberální stranu, za úspěchy i několik porážek, které jsme utrpěli, a proto odstupuji z jejího vedení. Chci poděkovat lidem z Bennelongu a obyvatelům Austrálie, že mě zvolili, abych tento národ zastupoval.\" \n\n\"Když předávám otěže svému zástupci a pokladníkovi Peteru Costellovi, cítím vůči němu zvláštní dluh vděčnosti. Byl skvělým správcem australské ekonomiky a budoucnost naší strany je s Peterem pevně spjata. On je naší budoucností.\" \n\n\"Přeji národu vše dobré a hluboce věřím, že nejlepší roky Austrálie teprve přijdou.\"" # todo: NEW TRANSLATION
 internal_talk_liberal.4.a: "Vstříc novým obzorům..." # todo: NEW TRANSLATION
 internal_talk_liberal.5.d: "\"Každý den svého života během uplynulých let jsem považoval za obrovskou výsadu být [GetASTLeaderTitle] této krásné země a chci australskému lidu za tuto výsadu poděkovat. Respektuji ji a ctím. Po letech úsilí bylo vedení tohoto národa tou nejneuvěřitelnější zkušeností mého života.\" \n\n\"Přijímám plnou odpovědnost za Liberální stranu, za úspěchy i několik porážek, které jsme utrpěli, a proto odstupuji z jejího vedení. Chci poděkovat lidem z Bennelongu a obyvatelům Austrálie, že mě zvolili, abych tento národ zastupoval.\" \n\n\"Když předávám otěže příštímu vůdci, svému ministrovi zdravotnictví a hrdému kolegovi Tonymu Abbottovi, cítím vůči němu zvláštní dluh vděčnosti. Byl skvělým zástupcem mnoha Australanů a budoucnost naší strany je s Tonym pevně spjata. On je naší budoucností.\" \n\n\"Přeji národu vše dobré a hluboce věřím, že nejlepší roky Austrálie teprve přijdou.\"" # todo: NEW TRANSLATION
 solomon_islands_intervention.5.t: "Úklid" # todo: NEW TRANSLATION
 solomon_islands_intervention.5.d: "Místní přistoupili k hromadě a vysypali na ni další náklad zbraní. Většinou pušek. Toho dne se další milice vzdala 3. australské armádě a důstojníci její členy odváděli pryč. Zítra je ženijní pluk zničí před davem. Pro veřejnost to provedou na jednom z dosud funkčních stadionů jako důkaz, že se obnovuje pořádek. Zda tento pořádek přicházel z domova, nebo odjinud, voják ADF nevěděl, ale dál sledoval, jak zbraně vrší. \n\nCinkaly o sebe po desítkách a hromada rostla. On i zbytek roty skupinu, z níž tyto zbraně pocházely, hledali přibližně měsíc a byli první, kdo se vzdal při spatření vojáků. Začínalo to vypadat, že se věci blíží ke konci, dříve, než čekal. Boje utichaly, ale ani v nedalekém městě nesvítilo mnoho světel a nemocní byli odváženi z ostrova letadly. Pokud měli místní zůstat, po skončení střelby bude třeba udělat více. \n\nRádio na jeho rameni zapraskalo a ožilo. Vyrazil do dalšího města." # todo: NEW TRANSLATION
 solomon_islands_intervention.5.a: "Zpátky do práce." # todo: NEW TRANSLATION
 a_global_financial_crisis.2.t: "Finanční otřesy" # todo: NEW TRANSLATION
 a_global_financial_crisis.2.d: "V posledních týdnech zkrachovalo několik středně velkých podniků podporovaných půjčkami. Zhoršení údajů o nezaměstnanosti je jedním negativním aspektem, ale poněkud znepokojivé je ticho, které to provází. Přízrak hospodářského poklesu začíná znervózňovat naše fiskální odborníky, kteří žádají, abychom byli připraveni okamžitě jednat, pokud se něco objeví. Zatím se však nic neděje, což nás staví do poněkud nepříjemné pozice, kdy jen čekáme." # todo: NEW TRANSLATION
 a_global_financial_crisis.2.a: "Nenechme se znepokojovat ničím." # todo: NEW TRANSLATION
 black_saturday_ast.1.t: "Černá sobota" # todo: NEW TRANSLATION
 black_saturday_ast.1.d: "Během několika dní se z několika požárů staly stovky požárů napříč Victorií. Tato událost byla označena za nejhorší den lesních požárů v historii. Tisíce hasičů z celé země se shromáždily v zoufalé snaze požáry zvládnout, přestože ty už připravily o život 25 lidí. \n\nDny horkého a suchého vzduchu ze střední Austrálie vytvořily dokonalé podmínky pro neuvěřitelně rychlé šíření požárů. Rozlehlé části domů a půdy již byly zničeny a byl vyhlášen stav nouze, zatímco záchranné složky spěchají s evakuací ohrožených oblastí. Přestože se při průchodu státními lesy a národními parky dá dělat jen málo, plameny dosahují výšky až 30 metrů." # todo: NEW TRANSLATION
 black_saturday_ast.1.a: "Letos nám opravdu není přáno." # todo: NEW TRANSLATION
 black_saturday_ast.2.t: "Požáry ve Victorii stále zuří" # todo: NEW TRANSLATION
 black_saturday_ast.2.d: "Obloha nad Victorií zůstává už celé týdny černá, protože požáry nepolevují a počet obětí vzrostl na 173. Protihasičské linie úspěšně zpomalily šíření, přesto podle odhadů shořelo 400 000 hektarů a místní ekosystém byl zdevastován. \n\n[GetASTLeaderTitle] oblast navštěvoval a setkával se s postiženými. Při pohledu na škody byli viditelně rozrušení, a tak jim poskytoval alespoň trochu útěchy. Jejich počet se nyní pravděpodobně počítá na tisíce. Vyčerpaní hasiči pokračují ve svém úsilí a v nadcházejícím týdnu se očekává příznivější počasí. \n\nNejtemnější dny Victorie za poslední desetiletí možná pomalu končí, ovšem za cenu zdrcující ztráty pro celý národ." # todo: NEW TRANSLATION
 black_saturday_ast.2.a: "Tragédie za hranicí slov." # todo: NEW TRANSLATION
 ast_elections_howard_placeholders.1.t: "Překvapivé vítězství Howardovy vlády" # todo: NEW TRANSLATION
 ast_elections_howard_placeholders.1.d: "Rostoucí ceny paliva a silné reakce na řadu politik Johna Howarda nestačily k tomu, aby tomuto vůdci zabránily získat třetí volební období. Liberální strana vyšla z voleb s 82 křesly ve Sněmovně reprezentantů a zažila možná nejrychlejší obrat politického štěstí v dějinách země. \n\nMezitím vláda vedená Kimem Beazleym utrpěla nejnižší podíl primárních hlasů od roku 1934 a některé zdroje uvnitř Labouristické strany tvrdí, že se očekává odstoupení vůdce opozice. Howard poděkoval svým podporovatelům, zejména malým podnikům, za volební vítězství ve svém vítězném projevu v hotelu Wentworth v Sydney a nastínil své plány na další reformy." # todo: NEW TRANSLATION
 ast_elections_howard_placeholders.1.a: "Tak snadné!" # todo: NEW TRANSLATION
 ast_elections_howard_placeholders.2.t: "Howardova vláda získává další mandát" # todo: NEW TRANSLATION
 ast_elections_howard_placeholders.2.d: "Zatímco se Mark Latham jako nový vůdce Labouristické strany snažil získat půdu pod nohama, [AST.GetLeader] prudce posílil, získal pro koalici další mandát a zajistil jí většinu. Liberálové zaznamenali po tragédii bombových útoků na Bali pohodlný nárůst podpory ve voličských průzkumech, což signalizovalo příklon k opatrnému a stabilnímu vládnutí. \n\nK vítězství koalice nepochybně přispěly také politiky Nationals v oblasti správy venkovských vodních zdrojů, zavedené v boji proti miléniovému suchu. Toto vítězství znamená druhé nejdelší nepřerušené období vlády této strany. \n\nALP sice získala několik křesel, když převzala jedno od Zelených a několik od Nationals, pravděpodobně to však povede k další přestavbě strany." # todo: NEW TRANSLATION
 ast_elections_howard_placeholders.2.a: "Ještě tři roky!" # todo: NEW TRANSLATION
 election_outcomes_ast.1.t: "Historické vítězství Ruddovy Labouristické strany" # todo: NEW TRANSLATION
 election_outcomes_ast.1.d: "Vůdce Liberální strany [AST.GetLeader] byl včera večer sesazen, když Kevin Rudd dovedl Labouristickou stranu k drtivému vítězství a získal celostátní posun hlasů o 5,7 %. Labouristická strana nyní poprvé v australských dějinách vládne ve všech státech a teritoriích. Postavení místopředsedkyně Julie Gillardové je zároveň poprvé, kdy žena zastává druhý nejvyšší veřejný úřad v zemi. \n\nVůdce koalice již odstoupil a během noci Ruddovi zavolal, aby mu k vítězství pogratuloval. Nový [GetASTLeaderTitle] vedl kampaň za zlepšení pracovních vztahů, práva původních obyvatel a rychlá opatření proti změně klimatu. Usiluje o nasměrování země novým směrem, jak poznamenal ve svém vítězném projevu: \"Dnes byla volba svěřena lidu a Austrálie pohlédla do budoucnosti.\"" # todo: NEW TRANSLATION
 election_outcomes_ast.1.a: "A budoucnost je právě teď." # todo: NEW TRANSLATION
 election_outcomes_ast.2.t: "Nečekané vítězství koalice" # todo: NEW TRANSLATION
 election_outcomes_ast.2.d: "Předpovědi vítězství Labouristické strany byly rozdrceny, když koalice rázně vykročila k dalšímu volebnímu období. [GetASTLeaderTitle] [AST.GetLeader] označil výsledky za vítězství mlčící většiny a ve svém projevu nastínil plány na další ekonomické investice. Ačkoli koalice zůstane ve vládě, ALP výrazně posílila téměř ve všech státech a teritoriích, takže současné vládě zůstala jen těsná většina. \n\nKevin Rudd údajně zavolal [GetASTLeaderTitle], aby mu k vítězství pogratuloval, a očekává se, že se ke své porážce vyjádří později večer. Koalice nyní nese odpovědnost za vedení země a zároveň musí udržet nově obnovenou důvěru veřejnosti ve stranu." # todo: NEW TRANSLATION
 election_outcomes_ast.2.a: "Jen klidně dál!" # todo: NEW TRANSLATION
 a_global_financial_crisis.3.t: "Důsledky krize ustupují" # todo: NEW TRANSLATION
 a_global_financial_crisis.3.d: "Přetrvávající důsledky finanční krize v posledních týdnech téměř zcela odezněly. Ekonomika se z větší části vrátila na předchozí úroveň a veřejné mínění se zlepšilo díky podpoře našeho úsilí. Zdá se, že naše reakce na krizi se nakonec vyplatila a dokonce učinila naši ekonomiku odolnější vůči podobným hospodářským otřesům v budoucnu." # todo: NEW TRANSLATION
 a_global_financial_crisis.3.a: "Jsme zpátky ve hře." # todo: NEW TRANSLATION
 turnbull_letter_ast.1.t: "Turnbullův dopis" # todo: NEW TRANSLATION
 turnbull_letter_ast.1.d: "Současný vůdce Liberální strany Malcolm Turnbull vystoupil proti naší vládě s tvrzením, že má e-mail dokazující naši korupci. Můžeme pouze spekulovat, co přesně dopis obsahuje, ale zřejmě je natolik závažný, že přesvědčil média, aby jej zveřejnila. Naši lidé tvrdí, že Turnbullův zdroj pochází přímo z vlády, což znamená, že ve straně možná máme špeha. \n\nOčekává se, že Malcolm Turnbull dopis v příštích týdnech odhalí v parlamentu. Prozatím můžeme jen držet palce a doufat, že škody nebudou příliš velké." # todo: NEW TRANSLATION
 turnbull_letter_ast.1.a: "Co jsme provedli?" # todo: NEW TRANSLATION
 turnbull_letter_ast.2.t: "Podvržený dopis" # todo: NEW TRANSLATION
 turnbull_letter_ast.2.d: "Ukázalo se, že nechvalně známý e-mail Malcolma Turnbulla nebyl nic než podvod. Během celostátního vyšetřování tohoto tvrzení jeho zdroj sám přiznal, že si celou věc vymyslel. Stranický špeh Godwin Grech zásoboval Turnbulla falešnými informacemi, aby získal vliv. Následná kritika prakticky potopila Turnbullovu popularitu a proměnila Liberální stranu v rozhádaný chaos. Naše průzkumy se mezitím opět zlepšily a Grech byl ze strany okamžitě vyloučen." # todo: NEW TRANSLATION
 turnbull_letter_ast.2.a: "Ani na okamžik jsme tomu nevěřili!" # todo: NEW TRANSLATION
 oceanic_viking_ast.1.t: "Dilema lodi Oceanic Viking" # todo: NEW TRANSLATION
 oceanic_viking_ast.1.d: "Zdá se, že jedna z našich námořních lodí využívaných k ochraně hranic zadržela 78 srílanských žadatelů o azyl, kteří se pokoušeli vstoupit do Austrálie. Jakmile byli na palubě, byli podle naší současné politiky odvezeni na indonéský ostrov Bintan ke zpracování žádostí. Nyní však odmítají vystoupit na pevninu na protest. \n\nJde už o 49. zadržení plavidla v tomto roce a média se kolem případu opět rojí. Posádce Oceanic Viking se zatím nepodařilo uprchlíky odstranit a čím déle loď zůstává na místě, tím hůře to pro nás vypadá. Opozice již případ využívá k vykreslení naší slabosti vůči nelegální migraci a zdá se, že někteří žadatelé o azyl na palubě potřebují lékařskou pomoc. \n\nMůžeme vyjednávat, nebo je vyvést silou." # todo: NEW TRANSLATION
 oceanic_viking_ast.1.a: "Poskytněte jim přednostní vyřízení." # todo: NEW TRANSLATION
 oceanic_viking_ast.1.b: "Pošlete tam vojáky." # todo: NEW TRANSLATION
 oceanic_viking_ast.2.t: "Protimigrační protesty nabývají na síle" # todo: NEW TRANSLATION
 oceanic_viking_ast.2.d: "Ve většině našich velkých měst vypukly protesty kvůli výsledku případu Oceanic Viking, které z velké části podněcovali pravicoví politici. Strana One Nation je vůči tomuto kroku obzvláště hlasitě kritická, dokonce agresivněji než opozice, a navzdory své malé velikosti přitáhla na internetu značnou pozornost. \n\nJejí bývalá vůdkyně Pauline Hansonová, která si vybudovala kariéru na kontroverzní rétorice, během shromáždění v Queenslandu naši vládu rovněž napadla a označila ji za \"proti australskou\". V reakci na to vypukly také menší protidemonstrace, které vedly k řadě střetů." # todo: NEW TRANSLATION
 oceanic_viking_ast.2.a: "Proč se všichni nemohou uklidnit?" # todo: NEW TRANSLATION
 oceanic_viking_ast.3.t: "Operační pochybení" # todo: NEW TRANSLATION
 oceanic_viking_ast.3.d: "Podle našich pokynů byla k násilnému odstranění žadatelů o azyl z plavidla nasazena SAS. Zdá se, že naše operační znalosti byly před akcí omezené. Když jednotka skutečně nastoupila na loď, zjistila, že jeden ze srílanských migrantů je ozbrojen pistolí, a mezi nimi vypukla přestřelka. Naštěstí byl zraněn pouze jeden z našich mužů, ale čtyři migranti na palubě byli zabiti a dva zraněni. Zbytek byl úspěšně odstraněn a přepraven do zadržovacího centra na Bintanu. \n\nV reakci na událost bylo svoláno zasedání Organizace spojených národů a očekávaná kritika je mimořádně silná. Ve většině našich velkých měst vypukly protesty, které podnítily také vlastní protidemonstrace. Jedinou útěchou je, že opozice zůstává poměrně zticha." # todo: NEW TRANSLATION
 oceanic_viking_ast.3.a: "Jak se to mohlo stát?" # todo: NEW TRANSLATION
 aus_cylcone.1.t: "Cyklon Ului zasáhl Queensland" # todo: NEW TRANSLATION
 aus_cylcone.1.d: "Jeden z nejhorších cyklonů, jaké jsme kdy zažili, dorazil na pevninu v Queenslandu, způsobil škody na infrastruktuře v celém státě a na několik dní připravil o elektřinu více než 60 000 domácností. Cyklon prošel přes Šalomounovy ostrovy a udržel si intenzitu třetí kategorie, než zeslábl. Díky včasným varováním byla většina obyvatel z ohrožených oblastí předem evakuována, přesto byla hlášena jedna oběť. \n\nOd té doby byly nasazeny Národní pohotovostní služby a ADF, aby opravily škody a obnovily dodávky elektřiny." # todo: NEW TRANSLATION
 aus_cylcone.1.a: "Přesto je to tragédie." # todo: NEW TRANSLATION
 great_barrier_reef.1.t: "Únik ropy na Velkém bariérovém útesu" # todo: NEW TRANSLATION
 great_barrier_reef.1.d: "Čínská nákladní loď převážející uhlí najela na mělčinu východně od Rockhamptonu ve středním Queenslandu. Plavidlo bylo více než 10 kilometrů mimo plavební dráhu, když narazilo do útesu. Poté se po značnou vzdálenost táhlo podél něj, než se zastavilo, a unikly z něj více než dvě námořní míle těžkého topného oleje. \n\nDosud byly vyslány remorkéry, aby loď odtáhly, existují však obavy, že by se v rozbouřeném moři mohla rozlomit. UNESCO a naši správci útesu zuří nad tím, že loď byla tak daleko od kurzu a že okolní oblast může být nyní kontaminována. Spolupracujeme s nimi na minimalizaci škod, jde však o pomalý proces." # todo: NEW TRANSLATION
 great_barrier_reef.1.a: "Velmi nešťastné." # todo: NEW TRANSLATION
 ast_elections.3.t: "Volební den" # todo: NEW TRANSLATION
 ast_elections.3.d: "Stánky se balí, reklamy utichají a stranická ústředí jsou v nejvyšší pohotovosti. Předvolební kampaň skončila a volební místnosti byly připraveny na volební den. Australané z celé země se brzy shromáždí, aby rozhodli o budoucnosti parlamentu, a nyní je rozhodnutí o našem příštím vůdci v jejich rukou." # todo: NEW TRANSLATION
 ast_elections.3.a: "Ať vyhraje nejlepší kandidát." # todo: NEW TRANSLATION
 dissolution_election_rudd.3.t: "Rudd drtivě vítězí" # todo: NEW TRANSLATION
 dissolution_election_rudd.3.d: "Členové ústředí Labouristické strany slaví vítězství Kevina Rudda, které představuje první po sobě jdoucí vítězství strany od roku 1993 a potvrzuje naděje mnoha příznivců [GetASTLeaderTitle]. Labouristé jsou ZPĚT. \n\nPo měsících kampaně za pokračování reforem výsledky potvrdily Ruddův mandát. Labouristická strana získala většinovou vládu, která by měla být vytvořena v příštích týdnech díky přílivu nových poslanců. Téměř celý stát Queensland se zbarvil do ruda. \n\nVýsledky voleb přinesly Zeleným také dvě další křesla, což ukazuje na rostoucí veřejnou podporu opatření proti změně klimatu." # todo: NEW TRANSLATION
 dissolution_election_rudd.3.a: "Zpět do práce." # todo: NEW TRANSLATION
 dissolution_election_rudd.4.t: "Tony Abbott pluje k vítězství" # todo: NEW TRANSLATION
 dissolution_election_rudd.4.d: "Dav v přeplněném sále hotelu Four Seasons skandoval \"Tony, Tony, Tony\", když Liberální strana vybojovala vítězství v jedněch z nejtěsnějších voleb v dějinách země. Konzervativní vůdce, který vedl kampaň plnou ohnivé rétoriky a slibů, že \"zastaví lodě\", prohlásil, že je \"pokorný\" z možnosti převzít vedení vlády. \"Ode dneška prohlašuji, že Austrálie má nové vedení a Austrálie je opět otevřená podnikání.\" \n\nAbbott, kritický vůči klimatické politice, během kampaně upoutal pozornost silným odporem vůči směru veřejného mínění, voliči však promluvili. Lze očekávat důrazné postoje k imigraci a fiskální konzervatismus, zatímco Labouristická strana balí kufry a Liberálové se znovu ujímají úřadů." # todo: NEW TRANSLATION
 dissolution_election_rudd.4.a: "Liberálové jsou zpět!" # todo: NEW TRANSLATION
 ast_elections.1.t: "Volební sprint" # todo: NEW TRANSLATION
 ast_elections.1.d: "Volební období se přiblížilo a začal čas kampaně. Podle volebního zákona máme na předání našeho poselství pouhých osm týdnů. Ať už toho dosáhneme zahlcením médií, cestováním po zemi nebo debatami s opozicí, čas běží. Musíme vyrazit do terénu a pustit se do práce, pokud chceme vyhrát." # todo: NEW TRANSLATION
 ast_elections.1.a: "Vpřed s Liberály!" # todo: NEW TRANSLATION
 ast_elections.1.b: "Férově s Labouristy!" # todo: NEW TRANSLATION
 ast_elections.1.c: "Austrálie na prvním místě s One Nation!" # todo: NEW TRANSLATION
 ast_elections.1.e: "Bojujte za změnu se Zelenými!" # todo: NEW TRANSLATION
 special_gillard_election.1.t: "Vyhlášení nových voleb" # todo: NEW TRANSLATION
 special_gillard_election.1.d: "Jediným způsobem, jak zpečetit legitimitu naší nové vlády, jsou nové všeobecné volby. Pokud dokážeme získat jejich hlasy a zajistit si další mandát, získáme potřebné oprávnění pokračovat ve vedení země a možná zmírníme odpor opozice při přijímání zákonů. Každé volby s sebou nesou riziko, takže během následujících 60 dní budeme muset pořádně zabrat." # todo: NEW TRANSLATION
 special_gillard_election.1.a: "Vpřed a vzhůru." # todo: NEW TRANSLATION
 election_outcomes_ast.5.t: "Výsledky voleb: patový parlament!" # todo: NEW TRANSLATION
 election_outcomes_ast.5.d: "Volební překvapení, k jakému nedošlo od roku 1940: žádná ze stran nezvítězila jednoznačně. Koalice i Labouristická strana získaly při sčítání 72 křesel, tedy o čtyři méně, než je zapotřebí k vytvoření vlády. Noc tak skončila rozpačitě, když oba kandidáti vystoupili na pódium a prohlásili, že navzdory sečteným výsledkům volby ještě neskončily. \n\nBěhem příštích několika dní budou strany muset bojovat ve Sněmovně reprezentantů a vyjednávat se zbývajícími poslanci, aby zajistily vznik vlády." # todo: NEW TRANSLATION
 election_outcomes_ast.5.a: "Rozdělený národ." # todo: NEW TRANSLATION
 election_outcomes_ast.4.t: "Další vítězství Ruddovy vlády" # todo: NEW TRANSLATION
 election_outcomes_ast.4.d: "Sydney včera večer zaplnily davy, když dorazily výsledky volebního vítězství Labouristické strany. Po dalším období silné politiky Kevin Rudd znovu získal přízeň veřejnosti, obdržel 48 % hlasů a získal několik koalicí držených křesel v Queenslandu, čímž pronikl do dřívějších pro-těžebních bašt v okolí Bowenovy pánve. \n\nRudd oslavil vítězství spolu se svou rodinou na kriketovém hřišti Gabba, kde promluvil o svém třetím volebním vítězství. \n\n\"Moje rodina do veřejného života i do mé kampaně vložila všechno. V nadcházejících dnech budeme Thérèse a já trávit čas společně, samozřejmě i s dětmi, a pak se vrátíme k práci. Představení ještě neskončilo.\"" # todo: NEW TRANSLATION
 election_outcomes_ast.4.a: "Dobré časy pokračují." # todo: NEW TRANSLATION
 election_outcomes_ast.6.t: "Gillardová získává další mandát" # todo: NEW TRANSLATION
 election_outcomes_ast.6.d: "První australská žena v úřadu [GetASTLeaderTitle] navzdory nepříznivým počátečním průzkumům znovu získala podporu veřejnosti a vytvořila menšinovou vládu. Gillardová poděkovala svým podporovatelům v melbournském Kongresovém a výstavním centru a nastínila své plány na fiskálně odpovědné vedení a další reformy zdravotnictví. \n\nVůdce opozice Tony Abbott Gillardové krátce po zveřejnění výsledků zavolal, aby jí pogratuloval k vítězství. Po další porážce se očekává, že Abbott odstoupí z vedení strany, což naznačuje změnu stranické politiky v reakci na neúspěch posunout stranu doprava." # todo: NEW TRANSLATION
 election_outcomes_ast.6.a: "Vítězství rozumné politiky." # todo: NEW TRANSLATION
 new_governor_general_ast.1.t: "Nový generální guvernér" # todo: NEW TRANSLATION
 new_governor_general_ast.1.d: "Poprvé v dějinách našeho národa byla žena uvedena do úřadu nové generální guvernérky. Quentin Bryceová, pětašedesátiletá bývalá právnička a guvernérka státu Queensland, se stala 25. generální guvernérkou Austrálie a první ženou v této funkci za 107 let. \n\nBěhem ceremonie v parlamentu v Canbeře složila Bryceová přísahu věrnosti královně, zatímco venku zazněla salva z 21 děl. \n\n\"Chci, abyste věděli, že tuto roli přijímám se vší vážností, nestranností, energií a hlubokou láskou k zemi, kterou sdílíme,\" řekla. \"Slibuji, že budu otevřená, vnímavá a věrná současnému myšlení a fungování australské společnosti.\"" # todo: NEW TRANSLATION
 new_governor_general_ast.1.a: "Časy se skutečně mění." # todo: NEW TRANSLATION
 indo_cattle_drama.1.t: "Dilema indonéského vývozu dobytka" # todo: NEW TRANSLATION
 indo_cattle_drama.1.d: "ABC nedávno odvysílala svůj pořad Four Corners, který odhalil systémovou krutost v indonéském dobytčím průmyslu. Záběry jsou velmi drastické a silné rozhořčení veřejnosti požaduje, abychom okamžitě zastavili vývoz dobytka do Indonésie. Můžeme pozastavit vývoz živého dobytka, dokud Indonésie nepřijme nový regulační rámec, zákaz by však finančně ochromil naše farmy na severu." # todo: NEW TRANSLATION
 indo_cattle_drama.1.a: "Pozastavte vývoz." # todo: NEW TRANSLATION
 indo_cattle_drama.1.b: "Nestojí to za to." # todo: NEW TRANSLATION
 malaysia_solution_ast.1.t: "Malajsijské řešení" # todo: NEW TRANSLATION
 malaysia_solution_ast.1.d: "Vzhledem k zoufalému stavu našich současných imigračních detenčních center se Malajsie ozvala s nabídkou převzít 800 žadatelů o azyl, které zadržujeme, výměnou za přijetí 4 000 zpracovaných uprchlíků. Vyřešilo by to naše bezprostřední problémy s detencí a uklidnilo část veřejné kritiky, Malajsie však není signatářem Úmluvy OSN o právním postavení uprchlíků, což činí celou dohodu právně pochybnou." # todo: NEW TRANSLATION
 malaysia_solution_ast.1.a: "Plácneme si." # todo: NEW TRANSLATION
 malaysia_solution_ast.1.b: "Právně to neobstojí." # todo: NEW TRANSLATION
 malaysia_solution_ast.2.t: "Nejvyšší soud zablokoval dohodu s Malajsií" # todo: NEW TRANSLATION
 malaysia_solution_ast.2.d: "Nejvyšší soud Austrálie bohužel rozhodl, že výměna je podle migračního zákona nezákonná, a transfer zablokoval. Bezprostřední reakcí byla záplava obvinění ze strany opozice a veřejné reakce se nyní ještě zhoršily. Možná budeme muset zvážit jiné způsoby řešení našeho problému s imigrační detencí." # todo: NEW TRANSLATION
 malaysia_solution_ast.2.a: "Není to tak snadné." # todo: NEW TRANSLATION
 embassy_tent_protests.1.t: "Protesty u stanového velvyslanectví" # todo: NEW TRANSLATION
 embassy_tent_protests.1.d: "U příležitosti 40. výročí domorodého stanového velvyslanectví, protestní okupace podporující práva původních obyvatel před parlamentem v roce 1972, se poblíž tohoto místa v restauraci Lobby koná slavnostní předávání cen. Zdá se, že skupina demonstrantů shromážděných na místě se přesunula směrem k restauraci. Něco je zřejmě rozvášnilo, protože někteří už začínají bušit do oken. \n\nProtože se akce účastní [GetASTLeaderTitle] i vůdce opozice, bezpečnostní služba doporučila okamžitou evakuaci vrtulníkem, který čeká poblíž. Dav působí značně rozjitřeně, možná by však otevřený dialog mohl situaci uklidnit." # todo: NEW TRANSLATION
 embassy_tent_protests.1.a: "Dostaňte mě odsud!" # todo: NEW TRANSLATION
 embassy_tent_protests.1.b: "Promluvme si s davem." # todo: NEW TRANSLATION
 embassy_tent_protests.2.t: "[GetASTLeaderTitle] zraněn" # todo: NEW TRANSLATION
 embassy_tent_protests.2.d: "Nastala bezpečnostní noční můra, když ochranka doprovázející Gillardovou vytvořila v davu průchod, aby mohla vyjít ven a promluvit s demonstranty. Jen minutu poté zasáhl [GetASTLeaderTitle] předmět vržený jedním z protestujících, srazil ji k zemi a poranil ji na oku. Policie a ochranka vtrhly do davu a Julii Gillardovou z akce evakuovaly, po návštěvě nemocnice se však ukázalo, že poškození pravého oka je trvalé. \n\nVůdce opozice Tony Abbott chvíli ve sněmovně chválil [GetASTLeaderTitle] za její odvahu a útok odsoudil." # todo: NEW TRANSLATION
 embassy_tent_protests.2.a: "Ach ne..." # todo: NEW TRANSLATION
 embassy_tent_protests.3.t: "Uklidnění davu" # todo: NEW TRANSLATION
 embassy_tent_protests.3.d: "Jakmile Rudd opustil pavilon, naštěstí se nic nepokazilo. Dav se zdál uklidnit, jakmile se mezi jeho členy začal pohybovat. Vypadalo to, že rozruch vyvolala poznámka Tonyho Abbotta, a poté, co byl vůdce opozice evakuován, napětí opadlo. \n\n[GetASTLeaderTitle] strávil s davem a přítomnými novináři hodinu, než se vrátil na ceremonii. Přineslo to příjemnou pozitivní publicitu." # todo: NEW TRANSLATION
 embassy_tent_protests.3.a: "Tak se to dělá." # todo: NEW TRANSLATION
 embassy_tent_protests.4.t: "Potyčka s demonstranty" # todo: NEW TRANSLATION
 embassy_tent_protests.4.d: "Poté, co ochranka vytvořila v davu průchod pro Tonyho, aby mohl opustit pavilon a promluvit s demonstranty, jeden z nich se na něj vrhl, zřejmě pod vlivem alkoholu. [GetASTLeaderTitle] v reakci udeřil pěstí. Protestující neutrpěl žádná vážná zranění a je zřejmé, že se Abbott bránil, novináři uvnitř však pořídili všechny potřebné fotografie a nyní to vypadá, jako by [GetASTLeaderTitle] doslova bojoval s demonstranty." # todo: NEW TRANSLATION
 muslim_protests_sydney.1.t: "V Sydney propukly islámské nepokoje" # todo: NEW TRANSLATION
 muslim_protests_sydney.1.d: "V sérii masových demonstrací od Blízkého východu až po Londýn protestovali muslimové proti kontroverznímu uvedení filmu \"Nevinnost muslimů\". Sydney nebylo výjimkou a protesty se rozšířily do centrální obchodní čtvrti. K protestům bylo povoláno více než 150 policistů a šest z nich bylo po vypuknutí nepokojů odvezeno do nemocnice. \n\nDosud bylo zatčeno osm osob a po napjatém střetu před americkým konzulátem se dav začal rozcházet." # todo: NEW TRANSLATION
 muslim_protests_sydney.1.a: "Tohle není místo pro extremismus." # todo: NEW TRANSLATION
 murrawarri_republic_event.1.t: "Murrawarrijská republika vyhlásila nezávislost" # todo: NEW TRANSLATION
 murrawarri_republic_event.1.d: "Náš parlament obdržel dopis oznamující nezávislost státu, který si říká Murrawarrijská republika. V dopise se uvádí, že \"Lidová rada Murrawarri\" si nárokuje území rozkládající se na hranici mezi Novým Jižním Walesem a Queenslandem jako svou novou suverénní zemi a požaduje uznání. \n\nUpřímně řečeno jde o nejpodivnější věc, jakou kdy naši zaměstnanci viděli, a zdá se, že pro tento požadavek ani pro naši odpověď neexistuje žádný právní základ." # todo: NEW TRANSLATION
 murrawarri_republic_event.1.a: "Murra-co?" # todo: NEW TRANSLATION
 shark_attacks_ast.1.t: "Útoky žraloků zvyšují obavy veřejnosti" # todo: NEW TRANSLATION
 shark_attacks_ast.1.d: "Asi 270 kilometrů jižně od Perthu, poblíž Gracetownu, zabil žralok pětatřicetiletého muže. O šest dní později zahynul při útoku žraloka poblíž Coffs Harbour další surfař, osmnáctiletý Zac Young. Náhlá série úmrtí souvisejících se žraloky přiměla vládu Západní Austrálie přislíbit agresivnější přístup k lovu žraloků, kteří se dostávají do oblíbených plaveckých oblastí. \n\nNavzdory tomu, že riziko útoků žraloků v posledních letech klesá, vláda Západní Austrálie vynaložila více než 20 milionů dolarů na letecké hlídky a odstřel, aby snížila počet žraloků. Mořští biologové tento krok zpochybňují jako přehnanou reakci." # todo: NEW TRANSLATION
 shark_attacks_ast.1.a: "Jsme přátelé, ne potrava!" # todo: NEW TRANSLATION
 election_outcomes_ast.3.t: "Labouristé získávají další mandát" # todo: NEW TRANSLATION
 election_outcomes_ast.3.d: "Australané se shromáždili po celé zemi, aby odevzdali svůj hlas a rozhodli o budoucím směřování národa. Tentokrát zvolili pokračování vlády [AST.GetLeader] a udělili straně další mandát. [GetASTLeaderTitle] pronesl volební projev v ústředí v Bartonu, obklopen jásajícím davem labouristických příznivců, a nastínil pokračování svých plánů na příští tři roky. Zdá se, že \"kletba úřadující vlády\" Labouristické strany byla zlomena a proměnila se v dar, který odvrátil voliče od změny ve prospěch pokračující stability." # todo: NEW TRANSLATION
 election_outcomes_ast.3.a: "Proč zastavovat něco, co funguje?" # todo: NEW TRANSLATION
 election_outcomes_ast.7.t: "Liberální strana znovu vítězí ve volbách" # todo: NEW TRANSLATION
 election_outcomes_ast.7.d: "Když volební oslavy utichly a sčítání skončilo, očekává se, že úřadující [AST.GetLeader] rozhodně zvítězí v opětovných volbách. Mandát jeho vlády si nadále získává většinu voličů a upevnil její pozici ve Sněmovně i Senátu, s menšími zisky po celé zemi. Očekává se, že parlament začne fungovat jako obvykle a nové volební období začne příští měsíc." # todo: NEW TRANSLATION
 election_outcomes_ast.7.a: "Dobré časy pokračují!" # todo: NEW TRANSLATION
 election_outcomes_ast.9.t: "Malcolm Turnbull těsně vítězí ve volbách" # todo: NEW TRANSLATION
 election_outcomes_ast.9.d: "Vůdce Liberální strany Malcolm Turnbull prohlásil vítězství ve federálních volbách, když koalice směřuje k těsné většině v parlamentu. \n\n\"Dnes je skvělý den,\" řekl Turnbull novinářům před svým večerním projevem. \n\nPo kampani za vytvoření vlády, která přijme více technokratický směr, pronesl nový [GetASTLeaderTitle] svůj vítězný projev právě v tomto duchu. \n\n\"Musíme být konkurenceschopnější, musíme být produktivnější a – musíme být inovativnější.\" \n\nOčekává se, že Turnbullova vláda se vypořádá s rostoucími energetickými nároky země a rozvíjejícím se technologickým sektorem. Jak sám řekl, bude k tomu přistupovat \"s ochotou hledat společnou půdu s lidmi i našimi průmyslovými odvětvími. Pokrok znamená pomáhat všem – vím, že dokážeme dosáhnout něčeho velkého, pokud k tomu využijeme naše nejlepší mozky.\"" # todo: NEW TRANSLATION
 election_outcomes_ast.9.a: "Na světlejší směr!" # todo: NEW TRANSLATION
 detention_centres_full.1.t: "Detenční centra dosahují kapacity" # todo: NEW TRANSLATION
 detention_centres_full.1.d: "Centra na Papui a Nauru se začala naplňovat, navzdory svému původnímu rozsahu a úspěchu, což způsobuje zácpu v našem systému zpracování migrantů. Přestože do center již směřují finanční prostředky na odstranění současných nedostatků, pokud chceme problém vyřešit dlouhodobě, budeme muset usilovat o další zlepšení nebo jiné možnosti. K tomu dochází v době, kdy počet neoprávněných příchozích vzrostl na nejvyšší úroveň za poslední roky." # todo: NEW TRANSLATION
 detention_centres_full.1.a: "Vydrží vůbec něco?" # todo: NEW TRANSLATION
 migration_event_ast.1.t: "Neoprávněná imigrace dosahuje nového rekordu" # todo: NEW TRANSLATION
 migration_event_ast.1.d: "Počet nelegálních migrantů pokoušejících se přistát na našich březích v posledních měsících prudce vzrostl. Ať už je pohánějí probíhající krize, nebo závist vůči našemu prosperujícímu národu, přicházejí ze všech koutů světa a mnozí předbíhají frontu. Naše pohraniční hlídka zaznamenala historicky nejvyšší počet zadržení a začíná to zatěžovat naše operační kapacity." # todo: NEW TRANSLATION
 migration_event_ast.1.a: "Tohle jsou znepokojivé časy." # todo: NEW TRANSLATION
 aukus_formed_ast.1.t: "Partnerství AUKUS v praxi" # todo: NEW TRANSLATION
 aukus_formed_ast.1.d: "Vůdci Austrálie, Spojeného království a Spojených států se dnes ve Washingtonu, D.C., setkali v Pentagonu, aby projednali vytvoření trilaterální aliance. Součástí jednání byly údajně kybernetické schopnosti, umělá inteligence a ochrana dodavatelských řetězců, to vše s cílem prohloubit diplomatickou a obrannou spolupráci mezi třemi státy. \n\n\"Po více než 70 let Austrálie, Spojené království a Spojené státy spolupracovaly... Dnes se k této vizi znovu hlásíme.\" \n\nPartnerství bude zřejmě fungovat jako doplněk k současným aliancím těchto tří zemí. [AST.GetLeader] uvedl, že prvním záměrem AUKUS je posílení obranné spolupráce." # todo: NEW TRANSLATION
 aukus_formed_ast.1.a: "Dva jsou společnost, tři jsou partnerství." # todo: NEW TRANSLATION
 pukpuk_treaty_event.1.t: "Historická smlouva mezi Papuou-Novou Guineou a Austrálií vstoupila v platnost" # todo: NEW TRANSLATION
 pukpuk_treaty_event.1.d: "Přelomová \"Pukpukská smlouva\" mezi Papuou-Novou Guineou a Austrálií byla dokončena a [GetASTLeaderTitle] ji označil za povýšení vztahů mezi našimi zeměmi, když hovořil o jejich spojení \"jako sousedů, jako přátel a nyní jako spojenců\". \n\nSmlouva, pojmenovaná podle místního výrazu pro krokodýla, zahájí proces začlenění armády Papuy-Nové Guiney do australských obranných sil a umožní službu až 10 000 občanům Papuy-Nové Guiney. Obě země se také zavážou vzájemně si pomoci, pokud bude kterákoli z nich napadena. Jde o výrazné posílení regionální bezpečnosti a stability." # todo: NEW TRANSLATION
 pukpuk_treaty_event.1.a: "Našim partnerům a přátelům!" # todo: NEW TRANSLATION
 ast_taiwan_recognition.1.t: "Austrálie uznává Čínskou republiku" # todo: NEW TRANSLATION
 ast_taiwan_recognition.1.d: "V rámci zásadního obratu v dlouhodobě oboustranně podporované politice [AST.GetLeader] formálně uznal Tchaj-wan jako suverénní a nezávislý stát. Jde o první odklon země od postoje pevninské Číny od návštěvy Gougha Whitlama v roce 1971. V rámci \"hnutí za mír\" v indicko-pacifickém regionu [GetASTLeaderTitle] uvedl, že uznání představuje \"uznání reality\" a prosazuje koncept dvou Čín. \n\nReakce Číny byly rychlé a ostré. Čínští ministři na internetu označili Austrálii za \"pokrytecký národ\" a ministerstvo zahraničí okamžitě začalo zavádět řadu omezení obchodu mezi oběma zeměmi, jen krůček od úplného embarga." # todo: NEW TRANSLATION
 ast_taiwan_recognition.1.a: "Opravdový přítel." # todo: NEW TRANSLATION
 howard_rumblings_in_dark.1.t: "Nespokojenost ve straně" # todo: NEW TRANSLATION
 howard_rumblings_in_dark.1.d: "V Liberální straně vždy existovala určitá míra bojovnosti a při každé kontroverzi často vyplouvala na povrch. Howard věděl, že jediným rozdílem mezi kolegou a nespokojeným kolegou jsou dobré výsledky průzkumů, a ty byly v poslední době zoufale špatné. Zákulisní reptání si proklestilo cestu do novin, ale i bez bulváru byla kritika slyšet. \n\nNěkteří tvrdili, že je Howard jednoduše příliš starý, jiní, že \"ztratil kontakt s realitou\". Věděl, že navzdory tomuto názoru má k zákulisním intrikám velmi dobrý přehled. Jeho vlastní zástupce Peter Costello již podnikal kroky k příští volbě vedení. Uzavíral dohody a získával hlasy, a pokud by Howard nedokázal věci zvrátit ve svůj prospěch, přišel by o premiérský úřad a nastoupil by Costello. Taková byla povaha stranické politiky." # todo: NEW TRANSLATION
 howard_rumblings_in_dark.1.a: "Musíme to napravit." # todo: NEW TRANSLATION
 howard_rumblings_in_dark.2.t: "Zrada v kabinetu" # todo: NEW TRANSLATION
 howard_rumblings_in_dark.2.d: "Nepřišlo to zničehonic, ale zprávu obdržel v časných ranních hodinách. Howard se rozhodl, že místo aby ho vláčeli bahnem a vrhali je na něj během volby vedení, odejde podle vlastních podmínek. Vytáhl stranu z pokraje propasti a nyní ho vyhazovali. \n\n\"Každý den mého života v posledních letech pro mě bylo nesmírnou ctí být [GetASTLeaderTitle] této krásné země a chci australskému lidu poděkovat za výsadu, kterou mi po tuto dobu poskytoval. Respektuji ji a ctím. Po letech úsilí bylo vedení tohoto národa nejneuvěřitelnější zkušeností mého života.\" \n\n\"Chci australskému lidu poděkovat za výsadu, kterou mi poskytl, když mi dovolil sloužit. Přijímám plnou odpovědnost za Liberální stranu, za její úspěchy i porážky. Není snadné ztratit své místo ve straně. Přesto jí dlužím více, než ona dluží mně.\" \n\nSkončil krátkým zamáváním a poté se vrátil do Bennelongu. Zpět k zelenějším pastvinám..." # todo: NEW TRANSLATION
 howard_rumblings_in_dark.2.a: "Přesto to bolelo." # todo: NEW TRANSLATION
 abbott_gov_event.1.t: "Abbottova vláda představuje kabinet s převahou mužů" # todo: NEW TRANSLATION
 abbott_gov_event.1.d: "Nově zvolený [GetASTLeaderTitle] Tony Abbott představil kabinet bohatý na zkušenosti, s 15 veterány Howardovy vlády, avšak chudý na ženské zastoupení. Jedinou ženou v devatenáctičlenném kabinetu je místopředsedkyně [GetASTLeaderTitle] Julie Bishopová. \n\nAbbott prohlásil, že je zklamán, že v kabinetu nejsou \"alespoň dvě\" ženy, očekává však, že ženy budou postupně povyšovány. \"Dobré a talentované\" ženy z nižších ministerských funkcí podle něj \"klepou na dveře\" kabinetu. Z jedenácti členů nižších ministerských funkcí jsou však pouze čtyři ženy. \n\nTato nerovnováha vyvolala četnou kritiku opozičních stran, kterou Abbott rychle odmítl s odkazem na \"větší problémy\"." # todo: NEW TRANSLATION
 abbott_gov_event.1.a: "Vždyť jde přece o meritokracii." # todo: NEW TRANSLATION
 abbott_gov_event.2.t: "Austrálie hlasuje pro uznání původních obyvatel" # todo: NEW TRANSLATION
 abbott_gov_event.2.d: "Po celostátním hlasování, v němž návrh podpořilo 74 % voličů, budou australští Aboriginci a obyvatelé Torresova průlivu zakotveni v ústavě jako součást nového přístupu Abbottovy vlády k uznání původních obyvatel. Na každoročním kulturním festivalu Garma před referendem Abbott prohlásil, že \"uznání původních obyvatel naši ústavu nezmění, ale dokončí ji\", a označil změnu za okamžik uzdravení pro mnoho lidí. \n\nOd zveřejnění výsledků Abbott také znovu potvrdil svůj plán strávit týden v komunitě původních obyvatel. \n\n\"Faktem je, že pokud jsou tato místa domovem prvních Australanů, proč by neměla být domovem [GetASTLeaderTitle] naší země?\"" # todo: NEW TRANSLATION
 abbott_gov_event.2.a: "Velmi pravdivé." # todo: NEW TRANSLATION
 abbott_gov_event.3.t: "Cibulový incident" # todo: NEW TRANSLATION
 abbott_gov_event.3.d: "Tony Abbott se vydal na venkovskou Tasmánii, kde se v rámci svého zemědělského projektu setkal s místními farmáři. Kolem pavilonu se shromáždili novináři, zatímco si Tony potřásal rukama a vedle jednoho z farmářů pronesl krátký projev. \n\nPřed ním stál hranatý koš překypující úrodou, jedna plodina zralejší a lesklejší než druhá. Zatímco farmář novinářům vysvětloval projekt, Abbott myslel na cibuli. \n\nUvěří novináři, že je farmářům skutečně oddaný, když jim to neukáže? Jak by mohli poznat, že australské produkty jsou skutečně nejlepší na světě? \n\nKdyž se díval na cibuli, někdo vedle něj začal pokřikovat. \"Tak si z ní teď ukousněte, jestli máte odvahu!\" \n\nŘekli to opravdu, nebo ho k tomu ponoukaly Tonyho vlastní myšlenky? Než se vzpamatoval, držel v ruce cibuli. Fotoaparáty cvakaly a ozývalo se několik posměšných výkřiků, když se zakousl do syrové cibule. Farmář se nevěřícně otočil, zatímco Tony jen na okamžik přestal, přikývl a ukousl si znovu. \"Velmi dobré,\" dokázal ze sebe dostat, když sledoval Tonyho další přežvykování." # todo: NEW TRANSLATION
 abbott_gov_event.3.a: "Proč to udělal?" # todo: NEW TRANSLATION
 abbott_gov_event.4.t: "Cesta do buše" # todo: NEW TRANSLATION
 abbott_gov_event.4.d: "Do stanu si navzdory síti a neustálému postřikování našel cestu další komár. Byla příliš velká tma, než aby ho zahlédl, a tak se ho pokusil ignorovat. Už téměř týden pobýval v Arnhemské zemi s místními vůdci na odlehlém Severním teritoriu a dosavadní zkušenost byla velmi poklidná, až na neustálé cvakání notebooku vedle postele. \n\nNásledující den se konaly obvyklé obřady a osobní schůzky s vůdcem klanu Gumatji. Ten velmi dychtivě diskutoval o nabídce, kterou obdržel od společnosti Rio Tinto, týkající se nového nedalekého dolu na bauxit. V regionu již dříve vrtali, nový důl by však měl stát na posvátné půdě, takže [GetASTLeaderTitle] musel projekt schválit. \n\nVůdce klanu měl obdržet 75 % licenčních poplatků a Rio Tinto tvrdilo, že provoz poskytne Gumatjiům \"úspěšné kariéry v těžebním průmyslu\". To však bylo pochybné, protože za všechny roky těžby společnosti Rio na půdě Yolnguů provoz vychoval pouze jednoho kvalifikovaného aboriginského učně." # todo: NEW TRANSLATION
 abbott_gov_event.4.a: "Schvalte důl." # todo: NEW TRANSLATION
 abbott_gov_event.4.b: "Je to posvátná půda." # todo: NEW TRANSLATION
 abbott_gov_event.5.t: "Přeřeknutí v učebních osnovách" # todo: NEW TRANSLATION
 abbott_gov_event.5.d: "Tony Abbott stál za řečnickým pultem před stejným přeplněným sálem, v němž ještě nedávno vedl svou kampaň. Za ním visel transparent Liberální strany a australská vlajka, na jejichž přítomnosti trval. Začal obvyklými zdvořilostmi, než se pustil do nedostatků současného vzdělávacího systému. Tony byl možná nejspokojenější, když se do něčeho opíral. Právě to z něj udělalo tak dobrého vůdce opozice a nyní se snažil prodat svou reformu učebních osnov. \n\nJeho rétorika nepochybně získávala posluchače, když se však během projevu stalo něco velmi nešťastného. \n\n\"Nikdo, jakkoli chytrý, jakkoli vzdělaný, jakkoli zkušený... není depozitářem veškeré moudrosti.\" \n\nOzvalo se několik smíchů, když si Abbott pomalu uvědomil, že si spletl slovo „úložiště“ s názvem zdravotnické pomůcky pro konečník. V projevu pokračoval bez dalších zádrhelů, ale následujícího dne byla tato drobná chyba na všech titulních stranách." # todo: NEW TRANSLATION
 abbott_gov_event.5.a: "Znějí podobně..." # todo: NEW TRANSLATION
 abbott_gov_event.6.t: "Výsledky komise" # todo: NEW TRANSLATION
 abbott_gov_event.6.d: "Audit přinesl rozsáhlý přezkum našich výdajů a poskytl poměrně radikální plán na snížení výdajů. Zahrnuje škrty v důchodech, veřejném zdravotnictví, školství i podpoře v nezaměstnanosti. Pokud návrh přijmeme v plném rozsahu, veřejné pobouření může být příliš velké a nemuseli bychom se z něj vzpamatovat, rozpočtu by však jistě poskytl obrovskou vzpruhu. Jinak jej můžeme zmírnit a předložit voličům přijatelnější podobu." # todo: NEW TRANSLATION
 abbott_gov_event.6.a: "Zmírněte ho." # todo: NEW TRANSLATION
 abbott_gov_event.6.b: "Proveďte ho v plném rozsahu." # todo: NEW TRANSLATION
 malcolm_abbott_event.1.t: "Malcolmova návštěva" # todo: NEW TRANSLATION
 malcolm_abbott_event.1.d: "Náš ministr komunikací Malcolm Turnbull nás v soukromí oslovil ohledně směru naší politiky a varoval, že jakékoli další škrty budou mít vážné důsledky. Není jasné, zda má na mysli především reakci strany, nebo veřejné mínění, Malcolm však již dříve projevoval sklon k teatrálnosti. Možná jde jen o další z přehnaných reakcí, ostatně proti našim fiskálním omezením se již dříve hlasitě stavěl." # todo: NEW TRANSLATION
 malcolm_abbott_event.1.a: "Veřejně oznamte konec škrtů." # todo: NEW TRANSLATION
 malcolm_abbott_event.1.b: "Přehání." # todo: NEW TRANSLATION
 malcolm_abbott_event.2.t: "Abbottův \"krutý rozpočet\" vyvolává celostátní protesty" # todo: NEW TRANSLATION
 malcolm_abbott_event.2.d: "Tisíce lidí se zúčastnily shromáždění po celé Austrálii na protest proti nejnovější vlně vládních rozpočtových škrtů. Téměř ve všech velkých městech se konaly rozsáhlé protesty \"Zbořme rozpočet\", jichž se významně účastnila Australská rada odborových svazů. Pokladník Joe Hockey se pokusil škrty obhájit s tím, že země \"sklouzla k třídnímu boji ve stylu 70. let\" a že jeho rozpočet je založen na rovných příležitostech, nikoli na rovnosti výsledků. \n\nDemonstranti přesto uvedli, že hodlají v pochodu pokračovat po zbytek měsíce. Poslední protest se konal před trávníky parlamentu a jeho součástí byla nadživotní loutka [GetASTLeaderTitle]." # todo: NEW TRANSLATION
 malcolm_abbott_event.2.a: "Takhle přece nevypadám!" # todo: NEW TRANSLATION
 malcolm_abbott_event.3.t: "Boj o vedení" # todo: NEW TRANSLATION
 malcolm_abbott_event.3.d: "Po nedávné veřejné kritice jeden z členů na posledním stranickém zasedání hlasoval pro \"rozkol\" ve vedení, čímž vyvolal nové hlasování o tom, zda má Tony zůstat vůdcem. Protože nikdo neměl odvahu jej vyzvat, jediným kandidátem vedle Tonyho bylo prázdné křeslo v místnosti. \n\nKdyž byly odevzdány hlasy, [GetASTLeaderTitle] zvítězil s 61 hlasy, přestože nezanedbatelných 39 hlasů získalo prázdné křeslo. Je zřejmé, že pokles podpory strany je důvodem k obavám, a pokud se nám nepodaří situaci zvrátit, mohlo by další hlasování dopadnout mnohem hůře." # todo: NEW TRANSLATION
 malcolm_abbott_event.3.a: "Stále máme čas." # todo: NEW TRANSLATION
 abbott_jakarta_event.1.t: "Boj za správnou věc" # todo: NEW TRANSLATION
 abbott_jakarta_event.1.d: "V Abbottových očích bylo správné začít návštěvou Jakarty. Mnoha Australanům unikalo, že Indonésie je převážně muslimský národ s více než 230 miliony obyvatel, jen kousek od jejich vlasti. Od bombových útoků na Bali přicházely téměř každý měsíc zprávy o dalším útoku. Nikdy si nebyl jistý, zda ten příští nebude blíže domovu, a tato myšlenka mu proto stále ležela v hlavě. \n\nKdyž Tony hovořil s prezidentem [IND.GetLeader], otevřel toto téma. Jeho cílem bylo samozřejmě prodat myšlenku australských mírových operací v zemi, o což se již nějakou dobu snažil, k velké nelibosti indonéské vlády. \n\nPo desetiletí byla hlavní strategií měkká síla, vzdělávací programy a další balíčky pomoci, které měly udržovat početná etnická napětí na snesitelné úrovni. To však sotva představovalo řešení hrozby fundamentalismu. Tony nakonec získal přinejlepším příslib jejich vlády pokračovat v současné spolupráci a ujištění, že dveře k budoucím iniciativám zůstanou otevřené." # todo: NEW TRANSLATION
 abbott_jakarta_event.1.a: "Stručně řečeno, zklamání." # todo: NEW TRANSLATION
 o_canada_abbott.1.t: "Austrálie nabízí těžební spolupráci" # todo: NEW TRANSLATION
 o_canada_abbott.1.d: "Vláda v Canbeře nás oslovila s nabídkou výměny technických odborníků v těžebním průmyslu ve snaze přiblížit naše národy a využít bohaté přírodní zdroje, které oba státy zdědily. Dohoda je poměrně přímočará a na první pohled by byla prospěšná pro obě strany, i když současná australská vláda k té naší nemá příliš blízko." # todo: NEW TRANSLATION
 o_canada_abbott.1.a: "Vítáme naše bratry z Commonwealthu." # todo: NEW TRANSLATION
 o_canada_abbott.1.b: "Ne, děkujeme." # todo: NEW TRANSLATION
 o_canada_abbott.2.t: "Několik přešlapů v Ottawě" # todo: NEW TRANSLATION
 o_canada_abbott.2.d: "Tony promlouval k davu novinářů v leteckém křídle Kanadského válečného muzea v Ottawě, přestože mnozí z nich byli Australané. Zdálo se, že ani nemůže opustit zemi bez houfu novinářů v patách. [CAN.GetLeader] stál při jeho projevu vedle něj. Tony se snažil nesklouznout ke stereotypům, ale nemohl si odpustit poznámku, že jde skutečně o přátelský národ. Na jeho vkus však poněkud příliš levicový. \n\nTonyho myšlenky se vrátily k závěru projevu. Otočil se, potřásl jejich vůdci rukou a odešel. Přestože se během projevu několikrát zakoktal a v jednu chvíli zemi nazval \"Canadií\", vše se obešlo bez větších problémů. Kanadská vláda souhlasila s těžební investicí a my jsme na oplátku vyslali vlastní odborníky, aby pomohli s vrty." # todo: NEW TRANSLATION
 o_canada_abbott.2.a: "To je ta commonwealthská sounáležitost." # todo: NEW TRANSLATION
 abbott_china_trade.1.t: "Další obchodní spolupráce z Austrálie" # todo: NEW TRANSLATION
 abbott_china_trade.1.d: "Australský vůdce, [AST.GetLeader], velmi usiluje o rozšíření současného rozsahu našeho obchodu s jejich národem prostřednictvím dohody o volném obchodu. Dohoda by zahrnovala bezcelní dovoz až 95 % našeho zboží a plynulejší výměnu surovin spolu s ustanoveními, která by našim soukromým společnostem umožnila snadněji investovat v Austrálii. Na první pohled se to jeví jako oboustranně výhodné ve všech směrech." # todo: NEW TRANSLATION
 abbott_china_trade.1.a: "Hodnotné úsilí" # todo: NEW TRANSLATION
 abbott_china_trade.1.b: "Není to v našem nejlepším zájmu." # todo: NEW TRANSLATION
 abbott_china_trade.2.t: "Dohoda o volném obchodu z [GetYear] podepsána" # todo: NEW TRANSLATION
 abbott_china_trade.2.d: "Čína souhlasila s naší dvoustrannou dohodou o volném obchodu, což výrazně posílí tok nerostných surovin a průmyslového zboží mezi našimi zeměmi. Téměř deset let vyjednávání o rozsáhlejší dohodě je konečně u konce. Vzhledem k postavení Číny jako našeho největšího zdroje exportních příjmů by se účinky měly okamžitě projevit v celé ekonomice. S právě podepsaným dokumentem a podáním ruky je Pacifik náhle bližším a jednotnějším místem." # todo: NEW TRANSLATION
 abbott_china_trade.2.a: "To je kouzlo sladěných zájmů." # todo: NEW TRANSLATION
 abbott_china_trade.3.t: "Čína odmítá další obchodní spolupráci" # todo: NEW TRANSLATION
 abbott_china_trade.3.d: "Čína bohužel odmítla naše nabídky další spolupráce a prozatím před námi diplomaticky uzavřela dveře. Zdá se, že se v budoucnu budeme muset spolehnout na jiné možnosti." # todo: NEW TRANSLATION
 abbott_china_trade.3.a: "Není to nejhorší výsledek, ale rozhodně není dobrý." # todo: NEW TRANSLATION
 abbott_navy_exercises_event.1.t: "Výsledky cvičení" # todo: NEW TRANSLATION
 abbott_navy_exercises_event.1.d: "Cvičení s našimi americkými přáteli skončila a přinesla užitečné výsledky. Kromě toho, že si naše síly procvičily některé tolik potřebné dovednosti, cvičení poukázala na nedostatky v technologii našich jednotek. Po sdílení údajů s našimi výzkumnými a vývojovými odděleními se zdá, že některé z těchto poznatků budeme moci využít v našem výzkumu." # todo: NEW TRANSLATION
 abbott_navy_exercises_event.1.a: "Tohle je rozhodně užitečné." # todo: NEW TRANSLATION
 knights_and_dames_ast_event.1.t: "Smíšené reakce na povýšení prince Philipa do rytířského stavu" # todo: NEW TRANSLATION
 knights_and_dames_ast_event.1.d: "Starší kolegové [GetASTLeaderTitle] veřejně vyjádřili směs zmatení, hněvu a zděšení nad jeho rozhodnutím obnovit tuto tradici udělením australského rytířského titulu princi Philipovi, který není Australan. \n\nMinistři kabinetu řekli stanici ABC, že [GetASTLeaderTitle] před oznámením udělení titulu nekonzultoval nikoho z vedení. Tento krok zřejmě rozdělil parlament mezi stoupence republiky. \n\n„Jsem opravdu rád, že jsme v této zemi schopni řádně ocenit, co vykonal pro nás, když je mu přes devadesát a blíží se konec života zasvěceného službě a povinnosti,“ uvedl Tony Abbott ve svém prohlášení k tomuto rozhodnutí. Ačkoli reakce ze Spojeného království byla poněkud zdrženlivě vděčná, domácí reakce se vyvíjejí všelijak, jen ne mírně." # todo: NEW TRANSLATION
 knights_and_dames_ast_event.1.a: "Nelze se zavděčit všem." # todo: NEW TRANSLATION
 abbott_japan_trade_deal.1.t: "Nová jednání o obchodu z Canberry" # todo: NEW TRANSLATION
 abbott_japan_trade_deal.1.d: "[GetASTLeaderTitle] Austrálie, [AST.GetLeader], nás přímo kontaktoval kvůli projednání nového vyjednání obchodních závazků, které s jejich národem v současnosti máme, aby se dále „napravily“ některé nedostatky. Není jasné, zda naráží na nedostatky na naší, nebo jejich straně, ale určité úpravy dohody by mohly zajistit plynulejší přepravu zboží mezi námi. Zejména zemědělského dovozu." # todo: NEW TRANSLATION
 abbott_japan_trade_deal.1.a: "Zdá se to spravedlivé." # todo: NEW TRANSLATION
 abbott_japan_trade_deal.1.b: "Ne, děkujeme." # todo: NEW TRANSLATION
 abbott_japan_trade_deal.2.t: "Jednání s Japonskem přinesla historickou dohodu" # todo: NEW TRANSLATION
 abbott_japan_trade_deal.2.d: "Nová jednání přinesla hospodářský úspěch a nabídla nám mnohem spravedlivější dohodu. Cla, která Japonsko uvaluje na naše hovězí maso, budou prakticky odstraněna spolu s celou řadou dalších zemědělských produktů. Jediným produktem, u něhož nebyli ochotni ustoupit, byla rýže. \n\nTaké se připojují ke smlouvě o přednostních dodávkách surovin. My na oplátku, jak jsme slíbili, snížíme řadu cel na jejich elektroniku a vozidla. Přínos pro náš zemědělský sektor nelze podceňovat. Ve srovnání s původní dohodou jde o významné vítězství." # todo: NEW TRANSLATION
 abbott_japan_trade_deal.2.a: "Tak tohle je férová nabídka." # todo: NEW TRANSLATION
 abbott_saf_event.1.t: "Strasti Kapského Města" # todo: NEW TRANSLATION
 abbott_saf_event.1.d.a: "Je pozoruhodné, že stát Jihoafrická republika má tři různá hlavní města. Abbottovi se to jen obtížně chápalo. Aby se věci zbytečně nezdržovaly, bylo kvůli jednoduchosti vybráno Johannesburg a po příjezdu byla první zastávkou nově postavená stadion FNB. Zjevně se chtěli pochlubit svým pokrokem v modernizaci, ačkoli Tony nemohl pochybovat o tom, že se nachází v rozvojové zemi. \n\nSlonem v místnosti, kterému se nakonec musel věnovat, byl problém uprchlíků. Tisíce převážně bělošských zemědělců, kteří prchali před pokračujícími etnickými střety, protestovaly proti nečinnosti jihoafrické vlády. Úředníci však trvali na tom, že dělají vše, co mohou, a že je tento problém zveličován. \n\nAbbott věděl jen to, že počet uprchlíků roste a že požadují odsouzení." # todo: NEW TRANSLATION
 abbott_saf_event.1.d.b: "Je pozoruhodné, že stát Jihoafrická republika má tři různá hlavní města. Abbottovi se to jen obtížně chápalo. Aby se věci zbytečně nezdržovaly, bylo kvůli jednoduchosti vybráno Johannesburg a po příjezdu byla první zastávkou památník Nelsona Mandely. Abbott k tomuto muži choval hluboký respekt a dokonce požádal, aby byly toho dne v Austrálii vlajky spuštěny na půl žerdi. \n\nSlonem v místnosti, kterému se nakonec musel věnovat, byl problém uprchlíků. Tisíce převážně bělošských zemědělců, kteří prchali před pokračujícími etnickými střety, protestovaly proti nečinnosti jihoafrické vlády. Úředníci však trvali na tom, že dělají vše, co mohou, a že je tento problém zveličován. \n\nAbbott věděl jen to, že počet uprchlíků roste a že požadují odsouzení." # todo: NEW TRANSLATION
 abbott_saf_event.1.b: "Odsoudit vládu a urychlit vydávání víz uprchlíkům." # todo: NEW TRANSLATION
 abbott_saf_event.1.a: "Mají naši podporu." # todo: NEW TRANSLATION
 indonesian_intervention_abbott.2.t: "Jakarta odmítá naši žádost" # todo: NEW TRANSLATION
 indonesian_intervention_abbott.2.d: "Jak se očekávalo, indonéská vláda odmítla naši žádost o povolení mírových operací v zemi a uzavřela našim diplomatům možnost o této akci dále jednat. Tato odpověď nám ponechala jen několik možností, jak požadavek prosadit, kromě přímé akce. Mezitím se zdá, že veškerá spolupráce zamrzla." # todo: NEW TRANSLATION
 indonesian_intervention_abbott.2.a: "Nutí nás jednat." # todo: NEW TRANSLATION
 indonesian_intervention_abbott.3.t: "Jakarta schvaluje naše mírové úsilí" # todo: NEW TRANSLATION
 indonesian_intervention_abbott.3.d: "Zdá se, že zamrzlo peklo, nebo snad Jakarta. Indonéská vláda schválila naši žádost o provádění mírových operací v zemi. To výrazně pomůže našemu boji proti terorismu a díky možnosti přímo zasahovat proti hrozbám se šance na další útok v budoucnu drasticky snížila." # todo: NEW TRANSLATION
 indonesian_intervention_abbott.3.a: "To jsou skvělé zprávy!" # todo: NEW TRANSLATION
 oceanic_alliance_ast.1.t: "Jednání o oceánské alianci" # todo: NEW TRANSLATION
 oceanic_alliance_ast.1.d: "Vláda v Canbeře vyslala delegaci, aby projednala vytvoření oficiální aliance založené na oceánském regionu s výslovným záměrem, abychom se k ní připojili. Připojení by v podstatě znamenalo spojení našich armád za účelem udržování obranných opatření v Pacifiku a Australané trvají na tom, že pokud by byla dohoda uskutečněna, odvrátila by v dohledné budoucnosti potenciál konfliktu v regionu. Zároveň bychom se však jisté míry autonomie vzdali a možná bychom se nechtěně připoutali k neustále se měnící australské zahraniční politice." # todo: NEW TRANSLATION
 oceanic_alliance_ast.1.a: "Hodnotné úsilí." # todo: NEW TRANSLATION
 oceanic_alliance_ast.1.b: "Naše nezávislost je důležitější." # todo: NEW TRANSLATION
 oceanic_alliance_ast.2.t: "Nový Zéland odmítá alianci" # todo: NEW TRANSLATION
 oceanic_alliance_ast.2.d: "Zdá se, že vláda Nového Zélandu v tuto chvíli nepovažuje za vhodné alianci formalizovat, protože své současné obranné schopnosti považuje za dostačující. Jistě jde o zklamání, ale stále mohou existovat jiné možnosti, které lze prozkoumat." # todo: NEW TRANSLATION
 oceanic_alliance_ast.2.a: "Jak chtějí." # todo: NEW TRANSLATION
 oceanic_alliance_ast.3.t: "Indonésie odmítá alianci" # todo: NEW TRANSLATION
 oceanic_alliance_ast.3.d: "Zdá se, že indonéská vláda v tuto chvíli nepovažuje za vhodné alianci formalizovat, protože své současné obranné schopnosti považuje za dostačující. Jistě jde o zklamání, ale stále mohou existovat jiné možnosti, které lze prozkoumat." # todo: NEW TRANSLATION
 oceanic_alliance_ast.4.t: "Papua-Nová Guinea odmítá alianci" # todo: NEW TRANSLATION
 oceanic_alliance_ast.4.d: "Zdá se, že vláda v Port Moresby v tuto chvíli nepovažuje za vhodné alianci formalizovat, protože své současné obranné schopnosti považuje za dostačující. Jistě jde o zklamání, ale stále mohou existovat jiné možnosti, které lze prozkoumat." # todo: NEW TRANSLATION
 oceanic_alliance_ast.5.t: "Vanuatu odmítá alianci" # todo: NEW TRANSLATION
 oceanic_alliance_ast.5.d: "Zdá se, že Republika Vanuatu v tuto chvíli nepovažuje za vhodné alianci formalizovat, protože své současné obranné schopnosti považuje za dostačující. Jistě jde o zklamání, ale stále mohou existovat jiné možnosti, které lze prozkoumat." # todo: NEW TRANSLATION
 operation_sovereign_abbott.1.t: "Operace Suverénní hranice" # todo: NEW TRANSLATION
 operation_sovereign_abbott.1.d: "Scott Morrison se naklonil k Abbottovi a popadl ho za ruku, potřásaje s ní, zatímco cvakaly fotoaparáty. Scott byl o několik palců vyšší než on a jeho ruka zůstala ve Scottově sevření o několik sekund déle, než mu bylo příjemné. Morrison v soukromí prezentoval návrh zákona jako nepopulární, ale nezbytný krok v boji proti rostoucímu tlaku nelegální migrace, a nabídl se, že v případě případné kritiky bude jeho tváří. Abbott měl dost zkušeností, aby věděl, že v tom jde o víc. \n\nMorrison si získal známost díky práci v zákulisí, kde působil jako stranický whip, byť bez oficiálního titulu, a udržoval všechny v řadě. Nutno uznat, že byl efektivní a velmi rychle nabízel řešení problémů, které měl díky své předvídavosti na očích pouze on. Své si zatím odpracoval. Pokud chtěl získat trochu uznání, bylo to jen spravedlivé — koneckonců to byla jeho politika. Abbott tedy souhlasil a zahájení se proměnilo v jednu velkou reklamní akci jejich vlády." # todo: NEW TRANSLATION
 operation_sovereign_abbott.1.a: "Usmějte se!" # todo: NEW TRANSLATION
 japan_subs_abbott.1.t: "Rozhodování o nákupu" # todo: NEW TRANSLATION
 japan_subs_abbott.1.d: "Původním plánem bylo zakoupit 6 ponorek třídy Harushio, které by nahradily naši stárnoucí flotilu třídy Collins. S ohledem na potřebu palebné síly nad hladinou bychom však místo toho mohli požádat o nákup 3 lehkých torpédoborců s vrtulníky. \n\nPonorky by pěkně navýšily počet našich plavidel a jejich modely byly aktualizovány nejnovějšími technologiemi. Na druhou stranu by nám torpédoborce třídy Murasame mohly poskytnout výhodu ve vzduchu i z hlediska čisté palebné síly." # todo: NEW TRANSLATION
 japan_subs_abbott.1.a: "Držme se ponorek." # todo: NEW TRANSLATION
 japan_subs_abbott.1.b: "Volme torpédoborce." # todo: NEW TRANSLATION
 japan_subs_abbott.2.t: "Žádost Austrálie o nákup plavidel" # todo: NEW TRANSLATION
 japan_subs_abbott.2.d: "Australané se na nás obrátili se zajímavým návrhem. Nabídli, že za značnou částku odkoupí šest našich stárnoucích ponorek třídy Harushio, aby posílili svou flotilu. To by posílilo naše obranné vztahy a poskytlo dodatečné prostředky na náhradu ponorek." # todo: NEW TRANSLATION
 japan_subs_abbott.2.a: "Schvalme dohodu." # todo: NEW TRANSLATION
 japan_subs_abbott.2.b: "Není to v našem nejlepším zájmu." # todo: NEW TRANSLATION
 japan_subs_abbott.3.d: "Australané se na nás obrátili se zajímavým návrhem. Nabídli, že za značnou částku odkoupí tři naše stárnoucí lehké torpédoborce třídy Murasame, aby posílili svou flotilu. To by posílilo naše obranné vztahy a poskytlo dodatečné prostředky na náhradu plavidel." # todo: NEW TRANSLATION
 japan_subs_abbott.4.t: "Japonsko odmítá prodej" # todo: NEW TRANSLATION
 japan_subs_abbott.4.d: "Japonská vláda nečekaně odmítla naši dohodu a dala přednost zachování velikosti své flotily. Tímto tempem nám začnou říkat NEŠŤASTNÁ země." # todo: NEW TRANSLATION
 japan_subs_abbott.4.a: "To snad ne..." # todo: NEW TRANSLATION
 japan_subs_abbott.5.t: "Japonsko schvaluje prodej" # todo: NEW TRANSLATION
 japan_subs_abbott.5.d: "Japonsko schválilo žádost o prodej a plavidla budou brzy převedena do naší flotily. Poskytnou nám tolik potřebnou dodatečnou palebnou sílu na moři." # todo: NEW TRANSLATION
 japan_subs_abbott.5.a: "Vynikající zprávy." # todo: NEW TRANSLATION
 abbott_condemns_china.1.t: "Tony Abbott odsuzuje rozpínání Číny" # todo: NEW TRANSLATION
 abbott_condemns_china.1.d: "Nedávný postoj australského [GetASTLeaderTitle]a k Číně znepokojil veterány Liberální strany a získal podporu voličů, když zaujal nový postoj proti budování umělých ostrovů v této zemi. \n\nNa včerejší tiskové konferenci vůdce odsoudil nedávné kroky Číny jako \"největší vojenské rozšíření v dějinách míru\". Požadoval naléhavé posílení vlastních australských sil, aby byla zachována odstrašující schopnost. Zdůraznil rozmístění většího počtu lodí a letadel ve východní Asii s cílem vytlačit zemi z kritických dodavatelských řetězců. \n\nOd tohoto oznámení čínští představitelé tento postoj odsoudili a označili Tonyho Abbotta za původce \"protičínské hysterie\". Bez ohledu na záměr se zdá, že napětí mezi oběma zeměmi dosahuje vrcholu." # todo: NEW TRANSLATION
 abbott_condemns_china.1.a: "Jsou to snad bouřkové mraky?" # todo: NEW TRANSLATION
 kuala_lumpur_abbott.1.t: "Obchodní pakt za neutralitu" # todo: NEW TRANSLATION
 kuala_lumpur_abbott.1.d: "Obchod s nerostnými surovinami mezi námi a Austrálií vzrostl natolik, že nás australská vláda kontaktovala s návrhem na uzavření dohody o volném obchodu. Dohoda zahrnuje snížení cel na uhlí, hliník a další nerostné suroviny, stejně jako některých cel na dovoz zemědělských produktů. Austrálie na oplátku sníží cla na náš vývoz surové ropy, elektroniky a dopravního vybavení. \n\nSoučástí dohody je však také podmínka, že vyhlásíme neutralitu v jejich současných sporech s Čínou, což v praxi znamená pouze podpis paktu o neútočení." # todo: NEW TRANSLATION
 kuala_lumpur_abbott.1.a: "Spravedlivá dohoda." # todo: NEW TRANSLATION
 kuala_lumpur_abbott.1.b: "To je příliš velký požadavek." # todo: NEW TRANSLATION
 kuala_lumpur_abbott.2.t: "Malajsie podepisuje pakt" # todo: NEW TRANSLATION
 kuala_lumpur_abbott.2.d: "Naši přátelé v Malajsii podepsali obchodní dohodu a formálně se zavázali zůstat v našich záležitostech diplomaticky neutrální. To umožní hladký tok nerostných surovin a zemědělských produktů mezi námi. Další část Ostrovního řetězce byla odstraněna ze hry." # todo: NEW TRANSLATION
 kuala_lumpur_abbott.2.a: "Velmi dobře." # todo: NEW TRANSLATION
 kuala_lumpur_abbott.3.t: "Malajsie odmítla dohodu o neutralitě" # todo: NEW TRANSLATION
 kuala_lumpur_abbott.3.d: "Navzdory našim nejlepším úmyslům Malajsie odmítla učinit jakékoli sliby a odmítla naši obchodní dohodu. Část Ostrovního řetězce bohužel zůstává ve hře." # todo: NEW TRANSLATION
 kuala_lumpur_abbott.3.a: "Kdo by řekl, že diplomacie může být tak obtížná." # todo: NEW TRANSLATION
 jap_repar_abbott.1.t: "Austrálie požaduje reparace za druhou světovou válku" # todo: NEW TRANSLATION
 jap_repar_abbott.1.d: "Australská vláda nás poněkud podivně kontaktovala kvůli uspořádání velmi opožděných plateb za jejich výdaje během druhé světové války. Žádost většinu představitelů zaskočila, protože naše vztahy s touto zemí byly v desetiletích od války převážně pozitivní. Přesto se jejich vláda zdá být vážná a zaslala nám poměrně vysoký účet." # todo: NEW TRANSLATION
 jap_repar_abbott.1.a: "Prostě to zaplaťme." # todo: NEW TRANSLATION
 jap_repar_abbott.1.b: "To musí být nějaký vtip?" # todo: NEW TRANSLATION
 jap_repar_abbott.2.t: "Japonsko souhlasí s vyplacením reparací" # todo: NEW TRANSLATION
 jap_repar_abbott.2.d: "Zdá se, že jejich vláda chápe naše potíže a souhlasila s jednorázovou platbou přímo nám, která pokryje náklady války. Nehodlají dělat věci napůl. V přístavu Darwin se uskuteční oficiální ceremoniál za účasti japonské delegace a bude vytvořeno oddělení, které usnadní převod reparací. Navzdory neobvyklosti celé události ji média přijímají dobře a opoziční strany zůstávají převážně zticha." # todo: NEW TRANSLATION
 jap_repar_abbott.2.a: "Nyní se mohou staré rány zahojit." # todo: NEW TRANSLATION
 jap_repar_abbott.3.t: "Japonsko odmítá reparace" # todo: NEW TRANSLATION
 jap_repar_abbott.3.d: "V poněkud trapném obratu japonská vláda žádost odmítla a následně nás začala hanět ve své celostátní televizi. Ta naše v tom samozřejmě jede s nimi, protože všechny hlavní stanice si z celé záležitosti dělají legraci, což doplňuje výprask, který dostáváme v Poslanecké sněmovně a Senátu. Před Parlamentem se dokonce objevilo několik demonstrací s transparenty zobrazujícími Abbotta jako žebráka sedícího před japonským velvyslanectvím." # todo: NEW TRANSLATION
 jap_repar_abbott.3.a: "Není třeba nám to ještě připomínat." # todo: NEW TRANSLATION
 jap_alliance_abbott.1.t: "Vzájemná aliance z protinožců" # todo: NEW TRANSLATION
 jap_alliance_abbott.1.d: "Austrálie nabídla pakt o vzájemné bezpečnosti, jehož podmínky by v případě vypuknutí konfliktu mezi kteroukoli z nás a Čínou vyvolaly výzvu k válce. Pakt má zjevně odradit Čínu od dalších střetů ve snaze zabezpečit Pacifik." # todo: NEW TRANSLATION
 jap_alliance_abbott.1.a: "V tomto jsme zajedno." # todo: NEW TRANSLATION
 jap_alliance_abbott.1.b: "To zachází příliš daleko." # todo: NEW TRANSLATION
 jap_alliance_abbott.2.t: "Jokohamská dohoda" # todo: NEW TRANSLATION
 jap_alliance_abbott.2.d: "Vláda v Tokiu pakt podepsala a vytvořila mezi námi bezpečnostní alianci. Pokud by mezi námi a Čínou vypukl konflikt, Japonsko bude vyzváno, aby se připojilo k boji. Na naši stranu šachovnice přibyl další dílek." # todo: NEW TRANSLATION
 jap_alliance_abbott.2.a: "Čestná aliance" # todo: NEW TRANSLATION
 jap_alliance_abbott.3.t: "Japonsko odmítá pakt" # todo: NEW TRANSLATION
 jap_alliance_abbott.3.d: "Po neobvyklém mlčení japonských delegátů obdržel [GetASTLeaderTitle] videohovor od svého japonského protějšku. Hovor byl dlouhý a rozvláčný, z kanceláře PMS bylo zvenčí slyšet pouze tlumené křičení, ale poté, co jednání nakonec přešlo v jakýsi taneční souboj, byla jednání ukončena." # todo: NEW TRANSLATION
 jap_alliance_abbott.3.a: "Snad nejhorší možný výsledek." # todo: NEW TRANSLATION
 france_abbott_ast.1.t: "Pronájem ostrovů" # todo: NEW TRANSLATION
 france_abbott_ast.1.d: "Australská vláda nás oslovila s nabídkou pronájmu půdy na ostrovech Nová Kaledonie pro vojenské účely na dobu 5 let. Ujistili nás, že pronájem zajistí pokračující stabilitu v Pacifiku v rámci jejich nedávného mírového úsilí, a nabídli 39 miliard za půdu a práva na zřízení základen." # todo: NEW TRANSLATION
 france_abbott_ast.1.a: "Spravedlivá dohoda." # todo: NEW TRANSLATION
 france_abbott_ast.1.b: "Ostrovy patří pouze nám." # todo: NEW TRANSLATION
 france_abbott_ast.2.t: "Pronájem Nové Kaledonie" # todo: NEW TRANSLATION
 france_abbott_ast.2.d: "Francie pronájem ochotně schválila a poskytla nám de facto právo rozšířit na okolních ostrovech naši vojenskou přítomnost a infrastrukturu na dalších 5 let." # todo: NEW TRANSLATION
 france_abbott_ast.2.a: "Náš dosah roste." # todo: NEW TRANSLATION
 france_abbott_ast.3.t: "Pronájem ostrovů padá" # todo: NEW TRANSLATION
 france_abbott_ast.3.d: "Francie naši nabídku na pronájem ostrovů v tuto chvíli odmítla a strategicky nás tak nechala na holičkách. Budeme muset najít jiný způsob, jak zabezpečit naše východní křídlo." # todo: NEW TRANSLATION
 france_abbott_ast.3.a: "Byla to skvělá dohoda!" # todo: NEW TRANSLATION
 france_abbott_ast.4.t: "Konec pronájmu ostrovů se blíží" # todo: NEW TRANSLATION
 france_abbott_ast.4.d: "Období, na které má Austrálie pronajaté ostrovy Nové Kaledonie pro vojenské účely, se blíží ke konci. Můžeme jim nabídnout prodloužení o dalších 5 let, nebo požádat o vrácení ostrovů." # todo: NEW TRANSLATION
 france_abbott_ast.4.a: "Nechme je pronájem prodloužit." # todo: NEW TRANSLATION
 france_abbott_ast.4.b: "Je čas, aby se vrátily do našeho lůna." # todo: NEW TRANSLATION
 france_abbott_ast.5.t: "Francie nabízí prodloužení" # todo: NEW TRANSLATION
 france_abbott_ast.5.d: "S blížícím se koncem našeho pronájmu ostrovů Nové Kaledonie se na nás Francie obrátila s nabídkou prodloužení o dalších 5 let." # todo: NEW TRANSLATION
 france_abbott_ast.5.a: "Rozumná nabídka." # todo: NEW TRANSLATION
 france_abbott_ast.5.b: "Mohou je dostat zpět." # todo: NEW TRANSLATION
 france_abbott_ast.6.t: "Pronájem ostrovů končí" # todo: NEW TRANSLATION
 france_abbott_ast.6.d: "S blížícím se koncem našeho pronájmu ostrovů Nové Kaledonie nás Francie požádala, abychom ostrovy vrátili a stáhli z nich své jednotky." # todo: NEW TRANSLATION
 france_abbott_ast.6.a: "Rozumná žádost." # todo: NEW TRANSLATION
 france_abbott_ast.6.b: "Teď jsou NAŠE." # todo: NEW TRANSLATION
 france_abbott_ast.7.t: "Ostrovy Nové Kaledonie vráceny" # todo: NEW TRANSLATION
 france_abbott_ast.7.d: "Austrálie neprodleně vrátila pronajaté ostrovy a jako obvykle nám poděkovala za jejich využívání." # todo: NEW TRANSLATION
 france_abbott_ast.7.a: "Plodná transakce." # todo: NEW TRANSLATION
 france_abbott_ast.8.t: "Austrálie odmítá ostrovy opustit" # todo: NEW TRANSLATION
 france_abbott_ast.8.d: "Australská vláda odmítla ostrovy vrátit, což lze popsat jedině jako nemotornou aroganci. Dokonce odmítla zaplatit za prodloužení pronájmu a ostrovy tak fakticky nelegálně okupuje. Přestože diplomatický spor hraničící s vojenskou intervencí nepřipadá v úvahu, budeme muset okupaci protestovat na mezinárodní scéně." # todo: NEW TRANSLATION
 france_abbott_ast.8.a: "To je pobuřující!" # todo: NEW TRANSLATION
 middlepower_abbott.1.t: "Austrálie hledá alianci" # todo: NEW TRANSLATION
 middlepower_abbott.1.d: "Austrálie nám nabídla vzájemnou bezpečnost, přičemž podmínky by v případě vypuknutí konfliktu mezi kteroukoli z nás a Čínou vyvolaly výzvu k válce. Jádrem návrhu je pokus izolovat Čínu a omezit její sféru vlivu v Pacifiku.  \n\nDohoda však nezahrnuje Severní Koreu a vzhledem k naší blízkosti k Číně by na nás mohla namířit terč. Přesto nás Austrálie ujistila, že pakt byl vytvořen pouze jako odstrašující prostředek." # todo: NEW TRANSLATION
 middlepower_abbott.1.a: "Hodnotné úsilí." # todo: NEW TRANSLATION
 middlepower_abbott.1.b: "To nestačí." # todo: NEW TRANSLATION
 middlepower_abbott.2.t: "Komplikace aliance" # todo: NEW TRANSLATION
 middlepower_abbott.2.d: "Jižní Korea požaduje v souvislosti se smlouvou další obranné záruky vzhledem ke své blízkosti k Čínou podporované Severní Koreji. Můžeme ji získat pomocí některých programů výcviku vojsk a podpory výroby, což by však bylo jistě nákladné. Naše volba závisí na tom, jak vysoko si ceníme korejské podpory." # todo: NEW TRANSLATION
 middlepower_abbott.2.a: "Umírněná smlouva, která je přivede na naši stranu." # todo: NEW TRANSLATION
 middlepower_abbott.2.b: "Cokoli a všechno." # todo: NEW TRANSLATION
 middlepower_abbott.2.c: "Je to příliš nákladné." # todo: NEW TRANSLATION
 middlepower_abbott.3.t: "Austrálie přichází s protip nabídkou obranné pomoci" # todo: NEW TRANSLATION
 middlepower_abbott.3.d: "Ve snaze zachránit smlouvu přišli Australané s protip nabídkou programu společného výcviku vojsk a pomoci jejich odborníků s naší výrobou zbraní. Je to bezpochyby značná nabídka. Zjevně doufají, že ji přijmeme." # todo: NEW TRANSLATION
 middlepower_abbott.3.a: "Vítáme jejich podporu." # todo: NEW TRANSLATION
 middlepower_abbott.3.b: "Stále to za to nestojí." # todo: NEW TRANSLATION
 middlepower_abbott.4.t: "Austrálie přichází s protip nabídkou rozsáhlé pomoci" # todo: NEW TRANSLATION
 middlepower_abbott.4.d: "Ve snaze zachránit smlouvu přišli Australané s velmi rozsáhlou nabídkou. Zahrnuje rozsáhlý program společného výcviku vojsk a podporu výroby zbraní včetně smluv na montáž v továrnách, akvizičních půjček a technických odborníků, kteří pomohou s realizací. Zjevně do toho dávají všechno v naději, že nabídku přijmeme." # todo: NEW TRANSLATION
 middlepower_abbott.4.a: "Vítáme jejich podporu." # todo: NEW TRANSLATION
 middlepower_abbott.4.b: "Stále to za to nestojí." # todo: NEW TRANSLATION
 middlepower_abbott.5.t: "KAMAT vstupuje v platnost" # todo: NEW TRANSLATION
 middlepower_abbott.5.d: "Na velvyslanectví v Soulu podepsali naši diplomaté spolu s diplomaty Jižní Koreje Korejsko-australskou smlouvu o vzájemném ujištění, která zaručuje, že oba naše národy se navzájem podpoří v případě války ohrožující bezpečnost této země. Nyní jsme si bližší než kdy dříve a další země se připojila k naší podpoře v boji o Pacifik." # todo: NEW TRANSLATION
 middlepower_abbott.5.a: "Vítejte na palubě." # todo: NEW TRANSLATION
 middlepower_abbott.6.t: "Jednání se dostala do slepé uličky" # todo: NEW TRANSLATION
 middlepower_abbott.6.d: "Zdá se, že jednání mezi námi a Korejci ztroskotala. Přestože začala za dobrých podmínek, kvůli vlastním bezpečnostním obavám od nich ustoupili. Naše práce na spoutání draka bude muset pokračovat bez nich." # todo: NEW TRANSLATION
 middlepower_abbott.6.a: "Korejský tygr spí." # todo: NEW TRANSLATION
 abbott_china_occupation.1.t: "Strategie popírání" # todo: NEW TRANSLATION
 abbott_china_occupation.1.d: "Tony Abbott a zbytek válečného kabinetu v potemnělé místnosti sledovali zářící obrazovku, na níž se střídaly letecké záběry, satelitní snímky a záznamy sledování transportů vojsk. Byla noc a záznam byl trhaný, ale znak Armády lidového osvobození byl jasný jako den. Nepřítel se vylodil. \n\nAbbottovi pokleslo srdce. Opřel se v křesle a přejel si dlaněmi po čele. Zbytek místnosti mlčel, dokud analytik nezastavil záznam a nezačal s brífinkem. Jejich první prioritou bylo ovládnout narativ, ale video se nepochybně již sdílelo online a vše vypadalo na nejhorší selhání národní obrany v dějinách země. Od této chvíle bude boj jen obtížnější. \n\nNastalo nepříjemné ticho, když analytik skončil a čekal na vstup premiéra. Abbottova tvář zkřivená přemýšlením vyjadřovala směs přísnosti a prázdnoty. Nakonec se obrátil ke zbytku místnosti. \"Podívejte, v tuhle chvíli je celkem zřejmé, že ehm... no, hovno se stává.\"" # todo: NEW TRANSLATION
 abbott_china_occupation.1.a: "V tomto případě ano." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.1.t: "Bod vzplanutí na moři" # todo: NEW TRANSLATION
 abbott_shirtfronting_china.1.d: "Z naší flotily v Jihočínském moři přicházejí kusé zprávy. Přestože je většina hlášení neúplná a situace stále není jasná, zdá se, že u mělčiny došlo ke konfrontaci. \n\nPoté, co byly naše lodě vyslány hlídkovat u mělčiny Scarborough, narazily na nedalekou čínskou flotilu. Ta požadovala, aby naše lodě oblast opustily, a krátce poté, co to naše lodě odmítly, jedna z čínských lodí zahájila palbu. Následovala krátká přestřelka, než se naše plavidla stáhla. Přišli jsme o dvě fregaty a zatím evidujeme čtyři oběti. \n\nProtože se o tom dozvídáme právě v průběhu událostí, Čína zatím nereagovala. Je na nás, jak budeme postupovat. Právě teď balancujeme na ostří nože." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.1.a: "Spojte nás s Pekingem." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.1.b: "Je to nehorázný útok. Nesmíme ukázat slabost." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.2.d: "Australský [GetASTLeaderTitle] se s námi spojil, aby projednal událost v Jihočínském moři. Zatímco naše hlášení stále přicházejí, je zřejmé, že poblíž mělčiny Scarborough došlo ke střetu mezi naší tamní flotilou a australskou hlídkou. \n\nPodle zprávy jedna z našich torpédoborců vypálila varovný výstřel nad australskými loděmi, což vyvolalo přestřelku. Zatím máme tři oběti a flotila utrpěla menší škody. Australané však zřejmě přišli o dvě lodě a možná až o pět vlastních mužů. \n\nJejich vůdce nyní požaduje, abychom stáhli své lodě z oblasti a zavázali se k jednáním o deeskalaci. Tato drzost je jistě dráždivá, ale pokud nepřistoupíme na ústupky, situace by se na světové scéně mohla proměnit v noční můru." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.2.a: "Cokoli, jen abychom zabránili válce." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.2.b: "Drak se neplazí před ovcí." # todo: NEW TRANSLATION
 abbott_shirtfronting_tt: "Prozatím stáhneme své lodě z mělčiny" # todo: NEW TRANSLATION
 abbott_shirtfronting_china.3.t: "Ustoupení" # todo: NEW TRANSLATION
 abbott_shirtfronting_china.3.d: "Čínská vláda souhlasila se stažením svých lodí z regionu. Na okamžik se zdálo, že naše národy nevyhnutelně směřují k válce, ale tomuto kurzu jsme se těsně vyhnuli. Přestože napětí zůstává vysoké, nabídli vyslat delegaci do Canberry, aby vypracovala pevné řešení, které zabrání opakování situace. Hodně jsme kvůli tomu utrpěli, ale znamená to malé vítězství." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.3.a: "Další válce jsme zabránili." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.4.t: "Ticho" # todo: NEW TRANSLATION
 abbott_shirtfronting_china.4.d: "Linka cvakla a zvuk na druhém konci utichl. Číňané nejsou ochotni diskutovat o žádných podmínkách deeskalace, přestože si incidentu plně uvědomují. Stojíme na rozcestí. Pokud bude Čína pokračovat v této úrovni nekontrolované eskalace, jsme v podstatě ve válečném stavu, aniž bychom se bránili. Na druhou stranu je od prázdného vyhlášení války jen těžko cesta zpět." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.4.a: "Musíme ustoupit." # todo: NEW TRANSLATION
 abbott_shirtfronting_china.4.b: "Jestli chtějí válku..." # todo: NEW TRANSLATION
 call_japan_to_our_side_ast: "Povolat Japonsko na naši stranu" # todo: NEW TRANSLATION
 call_kor_to_our_side_ast: "Povolat Jižní Koreu na naši stranu" # todo: NEW TRANSLATION
 call_roc_to_our_side_ast: "Povolat Tchaj-wan na naši stranu" # todo: NEW TRANSLATION
 abbott_call_to_arms.1.t: "Austrálie nás povolává do zbraně" # todo: NEW TRANSLATION
 abbott_call_to_arms.1.d: "V souladu s podepsanou dohodou mezi našimi národy a vzhledem k současnému konfliktu mezi Austrálií a Čínou nás Austrálie vyzvala, abychom dostáli paktu a připojili se k boji." # todo: NEW TRANSLATION
 abbott_call_to_arms.1.a: "Tak tedy do války." # todo: NEW TRANSLATION
 malcolm_abbott_event.4.t: "Do místnosti Monkey Pod" # todo: NEW TRANSLATION
 malcolm_abbott_event.4.d: "Tony seděl v prázdné parlamentní místnosti a společnost mu dělal pouze bzukot dohasínající žárovky nad hlavou. Myšlenky mu ulpívaly na době strávené v Uluru během jeho prvního běhu na dlouhou trať. Celá cesta byla nesnesitelná. Tony nebyl v takové kondici, aby výzvu přijal, a několikrát se téměř vzdal, ale v tu chvíli se nikdy necítil svobodnější. \n\nV buši kolem vás nebylo nic. Jen hvízdání Witchiti Bush pohupujícího se ve větru a žhnoucí slunce. Když skončil, stalo se to začátkem jeho dlouhé lásky k maratonům a závodům typu „ironman“. Namáhavost těchto činností se stala zkouškou charakteru a nyní v úřadu to bylo podobné utrpení, ale práce vždy stála za to. \n\nTentokrát tomu tak ovšem být nemělo. Jízda se blížila ke konci. Když se všichni liberální poslanci nahrnuli k hlasování, Tony byl poražen poměrem 44 ku 54. Otěží se jako nový vůdce chopil Malcolm Turnbull. Politika podporovala neloajálnost, ale stále to působilo jako rána do zad. Utěšovala ho skutečnost, že se podle svého slova stal poraženým, nikoli člověkem, který by se vzdal." # todo: NEW TRANSLATION
 malcolm_abbott_event.4.a: "Maraton skončil." # todo: NEW TRANSLATION
 malcolm_abbott_event.5.t: "Malcolm Turnbull složil přísahu jako [GetASTLeaderTitle]" # todo: NEW TRANSLATION
 malcolm_abbott_event.5.d: "Na trávníku před parlamentem pronesl Malcolm Turnbull svůj první projev jako nový vůdce Liberální strany a premiér a slíbil „rozsáhlé“ změny, které přinesou „vládu 21. století“. Turnbull oznámil kombinaci nováčků a zkušených členů strany, kteří měli pomoci překlenout přechod, včetně Scotta Morrisona a Christophera Pynea, a upozornil na jmenování pěti dalších žen do kabinetu. \n\n„Musíme být konkurenceschopnější, produktivnější a musíme být inovativnější,“ prohlásil nový [GetASTLeaderTitle] a nasměroval vládu k přijetí technokratičtějšího směru. \n\nAčkoli jsou rány v očích konzervativních zastánců tvrdé linie ve straně stále čerstvé, většina Turnbullův vzestup podpořila a Liberálové po svržení zaznamenali počáteční nárůst podpory v průzkumech." # todo: NEW TRANSLATION
 malcolm_abbott_event.5.a: "Na budoucnost." # todo: NEW TRANSLATION
 aus_war_on_terror_abbott.1.t: "Záminka k válce" # todo: NEW TRANSLATION
 aus_war_on_terror_abbott.1.d: "Tony si otřel pot z čela a rozhlédl se po místnosti plné zaneprázdněných pracovníků médií, kteří pobíhali sem a tam kvůli projevu. Světla, která přinesli, byla nesnesitelně horká a Tony doufal, že to celé rychle skončí. Během posledního měsíce se kvůli jeho vkusu konalo příliš mnoho tiskových a zpravodajských schůzek a nyní bylo jeho úkolem přesvědčit o tom národ. \n\nTeleprompter byl posunut dopředu a všichni ztichli. Tony si odkašlal. Ve svém projevu k národu zmínil jméno, kterým média celé měsíce bombardovala veřejnost. Tím jménem byla Jemaah Islamiyah. \n\nJemaah Islamiyah byla teroristická síť napojená na al-Káidu, kterou ASIS s jistotou označovala za viníka bombových útoků na Bali a útoku na ambasádu. Útočili na nás znovu a znovu, a když jsme konečně našli jejich úkryt, Indonésané odmítli vpustit naše vojáky dovnitř. V podstatě se tak stali „útočištěm teroristů“, jak měl Tony prohlásit. \n\nZda tomu veřejnost plně uvěřila, bylo do značné míry nepodstatné. Rozhodnutí padlo ještě před projevem. Tohle bylo pouze pokládání kolejí." # todo: NEW TRANSLATION
 aus_war_on_terror_abbott.1.a: "„Je čas udeřit zpět.“" # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.1.t: "Canberrská smlouva" # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.1.d: "Po příjezdu do Canberry podmínky smlouvy objasnily demilitarizaci Spratlyho ostrovů, omezení výroby naší flotily a dohodu o nekonfrontaci mezi námi, Austrálií a Filipínami. To by uhladilo katastrofální výsledek střetnutí flotil, zároveň by však šlo o ponížení, které omezuje pohyb na vlastním území. \n\nAčkoli je smlouva pouze dočasná, podporují ji někteří naši hlavní obchodní partneři. Odstoupení by mělo značné následky." # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.1.a: "Pro zachování míru." # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.1.b: "Sní o tom, že ji podepíšeme." # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.2.t: "Podpis smlouvy" # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.2.d: "Čínští a filipínští delegáti dorazili do Canberry v časných ranních hodinách, aby se připravili na schůzku. Když začala, bylo mezi nimi slyšet jen tiché vření. Skutečnost, že čínští zástupci při prvním pohledu na smlouvu neodešli, byla dobrým znamením. Pro ně šlo o jakýsi ponižující rituál, ale s příliš vysokými následky na to, aby se mu mohli vyhnout. \n\nKonečným výsledkem byla dohodnutá demilitarizace vod kolem Scarboroughské mělčiny a Spratlyho ostrovů. Čína se také zavázala k omezení výroby své flotily a hlídkových operací spolu s dohodou o nekonfrontaci. \n\nNebyl to úder z milosti, v jaký jsme mohli doufat, ale dnes se nám podařilo rozbít iluzi čínské nadvlády. Jejich porcelánové brnění je poškozené a čínská sféra byla omezena. Alespoň prozatím." # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.2.a: "Mír v naší době!" # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.3.t: "Číňané odcházejí" # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.3.d: "V nepříliš překvapivém vývoji se během představování podmínek smlouvy čínští delegáti jednoduše zvedli a odešli z konferenční místnosti. Jak víme, již dorazili na letiště, aby se vydali domů. Je to drzé, ale věděli jsme, že podmínky smlouvy jsou riskantní. \n\nNebyl to úder z milosti, v jaký jsme mohli doufat, a odchod představoval značné diplomatické selhání, ale dnes se nám podařilo rozbít iluzi čínské nadvlády. Jejich porcelánové brnění je poškozené a čínská sféra ukázala svou zranitelnost. \n\nSpojené státy spolu s řadou dalších národů se k nám nyní připojily a v reakci na to uvalily na Čínu sankce." # todo: NEW TRANSLATION
 the_canberra_treaty_abbott.3.a: "Udělali jsme, co bylo v našich silách." # todo: NEW TRANSLATION
 starbucks_event_ast.1.t: "Obtížné vaření" # todo: NEW TRANSLATION
 starbucks_event_ast.1.d: "Z nových, zářivých stolů byly odstraněny neprůhledné ochranné fólie a rozbalené židle byly rozmístěny. Zelená siréna dorazila do ulic Sydney — po celé zemi se otevřelo skutečně 87 prodejen a už v pět ráno se fronta táhla kolem celého bloku. Starbucks patřil k poslední vlně amerických řetězců rychlého občerstvení, které vstoupily do země, a manažeři, kteří rovněž přijeli z USA, se na zahájení dychtivě podíleli. \n\nKdyž se dveře otevřely, dovnitř se nahrnuli zákazníci spolu s reportéry, kteří měli událost zdokumentovat. Prodejna byla plná zákazníků — a pak po několika hodinách nebyla. Když zahajovací večírek odešel, byla prodejna ve srovnání s opadajícím davem venku podivně prázdná. \n\nObčas přišla hrstka lidí, většinou turistů, ale z větší části bylo ticho. Tak tomu zůstalo po zbytek týdne a po několika měsících slabých výsledků v celé zemi byla většina prodejen uzavřena." # todo: NEW TRANSLATION
 starbucks_event_ast.1.a: "Přežijí jen nejschopnější." # todo: NEW TRANSLATION
 econ_costello_events.1.t: "Červená hlína a světla reflektorů" # todo: NEW TRANSLATION
 econ_costello_events.1.d: "Když Costello stál pod pražícím sluncem, se zápachem, který ve vzduchu přetrvával až děsivě, a se zády promočenými potem, byl ve svém živlu. \n\nObrovská věž za nimi, která hlasitě čerpala ropu, tvořila kulisu jejich velkolepé dohody. Většina částí byla přepravena ze Spojených států a zde sestavena za méně než měsíc. Desítky dalších podobných zařízení měly vyrůst v Queenslandu a Jižní Austrálii. Celou operaci řídila společnost Lufkin Industries, takže z vlády nešel ani halíř. Přesto jsme měli sklízet odměny. \n\nPrach se začínal vířit a lepil se na jejich obleky, takže Costello a přítomní zástupci korporací fotografování rychle ukončili. Nyní, když byla vláda vnímána jako otevřeně pro-ropná, bušilo na dveře překvapivé množství společností a Lufkin byl teprve první. \n\nV Peterově mysli se uhlí stalo tak dočasným požehnáním. Udržovalo světla rozsvícená a domovy teplé, ale nebylo palivem, které udržovalo zbytek světa v plamenech. Další těžební horečka se bude týkat ropy." # todo: NEW TRANSLATION
 econ_costello_events.1.a: "Je to prostě dobrý obchod." # todo: NEW TRANSLATION
 econ_costello_events.2.t: "Vývoz prudce roste" # todo: NEW TRANSLATION
 econ_costello_events.2.d: "S tím, jak se naše vztahy s Čínou sbližují, naše exportní ekonomika vzkvétá. Objem obchodu s Čínou se v poměrně krátké době výrazně zvýšil a uhlí a kritické nerosty proudí mezi našimi zeměmi historickým tempem. Pravděpodobně tomu tak bude ještě několik měsíců." # todo: NEW TRANSLATION
 econ_costello_events.2.a: "Kořist připadá nám." # todo: NEW TRANSLATION
 econ_costello_events.3.t: "Jedna noc v Pekingu" # todo: NEW TRANSLATION
 econ_costello_events.3.d: "Když Peter a zbytek kabinetu pro zahraniční věci dorazili do Pekingu, bylo to poprvé od summitu G20, co město spatřil. Během těch několika let se panorama města již výrazně změnilo. Odhodlání Číny překlenout hospodářskou propast způsobilo, že prakticky předstihla své sousedy, a její města se proměnila v rozlehlé aglomerace impozantních skleněných monolitů. Každý kousek tohoto růstu, který mohla Austrálie získat, byl bonusem. \n\nKrátká jízda autem je zavezla z letiště do „Velké síně lidu“. V Peterových očích šlo o brutalistní, téměř sovětskou budovu. Městský smog byl kupodivu méně patrný, než očekávali, a před budovou bylo pozoruhodně málo aut. \n\nDostali se do místnosti, kde se s nimi měl setkat ministr zahraničí a čínští delegáti, ale uběhly téměř dvě hodiny a nikdo nepřišel. Nakonec se dovnitř potácel neupravený Alexander Downer. S funěním si narovnal kravatu, omluvil se za zpoždění a schůzka konečně začala. \n\nVýsledkem měla být největší jednotlivá investice v historii země a požehnání pro náš zemědělský vývoz. Tucet společností měl otevřít pobočky v našich městech a předměstích a pracovní místa měla proudit k dělníkům, přičemž se mělo dbát na zacílení oblastí, které to nejvíce potřebují. Když si potřásli rukama a odešli, byla tato cesta bezpochyby nejpodivnější v Peterově paměti." # todo: NEW TRANSLATION
 econ_costello_events.3.a: "Ale přesto nejplodnější." # todo: NEW TRANSLATION
 econ_costello_events.4.t: "Trh s bydlením zaplaven špinavými penězi" # todo: NEW TRANSLATION
 econ_costello_events.4.d: "Zdá se, že vládní snaha podpořit prodeje na trhu s bydlením lákáním čínských investorů přinesla více než jen příval dychtivých kupujících. Včerejší razie v nedávno prodaném mrakodrapu v Perthu odhalila síť praní špinavých peněz a nelegálního financování, která sahá až k financování Liberální strany. Ukázalo se totiž, že jeden ze zatčených investorů byl významným dárcem strany. \n\nSkupiny sledující síť před zásahem upozorňovaly, že desítky zahraničních kupujících z Číny mohly využívat trh s bydlením k obcházení pekingských omezení odlivu kapitálu. Čína okamžitě požádala o vydání zúčastněných osob. Tato reakce může naznačovat, že vřelé zlepšování vztahů náhle skončí." # todo: NEW TRANSLATION
 econ_costello_events.4.a: "Žádná dobrá investice nezůstane bez trestu..." # todo: NEW TRANSLATION
 costello_in_the_mines.1.t: "Těžební korporace vracejí úder" # todo: NEW TRANSLATION
 costello_in_the_mines.1.d: "Ještě než mohlo být vyšetřování oznámeno, informace unikly k velkým těžebním společnostem, které nyní proti nám vrhají vše, co mohou, aby komisi zpomalily. Již proti nám podaly tucet právních námitek a několik dolů na protest uzavřelo provoz. Horší je, že se k nim zřejmě přidávají média. \n\nBez jediného formálního odsouzení se veškerá dobrá vůle, kterou jsme u dolů měli, prakticky vypařila. Někteří magnáti začali financovat opozici a nacionalističtější strany, jako je One Nation, což naši stranu staví do obtížné pozice ohledně budoucího financování. Pořádně jsme kopli do sršního hnízda." # todo: NEW TRANSLATION
 costello_in_the_mines.1.a: "Hnilobu je třeba vyříznout za každou cenu." # todo: NEW TRANSLATION
 costello_in_the_mines.2.t: "Výsledky vyšetřování" # todo: NEW TRANSLATION
 costello_in_the_mines.2.d: "Komise nám konečně předložila svá zjištění a výsledek je šokující. V desítkách dolů, zejména v dopravním sektoru, byly odhaleny stovky nelegálně zaměstnaných pracovníků. Někteří pro společnosti pracovali dokonce celé roky. Reakce těžebních korporací zůstala podle očekávání tichá a zatímco probíhá právní řízení, zůstává nám obtížné rozhodnutí, jak náhle naložit se stovkami nových migrantů v zemi." # todo: NEW TRANSLATION
 costello_in_the_mines.2.a: "Pochybné odvětví." # todo: NEW TRANSLATION
 costello_in_the_mines.3.t: "Nakládání s pracovníky" # todo: NEW TRANSLATION
 costello_in_the_mines.3.d: "V důsledku vyšetřování bylo zjištěno, že v zemi žije více než tři sta migrantů. Téměř polovina z nich pracuje v těžebním sektoru déle než dva roky. Média a několik členů našeho kabinetu trvají na tom, abychom využili své současné možnosti a okamžitě je deportovali. Vzhledem k úrovni jejich výcviku bychom jim však mohli udělit dočasná víza a umožnit jim pokračovat v práci. Zabránilo by to náhlému výpadku příjmů dolů, ale nebyl by to populární krok." # todo: NEW TRANSLATION
 costello_in_the_mines.3.a: "Deportujte je." # todo: NEW TRANSLATION
 costello_in_the_mines.3.b: "Nechte je zůstat." # todo: NEW TRANSLATION
 costello_in_the_mines.4.t: "Nabídky z Arábie" # todo: NEW TRANSLATION
 costello_in_the_mines.4.d: "Korunní princ a premiér, [SAU.GetLeader], nás kvůli této žádosti přímo oslovil. Nabízí značné investice do naší současné těžby kritických nerostů výměnou za zrušení některých omezení investic jejich národa v Austrálii. Projevili zvláštní zájem o náš sport a povolení jejich investic by mohlo výrazně rozšířit dosah našeho zábavního průmyslu, ačkoli bychom tím otevřeli dveře zemi, která není zrovna hodna důvěry." # todo: NEW TRANSLATION
 costello_in_the_mines.4.a: "Spravedlivá nabídka." # todo: NEW TRANSLATION
 costello_in_the_mines.4.b: "Raději se příliš nesbližujme." # todo: NEW TRANSLATION
 costello_republic_events.1.t: "Šplhání po zdech Senátu" # todo: NEW TRANSLATION
 costello_republic_events.1.d: "Na rozdíl od našeho posledního pokusu prosadit otázku republiky parlamentem nejsou hlasy zatím jednoduše na naší straně. Zastánce tvrdé linie Tony Abbott se znovu připojil k protirepublikánskému táboru, stejně jako v roce 1999, během Otázek a odpovědí vystupuje jako jeho mluvčí a účinně rozděluje stranu. V plné míře se také projevila jeho schopnost působit nám problémy v médiích, protože využívá každou možnou příležitost ke kampani proti nám. \n\nPokud to nedokážeme prosadit v Senátu ještě před vypsáním referenda, naše šance jsou ztraceny a omezená podpora, která nám ve straně zbývá, se začíná rozpadat. Možná bychom se měli začít poohlížet po jiných způsobech, jak hlasy získat." # todo: NEW TRANSLATION
 costello_republic_events.1.a: "Před námi leží obtížná cesta." # todo: NEW TRANSLATION
 costello_republic_events_abbott_tt: "§YOpozice bude nadále pracovat proti nám.§!" # todo: NEW TRANSLATION
 costello_republic_events.2.t: "Získávání hlasů" # todo: NEW TRANSLATION
 costello_republic_events.2.d: "Kevin Rudd byl bezkonkurenčně nejmazanějším politikem v parlamentu. Howard ho nenáviděl a ani jeho vlastní strana ho zřejmě neměla ráda. Nějak se vyšplhal až na vrchol Laboristické strany a nyní byl naší největší překážkou při získávání hlasů. \n\nRudd požádal, aby se setkali v jedné z kaváren těsně před parlamentem, pravděpodobně s výslovným úmyslem dát okolním paparazziům příležitost zachytit jeho fotografii společně s [GetASTLeaderTitle]. Cokoli, co by ho vyneslo vzhůru a umožnilo mu házet špínu na nás. \n\nJako obvykle přišel pozdě a trval na tom, že zůstane na jídlo. Objednali si kachní palačinky a steak, ať už to znamená cokoli, a pak se Rudd konečně pustil do věci. Laboristé se snažili prosadit rozšíření programu Medicare, které by naše strana bezpochyby smetla ze stolu. V nejjednodušším smyslu šlo o něco za něco a po potřesení rukou by nám poskytl hlasy potřebné k prosazení návrhu v Senátu a na oplátku nám poskytl určitou podporu. \n\nCena však byla poněkud těžko stravitelná." # todo: NEW TRANSLATION
 costello_republic_events.2.a: "Máme na výběr?" # todo: NEW TRANSLATION
 costello_republic_events.3.t: "Neobvyklý souhlas" # todo: NEW TRANSLATION
 costello_republic_events.3.d: "Po předložení návrhu generálnímu guvernérovi jej překvapivě bez potíží podepsali. Dokonce se zdají být ochotni nám pomoci a zašli tak daleko, že v médiích podpořili myšlenku republiky. Nyní, když máme jejich souhlas, můžeme zvážit přidání dalších ustanovení do nové ústavy. Práce samozřejmě nekončí. Než ji budeme moci znovu poslat do Senátu, stále budeme potřebovat podporu veřejnosti. Na rozdíl od roku 1999 musíme tentokrát veřejnost nadále mobilizovat a nenechat tento rozmach opadnout." # todo: NEW TRANSLATION
 costello_republic_events.3.a: "Tak se do toho pusťme." # todo: NEW TRANSLATION
 costello_republic_events.4.t: "Australané ruší monarchii" # todo: NEW TRANSLATION
 costello_republic_events.4.d: "Sydney a další velká města dnes pokryly zelené, žluté a modré transparenty. Hnutí za Australskou republiku je vyvěsilo v očekávání výsledků referenda. Dnes byly zveřejněny: 63 % hlasujících podpořilo republiku a čtyři z pěti potřebných států ji schválily. Ačkoli bude třeba legislativu ještě prosadit parlamentem, než ji bude možné uznat jako zákon, výsledek fakticky zrušil australský monarchismus. \n\nFunkce generálního guvernéra bude zrušena, bude třeba zavést novou vlajku a titul premiéra se brzy změní, aby odrážel nový model vlády. Republikáni oslavovali po zbytek dne v ulicích. Ačkoli se opoziční hnutí neúspěšně snažilo zachovat status quo, jeho vůdce, liberální politik Tony Abbott, přiznal, že změna nasměrovala Austrálii ke „skvělé budoucnosti“." # todo: NEW TRANSLATION
 costello_republic_events.4.a: "Konečně." # todo: NEW TRANSLATION
 costello_republic_events.4.b: "Překvapivá změna." # todo: NEW TRANSLATION
 costello_in_the_mines.5.t: "Setkání s magnátem" # todo: NEW TRANSLATION
 costello_in_the_mines.5.d: "Domluvit schůzku s Rupertem Murdochem nebylo těžké. Shodou okolností generální ředitel společnosti Newscorp pravidelně kontaktoval Peterovu kancelář a dychtil po setkání a diskusi o politice. Nějak uplynulo půl desetiletí od jejich posledního rozhovoru, ale když se znovu setkali, Rupert vypadal, jako by nezestárl ani o den. \n\nVětšina lidí věděla, že je šéfem Newscorpu a s ním i poloviny novin, ale málokdo věděl, s kolika těžebními projekty byl spojen. Kdykoli se Peter pokusil nadhodit myšlenku reformy těžební daně, Rupert ji smetl ze stolu. Získání souhlasu magnáta mělo vše odstartovat, ale příležitost rychle mizela. \n\nKdyž se konečně dostali k těžbě, Rupert pořád dokola mluvil o Geelongu a dělnických voličích. Peterův volební obvod byl Geelong, takže mu pointa neunikla, ale pokud chtěl zachránit alespoň nějaký argument, musel tak učinit nyní. \n\n„Po pěti letech růstu přece daňová reforma není tak radikální. Pro nás ostatní by měla existovat nějaká odměna—\n\n„Odměna?“ Rupert se toho slova chytil, jako by šlo o nadávku z úst starce. „Pamatuji si, když strana bývala proti ‚velké vládě‘. Jsem si jistý, že víte, co strana potřebuje nyní.“ \n\nTím Rupert poděkoval za jeho čas a rozloučili se. Nebyl to odrazový můstek, v jaký doufal, a ve skutečnosti si Costello vůbec nebyl jistý, co si ze schůzky odnést. Mohl jen doufat, že si nevedl hůř než Howard." # todo: NEW TRANSLATION
 costello_in_the_mines.5.a: "Nepříjemný pocit." # todo: NEW TRANSLATION
 costello_republic_events.5.t: "Úsvit v parlamentu" # todo: NEW TRANSLATION
 costello_republic_events.5.d: "Celý parlament se nacházel ve stavu jásotu, s energií, kterou si Costello dokázal představit snad jen při vzniku federace. Téměř na každém pracovišti visely girlandy a transparenty. Polovina budovy byla opuštěná, protože politici buď byli v místních hospodách, nebo oslavovali v jídelnách. \n\nKdyž se prodíral davem shromážděným kolem přenosné televize, zahlédl, co sledovali. Kolem Harbour Bridge probíhala světelná show a viselo na něm ohnivé zobrazení nové vlajky, zatímco nad hlavou vybuchoval ohňostroj. Bylo zřejmé, že nějakým způsobem slaví i opozice. Naše země konečně učinila další velký krok. Vynořili jsme se z dospívání. \n\nPlesový sál byl pro tuto příležitost náležitě honosný a když Costello dorazil a začal si připravovat kartičky s projevem, všiml si v davu známé tváře. Na oslavu dorazil sám John Howard. Costello nemohl jinak než sejít z pódia a jít pozdravit bývalého premiéra a svého starého partnera. \n\nPotřásli si rukama a Howard se zvětralým, ale hrdým výrazem ve tváři se usmál." # todo: NEW TRANSLATION
 costello_republic_events.5.a: "\"Výborně, kamaráde. Výborně.\""
 commonwealth_games_ast.1.t: "Hry Commonwealthu [GetYear]"
 commonwealth_games_ast.1.d: "Více než 5 000 sportovců ze 71 zemí, teritorií a územních celků se letos shromáždilo v australském Melbourne, aby soutěžili na Hrách Commonwealthu. Zahájení proběhlo na stejném místě jako Letní olympijské hry v roce 1956 a součástí programu byla řada atrakcí včetně létající tramvaje a velkolepého ohňostroje. Očekává se, že bude představeno 17 sportů. \n\nPoprvé v historii her navštívila Královnina štafeta každou jednotlivou zúčastněnou zemi a teritorium Commonwealthu. Urazila přitom 180 000 km (112 500 mil). To dokládá dlouhodobý závazek a hluboké vazby mezi národy Commonwealthu."
 commonwealth_games_ast.1.a: "Naše společné hodnoty žijí dál v soutěžním sportu."
 commonwealth_games_ast.1.b: "To byla podívaná."
 costello_republic_events.6.t: "Přiložit ruku k dílu"
 costello_republic_events.6.d: "Alexander Downer, místopředseda vlády, se pohodlně opřel v křesle, zatímco Costello představoval své plány. Downer měl pokerový výraz dokonale zvládnutý. Nikdy jste skutečně nevěděli, co si myslí, dokud nepromluvil, a Costello si ho vybral právě proto, že to dělal jen zřídka. Tentokrát však v jeho tváři spatřil překvapení. Po představení se Downer naklonil dopředu a pronesl větu, kterou premiér očekával. \"Jak víš, že se nebude opakovat rok 99?\" \n\nTato otázka Costella provázela po celý proces. Nemohl si být jistý, že se vyhnou dalšímu neúspěchu, jako bylo referendum z roku 1999, ani že se jim návrh podaří znovu prosadit oběma komorami. Nic nebylo zaručeno, ale musel to zkusit. \n\nPo krátké hádce Downer pokrčil rameny a souhlasil s pomocí. Vstupovali buď do neprobádaného území, nebo do důvěrně známé bažiny. Přinejmenším v tom ale měli klesnout společně. Jednu věc však Downer nedokázal rozluštit. \n\n\"Budu ti muset říkat premiére, nebo pane prezidente?\""
 costello_republic_events.6.a: "A hádka pokračovala."
 labor_factionalism.1.t: "Frakce v Australské straně práce"
 labor_factionalism.1.d: "Australská strana práce sice není koalicí, ale má vlastní frakce. Dvě z nich mají největší vliv. Na levici stojí demokratičtí socialisté, kteří prosazují společensky progresivní politiku, například zvýšení sociálních dávek, posílení systému Medicare a hospodářské zásahy. Kevin Rudd tuto stranu víceméně zastupuje. Na druhé straně stojí centrističtější proud. Mnozí z jeho představitelů následují ekonomické principy „Třetí cesty“ – fiskálně konzervativní programy, jejichž cílem je lidem „pomoci postavit se na vlastní nohy“, nikoli je pouze podporovat, a které jsou vstřícnější k obchodním zájmům. \n\nAustralskou pravici v rámci strany zastupuje Julia Gillardová, která v současnosti působí jako místopředsedkyně [GetASTLeaderTitle]. Přestože Rudd a Gillardová v zájmu národa svědomitě spolupracují na tvorbě politiky, existuje mezi nimi tichá dohoda, že si nebudou šlapat na paty. Přílišný příklon na jednu či druhou stranu by mohl alianci napnout, nebo dokonce stranu zcela rozbít. \n\nBěhem kampaně jsme také slíbili zavedení §Ysystému obchodování s emisemi§!, což odpovídá našemu směřování v oblasti klimatické politiky. Měli bychom zajistit, abychom tento systém schválili během prvního volebního období, jinak by strana mohla začít zpochybňovat naše vedení."
 labor_factionalism.1.a: "Křehký úkol."
 rudd_apology.1.t: "Národní omluva"
 rudd_apology.1.d: "Jen několik měsíců po začátku nového funkčního období Kevina Rudda vystoupil [GetASTLeaderTitle] před národem s oficiální „omluvou“ za historické křivdy spáchané na prvních obyvatelích Austrálie: Aboridžincích a obyvatelích Torresova průlivu. \n\nToto historické gesto, založené na zprávě Bringing Them Home z roku 1997, přednesl [GetASTLeaderTitle] v budově parlamentu a od té doby vyvolalo po celé Austrálii emocionální otřes. Davy ve Velkém sále i na trávnících před parlamentem jásaly a tleskaly. Několik tisíc lidí se shromáždilo v dešti v ulicích Sydney, aby sledovalo tento významný projev. \nSpolečnost zaplavil hluboký pocit úlevy a uzdravení a mnozí v ní chválí Ruddovo úsilí napravit nečinnost předchozích vlád."
 rudd_apology.1.a: "Bylo načase."
 tackle_mining_oligarchy_ast.1.t: "Rozhovor o daních"
 tackle_mining_oligarchy_ast.1.d: "Rudd nenáviděl cestu od svého stolu do Kenovy kanceláře. Chodby v budově parlamentu byly nemocničně ploché a bílé a vyvolávaly v něm řadu špatných vzpomínek spojených s tímto místem i s tím, co se dělo venku. Zaklepal na dveře těsně pod nově instalovanou cedulkou s nápisem „Ken Henry“. \n\nKdyž vstoupil, Ken stále usilovně pracoval na daňové revizi, které ostatní členové výboru velkoryse říkali „Henryho revize“. Ken byl jen o pár let starší než Rudd, ale působil jako člověk ze staré školy. Nepomáhalo ani to, že novému [GetASTLeaderTitle] často udílel rady. \n\nOčekávalo se, že se revize dotkne těžebních zisků, a Rudd chtěl znát všechny podrobnosti. Několik hodin spolu debatovali o myšlence mimořádných daní a jejich spravedlivém provedení, než Ken konečně složil zbraně a vydal se domů. Rudd však ne. Jeho noc teprve začínala, ale potřeboval pomoc, aby věci uvedl do pohybu."
 tackle_mining_oligarchy_ast.1.a: "Někdo, kdo rozumí hře."
 tackle_mining_oligarchy_ast.2.t: "Není cesty zpět"
 tackle_mining_oligarchy_ast.2.d: "Další pozdní večer v parlamentu strávil Rudd s Waynem Swanem. Swan byl jedním z „gangu čtyř“, jak média nazývala Ruddův nejužší okruh. Dalšími dvěma byli Julia Gillardová a Lindsey Tanner. \n\nKevin strávil dlouhou dobu procházením legislativního plánu a ve své kanceláři už sestavil tým poradců, kteří na něm pracovali, ale Swan byl pro úspěch plánu klíčový. Nejen proto, že měl jako pokladník zkušenosti a dokázal odhalit, co by ostatní mohli přehlédnout, ale také dodával celému záměru důvěryhodnost. Rudd stále působil trochu jako politický outsider. Swanovy kvalifikace však nikdo nezpochybňoval. \n\n„Tady se opravdu pouštíš do samotné páteře naší politiky. Spousta našich lidí je podporována těžaři. Když to uděláme, nebudou z toho nadšení. Půjdou po nás vším, co mají. Bude to ošklivé.“ \n\n„Myslím, že jsme zažili i horší věci, co?“ Kevin si nervózně poškrábal nos a usmál se, ale Wayne ani nemrkl. Jen na Kevina dál hleděl ustaraným pohledem, přesto souhlasil s pomocí. \n\nV určitém okamžiku v tom byli všichni společně a Kevin věřil, že Wayne nebude chtít sledovat pád své vlády. Do bouře se vydají společně."
 tackle_mining_oligarchy_ast.2.a: "Nikdy to nemělo být snadné."
 pink_batts_ast.1.t: "Katastrofa růžových izolačních rohoží"
 pink_batts_ast.1.d: "Zdá se, že v souvislosti s naším programem zateplování domů nastal nejhorší možný scénář. Více než několik instalací dlouhodobě selhalo a co hůř, během instalace zemřeli čtyři pracovníci. Tři po zásahu elektrickým proudem a jeden na hypertermii. Již byla vyžádána královská komise a obrátila se na nás také velká hromadná žaloba od dodavatelů a montážníků, kteří zřejmě utrpěli finanční škody. \n\nŘíct, že jde o katastrofu, by mohlo být ještě mírné. Už samotný politický dopad nás může svrhnout. Budeme muset program okamžitě ukončit a navázat na něj programem stažení výrobků."
 pink_batts_ast.1.a: "Jak se to mohlo stát?"
 bob_brown_event.1.t: "Výstřední Bob Brown"
 bob_brown_event.1.d: "Bob Brown byl podivuhodný člověk. Jeho aktivismus a posedlost životním prostředím způsobovaly, že Rudd vedle něj vypadal jako průmyslník, a ekologové ho za to milovali. Není divu, že byl de facto zakladatelem strany Zelených. O více než deset let později zůstával ve straně stále zcela nezpochybňován. Naopak ho stavěli do role svého vůdčího symbolu, což v Ruddových očích hraničilo s kultem osobnosti. \n\nBrown souhlasil, že přijede do hlavního města na oběd s Ruddem a prodiskutuje spolupráci, která byla až dosud mírně nepřátelská. Když dorazil, Brown se celý usmíval a rychle mu podal ruku. Obědvali v jedné z nedalekých kaváren, což je bohužel vystavilo rozmarům canberrského počasí, které bylo téměř vždy příšerné. Možná proto byli všichni politici tak podráždění. \n\nPo telefonu se zdálo, že podpora Zelených je již zajištěná, ale když to Rudd znovu probíral, Brown jednoduše zavrtěl hlavou. Navzdory tomu, jak velkolepý návrh už byl, chtěl jít ještě dál, a kdykoli se Rudd pokusil přivést předsedu vlády zpět k realitě toho, co může rozumně projít Senátem, Brown neustoupil. \n\nAť už měli Zelení jakoukoli drobnou páku, nyní ji využívali, a Ruddovi začínala docházet trpělivost. Když si nakonec potřásli rukama, Rudd si uvědomil, že Australská strana práce buď dosáhne velkého úspěchu, nebo odejde s prázdnýma rukama."
 bob_brown_event.1.a: "A nic mezi tím."
 school_visit_rudd.1.t: "Procházka Coorparoo"
 school_visit_rudd.1.d: "Kevin a jeho doprovod dorazili v poledne do školy, aby se setkali s ředitelem a prohlédli si ji. Někdo zjevně upozornil tisk, protože sotva vstoupili dovnitř, nahrnulo se dovnitř i množství reportérů a brzy je zcela obklopili. \n\nZ úst novinářů zazněly obvyklé otázky: „Couvá vláda od reformy? Selhává Australská strana práce ve svém slibu fiskální konzervativnosti?“ \n\nRudd se je snažil co nejlépe ignorovat a dostat alespoň slovo s ředitelem o rekonstrukci. Podařilo se jim proklouznout jedněmi dveřmi na nádvoří, kde vzniklo nové basketbalové hřiště, které zároveň sloužilo jako shromaždiště. Nová stavba byla hezká, ale v kontrastu s mnohem staršími budovami vedle působila trochu bolestivě na pohled. \n\nMor moderního designu konečně dorazil i na státní školu v Coorparoo. Nové úpravy však budou pro školy, jako je tato, velkým přínosem, zejména pro ty znevýhodněné. Když se vraceli dovnitř, následoval je zástup dětí, které se protlačily kolem reportérů a dožadovaly se času na otázky. [GetASTLeaderTitle] začal. \n\n„Je skvělé tu být. Zvedněte ruce – co se vám na tomto novém sále líbí nejvíc?“ \n\n„Můžeme sedět na sedačkách,“ odpověděl jeden ze studentů. \n\n„Můžete sedět na sedačkách – to je velký rozdíl!“"
 school_visit_rudd.1.a: "Vskutku..."
 gayvote_rudd.1.t: "Austrálie hlasuje ANO pro rovnost v manželství"
 gayvote_rudd.1.d: "Poté, co bylo uzákonění manželství osob stejného pohlaví předloženo k dobrovolnému referendu, odpovědělo 61,6 % Australanů kladně a dalo tak zelenou schválení zákona ve Sněmovně reprezentantů i Senátu. Při účasti 79,5 % o změně rozhodly miliony voličů a očekává se, že přijatý zákon bude v následujících měsících ratifikován, k velké radosti párů stejného pohlaví, které chtějí uzavřít sňatek.\n\nMinistr Australské strany práce Bill Shorten oslavoval změnu s davem v Sydney a chválil úsilí [GetASTLeaderTitle] i opozičního poslance Malcolma Turnbulla o prosazení zákona. \n\n„Jaký nádherný den být Australanem – obě strany jsou připraveny na změnu a podporují hlas veřejnosti.“"
 gayvote_rudd.1.a: "Láska vítězí!"
 unite_the_nation_speech_ast.1.t: "Kevin Rudd promlouvá k národu"
 unite_the_nation_speech_ast.1.d: "Nový [GetASTLeaderTitle] nastínil závazek napsat v australských dějinách „novou stránku“ a usilovat o uzavření propasti nerovnosti, která v současnosti existuje napříč národem. Byly představeny plány nových sociálních a hospodářských programů, přičemž Rudd oznámil, že jejich cílem je výrazně překonat úspěchy předchozí generace. Poté byly přečteny osobní příběhy prvních obyvatel Austrálie. \n\n[GetASTLeaderTitle] zakončil projev zdůrazněním užšího partnerství s Aboridžinci a obyvateli Torresova průlivu, jehož cílem je „uzavřít propast mezi sliby a výsledky“. \n\nProjev zatím vyvolal příznivé reakce, ale bez konkrétních změn nelze říci, jak dlouho tato dobrá vůle vydrží."
 unite_the_nation_speech_ast.1.a: "Jmenuji se Kevin, jsem z Queenslandu a jsem tu, abych pomohl."
 something_to_give_ast.1.t: "Něco, co lze nabídnout"
 something_to_give_ast.1.d: "Z telefonu se ozvalo pípání Centrelinku, zatímco přecházela po malém bytě. Už téměř hodinu čekala, až ji spojí s operátorem, ale jak se hodiny blížily k páté odpoledne, její naděje vyprchávala. Ten den právě skončila výuku, ale pokud se jí tentokrát nepodaří s někým telefonicky spojit, bude muset znovu volat zítra. Připadalo jí, že tento koloběh nikdy nekončí. \n\nKonečně telefon zapraskal a ozval se hlas. Neztrácela čas a druhému účastníkovi vylíčila svou situaci. Studovala na plný úvazek a protože se jí nedařilo najít práci, účty se jí hromadily. Ani sociální dávky nestačily na jejich pokrytí a obava, že se bude muset odstěhovat a přerušit studium, se zdála stále pravděpodobnější. Potřebovala jen trochu více času. \n\nHlas na druhém konci byl soucitný, i když zněl téměř stejně unaveně jako ona, ale zdálo se, že nemá nárok na žádnou podporu. Sesunula se od kuchyňské linky na podlahu. Nebyla žádná cesta ven. Operátor se zeptal, zda ji může nechat čekat, a ona opět osaměla. Byla příliš unavená na pláč a stejně by to nic nezměnilo. Takhle to přece bývalo vždycky. \n\nOperátor se náhle vrátil. Právě tento týden byl spuštěn nový program, který příjemcům umožňoval požádat o nouzovou platbu. Splátky se měly postupně strhávat z budoucích dávek. Nebylo to mnoho, ale pokrylo by to nájem a ona by mohla dál studovat. Zpráva ji zcela ohromila. Po skončení hovoru vyskočila radostí a po tvářích se jí začaly řinout slzy."
 something_to_give_ast.1.a: "I malá pomoc znamená mnoho."
 bill_of_rights_ast.1.t: "Schválení zákona"
 bill_of_rights_ast.1.d: "Nakonec proti nám obě strany Sněmovny reprezentantů i Senátu bojovaly zuby nehty, aby zákon vůbec prošel. Upravili jsme jeho obsah na přijatelnou úroveň, ale stále je to začátek. Zákon Commonwealthu o lidských právech Austrálie nabízí rozšíření našich zákonů o svobodě projevu, právo shromažďovat se, spravedlivý proces, rovnost před zákonem, ochranu před mučením a mnoho dalšího. \n\nNejenže zavádíme nejrozsáhlejší právní předpis na ochranu občanských práv v našich dějinách s rozsáhlou ochranou Aboridžinců a obyvatel Torresova průlivu, ale také pokládáme základ, který bude chránit všechny budoucí generace Australanů zákonem. \n\nNyní ještě musíme vše ratifikovat a v následujících měsících zahájit provádění, ale rozhodně to působí jako velký krok k dospělosti našeho národa."
 bill_of_rights_ast.1.a: "Těm, kteří budou sklízet plody."
 rudd_nz_deal.1.t: "Cesta do Wellingtonu"
 rudd_nz_deal.1.d: "Rudd nastupoval do jednoho z ranních letů, aby z výšky nepřišel o výhled na hory. Pokud v něčem země kiwi porážela Austrálii, byla to krajina. Jejich ministerstvo zahraničí vám rádo připomínalo, že se tam natáčel Pán prstenů, a nebylo těžké pochopit proč. Obchodní dohoda přes Tasmanovo moře, kterou tam měl podepsat, měla naše ekonomiky prakticky propojit, a Rudd se divil, že nebyla uzavřena už dříve. \n\nPremiér [NZL.GetLeader] byl první, kdo mu po vystoupení z letadla podal ruku, a odvedl jednání do diplomatického salonku na letišti. Společně prošli veškeré dokumenty a vše vypadalo dobře: prakticky úplné odstranění cel a obchodních překážek u zboží a služeb, zkrátka běžná agenda. Nyní přišla chvíle, na kterou novozélandský premiér čekal. \nNavrhli, aby prvním krokem dohody byla investice Austrálie do průmyslových center Nového Zélandu, a poté vyjmenovali výnosy v příštích desetiletích. Všechno dávalo smysl, ale skutečně se vyplatilo investovat tolik peněz hned?"
 rudd_nz_deal.1.a: "Dobře."
 rudd_nz_deal.1.b: "Obchodní dohoda prozatím stačí."
 rudd_visit_ast.1.t: "Přiblížení k Jihokorejcům" # todo: NEW TRANSLATION
 rudd_visit_ast.1.d: "Po přistání v zemi byla jednou z prvních zastávek příležitost k fotografování na pamětním hřbitově v Pusanu. Rudd měl to štěstí, že nikdy nebojoval v žádné válce. Žádný z dosud sloužících australských ministrů nebyl ani na světě během korejské války a jednou z jeho hlavních priorit bylo vyhnout se dalšímu podobnému konfliktu. \n\nPamátník byl obrovský a zblízka velmi působivý. Celý hřbitov byl zahradou a téměř každý náhrobek měl květinu nebo živý plot. Doprovázely je vlajky z celého světa. Jihokorejci měli hrozbu války každý den nad hlavou, a tak si přirozeně drželi své spojence velmi blízko. \n\nKdyž se konečně vrátili do Národního shromáždění, jihokorejský prezident, [KOR.GetLeader], reagoval na myšlenku pacifické unie pozitivně, ale otevřeně uvedl podmínku. Jako obvykle byly požadavkem obranné záruky z naší strany a zdálo se, že na tom pevně trvají. Chtěli mít jistotu, že pokud Severní Korea někdy odpálí raketu, odpálíme raketu i my, a pokud vyšle flotilu, budeme mít připravenou vlastní. Tato myšlenka jistě měla své přednosti, ale stálo za to kvůli ní narušit status quo?" # todo: NEW TRANSLATION
 rudd_visit_ast.1.a: "Jsme v tom společně." # todo: NEW TRANSLATION
 rudd_visit_ast.1.b: "Nestojí to za riziko." # todo: NEW TRANSLATION
 rudd_visit_ast.1.c: "„Už jsme s vámi.“" # todo: NEW TRANSLATION
 rudd_visit_ast.2.t: "Let nad Ósakou" # todo: NEW TRANSLATION
 rudd_visit_ast.2.d: "Japonsko novému hospodářskému řádu vykročilo vstříc mílovými kroky. Jejich závod na vrchol žebříčku HDP v 90. letech byl obdivuhodný, ale skutečným důkazem byla jejich města. Let nad Ósakou působil jako pohled na tucet náměstí Times Square. Ani naše nejurbanizovanější města se jim nemohla rovnat a zářila jako neonový milostný dopis kapitalismu. \n\nPřistáli v Tokiu a začala jednání. Japonci se k rozhovorům stavěli, jako by se otázka objevila teprve nyní, a ne jako by se o ní dlouze diskutovalo o měsíc dříve. Rudd přemýšlel, zda nezdržují, ale nakonec vznesli požadavek. \n\nJakákoli záminka k hospodářské unii v Pacifiku musela zahrnovat záruky, že se Čína zaváže zmapovat svá území na moři. Její budování ostrovů a rozšiřování námořní kontroly znepokojovaly Japonce, kteří věřili, že naše role prostředníka by mohla vše zahájit správným směrem." # todo: NEW TRANSLATION
 rudd_visit_ast.2.a: "Předložíme podmínky, ale nic víc." # todo: NEW TRANSLATION
 rudd_visit_ast.3.t: "Pekingská odpověď" # todo: NEW TRANSLATION
 rudd_visit_ast.3.d: "Po dlouhém letu domů se Rudd nemohl ubránit pocitu mírné porážky. Čínský tým ministrů zahraničí ho z konferenční místnosti téměř vysmál. Navzdory dobře probíhajícím jednáním byl Peking k myšlence pacifické hospodářské unie pesimistický. Výhody ASEANu v současnosti dostačovaly a [CHI.GetLeader] nebyl ochoten zprostředkovat nic nového mezi sousedními mocnostmi. \n\nJednání však přece jen nebyla úplnou ztrátou. Tým dlouze diskutoval o plánování otevřenější obchodní dohody mezi našimi národy a nabídli nám novou smlouvu. Nová dohoda pokrývá širokou škálu čínského dovozu výměnou za prakticky bezcelní obchod s naším uhlím a dalším nerostným vývozem. \n\nPřijatelná útěcha za zkrachovalá jednání." # todo: NEW TRANSLATION
 rudd_visit_ast.3.a: "Není to špatné." # todo: NEW TRANSLATION
 rudd_visit_ast.4.t: "Květy švestky" # todo: NEW TRANSLATION
 rudd_visit_ast.4.d: "Čínský ministr zahraničí nám sdělil, že Peking je otevřený novému vyjednání svých územních hranic s Japonskem. Možná jde jen o začátek, ale skutečnost, že jsou k požadavku vstřícní, ukazuje, jak daleko jsme se dostali. Požádali nás, abychom se jednání účastnili jako neutrální pozorovatelé, což bezpochyby potrvá několik let. \n\nK vlastní Pacifické unii máme možná ještě daleko, ale význam pokroku, kterého jsme dosáhli při zajišťování míru v Pacifiku, byť dočasného, nelze podceňovat. Peking také naznačil zlepšení naší stávající obchodní dohody, čímž by se naše národy hospodářsky ještě více sblížily, spolu s přísliby budoucích jednání o námořní obraně." # todo: NEW TRANSLATION
 rudd_visit_ast.4.a: "Mír v naší době" # todo: NEW TRANSLATION
 gillard_talk.1.t: "Zastřelila jsem zástupce" # todo: NEW TRANSLATION
 gillard_talk.1.d: "Při jejich obvyklých schůzkách Julia Gillardová informovala Rudda o své části vlády. Od chvíle, kdy složila přísahu jako náměstkyně [GetASTLeaderTitle], měla Julia na starosti „superministerstvo“ — oddělení školství, zaměstnanosti a pracovněprávních vztahů sloučené do jednoho. Bylo toho hodně k řízení, ale Rudd věřil, že si poradí. Za osm let, co se znali, na něj působila jako jedna z nejbystřejších a nejschopnějších političek v Canbeře. \n\nJulia začala poradu tím, že Rudda seznámila s nejnovějšími stížnostmi mnoha podniků, které měly pocit, že kvůli velmi odborově orientované vládě tahají za kratší konec. Většinu z toho bylo samozřejmě možné ignorovat, ale Julia trvala na tom, že s nimi musíme zůstat v dobrých vztazích. Na tom, jak daleko zajdeme se sociální politikou, záleželo jen málo, pokud se neodchýlíme od našeho současného postoje podporujícího podnikání. \n\nKdyž skončila, Rudd cítil, jak se do něj zavrtává pohledem. I při neformálním rozhovoru měl pocit, že ho nějak analyzuje. Rudd souhlasil, že doporučení zváží, a pro tento den se rozešli, přesto přemýšlel, jak vážně to myslela." # todo: NEW TRANSLATION
 gillard_talk.1.a: "Něco k zamyšlení." # todo: NEW TRANSLATION
 papua_talks_rudd.1.t: "Renovace zadržovacích středisek" # todo: NEW TRANSLATION
 papua_talks_rudd.1.d: "Austrálie nabídla renovaci zadržovacích středisek, která zde vybudovala, výměnou za menší zahraniční granty. Vzhledem k tomu, že byla téměř úplně vyprázdněna, začala tato střediska skutečně chátrat a dopad na nás bude velmi malý. Zdá se, že jde o snahu napravit jejich přetrvávající imigrační problémy." # todo: NEW TRANSLATION
 papua_talks_rudd.1.a: "Dobře." # todo: NEW TRANSLATION
 papua_talks_rudd.1.b: "Tentokrát ne." # todo: NEW TRANSLATION
 papua_talks_rudd.2.t: "Papua-Nová Guinea souhlasí s renovacemi" # todo: NEW TRANSLATION
 papua_talks_rudd.2.d: "Navzdory vypršení nájemní smlouvy vláda v Port Moresby souhlasila s tím, že nám umožní přístup ke střediskům, aby mohly začít renovace. To by nám mělo umožnit přesunout ty, kteří přeskočili frontu, do Papuy-Nové Guineje, a snad odradit od budoucích přistání na našem území." # todo: NEW TRANSLATION
 papua_talks_rudd.2.a: "Podle očekávání." # todo: NEW TRANSLATION
 papua_talks_rudd.3.t: "Papua odmítá jednání" # todo: NEW TRANSLATION
 papua_talks_rudd.3.d: "Navzdory nabídce finanční kompenzace vláda v Port Moresby odmítla jakékoli rozhovory o renovaci zadržovacích středisek. Zdá se, že se zasekli na morální stránce celé věci. Nyní budeme muset žadatele o azyl dál ubytovávat zde." # todo: NEW TRANSLATION
 papua_talks_rudd.3.a: "Nečekané zklamání" # todo: NEW TRANSLATION
 address_the_tiger_event_ast.1.t: "Zprostředkování míru v Bháratu" # todo: NEW TRANSLATION
 address_the_tiger_event_ast.1.d: "Jednání s Indií byla předurčena od začátku funkčního období Kevina Rudda, možná dokonce ještě dříve. Naše strategické cíle v Pacifiku se dobře shodují a Indie dychtivě spolupracuje s ADF na zdokonalování své armády. Nyní jsme jí jen museli představit myšlenku spolupráce s Čínou. \n\nV Novém Dillí byl skutečně rozvinut červený koberec. [RAJ.GetLeader] možná celé věci přikládal větší význam, než Rudd očekával, vždyť většina jejich komunikace probíhala prostřednictvím telefonu na jeho stole. Oficiální státní návštěva byla pouhou podívanou, ale jistě příjemnou. \n\nKdyž se sešli v Hyderabad House k projednání dohody, vojenské partnerství bylo okamžitě vyjasněno a samozřejmě se na něm shodli. Poté začala skutečná jednání. Jakmile byla zmíněna Čína, tón v konferenční místnosti se změnil. Na téma Číny byste našli smířlivější dav i mezi tchajwanskou delegací než zde. \n\nRudd se je během následujících hodin snažil co nejlépe přivést k této myšlence, ale nejvíce, čeho dosáhl, byl příslib, že hospodářskou unii zváží „poté, co se ostatní země dohodnou na spolupráci s Čínou“, což bylo v podstatě odmítnutí. Oficiálně však Rudd prohlásil, že je přivedl k jednacímu stolu." # todo: NEW TRANSLATION
 address_the_tiger_event_ast.1.a: "A to stačilo." # todo: NEW TRANSLATION
 legislation_rudd_blocked.1.t: "Legislativa zablokována v Senátu" # todo: NEW TRANSLATION
 legislation_rudd_blocked.1.d: "Zdá se, že celá Liberální strana stojí proti našemu návrhu. Vytahují na nás všechno možné a dokonce získali na svou stranu řadu nezávislých poslanců. Za těchto podmínek návrh neprosadíme a pokud při opětovném předložení nedokážeme získat potřebnou podporu, legislativa v Senátu skončí. \n\nObvykle budeme muset tři měsíce počkat, než ji bude možné znovu předložit. Během této doby bychom mohli využít svůj vliv k zajištění dalších hlasů a získání většiny, jakkoli nepravděpodobně to zní. K Liberálům se možná přiblížit nedokážeme, ale Zelení by mohli být našim reformám nakloněni, pokud jsme je dosud nezískali, a nezávislí členové se mohou přiklonit na kteroukoli stranu." # todo: NEW TRANSLATION
 legislation_rudd_blocked.1.a: "Tak tohle je konec spolupráce napříč stranami..." # todo: NEW TRANSLATION
 legislation_rudd_blocked.2.t: "Druhé hlasování" # todo: NEW TRANSLATION
 legislation_rudd_blocked.2.d.a: "Navzdory našemu úsilí liberální většina stále drží. Přes všechny jejich procesní průtahy a požadavky na změny jsme se přesto dostali k hlasování, v němž jsme prohráli poměrem 34 ku 42. Zdá se, že všichni nezávislí se přidali k Liberálům a Zelené jsme nedokázali dostatečně nalákat, aby hlasovali s námi. \n\nNejsme však zcela bez možností. Mohli bychom požádat o dvojí rozpuštění, tedy rozpustit Sněmovnu i Senát a vyvolat předčasné volby. Jde o velmi riskantní manévr a pokud nebude načasování správné, mohli bychom přijít o mandáty. Zároveň to může být jediný způsob, jak získat křesla potřebná pro většinu. \n\nNaposledy k němu došlo v roce 1987 a Gillardová nám důrazně doporučila se mu vyhnout. Vždy můžeme počkat do příštích voleb. Možnost je však k dispozici, pokud jej chceme využít ještě před nimi." # todo: NEW TRANSLATION
 legislation_rudd_blocked.2.d.b: "Navzdory našemu úsilí liberální většina v Senátu stále drží. Přes všechny jejich procesní průtahy a požadavky na změny jsme se přesto dostali k hlasování, v němž jsme těsně prohráli poměrem 37 ku 39 díky podpoře Zelených. Zdá se, že všichni nezávislí se přidali k Liberálům. \n\nNejsme však zcela bez možností. Mohli bychom požádat o dvojí rozpuštění, tedy rozpustit Sněmovnu i Senát a vyvolat předčasné volby. Jde o velmi riskantní manévr a v současnosti zaostáváme o několik bodů oproti předchozím volbám. Další volby tak brzy by nás mohly připravit o premiérský úřad. Mohou být také jediným způsobem, jak získat většinu. \n\nNaposledy k němu došlo v roce 1987 a Gillardová nám důrazně doporučila počkat do dalšího období. Možnost je však k dispozici, pokud jej chceme využít nyní, dokud máme momentum." # todo: NEW TRANSLATION
 legislation_rudd_blocked.2.a: "Je čas jednat." # todo: NEW TRANSLATION
 legislation_rudd_blocked.2.b: "Je to příliš riskantní." # todo: NEW TRANSLATION
 legislation_rudd_blocked.3.t: "Dvojité rozpuštění" # todo: NEW TRANSLATION
 legislation_rudd_blocked.3.d: "Nyní, když domino padlo a bylo spuštěno rozpuštění, budou vypsány předčasné volby. První překážka je za námi, takže se musíme soustředit na kampaň. Naše strana si v průzkumech vede stabilně, ale Liberálové by mohli získat veřejnost na svou stranu, pokud jim to dovolíme. V současnosti je vede Tony Abbott, jeden z našich nejzarytějších kritiků. Dosud se nijak neomezoval, takže bychom se neměli zdráhat úder opětovat. \n\nDo voleb zbývá 60 dní. Pokud chceme získat náskok, musíme udržet zemi pod kontrolou a pokračovat v kampani." # todo: NEW TRANSLATION
 legislation_rudd_blocked.3.a: "Tlak sílí." # todo: NEW TRANSLATION
 legislation_rudd_blocked.4.t: "Vítězství" # todo: NEW TRANSLATION
 legislation_rudd_blocked.4.d.a: "Rudd se sesunul do křesla a s úlevou si povzdechl. Zákon prošel. Konečně bylo po všem. Zbytek Labouristické strany a Zelení propukli v potlesk. Druhá strana sálu místo toho seděla se založenýma rukama, ale v první řadě Rudd zahlédl Malcolma Turnbulla, jak na něj přímo hledí, a přísahal by, že se Malcolm usmíval. \n\nUc ítil poplácání po zádech, a když se otočil, spatřil Gillardovou, jak se na něj usmívá. I ona musela uznat, že to byl pro stranu úspěch. Strana konečně dělala něco skutečně velkého a její zásah do bezdomovectví bude opravdu něco znamenat. Labouristé se konečně stali stranou reforem. Možná to nevydrží, ale dnes vyhráli první bitvu. \n\nOtřel si pot z čela a vstal, aby se přidal ke stranickému potlesku. Bylo načase si to užít, dokud to trvá." # todo: NEW TRANSLATION
 legislation_rudd_blocked.4.d.b: "Rudd se sesunul do křesla a s úlevou si povzdechl. Zákon prošel. Konečně bylo po všem. Zbytek Labouristické strany a Zelení propukli v potlesk. Druhá strana sálu místo toho seděla se založenýma rukama, ale v první řadě Rudd zahlédl Malcolma Turnbulla, jak na něj přímo hledí, a přísahal by, že se Malcolm usmíval. \n\nUc ítil poplácání po zádech, a když se otočil, spatřil Gillardovou, jak se na něj usmívá. I ona musela uznat, že to byl pro stranu úspěch. Kolik let těžařské korporace znemožňovaly skutečné reformy, a přesto nyní zaplatí svůj díl. Pomlouvačné kampaně budou bezpochyby ještě několik měsíců pokračovat, ale dnes vyhrál první bitvu. \n\nOtřel si pot z čela a vstal, aby se přidal ke stranickému potlesku. Bylo načase si to užít, dokud to trvá." # todo: NEW TRANSLATION
 legislation_rudd_blocked.4.d.c: "Rudd se sesunul do křesla a s úlevou si povzdechl. Zákon prošel. Konečně bylo po všem. Zbytek Labouristické strany a Zelení propukli v potlesk. Druhá strana sálu místo toho seděla se založenýma rukama, ale v první řadě Rudd zahlédl Malcolma Turnbulla, jak na něj přímo hledí, a přísahal by, že se Malcolm usmíval. \n\nUc ítil poplácání po zádech, a když se otočil, spatřil Gillardovou, jak se na něj usmívá. I ona musela uznat, že to byl pro stranu úspěch. Labouristé plnili své sliby. Austrálie bude zemí, která se chopí příležitosti, když to žádná jiná neudělá. Budoucí generace budou díky nám zajištěné. \n\nOtřel si pot z čela a vstal, aby se přidal ke stranickému potlesku. Bylo načase si to užít, dokud to trvá." # todo: NEW TRANSLATION
 legislation_rudd_blocked.4.a: "Zasloužené." # todo: NEW TRANSLATION
 approach_parties_rudd.1.t: "Navazování kontaktu s Liberály" # todo: NEW TRANSLATION
 approach_parties_rudd.1.d: "Liberal Party a Nationals jsou v současnosti zjevně odhodláni držet strategii „ne, bez výjimky“, údajně na protest proti tomu, že jsme nebyli zahrnuti do plánování. Kdyby bylo po jejich, návrh zákona by byl zcela vyprázdněn. Bez ohledu na to nyní odmítají pracovat na jakýchkoli pozměňovacích návrzích." # todo: NEW TRANSLATION
 approach_parties_rudd.1.a: "Nelze vyhrát všechny bitvy." # todo: NEW TRANSLATION
 approach_parties_rudd.2.t: "Usmiřování Zelených" # todo: NEW TRANSLATION
 approach_parties_rudd.2.d: "Jediným problémem při získávání podpory Zelených byly jejich požadavky. Na tak malou stranu byla jejich schopnost působit nám potíže značná. Pokud bychom se nedohodli, hlasovali by na protest proti návrhu, a trvali na posílení už tak kontroverzního zákona. Využili jsme všechny možnosti ke sjednání kompromisů a oni souhlasili s podporou v podstatě stejného návrhu, jen s několika drobnými dodatky." # todo: NEW TRANSLATION
 approach_parties_rudd.2.a: "Doufejme, že dodrží slovo." # todo: NEW TRANSLATION
 approach_parties_rudd.3.t: "Ti zvenčí" # todo: NEW TRANSLATION
 approach_parties_rudd.3.d: "Senátor za Democratic Labour Party i nezávislý Nick Xenophone byli k podpoře návrhu obtížně přesvědčitelní. Nick byl od začátku obzvlášť kritický vůči naší vládě a jejich hlasovací historie se většinou přikláněla k Liberálům, ale poté, co jsme jim slíbili spolupráci na budoucích pozměňovacích návrzích, souhlasili s podporou zákona." # todo: NEW TRANSLATION
 approach_parties_rudd.3.a: "Vynikající." # todo: NEW TRANSLATION
 mad_katter_ast.1.t: "Šílený Katter" # todo: NEW TRANSLATION
 mad_katter_ast.1.d: "Bob Katter byl de facto králem severního Queenslandu, jehož obyvatele zastupoval téměř 20 let. Byl politikem bouřlivákem v každém smyslu toho slova a rozhodně nebyl obyčejný. Ani tím, jak se oblékal, ani svými názory a už vůbec ne tím, jak mluvil. Když Katter upoutal vaši pozornost, vydali jste se na cestu, u níž nebylo jisté, kam povede. \n\nSchůzku zahájili předstíráním spolupráce na novém zákonu, ale Katter brzy odbočil k útrapám zemědělců a dovozu banánů. Nakonec se značně rozrušil a Rudd ho musel uklidnit. Bylo zřejmé, že ho hluboce zasahují lidské dopady pokračujícího sucha. \n\nRudd nedokázal rozhodnout, zda je ten muž socialista, konzervativec, nebo snad podivná směs obojího. Tak či tak měli v úmyslu najít způsob, jak zemědělcům pomoci." # todo: NEW TRANSLATION
 mad_katter_ast.1.a: "To je to nejmenší, co můžeme udělat." # todo: NEW TRANSLATION
 whispers_in_the_crowd_ast.1.t: "Šepot v davu" # todo: NEW TRANSLATION
 whispers_in_the_crowd_ast.1.d: "Kevin Rudd si už zvykl na poměry v parlamentní budově. Na to, jak se status quo určí během jediného odpoledne a nic nezůstane trvalé. Nyní, když se věci naplno rozběhly, cítil se s tempem vlády dobře, něco se však od jeho nástupu do úřadu změnilo a začínalo ho to vyčerpávat. \n\nZdálo se, že vychází téměř se všemi členy své vlády, ale občas měl pocit, že jejich dobrá vůle slábne. Zatímco dříve plnili jeho příkazy bez váhání, nyní o něm stále častěji pochybovali. Musel stále více vysvětlovat své důvody, což zpochybňovalo směřování jeho politiky. \n\nNebyl snad paranoidní? Možná. Třeba je jen tížila vše, co se kolem nich dělo. Kromě toho své vládě stále důvěřoval, že udrží stranu v chodu. \n\nRudd to setřásl a pokračoval v práci. Pravděpodobně o nic nešlo." # todo: NEW TRANSLATION
 whispers_in_the_crowd_ast.1.a: "Nebo snad ano?" # todo: NEW TRANSLATION
 mining_smear_campaign_ast.1.t: "Mediální kampaň" # todo: NEW TRANSLATION
 mining_smear_campaign_ast.1.d: "Mediální pomlouvačná kampaň je nyní v plném proudu, protože velké těžařské korporace zjistily, co chystáme. Desítky různých reklam zaplavují každý kanál i vlnovou délku. Bannery lemují silnice. Místo aby zaplatily svůj díl, utrácejí miliony za očerňování naší vlády. Ne všechno se uchytilo, ale když ano, poškozuje to naši schopnost vládnout a veřejné mínění se zhoršuje. \n\nKoalice už naskakuje na tento vlak a kritizuje nás. Pokud to brzy nezvládneme udržet pod kontrolou, všechno se jen zhorší." # todo: NEW TRANSLATION
 mining_smear_campaign_ast.1.a: "Nic moc." # todo: NEW TRANSLATION
 corruption_outcome_aus.1.t: "Ruka přistižená ve sklenici" # todo: NEW TRANSLATION
 corruption_outcome_aus.1.d: "Výsledky našeho nedávného stranického vyšetřování nám poskytly dostatek munice k tomu, abychom navždy, nebo alespoň prozatím, uzavřeli stranu před zahraničním vlivem. Objevilo se však i několik zjištění, která nesouvisela se zasahováním zájmových skupin, a ta vrhají na naši stranu špatné světlo. \n\nZatím se neobjevilo nic, co by bylo možné spojit přímo s námi, ale veřejnost kvůli tomu ztratí část důvěry. Do doby, než opustíme střed pozornosti, si budeme muset dávat pozor." # todo: NEW TRANSLATION
 corruption_outcome_aus.1.a: "Ups!" # todo: NEW TRANSLATION
 aus_gillard_overthrow.1.t: "Zaklepání na dveře" # todo: NEW TRANSLATION
 aus_gillard_overthrow.1.d: "Rudd právě procházel obvyklé dokumenty ve své kanceláři, když se ozvalo zaklepání na dveře. Vzor poznal, a tak si nechal zavolat Julii Gillardovou, která vešla pomalu, ale odhodlaně. Na rozdíl od obvyklého postupu zůstala stát a poté, co k ní Rudd vzhlédl, mu oznámila novinu. \n\nRuddovi připadalo, jako by se stěny kanceláře kolem nich hroutily dovnitř. Jak pokračovala, jeho svět se rozpadal a on mohl jen šokovaně sledovat, jak mu zasazuje dýku. Gillardová se chystala vyvolat hlasování o vedení strany. Nemohl tomu uvěřit — jeho vlastní zástupkyně ho svrhla, nemluvě o někom, koho považoval za přítelkyni. To nejhorší však ještě nebylo za ním. Požadovala jeho rezignaci. \n\nVe všech ohledech kromě písemného potvrzení už byl sesazen, ale nabízela mu možnost zachovat si tvář a vyhnout se procesu v parlamentu. Když vyjmenovávala všechny členy vlády, kteří ji podporovali, Rudd si uvědomil, že obrátila každého jeho spojence. Nyní byl ve straně sám." # todo: NEW TRANSLATION
 aus_gillard_overthrow.1.a: "Byl konec." # todo: NEW TRANSLATION
 aus_gillard_overthrow.2.t: "Úsvit" # todo: NEW TRANSLATION
 aus_gillard_overthrow.2.d: "Před pódiem venku se shromáždily kamery a čekaly na oznámení. Tou dobou už všichni věděli, co se děje. Jakákoli zpráva z parlamentu se šířila rychle a převrat se plánoval už nějakou dobu. Do příštího rána bylo po všem a reportéři rozpačitě čekali na okamžik, kdy se dveře konečně otevřely a [GetASTLeaderTitle] vyšel ven se svou rodinou. \n\n\"Australský lid mě zvolil [GetASTLeaderTitle] této země, abych všem Australanům vrátil férovou šanci, a udělal jsem pro to naprosté maximum, dal jsem do toho úplně všechno. V tomto duchu jsem hrdý na úspěchy, kterých jsme dosáhli, aby byla tato země spravedlivější.\" \n\nOči se mu začínaly plnit slzami. Možná byl Rudd správným [GetASTLeaderTitle] ve špatnou dobu. Jen málo mohl udělat, aby zabránil tomu, co se měnilo v kolotoč ve straně, kde se sesazení stávala smutnou normou. \n\n \"Byly to velmi rušné dva a půl roku. Dali jsme do toho úplně všechno a věřím, že až se ohlédneme zpět, tyto reformy přetrvají do budoucna a učiní z Austrálie, věřím, spravedlivější a lepší místo, než jakým by jinak byla.\" \n\nZ jejich strany zazněl potlesk a Rudd zamával na rozloučenou. Nezbývalo mu než doufat, že měl pravdu a že jeho práce na změně věcí přetrvá." # todo: NEW TRANSLATION
 aus_gillard_overthrow.2.a: "Sbohem, milý princi." # todo: NEW TRANSLATION
 the_new_look_rudd.1.t: "Nový vzhled" # todo: NEW TRANSLATION
 the_new_look_rudd.1.d: "Jak se do jeho každodenního života začal znovu vkrádat ruch volební sezóny, Rudd zjistil, že má mnohem méně času pečovat o svůj vzhled. Nebylo neobvyklé, že zůstával přes noc v parlamentu, procházel návrhy a vyřizoval obvyklou agendu, jen aby byl následující den opět na předvolebních cestách. \n\nDnes se nacházel daleko od hlavního města, ve vlastním volebním obvodu Griffith v Queenslandu. Slunce sotva vyšlo, a on už procházel poznámky a vychutnával si klid, než všichni vstanou. V posledních dnech to byla vzácnost. Jako na zavolanou však klid přerušilo otevření dveří s moskytiérou karavanu a objevil se udýchaný Anthony Albanese. \n\nAnthony byl zavalitý a poněkud nemotorný muž, ale ještě nedávno spolu bojovali o vedení strany a Rudd se postaral, aby na to nikdy nezapomněl. Anthony se dovnitř potácel a postavil kávu na stůl vedle Rudda, který mu poděkoval kývnutím. \n\n\"Sakra, vypadáš zarostle.\" Ukázal na Ruddovu bradu. Rudd se jí dotkl a uvědomil si, že se dva nebo tři dny neholil a jeho bílé strniště se změnilo v vousy. \n\n\"Zdá se, že ano. Jak vypadám?\" \n\n\"Tedy, není to špatné. Voliče to možná překvapí,\" řekl Anthony s uchechtnutím. \n\n\"Hmm. Asi nechci vypadat neupraveně.\" \n\n\"Nevím. Třeba se jim to bude líbit.\"" # todo: NEW TRANSLATION
 the_new_look_rudd.1.a: "Tak si je nechám." # todo: NEW TRANSLATION
 the_new_look_rudd.1.b: "Je čas se oholit." # todo: NEW TRANSLATION
 rudd_the_next_leader.1.t: "Budoucnost strany" # todo: NEW TRANSLATION
 rudd_the_next_leader.1.d: "V životě každého vůdce nastane chvíle, kdy musí myslet na další generaci. Julia Gillardová nebyla ve srovnání s Ruddem o tolik mladší, ale mohla se velmi dobře stát budoucností strany. Podle dohody, kterou uzavřeli před volbami v roce 2007, Rudd Gillardové slíbil, že jednou odstoupí a umožní jí kandidovat po něm. \n\nPro Rudda byla tato odpovědnost těžká, Gillardová ho však dosud nezklamala. Byla obchodní stránkou strany. Zdálo se neobvyklé, aby její obavy z rozpočtových schodků a hospodářského růstu zůstaly nevyslovené, a její plány na celostátní reformu těžebního průmyslu vzbudily Ruddův zájem. Zjevně jí na tom dost záleželo. Ať už byla pro tuto práci vhodná, nebo ne, Rudd se jednou bude muset rozhodnout." # todo: NEW TRANSLATION
 rudd_the_next_leader.1.a: "Stojí to za zvážení." # todo: NEW TRANSLATION
 rudd_the_next_leader.1.b: "Nikdy!" # todo: NEW TRANSLATION
 rudd_the_next_leader.2.t: "Odstoupení" # todo: NEW TRANSLATION
 rudd_the_next_leader.2.d: "\"Tato země, která dokáže pokojně zvládat své politické rozdíly a řešit svou politiku pokojně a civilizovaně — proto je tato země tak skvělá. V této úžasné tapisérii moderní Austrálie, v mozaice našeho multikulturního národa, která vytváří z rozmanitosti takovou jednotu, spočívá velký australský zázrak.\" \n\n\"Australský lid si podle mého názoru zaslouží nový začátek pod naším vedením. Vím, že pro některé z vás to nebude vítaná zpráva, ale mou odpovědností bylo udržet Labouristy jako bojovou sílu pro budoucnost, abychom se mohli sjednotit za příští vůdkyní naší strany, Julií.\" \n\n\"Přátelé, po nějakou dobu neuslyšíte můj hlas ve veřejných záležitostech tohoto národa.\" \n\n\"Bylo mi ctí sloužit vám jako [GetASTLeaderTitle] a jako vůdce vaší strany, ale přichází chvíle, kdy víte, že jste do toho dali všechno, a chvíle, kdy strana musí kvůli budoucnosti dále obnovit své vedení.\"" # todo: NEW TRANSLATION
 rudd_the_next_leader.2.a: "\"Pro mě ta chvíle nastala právě teď.\"" # todo: NEW TRANSLATION
 rudd_campaigning_round_two.1.t: "Kolem konferenčního centra" # todo: NEW TRANSLATION
 rudd_campaigning_round_two.1.d: "Když Rudd kráčel uličkou na národní konferenci Labouristické strany, dav se dostával do varu. Dokonce tam byl i veterán strany Paul Keating, aby mu fandil, což celé události dodávalo snový nádech. Jako by nikdy neodešel. Poslední roky byly jen zlým snem a nyní se probudil za potlesku svých kolegů. Těch samých, kteří tleskali jeho pádu. \n\nBylo zvláštní, jak nestálá politika dokázala být. S veřejností i lidmi ve vlastní straně jste byli neustále na ostří nože. Přesto jim potřásal rukama, pokud to znamenalo získat jejich podporu pro příští volby. Všechno bylo příliš nejisté na to, aby se člověk cítil pohodlně. \n\nK získání dalšího mandátu by potřeboval zázrak, ale ještě nebylo po všem a Rudd do toho dá všechno." # todo: NEW TRANSLATION
 rudd_campaigning_round_two.1.a: "Jsme zpět a zůstaneme tu." # todo: NEW TRANSLATION
 gillard_gov_event.1.t: "Nový směr" # todo: NEW TRANSLATION
 gillard_gov_event.1.d: "V malé konferenční místnosti pronesla Julia Gillardová svůj první tiskový projev jako [GetASTLeaderTitle]. Reportéři i kolegové politici se shromáždili, aby ji slyšeli, a netrpělivě čekali na program, který se chystala představit. Teď na ní skutečně spočívala veškerá tíha. Měsíce práce vedly k tomuto přesnému okamžiku, všechny karty musely být pečlivě rozloženy a členové vlády získáni pro podporu. To vše proto, aby se dostala právě sem. \n\nGillardová byla nyní jednou z nejmocnějších žen na světě, a přesto její pozice nikdy nepůsobila nejistěji. Každá její chyba by byla opozicí, médii nebo kýmkoli, kdo by pochyboval o její odhodlanosti zastávat úřad, celé dny podrobně zkoumána a rozebírána. Každý krok musel být učiněn opatrně. \n\nSchválení jakékoli rozumné politiky mělo být odloženo, dokud nebude možné vypsat volby, což mělo být brzy. Do té doby musela vypadat jako vůdkyně a doufat, že veřejnost uvěří, že tuto práci zvládne." # todo: NEW TRANSLATION
 gillard_gov_event.1.a: "Máte nějaké otázky?" # todo: NEW TRANSLATION
 papua_residency_ast.1.t: "Austrálie nabízí hospodářský pakt" # todo: NEW TRANSLATION
 papua_residency_ast.1.d: "Ve snaze posílit regionální hospodářské vztahy se australská vláda obrátila na nás s návrhem obchodní dohody „bez cel“. Návrh zahrnuje zmírnění omezení pro naše zboží a služby výměnou za vzájemná výhradní práva na těžbu nerostných surovin. Oba naše národy mohou z výrazně většího toku zboží mezi nimi značně prosperovat, volba však zůstává na nás." # todo: NEW TRANSLATION
 papua_residency_ast.1.a: "Samozřejmě v jejich prospěch!" # todo: NEW TRANSLATION
 papua_residency_ast.1.b: "Ne, děkujeme." # todo: NEW TRANSLATION
 papua_residency_ast.2.t: "Hospodářská integrace Papuy" # todo: NEW TRANSLATION
 papua_residency_ast.2.d: "Papua-Nová Guinea souhlasila s navrhovaným paktem, který má prostřednictvím obchodu propojit naše ekonomiky. Jednání se dokončují a umožní bezcelní obchod s papuánským zbožím a službami, zjednodušené investice a přednostní práva na zdroje na obou stranách. Oceánie je o krok blíže regionální hospodářské unii." # todo: NEW TRANSLATION
 papua_residency_ast.2.a: "Vynikající." # todo: NEW TRANSLATION
 papua_residency_ast.3.t: "Neúspěšné spojení s Papuou" # todo: NEW TRANSLATION
 papua_residency_ast.3.d: "Papua-Nová Guinea bohužel pakt odmítla a dává přednost zachování našich současných obchodních vztahů." # todo: NEW TRANSLATION
 papua_residency_ast.3.a: "Zklamání." # todo: NEW TRANSLATION
 indo_ast_trade_deal.1.t: "Austrálie navrhuje obchodní dohodu" # todo: NEW TRANSLATION
 indo_ast_trade_deal.1.d: "Ve snaze oteplit naše chladné vztahy navrhla Austrálie dohodu o volném obchodu s příslibem budoucí vojenské spolupráce. Dohoda by nyní zajistila hladký tok zboží a služeb mezi námi a velmi pravděpodobně přinesla hospodářský prospěch, vojenská část je však poměrně neurčitá." # todo: NEW TRANSLATION
 indo_ast_trade_deal.1.a: "Spravedlivý návrh." # todo: NEW TRANSLATION
 indo_ast_trade_deal.1.b: "Ne, děkujeme." # todo: NEW TRANSLATION
 indo_ast_trade_deal.2.t: "Dobré zprávy od Rudda" # todo: NEW TRANSLATION
 indo_ast_trade_deal.2.d: "Kevin Rudd se vrátil z Indonésie s příznivými výsledky. Indonésie pozitivně reagovala na dohodu o volném obchodu pod podmínkou, že naše ADF se zaváže ke společnému bezpečnostnímu úsilí. S Indonésany už jsme spolupracovali na protiteroristických opatřeních, takže by nešlo o nic nového, a požadavek zůstal záměrně otevřený, což nám v budoucnu umožní závazky vymezit. Prozatím dohoda příjemně podpoří obchod mezi našimi národy." # todo: NEW TRANSLATION
 indo_ast_trade_deal.2.a: "Skvělé." # todo: NEW TRANSLATION
 indo_ast_trade_deal.3.t: "Indonésie odmítá obchodní nabídku" # todo: NEW TRANSLATION
 indo_ast_trade_deal.3.d: "Vláda v Jakartě pakt bohužel odmítla, na Ruddovo úsilí reagovala chladně a dala přednost zachování našich současných obchodních vztahů." # todo: NEW TRANSLATION
 indo_ast_trade_deal.3.a: "Nic moc, ale možná se to dalo čekat." # todo: NEW TRANSLATION
 forming_government_gil.1.t: "Vyberte si svůj jed" # todo: NEW TRANSLATION
 forming_government_gil.1.d: "Výsledky voleb jasně ukázaly, že pokud chceme zůstat u moci, musíme vytvořit koaliční vládu. Opozice se nyní rychle snaží získat vlastní křesla ve Sněmovně. Levicová frakce strany nás povzbuzuje, abychom uzavřeli pakt se Zelenými. Už jsme s nimi spolupracovali a zdají se být ochotní, někteří z našich konzervativních členů však váhají zajít tak daleko a Zelení pravděpodobně přijdou s vlastními požadavky. \n\nNa druhou stranu nás oslovilo několik liberálních přeběhlíků s podporou části našeho programu a jsou ochotni připojit se ke koalici. S podporou bývalých Liberálů můžeme před širokou veřejností působit více nadstranicky. Vzhledem k výsledkům voleb nemusí být špatnou volbou vypadat více středově." # todo: NEW TRANSLATION
 forming_government_gil.1.a: "Spojme se se Zelenými" # todo: NEW TRANSLATION
 forming_government_gil.1.b: "Koalice Liberálů a Labouristů tedy bude." # todo: NEW TRANSLATION
 gillard_gov_event.2.t: "Sestavení vlády" # todo: NEW TRANSLATION
 gillard_gov_event.2.d: "Vláda se rýsovala jako poměrně schopná skupina nejlepších Labouristů, přinejmenším podle Juliina názoru, a co bylo důležitější, jako skupina loajální. Wayne Swan, nový místopředseda [GetASTLeaderTitle], souhlasil se schůzkou s Gillardovou, aby projednali sestavení ministerstva zahraničí. \n\nKdyž se setkali v její kanceláři, Gillardová vysvětlila, že se chce mnohem více soustředit na domácí otázky národa a nechat ministerstvo zahraničí, aby se řídilo samo. Společně prošli možnosti a byly tu dvě zřejmé volby. Stephen Smith byl první, kdo novému [GetASTLeaderTitle] nabídl své služby. Dříve působil za Keatinga a od té doby zůstal loajálním Labouristou. Swan si byl jistý, že Smith bude držet stranickou linii a víceméně nás udrží na správné cestě. \n\nDruhou možností byl Bob Carr. Carr byl ve skutečnosti nějakou dobu mimo parlament a pracoval jako poradce, přičemž díky svým ohnivým veřejným debatám získával na popularitě. Jeho politika směřovala k odvážnější variantě a jeho nominace by bezpochyby zanechala stopu, pokud právě o to Julia usilovala. Stále však byl čas se rozhodnout a při všem, co se dělo, nebylo třeba spěchat s obnovením zahraničních aktivit." # todo: NEW TRANSLATION
 gillard_gov_event.2.a: "Je o čem přemýšlet." # todo: NEW TRANSLATION
 forced_adoptions_gillard.1.t: "Gillardova vláda řeší nucené adopce" # todo: NEW TRANSLATION
 forced_adoptions_gillard.1.d: "[GetASTLeaderTitle] Julia Gillardová dnes večer pronesla celostátní omluvu za historické vládní politiky z let 1950 až 1975, které vynutily odloučení tisíců domorodých matek od jejich dětí. \n\n\"Uznáváme hluboké dopady těchto politik a postupů na otce a uvědomujeme si bolest, kterou tyto činy způsobily bratrům a sestrám, prarodičům, partnerům a širším rodinám,\" řekla Gillardová publiku čítajícímu více než 800 lidí v parlamentní budově, z nichž mnozí plakali. \n\nOdhaduje se, že 100 000 až 150 000 kojenců bylo násilně nebo nátlakem odebráno matkám, většinou mladým neprovdaným ženám." # todo: NEW TRANSLATION
 forced_adoptions_gillard.1.a: "Naše srdce jsou s nimi." # todo: NEW TRANSLATION
 let_debate_decide_gillard.1.t: "Zákon o manželství osob stejného pohlaví zamítnut" # todo: NEW TRANSLATION
 let_debate_decide_gillard.1.d: "V nepříliš překvapivém výsledku Sněmovna reprezentantů drtivě hlasovala proti zákonu o manželství osob stejného pohlaví. Poměrem 98 ku 42 byl návrh zamítnut. Program naší strany se tomuto konceptu obvykle stavěl na odpor a většina reakcí se nesla v duchu obvyklé obrany tradičních hodnot a podobně. Už jsme sklidili značnou kritiku od progresivních voličů na internetu a bezpochyby se to přelije do příštích voleb." # todo: NEW TRANSLATION
 let_debate_decide_gillard.1.a: "No teda." # todo: NEW TRANSLATION
 let_debate_decide_gillard.2.t: "Prot idiskriminační dodatek prošel Senátem" # todo: NEW TRANSLATION
 let_debate_decide_gillard.2.d: "V překvapivém projevu nadstranické spolupráce prošel náš zákon na ochranu osob stejného pohlaví Sněmovnou i Senátem s drtivou podporou. Dodatek zahrnoval široké ochrany před diskriminací na základě sexuální orientace spolu s programy financovanými Společenstvím, které mají chránit a podporovat zranitelné osoby a poskytovat vzdělávací služby, čímž posílil již existující zákon. \n\nOpoziční představitelé vznesli jen mírné námitky ohledně drobností ve směrnicích, ale z větší části to vypadá na generační vítězství strany. Podpora, kterou už dostáváme od progresivních lidí na internetu, je ohromná." # todo: NEW TRANSLATION
 let_debate_decide_gillard.2.a: "Další vítězství!" # todo: NEW TRANSLATION
 opposition_attacks_ast.1.t: "Opozice pálí ostrými" # todo: NEW TRANSLATION
 opposition_attacks_ast.1.d: "Obvyklá rétorika Tonyho Abbotta byla vždy částečně pobuřující a částečně přehnaná, v poslední době však útoky posunul na novou úroveň. Když se před parlamentní budovou objevila skupina demonstrantů s poměrně „obscénními“ transparenty, Abbott využil příležitosti vyjít ven a mísit se s nimi, přičemž pozval novináře, aby vše natáčeli. \n\nZ toho, co mohlo zůstat okrajovým shromážděním, se stala natolik sledovaná událost, že noviny nyní otiskují titulky „ZHASNĚTE ČARODĚJKU“ a některé dokonce „UPALTE TU DĚVKU“. Je to sprosté i na Abbotta a nyní se toho chápají média Newscorp." # todo: NEW TRANSLATION
 opposition_attacks_ast.1.a: "To je tedy skvělé." # todo: NEW TRANSLATION
 opposition_attacks_ast.2.t: "Abbott vyráží na mediální turné a haní naši vládu" # todo: NEW TRANSLATION
 opposition_attacks_ast.2.d: "Tony Abbott opět upoutal pozornost, tentokrát jen proto, aby kritizoval naši politiku. Nedávno v pořadu Today Show neustále mluvil o neproveditelnosti našeho rozpočtového plánování a označil je za „plýtvání“, „hloupé“ a přidal obvyklé narážky. Nezasáhlo by nás to tak silně, kdyby nás průzkum Newspoll z předchozího dne neoznačil za méně preferovanou vládu — v průzkumech jsme za Abbottem zaostávali o pět bodů. Jak naše podpora klesá, cokoli odpovíme, nemá příliš pevnou půdu pod nohama." # todo: NEW TRANSLATION
 opposition_attacks_ast.2.a: "Nemůžeme si snad na chvíli oddechnout?" # todo: NEW TRANSLATION
 ast_fm_rudd_focus.5.t: "Kevin Rudd opouští vládu" # todo: NEW TRANSLATION
 ast_fm_rudd_focus.5.d: "Během tiskové konference ve Washingtonu, D.C., Rudd před přítomnými zřejmě oznámil, že formálně odstoupí z funkce našeho ministra zahraničí. Pro přítomné to byl šok a pro naši vládu to jistě nevypadá dobře, ještě horší však bylo, když nás Rudd následně obvinil ze svého rozhodnutí. Tvrdil, že neměl naši podporu. \n\nJe velmi pravděpodobné, že při nejbližší příležitosti se Rudd pokusí vyvolat hlasování o vedení strany. Ve straně se už mluví o rozkolu, takže musíme být připraveni na cokoli. Prozatím budeme potřebovat nového ministra zahraničí." # todo: NEW TRANSLATION
 ast_fm_rudd_focus.5.a: "Nedostatek podpory? Vždyť jsme ho vybrali my!" # todo: NEW TRANSLATION
 opposition_attacks_ast.3.t: "Zprávy Petera Slippera" # todo: NEW TRANSLATION
 opposition_attacks_ast.3.d: "Náš současný předseda Sněmovny Peter Slipper čelí v poslední době kritice poté, co byly v rámci soudního řízení proti němu zveřejněny stovky jeho soukromých zpráv. Peter byl dříve členem Liberal Party, ale přešel k nám jako nezávislý. Zprávy jsou dost špatné, byť jde o osobní záležitost předsedy, Liberálové nás nyní vykreslují jako sexisty, protože jsme Petera okamžitě neodvolali. \n\nTony Abbott proti nám shromáždil hlasování o nedůvěře, pokud Petera Slippera neodvoláme, jinak máme příležitost bránit se ve sněmovně. Zprávy nejsou nic příjemného, ale sotva jsou horší než obvyklé poznámky Liberálů a neuškodilo by říct Abbottovi, co si o tom myslíme." # todo: NEW TRANSLATION
 opposition_attacks_ast.3.a: "Pusťme se do toho ve sněmovně." # todo: NEW TRANSLATION
 opposition_attacks_ast.3.b: "Odvolat Slippera." # todo: NEW TRANSLATION
 opposition_attacks_ast.4.t: "Gill ardové projev o misogynii získává virální podporu" # todo: NEW TRANSLATION
 opposition_attacks_ast.4.d: "Během včerejšího bouřlivého dne parlamentních debat se [GetASTLeaderTitle] obula do charakteru opozičního vůdce Tonyho Abbotta poté, co napětí kolem Slipperových zpráv dosáhlo bodu zlomu v jejich dlouhodobém sporu. Během hlasování sněmovny o nedůvěře začala Gillardová Abbotta ostře kritizovat za jeho vlastní sexistickou rétoriku posledních let. \n\n\"Nenechám se od tohoto muže poučovat o sexismu a misogynii, to tedy ne. A vláda se nenechá od tohoto muže poučovat o sexismu a misogynii. Ani teď, ani nikdy.\" \n\nGill ardové projev sklidil okamžitě příznivý ohlas nejen po celé zemi, ale i ve světě na internetu. Britské a americké noviny rychle přispěchaly do tohoto politického divadla a podle Telegraphu označily Gillardové „útok na sexismus“ za „drtivý“, ale „brilantní“." # todo: NEW TRANSLATION
 opposition_attacks_ast.4.a: "Jsem rád, že to zabralo." # todo: NEW TRANSLATION
 rudd_events_gillard.1.t: "Kevin Rudd nabízí své služby" # todo: NEW TRANSLATION
 rudd_events_gillard.1.d: "Zatímco stále dokončujeme sestavování vlády, Rudd nás oslovil s nabídkou působit jako náš ministr zahraničí. Není pochyb o tom, že Rudd může být nejzkušenějším a prokazatelně nejefektivnějším ministrem v zahraničních otázkách, a politicky by nám mohlo prospět, kdyby s námi nyní působil někdo z předchozí vlády. Přesto bychom možná měli naši vládu oddělit od té staré, pokud chceme působit jako nová tvář Labouristů." # todo: NEW TRANSLATION
 rudd_events_gillard.1.a: "Vítej na palubě." # todo: NEW TRANSLATION
 rudd_events_gillard.1.b: "Jsme v pořádku, děkujeme." # todo: NEW TRANSLATION
 rudd_events_gillard.2.t: "Drama kolem Q&A" # todo: NEW TRANSLATION
 rudd_events_gillard.2.d: "Donesla se k nám zpráva, že Kevin Rudd nečekaně vystoupil v diskusním pořadu Q+A, kde odpovídal na řadu otázek týkajících se jeho působení ve funkci. Na první pohled nebyl pořad důvodem k obavám, ale několik členů vlády si všimlo „kritického“ tónu, který Rudd zaujal u několika otázek, a obvinil určité „kolegy“, že ho během jeho působení podkopávali. \n\nAť to zní jakkoli nestranně, novináři si to přímo spojují s námi a obviňují členy naší vlády z Ruddova pádu. Bez ohledu na směšnost těchto obvinění nám to v průzkumech přináší další bolesti hlavy." # todo: NEW TRANSLATION
 rudd_events_gillard.2.a: "Dělá to schválně?" # todo: NEW TRANSLATION
 rudd_events_gillard.3.t: "Kevin Rudd vede kampaň" # todo: NEW TRANSLATION
 rudd_events_gillard.3.d: "V poslední době byl Rudd spatřen na místních volbách, kde podporoval další členy Labouristické strany. Strana je samozřejmě za tuto podporu vděčná, Rudd však téměř záměrně dělá celou věc o sobě. Z návštěv vytváří fotografické příležitosti a bere kandidátům pozornost, aby poskytoval vlastní rozhovory. Shromažďuje podporu pro sebe, nikoli pro naši vládu, a možná to funguje. \n\nPodpora Rudda v průzkumech Newspoll roste mnohem rychleji než naše vlastní a pokud jeho malé turné jakkoli zastavíme, mohlo by to situaci jen zhoršit." # todo: NEW TRANSLATION
 rudd_events_gillard.3.a: "Zatraceně, Kevine!" # todo: NEW TRANSLATION
 rudd_events_gillard.4.d: "Rudd byl spatřen v řadě místních volebních obvodů, kde podporoval naše labouristické kandidáty. Pro zkušené členy strany jde o zcela běžnou činnost, až na to, že Rudd se zjevně snaží zdůrazňovat naše politiky a v tisku je obhajovat. \n\nJedna věc je, zda se toho média skutečně chytnou, ale našim výsledkům v průzkumech to dělá zázraky a v nadcházejících státních volbách nám to jistě pomůže." # todo: NEW TRANSLATION
 rudd_events_gillard.4.a: "To je od něj pozorné." # todo: NEW TRANSLATION
 rudd_events_gillard.5.t: "Rudd vystupuje proti naší vládě" # todo: NEW TRANSLATION
 rudd_events_gillard.5.d: "Podle očekávání se Kevin Rudd potají pohybuje po parlamentu a snaží se proti nám poštvat další ministry. Média bohužel zveřejnila „uniklý“ rozhovor, v němž Rudd prohlásil, že nevěří, že naše vláda vyhraje příští volby, a že zvažuje výzvu k vedení strany s vážnou podporou. \n\nJako obvykle jde nejspíš o Kevinův pokus nás znervóznit. Vyvolání hlasování o vedení by ho možná mohlo usadit, ale stojí vůbec za to mu věnovat pozornost?" # todo: NEW TRANSLATION
 rudd_events_gillard.5.a: "Vyhlásit hlasování o vedení." # todo: NEW TRANSLATION
 rudd_events_gillard.5.b: "Je to bouře ve sklenici vody." # todo: NEW TRANSLATION
 rudd_events_gillard.6.t: "Vyhlášeno hlasování o vedení" # todo: NEW TRANSLATION
 rudd_events_gillard.6.d: "Po volbě vedení Labouristické strany byl Kevin Rudd pohodlně poražen poměrem 71 ku 31. Rudd slíbil, že proti nám už žádnou další výzvu nepodnikne a v budoucích hlasováních nás bude podporovat, ať už to má jakoukoli váhu. Výsledek ukazuje, že navzdory všemu za námi strana stále stojí. Tato vláda bude pokračovat ve svém poslání vůči australskému lidu, bez ohledu na to, jak obtížné to bude. Je načase vrátit se do ringu a pokračovat v prosazování naší politiky." # todo: NEW TRANSLATION
 rudd_events_gillard.6.a: "Tak jest!" # todo: NEW TRANSLATION
 rudd_events_gillard.7.t: "Hromadné rezignace ve vládě" # todo: NEW TRANSLATION
 rudd_events_gillard.7.d: "Tři z našich významných členů vlády podali během jediného týdne rezignaci. Můžeme se jen domnívat, že jde o nějaký druh protestu proti naší vládě. V reakci na to odstoupili i nižší členové vlády sympatizující s Ruddem. Situace z hlediska jednoty strany nemůže být horší. Budeme muset rychle najít náhradníky a brzy učinit oznámení, abychom si zachovali tvář. \n\nKdyby k těmto sabotá žím nedocházelo tak často, možná bychom prosazovali skutečné reformy a opravdu se věnovali práci, ke které jsme byli zvoleni." # todo: NEW TRANSLATION
 rudd_events_gillard.7.a: "Jako krysy prchající z potápějící se lodi." # todo: NEW TRANSLATION
 rudd_events_gillard.8.t.a: "Zelení ukončují spojenectví" # todo: NEW TRANSLATION
 rudd_events_gillard.8.t.b: "Bývalí liberální nezávislí se shromažďují kolem [GetASTLeaderTitle]" # todo: NEW TRANSLATION
 rudd_events_gillard.8.d.a: "Uprostřed nedávných odchodů z vlády nová vůdkyně Zelených Christine Milne oznámila, že její strana nás také opustí a alianci rozpustí. Jako důvod uvedli nějakou hokejovou výmluvu kvůli neshodám v politice, ale věděli jsme, že k tomu dříve či později dojde. Labouristé míří do příštích voleb sami." # todo: NEW TRANSLATION
 rudd_events_gillard.8.d.b: "Uprostřed kritiky opozičních stran se nezávislí shromáždili kolem [GetASTLeaderTitle] a tváří v tvář pokračujícímu dramatu hájili politiku naší vlády. Tony Windsor, který byl navzdory pobytu v nemocnici opakovaně před kamerami, dokonce přišel vychvalovat pozitivní reformy, které pomohl prosadit díky podpoře našich čísel ve Sněmovně. Upřímně, už bylo načase, aby nás někdo ocenil." # todo: NEW TRANSLATION
 rudd_events_gillard.8.a: "Typické." # todo: NEW TRANSLATION
 rudd_events_gillard.8.b: "Vítané gesto." # todo: NEW TRANSLATION
 rudd_events_gillard.9.t: "Další výzva k vedení" # todo: NEW TRANSLATION
 rudd_events_gillard.9.d: "Jak se naše postavení v průzkumech zhoršuje, naši kritici v parlamentu vycítili krev jako žraloci a začali připravovat výzvu k vedení. Od poslední výzvy naše podpora výrazně klesla. Navzdory slibu Kevina Rudda se povídá, že pokud bude výzva podána, přihlásí se do hlasování, a bezpochyby už nějakou dobu spřádá plány se svými loajalisty. \n\nNavzdory vítězství v posledním hlasování z toho možná tentokrát nevyvázneme bez šrámů." # todo: NEW TRANSLATION
 rudd_events_gillard.9.a: "Do průlomu." # todo: NEW TRANSLATION
 gillard_goodbye_ast.1.t: "Poslední opona" # todo: NEW TRANSLATION
 gillard_goodbye_ast.1.d: "Na schůzi před hlasováním se Rudd zavázal odejít z politiky, pokud prohraje, ovšem v té chvíli už jeho slovo nemělo skutečnou váhu. Bylo by uspokojivé sledovat, jak pomalu kráčí k obzoru a už nikdy neposkvrní tyto sály. Bohužel jsme takové štěstí neměli. Poměrem 57 ku 45 byl Rudd jasným vítězem. \n\nByla Austrálie skutečně připravena na ženu v čele vlády [GetASTLeaderTitle]? Rozhodně to nedávala najevo, ať už uvnitř parlamentu, nebo mimo něj. Julia náhle přišla o všechno, na čem tak dlouho pracovala, a nebyl ani čas to zpracovat. Z místnosti labouristického klubu zamířili rovnou do konferenční místnosti. \n\nGillardová přednesla svůj poslední projev davu podobnému tomu, který ji sledoval při složení přísahy. Byl krátký a prostý. Gillardová výsledky nezpochybní. Jaký by to mělo smysl? Někdy zahrajete své karty a prohrajete. \n\nA Gillardová nebude uraženou poraženou." # todo: NEW TRANSLATION
 gillard_goodbye_ast.1.a: "Teď už je konec." # todo: NEW TRANSLATION
 gillard_goodbye_ast.2.t: "Poslední hlasování" # todo: NEW TRANSLATION
 gillard_goodbye_ast.2.d: "Během hlasování zůstala Gillardová klidná. Nechtěla jim dopřát uspokojení z pohledu na své obavy. Rudd seděl vzadu v místnosti shrbený. Nemusel nic říkat, jeho samolibost z něj jednoduše vyzařovala. V posledních chvílích ve funkci [GetASTLeaderTitle] Julia zachová důstojnost, jinak by nejraději přešla místnost a vrazila tomu muži pár facek. \n\nHlasování začalo a jména byla pomalu vyvolávána. 47… 51… 55… 63. Konečný výsledek byl 63 ku 39. Gillardová zvítězila. \n\nJejí kabinet povstal a začal za ní tleskat. Sotva se dokázala pohnout, ale přinutila se vstát a přijmout přípitek, zatímco jí hlavou vířily úvahy. Přijala ji konečně strana? V jakémsi posledním protestu povstal a začal tleskat také Kevin Rudd. Před hlasováním se Rudd zavázal, že v případě porážky odejde z politiky. Už ho nikdy nebude muset vidět. \n\nZ místnosti labouristického klubu se rychle přesunuli do nedaleké konferenční místnosti a Gillardová oznámila výsledky s potvrzením, že bude kandidovat v příštích volbách." # todo: NEW TRANSLATION
 gillard_goodbye_ast.2.a: "Je konec?" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.1.t: "Australský návrh obchodu s uranem" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.1.d: "Australská vláda nám předložila hospodářskou dohodu, podle níž by nám ve zvýšeném objemu vyvážela uran výměnou za minimalizaci cel na svůj vývoz k nám. Její vláda souhlasila s obdobným zrušením cel na náš vývoz a s otevřením podmínek širší spolupráci v budoucím obchodu. Dohoda stanoví, že uran nesmí být použit k obohacování na zbrojní úroveň, ale jakmile je ruda na našem území, je to v podstatě na nás." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.1.a: "Plodná dohoda." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.1.b: "Není to v našem zájmu." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.2.t: "India souhlasí s dohodou o uranu" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.2.d: "India souhlasila s novými podmínkami a podepsala obchodní pakt! Můžeme od ní očekávat širokou škálu zboží a služeb ve zvýšeném a zjednodušeném objemu, zatímco ona zruší cla na náš uran. Pro úspěch dohody je zásadní také její souhlas s přijetím standardů Mezinárodní agentury pro atomovou energii (IAEA), které stanovují, že uran nebude použit k obohacování na zbrojní úroveň. Na oplátku s ní budeme spolupracovat na výzkumu energetiky." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.2.a: "Vítězství pro obě strany!" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.3.t: "India odmítá obchodní pakt" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.3.d: "India odmítla naše obchodní nabídky a rozhodla se pokračovat v současných závazcích. [GetASTLeaderTitle] [RAJ.GetLeader] se k výsledku nevyjádřil, ale zdá se, že u jejich vlády nemáme příliš dobré postavení. Je to rozhodně krok zpět pro obchod v Tichomoří a politováníhodné přehlédnutí." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.3.a: "Ztrácíme svůj cit." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.5.t: "Moskva podepisuje pakt" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.5.d: "Vláda v Moskvě souhlasila s našimi obchodními podmínkami a výměnou za zvýšení vývozu uranu k nim zruší řadu cel na naše zboží. Ohledně využití uranu zůstali neurčití, zavázali se však, že jej nepoužijí k obohacování na zbrojní úroveň. Dohoda představuje průlom ve spolupráci, jakého na této úrovni nebylo dosaženo od doby před pádem Berlínské zdi, a zdá se, že chtějí v naší spolupráci pokračovat." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.5.a: "Přineste boršč!" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.6.t: "Moskva odstupuje od jednání" # todo: NEW TRANSLATION
 uranium_trade_deal_ast.6.d: "Rusko odmítlo naše obchodní nabídky a rozhodlo se pokračovat v současných závazcích. Prezident [SOV.GetLeader] se k výsledku nevyjádřil, ale zdá se, že u jejich vlády nemáme příliš dobré postavení. Je to rozhodně krok zpět pro obchod v Tichomoří a politováníhodné přehlédnutí." # todo: NEW TRANSLATION
 uranium_trade_deal_ast.6.a: "Medvěda je nejlepší nechat na pokoji." # todo: NEW TRANSLATION
 rudd_in_korea.1.t: "Dozvuky ze země protinožců" # todo: NEW TRANSLATION
 rudd_in_korea.1.d: "Australský ministr zahraničí s námi prostřednictvím Číny vedl jednání s cílem zlepšit vztahy mezi námi a Jižní Koreou. Tento plán je odvážný a poněkud naivní. Australané požadují, abychom se zavázali k harmonogramu ukončení výroby zbraní dlouhého dosahu, aniž bychom rozebrali jakékoli ze svých současných zbraní, výměnou za zmírnění sankcí a rozvojovou pomoc. Protože naše válka s Jižní Koreou technicky neskončila, nabídli vyřešení sporu na kontrolním stanovišti v demilitarizovaném pásmu. Mohla by to být užitečná propagandistická příležitost." # todo: NEW TRANSLATION
 rudd_in_korea.1.a: "Jedinečná příležitost." # todo: NEW TRANSLATION
 rudd_in_korea.1.b: "Není to v našem nejlepším zájmu." # todo: NEW TRANSLATION
 rudd_in_korea.2.t: "Vítězství Kevina Rudda v Koreji" # todo: NEW TRANSLATION
 rudd_in_korea.2.d: "Kevin Rudd pomalu procházel kontrolním stanovištěm v demilitarizovaném pásmu mezi Severní a Jižní Koreou, kde se setkal se severokorejským vůdcem [KOR.GetLeader] a oba si potřásli rukama. Každý z nich stál na své straně hranice, což znamenalo symbolický skok ve vztazích obou Korejí a dramatickou změnu širšího statu quo v Asii. Rudd poté přešel na druhou stranu a stal se prvním členem australské vlády i bývalým australským vůdcem, který vstoupil do země. \n\nPo čtyřech měsících intenzivních jednání, při nichž si strany předávaly návrhy prostřednictvím Číny, bylo dosaženo průlomu. [NKO.GetLeader] souhlasil s harmonogramem ukončení vývoje zbraní dlouhého dosahu a s vyřešením korejské války, která technicky probíhá od roku 1950, výměnou za zmírnění sankcí a rozvojovou pomoc. Rudd a nejvyšší vůdce později téhož dne vystoupili na tiskové konferenci a zdůraznili vzájemné přátelství, o jehož dosažení naše dva národy usilují. \n\nJihokorejský prezident [KOR.GetLeader], který Rudda doprovázel k demilitarizovanému pásmu, označil Ruddovo úsilí za skutečný úspěch a přínos pro mezinárodní mír." # todo: NEW TRANSLATION
 rudd_in_korea.2.a: "Solidní diplomacie opět vítězí." # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.1.t: "Austrálie nabízí obchodní spolupráci" # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.1.d: "Australská vláda nám předložila hospodářskou dohodu, která má zjednodušit obchod mezi námi ve zvýšeném objemu a minimalizovat cla na obou stranách. Dosud jsme se těšili stabilně zdravému vzájemnému obchodu a zdá se, že mají zájem o budoucí užší spolupráci." # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.1.a: "Spravedlivý návrh." # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.1.b: "To nám nevyhovuje." # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.2.t: "Vietnam souhlasí s obchodním jednáním" # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.2.d: "Vietnamská vláda souhlasila s novými podmínkami a podepsala obchodní pakt. Můžeme od ní očekávat širokou škálu zboží a služeb ve zvýšeném a zjednodušeném objemu a více Australanů si bude moci užívat levnější zboží v obchodech ve svém okolí." # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.2.a: "Všechno do sebe zapadá." # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.3.t: "Vietnam odmítá obchodní jednání" # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.3.d: "Vietnam odmítl naše obchodní nabídky a rozhodl se pokračovat v současných závazcích. V podpisu dohody mu možná zabránil vnější tlak, generální tajemník [VIE.GetLeader] se však k výsledku nevyjádřil. Je to rozhodně krok zpět pro obchod v Tichomoří a politováníhodný výsledek." # todo: NEW TRANSLATION
 vietnam_trade_gillard_ast.3.a: "Zklamání." # todo: NEW TRANSLATION
 stir_the_pot_event.1.t: "Austrálie požaduje bezletovou zónu" # todo: NEW TRANSLATION
 stir_the_pot_event.1.d: "Po řadě incidentů, při nichž naše stíhačky omylem zasáhly civilní infrastrukturu, australská vláda požaduje, abychom dodržovali vynucovanou „bezletovou zónu“ nad Libyí a nechali naše letouny na základnách, aby se nestaly terčem australského letectva. Zda hodlají tento požadavek skutečně vynutit, není na nás, ale jsou velmi daleko a požadují toho poměrně hodně." # todo: NEW TRANSLATION
 stir_the_pot_event.1.a: "Ustupte jejich požadavkům." # todo: NEW TRANSLATION
 stir_the_pot_event.1.b: "Libyjský vzdušný prostor patří Libyi!" # todo: NEW TRANSLATION
 stir_the_pot_event.2.t: "Libye ustupuje našim požadavkům" # todo: NEW TRANSLATION
 stir_the_pot_event.2.d: "Pod hrozbou australské intervence [LBA.GetLeader] souhlasil se zavedením „bezletové zóny“ nad libyjským vzdušným prostorem po dobu občanského konfliktu. To by snad mělo udržet počet civilních obětí na minimu a zabránit přelití konfliktu do sousedních států." # todo: NEW TRANSLATION
 stir_the_pot_event.2.a: "Realpolitik v praxi." # todo: NEW TRANSLATION
 stir_the_pot_event.3.t: "Libye odmítá naši žádost" # todo: NEW TRANSLATION
 stir_the_pot_event.3.d: "Navzdory pokračujícím ztrátám na civilních životech [LBA.GetLeader] odmítl naši žádost o „bezletovou zónu“ nad libyjským vzdušným prostorem. Jejich pokračující občanský konflikt bude nadále představovat bezprostřední nebezpečí pro obyvatele regionu a riziko přelití do sousedních států roste. Jak své požadavky vynutíme, je nyní na nás." # todo: NEW TRANSLATION
 stir_the_pot_event.3.a: "Znali alternativu." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.1.t: "Austrálie požaduje spolupráci při udržování míru" # todo: NEW TRANSLATION
 myanmar_intervention_gillard.1.d: "Australská vláda nám zaslala požadavek, abychom do země vpustili její mírové jednotky a umožnili jim pomoci s řešením současné povstalecké krize. Pomoc bychom ocenili, jejich podmínky by z nás však v podstatě učinily politický klientský stát jejich vlády až do ukončení krize, které jejich podmínky nijak nedefinují. Zdá se, že na splnění požadavku trvají naprosto neústupně, a to do té míry, že v případě odmítnutí nelze vyloučit vojenskou invazi." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.1.a: "Rozhodně ne." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.1.b: "Nemáme jinou možnost." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.2.t: "Myanmar přijímá podmínky" # todo: NEW TRANSLATION
 myanmar_intervention_gillard.2.d: "Tváří v tvář rostoucí povstalecké hrozbě [BRM.GetLeader] souhlasil s vpuštěním našich mírových jednotek do Malajsie, aby krizi zvládly. Významná část našich ozbrojených sil brzy zahájí okupaci. Celkově jde o velké vítězství v boji proti terorismu." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.2.a: "Je to pro jejich vlastní dobro." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.3.t: "Myanmar odmítá podmínky mírové mise" # todo: NEW TRANSLATION
 myanmar_intervention_gillard.3.d: "Navzdory tomu, že naše delegace navázala dobré vztahy s Malajci, [BRM.GetLeader] naši nabídku pomoci v boji proti rostoucí povstalecké krizi bez okolků odmítl. Země se dál rozpadá na pokraji zhroucení a představuje skutečné riziko, že se stane živnou půdou pro teroristické buňky. Vzhledem k tomu, jak špatná může situace být, musí být naše reakce úměrná nebezpečí." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.3.a: "Přinuťte je ke spolupráci sankcemi." # todo: NEW TRANSLATION
 myanmar_intervention_gillard.3.b: "Musíme zasáhnout." # todo: NEW TRANSLATION
 ast_myanmar_intervention_rejection_outcomes_tt: "Pokud Myanmar odmítne, Austrálie může uvalit sankce a embargo nebo připravit válečný cíl pro vytvoření loutkového státu." # todo: NEW TRANSLATION
 reconciliation_discontent: "Nespokojenost s usmířením" # todo: NEW TRANSLATION
 reconciliation_discontent_desc: "Životy původních obyvatel Austrálie trvale znevýhodňuje přetrvávající nespravedlnost. Zatímco případ Mabo znovu oživil odhodlání mnoha lidí, soustavně lhostejné vedení během posledního desetiletí podkopalo většinu naděje, která několika lidem ještě zbývala, a ještě méně z nich dnes vidí jeho přínosy. Malá, ale hlasitá menšina stále žádá vládu o zoufale potřebnou změnu." # todo: NEW TRANSLATION
 reform_despair_ast: "Zoufalství z usmíření" # todo: NEW TRANSLATION
 reform_despair_ast_desc: "Bez naděje na změnu byl duch usmíření uhašen. Původní obyvatelé Austrálie dál žijí na okraji společnosti bez zaručené budoucnosti a mnozí další jsou rozčarováni směrem naší politiky. Rovnost pro všechny v našem národě nyní působí jako vzdálený sen. Můžeme očekávat, že zklamaní voliči budou v budoucnu podporovat radikálnější hnutí." # todo: NEW TRANSLATION
 rekindled_hope_ast: "Znovu zažehnutá naděje" # todo: NEW TRANSLATION
 rekindled_hope_ast_desc: "Z mnoha Australanů spadlo břemeno. Národ se malým, ale měřitelným způsobem vydal cestou uzdravení. Cesta je stále dlouhá, ale její zdolání se stalo snazším. Lidem v nouzi se otevírá více příležitostí. Pracoviště a školy se sjednotily a staly se vstřícnějšími ke všem Australanům. Komunita nyní hledí do budoucnosti s nadějí." # todo: NEW TRANSLATION
 economic_radical: "Ekonomický radikál" # todo: NEW TRANSLATION
 john_howard: "John Howard" # todo: NEW TRANSLATION
 the_rba_ast: "RBA" # todo: NEW TRANSLATION
 the_rba_ast_desc: "Australská rezervní banka je naší centrální bankou a institucí odpovědnou za vydávání bankovek. To v podstatě znamená, že kontroluje úrokovou sazbu. Pokud budeme se svou politikou spolupracovat a snížíme výdaje i nezaměstnanost, bude spolupracovat také ona." # todo: NEW TRANSLATION
 work_for_the_dole: "Práce za podporu" # todo: NEW TRANSLATION
 work_for_the_dole_desc: "Program má účastníky vyškolit a zapojit do práce ve prospěch místních komunit, pokud toho jsou schopni. Během práce budou nadále pobírat podporu příjmu, zatímco je budeme dále školit." # todo: NEW TRANSLATION
 work_for_the_dole_2: "Práce za podporu" # todo: NEW TRANSLATION
 work_for_the_dole_2_desc: "Program má účastníky vyškolit a zapojit do práce ve prospěch místních komunit, pokud toho jsou schopni. Během práce budou nadále pobírat podporu příjmu, zatímco je budeme dále školit. S jeho růstem jsme do seznamu příležitostí zařadili také řadu stavebních pozic ve státech, abychom pomohli s našimi stavebními projekty." # todo: NEW TRANSLATION
 baby_bonus_idea_ast: "Porodné" # todo: NEW TRANSLATION
 baby_bonus_idea_ast_desc: "Program má kompenzovat náklady, které nesou noví rodiče při výchově dítěte. Rodičům bude na každé oprávněné dítě vyplacena jednorázová částka 3 000 $. To by mělo podpořit růst populace a zmírnit stárnutí Australanů." # todo: NEW TRANSLATION
 negative_gearing_tooltip_tt: "Výrazně poškodí naše vztahy s §Yvlastníky půdy§! a naše šance na znovuzvolení, ale může v budoucnu zabránit bytové krizi." # todo: NEW TRANSLATION
 tafe_investment: "Investice do TAFE" # todo: NEW TRANSLATION
 signed_the_kyoto_protocol_ast: "Podepsán Kjótský protokol" # todo: NEW TRANSLATION
 kyoto_protocol_ast: "Kjótský protokol" # todo: NEW TRANSLATION
 kyoto_protocol_ast_desc: "Protokol, který v roce 1997 původně přijaly jiné národy, se stal vodítkem pro snižování emisí skleníkových plynů v průmyslu na základě nejnovějšího vědeckého konsenzu ohledně globálního oteplování. Ačkoli všechna jeho omezení ještě nejsou v platnosti, zavádíme je postupně v naději, že nakonec dosáhneme nulových čistých emisí skleníkových plynů." # todo: NEW TRANSLATION
 ast_avoid_the_speech_tt: "Straně bude v zájmu jednoty koalice nařízeno zůstat nestrannou. Můžeme jen doufat, že veřejnost ztratí zájem." # todo: NEW TRANSLATION
 national_water_initiative_ast: "§GNárodní vodohospodářská iniciativa§!" # todo: NEW TRANSLATION
 national_water_initiative_ast_2: "§GNárodní vodohospodářská iniciativa§!" # todo: NEW TRANSLATION
 ast_a_nation_worth_preserving_tt: "Důsledky našeho §Gúspěchu§! pocítí i další generace." # todo: NEW TRANSLATION
 police_and_security_increase_tt: "Naše §Yfinancování policie a bezpečnosti§! bude zvýšeno v boji proti protestům." # todo: NEW TRANSLATION
 police_and_security_increase_2_tt: "Naše §Yfinancování policie a zpravodajských služeb§! bude zvýšeno, aby se rozšířily naše soudní pravomoci." # todo: NEW TRANSLATION
 asio: "ASIO" # todo: NEW TRANSLATION
 asio_desc: "Australská bezpečnostní a zpravodajská organizace odpovídá za ochranu našich občanů před všemi vnitřními hrozbami. Organizace, původně vytvořená před více než pěti desetiletími, byla přizpůsobena boji proti rostoucím hrozbám, kterým Austrálie čelí v novém tisíciletí." # todo: NEW TRANSLATION
 streamlined_asylum_policy_ast: "Zjednodušená azylová politika" # todo: NEW TRANSLATION
 encourage_foreign_students_ast: "Podpora zahraničních studentů" # todo: NEW TRANSLATION
 foreign_industrial_experts_ast: "Zahraniční techničtí odborníci" # todo: NEW TRANSLATION
 foreign_industrial_experts_ast_desc: "Odborníkům ze zámoří byla udělena další přednostní víza. Přivádíme do Austrálie a zaměstnáváme i učíme zde některé z nejbystřejších mozků z celého světa." # todo: NEW TRANSLATION
 border_protection_bill_ast: "Zákon o ochraně hranic" # todo: NEW TRANSLATION
 our_ast_deputy_peacekeepers: "Naši zástupci mírových sil" # todo: NEW TRANSLATION
 australian_political_system: "Australský politický systém" # todo: NEW TRANSLATION
 king_of_the_battlers: "Král bojovníků" # todo: NEW TRANSLATION
 tourism_campaign_ast: "Národní kampaň" # todo: NEW TRANSLATION
 accepted_pacific_solution: "Přijato tichomořské řešení" # todo: NEW TRANSLATION
 denied_pacific_solution: "Odmítnuto tichomořské řešení" # todo: NEW TRANSLATION
 IND_extremist_suppression_bonus: "Společné australské protiteroristické úsilí" # todo: NEW TRANSLATION
 rudd_in_the_fire_tt: "Kevin Rudd bude pověřen hledáním příležitostí v zahraničí pro naši zemi. V záložce Mezinárodní mise se postupně zpřístupní další §2rozhodnutí§!." # todo: NEW TRANSLATION
 sino_aus_peacekeeping: "Čínsko-australské udržování míru" # todo: NEW TRANSLATION
 sino_aus_peacekeeping_desc: "Ačkoli jde teprve o začátek takové iniciativy, dohoda pokládá základy budoucích mírových operací v Tichomoří. Spoluprací při shromažďování zpravodajských informací, boji proti terorismu a ochraně obchodu můžeme nadále udržovat oceány mezi námi v bezpečí a překlenout rozdíly mezi našimi dvěma národy." # todo: NEW TRANSLATION
 ast_peacekeeping: "Čínsko-australské udržování míru" # todo: NEW TRANSLATION
