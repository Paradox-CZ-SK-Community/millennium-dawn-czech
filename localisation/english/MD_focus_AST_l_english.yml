 hung_parliament_ast_desc: "Austrálie má poprvé od roku 1940 parlament bez většiny. Žádná ze stran nemá dostatek křesel k vytvoření vlády a dokud nevyjednáme potřebnou podporu k navýšení našich 72 křesel na 76, budeme fakticky ve stavu legislativní blokády." # todo: NEW TRANSLATION
 hung_parliament_ast_2: "Křehká koalice" # todo: NEW TRANSLATION
 hung_parliament_ast_2_desc: "Možná jsme sestavili vládu, ale existující koalice není zdaleka ideální. Skládá se z nespokojených členů stran a nepředvídatelných nezávislých poslanců; jakékoli selhání při prosazování politiky by mohlo vést k předčasnému konci naší vlády ještě v jejích počátcích." # todo: NEW TRANSLATION
 diplomacy_tightrope_ast: "Diplomatické provazochodectví" # todo: NEW TRANSLATION
 diplomacy_tightrope_ast_desc: "Balancujeme na složité hraně: udržujeme hluboké bezpečnostní a obranné spojenectví se Spojenými státy a zároveň usilujeme o stabilizovanou obchodní vzájemnou závislost s Čínou. Díky tomu, že se vyhýbáme nucené volbě mezi nimi, se nám daří udržet nad vodou." # todo: NEW TRANSLATION
 non_permanent_unsc_member: "Nestálý člen Rady bezpečnosti OSN" # todo: NEW TRANSLATION
 non_permanent_unsc_member_desc: "Rada bezpečnosti OSN každé dva roky volí 10 nestálých členů, kteří se připojí k Valnému shromáždění. Tyto státy mohou předkládat rezoluce a předsedat hlasováním." # todo: NEW TRANSLATION
