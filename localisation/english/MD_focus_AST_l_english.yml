 the_lucky_country_ast: "Šťastná země" # todo: NEW TRANSLATION
 the_lucky_country_ast_desc: "Roky rozšiřování těžby a nedostatek inovací v ostatních odvětvích nás učinily závislými na vývozní ekonomice. Naše konglomeráty musí kopat hluboko a brát si svůj podíl, pokud zde chceme prosperovat. Anebo se musí něco změnit." # todo: NEW TRANSLATION
