 australia_abbottgov_focus: "Abbottova vláda" # todo: NEW TRANSLATION
 tony_abbott_desc: "Tonyho kariéra byla představením, v němž obcházel kritiku a zasypával jí své protivníky. Jako mimořádně schopný opoziční vůdce vedl Tony stranu k tvrdě pravicovému postoji a proslavil se svými tříslovnými hesly. \n\nNarodil se v Londýně, vyrůstal v Sydney jako římský katolík a vzdělával se u jezuitů. Tonyho první prioritou ve škole bylo stát se knězem. Hluboká touha po službě a duchovním vedení ho nakonec přivedla zpět do Spojeného království jako oxfordského studenta, kde se před svou službou snažil naučit co nejvíce. Přestože se těšil obdivu, jeho politické sklony ho nikdy neopustily. \n\nSvým pravidelným organizováním shromáždění a demonstrací se postavil proti levicovému studentskému vedení Oxfordu, což vyústilo v násilné střety. Po návratu do Austrálie Tony následoval své původní záměry a v roce 1984 ve věku 26 let vstoupil do kněžského stavu. Po třech letech služby přiznal, že je „hranatý kolík, který se snaží zapadnout do kulaté díry“ a že kněžství pro něj zkrátka není. \n\nProtože jeho oddanost nestačila k překonání lásky k politickému vzrušení, Tony nastoupil jako novinář do The Bulletin, což nakonec vedlo k jeho roli tiskového tajemníka Liberální strany. Tento zkušený a rozporuplný stranický hráč nyní vystoupal na nejvyšší místo v národě." # todo: NEW TRANSLATION
 executive_management_ast: "Výkonné řízení" # todo: NEW TRANSLATION
 the_turnbull_government_desc: "V tomto stromu nyní není žádný obsah. Strom zaměření Turnbullovy vlády bude vytvořen v budoucnu, ale prozatím je toto zaměření pouze zástupné." # todo: NEW TRANSLATION
 collapsing_state_sol: "Hroutící se stát" # todo: NEW TRANSLATION
 collapsing_state_sol_desc: "Právo a pořádek se v zemi fakticky zhroutily a rozsáhlá území ovládají potulné gangy zlotřilých policistů a ozbrojených militantů. Zbývající ekonomika se volně řítí ke dnu a samotná vláda je uvězněna v parlamentu. Bez financí či autority ke kontrole spirálovitě se zhoršující situace." # todo: NEW TRANSLATION
 collapsing_state_sol_1: "Křehký stát" # todo: NEW TRANSLATION
 collapsing_state_sol_1_desc: "Většina militantů byla odzbrojena a zůstává ve státní vazbě. V několika městech byl obnoven zákon a pořádek, situace však stále spočívá na křehké rovnováze." # todo: NEW TRANSLATION
