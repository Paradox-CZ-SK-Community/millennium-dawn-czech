 howard_doctrine_tt: "V záložce §2rozhodnutí§! budou k dispozici nové zahraniční iniciativy." # todo: NEW TRANSLATION
 ast_international_missions: "Mezinárodní mise" # todo: NEW TRANSLATION
 ast_international_missions_desc: "Naše doktrína představuje flexibilitu při hledání nových příležitostí, které považujeme za přínosné, při současném respektování těch starých. Austrálie stojí na prahu skvělé nové budoucnosti. Jen do ní musíme trochu postrčit." # todo: NEW TRANSLATION
