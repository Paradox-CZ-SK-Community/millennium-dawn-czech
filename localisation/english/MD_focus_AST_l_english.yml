 closing_the_gap_event.2.t: "Výsledky překonávání rozdílu" # todo: NEW TRANSLATION
 closing_the_gap_event.2.d: "Po několika letech sledování naší kampaně za gramotnost a sociální podporu se výsledky bohužel ukázaly jako smíšené. Přestože je do škol zapisováno více dětí a celkově je vězněno méně dospělých, míra péče mimo domov a kriminalita mládeže stále rostou. Zdá se proto, že naše úsilí přivést znevýhodněné Australany do hlavního proudu společnosti je částečně považováno za neúspěch. Můžeme do programu investovat více a pokračovat v práci, případně jej zdokonalit, nebo nyní oželet ztráty a ukončit ho." # todo: NEW TRANSLATION
 closing_the_gap_event.2.a: "Pokračovat v práci." # todo: NEW TRANSLATION
 closing_the_gap_event.2.b: "Ukončit program." # todo: NEW TRANSLATION
 closing_the_gap_event.3.d: "Po několika letech sledování naší kampaně za gramotnost a sociální podporu se výsledky ukázaly jako pozitivní. Do škol je zapisováno více dětí, celkově je vězněno méně dospělých, míra pobytu mimo domov a kriminalita mládeže soustavně klesají. Zdá se, že naše úsilí přivést znevýhodněné Australany do hlavního proudu společnosti skutečně přináší výsledky." # todo: NEW TRANSLATION
 closing_the_gap_event.3.a: "Další úspěch." # todo: NEW TRANSLATION
