 nhmrc_grants: "Granty NHMRC" # todo: NEW TRANSLATION
 nhmrc_grants_desc: "Národní rada pro zdravotní a lékařský výzkum je naší přední agenturou pro lékařský výzkum. Naše zdravotní standardy závisí na výsledcích její práce. Doplnění prostředků krátkodobými granty by mohlo přinést průmyslu slibné výsledky." # todo: NEW TRANSLATION
