 the_financial_crisis_ast_desc: "Největší bytová bublina v dějinách USA, poháněná predátorskými půjčkami na rizikové hypotéky a nedostatkem regulace, praskla a zbytek světa nyní drží v rukou svou část problému." # todo: NEW TRANSLATION
