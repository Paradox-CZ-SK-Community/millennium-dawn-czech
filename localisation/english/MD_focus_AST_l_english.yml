 the_great_australia_act_desc: "Snad největší program sociálních reforem v dějinách naší země. Obrovské úsilí o zlepšení rovnosti v Austrálii a vyvedení milionů lidí z chudoby. Rozsáhlé pokrytí sociální péče, přepracování podmínek nároku a rozsahu pokrytí, zvýšení podpory a řada programů, které mají znevýhodněným Australanům pomoci k lepšímu životu." # todo: NEW TRANSLATION
