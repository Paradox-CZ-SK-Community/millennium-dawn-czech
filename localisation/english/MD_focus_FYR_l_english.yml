l_english:
 FYR_political.1.t: "Povstání na severozápadě" # todo: NEW TRANSLATION
 FYR_political.1.d: "Albánští etničtí militanti, kteří si říkají Národní osvobozenecká armáda, obsadili pohraniční vesnici Tanuševci a přestřelky s bezpečnostními složkami se šíří směrem k Tetovu. Skopje se obává, že válka, která Makedonii v devadesátých letech ušetřila, konečně dorazila." # todo: NEW TRANSLATION
 FYR_political.1.a: "Vyhledat mezinárodní zprostředkování" # todo: NEW TRANSLATION
 FYR_political.1.b: "Potlačit povstání" # todo: NEW TRANSLATION
 FYR_political.2.t: "Ochridská rámcová dohoda" # todo: NEW TRANSLATION
 FYR_political.2.d: "Vláda a představitelé albánských stran podepsali v Ohridu rámcovou dohodu za západního zprostředkování. Albánština získává oficiální status v obcích, kde menšina tvoří více než pětinu obyvatel, policejní pravomoci jsou decentralizovány a povstalci v rámci amnestie odevzdají své zbraně sběračům NATO." # todo: NEW TRANSLATION
 FYR_political.2.a: "Sdílená moc je lepší než válka" # todo: NEW TRANSLATION
 FYR_political.3.t: "Prespanská dohoda" # todo: NEW TRANSLATION
 FYR_political.3.d: "Na břehu Prespanského jezera vyjednavači ze Skopje a Athén parafovali dohodu o ukončení desetiletí trvajícího sporu o název. Země by se stala Republikou Severní Makedonie a Řecko by na oplátku zrušilo své veto členství v NATO a zahájení přístupových rozhovorů s Evropskou unií." # todo: NEW TRANSLATION
 FYR_political.3.a: "Podepsat a vydat se euroatlantickou cestou" # todo: NEW TRANSLATION
 FYR_political.3.b: "Svůj národ nepřejmenujeme" # todo: NEW TRANSLATION
