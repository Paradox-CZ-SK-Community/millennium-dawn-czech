 joint_military_exercises_goal_desc: "Moderní válčení vyžaduje interoperabilitu mezi spojeneckými silami. Prováděním společných cvičení a dosažením celkové síly 100 vybavených divizí naše frakce prokazuje svou připravenost reagovat na jakoukoli hrozbu." # todo: NEW TRANSLATION
 economic_integration_goal_desc: "Silná ekonomika je základem každé trvalé aliance. Tím, že zajistíme, aby každý členský stát udržoval alespoň 15 civilních továren, vybudujeme průmyslovou základnu potřebnou pro kolektivní prosperitu a vzájemnou pomoc." # todo: NEW TRANSLATION
 technology_sharing_goal_desc: "Technologická převaha násobí naši sílu. Prostřednictvím společných výzkumných programů a investic do digitální infrastruktury může naše frakce předstihnout soupeře a udržet si technologický náskok ve všech oblastech." # todo: NEW TRANSLATION
 regional_stability_goal_desc: "Aliance je jen tak silná jako její nejslabší článek. Udržováním stability nad 50 % ve všech členských státech vytváříme jednotnou frontu, která odrazuje oportunistickou agresi a vnitřní rozvracení." # todo: NEW TRANSLATION
 counter_terrorism_goal_desc: "Terorismus nezná hranice. Zřízením zpravodajských služeb v každém členském státě vytvoříme síť schopnou zachytit hrozby dříve, než se projeví, a ochráníme naše občany i společné zájmy." # todo: NEW TRANSLATION
 semiconductor_supremacy_goal_desc: "Výroba mikročipů je strategickým průmyslem 21. století. Vybudováním celkem 50 závodů na výrobu mikročipů napříč naší frakcí zajistíme nezávislost dodavatelského řetězce a technologickou dominanci na desetiletí dopředu." # todo: NEW TRANSLATION
 strategic_resource_security_goal_desc: "Přístup ke kritickým surovinám je základem hospodářského růstu i vojenské připravenosti. Naše frakce musí společně těžit dostatek ropy, kaučuku a hliníku, aby žádný člen nebyl zranitelný vůči nátlaku prostřednictvím zdrojů." # todo: NEW TRANSLATION
 collective_cyber_defense_goal_desc: "V digitálním věku je kryptografické zabezpečení stejně důležité jako fyzická opevnění. Zajištěním toho, aby každý členský stát dosáhl pokročilých schopností šifrování, ochráníme naši komunikaci, zpravodajství i kritickou infrastrukturu." # todo: NEW TRANSLATION
 economic_powerhouse_goal_desc: "Hospodářská síla se přímo promítá do geopolitického vlivu. Jakmile vůdce naší frakce dosáhne vysokého HDP na obyvatele a každý člen překročí základní hranici, staneme se hospodářským blokem, který nelze ignorovat." # todo: NEW TRANSLATION
 faction_gdp_per_capita_target_tt: "HDP na obyvatele vůdce frakce nad 15 a u všech členů nad 5" # todo: NEW TRANSLATION
 faction_economic_integration_idea: "Pakt hospodářské integrace" # todo: NEW TRANSLATION
 faction_economic_integration_idea_desc: "Díky koordinované obchodní politice a omezení překážek se členské státy těší lepší hospodářské spolupráci a rychlejšímu rozvoji." # todo: NEW TRANSLATION
