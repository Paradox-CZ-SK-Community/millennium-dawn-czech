l_english:
 free_states_of_america_focus: "Strom zaměření Svobodných států Ameriky" # todo: NEW TRANSLATION
 USB_america_focus_establishing_a_govt: "Ustavení vlády" # todo: NEW TRANSLATION
 USB_america_focus_establishing_a_govt_desc: "Ulice pohlcuje chaos, musíme zajistit ústřední velení civilní vlády, pokud vůbec chceme pomýšlet na cokoli dalšího." # todo: NEW TRANSLATION
 USB_america_focus_creating_a_police_force: "Vytvoření policejních sil" # todo: NEW TRANSLATION
 USB_america_focus_creating_a_police_force_desc: "Nyní, když máme civilní vládu, musíme znovu nastolit oddělení civilního pořádku. Bude zřízeno oddělení pro civilní záležitosti, které vše naplánuje a zřídí strategické policejní stanice, aby pomohlo rychle vytvořit provizorní policejní síly k potlačení všeobecného nepořádku." # todo: NEW TRANSLATION
 USB_america_focus_organizing_the_militias: "Organizace milic" # todo: NEW TRANSLATION
 USB_america_focus_organizing_the_militias_desc: "Potulné gangy stále působí obrovské škody. Jak máme vytvořit nějakou podobu nové společnosti, když nedokážeme zastavit ničivou povahu těchto anarchistů? Máme státní stráže, národní gardu a některé zbytky armády, tak se pokusme tuto skládačku poskládat a uvidíme, jaký obraz z ní případně vytvoříme." # todo: NEW TRANSLATION
 USB_america_focus_rebuilding_the_economy: "Obnova ekonomiky" # todo: NEW TRANSLATION
 USB_america_focus_rebuilding_the_economy_desc: "Není toho mnoho, ale je to poctivá práce... a upřímně, jakákoli práce je lepší než žádná." # todo: NEW TRANSLATION
 USB_america_focus_backyard_battleground: "Bitevní pole na vlastním prahu" # todo: NEW TRANSLATION
 USB_america_focus_backyard_battleground_desc: "Nyní, když chaos z větší části pominul a bezprostřední oblast hlavního města je stabilní, jak jen to jde, musíme usilovat o kontrolu nad státem Maryland, pokud se chceme v dohledné době někam posunout. Do lidských zdrojů, bezpečnosti a ekonomiky budou ve velkém investovány prostředky, aby byla zajištěna kontrola a stabilita státu." # todo: NEW TRANSLATION
 USB_america_focus_from_backyard_to_frontyard: "Z vlastního prahu na přední dvorek" # todo: NEW TRANSLATION
 USB_america_focus_from_backyard_to_frontyard_desc: "S ekonomickými a civilními investicemi nyní přirozeně přichází také nastolení práva a pořádku. Zřízení civilních služeb a právního systému upevní naši kontrolu nad naším vlastním dvorkem, státem Marylandem. Ten pak proměníme v přední výkladní skříň, pod níž sjednotíme náš národ pod novým praporem Svobodných států Ameriky." # todo: NEW TRANSLATION
 USB_america_focus_the_old_dominion_state: "Stát Starého dominia" # todo: NEW TRANSLATION
 USB_america_focus_the_old_dominion_state_desc: "Nějakým způsobem se nám podařilo udržet ve svých rukou staré dominium, kterým je Virginia. Ačkoli si mnozí mysleli, že odejde k jižanům, zřejmě jsme udělali něco dost dobře, když se považují za součást nás. Jejich stát je nicméně stejně archaický a neuspořádaný jako zbytek našeho „národa“. Musíme tedy investovat do jeho obnovy, pokud hodláme znovu vnést do jeho řad alespoň nějaký smysl pro národ." # todo: NEW TRANSLATION
 USB_america_focus_norfolk_novelty: "Norfolská novinka" # todo: NEW TRANSLATION
 USB_america_focus_norfolk_novelty_desc: "Nyní, když je zajištěn civilní pořádek a ekonomická stabilita, můžeme dát Starému dominiu nový směr. Za budoucnost se sjednocujeme, za budoucnost budeme a musíme bránit svá práva. Za Svobodné státy." # todo: NEW TRANSLATION
 USB_america_focus_black_pearl_state: "Stát černé perly" # todo: NEW TRANSLATION
 USB_america_focus_black_pearl_state_desc: "Z popela uhelné země povstává West Virginia. Je známá tím, že se po neúspěchu plně diverzifikovat a modernizovat proměnila téměř v celostátní město duchů. Její úpadek způsobilo také to, že sirnatější uhlí tohoto státu se v moderní době stalo nepoužitelným. Musíme tomuto státu věnovat více péče a vdechnout mu život, aby mohl přetrvat v naší unii. Kdo ví, možná jednoho dne lidé nazvou West Virginii novou horskou matkou." # todo: NEW TRANSLATION
 USB_america_focus_parkersburg_perfection: "Parkersburská dokonalost" # todo: NEW TRANSLATION
 USB_america_focus_parkersburg_perfection_desc: "Uhlí se opět těží a ekonomika je znovu stabilní. Stát West Virginia vzhlíží k nebi s novými nadějemi a nyní jej musíme vést a pomoci mu vyčištěním ulic a obnovou civilních služeb. Modré hřebeny budou znovu zářit." # todo: NEW TRANSLATION
 USB_america_focus_the_commonwealth_state: "Stát Commonwealthu" # todo: NEW TRANSLATION
 USB_america_focus_the_commonwealth_state_desc: "Pennsylvania, stát rozmanité krajiny i obyvatel. S bohatou historií průmyslu, železnic a samotné americké historie musíme usilovat o zajištění stability a ekonomické budoucnosti Commonwealthu, chceme-li zachovat naši unii celistvou." # todo: NEW TRANSLATION
 USB_america_focus_from_rust_to_shine: "Od rzi k lesku" # todo: NEW TRANSLATION
 USB_america_focus_from_rust_to_shine_desc: "Od rezavého úpadku postindustriální společnosti k zářícímu majáku rozmanité digitální dynamiky — stát Commonwealthu bude dílkem skládačky našeho nového velkého národa." # todo: NEW TRANSLATION
 USB_america_focus_delaware_dilemma: "Delawarské dilema" # todo: NEW TRANSLATION
 USB_america_focus_delaware_dilemma_desc: "Stejně jako během revoluční války musíme překročit řeku Delaware, tentokrát však ne proto, abychom zničili nepřítele, ale abychom obnovili a přivedli k nám přítele." # todo: NEW TRANSLATION
 USB_america_focus_delaware_delight: "Delawarská radost" # todo: NEW TRANSLATION
 USB_america_focus_delaware_delight_desc: "Z ekonomických ruin do hrdého čela obnovy přijímáme další drahocenný stát zpět do své náruče. Kráčíme vpřed ke světlejší budoucnosti a těšíme se ze společnosti, kterou nyní sdílíme." # todo: NEW TRANSLATION
 USB_america_focus_the_jersey_jumpstart: "Jerseyský start" # todo: NEW TRANSLATION
 USB_america_focus_the_jersey_jumpstart_desc: "Jeden z nejvzdálenějších států naší říše a zároveň druhá polovina našeho podílu na rezavém pásu. Musíme tento stát obnovit a dát mu nový impuls, chceme-li znovu správně nastavit kurz a mít opět úplný národ." # todo: NEW TRANSLATION
 USB_america_focus_the_trenton_turnaround: "Trentonský obrat" # todo: NEW TRANSLATION
 USB_america_focus_the_trenton_turnaround_desc: "V ulicích lidé jásají, protože přišel trentonský triumf. Obyvatelé New Jersey si užijí mír a novou prosperitu nejen díky našim ekonomickým investicím, ale také díky civilnímu pořádku a péči, které vytvoříme znovuzavedením civilních služeb." # todo: NEW TRANSLATION
 USB_america_focus_the_great_reclamation: "Velká obnova" # todo: NEW TRANSLATION
 USB_america_focus_the_great_reclamation_desc: "Díky nesčetným investicím, pečlivému plánování a skutečnému projevu národního odhodlání nyní můžeme konečně odhodit okovy starého světa a starých ideálů a pohlédnout k budoucnosti, k budoucnosti svobody. Nyní můžeme s hrdostí říci, že jsme Svobodné státy." # todo: NEW TRANSLATION
 USB_america_focus_the_elections_question: "Otázka voleb" # todo: NEW TRANSLATION
 USB_america_focus_the_elections_question_desc: "Nyní, když je národ konečně dostatečně reorganizován pro skutečnou politickou diskusi, čelíme otázce, co chceme v prvních dnech našeho nového národa. Někteří chtějí volby, jiní pouze stabilitu. Nakonec jen čas ukáže, kam směřují ambice národa." # todo: NEW TRANSLATION
 USB_america_focus_ban_elections: "Prozatím zakázat volby" # todo: NEW TRANSLATION
 USB_america_focus_ban_elections_desc: "Musíme se soustředit na přítomnost, přestat se kochat minulostí a přestat snít o údajné budoucnosti, kterou potřebujeme. Nyní potřebujeme stabilitu a činy, které povedou národ, abychom se mohli o budoucnost starat později." # todo: NEW TRANSLATION
 USB_america_focus_establish_elections: "Ustavení voleb" # todo: NEW TRANSLATION
 USB_america_focus_establish_elections_desc: "Jako národ se musíme dohodnout, jakým směrem se chceme vydat. Proto se budou konat nové volby a lid rozhodne o budoucnosti." # todo: NEW TRANSLATION
 USB_america_focus_federalist_rightist: "Federalistická pravice vítězí" # todo: NEW TRANSLATION
 USB_america_focus_federalist_rightist_desc: "Po zodpovězení otázky voleb celonárodní referendum přineslo vítězství Federalistické straně, která se v dohledné budoucnosti stane vládnoucí stranou. Zároveň však zvítězila pravicová frakce odmítající volby. Uvidíme, jaká rozhodnutí učiní při vedení tohoto nového majáku naděje." # todo: NEW TRANSLATION
 USB_america_focus_federal_taxes_when_needed_not_wanted: "Zákon Christana Sandswortha" # todo: NEW TRANSLATION
 USB_america_focus_federal_taxes_when_needed_not_wanted_desc: "Zákon Christana Sandswortha představuje nový pohled na tvorbu a reformu daňového systému společnosti. Mimořádná zasedání ke změně či reformě částí daňového systému může svolat prezident nebo hlavní představitel jedné ze dvou komor Kongresu. Toto zasedání se zaměří na jedno ústřední téma daňového systému a buď bude hlasovat o jeho změně či reformě, nebo o zamítnutí návrhu. Hlavní zásadou nyní je, že zákonodárci i lidé chtějí daňový systém založený spíše na potřebách než na přáních. Co národ a naše společnost nyní potřebují, nikoli co si kdy přejí." # todo: NEW TRANSLATION
 USB_america_focus_federal_many_hands_act: "Zákon pilných pracovníků" # todo: NEW TRANSLATION
 USB_america_focus_federal_many_hands_act_desc: "Zákon HWA je souborem reforem, které mají nastartovat ekonomický růst a zaměstnanost. Ačkoli se stále nacházíme obrazně v době kamenné, můžeme přesto začít dláždit cestu k rozvoji. Naše neefektivita bude vyvážena našimi osvědčenými a důvěryhodnými pracovníky. Chápeme potřebu vytvářet nové z toho, co je staré, a naše legislativní reformy se snaží vštípit novou podobu vlastenectví prostřednictvím práce. Nyní pracujme tvrdě, abychom si později mohli hrát ještě tvrději." # todo: NEW TRANSLATION
 USB_america_focus_federal_societal_progress_act: "Zákon společenského pokroku" # todo: NEW TRANSLATION
 USB_america_focus_federal_societal_progress_act_desc: "Zákon SPA se pokusí učinit ze změn ve společnosti spíše otázku lidu než politiky. Státy a místní samosprávy mohou přijímat, reformovat a vytvářet vlastní zákony, které zajistí pokračování civilního pořádku a zákonného jednání. Zákony, které lze považovat za diskriminační nebo zaujaté vůči jedné či druhé skupině, však mohou být napadeny u státních, a v případě potřeby i federálních soudů. Soudní případy budou rozsáhle dokumentovány, aby byla zajištěna informovanost veřejnosti a zveřejněno co nejvíce údajů o odcizujícím tématu. To umožní nejen případné příznivé soudní rozhodnutí, ale také lepší pochopení problému občany místních samospráv či států a jejich postup v zájmu co největšího počtu lidí." # todo: NEW TRANSLATION
 USB_america_focus_federal_liberty_businesses_act: "Zákon svobodného podnikání" # todo: NEW TRANSLATION
 USB_america_focus_federal_liberty_businesses_act_desc: "Starý řád byl ve svých pravidlech pro podnikání příliš přísný. Pokud máme obnovu zvládnout pozoruhodným tempem, musíme těm, kteří chtějí vést, umožnit přístup k nástrojům a prostředkům, které k tomu potřebují. Tento zákon proto umožní vládní podpůrný program a omezí regulace pouze na základní požadavky péče o lidi a očekávání moderní společnosti." # todo: NEW TRANSLATION
 USB_america_focus_federal_clear_minds_act: "Zákon jasné mysli" # todo: NEW TRANSLATION
 USB_america_focus_federal_clear_minds_act_desc: "Zákon CMA vytvoří nezávislou komisi pro boj s korupcí, která zajistí co nejplynulejší chod vlády. Mnozí jej považují za způsob, jak čelit obavám, že nová vláda je stejná jako ta stará. Nový věk je však zde, a tak jej začněme silně, ano?" # todo: NEW TRANSLATION
 USB_america_focus_federal_the_liming_act: "Zákon o omezení" # todo: NEW TRANSLATION
 USB_america_focus_federal_the_liming_act_desc: "Zákon o omezení je určitou obdobou německých zákonů o dluhové brzdě při tvorbě rozpočtů. My však zacházíme ještě o krok dál. Politika kvantitativního uvolňování bude omezena na 5 % aktuální hodnoty HDP v daném fiskálním čtvrtletí. Každý program QE musí být určen na návrh zákona či legislativu, která nepokrývá více než pět odlišných oblastí. Nelze tedy mít zákon s údajnými stovkami různých účelů, na které se mají prostředky rozdělit, a přitom na ně skutečně vyčlenit například jen 50 dolarů." # todo: NEW TRANSLATION
 USB_america_focus_federal_industrial_standards_act: "Zákon o průmyslových standardech" # todo: NEW TRANSLATION
 USB_america_focus_federal_industrial_standards_act_desc: "Zákon ISA stanoví nový a moderní standard, od něhož bychom měli vycházet při ekonomickém rozvoji a při tvorbě podniků a průmyslových odvětví. Soutěžit s celým světem je jedna věc, skutečně se starat a soutěžit sami se sebou je věc druhá." # todo: NEW TRANSLATION
 USB_america_focus_federal_remechanization_act: "Zákon o remechanizaci" # todo: NEW TRANSLATION
 USB_america_focus_federal_remechanization_act_desc: "Naše populace je i přes své zmenšování stále početná. Můžeme jí pomoci mnohem více, pokud znovu získáme vedoucí postavení v moderní mechanizaci a automatizaci. Budoucnost je skutečně tady a musíme se jí chopit nejen kvůli sobě, ale i kvůli lidem, kterým sloužíme." # todo: NEW TRANSLATION
 USB_america_focus_federal_scraping_up_defense_industries: "Obnova obranného průmyslu" # todo: NEW TRANSLATION
 USB_america_focus_federal_scraping_up_defense_industries_desc: "Možná už nejsme tak silní jako kdysi, ale někde začít musíme. Složením zbytků našeho obranného průmyslu dohromady budeme alespoň částečně schopni zásobovat armádu, která nám zbyla." # todo: NEW TRANSLATION
 USB_america_focus_federal_reset_act: "Zákon o restartu" # todo: NEW TRANSLATION
 USB_america_focus_federal_reset_act_desc: "Protože se národ uzavřel a resetoval téměř do dětského stavu, musíme hledat nový začátek pro naši energetickou síť. Starý systém byl těžkopádný, zoufale zastaralý a navíc bolestně zranitelný vůči útokům. Zákon o restartu vytvoří nový základ pro plánování, výstavbu a zabezpečení naší nové energetické sítě a zároveň zajistí možnost jejího rozšíření, až to potřeby národa vyžádají." # todo: NEW TRANSLATION
 USB_america_focus_federal_appalachian_act: "Appalačský zákon" # todo: NEW TRANSLATION
 USB_america_focus_federal_appalachian_act_desc: "Appalačský zákon je vládní investiční iniciativa zaměřená na oživení a obnovení práce se zdroji země, které naštěstí stále držíme. Významná část Appalačského pohoří nám stále patří, a proto musíme porozumět jeho bohatství, provést průzkum a využít nerosty a rudy, aby náš národ mohl znovu prosperovat a napravit to, co bylo ztraceno." # todo: NEW TRANSLATION
 USB_america_focus_military_distinctions_act: "Zákon o vojenském rozlišení" # todo: NEW TRANSLATION
 USB_america_focus_military_distinctions_act_desc: "Zákon MDA je počáteční investiční návrh, který má přímo financovat, standardizovat a odlišit armádu Svobodných států. Nové standardy výcviku, plánování a organizace spolu s částečnou standardizací našeho vojenského průmyslu nám přinejmenším umožní bránit naše domovy v případě, že bychom byli v blízké budoucnosti napadeni." # todo: NEW TRANSLATION
 USB_america_focus_naval_distinctions_act: "Zákon o námořním rozlišení" # todo: NEW TRANSLATION
 USB_america_focus_naval_distinctions_act_desc: "Zákon NDA navazuje na MDA a usiluje o oživení všech lodí, vojáků a zařízení, které nám zbyly z doby před rozdělením. Na začátek toho není mnoho, ale s rostoucím průmyslem a návratem národa ke stabilitě se tam jistě dostaneme." # todo: NEW TRANSLATION
 USB_america_focus_national_pride_initiative: "Den Svobodných států" # todo: NEW TRANSLATION
 USB_america_focus_national_pride_initiative_desc: "Národní iniciativa hrdosti je státním svátkem nazvaným Den Svobodných států. Tento den bude nejen dnem pracovního klidu, ale i všeobecným státním svátkem, kdy budou mít všichni volno s výjimkou životně důležitých služeb, jejichž zaměstnanci budou moci pracovat pouze ve čtyřhodinových směnách. Smyslem je oslavit pokrok, kterého jsme jako národ dosáhli, a něco našemu lidu vrátit. Cílem je dát co největšímu počtu obyvatel skutečný den volna." # todo: NEW TRANSLATION
 USB_socialist_statist_victory: "Statistická frakce Svobodné socialistické strany vítězí" # todo: NEW TRANSLATION
 USB_socialist_statist_victory_desc: "Výsledkem celonárodního hlasování je vítězství Svobodné socialistické strany, konkrétně její statisticky orientované frakce. Tato frakce se na rozdíl od svých „anarchistických“ protějšků zaměřuje na větší ústřední autoritu a národní jednotu. Uvidíme, co tato údajná Rudá úsvita přinese, a doufejme, že občany tohoto nového velkého národa čeká světlejší budoucnost." # todo: NEW TRANSLATION
 USB_socialist_statist_socialized_industry: "Socializovaný průmysl" # todo: NEW TRANSLATION
 USB_socialist_statist_socialized_industry_desc: "Veřejnost ztratila směr, a proto musíme podporovat a zajišťovat zaměstnanost a průmyslový růst. Tímto způsobem nejen lépe porozumíme ekonomické situaci, ale také přímým dopadům našich programů na lidi, abychom se jim mohli lépe přizpůsobit." # todo: NEW TRANSLATION
 USB_socialist_statist_reformed_welfare_state: "Reformovaný sociální stát" # todo: NEW TRANSLATION
 USB_socialist_statist_reformed_welfare_state_desc: "Sociální stát je jako rodič. Pomůže vám, když jste na dně, a povede vás k tomu, abyste se zlepšili. Staré sociální státy se soustředily hlavně na zachycení lidí v nouzi, zatímco náš reformovaný sociální systém je nejen zachytí, ale také postaví na nohy a vrátí na cestu životem. Přizpůsobením financování a priorit programů pro opětovné začlenění zajistíme, aby se naše programy samy zaplatily." # todo: NEW TRANSLATION
 USB_socialist_statist_socialized_education: "Socializované školství" # todo: NEW TRANSLATION
 USB_socialist_statist_socialized_education_desc: "Jednotné veřejné školství. To bude standard a základ, který vytvoříme, abychom pozvedli náš lid a ukázali, že nejen dokážeme standardy vytvářet, ale také je překonávat a zvyšovat." # todo: NEW TRANSLATION
 USB_socialist_statist_the_peoples_army: "Lidová armáda" # todo: NEW TRANSLATION
 USB_socialist_statist_the_peoples_army_desc: "Jsme obklopeni národy, které se bojí našich myšlenek a ideálů. Pronásledováni přízrakem autoritářského socialismu, který sužoval dějiny a pošpinil tento ekonomický model, musíme bránit svůj lid, své domovy i samotné ideály, které z nás činí hrdý a silný národ." # todo: NEW TRANSLATION
 USB_socialist_statist_tax_brackets_act: "Zákon o daňových pásmech" # todo: NEW TRANSLATION
 USB_socialist_statist_tax_brackets_act_desc: "Zákon TBA je komplexní legislativa, která přepracuje a stanoví moderní standard progresivního daňového systému. Základem daňových pásem je nyní 16 pásem s jednotnými rozdíly v peněžním rozsahu a plynulejšími, skutečně progresivními procentními nárůsty. Poslední a nejvyšší pásmo tvoří příjmy nad 250 015 dolarů, zdaněné sazbou 40 %. Ano, může to znít vysoké, ale musíme hledět na skutečný rozdíl v poměrné hodnotě příjmů průměrného člověka odváděných na daních. Proto potřebujeme tak plynulý daňový systém, který zajistí skutečnou rovnost a společenský příspěvek k rozvoji ekonomiky a řádnému financování škol, záchranných služeb a dalších oblastí." # todo: NEW TRANSLATION
 USB_socialist_statist_millennium_labor_reforms_act: "Zákon o miléniové reformě práce" # todo: NEW TRANSLATION
 USB_socialist_statist_millennium_labor_reforms_act_desc: "Zákon MLRA zásadně změní způsob pracovních vztahů i přijímání zákonů. Ačkoli zákonodárci budou návrhy oficiálně schvalovat a podepisovat, bude zřízen společný výbor pro odborové a podnikové vztahy se stejným zastoupením odborů a průmyslového vedení příslušného k zavedeným odborům. Tento výbor bude společně centralizovat stížnosti a návrhy, aby zlepšil život pracovníků a zároveň vyvážil jejich potřeby s řádným ekonomickým zázemím. Koneckonců poloviční kompromis není skutečný kompromis." # todo: NEW TRANSLATION
 USB_socialist_statist_modern_geology_act: "Zákon o moderní geologii" # todo: NEW TRANSLATION
 USB_socialist_statist_modern_geology_act_desc: "Zákon o moderní geologii je vládní investiční iniciativa zaměřená na rozvoj průmyslu surovin a posílení základů naší ekonomiky. Díky cílenému výzkumu a geologickým průzkumům zřídíme nové doly a regulované lesnické podniky, které zajistí přebytek surovin pro vytvoření moderní ekonomiky." # todo: NEW TRANSLATION
 USB_socialist_statist_modern_marxism: "Moderní marxismus" # todo: NEW TRANSLATION
 USB_socialist_statist_modern_marxism_desc: "V novém tisíciletí jsou technologie hlavním luxusem pro civilní, vojenské i všechny ostatní části ekonomiky a života. Proto musíme zajistit, aby byla vyhrazená část naší ekonomiky zaměřena na technologický sektor a inovace." # todo: NEW TRANSLATION
 USB_socialist_statist_national_security_act: "Zákon o národní bezpečnosti" # todo: NEW TRANSLATION
 USB_socialist_statist_national_security_act_desc: "Zákon NatSec je legislativa zaměřená na zajištění bezpečnosti a ochrany našeho národa i jeho občanů. Federální agentura známá jako Divize vnitřní bezpečnosti bude koordinovat výcvik, regulaci a rozdělování federálních prostředků místním policejním složkám a pomáhat s nimi. Jednotnost a standardy jsou nezbytné pro zajištění integrity a bezpečnosti našeho národa a jeho ideálů." # todo: NEW TRANSLATION
 USB_socialist_statist_manufacturing_investments: "Investice do výroby" # todo: NEW TRANSLATION
 USB_socialist_statist_manufacturing_investments_desc: "Při téměř neexistující domácí výrobě musíme investovat do rozvoje tohoto klíčového sektoru ekonomiky, chceme-li vůbec růst a usilovat o své cíle." # todo: NEW TRANSLATION
 USB_socialist_statist_department_of_anticorruption_affairs: "Oddělení pro boj s korupcí" # todo: NEW TRANSLATION
 USB_socialist_statist_department_of_anticorruption_affairs_desc: "DACA je nezávisle vytvořená a federálně schválená instituce, v níž lze provádět protikorupční vyšetřování a všeobecný audit vlády. Přestože je oddělení právně schváleno federální úrovní, ve skutečnosti není součástí federální vlády a nemá nad ní skutečnou kontrolu. Toto oddělení umožní maximální účinnost při provádění vládních auditů a zajistí nejvyšší možnou míru transparentnosti pro občany i budoucí vlády. Pokusme se neopakovat svou minulost, ano?" # todo: NEW TRANSLATION
 USB_socialist_statist_modern_agrarian_reforms: "Moderní agrární reformy" # todo: NEW TRANSLATION
 USB_socialist_statist_modern_agrarian_reforms_desc: "Svět potřebuje potraviny, ať už pro náš vlastní lid, nebo pro obyvatele méně šťastných oblastí a národů světa. Proto musíme zdokonalit a zrevolucionizovat naše zemědělství, aby lépe vyhovovalo domácím potřebám a dokázalo pomoci i světu. Tento růst a závislost nám také umožní experimentovat a zvýšit diverzifikaci paliv prostřednictvím programů biopaliv. Etanol byl ve světě paliv vždy tak trochu otloukánkem, tak proč mu neposkytnout péči a pozornost, které potřebuje, aby se stal lepší verzí sebe sama?" # todo: NEW TRANSLATION
 USB_socialist_statist_coastal_security_act: "Zákon o pobřežní bezpečnosti" # todo: NEW TRANSLATION
 USB_socialist_statist_coastal_security_act_desc: "Zákon CS představuje omezené investice do obnovy, případně alespoň opětovného uvedení do provozu námořního personálu a plavidel, která máme stále pod kontrolou. Ačkoli nejde o nic velkého, je to dostatečný začátek vzhledem k tomu, že už nemusíme chránit pobřeží dlouhé jako celý kontinent." # todo: NEW TRANSLATION
 USB_socialist_statist_energy_conservations_act: "Zákon o úsporách energie" # todo: NEW TRANSLATION
 USB_socialist_statist_energy_conservations_act_desc: "Zákonodárci nedávno navrhli investice do specializovaných výzkumných a vývojových projektů v oblasti energetiky a také do lepšího propojení a rozšíření naší elektrické sítě. Doufáme, že nakonec nejen vyrobíme více energie pro potřeby národa, ale také dokážeme tuto rostoucí poptávku účinně využít. Jinými slovy, chceme snižovat naši spotřebu, i když roste — jakousi rovnováhu." # todo: NEW TRANSLATION
 USB_mid_atlantic_isolationist_victory: "Vítězství izolacionistické frakce Středoatlantské strany" # todo: NEW TRANSLATION
 USB_mid_atlantic_isolationist_victory_desc: "MAP neboli Středoatlantská strana zvítězila v celonárodním hlasování. Tato frakce je však silně izolacionistická a považuje expanzi za zbytečné plýtvání lidskými i přírodními zdroji. Zatímco mnozí přemýšlejí, zda je vůbec zajímá pád staré republiky, jiní jsou prostě unaveni bojem a návratem ke každodennímu životu. Prozatím tedy rozumíme míru a naším cílem je prosperita. Sláva Středoatlantským státům Ameriky." # todo: NEW TRANSLATION
 USB_mid_atlantic_self_determination_act: "Zákon o sebeurčení" # todo: NEW TRANSLATION
 USB_mid_atlantic_self_determination_act_desc: "Zákon SDA pomůže upevnit národní étos. Chceme žít, prosperovat a spolupracovat s ostatními ve světě. Přestože nám staré časy chybí, musíme hledět k novým ránům a příležitostem, chceme-li se v této velké hře života skutečně někam dostat." # todo: NEW TRANSLATION
 USB_mid_atlantic_raw_materials_act: "Zákon o surovinách" # todo: NEW TRANSLATION
 USB_mid_atlantic_raw_materials_act_desc: "Vláda nedávno schválila investiční program na rozvoj a podporu průmyslu surovin a primárních zdrojů. Chceme-li něco vybudovat, musíme mít základ, na němž lze stavět. Tento základ vytvoří naše sektory primárních zdrojů a schopnost získávat materiály potřebné k rozvoji výrobních kapacit." # todo: NEW TRANSLATION
 USB_mid_atlantic_dedicated_automation_investments: "Cílené investice do automatizace" # todo: NEW TRANSLATION
 USB_mid_atlantic_dedicated_automation_investments_desc: "Abychom obnovili ekonomiku a vstoupili do moderní doby, musíme vyhledat cílené investice do automatizace, které naší výrobě umožní konkurovat regionálním mocnostem." # todo: NEW TRANSLATION
 USB_mid_atlantic_atlantic_education_initiative: "Atlantská vzdělávací iniciativa" # todo: NEW TRANSLATION
 USB_mid_atlantic_atlantic_education_initiative_desc: "AEI je návrh na financování vzdělávání, který zvýší schopnost našeho školství vyučovat a pozvedne úroveň znalostí, jimiž budou naši občané v životě vybaveni." # todo: NEW TRANSLATION
 USB_mid_atlantic_atlantic_care_act: "Atlantský zákon péče" # todo: NEW TRANSLATION
 USB_mid_atlantic_atlantic_care_act_desc: "Atlantský zákon péče je rozpočtový program pro zlepšení zdravotnictví, jehož cílem je standardizovat a zvýšit kapacitu i úroveň poskytování zdravotní péče celé populaci. K dispozici budou veřejné i soukromé možnosti, přičemž společná regulace zabrání celkovému přebujení správy. Lidé nyní mohou vědět, že jejich peníze jdou na jejich péči, nikoli pouze administrátorům a úředníkům." # todo: NEW TRANSLATION
 USB_mid_atlantic_department_for_transparency: "Oddělení pro transparentní záležitosti" # todo: NEW TRANSLATION
 USB_mid_atlantic_department_for_transparency_desc: "DoTA bude nezávislou vládní agenturou schopnou vyšetřovat vládu kvůli korupci a všeobecnému pochybení při plnění povinností a odpovědnosti vládních představitelů." # todo: NEW TRANSLATION
 USB_mid_atlantic_tech_development_grants: "Granty na technologický rozvoj" # todo: NEW TRANSLATION
 USB_mid_atlantic_tech_development_grants_desc: "Nové tisíciletí přináší nová odvětví a vycházející hvězdou je technologický sektor. Ten je zásadním místem růstu každé moderní ekonomiky a my musíme zajistit vlastní technologický sektor. Proto poskytneme rozvojové granty podnikům, které chtějí vytvářet nové technologické firmy, abychom podpořili nejen ekonomiku, ale i společenské začlenění těchto stále se rozvíjejících inovací zboží a služeb." # todo: NEW TRANSLATION
 USB_mid_atlantic_blue_ridge_act: "Zákon Modrého hřebene" # todo: NEW TRANSLATION
 USB_mid_atlantic_blue_ridge_act_desc: "Zdroje. Jednoduše řečeno, musíme zajistit více domácích zásob, chceme-li být skutečně novým pilířem této polokoule." # todo: NEW TRANSLATION
 USB_mid_atlantic_naval_securities_act: "Zákon o námořní bezpečnosti" # todo: NEW TRANSLATION
 USB_mid_atlantic_naval_securities_act_desc: "Nyní jsme malým národem, a proto musíme zajistit obranu našich pobřežních vod, abychom ochránili národní suverenitu." # todo: NEW TRANSLATION
 USB_mid_atlantic_guardian_angels_act: "Zákon strážných andělů" # todo: NEW TRANSLATION
 USB_mid_atlantic_guardian_angels_act_desc: "Moderní královnou bojiště je letectvo. Do tohoto klíčového poznání musíme investovat, chceme-li si zajistit schopnost být v tomto novém věku svobodným a nezávislým národem." # todo: NEW TRANSLATION
 USB_mid_atlantic_prospectors_initiative: "Iniciativa prospektorů" # todo: NEW TRANSLATION
 USB_mid_atlantic_prospectors_initiative_desc: "Autarkie... autarkie je slovo, kterému se moderní doba vyhýbá a které odsuzuje jako zaostalé. Ačkoli je její základní zásadou izolace, realita je taková, že zdravý národ je národ soběstačný. Proto vytváříme nový Homestead Act známý jako Iniciativa prospektorů. Díky předpisům týkajícím se těžby zdrojů budou rodiny či jednotlivci ochotní osídlit až pět akrů půdy moci tuto půdu vlastnit výměnou za příspěvek přírodních zdrojů, které se na ní nacházejí, do národního hospodářství." # todo: NEW TRANSLATION
 USB_mid_atlantic_planned_policing_program: "Program plánované policie" # todo: NEW TRANSLATION
 USB_mid_atlantic_planned_policing_program_desc: "PPP je společná federální a místní iniciativa, jejímž cílem je posílit veřejné chápání a hodnoty policejních sil národa. Budou pořádány komunitní programy, konference a podobné akce, aby si veřejnost a policie lépe rozuměly a skutečně se navzájem oceňovaly. Stručně řečeno jde o někdy tragicky nepochopenou podstatu nejen vymáhání zákona, ale i toho, co znamená být občanem dodržujícím zákony. Jednota, ne rozdělení." # todo: NEW TRANSLATION
 USB_mid_atlantic_energy_advancements_act: "Zákon o pokroku v energetice" # todo: NEW TRANSLATION
 USB_mid_atlantic_energy_advancements_act_desc: "Zákon o pokroku v energetice je komplexní výdajový balíček. Zahrnuje výzkumné granty na výrobu a spotřebu energie, investice do modernizace sítě i regulace stanovující nové standardy pro další postup při řešení budoucích energetických potřeb." # todo: NEW TRANSLATION
 USB_mid_atlantic_the_true_green_way: "Skutečně zelená cesta" # todo: NEW TRANSLATION
 USB_mid_atlantic_the_true_green_way_desc: "Jaderná energie — budoucnost masové výroby energie, samozřejmě vedle využívání samotného Slunce. Jenže jaderná energie je v politickém světě vždy tak křehká věc. Šiřitelé strachu se drží chyb minulosti a opomíjejí jakékoli nuance. Jaderní jestřábi vyzdvihují její energetické přínosy, ale zapomínají na nuance plánování a možné vedlejší účinky militarizace. Přesto budeme pokračovat v klíčových investicích do výroby jaderné energie. Musíme světu ukázat, že nejlepší cesta vpřed nevede skrze uvíznutí v minulosti ani setrvávání v přítomnosti." # todo: NEW TRANSLATION
 USB_nsp_militarist_faction_victory: "Militaristická frakce Strany národní služby militarizuje vítězství" # todo: NEW TRANSLATION
 USB_nsp_militarist_faction_victory_desc: "Výsledky hlasování jsou známy a NSP neboli Strana národní služby zvítězila. Mnozí však s takovým výsledkem nejsou spokojeni, a proto militaristická frakce NSP využila situaci k vítězství ve vnitrostranickém boji. Vedoucí představitelé NSP nyní jinými slovy „militarizují vítězství“: armáda, lidé, kteří slouží, a samotná myšlenka bezpečnosti jsou vítězstvím, pro které lidé hlasovali. Někteří se obávají, že toto poselství může působit jako šíření strachu, jiní se však jednoduše snaží jít dál a obnovit to, co bylo ztraceno. „Uvidíme, co dokážou“ se stalo tichým heslem." # todo: NEW TRANSLATION
 USB_nsp_meritocracy_act: "Zákon o meritokracii" # todo: NEW TRANSLATION
 USB_nsp_meritocracy_act_desc: "Zákon o meritokracii, někteří mu říkají také zákon zásluh, je komplexní legislativa reformující a přepracovávající proces jmenování a prověřování lidí usilujících o vedoucí pozice ve federální, státní i místní vládě. Proces založený na rozsáhlých prověrkách osobního přesvědčení, zkušeností, prokázaných úspěchů a činů v daném oboru nám umožní vydat se cestou skutečně technokratického přístupu k vládě a správě. Prověřovací oddělení budou nezávislé komise složené z lidí bez přímých či nepřímých vazeb na prověřované osoby, aby byla zachována maximální transparentnost a spravedlnost." # todo: NEW TRANSLATION
 USB_nsp_industrial_investments: "Průmyslové investice" # todo: NEW TRANSLATION
 USB_nsp_industrial_investments_desc: "Pro zajištění domácí bezpečnosti je silná civilní ekonomika stejně důležitá jako silná vojenská ekonomika." # todo: NEW TRANSLATION
 USB_nsp_military_investments: "Vojenské investice" # todo: NEW TRANSLATION
 USB_nsp_military_investments_desc: "Musíme být připraveni na to, že některý ze sousedů dostane bláznivý nápad a pokusí se nás podrobit. Proto je nejvyšší čas na řadu omezených investic, které nastartují vojenskou ekonomiku a připravenost ozbrojených sil." # todo: NEW TRANSLATION
 USB_nsp_maritime_investments: "Námořní investice" # todo: NEW TRANSLATION
 USB_nsp_maritime_investments_desc: "Naše pobřeží je rozsáhlé a musí být bráněno. Tyto počáteční investice však zároveň posílí civilní ekonomiku prostřednictvím obchodu a šíření povědomí o naší věci." # todo: NEW TRANSLATION
 USB_nsp_the_national_arteries_act: "Zákon o národních tepnách" # todo: NEW TRANSLATION
 USB_nsp_the_national_arteries_act_desc: "Zákon NAA je rozsáhlý infrastrukturní investiční plán, který má oživit a modernizovat prakticky se rozpadající stav národní infrastruktury. Musíme stanovit standard průchodnosti, chceme-li propojit obyvatele, ekonomiku a vojenskou připravenost našeho národa s předními standardy krizového řízení, v nichž vytvoříme nové rekordy." # todo: NEW TRANSLATION
 USB_nsp_department_of_internal_investigation: "Oddělení vnitřního vyšetřování" # todo: NEW TRANSLATION
 USB_nsp_department_of_internal_investigation_desc: "DII je specializovaná protikorupční agentura, která má zajistit stabilitu a pevnost naší meritokracie. Musíme vytvořit étos nezištné služby v armádních i civilních zaměstnáních, chceme-li zajistit dlouhověkost a stabilitu našeho národa." # todo: NEW TRANSLATION
 USB_nsp_national_high_command: "Národní vrchní velení" # todo: NEW TRANSLATION
 USB_nsp_national_high_command_desc: "Protože jsou civilní a vojenské části naší společnosti tak odlišné, musíme se naučit tyto části reality lépe integrovat a sjednotit. Kromě investic do národní bezpečnosti hlavního města proto zavedeme novou reorganizaci vedoucí struktury národa. Náš vrchní velitel nyní získá společný titul maršála společnosti. Tento titul, zkráceně pouze maršál, sjednotí chápání civilních a vojenských záležitostí jako jediné sjednocující matice soudržnosti a přežití našeho spravedlivého a malého národa." # todo: NEW TRANSLATION
 USB_nsp_mini_steel_belt: "Malý ocelový pás" # todo: NEW TRANSLATION
 USB_nsp_mini_steel_belt_desc: "Protože domácí potřeby jsou naší nejvyšší prioritou, musíme zajistit základní kámen moderní výstavby a výrobní podpory. Investiční program Malý ocelový pás přinese rozsáhlé investice do West Virginie a Pennsylvanie, aby obnovil a zušlechtil to málo, co nám zbylo z „rezavého pásu“." # todo: NEW TRANSLATION
 USB_nsp_militarizing_society: "Militarizace společnosti" # todo: NEW TRANSLATION
 USB_nsp_militarizing_society_desc: "Voltaire kdysi řekl, že Prusko není státem s armádou, ale armádou se státem. My k tomu dodáváme, že by to měl být popis skutečnosti samotné. Žádná společnost armádu nepotřebuje, a přesto armáda upřímně nepotřebuje společnost. S tímto vědomím musíme plně sjednotit armádu a společnost. Pracovní etika, vzdělávání, další rozvoj technologií i správa mohou být organizovány tak, jako by šlo o samotnou armádu. Budeme podporovat všechny přednosti meritokracie, snahu o vlastní zlepšení i rozvoj společnosti jako celku." # todo: NEW TRANSLATION
 USB_nsp_energy_investments: "Energetické investice" # todo: NEW TRANSLATION
 USB_nsp_energy_investments_desc: "S mobilizací ekonomiky a obnovou armády je v našem nejlepším zájmu zajistit energetické potřeby nejen našeho lidu, ale i armády. Tyto potřeby možná nevyřešíme okamžitě, ale investice a výzkumné granty umožní lepší rozvoj nových účinných metod výroby i spotřeby energie." # todo: NEW TRANSLATION
 USB_nsp_top_priority_budgeting: "Prioritní rozpočtování" # todo: NEW TRANSLATION
 USB_nsp_top_priority_budgeting_desc: "Ovládáme několik přístavů a významné námořní doky, což nás vede směrem ovlivněným námořnictvem. Vzhledem k velikosti pobřeží, rostoucímu obchodu a možnosti vpádu zahraničních protivníků musíme v rozpočtu zavést systém priorit, který zajistí obranu našeho národa a jeho obyvatel." # todo: NEW TRANSLATION
 USB_nsp_expanding_jersey_foundries: "Rozšíření jerseyských sléváren" # todo: NEW TRANSLATION
 USB_nsp_expanding_jersey_foundries_desc: "Slévárny a hutě v New Jersey vyrábějí rozmanitou škálu lehkých kovů. Ty jsou zásadní pro civilní i vojenskou expanzi, a proto budeme do New Jersey investovat ve všech směrech, aby drželo krok s rostoucími potřebami národa." # todo: NEW TRANSLATION
 USB_nsp_defensive_expenditure_warfare: "Defenzivní výdajové válčení" # todo: NEW TRANSLATION
 USB_nsp_defensive_expenditure_warfare_desc: "Vzhledem k naší geografické poloze máme za zády moře, a proto musíme zajistit přežití našeho národa. Výzkum a vývoj i rozpočtování armády byly proto nastaveny na přísně obranný přístup. Naši protivníci jsou početní, a tak musíme být ostražití při držení linie a zároveň si zachovat prostředky válečné výroby. Nejvyšší prioritou se proto stává rozvoj nové válečné doktríny, známé jako defenzivní výdajové válčení." # todo: NEW TRANSLATION
 USB_nsp_the_new_identity: "Nový národ" # todo: NEW TRANSLATION
 USB_nsp_the_new_identity_desc: "Po upevnění našeho národa, jeho lidu, armády a étosu musíme vymyslet nové jméno, které tuto nově nalezenou identitu zajistí. Už nejsme pouze Svobodné státy Ameriky, jsme Středoatlantská unie." # todo: NEW TRANSLATION
 USB_america_focus_federalist_liberals_win_election: "Federalističtí liberálové vítězí ve volbách" # todo: NEW TRANSLATION
 USB_america_focus_federalist_liberals_win_election_desc: "Výsledky voleb jsou známy a zdá se, že Federalistická strana zvítězila. Toto vítězství také posunulo rovnováhu strany k liberálnějšímu uspořádání, protože hlavní údajně konzervativní členové byli odpůrci voleb. Jeden z bývalých členů prohlásil: „Volby odvádějí pozornost od národního přežití.“ Přesto lidé očekávají jakoukoli změnu, zejména návrat k nadějné normálnosti." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_national_works_administration: "Národní správa veřejných prací" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_national_works_administration_desc: "NWA je nová specializovaná vládní správa, která má pomoci s budováním ekonomiky. Plánováním infrastruktury a vládních ekonomických podniků by měla snížit nezaměstnanost a mírně stimulovat ekonomiku i v horších časech." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_industrial_development_committee: "Výbor pro průmyslový rozvoj" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_industrial_development_committee_desc: "Po založení IDC bude průmyslový rozvoj národa moci fungovat čistě v soukromém sektoru s dodatečnou pomocí vládních programů. Ty umožní rozmanitost nejen přítomných průmyslových odvětví, ale i míst, kde budou založena, a zajistí vyvážený rozvoj, aby žádná obec, okres ani celý stát nezaostával za ostatními." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_department_of_innovation: "Oddělení inovací" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_department_of_innovation_desc: "DoI neboli Oddělení inovací je federálně podporovaná výzkumná a vývojová instituce, která financuje a spolupracuje se soukromými výzkumnými firmami na inovacích a vědeckém pokroku v oblastech zásadních pro zvyšování národní životní úrovně. Díky významnému financování doženeme toto národní zaostání a vydáme se na cestu k budoucnosti." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_education_standards_act: "Zákon o vzdělávacích standardech" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_education_standards_act_desc: "Zákon ESA stanoví základní očekávání pro vzdělávací systém národa. Už žádný starý systém, v němž měl téměř každý okres vlastní způsob výuky, aby dosáhl údajně stejných výsledků. Od nynějška budou osnovy standardizovány a jejich dodržování bude očekáváno na každé úrovni vzdělávání bez ohledu na umístění instituce v národě." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_automation_advancements_act: "Zákon o pokroku v automatizaci" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_automation_advancements_act_desc: "AAA zajistí přímé financování rozšiřování a standardizace průmyslových postupů při získávání a zavádění technologií, které automatizují výrobní proces. Stručně řečeno, více investic nám umožní vyrobit více z menšího množství, abychom měli více prostředků na další výrobu." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_the_true_deal: "Skutečná dohoda" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_the_true_deal_desc: "Skutečná dohoda je rozsáhlý ekonomický balíček, který investuje do dostupných a objevených přírodních zdrojů, diverzifikuje ekonomiku a vytvoří centrální infrastrukturní síť v převážně střední části národa. Průmysl, infrastruktura a nové těžební iniciativy vydláždí cestu k budoucnosti, kterou si přejeme pro náš lid. Pro občany je to skutečně Skutečná dohoda." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_department_of_internal_investigation: "Oddělení vnitřního vyšetřování" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_department_of_internal_investigation_desc: "DoII, známé také jako Úřad pro likvidaci oligarchů, je nezávisle zřízená protikorupční agentura pověřená pravidelným vyšetřováním a kontrolou osob patřících k federální vládě. Nezávislý orgán tvoří volení lidé vybraní podle tří hlavních kritérií. 1. Zkušenosti ve správě či vyšetřování. 2. Politická apatie nebo nevoličské zázemí, aby byla zajištěna integrita instituce. 3. Zástupci musí být vyváženě zastoupeni ze všech hlavních společenských tříd každého státu, aby byla zajištěna různorodost pohledů a pochopení nejjednodušších i nejsložitějších způsobů, jimiž může vznikat korupce. Tato instituce bude základním kamenem zajištění svobody ve Svobodných státech Ameriky." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_old_power_is_still_power: "Stará energie je stále energií" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_old_power_is_still_power_desc: "Jak se naše ekonomika vrací do provozu a poptávka převyšuje výrobu, musíme hledat levné způsoby výroby energie, chceme-li udržet náskok před růstem." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_new_power_is_balanced_power: "Nová energie je vyváženou energií" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_new_power_is_balanced_power_desc: "S nástupem nového tisíciletí byl rozvoj technologií výroby obnovitelné energie ohromující. Musíme diverzifikovat výrobu a využít obnovitelné zdroje k získání energie, kterou požadujeme, kterou budeme potřebovat v budoucnosti, a pokud vše půjde dobře, možná tento přebytek využijeme ve svůj prospěch." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_future_power_is_future_proofing: "Budoucí energie zajišťuje budoucnost" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_future_power_is_future_proofing_desc: "Budoucnost je nyní i za obzorem. Chceme-li inovovat, musíme alespoň poznat a pochopit způsoby výroby energie s tím spojené. Jaderné štěpení zapadne do našich vyvážených výrobních prostředků a výrazně posílí celou ekonomiku. Při správných investicích do výzkumu a vývoje kdo ví — možná štěpení ustoupí a fúze se stane novou budoucností. Na tuto otázku odpoví až čas." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_the_substations_act: "Zákon o rozvodnách" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_the_substations_act_desc: "Tento zákon představuje komplexní výzkumný a infrastrukturní investiční program, který zajistí účinnost a ochranu potřebnou při tak rychlém růstu a rozšiřování elektrické sítě. Celkově musíme nejen rozšířit výrobu energie, ale také zefektivnit její spotřebu." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_the_self_defense_act: "Zákon o sebeobraně" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_the_self_defense_act_desc: "Navzdory svému názvu není SDA změnou civilního práva, ale vojenským, konkrétně armádním investičním a rozvojovým fondem. Naše současná situace je každým dnem znepokojivější. Zahraniční mocnosti chtějí získat to, co jsme právem vytvořili. My však zajistíme, že se to nestane." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_freecare_program: "Program svobodné péče" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_freecare_program_desc: "Svobodná péče je náš způsob zavedení určité podoby univerzálního sociálního systému. Na základě potřeb našeho lidu investujeme do domácích i zahraničních zdravotníků a zavedeme čtyřstupňový systém úrovní péče potřebné pro občany. Tyto úrovně umožní správě organizovat rychlost a účinnost poskytování péče rostoucí populaci podle závažnosti nemocí a zranění. Odborníci v terénu budou moci schválit zvýšení úrovně, pokud se stav pacienta náhle zhorší. Koneckonců v životě není nic jisté — kromě smrti." # todo: NEW TRANSLATION
 USB_states_focus_fed_left_mid_atlantic_fleet: "Středoatlantské loďstvo" # todo: NEW TRANSLATION
 USB_states_focus_fed_left_mid_atlantic_fleet_desc: "Přestože vlastníme významnou část bývalých lodí starého řádu, naše postavení je přinejlepším nejisté. Většina loděnic a zařízení chátrá a potřebuje opravy a modernizaci, aby se vyrovnala třeba Austrálii nebo Portugalsku. Významný námořní fond proto financuje tuto obnovu a umožní vyřazení našeho současného námořnictva z konzervace." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_fsp_anarchist_victory: "„Anarchisté“ Svobodné socialistické strany kolektivizují vítězství" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_fsp_anarchist_victory_desc: "V šokujícím zvratu událostí zvítězila Svobodná socialistická strana. Ta se skládá z různých odstínů rudé a nedávný posun k podpoře voleb způsobil, že se strana odklonila od tvrdého marxismu a autoritářského socialismu k vyváženější, byť poněkud matoucí rovnováze evropských sociálních demokratů a toho, čemu někteří žertem říkají „pseud anarchisté“, protože dokážou lépe spolupracovat v systému zahrnujícím stát. Volby však vyhrála SSP a nyní budou budoucnost našeho národa určovat jen čas a vedení strany." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_communalcare_program: "Program komunitní péče" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_communalcare_program_desc: "CCP, ironické, že? Jde o specializovaný sociální program založený na dotovaném financování místně vytvořených pečovatelských zařízení, v nichž obyvatelé daného města či obce dostávají péči od lidí z vlastní komunity. Samozřejmě vždy budou potřeba lidé, kteří pomáhají potřebným, ale podstatou zařízení je, že je založili místní, aby pečovali o místní. Myslete na péči o seniory a děti — koneckonců neřekl Ježíš: Miluj svého bližního?" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_red_rose_health: "Zdraví Rudé růže" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_red_rose_health_desc: "Program RRH je specializovaný zdravotnický program, který má položit základy univerzálního zdravotnictví. Po vyhodnocení potřeb každého státu budou jednotlivé státní pobočky dělit svou působnost do regionálních celků a umožní okresům poskytovat řádnou zpětnou vazbu. Doufáme, že vytvoříme vhodnou velitelskou strukturu s minimem papírování a snadnou kontrolou, protože selhání většiny programů typu UH spočívá v tom, že mají více administrátorů než zdravotnického personálu." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_syndicate_industries: "Syndikátní průmysl" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_syndicate_industries_desc: "Odbory jsou významnou částí naší voličské základny a mají velký vliv ve starých státech rezavého pásu. Proto musíme odbory rozvíjet a zajistit jim skutečná pracovní místa i budoucí rozvoj, chceme-li si udržet své postavení." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_social_tech_incorporated: "Social Tech Incorporated" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_social_tech_incorporated_desc: "Moderní doba vyžaduje moderní průmysl. Technologická a servisní odvětví jsou budoucností. Proto budeme investovat a diverzifikovat ekonomiku, abychom rozšířili své schopnosti, zvýšili kvalitu života občanů, vyváželi tyto produkty a získali zahraniční pozornost i investice." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_community_defense_act: "Zákon o obraně komunit" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_community_defense_act_desc: "Svět je nebezpečné místo a zahraniční mocnosti se snaží využít našeho velmi nejistého postavení. Musíme najít způsob, jak se bránit, a proto se nesmíme spoléhat pouze na armádu, ale také na komunity našeho národa, které chtějí bránit své domovy a rodiny." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_civil_affairs_administration: "Správa civilních záležitostí" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_civil_affairs_administration_desc: "CAA je specializovaný orgán pro audit a protikorupční záležitosti. Musíme nastavit nejvyšší etické standardy, aby lid i svět uznali, že jsme skutečná vláda, skutečný národ a skutečná společnost hodná respektu a pomoci." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_red_ducation_act: "Zákon o rudém vzdělávání" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_red_ducation_act_desc: "Zákon o rudém vzdělávání představuje rozsáhlou investici do školství, která standardizuje a zlepšuje to, co učíme, proč to učíme a jaký je celkový cíl našeho vzdělávacího systému z hlediska zlepšování společnosti." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_foreign_relations_act: "Zákon o zahraničních vztazích" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_foreign_relations_act_desc: "Protože je naše vláda v jistém smyslu spřízněná s mnoha národy za oceánem, můžeme upřednostnit policejní práci a vládní rozpočtování tak, aby obchodní dohody a výměnné programy pro pracovníky byly bezpečné a prospěšné pro obě strany." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_mineral_expansion_act: "Zákon o rozšíření těžby nerostů" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_mineral_expansion_act_desc: "Zákon MEA zlepší naše odvětví těžby nerostů a zdrojů. Zavedením nových technologií a regulací i cílených vládních grantů na rozšíření či zahájení nových těžebních podniků zajistíme národní úspěch a co nejlepší schopnost pokrýt domácí potřeby." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_the_interstate_renewal_act: "Zákon o obnově mezistátních silnic" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_the_interstate_renewal_act_desc: "Mezistátní systém je žilami ekonomiky a společenské soudržnosti našeho národa. Musíme tyto žíly vyčistit, zprůchodnit a vybudovat silnější a spolehlivější, chceme-li mít silný a zdravý národ." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_consumer_industry_advancements: "Pokrok spotřebního průmyslu" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_consumer_industry_advancements_desc: "Abychom zvýšili domácí kvalitu a zároveň zachovali ekonomickou konkurenceschopnost, musíme investovat do zavádění nových pokroků v automatizaci. Kromě toho musíme najít nové technologie pro naše průmyslové podniky, abychom zvýšili nejen množství, ale zachovali také kvalitu výrobků." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_parker_harrison_act: "Zákon Parkerové a Harrisona" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_parker_harrison_act_desc: "Zákon Parkerové a Harrisona je národní investice do našich energetických potřeb. Zahrnuje investice do nových elektráren a technologií i regulace a inovace zaměřené na účinnější spotřebu energie. Zajistíme energetické potřeby občanů a zvýšíme standardy toho, co by měl moderní národ mít." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_family_unity_program: "Program rodinné jednoty" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_family_unity_program_desc: "FUP je program a daňová úleva pro rodiny se třemi či více dětmi. Zajistí sílu domácí rodiny a poskytne jí prostředky k udržení jednoty, aby náš lidský kapitál sloužil zlepšení národa. Jak ekonomika roste, naši lidé musí mít možnost růst a žít životy, které chtějí." # todo: NEW TRANSLATION
 USB_america_focus_anarchists_army_readiness_act: "Zákon o připravenosti armády" # todo: NEW TRANSLATION
 USB_america_focus_anarchists_army_readiness_act_desc: "Zachování národa je jednou z našich nejvyšších priorit, abychom uchovali to, co je drahé našemu způsobu života. Proto musíme investovat do armády, konkrétně do posílení obrany národa a jeho lidu před zahraničními nepřáteli." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_victory: "Identitární Mid-Atlantic vítězí ve volbách" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_victory_desc: "MAP neboli Středoatlantská strana vyhrála volby, což nikoho příliš nepřekvapilo. Překvapivé je, že se strana posunula více k identitárnímu zaměření, jehož hlavním cílem je vytvořit atlantskou státní identitu. Prozatím se však spokojí se středoatlantskou identitou a především s držením a zabezpečením domácí fronty." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_rust_to_riches: "Od rzi k bohatství" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_rust_to_riches_desc: "Třetina našeho národa patří ke starému rezavému pásu... Tyto státy kdysi představovaly průmyslovou moc 20. století. Nyní leží mrtvé, rozkládají se a trpí. To však skončí. Obnovíme je, opravíme, vyleštíme a proměníme tyto rezavějící státy v zářící majáky našeho národa." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_old_black_gold: "Staré černé zlato" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_old_black_gold_desc: "Stát West Virginia trpí samotným plynutím času. Vzhledem k současné situaci musíme zajistit, aby se toto „staré zlato“ využilo v novém věku. Výzkum a investice do komplexní obnovy státu mu umožní znovu rozkvést a prosperovat." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_naval_novelty: "Námořní novinka" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_naval_novelty_desc: "Úpadek naší námořní připravenosti doslova otevírá moře útokům proti nám. Pokud chceme zabezpečit pobřeží, musíme obnovit a rozvíjet námořnictvo i námořní průmysl." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_national_defense_act: "Zákon o národní obraně" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_national_defense_act_desc: "Zákon o národní obraně financuje rozvoj a připravenost armády a zavádí legislativu ke zlepšení naší schopnosti bránit národ na souši. Navrženo bylo také posílení národní gardy a zavedení povinné služby, zatím si však nejsme jisti, zda bychom měli zajít tak daleko tak rychle." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_aviation_development_fund: "Fond rozvoje letectví" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_aviation_development_fund_desc: "ADF je legislativa vyčleňující obranné výdaje na rozvoj a modernizaci letectva, které upadlo nejvíce — téměř k naprostému rozvratu a nedostatku znalostí potřebných k pokračování služby. Každý umí hrát na vojáka či námořníka, ale létání v jakémkoli letadle vyžaduje řádnou fyzickou způsobilost a schopnost naučit se ovládat a chápat vybavení." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_military_influenced_education: "Vzdělávání ovlivněné armádou" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_military_influenced_education_desc: "Vzdělávací systém má učit a připravovat mládež a budoucí generace na údajný „svět dospělých“. Náš svět však není příliš zářný, a proto musíme prostřednictvím programů či hodin, jako je JROTC neboli Junior Reserve Officer Training Corps, a specializované tělesné výchovy zavést malý, ale výrazný vliv a seznámení s armádou a vojenským životem. To pasivně zvýší nábor do armády a službu národu bez ohledu na to, zda se jednotlivci skutečně přidají. Program JROTC nepřipraví pouze potenciální vojáky, ale naučí děti také veřejně vystupovat, vést lidi a pracovat ve skupině, což se hodí v armádě i v civilním světě." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_service_member_tax_breaks: "Daňové úlevy pro vojáky" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_service_member_tax_breaks_desc: "Národní obrana a zachování naší nově nalezené identity jsou pro nás vzácné. Občané, kteří se je rozhodnou bránit, proto musí být podporováni daňovými úlevami a určitými příspěvky pro rodiny vojáků." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy: "„Mobilizovaný“ ekonomický model" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy_desc: "Pseudomobilizovaná ekonomika je ekonomický model, který kombinuje výrobní průmysl tak, aby fungoval běžnými výrobními metodami a podobně. Odchylkou je, že malá vyhrazená část každého průmyslového odvětví, přibližně pět až deset procent, bude určena na určitý druh vojenské výroby. Každý hlavní podnik se zaměří na výrobu konkrétního vybavení či jeho třídy a skutečné rozdělení mezi továrny jednotlivých podniků určí jejich vedení, pokud splní nebo téměř splní očekávané kvóty a zajistí kvalitu vyráběného vybavení." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_new_nation: "Nový národ" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_new_nation_desc: "Od nynějška už nejsme jen „federálními pozůstatky zašlé éry“. Budeme známí jako Středoatlantská federální unie. Čistší unie založená na nově nalezené identitě a kultuře, které jsme rozvíjeli a přijali za vlastní. Minulost samozřejmě respektujeme — odtud Federální unie — přesto jde o nový krok vpřed a od této chvíle může být jen lépe." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_developing_the_arms_industry: "Rozvoj zbrojního průmyslu" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_developing_the_arms_industry_desc: "Abychom upevnili schopnost postarat se sami o sebe, musíme zajistit logistickou stránku tohoto úsilí. Proto musíme rozvíjet vojenské průmyslové kapacity tak, aby dokázaly pokrýt potřeby a možné hrozby, které nás mohou postihnout." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments: "Další rozvoj lodního průmyslu" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments_desc: "Abychom zvýšili mezinárodní uznání, usilujeme o pokračující rozvoj námořního a lodního průmyslu. Ačkoli může mít vojenské využití, hlavní potřebou je samozřejmě obchod, rybolov a podobné činnosti." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_advanced_industries_act: "Zákon o pokročilém průmyslu" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_advanced_industries_act_desc: "AIA je vládní finanční balíček pro rozvoj a růst technologických a servisních odvětví. Musíme inovovat a zvýšit konkurenceschopnost na světové scéně, chceme-li vyniknout mezi ostatními státy kontinentu." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_primary_industries_act: "Zákon o primárním průmyslu" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_primary_industries_act_desc: "Chceme-li se proslavit, musíme se v nějaké specializaci stát vůdcem a průkopníkem. Kontinent má zdroje a svět je potřebuje. Proto je budoucností rozsáhlý finanční a investiční balíček pro rozvoj primárních průmyslových odvětví a výzkum nových způsobů, jak získat více z menšího množství." # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_labor_restructuring_act: "Zákon o restrukturalizaci práce" # todo: NEW TRANSLATION
 USB_mid_atlantic_identitarian_the_labor_restructuring_act_desc: "Zákon o restrukturalizaci práce je komplexní legislativní reforma pracovního práva a schopnosti účinně rozdělovat dostupnou pracovní sílu, zároveň zajišťuje budoucí možnost získat vyšší produktivitu s menším počtem lidí. Samozřejmě budeme muset zvýšit sociální výdaje a další rozpočtové nástroje, ale jde o skutečnou investici do lepší životní úrovně všech našich obyvatel." # todo: NEW TRANSLATION
 USB_nsp_monarchist_victory: "Vítězství monarchistů NSP?" # todo: NEW TRANSLATION
 USB_nsp_monarchist_victory_desc: "V šokujícím zvratu událostí zvítězila ve volbách NSP neboli Strana národní služby. Šokující je, že její pro-volební křídlo se označuje jako „moderní monarchisté“. Jejich hlavním cílem je zřejmě zachovat demokratický systém, ale esteticky jej změnit tak, aby tituly byly spojeny s volenými úřady. Tato volená monarchie, nebo jak se jí někteří absolutisté posměšně vysmívají jako „pseudomonarchii“, je pro mnoho lidí poněkud zvláštní. Armáda je však spokojena, protože chápe historický vliv monarchií, které přikládaly svým armádám velkou hodnotu. Konzervativci jsou spokojeni, protože by šlo téměř o vrcholně konzervativní krok, a liberálové jsou víceméně spokojeni díky zachování a liberalizaci demokratického zastoupení, které z toho vzejde. Koneckonců, co skutečně znamená jméno?" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_great_debate: "Velká debata" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_great_debate_desc: "Po vítězství ve volbách se mnozí skutečně ptají, jaký smysl má kosmetická změna názvů úřadů nebo kolik jich změnit. Nejlepší diskutéři a nejklidnější hlavy strany se proto musí sejít k této „Velké debatě“, aby veřejnosti i skeptikům ukázali, jak moc se ve velkém měřítku skutečně změní." # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_upper_echelon_act: "Zákon o vyšší vrstvě" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_upper_echelon_act_desc: "Po dlouhé sérii debat jsme upevnili nové kosmetické změny. Rozhodnutí přejmenovat národ na Sjednocená království Arcadie, UKA, symbolizuje novou identitu i připomínku těch, kteří kdysi našemu bývalému já poskytli nezávislost. Francouzská koloniální oblast Arcadia je známá kanadskými provinciemi New Brunswick, Nova Scotia a Prince Edward Island. Nyní bude žít dál v našem názvu jako UKA. Tato nová identita nám umožní změnit tituly úřadů: prezident se stane císařem, senátoři princi, členové sněmovny lordy či barony a guvernéři států králi a královnami. Tato údajná vyšší vrstva vedení celého národa nyní ztělesní ducha nového národa, nového lidu a nové cesty vpřed." # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_true_progressives: "Skuteční pokrokáři" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_true_progressives_desc: "S progresivním přístupem ke skutečné daňové reformě musíme zajistit spravedlnost daňového systému. Daňová pásma proto povedou až k 250 000 dolarům jako nejvyšší sazbě. Progresivita bude spočívat v proměnlivém počtu pásem rovnoměrně rozdělených podle rozdílů mezi nimi, což umožní nejprogresivnější podobu zdanění. Namísto trestání lidí s vyššími příjmy bude škálování založeno na poměrném výdělku. Nebude tak docházet k hádkám o „spravedlivém podílu“, protože ten se bude odvíjet od poměru příjmů, nikoli od toho, že někdo zaplatil více jen proto, že vydělává více než jiný." # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_royal_families_act: "Zákon o královských rodinách" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_royal_families_act_desc: "RFA je zákon o reformě sociální péče a rozpočtu, který podporuje rodiny národa a zajišťuje péči nejen o občany, ale i o budoucnost národa. Každý ví, že hlavní příčinou rozvodů je finanční nestabilita spojená s narozením dětí. Chceme-li zvýšit štěstí občanů, zlepšit základ stabilních domovů a zajistit budoucnost budoucích občanů a potenciálních vůdců, musíme myslet na děti." # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_modern_merchants_act: "Zákon o moderních obchodnících" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_modern_merchants_act_desc: "V dobách „tradiční éry“ monarchismu byl obchodník páteří zajišťující rozšiřování vlivu a bohatství monarchie i národa. V moderní době jsou tito „moderní obchodníci“ vlastníky malých podniků. Jsou páteří ekonomiky a párou pohánějící motor národního hospodářství. Musíme proto financovat, budovat a podporovat malé podniky, aby mohly vytvářet hodnoty, a omezit nadvládu korporací, které hledají vlastní bohatství mimo národ místo bohatství národa i jeho lidu." # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_great_connections_act: "Zákon o velkém spojení" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_great_connections_act_desc: "Moderní doba dokázala něco, co by se ještě před 40 lety zdálo nemyslitelné: učinila svět menším. Přesto dnes mnozí považují internet a mobilní služby za údajné právo. Materiální věci samozřejmě nejsou právem kromě těch, které jsou nutné k přežití, ale věříme, že tyto služby jsou budoucností. Jak lépe růst jako národ, lid a identita než tím, že se všichni navzájem přiblížíme? Zákon o velkém spojení je rozsáhlý finanční balíček, který zajistí rozšíření, modernizaci a údržbu silniční i internetové a telefonní infrastruktury v nejvyšší možné míře." # todo: NEW TRANSLATION
 USB_nsp_monarchist_domestic_first_policy: "Politika domácí priority" # todo: NEW TRANSLATION
 USB_nsp_monarchist_domestic_first_policy_desc: "Politika domácí priority, známá také jako politika domácího prvenství, je soubor zákonů a reforem, které prosazují hlavní povinnost vlády jednat v zájmu bezpečnosti a zajištěného blahobytu domácí fronty. Obchod a podobné záležitosti musí být vedeny tak, aby zlepšovaly nebo přímo zajišťovaly bezpečnost domácí situace před zahraničními subjekty. Tato pseud autarkická a nacionalistická politika pravděpodobně znepřátelí řadu národů, ale občané by měli být na prvním místě — jinak k čemu je politika vlády?" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_grand_tour: "Velké turné" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_grand_tour_desc: "Skepticismus je součástí života. Dokud někdo nesouhlasí, budou existovat lidé pochybující, zda má někdo v něčem skutečně „pravdu, nebo se mýlí“. Abychom posílili náš mezinárodní obraz, musíme rozšířit diplomatický sbor a snížit možnost vzniku nepřátel ohrožujících naši existenci." # todo: NEW TRANSLATION
 USB_nsp_monarchist_la_grand_army: "Naše velká armáda" # todo: NEW TRANSLATION
 USB_nsp_monarchist_la_grand_army_desc: "Kdyby existovala armáda hodná respektu, byli bychom tu celý den, protože ochota položit vlastní život za to, v co člověk věří, je nejvyšší obětí. Přesto má Napoleonova inovativnost zvláštní místo v srdcích a myslích každého důstojníka, který myslí dopředu a připravuje se na budoucnost. Jsem si však jistý, že každý egoista by chtěl být také Napoleonem. Bez ohledu na to musíme s naší armádou zacházet s nejvyšší úctou a pečlivostí, pokud máme přežít válku, zejména válku s novými sousedy." # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_great_navy: "Naše velké námořnictvo" # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_great_navy_desc: "Od obrany na souši k obraně na moři — velké admirality zajistí bezpečnost našeho obchodu a pobřežních komunit před nebezpečími za obzorem. Se stejnou investiční energií obrátíme naše ozbrojené síly k lepšímu." # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_defiant_air_force: "Naše vzdorující letectvo" # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_defiant_air_force_desc: "Obloha nad naším národem je posvátná a tento štít musí být posílen silným a odhodlaným letectvem. Musíme mít schopnost bránit naše nebe před agresory ze zahraničí, kterých může být mnoho a někteří z nich mohou být dokonce naši sousedé." # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_vast_resources: "Naše rozsáhlé zdroje" # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_vast_resources_desc: "Musíme zajistit domácí výrobu a zpracování. K tomu musíme investovat, růst a dotovat odvětví těžby zdrojů. Tato primární průmyslová odvětví jsou krví, která obíhá celým hospodářstvím, a my zajistíme, aby tato krev proudila." # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_strategic_resources: "Naše strategické zdroje" # todo: NEW TRANSLATION
 USB_nsp_monarchist_our_strategic_resources_desc: "Ačkoli autarkie není vzhledem k naší územní poloze nejlepší strategií, můžeme alespoň maximalizovat domácí situaci a získat strategičtější postavení na světové scéně. Proto investujeme velké částky do vytváření strategických zásob a toků zdrojů prostřednictvím těžebních podniků." # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_great_power_plant: "Velká elektrárna" # todo: NEW TRANSLATION
 USB_nsp_monarchist_the_great_power_plant_desc: "S touto velkou a rychlou expanzí musíme zajistit pokrytí rostoucích potřeb. Proto investujeme do obrovských komplexů elektráren, které výrazně zvýší výrobu i využití energie." # todo: NEW TRANSLATION
 USB_america_economy_what_economy: "Ekonomika... Jaká ekonomika?" # todo: NEW TRANSLATION
 USB_america_economy_what_economy_desc: "S absolutně nastaveným stavem všeho musíme vytvořit základní rámec. Tento rámec zahrnuje zavedení legislativních reforem v oblasti ekonomických regulací a navýšení rozpočtů mezi programy péče, vzdělávání a podpůrnými programy pro školení a administrativní programy z hlediska grantů na investice. Celkově stanovíme administrativní a rozpočtový standard, aby byl náš ekonomický rozvoj proveden co nejlépe." # todo: NEW TRANSLATION
 USB_america_department_of_labor_affairs: "Ministerstvo práce" # todo: NEW TRANSLATION
 USB_america_department_of_labor_affairs_desc: "DoLA je specializovaný úřad zaměřený na zkoumání a zlepšování pracovně-právních zákonů a předpisů s cílem zvýšit efektivitu při menším počtu lidí. DoLA dále dohlíží na programy podpory v nezaměstnanosti a financování je proto rozděleno do dvou hlavních částí: programy podpory v nezaměstnanosti a reintegrační programy, které umožňují nezaměstnaným vyhledávat organizované pracovní veletrhy a/nebo programy, aby měli zajištěný příjem do doby, než najdou nové stabilní zaměstnání a příjem." # todo: NEW TRANSLATION
 USB_america_ensuring_the_modern_four_day_week: "Moderní čtyřdenní týden" # todo: NEW TRANSLATION
 USB_america_ensuring_the_modern_four_day_week_desc: "V této moderní době vidíme, že automatizace a technologie umožňují naší pracovní síle být efektivnější než dříve, než i před deseti či dvaceti lety. Proto je moderní čtyřdenní pracovní týden zlatým standardem pro zajištění skutečné rovnováhy mezi prací a sociálním životem a pochopení této metriky nám umožní dosáhnout ještě vyšší produkce a hodnoty zaměstnanosti z existující pracovní síly." # todo: NEW TRANSLATION
 USB_america_ensuring_enforced_job_fairs: "Zajištění povinných pracovních veletrhů" # todo: NEW TRANSLATION
 USB_america_ensuring_enforced_job_fairs_desc: "Prosazování tvorby a kontinuality pracovních veletrhů je nezbytné, aby si zaměstnavatelé uvědomili, jaká pracovní síla je v jejich oblasti, a zároveň tato pracovní síla získá pracovní příležitosti, o kterých možná ani netušili, že existují. To nás to trochu stojí, ale pro zajištění plynulosti hledání práce to stojí za to." # todo: NEW TRANSLATION
 USB_america_automation_and_advancements_act: "Zákon o automatizaci a pokroku" # todo: NEW TRANSLATION
 USB_america_automation_and_advancements_act_desc: "Zákon o automatizaci a pokroku, jak se skutečně nazývá, je rozpočtový balíček pro vzdělávání a výzkum a vývoj, který má posunout průmysly na standard v běžnějších praktikách věcí jako robotika, automatizace a programy založené na AI, jež pomáhají zvýšit výrobu a efektivitu průmyslu po celém světě. Ačkoli to zasáhne v jádru lidí a jejich obavy o dočasnou ztrátu práce, můžeme rozsah dopadu zmírnit investicemi do modernizace našeho vzdělávacího systému, aby lidé byli o takových pracovních oborech informováni již v mladém věku." # todo: NEW TRANSLATION
 USB_america_national_labour_corps: "Národní pracovní sbor" # todo: NEW TRANSLATION
 USB_america_national_labour_corps_desc: "Národní pracovní sbor je federálně financovaný civilní pracovní sbor, jehož nezaměstnaní jedinci – a v samostatném sektoru i trestně-pracovní sbor – budou pracovat na infrastrukturních a rozvojových projektech. Tím nám také poskytne dostatek příležitostí k údržbě infrastruktury." # todo: NEW TRANSLATION
 USB_america_military_surplus_jobs: "Pracovní místa ve vojenském přebytku" # todo: NEW TRANSLATION
 USB_america_military_surplus_jobs_desc: "Spolupráce s vojenským a civilním sektorem zajistí, že problémy zaměstnanosti naší nové země budou řešeny rychle a efektivně." # todo: NEW TRANSLATION
 USB_america_slashing_regulations_for_new_regulations: "Škrtnutí regulací pro nové regulace" # todo: NEW TRANSLATION
 USB_america_slashing_regulations_for_new_regulations_desc: "Pokud chceme skutečně růst ekonomiky, musíme pochopit, jaké regulace potřebujeme a nepotřebujeme. Být vstřícný k podnikání je jedna věc, být pasivní vůči osobním chamtivostem oportunistických a individualistických uchvatačů moci je jiná hra. Proto musíme omezit stávající regulace a naopak je nahradit lepšími, jasnějšími a pružnějšími, pokud chceme podpořit růst bez ohrožení toho, co by mohl růst znamenat." # todo: NEW TRANSLATION
 USB_america_department_for_strategic_resource_collection: "Oddělení pro sběr zdrojů" # todo: NEW TRANSLATION
 USB_america_department_for_strategic_resource_collection_desc: "Oddělení pro sběr strategických zdrojů neboli DoRC je specializované administrativní křídlo DoRM, které se zabývá shromažďováním strategických zásob a dodávek klíčových zdrojů pro zachování národní soudržnosti. Mezi takové zdroje patří ocel pro stavebnictví, fosilní paliva pro energetiku a podobně. S tímto oddělením zajistíme budoucnost." # todo: NEW TRANSLATION
 USB_america_aggressive_extraction_methods: "Agresivní těžební metody" # todo: NEW TRANSLATION
 USB_america_aggressive_extraction_methods_desc: "Aféra AEM v oddělení vyvolala významný politický odpor, nicméně hospodářský boom vzniklý z toho bude mít výraznější oživení, pokud budeme jednat správně." # todo: NEW TRANSLATION
 USB_america_targeted_resource_extraction: "Cílená těžba zdrojů" # todo: NEW TRANSLATION
 USB_america_targeted_resource_extraction_desc: "Na rozdíl od myšlení AEM se toto oddělení zaměří na strategické zdroje, které jsou pro fungování naší ekonomiky nejdůležitější. Tato cílená těžba bude probíhat ve spolupráci s Ministerstvem energetiky, aby se zajistila koheze našeho přístupu k ekonomickým a zdrojovým expanzním projektům." # todo: NEW TRANSLATION
 USB_america_rusting_sheets_to_polished_metals: "Zrezavělé plechy na leštěné kovy" # todo: NEW TRANSLATION
 USB_america_rusting_sheets_to_polished_metals_desc: "Je na čase proměnit část naší země známou jako „Rust Belt“ v novou zářivou desku metalurgické výroby. Od hliníkových mlýnů na pobřeží Jersey po ocelárny v Erie Complex v Pennsylvánii proměníme to, co bývalo opuštěné, v nové výrobky." # todo: NEW TRANSLATION
 USB_america_strategic_metallurgic_expansions: "Strategické metalurgické expanze" # todo: NEW TRANSLATION
 USB_america_strategic_metallurgic_expansions_desc: "Programy SME ve bývalých státech bývalého „Rust Beltu“ jsou dobrým výchozím krokem pro posílení strategického významu a trhu práce v těchto kdysi zapomenutých baštách výroby." # todo: NEW TRANSLATION
 USB_america_the_capital_gemstones: "Zákon o hlavních drahokamech" # todo: NEW TRANSLATION
 USB_america_the_capital_gemstones_desc: "Státy Maryland a Delaware nejsou známé ničím jiným než jílem, pískem a kamením pro stavební materiály. Avšak těžba uhlí v Marylandu a petrochemie v Delaware mohou vzájemně spolupracovat na skutečném růstu omezených operací těžby drahých kamenů v obou státech. Kdo by řekl, že nejmenší stát i náš hlavní stát by byl podhodnocený, pro nedostatek lepších slov, hehe." # todo: NEW TRANSLATION
 USB_america_from_coal_to_petrochemicals: "Z uhlí na petrochemikálie" # todo: NEW TRANSLATION
 USB_america_from_coal_to_petrochemicals_desc: "Z hlediska zdrojů jsou státy Maryland a Delaware poněkud suché, nebo alespoň méně výrazné. Abychom využili omezení, rozšíříme uhlířský průmysl v Marylandu, aby dále podpořil vědecko-průmyslovou petrochemickou základnu v Delaware. To pomůže oběma státům a dá nám více důvodů investovat do výzkumu a vývoje." # todo: NEW TRANSLATION
 USB_america_the_dynamic_ming_duo: "Dynamická těžební dvojice" # todo: NEW TRANSLATION
 USB_america_the_dynamic_ming_duo_desc: "Virginie, kdysi jediný stát, je nyní rozdělená na dvě části naší nyní jednotné země. S omezenou rozmanitostí zdrojů Virginie musíme rozšířit každý zdroj a zvýraznit hlavní hráče v oceli, mědi a dalších klíčových minerálech. U Západní Virginie je situace poněkud jiná, stát má pro sebe jen uhlí. Proto je známý jako Stát Černé perly; pojďme tedy začít s těžbou perel a mimochodem, víte, že i drahé kameny se těží, pěkný vedlejší byznys v našich velkolepých projektech." # todo: NEW TRANSLATION
 USB_america_black_pearls_fuel_valley_industries: "Černé perly pohánějí průmysl v údolí" # todo: NEW TRANSLATION
 USB_america_black_pearls_fuel_valley_industries_desc: "Přímým růstem těžby uhlí a fosilních paliv ve West Virginia můžeme pohánět a dodávat energetické potřeby průmyslu ve Virginii a metalurgických mlýnů, jako jsou ocelárny a titánové mlýny; zvláště vzhledem k tomu, že vláda považuje některé minerály těžené ve Virginii za „základní zdroje“, takže musíme udržovat zásoby těchto esenciálních surovin." # todo: NEW TRANSLATION
 USB_america_the_trade_guru: "Obchodní guru" # todo: NEW TRANSLATION
 USB_america_the_trade_guru_desc: "Vrchol našich projektů rozvoje zdrojů a expanze vyvrcholil nejen doma v horizontu ekonomického rozvoje, ale musíme se dívat i za hranice; existuje mnoho států, které by mohly chtít naše zdroje, a proto musíme vyhledávat tyto potenciální partnery, abychom zajistili naši výnosnou budoucnost." # todo: NEW TRANSLATION
 USB_america_strategic_autarky_program: "Program strategické autarkie" # todo: NEW TRANSLATION
 USB_america_strategic_autarky_program_desc: "Zajištěním nejvyšší formy národní bezpečnosti musíme být proaktivní v ochraně zdrojů a obchodu, který provádíme s národy po světě. Proto zavedeme SAP neboli Strategický Autarkie Program, který bude řídit naši obchodní politiku v souladu s bezpečností zdrojů naší země. Mnozí budou lhostejní nebo nespokojení s našimi kroky, ale to je malá cena za zajištění našeho národního blaha." # todo: NEW TRANSLATION
 USB_america_industrial_development_planning_board: "Zřídte IDPB" # todo: NEW TRANSLATION
 USB_america_industrial_development_planning_board_desc: "Průmyslový plánovací výbor, specializovaný orgán v rámci Ministerstva průmyslových věcí, který se zabývá plánováním a rozvojem ekonomiky mimo to, co dělá soukromý sektor. Jeho hlavní funkcí je hledání rovnováhy na základě národních potřeb — například snižování nezaměstnanosti a to, co je k tomu potřeba, aniž by vznikly zombie podniky, které skutečně nepřispívají k potřebám lidí." # todo: NEW TRANSLATION
 USB_america_civilian_development_administration: "Civilní rozvojová správa" # todo: NEW TRANSLATION
 USB_america_civilian_development_administration_desc: "Civilní rozvojová správa IDPB má za úkol vyvíjet civilní ekonomické iniciativy, které IDPB stanovilo pro pokračující stabilní růst národa a doplňovat růst soukromého sektoru." # todo: NEW TRANSLATION
 USB_america_erie_hudson_initiative: "Iniciativa Erie-Hudson" # todo: NEW TRANSLATION
 USB_america_erie_hudson_initiative_desc: "IDPB schválilo iniciativu Erie-Hudson, což je plán oživení, který vrací na mapu naši část bývalého Rust Beltu. Není to moc, ale je to poctivá práce." # todo: NEW TRANSLATION
 USB_america_cumberland_wilmington_initiative: "Iniciativa Cumberland a Wilmington" # todo: NEW TRANSLATION
 USB_america_cumberland_wilmington_initiative_desc: "Dostali jsme zelené světlo k rozvoji států Maryland a Delaware od Rady. Proto zahájíme výkopové práce a budeme mít vše připravené co nejdříve, v souladu se bezpečností." # todo: NEW TRANSLATION
 USB_america_the_sisters_initiative: "Iniciativa sester" # todo: NEW TRANSLATION
 USB_america_the_sisters_initiative_desc: "Rada právě dokončila plány na rozvoj Virginie. Tím přineseme průmyslový rozvoj a pracovní místa pro obyvatele Appalačského regionu a některé další." # todo: NEW TRANSLATION
 USB_america_rustic_services_plan: "Rustikální plán služeb" # todo: NEW TRANSLATION
 USB_america_rustic_services_plan_desc: "IDPB plánuje zlepšit a rozšířit služby a síť kanceláří ve státech Pensylvánie a New Jersey, což bylo schváleno. Budeme okamžitě zahajovat práce a spustíme diverzifikaci místních ekonomik v těchto státech." # todo: NEW TRANSLATION
 USB_america_mid_atlantic_tech_plan: "Technologický plán Středního Atlantiku" # todo: NEW TRANSLATION
 USB_america_mid_atlantic_tech_plan_desc: "Pomocí uspořádání a přepracování Rada schválila MAT plán. Jedná se o rámcový a rozvojový plán pro státy Maryland a Delaware, který má do regionu přinést technologické a další kancelářské pracovní místa. Doufáme, že to posílí naše kapacity v oblasti výzkumu a vývoje." # todo: NEW TRANSLATION
 USB_america_virginia_tech_expansions: "Rozšíření Virginia Tech" # todo: NEW TRANSLATION
 USB_america_virginia_tech_expansions_desc: "Ve spolupráci s Virginia Tech si Rada přeje připravit plány na rozvoj a rozšíření, které rozšíří technologický a servisní sektor Virginie a jejích sester států. Doufáme, že to přinese nové inovace a také hodně pracovních míst pro místní obyvatele." # todo: NEW TRANSLATION
 USB_america_military_development_administration: "Vojenská rozvojová správa" # todo: NEW TRANSLATION
 USB_america_military_development_administration_desc: "MDA je vojenským protějškem CDA. Tato složka je zodpovědná za prosazování jakýchkoli vojensko-průmyslových plánů, které schválila IDPB, za účelem rozvoje a udržení obranných schopností naší země proti zahraničním nájezdům či invazi." # todo: NEW TRANSLATION
 USB_america_altoona_tanks_and_jersey_jumpers: "Altoona Tanky a Jersey Jumpers" # todo: NEW TRANSLATION
 USB_america_altoona_tanks_and_jersey_jumpers_desc: "Lokální zbrojní a podpůrné vybavení jako uniformy a podobně se rozšíří v jejich výrobních kapacitách. Hlavní závody byly určeny v Altooně, Pensylvánie, a také v Newarku, New Jersey. Rada doufá, že tyto závody přinesou pracovní místa, mzdy a lokální nárůst obranných schopností, pokud by cizí země zaútočila." # todo: NEW TRANSLATION
 USB_america_maryland_munitions: "Maryland Munice" # todo: NEW TRANSLATION
 USB_america_maryland_munitions_desc: "Stát Maryland a Delaware bude skvělým místem pro rozvoj vojenského podpůrného vybavení, zejména vzhledem k blízkosti hlavního města. Proto Rada schválila Maryland Munice plán k rozvoji místních dodavatelských řetězců v oblasti vojenských záležitostí." # todo: NEW TRANSLATION
 USB_america_appalachian_arms: "Appalačské zbraně" # todo: NEW TRANSLATION
 USB_america_appalachian_arms_desc: "IDPB schválila plány pro některá zbrojní zařízení v Appalačském regionu Západní Virginie a Virginie. Naděje je, že tyto přírodní hory mohou sloužit i k ukládání zásob a případně skrývat a částečně chránit závody v této oblasti." # todo: NEW TRANSLATION
 USB_america_philly_shipyards: "Loděnice Filadelfie" # todo: NEW TRANSLATION
 USB_america_philly_shipyards_desc: "Zátoková oblast jihozápadně od Filadelfie je skvělým místem pro výstavbu komplexu loděnic. Rada schválila projekt „Greater Philly Shipyards“, který má být vybudován jižně od Filadelfie a podél západního pobřeží New Jersey." # todo: NEW TRANSLATION
 USB_america_delaware_destroyers: "Delaware torpédoborce" # todo: NEW TRANSLATION
 USB_america_delaware_destroyers_desc: "Navzdory názvu jde ve skutečnosti o širší poloostrovní námořní program. Loděnice budou vybudovány podél poloostrova, který obsazují Maryland i Delaware, aby se lépe využilo toto rozsáhlé pobřeží k posílení obranných schopností pobřeží." # todo: NEW TRANSLATION
 USB_america_norfolk_navies: "Norfolk Námořnictva" # todo: NEW TRANSLATION
 USB_america_norfolk_navies_desc: "Přístav Norfolk ve Virginii má dlouhou historii výroby námořnictva. Proto se Rada rozhodla rozšířit a vybudovat podpůrné loděnice v relativně blízké vzdálenosti od Norfolkského komplexu. Doufají, že celkový námořní komplex bude schopen pomáhat chránit naše pobřežní vody, jak tomu bylo po staletí." # todo: NEW TRANSLATION
 USB_america_idpb_economic_direction_sub_committee: "Podvýbor pro ekonomický směr" # todo: NEW TRANSLATION
 USB_america_idpb_economic_direction_sub_committee_desc: "S hlavní funkcí IDPB, kterou je samotná ekonomika, byl zřízen podvýbor, který má debatovat a informovat o nejlepším možném rozhodnutí ohledně ekonomického směru, kterým bychom měli naši zemi vést. Někteří prosazují silnější výrobní základnu, jiní říkají, že ekonomika by měla být orientována na technologie a případně služby orientované na kanceláře. Někdo dokonce navrhuje organizovat ekonomiku podle vojenských linií a využívat zbraně jako páku ve zahraničních investicích prostřednictvím jejich prodeje. Přesto je na tomto podvýboru, aby rozhodl, co je nejlepší volba." # todo: NEW TRANSLATION
 USB_america_the_mom_and_pop_plan: "Plán rodinných podniků" # todo: NEW TRANSLATION
 USB_america_the_mom_and_pop_plan_desc: "Základ ekonomiky je zjevně v malých podnicích, které tvoří páteř naší země. Proto budeme nadále rozvíjet ekonomiku tak, aby jejich primát zůstával a možná vybudujeme lepší ekonomiku než většina." # todo: NEW TRANSLATION
 USB_america_pittswark_development_scheme: "Pittswark Rozvojový plán" # todo: NEW TRANSLATION
 USB_america_pittswark_development_scheme_desc: "Pittswark Rozvojový plán je plánovaný ekonomický rozvojový program ve státech New Jersey a Pensylvánie. Cílem je založení více malých podniků a rozvoj více průmyslů orientovaných na spotřebitele pro zlepšení kvality života občanů v těchto státech." # todo: NEW TRANSLATION
 USB_america_huntingmond_development_scheme: "Huntingmond Rozvojový plán" # todo: NEW TRANSLATION
 USB_america_huntingmond_development_scheme_desc: "Huntingmond Rozvojový plán je plánovaný ekonomický rozvojový program ve státech Západní Virginie a Virginie. Cílem je založení více malých podniků a vytváření více průmyslů orientovaných na spotřebitele, aby se zlepšila životní úroveň obyvatel v těchto státech." # todo: NEW TRANSLATION
 USB_america_wilmingland_development_scheme: "Wilmingland Rozvojový plán" # todo: NEW TRANSLATION
 USB_america_wilmingland_development_scheme_desc: "Wilmingland Rozvojový plán je ekonomická rozvojová iniciativa pro státy Delaware a Maryland. Cílem je vznik více malých podniků a zavedení více spotřebitelsky orientovaných průmyslů pro zlepšení životní úrovně obyvatel v těchto státech." # todo: NEW TRANSLATION
 USB_america_norfolk_naval_contract: "Norfolk Námořní smlouva" # todo: NEW TRANSLATION
 USB_america_norfolk_naval_contract_desc: "Navzdory našim záměrům, které jsou čistě domácí, musíme založit alespoň jakýkoli obranný průmysl, abychom mohli chránit náš způsob života a národní identitu. Proto bude Norfolk Námořní základna rozšířena a bude uzavřena omezená smlouva na potřeby naší obrany." # todo: NEW TRANSLATION
 USB_america_altoona_automatics_contract: "Armádní smlouva Altoona Automatics" # todo: NEW TRANSLATION
 USB_america_altoona_automatics_contract_desc: "Smlouva na vojenské zbrojní prostředky slouží výhradně k posílení obranných schopností naší země. Zřízení zbrojní továrny v Altooně spolu s dalšími průmyslovými odvětvími orientovanými na spotřebu by mělo uklidnit obavy z nespravedně militarizace." # todo: NEW TRANSLATION
 USB_america_the_consumer_complex_initiative: "Model spotřebitelského komplexu" # todo: NEW TRANSLATION
 USB_america_the_consumer_complex_initiative_desc: "S upevněním našeho ekonomického plánování jsme si uvědomili, že důvěra spotřebitelů a zabezpečení ekonomických potřeb našich občanů jsou skutečnou prioritou. Proto jsme vyvinuli nový ekonomický model, který zajistí plnou kohezi priorit těchto potřeb pro náš národ a jeho obyvatele." # todo: NEW TRANSLATION
 USB_america_mixed_measures_plan: "Plán smíšených opatření" # todo: NEW TRANSLATION
 USB_america_mixed_measures_plan_desc: "Ekonomické plánování je samo o sobě jemným uměním a někteří by to dokonce nazvali vědou. Ať už tomu říkáte jakkoli, pro nás jde o sérii vyvažovacích kroků. Národ nebo společenský celek jakékoli velikosti se musí vyrovnávat s potřebami mnoha a i když to nemusí být vždy správné, rozhodně se snažíme nedělat to nejhorší, co se kdy stalo. Proto zavedeme Plán smíšených opatření (PMP), obecný rozvojový plán ekonomiky, který zajistí vyváženost a spravedlnost pro složité potřeby našeho národa." # todo: NEW TRANSLATION
 USB_america_rust_belt_renewal_initiative: "Iniciativa obnovy Rust Beltu" # todo: NEW TRANSLATION
 USB_america_rust_belt_renewal_initiative_desc: "RBRI je diversifikační schéma pro oživení a samozřejmě diverzifikaci ekonomik bývalých rust-belt států New Jersey a Pensylvánie. Myšlenka je, že diversifikace vnese nový život do ekonomiky, která byla po většinu času téměř jednostranná." # todo: NEW TRANSLATION
 USB_america_twin_sisters_initiative: "Iniciativa Dvě sestry" # todo: NEW TRANSLATION
 USB_america_twin_sisters_initiative_desc: "Dvě Virgínie potřebují ekonomickou diverzifikaci, Západní Virginie ji potřebuje více, ale jdeme k věci. Proto s touto novou iniciativou rozvoje ekonomiky učiníme právě to." # todo: NEW TRANSLATION
 USB_america_the_baltimore_blossom: "Baltimorský květ" # todo: NEW TRANSLATION
 USB_america_the_baltimore_blossom_desc: "Použitím stejného stylu plánování na naše poslední nediverzifikované státy Maryland a Delaware se můžeme soustředit na potřeby vlády v oblasti národní obrany. Není to největší změna priorit, ale je to něco, co je nutné pro zajištění našeho blahobytu." # todo: NEW TRANSLATION
 USB_america_the_office_initiative: "Iniciativa kanceláří" # todo: NEW TRANSLATION
 USB_america_the_office_initiative_desc: "Služby a kancelářské sektory jsou přímými potřebami moderního spotřebitele. Od věcí jako internet, kabelová televize a podobně, chceme rozvíjet náš kancelářský sektor a jeho odvětví, která budou prospívat růstu z našich investic do růstu." # todo: NEW TRANSLATION
 USB_america_defense_industry_needs: "Potřeby obranného průmyslu" # todo: NEW TRANSLATION
 USB_america_defense_industry_needs_desc: "Potřeby naší národní obrany nejsou velké, ale musíme přemýšlet vyváženě. Nikdy nevíme, zda budeme čelit útoku ze strany cizího nepřítele, nebo dokonce jednoho z našich sousedů. Kromě toho nám naše pozice umožňuje myslet mimo zaběhnutý rámec a upevnit novou identitu. Zatím stačí omezená militarizace pod záminkou sebeobrany." # todo: NEW TRANSLATION
 USB_america_a_true_balance: "Pravá rovnováha" # todo: NEW TRANSLATION
 USB_america_a_true_balance_desc: "Naše ekonomika vzkvétá, je rozmanitá a potřeby lidí i vlády jsou naplněny. Nyní se zaměříme na doladění tohoto modelu a pochopení, jak jej rozvíjet a zefektivnit v využívání materiálů, lidských a přírodních zdrojů. Především zavedeme náš nový plán EEM, tedy ekonomický model efektivity, který nasměruje naši ekonomiku k růstu do výšky, což je jakési plánování." # todo: NEW TRANSLATION
 USB_america_militarized_economy_plan: "Plán militarizované ekonomiky" # todo: NEW TRANSLATION
 USB_america_militarized_economy_plan_desc: "Naše situace je v nejlepším případě vratká a v nejhorším křehká. Musíme hybridizovat ekonomiku a zajistit národní obranu, stejně jako uspokojovat základní potřeby obyvatel." # todo: NEW TRANSLATION
 USB_america_rustic_arms_act: "Zákon o rustbeltových zbraních" # todo: NEW TRANSLATION
 USB_america_rustic_arms_act_desc: "RAA je balíček výdajů na rozvoj a zabezpečení základní úrovně obranného průmyslu ve státech rustbeltu." # todo: NEW TRANSLATION
 USB_america_dover_dockyards: "Doverovy loděnice" # todo: NEW TRANSLATION
 USB_america_dover_dockyards_desc: "Námořní průmysl pro domácí i vojenské účely je nezbytný, pokud chceme zajistit náš obchod na světové scéně. Nejsme sice proslaveni 350 loděmi, ale stačí k ochraně a obraně, to je pro tuto chvíli to, na čem záleží." # todo: NEW TRANSLATION
 USB_america_sister_armaments: "Sesterské zbrojovky" # todo: NEW TRANSLATION
 USB_america_sister_armaments_desc: "Navzdory zdání tajemného názvu místní klášter nepočíná s milicí... I když by to bylo zábavné. Místo toho jde o společnou investici do zbrojní společnosti známé jako Společnost Sesterských Zbrojovek. Založena dvěma sestrami a skutečně působící hlavně v obou Virginiích, můžeme se spoléhat na rodinné sjednocení, které zaručí kvalitu a ochrání rodiny tohoto státu a celé země." # todo: NEW TRANSLATION
 USB_america_federal_firearms: "Federální zbraně" # todo: NEW TRANSLATION
 USB_america_federal_firearms_desc: " 'Federální Distrikt', tj. státy, které soupeří o hlavní oblast, potřebují zbraně a vybavení získávat lokálně a co nejblíže, aby byla zajištěna dodávka obranných sil v případně nejhoršího. Proto je rozvoj obranného průmyslu ve Virginii a Marylandu nutný pro zajištění bezpečnosti kapitálu naší země." # todo: NEW TRANSLATION
 USB_america_complacency_act: "Zákon o uspokojení" # todo: NEW TRANSLATION
 USB_america_complacency_act_desc: "Navzdory jemnému názvu je Zákon o uspokojení ve skutečnosti cíleným balíčkem na rozvoj a rozšíření civilních průmyslů a podobných odvětví, aby byly naplněny základní potřeby populace. Proto pokud vypukne válka, budou mít určitou schopnost být soběstační, což oddálí nutnost zavedení rationingu a podobně." # todo: NEW TRANSLATION
 USB_america_military_ready_economy: "Válečně připravená ekonomika" # todo: NEW TRANSLATION
 USB_america_military_ready_economy_desc: "S řadou rozvojových programů v běhu a stabilizací civilních i vojenských záležitostí se nyní můžeme soustředit na naši adaptabilitu. Dolaďujeme současný ekonomický rozvoj, aby byl připraven a odhodlán vyrazit do boje, pokud by protivník zvažoval vyhlášení války. Bude to poněkud nepopulární pro civilní obyvatelstvo, ale je to oběť, kterou jsme ochotni podstoupit." # todo: NEW TRANSLATION
 USB_america_establishing_the_department_of_energy: "Ministerstvo energetiky" # todo: NEW TRANSLATION
 USB_america_establishing_the_department_of_energy_desc: "DoE je odvětvím DoIA, který se zaměřuje na energetické potřeby národa. Jak vyrábět energii, kde stavět nové zařízení, údržba infrastruktury a tak dále." # todo: NEW TRANSLATION
 USB_america_tried_and_tested_development: "Osvědčený vývoj" # todo: NEW TRANSLATION
 USB_america_tried_and_tested_development_desc: "Stará spolehlivost fosilních paliv zůstává relevantní, i přes odpor aktivistů za stromy; stále můžeme uspokojit většinu prostřednictvím levné a efektivní energie. Můžeme to doplnit i obnovitelnými zdroji, pokud budou protesty příliš rušit." # todo: NEW TRANSLATION
 USB_america_innovation_station_plan: "Plán Inovační stanice" # todo: NEW TRANSLATION
 USB_america_innovation_station_plan_desc: "Rozmanitost naší energetické spotřeby i výrobních metod je nejlepším způsobem, jak se chránit před zahraničním vměšováním. Proto budou postupně zavedeny rozsáhlé investice do výzkumu a vývoje a různorodá platforma energetických zdrojů." # todo: NEW TRANSLATION
 USB_america_west_virginian_revival: "Obnovení Západní Virginie" # todo: NEW TRANSLATION
 USB_america_west_virginian_revival_desc: "Se záměrem rozvoje energetiky orientované na fosilní paliva jsme do jisté míry oživili některé části západo-virginské těžební ekonomiky a jádro ekonomiky daného státu. Neúmyslný akt, ale přesto jde o hospodářský boom, jenž bude prospěšný nejen Západní Virginii, ale celé zemi." # todo: NEW TRANSLATION
 USB_america_the_solar_harness: "Solární využití energie" # todo: NEW TRANSLATION
 USB_america_the_solar_harness_desc: "Využívání Slunce k výrobě energie může být stejně proměnlivé jako vítr. Pokud však budeme strategicky umisťovat solární panely a solární pole na místa s více slunečním svitem, v dlouhodobém horizontu to přinese větší prospěch. Proto lze zavést daňové úlevy a programy, aby lidé vyráběli energii pro své domovy a pravděpodobně i pro síť." # todo: NEW TRANSLATION
 USB_america_oil_and_gas_power: "Síla ropy a zemního plynu" # todo: NEW TRANSLATION
 USB_america_oil_and_gas_power_desc: "Uhlí může dělat jen určité množství, a proto musíme rozvíjet naše ropné a zkapalněné plynové kapacity, abychom zajistili komplexní způsob výroby energie." # todo: NEW TRANSLATION
 USB_america_the_winds_of_change: "Větry změn" # todo: NEW TRANSLATION
 USB_america_the_winds_of_change_desc: "Zacházení s větrnou energií podobně jako s solární a pochopení jejích nedostatků nám umožní strategicky rozmísťovat větrné turbíny na místech, kde jsou větry co nejstabilnější. Přidáním je i tvorba oceánských větrných turbín, které využívají nejen větry, ale i přílivové proudy. Není to nejhezčí pohled pro plážové návštěvníky, ale to jsou oběti, které musíme podstoupit, abychom byli energeticky soběstační." # todo: NEW TRANSLATION
 USB_america_power_hubs: "Napájecí uzly" # todo: NEW TRANSLATION
 USB_america_power_hubs_desc: "Země bohaté na zdroje a/nebo strategicky umístěné 'Napájecí uzly' budou zřízeny k vytvoření centralizovanějších a efektivnějších energetických komplexů. Západní Virginie a Maryland splňují oba popsané trendy, aniž by rozptylovaly rozvoj dalších průmyslů na stejné půdě." # todo: NEW TRANSLATION
 USB_america_green_coal_act: "Zákon o zeleném uhlí" # todo: NEW TRANSLATION
 USB_america_green_coal_act_desc: "GCA je eufemické označení pro to, co někteří považují za 'Nové věkové uhlí'. To zahrnuje uran a jadernou energii obecně. Musíme tuto technologii řádně investovat a vyvíjet, neboť je to téměř budoucnost bohaté energetické produkce. Koneckonců, proč jinak většina sci-fi médií používá buď jadernou energii, nebo literárně vymyšlený materiál jako údajný 'většinový zdroj energie'? Potenciál tu je a zatím jsme nenašli nic lepšího než jadernou energii." # todo: NEW TRANSLATION
 USB_america_department_for_synthetic_development: "Ministerstvo pro syntetický vývoj" # todo: NEW TRANSLATION
 USB_america_department_for_synthetic_development_desc: "DSD je specializované výzkumně-vývojové oddělení DoE, které zajišťuje inovace a vývoj syntetických materiálů. Může zahrnovat uhlí, ropu, plyn či jiné produkty, jako jsou plasty či nylon." # todo: NEW TRANSLATION
 USB_america_department_for_energy_innovations: "Ministerstvo pro energetické inovace" # todo: NEW TRANSLATION
 USB_america_department_for_energy_innovations_desc: "DEI je vyhrazené výzkumně-vývojové oddělení v DoE, které se zabývá inovacemi v oblasti výroby a využívání energie. Musíme hledat budoucnost, pokud chceme využít to, co nazýváme budoucností." # todo: NEW TRANSLATION
 USB_america_department_of_logistical_affairs: "Ministerstvo logistických záležitostí" # todo: NEW TRANSLATION
 USB_america_department_of_logistical_affairs_desc: "Podobně jako Ministerstvo dopravy, hlavní funkcí DoLA je zajistit údržbu, pružnost a adaptabilitu naší infrastruktury a rozhodovat, kde ji rozšířit či vyvinout podle potřeb národa." # todo: NEW TRANSLATION
 USB_america_northern_highways_act: "Akt severních dálnic" # todo: NEW TRANSLATION
 USB_america_northern_highways_act_desc: "NHA je balíček výdajů na rozvoj a případně rozšíření či udržení stávajících klíčových silnic souvisejících s systémem Interstate." # todo: NEW TRANSLATION
 USB_america_re_establishing_the_pennsy: "Znovuzaložení Pennsylvánské železnice" # todo: NEW TRANSLATION
 USB_america_re_establishing_the_pennsy_desc: "PRR, nebo Pennsy, jak si někteří pamatují bývalou bývalou železnici, byla na vrcholu a zasahovala až do Missouri. Bohužel nucené sloučení s New York Central a dalšími zkrachovalými železnicemi do chaosu Penn Central vedlo k následnému bankrotu. Nyní, s novým startem a novým životem, znovu zřídíme Pennsylvánskou železnici a podpoříme pružnou regulaci, aby se zabránilo nadměrným sloučením či nuceným selháním, která předcházela přelomu století." # todo: NEW TRANSLATION
 USB_america_southern_highways_act: "Zákon o jižních dálnicích" # todo: NEW TRANSLATION
 USB_america_southern_highways_act_desc: "Stejně jako dříve, chlapci a děvčata, tentokrát věnujeme pozornost dolní polovině národní infrastruktury." # todo: NEW TRANSLATION
 USB_america_re_establishing_the_norfolk_and_western: "Znovuzaložení Norfolk a Western" # todo: NEW TRANSLATION
 USB_america_re_establishing_the_norfolk_and_western_desc: "N&W byla lukrativní uhelná železnice, která obsluhovala Virginii a ještě trochu navíc co do území pod kontrolou. Navzdory měnícím se podmínkám železnice obstála zkoušku času. Nicméně v reakci na Super Mergers z pozdní poloviny 20. století a rostoucí konkurenci ze strany silnic, vzduchu a tak dále byl N&W prakticky donucen najít společníka pro sloučení. Našli ho u Southern Railway, známé pod přezdívkou Old Reliable. Brzy poté obě bývalé vlajky padly a přijaly novou sdílenou vlajku pod názvem Norfolk Southern. Nyní, když jsou třídy Class I téměř zničeny, je čas znovu oživit skutečnou americkou historii a povstat nad padlými vlajkami." # todo: NEW TRANSLATION
 USB_america_the_infrastructure_readiness_act: "Zákon o připravenosti infrastruktury" # todo: NEW TRANSLATION
 USB_america_the_infrastructure_readiness_act_desc: "IRA není irský imigrační zákon; je to vládní nařízení a povinnost, že údržba infrastruktury je sama o sobě národní bezpečností. Proto jednou z hlavních priorit, vedle obrany státu, je udržovat naši infrastrukturu ve co nejlepším stavu, aniž by to způsobovalo zbytečné trvalé obtíže místním obyvatelům, kde je práce potřeba provádět." # todo: NEW TRANSLATION
 USB_america_military_debate: "Velká vojenská debata" # todo: NEW TRANSLATION
 USB_america_military_debate_desc: "Mít armádu je v pořádku, ale vědět, co s danou armádou uděláte, je ještě lepší." # todo: NEW TRANSLATION
 USB_america_the_bulwark_doctrine: "Doktrína Hradba" # todo: NEW TRANSLATION
 USB_america_the_bulwark_doctrine_desc: "Naši nepřátelé od nás očekávají, že budeme agresivní a bezohlední, my se však tomuto pokušení nepodvolíme. Musíme budovat a používat naši armádu obranným způsobem, s pochopením, že neexistuje skutečně rychlá válka. S tímto poznáním můžeme vytvořit pevný štít vojenské moci a nechat nepřítele plýtvat zdroji, zatímco vyhrajeme válku vytrvalostí díky pečlivé civilní a vojenské integraci pro národní obranu." # todo: NEW TRANSLATION
 USB_america_infantry_supremacy_guide: "Průvodce pěchotní převahy" # todo: NEW TRANSLATION
 USB_america_infantry_supremacy_guide_desc: "Každý muž – puška, každá žena – brokovnice. Toto je prohlášení našeho Průvodce pěchotní převahy (ISG) pro vojenský výcvik armády. Budeme samozřejmě investovat do obrněných vozidel a podobně; není pochyb o tom, vzhledem k modernímu způsobu války. Ale pokud chceme takové vybavení, musíme vycvičit každého vojáka, jako by byl vždy považován za pěšáka." # todo: NEW TRANSLATION
 USB_america_refining_ocs_institutions: "Vylepšování institucí OCS" # todo: NEW TRANSLATION
 USB_america_refining_ocs_institutions_desc: "Vedení je jádrem toho, co dělá armádu funkční. Je to známá skutečnost, že přepracujeme studia důstojnického sboru na našich vojenských akademiích, aby odrážely a přizpůsobily nový směr naší armády. Obranná doktrína a iniciativa v ohledu na zachování síly pod jejich velením. Společně vydržíme, vedení bude bránit stejně jako jednotky, které budou veleny." # todo: NEW TRANSLATION
 USB_america_streamlining_logistics: "Zefektivnění logistiky" # todo: NEW TRANSLATION
 USB_america_streamlining_logistics_desc: "Abychom mohli udržet výdrž, musíme zajistit zásobování našich vojáků. Proto musíme zefektivnit logistickou prioritizaci, abychom zajistili dodávky pro naše jednotky a zároveň byla udržována morálka našich vojáků." # todo: NEW TRANSLATION
 USB_america_establishing_the_doctrine: "Zavedení doktríny" # todo: NEW TRANSLATION
 USB_america_establishing_the_doctrine_desc: "Vrchol našeho plánu rozvoje armády je oficiální doktrína naší armády, a tou je Doktrína Hradba. Zajistíme obranu naší země a jejích obyvatel." # todo: NEW TRANSLATION
 USB_america_sky_defenders_program: "Program obrany vzdušného prostoru" # todo: NEW TRANSLATION
 USB_america_sky_defenders_program_desc: "Moderní královnou bojiště je letectvo. Ať už jde o stíhačky, bombardéry nebo víceúčelové letouny, zásada je jasná: pokud chcete vyhrát válku, musíte zvítězit ve vzduchu. Proto budeme rozvíjet své schopnosti a zaměřovat se na zdokonalování obrany a udržení našeho vzdušného prostoru před nepřátelskými bombardéry a podobnými hrozbami, které by mohly zničit naše obranné kapacity." # todo: CHANGED
 USB_america_fighter_defense_doctrine: "Doktrína obrany stíhačů" # todo: NEW TRANSLATION
 USB_america_fighter_defense_doctrine_desc: "FDD je specializovanou organizací našeho letectva založenou na principu lokalizované bezpečnosti. Bráníme svou vlast, a proto naše letouny i výcvik musí být uzpůsobeny tomuto zaměření." # todo: CHANGED
 USB_america_agility_training_measures: "Opatření pro obratnost ve výcviku" # todo: NEW TRANSLATION
 USB_america_agility_training_measures_desc: "Naše výcvikové standardy vyjadřují očekávání toho, co znamená vstoupit do naší vzdušné služby. To znamená, že musíme zlepšit metody výcviku, aby naši piloti zvládali nadnormální G-síly a zlepšili tak schopnosti svých strojů. Obratnost našich letounů je vyšší, než jsou piloti schopni zvládnout, takže největším omezením je samotný personál. Proto na tom budeme pracovat a zlepšovat to." # todo: NEW TRANSLATION
 USB_america_aircraft_refinement_programs: "Programy zdokonalování letounů" # todo: NEW TRANSLATION
 USB_america_aircraft_refinement_programs_desc: "ARP je specializovaný program využití výroby zaměřený na inovaci a efektivní vývoj našich letounů pro roli, kterou jsme si stanovili." # todo: NEW TRANSLATION
 USB_america_naval_repair_schools: "Námořní opravárenské školy" # todo: NEW TRANSLATION
 USB_america_naval_repair_schools_desc: "Zavedení zaměstnání nejen námořních opravárenských pracovníků, ale i civilních svářečských dodavatelů umožní, aby proces opravy a přepracování byl plynulejší. To nám umožní zprostředkovaně vyvíjet lepší vybavení, protože integrace těchto nových NRS (Námořní opravárenské stanice) umožní i složitým plavidlům rychlejší opravy." # todo: NEW TRANSLATION
 USB_america_naval_alloy_innovations: "Námořní slitiny inovace" # todo: NEW TRANSLATION
 USB_america_naval_alloy_innovations_desc: "NAI je oddělení výzkumu a vývoje zaměřené na pokroky ve výrobě námořních plavidel. Jako například vytěsnění a vylepšení slitin, aby se mohly vytvářet lepší, hladší a odolnější lodě a skutečně plout za různých podmínek na moři." # todo: NEW TRANSLATION
 USB_america_mining_warfare_refinements: "Vylepšení minové války" # todo: NEW TRANSLATION
 USB_america_mining_warfare_refinements_desc: "Program MWR se specializuje na rozšíření naší námořní zdatnosti, aby se přizpůsobily a zdokonalily schopnosti v oblasti těžby min a boje proti minám." # todo: NEW TRANSLATION
 USB_america_navy_readiness_training: "Trénink připravenosti námořnictva" # todo: NEW TRANSLATION
 USB_america_navy_readiness_training_desc: "Zlepšování výcvikových programů a námořních jednotek tak, aby zlepšily pohotovost na hrozby a zároveň minimalizovaly falešné poplachy, které mohou být hrozbou." # todo: NEW TRANSLATION
 USB_america_the_spearhead_doctrine: "Doktrína Kopí" # todo: NEW TRANSLATION
 USB_america_the_spearhead_doctrine_desc: "Naše vojsko musí být jako špička kopí, mít schopnost bodat, sekat a snižovat nepřítele tam, kde je to možné, dřív než si vybuduje účinnou obranu." # todo: NEW TRANSLATION
 USB_america_perpetual_assault_training: "Nebepřetržitý útočný výcvik" # todo: NEW TRANSLATION
 USB_america_perpetual_assault_training_desc: "PAT je výcvikový program věnovaný pochopení a vybudování odolnosti vojáků pro to, co nazýváme „Perpetual Assault“. Představte si to jako zdokonalení doktríny Masového útoku z dávných časů, ale vylepšené principem koncentrovaných útoků s cílem zajistit rychlé průlomy a potenciální obkličování. Takže téměř hybrid Masového útoku a Porážky v Detailu." # todo: NEW TRANSLATION
 USB_america_armored_assault_assist: "Skupina podpůrného pancéřovaného útočného zásahu" # todo: NEW TRANSLATION
 USB_america_armored_assault_assist_desc: "Třístupňová úderná síla armády, tato vylepšená pancéřovaná část nebude dělat problémy při potlacení malých skupin nepřátelských sil bez rizika counter-encirclements." # todo: NEW TRANSLATION
 USB_america_officer_corp_aggression_training: "Výcvik agresivity důstojnického sboru" # todo: NEW TRANSLATION
 USB_america_officer_corp_aggression_training_desc: "Naše schopnost postupovat vpřed spočívá výhradně v odpovědnosti důstojníků ve velení. Vnášet elán a odhodlání do jednotek a pochopení plánování a taktik pro postup vpřed a pochopení doktríny, kterou jsme pro naši armádu stanovili." # todo: NEW TRANSLATION
 USB_america_material_not_human_loss: "Materiálové ztráty, ne lidské ztráty" # todo: NEW TRANSLATION
 USB_america_material_not_human_loss_desc: "Nemůžeme si dovolit ztráty na životech našich lidí; navzdory metodám naší doktríny věříme, že naši vojáci jsou našimi nejlepšími aktivy. Proto musíme přepracovat naši logistiku, abychom kompenzovali ztráty na vybavení na úrovni odpovídající tomu, co se snažíme ušetřit na nákladech na pracovní sílu." # todo: NEW TRANSLATION
 USB_america_proactive_air_assaults: "Proaktivní vzdušné nálety" # todo: NEW TRANSLATION
 USB_america_proactive_air_assaults_desc: "Agrese v naší letecké síle nám umožní sestřelit nepřátelské stroje dřív, než si to uvědomí. Díky proaktivnímu výcviku, který simuluje pohotovost a adaptabilitu našich posádek a pilotů. Stručně řečeno by měli být schopni zvládat situace i falešné poplachy co nejrychleji a s maximální pružností v postupu, založenou na rychlém a kritickém zvažování situace a dostupných informací." # todo: NEW TRANSLATION
 USB_america_modern_maneuverability_courses: "Moderní kurzy manévrování" # todo: NEW TRANSLATION
 USB_america_modern_maneuverability_courses_desc: "Se vzestupem stealth technologií a rostoucími nároky na piloty se musíme preventivně vycvičit a adaptovat naše piloty tak, aby dokázali čelit scénářům s extrémním manévrováním, které by na ně vyvíjely nadměrné G-síly. To nás to bude stát, ale stojí to za dlouhodobé možnosti, které to může přinést." # todo: NEW TRANSLATION
 USB_america_redesigns_and_field_testing: "Přepracování a ověřování v terénu" # todo: NEW TRANSLATION
 USB_america_redesigns_and_field_testing_desc: "Porozumění jakýmkoli datům, která můžeme získat o stávajících letounech, nám umožní vytvářet lepší návrhy a zdokonalit výcvikové programy. To by mělo posílit schopnosti naší letecké síly jak v obraně, tak i v ofenzivních operacích." # todo: NEW TRANSLATION
 USB_america_air_corps_survivability_program: "Program přežití letecké eskadry" # todo: NEW TRANSLATION
 USB_america_air_corps_survivability_program_desc: "Program SP je iniciativou na inovaci způsobů, jak zajistit přežití jak pilota, tak i výbavy tam, kde je to možné. Přirozeně je prioritou vždy pilot, neboť trénink jedince k vydržení takových extrémů trvá zřejmě déle než vyrobit kus kovu a drátů." # todo: NEW TRANSLATION
 USB_america_rapid_response_protocols: "Protokoly rychlé reakce" # todo: NEW TRANSLATION
 USB_america_rapid_response_protocols_desc: "RRP je výcvik a revize standardního vybavení, které zlepšují schopnost provádět \"oprav v terénu\" na otevřeném moři. Přestože potvrzení návratu do přístavu je stále potřeba, realitou zůstává, že oprava je oprava, pokud je provedena správně." # todo: NEW TRANSLATION
 USB_america_streamlining_port_facilities: "Zefektivnění přístavních zařízení" # todo: NEW TRANSLATION
 USB_america_streamlining_port_facilities_desc: "Aby byla připravenost naší námořní síly zajištěna, musíme zefektivnit, aktualizovat a připravit zařízení pro přijímání lodí a výstavbu nových." # todo: NEW TRANSLATION
 USB_america_the_new_admiralty: "Nová admiralita" # todo: NEW TRANSLATION
 USB_america_the_new_admiralty_desc: "Naše lodě nic neznamenají, pokud lidé, kteří je velí, nic neví. Proto je rozsáhlá reforma výcviku a formování budoucích námořních velitelů naší nejvyšší prioritou." # todo: NEW TRANSLATION
 USB_america_hit_and_hit_again: "Útok a opětovný útok" # todo: NEW TRANSLATION
 USB_america_hit_and_hit_again_desc: "Pomocí strategických manévrů můžeme nepřítele zasypat salvami střeliva ve snaze ho dezorganizovat. Pokud dokážeme naše protivníky psychicky vyčerpat, můžeme dosáhnout vítězství více způsoby." # todo: NEW TRANSLATION
 USB_america_foreign_policy_debate: "Velká národní orientace" # todo: NEW TRANSLATION
 USB_america_foreign_policy_debate_desc: "S naší zemí stabilní, s jasnou hlavou a s tím, že ekonomika i potřeby civilistů jsou zajištěny, budeme debatovat o dalším velkém směru, kterým chceme naši zemi vést." # todo: NEW TRANSLATION
 USB_america_reclaim_the_mantle_of_destiny: "Znovuzískání pláště osudu" # todo: NEW TRANSLATION
 USB_america_reclaim_the_mantle_of_destiny_desc: "Mocenské vakuum je rozsáhlé a proto jsme jedinci, kteří ho zaplní. Ovládáme staré hlavní město a jádro našeho území tvoří federalistní prvky staré republiky. S vytrvalostí, odhodláním a dovednostmi zajistíme, že se naplní naše skutečné poslání a znovu získáme země staré říše pro slávu vyhlášení Druhé americké republiky." # todo: NEW TRANSLATION
 USB_america_war_plan_arcadia: "Válečný plán Arcadia" # todo: NEW TRANSLATION
 USB_america_war_plan_arcadia_desc: "Nejkratší fronta a podle našeho názoru nejslabší fronta je ta na severovýchodě. S tímto vědomím se musíme připravit, naplánovat a být připraveni na nadcházející severní nájezd." # todo: NEW TRANSLATION
 USB_america_battle_plan_albany: "Plán bitvy Albany" # todo: NEW TRANSLATION
 USB_america_battle_plan_albany_desc: "New York, země svobody pro ty, kteří se přistěhovali z dávného světa. Nyní je to protivník, kterého musíme získat, abychom zajistili náš plášť. Od Hudsonova zálivu po kanadskou hranici zajistíme symbol svobody, vpřed k vítězství!" # todo: NEW TRANSLATION
 USB_america_battle_plan_providence: "Plán bitvy Providence" # todo: NEW TRANSLATION
 USB_america_battle_plan_providence_desc: "Velký sever, který tvoří Nová Anglie, lesy na severu, představují naši největší překážku při zvážení jakýchkoli plánů. Přesto obsadíme vyspělejší region Nové Anglie a jistě jejich morálka klesne a pro nás bude zajištěno další vítězství." # todo: NEW TRANSLATION
 USB_america_war_plan_mississippi: "Válečný plán Mississippi" # todo: NEW TRANSLATION
 USB_america_war_plan_mississippi_desc: "Nejsme ani z poloviny na palubě, a proto je naším hlavním cílem zajistit vše východně od řeky Mississippi. Nejlepší přirozená hranice nám tímto zajistí naše rostoucí postavení na kontinentu." # todo: NEW TRANSLATION
 USB_america_battle_plan_gary: "Plán bitvy Gary" # todo: NEW TRANSLATION
 USB_america_battle_plan_gary_desc: "Velká jezera se stanou ještě většími, až znovu začleníme bývalá území naše. Ke kladům patří, že můžeme nepřítele zmást, zda je naším hlavním cílem dobytí Garyho, Indiana, nebo zda Gary sám vytvořil tento plán." # todo: NEW TRANSLATION
 USB_america_battle_plan_dixie: "Plán bitvy Dixie" # todo: NEW TRANSLATION
 USB_america_battle_plan_dixie_desc: "Do Dixielandu cestujeme, chlapci a dívky. Zajistíme, že každý Dixie chlapec pochopí, že bude vždy žít se Strýcem Samem." # todo: NEW TRANSLATION
 USB_america_securing_the_new_frontiers: "Zajištění nových hranic" # todo: NEW TRANSLATION
 USB_america_securing_the_new_frontiers_desc: "Předtím než budeme pokračovat v postupu na Pacifik, musíme zajistit a pod kontrolu převzaté území. Jednota před expanzí byla příčinou minulosti; nyní vytvoříme lepší budoucnost." # todo: NEW TRANSLATION
 USB_america_the_borderlands: "Pohraniční území" # todo: NEW TRANSLATION
 USB_america_the_borderlands_desc: "Postup naší asimilace musí být koordinovaný, a proto by měly být počáteční pohraniční oblasti naší hlavní starostí." # todo: NEW TRANSLATION
 USB_america_uniting_the_arcadians: "Sjednocení Arcadiánů" # todo: NEW TRANSLATION
 USB_america_uniting_the_arcadians_desc: "Severovýchod, kdysi dávno považovaný za součást koloniální francouzské Arcadie. Tito lidé mají výraznou kulturu, která se vyvíjela pod silnými britskými a jemnými francouzskými vlivy. Proto budeme pracovat na potlačení těchto vlivů a usilovat o sjednocení těchto zemí." # todo: NEW TRANSLATION
 USB_america_southern_culture_is_american: "Jižní kultura je americká" # todo: NEW TRANSLATION
 USB_america_southern_culture_is_american_desc: "Ačkoli to nebylo krvavé povstání, usilujeme o to, aby Jih zůstal pod naším vlivem. Namísto neúspěšných a střídavých politik dvou administrací zavedeme jednotnou a legální politiku integrace. Jih a jižní kultura jsou americkou kulturou a budou s ní nakládány. Jih nám přináší věci jako pohodlná jídla a sportovní fanatismus. Tyto věci jsou americké a budou takto uznány a respektovány." # todo: NEW TRANSLATION
 USB_america_midwestern_unity: "Středozápadní jednota" # todo: NEW TRANSLATION
 USB_america_midwestern_unity_desc: "Stejně jako Jih i Středozápad je znám pro své lovecké sezóny; a opět Středozápad přináší další verzi komfortního jídla a sportovních rivalit. Proto je Středozápad jen dalším dílem amerického puzzle a mělo by být jasné, že i když jde o kulturní podtyp, na konci jde o prosté staré červené, bílé a modré Američany." # todo: NEW TRANSLATION
 USB_america_cajun_dixie_and_us: "Cajun, Dixie a my" # todo: NEW TRANSLATION
 USB_america_cajun_dixie_and_us_desc: "Západní polovina bývalé Jižní republiky a jejich konfederátní předkové mají silnou vůli být nezávislí. Kulturní rozdíly v jejich vlivech a izolovanější části, které leží buď na západ od Mississippi, nebo východně od něj, jim dávají větší svobodu dělat, co chtějí. Přesto musíme pracovat na asimilaci těchto kultur, připomenout jim jejich podobnosti a sdílené hodnoty s jejich jižanskými a středozápadními bratry a sestrami." # todo: NEW TRANSLATION
 USB_america_war_plan_pacific: "Válečný plán Pacifik" # todo: NEW TRANSLATION
 USB_america_war_plan_pacific_desc: "Toto je začátek i příprava na konec. Druhý Manifest Destiny neboli, jak tomu někteří začali říkat, \"Americká křížová výprava\". Nakonec záleží jedině na tom, aby byla jednota a povinnost a aby byla americká identita znovu upevněna." # todo: CHANGED
 USB_america_battle_plan_alamo: "Plán bitvy Alamo" # todo: NEW TRANSLATION
 USB_america_battle_plan_alamo_desc: "Sam Houston ve své době chtěl založit národ, pro který by osadníci regionu mohli říkat domov. Bojovali zuby nehty s „Napoleonem Západu“, Santa Anna. A po vítězství požádali a označili svůj nový domov America. Vraťme mezi sebe Američany, o kterých svět věřil, že jimi jsme." # todo: NEW TRANSLATION
 USB_america_battle_plan_woundedknee: "Plán bitvy Wounded Knee" # todo: NEW TRANSLATION
 USB_america_battle_plan_woundedknee_desc: "Custer měl své proslulé poslední střetnutí při masakru u Wounded Knee. Nyní nebudeme tak bezohlední jako on, ale zajistíme potravinovou základnu republiky a připomeneme lidem, že ať je starý či nový, každý je Američan." # todo: NEW TRANSLATION
 USB_america_the_second_utah_war: "Druhá válka na Utahu" # todo: NEW TRANSLATION
 USB_america_the_second_utah_war_desc: "Už jsme téměř u Pacifiku; nyní nás kromě pohoří Rockies stojí v cestě i Mormonové. Budeme je porážet stejně jako tehdy ve 40. letech 19. století, protože budeme spojení od moře k zářivému moři." # todo: NEW TRANSLATION
 USB_america_battle_plan_cascadia: "Plán bitvy Cascadia" # todo: NEW TRANSLATION
 USB_america_battle_plan_cascadia_desc: "Kascadské hnutí je velmi čerstvé a nové; pokud je rychle odstraníme a vyhneme se zbytečnému boji v horách, můžeme těmto „lime lighters“ připomenout a uvědomit si skutečnost, že jsou jen Američany Pacifického pobřeží." # todo: NEW TRANSLATION
 USB_america_battle_plan_angels: "Plán bitvy Angels" # todo: NEW TRANSLATION
 USB_america_battle_plan_angels_desc: "Kalifornie, domov amerického snu a významných milníků americké historie, jako éra zlaté horečky. Město Andělů a hustě osídlené jižní pobřeží budou naším hlavním cílem a pravděpodobně nejjednodušší cestou. Pojďme vpřed a znovu dosáhněme hranic amerického snu." # todo: NEW TRANSLATION
 USB_america_west_of_the_mississippi: "Západně od Mississippi" # todo: NEW TRANSLATION
 USB_america_west_of_the_mississippi_desc: "Obrovská křížová výprava, měsíce a roky plánování, boje a podobně, jsou konečně za námi. Nyní se zaměřujeme na to, aby lidé těchto zemí na západ od Mississippi byly učeni a připomínáni, že jsou Američany a vždy jimi byli." # todo: NEW TRANSLATION
 USB_america_from_plains_to_rockies: "Z Planin na Skalnaté hory" # todo: NEW TRANSLATION
 USB_america_from_plains_to_rockies_desc: "Čím dále na západ jdeme, tím více se lidé cítí od vlády od cizího. Připomeňme jim jejich původ, historii a podobnost, abychom mohli tyto průkopnické země klidně reintegrovouvat dříve. Zvažme také možnost přesunu hlavního města, protože tento problém byl kdysi rallying cry mnoha secesních hnutí." # todo: NEW TRANSLATION
 USB_america_from_sea_to_shining_sea: "Od moře k lesklému moři" # todo: NEW TRANSLATION
 USB_america_from_sea_to_shining_sea_desc: "Skvělý druhý Manifest Destiny je dokončen a s velkými boji, útrapami a úsilím jsme dosáhli pacifických břehů. Nyní se americký sen může znovu realizovat a zářit v očích těch, kteří tvoří naši budoucnost." # todo: NEW TRANSLATION
 USB_america_the_great_administration: "Velká správa" # todo: NEW TRANSLATION
 USB_america_the_great_administration_desc: "Se sjednocením po celé zemi můžeme nyní zahájit reformu veřejné služby a správy, která je zoufale potrebná pro tak rozsáhlou a geograficky rozmanitou zemi." # todo: NEW TRANSLATION
 USB_america_capital_crisis: "Krize hlavního města" # todo: NEW TRANSLATION
 USB_america_capital_crisis_desc: "Jakmile je národ jednotný, musíme se zaměřit na největší bolák v naší situaci, a to na postavení a případnou polohu federálního hlavního města a s ním spojené federální vlády země. Musíme prozkoumat naše možnosti a zjistit, zda a kde bychom mohli umístit nové hlavní město, pokud chceme postupovat správně." # todo: NEW TRANSLATION
 USB_america_the_proclamation: "Velká proklamace" # todo: NEW TRANSLATION
 USB_america_the_proclamation_desc: "Je na čase uzavřít tuto kapitolu americké historie. První republika trvala téměř 300 let, déle než prakticky jakákoli republika dříve, neboť hlavním rysem nové republiky je přepracování jejich základního dokumentu. To je důvod, proč má Francie sedmou a Řekové kdoví jaké číslo; nicméně s touto novou republikou vstoupíme do nové epochy a budeme usilovat o budoucnost, kterou chceme." # todo: NEW TRANSLATION
 USB_america_the_great_shutdown: "Velké uzavření" # todo: NEW TRANSLATION
 USB_america_the_great_shutdown_desc: "Staré naděje a sny minulých dob jsou u konce, svět nás zklamal a my jsme ho zklamali. Zaměřme se na vnitřek a staňme se nejtvrdším oříškem k překonání. Pokud nemáme nic, čím bychom se rozptylovali, skutečně potřebujeme expandovat ven?" # todo: NEW TRANSLATION
 USB_america_self_embargo: "Totální embargo" # todo: NEW TRANSLATION
 USB_america_self_embargo_desc: "Totální embargo, jak mu někteří žertem říkají, je uzavření obchodu se světem. Nastavíme precedent, který se po staletí neviděl, a hodláme obstát a zlepšit životy našich občanů co nejméně zásahů. To výrazně poškodí naše ekonomické schopnosti, ale s velkým soustředěním a odhodláním můžeme najít novou cestu. Naše cesta." # todo: NEW TRANSLATION
 USB_america_every_citizen_a_job: "Každý občan má práci" # todo: NEW TRANSLATION
 USB_america_every_citizen_a_job_desc: "Se svým sebeembargem budeme muset zajistit ekonomickou stabilitu. S tímto v mysli musí být naše vzdělání a civilní služby flexibilní k těmto novým výzvám a k faktu, že nyní by každý občan, který je schopen, měl a bude mít práci. Tento fundamentální posun v ekonomice je revoluční a pravděpodobně nestabilní v nejlepším případě. Ale pokud se připravíme, soustředíme a správně koordinujeme, můžeme zajistit, že základy přežití budou splněny a že luxusy těchto ostatních národů budou dostupné, bude-li po nich touženo." # todo: NEW TRANSLATION
 USB_america_mandatory_service_period: "Povinné služební období" # todo: NEW TRANSLATION
 USB_america_mandatory_service_period_desc: "Abychom zajistili maximální připravenost našeho národa, musíme začít zavádět povinné služební období pro naše občany. Kromě toho bychom měli podporovat programy jako JROTC ve školách a lépe přizpůsobit naši společnost tak, aby byla více vojensky orientovaná." # todo: NEW TRANSLATION
 USB_america_ground_defense_is_air_defense: "Pozemní obrana je protivzdušná obrana" # todo: NEW TRANSLATION
 USB_america_ground_defense_is_air_defense_desc: "Program GDAD představuje řadu investic do výzkumu a vojenského výcviku, jejichž cílem je vybavit naše pozemní síly a připravit je na schopnost řádně se bránit a odolávat dlouhodobým nepřátelským leteckým bojovým operacím. Moderní válku určuje královna bojiště, kterou je letectvo, a jelikož náš národ není s vnějším světem příliš v kontaktu, musíme hledat způsob, jak tuto královnu vyvážit vhodným tvůrcem krále." # todo: CHANGED
 USB_america_warfare_beyond_the_grave: "Války na hřbitově" # todo: NEW TRANSLATION
 USB_america_warfare_beyond_the_grave_desc: "Války na hřbitově, tato nová doktrína čtvrté generace nám umožní ukázat, že Red Dawn je dětská hra. Váš odpor je věčný, neboť náš národ je věčný." # todo: NEW TRANSLATION
 USB_america_the_new_identity_plan: "Nové směřování" # todo: NEW TRANSLATION
 USB_america_the_new_identity_plan_desc: "Nemůžeme si namlouvat, že pokud znovu získáme staré země, budeme s nimi vytáčet svépomocí. Ale nemůžeme ani jen zavřít národ jako Japonec šógunát, takže musíme najít novou cestu. Naším cílem bude nové směřování, nová identita, na kterou mohou být naši lidé hrdí." # todo: NEW TRANSLATION
 USB_america_war_plan_gray_coat: "Válečný plán Šedý plášť" # todo: NEW TRANSLATION
 USB_america_war_plan_gray_coat_desc: "Od Atlantského oceánu po Mississippi je náš osud jasně stanoven. Náš první přímý plán, jak dosáhnout cílů, vychází z bývalé Konfederace. Ta má největší kontinuitu a zajistí naši velkou konsolidaci." # todo: NEW TRANSLATION
 USB_america_the_southeast: "Jihovýchod" # todo: NEW TRANSLATION
 USB_america_the_southeast_desc: "Blízkost pobřeží a neustálý rozvoj podél pobřeží umožní cílené investice a integrační snahy, které budou probíhat hladčeji než u méně rozvinutých států. Je to jen krůček k budoucnosti." # todo: NEW TRANSLATION
 USB_america_the_gulf_states: "Státy Gulfského pobřeží" # todo: NEW TRANSLATION
 USB_america_the_gulf_states_desc: "Zálivové pobřeží a přímé vnitrozemské státy z daného pobřeží jsou směsí rozvoje a opuštění. Zajistíme, aby se tyto státy necítily vyřazeny a budeme investovat do infrastruktury a cest, jak lépe integrovat a začlenit tyto státy do naší nové cesty vpřed." # todo: NEW TRANSLATION
 USB_america_war_plan_superior: "Válečný plán Nejvyšší" # todo: NEW TRANSLATION
 USB_america_war_plan_superior_desc: "Velká jezera a státy bývalého Rust Beltu jsou průmyslovým jádrem bývalé země i naší nové cesty vpřed. Zajistíme, že průmyslová síla bude součástí naší identity stejně jako jsme zajistili zemědělskou sílu Jihu jako naši identitu." # todo: NEW TRANSLATION
 USB_america_the_automotive_states_and_some: "Automobilové státy a některé" # todo: NEW TRANSLATION
 USB_america_the_automotive_states_and_some_desc: "Jádrem kdysi americké automobilové výroby byly Michigan, Ohio a Indiana, s tím, že Illinois měl také svůj díl. Avšak chceme-li postupovat po menší a systematické cestě integrace, zůstali jsme u těchto tří států a hraničního státu Kentucky. Tyto státy mají různorodé problémy a proto využijeme všeho, co lze, abychom zvýšili zaměstnanost a vyřešili jejich momentální potíže a lépe je začlenili do jejich nového domova v naší velké zemi." # todo: NEW TRANSLATION
 USB_america_the_northwest_region: "Severozápadní region" # todo: NEW TRANSLATION
 USB_america_the_northwest_region_desc: "Kabal státu, který nyní vytvoří naši přímou hranici s Kanadou a vývojem za řekou Mississippi, je skvělým ukázáním sportovnosti a jednoty prostřednictvím lovu a sportu. Tyto časem prověřené tradice použijeme k tomu, abychom spojili obyvatele těchto států a přijali novou realitu a pochopili, že ne všechno je vždy špatné." # todo: NEW TRANSLATION
 USB_america_war_plan_north_atlantic: "Válečný plán Severní Atlantik" # todo: NEW TRANSLATION
 USB_america_war_plan_north_atlantic_desc: "Poslední hranice pro naši novou identitu, region Velká Nová Anglie. Budeme se muset připravit na boje ve městských, horských a džungle-like prostředích, pokud chceme účinně bojovat a získat tyto státy zpět." # todo: NEW TRANSLATION
 USB_america_liberty_prime: "Liberty Prime" # todo: NEW TRANSLATION
 USB_america_liberty_prime_desc: "Hojnost svobody a symbol svobody, kterým je Socha svobody, stát New York je velmi jedinečný a těžko řešitelný oříšek. Jako stát ghett a multikulturalismu se musíme učit, studovat a porozumět nejen tomu, co znamená být Newyorčan kulturně, ale také jak je přesvědčit, že mezi sebou a námi v rámci společného cíle a budoucnosti není žádný opravdový rozdíl; musíme oslovit jejich jedinečnost a pravděpodobně jim nabídnout autonomii, aby byl zajištěn soulad a spolupráce." # todo: NEW TRANSLATION
 USB_america_new_england_old_habits: "Nová Anglie, staré zvyky" # todo: NEW TRANSLATION
 USB_america_new_england_old_habits_desc: "Navzdory kulturnímu významu států Nové Anglie tito lidé nejsou upřímně řečeno ničím jiným než zbytek národa. Určité zvyky a společné rysy v národních zvycích ukazují, že i když jsme jiní, sdílíme stále značnou část naší identity. Proto je načase připomenout těmto lidem, že jsme všichni kamarádi, rodina a že chápeme chyby minulosti, abychom mohli vytvořit lepší zítřek." # todo: NEW TRANSLATION
 USB_america_the_arcadian_identity: "Arcadianský osud" # todo: NEW TRANSLATION
 USB_america_the_arcadian_identity_desc: "Nadešel čas; ukončíme tuto kapitolu i tuto velkou stránku v historii. Vezmeme si myšlenky a ideály dávných časů, poučení z minulosti a dokonce i z minulého týdne a vyrazíme na nový začátek. Jsme jasný motýl, který je připraven rozprostřít křídla a vyletět za hranice našich snů. Jsme Arcadia." # todo: NEW TRANSLATION
 the_dust_settles: "Prach se usadil... Co teď?" # todo: NEW TRANSLATION
 FS_established_elections: "Volby byly znovu zavedeny" # todo: NEW TRANSLATION
 FS_continued_election_ban: "Volby byly zastaveny" # todo: NEW TRANSLATION
 USB_UFSR_desc: "[USB.GetFlag]§YSvobodné státy Ameriky§! Změní název na §YSvaz svobodných socialistických republik§!" # todo: NEW TRANSLATION
 USB_MidAtlantic_Union_desc: "[USB.GetFlag]§YSvobodné státy Ameriky§! Změní název na §YStředněatlantická vojenská unie§!" # todo: NEW TRANSLATION
 USB_MidAtlantic_States_desc: "[USB.GetFlag]§YSvobodné státy Ameriky§! Změní název na §YStředněatlantická federální unie§!" # todo: NEW TRANSLATION
 USB_second_american_republic_desc: "[USB.GetFlag]§YSvobodné státy Ameriky§! Změní název na §YDruhá americká republika§!" # todo: NEW TRANSLATION
 USB_arcadia_path_desc: "[USB.GetFlag]§YSvobodné státy Ameriky§! Změní název na §YArcadie§!" # todo: NEW TRANSLATION
 free_states_idea_isolationist_focused_foreign_office: "Izolační zahraniční kancelář" # todo: NEW TRANSLATION
 free_states_idea_isolationist_focused_foreign_office_desc: "S absolutním stavem naší země se většina jmen do zahraniční kanceláře jeví jako snadný přivýdělek. To je příčina těžké apatie vyplývající z toho, že znovu budujeme společnost. Přesto jak budeme rozvíjet a prosperovat, můžeme hledět na jasnější horizonty v budoucnu." # todo: NEW TRANSLATION
 free_states_idea_neighborhood_foreign_policy: "Sousedská zahraniční politika" # todo: NEW TRANSLATION
 free_states_idea_neighborhood_foreign_policy_desc: "Se národem na historickém vrcholu co do ekonomiky, stejně jako vojenského a politického vývoje, jsme zaznamenali nedávný nárůst zahraničního zájmu. Protože stále ještě musíme zjistit, co skutečně chceme dělat, připravíme se na jednání s okolím podle toho, jak to uznáme za vhodné. Tento krok vpřed je jen jednoduchým faktem, že brzy dosáhneme významnosti a znovu se staneme součástí globální scény." # todo: NEW TRANSLATION
 free_states_idea_naval_budget_priorities: "Priorita rozpočtu pro námořnictvo" # todo: NEW TRANSLATION
 free_states_idea_naval_budget_priorities_desc: "Většina zbylého vojenského potenciálu z bývalého řádu je poměrně zapojena do námořnictva, a tak se naše rozpočtové priority začínají odrážet v těchto vlivech. Avšak jak užitečný je ten vliv, když máme záda k pevnině a ne nutně k moři." # todo: NEW TRANSLATION
 free_states_idea_army_defensive_budgeting: "Armádní obranný rozpočet" # todo: NEW TRANSLATION
 free_states_idea_army_defensive_budgeting_desc: "Moderní války lze vyhrát velmi rychle nebo velmi pomalu. Moderní civilista má k dispozici více moci, než si většina lidí uvědomuje, a přesto si to uvědomujeme. Naše moderní doktrína zkombinuje aspekty čtvrté generace válek se standardní atricionální doktrínou. Zajišťuje mobilní obranu s co nejnižšími náklady na materiál i personál. Tuto novou doktrínu nazýváme DEW neboli Defenzivní výdajová válka." # todo: NEW TRANSLATION
 free_states_idea_naval_renovations_budget: "Rozpočet na modernizaci námořnictva" # todo: NEW TRANSLATION
 free_states_idea_naval_renovations_budget_desc: "Vzhledem k naší situaci a rozsahu našeho pobřeží, které je v nejlepším případě podstatné a v horším obrovské, musíme investovat do rekonstrukce a modernizace celé naší flotily, pokud chceme vůbec pomyslet na obranu proti rozlehlým oceánům a těm, kteří se snaží přistát na našich březích." # todo: NEW TRANSLATION
 free_states_idea_foreign_relations_act: "Zákon o zahraničních vztazích" # todo: NEW TRANSLATION
 free_states_idea_foreign_relations_act_desc: "Zákon o zahraničních vztazích je diplomatickou investicí spočívající v oslovení zahraničních mocností za účelem získání lepších obchodních dohod a programů výměny pracovníků. Celkově poroste naše ekonomika, avšak politické schopnosti budou zatíženy snahou udržet tyto závazky." # todo: NEW TRANSLATION
 free_states_idea_domestic_priority_policy: "Domácí prioritní politika" # todo: NEW TRANSLATION
 free_states_idea_domestic_priority_policy_desc: "DPP je ideálem prosazování domácí politiky a blahobyt národa a jeho občanů je hlavní prioritou. Musíme zajistit, že naše národní obrana je zajištěna; tento více uzavřený přístup znamená, že zahraniční politika musí upřednostňovat bezpečnost naší země. Proto jsou v tomto plánu jako hlavní myšlenky obchod a národní obrana." # todo: NEW TRANSLATION
 free_states_idea_diplomatic_corps: "Diplomatický sbor" # todo: NEW TRANSLATION
 free_states_idea_diplomatic_corps_desc: "Nepřátelé i přátelé se objevují ve všech tvarech a velikostech, takže abychom poznali, kdo je kdo, musíme mít špičkový diplomatický sbor, který zajistí, že informace o vztazích budou známy co nejrychleji, když nastanou radikální změny." # todo: NEW TRANSLATION
 free_states_idea_national_labor_corps: "Národní pracovní sbor" # todo: NEW TRANSLATION
 free_states_idea_national_labor_corps_desc: "Kombinace trestně-pracovního a civilně orientovaného vyhrazeného pracovního sboru, který pomáhá lidem v nouzi najít práci či příjem a umožňuje využít ty, kteří se pokusili společnosti ublížit, k návratu do ní. Celkově bude NLC sloužit k růstu a udržování stále se rozšiřujícího aparátu naší spravedlivé země." # todo: NEW TRANSLATION
 FSA_america_military_surplus_jobs: "Pracovní místa ve vojenském přebytku" # todo: NEW TRANSLATION
 FSA_america_military_surplus_jobs_desc: "Produkce vojenské výstrojě pro armádu, ať už zbraně, nebo třeba kantiny, ze kterých vojáci pijí, má v každém ohledu svůj význam. Proto je lepší řešení nezaměstnanosti než pasivní využívání vojenského průmyslu jako prostředku k získání více výstroje a zásob pro naše obránce, a zároveň k získání příjmu pro ty, kteří stále hledají civilní práci." # todo: NEW TRANSLATION
 free_states_idea_extreme_mining_projects: "Extrémní těžební projekty" # todo: NEW TRANSLATION
 free_states_idea_extreme_mining_projects_desc: "Ač někteří to nazývají nezodpovědnou těžbou, i nadále jsme si vybudovali téměř mezinárodní uznání díky rozsáhlým a často extrémním těžebním operacím. Z velké části lidé takový „krutý mining“ nemají rádi, ale nemůžeme ignorovat potenciální páky, které můžeme získat nad ostatními národy v obchodních dohodách a prospěchu našich občanů prostřednictvím obchodních komodit." # todo: NEW TRANSLATION
 free_states_idea_strategic_autarky: "Strategická autarkie" # todo: NEW TRANSLATION
 free_states_idea_strategic_autarky_desc: "Program Strategická Autarkie (SAP) je národní strategická iniciativa, která má zajistit, že naše obchodní dohody budou omezené a že dohody, které uzavřeme, budou zabezpečené pro prospěch našich občanů. Možná to není nejpřijatelnější strategie v mezinárodních vztazích, ale musíme se chránit." # todo: NEW TRANSLATION
 free_states_idea_consumer_complex_initiative: "Iniciativa spotřebitelského komplexu" # todo: NEW TRANSLATION
 free_states_idea_consumer_complex_initiative_desc: "CCI je ekonomický model, který klade spotřebitelské průmysly jako hlavní základ a organizaci ekonomiky. S tímto záměrem jsou obranné průmysly či specializované průmysly, označované jako tzv. „Sektor důstojníků“ ekonomiky, považovány za sekundární a spíše doplňkové části Spotřebitelského komplexu podle národních potřeb. To s sebou sice nese, že výstavba takových věcí trpí, ale pokud jsou naši lidé dobře zajištěni, koho to zajímá." # todo: NEW TRANSLATION
 free_states_idea_economic_efficiency_model: "Model ekonomické efektivity" # todo: NEW TRANSLATION
 free_states_idea_economic_efficiency_model_desc: "Když se říkalo, že se má stavět vysoko, většina lidí si myslela, že budovy obecně vyžadují více lidí na jednom místě. S naším novým ekonomickým plánem EEM však můžeme zajistit, že stavba vysokých budov bude také ekonomický model. Tím, že se zaměříme na průmysly způsobem, jak dosáhnout vyšší produkce z menších zdrojů, dokážeme zajistit omezené náklady na suroviny a zároveň udržet vyvážený a efektivní růst." # todo: NEW TRANSLATION
 free_states_idea_military_readiness_model: "Model vojenské pohotovosti" # todo: NEW TRANSLATION
 free_states_idea_military_readiness_model_desc: "MRM je ekonomický model, který se zaměřuje na preventivní militarizaci ekonomiky. Znamená to, že továrny a průmysl jsou budovány s předpokladem, že mohou být převedeny na válečnou výrobní kapacitu. To umožňuje ekonomice fungovat udržitelným způsobem, ale může být vysoce adaptabilní, pokud by to bylo potřeba." # todo: NEW TRANSLATION
 free_states_idea_department_for_synthetic_development: "Oddělení pro syntetický vývoj" # todo: NEW TRANSLATION
 free_states_idea_department_for_synthetic_development_desc: "Všichni vědí, že fosilní paliva jsou omezená, ale co když bychom je mohli protáhnout co nejvíce podle vědeckých poznatků. Přichází tedy DSD, oddělení věnované výzkumu a vývoji, které zjistí, kde leží tento limit a jaké syntetické produkty budoucnosti můžeme vyrábět, ať už plasty, nylony nebo určité chemikálie či maziva součástí petrochemického průmyslu. Využíváme minulost k vytvoření budoucnosti." # todo: NEW TRANSLATION
 free_states_idea_department_for_energy_innovation: "Oddělení pro energetické inovace" # todo: NEW TRANSLATION
 free_states_idea_department_for_energy_innovation_desc: "Abychom mohli tvrdit, že používáme budoucnost, musíme zajistit, že vědecky je skutečná budoucnost. Proto je DEI věnováno úkolu objevovat a zkoumat inovace v energetické výrobě a také efektivnější způsoby spotřeby energie bez plýtvání tam, kde je to možné." # todo: NEW TRANSLATION
 free_states_idea_infrastructure_readiness_act: "Zákon o připravenosti infrastruktury" # todo: NEW TRANSLATION
 free_states_idea_infrastructure_readiness_act_desc: "Zákon o připravenosti infrastruktury je v podstatě vyhlášením boje proti nespokojeným a lenosti, pokud jde o zachování infrastruktury naší země. Stanovením intervalů pro inspekce a předběžného plánování termínů výstavby a nákupu materiálů umožní rychlou opravu a údržbu naší infrastruktury a zároveň omezí vliv na každodenní život místních obyvatel." # todo: NEW TRANSLATION
 free_states_idea_military_high_command: "Jednotné vojenské vrchní velení" # todo: NEW TRANSLATION
 free_states_idea_military_high_command_desc: "S nyní centralizovaným vrchním velením (Top leadership) můžeme rozšířit, vycvičit, rozvíjet a dále posílit naše ozbrojené síly a jejich schopnosti." # todo: NEW TRANSLATION
 free_states_idea_defensive_officers_school: "Škola obranných důstojníků" # todo: NEW TRANSLATION
 free_states_idea_defensive_officers_school_desc: "Musíme pochopit, jak obstát, s vysoce specializovaným výcvikem, který nám umožní získat víc z méně a skutečně zvládat naše obranné iniciativy proti bezohlednému nepříteli." # todo: NEW TRANSLATION
 free_states_idea_the_bulwark_doctrine: "Doktrína Bulwark" # todo: NEW TRANSLATION
 free_states_idea_the_bulwark_doctrine_desc: "Doktrína Bulwark je naším zásadním posunem v ochraně obrany a ducha našeho národa. Pochopení toho, jak využít terén, logistiku a schopnost bránit se až do smrti, aniž by všichni podlehli. Tato doktrína určí, zda přežijeme, nebo budeme ztraceni zkouškami času." # todo: NEW TRANSLATION
 free_states_idea_the_fighter_defense_doctrine: "Doktrína stíhací obrany" # todo: NEW TRANSLATION
 free_states_idea_the_fighter_defense_doctrine_desc: "Bránění naší oblohy nám umožňuje zabezpečit naše pozemní síly. Proto musíme specializovat náš letecký výcvik a výrobu tak, aby naše vzdušné síly měly nadřazenost." # todo: NEW TRANSLATION
 free_states_idea_the_increasing_defensive_capabilites: "Zvyšování obranných schopností" # todo: NEW TRANSLATION
 free_states_idea_the_increasing_defensive_capabilites_desc: "Program IDC využívá postupy výroby našich letounů k prospěchu a pomoci našim pilotům dělat ve vzduchu věci, které by běžní piloti nedokázali. Inovace radaru, vylepšení tahu a řízení letu a podobně. Budeme strážci vzdušného prostoru naší země a každý den bude jasný." # todo: NEW TRANSLATION
 free_states_idea_naval_mining_warfare_refinement_program: "Program zdokonalování námořní minové války" # todo: NEW TRANSLATION
 free_states_idea_naval_mining_warfare_refinement_program_desc: "Program zdokonalování námořního minového válčení je specializovaný výcvikový a zdokonalovací institut, který má vycvičit a vylepšit naši námořní sílu v oblasti mořských min a minového boje." # todo: NEW TRANSLATION
 free_states_idea_armored_assault_assist_groups: "Asistenční skupiny obrněných útoků" # todo: NEW TRANSLATION
 free_states_idea_armored_assault_assist_groups_desc: "AAAG neboli Triple AG je bitevní doktrína, která se zaměřuje na lokalizaci i specializaci obrněných jednotek, aby podpořila naši jádrovou armádu v průlomu a rozdělení nepřátelských sil." # todo: NEW TRANSLATION
 free_states_idea_aggressive_officer_corps: "Aggresivní důstojnický sbor" # todo: NEW TRANSLATION
 free_states_idea_aggressive_officer_corps_desc: "Přetvoření našich výcvikových programů a vojenských akademií umožní našemu vedení býti agresivními způsoby, jakých jsme dosud neviděli. To s sebou jistě přinese náklady, ale přesto zajistíme, že pokud budeme napadeni, nepřítel bude litovat, že takovou volbu učinil." # todo: NEW TRANSLATION
 free_states_idea_material_not_human_loss: "Materiál lze nahradit, ale zkušení a vycvičení vojáci nelze nahradit; zajistíme tréninkové styly, které potenciální ztráty vybavení považují za jistotu, avšak ztráta spolubojovníků je nenahraditelná." # todo: NEW TRANSLATION
 free_states_idea_material_not_human_loss_desc: "Vybavení lze nahradit, ale zkušené a vycvičené vojáky nelze; zajistíme výcvikové postupy, které předpokládají, že ztráta vybavení je jistá, zatímco ztráta spolubojovníků je nenahraditelná." # todo: NEW TRANSLATION
 free_states_idea_survivability_program: "Program odolnosti" # todo: NEW TRANSLATION
 free_states_idea_survivability_program_desc: "Musíme zajistit inovace v odolnosti; v této souvislosti budeme zkoumat zdokonalování a rozvoj takových způsobů, které maximalizují nejen přežití personálu, ale pokud možno i odolnost vybavení." # todo: NEW TRANSLATION
 free_states_idea_admirable_admiralty: "Obdivuhodná Admirálie" # todo: NEW TRANSLATION
 free_states_idea_admirable_admiralty_desc: "Zručnost a přirozené nadání našich námořních vůdců jsou vrcholem toho, jak zajišťujeme naši námořní převahu." # todo: NEW TRANSLATION
 FSA_america_hit_and_hit_again: "Zasažte je a poté zasažte znovu" # todo: NEW TRANSLATION
 FSA_america_hit_and_hit_again_desc: "Zkoušeli jste někdy psychologickou válku loděmi? Teď už to lze. Specializací a porozuměním slabin naší vlastní druhu můžeme řídit naše boje tak, aby po dezorientaci nepřátelských posádek došlo k rychlým, přesným zásahům, které zasáhnou schopnosti nepřátelské flotily." # todo: NEW TRANSLATION
 free_states_idea_the_assimilation_program: "Program asimilace" # todo: NEW TRANSLATION
 free_states_idea_the_assimilation_program_desc: "Vytvoření nové identity ze starých myšlenek bývá pro jednotlivce a idealistické lidi obtížné. Proto musíme zvrátit tyto předsudky a pracovat na potlačení pokroku takových rušivých sklonů." # todo: NEW TRANSLATION
 free_states_idea_the_second_american_republic: "Druhá americká republika" # todo: NEW TRANSLATION
 free_states_idea_the_second_american_republic_desc: "Krví, potem, slzami a mnoha dalšími zkouškami jsme vyhledali poslání a zajistili náš osud. Obnovujeme americký sen a vytváříme Druhou americkou republiku; kapitola v tomhle díle svobody, kterou zakladatelé zapsali již v roce 1776, se konečně otočila. K novému věku, novému světlu a nové budoucnosti pro naši novou republiku." # todo: NEW TRANSLATION
 free_states_idea_the_self_made_embargo: "Vlastnoručně vyrobené embargo" # todo: NEW TRANSLATION
 free_states_idea_the_self_made_embargo_desc: "Moderní technologie, které máme, a metody syntetického zpracování umožňují autarkické a izolacionistické názory lépe realizovat než kdy dříve. Tím stanovíme moderní precedent, který nebyl viděn od dob šógunátu Japonska." # todo: NEW TRANSLATION
 free_states_idea_ground_to_air_dominance: "Nadvláda pozemních sil nad vzduchem" # todo: NEW TRANSLATION
 free_states_idea_ground_to_air_dominance_desc: "Nemáme kam utéct, tak přestaňte utíkat a začněte bojovat. Významné investice do praktických pozemně–vzdušných bojových schopností nám umožní obstát v jakékoliv moderní vzdušné válce nad našimi oprávněnými zeměmi. Navíc dodané vybavení může napomoci i při podzemní válce, pokud části našeho území budou obléhány." # todo: NEW TRANSLATION
 free_states_idea_graveyard_warfare_doctrine: "Doktrína války na pohřebišti" # todo: NEW TRANSLATION
 free_states_idea_graveyard_warfare_doctrine_desc: "Doktrína Graveyard Warfare, neboli Doktrína války na pohřebišti, je komplexní doktrína související s asymetrickým bojem či čtvrtou generací války. Tato občanská válečná doktrína učiní z boje pro cizí moc peklo, pokud chce podmanit nás a náš lid." # todo: NEW TRANSLATION
 free_states_divided_we_fell: "Rozděleni padáme" # todo: NEW TRANSLATION
 free_states_divided_we_fell_desc: "Republika už neexistuje, jsme jen stínem toho, čím jsme bývali. Země hoří, lidé umírají, prchají či přežívají. To však znamená, že i když jsme na svém, naši sousedé na severu i jihu dostávají určitou pomoc v souvislosti s největší humanitární krizí na kontinentech Nového světa. Cesta je zlomyslná, plná překážek, ale musíme pokračovat a doufat, že najdeme nějaký horizont." # todo: NEW TRANSLATION
 free_states_federal_budgets: "Federální rozpočtové politiky" # todo: NEW TRANSLATION
 free_states_federal_budgets_desc: "Abychom zajistili prosperitu, musíme vyrovnat své účetnictví. Musíme se učit ze světa kolem nás a pochopit, že dluh je číslo, které je třeba pochopit a neignorovat." # todo: NEW TRANSLATION
 free_states_domestic_policies: "Domácí politiky" # todo: NEW TRANSLATION
 free_states_domestic_policies_desc: "Musíme usilovat o lepší podmínky pro naše lidi, budovat nejen naši zemi, ale i občany a kulturu, která tvoří domov, který nazýváme domovem." # todo: NEW TRANSLATION
 free_states_industrial_policies: "Odbor průmyslových záležitostí" # todo: NEW TRANSLATION
 free_states_industrial_policies_desc: "DoIA neboli někdy označovaný jako IAA, Industrial Affairs Administration, je vládní větev určená k regulaci, zjednodušení a formování naší ekonomiky. Působí souběžně s DoM při vytváření vyvážených předpisů a plánů pro růst, diverzifikaci a udržení ekonomiky naší země pod kontrolou. Zatímco DoM řeší alokaci zdrojů a organizaci uvedených zdrojů, IAA řeší plánování a inovace v rámci podniků, které tyto zdroje využívají." # todo: NEW TRANSLATION
 free_states_resource_management_policies: "Odbor správy zdrojů" # todo: NEW TRANSLATION
 free_states_resource_management_policies_desc: "Odbor správy zdrojů, neboli DoM, je vládní agentura zaměřená na obnovu a přepracování společnosti samotné. Tím, že bude oddělení plně soustředěno na dostupné zdroje, a v tomto případě i na ty, které nejsou k dispozici, umožní stanovovat priority a nalézat způsoby, jak vytvořit více za méně. Toto oddělení bude klíčové pro nastavení kurzu našeho rozvoje a našeho otisku, který zanecháme v historii." # todo: NEW TRANSLATION
 free_states_tax_policies: "Daňové politiky" # todo: NEW TRANSLATION
 free_states_tax_policies_desc: "Abychom mohli měřit náš pokrok, musíme mít stabilní a adaptabilní daňový systém. Tento systém se musí přizpůsobovat potřebám našich lidí a národnímu zájmu, který zajistí naši budoucnost a cestu, kterou budeme kráčet, abychom ji prosadili." # todo: NEW TRANSLATION
 free_states_army_service_branch: "Armádní služební větev" # todo: NEW TRANSLATION
 free_states_army_service_branch_desc: "Základ národní obrany a jádro naší armády. Abychom zachovali naši zemi a její lidi, musíme reformovat a zřídit bojovou sílu, která bude schopna nejen držet naši domovinu, ale i čelit nepřátelům, kteří ohrožují náš způsob života." # todo: NEW TRANSLATION
 free_states_air_force_service_branch: "Letecká služba" # todo: NEW TRANSLATION
 free_states_air_force_service_branch_desc: "Ačkoliv páteří zůstává armáda, královnou bojiště není země, nýbrž vzduch; s letectvem. Musíme držet krok s našimi nepřáteli, abychom skutečně chránili naši zemi. Co nebylo možné na zemi napadnout, lze aspoň zaútočit ze vzduchu." # todo: NEW TRANSLATION
 free_states_navy_service_branch: "Námořní služba" # todo: NEW TRANSLATION
 free_states_navy_service_branch_desc: "Námořnictvo je štít, který odkládá a varuje nás před záměry nepřítele. Musíme mít silné námořnictvo, abychom vytvořili odstrašování a byli schopni chránit naši domovinu před hrozbami za hranicemi." # todo: NEW TRANSLATION
 free_states_idea_hit_them_again_doctrine: "Doktrína opakovaných úderů" # todo: NEW TRANSLATION
 free_states_idea_hit_them_again_doctrine_desc: "Když na někoho vrhnete všechno, buď panikaří, couvá nebo ztrácí soudržnost. Využijeme tedy tuto myšlenku zavedením nového způsobu vedení boje proti nepříteli. Připravením flotily či válečné lodi tak, aby bylo možné doslova vrhnout na nepřítele vše najednou, vyvolá dezorientaci, která umožní rychlou přípravu přesného úderu k způsobení kritických zásahů nebo vyradění nepřátelských plavidel." # todo: NEW TRANSLATION
 USA_colorado_capital: "Hora Columbia" # todo: NEW TRANSLATION
 USA_kansas_capital: "Nový Arlington" # todo: NEW TRANSLATION
 USA_missouri_capital: "Winfield" # todo: NEW TRANSLATION
 USB_formalizing_the_fighting_brigades: "Formalizace bojových brigád" # todo: NEW TRANSLATION
 USB_formalizing_the_fighting_brigades_desc: "Zatímco se stále snažíme dát dohromady síly, nikdy nevíme, co by mohl nepřítel podniknout. Proto vytvoříme Federální bojovníky jako druh rychlé jednotky Národní gardy. Vždyť něco je lepší než nic." # todo: NEW TRANSLATION
 USB_decisions_war_time_mobilization_category: "Válečná mobilizace" # todo: NEW TRANSLATION
 USB_decisions_war_time_mobilization_category_desc: "Nadejde čas bránit naše země a utvářet náš osud. Vyzbrojme se a bráněme naše země a památky, které obstojí času samotného." # todo: NEW TRANSLATION
 USB_war_time_mobilization: "Mobilizace první vlny" # todo: NEW TRANSLATION
 USB_war_time_mobilization_desc: "Přichází čas, bránit Washington a naše federální svobody, za které stojíme. Budeme bránit!" # todo: NEW TRANSLATION
 USB_war_second_wave_defenders: "Obránci druhé vlny" # todo: NEW TRANSLATION
 USB_war_second_wave_defenders_desc: "Nepřítel tlačí dopředu, musíme tedy doplnit další vlnu obránců. Morálka národa utrpí, ale potřebujeme jednotky." # todo: NEW TRANSLATION
 USB_war_desperate_defenders: "Zoufalí obránci" # todo: NEW TRANSLATION
 USB_war_desperate_defenders_desc: "Situace se zhoršuje, potřebujeme každého dostupného člověka, ať už schopen, či nikoliv, abychom udrželi linii. Možná, že i tak to ještě vyhrajeme." # todo: NEW TRANSLATION
 USB_creating_infantry_reserves: "Vytváření pěchotních rezerv" # todo: NEW TRANSLATION
 USB_creating_infantry_reserves_desc: "Naše země se stále obnovuje a i když máme jednu nohu venku, je stejně pravděpodobné, že zakopneme i s druhou nohou. Proto musíme vytvořit připravenou rezervní sílu, abychom se mohli připravit na budoucnost, ať už to přinese cokoli." # todo: NEW TRANSLATION
 USB_mobilizing_the_reserves: "Mobilizace rezerv" # todo: NEW TRANSLATION
 USB_mobilizing_the_reserves_desc: "Přišel čas začít s aktivní obranou naší země. Začněme s mobilizací, abychom byli připraveni na nadcházející boje." # todo: NEW TRANSLATION
 post_united_event.1.t: "Frakční rozkol ve Svobodných státech" # todo: NEW TRANSLATION
 post_united_event.1.d: "V rychlém sledu událostí, které se točí kolem společnosti známé jako Svobodné státy Ameriky, vyústila dosavadní federální vláda tohoto zbytku národa v sérii silných frakcí. Tyto frakce se dělí na čtyři skupiny, jak je mnozí vidí. Tyto skupiny tvoří socialisté na severu, militaristé na východě, monarchisté na jihu a federalisté ve středozápadě. Tyto frakce se sjednotily do dvou hlavních frakcí; další se objeví, jak zjistíme nové detaily." # todo: NEW TRANSLATION
 post_united_event.1.o1: "Nedělili jsme se už dost?" # todo: NEW TRANSLATION
 post_united_event.2.t: "Skupina pro volby" # todo: NEW TRANSLATION
 post_united_event.2.d: "V rostoucí politické frakční polarizaci jsme svědky vzestupu pro-voličských skupin, jako jsou Federalistická strana, Svobodná Socialistická strana a Moderní monarchistická strana. Tyto strany, ačkoliv jejich cíle a podstata jsou různorodé, se shodly na základním principu voleb – uznání, že volební systém by měl být co nejvíce reprezentativní vzhledem k současnému stavu věcí. Mnozí stále doufají, že volba pro budoucnost nás v dlouhodobém horizontu spojí spíše než rozdělí, ale čas to ukáže." # todo: NEW TRANSLATION
 post_united_event.2.o1: "Pojďme volit pro budoucnost, kterou chceme" # todo: NEW TRANSLATION
 post_united_event.3.t: "Skupina proti volbám" # todo: NEW TRANSLATION
 post_united_event.3.d: "Na druhé straně máme strany proti volbám, které se skládají ze Federalistické strany, Strany svobodného socialismu a Strany Spojených služeb. Jak je zřejmé, frakční rozkol, jenž rozděluje dvě hlavní strany, Federalistickou a Stranu svobodného socialismu, zřejmě zásadně rozdělí potenciální budoucí kandidátky, pokud by volby byly konány. Ačkoli o stavu těchto rozkolů víme jen málo, uvidíme, co se z toho vyklube v nadcházejících dnech, jak debata bude pokračovat." # todo: NEW TRANSLATION
 post_united_event.3.o1: "Musíme se soustředit, ne debatovat." # todo: NEW TRANSLATION
 post_united_event.4.t: "Rozdělující průzkum veřejného mínění" # todo: NEW TRANSLATION
 post_united_event.4.d: "V uplynulých několika týdnech průzkumníci veřejného mínění a novináři projížděli zemi v jakémsi pseudo volebním schématu, které je \"Národní průzkum\", a které rozdělilo mnoho lidí na to, kterou cestu bychom se měli skutečně ubírat. Nakonec se mnozí shodli, že volby, a to i v tomto období, slouží jen jako rozptýlení v oslabeném a zraněném stavu, v němž se nacházíme. Nyní je na čtyřech hlavních stranách, aby ovlivnily veřejné mínění ve svůj prospěch. Federalistická strana a jejich konzervativnější frakce, Strana svobodného socialismu s její statistickou frakcí, Strana Středního Atlantiku s její isolacionistickou frakcí nebo Strana Národní služby s její militaristickou frakcí. Všechny chtějí jiné věci, ale vše chtějí i to samé. Žádné volby a větší soběstačná identita pro předvídatelnou budoucnost." # todo: NEW TRANSLATION
 post_united_event.4.o1: "Federalisté zvítězili" # todo: NEW TRANSLATION
 post_united_event.4.o2: "Vítězství FSP: Komunitní vítězství" # todo: NEW TRANSLATION
 post_united_event.4.o3: "\"MAP\" Izolacionistické upevnění moci" # todo: NEW TRANSLATION
 post_united_event.4.o4: "NSP vyhrává další bitvu" # todo: NEW TRANSLATION
 post_united_event.5.t: "První volby" # todo: NEW TRANSLATION
 post_united_event.5.d: "Se volbami znovu obnovenými je nyní čas, aby byly odevzdány hlasy a lid vybral směr, kterým chce jít. Federalistická strana, Strana svobodného socialismu, Strana Středního Atlantiku a Strana Národní služby usilují o veřejnou podporu, aby získaly zajištěnou většinu ve volbách. Ale s postupem času a sečítáním hlasů bude vítěz prvních oficiálních voleb určen." # todo: NEW TRANSLATION
 post_united_event.5.o1: "Federalisté zvítězili" # todo: NEW TRANSLATION
 post_united_event.5.o2: "Vítězství Strany svobodného socialismu" # todo: NEW TRANSLATION
 post_united_event.5.o3: "Zjevně zvítězila Strana Středního Atlantiku" # todo: NEW TRANSLATION
 post_united_event.5.o4: "Strana Národní služby přináší vítězství" # todo: NEW TRANSLATION
 post_united_event.1000.t: "Velká otázka" # todo: NEW TRANSLATION
 post_united_event.1000.d: "Vzhledem k změně větru v naši prospěch jsme učinili národní grand standing gesto a vyhlásili možný název pro národ. Následovalo národní hlasování a výsledky brzy budou sečteny. Velká sázka je na stole a uvidíme, co lidé skutečně chtějí... doufejme, že chtějí právě nás." # todo: NEW TRANSLATION
 post_united_event.1000.o1: "We are Arcadia!!!" # todo: NEW TRANSLATION
 post_united_event.1000.o2: "Alespoň jsme jednotní... že?" # todo: NEW TRANSLATION
 post_united_event.2000.t: "Krizová situace hlavního města" # todo: NEW TRANSLATION
 post_united_event.2000.d: "Po druhém Manifest Destiny se zraky a uši národa obracejí k hlavnímu městu, které se nachází ve starém východním sídlišti. Mnozí věří, že hlavní město by se nemělo měnit kvůli jeho symbolice, zatímco mnozí další věří, že by se mělo změnit, aby symbolizovalo změnu národa jako celku. Nové hlavní město by umožnilo lepší předběžné plánování v souvislosti s růstem Sněmovny reprezentantů, což mnozí považují za jednu z hlavních chyb starého pořádku. Navíc by nové hlavní město pravděpodobně bylo více centrální, čímž by poskytovalo světlo, pozornost a expozici lidem, kteří by si nikdy nemohli představit, co federální vláda dělá. Nicméně několik kandidátů je na výběr a je na lidech a jejich vůdcích, aby učinili volbu." # todo: NEW TRANSLATION
 post_united_event.2000.o1: "Proč měnit, věci jsou v pořádku." # todo: NEW TRANSLATION
 post_united_event.2001.t: "Skalisté hory" # todo: NEW TRANSLATION
 post_united_event.2001.d: "Mnozí argumentují pro vznik regionu hlavního města poblíž nebo prakticky na Skalnatých horách. To by vytvořilo přirozené pevnostní zařízení, pokud by naše země byla napadena. Jiní tvrdí, že by to mohlo být vnímáno jako poněkud izolovanější, než bylo zamýšleno. Bez ohledu na to už plánovači začali pokládat základy pro jakékoliv osídlení na severu Colorada." # todo: NEW TRANSLATION
 post_united_event.2001.o1: "Dostaneme levnou cestu po Skalnatých horách?" # todo: NEW TRANSLATION
 post_united_event.2002.t: "\"Centrální\" vláda" # todo: NEW TRANSLATION
 post_united_event.2002.d: "Plánovači z Kansasu uvádějí, že jejich navrhované nové umístění hlavního města je jedním z nejstřednějších návrhů. To by bylo považováno za fér a nezaujaté pro-pobřeží vs. pro-západní mentalitu. Nicméně budeme muset vyhodnotit zbytek našich možností, abychom zajistili platnost našeho výběru." # todo: NEW TRANSLATION
 post_united_event.2002.o1: "Přesto mají pravdu." # todo: NEW TRANSLATION
 post_united_event.2003.t: "\"Možnost říční bariéry\"" # todo: NEW TRANSLATION
 post_united_event.2003.d: "V posledních dnech se mnozí domnívali, že hlavní město by mělo být blíže Mississippi, velká a oddaná bariéra proti útokům z nepřátelského území. Symbol údajného kontinentálního rozdělení naší země a pozice, která by byla bezpečnější, když vezmeme v úvahu poněkud svislou řeku, která by pokryla její jižní bok, zatímco východ a téměř sever by byly rovněž pokryty. Tato varianta je východnější než ostatní dvě možnosti, ale leží na západní straně Mississippi. Bez ohledu na to se stále plánuje, jak bude vypadat nová budova a co plánujeme s Sněmovnou reprezentantů." # todo: NEW TRANSLATION
 post_united_event.2003.o1: "Plenty Of Water At Least." # todo: NEW TRANSLATION
 post_united_event.2004.t: "Konečné rozhodnutí" # todo: NEW TRANSLATION
 post_united_event.2004.d: "Po týdnech jednání a plánování jsou průzkumy veřejného mínění i další aspekty situace konečně zralé na rozhodnutí, kde bude nové hlavní město a jaké bude mít jméno. V Coloradu se navrhuje Mount Columbia, v Missouri se používá město Winfield jako základ s okolím řek Missouri a Mississippi jako přirozené hranice. Nakonec máme návrh New Arlington na severu Kansasu, prostorný, otevřený a téměř prázdný; byl by to pravděpodobně prázdný plátn pro rozvoj." # todo: NEW TRANSLATION
 post_united_event.2004.o1: "Staré hlavní město je v pořádku." # todo: NEW TRANSLATION
 post_united_event.2004.o2: "Skalisté hory budou bránit svobodu." # todo: NEW TRANSLATION
 post_united_event.2004.o3: "Zjevně centrální umístění vlády." # todo: NEW TRANSLATION
 post_united_event.2004.o4: "Mississippi bude bránit svobodu." # todo: NEW TRANSLATION
 post_united_event.2005.t: "Nová Amerika" # todo: NEW TRANSLATION
 post_united_event.2005.d: "S vyhlášením druhé americké republiky se nyní snažíme reformovat a přizpůsobit naši správu takové míře, do jaké jsme vyrostli. Nevyhnou se tedy neefektivnosti, protože je toho příliš, co mít pod kontrolou, nicméně obstojíme. Orel spadl, ale znovu povstal a vzlétl výše, aby dosáhl ještě vyšších výšin." # todo: NEW TRANSLATION
 post_united_event.2005.o1: "Novus Americanus, Nová americká éra" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.1.t: "United Miners migrují" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.1.d: "Jak se nám daří zprovoznit zemi, mnoho horníků, současných i bývalých zaměstnanců migruje do státu West Virginia. Unie horníků, nově pojmenovaná po staré UMWA, se začala organizovat a shromažďovat na politických odborových shromážděních. Dosud nás nekontaktoval současný prezident Cecil Roberts, ale vzhledem k tomu, jak se věci vyvíjejí, brzy bychom měli slyšet něco." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.1.o1: "Co to jsou, migrující ptáci?" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.2.t: "\"Návrh Černá perla\"" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.2.d: "Ještě dnes ráno jsme konečně obdrželi slova od nového UMWA. Prezident požádal a získal významnou základnu petic, která umožní znovu otevření několika dolů v West Virginia. Odhaduje se, že stát má přes 20 miliard tun zásob uhlí a to by rozhodně bylo užitečné pro dodání levné a snadné energie do domů a podniků, které se jen snaží přežít. Nicméně doly byly uzavřeny kvůli environmentálním obavám, protože mnoho zásob na východním pobřeží, které okupujeme, má vyšší obsah síry. Takže otázka zní: chceme udržet moderní standardy, nebo snížit tyto standardy pro rychlejší zotavení." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.2.o1: "Černá perla září znovu" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.2.o2: "Máme standardy z důvodu" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.3.t: "Tok financí" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.3.d: "Jednání postupují hladce a financování se konečně směřuje do West Virginia. Horníci, kteří migrovali, již začali pracovat na znovuotevření starých dolů. To je nové období pro stát a bude to velký přínos do budoucna, jak se budeme snažit stabilizovat národ ekonomicky." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.3.o1: "Není to moc, ale je to poctivá práce" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.300.t: "Protest horníků proti rozhodnutí" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.300.d: "Po nedávném verdiktu zrušit návrh Černá perla začali mnozí horníci, kteří opustili domovy a migrovali do toho, co považovali za stabilní práci a budoucí stabilitu, organizovat protesty. Místní policie také zaznamenala nárůst krádeží souvisejících se zbraněmi a malé pouliční výtržnosti. Budeme se muset připravit na zvládnutí této nouze, protože s rostoucí nestabilitou státu nemáme skutečnou pozici pro přímý zásah." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.300.o1: "Co očekávali?" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.301.t: "Svobodný stát?" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.301.d: "Bez špetky ohledu na důsledky to udělali. Místní nepokoje mířily na to málo zbraní a munice, které zůstaly ve státě West Virginia a v rychlém kroku, jak někteří nazývají „mob rule“, UMWA získala kontrolu a prohlásila West Virginian nezávislost. Musíme shromáždit co nejvíce sil, které máme, a začít znovu získávat to, co nám právem náleží. Poslední, co potřebujeme, je, aby někdo jiný na kontinentu podrýval naši nezávislost." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.301.o1: "Kde jsem to už viděl?" # todo: NEW TRANSLATION
 USB_coal_wars_raise_mining_regiments_tt: "West Virginia postaví §Y15§! divizí těžebních pluků." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.302.t: "Druhá válka o uhlí" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.302.d: "Na zbraně, bratři a sestry Země, na zbraně, říkám! Tento den je dnem, kdy zaslepení bandité z Washingtonu již nebudou určovat naši budoucnost. Budeme stát a bojovat za právo těžit a využívat zdroje, které nám poskytuje naše drahá Matka Země. Pojďme se shromáždit a bránit tyto země, abychom mohli tuto černou perlu znovu rozzářit." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.302.o1: "Na zbraně!!!" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.303.t: "Pochodujeme!" # todo: NEW TRANSLATION
 USB_coal_wars_two_event.303.d: "Nadešel čas a jsme připraveni jako nikdy. Půjdeme do Parkersburgu a znovu obsadíme stát Západní Virginie." # todo: NEW TRANSLATION
 USB_coal_wars_two_event.303.o1: "Vpřed, muži!" # todo: NEW TRANSLATION
