 BOS_zeljko_komsic: "Željko Komšić" # todo: NEW TRANSLATION
 BOS_bosnia_random: "Nový bosňácký představitel převezme rotující předsednictví." # todo: NEW TRANSLATION
 BOS_serb_random: "Nový srbský představitel převezme rotující předsednictví." # todo: NEW TRANSLATION
 BOS_croat_random: "Nový chorvatský představitel převezme rotující předsednictví." # todo: NEW TRANSLATION
 event_chain_will_fire: "Řada stávek a politických střetů prověří, zda organizované odbory dokážou nahradit stávající koalici." # todo: CHANGED
 BOS_events.45.a: "Zahájit jednání" # todo: NEW TRANSLATION
 BOS_events.45.d: "Veřejní zaměstnanci se připojili k pracovním nepokojům a požadují spolehlivé mzdy, kolektivní vyjednávání a konec dosazování podle protekce." # todo: NEW TRANSLATION
 BOS_events.45.t: "Stávka ve veřejném sektoru" # todo: NEW TRANSLATION
 BOS_events.46.a: "Hnutí se šíří" # todo: NEW TRANSLATION
 BOS_events.46.d: "Demonstrace se rozšířily z pracovišť do center měst, protože odbory koordinují své požadavky napříč hranicemi entit." # todo: NEW TRANSLATION
 BOS_events.46.t: "Celostátní pracovní protesty" # todo: NEW TRANSLATION
 BOS_events.47.a: "Chránit veřejné instituce" # todo: NEW TRANSLATION
 BOS_events.47.d: "Střet před vládní budovou přerostl v násilí. Odboroví představitelé viní provokatéry, zatímco bezpečnostní činitelé požadují mimořádné pravomoci." # todo: NEW TRANSLATION
 BOS_events.47.t: "Protesty přerůstají v násilí" # todo: NEW TRANSLATION
 BOS_events.48.a: "Uznat novou vládu" # todo: NEW TRANSLATION
 BOS_events.48.d: "Stará koalice ztratila kontrolu nad parlamentem. Kabinet podporovaný dělníky nyní tvrdí, že má pravomoc reorganizovat stát a hospodářství." # todo: NEW TRANSLATION
 BOS_events.48.t: "Dělníci vstupují do vlády" # todo: NEW TRANSLATION
 news.83.t: "Bosna se vrací k občanské válce" # todo: CHANGED
 news.83.desc: "Republika srbská vyhlásila nezávislost a Bosna a Hercegovina se vrátila k občanské válce. Mezinárodní organizace vyzvaly k okamžitému příměří, zatímco se jednotky entit mobilizují po celé zemi." # todo: CHANGED
 news.83.a: "Daytonský mír selhal" # todo: CHANGED
 news.84.t: "Mudžáhidové se připojují k bosenské válce" # todo: CHANGED
 news.84.desc: "Bojovníci El Mudžahid se rozešli se Sarajevem a vyhlásili v Bosně islamistický stát. Jejich zásah přidává do konfliktu třetí ozbrojenou frakci a vyvolal odsouzení sousedních vlád." # todo: CHANGED
 news.84.a: "Válka se vyhrotila" # todo: CHANGED
 news.86.t: "Bosenská občanská válka končí" # todo: NEW TRANSLATION
 news.86.desc: "Vítězná frakce obnovila kontrolu nad Bosnou a Hercegovinou poté, co porazila zbývající odštěpenecké síly. Vláda nyní čelí demobilizaci, obnově a dalšímu pokusu o politické urovnání." # todo: CHANGED
 news.86.a: "Boje skončily" # todo: CHANGED
 BOS_eu_accession: "Přistoupení k Evropské unii" # todo: NEW TRANSLATION
 BOS_eu_accession_desc: "Členství vyžaduje postupné uzavírání jednotlivých vyjednávacích kapitol. Každý krok potřebuje souhlas všech tří konstitutivních skupin a Republika srbská může proces kdykoli zablokovat, pokud se její vedení stane nepřátelským." # todo: NEW TRANSLATION
 BOS_eu_judicial_reform: "Uzavřít kapitolu soudnictví" # todo: NEW TRANSLATION
 BOS_eu_judicial_reform_desc: "Sladit soudní řízení, odvolací přezkum a nezávislost státního zastupitelství s měřítky pro přistoupení k EU." # todo: NEW TRANSLATION
 BOS_eu_anti_corruption_commitments: "Přijmout protikorupční závazky" # todo: NEW TRANSLATION
 BOS_eu_anti_corruption_commitments_desc: "Zavázat se k protikorupčním měřítkům kontrolovaným EU. Brusel tuto kapitolu neotevře, dokud bude ovládnutí státu závažným problémem." # todo: NEW TRANSLATION
 BOS_eu_market_alignment: "Sladit se s jednotným trhem" # todo: NEW TRANSLATION
 BOS_eu_market_alignment_desc: "Přijmout normy EU pro výrobky, celní postupy a pravidla hospodářské soutěže. Soulad je nákladný, ale odemyká předvstupní financování." # todo: NEW TRANSLATION
 BOS_eu_candidate_status: "Získat status kandidáta" # todo: NEW TRANSLATION
 BOS_eu_candidate_status_desc: "Požádat Evropskou radu, aby uznala Bosnu a Hercegovinu za oficiálního kandidáta na členství." # todo: NEW TRANSLATION
 BOS_eu_open_negotiations: "Zahájit přístupová jednání" # todo: NEW TRANSLATION
 BOS_eu_open_negotiations_desc: "Zahájit formální jednání o členství s Evropskou komisí. Očekávejme odpor z Banja Luky, protože povinnosti na úrovni státu se rozšiřují." # todo: NEW TRANSLATION
 BOS_eu_sign_accession_treaty: "Podepsat přístupovou smlouvu" # todo: NEW TRANSLATION
 BOS_eu_sign_accession_treaty_desc: "Uzavřít jednání a podepsat přístupovou smlouvu. Samotné členství stále vyžaduje formální žádost Evropské unii." # todo: NEW TRANSLATION
 BOS_treasury_5_tt: "Státní pokladna obsahuje alespoň £treasury 5.0" # todo: NEW TRANSLATION
 BOS_treasury_2_tt: "Státní pokladna obsahuje alespoň £treasury 2.0" # todo: NEW TRANSLATION
 BOS_judiciary_meets_eu_standards_tt: "Soudnictví splňuje měřítka EU pro přistoupení" # todo: NEW TRANSLATION
 BOS_anti_corruption_framework_tt: "Je zaveden protikorupční rámec kontrolovaný EU" # todo: NEW TRANSLATION
 BOS_market_aligned_with_eu_tt: "Domácí regulace je sladěna s jednotným trhem" # todo: NEW TRANSLATION
 BOS_recognized_eu_candidate_tt: "Bosna a Hercegovina se stává uznaným kandidátem na členství v EU" # todo: NEW TRANSLATION
 BOS_eu_application_open_tt: "Bosna a Hercegovina nyní může požádat o členství v Evropské unii" # todo: NEW TRANSLATION
 BOS_economic_development: "Hospodářský rozvoj" # todo: NEW TRANSLATION
 BOS_economic_development_desc: "Programy investic financovaných ze zahraničí, privatizace a obnovy poválečného hospodářství.\n Sítě protekce na úrovni entit kontrolují jmenování, zakázky a značnou část hospodářství. Jejich rozbití je pomalé a rozhněvá skupiny, které z nich těží." # todo: NEW TRANSLATION
 BOS_court_turkish_investment: "Přilákat turecké investice" # todo: NEW TRANSLATION
 BOS_court_turkish_investment_desc: "Otevřít dveře tureckým stavebním firmám a bankám. Peníze z Ankary přitečou a s nimi i turecký vliv na Sarajevo." # todo: NEW TRANSLATION
 BOS_court_gulf_investment: "Přilákat investice ze Zálivu" # todo: NEW TRANSLATION
 BOS_court_gulf_investment_desc: "Pozvat fondy ze Zálivu do nemovitostí, cestovního ruchu a financí. Kapitál posílí státní pokladnu a uklidní nálady, zatímco postavení Rijádu v Bosně poroste." # todo: NEW TRANSLATION
 BOS_rapid_privatization: "Rychlá privatizace" # todo: NEW TRANSLATION
 BOS_rapid_privatization_desc: "Rychle prodat státní podniky komukoli, kdo je koupí. Prodeje naplní státní pokladnu a zvýší produkci, ale výhodné obchody podpoří korupci a zneklidní pracovní sílu." # todo: NEW TRANSLATION
 BOS_transparent_privatization: "Transparentní privatizace" # todo: NEW TRANSLATION
 BOS_transparent_privatization_desc: "Prodávat státní podniky prostřednictvím auditovaných, otevřených výběrových řízení. Výnosy budou menší a proces pomalejší, ale korupce klesne a veřejná důvěra se udrží." # todo: NEW TRANSLATION
 BOS_thermal_plant_chinese_financing: "Tepelná elektrárna financovaná Čínou" # todo: NEW TRANSLATION
 BOS_thermal_plant_chinese_financing_desc: "Vzít si čínskou půjčku na rozšíření elektrárny na hnědé uhlí. Výroba okamžitě vzroste, ale spolu s ní přijdou dluh a pekingský vliv." # todo: NEW TRANSLATION
 BOS_hydro_refurbishment: "Modernizovat vodní elektrárny" # todo: NEW TRANSLATION
 BOS_hydro_refurbishment_desc: "Obnovit stárnoucí přehrady a turbíny na Neretvě a Drině. Počáteční účet bude skutečný, ale spolehlivá elektřina stabilizuje průmysl." # todo: NEW TRANSLATION
 BOS_end_brcko_supervision: "Ukončit dohled nad Brčkem" # todo: NEW TRANSLATION
 BOS_end_brcko_supervision_desc: "Ukončit mezinárodní dohled nad okresem Brčko a plně jej předat místním institucím. Republika srbská nové uspořádání okamžitě prověří." # todo: NEW TRANSLATION
 BOS_police_restructuring: "Restrukturalizovat policii" # todo: NEW TRANSLATION
 BOS_police_restructuring_desc: "Sloučit roztříštěné policejní sbory entit pod státní rámec, což je podmínkou EU pro užší vztahy. Republika srbská nelibě nese ztrátu kontroly." # todo: NEW TRANSLATION
 BOS_anti_corruption_investigations: "Protikorupční vyšetřování" # todo: NEW TRANSLATION
 BOS_anti_corruption_investigations_desc: "Nasadit státní žalobce proti zakořeněným sítím protekce. Korupce klesne, ale konstitutivní skupina, jejíž představitelé budou obviněni, se stane neklidnou." # todo: NEW TRANSLATION
 BOS_judicial_appointments: "Opolitizovat méně jmenování soudců" # todo: NEW TRANSLATION
 BOS_judicial_appointments_desc: "Převést kontrolu nad jmenováním soudců z vedení stran na nezávislou radu." # todo: NEW TRANSLATION
 BOS_depoliticized_judiciary_tt: "Jmenování soudců je chráněno před stranickou kontrolou" # todo: NEW TRANSLATION
 BOS_public_procurement_reform: "Reforma veřejných zakázek" # todo: NEW TRANSLATION
 BOS_public_procurement_reform_desc: "Zavést otevřená výběrová řízení pro státní zakázky. Zveřejnění účetnictví stojí peníze předem a ukončí několik pohodlných dohod." # todo: NEW TRANSLATION
 BOS_transparent_procurement_tt: "Státní zakázky jsou zadávány prostřednictvím otevřených výběrových řízení" # todo: NEW TRANSLATION
 BOS_diaspora_investment_drive: "Iniciativa pro investice diaspory" # todo: NEW TRANSLATION
 BOS_diaspora_investment_drive_desc: "Pozvat podnikatelská sdružení diaspory ke spolufinancování veřejných projektů a nabídnout emigrantům jednorázovou emisi dluhopisů." # todo: NEW TRANSLATION
 BOS_dual_citizenship_outreach: "Program dvojího občanství" # todo: NEW TRANSLATION
 BOS_dual_citizenship_outreach_desc: "Zjednodušit postupy pro dvojí občanství a konzulární registraci, aby si emigranti zachovali formální vazby na zemi. Větší registrovaná diaspora posílá domů více peněz." # todo: NEW TRANSLATION
 BOS_expanded_dual_citizenship_tt: "Příjmy z převodů diaspory vzrostou o 20 %" # todo: NEW TRANSLATION
 BOS_diaspora_return_program: "Program návratu diaspory" # todo: NEW TRANSLATION
 BOS_diaspora_return_program_desc: "Financovat granty na znovuusídlení a zprostředkování zaměstnání pro rodiny vracející se ze zahraničí. Je to nákladné, ale země potřebuje lidi více než peníze." # todo: NEW TRANSLATION
 BOS_treasury_1_tt: "Státní pokladna obsahuje alespoň £treasury 1.0" # todo: NEW TRANSLATION
 BOS_dayton_pressure: "Dayton pod tlakem" # todo: NEW TRANSLATION
 BOS_dayton_pressure_desc: "Republika srbská zpochybňuje státní instituce a hrozí odtržením. Sarajevo může ustoupit v otázce autonomie, požádat Vysokého představitele o vynucení urovnání nebo usilovat o mezinárodní arbitráž." # todo: NEW TRANSLATION
 BOS_concede_to_srpska_demands: "Ustoupit požadavkům entity" # todo: NEW TRANSLATION
 BOS_concede_to_srpska_demands_desc: "Vrátit sporné pravomoci Republice srbské. Krize skončí za cenu oslabení ústřední moci." # todo: NEW TRANSLATION
 BOS_invoke_bonn_powers: "Využít bonnské pravomoci" # todo: NEW TRANSLATION
 BOS_invoke_bonn_powers_desc: "Požádat Vysokého představitele, aby vynutil spornou legislativu a odvolal úředníky, kteří jí brání. Je to účinné, ale v Banja Luce hluboce nenáviděné." # todo: NEW TRANSLATION
 BOS_request_international_arbitration: "Požádat o mezinárodní arbitráž" # todo: NEW TRANSLATION
 BOS_request_international_arbitration_desc: "Předat spor mezinárodní arbitráži. Je pomalá a nákladná, ale ukončí patovou situaci, aniž by odměnila kteroukoli stranu." # todo: NEW TRANSLATION
 BOS_phase_out_ohr_supervision: "Postupně ukončit dohled OHR" # todo: NEW TRANSLATION
 BOS_phase_out_ohr_supervision_desc: "Po stabilizaci vztahů mezi entitami vyjednat převedení zbývajících pravomocí Vysokého představitele na domácí instituce." # todo: NEW TRANSLATION
 BOS_dayton_pressure_decisions_available_tt: "Reakce na krizi jsou dostupné v rozhodnutích Dayton pod tlakem" # todo: NEW TRANSLATION
 BOS_eu_candidate: "Kandidát na členství v EU" # todo: NEW TRANSLATION
 BOS_eu_candidate_desc: "Status kandidáta dává Bosně a Hercegovině formální cestu k členství, pravidelné zprávy o pokroku a snazší vztahy s členskými státy." # todo: NEW TRANSLATION
 BOS_eu_negotiations: "Jednání o přistoupení k EU" # todo: NEW TRANSLATION
 BOS_eu_negotiations_desc: "Přístupové kapitoly jsou otevřené a technická pomoc EU proudí do státních institucí, čímž urychluje administrativní a infrastrukturní práce." # todo: NEW TRANSLATION
 BOS_eu_accession_treaty: "Podepsána přístupová smlouva s EU" # todo: NEW TRANSLATION
 BOS_eu_accession_treaty_desc: "Přístupová smlouva je podepsána a ratifikace probíhá. Trhy považují členství za jisté a státní aparát pracuje s jasným směrem." # todo: NEW TRANSLATION
 BOS_eu_accession_funds: "Předvstupní pomoc" # todo: NEW TRANSLATION
 BOS_eu_accession_funds_desc: "Prostředky Nástroje předvstupní pomoci financují infrastrukturu, administrativní kapacitu a levnější státní půjčky." # todo: NEW TRANSLATION
 BOS_republika_srpska_secession_crisis: "Krize odtržení" # todo: NEW TRANSLATION
 BOS_republika_srpska_secession_crisis_desc: "Republika srbská bojkotuje státní instituce a připravuje legislativu o referendu. Zahraniční patroni čekají na příležitost, zatímco patová situace pokračuje." # todo: NEW TRANSLATION
 BOS_ohr_supervision: "Dohled OHR" # todo: NEW TRANSLATION
 BOS_ohr_supervision_desc: "Vysoký představitel přímo uplatňuje bonnské pravomoci. Vynucená rozhodnutí udržují stát funkční, ale odsouvají volené instituce na vedlejší kolej." # todo: NEW TRANSLATION
 BOS_national_reconciliation: "Národní usmíření" # todo: NEW TRANSLATION
 BOS_national_reconciliation_desc: "Všechny tři konstitutivní skupiny podporují státní vládu. Spolupráce napříč entitami je běžná, nikoli výjimečná." # todo: NEW TRANSLATION
 BOS_political.24.t: "Udělen status kandidáta" # todo: NEW TRANSLATION
 BOS_political.24.d: "Evropská rada formálně uznala Bosnu a Hercegovinu za kandidáta na členství. Toto rozhodnutí odměňuje roky reforem a zavazuje Brusel každoročně podávat zprávy o našem pokroku." # todo: NEW TRANSLATION
 BOS_political.24.a: "Evropská budoucnost" # todo: NEW TRANSLATION
 BOS_political.25.t: "Banja Luka blokuje jednání" # todo: NEW TRANSLATION
 BOS_political.25.d: "Delegáti Republiky srbské opustili státní parlament a odmítají ratifikovat rámec jednání, dokud nebudou pravomoci entit písemně zaručeny." # todo: NEW TRANSLATION
 BOS_political.25.a: "Vyjednat jejich návrat" # todo: NEW TRANSLATION
 BOS_political.25.b: "Ratifikovat bez nich" # todo: NEW TRANSLATION
 BOS_political.26.t: "Propuká skandál kolem zakázek" # todo: NEW TRANSLATION
 BOS_political.26.d: "Novináři zveřejnili smlouvy spojující vysoké představitele entit s zmanipulovanými veřejnými zakázkami. Síť zasahuje ministerstva, státní podniky a nejméně jednu vládní stranu." # todo: NEW TRANSLATION
 BOS_political.26.a: "Stíhat tuto síť" # todo: NEW TRANSLATION
 BOS_political.26.b: "Pohřbít tento příběh" # todo: NEW TRANSLATION
 BOS_political.27.t: "Republika srbská hrozí odtržením" # todo: NEW TRANSLATION
 BOS_political.27.d: "Shromáždění entity v Banja Luce naplánovalo hlasování o vystoupení ze státních institucí a její vedení otevřeně hovoří o referendu o nezávislosti." # todo: NEW TRANSLATION
 BOS_political.27.a: "Stát musí reagovat" # todo: NEW TRANSLATION
 BOS_political.28.t: "Patová situace se prohlubuje" # todo: NEW TRANSLATION
 BOS_political.28.d: "Uplynuly měsíce bojkotu bez dohody. Instituce entit nyní fungují, jako by státní autorita byla dobrovolná, a umírnění politici na všech stranách ztratili půdu pod nohama." # todo: NEW TRANSLATION
 BOS_political.28.a: "Nebezpečný precedens" # todo: NEW TRANSLATION
 BOS_diaspora_remittances: "Převody peněz diaspory" # todo: NEW TRANSLATION
 BOS_diaspora_remittances_desc: "Peníze posílané domů Bosňany pracujícími v zahraničí představují přibližně desetinu HDP. Dostávají se do domácností ve všech částech země, včetně těch, kam státní rozpočet nikdy nedosáhne." # todo: NEW TRANSLATION
 BOS_diaspora_returnees: "Vrací se diaspora" # todo: NEW TRANSLATION
 BOS_diaspora_returnees_desc: "Granty na znovuusídlení přivádějí rodiny zpět z Německa, Rakouska a Skandinávie. Přicházejí s úsporami, dovednostmi a dětmi." # todo: NEW TRANSLATION
 BOS_nato_interoperability: "Interoperabilita s NATO" # todo: NEW TRANSLATION
 BOS_nato_interoperability_desc: "Společná cvičení, alianční standardy a programy Partnerství pro mír obnovují ozbrojené síly podle západních vzorů." # todo: NEW TRANSLATION
 BOS_political.29.t: "Peníze diaspory se vracejí domů" # todo: NEW TRANSLATION
 BOS_political.29.d: "Investiční iniciativa skončila závazky podnikatelů z diaspory napříč Evropou a Severní Amerikou. Podle mezinárodních měřítek jsou tyto částky skromné, ale přicházejí do obcí, které zahraniční investoři přehlížejí." # todo: NEW TRANSLATION
 BOS_political.29.a: "Dobrá zpráva" # todo: NEW TRANSLATION
 BOS_political.30.t: "Karadžić je ve vazbě" # todo: NEW TRANSLATION
 BOS_political.30.d: "Zpráva z Bělehradu se během hodiny rozšířila po Sarajevu. Radovan Karadžić, válečný vůdce bosenských Srbů, byl zatčen a čeká ho převoz do Haagu. Sdružení přeživších a rodiny obětí se od Sarajeva po Srebrenici scházejí k tichým vigiliím. V Banja Luce je nálada pochmurnější." # todo: NEW TRANSLATION
 BOS_political.30.a: "O třináct let později" # todo: NEW TRANSLATION
 BOS_political.31.t: "Mladić je ve vazbě" # todo: NEW TRANSLATION
 BOS_political.31.d: "Ratko Mladić, velitel armády, která provedla masakr ve Srebrenici, byl zatčen na statku v severním Srbsku. Pro matky ze Srebrenice zatčení ukončuje šestnáct let čekání. Na druhé straně mezientitní hraniční linie o něm někteří stále mluví jako o obránci." # todo: NEW TRANSLATION
 BOS_political.31.a: "Spravedlnost dorazila do Lazareva" # todo: NEW TRANSLATION
 BOS_political.32.t: "Rozsudek ve věci Sejdić-Finci" # todo: NEW TRANSLATION
 BOS_political.32.d: "Evropský soud pro lidská práva rozhodl, že etnická pravidla způsobilosti stanovená ústavou porušují Evropskou úmluvu. Dervo Sejdić a Jakob Finci, romský aktivista a představitel židovské komunity, nemohou kandidovat na prezidenta, protože nepatří k žádnému ze tří konstitutivních národů. Chorvatské strany dodávají, že současné uspořádání umožňuje, aby jejich člena předsednictva volili jiní. Provést tento rozsudek vyžaduje ústavní změnu, o níž nikdo příliš netouží jednat." # todo: NEW TRANSLATION
 BOS_political.32.a: "Pozměnit Dayton je snazší říct než udělat" # todo: NEW TRANSLATION
 BOS_sejdic_finci_ruling_tt: "§YŠtrasburk rozhodl proti etnickým pravidlům způsobilosti v ústavě. Soudní reforma, která se rozsudkem zabývá, bude mít v Bruselu mimořádnou váhu.§!" # todo: NEW TRANSLATION
 BOS_sejdic_finci_addressed_tt: "§GReforma řeší rozsudek ve věci Sejdić-Finci a uzavírá trvalý požadavek Bruselu.§!" # todo: NEW TRANSLATION
 BOS_serbia_reaction_tt: "Srbsko rozhodne, zda podpoří Republiku srbskou." # todo: NEW TRANSLATION
 BOS_croatia_reaction_tt: "Chorvatsko rozhodne, zda podpoří Herceg-Bosnu." # todo: NEW TRANSLATION
 BOS_political.33.t: "EUFOR přebírá misi" # todo: NEW TRANSLATION
 BOS_political.33.d: "Na ceremonii v táboře Butmir předaly Stabilizační síly vedené NATO svou misi Evropské unii. Operace Althea přebírá v rámci uspořádání Berlin Plus vojáky, základny a mandát SFOR. Pro většinu Bosňanů je jedinou viditelnou změnou vlajka na rukávu." # todo: NEW TRANSLATION
 BOS_political.33.a: "Vlajky se v Butmiru mění" # todo: NEW TRANSLATION
 BOS_political.34.t: "První sčítání lidu od války" # todo: NEW TRANSLATION
 BOS_political.34.d: "Sčítací komisaři zahájili první sčítání obyvatelstva od roku 1991. Každá otázka etnicity, jazyka a víry je sporným územím a Republika srbská již oznámila, že nepřijme metodiku započítávání občanů žijících v zahraničí. Za formuláři se skrývá otázka, kterou se nikdo nahlas neptá: kdo tu ještě zůstal." # todo: NEW TRANSLATION
 BOS_political.34.a: "Sečíst, co zbylo" # todo: NEW TRANSLATION
 BOS_political.35.t: "Tuzla hoří" # todo: NEW TRANSLATION
 BOS_political.35.d: "Protesty, které začaly před zkrachovalými továrnami v Tuzle, se rozšířily do Sarajeva, Zenice a Mostaru. Vládní budovy hoří a davy nekřičí etnická hesla, ale požadují práci a stíhání podvodů při privatizaci. Občanská pléna se formují, aby své požadavky předložila přímo kantonálním vládám." # todo: NEW TRANSLATION
 BOS_political.35.a: "Splnit požadavky plén" # todo: NEW TRANSLATION
 BOS_political.35.b: "Nejprve obnovit pořádek" # todo: NEW TRANSLATION
 BOS_political.36.t: "Žádost podána v Bruselu" # todo: NEW TRANSLATION
 BOS_political.36.d: "Předseda Rady ministrů předal žádost Bosny o členství v Evropské unii nizozemskému předsednictví Rady. Než bude na dosah status kandidáta, čekají nás roky přizpůsobování, ale žádost zavazuje všechny úrovně vlády — alespoň na papíře — ke stejnému směru." # todo: NEW TRANSLATION
 BOS_political.36.a: "Cesta bude dlouhá" # todo: NEW TRANSLATION
 BOS_political.37.t: "Vysoký představitel zakazuje popírání genocidy" # todo: NEW TRANSLATION
 BOS_political.37.d: "Odcházející Vysoký představitel v jednom ze svých posledních činů ve funkci zavedl trestní postih za popírání genocidy ve Srebrenici a oslavování válečných zločinců. Banja Luka propukla v nepokoje. Představitelé entity prohlašují rozhodnutí za neplatné, oznamují bojkot státních institucí a otevřeně hovoří o navrácení toho, co Dayton odevzdal." # todo: NEW TRANSLATION
 BOS_political.37.a: "Zákon platí pro všechny" # todo: NEW TRANSLATION
 BOS_political.37.b: "Nechat stát stranou" # todo: NEW TRANSLATION
 BOS_political.38.t: "Banja Luka hlasuje pro vystoupení" # todo: NEW TRANSLATION
 BOS_political.38.d: "Shromáždění entity nařídilo své vládě, aby se Republika srbská do šesti měsíců stáhla ze státní armády, daňového úřadu a soudnictví. Závěry jsou prozatím deklaratorní, ale jasně popisují cestu k rozpuštění. Velvyslanectví připravují prohlášení a garanti Daytonu jsou tázáni, jakou cenu má tato dohoda ještě dnes." # todo: NEW TRANSLATION
 BOS_political.38.a: "Předat to garantům" # todo: NEW TRANSLATION
 BOS_political.38.b: "Počkat, až Banja Luka ustoupí" # todo: NEW TRANSLATION
 BOS_political.40.t: "Kosovo vyhlašuje nezávislost" # todo: NEW TRANSLATION
 BOS_political.40.d: "Priština vyhlásila nezávislost na Srbsku. Prohlášení rozděluje Bosnu: bosňáčtí a chorvatští představitelé tíhnou k uznání, zatímco Republika srbská varuje, že jde o precedens pro její vlastní odtržení." # todo: NEW TRANSLATION
 BOS_political.40.a: "Vyjádřit podporu sebeurčení" # todo: NEW TRANSLATION
 BOS_political.40.b: "Odmítnout jednostranné vyhlášení" # todo: NEW TRANSLATION
 BOS_political.40.c: "Zůstat neutrální a udržet stát pohromadě" # todo: NEW TRANSLATION
 BOS_political.41.t: "Migranti se hromadí v Unsko-sanském kantonu" # todo: NEW TRANSLATION
 BOS_political.41.d: "Tisíce lidí putujících po západobalkánské trase uvízly poblíž chorvatské hranice. Úřady Unsko-sanského kantonu tvrdí, že tábory jsou přeplněné a samy situaci nezvládnou." # todo: NEW TRANSLATION
 BOS_political.41.a: "Požádat Evropskou unii o pomoc" # todo: NEW TRANSLATION
 BOS_political.41.b: "Zpřísnit hranici a vyklidit tábory" # todo: NEW TRANSLATION
 BOS_political.42.t: "Dohoda o přidružení k Evropě" # todo: NEW TRANSLATION
 BOS_political.42.d: "Bosna a Hercegovina podepsala Dohodu o stabilizaci a přidružení s Evropskou unií. Jde o první smluvní krok na dlouhé cestě k členství." # todo: NEW TRANSLATION
 BOS_political.42.a: "Milník na cestě do Evropy" # todo: NEW TRANSLATION
 BOS_political.43.t: "Státní daň z přidané hodnoty" # todo: NEW TRANSLATION
 BOS_political.43.d: "Jednotná celostátní DPH nahrazuje starou mozaiku prodejních daní entit. Výběr je centralizován a příjmy jsou sdíleny prostřednictvím jediného národního účtu." # todo: NEW TRANSLATION
 BOS_political.43.a: "Zavést jednotnou daň" # todo: NEW TRANSLATION
 BOS_political.43.b: "Nechat entity ponechat vlastní sazby" # todo: NEW TRANSLATION
 BOS_political.44.t: "Dubnový balíček" # todo: NEW TRANSLATION
 BOS_political.44.d: "Dohodnutý soubor ústavních změn by posílil ústřední stát a zjednodušil předsednictví. V Poslanecké sněmovně mu chybí dva hlasy." # todo: NEW TRANSLATION
 BOS_political.44.a: "Vynaložit politický kapitál na schválení reforem" # todo: NEW TRANSLATION
 BOS_political.44.b: "Nechat balíček padnout" # todo: NEW TRANSLATION
 BOS_political.45.t: "Jednání v Butmiru" # todo: NEW TRANSLATION
 BOS_political.45.d: "Američtí a evropští prostředníci shromáždili stranické představitele na základně poblíž Sarajeva, aby prolomili ústavní patovou situaci. Návrhy žádají entity, aby převedly pravomoci na stát." # todo: NEW TRANSLATION
 BOS_political.45.a: "Jednat s prostředníky" # todo: NEW TRANSLATION
 BOS_political.45.b: "Bránit pravomoci entit" # todo: NEW TRANSLATION
 BOS_political.46.t: "Otázka okresu Brčko" # todo: NEW TRANSLATION
 BOS_political.46.d: "Republika srbská hrozí stažením svých představitelů ze společných institucí okresu Brčko, samosprávného koridoru pod státním dohledem zřízeného po válce." # todo: NEW TRANSLATION
 BOS_political.46.a: "Bránit společný status okresu" # todo: NEW TRANSLATION
 BOS_political.46.b: "Ustoupit, aby byl zachován mír" # todo: NEW TRANSLATION
 BOS_political.47.t: "Mostar bez vlády" # todo: NEW TRANSLATION
 BOS_political.47.d: "Chorvatské a bosňácké strany se nemohou dohodnout na statutu města a Mostar je už léta bez platných místních voleb. Rozdělené město se potácí bez rady." # todo: NEW TRANSLATION
 BOS_political.47.a: "Vnutit jednotný statut města" # todo: NEW TRANSLATION
 BOS_political.47.b: "Nechat strany v patové situaci" # todo: NEW TRANSLATION
 BOS_political.48.t: "Exodus se zrychluje" # todo: NEW TRANSLATION
 BOS_political.48.d: "Autobusy a levné lety ze Sarajeva, Tuzly a Banja Luky jsou plné pouze jedním směrem. Mladí absolventi, řemeslníci a celé rodiny odcházejí do Německa, Rakouska a Chorvatska rychleji, než je stát dokáže nahradit." # todo: NEW TRANSLATION
 BOS_political.48.a: "Zadat zprávu o příčinách" # todo: NEW TRANSLATION
 BOS_political.48.b: "Odmítnout to jako běžnou mobilitu éry EU" # todo: NEW TRANSLATION
 BOS_political.49.t: "Komšić vítězí v chorvatském křesle" # todo: NEW TRANSLATION
 BOS_political.49.d: "Željko Komšić získal chorvatské křeslo předsednictva díky hlasům z bosňácké většiny a porazil Draganа Čoviće z HDZ. Města s chorvatskou většinou ho prohlašují za nežádoucího a Záhřeb protestuje proti výsledku, který jeho vlastní komunita odmítá." # todo: NEW TRANSLATION
 BOS_political.49.a: "Spravedlivě získaný multietnický mandát" # todo: NEW TRANSLATION
 BOS_political.49.b: "Chorvatští voliči byli přehlasováni, nikoli zastoupeni" # todo: NEW TRANSLATION
 BOS_political.50.t: "Patová situace kolem programu NATO" # todo: NEW TRANSLATION
 BOS_political.50.d: "Ministři SNSD odmítají dovolit státu předložit NATO Roční národní program a bez něj se Rada ministrů nemůže ustavit. Měsíce plynou a vláda stále neexistuje." # todo: NEW TRANSLATION
 BOS_political.50.a: "Předložit program bez ohledu na ně" # todo: NEW TRANSLATION
 BOS_political.50.b: "Místo toho nabídnout přejmenovaný Reformní program" # todo: NEW TRANSLATION
 BOS_political.51.t: "Konečně vláda" # todo: NEW TRANSLATION
 BOS_political.51.d: "Čtrnáct měsíců po volbách složila Rada ministrů přísahu. Sarajevo má znovu vládu, vykoupenou kompromisem zachraňujícím tvář, se kterým není nikdo úplně spokojen." # todo: NEW TRANSLATION
 BOS_political.51.a: "Zpět do práce" # todo: NEW TRANSLATION
 BOS_political.52.t: "Vysoký představitel bez mandátu" # todo: NEW TRANSLATION
 BOS_political.52.d: "Christian Schmidt se ujal funkce Vysokého představitele, ale Rada bezpečnosti OSN jeho jmenování nikdy nepodpořila. Rusko, Čína a vedení Republiky srbské se této mezery chopily a označují jeho pravomoc za nelegitimní." # todo: NEW TRANSLATION
 BOS_political.52.a: "V Sarajevu vše při starém" # todo: NEW TRANSLATION
 BOS_political.53.t: "Reformy vynucené u volebních uren" # todo: NEW TRANSLATION
 BOS_political.53.d: "Po uzavření volebních místností využil Vysoký představitel své bonnské pravomoci k vynucení změn ústavy Federace a volebního zákona, rozšíření Sněmovny národů a stanovení lhůt pro vytvoření vlád. Kritici tomu říkají vnucená ústava; HDZ to považuje za opožděný krok." # todo: NEW TRANSLATION
 BOS_political.53.a: "Pragmatická oprava, ať už přišla jakkoli" # todo: NEW TRANSLATION
 BOS_political.53.b: "Neliberální překročení pravomocí" # todo: NEW TRANSLATION
 BOS_political.53.c: "Držet se sporu stranou" # todo: NEW TRANSLATION
 BOS_political.54.t: "Banja Luka ruší platnost soudu" # todo: NEW TRANSLATION
 BOS_political.54.d: "Shromáždění entity schválilo zákony, podle nichž se rozhodnutí státního ústavního soudu v Republice srbské neuplatňují, a zakázalo zveřejňování rozhodnutí Vysokého představitele v oficiálním věstníku entity. Pravomoc Sarajeva nyní končí na mezientitní hraniční linii." # todo: NEW TRANSLATION
 BOS_political.54.a: "Napadnout to všemi dostupnými prostředky" # todo: NEW TRANSLATION
 BOS_political.54.b: "Nechat tento okamžik pominout" # todo: NEW TRANSLATION
 BOS_hr_legitimacy_disputed_tt: "§RRepublika srbská považuje rozhodnutí Vysokého představitele za neplatná, čímž krize sílí§!" # todo: NEW TRANSLATION
 BOS_political.55.t: "Brusel zahajuje jednání" # todo: NEW TRANSLATION
 BOS_political.55.d: "Osm let poté, co Bosna podala žádost, Evropská rada schválila zahájení přístupových jednání. Cesta k členství je stále dlouhá, ale poprvé vede přes Brusel, nikoli kolem něj." # todo: NEW TRANSLATION
 BOS_political.55.a: "Oslavit tento milník" # todo: NEW TRANSLATION
 BOS_political.55.b: "Oslavy mírnit" # todo: NEW TRANSLATION
 BOS_political.57.t: "Dodik odsouzen a zbaven možnosti kandidovat" # todo: NEW TRANSLATION
 BOS_political.57.d: "Soud Bosny a Hercegoviny odsoudil Milorada Dodika za nerespektování rozhodnutí Vysokého představitele a zakázal mu zastávat veřejné funkce. Instituce Republiky srbské se musí rozhodnout, zda rozsudek přijmou, nebo se mu vzepřou." # todo: NEW TRANSLATION
 BOS_political.57.a: "Rozsudek platí" # todo: NEW TRANSLATION
 BOS_political.57.b: "Republice srbské nebude nikdo říkat, kdo ji povede" # todo: NEW TRANSLATION
 BOS_reject_third_entity_demand: "Odmítnout požadavek na třetí entitu" # todo: NEW TRANSLATION
 BOS_reject_third_entity_demand_desc: "Vyloučit přestavbu Federace na samostatnou entitu s chorvatskou většinou. Bosňáckým stranám se uleví, chorvatské strany to označí za důkaz, že Sarajevo nikdy nebude naslouchat." # todo: NEW TRANSLATION
 BOS_concede_partial_croat_autonomy: "Přiznat částečnou chorvatskou autonomii" # todo: NEW TRANSLATION
 BOS_concede_partial_croat_autonomy_desc: "Poskytnout kantonům s chorvatskou většinou rozšířenou samosprávu, která nedosahuje úplné třetí entity. Odpoví to na hlavní stížnost HNS, ale za cenu další vrstvy vlády, kterou bude nutné koordinovat." # todo: NEW TRANSLATION
 BOS_register_defence_property: "Zapsat obranný majetek jako státní" # todo: NEW TRANSLATION
 BOS_register_defence_property_desc: "Převést vojenské objekty, na které si entity stále činí nárok, do státní evidence — jde o podmínku, kterou NATO stanovilo pro aktivaci Akčního plánu členství." # todo: NEW TRANSLATION
 BOS_request_nato_waiver: "Požádat NATO o výjimku" # todo: NEW TRANSLATION
 BOS_request_nato_waiver_desc: "Požádat NATO, aby podmínku obranného majetku zcela prominulo, místo čekání na souhlas Republiky srbské. Funguje to, ale Banja Luka nezapomene, kdo o to požádal." # todo: NEW TRANSLATION
 BOS_activate_map: "Aktivovat Akční plán členství" # todo: NEW TRANSLATION
 BOS_activate_map_desc: "Po vyřešení otázky majetku přijmout Akční plán členství NATO a zahájit formální cestu k přistoupení." # todo: NEW TRANSLATION
 BOS_expand_arms_exports: "Rozšířit vývoz munice a zbraní" # todo: NEW TRANSLATION
 BOS_expand_arms_exports_desc: "Podpořit státem napojené zbrojovky při rozšiřování vývozu odběratelům po celé Evropě i mimo ni. Zakázkové knihy jsou plné, stejně jako spor o to, kde zásilky končí." # todo: NEW TRANSLATION
 BOS_gulf_investment_delivered_tt: "§GBuroj Ozone zahajuje stavbu podle plánu§!" # todo: NEW TRANSLATION
 BOS_gulf_investment_stalled_tt: "§RBuroj Ozone se zastavuje hluboko pod úrovní toho, co bylo slíbeno§!" # todo: NEW TRANSLATION
 BOS_host_sarajevo_film_festival: "Pořádat Sarajevo Film Festival" # todo: NEW TRANSLATION
 BOS_host_sarajevo_film_festival_desc: "Podpořit největší filmový festival jihovýchodní Evropy státními prostředky a logistickou pomocí. Každé léto přivádí do Sarajeva turisty a novináře a udržuje kulturní profil města výrazně před jeho sousedy." # todo: NEW TRANSLATION
 BOS_federation_development_grant: "Rozvojový grant pro Federaci" # todo: NEW TRANSLATION
 BOS_federation_development_grant_desc: "Směrovat prostředky státní pokladny do infrastruktury napříč kantony Federace s bosňáckou většinou. Bosňácká komunita investici vítá, Republika srbská ji však vnímá jako protekci." # todo: NEW TRANSLATION
 BOS_herzegovina_development_grant: "Rozvojový grant pro Hercegovinu" # todo: NEW TRANSLATION
 BOS_herzegovina_development_grant_desc: "Financovat silnice a veřejné služby v Hercegovině s chorvatskou většinou. Chorvatští představitelé to chápou jako uznání, zatímco Bosňáci nesou nelibě peníze proudící do nacionalistických bašt." # todo: NEW TRANSLATION
 BOS_srpska_development_grant: "Rozvojový grant pro Republiku srbskou" # todo: NEW TRANSLATION
 BOS_srpska_development_grant_desc: "Směrovat prostředky státní pokladny do infrastruktury v Republice srbské. Toto gesto si získá srbskou přízeň, ale Bosňáky rozčiluje odměňování entity, která stále hrozí odchodem." # todo: NEW TRANSLATION
 BOS_croat_grievance: "Chorvatská politická křivda" # todo: NEW TRANSLATION
 BOS_croat_grievance_desc: "Chorvatské strany tvrdí, že o chorvatském křesle v předsednictvu rozhodly bosňácké, nikoli chorvatské hlasy, a požadují volební systém, v němž nelze komunitu přehlasovat zvenčí." # todo: NEW TRANSLATION
 BOS_third_entity_demand: "Federální restrukturalizace" # todo: NEW TRANSLATION
 BOS_third_entity_demand_desc: "Kantony s chorvatskou většinou získaly rozšířenou samosprávu za cenu státního aparátu, jehož správa je o jednu vrstvu složitější." # todo: NEW TRANSLATION
 BOS_contested_high_representative: "Sporný mandát Vysokého představitele" # todo: NEW TRANSLATION
 BOS_contested_high_representative_desc: "Vysoký představitel se ujal funkce bez podpory Rady bezpečnosti OSN. Republika srbská tuto mezeru chápe jako oprávnění ignorovat jeho rozhodnutí a každé použití bonnských pravomocí nyní vyvolává spor o legitimitu stejně jako spor o politiku." # todo: NEW TRANSLATION
 BOS_map_participant: "Akční plán členství NATO" # todo: NEW TRANSLATION
 BOS_map_participant_desc: "Bosenští důstojníci cvičí a plánují po boku protějšků z NATO v rámci Akčního plánu členství, formální cesty k budoucímu přistoupení." # todo: NEW TRANSLATION
 BOS_arms_export_boom: "Rozmach vývozu zbraní" # todo: NEW TRANSLATION
 BOS_arms_export_boom_desc: "Státem napojené zbrojovky pracují na plnou kapacitu, aby plnily objednávky munice ráže NATO i Varšavské smlouvy. Státní pokladna těží a stejně tak i spor o to, ke komu se zásilky skutečně dostávají." # todo: NEW TRANSLATION
 BOS_brain_drain_1: "Masová emigrace" # todo: NEW TRANSLATION
 BOS_brain_drain_1_desc: "Od začátku éry bezvízového cestování odešly statisíce lidí a mezi nimi je nadprůměrně mnoho vzdělaných a mladých. Nedostatek pociťují školy, kliniky i tovární haly." # todo: NEW TRANSLATION
 BOS_brain_drain_eased_tt: "§GVracející se rodiny zmírňují problém masové emigrace§!" # todo: NEW TRANSLATION
 BOS_economic_reconstruction: "Obnovit hospodářství" # todo: NEW TRANSLATION
 BOS_economic_reconstruction_desc: "Poválečná Bosna nikdy nedokončila svou obnovu. O generaci později stát stále potřebuje souvislý hospodářský program místo nahodilé privatizace a zahraničních půjček sjednávaných jednu po druhé." # todo: NEW TRANSLATION
 BOS_reform_agenda_adoption: "Přijmout reformní program" # todo: NEW TRANSLATION
 BOS_reform_agenda_adoption_desc: "Zavázat se k sociálně-ekonomickému reformnímu programu, který EU stanovila jako cenu za obnovení přístupové cesty. Soudní a tržní reformy se zrychlí, jakmile bude moci Brusel poukázat na formální plán." # todo: NEW TRANSLATION
 BOS_growth_plan_negotiations: "Vyjednat plán růstu" # todo: NEW TRANSLATION
 BOS_growth_plan_negotiations_desc: "Zahájit jednání o čerpání z Reformního a růstového nástroje EU. Peníze jsou skutečné, stejně jako podmínky s nimi spojené." # todo: NEW TRANSLATION
 BOS_corridor_vc_northern_construction: "Postavit severní koridor" # todo: NEW TRANSLATION
 BOS_corridor_vc_northern_construction_desc: "Urychlit výstavbu koridoru Vc přes Doboj, Zenici a Sarajevo. Jde o největší infrastrukturní projekt země od války, financovaný převážně z Bruselu." # todo: NEW TRANSLATION
 BOS_corridor_vc_southern_construction: "Prodloužit koridor na jih" # todo: NEW TRANSLATION
 BOS_corridor_vc_southern_construction_desc: "Pokračovat s dálnicí směrem k Mostaru a uzavřít mezeru mezi průmyslovým severem Federace a jejím jihem obráceným k Jadranu." # todo: NEW TRANSLATION
 BOS_corridor_vc_opening: "Otevřít koridor Vc" # todo: NEW TRANSLATION
 BOS_corridor_vc_opening_desc: "Přestřihnout pásku na dokončené trase od maďarské hranice k přístavu Ploče. Jde o nejjasnější výsledek dvou desetiletí rozvoje financovaného EU." # todo: NEW TRANSLATION
 BOS_east_energy_partnership: "Přilákat čínské financování energetiky" # todo: NEW TRANSLATION
 BOS_east_energy_partnership_desc: "Opřít se o čínské státní půjčky a dodavatele, aby uhelné elektrárny v zemi zůstaly v provozu a rozšiřovaly se, bez ohledu na cenu pro přístupový spis EU." # todo: NEW TRANSLATION
 BOS_west_energy_partnership: "Sladit energetickou politiku s EU" # todo: NEW TRANSLATION
 BOS_west_energy_partnership_desc: "Směrovat investice spíše do vodní energie a modernizace sítě financované EU než do nové uhelné kapacity a udržet energetický sektor v rámci evropských pravidel státní podpory." # todo: NEW TRANSLATION
 BOS_defense_industry_revival: "Obnovit zbrojovky" # todo: NEW TRANSLATION
 BOS_defense_industry_revival_desc: "Poskytnout státní podporu podnikům Igman Konjic a Unis Ginex, zbrojovkám, které kdysi zásobovaly polovinu Jugoslávie a nyní pracují výrazně pod kapacitou." # todo: NEW TRANSLATION
 BOS_arms_industry_capacity_expansion: "Rozšířit výrobní kapacitu" # todo: NEW TRANSLATION
 BOS_arms_industry_capacity_expansion_desc: "Modernizovat zbrojovky tak, aby současně provozovaly výrobní linky pro ráže NATO i Varšavské smlouvy — právě tato kombinace činí bosenskou munici prodejnou téměř kdekoli." # todo: NEW TRANSLATION
 BOS_defense_export_drive: "Využít rozmach vývozu" # todo: NEW TRANSLATION
 BOS_defense_export_drive_desc: "Podpořit zbrojovky při rozšiřování výroby pro vývozní trhy otevřené obnovenou zahraniční poptávkou. Zakázkové knihy jsou plné a stále se plní." # todo: NEW TRANSLATION
 BOS_national_jobs_program: "Spustit národní program zaměstnanosti" # todo: NEW TRANSLATION
 BOS_national_jobs_program_desc: "Financovat tvorbu pracovních míst a odbornou přípravu doma, aby statisíce lidí, kteří odešli od začátku bezvízové éry, měly důvod zůstat nebo se vrátit." # todo: NEW TRANSLATION
 BOS_youth_retention_initiative: "Investovat do udržení mladých" # todo: NEW TRANSLATION
 BOS_youth_retention_initiative_desc: "Rozšířit program zaměstnanosti o granty a podporu bydlení zaměřené přímo na mladé absolventy a řemeslníky, kteří tvoří většinu odlivu." # todo: NEW TRANSLATION
 BOS_brain_drain_reversed_tt: "§GProblém masové emigrace byl vyřešen§!" # todo: NEW TRANSLATION
 BOS_corridor_vc_trade_boost: "Koridor Vc otevřen" # todo: NEW TRANSLATION
 BOS_corridor_vc_trade_boost_desc: "Dokončené dálniční spojení zkracuje dobu přepravy napříč zemí a k Jadranu a usnadňuje obchod se zbytkem Evropy." # todo: NEW TRANSLATION
 BOS_defense_industrial_base: "Obnovená obranná průmyslová základna" # todo: NEW TRANSLATION
 BOS_defense_industrial_base_desc: "Igman Konjic a Unis Ginex pracují blíže své původní kapacitě, přesto dodatečná výroba stále soutěží o stejné továrny s civilním zbožím." # todo: NEW TRANSLATION
 BOS_jobs_program_idea: "Národní program zaměstnanosti" # todo: NEW TRANSLATION
 BOS_jobs_program_idea_desc: "Tvorba pracovních míst financovaná státem dává pracovníkům důvod zůstat, místo aby se zařadili do fronty na autobus do Německa." # todo: NEW TRANSLATION
 BOS_youth_retention_idea: "Granty na udržení mladých" # todo: NEW TRANSLATION
 BOS_youth_retention_idea_desc: "Granty na bydlení a kariéru zaměřené na mladé absolventy udržují některé z nich v zemi dostatečně dlouho, aby zde založili rodiny a kariéry." # todo: NEW TRANSLATION
 BOS_mostar_industrial_decline: "Uzavření mostarské huti" # todo: NEW TRANSLATION
 BOS_mostar_industrial_decline_desc: "Hliníkárna, která byla kdysi největším spotřebitelem elektřiny ve Federaci, stojí nečinně a hospodářství Mostaru přišlo o několik tisíc pracovních míst, která dosud nenahradilo." # todo: NEW TRANSLATION
 BOS_mostar_industrial_revival: "Mostar pod novým vedením" # todo: NEW TRANSLATION
 BOS_mostar_industrial_revival_desc: "Strategický investor převzal provoz mostarské hliníkárny a obnovil výrobu ve snížené, ale provozuschopné kapacitě." # todo: NEW TRANSLATION
 BOS_zenica_industrial_decline: "Útlum železáren v Zenici" # todo: NEW TRANSLATION
 BOS_zenica_industrial_decline_desc: "Vysoká pec, která více než století tvořila základ hospodářství Zenice, vychladla a region vstřebává ztrátu tisíců pracovních míst." # todo: NEW TRANSLATION
 BOS_zenica_industrial_revival: "Zenica pod novým vlastníkem" # todo: NEW TRANSLATION
 BOS_zenica_industrial_revival_desc: "Kupující převzal železárny v Zenici a pod novým vedením udržel část bývalých zaměstnanců." # todo: NEW TRANSLATION
 BOS_eu_growth_plan_tranche: "Čerpat tranši z plánu růstu EU" # todo: NEW TRANSLATION
 BOS_eu_growth_plan_tranche_desc: "Požádat o další výplatu z Reformního a růstového nástroje EU. Korupce nad stanoveným prahem nebo vláda příliš nestabilní na vyjednávání povedou ke ztrátě tranše." # todo: NEW TRANSLATION
 BOS_political.58.t: "Mostarská huť zhasíná" # todo: NEW TRANSLATION
 BOS_political.58.d: "Aluminij Mostar, největší jediný spotřebitel elektřiny ve Federaci, byl odpojen kvůli dluhu ve výši stovek milionů vůči elektrárenské společnosti. Glencore před několika měsíci od převzetí odstoupil a znovuspuštění hutě této velikosti po úplném odstavení možná ani nebude možné." # todo: NEW TRANSLATION
 BOS_political.58.a: "Nechte závod zavřít" # todo: NEW TRANSLATION
 BOS_political.58.b: "Hledejte strategického investora" # todo: NEW TRANSLATION
 BOS_political.59.t: "Vysoká pec v Zenici vychladla" # todo: NEW TRANSLATION
 BOS_political.59.d: "ArcelorMittal odstavil vysokou pec ve své ocelárně v Zenici, která byla po více než století základem místní ekonomiky. Slabá evropská poptávka a vysoké náklady na energie způsobily, že provoz linky se stal ztrátovým." # todo: NEW TRANSLATION
 BOS_political.59.a: "Nechte pec vychladnout" # todo: NEW TRANSLATION
 BOS_political.59.b: "Najděte nového vlastníka" # todo: NEW TRANSLATION
 BOS_political.60.t: "Blok 7 v Tuzle padá" # todo: NEW TRANSLATION
 BOS_political.60.d: "Lignitový blok v Tuzle financovaný Čínou je oficiálně mrtvý. Státní záruka za úvěr před lety porušila pravidla EU pro státní podporu a vláda konečně potvrdila to, co Brusel již nějakou dobu říkal. China Gezhouba požaduje splnění smlouvy bez ohledu na okolnosti." # todo: NEW TRANSLATION
 BOS_political.60.a: "Přijměte zrušení" # todo: NEW TRANSLATION
 BOS_political.60.b: "Napadněte ukončení smlouvy" # todo: NEW TRANSLATION
 BOS_political.61.t: "Volné cestování do Evropy" # todo: NEW TRANSLATION
 BOS_political.61.d: "EU zrušila krátkodobá schengenská víza pro držitele bosenských biometrických pasů. Poprvé od války znamená překročení hranice do EU pouze ukázat pas." # todo: NEW TRANSLATION
 BOS_political.61.a: "Oslavte tento milník" # todo: NEW TRANSLATION
 BOS_political.61.b: "Varujte, kam tato cesta vede" # todo: NEW TRANSLATION
 BOS_visa_era_emigration_tt: "§YBezvízové cestování do EU usnadnilo odchod více než kdy dříve§!" # todo: NEW TRANSLATION
 BOS_political.62.t: "Občanský okamžik voleb v roce 2010" # todo: NEW TRANSLATION
 BOS_political.62.d: "Multietnická SDP Zlatka Lagumdžiji poprvé od války zvítězila ve volbách ve Federaci, zatímco SNSD Milorada Dodika ovládla Republiku srbskou. Šest stran nyní musí sestavit vládu, které nebude moci dominovat žádná strana." # todo: NEW TRANSLATION
 BOS_political.62.a: "Navazujme na občanský průlom" # todo: NEW TRANSLATION
 BOS_political.62.b: "Nechte entity hájit své pozice" # todo: NEW TRANSLATION
 BOS_political.63.t: "Koalice o šestnáct měsíců později" # todo: NEW TRANSLATION
 BOS_political.63.d: "Šestnáct měsíců po uzavření volebních místností konečně vznikla koalice šesti stran a sestavila Radu ministrů. Většinu této doby zabralo samotné dohadování o tom, kdo ji povede." # todo: NEW TRANSLATION
 BOS_political.63.a: "Zpět k vládnutí" # todo: NEW TRANSLATION
 BOS_paralysis_lifted_tt: "§GParalýza při sestavování vlády byla vyřešena§!" # todo: NEW TRANSLATION
 BOS_political.64.t: "Návrat nacionalistů" # todo: NEW TRANSLATION
 BOS_political.64.d: "SDA znovu získala postavení nejsilnější strany ve Federaci, Dragan Čović obsadil chorvatské místo v předsednictvu a Dodik těsně udržel Republiku srbskou. Multietnický experiment z roku 2010 se téměř zhroutil." # todo: NEW TRANSLATION
 BOS_political.64.a: "Staré bloky se vracejí z nějakého důvodu" # todo: NEW TRANSLATION
 BOS_political.64.b: "Zkusme znovu občanskou cestu" # todo: NEW TRANSLATION
 BOS_political.65.t: "Mostar znovu hlasuje" # todo: NEW TRANSLATION
 BOS_political.65.d: "Poté, co rozhodnutí evropského soudu přimělo Sarajevo jednat a Izetbegović s Čovićem uzavřeli novou městskou chartu, se v Mostaru poprvé po dvanácti letech konaly místní volby. Rozdělené město má konečně volenou radu." # todo: NEW TRANSLATION
 BOS_political.65.a: "Nový mandát pro město" # todo: NEW TRANSLATION
 BOS_political.65.b: "Křehké příměří, nic víc" # todo: NEW TRANSLATION
 BOS_political.66.t: "Zákon Republiky srbské o zahraničních agentech" # todo: NEW TRANSLATION
 BOS_political.66.d: "Několik dní po Dodikově odsouzení schválilo shromáždění entity narychlo zákon, který nutí nevládní organizace financované ze zahraničí a nezávislá média registrovat se jako zahraniční agenti a hlásit každý dar. OBSE a Benátská komise to označují za ústup občanské společnosti." # todo: NEW TRANSLATION
 BOS_political.66.a: "Odsuďte tento zásah" # todo: NEW TRANSLATION
 BOS_political.66.b: "Republika srbská se zodpovídá sama sobě" # todo: NEW TRANSLATION
 BOS_political.67.t: "Zatykač, který nikdo nevykoná" # todo: NEW TRANSLATION
 BOS_political.67.d: "Dodik ignoroval celostátní i interpolský zatykač a cestoval přes Bělehrad a Izrael do Moskvy. Když se ho státní bezpečnostní agentura pokusila zatknout uvnitř Republiky srbské, policie entity jí v tom zabránila." # todo: NEW TRANSLATION
 BOS_political.67.a: "Prosazujte zatčení" # todo: NEW TRANSLATION
 BOS_political.67.b: "Nechte konfrontaci ochladnout" # todo: NEW TRANSLATION
 BOS_rs_police_standoff_tt: "§RPolicie Republiky srbské chrání Dodika před zatčením, čímž prohlubuje krizi§!" # todo: NEW TRANSLATION
 BOS_political.68.t: "Předčasné volby na Dodikovo křeslo" # todo: NEW TRANSLATION
 BOS_political.68.d: "Poté, co volební komise Dodika zbavila prezidentského úřadu, uspořádala Republika srbská předčasné prezidentské volby. Kandidát SNSD Siniša Karan a kandidát SDS Branko Blanuša skončili s rozdílem menším než tři procentní body." # todo: NEW TRANSLATION
 BOS_political.68.a: "Stroj SNSD obstál" # todo: NEW TRANSLATION
 BOS_political.68.b: "Opozice prorazila" # todo: NEW TRANSLATION
 BOS_political.69.t: "Rozhodnutí ve věci Ljubić" # todo: NEW TRANSLATION
 BOS_political.69.d: "Ústavní soud zrušil záruku alespoň jednoho delegáta za každou etnickou skupinu v každém kantonu ve Sněmovně národů Federace. Parlament nemá většinu potřebnou k přijetí náhrady, takže volební zákon zůstává zmrazený." # todo: NEW TRANSLATION
 BOS_political.69.a: "Varujte, že se nám to vrátí" # todo: NEW TRANSLATION
 BOS_political.69.b: "Vezměte to na vědomí a pokračujte" # todo: NEW TRANSLATION
 BOS_political.49.d_ljubic: "Željko Komšić zvítězil v chorvatských volbách do předsednictva díky hlasům bosňácké většiny a porazil kandidáta HDZ Dragana Čoviće. Stejná mezera ve volebním zákoně, kterou Ústavní soud ponechal otevřenou v rozhodnutí ve věci Ljubić před dvěma lety, je nyní středobodem argumentace HDZ, že chorvatští voliči mohou být vždy přehlasováni. Města s chorvatskou většinou ho prohlašují za nežádoucího a Záhřeb protestuje proti výsledku, který odmítá i jeho vlastní komunita." # todo: NEW TRANSLATION
 BOS_political.70.t: "Bombový útok na policejní stanici v Bugojně" # todo: NEW TRANSLATION
 BOS_political.70.d: "Domácí bomba roztrhla policejní stanici v Bugojně, zabila jednoho policistu a šest dalších zranila. Salafistická buňka, která za útokem stojí, je první významnou domácí džihádistickou sítí, jíž země od války čelila." # todo: NEW TRANSLATION
 BOS_political.70.a: "Považujte to za izolovanou buňku" # todo: NEW TRANSLATION
 BOS_political.70.b: "Bijte na poplach kvůli radikalizaci" # todo: NEW TRANSLATION
 BOS_counter_radicalization_available_tt: "§YNyní je k dispozici rozhodnutí proti radikalizaci§!" # todo: NEW TRANSLATION
 BOS_political.71.t: "Střelba na americkém velvyslanectví" # todo: NEW TRANSLATION
 BOS_political.71.d: "Střelec z wahhábistické enklávy Gornja Maoča vypálil na americké velvyslanectví v Sarajevu více než sto ran, než ho zneškodnil policejní odstřelovač. Problém radikalizace v zemi již není pouze domácí záležitostí." # todo: NEW TRANSLATION
 BOS_political.71.a: "Vstřebejte diplomatické následky" # todo: NEW TRANSLATION
 BOS_political.71.b: "Požadujte odpovědi ohledně enkláv" # todo: NEW TRANSLATION
 BOS_salafi_enclave_decision_available_tt: "§YNyní je k dispozici rozhodnutí monitorovat salafistické enklávy§!" # todo: NEW TRANSLATION
 BOS_political.72.t: "Útok na policejní stanici ve Zvorniku" # todo: NEW TRANSLATION
 BOS_political.72.d: "Střelec zabil policistu na stanici ve Zvorniku v Republice srbské, než byl sám zastřelen. Jde o první islamistický útok uvnitř srbské entity. Někteří jeho známí spolupracovníci bojovali v Sýrii." # todo: NEW TRANSLATION
 BOS_political.72.a: "Hrozba nezná hranice entit" # todo: NEW TRANSLATION
 BOS_political.73.t: "Washington uvaluje sankce na Dodikovu síť" # todo: NEW TRANSLATION
 BOS_political.73.d: "Americké ministerstvo financí uvalilo sankce na Milorada Dodika a rozšířilo jejich okruh na jeho rodinu a klientelistickou síť s odvoláním na korupci a záměrné maření Daytonu. Jde o dosud nejostřejší západní donucovací nástroj namířený proti Republice srbské." # todo: NEW TRANSLATION
 BOS_political.73.a: "Odpovědnost přichází pozdě" # todo: NEW TRANSLATION
 BOS_political.73.b: "Útok na samotnou Republiku srbskou" # todo: NEW TRANSLATION
 BOS_sanctions_deepen_crisis_tt: "§RSankce prohlubují probíhající krizi odtržení Republiky srbské§!" # todo: NEW TRANSLATION
 BOS_political.74.t: "Babylution" # todo: NEW TRANSLATION
 BOS_political.74.d: "Parlament nechal v patové situaci propadnout zákon o identifikačních číslech občanů, takže novorozenci měsíce zůstávali bez identifikačních čísel, pasů a zdravotních průkazů. Poté, co vážně nemocné dítě zemřelo při čekání na léčbu v zahraničí, vyšlo v Sarajevu do ulic deset tisíc lidí, což je největší občanský protest od války." # todo: NEW TRANSLATION
 BOS_political.74.a: "Slibte rychlou nápravu" # todo: NEW TRANSLATION
 BOS_political.74.b: "Nechte parlament, ať si poradí" # todo: NEW TRANSLATION
 BOS_political.75.t: "Bosna se kvalifikovala na mistrovství světa" # todo: NEW TRANSLATION
 BOS_political.75.d: "Výhra 1:0 v Litvě poslala Bosnu a Hercegovinu na její první mistrovství světa jako nezávislý stát. Na několik týdnů má tým Edina Džeka celou zemi sjednocenou kolem jediné věci." # todo: NEW TRANSLATION
 BOS_political.75.a: "Země sjednocená, byť jen na chvíli" # todo: NEW TRANSLATION
 BOS_political.81.t: "Dohoda o stabilizaci a přidružení konečně vstupuje v platnost" # todo: NEW TRANSLATION
 BOS_political.81.d: "Devět let po podpisu vstoupila Dohoda o stabilizaci a přidružení v platnost. Obnovuje evropskou cestu, která byla roky zablokována, a vytváří základ pro reformní agendu, jež se nyní formuje v Radě ministrů." # todo: NEW TRANSLATION
 BOS_political.81.a: "Nový začátek s Bruselem" # todo: NEW TRANSLATION
 BOS_political.77.t: "B&H Airlines definitivně uzemněny" # todo: NEW TRANSLATION
 BOS_political.77.d: "Vláda Federace zlikvidovala národního dopravce B&H Airlines kvůli dluhům, které nikdy nemohl splatit. Poprvé od získání nezávislosti nemá země vlastní národní leteckou společnost." # todo: NEW TRANSLATION
 BOS_political.77.a: "Nechte ji zaniknout" # todo: NEW TRANSLATION
 BOS_political.77.b: "Zachraňte ji" # todo: NEW TRANSLATION
 BOS_political.78.t: "Oznámen projekt Buroj Ozone" # todo: NEW TRANSLATION
 BOS_political.78.d: "Dubajská společnost Buroj Property Development představila plány na letovisko u Trnova nedaleko Sarajeva v hodnotě 4,3 miliardy eur a slíbila tisíce pracovních míst. Kapitál ze zemí Perského zálivu se jako nikdy předtím zaměřuje na bosenský realitní a turistický sektor." # todo: NEW TRANSLATION
 BOS_political.78.a: "Přivítejte oznámení" # todo: NEW TRANSLATION
 BOS_political.76.t: "EFT Stanari zahajuje provoz" # todo: NEW TRANSLATION
 BOS_political.76.d: "Lignitová elektrárna Stanari o výkonu 300 megawattů nedaleko Banja Luky zahájila komerční provoz. Jde o první novou tepelnou elektrárnu postavenou v Bosně od války. Republika srbská nyní disponuje vlastním stabilním zdrojem energie, financovaným a vybudovaným s čínskou pomocí." # todo: NEW TRANSLATION
 BOS_political.76.a: "Důvod k hrdosti Republiky srbské" # todo: NEW TRANSLATION
 BOS_political.80.t: "První sarajevský Pride" # todo: NEW TRANSLATION
 BOS_political.80.d: "Přibližně dva tisíce lidí prošly Sarajevem na prvním Pride v zemi, která byla posledním bývalým jugoslávským hlavním městem, kde se konal. Malý protidemonstrantský protest se shromáždil pod heslem „tradičních hodnot“, průvod však proběhl bez násilí." # todo: NEW TRANSLATION
 BOS_political.80.a: "Zajistěte demonstrantům ochranu" # todo: NEW TRANSLATION
 BOS_political.80.b: "Držte si odstup" # todo: NEW TRANSLATION
 BOS_political.79.t: "Povodně a sesuvy pohřbily Jablanicu" # todo: NEW TRANSLATION
 BOS_political.79.d: "Bleskové povodně a sesuvy půdy zasáhly střední a jižní Bosnu, což je nejhorší katastrofa, jakou země zažila za poslední desetiletí. Donja Jablanica byla zasažena nejhůře, když proud bahna a sutin pohřbil domy a zabil desítky lidí." # todo: NEW TRANSLATION
 BOS_political.79.a: "Požádejte EU o solidární pomoc" # todo: NEW TRANSLATION
 BOS_political.79.b: "Obnovme zemi vlastními silami" # todo: NEW TRANSLATION
 BOS_pass_jmbg_law: "Přijmout zákon o JMBG" # todo: NEW TRANSLATION
 BOS_pass_jmbg_law_desc: "Prosadit parlamentem náhradní zákon o identifikačních číslech občanů a ukončit výpadek registrace, kvůli němuž novorozenci zůstávají bez dokladů totožnosti." # todo: NEW TRANSLATION
 BOS_jmbg_law_passed_tt: "§GZákon o identifikačních číslech občanů byl nahrazen a protesty utichly§!" # todo: NEW TRANSLATION
 BOS_counter_radicalization_program: "Spustit program proti radikalizaci" # todo: NEW TRANSLATION
 BOS_counter_radicalization_program_desc: "Financovat osvětu a monitorování zaměřené na salafistické sítě stojící za nedávným bombovým útokem a zmírnit část škod na vnitřní bezpečnosti." # todo: NEW TRANSLATION
 BOS_monitor_salafi_enclaves: "Monitorovat salafistické enklávy" # todo: NEW TRANSLATION
 BOS_monitor_salafi_enclaves_desc: "Udržovat vesnice jako Gornja Maoča pod trvalým dohledem. Zlepší se odhalování hrozeb, zároveň však bosňáckým komunitám žijícím v těchto místech přesně ukážeme, jak je stát vnímá." # todo: NEW TRANSLATION
 BOS_repatriate_foreign_fighters: "Repatriovat a stíhat zahraniční bojovníky" # todo: NEW TRANSLATION
 BOS_repatriate_foreign_fighters_desc: "Přivézt zpět občany, kteří bojovali za ISIS v Sýrii a Iráku, a soudit je podle protiteroristického zákona z roku 2014. Reintegrace je nákladná a ne každý případ skončí hladce." # todo: NEW TRANSLATION
 BOS_reintegration_success_tt: "§GNávratové se podařilo úspěšně reintegrovat§!" # todo: NEW TRANSLATION
 BOS_reintegration_relapse_tt: "§RNěkteří navrátilci se znovu přiklonili k radikálním sítím§!" # todo: NEW TRANSLATION
 BOS_government_formation_paralysis: "Paralýza při sestavování vlády" # todo: NEW TRANSLATION
 BOS_government_formation_paralysis_desc: "Žádná koalice nemá dostatek křesel k sestavení Rady ministrů. Ministerstva fungují na provizorních rozpočtech, zatímco strany vyjednávají." # todo: NEW TRANSLATION
 BOS_civil_society_crackdown: "Zásah proti občanské společnosti" # todo: NEW TRANSLATION
 BOS_civil_society_crackdown_desc: "Zákon Republiky srbské o zahraničních agentech nutí nevládní organizace a nezávislá média registrovat se, hlásit své financování a označovat vlastní obsah. Dozorové organizace i dárci se od entity stahují." # todo: NEW TRANSLATION
 BOS_domestic_terror_threat_1: "Hrozba domácího terorismu" # todo: NEW TRANSLATION
 BOS_domestic_terror_threat_1_desc: "Malá, ale aktivní salafistická síť působí převážně mimo dohled státu a získává rekruty z několika izolovaných komunit." # todo: NEW TRANSLATION
 BOS_counter_radicalization_measures: "Opatření proti radikalizaci" # todo: NEW TRANSLATION
 BOS_counter_radicalization_measures_desc: "Osvětové programy a rozšířené monitorování postupně oslabují sítě, které stály za bombovým útokem v Bugojně." # todo: NEW TRANSLATION
 BOS_salafi_enclave_monitoring: "Monitorování salafistických enkláv" # todo: NEW TRANSLATION
 BOS_salafi_enclave_monitoring_desc: "Bezpečnostní složky trvale dohlížejí na Gornju Maoču a podobné komunity. Odhalí více plánovaných útoků než dříve, avšak za cenu ztráty důvěry v monitorovaných čtvrtích." # todo: NEW TRANSLATION
 BOS_foreign_fighter_reintegration: "Reintegrace zahraničních bojovníků" # todo: NEW TRANSLATION
 BOS_foreign_fighter_reintegration_desc: "Navrátilci odsouzení a propuštění v rámci repatriačního programu jsou vedeni k práci a odváděni od sítí, které je poprvé naverbovaly." # todo: NEW TRANSLATION
 BOS_eufor_deterrence: "Posílení EUFOR" # todo: NEW TRANSLATION
 BOS_eufor_deterrence_desc: "Větší posádka EUFOR Althea viditelně připomíná, že bosenský mír má zahraniční garanty. To působí na každého v Banja Luce, kdo uvažuje o odtržení." # todo: NEW TRANSLATION
 BOS_eufor_deterrence_tt: "§YPosílená přítomnost EUFOR snižuje riziko pokusu Republiky srbské o odtržení§!" # todo: NEW TRANSLATION
 BOS_jmbg_crisis: "Krize JMBG" # todo: NEW TRANSLATION
 BOS_jmbg_crisis_desc: "Novorozenci zůstávají bez dokladů totožnosti, zatímco parlament se nedokáže dohodnout na náhradním zákonu o identifikačních číslech občanů. Čím déle krize trvá, tím větší jsou protesty." # todo: NEW TRANSLATION
 BOS_world_cup_unity: "Horečka mistrovství světa" # todo: NEW TRANSLATION
 BOS_world_cup_unity_desc: "Postup národního týmu na jeho první mistrovství světa dal Bosňákům, Chorvatům i Srbům něco, čemu mohou současně fandit." # todo: NEW TRANSLATION
 BOS_stanari_plant_online: "Elektrárna Stanari v provozu" # todo: NEW TRANSLATION
 BOS_stanari_plant_online_desc: "Čínská lignitová elektrárna Stanari dodává stabilní energii do sítě Republiky srbské. Jde o první novou tepelnou kapacitu vybudovanou v celé zemi od války." # todo: NEW TRANSLATION
 BOS_national_carrier_pride: "Hrdost na národního dopravce" # todo: NEW TRANSLATION
 BOS_national_carrier_pride_desc: "Státem dotovaný národní dopravce stále létá, což je malý důvod k hrdosti v zemi, která od roku 2015 žádného jiného neměla." # todo: NEW TRANSLATION
