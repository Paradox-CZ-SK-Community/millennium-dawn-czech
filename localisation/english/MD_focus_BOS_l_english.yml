 BOS_croat_secession_crisis: "Chorvatská krize odtržení" # todo: NEW TRANSLATION
 BOS_croat_secession_crisis_desc: "Instituce Herceg-Bosny připravují zákony o odtržení a cvičí vlastní jednotky. Pokud nebudou chorvatské stížnosti vyřešeny dříve, než skončí patová situace, jih se odtrhne se zbraní v ruce." # todo: NEW TRANSLATION
 BOS_dayton_two: "Revidované daytonské urovnání" # todo: NEW TRANSLATION
