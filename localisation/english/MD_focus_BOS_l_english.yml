 BOS_bosniak_governing_partner_desc: "Loajální bosňácký partner udrží koaliční politiku stabilní a sníží nepokoje." # todo: NEW TRANSLATION
 BOS_croat_governing_partner: "Chorvatský koaliční partner" # todo: NEW TRANSLATION
 BOS_croat_governing_partner_desc: "Loajální chorvatský partner podpoří hospodářské reformy, sníží však domácí koaliční flexibilitu." # todo: NEW TRANSLATION
 BOS_srpska_governing_partner: "Srbský koaliční partner" # todo: NEW TRANSLATION
 BOS_srpska_governing_partner_desc: "Loajální srbský partner zlepší bezpečnostní spolupráci, oslabí však federální dohled." # todo: NEW TRANSLATION
