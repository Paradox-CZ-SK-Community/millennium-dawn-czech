 bos_srpska_gui_info_TOOLTIP: "§YSrbové§! žijí převážně v Republice srbské, části země, která z východu a severu obklopuje Federaci Bosny a Hercegoviny. Republika srbská je autonomní entitou v rámci Bosny a Hercegoviny. Většina jejích obyvatel vyznává pravoslaví." # todo: CHANGED
