 BOS_events.35.a: "Přijmout závazky" # todo: NEW TRANSLATION
 BOS_events.36.t: "Členství v ODKB zamítnuto" # todo: NEW TRANSLATION
 BOS_events.36.d: "Rusko naši žádost zamítlo a odmítlo rozšířit alianci na Balkán." # todo: NEW TRANSLATION
 BOS_events.36.a: "Přehodnotit naši východní politiku" # todo: NEW TRANSLATION
 BOS_events.15.t: "Nabídka bosenské zbrojní spolupráce" # todo: NEW TRANSLATION
 BOS_events.15.d: "[FROM.GetName] navrhl obranně-průmyslové uspořádání a požádal o výrobní licence na srbská letadla a pušky. Užší vojenské vazby by připoutaly Sarajevo k Bělehradu, ačkoli někteří v Bosně by tuto závislost odmítali." # todo: NEW TRANSLATION
 BOS_events.15.a: "Udělit výrobní licence" # todo: NEW TRANSLATION
 BOS_events.15.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 BOS_events.16.t: "Bělehrad uděluje zbrojní licence" # todo: NEW TRANSLATION
 BOS_events.16.d: "Srbsko schválilo převod výrobních licencí. Bosenské továrny nyní mohou vyrábět srbské konstrukce, ačkoli prosrbské nálady mezi bosňáckými komunitami vyvolaly nepokoje." # todo: NEW TRANSLATION
 BOS_events.16.a: "Zahájit licencovanou výrobu" # todo: NEW TRANSLATION
 BOS_events.17.t: "Bělehrad odmítá" # todo: NEW TRANSLATION
 BOS_events.17.d: "Srbsko odmítlo nabídku zbrojní spolupráce, protože za těchto podmínek nechce sdílet svůj obranný průmysl." # todo: NEW TRANSLATION
 BOS_events.17.a: "Hledat jinde" # todo: NEW TRANSLATION
 BOS_events.18.t: "Pozvání k investici v Bosně" # todo: NEW TRANSLATION
 BOS_events.18.d: "[FROM.GetName] zve zahraniční výrobce automobilů k založení výroby v zemi. Výstavba závodu by otevřela nový trh a rozšířila náš obchodní vliv na bosenskou ekonomiku." # todo: NEW TRANSLATION
 BOS_events.18.a: "Postavit továrnu v Bosně" # todo: NEW TRANSLATION
 BOS_events.18.b: "Odmítnout pozvání" # todo: NEW TRANSLATION
 BOS_events.19.t: "Zahraniční výrobce automobilů investuje" # todo: NEW TRANSLATION
 BOS_events.19.d: "[FROM.GetName] souhlasil s výstavbou závodu v Bosně. Investice přináší pracovní místa a kapitál, ale vláda domovské země výrobce získá oporu v naší průmyslové politice." # todo: NEW TRANSLATION
 BOS_events.19.a: "Uvítat investici" # todo: NEW TRANSLATION
 BOS_events.20.t: "Investice odmítnuta" # todo: NEW TRANSLATION
 BOS_events.20.d: "[FROM.GetName] se prozatím rozhodl neinvestovat do bosenského automobilového průmyslu." # todo: NEW TRANSLATION
 BOS_events.20.a: "Oslovit jiného výrobce" # todo: NEW TRANSLATION
 BOS_events.21.t: "Bosna chce koupit pušky" # todo: NEW TRANSLATION
 BOS_events.21.d: "[FROM.GetName] si přeje zakoupit zásilku moderních německých pěchotních zbraní. Prodej by přinesl tvrdou měnu a dobrou vůli v Sarajevu." # todo: NEW TRANSLATION
 BOS_events.21.a: "Schválit prodej" # todo: NEW TRANSLATION
 BOS_events.21.b: "Odmítnout prodej" # todo: NEW TRANSLATION
 BOS_events.22.t: "Německé pušky doručeny" # todo: NEW TRANSLATION
 BOS_events.22.d: "Německo schválilo prodej. Zásilka moderních pěchotních zbraní je na cestě do našich skladů." # todo: NEW TRANSLATION
 BOS_events.22.a: "Rozdělit zbraně" # todo: NEW TRANSLATION
 BOS_events.23.t: "Německo prodej odmítá" # todo: NEW TRANSLATION
 BOS_events.23.d: "Berlín v tuto chvíli odmítl prodat Bosně pěchotní zbraně." # todo: NEW TRANSLATION
 BOS_events.23.a: "Hledat jiného dodavatele" # todo: NEW TRANSLATION
 BOS_events.24.t: "Bosna žádá o ruské pušky" # todo: NEW TRANSLATION
 BOS_events.24.d: "[FROM.GetName] si přeje koupit velké zásoby ruských pěchotních zbraní. Objednávka by byla vítaným prodejem pro ruský průmysl." # todo: NEW TRANSLATION
 BOS_events.24.a: "Schválit prodej" # todo: NEW TRANSLATION
 BOS_events.24.b: "Odmítnout prodej" # todo: NEW TRANSLATION
 BOS_events.25.t: "Ruské pušky doručeny" # todo: NEW TRANSLATION
 BOS_events.25.d: "Rusko schválilo prodej. Velká zásilka pěchotních zbraní je na cestě do našich zásob." # todo: NEW TRANSLATION
 BOS_events.25.a: "Rozdělit zbraně" # todo: NEW TRANSLATION
 BOS_events.26.t: "Rusko prodej odmítá" # todo: NEW TRANSLATION
 BOS_events.26.d: "Moskva v tuto chvíli odmítla prodat Bosně pěchotní zbraně." # todo: NEW TRANSLATION
 BOS_events.26.a: "Hledat jiného dodavatele" # todo: NEW TRANSLATION
 BOS_political.4.t: "Poválečné volby v Bosně" # todo: NEW TRANSLATION
 BOS_political.4.d: "První celostátní volby Bosny a Hercegoviny v novém století rozhodnou, která koalice povede křehké poválečné instituce země." # todo: NEW TRANSLATION
 BOS_political.4.a: "Ponechat vládu vedenou Bosňáky" # todo: NEW TRANSLATION
 BOS_political.4.a_tt: "§YStrana demokratické akce§! povede vládu. Další rotace prezidentského úřadu připadne srbskému představiteli." # todo: NEW TRANSLATION
 BOS_political.4.b: "Podpořit koalici vedenou Srby" # todo: NEW TRANSLATION
 BOS_political.4.b_tt: "§YSvaz nezávislých sociálních demokratů§! povede koalici se §YSrbskou demokratickou stranou§!. Další rotace prezidentského úřadu připadne chorvatskému představiteli." # todo: NEW TRANSLATION
 BOS_political.20.t: "Urovnání po občanské válce" # todo: NEW TRANSLATION
 BOS_political.20.d: "Válka skončila. Bosna a Hercegovina byla znovu sjednocena pod jednou autoritou a bezprostředním úkolem je stabilizovat stát, zatímco bývalé frakce budou rozpuštěny." # todo: NEW TRANSLATION
 BOS_political.20.a: "Založit Velkou Srpsku" # todo: NEW TRANSLATION
 BOS_political.20.b: "Založit vládu vedenou Chorvaty" # todo: NEW TRANSLATION
 BOS_political.20.c: "Znovu sjednotit Bosnu pod sarajevskou kontrolou" # todo: NEW TRANSLATION
 BOS_political.1.t: "Poválečný stát" # todo: NEW TRANSLATION
 BOS_political.1.d: "Bosna a Hercegovina vstupuje do nového století s poškozenými institucemi, rozdělenou mocí a nedokončenou obnovou. Vláda musí rozhodnout, kolik pravomocí by mělo zůstat entitám." # todo: NEW TRANSLATION
 BOS_political.1.a: "Definovat nový stát" # todo: NEW TRANSLATION
 BOS_political.2.t: "Rozšířená autonomie entit" # todo: NEW TRANSLATION
 BOS_political.2.d: "Vláda převedla další vnitrostátní pravomoci na Hercegovinu a Republiku srbskou, přičemž si ponechala společnou zahraniční a obrannou politiku. Bosna nyní funguje jako volnější federace." # todo: NEW TRANSLATION
 BOS_political.2.a: "Provést urovnání" # todo: NEW TRANSLATION
 BOS_political.3.t: "Federální znovusjednocení" # todo: NEW TRANSLATION
 BOS_political.3.d: "Rozšířená autonomie vytvořila v etnicky smíšených komunitách překrývající se pravomoci a oslabila společné služby. Vedoucí představitelé entit přijali znovusjednocení na základě federálního uspořádání, které zachovává místní zastoupení." # todo: NEW TRANSLATION
 BOS_political.3.a: "Znovu sjednotit federaci" # todo: NEW TRANSLATION
 BOS_political.5.t: "Finanční krize" # todo: NEW TRANSLATION
 BOS_political.5.d: "Globální finanční krize omezila vývoz, zpřísnila úvěrové podmínky a přiměla bosenské zaměstnavatele k propouštění. Obnova bude vyžadovat koordinovanou fiskální a průmyslovou politiku." # todo: NEW TRANSLATION
 BOS_political.5.a: "Připravit program obnovy" # todo: NEW TRANSLATION
 BOS_political.6.t: "Milorad Dodik" # todo: NEW TRANSLATION
 BOS_political.6.d: "Milorad Dodik upevnil své vedení v Republice srbské a učinil autonomii entity středobodem svého politického programu. Jeho rostoucí síť zkomplikuje každý pokus o posílení celostátních institucí." # todo: NEW TRANSLATION
 BOS_political.6.a: "Sarajevo musí reagovat" # todo: NEW TRANSLATION
 BOS_political.8.t: "Spor o segregaci přerostl v násilí" # todo: NEW TRANSLATION
 BOS_political.8.d: "Spor o integraci srbských a bosňáckých žáků vyústil v pochod na obecní shromáždění. Vandalismus a útoky na podniky vlastněné navrátilci donutily zasáhnout pořádkovou policii." # todo: NEW TRANSLATION
 BOS_political.8.a: "Rozdělení přetrvává" # todo: NEW TRANSLATION
 BOS_political.9.t: "Mírové síly plánují omezení přítomnosti" # todo: NEW TRANSLATION
 BOS_political.9.d: "NATO oznámilo omezení své mírové přítomnosti v Bosně, protože se bezpečnostní situace zlepšuje. Místní představitelé se neshodují, zda jsou národní síly připraveny převzít tuto misi." # todo: NEW TRANSLATION
 BOS_political.9.a: "Prověřit naši připravenost" # todo: NEW TRANSLATION
 BOS_political.10.t: "Zpráva dokumentuje útoky na tisk" # todo: NEW TRANSLATION
 BOS_political.10.d: "Nová zpráva zaznamenává nárůst hrozeb a útoků proti bosenským novinářům v průběhu roku 2002. Z velké části jsou za zastrašování obviňovány nacionalistické organizace a místní političtí patroni." # todo: NEW TRANSLATION
 BOS_political.10.a: "Chránit nezávislé zpravodajství" # todo: NEW TRANSLATION
 BOS_political.11.t: "Nikolić odsouzen na 23 let" # todo: NEW TRANSLATION
 BOS_political.11.d: "Soud odsoudil bosenskosrbského důstojníka Dragana Nikoliće k 23 letům vězení za zločiny spáchané v internačním táboře Sušica. Rozsudek znovu otevřel politické spory o odpovědnosti za válečné zločiny." # todo: NEW TRANSLATION
 BOS_political.11.a: "Spravedlnost musí být vykonána" # todo: NEW TRANSLATION
 BOS_political.13.t: "Návraty uprchlíků dosáhly nového maxima" # todo: NEW TRANSLATION
 BOS_political.13.d: "S tím, jak se zlepšuje bezpečnost a obnovují domy, se vrací stále více vysídlených občanů. Místní úřady musí poskytovat služby a chránit navrátilce v komunitách, kde přetrvává napětí z války." # todo: NEW TRANSLATION
 BOS_political.13.a: "Podpořit jejich návrat" # todo: NEW TRANSLATION
 BOS_political.14.t: "Silné mrazy zasáhly uprchlíky a navrátilce" # todo: NEW TRANSLATION
 BOS_political.14.d: "Komunity uprchlíků a navrátilců po celé Bosně a Hercegovině zasáhly silné mrazy. Domácí úřady a Organizace spojených národů mají potíže s dodávkami paliva na vytápění, přístřeší a potravin." # todo: NEW TRANSLATION
 BOS_political.14.a: "Mobilizovat nouzovou pomoc" # todo: NEW TRANSLATION
 BOS_political.15.t: "Výbuch poškodil hrob Aliji Izetbegoviće" # todo: NEW TRANSLATION
 BOS_political.15.d: "Výbušné zařízení poškodilo hrob bývalého prezidenta Aliji Izetbegoviće v Sarajevu. Útok vyvolal veřejné pobouření a obnovil obavy z politicky motivovaného násilí." # todo: NEW TRANSLATION
 BOS_political.15.a: "Vyšetřit útok" # todo: NEW TRANSLATION
 BOS_political.17.t: "Povodně v jihovýchodní Evropě" # todo: NEW TRANSLATION
 BOS_political.17.d: "Rekordní srážky zaplavily města, poškodily infrastrukturu a vyvolaly sesuvy půdy v Bosně a sousedních státech. Záchranné složky čelí dlouhodobému úsilí o pomoc a obnovu." # todo: NEW TRANSLATION
 BOS_political.17.a: "Koordinovat pomoc po katastrofě" # todo: NEW TRANSLATION
 BOS_events.55.t: "Alija Izetbegović zemřel" # todo: NEW TRANSLATION
 BOS_events.55.d: "Bývalý prezident Alija Izetbegović zemřel na komplikace srdečního onemocnění. Jeho smrt uzavírá zásadní kapitolu bosňácké politiky a boje Bosny a Hercegoviny za nezávislost." # todo: NEW TRANSLATION
 BOS_events.55.a: "Uctít jeho odkaz" # todo: NEW TRANSLATION
 BOS_events.55.b: "Stát musí jít dál" # todo: NEW TRANSLATION
 BOS_political.21.t: "Bosna žádá o záruku" # todo: NEW TRANSLATION
 BOS_political.21.d: "[FROM.GetName] nás požádala, abychom zaručili její nezávislost, zatímco EUFOR převádí bezpečnostní odpovědnost na bosenské instituce." # todo: NEW TRANSLATION
 BOS_political.21.a: "Zaručit Bosnu" # todo: NEW TRANSLATION
 BOS_political.21.b: "Odmítnout závazek" # todo: NEW TRANSLATION
 BOS_political.22.t: "Bosna navrhuje unii" # todo: NEW TRANSLATION
 BOS_political.22.d: "Vláda vedená Srpskou v zemi [FROM.GetName] navrhla začlenění do Srbska. Přijetí by převedlo území Bosny a její ozbrojené síly pod náš stát." # todo: NEW TRANSLATION
 BOS_political.22.a: "Schválit unii" # todo: NEW TRANSLATION
 BOS_political.22.b: "Zachovat oddělené státy" # todo: NEW TRANSLATION
 BOS_zivko_radisic: "Živko Radišić" # todo: NEW TRANSLATION
