 BOS_events.63.d: "Bosňáky vedená vláda chce rozšířit centrální rozpočet a financovat státní instituce, které entity dlouhodobě zanedbávaly. Banja Luka bude nelibě snášet každou konvertibilní marku." # todo: NEW TRANSLATION
 BOS_events.63.a: "Rozšiřte rozpočet" # todo: NEW TRANSLATION
 BOS_events.63.b: "Ponechte rozpočet beze změny" # todo: NEW TRANSLATION
 BOS_events.64.t: "Autobusy stále odjíždějí" # todo: NEW TRANSLATION
 BOS_events.64.d: "Emigraci již nelze přehlížet. Celé směny zůstávají neobsazené a mladé rodiny prodávají své domovy. Programy zaměstnanosti, granty na udržení mládeže, obchodní spojení koridorem Vc a převody peněz diaspory jsou nástroje, které mohou odliv zpomalit." # todo: NEW TRANSLATION
 BOS_events.64.a: "Musíme udržet naše lidi doma" # todo: NEW TRANSLATION
 BOS_events.65.t: "Země se vyprazdňuje" # todo: NEW TRANSLATION
 BOS_events.65.d: "Exodus dosáhl krizové úrovně. Kliniky se zavírají kvůli nedostatku zdravotních sester a vesnice jsou z poloviny prázdné. Pouze soustavná práce na programech zaměstnanosti, grantech na udržení mládeže, koridoru Vc a převodech peněz může tlak zmírnit." # todo: NEW TRANSLATION
 BOS_events.65.a: "Zvrátit úpadek" # todo: NEW TRANSLATION
 BOS_entity_competency_transfer: "Převedené pravomoci entity" # todo: NEW TRANSLATION
 BOS_entity_competency_transfer_desc: "Pravomoci vybírat příjmy byly převedeny na entitu, což přineslo politický klid za cenu pomalejší a spornější centrální vlády." # todo: NEW TRANSLATION
 BOS_corruption_hits_weakest_tt: "§RKomunita s nejnižší důvěrou ve vládu při vypuknutí skandálu dále ztratí půdu pod nohama.§!" # todo: NEW TRANSLATION
 BOS_eu_accession_push: "Tlak na vstup do Evropy" # todo: NEW TRANSLATION
 BOS_eu_accession_push_desc: "Po zajištění formálního statusu kandidáta a získání podpory všech komunit posuňte agendu přistoupení vpřed. Mezinárodní věřitelé odmění toto tempo a důvěra v reformní vládu vzroste." # todo: NEW TRANSLATION
 BOS_electoral_reform_package: "Balíček volebních reforem" # todo: NEW TRANSLATION
 BOS_electoral_reform_package_desc: "Jakmile všechny komunity důvěřují státu, lze konečně nahradit diskriminační strukturu předsednictva. Ukončení etnického kvótového systému odstraní hrozbu odtržení, která stíhala starý rotující úřad, a zároveň zachová jeho stabilizační přínosy." # todo: NEW TRANSLATION
 BOS_open_balkan_initiative: "Iniciativa Otevřený Balkán" # todo: NEW TRANSLATION
 BOS_open_balkan_initiative_desc: "Připojte se k regionálnímu trhu vedenému Srbskem, který umožňuje volný pohyb zboží, práce a kapitálu. Bělehrad získá v Sarajevu vliv, srbští představitelé však užší vztahy vítají a drobné podnikání rozkvete." # todo: NEW TRANSLATION
 BOS_berlin_process_commitment: "Závazek k Berlínskému procesu" # todo: NEW TRANSLATION
 BOS_berlin_process_commitment_desc: "Ukotvěte regionální spolupráci v Berlínském procesu podporovaném Německem místo v oběžné dráze Bělehradu. Proevropská cesta uklidní chorvatské a bosňácké partnery a otevře dveře západnímu financování." # todo: NEW TRANSLATION
 BOS_confront_entity_obstruction: "Postavit se obstrukcím entity" # todo: NEW TRANSLATION
 BOS_confront_entity_obstruction_desc: "Republika srbská roky blokuje státní instituce a vyhrožuje odchodem. Rozhodněte, zda se obstrukcím postavíte čelně, nebo získáte klid ústupky." # todo: NEW TRANSLATION
 BOS_energy_transition_strategy: "Strategie energetické transformace" # todo: NEW TRANSLATION
 BOS_energy_transition_strategy_desc: "Překonejte rozdělení na uhlí a vodní energii pomocí obnovitelných kapacit rozložených v obou entitách. Společné projekty uklidní chorvatské a srbské komunity a dají mladým pracovníkům důvod zůstat." # todo: NEW TRANSLATION
 BOS_digital_diaspora_economy: "Digitální ekonomika diaspory" # todo: NEW TRANSLATION
 BOS_digital_diaspora_economy_desc: "Propojte technologický sektor s početnou komunitou emigrantů v zahraničí. Práce na dálku a návrat talentů zmírní tlak emigrace a získají podporu malých a středních podnikatelů." # todo: NEW TRANSLATION
 BOS_census_2023: "Sčítání lidu v roce 2023" # todo: NEW TRANSLATION
 BOS_census_2023_desc: "Proveďte dlouho odkládané sčítání lidu. Výsledky vyřeší spory o počtech jednotlivých komunit, avšak každá skupina, kterou vláda zdůrazní, se bude cítit uznána na úkor soupeře." # todo: NEW TRANSLATION
 BOS_eu_candidacy_momentum: "Rozmach kandidatury do EU" # todo: NEW TRANSLATION
 BOS_eu_candidacy_momentum_desc: "Formální status kandidáta povzbudil reformní tábor a posílil veřejnou důvěru ve vládu." # todo: NEW TRANSLATION
 BOS_reformed_presidency: "Reformované předsednictvo" # todo: NEW TRANSLATION
 BOS_reformed_presidency_desc: "Rotující etnické předsednictvo bylo nahrazeno systémem otevřeným každému občanovi. Vládnutí je klidnější a legitimnější a trvalá hrozba odtržení entit pominula." # todo: NEW TRANSLATION
 BOS_open_balkan_market: "Trh Otevřený Balkán" # todo: NEW TRANSLATION
 BOS_open_balkan_market_desc: "Členství v regionálním trhu rozšířilo vývozní příležitosti bosenských firem za mírnou cenu pro domácí spotřebu." # todo: NEW TRANSLATION
 BOS_digital_economy_idea: "Digitální ekonomika" # todo: NEW TRANSLATION
 BOS_digital_economy_idea_desc: "Investice do konektivity a softwaru zvýšily výzkumnou produkci a pomohly továrnám osvojit si moderní postupy." # todo: NEW TRANSLATION
 BOS_events.66.t: "Obstrukce entity" # todo: NEW TRANSLATION
 BOS_events.66.d: "Vedení Republiky srbské znovu zablokovalo státní legislativu a naznačilo odchod z federálních institucí. Vláda musí reagovat, než se paralýza rozšíří." # todo: NEW TRANSLATION
