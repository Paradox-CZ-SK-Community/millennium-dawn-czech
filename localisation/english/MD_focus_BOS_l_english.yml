 anto_jelec: "Anto Jeleč" # todo: NEW TRANSLATION
 anto_jelec_desc: "Bosenský chorvatský velitel se zkušenostmi s obrannými operacemi a organizací sil." # todo: NEW TRANSLATION
 senad_masovic: "Senad Mašović" # todo: NEW TRANSLATION
 senad_masovic_desc: "Profesionální důstojník zaměřený na výcvikové standardy a vojenskou integraci." # todo: NEW TRANSLATION
 BOS_operation_althea: "Operace Althea" # todo: NEW TRANSLATION
 BOS_operation_althea_desc: "Operace Althea je mise Evropské unie, která v roce 2004 nahradila SFOR. Podporuje Daytonské uspořádání a předává odpovědnost za bezpečnost bosenským institucím." # todo: NEW TRANSLATION
 BOS_draft_EUFOR: "Vytvořit EUFOR" # todo: NEW TRANSLATION
 BOS_draft_EUFOR_desc: "Nahradit končící mandát SFOR vedeného NATO mírovou misí vedenou EU." # todo: NEW TRANSLATION
 BOS_demand_eufor_withdrawal: "Požadovat stažení EUFOR" # todo: NEW TRANSLATION
 BOS_demand_eufor_withdrawal_desc: "Omezit mezinárodní vojenskou přítomnost a vyzkoušet, zda Bosna dokáže zajistit nezávislou vnitřní bezpečnost." # todo: NEW TRANSLATION
 BOS_EUFOR: "EUFOR" # todo: NEW TRANSLATION
 BOS_EUFOR_desc: "Síly Evropské unie v Bosně a Hercegovině jsou mírovou misí vedenou EU, která v Bosně a Hercegovině nahradila SFOR. Jejím cílem je udržovat mír a stabilitu, podporovat místní úřady a provádět Daytonské dohody, které ukončily bosenskou válku." # todo: CHANGED
 BOS_SFOR: "SFOR" # todo: NEW TRANSLATION
 BOS_SFOR_desc: "Stabilizační síly v Bosně a Hercegovině jsou mnohonárodní mírové síly vedené NATO.\n§W---------------§!\n Po bosenské válce financovali mezinárodní partneři včetně Světové banky, Evropské unie, Rozvojového programu OSN a USAID obnovu Bosny. Jejich programy obnovily infrastrukturu, posílily správu a veřejné služby a podpořily hospodářské oživení." # todo: CHANGED
 BOS_SFOR_title: "Stabilizační síly v Bosně a Hercegovině" # todo: NEW TRANSLATION
 BOS_SFOR_title_desc: "Stabilizační síly vedené NATO prosazují vojenská ustanovení Daytonské dohody a podporují poválečnou bezpečnost Bosny. Jejich mandát lze během krize prodloužit nebo zkrátit, jakmile se národní instituce zotaví." # todo: NEW TRANSLATION
 BOS_peacekeeper_oversight: "Dohled mírových sil" # todo: NEW TRANSLATION
 BOS_peacekeeper_oversight_desc: "Evropské mise zůstávají v Bosně, zatímco reformy zaostávají za potřebami domácí bezpečnosti." # todo: NEW TRANSLATION
 BOS_civil_war_operations: "Operace občanské války" # todo: NEW TRANSLATION
 BOS_civil_war_operations_desc: "Koordinovat nouzové válečné kroky napříč oblastmi konfliktu, zatímco Bosna zůstává v občanské válce." # todo: NEW TRANSLATION
 BOS_rotating_presidency: "Rotující předsednictvo" # todo: NEW TRANSLATION
 BOS_rotating_presidency_desc: "Bosenskému předsednictvu předsedají postupně bosňáčtí, chorvatští a srbští představitelé. Toto uspořádání omezuje nadvládu jedné konstitutivní skupiny, ale časté předávání pravomocí může narušovat přijímání zákonů.\n\nSrbský postoj: [ROOT.BOS_srpska_attitude]\nBosňácký postoj: [ROOT.BOS_bosniak_attitude]\nChorvatský postoj: [ROOT.BOS_croat_attitude]" # todo: NEW TRANSLATION
 BOS_more_sfor: "Požádat o prodloužení mandátu SFOR" # todo: NEW TRANSLATION
 BOS_more_sfor_desc: "Požádat NATO o prodloužení mandátu SFOR, dokud Bosna zůstává politicky nebo ekonomicky nestabilní." # todo: NEW TRANSLATION
 BOS_lower_sfor: "Požádat o zkrácení mandátu SFOR" # todo: NEW TRANSLATION
 BOS_lower_sfor_desc: "Zkrátit mandát SFOR, zatímco se bosenské instituce připravují převzít plnou odpovědnost za bezpečnost." # todo: NEW TRANSLATION
 BOS_attack_upon_nato: "Útok na NATO" # todo: NEW TRANSLATION
 BOS_attack_upon_nato_desc: "Bosenské síly jsou proti členům NATO v mimořádně nevýhodném operačním postavení." # todo: NEW TRANSLATION
 BOS_sfor_vol_troops: "Dobrovolnický závazek SFOR" # todo: NEW TRANSLATION
 BOS_sfor_vol_troops_desc: "Účastníci mírové mise mohou rychle nasadit dobrovolníky, pokud se Bosna vrátí k občanské válce." # todo: NEW TRANSLATION
 BOS_SER_vol_troops: "Srbský dobrovolnický závazek" # todo: NEW TRANSLATION
 BOS_SER_vol_troops_desc: "Srbsko může rychle nasadit dobrovolníky na podporu Republiky srbské v obnoveném bosenském konfliktu." # todo: NEW TRANSLATION
 BOS_politicized_army_idea: "Politizovaná armáda" # todo: NEW TRANSLATION
 BOS_politicized_army_idea_desc: "Paralelní loajality, politická jmenování a oddělené válečné tradice brání národnímu velení. Postupné reformy mohou z těchto sil vytvořit profesionální instituci." # todo: CHANGED
 BOS_idea_muslim_nationalism: "Mobilizovaný muslimský nacionalismus" # todo: NEW TRANSLATION
 BOS_idea_muslim_nationalism_desc: "Náboženský nacionalismus podporuje mobilizaci a zahraniční zásahy a zároveň činí režim odolnějším vůči politickým změnám." # todo: NEW TRANSLATION
 BOS_idea_srpska_supremacy: "Nadvláda Republiky srbské" # todo: NEW TRANSLATION
 BOS_idea_srpska_supremacy_desc: "Instituce Republiky srbské ovládají stát a určují jeho zdrojovou politiku, ale sdílení moci fakticky skončilo." # todo: NEW TRANSLATION
 BOS_dominant_entity_idea: "Dominantní entita" # todo: NEW TRANSLATION
