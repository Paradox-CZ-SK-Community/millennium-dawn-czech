 BOS_srpska_secession_crisis_opens_tt: "Republika srbská zahajuje krizi odtržení. Pokud nebude vyřešena před vypršením lhůty, entita zahájí válku." # todo: NEW TRANSLATION
 BOS_croat_secession_crisis_opens_tt: "Herceg-Bosna zahajuje krizi odtržení. Zvyšte důvěru Chorvatů na Přátelskou, než vyprší lhůta, abyste udrželi jih v zemi." # todo: NEW TRANSLATION
 bos_srpska_reconciliation_full_tt: "Důvěra Srbů ve vládu je nastavena na Nepřátelskou, protože entita je plně navrácena pod ústřední autoritu." # todo: NEW TRANSLATION
 bos_srpska_negotiated_autonomy_tt: "Důvěra Srbů ve vládu je v rámci dohodnutých podmínek autonomie nastavena na Přátelskou." # todo: NEW TRANSLATION
 BOS_croat_deescalation_hint_tt: "Pomocí frakčních rozhodnutí zvyšte důvěru Chorvatů na Přátelskou a zažehnejte krizi před jejím vypršením." # todo: NEW TRANSLATION
 BOS_rotate_presidency_hint_tt: "Použijte rozhodnutí Rotace představitelů k předání předsednictví a obnovení trpělivosti čekající komunity." # todo: NEW TRANSLATION
 BOS_croat_neutrality_pact_honored_tt: "Pakt chorvatské neutrality platí. Herceg-Bosna zůstává mimo válku a neodtrhne se." # todo: NEW TRANSLATION
 BOS_political.82.t: "Republika srbská se připravuje na odtržení" # todo: NEW TRANSLATION
 BOS_political.82.d: "Shromáždění entity stanovilo datum odchodu ze státních institucí. Stále existuje krátké období, během něhož ji lze přimět k návratu, než bude nezávislost vyhlášena definitivně." # todo: NEW TRANSLATION
 BOS_political.82.a: "Najděte způsob, jak krizi zažehnat" # todo: NEW TRANSLATION
 BOS_political.83.t: "Hercegovina hrozí odtržením" # todo: NEW TRANSLATION
 BOS_political.83.d: "Chorvatští představitelé na jihu směřují k odtržení a poukazují na roky, kdy byli přehlasováváni. Náprava vztahů je nyní jediným způsobem, jak je udržet v zemi." # todo: NEW TRANSLATION
 BOS_political.83.a: "Obraťte se na chorvatskou komunitu" # todo: NEW TRANSLATION
 BOS_political.84.t: "Rotace předsednictví se zastavila" # todo: NEW TRANSLATION
 BOS_political.84.d: "Křeslo mělo změnit držitele, předání se však stále odkládá. Komunita čekající na svůj mandát začíná zpoždění vnímat jako záměrné." # todo: NEW TRANSLATION
 BOS_political.84.a: "Vezměte na vědomí jejich frustraci" # todo: NEW TRANSLATION
 BOS_offer_amnesty: "Nabídnout amnestii" # todo: NEW TRANSLATION
 BOS_offer_amnesty_desc: "Nabídnout amnestii bojovníkům, kteří složí zbraně. Posílí to postavení srbské komunity, na domácí frontě to však bude působit jako slabost." # todo: NEW TRANSLATION
 BOS_forced_requisition: "Nucené rekvizice" # todo: NEW TRANSLATION
 BOS_forced_requisition_desc: "Zabavit zásoby a materiál entitám, aby bylo možné financovat válečné úsilí. Naplní to pokladnu a posílí srbský odpor." # todo: NEW TRANSLATION
 BOS_sign_croat_neutrality_pact: "Podepsat pakt chorvatské neutrality" # todo: NEW TRANSLATION
 BOS_sign_croat_neutrality_pact_desc: "Zaručit chorvatskou autonomii výměnou za neutralitu. Pokud bude následovat islamistické převzetí moci, Hercegovina zůstane v zemi místo toho, aby se od ní odštěpila." # todo: NEW TRANSLATION
 BOS_canton_pressure_campaign: "Kampaň nátlaku na kantony" # todo: NEW TRANSLATION
 BOS_canton_pressure_campaign_desc: "Tlačit na bosňácké a chorvatské kantony, aby se podřídily centrálnímu programu. Stát se stabilizuje za cenu dobré vůle obou komunit." # todo: NEW TRANSLATION
 BOS_serbian_alignment_overtures: "Nabídky srbského spojenectví" # todo: NEW TRANSLATION
 BOS_serbian_alignment_overtures_desc: "Prohloubit politické a hospodářské vazby s Bělehradem. Srbský vliv v Bosně poroste, srbská komunita se k vládě přikloní a bosňácká trpělivost se vyčerpá." # todo: NEW TRANSLATION
 BOS_srpska_supremacy_measures: "Opatření srbské nadřazenosti" # todo: NEW TRANSLATION
 BOS_srpska_supremacy_measures_desc: "Prosazovat srbské nacionalistické a bezpečnostní priority ve vládní politice a institucích." # todo: NEW TRANSLATION
