 HOL_Stork_PWV_armor_manufacturer_desc: "Stork PWV (Panserwielvoertuigen) má dlouhou historii výroby vysoce kvalitních obrněných vozidel a obranných systémů, přispívající k ochraně a mobilitě holandského vojenského personálu na bojišti." # todo: NEW TRANSLATION
