 sp_dutch_super_bus_project: "Superbus" # todo: NEW TRANSLATION
 sp_dutch_super_bus_project_desc: "Experiment Superbus je špičkový nizozemský projekt navržený k transformaci veřejné dopravy prostřednictvím inovací a udržitelnosti. Cílem tohoto projektu je vyvinout elektrické, vysokorychlostní cestovní vozidlo schopné dosahovat rychlosti až 250 km/h. Sestaveno z lehkého uhlíkového vlákna, Superbus kombinuje luxusní cestování s efektivitou a umožňuje rychlou dopravu mezi klíčovými regiony." # todo: NEW TRANSLATION
