 HOL_Damen_naval_equipment_organisation: "Damen Shipyards Group" # todo: NEW TRANSLATION
 HOL_Damen_naval_equipment_organisation_desc: "Damen Shipyards Group je přední [HOL.GetAdjectiveCap] námořní výrobce, specializující se na stavbu fregat, korvet a podpůrných lodí. Damen je klíčovým hráčem v udržování a rozšiřování schopností [HOL.GetAdjectiveCap] námořnictva." # todo: NEW TRANSLATION
