 HOL_Naval_Group_naval_equipment_organisation: "Direction des Constructions Navales" # todo: NEW TRANSLATION
 HOL_Naval_Group_naval_equipment_organisation_desc: "Direction des Constructions Navales (DCNS) je významným partnerem [HOL.GetAdjectiveCap] námořního průmyslu a poskytuje špičkové válečné lodě a technologie ponorek Royal Netherlands Navy. S desetiletími zkušeností v námořním inženýrství posiluje [HOL.GetAdjectiveCap] flotilu." # todo: NEW TRANSLATION
 HOL_Naval_Group_naval_equipment_organisation_trait: "Námořní návrhář lodí" # todo: NEW TRANSLATION
 HOL_fokker_technologies_planes_manufacturer: "Fokker Technologies" # todo: NEW TRANSLATION
 HOL_fokker_technologies_planes_manufacturer_desc: "Fokker Technologies je proslulý [HOL.GetAdjectiveCap] výrobce letadel, s dědictvím výroby vojenských i civilních letounů. Proslulý inovacemi v letectví, Fokker nadále dodává špičkovou technologii pro [HOL.GetAdjectiveCap] letectvo." # todo: NEW TRANSLATION
 HOL_fokker_technologies_planes_manufacturer_trait: "Výrobce lehkých letadel" # todo: NEW TRANSLATION
 HOL_werkspoor_equipment_manufacturer: "Werkspoor Utrecht" # todo: NEW TRANSLATION
 HOL_werkspoor_equipment_manufacturer_desc: "Jednou byl pilířem [HOL.GetAdjectiveCap] průmyslové inovace, Werkspoor Utrecht stojí jako maják národní inženýrské dokonalosti. Werkspoor se specializuje na výrobu vysoce kvalitních vlaků, strojů a dalších těžkých zařízení, čímž zajišťuje, že Nizozemsko udržuje svou pověst pro špičkové průmyslové technologie." # todo: NEW TRANSLATION
