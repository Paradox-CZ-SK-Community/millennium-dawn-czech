 HOL_fortuyn_centre_balance: "Balanced Fortuynism" # todo: NEW TRANSLATION
 HOL_fortuyn_centre_balance_desc: "The political course is balanced between reformist pragmatism and populist energy. Stability, policy continuity, and civic engagement define this middle ground." # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_high: "Dominance of Pragmatic Fortuynism" # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_high_desc: "Technocracy and institutional reform dominate the agenda. Populist rhetoric has been subdued in favor of a composed, policy-driven approach." # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_medium: "Governance-Oriented Policy" # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_medium_desc: "The focus lies on structural reform, decentralization, and transparency. The LPF charts a stable course of rational leadership." # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_low: "Moderate Pragmatism" # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_low_desc: "Pragmatic Fortuynism holds a slight advantage, but calls for more confrontational, populist policies are gaining traction among the base." # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_edge: "Delicate Balance with Populism" # todo: NEW TRANSLATION
 HOL_pragmatisch_fortuynisme_edge_desc: "The party walks a fine line between policy restraint and populist appeal. Public pressure is rising for stronger rhetoric." # todo: NEW TRANSLATION
 HOL_radicaal_populisme_high: "Rise of Radical Populism" # todo: NEW TRANSLATION
 HOL_radicaal_populisme_high_desc: "The party has fully embraced an anti-establishment agenda. Confrontational rhetoric, cultural revivalism, and anti-elite sentiment define the LPF's new identity." # todo: NEW TRANSLATION
 HOL_radicaal_populisme_medium: "Populist Momentum" # todo: NEW TRANSLATION
 HOL_radicaal_populisme_medium_desc: "LPF proměňuje veřejnou nespokojenost v akci. Tradiční vládní struktury jsou zpochybňovány zevnitř." # todo: NEW TRANSLATION
 HOL_radicaal_populisme_low: "Populismus se objevuje" # todo: NEW TRANSLATION
 HOL_radicaal_populisme_low_desc: "Populistický vliv roste, ačkoliv strana si stále udržuje jistou institucionální opatrnost. Vnitřní debata se vyhrocuje." # todo: NEW TRANSLATION
 HOL_radicaal_populisme_edge: "Napětí s pragmatismem" # todo: NEW TRANSLATION
 HOL_radicaal_populisme_edge_desc: "Populistické prvky rostou, ale vedení LPF zůstává zdráhavé plně opustit pragmatické základy." # todo: NEW TRANSLATION
 HOL_pvda_modernize_party_policies: "Modernizovat politiku strany" # todo: NEW TRANSLATION
 HOL_pvda_modernize_party_policies_desc: "Přijímá politiky v oblastech environmentální ochrany, digitálních inovací a inkluze, které oslovují mladší voliče a městské progresisty." # todo: NEW TRANSLATION
 HOL_pvda_promote_urban_investments: "Podporovat městské investice" # todo: NEW TRANSLATION
 HOL_pvda_promote_urban_investments_desc: "Zaměřuje se na infrastrukturu, bydlení a zelené iniciativy ve městech, čímž posiluje popularitu strany ve městech." # todo: NEW TRANSLATION
 HOL_pvda_focus_climate_policy: "Zaměření na klimatickou politiku" # todo: NEW TRANSLATION
 HOL_pvda_focus_climate_policy_desc: "Prosazuje ambiciózní klimatické reformy, s prioritou obnovitelných zdrojů energie a investic do zeleného průmyslu." # todo: NEW TRANSLATION
 HOL_pvda_strengthen_union_influence: "Posílit vliv odborů" # todo: NEW TRANSLATION
 HOL_pvda_strengthen_union_influence_desc: "Posiluje odborové svazy a zvyšuje jejich vliv na pracovní politiky a rozhodování." # todo: NEW TRANSLATION
 HOL_pvda_promote_rural_investments: "Zaměřit se na venkovský rozvoj" # todo: NEW TRANSLATION
