 HOL_nato_not_active_key1: "For decades, the Netherlands has relied on foreign nations for military equipment and logistical support. This dependency has left our armed forces unable to function independently, creating a dangerous vulnerability in the face of modern threats." # todo: NEW TRANSLATION
 HOL_nato_active_key1: "While the Netherlands benefits from strong international partnerships, we remain heavily reliant on foreign allies for military equipment and supplies. This reliance limits our independence and poses a significant risk in the event of strained relationships." # todo: NEW TRANSLATION
 HOL_nato_not_active_key2: "The lack of self-sufficient military production has created a critical situation. Equipment shortages and operational deficiencies are threatening the readiness of our armed forces, leaving the Netherlands vulnerable to prolonged or large-scale conflict." # todo: NEW TRANSLATION
 HOL_nato_active_key2: "Our armed forces are critically dependent on external support for equipment and supplies. In times of crisis, this dependency weakens our ability to sustain prolonged operations or defend national interests effectively." # todo: NEW TRANSLATION
 HOL_nato_not_active_key3: "§RGoing to war with a dependent military will severely weaken our army capabilities§!" # todo: NEW TRANSLATION
