 HOL_KNDS_Group_armor_manufacturer: "KNDS Group" # todo: NEW TRANSLATION
 HOL_KNDS_Group_armor_manufacturer_desc: "KNDS Group, evropský obranný gigant vzniklý sloučením Nexter a Krauss-Maffei Wegmann, dodává Nizozemsku špičková obrněná řešení, včetně tanků a dalších vojenských vozidel." # todo: NEW TRANSLATION
 HOL_Rheinmetall_Netherlands_armor_manufacturer: "Rheinmetall Netherlands" # todo: NEW TRANSLATION
 HOL_Rheinmetall_Netherlands_armor_manufacturer_desc: "Jako součást Rheinmetall AG se Rheinmetall Netherlands zaměřuje na výrobu obrněných vozidel, nabízí pokročilé technologie a inovativní obranné systémy pro nizozemskou armádu." # todo: NEW TRANSLATION
