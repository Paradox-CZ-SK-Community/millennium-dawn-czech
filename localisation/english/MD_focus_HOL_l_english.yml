l_english:
 netherlands_focus: "Nizozemský strom zaměření" # todo: NEW TRANSLATION
 HOL_shell: "Koupit akcie Shellu" # todo: NEW TRANSLATION
 HOL_shell_desc: "Royal Dutch Shell, globální energetická společnost se sídlem v Nizozemsku, je významným hráčem v energetickém sektoru země. Díky rozmanitému portfoliu zahrnujícímu ropu, plyn, obnovitelnou energii a nízkouhlíkové technologie se Shell zavazuje podporovat energetickou transformaci a poskytovat udržitelná řešení odpovídající měnícím se potřebám společnosti." # todo: NEW TRANSLATION
 HOL_green_shell: "Shell zezelená" # todo: NEW TRANSLATION
 HOL_green_shell_desc: "Shell se zavazuje k udržitelnosti a obnovitelné energii a přechází k čistším zdrojům, jako jsou vítr, solární energie a vodík. Investicemi do zelených technologií, inovativních řešení a nízkouhlíkových iniciativ chce Shell vést energetickou transformaci, řešit klimatické výzvy a přispět k udržitelnější budoucnosti." # todo: NEW TRANSLATION
 HOL_blauwwind: "Blauwwind" # todo: NEW TRANSLATION
 HOL_blauwwind_desc: "Blauwwind je projekt offshore větrné energie v nizozemském Severním moři, který zahrnuje několik větrných farem vybudovaných konsorciem společností. Využitím větrné energie chce Blauwwind podpořit nizozemské cíle v oblasti obnovitelné energie, snížit emise uhlíku a podporovat ochranu životního prostředí." # todo: NEW TRANSLATION
 HOL_porthos_project: "Projekt Porthos" # todo: NEW TRANSLATION
 HOL_porthos_project_desc: "Projekt Porthos je iniciativa zachytávání a ukládání uhlíku (CCS), jejímž cílem je snížit emise skleníkových plynů z průmyslových zdrojů v oblasti Rotterdamu. Zachycováním emisí CO2 a jejich ukládáním do vyčerpaných offshore plynových polí přispívá Porthos k boji proti změně klimatu a dekarbonizaci průmyslu." # todo: NEW TRANSLATION
 HOL_energy_transition_campus: "Kampus energetické transformace Amsterdam" # todo: NEW TRANSLATION
 HOL_energy_transition_campus_desc: "Energy Transition Campus Amsterdam slouží jako centrum výzkumu, inovací a spolupráce v oblasti energetické transformace a udržitelnosti. Propojuje průmysl, akademickou sféru, vládu a občanskou společnost a urychluje přechod k nízkouhlíkovému a odolnému energetickému systému." # todo: NEW TRANSLATION
 HOL_hefa: "HEFA" # todo: NEW TRANSLATION
 HOL_hefa_desc: "Hydroprocessed Esters and Fatty Acids (HEFA) je technologie obnovitelného leteckého paliva zaměřená na snižování emisí uhlíku v letectví. Přeměnou udržitelných surovin, jako jsou rostlinné oleje a živočišné tuky, na biopaliva umožňuje aerolinkám snižovat uhlíkovou stopu a plnit emisní cíle." # todo: NEW TRANSLATION
 HOL_holland_hydrogen: "Holland Hydrogen 1" # todo: NEW TRANSLATION
 HOL_holland_hydrogen_desc: "Holland Hydrogen 1 se zaměřuje na rozvoj vodíkových technologií a infrastruktury v Nizozemsku jako součást energetické transformace. Podporou výroby, distribuce a využití vodíku chce projekt uvolnit jeho potenciál jako čistého a univerzálního nosiče energie." # todo: NEW TRANSLATION
 HOL_no_green_shell: "Specializace Shellu" # todo: NEW TRANSLATION
 HOL_no_green_shell_desc: "Shell zůstává oddán svým hlavním činnostem v průzkumu, těžbě a distribuci neobnovitelných zdrojů energie, jako jsou ropa a zemní plyn. Jeho aktivity zahrnují offshore vrty, rafinaci a petrochemickou výrobu. Navzdory rostoucímu zájmu o obnovitelné zdroje se Shell nadále soustředí na uspokojování globální poptávky konvenčními energetickými zdroji." # todo: NEW TRANSLATION
 HOL_shell_energy_rotterdam: "Energetický a chemický park Shell" # todo: NEW TRANSLATION
 HOL_shell_energy_rotterdam_desc: "Energetický a chemický park Shell Rotterdam v Europoortu je významným průmyslovým centrem energetické a petrochemické výroby v Nizozemsku. Díky pokročilým zařízením a integrované infrastruktuře podporuje rafinaci ropy, výrobu chemikálií i výrobu energie a přispívá k regionálnímu rozvoji, zaměstnanosti a inovacím." # todo: NEW TRANSLATION
 HOL_europoort_modernization: "Modernizace Europoortu" # todo: NEW TRANSLATION
 HOL_europoort_modernization_desc: "Europoort, jeden z největších petrochemických komplexů v Evropě, prochází nepřetržitou modernizací s cílem zvýšit efektivitu, udržitelnost a konkurenceschopnost. Investice do technologií, infrastruktury a optimalizace procesů mají udržet jeho postavení předního centra energetiky a průmyslu." # todo: NEW TRANSLATION
 HOL_shell_moerdijk: "Rozšíření chemického parku Shell Moerdijk" # todo: NEW TRANSLATION
 HOL_shell_moerdijk_desc: "Chemický park Shell v Moerdijku je strategickým centrem chemické výroby a inovací v Nizozemsku. Díky moderním zařízením a důrazu na udržitelnost vyrábí širokou škálu petrochemických produktů, včetně plastů, rozpouštědel a speciálních chemikálií." # todo: NEW TRANSLATION
 HOL_borsele_choice: "Volba elektrárny Borssele" # todo: NEW TRANSLATION
 HOL_borsele_choice_desc: "Budoucnost jaderného reaktoru Borssele stojí na rozcestí. S rostoucí poptávkou po udržitelných a spolehlivých zdrojích energie je třeba rozhodnout, zda rozšířit kapacitu reaktoru, nebo jej přestavět na moderní čistou uhelnou elektrárnu. Každá možnost přináší jiné výhody a rizika." # todo: NEW TRANSLATION
 HOL_Borsele_Choice_tt1: "Máme možnost vybrat si mezi:" # todo: NEW TRANSLATION
 HOL_Borsele_Choice_tt2: "Nebo" # todo: NEW TRANSLATION
 HOL_syngas_production: "Výroba syntézního plynu" # todo: NEW TRANSLATION
 HOL_syngas_production_desc: "Výroba syntézního plynu spočívá v přeměně různých surovin, například zemního plynu, uhlí nebo biomasy, na syntézní plyn využívaný v chemické výrobě a energetice. Zařízení společností, jako je Shell, dodávají suroviny pro petrochemii, hnojiva a paliva." # todo: NEW TRANSLATION
 HOL_solar_moerdijk: "Solární Moerdijk" # todo: NEW TRANSLATION
 HOL_solar_moerdijk_desc: "Solar Moerdijk je projekt solární energie v průmyslové oblasti Moerdijk v Nizozemsku. Instalací fotovoltaických panelů na průmyslové střechy a nevyužitou půdu chce vyrábět obnovitelnou elektřinu, snižovat emise a posilovat energetickou odolnost." # todo: NEW TRANSLATION
 HOL_nam: "Založit Nederlandse Aardolie Maatschappij" # todo: NEW TRANSLATION
 HOL_nam_desc: "Nederlandse Aardolie Maatschappij (NAM) je nizozemská ropná a plynárenská společnost odpovědná za průzkum, těžbu a rozvoj uhlovodíkových zdrojů v Nizozemsku. Její činnost na pevnině i na moři hraje klíčovou roli při zajišťování energetických potřeb země." # todo: NEW TRANSLATION
 HOL_nam_groningen: "NAM Groningen" # todo: NEW TRANSLATION
 HOL_nam_groningen_desc: "Groningen na severu Nizozemska je domovem jednoho z největších evropských nalezišť zemního plynu. Historicky zásoboval nizozemské domácnosti a průmysl, avšak obavy z indukované seismicity a dopadů na životní prostředí vedly k postupnému omezení těžby." # todo: NEW TRANSLATION
 HOL_nam_waddenzee: "NAM Waddenzee" # todo: NEW TRANSLATION
 HOL_nam_waddenzee_desc: "Waddenzee, památka UNESCO, nabízí potenciál pro průzkum ropy a plynu na severu Nizozemska. Iniciativa se snaží vyvážit ochranu životního prostředí s rozvojem zdrojů a odpovědně využít energetické rezervy při zachování ekologické integrity této jedinečné mořské oblasti." # todo: NEW TRANSLATION
 HOL_nam_drenthe_oil: "NAM Drenthe" # todo: NEW TRANSLATION
 HOL_nam_drenthe_oil_desc: "Drenthská ropa označuje těžbu a využívání ropných zdrojů v provincii Drenthe, známé svými ložisky na pevnině. Jako součást nizozemské uhlovodíkové výroby pomáhá uspokojovat domácí poptávku a podporuje místní ekonomiku, zároveň však vyvolává debaty o udržitelnosti." # todo: NEW TRANSLATION
 HOL_nam_rotterdam: "NAM Rotterdam" # todo: NEW TRANSLATION
 HOL_nam_rotterdam_desc: "Rotterdam, největší evropský přístav a průmyslové centrum, hraje zásadní roli v nizozemské energetice. Je významným dopravním a logistickým uzlem pro dovoz ropy, vývoz rafinovaných produktů a petrochemickou výrobu. Díky své poloze a infrastruktuře je klíčovým hráčem globální energetické transformace." # todo: NEW TRANSLATION
 HOL_nam_pernis_refineries: "Rafinérie Pernis" # todo: NEW TRANSLATION
 HOL_nam_pernis_refineries_desc: "Rafinérie Pernis provozované Royal Dutch Shell tvoří jeden z největších rafinérských komplexů v Evropě poblíž Rotterdamu. Díky pokročilým zařízením a integrovaným petrochemickým závodům zpracovávají ropu na paliva, maziva a chemické suroviny." # todo: NEW TRANSLATION
 HOL_regio: "Regionální ekonomika" # todo: NEW TRANSLATION
 HOL_regio_desc: "Zatímco Randstad prosperuje, je zásadní zajistit prosperitu i zbytku Nizozemska. Investice do rozmanitějších regionů vyrovnají hospodářský růst a zlepší kvalitu života v celé zemi." # todo: NEW TRANSLATION
 HOL_dutch_agriculture: "Investice do nizozemského zemědělství" # todo: NEW TRANSLATION
 HOL_dutch_agriculture_desc: "Nizozemsko patří mezi nejefektivnější zemědělské země a je druhým největším vývozcem zemědělských produktů na světě. Musíme investovat do našeho odvětví, abychom zůstali světovou špičkou." # todo: NEW TRANSLATION
 HOL_plantlab: "Založení PlantLab" # todo: NEW TRANSLATION
 HOL_plantlab_desc: "PlantLab je nizozemská zemědělská technologická společnost specializující se na vertikální zemědělství. Využívá hydroponii, LED osvětlení a další pokročilé metody indoor pěstování, které umožňují celoroční produkci kvalitních plodin v kontrolovaném prostředí." # todo: NEW TRANSLATION
 HOL_kringlooplandbouw: "Kringlooplandbouw" # todo: NEW TRANSLATION
 HOL_kringlooplandbouw_desc: "Kruhové zemědělství je forma udržitelného zemědělství, v němž je uzavřen koloběh látek. Všechny látky odčerpané zemědělstvím z určité oblasti se do ní vracejí. Zdroje se využívají co nejefektivněji a zemědělci se snaží vyvažovat jejich odtok a přítok. Výzkum Wageningenské univerzity ukazuje, že tento přístup snižuje koncentraci dusičnanů v podzemní vodě." # todo: NEW TRANSLATION
 HOL_smart_dairy_farming: "Chytré mléčné zemědělství" # todo: NEW TRANSLATION
 HOL_smart_dairy_farming_desc: "Chytré mléčné zemědělství využívá digitální technologie a datová řešení k optimalizaci výroby a řízení farem. Senzory, automatizace a prediktivní analýzy zlepšují dobré životní podmínky zvířat, produktivitu i udržitelnost." # todo: NEW TRANSLATION
 HOL_zero_dairy_farming: "Projekt bezemisního mléčného zemědělství" # todo: NEW TRANSLATION
 HOL_zero_dairy_farming_desc: "Projekt bezemisního mléčného zemědělství usiluje o snížení emisí skleníkových plynů a dopadů na životní prostředí prostřednictvím inovativních technologií a udržitelných postupů. Obnovitelná energie, zachytávání metanu a ukládání uhlíku mají vést ke klimaticky neutrálnímu zemědělství." # todo: NEW TRANSLATION
 HOL_digital_agriculture: "Program digitálního zemědělství" # todo: NEW TRANSLATION
 HOL_digital_agriculture_desc: "Zemědělství se vyvíjí a je čas přivést je do digitálního věku. Program digitálního zemědělství vybaví zemědělce moderními technologiemi, jako je precizní zemědělství, analýza dat a chytré zavlažování. Cílem je zvýšit efektivitu, omezit plýtvání a podporovat udržitelné postupy." # todo: NEW TRANSLATION
 HOL_food_valley: "Holland Food Valley" # todo: NEW TRANSLATION
 HOL_food_valley_desc: "Holland Food Valley je přední klastr inovací v zemědělství a potravinářství v Nizozemsku. Propojuje podniky, výzkumné instituce a vládu s cílem podporovat inovace a spolupráci v potravinářství, urychlovat vývoj nových produktů a posilovat globální postavení Nizozemska." # todo: NEW TRANSLATION
 HOL_floating_farm_project: "Projekt plovoucí farmy" # todo: NEW TRANSLATION
 HOL_floating_farm_project_desc: "Plovoucí farma otevřená roku 2019 v rotterdamském Merwehavenu je první plovoucí mléčnou farmou na světě. Její dobytek dostává krmivo z městských odpadních toků, například pivovarského obilí, slupek brambor a trávy z parků a golfových hřišť. Platforma slouží jako testovací základna pro klimaticky přizpůsobenou produkci potravin." # todo: NEW TRANSLATION
 HOL_stedelijke_reststromen: "Městské zbytkové toky" # todo: NEW TRANSLATION
 HOL_stedelijke_reststromen_desc: "Obce posílají posekanou trávu z ulic a tříděný potravinový odpad z domácností na okolní farmy. Tam je fermentory přeměňují na bioplyn a zbývající digestát se vrací na pole jako kompost. Tím se uzavírá koloběh živin a energie mezi městem a venkovem." # todo: NEW TRANSLATION
 HOL_boeren_en_gemeenschap: "Zemědělci a komunita" # todo: NEW TRANSLATION
 HOL_boeren_en_gemeenschap_desc: "Na oplátku za zdroje proudící z měst podporují zemědělci místní sportovní kluby a vesnická sdružení. Tím se prohlubuje propojení venkovské ekonomiky s obecním životem a posiluje podpora zemědělského sektoru." # todo: NEW TRANSLATION
 HOL_enpower_gedeputeerde_staten: "Posílit Gedeputeerde Staten" # todo: NEW TRANSLATION
 HOL_enpower_gedeputeerde_staten_desc: "Zvýšení autonomie a zdrojů regionálních vlád (Gedeputeerde Staten) umožní vytvářet cílenější a účinnější místní politiky." # todo: NEW TRANSLATION
 HOL_lelystad_airport: "Založení letiště Lelystad" # todo: NEW TRANSLATION
 HOL_lelystad_airport_desc: "Rozšíření letiště Lelystad má odlehčit letišti Schiphol zvýšením kapacity a zlepšením zázemí. Projekt zahrnuje prodloužení ranvejí, modernizaci terminálů a zkvalitnění služeb pro cestující. Očekává se podpora regionálního spojení, turismu a hospodářského růstu ve Flevolandu a okolí." # todo: NEW TRANSLATION
 HOL_provincial_railways: "Investice do provinčních železnic" # todo: NEW TRANSLATION
 HOL_provincial_railways_desc: "Projekt provinčních železnic zahrnuje iniciativy jako Lelylijn, Wunderline a Three-Country Train, které zlepší regionální a přeshraniční spojení. Lelylijn navrhuje vysokorychlostní železnici mezi severními provinciemi a Randstadem. Wunderline zlepší spojení mezi Groningenem a německými Brémami, zatímco Three-Country Train propojí Nizozemsko, §Y[BEL.GetNameWithFlag]§! a Německo." # todo: NEW TRANSLATION
 HOL_eindhoven_brainport: "Eindhoven Brainport" # todo: NEW TRANSLATION
 HOL_eindhoven_brainport_desc: "Projekt Eindhoven Brainport promění Eindhoven v přední technologické a inovační centrum. Podporou špičkového průmyslu, výzkumných institucí a startupů chce iniciativa urychlit technologický rozvoj a hospodářský růst regionu." # todo: NEW TRANSLATION
 HOL_balanced_national_development: "Vyvážený národní rozvoj" # todo: NEW TRANSLATION
 HOL_balanced_national_development_desc: "Nyní, když regiony prosperují, chceme zajistit vyvážený národní rozvoj. Koordinace mezi Randstadem a ostatními regiony přinese udržitelný a spravedlivý růst v celé zemi. To zahrnuje politiky a investice propojující hospodářské aktivity s rozvojem infrastruktury." # todo: NEW TRANSLATION
 HOL_diversify_groningen_economy: "Diverzifikovat ekonomiku Groningenu" # todo: NEW TRANSLATION
 HOL_diversify_groningen_economy_desc: "Po ukončení těžby zemního plynu v Groningenu kvůli seismickým rizikům se úsilí zaměřuje na diverzifikaci regionální ekonomiky. To zahrnuje investice do obnovitelné energie, technologických odvětví a udržitelného zemědělství." # todo: NEW TRANSLATION
 HOL_landbouwregio: "Zemědělský region 21. století" # todo: NEW TRANSLATION
 HOL_landbouwregio_desc: "Proměna zemědělských regionů ve struktury 21. století vyžaduje přijetí pokročilých technologií a udržitelných postupů. Iniciativa se zaměřuje na modernizaci zemědělských metod, zlepšení logistiky dodavatelských řetězců a podporu ekologicky šetrných praktik." # todo: NEW TRANSLATION
 HOL_health_houses: "Zdravotní domy" # todo: NEW TRANSLATION
 HOL_health_houses_desc: "Iniciativa Zdravotní domy má vytvořit integrovaná zdravotnická centra v celém regionu, poskytující komplexní péči a podporující veřejné zdraví. Centra nabídnou primární péči, specializovanou léčbu i wellness programy pod jednou střechou." # todo: NEW TRANSLATION
 HOL_dutch_economic_landscape: "Třípilířová ekonomika" # todo: NEW TRANSLATION
 HOL_dutch_economic_landscape_desc: "Nizozemská ekonomika stojí na třech pilířích: mezinárodním obchodu, vyspělém zemědělství a globálně propojeném sektoru služeb. Díky světovým přístavům, inovativnímu zemědělství a silnému postavení ve financích a logistice má Nizozemsko mnohem větší ekonomickou váhu, než by odpovídalo jeho velikosti." # todo: NEW TRANSLATION
 HOL_randstad: "Randstad" # todo: NEW TRANSLATION
 HOL_randstad_desc: "Randstad, tvořený velkými městy jako Amsterdam, Rotterdam, Haag a Utrecht, je hospodářskou velmocí Nizozemska. Investicemi do infrastruktury a rozvoje podnikání chceme dále posílit jeho roli ekonomického motoru země." # todo: NEW TRANSLATION
 HOL_zuidas_development: "Rozvoj Zuidas" # todo: NEW TRANSLATION
 HOL_zuidas_development_desc: "Čtvrť Zuidas v Amsterdamu je významným finančním centrem. Rozšíření její kapacity a zlepšení infrastruktury přiláká více mezinárodních podniků a upevní její status globálního finančního centra." # todo: NEW TRANSLATION
 HOL_randstad_rail: "Randstad Rail" # todo: NEW TRANSLATION
 HOL_randstad_rail_desc: "Projekt RandstadRail spojuje Haag, Rotterdam a Zoetermeer efektivní sítí lehké železnice. Rozšíření této sítě zlepší regionální propojení." # todo: NEW TRANSLATION
 HOL_smart_city_initiative: "Iniciativa chytrých měst" # todo: NEW TRANSLATION
 HOL_smart_city_initiative_desc: "Investice do technologií chytrých měst v celém Randstadu učiní naše města efektivnějšími, udržitelnějšími a atraktivnějšími pro podniky i obyvatele." # todo: NEW TRANSLATION
 HOL_international_peace_city: "Mezinárodní město míru a spravedlnosti" # todo: NEW TRANSLATION
 HOL_international_peace_city_desc: "Využitím statusu Haagu jako Mezinárodního města míru a spravedlnosti posílíme diplomatické vazby a zvýšíme globální vliv pořádáním mezinárodních organizací a událostí." # todo: NEW TRANSLATION
 HOL_randpowerhouse: "Randpowerhouse" # todo: NEW TRANSLATION
 HOL_randpowerhouse_desc: "Díky dlouholetým strategickým investicím a vizionářskému plánování se region Randstad úspěšně proměnil v „Randpowerhouse“, dynamické hospodářské centrum Nizozemska. Rozvojem infrastruktury, podporou inovací a zlepšováním propojení Amsterdamu, Rotterdamu, Haagu a Utrechtu se region stal světovým lídrem v obchodu, kultuře a technologiích. Tato transformace nejen posílila hospodářský výkon Randstadu, ale také upevnila postavení Nizozemska jako významného hráče na evropské scéně, podporuje celostátní růst a stanovuje nové standardy městského rozvoje." # todo: NEW TRANSLATION
 HOL_dutch_industry: "Nizozemský průmysl" # todo: NEW TRANSLATION
 HOL_dutch_industry_desc: "Nizozemský průmysl ztělesňuje dědictví inovací a vynikajících výsledků Nizozemska v různých odvětvích. Díky zaměření na udržitelnost, technologie a globální konkurenceschopnost zůstává nizozemský průmysl v čele hospodářského růstu a prosperity." # todo: NEW TRANSLATION
 HOL_postbank_fusion: "Sloučení Postbank a ING" # todo: NEW TRANSLATION
 HOL_postbank_fusion_desc: "Sloučení Postbank a ING představuje významný milník v dějinách nizozemského bankovnictví, neboť sjednocuje dvě významné finanční instituce do jediného subjektu. Tato fúze posiluje postavení ING jako přední globální banky a nabízí zákazníkům po celém světě lepší služby a finanční řešení." # todo: NEW TRANSLATION
 HOL_randstad_takeovers: "Akvizice společnosti Randstad" # todo: NEW TRANSLATION
 HOL_randstad_takeovers_desc: "Akvizice společnosti Randstad demonstrují strategickou expanzi nizozemských firem a jejich globální ambice v oblasti personálních služeb a náboru. Akvizicí klíčových hráčů na trhu Randstad upevňuje své postavení světového lídra v oblasti řešení lidských zdrojů." # todo: NEW TRANSLATION
 HOL_ing_group_strategy: "Strategie expanze skupiny ING" # todo: NEW TRANSLATION
 HOL_ing_group_strategy_desc: "Strategie skupiny ING vymezuje vizi banky pro udržitelný růst a digitální transformaci finančního sektoru. Přijetím inovací a řešení zaměřených na zákazníky ING znovu potvrzuje svůj závazek podporovat pozitivní změny a přinášet hodnotu zainteresovaným stranám." # todo: NEW TRANSLATION
 HOL_adyen_fintech_hub: "Adyen a fintechové centrum" # todo: NEW TRANSLATION
 HOL_adyen_fintech_hub_desc: "Adyen, amsterodamský zpracovatel plateb založený v roce 2006, se díky zpracovávání transakcí pro globální obchodníky od Netflixu po Spotify rozrostl v jednu z největších evropských fintechových firem. Jeho úspěch staví Nizozemsko do role evropského centra digitálních plateb a finančních technologií a přitahuje do Randstadu investice i vysoce hodnotná pracovní místa ve službách." # todo: NEW TRANSLATION
 HOL_pension_fund_reform: "Reforma penzijních fondů" # todo: NEW TRANSLATION
 HOL_pension_fund_reform_desc: "ABP a PFZW patří mezi největší penzijní fondy na světě, což dává nizozemskému kapitálu obrovský globální dosah prostřednictvím podílů v akciích, infrastruktuře a nemovitostech po celém světě. Zákon o budoucnosti penzí z roku 2023 (Wet toekomst pensioenen) mění systém z dávek definovaných na příspěvky definované, čímž mění způsob, jakým bude tento obrovský kapitál v nadcházejících desetiletích rozdělován a investován." # todo: NEW TRANSLATION
 HOL_booking_digital_services: "Ekonomika digitálních služeb" # todo: NEW TRANSLATION
 HOL_booking_digital_services_desc: "Booking.com, největší online cestovní agentura na světě, sídlí v Amsterdamu spolu s firmami jako Just Eat Takeaway a TomTom a vytváří tak platformový a digitálně-servisní sektor neobvyklé hloubky na zemi této velikosti. Tento klastr přitahuje do Randstadu mezinárodní talenty a přesuny firemních sídel a upevňuje postavení Nizozemska jako centra evropských technologických ústředí." # todo: NEW TRANSLATION
 HOL_spring_global_mail: "Expanze Spring Global Mail" # todo: NEW TRANSLATION
 HOL_spring_global_mail_desc: "Spring Global Mail představuje nizozemskou odbornost v oblasti mezinárodních poštovních a logistických řešení. Poskytováním efektivních a spolehlivých poštovních služeb po celém světě Spring Global Mail usnadňuje globální obchod a komunikaci a propojuje podniky i spotřebitele napříč hranicemi." # todo: NEW TRANSLATION
 HOL_tata_steel_development: "Rozvoj Tata Steel" # todo: NEW TRANSLATION
 HOL_tata_steel_development_desc: "Rozvoj Tata Steel představuje významnou investici do nizozemské výroby a zajišťuje pokračující růst a konkurenceschopnost ocelářského průmyslu. Tato iniciativa podtrhuje závazek Tata Steel k inovacím a udržitelnosti a posiluje její přítomnost na nizozemském trhu." # todo: NEW TRANSLATION
 HOL_project_beethoven: "Projekt Beethoven" # todo: NEW TRANSLATION
 HOL_project_beethoven_desc: "Projekt Beethoven se zaměřuje na posílení růstu technologického sektoru v Nizozemsku a představuje strategickou reakci na obavy vyjádřené představiteli průmyslu včetně ASML ohledně investičního prostředí v zemi. Tato ambiciózní iniciativa, podpořená významnou vládní investicí přesahující 2,5 miliardy eur, má za cíl vytvořit prostředí příznivé pro domácí expanzi technologických gigantů, jako je ASML, a upevnit postavení země jako globálního centra inovací." # todo: NEW TRANSLATION
 HOL_phillips_healthcare_expansion: "Expanze Philips Healthcare" # todo: NEW TRANSLATION
 HOL_phillips_healthcare_expansion_desc: "Expanze Philips Healthcare odráží vedoucí postavení Nizozemska v oblasti zdravotnických technologií a inovací. Rozšířením svého portfolia zdravotnických služeb Philips znovu potvrzuje svůj závazek zlepšovat výsledky léčby pacientů a posouvat zdravotnická řešení po celém světě." # todo: NEW TRANSLATION
 HOL_oranje_nassau-mines: "Znovu otevřít doly Oranje-Nassau" # todo: NEW TRANSLATION
 HOL_oranje_nassau-mines_desc: "Uhelné doly Oranje-Nassau v Heer lenu byly posledními nizozemskými uhelnými doly a byly uzavřeny v roce 1974 v rámci celostátní energetické transformace. Jejich znovuotevření obnoví domácí zdroje surovin pro výrobu oceli a hliníku a sníží závislost na dovozu za cenu vyšší uhlíkové zátěže." # todo: NEW TRANSLATION
 HOL_south_dakota: "Továrny DSM v Jižní Dakotě" # todo: NEW TRANSLATION
 HOL_south_dakota_desc: "Továrny DSM na výrobu bioetanolu v Jižní Dakotě představují nizozemské vedoucí postavení v oblasti udržitelných energetických řešení. Investicemi do výroby bioetanolu DSM přispívá ke snižování emisí uhlíku a podpoře obnovitelných zdrojů energie v globálním měřítku." # todo: NEW TRANSLATION
 HOL_dutch_legends: "Nizozemské legendy" # todo: NEW TRANSLATION
 HOL_dutch_legends_desc: "Nizozemsko si v průběhu dějin vybudovalo legendární dědictví, v němž se propojují příběhy o ovládání vody s příběhy námořního obchodu. Od legendárních činů nizozemských inženýrů, kteří získávali půdu z moře, až po odvážné výpravy nizozemských obchodníků plavících se po vzdálených vodách se tyto legendy prolínají s odolností, vynalézavostí a prosperitou." # todo: NEW TRANSLATION
 HOL_trade_infrastructure: "Modernizovat obchodní infrastrukturu" # todo: NEW TRANSLATION
 HOL_trade_infrastructure_desc: "Nizozemsko se může pochlubit dokonale vyladěnou obchodní infrastrukturou, která propojuje přístavy, kanály a silnice do bezproblémové obchodní sítě. Jak se však globální obchod vyvíjí a nároky rostou, tato infrastruktura potřebuje modernizaci, aby si zachovala konkurenceschopnost. Investice do špičkových technologií a modernizace dopravních tras zajistí, že Nizozemsko zůstane po desetiletí významným hráčem mezinárodního obchodu." # todo: NEW TRANSLATION
 HOL_maasvlakte2: "Vybudovat Maasvlakte 2" # todo: NEW TRANSLATION
 HOL_maasvlakte2_desc: "Nizozemsko uskutečňuje ambiciózní projekt Maasvlakte 2, při němž získává půdu z moře za účelem rozšíření přístavních zařízení a podpory hospodářského růstu. Projekt navazuje na historické nizozemské mistrovství v hospodaření s vodou a inženýrství." # todo: NEW TRANSLATION
 HOL_european_railway_development: "Rozvoj evropské železnice" # todo: NEW TRANSLATION
 HOL_european_railway_development_desc: "Nizozemsko navazuje na své dědictví inovativní dopravní infrastruktury a stojí v čele rozvoje evropské železnice. Prostřednictvím své vyspělé železniční sítě podporuje propojení, obchod a mobilitu napříč kontinentem." # todo: NEW TRANSLATION
 HOL_green_harbor_amsterdam: "Zelený amsterodamský přístav" # todo: NEW TRANSLATION
 HOL_green_harbor_amsterdam_desc: "Amsterdam proměňuje svůj přístav v udržitelné centrum, přijímá ekologicky šetrné postupy a iniciativy v oblasti obnovitelné energie a ukazuje nizozemský závazek k ochraně životního prostředí a námořním inovacím." # todo: NEW TRANSLATION
 HOL_nederland_maritiem_land: "Stichting Nederland Maritiem Land" # todo: NEW TRANSLATION
 HOL_nederland_maritiem_land_desc: "Založení Stichting Nederland Maritiem Land podtrhuje nizozemské námořní dědictví a vedoucí postavení průmyslu. Podporuje spolupráci a rozvoj v námořním sektoru, aby byla zajištěna jeho další prosperita a globální konkurenceschopnost." # todo: NEW TRANSLATION
 HOL_schiphol_expansion: "Rozšíření Schipholu" # todo: NEW TRANSLATION
 HOL_schiphol_expansion_desc: "Rozšíření Schipholu představuje zásadní okamžik nizozemského letectví a posouvá amsterodamské letiště do čela globální letecké dopravy. Zvýšení kapacity a zlepšení zkušeností cestujících podtrhuje nizozemský závazek k efektivitě a propojenosti letecké dopravy." # todo: NEW TRANSLATION
 HOL_digital_customs: "Digitální celní správa" # todo: NEW TRANSLATION
 HOL_digital_customs_desc: "Digitální celní správa revolucionalizuje nizozemské obchodní operace, zjednodušuje procesy a zvyšuje efektivitu prostřednictvím inovativních digitálních řešení. Tato iniciativa ztělesňuje přijetí technologického pokroku Nizozemskem s cílem posílit jeho pozici globálního obchodního centra." # todo: NEW TRANSLATION
 HOL_daf_investments: "Investovat do DAF" # todo: NEW TRANSLATION
 HOL_daf_investments_desc: "Investice do DAF představují závazek nizozemského automobilového průmyslu k inovacím a růstu. Strategickými investicemi a technologickým pokrokem DAF upevňuje své postavení předního výrobce užitkových vozidel a posouvá vpřed nizozemskou průmyslovou sílu." # todo: NEW TRANSLATION
 HOL_rijkswaterstaat: "Rijkswaterstaat" # todo: NEW TRANSLATION
 HOL_rijkswaterstaat_desc: "Rijkswaterstaat, nizozemská vládní agentura odpovědná za hospodaření s vodou a infrastrukturu, hraje klíčovou roli při utváření vodního prostředí země. Dohlíží na údržbu vodních cest, hrází a protipovodňových ochran, chrání Nizozemsko před hrozbou záplav a zajišťuje efektivní a udržitelné využívání vodních zdrojů." # todo: NEW TRANSLATION
 HOL_deltawerken_modernization: "Modernizace Deltawerken" # todo: NEW TRANSLATION
 HOL_deltawerken_modernization_desc: "Nizozemsko modernizuje své ikonické Deltawerken, posiluje pobřežní ochranu a přizpůsobuje ji stoupající hladině moří a měnícím se klimatickým podmínkám. Zajišťuje tak pokračující ochranu před povodněmi a bezpečnost nizozemského pobřeží pro budoucí generace." # todo: NEW TRANSLATION
 HOL_ruimte_voor_de_rivier: "Ruimte voor de Rivier" # todo: NEW TRANSLATION
 HOL_ruimte_voor_de_rivier_desc: "Nizozemsko uplatňuje proaktivní přístup k řízení povodňových rizik a uskutečňuje projekt Room for the River. Vytváří prostor podél břehů řek pro zachycení vodních přívalů a ochranu městských oblastí, čímž ukazuje nizozemskou vynalézavost v plánování měst zaměřeném na vodu." # todo: NEW TRANSLATION
 HOL_green_water_city_building: "Budování zelených vodních měst" # todo: NEW TRANSLATION
 HOL_green_water_city_building_desc: "Nizozemsko prosazuje vizi udržitelného městského rozvoje a stojí v čele iniciativ budování zelených vodních měst. Do městského plánování a infrastrukturních projektů začleňuje principy citlivého nakládání s vodou a přírodě blízká řešení, aby vytvářelo odolná a obyvatelná města v souladu s přírodním prostředím a ztělesňovalo nizozemský závazek k zelenému růstu a ochraně životního prostředí." # todo: NEW TRANSLATION
 HOL_adressing_it_system_legacy_issues: "Řešení problémů se zastaralými IT systémy" # todo: NEW TRANSLATION
 HOL_adressing_it_system_legacy_issues_desc: "Daňová správa v Nizozemsku se opírá o zastaralé a roztříštěné IT systémy, což snižuje její efektivitu a způsobuje veřejné skandály. Přednost by mělo dostat zmodernizování této kritické infrastruktury." # todo: NEW TRANSLATION
 HOL_dutch_water_sector: "Nizozemský vodohospodářský sektor" # todo: NEW TRANSLATION
 HOL_dutch_water_sector_desc: "Nizozemský vodohospodářský sektor prosperuje jako globální lídr v oblasti hospodaření s vodou a inovací. Využívá staletí zkušeností s protipovodňovou ochranou, obranou pobřeží a řízením vodních zdrojů k řešení naléhavých vodohospodářských problémů po celém světě a je příkladem nizozemské vynalézavosti a závazku k udržitelnému rozvoji." # todo: NEW TRANSLATION
 HOL_hollandse_kust_windfarm: "Vybudovat Hollandse Kust" # todo: NEW TRANSLATION
 HOL_hollandse_kust_windfarm_desc: "Nizozemsko posouvá svou agendu obnovitelné energie rozvojem oblasti větrných elektráren Hollandse Kust. Využívá sílu větru k podpoře udržitelného hospodářského růstu a snižování emisí uhlíku v souladu s nizozemským úsilím o boj proti změně klimatu a podporu řešení v oblasti zelené energie." # todo: NEW TRANSLATION
 HOL_aquatech_amsterdam: "Uspořádat Aquatech Amsterdam" # todo: NEW TRANSLATION
 HOL_aquatech_amsterdam_desc: "Aquatech Amsterdam je přední akcí v oblasti vodohospodářských technologií, která sdružuje průkopníky a odborníky z průmyslu, aby zkoumali inovace v hospodaření s vodou a udržitelnosti. Prostřednictvím výstav a navazování kontaktů podporuje spolupráci a pokrok směrem k bezpečnější vodní budoucnosti." # todo: NEW TRANSLATION
 HOL_dredging_industry: "Nizozemský bagrovací průmysl" # todo: NEW TRANSLATION
 HOL_dredging_industry_desc: "Boskalis, Van Oord a Royal IHC společně činí z Nizozemska nesporného světového lídra v bagrování a námořním inženýrství. Jejich globální zakázky na prohlubování přístavů, hloubení plavebních kanálů a rekultivaci půdy vyvážejí nizozemské know-how a vytvářejí značné příjmy ze zahraničí, čímž udržují tisíce kvalifikovaných pracovních míst doma." # todo: NEW TRANSLATION
 HOL_van_oord_offshore: "Instalace větrných elektráren na moři" # todo: NEW TRANSLATION
 HOL_van_oord_offshore_desc: "Specializovaná nizozemská instalační plavidla vztyčují turbíny severomořských větrných farem u pobřeží Hollandse Kust a Borssele a spojují domácí loďařské schopnosti s odborností v oblasti výstavby na moři. Stejná flotila, která buduje kapacity pro nizozemskou energetickou transformaci, slouží také rychle se rozvíjejícímu evropskému trhu s offshore větrnou energií a zajišťuje dlouhodobé příjmy ze smluv." # todo: NEW TRANSLATION
 HOL_global_land_reclamation: "Globální rekultivace půdy" # todo: NEW TRANSLATION
 HOL_global_land_reclamation_desc: "Nizozemští dodavatelé vyvážejí své mistrovství v rekultivaci půdy a pobřežní ochraně do celého světa a budují umělé ostrovy, rozšiřují přístavy a provádějí protipovodňová opatření od Blízkého východu po jihovýchodní Asii. Staletí zkušeností s odrážením moře se proměnila v prémiovou inženýrskou službu a firmy, které ji poskytují v zahraničí, představují jeden z nejvýraznějších nizozemských průmyslových exportů." # todo: NEW TRANSLATION
 HOL_space_efforts: "Oživování nizozemských kosmických snah" # todo: NEW TRANSLATION
 HOL_space_efforts_desc: "Nizozemsko bylo dlouho na čele vědeckých inovací, avšak náš kosmický program zůstává nedostatečně rozvinutý. Závazkem k obnoveným investicím do kosmických technologií se můžeme prosadit jako seriózní hráč ve světovém kosmickém závodu." # todo: NEW TRANSLATION
 HOL_form_nso: "Nizozemská kosmická organizace" # todo: NEW TRANSLATION
 HOL_form_nso_desc: "Národní kosmická agentura umožní Nizozemsku sjednotit výzkum, vývoj a průzkum vesmíru pod jednotnou strukturou. Založení NSO zajistí dlouhodobé investice do kosmických letů, satelitních technologií a budoucích meziplanetárních misí." # todo: NEW TRANSLATION
 HOL_nso_education_efforts: "Rozšíření výzkumu a znalostí NSO" # todo: NEW TRANSLATION
 HOL_nso_education_efforts_desc: "Vědecká excelence je základem každého úspěšného kosmického programu. Zvýšením vládního financování výzkumu souvisejícího s kosmou a rozšířením spolupráce s holandskými univerzitami prohloubíme naše poznatky o astrofyzice, pohonných systémech a planetární vědě." # todo: NEW TRANSLATION
 HOL_nso_economic_efforts: "Rozšíření satelitní infrastruktury" # todo: NEW TRANSLATION
 HOL_nso_economic_efforts_desc: "Nizozemsko musí využít rostoucí poptávku po satelitních technologiích. Investicemi do domácí výroby satelitů, startovacích kapacit a globálních satelitních komunikačních sítí se můžeme prosadit jako klíčový hráč v kosmickém hospodářství." # todo: NEW TRANSLATION
 HOL_corporation_space: "Mezinárodní kosmická spolupráce" # todo: NEW TRANSLATION
 HOL_corporation_space_desc: "Průzkum vesmíru není o samotě. Posílení vazeb s mezinárodními kosmickými agenturami, jako jsou NASA, ESA a čínská CNSA, nám umožní získat špičkové technologie, sdílený výzkum a potenciální společné mise na Mars a Měsíc." # todo: NEW TRANSLATION
 HOL_corporation_space_tt: "Každá země přijmeme naši nabídku nám dá:" # todo: NEW TRANSLATION
 HOL_mars_one: "Oživit iniciativu Mars One" # todo: NEW TRANSLATION
 HOL_mars_one_desc: "Sen o trvalém lidském osídlení Marsu býval považován za nemožný. Ačkoliv původní projekt Mars One selhal, se správnou státní podporou a vědeckým dozorem ho můžeme proměnit ve skutečnost. Nizozemsko má potenciál stát se skutečnou kosmickou velmocí." # todo: NEW TRANSLATION
 HOL_ijstad_mission: "Vybudovat IJStad" # todo: NEW TRANSLATION
 HOL_ijstad_mission_desc: "IJStad je plánované město na umělém ostrově v jezeře IJmeer, hned východně od Amsterdamu, koncipované jako moderní pokračování nizozemské tradice rekultivace půdy. Nový ostrov by poskytl přibližně 45 000 domovů, zmírnil bytovou krizi v Randstadu a ukázal, že Nizozemsko stále dokáže vytvářet novou půdu z otevřené vodní plochy. Výstavba by měla trvat přibližně tři roky a promění region West-Nederland kolem Amsterdamu; vedle nových obytných čtvrtí přidá průmyslové kapacity a kanceláře." # todo: NEW TRANSLATION
 HOL_mars_colony_mission: "Založit kolonii na Marsu" # todo: NEW TRANSLATION
 HOL_mars_colony_mission_desc: "Nyní, když jsou zajištěny startovací kapacity a z Nizozemska odchází stálý proud rekrutů a vybavení, vstupuje dlouhé úsilí o dopravu a udržení nizozemských osadníků na Marsu do závěrečné fáze. Po milionech kilometrů prázdného vesmíru je třeba sestavit habitaty, systémy podpory života a první trvalé stavby. Až bude kolonie připravena, její zakladatelé jí dají jméno inspirované legendami vlasti, kterou opustili." # todo: NEW TRANSLATION
 HOL_mars_colony1: "Hollanderhaven" # todo: NEW TRANSLATION
 HOL_mars_colony1_desc: "Kolonie získává své jméno od De Vliegende Hollander, Bludného Holanďana, prokletého obchodního kapitána odsouzeného navždy brázdit moře, aniž by kdy zakotvil. Hollanderhaven se příznačně stává obchodním srdcem kolonie, obchodní stanicí na novém světě vybudovanou potomky námořního národa. Její správci přenášejí starý instinkt VOC pro zisk na marťanskou hranici." # todo: NEW TRANSLATION
 HOL_mars_colony2: "Brinkerdam" # todo: NEW TRANSLATION
 HOL_mars_colony2_desc: "Brinkerdam ctí Hanse Brinkera, legendárního chlapce, který celou noc zadržoval moře tím, že prstem ucpával prosakující hráz. Osada se specializuje na tlakové stěny, utěsněné kopule a hydroinženýrství, které udržují kolonii obyvatelnou navzdory nepřátelskému prostředí Marsu. Stejná disciplína, která vybudovala Deltawerken, nyní drží vakuum v bezpečné vzdálenosti." # todo: NEW TRANSLATION
 HOL_mars_colony3: "Brandaanstad" # todo: NEW TRANSLATION
 HOL_mars_colony3_desc: "Brandaanstad, pojmenovaný po svatém Brandánovi, středověkém mořeplavci, jehož legendární cesta ho zavedla na okraj známého světa, je centrem vzdělávání a výzkumu kolonie. Jeho laboratoře čerpají z dědictví TU Delft a ESTEC a posouvají hranice planetární vědy. Město ztělesňuje zvědavost, která kdysi zavedla Nizozemce za obzor." # todo: NEW TRANSLATION
 HOL_mars_colony4: "Brammertdelf" # todo: NEW TRANSLATION
 HOL_mars_colony4_desc: "Brammertdelf připomíná Ellerta a Brammerta, dva obry a loupežníky, kteří kdysi strašili vřesovišti Drenthe. Osada tvoří základ těžebního průmyslu kolonie a dobývá rudy a těkavé látky z povrchu Marsu. Stejně jako její jmenovci žije z půdy, kterou si podmaňuje, a dodává suroviny potřebné pro celou kolonii." # todo: NEW TRANSLATION
 HOL_commissariaat_militaire_productie: "Commissariaat Militaire Productie" # todo: NEW TRANSLATION
 HOL_commissariaat_militaire_productie_desc: "Commissariaat Militaire Productie se zaměřuje na koordinaci a posilování kapacit vojenské výroby v celém Nizozemsku. Tato iniciativa má za cíl zjednodušit procesy pořizování, podpořit domácí obranný průmysl a zajistit stabilní dodávky pokročilého vojenského vybavení." # todo: NEW TRANSLATION
 HOL_dutch_defense_doctrine: "Nederlandse Defensie Doctrine" # todo: NEW TRANSLATION
 HOL_dutch_defense_doctrine_desc: "Nizozemská obranná doktrína tvoří základ strategického směřování a operačních zásad nizozemských ozbrojených sil. Tato doktrína klade důraz na pružnost, palebnou sílu a spolupráci a zajišťuje, že naše armáda bude připravena bránit národní zájmy, podporovat spojence a reagovat na globální krize." # todo: NEW TRANSLATION
 HOL_authority_in_information: "Autorita v oblasti informací" # todo: NEW TRANSLATION
 HOL_authority_in_information_desc: "Upevnění autoritativního postavení v oblasti informací je klíčem k udržení strategické výhody. To zahrnuje posílení zpravodajských, sledovacích a průzkumných schopností s cílem efektivně shromažďovat a zpracovávat kritické informace." # todo: NEW TRANSLATION
 HOL_integrated_actions: "Integrované operace" # todo: NEW TRANSLATION
 HOL_integrated_actions_desc: "Integrované operace na pozemních, námořních, vzdušných, kybernetických a vesmírných bojištích zajišťují komplexní obranné schopnosti. Toto zaměření podporuje bezproblémovou koordinaci a společné operace za účelem zvýšení celkové vojenské efektivity." # todo: NEW TRANSLATION
 HOL_information_based: "Založeno na informacích" # todo: NEW TRANSLATION
 HOL_information_based_desc: "Přístup založený na informacích zlepšuje rozhodování a operační účinnost. Investicemi do zpravodajských, sledovacích a průzkumných schopností Nizozemsko zajišťuje, že dokáže rychle a účinně reagovat na vznikající hrozby." # todo: NEW TRANSLATION
 HOL_increase_strategic_capacity: "Zvýšit strategickou kapacitu" # todo: NEW TRANSLATION
 HOL_increase_strategic_capacity_desc: "Posílení naší strategické kapacity je nezbytné pro zvládání budoucích výzev. To zahrnuje rozvoj schopností strategické přepravy, kybernetické obrany a vesmírných operací, aby Nizozemsko mohlo globálně uplatňovat svou moc a vliv." # todo: NEW TRANSLATION
 HOL_dutch_specialism: "Nizozemská specializace" # todo: NEW TRANSLATION
 HOL_dutch_specialism_desc: "Aby Nizozemsko posílilo svou roli v NATO, rozvine specializované schopnosti doplňující potřeby aliance. Patří mezi ně odborné znalosti v obojživelných operacích, protivzdušné obraně a silách rychlého nasazení." # todo: NEW TRANSLATION
 HOL_invest_in_europe: "Investovat do obrany v Evropě" # todo: NEW TRANSLATION
 HOL_invest_in_europe_desc: "Investice do evropských obranných schopností zajistí silnější a odolnější kontinent. Nizozemsko zvýší své příspěvky do evropských obranných iniciativ a posílí spolupráci a interoperabilitu s členskými státy EU." # todo: NEW TRANSLATION
 HOL_military_society: "Kampaň Vojenská společnost" # todo: NEW TRANSLATION
 HOL_military_society_desc: "Budování silného propojení mezi armádou a společností je zásadní. Toto zaměření zahrnuje iniciativy na zvýšení zapojení veřejnosti, podporu veteránů a rozvoj kultury obranného povědomí." # todo: NEW TRANSLATION
 HOL_reliable_partner: "Spolehlivý nizozemský partner" # todo: NEW TRANSLATION
 HOL_reliable_partner_desc: "Nizozemsko jako spolehlivý partner a ochránce zajistí bezpečnost svých spojenců a přispěje k mezinárodní stabilitě. To zahrnuje aktivní účast na misích NATO a EU a udržování připravenosti chránit národní i spojenecké zájmy." # todo: NEW TRANSLATION
 HOL_unique_people: "Jedinečný nizozemský personál" # todo: NEW TRANSLATION
 HOL_unique_people_desc: "Rozpoznání a rozvoj jedinečných dovedností našeho personálu je zásadní. Toto zaměření klade důraz na pokročilý výcvik, vzdělávání a kariérní rozvoj, aby ozbrojené síly měly vysoce kvalifikované a motivované příslušníky." # todo: NEW TRANSLATION
 HOL_flexible_operations: "Pružné operace" # todo: NEW TRANSLATION
 HOL_flexible_operations_desc: "Aby ozbrojené síly zůstaly pružné a škálovatelné, musí být schopny rychle reagovat na měnící se okolnosti. To zahrnuje rozvoj sil rychlé reakce a zvyšování mobility vojsk, aby se dokázala rychle přizpůsobit různým scénářům hrozeb." # todo: NEW TRANSLATION
 HOL_innovative_capacity: "Inovační kapacita" # todo: NEW TRANSLATION
 HOL_innovative_capacity_desc: "Investice do výzkumu a vývoje jsou nezbytné pro udržení silné inovační kapacity. To zahrnuje přijímání špičkových technologií a podporu kultury inovací, která udrží náskok před potenciálními protivníky." # todo: NEW TRANSLATION
 HOL_escalation_dominance: "Eskalace s převahou" # todo: NEW TRANSLATION
 HOL_escalation_dominance_desc: "Dosažení převahy v eskalaci vyžaduje vynikající vojenské schopnosti a pevná strategická partnerství. Tím se zajistí, že ozbrojené síly dokážou účinně odrazovat konflikty a reagovat na ně na jakékoli úrovni." # todo: NEW TRANSLATION
 HOL_Technologisch_Hoogwaardig: "Vysoce technologický" # todo: NEW TRANSLATION
 HOL_Technologisch_Hoogwaardig_desc: "Investice do vysoce kvalitních technologií jsou nezbytné pro udržení moderní a výkonné ozbrojené síly. Tato oblast zahrnuje zavádění špičkových systémů a podporu inovací, aby se Nizozemsko drželo na špici vojenské technologie." # todo: NEW TRANSLATION
 HOL_defensievisie_completed: "Defensievisie dokončena" # todo: NEW TRANSLATION
 HOL_defensievisie_completed_desc: "Po úspěšném dokončení nizozemské obranné doktríny prošly nizozemské ozbrojené síly pozoruhodnou proměnou. Modernizovaná, odolná armáda vybavená nejmodernějšími technologiemi je připravena čelit výzvám budoucnosti. Tento milník odráží oddanost a tvrdou práci našeho personálu, který přijal inovace, posílil mezinárodní partnerství a zvýšil operační připravenost." # todo: NEW TRANSLATION
 HOL_koninklijke_luchtmacht: "Parvus Numero, Magnus Merito" # todo: NEW TRANSLATION
 HOL_koninklijke_luchtmacht_desc: "Přijměme motto Parvus numero, magnus merito (Malí počtem, velcí zásluhami) a zaměřme se na maximalizaci efektivity a účinnosti nizozemského letectva. To zahrnuje optimalizaci výcvikových programů, zlepšování údržby a využívání pokročilých technologií, aby každé letadlo a každý letec významně přispívali k plnění mise." # todo: NEW TRANSLATION
 HOL_join_jsf: "Připojit se k programu JSF" # todo: NEW TRANSLATION
 HOL_join_jsf_desc: "Účast Nizozemska v programu Joint Strike Fighter (JSF) zahrnuje pořízení letounů F-35 Lightning II. Toto zaměření zajistí, že nizozemské letectvo bude vybaveno nejmodernějšími stíhačkami s technologií stealth, čímž posílí vzdušnou převahu a úderné schopnosti." # todo: NEW TRANSLATION
 HOL_Join_JSF_tt: "Když bude prozkoumána §Y5th Generation Light Aircraft§!, bude §G50§! §YF-35A§! přidáno do vašich zásob." # todo: NEW TRANSLATION
 HOL_Buy_F35C: "Připojit se k programu F-35C" # todo: NEW TRANSLATION
 HOL_Buy_F35C_desc: "Pořízení letounu F-35C Lightning II poskytne nizozemskému letectvu nosičově vhodnou variantu pokročilého stealth stíhače. Toto zaměření posiluje schopnost Nizozemska vysílat leteckou sílu z pevných základen i z letadlových lodí, což nabízí neporovnatelnou všestrannost a bojovou účinnost." # todo: NEW TRANSLATION
 HOL_join_eurofighter_project: "Připojit se k projektu Eurofighter" # todo: NEW TRANSLATION
 HOL_join_eurofighter_project_desc: "Připojením k projektu Eurofighter Typhoon Nizozemsko investuje do vysoce pokročilého víceúčelového bojového letounu. Toto zaměření posílí schopnosti nizozemského letectva v boji vzduch-vzduch, při útocích na pozemní cíle a průzkumných misích." # todo: NEW TRANSLATION
 HOL_buy_saab_jas39: "Zakoupit Saab JAS39" # todo: NEW TRANSLATION
 HOL_buy_saab_jas39_desc: "Pořízení stíhaček Saab JAS39 Gripen poskytne nizozemskému letectvu všestranný a cenově efektivní víceúčelový letoun. Toto zaměření posílí schopnosti protivzdušné obrany, podpory pozemních sil a průzkumu a zajistí operační flexibilitu." # todo: NEW TRANSLATION
 HOL_buy_mq9_reaper: "Zakoupit MQ-9 Reaper" # todo: NEW TRANSLATION
 HOL_buy_mq9_reaper_desc: "Investice do dronů MQ-9 Reaper posílí průzkumné a úderné schopnosti nizozemského letectva. Tato bezpilotní letadla (UAV) poskytují zpravodajské informace v reálném čase, sledování a možnosti přesných úderů, čímž výrazně zvyšují operační efektivitu." # todo: NEW TRANSLATION
 HOL_defensie_helikopter_commando: "Založit Defensie Helikopter Commando" # todo: NEW TRANSLATION
 HOL_defensie_helikopter_commando_desc: "Defensie Helikopter Commando (DHC) dohlíží na operace všech vojenských vrtulníků v rámci nizozemských ozbrojených sil. Toto zaměření má za cíl zlepšit schopnosti, výcvik a koordinaci vrtulníkového letectva a podpořit domácí i mezinárodní mise." # todo: NEW TRANSLATION
 HOL_ch47d_modernization: "Modernizace CH-47D" # todo: NEW TRANSLATION
 HOL_ch47d_modernization_desc: "Modernizace vrtulníků CH-47D Chinook zahrnuje modernizaci avioniky, motorů a nákladových systémů. Toto zaměření zajistí, že tyto vrtulníky s vysokou nosností zůstanou účinné a spolehlivé při přepravních, zdravotnických evakuačních a podpůrných misích." # todo: NEW TRANSLATION
 HOL_ah46d_upgrade: "Modernizace AH-64D" # todo: NEW TRANSLATION
 HOL_ah46d_upgrade_desc: "Modernizace útočných vrtulníků AH-64D Apache zahrnuje vylepšení avioniky, zbraňových systémů a odolnosti. Toto zaměření posílí bojové schopnosti nizozemského letectva a zajistí, že tyto vrtulníky budou moci účinně provádět blízkou leteckou podporu a protitankové mise." # todo: NEW TRANSLATION
 HOL_air_mobility_command: "Velitelství letecké mobility a zabezpečení" # todo: NEW TRANSLATION
 HOL_air_mobility_command_desc: "Zřídit národní velitelství pro řízení letecké mobility, logistiky a bojové připravenosti nezávisle na spojeneckých ujednáních. Centralizace zabezpečení pod nizozemskou kontrolou umožní letectvu generovat bojové lety a udržovat svou flotilu bez závislosti na podpoře partnerů." # todo: NEW TRANSLATION
 HOL_woensdrecht_mro: "Logistické centrum Woensdrecht a centrum motorů F135" # todo: NEW TRANSLATION
 HOL_woensdrecht_mro_desc: "Logistické centrum Woensdrecht hostí regionální zařízení údržby, oprav a generálních oprav motoru F135 pohánějícího letoun F-35. Investice do tohoto střediska promění Nizozemsko v centrum zabezpečení spojeneckých flotil, udrží jeho vlastní letouny připravené k nasazení a sníží závislost na zahraničním servisu." # todo: NEW TRANSLATION
 HOL_expand_fighter_fleet: "Rozšířit stíhací flotilu" # todo: NEW TRANSLATION
 HOL_expand_fighter_fleet_desc: "Objednat další sérii víceúčelových stíhaček a doplnit letky na plný stav. Rozšířená flotila obnoví nasaditelnou kapacitu a poskytne letectvu početní sílu potřebnou k dlouhodobému zajišťování ochrany domácího vzdušného prostoru i expedičních závazků." # todo: NEW TRANSLATION
 HOL_expand_fighter_fleet_idea: "Rozšířená stíhací flotila" # todo: NEW TRANSLATION
 HOL_expand_fighter_fleet_idea_desc: "Urychlené pořizování udržuje výrobní linky stíhaček v plném provozu, snižuje jednotkové náklady nových draků a zároveň umožňuje dodání celé série." # todo: NEW TRANSLATION
 HOL_frisian_flag_training: "Výcvikový program Frisian Flag" # todo: NEW TRANSLATION
 HOL_frisian_flag_training_desc: "Každoroční cvičení Frisian Flag pořádané na letecké základně Leeuwarden sdružuje spojenecká letectva k rozsáhlému bojovému výcviku nad Severním mořem. Stálý výcvikový program zdokonaluje schopnosti pilotů a urychluje získávání zkušeností nových leteckých posádek." # todo: NEW TRANSLATION
 HOL_precision_munitions: "Integrace přesně naváděné munice" # todo: NEW TRANSLATION
 HOL_precision_munitions_desc: "Integrovat do stíhací flotily naváděné zbraně, jako jsou GBU-39 Small Diameter Bomb, AIM-120 AMRAAM a střela Meteor. Moderní zbraňový komplet prodlužuje dosah a zvyšuje účinnost útoků a zajišťuje, že nizozemské letouny budou moci přesně zasahovat v napadeném vzdušném prostoru." # todo: NEW TRANSLATION
 HOL_sovereign_air_operations: "Samostatné letecké operace" # todo: NEW TRANSLATION
 HOL_sovereign_air_operations_desc: "Soustředit flotilu, zbraně a vycvičené letecké posádky do soběstačných vzdušných sil schopných dlouhodobě provádět operace podle vlastních podmínek. Nizozemsko nyní dokáže chránit svůj vzdušný prostor a uplatňovat leteckou sílu bez závislosti na jediném partnerovi." # todo: NEW TRANSLATION
 HOL_commando_landstrijdkrachten: "Založit Commando Landstrijdkrachten" # todo: NEW TRANSLATION
 HOL_commando_landstrijdkrachten_desc: "Založení Commando Landstrijdkrachten (CLAS) v roce 2005 znamenalo významnou reorganizaci nizozemské armády. Tato centrální velitelská struktura měla zvýšit operační efektivitu a zjednodušit rozhodovací procesy. Sloučením různých složek armády pod jedno velení Nizozemsko zajistilo lepší koordinaci a připravenost pozemních sil." # todo: NEW TRANSLATION
 HOL_jistarc: "Založení JISTARC" # todo: NEW TRANSLATION
 HOL_jistarc_desc: "Joint Intelligence, Surveillance, Target Acquisition and Reconnaissance Command (JISTARC) byl založen s cílem integrovat a posílit zpravodajské schopnosti nizozemské armády. Tato jednotka spojuje různé zpravodajské funkce, aby poskytovala komplexní situační přehled a podporu operacím. JISTARC zvyšuje účinnost průzkumných a sledovacích misí a zajišťuje přesné a včasné informace pro taktická rozhodnutí." # todo: NEW TRANSLATION
 HOL_dglc: "Reorganizace DGLC" # todo: NEW TRANSLATION
 HOL_dglc_desc: "Defensie Grondgebonden Luchtverdedigingscommando (DGLC) odpovídá za pozemní protivzdušnou obranu. Posílení schopností DGLC zahrnuje modernizaci raketových systémů a radarové techniky za účelem ochrany před vzdušnými hrozbami. Toto zaměření zajistí, že nizozemská armáda dokáže účinně bránit své prostředky a území před leteckými útoky." # todo: NEW TRANSLATION
 HOL_vuursteun_commando: "Nasazení VuursteunCommando" # todo: NEW TRANSLATION
 HOL_vuursteun_commando_desc: "VuursteunCommando (velitelství palebné podpory) integruje dělostřelecké a podpůrné prvky, aby nizozemské armádě poskytlo koordinovanou palebnou sílu. Toto zaměření zahrnuje modernizaci dělostřeleckých systémů a zlepšení přesnosti zaměřování. Lepší palebná podpora zvyšuje účinnost pozemních operací a zajišťuje přesnou a včasnou palbu." # todo: NEW TRANSLATION
 HOL_supply_command: "Bevoorradings- en Transportcommando" # todo: NEW TRANSLATION
 HOL_supply_command_desc: "Bevoorradings- en Transportcommando (velitelství zásobování a dopravy) je zásadní pro zajištění logistické podpory a mobility nizozemské armády. Toto zaměření má za cíl zlepšit zásobovací řetězce, dopravní prostředky a infrastrukturu a zvýšit tak operační připravenost a efektivitu armády." # todo: NEW TRANSLATION
 HOL_military_production_investments: "Investovat do nizozemského obranného průmyslu" # todo: NEW TRANSLATION
 HOL_military_production_investments_desc: "Nizozemský obranný sektor v posledních letech zaznamenal významné investice, od projektů, jako je vývoj F-35, až po modernizaci námořních plavidel, například fregat třídy Zeven Provinciën. Další investice do domácího obranného průmyslu mohou podpořit technologické inovace, zvýšit soběstačnost a zajistit, že naše ozbrojené síly zůstanou vybaveny nejmodernější vojenskou technikou. Toto rozhodnutí posílí národní bezpečnost a přispěje k růstu silné obranné ekonomiky." # todo: NEW TRANSLATION
 HOL_defense_industrial_base: "Posílit obrannou průmyslovou základnu" # todo: NEW TRANSLATION
 HOL_defense_industrial_base_desc: "Nizozemské firmy dodávají klíčové součásti do spojeneckých zbrojních programů, avšak domácí montážní kapacity zaostávají. Rozšířením výstavby zbrojních továren a ukotvením konečné výroby doma proměníme síť subdodavatelů ve skutečnou národní průmyslovou základnu." # todo: NEW TRANSLATION
 HOL_modernize_arms_production: "Modernizovat výrobní linky zbraní" # todo: NEW TRANSLATION
 HOL_modernize_arms_production_desc: "Zastaralé vybavení zpomaluje zavádění objednávek nové techniky. Investice do automatizace vedené společností Thales a moderních výrobních linek umožní našim vojenským továrnám rychleji dosáhnout plného výkonu a zkrátí dodací lhůty pro ozbrojené síly." # todo: NEW TRANSLATION
 HOL_lean_defense_manufacturing: "Štíhlá obranná výroba" # todo: NEW TRANSLATION
 HOL_lean_defense_manufacturing_desc: "Napjatý trh práce činí z kvalifikovaných pracovníků hlavní omezení výroby zbraní. Zavedení štíhlé výroby v DAF a u jeho dodavatelů sníží počet pracovníků potřebných v každé vojenské továrně a uvolní personál pro širší ekonomiku." # todo: NEW TRANSLATION
 HOL_defense_supply_chain_integration: "Integrovat obranné dodavatelské řetězce" # todo: NEW TRANSLATION
 HOL_defense_supply_chain_integration_desc: "Roztříštěné vztahy s dodavateli omezují efektivitu našich závodů. Integrace obranného dodavatelského řetězce kolem firem, jako je Fokker, stabilizuje vstupy a zvýší maximální efektivitu, kterou náš vojenský průmysl dokáže udržet." # todo: NEW TRANSLATION
 HOL_defense_export_promotion: "Podpořit vývoz obranné techniky" # todo: NEW TRANSLATION
 HOL_defense_export_promotion_desc: "Nizozemské obranné výrobky jsou v zahraničí konkurenceschopné, ale příjmy z vývozu nejsou dostatečně využívány. Koordinovaná exportní strategie podporovaná Werkspoor a jeho partnery rozšíří daňový základ vojenského průmyslu a financuje další investice." # todo: NEW TRANSLATION
 HOL_national_defense_industrial_strategy: "Národní obranná průmyslová strategie" # todo: NEW TRANSLATION
 HOL_national_defense_industrial_strategy_desc: "S moderní základnou, štíhlými závody, integrovanými dodavatelskými řetězci a rostoucím vývozem může vláda tyto zisky spojit do jediné průmyslové strategie. Koordinace hlavních výrobců zvýší celkovou produkci vojenských továren a upevní obranný sektor jako pilíř ekonomiky." # todo: NEW TRANSLATION
 HOL_netherlands_fractal_pattern: "Nizozemský fraktálový vzor" # todo: NEW TRANSLATION
 HOL_netherlands_fractal_pattern_desc: "Nizozemský fraktálový vzor (NFP) je maskovací vzor vyvinutý pro nizozemské vojenské uniformy. Tento pokročilý design poskytuje lepší maskování v různých prostředích a zvyšuje přežití i účinnost vojáků v poli." # todo: NEW TRANSLATION
 HOL_Netherlands_Fractal_Pattern_tt: "§YTechnologie, kterou obdržíte, bude upravena na vaší aktuální úrovni technologií pro maskování§!" # todo: NEW TRANSLATION
 HOL_daf_trucks: "Vojenské nákladní vozy DAF CF" # todo: NEW TRANSLATION
 HOL_daf_trucks_desc: "Investice do nákladních vozů DAF zvyšují mobilitu a logistické schopnosti nizozemské armády. Tato všestranná a spolehlivá vozidla jsou nezbytná pro přepravu vojáků, vybavení a zásob a zajišťují operační flexibilitu a podporu." # todo: NEW TRANSLATION
 HOL_DAF_Trucks_tt1: "Investovali jsme do §YDAF§!, náklady jsou §Gsníženy§!." # todo: NEW TRANSLATION
 HOL_DAF_Trucks_tt2: "Pokud §Ginvest§! do §YDAF§! před provedením tohoto zaměření, náklady budou §Gpoloviny§!." # todo: NEW TRANSLATION
 HOL_scania_trucks: "Nový Scania Gryphus" # todo: NEW TRANSLATION
 HOL_scania_trucks_desc: "Zařazení nákladních vozů Scania do vozového parku nizozemské armády zlepší logistickou podporu a efektivitu přepravy. Tyto vozy jsou známé svou odolností a výkonem, takže jsou ideální pro vojenské operace." # todo: NEW TRANSLATION
 HOL_Scania_Trucks_tt: "Přidá §G2000§! §YScania Gryphus§! nákladní vozy, když §YŠvédsko§! odemkne §YScania Gryphus§!" # todo: NEW TRANSLATION
 HOL_mrad_replacement: "Modernizovat MRAD" # todo: NEW TRANSLATION
 HOL_mrad_replacement_desc: "V roce 2020 zahájilo nizozemské ministerstvo obrany zásadní projekt modernizace systémů protivzdušné obrany středního dosahu (MRAD). Současné systémy včetně NASAMS budou nahrazeny pokročilejšími a technologicky vyspělejšími platformami, které lépe ochrání nizozemský vzdušný prostor a podpoří operace NATO. Investicemi do nových schopností protivzdušné obrany zajistíme, že naše síly zůstanou schopné čelit moderním vzdušným hrozbám a chránit oblohu země i v budoucnu." # todo: NEW TRANSLATION
 HOL_colt_upgrade: "Modernizace pušky Colt C7" # todo: NEW TRANSLATION
 HOL_colt_upgrade_desc: "V roce 2009 provedly nizozemské ozbrojené síly významnou modernizaci pušky Colt C7, která zlepšila její přesnost, spolehlivost a přizpůsobivost moderním bojovým scénářům. Modernizace zahrnovala lepší optiku, ergonomii a modulární systémy odpovídající měnícím se potřebám pěchotních jednotek. Těmito investicemi nizozemská armáda zajišťuje, že její vojáci jsou vybaveni špičkovou zbraňovou technologií a udržují vysokou bojovou připravenost." # todo: NEW TRANSLATION
 HOL_pantserhouwitser_mlu: "Pantserhouwitser 2000 MLU" # todo: NEW TRANSLATION
 HOL_pantserhouwitser_mlu_desc: "Program Pantserhouwitser 2000 MLU se zaměřuje na modernizaci těchto samohybných houfnic prostřednictvím lepších systémů řízení palby, většího dostřelu a vyšší přesnosti. Zajišťuje tak, že nizozemské dělostřelectvo zůstane vysoce účinné a schopné poskytovat přesnou palebnou podporu." # todo: NEW TRANSLATION
 HOL_puls: "Objednávka izraelského systému PULS" # todo: NEW TRANSLATION
 HOL_puls_desc: "Precise and Universal Launching System (PULS) je určen ke zlepšení dělostřeleckých schopností nizozemské armády integrací pokročilých raketových a střelových systémů. Tento systém umožňuje přesnou a flexibilní palebnou podporu a zvyšuje celkovou palebnou sílu armády." # todo: NEW TRANSLATION
 HOL_PULS_tt: "Přidá §G20§! §YPULS MLRS§!  když §YIzrael§! odemkne §YPULS§!" # todo: NEW TRANSLATION
 HOL_bushmaster_mlu: "Bushmaster MLU" # todo: NEW TRANSLATION
 HOL_bushmaster_mlu_desc: "Program Bushmaster MLU zahrnuje modernizaci pancéřování, komunikačních systémů a mobility těchto obrněných transportérů. Zvyšuje ochranu a účinnost nizozemských jednotek v různých operačních prostředích." # todo: NEW TRANSLATION
 HOL_munition_investments: "Investice do munice" # todo: NEW TRANSLATION
 HOL_munition_investments_desc: "Investice do pokročilé munice a rozšiřování zásob zajistí, že nizozemská armáda bude dobře zásobena a schopna udržet dlouhodobé operace. Toto zaměření zahrnuje vývoj přesně naváděné munice a zlepšení logistiky dodávek střeliva." # todo: NEW TRANSLATION
 HOL_defensienota_2022: "Defensienota 2022" # todo: NEW TRANSLATION
 HOL_defensienota_2022_desc: "Defensienota 2022 vymezuje strategické investice a reformy pro posílení schopností nizozemské armády. Tento komplexní plán se zaměřuje na modernizaci, zvýšení obranných rozpočtů a zlepšení operační připravenosti ve všech složkách ozbrojených sil." # todo: NEW TRANSLATION
 HOL_procure_stinger_missiles: "Pořídit střely Stinger" # todo: NEW TRANSLATION
 HOL_procure_stinger_missiles_desc: "Pořízení střel Stinger posílí schopnost nizozemské armády bránit se proti nízko letícím letounům a vrtulníkům. Tyto přenosné systémy protivzdušné obrany (MANPADS) poskytují flexibilní a mobilní schopnosti protivzdušné obrany." # todo: NEW TRANSLATION
 HOL_procure_advanced_mortars: "Pořídit pokročilé minomety" # todo: NEW TRANSLATION
 HOL_procure_advanced_mortars_desc: "Investice do pokročilých minometů zlepší schopnosti nepřímé palebné podpory nizozemské armády. Tyto systémy nabízejí větší dostřel, přesnost a mobilitu a poskytují pěchotním jednotkám nezbytnou palebnou sílu." # todo: NEW TRANSLATION
 HOL_develop_guide_munitions: "Vyvinout přesně naváděnou munici" # todo: NEW TRANSLATION
 HOL_develop_guide_munitions_desc: "Vývoj přesně naváděné munice ráže 155 mm zvýší přesnost a účinnost nizozemského dělostřelectva. Tato pokročilá munice umožňuje přesné zaměřování, omezuje vedlejší škody a zvyšuje operační účinnost." # todo: NEW TRANSLATION
 HOL_expand_patriot_systems: "Rozšířit raketové systémy Patriot" # todo: NEW TRANSLATION
 HOL_expand_patriot_systems_desc: "Rozšíření nasazení raketových systémů Patriot zlepší schopnost nizozemské armády bránit se proti balistickým střelám a pokročilým vzdušným hrozbám. Toto zaměření posílí národní i regionální bezpečnost vytvořením robustní sítě protivzdušné a protiraketové obrany." # todo: NEW TRANSLATION
 HOL_expand_command_control_centers: "Rozšířit velitelská a řídicí střediska" # todo: NEW TRANSLATION
 HOL_expand_command_control_centers_desc: "Rozšíření a modernizace velitelských a řídicích středisek posílí operační koordinaci a rozhodovací schopnosti nizozemské armády. Toto zaměření zahrnuje modernizaci komunikačních systémů a integraci pokročilých technologií s cílem zajistit efektivní velení vojenským operacím." # todo: NEW TRANSLATION
 HOL_establish_marechaussee_squad: "Založit jednotku Marechaussee" # todo: NEW TRANSLATION
 HOL_establish_marechaussee_squad_desc: "Marechaussee je zvláštní vojenská policejní síla odpovědná za prosazování práva a udržování logistických operací. Založení této jednotky výrazně zlepší efektivitu zásobování i potlačování nepokojů v našich vojenských operacích." # todo: NEW TRANSLATION
 HOL_modernize_foxtrot: "Modernizovat komunikační systémy Foxtrot" # todo: NEW TRANSLATION
 HOL_modernize_foxtrot_desc: "Modernizace komunikačních systémů Foxtrot se zaměřuje na vylepšení taktické komunikační infrastruktury nizozemské armády. Zahrnuje zavedení bezpečných vysokorychlostních datových spojení, pokročilého šifrování a lepší interoperability se spojenci v NATO. Modernizací těchto systémů nizozemská armáda zajistí spolehlivou a bezpečnou komunikaci v různých operačních prostředích." # todo: NEW TRANSLATION
 HOL_special_forces_helicopter: "Vrtulník speciálních operačních sil" # todo: NEW TRANSLATION
 HOL_special_forces_helicopter_desc: "Pořízení specializovaných vrtulníků pro nizozemské speciální operační síly (SOF) zvýší jejich mobilitu a operační účinnost. Tyto vrtulníky jsou vybaveny pro rychlé vysazení a evakuaci, blízkou leteckou podporu a logistickou podporu v různých prostředích." # todo: NEW TRANSLATION
 HOL_defense_healthsector: "Založit Instituut Defence & Healthcare" # todo: NEW TRANSLATION
 HOL_defense_healthsector_desc: "Instituut Samenwerking Defensie en Relatieziekenhuizen (Institut pro spolupráci mezi obranou a civilními nemocnicemi) se zaměřuje na vytvoření robustní sítě zdravotnické podpory a reakce na krize. Tato spolupráce má zlepšit zdravotní péči o vojenský personál a schopnost armády podporovat civilní zdravotnickou infrastrukturu během mimořádných událostí." # todo: NEW TRANSLATION
 HOL_develop_defensity_college: "Rozvíjet Defensity College" # todo: NEW TRANSLATION
 HOL_develop_defensity_college_desc: "Defensity College je vzdělávací iniciativa určená k poskytování příležitostí k akademickému růstu a specializovanému výcviku vojenskému personálu. Toto zaměření zahrnuje partnerství s univerzitami a technickými instituty, která nabízejí kurzy v různých oborech a zvyšují dovednosti a znalosti nizozemských vojáků a důstojníků." # todo: NEW TRANSLATION
 HOL_hr_ecosystem: "HR-ecosysteem" # todo: NEW TRANSLATION
 HOL_hr_ecosystem_desc: "Iniciativa HR-Ecosysteem má za cíl překlenout propast mezi nizozemskými ozbrojenými silami a společností podporou spolupracující sítě lidských zdrojů. Program se zaměřuje na vytváření partnerství s civilními organizacemi, rozšiřování kariérních příležitostí pro vojenský personál a zlepšování celkové životní pohody příslušníků. Propojováním obrany a společnosti HR-Ecosysteem posiluje podpůrný systém pro vojenský personál během služby i po jejím skončení." # todo: NEW TRANSLATION
 HOL_marinestudie: "Marinestudie" # todo: NEW TRANSLATION
 HOL_marinestudie_desc: "Marinestudie je komplexní studie námořní strategie zaměřená na posouzení a modernizaci Královského nizozemského námořnictva. Projekt zahrnuje hodnocení současných schopností, budoucích hrozeb a technologického pokroku s cílem vytvořit dlouhodobou námořní strategii. Studie klade důraz na zvýšení bojové připravenosti námořnictva, modernizaci prostředků flotily a integraci nových technologií." # todo: NEW TRANSLATION
 HOL_marinestudie_tt: "Noví §YNámořní velitelé§! mohou po povýšení získat vlastnost §Y$HOL_navy_moderniser_leader$§!." # todo: NEW TRANSLATION
 HOL_annual_naval_deployment: "Každoroční nasazení námořnictva" # todo: NEW TRANSLATION
 HOL_annual_naval_deployment_desc: "Každý rok vysílá Královské nizozemské námořnictvo lodě na dálkové plavby dobré vůle, během nichž navštěvují přístavy po celém západním světě. Tato nasazení demonstrují nizozemskou přítomnost, posilují partnerství a zlepšují schopnosti flotily operovat na otevřeném moři." # todo: NEW TRANSLATION
 BNL_aswf_frigates_remaining_tt: "Byly dodány méně než čtyři fregaty ASWF" # todo: NEW TRANSLATION
 BNL_lay_down_aswf_frigate: "Zahájit stavbu fregaty ASWF" # todo: NEW TRANSLATION
 BNL_lay_down_aswf_frigate_desc: "Program protiponorkových fregat je společným belgicko-nizozemským úsilím o nahrazení stárnoucích fregat tříd Karel Doorman a Wielingen čtyřmi moderními plavidly, z nichž dvě budou sloužit Královskému nizozemskému námořnictvu a dvě belgické námořní složce. Každá loď, postavená kolem tichého trupu, vlečného sonarového systému a palubního protiponorkového vrtulníku, je v loděnicích Damen stavěna po celý stavební cyklus, než se připojí k flotile." # todo: NEW TRANSLATION
 BNL_aswf_capability_update: "Modernizace schopností ASWF v polovině životnosti" # todo: NEW TRANSLATION
 BNL_aswf_capability_update_desc: "Po uvedení všech čtyř protiponorkových fregat do služby schvaluje binacionální programová kancelář modernizaci v polovině jejich životnosti. Vylepšený pohon, zdokonalený sonarový systém, posílené protiletadlové odpalovací šachty a modernizované zázemí pro vrtulníky udrží tuto třídu konkurenceschopnou vůči moderním ponorkovým hrozbám po zbytek její služby." # todo: NEW TRANSLATION
 HOL_naval_diplomacy_voyage: "Nizozemská návštěva dobré vůle" # todo: NEW TRANSLATION
 HOL_world_reaching_navy: "Globálně působící námořnictvo" # todo: NEW TRANSLATION
 HOL_world_reaching_navy_desc: "Nizozemsko usiluje o posílení svých námořních schopností, aby mohlo účinně působit po celém světě. Tento záměr zahrnuje modernizaci flotily, rozšíření logistické podpory a posílení mezinárodních partnerství. Nizozemské námořnictvo tak chce zabezpečit životně důležité námořní trasy, účastnit se globálních mírových misí a podle potřeby demonstrovat sílu." # todo: NEW TRANSLATION
 HOL_european_navy: "Evropské námořnictvo" # todo: NEW TRANSLATION
 HOL_european_navy_desc: "Nizozemsko bude hrát vedoucí úlohu při vytváření evropského námořnictva a podporovat užší námořní spolupráci a integraci mezi členskými státy EU. Tato iniciativa má posílit společnou námořní bezpečnost, zefektivnit využívání obranných zdrojů a demonstrovat evropskou námořní sílu na světové scéně." # todo: NEW TRANSLATION
 HOL_expanding_naval_infrastructure: "Rozšiřování námořní infrastruktury" # todo: NEW TRANSLATION
 HOL_expanding_naval_infrastructure_desc: "Nizozemsko se zavazuje posílit svou námořní přítomnost rozšířením sítě námořních základen. Tento záměr zahrnuje výstavbu nových základen a modernizaci stávajících zařízení podél nizozemského pobřeží a v zámořských územích. Rozšířené základny poskytnou strategickou podporu námořním operacím, zlepší logistiku a zajistí schopnost rychlé reakce." # todo: NEW TRANSLATION
 HOL_f35c_development: "Vývoj F35C" # todo: NEW TRANSLATION
 HOL_f35c_development_desc: "Pořízení letounů F-35C Lightning II poskytne nizozemskému letectvu palubní variantu pokročilého stíhacího letounu s technologií stealth. Tento záměr posílí schopnost Nizozemska demonstrovat leteckou sílu z pozemních základen i letadlových lodí a nabídne bezkonkurenční všestrannost a bojovou účinnost." # todo: NEW TRANSLATION
 HOL_F35C_Development_tt: "Když §Y5th Generation Light Aircraft§! bude prozkoumáno, §G50§! §YF-35C§! se přidá do tvého zásobníku." # todo: NEW TRANSLATION
 HOL_future_air_defender: "Budoucí letecký obránce" # todo: NEW TRANSLATION
 HOL_future_air_defender_desc: "Program Budoucí letecký obránce je společným úsilím Nizozemska a Německa o vývoj pokročilých schopností námořní protivzdušné obrany. Iniciativa se zaměřuje na vybavení nizozemských a německých válečných lodí nejmodernějšími radarovými systémy, protiletadlovými střelami a integrovanou technologií velení a řízení." # todo: NEW TRANSLATION
 HOL_multi_ocean_training: "Výcvik na více oceánech" # todo: NEW TRANSLATION
 HOL_multi_ocean_training_desc: "Aby se nizozemské námořnictvo připravilo na rozmanité námořní výzvy, bude provádět rozsáhlá cvičení v několika oceánech. Tato cvičení zlepší interoperabilitu se spojeneckými námořnictvy a zvýší operační připravenost nizozemských námořních sil v různých prostředích." # todo: NEW TRANSLATION
 HOL_carrier_development: "Vývoj letadlové lodi" # todo: NEW TRANSLATION
 HOL_carrier_development_desc: "Vývojem pokročilých letadlových lodí si Nizozemsko zajistí námořní převahu a ochranu budoucích generací." # todo: NEW TRANSLATION
 HOL_expand_dutch_naval_influence: "Rozšířit nizozemský námořní vliv" # todo: NEW TRANSLATION
 HOL_expand_dutch_naval_influence_desc: "Aby se Nizozemsko plně etablovalo jako globální námořní mocnost, musí posílit námořní aliance a zvýšit svůj vliv v mezinárodních námořních organizacích. Tím zajistí zastoupení nizozemských zájmů v globálních námořních operacích a strategiích." # todo: NEW TRANSLATION
 HOL_submarine_hunter_initiative: "Iniciativa lovců ponorek" # todo: NEW TRANSLATION
 HOL_submarine_hunter_initiative_desc: "Rostoucí hrozba nepřátelských ponorek vyžaduje novou doktrínu zaměřenou na protiponorkový boj. Nizozemsko bude stát v čele vývoje nejmodernějších protiponorkových technologií a zajistí, že nizozemské flotily nikdy nebudou vydány napospas neviditelným podvodním hrozbám." # todo: NEW TRANSLATION
 HOL_amphibous_technology: "Specializované expediční síly" # todo: NEW TRANSLATION
 HOL_amphibous_technology_desc: "Nizozemsko by mělo investovat do vytvoření vysoce specializovaných námořních expedičních sil schopných rychlého nasazení do konfliktních zón po celém světě. Tyto síly budou podporovány výsadkovými útočnými loděmi a elitními námořními jednotkami, což umožní rychlé a rozhodné zásahy v zámořských operacích." # todo: NEW TRANSLATION
 HOL_return_of_destroyers: "Návrat torpédoborců" # todo: NEW TRANSLATION
 HOL_return_of_destroyers_desc: "Rozšíření a modernizace flotily torpédoborců je zásadní pro udržení námořní převahy. Tento záměr zahrnuje stavbu nových torpédoborců vybavených pokročilými zbraněmi a obrannými systémy. Tato plavidla posílí operační schopnosti námořnictva a poskytnou účinné obranné i útočné možnosti v různých námořních prostorech." # todo: NEW TRANSLATION
 HOL_thales_investments: "Investice do společnosti Thales" # todo: NEW TRANSLATION
 HOL_thales_investments_desc: "Thales Nederland, dceřiná společnost globální skupiny Thales, je přední nizozemskou firmou v oblasti obranných, leteckých a bezpečnostních technologií. Investice do Thales Nederland zahrnují posílení výrobních kapacit, výzkumu a vývoje a rozšíření její role na globálních obranných trzích." # todo: NEW TRANSLATION
 HOL_special_force_move: "Námořní pěchota ve Vlissingenu" # todo: NEW TRANSLATION
 HOL_special_force_move_desc: "Rozhodnutí zřídit ve Vlissingenu významnou přítomnost námořní pěchoty vychází ze strategických a logistických výhod. Poloha Vlissingenu na pobřeží Severního moře nabízí přímý přístup k námořním trasám, což z něj činí ideální místo pro obojživelné operace a rychlé nasazení. Stávající infrastruktura města a jeho blízkost k důležitým lodním trasám zvyšují operační připravenost a pružnost námořní pěchoty." # todo: NEW TRANSLATION
 HOL_Special_Force_Move_tt: "Až bude §YPřesun námořní pěchoty§! dokončen. Z přesunu získáme výhody." # todo: NEW TRANSLATION
 HOL_rijksregiebureau_maritieme_industrie: "Rijksregiebureau Maritieme Industrie" # todo: NEW TRANSLATION
 HOL_rijksregiebureau_maritieme_industrie_desc: "Zřízení úřadu Rijksregiebureau Maritieme Maakindustrie představuje významný krok k centralizaci a koordinaci námořního zpracovatelského průmyslu v Nizozemsku. Tato agentura zefektivní úsilí o inovace a rozšíření schopností loďařství a námořního strojírenství a zajistí, že nizozemský námořní průmysl zůstane konkurenceschopný a technologicky vyspělý." # todo: NEW TRANSLATION
 HOL_maritiem_masterplan: "Maritiem Masterplan" # todo: NEW TRANSLATION
 HOL_maritiem_masterplan_desc: "Maritiem Masterplan stanovuje komplexní strategii pro posílení nizozemského námořního sektoru. Plán zahrnuje investice do infrastruktury, výzkumu a vývoje a odborné přípravy pracovní síly. Jeho uskutečněním chce Nizozemsko upevnit své postavení globálního lídra v oblasti námořních inovací a udržitelnosti." # todo: NEW TRANSLATION
 HOL_werf_van_de_toekomst: "Werf van de Toekomst" # todo: NEW TRANSLATION
 HOL_werf_van_de_toekomst_desc: "Projekt Werf van de Toekomst (Loděnice budoucnosti) má převratně změnit stavbu lodí v Nizozemsku. Iniciativa se zaměřuje na začlenění pokročilých výrobních technologií, jako jsou automatizace, robotika a 3D tisk, do provozu loděnic. Cílem je vytvořit efektivnější, udržitelnější a nákladově výhodnější procesy stavby lodí." # todo: NEW TRANSLATION
 HOL_smart_maritime: "Chytré námořnictví" # todo: NEW TRANSLATION
 HOL_smart_maritime_desc: "Iniciativa Chytré námořnictví využívá digitální technologie ke zvýšení účinnosti a výkonnosti nizozemského námořního sektoru. Tento záměr zahrnuje zavádění chytrých systémů pro navigaci, logistiku a údržbu i vývoj autonomních plavidel. Přijetím digitální transformace chce Nizozemsko udávat směr v oblasti chytrých námořních řešení." # todo: NEW TRANSLATION
 HOL_robotics_navy: "Robotizované námořnictví" # todo: NEW TRANSLATION
 HOL_robotics_navy_desc: "Projekt Robotisering Wind op Zee (Robotizace větrné energetiky na moři) se zaměřuje na začlenění robotiky a automatizace do odvětví pobřežní větrné energetiky. Cílem iniciativy je zlepšit instalaci, údržbu a provoz větrných turbín na moři a učinit tento proces bezpečnějším, účinnějším a udržitelnějším. Využitím robotiky může Nizozemsko posílit své schopnosti v oblasti obnovitelné energie." # todo: NEW TRANSLATION
 HOL_Robotics_Navy_tt: "§GHalves§! sníží náklady na §YNámořní národní zaměření§!" # todo: NEW TRANSLATION
 HOL_seabed_protection: "Ochrana infrastruktury Severního moře" # todo: NEW TRANSLATION
 HOL_seabed_protection_desc: "Nizozemské Severní moře je nyní pokryto potrubími, elektrickými a datovými kabely a pobřežními větrnými farmami, přičemž sabotáž potrubí Nord Stream odhalila jejich zranitelnost. Specializovaný program podmořského boje propojí průzkumná plavidla, sonarové sítě a bezpilotní podvodní systémy za účelem monitorování a ochrany této kritické infrastruktury." # todo: NEW TRANSLATION
 HOL_nuke_navy: "Nukleární pohon plavidel" # todo: NEW TRANSLATION
 HOL_nuke_navy_desc: "Iniciativa Nucleaire Voortstuwing van Schepen (Nukleární pohon plavidel) zkoumá vývoj a zavedení jaderných pohonných systémů pro nizozemská vojenská i obchodní plavidla. Tento záměr má nabídnout udržitelná řešení pohonu s dlouhým dosahem, snížit závislost na fosilních palivech a zvýšit operační schopnosti nizozemské flotily." # todo: NEW TRANSLATION
 HOL_goalkeeper_modernization: "Modernizace systému Goalkeeper" # todo: NEW TRANSLATION
 HOL_goalkeeper_modernization_desc: "Nizozemsko modernizuje svůj systém blízké obrany Goalkeeper, aby posílilo schopnosti námořní obrany. Projekt zahrnuje instalaci nových radarových a sledovacích systémů, zlepšení řízení palby a integraci pokročilých druhů munice. Modernizované systémy Goalkeeper výrazně zvýší schopnost nizozemského námořnictva bránit se proti přilétajícím střelám a hrozbám na krátkou vzdálenost." # todo: NEW TRANSLATION
 HOL_smartl_radar_construction: "Výstavba radaru SMART-L" # todo: NEW TRANSLATION
 HOL_smartl_radar_construction_desc: "Výstavba radarového systému SMART-L poskytne nizozemskému námořnictvu nejmodernější schopnosti dálkového sledování a určování polohy cílů. Tento pokročilý radar dokáže na velké vzdálenosti odhalovat a sledovat balistické střely, letouny a další vzdušné hrozby. Zavedením radaru SMART-L Nizozemsko zlepší své situační povědomí a posílí celkovou protivzdušnou a protiraketovou obranu." # todo: NEW TRANSLATION
 HOL_Hollandklasse_Frigate_tt: "Dokončení tohoto zaměření vyvolá nabídku spolupráce pro §Y[BEL.GetNameWithFlag]§! na společnou §Yprodukci§! §G6§! Hollandklasse §Yfrigates§!, poté co bude dosažen §YFrigate 2015§! s §G15%§! §Yproduction§! pokrokem pro obě národy, pokud bude nabídka přijata." # todo: NEW TRANSLATION
 HOL_vrouwenklasse_destroyer: "Vývoj třídy Vrouwenklasse" # todo: NEW TRANSLATION
 HOL_vrouwenklasse_destroyer_desc: "Zavedením protiponorkových torpédoborců třídy Vrouwenklasse chce Nizozemsko vybudovat flotilu vysoce pokročilých a všestranných fregat. Tyto lodě budou vybaveny špičkovými raketovými systémy, výkonnými radary a robustními schopnostmi elektronického boje. Torpédoborce třídy Vrouwenklasse jsou navrženy tak, aby vynikaly v útočných i obranných námořních operacích a zajistily, že nizozemské námořnictvo zůstane impozantní silou." # todo: NEW TRANSLATION
 HOL_den_helder_css: "Den Helder CSS" # todo: NEW TRANSLATION
 HOL_den_helder_css_desc: "Projekt Den Helder CSS má vyvinout novou podpůrnou bojovou loď poskytující logistickou a operační podporu nizozemské flotile. Tato loď umožní námořním silám vést dlouhodobé operace díky zásobování palivem, municí a dalšími nezbytnými zdroji. Den Helder CSS bude klíčovým prostředkem k udržení operační účinnosti nizozemského námořnictva." # todo: NEW TRANSLATION
 HOL_joint_support_ship: "Společná podpůrná loď Karel Doorman" # todo: NEW TRANSLATION
 HOL_joint_support_ship_desc: "Zr.Ms. Karel Doorman, uvedená do služby v roce 2015, je společná podpůrná loď kombinující námořní přepravu, doplňování zásob na moři a provoz vrtulníků v jediném trupu. Loď postavená loděnicí Damen Schelde umožňuje Královskému nizozemskému námořnictvu dlouhodobě podporovat expediční úkolová uskupení a námořní pěchotu daleko od domovských přístavů." # todo: NEW TRANSLATION
 HOL_amphibious_transport_group: "Obojživelná transportní skupina" # todo: NEW TRANSLATION
 HOL_amphibious_transport_group_desc: "Výsadkové dokové lodě třídy Rotterdam, v jejichž čele stojí Zr.Ms. Johan de Witt, poskytují Korps Mariniers specializovanou schopnost obojživelného útoku. Díky dokům, prostorům pro vozidla a letovým palubám mohou vysadit posílený prapor námořní pěchoty a sloužit jako plovoucí velitelská stanoviště pro společné operace." # todo: NEW TRANSLATION
 HOL_nh90_mlu: "NH90 MLU" # todo: NEW TRANSLATION
 HOL_nh90_mlu_desc: "Projekt modernizace vrtulníků NH90 v polovině jejich životnosti má prodloužit jejich operační životnost a zlepšit jejich schopnosti ve službách nizozemského námořnictva. Modernizace zahrnuje pokročilou avioniku, zdokonalené senzory a účinnější zbraňové systémy. NH90 MLU zajistí, že tyto všestranné vrtulníky zůstanou účinné při protiponorkovém boji, pátracích a záchranných operacích i transportních misích." # todo: NEW TRANSLATION
 HOL_flexible_navy: "Flexibilní námořní operace" # todo: NEW TRANSLATION
 HOL_flexible_navy_desc: "Královské nizozemské námořnictvo se musí přizpůsobit rychle se měnícímu globálnímu námořnímu prostředí. Zaměřením na flexibilní námořní operace posílíme schopnost naší flotily rychle reagovat na různé hrozby, od ponorkového boje po pobřežní obranu. Nizozemské námořnictvo tak bude moci udržovat přítomnost v různých mořích a podporovat spojence při společných operacích a zajišťovat národní i mezinárodní bezpečnost." # todo: NEW TRANSLATION
 HOL_submarine_modernization: "Program modernizace ponorek" # todo: NEW TRANSLATION
 HOL_submarine_modernization_desc: "Nizozemsko provádí komplexní program modernizace své ponorkové flotily. Iniciativa zahrnuje vybavení stávajících ponorek nejnovějšími technologiemi stealth, pokročilými sonarovými systémy a zdokonalenou výzbrojí. Modernizace zvýší přežití a bojovou účinnost nizozemských ponorek v různých operačních prostředích." # todo: NEW TRANSLATION
 HOL_barracuda_submarine: "Objednávka ponorek Barracuda" # todo: NEW TRANSLATION
 HOL_barracuda_submarine_desc: "Pořízení ponorek třídy Barracuda představuje významný skok ve schopnostech Nizozemska vést podmořský boj. Tyto jaderné ponorky jsou vybaveny pokročilými prvky stealth, schopností úderů na dlouhou vzdálenost a nejmodernějšími sonarovými systémy. Ponorky Barracuda poskytnou nizozemskému námořnictvu bezkonkurenční útočné i obranné schopnosti pod hladinou." # todo: NEW TRANSLATION
 HOL_Barracuda_Submarine_tt: "Tyto ponorky mají zvýšený námořní dosah" # todo: NEW TRANSLATION
 HOL_c71_submarine: "Vývoj nizozemské ponorky C71" # todo: NEW TRANSLATION
 HOL_c71_submarine_desc: "Projekt ponorky C-71 je hrdým produktem nizozemského námořního průmyslu a odráží dlouhou námořní tradici země. Tyto ponorky jsou speciálně navrženy pro pobřežní obranu a speciální operace a disponují pokročilými pohonnými systémy, vysokou manévrovatelností a nejmodernějším komunikačním vybavením. Třída C-71 výrazně posílí schopnost nizozemského námořnictva chránit teritoriální vody a provádět skryté mise a zajistí, že Nizozemsko zůstane lídrem námořní obrany založené na domácím vývoji." # todo: NEW TRANSLATION
 HOL_C71_Submarine_tt: "Tyto ponorky mají zvýšené protiponorkové útoky" # todo: NEW TRANSLATION
 HOL_submarine_drones: "Vývoj ponorkových dronů" # todo: NEW TRANSLATION
 HOL_submarine_drones_desc: "Nizozemsko přijímá budoucnost námořního válčení a investuje do ponorkových dronů na podporu podmořských operací. Tato autonomní a dálkově ovládaná vozidla budou provádět sledování, průzkum a odminovací mise. Integrace ponorkových dronů rozšíří schopnosti nizozemské ponorkové flotily a poskytne významnou taktickou výhodu." # todo: NEW TRANSLATION
 HOL_damen_industry_expansion: "Rozšíření průmyslu Damen" # todo: NEW TRANSLATION
 HOL_damen_industry_expansion_desc: "Ve spolupráci s loděnicemi Damen Nizozemsko rozšiřuje svůj loďařský průmysl, aby uspokojilo rostoucí potřeby programů námořní modernizace. Rozšíření zahrnuje modernizaci loďařských zařízení, investice do výzkumu a vývoje a zvýšení výrobní kapacity. Rozšíření průmyslu Damen zajistí, že Nizozemsko zůstane předním námořním státem s nejmodernějšími námořními technologiemi." # todo: NEW TRANSLATION
 HOL_legendary_dockyards: "Legendární nizozemské loděnice" # todo: NEW TRANSLATION
 HOL_legendary_dockyards_desc: "Obrození nizozemského námořního řemesla přinese neuvěřitelné výsledky: lepší výrobní kapacity lodí, kratší dobu stavby a odolnější konstrukce. Po obnovení legendárních loděnic Nizozemsko upevní své postavení lídra moderního námořního válčení." # todo: NEW TRANSLATION
 HOL_paars: "Paars II" # todo: NEW TRANSLATION
 HOL_paars_desc: "Druhá fialová koalice, tvořená Labouristickou stranou (PvdA), Lidovou stranou pro svobodu a demokracii (VVD) a Demokraty 66 (D66), pokračuje ve vládě v Nizozemsku. Tato koalice usiluje o vyvážení progresivní sociální politiky s ekonomickým liberalismem." # todo: NEW TRANSLATION
 HOL_threats_against_politicians: "Chránit politiky" # todo: NEW TRANSLATION
 HOL_threats_against_politicians_desc: "Nedávné hrozby namířené proti členům politických stran vyvolaly obavy o bezpečnost našich demokratických institucí. Je nezbytné posílit bezpečnostní opatření a zajistit ochranu našich volených představitelů." # todo: NEW TRANSLATION
 HOL_royal_wedding: "Královská svatba" # todo: NEW TRANSLATION
 HOL_royal_wedding_desc: "Zasnoubení korunního prince Willema-Alexandera s Máximou Zorreguietou vyvolalo kontroverze kvůli minulému působení jejího otce v argentinské vojenské diktatuře. To podnítilo politickou i veřejnou debatu o jeho účasti na svatbě a nakonec vedlo k rozhodnutí nizozemské vlády a parlamentu." # todo: NEW TRANSLATION
 HOL_un_mission_ehtiopia: "Připojit se k misi OSN v Etiopii" # todo: NEW TRANSLATION
 HOL_un_mission_ehtiopia_desc: "Organizace spojených národů požádala Nizozemsko o účast v mírové misi v Etiopii. Připojení k této misi posílí naše mezinárodní postavení a přispěje ke globálnímu míru a stabilitě." # todo: NEW TRANSLATION
 HOL_gay: "Manželství osob stejného pohlaví" # todo: NEW TRANSLATION
 HOL_gay_desc: "Legalizace manželství osob stejného pohlaví představuje významný milník v boji za rovnost a lidská práva. Toto historické rozhodnutí upevní postavení Nizozemska jako progresivní a inkluzivní společnosti." # todo: NEW TRANSLATION
 HOL_vvd: "Vítězství Dijkstala a VVD" # todo: NEW TRANSLATION
 HOL_vvd_desc: "VVD je liberálně-konzervativní strana prosazující volný trh, individuální svobodu a minimální zásahy vlády do ekonomiky. Pod vedením pragmatických osobností, jako je Mark Rutte, klade VVD důraz na hospodářský růst, efektivní veřejné služby, silnou národní bezpečnost a vyvážený přístup k imigraci. Strana usiluje o vytvoření dynamické a konkurenceschopné ekonomiky při zachování osobních svobod a sociální stability." # todo: NEW TRANSLATION
 HOL_economic_paper: "Omezit ekonomickou byrokracii" # todo: NEW TRANSLATION
 HOL_economic_paper_desc: "VVD se zavazuje omezit zbytečnou ekonomickou administrativu, aby podpořila dynamičtější a efektivnější podnikatelské prostředí. Odstraněním byrokratických překážek umožníme podnikům soustředit se na růst a inovace." # todo: NEW TRANSLATION
 HOL_vvd_debt_reduction: "Snížení dluhu" # todo: NEW TRANSLATION
 HOL_vvd_debt_reduction_desc: "Zajištění dlouhodobé stability naší ekonomiky je prvořadé. VVD chce snížit státní dluh obezřetným fiskálním řízením a cílenými škrty ve výdajích a zajistit prosperující budoucnost pro další generace." # todo: NEW TRANSLATION
 HOL_economic_stimulation_tax: "Daň na podporu ekonomiky" # todo: NEW TRANSLATION
 HOL_economic_stimulation_tax_desc: "VVD věří v sílu ekonomických pobídek při podpoře růstu. Zavedením daňových úlev pro klíčová odvětví podpoříme investice, inovace a hospodářskou expanzi." # todo: NEW TRANSLATION
 HOL_startup_innovation_policies: "Politika inovací startupů" # todo: NEW TRANSLATION
 HOL_startup_innovation_policies_desc: "Podpora podnikání stojí v centru ekonomické strategie VVD. Nabídneme daňové úlevy a granty inovativním startupům a vytvoříme živý podnikatelský ekosystém." # todo: NEW TRANSLATION
 HOL_vvd_leadership: "Referendum o vedení" # todo: NEW TRANSLATION
 HOL_vvd_leadership_desc: "V roce 2006 čelila VVD vnitřnímu souboji o vedení mezi Markem Ruttem a Ritou Verdonkovou. K vyřešení sporu a určení budoucího směřování strany se mezi členy VVD konalo referendum o vedení. Jeho výsledek měl utvářet politiku a strategii strany a vyvažovat Rutteho pragmatický centristický přístup proti tvrdým postojům Verdonkové." # todo: NEW TRANSLATION
 HOL_mark_rutte: "Mark Rutte" # todo: NEW TRANSLATION
 HOL_mark_rutte_desc: "Mark Rutte, pragmatický a centristický lídr VVD, je znám svou schopností vytvářet široké koalice a orientovat se ve složitém politickém prostředí. V roce 2006 zdůrazňuje vyvážený přístup k vládnutí, zaměřený na ekonomický liberalismus, efektivní veřejné služby a umírněnou sociální politiku. Rutte chce modernizovat nizozemskou infrastrukturu, podporovat inovace a zajistit silné postavení Nizozemska v Evropské unii." # todo: NEW TRANSLATION
 HOL_consensus_politics: "Konsenzuální politika" # todo: NEW TRANSLATION
 HOL_consensus_politics_desc: "Pod vedením Marka Rutteho se VVD zaměří na vytváření širokých koalic a dosahování konsenzu napříč politickým spektrem, což zajistí stabilitu a účinné vládnutí." # todo: NEW TRANSLATION
 HOL_modernize_dutch_infrastructure: "Modernizovat nizozemskou infrastrukturu" # todo: NEW TRANSLATION
 HOL_modernize_dutch_infrastructure_desc: "Investice do infrastruktury jsou klíčové pro hospodářský růst. VVD zmodernizuje silnice, železnice a digitální sítě, aby zlepšila propojení a snížila dopravní zácpy." # todo: NEW TRANSLATION
 HOL_strong_netherlands_europe: "Silné Nizozemsko v silné Evropě" # todo: NEW TRANSLATION
 HOL_strong_netherlands_europe_desc: "Silná Evropská unie je nezbytná pro naši bezpečnost a prosperitu. VVD bude prosazovat hlubší hospodářskou a bezpečnostní spolupráci v rámci EU." # todo: NEW TRANSLATION
 HOL_nato_norm: "Investovat do splnění normy NATO" # todo: NEW TRANSLATION
 HOL_nato_norm_desc: "Národní bezpečnost není předmětem kompromisu. VVD se zavazuje zvýšit výdaje na obranu tak, aby dosáhly cíle NATO ve výši 2 % HDP, a zajistit tak ochranu našeho národa i plnění spojeneckých závazků." # todo: NEW TRANSLATION
 HOL_pragmatic_immigration: "Pragmatická imigrační politika" # todo: NEW TRANSLATION
 HOL_pragmatic_immigration_desc: "VVD pod Rutteho vedením vyváží bezpečnostní obavy s potřebou integrace a zavede pragmatickou imigrační politiku podporující sociální soudržnost a hospodářský přínos." # todo: NEW TRANSLATION
 HOL_teflon_mark: "Teflonový Mark" # todo: NEW TRANSLATION
 HOL_teflon_mark_desc: "Rutteho odolnost a schopnost zvládat politické výzvy jsou neocenitelnými přednostmi. VVD využije jeho vedení k udržení stability a pokroku." # todo: NEW TRANSLATION
 HOL_rita_verdonk: "Rita Verdonk" # todo: NEW TRANSLATION
 HOL_rita_verdonk_desc: "Rita Verdonk, významná osobnost VVD, je známá svým tvrdým postojem k imigraci a zákonu a pořádku. V roce 2006 prosazuje přísnou kontrolu imigrace, robustní opatření národní bezpečnosti a zachování nizozemské kulturní identity. Její přístup oslovuje voliče hledající rozhodnou politiku integrace a veřejné bezpečnosti a staví ji do role silné a neústupné vůdkyně strany." # todo: NEW TRANSLATION
 HOL_national_identity: "Národní identita" # todo: NEW TRANSLATION
 HOL_national_identity_desc: "Zachování nizozemské kultury a identity je prvořadé. VVD pod vedením Verdonkové zavede politiku zajišťující ochranu a oslavu našeho národního dědictví." # todo: NEW TRANSLATION
 HOL_tough_on_immigration: "Tvrdý přístup k imigraci" # todo: NEW TRANSLATION
 HOL_tough_on_immigration_desc: "VVD zaujme tvrdý postoj k imigraci, aby ochránila naše hranice a zachovala společenský řád, s důrazem na přísnou kontrolu a omezení přílivu migrantů." # todo: NEW TRANSLATION
 HOL_law_and_order: "Zákon a pořádek" # todo: NEW TRANSLATION
 HOL_law_and_order_desc: "Zajištění veřejné bezpečnosti je základní hodnotou VVD. Zvýšíme financování policie a ozbrojených sil, abychom bojovali proti zločinu a zajistili národní bezpečnost." # todo: NEW TRANSLATION
 HOL_self_reliance_citizens: "Soběstační občané" # todo: NEW TRANSLATION
 HOL_self_reliance_citizens_desc: "Podpora soběstačnosti a omezení závislosti na státní podpoře jsou klíčovými cíli VVD. Zavedeme politiku podporující osobní odpovědnost a ekonomickou nezávislost." # todo: NEW TRANSLATION
 HOL_promote_dutch_sovereignty: "Prosazovat nizozemskou suverenitu" # todo: NEW TRANSLATION
 HOL_promote_dutch_sovereignty_desc: "VVD pod vedením Verdonkové zdůrazní nizozemskou suverenitu, omezí vliv EU na národní politiku a ochrání naši nezávislost." # todo: NEW TRANSLATION
 HOL_iron_rita: "Železná Rita" # todo: NEW TRANSLATION
 HOL_iron_rita_desc: "Silné a rozhodné vedení Rity Verdonkové povede VVD těžkými časy a zajistí pevnou kontrolu a jasný směr do budoucna." # todo: NEW TRANSLATION
 HOL_wilders_vvd: "Geert Wilders" # todo: NEW TRANSLATION
 HOL_wilders_vvd_desc: "Geert Wilders je nejvýraznějším hlasem VVD proti imigraci a vyjadřuje rostoucí znepokojení veřejnosti ohledně integrace a evropské integrace. Posouvá stranu k tvrdšímu postoji k imigraci, bezpečnosti a národní suverenitě, přičemž stále působí v jejím liberálním rámci." # todo: NEW TRANSLATION
 HOL_immigration_hardliner: "Tvrdý odpůrce imigrace" # todo: NEW TRANSLATION
 HOL_immigration_hardliner_desc: "Wilders požaduje výrazně přísnější limity pro imigraci a azyl. VVD zpřísní podmínky vstupu a integrace a představí se jako strana, která ochrání nizozemskou společnost před nekontrolovanou migrací." # todo: NEW TRANSLATION
 HOL_islam_integration_debate: "Debata o integraci" # todo: NEW TRANSLATION
 HOL_islam_integration_debate_desc: "Wilders vyvolává celonárodní debatu o islámu, integraci a nizozemských hodnotách. Strana zaujímá konfrontační postoj a trvá na tom, že nově příchozí musí plně přijmout liberální a kulturní normy země." # todo: NEW TRANSLATION
 HOL_eurosceptic_vvd_wing: "Euroskeptické křídlo" # todo: NEW TRANSLATION
 HOL_eurosceptic_vvd_wing_desc: "Frakce kolem Wilderse nedůvěřuje stále užší evropské integraci. VVD zaujímá kritičtější postoj vůči Bruselu, odmítá převody suverenity a zpochybňuje další rozšiřování." # todo: NEW TRANSLATION
 HOL_security_first: "Bezpečnost především" # todo: NEW TRANSLATION
 HOL_security_first_desc: "Uprostřed politického násilí a obav z terorismu Wilders požaduje tvrdší bezpečnostní politiku. Strana rozšíří pravomoci policie a protiteroristických složek, aby uklidnila znepokojenou veřejnost." # todo: NEW TRANSLATION
 HOL_wilders_dutch_sovereignty: "Nizozemská suverenita" # todo: NEW TRANSLATION
 HOL_wilders_dutch_sovereignty_desc: "Wildersovo křídlo staví národní suverenitu nad nadnárodní závazky. VVD prosadí přednost nizozemského práva a institucí a omezí dosah vnějších orgánů na domácí politiku." # todo: NEW TRANSLATION
 HOL_wilders_vvd_capstone: "Hlas nespokojených" # todo: NEW TRANSLATION
 HOL_wilders_vvd_capstone_desc: "Wilders se stává nepochybným obhájcem voličů, kteří mají pocit, že jejich hlas není slyšet. Jeho populistická přitažlivost mění obraz VVD a spojuje neklidný elektorát s novou, tvrdší identitou strany." # todo: NEW TRANSLATION
 HOL_liberal_society: "Liberální společnost" # todo: NEW TRANSLATION
 HOL_liberal_society_desc: "Prosazování liberálního ekonomického modelu je základem vize VVD. Budeme podporovat volné trhy a konkurenci, aby poháněly inovace a prosperitu." # todo: NEW TRANSLATION
 HOL_vvd_klimaatakkoord: "Klimová dohoda" # todo: NEW TRANSLATION
 HOL_vvd_klimaatakkoord_desc: "Závazek k nizozemské klimatické dohodě je nezbytný pro udržitelnou budoucnost. VVD bude vést snahy o snížení emisí skleníkových plynů a podporu obnovitelné energie." # todo: NEW TRANSLATION
 HOL_modernizing_public_services: "Modernizace veřejných služeb" # todo: NEW TRANSLATION
 HOL_modernizing_public_services_desc: "Modernizace veřejných služeb prostřednictvím digitální infrastruktury a zjednodušených procesů je pro VVD prioritou, která zajistí efektivitu a dostupnost pro všechny občany." # todo: NEW TRANSLATION
 HOL_commitment_to_security: "Závazek k bezpečnosti" # todo: NEW TRANSLATION
 HOL_commitment_to_security_desc: "Zajištění bezpečnosti našeho národa je nejvyšší prioritou. VVD bude investovat do policie a ozbrojených sil, aby chránila naše občany a prosazovala vládu zákona." # todo: NEW TRANSLATION
 HOL_public_private_partnerships: "Veřejně-soukromá partnerství" # todo: NEW TRANSLATION
 HOL_public_private_partnerships_desc: "VVD podporuje veřejně-soukromá partnerství za účelem rozvoje infrastruktury a podpory hospodářského růstu prostřednictvím spolupráce." # todo: NEW TRANSLATION
 HOL_Public_Private_Partnerships_tt: "Nahraďte §YConsolidating Liberal Gains§! §YLiberal Society Fulfilled§!\nÚčinná změna:\nSnížené náklady na §YEconomic Focusses§! o §G10%§!." # todo: NEW TRANSLATION
 HOL_increase_cyber_security: "Posílit kybernetickou bezpečnost" # todo: NEW TRANSLATION
 HOL_increase_cyber_security_desc: "V stále digitálnějším světě bude VVD investovat do opatření kybernetické bezpečnosti, která ochrání národní infrastrukturu a digitální aktiva před kybernetickými hrozbami." # todo: NEW TRANSLATION
 HOL_privatize_health_sector: "Privatizovat zdravotnictví" # todo: NEW TRANSLATION
 HOL_privatize_health_sector_desc: "Zavedení tržních mechanismů do zdravotnictví zlepší efektivitu a sníží náklady a zajistí lepší poskytování služeb pro všechny." # todo: NEW TRANSLATION
 HOL_woningbouwimpuls: "Rozvoj bydlení" # todo: NEW TRANSLATION
 HOL_woningbouwimpuls_desc: "Řešení nedostatku bydlení je zásadní. VVD urychlí výstavbu bytů a domů, aby byly cenově dostupnější a přístupnější." # todo: NEW TRANSLATION
 HOL_economy_based_education: "Vzdělávání podle potřeb ekonomiky" # todo: NEW TRANSLATION
 HOL_economy_based_education_desc: "Sladění vzdělávacích programů s potřebami trhu zajistí, že studenti získají dovednosti, po nichž je vysoká poptávka, čímž se zvýší jejich zaměstnatelnost i výkon ekonomiky." # todo: NEW TRANSLATION
 HOL_innovation_subsidies: "Dotace na inovace" # todo: NEW TRANSLATION
 HOL_innovation_subsidies_desc: "Poskytování dotací inovativním projektům podpoří kulturu kreativity a technologického pokroku, což bude hnát hospodářský růst a konkurenceschopnost." # todo: NEW TRANSLATION
 HOL_excellent_schools: "Zavést vynikající školy" # todo: NEW TRANSLATION
 HOL_excellent_schools_desc: "Podpora vzniku vynikajících škol zvýší vzdělávací standardy a výsledky a zajistí, že naše děti získají nejlepší možné vzdělání." # todo: NEW TRANSLATION
 HOL_invest_clean_energy: "Investovat do čisté energie" # todo: NEW TRANSLATION
 HOL_invest_clean_energy_desc: "Investice do technologií čisté energie jsou klíčové pro snížení závislosti na fosilních palivech a omezení emisí uhlíku. VVD podpoří projekty obnovitelné energie a udržitelné postupy." # todo: NEW TRANSLATION
 HOL_decrease_trade_bureaucracy: "Omezit obchodní byrokracii" # todo: NEW TRANSLATION
 HOL_decrease_trade_bureaucracy_desc: "Snížení byrokratických překážek v obchodě usnadní plynulejší a rychlejší mezinárodní transakce. VVD chce zjednodušit obchodní procesy a zvýšit efektivitu vývozu." # todo: NEW TRANSLATION
 HOL_mkb_actieplan: "MKB Actieplan" # todo: NEW TRANSLATION
 HOL_mkb_actieplan_desc: "Podpora malých a středních podniků je zásadní pro hospodářský růst. VVD zavede akční plán poskytující malým a středním podnikům daňové úlevy, granty a menší regulační zátěž." # todo: NEW TRANSLATION
 HOL_nederland_digitaal: "Nederland Digitaal" # todo: NEW TRANSLATION
 HOL_nederland_digitaal_desc: "VVD si představuje plně digitalizovanou vládu a sektor veřejných služeb. Investicemi do pokročilé IT infrastruktury a elektronické správy zvýšíme efektivitu, transparentnost a dostupnost pro všechny občany." # todo: NEW TRANSLATION
 HOL_balkenende: "Začíná éra Balkenendeho" # todo: NEW TRANSLATION
 HOL_balkenende_desc: "Vedení Jana Petera Balkenendeho zdůrazňuje křesťanskodemokratické hodnoty solidarity, odpovědnosti a péče o svěřené dědictví. Jeho pragmatický přístup k vládnutí usiluje o vyvážení hospodářského růstu, sociální spravedlnosti a environmentální udržitelnosti." # todo: NEW TRANSLATION
 HOL_Balkenende_tt: "Přidejte §HKonzervativní společnost§!, která uděluje ( £political_power_texticon  Politická síla: [?0.10|%+] , £foreign_influence_defense_modifier_texticon §YForeign Influence Defense§! Násobič: [?-0.10|%+])" # todo: NEW TRANSLATION
 HOL_invest_in_police: "Investovat do policie" # todo: NEW TRANSLATION
 HOL_invest_in_police_desc: "Posílení kapacity a schopností našich policejních sil zajistí veřejnou bezpečnost a dodržování vlády zákona a vytvoří bezpečné prostředí pro všechny občany." # todo: NEW TRANSLATION
 HOL_prohibit_soft_drugs: "Zakázat měkké drogy" # todo: NEW TRANSLATION
 HOL_prohibit_soft_drugs_desc: "CDA zavede přísnější regulaci měkkých drog, omezí jejich dostupnost a zmírní související škody s cílem chránit veřejné zdraví a společenský řád." # todo: NEW TRANSLATION
 HOL_unhcr_migration_office: "Migrační úřad UNHCR" # todo: NEW TRANSLATION
 HOL_unhcr_migration_office_desc: "Podpora zřízení migračního úřadu UNHCR v Nizozemsku zlepší naši schopnost účinně a humánně řešit otázky azylu a uprchlíků." # todo: NEW TRANSLATION
 HOL_skilled_immigration: "Pouze kvalifikovaná imigrace" # todo: NEW TRANSLATION
 HOL_skilled_immigration_desc: "Zaměření na kvalifikovanou imigraci zajistí, že nově příchozí budou pozitivně přispívat k naší ekonomice a společnosti, řešit potřeby trhu práce a zároveň zachovávat sociální soudržnost." # todo: NEW TRANSLATION
 HOL_solidarity_healthcare: "Solidární zdravotnictví" # todo: NEW TRANSLATION
 HOL_solidarity_healthcare_desc: "CDA věří ve zdravotnický systém založený na solidaritě. Zajištěním přístupu všech ke kvalitní zdravotní péči chceme vytvořit inkluzivnější a podpůrnější společnost." # todo: NEW TRANSLATION
 HOL_living_care: "Bydlení a péče" # todo: NEW TRANSLATION
 HOL_living_care_desc: "Propojení bydlení a pečovatelských zařízení zajistí, že starší obyvatelé dostanou ve svých komunitách potřebnou podporu a budou moci žít důstojně a kvalitně." # todo: NEW TRANSLATION
 HOL_family_ministry: "Ministerstvo rodiny" # todo: NEW TRANSLATION
 HOL_family_ministry_desc: "Zřízení ministerstva rodiny centralizuje úsilí na podporu rodinného života a zajistí, že vládní politika bude podporovat blaho rodin." # todo: NEW TRANSLATION
 HOL_invest_childcare: "Investovat do péče o děti" # todo: NEW TRANSLATION
 HOL_invest_childcare_desc: "Dostupná a kvalitní péče o děti je zásadní pro pracující rodiny. CDA zvýší financování služeb péče o děti a podpoří rodiče i děti." # todo: NEW TRANSLATION
 HOL_child_subsidies: "Přídavky na děti" # todo: NEW TRANSLATION
 HOL_child_subsidies_desc: "Finanční podpora rodin s dětmi pomůže zmírnit náklady na výchovu rodiny a podpoří blaho našich nejmladších občanů." # todo: NEW TRANSLATION
 HOL_nederland_sportland: "Nederland Sportland" # todo: NEW TRANSLATION
 HOL_nederland_sportland_desc: "Podpora sportu a fyzické aktivity je nezbytná pro zdravou společnost. CDA bude investovat do sportovních zařízení a programů podporujících aktivní životní styl." # todo: NEW TRANSLATION
 HOL_invest_in_clean_energy: "Investovat do čisté energie" # todo: NEW TRANSLATION
 HOL_invest_in_clean_energy_desc: "Investice do technologií čisté energie jsou klíčové pro udržitelnou budoucnost. CDA podpoří projekty obnovitelné energie a iniciativy ke snížení emisí uhlíku." # todo: NEW TRANSLATION
 HOL_financial_freedom_schools: "Finanční svoboda škol" # todo: NEW TRANSLATION
 HOL_financial_freedom_schools_desc: "Poskytnutí finanční autonomie školám jim umožní lépe reagovat na potřeby studentů a inovovat ve vzdělávání." # todo: NEW TRANSLATION
 HOL_practical_job_education: "Praktické pracovní vzdělávání" # todo: NEW TRANSLATION
 HOL_practical_job_education_desc: "Zaměření na praktické pracovní vzdělávání zajistí, že studenti získají dovednosti potřebné na trhu práce, sníží nezaměstnanost a podpoří hospodářský růst." # todo: NEW TRANSLATION
 HOL_business_risk_law: "Zákon o odpovědnosti podniků" # todo: NEW TRANSLATION
 HOL_business_risk_law_desc: "CDA zavede zákon vyžadující, aby podniky nesly odpovědnost za své zaměstnance i v době jejich nemoci. Tato politika má chránit práva zaměstnanců a podporovat zdravější a podpůrnější pracovní prostředí." # todo: NEW TRANSLATION
 HOL_maatschappelijk_ondernemen: "Maatschappelijk Ondernemen" # todo: NEW TRANSLATION
 HOL_maatschappelijk_ondernemen_desc: "Podpora společensky odpovědného podnikání zajistí, že firmy budou pozitivně přispívat společnosti a vyvažovat zisk se sociálními a environmentálními povinnostmi." # todo: NEW TRANSLATION
 HOL_remove_trade_tape: "Odstranit obchodní byrokracii" # todo: NEW TRANSLATION
 HOL_remove_trade_tape_desc: "Omezení byrokratických překážek v obchodě usnadní plynulejší a efektivnější mezinárodní transakce, podpoří vývoz a hospodářský růst." # todo: NEW TRANSLATION
 HOL_diversify_housing: "Diverzifikovat bydlení" # todo: NEW TRANSLATION
 HOL_diversify_housing_desc: "CDA bude investovat do rozmanitých bytových projektů včetně sociálního bydlení, nájemních bytů a vlastnického bydlení, aby řešila nedostatek bytů a nabídla cenově dostupné možnosti." # todo: NEW TRANSLATION
 HOL_balkenende_resigns: "Balkenende IV odstupuje" # todo: NEW TRANSLATION
 HOL_balkenende_resigns_desc: "V souladu se zásadou ministerské obměny CDA odstoupil premiér Jan Peter Balkenende po dvou volebních obdobích. Toto rozhodnutí znamená konec kabinetu Balkenende IV a začátek nové kapitoly pro CDA, která straně zajistí nové perspektivy a vedení." # todo: NEW TRANSLATION
 HOL_maxime_verhagen: "Maxime Verhagen" # todo: NEW TRANSLATION
 HOL_maxime_verhagen_desc: "Maxime Verhagen je zkušený diplomat a tvůrce koalic známý svým pragmatickým vedením. Jeho zaměření na posilování mezinárodních aliancí a zachování stability z něj učinilo respektovanou osobnost nizozemské i světové politiky." # todo: NEW TRANSLATION
 HOL_trust_in_people: "Důvěra v lidi " # todo: NEW TRANSLATION
 HOL_trust_in_people_desc: "Budování důvěry v naše občany je zásadní pro soudržnou společnost. CDA bude prosazovat politiku posilující jednotlivce a podporující vzájemný respekt." # todo: NEW TRANSLATION
 HOL_trust_in_organizations: "Důvěra v organizace" # todo: NEW TRANSLATION
 HOL_trust_in_organizations_desc: "CDA posílí integritu a transparentnost organizací a zajistí, že budou jednat eticky a pozitivně přispívat společnosti." # todo: NEW TRANSLATION
 HOL_Trust_In_Organizations_tt: "§HVšechny nizozemské státy§! Obdrží §H50 Produktivita§!" # todo: NEW TRANSLATION
 HOL_active_society: "Aktivní společnost" # todo: NEW TRANSLATION
 HOL_active_society_desc: "Podpora aktivního občanství a zapojení komunity je ústředním bodem vize CDA. Budeme podporovat iniciativy posilující dobrovolnictví a občanskou angažovanost." # todo: NEW TRANSLATION
 HOL_micro_credit: "Povolit mikroúvěry" # todo: NEW TRANSLATION
 HOL_micro_credit_desc: "Usnadnění přístupu k mikroúvěrům posílí malé podniky a podnikatele a podpoří hospodářský růst a inovace na místní úrovni." # todo: NEW TRANSLATION
 HOL_public_private_innovation: "Soukromé a veřejné inovace" # todo: NEW TRANSLATION
 HOL_public_private_innovation_desc: "Podpora spolupráce mezi soukromým a veřejným sektorem bude hnát inovace a zvyšovat efektivitu a účinnost veřejných služeb." # todo: NEW TRANSLATION
 HOL_heavy_efforts_clean_industry: "Rozsáhlé úsilí o čistou energii" # todo: NEW TRANSLATION
 HOL_heavy_efforts_clean_industry_desc: "Zintenzivnění úsilí na podporu čisté energie sníží naši uhlíkovou stopu a zajistí Nizozemsku udržitelnou budoucnost." # todo: NEW TRANSLATION
 HOL_invest_bio_agriculture: "Investovat do ekologického zemědělství" # todo: NEW TRANSLATION
 HOL_invest_bio_agriculture_desc: "Podpora ekologického zemědělství podpoří udržitelné zemědělské postupy a zajistí dlouhodobé zdraví našeho životního prostředí a potravinových zdrojů." # todo: NEW TRANSLATION
 HOL_buma: "Sybrand van Haersma Buma" # todo: NEW TRANSLATION
 HOL_buma_desc: "Po odstoupení Balkenendeho přebírá vedení CDA Sybrand van Haersma Buma a přináší nové zaměření na tradiční hodnoty a sociální spravedlnost." # todo: NEW TRANSLATION
 HOL_reform_justice_system: "Reformovat justiční systém" # todo: NEW TRANSLATION
 HOL_reform_justice_system_desc: "Reforma justičního systému zvýší spravedlnost, efektivitu a dostupnost a zajistí všem občanům rovný přístup ke spravedlnosti." # todo: NEW TRANSLATION
 HOL_modern_investments_police: "Moderní investice do policie" # todo: NEW TRANSLATION
 HOL_modern_investments_police_desc: "Další investice do policejních sil zajistí veřejnou bezpečnost a dodržování vlády zákona a vytvoří bezpečné prostředí pro všechny občany." # todo: NEW TRANSLATION
 HOL_traditional_values: "Tradiční hodnoty" # todo: NEW TRANSLATION
 HOL_traditional_values_desc: "CDA zůstává odhodlána chránit tradiční hodnoty, včetně rodiny, komunity a společenské odpovědnosti, jakožto základ naší společnosti." # todo: NEW TRANSLATION
 HOL_rentmeesterschap: "Rentmeesterschap" # todo: NEW TRANSLATION
 HOL_rentmeesterschap_desc: "Přijetím principu „rentmeesterschap“ (správcovství) bude CDA podporovat udržitelné hospodaření se zdroji, zajistí jejich zachování pro budoucí generace a zároveň podpoří hospodářský růst." # todo: NEW TRANSLATION
 HOL_green_economy: "Zelená ekonomika" # todo: NEW TRANSLATION
 HOL_green_economy_desc: "Přechod na zelenou ekonomiku je nezbytný pro udržitelný rozvoj. CDA podpoří iniciativy prosazující ekologické technologie a postupy a vyváží hospodářský růst s ochranou životního prostředí." # todo: NEW TRANSLATION
 HOL_reduce_european_influence: "Omezit evropský vliv" # todo: NEW TRANSLATION
 HOL_reduce_european_influence_desc: "Za účelem zachování nizozemské suverenity a upřednostnění národních zájmů bude CDA prosazovat omezení vlivu Evropské unie na domácí politiku." # todo: NEW TRANSLATION
 HOL_fortress_of_values: "Pevnost hodnot" # todo: NEW TRANSLATION
 HOL_fortress_of_values_desc: "Sybrand Buma chce posílit společenskou strukturu a národní identitu Nizozemska podporou tradičních hodnot a odolnosti. Jeho politika se zaměřuje na budování jednotného a bezpečného národa a zdůrazňuje ochranu nizozemské kultury a dědictví. Posílením základních principů země chce Buma vytvořit společnost, která pevně odolá vnějším hrozbám i vnitřnímu rozdělení a zároveň podpoří silné a hrdé občanství." # todo: NEW TRANSLATION
 HOL_melkert_surprise: "Melkertovo překvapivé vítězství" # todo: NEW TRANSLATION
 HOL_melkert_surprise_desc: "Pod vedením Ada Melkerta představila PvdA nečekané a inovativní politiky zaměřené na oživení národa. Tyto iniciativy slibují pozitivní změny a vytvářejí základy inkluzivnější a prosperující společnosti." # todo: NEW TRANSLATION
 HOL_inclusive_society: "Inkluzivní společnost" # todo: NEW TRANSLATION
 HOL_inclusive_society_desc: "Vytvoření inkluzivní společnosti, v níž se každý cítí ceněný a respektovaný, je základním principem PvdA. Zavedeme politiku podporující rozmanitost a sociální soudržnost a zajistíme, že se všichni občané budou moci plně účastnit života komunity." # todo: NEW TRANSLATION
 HOL_democratic_active_government: "Demokratická a aktivní vláda" # todo: NEW TRANSLATION
 HOL_democratic_active_government_desc: "PvdA se zavazuje posilovat demokratické instituce a podporovat aktivní zapojení občanů do politiky. Zajistíme, aby vláda byla transparentní, odpovědná a reagovala na potřeby všech občanů." # todo: NEW TRANSLATION
 HOL_strong_european_union: "Silná Evropská unie" # todo: NEW TRANSLATION
 HOL_strong_european_union_desc: "PvdA podporuje silnou, demokratickou a sociálně odpovědnou Evropskou unii. Budeme usilovat o hlubší hospodářskou a politickou integraci a podporovat spolupráci a solidaritu mezi členskými státy EU." # todo: NEW TRANSLATION
 HOL_accessible_healthcare: "Dostupná zdravotní péče" # todo: NEW TRANSLATION
 HOL_accessible_healthcare_desc: "Zajištění přístupu všech ke kvalitní zdravotní péči je pro PvdA prioritou. Rozšíříme veřejné zdravotnické služby, zkrátíme čekací doby a zajistíme, že zdravotní péče zůstane dostupná pro všechny." # todo: NEW TRANSLATION
 HOL_social_security: "Sociální zabezpečení pro všechny" # todo: NEW TRANSLATION
 HOL_social_security_desc: "Posílení systému sociálního zabezpečení je zásadní pro ochranu nejzranitelnějších členů společnosti. PvdA zajistí, aby sociální dávky pokrývaly základní potřeby všech občanů a poskytovaly podporu v dobách nouze." # todo: NEW TRANSLATION
 HOL_work_care_for_all: "Práce a péče pro všechny" # todo: NEW TRANSLATION
 HOL_work_care_for_all_desc: "PvdA zaručuje všem přístup k placené práci a kvalitní zdravotní péči. Budeme podporovat politiku, která lidem pomůže sladit práci, pečovatelské povinnosti a osobní rozvoj a vytvoří podpůrnější a inkluzivnější společnost." # todo: NEW TRANSLATION
 HOL_fair_wages: "Spravedlivé mzdy a dávky" # todo: NEW TRANSLATION
 HOL_fair_wages_desc: "Zajištění spravedlivých mezd a dávek pro všechny pracovníky je nezbytné pro snížení příjmové nerovnosti. PvdA zavede politiku podporující spravedlivé odměňování a kolektivní vyjednávání a zajistí finanční bezpečí nejzranitelnějších." # todo: NEW TRANSLATION
 HOL_job_creation_security: "Tvorba pracovních míst a bezpečí" # todo: NEW TRANSLATION
 HOL_job_creation_security_desc: "Vytváření pracovních příležitostí pro všechny občany je zásadní. PvdA bude investovat do rekvalifikačních programů, podporovat malé podniky a zajistí každému možnost najít smysluplnou práci, podpoří pracovní jistotu a sníží nezaměstnanost." # todo: NEW TRANSLATION
 HOL_quality_education_for_all: "Kvalitní vzdělání pro všechny" # todo: NEW TRANSLATION
 HOL_quality_education_for_all_desc: "Investice do vzdělávání na všech úrovních jsou klíčem k tomu, aby každé dítě i dospělý měli přístup ke kvalitnímu učení. PvdA podpoří odbornou přípravu, celoživotní vzdělávání a zajistí, že vzdělávací programy budou odpovídat potřebám trhu práce." # todo: NEW TRANSLATION
 HOL_sustainable_economic_growth: "Udržitelný hospodářský růst" # todo: NEW TRANSLATION
 HOL_sustainable_economic_growth_desc: "PvdA se zaměřuje na udržitelný hospodářský růst, z něhož budou mít prospěch všichni občané. Budeme investovat do obnovitelné energie, inovací a zelených technologií, abychom vybudovali odolnou a udržitelnou ekonomiku pro budoucí generace." # todo: NEW TRANSLATION
 HOL_invest_childcare_pvda: "Investovat do sociální péče o děti" # todo: NEW TRANSLATION
 HOL_invest_childcare_pvda_desc: "Zvýšení financování služeb péče o děti je zásadní pro podporu pracujících rodičů a raný rozvoj dětí. PvdA zajistí dostupnou a kvalitní péči o děti pro všechny rodiny." # todo: NEW TRANSLATION
 HOL_elderly_care: "Péče o seniory" # todo: NEW TRANSLATION
 HOL_elderly_care_desc: "Poskytování komplexních pečovatelských služeb seniorům je pro PvdA prioritou. Zajistíme, aby starší obyvatelé dostali podporu potřebnou k důstojnému a nezávislému životu, podpoříme komunitní péči i rodinné pečující." # todo: NEW TRANSLATION
 HOL_child_youth_welfare: "Blaho dětí a mládeže" # todo: NEW TRANSLATION
 HOL_child_youth_welfare_desc: "Investice do programů podporujících blaho a rozvoj dětí a mladých lidí jsou nezbytné. PvdA zajistí přístup ke vzdělání, zdravotní péči a volnočasovým aktivitám a podpoří blaho našich nejmladších občanů." # todo: NEW TRANSLATION
 HOL_social_tech_revolution: "Technologická revoluce" # todo: NEW TRANSLATION
 HOL_social_tech_revolution_desc: "Přijetí technologické revoluce je klíčové, aby se každý mohl účastnit informační společnosti. PvdA bude investovat do vzdělávání, digitální infrastruktury a iniciativ překonávajících digitální propast a podpoří technologické inovace a inkluzi." # todo: NEW TRANSLATION
 HOL_green_urban_development: "Zelený rozvoj měst" # todo: NEW TRANSLATION
 HOL_green_urban_development_desc: "Podpora udržitelného rozvoje měst, který spojuje vysokou hustotu bydlení s vysokou kvalitou života, je pro PvdA prioritou. Zajistíme silná, inkluzivní a ekologická města a budeme investovat do zelené infrastruktury a veřejných prostranství." # todo: NEW TRANSLATION
 HOL_sustainable_agriculture: "Udržitelné zemědělství" # todo: NEW TRANSLATION
 HOL_sustainable_agriculture_desc: "Podpora udržitelných zemědělských postupů je zásadní pro potravinovou bezpečnost a ochranu životního prostředí. PvdA podpoří ekologické zemědělství, odpovědné využívání půdy a omezí zemědělské znečištění, aby zajistila zdravé a udržitelné potravinové zdroje." # todo: NEW TRANSLATION
 HOL_renewable_energy_investments: "Investice do obnovitelné energie" # todo: NEW TRANSLATION
 HOL_renewable_energy_investments_desc: "Rozsáhlé investice do obnovitelných zdrojů energie jsou klíčové pro snížení naší závislosti na fosilních palivech a boj proti změně klimatu. PvdA podpoří projekty solární, větrné a vodní energetiky a vybuduje udržitelnou energetickou budoucnost." # todo: NEW TRANSLATION
 HOL_new_socialist_age: "Nová éra sociální demokracie" # todo: NEW TRANSLATION
 HOL_new_socialist_age_desc: "Aby PvdA zůstala relevantní a účinná, projde proměnou, která jí umožní lépe reagovat na potřeby moderní společnosti. To zahrnuje aktualizaci politiky, zapojení nových generací a přijetí inovativních přístupů k vládnutí." # todo: NEW TRANSLATION
 HOL_New_Socialist_Age_tt: "§YNa základě vaší rovnováhy moci se objeví nový vůdce.\n Samson povede PvdA, pokud bude vaše rovnováha moci menší než -10%\n Asscher povede, pokud bude rovnováha moci mezi -10% a 10%.\n Bos povede, pokud bude větší než 10%§!" # todo: NEW TRANSLATION
 HOL_samsom: "Samsom" # todo: NEW TRANSLATION
 HOL_samsom_desc: "Diederik Samsom byl zvolen novým lídrem PvdA. Je znám svým silným postojem k životnímu prostředí a chce stranu vést k zelenější a udržitelnější budoucnosti při zachování sociální spravedlnosti a inkluze." # todo: NEW TRANSLATION
 HOL_environmental_vision: "Environmentální vize" # todo: NEW TRANSLATION
 HOL_environmental_vision_desc: "PvdA pod vedením Diederika Samsoma upřednostní environmentální udržitelnost. Zavedeme komplexní politiku na ochranu přírodních zdrojů a podporu zdravého životního prostředí pro budoucí generace." # todo: NEW TRANSLATION
 HOL_green_economy_pvda: "Zelená ekonomika" # todo: NEW TRANSLATION
 HOL_green_economy_pvda_desc: "Diederik Samsom prosazuje přechod k zelené ekonomice prostřednictvím podpory ekologických technologií a udržitelných postupů. Tím vzniknou pracovní místa, podpoří se inovace a ochrání životní prostředí." # todo: NEW TRANSLATION
 HOL_circular_economy: "Oběhové hospodářství" # todo: NEW TRANSLATION
 HOL_circular_economy_desc: "Za účelem omezení odpadu a podpory udržitelnosti vybudujeme oběhové hospodářství, které materiály znovu využívá, opravuje a recykluje. Tento přístup zajistí udržitelný výrobní cyklus a minimalizuje dopad na životní prostředí." # todo: NEW TRANSLATION
 HOL_energy_transition: "Přechod k zelené energii" # todo: NEW TRANSLATION
 HOL_energy_transition_desc: "Urychlení energetické transformace je nezbytné pro udržitelnou budoucnost. Postupně ukončíme využívání fosilních paliv, investujeme do obnovitelné energie a podpoříme inovace v oblasti skladování a účinnosti energie." # todo: NEW TRANSLATION
 HOL_digital_innovation: "Digitální inovace" # todo: NEW TRANSLATION
 HOL_digital_innovation_desc: "Podpora digitálních inovací je zásadní pro hospodářský růst a modernizaci. Podpoříme technologické startupy, investujeme do IT infrastruktury a zlepšíme digitální gramotnost, aby Nizozemsko zůstalo na špici technologického pokroku." # todo: NEW TRANSLATION
 HOL_social_justice: "Sociální spravedlnost" # todo: NEW TRANSLATION
 HOL_social_justice_desc: "Zajištění sociální spravedlnosti je ústředním bodem vize Diederika Samsoma. Budeme řešit příjmovou nerovnost, podporovat rovné příležitosti a zajistíme, aby se všichni občané mohli plně účastnit společnosti." # todo: NEW TRANSLATION
 HOL_inclusive_society_pvda: "Inkluzivní společnost" # todo: NEW TRANSLATION
 HOL_inclusive_society_pvda_desc: "Budování inkluzivní společnosti, v níž se každý cítí ceněný a respektovaný, je nezbytné. Budeme podporovat politiku rozmanitosti a inkluze ve všech oblastech života." # todo: NEW TRANSLATION
 HOL_innovation_in_education: "Sociální inovace ve vzdělávání" # todo: NEW TRANSLATION
 HOL_innovation_in_education_desc: "Modernizace vzdělávání s cílem připravit studenty na budoucnost je klíčová. Investujeme do digitálních výukových nástrojů, vzdělávání v oborech STEM a přípravy učitelů, abychom zajistili vysoce kvalitní vzdělávací systém." # todo: NEW TRANSLATION
 HOL_affordable_living: "Dostupné bydlení" # todo: NEW TRANSLATION
 HOL_affordable_living_desc: "Zajištění dostupných životních podmínek je prioritou. Budeme investovat do sociálního bydlení, regulovat trh nájemního bydlení a poskytovat dotace, aby bylo bydlení dostupné pro všechny." # todo: NEW TRANSLATION
 HOL_public_health_initiatives: "Iniciativy veřejného zdraví" # todo: NEW TRANSLATION
 HOL_public_health_initiatives_desc: "Podpora komplexních iniciativ veřejného zdraví je zásadní. Zaměříme se na preventivní péči, duševní zdraví a omezení zdravotních nerovností, aby měl každý přístup ke kvalitní zdravotní péči." # todo: NEW TRANSLATION
 HOL_fusion_groenlinks: "Sjednotit se s GroenLinks" # todo: NEW TRANSLATION
 HOL_fusion_groenlinks_desc: "Nastal čas, aby Labouristická strana a GroenLinks pod vedením Franse Timmermanse spojily své síly. Sloučením společných hodnot a progresivních vizí vytvoříme jednotnou frontu prosazující opatření v oblasti klimatu, sociální rovnost a udržitelnou budoucnost Nizozemska." # todo: NEW TRANSLATION
 HOL_asscher: "Asscher" # todo: NEW TRANSLATION
 HOL_asscher_desc: "Lodewijk Asscher byl zvolen novým lídrem PvdA. Je znám zaměřením na trh práce, sociální zabezpečení a integraci a chce stranu vést k větší sociální rovnosti a ekonomické odolnosti." # todo: NEW TRANSLATION
 HOL_labour_market_reforms: "Reformy trhu práce" # todo: NEW TRANSLATION
 HOL_labour_market_reforms_desc: "Lodewijk Asscher usiluje o vytvoření inkluzivního trhu práce. Podpoříme programy odborné přípravy, budeme bojovat proti diskriminaci a zajistíme spravedlivé mzdy pro všechny pracovníky." # todo: NEW TRANSLATION
 HOL_integration_policies: "Integrační politika" # todo: NEW TRANSLATION
 HOL_integration_policies_desc: "Podpora účinné integrační politiky je klíčem k budování soudržné společnosti. Asscher podporuje iniciativy usnadňující integraci přistěhovalců a uprchlíků do nizozemské společnosti." # todo: NEW TRANSLATION
 HOL_workplace_equality: "Rovnost na pracovišti" # todo: NEW TRANSLATION
 HOL_workplace_equality_desc: "Zajištění rovnosti na pracovišti je zásadní pro spravedlivou společnost. Asscher zavede politiku bránící diskriminaci a podporující rozmanitost na pracovišti." # todo: NEW TRANSLATION
 HOL_strengthening_social_security: "Posílení sociálního zabezpečení" # todo: NEW TRANSLATION
 HOL_strengthening_social_security_desc: "Robustní systém sociálního zabezpečení je klíčový. Asscher zavede politiku na ochranu nejzranitelnějších a poskytování podpory v dobách nouze." # todo: NEW TRANSLATION
 HOL_child_welfare: "Blaho dětí" # todo: NEW TRANSLATION
 HOL_child_welfare_desc: "Zajištění blaha dětí je nejvyšší prioritou. Asscher prosazuje zvýšení financování programů pro děti včetně raného vzdělávání, zdravotní péče a služeb podpory rodin." # todo: NEW TRANSLATION
 HOL_social_innovation: "Sociální inovace" # todo: NEW TRANSLATION
 HOL_social_innovation_desc: "Podpora sociálních inovací je nezbytná pro řešení složitých společenských výzev. Budeme podporovat iniciativy podporující spolupráci při hledání inovativních řešení." # todo: NEW TRANSLATION
 HOL_educational_equity: "Rovnost ve vzdělávání" # todo: NEW TRANSLATION
 HOL_educational_equity_desc: "Zajištění rovnosti ve vzdělávání pro všechny studenty je zásadní. Asscher bude investovat do škol ve znevýhodněných oblastech, poskytovat další podporu studentům s potížemi a podporovat inkluzivní vzdělávání." # todo: NEW TRANSLATION
 HOL_poverty_reduction: "Snižování chudoby" # todo: NEW TRANSLATION
 HOL_poverty_reduction_desc: "Snižování chudoby je nezbytné pro spravedlivou společnost. Zavedeme komplexní programy snižování chudoby včetně zvýšení sociálních dávek a cílené podpory zranitelných skupin." # todo: NEW TRANSLATION
 HOL_digital_literacy: "Digitální gramotnost" # todo: NEW TRANSLATION
 HOL_digital_literacy_desc: "Zlepšování digitální gramotnosti je v dnešním technologickém světě klíčové. Asscher podporuje iniciativy, které zajistí, aby všichni občané měli dovednosti potřebné k úspěchu v digitální ekonomice." # todo: NEW TRANSLATION
 HOL_economic_resilience: "Ekonomická odolnost" # todo: NEW TRANSLATION
 HOL_economic_resilience_desc: "Budování ekonomické odolnosti je nezbytné pro zvládání budoucích krizí. Budeme investovat do rozmanitých hospodářských odvětví, podporovat malé podniky a vytvoříme robustní záchrannou síť pro všechny občany." # todo: NEW TRANSLATION
 HOL_labour_rights: "Pracovní práva" # todo: NEW TRANSLATION
 HOL_labour_rights_desc: "Asscher je výrazným zastáncem pracovních práv. Posílíme ochranu pracovníků, zajistíme bezpečné pracovní podmínky a podpoříme právo na kolektivní vyjednávání." # todo: NEW TRANSLATION
 HOL_sustainable_urban_development: "Udržitelný rozvoj měst" # todo: NEW TRANSLATION
 HOL_sustainable_urban_development_desc: "Podpora udržitelného rozvoje měst je klíčem k vytvoření obyvatelných měst. Budeme investovat do zelené infrastruktury, veřejných prostranství a udržitelných bytových projektů." # todo: NEW TRANSLATION
 HOL_social_housing: "Sociální bydlení" # todo: NEW TRANSLATION
 HOL_social_housing_desc: "Rozšíření sociálního bydlení je zásadní pro řešení bytové krize. Asscher bude investovat do výstavby a renovace cenově dostupných bytů a zajistí, že každý bude mít bezpečné místo k životu." # todo: NEW TRANSLATION
 HOL_bos: "Bos" # todo: NEW TRANSLATION
 HOL_bos_desc: "Wouter Bos byl zvolen novým lídrem PvdA. Je znám svými ekonomickými znalostmi a působením během finanční krize a chce stranu vést k ekonomické stabilitě a růstu při zachování sociální spravedlnosti." # todo: NEW TRANSLATION
 HOL_economic_expertise: "Ekonomické znalosti" # todo: NEW TRANSLATION
 HOL_economic_expertise_desc: "Wouter Bos je proslulý svými ekonomickými znalostmi. Pod jeho vedením se PvdA zaměří na provádění zdravé hospodářské politiky, která zajistí stabilitu a podpoří udržitelný růst." # todo: NEW TRANSLATION
 HOL_crisis_management: "Řízení krizí" # todo: NEW TRANSLATION
 HOL_crisis_management_desc: "Zkušenosti Woutera Bose s řízením finančních krizí jsou neocenitelné. Zavedeme robustní opatření, aby ekonomika zůstala odolná tváří v tvář globálním výzvám." # todo: NEW TRANSLATION
 HOL_financial_sector_reform: "Reforma finančního sektoru" # todo: NEW TRANSLATION
 HOL_financial_sector_reform_desc: "Komplexní reformy finančního sektoru jsou nezbytné pro předcházení budoucím krizím a podporu transparentnosti a odpovědnosti. Wouter Bos povede úsilí o účinnou regulaci finančního průmyslu." # todo: NEW TRANSLATION
 HOL_progressive_taxation: "Progresivní zdanění" # todo: NEW TRANSLATION
 HOL_progressive_taxation_desc: "Zavedení spravedlivého a progresivního daňového systému je klíčem ke snížení nerovnosti a získání prostředků pro veřejné služby. PvdA pod Bosovým vedením zajistí, aby nejbohatší platili spravedlivý podíl." # todo: NEW TRANSLATION
 HOL_affordable_housing: "Dostupné bydlení" # todo: NEW TRANSLATION
 HOL_affordable_housing_desc: "Wouter Bos podporuje politiku zvyšující dostupnost cenově dostupného bydlení jako řešení bytové krize. Budeme investovat do sociálního bydlení a poskytovat dotace, aby se vlastnictví domu stalo dostupným pro všechny." # todo: NEW TRANSLATION
 HOL_employment_opportunities: "Pracovní příležitosti" # todo: NEW TRANSLATION
 HOL_employment_opportunities_desc: "Zajištění dostatku pracovních příležitostí je pro Woutera Bose rovněž nejvyšší prioritou. Stabilní a rozvíjející se společnost můžeme vybudovat pouze tehdy, zajistíme-li lidem zaměstnání." # todo: NEW TRANSLATION
 HOL_universal_healthcare: "Univerzální zdravotní péče" # todo: NEW TRANSLATION
 HOL_universal_healthcare_desc: "Zajištění přístupu všech ke kvalitní zdravotní péči je pro Woutera Bose prioritou. Rozšíříme veřejné zdravotnické služby, zkrátíme čekací doby a zajistíme dostupnost zdravotní péče pro všechny." # todo: NEW TRANSLATION
 HOL_fiscal_responsibility: "Fiskální odpovědnost" # todo: NEW TRANSLATION
 HOL_fiscal_responsibility_desc: "Wouter Bos se zavazuje udržovat vyrovnaný rozpočet a zároveň zajistit dostatečné financování základních veřejných služeb. Zodpovědnou fiskální politikou zajistíme stabilitu a udržitelnost nizozemské ekonomiky pro budoucí generace." # todo: NEW TRANSLATION
 HOL_green_economic_growth: "Zelený hospodářský růst" # todo: NEW TRANSLATION
 HOL_green_economic_growth_desc: "Wouter Bos bude prosazovat hospodářskou politiku zaměřenou na zelený a udržitelný růst, aby zajistil dlouhodobou prosperitu. Budeme investovat do čisté energie, zelených pracovních míst a ekologické infrastruktury, připravíme ekonomiku na budoucnost a budeme bojovat proti změně klimatu." # todo: NEW TRANSLATION
 HOL_debt_relief_programs: "Programy oddlužení" # todo: NEW TRANSLATION
 HOL_debt_relief_programs_desc: "Wouter Bos zavede programy oddlužení jednotlivců a malých podniků, aby zmírnil finanční zátěž zranitelných skupin. Tím posílí domácnosti a podnikatele v potížích a podpoří větší ekonomickou mobilitu a stabilitu." # todo: NEW TRANSLATION
 HOL_strengthening_eurozone: "Posílení eurozóny" # todo: NEW TRANSLATION
 HOL_strengthening_eurozone_desc: "Wouter Bos si uvědomuje význam silné a odolné eurozóny pro stabilitu nizozemské ekonomiky. Vedením úsilí o posílení eurozóny podpoříme fiskální koordinaci a hospodářskou spolupráci v rámci EU a zajistíme dlouhodobou prosperitu." # todo: NEW TRANSLATION
 HOL_small_business_support: "Podpora malých podniků" # todo: NEW TRANSLATION
 HOL_small_business_support_desc: "Podpora malých podniků je klíčem k prosperující ekonomice. Wouter Bos zavede politiku snižující daně malým firmám, usnadňující přístup k úvěrům a omezující byrokratické překážky, aby malé podniky mohly růst a vytvářet pracovní místa." # todo: NEW TRANSLATION
 HOL_lpf: "Noc Pima Fortuyna" # todo: NEW TRANSLATION
 HOL_lpf_desc: "Lijst Pim Fortuyn (LPF) vznikla s cílem prolomit politický status quo. Pod vedením Pima Fortuyna prosazuje LPF hodnoty národní suverenity, zákona a pořádku a hrdé, sebevědomé nizozemské společnosti. Toto hnutí zpochybní zakořeněné politické elity a bude prosazovat odvážné reformy, které postaví Nizozemsko na první místo." # todo: NEW TRANSLATION
 HOL_direct_democracy: "Přímá demokracie" # todo: NEW TRANSLATION
 HOL_direct_democracy_desc: "LPF věří ve posílení lidí prostřednictvím přímé demokracie. Prosazením více rozhodovacích procesů řízených občany zajistíme, že vládní politika bude úzce odpovídat vůli veřejnosti." # todo: NEW TRANSLATION
 HOL_senate_reform: "Reforma Senátu" # todo: NEW TRANSLATION
 HOL_senate_reform_desc: "Senát se stal zkostnatělou institucí. Reforma umožní zefektivnit legislativní procesy a zajistí, že Senát bude skutečně sloužit lidem, nikoliv zakořeněným zájmům." # todo: NEW TRANSLATION
 HOL_end_party_kartel: "Konec stranického kartelu" # todo: NEW TRANSLATION
 HOL_end_party_kartel_desc: "LPF rozloží zavedený kartel politických stran, který po léta dominuje nizozemské politice. Otevření politického systému přinese nové nápady a hlasy do řízení naší země." # todo: NEW TRANSLATION
 HOL_referenda: "Více referend" # todo: NEW TRANSLATION
 HOL_referenda_desc: "LPF bude usilovat o zvýšení počtu referend, aby občané měli přímou možnost rozhodovat o zásadních otázkách. Tento závazek k přímé demokracii zajistí, že hlas lidu bude slyšet a respektován." # todo: NEW TRANSLATION
 HOL_limit_senate_power: "Omezit moc Senátu" # todo: NEW TRANSLATION
 HOL_limit_senate_power_desc: "LPF si klade za cíl omezit moc Senátu a omezit jeho veto vůči pokrokové legislativě. To umožní naší demokracii fungovat efektivněji a bez překážek." # todo: NEW TRANSLATION
 HOL_public_sector_reform: "Reforma veřejného sektoru" # todo: NEW TRANSLATION
 HOL_public_sector_reform_desc: "Nizozemský veřejný sektor se stal zatížen neefektivitou a plýtváním. LPF přeorganizuje vládní instituce, zefektivní provoz a zajistí efektivní služby a odpovědné využívání prostředků daňových poplatníků." # todo: NEW TRANSLATION
 HOL_support_sme: "Podpora malých a středních podniků" # todo: NEW TRANSLATION
 HOL_support_sme_desc: "Malé a střední podniky jsou páteří nizozemské ekonomiky. LPF omezí regulace a nabídne podporu malým a středním podnikům, aby mohly prosperovat a podporovat hospodářský růst." # todo: NEW TRANSLATION
 HOL_cut_business_taxes: "Snížení daní z podnikání" # todo: NEW TRANSLATION
 HOL_cut_business_taxes_desc: "Aby se podpořilo konkurenční podnikatelské prostředí, LPF sníží daně nizozemským podnikům. Tato redukce podpoří investice, podpoří růst a vytvoří více pracovních příležitostí." # todo: NEW TRANSLATION
 HOL_labor_market_liberalization: "Liberalizace trhu práce" # todo: NEW TRANSLATION
 HOL_labor_market_liberalization_desc: "Aby byl nizozemský trh práce flexibilnější, LPF zavede liberalizační opatření. Tyto reformy sníží regulační překážky, usnadní najímání pro podniky a umožní zaměstnancům větší flexibilitu." # todo: NEW TRANSLATION
 HOL_welfare_reform: "Reforma sociálního státu" # todo: NEW TRANSLATION
 HOL_welfare_reform_desc: "Pim Fortuyn považoval nizozemský sociální stát za nafouknutý a neudržitelný. LPF zreformuje sociální systém, zaměří se na snížení závislosti a podporu osobní zodpovědnosti a zároveň zachová pomoc pro ty, kteří ji skutečně potřebují." # todo: NEW TRANSLATION
 HOL_counter_terrorism_efforts: "Boj proti terorismu" # todo: NEW TRANSLATION
 HOL_counter_terrorism_efforts_desc: "Nizozemská společnost se stala stále nebezpečnější kvůli laxnímu prosazování práva. LPF posílí policii, zavedou přísnější tresty za násilné trestné činy a zajistí, že nizozemští občané se mohou znovu cítit bezpečně ve své zemi." # todo: NEW TRANSLATION
 HOL_more_police_force: "Posílení policejních sil" # todo: NEW TRANSLATION
 HOL_more_police_force_desc: "LPF věří, že silná policejní přítomnost je nezbytná pro udržení veřejného pořádku a bezpečnosti. Rozšířením policejních sil a poskytnutím dalších zdrojů zajistíme, že policie bude moci efektivně chránit nizozemské občany." # todo: NEW TRANSLATION
 HOL_promote_dutch_values: "Podporovat nizozemské hodnoty" # todo: NEW TRANSLATION
 HOL_promote_dutch_values_desc: "LPF i PVV věří, že nizozemské hodnoty jsou základem silné, soudržné společnosti. Budeme pracovat na podpoře a zachování těchto hodnot, aby nizozemská kultura zůstala ústřední v našem veřejném životě a národní identitě." # todo: NEW TRANSLATION
 HOL_support_dutch_agriculture: "Podpora nizozemského zemědělství" # todo: NEW TRANSLATION
 HOL_support_dutch_agriculture_desc: "Nizozemské zemědělství je pilířem naší ekonomiky a kulturního dědictví. Podporou místních farmářů a venkovských komunit posílíme naši potravinovou bezpečnost a podpoříme udržitelné praktiky zakořeněné v tradici." # todo: NEW TRANSLATION
 HOL_made_in_holland: "Vyrobeno v Holandsku" # todo: NEW TRANSLATION
 HOL_made_in_holland_desc: "Budeme propagovat výrobky vyrobené v Nizozemsku a vybízet spotřebitele k nákupu místně vyráběných výrobků. Díky upřednostnění nizozemských odvětví podpoříme naši ekonomiku a posílíme závazek k nizozemské kvalitě." # todo: NEW TRANSLATION
 HOL_family_business_support: "Podpora rodinných podniků" # todo: NEW TRANSLATION
 HOL_family_business_support_desc: "Rodinné podniky jsou nedílnou součástí nizozemské společnosti a tvoří páteř naší ekonomiky. Budeme poskytovat podporu, aby tyto podniky nadále prosperovaly a zůstaly konkurenceschopné na globálním trhu." # todo: NEW TRANSLATION
 HOL_internet_freedom: "Chránit svobodu internetu" # todo: NEW TRANSLATION
 HOL_internet_freedom_desc: "Svoboda projevu online musí být zachována. Budeme chránit práva občanů na volný přístup k informacím a jejich sdílení a odolávat jakékoli formě cenzury či kontroly digitálního prostoru." # todo: NEW TRANSLATION
 HOL_cut_down_government: "Zmenšit vládu" # todo: NEW TRANSLATION
 HOL_cut_down_government_desc: "Vláda byrokracie se stala přerostlou a neefektivní. Budeme usilovat o snížení zbytečného administrativního zatížení, zefektivnění vládních funkcí a zajištění, že peníze daňových poplatníků budou vynakládány moudře." # todo: NEW TRANSLATION
 HOL_cut_leftist_groups: "Snížení dotací levicovým skupinám" # todo: NEW TRANSLATION
 HOL_cut_leftist_groups_desc: "Levicové skupiny dlouho spoléhají na veřejné finance k prosazování svých agend. Snížením dotací těmto skupinám zajistíme, že daňové prostředky budou sloužit iniciativám, které prospívají většině nizozemských občanů." # todo: NEW TRANSLATION
 HOL_forced_work: "Zavést nucenou práci pro nezaměstnané" # todo: NEW TRANSLATION
 HOL_forced_work_desc: "Aby se snížila závislost na sociálních dávkách, zavedeme opatření, která zajistí, že ti, kdo pobírají státní podporu, budou přispívat zpět společnosti, čímž podpoříme samostatnost a produktivitu." # todo: NEW TRANSLATION
 HOL_downgrade_prisons: "Zhoršit podmínky ve věznicích" # todo: NEW TRANSLATION
 HOL_downgrade_prisons_desc: "Věznice by měly být místem rehabilitace, nikoli pohodlí. Budeme omezovat luxus ve věznicích a zaměříme se na to, aby byly místem, kde pachatelé vykonávají tresty a učí se zodpovědnosti." # todo: NEW TRANSLATION
 HOL_dutch_citizens_first: "Nizozemští občané na prvním místě" # todo: NEW TRANSLATION
 HOL_dutch_citizens_first_desc: "Věříme, že veškerá politická rozhodnutí by měla upřednostňovat potřeby nizozemských občanů. Ať už v oblasti zdravotnictví, bydlení nebo zaměstnanosti, naším cílem je dávat přednost nizozemskému obyvatelstvu." # todo: NEW TRANSLATION
 HOL_dutch_healthcare_first: "Nizozemské zdravotnictví pro nizozemské občany na prvním místě" # todo: NEW TRANSLATION
 HOL_dutch_healthcare_first_desc: "Zdravotnické zdroje by měly primárně sloužit nizozemským občanům. Zajistíme, aby nizozemští občané měli prioritu při přístupu k lékařským službám, posílili veřejné zdraví a snížili zátěž systému." # todo: NEW TRANSLATION
 HOL_reject_dual_nationality: "Odmítnout dvojí občanství" # todo: NEW TRANSLATION
 HOL_reject_dual_nationality_desc: "Abychom posílili loajalitu k Nizozemsku, omezíme dvojí občanství. Tato politika podpoří silnější závazek k nizozemské identitě a národním hodnotám." # todo: NEW TRANSLATION
 HOL_national_identity_first: "Národní identita na prvním místě" # todo: NEW TRANSLATION
 HOL_national_identity_first_desc: "Věříme, že silný pocit národní identity je klíčový pro sjednocenou společnost. Upřednostněním nizozemské kultury zajistíme, aby budoucí generace vyrůstaly s hlubokým pocitem hrdosti a sounáležitosti." # todo: NEW TRANSLATION
 HOL_limit_foreign_influence: "Omezit zahraniční vliv" # todo: NEW TRANSLATION
 HOL_limit_foreign_influence_desc: "Zahraniční vliv pronikl do nizozemské společnosti a ovlivňuje naši ekonomiku, média a politiku. Zavedeme opatření k jeho omezení, aby zájmy Nizozemska byly na prvním místě." # todo: NEW TRANSLATION
 HOL_remove_windmills_solar_parks: "Odstranit větrné mlýny a solární parky" # todo: NEW TRANSLATION
 HOL_remove_windmills_solar_parks_desc: "Zatímco obnovitelná energie je důležitá, větrné mlýny a solární parky narušují nizozemskou krajinu. Zaměříme se na alternativní energetická řešení, která udrží krásu našeho venkova." # todo: NEW TRANSLATION
 HOL_boost_housing_construction: "Podpora výstavby bytů" # todo: NEW TRANSLATION
 HOL_boost_housing_construction_desc: "Nizozemská bytová krize vyžaduje akci. Investujeme do výstavby bytů, abychom zajistili cenově dostupné domovy nizozemským občanům, řešili nedostatek a podpořili rodinný život." # todo: NEW TRANSLATION
 HOL_stop_mass_immigration: "Zastavit masovou imigraci" # todo: NEW TRANSLATION
 HOL_stop_mass_immigration_desc: "Nekontrolovaná imigrace zatěžuje veřejné služby a nizozemskou kulturu. Budeme prosazovat politiky omezující imigraci a zaměříme zdroje na potřeby nizozemských občanů." # todo: NEW TRANSLATION
 HOL_defund_international_aid: "Omezit financování mezinárodní pomoci" # todo: NEW TRANSLATION
 HOL_defund_international_aid_desc: "Nizozemsko musí upřednostnit své vlastní občany. Snížíme výdaje na mezinárodní pomoc a zaměříme se na řešení problémů na našem vlastním území." # todo: NEW TRANSLATION
 HOL_restrict_asylum_seekers: "Omezení žadatelů o azyl" # todo: NEW TRANSLATION
 HOL_restrict_asylum_seekers_desc: "Nizozemsko nemůže nadále nést zátěž vysokého počtu žadatelů o azyl. Zavedeme přísná kritéria pro řízení a snížení počtu přijímaných žadatelů o azyl." # todo: NEW TRANSLATION
 HOL_restore_border_control: "Obnovit hraniční kontrolu" # todo: NEW TRANSLATION
 HOL_restore_border_control_desc: "Zabezpečení nizozemských hranic je klíčové pro zachování suverenity a bezpečnosti. Znovuzavádíme plnou hraniční kontrolu, abychom řídili, kdo vstupuje a opouští naši zemi." # todo: NEW TRANSLATION
 HOL_strengthening_police_power: "Posílit pravomoci policie" # todo: NEW TRANSLATION
 HOL_strengthening_police_power_desc: "Aby byla veřejná bezpečnost zajištěna, musíme posílit policii nástroji a pravomocemi nezbytnými k efektivnímu boji se zločinem." # todo: NEW TRANSLATION
 HOL_celebrate_dutch_heroes: "Oslavovat nizozemské hrdiny" # todo: NEW TRANSLATION
 HOL_celebrate_dutch_heroes_desc: "Od průzkumníků po umělce, nizozemští hrdinové ztělesňují naše národní hodnoty a historii. Budeme propagovat úspěchy nizozemských osobností, abychom inspirovali hrdost na naše dědictví." # todo: NEW TRANSLATION
 HOL_protect_zwarte_piet: "Chraňte tradici Zwarte Piet" # todo: NEW TRANSLATION
 HOL_protect_zwarte_piet_desc: "Tradice Zwarte Piet je součástí nizozemského dědictví. Budeme ji chránit před odporem a zajistíme, že naše kulturní zvyky zůstanou nedotčeny." # todo: NEW TRANSLATION
 HOL_fatherland_education: "Vlastenecké vzdělávání" # todo: NEW TRANSLATION
 HOL_fatherland_education_desc: "Silný vzdělávací základ v nizozemské historii a hodnotách je klíčem k výchově informovaných, hrdých občanů. Budeme investovat do programů, které tyto témata zdůrazní ve školách." # todo: NEW TRANSLATION
 HOL_pro_gay_anti_lgbtq: "Pro-gay, proti LGBTQ+" # todo: NEW TRANSLATION
 HOL_pro_gay_anti_lgbtq_desc: "Dlouhodobě byl Nizozemsko průkopníkem osobních svobod, zavedlo právní rovnost pro páry stejného pohlaví a pracovalo na ochraně občanů před diskriminací na základě sexuální orientace. Nicméně rostoucí veřejná skepsi vůči LGBTQ+ trendům vedla k kulturnímu odporu. Posílením našeho závazku k jádrovým liberálním hodnotám a distancováním se od woke kultury a LGBTQ+ snah chceme zachovat společnost zakořeněnou v osobní svobodě a sociální stabilitě." # todo: NEW TRANSLATION
 HOL_pro_gay_anti_lgbtq_tt: "Efekty se projeví, pokud budeme mít postoj k §YLGBTQ§!" # todo: NEW TRANSLATION
 HOL_push_for_nexit: "Prosazování Nexit" # todo: NEW TRANSLATION
 HOL_push_for_nexit_desc: "Nexit – Nizozemsko opouštějící EU – je ústředním cílem PVV. Spustíme proces opuštění Evropské unie, znovuzískáme plnou suverenitu nad našimi zákony, hranicemi a ekonomikou a chráníme nizozemský způsob života před nadměrným zasahováním Bruselu." # todo: NEW TRANSLATION
 HOL_bring_back_the_gulden: "Návrat guldenu" # todo: NEW TRANSLATION
 HOL_bring_back_the_gulden_desc: "Euro selhalo Nizozemsku, a PVV vrátí nizozemský gulden (gulden), aby obnovil naši ekonomickou nezávislost. Kontrolou naší měny budeme lépe řídit inflaci a hospodářský růst." # todo: NEW TRANSLATION
 HOL_defend_israel_rights: "Bránit Izraeli právo na existenci" # todo: NEW TRANSLATION
 HOL_defend_israel_rights_desc: "Izrael je klíčovým spojencem v boji proti islámskému extremismu. PVV bude bránit Izraeli právo na existenci a podporovat jeho snahy o zajištění svých hranic, aby Izrael zůstal silným a nezávislým státem na Blízkém východě." # todo: NEW TRANSLATION
 HOL_counter_terrorism_israel: "Proti terorismu ve spolupráci s Izraelem" # todo: NEW TRANSLATION
 HOL_counter_terrorism_israel_desc: "PVV bude úzce spolupracovat s Izraelem a dalšími spojenci na potírání terorismu, zejména islámského extremismu. Sdílením zpravodajských informací a spoluprací na bezpečnostních opatřeních bude Nizozemsko lépe vybaveno k ochraně svých občanů." # todo: NEW TRANSLATION
 HOL_joint_antiiran_stance: "Připojit se k antiíránskému postoji" # todo: NEW TRANSLATION
 HOL_joint_antiiran_stance_desc: "Írán představuje rostoucí hrozbu pro bezpečnost Blízkého východu a západních zájmů. PVV se připojí k mezinárodním snahám o odpor proti Íránovým expanzivním politikám a jeho snaze o získání jaderných zbraní." # todo: NEW TRANSLATION
 HOL_increase_corporation_vlaanderen: "Zvýšit spolupráci s Vlaanderen" # todo: NEW TRANSLATION
 HOL_increase_corporation_vlaanderen_desc: "§Y[FLN.GetNameWithFlag]§! sdílí hluboké kulturní a jazykové pouto s §Y[HOLGetNameWithFlag]§!. PVV zvýší hospodářskou a politickou spolupráci s Vlaanderen, posílí vazby mezi nizozemsky mluvícími obyvateli." # todo: NEW TRANSLATION
 HOL_increase_corporation_vlaanderen_tt: "§YDecisions§! odemkne §Y[HOL.GetAdjectiveCap]§! integraci s §Y[FLN.GetNameWithFlag]§!" # todo: NEW TRANSLATION
 HOL_support_independent_vlaanderen: "Podpora nezávislosti Vlaanderen" # todo: NEW TRANSLATION
 HOL_support_independent_vlaanderen_desc: "PVV podporuje nezávislost Vlaanderen, která regionu umožní odtrhnout se od §Y[BEL.GetNameWithFlag]§! a posílit jeho vazby s Nizozemskem. Svobodný Vlaanderen se stane silným spojencem v obraně nizozemské identity." # todo: NEW TRANSLATION
 HOL_economic_partnership_vlaanderen: "Ekonomické partnerství s Vlaanderen" # todo: NEW TRANSLATION
 HOL_economic_partnership_vlaanderen_desc: "PVV bude rozvíjet ekonomické partnerství s Vlaanderen, podpoří obchod a investice mezi našimi dvěma regiony. Toto partnerství bude prospěšné pro nizozemské i vlámské občany." # todo: NEW TRANSLATION
 HOL_cultural_unification_vlaanderen: "Kulturní sjednocení s Vlaanderen" # todo: NEW TRANSLATION
 HOL_cultural_unification_vlaanderen_desc: "PVV podporuje sjednocení nizozemských a vlámských kultur, čímž vytváří společný kulturní prostor pro nizozemsky mluvící lidi. To posílí vazby mezi Nizozemskem a Vlaanderen a podpoří pocit sdílené identity." # todo: NEW TRANSLATION
 HOL_ties_with_afrikaans: "Posílit vazby s Afrikaans" # todo: NEW TRANSLATION
 HOL_ties_with_afrikaans_desc: "Afrikaans, jazyk s kořeny v nizozemštině, spojuje Nizozemsko se Jihoafrickou republikou. PVV posílí kulturní a hospodářské vazby s afrikánskou komunitou, podporuje sdílené dědictví a spolupráci mezi našimi národy." # todo: NEW TRANSLATION
 HOL_defend_afrikaans_rights: "Chránit afrikánská kulturní práva" # todo: NEW TRANSLATION
 HOL_defend_afrikaans_rights_desc: "Afrikánština je v Jihoafrické republice ohrožena a PVV bude chránit kulturní práva Afrikanerů. Podpořením škol a institucí v Afrikaans zachováme tento jazyk a jeho vazby na nizozemské dědictví." # todo: NEW TRANSLATION
 HOL_economic_coorporation_afrikaners: "Ekonomická spolupráce s Afrikanery" # todo: NEW TRANSLATION
 HOL_economic_coorporation_afrikaners_desc: "Afrikaners v Jihoafrické republice sdílí hluboké kulturní a jazykové spojení s Nizozemci. PVV bude podporovat ekonomickou spolupráci s afrikánskými podniky, zajišťující vzájemný růst a rozvoj mezi našimi národy." # todo: NEW TRANSLATION
 HOL_criminalize_islamic_symbols: "Zakázat islámské symboly" # todo: NEW TRANSLATION
 HOL_criminalize_islamic_symbols_desc: "PVV zakáže islámské symboly, jako je burka a šátek na veřejných prostranstvích. Tyto symboly představují odmítnutí integrace do nizozemské společnosti, a jejich odstraněním posílíme národní jednotu a posílíme nizozemský sekularismus." # todo: NEW TRANSLATION
 HOL_ban_quaran: "Zakázat Korán" # todo: NEW TRANSLATION
 HOL_ban_quaran_desc: "Korán je PVV vnímán jako hrozba pro nizozemské hodnoty a kulturu. Učiníme odvážný krok a zakážeme tento text v Nizozemsku, omezíme jeho šíření a vliv na naši společnost, abychom uchovali naši národní identitu." # todo: NEW TRANSLATION
 HOL_ban_islamic_schools: "Zakázat islámské školy" # todo: NEW TRANSLATION
 HOL_ban_islamic_schools_desc: "Islámské školy v Nizozemsku podporují odloučení a neintegaci do nizozemské společnosti. PVV je uzavře, aby byly všechny děti vzdělávány v rámci nizozemského sekulárního systému, bez náboženské indoktrinace." # todo: NEW TRANSLATION
 HOL_close_mosques: "Uzavřít všechny mešity" # todo: NEW TRANSLATION
 HOL_close_mosques_desc: "Mešity jsou považovány za centra radikalizace a anti-západní ideologie. PVV uzavře všechny mešity v Nizozemsku, tím omezí hlavní zdroj islámského extremismu a zajistí nizozemské hodnoty a bezpečnost v procesu." # todo: NEW TRANSLATION
 HOL_pvv: "Wildersův vstup na politickou scénu" # todo: NEW TRANSLATION
 HOL_pvv_desc: "Strana pro svobodu neboli PVV, založená Geertem Wildersem, prosazuje politiku upřednostňující nizozemskou suverenitu, ochranu kultury a bezpečnost. PVV chce omezit imigraci, obnovit národní hrdost a zpochybnit vliv EU, aby Nizozemsko zůstalo bezpečným a prosperujícím domovem svých občanů. Se zaměřením na odpor proti islámskému extremismu a ochranu tradičních hodnot vystupuje PVV jako hlas nizozemské identity a nezávislosti." # todo: NEW TRANSLATION
 HOL_restore_royal_authority: "Obnovit královskou autoritu" # todo: NEW TRANSLATION
 HOL_restore_royal_authority_desc: "Monarchie musí znovu potvrdit svou autoritu jakožto páteř nizozemské správy. Konsolidací moci zajistí Koruna stabilitu a jednotu národa." # todo: NEW TRANSLATION
 HOL_establish_stadtholderate: "Zřídit místodržitelství" # todo: NEW TRANSLATION
 HOL_establish_stadtholderate_desc: "Moderní místodržitelství umožní vyvážený přístup k vládnutí, zajistí demokratickou odpovědnost a zároveň zachová vedoucí vliv monarchie." # todo: NEW TRANSLATION
 HOL_strengthening_the_states_general: "Posílení Státního sněmu" # todo: NEW TRANSLATION
 HOL_strengthening_the_states_general_desc: "Státní sněm bude sloužit jako pilíř Stadtholderátu, zajišťovat zastoupení pro všechny provincie a regiony a zajišťovat vyvážené vládnutí a odpovědnost." # todo: NEW TRANSLATION
 HOL_constitutional_oversight_committee: "Ústavní dohledová komise" # todo: NEW TRANSLATION
 HOL_constitutional_oversight_committee_desc: "Založte vyhrazenou komisi, která zajistí, že všechna vládní rozhodnutí budou v souladu s vizí koruny, čímž podpoří transparentnost a odpovědnost." # todo: NEW TRANSLATION
 HOL_empowering_local_governments: "Posílení místních vlád" # todo: NEW TRANSLATION
 HOL_empowering_local_governments_desc: "Poskytnutím větší autonomie místním vládám zajistíme, že každá provincie bude efektivně přispívat k vizi koruny pro jednotné Nizozemsko." # todo: NEW TRANSLATION
 HOL_promoting_dutch_enterprise: "Podpora nizozemských podniků" # todo: NEW TRANSLATION
 HOL_promoting_dutch_enterprise_desc: "Podpora nizozemských podniků daňovými pobídkami a snížením byrokracie, podporující inovace a hospodářský růst." # todo: NEW TRANSLATION
 HOL_support_small_businesses: "Podpora malých podniků" # todo: NEW TRANSLATION
 HOL_support_small_businesses_desc: "Malé podniky jsou páteří naší ekonomiky. Poskytnutím zdrojů a příležitostí, které potřebují, zajistíme prosperující Nizozemsko." # todo: NEW TRANSLATION
 HOL_balanced_trade_policies: "Vyvážené obchodní politiky" # todo: NEW TRANSLATION
 HOL_balanced_trade_policies_desc: "Zavádějte obchodní politiky, které chrání nizozemské průmysly a zároveň podporují strategická partnerství pro posílení naší ekonomiky." # todo: NEW TRANSLATION
 HOL_balanced_trade_policies_tt: "§GMáme již smíšenou obchodní politiku! Toto zaměření bude obejito§!" # todo: NEW TRANSLATION
 HOL_education_workforce_development: "Vzdělávání a rozvoj pracovní síly" # todo: NEW TRANSLATION
 HOL_education_workforce_development_desc: "Investujte do vzdělávání a programů rozvoje pracovní síly, abychom zajistili, že nizozemská populace bude připravena na výzvy moderní ekonomiky." # todo: NEW TRANSLATION
 HOL_infrastructure_for_the_future: "Infrastruktura pro budoucnost" # todo: NEW TRANSLATION
 HOL_infrastructure_for_the_future_desc: "Budujte vyspělou infrastrukturu po celém Nizozemsku, se zaměřením na dopravu, propojení a modernizaci měst." # todo: NEW TRANSLATION
 HOL_guardian_of_dutch_liberty: "Strážce nizozemské svobody" # todo: NEW TRANSLATION
 HOL_guardian_of_dutch_liberty_desc: "Monarchie bude symbolem svobody a jednoty, která bude hájit nizozemské hodnoty a zajistí svobodu pro všechny občany." # todo: NEW TRANSLATION
 HOL_restore_royal_privileges: "Obnovit královská privilegia" # todo: NEW TRANSLATION
 HOL_restore_royal_privileges_desc: "Obnovíme historická privilegia monarchie, zajistíme stabilitu a ochráníme tradice a hodnoty národa." # todo: NEW TRANSLATION
 HOL_centralized_governance: "Centralizované řízení" # todo: NEW TRANSLATION
 HOL_centralized_governance_desc: "Centralizujte řízení pod autoritou koruny, aby byla rozhodnutí činěna v zájmu jednoty a stability země." # todo: NEW TRANSLATION
 HOL_royal_economic_control: "Královská ekonomická kontrola" # todo: NEW TRANSLATION
 HOL_royal_economic_control_desc: "Monarchie převezme přímou kontrolu nad klíčovými ekonomickými sektory, aby zajistila národní bezpečnost a udržitelný růst." # todo: NEW TRANSLATION
 HOL_restore_nobility_influence: "Obnovit vliv šlechty" # todo: NEW TRANSLATION
 HOL_restore_nobility_influence_desc: "Znovu začlenit šlechtu do vlivných pozic, čímž vytvoříme loajální základnu pro monarchii a posílíme tradiční struktury." # todo: NEW TRANSLATION
 HOL_royal_patronage_of_culture: "Královská patronace kultury" # todo: NEW TRANSLATION
 HOL_royal_patronage_of_culture_desc: "Podporovat nizozemské umění a kulturu prostřednictvím královské patronáže, podporující sjednocení a hrdost na naše společné dědictví." # todo: NEW TRANSLATION
 HOL_royal_decree_for_heavy_industry: "Královský dekret pro těžký průmysl" # todo: NEW TRANSLATION
 HOL_royal_decree_for_heavy_industry_desc: "Vydat královský dekret k upřednostnění a rozšíření těžkého průmyslu, čímž zajistíme, že Nizozemsko se stane významnou průmyslovou mocností." # todo: NEW TRANSLATION
 HOL_royal_decree_for_naval_industry: "Královský dekret pro námořní průmysl" # todo: NEW TRANSLATION
 HOL_royal_decree_for_naval_industry_desc: "Monarchie se zaměří na posílení námořní produkce, zajištění námořní dominance a obchodních cest." # todo: NEW TRANSLATION
 HOL_royal_degree_industry_promotion: "Královský dekret na podporu průmyslu" # todo: NEW TRANSLATION
 HOL_royal_degree_industry_promotion_desc: "Podporovat nizozemský průmysl prostřednictvím královských nařízení, podporujících inovace a zajišťujících hospodářskou prosperitu." # todo: NEW TRANSLATION
 HOL_nobility_backed_military: "Vojenské síly podporované šlechtou" # todo: NEW TRANSLATION
 HOL_nobility_backed_military_desc: "Posílit armádu zapojením loajální šlechty do vedoucích pozic, čímž zajistíme jejich oddanost obraně monarchie." # todo: NEW TRANSLATION
 HOL_royal_control_of_trade: "Královská kontrola obchodu" # todo: NEW TRANSLATION
 HOL_royal_control_of_trade_desc: "Monarchie bude dohlížet na veškerý zahraniční obchod, upřednostňovat nizozemské zájmy a snižovat závislost na zahraničních mocnostech." # todo: NEW TRANSLATION
 HOL_royal_influence_church: "Obnovení protestantské nadřazenosti" # todo: NEW TRANSLATION
 HOL_royal_influence_church_desc: "Pod obnovenou silou monarchie koruna znovu uplatní svou autoritu nad státními institucemi a zruší velkou část pluralistického vlivu. Protestantská církev bude povýšena blíže k její bývalé centrální roli ve veřejném životě, určující normy, vzdělání a právo." # todo: NEW TRANSLATION
 HOL_legacy_of_the_crown: "Odkaz koruny" # todo: NEW TRANSLATION
 HOL_legacy_of_the_crown_desc: "Odkaz koruny bude upevněn jako síla jednoty, stability a pokroku, čímž zajistíme, že Nizozemsko zůstane majákem síly a prosperity." # todo: NEW TRANSLATION
 HOL_dynastic_claims: "Uplatnit dynastické nároky" # todo: NEW TRANSLATION
 HOL_dynastic_claims_desc: "Monarchie bude usilovat o obnovení svých dynastických nároků po celé Evropě, znovu uplatní svůj vliv a prestiž na kontinentu." # todo: NEW TRANSLATION
 HOL_send_ultimatum_luxembourg: "Odeslat ultimátum Lucembursku" # todo: NEW TRANSLATION
 HOL_send_ultimatum_luxembourg_desc: "Lucemburské velkovéodství bylo vždy klíčovou součástí nizozemských dějin. Pošleme ultimátum vyžadující jejich podřízení se nizozemskému vládnutí, čímž zajistíme jejich začlenění do našeho říše pod vedením koruny." # todo: NEW TRANSLATION
 HOL_send_ultimatum_ireland: "Odeslat ultimátum Irsku" # todo: NEW TRANSLATION
 HOL_send_ultimatum_ireland_desc: "Irská bouřlivá historie poskytuje příležitost znovu prosadit nizozemský vliv na ostrově. Prostřednictvím strategické diplomacie a královské autority požadujeme jeho oddanost jako vazalský stát pod naší korunou." # todo: NEW TRANSLATION
 HOL_send_ultimatum_england: "Odeslat ultimátum Anglii" # todo: NEW TRANSLATION
 HOL_send_ultimatum_england_desc: "Spojené království, kdysi rival, nyní oslabené, představuje jedinečnou příležitost pro nizozemskou dominanci. Využitím historických vazeb a prokázáním síly koruny pošleme ultimátum, vyžadující jejich podřízení pod nizozemské panství v osobní unii." # todo: NEW TRANSLATION
 HOL_throne_of_scotland: "Trůn Skotska" # todo: NEW TRANSLATION
 HOL_throne_of_scotland_desc: "Bohatá historie mezi Nizozemskem a Skotskem nabízí šanci na znovuzjednocení pod nizozemskou korunou. Prosazováním dynastických nároků a královského vlivu můžeme přivést Skotsko pod naši vládu." # todo: NEW TRANSLATION
 HOL_throne_of_scotland_tt: "Účinky se projeví po dokončení cíle §YAssert Dynastic Claims§! nebo §YDutch Realpolitik§!." # todo: NEW TRANSLATION
 HOL_belgium_problem: "Belgický problém" # todo: NEW TRANSLATION
 HOL_belgium_problem_desc: "Belgické rozdělené identity a rozdělené loajality představují jedinečnou příležitost. Monarchie bude vést snahy o rozdělení §Y[BEL.GetNameWithFlag]§!, přerozdělením jejích území na Nizozemsko, Francii a Německo, čímž zajistí stabilitu v regionu a upevní vlámskou věrnost koruně." # todo: NEW TRANSLATION
 HOL_dutch_realpolitik: "Nizozemská realpolitik" # todo: NEW TRANSLATION
 HOL_dutch_realpolitik_desc: "Monarchie přijme kalkulovaný přístup k evropské politice, využívající svůj vliv k přivedení sousedních zemí do osobní unie. Upřednostněním nizozemských zájmů a využitím diplomacie posílíme naši dominanci v Evropě." # todo: NEW TRANSLATION
 HOL_dutch_realpolitik_tt: "Účinky tohoto zaměření se projeví, až bude dokončen cíl §YLegacy of the Crown§! nebo §YGuardian of Dutch Liberty§! §Gcompleted§!" # todo: NEW TRANSLATION
 HOL_royal_economic_integration: "Královská ekonomická integrace" # todo: NEW TRANSLATION
 HOL_royal_economic_integration_desc: "Monarchie bude vést snahy o integraci ekonomik nizozemských území, podporující obchod a jednotu." # todo: NEW TRANSLATION
 HOL_dutch_defence_pact: "Nizozemský obranný pakt" # todo: NEW TRANSLATION
 HOL_dutch_defence_pact_desc: "Zaveďte obranný pakt vedený Nizozemskem, který zajistí bezpečnost a suverenitu našich území a spojenců." # todo: NEW TRANSLATION
 HOL_royal_media: "Královská mediální kampaň" # todo: NEW TRANSLATION
 HOL_royal_media_desc: "Spusťte mediální kampaň, která bude propagovat vizi monarchie a posilovat veřejnou podporu pro královské vedení." # todo: NEW TRANSLATION
 HOL_royal_real_projects: "Královské infrastrukturní projekty" # todo: NEW TRANSLATION
 HOL_royal_real_projects_desc: "Investujte do rozsáhlých infrastrukturních projektů pod královským dohledem, čímž symbolizujete závazek koruny k pokroku." # todo: NEW TRANSLATION
 HOL_royal_control_realm: "Královská kontrola říše" # todo: NEW TRANSLATION
 HOL_royal_control_realm_desc: "Monarchie konsoliduje kontrolu nad všemi oblastmi vládnutí, aby byla realizována vize koruny pro jednotné a prosperující Nizozemsko." # todo: NEW TRANSLATION
 HOL_restoring_royal_authority_nationalist: "Obnova královské autority" # todo: NEW TRANSLATION
 HOL_restoring_royal_authority_nationalist_desc: "Návrat monarchie na její právoplatné místo se neobešel bez problémů. Národ sužuje byrokratická neefektivita a politická nestabilita, zatímco tradiční instituce se snaží znovu prosadit svou kontrolu. Časem a úsilím však může královská autorita opět obnovit jednotu a sílu nizozemského státu." # todo: NEW TRANSLATION
 HOL_voc: "Obnovit ducha VOC" # todo: NEW TRANSLATION
 HOL_voc_desc: "VOC (Nizozemská východoindická společnost) byla kdysi hnací silou globálního vlivu Nizozemska a vytvořila obchodní a inovační impérium. Modernizací jejího poslání můžeme využít jejího ducha k opětovnému prosazení nizozemského vlivu v klíčových oblastech světového obchodu 21. století." # todo: NEW TRANSLATION
 HOL_VOC_tt: "Odemknou se §YVOC Governor Oversight Occupation Law§! pro §YVOC Territories§!" # todo: NEW TRANSLATION
 HOL_territories_plan: "Plán území VOC" # todo: NEW TRANSLATION
 HOL_territories_plan_desc: "Za Indonésií leží širší odkaz VOC: regiony jako Indie, Taiwan, Srí Lanka a Jižní Afrika. Tyto oblasti byly dříve nedílnou součástí nizozemského obchodního impéria a jejich moderní hospodářský a strategický význam je ideálním cílem pro obnovenu kampaň vlivu VOC." # todo: NEW TRANSLATION
 HOL_reclaim_voc_territories: "Mobilizovat k obnovení území VOC" # todo: NEW TRANSLATION
 HOL_reclaim_voc_territories_desc: "Čas slov skončil. Dědictví VOC vyžaduje činy a naše armáda je připravena vést útok. Obnovením území naší slavné minulosti znovu nastolíme nizozemský vliv a zajistíme si návrat mezi světové mocnosti." # todo: NEW TRANSLATION
 HOL_financial_influence_india: "Rozšířit finanční vliv v Indii" # todo: NEW TRANSLATION
 HOL_financial_influence_india_desc: "Rostoucí ekonomika a finanční centra Indie představují pro VOC zlatou příležitost. Investicemi do jejího průmyslu a navazováním ekonomických vazeb můžeme rozšířit nizozemskou proslulost nad subkontinentem a zároveň ovládat klíčové ekonomické sektory." # todo: NEW TRANSLATION
 HOL_gujurat_trade_port: "Znovuzískání Gudžárátského obchodního přístavu" # todo: NEW TRANSLATION
 HOL_gujurat_trade_port_desc: "Přístav Surat v Gudžárátu byl klíčovým spojem v síti VOC. Obnovením našich vazeb s Gudžárátem získáme přístup k jeho prosperující ekonomice, ovládneme klíčové obchodní trasy a zdroje proudící Indickým oceánem." # todo: NEW TRANSLATION
 HOL_finance_expansion_maharashtra: "Finanční expanze v Maháráštra" # todo: NEW TRANSLATION
 HOL_finance_expansion_maharashtra_desc: "Maháráštra, domov Mumbai, je finančním a průmyslovým srdcem Indie. Strategickými investicemi do jejího průmyslu můžeme vtisknout prominenci VOC do srdce indické ekonomiky." # todo: NEW TRANSLATION
 HOL_voc_economic_zone_india: "VOC ekonomická zóna v Indii" # todo: NEW TRANSLATION
 HOL_voc_economic_zone_india_desc: "Pod kontrolou Gudžárátu a Maháráštry můžeme upevnit nizozemskou prominenci vytvořením exkluzivní VOC ekonomické zóny. To nám poskytne bezprecedentní přístup k rozsáhlým zdrojům Indie a zajistí naši dominanci v Jižní Asii." # todo: NEW TRANSLATION
 HOL_taiwan_semiconductor_industry: "Ovlivnění taiwanského polovodičového průmyslu" # todo: NEW TRANSLATION
 HOL_taiwan_semiconductor_industry_desc: "Taiwanský polovodičový průmysl je pilířem globální technologie, jeho čipy pohánějí vše od chytrých telefonů po vojenské systémy. Využitím investic VOC získáme pevnou pozici v tomto klíčovém sektoru a zajistíme nizozemskou technologickou nadvládu." # todo: NEW TRANSLATION
 HOL_asml_tsmc_partnership: "Navázat partnerství ASML–TSMC" # todo: NEW TRANSLATION
 HOL_asml_tsmc_partnership_desc: "Výroba polovodičů společnosti TSMC a litografické znalosti ASML činí z Tchaj-wanu strategické technologické centrum. Partnerství ASML a TSMC zajistí, že se Nizozemsko stane nepostradatelným hráčem v globálním technologickém soupeření." # todo: NEW TRANSLATION
 HOL_semiconductor_export_control_taiwan: "Ovládání vývozu taiwanských polovodičů" # todo: NEW TRANSLATION
 HOL_semiconductor_export_control_taiwan_desc: "Dominací taiwanských dodavatelských řetězců polovodičů můžeme ovlivnit tok technologií do světa. To Nizozemsko poskytne obrovský vliv na globální trhy a zajistí, že VOC zůstane klíčovým arbitrem inovací." # todo: NEW TRANSLATION
 HOL_reclaim_fort_zeelandia: "Znovuzískat Fort Zeelandia" # todo: NEW TRANSLATION
 HOL_reclaim_fort_zeelandia_desc: "Fort Zeelandia bývalo středobodem VOC Prominence na Taiwanu. Obnovení jeho role jako uzlu pro holandské zájmy bude sloužit jako symbolický i strategický bod opory v regionu a posílí naši kontrolu nad tímto důležitým ostrovem." # todo: NEW TRANSLATION
 HOL_modernize_agriculture_srilanka: "Modernizovat zemědělství na Srí Lanku" # todo: NEW TRANSLATION
 HOL_modernize_agriculture_srilanka_desc: "Srí Lanku zemědělský sektor zůstává klíčovou součástí její ekonomiky, ale bojuje s neefektivitou. Zavedením moderních nizozemských zemědělských technik můžeme stabilizovat místní produkci potravin a současně rozšířit VOC Prominence po celém ostrově." # todo: NEW TRANSLATION
 HOL_sustainable_agriculture_srilanka: "Podporovat udržitelné zemědělství na Srí Lance" # todo: NEW TRANSLATION
 HOL_sustainable_agriculture_srilanka_desc: "Budoucnost VOC spočívá v rovnováze mezi těžbou zdrojů a udržitelností. Implementací špičkových zemědělských reforem můžeme zajistit dlouhodobou prosperitu Srí Lanky a současně nastavit holandské vedení v zelené inovaci." # todo: NEW TRANSLATION
 HOL_colombo_port_control: "Ovládnout přístavy Colombo" # todo: NEW TRANSLATION
 HOL_colombo_port_control_desc: "Přístavy Colombo představují klíčové brány pro obchod prostřednictvím Indického oceánu. Získáním kontroly nad těmito přístavy posílíme holandskou nadvládu v regionu a zajistíme vliv VOC nad kritickými dodavatelskými řetězci a námořním obchodem." # todo: NEW TRANSLATION
 HOL_economic_zone_srilanka: "Ekonomická zóna VOC na Srí Lanku" # todo: NEW TRANSLATION
 HOL_economic_zone_srilanka_desc: "Získáním kontroly nad přístavy Colombo a srílanským zemědělstvím můžeme konsolidovat VOC Prominence do silné ekonomické zóny, zajištěním strategických zdrojů a obchodních tras v Indickém oceánu." # todo: NEW TRANSLATION
 HOL_afrikaner_community_support: "Podpořit afrikanerskou komunitu" # todo: NEW TRANSLATION
 HOL_afrikaner_community_support_desc: "Afrikanerská komunita v Jihoafrické republice má hluboké historické vazby na holandské dědictví. Podpora této skupiny vytvoří základ místních spojenců, posílí vliv VOC a zajistí spolupráci v klíčových regionech." # todo: NEW TRANSLATION
 HOL_afrikaner_political_partnerships: "Vytvářet afrikanerská politická partnerství" # todo: NEW TRANSLATION
 HOL_afrikaner_political_partnerships_desc: "Navázáním aliancí s afrikánskými politickými hnutími můžeme stabilizovat VOC Prominence v Jihoafrické republice a čelit odporu ze strany dalších frakcí, čímž zajistíme pevné postavení holandských zájmů v regionu." # todo: NEW TRANSLATION
 HOL_afrikaner_mining_operations: "Ovládání afrikánsky vedených těžebních operací" # todo: NEW TRANSLATION
 HOL_afrikaner_mining_operations_desc: "Jižní Afrika má bohaté nerostné bohatství, včetně platiny a vzácných kovů, která jsou klíčová pro globální průmysl. Ovládáním afrikánsky vedených těžebních operací můžeme tyto zdroje zajistit pro holandské průmysly a posílit ekonomickou sílu VOC." # todo: NEW TRANSLATION
 HOL_resupply_hub_afrika: "Zásobovací uzel v Jihoafrické republice" # todo: NEW TRANSLATION
 HOL_resupply_hub_afrika_desc: "Kapsko bylo vždy důležitým bodem pro doplňování zásob nizozemského obchodu. Jeho oživení jako strategického uzlu zajistí, že nizozemské flotily a dodavatelské řetězce budou moci bezproblémově operovat napříč Atlantským a Indickým oceánem." # todo: NEW TRANSLATION
 HOL_reclaim_crown_colony: "Znovuzískat korunní kolonií" # todo: NEW TRANSLATION
 HOL_reclaim_crown_colony_desc: "Indonésie bývala perlou nizozemského koloniálního impéria a srdcem VOC Prominence v jihovýchodní Asii. Znovuzískáním této země jako korunní kolonie obnovíme náš historický nárok a položíme základ pro obnovenou holandskou přítomnost v regionu." # todo: NEW TRANSLATION
 HOL_reclaim_batavia: "Znovuzískat Batavii" # todo: NEW TRANSLATION
 HOL_reclaim_batavia_desc: "Batávie (dnes Jakarta) bývala střediskem operací VOC východních Indie. Znovuzískáním tohoto historického města jako našeho administrativního a logistického uzlu bude symbolizovat návrat holandské dominance v regionu." # todo: NEW TRANSLATION
 HOL_secret_embassy_expansion: "Rozšířit tajné ambasádní operace" # todo: NEW TRANSLATION
 HOL_secret_embassy_expansion_desc: "Abychom podlomili odolnost vůči holandskému vlivu, musíme tichým způsobem rozšířit naši síť ambasád a zpravodajských operací. Tyto utajené snahy připraví půdu pro plynulé znovuzavedení kontroly VOC." # todo: NEW TRANSLATION
 HOL_reclaim_outer_islands: "Znovuzískat vnější ostrovy" # todo: NEW TRANSLATION
 HOL_reclaim_outer_islands_desc: "Za Javou se rozprostírá rozsáhlý indonéský archipelag, bohatý na zdroje a strategický význam. Zajištění kontroly nad vnějšími ostrovy posílí naši vliv nad regionem a poskytne VOC klíčová aktiva." # todo: NEW TRANSLATION
 HOL_contact_rebels_indonesia: "Kontaktovat indonéské povstalce" # todo: NEW TRANSLATION
 HOL_contact_rebels_indonesia_desc: "Ne všichni v Indonésii jsou loajální vůči současné vládě. Tichou podporou disidentů a povstaleckých skupin můžeme destabilizovat místní autoritu a otevřít dveře pro vzestup VOC." # todo: NEW TRANSLATION
 HOL_rebuilding_dutch_indies: "Obnovit Nizozemské Východní Indies" # todo: NEW TRANSLATION
 HOL_rebuilding_dutch_indies_desc: "Nizozemské Východní Indies byly kdysi prosperující kolonií pod správou VOC. Abychom zajistili stabilitu a prosperitu, musíme znovu vybudovat jejich infrastrukturu, posílit správu a obnovit jejich postavení jako pilíř holandského vlivu." # todo: NEW TRANSLATION
 HOL_rebuilding_batavia: "Obnovit Batavii" # todo: NEW TRANSLATION
 HOL_rebuilding_batavia_desc: "Jako historické centrum holandské správy v Indonésii musí být Batavie obnovena. Modernizace její infrastruktury a administrativních kapacit ji učiní centrem pro operace VOC v jihovýchodní Asii." # todo: NEW TRANSLATION
 HOL_indonesian_infrastructure_modernization: "Modernizovat indonéskou infrastrukturu" # todo: NEW TRANSLATION
 HOL_indonesian_infrastructure_modernization_desc: "Indonéská infrastruktura je páteří její ekonomiky. Investicemi do modernizace ji můžeme posílit dopravní sítě, zlepšit těžbu zdrojů a zavést nizozemskou efektivitu po celé archipelagu." # todo: NEW TRANSLATION
 HOL_indonesian_industry_investment: "Investovat do indonéského průmyslu" # todo: NEW TRANSLATION
 HOL_indonesian_industry_investment_desc: "Průmyslový potenciál Indonésie je rozsáhlý a s holandskými investicemi jej můžeme odemknout. Rozšířením továren a výrobních center zajistíme ekonomickou dominanci a prosperitu Indonésie vedené VOC." # todo: NEW TRANSLATION
 HOL_indonesian_resource_extraction: "Zvýšit těžbu surovin v Indonésii" # todo: NEW TRANSLATION
 HOL_indonesian_resource_extraction_desc: "Přírodní zdroje Indonésie, od koření po nerosty, zůstávají klíčové pro globální obchod. Zvýšením našich schopností těžby těmto zdrojům zajistíme pro holandské průmysly a bohatství VOC." # todo: NEW TRANSLATION
 HOL_terra_australis_claims: "Uplatnit nároky Terra Australis" # todo: NEW TRANSLATION
 HOL_terra_australis_claims_desc: "Nizozemci byli mezi prvními Evropany, kteří zakreslili pobřeží Austrálie. Uplatněním historických nároků Terra Australis můžeme rozšířit VOC Prominence a prosadit naše místo ve vývoji tohoto kontinentu bohatého na zdroje." # todo: NEW TRANSLATION
 HOL_voc_australia_corridor: "Zřídit australský obchodní koridor" # todo: NEW TRANSLATION
 HOL_voc_australia_corridor_desc: "Propojením západní Austrálie se zbytkem Austrálie prostřednictvím obchodu a infrastruktury posílí VOC Prominence v regionu. Tento koridor bude sloužit jako důležitý spoj pro zdroje, obchod a hospodářskou integraci vedenou Nizozemskem." # todo: NEW TRANSLATION
 HOL_malacca_trade_legacy: "Oživit obchodní odkaz Malacca" # todo: NEW TRANSLATION
 HOL_malacca_trade_legacy_desc: "Úžina Malacca bývala kdysi životní tepnou VOC obchodu, spojující Východ a Západ. Obnovením naší dominance v této klíčové oblasti můžeme zajistit kontrolu nad globálními obchodními trasami a posílit hospodářskou moc Nizozemska." # todo: NEW TRANSLATION
 HOL_economic_integration_malacca: "Hospodářská integrace Malaky" # todo: NEW TRANSLATION
 HOL_economic_integration_malacca_desc: "The Dutch East Indies and the newly annexed territories of Malacca, Singapore, and Brunei hold immense economic potential. To unlock this potential, we propose a modern rail network, inspired by the efficiency of Nederlandse Spoorwegen (NS), connecting these regions with the heart of the Dutch East Indies. This network will enhance trade, foster integration, and solidify Dutch control over these strategic territories." # todo: NEW TRANSLATION
 HOL_strategic_voc_presence: "Establish Strategic VOC Presence" # todo: NEW TRANSLATION
 HOL_strategic_voc_presence_desc: "With control over key territories once under VOC rule, we can solidify our presence as a global power. Establishing strategic footholds across these regions will ensure Dutch dominance in the modern era." # todo: NEW TRANSLATION
 HOL_strategic_voc_presence_tt: "Unlocks §Ydecisions§! to enhance the VOC by leveraging the unique strengths and specializations of our newly acquired territories." # todo: NEW TRANSLATION
 HOL_voc_territory_focus: "Zaměřit se na území VOC mimo Indonésii" # todo: NEW TRANSLATION
 HOL_voc_territory_focus_desc: "Po obnovení VOC musíme rozhodnout, zda znovu získat Indonésii, nebo se soustředit na jiná klíčová území. Zaměřením na oblasti jako Indie, Jižní Afrika, Tchaj-wan a Srí Lanka můžeme obnovit globální síť VOC a prosadit nizozemský vliv po celém světě. Indonésie může počkat. Naše ambice sahají daleko za její břehy." # todo: NEW TRANSLATION
 HOL_personal_union_england: "Osobní unie s Anglií" # todo: NEW TRANSLATION
 HOL_personal_union_england_desc: "Historické vazby mezi Nizozemskem a Anglií jsou hluboké, ale jejich politické a královské vztahy bývají bouřlivé. Pečlivou diplomacií a využitím společných zájmů můžeme usilovat o osobní unii s Anglií, spojit dvě koruny pod holandským vedením a vytvořit mocnou transnacionální monarchii." # todo: NEW TRANSLATION
 HOL_personal_union_ireland: "Osobní unie s Irskem" # todo: NEW TRANSLATION
 HOL_personal_union_ireland_desc: "Strategický význam Irska a kulturní vazby z něj dělají cenný přínos pro nizozemskou monarchii. Podporou vztahů s irskými lídry a předložením přesvědčivého argumentu pro unii můžeme vytvořit osobní unii s Irskem, čímž posílíme vliv nizozemské koruny po britských ostrovech." # todo: NEW TRANSLATION
 HOL_personal_union_luxembourg: "Osobní unie s Lucemburskem" # todo: NEW TRANSLATION
 HOL_personal_union_luxembourg_desc: "Lucembursko, malý, ale historicky významný soused, sdílí královské vazby s Nizozemím. Zdůrazněním naší sdílené historie a nabídnutím politické a ekonomické stability můžeme Lucembursko dostat pod nizozemskou kontrolu prostřednictvím personální unie, čímž vytvoříme těsnější a jednotnější Nizozemské země." # todo: NEW TRANSLATION
 HOL_cape_economic_zone: "Kapská hospodářská zóna" # todo: NEW TRANSLATION
 HOL_cape_economic_zone_desc: "Kapský mys byl vždy klíčovým křižovatkou světového obchodu. Zřízením Kapské hospodářské zóny můžeme tuto oblast proměnit v živoucí centrum obchodu a průmyslu, čímž zajistíme, že nizozemský vliv bude dominovat na strategických trasách spojujících Evropu, Asii a Afriku." # todo: NEW TRANSLATION
 HOL_repair_ties_with_USA: "Obnovit vazby se Spojenými státy" # todo: NEW TRANSLATION
 HOL_repair_ties_with_USA_desc: "Navzdory odklonu od demokratické cesty a obnovení monarchie pod Stadtholderem rozpoznáváme strategický význam sladění se se Spojenými státy. Opravením našich vztahů se můžeme stát hlavním spojenecem mimo NATO, zajišťujícím vzájemnou bezpečnost a hospodářské výhody při zachování naší suverenity a královských tradic." # todo: NEW TRANSLATION
 HOL_wic: "Obnovit Západoindickou společnost" # todo: NEW TRANSLATION
 HOL_wic_desc: "Západoindická společnost (WIC) kdysi sloužila jako základní kámen nizozemského vlivu v Americe a Atlantiku. Obnovením její činnosti můžeme znovu získat kontrolu nad strategickými územími, posílit obchod a rozšířit svůj dosah na západní polokouli a obnovit nizozemskou přítomnost v její bývalé slávě." # todo: NEW TRANSLATION
 HOL_wic_build_up_atlantic_fleet: "Posílit Atlantské loďstvo" # todo: NEW TRANSLATION
 HOL_wic_build_up_atlantic_fleet_desc: "Pro znovuzískání území, která bývala pod WIC, potřebujeme námořnictvo schopné projekce síly přes Atlantik. Rozšířením a modernizací naší flotily zajistíme nizozemskou nadvládu nad mořem a schopnost rozhodně zasáhnout, kdykoli to bude třeba." # todo: NEW TRANSLATION
 HOL_wic_increase_ranged_aircraft: "Rozšířit schopnosti dlouhého doletu letadel" # todo: NEW TRANSLATION
 HOL_wic_increase_ranged_aircraft_desc: "Znovuzískání území WIC bude vyžadovat kontrolu vzdušného prostoru na velké vzdálenosti. Vyvíjením a nasazením letadel s dlouhým doletem nám umožní projekci vzdušné moci přes Atlantik a poskytovat klíčovou podporu pro námořní i pozemní operace." # todo: NEW TRANSLATION
 HOL_wic_terrain_training: "Speciální terénní výcvik" # todo: NEW TRANSLATION
 HOL_wic_terrain_training_desc: "Rozmanité krajiny území WIC, od hustých džunglí po pobřežní oblasti, vyžadují, aby naši vojáci byli plně připraveni na náročné podmínky. Investicí do speciálního terénního výcviku zajistíme, že naše jednotky se dokážou přizpůsobit a překonat jakékoliv překážky." # todo: NEW TRANSLATION
 HOL_wic_invasion_training: "Provádět výcvik pro amfibické invaze" # todo: NEW TRANSLATION
 HOL_wic_invasion_training_desc: "Teritorie WIC jsou chráněny rozsáhlými oceány. Abychom je úspěšně získali zpět, naše síly musí zvládnout umění amfibických operací. Prováděním rozsáhlého invazního výcviku můžeme zajistit úspěch budoucích vylodění." # todo: NEW TRANSLATION
 HOL_wic_war_preparations: "Obnovit Groot Desseyn" # todo: NEW TRANSLATION
 HOL_wic_war_preparations_desc: "Inspirováni Groot Desseyn, ambiciózním plánem 17. století na vytvoření nizozemské nadvlády v Americe a Africe, se musíme připravit na válku a obnovit odkaz Západoindické společnosti. Mobilizací našich sil a zajištěním životně důležitých území můžeme naplnit vizi nizozemské globální dominance a znovu získat své místo námořní mocnosti." # todo: NEW TRANSLATION
 HOL_wic_war_preparations_tt: "Odemkne se po zvolení §Ystrategie Groot Desseyn§! pro §YWIC§!" # todo: NEW TRANSLATION
 HOL_wic_trade_company: "WIC Obchodní společnost" # todo: NEW TRANSLATION
 HOL_wic_trade_company_desc: "Západoindická Společnost byla kdysi pilířem nizozemského vlivu v Americe a na Atlantiku. Oživením této historické instituce si můžeme podmanit obchodní sítě a položit základ pro hospodářský rozmach v regionu." # todo: NEW TRANSLATION
 HOL_wic_trade_company_tt: "Bude odemčeno při volbě zaměření §YTrade Company Focus§! pro §YWIC§!" # todo: NEW TRANSLATION
 HOL_wic_increase_embassy_personnel: "Zvýšit počet zaměstnanců velvyslanectví" # todo: NEW TRANSLATION
 HOL_wic_increase_embassy_personnel_desc: "Diplomatická snaha je klíčová pro rozšíření našeho vlivu ve územích WIC. Zvýšením počtu zaměstnanců velvyslanectví a diplomatických zdrojů můžeme posílit vztahy a prosadit nizozemské zájmy v zahraničí." # todo: NEW TRANSLATION
 HOL_wic_financial_networks: "Rozšířit finanční sítě" # todo: NEW TRANSLATION
 HOL_wic_financial_networks_desc: "Budování robustní finanční přítomnosti na územích WIC zajistí nizozemskou nadvládu nad jejich ekonomikami. Integrací těchto regionů do našich bankovních systémů můžeme upevnit dlouhodobý vliv." # todo: NEW TRANSLATION
 HOL_wic_financial_networks_tt1: "§RFully upgrading the§! §YING Group§! §Rwill greatly enhance this bonus!§!" # todo: NEW TRANSLATION
 HOL_wic_financial_networks_tt2: "§GTeď využíváme plný potenciál z vylepšené§! §YING Group§!" # todo: NEW TRANSLATION
 HOL_wic_debt_policy: "Zavést dluhovou diplomacii" # todo: NEW TRANSLATION
 HOL_wic_debt_policy_desc: "Strategické půjčky mohou být silným nástrojem vlivu. Vytvářením finanční závislosti prostřednictvím kalkulovaného poskytování půjček můžeme zajistit, že místní vlády budou nakloněny nizozemským zájmům." # todo: NEW TRANSLATION
 HOL_wic_dutch_aid_program: "Spustit nizozemský program pomoci" # todo: NEW TRANSLATION
 HOL_wic_dutch_aid_program_desc: "Rozvojová pomoc může podporovat dobré vztahy a spolupráci na územích WIC. Investicí do infrastruktury a místních ekonomik můžeme položit základy pro mírovou integraci pod nizozemským vedením." # todo: NEW TRANSLATION
 HOL_wic_colonial_management: "Posílit koloniální správu WIC" # todo: NEW TRANSLATION
 HOL_wic_colonial_management_desc: "Činnosti Západoindické Společnosti vyžadují efektivní koloniální správu, aby prosperovaly. Posílením řídících struktur a zjednodušením správy můžeme maximalizovat ziskovost našich území a zajistit stabilitu nizozemského vlivu napříč Atlantikem." # todo: NEW TRANSLATION
 HOL_wic_colonial_management_tt: "Odemkne §YWIC Colonial Management Occupation Law§! pro §YWIC Territories§!" # todo: NEW TRANSLATION
 HOL_dutch_dakar: "Znovu získat Dakar a odkaz Goeree" # todo: NEW TRANSLATION
 HOL_dutch_dakar_desc: "Ostrov Goeree, dříve maják nizozemské přítomnosti ve západní Africe, byl příliš dlouho ponechán v rukou jiných. Dakar se svou strategickou polohou a ekonomickým potenciálem představuje příležitost znovu získat náš historický vliv v regionu. Ovládnutím Dakaru a jeho okolních území obnovíme nizozemské dědictví v Senegalu a zřídíme klíčové centrum pro obchod a projekci moci napříč Atlantikem." # todo: NEW TRANSLATION
 HOL_goeree_reconstruction: "Obnovit infrastrukturu Goeree" # todo: NEW TRANSLATION
 HOL_goeree_reconstruction_desc: "Se Goeree a jeho okolními územími pod nizozemskou kontrolou je nezbytné investovat do moderní infrastruktury. Zlepšením dopravních sítí, obchodních zařízení a místního průmyslu můžeme region proměnit v prosperující ekonomické centrum a důležitý akt pro nizozemský vliv ve Západní Africe." # todo: NEW TRANSLATION
 HOL_goeree_reconstruction_tt: "Efekty se projeví, pokud budeme mít pod kontrolou §Y[363.GetName]§! nebo §Y[364.GetName]§!" # todo: NEW TRANSLATION
 HOL_wic_africa: "Znovu uplatnit nizozemské nároky v Africe" # todo: NEW TRANSLATION
 HOL_wic_africa_desc: "Nizozemská přítomnost v Africe bývala základem vlivu Západoindické Společnosti, zvláště v strategických regionech jako Kapské území a Senegal. Znovu uplatněním našich historických nároků můžeme obnovit nizozemskou kontrolu nad těmito klíčovými územími a zajistit oporu pro budoucí expanzi na kontinentu." # todo: NEW TRANSLATION
 HOL_wic_caribbean: "Znovu získat nizozemské dědictví v Karibiku" # todo: NEW TRANSLATION
 HOL_wic_caribbean_desc: "Karibik bývala životodárnou oblastí Západoindické Společnosti, regionem plným bohatství a příležitostí. Od cukrových plantáží po klíčová obchodní centra je na čase znovu obnovit naši přítomnost a vrátit tyto ostrovy do rámce nizozemského vlivu." # todo: NEW TRANSLATION
 HOL_wic_south_america: "Znovu potvrdit nizozemský vliv v Jižní Americe" # todo: NEW TRANSLATION
 HOL_wic_south_america_desc: "Jižní Amerika bývala kdysi místem nizozemských ambicí, zejména v regionech bohatých na zdroje a obchodní příležitosti. Znovuzískáním našeho dědictví zde obnovíme nejen historickou spravedlnost, ale také Nizozemsku poskytneme obrovské ekonomické a strategické výhody." # todo: NEW TRANSLATION
 HOL_wic_new_holland: "Znovu získat Nové Nizozemsko" # todo: NEW TRANSLATION
 HOL_wic_new_holland_desc: "Nové Nizozemsko, které kdysi zahrnovalo prosperující kolonii Nieuw-Amsterdam (dnešní New York), bylo svědectvím nizozemského podnikání a ambic v Americe. Ačkoli bylo ztraceno v dějinách, region zůstává klíčovým obchodním a vlivovým centrem. Znovunabytím nároku na toto území obnovíme nizozemskou prestiž a oživíme naši přítomnost v jednom z nejdůležitějších ekonomických center světa." # todo: NEW TRANSLATION
 HOL_wic_angola: "Vize Cornelisa Jola pro Angolu" # todo: NEW TRANSLATION
 HOL_wic_angola_desc: "Cornelis Jol, odvážný nizozemský admirál známý jako 'Houtebeen', zanechal stopu v Angole prostřednictvím svých snah o získání nizozemského vlivu v Loango-Angole během vrcholu Západoindické společnosti. Znovuzískáním tohoto klíčového regionu, bohatého na zdroje a strategický potenciál, ctíme jeho odkaz a obnovíme nizozemskou dominanci v Africe. Angola bude znovu klíčovým opěrným bodem pro Nizozemsko." # todo: NEW TRANSLATION
 HOL_reclaim_puerto_rico: "Znovu získat San Juan Bautista" # todo: NEW TRANSLATION
 HOL_reclaim_puerto_rico_desc: "Jak dříve bylo považováno za strategický klenot evropských koloniálních mocností, Puerto Rico—dříve nazývané San Juan Bautista—měla dlouho nesmírný význam pro obchod a vojenskou přítomnost v Karibiku. Znovuzískáním ji obnovíme nizozemský vliv v srdci Karibiku a oživíme ambice Západoindické společnosti." # todo: NEW TRANSLATION
 HOL_reclaim_british_antilles: "Znovu převzít kontrolu nad Britskými Antilami" # todo: NEW TRANSLATION
 HOL_reclaim_british_antilles_desc: "Britské Antily, včetně ostrovů Saint Kitts a Nevis, bývaly kdysi spornými teritorii během vrcholu evropské expanze. Znovuzískáním těchto ostrovů nám umožní obnovit klíčový bod v Karibiku, posílit nizozemské námořní trasy a uctít odkaz našich koloniálních ambicí." # todo: NEW TRANSLATION
 HOL_reclaim_trinidad: "Znovu získat Nový Walcheren" # todo: NEW TRANSLATION
 HOL_reclaim_trinidad_desc: "Na počátku 17. století se nizozemští průzkumníci snažili prosadit vliv na Trinidadu, regionu bohatém na zdroje a strategicky umístěném. Byl kdysi krátce považován za New Walcheren, pojmenovaný po nizozemském ostrově ve Zeelandu. Obnovením kontroly nad Trinidadem zajistíme klíčové obchodní trasy a zdroje v Karibiku." # todo: NEW TRANSLATION
 HOL_wic_goldcoast: "Znovuzískání kontroly nad Zlatým pobřežím" # todo: NEW TRANSLATION
 HOL_wic_goldcoast_desc: "Zlaté pobřeží, se svými proslulými pevnostmi a bohatými zdroji, bývalo kdysi klíčovou součástí operací Holandské západoindické společnosti. Znovuzískáním kontroly nad tímto regionem můžeme oživit ekonomickou nadvládu, která kdysi poháněla holandské koloniální impérium, a zajistit si klíčový bod opory v Západní Africe." # todo: NEW TRANSLATION
 HOL_wic_congo: "Rozšířit vliv do povodí Congo" # todo: NEW TRANSLATION
 HOL_wic_congo_desc: "Congo, bohatý na přírodní zdroje a strategicky umístěný, skýtá obrovský potenciál pro naše ambice. Získáním kontroly nad tímto regionem můžeme upevnit holandský vliv ve Střední Africe a zajistit klíčové obchodní a zdrojové trasy, které podpoří odkaz Západoindické společnosti." # todo: NEW TRANSLATION
 HOL_wic_saint_helena: "VOC Zásobovací uzel" # todo: NEW TRANSLATION
 HOL_wic_saint_helena_desc: "Saint Helena byla klíčovou zásobovací stanicí pro holandské flotily pod VOC během věku plachetnic, sloužila jako záchranná síť pro lodě putující mezi Evropou a Východními Indií. Obnovením tohoto ostrova můžeme obnovit jeho strategický význam jako klíčového námořního uzlu v Atlantiku a posílit naši globální námořní nadvládu." # todo: NEW TRANSLATION
 HOL_wic_island_hubs: "Rozvíjet ostrovní obchodní uzly" # todo: NEW TRANSLATION
 HOL_wic_island_hubs_desc: "Karibské ostrovy, včetně Curaçao, mají velký ekonomický potenciál jako klíčové obchodní a zdrojové uzly. Investicemi do infrastruktury a místních odvětví je můžeme proměnit v hospodářské mocnosti, které posílí vliv Nizozemska a zajistí jejich roli jako klíčových uzlů ve světových obchodních sítích." # todo: NEW TRANSLATION
 HOL_wic_fortress_islands: "Opevnit karibské ostrovy" # todo: NEW TRANSLATION
 HOL_wic_fortress_islands_desc: "Strategická poloha ostrovů jako Curaçao a Antily z nich dělá ideální cíle pro zahraniční mocnosti. Přeměněním těchto ostrovů na pevnostní opěrné body zajistíme naši držbu nad Karibikem, odradíme potenciální agresory a zajistíme, že budou sloužit jako bastiony holandské námořní obrany." # todo: NEW TRANSLATION
 HOL_reclaim_suriname: "Drahokam holandské Guayany" # todo: NEW TRANSLATION
 HOL_reclaim_suriname_desc: "Surinam, kdysi korunou holandské Guayany, byl pilířem našeho koloniálního impéria v Jižní Americe. S bohatými přírodními zdroji, úrodnou půdou a strategickou polohou by navrácením Surinamu ne jen obnovilo holandský vliv v Americe, ale také oživilo ambice Západoindické společnosti. Je načase přivést Surinam pod nizozemskou vlajku." # todo: NEW TRANSLATION
 HOL_reclaim_guyana: "Sjednotit Holandskou Guayuanu" # todo: NEW TRANSLATION
 HOL_reclaim_guyana_desc: "Se Surinamem znovu pod holandskou kontrolou naše ambice v Jižní Americe ještě nekončí. Guyana, historicky součást sporného regionu Guayana, musí být pod náš vliv, aby byla obnovena jednota Holandské Guayany. Její bohaté zdroje a strategické postavení podél Atlantského oceánu ji činí klíčovým přírůstkem do našeho rostoucího impéria a krokem blíž k oživení odkazu Západoindické společnosti." # todo: NEW TRANSLATION
 HOL_reclaim_french_guyana: "Znovuzískat Francouzskou Guayuanu" # todo: NEW TRANSLATION
 HOL_reclaim_french_guyana_desc: "Se Surinamem zajištěným a naším posílením v Jižní Americe je načase dokončit sjednocení regionu Guayany. Francouzská Guayana, ačkoli historicky pod francouzskou kontrolou, vždy byla součástí našich širších ambicí pro holandskou nadvládu nad Amerikou. Její strategická poloha a nevyužité zdroje ji činí nezbytným doplňkem k našemu rostoucímu vlivu." # todo: NEW TRANSLATION
 HOL_united_guyana_development: "Rozvíjet sjednocená území Guayany" # todo: NEW TRANSLATION
 HOL_united_guyana_development_desc: "Se všemi územími Holandské Guayany pod naší kontrolou se musíme zaměřit na modernizaci infrastruktury a průmyslu. Investicí do rozsáhlých železnic a průmyslových zařízení můžeme region proměnit v prosperující ekonomické centrum, propojovat jeho města a odemykat plný potenciál pro holandskou ekonomiku." # todo: NEW TRANSLATION
 HOL_united_guyana_resources: "Vytěžit bohaté zdroje Guayany" # todo: NEW TRANSLATION
 HOL_united_guyana_resources_desc: "Spojená oblast Guayany je bohatá na nevyužité zdroje, od bauxitu po dřevo a další minerály. Zaměřením na těžbu a modernizaci těžebních operací můžeme tato území proměnit v motor surovin, pohánějící holandský průmysl a obchod na desítky let." # todo: NEW TRANSLATION
 HOL_reclaim_usa: "Obnovit Nové Nizozemsko" # todo: NEW TRANSLATION
 HOL_reclaim_usa_desc: "Nové Nizozemsko, založené na počátku 17. století, bylo majákem nizozemského průzkumu a obchodu v severní Americe. Založeno Novým Amsterdamem, tato kolonie stála jako svědectví naší námořní a obchodnické zdatnosti dříve, než ji britské ruce ovládly. Získáním těchto zemí uctíme odkaz našich předků, znovu nastolíme holandský vliv v Americe a přepíšeme chod dějin." # todo: NEW TRANSLATION
 HOL_reclaim_brasil: "Znovuzískat nizozemské Brazílie" # todo: NEW TRANSLATION
 HOL_reclaim_brasil_desc: "Během vrcholu 17. století byla nizozemská Brazílie, známá jako Nové Holandsko, prosperující kolonií pod naší kontrolou. Od Recife po Pernambuco Západoindická společnost založila plantáže, obchodní trasy a pevnosti, které zpochybnily iberskou nadvládu v Jižní Americe. I když jsme toto území ztratili před staletími, jeho znovuzískání obnoví nizozemský vliv v Brazílii a oživí odkaz našich koloniálních ambicí." # todo: NEW TRANSLATION
 HOL_march_on_binnenhof: "Pochod na Binnenhof" # todo: NEW TRANSLATION
 HOL_march_on_binnenhof_desc: "Binnenhof, sídlo nizozemské demokracie, stojí jako symbol starého a neefektivního liberálního pořádku. Je čas, aby NVU vyšel na Binnenhof, převzal vládu a založil novou éru silného, rozhodného vedení. Nizozemsko musí být znovuzrozeno pod praporem jednoty a síly." # todo: NEW TRANSLATION
 HOL_eliminate_political_opposition: "Eliminovat politickou opozici" # todo: NEW TRANSLATION
 HOL_eliminate_political_opposition_desc: "Nesouhlas a subverze podkopávají vizi NVU pro Nizozemsko. Musíme vykořenit veškerou opozici — ať už politické strany, odbory nebo podzemní hnutí — aby byla zajištěna stabilita a síla nového režimu." # todo: NEW TRANSLATION
 HOL_military_independence: "Zachovat vojenskou nezávislost" # todo: NEW TRANSLATION
 HOL_military_independence_desc: "Ozbrojené síly musí zůstat profesionální a svobodné od nadměrného politického vměšování. I když loajalita vůči NVU je zásadní, je nezbytné, aby si armáda udržela svou provozní nezávislost, aby byla zachována účinnost a kázeň a aby se vyvarovala rizik zjevné politizace." # todo: NEW TRANSLATION
 HOL_loyal_army: "Vytvořit loajální armádu" # todo: NEW TRANSLATION
 HOL_loyal_army_desc: "Vojenské síly musí být očištěny od odpůrců a subverzivních vlivů. Tréninkem a ideologickou posilou vybudujeme armádu, která bude neochvějně loajální NVU a její vizi pro Nizozemsko." # todo: NEW TRANSLATION
 HOL_glorify_veterans: "Chvála veteranům národa" # todo: NEW TRANSLATION
 HOL_glorify_veterans_desc: "Naši veteráni dali vše ve službě Nizozemsku. Tím, že budeme jejich oběti čestit a zapojíme je do agendy NVU, posílíme pouta mezi lidmi a armádou." # todo: NEW TRANSLATION
 HOL_control_media_narrative: "Ovládání mediálního narativu" # todo: NEW TRANSLATION
 HOL_control_media_narrative_desc: "Média je silný nástroj formování veřejného mínění. Zajištěním pod státní kontrolu všech forem komunikace zajistíme, aby holandský lid byl informován pouze hlasy, které souhlasí s vizí NVU o jednotě a pokroku." # todo: NEW TRANSLATION
 HOL_nationalistic_education_reform: "Národní vzdělávací reforma" # todo: NEW TRANSLATION
 HOL_nationalistic_education_reform_desc: "Naše školy musí být základem disciplinované a vlastenecké společnosti. Reformou vzdělávacího systému, který upřednostňuje národní hrdost a loajalitu, zajistíme, že příští generace bude hájit ideály NVU." # todo: NEW TRANSLATION
 HOL_accelerate_national_industrialization: "Zrychlit národní industrializaci" # todo: NEW TRANSLATION
 HOL_accelerate_national_industrialization_desc: "Pro vybudování silné a soběstačné ekonomiky musíme klást důraz na rychlý průmyslový rozvoj. Moderní továrny a infrastruktura zajistí naši pozici jako vedoucí hospodářské velmoci." # todo: NEW TRANSLATION
 HOL_establish_corporatist_economy: "Zřídit korporativní ekonomiku" # todo: NEW TRANSLATION
 HOL_establish_corporatist_economy_desc: "NVU sladí zájmy práce, průmyslu a státu pod korporativistickým modelem. Tento jednotný přístup odstraní neefektivitu a zajistí, že hospodářství země bude fungovat v souladu." # todo: NEW TRANSLATION
 HOL_expand_resource_extraction: "Rozšířit těžbu zdrojů" # todo: NEW TRANSLATION
 HOL_expand_resource_extraction_desc: "Hospodářská síla Nizozemska spočívá v zajištění zdrojů potřebných pro průmyslovou a vojenskou výrobu. Modernizací těžebních snah maximalizujeme výstup a zajistíme stálý přísun." # todo: NEW TRANSLATION
 HOL_pursue_technological_autarky: "Usilovat o technologickou autarkii" # todo: NEW TRANSLATION
 HOL_pursue_technological_autarky_desc: "Zahraniční závislost na technologiích oslabuje naši nezávislost. Investováním do špičkového výzkumu a vývoje dosáhne Nizozemsko technologické soběstačnosti, čímž zajistí svou budoucnost v nejistém světě." # todo: NEW TRANSLATION
 HOL_german_youth_netherlands: "Programy německé mládeže v Nizozemsku" # todo: NEW TRANSLATION
 HOL_german_youth_netherlands_desc: "Mládež je budoucností národa. Zavedením německy inspirovaných výcvikových a ideologických programů vybudíme loajalitu, disciplínu a sílu u příští generace nizozemských občanů." # todo: NEW TRANSLATION
 HOL_national_labor_programs: "Zavést národní pracovní programy" # todo: NEW TRANSLATION
 HOL_national_labor_programs_desc: "Mobilizací pracovní síly v rámci státem vedených pracovních iniciativ odstraníme nezaměstnanost a zajistíme, že každý občan přispěje k prosperitě národa." # todo: NEW TRANSLATION
 HOL_stabilize_dutch_society: "Stabilizovat nizozemskou společnost" # todo: NEW TRANSLATION
 HOL_stabilize_dutch_society_desc: "S probíhajícími rozsáhlými reformami je zajištění stability a pořádku společnosti klíčové. Opatření k omezení nesouhlasu a prosazování kázně položí základ pro dlouhodobý úspěch." # todo: NEW TRANSLATION
 HOL_german_blood: "Německá krev" # todo: NEW TRANSLATION
 HOL_german_blood_desc: "Pouta krve a dědictví spojují germánské národy. Nizozemsko, jako součást tohoto společného původu, musí převzít roli vůdce. S opětovným sjednocením všech germánských národů vybudujeme mocné a nezlomné spojenectví, které zajistí nadřazenost naší rodové linie po celé Evropě." # todo: NEW TRANSLATION
 HOL_support_german_brothers: "Podpořte naše germánské bratry" # todo: NEW TRANSLATION
 HOL_support_german_brothers_desc: "Germánské národy čelily rozdělení a útrapám příliš dlouho. Poskytnutím naší podpory—politické i vojenské—posílíme vazby mezi našimi státy a vytyčíme cestu pro jednotný germánský osud." # todo: NEW TRANSLATION
 HOL_claim_german_leadership: "Proklamovat vedoucí postavení germánských národů" # todo: NEW TRANSLATION
 HOL_claim_german_leadership_desc: "Nizozemsko musí zaujmout své oprávněné místo jako vůdce germánského světa. Prosazením naší autority a sjednocením všech germánských národů pod jednou vlajkou vytvoříme nepřekonatelné spojenectví síly a dědictví." # todo: NEW TRANSLATION
 HOL_unite_with_germany: "Sjednotit se s Německem" # todo: NEW TRANSLATION
 HOL_unite_with_germany_desc: "Rozdělení germánských národů je nepřirozený stav. Začleněním Německa do naší vize jednoty posílíme moc a vybudujeme pevnější základ pro germánské impérium." # todo: NEW TRANSLATION
 HOL_luftwafe_legacy: "Převzít dědictví Luftwaffe" # todo: NEW TRANSLATION
 HOL_luftwafe_legacy_desc: "Luftwaffe Německa kdysi ovládala nebe Evropy. Modernizací jejích taktik a integrací jejích inovací dosáhneme nadřazenosti v letectvu napříč kontinentem a zajistíme bezpečnost a dominanci našich sil." # todo: NEW TRANSLATION
 HOL_blitzkrieg_legacy: "Ovládněte dědictví Blitzkriegu" # todo: NEW TRANSLATION
 HOL_blitzkrieg_legacy_desc: "Německo revolucionalizovalo válku doktrínou Blitzkriegu, která spojovala rychlost a přesnost k překonání nepřátel. Zdokonalením tohoto dědictví vybudujeme neuvěřitelnou vojenskou sílu, schopnou rychlých a rozhodujících vítězství." # todo: NEW TRANSLATION
 HOL_siegfriedline: "Železný štít" # todo: NEW TRANSLATION
 HOL_siegfriedline_desc: "Západní hranice germánského světa musí zůstat nepřekonatelná před jakoukoli cizí hrozbou. Vystavením ‚Železného štítu‘ vytvoříme moderní síť opevnění a obrany, která bude symbolem neochvějné síly a odolnosti germánského lidu. Tato nová linie bude stát jako svědectví našeho odhodlání a pohotovosti." # todo: NEW TRANSLATION
 HOL_anschluss: "Anšlus" # todo: NEW TRANSLATION
 HOL_anschluss_desc: "Osud Rakouska byl vždy spojen s germánskými národy. Znovusjednocením Rakouska se zbytkem germánského státu naplníme historickou vizi jednotného germánského domova." # todo: NEW TRANSLATION
 HOL_austrian_mountaineers: "Dědictví horské války" # todo: NEW TRANSLATION
 HOL_austrian_mountaineers_desc: "Rakouská historie je protkána zvládnutím horského boje, utvářená v drsných alpských prostředích Evropy. Začleněním tohoto dědictví do našich ozbrojených sil zajistíme, že všichni naši pěší jednotky budou schopni dominovat v horském terénu a proměníme přírodní překážky v strategické výhody." # todo: NEW TRANSLATION
 HOL_german_brotherhood_of_nations: "Německé bratrstvo národů" # todo: NEW TRANSLATION
 HOL_german_brotherhood_of_nations_desc: "Zřídíme bratrstvo podobně smýšlejících národů věnující se naší společné vizi. Toto bratrstvo bude stát v jednotě síly a vytvářet nepřekonatelné spojenectví proti těm, kdo se snaží podkopat náš osud." # todo: NEW TRANSLATION
 HOL_germanic_industrial_union: "Založte Germánskou průmyslovou unii" # todo: NEW TRANSLATION
 HOL_germanic_industrial_union_desc: "Jednotný průmyslový úsilí napříč germánskými národy zajistí silnou a soběstačnou ekonomiku. Koordinací výroby a sdílením zdrojů dosáhneme nevídané efektivity a ovládneme globální trhy." # todo: NEW TRANSLATION
 HOL_germanic_infrastructure_efforts: "Spustit germánské infrastrukturní snahy" # todo: NEW TRANSLATION
 HOL_germanic_infrastructure_efforts_desc: "Germánské bratrstvo musí být spojeno nejen ideologicky, ale i fyzicky. Vybudováním moderní infrastruktury spojující naše území zajistíme plynulý tok zdrojů, zboží a vojenských sil." # todo: NEW TRANSLATION
 HOL_rhineland_resources: "Rýnské zdroje" # todo: NEW TRANSLATION
 HOL_rhineland_resources_desc: "Rýnsko je pokladnicí uhlí, oceli a dalších životně důležitých surovin. Modernizací těžebních operací budeme pohánět průmyslové a vojenské ambice germánského bratrstva." # todo: NEW TRANSLATION
 HOL_invite_austria: "Pozvat Rakousko do Bratrstva národů" # todo: NEW TRANSLATION
 HOL_invite_austria_desc: "Postavení Rakouska v germánském světě je nepopiratelné. Pozváním Rakouska, aby se připojilo k Bratrstvu národů, posílíme naši frakci a do okruhu zapojíme další baštu germánského dědictví." # todo: NEW TRANSLATION
 HOL_austrian_mineral_wealth: "Rakouské minerální bohatství" # todo: NEW TRANSLATION
 HOL_austrian_mineral_wealth_desc: "Rakouské hory jsou bohaté na klíčové minerály, které jsou nezbytné pro náš průmysl. Vydobytím těchto zdrojů zajistíme, že průmyslová základna Bratrstva zůstane nepřekonatelná." # todo: NEW TRANSLATION
 HOL_railroad_of_germans: "Železnice germánských národů" # todo: NEW TRANSLATION
 HOL_railroad_of_germans_desc: "Impozantní železnice spojující germánské národy bude páteří našeho Bratrstva. Tento ambiciózní projekt usnadní obchod, mobilizaci a jednotu, čímž upevní naši nadřazenost v Evropě." # todo: NEW TRANSLATION
 HOL_kickstart_austrian_navy: "Oživit rakouské námořnictvo" # todo: NEW TRANSLATION
 HOL_kickstart_austrian_navy_desc: "Rakousko postrádá námořní tradici, což omezovalo jeho vliv na moře, avšak díky naší odbornosti v loděnicích se to změní. Využitím holandského dědictví námořní nadvlády vybudujeme Rakouské námořní kapacity a učiníme z něj klíčového přispěvatele k projekci moci Germánského bratrstva." # todo: NEW TRANSLATION
 HOL_integrate_austrian_industries: "Integrovat rakouské průmysly" # todo: NEW TRANSLATION
 HOL_integrate_austrian_industries_desc: "Průmysly Rakouska jsou klíčové pro sílu Germánského bratrstva. Plnou integrací jejich průmyslové základny do našeho ekonomického systému zajistíme bezprecedentní efektivitu a výrobu po celé Říši." # todo: NEW TRANSLATION
 HOL_fourth_reich: "Vyhlásit Čtvrtou Říši" # todo: NEW TRANSLATION
 HOL_fourth_reich_desc: "Nastal čas sjednotit Německo, Rakousko a Nizozemsko do jednoho nezlomného germánského státu. Čtvrtá říše bude zosobňovat sílu, disciplínu a ambice germánských národů a vybuduje říši, která bude dominovat Evropě i za ni." # todo: NEW TRANSLATION
 HOL_unification_dietsland: "Sjednocení Dietslandu" # todo: NEW TRANSLATION
 HOL_unification_dietsland_desc: "S anexí Flandry je vize sjednoceného Dietslandu blíž než kdy dřív. Nyní je důležité upevnit naši kontrolu, sjednotit správu a přivést holandské a vlámské národy pod jednu vlajku." # todo: NEW TRANSLATION
 HOL_integrate_flemish_army: "Integrovat Flámskou armádu" # todo: NEW TRANSLATION
 HOL_integrate_flemish_army_desc: "Flámské vojenské jednotky je třeba začlenit do holandských ozbrojených sil, aby vznikla jednotná, disciplinovaná a efektivní armáda. Tato integrace zajistí, že vojenská síla Dietslandu bude větší než součet jejích částí." # todo: NEW TRANSLATION
 HOL_enforce_dutch_language: "Vynutit nizozemštinu jako oficiální jazyk" # todo: NEW TRANSLATION
 HOL_enforce_dutch_language_desc: "Abychom vytvořili skutečně jednotný stát, musí být nizozemština oficiálním jazykem ve všech částech Dietslandu. Zavedením této politiky podpoříme společnou kulturní identitu a posílíme národní soudržnost." # todo: NEW TRANSLATION
 HOL_enforce_dutch_language_tt: "§GHalves§! náklady na §YNárodní zaměření§! pro §YFlámsko§!" # todo: NEW TRANSLATION
 HOL_rebuild_belgian_shipyards: "Obnovit belgické loděnice" # todo: NEW TRANSLATION
 HOL_rebuild_belgian_shipyards_desc: "Přístavy a loděnice Antverp a Zeebrugge jsou neocenitelné majetky. Modernizací těchto zařízení významně posílíme Dietslandovu námořní stavební kapacitu, čímž posílíme jak obchod, tak vojenskou sílu." # todo: NEW TRANSLATION
 HOL_glorify_dietsland: "Vychvalovat Dietsland" # todo: NEW TRANSLATION
 HOL_glorify_dietsland_desc: "Propagandistické snahy musí zdůrazňovat sílu a jednotu Dietslandu. Vychvalováním našich úspěchů a rozvíjením národního hrdství posílíme loajalitu našich lidí a vyjádříme naši vizi světu." # todo: NEW TRANSLATION
 HOL_integrate_flemish_defense_companies: "Integrovat vlámské obranné firmy" # todo: NEW TRANSLATION
 HOL_integrate_flemish_defense_companies_desc: "Obranný průmysl ve Flámsku má významný potenciál pro posun našich vojenských schopností dopředu. Začleněním vlámských obranných firem do Dietslandovy výrobní sítě posílíme naši schopnost efektivně vyzbrojovat naše síly." # todo: NEW TRANSLATION
 HOL_integrate_flemish_defense_companies_tt: "Odemkne §YSabca – výrobce letadel§!" # todo: NEW TRANSLATION
 HOL_flemish_industry_investments: "Investice do vlámského průmyslu" # todo: NEW TRANSLATION
 HOL_flemish_industry_investments_desc: "Průmyslová centra Flámska jsou klíčová pro budoucnost Dietslandu. Investicemi do těchto oblastí můžeme podpořit hospodářský růst a upevnit naši pozici jako průmyslové velmoci." # todo: NEW TRANSLATION
 HOL_harness_flemish_ports: "Využít vlámské přístavy" # todo: NEW TRANSLATION
 HOL_harness_flemish_ports_desc: "Přístavy Flámska jsou klíčové pro Dietslandův přístup k globálnímu obchodu a námořní síle. Strategické investice do Antverp a Zeebrugge zajistí plné využití jejich potenciálu, což prospěje jak naší ekonomice, tak naší armádě." # todo: NEW TRANSLATION
 HOL_d66: "D66" # todo: NEW TRANSLATION
 HOL_d66_desc: "D66 je v Nizozemsku majákem progresivismu a prosazuje demokracii, udržitelnost a sociální rovnost. Naše vize chce vést národ k budoucnosti inovací, inkluze a spolupráce a zajistit, aby každý občan měl hlas i podíl na budování lepšího zítřka." # todo: NEW TRANSLATION
 HOL_d66_democratic_institutions: "Posílit demokratické instituce" # todo: NEW TRANSLATION
 HOL_d66_democratic_institutions_desc: "D66 se zavazuje chránit základy demokracie. Zvýšením transparentnosti, odpovědnosti a účasti veřejnosti zajistíme, aby naše vláda zůstala spravedlivá a účinná ve službě občanům." # todo: NEW TRANSLATION
 HOL_d66_direct_democracy: "Podporovat přímou demokracii" # todo: NEW TRANSLATION
 HOL_d66_direct_democracy_desc: "Občané si zaslouží silnější hlas při utváření politiky, která ovlivňuje jejich životy. Prosazováním iniciativ, jako jsou závazná referenda a participativní rozpočtování, přiblíží D66 rozhodování lidem." # todo: NEW TRANSLATION
 HOL_d66_rule_of_law: "Bránit vládu zákona" # todo: NEW TRANSLATION
 HOL_d66_rule_of_law_desc: "Vláda zákona je zásadní pro spravedlivou a fungující společnost. D66 se zaměří na zajištění nezávislosti soudnictví, ochranu občanských svobod a boj proti korupci na všech úrovních správy." # todo: NEW TRANSLATION
 HOL_d66_climate_action_plan: "Provést klimatický akční plán" # todo: NEW TRANSLATION
 HOL_d66_climate_action_plan_desc: "Klimatická krize je jednou z největších výzev naší doby. Rozhodnými kroky včetně snižování emisí a podpory obnovitelné energie povede D66 úsilí o udržitelnou budoucnost." # todo: NEW TRANSLATION
 HOL_d66_green_energy: "Rozšířit investice do zelené energie" # todo: NEW TRANSLATION
 HOL_d66_green_energy_desc: "Přechod k obnovitelným zdrojům energie je klíčem k čistší a zelenější budoucnosti. D66 upřednostní investice do větrné, solární a další udržitelné energetiky a sníží naši závislost na fosilních palivech." # todo: NEW TRANSLATION
 HOL_d66_european_initiative: "Posílit evropskou spolupráci" # todo: NEW TRANSLATION
 HOL_d66_european_initiative_desc: "D66 věří, že Evropská unie je nezbytná pro naši společnou prosperitu a bezpečnost. Posílení vazeb s EU zajistí, že Nizozemsko zůstane vlivným členem evropského společenství." # todo: NEW TRANSLATION
 HOL_d66_social_progress: "Prosazovat sociální pokrok" # todo: NEW TRANSLATION
 HOL_d66_social_progress_desc: "Rovnost, inkluze a spravedlnost jsou základními kameny progresivní společnosti. D66 bude prosazovat politiku bojující proti nerovnosti, chránící menšiny a podporující rovné příležitosti pro všechny občany." # todo: NEW TRANSLATION
 HOL_d66_education_investments: "Investovat do vzdělávání" # todo: NEW TRANSLATION
 HOL_d66_education_investments_desc: "Vzdělání je klíčem k odemčení potenciálu budoucích generací. D66 upřednostní financování a reformy, které zajistí každému dítěti přístup ke kvalitnímu vzdělání." # todo: NEW TRANSLATION
 HOL_sgp: "Staatkundig Gereformeerde Partij" # todo: NEW TRANSLATION
 HOL_sgp_desc: "Staatkundig Gereformeerde Partij (SGP) je baštou křesťanského konzervatismu. Strana usiluje o správu země podle biblických principů a prosazuje morální společnost zakořeněnou ve víře, rodině a tradici." # todo: NEW TRANSLATION
 HOL_sgp_protect_sunday_rest: "Chraňte nedělní svatost" # todo: NEW TRANSLATION
 HOL_sgp_protect_sunday_rest_desc: "The Sabbath is a holy day of rest and worship, as commanded in scripture. By ensuring that businesses close and public life pauses on Sundays, we honor this sacred tradition and strengthen faith in our communities." # todo: NEW TRANSLATION
 HOL_sgp_religious_education_policy: "Rozšířit náboženské vyučování" # todo: NEW TRANSLATION
 HOL_sgp_religious_education_policy_desc: "Křesťanské vzdělávání je klíčové pro vštěpování biblických hodnot do budoucích generací. Financováním náboženských škol a ochranou jejich autonomie zachováváme morální základ naší společnosti." # todo: NEW TRANSLATION
 HOL_sgp_support_large_families: "Podporovat velké křesťanské rodiny" # todo: NEW TRANSLATION
 HOL_sgp_support_large_families_desc: "Rostoucí populace věrných občanů je klíčem ke silné zemi. Povzbuzováním velkých rodin a zajištěním jejich podpory zajistíme budoucnost naší víry i naší země." # todo: NEW TRANSLATION
 HOL_sgp_support_christian_unions: "Posílit křesťanské odbory" # todo: NEW TRANSLATION
 HOL_sgp_support_christian_unions_desc: "Křesťanské odbory poskytují důležitý morální rámec pro ochranu práv pracovníků. Zplnomocněním těchto organizací zajistíme rovnováhu mezi férovým zacházením a biblickými zásadami na pracovišti." # todo: NEW TRANSLATION
 HOL_sgp_secure_rural_communities: "Zabezpečit venkovské komunity" # todo: NEW TRANSLATION
 HOL_sgp_secure_rural_communities_desc: "Venkovské oblasti jsou srdcem nizozemské tradice a víry. Investicemi do venkovské infrastruktury, zemědělských inovací a podpory malých farmářů zajistíme, že tyto komunity budou nadále vzkvétat jako kolébky morálky a stability." # todo: NEW TRANSLATION
 HOL_sgp_strengthen_defense: "Posílit národní obranu" # todo: NEW TRANSLATION
 HOL_sgp_strengthen_defense_desc: "Abychom chránili naši suverenitu a křesťanské dědictví, musíme udržovat silnou armádu. Posílením ozbrojených sil a zajištěním pohotovosti chráníme národ před vnějšími i vnitřními hrozbami." # todo: NEW TRANSLATION
 HOL_sgp_resist_secularism: "Odolat sekulárnímu vlivu" # todo: NEW TRANSLATION
 HOL_sgp_resist_secularism_desc: "Sekularismus podkopává morální základ společnosti. Prosazováním křesťanských hodnot a bojem proti šíření sekulárních ideologií si SGP zachová Nizozemsko jako národ bohabojných." # todo: NEW TRANSLATION
 HOL_gl: "GroenLinks" # todo: NEW TRANSLATION
 HOL_gl_desc: "GroenLinks se zasazuje o udržitelnou, spravedlivou a inkluzivní společnost. Strana zakořeněná v environmentalismu a sociální spravedlnosti prosazuje zelenou energii, biodiverzitu a rovnost jako základní kameny budoucnosti Nizozemska." # todo: NEW TRANSLATION
 HOL_gl_affordable_housing_program: "Program dostupného bydlení" # todo: NEW TRANSLATION
 HOL_gl_affordable_housing_program_desc: "Bydlení je základní lidské právo. GroenLinks bude řešit krizi bydlení výstavbou dostupných a udržitelných domů a zajistí, že každý občan bude mít přístup k bezpečnému bydlení." # todo: NEW TRANSLATION
 HOL_gl_biodiversity_protection: "Ochrana biodiverzity" # todo: NEW TRANSLATION
 HOL_gl_biodiversity_protection_desc: "Přírodní stanoviště Nizozemska jsou ohrožena. GroenLinks povede snahy o ochranu ohrožených druhů, obnovení ekosystémů a zajištění prosperujícího prostředí pro budoucí generace." # todo: NEW TRANSLATION
 HOL_gl_digital_innovation: "Podporovat digitální inovace" # todo: NEW TRANSLATION
 HOL_gl_digital_innovation_desc: "Digitální technologie jsou klíčem k budoucnosti. Investováním do špičkového výzkumu a budováním robustní digitální infrastruktury zajistí GroenLinks, že Nizozemsko se stane lídrem v globálním technologickém prostředí." # todo: NEW TRANSLATION
 HOL_gl_international_solidarity: "Posílit mezinárodní solidaritu" # todo: NEW TRANSLATION
 HOL_gl_international_solidarity_desc: "Globální výzvy vyžadují globální spolupráci. GroenLinks bude usilovat o podporu míru, lidských práv a udržitelného rozvoje prostřednictvím aktivního zapojení do mezinárodních partnerství a organizací." # todo: NEW TRANSLATION
 HOL_gl_fair_trade_policy: "Zavést politiky férového obchodu" # todo: NEW TRANSLATION
 HOL_gl_fair_trade_policy_desc: "Celosvětový obchod musí být etický a udržitelný. GroenLinks prosazuje dohody o férovém obchodu, které upřednostňují environmentální standardy, práva pracovníků a snižování nerovnosti po celém světě." # todo: NEW TRANSLATION
 HOL_gl_diversify_workforce: "Diverzifikovat pracovní sílu" # todo: NEW TRANSLATION
 HOL_gl_diversify_workforce_desc: "Inkluzivní pracovní síla je silnější. GroenLinks bude podporovat politiky zajišťující rovné příležitosti pro všechny občany bez ohledu na jejich původ, aby vznikla spravedlivá a harmonická společnost." # todo: NEW TRANSLATION
 HOL_gl_transparent_governance: "Zajistit transparentní vládnutí" # todo: NEW TRANSLATION
 HOL_gl_transparent_governance_desc: "Důvěra ve vládnutí se buduje na odpovědnosti. GroenLinks bude klást důraz na transparentnost, aby občané byli informováni a mohli své vůdce držet zodpovědné." # todo: NEW TRANSLATION
 HOL_gl_youth_empowerment: "Posílit mládež" # todo: NEW TRANSLATION
 HOL_gl_youth_empowerment_desc: "Nadcházející generace je budoucnost naší země. GroenLinks vytvoří příležitosti pro mladé lidi, posílí jejich hlasy při rozhodování a podpoří jejich rozvoj." # todo: NEW TRANSLATION
 HOL_gl_energy_independence: "Dosáhnout energetické nezávislosti" # todo: NEW TRANSLATION
 HOL_gl_energy_independence_desc: "Zvětšením výroby obnovitelné energie a modernizací sítě zajistí energetickou nezávislost během přechodu na udržitelnou, zelenou budoucnost." # todo: NEW TRANSLATION
 HOL_reinstate_werkspoor: "Obnovit Werkspoor" # todo: NEW TRANSLATION
 HOL_reinstate_werkspoor_desc: "Werkspoor, dříve symbol nizozemské průmyslové vynalézavosti, bude oživen k vedení národních výrobních snah. Modernizací jeho provozu a investicemi do infrastruktury můžeme obnovit tuto ikonickou společnost v její bývalé slávě a podnítit hospodářský růst." # todo: NEW TRANSLATION
 HOL_curacao_oil_refinery_expansion: "Rozšíření ropné rafinerie Curaçao" # todo: NEW TRANSLATION
 HOL_curacao_oil_refinery_expansion_desc: "Od počátku 20. století je Curaçao domovem jedné z nejstrategičtějších ropných rafinerií v Karibiku. Rozšířením její kapacity a modernizací infrastruktury můžeme upevnit její roli jako klíčového aktiva pro nizozemskou ekonomiku a důležitého hráče na světových energetických trzích." # todo: NEW TRANSLATION
 HOL_aruba_aloe_trade_investments: "Oživit Arubský obchod s aloe" # todo: NEW TRANSLATION
 HOL_aruba_aloe_trade_investments_desc: "Aruba má bohatou historii v obchodě s aloe vera, dříve světový producent. Investováním do moderních zemědělských technik a obchodních sítí můžeme obnovit postavení Aruby jako vůdce ve vysokokvalitním exportu aloe a diverzifikovat její ekonomiku." # todo: NEW TRANSLATION
 HOL_bonaire_phosphate_mining: "Znovu investovat do fosfátových dolů Bonaire" # todo: NEW TRANSLATION
 HOL_bonaire_phosphate_mining_desc: "Kdysi byl fosfátový průmysl významným zdrojem Bonaire. V 20. století klesl. Obnovením snah o zodpovědné těžbu a export tohoto cenného zdroje můžeme obnovit ekonomickou relevanci Bonaire a zároveň vytvořit pracovní místa pro místní komunity." # todo: NEW TRANSLATION
 HOL_curacao_industrial_expansion: "Rozšířit průmyslový sektor Curaçao" # todo: NEW TRANSLATION
 HOL_curacao_industrial_expansion_desc: "Curaçao má nevyužitý potenciál pro průmyslový růst mimo tradiční ropnou rafinerii. Zřízením výrobních zařízení a diverzifikací ekonomiky můžeme vytvářet pracovní místa a snížit závislost na jednom odvětví." # todo: NEW TRANSLATION
 HOL_bonaire_infrastructure_improvement: "Zlepšit infrastrukturu Bonaire" # todo: NEW TRANSLATION
 HOL_bonaire_infrastructure_improvement_desc: "Ekonomický růst Bonaire je omezen zastaralou infrastrukturou. Modernizací silnic, přístavů a infrastruktury umožníme lepší konektivitu a podpoříme místní podniky, čímž připravíme cestu pro budoucí rozvoj." # todo: NEW TRANSLATION
 HOL_tulip_export_boost: "Rozšířit export tulipánů" # todo: NEW TRANSLATION
 HOL_tulip_export_boost_desc: "Tulipány jsou dlouhodobě symbolem Nizozemska a pilíř našich zemědělských vývozů. Investováním do marketingu a logistiky můžeme dominovat globálním květinovým trhům a zajistit, že nizozemské tulipány budou zdobit domovy po celém světě." # todo: NEW TRANSLATION
 HOL_markermeer_reclamation: "Znovuzískání Markermeer" # todo: NEW TRANSLATION
 HOL_markermeer_reclamation_desc: "Markermeer, ikonický projekt ze Zuiderzee prací, zůstává nevyužitým příslibem nizozemské vynalézavosti. Znovuzískáním jeho úrodných oblastí a optimalizací pro udržitelný rozvoj můžeme odemknout obrovský zemědělský potenciál, zavést projekty obnovitelné energie a vytvořit moderní bytové řešení, čímž zajistíme budoucnost naší země." # todo: NEW TRANSLATION
 HOL_delta_rhine_energy_corridor: "Rozvíjet energetický koridor Delta-Rýn" # todo: NEW TRANSLATION
 HOL_delta_rhine_energy_corridor_desc: "Region Delta-Rýn je ústředním bodem energetické infrastruktury Nizozemska. Modernizací jeho elektrické sítě a rozšířením výroby obnovitelné energie podél Rýna můžeme tento koridor proměnit v motor udržitelné energie, čímž zajistíme naši energetickou nezávislost a podpoříme evropské zelené iniciativy." # todo: NEW TRANSLATION
 HOL_asml_foundation_of_innovation: "Nadace inovací" # todo: NEW TRANSLATION
 HOL_asml_foundation_of_innovation_desc: "ASML, založená v roce 1984, zásadně změnila výrobu polovodičů vývojem špičkových lithografických strojů. Investováním do jejího výzkumu a zařízení můžeme zajistit, že ASML zůstane pilířem technologického pokroku a hospodářského růstu." # todo: NEW TRANSLATION
 HOL_asml_euv_technology: "Mistrovská litografie EUV" # todo: NEW TRANSLATION
 HOL_asml_euv_technology_desc: "Vývoj litografie EUV (extrémně ultrafialová litografie) od ASML představuje špičku v výrobě polovodičů. Zrychlením výroby a nasazením systémů EUV můžeme zajistit globální vedení v technologii mikročipů." # todo: NEW TRANSLATION
 HOL_asml_global_supply_chain: "Zabezpečit ASML globální dodavatelský řetězec" # todo: NEW TRANSLATION
 HOL_asml_global_supply_chain_desc: "Jako klíčový dodavatel vyspělého polovodičového vybavení spoléhá ASML na složitý mezinárodní dodavatelský řetězec. Zajištěním těchto vazeb a navazováním strategických partnerství můžeme chránit její provoz proti globální nestabilitě." # todo: NEW TRANSLATION
 HOL_asml_strategic_partnerships: "Vytvořte strategická partnerství pro ASML" # todo: NEW TRANSLATION
 HOL_asml_strategic_partnerships_desc: "ASML navázala klíčová partnerství s vojenskými dodavateli, aby integrovala vyspělou polovodičovou technologii do špičkových zbraňových systémů, čímž zajistí, že Nizozemsko zůstane lídrem moderních obranných schopností." # todo: NEW TRANSLATION
 HOL_asml_dutch_technological_dominance: "Upevněte technologickou převahu" # todo: NEW TRANSLATION
 HOL_asml_dutch_technological_dominance_desc: "ASML není jen společnost; je symbolem nizozemské inovace a globálního vlivu. Díky posílení investic do vysoce technologických sektorů můžeme Nizozemsko etablovat jako neotřesného lídra v pokročilých technologiích." # todo: NEW TRANSLATION
 HOL_asml_high_na_euv: "Průkopnictví v litografii High-NA EUV" # todo: NEW TRANSLATION
 HOL_asml_high_na_euv_desc: "Systémy ASML TWINSCAN EXE nové generace posouvají litografii k numerické apertuře 0,55 a tisknou jemnější obvody, než jaké dokáže nabídnout jakýkoli konkurent. Zvládnutí technologie High-NA EUV udrží naše stroje nepostradatelné pro každou přední továrnu na světě." # todo: NEW TRANSLATION
 HOL_asml_imec_partnership: "Otevřít společnou laboratoř High-NA s imec" # todo: NEW TRANSLATION
 HOL_asml_imec_partnership_desc: "Ve Veldhovenu provozují ASML a výzkumný institut imec společnou laboratoř High-NA EUV, která výrobcům čipů a dodavatelům materiálů poskytuje první přístup k novým skenerům. Laboratoř upevňuje postavení Nizozemska jako testovacího prostoru pro nejpokročilejší polovodiče na světě." # todo: NEW TRANSLATION
 HOL_asml_brainport_campus: "Rozšířit průmyslový kampus Brainport" # todo: NEW TRANSLATION
 HOL_asml_brainport_campus_desc: "ASML se díky vládnímu závazku v hodnotě několika miliard eur rozšiřuje v kampusu Brainport Industry Campus u Eindhovenu namísto přesunu do zahraničí. Nové čisté prostory a zařízení dodavatelů ukotví polovodičový průmysl i jeho daňové příjmy pevně na nizozemské půdě." # todo: NEW TRANSLATION
 HOL_tullip_bonus: "Vývoz tulipánů" # todo: NEW TRANSLATION
 HOL_tullip_bonus_desc: "Celostátní snaha ovládnout globální obchod s tulipány je v plném proudu. Tato dočasná iniciativa posílí výrobní a exportní kapacity, přinese nárůst ekonomické aktivity a posílí pověst Nizozemska jako tulipánového hlavního města světa." # todo: NEW TRANSLATION
 HOL_global_vision: "Nizozemská globální vize" # todo: NEW TRANSLATION
 HOL_global_vision_desc: "Nizozemsko bylo vždy zemí obchodníků a diplomatů. Zatímco Evropa zůstává klíčovým zaměřením, musíme rozšířit náš dosah mimo Brusel a jednat přímo s globálními partnery, abychom zabezpečili naši budoucnost." # todo: NEW TRANSLATION
 HOL_atlantic_defence_commitments: "Atlantické obranné závazky" # todo: NEW TRANSLATION
 HOL_atlantic_defence_commitments_desc: "V době rostoucí globální nestability je NATO základem bezpečnosti Nizozemska. Potvrzením našeho závazku k alianci můžeme zajistit obrannou spolupráci a technologické výhody od našich spojenců." # todo: NEW TRANSLATION
 HOL_joint_military_programs: "Společné vojenské programy" # todo: NEW TRANSLATION
 HOL_joint_military_programs_desc: "Moderní konflikty vyžadují pokročilou spolupráci. Partnerství s spojenci z NATO na společných vojenských programech nám umožní přístup k nejmodernějším technologiím a posílí náš domácí obranný sektor." # todo: NEW TRANSLATION
 HOL_maritime_security_leadership: "Vůdčí postavení v námořní bezpečnosti" # todo: NEW TRANSLATION
 HOL_maritime_security_leadership_desc: "Nizozemsko je námořní země a naše bezpečí závisí na otevřených námořních tepnách. Rozšířením naší role v mezinárodní námořní bezpečnosti posílíme náš globální vliv a ekonomické zabezpečení." # todo: NEW TRANSLATION
 HOL_economic_development_antilles: "Hospodářské oživení Nizozemského Karibiku" # todo: NEW TRANSLATION
 HOL_economic_development_antilles_desc: "Nizozemský Karibik se dlouhodobě potýká s hospodářskou nestabilitou, závislostí na turistice a nedostatečnou infrastrukturou. Implementací politik inspirovaných Rijksdienst Caribisch Nederland můžeme investovat do udržitelných odvětví, zlepšit obchodní efektivitu a modernizovat hospodářské základy ostrovů." # todo: NEW TRANSLATION
 HOL_deepwater_water_expansion_program: "Rozšíření karibských hlubokovodních přístavů" # todo: NEW TRANSLATION
 HOL_deepwater_water_expansion_program_desc: "S rostoucím mezinárodním obchodem se rozšíření přístavů Willemstad, Oranjestad a Philipsburg promění Nizozemský Karibik v globální logistické námořní centrum. Modernizací těchto přístavů s know-how z Rotterdamu můžeme přilákat mezinárodní lodní dopravce a zvýšit ekonomický výkon." # todo: NEW TRANSLATION
 HOL_revitilaze_dutch_latin_trade: "Oživení nizozemsko-latinskoamerických obchodních tras" # todo: NEW TRANSLATION
 HOL_revitilaze_dutch_latin_trade_desc: "Po staletí hráli nizozemští obchodníci klíčovou roli v obchodu se Jižní Amerikou a Karibikem. Obnovením obchodních dohod prostřednictvím Nizozemských komor pro obchod v Latinské Americe (Holland House Network) můžeme posílit hospodářské vazby a obnovit vliv Nizozemska v regionálním obchodě." # todo: NEW TRANSLATION
 HOL_dutch_latin_energy_cooperation: "Nizozemsko-latinskoamerická energetická spolupráce" # todo: NEW TRANSLATION
 HOL_dutch_latin_energy_cooperation_desc: "Latinská Amerika je bohatá na nerostné zdroje a nizozemské firmy jako Royal Dutch Shell a SBM Offshore dlouhodobě hrají roli v mořském vrtání a obnovitelné energii. Posílení energetické spolupráce nám umožní zajistit strategické dohody o ropě, LNG a obnovitelné energii." # todo: NEW TRANSLATION
 HOL_caribbean_naval_initiative: "Program rozšíření námořnictva Karibiku Nizozemska" # todo: NEW TRANSLATION
 HOL_caribbean_naval_initiative_desc: "Karibik zůstává zranitelný vůči pirátství, pašování a geopolitickým napětím. Posílení přítomnosti Královského Nizozemského námořnictva na Marinekazerne Parera a na letecké základně Hato umožní rychlá nasazení, lepší hlídky a lepší spolupráci s NATO a regionálními spojenci." # todo: NEW TRANSLATION
 HOL_dutch_caribbean_coast_guard: "Modernizace Pobřežní stráže Karibiku Nizozemska" # todo: NEW TRANSLATION
 HOL_dutch_caribbean_coast_guard_desc: "Kustwacht Caribisch Gebied hraje klíčovou roli v protidrogových operacích a námořní bezpečnosti. Rozšíření flotily o patrolní lodě Damen Shipyards a navýšení společných cvičení s Pobřežní stráží USA zajistí regionální stabilitu a strategickou kontrolu Nizozemska." # todo: NEW TRANSLATION
 HOL_joint_defense_latin_america: "Společný obranný pakt s Latinskou Amerikou" # todo: NEW TRANSLATION
 HOL_joint_defense_latin_america_desc: "Regionální bezpečnost v Latinské Americe je čím dál více křehká, s organizovaným zločinem, spory na hranicích a geopolitickou soupeřivostí. Posílení obranné spolupráce prostřednictvím Inter-American Defense Board a vojenskými výcvikovými programy s Brazílií, Kolumbií a Mexikem posílí náš vliv a ochrání naše zájmy." # todo: NEW TRANSLATION
 HOL_dutch_caribbean_federation: "Návrh federace Nizozemského Karibiku" # todo: NEW TRANSLATION
 HOL_dutch_caribbean_federation_desc: "Politický status Nizozemského Karibiku zůstává roztříštěný, s různou mírou autonomie mezi Aruba, Curaçao, Sint Maarten a ostrovy BES. Federální struktura—modelovaná podle stávajícího rámce Království—by zajistila rovné zastoupení, hospodářskou integraci a stabilitu správy." # todo: NEW TRANSLATION
 HOL_autonomy_development_pact: "Dohoda o rozvoji autonomie Karibiku" # todo: NEW TRANSLATION
 HOL_autonomy_development_pact_desc: "Zajištění hospodářské a politické autonomie Nizozemského Karibiku je klíčové pro udržení stability. Formální dohoda o autonomii—modelovaná podle Charty pro Království Nizozemska z roku 1954—zajistí větší samosprávu a zároveň udrží ostrovy pod nizozemskou ochranou a hospodářskou politikou." # todo: NEW TRANSLATION
 HOL_bijzondere_gemeenten: "Integrace ostrovů BES" # todo: NEW TRANSLATION
 HOL_bijzondere_gemeenten_desc: "Ostrovy Bonaire, Sint Eustatius a Saba v současnosti mají status bijzondere gemeenten (speciálních obcí) v Nizozemsku. Zlepšení jejich právní a hospodářské integrace s pevninou zajistí lepší veřejné služby, infrastrukturu a finanční stabilitu." # todo: NEW TRANSLATION
 HOL_dutch_american_friendship: "První přátelé" # todo: NEW TRANSLATION
 HOL_dutch_american_friendship_desc: "Po staletí udržují Nizozemsko a Spojené státy silné diplomatické, ekonomické a vojenské vazby. Jak se mění globální bezpečnost a ekonomické prostředí, musíme tuto spolupráci znovu potvrdit a budovat pro budoucnost." # todo: NEW TRANSLATION
 HOL_support_intervention_iraq: "Podpořit intervenci v Iráku" # todo: NEW TRANSLATION
 HOL_support_intervention_iraq_desc: "Po útocích z 11. září a rostoucí nestabilitě na Blízkém východě zahájily Spojené státy vojenskou intervenci v Iráku s odvoláním na hrozbu zbraní hromadného ničení a potřebu rozložit autoritářské režimy. Jako blízký spojenec NATO a zastánce mezinárodní bezpečnosti musí Nizozemsko rozhodnout, zda tuto operaci podpoří. Ačkoli mise zůstává kontroverzní, připojení ke koalici by znovu potvrdilo naše transatlantické partnerství a posílilo nizozemský vliv v globálním úsilí o bezpečnost." # todo: NEW TRANSLATION
 HOL_operation_market_vision: "Operace Market Vision" # todo: NEW TRANSLATION
 HOL_operation_market_vision_desc: "Navazováním na naši společnou vojenskou historii můžeme posílit americko-nizozemskou spolupráci prostřednictvím společných výcviků, sdílení zpravodajských informací a partnerství v obranném průmyslu." # todo: NEW TRANSLATION
 HOL_asml_partnership_USA: "Vytvořit technologické partnerství ASML–USA" # todo: NEW TRANSLATION
 HOL_asml_partnership_USA_desc: "ASML stojí v jádru globálního polovodičového průmyslu a Spojené státy se snaží zajistit si technologický náskok v sílícím rozdělení mezi Východem a Západem. Strategickým propojením nizozemského a amerického výzkumu a vývoje můžeme vést společné inovace v pokročilé litografii, kybernetické obraně a letecké výrobě. Partnerství posílí naše postavení v západním obranném ekosystému, může však přinést diplomatické náklady." # todo: NEW TRANSLATION
 HOL_lng_cooperation: "Zřídit strategickou dohodu Shell–LNG" # todo: NEW TRANSLATION
 HOL_lng_cooperation_desc: "Energetické výzvy 21. století vyžadují odolnost, diverzifikaci a strategická spojenectví. Rozšířením spolupráce v oblasti LNG se společností Shell a sladěním naší energetické logistiky s klíčovými partnery můžeme zajistit stabilní dodávky paliv, zvýšit investice do infrastruktury a posílit globální zásobovací sítě. Větší závislost na trasách fosilních paliv však může vyvolat ekologický a politický odpor." # todo: NEW TRANSLATION
 HOL_suriname_alignment: "Strategické sladění se Surinamem" # todo: NEW TRANSLATION
 HOL_suriname_alignment_desc: "Navzdory historickým poutům a společnému jazyku zůstaly vztahy mezi Nizozemskem a Surinamem opatrné od vyhlášení nezávislosti Surinamu v roce 1975. Podpořením obnoveného diplomatického přístupu můžeme vybudovat společnou základnu pro regionální vliv, kulturní výměnu a hospodářské zapojení v Jižní Americe." # todo: NEW TRANSLATION
 HOL_suriname_trade_development_agreement: "Obchodně-rozvojová dohoda" # todo: NEW TRANSLATION
 HOL_suriname_trade_development_agreement_desc: "Prostřednictvím bilaterálních jednání budeme usilovat o komplexní obchodně-rozvojovou dohodu se Surinamem. Tato dohoda posílí vzájemný přístup na trhy, zlepší přístavní infrastrukturu a podpoří nizozemské investice do surinamského zemědělství, logistiky a přírodních zdrojů." # todo: NEW TRANSLATION
 HOL_educational_cultural_exchange_program: "Program vzdělávací a kulturní výměny" # todo: NEW TRANSLATION
 HOL_educational_cultural_exchange_program_desc: "Budování trvalých vazeb vyžaduje víc než ekonomiku — vyžaduje lidi. Zřídíme program vzdělávací a kulturní výměny mezi nizozemskými a surinamskými institucemi, podporující akademické stipendia, programy v nizozemštině a iniciativy na ochranu kulturního dědictví." # todo: NEW TRANSLATION
 HOL_rebuild_infrastructure_paramaribo: "Obnovit infrastrukturu v Paramaribu" # todo: NEW TRANSLATION
 HOL_rebuild_infrastructure_paramaribo_desc: "Hlavní město Paramaribo potřebuje intenzivní investice do infrastruktury. Využijeme zkušenosti nizozemského urbanistického plánování a regionálních rozvojových fondů a financujeme nové silnice, obnovení architektury z koloniální éry a modernizaci logistiky pro podporu hospodářského růstu Surinamu." # todo: NEW TRANSLATION
 HOL_invest_suriname_resources: "Investice do sektoru přírodních zdrojů" # todo: NEW TRANSLATION
 HOL_invest_suriname_resources_desc: "Surinam skrývá nevyužitý bohatství v zlatě, bauxitu a ropných zásobách na mořském dně. Prostřednictvím společných podniků a průzkumných kontraktů s nizozemskými firmami můžeme oživit těžební a nerostný sektor, zatímco zajistíme dlouhodobou udržitelnost těžby a spravedlivé podíly na ziscích." # todo: NEW TRANSLATION
 HOL_maritime_suriname_agreement: "Námořní dohoda se Surinamem" # todo: NEW TRANSLATION
 HOL_maritime_suriname_agreement_desc: "Námořní bezpečnost a obchod jsou zásadní pro budoucnost Surinamu. Podpisem bilaterální námořní dohody umožníme společné patroly, nizozemskou pomoc v pobřežní infrastruktuře a zabezpečené obchodní trasy, spojující Paramaribo s karibskou a atlantskou ekonomikou." # todo: NEW TRANSLATION
 HOL_train_suriname_forces: "Školení surinamských ozbrojených sil" # todo: NEW TRANSLATION
 HOL_train_suriname_forces_desc: "Na podporu stability a suverenity v regionu zahájíme program vojenské pomoci k výcviku surinamských ozbrojených sil. Zřetel na logistiku, operace proti narkotikům a schopnosti pro mírové mise—toto partnerství prohloubí obranné vazby a posílí místní bezpečnost." # todo: NEW TRANSLATION
 HOL_d66_climate_action_planidea: "Klimatický akční plán D66" # todo: NEW TRANSLATION
 HOL_d66_climate_action_planidea_desc: "Klimatický akční plán D66 s odvážným závazkem bojovat proti změně klimatu urychluje přechod k obnovitelné energii, upřednostňuje udržitelnost a snižuje emise, čímž staví Nizozemsko do role lídra globálního úsilí o ochranu životního prostředí." # todo: NEW TRANSLATION
 HOL_buildup_atlantic_fleet_idea: "Rozšíření Atlantské flotily" # todo: NEW TRANSLATION
 HOL_buildup_atlantic_fleet_idea_desc: "Nizozemsko masivně investuje do rozšiřování a modernizace své Atlantské flotily, aby znovu získalo dominanci nad klíčovými námořními trasami. Silné námořnictvo bude páteří našich snah o obnovení kontroly nad územími Západoindické společnosti a projekci nizozemské síly po celém regionu." # todo: NEW TRANSLATION
 HOL_country_prepare_for_the_dutch1: "Připravte se na nizozemskou agresi" # todo: NEW TRANSLATION
 HOL_country_prepare_for_the_dutch_desc1: "Nizozemsko zahájilo mobilizaci svých sil a přípravu kampaně za znovuzískání území, která považuje za součást svého historického dědictví. Musíme posílit naši obranu a vyzvat náš lid, aby odolal této hrozící hrozbě." # todo: NEW TRANSLATION
 HOL_country_prepare_for_the_dutch2_tt: "§YSpošle nabídku všem zemím, které odolávají [HOL.GetAdjective] agresi, aby se připojily k obranné alianci proti [HOL.GetNameWithFlag].\n Obranná aliance vyvolá válku členům, pokud bude napaden některý z nich [HOL.GetNameWithFlag]!§!" # todo: NEW TRANSLATION
 HOL_non_functioning_government: "Nefunkční vláda" # todo: NEW TRANSLATION
 HOL_non_functioning_government_desc: "Návrat královské moci způsobil paralyzaci vlády. Byrokratická neefektivita, politická nestabilita a oslabená mezinárodní důvěra oslabily správu země a její diplomatický kredit." # todo: NEW TRANSLATION
 HOL_strengthening_states: "Posílené státy" # todo: NEW TRANSLATION
 HOL_strengthening_states_desc: "Generální státy nyní pracují ve spolupráci s monarchií, čímž podporují vyváženější a efektivnější vládnutí. Stabilita se zlepšuje a administrativní náklady jsou pod kontrolou." # todo: NEW TRANSLATION
 HOL_constitutional_reforms: "Ústavní monarchie" # todo: NEW TRANSLATION
 HOL_constitutional_reforms_desc: "Monarchie funguje v rámci ústavy, zajišťuje jasné vládní pravomoci a snižuje neefektivitu. Stabilita se vrátila a vliv zahraničních mocností byl oslaben." # todo: NEW TRANSLATION
 HOL_empowering_local_governments_idea: "Decentralizovaná správa" # todo: NEW TRANSLATION
 HOL_empowering_local_governments_idea_desc: "Moc byla svěřena regionálním vládám, což zlepšilo místní autonomii a administrativní efektivitu. Dekentralizace posílila stabilitu a podpořila efektivnější ekonomickou strukturu." # todo: NEW TRANSLATION
 HOL_centralized_governance_idea: "Centralizovaná správa" # todo: NEW TRANSLATION
 HOL_centralized_governance_idea_desc: "Koruna centralizovala moc, čímž vytvořila jednotný, ale rigidní vládní systém. Byrokratické náklady se zvýšily, ale politická moc byla soustředěna, aby posílila kontrolu monarchie." # todo: NEW TRANSLATION
 HOL_restore_nobility_influence_idea: "Obnovený vliv šlechty" # todo: NEW TRANSLATION
 HOL_restore_nobility_influence_idea_desc: "Šlechta opět získala svou roli jako pilíř královského vládnutí. Její vliv posiluje autoritu monarchie, podporuje politickou loajalitu a posiluje pocit kulturní soudržnosti." # todo: NEW TRANSLATION
 HOL_royal_patronage_culture: "Královské kulturní oživení" # todo: NEW TRANSLATION
 HOL_royal_patronage_culture_desc: "Aktivní královskou patronáží se obnovuje kulturní hrdost a národní jednota. Monarchie se stala sjednocujícím symbolem, který posiluje identitu země i její stabilitu." # todo: NEW TRANSLATION
 HOL_nobility_backed_military_idea: "Šlechtou vedená armáda" # todo: NEW TRANSLATION
 HOL_nobility_backed_military_idea_desc: "Šlechta převzala vedoucí role v armádě a zajišťuje věrnost koruně. Vojenská efektivita se zlepšila a autorita monarchie je zajištěna prostřednictvím ozbrojených sil." # todo: NEW TRANSLATION
 HOL_NAM1: "Nederlandse Aardolie Maatschappij" # todo: NEW TRANSLATION
 HOL_NAM1_desc: "Nederlandse Aardolie Maatschappij (NAM) je nizozemská společnost zabývající se ropou a zemním plynem, založená v roce 1947 jako společný podnik Shell a ExxonMobil. NAM je největším producentem zemního plynu v Nizozemsku, odpovědnou za průzkum, těžbu a distribuci zemního plynu a ropy, zejména z plynárenského pole Groningen. Společnost hraje v nizozemském energetickém sektoru významnou roli po desetiletí." # todo: NEW TRANSLATION
 HOL_shell1: "Royal Shell" # todo: NEW TRANSLATION
 HOL_shell1_desc: "Shell, oficiálně známý jako Royal Dutch Shell, je nadnárodní ropná a plynárenská společnost se sídlem v Haagu v Nizozemsku a registrovaná ve Spojeném království. Společnost založená v roce 1907 patří mezi největší energetické firmy na světě a působí ve všech oblastech ropného a plynárenského průmyslu včetně průzkumu, těžby, rafinace a distribuce. Významné zájmy má také v oblasti obnovitelné energie a infrastruktury pro elektromobily." # todo: NEW TRANSLATION
 HOL_shell2a: "Royal Green Shell" # todo: NEW TRANSLATION
 HOL_shell2a_desc: "Shell, globální energetický gigant, se stále více zaměřuje na přechod k udržitelné budoucnosti. Společnost si stanovila ambiciózní cíl stát se do roku 2050 energetickou firmou s nulovými čistými emisemi. Shell masivně investuje do obnovitelných zdrojů včetně větru, slunce a biopaliv a rozšiřuje své působení v infrastruktuře pro elektromobily. Prostřednictvím iniciativ, jako je zachycování a ukládání uhlíku, chce Shell výrazně snížit svou uhlíkovou stopu. Tento posun k ekologičtější energii je součástí širší strategie reakce na rostoucí globální poptávku po čistších a udržitelnějších energetických řešeních." # todo: NEW TRANSLATION
 HOL_shell2b: "Royal Shell" # todo: NEW TRANSLATION
 HOL_shell2b_desc: "Shell, jedna z největších ropných a plynárenských společností na světě, zůstává dominantní silou v průmyslu fosilních paliv. Díky rozsáhlé síti činností zahrnujících průzkum, těžbu, rafinaci a distribuci hraje klíčovou roli v zásobování světa energií. Společnost disponuje rozsáhlými zásobami a infrastrukturou zaměřenou na těžbu ropy a zemního plynu a významně přispívá ke globální spotřebě energie. Navzdory rostoucím investicím do obnovitelné energie zůstává její hlavní podnikání silně závislé na fosilních palivech, což z ní činí klíčového hráče současného globálního energetického prostředí." # todo: NEW TRANSLATION
 HOL_Dutch_Agriculture0: "Nizozemské zemědělství" # todo: NEW TRANSLATION
 HOL_Dutch_Agriculture0_desc: "Nizozemské zemědělství je pozoruhodným příkladem efektivity a inovací, díky němuž je Nizozemsko jedním z světových lídrů v zemědělské produkci, navzdory relativně malé ploše. Země je globálním lídrem ve vysoce technickém zemědělství, včetně pěstování ve sklenících, precizního zemědělství a udržitelných postupů. Tyto inovace umožňují nizozemským zemědělcům vyrábět velké množství potravin s minimálním dopadem na životní prostředí, využívající nejmodernější technologie k optimalizaci spotřeby vody, energie a živin. Nizozemsko je také významným vývozcem široké škály zemědělských produktů, od zeleniny a květin po mléčné výrobky a maso. Tato kombinace špičkové technologie, udržitelnosti a produktivity učinila nizozemské zemědělství hybnou silou v globálním potravinářském průmyslu." # todo: NEW TRANSLATION
 HOL_dutch_trade1: "Legendární obchodníci" # todo: NEW TRANSLATION
 HOL_dutch_trade1_desc: "Nizozemští obchodníci mají dlouhou a slavnou historii a od zlatého věku 17. století hrají klíčovou roli ve světovém obchodu. Nizozemsko se svou strategickou polohou a rozsáhlou sítí přístavů po staletí slouží jako centrum mezinárodního obchodu. Nizozemští obchodníci se významně podíleli na budování globálních obchodních tras, zejména prostřednictvím Nizozemské východoindické společnosti (VOC), jedné z prvních nadnárodních korporací na světě. I dnes mají značný vliv na globálním trhu, zejména v zemědělství, logistice a financích. Jsou známí odborností v logistice, inovacemi v řízení dodavatelských řetězců a silnými mezinárodními vazbami, které pomáhají udržovat pověst Nizozemska jako klíčového hráče světového obchodu." # todo: NEW TRANSLATION
 HOL_European_Railway_Developments_idea: "Rozvoj evropské železnice" # todo: NEW TRANSLATION
 HOL_European_Railway_Developments_idea_desc: "Nizozemsko se aktivně podílí na rozšiřování a modernizaci evropské železniční sítě, čímž přispívá k projektům zaměřeným na zvýšení přeshraniční mobility, zkrácení doby cestování a podporu udržitelné dopravy. Mezi klíčové rozvoje patří integrace holandského železničního systému s vysokorychlostními sítěmi jako Thalys a Eurostar, které spojují hlavní nizozemská města jako Amsterdam a Rotterdam s Paříží, Londýnem a Bruselem. Kromě toho je Nizozemsko silným zastáncem iniciativy TEN-T (Trans-European Transport Network), která usiluje o vytvoření hladké železniční sítě po celé Evropě, zlepšující služby pro cestující i nákladní dopravu." # todo: NEW TRANSLATION
 HOL_Water_Sector1: "Mistři vody" # todo: NEW TRANSLATION
 HOL_Water_Sector1_desc: "Nizozemský vodní sektor je celosvětově uznávaný pro svou odbornost ve vodohospodářství, poháněný jedinečnou geografií Nizozemska, kde velká část pevniny leží pod úrovní moře. Nizozemští inženýři a firmy jsou lídry v vývoji inovativních řešení pro kontrolu povodní, čištění vody a udržitelné využívání vody. Země byla průkopníkem ve výstavbě pokročilé infrastruktury, jako jsou hráze, protipovodňové bariéry a polderové systémy, které jsou klíčové pro řízení hladin vody a prevenci povodní. Mezinárodně je nizozemský vodní sektor vysoce respektován, s nizozemskými experty často zapojenými do globálních projektů souvisejících s ochranou pobřeží, městským vodohospodářstvím a adaptací na klimatické změny. Tato kombinace špičkové techniky, staletí zkušeností a závazku k udržitelnosti dělá z nizozemského vodního sektoru důležitého přispěvatele k řešení světových vodních problémů." # todo: NEW TRANSLATION
 HOL_project_beethoven_state_idea1: "Projekt Beethoven" # todo: NEW TRANSLATION
 HOL_project_beethoven_state_idea1_desc: "Projekt Beethoven je významnou iniciativou nizozemské vlády ve spolupráci s regionálními úřady, jejímž cílem je investovat do posílení podnikatelského prostředí a infrastruktury polovodičového sektoru v Brainportu Eindhoven. Projekt má zvýšit globální konkurenceschopnost regionu v oblasti polovodičových technologií řešením kritických potřeb, jako je rozvoj talentů, zlepšení infrastruktury a bydlení. Tato investice je považována za nezbytnou pro zachování postavení Nizozemska jako předního centra špičkového průmyslu, se zvláštním důrazem na udržení klíčových hráčů, jako je ASML, v zemi." # todo: NEW TRANSLATION
 HOL_SGM_Idea: "Spring Global Mail" # todo: NEW TRANSLATION
 HOL_SGM_Idea_desc: "Spring Global Mail je mezinárodní poskytovatel poštovních služeb a logistiky, původně založený jako společný podnik TNT Post (nyní PostNL) a Royal Mail. Společnost se specializuje na mezinárodní poštovní řešení, nabízí služby v doručování balíků, direct mail a firemní poštu po celém světě. Spring Global Mail je známý pro své know-how v řízení mezinárodních poštovních toků, využívající síť, která pokrývá více než 190 zemí. Společnost slouží podnikům všech velikostí a nabízí na míru šitá řešení pro e-commerce, direct marketing a globickou obchodní korespondenci, s důrazem na efektivitu, spolehlivost a nákladovou efektivitu." # todo: NEW TRANSLATION
 HOL_randstad_economy1: "Ekonomika Randstadu" # todo: NEW TRANSLATION
 HOL_randstad_economy1_desc: "Ekonomika Randstadu označuje hospodářskou velmoc Nizozemska, která zahrnuje silně urbanizovanou a hustě osídlenou oblast kolem měst Amsterdam, Rotterdam, Haag a Utrecht. Tento region je jedním z nejvýznamnějších ekonomických center Evropy a významně přispívá k nizozemské ekonomice. Randstad se vyznačuje rozmanitou hospodářskou základnou s klíčovými odvětvími, jako jsou finance, logistika, technologie, kreativní průmysl a obchod. Amsterdam slouží jako významné finanční centrum, zatímco Rotterdam hostí jeden z největších přístavů na světě, zásadní pro mezinárodní obchod. Region těží také z vysoce kvalifikované pracovní síly, robustní infrastruktury a silného důrazu na inovace a udržitelnost, díky čemuž je klíčovou hnací silou hospodářského růstu Nizozemska." # todo: NEW TRANSLATION
 HOL_zuidas_development_idea: "Rozvoj Zuidas" # todo: NEW TRANSLATION
 HOL_zuidas_development_idea_desc: "Rozvoj Zuidas je rozsáhlý městský projekt v Amsterdamu zaměřený na vytvoření dynamické obchodní čtvrti a smíšené oblasti sloužící jako mezinárodní centrum obchodu, financí a právních služeb. Zuidas, často označovaný za finanční míli Nizozemska, je domovem mnoha nadnárodních společností, advokátních kanceláří a finančních institucí. Projekt má vytvořit víc než jen obchodní centrum: zahrnuje rozsáhlé obytné oblasti, kulturní zařízení, zelené plochy a kvalitní infrastrukturu včetně výborného spojení veřejnou dopravou." # todo: NEW TRANSLATION
 HOL_international_peace_city_idea: "Haag – mezinárodní město míru a spravedlnosti" # todo: NEW TRANSLATION
 HOL_international_peace_city_idea_desc: "Haag je mezinárodně uznáván jako město míru a spravedlnosti, což odráží jeho roli globálního centra mezinárodního práva a diplomacie. Sídlí v něm více než 200 mezinárodních organizací včetně Mezinárodního soudního dvora, Mezinárodního trestního soudu a Stálého rozhodčího soudu. Tyto instituce hrají klíčovou roli při řešení mezinárodních sporů, stíhání válečných zločinů a prosazování lidských práv po celém světě." # todo: NEW TRANSLATION
 HOL_regio_economy1: "Ekonomika provincií" # todo: NEW TRANSLATION
 HOL_regio_economy1_desc: "Hospodářská síla Nizozemska je stále více poháněna silnými stránkami jeho regionů. Na severu vynikají provincie jako Groningen v oblasti obnovitelné energie, zatímco východní provincie, například Gelderland, jsou centry pokročilé výroby a logistiky. Jižní provincie včetně Severního Brabantska vedou v high-tech odvětvích, jako jsou polovodiče a biotechnologie. Tato regionální rozmanitost zajišťuje vyváženou a odolnou národní ekonomiku, v níž každá oblast významně přispívá k celkové prosperitě a globální konkurenceschopnosti země." # todo: NEW TRANSLATION
 HOL_eindhoven_brainport_idea: "Brainport Eindhoven" # todo: NEW TRANSLATION
 HOL_eindhoven_brainport_idea_desc: "Brainport Eindhoven je přední high-tech region v Nizozemsku, proslulý svou inovací a vyspělými technologickými odvětvími. S centrem kolem Eindhovenu je tato oblast hybnou silou pro odvětví jako polovodiče, automobilová technologie a robotika. Domov pro globální společnosti jako ASML a Philips, Brainport Eindhoven pohání významný hospodářský růst a je klíčovým přispěvatelem k postavení Nizozemska jako globálního lídra v oblasti technologií a inovací." # todo: NEW TRANSLATION
 HOL_marine_moving: "Přesun námořní pěchoty" # todo: NEW TRANSLATION
 HOL_marine_moving_desc: "Nizozemská vláda rozhodla o přesunu Korps Mariniers ze současné základny v Doornu do nového zařízení ve Vlissingenu. Tento krok měl námořní pěchotě poskytnout moderní infrastrukturu a zlepšit její operační schopnosti. Volba Vlissingenu v provincii Zeeland měla rovněž podpořit regionální hospodářský rozvoj a nabídnout námořní pěchotě strategickou polohu u Severního moře. Plán přesunu však narazil na odpor kvůli obavám z dopadu na personál a jeho rodiny i kvůli logistickým a finančním problémům." # todo: NEW TRANSLATION
 HOL_marine_moved: "Moderní základna námořní pěchoty" # todo: NEW TRANSLATION
 HOL_marine_moved_desc: "Přesun Korps Mariniers na novou základnu ve Vlissingenu byl úspěšně dokončen. Námořní pěchota nyní působí v nejmodernějších zařízeních, která výrazně zvyšují její operační připravenost. Nová poloha ve Vlissingenu poskytuje strategické výhody včetně rychlého přístupu k Severnímu moři pro námořní operace. Přesun rovněž přispěl k hospodářskému růstu Zeelandu, vytvořil pracovní místa a přilákal do regionu investice. Navzdory počátečním problémům a odporu během plánování proběhl přechod hladce a námořní pěchota se novému prostředí účinně přizpůsobila." # todo: NEW TRANSLATION
 HOL_marine_debate: "Debata o přesunu námořní pěchoty" # todo: NEW TRANSLATION
 HOL_marine_debate_desc: "Přesun námořní pěchoty je projednáván v parlamentu, což proces zdržuje a vytváří v ozbrojených silách nejistotu." # todo: NEW TRANSLATION
 HOL_marine_public_support: "Veřejná podpora přesunu námořní pěchoty" # todo: NEW TRANSLATION
 HOL_marine_public_support_desc: "Vláda i veřejnost podporují přesun námořní pěchoty do Vlissingenu, což zvyšuje její morálku a efektivitu." # todo: NEW TRANSLATION
 HOL_Marine_Modified: "Přesun námořní pěchoty částečně dokončen" # todo: NEW TRANSLATION
 HOL_Marine_Modified_desc: "Kvůli veřejnému tlaku a politickému kompromisu byl plán přesunu námořní pěchoty upraven. Ačkoliv je nová základna ve Vlissingenu funkční, plné výhody přesunu se neprojeví." # todo: NEW TRANSLATION
 HOL_marine_relocation_cancelled: "Přesun námořní pěchoty zrušen" # todo: NEW TRANSLATION
 HOL_marine_relocation_cancelled_desc: "Plán přesunu námořní pěchoty do Vlissingenu byl zrušen. Toto rozhodnutí obnovuje stabilitu, ale snižuje operační kapacitu námořní pěchoty." # todo: NEW TRANSLATION
 HOL_local_communities_support: "Podpora místních komunit pro přesun" # todo: NEW TRANSLATION
 HOL_local_communities_support_desc: "Investice do místních komunit v okolí Vlissingenu zvýšily veřejnou podporu přesunu námořní pěchoty, podpořily místní hospodářský růst a zvýšily výrobní kapacitu." # todo: NEW TRANSLATION
 HOL_marine1: "Koninklijke Marine" # todo: NEW TRANSLATION
 HOL_marine1_desc: "Koninklijke Marine neboli Královské nizozemské námořnictvo je námořní složkou nizozemských ozbrojených sil a jedním z nejstarších námořnictev na světě, jehož počátky sahají do 15. století. Hraje zásadní roli při obraně Nizozemska doma i v zahraničí a účastní se různých mezinárodních misí včetně operací NATO, mírových a humanitárních akcí. Královské nizozemské námořnictvo je známé svou moderní a všestrannou flotilou zahrnující fregaty, ponorky, hlídková plavidla a obojživelné lodě. Provozuje také řadu letounů a vrtulníků, především pro námořní hlídkování, přepravu a pátrací a záchranné mise. Korps Mariniers, elitní námořní pěchota Nizozemska, je nedílnou součástí námořnictva a specializuje se na obojživelné operace a mise rychlé reakce." # todo: NEW TRANSLATION
 HOL_submarine_modernization_idea: "Modernizace ponorek" # todo: NEW TRANSLATION
 HOL_submarine_modernization_idea_desc: "Modernizace ponorek je klíčovou iniciativou Královského nizozemského námořnictva zaměřenou na modernizaci stárnoucích ponorek třídy Walrus. Modernizace zahrnuje pokročilé sonarové systémy, lepší prvky stealth a zdokonalenou výzbroj, které zajistí účinnost ponorek v moderních námořních operacích. Cílem je prodloužit jejich životnost a zachovat jejich strategický význam v globálním úsilí o námořní bezpečnost." # todo: NEW TRANSLATION
 HOL_cmp_idea: "Commissariaat Militaire Productie" # todo: NEW TRANSLATION
 HOL_cmp_idea_desc: "Commissariaat Militaire Productie (CMP), neboli Komisařství pro vojenskou výrobu, byl nizozemský vládní orgán zřízený za účelem dohledu nad výrobou vojenského vybavení a zásob a její koordinace. Jeho hlavní úlohou bylo zajistit dostatečné vybavení nizozemských obranných sil, zejména v době konfliktu nebo zvýšené vojenské připravenosti. CMP spravovalo smlouvy s domácím průmyslem, regulovalo výrobu zbraní, munice, vozidel a dalšího vojenského materiálu a zajišťovalo jeho výrobu podle požadovaných standardů a harmonogramů." # todo: NEW TRANSLATION
 HOL_army2: "Koninklijke Landmacht" # todo: NEW TRANSLATION
 HOL_army2_desc: "Koninklijke Landmacht neboli Královská nizozemská armáda je pozemní složkou nizozemských ozbrojených sil, jejíž kořeny sahají do 16. století. Odpovídá za obranu nizozemského území a přispívá k mezinárodním misím včetně operací NATO a mírových operací OSN. Armáda je vybavena moderními vozidly, dělostřelectvem a komunikačními systémy. Královská nizozemská armáda je všestrannou silou připravenou řešit řadu bezpečnostních výzev doma i v zahraničí." # todo: NEW TRANSLATION
 HOL_defensienota_idea: "Defensienota 2022" # todo: NEW TRANSLATION
 HOL_defensienota_idea_desc: "Defensienota 2022 je strategický politický dokument vytyčující budoucí směřování a priority nizozemského ministerstva obrany. Zabývá se měnícím se globálním bezpečnostním prostředím a zdůrazňuje potřebu silnějších a přizpůsobivějších obranných sil. Mezi hlavní témata patří zvýšení výdajů na obranu, modernizace vojenských schopností a posílení mezinárodní spolupráce, zejména v rámci NATO a Evropské unie. Dokument zdůrazňuje investice do kybernetické obrany, zpravodajství a pokročilých technologií i rozšíření personálu a úrovně připravenosti. Defensienota 2022 má zajistit připravenost nizozemských ozbrojených sil čelit současným i vznikajícím hrozbám a přispívat k národní bezpečnosti i globální stabilitě." # todo: NEW TRANSLATION
 HOL_Marechausee1: "Královská vojenská policie" # todo: NEW TRANSLATION
 HOL_Marechausee1_desc: "Koninklijke Marechaussee, neboli Královská nizozemská marechaussée, je žandárská složka působící pod nizozemským ministerstvem obrany. Je odpovědná za široké spektrum bezpečnostních a policejních úkolů jak v Nizozemsku, tak mezinárodně. Mezi hlavní povinnosti patří pohraniční bezpečnost, vojenská policie a ochrana královské rodiny a vládních činitelů. Marechaussee také sehrává klíčovou roli v boji proti organizovanému zločinu, obchodování s lidmi a terorismu a podílí se na mezinárodních mírových misích. Díky své všestrannosti a specializovaným schopnostem je Koninklijke Marechaussee zásadní součástí národní bezpečnostní infrastruktury Nizozemska." # todo: NEW TRANSLATION
 HOL_air: "Koninklijke Luchtmacht" # todo: NEW TRANSLATION
 HOL_air_desc: "Koninklijke Luchtmacht neboli Královské nizozemské letectvo je leteckou složkou nizozemských ozbrojených sil, která má za úkol bránit nizozemský vzdušný prostor a podporovat domácí i mezinárodní vojenské operace. Bylo založeno v roce 1953 a provozuje moderní flotilu zahrnující stíhací letouny, transportní letouny, vrtulníky a bezpilotní letouny. Hraje klíčovou roli v misích NATO, při ochraně vzdušného prostoru a rychlém nasazení. Podílí se také na humanitární pomoci, reakci na katastrofy a bezpečnosti nizozemských zámořských území. Díky pokročilým technologiím a vysoce vycvičenému personálu je Královské nizozemské letectvo klíčovou součástí obranné strategie země." # todo: NEW TRANSLATION
 HOL_dutch_army_doctrine1: "Nederlandse Defensievisie" # todo: NEW TRANSLATION
 HOL_dutch_army_doctrine1_desc: "Nederlandse Defensievisie je strategický dokument stanovující dlouhodobou vizi a cíle nizozemského ministerstva obrany. Poskytuje rámec pro rozvoj a přizpůsobení nizozemských ozbrojených sil budoucím bezpečnostním výzvám. Defensievisie se zaměřuje na posílení flexibility, odolnosti a technologických schopností armády v reakci na stále složitější a nepředvídatelnější globální bezpečnostní prostředí." # todo: NEW TRANSLATION
 HOL_dutch_army_doctrine_change: "Transformace Nederlandse Defensievisie" # todo: NEW TRANSLATION
 HOL_dutch_army_doctrine_change_desc: "Národní duch Transformace Nederlandse Defensievisie představuje zásadní fázi proměny nizozemských ozbrojených sil. Znamená období modernizace a přizpůsobení zaměřené na rozvoj nových schopností, posílení kybernetické obrany a prohloubení mezinárodní spolupráce. Tento národní duch zdůrazňuje snahu zvýšit odolnost a flexibilitu armády a připravit ji na výzvy 21. století. Odráží společné úsilí sladit nizozemskou obranu s měnícími se globálními bezpečnostními potřebami a vyvážit tradici s inovacemi." # todo: NEW TRANSLATION
 HOL_Economic_Landscape_Start: "Nizozemská ekonomická krajina" # todo: NEW TRANSLATION
 HOL_Economic_Landscape_Start_desc: "Analyzování a porozumění jedinečné ekonomické krajině Nizozemska je klíčové. Zaměřením na silné stránky a výzvy našich rozmanitých regionů můžeme vytvářet cílené ekonomické politiky pro maximalizaci růstu a stability po celé zemi." # todo: NEW TRANSLATION
 HOL_marechaussee1: "Koninklijke Marechaussee" # todo: NEW TRANSLATION
 HOL_marechaussee1_desc: "Koninklijke Marechaussee, Královská nizozemská vojenská policie, hraje zásadní roli při udržování národní bezpečnosti a prosazování práva. Odpovídá za kontrolu hranic, bezpečnost letišť a vojenskou policii a zajišťuje bezpečí a stabilitu Nizozemska doma i v zahraničí. Její odborné znalosti v oblasti vnitřní bezpečnosti, migrace a veřejného pořádku z ní činí nepostradatelnou sílu nizozemské obranné struktury. Jako dobře vycvičená a vysoce přizpůsobivá jednotka podporuje civilní i vojenské operace a přispívá k odolnosti národa v krizových dobách." # todo: NEW TRANSLATION
 HOL_paars1: "Konec vlády Paars" # todo: NEW TRANSLATION
 HOL_paars1_desc: "Odkaz kabinetu Paars II tvoří inovace, pragmatismus a vyvážené vládnutí, které odrážejí rozmanité politické prostředí Nizozemska a vytvářejí precedens pro budoucí koaliční vlády." # todo: NEW TRANSLATION
 HOL_dbb: "Služba ochrany a bezpečnosti" # todo: NEW TRANSLATION
 HOL_dbb_desc: "Služba ochrany a bezpečnosti (Dienst Bewaken en Beveiligen, DBB) je základním pilířem ochrany nejvýznamnějších osobností a kritických aktiv národa. DBB pověřená ochranou politických představitelů, členů královské rodiny a citlivých míst působí s bezkonkurenční bdělostí a profesionalitou." # todo: NEW TRANSLATION
 HOL_DBB_tt: "Snižuje šance na zabití §YPolitical Leaders§!" # todo: NEW TRANSLATION
 HOL_debt_reduction: "Snížení dluhu" # todo: NEW TRANSLATION
 HOL_debt_reduction_desc: "VVD pod vedením Gerrita Zalma prosazuje fiskální odpovědnost prostřednictvím cíleného snižování dluhu, čímž posiluje ekonomiku a zajišťuje dlouhodobou finanční stabilitu." # todo: NEW TRANSLATION
 HOL_liberal_society_modifier: "Liberální společnost" # todo: NEW TRANSLATION
 HOL_economy_education_research: "Reforma vzdělávání podle trhu" # todo: NEW TRANSLATION
 HOL_economy_education_research_desc: "VVD se zaměřuje na sladění vzdělávacích programů s potřebami trhu a vybavení studentů dovednostmi, po nichž je vysoká poptávka. Propojením vzdělávání s pracovní silou zvyšujeme zaměstnatelnost a podporujeme hospodářský růst a zajišťujeme, že budoucí generace budou dobře připraveny uspět na neustále se měnícím trhu práce." # todo: NEW TRANSLATION
 HOL_ministry_of_family1: "Ministerstvo rodiny" # todo: NEW TRANSLATION
 HOL_ministry_of_family1_desc: "Ministerstvo rodiny se věnuje podpoře blaha rodin v celém Nizozemsku. Vypracovává a provádí politiku v oblasti péče o děti, rodičovské dovolené a podpůrných služeb pro rodiny a zajišťuje, aby rodiny měly přístup ke zdrojům potřebným k prosperitě. Ministerstvo pracuje na vytvoření pečujícího prostředí, které podporuje zdravý vývoj a posiluje rodinná pouta." # todo: NEW TRANSLATION
 HOL_weed_center1: "Nizozemská konopná politika" # todo: NEW TRANSLATION
 HOL_weed_center1_desc: "Nizozemsko je známé svým specifickým přístupem ke konopí, při němž je držení a prodej v licencovaných coffeeshopech tolerován za přísných pravidel. Tato pragmatická politika má oddělit trh s měkkými a tvrdými drogami a zároveň omezit trestnou činnost. Ačkoli je konopí technicky nelegální, pro osobní užívání je fakticky dekriminalizováno, což odráží vyvážený přístup mezi veřejným zdravím, bezpečností a osobní svobodou." # todo: NEW TRANSLATION
 HOL_Weed_Center1_tt: "[additional_income_HOL_Weed_Center1]" # todo: NEW TRANSLATION
 HOL_unhcr1: "Dohled UNHCR nad migrací" # todo: NEW TRANSLATION
 HOL_unhcr1_desc: "Úřad vysokého komisaře OSN pro uprchlíky (UNHCR) nyní dohlíží na migrační politiku a procesy, které dříve spravovalo Nizozemsko. Tento přechod má zajistit dodržování mezinárodních standardů ochrany a podpory uprchlíků a migrantů a nabídnout koordinovanější a humánnější přístup k řešení globálních migračních výzev." # todo: NEW TRANSLATION
 HOL_balkenende_legend: "Balkenendeho odkaz" # todo: NEW TRANSLATION
 HOL_balkenende_legend_desc: "Působení Jana Petera Balkenendeho ve funkci premiéra se vyznačuje důrazem na sociální soudržnost, odpovědnost a hospodářskou stabilitu. Jeho vize společnosti „norem en waarden“ (norem a hodnot) měla posílit morální a etické základy Nizozemska. Balkenendeho odkaz nadále ovlivňuje nizozemskou politiku a prosazuje vyvážený přístup k vládnutí, který si cení komunitní i individuální odpovědnosti." # todo: NEW TRANSLATION
 HOL_green_socialism1: "Zelený socialismus" # todo: NEW TRANSLATION
 HOL_green_socialism1_desc: "PvdA si představuje budoucnost, v níž sociální spravedlnost a environmentální udržitelnost kráčejí ruku v ruce. Zelený socialismus prosazuje spravedlivou a rovnoprávnou společnost, která upřednostňuje blaho lidí i planety. Prostřednictvím ambiciózní klimatické politiky, investic do obnovitelné energie a spravedlivé transformace pro pracovníky chce PvdA vytvořit udržitelnou ekonomiku, která nikoho nenechá stranou." # todo: NEW TRANSLATION
 HOL_monarchy_law_blocking: "Odplata monarchie" # todo: NEW TRANSLATION
 HOL_monarchy_law_blocking_desc: "Rozhořčena odmítnutím vlády schválit královský sňatek podnikla monarchie mimořádný krok a začala blokovat klíčové zákony jako formu odplaty. Tento akt vzdoru uvrhl politické prostředí do chaosu, protože královská rodina využívá svého vlivu ke zpochybnění autority vlády. S rostoucím napětím vyvolal tento bezprecedentní zásah celonárodní debatu o úloze a moci monarchie v moderním vládnutí." # todo: NEW TRANSLATION
 HOL_Monarchy_Law_Blocking_tt: "£political_power_texticon  Náklady na změnu zákona: §R+1000%§!  " # todo: NEW TRANSLATION
 HOL_monarch_public_campaign: "Vlna veřejné podpory" # todo: NEW TRANSLATION
 HOL_monarch_public_campaign_desc: "V reakci na odmítnutí vlády schválit královský sňatek vznikla masivní veřejná nátlaková kampaň. Občané po celé zemi se stavějí za královský pár, pořádají demonstrace, podepisují petice a požadují, aby vláda svůj postoj přehodnotila. Tato vlna podpory vyvinula na politické představitele obrovský tlak a zdůraznila loajalitu lidu k monarchii i jeho přání, aby právo na lásku a manželství překonalo politické hranice." # todo: NEW TRANSLATION
 HOL_monarch_backlash: "Veřejné rozčarování" # todo: NEW TRANSLATION
 HOL_monarch_backlash_desc: "Rozhodnutí královského páru pokračovat ve svatbě navzdory odmítnutí vlády vyvolalo vlnu veřejné nespokojenosti. Mnozí to považují za překročení pravomocí monarchie a pohrdání demokratickými procesy. Odpor přišel rychle a občané začali zpochybňovat význam monarchie v moderní společnosti. Výzvy k reformě, ba dokonce ke zrušení monarchie sílí, protože důvěra v královskou rodinu slábne." # todo: NEW TRANSLATION
 HOL_pro_gay_marriage: "První země, která schválila manželství osob stejného pohlaví" # todo: NEW TRANSLATION
 HOL_pro_gay_marriage_desc: "Nizozemsko se legalizací manželství osob stejného pohlaví stalo globálním lídrem sociálního pokroku a lidských práv. Tento krok posílil obraz národa jako tolerantní a inkluzivní společnosti a zvýšil národní jednotu i mezinárodní prestiž." # todo: NEW TRANSLATION
 HOL_anti_gay_marriage: "Zákon o tradičním manželství" # todo: NEW TRANSLATION
 HOL_anti_gay_marriage_desc: "Rozhodnutí zachovat tradiční zákony o manželství odráží pevné lpění na konzervativních hodnotách. Zatímco tento postoj nachází odezvu u náboženských a tradicionalistických skupin, vyvolává kritiku progresivnějších hlasů a poškozuje pověst země jako majáku liberalismu v Evropě." # todo: NEW TRANSLATION
 HOL_labour_market_reforms_idea: "Reformy trhu práce" # todo: NEW TRANSLATION
 HOL_labour_market_reforms_idea_desc: "" # todo: NEW TRANSLATION
 HOL_strong_social_security: "Silné sociální zabezpečení" # todo: NEW TRANSLATION
 HOL_strong_social_security_desc: "" # todo: NEW TRANSLATION
 HOL_social_innovation_idea: "Hnutí sociálních inovací" # todo: NEW TRANSLATION
 HOL_social_innovation_idea_desc: "The Netherlands has become a hub of social innovation, fostering new ideas and creative solutions to tackle society's most pressing challenges. This movement has led to significant breakthroughs in civilian research and development, driving technological progress and boosting national productivity." # todo: NEW TRANSLATION
 HOL_poverty_reduction_idea: "Iniciativa na snížení chudoby" # todo: NEW TRANSLATION
 HOL_poverty_reduction_idea_desc: "Nizozemsko zahájilo komplexní iniciativu zaměřenou na snižování chudoby. Prostřednictvím vyšších sociálních dávek, cílené podpory zranitelných skupin a ekonomické pomoci vláda pracuje na pozvednutí nejvíce znevýhodněných členů společnosti. Program má vytvořit spravedlivější a inkluzivnější ekonomiku." # todo: NEW TRANSLATION
 HOL_poverty_reduced: "Chudoba výrazně snížena" # todo: NEW TRANSLATION
 HOL_poverty_reduced_desc: "Díky úspěšnému zavedení sociálních programů a reforem se chudoba v Nizozemsku výrazně snížila. Zaměření země na ekonomickou inkluzi a podporu znevýhodněných vedlo k větší sociální stabilitě, vyšší životní úrovni a silnější a odolnější ekonomice." # todo: NEW TRANSLATION
 HOL_digital_literacy_idea: "Kampaň za digitální gramotnost" # todo: NEW TRANSLATION
 HOL_digital_literacy_idea_desc: "Nizozemsko zahájilo celonárodní kampaň na zlepšení digitální gramotnosti ve všech oblastech společnosti. Vybavením občanů dovednostmi potřebnými k prosperitě v digitálním věku vláda zajišťuje, že pracovní síla dokáže zvládat technologický pokrok, zvyšuje produktivitu a podporuje inovace v ekonomice." # todo: NEW TRANSLATION
 HOL_economic_resilience_idea: "Iniciativa ekonomické odolnosti" # todo: NEW TRANSLATION
 HOL_economic_resilience_idea_desc: "Nizozemská vláda zavedla komplexní politiku zaměřenou na posílení odolnosti ekonomiky vůči globálním krizím. Diverzifikací hospodářských odvětví, podporou malých podniků a zajištěním robustní sociální záchranné sítě je Nizozemsko lépe připraveno čelit budoucím výzvám a udržet hospodářskou stabilitu." # todo: NEW TRANSLATION
 HOL_financial_sector_idea: "Reforma finančního sektoru" # todo: NEW TRANSLATION
 HOL_financial_sector_idea_desc: "Komplexní reformy finančního sektoru jsou nezbytné pro prevenci budoucích krizí a podporu transparentnosti a odpovědnosti. Pod vedením Woutera Bose budeme účinně regulovat finanční průmysl a zajistíme stabilitu a důvěru na trhu. Tyto reformy vytvoří odolnější ekonomiku schopnou čelit globálním výzvám a sníží riziko hospodářského kolapsu." # todo: NEW TRANSLATION
 HOL_democracy_reform1: "Hnutí politické reformy" # todo: NEW TRANSLATION
 HOL_democracy_reform1_desc: "LPF prosazuje v Nizozemsku vlnu politických reforem, odděluje se od zakořeněných stranických kartelů a hájí přímou demokracii. Zmocněním občanů prostřednictvím referend, snižováním vlivu kariérních politiků a zjednodušením vládních institucí LPF přetváří nizozemskou správu tak, aby byla transparentnější, odpovědnější a skutečně reprezentovala vůli lidu." # todo: NEW TRANSLATION
 HOL_welfare_reform_idea: "Reforma sociálního systému" # todo: NEW TRANSLATION
 HOL_welfare_reform_idea_desc: "LPF restrukturalizuje sociální systém s prioritou udržitelnosti a osobní odpovědnosti. Snižováním závislosti a poskytováním cílené podpory skutečně potřebným zajistí, že sociální systém podpoří odolnou, soběstačnou populaci a zároveň sníží zátěž daňových poplatníků." # todo: NEW TRANSLATION
 HOL_public_sector_reform_idea: "Iniciativa pro efektivitu veřejného sektoru" # todo: NEW TRANSLATION
 HOL_public_sector_reform_idea_desc: "LPF se zavazuje ke zefektivnění veřejného sektoru, omezení byrokratických neefektivit a podpoře odpovědného utrácení. Tato reforma zlepší poskytování základních služeb, sníží administrativní zátěž a znovu zaměří vládní úsilí na efektivní sloužení nizozemskému lidu." # todo: NEW TRANSLATION
 HOL_reformed_liberal_market: "Reformovaný trh práce a společnost" # todo: NEW TRANSLATION
 HOL_reformed_liberal_market_desc: "S reformovaným sociálním systémem, liberalizovaným trhem práce a zefektivněným veřejným sektorem se Nizozemsko stalo vzorem efektivity a soběstačnosti. Tyto reformy upřednostňují osobní odpovědnost, snižují zásahy vlády a podporují hospodářský růst, čímž vytvářejí odolnou a udržitelnou ekonomiku, která prospívá všem občanům." # todo: NEW TRANSLATION
 HOL_anti_islam1: "Restriktivní opatření" # todo: NEW TRANSLATION
 HOL_anti_islam1_desc: "Vláda zavedla počáteční restriktivní opatření proti islámským symbolům, školám a institucím s cílem chránit nizozemské kulturní hodnoty. Tato politika má podporovat soudržnou společnost v souladu se sekulárními a národními principy." # todo: NEW TRANSLATION
 HOL_anti_islam2: "Politika kulturní asimilace" # todo: NEW TRANSLATION
 HOL_anti_islam2_desc: "S přísnějšími politikami se vláda zaměřila na kulturní asimilaci a omezila islámské instituce a zvyky, aby posílila nizozemskou identitu a soudržnost. Tyto politiky usilují o překlenutí sociálních rozdílů prostřednictvím jednotných kulturních očekávání." # todo: NEW TRANSLATION
 HOL_anti_islam3: "Rozsáhlé zákazy" # todo: NEW TRANSLATION
 HOL_anti_islam3_desc: "Vláda zavedla rozsáhlé zákazy islámských symbolů a praktik, které považuje za bariéry národní soudržnosti. Tato opatření míří na utvoření sekulární nizozemské společnosti a posílení veřejné bezpečnosti." # todo: NEW TRANSLATION
 HOL_anti_islam4: "Úplná kriminalizace islámských symbolů" # todo: NEW TRANSLATION
 HOL_anti_islam4_desc: "Islámské symboly, texty a instituce byly plně kriminalizovány; vláda uvádí jako důkaz závazek k veřejnému pořádku, národní jednotě a sekularismu. Tento extrémní postoj posiluje vizi administrativy o kulturně homogenním a bezpečném Nizozemsku." # todo: NEW TRANSLATION
 HOL_afriforum1HOL: "Partnerství a ochrana Afrikánců" # todo: NEW TRANSLATION
 HOL_afriforum1HOL_desc: "Nizozemsko prohloubilo vztahy s afrikánskou komunitou v Jižní Africe a nabídlo hospodářskou podporu i závazek chránit afrikánské kulturní a jazykové dědictví. Toto partnerství zajišťuje přístup ke zdrojům a zároveň symbolizuje obnovené pouto založené na společné historii a vzájemném respektu." # todo: NEW TRANSLATION
 HOL_afriforum1SAF: "Nizozemsko-afrikánská aliance" # todo: NEW TRANSLATION
 HOL_afriforum1SAF_desc: "Afrikánská komunita posílila své spojenectví s Nizozemskem a podpořila ochranu kultury, hospodářskou spolupráci a síť podpory. Díky nizozemskému vlivu získávají Afrikánci spojence ve snaze chránit svou identitu a ekonomickou autonomii v Jižní Africe." # todo: NEW TRANSLATION
 HOL_made_in_holland1: "Vyrobeno v Holandsku" # todo: NEW TRANSLATION
 HOL_made_in_holland1_desc: "Obnovený důraz na holandsky vyráběné výrobky podporuje místní průmysl, posiluje národní hrdost a zvyšuje hospodářskou odolnost. Tím, že dáváme přednost výrobkům vyrobeným na našem území, posilujeme nizozemskou ekonomiku a podporujeme soběstačnost, aby se 'Vyrobeno v Holandsku' stalo značkou kvality a identity." # todo: NEW TRANSLATION
 HOL_work_efforts: "Národní pracovní snahy" # todo: NEW TRANSLATION
 HOL_work_efforts_desc: "S důrazem na oživení pracovní síly vláda zahájila celonárodní iniciativy na zvýšení zaměstnanosti a produktivity. Prostřednictvím programů rekvalifikace, podpory klíčových odvětví a pobídek pro zapojení pracovní síly tyto snahy mají za cíl posílit ekonomiku a zajistit prosperující budoucnost pro všechny obyvatele Nizozemska." # todo: NEW TRANSLATION
 HOL_celebrate_heroes: "Oslavovat holandské hrdiny" # todo: NEW TRANSLATION
 HOL_celebrate_heroes_desc: "Oceňování pozoruhodných úspěchů a obětí holandských hrdinů budí národní hrdost a jednotu. Oslavováním historických i dnešních hrdinů inspirujeme budoucí generace a posilujeme hodnoty, které naši zemi definují. Tento duch obdivu a vzpomínání posiluje pouto mezi občany a napomáhá vybudovat odolnou a vlasteneckou společnost." # todo: NEW TRANSLATION
 HOL_fatherland_education_idea: "Vzdělávání o vlasti" # todo: NEW TRANSLATION
 HOL_fatherland_education_idea_desc: "Vzdělávání o vlasti se zaměřuje na vštěpování národní hrdosti, dědictví a odpovědnosti naší mládeži. Zdůrazněním nizozemské historie, hodnot a kultury ve výuce chceme vychovat silné a jednotné občanstvo schopné zachovávat a hájit naše tradice a národní identitu." # todo: NEW TRANSLATION
 HOL_stadtholderate1: "Vláda místodržitele" # todo: NEW TRANSLATION
 HOL_stadtholderate1_desc: "Nizozemský místodržitel vede obnovenou éru vládnutí a vyvažuje principy monarchie s tradicemi demokracie. Zdůrazňuje místní samosprávu a ústavní reformu a snaží se sjednotit Nizozemsko pod vizí svobody, pokroku a silného vedení." # todo: NEW TRANSLATION
 HOL_monarchy1: "Sjednocená Koruna a země" # todo: NEW TRANSLATION
 HOL_monarchy1_desc: "Nizozemsko přijalo své královské dědictví a monarchie stojí jako pilíř národní identity a stability. Pod bdělým dohledem Koruny národ kráčí vpřed, podporuje kulturní hrdost a zajišťuje silnou centralizovanou vládu oddanou prosperitě svých občanů." # todo: NEW TRANSLATION
 HOL_dutch_enterprise: "Podpora holandského podnikání" # todo: NEW TRANSLATION
 HOL_dutch_enterprise_desc: "Obnovený důraz na podporu domácí inovace a podnikání podnítil nizozemskou ekonomiku. Prosazováním místních podniků a snižováním byrokratických překážek Nizozemsko rozvíjí konkurenční trh, který svědčí o jeho pilném duchu." # todo: NEW TRANSLATION
 HOL_royal_eco_control: "Královská ekonomická kontrola" # todo: NEW TRANSLATION
 HOL_royal_eco_control_desc: "S královským dohledem nad ekonomickými politikami se Nizozemsko vydalo na cestu centralizovaného ekonomického plánování. Zatímco kritici lamentují ztrátu tržních svobod, monarchie zajišťuje stabilitu a jednotné zaměření na národní priority, chráníce nizozemské průmysly před vnějším vlivem." # todo: NEW TRANSLATION
 HOL_voc_semiconductor_control_HOL: "Ovládnutí polovodičového průmyslu v §Y[TAI.GetNameWithFlag]§!" # todo: NEW TRANSLATION
 HOL_voc_semiconductor_control_HOL_desc: "Díky strategickým investicím a partnerstvím získalo Nizozemsko kontrolu nad vysoce žádaným tchajwanským polovodičovým průmyslem. Díky špičkové litografické technologii společnosti ASML v centru této dominance nyní Nizozemci drží otěže světové výroby polovodičů a zajišťují si zásadní výhodu v moderní technologické éře." # todo: NEW TRANSLATION
 HOL_voc_semiconductor_control_TAI: "[HOL.GetAdjective] nadvláda nad tchajwanským polovodičovým průmyslem" # todo: NEW TRANSLATION
 HOL_voc_semiconductor_control_TAI_desc: "Tchajwanský polovodičový průmysl, životně důležitý pro jeho ekonomiku, se dostal pod kontrolu [HOL.GetAdjective]. Tento přesun moci, vedený technologickým vlivem společnosti ASML a ekonomickým tlakem podporovaným VOC, ohrožuje autonomii Tchaj-wanu nad jeho nejdůležitějším průmyslovým odvětvím a zároveň svěřuje jeho budoucnost do cizích rukou." # todo: NEW TRANSLATION
 HOL_sri_dutch_agriculture_benefits: "Nizozemské zemědělské partnerství" # todo: NEW TRANSLATION
 HOL_sri_dutch_agriculture_benefits_desc: "Díky spolupráci s Nizozemskem získala Srí Lanka přístup k moderním zemědělským technikám a zdrojům, což podpořilo produkci potravin a hospodářský růst v celé zemi." # todo: NEW TRANSLATION
 HOL_sri_agriculture_collaboration: "Srílanská zemědělská spolupráce" # todo: NEW TRANSLATION
 HOL_sri_agriculture_collaboration_desc: "Sdílením nizozemských zemědělských znalostí se Srí Lankou si Nizozemsko zajistilo životně důležitou oporu v regionu, posílilo svůj vliv a obnovilo spojení s tímto historickým územím." # todo: NEW TRANSLATION
 HOL_voc_indonesian_focus: "VOC: Zaměření na Indonésii" # todo: NEW TRANSLATION
 HOL_voc_indonesian_focus_desc: "Obnovená VOC zaměřila svou pozornost na znovuzískání dominance v Indonésii, srdci své historické říše. Toto zaměření, soustředěné na hospodářské oživení, strategickou kontrolu a posilování místního vlivu, má znovu potvrdit nizozemskou moc v regionu a zajistit jeho cenné zdroje." # todo: NEW TRANSLATION
 HOL_VOC_indonesian_focus_tt: "Poloviční náklady na potlačení separatistického hnutí v Indonésii" # todo: NEW TRANSLATION
 HOL_voc_penalty_operation_extension: "Postih za prodloužení operace" # todo: NEW TRANSLATION
 HOL_voc_penalty_operation_extension_desc: "Prodloužením našich operací v Indonésii namísto vyhlášení války jsme odložili rozhodnou akci, což způsobilo politické napětí, snížení stability a neefektivitu našeho průmyslu." # todo: NEW TRANSLATION
 HOL_voc_ambassy_expansion_ind: "Rozšířit nizozemské velvyslanectví v Indonésii" # todo: NEW TRANSLATION
 HOL_voc_ambassy_expansion_ind_desc: "Rozšíření nizozemského velvyslanectví v Indonésii představuje strategický krok k prohloubení diplomatických vztahů, uplatnění vlivu a usnadnění tajných operací. Posílením naší přítomnosti se můžeme lépe připravit na budoucí záměry v regionu." # todo: NEW TRANSLATION
 HOL_rebuilding_indonesia: "Obnova Indonésie" # todo: NEW TRANSLATION
 HOL_rebuilding_indonesia_desc: "Po nadvládě Nizozemska nad Indonézií je Indonésie zapotřebí významných rekonstrukčních snah. Investicemi do infrastruktury, stabilizací ekonomiky a řešením místních problémů můžeme položit základy pro prosperující a kooperativní budoucnost pod nizozemským vedením." # todo: NEW TRANSLATION
 HOL_military_compensation_ast: "Vojenská podpora z Nizozemska" # todo: NEW TRANSLATION
 HOL_military_compensation_ast_desc: "Nizozemsko poskytlo Austrálii značnou vojenskou podporu v rámci dohody o nákupu Západní Austrálie. Tato pomoc posiluje ozbrojené síly Austrálie a posiluje regionální bezpečnost." # todo: NEW TRANSLATION
 HOL_military_compensation_hol: "Vojenská kompenzace pro Austrálii" # todo: NEW TRANSLATION
 HOL_military_compensation_hol_desc: "V rámci dohody o získání Západní Austrálie jsme se zavázali k poskytování vojenské podpory Austrálii, posilující její obranné schopnosti a udržující diplomatické dobré vztahy." # todo: NEW TRANSLATION
 HOL_industrial_compensation_ast: "Průmyslové investice z Nizozemska" # todo: NEW TRANSLATION
 HOL_industrial_compensation_ast_desc: "Nizozemsko intenzivně investovalo do australského průmyslového sektoru jako součást dohody o prodeji Západní Austrálie. Tyto investice výrazně posílily ekonomickou kapacitu a infrastrukturu Austrálie." # todo: NEW TRANSLATION
 HOL_industrial_compensation_hol: "Průmyslová kompenzace pro Austrálii" # todo: NEW TRANSLATION
 HOL_industrial_compensation_hol_desc: "Abychom zajistili Západní Austrálii, investovali jsme významně do australského průmyslového sektoru, čímž podpořili hospodářský růst a posílili diplomatické vazby." # todo: NEW TRANSLATION
 HOL_increase_long_range_aircraft_production: "Výroba dálkových letounů" # todo: NEW TRANSLATION
 HOL_increase_long_range_aircraft_production_desc: "Abychom podpořili naše snahy o znovuzískání území WIC, Nizozemsko zvyšuje výrobu dálkových letounů. Tyto vyspělé stroje zajistí vzdušnou převahu na velké vzdálenosti, poskytnou klíčovou podporu pro námořní operace a rozšíří náš strategický dosah." # todo: NEW TRANSLATION
 HOL_expanded_embassys: "Rozšířená síť velvyslanectví" # todo: NEW TRANSLATION
 HOL_expanded_embassys_desc: "Nizozemsko rozšířilo síť svých velvyslanectví, čímž prohloubilo diplomatické dosah a vliv v klíčových regionech. Tato iniciativa posiluje naši schopnost jednat, budovat aliance a prosazovat holandské zájmy na globální scéně." # todo: NEW TRANSLATION
 HOL_expanded_financial_network1: "Rozšířené finanční sítě" # todo: NEW TRANSLATION
 HOL_expanded_financial_network1_desc: "Prostřednictvím strategických investic a integrace místních ekonomik si Nizozemsko vybudovalo rozsáhlou finanční síť. Tento systém posiluje náš ekonomický vliv, zajišťuje obchodní dominanci a posiluje globální moc Nizozemska." # todo: NEW TRANSLATION
 HOL_dutchaid: "Nizozemská pomocná iniciativa" # todo: NEW TRANSLATION
 HOL_dutchaid_desc: "Nizozemská pomocná iniciativa se zaměřuje na poskytování rozvojové pomoci a hospodářské podpory regionům strategického zájmu. Podporou dobré vůle a stability posilujeme holandský vliv a otevíráme cestu pro hlubší integraci a spolupráci." # todo: NEW TRANSLATION
 HOL_dutchaid_tt1: "Další příjem: $$§G0.004§! na 10 milionů lidí" # todo: NEW TRANSLATION
 HOL_dutchaid_tt2: "Když bude ovlivněn §Y[HOL.GetNameWithFlag]§!, §Y[THIS.GetFlag] [THIS.GetAdjective]§!, $foreign_influence_defense_modifier$ bude snížen o §R5%§!\n" # todo: NEW TRANSLATION
 HOL_dutchaid_TT: "$$[?additional_income_HOL_dutchaid|+3] z §Y$HOL_dutchaid$§!\n" # todo: NEW TRANSLATION
 HOL_prepare_for_dutch_invasion: "Obranné přípravy proti nizozemské agresi" # todo: NEW TRANSLATION
 HOL_prepare_for_dutch_invasion_desc: "Poté, co jsme odmítli nizozemskou ultimátum k vydání území, musíme se nyní připravit na pravděpodobné důsledky. Očekává se, že Nizozemsko zareaguje vojenským zásahem, a my musíme posílit naši obranu a mobilizovat, abychom chránili naši suverenitu." # todo: NEW TRANSLATION
 HOL_beatrix: "Období vlády královny Beatrix" # todo: NEW TRANSLATION
 HOL_beatrix_desc: "Za vlády královny Beatrix poskytovala monarchie stabilitu a sílu v proměnlivém světě. Její moudrost a přizpůsobivost zajistily, že dynastie Oranje-Nassau zůstává uznávaným institutem, který vede Nizozemsko k jednotě a odolnosti." # todo: NEW TRANSLATION
 HOL_willem_alexander: "Období vlády krále Viléma-Alexandra" # todo: NEW TRANSLATION
 HOL_willem_alexander_desc: "Vláda krále Viléma-Alexandra je definována jeho důrazem na jednotu a modernitu. Jako symbol národní hrdosti posiluje jeho vedení Nizozemsko jak doma, tak v zahraničí." # todo: NEW TRANSLATION
 HOL_friso: "Období vlády krále Friso" # todo: NEW TRANSLATION
 HOL_friso_desc: "Intelektuální přístup krále Frisa k vládnutí přinesl Nizozemsku inovace a prozíravost. Jeho oddanost pokroku a strategickému myšlení upevňuje relevanci monarchie v moderní éře." # todo: NEW TRANSLATION
 HOL_constantijn: "Období vlády krále Constantijn" # todo: NEW TRANSLATION
 HOL_constantijn_desc: "Constantijnova diplomatická vyspělost zajišťuje, že Nizozemsko udržuje svůj vliv na globální scéně. Jeho vláda zdůrazňuje spolupráci, stabilitu a silnou mezinárodní přítomnost pro holandský lid." # todo: NEW TRANSLATION
 HOL_amalia: "Období vlády královny Amálie" # todo: NEW TRANSLATION
 HOL_amalia_desc: "Královna Amálie představuje budoucnost dynastie Oranje-Nassau, vyvažující tradici s moderním přístupem. Její vedení inspiruje novou generaci a zajišťuje, že Nizozemsko bude vzkvétat pod jejím pokrokovým a sjednocujícím vládnutím." # todo: NEW TRANSLATION
 HOL_cult_of_the_leader: "Kult vůdce" # todo: NEW TRANSLATION
 HOL_cult_of_the_leader_desc: "Po zrušení monarchie NVU zavedla nový řád, který se soustřeďuje kolem nejvyšší autority Vůdce. Charizmatický a neústupný, jeho vize formuje každý aspekt společnosti, spojuje národ pod jednou ideologií a společným osudem. Vůdce ztělesňuje vůli lidu a vytváří cestu síly a nadvlády pro Nizozemsko." # todo: NEW TRANSLATION
 HOL_divided_military_loyalties: "Rozdělené vojenské věrnosti" # todo: NEW TRANSLATION
 HOL_divided_military_loyalties_desc: "Armáda, ačkoli byla klíčová pro zajištění vítězství NVU v občanské válce, zůstává zdrženlivá vůči plnému sblížení s režimem. Mezi tradicionalisty v ozbrojených silách a neonacistickou vizí vlády pro absolutní kontrolu panuje napětí.\n------------\nMůžeme se této §Rnárodní myšlenky§! zbavit tím, že budeme mít §YLoajální armádu§! nebo §YNezávislou armádu§!" # todo: CHANGED
 HOL_loyal_military: "Věrná armáda" # todo: NEW TRANSLATION
 HOL_loyal_military_desc: "Ozbrojené síly jsou nyní plně sladěny s vizí NVU. Čistky a ideologická indoktrinace zajistily naprostou věrnost vůdci, čímž se armáda stala důležitým rozšířením státu." # todo: NEW TRANSLATION
 HOL_independent_military: "Nezávislá armáda" # todo: NEW TRANSLATION
 HOL_independent_military_desc: "Vojenským silám byla svěřena autonomie, aby si udržely operační účinnost a profesionalitu. Zatímco jsou mimo přímý politický zásah, zůstávají odhodlány bránit národ." # todo: NEW TRANSLATION
 HOL_nationalist_education_reform_idea_start: "Vzdělávání pod reformou" # todo: NEW TRANSLATION
 HOL_nationalist_education_reform_idea_start_desc: "Náš vzdělávací systém prochází kompletní přestavbou, která má sladit jeho ideály s regime. Tento přechod naruší současnou účinnost, ale položí základy pro loajální a jednotnou společnost." # todo: NEW TRANSLATION
 HOL_nationalist_education_reform_idea_start_tt: "§YVzdělávání pod reformou§! bude §Glepší§! v průběhu času" # todo: NEW TRANSLATION
 HOL_nationalist_education_reform_idea: "Nacionální vzdělávací systém" # todo: NEW TRANSLATION
 HOL_nationalist_education_reform_idea_desc: "Reforma vzdělávání je dokončena. Školy se nyní soustřeďují na vštěpování loajality, disciplíny a hrdosti, vytvářející generaci věnovanou národu a jeho Vůdci." # todo: NEW TRANSLATION
 HOL_national_industrial_program: "Národní průmyslový program" # todo: NEW TRANSLATION
 HOL_national_industrial_program_desc: "NVU zahájila ambiciózní iniciativu k urychlení průmyslového růstu po celé zemi. Centralizované plánování a investice řízené státem se zaměřují na rozšíření těžkého průmyslu, modernizaci infrastruktury a zajištění ekonomické soběstačnosti Nizozemska. Továrny bzučí aktivitami, dělníci pracují pro slávu národa a každý zdroj je směrován na vybudování silnějšího a jednotnějšího státu. Tento program upevňuje naši pozici jako vzrůstající průmyslovou moc v moderní éře." # todo: NEW TRANSLATION
 HOL_german_youth_organisation1: "Germaanse Jeugd Nederland" # todo: NEW TRANSLATION
 HOL_german_youth_organisation1_desc: "Germaanse Jeugd Nederland slouží jako mládežnické křídlo NVU, podporující loajalitu k státu a oddanost ideálům germánské jednoty a síly. Prostřednictvím přísného fyzického tréninku, ideologického vzdělávání a zapojení do komunity organizace připravuje nadcházející generaci k naplnění jejich role ve vizi NVU o sjednocené a silné zemi. Členové Germaanse Jeugd Nederland jsou zosobněním disciplíny, odolnosti a neochvějného odhodlání k vlasti." # todo: NEW TRANSLATION
 HOL_corporatist_economy1: "Korporatistická ekonomika" # todo: NEW TRANSLATION
 HOL_corporatist_economy1_desc: "Stát restrukturoval ekonomiku do korporativistického modelu, který sladí podniky, odbory a vládu pod jednotným rámcem. Tento systém odstraňuje konflikty mezi prací a kapitálem, umožňuje efektivní alokaci zdrojů, rychlý průmyslový růst a inovace. Korporativistická ekonomika zosobňuje národní jednotu a sílu a zajišťuje, že každá část společnosti pracuje na společném cíli prosperity národa." # todo: NEW TRANSLATION
 HOL_stabilize_society: "Stabilizace společnosti" # todo: NEW TRANSLATION
 HOL_stabilize_society_desc: "NVU zahájila intenzivní kampaň na obnovení pořádku a disciplíny po celé zemi. Na následujících 180 dní se úsilí zaměří na potlačení nepokoje, sjednocení společnosti pod vizí NVU a odstranění zbytků odporu vůči novému režimu. Toto období je klíčové pro položení základů pro stabilní a prosperující budoucnost." # todo: NEW TRANSLATION
 HOL_germanic_nationalist_boost: "Národní zápal" # todo: NEW TRANSLATION
 HOL_germanic_nationalist_boost_desc: "Obrozený nával nacionalistického nadšení se šíří napříč zemí, když popularity nabývají hnutí volající po jednotě a síle. Fašistické ideály, kladoucí důraz na pořádek a vizi sjednoceného germánského lidu, rezonují více než kdy dříve a připavují půdu pro hlubokou politickou transformaci." # todo: NEW TRANSLATION
 HOL_dutch_german_hegemony1: "Německá hegemonie prohlášena" # todo: NEW TRANSLATION
 HOL_dutch_german_hegemony1_desc: "Nizozemsko prohlásilo svůj nárok na vedení nad germánskými národy, čímž zpochybnilo tradiční roli Německa. Tento odvážný krok vyvolal napětí mezi germánskými národy, jelikož Nizozemsko usiluje o redefinování rovnováhy moci v regionu pod vlastní vizí jednoty a nadřazenosti." # todo: NEW TRANSLATION
 HOL_fortification_efforts: "Fortifikace proti západní invazi" # todo: NEW TRANSLATION
 HOL_fortification_efforts_desc: "Po dobytí německých území musí Nizozemsko počítat s možnou odvetou ze strany Francie. Masivní projekty fortifikací probíhají podél západní fronty, s důrazem na výstavbu bunkrů a obranných konstrukcí, které ochrání naše nově získané území před případnou francouzskou invazí. Tyto snahy zajišťují, že naše hranice zůstanou bezpečné proti jakémukoli ohrožení z západu." # todo: NEW TRANSLATION
 HOL_germanic_union_member1: "Člen Germánské unie" # todo: NEW TRANSLATION
 HOL_germanic_union_member1_desc: "Jako člen Germánské unie stojíme spolu s ostatními germánskými národy v úsilí o sdílenou prosperitu, bezpečnost a nadřazenost. Toto spojenectví zajišťuje spolupráci v oblastech vojenské, ekonomické a kulturní, upevňuje pouta mezi našimi národy a zajišťuje naše místo ve silnějším, sjednoceném germánském světě." # todo: NEW TRANSLATION
 HOL_germanic_union_infrastructure_efforts: "Infrastrukturní snahy Germánské unie" # todo: NEW TRANSLATION
 HOL_germanic_union_infrastructure_efforts_desc: "Aby se posílila jednota a ekonomická síla Germánské unie, probíhají masivní infrastrukturní projekty napříč členskými zeměmi. Železnice, dálnice a logistické uzly se rozšiřují, aby byla zajištěna bezproblémová konektivita, podpořen obchod a posíření bojové pohotovosti. Tyto snahy symbolizují náš závazek k silnějšímu, propojenějšímu germánskému světu." # todo: NEW TRANSLATION
 HOL_d66_democratic_institutions_idea: "Posílené demokratické instituce" # todo: NEW TRANSLATION
 HOL_d66_democratic_institutions_idea_desc: "Úsilí o posílení demokratických procesů zvýšilo důvěru veřejnosti ve správu země. Díky větší transparentnosti, odpovědnosti a účasti občanů představuje Nizozemsko vzor moderní a efektivní demokracie." # todo: NEW TRANSLATION
 HOL_gl_affordable_housing_plan_idea: "Iniciativa dostupného bydlení" # todo: NEW TRANSLATION
 HOL_gl_affordable_housing_plan_idea_desc: "Díky významným investicím do udržitelného a dostupného bydlení řeší Nizozemsko bytovou krizi přímo. Tato iniciativa zajišťuje, aby každý občan měl přístup k bezpečnému, stabilnímu a ekologickému domovu." # todo: NEW TRANSLATION
 HOL_gl_international_solidarity_idea: "Mezinárodní solidarita" # todo: NEW TRANSLATION
 HOL_gl_international_solidarity_idea_desc: "GroenLinks vytvořila silná mezinárodní partnerství k řešení globálních výzev. Prosazováním míru, lidských práv a udržitelného rozvoje představuje Nizozemsko na světové scéně maják spolupráce a pokroku." # todo: NEW TRANSLATION
 HOL_gl_transparent_government_idea: "Transparentní správa" # todo: NEW TRANSLATION
 HOL_gl_transparent_government_idea_desc: "Díky neochvějnému závazku k odpovědnosti a otevřenosti zajistila GroenLinks transparentní fungování vlády a umožnila občanům důvěřovat svému vedení a zapojovat se do něj." # todo: NEW TRANSLATION
 HOL_gl_diversify_workforce_idea: "Diverzifikovaná pracovní síla" # todo: NEW TRANSLATION
 HOL_gl_diversify_workforce_idea_desc: "Prostřednictvím inkluzivních politik a programů rovných příležitostí vytvořila GroenLinks pracovní sílu odrážející rozmanitost a sílu nizozemské společnosti, čímž zajišťuje spravedlnost a inovace v každém odvětví." # todo: NEW TRANSLATION
 HOL_gl_fair_trade_idea: "Koaliční dohoda o spravedlivém obchodu" # todo: NEW TRANSLATION
 HOL_gl_fair_trade_idea_desc: "V rámci koaliční dohody vyjednané s GroenLinks se vláda zavázala k novému rámci mezinárodního obchodu. Obchodní politika, vedená progresivní agendou GroenLinks, nyní klade ekologickou odpovědnost, práva pracujících a sociální spravedlnost nad čistý zisk. To představuje jasný odklon od tradičních tržních modelů směrem k ekonomické vizi založené na hodnotách." # todo: NEW TRANSLATION
 HOL_d66_rule_of_law_idea: "Obrana právního státu" # todo: NEW TRANSLATION
 HOL_d66_rule_of_law_idea_desc: "D66 zajistila v rámci koaliční dohody klíčové právní reformy, které znovu potvrzují nezávislost soudnictví, transparentnost správy a přísné dodržování ústavních norem. V době populistického tlaku a politické roztříštěnosti mají tato opatření chránit demokratické instituce a právní stát doma i v zahraničí." # todo: NEW TRANSLATION
 HOL_religious_education_policy: "Politika náboženského vzdělávání" # todo: NEW TRANSLATION
 HOL_religious_education_policy_desc: "Vláda upřednostňuje náboženské vzdělávání a zajišťuje, aby školy odrážely morální a duchovní hodnoty svých komunit. Podporou náboženských institucí Nizozemsko buduje základy silných, zásadových občanů." # todo: NEW TRANSLATION
 HOL_family_focus: "Důraz na tradiční rodinu" # todo: NEW TRANSLATION
 HOL_family_focus_desc: "Podpora tradiční rodinné struktury se stala pilířem národní politiky, posouvána SGP v rámci koaličních jednání. Fiskální pobídky a kulturní iniciativy si kladou za cíl podporovat stabilní, vícegenerační domácnosti, zatímco posilují roli rodiny jako základu morálního a sociálního pořádku." # todo: NEW TRANSLATION
 HOL_sunday_rest: "Svatost nedělního odpočinku" # todo: NEW TRANSLATION
 HOL_sunday_rest_desc: "Neděle je považována za posvátný den odpočinku a bohoslužby. Omezováním obchodních a veřejných činností tato politika zajišťuje, že občané mohou ctít tradice, posilovat rodinné vazby a nalézt duchovní obnovu." # todo: NEW TRANSLATION
 HOL_asml1: "ASML" # todo: NEW TRANSLATION
 HOL_asml1_desc: "Vedoucí postavení společnosti ASML v oblasti litografie staví Nizozemsko do centra světového průmyslu mikročipů. Tato dominance urychluje náš výzkum výpočetní techniky a výroby čipů a zároveň mění vývoz polovodičů ve stabilní zdroj státních příjmů." # todo: NEW TRANSLATION
 HOL_nonselfsufficient_army1: "Závislá vojenská výroba" # todo: NEW TRANSLATION
 HOL_nonselfsufficient_army1_desc: "[HOL_not_selsufficient_army1_loc]\n------------\nMůžeme se této §Rnárodní myšlenky§! zbavit dokončením §YDomácích investic§!, které jsou zaměřeny na §YVojenskou§! větev fokusů." # todo: CHANGED
 HOL_nonselfsufficient_army1_tt: "[HOL_not_selsufficient_army3_loc]" # todo: NEW TRANSLATION
 HOL_nonselfsufficient_army_emergency: "Vojenská pohotovost" # todo: NEW TRANSLATION
 HOL_nonselfsufficient_army_emergency_desc: "[HOL_not_selsufficient_army2_loc]" # todo: NEW TRANSLATION
 HOL_nonselfsufficient_army_emergency_tt: "\n§YPožadavky na zrušení mimořádného stavu:§!\n - Více než 15 $arms_factory$\n - Nemít $HOL_nonselfsufficient_army1$\n - Mít na skladě více než nasazené množství: $infantry_weapons_type$, $util_vehicle_type$, $cnc_equipment_type$, $artillery_equipment$, $medium_tank_amphibious_chassis$, $medium_tank_flame_chassis$, $medium_tank_chassis$" # todo: NEW TRANSLATION
 HOL_nso1: "Nizozemská kosmická organizace (NSO)" # todo: NEW TRANSLATION
 HOL_nso1_desc: "Nizozemská kosmická organizace (NSO) slouží jako centrální agentura pro kosmický výzkum, vývoj satelitů a programy průzkumu země. Koordinuje národní snahy v oblasti kosmických technologií, podporuje mezinárodní partnerství a posouvá vědecké porozumění vesmíru." # todo: NEW TRANSLATION
 HOL_nato_commitments_idea: "Závazky NATO" # todo: NEW TRANSLATION
 HOL_nato_commitments_idea_desc: "S rostoucím globálním napětím zůstává NATO základem bezpečnosti Nizozemska. Opětným potvrzením našeho závazku alianci můžeme zajistit obrannou spolupráci a technologické výhody od našich spojenců." # todo: NEW TRANSLATION
 HOL_nato_training_program: "Společný výcvik NATO" # todo: NEW TRANSLATION
 HOL_nato_training_program_desc: "" # todo: NEW TRANSLATION
 HOL_nato_maritime_security: "Vedení v námořní bezpečnosti" # todo: NEW TRANSLATION
 HOL_nato_maritime_security_desc: "" # todo: NEW TRANSLATION
 HOL_caribbean_naval_cooperation: "Společná karibská námořní spolupráce" # todo: NEW TRANSLATION
 HOL_caribbean_naval_cooperation_desc: "Společný karibský námořní program posiluje naše námořnictvo a umožňuje nám koordinovat výcvik, námořní hlídky a obranné strategie po boku Královského nizozemského námořnictva." # todo: NEW TRANSLATION
 HOL_asml_USA_tech_partnership: "Pakt technologické integrace ASML–USA" # todo: NEW TRANSLATION
 HOL_asml_USA_tech_partnership_desc: "Nizozemsko a Spojené státy uzavřely strategické partnerství na vysoké úrovni zaměřené na inovace v oblasti polovodičů, kybernetickou obranu a přesnou výrobu. Nizozemská společnost ASML stojí v srdci této spolupráce a poskytuje nám špičkovou výhodu ve výzkumu a průmyslové produkci. Hlubší integrace s americkou technologickou infrastrukturou však zvýšila naši závislost na vývozní politice USA a napjala naše obchodní vztahy s nezúčastněnými mocnostmi." # todo: NEW TRANSLATION
 HOL_shell_lng_deal: "Strategická energetická dohoda Shell-LNG" # todo: NEW TRANSLATION
 HOL_shell_lng_deal_desc: "Prostřednictvím komplexního energetického paktu s mezinárodními partnery zajistil Shell Nizozemsku přístup k infrastruktuře LNG, těžbě paliv na moři a globálním energetickým koridorům. To posiluje naši hospodářskou stabilitu a naši zásobovací síť. Pokračující investice do fosilních paliv vyvolávají domácí kritiku a omezují naši schopnost inovovat v oblasti špičkových technologií v jiných odvětvích." # todo: NEW TRANSLATION
 HOL_dutch_realpolitik_idea: "Nizozemská realpolitik" # todo: NEW TRANSLATION
 HOL_dutch_realpolitik_idea_desc: "" # todo: NEW TRANSLATION
 HOL_suriname_trade_agreement_idea1: "Surinamsko-obchodní a rozvojová dohoda" # todo: NEW TRANSLATION
 HOL_suriname_trade_agreement_idea1_desc: " Bilaterální obchodně-rozvojová dohoda se Surinamem otevřela nové příležitosti pro nizozemské investice v Jižní Americe. S lepším vstupem na trhy, přístavní logistikou a vzájemnými infrastrukturními iniciativami dohoda posiluje hospodářskou spolupráci a znovu potvrzuje Nizozemsko jako klíčového hráče v rozvoji regionu." # todo: NEW TRANSLATION
 HOL_suriname_training_program: "Surinamsko-nizozemský vojenský výcvikový program" # todo: NEW TRANSLATION
 HOL_suriname_training_program_desc: " Prostřednictvím společné výcvikové iniciativy se surinamskými ozbrojenými silami prohlubuje regionální obranné vazby Nizozemska a podporuje stabilitu v severní Jižní Americe. Nizozemští instruktoři poskytují odborné znalosti v logistice, mírovém nasazení a protinarkotických operacích, zatímco podporují interoperabilitu a dlouhodobou bezpečnostní spolupráci." # todo: NEW TRANSLATION
 HOL_support_boer_parties: "Podpora Boerovských politických hnutí" # todo: NEW TRANSLATION
 HOL_support_boer_parties_desc: "Nizozemsko zahájilo neoficiální podporu Boerovských politických stran v Jižní Africe, odvolávající se na historické vazby a sdílené kulturní dědictví. Tato podpora zahrnuje mediální osvětu, finanční pomoc a ideologickou solidaritu. Ačkoli je to prezentováno jako kulturní diplomacie, krok vyvolává vážné pochybnosti o nizozemských záměrech a o vnitřní stabilitě Jihoafrické republiky." # todo: NEW TRANSLATION
 HOL_counter_terrorism_idea1: "Národní protiteroristická úderná skupina" # todo: NEW TRANSLATION
 HOL_counter_terrorism_idea1_desc: "Po rostoucích obavách z radikalizace a domácích hrozeb vláda aktivovala jednotnou protiteroristickou údernou skupinu pod koordinací NCTV. S úzkou spoluprací mezi AIVD, policií a vojenskou policií tato struktura zajišťuje rychlou identifikaci hrozeb, preventivní strategie a rozhodné schopnosti reakce po celé zemi." # todo: NEW TRANSLATION
 HOL_demissionaire_regering_idea: "Demisiční kabinet" # todo: NEW TRANSLATION
 HOL_demissionaire_regering_idea_desc: "Po zhroucení vládní koalice vláda nyní funguje v demisi. Bez mandátu prosazovat nové politiky a s oslabenou parlamentní podporou čelí země období politické stagnace a nejistoty, dokud nebude vytvořeno nové vedení." # todo: NEW TRANSLATION
 HOL_demissionaire_regering_idea_TT: "§RThis idea will be removed once we have a new government§!" # todo: NEW TRANSLATION
 HOL_royal_decree_industrial_promotion: "Královský dekret o národním průmyslu" # todo: NEW TRANSLATION
 HOL_royal_decree_industrial_promotion_desc: "Na příkaz koruny byl vydán rozsáhlý dekret na posílení průmyslové moci Království. S královským patronátem v klíčových odvětvích se továrny rozšiřují, inovace jsou podporovány a nizozemská ekonomika je připravena znovu získat své postavení jako evropský lídr v produkci a obchodu." # todo: NEW TRANSLATION
 HOL_strengthening_eurozone_idea: "Posílení eurozóny" # todo: NEW TRANSLATION
 HOL_strengthening_eurozone_idea_desc: "" # todo: NEW TRANSLATION
 HOL_social_democratic_modifier: "Sociální a demokratická společnost" # todo: NEW TRANSLATION
 HOL_economy: "Nizozemská ekonomika" # todo: NEW TRANSLATION
 HOL_economy_desc: "Od jeřábů v Rotterdamu přes skleníky Westlandu až po čisté prostory Brainportu prosperuje nizozemská ekonomika jako jedno z velkých evropských obchodních center. Staletí obchodu, rekultivace půdy a neúnavných inovací vytvořila otevřenou exportní velmoc zahrnující zemědělství, logistiku, energetiku, finance a špičkové technologie, kde každý nový podnik posiluje celek." # todo: NEW TRANSLATION
 HOL_polder_model: "Polderový model" # todo: NEW TRANSLATION
 HOL_polder_model_desc: "Polderový model je nizozemská tradice tvorby politik založené na konsenzu, v níž vláda, zaměstnavatelé a odbory vyjednávají široké dohody místo jednostranného rozhodování. Tato tradice, zakořeněná ve staletích společné správy vodních děl, upřednostňuje kompromis a stabilní koalice, díky čemuž je nizozemská politika odolná a diplomaticky důvěryhodná, ovšem za cenu pomalejších a uvážlivějších reforem." # todo: NEW TRANSLATION
 HOL_brainport: "Eindhoven Brainport" # todo: NEW TRANSLATION
 HOL_brainport_desc: "Eindhoven Brainport je přední vysoce technologický region v Nizozemsku, proslulý svou inovací a vyspělými technologickými průmysly. S centrem v Eindhovenu je tato oblast silným motorem pro odvětví jako polovodiče, automobilová technika a robotics. Domov pro globální společnosti jako ASML a Philips, Brainport Eindhoven pohání významný ekonomický růst a je klíčovým přispěvatelem k postavení Nizozemska jako globálního lídra v technologiích a inovacích." # todo: NEW TRANSLATION
 HOL_brainport_tt: "Rychlost výzkumu v oblasti počítačové techniky: §G+15%§!" # todo: NEW TRANSLATION
 HOL_cmp: "Commissariaat Militaire Productie" # todo: NEW TRANSLATION
 HOL_cmp_desc: "Commissariaat Militaire Productie (CMP), neboli Komisařství pro vojenskou výrobu, byl nizozemský vládní orgán zřízený za účelem dohledu nad výrobou vojenského vybavení a zásob a její koordinace. Jeho hlavním úkolem bylo zajistit dostatečné vybavení nizozemských obranných sil, zejména v době konfliktu nebo zvýšené vojenské připravenosti. CMP spravovalo smlouvy s domácím průmyslem, regulovalo výrobu zbraní, munice, vozidel a dalších vojenských potřeb a zajišťovalo jejich výrobu v požadované kvalitě a termínech." # todo: NEW TRANSLATION
 HOL_noordzee_parken: "Noordzee Energiepark" # todo: NEW TRANSLATION
 HOL_army: "Koninklijke Landmacht" # todo: NEW TRANSLATION
 HOL_army_desc: "Koninklijke Landmacht neboli Královská nizozemská armáda je pozemní složkou nizozemských ozbrojených sil, jejíž kořeny sahají do 16. století. Odpovídá za obranu nizozemského území a přispívá k mezinárodním misím včetně mírových operací NATO a OSN. Armáda je vybavena moderními vozidly, dělostřelectvem a komunikačními systémy. Královská nizozemská armáda je všestranná síla připravená čelit široké škále bezpečnostních výzev doma i v zahraničí." # todo: NEW TRANSLATION
 HOL_navy: "Koninklijke Marine" # todo: NEW TRANSLATION
 HOL_navy_desc: "Koninklijke Marine neboli Královské nizozemské námořnictvo je námořní složkou nizozemských ozbrojených sil. Chrání nizozemské námořní zájmy, promítá moc v zahraničí a úzce spolupracuje se spojeneckými flotilami. Tento modifikátor odráží souhrn doktrinálních, výcvikových a pořizovacích rozhodnutí učiněných v rámci námořní větve národního stromu zaměření." # todo: NEW TRANSLATION
 HOL_gujurat_port_patrol1: "Malá [HOL.GetAdjectiveCap] proslulost" # todo: NEW TRANSLATION
 HOL_gujurat_port_patrol1_desc: "Přítomnost maoistických vzbouřenců v tomto státě vytvořila mocenské vakuum, které Nizozemci začali zneužívat. Zatímco jejich vliv zůstává malý, pomalu posilují svou pozici, jak centrální vláda usiluje o udržení kontroly." # todo: NEW TRANSLATION
 HOL_gujurat_port_patrol3: "Střední [HOL.GetAdjectiveCap] proslulost" # todo: NEW TRANSLATION
 HOL_gujurat_port_patrol3_desc: "Vzhledem k tomu, že indická vláda je rozptýlena aktivitou maoistických vzbouřenců, Nizozemci rozšířili svůj vliv v tomto státě. Jejich přítomnost se stává stále patrnější, ekonomicky i politicky, zatímco místní správa slábne." # todo: NEW TRANSLATION
 HOL_gujurat_port_patrol4: "Dominantní [HOL.GetAdjectiveCap] proslulost" # todo: NEW TRANSLATION
 HOL_gujurat_port_patrol4_desc: "Nizozemci plně využili nestabilitu způsobenou maoistickými vzbouřenci a dosáhli téměř úplného vlivu v tomto státě. Nadvláda indické vlády téměř zmizela, a zůstali tak hlavní mocí v regionu." # todo: NEW TRANSLATION
