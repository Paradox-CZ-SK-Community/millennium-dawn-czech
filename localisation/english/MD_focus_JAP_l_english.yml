l_english:
 japan_focus: "Japonský strom zaměření" # todo: NEW TRANSLATION
 JAP_choice: "Politický restart" # todo: NEW TRANSLATION
 JAP_choice_desc: "Uprostřed dlouhodobé stagnace a únavy institucí důvěra v politiku kolísá, zatímco potřeba reforem se stále hromadí. Má-li se země posunout vpřed, musí nejprve jasně vymezit směr vládnutí a vytvořit rámec pro rozhodování." # todo: NEW TRANSLATION
 JAP_left: "Levice Japonska" # todo: NEW TRANSLATION
 JAP_left_desc: "Smyslem politiky není pouze hospodářský růst, ale také ochrana živobytí a důstojnosti lidí. Zajistíme transparentnost a důsledně dohlédneme na ty, kdo jsou u moci, posílíme vyjednávací sílu pracujících a sociální záchrannou síť a zmenšíme nerovnost a nejistotu. Prosazováním vládnutí, které nezanedbává lidská práva, a podporou přechodu k udržitelné energetice chceme obnovit japonskou společnost." # todo: NEW TRANSLATION
 JAP_left_TT: "§YMůžete výrazně zvýšit oblibu jedné z levicových stran!\nPokud je však vládnoucí stranou, zvýšení zůstane malé.§!" # todo: NEW TRANSLATION
 JAP_information_disclosure: "Posílit zveřejňování informací" # todo: NEW TRANSLATION
 JAP_information_disclosure_desc: "Pro obnovení důvěry v politiku a veřejnou správu prosadíme důsledné zveřejňování informací a posílíme tvorbu, uchovávání a zpřístupňování úředních dokumentů. Tím odstraníme živnou půdu pro korupci a klientelismus, zprůhledníme rozhodování o politikách a usnadníme prosazování reforem." # todo: NEW TRANSLATION
 JAP_left_party_TT: "Musí platit jedna z následujících podmínek:\n§Y$JAP.liberalism$§! je u moci.\n§Y$JAP.liberalism_alt$§! je u moci.\n§Y$JAP.neutral_Social$§! je u moci.\n§Y$JAP.Neutral_Communism$§! je u moci.\n§Y$JAP.anarchist_communism$§! je u moci.\n" # todo: NEW TRANSLATION
 JAP_management_documents: "Přísná správa úředních dokumentů" # todo: NEW TRANSLATION
 JAP_management_documents_desc: "Záznamy o rozhodnutích při tvorbě politik, průběhu správních řízení a dokumenty držené veřejnými institucemi uspořádáme a uchováme podle jednotného standardu a zároveň posílíme systém jejich správy. Prevencí rozptylování záznamů a nesprávného nakládání s nimi a zlepšením ověřitelnosti a kontinuity správy chceme zvýšit spolehlivost a praktickou efektivitu fungování vlády." # todo: NEW TRANSLATION
 JAP_digital_archiving: "Digitální archivace úředních dokumentů" # todo: NEW TRANSLATION
 JAP_digital_archiving_desc: "Úřední záznamy digitalizujeme a budeme spravovat centrálně, aby se zjednodušilo jejich vyhledávání, sdílení a uchovávání. Odklonem od postupů založených na papírových dokumentech snížíme administrativní zátěž a náklady na správu a omezíme vládní výdaje." # todo: NEW TRANSLATION
 JAP_independent_audits: "Plně nezávislé audity" # todo: NEW TRANSLATION
 JAP_independent_audits_desc: "Zajistíme úplnou nezávislost kontrolních orgánů a vytvoříme dohledový systém bez zásahů politiků či byrokracie. Usnadníme včasné odhalování klientelismu a pochybení, podpoříme protikorupční úsilí a obnovením důvěry v politiku posílíme také hybnou sílu provádění politik." # todo: NEW TRANSLATION
 JAP_eliminating_amakudari: "Vymýtit amakudari" # todo: NEW TRANSLATION
 JAP_eliminating_amakudari_desc: "Ukončíme praxi amakudari, která snadno podporuje klientelismus mezi úředníky a korporacemi, a provedeme zásadní zásah do zakořeněných výsad. Zlepšením transparentnosti jmenování a posílením konkurence omezíme korupci, snížíme neefektivitu a zvýšíme produktivitu." # todo: NEW TRANSLATION
 JAP_disclosure_of_political_funding: "Úplné zveřejňování financování politiky" # todo: NEW TRANSLATION
 JAP_disclosure_of_political_funding_desc: "Důsledně zveřejníme tok politických prostředků a zviditelníme dárce i výdaje. Tím zmenšíme prostor pro vstup neprůhledných peněz do politiky a podpoříme protikorupční úsilí, zároveň posílíme odolnost vůči vlivovým operacím zahraničních aktérů." # todo: NEW TRANSLATION
 JAP_protecting_human_rights: "Chránit lidská práva" # todo: NEW TRANSLATION
 JAP_protecting_human_rights_desc: "Ochranu důstojnosti a práv každého člověka postavíme do středu vládnutí. Nápravou diskriminace a nespravedlivého zacházení a budováním společnosti, v níž mohou lidé žít s klidem, posílíme domácí soudržnost a stabilitu." # todo: NEW TRANSLATION
 JAP_same_sex_partnerships: "Legalizovat stejnopohlavní partnerství" # todo: NEW TRANSLATION
 JAP_same_sex_partnerships_desc: "Právně uznáme stejnopohlavní partnery a zavedeme systém, který omezí každodenní znevýhodnění v oblastech, jako je souhlas s léčbou, bydlení a dědictví. Respektem k různým podobám rodiny a zmírněním společenských rozporů posílíme domácí stabilitu." # todo: NEW TRANSLATION
 JAP_employment_disabilities: "Rozšířit zaměstnávání lidí se zdravotním postižením" # todo: NEW TRANSLATION
 JAP_employment_disabilities_desc: "Vytvoříme prostředí, v němž mohou lidé pracovat bez ohledu na zdravotní postižení, a rozšíříme podporu zaměstnanosti i přiměřená opatření na pracovištích. Rozšířením pracovních příležitostí posílíme pracovní sílu a podporou společenského zapojení přispějeme také k domácí stabilitě." # todo: NEW TRANSLATION
 JAP_prevent_domestic_violence: "Úsilí o prevenci domácího násilí" # todo: NEW TRANSLATION
 JAP_prevent_domestic_violence_desc: "Posílíme prevenci a včasné odhalování domácího násilí a rozšíříme poradenské služby a ochrannou podporu. Přerušením koloběhu zneužívání a snížením nejistoty a násilí v domácnostech zvýšíme společenskou stabilitu." # todo: NEW TRANSLATION
 JAP_protecting_labor_union: "Chránit práva odborů" # todo: NEW TRANSLATION
 JAP_protecting_labor_union_desc: "Jasně zaručíme práva odborových organizací a vytvoříme prostředí, v němž může řádně probíhat kolektivní vyjednávání a konzultace mezi zaměstnanci a zaměstnavateli. Zohledněním hlasu pracovišť v institucích a řízení podniků podpoříme stabilitu zaměstnání a pracovních podmínek." # todo: NEW TRANSLATION
 JAP_subcontracto: "Omezit šikanu subdodavatelů" # todo: NEW TRANSLATION
 JAP_subcontracto_desc: "Zakročíme proti nespravedlivým požadavkům na snižování cen, opožděným platbám a jednostranným změnám smluvních podmínek vnucovaným subdodavatelům a vybudujeme spravedlivé obchodní prostředí. Ochranou příjmové základny malých a středních podniků posílíme zdraví celého dodavatelského řetězce a přispějeme ke společenské stabilitě." # todo: NEW TRANSLATION
 JAP_pressure_wage_increases: "Tlak na růst mezd" # todo: NEW TRANSLATION
 JAP_pressure_wage_increases_desc: "Budeme podniky povzbuzovat ke zvyšování mezd a růstu příjmů domácností. Podporou spotřeby a zmírněním nejistoty v každodenním životě posílíme společenskou stabilitu a budeme usilovat o příznivý ekonomický cyklus." # todo: NEW TRANSLATION
 JAP_regulation_temporary_agency_work: "Zpřísnit regulaci agenturní práce" # todo: NEW TRANSLATION
 JAP_regulation_temporary_agency_work_desc: "Omezíme zneužívání agenturní práce a podpoříme stabilitu zaměstnání a lepší pracovní podmínky. Upřednostněním bezpečného a dlouhodobého pracovního prostředí před krátkodobou efektivitou posílíme společenskou stabilitu." # todo: NEW TRANSLATION
 JAP_ban_non_regular_employment: "Zakázat nestandardní zaměstnání" # todo: NEW TRANSLATION
 JAP_ban_non_regular_employment_desc: "Zreformujeme pracovní postupy založené na nestandardním zaměstnání a přejdeme k systému, v němž může každý získat stabilní práci a spravedlivé zacházení. Snížením nejistoty v každodenním životě a omezením společenského rozdělení posílíme národní stabilitu." # todo: NEW TRANSLATION
 JAP_redistribution: "Upřednostnit přerozdělování" # todo: NEW TRANSLATION
 JAP_redistribution_desc: "Přejdeme k politice, která upřednostňuje nápravu příjmové nerovnosti a ekonomické nejistoty a velkoryseji přiděluje zdroje těm, kteří potřebují podporu. Přerozdělováním omezíme společenské rozdělení, zvýšíme pocit bezpečí lidí a budeme usilovat o stabilní vládnutí." # todo: NEW TRANSLATION
 JAP_reducing_medical_costs: "Snížit výdaje na zdravotní péči z vlastní kapsy" # todo: NEW TRANSLATION
 JAP_reducing_medical_costs_desc: "Snížíme přímé výdaje na zdravotní péči a vybudujeme systém, v němž mohou lidé bez obav získat potřebnou léčbu. Zmírněním finanční úzkosti domácností a omezením prohlubování zdravotních rozdílů posílíme společenskou stabilitu." # todo: NEW TRANSLATION
 JAP_care_workers: "Zlepšit platy a podmínky pečujících pracovníků" # todo: NEW TRANSLATION
 JAP_care_workers_desc: "Zlepšíme mzdy a pracovní podmínky pečujících pracovníků a podpoříme nábor a udržení pracovní síly. Posílením kontinuity péče, zmírněním zátěže rodin a podporou účasti na trhu práce přispějeme ke společenské stabilitě." # todo: NEW TRANSLATION
 JAP_housing_support: "Rozšířit podporu bydlení" # todo: NEW TRANSLATION
 JAP_housing_support_desc: "Rozšíříme podporu bydlení, abychom snížili náklady na nájem a pomohli lidem zajistit stabilní bydlení. Zmírněním bytové nejistoty a podporou stability každodenního života omezíme společenské rozdělení a posílíme domácí stabilitu." # todo: NEW TRANSLATION
 JAP_student_loans: "Snížit zátěž studentských půjček" # todo: NEW TRANSLATION
 JAP_student_loans_desc: "Snížíme zátěž spojenou se splácením studentských půjček a odstraníme překážky vysokoškolského vzdělávání a rekvalifikace. Rozvojem lidského kapitálu jako investice do budoucnosti podpoříme pokrok ve výzkumu a technologiích." # todo: NEW TRANSLATION
 JAP_leading_disarmament: "Vést odzbrojovací diplomacii" # todo: NEW TRANSLATION
 JAP_leading_disarmament_desc: "Odzbrojení a snižování napětí učiníme pilíři naší zahraniční politiky a budeme usilovat o regionální stabilitu prostřednictvím dialogu a budování důvěry. Upřednostníme řešení, která se nespoléhají na sílu, a budeme pracovat na zlepšení vztahů s ostatními zeměmi." # todo: NEW TRANSLATION
 JAP_restricting_arms_exports: "Omezit vývoz zbraní" # todo: NEW TRANSLATION
 JAP_restricting_arms_exports_desc: "Omezíme vývoz zbraní a jasně vyšleme diplomatický signál, že méně přispíváme k vojenskému napětí. Upřednostněním odzbrojení a budování důvěry podpoříme dialog směřující k regionální stabilitě." # todo: NEW TRANSLATION
 JAP_principle_of_no_armed_forces: "Znovu potvrdit zásadu bez ozbrojených sil" # todo: NEW TRANSLATION
 JAP_principle_of_no_armed_forces_desc: "Znovu potvrdíme zásadu neudržovat ozbrojené síly a jasně vyjádříme postoj vládnutí, které se nespoléhá na vojenskou moc. Pacifismus postavíme do středu naší politiky a zdůrazníme bezpečnost prostřednictvím diplomacie a mezinárodní spolupráce." # todo: NEW TRANSLATION
 JAP_abrogating_us_japan_security_treaty: "Zrušit japonsko-americkou bezpečnostní smlouvu" # todo: NEW TRANSLATION
 JAP_abrogating_us_japan_security_treaty_desc: "Odstoupíme od japonsko-amerického bezpečnostního rámce a přejdeme k nezávislé bezpečnostní politice, která se neopírá o závislost na Spojených státech. Tím rozšíříme svobodu naší zahraniční politiky a jasněji prosadíme svou suverenitu a nezávislost." # todo: NEW TRANSLATION
 JAP_dissolving_sdf: "Rozpustit Síly sebeobrany" # todo: NEW TRANSLATION
 JAP_dissolving_sdf_desc: "Rozpustíme Síly sebeobrany a přejdeme k vládnutí, které se nespoléhá na vojenskou moc. Přesměrováním zdrojů a úsilí dříve věnovaných obraně do civilního sektoru upřednostníme posílení průmyslu a základů každodenního života a urychlíme domácí rozvoj." # todo: NEW TRANSLATION
 JAP_army_delete_TT: "§ROdstraněny budou všechny pozemní síly!§!" # todo: NEW TRANSLATION
 JAP_right: "Pravice Japonska" # todo: NEW TRANSLATION
 JAP_right_desc: "Zdůrazňujeme kapacitu státu a společenský řád a prosazujeme silnější veřejnou bezpečnost, krizovou reakci a zahraniční a bezpečnostní politiku, která staví národní zájmy do popředí. Usilujeme o růst prostřednictvím regulačních reforem a oživení podnikatelské činnosti a chceme zemi obnovit na základech tradice a komunitních hodnot." # todo: NEW TRANSLATION
 JAP_right_TT: "§YMůžete výrazně zvýšit oblibu jedné z pravicových stran!\nPokud je však vládnoucí stranou, zvýšení zůstane malé.§!" # todo: NEW TRANSLATION
 JAP_strengthen_military_power: "Politika posílení vojenské moci" # todo: NEW TRANSLATION
 JAP_strengthen_military_power_desc: "S ohledem na změny v bezpečnostním prostředí jasně stanovíme posílení obranných schopností jako státní politiku. Posílením odstrašení předejdeme hrozbám dříve, než se uskuteční, a prokážeme odhodlání chránit veřejnou bezpečnost a národní suverenitu." # todo: NEW TRANSLATION
 JAP_right_party_TT: "Musí platit jedna z následujících podmínek:\n§Y$JAP.conservatism$§! je u moci.\n§Y$JAP.socialism$§! je u moci.\n§Y$JAP.Neutral_conservatism$§! je u moci.\n§Y$JAP.Neutral_conservatism2$§! je u moci.\n§Y$JAP.Neutral_conservatism3$§! je u moci.\n§Y$JAP.Neutral_conservatism4$§! je u moci.\n§Y$JAP.Neutral_Libertarian$§! je u moci.\n§Y$JAP.Nat_Populism$§! je u moci.\n" # todo: NEW TRANSLATION
 JAP_allow_overseas_deployment: "Povolit nasazení Sil sebeobrany v zahraničí" # todo: NEW TRANSLATION
 JAP_allow_overseas_deployment_desc: "S přihlédnutím k mezinárodní situaci a spolupráci se spojenci jasně stanovíme politiku umožňující zahraniční nasazení Sil sebeobrany. Účastí na mezinárodních misích posílíme odstrašení a vliv a budeme aktivněji chránit národní zájmy a bezpečnost." # todo: NEW TRANSLATION
 JAP_international_missions: "Právní rámec pro mezinárodní mise" # todo: NEW TRANSLATION
 JAP_international_missions_desc: "Zavedeme právní základ a postupy pro účast na mezinárodních misích a vytvoříme systém, v němž mohou Síly sebeobrany působit podle jednotných pravidel. Tím snížíme nejistotu v terénu a umožníme spolehlivější provádění mezinárodní spolupráce." # todo: NEW TRANSLATION
 JAP_revising_use_weapons: "Přezkoumat pravidla použití zbraní" # todo: NEW TRANSLATION
 JAP_revising_use_weapons_desc: "Přezkoumáme standardy a postupy pro použití zbraní tak, aby odpovídaly realitě mezinárodních misí a krizové reakce. Vyjasněním rozsahu pravomocí a odpovědnosti potřebných k plnění misí vytvoříme systém, v němž mohou Síly sebeobrany přiměřeně chránit sebe i ostatní." # todo: NEW TRANSLATION
 JAP_exclusive_defense: "Udržovat výhradně obranný postoj" # todo: NEW TRANSLATION
 JAP_exclusive_defense_desc: "Výhradně obranný postoj budeme přísně udržovat jako hlavní zásadu naší bezpečnostní politiky a jasně omezíme použití obranných schopností na prevenci útoků proti naší zemi. Při zachování odstrašení se vyhneme nadměrnému vojenskému rozšiřování a ukážeme postoj, který méně pravděpodobně zvýší napětí se sousedními zeměmi." # todo: NEW TRANSLATION
 JAP_exclusive_defense_TT: "§YTento národní fokus posune Rovnováhu moci blíže k úrovni 2!§!" # todo: NEW TRANSLATION
 JAP_collective_self_defense: "Politika umožňující kolektivní sebeobranu" # todo: NEW TRANSLATION
 JAP_collective_self_defense_desc: "Vzhledem k tomu, že útoky na spojence mohou přímo ovlivnit i naši vlastní bezpečnost, jasně stanovíme politiku umožňující výkon kolektivní sebeobrany. Tím posílíme odstrašení i účinnost aliancí a vybudujeme aktivnější bezpečnostní rámec." # todo: NEW TRANSLATION
 JAP_prioritizing_order: "Upřednostnit pořádek" # todo: NEW TRANSLATION
 JAP_prioritizing_order_desc: "Společenský řád a veřejnou bezpečnost postavíme mezi nejvyšší priority vládnutí. Oceňováním pravidel a odpovědnosti a udržováním veřejné bezpečnosti a stabilní správy obnovíme základy národa." # todo: NEW TRANSLATION
 JAP_strengthen_public_security: "Komplexní plán veřejné bezpečnosti" # todo: NEW TRANSLATION
 JAP_strengthen_public_security_desc: "Provedeme úplný přezkum systému veřejné bezpečnosti a vytvoříme komplexní plán zahrnující vybavení, personál a koordinaci informací. Zefektivněním provozu v terénu a současným posílením policejních schopností zvýšíme odstrašení kriminality a zajistíme společenskou stabilitu." # todo: NEW TRANSLATION
 JAP_against_organized_crime: "Posílit opatření proti organizovanému zločinu" # todo: NEW TRANSLATION
 JAP_against_organized_crime_desc: "Zintenzivníme zásahy proti organizovanému zločinu, přerušíme zdroje jeho financování a rozšíříme vyšetřovací kapacity. Obnovením domácí veřejné bezpečnosti posílíme společenskou stabilitu a vybudujeme také státní systém méně zranitelný infiltrací a vlivovými operacemi vnějších aktérů." # todo: NEW TRANSLATION
 JAP_against_terrorist_financing: "Opatření proti financování terorismu" # todo: NEW TRANSLATION
 JAP_against_terrorist_financing_desc: "Budeme přísně sledovat finanční toky a plně prosadíme systémy k přerušení financování teroristických organizací a extremistických skupin. Posílením koordinace mezi finančními a vyšetřovacími orgány ochráníme domácí bezpečnost, zvýšíme odolnost vůči vnějším vlivovým operacím a posílíme společenskou stabilitu." # todo: NEW TRANSLATION
 JAP_counter_espionage: "Vybudovat rámec proti špionáži" # todo: NEW TRANSLATION
 JAP_counter_espionage_desc: "Posílíme protiopatření proti zpravodajské činnosti a zavedeme systémy na ochranu utajovaných informací a zlepšení monitorování. Odrazením infiltrace a skrytých operací vnějších aktérů a ochranou národního rozhodování zajistíme domácí stabilitu." # todo: NEW TRANSLATION
 JAP_strengthening_cabinet: "Posílit pravomoci vlády" # todo: NEW TRANSLATION
 JAP_strengthening_cabinet_desc: "Posílíme řídicí a koordinační funkce vlády, abychom zvýšili rychlost a jednotnost rozhodování. Vybudováním systému schopného rychle reagovat na krize a klíčové politiky posílíme rozhodné vedení národní správy." # todo: NEW TRANSLATION
 JAP_cabinet_personnel_bureau: "Personální úřad vlády" # todo: NEW TRANSLATION
 JAP_cabinet_personnel_bureau_desc: "Zavedeme systém umožňující vládě centrálně dohlížet na personální záležitosti a posílíme transparentnost a kontrolu nad jmenováním vysokých představitelů. Dosazováním správných lidí na správná místa zefektivníme fungování byrokracie a zvýšíme schopnost vlády provádět politiku." # todo: NEW TRANSLATION
 JAP_breaking_down_bureaucratic_siloing: "Rozbít byrokratická sila" # todo: NEW TRANSLATION
 JAP_breaking_down_bureaucratic_siloing_desc: "Zreformujeme izolovanou správu mezi ministerstvy a posílíme sdílení informací i meziresortní koordinaci. Omezením duplicitních postupů a úzkých míst zefektivníme veřejnou správu a urychlíme provádění veřejných investic a projektů." # todo: NEW TRANSLATION
 JAP_policy_evaluation_and_kpis: "Zavést hodnocení politik a KPI" # todo: NEW TRANSLATION
 JAP_policy_evaluation_and_kpis_desc: "Zavedeme systém hodnocení a KPI, aby bylo možné výsledky politik ověřovat měřitelnými údaji. Přezkoumáním opatření s malým dopadem a soustředěním omezených zdrojů na oblasti s vysokým účinkem zlepšíme správní efektivitu a zvýšíme ekonomickou produktivitu." # todo: NEW TRANSLATION
 JAP_national_security_council: "Zřídit Radu národní bezpečnosti" # todo: NEW TRANSLATION
 JAP_national_security_council_desc: "Centralizujeme informace a rozhodování související s bezpečností v rámci vlády a vytvoříme systém umožňující rychlá a jednotná rozhodnutí. Posílením schopností krizové reakce a koordinace se spojenci a příslušnými orgány upevníme odstrašení." # todo: NEW TRANSLATION
 JAP_emergency_powers: "Ustanovení o mimořádných pravomocích" # todo: NEW TRANSLATION
 JAP_emergency_powers_desc: "V rámci přípravy na mimořádné situace, jako jsou velké katastrofy nebo ozbrojené útoky, vyjasníme pravomoci a postupy potřebné v nouzových stavech. Při zachování mírového dohledu urychlíme krizovou reakci, posílíme řetězec velení a zajistíme národní stabilitu i obranný postoj." # todo: NEW TRANSLATION
 JAP_regulatory_reform: "Růst prostřednictvím regulačních reforem" # todo: NEW TRANSLATION
 JAP_regulatory_reform_desc: "Přezkoumáme regulace a postupy, snížíme administrativní zátěž a podpoříme podnikatelskou činnost a investice. Usnadněním zakládání nových podniků a rozvoje zařízení zvýšíme tempo hospodářského růstu." # todo: NEW TRANSLATION
 JAP_postal_privatization: "Privatizace pošty" # todo: NEW TRANSLATION
 JAP_postal_privatization_desc: "Budeme pokračovat v privatizaci poštovních služeb a přepracujeme systém vedený státem s cílem zvýšit efektivitu veřejné správy. Přijetí tržních principů může posílit podnikatelskou činnost a daňovou základnu, reforma však může také vyvolat silný odpor a prohloubit politický konflikt." # todo: NEW TRANSLATION
 JAP_postal_privatization_TT: "§YSpustí se událost, v níž zvolíte, zda uspořádat předčasné volby po rozpuštění parlamentu!§!" # todo: NEW TRANSLATION
 JAP_second_wave_privatization: "Druhá fáze privatizace" # todo: NEW TRANSLATION
 JAP_second_wave_privatization_desc: "Privatizační reformy posuneme dále a přezkoumáme úlohu veřejného sektoru i způsob poskytování veřejných služeb. Snížením správní neefektivity a podporou investic a podnikatelské činnosti posílíme ekonomickou dynamiku." # todo: NEW TRANSLATION
 JAP_special_zones: "Národní strategické zvláštní zóny" # todo: NEW TRANSLATION
 JAP_special_zones_desc: "Ve vymezených oblastech vytvoříme regulační výjimky a soustředěně podpoříme vstup podniků a nové investice. Pokrokem v demonstračních projektech a komercializaci mimo stávající institucionální překážky urychlíme růst založený na dynamice soukromého sektoru a oživíme místní ekonomiky." # todo: NEW TRANSLATION
 JAP_expansion_regulatory_reform_zones: "Celostátní reformní zóny" # todo: NEW TRANSLATION
 JAP_expansion_regulatory_reform_zones_desc: "Výsledky dosažené ve zvláštních zónách rozšíříme na celou zemi a proměníme regulační reformu z regionální výjimky v národní standard. Snížením překážek vstupu a investic podpoříme nové podniky a hospodářské oživení v celé zemi." # todo: NEW TRANSLATION
 JAP_new_market_entry: "Podpořit vstup na nové trhy" # todo: NEW TRANSLATION
 JAP_new_market_entry_desc: "Snížíme překážky vstupu a podpoříme podnikání a zakládání nových firem. Podporou konkurence a inovací zvýšíme produktivitu a posílíme daňovou základnu." # todo: NEW TRANSLATION
 JAP_new_technologies: "Přivítat nové technologie" # todo: NEW TRANSLATION
 JAP_new_technologies_desc: "Aktivně podpoříme zavádění a komercializaci nových technologií, urychlíme výzkum a vývoj i průmyslové inovace. Podporou nových růstových odvětví posílíme národní konkurenceschopnost." # todo: NEW TRANSLATION
 JAP_key_industries_back_home: "Navrátit klíčová odvětví domů" # todo: NEW TRANSLATION
 JAP_key_industries_back_home_desc: "Vybudujeme systém umožňující stabilní domácí výrobu v klíčových odvětvích, posílíme dodavatelské řetězce a zvýšíme soběstačnost v důležitých sektorech. Podporou domácích investic upevníme průmyslovou základnu a vytvoříme strukturu méně zranitelnou změnami mezinárodního prostředí." # todo: NEW TRANSLATION
 JAP_economic_security: "Zajistit ekonomickou bezpečnost" # todo: NEW TRANSLATION
 JAP_economic_security_desc: "Přezkoumáme dodavatelská uspořádání pro klíčové materiály a průmyslová odvětví a budeme řídit rizika v technologiích, kapitálu a informacích, abychom zajistili ekonomickou bezpečnost. Tím posílíme národní soběstačnost a udržitelnou konkurenceschopnost podniků a podpoříme stabilní růst." # todo: NEW TRANSLATION
 JAP_patriotic_education: "Vlastenecké vzdělávání" # todo: NEW TRANSLATION
 JAP_patriotic_education_desc: "Podpoříme vzdělávání zdůrazňující historii národa, kulturu a občanskou odpovědnost a posílíme společenskou soudržnost i smysl pro sdílené normy. Vybudováním základů méně náchylných k vnějšímu vlivu upevníme domácí stabilitu." # todo: NEW TRANSLATION
 JAP_fundamentals_of_education: "Nově definovat základy vzdělávání" # todo: NEW TRANSLATION
 JAP_fundamentals_of_education_desc: "Přezkoumáme cíle a standardy vzdělávání a jako národní politiku nově definujeme rozvoj akademických schopností, základních znalostí a praktických dovedností. Upřednostněním investic do vzdělávání posílíme základy rozvoje lidského kapitálu a výzkumu a vývoje." # todo: NEW TRANSLATION
 JAP_dotoku_education: "Výchova k morálce" # todo: NEW TRANSLATION
 JAP_dotoku_education_desc: "Ve školním vzdělávání klademe větší důraz na morální výchovu a pěstujeme hodnoty, jako je občanské smýšlení, odpovědnost a ohleduplnost k ostatním. Posílením společenských norem a prohloubením soudržnosti místních komunit přispějeme k domácí stabilitě." # todo: NEW TRANSLATION
 JAP_national_flag_and_anthem: "Respektovat vlajku a státní hymnu" # todo: NEW TRANSLATION
 JAP_national_flag_and_anthem_desc: "Jasně potvrdíme úctu k vlajce a státní hymně, čímž posílíme pocit národní sounáležitosti a společenské jednoty. To upevní soudržnost v krizových dobách a vytvoří základ méně náchylný k vnějšímu vlivu." # todo: NEW TRANSLATION
 JAP_family_policy: "Posílit rodinnou politiku" # todo: NEW TRANSLATION
 JAP_family_policy_desc: "Budeme respektovat hodnoty domácností a rodin a rozšíříme opatření podporující výchovu dětí a každodenní život. Vytvořením prostředí, v němž mohou lidé s klidem zakládat rodiny, posílíme budoucí demografickou základnu a přispějeme ke společenské stabilitě." # todo: NEW TRANSLATION
 JAP_glorious_decade: "Vstříc desetiletí lesku" # todo: NEW TRANSLATION
 JAP_glorious_decade_desc: "Bez odkládání faktorů stojících za stagnací obnovíme finance, podniky a poptávku souběžně. Zároveň se vypořádáme s dopady klesající porodnosti a generace „doby ledové zaměstnanosti“ a prostřednictvím reforem pracovního stylu a investic do lidí vyvážíme bezpečí domácností s vyšším růstovým potenciálem." # todo: NEW TRANSLATION
 JAP_inflation_target: "Vyjasnit politický závazek" # todo: NEW TRANSLATION
 JAP_inflation_target_desc: "Vláda a centrální banka jasně sdělí politický postoj k podpoře ekonomiky a podmínky, za nichž bude udržován. Snížením budoucí nejistoty a zmírněním postoje domácností a podniků „počkáme a uvidíme“ usnadníme oživení spotřeby a investic." # todo: NEW TRANSLATION
 JAP_down_long_term_interest_rates: "Snížit dlouhodobé úrokové sazby" # todo: NEW TRANSLATION
 JAP_down_long_term_interest_rates_desc: "Dlouhodobé úrokové sazby udržíme nízké a stabilní a snížíme náklady financování podniků a domácností. Podporou investic, obnovy kapitálu a nákupu bydlení, a tím podpořením poptávky a oživením ekonomiky, zároveň připravíme cestu k obnově daňových příjmů." # todo: NEW TRANSLATION
 JAP_special_inspection_banks: "Mimořádné kontroly bank" # todo: NEW TRANSLATION
 JAP_special_inspection_banks_desc: "Pro obnovení zdraví finančního systému provedeme důkladnou kontrolu aktiv bank. Vyjasněním skutečného stavu nesplácených úvěrů a ukončením odkládání ztrát a neprůhledného nakládání vytvoříme základ pro zastavení řetězové reakce úvěrové nejistoty a zpřísňování úvěrů." # todo: NEW TRANSLATION
 JAP_bank_supervision: "Posílit dohled nad bankami" # todo: NEW TRANSLATION
 JAP_bank_supervision_desc: "Namísto jednorázového přístupu ke kontrolám a nápravným opatřením trvale posílíme dohledový rámec. Vynucováním zveřejňování informací a řádného řízení a prevencí opakování slabého řízení rizik a neprůhledného nakládání stabilizujeme důvěru ve finanční systém." # todo: NEW TRANSLATION
 JAP_business_assessment: "Spravedlivé hodnocení podniků" # todo: NEW TRANSLATION
 JAP_business_assessment_desc: "Pro přesné posouzení schopností a rizik podniků objektivně zhodnotíme jejich ziskovost a budoucí vyhlídky. Bez spoléhání na udržování firem při životě či jejich prodlužování rozlišíme oblasti, které je třeba obnovit, od těch, které je nutné restrukturalizovat, a položíme základy pro tok kapitálu a talentu do růstových odvětví." # todo: NEW TRANSLATION
 JAP_corporate_debt_restructuring: "Restrukturalizace podnikových dluhů" # todo: NEW TRANSLATION
 JAP_corporate_debt_restructuring_desc: "Vypořádáme se s nadměrnou dluhovou zátěží a zajistíme čas a prostor potřebné k obnově. Odklonem od stavu, kdy jsou podniky pohlceny úroky a splátkami, a umožněním nasměrovat zdroje do investic, zaměstnanosti a transformace podnikání přerušíme řetězec stagnace." # todo: NEW TRANSLATION
 JAP_corporate_revitalization: "Oživení podniků" # todo: NEW TRANSLATION
 JAP_corporate_revitalization_desc: "Restrukturalizaci posuneme do nové fáze a obnovíme podnikové základy po finanční i provozní stránce. Řešením nadměrné zátěže a neefektivity a převedením firem do postavení, v němž mohou investovat, nabírat zaměstnance a zvyšovat mzdy, upevníme oživení vedené soukromým sektorem." # todo: NEW TRANSLATION
 JAP_expectations_escaping_deflation: "Obnovit očekávání růstu" # todo: NEW TRANSLATION
 JAP_expectations_escaping_deflation_desc: "Vyřešením nesplácených úvěrů a odbouráním nadměrného zadlužení přesuneme zaměření ekonomiky od „obrany“ k „útoku“. Pokud podniky obnoví výdaje na investice, výzkum a vývoj a zaměstnance a domácnosti získají jasnější výhled do budoucna, bude pravděpodobnější příznivý cyklus produktivity a mezd. Vybudujeme základy potřebné k úplnému obnovení konkurenceschopnosti." # todo: NEW TRANSLATION
 JAP_promoting_labor_mobility: "Podpořit mobilitu práce" # todo: NEW TRANSLATION
 JAP_promoting_labor_mobility_desc: "Vytvoříme podmínky usnadňující přesun talentu do růstových odvětví a podpoříme přerozdělení pracovní síly. Snížením překážek změny zaměstnání a opětovného zaměstnání a podporou rozvoje dovedností podpoříme průmyslovou obnovu a zvýšíme produktivitu." # todo: NEW TRANSLATION
 JAP_competition_service_sector: "Podpořit konkurenci ve službách" # todo: NEW TRANSLATION
 JAP_competition_service_sector_desc: "Podpoříme vstup a konkurenci v sektoru služeb a vypořádáme se s neefektivitou a cenovou nepružností, které přispívají ke stagnaci. Přezkoumáním regulací a zakořeněných postupů zlepšíme podnikatelské prostředí a přejdeme k trhu, na němž se snáze prosadí lepší služby." # todo: NEW TRANSLATION
 JAP_revitalization_economy: "Oživit japonskou ekonomiku" # todo: NEW TRANSLATION
 JAP_revitalization_economy_desc: "Pokročili jsme v obnově finančního systému a podnikové sféry a nastolili cestu k obnově poptávky a zlepšení mezd. Postupným odstraňováním příčin stagnace a vytvořením prostředí, v němž domácnosti a podniky jasněji vidí budoucnost, upevníme dynamiku růstu." # todo: NEW TRANSLATION
 JAP_demographic_crisis: "Bezprecedentní opatření pro krizi" # todo: NEW TRANSLATION
 JAP_demographic_crisis_desc: "Japonská Agentura pro děti a rodiny koordinuje celovládní reakci na demografický úpadek: pronatalistické pobídky, mobilizaci ženské pracovní síly nebo reformu migrace. Parlament se zavazuje pouze k jedné cestě. Každá z nich má svou cenu v jiné měně: peněžní dávky, narušení pracovní síly nebo kulturní proměna." # todo: NEW TRANSLATION
 JAP_demographic_crisis_tt: "Označuje začátek japonské reakce na demografický úpadek. Tři následující strategie se vzájemně vylučují." # todo: NEW TRANSLATION
 JAP_immigration_backlash_opposition_tt: "§RProtiimigrační odpor:§! protiimigrační nálady posilují nacionalistickou opozici" # todo: NEW TRANSLATION
 JAP_immigration_backlash_stability_tt: "§RProtiimigrační odpor:§! hněv nad přílivem cizinců oslabuje stabilitu" # todo: NEW TRANSLATION
 JAP_traditionalist_backlash_opposition_tt: "§ROdpor tradicionalistů:§! konzervativní hněv nad ústupem tradiční rodiny posiluje nacionalistickou opozici" # todo: NEW TRANSLATION
 JAP_traditionalist_backlash_stability_tt: "§ROdpor tradicionalistů:§! konzervativní hněv nad ústupem tradiční rodiny oslabuje stabilitu" # todo: NEW TRANSLATION
 JAP_japan_belongs_to_the_japanese: "Japonsko patří Japoncům" # todo: NEW TRANSLATION
 JAP_japan_belongs_to_the_japanese_desc: "Japonsko zvýší porodnost prostřednictvím rodinných přídavků, pronatalistických pobídek a kulturní obnovy. Stát se zaváže k trvalým sociálním výdajům bez ohledu na to, zda porodnost vzroste. Tato cesta vymění fiskální nejistotu úpadku za jistotu nevratných nároků." # todo: NEW TRANSLATION
 JAP_pronatalist_turn: "Iniciativa Plus jedna" # todo: NEW TRANSLATION
 JAP_pronatalist_turn_desc: "Japonsko zahájí komplexní kampaň podporující rození dětí jako občanskou prioritu, inspirovanou strategií „Plus jedna“ z počátku 21. století. Prostřednictvím daňových pobídek, veřejných sdělení a kulturního uznání rodin s více dětmi stát posune společenské postoje k větším rodinám a zároveň poskytne konkrétní podporu, která učiní rodičovství dostupnějším a přitažlivějším." # todo: NEW TRANSLATION
 JAP_national_revival_campaign: "Iniciativa regionální obnovy" # todo: NEW TRANSLATION
 JAP_national_revival_campaign_desc: "Japonsko nasměruje investice do regionů a oživí místní komunity, které se vylidnily, když mladí lidé odcházeli do Tokia. Tvorbou pracovních míst, zlepšováním vybavenosti a obnovou důvěry v provinční Japonsko chceme ukotvit rodiny mimo metropoli a zpomalit koncentraci obyvatelstva, která prohlubuje úpadek venkova. Silné regiony jsou základem stabilních rodin a udržitelné porodnosti." # todo: NEW TRANSLATION
 JAP_three_generation_household: "Třígenerační domácnost" # todo: NEW TRANSLATION
 JAP_three_generation_household_desc: "Japonsko podpoří třígenerační domácnosti daňovými pobídkami a podporou bydlení a obnoví uspořádání, v němž prarodiče poskytují péči o děti a seniory bez tržní mzdy. Stát přenese náklady sociální péče na rodinná pouta a sníží vlastní výdaje. Péče poskytovaná doma je péče, kterou stát nemusí platit." # todo: NEW TRANSLATION
 JAP_homeland_production_drive: "Monozukuri doma" # todo: NEW TRANSLATION
 JAP_homeland_production_drive_desc: "Japonsko posílí svůj závazek domácí výrobě a bude investovat do automatizace a školení pracovníků, aby maximalizovalo výstup zmenšující se pracovní síly. Namísto přesouvání výroby do zahraničí či najímání migrantů bude Japonsko rozvíjet tradici monozukuri, umění dobře vyrábět. Kompromisem jsou energetická zátěž a vyšší náklady." # todo: NEW TRANSLATION
 JAP_incentivize_large_families: "Rozšířené přídavky na děti" # todo: NEW TRANSLATION
 JAP_incentivize_large_families_desc: "Japonsko rozšíří přídavky jido teate velkorysými peněžními dávkami, které porostou s každým dalším dítětem. Zlevněním rodičovství stát odstraní zásadní omezení velikosti rodiny. Jakmile budou dávky zapsány do zákona, stanou se trvalým nárokem, který se žádná budoucí vláda neodváží omezit." # todo: NEW TRANSLATION
 JAP_state_family_mandate: "Rodina jako státní imperativ" # todo: NEW TRANSLATION
 JAP_state_family_mandate_desc: "Japonsko nařídí zakládání rodin prostřednictvím pracovního práva, důchodových pobídek a společenských sdělení tlačících ženy k mateřství a muže k rodičovství. Jde o levnou odpověď: stát utratí málo a zároveň povolá občany do reprodukce. Cenou je legitimita a odpor." # todo: NEW TRANSLATION
 JAP_a_nation_reborn: "Znovuzrozený národ" # todo: NEW TRANSLATION
 JAP_a_nation_reborn_desc: "Porodnost se stabilizovala a začala růst, mateřství je ctěno a regionální komunity ožívají. Japonsko zvrátilo demografický úpadek trvalými pronatalistickými investicemi. Dvě desetiletí dávek, příspěvků na bydlení a péče o seniory ztvrdla v nároky, které žádná budoucí vláda nemůže omezit." # todo: NEW TRANSLATION
 JAP_womenomics: "Womenomics" # todo: NEW TRANSLATION
 JAP_womenomics_desc: "Japonsko mobilizuje ženy napříč všemi ekonomickými sektory odstraňováním překážek, poskytováním péče o děti a proměnou podnikové kultury. Tím uvolní produktivní kapacitu a daňové příjmy bez narození dalších dětí. Stát musí vybudovat a personálně zajistit systém péče o děti a konzervativní Japonsko to bude vnímat jako útok na rodinu." # todo: NEW TRANSLATION
 JAP_eliminate_daycare_waitlists: "Iniciativa nulového počtu dětí na čekacích seznamech" # todo: NEW TRANSLATION
 JAP_eliminate_daycare_waitlists_desc: "Japonsko zavede Bezpečnostní plán péče o děti a rozšíří jesle, školky i mimoškolní péči, dokud čekací seznamy nezmizí. Velké investice do mezd pracovníků a výstavby zařízení odstraní hlavní překážku účasti žen na trhu práce. Tato zařízení bude nutné trvale personálně zajišťovat a financovat." # todo: NEW TRANSLATION
 JAP_reform_spousal_tax_deduction: "Zbourat hranici 1,03 milionu jenů" # todo: NEW TRANSLATION
 JAP_reform_spousal_tax_deduction_desc: "Japonsko odstraní ostrý propad manželské daňové úlevy při příjmu 1,03 milionu jenů a přepracuje související hranice sociálního pojištění. Tím odstraní postih za práci na plný úvazek, který uvěznil miliony žen v částečných úvazcích. Zbourání této hranice uvolní rozsáhlou skupinu zkušených a vzdělaných žen pro zaměstnání na plný úvazek." # todo: NEW TRANSLATION
 JAP_normalize_parental_leave: "Kampaň Ikumen" # todo: NEW TRANSLATION
 JAP_normalize_parental_leave_desc: "Japonsko zahájí kampaň Ikumen, zaručí placenou rodičovskou dovolenou oběma rodičům a bude tlačit muže k jejímu využívání. Když se otcové běžně zapojí do péče, ženy již nebudou uvězněny mateřstvím a zátěž se rozdělí. Firmy ponesou náklady v podobě ztracené produkce a generace salarymanů se nevzdá bez odporu." # todo: NEW TRANSLATION
 JAP_women_in_management: "Iniciativa 202030" # todo: NEW TRANSLATION
 JAP_women_in_management_desc: "Japonsko bude usilovat o cíl 202030: tři z deseti vedoucích pozic obsadí ženy. Zákon o podpoře účasti a kariérního postupu žen na pracovišti stanoví závazné cíle pro podniky a veřejný sektor, vynutí zveřejňování údajů a odmění firmy, které povedou tuto změnu. Ženy získají skutečnou moc v každé zasedací místnosti i úřadu státní služby." # todo: NEW TRANSLATION
 JAP_family_first_model: "Reforma pracovního stylu: rodinná cesta" # todo: NEW TRANSLATION
 JAP_family_first_model_desc: "Hnutí za reformu pracovního stylu upřednostní rodinnou cestu: pružná pracovní doba, kariérní dráhy na částečný úvazek a rozšířené přídavky na děti umožní ženám zůstat v pracovní síle bez obětování možnosti mateřství. Tato cesta přijímá nižší celkový výkon výměnou za zachování kariéry i porodnosti a sází na to, že společenská stabilita a mírné demografické oživení jsou důležitější než maximální hospodářský růst." # todo: NEW TRANSLATION
 JAP_career_first_model: "Reforma pracovního stylu: kariérní cesta" # todo: NEW TRANSLATION
 JAP_career_first_model_desc: "Hnutí za reformu pracovního stylu upřednostní kariérní cestu: žádná pružnost, žádné částečné úvazky, ale skutečná rovnost v postupu a odměňování. Ženy budou soutěžit o každou pozici za rovných podmínek, čímž maximalizují ekonomický výkon a své příjmy. Mateřství se tím ztíží a porodnost dále klesne, protože mnohé zvolí ambice před rodinou." # todo: NEW TRANSLATION
 JAP_a_society_where_women_thrive: "Společnost, v níž se ženám daří" # todo: NEW TRANSLATION
 JAP_a_society_where_women_thrive_desc: "Strukturální překážky padly a ženy pracují na všech úrovních se skutečnou rovností a možností volby, čímž prohlubují pracovní sílu i daňovou základnu. Co reforma nikdy nepřinesla, jsou děti. Japonsko více pracuje a více vydělává, stále se však zmenšuje a drží ho při životě aparát péče o děti a vzdělávání, který musí stát financovat navždy." # todo: NEW TRANSLATION
 JAP_open_japan: "Otevřené Japonsko" # todo: NEW TRANSLATION
 JAP_open_japan_desc: "Japonsko bude systematicky získávat pracovníky ze zahraničí prostřednictvím migračních dohod, kvalifikační imigrace a reformy víz, aby zaplnilo mezeru na trhu práce. Nedostatek pracovníků tím uzavře během let místo desetiletí, zajistí plnou zaměstnanost a solventnost důchodového systému. Kulturní identita se dostane pod tlak, komunity se změní rychleji, než s tím společnost souhlasí, a každý krok vyvolá nacionalistický odpor." # todo: NEW TRANSLATION
 JAP_labor_migration_pact: "Dvoustranné dohody o mobilitě pracovní síly" # todo: NEW TRANSLATION
 JAP_labor_migration_pact_desc: "Japonsko formalizuje dvoustranná pracovní ujednání se sousedními zeměmi, rozšíří Program odborné praxe a uzavře nové reciproční dohody, aby přivedlo pracovníky do stavebnictví, zemědělství, pečovatelských služeb a výroby. Tyto dohody jsou rychlé a účinné: během měsíců lze přijmout desítky tisíc pracovníků, zaplnit kritické nedostatky a stabilizovat zaměstnanost v odvětvích, která by se jinak zmenšila nebo zcela zanikla." # todo: NEW TRANSLATION
 JAP_points_based_immigration: "Program vysoce kvalifikovaných odborníků" # todo: NEW TRANSLATION
 JAP_points_based_immigration_desc: "Japonsko zavede bodový systém pro vysoce kvalifikované odborníky, který přiděluje body za kvalifikaci, pracovní zkušenosti, jazykové schopnosti a předchozí pobyt. Inženýři, zdravotní sestry, výzkumníci a finanční odborníci obsadí vysoce hodnotná místa a zmírní omezení růstu. Kvalifikovaní příchozí přivedou rodiny a očekávají mezinárodní školství, což stát absorbuje výměnou za výzkumnou kapacitu, kterou by jinak nemohl získat." # todo: NEW TRANSLATION
 JAP_integration_programs: "Integrační rámec Tabunka Kyosei" # todo: NEW TRANSLATION
 JAP_integration_programs_desc: "Japonsko investuje do aktivní integrace, tabunka kyosei, prostřednictvím jazykových kurzů, komunitních center a cest k trvalému pobytu pro migrující pracovníky a jejich rodiny. Nově příchozí vybavení nástroji k začlenění vytvářejí méně třenic a plněji přispívají. Jazyková výuka, školství a sociální podpora migrantských rodin se stanou trvalou rozpočtovou položkou, která vyvažuje náklady, jež by neřízená migrace přinesla v oblasti policie." # todo: NEW TRANSLATION
 JAP_multicultural_society: "Multikulturní společnost" # todo: NEW TRANSLATION
 JAP_multicultural_society_desc: "Japonsko poskytne migrantům a jejich dětem právní status, občanskou účast a kulturní uznání jako plnoprávným členům národního společenství. Jde o zásadní odklon od historické uzavřenosti, který mění potenciální odpor v sounáležitost a udržuje společenskou stabilitu. Plná občanská a sociální práva pro miliony nových Japonců jsou nákladné a trvalé nároky, které už z účtů za vzdělávání a sociální péči nezmizí." # todo: NEW TRANSLATION
 JAP_guest_worker_system: "Rozšíření víz pro specifikované kvalifikované pracovníky" # todo: NEW TRANSLATION
 JAP_guest_worker_system_desc: "Japonsko rozšíří víza pro specifikované kvalifikované pracovníky, tokutei gino, a přivede pracovníky na smlouvy na dobu určitou do stavebnictví, zemědělství, pečovatelských služeb a výroby. Přijdou, odvedou práci a po skončení smlouvy se vrátí domů, čímž zaplní nedostatek pracovníků bez třenic spojených s trvalou imigrací. Vznikne rotující populace s malou ochranou a bez vztahu ke komunitě a její dohled se stane trvalým nákladem." # todo: NEW TRANSLATION
 JAP_an_open_nation: "Otevřený národ" # todo: NEW TRANSLATION
 JAP_an_open_nation_desc: "Populace Japonska se díky migraci stabilizovala a vzrostla, čímž se etnicky homogenní země proměnila v multikulturní. Ekonomická stabilita a solventnost důchodového systému jsou zachovány, pocit etnické jednotnosti se však rozpadl a starší generace truchlí nad národem, který odchází. Dohled, školství a sociální zabezpečení pro populaci, která přišla rychleji, než se instituce stačily vybudovat, zůstanou po generaci zvýšené." # todo: NEW TRANSLATION
 JAP_economic_sectors: "Hospodářská odvětví Japonska" # todo: NEW TRANSLATION
 JAP_economic_sectors_desc: "Od místně zakořeněného zemědělství, lesnictví a rybolovu po výrobu, služby a pokročilé technologie rozvineme silné stránky Japonska napříč celou průmyslovou krajinou. Při podpoře domácí zaměstnanosti a dodavatelské kapacity vyvážíme konkurenceschopnost vývozu s investicemi do nových růstových oborů a přeneseme průmyslové základy do další éry." # todo: NEW TRANSLATION
 JAP_agricultural_revitalization: "Oživení primárních odvětví" # todo: NEW TRANSLATION
 JAP_agricultural_revitalization_desc: "Ministerstvo zemědělství, lesnictví a rybolovu poprvé za čtvrt století přepracuje základní zákon a spojí všechna tři odvětví do jednotné národní strategie potravinové bezpečnosti. Průměrný zemědělec stárne k sedmdesáti letům a pole se po celé zemi opouštějí; tato integrace se stane základem obnovy venkova i všech navazujících reforem." # todo: NEW TRANSLATION
 JAP_corporate_farm_consolidation: "Pozemkové banky a konec gentanu" # todo: NEW TRANSLATION
 JAP_corporate_farm_consolidation_desc: "Banky pro konsolidaci zemědělské půdy shromáždí rozptýlené parcely do větších celků, zatímco zrušení rýžové kvóty gentan ukončí půl století placení zemědělcům za ponechávání polí ladem. Mechanizace a tržní disciplína zvýší produktivitu, ale malí rodinní pěstitelé neschopní konkurovat budou z půdy vytlačeni." # todo: NEW TRANSLATION
 JAP_revitalize_rural_communities: "Strategie regionální obnovy" # todo: NEW TRANSLATION
 JAP_revitalize_rural_communities_desc: "Pod praporem chiho sosei bude vláda prostřednictvím přímých plateb udržovat zemědělství v odlehlých oblastech a vracet městské bohatství vesnicím skrze daň z rodného kraje, čímž přiláká mladé rodiny k usídlení tam, kde by se pole jinak vrátila divočině. Růst je zde pomalejší než při konsolidaci podniků, ale venkov zůstane živý." # todo: NEW TRANSLATION
 JAP_smart_rice_farming: "Chytré zemědělství a umění saké" # todo: NEW TRANSLATION
 JAP_smart_rice_farming_desc: "Japonsko spojí rýžové dědictví s chytrým zemědělstvím: satelitní navigace, drony a senzory vybavená rýžová pole umožní zmenšující se a stárnoucí pracovní síle obhospodařovat více půdy s menším počtem rukou. Prémiové značky jako Koshihikari a celosvětová poptávka po japonském saké dopraví úrodu na stoly doma i v zahraničí." # todo: NEW TRANSLATION
 JAP_premium_wagyu_brand: "Exportní značka wagyu" # todo: NEW TRANSLATION
 JAP_premium_wagyu_brand_desc: "Na základě chráněných zeměpisných označení a zákona chránícího genetiku wagyu před pašováním Japonsko rozvine toto plemeno v prémiový vývoz, který bude svou cenu stavět na původu a kvalitě, nikoli na objemu. Nejlepší restaurace světa budou nabízet japonské hovězí." # todo: NEW TRANSLATION
 JAP_sustainable_fisheries: "Reforma zákona o rybolovu" # todo: NEW TRANSLATION
 JAP_sustainable_fisheries_desc: "Reforma zákona o rybolovu z roku 2018, první zásadní změna za sedmdesát let, zavede vědecky stanovené kvóty úlovků a odmění odpovědný rybolov, přičemž investuje do akvakultury od chovu tuňáka modroploutvého po pobřežní měkkýše. Udržitelná moře udrží pobřežní města v chodu a zásobí potravinovou kulturu národa." # todo: NEW TRANSLATION
 JAP_forestry_revival: "Daň za lesní prostředí" # todo: NEW TRANSLATION
 JAP_forestry_revival_desc: "Japonsko financované daní za lesní prostředí proředí zanedbané plantáže cedrů a cypřišů, mechanizuje těžbu a podporuje křížem vrstvené dřevo, aby se domácí dřevo vrátilo na staveniště. Oživené lesnictví přinese práci zpět do horských vesnic a promění dlouho nevyužívaný zdroj v národní sílu." # todo: NEW TRANSLATION
 JAP_pharmaceutical_powerhouse: "Vypořádat se se zpožděním léčiv" # todo: NEW TRANSLATION
 JAP_pharmaceutical_powerhouse_desc: "Třetí největší farmaceutický trh světa ovládají Takeda, Astellas, Daiichi Sankyo a Chugai, přesto rostoucí zpoždění léčiv nechává pacienty čekat roky na zahraniční léky. Vláda zefektivní schvalování PMDA a podpoří biotechnologie a regenerativní medicínu, čímž promění vyspělé odvětví v motor růstu s vysokou přidanou hodnotou." # todo: NEW TRANSLATION
 JAP_rural_revitalization: "Šestá industrializace" # todo: NEW TRANSLATION
 JAP_rural_revitalization_desc: "V rámci šesté industrializace, rokuji sangyoka, budou primární producenti své výrobky také zpracovávat a prodávat. Pobyt na farmách, značkové regionální potraviny a přímý prodej spotřebitelům promění upadající vesnice v cíle, přilákají mladé rodiny zpět k půdě a stanou se nejspolehlivější kotvou proti demografické vlně." # todo: NEW TRANSLATION
 JAP_agricultural_construction_drive: "Rozvoj zemědělské výstavby" # todo: NEW TRANSLATION
 JAP_agricultural_construction_drive_desc: "Koordinované celonárodní úsilí o zahájení výstavby nové zemědělské půdy a venkovských zařízení v době, kdy jsou politická vůle a dotace sladěny, urychlí výstavbu na celém venkově." # todo: NEW TRANSLATION
 JAP_automotive_industry: "Kola národa" # todo: NEW TRANSLATION
 JAP_automotive_industry_desc: "Sedm japonských výrobců společně montuje osm milionů vozidel ročně a zajišťuje přibližně jedno z dvanácti japonských pracovních míst včetně výrobců dílů, prodejců a dopravců. Od montážních hal v Aiči po exportní přístavy v Jokohamě bude Japonsko bránit své místo největšího vývozce vozidel na světě." # todo: NEW TRANSLATION
 JAP_lean_production_system: "Výrobní systém Toyoty" # todo: NEW TRANSLATION
 JAP_lean_production_system_desc: "Výrobní systém Toyoty formoval moderní výrobu dodávkami just-in-time, jidoka a kaizenovým úsilím o odstranění muda, díky čemuž japonské závody vyrábějí více automobilů s méně vadami a menšími zásobami než kterýkoli konkurent. Japonsko rozšíří štíhlou disciplínu napříč průmyslem a naučí novou generaci vidět plýtvání tam, kde ho ostatní nevidí." # todo: NEW TRANSLATION
 JAP_keiretsu_supplier_network: "Síť dodavatelů keiretsu" # todo: NEW TRANSLATION
 JAP_keiretsu_supplier_network_desc: "Za každým dokončeným vozem stojí pyramida dodavatelů spojených desetiletími důvěry: Denso, Aisin, Toyota Industries a tisíce menších dílen, z nichž každá je mistrem svého řemesla díky disciplíně monozukuri. Japonsko prohloubí vazby keiretsu a zaručí přežití dodavatelů druhé a třetí úrovně, čímž učiní odolnost dodavatelského řetězce strategickým přínosem." # todo: NEW TRANSLATION
 JAP_precision_machine_tools: "Roboti, kteří vyrábějí auta" # todo: NEW TRANSLATION
 JAP_precision_machine_tools_desc: "FANUC a Yaskawa ovládají světový trh průmyslových robotů, zatímco Yamazaki Mazak, DMG Mori a Okuma určují standard v přesných obráběcích strojích. Jak pracovní síla stárne a zmenšuje se, Japonsko bude masivně investovat do robotiky a mechatroniky a zůstane dílnou, která vybavuje továrny celého světa." # todo: NEW TRANSLATION
 JAP_domestic_champions: "Standard Lexus" # todo: NEW TRANSLATION
 JAP_domestic_champions_desc: "Lexus prokázal, že Japonsko může na domácí půdě konkurovat německým luxusním značkám; toto poučení se od té doby rozšířilo celým průmyslem. Japonsko bude rozvíjet hodnotu svých technických značek a usilovat o segmenty s vysokou marží, přičemž bude soutěžit kvalitou a prestiží, nikoli pouze cenou." # todo: NEW TRANSLATION
 JAP_hybrid_powertrains: "Hybridní revoluce" # todo: NEW TRANSLATION
 JAP_hybrid_powertrains_desc: "Prius dokázal, že Japonsko se může odvážit tam, kde se ostatní báli, a spojit benzinový motor s elektromotorem bez nabíjecí sítě, kterou svět dosud neměl. Japonsko tuto hybridní cestu zdvojnásobí a zdokonalí ji jako pragmatický most mezi věkem ropy a tím, co přijde poté." # todo: NEW TRANSLATION
 JAP_battery_electric_shift: "Sázka na bateriovou elektromobilitu" # todo: NEW TRANSLATION
 JAP_battery_electric_shift_desc: "Nissan Leaf byl prvním elektromobilem pro masový trh, Japonsko však od té doby sledovalo, jak konkurenti na čistě bateriový pohon uhánějí vpřed. Aby je dohnala, vláda se zaváže k urychleným programům pevnolátkových článků a vlně domácích gigatováren, aby se nejcennější část automobilu vyráběla doma." # todo: NEW TRANSLATION
 JAP_hydrogen_society: "Vstříc vodíkové společnosti" # todo: NEW TRANSLATION
 JAP_hydrogen_society_desc: "Vodíkový sedan Mirai a Základní vodíková strategie nastínily vizi, v níž auta, nákladní vozy, domy a elektrárny pohání nejhojnější prvek vesmíru a vypouštějí pouze vodu. Japonsko vybuduje tankovací síť a podpoří výrobce palivových článků a bude prosazovat vodík jako výrazně japonskou odpověď na konec spalování." # todo: NEW TRANSLATION
 JAP_automotive_superpower: "Supervelmoc mobility" # todo: NEW TRANSLATION
 JAP_automotive_superpower_desc: "Japonsko nebude nuceno zvolit jedinou cestu do budoucnosti. Zvládnutím hybridu, baterie i palivového článku současně a zachováním štíhlých závodů a dodavatelské sítě, které je vyrábějí v nejlepší kvalitě na světě, si Japonsko zajistí místo supervelmoci mobility tohoto století." # todo: NEW TRANSLATION
 JAP_automotive_retooling_drive: "Modernizace montážních linek" # todo: NEW TRANSLATION
 JAP_automotive_retooling_drive_desc: "Celonárodní úsilí o přestavbu a modernizaci automobilových montážních linek, které přizpůsobí závody další generaci vozidel v době, kdy jsou investice a politická vůle sladěny." # todo: NEW TRANSLATION
 JAP_battery_gigafactory_program: "Program bateriových gigatováren" # todo: NEW TRANSLATION
 JAP_battery_gigafactory_program_desc: "Soustředěné úsilí o vybudování domácích bateriových gigatováren a rychlé zvýšení kapacity výroby článků, aby se srdce elektromobilu vyrábělo doma namísto dovozu." # todo: NEW TRANSLATION
 JAP_motorcycle_kingdom: "Království dvou kol" # todo: NEW TRANSLATION
 JAP_motorcycle_kingdom_desc: "Honda, Yamaha, Kawasaki a Suzuki vyrábějí naprostou většinu motorových jednostopých vozidel na Zemi, od malých skútrů převážejících stovky milionů lidí jihovýchodní Asií po superbiky litrové třídy dominující startovním roštům MotoGP a World Superbike. Japonsko bude investovat do továren na jednostopá vozidla a bránit technický náskok, který udržuje konkurenty o generaci za japonskými motory." # todo: NEW TRANSLATION
 JAP_kei_car_mobility: "Národ vozů kei" # todo: NEW TRANSLATION
 JAP_kei_car_mobility_desc: "Téměř dvě z pěti nových aut prodaných v Japonsku patří do třídy kei, tedy minivozů s objemem omezeným na 660 cm³ daňovým kodexem napsaným pro chudší zemi. Jak populace mimo města stárne, vůz kei se stává posledním praktickým způsobem, jak se důchodci dostanou k lékaři či do obchodu. Japonsko udrží třídu kei dostupnou a kvalitní a zachová mobilitu tam, kde již vlaky nejezdí." # todo: NEW TRANSLATION
 JAP_jdm_soft_power: "Národ Gran Turisma" # todo: NEW TRANSLATION
 JAP_jdm_soft_power_desc: "Skyline GT-R, Supra a RX-7 se prostřednictvím anime, jako je Initial D, a série Gran Turismo staly globálními ikonami automobilové kultury a naučily generaci hráčů milovat značku JDM. Japonsko bude pěstovat tento vývoz obrazu spolu s ocelí a podpoří tuningové dílny, kulturu touge a motoristické dědictví, které činí japonská sportovní auta předmětem celosvětového obdivu." # todo: NEW TRANSLATION
 JAP_export_wharves: "Exportní přístavy" # todo: NEW TRANSLATION
 JAP_export_wharves_desc: "Přibližně polovina všech vozidel smontovaných v Japonsku nastupuje na přepravní lodě v Jokohamě, Nagoji nebo Kóbe a míří do přístavů po celém světě, díky čemuž je Japonsko největším vývozcem vozidel na planetě. Vláda rozšíří přístavní mola, seřaďovací nádraží a flotilu přepravníků, které udržují nepřerušovaný tok automobilů do zahraničí." # todo: NEW TRANSLATION
 JAP_automotive_export_drive: "Rozvoj vývozu automobilů" # todo: NEW TRANSLATION
 JAP_automotive_export_drive_desc: "Časově omezené celonárodní úsilí o rozšíření kapacit montážních a exportních závodů, které přidá směny a podlahovou plochu v továrnách na automobily a součástky v době plných exportních objednávek." # todo: NEW TRANSLATION
 JAP_electronics_revitalization: "Oživení elektroniky a polovodičů" # todo: NEW TRANSLATION
 JAP_electronics_revitalization_desc: "Japonský elektronický průmysl vytlačili z trhů, kterým kdysi vládl, konkurenti z Koreje, Tchaj-wanu a Číny. V rámci strategie oživení polovodičů ministerstva METI stát shromáždí přetrvávající silné stránky v materiálech, nástrojích a přesném strojírenství, aby obnovil konkurenceschopnou kapacitu. Stará mistrovská znalost čipů může být obnovena, pokud investice přijdou nyní." # todo: NEW TRANSLATION
 JAP_semiconductor_materials: "Mistři materiálů a zařízení" # todo: NEW TRANSLATION
 JAP_semiconductor_materials_desc: "Japonsko nikdy neztratilo kontrolu nad začátkem dodavatelského řetězce čipů: Tokyo Electron dominuje depozičním a leptacím nástrojům, Shin-Etsu a SUMCO dodávají světové křemíkové destičky a JSR a Tokyo Ohka ovládají trh fotorezistů. Vláda rozšíří investice do této páky a ponechá každou zahraniční slévárnu závislou na japonských materiálech a strojích." # todo: NEW TRANSLATION
 JAP_rapidus_moonshot: "Ambiciózní projekt Rapidus" # todo: NEW TRANSLATION
 JAP_rapidus_moonshot_desc: "Rapidus, podporovaný Toyotou, Sony a státem, závodí s výstavbou dvounanometrové továrny v Čitose na Hokkaidu ve spolupráci s IBM a imec. Žádná japonská firma se po léta nedotkla špičky oboru a náskok TSMC se měří v miliardách. Pokud se to podaří, Japonsko se jediným skokem vrátí na čelo odvětví." # todo: NEW TRANSLATION
 JAP_foundry_partnership: "Partnerství sléváren v Kumamotu" # todo: NEW TRANSLATION
 JAP_foundry_partnership_desc: "Zatímco Rapidus sází na špičkovou technologii, JASM v Kumamotu spolupracuje s TSMC a Sony na výrobě vyzrálejších uzlů pro automobily a senzory. Strop je nižší než u ambiciózního projektu, ale jde o základ ekonomiky: čipy vyráběné doma a ve velkém pro odvětví, která si nemohou dovolit jejich nedostatek." # todo: NEW TRANSLATION
 JAP_semiconductor_sovereignty: "Polovodičová suverenita" # todo: NEW TRANSLATION
 JAP_semiconductor_sovereignty_desc: "Vývojové firmy, výrobci nástrojů, dodavatelé materiálů a slévárny budou propojeni v soběstačný domácí ekosystém. V době exportních kontrol a kritických úzkých míst nebude Japonsko znovu závislé na zahraniční dobré vůli ohledně křemíku, na němž jeho ekonomika stojí." # todo: NEW TRANSLATION
 JAP_home_electronics: "Přízrak Galapág" # todo: NEW TRANSLATION
 JAP_home_electronics_desc: "Galapážský syndrom zanechal japonskou spotřební elektroniku doma brilantní, ale nevhodnou pro zahraniční prodej, a telefon gara-kei byl zastaralý v okamžiku, kdy dorazil smartphone. Sharp, Sony a Panasonic byly vytlačeny z trhů, kterým kdysi vládly. Stát stabilizuje, co zbylo, udržuje montážní linky i řemeslo při životě, zatímco odvětví hledá pevnou půdu." # todo: NEW TRANSLATION
 JAP_gaming_powerhouse: "Herní velmoc" # todo: NEW TRANSLATION
 JAP_gaming_powerhouse_desc: "Konzole Nintenda patří mezi nejprodávanější v historii, PlayStation společnosti Sony kotví globální impérium a Capcom, Sega, Square Enix a Bandai Namco dodávají software pro obě platformy. Vláda rozšíří investice do studií a hardwaru a zvětší přísun talentu, který udržuje Japonsko v centru interaktivní zábavy." # todo: NEW TRANSLATION
 JAP_rights_and_licensing_regime: "Práva a licence v zahraničí" # todo: NEW TRANSLATION
 JAP_rights_and_licensing_regime_desc: "Anime, manga, hry a hudba nesou obraz Japonska dále než jakékoli velvyslanectví a iniciativa Cool Japan existuje proto, aby tento dosah proměnila v příjmy. Stát investuje do distribuce, překladu a správy práv, aby tvůrčí produkce vydělávala v zahraničí místo toho, aby tam unikala. Každá licence se podepisuje podle zahraničního smluvního práva a vysílacích standardů a průmysl se to učí obchod po obchodu." # todo: NEW TRANSLATION
 JAP_broadband_nation: "Národ na optických vláknech" # todo: NEW TRANSLATION
 JAP_broadband_nation_desc: "NTT a jeho konkurenti zavedli optická vlákna až do domácností, zatímco velká část světa se stále plazila po mědi, čímž dali Japonsku jedno z nejrychlejších a nejlevnějších připojení na Zemi. Vláda rozšíří vysokokapacitní optiku do posledních neobsloužených údolí a na ostrovy, aby žádný kout země nebyl odříznut od digitální ekonomiky." # todo: NEW TRANSLATION
 JAP_beyond_5g: "Vstříc síti Beyond 5G" # todo: NEW TRANSLATION
 JAP_beyond_5g_desc: "Japonsko bylo vyřazeno z válek o smartphony a nemá v úmyslu zmeškat Beyond 5G. Stát financuje výzkumná konsorcia a otevřené síťové architektury od rádiové přístupové sítě po optickou páteř, aby japonské firmy určovaly podmínky sítí třicátých let, místo aby je pouze kupovaly." # todo: NEW TRANSLATION
 JAP_electronics_superpower: "Znovu elektronická velmoc" # todo: NEW TRANSLATION
 JAP_electronics_superpower_desc: "Materiály, továrny na Hokkaidu a Kjúšú, konzole a optická infrastruktura nyní uzavírají celou elektronickou architekturu. Starý mistr křemíkové éry se probojoval zpět na špici. Soul, Tchaj-pej a Šanghaj musí počítat s návratem Japonska." # todo: NEW TRANSLATION
 JAP_energy_resource_strategy: "Strategický energetický plán" # todo: NEW TRANSLATION
 JAP_energy_resource_strategy_desc: "Ministerstvo hospodářství, obchodu a průmyslu koordinuje základní energetický plán v oblasti výroby elektřiny, odolnosti sítě a bezpečnosti zdrojů, aby ochránilo zemi před energetickými šoky. Od jaderné energie přes obnovitelné zdroje až po strategické rezervy tento úřad řídí celý státní aparát s cílem udržet světla rozsvícená a hutě zásobené." # todo: NEW TRANSLATION
 JAP_renewable_energy_expansion: "Revoluce výkupních tarifů" # todo: NEW TRANSLATION
 JAP_renewable_energy_expansion_desc: "Výkupní tarify uvolňují rozvoj solární energetiky na Kjúšú a větrných elektráren u Akity, zatímco standardy efektivity Top Runner odstraňují plýtvání z každého spotřebiče a výrobní linky. Kyocera a Sharp přecházejí k solárnímu průmyslu. Slunce ani vítr nelze uvrhnout do embarga." # todo: NEW TRANSLATION
 JAP_power_grid_stabilization: "Už nikdy ve tmě" # todo: NEW TRANSLATION
 JAP_power_grid_stabilization_desc: "Nové frekvenční měniče a propojovací vedení spojují zemi do jediného odolného systému a překonávají rozdíl mezi padesáti hertzy na východě a šedesáti hertzy na západě, který kdysi rozděloval síť. Energetické společnosti musí držet rezervní kapacitu a rozhodovat, zda na každý přicházející šok odpoví solární, tepelná nebo akumulační energie." # todo: NEW TRANSLATION
 JAP_resource_security_initiative: "Zabezpečit tepny průmyslu" # todo: NEW TRANSLATION
 JAP_resource_security_initiative_desc: "Národní strategie zdrojů zahrnuje strategické zásoby, podíly v zámořské těžbě, recyklaci i výhradní ekonomickou zónu, vše s cílem ochránit průmysl před embargem. Ministerstva směrují ocel, ropu a vzácné kovy do továren, které je nejvíce potřebují, a mění dovozní závislost v řízenou odolnost." # todo: NEW TRANSLATION
 JAP_hydroelectric_power: "Využít horské řeky" # todo: NEW TRANSLATION
 JAP_hydroelectric_power_desc: "Strmé japonské řeky napájené deštěm pohánějí spolehlivé turbíny, zatímco přečerpávací elektrárny, jako je Kannagawa, ukládají levnou noční elektřinu pro večerní špičku. Znovu opracované přehrady zvyšují výkon infrastruktury, kterou země již vlastní. Proud je čistý, domácí a stálý." # todo: NEW TRANSLATION
 JAP_hydroelectric_power_TT: "Zvýšit výrobu hydroelektrické energie v oblastech §Y[613.GetName]§!, §Y[615.GetName]§! a §Y[616.GetName]§! o §G25%§!" # todo: NEW TRANSLATION
 JAP_geothermal_development: "Oheň pod ostrovy" # todo: NEW TRANSLATION
 JAP_geothermal_development_desc: "Japonská organizace pro kovy a energetickou bezpečnost financuje průzkum geotermální energie od Hačidžódžimy po vysočiny Appi navzdory odporu národních parků a majitelů lázní. Elektrárny s binárním cyklem dodávají stálou energii ve dne i v noci bez ohledu na počasí a využívají žár Ohnivého kruhu pro potřeby sítě." # todo: NEW TRANSLATION
 JAP_geothermal_development_TT: "Zvýšit výrobu geotermální energie v oblastech §Y[609.GetName]§!, §Y[616.GetName]§! a §Y[617.GetName]§! o §G25%§!" # todo: NEW TRANSLATION
 JAP_nuclear_restart: "Restartovat reaktory" # todo: NEW TRANSLATION
 JAP_nuclear_restart_desc: "V rámci politiky zelené transformace vláda znovu uvádí jadernou flotilu do provozu od Sendai na Kjúšú až po rozsáhlý komplex Kašiwazaki-Kariwa u Japonského moře. Regulační orgány jsou přísné a veřejnost obezřetná, avšak aritmetika energetické bezpečnosti je neúprosná. Atom musí znovu nést základní zatížení.\n-------------\nZnovu aktivuje jadernou výrobu a otevírá §YProgram restartu reaktorů§!, v jehož rámci je každá elektrárna uváděna do provozu postupně. Sendai, Ikata a fukujský klastr lze spustit okamžitě; náročnější lokality budou následovat po dokončení regulačních a schvalovacích procesů." # todo: NEW TRANSLATION
 JAP_nuclear_phaseout: "Sbohem atomu" # todo: NEW TRANSLATION
 JAP_nuclear_phaseout_desc: "Namísto hazardování s dalším zemětřesením nechá země reaktory zavírat po vypršení licencí a investuje peníze do efektivity a obnovitelných zdrojů. Tato cesta je krátkodobě dražší, ale dlouhodobě bezpečnější. Žádná vlna u pobřeží už neohrozí druhou Fukušimu.\n-------------\nOdstaví celou jadernou flotilu a otevírá §YProgram zelené transformace§!, který nahrazuje ztracený výkon výrobou, již Japonsko nemusí dovážet, a poptávkou, kterou již nemusí pokrývat. Každý projekt také trvale rozebere reaktory ve svém regionu." # todo: NEW TRANSLATION
 JAP_nuclear_regulatory_compliance: "Splnit nové bezpečnostní standardy" # todo: NEW TRANSLATION
 JAP_nuclear_regulatory_compliance_desc: "Elektrárny usilující o restart musí splnit standardy Úřadu pro regulaci jaderné energie, nejpřísnější na světě: dodatečná opatření proti zemětřesením a cunami, povinná bezpečnostní zařízení a přezkum, který nic nepřijímá na základě důvěry. Práce je pomalá a nesmírně nákladná, ale představuje jedinou cestu k provozuschopné flotile. Elektrárna, která požadavky splní, funguje lépe než dříve.\n-------------\nOdstraňuje ducha §YZpřísněné jaderné bezpečnostní standardy§! a otevírá restarty Genkai, Onagawy a Šimane." # todo: NEW TRANSLATION
 JAP_local_consent_accords: "Získat místní souhlas" # todo: NEW TRANSLATION
 JAP_local_consent_accords_desc: "Restart vyžaduje více než schválení regulačního orgánu, protože prefekturní guvernéři a hostitelské obce mají faktické právo veta a okresní soudy již dříve vydaly předběžná opatření. Kagošima a Ehime schválily Sendai a Ikatu prostřednictvím vyjednaných dohod s hostitelskými komunitami, založených na dotacích, pracovních místech a trpělivě budované místní důvěře. Systém dotací je nákladný, ale právě on umožňuje uskutečnit i ty nejtěžší restarty.\n-------------\nOtevírá restarty Tomari a Kašiwazaki-Kariwa, dvou nejobtížnějších lokalit v zemi." # todo: NEW TRANSLATION
 JAP_restart_flagship_fleet: "Palivový cyklus v Rokkashu" # todo: NEW TRANSLATION
 JAP_restart_flagship_fleet_desc: "Přepracovací závod v Rokkashu v Aomori uzavírá palivový cyklus a získává plutonium a uran z vyhořelého paliva pro použití v nových reaktorech. Japonsko drží separované plutonium a disponuje kapacitou k jeho dalšímu obohacování, což Peking, Soul i Pchjongjang nikdy neopomněly zaznamenat.\n-------------\nSousedé Japonska budou mít na tyto zásoby §Rvelmi nepříznivý názor§!." # todo: NEW TRANSLATION
 JAP_decommissioning_authority: "Dlouhé odstavení" # todo: NEW TRANSLATION
 JAP_decommissioning_authority_desc: "Bezpečná demontáž flotily potrvá desetiletí, vyžaduje zmenšující se skupinu jaderných inženýrů a správu lokalit dlouho poté, co reaktory vychladnou. Veřejnosti se uleví, rozvaha nikoli. Každá stárnoucí jaderná flotila na světě čelí stejnému zúčtování a země, která práci zvládne jako první, může své znalosti prodávat všem ostatním.\n-------------\nOtevírá projekty frekvenčního měniče, propojení s Hokkaidem a vodíku v Kóbe." # todo: NEW TRANSLATION
 JAP_lng_bridge_supply: "Most z fosilních paliv" # todo: NEW TRANSLATION
 JAP_lng_bridge_supply_desc: "Zkapalněný zemní plyn a uhlí zaplňují mezeru po odstavených reaktorech a činí z Japonska největšího dovozce LNG na světě. Plynové elektrárny ve Futtsu a Senboku lze postavit rychle a provozovat naplno, avšak každý náklad se platí v cizí měně. Rozdíl nese účet za elektřinu domácností.\n-------------\nJe to most, a §Rnákladný§! most. Projekt spoluspalování čpavku je způsob, jak se z něj Japonsko nakonec dostane." # todo: NEW TRANSLATION
 JAP_renewable_acceleration: "Slunce, vítr a voda" # todo: NEW TRANSLATION
 JAP_renewable_acceleration_desc: "Aukce pobřežních větrných elektráren v oblastech Akity a Čiby, velkoplošná solární energetika a přepracovaná pravidla připojování k síti zvyšují podíl obnovitelných zdrojů rychleji, než kdy dokázaly samotné výkupní tarify. Přerušovanost a omezení sítě přetrvávají a nejlevnější kilowatthodina je stále ta, kterou se Japonsko naučilo nespotřebovat." # todo: NEW TRANSLATION
 JAP_fusion_energy_program: "Širší přístup" # todo: NEW TRANSLATION
 JAP_fusion_energy_program_desc: "Japonsko ustoupilo od hostitelství ITER a výměnou přijalo Širší přístup: urychlovač fúzních materiálů a mezinárodní výzkumné centrum v Rokkashu a tokamak JT-60SA v Nace. Supravodivé cívky, gyrotrony a dlouhé učednictví v plazmové fyzice jsou výnosem této dohody.\n-------------\nAť už se reaktory restartují, nebo utlumí, argument pro fúzi přetrvává. Toto je jediná energetická sázka, kterou §Yžádná z cest nevylučuje§!." # todo: NEW TRANSLATION
 JAP_national_energy_security: "Národ poháněný energií" # todo: NEW TRANSLATION
 JAP_national_energy_security_desc: "Stabilní a odolné dodávky, ať už obnovené základní zatížení, nebo síť obnovitelných zdrojů a akumulace, stojí na výzkumné základně přesahující štěpení. Energetická bezpečnost se stává základem širší ekonomiky." # todo: NEW TRANSLATION
 JAP_monarchy_resource_anchor_tt: "Účinky §Y$JAP_rare_earth_resilience$§! budou zlepšeny" # todo: NEW TRANSLATION
 JAP_reactors_recommissioned_tt: "Odstavené reaktory jsou §Gznovu uvedeny do provozu§! a mohou opět vyrábět elektřinu" # todo: NEW TRANSLATION
 JAP_national_energy_security_tt1: "S §Y6§! z §Y8§! lokalit reaktorů znovu v provozu (aktuálně §Y[?JAP_reactor_sites_online|0]§!):" # todo: NEW TRANSLATION
 JAP_national_energy_security_tt2: "S §Y6§! z §Y8§! projektů zelené transformace dokončenými (aktuálně §Y[?JAP_gx_projects_completed|0]§!):" # todo: NEW TRANSLATION
 JAP_national_energy_security_tt3: "Nesplnění jedné z podmínek:" # todo: NEW TRANSLATION
 JAP_minamitori_deep_sea: "Bahno z Minamitori" # todo: NEW TRANSLATION
 JAP_minamitori_deep_sea_desc: "Mořské dno uvnitř japonské výhradní ekonomické zóny kolem Minamitoriišimy obsahuje bahno s obsahem vzácných zemin, jaký se nikde jinde na planetě nevyskytuje, a leží pod více než pěti tisíci metry vody. JOGMEC a Tokijská univerzita financují zvedací potrubí a zkoušky čerpání, které by vůbec umožnily těžbu. Pokud lze bahno vyzvednout, Japonsko přestane záviset na jediném zahraničním dodavateli kovů potřebných pro jeho magnety a motory." # todo: NEW TRANSLATION
 JAP_national_petroleum_stockpile: "Naplnit národní rezervy" # todo: NEW TRANSLATION
 JAP_national_petroleum_stockpile_desc: "Japonská organizace pro kovy a energetickou bezpečnost rozšiřuje strategické ropné rezervy v pobřežních nádržích v Šibuši, Kiire a Tomakomai a přidává solné kaverny i nadzemní sila. Větší rezerva poskytne zemi měsíce pojištění proti uzavření Hormuzského průlivu. Plná nádrž je tichá síla." # todo: NEW TRANSLATION
 JAP_grid_battery_storage: "Síť budoucnosti" # todo: NEW TRANSLATION
 JAP_grid_battery_storage_desc: "GS Yuasa a Panasonic, veteráni éry lithium-iontových baterií, obracejí své články k velkokapacitnímu ukládání energie, zatímco státní dotace financují baterie vyrůstající vedle rozvoden. V kombinaci s chytřejší sítí ukládání vyrovnává špičky a zaplňuje propady. Elektron ušetřený v poledne rozsvítí město za soumraku." # todo: NEW TRANSLATION
 JAP_urban_mining: "Těžit města" # todo: NEW TRANSLATION
 JAP_urban_mining_desc: "Ve svých závodech v Naóšimě a Onahamě získává Mitsubishi Materials zlato, měď a vzácné kovy z elektronického šrotu dováženého z celého světa. Medaile z tokijských olympijských her byly vyraženy z recyklovaného kovu. Co země vyhodí, to znovu taví." # todo: NEW TRANSLATION
 JAP_overseas_upstream_equity: "Kupovat vrty u zdroje" # todo: NEW TRANSLATION
 JAP_overseas_upstream_equity_desc: "INPEX, vlajkový těžař země, a státní finančníci z JOGMECu získávají podíly v nalezištích od Abú Zabí po ruský Dálný východ a chrání zemi před rozmary spotového trhu. Každý barel z japonského vrtu je barelem, který nemůže zadržet žádný soupeř. Vlastnictví je nejjistější zásobování." # todo: NEW TRANSLATION
 JAP_horizontal_recycling: "Kov bez konce" # todo: NEW TRANSLATION
 JAP_horizontal_recycling_desc: "Horizontální recyklace vrací hliník a ocel do původní jakosti a uzavírá kruh mezi vrakovištěm a válcovnou. UACJ a Kobe Steel budují třídicí a rafinační linky, díky nimž funguje recyklace plechovka-na-plechovku a díl-na-díl v průmyslovém měřítku. Tuna udržená v oběhu je tuna, kterou již nikdy nebude nutné dovézt." # todo: NEW TRANSLATION
 JAP_nankai_methane_hydrate: "Ledový oheň Nankaijského příkopu" # todo: NEW TRANSLATION
 JAP_nankai_methane_hydrate_desc: "Japonská organizace pro kovy a energetickou bezpečnost tlačí své výzkumné lodě k průmyslové metodě těžby metanového hydrátu uzamčeného v Nankaijském příkopu u pacifického pobřeží. Japonsko zde provedlo první pobřežní výrobní test na světě, avšak technologie zůstává neověřená a ekonomika skličující. Pokud ledový oheň vydá své zásoby, Japonsko už nikdy nebude muset žebrat o plyn." # todo: NEW TRANSLATION
 JAP_model_competition: "Východoasijská konkurence elektroniky" # todo: NEW TRANSLATION
 JAP_model_competition_desc: "Japonský elektronický průmysl svádí neúnavný boj se svými sousedy. Samsung a SK Hynix dominují pamětem, TSMC ovládá výrobu špičkových čipů a čínské továrny postupují uzel po uzlu díky téměř bezednému státnímu fondu. Každý pokrok soupeře znamená ztracený trh, stlačenou marži a generaci inženýrů lákanou do zahraničí. Pouze trvalé investice udrží tlak na uzdě; pokud poleví právě ve chvíli, kdy konkurence zesílí, půda pod Japonskem se propadne.\n-------------\nZvýšení §YOdolnosti elektroniky§! nad konkurenční tlak tento národní duch oslabí a nakonec odstraní. Aktuální údaje naleznete v §Y$JAP_technological_isolation_category$§!." # todo: NEW TRANSLATION
 JAP_consumer_electronics_drive: "Podpora spotřební elektroniky" # todo: NEW TRANSLATION
 JAP_consumer_electronics_drive_desc: "Časově omezený program má udržet domácí výrobu spotřební elektroniky na plné kapacitě, zachovat továrny, dodavatele i kvalifikované pracovníky, kteří výrobky sestavují, zatímco průmysl přečkává bouři." # todo: NEW TRANSLATION
 JAP_foundry_localization: "Lokalizace výroby čipů" # todo: NEW TRANSLATION
 JAP_foundry_localization_desc: "Soustředěné úsilí o lokalizaci dodavatelského řetězce výroby čipů vybuduje kolem nových továren nástroje, materiály a vyškolené techniky, aby domácí produkce čipů mohla rychle růst." # todo: NEW TRANSLATION
 JAP_electronics_export_offensive: "Exportní ofenziva elektroniky" # todo: NEW TRANSLATION
 JAP_electronics_export_offensive_desc: "Spustit koordinovaný program dotací, obchodních misí a společného marketingu s cílem získat zpět podíl na trhu od zahraničních konkurentů a výraznými výdaji upevnit postavení Japonska v globálním obchodu s elektronikou." # todo: NEW TRANSLATION
 JAP_electronics_resilience_up_tt: "§YOdolnost elektroniky§! vůči zahraniční konkurenci: $RIGHT|+=0$" # todo: NEW TRANSLATION
 JAP_electronics_resilience_complete_TT: "§YOdolnost elektroniky§! je alespoň §G5§! (aktuálně [?JAP_electronics_resilience|Y0])" # todo: NEW TRANSLATION
 JAP_electronics_resilience_below_5_tt: "§YOdolnost elektroniky§! je nižší než §G5§! (aktuálně [?JAP_electronics_resilience|Y0])" # todo: NEW TRANSLATION
 JAP_electronics_export_opening_tt: "§YOtevřenost§! je vyšší než §G9§! (aktuálně [?JAP_galapagos_openness|Y0]), nebo Japonsko přijalo §Y$JAP_cool_japan_doctrine$§!" # todo: NEW TRANSLATION
 JAP_electronics_war_won_tt: "§Y$JAP_model_competition$§! navždy skončí a již se nemůže vrátit, bez ohledu na další kroky Soulu, Tchaj-peje a Šanghaje." # todo: NEW TRANSLATION
 JAP_CHI_chip_rivalry: "Soupeření v polovodičích" # todo: NEW TRANSLATION
 JAP_electronics.1.t: "Asijští vyzyvatelé se přibližují" # todo: NEW TRANSLATION
 JAP_electronics.1.d: "Čtvrtletní výsledky se v Tokiu čtou pochmurně. Samsung a SK Hynix zvětšily náskok v pamětech, objednávkové knihy TSMC praskají ve švech a čínské továrny získávají zakázky, které dříve automaticky připadaly Japonsku. Analytici otevřeně hovoří o strukturálním úpadku japonského elektronického sektoru. V zasedacích místnostech Kawasaki a Ósaky znají pravdu: konkurence už nedohání, ale předbíhá." # todo: NEW TRANSLATION
 JAP_electronics.1.a: "Trh bez boje nepřenecháme." # todo: NEW TRANSLATION
 JAP_electronics.2.t: "Čína dosahuje hranice možností" # todo: NEW TRANSLATION
 JAP_electronics.2.d: "Zpráva dopadá jako úder kladivem. Čínské továrny podporované Národním fondem integrovaných obvodů a neodrazené lety západních sankcí dosáhly špičky logické výroby, na niž dosáhne jen hrstka firem na světě. Poslední uklidňující předpoklad japonského průmyslu, že pevninská Čína zůstává generaci pozadu, zmizel. Hranice se posunula a Japonsko se musí rozhodnout, zda výzvu přijme, nebo zůstane pozadu." # todo: NEW TRANSLATION
 JAP_electronics.2.a: "Hranice se posunula. Musíme odpovědět." # todo: NEW TRANSLATION
 JAP_electronics.3.t: "Japonsko znovu získává křemíkovou korunu" # todo: NEW TRANSLATION
 JAP_electronics.3.d: "Navzdory všem předpokladům se příliv obrátil. Japonské továrny dodávají ve velkém, japonské materiály zůstávají nenahraditelné a japonský design i obsah se těší úctě po celém světě. Soupeři ze Soulu, Tchaj-peje a Šanghaje nezmizeli, ale poprvé za celou generaci se ohlížejí přes rameno oni. Dlouhý ústup skončil; Japonsko znovu soutěží z pozice síly." # todo: NEW TRANSLATION
 JAP_electronics.3.a: "Japonsko znovu stojí na vrcholu průmyslu." # todo: NEW TRANSLATION
 JAP_electronics.4.t: "Japonsko se vrací na hranici polovodičů" # todo: NEW TRANSLATION
 JAP_electronics.4.d: "V továrnách od Hokkaida po Kjúšú, ve výzkumných laboratořích, herních studiích i optických trasách dokončilo Japonsko návrat, který málokdo považoval za možný. Země odepsaná před deseti lety jako stárnoucí dědic elektronické éry se probojovala zpět na špičku a oznámila, že hodlá zůstat. Rovnováha východoasijského technologického soupeření se posunula a každé hlavní město od Soulu po Washington přepočítává své kalkulace." # todo: NEW TRANSLATION
 JAP_electronics.4.a: "Pozoruhodný návrat." # todo: NEW TRANSLATION
 JAP_electronics.4.b: "Starý obr má stále zuby." # todo: NEW TRANSLATION
 JAP_diplomacy: "Japonská diplomacie" # todo: NEW TRANSLATION
 JAP_diplomacy_desc: "Obnova vztahů se světem a nové vymezení role Japonska v mezinárodním společenství." # todo: NEW TRANSLATION
 JAP_seek_permanent_unsc_seat: "Usilovat o stálé členství v RB OSN" # todo: NEW TRANSLATION
 JAP_seek_permanent_unsc_seat_desc: "Hospodářský vliv Japonska a jeho příspěvky Organizaci spojených národů opravňují zemi ke stálé roli v mezinárodní bezpečnosti. Její získání bude vyžadovat trvalé lobbování a souhlas obou komor systému OSN." # todo: NEW TRANSLATION
 JAP_diplomacy_idea_TT: "§YJak budete postupovat diplomatickou větví, k tomuto národnímu duchu se přidají další modifikátory!§!" # todo: NEW TRANSLATION
 JAP_friendship_asean: "Zlepšování vztahů s ASEAN" # todo: NEW TRANSLATION
 JAP_friendship_asean_desc: "Japonská vláda bude pracovat na zlepšení vztahů se zeměmi ASEAN, obnově důvěry a podpoře dialogu. Pro Japonsko je ASEAN nepostradatelným a významným partnerem z hospodářského i bezpečnostního hlediska a jeho jednota a stabilita ovlivní budoucnost celého regionu." # todo: NEW TRANSLATION
 JAP_not_asean_war_TT: "Existuje alespoň jedna země s národním duchem \"Člen ASEAN\" a Japonsko není ve válce s žádnou zemí, která tento národní duch má." # todo: NEW TRANSLATION
 JAP_chiang_mai: "Iniciativa Čiang Mai" # todo: NEW TRANSLATION
 JAP_chiang_mai_desc: "Prostřednictvím Iniciativy Čiang Mai Japonsko posiluje regionální finanční spolupráci na podporu hospodářské stability a soudržnosti zemí ASEAN." # todo: NEW TRANSLATION
 JAP_quantitative_oda: "Kvantitativní rozvojová pomoc" # todo: NEW TRANSLATION
 JAP_quantitative_oda_desc: "Prostřednictvím rozsáhlých investic rozvojové pomoci do klíčové infrastruktury, jako je doprava, přístavy a energetika, Japonsko podporuje růst ekonomik ASEAN a regionální propojenost." # todo: NEW TRANSLATION
 JAP_qualitative_oda: "Kvalitativní rozvojová pomoc" # todo: NEW TRANSLATION
 JAP_qualitative_oda_desc: "Partnerstvím s místními podniky a institucemi Japonsko podporuje rozvoj lidského kapitálu a demokratických hodnot a posiluje svůj vliv v celém ASEAN." # todo: NEW TRANSLATION
 JAP_security_south_china_sea: "Bezpečnostní postoj v Jihočínském moři" # todo: NEW TRANSLATION
 JAP_security_south_china_sea_desc: "S podporou důvěry zemí ASEAN Japonsko zahajuje rámec neutrální a mírové námořní bezpečnosti v Jihočínském moři." # todo: NEW TRANSLATION
 JAP_away_dependence: "Oprostit se od závislosti na USA" # todo: NEW TRANSLATION
 JAP_away_dependence_desc: "Japonsko začíná znovu přezkoumávat povahu svých dlouhodobých vazeb a hledá širší strategické možnosti a autonomii. V oblastech, jako je hospodářství, technologie a bezpečnost, sledujeme kurz utvářený vlastní vizí budoucnosti." # todo: NEW TRANSLATION
 JAP_development_production: "Vybudovat domácí výrobní řetězce" # todo: NEW TRANSLATION
 JAP_development_production_desc: "Abychom zajistili nezávislou národní obranu, vybudujeme domácí systém schopný vyrábět zbraně a materiály v Japonsku." # todo: NEW TRANSLATION
 JAP_japanese_doctrine: "Formulovat japonskou doktrínu" # todo: NEW TRANSLATION
 JAP_japanese_doctrine_desc: "Ustanovíme nezávislou japonskou bezpečnostní doktrínu, která umožní pružně reagovat na naše strategické prostředí." # todo: NEW TRANSLATION
 JAP_recalling_researchers: "Povolat zahraniční výzkumníky zpět" # todo: NEW TRANSLATION
 JAP_recalling_researchers_desc: "Univerzity a národní laboratoře nabízejí zrychlené kariérní postupy, modernizovaná zařízení a konkurenceschopné granty, aby zvrátily dlouhý odliv talentů. Cílem je obnovit domácí výzkumnou sílu přivedením japonských vědců zpět ze Spojených států." # todo: NEW TRANSLATION
 JAP_japanese_cloud: "Kasumigaseki Cloud" # todo: NEW TRANSLATION
 JAP_japanese_cloud_desc: "Vybudovat vládou provozovaný „Kasumigaseki Cloud“, spravovaný japonskými poskytovateli a hostovaný na domácích serverech. Ministerstva a klíčové úřady převedou své systémy na tuto sdílenou platformu, aby snížily náklady, sjednotily bezpečnostní standardy a udržely citlivá data pod národní kontrolou." # todo: NEW TRANSLATION
 JAP_base_okinawa: "Jednání o stažení amerických sil z Okinawy" # todo: NEW TRANSLATION
 JAP_base_okinawa_desc: "Pro posílení bezpečnostní autonomie Japonska budou zahájena jednání o stažení amerických sil rozmístěných na Okinawě." # todo: NEW TRANSLATION
 JAP_enhancement_exercises: "Rozšířená společná cvičení" # todo: NEW TRANSLATION
 JAP_enhancement_exercises_desc: "Prohloubit integraci s americkými silami prostřednictvím větších a častějších společných cvičení. Námořní, letecké a pozemní jednotky procvičují společné postupy, komunikaci a logistiku, aby se v reálné krizi mohly obě strany pohybovat, bojovat a doplňovat zásoby jako jediná koordinovaná síla." # todo: NEW TRANSLATION
 JAP_education_jap_usa: "Společné vzdělávací programy USA a Japonska" # todo: NEW TRANSLATION
 JAP_education_jap_usa_desc: "Pro prohloubení vzájemného porozumění mezi Japonskem a Spojenými státy zavedeme společné vzdělávací programy a výměny studentů. Učením se z japonského smyslu pro disciplínu a amerického podnikatelského ducha tato iniciativa vychová novou generaci mezinárodně smýšlejících vůdců a dále posílí bilaterální důvěru." # todo: NEW TRANSLATION
 JAP_culture_technology: "Výměna technologické kultury Japonska a USA" # todo: NEW TRANSLATION
 JAP_culture_technology_desc: "Posílit vazby mezi japonskými firmami a americkými technologickými centry propojením univerzitních laboratoří a studií s partnery v Silicon Valley, Seattlu a Los Angeles. Inženýři, designéři a tvůrci budou spolupracovat na společných projektech a spojí americké znalosti platforem s japonským hardwarem, hrami a animací." # todo: NEW TRANSLATION
 JAP_dual_use: "Spolupráce na technologiích dvojího užití" # todo: NEW TRANSLATION
 JAP_dual_use_desc: "Japonsko a Spojené státy prohloubí spolupráci v oblasti technologií dvojího užití, tedy technologií použitelných pro civilní i vojenské účely. Spolupráce průmyslu a akademické sféry urychlí výzkum a vývoj a podpoří celkový technologický pokrok." # todo: NEW TRANSLATION
 JAP_okinawa_development: "Společný rozvojový projekt Okinawy" # todo: NEW TRANSLATION
 JAP_okinawa_development_desc: "Pro podporu hospodářského růstu Okinawy a regionální integrace budou Japonsko a Spojené státy spolupracovat na projektu zaměřeném na rozvoj infrastruktury. Zlepšení dopravních sítí, logistických systémů a veřejných zařízení má podpořit regionální růst a otevřít nové cesty spolupráce mezi Japonskem a USA." # todo: NEW TRANSLATION
 JAP_informal_cooperation: "Rámec neformální spolupráce" # todo: NEW TRANSLATION
 JAP_informal_cooperation_desc: "Navzdory absenci formálních diplomatických vztahů rozvinuly Japonsko a Tchaj-wan praktické a významné formy spolupráce. Prostřednictvím reakce na katastrofy, technologických výměn a kontaktů mezi lidmi vzniká vzájemně prospěšný základ." # todo: NEW TRANSLATION
 JAP_disaster_countermeasure_cooperation: "Platforma znalostí o katastrofách Japonska a Tchaj-wanu" # todo: NEW TRANSLATION
 JAP_disaster_countermeasure_cooperation_desc: "Vzhledem ke společné zranitelnosti vůči přírodním katastrofám vytvářejí Japonsko a Tchaj-wan společnou platformu pro sdílení odborných znalostí a zkušeností s reakcí na katastrofy. Tato spolupráce posílí odolnost a schopnost oprav v obou zemích." # todo: NEW TRANSLATION
 JAP_tai_high_technology: "Japonsko-tchajwanské technologické propojení" # todo: NEW TRANSLATION
 JAP_tai_high_technology_desc: "Výzkumné instituce a soukromé společnosti z Japonska a Tchaj-wanu spojují síly při spolupráci na špičkových civilních technologiích. Partnerství má podpořit inovace a produktivitu průmyslu v obou zemích." # todo: NEW TRANSLATION
 JAP_tai_tourist_visa: "Uvolnění politiky turistických víz" # todo: NEW TRANSLATION
 JAP_tai_tourist_visa_desc: "Pro další podporu příjezdového cestovního ruchu z Tchaj-wanu Japonsko zjednoduší vízové postupy. Větší kontakty mezi lidmi a rozvoj turismu pomohou stimulovat ekonomiku a prohloubí vzájemné porozumění." # todo: NEW TRANSLATION
 JAP_tai_international_student: "Rozšíření výměnných studentských programů" # todo: NEW TRANSLATION
 JAP_tai_international_student_desc: "Japonsko rozšíří možnosti studia tchajwanských studentů na svých univerzitách. Tato iniciativa má prohloubit akademické a kulturní vazby a vychovat budoucí vůdce, kteří propojí obě společnosti." # todo: NEW TRANSLATION
 JAP_tai_senkaku: "Navázat námořní jednání s Tchaj-wanem" # todo: NEW TRANSLATION
 JAP_tai_senkaku_desc: "Spor o ostrovy Senkaku ovlivňuje rybolovná práva, námořní bezpečnost i každé jednání ve Východočínském moři. Japonsko otevírá komunikační kanály a praktické konzultace s cílem omezit tření na moři, aniž by ustoupilo od suverenity. Konfrontaci řídí, nikoli řeší." # todo: NEW TRANSLATION
 JAP_dprk_national_policy: "Doktrína severního poloostrova" # todo: NEW TRANSLATION
 JAP_dprk_national_policy_desc: "Severní Korea zůstává nejbližší jiskrou našim břehům a nejnepředvídatelnějším aktérem na poloostrově. Definujeme jednotnou národní politiku vůči Pchjongjangu a spojíme diplomacii, zpravodajství a připravenost do jediné doktríny. Směr, který zvolíme, určí podmínky bezpečnosti v severovýchodní Asii." # todo: NEW TRANSLATION
 JAP_dprk_maximum_pressure: "Maximální tlak na Pchjongjang" # todo: NEW TRANSLATION
 JAP_dprk_maximum_pressure_desc: "Severní Korea rozumí nátlaku, nikoli dobré vůli. Zpřísníme prosazování sankcí, rozšíříme námořní dohled a zkoordinujeme diplomatický tlak, abychom omezili prostor Pchjongjangu pro eskalaci. Cíl je prostý: zvýšit cenu každé provokace, dokud režim nebude nucen přehodnotit své kroky." # todo: NEW TRANSLATION
 JAP_dprk_missile_defense: "Vícevrstvý raketový štít" # todo: NEW TRANSLATION
 JAP_dprk_missile_defense_desc: "Severní hrozba se měří v minutách, nikoli dnech. Posílíme vícevrstvou síť protiraketové obrany na zemi, na moři i ve vzduchu, abychom ochránili města, přístavy a velitelská centra před náhlým útokem. Věrohodný štít odejme Pchjongjangu možnost zastrašovat nás na dálku." # todo: NEW TRANSLATION
 JAP_dprk_trilateral_training: "Trojstranná cvičení na poloostrově" # todo: NEW TRANSLATION
 JAP_dprk_trilateral_training_desc: "Bezpečnost na poloostrově nemůže spočívat pouze na prohlášeních. Společný výcvik s Jižní Koreou a Spojenými státy zlepší připravenost, interoperabilitu a reakci na krize v nejnebezpečnějším ohnisku regionu. Společným cvičením dáváme najevo, že agrese se setká s koordinovanou odpovědí." # todo: NEW TRANSLATION
 JAP_dprk_korean_defense_treaty: "Japonsko-korejská obranná dohoda" # todo: NEW TRANSLATION
 JAP_dprk_korean_defense_treaty_desc: "Poloostrov a japonské souostroví sdílejí stejnou frontovou linii. Formální obranná dohoda s Jižní Koreou spojí sdílení zpravodajských informací, krizové plánování a vzájemné bezpečnostní závazky do trvalého rámce. Staré křivdy přetrvávají, strategická nutnost však vyžaduje pevnější základ." # todo: NEW TRANSLATION
 JAP_dprk_conditional_engagement: "Podmíněný kanál k Pchjongjangu" # todo: NEW TRANSLATION
 JAP_dprk_conditional_engagement_desc: "Samotný nátlak nedokáže řídit každou krizi. Otevřeme kontrolovaný diplomatický kanál k Severní Koreji, podmíněný přísnými požadavky na raketové testy, vojenské incidenty a regionální destabilizaci. Dialog nenahradí odstrašení, ale může zabránit nesprávným odhadům." # todo: NEW TRANSLATION
 JAP_dprk_normalization_framework: "Plán normalizace" # todo: NEW TRANSLATION
 JAP_dprk_normalization_framework_desc: "Stabilní severovýchodní Asie vyžaduje více než trvalé řízení krizí. Ustanovíme postupný rámec normalizace vztahů se Severní Koreou a spojíme diplomatický pokrok s ověřitelnými bezpečnostními závazky a regionálními zárukami. Jakékoli urovnání musí být postupné, vymahatelné a založené na vzájemnosti." # todo: NEW TRANSLATION
 JAP_dprk_support_unification: "Podpořit sjednocený poloostrov" # todo: NEW TRANSLATION
 JAP_dprk_support_unification_desc: "Rozdělení Koreje utvářelo bezpečnost východní Asie po celé generace, nemusí však být trvalé. Diplomatickou cestou, koordinací s partnery a plánováním regionální stability podpoříme mírovou cestu ke korejskému sjednocení. Pokud má být poloostrov přetvořen, Japonsko musí pomoci utvářet řád, který bude následovat." # todo: NEW TRANSLATION
 JAP_history_education: "Transparentní výuka historie" # todo: NEW TRANSLATION
 JAP_history_education_desc: "Musíme čelit historickým faktům přímo tím, že přezkoumáme vzdělávací materiály a výukové směrnice. Transparentní výuka historie je prvním krokem k budování důvěry se sousedními zeměmi." # todo: NEW TRANSLATION
 JAP_statement: "[ROOT.GetLeader]ovo prohlášení" # todo: NEW TRANSLATION
 JAP_statement_desc: "Aby vláda vyjádřila jasný postoj odpovědnosti a lítosti nad historickými událostmi, vydá nové oficiální prohlášení. Tato iniciativa má podpořit usmíření s dotčenými zeměmi a rozvíjet vztahy orientované na budoucnost a založené na vzájemné důvěře." # todo: NEW TRANSLATION
 JAP_intellectual_platform: "Trojstranná historická platforma" # todo: NEW TRANSLATION
 JAP_intellectual_platform_desc: "S prostřednictvím OSN budou Japonsko, Čína a Jižní Korea společně plánovat a zakládat muzea a digitální archivy, které předají vzpomínky na válku budoucím generacím. Japonsko poskytne finanční podporu a představí tuto iniciativu jako globální symbol míru a usmíření." # todo: NEW TRANSLATION
 JAP_intellectual_platform_TT: "§YPokud obě země dosáhnou dohody, všechny tři národy získají národní duch zvyšující §Gstabilitu§!!§!" # todo: NEW TRANSLATION
 JAP_chi_friendship: "Zlepšování vztahů s Čínou" # todo: NEW TRANSLATION
 JAP_chi_friendship_desc: "Pro stabilizaci japonsko-čínských vztahů bude japonská vláda pokračovat v dialogu, podporovat vzájemné porozumění a řídit třecí plochy. Čína je sousední zemí s významným vlivem na regionální řád i ekonomiku a zlepšení vztahů přímo souvisí s bezpečností a prosperitou Japonska." # todo: NEW TRANSLATION
 JAP_chi_accept_intellectual_platform: "Čína souhlasila se založením japonsko-čínско-korejské historické platformy." # todo: NEW TRANSLATION
 JAP_chi_trade_support: "Podpora reformy čínského obchodního systému" # todo: NEW TRANSLATION
 JAP_chi_trade_support_desc: "Poskytnout technickou a institucionální podporu reformě a modernizaci čínského obchodního systému. To usnadní vstup japonských podniků na trh a posílí vliv Japonska v regionu." # todo: NEW TRANSLATION
 JAP_chi_advancement_companies: "Vzájemný vstup podniků na trh" # todo: NEW TRANSLATION
 JAP_chi_advancement_companies_desc: "Podporovat vzájemné investice a vstup japonských a čínských podniků na trhy s cílem zvýšit hospodářskou provázanost a produktivitu." # todo: NEW TRANSLATION
 JAP_chi_kanji: "Projekt kulturní spolupráce „Sinósféra“" # todo: NEW TRANSLATION
 JAP_chi_kanji_desc: "Posilováním kulturních vazeb mezi zeměmi sinosféry projekt zdůrazňuje sdílené hodnoty a historická pouta a slouží jako kulturní nárazník proti vnějšímu vlivu." # todo: NEW TRANSLATION
 JAP_chi_temple: "Společný projekt ochrany buddhistických chrámů" # todo: NEW TRANSLATION
 JAP_chi_temple_desc: "Prostřednictvím spolupráce Japonska a Číny chránit buddhistické chrámy jako společné kulturní dědictví. Projekt zvyšuje jejich hodnotu jako turistických cílů a znovu potvrzuje historické vazby mezi oběma národy." # todo: NEW TRANSLATION
 JAP_chi_senkaku: "Řízení sporu o Senkaku" # todo: NEW TRANSLATION
 JAP_chi_senkaku_desc: "Napětí kolem ostrovů Senkaku přímo souvisí s celkovými japonsko-čínskými vztahy a stabilitou Východočínského moře. Při zachování našeho postoje k suverenitě je nutné vytvořit diplomatický rámec řízení sporu, aby se předešlo náhodným střetům. Formálně zřídíme komunikační kanály a při omezování tření na moři budeme jednat v prostředí příznivém pro naši zemi." # todo: NEW TRANSLATION
 JAP_kor_friendship: "Zlepšování vztahů s Jižní Koreou" # todo: NEW TRANSLATION
 JAP_kor_friendship_desc: "Japonská vláda bude pracovat na obnově důvěry a pokračování dialogu s cílem vytvořit na budoucnost orientovaný vztah mezi Japonskem a Jižní Koreou. Jižní Korea je jedním z nejdůležitějších sousedů Japonska a její vztahy jsou přímo spojeny s regionální stabilitou a ekonomikou. Zlepšení vztahů rozšíří japonské možnosti a vliv." # todo: NEW TRANSLATION
 JAP_kor_accept_intellectual_platform: "Jižní Korea souhlasila se založením japonsko-čínско-korejské historické platformy." # todo: NEW TRANSLATION
 JAP_kor_accelerator: "Tokijsko-soulský akcelerátor" # todo: NEW TRANSLATION
 JAP_kor_accelerator_desc: "V Tokiu a Soulu vzniká společný akcelerační program na podporu a rozvoj startupů, který posílí inovace a hospodářskou spolupráci mezi oběma hlavními městy." # todo: NEW TRANSLATION
 JAP_kor_local_companies: "Iniciativa výměny místních podniků" # todo: NEW TRANSLATION
 JAP_kor_local_companies_desc: "Podporuje spolupráci mezi regionálními podniky a urychluje růst a rozvoj civilního průmyslu na místní úrovni." # todo: NEW TRANSLATION
 JAP_kor_cultural_exchange: "Kulturní výměna" # todo: NEW TRANSLATION
 JAP_kor_cultural_exchange_desc: "Podporou kulturní výměny se vytváří základ pro větší vzájemné porozumění a vliv veřejného mínění mezi oběma národy." # todo: NEW TRANSLATION
 JAP_kor_aging: "Pracovní skupina pro stárnoucí společnost Japonska a Koreje" # todo: NEW TRANSLATION
 JAP_kor_aging_desc: "Vzniká společná japonsko-korejská pracovní skupina, která řeší společnou výzvu stárnoucích společností a každý měsíc jedná o tvorbě spolupracujících politik." # todo: NEW TRANSLATION
 JAP_kor_liancourt_rocks: "Řízení sporu o Takeshimu" # todo: NEW TRANSLATION
 JAP_kor_liancourt_rocks_desc: "Spor o Takeshimu (Tokdo) je významnou nevyřešenou otázkou, která může ovlivnit celkové japonsko-korejské vztahy. Při pevném zachování postoje naší země vytvoříme rámec pro dialog a praktické konzultace, abychom předešli náhodnému tření a eskalaci diplomatického napětí. Tím zrušíme omezení jednání s Jižní Koreou o otázce Takeshima (Tokdo)." # todo: NEW TRANSLATION
 JAP_approaching_russia: "Sbližování s Ruskem" # todo: NEW TRANSLATION
 JAP_approaching_russia_desc: "Pro zajištění geopolitické stability a přístupu ke zdrojům sledujeme diplomatickou linii zaměřenou na zlepšení vztahů s Ruskem, především prostřednictvím spolupráce v energetice, infrastruktuře a obchodu." # todo: NEW TRANSLATION
 JAP_sov_far_east_development: "Iniciativa Dálného východu" # todo: NEW TRANSLATION
 JAP_sov_far_east_development_desc: "Tato iniciativa využívá japonské zkušenosti s revitalizací regionů v chladném klimatu Hokkaida a prostřednictvím investic do infrastruktury a zahraničního kapitálu podporuje rozvoj chladných oblastí ruského Dálného východu." # todo: NEW TRANSLATION
 JAP_sov_saakhalin: "Sachalin II" # todo: NEW TRANSLATION
 JAP_sov_saakhalin_desc: "Pro zajištění stabilního přístupu k fosilním palivům Japonsko ve spolupráci s Ruskem posiluje zahraniční investice do energetického projektu Sachalin II." # todo: NEW TRANSLATION
 JAP_sov_logistics_corridor: "Japonsko-evropský logistický koridor" # todo: NEW TRANSLATION
 JAP_sov_logistics_corridor_desc: "Vybudujeme pozemní logistický koridor spojující Japonsko s Evropou přes Rusko. Využitím ruských železnic a dálnic chceme zkrátit přepravní dobu a zajistit stabilní přístup na evropské trhy." # todo: NEW TRANSLATION
 JAP_sov_it_corridor: "Ruský digitální koridor" # todo: NEW TRANSLATION
 JAP_sov_it_corridor_desc: "Ve spolupráci s japonskými IT firmami bude v Rusku vybudována infrastruktura, jako jsou datová centra a optické kabely, čímž vznikne digitální obchodní síť spojující Evropu, Střední Asii a Rusko." # todo: NEW TRANSLATION
 JAP_sov_kuril_islands: "Řízení sporu o Severní teritoria" # todo: NEW TRANSLATION
 JAP_sov_kuril_islands_desc: "Otázka Severních teritorií zůstává nevyřešeným problémem, který se dotýká samotných základů japonsko-ruských vztahů. Při pevném zachování postoje naší země vytvoříme rámec pro diplomatická jednání a praktické konzultace, abychom zabránili upevnění konfrontace. Při pečlivém řízení vztahů s Ruskem zrušíme omezení jednání o otázce Severních teritorií." # todo: NEW TRANSLATION
 JAP_defensive_foundations: "Obranné základy" # todo: NEW TRANSLATION
 JAP_defensive_foundations_desc: "Japonsko posiluje základní obranné postavení Sil sebeobrany a soustředí se na ochranu vlasti, reakci na krize a odstrašení, přičemž zůstává v mezích přísně obranného výkladu článku 9." # todo: NEW TRANSLATION
 JAP_jgsdf: "Posílit JGSDF" # todo: NEW TRANSLATION
 JAP_jgsdf_desc: "Japonské pozemní síly sebeobrany zvyšují své obranné schopnosti zlepšením mobility, výcviku a připravenosti. Tato opatření zajistí, že síly zůstanou schopné chránit vlast při přísném dodržování stávajících právních a strategických omezení." # todo: NEW TRANSLATION
 JAP_type_x_mbt: "Zařadit hlavní bojový tank typu 10" # todo: NEW TRANSLATION
 JAP_type_x_mbt_desc: "Typ 10 představuje skok ve vývoji japonských obrněných vozidel: je lehčí, rychlejší a navržený přímo pro rychlé nasazení v náročném terénu Japonska. Rozšířením výroby a výcvikem posádek tohoto pokročilého stroje JGSDF posílí schopnost rychle reagovat na domácí hrozby." # todo: NEW TRANSLATION
 JAP_type_manouvre_combat_vehicle: "Manévrovací bojové vozidlo typu 16" # todo: NEW TRANSLATION
 JAP_type_manouvre_combat_vehicle_desc: "Manévrovací bojové vozidlo typu 16 poskytuje rychlým zásahovým jednotkám vysoce mobilní palebnou sílu. Jeho kolová konstrukce umožňuje JGSDF rychle přesouvat jednotky po celém souostroví a posilovat odlehlé oblasti bez závislosti na logistice těžkého obrnění." # todo: NEW TRANSLATION
 JAP_wheeled_howitzer: "Kolová houfnice typu 19" # todo: NEW TRANSLATION
 JAP_wheeled_howitzer_desc: "Nová generace mobilního dělostřelectva, typ 19, kombinuje moderní systémy řízení palby se schopností rychlého přesunu. Kolový podvozek umožňuje pružnou podporu obranných operací napříč rozptýlenou a hornatou geografií Japonska." # todo: NEW TRANSLATION
 JAP_chu_sam: "Rozšířit síť Chu-SAM typu 03" # todo: NEW TRANSLATION
 JAP_chu_sam_desc: "Japonsko posiluje svou protivzdušnou obranu dalšími bateriemi Chu-SAM typu 03. Tyto moderní raketové systémy středního dosahu zvyšují ochranu před narušením vzdušného prostoru a bezproblémově se začleňují do národní infrastruktury včasného varování a sledování." # todo: NEW TRANSLATION
 JAP_type_atgm: "Modernizovat pěchotní protitankové raketové jednotky" # todo: NEW TRANSLATION
 JAP_type_atgm_desc: "JGSDF vybaví pěchotní a průzkumné jednotky zdokonalenými protitankovými řízenými střelami včetně aktualizovaných modelů typu 01 a typu 96. Tato modernizace zajistí, že pozemní síly zůstanou schopné čelit moderním obrněným hrozbám při jakémkoli obranném střetnutí." # todo: NEW TRANSLATION
 JAP_central_readiness_force: "Rozšířit Ústřední síly rychlé reakce" # todo: NEW TRANSLATION
 JAP_central_readiness_force_desc: "Ústřední síly rychlé reakce budou rozvinuty v pružné a rychle nasaditelné velitelství schopné reagovat na mimořádné události kdekoli v Japonsku. Zlepšením společného výcviku, mobility a koordinace s regionálními armádami zajistíme, že pozemní jednotky budou moci v krátké době posílit kritické oblasti." # todo: NEW TRANSLATION
 JAP_civil_protection_act: "Zavést rámec civilní ochrany" # todo: NEW TRANSLATION
 JAP_civil_protection_act_desc: "Nová opatření civilní ochrany formalizují spolupráci mezi Silami sebeobrany, místními úřady, policií a záchrannými službami. Jasné právní postupy pro evakuace, reakci na krize a ochranu infrastruktury posílí schopnost Japonska chránit obyvatelstvo při katastrofách i bezpečnostních incidentech." # todo: NEW TRANSLATION
 JAP_seismic_retrofitting: "Národní program seizmického zpevňování" # todo: NEW TRANSLATION
 JAP_seismic_retrofitting_desc: "Zákon o stavebních standardech z roku 1981 stanovuje minimum, nikoli maximum, a dvě třetiny bytového fondu jsou starší. Národní program zpevňování postupuje region po regionu a financuje izolaci základů nemocnic a radnic, smykové stěny a zesílení sloupů škol i ocelové výztuhy vyvýšených dálnic, které se tak dramaticky zřítily v Kóbe. Výstavba je všude, kde zasahují inspektoři, pomalejší a dražší, ale zpevněný region přečká velké otřesy s neporušenou infrastrukturou." # todo: NEW TRANSLATION
 JAP_seismic_retrofit_tt: "£trigger_yes §YBudovy odolné proti zemětřesení§!" # todo: NEW TRANSLATION
 JAP_maritime_self_defence_force: "Posílit Japonské námořní síly sebeobrany" # todo: NEW TRANSLATION
 JAP_maritime_self_defence_force_desc: "Japonské námořní síly sebeobrany budou posíleny lepším výcvikem, údržbou a podpůrnými strukturami, aby mohly udržovat intenzivní operace na moři. Rozšířením eskortních skupin, hlídkových kapacit a námořní logistiky může Japonsko lépe chránit životně důležité námořní trasy a pobřežní vody." # todo: NEW TRANSLATION
 JAP_amphibious_rapid_deployment: "Vybudovat brigádu rychlého obojživelného nasazení" # todo: NEW TRANSLATION
 JAP_amphibious_rapid_deployment_desc: "Vzniká specializovaná obojživelná formace rychlého nasazení pro reakci na krize na odlehlých japonských ostrovech. Tato brigáda kombinuje pěchotu, obrněná vozidla a námořní přepravu a cvičí se k posilování, zabezpečení a v případě potřeby i znovudobytí klíčových území podél japonské námořní hranice." # todo: NEW TRANSLATION
 JAP_atago_destroyer: "Zařadit pokročilé torpédoborce Aegis" # todo: NEW TRANSLATION
 JAP_atago_destroyer_desc: "Do služby vstupují nové torpédoborce vybavené systémem Aegis, které poskytují silné schopnosti protivzdušné a protiponorkové obrany i velení. Tyto pokročilé eskortní lodě tvoří jádro moderního japonského hladinového loďstva a výrazně posilují ochranu flotily i regionální odstrašení." # todo: NEW TRANSLATION
 JAP_keen_sword_operation: "Rozšířit společná cvičení Keen Sword" # todo: NEW TRANSLATION
 JAP_keen_sword_operation_desc: "Série cvičení Keen Sword bude rozšířena o složitější námořní, letecké a pozemní prvky. Pravidelná rozsáhlá cvičení se spojeneckými silami zlepší interoperabilitu, společné velení a řízení a prokáží připravenost Japonska účinně působit v napadeném regionálním prostředí." # todo: NEW TRANSLATION
 JAP_f2_multirole_defensive_enhancement: "Zdokonalit víceúčelovou flotilu F-2" # todo: NEW TRANSLATION
 JAP_f2_multirole_defensive_enhancement_desc: "Flotila F-2 obdrží modernizovanou avioniku, senzory a zbraňové systémy pro zlepšení protivzdušné obrany a úderů proti námořním cílům v blízkých vodách. Tato vylepšení umožní letounům účinněji reagovat na regionální hrozby při zachování převážně obranného poslání." # todo: NEW TRANSLATION
 JAP_f15_defensive_updat_programe: "Program obranné modernizace F-15" # todo: NEW TRANSLATION
 JAP_f15_defensive_updat_programe_desc: "Japonské stíhačky vzdušné převahy F-15 projdou komplexní modernizací včetně moderních radarů, systémů elektronického boje a zdokonalených střel vzduch-vzduch. Modernizovaná flotila výrazně posílí schopnost Japonska chránit vlastní vzdušný prostor před stále schopnějšími protivníky." # todo: NEW TRANSLATION
 JAP_hyuga_class: "Nasadit vrtulníkové torpédoborce třídy Hyūga" # todo: NEW TRANSLATION
 JAP_hyuga_class_desc: "Vrtulníkové torpédoborce třídy Hyūga vstoupí do plného operačního nasazení jako velitelská plavidla a platformy pro protiponorkový boj. Jejich schopnost koordinovat eskortní skupiny a provozovat několik vrtulníků výrazně zlepší ochranu flotily a námořní situační povědomí." # todo: NEW TRANSLATION
 JAP_p_maritime_patrol: "Rozšířit námořní hlídkové letectvo" # todo: NEW TRANSLATION
 JAP_p_maritime_patrol_desc: "Japonsko investuje do moderních námořních hlídkových letounů pro sledování námořních tras, vyhledávání ponorek a podporu pátracích a záchranných operací. Lepší hlídkové pokrytí souostroví posílí národní bezpečnost i bezpečnost námořní dopravy." # todo: NEW TRANSLATION
 JAP_deploy_ballistic_warning_radars: "Rozmístit radary varování před balistickými střelami" # todo: NEW TRANSLATION
 JAP_deploy_ballistic_warning_radars_desc: "Budou instalovány nové dálkové radary včasného varování k odhalování a sledování odpálení balistických střel v regionu. Začleněním těchto senzorů do národní velitelské sítě získá Japonsko cenné minuty k vyhodnocení hrozeb, varování obyvatelstva a koordinaci obranné reakce." # todo: NEW TRANSLATION
 JAP_modernize_jadge: "Modernizovat síť protivzdušné obrany JADGE" # todo: NEW TRANSLATION
 JAP_modernize_jadge_desc: "Systém Japan Aerospace Defense Ground Environment (JADGE) bude modernizován lepšími datovými spoji, vyšší kapacitou zpracování a integrací s námořními a pozemními senzory. Modernizovaná síť JADGE umožní rychlejší rozhodování a efektivnější nasazení prostředků protivzdušné obrany." # todo: NEW TRANSLATION
 JAP_air_self_defence_force: "Posílit Japonské vzdušné síly sebeobrany" # todo: NEW TRANSLATION
 JAP_air_self_defence_force_desc: "Japonské vzdušné síly sebeobrany rozšíří výcvikové programy, infrastrukturu základen a podpůrné jednotky, aby zvládly vyšší operační tempo. Tato zlepšení zajistí schopnost Japonska udržovat nepřetržité vzdušné hlídky, rychlé starty a složitá společná cvičení v náročnějším regionálním vzdušném prostředí." # todo: NEW TRANSLATION
 JAP_article_nine_transition_comittee: "Zřídit Výbor pro přechod obrany" # todo: NEW TRANSLATION
 JAP_article_nine_transition_comittee_desc: "Vzniká zvláštní výbor, který bude koordinovat přechod Japonska k modernizovanému postoji národní obrany. Spojením tvůrců politik, vojenských plánovačů a právních expertů může Japonsko řídit přesun odpovědností a zajistit stabilní a dobře organizovanou transformaci." # todo: NEW TRANSLATION
 JAP_article_nine_transition_comittee_tt: "§GModifikátor rovnováhy sil článku 9 se již nebude moci měnit na základě úrovně výkladu. Tím se zpřístupní národní zaměření, která článek 9 zcela odstraní§!" # todo: NEW TRANSLATION
 JAP_news.04.t: "Japonsko se chystá opustit článek 9" # todo: NEW TRANSLATION
 JAP_news.04.d: "Diet obdržel závěrečnou zprávu Výboru pro přechod obrany a Japonsko tím učinilo rozhodný krok pryč od článku 9 své poválečné ústavy. Po desetiletí se ustanovení zříkající se války a udržování válečného potenciálu spravovalo postupnými reinterpretacemi namísto změny ústavy: Síly sebeobrany byly prohlášeny za ústavní jako minimální nezbytná schopnost, zahraniční nasazení bylo ospravedlňováno jako podpora rekonstrukce a logistiky a zákaz kolektivní sebeobrany byl zužován, dokud nebylo možné za omezených podmínek bránit spojenecké lodě a letadla. Výbor dospěl k závěru, že tento nahromaděný soubor výkladů již nelze natahovat tak, aby pokryl bezpečnostní požadavky Japonska, a že omezení je třeba odložit, nikoli znovu přeformulovat.\n\nPraktické důsledky jsou okamžité. Omezení velikosti a složení japonských formací mizí, Síly sebeobrany mohou plánovat operace i mimo obranu domácích ostrovů a Tokio znovu získává svrchované nástroje války a vedení aliancí, které považuje za samozřejmé každá jiná velmoc. Japonští představitelé zdůrazňují kontinuitu a popisují změnu jako formální uznání práv normální země, nikoli jako přerušení sedmdesáti let zdrženlivosti. V Pekingu, Soulu a Pchjongjangu je výklad velmi odlišný a Washington nyní zjistil, že je spojencem partnera schopného mnohem více než poskytovat základny a týlovou podporu. Ať převládne jakýkoli výklad, bezpečnostní architektura východní Asie byla během jediného odpoledne v Dietu přepsána." # todo: NEW TRANSLATION
 JAP_news.04.a: "Pacifistická éra v Tokiu skončila." # todo: NEW TRANSLATION
 JAP_secure_public_support: "Získat veřejnou podporu reformě obrany" # todo: NEW TRANSLATION
 JAP_secure_public_support_desc: "Celostátní kampaň vysvětlí vývoj japonské obranné politiky, reaguje na obavy veřejnosti a vybuduje důvěru v nový bezpečnostní postoj. Široká podpora společnosti zajistí politickou stabilitu a omezí tření během přechodu." # todo: NEW TRANSLATION
 JAP_modernize_joint_command: "Modernizovat struktury společného velení" # todo: NEW TRANSLATION
 JAP_modernize_joint_command_desc: "Ozbrojené síly začlení své operační velení do jednotné společné struktury a zlepší interoperabilitu i připravenost. Moderní společné plánování a sdílené výcvikové standardy umožní účinnější reakce na složité bezpečnostní scénáře." # todo: NEW TRANSLATION
 JAP_normalize_defense_procurement: "Normalizovat systémy obranných nákupů" # todo: NEW TRANSLATION
 JAP_normalize_defense_procurement_desc: "Japonsko zjednoduší obranné nákupy, rozšíří průmyslovou kapacitu a posílí koordinaci s domácími výrobci. Transparentní a modernizované nákupní procesy zajistí efektivní a udržitelné dodávky klíčových obranných projektů." # todo: NEW TRANSLATION
 JAP_formalize_national_defense: "Formalizovat schopnosti národní obrany" # todo: NEW TRANSLATION
 JAP_formalize_national_defense_desc: "Japonsko oficiálně kodifikuje rozšířené obranné odpovědnosti a vyjasní role, mise i dlouhodobé strategické cíle. Po dokončení přechodu budou ozbrojené síly působit pod jednotnou vizí určenou k ochraně národních zájmů ve stále složitějším regionálním prostředí." # todo: NEW TRANSLATION
 JAP_normalize_defense_procurement_done: "Obranné nákupy normalizovány" # todo: NEW TRANSLATION
 JAP_modernize_joint_command_done: "Modernizace společného velení dokončena" # todo: NEW TRANSLATION
 JAP_consolidate_national_defense_framework_done: "Rámec národní obrany sjednocen" # todo: NEW TRANSLATION
 JAP_rebuild_blue_water_navy: "Obnovit oceánské námořnictvo" # todo: NEW TRANSLATION
 JAP_rebuild_blue_water_navy_desc: "Japonsko připraví flotilu na dlouhodobé operace daleko za domácími vodami a rozšíří logistiku, kapacitu doplňování zásob i síly dálkového doprovodu. Obnovené oceánské námořnictvo umožní Japonsku chránit námořní trasy, podporovat partnery a reagovat na krize v širším regionu." # todo: NEW TRANSLATION
 JAP_carrier_aviation_tt: "[JAP_carrier_aviation_idea_desc]\n" # todo: NEW TRANSLATION
 JAP_carrier_aviation_development: "Program rozvoje palubního letectva" # todo: NEW TRANSLATION
 JAP_carrier_aviation_development_desc: "Bude zahájen zvláštní program rozvoje letectva schopného působit z letadlových lodí, který spojí námořní stíhačky, provoz na palubě a specializovaný výcvik. Vybudování věrohodného palubního letectva dramaticky zvýší dosah a pružnost flotily při odstrašení i bojových operacích." # todo: NEW TRANSLATION
 JAP_submarine_modernization_project: "Projekt modernizace ponorek" # todo: NEW TRANSLATION
 JAP_submarine_modernization_project_desc: "Japonsko modernizuje ponorkovou flotilu tiššími trupy, pokročilými senzory a moderními zbraněmi. Nová generace útočných ponorek posílí podmořské odstrašení, schopnost odepřít kontrolu nad mořem a možnost do hloubky sledovat sporné vody." # todo: NEW TRANSLATION
 JAP_expand_multi_role_destroyer_fleet: "Rozšířit flotilu víceúčelových torpédoborců" # todo: NEW TRANSLATION
 JAP_expand_multi_role_destroyer_fleet_desc: "Do služby budou zařazeny další víceúčelové torpédoborce, které na jediné pružné platformě poskytnou protivzdušnou obranu, protiponorkový boj a úderné schopnosti proti hladinovým cílům. Tyto eskortní lodě vytvoří páteř rozšířených japonských operačních svazů na moři." # todo: NEW TRANSLATION
 JAP_establish_joint_rapid_deployment_command: "Zřídit společné velitelství rychlého nasazení" # todo: NEW TRANSLATION
 JAP_establish_joint_rapid_deployment_command_desc: "Vznikne společné velitelství pro koordinaci rychle nasaditelných pozemních, leteckých a námořních prvků. Díky jednotnému plánování a předem připraveným krizovým reakcím získá Japonsko sílu schopnou rychle reagovat na krize kdekoli ve svém širším strategickém prostředí." # todo: NEW TRANSLATION
 JAP_full_defense_industrial_mobilisation: "Plná mobilizace obranného průmyslu" # todo: NEW TRANSLATION
 JAP_full_defense_industrial_mobilisation_desc: "Japonsko sladí svou průmyslovou základnu, výzkumné instituce a logistické sítě s komplexním plánem obranné výroby. Standardizované nákupy, dlouhodobé smlouvy a rozšířená kapacita umožní trvalou výrobu lodí, vozidel, letadel a pokročilých zbraní." # todo: NEW TRANSLATION
 JAP_long_range_strike_missile_artillery_forces: "Síly dálkových úderů a raketového dělostřelectva" # todo: NEW TRANSLATION
 JAP_long_range_strike_missile_artillery_forces_desc: "Specializované raketové a dělostřelecké jednotky budou organizovány k provádění přesných úderů na dlouhou vzdálenost. Kombinací moderní munice s pokročilými systémy zaměřování a velení získá Japonsko schopnost ohrožovat vzdálené vojenské prostředky a klíčovou infrastrukturu." # todo: NEW TRANSLATION
 JAP_expand_mechanized_brigades: "Rozšířit mechanizované brigády" # todo: NEW TRANSLATION
 JAP_expand_mechanized_brigades_desc: "Stávající mechanizované formace budou posíleny a vzniknou nové brigády vybavené moderními bojovými vozidly pěchoty a podpůrnými obrněnými prostředky. Toto rozšíření zlepší mobilitu, ochranu a dlouhodobou bojovou schopnost pozemních sil." # todo: NEW TRANSLATION
 JAP_deploy_next_generation: "Nasadit bojové formace nové generace" # todo: NEW TRANSLATION
 JAP_deploy_next_generation_desc: "Bojové jednotky budou reorganizovány kolem vybavení nové generace, síťových velitelských systémů a doktríny kombinovaných zbraní. Tyto formace jsou navrženy pro rychlé nasazení, vysokou přežitelnost a účinné operace ve složitém prostředí vysoké intenzity." # todo: NEW TRANSLATION
 JAP_national_defense_professionalization: "Profesionalizace národní obrany" # todo: NEW TRANSLATION
 JAP_national_defense_professionalization_desc: "Japonsko investuje do profesionálního vojenského vzdělávání, kariérního rozvoje a moderních personálních systémů napříč všemi složkami. Schopnější, zkušenější a soudržnější sbor důstojníků a poddůstojníků zvýší připravenost, zlepší vedení a udrží dlouhodobou účinnost národních obranných sil." # todo: NEW TRANSLATION
 JAP_integrated_air_space_command: "Integrované letecké a vesmírné velení" # todo: NEW TRANSLATION
 JAP_integrated_air_space_command_desc: "Vznikne integrované letecké a vesmírné velení pro koordinaci protivzdušné obrany, včasného varování, satelitní podpory a sledování vesmíru. Spojením informací z pozemních radarů, vzdušných senzorů a orbitálních platforem získá Japonsko jasnější obraz bojiště a rychleji odpoví na nové hrozby." # todo: NEW TRANSLATION
 JAP_establish_long_range_strike_aviation: "Zřídit letectvo dálkových úderů" # todo: NEW TRANSLATION
 JAP_establish_long_range_strike_aviation_desc: "Budou vytvořeny specializované jednotky dálkového úderného letectva vybavené moderními letouny a zbraněmi odpalovanými z bezpečné vzdálenosti. Tyto síly umožní útočit na klíčové cíle ve velkých vzdálenostech a podpoří odstrašení i společné operace v širším regionu." # todo: NEW TRANSLATION
 JAP_mext_generation_air_dominance: "Vzdušná převaha nové generace" # todo: NEW TRANSLATION
 JAP_mext_generation_air_dominance_desc: "Japonsko urychlí vývoj stíhacího letounu nové generace pro vzdušnou převahu, který spojí stealth, pokročilé senzory a síťové bojové systémy. Program zajistí, aby letectvo dokázalo udržet převahu v stále spornějším vzdušném prostoru i v daleké budoucnosti." # todo: NEW TRANSLATION
 JAP_advanced_missile_development: "Ředitelství pokročilých raket" # todo: NEW TRANSLATION
 JAP_advanced_missile_development_desc: "Vznikne specializované ředitelství pro výzkum, testování a výrobu pokročilých raketových systémů. Od moderních střel vzduch-vzduch a protilodních zbraní po přesné údery na dlouhou vzdálenost tato iniciativa rozšíří japonský arzenál a zvýší účinnost všech složek." # todo: NEW TRANSLATION
 JAP_high_tech_domestic_manufacturing: "Domácí výroba špičkové obranné techniky" # todo: NEW TRANSLATION
 JAP_high_tech_domestic_manufacturing_desc: "Japonsko investuje do špičkové výroby avioniky, senzorů, kompozitních konstrukcí a pohonných systémů. Posílení domácích dodavatelských řetězců kritických komponent sníží závislost na zahraničních dodavatelích a podpoří rychlé modernizace leteckých a raketových platforem." # todo: NEW TRANSLATION
 JAP_establish_japan_defense_technology_agency: "Japonská agentura obranných technologií" # todo: NEW TRANSLATION
 JAP_establish_japan_defense_technology_agency_desc: "Vznikne centralizovaná agentura obranných technologií, která bude koordinovat výzkum, nákupy a inovace napříč průmyslem, akademickou sférou a ozbrojenými silami. Jednotný dohled urychlí vývoj, omezí duplicity a zajistí rychlý přenos slibných konceptů z laboratoře k jednotkám v první linii." # todo: NEW TRANSLATION
 JAP_atla_defense_technology_consolidation: "Konsolidace technologií ATLA" # todo: NEW TRANSLATION
 JAP_atla_defense_technology_consolidation_desc: "Agentura pro akvizice, technologie a logistiku získá ústřední roli v koordinaci výzkumu, vývoje a nákupů napříč všemi složkami ozbrojených sil. Konsolidací obranných technologických programů pod jedinou autoritou může Japonsko omezit duplicity, urychlit inovace a rychleji zavádět slibné projekty do služby." # todo: NEW TRANSLATION
 JAP_gifu_test_aerospace_development_center: "Gifu, testovací a letecké vývojové centrum" # todo: NEW TRANSLATION
 JAP_gifu_test_aerospace_development_center_desc: "Gifu bude rozvinuto v přední testovací a hodnoticí centrum pro letouny, avioniku a zbraňové systémy. Specializovaná polygonová pracoviště, přístrojově vybavený vzdušný prostor a technické týmy podpoří náročné zkoušky a zajistí důkladné ověření nových konstrukcí před jejich zařazením do první linie." # todo: NEW TRANSLATION
 JAP_aichi_nagoya_aerospace_defense_cluster: "Letecko-obranný klastr Aiči-Nagoja" # todo: NEW TRANSLATION
 JAP_aichi_nagoya_aerospace_defense_cluster_desc: "Oblast Aiči-Nagoja bude rozvíjena jako přední letecký a obranný výrobní klastr propojující velké výrobce, dodavatele a výzkumné ústavy. Soustředěné investice zvýší produkci draků, motorů a špičkových komponent pro vojenské i civilně-vojenské platformy." # todo: NEW TRANSLATION
 JAP_kobo_maritime_heavy_industry_corridor: "Koridor těžkého námořního průmyslu Kóbe" # todo: NEW TRANSLATION
 JAP_kobo_maritime_heavy_industry_corridor_desc: "Kóbe a okolní pobřežní města budou rozvinuta v souvislý koridor těžkého námořního průmyslu. Rozšířené loděnice, ocelárny a firmy námořního strojírenství poskytnou kapacitu pro stavbu a údržbu větší a schopnější flotily i její podpůrné infrastruktury." # todo: NEW TRANSLATION
 JAP_nagasaki_shipyard_defense: "Integrace nagasackých loděnic do obrany" # todo: NEW TRANSLATION
 JAP_nagasaki_shipyard_defense_desc: "Velké nagasacké loděnice budou hlouběji začleněny do plánování národní obrany a vyčlení další kapacitu pro eskortní, podpůrná a specializovaná námořní plavidla. Užší koordinace mezi loděnicemi a námořnictvem zkrátí dobu stavby a zlepší připravenost flotily." # todo: NEW TRANSLATION
 JAP_kure_naval_arsenal_revival: "Obnova námořního arzenálu v Kure" # todo: NEW TRANSLATION
 JAP_kure_naval_arsenal_revival_desc: "Historická námořní zařízení v Kure budou obnovena jako moderní komplex stavby a oprav lodí. Modernizovaná doky, dílny a logistická centra obnoví roli města jako klíčového střediska údržby, přestaveb a modernizací válečných lodí první linie." # todo: NEW TRANSLATION
 JAP_sasebo_fleet_support_complex: "Komplex podpory flotily v Sasebu" # todo: NEW TRANSLATION
 JAP_sasebo_fleet_support_complex_desc: "Sasebo bude rozšířeno v komplexní středisko podpory flotily s lepšími opravárenskými kapacitami, sklady munice a zásobovací infrastrukturou. Poloha v západním Japonsku z něj činí ideální centrum pro udržování operací v blízkých mořích a u klíčových námořních hrdel." # todo: NEW TRANSLATION
 JAP_yokosuka_dockyard_expansion: "Rozšíření loděnic v Jokosuce" # todo: NEW TRANSLATION
 JAP_yokosuka_dockyard_expansion_desc: "Jokosucké doky a související zařízení budou rozšířeny, aby zvládly více lodí a důkladnější cykly údržby. Jako jedna z hlavních japonských námořních základen zvýší rozšířená Jokosuka schopnost námořnictva udržovat velké hladinové bojové lodě připravené k nasazení." # todo: NEW TRANSLATION
 JAP_revitalize_defense_production: "Oživit základnu obranné výroby" # todo: NEW TRANSLATION
 JAP_revitalize_defense_production_desc: "Japonsko zahájí široké úsilí o oživení obranné průmyslové základny, podpoří klíčové výrobce, stabilizuje dlouhodobé smlouvy a modernizuje výrobní linky. Zdravější průmyslový základ umožní spolehlivě vybavit síly a rychleji se přizpůsobit novým operačním požadavkům." # todo: NEW TRANSLATION
 JAP_kaguya_starward_expedition: "Výprava Kaguya ke hvězdám" # todo: NEW TRANSLATION
 JAP_kaguya_starward_expedition_desc: "Japonsko inspirované příběhem princezny Kaguyi, která se v rouchu světla vrátila na Měsíc, zahájí ambiciózní průzkum blízkozemních asteroidů. Pokročilé robotické sondy a demonstrátory těžby budou vyslány do prázdnoty, promění legendu v technologii a položí základy budoucí těžby zdrojů mezi hvězdami." # todo: NEW TRANSLATION
 JAP_kaguya_starward_expedition_tt: "§YNaše mise na Měsíc bude zahájena!§!" # todo: NEW TRANSLATION
 JAP_tsukuyomi_lunar_program: "Měsíční program Tsukuyomi" # todo: NEW TRANSLATION
 JAP_tsukuyomi_lunar_program_desc: "Tento program, pojmenovaný po Tsukujomim, božstvu Měsíce z japonské mytologie, spojuje průmysl, výzkumné ústavy a kosmickou agenturu za dlouhodobým měsíčním úsilím. Orbitery, přistávací moduly a povrchová infrastruktura promění Měsíc ze vzdáleného symbolu v hmatatelnou základnu pro vědu, navigaci a dlouhodobé ambice Japonska jako vesmírné mocnosti." # todo: NEW TRANSLATION
 JAP_amaterasu_martian_dawn: "Marťanský úsvit Amaterasu" # todo: NEW TRANSLATION
 JAP_amaterasu_martian_dawn_desc: "Pod jménem Amaterasu, bohyně vycházejícího slunce, Japonsko zamíří k rudé planetě. Dálkové sondy, pokročilý pohon a průkopnický výzkum podpory života podpoří novou vlnu průzkumu Marsu. Každá mise posune hranice lidské vynalézavosti a promění vzdálenou záři Marsu v nový horizont japonské technologické civilizace." # todo: NEW TRANSLATION
 JAP_restore_imperial_household: "Obnovit císařský dvůr" # todo: NEW TRANSLATION
 JAP_restore_imperial_household_desc: "Císařský dvůr vystoupí z obřadnosti do národní správy a znovu získá institucionální kapacitu i formální dvorskou úlohu. Legitimita se přeskupí tak, aby podmínky určoval Chryzantémový trůn, nikoli aby je pouze potvrzoval. Každá frakce si nyní musí vybrat stranu." # todo: NEW TRANSLATION
 JAP_reinstate_former_imperial_houses: "Obnovit bývalé císařské rody" # todo: NEW TRANSLATION
 JAP_reinstate_former_imperial_houses_desc: "Bývalé knížecí rody budou obnoveny a jejich status navrácen, čímž se rozšíří počet větví oprávněných zdědit Trůn. Monarchisté to vítají jako ochranu nepřerušené linie, konstitucionalisté to odsuzují jako politické inženýrství. Nástupnictví bude zabezpečeno bez ohledu na výsledek sporu." # todo: NEW TRANSLATION
 JAP_male_line_succession_act: "Přijmout zákon o mužské linii nástupnictví" # todo: NEW TRANSLATION
 JAP_male_line_succession_act_desc: "Nejistota nástupnictví je stejně strategickou zranitelností jako domácí kontroverze. Kodifikujeme mužskou linii nástupnictví v zákoně, odstraníme nejasnosti a zajistíme dynastickou kontinuitu pro budoucí generace. Tento krok upevní podporu monarchistů, zároveň však vyvolá ostrý odpor reformátorů, kteří ho budou považovat za krok zpět od moderního Japonska." # todo: NEW TRANSLATION
 JAP_imperial_rites_restored: "Obnovit císařské obřady" # todo: NEW TRANSLATION
 JAP_imperial_rites_restored_desc: "Trůn bez rituálu je korunou bez váhy. Obnovíme císařské obřady jako státem uznávané ceremonie, znovu potvrdíme posvátné základy monarchie a kontinuitu národa. Tím spojíme moderní stát s dávnou legitimitou, ať už to politická třída schvaluje, nebo ne." # todo: NEW TRANSLATION
 JAP_recall_privy_council: "Obnovit Tajnou radu" # todo: NEW TRANSLATION
 JAP_recall_privy_council_desc: "Parlamentní politika se stala hlučnou, pomíjivou a stále více odtrženou od dlouhodobého státnictví. Obnovíme Tajnou radu jako stálý poradní orgán Trůnu, diskrétní, zkušený a loajální kontinuitě státu. Její návrat budou monarchisté vnímat jako stabilizační kotvu, zatímco odpůrci jako nevolená mocenská centra." # todo: NEW TRANSLATION
 JAP_imperial_reform_commission: "Zřídit císařskou reformní komisi" # todo: NEW TRANSLATION
 JAP_imperial_reform_commission_desc: "Obnova vyžaduje strukturu, nikoli improvizaci. Zřídíme Císařskou reformní komisi, která připraví právní a institucionální plán obnovené monarchie a sjednotí ministerstva, dvorské úřady a bezpečnostní složky pod jedinou státní doktrínu. Jakmile se komise sejde, promění symboliku v politiku a učiní ústup politicky nemožným." # todo: NEW TRANSLATION
 JAP_imperial_audience: "Uspořádat císařskou audienci" # todo: NEW TRANSLATION
 JAP_imperial_audience_desc: "Strany budou svolány nikoli jako rovné, ale jako prosebníci před Trůnem. Pečlivě zinscenovanou císařskou audiencí připoutáme vůdce frakcí k novému řádu, v němž volená politika slouží státu, místo aby mu velela. Má-li Chryzantémový trůn předsedat modernímu šógunátu, musí nejprve přimět politickou třídu sklonit se před jeho logikou." # todo: NEW TRANSLATION
 JAP_imperial_civic_oath: "Vyhlásit císařskou občanskou přísahu" # todo: NEW TRANSLATION
 JAP_imperial_civic_oath_desc: "Nový řád vyžaduje více než dekrety; vyžaduje společnou oddanost. Vyhlásíme císařskou občanskou přísahu, která připoutá úředníky, příslušníky ozbrojených sil a občanské instituce k Trůnu jako nejvyššímu zdroji legitimity. Tím proměníme loajalitu v zákon a nesouhlas v něco, co působí jako zrada." # todo: NEW TRANSLATION
 JAP_unified_intelligence_secretariat: "Vytvořit jednotný zpravodajský sekretariát" # todo: NEW TRANSLATION
 JAP_unified_intelligence_secretariat_desc: "Moderní šógunát nesmí být slepý. Sloučíme soupeřící služby do Jednotného zpravodajského sekretariátu, který bude podléhat jediné velitelské linii a chránit strategický obraz Trůnu. To přes noc zostří naše státnické schopnosti a zároveň dá soupeřům všechny důvody obávat se toho, co nyní dvůr ví." # todo: NEW TRANSLATION
 JAP_blue_water_navy: "Vybudovat oceánské námořnictvo" # todo: NEW TRANSLATION
 JAP_blue_water_navy_desc: "Osud Japonska je námořní a naše bezpečnost nemůže končit na obzoru. Vybudujeme skutečné oceánské námořnictvo schopné operovat daleko od domácích vod, chránit námořní trasy a promítat sílu tam, kde to vyžadují naše zájmy. S flotilou jako ocelovým nástrojem Trůnu se svět naučí měřit Japonsko podle brázdy, kterou za sebou zanechává." # todo: NEW TRANSLATION
 JAP_imperial_defense_council: "Vytvořit císařskou obrannou radu" # todo: NEW TRANSLATION
 JAP_imperial_defense_council_desc: "Strategii nelze ponechat volebním cyklům a soupeření ministerstev. Vytvoříme Císařskou obrannou radu, která sjednotí ozbrojené síly, zpravodajské vedení a klíčová ministerstva pod jedinou strategickou doktrínou zakotvenou v Trůnu. Jediným úderem se japonská bezpečnostní politika stane soudržnou a mnohem hůře sabotovatelnou frakcemi zevnitř." # todo: NEW TRANSLATION
 JAP_rare_earth_resilience: "Císařská strategická rezerva" # todo: NEW TRANSLATION
 JAP_rare_earth_resilience_desc: "Císařská vláda nařídí velkým obchodním domům zabezpečit zásobovací trasy a vytvořit zásoby ropy a strategických kovů pro případ války či embarga. Dvůr a ministerstva společně drží materiální tepny národa v důvěře pro korunu. Co císařská říše nemůže volně koupit, to nahromadí a zabezpečí vlastní rukou.\n-------------\nPokud již bylo dosaženo §Y$JAP_national_energy_security$§!, bude rezerva uložena na zabezpečených základech a poskytne §Gdvojnásobný§! přínos strategických kovů." # todo: NEW TRANSLATION
 JAP_national_shipbuilding_plan: "Program rozšíření císařské flotily" # todo: NEW TRANSLATION
 JAP_national_shipbuilding_plan_desc: "Trůn se nespokojí s pobřežní obranou; Japonsko bude velet mořím, která rozhodují o našem osudu. V rámci Programu rozšíření císařské flotily zvýšíme kapacitu loděnic, uzavřeme dlouhodobé námořní zakázky a zavedeme nepřetržitý výrobní cyklus od položení kýlu po zařazení do služby. Jakmile bude plán probíhat, naši soupeři již nebudou diskutovat o záměrech Japonska. Budou počítat naše trupy." # todo: NEW TRANSLATION
 JAP_imperial_war_cabinet: "Svolat císařský válečný kabinet" # todo: NEW TRANSLATION
 JAP_imperial_war_cabinet_desc: "V dobách krize nemůže být Japonsko řízeno odklady, výbory a stranickým vyjednáváním. Svoláme císařský válečný kabinet, centralizujeme velitelskou pravomoc a připoutáme politické vedení k jediné strategické linii pod mandátem Trůnu. Od této chvíle bude stát jednat jedním hlasem, a tím hlasem bude hlas císaře." # todo: NEW TRANSLATION
 JAP_russian_lost_territories: "Znovu získat Severní teritoria" # todo: NEW TRANSLATION
 JAP_russian_lost_territories_desc: "Japonsko prosazuje svůj nárok na ostrovy a vody držené Ruskem jako svrchovaný požadavek podpořený skutečnou pákou, nikoli diplomatickou formalitou. Pokud Moskva odmítne, Japonsko se bude muset rozhodnout, jak daleko je připraveno zajít. Sever nezůstane uzavřený za smlouvami a tichem." # todo: NEW TRANSLATION
 JAP_fight_china_again: "Drak a chryzantéma" # todo: NEW TRANSLATION
 JAP_fight_china_again_desc: "Starý konflikt nebyl nikdy skutečně vyřešen, pouze odložen smlouvami a proměnlivou rovnováhou. Připravíme národ na další střet s Čínou a sjednotíme průmysl, ozbrojené síly i vůli veřejnosti k válce, která rozhodne o budoucnosti regionu. Tentokrát nebude Japonsko bojovat jen o přežití, ale o řád, který přijde poté." # todo: NEW TRANSLATION
 JAP_reclaim_pacific_rim: "Prosadit náš pacifický mandát" # todo: NEW TRANSLATION
 JAP_reclaim_pacific_rim_desc: "Japonská prosperita a bezpečnost jsou vepsány do Pacifiku, od námořních tras přes ostrovní řetězce až po vzdálená hrdla. Prosadíme pacifický mandát, který chápe námořní vliv jako státní politiku podpořenou přítomností flotily, přístupem k základnám a hospodářskou pákou. Éra, kdy mapu kreslili jiní, skončila; Japonsko ji bude utvářet." # todo: NEW TRANSLATION
 JAP_office_for_colonialism: "Obnovit Daitōa-šó" # todo: NEW TRANSLATION
 JAP_office_for_colonialism_desc: "Říše bez správy je dobytím, které se zhroutí vlastní vahou. Obnovíme Daitōa-šó, aby koordinoval zámořskou správu, bezpečnostní ujednání a hospodářskou integraci pod jedinou císařskou doktrínou. S jediným ministerstvem řídícím sféru už nebude japonský vliv improvizovaný; bude řízen, rozšiřován a vynucován." # todo: NEW TRANSLATION
 JAP_office_for_colonialism_tt: "Odemkne okupační zákon v asijských státech:\n" # todo: NEW TRANSLATION
 JAP_reclaim_south_chinese_sea: "Velet jižním mořím" # todo: NEW TRANSLATION
 JAP_reclaim_south_chinese_sea_desc: "Jihočínské moře je tepnou Asie a kdo je ovládá, řídí tok obchodu, paliva a moci. Obnovíme v těchto vodách převahu a vytvoříme přítomnost, základny i námořní sílu schopnou vnutit naši vůli každému vyzyvateli. Japonsko o přístup žádat nebude, zaručí ho silou." # todo: NEW TRANSLATION
 JAP_reclaim_indochina: "Vrátit se do Indočíny" # todo: NEW TRANSLATION
 JAP_reclaim_indochina_desc: "Indočína leží na křižovatce jihovýchodní Asie, kde přístavy, zdroje a námořní trasy rozhodují o regionální rovnováze. Vrátíme se s nátlakem, silou a politickým inženýrstvím, abychom tato území znovu přivedli pod japonské strategické vedení. Jakmile bude jižní křídlo naší námořní sféry zajištěno, spočine na trvalém vlivu." # todo: NEW TRANSLATION
 JAP_reclaim_australia: "Jižní kotva" # todo: NEW TRANSLATION
 JAP_reclaim_australia_desc: "Austrálie je klíčem jižního Pacifiku, kontinentem schopným hostit flotily, letectvo i logistiku rozhodující dlouhé války. Přivedeme ji pod japonskou strategickou kontrolu nikoli jako nájezd či gesto, ale jako trvalou kotvu naší námořní sféry. Pokud zajistíme jih, Pacifik se stane japonským jezerem." # todo: NEW TRANSLATION
 JAP_reclaim_myanmar: "Zajistit iravádskou bránu" # todo: NEW TRANSLATION
 JAP_reclaim_myanmar_desc: "Myanmar je pozemním mostem mezi jižní a jihovýchodní Asií a ovládá trasy spojující Bengálský záliv se srdcem regionu. Znovu jej získáme silou a politickým tlakem a proměníme jeho přístavy, letiště a koridory v prostředky širší japonské sféry. Jakmile bude iravádská brána zajištěna, naše jižní křídlo bude mnohem obtížněji napadnutelné." # todo: NEW TRANSLATION
 JAP_reclaim_the_pacific: "Oceán jako naše hranice" # todo: NEW TRANSLATION
 JAP_reclaim_the_pacific_desc: "Pacifik není vzdálená pustina, ale hranice rozhodující o přežití a velikosti Japonska. Znovu jej získáme přítomností flotily, ostrovními opěrnými body a vůlí vnutit námořní řád utvářený v Tokiu. Jakmile se oceán stane naší hranicí, každý soupeř bude nucen působit v našem stínu." # todo: NEW TRANSLATION
 JAP_reclaim_north_korea: "Připoutat sever k Tokiu" # todo: NEW TRANSLATION
 JAP_reclaim_north_korea_desc: "Vynutíme urovnání, které Pchjongjangu odejme strategickou autonomii a podřídí jeho zahraniční politiku japonskému dohledu. Řízeným přístupem, bezpečnostními zárukami a tvrdou pákou nad zdroji a obnovou proměníme Sever v závislé nárazníkové území místo nepředvídatelné hrozby. Je to nadvláda bez iluzí a stabilita vynucená záměrem." # todo: NEW TRANSLATION
 JAP_reclaim_south_korea: "Uvalit rámec protektorátu" # todo: NEW TRANSLATION
 JAP_reclaim_south_korea_desc: "Překročíme rámec vlivu a vytvoříme protektorátní uspořádání, které připoutá korejskou zahraniční a bezpečnostní politiku ke směru Tokia. Prostřednictvím kontrolovaných dohod, poradců a vlivu na klíčové instituce bude Korea donucena k podřízenému postavení bez nutnosti otevřené anexe. Je to moderní říše vystavěná na papírech, tlaku a trvalosti." # todo: NEW TRANSLATION
 JAP_reclaim_taiwan: "Zřídit tchajwanský protektorát" # todo: NEW TRANSLATION
 JAP_reclaim_taiwan_desc: "Přejdeme od vlivu ke kontrole a uvalíme protektorátní rámec, který připoutá tchajwanskou obrannou a zahraniční politiku ke směru Tokia. Prostřednictvím záruk, práv k základnám a institucionální páky bude ostrov zabezpečen jako loajální námořní bašta bez otevřené anexe. Jde o moderní císařské uspořádání vynucované námořní silou a politickým tlakem." # todo: NEW TRANSLATION
 JAP_basic_reconstruction_policy: "Obnova" # todo: NEW TRANSLATION
 JAP_basic_reconstruction_policy_desc: "Po bezprecedentní zkáze způsobené Velkým východojaponským zemětřesením musí vláda stanovit základní politiku obnovy. Předložení národního rámce pro obnovení živobytí, rekonstrukci infrastruktury a oživení průmyslu bude prvním krokem k obnovení důvěry veřejnosti a stabilizaci společnosti." # todo: NEW TRANSLATION
 JAP_tohoku_infrastructure: "Obnovit infrastrukturu Tóhoku" # todo: NEW TRANSLATION
 JAP_tohoku_infrastructure_desc: "Zemětřesení a cunami katastrofálně poškodily dopravní sítě a životně důležitou infrastrukturu Tóhóku. Obnova silnic, železnic a přístavů je prvním krokem k obnově místních komunit a rozvoji regionu. Přestože si úsilí vyžádá obrovské náklady a čas, nelze je odkládat." # todo: NEW TRANSLATION
 JAP_fishery_revival: "Obnova zemědělství a rybolovu" # todo: NEW TRANSLATION
 JAP_fishery_revival_desc: "Cunami zničilo rybářské přístavy a zemědělskou půdu Tóhóku a připravilo o živobytí nespočet lidí. Obnova těchto odvětví vrátí regionu hospodářskou základnu a zajistí stabilní zásobování potravinami. Toto úsilí je zásadní pro místní obnovu i národní bezpečnost." # todo: NEW TRANSLATION
 JAP_tohoku_port: "Obnovit funkce přístavů Tóhóku" # todo: NEW TRANSLATION
 JAP_tohoku_port_desc: "Cunami ochromilo přístavní zařízení a loděnice a zastavilo logistiku i námořní obchod. Rekonstrukce oživí regionální průmysl a znovu otevře klíčové domácí i mezinárodní trasy. Obnovení těchto bran je nezbytné pro širší hospodářskou obnovu Japonska." # todo: NEW TRANSLATION
 JAP_power_supply: "Stabilizace dodávek elektřiny" # todo: NEW TRANSLATION
 JAP_power_supply_desc: "Katastrofa poškodila mnoho energetických zařízení a přenosových sítí a vytvořila vážný nedostatek elektřiny. Musíme rychle rozšířit alternativní zdroje a posílit síť, abychom zajistili stabilitu občanů i průmyslu." # todo: NEW TRANSLATION
 JAP_kanto_infrastructure: "Obnovit infrastrukturu Kantó" # todo: NEW TRANSLATION
 JAP_kanto_infrastructure_desc: "Katastrofa vážně poškodila oblast Kantó, zejména její severní část, narušila dopravní sítě a ochromila městské funkce. Obnova infrastruktury podporující hlavní městskou oblast je zásadní pro oživení hospodářské činnosti a udržení národní stability. Rychlá a dobře naplánovaná rekonstrukce je nezbytná." # todo: NEW TRANSLATION
 JAP_reconstruction_agency: "Zřídit Agenturu pro obnovu" # todo: NEW TRANSLATION
 JAP_reconstruction_agency_desc: "Pro urychlení a koordinaci obnovy po katastrofě vláda zřídí Agenturu pro obnovu. Tento specializovaný orgán sjednotí úsilí ústředních a místních úřadů a zajistí účinné provádění plánů obnovy." # todo: NEW TRANSLATION
 JAP_industrial_recovery: "Obnovit průmyslovou základnu" # todo: NEW TRANSLATION
 JAP_industrial_recovery_desc: "Katastrofa vážně poškodila továrny a průmyslová zařízení. Obnovou průmyslové základny můžeme obnovit zaměstnanost a urychlit oživení ekonomiky." # todo: NEW TRANSLATION
 JAP_funding_local_governments: "Podpora postižených samospráv" # todo: NEW TRANSLATION
 JAP_funding_local_governments_desc: "Poskytnout finanční prostředky místním samosprávám v postižených oblastech na podporu obnovy, obnovení živobytí a zachování veřejných služeb." # todo: NEW TRANSLATION
 JAP_housing_reconstruction: "Obnova bydlení pro oběti" # todo: NEW TRANSLATION
 JAP_housing_reconstruction_desc: "Urychlit výstavbu dočasných domovů a dlouhodobých obytných čtvrtí, vystěhovat vysídlené rodiny z nouzových přístřeší a dát městům jasné plány trvalého přesídlení." # todo: NEW TRANSLATION
 JAP_reconstruction_completed_focus: "Obnova dokončena" # todo: NEW TRANSLATION
 JAP_reconstruction_completed_focus_desc: "Označit přechod od nouzové obnovy k dlouhodobému oživení napříč Tóhokem. Základní infrastruktura je obnovena, průmysl znovu funguje a města začínají přecházet od přežití k růstu." # todo: NEW TRANSLATION
 JAP_trilateral_anti_north_korea_training: "Trojstranná připravenost poloostrova" # todo: NEW TRANSLATION
 JAP_trilateral_anti_north_korea_training_desc: "Pravidelná společná cvičení s Jižní Koreou a Spojenými státy vytvořila společný plán reakce na krize na poloostrově. Interoperabilní velitelské postupy, společná letecká a námořní cvičení i koordinované postupy protiraketové obrany zajistí, že každá provokace Pchjongjangu narazí na rychlou, jednotnou a věrohodnou odpověď." # todo: NEW TRANSLATION
 JAP_improvement_private_investment_climate_idea: "Zlepšit prostředí pro soukromé investice" # todo: NEW TRANSLATION
 JAP_improvement_private_investment_climate_idea_desc: "Samotné vládní výdaje obnovu nedokončí. Firmám je třeba vrátit důvěru k investování a snížit nejistotu ohledně budoucnosti. Trvalé oživení vyžaduje, aby podniky přešly od obrany zpět k expanzi." # todo: NEW TRANSLATION
 JAP_dprk_policy_idea: "Pronikání japonské politiky" # todo: NEW TRANSLATION
 JAP_dprk_policy_idea_desc: "Nová politika Tokia vůči Koreji otevřela kanály, které dříve neexistovaly. Prostřednictvím diplomatických kontaktů, zákulisních prostředníků, hospodářské páky a rozvoje zpravodajských vazeb získalo Japonsko dočasné okno k rozšíření svého vlivu uvnitř politického prostředí Severní Koreje. Otevření je křehké a sporné, avšak japonský tlak a přítomnost mají nyní v Pchjongjangu větší váhu než dříve." # todo: NEW TRANSLATION
 JAP_demographic_pressure_modifier: "Demografický tlak" # todo: NEW TRANSLATION
 JAP_demographic_pressure_modifier_desc: "Japonsko je jednou z nejstarších a nejrychleji se zmenšujících společností na světě, kde počet úmrtí převyšuje počet narození a populace v produktivním věku prudce klesá. Tato krize zatěžuje pracovní sílu udržující výrobu, tlačí rozpočty sociálního zabezpečení a zdravotnictví na hranici možností, oslabuje fiskální stabilitu a testuje společenskou soudržnost. V šesti oblastech (populace, pracovní síla, stabilita, nezaměstnanost, zdravotní náklady a sociální náklady) čelí Japonsko propojeným tlakům. Trvalé a mnohostranné reformy prorodinné, zaměstnanecké a imigrační politiky mohou tato břemena zmírnit a nasměrovat národ ke stabilní či rostoucí populaci." # todo: NEW TRANSLATION
 JAP_economy_modifier: "Japonská ekonomika" # todo: NEW TRANSLATION
 JAP_economy_modifier_desc: "Společný motor hospodářské obnovy Japonska. Jak se po sobě jdoucí vlády vyrovnávají s demografickým úpadkem a rostoucí konkurencí Koreje, Číny a Tchaj-wanu, reforma zasahuje každý pilíř ekonomiky: pole a rybolov, které živí národ, automobilky a výrobce obráběcích strojů, kteří drží export, polovodičové a elektronické šampiony snažící se vymanit ze stagnace, úsilí o zajištění energie a kritických zdrojů pro souostroví téměř bez vlastních zásob a železniční tepny spojující ostrovy. Každý pokrok se zde násobí, zvyšuje produktivitu, efektivitu továren a výzkum a zároveň mění požadavky, které Japonsko klade na průmysl, zdroje a elektrickou síť." # todo: NEW TRANSLATION
 JAP_political_modifier: "Kokkai" # todo: NEW TRANSLATION
 JAP_political_modifier_desc: "Reformy přijaté v reakci na demografickou krizi proměňují národní politiku, otevírají zemi migraci a zároveň testují společenskou soudržnost a stabilitu národa nezvyklého na změny." # todo: NEW TRANSLATION
 JAP_transparency_and_audit_reform_modifier: "Reforma transparentnosti a auditů" # todo: NEW TRANSLATION
 JAP_transparency_and_audit_reform_modifier_desc: "Posílíme zveřejňování informací a správu veřejných záznamů a digitalizací a nezávislými audity omezíme příležitosti k protiprávnímu jednání. Řešením amakudari a neprůhlednosti politického financování zvýšíme efektivitu a důvěru ve správu i odolnost vůči vnějšímu vlivu." # todo: NEW TRANSLATION
 JAP_protecting_human_rights_modifier: "$JAP_protecting_human_rights$" # todo: NEW TRANSLATION
 JAP_protecting_human_rights_modifier_desc: "$JAP_protecting_human_rights_desc$" # todo: NEW TRANSLATION
 JAP_worker_protection_modifier: "Ochrana pracovníků" # todo: NEW TRANSLATION
 JAP_worker_protection_modifier_desc: "Budeme chránit živobytí a bezpečnost pracovníků na pracovišti a vytvářet podmínky, které lidem umožní dlouhodobě pracovat. Podporou vyšších mezd a lepšího zacházení a zmírněním ekonomické nejistoty posílíme společenskou stabilitu a základy průmyslu." # todo: NEW TRANSLATION
 JAP_redistribution_modifier: "$JAP_redistribution$" # todo: NEW TRANSLATION
 JAP_redistribution_modifier_desc: "$JAP_redistribution_desc$" # todo: NEW TRANSLATION
 JAP_leading_disarmament_idea: "$JAP_leading_disarmament$" # todo: NEW TRANSLATION
 JAP_leading_disarmament_idea_desc: "$JAP_leading_disarmament_desc$" # todo: NEW TRANSLATION
 JAP_leading_disarmament_idea_3: "Rozvoj jako mírumilovný národ" # todo: NEW TRANSLATION
 JAP_leading_disarmament_idea_3_desc: "Vymezíme národní cestu, která se nespoléhá na vojenskou sílu, a přesměrujeme zdroje a talent k civilnímu rozvoji. Upřednostněním posílení průmyslové základny a městských funkcí a urychlením výstavby civilního průmyslu a kancelářských čtvrtí zvýšíme životní úroveň a podpoříme hospodářský růst." # todo: NEW TRANSLATION
 JAP_prioritizing_order_modifier: "$JAP_prioritizing_order$" # todo: NEW TRANSLATION
 JAP_prioritizing_order_modifier_desc: "$JAP_prioritizing_order_desc$" # todo: NEW TRANSLATION
 JAP_strengthening_cabinet_modifier: "$JAP_strengthening_cabinet$" # todo: NEW TRANSLATION
 JAP_strengthening_cabinet_modifier_desc: "$JAP_strengthening_cabinet_desc$" # todo: NEW TRANSLATION
 JAP_regulatory_reform_modifier: "Regulační reforma a růstová strategie" # todo: NEW TRANSLATION
 JAP_regulatory_reform_modifier_desc: "Posílíme domácí konkurenceschopnost a přejdeme k systému schopnému udržet stabilní růst. Omezením překážek podnikatelské činnosti využijeme dynamiku soukromého sektoru k rozvoji průmyslu a zaměstnanosti." # todo: NEW TRANSLATION
 JAP_patriotic_education_modifier: "$JAP_patriotic_education$" # todo: NEW TRANSLATION
 JAP_patriotic_education_modifier_desc: "$JAP_patriotic_education_desc$" # todo: NEW TRANSLATION
 JAP_strengthen_military_idea: "$JAP_strengthen_military_power$" # todo: NEW TRANSLATION
 JAP_strengthen_military_idea_desc: "$JAP_strengthen_military_power_desc$" # todo: NEW TRANSLATION
 JAP_jsdf_international_missions_idea1a: "Institucionální základna misí mezinárodní spolupráce" # todo: NEW TRANSLATION
 JAP_jsdf_international_missions_idea1a_desc: "Pokročil vývoj právního rámce a operačních standardů potřebných pro mise mezinárodní spolupráce. S vyjasňováním postupů pro zahraniční nasazení a standardů reakce během misí se zlepšuje stabilita operací sil i konzistentnost rozhodování v terénu." # todo: NEW TRANSLATION
 JAP_constitutional_debate_idea: "Vyostřující se ústavní debata" # todo: NEW TRANSLATION
 JAP_constitutional_debate_idea_desc: "Výrazný posun v bezpečnostní politice otřásl dlouhodobými předpoklady poválečného řádu. Zatímco podpora posílení národní obrany roste, odpor těch, kteří se obávají ústupu od pacifismu, zůstává silný a konflikt ve společnosti i politické sféře se prohlubuje." # todo: NEW TRANSLATION
 JAP_f15_programe: "Program modernizace F-15" # todo: NEW TRANSLATION
 JAP_f15_programe_desc: "Flotila F-15J vyráběná společností Mitsubishi v licenci prochází postupnou modernizací: letouny, které stojí za zachování, dostanou nové radary, palubní počítače a displeje, zatímco pro zbytek bude racionalizován dodavatelský řetězec. Výzkum stíhaček a letectví se urychlí a z výrobních linek budou levněji sjíždět lehké a střední draky." # todo: NEW TRANSLATION
 JAP_submarine_modernization_idea: "Program modernizace ponorek" # todo: NEW TRANSLATION
 JAP_submarine_modernization_idea_desc: "Dieselelektrická flotila přechází na pohon nezávislý na vzduchu a později na lithium-iontové články, čímž prodlouží dobu pod hladinou bez reaktoru. Kawasaki a Mitsubishi střídavě stavějí trupy v Kóbe, což udržuje kompetence obou loděnic a snižuje jednotkové náklady." # todo: NEW TRANSLATION
 JAP_carrier_aviation: "Obnova palubního letectva" # todo: NEW TRANSLATION
 JAP_carrier_aviation_desc: "Námořní letectvo s pevnými křídly se poprvé od roku 1945 vrací do japonské flotily. Vrtulníkové torpédoborce budou znovu posouzeny jako letecké lodě, prověří se palubní povrchy a výtahy pro letouny s krátkým vzletem a naplno začne doktrinální práce s palubní leteckou skupinou." # todo: NEW TRANSLATION
 JAP_keen_sword_operation_idea: "Cvičení Keen Sword" # todo: NEW TRANSLATION
 JAP_keen_sword_operation_idea_desc: "Společné dvouleté cvičení se Spojenými státy vystavuje Japonské námořní síly sebeobrany kombinovaným manévrům flotily, obojživelným výsadkům a cvičením protivzdušné obrany v měřítku, kterého samy nedosáhnou. Posádky se vracejí ostřejší a zkušenosti přetrvávají déle než samotné cvičení." # todo: NEW TRANSLATION
 JAP_defense_technology_agency1: "Nipponská agentura obranných technologií" # todo: NEW TRANSLATION
 JAP_defense_technology_agency1_desc: "Nipponská agentura obranných technologií koordinuje výzkum, vývoj a nákupy napříč průmyslem, akademickou sférou a ozbrojenými silami. Sjednocením pokročilých projektů pod jedinou strategickou vizí Japonsko urychlí inovace, omezí duplicity a zajistí rychlejší přenos špičkových technologií k jednotkám v první linii." # todo: NEW TRANSLATION
 JAP_diplomacy_modifier: "Japonská diplomacie" # todo: NEW TRANSLATION
 JAP_diplomacy_modifier_desc: "Japonsko klade důraz na bilaterální vztahy s klíčovými národy a posiluje spolupráci v oblastech, jako je ekonomika, bezpečnost a kultura. Prostřednictvím pragmatických partnerství založených na zájmech Japonsko posiluje své postavení na světové scéně." # todo: NEW TRANSLATION
 JAP_chiang_mai_initiative: "Iniciativa Čiang Mai" # todo: NEW TRANSLATION
 JAP_chiang_mai_initiative_desc: "Rozšířením měnových swapových ujednání s Japonskem posilují členské státy ASEAN svou odolnost vůči finančním krizím a zvyšují hospodářskou stabilitu a autonomii." # todo: NEW TRANSLATION
 JAP_quantitative_oda_idea: "Japonská investiční pomoc do infrastruktury" # todo: NEW TRANSLATION
 JAP_quantitative_oda_idea_desc: "Japonská oficiální rozvojová pomoc urychlila rozvoj infrastruktury, jako je doprava, přístavy a elektřina. Tato podpora představuje životně důležitý základ hospodářského růstu našeho národa." # todo: NEW TRANSLATION
 JAP_qualitative_oda_idea: "Japonská rozvojová pomoc pro lidský kapitál a inovace" # todo: NEW TRANSLATION
 JAP_qualitative_oda_idea_desc: "Spolupráce s Japonskem přinesla významný pokrok ve vzdělávání, rozvoji lidských zdrojů a výzkumu. Posilování kapacity místních podniků a institucí otevírá cestu k udržitelnému rozvoji." # todo: NEW TRANSLATION
 JAP_security_south_china_sea_idea: "Japonské zapojení do námořní stability" # todo: NEW TRANSLATION
 JAP_security_south_china_sea_idea_desc: "Neutrální japonské zapojení do námořní bezpečnosti v Jihočínském moři pomohlo zmírnit regionální napětí a chránit svobodu plavby. Pro náš region představuje spolehlivou stabilizační přítomnost." # todo: NEW TRANSLATION
 JAP_jap_education: "Vzdělávací výměnný program Japonska a USA" # todo: NEW TRANSLATION
 JAP_jap_education_desc: "Probíhá pilotní hybridní vzdělávací program spojující japonskou disciplínu s americkým podnikatelským duchem. Toto vzájemné učení se silným stránkám poskytuje cenný podnět pro rozvoj budoucích generací." # todo: NEW TRANSLATION
 JAP_jap_education_culture: "Kulturní a vzdělávací spolupráce Japonska a USA" # todo: NEW TRANSLATION
 JAP_jap_education_culture_desc: "Mezi Japonskem a Spojenými státy vzniká komplexnější partnerství, které přesahuje popkulturu a pokročilé technologie. Rozvoj lidských zdrojů se prohloubil spojením vzdělávání zaměřeného na japonskou disciplínu a amerického étosu založeného na kreativitě. Synergie kulturní blízkosti a vědecké spolupráce podporuje společenskou stabilitu i tempo inovací." # todo: NEW TRANSLATION
 JAP_dual_use_idea: "Japonsko-americká spolupráce ve výzkumu technologií dvojího užití" # todo: NEW TRANSLATION
 JAP_dual_use_idea_desc: "Spolupráce Japonska a Spojených států v technologiích dvojího užití se prohlubuje. Urychlený vývoj a sdílené odborné znalosti slibují vyšší budoucí konkurenceschopnost v civilní i vojenské oblasti." # todo: NEW TRANSLATION
 JAP_disaster_countermeasure_cooperation_idea: "Vyšší odolnost vůči katastrofám díky spolupráci" # todo: NEW TRANSLATION
 JAP_disaster_countermeasure_cooperation_idea_desc: "Tchaj-wan díky spolupráci s Japonskem výrazně posílil svou schopnost reagovat na mimořádné události. Výměna znalostí a společné výcvikové programy mají omezit škody a urychlit obnovu." # todo: NEW TRANSLATION
 JAP_tai_high_technology_idea: "Japonsko-tchajwanské partnerství pokročilých technologií" # todo: NEW TRANSLATION
 JAP_tai_high_technology_idea_desc: "Společný výzkum s Japonskem urychluje inovace v tchajwanských sektorech civilních technologií. Sdílené výzkumné zdroje a mezinárodní spolupráce zvyšují průmyslovou konkurenceschopnost." # todo: NEW TRANSLATION
 JAP_tai_international_student_idea: "Výměna nové generace s Japonskem" # todo: NEW TRANSLATION
 JAP_tai_international_student_idea_desc: "Rozšíření studijních možností v Japonsku umožňuje většímu počtu tchajwanských studentů získat rozmanité akademické zkušenosti. To podporuje rozvoj budoucích vůdců japonsko-tchajwanských vztahů a rozšiřuje mezinárodní rozhled." # todo: NEW TRANSLATION
 JAP_chi_kor_intellectual_platform: "Platforma východoasijského dialogu o paměti" # todo: NEW TRANSLATION
 JAP_chi_kor_intellectual_platform_desc: "S podporou Organizace spojených národů zahájily Japonsko, Čína a Jižní Korea společnou intelektuální platformu pro uchování historické paměti a prohloubení vzájemného porozumění. Tato iniciativa představuje nový mezinárodní rámec spojující historickou reflexi s výhledovou spoluprací." # todo: NEW TRANSLATION
 JAP_chi_trade_support_idea: "Mezinárodní harmonizace obchodních systémů" # todo: NEW TRANSLATION
 JAP_chi_trade_support_idea_desc: "S technickou a institucionální podporou Japonska Čína rozvíjí obchodní systémy sladěné s mezinárodními standardy. Reformy, jako je zjednodušení celních postupů a změny právních předpisů, přispívají k modernizaci institucí." # todo: NEW TRANSLATION
 JAP_chi_advancement_companies_idea: "Prohloubená průmyslová integrace s Japonskem" # todo: NEW TRANSLATION
 JAP_chi_advancement_companies_idea_desc: "Vzájemné rozšiřování japonských a čínských společností zefektivňuje výrobní sítě a prohlubuje hospodářskou provázanost obou národů." # todo: NEW TRANSLATION
 JAP_chi_kanji_idea: "Spolupráce v čínsko-japonské kulturní sféře" # todo: NEW TRANSLATION
 JAP_chi_kanji_idea_desc: "Kulturní spolupráce s Japonskem posiluje výměnu v rámci společné „sféry čínských znaků“. To přispívá k posílení měkké síly a příznivějšímu mezinárodnímu obrazu." # todo: NEW TRANSLATION
 JAP_chi_temple_idea: "Společná ochrana buddhistického dědictví" # todo: NEW TRANSLATION
 JAP_chi_temple_idea_desc: "Společnou ochranou a obnovou buddhistických chrámů a kulturních památek s Japonskem Čína znovu potvrzuje hodnotu svého náboženského dědictví a zároveň podporuje cestovní ruch." # todo: NEW TRANSLATION
 JAP_kor_accelerator_idea: "Spolupráce na tokijsko-soulském akcelerátoru" # todo: NEW TRANSLATION
 JAP_kor_accelerator_idea_desc: "Rámec podpory startupů společně vytvořený Soulem a Tokiem podporuje novou generaci podnikání a posiluje technologickou spolupráci mezi městy." # todo: NEW TRANSLATION
 JAP_kor_local_companies_idea: "Program výměny místních podniků" # todo: NEW TRANSLATION
 JAP_kor_local_companies_idea_desc: "Výměny mezi místními společnostmi v Koreji a Japonsku oživují regionální ekonomiky a vytvářejí nové průmyslové sítě soukromého sektoru." # todo: NEW TRANSLATION
 JAP_kor_aging_idea: "Společná pracovní skupina pro stárnoucí společnost" # todo: NEW TRANSLATION
 JAP_kor_aging_idea_desc: "Pro řešení společné výzvy stárnoucí populace vznikla pracovní skupina korejských a japonských odborníků, která si vyměňuje poznatky o politikách a zlepšuje opatření sociální péče." # todo: NEW TRANSLATION
 JAP_sov_logistics_corridor_idea: "Eurasijská logistická síť Japonska a Ruska" # todo: NEW TRANSLATION
 JAP_sov_logistics_corridor_idea_desc: "Ve spolupráci s Japonskem probíhá rozvoj logistického koridoru spojujícího Japonsko a Evropu přes Rusko. Zlepšování infrastruktury a hospodářské propojení zvyšují geopolitický význam Ruska." # todo: NEW TRANSLATION
 JAP_sov_it_corridor_idea: "Iniciativa digitálního propojení Japonska a Ruska" # todo: NEW TRANSLATION
 JAP_sov_it_corridor_idea_desc: "S podporou Japonska Rusko rozšiřuje svou IT infrastrukturu. Partnerství Japonska a Ruska má vybudovat široký digitální koridor a položit základy globální výměny informací." # todo: NEW TRANSLATION
 JAP_territorial_disputes1: "Politické zisky z územních jednání" # todo: NEW TRANSLATION
 JAP_territorial_disputes1_desc: "Díky určitému pokroku v dlouhodobých územních otázkách se napětí v okolních vodách poněkud zmírnilo a domácí veřejné mínění zaplavuje pocit úlevy. Omezení diplomatické nejistoty má pozitivní dopad také na hospodářskou činnost v pobřežních oblastech a díky lepším provozním podmínkám podporuje základ daňových příjmů spojených s rybolovem." # todo: NEW TRANSLATION
 JAP_monarchist_shipbuilding_idea: "Císařská námořní stavební ofenziva" # todo: NEW TRANSLATION
 JAP_monarchist_shipbuilding_idea_desc: "Říše se vrátí k moři jako ke své přirozené doméně. V rámci císařské námořní stavební ofenzivy rozšíříme loděnice, centralizujeme smlouvy a udržíme válečné tempo výroby, dokud flotila nebude odpovídat ambicím Japonska. Položena ve jménu císaře, moře patří Říši!" # todo: NEW TRANSLATION
 JAP_monarchist_shipbuilding_idea_tt: "§RTento národní duch bude odstraněn, jakmile budete§! §Y$naval_power_of_the_continent$§!" # todo: NEW TRANSLATION
 JAP_restoring_imperial_household_idea: "Obnova císařského dvora" # todo: NEW TRANSLATION
 JAP_restoring_imperial_household_idea_desc: "Císařský dvůr je obnovován jako státní instituce, nikoli dekorativní dvůr. Jeho úřady se rozšiřují, protokoly formalizují a vliv obnovují prostřednictvím jmenování, která sbližují ministerstva a společnost s Trůnem. Císařský dvůr bude znovu fungovat jako tichý motor národní soudržnosti a směřování." # todo: NEW TRANSLATION
 JAP_once_millennium_disaster: "Katastrofa tisíciletí" # todo: NEW TRANSLATION
 JAP_once_millennium_disaster_desc: "Velké východojaponské zemětřesení z 11. března 2011 patří mezi nejničivější katastrofy moderních japonských dějin. Zemětřesení a cunami během okamžiku rozdrtily infrastrukturu, průmysl a živobytí a uvrhly národ do těžkého chaosu. Cesta k obnově bude dlouhá a namáhavá a vyžádá si obrovské zdroje a čas." # todo: NEW TRANSLATION
 JAP_scars_earthquake_and_tsunami: "Jizvy po zemětřesení a cunami" # todo: NEW TRANSLATION
 JAP_scars_earthquake_and_tsunami_desc: "Velké východojaponské zemětřesení a ničivé cunami způsobily katastrofální škody městům, přístavům a pobřežním komunitám Tóhóku. Infrastruktura a průmyslová zařízení byly zničeny a vážně podkopaly místní produktivitu i živobytí. Obnova potrvá roky a vyžádá si obrovské zdroje a úsilí." # todo: NEW TRANSLATION
 JAP_scars_earthquake: "Jizvy po zemětřesení" # todo: NEW TRANSLATION
 JAP_scars_earthquake_desc: "Otřesy Velkého východojaponského zemětřesení zasáhly také region Kantó, těžce poškodily dopravní sítě a narušily část průmyslové základny. Dokonce i oblast hlavního města zaznamenala dočasný pokles hospodářské aktivity. Přestože zkáza není tak vážná jako v Tóhóku, obnova stále vyžaduje značný čas a úsilí." # todo: NEW TRANSLATION
 JAP_seismic_retrofit: "Seizmické zpevnění" # todo: NEW TRANSLATION
 JAP_seismic_retrofit_desc: "Každá stavba v tomto regionu byla prozkoumána, zesílena nebo přestavěna tak, aby odolala velkému zemětřesení. Nemocnice stojí na izolátorech základů, starší školy byly zesíleny nebo zbourány a pilíře dálnic nesou ocelové objímky. Přísnější normy, povinné kontroly a hlubší základy zpomalují každý nový projekt, region se však již dalšího otřesu nebojí." # todo: NEW TRANSLATION
 JAP_focus_renewable_energy_idea: "Zaměření na obnovitelnou energii" # todo: NEW TRANSLATION
 JAP_focus_renewable_energy_idea_desc: "Obavy o jadernou bezpečnost nás vedly k upřednostnění obnovitelné energie, čímž posílíme dlouhodobou nezávislost výroby elektřiny." # todo: NEW TRANSLATION
 JAP_focus_energy_TT: "Dodatečné výdaje: §R0.01%§! HDP" # todo: NEW TRANSLATION
 JAP_focus_thermal_power_idea: "Zaměření na elektrárny na fosilní paliva" # todo: NEW TRANSLATION
 JAP_focus_thermal_power_idea_desc: "Volba elektráren na fosilní paliva zajišťuje stabilní výkon a okamžité dodávky, zvláště dokud jaderná bezpečnost zůstává celonárodní obavou." # todo: NEW TRANSLATION
 JAP_nuclear_power_program: "Dlouhodobý jaderný program" # todo: NEW TRANSLATION
 JAP_nuclear_power_program_desc: "Padesát dva reaktorů dodává přibližně třetinu elektřiny země a Dlouhodobý program Komise pro atomovou energii zavazuje Japonsko k uzavřenému palivovému cyklu založenému na přepracování v Rokkashu. Provozní výsledky jsou vynikající, avšak souhlas veřejnosti se zhroutil. Kritická nehoda v závodě JCO v Tokaimuře zabila dva pracovníky a zničila důvěru veřejnosti v průmysl i jeho regulátory. V březnu 2000 vláda podrobila přezkumu plány na výstavbu všech dvaceti navrhovaných elektráren. Od chvíle, kdy město Maki v referendu svůj reaktor odmítlo, se nelze spolehnout, že jakákoli prefektura přijme nové stanoviště." # todo: NEW TRANSLATION
 JAP_nuclear_local_consent: "Dohody o místním souhlasu" # todo: NEW TRANSLATION
 JAP_nuclear_local_consent_desc: "Prefekturní guvernéři a hostitelské obce byli prostřednictvím závazných bezpečnostních dohod, sdílení příjmů a práva předchozí konzultace o restartech znovu zapojeni do procesu. Veto, které na generaci zastavilo jadernou výstavbu v Japonsku, bylo vyjednáno, nikoli přehlasováno, a energetické společnosti mohou znovu plánovat novou kapacitu." # todo: NEW TRANSLATION
 JAP_anxiety_nuclear_power: "Veřejné obavy z jaderné energie" # todo: NEW TRANSLATION
 JAP_anxiety_nuclear_power_desc: "Šok z havárie Fukušima Daiiči rozšířil napříč společností strach a nedůvěru vůči jaderné energii. Veřejný odpor a procesní průtahy brzdí novou výstavbu, zatímco politický chaos pokračuje." # todo: NEW TRANSLATION
 JAP_shut_down_nuclear_plants: "Odstavit všechny jaderné elektrárny" # todo: NEW TRANSLATION
 JAP_shut_down_nuclear_plants_desc: "Rozhodnutím odstavit jadernou energetiku vláda přímo reagovala na obavy veřejnosti. Odpor přetrvává, rozhodnutí je však široce vnímáno jako upřednostnění bezpečnosti a společenské nepokoje postupně slábnou." # todo: NEW TRANSLATION
 JAP_nuclear_strict_examination: "Zpřísněné jaderné bezpečnostní standardy" # todo: NEW TRANSLATION
 JAP_nuclear_strict_examination_desc: "V reakci na havárii byly předpisy a kontroly výrazně zpřísněny. Nová výstavba i restarty nyní vyžadují dodatečná opatření a zdlouhavé postupy, takže jaderná energetika se rozšiřuje pomaleji a nemůže fungovat na předchozí úrovni." # todo: NEW TRANSLATION
 JAP_continue_nuclear_plants: "Pokračovat ve výrobě jaderné energie" # todo: NEW TRANSLATION
 JAP_continue_nuclear_plants_desc: "Vláda se rozhodla zachovat jadernou energetiku, ale vzpomínka na havárii zůstává živá. Nedůvěra a odpor proti bezpečnosti přetrvávají a podněcují politický konflikt, který podkopává domácí stabilitu." # todo: NEW TRANSLATION
 JAP_crown_centered: "Obnovení myšlenky vlády soustředěné kolem koruny" # todo: NEW TRANSLATION
 JAP_crown_centered_desc: "Po poznámkách premiéra Moriho začala v některých kruzích nabývat síly tradicionalistická a monarchistická rétorika. Protože vláda projevila ochotu tento trend využít, hnutí usilující o nové posouzení císařského dvora jako ústředního principu státu začalo získávat omezený, avšak rostoucí politický vliv." # todo: NEW TRANSLATION
 idea_JAP_emperor_naruhito: "Císař Naruhito" # todo: NEW TRANSLATION
 idea_JAP_emperor_naruhito_desc: "Naruhito se narodil 23. února 1960, syn Akihita a Michiko Šóda. Studoval na mnoha prestižních školách po celé Japonsku a říká se, že měl radostné dětství, také studoval na Oxfordské univerzitě." # todo: NEW TRANSLATION
 JAP_monarchist_modifier: "Císařská vláda" # todo: NEW TRANSLATION
 JAP_monarchist_modifier_desc: "Trůn se vrátil k velení a stát se nyní řídí císařským mandátem namísto stranického vyjednávání. Ministerstva, bezpečnostní složky a průmysl jsou sjednoceny pod jedinou doktrínou, která chápe císaře jako zdroj legitimity a směru." # todo: NEW TRANSLATION
 JAP_airforce_modifier: "[JAP_airforce_name]" # todo: NEW TRANSLATION
 JAP_article9_modifier: "Článek 9" # todo: NEW TRANSLATION
 JAP_defense_industry: "Obranná síť Kyōdō" # todo: NEW TRANSLATION
 JAP_defense_industry_2: "Obranná síť Kyōdō" # todo: NEW TRANSLATION
 JAP_landforce_modifier: "[JAP_landforces_name]" # todo: NEW TRANSLATION
 JAP_navy_modifier: "[JAP_navy_name]" # todo: NEW TRANSLATION
 JAP_navy_modifier_2: "[JAP_navy_name]" # todo: NEW TRANSLATION
 JAP_japanese_tech_agency_tt: "[JAP_defense_technology_idea_desc]\n" # todo: NEW TRANSLATION
 JAP_military_decision_category: "[JAP.GetAdjectiveCap] armáda" # todo: NEW TRANSLATION
 JAP_consolidate_national_defense_framework_mission: "Sjednotit rámec národní obrany" # todo: NEW TRANSLATION
 JAP_consolidate_national_defense_framework_mission_desc: "Přechod k širšímu obrannému postoji vytvořil nejistotu ve velitelských strukturách, plánovacích procesech a právních odpovědnostech. Sjednocením rámce národní obrany Japonsko postupně obnoví soudržnost a zmírní narušení způsobené reformou." # todo: NEW TRANSLATION
 JAP_consolidate_national_defense_framework_cancel_tt: "Skončí, jakmile bonus §Yčlánku 9§! k §Ystabilitě§! vyprchá a postihy k §Ypodpoře války§! a §Ydostupné populaci§! budou zcela odstraněny" # todo: NEW TRANSLATION
 JAP_modernize_joint_command_mission: "Modernizovat struktury společného velení" # todo: NEW TRANSLATION
 JAP_modernize_joint_command_mission_desc: "Integrace pozemních, námořních, leteckých a nově vznikajících oblastí do jednotného společného velení vyžaduje čas, výcvik a organizační změny. Jak se nové postupy testují a zdokonalují, tření pomalu klesá a účinnost japonských ozbrojených sil roste." # todo: NEW TRANSLATION
 JAP_modernize_joint_command_cancel_tt: "Skončí, jakmile budou zcela odstraněny postihy §Yčlánku 9§! k §Yzisku armádních, leteckých a námořních zkušeností§!, §Yvelitelské moci§! a §Ynákladům na důstojníky§!" # todo: NEW TRANSLATION
 JAP_normalize_defense_procurement_mission: "Normalizovat systémy obranných nákupů" # todo: NEW TRANSLATION
 JAP_normalize_defense_procurement_mission_desc: "Rozšíření obranných odpovědností silně zatížilo stávající nákupní a průmyslová uspořádání. Pečlivou reformou, dlouhodobým plánováním a užší koordinací s průmyslem Japonsko pracuje na normalizaci obranných nákupů a omezení neefektivity přechodného období." # todo: NEW TRANSLATION
 JAP_normalize_defense_procurement_cancel_tt: "Skončí, jakmile budou zcela odstraněny postihy §Yčlánku 9§! k §Yútoku armády§! a §Yobraně armády§! a vyprchají bonusy k §Yútoku na jádrovém území§! a §Yobraně na jádrovém území§!" # todo: NEW TRANSLATION
 JAP_establish_asteroid_mining_network_mission: "Budování sítě těžby asteroidů" # todo: NEW TRANSLATION
 JAP_establish_asteroid_mining_network_mission_desc: "Japonsko sestavuje svou první síť těžby asteroidů, rozmísťuje orbitální platformy a průzkumné vybavení, zatímco se začínají formovat operace těžby zdrojů mimo Zemi." # todo: NEW TRANSLATION
 JAP_asteroid_mining_light_operation: "Lehký průzkum nebeských těles" # todo: NEW TRANSLATION
 JAP_asteroid_mining_light_operation_desc: "Japonsko provádí malý průzkum asteroidů a vzývá vedení předků, zatímco sondy hledají na nebesích využitelné rudy." # todo: NEW TRANSLATION
 JAP_asteroid_mining_medium_operation: "Středně rozsáhlá božská těžební mise" # todo: NEW TRANSLATION
 JAP_asteroid_mining_medium_operation_desc: "Větší výprava se vydává hlouběji do pásu asteroidů a čerpá z mytologické symboliky, aby inspirovala misi, při níž Japonsko hledá cenné kovy mimo Zemi." # todo: NEW TRANSLATION
 JAP_asteroid_mining_heavy_operation: "Velká nebeská těžební výprava" # todo: NEW TRANSLATION
 JAP_asteroid_mining_heavy_operation_desc: "Je zahájeno plnohodnotné úsilí o těžbu asteroidů, které připomíná příběhy nebeských kováren, zatímco se Japonsko snaží získat bohaté vesmírné zdroje." # todo: NEW TRANSLATION
 JAP_mars_mission_program_mission: "Založena kolonie na Marsu" # todo: NEW TRANSLATION
 JAP_restore_guarantee: "Požádat o obnovení bezpečnostních záruk USA" # todo: NEW TRANSLATION
 JAP_restore_guarantee_desc: "S rostoucím regionálním napětím a pochybnostmi o naší dlouhodobé bezpečnosti někteří členové vlády tvrdí, že musíme požádat Spojené státy o obnovenou a výslovnou bezpečnostní záruku. To si pravděpodobně vyžádá politické ústupky v obranné politice a výkladu článku 9, avšak může jít o cenu strategické stability." # todo: NEW TRANSLATION
 JAP_remove_american_blockade: "Požádat o ukončení námořního tlaku USA" # todo: NEW TRANSLATION
 JAP_remove_american_blockade_desc: "Zesílená námořní přítomnost USA kolem našich klíčových námořních tras se stala zdrojem napětí doma i v zahraničí. Diplomatické kanály zůstávají otevřené pro jednání o omezení či ukončení tohoto tlaku, Washington však téměř jistě očekává hlubší bezpečnostní závazky a další úpravy našeho postoje k článku 9." # todo: NEW TRANSLATION
 JAP_restore_trade_relations: "Usilovat o normalizaci obchodu se Spojenými státy" # todo: NEW TRANSLATION
 JAP_restore_trade_relations_desc: "Cla a cílená obchodní opatření uvalená Spojenými státy poškozují naše vývozce a oslabují důvěru v alianci. Přímým jednáním s Washingtonem bychom mohli hospodářské vztahy normalizovat, avšak každá smysluplná úleva bude pravděpodobně spojena s obnovenou bezpečnostní spoluprací a širším výkladem článku 9." # todo: NEW TRANSLATION
 JAP_chinese_agression_five: "Rostoucí čínská agrese" # todo: NEW TRANSLATION
 JAP_chinese_agression_five_desc: "Nedávné kroky Číny v regionu vyvolaly obavy mezi našimi obrannými plánovači. Situace zatím nedosáhla kritického bodu, trend je však nepopiratelný: Peking svůj postoj postupně zostřuje. Tvůrci politik varují, že Japonsko se musí připravit na možnost další destabilizace." # todo: NEW TRANSLATION
 JAP_chinese_agression_ten: "Stupňující se čínský tlak" # todo: NEW TRANSLATION
 JAP_chinese_agression_ten_desc: "Čína zesílila svůj vojenský a geopolitický tlak v regionu. Průniky hlídek, narušování vzdušného prostoru a agresivní rétorika výrazně narostly. Rostoucí četnost incidentů naznačuje záměrnou strategii testování odhodlání Japonska a přetváření regionální rovnováhy." # todo: NEW TRANSLATION
 JAP_chinese_agression_twelve: "Znepokojivé aktivity Číny" # todo: NEW TRANSLATION
 JAP_chinese_agression_twelve_desc: "Nejnovější kroky Pekingu představují znepokojivou eskalaci. Zpravodajské zprávy uvádějí zvýšené nasazení námořních sil, vojenská cvičení poblíž sporných vod a politická poselství zaměřená přímo na Japonsko. Situace je stále nestabilnější a volání po silnější národní reakci sílí." # todo: NEW TRANSLATION
 JAP_chinese_agression_fourteen: "Vážné čínské provokace" # todo: NEW TRANSLATION
 JAP_chinese_agression_fourteen_desc: "Čína podnikla několik agresivních kroků, které přesahují běžný tlak. Strategické prostředky byly rozmístěny poblíž japonského území a průniky do okolních vod dosáhly nové četnosti. Obranní představitelé varují, že Japonsko možná bude muset přehodnotit některé prvky svého bezpečnostního postoje." # todo: NEW TRANSLATION
 JAP_chinese_agression_sixteen: "Nebezpečná čínská eskalace" # todo: NEW TRANSLATION
 JAP_chinese_agression_sixteen_desc: "Regionální situace se stává stále nebezpečnější. Čínské vojenské manévry nyní zjevně slouží k přímému zastrašování Japonska a propagandistické kanály v Pekingu zaujaly ostřejší tón. Možnost krize vyvolané chybným odhadem dramaticky roste." # todo: NEW TRANSLATION
 JAP_chinese_agression_eighteen: "Kritický čínský vojenský tlak" # todo: NEW TRANSLATION
 JAP_chinese_agression_eighteen_desc: "Agresivní postoj Číny dosáhl kritického bodu. Klíčové námořní zóny jsou pod neustálým tlakem, narušování vzdušného prostoru dosahuje bezprecedentní úrovně a regionální partneři bijí na poplach. Tvůrci politik v Tokiu tvrdí, že Japonsko musí přehodnotit svou obrannou strategii včetně výkladu článku 9." # todo: NEW TRANSLATION
 JAP_chinese_agression_twenty: "Vážná regionální krize: čínská agrese vrcholí" # todo: NEW TRANSLATION
 JAP_chinese_agression_twenty_desc: "Situace se změnila v plnohodnotnou regionální krizi. Čína provedla rozsáhlá vojenská rozmístění poblíž japonského území a dává najevo ochotu dále eskalovat. Hrozba národní bezpečnosti již není teoretická; Japonsko čelí přímé výzvě, která může vynutit historická rozhodnutí o vojenském postoji a roli Sil sebeobrany." # todo: NEW TRANSLATION
 JAP_world_tension_high: "Přezkoumat bezpečnostní postoj" # todo: NEW TRANSLATION
 JAP_world_tension_high_desc: "Rostoucí globální nestabilita vyžaduje, aby Japonsko přehodnotilo své obranné politiky a připravilo se na možné změny mezinárodního řádu." # todo: NEW TRANSLATION
 JAP_world_tension_high2: "Připravit se na regionální krize" # todo: NEW TRANSLATION
 JAP_world_tension_high2_desc: "Svět se stává stále nebezpečnějším. Japonsko musí podniknout konkrétní kroky k zajištění národní bezpečnosti a udržení strategické připravenosti." # todo: NEW TRANSLATION
 JAP_world_tension_high3: "Aktivovat opatření národní bezpečnosti" # todo: NEW TRANSLATION
 JAP_world_tension_high3_desc: "Globální napětí dosáhlo kritické úrovně. Japonsko nyní musí zvážit mimořádná opatření k ochraně národních zájmů a zachování regionální stability." # todo: NEW TRANSLATION
 JAP_article_nine_protests_appeal: "Reagovat na protesty na podporu obrany" # todo: NEW TRANSLATION
 JAP_article_nine_protests_appeal_desc: "Rozsáhlé protesty na podporu obrany požadují silnější vojenské schopnosti a tvrdší bezpečnostní postoj. Reakcí na tyto výzvy a rozšířením výkladu článku 9 může vláda využít tlak veřejnosti k ospravedlnění asertivnější politiky národní obrany." # todo: NEW TRANSLATION
 JAP_article_nine_protests_appeal_tt: "§YSíla protestů§! je alespoň §R50§!" # todo: NEW TRANSLATION
 JAP_article_nine_protests_appeal_tt2: "[JAP.GetName] nemá §YPožadovaný vojenský zákon§!" # todo: NEW TRANSLATION
 JAP_article_nine_military_parties: "Využít provojenské strany" # todo: NEW TRANSLATION
 JAP_article_nine_military_parties_desc: "Provojenské strany ve vládě tlačí na silnější národní obranu a širší výklad článku 9. Sladěním s jejich programem může vláda prosadit vojenské reformy a ospravedlnit vyšší úroveň obranné připravenosti." # todo: NEW TRANSLATION
 JAP_article_nine: "Výklad článku 9" # todo: NEW TRANSLATION
 JAP_article_nine_left_side: "Přísný pacifismus" # todo: NEW TRANSLATION
 JAP_article_nine_level_one: "Úroveň I: Pacifistický výklad" # todo: NEW TRANSLATION
 JAP_article_nine_level_two: "Úroveň II: Obranný výklad" # todo: NEW TRANSLATION
 JAP_article_nine_level_three: "Úroveň III: Spolupracující obrana" # todo: NEW TRANSLATION
 JAP_article_nine_level_four: "Úroveň IV: Kolektivní sebeobrana" # todo: NEW TRANSLATION
 JAP_article_nine_level_five: "Úroveň V: Rozšířená vojenská role" # todo: NEW TRANSLATION
 JAP_article_nine_right_side: "Aktivní obrana" # todo: NEW TRANSLATION
 JAP_great_east_japan_earthquake_decision: "Cesta k obnově" # todo: NEW TRANSLATION
 JAP_great_east_japan_earthquake_decision_desc: "Dne 11. března 2011 zasáhlo národ Velké východojaponské zemětřesení s bezprecedentními otřesy a cunami a přineslo zkázu, jakou moderní dějiny nepoznaly. Od Tóhóku po Kantó byly rozsáhlé oblasti ochromeny, dopravní sítě paralyzovány, hospodářská činnost zastavena a nespočet životů převrácen naruby. Komunity a průmysl přišly o své základy a celý národ upadl do chaosu a nejistoty.\n\nKatastrofa nebyla pouze fyzickým zničením; zanechala hlubokou jizvu v národní psychice a přiměla společnost znovu zvážit samotné základy. Japonsko nyní stojí na rozcestí a čelí obrovské výzvě obnovy a obnovujícího rozvoje. Rekonstrukce zničených oblastí, obnovení průmyslu a návrat života a vazeb lidí jsou nevyhnutelnými povinnostmi státu.\n\nToto úsilí, známé jako „Cesta k obnově“, bude dlouhé a namáhavé. Jen překonáním takové nepřízně však může Japonsko vytesat obnovenou budoucnost." # todo: NEW TRANSLATION
 JAP_tohoku_infrastructure_decision: "Rekonstrukce infrastruktury Tóhóku" # todo: NEW TRANSLATION
 JAP_tohoku_infrastructure_decision_desc: "Krok za krokem musíme obnovit infrastrukturu zničenou zemětřesením. Obnova silnic, železnic a přístavů, základů regionálních ekonomik a každodenního života, je prvním krokem k obnově." # todo: NEW TRANSLATION
 JAP_kanto_infrastructure_decision: "Rekonstrukce infrastruktury Kantó" # todo: NEW TRANSLATION
 JAP_kanto_infrastructure_decision_desc: "Krok za krokem musíme obnovit infrastrukturu zničenou zemětřesením. Obnova silnic, železnic a přístavů, základů regionálních ekonomik a každodenního života, je prvním krokem k obnově." # todo: NEW TRANSLATION
 JAP_tohoku_communication_decision: "Obnovit telekomunikace v Tóhóku" # todo: NEW TRANSLATION
 JAP_tohoku_communication_decision_desc: "Telekomunikační infrastruktura zničená katastrofou je zásadní pro obnovu a každodenní život. Obnova musí postupovat krok za krokem, aby znovu propojila komunity a oživila ekonomiku." # todo: NEW TRANSLATION
 JAP_kanto_communication_decision: "Obnovit telekomunikace v Kantó" # todo: NEW TRANSLATION
 JAP_kanto_communication_decision_desc: "Telekomunikační infrastruktura zničená katastrofou je zásadní pro obnovu a každodenní život. Obnova musí postupovat krok za krokem, aby znovu propojila komunity a oživila ekonomiku." # todo: NEW TRANSLATION
 JAP_tohoku_industrial_recovery_decision: "Oživit průmysl v Tóhóku" # todo: NEW TRANSLATION
 JAP_tohoku_industrial_recovery_decision_desc: "Obnovení místního průmyslu zastaveného katastrofou je zásadní pro hospodářskou obnovu. Obnova civilního průmyslu pomůže vytvořit pracovní místa a posílit výrobní základnu." # todo: NEW TRANSLATION
 JAP_kanto_industrial_recovery_decision: "Oživit průmysl v Kantó" # todo: NEW TRANSLATION
 JAP_kanto_industrial_recovery_decision_desc: "Obnovení místního průmyslu zastaveného katastrofou je zásadní pro hospodářskou obnovu. Obnova civilního průmyslu pomůže vytvořit pracovní místa a posílit výrobní základnu." # todo: NEW TRANSLATION
 JAP_seismic_retrofit_category: "Seizmické zpevňování" # todo: NEW TRANSLATION
 JAP_seismic_retrofit_category_desc: "Zajištění regionu proti zemětřesením je desetiletým stavebně-inženýrským úsilím, prefekturu po prefektuře a budovu po budově. Jakmile je region zpevněn, budoucí otřesy se mu zcela vyhnou za trvalou cenu pomalejší výstavby podle přísnějších norem." # todo: NEW TRANSLATION
 JAP_seismic_retrofit_decision: "Zpevnit [FROM.GetName]" # todo: NEW TRANSLATION
 JAP_seismic_retrofit_decision_desc: "Prozkoumat každou stavbu v regionu a uvést ji do souladu s moderními seizmickými standardy. Dva roky práce a značná část národního výkonu výměnou za trvalou imunitu vůči zemětřesením a dlouhodobý postih místní rychlosti výstavby." # todo: NEW TRANSLATION
 JAP_domestic_policy_decision: "[JAP.GetFlag][JAP.GetAdjective] rozhodnutí domácí politiky" # todo: NEW TRANSLATION
 JAP_focus_renewable_energy_decision: "Zaměřit se na obnovitelnou energii" # todo: NEW TRANSLATION
 JAP_focus_renewable_energy_decision_desc: "Vzhledem k rostoucím obavám o bezpečnost jaderné energie nabízí větší investice do solární, větrné a další obnovitelné energie cestu k diverzifikaci energetiky a omezení závislosti na dovážených palivech." # todo: NEW TRANSLATION
 JAP_focus_thermal_power_decision: "Zaměřit se na elektrárny na fosilní paliva" # todo: NEW TRANSLATION
 JAP_focus_thermal_power_decision_desc: "Uprostřed obav o jadernou bezpečnost poskytne rozšiřování uhelných, ropných a plynových elektráren národu bezprostřednější a spolehlivější zdroj elektřiny." # todo: NEW TRANSLATION
 JAP_focus_renewable_energy_decision_repeal: "Zrušit zaměření na obnovitelnou energii" # todo: NEW TRANSLATION
 JAP_focus_renewable_energy_decision_repeal_desc: "Zvrácení závazku k obnovitelné energii znamená odklon od investic do solární a větrné energetiky a umožní vládě přesměrovat zdroje k jiným energetickým prioritám." # todo: NEW TRANSLATION
 JAP_focus_thermal_power_decision_repeal: "Zrušit zaměření na elektrárny na fosilní paliva" # todo: NEW TRANSLATION
 JAP_focus_thermal_power_decision_repeal_desc: "Zvrácení rozšiřování elektráren na fosilní paliva znamená odklon od investic do uhlí, ropy a plynu a umožní vládě přesměrovat zdroje k jiným energetickým prioritám." # todo: NEW TRANSLATION
 JAP_reactor_restart_category: "Program restartu reaktorů" # todo: NEW TRANSLATION
 JAP_reactor_restart_category_desc: "Padesát čtyři reaktorů kdysi dodávalo třetinu japonské elektřiny. Po roce 2011 všechny utichly a jejich návrat není jediným rozhodnutím, ale tažením vedeným elektrárnu po elektrárně a prefekturu po prefektuře. Každý restart vyžaduje regulační přezkum trvající roky, souhlas guvernéra odpovědného vyděšeným voličům a účet za seizmické úpravy dosahující stovek miliard jenů. Odměnou je nejlevnější základní výkon, jaký země kdy bude mít.\n\nKaždý dokončený restart §Gtrvale zlepšuje§! japonskou jadernou výrobu a snižuje náklady na udržování flotily." # todo: NEW TRANSLATION
 JAP_restart_sendai: "Restartovat Sendai" # todo: NEW TRANSLATION
 JAP_restart_sendai_desc: "Dvě tlakovodní jednotky společnosti Kyushu Electric v Satsumasendai v Kagošimě byly první v zemi, které splnily nové bezpečnostní standardy, a v srpnu 2015 se blok Sendai 1 stal prvním japonským reaktorem vyrábějícím elektřinu po téměř dvou letech. Souhlas guvernéra Ita to umožnil; protipovodňová zeď, filtrovaný odtok a nouzové řídicí centrum to učinily obhajitelným." # todo: NEW TRANSLATION
 JAP_restart_ikata: "Restartovat Ikatu" # todo: NEW TRANSLATION
 JAP_restart_ikata_desc: "Elektrárna společnosti Shikoku Electric leží na úzkém poloostrově Sadamisaki v Ehime, několik kilometrů od Střední tektonické linie. Blok 3 se vrátil do provozu v roce 2016 a od té doby byl soudy sousedních prefektur více než jednou zastaven a znovu spuštěn. Žádná elektrárna v Japonsku lépe neukazuje, že licence regulátora představuje jen polovinu boje." # todo: NEW TRANSLATION
 JAP_restart_takahama_ohi: "Restartovat fukujský klastr" # todo: NEW TRANSLATION
 JAP_restart_takahama_ohi_desc: "Prefektura Fukui hostí nejhustší koncentraci reaktorů v zemi. Bloky společnosti Kansai Electric v Takahamě, Ohi a Mihamě po desetiletí zásobovaly průmysl Ósaky a Kóbe a některé jsou nyní tak staré, že jejich provoz přes čtyřicet let vyžadoval samostatné a sporné prodloužení. Restart klastru obnoví dodávky elektřiny do průmyslového srdce jediným úderem." # todo: NEW TRANSLATION
 JAP_restart_genkai: "Restartovat Genkai" # todo: NEW TRANSLATION
 JAP_restart_genkai_desc: "Elektrárna společnosti Kyushu Electric v prefektuře Saga se vrátila do provozu v roce 2018 po úpravách, které zahrnovaly jedno z prvních specializovaných bezpečnostních zařízení vybudovaných podle nových pravidel. Genkai také využívá japonský plutermální program a spaluje směsné oxidické palivo, které uzavírá část cyklu mezi reaktory a přepracovacím závodem v Rokkashu." # todo: NEW TRANSLATION
 JAP_restart_onagawa: "Restartovat Onagawu" # todo: NEW TRANSLATION
 JAP_restart_onagawa_desc: "Onagawa v Mijagi ležela epicentru zemětřesení z roku 2011 blíže než Fukušima Daiiči a její čtrnáctimetrová protipovodňová zeď vydržela. Město poskytlo evakuovaným útočiště v tělocvičně samotné elektrárny. Uvedení bloku 2 do provozu v roce 2024 bylo prvním restartem varného reaktoru stejného typu, jaký selhal v Daiiči, a představovalo nejsilnější argument průmyslu." # todo: NEW TRANSLATION
 JAP_restart_shimane: "Dokončit blok 3 v Šimane" # todo: NEW TRANSLATION
 JAP_restart_shimane_desc: "Elektrárna společnosti Chugoku Electric je jedinou jadernou elektrárnou v Japonsku umístěnou v prefekturním hlavním městě, na okraji samotného Macue. Blok 3 byl postaven, ale nikdy nebyl uveden do provozu a během dlouhého odstavení zůstal dokončený a nečinný. Jeho uvedení do provozu není restartem, nýbrž prvním spuštěním, a stavební odbornost získaná při práci již znovu nezmizí." # todo: NEW TRANSLATION
 JAP_restart_tomari: "Restartovat Tomari" # todo: NEW TRANSLATION
 JAP_restart_tomari_desc: "Tři bloky společnosti Hokkaido Electric v Tomari jsou jedinou jadernou elektrárnou na severním ostrově a jejich ztráta zanechala Hokkaido závislé na slabém propojení a stárnoucí tepelné kapacitě, jak bolestně ukázal výpadek elektřiny na celém ostrově v roce 2018. Seizmické přehodnocení lokality trvalo přes deset let. Obnovení Tomari scelí hokkaidskou síť." # todo: NEW TRANSLATION
 JAP_restart_kashiwazaki_kariwa: "Restartovat Kašiwazaki-Kariwa" # todo: NEW TRANSLATION
 JAP_restart_kashiwazaki_kariwa_desc: "Sedm bloků na pobřeží Niigaty činí z této elektrárny největší jadernou elektrárnu, jaká byla kdy kdekoli postavena. Patří společnosti TEPCO, která přišla o Fukušimu, a guvernéři Niigaty na to roky odmítali zapomenout. Bezpečnostní selhání na místě společnost na čas připravila o povolení k provozu. Pokud lze Kašiwazaki-Kariwu obnovit, žádná elektrárna ve flotile není mimo dosah." # todo: NEW TRANSLATION
 JAP_gx_transition_category: "Zelená transformace" # todo: NEW TRANSLATION
 JAP_gx_transition_category_desc: "Japonsko bez reaktorů musí najít elektřinu jinde a souostroví má nedostatek všeho kromě větru, tepla a inženýrů. Zelená transformace je odpovědí: plovoucí turbíny ve vodách příliš hlubokých pro kotvení, sopečné teplo pod severními horami, síť konečně překonávající rozdíl mezi padesáti a šedesáti hertzy a především národní schopnost spotřebovat méně, než kdokoli považoval za možné.\n\nKaždý dokončený projekt §Gtrvale zlepšuje§! výrobu obnovitelné energie v Japonsku nebo snižuje celostátní poptávku a definitivně uzavírá reaktory ve svém regionu." # todo: NEW TRANSLATION
 JAP_gx_goto_floating_wind: "Plovoucí pobřežní větrné elektrárny Goto" # todo: NEW TRANSLATION
 JAP_gx_goto_floating_wind_desc: "Mořské dno u Japonska klesá příliš strmě pro pevné základy používané v Severním moři, a proto japonské ambice v pobřežní větrné energetice spočívají na plovoucích platformách ukotvených v hluboké vodě. Pole u ostrovů Goto v Nagasaki je zkušebním místem této technologie a loděnice, které kdysi stavěly tankery, jsou přirozeným místem pro výrobu trupů." # todo: NEW TRANSLATION
 JAP_gx_tohoku_geothermal: "Geotermální klastr Tóhóku" # todo: NEW TRANSLATION
 JAP_gx_tohoku_geothermal_desc: "Japonsko má třetí největší geotermální zásoby na světě a téměř žádné nevyužívá, protože mu brání hranice národních parků a majitelé lázní obávající se, že vrty odčerpají jejich vodu. Appi v Iwate prolomilo pat v roce 2024 jako první velká geotermální elektrárna po desetiletích. Tam, kde jsou sopky, je i energie, která proudí ve tmě i za klidu." # todo: NEW TRANSLATION
 JAP_gx_kanto_setsuden: "Kampaň Setsuden" # todo: NEW TRANSLATION
 JAP_gx_kanto_setsuden_desc: "V létě po katastrofě Tokio jednoduše spotřebovalo méně. Kanceláře ztlumily světla a odložily kravaty, továrny přesunuly směny na víkend a hlavní město překonalo špičku bez výpadků, které všichni předpovídali. Setsuden měl být nouzovým opatřením. Díky stavebním předpisům, průmyslovým standardům a programu Top Runner se stal trvalým a má větší cenu než elektrárna za zlomek jejích nákladů." # todo: NEW TRANSLATION
 JAP_gx_frequency_converter: "Rozšíření frekvenčních měničů" # todo: NEW TRANSLATION
 JAP_gx_frequency_converter_desc: "Tokio pracuje na padesáti hertzech, protože v 90. letech 19. století koupilo německé generátory, zatímco Ósaka používá šedesát, protože koupila americké. O století později si obě poloviny země stále nemohou volně předávat elektřinu a v roce 2011 mohl západ poslat na východ pouze jediný gigawatt, zatímco Tokio potemnělo. Rozšíření měníren v Sakumě, Šin-Šinanu a Higaši-Šimizu konečně vytvoří z jedné národní sítě dvě." # todo: NEW TRANSLATION
 JAP_gx_hokkaido_hvdc: "Propojení s Hokkaidem" # todo: NEW TRANSLATION
 JAP_gx_hokkaido_hvdc_desc: "Hokkaido má nejlepší větrné zdroje v Japonsku a nejméně lidí, kteří by je využili, což vede k omezování turbín, zatímco Honšú pálí dovážený plyn. Vysokonapěťové stejnosměrné vedení podél pobřeží Japonského moře přenese severní vítr tam, kde je poptávka, a navíc by udrželo světla rozsvícená během celostátního výpadku v roce 2018." # todo: NEW TRANSLATION
 JAP_gx_kobe_hydrogen: "Vodíkový dodavatelský řetězec v Kóbe" # todo: NEW TRANSLATION
 JAP_gx_kobe_hydrogen_desc: "První loď na kapalný vodík na světě zakotvila v Kóbe v roce 2022 a dokončila dodavatelský řetězec od australských ložisek lignitu po terminál na ostrově Port Island. Vodík hoří bez uhlíku a ukládá to, co turbíny vyrábějí a síť zatím nemůže využít. Kawasaki Heavy strávila desetiletí budováním tankerů, nádrží a turbín, které s ním dokážou pracovat." # todo: NEW TRANSLATION
 JAP_gx_hekinan_ammonia: "Spoluspalování čpavku" # todo: NEW TRANSLATION
 JAP_gx_hekinan_ammonia_desc: "Uhelná elektrárna Hekinan v Aiči je největší v zemi a společnost JERA do jejích kotlů přimíchává čpavek spolu s uhlím, nejprve v poměru jedna ku pěti a postupně s vyšším podílem. Čpavek přenáší vodík ve formě, s níž si lodě a potrubí již umějí poradit, a umožňuje stávající flotile tepelných elektráren spalovat méně paliva bez demolice a nové výstavby." # todo: NEW TRANSLATION
 JAP_gx_shikoku_solar_storage: "Solární energie a akumulace na Šikoku" # todo: NEW TRANSLATION
 JAP_gx_shikoku_solar_storage_desc: "Šikoku má nejsilnější sluneční svit v Japonsku a dostatečně malou síť, že polední solární výrobu je nutné omezovat, protože ji není kam uložit. Spojení velkoplošných polí se síťovými bateriemi přesouvá přebytek z poledne do večerní špičky, což je rozdíl mezi obnovitelnou kapacitou existující na papíře a obnovitelnou elektřinou skutečně využitou." # todo: NEW TRANSLATION
 JAP_saudi_aramco_crude_storage: "Skladování ropy Saudi Aramco" # todo: NEW TRANSLATION
 JAP_saudi_aramco_crude_storage_desc: "Zajistit vyhrazené skladování ropy prostřednictvím Saudi Aramco, stabilizovat dodávky a snížit vystavení náhlým tržním šokům. Ukotvením dlouhodobého přístupu a předvídatelných dodávek si Japonsko kupuje strategický čas." # todo: NEW TRANSLATION
 JAP_kosaka_tsl_furnace: "Rozšíření pece TSL v Kosace" # todo: NEW TRANSLATION
 JAP_kosaka_tsl_furnace_desc: "Zpracování je stejně strategické jako těžba. Rozšíříme kapacitu pece TSL v Kosace, aby zpracovávala složitý šrot a smíšené koncentráty a získávala kritické kovy, které by jinak byly ztraceny." # todo: NEW TRANSLATION
 JAP_green_ship_recycling: "Ekologická recyklace lodí" # todo: NEW TRANSLATION
 JAP_green_ship_recycling_desc: "Flotila se nejen staví, ale také rozebírá a ocel se musí vrátit národu. Zavedeme ekologické standardy a kapacity recyklace lodí, abychom bezpečně a účinně získávali cenné materiály. Každý vyřazený trup se stane zdrojem pro další." # todo: NEW TRANSLATION
 JAP_rubber_butadiene_branch_decision: "Odvětví butadienového kaučuku" # todo: NEW TRANSLATION
 JAP_rubber_butadiene_branch_decision_desc: "Přírodní kaučuk lze odříznout, přídělovat nebo cenově vytlačit do slabosti a Japonsko nesmí dovolit, aby taková páka existovala. Rozšíříme odvětví syntetického kaučuku na bázi butadienu, abychom zajistili pneumatiky, těsnění a kritické komponenty pro průmysl i ozbrojené síly." # todo: NEW TRANSLATION
 JAP_bibi_world_decision: "Výstavba továrny Rapidus IIM-1 „Bibi World“" # todo: NEW TRANSLATION
 JAP_bibi_world_decision_desc: "Urychlit výstavbu továrny Rapidus IIM-1 „Bibi World“ a zajistit kapacitu polovodičů nové generace na japonské půdě." # todo: NEW TRANSLATION
 JAP_yufutsu_oil_expansion_decision: "Rozšíření ropného pole Jufucu" # todo: NEW TRANSLATION
 JAP_yufutsu_oil_expansion_decision_desc: "Rozšířit pole Jufucu, posílit domácí dodávky a snížit vystavení vnějším narušením." # todo: NEW TRANSLATION
 JAP_toray_expansion_program_decision: "Program rozšíření Toray" # todo: NEW TRANSLATION
 JAP_toray_expansion_program_decision_desc: "Rozšířit výrobu pokročilých materiálů společnosti Toray a posílit japonskou průmyslovou základnu tam, kde na tom nejvíce záleží." # todo: NEW TRANSLATION
 JAP_teijin_aerospace_prepreg_decision: "Letecké prepregy Teijin" # todo: NEW TRANSLATION
 JAP_teijin_aerospace_prepreg_decision_desc: "Rozšířit kapacitu společnosti Teijin pro letecké prepregy a zajistit kompozitní základ moderních draků a špičkových obranných systémů." # todo: NEW TRANSLATION
 JAP_demand_south_kuril: "Požadovat Jižní Kurily" # todo: NEW TRANSLATION
 JAP_demand_south_kuril_desc: "Tokio vydá formální požadavek na navrácení Jižních Kuril. Moskva může ustoupit, aby se vyhnula eskalaci, nebo odmítnout a riskovat krizi." # todo: NEW TRANSLATION
 JAP_demand_south_kuril_reject_tt: "Můžeme zahájit §Ypohraniční válku§! o §Y$STATE_1168$§!, nebo §Rvyhlásit válku [SOV.GetName]§! a silou se zmocnit Severních teritorií" # todo: NEW TRANSLATION
 JAP_demand_north_kuril: "Požadovat Severní Kurily" # todo: NEW TRANSLATION
 JAP_demand_north_kuril_desc: "Japonsko požádá o navrácení Severních Kuril jako součást širší agendy obnovy císařství. Odmítnutí lze využít k ospravedlnění další eskalace." # todo: NEW TRANSLATION
 JAP_demand_north_kuril_reject_tt: "Můžeme zahájit §Ypohraniční válku§! o §Y$STATE_1168$§!, nebo §Rvyhlásit válku [SOV.GetName]§! a silou se zmocnit Severních teritorií" # todo: NEW TRANSLATION
 JAP_demand_sakhalin: "Požadovat Sachalin" # todo: NEW TRANSLATION
 JAP_demand_sakhalin_desc: "Japonsko požádá o navrácení Sachalinu. Pokud sovětská vláda požadavek odmítne, Tokio bude stát před volbou mezi zdrženlivostí, omezeným konfliktem a válkou." # todo: NEW TRANSLATION
 JAP_demand_sakhalin_reject_tt: "Můžeme odemknout §Ynájezd zvláštních sil§! na §Y$STATE_691$§!, nebo §Rvyhlásit válku [SOV.GetName]§! a silou se zmocnit Severních teritorií" # todo: NEW TRANSLATION
 JAP_peaceout_russia: "Uzavřít mír s Ruskem" # todo: NEW TRANSLATION
 JAP_peaceout_russia_desc: "Vynutíme s Ruskem urovnání, které ukončí válku za našich podmínek a zajistí to, co jsme dobyli. Jde stejně tak o politické jako vojenské rozhodnutí, které nové skutečnosti vtělí do smluv dříve, než se Moskva vzpamatuje. Pokud Rusko přijme, boje skončí a mapa se navždy změní." # todo: NEW TRANSLATION
 JAP_claiming_south_korea: "Vznést nárok na Koreu" # todo: NEW TRANSLATION
 JAP_claiming_south_korea_desc: "Představíme Koreu jako otázku japonské bezpečnosti a historického práva a proměníme nejasnost v otevřený nárok. Není to gesto, ale prohlášení, že naše strategická hranice nekončí u Cušimského průlivu. Jakmile nárok vzneseme, každé budoucí jednání začne za našich podmínek." # todo: NEW TRANSLATION
 JAP_claiming_north_korea: "Vymezit severní otázku Koreje" # todo: NEW TRANSLATION
 JAP_claiming_north_korea_desc: "Režim v Pchjongjangu není sousedem, ale trvalou krizí ohrožující naše moře a města. Formalizujeme japonský nárok na utváření budoucnosti severního poloostrova a budeme s ní zacházet jako s bezpečnostní otázkou, kterou nelze přenechat jiným. Jakmile bude vyhlášena, Sever se stane problémem řízeným podle japonských podmínek." # todo: NEW TRANSLATION
 JAP_claiming_taiwan: "Znovu prosadit náš mandát nad Tchaj-wanem" # todo: NEW TRANSLATION
 JAP_claiming_taiwan_desc: "Tchaj-wan leží na kloubu prvního ostrovního řetězce a v hrdle naší námořní bezpečnosti. Znovu prosadíme japonský mandát nad ostrovem a jeho status představíme jako strategickou nutnost, nikoli jako otázku pro vzdálené mocnosti. Jakmile bude mandát vyhlášen, Japonsko bude budoucnost Tchaj-wanu považovat za neoddělitelnou od vlastní." # todo: NEW TRANSLATION
 JAP_claiming_philippines: "Vznést nárok na Filipínské souostroví" # todo: NEW TRANSLATION
 JAP_claiming_philippines_desc: "Filipínské souostroví ovládá přístupy k západnímu Pacifiku a námořní trasy zásobující náš průmysl. Vzneseme formální nárok a dáme jasně najevo, že tyto ostrovy spadají do japonské strategické sféry, ať se to ostatním líbí, nebo ne. Jakmile bude nárok vyhlášen, region pochopí, že naše námořnictvo hodlá rozhodovat o tom, kdo těmito vodami propluje." # todo: NEW TRANSLATION
 JAP_claiming_malaysia: "Vznést nárok na Malajsko" # todo: NEW TRANSLATION
 JAP_claiming_malaysia_desc: "Malajsko leží přes klíčové průlivy a zásobovací trasy, které rozhodují o toku obchodu a paliva v regionu. Vzneseme formální nárok a jeho status představíme jako otázku japonské bezpečnosti a námořního řádu. Každé jednání pak začne s naším mandátem na stole." # todo: NEW TRANSLATION
 JAP_claiming_indonesia: "Prosadit mandát v Indonésii" # todo: NEW TRANSLATION
 JAP_claiming_indonesia_desc: "Indonésie kontroluje ostrovy a úzká hrdla spojující Indický a Tichý oceán. Prosadíme mandát nad souostrovím a jeho námořní trasy a zdroje budeme považovat za strategickou nutnost Japonska. Má-li mít region řád, bude vynucován z Tokia." # todo: NEW TRANSLATION
 JAP_claiming_vietnam: "Vyhlásit náš zájem o Vietnam" # todo: NEW TRANSLATION
 JAP_claiming_vietnam_desc: "Vietnam kotví okraj Jihočínského moře a nabízí základny schopné ovlivnit rovnováhu celého pobřeží. Vyhlásíme japonský nárok na zájem a dáme najevo, že jeho směřování se nerozhodne bez nás. Vliv začíná jistotou a jistota začíná nárokem." # todo: NEW TRANSLATION
 JAP_claiming_cambodia: "Rozšířit sféru na Kambodžu" # todo: NEW TRANSLATION
 JAP_claiming_cambodia_desc: "Kambodža je malá, avšak díky geografii představuje koridor, nárazník a páku v pevninské jihovýchodní Asii. Rozšíříme svůj nárok a připoutáme její budoucnost k širší japonské sféře. To, co na mapě vypadá nepatrně, může rozhodnout o stabilitě regionu." # todo: NEW TRANSLATION
 JAP_claiming_laos: "Vznést nárok na mekongské zázemí" # todo: NEW TRANSLATION
 JAP_claiming_laos_desc: "Laos kontroluje pozemní trasy, řeky a tiché zázemí za pobřežím. Vzneseme nárok na mekongské zázemí jako součást naší kontinentální bezpečnosti a zajistíme, aby ho soupeři nemohli využít jako zadní vrátka do naší sféry. Kontrola nejsou jen přístavy, ale i koridory." # todo: NEW TRANSLATION
 JAP_claiming_australia: "Vyhlásit nárok na Austrálii" # todo: NEW TRANSLATION
 JAP_claiming_australia_desc: "Austrálie je jižní kotvou Pacifiku, kontinentem schopným hostit flotily, letectvo a logistiku dlouhé války. Vyhlásíme nárok a naznačíme, že jižní přístupy nezůstanou mimo strategický dosah Japonska. Pokud zajistíme jih, oceán bude následovat." # todo: NEW TRANSLATION
 JAP_claiming_new_zealand: "Vznést nárok na jižní předpolí" # todo: NEW TRANSLATION
 JAP_claiming_new_zealand_desc: "Nový Zéland může být vzdálený, ale leží na trasách důležitých, jakmile se Pacifik stane sporným. Vzneseme nárok na jižní předpolí a odepřeme soupeřům bezpečný týl mimo náš dosah. I vzdálené ostrovy se stanou zbraněmi, pokud je drží jiní." # todo: NEW TRANSLATION
 JAP_claiming_myanmar: "Prosadit kontrolu nad iravádskou bránou" # todo: NEW TRANSLATION
 JAP_claiming_myanmar_desc: "Myanmar je pozemním mostem mezi oceány a branou do vnitrozemí regionu. Vzneseme nárok a jeho přístavy, koridory i letiště budeme považovat za strategická aktiva japonské sféry. Kdo drží bránu, rozhoduje o tom, kdo vstoupí." # todo: NEW TRANSLATION
 JAP_demand_palau: "Požadovat Palau" # todo: NEW TRANSLATION
 JAP_demand_palau_desc: "Palau je malé souostroví s velkým významem pro námořní plánování, nabízí kotviště, dohled a dosah. Požadujeme jeho podřízení japonské autoritě a zajistíme je jako předsunutou základnu pacifického řádu. Mapa se píše základnami, nikoli projevy." # todo: NEW TRANSLATION
 JAP_demand_micronesia: "Požadovat Mikronésii" # todo: NEW TRANSLATION
 JAP_demand_micronesia_desc: "Mikronésie leží ve středním Pacifiku jako kameny v moři pro flotily a letadla. Požadujeme kontrolu, abychom zajistili tranzitní trasy a odepřeli soupeřům odrazové základny v našem oceánu. Jakmile budou ostrovy drženy, promění vzdálenost ve výhodu." # todo: NEW TRANSLATION
 JAP_demand_nauru: "Požadovat Nauru" # todo: NEW TRANSLATION
 JAP_demand_nauru_desc: "Nauru je maličké, ale podobné ostrovy rozhodují o pokrytí průzkumem a přístupu přes rozsáhlé vody. Požadujeme jeho sladění s Japonskem a začleníme ho do sítě našich předsunutých stanovišť. V námořním věku není žádný ostrov bezvýznamný." # todo: NEW TRANSLATION
 JAP_demand_kiribati: "Požadovat Kiribati" # todo: NEW TRANSLATION
 JAP_demand_kiribati_desc: "Kiribati se rozkládá přes klíčové přístupy, které mohou podporovat průzkum, doplňování paliva a zachytávání. Požadujeme jeho podřízení japonskému vedení a zajistíme ostrovy jako článek širšího perimetru. Pacifik bude organizován, jeden článek po druhém." # todo: NEW TRANSLATION
 JAP_demand_marshall_islands: "Požadovat Marshallovy ostrovy" # todo: NEW TRANSLATION
 JAP_demand_marshall_islands_desc: "Marshallovy ostrovy poskytují prostor pro letiště, logistiku a kontrolu tras ve středním Pacifiku. Požadujeme jejich převedení do japonské sféry a proměníme je v opevněné stupně pro operace flotily. Kdo drží tyto atoly, může utvářet celé bojiště." # todo: NEW TRANSLATION
 JAP_demand_tuvalu: "Požadovat Tuvalu" # todo: NEW TRANSLATION
 JAP_demand_tuvalu_desc: "Tuvalu nabízí málo půdy, avšak nabízí přítomnost, a přítomnost rozhoduje o kontrole moře. Požadujeme sladění Tuvalu a zajistíme je jako odposlouchávací stanoviště a zastávku v jižním Pacifiku. I nejmenší ostrovy mohou ukotvit perimetr." # todo: NEW TRANSLATION
 JAP_demand_solomon_islands: "Požadovat Šalomounovy ostrovy" # todo: NEW TRANSLATION
 JAP_demand_solomon_islands_desc: "Šalomounovy ostrovy jsou přirozenou bariérou a opěrným bodem v jihozápadním Pacifiku, ideálním pro letiště a námořní krytí. Požadujeme jejich podřízení Japonsku a uzavřeme trasy, které jimi procházejí. Kontrola zde znamená kontrolu pohybu." # todo: NEW TRANSLATION
 JAP_demand_guinea: "Požadovat Novou Guineu" # todo: NEW TRANSLATION
 JAP_demand_guinea_desc: "Nová Guinea je bastionem kontinentální velikosti, který dominuje přístupům mezi jihovýchodní Asií a Pacifikem. Požadujeme její převedení a proměníme ji v pevnost letectva, logistiky a předsunuté obrany. Jakmile bude Nová Guinea zajištěna, jižní bojiště se podřídí naší vůli." # todo: NEW TRANSLATION
 JAP_demand_vanuatu: "Požadovat Vanuatu" # todo: NEW TRANSLATION
 JAP_demand_vanuatu_desc: "Vanuatu leží na trasách důležitých pro zásobování a dosah do jihozápadního Pacifiku. Požadujeme jeho sladění s Japonskem a začleníme ho do naší sítě základen. Řetěz ostrovů se stane zdí, pokud bude držen pohromadě." # todo: NEW TRANSLATION
 JAP_demand_fiji: "Požadovat Fidži" # todo: NEW TRANSLATION
 JAP_demand_fiji_desc: "Fidži je centrálním uzlem jižního Pacifiku, schopným podporovat logistiku flotily a letecké operace v širokém oblouku. Požadujeme jeho podřízení Japonsku a zajistíme ho jako základní kámen jižního perimetru. Jakmile bude Fidži naše, rovnováha regionu se posune." # todo: NEW TRANSLATION
 JAP_demand_samoa: "Požadovat Samou" # todo: NEW TRANSLATION
 JAP_demand_samoa_desc: "Samoa leží na trasách spojujících střední Pacifik s jižními přístupy. Požadujeme sladění Samoy s Japonskem a začleníme její přístavy a letiště do širšího perimetru. V oceánské říši se i vzdálené ostrovy stávají rozhodujícími." # todo: NEW TRANSLATION
 JAP_demand_tonga: "Požadovat Tongu" # todo: NEW TRANSLATION
 JAP_demand_tonga_desc: "Tonga nabízí strategické předmostí v jižním Pacifiku a platformu ke sledování pohybu na rozsáhlých vodách. Požadujeme její podřízení japonskému vedení a zajistíme ji jako součást jižního řetězce kontroly. Neutralita je luxus, který na našich námořních trasách nedovolíme." # todo: NEW TRANSLATION
 JAP_demand_american_islands: "Požadovat americké ostrovy" # todo: NEW TRANSLATION
 JAP_demand_american_islands_desc: "Ostrovy držené Amerikou nejsou jen územím, ale předsunutými základnami promítajícími sílu do našeho oceánu. Požadujeme jejich převod nebo neutralizaci pod japonskou autoritou a odepřeme Washingtonu odrazové základny u našich dveří. Má-li být Pacifik uspořádán, cizí opěrné body musí zmizet." # todo: NEW TRANSLATION
 JAP_demand_french_islands: "Požadovat francouzské ostrovy" # todo: NEW TRANSLATION
 JAP_demand_french_islands_desc: "Francouzské ostrovní državy poskytují dosah, přístavy a diplomatické krytí zahraniční přítomnosti v Pacifiku. Požadujeme jejich podřízení Japonsku a začleníme je do sítě předsunutých stanovišť a koridorů. Naše sféra nebude proděravěna vzdálenými říšemi." # todo: NEW TRANSLATION
 JAP_demand_british_islands: "Požadovat britské ostrovy" # todo: NEW TRANSLATION
 JAP_demand_british_islands_desc: "Britské ostrovní državy jsou pozůstatkem staršího řádu, stále však nabízejí základny a vliv na kritických trasách. Požadujeme jejich převedení do japonské sféry a uzavřeme další mezeru v námořním perimetru. Pacifik bude organizován pod jedinou autoritou, naší." # todo: NEW TRANSLATION
 JAP_imperial_procurement_standardization: "Standardizace císařských nákupů" # todo: NEW TRANSLATION
 JAP_imperial_procurement_standardization_desc: "Centralizovat pravidla nákupů, standardizovat komponenty a prosadit společné specifikace napříč ozbrojenými silami. Cílem je rychlejší výroba, jednodušší logistika a méně výrobních úzkých hrdel." # todo: NEW TRANSLATION
 JAP_zaibatsu_empowerment_charter: "Charta posílení zaibacu" # todo: NEW TRANSLATION
 JAP_zaibatsu_empowerment_charter_desc: "Udělit vybraným průmyslovým konglomerátům rozšířená privilegia výměnou za závazné výrobní cíle stanovené císařskou vládou." # todo: NEW TRANSLATION
 JAP_neighborhood_associations_system: "Systém sousedských sdružení" # todo: NEW TRANSLATION
 JAP_neighborhood_associations_system_desc: "Obnovit celostátní síť místních sdružení pro registraci domácností, koordinaci distribuce a podporu rychlé mobilizace. Posílí sociální kontrolu a zlepší schopnost státu reagovat." # todo: NEW TRANSLATION
 JAP_state_rites_restoration: "Obnova státních obřadů" # todo: NEW TRANSLATION
 JAP_state_rites_restoration_desc: "Obnovit státní ceremonie a veřejné obřady jako ústřední pilíř národního života. Reforma posílí císařskou legitimitu a podpoří veřejné přizpůsobení obnovenému řádu." # todo: NEW TRANSLATION
 JAP_national_morals_education_act: "Zákon o národní morálce a vzdělávání" # todo: NEW TRANSLATION
 JAP_national_morals_education_act_desc: "Standardizovat občanské vzdělávání kolem povinnosti, služby a národní soudržnosti. Školy budou využity k budování disciplíny, rozšíření připravenosti a podpoře loajality k obnovenému státu." # todo: NEW TRANSLATION
 JAP_imperial_rescript_revival: "Obnova císařského reskriptu" # todo: NEW TRANSLATION
 JAP_imperial_rescript_revival_desc: "Obnovit oficiální císařský reskript, který ukotví legitimitu státu a vymezí povinnosti občana. Obnovený řád bude představen jako návrat k jednotě, povinnosti a národnímu poslání." # todo: NEW TRANSLATION
 JAP_north_korean_remilitarized_dmz: "Reagovat na eskalaci demilitarizovaného pásma Severní Koreje" # todo: NEW TRANSLATION
 JAP_north_korean_remilitarized_dmz_desc: "Severní Korea posílila pozice podél demilitarizovaného pásma. Tokio využije tuto eskalaci k utažení bezpečnostního postoje a rozšíření operační volnosti podle článku 9." # todo: NEW TRANSLATION
 JAP_north_korean_increased_nuclear_testing: "Reagovat na jaderné testy Severní Koreje" # todo: NEW TRANSLATION
 JAP_north_korean_increased_nuclear_testing_desc: "Obnovené tempo jaderných testů zvýšilo regionální hrozbu. Vláda toho využije k ospravedlnění přísnějšího výkladu článku 9 a urychlení opatření připravenosti." # todo: NEW TRANSLATION
 JAP_north_korean_threats_to_south_korea: "Reagovat na hrozby Severní Koreje" # todo: NEW TRANSLATION
 JAP_north_korean_threats_to_south_korea_desc: "Přímé hrozby vůči Korejské republice zvyšují riziko širšího konfliktu, který by mohl zasáhnout japonský bezpečnostní perimetr. Tokio může rozšířit výklad článku 9 a posílit plánování odstrašení." # todo: NEW TRANSLATION
 JAP_north_korean_road_to_war: "Připravit se na pochod Severní Koreje k válce" # todo: NEW TRANSLATION
 JAP_north_korean_road_to_war_desc: "Situace sklouzává k otevřenému konfliktu. Japonsko se již nemůže spoléhat pouze na zdrženlivost. Revidovaný výklad článku 9 umožní robustnější vojenské plánování a rychlejší možnosti reakce." # todo: NEW TRANSLATION
 JAP_russian_agressiveness: "Reagovat na ruskou agresivitu" # todo: NEW TRANSLATION
 JAP_russian_agressiveness_desc: "Stále asertivnější postoj Ruska v severovýchodní Asii podkopává regionální stabilitu. Tokio využije zhoršeného bezpečnostního prostředí k posílení odstrašení a rozšíření operační volnosti podle článku 9." # todo: NEW TRANSLATION
 JAP_defence_russian_asian_ambitions: "Čelit ruským asijským ambicím" # todo: NEW TRANSLATION
 JAP_defence_russian_asian_ambitions_desc: "Ambice Moskvy v Asii ohrožují japonské bezpečnostní prostředí a rovnováhu sil v Pacifiku. Tokio posílí obranný postoj a rozšíří operační možnosti podle článku 9." # todo: NEW TRANSLATION
 JAP_russian_north_korean_alliance: "Připravit se na rusko-severokorejskou osu" # todo: NEW TRANSLATION
 JAP_russian_north_korean_alliance_desc: "Užší sblížení Ruska a Severní Koreje by zvýšilo tlak na Japonsko z více směrů. Tokio odpoví posílením odstrašení a uvolněním zbývajících omezení podle článku 9." # todo: NEW TRANSLATION
 JAP_russian_pacific_naval_presence: "Odpovědět na ruské námořní posilování v Pacifiku" # todo: NEW TRANSLATION
 JAP_russian_pacific_naval_presence_desc: "Ruský námořní postoj v Pacifiku je stále asertivnější. Japonsko tento posun využije k ospravedlnění rozšířené námořní připravenosti a pružnějšího výkladu článku 9." # todo: NEW TRANSLATION
 JAP_tookover_sikhalin_mission: "Lhůta pro znovuzískání ztracených území" # todo: NEW TRANSLATION
 JAP_tookover_sikhalin_mission_desc: "Čas se krátí. Pokud Rusko před uplynutím lhůty znovu nezíská požadované cíle, mezinárodní tlak a domácí vyčerpání vynutí urovnání. Bude podepsán mír a ztracená území postoupena jako cena za ukončení války." # todo: NEW TRANSLATION
 JAP_russia_demands_peace_japan: "Mírové urovnání s Ruskem" # todo: NEW TRANSLATION
 JAP_russia_demands_peace_japan_desc: "S Kurilskými ostrovy a Sachalinem pevně pod japonskou kontrolou předložilo Tokio návrh na ukončení války. Nabídka je jednoduchá a promyšlená: mír výměnou za ruské uznání nové skutečnosti na severu. Není to akt dobročinnosti, ale strategické urovnání, které zajistí naše zisky a oběma národům ušetří náklady dlouhého konfliktu. Přijetí ukončí válku a formalizuje naši kontrolu nad dobytými územími. Odmítnutí by znamenalo, že Moskva je ochotna pokračovat ve válce, o níž si již není jistá, že ji vyhraje." # todo: NEW TRANSLATION
 JAP_russia_demands_peace_russia: "Požadovat mír od Japonska" # todo: NEW TRANSLATION
 JAP_russia_demands_peace_russia_desc: "Požadujeme s Japonskem urovnání, které ukončí boje a zmrazí situaci, než se zhorší. Není to usmíření, ale kontrola škod, která zakotví podmínky, dokud máme dostatečnou páku k vynucení výsledku. Pokud Tokio odmítne, budeme vědět, že usiluje o vítězství, nikoli o mír." # todo: NEW TRANSLATION
 JAP_auto_claiming_tt: "Po zvolení tohoto rozhodnutí se bude opakovat, dokud nebudou vzneseny nároky na všechny jádrové státy. Poté můžete požadovat podrobení" # todo: NEW TRANSLATION
 JAP_claiming_taiwan_tt: "Tímto se najednou vznese japonský nárok na každý tchajwanský ostrovní stát. Jakmile budou nároky zavedeny, dokončete zaměření a požadujte podrobení Tchaj-wanu." # todo: NEW TRANSLATION
 JAP_intellectual_platform_decision: "$JAP_intellectual_platform$" # todo: NEW TRANSLATION
 JAP_intellectual_platform_decision_desc: "$JAP_intellectual_platform_desc$" # todo: NEW TRANSLATION
 intellectual_platform_rejected: "Čínsko-korejsko-japonská intelektuální platforma odmítnuta" # todo: NEW TRANSLATION
 JAP_declining_birthrate_category: "Agentura pro opatření proti klesající porodnosti" # todo: NEW TRANSLATION
 JAP_declining_birthrate_category_desc: "Populační krize Japonska má mnoho podob: počet narození zaostává za počtem úmrtí, podíl důchodců každoročně roste a populace v produktivním věku se zmenšuje a nedokáže se obnovovat. Bez koordinované akce se tlak přelévá do nabídky práce, solventnosti důchodového systému, stability státu a hospodářské životaschopnosti venkovských prefektur. Neexistuje jediné rychlé řešení, pouze trvalá a komplexní reforma napříč více oblastmi politiky.\n\nRozhodnutí zde dostupná mají fungovat společně s demografickými větvemi zaměření. Každé cílí na jednu či více dimenzí krize (deficit porodnosti, nedostatek pracovní síly, hranici nezaměstnanosti, zátěž zdravotních nákladů, zátěž sociálních nákladů nebo erozi stability) a každé se samo deaktivuje, jakmile se jeho cílová podmínka zlepší, aby se zabránilo nadměrnému využívání jediného nástroje.\n\n§YPokrok se zobrazuje v národním duchu §!§G$JAP_demographic_pressure_modifier$§!§Y: jak se dokončují demografická zaměření a přijímají příslušná rozhodnutí, postihy modifikátoru se postupně zmírňují směrem k nule. Dlouhodobé zanedbávání umožní tlaku přetrvávat nebo se zhoršovat a oslabovat stabilitu i hospodářskou kapacitu.§!" # todo: NEW TRANSLATION
 JAP_demographic_emergency_taskforce: "Nouzová reakce na klesající porodnost" # todo: NEW TRANSLATION
 JAP_demographic_emergency_taskforce_desc: "V reakci na demografický kolaps vláda vytvořila mezirezortní nouzovou pracovní skupinu, která napodobuje strukturu Agentury pro děti a rodiny a koordinuje rychlé nasazení zdrojů napříč všemi relevantními ministerstvy. Politická pozornost je intenzivní, byrokratické bariéry se odstraňují a vzniká prostor pro náhlou vlnu experimentování s politikami. Toto období intenzivního soustředění a mobilizace je dočasné; po 730 dnech trvalého úsilí nouzová atmosféra opadne a tvorba politik se vrátí k běžným institucionálním vzorcům, ačkoli samotné reformy přetrvají." # todo: NEW TRANSLATION
 JAP_increase_birth_budget: "Nouzové zdvojnásobení přídavků na děti" # todo: NEW TRANSLATION
 JAP_increase_birth_budget_desc: "Japonsko vloží do systému přídavků na děti nouzové prostředky státní pokladny a zdvojnásobí přímé peněžní převody domácnostem s dětmi. Toto okamžité a viditelné vynakládání prostředků poskytne mladým rodinám úlevu a vyšle signál státní podpory rodičovství, čímž krátkodobě zvýší porodnost. Dlouhodobé náklady budou značné a trvale rozšíří rozpočet nárokových výdajů, demografické přínosy však ospravedlňují výdaje, dokud porodnost zůstává nízká." # todo: NEW TRANSLATION
 JAP_child_care_subsidies: "Univerzálně bezplatné vzdělávání a péče v raném dětství" # todo: NEW TRANSLATION
 JAP_child_care_subsidies_desc: "Po vzoru politiky z října 2019 Japonsko zpřístupní vzdělávání a péči v raném dětství zdarma všem rodinám a odstraní školné v jeslích i předškolních zařízeních. Dotace odstraňuje hlavní překážku zaměstnanosti rodičů, uvolňuje pečující osoby, především matky, pro návrat na pracovní trh a umožňuje domácnostem s omezeným příjmem mít více dětí. Program je nákladný, přináší však zisky v zaměstnanosti i mírné zlepšení plodnosti." # todo: NEW TRANSLATION
 JAP_invest_in_robotics: "Automatizační ofenziva Společnosti 5.0" # todo: NEW TRANSLATION
 JAP_invest_in_robotics_desc: "Japonsko urychlí Novou robotickou strategii z roku 2015 a bude dotovat průmyslovou automatizaci, umělou inteligenci a robotiku, aby nahradilo chybějící pracovníky. Nahrazením lidské práce ve stavebnictví, výrobě a logistice stroji může Japonsko udržet výkon s menší pracovní silou. Strategie je kapitálově náročná a účinná, avšak přesun nízkokvalifikovaných pracovníků může zpočátku zvýšit nezaměstnanost, než vzniknou nové role v provozu a údržbě." # todo: NEW TRANSLATION
 JAP_fertility_ivf_program: "Pojištění mimotělního oplodnění" # todo: NEW TRANSLATION
 JAP_fertility_ivf_program_desc: "Japonsko rozšíří pojistné krytí mimotělního oplodnění (IVF) a asistované reprodukční technologie a zpřístupní léčbu všem oprávněným párům bez ohledu na příjem. Od roku 2022 odstraňují pojistné dotace ekonomickou překážku léčby neplodnosti a umožňují mít děti párům, které by jinak zůstaly bezdětné. Dopad na porodnost je silný, avšak náklady zdravotního systému prudce rostou a zatěžují veřejné finance." # todo: NEW TRANSLATION
 JAP_family_housing_construction: "Program dostupného rodinného bydlení" # todo: NEW TRANSLATION
 JAP_family_housing_construction_desc: "Japonsko bude financovat rozsáhlou výstavbu dostupného bydlení rodinné velikosti určeného domácnostem vychovávajícím děti. Vysoké náklady na půdu a bydlení jsou významnou překážkou zakládání rodin; dotovaná výstavba snižuje finanční práh pro mladé páry, aby se vzaly a měly děti. Program je kapitálově náročný, stabilizuje však společnost tím, že mladým rodinám nabízí věrohodnou cestu k vlastnictví bydlení a signalizuje státní závazek k jejich budoucnosti." # todo: NEW TRANSLATION
 JAP_marriage_support_program: "Iniciativa podpory novomanželů" # todo: NEW TRANSLATION
 JAP_marriage_support_program_desc: "Japonsko bude dotovat novomanželské páry prostřednictvím příspěvků na bydlení a seznamovacích služeb, včetně financování programů konkacu (hledání partnera pro sňatek) a seznamovacích platforem s umělou inteligencí. Stát bude také spolupracovat s místními samosprávami na organizaci komunitních seznamovacích akcí. Snížením finančního a společenského tření kolem uzavírání manželství program mírně zvýší porodnost s nižšími fiskálními náklady než samotné pobídky k rodičovství." # todo: NEW TRANSLATION
 JAP_raise_retirement_age: "Zákon o stabilizaci zaměstnanosti starších lidí" # todo: NEW TRANSLATION
 JAP_raise_retirement_age_desc: "Japonsko bude postupně zvyšovat oficiální důchodový věk směrem k 70 letům, prodlouží povinné odvody ze zaměstnání a odloží nárok na důchod. Podle legislativy z roku 2021 bude stát motivovat zaměstnavatele k udržení starších pracovníků a tlačit na ně, aby nabízeli pokračování zaměstnání po tradiční hranici 65 let. Politicky je to bolestivé, pracovníci se bouří proti dalším rokům práce a vláda musí vynaložit politický kapitál, aby opatření prosadila, pracovní síla se však přímo rozšíří a důchodové břemeno zmírní." # todo: NEW TRANSLATION
 JAP_silver_employment_initiative: "Centra lidských zdrojů pro seniory" # todo: NEW TRANSLATION
 JAP_silver_employment_initiative_desc: "Japonsko zřídí a bude financovat Centra lidských zdrojů pro seniory v každém větším městě a nabídne zdravým lidem starším 65 let zprostředkování částečných úvazků, rekvalifikaci a mentoring. Tato centra spojí zkušené důchodce se zaměstnavateli, kteří potřebují pružnou pracovní sílu v úklidu, bezpečnosti, podpoře péče o děti a administrativě. Program je levný, zachovává důstojnost a přidává produktivní pracovníky bez zvyšování povinného důchodového věku, čímž mírně zmírňuje tlak nezaměstnanosti." # todo: NEW TRANSLATION
 JAP_preventive_health_program: "Iniciativa zdravé délky života" # todo: NEW TRANSLATION
 JAP_preventive_health_program_desc: "Japonsko investuje do celopopulační preventivní zdravotní péče: dotovaných screeningů, očkování, poradenství v oblasti životního stylu a včasných zásahů proti chronickým nemocem. Tím, že udrží stárnoucí populaci déle zdravou a funkčně nezávislou, stát omezí roky strávené v nákladné intenzivní péči a pobytu v domovech. Program je čistě preventivní a přináší vysokou návratnost v podobě nižších zdravotních nákladů, protože senioři zůstávají aktivní a soběstační do osmdesáti let." # todo: NEW TRANSLATION
 JAP_elderly_care_reform: "Modernizace systému dlouhodobé péče" # todo: NEW TRANSLATION
 JAP_elderly_care_reform_desc: "Japonsko restrukturalizuje systém pojištění dlouhodobé péče a přesune se od institucionální péče v domovech k integrované komunitní péči: domácím pečovatelům, denním centrům, místním klinikám a podpoře rodin namísto nákladných pobytových zařízení. Omezením závislosti na drahých institucích a mobilizací komunit stát sníží rozpočty zdravotní i sociální péče. Přechod bude rušivý, někteří přijdou o preferovanou institucionální péči a správa bude během změny zatížená, dlouhodobé úspory však budou značné." # todo: NEW TRANSLATION
 JAP_territorial_disputes: "[JAP.GetNameWithFlag] a jeho územní spory" # todo: NEW TRANSLATION
 JAP_territorial_disputes_desc: "[JAP.GetName] v současnosti vede územní spory se sousedními zeměmi o tři následující oblasti:\n\n§YSeverní teritoria (Jižní Kurily)§!: [JAP.GetName] si nárokuje ostrovy Iturup, Kunašir, Šikotan a skupinu Habomai severovýchodně od Hokkaida. Tvrdí, že jejich okupace Sovětským svazem po druhé světové válce byla nelegitimní, a nadále usiluje o jejich návrat od [SOV.GetName]. [SOV.GetName] naopak tvrdí, že ostrovy jsou jeho územím a udržuje nad nimi účinnou kontrolu.\n\n§YTakeshima ([KOR.GetAdjective] název: Tokdo)§!: Tento ostrov, nacházející se v Japonském moři (Východním moři), si nárokuje [JAP.GetName], avšak od 50. let je pod faktickou kontrolou [KOR.GetName]. Spor zůstává mezi oběma zeměmi vysoce citlivou otázkou, která zahrnuje historické výklady a rybolovná práva.\n§YProtože je Takeshima příliš malá, aby byla zobrazena na mapě, ani úspěšné jednání nepovede k územním ziskům. Přesto získáte níže popsané modifikátory!§!\n\n§YSenkaku (čínský název: Diaoyu)§!: Tato skupina neobydlených ostrůvků ve Východočínském moři je od roku 1895 pod faktickou kontrolou [JAP.GetName], nárokují si ji však také [CHI.GetName] a [TAI.GetName]. Od 90. let vedly opakované diplomatické protesty a konkurenční nároky k tomu, že se otázka stala možným ohniskem budoucího napětí.\n\nVšechny tyto spory jsou hluboce propojeny s historií, mezinárodním právem, faktickou kontrolou, diplomatickými vztahy a domácím veřejným míněním. Jejich řešení vyžaduje užší vazby a vzájemné porozumění mezi zúčastněnými zeměmi.\n\n§YTip: Zvýšení mínění cílové země nebo posílení vašeho vlivu v ní zvýší pravděpodobnost úspěchu jednání!§!\n\n§YOdměna:§! Pokud jednání uspějí, můžete získat modifikátory k §G$MODIFIER_STABILITY_FACTOR$§! a §G$agriculture_district_income_tax_modifier$§!!" # todo: NEW TRANSLATION
 JAP_territorial_disputes_TT: "Pokud jednání uspějí, můžete kromě vyřešení územní otázky získat bonusy k §G$MODIFIER_STABILITY_FACTOR$§! a §G$agriculture_district_income_tax_modifier$§!!" # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_northern_territories_dispute: "Jednání o vyřešení sporu o Severní teritoria" # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_northern_territories_dispute_desc: "Územní otázka Severních teritorií zůstává jedním z nejvýznamnějších nevyřešených problémů poválečné diplomacie mezi [JAP.GetName] a [SOV.GetName]. Přímé řešení této otázky a snaha o mírové urovnání jsou klíčové pro obnovení suverenity [JAP.GetName] a zajištění stability na Dálném východě. Pokud vznikne dostatečná vzájemná důvěra a vhodné podmínky, můžeme zahájit formální diplomatická jednání s [SOV.GetName] a požádat o navrácení území." # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_senkaku_dispute_china: "Jednání o vyřešení sporu o Senkaku s [CHI.GetName]" # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_senkaku_dispute_china_desc: "Územní nároky [CHI.GetName] na ostrovy Senkaku se staly destabilizačním faktorem ve vztazích [JAP.GetName]-[CHI.GetName]. Jako země vykonávající nad ostrovy faktickou kontrolu se [JAP.GetName] snaží otázku vyřešit diplomaticky a přesvědčit [CHI.GetName], aby svůj nárok stáhla. S potřebnou vzájemnou důvěrou a mezinárodním vlivem jsme nyní připraveni zahájit přímá jednání s [CHI.GetName]." # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan: "Jednání o vyřešení sporu o Senkaku s [TAI.GetName]" # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan_desc: "Územní nárok [TAI.GetName] na ostrovy Senkaku se stal možnou překážkou vzájemné důvěry a spolupráce mezi [JAP.GetName] a [TAI.GetName]. Abychom získali diplomatické uznání faktické kontroly [JAP.GetName] nad ostrovy, jsme nyní připraveni vstoupit do mírových jednání s [TAI.GetAdjective] představiteli." # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_takeshima_dispute: "Jednání o vyřešení sporu o Takeshimu" # todo: NEW TRANSLATION
 JAP_dec_negotiations_resolve_takeshima_dispute_desc: "Územní spor s [KOR.GetName] o Takeshimu je dlouhodobě významnou překážkou japonsko-korejských vztahů. Náš národ je připraven formálně navrhnout [KOR.GetAdjective] vládě územní jednání a hledat řešení prostřednictvím klidné a upřímné diplomacie." # todo: NEW TRANSLATION
 JAP_base_okinawa_decision: "Budoucnost amerických sil na Okinawě" # todo: NEW TRANSLATION
 JAP_base_okinawa_decision_desc: "Okinawa zůstává domovem značného počtu amerických vojenských základen, které ovlivňují bezpečnostní rámec Japonska i místní komunity.\nJaponská vláda nyní zkoumá možnosti přehodnocení současného uspořádání s cílem dosáhnout větší bezpečnostní autonomie a snížit regionální zátěž.\nDiplomatické kontakty mohou přinést novou rovnováhu v bezpečnostním vztahu USA a Japonska.\n\nTip: §YVliv [JAP.GetName] v [USA.GetName]§! a §Yvliv [USA.GetName] v [JAP.GetName]§! ovlivňují úspěšnost jednání. Úspěšnost lze také zvýšit §Yvyřešením rovnováhy sil kolem článku 9§! nebo §Yzvýšením vojenských výdajů alespoň na $defence_04$§!!" # todo: NEW TRANSLATION
 JAP_negotiation_base_okinawa: "Zahájit jednání o stažení USA z Okinawy" # todo: NEW TRANSLATION
 JAP_negotiation_base_okinawa_desc: "Pro posílení národní bezpečnostní autonomie zahájí Japonsko diplomatická jednání o stažení amerických vojenských sil rozmístěných na Okinawě. Tento krok má přehodnotit současná bezpečnostní ujednání a prozkoumat pružnější rámec s ohledem na měnící se regionální dynamiku." # todo: NEW TRANSLATION
 Japan.101.t: "Rozpuštění sněmovny: podrobení našeho mandátu zkoušce" # todo: NEW TRANSLATION
 Japan.101.d: "Debata o privatizaci poštovních služeb narazila v parlamentu na silný odpor a jednání jsou stále napjatější. I uvnitř strany zůstávají silné opatrné i opoziční hlasy: někteří tvrdí, že bychom měli postupovat prostřednictvím úprav a revizí, zatímco jiní trvají na tom, že nastal čas tuto otázku vyjasnit a požádat o rozhodnutí veřejnost.\nPokud rozpustíme Sněmovnu reprezentantů a uspořádáme všeobecné volby, podrobíme samotnou reformu přímé zkoušce. Zároveň se politický kalendář rychle posune směrem k volbám a zvýšenému politickému napětí se nebude možné vyhnout.\n\nMěli bychom přistoupit k rozpuštění sněmovny a vyhlášení všeobecných voleb?" # todo: NEW TRANSLATION
 Japan.101.a: "Rozpusťme Sněmovnu reprezentantů." # todo: NEW TRANSLATION
 Japan.101.b: "Nerozpouštějme ji." # todo: NEW TRANSLATION
 Japan.103.t: "Vzestup levicových sil" # todo: NEW TRANSLATION
 Japan.103.d: "V době hospodářské stagnace, nejistoty zaměstnání a rostoucích obav o sociální zabezpečení rychle roste zájem o levicové síly, které požadují rozsáhlejší přerozdělování a podporu životních podmínek. Jako útočiště nespokojenosti se zavedenou politikou se jejich podpora šíří v různých regionech a také průzkumy veřejného mínění začínají ukazovat výrazný růst podpory levicových stran. V budoucí politické situaci bude přítomnost levice pravděpodobně nemožné ignorovat." # todo: NEW TRANSLATION
 Japan.103.a: "Příznivý vítr pro liberální síly" # todo: NEW TRANSLATION
 Japan.103.b: "Růst sociálnědemokratických sil" # todo: NEW TRANSLATION
 Japan.103.c: "Rozšíření vlivu komunistických sil" # todo: NEW TRANSLATION
 Japan.103.e: "Rychlý vzestup levicově populistických sil" # todo: NEW TRANSLATION
 Japan.104.t: "Vzestup pravicových sil" # todo: NEW TRANSLATION
 Japan.104.d: "Uprostřed rostoucích obav o bezpečnostní prostředí a narůstající nedůvěry v politiku se šíří podpora pravicovým silám, které požadují zachování pořádku, národní soběstačnost a důraz na tradiční hodnoty. Tyto postoje přitahují zájem širokého spektra voličů a průzkumy veřejného mínění také začínají ukazovat výrazný růst podpory pravicových stran. V budoucí politické situaci může přítomnost pravice ještě dále posílit." # todo: NEW TRANSLATION
 Japan.104.a: "Rozšířená podpora konzervativních sil" # todo: NEW TRANSLATION
 Japan.104.b: "Růst sociálnědemokratických sil" # todo: NEW TRANSLATION
 Japan.104.c: "Vzestup reformně-konzervativních sil" # todo: NEW TRANSLATION
 Japan.104.e: "Rozšířená podpora sil spojených s Obnovou" # todo: NEW TRANSLATION
 JAP_diplomacy.01.t: "Zahájení jednání o stažení amerických vojsk z Okinawy" # todo: NEW TRANSLATION
 JAP_diplomacy.01.d: "Po desetiletí byla přítomnost amerických sil v Japonsku základním kamenem poválečného bezpečnostního rámce země i regionální stability. S ohledem na měnící se geopolitické podmínky, změny veřejného mínění a rostoucí zájem Japonska o posílení vlastních obranných schopností však vláda dospěla k závěru, že musí znovu přezkoumat přítomnost americké armády na Okinawě. Jako první krok nyní začnou formální jednání se Spojenými státy." # todo: NEW TRANSLATION
 JAP_diplomacy.01.a: "Zahájit diplomatická jednání" # todo: NEW TRANSLATION
 JAP_diplomacy.02.t: "Japonská žádost o jednání o stažení vojsk" # todo: NEW TRANSLATION
 JAP_diplomacy.02.d: "Japonská vláda předložila formální žádost o zahájení jednání o stažení amerických sil umístěných na Okinawě. Návrh není svou povahou nepřátelský, ale je prezentován jako součást širšího přehodnocení obranného postoje Japonska a jeho měnících se bezpečnostních potřeb. Spojené státy nyní musí zvážit, jak odpovědět, a přitom vyvážit soudržnost aliance s dlouhodobými strategickými zájmy v regionu." # todo: NEW TRANSLATION
 JAP_diplomacy.02.a: "Přijmout žádost" # todo: NEW TRANSLATION
 JAP_diplomacy.02.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 JAP_diplomacy.03.t: "Dosaženo dohody: americké síly se stáhnou" # todo: NEW TRANSLATION
 JAP_diplomacy.03.d: "Po sérii diplomatických jednání dosáhly Japonsko a Spojené státy dohody o stažení amerických sil z Okinawy. Jde o zásadní okamžik ve vývoji japonské obranné politiky, který podtrhuje jeho touhu převzít větší odpovědnost za vlastní bezpečnost. Zatímco tím končí dosavadní rámec, zároveň se otevírá příležitost přehodnotit japonsko-americké vztahy a prozkoumat nové formy bezpečnostní spolupráce do budoucna." # todo: NEW TRANSLATION
 JAP_diplomacy.03.a: "Začíná nová kapitola bezpečnostní politiky" # todo: NEW TRANSLATION
 JAP_diplomacy.04.t: "Jednání selhala: stažení zamítnuto" # todo: NEW TRANSLATION
 JAP_diplomacy.04.d: "Americká vláda odmítla japonskou žádost o stažení vojsk z Okinawy. Stávající bezpečnostní uspořádání proto zůstane zachováno. Tento výsledek může v Japonsku vyvolat smíšené reakce a potenciálně podnítit debatu o autonomii země v obranných otázkách. Japonská vláda nyní musí přehodnotit svůj přístup a zároveň pokračovat ve sledování širšího regionálního i domácího vývoje." # todo: NEW TRANSLATION
 JAP_diplomacy.04.a: "Je čas zvážit náš další krok" # todo: NEW TRANSLATION
 JAP_diplomacy.05.t: "Ke společné paměti pro budoucnost" # todo: NEW TRANSLATION
 JAP_diplomacy.05.d: "Japonská vláda se rozhodla navrhnout vytvoření trilaterální intelektuální platformy pod záštitou OSN, jejímž cílem bude sdílet vzpomínky a poučení z minulých válek a předat budoucím generacím kulturu míru. Projekt bude zahrnovat muzea a digitální archivy, přičemž veškeré náklady ponese Japonsko. Návrh bude diplomatickou cestou oficiálně předložen Číně a Jižní Koreji." # todo: NEW TRANSLATION
 JAP_diplomacy.05.a: "Odeslat návrh" # todo: NEW TRANSLATION
 JAP_diplomacy.06.t: "Japonský návrh: sdílení minulosti a budoucnosti" # todo: NEW TRANSLATION
 JAP_diplomacy.06.d: "Japonská vláda navrhla pod záštitou OSN vytvoření trilaterální intelektuální platformy s Čínou a Jižní Koreou, která by uchovávala vzpomínky a poučení z války pro budoucí generace. Iniciativa zahrnuje výstavbu muzeí a digitálních archivů, přičemž veškeré náklady ponese Japonsko. Zvolíme spolupráci hledící do budoucnosti, nebo budeme dál setrvávat v nedůvěře? Naše rozhodnutí ovlivní budoucnost paměti ve východní Asii." # todo: NEW TRANSLATION
 JAP_diplomacy.06.a: "Přijmout návrh" # todo: NEW TRANSLATION
 JAP_diplomacy.06.b: "Odmítnout návrh" # todo: NEW TRANSLATION
 JAP_diplomacy.08.t: "Trilaterální intelektuální platforma zahájena" # todo: NEW TRANSLATION
 JAP_diplomacy.08.d: "Čína i Jižní Korea návrh přijaly. Pod záštitou OSN byla trilaterální intelektuální platforma oficiálně zahájena. Prostřednictvím společných muzeí a archivů budou vzpomínky a poučení z války nyní předávány budoucím generacím. Může jít o významný první krok k usmíření a vzájemnému porozumění." # todo: NEW TRANSLATION
 JAP_diplomacy.08.a: "Nový krok směrem k budoucnosti" # todo: NEW TRANSLATION
 JAP_diplomacy.09.t: "Návrh byl odmítnut" # todo: NEW TRANSLATION
 JAP_diplomacy.09.d: "Bohužel byla naše zamýšlená intelektuální platforma odmítnuta. Je zřejmé, že usmíření si vyžádá více času a pokračující úsilí o budování důvěry." # todo: NEW TRANSLATION
 JAP_diplomacy.09.a: "Musíme počkat na další příležitost" # todo: NEW TRANSLATION
 JAP_news.01.t: "Prohlášení [JAP.GetLeader]: uznání historie" # todo: NEW TRANSLATION
 JAP_news.01.d: "Japonská vláda dnes vydala oficiální prohlášení premiéra [JAP.GetLeader], v němž vyjádřila hlubokou lítost a upřímnou omluvu za japonskou koloniální nadvládu a válečné činy v minulosti. Prohlášení zdůraznilo upřímný závazek budovat diplomatické vztahy orientované na budoucnost a odpovědně uchovávat historickou paměť. Projev přitáhl značnou pozornost doma i v zahraničí a očekává se, že ovlivní budoucí diplomacii ve východní Asii." # todo: NEW TRANSLATION
 JAP_news.01.a: "Naše odpovědnost za budoucnost." # todo: NEW TRANSLATION
 JAP_news.01.b: "Budoucí vývoj budeme pečlivě sledovat." # todo: NEW TRANSLATION
 JAP_diplomacy.34.t: "Návrh na rozšíření měnových swapových dohod" # todo: NEW TRANSLATION
 JAP_diplomacy.34.d: "Japonská vláda navrhla rozšíření měnové swapové dohody s naší zemí prostřednictvím iniciativy Chiang Mai s cílem posílit regionální finanční záchrannou síť. Zajištění likvidity v krizových obdobích může pomoci uklidnit obavy trhu a přispět k hospodářské stabilitě.\n\nMěli bychom tento návrh přijmout a podílet se na posílení finanční spolupráce?" # todo: NEW TRANSLATION
 JAP_diplomacy.34.a: "Přijmout" # todo: NEW TRANSLATION
 JAP_diplomacy.34.b: "Prozatím odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy_34_TT: "§YKaždá země ASEAN, která nabídku přijme, získá modifikátor stability a §Gpříznivé mínění§! o nás.§!" # todo: NEW TRANSLATION
 JAP_diplomacy.35.t: "Dohoda o rozšířené swapové dohodě" # todo: NEW TRANSLATION
 JAP_diplomacy.35.d: "[FROM.GetName] souhlasí s japonským návrhem na rozšíření měnové swapové dohody. Tím se dále posiluje „záchranná síť“ likviditní podpory v krizových obdobích, roste důvěra trhu a účinnost regionální spolupráce. Tato dohoda je také jasným krokem k posílení důvěry v Japonsko v rámci ASEAN." # todo: NEW TRANSLATION
 JAP_diplomacy.35.a: "Dobře." # todo: NEW TRANSLATION
 JAP_diplomacy.36.t: "Návrh odmítnut" # todo: NEW TRANSLATION
 JAP_diplomacy.36.d: "[FROM.GetName] oznámil, že odmítne japonský návrh na rozšíření měnové swapové dohody. Odráží to upřednostnění vyjasnění podmínek dohody a provozních postupů, nikoli kritiku samotného návrhu. Japonsko by mělo brát v úvahu okolnosti druhé země a zároveň udržovat otevřené komunikační kanály." # todo: NEW TRANSLATION
 JAP_diplomacy.36.a: "Rozumím." # todo: NEW TRANSLATION
 JAP_diplomacy.37.t: "Návrh investic do klíčové infrastruktury" # todo: NEW TRANSLATION
 JAP_diplomacy.37.d: "Japonská vláda navrhla rozsáhlé investice ODA v naší zemi zaměřené na klíčovou infrastrukturu, například dopravní sítě, přístavy a energetiku, s cílem posílit regionální propojení a hospodářský růst. Zlepšení silnic, přístavů a elektrických sítí posílí základy logistiky a průmyslu a přímo podpoří růst naší země. Přijetí návrhu by také zvýšilo vliv Japonska v rámci ASEAN.\n\nMěli bychom tento návrh přijmout a urychlit rozvoj infrastruktury?" # todo: NEW TRANSLATION
 JAP_diplomacy.37.a: "Přijmout" # todo: NEW TRANSLATION
 JAP_diplomacy.37.b: "Odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy_37_TT: "§YKaždá země ASEAN, která nabídku přijme, získá modifikátor rychlosti výstavby infrastruktury. Přispějeme §R3,5 miliardy§! a v každé přijímající zemi získáme §G2,5% vlivu§!.§!" # todo: NEW TRANSLATION
 JAP_diplomacy.38.t: "Investiční návrh přijat" # todo: NEW TRANSLATION
 JAP_diplomacy.38.d: "[FROM.GetName] přijal japonský návrh investic ODA do klíčové infrastruktury. Pokrok ve zlepšování dopravních sítí, přístavů a energetické infrastruktury posílí regionální propojení a hospodářský růst a zároveň pevněji ukotví naši účast. Tato dohoda dále posílí vliv Japonska v rámci ASEAN." # todo: NEW TRANSLATION
 JAP_diplomacy.38.a: "Dobře." # todo: NEW TRANSLATION
 JAP_diplomacy.39.t: "Návrh odmítnut" # todo: NEW TRANSLATION
 JAP_diplomacy.39.d: "[FROM.GetName] oznámil, že odmítne japonský návrh investic ODA do klíčové infrastruktury. Zdá se, že druhá země upřednostňuje své domácí plány a institucionální přípravy, což však neznamená odmítnutí samotného návrhu. Japonsko by mělo brát v úvahu její okolnosti a ponechat prostor pro budoucí spolupráci." # todo: NEW TRANSLATION
 JAP_diplomacy.39.a: "Rozumím." # todo: NEW TRANSLATION
 JAP_diplomacy.40.t: "Návrh spolupráce v oblasti lidského kapitálu a výzkumu" # todo: NEW TRANSLATION
 JAP_diplomacy.40.d: "Japonská vláda navrhla pro naši zemi spolupráci v rámci „kvalitativní ODA“ v oblastech vzdělávání, rozvoje lidských zdrojů a výzkumu, jako podporu uskutečňovanou ve spolupráci s místními podniky a institucemi. Tato spolupráce posílí rozvoj dovedností a institucionální kapacitu a podpoří modernizaci průmyslu a inovace. Přijetí návrhu by také zvýšilo vliv Japonska v rámci ASEAN.\n\nMěli bychom tento návrh přijmout a posílit lidský kapitál i výzkum a vývoj?" # todo: NEW TRANSLATION
 JAP_diplomacy.40.a: "Přijmout" # todo: NEW TRANSLATION
 JAP_diplomacy.40.b: "Odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy_40_TT: "§YKaždá země ASEAN, která nabídku přijme, získá modifikátory rychlosti výzkumu a růstu produktivity. V každé přijímající zemi získáme §G2,5% vlivu§!.§!" # todo: NEW TRANSLATION
 JAP_diplomacy.41.t: "Návrh spolupráce přijat" # todo: NEW TRANSLATION
 JAP_diplomacy.41.d: "[FROM.GetName] přijal japonský návrh spolupráce v rámci „kvalitativní ODA“ v oblastech vzdělávání, rozvoje lidských zdrojů a výzkumu. S postupující koordinací s místními podniky a institucemi se posílí institucionální kapacita i technologické základy druhé země, což přispěje k udržitelnému růstu. Tato dohoda jistě zvýší vliv Japonska v rámci ASEAN." # todo: NEW TRANSLATION
 JAP_diplomacy.41.a: "Dobře." # todo: NEW TRANSLATION
 JAP_diplomacy.42.t: "Návrh odmítnut" # todo: NEW TRANSLATION
 JAP_diplomacy.42.d: "[FROM.GetName] oznámil, že odmítne návrh spolupráce v rámci „kvalitativní ODA“ v oblastech vzdělávání, rozvoje lidských zdrojů a výzkumu. Zdá se, že druhá země upřednostňuje domácí priority a institucionální přípravy, což však neznamená odmítnutí samotného návrhu. Japonsko by mělo brát v úvahu její okolnosti a zároveň udržovat otevřené komunikační kanály." # todo: NEW TRANSLATION
 JAP_diplomacy.42.a: "Rozumím." # todo: NEW TRANSLATION
 JAP_diplomacy.43.t: "Žádost o připojení k japonskému rámci námořní bezpečnosti" # todo: NEW TRANSLATION
 JAP_diplomacy.43.d: "Japonská vláda představila plán na vytvoření neutrálního a mírového rámce námořní bezpečnosti, jehož cílem je zmírnit napětí v Jihočínském moři a chránit svobodu plavby, a oslovila naši zemi s nabídkou připojení. Spolupráce v podobě sdílení informací, námořního pátrání a záchrany, boje proti pirátství a společných cvičení by přispěla k regionální stabilitě a zlepšila schopnosti zvládat krize. Přijetí návrhu by také zvýšilo vliv Japonska v rámci ASEAN.\n\nMěli bychom tento návrh přijmout a spolupracovat v rámci japonského rámce?" # todo: NEW TRANSLATION
 JAP_diplomacy.43.a: "Přijmout" # todo: NEW TRANSLATION
 JAP_diplomacy.43.b: "Odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy_43_TT: "§YKaždá země ASEAN, která nabídku přijme, získá modifikátor stability. V každé přijímající zemi získáme §G2,5% vlivu§! a příznivé mínění.§!" # todo: NEW TRANSLATION
 JAP_diplomacy.44.t: "Dohoda o připojení k rámci" # todo: NEW TRANSLATION
 JAP_diplomacy.44.d: "[FROM.GetName] souhlasil s připojením k navrhovanému neutrálnímu a mírovému rámci námořní bezpečnosti Japonska. S postupující spoluprací v oblasti sdílení informací, námořního pátrání a záchrany, boje proti pirátství a společných cvičení můžeme očekávat hmatatelný pokrok v regionální stabilitě a ochraně svobody plavby. Tato dohoda posílí důvěru i vliv Japonska v rámci ASEAN." # todo: NEW TRANSLATION
 JAP_diplomacy.44.a: "Dobře." # todo: NEW TRANSLATION
 JAP_diplomacy.45.t: "Návrh účasti odmítnut" # todo: NEW TRANSLATION
 JAP_diplomacy.45.d: "[FROM.GetName] oznámil, že odmítne připojení k navrhovanému neutrálnímu a mírovému rámci námořní bezpečnosti Japonska. Zdá se, že druhá země upřednostňuje zohlednění regionální situace a domácích priorit, což však neznamená odmítnutí samotných zásad spolupráce. Japonsko by mělo zachovat postoj, který nebude zvyšovat napětí, a zároveň ponechat prostor pro dialog a spolupráci." # todo: NEW TRANSLATION
 JAP_diplomacy.45.a: "Rozumím." # todo: NEW TRANSLATION
 JAP_diplomacy.46.t: "Zahájení japonsko-amerického společného vzdělávacího programu" # todo: NEW TRANSLATION
 JAP_diplomacy.46.d: "Japonská vláda navrhla rozšíření společných vzdělávacích programů a výměn studentů s cílem prohloubit vzájemné porozumění a vychovat příští generaci. Vytvořením rámce, v němž se obě země mohou učit ze svých silných stránek — z japonské disciplíny a amerického podnikatelského ducha — má vzniknout nová generace vůdců s mezinárodním rozhledem. Tato iniciativa posílí mezilidské vazby a dále upevní důvěru v rámci aliance." # todo: NEW TRANSLATION
 JAP_diplomacy.46.a: "Investice do budoucnosti." # todo: NEW TRANSLATION
 JAP_diplomacy.47.t: "Japonsko-americká výměna technologií a kultury" # todo: NEW TRANSLATION
 JAP_diplomacy.47.d: "Japonská vláda představila plán na rozšíření technologických a kulturních výměn propojením japonských univerzitních laboratoří, studií a podnikových sítí s partnery v Silicon Valley, Seattlu a Los Angeles. Inženýři, designéři a tvůrci by cestovali tam a zpět za společnými projekty s cílem spojit americké know-how v provozu platforem s japonskými silnými stránkami v oblasti hardwaru, her a animace. Pokud budou kulturní spřízněnost a vědecká spolupráce postupovat společně, posílí sociální stabilitu i tempo inovací." # todo: NEW TRANSLATION
 JAP_diplomacy.47.a: "Maximalizujme synergii." # todo: NEW TRANSLATION
 JAP_diplomacy.48.t: "Japonsko-americká spolupráce ve výzkumu technologií dvojího užití" # todo: NEW TRANSLATION
 JAP_diplomacy.48.d: "Japonská vláda předložila návrh na další posílení japonsko-americké spolupráce v oblasti technologií dvojího užití, které lze využít pro civilní i vojenské účely. Plán, založený na spolupráci průmyslu a akademické sféry, má podpořit společný výzkum, sdílení odborných znalostí a výměny pracovníků, urychlit výzkum a vývoj a podpořit celkový technologický rozvoj. Pokud se toto partnerství uchytí, očekává se posílení budoucí konkurenceschopnosti v civilním i vojenském sektoru." # todo: NEW TRANSLATION
 JAP_diplomacy.48.a: "Posuňme společný výzkum vpřed." # todo: NEW TRANSLATION
 JAP_diplomacy.49.t: "Japonsko-tchajwanská platforma znalostí o připravenosti na katastrofy" # todo: NEW TRANSLATION
 JAP_diplomacy.49.d: "Japonská vláda předložila návrh na vytvoření „Japonsko-tchajwanské platformy znalostí o připravenosti na katastrofy“, která by sdílela odborné znalosti a zkušenosti z reakce na katastrofy na základě naší společné zranitelnosti vůči přírodním pohromám. Prostřednictvím standardizace sdílení informací, společného výcviku a rozvoje postupů obnovy je cílem posílit schopnosti reagovat na mimořádné události a urychlit obnovu. Pokud bude tato spolupráce pokračovat, očekává se snížení škod a rychlejší obnova." # todo: NEW TRANSLATION
 JAP_diplomacy.49.a: "Posilněme naši odolnost." # todo: NEW TRANSLATION
 JAP_diplomacy.50.t: "Posílení japonsko-tchajwanského partnerství v pokročilých technologiích" # todo: NEW TRANSLATION
 JAP_diplomacy.50.d: "Japonská vláda navrhla „japonsko-tchajwanskou spolupráci v oblasti špičkových technologií“, která by propojila výzkumné instituce a soukromé společnosti v Japonsku a na Tchaj-wanu s cílem podpořit společný výzkum nejmodernějších civilních technologií. Sdílením výzkumných zdrojů, společným vývojem a výměnami inženýrů je cílem urychlit inovace a zvýšit průmyslovou produktivitu i konkurenceschopnost. Pokud se tato spolupráce uchytí, vytvoří základ pro dlouhodobý růst civilních technologických odvětví obou zemí." # todo: NEW TRANSLATION
 JAP_diplomacy.50.a: "Urychleme společný výzkum." # todo: NEW TRANSLATION
 JAP_diplomacy.51.t: "Rozšíření studijních pobytů v Japonsku" # todo: NEW TRANSLATION
 JAP_diplomacy.51.d: "Japonská vláda navrhla rozšíření počtu stipendií a přijímacích míst s cílem zvýšit možnosti tchajwanských studentů studovat na japonských univerzitách. Tato iniciativa nemá pouze prohloubit akademické a kulturní vazby, ale také vychovat budoucí talenty, které mohou propojit naše dvě společnosti. S rozšiřováním výměn se dále posílí základ pro novou generaci, která bude rozvíjet japonsko-tchajwanské vztahy." # todo: NEW TRANSLATION
 JAP_diplomacy.51.a: "Investice do příští generace." # todo: NEW TRANSLATION
 JAP_diplomacy.52.t: "Návrh na podporu reformy obchodního systému" # todo: NEW TRANSLATION
 JAP_diplomacy.52.d: "Japonská vláda navrhla technickou a institucionální spolupráci na podporu reformy a modernizace čínského obchodního systému. Zjednodušením celních postupů, digitalizací administrativních operací a tvorbou pravidel v souladu s mezinárodními standardy je cílem usnadnit obchod a zvýšit předvídatelnost podnikatelské činnosti. Pokud budou tyto reformy pokračovat, sníží se procedurální zátěž dovozu a vývozu a klesne tření v hospodářské činnosti. Přijetí tohoto návrhu by také zvýšilo vliv Japonska v Číně.\n\nMěli bychom japonskou podporu přijmout a pokročit v mezinárodním sjednocování našeho obchodního systému?" # todo: NEW TRANSLATION
 JAP_diplomacy.52.a: "Přijmout" # todo: NEW TRANSLATION
 JAP_diplomacy.52.b: "Odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy_52_TT: "§YPokud bude nabídka přijata, Čína získá modifikátor sníženého daňového zatížení a my získáme §Gvliv§! v Číně!§!" # todo: NEW TRANSLATION
 JAP_diplomacy.53.t: "Návrh spolupráce přijat" # todo: NEW TRANSLATION
 JAP_diplomacy.53.d: "[FROM.GetName] přijal japonskou nabídku technické a institucionální podpory reformy a modernizace svého obchodního systému. Díky zjednodušení celních postupů a zlepšení administrativních operací vzroste usnadnění obchodu i předvídatelnost podnikatelské činnosti a zlepší se také prostředí pro vstup japonských společností na trh. Tato dohoda bude postupně posilovat vliv Japonska v Číně." # todo: NEW TRANSLATION
 JAP_diplomacy.53.a: "Dobře." # todo: NEW TRANSLATION
 JAP_diplomacy.54.t: "Návrh odmítnut" # todo: NEW TRANSLATION
 JAP_diplomacy.54.d: "[FROM.GetName] oznámil, že odmítne japonský návrh technické a institucionální podpory reformy a modernizace svého obchodního systému. Zdá se, že druhá strana upřednostňuje své politické priority a domácí koordinaci, což však neznamená odmítnutí samotné potřeby reformy. Japonsko by mělo brát v úvahu okolnosti druhé země a ponechat prostor pro dialog a spolupráci." # todo: NEW TRANSLATION
 JAP_diplomacy.54.a: "Rozumím." # todo: NEW TRANSLATION
 JAP_diplomacy.55.t: "Rozšíření japonsko-čínské investiční spolupráce" # todo: NEW TRANSLATION
 JAP_diplomacy.55.d: "Japonská vláda vyjádřila záměr pokročit v institucionální koordinaci a vytvořit rámec spolupráce na podporu vzájemných investic a vstupu japonských a čínských společností na trhy. Pokud se přeshraniční vstup urychlí, bude možné optimalizovat výrobní sítě a zefektivnit dodavatelské řetězce, což by mělo zvýšit celkovou průmyslovou produktivitu. Prohloubení hospodářské vzávislosti s sebou nese rizika, ale zároveň může sloužit jako praktický stabilizační faktor tím, že omezí tření." # todo: NEW TRANSLATION
 JAP_diplomacy.55.a: "Otevřeme trh a zlepšíme efektivitu." # todo: NEW TRANSLATION
 JAP_diplomacy.56.t: "Projekt kulturní spolupráce „sinické kulturní sféry“" # todo: NEW TRANSLATION
 JAP_diplomacy.56.d: "Japonská vláda navrhla japonsko-čínský projekt kulturní spolupráce na posílení kulturních vazeb v rámci „sinické kulturní sféry“, která sdílí společný historický základ. Prostřednictvím akademických výměn, kulturních iniciativ a spolupráce v médiích a vzdělávání je cílem zviditelnit sdílené hodnoty a historické vazby a nechat je působit jako kulturní nárazník proti vnějšímu vlivu. Pokud bude tento rámec pokračovat, očekává se také posílení měkké síly, která přispívá k vytváření příznivějšího mezinárodního obrazu." # todo: NEW TRANSLATION
 JAP_diplomacy.56.a: "Prohlubme kulturní solidaritu." # todo: NEW TRANSLATION
 JAP_diplomacy.57.t: "Japonsko-čínský projekt ochrany buddhistických chrámů" # todo: NEW TRANSLATION
 JAP_diplomacy.57.d: "Japonská vláda navrhla společný japonsko-čínský projekt na ochranu buddhistických chrámů jako sdíleného kulturního dědictví prostřednictvím společných konzervačních a restaurátorských prací. Sdílením restaurátorských technik a metod průzkumu a vytvořením rámce spolupráce na ochraně kulturních památek je cílem znovu potvrdit hodnotu chrámů a souvisejícího kulturního majetku a zajistit jeho dlouhodobé uchování. Pokud budou výsledky těchto snah viditelné, vzroste přitažlivost kulturní turistiky a lze očekávat pozitivní vedlejší účinky pro místní ekonomiky. Tato spolupráce může také posloužit jako příležitost znovu potvrdit historické vazby mezi našimi dvěma zeměmi." # todo: NEW TRANSLATION
 JAP_diplomacy.57.a: "Chraňme naše dědictví a podpořme turismus." # todo: NEW TRANSLATION
 JAP_diplomacy.58.t: "Tokijský a soulský akcelerátor" # todo: NEW TRANSLATION
 JAP_diplomacy.58.d: "Japonská vláda předložila návrh na vytvoření společného akceleračního programu v Tokiu a Soulu, který by institucionalizoval podporu startupů v obou zemích. Prostřednictvím pomoci při získávání kapitálu, mentoringu, spolupráce se společnostmi a univerzitami a výměn talentů mezi oběma městy je cílem zvýšit úspěšnost startupů a posílit technologickou spolupráci. Pokud bude tento rámec fungovat podle očekávání, inovace mezi městy se urychlí a japonsko-korejská hospodářská spolupráce se posílí praktičtějším a na výsledky zaměřeným způsobem." # todo: NEW TRANSLATION
 JAP_diplomacy.58.a: "Urychleme rozmach startupů." # todo: NEW TRANSLATION
 JAP_diplomacy.59.t: "Rozšíření japonsko-korejské spolupráce na místní úrovni" # todo: NEW TRANSLATION
 JAP_diplomacy.59.d: "Japonská vláda navrhla „Iniciativu regionální podnikatelské výměny“ s cílem institucionalizovat místní podnikatelské výměny a podpořit spolupráci mezi regionálními společnostmi v Japonsku a Jižní Koreji. Prostřednictvím akcí pro propojování podniků, společných výstav, propojování dodavatelských řetězců a sdílení technologií a know-how je cílem oživit regionální ekonomiky a urychlit růst civilních průmyslových odvětví. Pokud se tento rámec uchytí, rozšíří se praktická spolupráce, která nebude příliš závislá na vedení centrálních vlád, a posílí se průmyslové sítě řízené soukromým sektorem." # todo: NEW TRANSLATION
 JAP_diplomacy.59.a: "Vytvořme růst v regionech." # todo: NEW TRANSLATION
 JAP_diplomacy.60.t: "Návrh na japonsko-korejskou kulturní výměnu" # todo: NEW TRANSLATION
 JAP_diplomacy.60.d: "Japonská vláda předložila návrh na systematické rozšíření kulturní výměny mezi Japonskem a Jižní Koreou. Prostřednictvím výměn v médiích, umění, sportu, cestovním ruchu a vzdělávání je cílem prohloubit vzájemné porozumění mezi našimi národy a zmenšit společenský odstup. Pokud se výměny rozšíří, ovlivní také veřejné mínění a postoje k vnějšímu světu a obě země získají prostředí, v němž budou moci účinněji promlouvat do domácí sféry té druhé.\n\nMěli bychom tento návrh přijmout a podpořit kulturní výměnu?" # todo: NEW TRANSLATION
 JAP_diplomacy.60.a: "Přijmout" # todo: NEW TRANSLATION
 JAP_diplomacy.60.b: "Odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy_60_TT: "§YPokud bude nabídka přijata, získáme §Gvliv§! v Koreji, ale Korea zároveň získá §Rvliv§! v Japonsku.§!" # todo: NEW TRANSLATION
 JAP_diplomacy_60_TT2: "§YKulturní výměna by nám umožnila získat vliv v Japonsku, ale zároveň by vzrostl domácí vliv Japonska.§!" # todo: NEW TRANSLATION
 JAP_diplomacy.61.t: "Návrh přijat" # todo: NEW TRANSLATION
 JAP_diplomacy.61.d: "[FROM.GetName] souhlasil s japonským návrhem na rozšíření kulturní výměny. S rozšiřováním výměn v médiích, umění, sportu, cestovním ruchu a vzdělávání se prohloubí vzájemné porozumění a mohou následovat změny veřejného mínění v obou zemích. Prostřednictvím této dohody Japonsko získá silnější hlas v Koreji, zatímco Korea posílí svůj vliv v Japonsku." # todo: NEW TRANSLATION
 JAP_diplomacy.61.a: "Dobře." # todo: NEW TRANSLATION
 JAP_diplomacy.62.t: "Návrh odmítnut" # todo: NEW TRANSLATION
 JAP_diplomacy.62.d: "[FROM.GetName] oznámil, že odmítne japonský návrh na rozšíření kulturní výměny. Zdá se, že druhá země upřednostňuje zohlednění veřejného mínění a domácích okolností, což však neznamená odmítnutí kulturní výměny jako takové. Japonsko by mělo udržovat otevřené komunikační kanály a ponechat prostor pro rozvoj vzájemného porozumění jinými způsoby." # todo: NEW TRANSLATION
 JAP_diplomacy.62.a: "Rozumím." # todo: NEW TRANSLATION
 JAP_diplomacy.63.t: "Japonsko-korejská pracovní skupina pro stárnoucí společnost" # todo: NEW TRANSLATION
 JAP_diplomacy.63.d: "Japonská vláda navrhla vytvoření společné pracovní skupiny odborníků a příslušných institucí z Japonska a Jižní Koreje, která by řešila společnou výzvu stárnoucí společnosti a prostřednictvím měsíčních konzultací formulovala politiky spolupráce. Sdílením odborných znalostí o posilování systémů péče o seniory a zdravotnictví, podpoře zaměstnanosti a koncepci komunitního blahobytu je cílem zvýšit rychlost i účinnost politických reakcí. Pokud se tento rámec uchytí, podpoří posilování sociálních opatření a přispěje k dlouhodobé společenské stabilitě." # todo: NEW TRANSLATION
 JAP_diplomacy.63.a: "Pokračujme společně v přípravách." # todo: NEW TRANSLATION
 JAP_diplomacy_63_TT: "§YJižní Korea získá modifikátor růstu populace.§!" # todo: NEW TRANSLATION
 JAP_diplomacy.64.t: "Spolupráce na rozvoji chladných oblastí" # todo: NEW TRANSLATION
 JAP_diplomacy.64.d: "Japonská vláda navrhla „Iniciativu Dálného východu“ na podporu rozvoje chladných oblastí na ruském Dálném východě prostřednictvím zkušeností Hokkaidó s oživováním regionů s chladným podnebím, investic do infrastruktury a zavádění zahraničního kapitálu. Zlepšováním základů dopravy, logistiky a energetiky je cílem podnítit regionální hospodářskou aktivitu a zvýšit účinnost rozvoje. Iniciativa se zaměřuje na rozvoj infrastruktury v Sacha a Kamčatce." # todo: NEW TRANSLATION
 JAP_diplomacy.64.a: "Posilněme základy Dálného východu." # todo: NEW TRANSLATION
 JAP_diplomacy.65.t: "Sachalin II" # todo: NEW TRANSLATION
 JAP_diplomacy.65.d: "Japonská vláda vyjádřila záměr posílit zahraniční investice do energetického projektu Sachalin II při spolupráci s Ruskem, aby zajistila stabilní přístup k fosilním palivům. Pokud budou kapitálové investice a stabilizace provozu pokračovat, zlepší se kontinuita rozvoje a lze očekávat rozšíření výrobní kapacity. Sachalin zůstane důležitým zásobovacím uzlem a pravděpodobně přinese pozitivní účinky také regionální ekonomice." # todo: NEW TRANSLATION
 JAP_diplomacy.65.a: "Rozšiřme výrobní kapacitu." # todo: NEW TRANSLATION
 JAP_diplomacy.66.t: "Zahájení spolupráce na eurasijské dopravní síti" # todo: NEW TRANSLATION
 JAP_diplomacy.66.d: "Japonská vláda vyjádřila záměr pokročit v japonsko-ruské spolupráci na rozvoji pozemního logistického koridoru spojujícího Japonsko a Evropu přes Rusko. Využitím železničních sítí a hlavních dálnic je cílem zkrátit přepravní časy, zajistit stabilní přístup na evropské trhy a zároveň urychlit modernizaci infrastruktury podél koridoru. Pokud nákladní doprava začne skutečně proudit, Rusko dále posílí svůj význam jako eurasijský uzel a hospodářské propojení se také prohloubí." # todo: NEW TRANSLATION
 JAP_diplomacy.66.a: "Urychleme rozvoj koridoru." # todo: NEW TRANSLATION
 JAP_diplomacy.67.t: "Zahájení japonsko-ruské spolupráce v oblasti IT infrastruktury" # todo: NEW TRANSLATION
 JAP_diplomacy.67.d: "Japonská vláda představila iniciativu „Ruský digitální koridor“, v jejímž rámci budou japonské IT společnosti spolupracovat na rozvoji infrastruktury v Rusku, například datových center a optických sítí. Cílem je modernizovat domácí komunikační infrastrukturu a zároveň posílit úlohu Ruska jako uzlu digitální obchodní sítě spojující Evropu, Střední Asii a Rusko. Pokud se tato spolupráce rozběhne, zlepší se stabilita informačních toků i kapacita sítí a urychlí se také digitalizace hospodářské činnosti." # todo: NEW TRANSLATION
 JAP_diplomacy.67.a: "Rozšiřme naši infrastrukturu konektivity." # todo: NEW TRANSLATION
 JAP_historical.20110311.t: "Velké východojaponské zemětřesení" # todo: NEW TRANSLATION
 JAP_historical.20110311.d: "11. března 2011 ve 14:46 zasáhlo pobřeží Tóhoku v Tichém oceánu masivní zemětřesení o síle 9,0. Nejsilnější otřesy, jaké kdy byly v Japonsku zaznamenány, prudce otřásly rozsáhlými oblastmi od Tóhoku po Kantó a následná obrovská tsunami pohltila pobřežní města a vesnice a zanechala za sebou katastrofální zkázu. Přístavy a rybářské obce byly během okamžiku zničeny, zatímco silnice, železnice a letiště byly přerušeny a městské funkce uvrženy do chaosu.\n\nStatisíce lidí přišly o své domovy a hledaly útočiště v nouzových přístřešcích. Hospodářské ztráty jsou ohromující, protože zemědělství, rybolov a výroba — páteř regionální ekonomiky — utrpěly ochromující škody. Současné úkoly obnovy infrastruktury, pomoci vysídleným a rekonstrukce průmyslu a měst zatlačí administrativní kapacitu vlády na absolutní hranici.\n\nUprostřed této bezprecedentní tragédie prokázali Japonci odolnost a solidaritu. Stabilita a budoucnost národa však budou záviset na tom, jak rychle a účinně dokáže vláda reagovat." # todo: NEW TRANSLATION
 JAP_historical.20110311.a: "Musíme vynaložit veškeré úsilí na záchranu a obnovu." # todo: NEW TRANSLATION
 JAP_great_east_japan_earthquake_tree_tt: "§YByl odemčen národní strom zaměřený na obnovu po Velkém východojaponském zemětřesení!§!" # todo: NEW TRANSLATION
 JAP_news.02.t: "Japonsko zasáhlo bezprecedentní zemětřesení" # todo: NEW TRANSLATION
 JAP_news.02.d: "11. března 2011 zasáhlo Japonsko masivní zemětřesení. Otřes o síle 9,0, později známý jako Velké východojaponské zemětřesení, udeřil u pacifického pobřeží Tóhoku a způsobil rozsáhlou katastrofu, při níž zahynuly nebo zmizely desítky tisíc lidí a vznikly nedozírné hospodářské ztráty.\n\nNásledná tsunami během okamžiku zničila pobřežní města, přístavy a dopravní sítě a přinutila statisíce lidí uchýlit se do evakuačních přístřešků. Japonská společnost nyní čelí největší krizi od poválečné éry.\n\nVelké východojaponské zemětřesení se stalo rozhodujícím okamžikem, zatímco svět sleduje, jak se jedna z předních světových ekonomik s touto pohromou vyrovná." # todo: NEW TRANSLATION
 JAP_news.02.a: "Děsivá tragédie..." # todo: NEW TRANSLATION
 Japan.201103111.t: "Prohlášení o dokončení obnovy" # todo: NEW TRANSLATION
 Japan.201103111.d: "Od velké katastrofy uplynuly roky, trosky byly odklizeny a města jsou znovu plná životní energie svých obyvatel. Životy obětí se postupně stabilizovaly a průmysl i infrastruktura byly obnoveny. Vláda dnes oficiálně prohlašuje „Obnova dokončena“ a uzavírá kapitolu dlouhého období strádání.\n\nAčkoli tato tragédie zanechala hluboké jizvy, zároveň podpořila odolnost a hrdost a položila základy světlejší budoucnosti." # todo: NEW TRANSLATION
 Japan.201103111.a: "Překonali jsme nepřízeň osudu!" # todo: NEW TRANSLATION
 Japan.201103112.t: "Pokrok v obnově infrastruktury" # todo: NEW TRANSLATION
 Japan.201103112.d: "Část infrastruktury zničené katastrofou byla nyní obnovena. Doprava a logistika se postupně vracejí k normálu a přinášejí do každodenního života malé, ale významné změny. Úplná obnova je stále vzdálená, jde však o jasný krok vpřed." # todo: NEW TRANSLATION
 Japan.201103112.a: "Krok vpřed." # todo: NEW TRANSLATION
 Japan.201103113.t: "Úplná obnova infrastruktury" # todo: NEW TRANSLATION
 Japan.201103113.d: "Infrastruktura v Tóhoku, zpustošeném zemětřesením, konečně dosáhla plánované úrovně obnovy. Dopravní sítě a logistické funkce jsou nyní plně provozuschopné, což dává nový impuls místní společnosti a ekonomice. Obnova dosáhla významného milníku." # todo: NEW TRANSLATION
 Japan.201103113.a: "Významný milník." # todo: NEW TRANSLATION
 Japan.201103114.t: "Pokrok v obnově infrastruktury" # todo: NEW TRANSLATION
 Japan.201103114.d: "Část infrastruktury zničené katastrofou byla nyní obnovena. Doprava a logistika se postupně vracejí k normálu a přinášejí do každodenního života malé, ale významné změny. Úplná obnova je stále vzdálená, jde však o jasný krok vpřed." # todo: NEW TRANSLATION
 Japan.201103114.a: "Krok vpřed." # todo: NEW TRANSLATION
 Japan.201103115.t: "Úplná obnova infrastruktury" # todo: NEW TRANSLATION
 Japan.201103115.d: "Infrastruktura v Kantó, zpustošeném zemětřesením, konečně dosáhla plánované úrovně obnovy. Dopravní sítě a logistické funkce jsou nyní plně provozuschopné, což dává nový impuls místní společnosti a ekonomice. Obnova dosáhla významného milníku." # todo: NEW TRANSLATION
 Japan.201103115.a: "Významný milník." # todo: NEW TRANSLATION
 Japan.201103116.t: "Telekomunikace obnoveny" # todo: NEW TRANSLATION
 Japan.201103116.d: "Telekomunikační síť v regionu zasaženém katastrofou byla konečně částečně obnovena. Komunikace pro každodenní život i podnikání se zlepšila, což přineslo novou naději místní ekonomice a společnosti." # todo: NEW TRANSLATION
 Japan.201103116.a: "Pokračovat v další obnově" # todo: NEW TRANSLATION
 Japan.201103117.t: "Telekomunikace plně obnoveny" # todo: NEW TRANSLATION
 Japan.201103117.d: "Telekomunikační infrastruktura v Tóhoku, zpustošeném zemětřesením, konečně dosáhla plánované úrovně obnovy. Se zajištěnými základy každodenního života a průmyslu dosáhla cesta obnovy významného milníku." # todo: NEW TRANSLATION
 Japan.201103117.a: "Označit to za krok vpřed v obnově" # todo: NEW TRANSLATION
 Japan.201103118.t: "Telekomunikace plně obnoveny" # todo: NEW TRANSLATION
 Japan.201103118.d: "Telekomunikační infrastruktura v Kantó, zpustošeném zemětřesením, konečně dosáhla plánované úrovně obnovy. Se zajištěnými základy každodenního života a průmyslu dosáhla cesta obnovy významného milníku." # todo: NEW TRANSLATION
 Japan.201103118.a: "Označit to za krok vpřed v obnově" # todo: NEW TRANSLATION
 Japan.201103119.t: "Místní průmysl obnovuje provoz" # todo: NEW TRANSLATION
 Japan.201103119.d: "Továrny a podniky v regionu zasaženém katastrofou obnovily provoz. Ačkoli je úplná obnova stále daleko, návrat pracovních míst a hospodářské aktivity nabízí hmatatelný pocit pokroku." # todo: NEW TRANSLATION
 Japan.201103119.a: "Pokračovat v další průmyslové obnově" # todo: NEW TRANSLATION
 Japan.2011031110.t: "Průmyslová základna plně obnovena" # todo: NEW TRANSLATION
 Japan.2011031110.d: "Průmyslová základna v Tóhoku, zpustošeném zemětřesením, konečně dosáhla plánované úrovně obnovy. Po obnovení pracovních míst a výrobní kapacity dosáhla rekonstrukce významného milníku." # todo: NEW TRANSLATION
 Japan.2011031110.a: "Postoupit do další fáze obnovy" # todo: NEW TRANSLATION
 Japan.2011031111.t: "Místní průmysl obnovuje provoz" # todo: NEW TRANSLATION
 Japan.2011031111.d: "Továrny a podniky v regionu zasaženém katastrofou obnovily provoz. Ačkoli je úplná obnova stále daleko, návrat pracovních míst a hospodářské aktivity nabízí hmatatelný pocit pokroku." # todo: NEW TRANSLATION
 Japan.2011031111.a: "Pokračovat v další průmyslové obnově" # todo: NEW TRANSLATION
 Japan.2011031112.t: "Průmyslová základna plně obnovena" # todo: NEW TRANSLATION
 Japan.2011031112.d: "Průmyslová základna v Kantó, zpustošeném zemětřesením, konečně dosáhla plánované úrovně obnovy. Po obnovení pracovních míst a výrobní kapacity dosáhla rekonstrukce významného milníku." # todo: NEW TRANSLATION
 Japan.2011031112.a: "Postoupit do další fáze obnovy" # todo: NEW TRANSLATION
 Japan.2011031150.t: "Havárie jaderné elektrárny Fukušima Daiiči" # todo: NEW TRANSLATION
 Japan.2011031150.d: "Japonsko zasáhlo bezprecedentní zemětřesení a tsunami a zatímco se národ horečně snaží reagovat, přišla další zpráva o nejhorším možném vývoji. Tsunami zasáhla jadernou elektrárnu Fukušima Daiiči v prefektuře Fukušima, způsobila selhání nouzových generátorů, baterií a palivových nádrží a uvrhla celý areál do úplné ztráty napájení.\nKromě toho se uvnitř reaktorových budov vytvořilo a nahromadilo velké množství vodíku, což vedlo k vodíkovým výbuchům na blocích 1, 3 a 4. Veřejnost propadla panice kvůli obavám z úniků radioaktivity z poškozených míst." # todo: NEW TRANSLATION
 Japan.2011031150.a: "Musíme jednat okamžitě!" # todo: NEW TRANSLATION
 JAP_news.03.t: "Havárie jaderné elektrárny Fukušima Daiiči" # todo: NEW TRANSLATION
 JAP_news.03.d: "Po zemětřesení a tsunami byla v japonské jaderné elektrárně Fukušima Daiiči hlášena vážná havárie. Ačkoli se reaktory po zemětřesení odstavily, tsunami údajně vyřadila nouzové generátory a další kritická zařízení, což vedlo k úplné ztrátě napájení. Protože již nebylo možné udržet chlazení, došlo na několika blocích k roztavení aktivní zóny.\nTvorba a hromadění vodíku rovněž vyvolaly výbuchy v reaktorových budovách a považuje se za vysoce pravděpodobné, že poškozenými místy unikly do prostředí radioaktivní látky. Japonská vláda horečně hledá řešení." # todo: NEW TRANSLATION
 JAP_news.03.a: "To je ale situace..." # todo: NEW TRANSLATION
 Japan.2011031151.t: "Japonská jaderná politika na rozcestí" # todo: NEW TRANSLATION
 Japan.2011031151.d: "Od jaderné havárie uplynul měsíc a japonská vláda je nyní nucena rozhodnout. Havárie ve Fukušimě Daiiči otřásla samotnými základy důvěry veřejnosti v bezpečnost jaderné energie. Veřejné mínění je rozdělené, podnikatelská sféra se obává dopadů na dodávky elektřiny a občané mají strach z možného úniku radioaktivity.\n\nJaponsko nyní musí jasně rozhodnout, zda bude nadále spoléhat na jadernou energii, nebo zvolí jinou cestu." # todo: NEW TRANSLATION
 Japan.2011031151.a: "Zakázat ji, okamžitě ji odstavit!" # todo: NEW TRANSLATION
 Japan.2011031151.b: "Musíme zavést přísné kontroly." # todo: NEW TRANSLATION
 Japan.2011031151.c: "Pokračovat jako dosud!" # todo: NEW TRANSLATION
 JAP_territorial.01.t: "Zahájení jednání o Severních teritoriích" # todo: NEW TRANSLATION
 JAP_territorial.01.d: "Územní spor o Severní teritoria je od konce války dlouhodobě nevyřešenou otázkou mezi [JAP.GetName] a [SOV.GetName]. Nyní jsme dospěli do bodu, kdy formálně požádáme [SOV.GetName] o jednání s cílem tuto záležitost pokojně vyřešit. Nejde pouze o diplomatickou formalitu, ale o zásadní krok při prosazování naší suverenity a historické legitimity." # todo: NEW TRANSLATION
 JAP_territorial.01.oA: "Začněme!" # todo: NEW TRANSLATION
 JAP_territorial.02.t: "[JAP.GetName] žádá o jednání o Severních teritoriích" # todo: NEW TRANSLATION
 JAP_territorial.02.d: "Vláda [JAP.GetAdjective] zaslala formální žádost o zahájení jednání o Severních teritoriích. Tato otázka byla po desetiletí odkládána a rozhodnutí ovlivní jak naše mezinárodní postavení, tak domácí politiku. Bude kompromis znamenat ztrátu národních zájmů, nebo zisk mezinárodní důvěry? Čas rozhodnutí nadešel." # todo: NEW TRANSLATION
 JAP_territorial.02.oA: "Postoupit území [JAP.GetName]" # todo: NEW TRANSLATION
 JAP_territorial.02.oB: "Odmítnout žádost. O jednání není prostor" # todo: NEW TRANSLATION
 JAP_territorial.03.t: "Dohoda o navrácení Severních teritorií" # todo: NEW TRANSLATION
 JAP_territorial.03.d: "Konečně byla dlouhotrvající otázka Severních teritorií vyřešena. Po jednáních s [SOV.GetName] bylo dosaženo dohody o navrácení sporných území. Jde o diplomatické vítězství a historický úspěch poválečných dějin [JAP.GetAdjective]." # todo: NEW TRANSLATION
 JAP_territorial.03.oA: "Historická dohoda!" # todo: NEW TRANSLATION
 JAP_territorial.04.t: "Jednání o Severních teritoriích ztroskotala" # todo: NEW TRANSLATION
 JAP_territorial.04.d: "Vláda [SOV.GetAdjective] oficiálně odmítla náš návrh na jednání o navrácení Severních teritorií. Navzdory našemu diplomatickému úsilí nebylo nalezeno řešení. Nyní se musíme zaměřit na budování větší důvěry a rozšiřování našeho vlivu, abychom se připravili na obnovení jednání v budoucnu." # todo: NEW TRANSLATION
 JAP_territorial.04.oA: "Tentokrát bylo ještě příliš brzy..." # todo: NEW TRANSLATION
 JAP_territorial.05.t: "Zahájení jednání o Senkaku s [CHI.GetName]" # todo: NEW TRANSLATION
 JAP_territorial.05.d: "[JAP.GetName] v současnosti vykonává účinnou kontrolu nad ostrovy Senkaku, avšak [CHI.GetName] nadále uplatňuje svůj nárok na suverenitu. S ohledem na předchozí diplomatické snahy nastal čas, aby naše země formálně zahájila jednání s vládou [CHI.GetAdjective] ve snaze dosáhnout pokojného řešení." # todo: NEW TRANSLATION
 JAP_territorial.05.oA: "Začněme!" # todo: NEW TRANSLATION
 JAP_territorial.06.t: "[JAP.GetName] navrhuje územní jednání" # todo: NEW TRANSLATION
 JAP_territorial.06.d: "Vláda [JAP.GetAdjective] nás požádala, abychom stáhli svůj územní nárok na ostrovy Senkaku. Prosazuje pokojné řešení a regionální stabilitu a za podpory diplomatického tlaku a mezinárodní podpory postupuje v jednáních. Přijetí tohoto návrhu jistě vyvolá podporu i odpor doma i v zahraničí." # todo: NEW TRANSLATION
 JAP_territorial.06.oA: "Stáhnout nárok a upřednostnit regionální stabilitu." # todo: NEW TRANSLATION
 JAP_territorial.06.oB: "Nárok zachovat a hájit národní suverenitu." # todo: NEW TRANSLATION
 JAP_territorial.07.t: "[CHI.GetName] stahuje nárok na Senkaku!" # todo: NEW TRANSLATION
 JAP_territorial.07.d: "[CHI.GetName] oficiálně stáhla svůj územní nárok na ostrovy Senkaku. Dlouhodobé napětí ve Východočínském moři se výrazně zmírnilo a doma i v zahraničí je to oslavováno jako velké diplomatické vítězství. Jde o důležitý první krok k regionální stabilitě a budování důvěry." # todo: NEW TRANSLATION
 JAP_territorial.07.oA: "Historický průlom." # todo: NEW TRANSLATION
 JAP_territorial.08.t: "[CHI.GetName] svůj nárok zachovává" # todo: NEW TRANSLATION
 JAP_territorial.08.d: "[CHI.GetName] prohlásila, že svůj územní nárok na ostrovy Senkaku zachová. Jednání skončila neúspěchem, což zdůrazňuje potřebu dalšího budování vztahů a posilování mezinárodního vlivu. Dialog zůstává možný, situace však nadále zůstává obtížná." # todo: NEW TRANSLATION
 JAP_territorial.08.oA: "Možná bylo ještě příliš brzy..." # todo: NEW TRANSLATION
 JAP_territorial.09.t: "Zahájení jednání o Senkaku s [TAI.GetName]" # todo: NEW TRANSLATION
 JAP_territorial.09.d: "[TAI.GetName] si dlouhodobě nárokuje suverenitu nad ostrovy Senkaku na základě historických a geografických důvodů, zatímco [JAP.GetName] trvá na legitimitě své účinné kontroly. Ve snaze pokojně vyřešit tuto dlouhotrvající otázku předložíme [TAI.GetName] formální diplomatický návrh." # todo: NEW TRANSLATION
 JAP_territorial.09.oA: "Začněme!" # todo: NEW TRANSLATION
 JAP_territorial.10.t: "[JAP.GetName] navrhuje územní jednání" # todo: NEW TRANSLATION
 JAP_territorial.10.d: "Vláda [JAP.GetAdjective] požádala, abychom se vzdali svého nároku na ostrovy Senkaku. Vzhledem ke složitosti vztahů mezi oběma stranami průlivu a širšímu mezinárodnímu kontextu bude při rozhodování o přijetí této žádosti nutné pečlivě zvážit všechny okolnosti." # todo: NEW TRANSLATION
 JAP_territorial.10.oA: "Stáhnout nárok v zájmu regionální stability." # todo: NEW TRANSLATION
 JAP_territorial.10.oB: "Musíme nadále hájit svou suverenitu." # todo: NEW TRANSLATION
 JAP_territorial.11.t: "[TAI.GetName] stahuje nárok na Senkaku!" # todo: NEW TRANSLATION
 JAP_territorial.11.d: "Úřady [TAI.GetAdjective] oficiálně stáhly svůj územní nárok na ostrovy Senkaku. Po vyřešení jedné z dlouhodobých otázek Východočínského moře vstupují vztahy mezi [JAP.GetName] a [TAI.GetName] do nové éry stability, což posiluje naděje na hlubší spolupráci v budoucnu." # todo: NEW TRANSLATION
 JAP_territorial.11.oA: "Historická dohoda." # todo: NEW TRANSLATION
 JAP_territorial.12.t: "[TAI.GetName] odmítá nárok stáhnout" # todo: NEW TRANSLATION
 JAP_territorial.12.d: "[TAI.GetName] prohlásila, že svůj územní nárok na ostrovy Senkaku zachová. Jednání skončila neúspěchem a ukázala, že vyřešení této otázky bude v budoucnu vyžadovat větší diplomatický vliv a silnější vzájemnou důvěru." # todo: NEW TRANSLATION
 JAP_territorial.12.oA: "Možná bylo stále příliš brzy..." # todo: NEW TRANSLATION
 JAP_territorial.13.t: "Zahájení jednání o Takešimě s [KOR.GetName]" # todo: NEW TRANSLATION
 JAP_territorial.13.d: "Abychom ukončili dlouhotrvající územní spor o Takešimu mezi [JAP.GetName] a [KOR.GetName], navrhla naše vláda pokojná jednání s [KOR.GetName]. Namísto jednostranného prosazování našeho nároku má tento krok za cíl vybudovat mezi oběma národy vztah zaměřený na budoucnost." # todo: NEW TRANSLATION
 JAP_territorial.13.oA: "Začněme!" # todo: NEW TRANSLATION
 JAP_territorial.14.t: "[JAP.GetName] navrhuje jednání o Toktu" # todo: NEW TRANSLATION
 JAP_territorial.14.d: "Vláda [JAP.GetAdjective] nás oslovila s žádostí o jednání o suverenitě nad Toktem. Přestože jde s ohledem na domácí veřejné mínění a historický kontext o mimořádně obtížné rozhodnutí, zároveň jde o zásadní diplomatický úsudek, který by mohl ovlivnit budoucnost vztahů mezi [JAP.GetName] a [KOR.GetName]." # todo: NEW TRANSLATION
 JAP_territorial.14.oA: "Upřednostnit zlepšení vztahů s [JAP.GetName] a souhlasit s převodem." # todo: NEW TRANSLATION
 JAP_territorial.14.oB: "Nemůžeme se vzdát svého národního území." # todo: NEW TRANSLATION
 JAP_territorial.15.t: "[KOR.GetName] souhlasí s převodem Takešimy!" # todo: NEW TRANSLATION
 JAP_territorial.15.d: "V rámci snahy o zlepšení vztahů mezi [JAP.GetName] a [KOR.GetName] vláda [KOR.GetAdjective] souhlasila s navrácením Takešimy. Tím končí desetiletí trvající konfrontace a začíná nová fáze důvěry mezi oběma zeměmi. Je to okamžik, kdy pokojné diplomatické úsilí přineslo ovoce." # todo: NEW TRANSLATION
 JAP_territorial.15.oA: "Historický úspěch." # todo: NEW TRANSLATION
 JAP_territorial.16.t: "[KOR.GetName] odmítá jednání o Takešimě" # todo: NEW TRANSLATION
 JAP_territorial.16.d: "Vláda [KOR.GetAdjective] odmítla naši žádost o navrácení Takešimy. Vyřešení územní otázky zůstává obtížné a bez silnějšího diplomatického vlivu a vzájemné důvěry bude těžké tuto záležitost uzavřít." # todo: NEW TRANSLATION
 JAP_territorial.16.oA: "Prozatím musíme pokračovat v dialogu." # todo: NEW TRANSLATION
 JAP_renegotiation_territory: "Nové jednání bude možné za jeden rok!" # todo: NEW TRANSLATION
 japan_classic.15.t: "Keizō Obuchi utrpěl mrtvici" # todo: NEW TRANSLATION
 japan_classic.15.d: "Keizō Obuchi, věrný služebník Liberálně-demokratické strany a japonského lidu, byl premiérem Japonska od 30. července 1998 po rezignaci Ryūtarō Hashimotoa poté, co LDP prohrála volby do horní komory v roce 1998.\nKeizō Obuchi byl popsán jako klidný, kvalifikovaný a efektivní - avšak jen málo lidí očekávalo jeho náhlý pokles zdravotního stavu. Dne 1. dubna 2000 utrpěl mrtvici a byl rychle převezen do nemocnice." # todo: NEW TRANSLATION
 japan_classic.15.o1: "Doufejme v to nejlepší." # todo: NEW TRANSLATION
 japan_classic.16.t: "Nahrazení Obuchi" # todo: NEW TRANSLATION
 japan_classic.16.d: "Jen krátce po vážné mrtvici Keizō Obuchiho bylo zřejmé, že nebude moci brzy opět vstoupit do služby. Japonská dieta se 5. dubna 2000 sešla, aby našla náhradu za premiéra.\nKeizō Obuchi se už nikdy nezotavil a nakonec zemřel v nemocnici 14. května. Zanechal po sobě jednoho syna a dvě dcery, z nichž jedna, Yūko, je také političkou Liberálně-demokratické strany." # todo: NEW TRANSLATION
 japan_classic.16.o1: "Yoshirō Mori musí vést." # todo: NEW TRANSLATION
 JAP_historical.20010426.t: "Joširó Mori odstupuje, Džuničiró Koizumi se stává premiérem" # todo: NEW TRANSLATION
 JAP_historical.20010426.d: "Joširó Mori oznámil svou rezignaci na funkci premiéra po pouhém roce v úřadu. Jeho popularita klesla a propast mezi ním a veřejností, symbolizovaná jeho výrokem o „božském národě“ a řešením incidentu lodi Ehime Maru, se jen prohloubila.\n\nVůdcem Liberálně demokratické strany byl zvolen jeho nástupce Džuničiró Koizumi, který získal celonárodní pozornost odvážným prohlášením, že „zničí LDP“, a vedl okázalou kampaň s výrazným veřejným profilem. Očekávání veřejnosti byla vysoká a ve volbě mezi regionálními představiteli zvítězil drtivě.\n\nKoizumi se svým stylem a vystupováním, které se odklonily od staré Liberálně demokratické strany, pozvedl prapor „reforem“ a ujal se úřadu premiéra.\nCo však povstane z trosek, které slíbil zničit, zatím nikdo neví." # todo: NEW TRANSLATION
 JAP_historical.20010426.oA: "Reformy, ihned!" # todo: NEW TRANSLATION
 JAP_historical.20060926.t: "Pokračování, nebo nástupnictví?" # todo: NEW TRANSLATION
 JAP_historical.20060926.d: "Premiér Džuničiró Koizumi, který vedl dlouhodobou vládu trvající přes pět let, oznámil svůj záměr odstoupit po skončení svého mandátu předsedy LDP. Přestože Koizumi veřejně uvedl, že si přeje na konci mandátu odstoupit, veřejná podpora mu zůstávala vysoká a mnozí uvnitř strany nadále volali po jeho prodloužení.\n\nUvnitř LDP se mezitím objevil jako hlavní nástupce Šinzó Abe, který rychle stoupal stranickými strukturami a v mladém věku se stal hlavním tajemníkem vlády. Díky svému mládí, známosti, politickému původu a symbolickému postavení „postkoizumiovské“ osobnosti získával širokou podporu napříč stranou.\n\nKdo je vhodnější k vedení národa vpřed — zkušený úřadující představitel, nebo nový vůdce připravený předat pochodeň další generaci? Čas rozhodnutí nadešel." # todo: NEW TRANSLATION
 JAP_historical.20060926.oA: "Džuničiró Koizumi" # todo: NEW TRANSLATION
 JAP_historical.20060926.oB: "Šinzó Abe" # todo: NEW TRANSLATION
 JAP_historical.20070926.t: "Kontinuita, nebo obnova?" # todo: NEW TRANSLATION
 JAP_historical.20070926.d: "Premiér Šinzó Abe náhle oznámil svůj záměr rezignovat s odvoláním na rostoucí obtíže při řízení vlády. Od jeho nástupu do úřadu uplynul teprve rok. Série skandálů ministrů vážně otřásla základy jeho vlády.\nV reakci na jeho rezignaci někteří členové LDP prosazují návrat bývalého hlavního tajemníka vlády Jasua Fukudy s argumentem, že „k obnovení důvěry veřejnosti je zapotřebí nová tvář“. Mnoho hlasů však stále důrazně podporuje pokračování Abeho.\n\nJaponsko nyní stojí uprostřed politických otřesů. Nastal čas rozhodnout, kdo převezme kormidlo národa." # todo: NEW TRANSLATION
 JAP_historical.20070926.oA: "Šinzó Abe" # todo: NEW TRANSLATION
 JAP_historical.20070926.oB: "Jasuo Fukuda" # todo: NEW TRANSLATION
 JAP_historical.20080924.t: "Tichý přechod, nebo odvážný obrat?" # todo: NEW TRANSLATION
 JAP_historical.20080924.d: "Premiér Jasuo Fukuda nečekaně uspořádal tiskovou konferenci v úřadu premiéra a oznámil svou rezignaci.\n\nBěhem konference uvedl: „V zájmu každodenního života lidu doufám, že nová vláda uskuteční tyto politiky,“ čímž prokázal klidné přijetí změny ve vedení. Protože však jasně nevysvětlil důvody své rezignace, oznámení zanechalo mnoho občanů zmatených a nejistých.\nV reakci na to Liberálně demokratická strana rychle zahájila přípravy na volbu nového předsedy. Generální tajemník Taró Asó se objevil jako hlavní kandidát a rychle získával podporu různých stranických frakcí. Přesto malý počet hlasů uvnitř strany nadále volá po setrvání Fukudy.\n\nJe změna tím, co země potřebuje k prolomení politické stagnace? Nebo je v této chvíli pro Japonsko důležitější stabilita? Čas rozhodnutí nadešel." # todo: NEW TRANSLATION
 JAP_historical.20080924.oA: "Jasuo Fukuda" # todo: NEW TRANSLATION
 JAP_historical.20080924.oB: "Taró Asó" # todo: NEW TRANSLATION
 JAP_pm_mori_takes_office_tt: "§YYoširó Mori§! se stává premiérem" # todo: NEW TRANSLATION
 JAP_pm_koizumi_takes_office_tt: "§YDžuničiró Koizumi§! se stává premiérem" # todo: NEW TRANSLATION
 JAP_pm_abe_takes_office_tt: "§YŠinzó Abe§! se stává premiérem" # todo: NEW TRANSLATION
 JAP_pm_fukuda_takes_office_tt: "§YJasuo Fukuda§! se stává premiérem" # todo: NEW TRANSLATION
 JAP_pm_aso_takes_office_tt: "§YTaró Asó§! se stává premiérem" # todo: NEW TRANSLATION
 japan_classic.18.t: "Moriho politická ostuda" # todo: NEW TRANSLATION
 japan_classic.18.d: "Dne 15. května 2000 se nově zvolený premiér Yoshirō Mori poprvé dostal do masivních negativních titulků, když veřejně označil Japonsko za „božský národ soustředěný na císaře“. To podle opozice i vládnoucí LDP vyvolává pochybnosti o demokratických ideálech Japonska i o roli monarchie.\nVeřejná podpora premiéra klesla." # todo: NEW TRANSLATION
 japan_classic.18.o1: "Co za hlupáka!" # todo: NEW TRANSLATION
 japan_classic.18.o2: "Jeho výroky dále zopakovat." # todo: NEW TRANSLATION
 Japan.01.t: "Nabídka tradicionalistických sil" # todo: NEW TRANSLATION
 Japan.01.d: "Zatímco pokračuje kontroverze kolem výroků premiéra Moriho, různé skupiny a komentátoři tvrdící, že by měl být císařský dvůr znovu posouzen jako centrum státního uspořádání Japonska, zintenzivnili svou činnost. Obrátili se na vládu s návrhem, že pokud jasněji prokáže ochotu hájit tradici a národní charakter, mohou ji podpořit formováním veřejného mínění a základním politickým aktivismem.\n\nUžší vztahy s těmito silami však riskují setření hranice mezi konzervatismem establishmentu a radikálním monarchismem, což by mohlo přinést novou kritiku vlády. Máme tuto nabídku využít, nebo si zachovat odstup?" # todo: NEW TRANSLATION
 Japan.01.a: "Zachovat odstup." # todo: NEW TRANSLATION
 Japan.01.b: "Využít je jako politickou páku." # todo: NEW TRANSLATION
 JAP_historical.121006001.t: "Tottorské zemětřesení v roce 2000" # todo: NEW TRANSLATION
 JAP_historical.121006001.d: "Japonsko se skládá z vulkanických souostroví, která plují na Ohnivém kruhu. To znamená, že Japonsko a jeho obyvatelé musí neustále zažívat silná zemětřesení. V minulém tisíciletí se to nezměnilo a nezmění se to ani v tisíciletí příštím.\n\n6. října 2000 ve 13:30 — Západní Šimane zasáhlo zemětřesení o magnitudu 7,3 a intenzitě 6+. Způsobilo rozsáhlé škody na mnoha silnicích a domech a otřesy byly cítit i ve vzdálených oblastech, jako jsou Ósaka a Fukuoka. Zejména Kóbe zažilo silné zemětřesení poprvé od Velkého zemětřesení Hanshin-Awaji v roce 1995." # todo: NEW TRANSLATION
 JAP_historical.disaster_help: "Pomozme jim okamžitě!" # todo: NEW TRANSLATION
 JAP_historical.disaster_leave: "Nechme je být. Vzpamatují se sami." # todo: NEW TRANSLATION
 JAP_historical.130210001.t: "Katastrofa lodi Ehime Maru" # todo: NEW TRANSLATION
 JAP_historical.130210001.d: "Dne 9. února 2001 byla cvičná rybářská loď střední školy Ehime Maru rozdrcena ponorkou [USA.GetName] Greeneville. Ehime Maru, na jejíž palubě bylo 35 japonských studentů a učitelů, se potopila a devět lidí zahynulo.\n\nZatímco úředníci obou vlád shromažďují veškeré informace o této tragické nehodě, premiér [Root.GetLeader] tráví dovolenou hraním golfu.\n\nSamozřejmě by měl dovolenou ukončit a okamžitě se vrátit do Tokia, že?" # todo: NEW TRANSLATION
 JAP_historical.130210001.oA: "Okamžitě se vraťte do Tokia!" # todo: NEW TRANSLATION
 JAP_historical.130210001.oB: "Počkejte! Ještě jednu ránu..." # todo: NEW TRANSLATION
 JAP_koizumi_appear_TT: "Mori si možná užívá golf, ale jeho politický vliv pravděpodobně výrazně oslabí. Strana možná brzy začne hledat §Ynového vůdce.§!" # todo: NEW TRANSLATION
 JAP_historical.130324001.t: "Zemětřesení Geiyo v roce 2001" # todo: NEW TRANSLATION
 JAP_historical.130324001.d: "24. března 2001 v 15:27 — Západní Hirošimu zasáhlo zemětřesení o magnitudu 6,7 a intenzitě 6-. Dva lidé zahynuli a 288 bylo zraněno. Největší škody utrpělo Kure, město nejblíže seismickému středu. Na druhou stranu mnoho dalších místních samospráv škody zmírnilo, protože po Velkém zemětřesení Hanshin-Awaji v roce 1995 a loňském šimanském zemětřesení přijaly protiopatření. Hlavními škodami bylo poškození vodovodního potrubí a sesuvy povrchu hor." # todo: NEW TRANSLATION
 JAP_historical.9130901001.t: "Požár budovy v Kabukičó" # todo: NEW TRANSLATION
 JAP_historical.9130901001.d: "Před úsvitem 1. září 2001 zachvátil požár budovu „Mjódžó 56“, která se nacházela v tokijské čtvrti Kabukičó v obvodu Šindžuku. Požár zabil 44 lidí, kteří navštívili mahjongový salon a striptýzový klub, v důsledku otravy oxidem uhelnatým. Podle zprávy hasičů byl požár zpočátku malý, ale rozšířil se vlivem zpětného tahu poté, co zaměstnanec, který jej objevil, otevřel dveře. Zpráva také uvedla, že požární hlásiče byly zakryty stropem nebo odpojeny kvůli poruše, takže včasné hašení nebylo možné. Další zpráva uvádí, že zaměstnanci budovy návštěvníky nevedli k evakuaci. Mezitím společné vyšetřování metropolitní policie a hasičů zjistilo, že plynové potrubí bylo nepřirozeně poškozeno. Přestože příčina požáru — nehoda, nebo žhářství — stále není jasná, je zřejmé, že nedostatečné povědomí o požární prevenci jeho následky zhoršilo." # todo: NEW TRANSLATION
 JAP_historical.9130901001.oA: "Doufejme, že už nikdy neuvidíme horší požár budovy." # todo: NEW TRANSLATION
 JAP_historical.131201001.t: "Narození Její Výsosti princezny Aiko" # todo: NEW TRANSLATION
 JAP_historical.131201001.d: "Dne 1. prosince 2001 se v nemocnici v císařském paláci narodila dcera korunního prince Naruhita a jeho choti Masako. První císařská princezna narozená ve třetím tisíciletí dostala jméno Aiko podle Mencia, klasické knihy čínského konfucianismu. Její Výsost císařská princezna Aiko je rovněž vnučkou Jeho Veličenstva císaře Akihita. Po dlouhé době od narození Jeho Výsosti prince Fumihita Akishino-no-Miya v roce 1965 šlo o nejšťastnější událost, kterou oslavovali téměř všichni obyvatelé země. V císařském paláci pak 20 000 lidí včetně politiků a celebrit zvolalo Banzai. Někteří lidé se však obávali, že tato situace povede k zániku současné linie císařské rodiny. Choť prince Masako byla již příliš stará na to, aby měla dítě, takže druhé dítě by bylo riskantní. Pokud by princezna Aiko dospěla, mohla by se stát „poslední císařovnou císařské rodiny“ v matrilineární linii, protože mezi dvěma princi — Naruhitem a Fumihitem — je poměrně velký věkový rozdíl. To by však porušilo zákon o císařské domácnosti, podle něhož je císařský trůn povolen pouze patrilineární linii. Nakonec všichni začali diskutovat o změně tohoto zákona, která by umožnila matrilineární císařovnu." # todo: NEW TRANSLATION
 JAP_historical.131201001.oA: "Banzai!" # todo: NEW TRANSLATION
 JAP_historical.150526001.t: "Zemětřesení u Mijagi v roce 2003" # todo: NEW TRANSLATION
 JAP_historical.150526001.d: "26. května 2003 v 18:24 — U hranice prefektur Mijagi a Iwate došlo k zemětřesení o magnitudu 7,1 a intenzitě 6-. Velké části regionu Tóhoku utrpěly značné škody, například zničení mostů na šinkansenu a sesuvy půdy v horách, nikdo však nezahynul. Cunamí bylo tentokrát mírné jako vlnění na hladině. Přesto otřesy pocítilo mnoho lidí od Hokkaida až po Kantó." # todo: NEW TRANSLATION
 JAP_historical.150726001.t: "Druhá série zemětřesení u Mijagi v roce 2003" # todo: NEW TRANSLATION
 JAP_historical.150726001.d: "Dne 26. července 2003 zasáhla severní Mijagi opakovaná zemětřesení — během jediného dne celkem ČTYŘIKRÁT, od půlnoci až do večera! Nejsilnější z nich zaznamenalo v 7:13 magnitudo 6,4 a intenzitu 6+, zatímco i nejslabší dosáhlo magnituda 5,1 a intenzity 5-. Tato zemětřesení způsobila škody nejen na stovkách domů, ale také na letecké základně Macušima Japonských vzdušných sil sebeobrany. Byl to velmi nepříjemný den, ale naštěstí nikdo nezahynul." # todo: NEW TRANSLATION
 JAP_historical.150926001.t: "Zemětřesení na Hokkaidu v roce 2003" # todo: NEW TRANSLATION
 JAP_historical.150926001.d: "26. září 2003 ve 4:50 — U jižního Hokkaida došlo k zemětřesení o magnitudu 8,0 a intenzitě 6-. Otřesy silně zasáhly jen několik měst, brzy však odhalily svou skutečně děsivou následnou zkázu. Zemětřesení způsobilo ztekucení půdy v pobřežní navážce a požáry nádrží s ropou. Kromě toho východní pobřeží Japonska zasáhlo obrovské cunamí a dva lidé zahynuli." # todo: NEW TRANSLATION
 JAP_historical.20030926.t: "Sloučení DPJ a Liberální strany: Liberální strana vstupuje do Demokratické strany" # todo: NEW TRANSLATION
 JAP_historical.20030926.d: "Snahy o sjednocení sil stojících mimo LDP nabývají na rychlosti. Po opakovaných jednáních se Demokratická strana a Liberální strana dohodly, že hlavní politický nástroj tábora mimo LDP sjednotí do jediné organizace.\n\nLiberální strana se rozpustí a jako pohlcená strana se sloučí s Demokratickou stranou. Tím se zvýší přítomnost tábora mimo LDP v parlamentu, ale zároveň mohou vzniknout nová ohniska napětí, protože strany budou soupeřit o směr politiky a vedení." # todo: NEW TRANSLATION
 JAP_historical.20030926.a: "Přeskupování tábora mimo LDP nyní začíná." # todo: NEW TRANSLATION
 JAP_historical.161023001.t: "Zemětřesení Niigata Čúecu v roce 2004" # todo: NEW TRANSLATION
 JAP_historical.161023001.d: "23. října 2004 v 17:56 — V Niigatě došlo k zemětřesení o magnitudu 6,8 a intenzitě 7. Šlo o první zaznamenané zemětřesení o intenzitě 7 podle stupnice JMA od její revize po hanshinském zemětřesení v roce 1995. V Jamakoši byly sesuvy půdy zničeny všechny silnice a všichni obyvatelé zůstali uvězněni ve vesnici. Vlak jedoucí po trati Joecu šinkansen se vlivem otřesů vykolejil, nikdo však nezahynul. V důsledku zemětřesení ale zemřelo celkem 68 lidí." # todo: NEW TRANSLATION
 JAP_historical.170320001.t: "Zemětřesení u Fukuoky v roce 2005" # todo: NEW TRANSLATION
 JAP_historical.170320001.d: "20. března 2005 v 10:53 — U města Fukuoka došlo k zemětřesení o magnitudu 7,0 a intenzitě 6-. V severním Kjúšú je záznamů o zemětřeseních málo a toto bylo zároveň nejsilnější od roku 1922. Na ostrově Gengai ve městě Fukuoka bylo evakuováno přibližně 700 lidí a deset se rozhodlo zůstat kvůli komunikaci během katastrofy a hlídkování. Ve střední Fukuoce se rozbila většina oken, jejichž střepy dopadly na chodník a zranily dva chodce. Zemětřesení otřáslo nejen Cušimou, ale i Koreou a Čínou. Jeden člověk při něm zahynul." # todo: NEW TRANSLATION
 JAP_historical.170425001.t: "Nehoda vykolejení na trati Fukuti jama" # todo: NEW TRANSLATION
 JAP_historical.170425001.d: "Dne 25. dubna 2005 v 9:18 vykolejil rychlík na trati Fukutšijama společnosti JR West, známé také jako trať JR Takarazuka, v ostré zatáčce ve městě Amagasaki v prefektuře Hjógo a narazil do prvního patra nedalekého bytového domu.\nVlak měl sedm vozů, ačkoli první zprávy mylně uváděly pouze šest, protože vedoucí vůz se do budovy zcela zabořil. Vyšetřování odhalilo, že vlak vjel do zatáčky rychlostí přibližně 116 km/h, přestože rychlostní limit v daném úseku činil 70 km/h. Nadměrná rychlost pravděpodobně způsobila vykolejení v důsledku odstředivé síly.\nStrojvůdce při nehodě zahynul, ale svědectví průvodčího v zadním voze naznačovalo, že se posádka možná snažila dohnat přibližně devadesátisekundové zpoždění. Později vyšlo najevo, že ve společnosti existovala přísná interní disciplinární opatření i za drobné provozní chyby. Patřila mezi ně přeškolení, ruční opisování firemních pravidel a další nápravné postupy, jejichž původ sahal až k privatizaci Japonských státních drah za vlády Nakasoneho.\nNaštěstí dokázal rychlík přijíždějící z opačného směru nouzově zastavit kvůli zablokované trati a zabránil další srážce. Protože k nehodě došlo během ranní špičky, byl vlak přeplněný. Celkem zahynulo 107 lidí a 562 bylo zraněno, což z ní činí nejsmrtelnější železniční nehodu v poválečných dějinách Japonska. Někteří lékařští specialisté uvedli, že několik cestujících nemuselo zemřít bezprostředně při nárazu, ale později v důsledku crush syndromu způsobeného dlouhodobým stlačením." # todo: NEW TRANSLATION
 JAP_historical.180906001.t: "Narození Jeho Výsosti prince Hisahita" # todo: NEW TRANSLATION
 JAP_historical.180906001.d: "Dne 6. září 2006 se v soukromé nemocnici v Minami Azabu narodil syn prince Fumihita a jeho choti Kiko. První císařský princ narozený ve třetím tisíciletí dostal jméno Hisahito, v němž „Hisa“ znamená „uvolněným způsobem“ a „Hito“ odkazuje na císařskou tradici pojmenovávání z období Heian. Narodil se císařským řezem v soukromé nemocnici, nikoli v císařském paláci; obojí se v císařských dějinách stalo poprvé. Jeho narození bylo vítáno jako příchod legitimního mužského nástupce císařského trůnu i jako narození nového člena císařské rodiny. Po narození chlapce začala debata o změně zákona o císařské domácnosti postupně utichat." # todo: NEW TRANSLATION
 JAP_historical.180906001.oA: "Banzai!" # todo: NEW TRANSLATION
 JAP_historical.20070307.t: "Záhadné výdaje na energie" # todo: NEW TRANSLATION
 JAP_historical.20070307.d: "V březnu 2007 bylo během zasedání rozpočtového výboru Sněmovny radních odhaleno, že politická finanční organizace ministra zemědělství, lesnictví a rybolovu Tošikacu Macuoky, „Nové století politického a ekonomického fóra Tošikacu Macuoky“, vykázala ve svých zprávách o financování politiky za pět let od roku 2001 do roku 2005 celkové výdaje na energie ve výši přibližně 28,8 milionu jenů.\n\nZvláštní pozornost vzbudila skutečnost, že „hlavní kancelář“ organizace sídlila v budově kanceláří poslanců Sněmovny reprezentantů, kde jsou voda, elektřina a klimatizace poskytovány zdarma.\nMinistr Macuoka vysvětlil, že výdaje zahrnovaly náklady na „ionizátor vody“ a „elektrické vytápění“, nedokázal však vykázané částky jasně odůvodnit. Během pozdějších parlamentních zasedání odmítl věc dále vysvětlovat s tím, že „podle systému není vyžadováno žádné další vysvětlení“.\n\nOpoziční strany situaci ostře kritizovaly a označily ji za možný „nepravdivý výkaz“ a „zneužití systému“, zatímco nedůvěra veřejnosti v celkovou odpovědnost vlády rostla." # todo: NEW TRANSLATION
 JAP_historical.20070307.oA: "Požadovat po ministrovi úplné veřejné vysvětlení" # todo: NEW TRANSLATION
 JAP_historical.20070307.oB: "Bránit ho až do ukončení vyšetřování" # todo: NEW TRANSLATION
 JAP_historical.20070528.t: "Příliš těžké břemeno" # todo: NEW TRANSLATION
 JAP_historical.20070528.d: "Ministr zemědělství, lesnictví a rybolovu Tošikacu Macuoka byl nalezen oběšený ve svém parlamentním sídle v tokijské Akasace. Policie později potvrdila, že šlo o sebevraždu.\n\nMinistr Macuoka čelil několik měsíců intenzivnímu zkoumání v parlamentu, médiích i veřejném mínění kvůli vysokým výdajům na energie uvedeným v záznamech o financování jeho politické činnosti.\n\nZpráva vyvolala mezi veřejností šok a položila hlubší otázky: \"Měl být činěn odpovědným jen on?\" a \"Byla reakce vlády skutečně dostatečná?\"" # todo: NEW TRANSLATION
 JAP_historical.20070528.oA: "Jaká tragédie..." # todo: NEW TRANSLATION
 JAP_historical.20070801.t: "Řetězec skandálů: Tíha odpovědnosti" # todo: NEW TRANSLATION
 JAP_historical.20070801.d: "Po smrti ministra zemědělství, lesnictví a rybolovu Tošikaca Macuoky byl jeho nástupcem jmenován Norihiko Akagi. O pouhé dva měsíce později však byl prakticky donucen rezignovat poté, co vyšlo najevo několik problémů týkajících se jeho zprávy o financování politické činnosti, včetně výdajů na kanceláře, nakládání s dary a dvojího vykazování účtenek jeho politickou skupinou \"Tokujúkai.\"\n\nVzhledem k tomu, že se dva po sobě jdoucí ministři zemědělství během tak krátké doby zapletli do skandálů, vyvstaly vážné otázky ohledně smyslu vlády pro odpovědnost, transparentnost a spolehlivost při jmenování členů kabinetu. Post ministra zemědělství začal být vnímán jako \"prokletý\" a vláda je nyní pod tlakem, aby podnikla rozhodné kroky k obnovení důvěry a stabilizaci svého vedení." # todo: NEW TRANSLATION
 JAP_historical.20070801.oA: "Proč se to pořád děje? Musíme znovu získat důvěru lidu." # todo: NEW TRANSLATION
 JAP_historical.20070704.t: "Osudné přeřeknutí" # todo: NEW TRANSLATION
 JAP_historical.20070704.d: "Během veřejné přednášky učinil ministr obrany Fumio Kjúma kontroverzní poznámku, v níž naznačil, že atomové bombardování Hirošimy a Nagasaki bylo \"nevyhnutelné.\"\nPoznámka byla široce vykládána jako schvalování bombardování a vyvolala ostrou reakci mezi skupinami přeživších atomových útoků i veřejností. Kritika přicházela od zákonodárců vládních i opozičních stran, stejně jako od místních samospráv. Předseda vlády Abe vydal formální důtku.\nPo této poznámce uspořádali místní představitelé a občanské skupiny v postižených městech protesty vsedě, čímž se kontroverze změnila v plnohodnotnou politickou krizi. Kjúma nakonec rezignoval na funkci ministra obrany a jeho nástupkyní byla jmenována Juriko Koikeová.\n\nTo, co začalo jako \"pouhé přeřeknutí jednoho ministra\", se stalo vážnou zkouškou vládních schopností a mezinárodní důvěryhodnosti." # todo: NEW TRANSLATION
 JAP_historical.20070704.oA: "Jako vláda musíme vyjádřit upřímnou a hlubokou lítost." # todo: NEW TRANSLATION
 JAP_historical.190216001.t: "\"Ztracený důchod\"" # todo: NEW TRANSLATION
 JAP_historical.190216001.d: "V roce 1997 začala Japonská agentura sociálního pojištění (SIA) slučovat jednotlivé důchodové záznamy v rámci jediného systému \"základních důchodových čísel\". V letech 2006 až 2007 však agentura zjistila přibližně 50 milionů důchodových záznamů, které zůstaly nepropojené nebo obsahovaly nesrovnalosti kvůli chybám při přepisování papírových dokumentů do digitální podoby.\nNěkteré z těchto chybějících záznamů se týkaly současných příjemců důchodů, což vyvolalo obavy, že někteří lidé mohli dostávat nesprávné částky. Kromě toho byly některé záznamy údajně ztraceny nebo omylem smazány při pokusech aktualizovat údaje o zaměstnaneckých důchodech.\nV reakci na to [JAP.GetRulingParty] vytvořila zvláštní pracovní skupinu pro vyšetření problému a navrhla naléhavou legislativu na pomoc postiženým. Opoziční strany však vládu ostře kritizují a nespokojenost veřejnosti zůstává vysoká." # todo: NEW TRANSLATION
 JAP_historical.190216001.oA: "Jaká katastrofa!" # todo: NEW TRANSLATION
 JAP_historical.190325001.t: "Zemětřesení v Noto v roce 2007" # todo: NEW TRANSLATION
 JAP_historical.190325001.d: "25. března 2007 v 9:41 dopoledne zasáhlo oblast Hokuriku silné zemětřesení o síle M6,9. Japonská meteorologická agentura vyhodnotila otřesy ve městě Wajima v prefektuře Išikawa na stupeň 6+, což bylo nejsilnější zemětřesení od zahájení seismologických pozorování v roce 1922. Hypocentrum se podle zpráv nacházelo v oblasti, kde výzkumníci dosud žádný zlom nenašli. Otřesy byly cítit od prefektury Hokkaidó až po prefekturu Kóči a způsobily tsunami vysokou 20 cm (7,87 palce). Zemětřesení zabilo jednoho člověka zřícenou kamennou lucernou, zranilo 356 lidí a poškodilo více než 30 000 budov a domů." # todo: NEW TRANSLATION
 JAP_historical.190716001.t: "Zemětřesení u pobřeží Čúecu v roce 2007" # todo: NEW TRANSLATION
 JAP_historical.190716001.d: "16. července 2007 v 10:13 dopoledne zasáhlo prefekturu Niigata další zemětřesení o síle M6,8. Japonská meteorologická agentura vyhodnotila otřesy v několika městech na stupeň 6+, avšak v jaderné elektrárně Kašiwazaki-Kariwa byly neoficiálně vyhodnoceny na stupeň 7. Otřesy rovněž způsobily tsunami, které bylo ve městě Kašiwazaki zaznamenáno ve výšce 1 m (3,28 stopy). Zemětřesení přímo i nepřímo zabilo 15 lidí, zranilo 2 346 lidí a poškodilo více než 34 000 budov, včetně 1 331 zničených domů. V již zmíněné jaderné elektrárně Kašiwazaki-Kariwa vypukl požár, jehož uhašení se kvůli chybě při sdílení informací v počáteční fázi zásahu zpozdilo o dvě hodiny. To způsobilo únik radioaktivity, byť v rámci ekologicky zanedbatelné úrovně. K tomuto zemětřesení došlo pouhé čtyři měsíce po zemětřesení v Noto a tři roky po ničivém zemětřesení v Niigatě Čúecu v roce 2004." # todo: NEW TRANSLATION
 JAP_historical.200614001.t: "Zemětřesení Iwate-Mijagi Nairiku v roce 2008" # todo: NEW TRANSLATION
 JAP_historical.200614001.d: "14. června 2008 v 8:43 dopoledne došlo pod prefekturou Iwate k silnému zemětřesení o síle M7,2. Japonská meteorologická agentura vyhodnotila otřesy ve městech Kurihara v prefektuře Mijagi a Óšú v prefektuře Iwate na stupeň 6+. Přestože šlo o vnitrozemské zemětřesení, otřesy o síle přesahující stupeň 3 byly zaznamenány od Hokkaida až po oblast Kantó. Zemětřesení jako vzácný případ poškodilo jen několik budov, ale způsobilo četné sesuvy půdy. Nakonec zahynulo 17 lidí, 70 bylo těžce zraněno, 356 lehce zraněno a 6 lidí je stále pohřešováno. Byly hlášeny například zřícení mostu a poškození kulturních památek." # todo: NEW TRANSLATION
 JAP_historical.210811001.t: "Zemětřesení v zálivu Suruga v roce 2009" # todo: NEW TRANSLATION
 JAP_historical.210811001.d: "11. srpna 2009 v 5:07 ráno došlo v zátoce Suruga k velkému zemětřesení o síle M6,5, které zabilo jednoho člověka a 319 zranilo. Otřesy způsobily tsunami vysokou 40 cm (1,31 stopy). Japonská meteorologická agentura vyhodnotila zemětřesení v mnoha oblastech prefektury Šizuoka na stupeň 6−. Poškozeno bylo 8 678 domů a několik historických budov, žádný dům však nebyl zcela zničen. Oblast Tókai, do níž patří i prefektura Šizuoka, je považována za kritickou oblast budoucího ničivého zemětřesení a tsunami Velké Tókai-Tónankai. Obyvatelé se proto připravovali evakuačními cvičeními, zajišťováním vlastního nábytku a posilováním domů a budov. To byl důvod menšího počtu obětí a škod v poměru k síle zemětřesení. Přesto byly hlášeny škody v továrnách, čajových plantážích a na dálnici Tómei." # todo: NEW TRANSLATION
 JAP_historical.20090808.t: "Založení Vaší strany" # todo: NEW TRANSLATION
 JAP_historical.20090808.d: "S rostoucími očekáváními změny vlády zůstává silná nespokojenost s pomalým rozhodováním stávajících stran a strnulostí vlády. V této atmosféře postavili Jošimi Watanabe a další do popředí \"reformu\" a vyzvali ke sjednocení nové politické síly, která by nebyla závislá na stávajícím rámci.\n\nTak bylo oznámeno založení Vaší strany. Toto hnutí, prosazující správní reformu a deregulaci, rozšíří voličům možnosti volby a zároveň dále urychlí přeskupování a taktizování v japonské politice." # todo: NEW TRANSLATION
 JAP_historical.20090808.a: "Pod praporem reformy se začíná pohybovat nová síla." # todo: NEW TRANSLATION
 JAP_historical.20120928.t: "Založení Strany japonské inovace" # todo: NEW TRANSLATION
 JAP_historical.20120928.d: "Jak se šířila nedůvěra ke stávajícím stranám a nespokojenost s politickou stagnací, reformní hnutí založené na regionální straně Ósacká asociace obnovy, která rozšiřovala svůj vliv v Ósace, se začalo přesouvat k celostátní politice. Toto uskupení, které si v regionální politice získalo význam prosazováním revize místní správy a reformy řízení, mělo být přeměněno v celostátní politickou sílu a přitáhnout pozornost jako alternativa k zavedeným stranám.\n\nZaložení Strany japonské inovace by neznamenalo pouze vznik nové strany, ale také událost, která dále urychlí přeskupení opozice a formování \"třetí síly.\"" # todo: NEW TRANSLATION
 JAP_historical.20120928.a: "Do celostátní politiky vstupuje nová reformní síla." # todo: NEW TRANSLATION
 JAP_historical.20141128.t: "Rozpuštění Vaší strany" # todo: NEW TRANSLATION
 JAP_historical.20141128.d: "Vaše strana, která si vybudovala pozici \"třetí síly\" stojící proti stávajícím velkým stranám, stále obtížněji udržovala vnitřní jednotu, protože se postupně prohlubovaly rozdíly v názorech na směřování vedení strany a reakce na volby.\n\nStrana se nakonec rozhodla rozpustit a její zákonodárci se vydali každý vlastní cestou. Rozptýlení síly, která se shromáždila pod praporem reformy, znovu zdůrazňuje proměnlivou povahu přeskupování opozice a pravděpodobně bude mít značný dopad i na budoucí politickou mapu." # todo: NEW TRANSLATION
 JAP_historical.20141128.a: "Jedno z pilířů třetí síly končí." # todo: NEW TRANSLATION
 JAP_historical.20170925.t: "Přeskupení opozice: Rozkol mezi Nadějí a konstitučními demokraty" # todo: NEW TRANSLATION
 JAP_historical.20170925.d: "Síly mimo Liberálnědemokratickou stranu vstupují do významné fáze přeskupování. Nově vznikající Strana naděje rychle přitáhla pozornost jako nový reformně orientovaný nástroj na pozadí nespokojenosti se stávajícími stranami a pocitu politické stagnace. Pro některé části zavedeného tábora mimo LDP se sloučení a spolupráce jevily jako příležitost k obnovení síly, zároveň se však začaly postupně objevovat konflikty ohledně politického směřování a podmínek sloučení.\nSíly vycházející z bývalé Demokratické strany se nesjednotily v jediný blok: některé se sloučily nebo spolupracovaly se Stranou naděje, zatímco jiné vytvořily Konstituční demokratickou stranu a přijaly samostatnou linii. Přeskupování pokračovalo, ale zároveň se vyjasňovalo rozdělení a struktura sil mimo LDP byla dramaticky překreslena." # todo: NEW TRANSLATION
 JAP_historical.20170925.a: "Tábor mimo LDP se rozdělil mezi Naději a konstituční demokraty." # todo: NEW TRANSLATION
 JAP_historical.20170925_TT: "§YDemokratická strana bude nahrazena Konstituční demokratickou stranou!§!" # todo: NEW TRANSLATION
 JAP_historical.20180507.t: "Přeskupení opozice: Vznik Demokratické strany pro lid" # todo: NEW TRANSLATION
 JAP_historical.20180507.d: "Opoziční síly, reorganizované rozkolem mezi Stranou naděje a Konstituční demokratickou stranou, se dále přeskupovaly. Část bývalého tábora Demokratické strany a část tábora Strany naděje, navzdory přetrvávajícím neshodám, usilovaly o sjednocení v novou centristickou sílu a Strana naděje postupně ztrácela význam jako samostatný rámec.\nČasem vznikla Demokratická strana pro lid. To znamenalo také vytvoření nového politického nástroje prosazujícího centristickou linii odlišnou od Konstituční demokratické strany a struktura opozice se měla dále proměňovat." # todo: NEW TRANSLATION
 JAP_historical.20180507.a: "Přeskupování pokračuje a podoba opozice se stále mění." # todo: NEW TRANSLATION
 JAP_historical.20180507_TT: "§YStrana naděje bude nahrazena Demokratickou stranou pro lid!§!" # todo: NEW TRANSLATION
 JAP_historical.20190401.t: "Založení Reiwa Šinsengumi" # todo: NEW TRANSLATION
 JAP_historical.20190401.d: "Uprostřed doutnající nedůvěry ke stávajícím stranám a nespokojenosti s nejistotou živobytí se Taró Jamamoto a další rozhodli založit novou politickou sílu. Toto hnutí zdůrazňuje podporu zdola, která není závislá na velkých organizacích, a prosazuje přenesení hlasů do celostátní politiky, které zavedený politický řád nedokáže plně zachytit. Lze je proto vnímat jako sílu, která staví do popředí výzvy zaměřené na životní podmínky, včetně podpory domácností, rozšíření sociálního zabezpečení a přehodnocení zátěže, jako je spotřební daň.\n\nZaložení Reiwa Šinsengumi rozšiřuje možnosti v rámci opozičních sil a zároveň znovu zdůrazňuje proměnlivost politického přeskupování." # todo: NEW TRANSLATION
 JAP_historical.20190401.a: "Nová lidová síla oznamuje svůj vstup do celostátní politiky." # todo: NEW TRANSLATION
 Japan.3.t: "Císař Akihito abdikuje" # todo: NEW TRANSLATION
 Japan.3.d: "Císař Akihito právě se vzdal vlády nad japonskými zeměmi, od této chvíle převezme vedení jeho syn Naruhito." # todo: NEW TRANSLATION
 Japan.3.a: "Nový císař!" # todo: NEW TRANSLATION
 Japan.105.t: "Vyhlášení císařství" # todo: NEW TRANSLATION
 Japan.105.d: "Prohlášení leží rozepsané na stole kabinetu, vedle něj pečeť a datum zůstává prázdné. Není už co dalšího obnovovat: rod stojí, obřady jsou zachovány a Tajná rada zasedá. Neujasněné zůstává pouze znění.\n\nMinistr armády promluví jako první. Říše se měří na kontinentu, počtem postavených divizí a drženým územím, a prohlášení by to mělo říkat. Ministr námořnictva odpoví bez zvýšení hlasu. Japonsko je ostrovní země, která žije ze svých námořních cest, a standarta vztyčená nad flotilou bude správně pochopena v každém přístavu od Vladivostoku po Singapur. Oba muži zmlknou a pohlédnou k trůnu." # todo: NEW TRANSLATION
 Japan.105.a: "£JAP_EMPIRE_flag     Síla císařství spočívá v jeho armádách." # todo: NEW TRANSLATION
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag     Síla císařství spočívá na vodě." # todo: NEW TRANSLATION
 JAP_historical.20220710.t: "Vzestup Sanseító" # todo: NEW TRANSLATION
 JAP_historical.20220710.d: "Uprostřed sílící debaty o nedůvěře ke stávajícím stranám a pocitu odcizení od politické účasti začala Sanseító, nová politická síla, která rozšířila svou podporu prostřednictvím místních aktivit a informačního dosahu, zaujímat místo na celostátní politické scéně. Díky místnímu budování organizace a vlastním specifickým výzvám přitahuje stále větší pozornost jako nástroj pro skupiny, které velké strany dosud nedokázaly plně oslovit.\n\nSanseító zdůrazňuje svůj odstup od zavedených stran a rozšiřuje se jako nová strana, která klade důraz na účast a dosah svých členů a podporovatelů. Její snaha dostat do popředí otázky vzdělávání, potravin, sociálních systémů a povědomí o suverenitě získává podporu, zároveň však může být faktorem, který naruší stávající stranické uspořádání a strukturu témat.\n\nRůst této nové síly je změnou, kterou zavedené strany nemohou ignorovat, a může ovlivnit také budoucí přeskupování opozice a konzervativních sil i stanovování politické agendy." # todo: NEW TRANSLATION
 JAP_historical.20220710.a: "Nově vznikající síla posiluje své postavení v politice." # todo: NEW TRANSLATION
 Japan.8.t: "Čína požaduje ostrovy Senkaku!" # todo: NEW TRANSLATION
 Japan.8.d: "Čína oživila svůj spor s námi o vlastnictví ostrovů Senkaku. Pokud ustoupíme jejich požadavkům, může to posílit Číny důvěru ve schopnost ovlivňovat naši zahraniční politiku a snížit naši popularitu mezi nejvíce nacionalistickými částmi našeho lidu. Avšak důsledky odmítnutí pravděpodobně nebudou pro nás příznivé." # todo: NEW TRANSLATION
 Japan.8.a: "Nechte je mít práva na rybolov..." # todo: NEW TRANSLATION
 Japan.8.b: "Japonsko se nenechá zastrašit!" # todo: NEW TRANSLATION
 Japan.4.t: "Japonsko předalo ostrovy!" # todo: NEW TRANSLATION
 Japan.4.d: "Japonsko, které zřetelně uznává platnost našeho nároku, vrátilo ostrovy Senkaku nám, jejich oprávněnému vlastníku." # todo: NEW TRANSLATION
 Japan.4.a: "Snad Japonci konečně trochu rozumní!" # todo: NEW TRANSLATION
 Japan.5.t: "Japonsko zůstává vzpurné!" # todo: NEW TRANSLATION
 Japan.5.d: "Japonci jsou zjevně odhodláni zůstat našimi smrtelnými nepřáteli jako vždy." # todo: NEW TRANSLATION
 Japan.5.a: "Budou toho litovat..." # todo: NEW TRANSLATION
 Japan.6.t: "Čínské stíhací letouny zaútočily na letadla, která jsme vyslali, abychom je odklonili!" # todo: NEW TRANSLATION
 Japan.6.d: "Naši piloti pravidelně reagují na čínské nájezdy do našeho vzdušného prostoru, obvykle bez incidentu. Tentokrát však čínští piloti stříleli na naše letadla, což vedlo ke smrti několika našich pilotů a ke ztrátě několika strojů. Měli bychom vyhodnotit, zda šlo o záměrnou provokaci či nešťastnou nehodu, a rozhodnout, jak na to reagovat." # todo: NEW TRANSLATION
 Japan.6.a: "Máme právo na sebeobranu!" # todo: NEW TRANSLATION
 Japan.6.b: "Měli bychom požádat naše ochránce!" # todo: NEW TRANSLATION
 Japan.6.c: "To byla pravděpodobně nehoda..." # todo: NEW TRANSLATION
 Japan.7.t: "Čínská a japonská stíhací letadla se střetla ve vzdušném boji" # todo: NEW TRANSLATION
 Japan.7.d: "Východočínské moře vybuchlo do konfliktu poté, co došlo ke střetu mezi čínskými a japonskými letadly. Zatímco srážka údajně začala, když byly japonské stroje vyslány k odklonění čínských pilotů nad japonským vzdušným prostorem. Namísto čínského ústupu, ke kterému historicky došlo po podobných incidentech, byla japonská letadla střílena, což mělo za následek smrt několika japonských pilotů a ztrátu více letounů. [JAP.GetLeader] ostře odsoudil incident a údajně se zapojil do naléhavých jednání za zavřenými dveřmi ohledně reakce Japonska na tuto událost." # todo: NEW TRANSLATION
 Japan.7.a: "Hrozí třetí čínsko-japonská válka?" # todo: NEW TRANSLATION
