 JAP_diplomacy.11.t: "Žádost USA o změnu výkladu článku 9" # todo: NEW TRANSLATION
 JAP_diplomacy.11.d: "Vláda Spojených států se na nás obrátila s formální žádostí o další změnu výkladu článku 9 naší ústavy. Washington tvrdí, že se regionální bezpečnostní prostředí zhoršilo natolik, že Japonsko musí převzít větší podíl na kolektivní obraně. Přijetí jejich žádosti by otevřelo cestu k širšímu chápání sebeobrany a užší vojenské spolupráci, nebude však bez domácích sporů." # todo: NEW TRANSLATION
 JAP_diplomacy.11.a: "Přijmout žádost USA" # todo: NEW TRANSLATION
 JAP_diplomacy.11.b: "Tuto žádost nemůžeme přijmout" # todo: NEW TRANSLATION
 JAP_diplomacy.12.t: "Japonsko odmítá změnit výklad článku 9" # todo: NEW TRANSLATION
 JAP_diplomacy.12.d: "Tokio nás informovalo, že v tuto chvíli není připraveno dále měnit výklad článku 9. Obavy z domácího veřejného mínění, ústavní omezení a politická stabilita vedly japonskou vládu k odmítnutí naší žádosti. Nyní se musíme rozhodnout, zda její rozhodnutí respektovat, nebo zvýšit diplomatický a bezpečnostní tlak." # todo: NEW TRANSLATION
 JAP_diplomacy.12.a: "Budeme jejich rozhodnutí respektovat" # todo: NEW TRANSLATION
 JAP_diplomacy.12.b: "Zvýšit tlak na Japonsko" # todo: NEW TRANSLATION
 JAP_diplomacy.13.t: "Japonsko přijímá změnu výkladu článku 9" # todo: NEW TRANSLATION
 JAP_diplomacy.13.d: "Tokio sdělilo, že podporuje změnu úrovně výkladu článku 9 a bude usilovat o aktivnější úlohu v obraně." # todo: NEW TRANSLATION
 JAP_diplomacy.13.a: "Konečně" # todo: NEW TRANSLATION
 JAP_diplomacy.14.t: "Tlak USA na článek 9" # todo: NEW TRANSLATION
 JAP_diplomacy.14.d: "Po našem odmítnutí rozšířit výklad článku 9 začaly Spojené státy tiše zvyšovat diplomatický a bezpečnostní tlak na naši vládu. Konzultace mezi spojenci, informování médií a zákulisní vzkazy ukazují stejným směrem: Washington očekává, že Japonsko převezme větší odpovědnost. Můžeme zůstat pevní, nebo svůj postoj tiše posunout." # todo: NEW TRANSLATION
 JAP_diplomacy.14.a: "Zůstaneme pevní" # todo: NEW TRANSLATION
 JAP_diplomacy.14.b: "Tiše upravit náš postoj" # todo: NEW TRANSLATION
 JAP_diplomacy.15.t: "Japonsko ustupuje pod tlakem" # todo: NEW TRANSLATION
 JAP_diplomacy.15.d: "Po období zvýšeného diplomatického a strategického tlaku Tokio naznačilo, že je připraveno přiblížit se našemu postoji k článku 9. Vláda veřejně trvá na tom, že pacifistické zásady Japonska zůstávají nezměněny, nyní však rozšířila výklad sebeobrany způsobem, který odpovídá našim očekáváním." # todo: NEW TRANSLATION
 JAP_diplomacy.15.a: "Vynikající" # todo: NEW TRANSLATION
 JAP_diplomacy.16.t: "Japonská patová situace" # todo: NEW TRANSLATION
 JAP_diplomacy.16.d: "Tokio nadále odmítá rozšířit výklad článku 9. Washington se musí rozhodnout, jak daleko je ochoten zajít a za jakou cenu." # todo: NEW TRANSLATION
 JAP_diplomacy.16.a: "Opustit tuto otázku. Naše ostatní zájmy v regionu mají přednost." # todo: NEW TRANSLATION
 JAP_diplomacy.16.b: "Odvolat bezpečnostní záruky pro Japonsko." # todo: NEW TRANSLATION
 JAP_diplomacy.16.c: "Uvalit cla na japonský vývoz." # todo: NEW TRANSLATION
 JAP_diplomacy.16.e: "Zřídit námořní blokádu Japonska." # todo: NEW TRANSLATION
 JAP_diplomacy.17.t: "Americká cla na japonské zboží" # todo: NEW TRANSLATION
 JAP_diplomacy.17.d: "Spojené státy oznámily nový balík cel zaměřený na klíčový japonský vývoz s odkazem na ekonomickou nerovnováhu a domácí politický tlak. Opatření jsou představována jako způsob, jak \"narovnat podmínky\", v Tokiu jsou však široce vnímána jako politicky motivovaný krok, který zatíží naši ekonomiku i širší spojenectví." # todo: NEW TRANSLATION
 JAP_diplomacy.17.a: "Budeme se muset přizpůsobit této nové realitě" # todo: NEW TRANSLATION
 JAP_diplomacy.18.t: "Japonsko žádá o úlevu od cel" # todo: NEW TRANSLATION
 JAP_diplomacy.18.d: "Tokio formálně požádalo o zrušení cel uvalených na japonské zboží. Japonští představitelé naznačují, že jejich vláda by výměnou mohla být ochotna prohloubit bezpečnostní spolupráci a dále pokročit v obranné politice. Musíme se rozhodnout, zda tento hospodářský spor proměníme ve strategickou příležitost, nebo zda budeme pokračovat v tlaku." # todo: NEW TRANSLATION
 JAP_diplomacy.18.a: "Zrušit cla výměnou za bezpečnostní ústupky" # todo: NEW TRANSLATION
 JAP_diplomacy.18.b: "Odmítnout a cla ponechat v platnosti" # todo: NEW TRANSLATION
 JAP_diplomacy.19.t: "Cla zrušena, požadovány bezpečnostní ústupky" # todo: NEW TRANSLATION
 JAP_diplomacy.19.d: "Spojené státy souhlasily se zrušením cel na japonský vývoz, ale pouze v rámci širší dohody o bezpečnosti a obraně. V praxi se očekává, že Japonsko dále rozšíří výklad článku 9, prohloubí vojenskou spolupráci s Washingtonem a převezme větší úlohu v regionální bezpečnosti." # todo: NEW TRANSLATION
 JAP_diplomacy.19.a: "V zájmu naší ekonomiky a spojenectví toto břemeno přijmeme" # todo: NEW TRANSLATION
 JAP_diplomacy.20.t: "USA odmítají zrušit cla" # todo: NEW TRANSLATION
 JAP_diplomacy.20.d: "Naše formální žádost o zrušení amerických cel byla odmítnuta. Washington trvá na tom, že opatření zůstanou v platnosti, a odvolává se na domácí politický tlak a nevyřešené neshody ohledně bezpečnostní politiky. Doma roste frustrace mezi vývozci a představiteli podniků, zatímco stratégové varují, že spor by mohl naše spojenectví dále zkomplikovat." # todo: NEW TRANSLATION
 JAP_diplomacy.20.a: "Prozatím budeme muset tlak vydržet" # todo: NEW TRANSLATION
 JAP_diplomacy.21.t: "Japonsko žádá o obnovení bezpečnostních záruk" # todo: NEW TRANSLATION
 JAP_diplomacy.21.d: "Japonská vláda formálně požádala Spojené státy o obnovení nebo posílení bezpečnostních záruk. Tokio tvrdí, že se regionální bezpečnostní prostředí zhoršilo a jasnější závazek USA by pomohl situaci stabilizovat. Japonští představitelé v soukromí připouštějí, že další změny výkladu článku 9 by mohly být možné, pokud bude Washington připraven přijmout výslovné závazky." # todo: NEW TRANSLATION
 JAP_diplomacy.21.a: "Obnovit naše bezpečnostní záruky výměnou za hlubší závazky" # todo: NEW TRANSLATION
 JAP_diplomacy.21.b: "Odmítnout prodloužení našich záruk" # todo: NEW TRANSLATION
 JAP_diplomacy.22.t: "Bezpečnostní záruky obnoveny" # todo: NEW TRANSLATION
 JAP_diplomacy.22.d: "Spojené státy souhlasily s obnovením a upřesněním svých bezpečnostních záruk pro Japonsko. Washington na oplátku očekává, že Tokio podnikne další kroky k rozšíření výkladu článku 9 a převezme větší podíl na regionální bezpečnosti. Spojenectví sílí, domácí debata o našich pacifistických zásadách však zesílí." # todo: NEW TRANSLATION
 JAP_diplomacy.22.a: "V zájmu naší bezpečnosti tento závazek přijmeme" # todo: NEW TRANSLATION
 JAP_diplomacy.23.t: "USA odmítají silnější záruky" # todo: NEW TRANSLATION
 JAP_diplomacy.23.d: "Naše žádost o obnovení nebo posílení bezpečnostních záruk byla odmítnuta. Spojené státy trvají na tom, že stávající uspořádání je dostačující a domácí politická omezení brání dalším závazkům. Toto odmítnutí v Japonsku posílí obavy o naši dlouhodobou bezpečnost a spolehlivost našeho spojenectví." # todo: NEW TRANSLATION
 JAP_diplomacy.23.a: "Pak musíme přehodnotit vlastní cestu" # todo: NEW TRANSLATION
 JAP_diplomacy.24.t: "Japonsko žádá o ukončení amerického námořního tlaku" # todo: NEW TRANSLATION
 JAP_diplomacy.24.d: "Tokio formálně požádalo, abychom omezili nebo ukončili zvýšenou námořní přítomnost a tlak v okolí klíčových námořních tras a úžin. Japonští představitelé tvrdí, že současný postoj hrozí eskalací a podkopává domácí podporu spojenectví. V soukromí naznačují, že další změny výkladu článku 9 by mohly být možné, pokud svůj postoj zmírníme." # todo: NEW TRANSLATION
 JAP_diplomacy.24.a: "Ukončit námořní tlak výměnou za bezpečnostní ústupky" # todo: NEW TRANSLATION
 JAP_diplomacy.24.b: "Udržovat námořní tlak kolem Japonska" # todo: NEW TRANSLATION
 JAP_diplomacy.25.t: "Námořní tlak zmírněn, závazky prohloubeny" # todo: NEW TRANSLATION
 JAP_diplomacy.25.d: "Spojené státy souhlasily se zmírněním své zvýšené námořní přítomnosti v okolí našich námořních tras výměnou za hlubší bezpečnostní závazky Japonska. V praxi to znamená další krok k rozšíření výkladu článku 9 a rozšíření naší úlohy v regionální bezpečnosti. Spojenectví se zdá být silnější, domácí debata o naší pacifistické identitě však bude ještě intenzivnější." # todo: NEW TRANSLATION
 JAP_diplomacy.25.a: "V zájmu stability tuto dohodu dodržíme" # todo: NEW TRANSLATION
 JAP_diplomacy.26.t: "USA odmítají ukončit námořní tlak" # todo: NEW TRANSLATION
 JAP_diplomacy.26.d: "Naše žádost o zmírnění nebo ukončení zvýšené americké námořní přítomnosti v okolí našich námořních tras byla odmítnuta. Washington trvá na tom, že současný postoj je vzhledem k regionálním hrozbám nezbytný. Toto odmítnutí doma posílí obavy z uvěznění v širším konfliktu i volání po dalším posílení vlastní obrany Japonska." # todo: NEW TRANSLATION
 JAP_diplomacy.26.a: "Pak se musíme pod tlakem přizpůsobit" # todo: NEW TRANSLATION
 JAP_diplomacy.28.t: "Komplikace při návrhu Kaguji" # todo: NEW TRANSLATION
 JAP_diplomacy.28.d: "Ambiciózní lunární mise Kaguya se potýká s vážnými konstrukčními problémy. Klíčové systémy se ukazují být složitější, než se očekávalo, od navádění a řízení energie až po tepelnou ochranu. Inženýři tvrdí, že dodatečné financování a čas jim umožní přepracovat kritické součásti a zlepšit celkovou spolehlivost, náklady však již začínají vyvolávat obavy v kabinetu." # todo: NEW TRANSLATION
 JAP_diplomacy.28.a: "Investovat do přepracování a udržet napjatý harmonogram" # todo: NEW TRANSLATION
 JAP_diplomacy.28.b: "Trvat na nákladech a přijmout delší harmonogram" # todo: NEW TRANSLATION
 JAP_diplomacy.29.t: "Zranitelnosti komunikace Kaguji" # todo: NEW TRANSLATION
 JAP_diplomacy.29.d: "Jak pokračuje testování, program Kaguya odhaluje slabiny v komunikaci a datových spojích v hlubokém vesmíru. Integrita signálu, šířka pásma i odolnost proti rušení jsou pod požadovanou úrovní. Specialisté navrhují nové antény, modernizované pozemní stanice a robustnější šifrování, tato zlepšení si však vyžádají další politický a finanční kapitál." # todo: NEW TRANSLATION
 JAP_diplomacy.29.a: "Modernizovat komunikační architekturu" # todo: NEW TRANSLATION
 JAP_diplomacy.29.b: "Pokračovat se stávajícími systémy a doufat v nejlepší" # todo: NEW TRANSLATION
 JAP_diplomacy.30.t: "Další odklady mise Kaguya" # todo: NEW TRANSLATION
 JAP_diplomacy.30.d: "Technické potíže, problémy s integrací a konflikty v harmonogramu startovací infrastruktury si vynutily další odklad lunární mise Kaguya. Ačkoli základní systémy zůstávají slibné, projekt je stále více vnímán jako pomalý a problematický. Vědci trvají na tom, že trpělivost bude odměněna, veřejná pozornost se však začíná přesouvat jinam." # todo: NEW TRANSLATION
 JAP_diplomacy.30.a: "Přijmout odklad a pokračovat směrem k Měsíci" # todo: NEW TRANSLATION
 JAP_diplomacy.31.t: "Kaguya dosahuje povrchu Měsíce" # todo: NEW TRANSLATION
 JAP_diplomacy.31.d: "Po letech přepracovávání návrhu, modernizací komunikace a náročných odkladů mise Kaguya konečně uspěla. Japonské zařízení nyní pracuje na Měsíci i v jeho okolí a odesílá snímky ve vysokém rozlišení a neocenitelná vědecká data. Úspěch představuje ukázku japonských technologických schopností a otevírá nové cesty k vývoji družic, průzkumu hlubokého vesmíru a strategickému využití kosmického prostoru." # todo: NEW TRANSLATION
 JAP_diplomacy.31.a: "Oslavit Kaguyu jako triumf japonské technologie" # todo: NEW TRANSLATION
 jap_kaguya_satellite_invest_tt: "§GProtože jsme investovali do lepšího návrhu kosmické lodi, získali jsme:§!" # todo: NEW TRANSLATION
 jap_kaguya_rocketry_invest_tt: "§GProtože jsme investovali do lepší komunikace s kosmickou lodí, získali jsme:§!" # todo: NEW TRANSLATION
 JAP_diplomacy.32.t: "Anomálie naváděcího softwaru" # todo: NEW TRANSLATION
 JAP_diplomacy.32.d: "Inženýři na misi k Marsu hlásí opakující se anomálii v naváděcím softwaru. Problém zatím není kritický, pokud však zůstane neřešen, mohl by vést k vážným navigačním chybám. Důkladná oprava odčerpá zdroje z jiných projektů a může ovlivnit celkový harmonogram." # todo: NEW TRANSLATION
 JAP_diplomacy.32.a: "Přesměrovat zdroje a řádně problém vyřešit" # todo: NEW TRANSLATION
 JAP_diplomacy.32.b: "Přijmout zpoždění a opravovat jej postupně" # todo: NEW TRANSLATION
 JAP_diplomacy.33.t: "Pojmenování marťanské kolonie" # todo: NEW TRANSLATION
 JAP_diplomacy.33.d: "Japonsko získalo trvalou základnu na Marsu. S uvedením habitátů do provozu a usazováním prvních dlouhodobých posádek přichází symbolické rozhodnutí: oficiální název a charakter kolonie." # todo: NEW TRANSLATION
 JAP_diplomacy.33.a: "'Amaterasu', zářivý symbol jednoty" # todo: NEW TRANSLATION
 JAP_diplomacy.33.b: "'Kagucuchi', žhnoucí průmyslová kovárna" # todo: NEW TRANSLATION
 JAP_diplomacy.33.c: "'Cukujomi', klidná observatoř v temnotě" # todo: NEW TRANSLATION
 JAP_diplomacy.33.e: "'Susanoo', bouří poznamenaná vojenská hranice" # todo: NEW TRANSLATION
 JAP_diplomacy.68.t: "Japonsko požaduje Sachalin" # todo: NEW TRANSLATION
 JAP_diplomacy.68.d: "Japonsko vzneslo formální požadavek na navrácení Sachalinu. Přijetí by zmírnilo napětí, bylo by však vnímáno jako ponižující ústupek." # todo: NEW TRANSLATION
 JAP_diplomacy.68.a: "Přijmout požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.68.b: "Jednoznačně jej odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy.69.t: "Sachalin navrácen" # todo: NEW TRANSLATION
 JAP_diplomacy.69.d: "Moskva náš požadavek přijala. Sachalin je nyní pod japonskou správou. Vláda to představí jako důkaz návratu císařského řádu." # todo: NEW TRANSLATION
 JAP_diplomacy.69.a: "Historická náprava" # todo: NEW TRANSLATION
 JAP_diplomacy.70.t: "Rusko odmítá" # todo: NEW TRANSLATION
 JAP_diplomacy.70.d: "Moskva odmítla náš požadavek na Sachalin. Můžeme tuto urážku prozatím spolknout, vyzkoušet Rusko omezeným pohraničním konfliktem, nebo se plně zavázat k válce." # todo: NEW TRANSLATION
 JAP_diplomacy.70.a: "Prozatím ustoupit" # todo: NEW TRANSLATION
 JAP_diplomacy.70.b: "Zahájit pohraniční válku" # todo: NEW TRANSLATION
 JAP_diplomacy.70.c: "Vyhlásit totální válku" # todo: NEW TRANSLATION
 JAP_diplomacy.71.t: "Japonsko požaduje Severní Kurilské ostrovy" # todo: NEW TRANSLATION
 JAP_diplomacy.71.d: "Japonsko vzneslo formální požadavek na navrácení Severních Kurilských ostrovů. Přijetí by zmírnilo napětí, bylo by však vnímáno jako ponižující ústupek." # todo: NEW TRANSLATION
 JAP_diplomacy.71.a: "Přijmout požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.71.b: "Jednoznačně jej odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy.72.t: "Severní Kurilské ostrovy navráceny" # todo: NEW TRANSLATION
 JAP_diplomacy.72.d: "Moskva náš požadavek přijala. Severní Kurilské ostrovy jsou nyní pod japonskou správou. Vláda to představí jako důkaz návratu císařského řádu." # todo: NEW TRANSLATION
 JAP_diplomacy.72.a: "Historická náprava" # todo: NEW TRANSLATION
 JAP_diplomacy.73.t: "Rusko odmítá" # todo: NEW TRANSLATION
 JAP_diplomacy.73.d: "Moskva odmítla náš požadavek na Severní Kurilské ostrovy. Můžeme tuto urážku prozatím spolknout, vyzkoušet Rusko omezeným pohraničním konfliktem, nebo se plně zavázat k válce." # todo: NEW TRANSLATION
 JAP_diplomacy.73.a: "Prozatím ustoupit" # todo: NEW TRANSLATION
 JAP_diplomacy.73.b: "Zahájit pohraniční válku" # todo: NEW TRANSLATION
 JAP_diplomacy.73.c: "Vyhlásit totální válku" # todo: NEW TRANSLATION
 JAP_diplomacy.74.t: "Japonsko požaduje Jižní Kurilské ostrovy" # todo: NEW TRANSLATION
 JAP_diplomacy.74.d: "Japonsko vzneslo formální požadavek na navrácení Jižních Kurilských ostrovů. Přijetí by zmírnilo napětí, bylo by však vnímáno jako ponižující ústupek." # todo: NEW TRANSLATION
 JAP_diplomacy.74.a: "Přijmout požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.74.b: "Jednoznačně jej odmítnout" # todo: NEW TRANSLATION
 JAP_diplomacy.75.t: "Jižní Kurilské ostrovy navráceny" # todo: NEW TRANSLATION
 JAP_diplomacy.75.d: "Moskva náš požadavek přijala. Jižní Kurilské ostrovy jsou nyní pod japonskou správou. Vláda to představí jako důkaz návratu císařského řádu." # todo: NEW TRANSLATION
 JAP_diplomacy.75.a: "Historická náprava" # todo: NEW TRANSLATION
 JAP_diplomacy.76.t: "Rusko odmítá" # todo: NEW TRANSLATION
 JAP_diplomacy.76.d: "Moskva odmítla náš požadavek na Jižní Kurilské ostrovy. Můžeme tuto urážku prozatím spolknout, vyzkoušet Rusko omezeným pohraničním konfliktem, nebo se plně zavázat k válce." # todo: NEW TRANSLATION
 JAP_diplomacy.76.a: "Prozatím ustoupit" # todo: NEW TRANSLATION
 JAP_diplomacy.76.b: "Zahájit pohraniční válku" # todo: NEW TRANSLATION
 JAP_diplomacy.76.c: "Vyhlásit totální válku" # todo: NEW TRANSLATION
 JAP_diplomacy.77.t: "Tokio navrhuje dohodu" # todo: NEW TRANSLATION
 JAP_diplomacy.77.d: "Nyní, když jsou Kurilské ostrovy a Sachalin pod japonskou kontrolou, Tokio rychle usiluje o přeměnu územních zisků z bojiště ve formální dohodu. Japonští diplomaté oslovili Moskvu s návrhem ukončit konflikt a tvrdí, že válka již rozhodla otázku a další boje by pouze prodloužily nevyhnutelné.\nJejich nabídka je prostá: mír výměnou za formální uznání ruské kontroly nad Kurilskými ostrovy a Sachalinem. Tokio to vnímá jako praktické uspořádání určené ke stabilizaci regionu a zabránění další eskalaci války. Rozhodnutí nyní spočívá na nás. Přijmout novou realitu a ukončit válku, nebo návrh odmítnout a pokračovat v boji." # todo: NEW TRANSLATION
 JAP_diplomacy.77.a: "Přijmout dohodu." # todo: NEW TRANSLATION
 JAP_diplomacy.77.b: "Odmítnout ji. Válka pokračuje." # todo: NEW TRANSLATION
 JAP_diplomacy.78.t: "Dohoda přijata" # todo: NEW TRANSLATION
 JAP_diplomacy.78.d: "Návrh byl přijat a zbraně začínají utichat. Jsou vydány rozkazy k odpoutání jednotek, diplomatické kanály se znovu otevírají a válka se mění v soubor článků a souřadnic.\n\nSeverní ostrovy jsou převedeny jako cena za mír a každá strana nyní musí výsledek prodat vlastní veřejnosti. Tažení končí, vzpomínka však nikoli." # todo: NEW TRANSLATION
 JAP_diplomacy.78.a: "Nechť se tak stane. Ať inkoust nahradí krev." # todo: NEW TRANSLATION
 JAP_diplomacy.79.t: "Dohoda odmítnuta" # todo: NEW TRANSLATION
 JAP_diplomacy.79.d: "Odpověď druhé strany zní jednoznačné ne. Nebudou žádné podpisy, žádné uznání ani pauza na popadnutí dechu.\n\nTokio špatně odhadlo naše odhodlání a konflikt bude pokračovat, dokud jej jedna ze stran již nebude schopna dále udržovat. Pokud má přijít mír, bude vynucen." # todo: NEW TRANSLATION
 JAP_diplomacy.79.a: "Pak budeme pokračovat v boji." # todo: NEW TRANSLATION
 JAP_diplomacy.80.t: "Moskva hledá východisko" # todo: NEW TRANSLATION
 JAP_diplomacy.80.d: "Po japonských postupech na severu ruští diplomaté naznačují ochotu ukončit boje dříve, než se situace zhorší. Poselství je pragmatické: zastavit krveprolití, zmrazit frontové linie a zabránit tomu, aby válka spotřebovala více zdrojů, než může kterákoliv strana ospravedlnit.\n\nNabídka představuje přímý mír, který vymění pokračující eskalaci za okamžité ukončení nepřátelství. Musíme se rozhodnout, zda přijmeme nedokonalé urovnání, nebo budeme dále využívat naší výhody." # todo: NEW TRANSLATION
 JAP_diplomacy.80.a: "Přijměme mír." # todo: NEW TRANSLATION
 JAP_diplomacy.80.b: "Ne. Budeme pokračovat." # todo: NEW TRANSLATION
 JAP_diplomacy.81.t: "Tokio přijímá mír" # todo: NEW TRANSLATION
 JAP_diplomacy.81.d: "Japonsko souhlasí s podmínkami a volí ukončení války namísto jejího rozšíření. Toto rozhodnutí je v některých částech země nepopulární, jeho cenu však pociťujeme doma, protože s ústupem se vytrácí sebevědomí a veřejnost se ptá, proč boje vůbec začaly.\n\nJe vyhlášen bílý mír a územní ústupky jsou provedeny. Bojiště utichá, politické škody však přetrvají." # todo: NEW TRANSLATION
 JAP_diplomacy.81.a: "Spolkneme to a vydržíme." # todo: NEW TRANSLATION
 JAP_diplomacy.82.t: "Tokio odmítá" # todo: NEW TRANSLATION
 JAP_diplomacy.82.d: "Japonsko návrh odmítá a dává najevo, že nepřijme urovnání sepsané z pozice slabosti. Boje budou pokračovat a s každým dalším týdnem porostou sázky.\n\nPokud má přijít mír, nebude nabídnut. Bude si ho třeba vzít." # todo: NEW TRANSLATION
 JAP_diplomacy.82.a: "Staň se." # todo: NEW TRANSLATION
 JAP_unlock_sikhalin_raid_tt: "Odemkne §YSpecial Forces Raid§! na území §Y$STATE_691$§!" # todo: NEW TRANSLATION
 JAP_diplomacy.83.t: "Vítězství na jižních Kurilách" # todo: NEW TRANSLATION
 JAP_diplomacy.83.d: "Japonské síly zvítězily na jižních Kurilách, zatlačily ruské jednotky a ovládly sporné území. Výsledek je na mapě malý, jeho poselství je však hlasité: Japonsko si může vzít to, co si nárokuje, a udržet to pod tlakem.\n\nVlajka stoupá, posádka se opevňuje a Tokio se připravuje na další krok. Moskva na to nezapomene." # todo: NEW TRANSLATION
 JAP_diplomacy.83.a: "Zajistěte ostrovy." # todo: NEW TRANSLATION
 JAP_diplomacy.84.t: "Porážka na jižních Kurilách" # todo: NEW TRANSLATION
 JAP_diplomacy.84.d: "Pohraniční střet na jižních Kurilách se obrátil proti nám. Ruský odpor vydržel a naše síly byly pod palbou donuceny ustoupit, takže otázka suverenity zůstává nevyřešena a naše vedení čelí kritice.\n\nV průběhu jsme se naučili bolestivé lekce. Příští pokus bude lépe naplánován, lépe zásoben a obtížnější k zastavení." # todo: NEW TRANSLATION
 JAP_diplomacy.84.a: "Poučme se z neúspěchu." # todo: NEW TRANSLATION
 JAP_diplomacy.85.t: "Neúspěch na jižních Kurilách" # todo: NEW TRANSLATION
 JAP_diplomacy.85.d: "Ruské síly nedokázaly udržet jižní Kurily tváří v tvář rozhodnému japonskému postupu. Okamžitá taktická ztráta je citelná, politický signál ještě více: hranice je zranitelná a protivník je ochoten zaplatit za její změnu.\n\nMoskva se bude muset rozhodnout, zda eskalovat, nebo přijmout ponižující nový fakt v terénu." # todo: NEW TRANSLATION
 JAP_diplomacy.85.a: "Hořká lekce." # todo: NEW TRANSLATION
 JAP_diplomacy.86.t: "Jižní Kurily zajištěny" # todo: NEW TRANSLATION
 JAP_diplomacy.86.d: "Ruské jednotky vyhrály pohraniční střet a zajistily jižní Kurily, zatlačily japonské jednotky a obnovily kontrolu podél linie. Operace prokazuje připravenost a schopnost rychle potrestat vpády.\n\nTokio to možná označí za dočasný neúspěch, poselství je však jasné. Ostrovy nebudou dobyty lacino." # todo: NEW TRANSLATION
 JAP_diplomacy.86.a: "Udržte linii." # todo: NEW TRANSLATION
 JAP_diplomacy.87.t: "Vítězství na severních Kurilách" # todo: NEW TRANSLATION
 JAP_diplomacy.87.d: "Japonsko dosáhlo průlomu na severních Kurilách, donutilo ruské jednotky ustoupit a ponechalo ostrovy pod naší kontrolou. Operace dokazuje, že i odlehlý terén lze obsadit, když se spojí plánování, načasování a odhodlání.\n\nOkupace začíná okamžitě. Přicházejí zásoby, obrana sílí a severní hranice se mění činy." # todo: NEW TRANSLATION
 JAP_diplomacy.87.a: "Zakopte se a připravte se." # todo: NEW TRANSLATION
 JAP_diplomacy.88.t: "Porážka na severních Kurilách" # todo: NEW TRANSLATION
 JAP_diplomacy.88.d: "Severní Kurily odolaly našemu útoku. Boje byly kruté, podmínky ještě horší a ruským silám se podařilo otupit náš postup a vynutit si ústup.\n\nVracíme se se zkušenostmi zaplacenými krví a vyčerpáním. Příště nedorazíme nepřipraveni." # todo: NEW TRANSLATION
 JAP_diplomacy.88.a: "Přizpůsobíme se." # todo: NEW TRANSLATION
 JAP_diplomacy.89.t: "Ztráta na severních Kurilách" # todo: NEW TRANSLATION
 JAP_diplomacy.89.d: "Rusko bylo po úspěšné japonské operaci vytlačeno z pozic na severních Kurilách. Ztráta není pouze územní, ale i psychologická, neboť ukazuje, že vzdálenost a počasí již nejsou spolehlivou obranou.\n\nBude požadována reakce, odveta však s sebou nese vlastní rizika. Situace se rychle zhoršuje." # todo: NEW TRANSLATION
 JAP_diplomacy.89.a: "Tohle nemůže zůstat bez odezvy." # todo: NEW TRANSLATION
 JAP_diplomacy.90.t: "Severní Kurily udrženy" # todo: NEW TRANSLATION
 JAP_diplomacy.90.d: "Ruské síly porazily vpád a udržely severní Kurily, odrazily japonské jednotky a za obtížných podmínek obnovily kontrolu. Obrana zdokonalila doktrínu a zvýšila sebevědomí napříč velitelským řetězcem.\n\nPokud Japonsko tyto ostrovy chce, bude muset nasadit mnohem více než jen síly pro pohraniční střet." # todo: NEW TRANSLATION
 JAP_diplomacy.90.a: "Udržujte připravenost." # todo: NEW TRANSLATION
 JAP_diplomacy.91.t: "Rusko reaguje na Sachalin" # todo: NEW TRANSLATION
 JAP_diplomacy.91.d: "Japonské kroky na Sachalinu vyvolaly okamžitou reakci Moskvy. Ruské vedení označuje tento čin za přímou výzvu suverenitě a dává najevo, že bez následků nebude tolerovat další postup.\n\nKrize se nyní větví dvěma směry: eskalací v otevřenou válku, nebo nátlakem prostřednictvím hospodářských opatření a námořních omezení. Ať tak či onak, napětí vzrostlo nad úroveň klidné diplomacie." # todo: NEW TRANSLATION
 JAP_diplomacy.91.a: "Z toho bude válka." # todo: NEW TRANSLATION
 JAP_diplomacy.91.b: "Uškrťme je embargem a blokádou." # todo: NEW TRANSLATION
 JAP_diplomacy.92.t: "Rusko odpovídá na převzetí Sachalinu" # todo: NEW TRANSLATION
 JAP_diplomacy.92.d: "Sachalin změnil majitele a Moskva se nyní musí rozhodnout, jak odpovědět na ponížení tak blízko domova. Válka by byla nákladná, ale nečinnost by pozvala k dalším ztrátám a oslabila autoritu státu.\n\nRusko může zvolit eskalaci a pokusit se silou zvrátit výsledek, nebo přijmout dočasný mír, který ukončí boje a zároveň bude požadovat návrat Sachalinu jako cenu za zastavení. Toto rozhodnutí určí další fázi konfliktu." # todo: NEW TRANSLATION
 JAP_diplomacy.92.a: "Znovu ho dobudeme silou." # todo: NEW TRANSLATION
 JAP_diplomacy.92.b: "Vynuťme si urovnání. Sachalin musí být vrácen." # todo: NEW TRANSLATION
 JAP_diplomacy.94.t: "Tokio požaduje protektorát" # todo: NEW TRANSLATION
 JAP_diplomacy.94.d: "Z Japonska přichází formální nóta zbavená diplomacie a naplněná záměrem. Soulu je nabídnuta volba prezentovaná jako stabilita: přijmout japonský dohled nad zahraniční politikou a bezpečnostními záležitostmi, sladit instituce se směrem Tokia a vyhnout se ničivé konfrontaci.\n\nPoselství je jasné. Japonsko již nežádá o spolupráci, ale diktuje podmínky. Odmítnutí bude považováno za vzdor a vzdor přivolá následky." # todo: NEW TRANSLATION
 JAP_diplomacy.94.a: "Nemáme jinou možnost než přijmout." # todo: NEW TRANSLATION
 JAP_diplomacy.94.b: "Odmítněme. Korea se neskloní." # todo: NEW TRANSLATION
 JAP_diplomacy.95.t: "Jižní Korea se podřizuje" # todo: NEW TRANSLATION
 JAP_diplomacy.95.d: "Soul přijímá podmínky a volí přežití před suverenitou. Dohody jsou podepsány pod tlakem, přicházejí poradci a vnější postoj státu je začleněn do japonského strategického plánu.\n\nVálka končí, začíná však jiný druh zápasu. Korea zůstává na mapě, její směřování už ale není její vlastní." # todo: NEW TRANSLATION
 JAP_diplomacy.95.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.96.t: "Jižní Korea se Tokiu vzpírá" # todo: NEW TRANSLATION
 JAP_diplomacy.96.d: "Soul odmítá ultimátum a prohlašuje, že jeho suverenita není předmětem vyjednávání. Odmítnutí mění krizi z nátlaku v konfrontaci a Tokio nyní získává veškerou záminku tvrdit, že otázku lze vyřešit pouze silou.\n\nPokud Japonsko chtělo podřízení, dostalo místo něj výzvu." # todo: NEW TRANSLATION
 JAP_diplomacy.96.a: "Pak prosadíme svou vůli." # todo: NEW TRANSLATION
 JAP_diplomacy.97.t: "Tokio vydává ultimátum Pchjongjangu" # todo: NEW TRANSLATION
 JAP_diplomacy.97.d: "Japonsko doručilo Pchjongjangu ultimátum a nabídlo mu budoucnost pod dohledem, nebo budoucnost zkázy pod bombardováním. Podmínky jsou přímočaré: podřídit zahraniční politiku a strategickou autonomii směru Tokia, přijmout kontrolovaná bezpečnostní opatření a podřídit se rámci navrženému tak, aby se Sever již nikdy nestal hrozbou.\n\nPro režim je to ponížení. Pro Japonsko řízení rizik. Otázkou je, zda Pchjongjang zvolí přežití, nebo vzdor." # todo: NEW TRANSLATION
 JAP_diplomacy.97.a: "Přijměte. Zachraňte stát za každou cenu." # todo: NEW TRANSLATION
 JAP_diplomacy.97.b: "Odmítněte. Nepodřídíme se." # todo: NEW TRANSLATION
 JAP_diplomacy.98.t: "Pchjongjang ustupuje" # todo: NEW TRANSLATION
 JAP_diplomacy.98.d: "Navzdory všem očekáváním Sever přijímá podmínky. Režim si ponechává své symboly, jeho svoboda jednání je však zlomena, protože japonský dohled přetváří hranice, bezpečnost i zahraniční vztahy.\n\nBoje končí a severní část poloostrova se stává kontrolovaným nárazníkem. Hrozba je neutralizována a Tokio získává páku, které se jen tak nevzdá." # todo: NEW TRANSLATION
 JAP_diplomacy.98.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.99.t: "Pchjongjang se Tokiu vzpírá" # todo: NEW TRANSLATION
 JAP_diplomacy.99.d: "Pchjongjang odmítá ultimátum a volí vzdor v naději, že režim ochrání strach a eskalace. Odmítnutí mění krizi ve zkoušku vůle a Tokio nyní získává oprávnění tvrdit, že Sever lze podrobit pouze silou.\n\nPoloostrov se připravuje na válku. Další zpráva nebude nótou, ale ohněm." # todo: NEW TRANSLATION
 JAP_diplomacy.99.a: "Pak hrozbu odstraníme sami." # todo: NEW TRANSLATION
 JAP_diplomacy.101.t: "Tokio požaduje podřízení Tchaj-wanu" # todo: NEW TRANSLATION
 JAP_diplomacy.101.d: "Japonsko doručilo Tchaj-peji přímý požadavek: přijmout rámec protektorátu a podřídit zahraniční politiku a koordinaci obrany dohledu Tokia, nebo čelit izolaci a síle. Nabídka je zabalena do slov o bezpečnosti a stabilitě a slibuje ochranu před vnějšími hrozbami výměnou za politickou poslušnost.\n\nZa formálním jazykem se skrývá prosté poselství. Ostrov je příliš důležitý na to, aby zůstal nezávislý, a Japonsko hodlá rozhodnout o jeho budoucnosti." # todo: NEW TRANSLATION
 JAP_diplomacy.101.a: "Přijměme podmínky. Vyhněme se katastrofě." # todo: NEW TRANSLATION
 JAP_diplomacy.101.b: "Odmítněme je. Tchaj-wan se nepodřídí." # todo: NEW TRANSLATION
 JAP_diplomacy.102.t: "Tchaj-pej přijímá" # todo: NEW TRANSLATION
 JAP_diplomacy.102.d: "Tchaj-wan přijímá ultimátum a volí přežití a kontinuitu před otevřeným konfliktem. Nové dohody váží jeho vnější postoj k Japonsku, přicházejí poradci a strategické rozhodování se tiše přesouvá směrem k Tokiu.\n\nVálka končí, suverenita se však zužuje na to, co protektor dovolí. Ostrov zůstává, jeho směřování už ale není zcela jeho vlastní." # todo: NEW TRANSLATION
 JAP_diplomacy.102.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.103.t: "Tchaj-pej odmítá" # todo: NEW TRANSLATION
 JAP_diplomacy.103.d: "Tchaj-wan odmítá japonský požadavek a odmítá vyměnit autonomii za příslib ochrany. Toto rozhodnutí mění diplomatický tlak v krizi síly a Tokio nyní získává důvod tvrdit, že ostrov lze zajistit pouze dobytím.\n\nPrůliv se stává zlomovou linií. Dalším krokem nebude vyjednávání, ale mobilizace." # todo: NEW TRANSLATION
 JAP_diplomacy.103.a: "Pak si vezmeme, co potřebujeme." # todo: NEW TRANSLATION
 JAP_diplomacy.105.t: "Tokio požaduje filipínský protektorát" # todo: NEW TRANSLATION
 JAP_diplomacy.105.d: "Japonsko vzneslo vůči Manile požadavek, který nenechává mnoho prostoru pro nejasnosti. Přijměte rámec protektorátu, slaďte zahraniční politiku a obranné plánování s Tokiem a umožněte japonský dohled nad klíčovými bezpečnostními opatřeními, nebo čelte následkům odmítnutí.\n\nNabídka je prezentována jako stabilita a ochrana, jejím účelem je však kontrola námořních tras a brány mezi oceány. Filipíny si nyní musí vybrat mezi podřízením a konfrontací." # todo: NEW TRANSLATION
 JAP_diplomacy.105.a: "Přijměte. Uchraňte národ před zkázou." # todo: NEW TRANSLATION
 JAP_diplomacy.105.b: "Odmítněte. Z Tokia nám vládnout nebudou." # todo: NEW TRANSLATION
 JAP_diplomacy.106.t: "Manila se podřizuje" # todo: NEW TRANSLATION
 JAP_diplomacy.106.d: "Filipínská vláda přijímá japonské podmínky. Dohody jsou podepsány, přicházejí poradci a vnější postoj země je začleněn do japonského námořního plánu.\n\nBoje končí, cena je však suverenita. Souostroví zůstává, jeho strategická rozhodnutí však budou přijímána pod dohledem Tokia." # todo: NEW TRANSLATION
 JAP_diplomacy.106.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.107.t: "Manila se Tokiu vzpírá" # todo: NEW TRANSLATION
 JAP_diplomacy.107.d: "Filipíny odmítají ultimátum a odmítají vyměnit nezávislost za příslib ochrany. Odmítnutí mění japonský nátlak ve zkoušku síly a Tokio nyní získává veškerou záminku tvrdit, že souostroví musí být zajištěno zbraněmi.\n\nNámořní trasy se utahují, loďstva zaujímají pozice a region se připravuje na válku. Další krok nebude diplomatický." # todo: NEW TRANSLATION
 JAP_diplomacy.107.a: "Pak obsadíme souostroví." # todo: NEW TRANSLATION
 JAP_diplomacy.109.t: "Ultimátum průlivům" # todo: NEW TRANSLATION
 JAP_diplomacy.109.d: "Přichází japonská nóta s klidným tónem nevyhnutelnosti. Kuala Lumpur je nabídnuto uspořádání protektorátu, které podřizuje zahraniční politiku a bezpečnostní koordinaci směru Tokia, ospravedlněné jako cena stability v regionu, kde o přežití rozhodují námořní trasy a úžiny.\n\nPoselství není žádostí. Japonsko hodlá ovládnout průlivy a očekává se, že Malajsko vyhoví. Přijetí slibuje ochranu, odmítnutí přivolá plnou sílu námořního nátlaku." # todo: NEW TRANSLATION
 JAP_diplomacy.109.a: "Přijměme. Přílivu neodoláme." # todo: NEW TRANSLATION
 JAP_diplomacy.109.b: "Odmítněme. Naše suverenita není na prodej." # todo: NEW TRANSLATION
 JAP_diplomacy.110.t: "Kuala Lumpur se klaní vycházejícímu slunci" # todo: NEW TRANSLATION
 JAP_diplomacy.110.d: "Malajsie přijímá podmínky a vyměňuje strategickou nezávislost za okamžité přežití. Dohody jsou podepsány, přijíždějí styčné mise a Tokio získává klíče ke koridorům spojujícím dva oceány.\n\nVálka končí, cena je však jasná. Malajsko zůstává nedotčené, jeho vnější postoj se však nyní pohybuje ve stínu Japonska." # todo: NEW TRANSLATION
 JAP_diplomacy.110.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.111.t: "Malajsko odmítá rozkaz k průlivům" # todo: NEW TRANSLATION
 JAP_diplomacy.111.d: "Malajsie odmítá ultimátum a nedovolí, aby její budoucnost určovalo Tokio. Toto rozhodnutí mění japonský tlak v konfrontaci o nejcennější námořní koridor regionu.\n\nTokio nebude tolerovat vzdor v průlivech. Pokud se Malajsko nepodřídí smlouvou, Japonsko bude usilovat o jeho podrobení silou." # todo: NEW TRANSLATION
 JAP_diplomacy.111.a: "Pak ovládneme průlivy." # todo: NEW TRANSLATION
 JAP_diplomacy.113.t: "Výnos o souostroví" # todo: NEW TRANSLATION
 JAP_diplomacy.113.d: "Tokio vzneslo vůči Jakartě požadavek mířící do srdce indonéské nezávislosti. Návrh představuje rámec protektorátu, který podřizuje zahraniční politiku a strategickou bezpečnost japonskému dohledu, ospravedlněnému jako jediný způsob, jak zaručit stabilitu napříč ostrovními řetězci spojujícími dva oceány.\n\nJazyk je zdvořilý, záměr absolutní. Japonsko chce indonéské souostroví jako kontrolovaný koridor, nikoli suverénního partnera. Přijetí znamená bezpečí ve stínu, odmítnutí promění stín v bouři." # todo: NEW TRANSLATION
 JAP_diplomacy.113.a: "Přijměme. Námořnímu sevření neodoláme." # todo: NEW TRANSLATION
 JAP_diplomacy.113.b: "Odmítněme. Indonésii nikdo velet nebude." # todo: NEW TRANSLATION
 JAP_diplomacy.114.t: "Jakarta přijímá výnos" # todo: NEW TRANSLATION
 JAP_diplomacy.114.d: "Indonésie přijímá podmínky a podřizuje se nové námořní realitě. Přicházejí japonské mise, aby dohlížely na koordinaci bezpečnosti, práva na základny a vnější orientaci, čímž se souostroví mění v řízený koridor v rámci strategické sféry Tokia.\n\nVálka končí, nezávislost se však zužuje na to, co je povoleno. Ostrovy zůstávají jménem indonéské, jejich směřování je však nyní omezeno japonskou mocí." # todo: NEW TRANSLATION
 JAP_diplomacy.114.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.115.t: "Indonésie se vzpírá výnosu o souostroví" # todo: NEW TRANSLATION
 JAP_diplomacy.115.d: "Jakarta odmítá japonský požadavek a odmítá vyměnit suverenitu za sliby stability. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje indonéskou nezávislost za překážku, kterou je třeba odstranit, nikoli za skutečnost hodnou respektu.\n\nMoře kolem souostroví se napíná. Pokud Indonésie neustoupí smlouvou, Japonsko si vynutí poslušnost zbraněmi." # todo: NEW TRANSLATION
 JAP_diplomacy.115.a: "Pak se zmocníme koridorů." # todo: NEW TRANSLATION
 JAP_diplomacy.117.t: "Tonkinská volba" # todo: NEW TRANSLATION
 JAP_diplomacy.117.d: "Tokio doručilo Hanoji požadavek, jehož cílem je začlenit Vietnam do japonského námořního řádu. Nabídka je ve všem kromě názvu uspořádáním protektorátu: slaďte zahraniční politiku, přijměte japonský dohled nad bezpečností a umožněte strategický přístup, který promění vietnamské pobřeží v prodloužení japonského dosahu.\n\nPoselství je formulováno jako ochrana před většími predátory, zároveň je však i vodítkem. Vietnam se musí rozhodnout, zda přijme přežití pod omezením, nebo bude vzdorovat a přivolá válku vedenou podél jeho pobřeží." # todo: NEW TRANSLATION
 JAP_diplomacy.117.a: "Přijměme. Prozatím se skloníme." # todo: NEW TRANSLATION
 JAP_diplomacy.117.b: "Odmítněme. Vietnam spoután nebude." # todo: NEW TRANSLATION
 JAP_diplomacy.118.t: "Hanoj přijímá podmínky Tokia" # todo: NEW TRANSLATION
 JAP_diplomacy.118.d: "Vietnam přijímá ultimátum. Dohody jsou podepsány, přijíždějí styční důstojníci a Japonsko získává rozhodující vliv nad vnější orientací Vietnamu a bezpečností jeho pobřeží.\n\nVálka končí, nezávislost se však zužuje. Vietnam zůstává, jeho strategický postoj se ale nyní řídí rámcem sepsaným v Tokiu." # todo: NEW TRANSLATION
 JAP_diplomacy.118.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.119.t: "Hanoj odmítá tonkinskou volbu" # todo: NEW TRANSLATION
 JAP_diplomacy.119.d: "Vietnam odmítá japonský požadavek a odmítá vyměnit suverenitu za příslib bezpečnosti. Odmítnutí mění nátlak v konfrontaci a Tokio nyní považuje Vietnam za překážku, kterou je třeba odstranit z jeho regionálního plánu.\n\nPobřeží se stává frontovou linií. Pokud se Vietnam nepodřídí smlouvou, Japonsko bude usilovat o jeho podrobení silou." # todo: NEW TRANSLATION
 JAP_diplomacy.119.a: "Pak ovládneme pobřeží." # todo: NEW TRANSLATION
 JAP_diplomacy.121.t: "Mekongské ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.121.d: "Přichází japonská delegace s návrhem, který připomíná spíše rozsudek než diplomacii. Kambodži je nabídnuta ochrana pod dohledem Tokia, přičemž koordinace zahraniční politiky a bezpečnostní opatření jsou začleněny do japonského regionálního rámce.\n\nNabídka hovoří o stabilitě, investicích a bezpečí před silnějšími sousedy. Skutečností je podřízenost. Phnompenh si musí vybrat mezi střeženou budoucností a rizikem, že se kvůli odmítnutí stane bojištěm." # todo: NEW TRANSLATION
 JAP_diplomacy.121.a: "Přijměme. Přežití je na prvním místě." # todo: NEW TRANSLATION
 JAP_diplomacy.121.b: "Odmítněme. Kambodža se nepodřídí." # todo: NEW TRANSLATION
 JAP_diplomacy.122.t: "Phnompenh přijímá" # todo: NEW TRANSLATION
 JAP_diplomacy.122.d: "Kambodža přijímá podmínky a vzdává se strategické autonomie, aby se vyhnula válce, kterou nemůže vyhrát. Nové dohody váží stát ke směru Japonska a poradci Tokia rychle zajišťují klíčová ministerstva a přístupové body.\n\nBoje končí ještě předtím, než začnou. Kambodža zůstává jménem suverénní, její cesta je však nyní omezena japonskou mocí." # todo: NEW TRANSLATION
 JAP_diplomacy.122.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.123.t: "Kambodža odmítá mekongské ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.123.d: "Phnompenh odmítá japonský požadavek a nechce odevzdat svou budoucnost cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje Kambodžu za slabý článek, který musí být přiveden do řady.\n\nDiplomacie selhala. Pokud Kambodža nepřijme tento rámec, Japonsko se jej pokusí prosadit silou." # todo: NEW TRANSLATION
 JAP_diplomacy.123.a: "Pak je donutíme k poslušnosti." # todo: NEW TRANSLATION
 JAP_diplomacy.125.t: "Směrnice pro mekongské zázemí" # todo: NEW TRANSLATION
 JAP_diplomacy.125.d: "Japonsko vzneslo vůči Vientianu požadavek, jehož cílem je zajistit klidné zázemí za pobřežím. Návrh představuje rámec protektorátu, který váže Laos ke strategickému směru Tokia a podřizuje zahraniční politiku a bezpečnostní koordinaci japonskému dohledu.\n\nNabídka je prezentována jako rozvoj a ochrana. Význam je jasný: koridory, řeky a hranice budou spravovány tak, aby sloužily širší japonské sféře. Laos se musí rozhodnout, zda směrnici přijme, nebo vsadí na odpor." # todo: NEW TRANSLATION
 JAP_diplomacy.125.a: "Přijměme. Sami stát nemůžeme." # todo: NEW TRANSLATION
 JAP_diplomacy.125.b: "Odmítněme. Laosu nikdo diktovat nebude." # todo: NEW TRANSLATION
 JAP_diplomacy.126.t: "Vientian přijímá" # todo: NEW TRANSLATION
 JAP_diplomacy.126.d: "Laos přijímá japonské podmínky a volí přežití a stabilitu před válkou, kterou si nemůže dovolit. Dohody jsou podepsány, zřizují se koordinační úřady a Laos je začleněn do regionálního rámce Tokia jako kontrolované zázemí.\n\nBoje končí, autonomie se však zmenšuje. Laos zůstává, jeho strategická rozhodnutí se však nyní pohybují v mezích stanovených Japonskem." # todo: NEW TRANSLATION
 JAP_diplomacy.126.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.127.t: "Laos odmítá směrnici" # todo: NEW TRANSLATION
 JAP_diplomacy.127.d: "Vientian odmítá japonský požadavek a nechce odevzdat svou budoucnost vnějšímu dohledu. Odmítnutí mění nátlak v konfrontaci a Tokio nyní považuje Laos za překážku kontroly koridorů, nikoli za partnera, o jehož přízeň je třeba usilovat.\n\nPokud Laos nepřijme rámec smlouvou, Japonsko se jej pokusí prosadit silou." # todo: NEW TRANSLATION
 JAP_diplomacy.127.a: "Pak je přivedeme k poslušnosti." # todo: NEW TRANSLATION
 JAP_diplomacy.129.t: "Ultimátum jižní kotvě" # todo: NEW TRANSLATION
 JAP_diplomacy.129.d: "Tokio doručilo Canbeře ultimátum, v němž Austrálii nepovažuje za vzdálený kontinent, ale za základní kámen jižního Pacifiku. Podmínky jsou tvrdé: přijmout rámec protektorátu, sladit zahraniční politiku a obranné plánování s Japonskem a povolit základny a přístupová opatření, která by podřídila jižní Pacifik dosahu Tokia.\n\nNabídka je oděna do slov o stabilitě a zaručené bezpečnosti. Skutečností je strategické podřízení. Austrálie se musí rozhodnout, zda přijme život ve stínu Japonska, nebo se připraví na zápas o samotný oceán." # todo: NEW TRANSLATION
 JAP_diplomacy.129.a: "Přijměme. Válku o Pacifik vyhrát nemůžeme." # todo: NEW TRANSLATION
 JAP_diplomacy.129.b: "Odmítněme. Austrálie se neskloní." # todo: NEW TRANSLATION
 JAP_diplomacy.130.t: "Canberra přijímá podmínky kotvy" # todo: NEW TRANSLATION
 JAP_diplomacy.130.d: "Austrálie přijímá japonské ultimátum a volí okamžité přežití před kontinentální válkou, kterou si nemůže dovolit. Dohody jsou podepsány, strategický přístup je udělen a Japonsko získává jižní kotvu, kterou potřebovalo k ovládnutí širšího oceánu.\n\nDěla umlkají, rovnováha v Pacifiku se však přes noc mění. Austrálie zůstává na mapě, její strategická rozhodnutí se však nyní pohybují v mezích stanovených v Tokiu." # todo: NEW TRANSLATION
 JAP_diplomacy.130.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.131.t: "Austrálie odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.131.d: "Canberra odmítá japonský požadavek a nechce odevzdat nezávislost kontinentu cizímu mandátu. Odmítnutí mění tlak Tokia v přímou výzvu a Japonsko nyní vykresluje Austrálii jako poslední překážku pacifického řádu pod svou kontrolou.\n\nZápas o oceán je nevyhnutelný. Pokud Austrálie nepřijme rámec smlouvou, Japonsko se jej pokusí prosadit silou." # todo: NEW TRANSLATION
 JAP_diplomacy.131.a: "Pak zajistíme jih zbraněmi." # todo: NEW TRANSLATION
 JAP_diplomacy.133.t: "Požadavek tasmánské linie" # todo: NEW TRANSLATION
 JAP_diplomacy.133.d: "Tokio doručilo Wellingtonu požadavek, jehož cílem je uzavřít poslední otevřené křídlo v jižním Pacifiku. Návrh představuje rámec protektorátu, který váže zahraniční politiku a obranný postoj Nového Zélandu ke směru Japonska, ospravedlněný jako cena stability v oceánu reorganizovaném silou.\n\nJazyk hovoří o ochraně a partnerství, struktura je však kontrolní. Nový Zéland si musí vybrat mezi omezeným mírem ve stínu Japonska a válkou za nezávislost napříč mořem." # todo: NEW TRANSLATION
 JAP_diplomacy.133.a: "Přijměme. Vydržíme a přežijeme." # todo: NEW TRANSLATION
 JAP_diplomacy.133.b: "Odmítněme. Pohlceni nebudeme." # todo: NEW TRANSLATION
 JAP_diplomacy.134.t: "Wellington přijímá tasmánskou linii" # todo: NEW TRANSLATION
 JAP_diplomacy.134.d: "Nový Zéland přijímá japonské podmínky a vyměňuje strategickou autonomii za ukončení nepřátelství. Dohody jsou podepsány, přístupová opatření zavedena a Tokio získává bezpečnou jižní základnu, z níž může utvářet širý oceán.\n\nVálka končí, nezávislost se však zužuje. Nový Zéland zůstává, jeho vnější postoj se ale nyní pohybuje v hranicích stanovených v Tokiu." # todo: NEW TRANSLATION
 JAP_diplomacy.134.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.135.t: "Wellington odmítá požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.135.d: "Nový Zéland odmítá japonské ultimátum a nechce odevzdat svou budoucnost cizímu mandátu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje nezávislost Wellingtonu za hrozbu pro svůj jižní perimetr.\n\nPacifik se mění v soustavu frontových linií. Pokud Nový Zéland nepřijme rámec smlouvou, Japonsko se jej pokusí prosadit silou." # todo: NEW TRANSLATION
 JAP_diplomacy.135.a: "Pak obsadíme jižní základnu." # todo: NEW TRANSLATION
 JAP_diplomacy.137.t: "Ultimátum bráně Iravádí" # todo: NEW TRANSLATION
 JAP_diplomacy.137.d: "Tokio vzneslo vůči Naypyidawu požadavek, jehož cílem je zajistit Myanmar jako pozemní most mezi oceány. Podmínky představují rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout japonský dohled nad bezpečností a poskytnout přístup nutný ke kontrole koridorů od Bengálského zálivu po jihovýchodní Asii.\n\nNabídka je prezentována jako stabilita a rozvoj. Pravdou je strategické ovládnutí. Myanmar se musí rozhodnout, zda přijme kontrolovaný mír, nebo bude čelit válce, která promění jeho brány v bojiště." # todo: NEW TRANSLATION
 JAP_diplomacy.137.a: "Přijměme. Tomuto tlaku neodoláme." # todo: NEW TRANSLATION
 JAP_diplomacy.137.b: "Odmítněme. Nenecháme se proměnit v koridor." # todo: NEW TRANSLATION
 JAP_diplomacy.138.t: "Myanmar přijímá podmínky brány" # todo: NEW TRANSLATION
 JAP_diplomacy.138.d: "Myanmar přijímá japonské ultimátum a vyměňuje strategickou autonomii za konec nepřátelství a příslib pořádku. Dohody jsou podepsány, přijíždějí styčné mise a Japonsko získává rozhodující vliv nad vnější orientací Myanmaru a jeho bezpečnostním postojem.\n\nBoje končí, cenou je však suverenita. Myanmar zůstává, jeho brány však nyní slouží regionálnímu plánu sepsanému v Tokiu." # todo: NEW TRANSLATION
 JAP_diplomacy.138.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.139.t: "Myanmar odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.139.d: "Naypyidaw odmítá japonský požadavek a nechce odevzdat svou budoucnost vnějšímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní vykresluje Myanmar jako překážku kontroly koridorů, kterou je třeba přivést do řady.\n\nPokud Myanmar nepřijme rámec smlouvou, Japonsko se jej pokusí prosadit silou. Brána bude zajištěna tak či onak." # todo: NEW TRANSLATION
 JAP_diplomacy.139.a: "Pak ovládneme bránu." # todo: NEW TRANSLATION
 JAP_diplomacy.141.t: "Ultimátum severní vysočině" # todo: NEW TRANSLATION
 JAP_diplomacy.141.d: "Japonsko obrátilo pozornost ke Kačjinu, drsné severní vysočině ovládající průsmyky, zdroje a přístupy k širšímu regionu. Požadavek Tokia je prezentován jako ochrana a uznání, ve skutečnosti jde o protektorát: sladit vnější vztahy s Japonskem, přijmout dohled nad bezpečností a umožnit strategický přístup k zajištění hranice.\n\nPro Kačjin jde o volbu mezi autonomií pouze jménem a praktickým zničením. Přijetí nabízí štít. Odmítnutí přivolá válku vedenou v horách a vesnicích." # todo: NEW TRANSLATION
 JAP_diplomacy.141.a: "Přijměme. K přežití potřebujeme patrona." # todo: NEW TRANSLATION
 JAP_diplomacy.141.b: "Odmítněme. Jednoho pána za druhého nevyměníme." # todo: NEW TRANSLATION
 JAP_diplomacy.143.t: "Kačjin přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.143.d: "Kačjin přijímá podmínky a volí přežití a stabilitu před bojem, který sám nedokáže udržet. Dohody jsou podepsány, zřizují se styčné úřady a Japonsko získává pevnou kontrolu nad severní vysočinou a jejími strategickými koridory.\n\nKonflikt končí, svoboda Kačjinu se však zmenšuje na to, co je dovoleno. Hory zůstávají, jejich budoucnost je ale nyní spojena s Tokiem." # todo: NEW TRANSLATION
 JAP_diplomacy.143.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.144.t: "Kačjin odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.144.d: "Kačjin odmítá japonský požadavek a nechce se podřídit vnějšímu mandátu. Odmítnutí mění nátlak v konfrontaci a Tokio nyní vykresluje vysočinu jako bezpečnostní problém, který musí být vyřešen silou.\n\nPokud Kačjin nepřijme ochranu smlouvou, Japonsko nastolí kontrolu zbraněmi. Hory nezůstanou neutrální." # todo: NEW TRANSLATION
 JAP_diplomacy.144.a: "Pak obsadíme vysočinu." # todo: NEW TRANSLATION
 JAP_diplomacy.145.t: "Požadavek šanského koridoru" # todo: NEW TRANSLATION
 JAP_diplomacy.145.d: "Japonsko doručilo své podmínky úřadům Wa a zaměřilo se na pohraničí ležící na pašeráckých trasách, horských průsmycích a tepnách vnitrozemí. Nabídka je formulována jako uznání a ochrana, ve skutečnosti jde o uspořádání protektorátu: sladit vnější vztahy s Tokiem, přijmout japonský dohled nad bezpečností a umožnit přístup k zajištění koridoru.\n\nPro Wa je volba krutá. Podřídit se a zachovat místní moc pod novým patronátem, nebo odmítnout a čelit válce, která nebude respektovat hory ani milice." # todo: NEW TRANSLATION
 JAP_diplomacy.145.a: "Přijměme. Štít je lepší než zničení." # todo: NEW TRANSLATION
 JAP_diplomacy.145.b: "Odmítněme. Pohlceni nebudeme." # todo: NEW TRANSLATION
 JAP_diplomacy.146.t: "Wa přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.146.d: "Wa přijímá japonské podmínky a vyměňuje strategickou nezávislost za přežití a formální uznání pod silnějším patronem. Přicházejí styčné týmy, trasy jsou zajištěny a pohraničí je začleněno do regionálního rámce Japonska.\n\nBoje končí, autonomie se však zužuje. Wa si zachovává místní autoritu, jeho vnější směřování se však nyní řídí Tokiem." # todo: NEW TRANSLATION
 JAP_diplomacy.146.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.147.t: "Wa odmítá požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.147.d: "Wa odmítá japonské ultimátum a nechce své území podřídit cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje pohraničí za nekontrolovanou mezeru ve své strategii koridorů.\n\nPokud Wa nepřijme rámec smlouvou, Japonsko nastolí kontrolu silou. Hory budou sporným územím." # todo: NEW TRANSLATION
 JAP_diplomacy.147.a: "Pak zajistíme koridor." # todo: NEW TRANSLATION
 JAP_diplomacy.148.t: "Ultimátum šanské bráně" # todo: NEW TRANSLATION
 JAP_diplomacy.148.d: "Japonsko vzneslo svůj požadavek vůči úřadům Jižního Šanu a zaměřilo se na horské trasy spojující vnitrozemí s širším regionem. Návrh představuje rámec protektorátu: sladit vnější vztahy s Tokiem, přijmout japonský dohled nad bezpečností a umožnit strategický přístup k zajištění cest, průsmyků a zásobovacích koridorů.\n\nNabídka slibuje ochranu a uznání. Významem je kontrola. Jižní Šan se musí rozhodnout, zda přijme řízenou budoucnost pod japonským patronátem, nebo riskuje válku vedenou přes své kopce a údolí." # todo: NEW TRANSLATION
 JAP_diplomacy.148.a: "Přijměme. Zničení si nemůžeme dovolit." # todo: NEW TRANSLATION
 JAP_diplomacy.148.b: "Odmítněme. Nenecháme se proměnit v koridor." # todo: NEW TRANSLATION
 JAP_diplomacy.149.t: "Jižní Šan ustupuje" # todo: NEW TRANSLATION
 JAP_diplomacy.149.d: "Jižní Šan přijímá japonské podmínky. Zřizují se styčné úřady, trasy jsou zajištěny a region je začleněn do koridorové strategie Tokia jako kontrolovaná brána, nikoli nezávislý aktér.\n\nBoje končí, autonomie se však zmenšuje. Místní autorita zůstává, strategické směřování se však nyní řídí Japonskem." # todo: NEW TRANSLATION
 JAP_diplomacy.149.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.150.t: "Jižní Šan odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.150.d: "Jižní Šan odmítá japonský požadavek a nechce svou budoucnost podřídit cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje region za nebezpečnou mezeru ve svém strategickém perimetru.\n\nPokud Jižní Šan nepřijme rámec smlouvou, Japonsko jej prosadí silou. Brána bude zajištěna." # todo: NEW TRANSLATION
 JAP_diplomacy.150.a: "Pak bránu obsadíme zbraněmi." # todo: NEW TRANSLATION
 JAP_diplomacy.151.t: "Salwínský mandát" # todo: NEW TRANSLATION
 JAP_diplomacy.151.d: "Japonsko obrátilo svůj pohled ke Karenům, kde říční údolí a pohraniční trasy mohou otevřít nebo uzavřít jižní přístupy. Požadavek Tokia je prezentován jako ochrana a uznání, ve skutečnosti jde o rámec protektorátu: sladit vnější vztahy s Japonskem, přijmout dohled nad bezpečností a poskytnout přístup k zajištění salwínského koridoru.\n\nNabídka slibuje stabilitu v regionu roztříštěné autority. Cenou je poslušnost. Karenové si musí vybrat mezi střeženým mírem pod japonským patronátem a válkou, která spálí jejich přechody a osady." # todo: NEW TRANSLATION
 JAP_diplomacy.151.a: "Přijměme. Dožijeme se zítřka." # todo: NEW TRANSLATION
 JAP_diplomacy.151.b: "Odmítněme. Vládnout nám nikdo nebude." # todo: NEW TRANSLATION
 JAP_diplomacy.152.t: "Karenové se podřizují" # todo: NEW TRANSLATION
 JAP_diplomacy.152.d: "Karenové přijímají japonské podmínky a vyměňují strategickou autonomii za přežití a konec bezprostředního tlaku. Přicházejí styčné mise, trasy jsou zajištěny a region je začleněn do perimetru Tokia jako kontrolovaný koridor, nikoli nezávislý aktér.\n\nKonflikt končí, hranice svobody se však zužují. Karenové si zachovávají místní autoritu, strategické směřování se však nyní řídí Japonskem." # todo: NEW TRANSLATION
 JAP_diplomacy.152.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.153.t: "Karenové odmítají mandát" # todo: NEW TRANSLATION
 JAP_diplomacy.153.d: "Karenové odmítají japonský požadavek a nechceme svou budoucnost podřídit cizímu dohledu. Odmítnutí mění nátlak v konfrontaci a Tokio nyní považuje salwínské přechody za strategický problém, který je třeba vyřešit silou.\n\nPokud Karenové nepřijmou rámec smlouvou, Japonsko jej prosadí zbraněmi. Koridor bude zajištěn." # todo: NEW TRANSLATION
 JAP_diplomacy.153.a: "Pak obsadíme přechody." # todo: NEW TRANSLATION
 JAP_diplomacy.154.t: "Požadavek kotviště Palau" # todo: NEW TRANSLATION
 JAP_diplomacy.154.d: "Tokio doručilo Palau svůj požadavek, malému státu ležícímu na velké části oceánu. Podmínky jsou formulovány jako ochrana a zaručená prosperita, ve skutečnosti však jde o protektorát: sladit zahraniční politiku s Japonskem, přijmout dohled nad bezpečností a udělit práva na základny, která z Palau učiní císařské předsunuté kotviště.\n\nNabídka slibuje bezpečí před politickými i vojenskými bouřemi. Cenou je suverenita. Palau si musí vybrat mezi podřízením vycházejícímu slunci a bojem, který nemůže dlouhodobě vést proti námořní moci velkého státu." # todo: NEW TRANSLATION
 JAP_diplomacy.154.a: "Přijměme. Patron je lepší než hrob." # todo: NEW TRANSLATION
 JAP_diplomacy.154.b: "Odmítněme. Neodevzdáme svou nezávislost." # todo: NEW TRANSLATION
 JAP_diplomacy.155.t: "Palau přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.155.d: "Palau přijímá japonské podmínky. Dohody jsou podepsány, přístup je udělen a ostrovy se stávají disciplinovaným uzlem v síti tokijských přístavů a letišť.\n\nKrize končí bez bitvy, změna je však skutečná. Palau zůstává jménem, jeho vnější směřování se však nyní řídí japonským kompasem." # todo: NEW TRANSLATION
 JAP_diplomacy.155.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.156.t: "Palau odmítá požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.156.d: "Palau odmítá japonské ultimátum a nechce vyměnit suverenitu za sliby ochrany. Odmítnutí mění tlak Tokia v otázku síly a Japonsko nyní považuje ostrovy za nezajištěnou mezeru ve svém oceánském perimetru.\n\nPokud Palau nepřijme rámec smlouvou, Japonsko nastolí kontrolu zbraněmi. Kotviště bude zajištěno." # todo: NEW TRANSLATION
 JAP_diplomacy.156.a: "Pak obsadíme kotviště." # todo: NEW TRANSLATION
 JAP_diplomacy.157.t: "Ultimátum mikronéskému řetězci" # todo: NEW TRANSLATION
 JAP_diplomacy.157.d: "Japonsko vzneslo svůj požadavek vůči Mikronésii a pohlíží na ostrovy nikoli jako na rozptýlená společenství, ale jako na řetězec stupňů napříč středním Pacifikem. Nabídka je formulována jako ochrana a investice, struktura je však protektorátní: sladit zahraniční politiku s Tokiem, přijmout dohled nad bezpečností a poskytnout přístup, který promění ostrovy v opěrné body japonského loďstva a letectva.\n\nPoselství je prosté. Tyto vody budou spravovány pod jedinou autoritou. Mikronésie si musí vybrat mezi řízeným mírem pod japonským patronátem a konfrontací, kterou nemůže doufat udržet." # todo: NEW TRANSLATION
 JAP_diplomacy.157.a: "Přijměme. Přílivu neodoláme." # todo: NEW TRANSLATION
 JAP_diplomacy.157.b: "Odmítněme. Nestaneme se předsunutou základnou." # todo: NEW TRANSLATION
 JAP_diplomacy.158.t: "Mikronésie přijímá řetězec" # todo: NEW TRANSLATION
 JAP_diplomacy.158.d: "Mikronésie přijímá japonské podmínky. Dohody jsou podepsány, přístup je udělen a ostrovy se stávají kontrolovaným koridorem přístavů, letišť a sledovacích uzlů v rámci námořního perimetru Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Mikronésie zůstává, její vnější směřování se však nyní řídí japonským strategickým kompasem." # todo: NEW TRANSLATION
 JAP_diplomacy.158.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.159.t: "Mikronésie odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.159.d: "Mikronésie odmítá japonský požadavek a nechce svou budoucnost podřídit cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje ostrovní řetězec za mezeru ve své pacifické síti, kterou je třeba uzavřít.\n\nPokud Mikronésie nepřijme rámec smlouvou, Japonsko nastolí kontrolu silou. Řetězec bude zajištěn." # todo: NEW TRANSLATION
 JAP_diplomacy.159.a: "Pak obsadíme opěrné body." # todo: NEW TRANSLATION
 JAP_diplomacy.160.t: "Požadavek základny na Nauru" # todo: NEW TRANSLATION
 JAP_diplomacy.160.d: "Tokio doručilo Nauru svůj požadavek a považuje ostrov za bod na mapě, který může stále sloužit jako kotva pro sledování, doplňování paliva a dosah přes otevřené vody. Nabídka je formulována jako ochrana a zaručená podpora, ve skutečnosti jde o rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout dohled nad bezpečností a umožnit přístup, který z Nauru učiní císařskou základnu.\n\nPro Nauru je volba jasná. Podřídit se a přežít pod větší mocností, nebo odmítnout a riskovat, že se stane bojištěm dokazujícím správnost japonského postoje." # todo: NEW TRANSLATION
 JAP_diplomacy.160.a: "Přijměme. Sami stát nemůžeme." # todo: NEW TRANSLATION
 JAP_diplomacy.160.b: "Odmítněme. Nenecháme se proměnit v opěrný bod." # todo: NEW TRANSLATION
 JAP_diplomacy.161.t: "Nauru přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.161.d: "Nauru přijímá japonské podmínky. Dohody jsou podepsány, přístup je udělen a ostrov se stává malým, avšak životně důležitým uzlem v pacifické síti Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Nauru zůstává, jeho vnější směřování se však nyní řídí japonskou strategickou linií." # todo: NEW TRANSLATION
 JAP_diplomacy.161.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.162.t: "Nauru odmítá požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.162.d: "Nauru odmítá japonské ultimátum a nechce vyměnit nezávislost za sliby ochrany. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje ostrov za nezajištěnou mezeru ve svém oceánském perimetru.\n\nPokud Nauru nepřijme rámec smlouvou, Japonsko nastolí kontrolu silou. Základna bude zajištěna." # todo: NEW TRANSLATION
 JAP_diplomacy.162.a: "Pak obsadíme ostrov." # todo: NEW TRANSLATION
 JAP_diplomacy.163.t: "Ultimátum rovníkové linii" # todo: NEW TRANSLATION
 JAP_diplomacy.163.d: "Japonsko vzneslo svůj požadavek vůči Kiribati, státu rozptýlenému podél rovníku jako značky na mapě navigátora. Návrh Tokia je formulován jako ochrana a rozvoj, ve skutečnosti však jde o rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout dohled nad bezpečností a umožnit přístup, který promění Kiribati v řetězec opěrných bodů pro sledování a dosah námořnictva.\n\nPoselství je prosté. V novém pacifickém řádu nejsou prázdná místa. Kiribati si musí vybrat mezi podřízením pod japonským patronátem a konfrontací s mocností, která hodlá vlastnit námořní trasy." # todo: NEW TRANSLATION
 JAP_diplomacy.163.a: "Přijměme. Novému vládci oceánu neodoláme." # todo: NEW TRANSLATION
 JAP_diplomacy.163.b: "Odmítněme. Do říše pohlceni nebudeme." # todo: NEW TRANSLATION
 JAP_diplomacy.164.t: "Kiribati přijímá rovníkovou linii" # todo: NEW TRANSLATION
 JAP_diplomacy.164.d: "Kiribati přijímá japonské podmínky. Dohody jsou podepsány, přístup je udělen a rozptýlené atoly se stávají tichou, avšak cennou součástí pacifické sítě Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Kiribati zůstává, jeho vnější směřování se však nyní řídí japonským kompasem." # todo: NEW TRANSLATION
 JAP_diplomacy.164.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.165.t: "Kiribati odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.165.d: "Kiribati odmítá japonské ultimátum a nechce svou budoucnost podřídit cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje rovníkový řetězec za mezeru ve svém námořním perimetru.\n\nPokud Kiribati nepřijme rámec smlouvou, Japonsko nastolí kontrolu silou. Linie bude zajištěna." # todo: NEW TRANSLATION
 JAP_diplomacy.165.a: "Pak obsadíme řetězec." # todo: NEW TRANSLATION
 JAP_diplomacy.166.t: "Požadavek atolové pevnosti" # todo: NEW TRANSLATION
 JAP_diplomacy.166.d: "Tokio vzneslo vůči Marshallovým ostrovům svůj požadavek a považuje atoly za přirozené pevnosti schopné hostit letiště, logistiku a nástroje kontroly moře. Nabídka je formulována jako ochrana a zaručená podpora, ve skutečnosti však jde o rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout dohled nad bezpečností a umožnit přístup, který promění Marshallovy ostrovy v opěrné body japonského středopacifického perimetru.\n\nPoselství je jasné. Tyto ostrovy nezůstanou neutrálními tečkami na mapě. Marshallovy ostrovy si musí vybrat mezi řízeným mírem pod japonským patronátem a válkou vedenou o korály a přistávací dráhy." # todo: NEW TRANSLATION
 JAP_diplomacy.166.a: "Přijměme. Obléhání bychom nepřežili." # todo: NEW TRANSLATION
 JAP_diplomacy.166.b: "Odmítněme. Pevností jiné mocnosti se nestaneme." # todo: NEW TRANSLATION
 JAP_diplomacy.167.t: "Marshallovy ostrovy ustupují" # todo: NEW TRANSLATION
 JAP_diplomacy.167.d: "Marshallovy ostrovy přijímají japonské podmínky. Dohody jsou podepsány, přístup je udělen a atoly se stávají disciplinovanými opěrnými body v oceánské síti Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Marshallovy ostrovy zůstávají, jejich vnější směřování se však nyní řídí japonským plánem perimetru." # todo: NEW TRANSLATION
 JAP_diplomacy.167.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.168.t: "Marshallovy ostrovy odmítají požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.168.d: "Marshallovy ostrovy odmítají japonské ultimátum a nechceme svou budoucnost podřídit cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje atoly za nezajištěnou mezeru ve své středopacifické obranné linii.\n\nPokud Marshallovy ostrovy nepřijmou rámec smlouvou, Japonsko nastolí kontrolu silou. Opěrné body budou zajištěny." # todo: NEW TRANSLATION
 JAP_diplomacy.168.a: "Pak obsadíme atoly." # todo: NEW TRANSLATION
 JAP_diplomacy.169.t: "Ultimátum útesové linii" # todo: NEW TRANSLATION
 JAP_diplomacy.169.d: "Japonsko vzneslo svůj požadavek vůči Tuvalu, tenkému řetězci útesů, který je stále důležitý v oceánu měřeném dosahem a místy pro doplňování paliva. Tokio nabízí ochranu a podporu, struktura je však protektorátní: sladit zahraniční politiku s Japonskem, přijmout dohled nad bezpečností a umožnit přístup, který promění Tuvalu v opěrný bod jižního perimetru Japonska.\n\nPoselství je brutálně prosté. V rozděleném Pacifiku nebudou žádné neutrální ostrovy. Tuvalu si musí vybrat mezi podřízením pod japonským patronátem a konfrontací, která by malý stát utopila ve válce velmocí." # todo: NEW TRANSLATION
 JAP_diplomacy.169.a: "Přijměme. Ocelové bouři neodoláme." # todo: NEW TRANSLATION
 JAP_diplomacy.169.b: "Odmítněme. Svou vlajku neodevzdáme." # todo: NEW TRANSLATION
 JAP_diplomacy.170.t: "Tuvalu přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.170.d: "Tuvalu přijímá japonské podmínky. Dohody jsou podepsány, přístup je udělen a ostrovy se stávají tichým uzlem v námořní síti Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Tuvalu zůstává, jeho vnější směřování se však nyní řídí japonským plánem perimetru." # todo: NEW TRANSLATION
 JAP_diplomacy.170.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.171.t: "Tuvalu odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.171.d: "Tuvalu odmítá japonské ultimátum a nechce vyměnit nezávislost za sliby ochrany. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje útesovou linii za nezajištěnou mezeru ve svém jižním řetězci.\n\nPokud Tuvalu nepřijme rámec smlouvou, Japonsko nastolí kontrolu silou. Opěrný bod bude zajištěn." # todo: NEW TRANSLATION
 JAP_diplomacy.171.a: "Pak obsadíme ostrovy." # todo: NEW TRANSLATION
 JAP_diplomacy.172.t: "Ultimátum Šalomounově bariéře" # todo: NEW TRANSLATION
 JAP_diplomacy.172.d: "Tokio vzneslo vůči Šalomounovým ostrovům svůj požadavek a považuje řetězec za přirozenou bariéru schopnou uzavřít jihozápadní Pacifik. Nabídka je formulována jako ochrana a rozvoj, ve skutečnosti však jde o rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout dohled nad bezpečností a poskytnout přístup k základnám, který promění Šalomounovy ostrovy v opevněný štít japonského námořního perimetru.\n\nPoselství je jasné. Tyto ostrovy budou sloužit japonskému řádu, nebo budou považovány za nepřátelské předmostí. Šalomounovy ostrovy si musí vybrat mezi podřízením vycházejícímu slunci a válkou vedenou přes džunglová letiště a úzká moře." # todo: NEW TRANSLATION
 JAP_diplomacy.172.a: "Přijměme. Blokádu bychom nepřežili." # todo: NEW TRANSLATION
 JAP_diplomacy.172.b: "Odmítněme. Pevností jiné říše se nestaneme." # todo: NEW TRANSLATION
 JAP_diplomacy.173.t: "Šalomounovy ostrovy ustupují" # todo: NEW TRANSLATION
 JAP_diplomacy.173.d: "Šalomounovy ostrovy přijímají japonské podmínky. Dohody jsou podepsány, přístup je udělen a řetězec se stává disciplinovanou bariérou přístavů, letišť a hlídkových zón pod vedením Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Šalomounovy ostrovy zůstávají, jejich vnější orientace se však nyní řídí japonským plánem perimetru." # todo: NEW TRANSLATION
 JAP_diplomacy.173.a: "Ustanovte protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.174.t: "Šalomounovy ostrovy odmítají ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.174.d: "Šalomounovy ostrovy odmítají japonský požadavek a nechceme svou budoucnost podřídit cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje řetězec za nebezpečnou mezeru ve svém jihozápadním pacifickém štítu.\n\nPokud Šalomounovy ostrovy nepřijmou rámec smlouvou, Japonsko nastolí kontrolu silou. Bariéra bude zajištěna." # todo: NEW TRANSLATION
 JAP_diplomacy.174.a: "Pak se řetězce zmocníme." # todo: NEW TRANSLATION
 JAP_diplomacy.175.t: "Ultimátum novoguinejské pevnosti" # todo: NEW TRANSLATION
 JAP_diplomacy.175.d: "Japonsko vzneslo vůči Papui-Nové Guineji svůj požadavek a považuje ostrov za kontinentální pevnost schopnou ovládnout přístupy mezi jihovýchodní Asií a Pacifikem. Nabídka je formulována jako ochrana a zaručená podpora, ve skutečnosti však jde o rámec protektorátu: sladit zahraniční politiku s Tokiem, přijmout dohled nad bezpečností a poskytnout přístup k základnám, který promění Novou Guineu v pevnost letecké moci, logistiky a předsunuté obrany.\n\nPoselství nenechává mnoho pochyb. Japonsko zde hodlá ukotvit jižní bojiště. Papua-Nová Guinea si musí vybrat mezi podřízením pod japonským štítem a válkou, která promění její pobřeží a vysočiny v frontové linie." # todo: NEW TRANSLATION
 JAP_diplomacy.175.a: "Přijměme. Nemůžeme si dovolit stát se bojištěm." # todo: NEW TRANSLATION
 JAP_diplomacy.175.b: "Odmítnout. Nedovolíme, aby z nás jiná mocnost udělala pevnost." # todo: NEW TRANSLATION
 JAP_diplomacy.176.t: "Port Moresby přijímá" # todo: NEW TRANSLATION
 JAP_diplomacy.176.d: "Papua-Nová Guinea přijímá japonské podmínky. Dohody jsou podepsány, přístup je povolen a ostrov se stává disciplinovanou baštou v jižním obvodu Tokia, vybudovanou kolem letišť, přístavů a logistických center.\n\nKrize končí bez bitvy, suverenita se však zužuje. Papua-Nová Guinea zůstává, její strategické směřování se však nyní řídí japonským plánem pevnosti." # todo: NEW TRANSLATION
 JAP_diplomacy.176.a: "Zřídit protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.177.t: "Papua-Nová Guinea odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.177.d: "Papua-Nová Guinea odmítá japonský požadavek a odmítá podřídit svou budoucnost cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje ostrov za hlavní překážku zajištění jižního bojiště.\n\nPokud Papua-Nová Guinea nepřijme rámec smlouvou, Japonsko jí kontrolu vnutí silou. Bašta bude dobyta." # todo: NEW TRANSLATION
 JAP_diplomacy.177.a: "Pak baštu obsadíme." # todo: NEW TRANSLATION
 JAP_diplomacy.178.t: "Požadavek na řetěz ostrovů jižního Pacifiku" # todo: NEW TRANSLATION
 JAP_diplomacy.178.d: "Tokio vzneslo svůj požadavek vůči Vanuatu a považuje ostrovy za další článek řetězu, který může uzavřít jihozápadní Pacifik. Nabídka je formulována jako ochrana a rozvojová pomoc, jde však o rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout bezpečnostní dohled a poskytnout přístup, který z Vanuatu učiní zastávku pro hlídkování, doplňování paliva a regionální kontrolu.\n\nPoselství je jasné. Japonsko buduje obvod, ostrov po ostrovu. Vanuatu si musí vybrat mezi řízeným mírem pod Vycházejícím sluncem a konfrontací, kterou nemůže doufat dlouhodobě udržet." # todo: NEW TRANSLATION
 JAP_diplomacy.178.a: "Přijmout. Nemůžeme bojovat s říší na moři." # todo: NEW TRANSLATION
 JAP_diplomacy.178.b: "Odmítnout. Nedovolíme, aby nás pohltili." # todo: NEW TRANSLATION
 JAP_diplomacy.179.t: "Vanuatu přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.179.d: "Vanuatu přijímá japonské podmínky. Dohody jsou podepsány, přístup je povolen a ostrovy se stávají tichým, ale užitečným bodem v jižním obvodu Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Vanuatu zůstává, jeho zahraniční směřování se však nyní řídí japonskou strategickou linií." # todo: NEW TRANSLATION
 JAP_diplomacy.179.a: "Zřídit protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.180.t: "Vanuatu odmítá požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.180.d: "Vanuatu odmítá japonské ultimátum a odmítá vyměnit nezávislost za sliby ochrany. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje ostrovy za nezajištěnou mezeru ve svém řetězu v jihozápadním Pacifiku.\n\nPokud Vanuatu nepřijme rámec smlouvou, Japonsko mu kontrolu vnutí silou. Článek řetězu bude zajištěn." # todo: NEW TRANSLATION
 JAP_diplomacy.180.a: "Pak ostrovy obsadíme." # todo: NEW TRANSLATION
 JAP_diplomacy.181.t: "Ultimátum na jižní pacifický základní kámen" # todo: NEW TRANSLATION
 JAP_diplomacy.181.d: "Japonsko vzneslo svůj požadavek vůči Fidži a považuje ostrovy za centrum, které může podporovat logistiku flotily a letecké operace napříč širokým obloukem jižního Pacifiku. Nabídka je formulována jako ochrana a zaručená podpora, jde však o rámec protektorátu: sladit zahraniční politiku s Tokiem, přijmout bezpečnostní dohled a poskytnout přístup k základnám, který z Fidži učiní základní kámen jižního obvodu Japonska.\n\nPoselství je nezaměnitelné. Japonsko nehledá přátele, buduje řád. Fidži si musí vybrat mezi řízeným mírem pod japonským deštníkem a konfrontací, o níž rozhodne námořní síla." # todo: NEW TRANSLATION
 JAP_diplomacy.181.a: "Přijmout. Nemůžeme si dovolit stát se odstrašujícím příkladem." # todo: NEW TRANSLATION
 JAP_diplomacy.181.b: "Odmítnout. Fidži se nepodřídí." # todo: NEW TRANSLATION
 JAP_diplomacy.182.t: "Fidži přijímá podmínky základního kamene" # todo: NEW TRANSLATION
 JAP_diplomacy.182.d: "Fidži přijímá japonské ultimátum. Dohody jsou podepsány, přístup je povolen a ostrovy se stávají centrálním bodem tokijské sítě přístavů, letišť a hlídkových zón v jižním Pacifiku.\n\nKrize končí bez bitvy, suverenita se však zužuje. Fidži zůstává, jeho zahraniční směřování se však nyní řídí japonským plánem obvodu." # todo: NEW TRANSLATION
 JAP_diplomacy.182.a: "Zřídit protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.183.t: "Fidži odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.183.d: "Fidži odmítá japonský požadavek a odmítá podřídit svou budoucnost cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje ostrovy za poslední mezeru v jižním obvodu, který hodlá uzavřít.\n\nPokud Fidži nepřijme rámec smlouvou, Japonsko mu kontrolu vnutí silou. Základní kámen bude zajištěn." # todo: NEW TRANSLATION
 JAP_diplomacy.183.a: "Pak centrum obsadíme." # todo: NEW TRANSLATION
 JAP_diplomacy.184.t: "Ultimátum samojské linie" # todo: NEW TRANSLATION
 JAP_diplomacy.184.d: "Tokio vzneslo svůj požadavek vůči Samoi a považuje ostrovy za spojovací bod mezi centrálním Pacifikem a jižními přístupy. Nabídka je formulována jako ochrana a zaručená podpora, jde však o rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout bezpečnostní dohled a poskytnout přístup, který ze Samoy učiní zastávku v rozšiřujícím se japonském oceánském obvodu.\n\nPoselství je strohé. Japonsko kreslí přes moře linie a Samoa leží na jedné z nich. Přijetí nabízí bezpečí pod větší mocností, odmítnutí hrozí tím, že se Samoa stane lekcí, která přesvědčí ostatní." # todo: NEW TRANSLATION
 JAP_diplomacy.184.a: "Přijmout. Přežijeme, i kdybychom se museli podřídit." # todo: NEW TRANSLATION
 JAP_diplomacy.184.b: "Odmítnout. Samoa se neskloní." # todo: NEW TRANSLATION
 JAP_diplomacy.185.t: "Samoa přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.185.d: "Samoa přijímá japonské ultimátum. Dohody jsou podepsány, přístup je povolen a ostrovy se stávají tichým, ale užitečným bodem v tokijské pacifické síti.\n\nKrize končí bez bitvy, suverenita se však zužuje. Samoa zůstává, její zahraniční směřování se však nyní řídí japonskou strategickou linií." # todo: NEW TRANSLATION
 JAP_diplomacy.185.a: "Zřídit protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.186.t: "Samoa odmítá ultimátum" # todo: NEW TRANSLATION
 JAP_diplomacy.186.d: "Samoa odmítá japonský požadavek a odmítá vyměnit nezávislost za sliby ochrany. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje ostrovy za nezajištěnou mezeru ve svém oceánském obvodu.\n\nPokud Samoa nepřijme rámec smlouvou, Japonsko jí kontrolu vnutí silou. Linie bude zajištěna." # todo: NEW TRANSLATION
 JAP_diplomacy.186.a: "Pak ostrovy obsadíme." # todo: NEW TRANSLATION
 JAP_diplomacy.187.t: "Požadavek na tongskou korunu" # todo: NEW TRANSLATION
 JAP_diplomacy.187.d: "Tokio vzneslo svůj požadavek vůči Tonze, království, jehož přístavy a námořní trasy leží na jižním oblouku Pacifiku. Nabídka je formulována jako ochrana a partnerství, jde však o rámec protektorátu: sladit zahraniční politiku s Japonskem, přijmout bezpečnostní dohled a poskytnout přístup, který z Tongy učiní zastávku v rozšiřujícím se japonském námořním obvodu.\n\nPoselství je jasné. Japonsko buduje oceánský řád, který neponechává prostor nezávislým opěrným bodům. Tonga si musí vybrat mezi chráněným mírem ve stínu Japonska a konfrontací, o níž rozhodnou flotily." # todo: NEW TRANSLATION
 JAP_diplomacy.187.a: "Přijmout. Korunu si ponecháme, i kdyby byla ve stínu." # todo: NEW TRANSLATION
 JAP_diplomacy.187.b: "Odmítnout. Tonga se nepodřídí." # todo: NEW TRANSLATION
 JAP_diplomacy.188.t: "Tonga přijímá japonskou ochranu" # todo: NEW TRANSLATION
 JAP_diplomacy.188.d: "Tonga přijímá japonské podmínky. Dohody jsou podepsány, přístup je povolen a království se stává disciplinovaným bodem v jižní síti Tokia.\n\nKrize končí bez bitvy, suverenita se však zužuje. Tonga zůstává, její zahraniční směřování se však nyní řídí japonskou strategickou linií." # todo: NEW TRANSLATION
 JAP_diplomacy.188.a: "Zřídit protektorát." # todo: NEW TRANSLATION
 JAP_diplomacy.189.t: "Tonga odmítá požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.189.d: "Tonga odmítá japonské ultimátum a odmítá podřídit svou budoucnost cizímu dohledu. Odmítnutí mění tlak v konfrontaci a Tokio nyní považuje království za nezajištěnou mezeru ve svém jižním oblouku.\n\nPokud Tonga nepřijme rámec smlouvou, Japonsko jí kontrolu vnutí silou. Zastávka bude zajištěna." # todo: NEW TRANSLATION
 JAP_diplomacy.189.a: "Pak ostrovy obsadíme." # todo: NEW TRANSLATION
 JAP_diplomacy.190.t: "Oznámení Washingtonu: Stažení z Pacifiku" # todo: NEW TRANSLATION
 JAP_diplomacy.190.d: "Tokio doručilo Washingtonu formální požadavek na převedení klíčových amerických ostrovů v Pacifiku. Poselství je strohé: cizí opěrné body v japonském oceánském obvodu již nebudou tolerovány a tyto základny musí být opuštěny, aby se zabránilo další eskalaci.\n\nPožadavek je formulován jako možnost vyhnout se válce, zároveň však jde o zkoušku odhodlání. Přijmout a postoupit mocenské opěrné body, nebo odmítnout a riskovat, že se Pacifik promění v bojiště obrů." # todo: NEW TRANSLATION
 JAP_diplomacy.190.a: "Přijmout převod." # todo: NEW TRANSLATION
 JAP_diplomacy.190.b: "Odmítnout. Pacifik jim nepatří." # todo: NEW TRANSLATION
 JAP_diplomacy.191.t: "Washington ustupuje od opěrných bodů" # todo: NEW TRANSLATION
 JAP_diplomacy.191.d: "Spojené státy navzdory očekávání požadavek přijaly. Ostrovy jsou převedeny, základny evakuovány a japonský námořní obvod se jediným tahem rozšiřuje.\n\nKrize končí bez války, význam je však nezaměnitelný. Velmoc ustoupila a rovnováha v Pacifiku se posouvá směrem k Tokiu." # todo: NEW TRANSLATION
 JAP_diplomacy.191.a: "Zajistit ostrovy." # todo: NEW TRANSLATION
 JAP_diplomacy.192.t: "Washington odmítá" # todo: NEW TRANSLATION
 JAP_diplomacy.192.d: "Spojené státy odmítají japonský požadavek a odmítají se vzdát svých opěrných bodů v Pacifiku. Odmítnutí mění tokijské ultimátum v přímou konfrontaci mocností a Japonsko nyní má ospravedlnění i motivaci získat opěrné body silou.\n\nPacifik se stahuje do frontových linií. Pokud tyto ostrovy nebudou postoupeny smlouvou, budou dobyty válkou." # todo: NEW TRANSLATION
 JAP_diplomacy.192.a: "Pak si je vezmeme silou." # todo: NEW TRANSLATION
 JAP_diplomacy.193.t: "Ultimátum Paříži: Pacifik musí být vyklizen" # todo: NEW TRANSLATION
 JAP_diplomacy.193.d: "Tokio doručilo Paříži formální požadavek na převod francouzských ostrovních držav v Pacifiku. Nota je zahalena do zdvořilého jazyka, její význam je však nezaměnitelný: vzdálené říše již nebudou držet opěrné body uvnitř japonského oceánského obvodu.\n\nJaponsko nabízí úzkou cestu, jak se vyhnout eskalaci. Francie může ustoupit s inkoustem a podpisy, nebo odmítnout a přijmout, že spor vyřeší flotily místo diplomatů." # todo: NEW TRANSLATION
 JAP_diplomacy.193.a: "Přijmout převod." # todo: NEW TRANSLATION
 JAP_diplomacy.193.b: "Odmítnout. Francie nebude vytlačena." # todo: NEW TRANSLATION
 JAP_diplomacy.194.t: "Paříž se stahuje z Pacifiku" # todo: NEW TRANSLATION
 JAP_diplomacy.194.d: "Francie přijímá japonský požadavek. Vlajky jsou spuštěny, posádky dostávají rozkaz k odchodu a ostrovy jsou převedeny pod kontrolu Tokia.\n\nKrize končí bez války, zpráva však zní po celém světě. Japonsko nevyjednává o sféře, ono ji prosazuje." # todo: NEW TRANSLATION
 JAP_diplomacy.194.a: "Zajistit ostrovy." # todo: NEW TRANSLATION
 JAP_diplomacy.195.t: "Paříž odmítá" # todo: NEW TRANSLATION
 JAP_diplomacy.195.d: "Francie odmítá japonské ultimátum a odmítá se vzdát svých držav v Pacifiku. Odmítnutí mění tokijský požadavek v přímou konfrontaci a Japonsko nyní má důvod získat ostrovy silou.\n\nOceán se zmenšuje, když se střetnou velmoci. Pokud Francie neustoupí smlouvou, Japonsko se ji pokusí vytlačit válkou." # todo: NEW TRANSLATION
 JAP_diplomacy.195.a: "Pak je obsadíme." # todo: NEW TRANSLATION
 JAP_diplomacy.196.t: "Oznámení Londýnu: Vzdejte se pacifické državy" # todo: NEW TRANSLATION
 JAP_diplomacy.196.d: "Tokio doručilo Londýnu formální požadavek na převod poslední britské ostrovní državy v Pacifiku. Nota hovoří o regionální stabilitě a konci vzdáleného vměšování, její účel je však jasný: Japonsko hodlá odstranit cizí vlajky z oceánu, nad nímž nyní hodlá prosazovat dohled.\n\nBritánii je nabídnuta volba mezi spořádaným stažením a zbytečnou válkou daleko od domova. Přijmout a záležitost skončí na papíře. Odmítnout a Pacifik se stane dalším bojištěm, kde říše zkoušejí vůli jedna druhé." # todo: NEW TRANSLATION
 JAP_diplomacy.196.a: "Přijmout převod." # todo: NEW TRANSLATION
 JAP_diplomacy.196.b: "Odmítnout. Británie nebude vyhnána." # todo: NEW TRANSLATION
 JAP_diplomacy.197.t: "Londýn ustupuje" # todo: NEW TRANSLATION
 JAP_diplomacy.197.d: "Spojené království přijímá japonský požadavek. Území je převedeno, vlajka spuštěna a Tokio přidává další díl do svého vynuceného námořního obvodu.\n\nKrize končí bez války, symbolika je však významná. Stará námořní mocnost ustoupila a japonský nárok na Pacifik je s každým ústupkem smělejší." # todo: NEW TRANSLATION
 JAP_diplomacy.197.a: "Zajistit území." # todo: NEW TRANSLATION
 JAP_diplomacy.198.t: "Londýn odmítá požadavek" # todo: NEW TRANSLATION
 JAP_diplomacy.198.d: "Británie odmítá japonské ultimátum a odmítá se vzdát své pacifické državy. Odmítnutí mění tokijský požadavek v přímou výzvu a Japonsko nyní má motiv i záminku zmocnit se území silou.\n\nDiplomacie dosáhla svého limitu. Pokud Británie neustoupí smlouvou, Japonsko se ji pokusí odstranit válkou." # todo: NEW TRANSLATION
 JAP_diplomacy.198.a: "Pak si je vezmeme." # todo: NEW TRANSLATION
 JAP_diplomacy.199.t: "Japonské kanály v Pchjongjangu se rozšiřují" # todo: NEW TRANSLATION
 JAP_diplomacy.199.d: "Japonská politika vůči severu vstoupila do nové fáze. Prostřednictvím prostředníků, zpravodajských kontaktů a pečlivě řízeného tlaku otevřelo Tokio uvnitř našeho politického prostředí kanály, které byly dříve omezené nebo uzavřené.\n\nNeznamená to důvěru ani spojenectví. Znamená to, že Japonsko nyní dočasně získalo příležitost ovlivňovat rozhodnutí, působit na frakce a zkoušet naše odhodlání zevnitř i zvenčí." # todo: NEW TRANSLATION
 JAP_diplomacy.199.a: "Tyto kanály budeme pečlivě sledovat." # todo: NEW TRANSLATION
 JAP_diplomacy.200.t: "Ztráta Sachalinu a Kuril" # todo: NEW TRANSLATION
 JAP_diplomacy.200.d: "Ruské síly znovu získaly úplnou kontrolu nad Sachalinem a Kurilskými ostrovy a zvrátily všechny zisky dosažené během tažení. Operace se zhroutila a Tokio již nedokáže toto úsilí udržet. Jedinou zbývající možností je příměří.\n\nToto selhání ponese následky. Veřejná důvěra ve vojenský úsudek vlády byla otřesena a politické náklady tohoto neštěstí budou pociťovány po mnoho let." # todo: NEW TRANSLATION
 JAP_diplomacy.200.a: "Nemáme jinou možnost než přijmout porážku." # todo: NEW TRANSLATION
 JAP_failed_sakhalin_war: "Důsledky sachalinské války" # todo: NEW TRANSLATION
 JAP_failed_sakhalin_war_desc: "Neúspěšné vojenské tažení o Sachalin a Kurilské ostrovy zanechalo hluboké jizvy v japonské politické krajině. Veřejná důvěra ve strategické schopnosti vlády se rozpadla, vojenská morálka utrpěla a diplomatické následky nadále omezují možnosti Tokia v zahraniční politice." # todo: NEW TRANSLATION
 JAP_mars_colony1: "Marťanská kolonie Amaterasu" # todo: NEW TRANSLATION
 JAP_mars_colony1_desc: "Marťanská kolonie \"Amaterasu\", pojmenovaná po bohyni slunce, která osvětluje nebesa, představuje zářivý symbol jednoty a vůdcovství Japonska. Její přítomnost doma inspiruje důvěru a v zahraničí respekt." # todo: NEW TRANSLATION
 JAP_mars_colony2: "Marťanská kolonie Kagucuchi" # todo: NEW TRANSLATION
 JAP_mars_colony2_desc: "Marťanská kolonie \"Kagucuchi\", pojmenovaná po bohu ohně, je vybudována kolem pecí, rafinerií a těžkého průmyslu. Její účel je jasný: proměnit marťanskou rudu a energii v sílu pro japonské továrny." # todo: NEW TRANSLATION
 JAP_mars_colony3: "Marťanská kolonie Cukujomi" # todo: NEW TRANSLATION
 JAP_mars_colony3_desc: "Marťanská kolonie \"Cukujomi\", pojmenovaná po bohu Měsíce a noci, slouží jako klidná observatoř a výzkumný komplex. Z jejích laboratoří a přístrojů proudí data zpět do Japonska a prohlubují vědecké poznání." # todo: NEW TRANSLATION
 JAP_mars_colony4: "Marťanská kolonie Susanoo" # todo: NEW TRANSLATION
 JAP_mars_colony4_desc: "Marťanská kolonie \"Susanoo\", pojmenovaná po božstvu přinášejícím bouře, je utvářena jako drsná pohraniční základna. Cvičiště a experimentální střelnice z ní činí zkušební prostor pro japonské ozbrojené síly a jejich doktríny." # todo: NEW TRANSLATION
 JAP_american_pressure_article_nine: "Pod tlakem amerických cel" # todo: NEW TRANSLATION
 JAP_american_pressure_article_nine_desc: "Washington spojil obchodní otázku s otázkou obrany. Hrozby cly a využívání zdrojů tlačí Tokio k širší vojenské úloze a dokud nebude spor vyřešen, Japonsko vyjednává z horší pozice." # todo: NEW TRANSLATION
 JAP_JP_USA_SOFA_1: "Rámec dohody SOFA mezi USA a Japonskem" # todo: NEW TRANSLATION
 JAP_JP_USA_SOFA_1_desc: "Americké síly v Japonsku působí podle Dohody o statusu sil, která většinu personálu chrání před japonskými soudy a daněmi a poskytuje USA širokou kontrolu nad jejich základnami. Místní policie, guvernéři i obyvatelé se musí přizpůsobovat pravidlům vyjednaným ve Washingtonu a Tokiu a každý zločin, nehoda či stížnost na hluk v okolí základny prochází nejprve postupy SOFA, než může Japonsko jednat." # todo: NEW TRANSLATION
 JAP_maritime_heavy_industry_corridor: "Námořní koridor těžkého průmyslu" # todo: NEW TRANSLATION
 JAP_maritime_heavy_industry_corridor_desc: "Japonsko rozvíjí souvislý pás loděnic, oceláren a firem námořního strojírenství podél klíčových pobřežních oblastí. Soustředění investic do tohoto koridoru zvyšuje kapacitu pro stavbu a údržbu válečných lodí, ponorek a podpůrných plavidel a posiluje průmyslovou páteř flotily." # todo: NEW TRANSLATION
