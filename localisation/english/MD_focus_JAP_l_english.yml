 JAP_whistleblower_protection_act: "Zákon na ochranu oznamovatelů" # todo: NEW TRANSLATION
 JAP_whistleblower_protection_act_desc: "Auditoři mohou číst jen to, co jim firma předloží, zatímco zaměstnanci vědí, které půjčky byly převedeny a které faktury zpětně datovány. Pracují pro společnost, kterou by museli obvinit, na trhu práce, který nabízí jednu kariéru a žádnou druhou šanci. Zákon, který učiní propuštění za zveřejnění informací nezákonným, promění mlčící svědky ve svědky vypovídající." # todo: NEW TRANSLATION
 JAP_financial_revival_program: "Program finanční obnovy" # todo: NEW TRANSLATION
 JAP_financial_revival_program_desc: "Banky samy hodnotí své dlužníky a jejich hodnocení skrývá neschopnost splácet. Program finanční obnovy zavádí hodnocení diskontovaných peněžních toků u každé významné expozice, zpřísňuje limity aktiv vůči kapitálu a zveřejňuje cíl snížit podíl špatných úvěrů na polovinu. Podnikatelské svazy to označí za válku proti průmyslu a nebudou se zcela mýlit." # todo: NEW TRANSLATION
 JAP_special_investigation_unit: "Oddělení zvláštního vyšetřování" # todo: NEW TRANSLATION
 JAP_special_investigation_unit_desc: "Audit přináší zjištění, prokurátor obžalovaného. Oddělení zvláštního vyšetřování tokijského okresního státního zastupitelství už zlomilo ministry kabinetu a je jedinou institucí, se kterou rada keiretsu nemůže potichu uzavřít dohodu. Nyní míří na účetní rozvahy." # todo: NEW TRANSLATION
 JAP_special_investigation_unit_TT: "Maření vyšetřování nyní narůstá o §G25 % pomaleji§!" # todo: NEW TRANSLATION
 JAP_the_lost_decade_ends: "Ztracená dekáda končí" # todo: NEW TRANSLATION
 JAP_the_lost_decade_ends_desc: "Poslední insolventní firmy prošly soudy a rejstřík je uzavřen. Nic nebylo refinancováno, každá ztráta byla odepsána tam, kde vznikla, a úvěry se nyní dostanou jen k firmám, které je dokážou splatit. Ekonomika, jejíž účetní knihy říkají skutečnou pravdu, je jediným základem, na němž lze postavit cokoli dalšího.\n-------------\nTento fokus §Godstraní§! §Y$JAP_zombie_companies$§! a §Y$JAP_liquidation_wave$§!, které přišly s ukončením činnosti." # todo: NEW TRANSLATION
 JAP_controlled_downsize_TT: "Zahájí §Yvlnu likvidací§!: firmy budou rušeny §Gdvojnásobným tempem§! oproti programu fúzí, za cenu §Rsilného národního ducha§! až do dokončení ukončení činnosti" # todo: NEW TRANSLATION
 JAP_forced_mergers_TT: "Zahájí §Yprogram fúzí§!: nyní levný a mírný, s §Rpoloviční rychlostí ukončování činnosti§! a trvalou stopou na japonském průmyslu" # todo: NEW TRANSLATION
 JAP_liquidation_wave: "Vlna likvidací" # todo: NEW TRANSLATION
 JAP_liquidation_wave_desc: "Likvidace probíhá. Oznámení o bankrotech plní hospodářské rubriky, staveniště stojí, zatímco jejich developeři končí, nezaměstnanost prudce roste a vláda si musí půjčovat, aby zmírnila úder. Bolest je silná a soustředěná, ale dočasná.\n-------------\nOdstraněno, jakmile §YPokrok restrukturalizace podniků§! dokončí rušení zombie firem." # todo: NEW TRANSLATION
 JAP_fusion_restructuring: "Administrativní řízení" # todo: NEW TRANSLATION
 JAP_fusion_restructuring_desc: "Ministerstvo vytyčí hranice a banky dodají věno. Nikdo není propuštěn, nikdo nepřizná selhání a dvě obchodní oddělení, která se třicet let nenáviděla, dostanou příkaz, že jsou nyní jedinou společností. Rejstřík se každé čtvrtletí zkracuje. Cena se platí stagnací, nikoli nezaměstnaností.\n-------------\nOdstraněno, jakmile §YPokrok restrukturalizace podniků§! dokončí pohlcování zombie firem." # todo: NEW TRANSLATION
 JAP_consolidated_conglomerates: "Konsolidované Japan Inc." # todo: NEW TRANSLATION
 JAP_consolidated_conglomerates_desc: "Insolventní jména zmizela z rejstříku, pohlcena místo likvidace. Nahradily je větší skupiny s duplicitními továrnami, duplicitními výzkumnými odděleními a manažery, kteří odpovídají radě, jež je koupila proti jejich vůli. Stát získal národní šampiony, o které žádal. Získal také průmyslovou základnu, která inovuje pomaleji než ta, s níž začínal." # todo: NEW TRANSLATION
 JAP_zombie_investigation_category: "Vyšetřování zombie firem" # todo: NEW TRANSLATION
 JAP_zombie_investigation_category_desc: "Auditoři a prokurátoři procházejí účetní knihy japonských insolventních dlužníků a firmy se stejně usilovně snaží jim v tom zabránit.\n\n§YSpisy případů§!: [?JAP_zombie_case_files|0] / 14\n§YMaření§!: [?JAP_zombie_obstruction|0] / 100\n\n§YCo můžete dělat§!\nKaždý níže uvedený případ lze stíhat, potichu zachránit nebo nechat projít. Stíhání vytváří nejsilnější spis a stojí vás nejvíce u §Yprůmyslových konglomerátů§!, jejichž názor ovlivňuje skutečnou produkci. Záchrana vytváří slabší spis na účet daňových poplatníků. Nechat případ projít nevytvoří nic.\n\n§GZpráva§!\nHodnocena po uzavření vyšetřování.\n§G10 či více§! spisů: úplné vypořádání, které urychlí ukončování činnosti.\n§G3 až 9§!: částečná zpráva.\n§RMéně než 3§!: zahlazení, které odstraní shromážděné spisy a zpomalí ukončování činnosti.\n§Y$JAP_controlled_downsize$§! vyžaduje 10 či více spisů. §Y$JAP_forced_mergers$§! vyžaduje 3 či více spisů. Žádná větev nebude nikdy trvale uzavřena, ani pokud bude vyšetřování opuštěno nebo zahlazeno.\n\n§RMaření§!\nRoste každý měsíc, kdy pokračujete v kopání, a rychleji, čím rozzlobenější jsou konglomeráty. Při §R30§! ministerstvo začne vynášet informace, při §R55§! vydá podnikatelský svaz ultimátum a při §R80§! bude vyšetřování kvůli skandálu pozastaveno. Níže uvedená rozhodnutí ho snižují." # todo: NEW TRANSLATION
 JAP_zombie_investigation_mission: "Uzavřít vyšetřování" # todo: NEW TRANSLATION
 JAP_zombie_investigation_mission_desc: "Vyšetřování nemůže pokračovat věčně. Shromážděte dostatečně silný případ ke zveřejnění, než politická vůle vyprchá." # todo: NEW TRANSLATION
 JAP_zombie_investigation_mission_TT: "§YSpisy případů§!: [?JAP_zombie_case_files|0] / 10" # todo: NEW TRANSLATION
 JAP_keidanren_ultimatum_mission: "Ultimátum Keidanrenu" # todo: NEW TRANSLATION
 JAP_keidanren_ultimatum_mission_desc: "Podnikatelský svaz sdělil vládě tím nejzdvořilejším možným jazykem, že vyšetřování poškozuje důvěru a mělo by být ukončeno. Dal nám čas do konce fiskálního pololetí, abychom pochopili náznak." # todo: NEW TRANSLATION
 JAP_keidanren_ultimatum_TT: "Snižte §Ymaření§! pod §Y45§!" # todo: NEW TRANSLATION
 JAP_case_ltcb_shinsei: "Spis případu: Prodejní opce Shinsei" # todo: NEW TRANSLATION
 JAP_case_ltcb_shinsei_desc: "Long-Term Credit Bank byla znárodněna, očištěna na veřejné náklady a prodána zahraniční investiční skupině za symbolickou částku. Smlouva poskytla kupujícímu právo vrátit každý úvěr, který ztratil pětinu své hodnoty, přímo Deposit Insurance Corporation za účetní cenu. Noví vlastníci toto právo uplatňují a celá ztráta dopadá na daňové poplatníky. Tuto klauzuli někdo na ministerstvu podepsal." # todo: NEW TRANSLATION
 JAP_case_sogo_collapse: "Spis případu: Kolaps Sogo" # todo: NEW TRANSLATION
 JAP_case_sogo_collapse_desc: "Obchodní řetězec dluží téměř dva biliony jenů a už několik let nevykázal skutečný zisk. Plán na ministerském stole počítá s odpuštěním veřejné části dluhu a jeho pokračováním v obchodování. Noviny mají tento plán také a reakce veřejnosti na záchranu maloobchodníka, zatímco běžným firmám jsou úvěry odmítány, byla přesně taková, jakou mohl každý předvídat." # todo: NEW TRANSLATION
 JAP_case_mycal_bankruptcy: "Spis případu: Mycal" # todo: NEW TRANSLATION
 JAP_case_mycal_bankruptcy_desc: "Osacká skupina supermarketů se během bubliny rozšířila za peníze, o nichž její hlavní banka nikdy neočekávala, že se vrátí, a od té doby byla refinancována místo restrukturalizace. Pokud selže, půjde o největší maloobchodní bankrot v dějinách země a strhne s sebou řetězec dodavatelů v Kansai." # todo: NEW TRANSLATION
 JAP_case_resona_injection: "Spis případu: Resona" # todo: NEW TRANSLATION
 JAP_case_resona_injection_desc: "Auditoři odmítli potvrdit, jak velkou část kapitálu banky tvoří odložené daňové pohledávky, tedy budoucí zisky, které realisticky nemá šanci vydělat. Bez této fikce je banka podkapitalizovaná. Téměř dva biliony jenů z veřejných peněz by ji ozdravily a fakticky předaly státu. Odmítnutí by znamenalo první velké selhání banky, které vláda připustila." # todo: NEW TRANSLATION
 JAP_case_ashikaga_bank: "Spis případu: Ashikaga Bank" # todo: NEW TRANSLATION
 JAP_case_ashikaga_bank_desc: "Není to národní banka. Je to banka Tochigi, kde má účty prefekturální vláda, většina místních firem a mnoho domácností, které nikdy nepoužily jinou. Je také insolventní. Znárodnění ochrání vkladatele a zničí akcionáře a každý regionální věřitel v zemi si toto rozhodnutí vyloží jako prohlášení záměru." # todo: NEW TRANSLATION
 JAP_case_daiei_ircj: "Spis případu: Daiei" # todo: NEW TRANSLATION
 JAP_case_daiei_ircj_desc: "Maloobchodník, který naučil Japonsko prodávat se slevou, nese dluhy v bilionech a udržují ho při životě banky, které si nemohou dovolit přiznat skutečnou hodnotu úvěrů. Industrial Revitalization Corporation ho může převzít, vyměnit vedení a prodat jednotlivé části. Zakladatelovi spojenci ve straně by dali přednost ještě jednomu refinancování." # todo: NEW TRANSLATION
 JAP_case_kanebo_accounts: "Spis případu: Účetnictví Kanebo" # todo: NEW TRANSLATION
 JAP_case_kanebo_accounts_desc: "Skupina kosmetiky a textilu pět let vykazovala zisky, které nevydělala, v objemu dvou set miliard jenů. O podvodu není sporu. Sporná je účetní firma, která podepsala každý z těchto výkazů, a otázka, zda může mít země poctivé účetní knihy, když její auditoři obchodně odpovídají společnostem, které auditují." # todo: NEW TRANSLATION
 JAP_press_the_prosecutors: "Nechat prokurátory jednat" # todo: NEW TRANSLATION
 JAP_press_the_prosecutors_desc: "Nechte Oddělení zvláštního vyšetřování zatýkat místo předávání případů. Nic neumlčí lobbistickou kampaň rychleji než ředitel odváděný z kanceláře muži se zatykačem." # todo: NEW TRANSLATION
 JAP_whistleblower_immunity_decision: "Udělit informátorům imunitu" # todo: NEW TRANSLATION
 JAP_whistleblower_immunity_decision_desc: "Nabídněte středním manažerům, kteří plnili příkazy, ochranu před stíháním výměnou za svědectví proti mužům, kteří jim je dávali. Konglomeráty to označí za pozvánku ke zradě kolegů. A přesně tím to je." # todo: NEW TRANSLATION
 JAP_publish_inspection_manual_decision: "Zveřejnit výsledky inspekce" # todo: NEW TRANSLATION
 JAP_publish_inspection_manual_decision_desc: "Zveřejněte kontrolní hodnocení v plném znění místo jejich shrnutí pro ministerstvo. Trhy je nebudou rády číst, ale firma nemůže lobbovat proti číslu, které už viděla celá země." # todo: NEW TRANSLATION
 JAP_cooperating_bank_amnesty_decision: "Amnestie pro spolupracující banky" # todo: NEW TRANSLATION
 JAP_cooperating_bank_amnesty_decision_desc: "Nabídněte každé bance, která dobrovolně otevře své účetní knihy, záruku, že její představitelé nebudou stíháni. Kupuje to klid, ale vyšetřování kvůli tomu přijde o případ, který proti nim budovalo." # todo: NEW TRANSLATION
 JAP_zombie_probe_abandoned_TT: "Vyšetřování je §Rodvoláno§! a bude zveřejněno jako zahlazení, čímž se odstraní dosud shromážděné spisy a zpomalí ukončování činnosti" # todo: NEW TRANSLATION
 JAP_zombie_whitewash_penalty_TT: "Zahlazení §Rodstraní spisy případů§! shromážděné dosud a zpomalí ukončování činnosti o §R25 %§!. Žádné z řešení není ztraceno: na zbývajících případech lze stále pracovat" # todo: NEW TRANSLATION
 JAP_zombie_report_strong_TT: "§GÚplné vypořádání.§! Ukončování činnosti bude probíhat o §G25 % rychleji§!" # todo: NEW TRANSLATION
 JAP_zombie_report_partial_TT: "§YČástečná zpráva.§! Ukončování činnosti bude probíhat běžnou rychlostí" # todo: NEW TRANSLATION
 JAP_zombie_report_whitewash_TT: "§RZahlazení.§! Spisy případů budou §Rodstraněny§! a ukončování činnosti bude probíhat o §R25 % pomaleji§!" # todo: NEW TRANSLATION
 Japan_economy.06.c: "Celou věc odvolejte" # todo: NEW TRANSLATION
 Japan_economy.08.b: "Zveřejněte, co máme" # todo: NEW TRANSLATION
 Japan_economy.08.c: "Zveřejněte to a doufejte, že nikdo nebude číst dál než shrnutí" # todo: NEW TRANSLATION
 Japan_economy.09.t: "Únik informací z ministerstva" # todo: NEW TRANSLATION
 Japan_economy.09.d: "Firmy věděly, kteří auditoři přijdou a kterého rána. Kartotéky byly přes víkend vyprázdněny a dva ředitelé jsou náhle nedostupní kvůli služební cestě v zahraničí. Někdo na ministerstvu je varuje a každý v této místnosti dokáže hádat kdo, protože sem byl vyslán z banky, kterou chrání, a po odchodu do důchodu se do ní vrátí." # todo: NEW TRANSLATION
 Japan_economy.09.a: "Přijměte ztrátu a pokračujte" # todo: NEW TRANSLATION
 Japan_economy.09.b: "Najděte ho a udělejte z něj odstrašující příklad" # todo: NEW TRANSLATION
 Japan_economy.10.t: "Svaz vydává ultimátum" # todo: NEW TRANSLATION
 Japan_economy.10.d: "Podnikatelský svaz přišel do Dietu s vlastními čísly: odložené investice, zmrazené nábory, poškozená důvěra, to vše připsané na vrub vyšetřování. Poselství skryté za zdvořilostí není nijak nejasné. Ukončete to, nebo členové tohoto svazu zjistí, že nemohou k ničemu přistoupit, dokud trvá nejistota." # todo: NEW TRANSLATION
 Japan_economy.10.a: "Ať svůj případ předloží veřejnosti." # todo: NEW TRANSLATION
 Japan_economy.11.t: "Prokurátor padá" # todo: NEW TRANSLATION
 Japan_economy.11.d: "Selhalo nikoli vyšetřování, ale vedoucí prokurátor s golfovým členstvím, které nepřiznal, a které mu poskytla firma z jeho vlastního seznamu, a noviny, které mají fotografie, jak ho přijímá. Ministr rezignoval, aby převzal odpovědnost. Vyšetřování je pozastaveno do přezkoumání, což všichni chápou jako čekání na chvíli, kdy veřejnost přestane věnovat pozornost." # todo: NEW TRANSLATION
 Japan_economy.11.a: "Ztratili jsme iniciativu." # todo: NEW TRANSLATION
 Japan_economy.23.t: "Prodejní opce Shinsei" # todo: NEW TRANSLATION
 Japan_economy.23.d: "Klauzule je přesně taková, jak bylo uvedeno. Každý úvěr, o němž kupující usoudí, že ztratil pětinu své hodnoty, se vrátí Deposit Insurance Corporation za účetní cenu a stát absorbuje rozdíl. Banka neudělala nic nezákonného. Přečetla smlouvu pozorněji než úředníci, kteří ji sepsali, a tito úředníci stále sedí u svých stolů." # todo: NEW TRANSLATION
 Japan_economy.23.a: "Zveřejněte smlouvu a uveďte, kdo ji podepsal" # todo: NEW TRANSLATION
 Japan_economy.23.b: "Potichu znovu vyjednejte a klauzuli vykupte" # todo: NEW TRANSLATION
 Japan_economy.23.c: "Prodej je uzavřen. Nechte to být." # todo: NEW TRANSLATION
 Japan_economy.24.t: "Kolaps Sogo" # todo: NEW TRANSLATION
 Japan_economy.24.d: "Řetězec nelze zachránit a každý, kdo radí ministrovi, to ví. Jedinou otázkou je, zda bude zrušen u soudu, kde budou veřejně jmenováni věřitelé i úředníci, kteří jim ustupovali, nebo restrukturalizován za zavřenými dveřmi s tichým odpuštěním veřejné části dluhu." # todo: NEW TRANSLATION
 Japan_economy.24.a: "Nechte ho zkrachovat před otevřeným soudem" # todo: NEW TRANSLATION
 Japan_economy.24.b: "Restrukturalizujte ho mimo titulní stránky" # todo: NEW TRANSLATION
 Japan_economy.24.c: "Odpusťte dluh a pokračujte" # todo: NEW TRANSLATION
 Japan_economy.25.t: "Mycal" # todo: NEW TRANSLATION
 Japan_economy.25.d: "Hlavní banka skupinu refinancovala každý rok od konce bubliny a nyní ministerstvu oznámila, že to už znovu neudělá. Dodavatelé z Kansai, kteří nikdy neobchodovali s nikým jiným, už volají na prefekturální úřady. Ať bude tento týden rozhodnuto jakkoli, celý region to pochopí jako prohlášení o tom, zda stará uspořádání stále platí." # todo: NEW TRANSLATION
 Japan_economy.25.a: "Nechte ji padnout a prověřte banku, která ji nesla" # todo: NEW TRANSLATION
 Japan_economy.25.b: "Zařiďte řádný prodej ziskových obchodů" # todo: NEW TRANSLATION
 Japan_economy.25.c: "Přitlačte na banku ještě na jeden rok" # todo: NEW TRANSLATION
 Japan_economy.26.t: "Resona" # todo: NEW TRANSLATION
 Japan_economy.26.d: "Odečtěte odložené daňové pohledávky a kapitálový poměr se zhroutí. Auditoři odmítají podepsat, což je samo o sobě bezprecedentní, a vláda má dny, nikoli týdny. Dva biliony jenů banku ozdraví a učiní z jejího vlastníka stát. Odmítnutí znamená první velké selhání banky, které země od války připustila, a nikdo nemůže říct, kde se to zastaví." # todo: NEW TRANSLATION
 Japan_economy.26.a: "Vložte prostředky a odvolejte celou radu" # todo: NEW TRANSLATION
 Japan_economy.26.b: "Vložte prostředky a ponechte vedení" # todo: NEW TRANSLATION
 Japan_economy.26.c: "Nechte auditory přesvědčit" # todo: NEW TRANSLATION
 Japan_economy.27.t: "Ashikaga Bank" # todo: NEW TRANSLATION
 Japan_economy.27.d: "Vláda prefektury, její firmy a mnoho domácností nemají účet nikde jinde. Zjištění kontrolorů je jednoznačné: banka je insolventní a už nějakou dobu byla. Dočasné znárodnění ochrání každého vkladatele a vymaže každého akcionáře, z nichž mnohé jsou místní společnosti, které musely držet akcie jako podmínku vlastního úvěru." # todo: NEW TRANSLATION
 Japan_economy.27.a: "Znárodněte ji a odepište akcionáře na nulu" # todo: NEW TRANSLATION
 Japan_economy.27.b: "Rekapitalizujte ji a ponechte v soukromých rukou" # todo: NEW TRANSLATION
 Japan_economy.27.c: "Nechte prefekturu zařídit záchrannou fúzi" # todo: NEW TRANSLATION
 Japan_economy.28.t: "Daiei" # todo: NEW TRANSLATION
 Japan_economy.28.d: "Revitalizační korporace je připravena ji převzít, vyměnit radu a prodat, co lze prodat. Zakladatel vybudoval tuto společnost z trosek války a má ve straně přátele, kteří si to pamatují. Žádají ještě jedno refinancování a žádají hlasitě." # todo: NEW TRANSLATION
 Japan_economy.28.a: "Předejte ji Revitalizační korporaci" # todo: NEW TRANSLATION
 Japan_economy.28.b: "Podpořte vyjednanou restrukturalizaci" # todo: NEW TRANSLATION
 Japan_economy.28.c: "Schvalte refinancování" # todo: NEW TRANSLATION
 Japan_economy.29.t: "Účetnictví Kanebo" # todo: NEW TRANSLATION
 Japan_economy.29.d: "Dvě stě miliard jenů zisku, který nikdy nebyl vydělán, vykázaného během pěti let a pokaždé schváleného stejnou účetní firmou. Stíhání společnosti je snadné. Stíhání jejích auditorů by každé účetní firmě v Japonsku ukázalo, že podpis je závazkem, nikoli formalitou, a přimělo by mnoho dalších výkazů k novému přečtení." # todo: NEW TRANSLATION
 Japan_economy.29.a: "Stíhejte společnost a suspendujte její auditory" # todo: NEW TRANSLATION
 Japan_economy.29.b: "Vyřaďte společnost z burzy a nechte auditory se vypořádat" # todo: NEW TRANSLATION
 Japan_economy.29.c: "Považujte to za izolované selhání" # todo: NEW TRANSLATION
 Japan_economy.30.t: "Svaz ustupuje" # todo: NEW TRANSLATION
 Japan_economy.30.d: "Tlak polevil. Svaz své námitky nestáhl, ale přestal vystupovat proti vyšetřování a nejhlasitější členové ztichli. Není to souhlas. Je to úsudek, že boj už nestojí za náklady, které jim přináší." # todo: NEW TRANSLATION
 Japan_economy.30.a: "Využijeme klid, dokud trvá." # todo: NEW TRANSLATION
 Japan_economy.31.t: "Svaz plní svou hrozbu" # todo: NEW TRANSLATION
 Japan_economy.31.d: "Investiční plány členských společností byly odloženy a každá z nich uvádí nejistotu. Dnešní zmrazení náborů je prezentováno jako obezřetnost. Poselství je nezaměnitelné a má takové být, přičemž neexistuje zákon, který by společnost přinutil investovat." # todo: NEW TRANSLATION
 Japan_economy.31.a: "Vyjádřili svůj názor." # todo: NEW TRANSLATION
 Japan_economy.33.t: "Vyšetřování pokračuje" # todo: NEW TRANSLATION
 Japan_economy.33.d: "Přezkum našel to, co přezkumy nacházejí. Byl jmenován nový vedoucí, spisy byly vráceny a vyšetřování pokračuje s větrem poněkud více proti němu než dříve. Firmy měly šest měsíců na přípravu a využily je." # todo: NEW TRANSLATION
 Japan_economy.33.a: "Začněte znovu." # todo: NEW TRANSLATION
 Japan_economy.34.t: "Rejstřík je čistý" # todo: NEW TRANSLATION
 Japan_economy.34.d: "Poslední insolventní dlužník byl zrušen. Trvalo to roky a cena byla zaplacena bankroty, nezaměstnaností a vládou, která utratila většinu svého politického kapitálu přesvědčováním, že bolest je nutná. Zůstala ekonomika, v níž úvěry dostávají firmy, které je dokážou splatit, a v níž rozvaha znamená to, co říká." # todo: NEW TRANSLATION
 Japan_economy.34.a: "Stálo to za tu cenu." # todo: NEW TRANSLATION
 Japan_economy.35.t: "Nic neselhalo" # todo: NEW TRANSLATION
 Japan_economy.35.d: "Insolventní jména zmizela z rejstříku. Žádná z nich nezbankrotovala. Byla pohlcena většími skupinami na základě dohody ministerstva a tyto skupiny nyní nesou duplicitní závody, duplicitní laboratoře a zaměstnance, kterým bylo v pátek oznámeno, že v pondělí pracují pro konkurenta. Žádná pracovní místa nebyla ztracena a nic nebylo přiznáno. Japonský průmysl je konsolidovaný, stabilní a pomalejší než dříve." # todo: NEW TRANSLATION
 Japan_economy.35.a: "Dohoda vydržela." # todo: NEW TRANSLATION
 JAP_electronics.300.t: "Vzniká Sony Ericsson" # todo: NEW TRANSLATION
 JAP_electronics.300.d_agreed: "Ericsson souhlasil se spojením svého podnikání s mobilními telefony s podnikáním Sony. Žádná ze společností sama neprodává dost telefonů, aby se mohla měřit s Nokií a Motorolou, společně by však v jednom podniku spojily švédské rádiové inženýrství a japonský spotřebitelský design. Sony se k tomu může zavázat, nebo ponechat mobilní divizi uvnitř skupiny a pokračovat sama." # todo: NEW TRANSLATION
 JAP_electronics.300.d_alone: "Švédský výrobce telefonů, s nímž Sony doufala spolupracovat, se vydal jinou cestou. Sony stále může vybudovat mobilní podnik za dostupných podmínek, nebo ponechat telefony uvnitř skupiny a smířit se s menším podílem na trhu, který nevede." # todo: NEW TRANSLATION
 JAP_electronics.300.a: "Zavázat se k mobilnímu společnému podniku" # todo: NEW TRANSLATION
 JAP_electronics.300.b: "Ponechat mobilní divizi uvnitř skupiny" # todo: NEW TRANSLATION
 JAP_electronics.301.t: "Dilema digitální hudby" # todo: NEW TRANSLATION
 JAP_electronics.301.d: "Sony vlastní hardware, který hudbu přehrává, i katalog, který jej plní, a tyto dvě poloviny chtějí opak. Ochrana katalogu znamená přehrávače, které odmítají formáty, jež posluchači už používají. Otevření přehrávačů znamená, že nahrávací divize bude sledovat, jak její vlastní zařízení přehrávají soubory jiných lidí." # todo: NEW TRANSLATION
 JAP_electronics.301.a: "Chránit katalog vlastními formáty" # todo: NEW TRANSLATION
 JAP_electronics.301.b: "Otevřít přehrávače tomu, co lidé už vlastní" # todo: NEW TRANSLATION
 JAP_electronics.302.t: "Sázka na PlayStation 3" # todo: NEW TRANSLATION
 JAP_electronics.302.d: "PlayStation 3 lze postavit na Cellu, procesoru, který Sony od nuly navrhlo s IBM a Toshibou, který se obtížně programuje a nepodobá se ničemu jinému v odvětví. Konzole by se pak léta prodávala pod cenou v naději, že software ji dožene. Nebo ji lze postavit způsobem, jakým Microsoft postavil Xbox 360, a uvést ji dříve za nižší cenu." # todo: NEW TRANSLATION
 JAP_electronics.302.a: "Postavit stroj na nové architektuře" # todo: NEW TRANSLATION
 JAP_electronics.302.b: "Postavit konvenční konzoli a uvést ji dříve" # todo: NEW TRANSLATION
 JAP_electronics.303.t: "Jedna Sony" # todo: NEW TRANSLATION
 JAP_electronics.303.d: "Divize Sony se po desetiletí řídily samy a je to vidět na produktech, které spolu nefungují, i na stejném inženýrství provedeném čtyřikrát. Podřídit je jediné strategii znamená přehlasovat lidi, kteří už dříve měli pravdu. Ponechat je o samotě zachová to, co vybudovala nezávislost." # todo: NEW TRANSLATION
 JAP_electronics.303.a: "Podřídit divize jediné strategii" # todo: NEW TRANSLATION
 JAP_electronics.303.b: "Ponechat divizím nezávislost" # todo: NEW TRANSLATION
 JAP_electronics.304.t: "Obrat k obrazovým snímačům" # todo: NEW TRANSLATION
 JAP_electronics.304.d: "Obrazové snímače Sony se nacházejí uvnitř telefonů společností, kterým Sony konkuruje, a poptávka roste rychleji, než ji továrny dokážou uspokojit. Udělat ze snímačů středobod společnosti znamená kapitál, který byl přislíben spotřebitelským divizím. Neudělat to znamená přenechat náskok tomu, kdo kapacitu vybuduje jako první." # todo: NEW TRANSLATION
 JAP_electronics.304.a: "Učinit obrazové snímače středem společnosti" # todo: NEW TRANSLATION
 JAP_electronics.304.b: "Ponechat kapitál ve spotřebitelských produktech" # todo: NEW TRANSLATION
 JAP_electronics.305.t: "Čím se Sony stala" # todo: NEW TRANSLATION
 JAP_electronics.305.d: "Čtvrt století podniků, formátů, architektur a restrukturalizací rozhodlo, čím Sony je a k čemu slouží japonská spotřební elektronika. Společnost, která kdysi prodávala výrobky, nyní dodává součástky uvnitř výrobků všech ostatních." # todo: NEW TRANSLATION
 JAP_electronics.305.a: "Jedna společnost napříč hardwarem, obsahem a službami" # todo: NEW TRANSLATION
 JAP_electronics.305.b: "Federace hardwarových podniků" # todo: NEW TRANSLATION
 JAP_electronics.305.c: "Suverénní výpočetní architektura" # todo: NEW TRANSLATION
 JAP_electronics.305.e: "Otevřené digitální společenství" # todo: NEW TRANSLATION
 JAP_sony_one_sony_ecosystem: "Jedna Sony" # todo: NEW TRANSLATION
 JAP_sony_one_sony_ecosystem_desc: "Divize odpovídají jediné strategii a snímače, katalog, konzole i služby byly vybudovány tak, aby se navzájem posilovaly, nikoli soupeřily o stejný rozpočet. Koordinace něco stojí na rychlosti a vrací se ve všem, co je dodáváno jako jediný celek." # todo: NEW TRANSLATION
 JAP_sony_hardware_federation: "Hardwarová federace" # todo: NEW TRANSLATION
 JAP_sony_hardware_federation_desc: "Divize si zachovaly nezávislost a každá se stala ve své práci impozantní. Nic, co Sony vyrábí, není navrženo s ohledem na zbytek Sony a každá část je velmi dobrá." # todo: NEW TRANSLATION
 JAP_sony_cell_sovereign_compute: "Suverénní výpočetní architektura" # todo: NEW TRANSLATION
 JAP_sony_cell_sovereign_compute_desc: "Japonsko vybudovalo vlastní procesorovou architekturu a zaplatilo za ni jednou generací konzole. To, co se odvětví naučilo při jejím programování, přežilo stroj, který ji nesl." # todo: NEW TRANSLATION
 JAP_sony_open_digital_commonwealth: "Otevřené digitální společenství" # todo: NEW TRANSLATION
 JAP_sony_open_digital_commonwealth_desc: "Formáty se otevřely, katalog putoval a hardware se přestal hádat s tím, co lidé už vlastnili. Sony vydělává méně na zařízení a její produkty má v rukou mnohem více lidí." # todo: NEW TRANSLATION
 JAP_electronics.310.t: "Dvě obrazovky, dva stroje" # todo: NEW TRANSLATION
 JAP_electronics.310.d: "Game Boy Advance a GameCube od Nintenda mají oddělené týmy, oddělené architektury a oddělené knihovny a každá hra musí být vytvořena pro jednu, nebo druhou platformu. Zachování obou znamená financovat dvě platformy z jediné společnosti. Jejich sloučení by ukončilo podnikání s kapesními konzolemi, které financuje vše ostatní." # todo: NEW TRANSLATION
 JAP_electronics.310.a: "Financovat kapesní konzoli i konzoli" # todo: NEW TRANSLATION
 JAP_electronics.310.b: "Soustředit vše na jedinou platformu" # todo: NEW TRANSLATION
 JAP_electronics.311.t: "Wii a širší publikum" # todo: NEW TRANSLATION
 JAP_electronics.311.d: "Další konzole Nintenda může usilovat o lidi, kteří konzole nekupují, s levnějším hardwarem, ovládáním, které dosud nikdo neuvedl, a bez grafického výkonu, který tisk měří. Nebo se může utkat se Sony a Microsoftem podle podmínek, na nichž se odvětví už shoduje, a nechat se jimi hodnotit." # todo: NEW TRANSLATION
 JAP_electronics.311.a: "Stavět pro lidi, kteří konzole nekupují" # todo: NEW TRANSLATION
 JAP_electronics.311.b: "Soutěžit výkonem" # todo: NEW TRANSLATION
 JAP_electronics.312.t: "Wii U nelze vysvětlit" # todo: NEW TRANSLATION
 JAP_electronics.312.d: "Nová konzole se prodává tak špatně, že vyvolává otázku, kterou nikdo nechce položit: zda by Nintendo vůbec mělo vyrábět hardware. Jeho software by se prodával na jakémkoli stroji a ztráty by ustaly. Setrvat u hardwaru znamená financovat další generaci na základě toho, že ta poslední selhala." # todo: NEW TRANSLATION
 JAP_electronics.312.a: "Zůstat u hardwaru a financovat další generaci" # todo: NEW TRANSLATION
 JAP_electronics.312.b: "Opustit hardware a nabídnout hry všude" # todo: NEW TRANSLATION
 JAP_electronics.313.t: "Nintendo a telefon" # todo: NEW TRANSLATION
 JAP_electronics.313.d: "Postavy Nintenda mají větší cenu než jeho hardware a mohl by je nést každý telefon na světě. Poskytnutí licence vydělá peníze od publika, k němuž se konzole nikdy nedostanou. Odmítnutí je ponechá výhradně na strojích ovládaných Nintendem, což je důvod, proč si tyto stroje vůbec někdo kupuje." # todo: NEW TRANSLATION
 JAP_electronics.313.a: "Poskytnout licenci na postavy pro mobilní zařízení" # todo: NEW TRANSLATION
 JAP_electronics.313.b: "Ponechat je výhradně na našem hardwaru" # todo: NEW TRANSLATION
 JAP_electronics.314.t: "Switch" # todo: NEW TRANSLATION
 JAP_electronics.314.d: "Jeden stroj, který je zároveň kapesní konzolí i konzolí, by ukončil rozdělení, jež dvě desetiletí dělilo inženýrství společnosti, a znamená jednu knihovnu, jeden tým a jedno selhání, pokud nebude fungovat. Udržování oddělených řad je to, co Nintendo umí." # todo: NEW TRANSLATION
 JAP_electronics.314.a: "Postavit jeden stroj, který bude obojím" # todo: NEW TRANSLATION
 JAP_electronics.314.b: "Ponechat kapesní konzoli a konzoli oddělené" # todo: NEW TRANSLATION
 JAP_electronics.315.t: "Čím se Nintendo stalo" # todo: NEW TRANSLATION
 JAP_electronics.315.d: "Čtvrt století hardwaru, který by nikdo jiný nepostavil, rozhodlo, čím Nintendo je a jak velká část japonské zábavy jím prochází. Postavy přežily každý stroj, který je nesl." # todo: NEW TRANSLATION
 JAP_electronics.315.a: "Disciplinovaná hybridní platforma" # todo: NEW TRANSLATION
 JAP_electronics.315.b: "Integrovaný zábavní ekosystém" # todo: NEW TRANSLATION
 JAP_electronics.315.c: "Globální poskytovatel licencí na postavy" # todo: NEW TRANSLATION
 JAP_electronics.315.e: "Otevřené vývojářské společenství" # todo: NEW TRANSLATION
 JAP_nintendo_disciplined_hybrid_platform: "Disciplinovaná hybridní platforma" # todo: NEW TRANSLATION
 JAP_nintendo_disciplined_hybrid_platform_desc: "Jeden stroj, jedna knihovna a jedna inženýrská organizace za obojím. Nintendo přestalo soutěžit ve specifikacích, které inzerují všichni ostatní, a začalo dodávat hardware, jehož výroba stojí méně, než za kolik se prodává." # todo: NEW TRANSLATION
 JAP_nintendo_integrated_entertainment_ecosystem: "Integrovaný zábavní ekosystém" # todo: NEW TRANSLATION
 JAP_nintendo_integrated_entertainment_ecosystem_desc: "Postavy procházejí parky, filmy a zbožím stejně jako stroji a každá část prodává ty ostatní. Japonský export zábavy spočívá na značkách, které stále zcela vlastní jediná společnost." # todo: NEW TRANSLATION
 JAP_nintendo_global_ip_licensor: "Globální poskytovatel licencí" # todo: NEW TRANSLATION
 JAP_nintendo_global_ip_licensor_desc: "Hardware se stal jedním distribučním kanálem z mnoha. Nintendo vydělává na postavách, které se objevují na strojích, jež nevyrábí, na trzích, kam se jeho konzole nikdy nedostaly." # todo: NEW TRANSLATION
 JAP_nintendo_open_developer_commonwealth: "Otevřené vývojářské společenství" # todo: NEW TRANSLATION
 JAP_nintendo_open_developer_commonwealth_desc: "Platforma se otevřela vývojářům za podmínek, které nevyžadují předchozí povolení. Nintendo získává menší podíl z mnohem většího katalogu a stroje nesou díla, jejichž vytvoření by nikdy neobjednalo." # todo: NEW TRANSLATION
 JAP_electronics.320.t: "Kolik stojí Metal Gear" # todo: NEW TRANSLATION
 JAP_electronics.320.d: "Konami uvedlo Metal Gear Solid 2 a Silent Hill 2 ve stejném roce, s rozpočty ospravedlnitelnými jen hitem, z týmů vybudovaných kolem jednotlivých režisérů. Sportovní a karetní řady vydělávají stabilně a žádného autora vůbec nepotřebují. Financovat obojí je to, co si společnost už nemůže dovolit." # todo: NEW TRANSLATION
 JAP_electronics.320.a: "Financovat týmy vedené režiséry" # todo: NEW TRANSLATION
 JAP_electronics.320.b: "Financovat každoroční sportovní a karetní řady" # todo: NEW TRANSLATION
 JAP_electronics.321.t: "Automaty vydělávají více než disky" # todo: NEW TRANSLATION
 JAP_electronics.321.d: "Konami může převzít Hudson Soft a expandovat do pachislotu a arkádových automatů, kde jeden stroj v herně vydělá za rok více než konzolový titul za celý svůj život. Továrny a prostor heren jsou v Japonsku skutečnými aktivy. Zůstat vydavatelem softwaru udrží společnost mimo podnikání, kterého si herní tisk neváží." # todo: NEW TRANSLATION
 JAP_electronics.321.a: "Vstoupit do podnikání s herními stroji" # todo: NEW TRANSLATION
 JAP_electronics.321.b: "Zůstat vydavatelem softwaru" # todo: NEW TRANSLATION
 JAP_electronics.322.t: "Dragon Collection" # todo: NEW TRANSLATION
 JAP_electronics.322.d: "Karetní hra Konami na GREE vydělává na jednoho vývojáře více než kterýkoli konzolový tým v budově a její výroba trvala měsíce, nikoli roky. Přesun studií k sociálním a mobilním platformám následuje peníze. Zachování financování konzolových týmů znamená platit dlouhé projekty z krátkých." # todo: NEW TRANSLATION
 JAP_electronics.322.a: "Přesunout vývoj na sociální a mobilní platformy" # todo: NEW TRANSLATION
 JAP_electronics.322.b: "Ponechat financování konzolových týmů" # todo: NEW TRANSLATION
 JAP_electronics.323.t: "Kojima odchází" # todo: NEW TRANSLATION
 JAP_electronics.323.d: "Konami dokončilo Metal Gear Solid V, zrušilo Silent Hills a může rozpustit studio, které vytvořilo obojí, a odstranit jméno režiséra z obalu. Prezident už veřejně řekl, že budoucnost podnikání spočívá v mobilních zařízeních. Ponechat studio znamená financovat producenta, který stojí více, než divize vydělává." # todo: NEW TRANSLATION
 JAP_electronics.323.a: "Rozpustit studio a odstranit uvedení autora" # todo: NEW TRANSLATION
 JAP_electronics.323.b: "Ponechat studio i uvedení autora" # todo: NEW TRANSLATION
 JAP_electronics.324.t: "eFootball" # todo: NEW TRANSLATION
 JAP_electronics.324.d: "Konami přestavělo Pro Evolution Soccer na bezplatnou službu a vydalo ji ve stavu, který vlastní hráči hodnotili hůře než cokoli jiného na platformě. Zadní katalog Silent Hill, Metal Gear a Castlevania leží nevyužitý a jeho předělání stojí skutečné peníze. Provozování služeb a fitness klubů vydělává bez tohoto rizika." # todo: NEW TRANSLATION
 JAP_electronics.324.a: "Znovu financovat zadní katalog" # todo: NEW TRANSLATION
 JAP_electronics.324.b: "Provozovat služby a kluby" # todo: NEW TRANSLATION
 JAP_electronics.325.t: "Čím se Konami stalo" # todo: NEW TRANSLATION
 JAP_electronics.325.d: "Pětadvacet let volby mezi režiséry, automaty a telefony rozhodlo, čím Konami je a co znamená japonský export zábavy." # todo: NEW TRANSLATION
 JAP_electronics.325.a: "Obnovená vývojářská studia" # todo: NEW TRANSLATION
 JAP_electronics.325.b: "Vydavatel předělávek a obnov" # todo: NEW TRANSLATION
 JAP_electronics.325.c: "Provozovatel zábavy a fitness" # todo: NEW TRANSLATION
 JAP_electronics.325.e: "Mobilní licenční podnik" # todo: NEW TRANSLATION
 JAP_konami_restored_development_houses: "Obnovená vývojářská studia" # todo: NEW TRANSLATION
 JAP_konami_restored_development_houses_desc: "Konami znovu financuje režiséry a vydává hry, které chtějí vytvořit. Stojí to více než kdy stál mobilní podnik a právě proto zná toto jméno někdo i mimo Japonsko." # todo: NEW TRANSLATION
 JAP_konami_remake_publisher: "Vydavatel předělávek a obnov" # todo: NEW TRANSLATION
 JAP_konami_remake_publisher_desc: "Konami znovu vytváří to, co už vlastní, pro lidi, kteří to hráli poprvé. Katalog je konečný a publikum zatím tak docela ne." # todo: NEW TRANSLATION
 JAP_konami_amusement_fitness_operator: "Provozovatel zábavy a fitness" # todo: NEW TRANSLATION
 JAP_konami_amusement_fitness_operator_desc: "Pachislotové automaty, arkádové herny a největší řetězec fitness klubů v Japonsku, to vše vybudované na majetku a strojích, které Konami zcela vlastní. Hry jsou licenčním oddělením fyzického podnikání." # todo: NEW TRANSLATION
 JAP_konami_mobile_licensing: "Mobilní licenční podnik" # todo: NEW TRANSLATION
 JAP_konami_mobile_licensing_desc: "Konami pronajímá Yu-Gi-Oh!, Metal Gear a Silent Hill každému, kdo je bude vyvíjet, a vybírá poplatky podle podmínek. Nic nevzniká interně a nic takového není potřeba." # todo: NEW TRANSLATION
 JAP_electronics.330.t: "Modemy zdarma na nároží" # todo: NEW TRANSLATION
 JAP_electronics.330.d: "SoftBank může na tokijských nárožích rozdávat modemy Yahoo! BB a prodávat širokopásmové připojení pod cenou, dokud se sevření NTT nad místní smyčkou neuvolní. Masayoshi Son očekává, že na každém předplatiteli bude roky prodělávat. Přeprodej linek NTT s marží je okamžitě ziskový a monopol ponechá přesně tam, kde je." # todo: NEW TRANSLATION
 JAP_electronics.330.a: "Rozdávat modemy a nést ztráty" # todo: NEW TRANSLATION
 JAP_electronics.330.b: "Přeprodávat linky dominantního operátora" # todo: NEW TRANSLATION
 JAP_electronics.331.t: "Vodafone Japan" # todo: NEW TRANSLATION
 JAP_electronics.331.d: "Vodafone prodá svou japonskou síť za 1,75 bilionu jenů a SoftBank si může půjčit téměř celou částku, což by znamenalo největší zadlužené převzetí, jaké Japonsko zažilo. Kupuje národní mobilní síť i její předplatitele. Dluh je zajištěn podnikem, který SoftBank nikdy neprovozovala." # todo: NEW TRANSLATION
 JAP_electronics.331.a: "Půjčit si proti síti a koupit ji" # todo: NEW TRANSLATION
 JAP_electronics.331.b: "Držet se mimo mobilní sektor" # todo: NEW TRANSLATION
 JAP_electronics.332.t: "Sprint" # todo: NEW TRANSLATION
 JAP_electronics.332.d: "SoftBank může zaplatit 21,6 miliardy dolarů za Sprint, třetího amerického operátora, a zdědit přestavbu sítě, jejíž náklady nikdo řádně nespočítal. Poprvé v takovém měřítku by japonská společnost vstoupila na americký trh. Stejný kapitál investovaný doma se násobí na síti, kterou SoftBank už provozuje." # todo: NEW TRANSLATION
 JAP_electronics.332.a: "Koupit amerického operátora" # todo: NEW TRANSLATION
 JAP_electronics.332.b: "Znovu investovat doma" # todo: NEW TRANSLATION
 JAP_electronics.333.t: "Sto miliard dolarů" # todo: NEW TRANSLATION
 JAP_electronics.333.d: "SoftBank může získat sto miliard dolarů, většinu z nich od saúdského veřejného investičního fondu, a vystavovat šeky, jaké nikdy předtím žádný fond rizikového kapitálu nevystavil. Vision Fund by učinil z Masayoshiho Sona největšího technologického investora na světě. Investování z vlastní rozvahy je pomalejší, menší a nikomu v Rijádu se nezodpovídá." # todo: NEW TRANSLATION
 JAP_electronics.333.a: "Získat fond z peněz Perského zálivu" # todo: NEW TRANSLATION
 JAP_electronics.333.b: "Investovat z vlastní rozvahy" # todo: NEW TRANSLATION
 JAP_electronics.334.t: "WeWork" # todo: NEW TRANSLATION
 JAP_electronics.334.d: "Uvedení WeWorku na burzu se cestou na trh zhroutilo a SoftBank v něm drží největší podíl. Záchrana společnosti znamená odepsat miliardy a sdělit akcionářům, že úsudek byl chybný. Nechat ji selhat ochrání vše ostatní, co SoftBank podpořila, a potvrdí každou pochybnost o tom, jak byly tyto sázky vybrány." # todo: NEW TRANSLATION
 JAP_electronics.334.a: "Zachránit ji a provést odpis" # todo: NEW TRANSLATION
 JAP_electronics.334.b: "Nechat ji selhat a ochránit zbytek" # todo: NEW TRANSLATION
 JAP_electronics.335.t: "Čím se SoftBank stala" # todo: NEW TRANSLATION
 JAP_electronics.335.d: "Čtvrt století půjčování proti sítím a sázení výnosů na společnosti jiných rozhodlo, čím SoftBank je a jak japonský kapitál dosahuje zbytku světa." # todo: NEW TRANSLATION
 JAP_electronics.335.a: "Globální technologická holdingová společnost" # todo: NEW TRANSLATION
 JAP_electronics.335.b: "Upisovatel rizikového kapitálu" # todo: NEW TRANSLATION
 JAP_electronics.335.c: "Domácí skupina operátorů" # todo: NEW TRANSLATION
 JAP_electronics.335.e: "Přeprodejce širokopásmového připojení" # todo: NEW TRANSLATION
 JAP_softbank_global_technology_holding: "Globální technologická holdingová společnost" # todo: NEW TRANSLATION
 JAP_softbank_global_technology_holding_desc: "SoftBank vlastní operátory na dvou kontinentech a menšinové podíly v několika stovkách společností, které neřídí. Její hodnota závisí na tom, jak trh v tomto čtvrtletí oceňuje tyto podíly." # todo: NEW TRANSLATION
 JAP_softbank_venture_underwriter: "Upisovatel rizikového kapitálu" # todo: NEW TRANSLATION
 JAP_softbank_venture_underwriter_desc: "SoftBank vystaví šek, který nikdo jiný vystavit nechce, a převezme místo v radě, které s ním přichází. Výnosy přicházejí nerovnoměrně a ztráty najednou." # todo: NEW TRANSLATION
 JAP_softbank_domestic_carrier_group: "Domácí skupina operátorů" # todo: NEW TRANSLATION
 JAP_softbank_domestic_carrier_group_desc: "Optická vlákna, frekvence a ústředny napříč Japonskem, koupené na dluh a splácené z předplatného. SoftBank vlastní infrastrukturu, nikoli podíl v někom, kdo ji vlastní." # todo: NEW TRANSLATION
 JAP_softbank_broadband_reseller: "Přeprodejce širokopásmového připojení" # todo: NEW TRANSLATION
 JAP_softbank_broadband_reseller_desc: "SoftBank prodává přístup k linkám, které patří dominantnímu operátorovi, a soutěží pouze cenou. Marže je nízká a tento podnik nikdy nepotřeboval záchranu." # todo: NEW TRANSLATION
