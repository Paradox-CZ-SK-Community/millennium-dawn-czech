 JAP_zombie_case_choice_TT: "Případ vyvrcholí za §Y60 dní§! a vy si zvolíte:\n§GStíhat§!: §G+2 spisy případů§!, §R+8 maření§! a konglomeráty si to zapamatují\n§YTichá záchrana§!: §G+1 spis případu§!, §R+2 maření§!, hrazené ze státní pokladny\n§RNechat projít§!: žádný spis případu, §G-3 maření§! a firmy budou uklidněny" # todo: NEW TRANSLATION
