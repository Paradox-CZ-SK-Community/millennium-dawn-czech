 JAP_jsw_steel_modifier_desc: "Každá zakázka zadaná společnosti Japan Steel Works je zakázkou pro Muroran. Pece, v nichž se odlévají hlavně a pancéřové pláty, jsou tytéž pece, které zásobují loděnice, stavební firmy a výrobce automobilů, a každá smlouva, která je udržuje na plné kapacitě, činí zemi méně závislou na dovážených polotovarech. To, co obranný rozpočet nakupuje v podobě oceli pro děla, získává širší ekonomika v podobě tonáže." # todo: NEW TRANSLATION
