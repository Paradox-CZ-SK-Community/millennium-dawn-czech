 JAP_tokyo_startup_special_zone: "Tokijská zvláštní startupová zóna" # todo: NEW TRANSLATION
 JAP_tokyo_startup_special_zone_desc: "Soustředíme deregulaci, podporu podnikání a investiční pobídky v metropolitní oblasti Tokia, abychom podpořili vznik startupů a jejich komercializaci." # todo: NEW TRANSLATION
 JAP_tokyo_startup_special_zone_idea: "Tokijská zvláštní startupová zóna" # todo: NEW TRANSLATION
 JAP_tokyo_startup_special_zone_idea_desc: "Tokio bylo určeno jako zvláštní zóna regulační reformy na podporu startupů, rizikového kapitálu a vzniku nových podniků. Soustředěním deregulace, přístupu k investicím a podpory komercializace v oblasti hlavního města chce vláda proměnit omezenou reformu ve viditelný motor růstu." # todo: NEW TRANSLATION
 JAP_kansai_medical_special_zone: "Kansaiská zóna lékařských inovací" # todo: NEW TRANSLATION
 JAP_kansai_medical_special_zone_desc: "V Kansai vytvoříme zvláštní zónu pro inovace v medicíně, péči a biologických vědách a urychlíme soukromé investice i praktické zavádění." # todo: NEW TRANSLATION
 JAP_kansai_medical_special_zone_idea: "Kansaiská zóna lékařských inovací" # todo: NEW TRANSLATION
 JAP_kansai_medical_special_zone_idea_desc: "Kansai je rozvíjeno jako zvláštní zóna pro inovace v medicíně, péči a biologických vědách prostřednictvím regulační flexibility a cílených investic." # todo: NEW TRANSLATION
 JAP_kyushu_logistics_special_zone: "Kjúšúská zvláštní logistická a přístavní zóna" # todo: NEW TRANSLATION
 JAP_kyushu_logistics_special_zone_desc: "Zjednodušíme logistické a přístavní postupy na Kjúšú, posílíme obchodní toky a zlepšíme efektivitu regionálního průmyslu." # todo: NEW TRANSLATION
 JAP_kyushu_logistics_special_zone_idea: "Kjúšúská zvláštní logistická a přístavní zóna" # todo: NEW TRANSLATION
 JAP_kyushu_logistics_special_zone_idea_desc: "Kjúšú bylo určeno jako zóna logistické a přístavní reformy s cílem zlepšit efektivitu obchodu a regionální propojení. Zjednodušené postupy, upřednostnění infrastruktury a uvolnění regulací mají posílit vývozní kapacitu a učinit z regionu atraktivnější základnu pro průmysl a obchod." # todo: NEW TRANSLATION
 JAP_expand_special_zones_nationwide: "Rozšířit zvláštní zóny po celé zemi" # todo: NEW TRANSLATION
 JAP_expand_special_zones_nationwide_desc: "Výsledky dosažené ve vybraných strategických zónách budou rozšířeny na celostátní úroveň a regulační reforma se z omezené výjimky promění v širší rámec růstu." # todo: NEW TRANSLATION
 JAP_tokyo_startup_special_zone_active: "Provedeno §Y$JAP_tokyo_startup_special_zone$§!" # todo: NEW TRANSLATION
 JAP_kansai_medical_special_zone_active: "Provedeno §Y$JAP_kansai_medical_special_zone$§!" # todo: NEW TRANSLATION
 JAP_kyushu_logistics_special_zone_active: "Provedeno §Y$JAP_kyushu_logistics_special_zone$§!" # todo: NEW TRANSLATION
 JAP_expand_special_zones_nationwide_done: "Provedeno §Y$JAP_expand_special_zones_nationwide$§!" # todo: NEW TRANSLATION
 JAP_japanese_economy_decisions: "Přetrvávající nedostatek poptávky" # todo: NEW TRANSLATION
 JAP_japanese_economy_decisions_desc: "Dvě desetiletí klesajících cen naučila japonské domácnosti a firmy čekat. Mzdy stagnují, společnosti hromadí hotovost místo investic a každý jen stimulů se spoří místo utrácení. Ekonomika se nehroutí, jednoduše se odmítá pohnout.\n\n§YCo můžete dělat§!\nNíže uvedená rozhodnutí představují nástroje pro podporu poptávky. Oznámení cenového cíle, snížení spotřební daně, převody hotovosti domácnostem, financování veřejných investic a podpora nákupů zboží dlouhodobé spotřeby zvyšují §Ypokrok obnovy poptávky§!. Zaměření větve poptávky jej dále zvyšují a §Y$JAP_improvement_private_investment_climate$§! k němu přispívá přímo.\n\n§YPokrok obnovy poptávky§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GMezníky§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! se zmírní na §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: dále se zmírní na §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: duch je odstraněn a hospodářský růst Japonska se zrychlí.\n\n§RVarování§!: tento pokrok se nikdy nesnižuje, ale sám od sebe jej nic nezvyšuje. Pokud nepřijmete žádná rozhodnutí, Japonsko zůstane v útlumu neomezeně dlouho." # todo: NEW TRANSLATION
 JAP_entrenched_demand_shortfall_idea_1: "Přetrvávající útlum poptávky" # todo: NEW TRANSLATION
 JAP_entrenched_demand_shortfall_idea_1_desc: "Deflační očekávání a obavy z budoucnosti potlačují výdaje domácností, zatímco firmy odkládají investice tváří v tvář slabé poptávce. Mzdy stagnují, ceny se téměř nehýbou a nikdo nechce utrácet jako první. Japonská ekonomika se nehroutí, ale ochromení ji vyčerpává.\n-------------\nÚčinky tohoto národního ducha můžete §Gzmírnit§! použitím rozhodnutí v kategorii §Y$JAP_japanese_economy_decisions$§! a zvýšením §Ypokroku obnovy poptávky§! alespoň na §G30§!!" # todo: NEW TRANSLATION
 JAP_entrenched_demand_shortfall_idea_2: "Pomalé oživování poptávky" # todo: NEW TRANSLATION
 JAP_entrenched_demand_shortfall_idea_2_desc: "Jasnější cenové cíle a podpora domácností odvedly ekonomiku od její nejhorší fáze, obnova však zůstává křehká. Spotřeba a investice se na některých místech zlepšují, ne však dostatečně na pozvednutí celé země. Poptávka se vrací, ale ekonomiku stále svazuje opatrnost.\n-------------\nÚčinky tohoto národního ducha můžete §Gzmírnit§! použitím rozhodnutí v kategorii §Y$JAP_japanese_economy_decisions$§! a zvýšením §Ypokroku obnovy poptávky§! alespoň na §G60§!!" # todo: NEW TRANSLATION
 JAP_entrenched_demand_shortfall_idea_3: "Zbytkový brzdný účinek poptávky" # todo: NEW TRANSLATION
 JAP_entrenched_demand_shortfall_idea_3_desc: "Vládní opatření na podporu spotřeby posunula ekonomiku vpřed, hluboce však přetrvává opatrnost zanechaná lety stagnace. Domácnosti a firmy se pohybují více než dříve, k samoudržitelné obnově však stále chybí poslední impuls. Japonská ekonomika stojí na prahu úniku ze stagnace, ještě se z ní však zcela nevymanila.\n-------------\nTento národní duch můžete §Godstranit§! použitím rozhodnutí v kategorii §Y$JAP_japanese_economy_decisions$§! a zvýšením §Ypokroku obnovy poptávky§! alespoň na §G85§!." # todo: NEW TRANSLATION
 JAP_zombie_companies: "Zombie společnosti" # todo: NEW TRANSLATION
 JAP_zombie_companies_desc: "Roky shovívavosti udržely nerentabilní a předlužené firmy při životě díky levným úvěrům a zablokovaly kapitál, práci i management, které potřebují zdravější odvětví. Dokud tyto firmy neprojdou restrukturalizací nebo nebudou uzavřeny, trpí výstavba, produktivita i příjmy z podnikových daní.\n-------------\nZvyšování §Ypokroku restrukturalizace podniků§! odemyká rozhodnutí §Y$JAP_restructure_next_tranche$§!, které tohoto národního ducha postupně zmírňuje. Aktuální údaje naleznete v kategorii §Y$JAP_corporate_reform_category$§!." # todo: NEW TRANSLATION
 JAP_zombie_companies_1: "Zombie společnosti" # todo: NEW TRANSLATION
 JAP_zombie_companies_1_desc: "Roky shovívavosti udržely nerentabilní a předlužené firmy při životě díky levným úvěrům a zablokovaly kapitál, práci i management, které potřebují zdravější odvětví. Nikdo neodepsal ztrátu, nikdo nezavřel závod a nikdo nedokáže říct, jak velká část bankovního systému je fikcí.\n-------------\nPři §Ypokroku restrukturalizace podniků§! §G30§! můžete použít §Y$JAP_restructure_next_tranche$§! a zmírnit tohoto národního ducha o jeden stupeň. Aktuální údaje naleznete v kategorii §Y$JAP_corporate_reform_category$§!." # todo: NEW TRANSLATION
 JAP_zombie_companies_2: "Zombie společnosti: likvidace" # todo: NEW TRANSLATION
 JAP_zombie_companies_2_desc: "První část byla vyřešena. Úvěry byly odepsány místo prodlužování, nejhorší insolventní firmy prošly soudy a kapitál, který deset let ležel mrtvý, se znovu pohybuje. To, co zbývá, je větší, lépe propojené a mnohem hůře zasažitelné.\n-------------\nPři §Ypokroku restrukturalizace podniků§! §G60§! můžete použít §Y$JAP_restructure_next_tranche$§! a zmírnit tohoto národního ducha o další stupeň. Aktuální údaje naleznete v kategorii §Y$JAP_corporate_reform_category$§!." # todo: NEW TRANSLATION
 JAP_zombie_companies_3: "Zombie společnosti: poslední účetní knihy" # todo: NEW TRANSLATION
 JAP_zombie_companies_3_desc: "Otevřené zůstávají už jen poslední účetní knihy. Zbývající firmy mají nejhlubší vztahy s bankami a největší politické krytí a každá z nich očekává, že přežije vládu, která se na ni zaměřila. Brzdný účinek na širší ekonomiku je nyní mírný, ale ještě nezmizel.\n-------------\nPři §Ypokroku restrukturalizace podniků§! §G85§! zaměření na konci zvolené cesty §Godstraní§! tohoto národního ducha natrvalo. Aktuální údaje naleznete v kategorii §Y$JAP_corporate_reform_category$§!." # todo: NEW TRANSLATION
 JAP_ykk_group: "Skupina YKK" # todo: NEW TRANSLATION
 JAP_ykk_group_desc: "Yoshida Kogyo vyrábí přibližně polovinu zipů na světě, zhruba sedm miliard ročně v závodech ve více než sedmdesáti zemích. Společnost si sama válcuje mosaz, spřádá vlastní polyester, míchá vlastní barviva a vyrábí stroje, které kompletují hotový jezdec; vertikální integrace ponechává mimo její kontrolu jen máloco. Vojenské zakázky představují malou, ale náročnou část podnikání, protože zapínání na nosiči plátů, nosné vestě nebo maskovací blůze je první součástkou, která v poli selže. Japonské programy uniforem a ochranného vybavení čerpají od dodavatele, který dokáže ve vlastní režii upravit popruh, povrchovou úpravu nebo korozivzdornou slitinu, místo aby čekal na subdodavatele." # todo: NEW TRANSLATION
 JAP_karoshi_crisis: "Krize karóši" # todo: NEW TRANSLATION
 JAP_karoshi_crisis_desc: "Chronické přepracování ničí japonskou pracovní sílu. Nadměrné neplacené přesčasy a kultura \"služebního zangjó\" způsobují mezi zaměstnanci mrtvice, srdeční selhání a sebevraždy, zatímco vyčerpané rodiny odkládají děti. Trpí stabilita, produktivita i výzkum, rostou výdaje na zdravotnictví a sociální oblast a populace rok za rokem klesá.\n-------------\nReformní zaměření a kampaně na pracovištích zvyšují §Yblahobyt pracovníků§!. Při §G30§! a §G60§! odemyká rozhodnutí §Y$JAP_enforce_next_reforms$§! a zmírňuje tohoto národního ducha o jeden stupeň; zaměření na konci zvolené cesty jej odstraní natrvalo. Dokud zůstávají nevyřešeny japonské §Yzombie společnosti§!, každá kampaň přináší poloviční účinek. Aktuální údaje naleznete v kategorii §Y$JAP_corporate_reform_category$§!." # todo: NEW TRANSLATION
 JAP_karoshi: "Karóši" # todo: NEW TRANSLATION
 JAP_karoshi_desc: "Vláda označuje karóši za celostátní krizi: pracovníci umírají na přepracování, na mrtvice a srdeční selhání u pracovního stolu i sebevraždami po měsících se stohodinovými pracovními týdny. Smrt zaměstnankyně společnosti Dentsu Macuri Takahašiové jej vrátila na celostátní program a stála prezidenta společnosti místo. Stát nyní musí rozhodnout, jak hluboko zasáhne do pracovního prostředí, aby byla práce slučitelná se životem." # todo: NEW TRANSLATION
 JAP_corporate_laws: "Reforma zákona o pracovních standardech" # todo: NEW TRANSLATION
 JAP_corporate_laws_desc: "Vláda volí legislativní cestu, uzavírá mezeru v článku 36 zákonem o reformě pracovního stylu a nahrazuje dohody saburoku pevnými limity vynucovanými posílenou inspekcí pracovních standardů. Její prosazení znamená boj se zaměstnavateli a lobby za pružnou pracovní dobu v každé fázi projednávání v parlamentu. Jde o nejkomplexnější ze tří odpovědí a také o tu, která přichází nejpomaleji." # todo: NEW TRANSLATION
 JAP_cultural_change: "Střet s kulturou přepracování" # todo: NEW TRANSLATION
 JAP_cultural_change_desc: "Vláda vede kampaň za změnu kultury místo zákona: Prémiový pátek posílá pracovníky jednou měsíčně domů dříve, kontroly duševního zdraví pronikají na pracoviště a každoroční bílá kniha o karóši udržuje mrtvé na očích zaměstnavatelů i náborářů. Nic z toho se nedotýká nevyřčeného pravidla, že svědomitý člověk odchází až po vedoucím oddělení. Tato cesta sází na to, že se japonský vztah k práci změní zdola, jedno pracoviště a jedna domácnost po druhé." # todo: NEW TRANSLATION
 JAP_keiretsu_pact: "Vyjednávání s keiretsu" # todo: NEW TRANSLATION
 JAP_keiretsu_pact_desc: "Stát vyjednává přímo s podnikatelskými skupinami a zaměstnavatelskou federací Keidanren: řízená reforma výměnou za stabilitu, zachování celoživotního zaměstnání a ochranu zadlužených firem před otřesy. Není přijata žádná legislativa a žádná společnost není veřejně zostuzena, protože ústupek se směňuje za předvídatelnost. Je to nejpomalejší cesta k reformě a ta, která zanechá korporátní Japonsko nejméně změněné." # todo: NEW TRANSLATION
 JAP_overtime_cap: "Limit článku 36" # todo: NEW TRANSLATION
 JAP_overtime_cap_desc: "Dohoda saburoku podaná na úřadu práce mění zákonný čtyřicetihodinový pracovní týden v pouhé doporučení, ale zákon o reformě pracovního stylu tuto mezeru uzavírá. Čtyřicet pět hodin přesčasů měsíčně a tři sta šedesát ročně se stávají zákonným limitem, nikdy více než sto v jediném měsíci, s trestními sankcemi namísto pouhého správního vedení. Čísla odpovídají hranici karóši, kterou používá ministerstvo zdravotnictví, práce a sociálních věcí při rozhodování, zda mrtvici nebo sebevraždu způsobilo zaměstnání." # todo: NEW TRANSLATION
 JAP_mandatory_paid_leave: "Pět dní, které si pracovník musí vybrat" # todo: NEW TRANSLATION
 JAP_mandatory_paid_leave_desc: "Povinnost se obrací: zaměstnavatel, který poskytuje deset či více dnů dovolené, musí nyní zajistit, aby jich bylo skutečně vyčerpáno alespoň pět, a pokud tak pracovník neučiní, sám určit jejich termíny. Japonští pracovníci nemají tolik nedostatek dovolené jako svolení ji využít a sotva polovina přiznané dovolené je skutečně vyčerpána. Stejná novela přebírá evropský pracovní interval, jedenáct hodin odpočinku mezi směnami, ovšem pouze jako povinnost vynaložit úsilí." # todo: NEW TRANSLATION
 JAP_equal_pay_for_equal_work: "Stejná mzda za stejnou práci" # todo: NEW TRANSLATION
 JAP_equal_pay_for_equal_work_desc: "Zákon o částečných úvazcích a pracovních smlouvách na dobu určitou nutí zaměstnavatele odůvodnit každý rozdíl ve mzdě a benefitech mezi řádnými a neregulérními pracovníky, nebo jej odstranit. Čtyři z deseti japonských pracovníků jsou neregulérní, sedí u stejných stolů za zlomek hodinové mzdy, bez bonusu, odstupného a očekávání práce na jaře příštího roku. Firmy ztrácejí levný pracovní nárazník, o nějž se desetiletí opíraly, a miliony lidí, kteří nemohli plánovat ani rok dopředu, konečně mohou." # todo: NEW TRANSLATION
 JAP_labour_inspection_offices: "Inspekce pracovních standardů" # todo: NEW TRANSLATION
 JAP_labour_inspection_offices_desc: "Vláda financuje inspekci pracovních standardů tak, aby vymáhala právo místo poskytování rad: více inspektorů, forenzní účetnictví k odhalení zfalšovaných výkazů, které mění sto hodin přesčasů na papíře ve dvacet, a ochota stíhat. Několik tisíc inspektorů nemůže dohlížet na šedesát milionů pracovníků, takže většina porušení vyjde najevo až poté, co někdo zemře a rodina si najme právníka. Ministerstvo již zveřejňuje názvy firem, které porušují zákon, a samotná Dentsu byla po smrti Macuri Takahašiové odsouzena." # todo: NEW TRANSLATION
 JAP_karoshi_prevention_act: "Zákon o prevenci karóši" # todo: NEW TRANSLATION
 JAP_karoshi_prevention_act_desc: "Parlament přijímá zákon o podpoře preventivních opatření proti karóši, který státu ukládá zkoumat úmrtí z přepracování, zveřejňovat každoroční bílou knihu a podřídit se měřitelným cílům: méně než pět procent pracovníků v šedesátihodinových pracovních týdnech, sedmdesát procent skutečně vyčerpané placené dovolené a zajištění duševního zdraví v každé firmě. Smyslem je zveřejnit čísla, protože pak mohou být veřejně nesplněna. Stejný balík obsahuje výjimku pro vysoce postavené odborníky, která ruší hodinová pravidla pro nejlépe placené specialisty; odbory očekávají její rozšíření." # todo: NEW TRANSLATION
 JAP_end_of_karoshi: "Země, kde práce nezabíjí" # todo: NEW TRANSLATION
 JAP_end_of_karoshi_desc: "Limit přesčasů platí, protože inspektoři přicházejí bez ohlášení a žalobci je následují, dovolená se čerpá, protože to vyžaduje zákon, a smluvní pracovník vedle vás dostává stejnou mzdu jako vy. Firmy, které mohly přežít jen díky neplaceným hodinám, byly uzavřeny místo podpírání stále obnovovanými úvěry, takže nikdo nemůže tvrdit, že přežití mu nedává na výběr. Japonsko bude stále tvrdě pracovat, přestalo však považovat vyčerpání za důkaz loajality.\n-------------\nVyžaduje úplné vyřešení §Yjaponských zombie společností§!, předchozí zmírnění §Y$JAP_karoshi_crisis$§! do konečné fáze a §Yblahobyt pracovníků§! alespoň §G85§!. Dokončení tohoto zaměření natrvalo ukončí krizi karóši." # todo: NEW TRANSLATION
 JAP_saburoku_audit_campaign: "Prověřit dohody saburoku" # todo: NEW TRANSLATION
 JAP_saburoku_audit_campaign_desc: "Článek 36 zákona o pracovních standardech umožňuje firmě překročit zákonný osmihodinový pracovní den podáním dohody se zástupcem pracovníků a po desetiletí byl limit zapsaný v těchto dohodách takový, jaký si zaměstnavatel přál. Inspektoři nyní vybírají podání a porovnávají je s docházkou, záznamy vstupních karet a údaji o přístupu do budov. Zákon o reformě pracovního stylu jim poskytuje číslo, podle něhož mohou měřit: čtyřicet pět hodin měsíčně, tři sta šedesát ročně." # todo: NEW TRANSLATION
 JAP_paid_leave_enforcement_campaign: "Vymáhat pět dní" # todo: NEW TRANSLATION
 JAP_paid_leave_enforcement_campaign_desc: "Japonští pracovníci dostali každoroční dovolenou, ale nečerpali ji, protože její využití je vyčleňovalo. Od roku 2019 platí povinnost opačně: zaměstnavatel, jehož pracovníci mají deset či více dnů, musí zajistit, aby jich bylo skutečně využito pět, a pokud tak pracovník neučiní, musí sám určit termíny. Ministerstvo kontroluje záznamy o dovolené a pokutuje firmy, jejichž knihy ukazují nevyužité nároky." # todo: NEW TRANSLATION
 JAP_equal_pay_audit_campaign: "Prověřit rozdíly ve mzdách" # todo: NEW TRANSLATION
 JAP_equal_pay_audit_campaign_desc: "Čtyři z deseti japonských pracovníků jsou neregulérní, vykonávají stejnou práci vedle stálého kolegy za přibližně šedesát procent mzdy a bez bonusu. Zákon o částečných úvazcích a pracovních smlouvách na dobu určitou ukládá zaměstnavateli písemně vysvětlit každý rozdíl v zacházení, když je o to požádán, a tato vysvětlení se shromažďují a porovnávají v rámci odvětví, místo aby zanikla uvnitř jediné společnosti." # todo: NEW TRANSLATION
 JAP_inspector_sweep_campaign: "Provést razii u nejhorších provinilců" # todo: NEW TRANSLATION
 JAP_inspector_sweep_campaign_desc: "Úřady inspekce pracovních standardů si vyberou odvětví, přijdou bez ohlášení a projdou časové výkazy každé firmy v něm. Ministerstvo zveřejňuje názvy společností, u nichž bylo zjištěno závažné porušení, což náboráře stojí mnohem více než pokuta, protože absolvent, který seznam četl, se nepřihlásí." # todo: NEW TRANSLATION
 JAP_karoshi_wellbeing_up_tt: "Zvyšuje §Yblahobyt pracovníků§! o $RIGHT|+=0$ a zmírňuje krizi karóši" # todo: NEW TRANSLATION
 JAP_premium_friday: "Prémiový pátek" # todo: NEW TRANSLATION
 JAP_premium_friday_desc: "Ministerstvo hospodářství, obchodu a průmyslu spouští s Keidanrenem Prémiový pátek: poslední pátek každého měsíce odcházejí zaměstnanci ve tři a večer tráví v obchodech místo u pracovních stolů. Načasování je nešťastné, protože na konci měsíce se uzavírají účty a plní kvóty, a jen málo firem dodržuje opatření s nadšením. Přežívá alespoň precedens, kdy stát určil hodinu a řekl zemi, aby přestala pracovat." # todo: NEW TRANSLATION
 JAP_ikumen_project: "Projekt ikumen" # todo: NEW TRANSLATION
 JAP_ikumen_project_desc: "Ministerstvo zdravotnictví, práce a sociálních věcí vede kampaň ikumen, jejímž cílem je učinit z otce pečujícího o dítě někoho, koho je třeba obdivovat, nikoli vysvětlovat. Japonská otcovská dovolená patří na papíře k nejštědřejším na světě, rok je částečně placený, téměř nikdo si ji však nebere, protože muž, který o ni požádá, je muž, jehož práci nesou kolegové a kterého si vedoucí oddělení zapamatuje. Novelizovaný zákon nabízí čtyři týdny během osmi týdnů po narození, rozdělitelně a pouze na základě oznámení; hranice je dost nízká na to, aby si ji váhající otec skutečně vzal." # todo: NEW TRANSLATION
 JAP_stress_check_programme: "Kontrola stresu" # todo: NEW TRANSLATION
 JAP_stress_check_programme_desc: "Novelizovaný zákon o bezpečnosti a zdraví při práci vyžaduje, aby každé pracoviště s padesáti či více zaměstnanci nabídlo každoroční psychologické sebehodnocení. Poprvé tak stát japonským firmám ukládá, aby se zaměstnanců zeptaly, jak se mají. Pracovník se špatným výsledkem může požádat o pohovor s lékařem a úpravu svých povinností, výsledky však patří zaměstnanci a vedoucí je bez souhlasu neuvidí. To chrání jednotlivce a zároveň nástroj oslabuje; od firem s méně než padesáti zaměstnanci se očekává pouze snaha." # todo: NEW TRANSLATION
 JAP_telework_normalization: "Práce odkudkoli" # todo: NEW TRANSLATION
 JAP_telework_normalization_desc: "Vláda jmenuje prvního ministra pro digitální transformaci a otevírá Digitální agenturu, která odstraňuje požadavek razítka hanko z naprosté většiny správních postupů. Práce na dálku nebyla okrajová kvůli chybějící technologii, ale proto, že smlouvy vyžadovaly vyřezávané razítko a formuláře stále přicházely faxem, takže někdo musel být v budově a držet razítko. Otázkou zůstává, zda něco z toho přežije mimořádnou situaci, protože firmy povolaly zaměstnance zpět ke stolům, u nichž prokázali, že je nepotřebují." # todo: NEW TRANSLATION
 JAP_ending_service_zangyo: "Konec neplacených přesčasů" # todo: NEW TRANSLATION
 JAP_ending_service_zangyo_desc: "Sabisu zangjó je hodina odpracovaná a nikdy nezaznamenaná, darovaná zdarma, protože pracovní den se měřil vlastním prohlášením a zaměstnanec věděl, co od něj vedoucí oddělení očekává, že toto číslo bude znamenat. Reforma útočí na aritmetiku, nikoli na kulturu: zaměstnavatelé musí určovat pracovní dobu objektivními prostředky, čtečkami karet nebo časy přihlášení, a rozdíl mezi oběma záznamy je důkazem. Ministerstvo každoročně zveřejňuje, co vymohlo, desítky miliard jenů na nevyplacených mzdách, a každá z těchto firem byla odhalena, nikoli výjimečná." # todo: NEW TRANSLATION
 JAP_ending_compulsory_nomikai: "Dobrovolné nomikai" # todo: NEW TRANSLATION
 JAP_ending_compulsory_nomikai_desc: "Nomikai je dobrovolné v tom smyslu, že pozvánka je formulována jako otázka a mladší pracovník, který ji dvakrát odmítne, o sobě řekl něco, co žádné hodnocení výkonu nezaznamená. Zákon o prevenci šikany z pozice se tomu staví z boku: poprvé definuje šikanu z pozice na pracovišti v japonských zákonech a ukládá každé společnosti provozovat stížnostní řízení a chránit stěžovatele. Generace mladších pracovníků už přestala chodit a zákon ji dohnal." # todo: NEW TRANSLATION
 JAP_work_to_live: "Pracovat pro život" # todo: NEW TRANSLATION
 JAP_work_to_live_desc: "Hodiny zaznamenává stroj a odpovídají skutečnosti, dovolená se čerpá, protože její čerpání nic nestojí, a otcové žádají o týdny po narození dítěte a vracejí se ke stejnému stolu a stejným vyhlídkám. Nic z toho nebylo dosaženo pouze zákonem, protože nikdy nešlo skutečně o zákon: šlo o to, co pracoviště očekává, když nikdo nic nevymáhá. Japonsko stále tvrdě pracuje, přestalo si však plést práci se smrtí z vyčerpání.\n-------------\nVyžaduje úplné vyřešení §Yjaponských zombie společností§!, předchozí zmírnění §Y$JAP_karoshi_crisis$§! do konečné fáze a §Yblahobyt pracovníků§! alespoň §G85§!. Dokončení tohoto zaměření natrvalo ukončí krizi karóši." # todo: NEW TRANSLATION
 JAP_corporate_reform_category: "Reforma japonských korporací" # todo: NEW TRANSLATION
 JAP_corporate_reform_category_desc: "Japonský korporátní sektor trpí dvěma propojenými nemocemi. Banky udržují při životě nerentabilní a předlužené firmy pomocí prodlužovaných úvěrů, čímž blokují kapitál a pracovníky, které potřebují zdravější odvětví. Tyto firmy si zároveň kupují loajalitu neplacenými přesčasy a výsledkem je karóši, smrt z přepracování. Ani jednu nemoc nelze zcela vyléčit, dokud přetrvává ta druhá.\n\n§YZombie společnosti§!\n§YPokrok restrukturalizace korporací§!: [?JAP_corporate_restructuring_progress|0] / 100\nRestrukturalizace postupuje rychlostí §R+0.25 měsíčně§!, dokud nebude vyšetřování uzavřeno a zvoleno řešení. §Y$JAP_controlled_downsize$§! pak firmy rychle zlikviduje, §Y$JAP_forced_mergers$§! je pohltí poloviční rychlostí a kvalita zprávy ovlivní obojí. Zaměření na banky a níže uvedené programy obnovy přidávají jednorázové částky.\n§RPokrok se zastaví na 84§!, dokud nebude zvoleno řešení.\n§GPrahové hodnoty§!\n§G30§! a §G60§!: níže uvedené rozhodnutí §Y$JAP_restructure_next_tranche$§! se odemkne a každé jeho použití zmírní §Y$JAP_zombie_companies$§! o jeden stupeň.\n§G85§!: zaměření na konci zvolené cesty jej nadobro odstraní, buď §Y$JAP_the_lost_decade_ends$§!, nebo §Y$JAP_consolidated_japan_inc$§!, přičemž druhé zanechá trvalou stopu.\n§RVarování§!: §Y$JAP_keiretsu_pact$§! zpomaluje měsíční nárůst.\n\n§YKrize karóši§!\n§YBlahobyt pracovníků§!: [?JAP_karoshi_wellbeing|0] / 100\nZaměření reformy na zvolenou cestu přidávají blahobyt pracovníků přímo a níže uvedené kampaně na pracovištích jej zvyšují po dobu, kdy je financujete.\n§GPrahové hodnoty§!\n§G30§! a §G60§!: níže uvedené rozhodnutí §Y$JAP_enforce_next_reforms$§! se odemkne a každé jeho použití zmírní §Y$JAP_karoshi_crisis$§! o jeden stupeň.\n§G85§!: zaměření na konci zvolené cesty jej nadobro odstraní, buď §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§!, nebo §Y$JAP_the_bargain_kept$§!. Každé z nich rovněž vyžaduje, aby byla krize nejprve zmírněna na poslední stupeň.\n§RVarování§!: každá kampaň přináší §R4§! místo §G8§!, dokud přetrvávají §Y$JAP_zombie_companies$§!, a samotná zaměření cesty vás nemohou dostat na §G85§!.\n\n§GRada§!: §Y$JAP_a_society_where_women_thrive$§! snižuje náklady kampaní §Y$JAP_cultural_change$§! pro státní pokladnu na polovinu." # todo: NEW TRANSLATION
 JAP_premium_friday_campaign: "Propagovat prémiový pátek" # todo: NEW TRANSLATION
 JAP_premium_friday_campaign_desc: "Financujte další kolo propagační kampaně ministerstva a s ní spojené maloobchodní slevy a zatlačte na zaměstnavatelskou federaci, aby přiměla své členy zavírat dříve. Firmy, které zhasnou světla ve tři, budou při tom fotografovány." # todo: NEW TRANSLATION
 JAP_ikumen_campaign: "Spustit kampaň ikumen" # todo: NEW TRANSLATION
 JAP_ikumen_campaign_desc: "Umístěte otce na rodičovské dovolené na plakáty, do ministerské reklamy i do televize a zveřejňujte míru jejího využívání podle jednotlivých firem, aby se nízké číslo stalo náborovým problémem. Cílem je, aby žádost o dovolenou působila obyčejně, nikoli odvážně." # todo: NEW TRANSLATION
 JAP_mental_health_campaign: "Kampaň za duševní zdraví na pracovišti" # todo: NEW TRANSLATION
 JAP_mental_health_campaign_desc: "Rozšiřte každoroční kontrolu stresu pod hranici padesáti zaměstnanců, dotujte pracovnělékařské lékaře pro firmy příliš malé na to, aby si jednoho vydržovaly, a řádně obsazujte poradenské linky. Vyšetření pomůže jen tehdy, když je na druhém konci někdo, kdo se mu věnuje." # todo: NEW TRANSLATION
 JAP_no_overtime_day_campaign: "Vyhlásit den bez přesčasů" # todo: NEW TRANSLATION
 JAP_no_overtime_day_campaign_desc: "Určete všední den, zhasněte kancelářská světla ve stanovenou hodinu a pošlete domů nejprve vedoucí oddělení, protože žádný junior neodejde dříve než jeho nadřízený. Hrubé, viditelné a jediná verze tohoto pokynu, která kdy fungovala." # todo: NEW TRANSLATION
 JAP_karoshi_resolved: "Japonská krize karóši byla zcela vyřešena" # todo: NEW TRANSLATION
 JAP_keidanren_charter: "Charta rovnováhy mezi pracovním a osobním životem" # todo: NEW TRANSLATION
 JAP_keidanren_charter_desc: "Vláda, Keidanren a Rengo podepisují Chartu rovnováhy mezi pracovním a osobním životem a dávají jí konkrétní čísla: snížit na polovinu počet pracovníků v šedesátihodinových pracovních týdnech, vyčerpat každý přiznaný den placené dovolené a dostat mužskou rodičovskou dovolenou z nízkých jednotek procent. Dokument nemá právní sílu ani sankce, pouze každoroční veřejné hodnocení radou, v níž má podnikatelská sféra rovnocenné zastoupení. Japonská pracovní doba nikdy neklesla díky stíhání, ale klesá, když firmy musí navzájem vysvětlovat svá čísla." # todo: NEW TRANSLATION
 JAP_shunto_offensive: "Jarní ofenzíva" # todo: NEW TRANSLATION
 JAP_shunto_offensive_desc: "Kabinet se přímo připojuje k jarní mzdové ofenzívě šuntó, tlačí na Keidanren, aby zvýšil základní mzdy namísto bonusů, a požadavek podporuje daňovými úlevami pro vyhovující firmy. Kritici tomu říkají kanmin šuntó, vládou řízené vyjednávání, a tvrdí, že mzdové kolo řízené z kanceláře premiéra není kolektivním vyjednáváním vůbec. Dokud nevzrostou základní mzdy, salaryman bude dál pracovat přesčasy, které splácejí jeho hypotéku, bez ohledu na to, co říká strop." # todo: NEW TRANSLATION
 JAP_health_management_stocks: "Řízení zdraví a produktivity" # todo: NEW TRANSLATION
 JAP_health_management_stocks_desc: "Ministerstvo a Tokijská burza začínají označovat akcie řízení zdraví a produktivity a říkají investorům, že zdraví zaměstnanců je kapitálový výdaj, nikoli sociální péče. Certifikace, která za tím stojí, White 500, je záměrným opakem černé listiny špatných zaměstnavatelů a vychází ze zjištění, že vyčerpaní pracovníci produkují méně a stojí více než odpočatí. Firmy předkládají vlastní údaje o pracovní době a zdraví, aby získaly označení, a ty, které za ně nedokážou odpovídat akcionářům ani uchazečům." # todo: NEW TRANSLATION
 JAP_morning_shift_system: "Ranní směna" # todo: NEW TRANSLATION
 JAP_morning_shift_system_desc: "Itochu, sogo šóša v centru starého keiretsu, zakazuje práci po desáté večer a místo toho prémiově odměňuje ranní hodiny. Úvaha je obchodní, nikoli humanitární: obchodník sedící u stolu od devíti předchozího rána stanovuje chybné ceny a večerní hodiny jsou nejméně produktivní částí dne. Večerní přesčasy se zhroutily, celková pracovní doba klesla, zisk se udržel a porodnost ve firmě vzrostla, což zahanbilo každého konkurenta, který tvrdil, že kratší pracovní doba je nedostupná." # todo: NEW TRANSLATION
 JAP_job_based_employment: "Najímání na práci, ne do firmy" # todo: NEW TRANSLATION
 JAP_job_based_employment_desc: "Japonské zaměstnání je založené na členství: pracovník je přijat do firmy, nikoli na konkrétní pozici, podle uvážení firmy střídá úkoly bez vymezených povinností a právě zde začíná neomezený pracovní den. Hitachi, Fujitsu, KDDI a Shiseido nyní zveřejňují skutečné popisy pracovních míst s odměnou odstupňovanou podle role a Keidanren připustil, že celoživotní zaměstnání nelze udržet. Stát financuje rekvalifikaci za bilion jenů, aby tato změna působila jako příležitost, nikoli zrada." # todo: NEW TRANSLATION
 JAP_the_bargain_kept: "Dodržená dohoda" # todo: NEW TRANSLATION
 JAP_the_bargain_kept_desc: "Pracovní doba klesá, protože podnikatelské skupiny zjišťují, že je stojí více, než vydělávají, a jakmile to zjistí, jednají rychleji, než by mohl jakýkoli výbor sněmu. Křížové vlastnictví zůstává nedotčeno, hlavní banky zůstávají v centru svých skupin a produktivita uvolněná kratšími dny proudí do laboratoří místo do mzdových požadavků. Stát nese to, co dohoda nepokrývá: účet za zdravotní pojištění pracovníků, kteří už byli zlomeni, a shovívavost, která udržuje insolventní firmy při životě.\n-------------\nVyžaduje úplné vyřešení §Yjaponských zombie společností§!, předchozí zmírnění §Y$JAP_karoshi_crisis$§! na poslední stupeň a alespoň §G85§! v ukazateli §Yblahobytu pracovníků§!. Dokončení tohoto zaměření nadobro ukončí krizi karóši." # todo: NEW TRANSLATION
 JAP_keidanren_review_campaign: "Prověřit dodržování charty" # todo: NEW TRANSLATION
 JAP_keidanren_review_campaign_desc: "Charta podnikového chování Keidanrenu zavazuje své členy k pracovním postupům, které většina z nich nekontroluje a nikdo z nich nezveřejňuje. Federace je přesvědčena, aby provedla kontrolní cyklus se skutečnými výsledky, člena po členovi, a souhrn oznámila ministerstvu. Nic není povinné a nikdo není jmenován, což je přesně důvod, proč s tím podnikatelské skupiny souhlasí." # todo: NEW TRANSLATION
 JAP_shunto_wage_round_campaign: "Podpořit jarní mzdovou ofenzívu" # todo: NEW TRANSLATION
 JAP_shunto_wage_round_campaign_desc: "Každé jaro přidružené organizace Renga předloží zaměstnavatelům číslo a zaměstnavatelé vrátí menší, přičemž složka navýšení základní mzdy byla po dvě desetiletí nulová. Vláda tlačí na podnikatelské skupiny, aby připustily skutečné zvýšení, protože pracovník placený dost na živobytí přestane pracovat přesčasy, které ho zabíjejí, a tlak doplňuje daňovými úlevami pro firmy, které se pohnou jako první." # todo: NEW TRANSLATION
 JAP_health_stock_listing_campaign: "Rozšířit seznam řízení zdraví" # todo: NEW TRANSLATION
 JAP_health_stock_listing_campaign_desc: "Ministerstvo a Tokijská burza každoročně společně označují hrstku kotovaných firem jako akcie zdraví a produktivity, podle teorie, že společnost, která nevyčerpává své zaměstnance, je lepší dlouhodobou investicí. Rozšíření výběru a zveřejnění hodnocení promění zdraví na pracovišti v něco, co může správce fondu ocenit, a zasáhne tak správní rady, kam se inspektor práce nikdy nedostane." # todo: NEW TRANSLATION
 JAP_shift_rotation_campaign: "Dotovat ranní směnu" # todo: NEW TRANSLATION
 JAP_shift_rotation_campaign_desc: "Posuňte pracovní den dopředu, plaťte příplatek za ranní místo večerní práce a večer vypněte napájení kancelářského patra, aby setrvání nebylo možné. Itochu to udělalo a zjistilo, že s produktivitou vzrostla i porodnost; stát nyní hradí část přechodových nákladů každé firmě ochotné jej následovat." # todo: NEW TRANSLATION
 JAP_declaration_price_target: "Vyhlásit cenový cíl" # todo: NEW TRANSLATION
 JAP_declaration_price_target_desc: "Ekonomiku nestahuje dolů pouze slabá poptávka. Víra, že ceny a mzdy se nikdy nepohnou, uvěznila domácnosti i firmy v opatrnosti. Jasný cenový cíl je prohlášením, že stát už nebude přijímat stagnaci jako normu, a je prvním krokem k uvolnění zamrzlých očekávání." # todo: NEW TRANSLATION
 Japan_economy.17.t: "Cenového cíle bylo dosaženo" # todo: NEW TRANSLATION
 Japan_economy.17.d: "To, co se kdysi zdálo nemožné, se začalo dít. Ceny rostou způsobem, který už lidé nemohou ignorovat. Nejdůležitější změnou není samotné číslo, ale sílící pocit, že stagnace není věčná. Tento pocit začíná uvolňovat opatrnost domácností i firem." # todo: NEW TRANSLATION
 Japan_economy.17.a: "Atmosféra se změnila." # todo: NEW TRANSLATION
 Japan_economy.18.t: "Cenový cíl nebyl naplněn" # todo: NEW TRANSLATION
 Japan_economy.18.d: "Cíl se nepodařilo proměnit ve skutečný pohyb a kolem vládního slibu prolomit útlum se začínají šířit pochybnosti. Domácnosti znovu opatrní, zatímco firmy tváří v tvář slabé poptávce ustupují do vyčkávací pozice. Důvěra v oživení byla zjevně poškozena a nad japonskou ekonomikou se opět usazuje tíživá nálada." # todo: NEW TRANSLATION
 Japan_economy.18.a: "Důvěru nelze obnovit snadno." # todo: NEW TRANSLATION
 JAP_price_target_mission: "Příslib rostoucích cen" # todo: NEW TRANSLATION
 JAP_price_target_mission_desc: "Vyhlášení cíle nestačí. Musíme v přiděleném čase ukázat viditelné známky růstu cen a přesvědčit zemi, že změna skutečně začala." # todo: NEW TRANSLATION
 JAP_cash_transfers_households: "Přímá podpora domácností" # todo: NEW TRANSLATION
 JAP_cash_transfers_households_desc: "Když jsou obavy z budoucnosti silné, oživení nezačne samo. Stát musí vložit kupní sílu přímo do rukou domácností. Podpora zaměřená na nízkopříjmové a středněpříjmové skupiny se s větší pravděpodobností promění ve skutečnou spotřebu a okamžitě posílí domácí poptávku." # todo: NEW TRANSLATION
 JAP_cash_transfers_households_decision: "Platby domácnostem s nízkými a středními příjmy" # todo: NEW TRANSLATION
 JAP_cash_transfers_households_decision_desc: "Doručte podporu skupinám, které ji nejspíše utratí, a přímo zvyšte poptávku." # todo: NEW TRANSLATION
 Japan_economy.19.t: "Podpůrné platby vykazují známky oživení" # todo: NEW TRANSLATION
 Japan_economy.19.d: "Peníze doručené přímo domácnostem už neleží ladem. Začínají proudit na trh. Nárůst výdajů je obzvlášť patrný u nízkopříjmových a středněpříjmových skupin a peněženky, které zůstávaly tak dlouho zavřené, se konečně začínají otevírat." # todo: NEW TRANSLATION
 Japan_economy.19.a: "Poptávku lze stále probudit." # todo: NEW TRANSLATION
 JAP_temporary_tax_cuts: "Dočasné daňové úlevy" # todo: NEW TRANSLATION
 JAP_temporary_tax_cuts_desc: "Dočasné snížení daní dává domácnostem důvod utrácet nyní, urychluje odkládané nákupy a dodává poptávce ve stagnující ekonomice viditelný impuls." # todo: NEW TRANSLATION
 JAP_temporary_consumption_tax_cut: "Dočasné snížení spotřební daně" # todo: NEW TRANSLATION
 JAP_temporary_consumption_tax_cut_desc: "Vytvořte důvod utrácet nyní a proměňte odloženou spotřebu v impuls pro oživení." # todo: NEW TRANSLATION
 Japan_economy.20.t: "Daňové úlevy vykazují známky oživení" # todo: NEW TRANSLATION
 Japan_economy.20.d: "Dočasné snížení daní dalo domácnostem důvod jednat nyní. Odkládané nákupy se začínají vracet a atmosféra stagnace začíná praskat. Může jít o krátkodobé opatření, ale ukázalo skutečnou sílu při uvolňování slabé poptávky." # todo: NEW TRANSLATION
 Japan_economy.20.a: "Nyní je čas jednat." # todo: NEW TRANSLATION
 JAP_active_public_investment: "Agresivní veřejné investice" # todo: NEW TRANSLATION
 JAP_active_public_investment_desc: "Pokud soukromé firmy zůstanou opatrné, vláda musí vytvořit poptávku sama a nasměrovat peníze do místních ekonomik a zaměstnanosti. Veřejné investice obnoví pocit, že se pohyb konečně vrátil." # todo: NEW TRANSLATION
 JAP_active_public_investment_decision: "Nařídit veřejné investice" # todo: NEW TRANSLATION
 JAP_active_public_investment_decision_desc: "Vytvořte poptávku prostřednictvím státní činnosti a obnovte tok peněz do místních ekonomik a zaměstnanosti." # todo: NEW TRANSLATION
 Japan_economy.21.t: "Veřejné investice vykazují známky oživení" # todo: NEW TRANSLATION
 Japan_economy.21.d: "Projekty nařízené státem začínají znamenat více, než naznačují samotná čísla. Peníze proudí do místních ekonomik, zaměstnanost se probouzí a až příliš známá atmosféra ekonomického pesimismu se začíná měnit. Země konečně cítí, že udělala krok za čekání." # todo: NEW TRANSLATION
 Japan_economy.21.a: "Stát může rozhýbat ekonomiku." # todo: NEW TRANSLATION
 JAP_improvement_private_investment_climate: "Zlepšit prostředí pro soukromé investice" # todo: NEW TRANSLATION
 JAP_improvement_private_investment_climate_desc: "Samotné vládní výdaje oživení nedokončí. Firmám je třeba vrátit důvěru k investování a snížit nejistotu ohledně budoucnosti. Trvalé oživení vyžaduje, aby podniky přešly z obrany zpět k expanzi." # todo: NEW TRANSLATION
 JAP_focus_improving_investment_climate: "Zaměřit se na zlepšení investičního prostředí" # todo: NEW TRANSLATION
 JAP_focus_improving_investment_climate_desc: "Vláda upřednostňuje vytvoření příznivějšího prostředí pro podnikatelské investice. Politický kapitál se vynakládá na koordinaci, přesvědčování a institucionální reformu, takže zbývá méně prostoru pro jiné krátkodobé iniciativy." # todo: NEW TRANSLATION
 Japan_economy.02.t: "Prostředí pro soukromé investice se zlepšuje" # todo: NEW TRANSLATION
 Japan_economy.02.d: "Podniky začínají chápat, že setrvávat navždy v obranné pozici znamená přicházet o příležitosti. Nejistota přetrvává, ale část břemene, které brzdilo nové investice, začíná mizet. Poprvé už oživení nevypadá jako něco, co bude čistě řízeno státem." # todo: NEW TRANSLATION
 Japan_economy.02.a: "Soukromý sektor se probouzí." # todo: NEW TRANSLATION
 JAP_stimulating_demand_durable_goods: "Podpořit poptávku po zboží dlouhodobé spotřeby" # todo: NEW TRANSLATION
 JAP_stimulating_demand_durable_goods_desc: "Zboží dlouhodobé spotřeby, jako jsou automobily, spotřebiče a nákupy spojené s bydlením, může po rozběhnutí poptávky povznést mnohem více než jen vlastní odvětví. V dobách stagnace však tyto nákupy často patří mezi první odkládané. Jejich oživení by dodalo obnově viditelný impuls a vrátilo dlouho chybějící pocit vitality." # todo: NEW TRANSLATION
 JAP_stimulating_demand_durable_goods_decision: "Kampaň za nákup zboží dlouhodobé spotřeby" # todo: NEW TRANSLATION
 JAP_stimulating_demand_durable_goods_decision_desc: "Podpořte velké nákupy odkládané celé roky a dodejte oživení viditelný impuls." # todo: NEW TRANSLATION
 Japan_economy.22.t: "Poptávka po zboží dlouhodobé spotřeby vykazuje známky oživení" # todo: NEW TRANSLATION
 Japan_economy.22.d: "Velké nákupy, které byly celé roky odkládány, se konečně začínají vracet. Poptávka po zboží dlouhodobé spotřeby má široké dopady na související odvětví a zároveň signalizuje, že domácnosti začínají být alespoň trochu optimističtější ohledně budoucnosti. Oživení se začíná objevovat nejen v datech, ale i v atmosféře každodenního života." # todo: NEW TRANSLATION
 Japan_economy.22.a: "Nechme tento impuls šířit." # todo: NEW TRANSLATION
 JAP_strict_audits_banks: "Přísné kontroly bank" # todo: NEW TRANSLATION
 JAP_strict_audits_banks_desc: "Roky odkladů způsobily, že rány bankovního systému jsou hůře viditelné, zatímco finanční úzkost se dál šíří. Prvním krokem je vytáhnout nebezpečné špatné úvěry ze stínů a přimět banky čelit realitě. Bude to bolestivé, ale bez této bolesti nemůže přijít skutečné oživení." # todo: NEW TRANSLATION
 JAP_injection_public_funds: "Vložení veřejného kapitálu" # todo: NEW TRANSLATION
 JAP_injection_public_funds_desc: "Je nerealistické požadovat po oslabených bankách současně likvidaci ztrátových úvěrů a obnovení úvěrování bez podpory. Má-li být zachována důvěra v samotný finanční systém, musí stát zasáhnout jako poslední záchranná síť a zastavit řetěz zhroucení. Je to politicky obtížné rozhodnutí, ale možnostem vyhnutí se mu mnoho nezbývá." # todo: NEW TRANSLATION
 JAP_new_lenders: "Pozvat nové věřitele" # todo: NEW TRANSLATION
 JAP_new_lenders_desc: "Pokud stávající banky zůstanou uvězněny v obranné opatrnosti, tok úvěrů zůstane slabý. Je třeba povzbudit nové věřitele ke vstupu na trh a prolomit samotné finanční úzké hrdlo. Konkurence a nové kanály kapitálu mohou obnovit část pružnosti, o kterou japonský finanční systém přišel." # todo: NEW TRANSLATION
 JAP_new_lenders_idea: "Vzestup nových věřitelů" # todo: NEW TRANSLATION
 JAP_new_lenders_idea_desc: "Začínají se objevovat nové zdroje úvěrů mimo tradiční banky. Finanční blokáda nebyla zcela odstraněna, ale otevírají se nové cesty, jimiž může kapitál proudit ekonomikou." # todo: NEW TRANSLATION
 JAP_protection_deposits: "Zavést ochranu vkladů" # todo: NEW TRANSLATION
 JAP_protection_deposits_desc: "Jakmile vkladatelé začnou pochybovat o bezpečí svých úspor, bankovní krize se stává skutečností. Stát proto musí dát naprosto jasně najevo, že vklady budou chráněny. Samo o sobě to důvěru plně neobnoví, ale stále se to může stát zdí, která zabrání panice přerůst v kolaps." # todo: NEW TRANSLATION
 JAP_rehabilitation_small_medium_enterprises: "Úvěrová záchranná síť pro malé podniky" # todo: NEW TRANSLATION
 JAP_rehabilitation_small_medium_enterprises_desc: "Likvidace špatných úvěrů hrozí uvržením malých a středních podniků do finančních potíží spolu s insolventními firmami. Banky musí zachovat úvěrování životaschopných malých a středních podniků, zatímco programy restrukturalizace financování sledují zpřísňování úvěrů a staví hráz kolapsu místních ekonomik." # todo: NEW TRANSLATION
 JAP_rehabilitation_small_medium_enterprises_idea: "Zaměření na stabilitu úvěrů pro malé a střední podniky" # todo: NEW TRANSLATION
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "Politické zdroje se soustřeďují na dohled, koordinaci a podporu restrukturalizace, aby likvidace špatných úvěrů neodřízla malé a střední firmy od financování. Je to zásadní pro ochranu místních ekonomik, ale ponechává méně prostoru pro kroky v jiných oblastech." # todo: NEW TRANSLATION
 JAP_overcome_the_slump: "Posunout oživení vpřed" # todo: NEW TRANSLATION
 JAP_overcome_the_slump_desc: "Probíhající opatření již posunula dostatečnou část bilance, aby stálo za to je upevnit. Podpora označovaná za dočasnou se zapisuje do základního rozpočtu, ministerstva přestávají považovat útlum za výchozí předpoklad a firmám se otevřeně říká, že se očekává udržení poptávky. Každý krok zmírní §Y$JAP_entrenched_demand_shortfall_idea_1$§! o jednu úroveň; pokud bude tento krok proveden nakonec, definitivně ukončí dlouhý útlum." # todo: NEW TRANSLATION
 JAP_expectation_of_being_rewarded: "Očekávání odměny" # todo: NEW TRANSLATION
 JAP_expectation_of_being_rewarded_desc: "Oživení vyžaduje obnovit přesvědčení, že úsilí bude odměněno mzdami a životní úrovní. Bez růstu mezd zůstane stimulace dočasná a teprve toto očekávání promění oživení v soběstačný proces." # todo: NEW TRANSLATION
 JAP_wage_negotiations: "Vyjednávat o vyšších mzdách" # todo: NEW TRANSLATION
 JAP_wage_negotiations_decision: "Obnovit důvěru v růst mezd a zabránit tomu, aby se oživení poptávky skončilo jako dočasný záblesk stimulace." # todo: NEW TRANSLATION
 Japan_economy.12.t: "Jednání o mzdách s podniky" # todo: NEW TRANSLATION
 Japan_economy.12.d: "Má-li se oživení poptávky stát soběstačným, musí růst i mzdy. Podniky však zůstávají obezřetné kvůli budoucím rizikům a tlaku na zisky. Vláda se nyní musí rozhodnout, jak důrazně bude tlačit na zvýšení platů." # todo: NEW TRANSLATION
 Japan_economy.12.a: "Povzbudit růst mezd." # todo: NEW TRANSLATION
 Japan_economy.12.b: "Vyvinout tlak." # todo: NEW TRANSLATION
 Japan_economy.12.c: "Nechat to na soukromém sektoru." # todo: NEW TRANSLATION
 Japan_economy.14.t: "Růst mezd dosáhl cíle" # todo: NEW TRANSLATION
 Japan_economy.14.d: "Mzdy se konečně začaly viditelně zvyšovat. Důležitý není jen samotný růst příjmů, ale i návrat hlubšího pocitu, že úsilí může být znovu odměněno. Tato změna nálady začíná měnit slabou spotřebu v něco silnějšího a trvalejšího." # todo: NEW TRANSLATION
 Japan_economy.14.a: "Oživení se stává skutečností." # todo: NEW TRANSLATION
 Japan_economy.15.t: "Růst mezd zaostal za cílem" # todo: NEW TRANSLATION
 Japan_economy.15.d: "Růst mezd nedosáhl cíle, ale vynaložené úsilí nepřišlo vniveč. Podniky zůstávají opatrné, avšak potřeba vyšších mezd je nyní chápána šířeji než dříve. Pokrok je malý, ale stále důležitý pro prolomení staré atmosféry stagnace." # todo: NEW TRANSLATION
 Japan_economy.15.a: "Na tom dále stavíme." # todo: NEW TRANSLATION
 JAP_demand_recovery_progress_tt: "§YPokrok oživení poptávky§!: $RIGHT|+=0$" # todo: NEW TRANSLATION
 JAP_demand_recovery_progress_tier_1_TT: "§YPokrok oživení poptávky§! je alespoň §G30§!" # todo: NEW TRANSLATION
 JAP_demand_recovery_progress_tier_2_TT: "§YPokrok oživení poptávky§! je alespoň §G60§!" # todo: NEW TRANSLATION
 JAP_demand_recovery_progress_complete_TT: "§YPokrok oživení poptávky§! je alespoň §G85§!" # todo: NEW TRANSLATION
 JAP_demand_shortfall_resolved: "Japonský §Yútlum poptávky§! byl překonán" # todo: NEW TRANSLATION
 JAP_corporate_restructuring_progress_tt: "§YPokrok restrukturalizace podniků§!: $RIGHT|+=0$" # todo: NEW TRANSLATION
 Japan_economy.12_a_TT: "Šance, že růst mezd dosáhne cílové částky, je §Ypadesát na padesát§!" # todo: NEW TRANSLATION
 Japan_economy.12_b_TT: "Šance, že růst mezd dosáhne cílové částky, je §Gvysoká§!" # todo: NEW TRANSLATION
 Japan_economy.12_c_TT: "Šance, že růst mezd dosáhne cílové částky, je §Rnízká§!" # todo: NEW TRANSLATION
 JAP_wage_negotiations_TT: "§YPokrok oživení poptávky§! se zvýší, ale částka závisí na výsledku §Yjednání o mzdách§!" # todo: NEW TRANSLATION
 JAP_asteroid_mining_network_established: "Pro [JAP.GetNameWithFlag] byla zřízena síť těžby asteroidů" # todo: NEW TRANSLATION
 JAP_asteroid_mining_operation_active: "V současnosti probíhá těžba asteroidu" # todo: NEW TRANSLATION
 Japan_economy.32.t: "Okresní soud zastavil restart" # todo: NEW TRANSLATION
 Japan_economy.32.d: "Okresní soud vydal předběžné opatření blokující restart jaderného reaktoru s odvoláním na nevyřešené pochybnosti o seismické bezpečnosti a evakuačních plánech v okolí elektrárny. Rozhodnutí není konečné, ale zmrazuje návrat reaktoru do provozu, dokud případ prochází odvoláním. Místní obyvatelé a protijaderné skupiny se rozhodnutí chopily, zatímco energetické společnosti varují před náklady pokračující nevyužité kapacity." # todo: NEW TRANSLATION
 Japan_economy.32.a: "Bojovat u odvolacích soudů." # todo: NEW TRANSLATION
 Japan_economy.32.b: "Posílit místní bezpečnostní záruky." # todo: NEW TRANSLATION
 JAP_zombie_firms_investigation: "Vyšetřovat zombie firmy" # todo: NEW TRANSLATION
 JAP_zombie_firms_investigation_desc: "Banky prodlužovaly úvěry insolventním dlužníkům a křížové vlastnictví akcií umožňovalo manažerům vzájemně se krýt. Auditoři nyní vstupují do účetních knih, pojmenovávají firmy přežívající pouze díky neustále prodlužovaným úvěrům a nutí čísla vyjít najevo." # todo: NEW TRANSLATION
 JAP_zombie_firms_investigation_TT: "Otevře vyšetřování. Spisy případu se vytvářejí prostřednictvím §Y$JAP_zombie_investigation_category$§! a firmy se budou bránit." # todo: NEW TRANSLATION
 JAP_zombie_investigation_idea: "Vyšetřování zombie firem" # todo: NEW TRANSLATION
 JAP_zombie_investigation_idea_desc: "Auditoři procházejí účetní knihy insolventních firem. Nejistota otřásá vedením podniků a zpomaluje úřady, zatímco vyšetřování pokračuje." # todo: NEW TRANSLATION
 JAP_zombie_investigation_running: "Probíhá vyšetřování zombie firem" # todo: NEW TRANSLATION
 Japan_economy.06.t: "Firmy se brání" # todo: NEW TRANSLATION
 Japan_economy.06.d: "Jakmile auditoři požádají o skutečná čísla, začíná lobbování. Průmyslové federace varují před masovými bankroty a ztrátou pracovních míst a spřátelení úředníci radí trpělivost. Banky by raději vykázaly ztráty podle vlastního harmonogramu, pokud vůbec. Můžeme je přinutit, nechat je předložit, co samy zvolí, nebo rozhodnout, že to nikdy nestálo za námahu." # todo: NEW TRANSLATION
 Japan_economy.06.a: "Předvolat účetní knihy" # todo: NEW TRANSLATION
 Japan_economy.06.b: "Nechat banky vykázat údaje samy" # todo: NEW TRANSLATION
 Japan_economy.07.t: "Banka na pokraji zhroucení" # todo: NEW TRANSLATION
 Japan_economy.07.d: "Audit odhalil regionálního věřitele topícího se ve špatných úvěrech. Vynutit zveřejnění celé bilance by mohlo rozšířit paniku; omezení zveřejnění udrží hnilobu napůl skrytou, ale trhy zůstanou klidné. Ať už tak či onak, vyšetřování pokračuje." # todo: NEW TRANSLATION
 Japan_economy.07.a: "Vynutit úplné zveřejnění" # todo: NEW TRANSLATION
 Japan_economy.07.b: "Omezit následky" # todo: NEW TRANSLATION
 Japan_economy.08.t: "Zjištění jsou zveřejněna" # todo: NEW TRANSLATION
 Japan_economy.08.d: "Zpráva míří do tiskáren. Její obsah zcela závisí na tom, co bylo auditorům dovoleno zjistit: katalog insolventních firem a úředníků, kteří je chránili, částečný přehled s nejhoršími jmény začerněnými, nebo dokument o několika stech stranách, který nikoho z ničeho neobviňuje. Veřejnost si ji přečte tak jako tak, stejně jako lidé, kterým byly slíbeny transparentní trhy západního typu." # todo: NEW TRANSLATION
 Japan_economy.08.a: "Zveřejnit vše a nechat veřejnost rozhodnout" # todo: NEW TRANSLATION
 JAP_zombie_investigation_western_pop_TT: "Zveřejnění shovívavosti zdiskredituje prozápadní reformní blok: §Rpopularita liberální strany klesne§!" # todo: NEW TRANSLATION
 JAP_controlled_downsize: "Řízené zmenšení" # todo: NEW TRANSLATION
 JAP_controlled_downsize_desc: "Program finanční revitalizace uplatňuje přísnější oceňování aktiv a tvorbu opravných položek na základě diskontovaných peněžních toků a nutí veřejný kapitál vstoupit do bilancí, které samy neobstojí. Insolventní firmy jsou likvidovány a továrny zavírány, čímž se pracovníci uvěznění mezi chodícími mrtvolami vracejí mezi živé." # todo: NEW TRANSLATION
 JAP_complete_downsizing: "Úplné zmenšení ekonomiky" # todo: NEW TRANSLATION
 JAP_complete_downsizing_desc: "Likvidace je dokončena. Úvěry nyní proudí k firmám, které je dokážou splatit, s půdou se obchoduje za ceny odrážející její využití a vedení už neměří úspěch počtem zaměstnanců. Toto je ekonomika, kterou reformátoři slibovali: menší na papíře, ale mnohem silnější v účetních knihách." # todo: NEW TRANSLATION
 JAP_venture_capital_funds: "Fondy rizikového kapitálu" # todo: NEW TRANSLATION
 JAP_venture_capital_funds_desc: "Japan Innovation Network Corporation vkládá státní kapitál do soukromých startupů a spojuje riziko podnikání s veřejnou podporou. Japonské domácnosti drží obrovské úspory, které se téměř nikdy nedostanou k zakladateli, a takto se tento kapitál uvede do pohybu." # todo: NEW TRANSLATION
 JAP_infrastructure_investments: "Investice do infrastruktury" # todo: NEW TRANSLATION
 JAP_infrastructure_investments_desc: "Základní plán národní odolnosti zavazuje Ministerstvo půdy, infrastruktury, dopravy a cestovního ruchu k obnově mostů, tunelů a protipovodňových hrází vybudovaných během desetiletí rychlého růstu, z nichž většina již slouží přes padesát let. Veřejné stavby jsou tepnami průmyslového národa, jsou-li provedeny správně." # todo: NEW TRANSLATION
 JAP_growth_tax_reform: "Daňové změny na podporu růstu" # todo: NEW TRANSLATION
 JAP_growth_tax_reform_desc: "Japonsko dlouho neslo jedno z nejtěžších daňových zatížení podniků v rozvinutém světě. Postupné reformy snížily efektivní sazbu z přibližně třiceti sedmi procent směrem k dvaceti procentům, rozšířily základnu, snížily sazbu a odměnily firmy, které zvyšují mzdy a investují doma. Společnost, která nechává své zisky pracovat, má pro státní pokladnu větší cenu než ta, která je hromadí." # todo: NEW TRANSLATION
 JAP_startup_education_programs: "Vzdělávací programy pro nové společnosti" # todo: NEW TRANSLATION
 JAP_startup_education_programs_desc: "Programy EDGE a EDGE-NEXT zavádějí podnikatelské vzdělávání na národní univerzity a kanceláře pro licencování technologií mění laboratorní patenty ve společnosti. Absolvent Todai nebo Tokyo Tech by měl považovat založení firmy za kariéru, nikoli za ostudu, kterou musí vysvětlovat rodičům." # todo: NEW TRANSLATION
 JAP_retirement_reform: "Důchodová reforma" # todo: NEW TRANSLATION
 JAP_retirement_reform_desc: "Revidovaný zákon o stabilizaci zaměstnanosti starších osob žádá zaměstnavatele, aby zajišťovali pracovní příležitosti až do sedmdesáti let. Senioři jsou zdraví, zkušení a ochotní pracovat; jejich udržení v pracovní síle zmírňuje důchodovou zátěž a vrací desetiletí nahromaděného řemesla na podlahu továrny." # todo: NEW TRANSLATION
 JAP_forced_mergers: "Fúze" # todo: NEW TRANSLATION
 JAP_forced_mergers_desc: "Místo aby ministerstvo nechalo slabé firmy zaniknout, spojuje je se silnými: určuje hranice, banky poskytují kapitál a nikdo nemusí přiznat porážku. Zombie mizí z rejstříku, nešťastní inženýři, zdvojené továrny i opovrhovaní noví páni však zůstávají." # todo: NEW TRANSLATION
 JAP_megabank_consolidation: "Konsolidace megabank" # todo: NEW TRANSLATION
 JAP_megabank_consolidation_desc: "Japonsko slučuje své churavějící městské banky do tří megabank: Mizuho, Sumitomo Mitsui a Mitsubishi UFJ. Fúze pohřbí desetiletí špatných úvěrů v bilancích příliš velkých na to, aby je někdo zpochybňoval, a vytvoří věřitele, jejichž pád by si žádná vláda nemohla dovolit." # todo: NEW TRANSLATION
 JAP_industrial_revitalization_corp: "Korporace průmyslové revitalizace" # todo: NEW TRANSLATION
 JAP_industrial_revitalization_corp_desc: "Korporace průmyslové revitalizace Japonska nakupuje problémové dluhy a ujímá se churavějících firem, mezi nimi Daiei a Kanebo, jedenačtyřiceti společností, které restrukturalizuje. Státní ozdravný nástroj může určovat podmínky, přeskupovat dluhy a tiše rozřeďovat akcionáře způsoby, k nimž by se žádný soukromý věřitel neodvážil." # todo: NEW TRANSLATION
 JAP_national_champion_mergers: "Fúze národních šampionů" # todo: NEW TRANSLATION
 JAP_national_champion_mergers_desc: "METI slučuje ztrátové divize konkurenčních firem a součet označuje za šampiona: Renesas z čipových divizí NEC, Hitachi a Mitsubishi, Japan Display z panelových podniků Sony, Toshiba a Hitachi. Zda tři problémové jednotky dohromady vytvoří jednu zdravou společnost, zůstává pečlivě nevyřčeno." # todo: NEW TRANSLATION
 JAP_keiretsu_cross_shareholding: "Křížové vlastnictví akcií keiretsu" # todo: NEW TRANSLATION
 JAP_keiretsu_cross_shareholding_desc: "Mochiai, síť spřízněných podílů, je tichou architekturou japonského podnikání a každá dosavadní reforma se ji snažila rozplést. Vláda místo toho uzly utahuje a izoluje konglomeráty od aktivistických investorů a nepřátelských převzetí. Pracovní místa zůstávají v bezpečí, stejně jako každý průměrný manažer." # todo: NEW TRANSLATION
 JAP_employment_preservation_pact: "Pakt na zachování zaměstnanosti" # todo: NEW TRANSLATION
 JAP_employment_preservation_pact_desc: "Shushin koyo, celoživotní zaměstnání, nikdy nebylo zákonem, ale dohodou mezi firmou, odbory a státem udržovanou adaptačními dotacemi. Vláda ji zapisuje do pravidel: žádný pracovník nepřijde o místo kvůli fúzi. Národ si kupuje sociální klid a platí za něj továrnami, které nikdy nemohou zavřít." # todo: NEW TRANSLATION
 JAP_consolidated_japan_inc: "Konsolidované Japonsko a. s." # todo: NEW TRANSLATION
 JAP_consolidated_japan_inc_desc: "Poslední slabá firma je začleněna do fúze a rejstřík se uzavírá. Šampioni jsou obrovští, ministerstvo může zakreslit průmyslovou mapu na jediný list a zahraniční konkurenti k nim chovají ostražitý respekt náležející každému obru. Uvnitř stále běží zdvojené závody a nešťastní inženýři stále odcházejí v šest.\n-------------\nTento fokus §Godstraní§! §Y$JAP_zombie_companies$§! a §Y$JAP_fusion_restructuring$§!, které vznikly spolu s fúzemi, a natrvalo zanechá §Y$JAP_consolidated_conglomerates$§!." # todo: NEW TRANSLATION
 JAP_restructure_next_tranche: "Vyřešit další tranši" # todo: NEW TRANSLATION
 JAP_restructure_next_tranche_desc: "Dostatečná část účetnictví byla zpracována, aby mohla být jedna dávka definitivně uzavřena. Regulátor zveřejní vyřešené případy, banky zaúčtují ztráty, které dosud odkládaly, a firmy v dané tranši buď vyjdou solventní, nebo přestanou existovat. Každá tranše zmírní §Y$JAP_zombie_companies$§! o jeden stupeň; konečné vyčištění přijde s fokusem na konci zvolené cesty." # todo: NEW TRANSLATION
 JAP_enforce_next_reforms: "Prosadit další reformy" # todo: NEW TRANSLATION
 JAP_enforce_next_reforms_desc: "Opatření již zapsaná v předpisech se uvádějí v platnost, místo aby zůstala pouhými záměry. Stropy, které byly jen doporučující, se stávají vymahatelnými, výjimky napsané pro největší zaměstnavatele se zužují a inspekce dostává personál potřebný k následnému řešení zjištění. Každé kolo zmírní §Y$JAP_karoshi_crisis$§! o jeden stupeň; krize bude definitivně odstraněna fokusem na konci zvolené cesty." # todo: NEW TRANSLATION
 JAP_venture_capital_funds_decision: "Kapitalizovat inovační fond" # todo: NEW TRANSLATION
 JAP_venture_capital_funds_decision_desc: "Vložit veřejné peníze do fondů spolu se soukromými manažery pod podmínkou, že vítěze vyberou manažeři. Zajistí financování jednoho roku soustředěného výzkumného úsilí v nových firmách." # todo: NEW TRANSLATION
 JAP_infrastructure_investments_decision: "Spustit obnovu Čúbu" # todo: NEW TRANSLATION
 JAP_infrastructure_investments_decision_desc: "Vyčlenit civilní stavební kapacitu na obnovu silnic, mostů a inženýrských sítí průmyslového pásu Čúbu. Práce během provádění zaměstnají továrny, ale zanechají infrastrukturu regionu výrazně zlepšenou." # todo: NEW TRANSLATION
 JAP_growth_tax_reform_decision: "Snížit sazbu daně z příjmu právnických osob" # todo: NEW TRANSLATION
 JAP_growth_tax_reform_decision_desc: "Na jeden rok snížit efektivní sazbu daně z příjmu právnických osob a nechat firmám více z toho, co vydělají. Spotřebitelské ceny klesnou, protože společnosti část úlev přenesou na domácnosti." # todo: NEW TRANSLATION
 JAP_startup_education_programs_decision: "Financovat univerzitní program pro startupy" # todo: NEW TRANSLATION
 JAP_startup_education_programs_decision_desc: "Zřídit podnikatelské fakulty a kanceláře pro licencování technologií na národních univerzitách, měnit laboratorní práci ve společnosti a urychlit náš průmyslový výzkum." # todo: NEW TRANSLATION
 JAP_retirement_reform_decision: "Prodloužit záruku zaměstnání do sedmdesáti let" # todo: NEW TRANSLATION
 JAP_retirement_reform_decision_desc: "Dotovat zaměstnavatele, kteří si ponechají kvalifikované pracovníky i po tradičním důchodovém věku. Desetiletí nahromaděného řemesla zůstanou další rok na podlaze továrny." # todo: NEW TRANSLATION
 JAP_rail_modernization: "Modernizace železnic" # todo: NEW TRANSLATION
 JAP_rail_modernization_desc: "Tókaidský šinkansen je páteří nejhustší železniční sítě na světě a jeho kolejová vozidla, signalizace i stanice se obnovují po jednotlivých tratích. Železnice zůstávají páteří průmyslové ekonomiky, která si nemůže dovolit jejich selhání." # todo: NEW TRANSLATION
 JAP_shinkansen_network_expansion: "Rozšíření sítě šinkansenů" # todo: NEW TRANSLATION
 JAP_shinkansen_network_expansion_desc: "Podle zákona o rozvoji celostátní železnice šinkansen tlačí po sobě jdoucí vlády vysokorychlostní hlavní tratě z jádra Tókaida směrem k Hokuriku, Kjúšú a Hokkaidu. Urychlení těchto projektů propojí vzdálené prefektury s národní ekonomikou a zkrátí dodavatelské trasy mezi domovskými ostrovy." # todo: NEW TRANSLATION
 JAP_chuo_shinkansen_maglev: "Maglev Čúó šinkansen" # todo: NEW TRANSLATION
 JAP_chuo_shinkansen_maglev_desc: "Čúó šinkansen je supravodivá maglevová trať společnosti JR Central mezi Tokiem, Nago­jou a Ósakou; její řada L0 drží světový železniční rychlostní rekord 603 km/h. Státní podpora umožní prototypování a hluboké tunelování nejrychlejší komerční železnice, o jakou se kdy kdo pokusil." # todo: NEW TRANSLATION
 JAP_freight_modal_shift: "Přesun nákladní dopravy" # todo: NEW TRANSLATION
 JAP_freight_modal_shift_desc: "Japan Freight Railway vede přesun nákladu z dálkových kamionů na železnici, podporovaný značkou Eco Rail Mark a standardizovanými kontejnery o délce třiceti jedné stopy. Přesun většího množství nákladu po železnici snižuje emise, zmírňuje nedostatek řidičů a posiluje průmyslový dodavatelský řetězec." # todo: NEW TRANSLATION
 JAP_station_city_model: "Model města kolem stanice" # todo: NEW TRANSLATION
 JAP_station_city_model_desc: "JR East proměnila významné terminály v samostatná obchodní města a rozvíjí maloobchodní pasáže známé jako ekinaka a věže kolem stanic Shinagawa, Šibuja a Tokio. Soustředění kanceláří a maloobchodu v dopravních uzlech zvyšuje hodnotu půdy a produktivitu v městském jádru." # todo: NEW TRANSLATION
 JAP_regional_line_preservation: "Zachování regionálních tratí" # todo: NEW TRANSLATION
 JAP_regional_line_preservation_desc: "Jak vylidňování venkova odčerpává cestující, JR West a železnice třetího sektoru se snaží udržet místní tratě otevřené. Místo opuštění venkova budeme dotovat komunitní železnici a zachováme zásobování i mobilitu regionů, které hlavní tratě míjejí." # todo: NEW TRANSLATION
 JAP_port_rail_intermodal: "Intermodální propojení přístavů a železnice" # todo: NEW TRANSLATION
 JAP_port_rail_intermodal_desc: "Politika mezinárodních strategických přístavních uzlů soustřeďuje kontejnerovou dopravu do přístavních klastrů Keihin a Hanshin. Rozšíření železničních vleček přímo v přístavech a vnitrozemských terminálů propojí přístavy přímo s nákladní sítí a umožní přesun kontejnerů z lodi do vlaku bez nečinné kamionové dopravy." # todo: NEW TRANSLATION
 JAP_green_logistics_network: "Síť ekologické logistiky" # todo: NEW TRANSLATION
 JAP_green_logistics_network_desc: "Ekologická logistická síť elektrifikovaných železnic, bateriových a vodíkových lokomotiv a konsolidovaných distribučních center dekarbonizuje přepravu zboží napříč zemí ve snaze dosáhnout uhlíkové neutrality." # todo: NEW TRANSLATION
 JAP_rail_technology_exports: "Vývoz železničních technologií" # todo: NEW TRANSLATION
 JAP_rail_technology_exports_desc: "Japonská vysokorychlostní železnice je vlajkovým vývozním artiklem. Soupravy odvozené od řady E5 tvoří základ tratě Bombaj–Ahmedábád v Indii, 700T slouží tchajwanské vysokorychlostní železnici a financování JICA šíří technologie šinkansenu po celém světě. Získávání těchto zakázek rozšiřuje naše standardy i náš vliv." # todo: NEW TRANSLATION
 JAP_global_rail_superpower: "Světová železniční velmoc" # todo: NEW TRANSLATION
 JAP_global_rail_superpower_desc: "S Čúó šinkansenem dovedeným až do Ósaky a naším vývozem obíhajícím svět, Japonsko stojí jako nesporný lídr vysokorychlostní železnice. Éra maglevu začíná doma a vyzařuje ven, jako trvalý symbol japonského inženýrství." # todo: NEW TRANSLATION
 JAP_chuo_shinkansen_program: "Program Čúó šinkansenu" # todo: NEW TRANSLATION
 JAP_chuo_shinkansen_program_desc: "Specializované národní úsilí o vývoj prototypu supravodivého maglevu, které urychlí náš zvláštní projekt maglevu." # todo: NEW TRANSLATION
 JAP_high_speed_line: "Vysokorychlostní trať" # todo: NEW TRANSLATION
 JAP_high_speed_line_desc: "Nový koridor šinkansenu zvýší regionální produktivitu, urychlí místní výstavbu a rozšíří průchodnost dodávek." # todo: NEW TRANSLATION
 JAP_rail_category: "Železniční sektor" # todo: NEW TRANSLATION
 JAP_hokuriku_shinkansen_extension: "Hokuriku šinkansen: Kanazawa–Tsuruga" # todo: NEW TRANSLATION
 JAP_hokuriku_shinkansen_extension_desc: "Prodloužit Hokuriku šinkansen z Kanazawy do Tsurugy, úsek otevřený v roce 2024, a propojit pobřeží Japonského moře s celostátní vysokorychlostní sítí." # todo: NEW TRANSLATION
 JAP_nishi_kyushu_shinkansen: "Nishi Kjúšú šinkansen" # todo: NEW TRANSLATION
 JAP_nishi_kyushu_shinkansen_desc: "Otevřít trasu Nishi Kjúšú do Nagasaki, v provozu od roku 2022, a přivést západní Kjúšú do sítě šinkansenu." # todo: NEW TRANSLATION
 JAP_sanyo_shinkansen_upgrade: "Modernizace Sanyo šinkansenu" # todo: NEW TRANSLATION
 JAP_sanyo_shinkansen_upgrade_desc: "Nasadit kolejová vozidla N700S a modernizovat hlavní trať mezi Ósakou a Hakatou pro vyšší rychlosti a větší spolehlivost." # todo: NEW TRANSLATION
 JAP_tohoku_shinkansen_upgrade: "Tóhoku šinkansen 320 km/h" # todo: NEW TRANSLATION
 JAP_tohoku_shinkansen_upgrade_desc: "Provozovat vlaky řady E5 rychlostí 320 km/h na hlavní trati Tóhoku a zkrátit dobu cest z Tokia směrem k Aomori." # todo: NEW TRANSLATION
 JAP_hokkaido_shinkansen_sapporo: "Hokkaido šinkansen: prodloužení do Sappora" # todo: NEW TRANSLATION
 JAP_hokkaido_shinkansen_sapporo_desc: "Prorazit tunely a vybudovat viadukty pro vedení šinkansenu ze Shin-Hakodate-Hokuto až do Sappora." # todo: NEW TRANSLATION
 JAP_shikoku_shinkansen: "Šikoku šinkansen" # todo: NEW TRANSLATION
 JAP_shikoku_shinkansen_desc: "Uskutečnit dlouho plánovanou trať základního plánu a poprvé přivést vysokorychlostní železnici na ostrov Šikoku." # todo: NEW TRANSLATION
 JAP_plutonium_stockpile_concern: "Zásoby separovaného plutonia" # todo: NEW TRANSLATION
 JAP_galapagos_syndrome: "Galapážský syndrom" # todo: NEW TRANSLATION
 JAP_galapagos_syndrome_desc: "Japonsko vybudovalo uvnitř vlastních hranic úplný technologický svět a poté zjistilo, že z něj nedokáže nic vyvážet. Jeho mobilní sítě běžely na PDC, zatímco zbytek planety standardizoval GSM, takže žádný domácí telefon nebylo možné prodat v zahraničí a žádný zahraniční telefon zde. Prohlížení internetu přišlo přes i-mode a platby přes FeliCa, v obou případech o roky napřed před zahraničím a v obou případech nekompatibilní se vším za hranicemi. Domácí certifikace, specifikace JIS a nákupy v rámci keiretsu dokonaly zbytek a naplnily domácí trh produkty navrženými pro zákazníka, který nikde jinde neexistuje. Sto dvacet milionů spotřebitelů stačí k udržení průmyslu a jen stěží stačí k tomu, aby jej přinutili expandovat ven.\n-------------\nTento národní duch se sám nezmírňuje. §RRychlost výzkumu§! se během uzavřenosti Japonska neustále snižuje; dočasná opatření pokles zpomalují, ale nikdy neobrátí. Odstraní jej pouze cesta §YIntegrace se světem§!, dovedená na §G85§! §Yotevřenosti§!. Aktuální údaje naleznete v §Y$JAP_technological_isolation_category$§!." # todo: NEW TRANSLATION
 JAP_galapagos_modifier: "Galapážské odcizení" # todo: NEW TRANSLATION
 JAP_galapagos_modifier_desc: "Průběžné hodnocení toho, jak daleko se Japonsko odchýlilo od světa, s nímž obchoduje. Výzkum každý měsíc o něco více zaostává, pokud země trvá na vlastních standardech, a čím dále je od standardů používaných jejími zákazníky, tím rychleji zaostává. Dočasná opatření tento pokles zpomalují. Zastaví jej pouze skutečná integrace." # todo: NEW TRANSLATION
 JAP_galapagos_resolved: "Japonsko uniklo ze své galapážské izolace" # todo: NEW TRANSLATION
 JAP_galapagos_syndrome_focus: "Galapážská otázka" # todo: NEW TRANSLATION
 JAP_galapagos_syndrome_focus_desc: "Domácí trh Japonska je ziskový a zmenšuje se, chráněný standardy, které zemi uzavírají před vším ostatním. Ministerstvo diskutuje, zda je odpovědí konvergence, přepsání standardů tak, aby odpovídaly světu, nebo komercializace, tedy prodej této odlišnosti samotné. Částečná opatření zpomalují odcizení výzkumu, ale žádné z nich neřeší volbu, která se za tím skrývá." # todo: NEW TRANSLATION
 JAP_galapagos_openness_up_tt: "§YOtevřenost§! $RIGHT|+=0$" # todo: NEW TRANSLATION
 JAP_galapagos_openness_down_tt: "Snižuje §YOtevřenost§! o $RIGHT|+=0$ a obrací Japonsko více dovnitř, pryč od zahraničních standardů a trhů" # todo: NEW TRANSLATION
 JAP_galapagos_research_drift_recover_tt: "§YOdcizení výzkumu§! $RIGHT|+=%1$, nikdy nad §Y0§!" # todo: NEW TRANSLATION
 JAP_galapagos_research_drift_down_tt: "§YOdcizení výzkumu§! se během tohoto hodnocení zhorší o $RIGHT|+=%1$ a nikdy nemůže klesnout pod §R-15%§!" # todo: NEW TRANSLATION
 JAP_galapagos_drift_review_mission: "Mezera ve standardech" # todo: NEW TRANSLATION
 JAP_galapagos_drift_review_mission_desc: "Ministerstvo hospodářství, obchodu a průmyslu průběžně vyhodnocuje, jak dalece se japonské specifikace odchýlily od specifikací používaných jeho zákazníky, a každých třicet dní zveřejňuje výsledek. Každé hodnocení je horší než předchozí, protože rozdíly se hromadí, zatímco se s nimi nic nedělá, a certifikační orgány dál nejprve sepisují domácí ustanovení. Čím nižší je §YOtevřenost§!, tím rychleji se mezera rozšiřuje; při §G100§! se její rozšiřování zcela zastaví.\n-------------\nHodnocení se natrvalo uzavře, jakmile Japonsko na cestě §Y$JAP_world_integration$§! dosáhne §G85§! §YOtevřenosti§!. Nic jiného je neukončí." # todo: NEW TRANSLATION
 JAP_galapagos_cure_condition_TT: "§YOtevřenost§! dosahuje alespoň §G85§! (aktuálně [?JAP_galapagos_openness|Y0]), čímž rozpouští §Y$JAP_galapagos_syndrome$§!" # todo: NEW TRANSLATION
 JAP_galapagos_dissolution_tt: "Syndrom ustupuje. Japonsko se §Rvzdává§! levného spotřebního zboží, které poskytoval uzavřený trh, a vysoké §Robrany proti zahraničnímu vlivu§!, kterou izolace umožňovala, a §Gzbavuje se§! odcizení výzkumu, investičních postihů a stropu vlastního vlivu v zahraničí:" # todo: NEW TRANSLATION
 JAP_technological_isolation_category: "Galapágy a válka elektroniky" # todo: NEW TRANSLATION
 JAP_technological_isolation_category_desc: "Japonský průmysl zdokonalil produkty určené pouze pro Japonsko: vynikající telefony, standardy a služby, které nikdo mimo domácí trh nemohl používat, zatímco zbytek světa se standardizoval podle někoho jiného. Stejná uzavřenost nyní vystavuje japonský polovodičový sektor tlaku, zatímco Čína stoupá po technologickém žebříčku.\n\n§YGalapážský syndrom§!\n§YOtevřenost§!: [?JAP_galapagos_openness|0] / 100\n§Y$JAP_galapagos_drift_review_mission$§! hodnotí odcizení každých třicet dní a před použitím zobrazuje přesnou hodnotu. Čím nižší je otevřenost, tím rychleji výzkum zaostává, při §G100§! až k úplnému zastavení, nikdy však hůře než §R-15%§!.\n§GZvyšování otevřenosti§!: většinu zajišťují zaměření integrace a zbytek zaměření elektroniky. Dvě níže uvedené kampaně přidávají trochu více, ale pouze zpomalují odcizení. Syndrom vyléčit nemohou.\n§GOdstranění§!: §Y$JAP_galapagos_syndrome$§! odstraní pouze cesta §Y$JAP_world_integration$§!, a to teprve poté, co otevřenost překročí §G85§!. Cesta §Y$JAP_cool_japan_doctrine$§! ducha záměrně zachovává a místo toho proměňuje kulturní dosah Japonska ve vliv.\n\n§YSoutěž modelů§!\n§YOdolnost elektroniky§!: [?JAP_electronics_resilience|0]\nTlak Číny začíná na §R1§! a zvyšuje se o §R+1§! za každý polovodičový milník, kterého dosáhne, a o další §R+1§!, dokud je otevřenost pod §R25§!, maximálně však na §R3§!. Rozdíl mezi tlakem a odolností určuje, kterou úroveň §Y$JAP_model_competition$§! Japonsko utrpí. Pokud tlak zcela překonáte, duch zmizí; pokud necháte Čínu neodpovězenou získat náskok, vrátí se.\n§GZvyšování odolnosti§!: poskytují je polovodičová zaměření a níže uvedená exportní ofenzíva přidává další, dokud odolnost nedosáhne §G4§!.\n§RVarování§!: ofenzíva vyžaduje otevřenost nad §G10§!, pokud nebyla přijata §Y$JAP_cool_japan_doctrine$§! a Japonsko se nerozhodlo svou odlišnost prodávat místo skrývání." # todo: NEW TRANSLATION
 JAP_international_standards_adjustment: "Přizpůsobení mezinárodním standardům" # todo: NEW TRANSLATION
 JAP_international_standards_adjustment_desc: "Japonský průmysl si vytváří vlastní standardy, PDC pro mobilní sítě a ISDB pro vysílání, a každý z nich odděluje domácí trh od světa GSM a DVB za hranicemi. Vláda vysílá inženýry do pracovních skupin ISO a IEC, což nedokáže rozdíly přes noc odstranit, ale přináší japonská jména do návrhů, které si za deset let přečtou všechny ostatní země. Cena se platí doma, v testování shody přepisovaném pokaždé, když je nějaké ustanovení postoupeno." # todo: NEW TRANSLATION
 JAP_english_business_environment: "Anglicky mluvící podnikatelské prostředí" # todo: NEW TRANSLATION
 JAP_english_business_environment_desc: "Japonští manažeři nedokážou obsadit své zahraniční pobočky lidmi, kteří by ovládali jazyk, v němž jsou sepsány smlouvy. Vláda podporuje firemní programy angličtiny a experiment Rakutenu, který z angličtiny udělal pracovní jazyk japonské firmy a kterému se všichni vysmívali, dokud se nedostavily výsledky. Stojí to roky ztracené produktivity, zatímco se vedoucí oddělení učí vést schůzi v druhém jazyce, a někteří se to nikdy nenaučí." # todo: NEW TRANSLATION
 JAP_international_standards_adjustment_campaign: "Financovat delegace pro standardy" # todo: NEW TRANSLATION
 JAP_international_standards_adjustment_campaign_desc: "Zaplaťte další rotaci inženýrů v pracovních skupinách ISO, IEC a ITU a pokryjte domácí testování shody, které následuje po každém ustanovení, jež Japonsko postoupí. Delegace se vracejí s návrhy a průmysl dostává rok na přizpůsobení před další revizí. Přestanete-li je financovat, jejich místa získá někdo jiný." # todo: NEW TRANSLATION
 JAP_english_business_environment_campaign: "Dotovat firemní programy angličtiny" # todo: NEW TRANSLATION
 JAP_english_business_environment_campaign_desc: "Podpořte jazykové vzdělávání, za které členské firmy dosud nebyly ochotny platit samy: interní lektory, zkoušky TOEIC během pracovní doby a vyslání do zahraničních kanceláří pro každého, kdo uspěje. Produktivita během studia klesne. Firmy, které vytrvají, už nebudou potřebovat v místnosti překladatele." # todo: NEW TRANSLATION
