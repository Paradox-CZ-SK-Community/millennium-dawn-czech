 JAP_jmu_corporation_naval_manufacturer_header_carrier_aviation: "Letectvo letadlových lodí" # todo: NEW TRANSLATION
 senbu_occupation_law_fake_idea: "Správa pacifikace Senbu" # todo: NEW TRANSLATION
 senbu_occupation_law_fake_idea_desc: "Důstojníci civilní správy řídí okupované oblasti prostřednictvím místních prominentů namísto velitelů posádek, obnovují trhy, školy a distribuci rýže, než začnou požadovat výstup. Ochota spolupracovat stabilně roste a požadavky na posádky zůstávají nízké, ale mírný přístup ponechává organizovanému odporu více prostoru než represivní režim." # todo: NEW TRANSLATION
 JAP_sabotaged_russians: "Sabotovaná ruská zařízení" # todo: NEW TRANSLATION
 JAP_usa_trade_pressure: "Americký obchodní tlak" # todo: NEW TRANSLATION
 JAP_article_nine_balance_of_power_category: "Článek devět" # todo: NEW TRANSLATION
 JAP_article_nine_balance_of_power_category_desc: "Zřeknutí se války v článku devět ústavy není uzavřenou otázkou, ale trvalým sporem mezi kabinetem, soudy, americkým spojenectvím a veřejností. Každá nová interpretace posouvá rovnováhu mezi přísně obranným postojem a běžnou vojenskou mocí." # todo: NEW TRANSLATION
 JAP_cool_japan_doctrine_desc: "Japonský design není podivný proto, že by se nedokázal přizpůsobit zahraničnímu standardu. Je podivný proto, že jej vytvořili pro japonské zákazníky lidé, kteří ani jednou nezvažovali alternativu, a právě proto stojí za koupi. Ministerstvo přestává balit kulturu jako výkladní skříň hardwaru a začíná vyvážet samotnou odlišnost.\n\n§RTato cesta trvale zachovává §Y$JAP_galapagos_syndrome$§!.§! Odstraní jej pouze §Y$JAP_world_integration$§! a tyto dvě cesty se vzájemně vylučují: Japonsko buď sblíží své standardy se světem, nebo světu prodá své vlastní." # todo: NEW TRANSLATION
 JAP_galapagos_sphere_modifier: "Kulturní sféra" # todo: NEW TRANSLATION
 JAP_galapagos_sphere_modifier_desc: "Ministerstvo každé čtvrtletí počítá země, v nichž japonský vliv dosahuje alespoň dvaceti procent, a s celkovým počtem zachází jako se samostatným exportním ukazatelem. Každá země na seznamu rozšiřuje publikum, které už japonský design kupuje, aniž by mu nejprve muselo porozumět, což má hodnotu pro obchodní delegace a ještě větší hodnotu pro firmy, které je následují. Počet se zjišťuje jednou za čtvrt roku a výnos se mění spolu s ním. Sféra, která přestane růst, přestane přinášet zisk." # todo: NEW TRANSLATION
 JAP_cool_japan_sphere_count_mission: "Čtvrtletní sčítání sféry" # todo: NEW TRANSLATION
 JAP_cool_japan_sphere_count_mission_desc: "Jednou za čtvrt roku Úřad pro podporu kreativních průmyslů sečte každou zemi, v níž japonský vliv dosahuje alespoň dvaceti procent, a vykáže celkový počet jako exportní ukazatel. Obchodní delegace podle tohoto seznamu plánují další čtvrtletí a firmy, které je v zahraničí následují, plánují podle delegací. Sféra, která přestane růst, přestane přinášet zisk, a tento počet je jediným místem, kde se objeví dříve než příjmy." # todo: NEW TRANSLATION
 JAP_cool_japan_sphere_count_step_tt: "§YKulturní sféra§!: [?JAP_galapagos_sphere_count|Y0] zemí s §G20%§! nebo vyšším japonským vlivem při posledním sčítání. Každá přináší §G+1%§! §Yzahraničního vlivu§! a §G+0.2%§! §Ynávratnosti investic§!, přičemž s §Y$JAP_electronics_superpower$§! se výnos zvyšuje o polovinu a s §Y$JAP_home_electronics$§! o další čtvrtinu." # todo: NEW TRANSLATION
 JAP_galapagos_sphere_tt: "§YKulturní sféra§!: [?JAP_galapagos_sphere_count|Y0] zemí s §G20%§! nebo vyšším japonským vlivem, počítaných každé čtvrtletí po přijetí §Ydoktríny Cool Japan§!. Výnos se s §Y$JAP_electronics_superpower$§! zvyšuje o polovinu a s §Y$JAP_home_electronics$§! o další čtvrtinu." # todo: NEW TRANSLATION
 JAP_cool_japan_sphere_payout_tt: "Každé čtvrtletí ministerstvo spočítá země, v nichž japonský §Yvliv§! dosahuje alespoň §G20%§!, a vykáže jejich celkový počet jako §Ykulturní sféru§!. Každá země přidává §G+1%§! §Yzahraničního vlivu§! a §G+0.2%§! §Ynávratnosti investic§!, vyplácených prostřednictvím §Ykulturní sféry§! a rostoucích s jejím rozšiřováním. §Y$JAP_electronics_superpower$§! výnos znovu zvýší o polovinu a §Y$JAP_home_electronics$§! jej zvýší o další čtvrtinu.\n-------------\nTo nijak neovlivňuje §Yodcizení výzkumu§!. Doktrína získává dosah v zahraničí; neuzavírá mezeru ve standardech doma." # todo: NEW TRANSLATION
 JAP_creative_industries_office: "Úřad pro podporu kreativních průmyslů" # todo: NEW TRANSLATION
 JAP_creative_industries_office_desc: "Ministerstvo hospodářství, obchodu a průmyslu zřizuje Úřad pro podporu kreativních průmyslů, aby s animací, designem, módou a jídlem zacházelo jako s exportními odvětvími, nikoli kulturou. Následuje fond Cool Japan s padesáti miliardami jenů a mandátem ke spoluinvestování namísto dotování, který nakupuje podíly v zahraničních maloobchodních prodejnách, asijských streamovacích platformách a distribučních podnicích, jež by žádná japonská správní rada sama neschválila. Úředníci jsou špatní investoři rizikového kapitálu a fond vykazuje roky ztrát, ale nese první ztrátu u projektů, do nichž pak vstupuje soukromý kapitál." # todo: NEW TRANSLATION
 JAP_visit_japan_campaign: "Kampaň Visit Japan" # todo: NEW TRANSLATION
 JAP_visit_japan_campaign_desc: "Kampaň Visit Japan je znovu spuštěna s cílem, kterému žádné ministerstvo nevěří: čtyřicet milionů zahraničních návštěvníků ročně. Vláda uvolní vízový režim pro asijské cestovatele, při nákupu osvobodí kosmetiku a léky od spotřební daně a propaguje zemi prostřednictvím věcí, které se nepřekládají. Nic na Japonsku není učiněno méně japonským, aby se lépe prodávalo." # todo: NEW TRANSLATION
 JAP_content_export_offensive: "Exportní ofenzíva obsahu" # todo: NEW TRANSLATION
 JAP_content_export_offensive_desc: "Základní zákon o duševním vlastnictví a zákon o podpoře obsahu zakotvují animaci, hry a mangu jako strategická aktiva, přičemž průmysl stále zachází se zahraničním publikem jako s pirátstvím, které je třeba tolerovat, zatímco distribuci zajišťují fanouškovští překladatelé. Vláda místo toho vybuduje legální kanál: souběžná vydání, profesionální titulky a držitele práv vyjednávající jako blok, nikoli jedno studio po druhém. Zahraniční trh už tvoří větší polovinu příjmů z anime a téměř nic z toho se nevybírá." # todo: NEW TRANSLATION
 JAP_washoku_to_the_world: "Washoku do světa" # todo: NEW TRANSLATION
 JAP_washoku_to_the_world_desc: "Poté, co bylo washoku zapsáno na seznam nehmotného kulturního dědictví UNESCO, vláda nepropaguje pokrm, ale způsob: sezónní surovinu, uspořádání a novoroční stůl. Prvním instinktem ministerstva bylo vše kontrolovat a plán certifikace autentických japonských restaurací v zahraničí byl opuštěn poté, co jej zahraniční tisk pokřtil na sushi policii. Kalifornské rolky a bangkocký ramen prodávají více japonské rýže, sóji a saké, než by kdy dokázal jakýkoli inspektorát, a na tomto obchodu stojí exportní cíl v hodnotě bilionu jenů." # todo: NEW TRANSLATION
 JAP_japan_house_network: "Síť Japan House" # todo: NEW TRANSLATION
 JAP_japan_house_network_desc: "Program JET vyslal tisíce mladých cizinců do japonských škol a městských úřadů a poslal je zpět domů s plynulou znalostí jazyka; nyní působí na ministerstvech zahraničí, v právních firmách a redakcích. Japan House dává této síti vchod: galerii, knihovnu, obchod a restauraci na drahé ulici v São Paulu, Los Angeles a Londýně, provozované ministerstvem zahraničí a záměrně prosté vlajek a politických prohlášení. Počet přihlášek do kurzů japonštiny se v každém městě po otevření ztrojnásobil." # todo: NEW TRANSLATION
 JAP_gross_national_cool: "Hrubá národní coolness" # todo: NEW TRANSLATION
 JAP_gross_national_cool_desc: "Galapážský syndrom přetrvává: specifikace zůstávají japonské a odcizení výzkumu pokračuje. Ministerstva místo toho vybudovala zemi, která v zahraničí vydělává tím, co dokáže vyrobit jen ona: studia, kuchyně, herní domy, designová pracoviště a miliony lidí, kteří každoročně přijíždějí jednoduše proto, aby se dívali. Izolace nebyla nikdy vyléčena, pouze využita." # todo: NEW TRANSLATION
 JAP_cool_japan_spirit_kept_tt: "§YGalapážský syndrom§! §Rpřetrvává§!. Japonsko se rozhodlo svou odlišnost prodávat, nikoli ji léčit" # todo: NEW TRANSLATION
 JAP_electronics_anchor_bonus_tt: "§YElektronická supervelmoc§!: Japonský hardware přináší japonský obsah na každý trh a výnos s tím roste" # todo: NEW TRANSLATION
 JAP_world_integration: "Integrace se světem" # todo: NEW TRANSLATION
 JAP_world_integration_desc: "Japonsko přestává být ostrovem. Standardy jsou přepsány podle cizího návrhu, celní sazby klesají, ministerstva se přestávají ptát, zda je zahraniční nabídka vhodná, a kapitál, který se této zemi třicet let vyhýbal, do ní začíná proudit. To, čeho se země vzdává, je samotná ochrana: uzavřený trh, díky němuž bylo spotřební zboží levné, a zeď proti zahraničnímu vlivu, kterou žádný konkurent nepřekonal. Japonské firmy si nyní musí zasloužit trh, který dříve vlastnily." # todo: NEW TRANSLATION
 JAP_structural_reform_zones: "Zvláštní zóny strukturální reformy" # todo: NEW TRANSLATION
 JAP_structural_reform_zones_desc: "Namísto projednávání regulačního kodexu řádek po řádku proti ministerstvům, která jej napsala, vláda dovolí prefektuře nebo městu požádat o výjimku z pravidla a následně dokázat, že se nebe nezřítí. Zemědělci vaří pod celostátním minimálním objemem, akciové společnosti provozují školy a pronajímají zemědělskou půdu a Národní strategické zvláštní zóny míří stejným nástrojem na Tokio ve financích, Fukuoku v pravidlech zaměstnávání startupů a Kansai v lékařských zkouškách. Je to maloobchodní, nikoli velkoobchodní deregulace a jediná metoda, která kdy skutečně něco posunula." # todo: NEW TRANSLATION
 JAP_corporate_governance_code: "Kodex správy a řízení společností" # todo: NEW TRANSLATION
 JAP_corporate_governance_code_desc: "Itoova zpráva stanovuje číslo označující selhání: osm procent návratnosti vlastního kapitálu je minimum, které musí japonská společnost překonat, aby stála za kapitál, který spotřebovává, a většina jej nepřekonává. Kodex správcovství říká penzijním fondům a pojišťovnám, aby hlasovaly se svými akciemi jako vlastníci, nikoli hosté, a Kodex správy a řízení společností na něj navazuje principem dodržuj, nebo vysvětli. Počet externích ředitelů roste k třetině správní rady a křížové vlastnictví se začíná prodávat, což japonské firmy nečiní zahraničními, ale čitelnými pro každého, kdo je ochoten koupit akcii." # todo: NEW TRANSLATION
 JAP_economic_partnership_agreements: "Dohody o hospodářském partnerství" # todo: NEW TRANSLATION
 JAP_economic_partnership_agreements_desc: "Zemědělství mělo od války právo veta nad japonskou obchodní politikou a vývozci nyní prohrávají tendry s korejskými firmami už jen kvůli celní položce. Japonsko uzavírá největší bilaterální dohodu, jakou kdy kterákoliv strana podepsala s Evropskou unií, a poté přebírá předsednictví Transpacifického partnerství, když Washington odstoupí, přičemž americká ustanovení pozastaví, nikoli smaže. Následuje RCEP a poprvé staví Japonsko, Čínu a Jižní Koreu do jediného obchodního rámce, přičemž rýže je ve všech případech chráněna." # todo: NEW TRANSLATION
 JAP_open_capital_markets: "Otevřít kapitálové trhy" # todo: NEW TRANSLATION
 JAP_open_capital_markets_desc: "Ve vztahu k velikosti své ekonomiky má Japonsko méně zahraničního kapitálu než téměř kterákoli rozvinutá země, což brzdí křížové vlastnictví, nečitelná zveřejňování a čtyřicet let úředníků, kteří považovali zahraniční nabídku za problém, jenž je třeba řídit. Opravy jsou neatraktivní a téměř výhradně administrativní: kanceláře Invest Japan v JETRO, které zahraniční firmu provedou založením společnosti, výsledky zveřejňované v angličtině ve stejný den jako v japonštině a bodový pobytový systém pro lidi, které musí zahraniční pobočka přemístit sem, aby vůbec mohla zahájit činnost. Otázka lidí ve své úplné podobě patří do §Y$JAP_an_open_nation$§!, toto je užší otázka, zda kapitál dokáže najít dveře." # todo: NEW TRANSLATION
 JAP_the_third_opening: "Třetí otevření" # todo: NEW TRANSLATION
 JAP_the_third_opening_desc: "Japonsko opouští poslední ochranná opatření, která z něj činila oddělenou ekonomiku. Vláda otevírá domácí trh zahraniční konkurenci, přepisuje své standardy podle mezinárodních návrhů a dovoluje zahraničnímu kapitálu vstoupit za stejných podmínek jako japonskému. Uzavřený trh i zeď proti vnějšímu vlivu jsou obětovány za zemi, která obchoduje jako jeden signatář mezi mnoha." # todo: NEW TRANSLATION
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: země, která se už otevřela lidem světa, má při otevírání světovému kapitálu mnohem méně důvodů k hádce" # todo: NEW TRANSLATION
