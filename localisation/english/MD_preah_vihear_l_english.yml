 CBD_pv_decisive_victory: "Vyhlásit rozhodující vítězství" # todo: NEW TRANSLATION
 CBD_pv_decisive_victory_desc: "Když je rovnováha bojů jednoznačně na naší straně, využijte výhody: donuťte Thajsko k ponižujícímu ústupu a vyhlašte patovou situaci za národní triumf, aniž byste po našich jednotkách požadovali obsazení jediného nového metru území." # todo: NEW TRANSLATION
 CBD_pv_de_escalate: "Nabídnout deeskalaci" # todo: NEW TRANSLATION
 CBD_pv_de_escalate_desc: "Naznačte zdrženlivost prostřednictvím zákulisních kontaktů s Bangkokem: stáhněte jednotky z předsunutých pozic a zmírněte rétoriku. Nestojí nás to nic kromě politického kapitálu a získáme dobrou vůli, kterou možná později využijeme." # todo: NEW TRANSLATION
 CBD_request_asean_mediation: "Požádat ASEAN o zprostředkování" # todo: NEW TRANSLATION
 CBD_request_asean_mediation_desc: "Požádejte ASEAN o zprostředkování pohraničního sporu s Thajskem. Regionální diplomatické řešení může pomoci ochránit naše nároky." # todo: NEW TRANSLATION
 CBD_appeal_to_icj: "Obrátit se na MSD" # todo: NEW TRANSLATION
 CBD_appeal_to_icj_desc: "Podejte žalobu u Mezinárodního soudního dvora, aby znovu potvrdil svrchovanost Kambodže nad chrámem Preah Vihear a okolním územím." # todo: NEW TRANSLATION
