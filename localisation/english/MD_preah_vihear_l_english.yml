 preah_vihear_news.1.t: "Spor o Preah Vihear vyřešen" # todo: NEW TRANSLATION
 preah_vihear_news.1.d: "Dlouholetý pohraniční spor mezi Thajskem a Kambodžou o chrám Preah Vihear byl vyřešen. Thajsko přijalo rozhodnutí Mezinárodního soudního dvora potvrzující svrchovanost Kambodže nad chrámovým komplexem. Oba národy souhlasily se stažením vojenských sil z oblasti a navázáním běžných diplomatických vztahů." # todo: NEW TRANSLATION
 preah_vihear_news.1.o1: "Regionální stabilita obnovena" # todo: NEW TRANSLATION
 preah_vihear_news.2.t: "ASEAN zprostředkovává pohraniční spor" # todo: NEW TRANSLATION
 preah_vihear_news.2.d: "Thajsko a Kambodža se díky zprostředkování ASEAN dohodly na deeskalaci pohraničního sporu o chrám Preah Vihear. Indonéští pozorovatelé budou monitorovat příměří, zatímco oba národy budou usilovat o diplomatické řešení." # todo: NEW TRANSLATION
 preah_vihear_news.2.o1: "Diplomacie vítězí" # todo: NEW TRANSLATION
 preah_vihear_news.3.t: "Mezi Thajskem a Kambodžou propukají pohraniční střety" # todo: NEW TRANSLATION
 preah_vihear_news.3.d: "Podél thajsko-kambodžské hranice poblíž sporného chrámu Preah Vihear propukly ozbrojené střety. Thajské síly zahájily v oblasti vojenské operace a kambodžské jednotky odpovídají. Byla hlášena dělostřelecká a ruční palba. Starobylý chrámový komplex, památka světového dědictví UNESCO, se ocitl v křížové palbě, zatímco oba národy eskalují svůj územní spor." # todo: NEW TRANSLATION
 preah_vihear_news.3.o1: "Nebezpečná eskalace" # todo: NEW TRANSLATION
 preah_vihear_news.4.t: "Rozhodující vítězství u Preah Vihear" # todo: NEW TRANSLATION
 preah_vihear_news.4.d_sia: "Thajsko dosáhlo rozhodujícího vítězství v dlouhotrvající patové situaci u Preah Vihear a donutilo Kambodžu k ponižujícímu diplomatickému ústupu. Žádné území nezměnilo majitele, ale Bangkok označuje patovou situaci za národní triumf." # todo: NEW TRANSLATION
 preah_vihear_news.4.d_cbd: "Kambodža dosáhla rozhodujícího vítězství v dlouhotrvající patové situaci u Preah Vihear a donutila Thajsko k ponižujícímu diplomatickému ústupu. Žádné území nezměnilo majitele, ale Phnompenh označuje patovou situaci za národní triumf." # todo: NEW TRANSLATION
 preah_vihear_news.4.o1: "Rivalita prozatím rozhodně vyřešena" # todo: NEW TRANSLATION
 SIA_preah_vihear_vindicated: "Obhájení nároku na Preah Vihear" # todo: NEW TRANSLATION
 SIA_preah_vihear_vindicated_desc: "Thajsko zajistilo sporné území kolem chrámového komplexu a vláda nyní sklízí politické výhody dlouhotrvajícího pohraničního sporu vyřešeného podle vlastních podmínek." # todo: NEW TRANSLATION
 SIA_preah_vihear_humiliation: "Ponížení u Preah Vihear" # todo: NEW TRANSLATION
 SIA_preah_vihear_humiliation_desc: "Kambodža nyní ovládá sporné území kolem Preah Vihear a ztráta je napříč politickým spektrem vnímána jako selhání diplomacie i zbraní." # todo: NEW TRANSLATION
