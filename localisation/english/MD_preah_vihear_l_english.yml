 preah_vihear_decrease_progress_50_TT: "§RTím se náš postup v konfliktu sníží o 50§!" # todo: NEW TRANSLATION
 preah_vihear_deescalation_uses_remaining_TT: "Stále máme k dispozici nabídky deeskalace" # todo: NEW TRANSLATION
 preah_vihear_decrease_tension_10_TT: "§GTím se napětí na hranici sníží o 10§!" # todo: NEW TRANSLATION
 preah_vihear_deescalation_used_TT: "§RSpotřebuje jednu z našich omezených nabídek deeskalace§!" # todo: NEW TRANSLATION
 preah_vihear_no_clash_TT: "V současnosti neprobíhá žádný pohraniční střet" # todo: NEW TRANSLATION
 preah_vihear_not_settled_TT: "Otázka hranice nebyla během posledních pěti let vyřešena" # todo: NEW TRANSLATION
 preah_vihear_no_recent_escalation_TT: "V poslední době jsme na hranici nepodnikli žádný provokativní krok" # todo: NEW TRANSLATION
 preah_vihear_no_recent_protest_TT: "V poslední době jsme nepodněcovali nacionalistické nálady" # todo: NEW TRANSLATION
 preah_vihear_progress_80_TT: "Postup v konfliktu je vyšší než 80" # todo: NEW TRANSLATION
