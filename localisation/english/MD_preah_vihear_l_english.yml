l_english:
 preah_vihear_decisions_category: "Pohraniční spor o Preah Vihear" # todo: NEW TRANSLATION
 preah_vihear_decisions_category_desc: "Chrám Preah Vihear, khmerská svatyně z jedenáctého století tyčící se na srázu Dângrêk, leží na hranici, kterou francouzská koloniální mapa a rozhodnutí MSD z roku 1962 vyřešily ve prospěch Kambodže, ale Thajsko je nikdy plně nepřijalo. Zápis na seznam světového dědictví UNESCO z roku 2008 znovu otevřel starou ránu a svah kolem chrámu zůstává sporným územím, i když samotná svatyně nikoli. Eskalace otevírá cestu k boji o sráz. Každý střet spotřebovává zdroje, které by si obě strany raději ponechaly. \n\n§YNapětí na hranici:§! [?GLOBAL.preah_vihear_tension]\n§YNaše připravenost:§! [?THIS.preah_vihear_readiness]\n§YNáš postup v konfliktu:§! [?THIS.preah_vihear_war_progress]" # todo: NEW TRANSLATION
 preah_vihear_dispute: "Spor o chrám Preah Vihear" # todo: NEW TRANSLATION
 preah_vihear_deescalation_goodwill: "Dobrá vůle při deeskalaci" # todo: NEW TRANSLATION
 SIA_escalate_preah_vihear_tensions: "Eskalovat napětí na hranici" # todo: NEW TRANSLATION
 SIA_escalate_preah_vihear_tensions_desc: "Rozviřme patovou situaci naplno: nařiďte přesun jednotek poblíž srázu Dângrêk a nechte nacionalistický tisk, ať toho využije. Phnompenh zprávu pochopí naprosto jasně a tento první krok už nebude možné vzít zpět." # todo: NEW TRANSLATION
 SIA_pv_prepare_infantry_training: "Provést polní cvičení pěchoty" # todo: NEW TRANSLATION
 SIA_pv_prepare_infantry_training_desc: "Střídejte jednotky pěchoty z první linie v ostrých cvičeních v terénu kolem srázu Dângrêk a využijte zásoby ručních palných zbraní a podpůrných zbraní ke zvýšení jejich připravenosti na pohraniční střet s Kambodžou." # todo: NEW TRANSLATION
 SIA_pv_prepare_armor_training: "Provést polní cvičení obrněných jednotek" # todo: NEW TRANSLATION
 SIA_pv_prepare_armor_training_desc: "Přesuňte obrněné jednotky do kopců poblíž Preah Vihear na manévrovací cvičení a ověřte, jak si obojživelné a střední tanky povedou v terénu, který není vhodný ani pro jedny z nich." # todo: NEW TRANSLATION
 SIA_pv_prepare_artillery_training: "Provést polní cvičení dělostřelectva" # todo: NEW TRANSLATION
 SIA_pv_prepare_artillery_training_desc: "Zaměřte dělostřelecké baterie na sráz s výhledem na chrám a nacvičte si výměnu palby, k jaké už na této hranici více než jednou došlo." # todo: NEW TRANSLATION
 SIA_pv_nationalist_rhetoric: "Mobilizovat nacionalistické nálady doma" # todo: NEW TRANSLATION
 SIA_pv_nationalist_rhetoric_desc: "Povzbuďte ministry, armádní mluvčí a státní tisk, aby doma mobilizovali nacionalistické nálady kvůli pohraničnímu sporu s Kambodžou. U domácího publika to zabírá, ale každé další kolo zvyšuje napětí na hranici." # todo: NEW TRANSLATION
 SIA_pv_military_posturing: "Přeskupit síly na hranici" # todo: NEW TRANSLATION
 SIA_pv_military_posturing_desc: "Přesuňte další jednotky k hranici poblíž Preah Vihear jako ukázku odhodlání. Kambodža to pochopí přesně tak, jak to myslíme." # todo: NEW TRANSLATION
 SIA_pv_attack_preah_vihear: "Zahájit vpád přes hranici" # todo: NEW TRANSLATION
 SIA_pv_attack_preah_vihear_desc: "Pošlete armádní jednotky přes hranici, aby obsadily území kolem chrámového komplexu. Úspěch dostane sporné území pod palbu našich zbraní. Neúspěch nás bude stát značnou podporu doma i v zahraničí." # todo: NEW TRANSLATION
 SIA_pv_extort_xp: "Vyvodit ponaučení z hranice" # todo: NEW TRANSLATION
 SIA_pv_extort_xp_desc: "Vyslechněte důstojníky, kteří se účastnili bojů na hranici, a začleňte jejich zkušenosti do doktríny stálé armády, pokud boje přinesly dostatek zkušeností, z nichž lze čerpat." # todo: NEW TRANSLATION
 SIA_pv_decisive_victory: "Vyhlásit rozhodující vítězství" # todo: NEW TRANSLATION
 SIA_pv_decisive_victory_desc: "Když je rovnováha bojů jednoznačně na naší straně, využijte výhody: donuťte Kambodžu k ponižujícímu ústupu a vyhlašte patovou situaci za národní triumf, aniž byste po našich jednotkách požadovali obsazení jediného nového metru území." # todo: NEW TRANSLATION
 SIA_pv_capture_northern_khmer: "Obsadit Severní Khmer" # todo: NEW TRANSLATION
 SIA_pv_capture_northern_khmer_desc: "Boje dopadly tak drtivě v náš prospěch, že sporný sráz leží před námi bez obrany. Nespokojte se s prestiží, ale získejte území natrvalo: přímo anektujte provincii Severní Khmer, vztyčte vlajku nad chrámem a uzavřete otázku hranice trvale podle našich podmínek. Kambodža nám to nikdy neodpustí a svět to označí za dobytí." # todo: NEW TRANSLATION
 SIA_pv_de_escalate: "Nabídnout deeskalaci" # todo: NEW TRANSLATION
 SIA_pv_de_escalate_desc: "Naznačte zdrženlivost prostřednictvím zákulisních kontaktů s Phnompenhem: stáhněte jednotky z předsunutých pozic a zmírněte rétoriku. Nestojí nás to nic kromě politického kapitálu a získáme dobrou vůli, kterou možná později využijeme." # todo: NEW TRANSLATION
 SIA_request_asean_mediation: "Požádat ASEAN o zprostředkování" # todo: NEW TRANSLATION
 SIA_request_asean_mediation_desc: "Požádejte ASEAN o zprostředkování pohraničního sporu s Kambodžou. Tento diplomatický přístup může pomoci zmírnit napětí a nalézt mírové řešení." # todo: NEW TRANSLATION
 SIA_accept_icj_ruling: "Přijmout rozhodnutí MSD" # todo: NEW TRANSLATION
 SIA_accept_icj_ruling_desc: "Přijměte rozhodnutí Mezinárodního soudního dvora o sporu kolem chrámu Preah Vihear. Tím konflikt skončí, ale může to být vnímáno jako diplomatická porážka." # todo: NEW TRANSLATION
 SIA_reject_icj_ruling: "Odmítnout rozhodnutí MSD" # todo: NEW TRANSLATION
 SIA_reject_icj_ruling_desc: "Odmítněte rozhodnutí MSD a pokračujte v prosazování našich nároků na sporné území. Tím se zvýší mezinárodní napětí, ale ukážeme své odhodlání." # todo: NEW TRANSLATION
 CBD_protest_thai_actions: "Diplomatický protest" # todo: NEW TRANSLATION
 CBD_protest_thai_actions_desc: "Předvolat thajského velvyslance, podat formální protest u ASEAN a OSN a ukázat národu, že vláda pevně stojí za svým. Doma tím získáme politický kapitál a zaznamenáme naši stížnost, aniž bychom předstírali, že uklidníme hranici, kterou Bangkok uklidnit nehodlá." # todo: NEW TRANSLATION
 CBD_pv_prepare_infantry_training: "Provést polní cvičení pěchoty" # todo: NEW TRANSLATION
 CBD_pv_prepare_infantry_training_desc: "Střídejte jednotky pěchoty z první linie v ostrých cvičeních kolem komplexu Preah Vihear a využijte zásoby ručních palných zbraní a podpůrných zbraní ke zvýšení jejich připravenosti na pohraniční střet s Thajskem." # todo: NEW TRANSLATION
 CBD_pv_prepare_armor_training: "Provést polní cvičení obrněných jednotek" # todo: NEW TRANSLATION
 CBD_pv_prepare_armor_training_desc: "Přesuňte obrněné jednotky do pozic poblíž sporného chrámu na manévrovací cvičení a ověřte, jak si obojživelné a střední tanky povedou v terénu, který není vhodný ani pro jedny z nich." # todo: NEW TRANSLATION
 CBD_pv_prepare_artillery_training: "Provést polní cvičení dělostřelectva" # todo: NEW TRANSLATION
 CBD_pv_prepare_artillery_training_desc: "Zaměřte dělostřelecké baterie na thajské pozice na srázu a nacvičte si výměnu palby, k jaké už na této hranici více než jednou došlo." # todo: NEW TRANSLATION
 CBD_pv_nationalist_rhetoric: "Mobilizovat nacionalistické nálady doma" # todo: NEW TRANSLATION
 CBD_pv_nationalist_rhetoric_desc: "Povzbuďte ministry, armádní mluvčí a státní tisk, aby doma mobilizovali nacionalistické nálady kvůli pohraničnímu sporu s Thajskem. U domácího publika to zabírá, ale každé další kolo zvyšuje napětí na hranici." # todo: NEW TRANSLATION
 CBD_pv_military_posturing: "Přeskupit síly na hranici" # todo: NEW TRANSLATION
 CBD_pv_military_posturing_desc: "Přesuňte další jednotky k hranici poblíž Preah Vihear jako ukázku odhodlání. Thajsko to pochopí přesně tak, jak to myslíme." # todo: NEW TRANSLATION
