 CBD_pv_attack_preah_vihear_desc: "Pošlete armádní jednotky přes hranici, aby obsadily území kolem chrámového komplexu. Úspěch dostane sporné území pod palbu našich zbraní. Neúspěch nás bude stát značnou podporu doma i v zahraničí." # todo: NEW TRANSLATION
