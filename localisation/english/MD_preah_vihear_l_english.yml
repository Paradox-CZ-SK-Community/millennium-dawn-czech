 preah_vihear_protest_grievance_TT: "Napětí na hranici je vyšší než 10 nebo Thajsko již zaútočilo přes hranici" # todo: NEW TRANSLATION
 preah_vihear_mediation_tension_TT: "Napětí na hranici je vyšší než 20" # todo: NEW TRANSLATION
 preah_vihear_icj_grounds_TT: "Napětí na hranici je vyšší než 74 nebo Thajsko již zaútočilo přes hranici" # todo: NEW TRANSLATION
 preah_vihear_tension_resolved_TT: "§GTím se napětí na hranici vynuluje§!" # todo: NEW TRANSLATION
 preah_vihear.100.t: "UNESCO prohlašuje Preah Vihear za místo světového dědictví" # todo: NEW TRANSLATION
 preah_vihear.100.d: "Organizace OSN pro výchovu, vědu a kulturu oficiálně prohlásila chrám Preah Vihear za místo světového dědictví a přiřkla jej Kambodži. Thajskem propukly nacionalistické protesty a demonstranti požadují vojenský zásah na ochranu toho, co považují za thajské území. Situace na hranici se rychle zhoršuje." # todo: NEW TRANSLATION
 preah_vihear.100.a: "To je pobouření! Mobilizujte naše síly!" # todo: NEW TRANSLATION
 preah_vihear.100.b: "Měli bychom respektovat mezinárodní rozhodnutí" # todo: NEW TRANSLATION
 preah_vihear.101.t: "UNESCO uznává Preah Vihear" # todo: NEW TRANSLATION
 preah_vihear.101.d: "UNESCO oficiálně prohlásilo starobylý chrám Preah Vihear za místo světového dědictví pod kambodžskou svrchovaností. Jde o velké diplomatické vítězství, které znovu potvrzuje rozhodnutí MSD z roku 1962. Nacionalistické protesty v Thajsku však mohou vést ke zvýšení napětí podél naší hranice." # todo: NEW TRANSLATION
 preah_vihear.101.a: "Velký den pro Kambodžu!" # todo: NEW TRANSLATION
 preah_vihear.1.t: "Thajské provokace na hranici" # todo: NEW TRANSLATION
 preah_vihear.1.d: "Thajsko zvýšilo napětí podél naší hranice poblíž chrámu Preah Vihear. Nacionalističtí demonstranti v Bangkoku požadují vojenský zásah a thajské jednotky byly přeskupeny blíže ke sporné oblasti." # todo: NEW TRANSLATION
 preah_vihear.1.a: "Musíme zůstat ostražití" # todo: NEW TRANSLATION
 preah_vihear.5.t: "Thajské síly útočí!" # todo: NEW TRANSLATION
 preah_vihear.5.d: "Thajské vojenské síly zahájily vpád do sporného pohraničního regionu poblíž chrámu Preah Vihear. Naše jednotky s útočníky bojují. Mezinárodní společenství sleduje, jak situace hrozí přerůst v plnohodnotný konflikt." # todo: NEW TRANSLATION
 preah_vihear.5.a: "Braňte naše území!" # todo: NEW TRANSLATION
 preah_vihear.6.t: "Kambodžský protiútok" # todo: NEW TRANSLATION
 preah_vihear.6.d: "Kambodžské síly zahájily protiútok proti našim pozicím poblíž chrámu Preah Vihear. Podél hranice je slyšet dělostřelecká a ruční palba." # todo: NEW TRANSLATION
 preah_vihear.6.a: "Musíme udržet své pozice" # todo: NEW TRANSLATION
 preah_vihear.10.t: "Vítězství v pohraničním střetu" # todo: NEW TRANSLATION
 preah_vihear.10.d: "Naše síly zajistily své cíle v pohraničním střetu poblíž Preah Vihear. Nepřítel byl zatlačen zpět a my jsme v regionu prokázali své vojenské schopnosti." # todo: NEW TRANSLATION
 preah_vihear.10.a: "Vynikající zprávy" # todo: NEW TRANSLATION
 preah_vihear.11.t: "Porážka v pohraničním střetu" # todo: NEW TRANSLATION
 preah_vihear.11.d: "Naše síly byly v pohraničním střetu poblíž Preah Vihear odraženy. Střet skončil neúspěchem a naše jednotky se ztrátami ustoupily na původní pozice." # todo: NEW TRANSLATION
 preah_vihear.11.a: "Hořký neúspěch" # todo: NEW TRANSLATION
 preah_vihear.12.t: "Pohraniční střet bez vítěze" # todo: NEW TRANSLATION
 preah_vihear.12.d: "Pohraniční střet poblíž Preah Vihear skončil patem. Obě strany ustoupily, aniž dosáhly svých cílů, přesto však získaly cenné bojové zkušenosti." # todo: NEW TRANSLATION
 preah_vihear.12.a: "Přeskupit se a znovu zhodnotit situaci" # todo: NEW TRANSLATION
 preah_vihear.13.t: "Vítězství v protiútoku" # todo: NEW TRANSLATION
 preah_vihear.13.d: "Náš protiútok uspěl a zatlačil nepřátelské síly zpět. Dokázali jsme, že agrese proti našemu území se setká s odhodlaným odporem." # todo: NEW TRANSLATION
 preah_vihear.13.a: "Naše svrchovanost je ubráněna" # todo: NEW TRANSLATION
 preah_vihear.14.t: "Protiútok odražen" # todo: NEW TRANSLATION
 preah_vihear.14.d: "Náš protiútok byl nepřátelskými silami odražen. Navzdory našemu maximálnímu úsilí se nám nepodařilo vytlačit je z jejich pozic ve sporné oblasti." # todo: NEW TRANSLATION
 preah_vihear.14.a: "Vzchopíme se" # todo: NEW TRANSLATION
 preah_vihear.20.t: "Návrh na zprostředkování ASEAN" # todo: NEW TRANSLATION
 preah_vihear.20.d: "Thajsko požádalo ASEAN o zprostředkování pohraničního sporu o Preah Vihear. Indonésie jako předsednická země ASEAN navrhuje vyslat do pohraničního regionu pozorovatele a zprostředkovat jednání mezi oběma stranami." # todo: NEW TRANSLATION
 preah_vihear.20.a: "Přijmout zprostředkování" # todo: NEW TRANSLATION
 preah_vihear.20.b: "Odmítnout zprostředkování" # todo: NEW TRANSLATION
 preah_vihear.21.t: "Návrh na zprostředkování ASEAN" # todo: NEW TRANSLATION
 preah_vihear.21.d: "Kambodža požádala ASEAN o zprostředkování pohraničního sporu o Preah Vihear. Indonésie jako předsednická země ASEAN navrhuje vyslat do pohraničního regionu pozorovatele a zprostředkovat jednání mezi oběma stranami." # todo: NEW TRANSLATION
 preah_vihear.21.a: "Přijmout zprostředkování" # todo: NEW TRANSLATION
 preah_vihear.21.b: "Odmítnout zprostředkování" # todo: NEW TRANSLATION
 preah_vihear.22.t: "Zprostředkování ASEAN přijato" # todo: NEW TRANSLATION
 preah_vihear.22.d: "Thajsko i Kambodža souhlasily se zprostředkováním ASEAN. Indonéští pozorovatelé budou rozmístěni v pohraničním regionu a začnou diplomatická jednání s cílem nalézt mírové řešení sporu." # todo: NEW TRANSLATION
 preah_vihear.22.a: "Cesta k míru" # todo: NEW TRANSLATION
 preah_vihear.23.t: "Zprostředkování ASEAN odmítnuto" # todo: NEW TRANSLATION
 preah_vihear.23.d: "Druhá strana odmítla zprostředkování ASEAN ve sporu o Preah Vihear. Diplomatické snahy selhaly a napětí podél hranice zůstává vysoké." # todo: NEW TRANSLATION
 preah_vihear.23.a: "Musíme se připravit na pokračující konfrontaci" # todo: NEW TRANSLATION
 preah_vihear.30.t: "Kambodža se obrací na MSD" # todo: NEW TRANSLATION
 preah_vihear.30.d: "Kambodža podala u Mezinárodního soudního dvora žalobu týkající se sporu o chrám Preah Vihear. Soud posoudí kambodžskou žádost o předběžná opatření a nakonec rozhodne o otázce svrchovanosti." # todo: NEW TRANSLATION
 preah_vihear.30.a: "Počkáme na rozhodnutí soudu" # todo: NEW TRANSLATION
 preah_vihear.31.t: "MSD rozhodl v náš prospěch" # todo: NEW TRANSLATION
 preah_vihear.31.d: "Mezinárodní soudní dvůr znovu potvrdil svrchovanost Kambodže nad chrámem Preah Vihear a nařídil oběma stranám stáhnout vojenský personál z dočasného demilitarizovaného pásma kolem chrámu." # todo: NEW TRANSLATION
 preah_vihear.31.a: "Mezinárodní právo stojí na naší straně" # todo: NEW TRANSLATION
 preah_vihear.32.t: "MSD rozhodl proti nám" # todo: NEW TRANSLATION
 preah_vihear.32.d: "Mezinárodní soudní dvůr rozhodl ve prospěch nároků Kambodže na svrchovanost nad chrámem Preah Vihear. Soud nařídil zřízení demilitarizovaného pásma kolem sporné oblasti." # todo: NEW TRANSLATION
 preah_vihear.32.a: "Toto je nespravedlivé rozhodnutí" # todo: NEW TRANSLATION
 preah_vihear.35.t: "Thajsko přijímá rozhodnutí MSD" # todo: NEW TRANSLATION
 preah_vihear.35.d: "Thajsko přijalo rozhodnutí MSD o sporu kolem chrámu Preah Vihear. Thajské síly se stáhnou z demilitarizovaného pásma, čímž pohraniční krize v podstatě skončí." # todo: NEW TRANSLATION
 preah_vihear.35.a: "Konečně mír" # todo: NEW TRANSLATION
 preah_vihear.36.t: "Thajsko odmítá rozhodnutí MSD" # todo: NEW TRANSLATION
 preah_vihear.36.d: "Thajsko odmítlo rozhodnutí MSD o sporu kolem chrámu Preah Vihear, označilo je za nespravedlivé a odmítlo uznat pravomoc soudu. Očekává se zvýšení napětí podél hranice." # todo: NEW TRANSLATION
 preah_vihear.36.a: "Musíme se připravit na pokračující konflikt" # todo: NEW TRANSLATION
 preah_vihear.40.t: "Nehoda při výcviku na hranici" # todo: NEW TRANSLATION
 preah_vihear.40.d: "Ostré cvičení poblíž hranice se zvrtlo. Byla poškozena technika a několik vojáků není schopno služby. Tento neúspěch navíc podkopal důvěru v program zvyšování připravenosti." # todo: NEW TRANSLATION
 preah_vihear.40.a: "Poučit se z chyby" # todo: NEW TRANSLATION
 preah_vihear.41.t: "Provokace se obrací proti nám" # todo: NEW TRANSLATION
 preah_vihear.41.d: "Poslední kolo rétoriky a přesunů vojsk přitáhlo doma nežádoucí pozornost. Opoziční představitelé a tisk se ptají, zda vláda nevytváří krizi, kterou nedokáže kontrolovat, a vláda byla nucena napětí zmírnit." # todo: NEW TRANSLATION
 preah_vihear.41.a: "Vzít si z toho ponaučení" # todo: NEW TRANSLATION
 preah_vihear.110.t: "Noppadonovo komuniké" # todo: NEW TRANSLATION
 preah_vihear.110.d: "Ministr zahraničí Noppadon Pattama spolupodepsal společné komuniké podporující žádost Kambodže o zapsání Preah Vihear na seznam UNESCO, což od té doby doma vyvolalo bouři. Ústavní soud zvažuje, zda byla dohoda uzavřena bez řádného schválení parlamentem, a nacionalističtí kritici požadují ministrovu hlavu." # todo: NEW TRANSLATION
 preah_vihear.110.a: "Stát za komuniké" # todo: NEW TRANSLATION
 preah_vihear.110.b: "Zřeknout se ho a nechat ministra odejít" # todo: NEW TRANSLATION
 preah_vihear.111.t: "Thaksin v Phnompenhu" # todo: NEW TRANSLATION
 preah_vihear.111.d: "Předseda vlády Hun Sen jmenoval uprchlého Thaksina Šinavatru svým osobním ekonomickým poradcem, což je promyšlená urážka vlády v Bangkoku. Kambodža odmítla zvážit vydání a toto jmenování se stalo mobilizačním bodem na obou stranách hranice." # todo: NEW TRANSLATION
 preah_vihear.111.a: "Odvolat našeho velvyslance" # todo: NEW TRANSLATION
 preah_vihear.111.b: "Podat pouze formální protest" # todo: NEW TRANSLATION
 preah_vihear.112.t: "Žluté košile na hranici" # todo: NEW TRANSLATION
 preah_vihear.112.d: "Lidová aliance pro demokracii využila pohraniční spor jako nový důkaz, že vláda je příliš blízko Phnompenhu a příliš měkká v otázce národní svrchovanosti. Shromáždění před sídlem vlády nevykazují známky ústupu." # todo: NEW TRANSLATION
 preah_vihear.112.a: "Přestát protesty" # todo: NEW TRANSLATION
 preah_vihear.120.t: "Spor se dostává do Rady bezpečnosti OSN" # todo: NEW TRANSLATION
 preah_vihear.120.d: "Pohraniční krize eskalovala natolik, že se nyní dostala na program Rady bezpečnosti. Členské státy vyzvaly obě strany ke zdrženlivosti, ačkoli se neočekává žádný závazný krok." # todo: NEW TRANSLATION
 preah_vihear.120.a: "Vzít jednání na vědomí" # todo: NEW TRANSLATION
 preah_vihear.121.t: "Indonésie nabízí pozorovatele" # todo: NEW TRANSLATION
 preah_vihear.121.d: "Indonésie jako předsednická země ASEAN nabídla vyslat neozbrojené pozorovatele, kteří by monitorovali hranici a podávali zprávy o porušování příměří. Jakarta to prezentuje jako krok k budování důvěry, nikoli jako zprostředkované urovnání." # todo: NEW TRANSLATION
 preah_vihear.121.a: "Přijmout pozorovatele" # todo: NEW TRANSLATION
 preah_vihear.121.b: "Nabídku odmítnout" # todo: NEW TRANSLATION
 preah_vihear.130.t: "Rozhodující porážka" # todo: NEW TRANSLATION
 preah_vihear.130.d: "Druhá strana dosáhla v patové situaci u Preah Vihear rozhodujícího vítězství a nyní využívá všechny diplomatické i propagandistické kanály, aby ponížení co nejvíce zdůraznila. Žádné území nezměnilo majitele, ale naše pozice na hranici vypadá slabší než za poslední roky." # todo: NEW TRANSLATION
 preah_vihear.130.a: "Prozatím přijmout neúspěch" # todo: NEW TRANSLATION
 preah_vihear.130.b: "Připravit se na totální válku" # todo: NEW TRANSLATION
 preah_vihear.131.t: "Sráz je ztracen" # todo: NEW TRANSLATION
 preah_vihear.131.d: "Thajské síly obsadily sporné území a Bangkok formálně anektoval provincii Severní Khmer, včetně chrámu. Rozhodnutí z roku 1962, které mělo být na naší straně, neznamená nic proti jednotkám na výšinách. Národ je v šoku a žádá odpověď, kterou možná nedokážeme poskytnout." # todo: NEW TRANSLATION
 preah_vihear.131.a: "Temný den pro národ" # todo: NEW TRANSLATION
 preah_vihear.131.b: "Získáme to zpět" # todo: NEW TRANSLATION
