 CBD_preah_vihear_humiliation_desc: "Thajsko nyní ovládá sporné území kolem Preah Vihear a ztráta je napříč politickým spektrem vnímána jako selhání diplomacie i zbraní." # todo: NEW TRANSLATION
 preah_vihear_observers: "Indonéští pohraniční pozorovatelé" # todo: NEW TRANSLATION
 preah_vihear_observers_desc: "Neozbrojení indonéští pozorovatelé jsou na základě dohody zprostředkované ASEAN rozmístěni podél hranice u Preah Vihear. Sledují porušování příměří a poskytují oběma vládám prostor nechat spor vychladnout." # todo: NEW TRANSLATION
