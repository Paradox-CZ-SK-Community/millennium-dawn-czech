 BLR_mtz: "Minský traktorní závod" # todo: NEW TRANSLATION
 BLR_mtz_desc: "Továrna v Bělorusku a výrobce zemědělských strojů. Minský traktorový závod byl založen 29. května 1946. Kapacita závodu je navržena na výrobu 71 000 traktorů různých řad." # todo: CHANGED
 BLR_soviet_plants_category: "Sovětské průmyslové dědictví" # todo: NEW TRANSLATION
 BLR_soviet_plants_category_desc: "Továrny, které Bělorusko zdědilo po Běloruské SSR: 558. letecký opravárenský závod v Baranavičy, Minský závod kolových tahačů, 140. opravárenský závod v Barysaŭ a Minský traktorový závod. Každá z nich byla vybudována pro potřeby sovětského válečného uspořádání, které již neexistuje, a nyní si každá musí najít vlastní zákazníky." # todo: NEW TRANSLATION
 BLR_advanced_industry_category: "Vojensko-průmyslový výbor" # todo: NEW TRANSLATION
 BLR_advanced_industry_category_desc: "Podniky spadající pod Státní úřad pro vojenský průmysl: JSC Peleng v oblasti optoelektroniky, Minotor-Service v oblasti pásové obrněné techniky a Belspetsvneshtechnika, státní podnik zahraničního obchodu, který vyváží běloruské vojenské a zboží dvojího užití do zahraničí." # todo: NEW TRANSLATION
