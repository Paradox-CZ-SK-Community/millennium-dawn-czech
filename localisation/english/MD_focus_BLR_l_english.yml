 BLR_belorusisation_vilnius: "Bělorusizace Vilniusu" # todo: NEW TRANSLATION
 BLR_belorusisation_vilnius_desc: "Vilnius byl dlouho sporným regionem, který jsme se snažili získat, ale nyní, když jsme si jej zajistili, jsme připraveni mezi lidmi propagovat myšlenku osídlení regionu Bělorusy." # todo: CHANGED
 BLR_belorusisation_sudovia: "Bělorusizace Sudovie" # todo: NEW TRANSLATION
