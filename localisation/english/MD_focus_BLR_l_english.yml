 BLR_parlament_pol_places: "Financovat kontakty v polském parlamentu" # todo: NEW TRANSLATION
 BLR_Litva_belarusizations_category: "Integrace nových zemí" # todo: CHANGED
 BLR_Litva_belarusizations_category_desc: "Litevské země padly pod naši kontrolu. Integrace těchto nových zemí a území je naprostou nutností, jinak si nebudeme moci udržet trvalou kontrolu nad regionem." # todo: CHANGED
