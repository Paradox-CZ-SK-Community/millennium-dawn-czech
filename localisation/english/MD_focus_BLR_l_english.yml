 BLR_disease_amongst_livestock: "Nemoci mezi hospodářskými zvířaty" # todo: NEW TRANSLATION
 BLR_belarusian_trains: "Průvodčí Stede" # todo: NEW TRANSLATION
 BLR_treading_on_thin_steel: "Chůze po tenkém plechu" # todo: NEW TRANSLATION
 BLR_treading_on_thin_steel_desc: "Z hlediska naší ekonomiky nyní kráčíme po tenkém ledu, protože všechen led roztál. Tento ocelový základ budeme muset posílit dalším rozvojem průmyslu, ať už prostřednictvím surovin, nebo výroby." # todo: CHANGED
 BLR_agricultural_shock: "Zemědělský šok" # todo: NEW TRANSLATION
 BLR_agricultural_shock_desc: "Příliš rychle jsme přešli k průmyslovému zaměření ekonomiky a v důsledku toho byl náš zemědělský sektor vážně zasažen." # todo: NEW TRANSLATION
 BLR_automotive_industry: "Běloruské automobilové odvětví" # todo: NEW TRANSLATION
 BLR_automotive_industry_desc: "Čtyři dveře a možná jedno kolo je vše, co je potřeba pro spolehlivý, důvěryhodný a moderní kus běloruského stroje. S naším rozvojem v automobilovém sektoru jistě porazíme ty neschopné hlupáky pracující pro Mercedes nebo BMW." # todo: NEW TRANSLATION
 BLR_potato_empire_idea: "Bramborové Impérium" # todo: NEW TRANSLATION
 BLR_country_for_life_idea: "Země pro Život" # todo: NEW TRANSLATION
 BLR_country_for_life_idea_desc: "„Země pro život“ je heslo a hnutí spojené s běloruským bloggerem a aktivistou Sergejem Tichanovským. Představuje vizi Běloruska, v němž mohou obyčejní občané žít svobodně a beze strachu." # todo: CHANGED
 BLR_pension_reform_idea: "Důchodová reforma" # todo: NEW TRANSLATION
 BLR_pension_reform_idea_desc: "Důchodové fondy jsou klíčové pro fungování naší společnosti a je třeba provést určité změny, aby fungovaly lépe." # todo: NEW TRANSLATION
