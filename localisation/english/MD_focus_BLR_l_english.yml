l_english:
 belorussia_focus: "Běloruský strom zaměření" # todo: NEW TRANSLATION
 BLR_assembly_shop_of_europe: "Sestavovací dílna Evropy" # todo: NEW TRANSLATION
 BLR_assembly_shop_of_europe_desc: "Jako jedna z možná nejvíce přehlížených ekonomik má Bělorusko potenciál ekonomicky předstihnout Rusko. To se však stane pouze tehdy, pokud se zaměříme na řešení základních problémů, které existují, protože jsme po léta zanedbávali i ty nejzákladnější investice do naší ekonomiky." # todo: CHANGED
 BLR_increase_livestock_imports: "Zvýšení dovozu hospodářských zvířat" # todo: NEW TRANSLATION
 BLR_increase_livestock_imports_desc: "§Y„Tohle mléko chutná nějak divně“§!\n\nNaši lidé potřebují zvířata nejen k jídlu, ale také k výrobě zboží. Krávy jsou obzvláště cenné díky produkci mléka. Mléčné výrobky mají široké využití a mohly by výrazně posílit náš zemědělský sektor." # todo: CHANGED
 BLR_proportional_mining: "Těžba podle potřeby" # todo: NEW TRANSLATION
 BLR_proportional_mining_desc: "Nemůžeme těžit suroviny kdekoli se nám zachce; nejprve je nutné vybudovat odpovídající infrastrukturu. Doly musíme zřizovat pouze v oblastech, kde je těžba surovin opodstatněná, a nové doly budeme stavět jen v oblastech s průmyslovým sektorem. Samozřejmě se tím zhorší kvalita ovzduší, ale alespoň [BLR.GetLeader] bude moci financovat několik pěkných paláců." # todo: CHANGED
 BLR_industrial_wide_reform: "Celoplošná průmyslová reforma" # todo: NEW TRANSLATION
 BLR_industrial_wide_reform_desc: "Zatímco srdce běloruského průmyslu bije silně, mohlo by bít ještě silněji. Zahájíme sérii reforem zaměřených na rozšíření znalostí o udržitelném průmyslovém rozvoji." # todo: CHANGED
 BLR_fostering_automotive_innovation: "Podpora automobilových inovací" # todo: NEW TRANSLATION
 BLR_fostering_automotive_innovation_desc: "Bělorusko zatím není celosvětově proslulé svým automobilovým průmyslem, což však neznamená, že je tato myšlenka zcela mimo hru. Se správnou dávkou motivace a propagandy (a možná i financování) nastartujeme automobilového giganta, který bude konkurovat například Německu. Možná." # todo: CHANGED
 BLR_the_fate_of_belarusian_steel_works: "Osud běloruských oceláren" # todo: NEW TRANSLATION
 BLR_the_fate_of_belarusian_steel_works_desc: "Byla založena v roce 1984, OJSC Belarusian Steel Works dodávala běloruskému průmyslu ocel světové úrovně, jakou jinde na Zemi nenajdete." # todo: NEW TRANSLATION
 BLR_tractors: "Nejsilnější traktor Evropy" # todo: NEW TRANSLATION
 BLR_tractors_desc: "Běloruský průmysl je známý mimo jiné svými spolehlivými traktory a běloruští zemědělci jsou závistí celé Evropy. Financování výroby traktorů by ekonomice ještě více prospělo, protože bychom mohli naše farmy vybavit nejmodernějším zařízením." # todo: CHANGED
 BLR_buses: "Autobus Východu" # todo: NEW TRANSLATION
 BLR_buses_desc: "Naštěstí naši geniální inženýři z několika společností dokázali rozluštit zdánlivě nemožný úkol a vyrobit jakžtakž spolehlivé autobusy. S tímto základem se naše autobusy mohou už jen zlepšovat. S trochou štěstí a financování se pustíme do práce a vyrobíme nejlepší autobus na východ od Británie." # todo: CHANGED
 BLR_trains: "Oživit Bielaruskaja Cyhunka" # todo: NEW TRANSLATION
 BLR_trains_desc: "§R„Rychlejší než jakýkoli rychlovlak!“§!\n\nBěloruskaja Čyhunka, anglicky známá jako Běloruská železnice, stojí v čele budování železniční infrastruktury pro mnoho občanů žijících v našich hranicích. Běloruská železnice, která podléhá přímo ministerstvu dopravy, je jednou z nástupnických společností sovětské éry a v současnosti se očekává, že si zachová monopol na běloruských železnicích. Můžeme oživit Běloruskou Čyhunku a také financovat některé výrobce vlaků, aby co nejlépe odpovídaly potřebám běloruských cestujících." # todo: CHANGED
 BLR_infrastructure_contracts: "Navrhované infrastrukturní smlouvy" # todo: CHANGED
 BLR_infrastructure_contracts_desc: "" # todo: NEW TRANSLATION
 BLR_new_paths: "Všechny cesty vedou do [BLR.capital.GetCapitalVictoryPointName]" # todo: NEW TRANSLATION
 BLR_new_paths_desc: "" # todo: NEW TRANSLATION
 BLR_revamp_railroads: "Modernizované železnice" # todo: NEW TRANSLATION
 BLR_revamp_railroads_desc: "Národní železniční systém trpí zastaralým vybavením a pomalými službami. Jeho modernizace podle současných standardů zkrátí dojezdové časy a sníží problémy s údržbou. Silnější železnice posilují jak civilní, tak průmyslovou dopravu." # todo: NEW TRANSLATION
 BLR_belneftekhim: "Posílit Belneftekhim" # todo: NEW TRANSLATION
 BLR_belneftekhim_desc: "Belneftekhim hraje klíčovou roli v běloruském petrochemickém průmyslu, ale k udržení konkurenceschopnosti potřebuje modernizaci. Investice do nové technologie a rafinačních procesů zvýší kvalitu produkce. Tyto upgrady pomáhají zajistit naši pozici na světových trzích." # todo: NEW TRANSLATION
 BLR_the_belaruskali_monopoly: "Udržet monopol Belaruskali" # todo: NEW TRANSLATION
 BLR_the_belaruskali_monopoly_desc: "Belaruskali je jedním z našich nejcennějších aktiv, a zachování jeho monopolu zajišťuje předvídatelné příjmy. Posílení jeho tržní pozice pomáhá chránit běloruský vliv v průmyslu potaše. Stabilita v tomto sektoru podporuje širší ekonomické plánování." # todo: NEW TRANSLATION
 BLR_uplift_grodno_azot: "Posílit Grodno Azot" # todo: NEW TRANSLATION
 BLR_uplift_grodno_azot_desc: "Grodno Azot vyrábí nezbytné chemikálie pro zemědělství a průmysl. Modernizace jeho zařízení zvýší efektivitu a sníží odpad. Podpora této továrny posiluje náš chemický sektor jako celek." # todo: NEW TRANSLATION
 BLR_tend_to_oil_shale: "Průzkum ropných břidlic" # todo: NEW TRANSLATION
 BLR_tend_to_oil_shale_desc: "Bělorusko má potenciální ložiska ropných břidlic, která zůstávají převážně neprozkoumaná. Průzkum a rozvoj těchto ložisek by mohl diverzifikovat naše energetické zdroje. I malá naleziště by snížila závislost na dovozu ze zahraničí." # todo: NEW TRANSLATION
 BLR_award_chinese_contractors: "Přidělit zakázky čínským firmám" # todo: NEW TRANSLATION
 BLR_award_chinese_contractors_desc: "Čínské stavební firmy nabízejí konkurenční nabídky a rychlé dokončení projektů. Přidělení velkých zakázek jim může urychlit naše infrastrukturní plány. Tento krok také posílí diplomatické a ekonomické vazby s Pekingem." # todo: NEW TRANSLATION
 BLR_award_luxembourgian_contractors: "Uspokojit Lucemburčany" # todo: NEW TRANSLATION
 BLR_award_luxembourgian_contractors_desc: "Lucemburské firmy poskytují kvalitní práci a očekávají spravedlivý přístup k našim trhům. Udělení klíčových zakázek jim zlepší vztahy a signalizuje naši ochotu ke spolupráci. Jejich zapojení může také zvýšit stavební standardy doma." # todo: NEW TRANSLATION
 BLR_potash_safety_and_hazards_regulation: "Bezpečnostní a rizikové předpisy pro potaš" # todo: NEW TRANSLATION
 BLR_potash_safety_and_hazards_regulation_desc: "Těžba potaše nese značná rizika, pokud jsou bezpečnostní pravidla ignorována. Zavedení přísnějších předpisů ochrání pracovníky a předejde nehodám. Bezpečnější odvětví také zajistí stabilnější a spolehlivější výrobu." # todo: NEW TRANSLATION
 BLR_bountiful_fields: "Pěstovat úrodná pole" # todo: NEW TRANSLATION
 BLR_bountiful_fields_desc: "Bělorusko má bohatou půdu, ale výnosy jsou nesourodé. Rozšíření podpory farmářům a zavedení lepších postupů může proměnit naše pole v spolehlivé sklizně. Tato snaha zlepší potravinovou bezpečnost a posílí venkovské komunity." # todo: NEW TRANSLATION
 BLR_speed_up_land_reformation: "Zrychlit pozemkovou reformu" # todo: NEW TRANSLATION
 BLR_speed_up_land_reformation_desc: "Pozemková reforma postupovala pomalu a nerovnoměrně po celé zemi. Zrychlení tohoto procesu pomůže farmářům získat stabilitu a povzbudí investice. Jasnější pravidla vlastnictví zlepší celkovou zemědělskou produktivitu." # todo: NEW TRANSLATION
 BLR_reinforce_government_support_for_agriculture: "Posílit vládní podporu zemědělství" # todo: NEW TRANSLATION
 BLR_reinforce_government_support_for_agriculture_desc: "Zemědělství zůstává pilířem běloruské společnosti a vyžaduje silnou vládní podporu. Zvýšení dotací, školení a přístupu k vybavení zvýší výnosy a ochrání malé zemědělce. Odolný zemědělský sektor podporuje národní stabilitu." # todo: NEW TRANSLATION
 BLR_achieving_self_sufficiency: "Usilovat o soběstačnost" # todo: NEW TRANSLATION
 BLR_achieving_self_sufficiency_desc: "Snížení závislosti na dovozu posiluje národní nezávislost a ekonomickou stabilitu. Rozvojem domácího průmyslu a zvyšováním produktivity může Bělorusko pokrýt více vlastních potřeb. Dosažení tohoto cíle bude vyžadovat čas, je však nezbytné pro dlouhodobou odolnost." # todo: CHANGED
 BLR_streamline_taxation: "Zjednodušit daňový systém" # todo: NEW TRANSLATION
 BLR_streamline_taxation_desc: "Složitý daňový systém zpomaluje růst podnikání a odrazuje investory. Zjednodušení pravidel povzbudí podnikavost a sníží byrokratické prodlevy. Jasnější zdanění může zvýšit příjmy tím, že usnadní dodržování pravidel." # todo: NEW TRANSLATION
 BLR_counterurbanization: "Protiurbanizační politiky" # todo: NEW TRANSLATION
 BLR_counterurbanization_desc: "Venkovské oblasti nadále ztrácejí obyvatele ve prospěch měst, což vede k nerovnoměrnému rozvoji. Protiurbanizační politiky si kladou za cíl podpořit vesnice prostřednictvím nových investic a zlepšených služeb. Posílení venkovského života pomáhá vyrovnávat růst napříč zemí." # todo: NEW TRANSLATION
 BLR_china_friendship: "Partnerství s Čínou" # todo: NEW TRANSLATION
 BLR_china_friendship_desc: "Chceme posílit přátelské vztahy mezi našimi zeměmi." # todo: NEW TRANSLATION
 BLR_Bel_G2: "BELGEE" # todo: NEW TRANSLATION
 BLR_Bel_G2_desc: "Akciová společnost „BELGEE“ je bělorusko-čínský společný podnik zaměřený na montáž čínských osobních automobilů Geely. Je jednou ze dvou společností v Bělorusku montujících osobní automobily. Sídlí v pronajatých prostorách akciové společnosti „Borisovský závod Avtogidrousilitel“ poblíž Borisova." # todo: CHANGED
 BLR_Chinese_Modernization_Railway: "Modernizace železnic" # todo: NEW TRANSLATION
 BLR_Chinese_Modernization_Railway_desc: "Naši čínští kolegové souhlasili, že financují modernizaci železniční sítě naší země." # todo: NEW TRANSLATION
 BLR_Credit_tec2: "Úvěr na zlepšení CHP" # todo: NEW TRANSLATION
 BLR_Credit_tec2_desc: "Naše tepelné elektrárny v Minsku potřebují modernizaci, proto od Číny požádáme o půjčku." # todo: CHANGED
 BLR_AES: "Běloruská jaderná elektrárna" # todo: NEW TRANSLATION
 BLR_AES_desc: "Konečně si vybudujeme vlastní jadernou elektrárnu." # todo: CHANGED
 BLR_Chinese_kal: "Obchodní dohoda s Čínou" # todo: NEW TRANSLATION
 BLR_Chinese_kal_desc: "Uzavřeme s Čínou obchodní dohodu, která nám umožní zvýšit výrobní kapacitu společnosti Grodno Azot." # todo: CHANGED
 BLR_Chinese_zdania: "Výstavba nových továren" # todo: NEW TRANSLATION
 BLR_Chinese_zdania_desc: "Čínská vláda zvyšuje investice v naší zemi a je připravena vybudovat nové továrny." # todo: CHANGED
 BLR_Chinese_konfuci: "Konfuciovy instituty" # todo: NEW TRANSLATION
 BLR_Chinese_konfuci_desc: "V naší zemi otevřeme několik Konfuciových institutů." # todo: CHANGED
 BLR_Chinese_Poezda: "Nákup vlaků v Číně" # todo: NEW TRANSLATION
 BLR_Chinese_Poezda_desc: "V Číně nakoupíme několik vlaků, které pomohou zlepšit naše zásobování." # todo: CHANGED
 BLR_Chinese_huawei: "Spolupráce s Huawei" # todo: NEW TRANSLATION
 BLR_Chinese_huawei_desc: "Navážeme úzkou spolupráci s touto čínskou společností." # todo: CHANGED
 BLR_Chinese_energy: "Čínské investice v našem energetickém sektoru" # todo: NEW TRANSLATION
 BLR_Chinese_energy_desc: "Čínské společnosti pokračují ve své investiční ofenzivě napříč naší zemí a nyní jsou znovu připraveny investovat do našeho energetického sektoru." # todo: CHANGED
 BLR_Chinese_uchenia: "Cvičení s čínskou armádou" # todo: NEW TRANSLATION
 BLR_Chinese_uchenia_desc: "Výměna zkušeností mezi našimi ozbrojenými silami bude velmi užitečná." # todo: NEW TRANSLATION
 BLR_Chinese_yuan: "Jüan je druhou měnou naší země" # todo: NEW TRANSLATION
 BLR_Chinese_yuan_desc: "Jsme připraveni přijmout jüan jako druhou měnu v naší zemi." # todo: CHANGED
 BLR_Chinese_skynet: "Čínská zkušenost s kontrolou internetu" # todo: NEW TRANSLATION
 BLR_Chinese_skynet_desc: "Jsme připraveni poučit se ze zkušeností s monitorováním sociálních sítí." # todo: CHANGED
 BLR_Chinese_economic: "Čínské ekonomické zkušenosti" # todo: NEW TRANSLATION
 BLR_Chinese_economic_desc: "Uplatňujeme veškeré zkušenosti získané z čínské ekonomiky." # todo: CHANGED
 BLR_military_exercises_CHI_idea: "Bělorusko-čínské cvičení" # todo: NEW TRANSLATION
 BLR_Socialist_Market_Economy: "Socialistická tržní ekonomika" # todo: NEW TRANSLATION
 BLR_minotor_servise_sov: "Běloruský Minotor-Service" # todo: NEW TRANSLATION
 BLR_minotor_servise_blr: "Minotor smlouva s Ruskem" # todo: NEW TRANSLATION
 BLR_558zadov_contract: "Smlouva se 558. leteckým opravárenským závodem" # todo: NEW TRANSLATION
 BLR_peleng_contract: "[BLR.GetFlag]Smlouva se společností Peleng" # todo: NEW TRANSLATION
 BLR_peleng_contract_desc: "[BLR.GetFlag]Běloruská společnost pro vývoj a výrobu optoelektronických výrobků pro vojenské i civilní účely, vedoucí podnik v tomto odvětví v Běloruské republice." # todo: CHANGED
 BLR_peleng_union_state: "[BLR.GetFlag]JSC Peleng" # todo: NEW TRANSLATION
 BLR_peleng_union_state_desc: "[SOV.GetFlag]Svazový státní podnik pro vývoj a výrobu optoelektronických výrobků pro vojenské i civilní účely, vedoucí podnik v tomto odvětví ve Svazovém státě." # todo: CHANGED
 BLR_peacerota_idea: "Mírový kontingent" # todo: NEW TRANSLATION
 BLR_Foreign_legion_idea: "Cizinecká legie" # todo: NEW TRANSLATION
 BLR_sso_idea: "Speciální operační síly" # todo: NEW TRANSLATION
 BLR_ter_orobona_idea: "Teritoriální obrana" # todo: NEW TRANSLATION
 BLR_mzkt_contract: "Smlouva s MZKT" # todo: NEW TRANSLATION
 BLR_mzkt_contract_desc: "Minský závod kolových traktorů, MZKT, je podnik specializující se na výrobu těžkých silničních a terénních vozidel, tažených vozidel a speciálních kolových podvozků pro stavební, ropný, plynárenský a strojírenský průmysl. Jedná se o státní podnik pod jurisdikcí Státního vojensko-průmyslového výboru Běloruské republiky." # todo: CHANGED
 BLR_mzkt_contract_another: "Smlouva s MZKT" # todo: NEW TRANSLATION
 BLR_mzkt_another_desc: "Minský závod kolových traktorů, MZKT, je podnik specializující se na výrobu těžkých silničních a terénních vozidel, tažených vozidel a speciálních kolových podvozků pro stavební, ropný, plynárenský a strojírenský průmysl. Jedná se o státní podnik pod jurisdikcí Státního vojensko-průmyslového výboru Běloruské republiky." # todo: CHANGED
 BLR_mzkt_contract_blr: "Smlouva MZKT se [SOV.GetNamewithFlag]" # todo: NEW TRANSLATION
 BLR_mzkt_contract_blr_desc: "Minský závod kolových traktorů, MZKT, je podnik specializující se na výrobu těžkých silničních a terénních vozidel, tažených vozidel a speciálních kolových podvozků pro stavební, ropný, plynárenský a strojírenský průmysl. Jedná se o státní podnik pod jurisdikcí Státního vojensko-průmyslového výboru Běloruské republiky." # todo: CHANGED
 BLR_mzkt_union_state: "[BLR.GetFlag]Minský závod kolových traktorů" # todo: NEW TRANSLATION
 BLR_mzkt_union_state_desc: "Minský závod kolových traktorů, MZKT, je podnik specializující se na výrobu těžkých silničních a terénních vozidel, tažených vozidel a speciálních kolových podvozků pro stavební, ropný, plynárenský a strojírenský průmysl. V současnosti podléhá jurisdikci Svazového státu." # todo: CHANGED
 BLR_140_zavod_union_state: "[BLR.GetFlag]The 140th Repair Plant" # todo: NEW TRANSLATION
 BLR_140_zavod_union_state_desc: "140. opravárenský závod je státní podnik vojensko-průmyslového komplexu [SOV.GetFlag]Svazového státu, který se specializuje na opravy a modernizaci obrněných vozidel a jejich motorů." # todo: CHANGED
 BLR_Brigade_Territorial_Defence: "Vytvoření brigády teritoriální obrany" # todo: NEW TRANSLATION
 BLR_Brigade_Territorial_Defence_desc: "Vypuknutí války nás nutí vytvořit síly územní obrany." # todo: CHANGED
 BLR_Transport_troops: "Dopravní vojska" # todo: NEW TRANSLATION
 BLR_Transport_troops_desc: "Speciální jednotky navržené k plnění úkolů dopravní podpory." # todo: NEW TRANSLATION
 BLR_sso: "Vytvoření Speciálních operačních sil" # todo: NEW TRANSLATION
 BLR_sso_desc: "Speciální operační sílyozbrojených sil Republiky Bělorusko, velmi mobilní odvětví ozbrojených sil, jsou nástupcem vzdušných sil SSSR a speciálních sil GRU SSSR v Republice Bělorusko. Hlavní úkoly: protisabotážní činnosti, zpravodajství, boje proti ilegálním ozbrojeným skupinám, plnění různých úkolů pomocí speciálních metod, aby se ukončila ozbrojený konflikt proti Republice Bělorusko. Působí jako jeden z hlavních prvků strategického odstrašení." # todo: NEW TRANSLATION
 BLR_trans_army: "Vytvoření Doprovodných vojsk" # todo: NEW TRANSLATION
 BLR_trans_army_desc: "Běloruské dopravní vojsko je složkou běloruských ozbrojených sil odpovědnou za přepravu personálu a materiálu nákladními automobily, po železnici a letecky. Jeho úkolem je zajišťovat dopravní podporu vojenským útvarům ostatních složek po celé zemi." # todo: CHANGED
 BLR_end_reform: "Dokončit reformu armády" # todo: NEW TRANSLATION
 BLR_end_reform_desc: "Dokončíme reformy naší armády, která nyní bude splňovat moderní standardy." # todo: CHANGED
 BLR_USSR_Legacy: "Dědictví SSSR" # todo: NEW TRANSLATION
 BLR_USSR_Legacy_desc: "Vynaložíme veškeré úsilí na rozvoj a budování na dědictví, které jsme zdědili." # todo: NEW TRANSLATION
 BLR_MZKT: "MZKT" # todo: NEW TRANSLATION
 BLR_MZKT_desc: "Minský závod kolových traktorů je podnik specializující se na výrobu těžkých silničních a terénních vozidel, tažených vozidel a speciálních kolových podvozků pro stavební, ropný, plynárenský a strojírenský průmysl. Je to státní podnik pod jurisdikcí Státního vojensko-průmyslového výboru Běloruské republiky." # todo: CHANGED
 BLR_minoitor: "Minotor-Service" # todo: NEW TRANSLATION
 BLR_minoitor_desc: "Minotor-Service je běloruský podnik se sídlem v Minsku, který se zabývá vývojem, výrobou, modernizací, opravami a údržbou pásových bojových vozidel a také dodávkami náhradních dílů. Je jedním z předních podniků vojensko-průmyslového komplexu země." # todo: CHANGED
 BLR_belspecveshtech: "Belspetsvneshtechnika" # todo: NEW TRANSLATION
 BLR_belspecveshtech_desc: "Belspetsvneshtechnika, BSVT, je běloruský státní zahraničněobchodní unitární podnik založený v roce 1995. Specializuje se na obchod a výrobu zbraní a zboží dvojího užití. Je členem Státního vojensko-průmyslového výboru a je považován za přední podnik země v oblasti vývozu zbraní." # todo: CHANGED
 BLR_140_zavod: "140 Repair Plant" # todo: NEW TRANSLATION
 BLR_140_zavod_desc: "140. opravárenský závod je státní podnik vojensko-průmyslového komplexu Běloruska, který se specializuje na opravy a modernizaci obrněných vozidel a jejich motorů." # todo: CHANGED
 BLR_polonez: "Start Developing Our MLRS With China" # todo: NEW TRANSLATION
 BLR_polonez_desc: "Požádali jsme naše čínské kolegy o pomoc při vytvoření našeho raketometu." # todo: CHANGED
 BLR_peleng: "Peleng" # todo: NEW TRANSLATION
 BLR_peleng_desc: "JSC Peleng je běloruská společnost se sídlem v Minsku, specializující se na vývoj a výrobu optoelektronických systémů pro vojenské i civilní účely. Je přední společností v běloruském optoelektronickém průmyslu." # todo: NEW TRANSLATION
 BLR_peleng_for_russia: "ATGM Equipment" # todo: NEW TRANSLATION
 BLR_peleng_for_russia_desc: "Jsme připraveni zahájit výrobu vybavení pro ruské protitankové řízené střely." # todo: CHANGED
 BLR_peleng_for_ukr: "ATGM Equipment" # todo: NEW TRANSLATION
 BLR_peleng_for_ukr_desc: "Jsme připraveni zahájit výrobu vybavení pro ukrajinské protitankové řízené střely." # todo: CHANGED
 BLR_558_zavod: "558 Aircraft Repair Plant" # todo: NEW TRANSLATION
 BLR_558_zavod_desc: "558. letecký opravárenský závod je jedním z největších podniků v SNS pro opravy a modernizaci moderní letecké bojové techniky používané letectvy postsovětských zemí i mnoha zahraničních států. Je nejvýznamnějším leteckým opravárenským závodem v Bělorusku a nachází se ve městě Baranoviči." # todo: CHANGED
 BLR_Communism_start: "Návrat komunismu" # todo: NEW TRANSLATION
 BLR_Communism_start_desc: "Komunismus se do Běloruska znovu vrátil. Otevře Komunistická strana zemi opět cestu k marxismu-leninismu?" # todo: CHANGED
 BLR_trade_with_nko: "Obchod se Severní Koreou" # todo: NEW TRANSLATION
 BLR_trade_with_nko_desc: "Severní Korea je sice malá země, ale je naším spojencem v socialistickém táboře, se kterým jsme připraveni navázat obchodní vztahy." # todo: CHANGED
 BLR_nko_workers: "Severokorejští dělníci" # todo: NEW TRANSLATION
 BLR_nko_workers_desc: "Jsme připraveni pozvat do naší země severokorejské dělníky. Jsou známí svou efektivitou a pracovitostí." # todo: CHANGED
 BLR_nko_miiltary_coop: "Vojensko-technická spolupráce se Severní Koreou" # todo: NEW TRANSLATION
 BLR_nko_miiltary_coop_desc: "Jsme připraveni zahájit vojensko-technickou spolupráci s Korejskou lidovou armádou." # todo: CHANGED
 BLR_constitution_BSSR: "Ústava BSSR" # todo: NEW TRANSLATION
 BLR_constitution_BSSR_desc: "Nejprve je nutné obnovit ústavu BSSR." # todo: CHANGED
 BLR_single_party: "Jednostranná strana" # todo: NEW TRANSLATION
 BLR_single_party_desc: "Měla by existovat jediná strana, protože máme jedinou cestu k socialismu." # todo: CHANGED
 BLR_rotation_KGB: "Rotace v KGB" # todo: NEW TRANSLATION
 BLR_rotation_KGB_desc: "Měníme personál, protože nyní potřebujeme silnou a mocnou organizaci." # todo: CHANGED
 BLR_North_Korea_workers: "Severokorejští dělníci" # todo: NEW TRANSLATION
 BLR_SMERSH_2: "SMERSH 2.0" # todo: NEW TRANSLATION
 BLR_SMERSH_2_desc: "Obnovíme SMĚRŠ. Je čas využít sovětské zkušenosti ve prospěch národa." # todo: CHANGED
 BLR_arest_silovic: "Čistka bezpečnostních sil" # todo: NEW TRANSLATION
 BLR_arest_silovic_desc: "Ukázalo se, že mnoho příslušníků bezpečnostních složek nesouhlasí s novou vládou. Je čas je očistit." # todo: CHANGED
 BLR_antigay_propaganda_laws: "Zákony proti propagandě LGBT" # todo: NEW TRANSLATION
 BLR_antigay_propaganda_laws_desc: "Je čas právně zakázat propagandu LGBT v naší zemi." # todo: CHANGED
 BLR_clean_soc_net: "Čistá sociální síť" # todo: NEW TRANSLATION
 BLR_clean_soc_net_desc: "Vyčistíme všechny sociální sítě a nedovolíme šíření nepřátelské propagandy." # todo: CHANGED
 BLR_pioneria: "Pionýrská organizace" # todo: NEW TRANSLATION
 BLR_pioneria_desc: "Mladí lidé by neměli zahálet, proto obnovíme Pionýrskou organizaci." # todo: CHANGED
 BLR_Marks_school: "Marxismus ve školách" # todo: NEW TRANSLATION
 BLR_Marks_school_desc: "Školní osnovy budou nutně zahrnovat marxistické vzdělávání." # todo: CHANGED
 BLR_free_education: "Bezplatné vzdělání" # todo: NEW TRANSLATION
 BLR_free_education_desc: "Vzdělání by mělo být bezplatné a dostupné každému občanovi naší slavné země." # todo: CHANGED
 BLR_state_atheism: "Státní ateismus" # todo: NEW TRANSLATION
 BLR_state_atheism_desc: "Náboženství je opium lidstva a je čas bojovat proti jeho vlivu." # todo: CHANGED
 BLR_collectivism: "Kolektivismus" # todo: NEW TRANSLATION
 BLR_collectivism_desc: "Kolektivizace se osvědčila již dříve, proto tuto zkušenost zopakujeme." # todo: CHANGED
 BLR_fight_international_capitalists: "Boj s mezinárodními kapitalisty" # todo: NEW TRANSLATION
 BLR_fight_international_capitalists_desc: "Oligarchové jsou nebezpečná a zkorumpovaná třída, o nic lepší než kulaci ze sovětských dob. Od rozpadu SSSR ruští a běloruští oligarchové pohltili stále větší část ekonomického vlivu a vytlačili běloruské dělníky z pracovních míst ve prospěch globalistického ekonomického modelu poháněného zahraničními společnostmi. K oživení skutečného socialismu je nejprve nezbytné vyhnat mezinárodní kapitalistickou třídu." # todo: CHANGED
 BLR_weaken_the_banks: "Oslabit banky" # todo: NEW TRANSLATION
 BLR_weaken_the_banks_desc: "Banky jsou praetoriánskou gardou kapitalismu, nesou jeho prapor do boje a chrání své zisky samotnou existencí. Zasahují do chudých oblastí světa, zneužívají pracující třídu vyděláváním nízkých mezd a spekulacemi s úroky, a ovlivňují politiku legálními i nelegálními dary. Banky je třeba vrátit do stavu, kdy jsou jen apolitickými krátkodobými věřiteli." # todo: NEW TRANSLATION
 BLR_ultimate_tax_reform: "Velká daňová reforma" # todo: NEW TRANSLATION
 BLR_ultimate_tax_reform_desc: "Máme v úmyslu provést rozsáhlou daňovou reformu, která ulehčí daňové břemeno obyčejným lidem, zatímco pro podniky bude znamenat pravý opak." # todo: CHANGED
 BLR_nationalize_foreign_business: "Nacionalizace zahraničních podniků" # todo: NEW TRANSLATION
 BLR_nationalize_foreign_business_desc: "Průmyslové závody vlastněné cizinci jsou vždy rizikem pro ekonomickou bezpečnost. Když nám zahraniční země hrozí ekonomickými sankcemi, neustále se obáváme, že majitelé průmyslových podniků přes noc odejdou a vezmou s sebou životně důležité části svých závodů. Abychom tomu zabránili, musíme tato odvětví převzít do vlastnictví státu – i kdyby to urazilo jiné národy." # todo: CHANGED
 BLR_five_year_plan: "První pětiletý plán" # todo: NEW TRANSLATION
 BLR_five_year_plan_desc: "Svobodné ekonomické modely západních států nenabízejí socialistické zemi žádnou budoucnost. Návrat k plánované ekonomice, nejlépe v podobě klasických sovětských pětiletých plánů, dá vládě značný vliv nad dosud nekontrolovanou ekonomikou." # todo: CHANGED
 BLR_reestablish_the_military_industrial_complex: "Obnovit vojensko-průmyslový komplex" # todo: NEW TRANSLATION
 BLR_reestablish_the_military_industrial_complex_desc: "Armáda a lid jsou jedním!" # todo: NEW TRANSLATION
 BLR_mobilize_the_masses: "Mobilizace mas" # todo: NEW TRANSLATION
 BLR_mobilize_the_masses_desc: "Naše armáda potřebuje lidi, kteří budou bránit zájmy naší země všude, kam je strana vyšle." # todo: CHANGED
 BLR_better_roads: "Obecné zlepšení silnic" # todo: NEW TRANSLATION
 BLR_better_roads_desc: "Je nutné důkladně řešit problém silnic v naší zemi." # todo: CHANGED
 BLR_progress_cult: "Kult pokroku" # todo: NEW TRANSLATION
 BLR_progress_cult_desc: "Socialisté chtějí společenský a vědecký pokrok. Ten druhý je ve 21. století obzvláště důležitý nejen z hlediska národní bezpečnosti, ale také pro šíření revoluce a naplnění socialistického programu, kterého lze plně dosáhnout pouze tehdy, pokud věda a technologie pokročí na určitou úroveň." # todo: CHANGED
 BLR_soviet_academy_of_sciences: "Sovětská akademie věd" # todo: NEW TRANSLATION
 BLR_soviet_academy_of_sciences_desc: "Sovětská akademie věd byla přední vědeckou institucí Sovětského svazu. Naše nejlepší a nejbystřejší mozky zde budou znovu neúnavně pracovat na dosažení technologických a vědeckých průlomů, díky nimž nám bude jednoho dne kapitalistický svět závidět!" # todo: CHANGED
 BLR_the_culture_of_proletarianism: "Kultura proletariátu" # todo: NEW TRANSLATION
 BLR_the_culture_of_proletarianism_desc: "Je čas pěstovat proletářskou kulturu pracující třídy, s níž společně vykročíme vstříc společné krásné komunistické budoucnosti." # todo: CHANGED
 BLR_empower_the_kgb: "Rozšíření vlivu KGB" # todo: NEW TRANSLATION
 BLR_empower_the_kgb_desc: "Máme v úmyslu rozšířit vliv KGB v naší zemi, aby nepřítel nemohl podkopat náš vnitřní systém. Proto jí svěříme ještě větší pravomoci k provádění její činnosti." # todo: CHANGED
 BLR_erase_nationalist: "Všechny nacionalisty do vězení" # todo: NEW TRANSLATION
 BLR_erase_nationalist_desc: "Je čas odstranit nacionalistické buňky v naší zemi." # todo: CHANGED
 BLR_the_litbel_start: "Obnovení Litbelu" # todo: NEW TRANSLATION
 BLR_the_litbel_start_desc: "Litbel je sovětská republika, která se na krátkou dobu objevila během ruské občanské války. Vyhlídka na spojení sil s našimi litevskými bratry nám zní velmi lákavě." # todo: CHANGED
 BLR_peaceful_litbel: "Červená vlajka nad Litvou" # todo: NEW TRANSLATION
 BLR_peaceful_litbel_desc: "Připravili jsme vše potřebné. Všichni agenti, naverbovaní občané i politici jsou na svých místech. Je čas osvobodit Litvu od okupace loutkové vlády." # todo: CHANGED
 BLR_the_litbel: "Stát dvou národů" # todo: NEW TRANSLATION
 BLR_the_litbel_desc: "Nastal čas stát se jedinou zemí dvou národů – běloruského a litevského." # todo: CHANGED
 BLR_dissolve_monasteries: "Rozpuštění klášterů" # todo: NEW TRANSLATION
 BLR_dissolve_monasteries_desc: "Zcela očistíme naši zemi od náboženství!" # todo: NEW TRANSLATION
 BLR_support_of_the_worker: "Podpora dělníků" # todo: NEW TRANSLATION
 BLR_support_of_the_worker_desc: "Dělnická třída je naší oporou a silou. Vždy ji budeme podporovat v boji proti kapitalistické nákaze!" # todo: CHANGED
 BLR_litbel_attack_lat: "Běloruský Latgale" # todo: NEW TRANSLATION
 BLR_litbel_attack_lat_desc: "Lotyšsko nám už dávno odtrhlo země Latgalska. Je čas této nespravedlnosti učinit přítrž." # todo: CHANGED
 BLR_litbel_annex_lat: "Konec Lotyšského státu" # todo: NEW TRANSLATION
 BLR_litbel_annex_lat_desc: "Země Latgalska jsou opět naše." # todo: CHANGED
 BLR_presidential_election_of_2001: "Politická sféra" # todo: NEW TRANSLATION
 BLR_presidential_election_of_2001_desc: "Je čas rozhodnout, kdo povede naši zemi v novém tisíciletí." # todo: CHANGED
 BLR_Andrey_sannikov: "Cesta západní demokracie" # todo: NEW TRANSLATION
 BLR_Andrey_sannikov_desc: "Naše země zvolila nového vůdce. Nyní nás povede do světlé demokratické budoucnosti." # todo: NEW TRANSLATION
 BLR_Join_GUAM: "Připojit GUAM" # todo: NEW TRANSLATION
 BLR_Join_GUAM_desc: "Vstupem do GUAM posílíme naše vazby v postsovětském prostoru." # todo: CHANGED
 BLR_American_Protection: "Americká ochrana" # todo: NEW TRANSLATION
 BLR_American_Protection_desc: "Potřebujeme pomoc Ameriky, protože Rusko naše kroky pravděpodobně nebude ignorovat." # todo: CHANGED
 BLR_Linking_foreign_currency: "Propojit naši měnu s eurem" # todo: NEW TRANSLATION
 BLR_Linking_foreign_currency_desc: "Nestabilita naší měny musí být odstraněna. Navážeme naši měnu na euro." # todo: CHANGED
 BLR_closed_border_with_Russia: "Uzavření hranice s Ruskem" # todo: NEW TRANSLATION
 BLR_closed_border_with_Russia_desc: "Znovu postavíme hraniční přechody s Ruskem. Nikdo z ruského území se nebude moci volně přesouvat do naší země." # todo: CHANGED
 BLR_NATO_Membership_Campaign: "Kampaň za členství v NATO" # todo: NEW TRANSLATION
 BLR_NATO_Membership_Campaign_desc: "Je čas zahájit kampaň na přípravu vstupu do NATO." # todo: CHANGED
 BLR_USA_military_Cooperation: "Vojensko-technická spolupráce USA" # todo: NEW TRANSLATION
 BLR_USA_military_Cooperation_desc: "Spolupráce se Spojenými státy ve vojensko-technické oblasti nám slibuje značné výhody." # todo: CHANGED
 BLR_Invite_NATO_advisors: "Pozvat NATO vojenské poradce" # todo: NEW TRANSLATION
 BLR_Invite_NATO_advisors_desc: "Nyní, když jsme zcela reformovali naše vojenské velení, pozveme vojenské poradce NATO." # todo: CHANGED
 BLR_USAD_request: "Žádost o USAID" # todo: NEW TRANSLATION
 BLR_USAD_request_desc: "Rozhodli jsme se požádat o podporu agenturu USAID." # todo: CHANGED
 BLR_Military_Exercises_NATO: "Vojenské cvičení s NATO" # todo: NEW TRANSLATION
 BLR_Military_Exercises_NATO_desc: "Naše armáda uskuteční první společné cvičení s NATO." # todo: CHANGED
 BLR_NATO_integration_command: "NATO integrační velení" # todo: NEW TRANSLATION
 BLR_NATO_integration_command_desc: "Integrační velení NATO je naším dalším krokem ke vstupu do Aliance." # todo: CHANGED
 BLR_Request_NATO_membership: "Žádost o členství v NATO" # todo: NEW TRANSLATION
 BLR_Request_NATO_membership_desc: "Je čas požádat o členství v NATO." # todo: CHANGED
 BLR_western_diplomats: "Západní diplomaté" # todo: NEW TRANSLATION
 BLR_western_diplomats_desc: "Navštívili nás diplomaté ze západních zemí a pogratulovali nám k vítězství, jehož jsme dosáhli. Nyní si Bělorusko může zvolit cestu na Západ." # todo: CHANGED
 BLR_denied_sanctions: "Zrušení sankcí" # todo: NEW TRANSLATION
 BLR_denied_sanctions_desc: "Nyní, když jsme uspořádali legitimní volby, budou všechny sankce proti nám zrušeny." # todo: CHANGED
 BLR_new_democratic_constitution: "Nová demokratická ústava" # todo: NEW TRANSLATION
 BLR_new_democratic_constitution_desc: "Je čas přijmout novou ústavu odpovídající západní demokracii." # todo: CHANGED
 BLR_people_rights: "Lidská práva" # todo: NEW TRANSLATION
 BLR_people_rights_desc: "Musíme respektovat práva a svobody našeho lidu." # todo: CHANGED
 BLR_Freedom_Meetings: "Svoboda shromáždění a schůzí" # todo: NEW TRANSLATION
 BLR_Freedom_Meetings_desc: "Právo na schůze a shromáždění musí být zajištěno." # todo: CHANGED
 BLR_dont_torture: "Reforma zdravotnictví" # todo: NEW TRANSLATION
 BLR_dont_torture_desc: "Kvalitní zdravotní péče je jednou z nejzákladnějších potřeb našich občanů. Jejím zajištěním budeme moci vybudovat lepší zemi." # todo: CHANGED
 BLR_EU_integration: "Integrace do Evropské unie" # todo: NEW TRANSLATION
 BLR_EU_integration_desc: "Máme v úmyslu integrovat se do Evropské unie." # todo: NEW TRANSLATION
 BLR_Attract_European_investments: "Přilákat evropské investice" # todo: NEW TRANSLATION
 BLR_Attract_European_investments_desc: "Jsme připraveni přilákat evropské investory, abychom zlepšili naši ekonomiku." # todo: CHANGED
 BLR_Opening_garment: "Otevření továren na oděvy pro populární značky" # todo: NEW TRANSLATION
 BLR_Opening_garment_desc: "Jsme připraveni na území naší země založit výrobu oděvů pro populární značky." # todo: CHANGED
 BLR_simplification_labor_code: "Zjednodušení zákoníku práce" # todo: NEW TRANSLATION
 BLR_simplification_labor_code_desc: "Je nutné změnit normy pracovního práva tak, aby se zaměstnanci nemohli neustále uchylovat k odborům místo práce." # todo: CHANGED
 BLR_Encourage_Exchange_Students: "Podpora výměnných studentů" # todo: NEW TRANSLATION
 BLR_Encourage_Exchange_Students_desc: "Naši studenti jsou připraveni účastnit se výměnného programu s evropskými protějšky." # todo: CHANGED
 BLR_Adopt_EU_Intellectual: "Přijmout evropské zákony o duševním vlastnictví" # todo: NEW TRANSLATION
 BLR_Adopt_EU_Intellectual_desc: "Je nutné přijmout evropské zákony o duševním vlastnictví, aby vyhovovaly evropským standardům v této oblasti." # todo: NEW TRANSLATION
 BLR_Digitalization: "Digitalizace" # todo: NEW TRANSLATION
 BLR_Digitalization_desc: "Je nutné digitalizovat výrobní procesy, abychom zlepšili jejich kvalitu." # todo: CHANGED
 BLR_political_platforms: "Vytváření politických platforem pro zahraniční společnosti" # todo: NEW TRANSLATION
 BLR_political_platforms_desc: "Možná bychom měli zahraničním společnostem povolit přístup k našim politickým platformám?" # todo: CHANGED
 BLR_Custom_Institutional_reforms: "Biopaliva" # todo: NEW TRANSLATION
 BLR_Custom_Institutional_reforms_desc: "Alternativní zdroje paliva nám mohou pomoci snížit závislost na zemích, se kterými bychom nechtěli mít žádné přátelské vazby." # todo: NEW TRANSLATION
 BLR_Market_Economy: "Funkční tržní ekonomika" # todo: NEW TRANSLATION
 BLR_Market_Economy_desc: "Plnohodnotná tržní ekonomika je to, o co jsme usilovali, a právě ta by měla fungovat v evropské a demokratické zemi." # todo: CHANGED
 BLR_Delete_KGB2: "Rozpuštění KGB" # todo: NEW TRANSLATION
 BLR_Delete_KGB2_desc: "Nahradíme KGB novou strukturou - Národní bezpečnostní službou. Tato organizace bude rekrutována z zaměstnanců loajálních našim západním ideálům." # todo: NEW TRANSLATION
 BLR_US_money: "Americké investice" # todo: NEW TRANSLATION
 BLR_US_money_desc: "Potřebujeme peníze, abychom mohli dále budovat demokracii v naší zemi." # todo: CHANGED
 BLR_join_wto: "Vstup do WTO" # todo: NEW TRANSLATION
 BLR_join_wto_desc: "Vstup do WTO nám přinese mnoho výhod a přístup na mezinárodní trhy." # todo: CHANGED
 BLR_release_political_prisoners: "Propustit politické vězně" # todo: NEW TRANSLATION
 BLR_release_political_prisoners_desc: "Za předchozí vlády bylo z politických důvodů uvězněno mnoho lidí. Napravíme to." # todo: CHANGED
 BLR_baltic_economic_cooperation: "Obchodní partnerství s Baltskými státy" # todo: NEW TRANSLATION
 BLR_baltic_economic_cooperation_desc: "Naši nejbližší sousedé jsou vynikajícími obchodními partnery. Jejich pobřežní poloha a společné hranice jsou pádnými důvody ke zlepšení naší obchodní bilance." # todo: CHANGED
 BLR_root_out_nationalists: "Zbavme se nacionalistů" # todo: NEW TRANSLATION
 BLR_root_out_nationalists_desc: "Nacionalisté byli v naší zemi vždy problémem. Přinesou pouze nestabilitu a je čas se s nimi vypořádat." # todo: CHANGED
 BLR_decommunize_belarus_society: "Dekomunizace běloruské společnosti" # todo: NEW TRANSLATION
 BLR_decommunize_belarus_society_desc: "Sovětské dědictví musíme nechat za sebou. Nastal čas přijmout pokrokový Západ." # todo: CHANGED
 BLR_fight_the_oligarchs: "Boj proti oligarchům" # todo: NEW TRANSLATION
 BLR_fight_the_oligarchs_desc: "Nemůžeme dovolit oligarchům držet moc v naší zemi, jinak se ekonomického růstu rozhodně nedočkáme." # todo: CHANGED
 BLR_European_university_connections: "Evropské vzdělávání" # todo: NEW TRANSLATION
 BLR_European_university_connections_desc: "Jsme připraveni přivítat v naší zemi evropské univerzity, abychom zlepšili kvalitu vzdělávání našich studentů." # todo: CHANGED
 BLR_LGBT_Belarus_quest: "LGBT otázka v Bělorusku" # todo: NEW TRANSLATION
 BLR_LGBT_Belarus_quest_desc: "LGBT otázka byla na programu naší vlády, protože tuto tendenci nelze ignorovat. Co uděláme?" # todo: NEW TRANSLATION
 BLR_Offshore_heaven: "Daňové výhody pro zahraniční investory" # todo: NEW TRANSLATION
 BLR_Offshore_heaven_desc: "Vytvoříme příznivé podmínky pro investice v naší zemi, což přiláká mnoho investorů." # todo: CHANGED
 BLR_wind_farms: "Větrné farmy" # todo: NEW TRANSLATION
 BLR_wind_farms_desc: "V minských okresech jsme vybudovali několik větrných elektráren." # todo: CHANGED
 BLR_Hajdukiewicz: "Gaidukevich" # todo: NEW TRANSLATION
 BLR_Hajdukiewicz_desc: "Sergej Vasiljevič Gajdukevič (narozen 8. září 1954) je běloruský politik a veřejný činitel, předseda Liberálnědemokratické strany Běloruska. Je to penzionovaný plukovník známý svou proruskou orientací. Zastává konfederaci s Ruskem a zavedení jednotné měny s emisním centrem v Moskvě, stejně jako společnou vojenskou politiku." # todo: CHANGED
 BLR_Spiritual_revival: "Duchovní obrození Běloruska" # todo: NEW TRANSLATION
 BLR_Spiritual_revival_desc: "Proces duchovní obnovy Běloruska musí pokračovat. Úloha pravoslavné a římskokatolické církve ve společnosti by měla vzrůst." # todo: CHANGED
 BLR_Ban_Enemies: "Boj s vnitřními nepřáteli" # todo: NEW TRANSLATION
 BLR_Ban_Enemies_desc: "Musíme zcela vyčistit politické pole v naší zemi. Žádné destruktivní strany financované ze zahraničí nesmějí zasahovat do rozvoje naší země." # todo: CHANGED
 BLR_Russian_Oligarch: "Přátelství s ruskými oligarchy" # todo: NEW TRANSLATION
 BLR_Russian_Oligarch_desc: "Ruští oligarchové disponují obrovským bohatstvím. Myslím, že by stálo za to získat je na naši stranu." # todo: CHANGED
 BLR_Hardline_EuroScepticism: "Přísný euroskepticismus" # todo: NEW TRANSLATION
 BLR_Hardline_EuroScepticism_desc: "Tvrdý euroskepticismus je nezbytný, protože Evropa chce slabé Bělorusko." # todo: CHANGED
 BLR_Belarusian_nation_law: "Běloruské národní právo" # todo: NEW TRANSLATION
 BLR_Belarusian_nation_law_desc: "Náš národ si již dávno vydobyl právo na sebeurčení. Jsme lid s velkou historií a jako suverénní národ musíme vykročit vstříc zářné budoucnosti." # todo: CHANGED
 BLR_russian_education: "Ruské vzdělávání" # todo: NEW TRANSLATION
 BLR_russian_education_desc: "Naše univerzity by měly navázat kontakty s ruskými univerzitami. Tak budeme moci nabídnout ruský typ vzdělání všem." # todo: CHANGED
 BLR_Son_will_rule: "Ať vládne syn." # todo: NEW TRANSLATION
 BLR_Son_will_rule_desc: "Je čas změnit vůdce. Nyní povede stranu i zemi syn Sergeje Gajdukeviče." # todo: CHANGED
 BLR_rus_media: "Přijmout ruská média" # todo: NEW TRANSLATION
 BLR_rus_media_desc: "Povolíme ruským médiím vstup na naše území bez omezení." # todo: CHANGED
 BLR_russian_fsb: "Přijměte zastoupení FSB" # todo: NEW TRANSLATION
 BLR_russian_fsb_desc: "FSB bude spolupracovat s našimi zvláštními službami a poskytne nám větší politickou stabilitu." # todo: CHANGED
 BLR_science_boost: "Investice do vědy" # todo: NEW TRANSLATION
 BLR_science_boost_desc: "Věda by měla být ze státního rozpočtu financována co nejštědřeji." # todo: CHANGED
 BLR_support_promka: "Podpora domácího průmyslu" # todo: NEW TRANSLATION
 BLR_support_promka_desc: "Podpoříme domácí průmysl." # todo: CHANGED
 BLR_boost_economic: "Zrychlení hospodářského růstu" # todo: NEW TRANSLATION
 BLR_boost_economic_desc: "Naše reformy začínají přinášet výsledky a ekonomika začala růst." # todo: CHANGED
 BLR_anti_gibdd: "Politika proti LGBT" # todo: NEW TRANSLATION
 BLR_anti_gibdd_desc: "Odmítáme LGBT propagandu v naší zemi a budeme proti ní bojovat." # todo: CHANGED
 BLR_union_state_course: "Směr ke Sjednocenému státu" # todo: NEW TRANSLATION
 BLR_union_state_course_desc: "Naším cílem je Svazový stát a budeme o něj usilovat." # todo: CHANGED
 BLR_support_army: "Podpora armády" # todo: NEW TRANSLATION
 BLR_support_army_desc: "Podpoříme armádu v naší zemi, protože právě díky ní zůstává naše země nezávislá." # todo: CHANGED
 BLR_russian_tver: "Nákup vagónů" # todo: NEW TRANSLATION
 BLR_russian_tver_desc: "Od Ruska nakoupíme velké množství vagonů pro naše železnice." # todo: CHANGED
 BLR_russian_teplovzor: "Otevření výroby termovizorů" # todo: NEW TRANSLATION
 BLR_russian_teplovzor_desc: "Otevřeme výrobu termovizních přístrojů, které budeme moci prodávat také Rusku pro použití v jeho ozbrojených silách." # todo: CHANGED
 BLR_cyphrovizacia: "Digitalizace" # todo: NEW TRANSLATION
 BLR_cyphrovizacia_desc: "Zahájíme naši cestu k digitální ekonomice." # todo: CHANGED
 BLR_russian_uvz: "Podepsat výlučné smlouvy s UVZ" # todo: NEW TRANSLATION
 BLR_russian_uvz_desc: "Partnerství s tímto známým podnikem nám přinese značné výhody." # todo: CHANGED
 BLR_all_cyphro: "Plná digitalizace" # todo: NEW TRANSLATION
 BLR_all_cyphro_desc: "Digitalizace mnoha vládních procesů nám pomůže efektivněji pracovat s občany a problémy, které vznikají." # todo: CHANGED
 BLR_kalash_zavod: "Otevření továrny na zbraně Kalashnikov" # todo: NEW TRANSLATION
 BLR_kalash_zavod_desc: "Výrobky této slavné značky budeme vyrábět v tuzemsku." # todo: CHANGED
 BLR_Union_state_again: "Připojení k Rusku" # todo: NEW TRANSLATION
 BLR_Union_state_again_desc: "Jsme připraveni znovu se stát součástí Ruska." # todo: CHANGED
 BLR_union_become_one: "Unie se stane jedním státem" # todo: NEW TRANSLATION
 BLR_Lykashenko: "Lukašenko" # todo: CHANGED
 BLR_Lykashenko_desc: "Alexandr Grigorjevič Lukašenko (narozen 30. srpna 1954) je běloruský politik, státník a voják. Od 20. července 1994 zastává úřad prezidenta Běloruska a vrchního velitele ozbrojených sil. Je znám svými proruskými názory. V běloruské a ruskojazyčné společnosti je znám pod přezdívkou „Batka“." # todo: CHANGED
 BLR_GrodnoAzot: "Grodno Azot" # todo: NEW TRANSLATION
 BLR_GrodnoAzot_desc: "Pobočka Chemického závodu akciové společnosti Grodno Azot je významným výrobcem polyamidových a polyesterových přízí a vláken, stejně jako polyamidu-6 (PA-6) a polymerních kompozitních materiálů na jeho bázi. Každý z hlavních typů výrobků se vyrábí v širokém sortimentu s různými fyzikálními a mechanickými vlastnostmi a ukazateli kvality podle zamýšleného použití." # todo: CHANGED
 BLR_PinskDrev: "Financování společnosti „PinskDrev“" # todo: CHANGED
 BLR_PinskDrev_desc: "PinskDrev je velký dřevozpracující podnik v Bělorusku a nejstarší podnik v Pinsku. Měli bychom financovat jeho činnost, aby se mohl dále rozvíjet." # todo: CHANGED
 BLR_AirPort_minsk: "Rozšíření mezinárodního letiště" # todo: NEW TRANSLATION
 BLR_AirPort_minsk_desc: "Jsme připraveni investovat značné finanční prostředky do rozšíření minského letiště." # todo: CHANGED
 BLR_dai_denyag: "Žádat Rusko o půjčku" # todo: NEW TRANSLATION
 BLR_dai_denyag_desc: "Požádáme ruskou vládu o poskytnutí půjčky." # todo: NEW TRANSLATION
 BLR_ros_atom: "ROS ATOM" # todo: NEW TRANSLATION
 BLR_ros_atom_desc: "Pozveme specialisty ROSATOMU ke spolupráci v oblasti jaderné energie." # todo: NEW TRANSLATION
 BLR_Impact_kgb: "Dopad KGB" # todo: NEW TRANSLATION
 BLR_Impact_kgb_desc: "KGB používá různé metody k odstranění těch, kteří nejsou spokojeni se zvolením nového prezidenta." # todo: CHANGED
 BLR_Liquidation_pub_assoc: "Likvidace veřejných sdružení" # todo: NEW TRANSLATION
 BLR_Liquidation_pub_assoc_desc: "KGB aktivně likviduje nebo se pokouší likvidovat veřejná sdružení, která jsou našemu prezidentovi nepohodlná." # todo: CHANGED
 BLR_crackdown_opp_rall: "Zásah proti opozičním shromážděním" # todo: NEW TRANSLATION
 BLR_crackdown_opp_rall_desc: "Aktivně rozháníme shromáždění našich politických odpůrců nespokojených s volbami." # todo: CHANGED
 BLR_Increased_censorship: "Posílení cenzury médií" # todo: NEW TRANSLATION
 BLR_Increased_censorship_desc: "Je nutné zavést silnou cenzuru médií, aby naši odpůrci nemohli agitovat proti nám." # todo: CHANGED
 BLR_concept_national_security_Belarus: "Národní bezpečnostní koncepce" # todo: NEW TRANSLATION
 BLR_concept_national_security_Belarus_desc: "Tato koncepce stanovuje soubor oficiálních názorů na podstatu a obsah činností Republiky Bělorusko, aby zajistila rovnováhu mezi zájmy jednotlivce, společnosti a státu a jejich ochranu před vnitřními i vnějšími hrozbami." # todo: NEW TRANSLATION
 BLR_Economic_development_2001_2005: "Program socioekonomického rozvoje" # todo: NEW TRANSLATION
 BLR_Economic_development_2001_2005_desc: "Program sociálně-ekonomického rozvoje Běloruské republiky na období 2001–2005, vypracovaný ministerstvem hospodářství Běloruské republiky společně s dalšími ministerstvy a republikovými orgány státní správy, oblastními výkonnými výbory a minským městským výkonným výborem za účasti Národní akademie věd, Národní banky, specializovaných výzkumných ústavů a veřejných organizací v souladu se zákonem Běloruské republiky „O státním prognózování a programech sociálně-ekonomického rozvoje Běloruské republiky“ a usneseními Rady ministrů Běloruské republiky ze dne 2. února 2000 č. 141 a ze dne 10. srpna 2000 č. 1248 o vypracování Programu sociálně-ekonomického rozvoje Běloruské republiky na období 2001–2005." # todo: CHANGED
 BLR_reforms_Belarusian_Railway: "Reformy běloruské železnice" # todo: NEW TRANSLATION
 BLR_reforms_Belarusian_Railway_desc: "Naše železnice jsou ve velmi špatném stavu, proto provedeme soubor reforem ke zlepšení situace." # todo: CHANGED
 BLR_new_railway_station: "Nové Minské nádraží" # todo: NEW TRANSLATION
 BLR_new_railway_station_desc: "V Minsku jsme vybudovali nové vlakové nádraží. Naše město nyní bude moci přijímat více vlaků." # todo: CHANGED
 BLR_Electrification_Myslishche_Kryzhovka: "Elektrifikace trati Myslišče–Kryžovka" # todo: CHANGED
 BLR_Electrification_Myslishche_Kryzhovka_desc: "Trať Myslišče–Kryžovka je jednou z nejvyšších rozvojových priorit v naší zemi, proto se jí budeme věnovat jako první." # todo: CHANGED
 BLR_Baranovichi_Plant: "Baranovichi Plant" # todo: NEW TRANSLATION
 BLR_Baranovichi_Plant_desc: "Vytváříme strukturální divizi Baranovičského závodu stavebních součástí a konstrukcí, abychom zlepšili dodávky součástí pro naše vlaky." # todo: CHANGED
 BLR_Energy_conflict_over: "Prodej Belgaztransu" # todo: NEW TRANSLATION
 BLR_Energy_conflict_over_desc: "Konflikt se chýlí ke konci. Přistoupili jsme na ruské podmínky a jsme připraveni prodat společnost Belgaztrans. Na oplátku budou pro nás stabilizovány ceny energií." # todo: CHANGED
 BLR_new_rolling_stock: "Nákup nových kolejových vozidel" # todo: NEW TRANSLATION
 BLR_new_rolling_stock_desc: "Nákupem nových kolejových vozidel odstraníme hlavní problém sužující naše železnice." # todo: CHANGED
 BLR_promise_first_nuclear: "Slib vybudování jaderné elektrárny" # todo: NEW TRANSLATION
 BLR_promise_first_nuclear_desc: "Slibujeme všem našim občanům, že na území naší země bude vybudována jaderná elektrárna, čímž zajistíme naši energetickou bezpečnost." # todo: CHANGED
 BLR_New_Land_code: "Nový zákon o půdě" # todo: NEW TRANSLATION
 BLR_New_Land_code_desc: "Nový pozemkový zákon výrazně zjednodušuje nákup půdy soukromými vlastníky a společnostmi, což jistě potěší určitou část obyvatelstva." # todo: CHANGED
 BLR_Zubr_Energy_LLC: "Otevření Zubr Energy LLC" # todo: NEW TRANSLATION
 BLR_Zubr_Energy_LLC_desc: "Závod na výrobu startovacích baterií pro dodávky na výrobní linky světových i domácích automobilů." # todo: NEW TRANSLATION
 BLR_Hi_Tech_Park: "Hi-Tech Park" # todo: NEW TRANSLATION
 BLR_Hi_Tech_Park_desc: "Hi-Tech Park je zvláštní daňový a právní režim pro rozvoj IT podnikání v Bělorusku. Nejedná se o volnou (zvláštní či speciální) ekonomickou zónu, ale o jurisdikci fungující na principu extrateritoriality. Společnosti a jednotliví podnikatelé registrovaní v Parku mohou využívat poskytované výhody bez ohledu na umístění své běloruské kanceláře." # todo: CHANGED
 BLR_Referendum_Belarus_2004: "Referendum v Bělorusku 2004" # todo: NEW TRANSLATION
 BLR_Referendum_Belarus_2004_desc: "Dne 17. října 2004 hostovalo Bělorusko třetí republikánské referendum, které v historii nezávislého Běloruska vyhlásil prezident Lukašenko. Referendum bylo stanoveno prezidentským dekretem č. 431 ze dne 7. září 2004 a bylo sloučeno s parlamentními volbami." # todo: NEW TRANSLATION
 BLR_Energy_conflict: "Ruskoběloruský energetický konflikt" # todo: NEW TRANSLATION
 BLR_Energy_conflict_desc: "Konflikt započal v prosinci 2006, když Gazprom oznámil konečnou verzi ceny zemního plynu pro Republiku Bělorusko ve výši 105 USD za 1000 m3. Dále 75 USD se platí hotově a Bělorusko by mělo právo zaplatit zbývajících 30 akciemi Beltransgaz, jejichž hodnota byla odhadována na 5 miliard dolarů." # todo: NEW TRANSLATION
 BLR_Decree_n3: "Dekret o parazitismu" # todo: NEW TRANSLATION
 BLR_Decree_n3_desc: "Už nikdo nebude žít ze státních dávek. Je čas přimět všechny zahálející k práci." # todo: CHANGED
 BLR_launch_own_satellite: "Spuštění vlastního satelitu Běloruska" # todo: NEW TRANSLATION
 BLR_launch_own_satellite_desc: "Bělorušký satelit pro dálkové pozorování Země byl vypuštěn 22. července 2012 z kosmodromu Baikonur v Kazachstánu – ve skupině pěti kosmických plavidel: spolu s ruským Canopus-V a MKA-FKI (Zond-PP), německým TET-1 a kanadským ADS-1B." # todo: NEW TRANSLATION
 BLR_gasification_country: "Dokončení plynování země" # todo: NEW TRANSLATION
 BLR_gasification_country_desc: "Dokončíme plynofikaci naší země, což naši občané jistě ocení." # todo: CHANGED
 BLR_CJSC_Turkcell: "Dohoda s Turkcell" # todo: NEW TRANSLATION
 BLR_CJSC_Turkcell_desc: "Mezi námi a našimi tureckými partnery bude uzavřen významný obchod: prodej kontrolního podílu v akciové společnosti „BeST“ společnosti Turkcell. Tím se otevře další cesta pro investice v naší zemi." # todo: CHANGED
 BLR_Anti_Corruption: "Kampaň proti korupci" # todo: NEW TRANSLATION
 BLR_Anti_Corruption_desc: "Musíme v naší zemi porazit korupci. Hlavní je, abychom v ní nakonec nebyli sami namočeni." # todo: CHANGED
 BLR_Punish_Shushkevich: "Potrestat Šuškevičovy kumpány" # todo: CHANGED
 BLR_Punish_Shushkevich_desc: "Šuškevič nám ve vládě zanechal své věrné stoupence. Je čas se jich zbavit." # todo: CHANGED
 BLR_State_Run_Capitalism: "Státní kapitalismus" # todo: NEW TRANSLATION
 BLR_State_Run_Capitalism_desc: "Stát by měl zcela kontrolovat hospodářskou politiku země." # todo: CHANGED
 BLR_reform_officers: "Otevřít nové důstojnické školy" # todo: NEW TRANSLATION
 BLR_reform_officers_desc: "Jednou z priorit našich vojenských reforem je zlepšení vzdělávání důstojníků." # todo: CHANGED
 BLR_peace_rota: "Vytvořit mírovou jednotku" # todo: NEW TRANSLATION
 BLR_peace_rota_desc: "Vytvoříme zvláštní jednotku pro účast v mírových misích." # todo: CHANGED
 BLR_Promote_new_officers: "Dokončit vojenské reformy v Bělorusku" # todo: NEW TRANSLATION
 BLR_Promote_new_officers_desc: "Dokončíme soubor opatření k přeměně našich ozbrojených sil, která byla zahájena v roce 1994." # todo: CHANGED
 BLR_Internet_cencorship: "Cenzura internetu" # todo: NEW TRANSLATION
 BLR_Internet_cencorship_desc: "Internet se stal platformou, kde se otevřeně diskutuje o náladách zaměřených na svržení vlády. Je nutné to kontrolovat." # todo: CHANGED
 BLR_kgb: "KGB" # todo: NEW TRANSLATION
 BLR_Batka_policy: "Cenzura internetu" # todo: NEW TRANSLATION
 BLR_Batka_policy1: "Dekret o parazitismu" # todo: NEW TRANSLATION
 BLR_Batka_policy3: "Internetová politika Běloruska" # todo: NEW TRANSLATION
 BLR_Raiffeisen2: "Raiffeisen v Bělorusku" # todo: NEW TRANSLATION
 BLR_Raiffeisen2_desc: "Priorbank, založený v roce 1989, je od roku 2003 dceřinou společností RBI. Je jednou z největších místních soukromých bank a jednou z předních finančních institucí v zemi z hlediska efektivity a ziskovosti. Jako univerzální banka poskytuje služby firemním zákazníkům, malým a středním podnikům i soukromým osobám." # todo: CHANGED
 BLR_Henkel2: "Henkel" # todo: NEW TRANSLATION
 BLR_Henkel2_desc: "Divize stavební chemie koncernu Henkel v Bělorusku, společnost Henkel Bautechnik LLC, byla založena v roce 2004 s cílem organizovat výrobu výrobků nahrazujících dovoz. V roce 2005 začala v Zaslavli výstavba závodu na výrobu stavebních směsí Ceresit a výroba byla zahájena v září 2006. Sortiment společnosti zahrnuje více než 100 položek včetně hotových obkladových, tepelně izolačních a fasádních systémů, podlahových a hydroizolačních systémů, materiálů pro přípravu povrchů k dokončení, tmelů, montážní pěny, „tekutých hřebíků“ a omítek." # todo: CHANGED
 BLR_Jeans_Revolution: "Revoluce džínů" # todo: NEW TRANSLATION
 BLR_Jeans_Revolution_desc: "Masové protestní shromáždění v centru Minsku a dalších běloruských městech, které začalo 19. března 2006 v reakci na falšování prezidentských voleb ze strany úřadů." # todo: CHANGED
 BLR_reform_kolhoz: "Reformy kolchozů" # todo: NEW TRANSLATION
 BLR_reform_kolhoz_desc: "Je nutné reformovat kolchozy, aby byla zajištěna stabilita našeho zemědělsko-průmyslového odvětví." # todo: CHANGED
 BLR_Eastern_Partnership: "Východní partnerství" # todo: NEW TRANSLATION
 BLR_Eastern_Partnership_desc: "Východní partnerství je projekt Evropské unie, jehož hlavním deklarovaným cílem je rozvoj integračních vazeb Evropské unie se šesti zeměmi bývalého SSSR: Ázerbájdžánem, Arménií, Běloruskem, Gruzií, Moldavskem a Ukrajinou." # todo: CHANGED
 BLR_Azarenok_case: "Případ Igora Azarenoka" # todo: NEW TRANSLATION
 BLR_Azarenok_case_desc: "Generál Azarenok byl podezřelý z lobbování za ruské zájmy v Běloruské republice prostřednictvím úplatků a dalších podvodů. Měli bychom tomu věnovat pozornost?" # todo: CHANGED
 BLR_National_Library: "Nová budova Národní knihovny" # todo: NEW TRANSLATION
 BLR_National_Library_desc: "Nová budova Národní knihovny Běloruska, na jejíž výstavbě se podílela celá země, byla uživatelům zpřístupněna 16. června 2006." # todo: NEW TRANSLATION
 BLR_delta_city: "Obchodní centrum „Delta City“" # todo: CHANGED
 BLR_delta_city_desc: "Během Národní výstavy Srbska v Minsku byla podepsána významná smlouva na výstavbu obchodního centra Delta City a rozvoj území v blízkosti Národní knihovny s celkovou investicí několika miliard eur (developerem je společnost Dana Holdings vlastněná srbskými podnikateli)." # todo: CHANGED
 BLR_Kal: "Společný obchodník s draslíkem" # todo: NEW TRANSLATION
 BLR_Kal_desc: "Navrhneme Rusku vytvoření akciové společnosti, která bude naším společným obchodníkem s potašem." # todo: CHANGED
 BLR_Kal2: "Uzavřít společného obchodníka s draslíkem" # todo: NEW TRANSLATION
 BLR_Kal2_desc: "Nedávné trestní případy, které jsme zahájili proti zaměstnancům ruské společnosti Uralkali, stejně jako zneužití pravomoci z jejich strany, nás donutily společného obchodníka uzavřít a vytvořit vlastního." # todo: CHANGED
 BLR_BRSM: "Běloruská republikánská mládežnická unie" # todo: NEW TRANSLATION
 BLR_BRSM_desc: "Běloruská republikánská mládežnická unie je mládežnická veřejná asociace v Bělorusku. Je největší mládežnickou asociací v zemi a je podporována Alexandrem Lukašenkem. Její činnost financuje stát." # todo: NEW TRANSLATION
 BLR_Potato_Empire: "Bramborové impérium" # todo: NEW TRANSLATION
 BLR_Potato_Empire_desc: "Jsme jedním z největších vývozců brambor na světě. Naše země by na to měla být hrdá." # todo: CHANGED
 BLR_Factory_Kommunarka: "Nazionalizovat továrnu Kommunarka" # todo: NEW TRANSLATION
 BLR_Factory_Kommunarka_desc: "Náš prezident se domnívá, že privatizace cukrovinkářského závodu „Kommunarka“ byla nezákonná, proto bylo oznámeno znárodnění tohoto podniku." # todo: CHANGED
 BLR_Another_year: "Další rok nezávislosti" # todo: NEW TRANSLATION
 BLR_Another_year_desc: "Bělorusko bude i nadále sledovat svou nezávislou politiku." # todo: CHANGED
 BLR_Migrant_crisis: "Migrační krize" # todo: NEW TRANSLATION
 BLR_Migrant_crisis_desc: "Migrační krize na hranici Běloruska vznikla v důsledku přílivu ilegálních migrantů, převážně z Iráku a Sýrie, do menší míry z Afghánistánu a z méně rozšířených afrických zemí (podle statistik Polské hraniční služby), kteří se snaží dostat do zemí EU (Litva, Lotyšsko, Polsko)." # todo: NEW TRANSLATION
 BLR_gudermes: "Pošlete OMON na výcvik do čečenského Gudermesu" # todo: NEW TRANSLATION
 BLR_gudermes_desc: "Měli bychom se podívat na tuto proslulou univerzitu speciálních jednotek. Možná naši bojovníci budou moci zlepšit své dovednosti." # todo: NEW TRANSLATION
 BLR_Another_Elections: "A znovu volby" # todo: NEW TRANSLATION
 BLR_Another_Elections_desc: "Další volby v naší zemi jsou za dveřmi. Kdo zvítězí?" # todo: CHANGED
 BLR_Bye_opposition: "Žádná milost pro opozici" # todo: NEW TRANSLATION
 BLR_Bye_opposition_desc: "Děláme to, co vždycky. S opozicí zatočíme tvrdě a rychle." # todo: CHANGED
 BLR_Milk_war: "Války o mléko" # todo: NEW TRANSLATION
 BLR_Milk_war_desc: "Série zhoršení vztahů mezi Běloruskem a Ruskem vyplývající ze sporů o vývoz mléčných výrobků do Ruska." # todo: CHANGED
 BLR_jeans_revolution: "Jeans revoluce" # todo: NEW TRANSLATION
 BLR_jeans_revolution_desc: "Lidé jsou nespokojeni s nadcházejícími volbami. Údajně nevěří ve vítězství Alexandra Lukašenka. Co bude dál?" # todo: CHANGED
 BLR_Changes_Customs_policy: "Změna celní politiky" # todo: NEW TRANSLATION
 BLR_Changes_Customs_policy_desc: "Byly zavedeny nové změny a restrikce, které mají zkomplikovat dovoz padělaných výrobků do naší země." # todo: CHANGED
 BLR_whitelegion_case: "Případ Bílé legie" # todo: NEW TRANSLATION
 BLR_whitelegion_case_desc: "Naše zvláštní služby informovaly o velké aktivitě představitelů Bílé legie. Je nutné je dopadnout a uvěznit." # todo: CHANGED
 BLR_PolBel_Dplomatic_war: "Polsko-běloruská diplomatická válka" # todo: NEW TRANSLATION
 BLR_PolBel_Dplomatic_war_desc: "Navzdory oteplování vztahů se konflikt s Polskem znovu rozhořívá v plné síle." # todo: CHANGED
 BLR_project_bombel: "Projekt BOMBEL" # todo: NEW TRANSLATION
 BLR_project_bombel_desc: "Evropská unie přidělila prostředky na posílení hranice mezi Běloruskem a EU proti přílivu nelegálních migrantů. Naše vláda nyní rozhoduje, jak tyto prostředky využít." # todo: CHANGED
 BLR_Investing_Agro_industry: "Investice do agroprůmyslu" # todo: NEW TRANSLATION
 BLR_Investing_Agro_industry_desc: "Zemědělsko-průmyslové odvětví je důležitou součástí ekonomiky naší země a budeme nadále zvyšovat investice do tohoto sektoru." # todo: CHANGED
 BLR_fate_belarusian_church: "Osud běloruské církve" # todo: NEW TRANSLATION
 BLR_fate_belarusian_church_desc: "Měli bychom rozhodnout, jakým směrem se bude naše církev ubírat." # todo: CHANGED
 BLR_Pension_reform: "Důchodová reforma" # todo: NEW TRANSLATION
 BLR_Pension_reform_desc: "Je čas provést důchodovou reformu a zvýšit věk odchodu do důchodu." # todo: CHANGED
 BLR_New_concept_security: "Nová koncepce národní bezpečnosti" # todo: NEW TRANSLATION
 BLR_New_concept_security_desc: "Naše obranná koncepce potřebuje aktualizaci a my provedeme nezbytné změny v našem právu." # todo: CHANGED
 BLR_Zimbabwe: "Cesta do Zimbabwe" # todo: NEW TRANSLATION
 BLR_Zimbabwe_desc: "Navštívíme Zimbabwe, abychom uzavřeli smlouvy na dodávky našich výrobků." # todo: CHANGED
 BLR_100dney: "100 nápadů pro Bělorusko" # todo: NEW TRANSLATION
 BLR_100dney_desc: "Projekt „100 nápadů pro Bělorusko“, jehož cílem je vyhledávání nadané a talentované mládeže, rozvoj její vědecké činnosti a podpora perspektivního inovativního vývoje." # todo: CHANGED
 BLR_stroiotryad: "Obnovit studentskou stavební brigádu" # todo: NEW TRANSLATION
 BLR_stroiotryad_desc: "Obnovíme praxi studentských stavebních brigád ze sovětské éry. Jako pobídku je osvobodíme od daní." # todo: CHANGED
 BLR_People_Militia: "Vytvoření lidových milicí" # todo: CHANGED
 BLR_People_Militia_desc: "Jsme připraveni přijmout zákon o vytvoření lidových milicí, které budou jakousi rezervou územní obrany. V každé vesnici by měla existovat vycvičená skupina lidí schopná čelit nepříteli s následnou přeměnou v partyzánské hnutí." # todo: CHANGED
 BLR_Excursion_Warsaw: "Exkurze do Varšavy" # todo: NEW TRANSLATION
 BLR_Excursion_Warsaw_desc: "Wagnerovci aktivně agitují a vyjadřují přání uspořádat „výlet“ do Varšavy. Můžeme jim pomoci ho zorganizovat. Překročení hranice z našeho území je teoreticky možné, ale vyhlásí nám pak Polsko válku?" # todo: CHANGED
 BLR_Excursion_Vilnius: "Exkurze do Vilniusu" # todo: NEW TRANSLATION
 BLR_Excursion_Vilnius_desc: "Wagnerovci aktivně agitují a vyjadřují přání uspořádat „výlet“ do Vilniusu. Můžeme jim pomoci ho zorganizovat. Překročení hranice z našeho území je teoreticky možné, ale vyhlásí nám pak Litva válku?" # todo: CHANGED
 BLR_azarenok_tv: "Nový propagandista Lukašenka" # todo: NEW TRANSLATION
 BLR_azarenok_tv_desc: "Nyní můžete v televizi často vídat nového propagandistu, který vysílá jménem naší strany a přesvědčuje lid o správnosti našich kroků." # todo: CHANGED
 BLR_Wagner_arrest: "Situace s Wagnerovou PMC" # todo: CHANGED
 BLR_Wagner_arrest_desc: "Naše zvláštní služby zatkly bojovníky ze slavné ruské PMC Wagner. Musíme rozhodnout, co s nimi." # todo: CHANGED
 BLR_decree_227: "Výnos č. 227 „O poskytování bezpečnostních služeb“" # todo: CHANGED
 BLR_decree_227_desc: "Nový dekret číslo 227 vyvolal značný rozruch mezi mnoha médii. Poprvé jsme umožnili soukromé firmě přijímat zbraně k ochraně objektů. Dočkáme se tím skutečně něčeho?" # todo: NEW TRANSLATION
 BLR_Country_for_life: "Země pro život" # todo: NEW TRANSLATION
 BLR_Country_for_life_desc: "Naše vláda se rozhodla vypořádat s opozicí lstivěji a přilákat její významné představitele na naši stranu. Jedním z nich je Sergej Tichanovskij, organizátor projektu „Země pro život“. Po následujících událostech jsme ho místo zatčení veřejně pozvali do vlády, kde by mohl pomoci zlepšit naši zemi. Opozice se takovým krokem sama rozdělí." # todo: CHANGED
 BLR_Amendment_to_Constitution: "Závažné změny v ústavě" # todo: NEW TRANSLATION
 BLR_Amendment_to_Constitution_desc: "Náš stálý vůdce Alexandr Lukašenko uznal, že země potřebuje radikální změny a že je čas odklonit se od výhradní prezidentské moci. Bylo vyhlášeno referendum o změně ústavy, podle níž bude moc z větší části náležet parlamentu." # todo: CHANGED
 BLR_army_on_streets_of_cities: "Masové protesty" # todo: NEW TRANSLATION
 BLR_army_on_streets_of_cities_desc: "Lid se proti nám vzbouřil. Domnívá se, že naše vláda falšuje výsledky voleb a ničí zemi. Doufám, že jsme se na takové události dobře připravili." # todo: CHANGED
 BLR_anti_lgbtqa_stance: "Politika vůči LGBT" # todo: NEW TRANSLATION
 BLR_Pazniak: "Běloruští nacionalisté" # todo: NEW TRANSLATION
 BLR_Pazniak_desc: "Nacionalistické síly se v zemi chopily moci. Kam povedou Bělorusko: ke světlejší budoucnosti, nebo k rozpadu země?" # todo: CHANGED
 BLR_rofeign_legion: "Zahraniční legie" # todo: NEW TRANSLATION
 BLR_rofeign_legion_desc: "Využijeme zkušeností Francouzů a vytvoříme vlastní cizineckou legii." # todo: CHANGED
 BLR_debur: "Deregulace byrokracie" # todo: NEW TRANSLATION
 BLR_debur_desc: "Omezíme výdaje na úředníky a snížíme jejich počet; uvolněné prostředky půjdou ve prospěch lidu." # todo: CHANGED
 BLR_patriotism: "Patriotismus" # todo: NEW TRANSLATION
 BLR_patriotism_desc: "Je čas zvýšit úroveň vlastenecké výchovy v naší zemi." # todo: CHANGED
 BLR_Belarusisation: "Bělorusizace" # todo: NEW TRANSLATION
 BLR_Belarusisation_desc: "Veškerá literatura i všechny úřední názvy musí být v běloruštině." # todo: CHANGED
 BLR_Democratic_clean: "Čistky Demokratů" # todo: NEW TRANSLATION
 BLR_Democratic_clean_desc: "Nechystáme se stát služebníky Západu. Je čas očistit naši zemi od demokratů." # todo: CHANGED
 BLR_Communistst_clean: "Čistka komunistů" # todo: NEW TRANSLATION
 BLR_Communistst_clean_desc: "Dědictví SSSR musí být zničeno. Je čas vyhnat tyto stoupence rudé nákazy." # todo: CHANGED
 BLR_denied_rus_language: "Zakázaný ruský jazyk" # todo: NEW TRANSLATION
 BLR_denied_rus_language_desc: "Ruština již nebude druhým státním jazykem. Ruské okupace už máme dost." # todo: CHANGED
 BLR_Anti_corruption_law: "Zákon proti korupci" # todo: NEW TRANSLATION
 BLR_Anti_corruption_law_desc: "Budeme bojovat proti korupci ve všech jejích podobách." # todo: CHANGED
 BLR_anti_immigration_policies: "Politiky proti imigraci" # todo: NEW TRANSLATION
 BLR_anti_immigration_policies_desc: "Zavedení přísnější protiimigrační politiky udrží běloruskou identitu živou a silnou." # todo: CHANGED
 BLR_russofobia: "Rusofobní politika" # todo: NEW TRANSLATION
 BLR_russofobia_desc: "Je čas vypořádat se se společným nepřítelem: Ruskem. Je čas zkrotit jeho imperialistické ambice vůči nám." # todo: CHANGED
 BLR_decolectivisation: "Dekolektivizace" # todo: NEW TRANSLATION
 BLR_decolectivisation_desc: "Je čas zbavit se sovětského dědictví a pomoci obyvatelstvu přesunout se do měst." # todo: CHANGED
 BLR_litvins_past: "Litvinská minulost" # todo: NEW TRANSLATION
 BLR_litvins_past_desc: "Historie se nedá změnit, a my to víme. My Litvané jsme hrdí dědici Velkovévodství litevského." # todo: NEW TRANSLATION
 BLR_constitution_from_1994: "Ústava 1994" # todo: NEW TRANSLATION
 BLR_constitution_from_1994_desc: "Je čas obnovit řádnou ústavu v naší zemi." # todo: CHANGED
 BLR_We_not_energy_slave: "Nejsme otroky ruských zdrojů" # todo: NEW TRANSLATION
 BLR_We_not_energy_slave_desc: "Rusko poskytovalo slevy pouze na podporu svého loutkového režimu. To stačí. Jsme připraveni vybudovat silnou ekonomiku bez těchto slev." # todo: CHANGED
 BLR_Influence_nationalists: "Vliv nacionalistů" # todo: NEW TRANSLATION
 BLR_Influence_nationalists_desc: "Musíme aktivně podporovat nacionalistická hnutí v sousedních zemích." # todo: CHANGED
 BLR_Territorial_claims: "Územní nároky" # todo: NEW TRANSLATION
 BLR_Territorial_claims_desc: "Naše země se musí vrátit ke svým skutečným hranicím." # todo: CHANGED
 BLR_white_legion: "Bílá legie" # todo: NEW TRANSLATION
 BLR_white_legion_desc: "Bílá legie je běloruská sportovní a vlastenecká organizace založená v roce 1995 pro předvojenskou přípravu a vlasteneckou výchovu mládeže." # todo: CHANGED
 BLR_white_legion_battalion: "Prapor Bílé legie" # todo: NEW TRANSLATION
 BLR_white_legion_battalion_desc: "První prapor Bílé legie byl konečně vytvořen. Praví vlastenci své země jsou připraveni bojovat za její svobodu a sílu." # todo: CHANGED
 BLR_GDL: "Velkovévodství litevské" # todo: NEW TRANSLATION
 BLR_GDL_desc: "Je čas obnovit velký stát Litvinů. Konečně náš lid nebude pod jhem velmoci; dostane příležitost stát se velmocí sám." # todo: CHANGED
 BLR_help_silesians: "Pomozte slezským separatistům" # todo: NEW TRANSLATION
 BLR_help_silesians_desc: "Rozděl a panuj je hlavní zásadou, kterou uplatníme ve své politice vůči Polsku. Až začne aktivní fáze podmaňování Poláků naší kontrole, Slezané mohou pomoci usnadnit naše dobytí této země." # todo: CHANGED
 BLR_revansh_return: "Oživit Pravý revanš" # todo: NEW TRANSLATION
 BLR_revansh_return_desc: "Pravý revanš byla nacionalistická organizace z 90. let, která hlásala protipolskou a protiruskou rétoriku a prosazovala vytvoření polovojenských organizací podle ukrajinského vzoru." # todo: CHANGED
 BLR_blackcat: "Revive the Black Cat" # todo: NEW TRANSLATION
 BLR_blackcat_desc: "Černá kočka byla rozsáhlá partyzánská organizace, která působila na běloruském území čtyřicet let a bojovala za nezávislost proti sovětské vládě. Jejich metody se nám budou hodit při obraně proti nepřátelským invazím." # todo: CHANGED
 BLR_lith_again: "Zpět do Žemaitie" # todo: NEW TRANSLATION
 BLR_lith_again_desc: "Nastal čas dokončit obnovu našeho mocného státu. V cestě nám stojí malá a slabá Litva; zlomíme ji. Nemůžeme však na zemi zaútočit bez odůvodnění. Musíme vytvořit nezbytné podmínky a záminku, aby naše invaze nevypadala bezdůvodně." # todo: CHANGED
 BLR_true_political_and_national_freedom: "Skutečná politická svoboda" # todo: NEW TRANSLATION
 BLR_true_political_and_national_freedom_desc: "Skutečná politická svoboda začíná zotavením z devastace způsobené našimi vnitřními čistkami. Je čas vykročit vpřed a dosáhnout toho, po čem náš lid skutečně touží." # todo: CHANGED
 BLR_Taler_ruble: "Běloruský taler" # todo: NEW TRANSLATION
 BLR_Taler_ruble_desc: "Musíme rubl zcela opustit a nahradit ho naší novou měnou." # todo: CHANGED
 BLR_National_science: "Vědecký a hospodářský růst" # todo: NEW TRANSLATION
 BLR_National_science_desc: "Jako nezávislý stát začneme rozvíjet vlastní vědu a ekonomiku." # todo: CHANGED
 BLR_create_nationalsecurity: "Vytvoření nových útvarů" # todo: NEW TRANSLATION
 BLR_create_nationalsecurity_desc: "Namísto KGB, dědictví SSSR, vytvoříme dvě nové struktury: Národní bezpečnostní službu a Národní zpravodajskou službu." # todo: CHANGED
 BLR_Delete_KGB: "Rozpusťte KGB" # todo: NEW TRANSLATION
 BLR_Delete_KGB_desc: "KGB by měla být rozpuštěna a nahrazena novou strukturou." # todo: CHANGED
 BLR_Reform_Police: "Policejní reformy" # todo: NEW TRANSLATION
 BLR_Reform_Police_desc: "Sovětské milice byly reliktem minulosti, kterého se chceme zbavit. Reorganizujeme je v národní policii podle polského vzoru." # todo: CHANGED
 BLR_attack_russian_bear: "Zlikvidujte ruského medvěda" # todo: NEW TRANSLATION
 BLR_attack_russian_bear_desc: "Konečně bude náš hlavní nepřítel zničen." # todo: CHANGED
 BLR_zmagar_army: "Armádní reforma" # todo: NEW TRANSLATION
 BLR_zmagar_army_desc: "Naše armáda potřebuje naléhavou reformu. Zatímco jsme se zabývali společensko-politickou transformací naší země, naše ozbrojené síly byly vážně oslabeny." # todo: CHANGED
 BLR_Young_Front: "Mladá Fronta" # todo: NEW TRANSLATION
 BLR_Young_Front_desc: "Mladá fronta je mezinárodní mládežnické hnutí běloruské mládeže a mládežnická opoziční organizace v Bělorusku." # todo: CHANGED
 BLR_south_river_battalion: "Jižní říční pluk" # todo: NEW TRANSLATION
 BLR_south_river_battalion_desc: "Prapor složený z obyvatel USA z South River County." # todo: NEW TRANSLATION
 BLR_territorial_reform: "Územní reforma" # todo: NEW TRANSLATION
 BLR_territorial_reform_desc: "Namísto dnešních šesti regionů a 110 okresů navrhuje Zenon Poznyak a tým autorů programu rozdělit zemi na 16 voivodství, přičemž Minsk bude zvlášť. Voivodství se pak rozdělí na 60 provincií a 270 starých měst." # todo: NEW TRANSLATION
 BLR_anti_lgbt: "Zákaz propagace perverzních vztahů" # todo: NEW TRANSLATION
 BLR_anti_lgbt_desc: "Přijímáme zákon o prioritě a ochraně rodiny, manželství (svazek muže a ženy), mateřství, o ochraně rodiny před vměšováním a zasahováním ideologií a organizacemi. Navíc se navrhuje zákon 'o ochraně lidské přirozenosti' a zákaz propagace perverzních vztahů proti přirozené povaze člověka." # todo: NEW TRANSLATION
 BLR_latgale_or_war: "Latgale nebo válka" # todo: NEW TRANSLATION
 BLR_latgale_or_war_desc: "Latgale bylo kdysi součástí Litevského velkoknížectví. Nastal čas vrátit tyto země našemu státu. Lotyšsko nám pravděpodobně nebude schopno odolat." # todo: CHANGED
 BLR_legacy_kurland: "Dědictví Courlandského vévodství" # todo: NEW TRANSLATION
 BLR_legacy_kurland_desc: "Kuronské vévodství se kdysi zapojilo do koloniálních závodů. Vlajka vévodství kdysi vlála nad Trinidadem a Tobagem i podél pobřeží Gambie. Jako právoplatní nástupci vévodství nastal čas požadovat návrat těchto území do naší říše a znovu začlenit tyto bývalé koloniální državy." # todo: CHANGED
 BLR_pro_poland_propoganda: "Proběloruská propaganda v Polsku" # todo: CHANGED
 BLR_pro_poland_propoganda_desc: "Musíme zvýšit svůj vliv v Polsku prostřednictvím propagandy a dalších forem působení." # todo: CHANGED
 BLR_Dismiss_soviet_officers: "Propustit prosovětské důstojníky" # todo: CHANGED
 BLR_Dismiss_soviet_officers_desc: "Boj proti sovětskému dědictví se musí týkat také armády. Nepotřebujeme generály, kteří sympatizují s tímto krvavým režimem." # todo: CHANGED
 BLR_open_border_with_pol: "Otevřené hranice" # todo: NEW TRANSLATION
 BLR_open_border_with_pol_desc: "Otevření hranic pomůže našim lidem cítit se propojenými nejen ekonomicky, ale i fyzicky." # todo: NEW TRANSLATION
 BLR_training_for_pol: "Společné vojenské cvičení" # todo: NEW TRANSLATION
 BLR_training_for_pol_desc: "Naše armády potřebují sehranost. Společná vojenská cvičení s tím výrazně pomohou." # todo: CHANGED
 BLR_Asseco_Poland: "Asseco Poland" # todo: NEW TRANSLATION
 BLR_Asseco_Poland_desc: "Tuto společnost odkoupíme a učiníme ji majetkem našeho budoucího státu Bělorusů a Poláků." # todo: CHANGED
 BLR_ynia_Poland: "Druhá Lublinská unie" # todo: NEW TRANSLATION
 BLR_ynia_Poland_desc: "Je čas připomenout si, jak ponižující byla Lublinská unie pro Litevské velkoknížectví. Tentokrát to bude jiné." # todo: CHANGED
 BLR_Ukraine_way: "Přátelství s Ukrajinou" # todo: NEW TRANSLATION
 BLR_Ukraine_way_desc: "Navzdory našim územním nárokům jsme připraveni vést s Ukrajinou dialog proti společným nepřátelům. Možná bude možné vytvořit alianci, která pomůže našim státům přežít obklíčení protivníky." # todo: CHANGED
 BLR_Join_GUAM_to_Ukraine: "Připojte GUAM" # todo: NEW TRANSLATION
 BLR_Join_GUAM_to_Ukraine_desc: "Jedním z našich prvních přátelských kroků vůči Ukrajině bude vstup do GUAM, organizace, v níž Ukrajina hraje vedoucí úlohu." # todo: CHANGED
 BLR_training_with_ukr: "Společné vojenské cvičení" # todo: NEW TRANSLATION
 BLR_training_with_ukr_desc: "Jsme připraveni navrhnout ukrajinské armádě společná cvičení k procvičení manévrů a koordinace vojsk." # todo: CHANGED
 BLR_military_coop_with_ukraine: "Vojensko-technická spolupráce" # todo: CHANGED
 BLR_military_coop_with_ukraine_desc: "Jsme připraveni navázat vojensko-technickou spolupráci s ukrajinským vojensko-průmyslovým komplexem." # todo: CHANGED
 BLR_Intermarium: "Intermarium" # todo: NEW TRANSLATION
 BLR_Intermarium_desc: "Je čas spojit se s Ukrajinou v mocné alianci a společně čelit našim nepřátelům." # todo: CHANGED
 BLR_Intermarium_poland: "Intermarium" # todo: NEW TRANSLATION
 BLR_Intermarium_poland_desc: "Je čas spojit se s Polskem v mocné alianci a společně čelit našim nepřátelům." # todo: CHANGED
 BLR_Ukraine_enemy: "Zajmout ukrajinská území" # todo: NEW TRANSLATION
 BLR_Ukraine_enemy_desc: "Historicky tyto země patřily Litevskému velkoknížectví. Žádné falešné přátelské vazby nám nesmějí zabránit v jejich návratu do našeho velkého státu." # todo: CHANGED
 BLR_Transnistria_enemy: "Vyřešit problém Transnistrie" # todo: NEW TRANSLATION
 BLR_Transnistria_enemy_desc: "Podněstří je malý neuznaný stát, který Moldavsku již dlouho působí potíže. Jsme připraveni jim pomoci tento problém vyřešit – samozřejmě tím, že si tyto země vezmeme pro sebe." # todo: CHANGED
 BLR_Sovereign_Internet: "Suverénní internet" # todo: NEW TRANSLATION
 BLR_Sovereign_Internet_desc: "Musíme učinit náš internetový prostor plně nezávislým na ostatních zemích, aby nemohly ovlivňovat naše občany." # todo: NEW TRANSLATION
 BLR_Expand_Mozyr_Refinery: "Rozšíření ropné rafinerie Mozyr" # todo: NEW TRANSLATION
 BLR_Expand_Mozyr_Refinery_desc: "Rozšíříme tuto ropnou rafinerii." # todo: CHANGED
 BLR_Belshina: "JSC Belshina" # todo: NEW TRANSLATION
 BLR_Belshina_desc: "Akciová společnost Belšina je výrobcem automobilových pneumatik. Vyrábí pneumatiky pro osobní automobily, nákladní vozy, těžká vozidla, silniční stavební a zdvihací techniku, elektromobily, autobusy, traktory a zemědělské stroje." # todo: CHANGED
 BLR_Expand_Naftan_Refinery: "Rozšíření Naftan ropné rafinerie" # todo: NEW TRANSLATION
 BLR_Expand_Naftan_Refinery_desc: "Rozšíříme tuto ropnou rafinerii." # todo: CHANGED
 BLR_Expansion_Okolovsky_Novoselkovsky: "Rozšíření těžby rudných ložisek" # todo: NEW TRANSLATION
 BLR_Expansion_Okolovsky_Novoselkovsky_desc: "Rozšíření těžby rudy z ložisek Okolovskoje a Novoselkovskoje nám přinese velké množství oceli." # todo: CHANGED
 BLR_Problem_duying_vilages: "Problém umírajících vesnic" # todo: NEW TRANSLATION
 BLR_Problem_duying_vilages_desc: "Je čas, aby náš stát rozhodl, co dělat s vymírajícími vesnicemi." # todo: CHANGED
 BLR_Economic: "Běloruská ekonomika" # todo: NEW TRANSLATION
 BLR_Economic_desc: "Musíme rozvíjet naši ekonomiku a přijímáme řadu opatření k úspěšnému dosažení tohoto cíle." # todo: CHANGED
 BLR_metro_minsk: "Rozšířit Minskské metro" # todo: NEW TRANSLATION
 BLR_metro_minsk_desc: "Zlepšíme a rozšíříme minské metro, abychom zlepšili logistické charakteristiky města." # todo: CHANGED
 BLR_it_industries_help: "Pomoc domácím IT vývojářům" # todo: CHANGED
 BLR_it_industries_help_desc: "Je nutné podporovat náš IT sektor všemi dostupnými prostředky. To je budoucnost naší země." # todo: CHANGED
 BLR_viber: "Viber" # todo: NEW TRANSLATION
 BLR_viber_desc: "Viber je komunikační aplikace, která umožňuje posílat zprávy, provádět video a hlasové VoIP hovory přes Internet. Hlasové hovory mezi uživateli s nainstalovaným Viberem jsou zdarma . Viber má možnost posílat textové, hlasové a video zprávy, dokumenty, obrázky, videa a soubory, stejně jako pracovat offline." # todo: NEW TRANSLATION
 BLR_wot: "World of Tanks" # todo: NEW TRANSLATION
 BLR_wot_desc: "World of Tanks je týmová masivně multiplayerová online hra, jejímž tématem jsou obrněná vozidla z poloviny 20. století. Hráči mají k dispozici více než 40 bojových map vytvořených podle skutečných míst druhé světové války a historicky věrnou techniku 11 národů v celkovém počtu více než 600 jednotek." # todo: CHANGED
 BLR_russian_gazprom: "Gazprom" # todo: NEW TRANSLATION
 BLR_russian_gazprom_desc: "Gazprom je významným hráčem na trhu s plynem a ropou. Musíme s ním navázat co nejužší spolupráci." # todo: CHANGED
 BLR_BPS_Sberbank: "BPS Sberbank" # todo: NEW TRANSLATION
 BLR_BPS_Sberbank_desc: "BPS Sberbank je pobočka ruské Sberbanky na našem území." # todo: NEW TRANSLATION
 BLR_Belgazprombank: "Belgazprombank" # todo: NEW TRANSLATION
 BLR_Belgazprombank_desc: "Belgazprombank je pobočka Gazprombank v Bělorusku." # todo: NEW TRANSLATION
 BLR_Development_domestic_tourism: "Rozvoj domácího cestovního ruchu" # todo: NEW TRANSLATION
 BLR_Development_domestic_tourism_desc: "Vidíme velký potenciál v domácím cestovním ruchu. Každý zástupce bude v této souvislosti přispívat k rozvoji cestovního ruchu ve svém okrese. Hlavním úkolem je vybudovat odpovídající infrastrukturu, neboť existuje spousta vědeckého a metodického materiálu." # todo: NEW TRANSLATION
 BLR_private_railways: "Soukromé železniční společnosti" # todo: NEW TRANSLATION
 BLR_private_railways_desc: "Železnice převedeme do rukou soukromých společností." # todo: CHANGED
 BLR_Lith_pol_railways: "Železniční spojení s Polskem a Litvou" # todo: NEW TRANSLATION
 BLR_Lith_pol_railways_desc: "Máme v úmyslu vybudovat s těmito zeměmi kvalitní železniční spojení, které nám zajistí přístup k evropskému zboží." # todo: CHANGED
 BLR_JSC_russian_railways: "Ruské železnice" # todo: NEW TRANSLATION
 BLR_JSC_russian_railways_desc: "Nyní jsme plně integrováni s Ruskými železnicemi." # todo: CHANGED
 BLR_belavia: "Belavia" # todo: NEW TRANSLATION
 BLR_belavia_desc: "Běloruská státní letecká společnost se sídlem v Minsku. Byla založena v roce 1996. Hlavní pravidelné a charterové mezinárodní lety jsou provozovány z Minska." # todo: NEW TRANSLATION
 BLR_Danone: "Danone" # todo: NEW TRANSLATION
 BLR_Danone_desc: "Francouzská potravinářská společnost, známý výrobce mléčných výrobků a dalších potravin." # todo: NEW TRANSLATION
 BLR_Godel_tech: "Godel Technologies" # todo: NEW TRANSLATION
 BLR_Godel_tech_desc: "Britská společnost poskytující řešení vývoje softwaru pro přední britské firmy se sídlem v Manchesteru." # todo: NEW TRANSLATION
 BLR_Basf_tech: "BASF Societas Europaea" # todo: NEW TRANSLATION
 BLR_Basf_tech_desc: "BASF Societas Europaea, BASF je největší chemický konglomerát v Německu, v Evropě a na světě. Sídlo je ve městě Ludwigshafen v Porýní-Pfalz na jihozápadě Německa." # todo: NEW TRANSLATION
 BLR_royal_dutch_shell: "Royal Dutch Shell" # todo: NEW TRANSLATION
 BLR_royal_dutch_shell_desc: "Shell je britsko-nizozemská ropná a plynárenská společnost." # todo: CHANGED
 BLR_mts: "MTS" # todo: NEW TRANSLATION
 BLR_mts_desc: "MTS je ruská společnost poskytující telekomunikační, digitální a mediální služby v Rusku, Arménii a Bělorusku pod ochrannou známkou „MTS“. Společnost poskytuje služby mobilní komunikace (ve standardech UMTS (3G), 4G, LTE a 5G), pevné telefonie, širokopásmového přístupu k internetu, mobilní televize, kabelové televize, satelitní televize, digitální televize, mediálního a zábavního obsahu, finančních služeb a také konvergovaná IT řešení v oblasti internetu věcí, monitoringu, automatizace procesů, zpracování dat a cloud computingu." # todo: CHANGED
 BLR_belarus_support_category: "Pomocné jednotky Běloruska" # todo: NEW TRANSLATION
 BLR_ter_oboronaup_start: "Výzva k teritoriální obraně" # todo: NEW TRANSLATION
 BLR_internalup_start: "Výzva k 3. samostatné speciální brigádě" # todo: NEW TRANSLATION
 BLR_whitelegion_battalion_category: "Bílá legie" # todo: NEW TRANSLATION
 BLR_whitelegion_battalion_category_desc: "Bílá legie je sportovní a vlastenecká běloruská organizace, která se změnila ve vojenskou. Bílá legie vznikla na počátku 90. let a udržovala pořádek na opozičních setkáních a shromážděních. Její členové byli cvičeni jako speciální jednotky a získali ocelový baret obdobný karmínovému. Dostalo se jim hlubokých znalostí běloruských dějin." # todo: CHANGED
 BLR_white_legion_battalion_create: "Vytvořit batalion Bílé legie" # todo: NEW TRANSLATION
 BLR_white_legion_recruit_youngfront: "Najmout absolventy Young Front" # todo: NEW TRANSLATION
 BLR_white_legion_recruit_people: "Najmout věrné občany" # todo: NEW TRANSLATION
 BLR_white_legion_recruit_revansh: "Naverbovat členy organizace „Pravý revanš“" # todo: CHANGED
 BLR_white_legions_TT: "Počet nováčků se změní podle §Y[?modify_white_legion]§!" # todo: NEW TRANSLATION
 BLR_whitelegion_recruit_2000: "Počet dostupných náborů je 2000" # todo: NEW TRANSLATION
 BLR_baltic_revolution_category: "Komunistická revoluce v Pobaltí" # todo: NEW TRANSLATION
 BLR_baltic_revolution_category_desc: "Dělníci Litvy a Lotyšska touží po osvobození od svých buržoazních vládců. Kombinací tajných operací, politické subverze a lidového povstání přineseme revoluci do pobaltských států a vytvoříme nový stát LitBel." # todo: NEW TRANSLATION
 BLR_establish_cooperation_lit: "Navázat spolupráci s litevskými komunisty" # todo: NEW TRANSLATION
 BLR_establish_cooperation_lit_desc: "Komunistické síly v Litvě jsou roztříštěné a odstřižené od moci. Musíme s nimi navázat tajný kontakt a připravit půdu pro budoucí operace." # todo: NEW TRANSLATION
 BLR_finance_protests_lit: "Financovat komunistické protesty v Litvě" # todo: NEW TRANSLATION
 BLR_finance_protests_lit_desc: "Financování organizovaných demonstrací přitáhne veřejnou pozornost ke komunistickým cílům a destabilizuje současnou litevskou vládu." # todo: NEW TRANSLATION
 BLR_recruit_sympathizers_lit: "Verbovat litevské sympatizanty" # todo: NEW TRANSLATION
 BLR_recruit_sympathizers_lit_desc: "Etnická běloruská menšina v Litvě představuje zdroj potenciálních sympatizantů. Můžeme naverbovat místní operativce a rozšířit tak svůj vliv." # todo: NEW TRANSLATION
 BLR_spread_propaganda_lit: "Šířit propagandu LitBĕlu v Litvě" # todo: NEW TRANSLATION
 BLR_spread_propaganda_lit_desc: "Koordinovaná propagandistická kampaň propagující sílu sjednoceného litevsko-běloruského státu posune veřejné mínění směrem ke spolupráci." # todo: NEW TRANSLATION
 BLR_bribe_military_lit: "Podplácet litevské vojenské důstojníky" # todo: NEW TRANSLATION
 BLR_bribe_military_lit_desc: "Několik litevských vojenských důstojníků vyjádřilo nespokojenost se současnou vládou. Finanční pobídky by je mohly přesvědčit, aby podpořili naši věc." # todo: NEW TRANSLATION
 BLR_bribe_politicians_lit: "Podplácet litevské politiky" # todo: NEW TRANSLATION
 BLR_bribe_politicians_lit_desc: "Za dostatek peněz lze klíčové členy litevského parlamentu přesvědčit, aby prosazovali komunistickou legislativu a oslabili vládní koalici." # todo: NEW TRANSLATION
 BLR_raise_revolt_lit: "Vyvolat komunistické povstání v Litvě" # todo: NEW TRANSLATION
 BLR_raise_revolt_lit_desc: "S dostatečným vlivem v Litvě můžeme vyvolat komunistické povstání, svrhnout vládu a dosadit spřátelený režim." # todo: NEW TRANSLATION
 BLR_establish_cooperation_lat: "Navázat spolupráci s lotyšskými komunisty" # todo: NEW TRANSLATION
 BLR_establish_cooperation_lat_desc: "Komunistické síly v Lotyšsku jsou roztříštěné a odstřižené od moci. Musíme s nimi navázat tajný kontakt a připravit půdu pro budoucí operace." # todo: NEW TRANSLATION
 BLR_finance_protests_lat: "Financovat komunistické protesty v Lotyšsku" # todo: NEW TRANSLATION
 BLR_finance_protests_lat_desc: "Financování organizovaných demonstrací přitáhne veřejnou pozornost ke komunistickým cílům a destabilizuje současnou lotyšskou vládu." # todo: NEW TRANSLATION
 BLR_recruit_sympathizers_lat: "Verbovat lotyšské sympatizanty" # todo: NEW TRANSLATION
 BLR_recruit_sympathizers_lat_desc: "Etnická běloruská menšina v Lotyšsku představuje zdroj potenciálních sympatizantů. Můžeme naverbovat místní operativce a rozšířit tak svůj vliv." # todo: NEW TRANSLATION
 BLR_spread_propaganda_lat: "Šířit propagandu LitBĕlu v Lotyšsku" # todo: NEW TRANSLATION
 BLR_spread_propaganda_lat_desc: "Koordinovaná propagandistická kampaň propagující sílu sjednoceného lotyšsko-běloruského státu posune veřejné mínění směrem ke spolupráci." # todo: NEW TRANSLATION
 BLR_bribe_military_lat: "Podplácet lotyšské vojenské důstojníky" # todo: NEW TRANSLATION
 BLR_bribe_military_lat_desc: "Několik lotyšských vojenských důstojníků vyjádřilo nespokojenost se současnou vládou. Finanční pobídky by je mohly přesvědčit, aby podpořili naši věc." # todo: NEW TRANSLATION
 BLR_bribe_politicians_lat: "Podplácet lotyšské politiky" # todo: NEW TRANSLATION
 BLR_bribe_politicians_lat_desc: "Za dostatek peněz lze klíčové členy lotyšského parlamentu přesvědčit, aby prosazovali komunistickou legislativu a oslabili vládní koalici." # todo: NEW TRANSLATION
 BLR_raise_revolt_lat: "Vyvolat komunistické povstání v Lotyšsku" # todo: NEW TRANSLATION
 BLR_raise_revolt_lat_desc: "S dostatečným vlivem v Lotyšsku můžeme vyvolat komunistické povstání, svrhnout vládu a dosadit spřátelený režim." # todo: NEW TRANSLATION
 BLR_pol_revol_category: "Přivést nacionalisty, kteří potřebujeme k moci v Polsku" # todo: NEW TRANSLATION
 BLR_pol_revol_category_desc: "Musíme se Polsku pomstít za všechna léta, kdy se pokoušelo zničit naši nezávislost, za ponižující Lublinskou unii a za rozdělení naší země ve 20. století. Polský lid postavíme do situace, kdy nebude mít jinou možnost než nás poslouchat." # todo: CHANGED
 BLR_Establish_cooperation_pol: "Navázat vazby s polskými nacionalisty" # todo: NEW TRANSLATION
 BLR_podlasie_return: "Návrat Bialystoku do Běloruska" # todo: NEW TRANSLATION
 BLR_podlasie_return_desc: "Bělostok byl vždy zemí obývanou Bělorusy. Je čas získat tuto zemi zpět od Poláků a vrátit ji běloruskému státu." # todo: CHANGED
 BLR_Duchy_claims_category: "Teritoriální nároky" # todo: NEW TRANSLATION
 BLR_Duchy_claims_category_desc: "Dobře si pamatujeme historii Litevského velkoknížectví a všech zemí, které mu podléhaly. Vyhlásíme své územní nároky na všechna naše bývalá území." # todo: CHANGED
 BLR_ukraine_claims: "Teritoriální nároky na §Y[UKR.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_poland_claims: "Teritoriální nároky na §Y[POL.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_russia_claims: "Teritoriální nároky na §Y[SOV.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_transnistria_claims: "Teritoriální nároky na §Y[PMR.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_latgale_claims: "Teritoriální nároky na §Y[LAT.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_lithuania_claims: "Územní nároky na §Y[LIT.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_lithuania_claims_desc: "Vilnius a jeho okolí byly sídlem Litevského velkoknížectví a běloruští nacionalisté nikdy nepřijali dohodu z roku 1939, která město přisoudila Litvě. Otevřeně vzneseme svůj nárok a požádáme Vilnius o navrácení regionu." # todo: NEW TRANSLATION
 BLR_operation_new_day: "Operace „Nový den“" # todo: NEW TRANSLATION
 BLR_operation_new_day_desc: "Vilnius nebude odevzdán u jednacího stolu. Společná operace s Moskvou proti Litvě by uzavřela Suvalský koridor a dostala region pod naši kontrolu, znamenala by však válku s členským státem NATO." # todo: NEW TRANSLATION
