 BLR_belorusisation_samogitia: "Bělorusizace Samogitie" # todo: NEW TRANSLATION
 BLR_people_militia: "Lidová milice" # todo: NEW TRANSLATION
 BLR_people_militia_desc: "Situace však není jednoduchá. Řekl jsem to více než jednou: každý člověk (a nejen muž) by měl být schopen alespoň zacházet se zbraněmi. Přinejmenším proto, aby v případě potřeby ochránil svou rodinu, svůj domov, svůj rodný kout země a v případě potřeby i zemi, bez níž by nebyl žádný kout, žádný domov ani nic dalšího. Mnoho lidí tomu rozumí,“ zdůraznil Alexandr Lukašenko." # todo: CHANGED
