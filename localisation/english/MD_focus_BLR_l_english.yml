 BLR_140_btr_modernisation: "BTR-60MB1 a BTR-70MB1" # todo: NEW TRANSLATION
 BLR_140_btr_modernisation_desc: "Běloruské modernizační balíčky pro sovětské obrněné transportéry BTR-60PB a BTR-70, oba přestavěné podle vzoru 140. opravárenského závodu." # todo: NEW TRANSLATION
 BLR_140_kobra_k: "Cobra-K" # todo: NEW TRANSLATION
 BLR_140_kobra_k_desc: "Jedna z bělorusko-slovenských variant modernizace sovětského obrněného transportéru BTR-70." # todo: NEW TRANSLATION
 BLR_mtz_line_modernisation: "Modernizovat montážní linku MTZ" # todo: NEW TRANSLATION
 BLR_mtz_line_modernisation_desc: "Přepracovat dílny převodovek, hydraulického odpružení a kabin tak, aby bylo možné řadu běloruských traktorů montovat v Minsku od začátku do konce." # todo: NEW TRANSLATION
