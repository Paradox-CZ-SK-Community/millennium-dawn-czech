 BLR_Internal_troops_desc: "Státní vojenská organizace Běloruska, která chrání práva občanů, ústavní systém, bezpečnost a svrchovanost Běloruské republiky před trestnými zásahy." # todo: CHANGED
 BLR_kgb_expand: "Státní výbor pro bezpečnost" # todo: NEW TRANSLATION
 BLR_kgb_expand_desc: "Státní výkonný orgán Běloruska a zvláštní služba určená k ochraně nezávislosti a územní celistvosti Běloruské republiky, ústavního pořádku a státní svrchovanosti běloruského státu, jakož i k zajištění národní bezpečnosti v politické, ekonomické, vojenské, vědecké, technologické, informační, sociální, demografické a environmentální oblasti a k provádění kontrarozvědných a zahraničních zpravodajských operací." # todo: CHANGED
 BLR_new_equipment_omon: "Speciální jednotka - Alpha" # todo: NEW TRANSLATION
 BLR_new_equipment_omon_desc: "Skupina „A“ („Alfa“) při Výboru státní bezpečnosti Běloruské republiky je protiteroristická jednotka běloruské KGB a jedna z nejtajnějších speciálních sil v bezpečnostních složkách země. Bojovníci Alfy se účastní operativních a bojových akcí prováděných jednotkami KGB při zadržování osob podezřelých ze špionáže, braní rukojmích, obchodu s drogami, pašování, nedovoleného obchodování se zbraněmi a radioaktivními látkami, vydírání a nelegální migrace." # todo: CHANGED
 BLR_Countering_Cybercrime: "Hlavní správa pro potírání kybernetických zločinů" # todo: NEW TRANSLATION
