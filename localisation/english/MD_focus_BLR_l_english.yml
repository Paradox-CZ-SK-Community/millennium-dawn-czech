 BLR_belarus_nati_modifier: "Státní politika Běloruska" # todo: NEW TRANSLATION
 BLR_belarus_nati_modifier_desc: "Vzestup nacionalistických sil k moci v Bělorusku významně ovlivnil jeho vnitřní i zahraniční politiku. Prioritou byla moc a síla národa, propaganda velké minulosti a revizionismus za ztracenou běloruskou slávu." # todo: NEW TRANSLATION
 BLR_belarus_police_modifier: "Vnitřní bezpečnost Běloruska" # todo: NEW TRANSLATION
 BLR_belarus_police_modifier_desc: "Běloruská vláda má bohaté zkušenosti již od času, kdy byl Bělorusko součástí SSSR, v potlačování disentu a nepřátelských agentů." # todo: NEW TRANSLATION
 BLR_belarus_kommi_modifier: "Politika komunistického Běloruska" # todo: NEW TRANSLATION
 BLR_belarus_kommi_modifier_desc: "Komunistická vláda v Bělorusku se aktivně snaží oživit jak propagandou, tak činem - všechno nejlepší z dob Sovětského období." # todo: NEW TRANSLATION
