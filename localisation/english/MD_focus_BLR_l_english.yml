 BLR_soviet_system: "Národní bolševické Bělorusko" # todo: NEW TRANSLATION
 BLR_soviet_system_desc: "Národní bolševici se v zemi chopili moci a jsou připraveni zahájit své první ekonomické reformy. Jednou z nich bude návrat k sovětskému ekonomickému systému vzhledem k neúspěšné bilanci předchozího vládce." # todo: CHANGED
 BLR_free_weapon: "Volné nošení zbraní" # todo: NEW TRANSLATION
 BLR_free_weapon_desc: "Dovolíme našim občanům volně nosit zbraně v zemi. Mají právo na sebeobranu!" # todo: CHANGED
 BLR_new_church: "Nové náboženství" # todo: NEW TRANSLATION
 BLR_new_church_desc: "Je čas vytvořit nové náboženství, které bude sloužit zájmům našeho státu!" # todo: CHANGED
 BLR_reform_education: "Vzdělávací reforma" # todo: NEW TRANSLATION
 BLR_reform_education_desc: "Vzdělávací systém je v zoufalém stavu, napravíme ho a zavedeme vážné změny do tohoto systému. Jednou z inovací bude zkrácení délky výuky pro žáky a studenty, čímž je rychleji připravíme na plnohodnotné občany." # todo: NEW TRANSLATION
 BLR_ruralisation: "Vesnicování" # todo: NEW TRANSLATION
 BLR_ruralisation_desc: "Trend 21. století je stěhování lidí z vesnic do měst; tento trend otočíme a nabídneme chudým nebo bezdomovcům odchod do vesnic, na oplátku podpoříme jejich aktivity v nových bydlištích." # todo: NEW TRANSLATION
 BLR_revoult_army: "Revoluční armáda" # todo: NEW TRANSLATION
 BLR_revoult_army_desc: "Naše armáda se nepředvedla v nejlepším světle. Potřebuje lidi, kteří hoří revoluční vášní a jsou připraveni vrhnout se proti nepřátelskému kulometu ve jménu vlasti." # todo: CHANGED
 BLR_revoult_army_zeks: "Přijímat vězně do armády" # todo: NEW TRANSLATION
 BLR_revoult_army_zeks_desc: "Začneme do armády verbovat vězně a umístíme je do samostatných praporů. Přestaňme vězně živit. Musí živit plamen revoluce!" # todo: CHANGED
 BLR_revoult_rne: "Pozvat Ruskou Národní Jednotu" # todo: NEW TRANSLATION
 BLR_revoult_rne_desc: "Zástupce této nacionalistické organizace oficiálně začleníme do vládních struktur." # todo: CHANGED
 BLR_revoult_sobor: "Pozvat Slovanskou katedrálu Belaya Rus" # todo: NEW TRANSLATION
 BLR_revoult_sobor_desc: "Zástupce této nacionalistické organizace oficiálně začleníme do vládních struktur." # todo: CHANGED
 BLR_revoult_army_volunteer: "Revoluční duch" # todo: NEW TRANSLATION
 BLR_revoult_army_volunteer_desc: "Někteří naši vojáci touží bojovat natolik, že by odešli do jiné země. Možná bychom jejich zápal neměli omezovat a měli bychom je vyslat splnit jejich internacionalistickou povinnost?" # todo: CHANGED
 BLR_revoult_army_gco: "Stráže Pravoslavného komunismu" # todo: NEW TRANSLATION
 BLR_revoult_army_gco_desc: "Vytvoříme si svou jedinečnou armádu, analogicky s Íránským IRGC; jejich zkušenosti nás velmi zaujaly. Budou nazýváni Stráže Pravoslavného Komunismu." # todo: NEW TRANSLATION
 BLR_work_army: "Dělnická armáda" # todo: NEW TRANSLATION
 BLR_work_army_desc: "Pošleme všechny nezaměstnané do výroby a zajistíme výrobu nezbytných statků pro náš stát jako první." # todo: NEW TRANSLATION
 BLR_revoult_army_gco_ground_force: "Pozemní síly" # todo: NEW TRANSLATION
 BLR_revoult_army_gco_ground_force_desc: "Hlavní a nejpočetnější typ vojsk ve složení GCO. V míru je vyzbrojeno lehkými zbraněmi. Hlavní účel: vnitřní bezpečnost; sekundární: vnější obrana ve spojení s pravidelnými ozbrojenými silami Běloruska." # todo: NEW TRANSLATION
 BLR_revoult_debur: "Deregulace byrokracie" # todo: NEW TRANSLATION
 BLR_revoult_debur_desc: "Omezíme výdaje na úředníky a snížíme jejich počet; uvolněné prostředky půjdou ve prospěch lidu." # todo: CHANGED
 BLR_revoult_army_gco_anti_corrupt: "Antikorupční revoluční výbor" # todo: NEW TRANSLATION
 BLR_revoult_army_gco_anti_corrupt_desc: "Vytvoříme zvláštní jednotku pro boj s korupcí v naší zemi. Před rukou spravedlnosti se nikdo neschová." # todo: CHANGED
 BLR_revoult_dsocial: "Sociální podpora" # todo: NEW TRANSLATION
 BLR_revoult_dsocial_desc: "Posílíme sociální podporu našich občanů! Nikdo nezůstane bez pomoci." # todo: CHANGED
 BLR_revoult_army_agro_invest: "Rozvoj agro-průmyslu" # todo: NEW TRANSLATION
 BLR_revoult_army_agro_invest_desc: "Musíme co nejvíce investovat do rozvoje našeho zemědělsko-průmyslového odvětví!" # todo: CHANGED
 BLR_revoult_army_gco_air: "Letectvo" # todo: NEW TRANSLATION
 BLR_revoult_army_gco_air_desc: "Vytvoříme letecké křídlo a umožníme našim gardistům využívat letectvo k plnění jejich cílů." # todo: CHANGED
 BLR_revoult_army_gco_drone: "Dronové jednotky" # todo: NEW TRANSLATION
 BLR_revoult_army_gco_drone_desc: "V naší armádě budeme aktivně využívat drony, abychom zvýšili její účinnost." # todo: CHANGED
 BLR_revoult_army_anti_west: "Antizápadní doktrína" # todo: NEW TRANSLATION
 BLR_revoult_army_anti_west_desc: "Západní civilizace vždy byla a vždy bude naším nepřítelem, který neustále usiluje o naše zničení." # todo: CHANGED
 BLR_revoult_army_interbrigade: "Interbrigády" # todo: NEW TRANSLATION
 BLR_revoult_army_interbrigade_desc: "Máme v úmyslu vytvořit interbrigádní jednotky, které vyšleme do zahraničí na ochranu našich zájmů." # todo: CHANGED
 BLR_kgb_expanded: "Rozšířit KGB" # todo: NEW TRANSLATION
 BLR_kgb_expanded_desc: "Posílíme vliv KGB, protože nemáme v úmyslu rozpustit tak účinný nástroj státní bezpečnosti." # todo: CHANGED
 BLR_army_stabilize: "Stabilizovat Armádu" # todo: NEW TRANSLATION
 BLR_army_stabilize_desc: "Pro naše budoucí záměry potřebujeme obnovit bojeschopnost armády." # todo: CHANGED
 BLR_prepare_attacks: "Příprava intervencí" # todo: NEW TRANSLATION
 BLR_prepare_attacks_desc: "Naše armáda je připravena. Shromáždili jsme působivou sílu a jsme připraveni rozšířit vliv naší země po celém bývalém území SSSR." # todo: CHANGED
 BLR_baltic_campaign: "Baltská kampaň" # todo: NEW TRANSLATION
 BLR_baltic_campaign_desc: "Zahájíme přípravy na vojenské tažení v pobaltských státech. Tyto země nemají právo na nezávislost ani na existenci!" # todo: CHANGED
 BLR_baltic_war: "Spustit Baltskou výpravu" # todo: NEW TRANSLATION
 BLR_baltic_war_desc: "Naše armáda zaujala pozice a je připravena vyrazit na pochod do pobaltských států." # todo: CHANGED
 BLR_ukraine_campaign: "Ukrajinská kampaň" # todo: NEW TRANSLATION
 BLR_ukraine_campaign_desc: "Náš jižní soused vykazuje známky vstupu do vojensko-politického bloku, který je vůči nám nepřátelský, což by mohlo být následováno útokem na nás. Musíme udeřit jako první!" # todo: CHANGED
 BLR_ukraine_campaign_border_prepare: "Posílit hranici s Ukrajinou" # todo: NEW TRANSLATION
 BLR_ukraine_campaign_border_prepare_desc: "Přestože útočíme, měli bychom se připravit na možná protiopatření a vybudovat na hranici opevnění." # todo: CHANGED
 BLR_poland_campaign_border_prepare: "Posílit hranici s Polskem" # todo: NEW TRANSLATION
 BLR_poland_campaign_border_prepare_desc: "Přestože útočíme, měli bychom se připravit na možná protiopatření a vybudovat na hranici opevnění." # todo: CHANGED
 BLR_poland_campaign_war: "Spustit kampaň proti Polsku" # todo: NEW TRANSLATION
 BLR_poland_campaign_war_desc: "Naše armáda je připravena! Vpřed na Varšavu!" # todo: CHANGED
 BLR_ukraine_campaign_war: "Spustit ukrajinskou kampaň" # todo: NEW TRANSLATION
 BLR_ukraine_campaign_war_desc: "Naše armáda je připravena! Vpřed na Kyjev!" # todo: CHANGED
 BLR_military_nazbol: "Investice do vojenského průmyslu" # todo: NEW TRANSLATION
 BLR_military_nazbol_desc: "Náš vojenský průmysl se stále neobnovil na úroveň sovětských časů. Musíme to napravit." # todo: CHANGED
