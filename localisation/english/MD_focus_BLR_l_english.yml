 BLR_partnership_azerbaijan_desc: "Baku má příjmy z ropy a nemá rádo politiku svých sousedů, což z něj dělá přesně takového partnera, který s námi bude obchodovat bez mentorování. Nabídneme ázerbájdžánskému kapitálu podíl v běloruském průmyslu." # todo: NEW TRANSLATION
 BLR_partnership_venezuela: "Dvořit se §Y[VEN.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_partnership_venezuela_desc: "Caracas hledá přátele mimo západní sféru a má petrodolary, kterými za ně může zaplatit. Partnerství by financovalo nový běloruský průmysl a poskytlo nám opěrný bod v Americe." # todo: NEW TRANSLATION
 BLR_military_coop_venezuela: "Vojenská spolupráce s §Y[VEN.GetNamewithFlag]§!" # todo: NEW TRANSLATION
 BLR_military_coop_venezuela_desc: "Po navázání obchodních vztahů můžeme Caracasu nabídnout to, co skutečně chce: systémy protivzdušné obrany, vycvičené posádky a odborné znalosti potřebné k jejich obsluze." # todo: NEW TRANSLATION
 BLR_fly_protasevich: "Přistát letadlem Ryanair s Protasevičem" # todo: NEW TRANSLATION
