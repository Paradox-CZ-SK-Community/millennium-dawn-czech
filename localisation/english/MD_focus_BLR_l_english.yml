 BLR_btr60: "BTR-60" # todo: NEW TRANSLATION
 BLR_btr70: "BTR-70" # todo: NEW TRANSLATION
 BLR_tractors_TT: "Budou vyrobeny nové traktory" # todo: NEW TRANSLATION
 BLR_batka_krut_TT: "Budeme §Rvyčistit§! §Ypolitickou sféru§!, ponecháme jen několik stran loajálních nám a §Gvytvoříme skutečnou patriotickou stranu§! pro §YLukashenko§!" # todo: NEW TRANSLATION
 belarus_politics.1.t: "Nová politická realita" # todo: NEW TRANSLATION
 belarus_politics.1.d: "Ačkoliv vítězství nad demonstranty bylo monumentální, stále existuje široká síť opozičních organizací a stran, které čekají na chvíli, aby zničily naši zemi. Abychom tomu zabránili, musíme politické prostředí vyčistit od zbytečných politiků a organizací, nechat jen strany loajální nám a možná bude potřeba i vlastní politické strany, která by ovládala politickou sféru. Nebo můžeme nechat všechno tak, jak je, ale nepřítel bude mít i nadále nástroje, jak nás ovlivňovat doma." # todo: NEW TRANSLATION
 belarus_politics.1.a: "Proberte je!" # todo: NEW TRANSLATION
 belarus_politics.1.b: "Už lidem nebudeme dráždit." # todo: NEW TRANSLATION
 belarus_LTB.1.t: "Vypukly komunistické protesty" # todo: NEW TRANSLATION
 belarus_LTB.1.d: "Komunističtí agitátoři zorganizovali rozsáhlé demonstrace po celé zemi. Protesty přitáhly značnou veřejnou pozornost a vyvíjejí značný tlak na vládu. Naše zpravodajské služby mají podezření na zahraniční účast, ale nedokázaly ji potvrdit." # todo: NEW TRANSLATION
 belarus_LTB.1.a: "To je hluboce znepokojivé" # todo: NEW TRANSLATION
 belarus_LTB.2.t: "Propagandistická kampaň na podporu Běloruska" # todo: NEW TRANSLATION
 belarus_LTB.2.d: "Napříč naším mediálním prostorem se objevila koordinovaná propagandistická kampaň propagující výhody užších vztahů s Běloruskem. Plakáty, letáky a veřejní řečníci vyzývají ke sjednocení státu. Ačkoli hnutí působí jako lidové, jeho poselství je pozoruhodně jednotné." # todo: NEW TRANSLATION
 belarus_LTB.2.a: "Musíme tomu čelit" # todo: NEW TRANSLATION
 belarus_LTB.3.t: "Vojenští důstojníci obviněni z vazeb na zahraničí" # todo: NEW TRANSLATION
 belarus_LTB.3.d: "Několik našich vojenských důstojníků bylo zapleteno do korupčního skandálu týkajícího se plateb ze zahraničních zdrojů. Obvinění důstojníci zastávali citlivé pozice a jejich odvolání vytvoří mezery v naší velitelské struktuře. Zdá se, že jde o součást širší zahraniční zpravodajské operace." # todo: NEW TRANSLATION
 belarus_LTB.3.a: "Okamžitě je zatkněte" # todo: NEW TRANSLATION
 belarus_LTB.4.t: "Politický korupční skandál" # todo: NEW TRANSLATION
 belarus_LTB.4.d: "Uniklé dokumenty odhalují, že několik členů parlamentu dostávalo platby od zahraniční vlády výměnou za politický vliv. Skandál otřásl důvěrou veřejnosti v naše demokratické instituce a několik koaličních partnerů hrozí stažením podpory." # todo: NEW TRANSLATION
 belarus_LTB.4.a: "To je katastrofa" # todo: NEW TRANSLATION
 belarus_LTB.5.t: "Komunistické povstání" # todo: NEW TRANSLATION
 belarus_LTB.5.d: "Ozbrojení komunističtí povstalci obsadili klíčové vládní budovy po celé zemi. Armáda je rozdělena a civilní vláda se zřejmě hroutí. Jde o plnohodnotnou revoluci. Naši spojenci v zahraničí nebyli schopni nebo ochotni zasáhnout." # todo: NEW TRANSLATION
 belarus_LTB.5.a: "Starý řád skončil" # todo: NEW TRANSLATION
