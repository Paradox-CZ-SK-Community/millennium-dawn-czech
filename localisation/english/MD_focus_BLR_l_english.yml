 belarus_another.6.t: "Kult Lukashenka." # todo: NEW TRANSLATION
 belarus_another.6.d: "Alexander Lukashenko byl dlouholetým prezidentem Republiky Bělorusko. Během jeho vlády vznikl kolem něj celý kult „batka“. Tento kult ho odlišuje od ostatních diktátorů ze SNS, ale nutí jej s lidmi komunikovat zvláštním způsobem. Podpora Batky je indikátorem toho, jak velká je podpora Alexandra Grigorjeviče Ljukenenka ve všech částech populace. V závislosti na různých akcích bude tento ukazatel klesat či stoupat, a bude poskytovat různé bonusy nebo postihy." # todo: NEW TRANSLATION
 belarus_another.6.a: "Náš Batka Lukashenko, matka Běloruska" # todo: NEW TRANSLATION
