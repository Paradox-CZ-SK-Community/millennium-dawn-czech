 BLR_Increase_funding_Almaz: "Speciální jednotka - ALMAZ" # todo: NEW TRANSLATION
 BLR_Increase_funding_Almaz_desc: "Zvláštní jednotka Almaz pro boj proti terorismu je protiteroristická jednotka Ministerstva vnitra Běloruska, která plní širokou škálu úkolů při prevenci a potírání teroristických činů. Podléhá přímo ministrovi vnitra Běloruské republiky. Podle zpráv médií se jednotka rovněž účastní potlačování politické opozice a rozhánění masových protestů." # todo: CHANGED
 BLR_military_police_training: "Výcvik vojenské policie" # todo: NEW TRANSLATION
