 uniate_church: "Uniatská církev" # todo: NEW TRANSLATION
 uniate_church_desc: "Uniatská církev je spojením pravoslavných a katolických tradic, které uznává prvenství Říma při zachování východních pravoslavných obřadů. První unie byla uzavřena na koncilu ve Florencii roku 1439, brzy se však rozpadla. Od konce 15. století polští feudálové tuto myšlenku obnovili, protože velká část obyvatel Polska a Litvy zůstávala pravoslavná a církevní unie nabízela prostředek k postupnému přibližování Ukrajinců a Bělorusů ke katolicismu. Někteří pravoslavní duchovní a šlechtici unii v 16. století podporovali ve snaze získat práva rovnocenná právům katolíků. Roku 1595 požádali papeže o unii biskupové Hypatius Potei z Volodymyru-Volynského a Kirill Terleckij z Lucku. Na Brestském koncilu roku 1596 šest biskupů vyhlásilo Brestskou unii navzdory odporu většiny duchovenstva a obyvatelstva. Král unii podpořil a prohlásil pravoslavnou církev za nezákonnou, přičemž její majetek převedl na uniaty. V 17. století byl založen řád baziliánů, který měl spolu s jezuity unii prosazovat. Postupem času se uniatká církev stále více přibližovala katolickému obřadu; měnila se roucha, podoba chrámů i liturgická praxe a pravoslavné svátky byly zrušeny. Tyto změny byly kodifikovány na synodě v Zamośći roku 1720. V Zakarpatsku byla unie vyhlášena v Užhorodské katedrále roku 1649 a plně zavedena koncem 18. století. Odpor proti unii ve jménu náboženských a národních svobod na Ukrajině a v Bělorusku v 16. a 17. století vedla především pravoslavná bratrstva." # todo: CHANGED
