l_english:
 PMR_focus: "Transnistrie Zaměřovací strom" # todo: NEW TRANSLATION
 PMR_russia_moldovian_way: "Nejvyšší rada" # todo: NEW TRANSLATION
 PMR_russia_moldovian_way_desc: "\n\n\n\n\n\n£PMR_desctext_rusmlv \n\n\n\n\n\n\n\n\nNejvyšší rada Podněsterské moldavské republiky je podle Ústavy Podněsterské moldavské republiky reprezentativním a jediným zákonodárným orgánem státní moci mezinárodně neuznávané Podněsterské moldavské republiky." # todo: CHANGED
 PMR_moldova_refendum: "Uspořádat referendum o vstupu [MLV.GetFlag]§YMoldova§!" # todo: NEW TRANSLATION
 PMR_russia_refendum: "Uspořádat referendum o vstupu [SOV.GetFlag]§YRussia§!" # todo: NEW TRANSLATION
 PMR_annex_gagauzia: "Integrace §Y[GGZ.GetNameWithFlag]§!" # todo: NEW TRANSLATION
 PMR_annex_odessa: "Integrace §Y[OPR.GetNameWithFlag]§!" # todo: NEW TRANSLATION
 PMR_smirnov_era: "Éra Smirnova" # todo: NEW TRANSLATION
 PMR_smirnov_era_desc: "Igor Smirnov. Skutečná ikona naší velké země. Slouží vlasti, která nám je určena osudem. Věříme, že nás povede k nádherné budoucnosti, kterou si zasloužíme. Tento hrdina je důvodem, proč jsme tu. Smirnov je lepidlo, které nás drží pohromadě a soustřeďuje nás na jeden cíl. Bez něj by tato země nikdy nevznikla. Jsme poslední skutečnou komunistickou baštou SSSR." # todo: NEW TRANSLATION
 PMR_father_of_the_nation: "Otec národa" # todo: NEW TRANSLATION
 PMR_father_of_the_nation_desc: "Igor Smirnov je jistě ten, kdo stvořil náš národ; díky němu náš lid existuje. Byl to on, kdo nás vedl v době boje za nezávislost." # todo: NEW TRANSLATION
 PMR_denomination: "Provést denominaci" # todo: NEW TRANSLATION
 PMR_denomination_desc: "Naše měna vzrostla do tak astronomických čísel, že je fyzicky nemožné, aby naši občané nakoupili dostatek zboží, a proto provedeme naléhavou denominaci." # todo: NEW TRANSLATION
 PMR_privatization: "Privatizace" # todo: NEW TRANSLATION
 PMR_privatization_desc: "Budeme provádět privatizaci podniků, žádná totální státní kontrola." # todo: NEW TRANSLATION
 PMR_internet: "Rozvoj internetu" # todo: NEW TRANSLATION
 PMR_internet_desc: "Zahájíme rozvoj internetových sítí v naší zemi, avšak je nutné okamžitě upevnit právo na cenzuru v této oblasti." # todo: NEW TRANSLATION
 PMR_interrao: "Inter Rao" # todo: NEW TRANSLATION
 PMR_interrao_desc: "Ruská společnost Inter Rao chce koupit naši vodní elektrárnu a investovat do ní značné prostředky za účelem modernizace technických komponent." # todo: NEW TRANSLATION
 PMR_railway: "Obnovení infrastruktury" # todo: NEW TRANSLATION
 PMR_railway_desc: "Následky války s Moldavskem se dosud projevují. Naše infrastruktura dosud nebyla obnovena, je čas ji opravit." # todo: NEW TRANSLATION
 PMR_anti_opposition: "Potlačit opozici" # todo: NEW TRANSLATION
 PMR_anti_opposition_desc: "Opoziční aktivita v naší zemi bude aktivně potlačována, možná ne tak otevřeně jako v jiných zemích, ale nedovolíme, aby naše země byla otřesena." # todo: NEW TRANSLATION
 PMR_media: "Cenzura v televizi" # todo: NEW TRANSLATION
 PMR_media_desc: "Měli bychom převzít kontrolu nad televizí; nedovolíme, aby tam mluvily opoziční figury." # todo: NEW TRANSLATION
 PMR_imprison: "Represi proti agresivním opozičníkům" # todo: NEW TRANSLATION
 PMR_imprison_desc: "Někteří opozičníci jsou doslova připraveni hodit na nás Molotovovy koktejly; pošleme je do vězení." # todo: NEW TRANSLATION
 PMR_sheriff_based: "Podpořit vliv šerifa" # todo: NEW TRANSLATION
 PMR_sheriff_based_desc: "Máme v úmyslu zachovat a udržet vliv šerifa, který drží naši republiku, navzdory negativním důsledkům jeho monopolů." # todo: NEW TRANSLATION
 PMR_dictatorship: "Transnistrijská diktatura" # todo: NEW TRANSLATION
 PMR_dictatorship_desc: "Budou nás nazývat diktátory a náš režim bude diktaturou, ale náš lid bude klidně spát." # todo: NEW TRANSLATION
 PMR_anti_moldav_rhetoric: "Antimoldavská rétorika" # todo: NEW TRANSLATION
 PMR_anti_moldav_rhetoric_desc: "Naše sjednocení s Moldavskem se nikdy nestane, nemáme v úmyslu to povolit a budeme to aktivně propagovat v médiích a dalšími prostředky ovlivňování populace." # todo: NEW TRANSLATION
 PMR_referendums: "Referendum o postavení Transnistrie" # todo: NEW TRANSLATION
 PMR_referendums_desc: "Máme v úmyslu uspořádat referendum o postavení Transnistrie, aby náš lid mohl konečně rozhodnout, jakou budoucnost chce vidět pro naši zemi." # todo: NEW TRANSLATION
 PMR_shevchuk: "Druhý prezident Transnistrie" # todo: NEW TRANSLATION
 PMR_shevchuk_desc: "Přišel čas na změny; nyní se stane novým prezidentem Transnistrie. Kdo povede naši zemi do jasné budoucnosti, nebo snad ne?" # todo: NEW TRANSLATION
 PMR_anti_smirnov: "Politická kampaň proti Smirnovovi" # todo: NEW TRANSLATION
 PMR_anti_smirnov_desc: "Igor Smirnov udělal hodně pro vznik Transnistrie jako nezávislého státu, avšak bohužel v posledních letech mu to stálo spíše stranou než pomohlo. Budeme bojovat proti jeho vlivu." # todo: NEW TRANSLATION
 PMR_prepare_for_russia: "Příprava na integraci se Ruskem" # todo: NEW TRANSLATION
 PMR_prepare_for_russia_desc: "Budeme nadále pokračovat v pro-ruském kurzu našeho předchůdce a vydáme dekret o přípravě na integraci naší legislativy s ruskou." # todo: NEW TRANSLATION
 PMR_economist_from_russia: "Požádat Rusko o ekonomické specialisty" # todo: NEW TRANSLATION
 PMR_economist_from_russia_desc: "Máme v úmyslu nabídnout ruské specialisty z centrální banky, kteří nám pomohou s reformou naší ekonomiky." # todo: NEW TRANSLATION
 PMR_agriculture_from_russia: "Ruská pomoc v zemědělském průmyslu" # todo: NEW TRANSLATION
 PMR_agriculture_from_russia_desc: "Ruský agro-průmysl nám může výrazně pomoci v našem rozvoji; hodláme pozvat jejich specialisty do naší země." # todo: NEW TRANSLATION
 PMR_against_sheriff: "Boj proti Sheriffovi" # todo: NEW TRANSLATION
 PMR_against_sheriff_desc: "Budeme bojovat proti vlivu této holdingu a naše republika bude svobodná." # todo: NEW TRANSLATION
 PMR_mlv: "Snažíme se navázat vztahy s Moldavskem" # todo: NEW TRANSLATION
 PMR_mlv_desc: "Pokusíme se navázat vztahy s Moldavskem; možná budeme moci nabídnout způsoby integrace našich států." # todo: NEW TRANSLATION
 PMR_krasno: "Vadim Krasnoselsky" # todo: NEW TRANSLATION
 PMR_krasno_desc: "Vadim Nikolaevič Krasnoselsky je pridněstrijský státník, politik a postava vnitřních bezpečnostních složek. Předseda Nejvyšší rady Pridněstrovské Moldavské republiky, generálmajor milice." # todo: NEW TRANSLATION
 PMR_military_reform: "Vojenská reforma" # todo: NEW TRANSLATION
 PMR_military_reform_desc: "Naše armáda potřebuje vojenskou reformu; zdaleka zaostáváme za sousedy v technické a bojové výbavě." # todo: NEW TRANSLATION
 PMR_russian_flag: "Ruská vlajka je druhou státní vlajkou" # todo: NEW TRANSLATION
 PMR_russian_flag_desc: "Přijmeme ruskou vlajku jako druhou státní vlajku, aby bylo ihned jasné naše nejvyšší cíle: integrace do Ruska." # todo: NEW TRANSLATION
 PMR_romanovs: "Uctívání Romanovců" # todo: NEW TRANSLATION
 PMR_romanovs_desc: "Tragédie rodiny Romanovců je tragédií každého národa bývalého Ruského impéria a my uctíme jejich památku." # todo: NEW TRANSLATION
 PMR_soc_ref: "Reforma naší péče" # todo: CHANGED
 PMR_soc_ref_desc: "Naše nová sociální reforma bude zaměřena především na občany se zdravotním postižením a poskytneme jim všechno nezbytné pro plnou integraci do společnosti." # todo: NEW TRANSLATION
 PMR_cis_2: "Partnerství se zeměmi CIS-2" # todo: NEW TRANSLATION
 PMR_cis_2_desc: "Budeme nadále posilovat naše přátelské vztahy se zeměmi CIS-2; rozumí naší politické a ekonomické situaci jako málokdo jiný." # todo: NEW TRANSLATION
 PMR_deccomus: "Zahájení dekomunizace" # todo: NEW TRANSLATION
 PMR_deccomus_desc: "Budeme usilovat o navrácení měst a obcí k jejich pravým jménům, která měla v dobách Ruského impéria." # todo: NEW TRANSLATION
 PMR_free_internet: "Svobodná síť" # todo: CHANGED
 PMR_free_internet_desc: "Internet by měl být bez cenzury; diktatura nebude určovat, co lidé myslí." # todo: NEW TRANSLATION
 PMR_orthodoxy: "Podpora Pravoslavné církve" # todo: NEW TRANSLATION
 PMR_orthodoxy_desc: "Budeme aktivně podporovat pravoslaví v naší zemi, protože je to naše duchovní kotva." # todo: NEW TRANSLATION
 PMR_lgbt: "Boj za tradiční rodinu" # todo: NEW TRANSLATION
 PMR_lgbt_desc: "Naše země nepotřebuje žádné LGBT hodnoty; jen rodinu ruského impéria, která je velká a přátelská." # todo: NEW TRANSLATION
 PMR_arms: "Povolit volné nošení zbraní" # todo: NEW TRANSLATION
 PMR_arms_desc: "Bandité mohou získat zbraně jakýmkoliv způsobem; proč občanům nedovolíme se bránit?" # todo: NEW TRANSLATION
 PMR_continues: "Bez změny kurzu" # todo: NEW TRANSLATION
 PMR_continues_desc: "Budeme nadále sledovat naši cestu a nezměníme ji. Transnistrie nepotřebuje radikální politické změny." # todo: NEW TRANSLATION
 PMR_tourism: "Rozvoj cestovního ruchu" # todo: NEW TRANSLATION
 PMR_tourism_desc: "Musíme začít rozvíjet sektor cestovního ruchu; naše oblast je atraktivní a turisté o ni určitě projeví zájem." # todo: NEW TRANSLATION
 PMR_hate_mlv: "Kritika Moldavska" # todo: NEW TRANSLATION
 PMR_hate_mlv_desc: "Mluvíme pevně a jasně – naše cesty se s Moldavskem dávno rozešly." # todo: NEW TRANSLATION
 PMR_free_weapons: "Volné nošení zbraní" # todo: NEW TRANSLATION
 PMR_anti_gays: "Politika proti LGBT" # todo: NEW TRANSLATION
 PMR_exercises: "Cvičení s Ruskou armádou" # todo: NEW TRANSLATION
 PMR_political_nation_idea: "Transnistrijská politická národnost" # todo: NEW TRANSLATION
 PMR_ruble_efffect_idea: "Integrace ruské legislativy" # todo: NEW TRANSLATION
 PMR_internet_cencor: "Internetová cenzura" # todo: NEW TRANSLATION
 PMR_father_nation_idea: "Otec národa" # todo: NEW TRANSLATION
 PMR_victory_moldova: "Vítězství v občanské válce" # todo: NEW TRANSLATION
 PMR_develop_turism: "Turismus" # todo: NEW TRANSLATION
 PMR_fragment_ussr: "Fragment SSSR" # todo: NEW TRANSLATION
 PMR_fragment_ussr_desc: "Transnistrie se doslova stala ukázkou sovětské minulosti a bohužel to pravděpodobně nezmění brzy kvůli útrapám republiky" # todo: NEW TRANSLATION
 PMR_highway_focus: "Dálnicové zaměření" # todo: NEW TRANSLATION
 PMR_14_army: "Operativní skupina ruských jednotek" # todo: NEW TRANSLATION
 PMR_14_army_desc: "Operativní skupina ruských jednotek v transnistrském regionu Moldavské republiky je sdružením ozbrojených sil Ruské federace, rozmístěným na území neuznané Pridněstrovské Moldavské republiky, která existuje od roku 1995." # todo: NEW TRANSLATION
 PMR_sheriff_pmc: "Vytvořit vlastní PMCs" # todo: NEW TRANSLATION
 PMR_sheriff_pmc_desc: "Jsme připraveni vytvořit naše vlastní soukromé vojenské společnosti." # todo: NEW TRANSLATION
 PMR_sheriff_state: "Stát je korporace" # todo: NEW TRANSLATION
 PMR_sheriff_state_desc: "Dokončili jsme náš velký plán." # todo: NEW TRANSLATION
 PMR_monarchism: "Monarchistická ústava" # todo: CHANGED
 PMR_monarchism_desc: "Transnistrie je považována za rezervu SSSR, avšak názory místních obyvatel se již dlouho změnily. SSSR je nyní spojován se zříceninami a chaosem; možná dědictví Ruského impéria je pro nás vhodnější?" # todo: NEW TRANSLATION
 PMR_const: "Tradiční reforma" # todo: CHANGED
 PMR_const_desc: "Naše země hodlá radikálně změnit svůj systém; k tomu začneme s tím nejdůležitějším: reformou ústavy." # todo: NEW TRANSLATION
 PMR_mon_const: "Královská vláda" # todo: CHANGED
 PMR_mon_const_desc: "Reformy byly dokončeny a jsme připraveni oznámit, že Transnistrie je nyní ústavní monarchií." # todo: NEW TRANSLATION
 PMR_opponents: "Boj proti opozici" # todo: NEW TRANSLATION
 PMR_opponents_desc: "Opozice je zjevně nespokojena s novým systémem státu a protesty ještě více zintenzivnila; musíme s tím něco udělat." # todo: NEW TRANSLATION
 PMR_church: "Církev je státní institucí" # todo: NEW TRANSLATION
 PMR_church_desc: "Vrátíme se k praxi Ruského impéria a obnovíme dřívější postavení Církve." # todo: NEW TRANSLATION
 PMR_not_soviet: "Nejsme fragment SSSR" # todo: NEW TRANSLATION
 PMR_not_soviet_desc: "Transnistrie je součástí Ruského impéria a budeme tuto identitu aktivně rozvíjet. Být fragmentem SSSR je pro nás ostudou." # todo: NEW TRANSLATION
 PMR_general: "Generál.Křesťanský.Monarchista" # todo: NEW TRANSLATION
 PMR_general_desc: "Tohle jsou kvality, které náš vůdce má a které by měl mít každý ruský vlastenec." # todo: NEW TRANSLATION
 PMR_drozdov: "Oživit Dobrovolnou armádu" # todo: NEW TRANSLATION
 PMR_drozdov_desc: "Dobrovolná armáda byla vytvořena během Ruské občanské války. Bránila zájmy bílého hnutí a byla skutečnou armádou patriotů a obránců Ruska; obnovíme ji a povedeme ji pod naší vlajkou." # todo: NEW TRANSLATION
 PMR_kornilov: "Oživit Kornilovský pluk" # todo: NEW TRANSLATION
 PMR_kornilov_desc: "Uctíme padlé vojáky Kornilovského pluku a znovu jej zařadíme do řad naší armády." # todo: NEW TRANSLATION
 PMR_revive: "Oživit Drozdovský pluk" # todo: NEW TRANSLATION
 PMR_revive_desc: "Uctíme padlé vojáky Drozdovského pluku a znovu jej zařadíme do řad naší armády." # todo: NEW TRANSLATION
 PMR_emperess_maria: "Úřad institucí císařovny Marie" # todo: NEW TRANSLATION
 PMR_emperess_maria_desc: "Obnovíme tento úřad a bude se zabývat dostupnými sanatorii a nemocnicemi, čímž zlepšíme zdravotní péči našich občanů." # todo: NEW TRANSLATION
 PMR_nationalized: "Znárodnit společnosti" # todo: CHANGED
 PMR_nationalized_desc: "Naše schopnost prosadit nové tradiční normy bude určena naší schopností přímo řídit průmysl." # todo: CHANGED
 PMR_agri_sup: "Podpora agro-průmyslového sektoru" # todo: NEW TRANSLATION
 PMR_agri_sup_desc: "Nemůžeme očekávat podporu rolníků, aniž bychom zajistili, že budou mít prostředky k přežití." # todo: CHANGED
 PMR_lux_tax: "Zavést daň z luxusu" # todo: CHANGED
 PMR_lux_tax_desc: "Bohatí by měli platit více daní, protože naše pokladna není neomezená, ale spíše velmi malá." # todo: NEW TRANSLATION
 PMR_monarchy_guard: "Císařská stráž" # todo: NEW TRANSLATION
 PMR_monarchy_guard_desc: "Jaký monarch je bez své Stráže? Na území Svatého stolce bude zřízena Císařská stráž, která bude chránit stát a císaře." # todo: NEW TRANSLATION
 PMR_dedd_sheriff: "Uvěznit šerifa" # todo: NEW TRANSLATION
 PMR_dedd_sheriff_desc: "Je čas ukončit vliv této holdingové společnosti na naší republice, osvobodíme se!" # todo: NEW TRANSLATION
 PMR_rule_romanov: "Panování Romanovců" # todo: NEW TRANSLATION
 PMR_fragment_rus_empire: "Část Ruského impéria" # todo: NEW TRANSLATION
 PMR_russian_legacy: "Ruské dědictví" # todo: NEW TRANSLATION
 PMR_emperess_maria_idea: "Úřad institucí císařovny Marie" # todo: NEW TRANSLATION
 PMR_royal_leib_guard_idea: "Leibova garda" # todo: NEW TRANSLATION
 transnistria.5.t: "Předčasné volby" # todo: NEW TRANSLATION
 transnistria.5.d: "" # todo: NEW TRANSLATION
 transnistria.5.a: "Yevgeny Shevchuk" # todo: NEW TRANSLATION
 transnistria.5.b: "Igor Smirnov" # todo: NEW TRANSLATION
 transnistria.5.c: "Anatoliy Kaminski" # todo: NEW TRANSLATION
 transnistria.6.t: "Socha Lenina zmizí" # todo: NEW TRANSLATION
 transnistria.6.d: "Socha ruského revolucionáře Vladimira Lenina zmizela z hlavního města Tiraspolu záhadně. Měli bychom začít pátrat po soše, nebo ji úplně opustit?" # todo: NEW TRANSLATION
 transnistria.6.a: "Začít pátrání" # todo: NEW TRANSLATION
 transnistria.6.b: "To je ztráta času" # todo: NEW TRANSLATION
 transnistria.7.t: "Obnovení Vladimira Lenina" # todo: NEW TRANSLATION
 transnistria.7.d: "Po pátrání se ukázalo, že hledání sochy bylo neúspěšné, prezident [PMR.GetLeader] byl nalezen mrtvý ve svém úřadu, a socha Vladimira Lenina byla nalezena na jeho místě a nyní se dívá na vedení naší velké země, jako to dělal během Ruské revoluce." # todo: NEW TRANSLATION
 transnistria.7.a: "A Lenin je znovu mladý" # todo: NEW TRANSLATION
 transnistria.8.t: "Budoucnost Transnistrie" # todo: NEW TRANSLATION
 transnistria.8.d: "Po nedávném sjednocení Moldavska s Rumunskem je naše země nyní na nejkritičtějších bodech, kdy čelíme ještě větší síle, než kdy dřív. Pokud chceme, aby naše tradice přežily, musíme rozhodnout o budoucnosti naší země. Zpočátku velká část našeho obyvatelstva vyjádřila velkou podporu sjednocení s Ruskou federací, hlavně kvůli historickým a kulturním vazbám. Další návrh volá po sjednocení s naším sousedem Ukrajinou, říkajíc, že by to bylo lepší řešení hlavně proto, že Rusko nemá zemní spojení s Transnistrií a že také sdílíme mnoho podobností s ukrajinským lidem. Nakonec další návrh volá po udržení transnistrské nezávislosti a multikulturnosti a nezařazování naší země a hodnot do vlivu cizích mocností, což je to, co naše země bojovala bránit v Transnistrské válce z roku 1992. Země je rozdělena a jedna z možností by nás mohla ovlivnit buď k lepšímu, nebo horšímu." # todo: NEW TRANSLATION
 transnistria.8.a: "Spojíme se s našimi ruskými bratry a sestrami!" # todo: NEW TRANSLATION
 transnistria.8.b: "Spojíme se s našimi ukrajinskými bratry a sestrami!" # todo: NEW TRANSLATION
 transnistria.8.c: "Udržíme si naši nezávislost!" # todo: NEW TRANSLATION
 transnistria.9.t: "Transnistrie žádá o sjednocení" # todo: NEW TRANSLATION
 transnistria.9.d: "Poté, co Moldavsko nedávno sjednotilo s Rumunskem, Transnistrie se bojí, že bude absorbována Rumunskem a požádala, aby se stala územím [ROOT.GetName]. Zatímco to je skvělá příležitost pro nás rozšířit vliv v regionu a ukázat naši vojenskou sílu, Transnistrie je stále nárokována Rumunskem a pokud bychom ji integrovali, mohli bychom být v rozporu s Rumunskem, proto musíme vybrat moudře." # todo: NEW TRANSLATION
 transnistria.9.a: "Integrovat Transnistrii do [ROOT.GetName]" # todo: NEW TRANSLATION
 transnistria.9.b: "Odmítnout nabídku Transnistrie" # todo: NEW TRANSLATION
 transnistria.10.t: "[FROM.GetName] Přijímá" # todo: NEW TRANSLATION
 transnistria.10.d: "Dnes [FROM.GetName] přijal náš požadavek na unifikaci a spolupracuje s naší správou na zajištění hladkého přechodu." # todo: NEW TRANSLATION
 transnistria.10.a: "Pojďme se spojit se svými bratry a sestrami!" # todo: NEW TRANSLATION
 transnistria.11.t: "[FROM.GetName] Odmítá" # todo: NEW TRANSLATION
 transnistria.11.d: "Dnes [FROM.GetName] odmítl náš požadavek na integraci, a proto bude Transnistrie muset postupovat sama." # todo: NEW TRANSLATION
 transnistria.11.a: "Promarněná šance" # todo: NEW TRANSLATION
 transnistria.12.t: "[FROM.GetName] Přijímá" # todo: NEW TRANSLATION
 transnistria.12.d: "Dnes [FROM.GetName] přijal náš požadavek na unifikaci a spolupracuje s naší správou na zajištění hladkého přechodu." # todo: NEW TRANSLATION
 transnistria.12.a: "Pojďme se spojit se svými bratry a sestrami!" # todo: NEW TRANSLATION
 transnistria.14.t: "Nové továrny" # todo: NEW TRANSLATION
 transnistria.14.d: "Potřebujeme továrny, aby naše ekonomika mohla růst. Můžeme peníze použít na posílení naší armády. Měli bychom podpořit civilní nebo vojenský průmysl?" # todo: NEW TRANSLATION
 transnistria.14.a: "Postavte civilní továrnu." # todo: NEW TRANSLATION
 transnistria.14.b: "Postavte vojenskou továrnu." # todo: NEW TRANSLATION
 transnistria.15.t: "Vylepšená ekonomika" # todo: NEW TRANSLATION
 transnistria.15.d: "Ekonomika roste. Je čas rozhodnout, jakou budoucnost si přejeme. Můžeme dále růst ekonomiku a stát se regionální ekonomickou mocností, nebo využít současnou ekonomickou sílu k vybudování velké armády." # todo: NEW TRANSLATION
 transnistria.15.a: "Civilní budoucnost je naše nejlepší volba." # todo: NEW TRANSLATION
 transnistria.15.b: "Chceme vojenskou budoucnost." # todo: NEW TRANSLATION
 transnistria.16.t: "Referendum o vstupu do Ruska" # todo: NEW TRANSLATION
 transnistria.16.d: "Podněstří uspořádalo další referendum o připojení k naší zemi a lidé jednomyslně hlasovali „ano“. Splníme jejich očekávání, nebo je odmítneme?" # todo: CHANGED
 transnistria.16.a: "Ano" # todo: NEW TRANSLATION
 transnistria.16.b: "Ne" # todo: NEW TRANSLATION
 transnistria.17.t: "Transnistrie chce patřit zpět naší zemi" # todo: NEW TRANSLATION
 transnistria.17.d: "Transnistrie uspořádala referendum o připojení, ačkoliv je správné spíše hovořit o návratu do Moldavska. Jeho výsledek byl kladný, a tak nyní můžeme konečně vyřešit transnistrský konflikt." # todo: NEW TRANSLATION
 transnistria.17.a: "Transnistrie je naše" # todo: NEW TRANSLATION
 transnistria.17.b: "Oni nepotřebujeme." # todo: NEW TRANSLATION
 transnistria.18.t: "Vojenská doktrína Transnistrie" # todo: NEW TRANSLATION
 transnistria.18.d: "Naše země je uprostřed dvou ohní, a naše vojenská doktrína by měla odrážet stav naší země. Koho budeme považovat za potenciálního protivníka?" # todo: NEW TRANSLATION
 transnistria.18.a: "Rumunsko" # todo: NEW TRANSLATION
 transnistria.18.b: "Ukrajina" # todo: NEW TRANSLATION
 transnistria.19.t: "Transnistrie žádá, abychom jim poskytli Iskandery" # todo: NEW TRANSLATION
 transnistria.19.d: "Vláda Transnistrie nám nabídla umístit Iskandery na jejím území, abychom zajistili ještě větší bezpečnost jejího území. Budeme souhlasit s takovým riskantním krokem?" # todo: NEW TRANSLATION
 transnistria.19.a: "Ano" # todo: NEW TRANSLATION
 transnistria.19.b: "Ne" # todo: NEW TRANSLATION
 transnistria.20.t: "Povstání v Oděse" # todo: NEW TRANSLATION
 transnistria.20.d: "Ráno jsme obdrželi poměrně nečekanou a nepříjemnou zprávu: separatistické povstání se odehrálo v Oděse pod hesly nezávislosti určité Oděské republiky. Navíc stopy separatistů pocházejí přímo z Transnistrie." # todo: NEW TRANSLATION
 transnistria.20.a: "Co to sakra?" # todo: NEW TRANSLATION
 transnistria.21.t: "Lojalisté z Gagauzie" # todo: NEW TRANSLATION
 transnistria.21.d: "Můžeme Moldávii ještě více oslabit tím, že se pokusíme vyvolat gagauzské povstání v republice se stejným názvem, ale bude nás to stát nějaké peníze, navíc nevíme jistě, zda budeme mít čas jim pomoci." # todo: NEW TRANSLATION
 transnistria.21.a: "Vyvolat povstání" # todo: NEW TRANSLATION
 transnistria.21.b: "Ne" # todo: NEW TRANSLATION
 transnistria.22.t: "Ukrajina nám předala Oděsu" # todo: NEW TRANSLATION
 transnistria.22.d: "Ukrajinská vláda nezasáhla aktivně a nepřistoupila k konfrontaci s námi, což nás dokonce překvapilo." # todo: NEW TRANSLATION
 transnistria.22.a: "Tohle... dobrá zpráva?" # todo: NEW TRANSLATION
 transnistria.23.t: "Prezident Generál" # todo: NEW TRANSLATION
 transnistria.23.d: "Náš prezident, který se rovněž prohlásil vrchním velitelem, převzal vedení ozbrojených sil, aby se v případě potřeby osobně zúčastnil vojenských operací naší země." # todo: NEW TRANSLATION
 transnistria.23.a: "Dobré" # todo: NEW TRANSLATION
 transnistria.24.t: "Integrace ruské legislativy" # todo: NEW TRANSLATION
 transnistria.24.d: "Rozhodli jsme se integrovat ruskou legislativu do naší, nyní bude naše sloučení s Ruskem mnohem jednodušší... Pokud k tomu dojde, samozřejmě." # todo: NEW TRANSLATION
 transnistria.24.a: "Dobré" # todo: NEW TRANSLATION
 transnistria.25.t: "" # todo: NEW TRANSLATION
 transnistria.25.d: "" # todo: NEW TRANSLATION
 transnistria.25.a: "Dobré" # todo: NEW TRANSLATION
 transnistria.26.t: "Referendum o připojení k Ukrajině" # todo: NEW TRANSLATION
 transnistria.26.d: "Podněstří uspořádalo další referendum o připojení k naší zemi a lidé jednomyslně hlasovali „ano“. Splníme jejich očekávání, nebo je odmítneme?" # todo: CHANGED
 transnistria.26.a: "Ano" # todo: NEW TRANSLATION
 transnistria.26.b: "Ne" # todo: NEW TRANSLATION
 transnistria.28.t: "Společné vojenské akce" # todo: NEW TRANSLATION
 transnistria.28.d: "Oděská republika se okamžitě obrátila na nás s žádostí o vojenskou pomoc. Nyní mohou naše jednotky postupovat na území obou států." # todo: NEW TRANSLATION
 transnistria.28.a: "Pěkné" # todo: NEW TRANSLATION
 transnistria.29.t: "Referendum o postavení Transnístrie" # todo: NEW TRANSLATION
 transnistria.29.d: "Uspořádali jsme referendum, ve kterém náš lid vyjádřil přání zůstat nezávislý, a my mu nechceme toto právo upřít! Transnístrie bude nadále usilovat o svou nezávislost." # todo: NEW TRANSLATION
 transnistria.29.a: "Pěkné" # todo: NEW TRANSLATION
 transnistria.30.t: "Pomoc od specialistů centrální banky" # todo: NEW TRANSLATION
 transnistria.30.d: "Transnistrské úřady žádají naše specialisty z centrální banky, aby jim pomohli s reformou hospodářství; to bude vynikající příležitost pro zlepšení stavu hospodářství Transnístrie a posílení našeho vlivu v regionu." # todo: NEW TRANSLATION
 transnistria.30.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 transnistria.30.b: "Ne" # todo: NEW TRANSLATION
 transnistria.31.t: "Ruští specialisté centrální banky" # todo: NEW TRANSLATION
 transnistria.31.d: "Ruské úřady souhlasily s tím, že nám pomohou a pošlou specialisty z centrální banky, aby pomohli reformovat ekonomiku" # todo: NEW TRANSLATION
 transnistria.31.a: "Dobré" # todo: NEW TRANSLATION
 transnistria.32.t: "Ruští specialisté centrální banky" # todo: NEW TRANSLATION
 transnistria.32.d: "Ruské úřady nám odmítly pomoci a neposlaly specialisty centrální banky, aby pomohli reformovat hospodářství." # todo: NEW TRANSLATION
 transnistria.32.a: "Smutné" # todo: NEW TRANSLATION
 transnistria.33.t: "Pomoc v zemědělském odvětví" # todo: NEW TRANSLATION
 transnistria.33.d: "Vláda Transnístrie žádá o pomoc při rozvoji zemědělského odvětví prostřednictvím našich agro-průmyslových kampaní. Z této dohody nepochybně budeme těžit a zvýšit náš vliv v regionu." # todo: NEW TRANSLATION
 transnistria.33.a: "Pomůžeme jim" # todo: NEW TRANSLATION
 transnistria.33.b: "Ne" # todo: NEW TRANSLATION
 transnistria.34.t: "Ruští specialisté zemědělského průmyslu" # todo: NEW TRANSLATION
 transnistria.34.d: "Ruské úřady souhlasily s tím, že nám pomohou a pošlou specialisty pro rozvoj našeho agro-průmyslu." # todo: NEW TRANSLATION
 transnistria.34.a: "Dobré" # todo: NEW TRANSLATION
 transnistria.35.t: "Ruští specialisté zemědělského průmyslu" # todo: NEW TRANSLATION
 transnistria.35.d: "Ruské úřady odmítly nám pomoci a neposlaly odborníky k rozvoji našeho agro-průmyslu." # todo: NEW TRANSLATION
 transnistria.35.a: "Smutné" # todo: NEW TRANSLATION
 transnistria.36.t: "Transnístrie zve naše mírové jednotky" # todo: NEW TRANSLATION
 transnistria.36.d: "Vlády Republiky Transnístrie zásadně změnily směr zahraniční politiky a nyní hodlají opustit patronát Ruska, již vyhnali své mírové jednotky a volají nás. Máme zasáhnout?" # todo: NEW TRANSLATION
 transnistria.36.a: "Ano" # todo: NEW TRANSLATION
 transnistria.36.b: "Ne" # todo: NEW TRANSLATION
 transnistria.37.t: "Ukrajinské mírové jednotky" # todo: NEW TRANSLATION
 transnistria.37.d: "Ukrajinské orgány kladně reagovaly na naši žádost o jejich mírové jednotky v naší zemi; jejich jednotky okamžitě dorazí na naše území." # todo: NEW TRANSLATION
 transnistria.37.a: "Dobré" # todo: NEW TRANSLATION
 transnistria.38.t: "Ukrajinské mírové jednotky" # todo: NEW TRANSLATION
 transnistria.38.d: "Ukrajinské orgány reagovaly negativně na naši žádost o mírové jednotky v naší zemi; zdá se, že jsme prohráli vše." # todo: NEW TRANSLATION
 transnistria.38.a: "Smutné" # todo: NEW TRANSLATION
 transnistria.39.t: "Naše mírové jednotky v Transnístrii" # todo: NEW TRANSLATION
 transnistria.39.d: "Vláda Transnístrie učinila pro nás neočekávaný krok a oznámila, že musíme okamžitě stáhnout naše mírové jednotky z Transnístrie. To ohrožuje náš vliv v tomto regionu." # todo: NEW TRANSLATION
 transnistria.39.a: "Smutné" # todo: NEW TRANSLATION
 transnistria.40.t: "Referendum o vstupu do Ruska" # todo: NEW TRANSLATION
 transnistria.40.d: "Ruská vláda nás oficiálně přijala do svých řad! Nyní jsme se všichni stali součástí velkého státu s velkým dědictvím znovu." # todo: NEW TRANSLATION
 transnistria.40.a: "Hurá!" # todo: NEW TRANSLATION
 transnistria.41.t: "Referendum o vstupu do Ruska" # todo: NEW TRANSLATION
 transnistria.41.d: "Ruská vláda nám odmítla umožnit vstup do svých řad. Jsme nesmírně smutní a doufáme, že v budoucnu své rozhodnutí změní." # todo: NEW TRANSLATION
 transnistria.41.a: "Smutné" # todo: NEW TRANSLATION
 transnistria.42.t: "Integrace Transnístrie" # todo: NEW TRANSLATION
 transnistria.42.d: "Jsme připraveni konečně začlenit Transnístrii do naší země." # todo: NEW TRANSLATION
 transnistria.42.a: "Konečně" # todo: NEW TRANSLATION
 transnistria.43.t: "Děkujeme, že jste zvolili Transnístrii!" # todo: NEW TRANSLATION
 transnistria.43.d: "Transnístrie byla před rokem aktualizována, ale rozhodl jsem se zcela aktualizovat stávající obsah, abych ještě více obohatil hratelnost pro tuto malou zemi! V tomto patche bude Rusko a Transnístrie mít větší spolupráci než dříve, ale to neznamená, že vaše cesta nutně povede k Rusku. Můžete zvolit obě strany - Moldavsko i Ukrajina! A pokud budete zcela lstiví, můžete vytvořit Transnístrskou říši! Transnístrie byla aktualizována v souladu s mými vlastními standardy obsahu, které jsem implementoval v ruské větvi, takže i ekonomická větev je velmi podobná ruské. Doufám, že si tento aktualizovaný obsah užijete a zahrajete si zajímavou hru za Transnístrii s přítelem nebo přáteli! - Lord Bogdanoff Vývojář Transnístrie a člen týmu pro přepracování Ruska" # todo: NEW TRANSLATION
 transnistria.43.a: "Děkuji" # todo: NEW TRANSLATION
 transnistria.44.t: "Kolaps ukrajinské fronty" # todo: NEW TRANSLATION
 transnistria.44.d: "Ruské kolony postupují na západ a kyjevské velení ztratilo kontrolu nad jižním směrem. Oděská oblast, pás pobřeží, který nás od roku 1990 odděluje od moře, je bráněna jen o málo více než záložníky. Naši štábní důstojníci upozorňují, že sklady v Kolbasně jsou stále plné a že cesta do Tiraspolu vede oběma směry. Vedení v Tiraspolu zvažuje tuto příležitost proti jistotě, že Ukrajina, pokud přežije, nezapomene, kdo proti ní vyrazil." # todo: NEW TRANSLATION
 transnistria.44.a: "Tiraspol nebude stát stranou." # todo: NEW TRANSLATION
 transnistria.44.b: "Tohle není naše válka." # todo: NEW TRANSLATION
 transnistria.45.t: "Generál z Krasnojarsku" # todo: NEW TRANSLATION
 transnistria.45.d: "Alexander Lebeď velel 14. gardové armádě, když stála mezi Tiraspolí a moldavským postupem, a v této republice stále žijí důstojníci, kteří vysloví jeho jméno dříve než Smirnovovo. Nyní vládne Krasnojarskému kraji, šest tisíc kilometrů východně od Dněstru, létá mezi hornickými městy v zapůjčených vrtulnících a pře s Moskvou kvůli rozpočtu kraje. Náš štáb tvrdí, že republiku vybudovanou vojáky by měl vést voják a že pozvání z Tiraspolu by nezůstalo bez odpovědi. Nebylo by to levné. Úřadující ruský gubernátor neopouští domov zadarmo a Moskva by za přimhouření očí chtěla víc než rubly." # todo: NEW TRANSLATION
 transnistria.45.a: "Přiveďte generála domů." # todo: NEW TRANSLATION
 transnistria.45.b: "Tiraspol není jeho, aby mu velel." # todo: NEW TRANSLATION
 transnistria.46.t: "Generál se domů nevrátí" # todo: NEW TRANSLATION
 transnistria.46.d: "Mi-8 s Alexandrem Lebeděm narazil v kopcích Krasnojarského kraje do elektrického vedení a v mlze se zřítil. Gubernátor kraje, muž, který v roce 1992 držel linii na Dněstru, zahynul spolu s dalšími sedmi lidmi na palubě. Tiraspol zaslal Moskvě soustrast. Důstojníci, kteří deset let čekali na jeho návrat, už nemají na co čekat, a ať už by vláda vojáků v této republice pod jeho velením vypadala jakkoli, nyní už vybudována nebude." # todo: NEW TRANSLATION
 transnistria.46.a: "Je pohřben na Novoděvičím hřbitově." # todo: NEW TRANSLATION
 transnistria_news.1.t: "Transnístrie se stane součástí Ruska" # todo: NEW TRANSLATION
 transnistria_news.1.d: "Vlády neuznané Pridnestrovské Moldavské republiky uspořádaly referendum o vstupu do Ruska, v němž většina hlasovala pro. Ruská vláda přijala výsledek referenda a oznámila začlenění Transnístrie do Ruska." # todo: NEW TRANSLATION
 transnistria_news.1.a: "Zajímavé." # todo: NEW TRANSLATION
 transnistria_news.3.t: "Transnístrie se stává součástí Moldavska" # todo: NEW TRANSLATION
 transnistria_news.3.d: "Vlády neuznané Pridnestrovské Moldavské republiky uspořádaly referendum o připojení k Moldavsku, v němž většina hlasovala pro. Moldavská vláda přijala výsledek referenda a oznámila začlenění Transnístrie do Moldavska." # todo: NEW TRANSLATION
 transnistria_news.3.a: "Zajímavé." # todo: NEW TRANSLATION
 transnistria_news.4.t: "Transnístrie anektovala Moldavsko" # todo: NEW TRANSLATION
 transnistria_news.4.d: "Nečekané zprávy přicházejí z Moldavska. Transnístrie, dříve součást tohoto státu, oznámila anexi Moldavska a obsazení jeho postavení jako pokračování moldavské státnosti." # todo: NEW TRANSLATION
 transnistria_news.4.a: "Zajímavé." # todo: NEW TRANSLATION
 PMR_general_monarchist_christian: "Generální monarchisticko-křesťanský" # todo: NEW TRANSLATION
 PMR_sheriff_finish: "Šeriff dokončen" # todo: NEW TRANSLATION
 PMR_commi: "Sovětské znovusjednocení" # todo: CHANGED
 PMR_commi_desc: "Komunismus se znovu vrátil do Transnístrie. Budou komunisti znovu vládnout zemi?" # todo: NEW TRANSLATION
 PMR_single: "Jediný směr" # todo: CHANGED
 PMR_single_desc: "Komunistická strana Transnístrie zná nejlépe ve všech sférách, které se týkají státu. Pokud ostatní lidé ustoupí z cesty, můžeme se pustit do budování skutečné komunistické utopie a tentokrát uspějeme." # todo: NEW TRANSLATION
 PMR_commi_ideology: "Ideologické přepracování" # todo: CHANGED
 PMR_commi_ideology_desc: "Je na čase vrátit ideologické metody sovětské éry vzdělávání a převést je do moderní podoby" # todo: NEW TRANSLATION
 PMR_commi_promka: "Průmyslové oživení" # todo: NEW TRANSLATION
 PMR_commi_promka_desc: "Průmysl Transnístrie pomalu odumírá, je na čase tento negativní trend obrátit" # todo: NEW TRANSLATION
 PMR_collectivism: "Využít kolektivistickou rétoriku" # todo: CHANGED
 PMR_collectivism_desc: "Kolektivizace už jednou fungovala, takže ji zopakujeme." # todo: NEW TRANSLATION
 PMR_pioneer: "Pionýr" # todo: NEW TRANSLATION
 PMR_pioneer_desc: "Mladí lidé by neměli být nečinní, proto oživíme pionýrskou organizaci." # todo: NEW TRANSLATION
 PMR_marxism: "Marxismus ve školách" # todo: NEW TRANSLATION
 PMR_marxism_desc: "Učební osnovy budou nutně obsahovat Marxe." # todo: NEW TRANSLATION
 PMR_education: "Učit svobodně" # todo: CHANGED
 PMR_education_desc: "Vzdělání by mělo být zdarma a dostupné pro každého občana našeho slavného státu." # todo: NEW TRANSLATION
 PMR_atheism: "Potlačit církev" # todo: CHANGED
 PMR_atheism_desc: "Náboženství je opium lidu, takže je čas bojovat s náboženstvím." # todo: NEW TRANSLATION
 PMR_fixe: "První pětiletka" # todo: NEW TRANSLATION
 PMR_fixe_desc: "Volné ekonomické modely západních států nejsou budoucností socialistického státu. Návrat k plánované ekonomice, nejlépe ve formě klasických sovětského stylu pětiletých plánů, zajistí vládě neomezený vliv na dříve nekontrolovanou ekonomiku." # todo: NEW TRANSLATION
 PMR_workers: "Podpora pracujících" # todo: NEW TRANSLATION
 PMR_workers_desc: "Dělnická třída je naší oporou a silou, a vždy ji budeme podporovat v boji proti kapitalistické nákaze!" # todo: NEW TRANSLATION
 PMR_anti_nationalism: "Boj proti opozici" # todo: NEW TRANSLATION
 PMR_anti_nationalism_desc: "Žádná milost pro ničivé prvky, které chtějí zdržet náš postup k komunismu!" # todo: NEW TRANSLATION
 PMR_army_corruptions: "Zastavte prodej zbraní" # todo: NEW TRANSLATION
 PMR_army_corruptions_desc: "Máme v úmyslu zastavit prodej zbraní ze skladů v Kolbasnaya a zastavit jejich distribuci na obou stranách." # todo: NEW TRANSLATION
 PMR_clean_governments: "Vyčistěte vládu" # todo: NEW TRANSLATION
 PMR_clean_governments_desc: "Všechny korupční a ničivé prvky budou vyhnány z naší vlády" # todo: NEW TRANSLATION
 PMR_ded_sheriff: "Ukončit šerifův holding" # todo: NEW TRANSLATION
 PMR_ded_sheriff_desc: "Šerifův holding nás drží pod svou kontrolou už příliš dlouho! Je načase to dokončit" # todo: NEW TRANSLATION
 PMR_chinese_economic: "Čínské ekonomické zkušenosti" # todo: NEW TRANSLATION
 PMR_chinese_economic_desc: "Přijmeme čínský ekonomický systém jako základ naší ekonomické politiky a podle našeho názoru vypadá slibně." # todo: NEW TRANSLATION
 PMR_national_industry: "Převzít kontrolu nad průmyslem" # todo: CHANGED
 PMR_national_industry_desc: "Budeme podporovat náš průmysl a rozvíjet ho. Naše země potřebuje nové podniky, které nahradí ty, jež zanikly po zhroucení SSSR." # todo: NEW TRANSLATION
 PMR_mobilise: "Mobilizovat skupiny" # todo: CHANGED
 PMR_mobilise_desc: "Naše armáda potřebuje lidi, kteří budou hájit zájmy naší země, kamkoliv to strana vyžaduje." # todo: NEW TRANSLATION
 PMR_people_militia_desc: "Jsme připraveni přijmout zákon o vytvoření lidové milice, která bude jistým druhem rezervy pro teritoriální obranu. V každé vesnici by měla být vycvičená skupina lidí k odvrácení nepřítele, s následnou transformací do partyzánského hnutí." # todo: NEW TRANSLATION
 PMR_revoult_spirit: "Revoluční duch" # todo: NEW TRANSLATION
 PMR_revoult_spirit_desc: "Duch revoluce kráčí Transnistríí a my ho budeme nést dál." # todo: NEW TRANSLATION
 PMR_interbrigade: "Mezinárodní brigáda" # todo: NEW TRANSLATION
 PMR_interbrigade_desc: "Naši vojáci jsou připraveni podílet se na mezinárodní službě na ochranu trpících občanů jiných států." # todo: NEW TRANSLATION
 PMR_anti_corrupt_company: "Boj proti korupci" # todo: NEW TRANSLATION
 PMR_anti_corrupt_company_desc: "Korumpovaní úředníci nemají v Transnistrii místo!" # todo: NEW TRANSLATION
 PMR_new_chinush: "Nová generace úředníků" # todo: NEW TRANSLATION
 PMR_new_chinush_desc: "Vychováme novou generaci civilních úředníků, kteří budou věrní zemi a ne své kapse." # todo: NEW TRANSLATION
 PMR_new_five: "Pokračovat v pětiletém plánu" # todo: CHANGED
 PMR_new_five_desc: "Systém pětiletých plánů se během sovětské éry osvědčil; hodláme ho znovu využít." # todo: NEW TRANSLATION
 PMR_red_army_pmr: "Rudá armáda Transnistrie" # todo: NEW TRANSLATION
 PMR_red_army_pmr_desc: "Náš stát potřebuje silnou armádu a nejsilnější armádou je Rudá Jednička!" # todo: NEW TRANSLATION
 PMR_red_moldova: "Návrat Moldavské SSR" # todo: NEW TRANSLATION
 PMR_red_moldova_desc: "Moldavští občané dlouho trpěli pod jhem západních vlád a jejich podřízených, kteří Moldavii učinili jednou z nejchudších zemí Evropy i světa, je čas je osvobodit od kapitalistického útlaku." # todo: NEW TRANSLATION
 PMR_new_trans: "Nová éra Transnistrie" # todo: NEW TRANSLATION
