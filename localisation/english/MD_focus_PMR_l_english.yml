 PMR_eastern_europe_operations: "Cobasna Ammunition Depot" # todo: NEW TRANSLATION
 PMR_eastern_europe_operations_desc: "\n\n\n\n\n\n£PMR_desctext_cobasna \n\n\n\n\n\n\n\n\n§YThe Cobasna§! ammunition depot, formally the §Y1411th Artillery Ammunition Depot§!, is a large ammunition depot located in the village of §YCobasna§!. Legally and §1internationally recognized§! as part of [MLV.GetFlag]§YMoldova§! as a whole, the unrecognized breakaway state of [PMR.GetFlag]§YTransnistria§! controls the village and the ammunition depot and has denied access to §1international observers§!, an exception being the [SOV.GetFlag]§YRussian§! military forces located in the region ever since the end of the §RTransnistria War§! §Yin 1992§!. Outside access to the ammunition depot is effectively prohibited. Only the [SOV.GetFlag]§YRussian§! and [PMR.GetFlag]§YTransnistrian§! authorities have detailed information regarding the amount and situation of the stored weapons\n\n§YNumber of weapons§! in the warehouse in §YCobasna§! is §Y[?PMR.kolbasna]§!" # todo: NEW TRANSLATION
