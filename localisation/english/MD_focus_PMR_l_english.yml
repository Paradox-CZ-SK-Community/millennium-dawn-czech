 PMR_interbrigade_idea: "Mezinárodní brigáda" # todo: NEW TRANSLATION
 PMR_anti_corruption_fight: "Antikorupční politika" # todo: NEW TRANSLATION
 PMR_just: "Republikánská Transnistrie" # todo: NEW TRANSLATION
 PMR_just_desc: "Naše strana bude šířit myšlenky socialismu a patriotismu masám. Transnistrie byla a bude nezávislá!" # todo: NEW TRANSLATION
 PMR_patriotism: "Transnistrijská národní garda" # todo: NEW TRANSLATION
 PMR_patriotism_desc: "Na základě příkladů jiných zemí hodláme vytvořit naši vlastní národní gardu, která bude naším záložním nástrojem v případě vzbouřených nálad v jiných ozbrojených silách." # todo: NEW TRANSLATION
 PMR_small_business_support: "Rychlý rozvoj vědy" # todo: NEW TRANSLATION
 PMR_small_business_support_desc: "Věda byla vždy motor pokroku a my budeme podporovat naše vědce, bez ohledu na to, kolik jich je." # todo: NEW TRANSLATION
 PMR_infra: "Investice do infrastruktury" # todo: NEW TRANSLATION
 PMR_infra_desc: "Naši obyvatelé by měli jezdit po běžných silnicích, ne po minových polích." # todo: NEW TRANSLATION
 PMR_roskosh: "Daň z luxusu" # todo: NEW TRANSLATION
 PMR_roskosh_desc: "Bohatí by měli platit více daní, protože naše pokladna není nevyčerpatelná, ale spíše extrémně malá." # todo: NEW TRANSLATION
 PMR_selhoz: "Plán rozvoje zemědělství" # todo: NEW TRANSLATION
 PMR_selhoz_desc: "Agro-průmysl je klíčový pro naše přežití a sytost; nemáme v úmyslu ždímat investice v tomto odvětví." # todo: NEW TRANSLATION
 PMR_gos_plan_2: "Gosplan 2.0" # todo: NEW TRANSLATION
 PMR_gos_plan_2_desc: "Podobně jako pětileté plány SSSR vytvoříme svůj vlastní plán, takzvaný Gosplan 2.0." # todo: NEW TRANSLATION
 PMR_army_prestige: "Zvýšit prestiž armády" # todo: NEW TRANSLATION
 PMR_army_prestige_desc: "Prestiž naší armády musí vzrůst, protože kdyby nebylo těchto odvážných vojáků, naše republika by neexistovala." # todo: NEW TRANSLATION
 PMR_guarantees: "Zaručit společnostem" # todo: CHANGED
 PMR_guarantees_desc: "Naši občané musí mít všechna nezbytná sociální záruky, aby se cítili bezpečně." # todo: NEW TRANSLATION
 PMR_democracy: "Demokratické principy" # todo: NEW TRANSLATION
 PMR_democracy_desc: "Hlavní principy demokracie budou dodržovány na území našeho státu; totalitarismus a diktatura jsou minulostí!" # todo: NEW TRANSLATION
 PMR_health: "Zdravotnictví na prvním místě" # todo: CHANGED
 PMR_health_desc: "Zdravotnický sektor v naší zemi doslova prožívá své poslední dny; je načase to napravit a směrovat finanční injekce do tohoto sektoru." # todo: NEW TRANSLATION
 PMR_economic: "Ekonomické reformy" # todo: NEW TRANSLATION
 PMR_economic_desc: "Předchozí vůdci Transnistrie nám zanechali oslabený a zkorumpovaný ekonomický systém. Musíme provést reformy a deregulaci." # todo: NEW TRANSLATION
 PMR_family: "Rodina je hlavní hodnotou" # todo: NEW TRANSLATION
 PMR_family_desc: "Podpora rodin se stane jedním z našich hlavních sociálních programů. Vychováme novou generaci lidí, kteří budou zakládat úžasné a početné rodiny." # todo: NEW TRANSLATION
 PMR_corruptable: "Konec korupce" # todo: CHANGED
 PMR_corruptable_desc: "Korumpovaní úředníci budou potrestáni!" # todo: NEW TRANSLATION
 PMR_indep: "Politická nezávislost" # todo: NEW TRANSLATION
 PMR_indep_desc: "Naše země se musí konečně rozhodnout sama, co potřebuje, a nesmí podléhat ani vnitřním, ani vnějším silám." # todo: NEW TRANSLATION
 PMR_mvd_true: "Ministerstvo vnitra" # todo: NEW TRANSLATION
 PMR_mvd_true_desc: "Nyní že naše orgány v ministerstvu vnitra budou moci skutečně pracovat pro prospěch republiky, odstraníme ze tohoto ministerstva všechny korupční úředníky." # todo: NEW TRANSLATION
 PMR_banner: "Jednotní a silní lidé" # todo: NEW TRANSLATION
 PMR_banner_desc: "Náš lid je připraven pokračovat v boji za svou nezávislost a šťastnou budoucnost." # todo: NEW TRANSLATION
 PMR_great: "Jednotní lidé Transnistrie" # todo: NEW TRANSLATION
 PMR_patriotic_act: "Lidový vlastenecký zákon" # todo: NEW TRANSLATION
 PMR_social_program: "Program sociální podpory" # todo: NEW TRANSLATION
 PMR_luxury_tax_idea: "Daň z luxusu" # todo: NEW TRANSLATION
 PMR_idea_national_guard: "Národní garda" # todo: NEW TRANSLATION
 PMR_idea_national_guard_desc: "Územní síly sestavené z okresů a podřízené ministerstvu obrany namísto milice, jejichž úkolem je držet území, na něž si pravidelná armáda nemůže vyčlenit muže. Vnitřní rozpočet stojí více, než kolik ušetří, ale v každé osadě podél Dněstru zajišťují vycvičenou pušku.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!." # todo: NEW TRANSLATION
 PMR_gos_plans_idea: "Gosplan 2.0" # todo: NEW TRANSLATION
 PMR_pro_ukraine: "Cesta na Ukrajinu" # todo: NEW TRANSLATION
 PMR_pro_ukraine_desc: "Považujeme Ukrajinu za svůj historický domov – budeme usilovat o její připojení." # todo: NEW TRANSLATION
 PMR_expel_russian: "Vyhostit mírové síly" # todo: CHANGED
 PMR_expel_russian_desc: "Naše cesty s Ruskem se v tomto rozejdou, je načase, aby jejich mírové jednotky opustily naši zemi." # todo: NEW TRANSLATION
 PMR_invite_ukrainians: "Pozvat ukrajinské mírové jednotky" # todo: NEW TRANSLATION
 PMR_invite_ukrainians_desc: "Máme v úmyslu pozvat ukrajinské mírové jednotky, aby čelily moldavské agresi..." # todo: NEW TRANSLATION
 PMR_ukr_corps: "Přijměte ukrajinské korporace" # todo: NEW TRANSLATION
 PMR_ukr_corps_desc: "Dovolíme ukrajinským korporacím vstoupit na náš trh, což bude mít pozitivní dopad na naši ekonomiku" # todo: NEW TRANSLATION
 PMR_ukr_law: "Integrace do ukrajinské legislativy" # todo: NEW TRANSLATION
 PMR_ukr_law_desc: "Máme v úmyslu ustanovit naše zákony shodné s ukrajinskými, pro budoucí integraci" # todo: NEW TRANSLATION
 PMR_propaganda: "Pro-ukrajinská propaganda" # todo: NEW TRANSLATION
 PMR_propaganda_desc: "Budeme aktivně šířit pro-ukrajinskou propagandu ve své mediální sféře." # todo: NEW TRANSLATION
 PMR_contacts: "Kontakty s vládou Ukrajiny" # todo: NEW TRANSLATION
 PMR_contacts_desc: "Navážeme kontakt s ukrajinskou vládou a informujeme o našem úmyslu začlenit se do jejich země." # todo: NEW TRANSLATION
 PMR_ref_join_ukr: "Referendum o připojení Ukrajiny" # todo: NEW TRANSLATION
 PMR_ref_join_ukr_desc: "Jsme připraveni oznámit naši touhu stát se součástí Ukrajiny." # todo: NEW TRANSLATION
 PMR_ukraine_influency_TT: "[UKR.GetFlag] Čínský §HNásobič vlivu§! in §Y[ROOT.GetNameWithFlag]§!: §R+15%§!" # todo: NEW TRANSLATION
 PMR_ukr_army: "Ukrajinské mírové jednotky" # todo: NEW TRANSLATION
 PMR_grivna_efffect_idea: "Integrace Ukrajinského práva" # todo: NEW TRANSLATION
 PMR_path: "Integrace Moldavska" # todo: NEW TRANSLATION
 PMR_path_desc: "Začneme s integrací územ bývalého Moldavska do našeho státu." # todo: NEW TRANSLATION
 PMR_integr_economy: "Ekonomická integrace" # todo: NEW TRANSLATION
 PMR_integr_economy_desc: "Začněme, musíme provést ekonomickou integraci, regulující všechny aspekty naší budoucí sjednocené ekonomiky." # todo: NEW TRANSLATION
 PMR_political: "Politická integrace" # todo: NEW TRANSLATION
 PMR_political_desc: "Otázky struktury našeho nového státu a různých politických integračních problémů musí být také vyřešeny." # todo: NEW TRANSLATION
 PMR_true: "Jsme pravá Moldávie" # todo: NEW TRANSLATION
 PMR_true_desc: "Přijímáme roli moldavského státu, jakou kdysi zastávala Moldavská SSR." # todo: NEW TRANSLATION
 PMR_integrate_mlv_place: "Integrace moldavských území" # todo: NEW TRANSLATION
 PMR_integrate_mlv_place_desc: "Plně uznáváme naše právo na území, která bývala kdysi pod vládou Moldavska. Tato jsou naše země a budou jimi navždy; jsme připraveni je integrovat." # todo: NEW TRANSLATION
 PMR_full: "Unitární stát" # todo: NEW TRANSLATION
 PMR_full_desc: "Půjdeme po cestě unitarismu; autonomie nás může poškodit." # todo: NEW TRANSLATION
 PMR_no_autonomy: "Princip absence autonomie" # todo: CHANGED
 PMR_no_autonomy_desc: "Nedostatek autonomie je zárukou našeho státu v nepřítomnosti separatismu." # todo: NEW TRANSLATION
 PMR_kabardiners: "Karabiniérské jednotky" # todo: NEW TRANSLATION
 PMR_kabardiners_desc: "Karabiniérské jednotky jsou národní gendarmerie Transnistrie. Transnistrské karabiniérie mají zajišťovat, spolu se s policií nebo samostatně, veřejný pořádek, ochranu práv a svobod občanů, majetek majitelů a prevenci porušování zákona. Struktura agentury vychází z italské Carabinieri, odkud její název pochází." # todo: NEW TRANSLATION
 PMR_peace_keaper: "Mírový prapor" # todo: NEW TRANSLATION
 PMR_peace_keaper_desc: "Zřídíme vlastní mírový prapor, který se bude účastnit mezinárodních misí." # todo: NEW TRANSLATION
 PMR_annex_efffect_idea: "Ekonomická integrace" # todo: NEW TRANSLATION
 PMR_reform_debuff: "Politická integrace" # todo: NEW TRANSLATION
 PMR_peacerota_idea: "Mírový prapor" # todo: NEW TRANSLATION
 PMR_peacerota_idea_desc: "Smíšená kontrolní komise udržuje od roku 1992 v bezpečnostní zóně podněsterský kontingent spolu s ruskými a moldavskými prapory. Řádné zformování těchto sil poskytne Tiraspolu jednotku vycvičenou a vybavenou k nasazení za vlastními hranicemi.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!." # todo: NEW TRANSLATION
 PMR_vs_pmr: "Transnistrijská armáda" # todo: NEW TRANSLATION
 PMR_vs_pmr_desc: "Ačkoliv tak malý, neuznávaný stát má své ozbrojené síly, musíme posílit naši armádu, abychom odrazili hrozby naší nezávislosti." # todo: NEW TRANSLATION
 PMR_ground: "Transnistrijské ozbrojené síly" # todo: NEW TRANSLATION
 PMR_ground_desc: "Ozbrojené síly Podněsterské moldavské republiky, ozbrojené síly mezinárodně neuznávané Podněsterské moldavské republiky (PMR), byly založeny 6. září 1991 na ochranu obyvatel, suverenity, nezávislosti a územní celistvosti PMR." # todo: CHANGED
 PMR_lebed_academy: "Vojenský institut Ministerstva obrany" # todo: NEW TRANSLATION
 PMR_lebed_academy_desc: "Vyšší vojenská instituce se sídlem v Tiraspolu, kterou provozuje vojenské oddělení ozbrojených sil Transnistrie. Je nejvyšší vzdělávací instituce v ozbrojených silách." # todo: NEW TRANSLATION
 PMR_suvorov_academy: "Suvorovův vojenský institut Ministerstva obrany" # todo: NEW TRANSLATION
 PMR_suvorov_academy_desc: "Musíme pravidelně doplňovat důstojníky naší armády, k čemuž nám pomáhá naše vojenská univerzita pod Ministerstvem obrany." # todo: NEW TRANSLATION
 PMR_exer: "Vojenská cvičení s Ruskou armádou" # todo: NEW TRANSLATION
 PMR_exer_desc: "Ruská armáda je připravena provádět pravidelná cvičení s našimi jednotkami, aby předala moderní bojové zkušenosti." # todo: NEW TRANSLATION
 PMR_upgrade: "Vylepšení výzbroje armády" # todo: NEW TRANSLATION
 PMR_upgrade_desc: "Jsme připraveni vylepšit výzbroj naší armády, neboť ta nebyla aktualizována od Války za nezávislost." # todo: NEW TRANSLATION
 PMR_chechen: "Zkušenosti z čečenské války" # todo: NEW TRANSLATION
 PMR_chechen_desc: "Rusko je připraveno sdílet své zkušenosti s vedením války proti Republice Ichkerie, což je pro nás nepostradatelná informace a zkušenost." # todo: NEW TRANSLATION
 PMR_military: "Vojenský průmysl" # todo: NEW TRANSLATION
 PMR_military_desc: "Nesmíme doufat, že zásoby v našich skladech vydrží navždy; je nutné zavést výrobu našich zbraní." # todo: NEW TRANSLATION
 PMR_new_army: "Nová armáda Transnistrie" # todo: NEW TRANSLATION
 PMR_new_army_desc: "Naše reformy přinesly výsledky, obraz naší armády se změnil." # todo: NEW TRANSLATION
 PMR_spec: "Doktrína speciálních sil" # todo: NEW TRANSLATION
 PMR_spec_desc: "Zaměříme se na naše speciální jednotky, abychom prováděli bojové operace proti předpokládanému nepříteli." # todo: NEW TRANSLATION
 PMR_doctrine: "Doktrína zahraniční politiky" # todo: NEW TRANSLATION
 PMR_doctrine_desc: "Takové malé státy musí být vždy připraveny na útok ze strany větších sousedů, ale musíme jasně vědět, kdo na nás zaútočí?" # todo: NEW TRANSLATION
 PMR_iskander: "Žádat o ruské Iskandry" # todo: NEW TRANSLATION
 PMR_iskander_desc: "Ruské raketové systémy Iskander mohou být výborným argumentem proti útoku na nás." # todo: NEW TRANSLATION
 PMR_euiqp: "Koupit zbraně v Rusku" # todo: NEW TRANSLATION
 PMR_euiqp_desc: "Budeme nakupovat velké množství zbraní z Ruska, abychom vylepšili naše pozemní síly." # todo: NEW TRANSLATION
 PMR_air: "Letecké síly Transnistrie" # todo: NEW TRANSLATION
 PMR_air_desc: "Naše letectvo prakticky neexistuje, je nutné vytvořit alespoň minimální leteckou flotilu pro ochranu vzdušních hranic našeho domova." # todo: NEW TRANSLATION
 PMR_air_academy: "Letecká akademie" # todo: NEW TRANSLATION
 PMR_air_academy_desc: "Budoucí piloti se musí cvičit doma, a proto zřídíme pro to speciální akademii." # todo: NEW TRANSLATION
 PMR_instructors: "Ruští instruktoři" # todo: NEW TRANSLATION
 PMR_instructors_desc: "Naši budoucí piloti budou vycvičeni ruskými piloty." # todo: NEW TRANSLATION
 PMR_vvs_rf: "Spolupráce s Ruským letectvem" # todo: NEW TRANSLATION
 PMR_vvs_rf_desc: "Zintenzivníme spolupráci s Ruským letectvem na maximum." # todo: NEW TRANSLATION
 PMR_kazaks: "Vytvořte kozácký pluk pro bitvu" # todo: NEW TRANSLATION
 PMR_kazaks_desc: "Od konce minulého století byla Černomořská kozácká armáda začleněna do řad našich ozbrojených sil. Nyní, když je válka na prahu, je třeba je povolat do boje." # todo: NEW TRANSLATION
 PMR_landforce_modifier: "Podněsterské ozbrojené síly" # todo: NEW TRANSLATION
 PMR_landforce_modifier_desc: "Přibližně čtyři tisíce řadových vojáků v okolí Tiraspolu a Bender, vybavených z toho, co po sobě v roce 1992 zanechala sovětská 14. armáda, a vedených důstojníky, kteří naposledy viděli cvičiště pod jinou vlajkou. Příjem branců je malý, tanky T-64 a obrněné transportéry BTR nebyly deset let modernizovány a systém záloh existuje většinou jen na papíře.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!. Jeho postihy se budou §GZlepšovat§! s každým dokončeným zaměřením §HArmády§! a §Rzcela zmizí§!, jakmile dokončíme §HNovou podněsterskou armádu§!." # todo: NEW TRANSLATION
 PMR_airforce_modifier: "Podněsterské letectvo" # todo: NEW TRANSLATION
 PMR_airforce_modifier_desc: "Jedno letiště v Tiraspolu, hrstka strojů Mi-8 a Mi-24 předaných při útlumu 14. armády a vůbec žádná bojová letadla. Piloti vedení ve stavech od rozpadu Sovětského svazu neletěli v proudovém letounu a za nimi není žádná radarová síť hodná toho jména.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!. Jeho postihy se §Gzlepší§!, pokud dokončíme zaměření §HPodněsterské letectvo§!, a §Rzcela zmizí§!, jakmile dokončíme zaměření §HLetecká akademie§!." # todo: NEW TRANSLATION
 PMR_doctrine_romania: "Protiromunská doktrína" # todo: NEW TRANSLATION
 PMR_doctrine_romania_desc: "Generální štáb považuje Bukurešť za podporovatele všeho, o co se Kišiněv na Dněstru pokusí, a podle toho plánuje. Cvičení jsou připravována s ohledem na rumunské formace, rumunské vybavení a rumunské důstojníky přidělené k moldavské armádě.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!." # todo: NEW TRANSLATION
 PMR_doctrine_ukraine: "Protiukrajinská doktrína" # todo: NEW TRANSLATION
 PMR_doctrine_ukraine_desc: "Kyjev drží jedinou hranici, kterou Tiraspol nemůže uzavřít, a jedinou železnici, která vede do okolního světa. Generální štáb plánuje na den, kdy se tato hranice stane frontou, a cvičí armádu proti ukrajinským, nikoli moldavským formacím.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!." # todo: NEW TRANSLATION
 PMR_kazachestvo: "Černomořská kozácká armáda" # todo: NEW TRANSLATION
 PMR_kazachestvo_desc: "Černomořské kozácké vojsko bylo v údolí Dněstru obnoveno v roce 1991 a během války následujícího roku bojovalo v dobrovolnických oddílech. Jeho okresy si stále volí atamany, na rozkaz nastupují do služby a zbraně uchovávají doma; republika s nimi zachází jako se stálou zálohou.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!." # todo: NEW TRANSLATION
 PMR_kazaks_prepare: "Černomořská kozácká armáda" # todo: NEW TRANSLATION
 PMR_kazaks_prepare_desc: "\n\n\n\n\n\n£PMR_desctext_kazaki \n\n\n\n\n\n\n\n\n§YPůvod§! oživení §YČernomořské kozácké armády§! má kořeny v historii §GZáporožských kozáků§! a §GZáporožské siče§!, §Rzlikvidované§! v roce 1775. Vytvořená ke konci roku 1787 ze vzájemně nesourodých skupin §Gzáporožských kozáků§!, se §Y\"Armáda věrných záporožských kozáků\"§! stala spolehlivým štítem [SOV.GetFlag]§YRuska§! na jihu mezi řekami Dněstr a Bug, na územích, jejichž značná část nyní patří [PMR.GetFlag]§YPodněstří§!. §YČernomořští kozáci§!, obestřeni slávou vítězství ve [SOV.GetFlag][TUR.GetFlag]§Rrusko‑turecké válce§! let 1787–1791, byli po ukončení války dekretem carevny Kateřiny II. přesídleni v letech 1792–1793 do [KUB.GetFlag]§YKubanu§!, kde §YČernomořská kozácká armáda§! pokračovala v službě při ochraně jižních hranic [SOV.GetFlag]§YRuska§! až do roku 1860, kdy byla sloučena s §YKavkazskou pohraniční armádou§! a stala se známou jako [KUB.GetFlag]§YKubanská kozácká armáda§!. Náhlé změny v životě společnosti v §RSovětském svazu§! a hrozba rozvratu státní celistvosti způsobily koncem 80. let hnutí za oživení §Ykozáků§!, kteří po svých mnohasetletých dějinách byli oporným bodem a spolehlivým štítem §YVlasti§!. Po více než půlstoletí zapomnění a zkresňování podstaty §YKozáků§!, §Rrepresí§! a §Rgenocidy§!, se o §YKozácích§! opět začalo hovořit jako o nedílné součásti dějin [SOV.GetFlag]§YRuského státu§!. Nyní má kromě hlavní armády [PMR.GetFlag]§YPodněstří§! také možnost mobilizovat §Ykozácké§! oddíly pro §Rválku§!, které se stanou opěrnou základnou armády v boji proti nepřátelům" # todo: NEW TRANSLATION
 PMR_kazak_kamensk: "§YMobilizujte§! kozáky Kamenského okresu" # todo: NEW TRANSLATION
 PMR_kazak_ryibninsk: "§YMobilizujte§! kozáky Rybnitského okresu" # todo: NEW TRANSLATION
 PMR_kazak_dubossar: "§YMobilizujte§! kozáky Dubossarského okresu" # todo: NEW TRANSLATION
 PMR_kazak_slobodze: "§YMobilizujte§! kozáky Slobodzejského okresu" # todo: NEW TRANSLATION
 PMR_kazak_benderi: "§YMobilizujte§! kozáky Benderu" # todo: NEW TRANSLATION
 PMR_kolbasna_tt: "Počet zbraní ve skladu Cobasna se změní o §Y[?modify_kolbasna]§!\n" # todo: NEW TRANSLATION
 PMR_kazak_ready_tt: "Ve všech regionech byly vycvičené §YKozácké družiny§! in all regions" # todo: NEW TRANSLATION
 PMR_soc_dem: "Transnistrijská sociální demokracie" # todo: NEW TRANSLATION
 PMR_soc_dem_desc: "Obyvatelé Podněstří se probudí jako ze zlého snu a procitnou z velmi dlouhého bludu. Prodlužování existence tohoto pseudostátu v jeho současné podobě skončí a začne jeho očista, počínaje přeměnou Nejvyšší rady v řádný zákonodárný orgán." # todo: CHANGED
 PMR_liberalism: "Nový národní orgán" # todo: CHANGED
 PMR_liberalism_desc: "Nyní, když máme základ pro naši reformu, můžeme začít vytvářet §YVýbor pro reintegraci§!, jehož úkolem bude urychlit změny naší ústavy, které umožní naše plány na federaci. Mezitím můžeme zrušit zákaz několika opozičních stran čekajících na vstup do nové správy." # todo: CHANGED
 PMR_freedom: "Svoboda projevu" # todo: CHANGED
 PMR_freedom_desc: "Naše historie u volebních uren nebyla bez poskvrny a stejně tomu bylo i v oblasti lidských práv. Naší první prioritou by mělo být zrušení článku 316-1 a odstranění některých dalších omezení svobody projevu. Bude kontaktována mezinárodní agentura, aby zajistila řádný průběh místních voleb a důsledný dohled nad jejich spravedlivým konáním." # todo: CHANGED
 PMR_rhetoric: "Pro-moldavská rétorika" # todo: NEW TRANSLATION
 PMR_rhetoric_desc: "Moldavsko je stejně tak bratrským národem jako součástí naší vlastní identity. Rozmrzení vztahů a prosazování této otázky prostřednictvím vysílání nám přinese potřebnou podporu veřejnosti." # todo: CHANGED
 PMR_new_society: "Rozkvétající společnost" # todo: CHANGED
 PMR_new_society_desc: "Otevření naší země světu nevyhnutelně zanechá několik lidí za sebou, ale můžeme tento přechod usnadnit. Rozšíření našich agentur o jazykové vzdělávání a digitální školení pro ty, kteří je potřebují, jistě zmírní některé stížnosti a přinese do rozpočtu trochu peněz." # todo: CHANGED
 PMR_partnership: "Politická integrace s Moldavskem" # todo: NEW TRANSLATION
 PMR_partnership_desc: "Nyní, když byla naše komunikace plodná, můžeme přestat obcházet otázku integrace a zahájit přechod. Přijmeme jednotný právní rámec Moldavska a odstraníme zbývající separatistické prvky naší vlády, abychom se politicky co nejvíce přiblížili." # todo: CHANGED
 PMR_moldova_economic: "Přijmout leu" # todo: CHANGED
 PMR_moldova_economic_desc: "Opuštění rublu a přijetí moldavské měny bude nesmírně nákladným podnikem. Naštěstí náš nový výbor přímo spolupracuje s bankami na zřízení směnáren a okamžitém uvedení nových bankovek do oběhu." # todo: CHANGED
 PMR_moldova_military: "Synchronizovaná armáda" # todo: CHANGED
 PMR_moldova_military_desc: "Jedním z požadavků Moldavska bylo přizpůsobit naši armádu jeho doktríně a systémům. Budou vydány nové uniformy a zavedeny nové výcvikové režimy a naše velení bude prověřeno odshora dolů, abychom se ujistili, že s sebou nepřivádíme žádnou přítěž." # todo: CHANGED
 PMR_deccomuniz: "Dekomunizace" # todo: NEW TRANSLATION
 PMR_deccomuniz_desc: "Naposledy, když jsme to ověřovali, uplynulo více než deset let od pádu železné opony a zrušení Sovětského svazu. Sochy a památníky působily méně jako nostalgické rozptýlení a více jako ostuda našeho nového vedení. Pokud chceme dosáhnout pokroku při vytváření nové kultury, doba se bude muset změnit." # todo: CHANGED
 PMR_contact_eu: "Evropský domov" # todo: CHANGED
 PMR_contact_eu_desc: "Náš stát možná v současnosti není mezinárodně uznáván, ale naši občané nemusí sdílet stejný osud. Budeme spolupracovat s Moldavskem, abychom zajistili, že naši lidé získají možnost přístupu k Evropské unii se všemi svobodami, které to přináší." # todo: CHANGED
 PMR_federation: "Federální projekt" # todo: CHANGED
 PMR_federation_desc: "\n\n\n\n\n\n£PMR_desctext_federation \n\n\n\n\n\n\n\n\nNastal čas předložit radě náš návrh na federalizaci s Moldavskem. Pokud žádost projde poslední překážkou, bude následovat celostátní referendum. Můžeme jen doufat, že jsme veřejnost dostatečně přesvědčili." # todo: CHANGED
 PMR_investors: "Přivítat investory" # todo: CHANGED
 PMR_investors_desc: "Při každém velkém politickém otřesu se ti, kteří chtějí změny využít, přirozeně vrhnou dovnitř. Několik významných osobností se ozvalo a chce získat svůj podíl na dění. \n\nJe správné, abychom podali pomocnou ruku, když je nabízena nám." # todo: CHANGED
 PMR_it: "Přivést internet" # todo: CHANGED
 PMR_it_desc: "Internetová infrastruktura, kterou jsme dosud používali, byla z větší části instalována na začátku 90. let. Proto nám chybí mnoho technických vymožeností, které si většina evropských zemí užívá, například digitální televize a přijatelné rychlosti. Zrušení omezení zahraničních investic do IT to změní." # todo: CHANGED
 PMR_west_markets: "Přivítat investory" # todo: CHANGED
 PMR_west_markets_desc: "Naše nedávná spojení nám zajistila dosud nevídaný přístup na evropský trh. Jsme jako ryba vyhozená z akvária do oceánu — doslova plaveme ve světě příležitostí. Je čas potřást si rukama a nasadit naši nejlepší obchodní tvář." # todo: CHANGED
 PMR_expel_russians: "Vyhostit mírové síly" # todo: CHANGED
 PMR_expel_russians_desc: "Máme vlastní armádu schopnou bránit vlastní lid. Rusové, kteří zde zůstávají, budou dál poškozovat legitimitu naší vlády. Musí odejít." # todo: CHANGED
 PMR_annex_efffect_idea1: "Ekonomická integrace" # todo: NEW TRANSLATION
 PMR_army_efffect_idea1: "Armádní integrace" # todo: NEW TRANSLATION
 PMR_reform_debuff1: "Politická integrace" # todo: NEW TRANSLATION
 PMR_investors_idea: "Zahraniční investoři" # todo: NEW TRANSLATION
 PMR_western_market_idea: "Uzavřete se západnímu trhu" # todo: NEW TRANSLATION
 PMR_trans_libelaralism: "Transnistrijský liberalismus" # todo: NEW TRANSLATION
 PMR_decommunization: "Dekomunizace" # todo: NEW TRANSLATION
 PMR_MLV_influence_tt: "[MLV.GetFlag] moldavský §Hvlivový násobič§! v §Y[PMR.GetNameWithFlag]§!: §R+15%§!" # todo: NEW TRANSLATION
 PMR_democrat_inner_modifier: "Vnitřní politika liberální Transnistrie" # todo: NEW TRANSLATION
 PMR_democrat_inner_modifier_desc: "Politika vlády liberálů se vyznačuje soustředěním na ekonomický růst Ruska a menším zaměřením na vojenské a politické kroky." # todo: NEW TRANSLATION
 PMR_economy: "Transnistrie Ekonomika" # todo: NEW TRANSLATION
 PMR_economy_desc: "Transnistrijská ekonomika je nedostatečná a chybná. Abychom podpořili naši rostoucí zemi a její armádu, musíme vybudovat robustní ekonomiku, která ji udrží. Otázka zní, jak. Půjdeme nadále stezkou pašování, nebo najdeme jinou cestu pro naši budoucnost?" # todo: NEW TRANSLATION
 PMR_indust: "Udržet věci domácí" # todo: CHANGED
 PMR_indust_desc: "Musíme rozhodnout, kterým směrem se bude ubírat náš průmysl." # todo: NEW TRANSLATION
 PMR_agro: "Rustas LLC" # todo: NEW TRANSLATION
 PMR_agro_desc: "Rozvineme náš zemědělský průmysl, i přes malou velikost naší země." # todo: NEW TRANSLATION
 PMR_civil: "Civilní průmysl" # todo: NEW TRANSLATION
 PMR_civil_desc: "Potřebujeme nové továrny pro zaměstnanost našich občanů." # todo: NEW TRANSLATION
 PMR_sell_weapon: "Prodáme zbrojní zásoby" # todo: NEW TRANSLATION
 PMR_sell_weapon_desc: "Naše sklady, které zůstaly od dob SSSR, ukládají velké množství zbraní. Je čas na to vydělat." # todo: NEW TRANSLATION
 PMR_new_legistation: "Nové investiční normy" # todo: CHANGED
 PMR_new_legistation_desc: "Přijmeme nový zákon v investiční oblasti, který může přilákat nové investory do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_ukr_invest: "Ukrajinské investice" # todo: NEW TRANSLATION
 PMR_ukr_invest_desc: "Několik ukrajinských firem vyjádřilo zájem investovat do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_hun_invest: "Maďarské investice" # todo: NEW TRANSLATION
 PMR_hun_invest_desc: "Několik maďarských firem vyjádřilo zájem investovat do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_ita_invest: "Italské investice" # todo: NEW TRANSLATION
 PMR_ita_invest_desc: "Několik italských firem vyjádřilo zájem investovat do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_rom_invest: "Rumunské investice" # todo: NEW TRANSLATION
 PMR_rom_invest_desc: "Několik rumunských firem vyjádřilo zájem investovat do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_aus_invest: "Rakouské investice" # todo: NEW TRANSLATION
 PMR_aus_invest_desc: "Několik rakouských firem vyjádřilo zájem investovat do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_ge_invest: "Německé investice" # todo: NEW TRANSLATION
 PMR_ge_invest_desc: "Několik německých firem vyjádřilo zájem investovat do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_sov_invest: "Ruské investice" # todo: NEW TRANSLATION
 PMR_sov_invest_desc: "Několik ruských firem vyjádřilo zájem investovat do naší ekonomiky." # todo: NEW TRANSLATION
 PMR_sheriff_starting: "Sheriff Holding" # todo: NEW TRANSLATION
 PMR_sheriff_starting_desc: "\n\n\n\n\n\n£PMR_desctext_sheriff \n\n\n\n\n\n\n\n\nSheriff je druhou největší společností v mezinárodně neuznaném separatistickém státě Podněstří, hned po Moldavských ocelárnách. Společnost sídlící ve městě Tiraspol vznikla na počátku 90. let zásluhou Viktora Gusana a Ilji Kazmalyho, bývalých členů KGB. Sheriff se rozrostl téměř do všech oblastí ziskového soukromého podnikání v mezinárodně neuznané zemi a výrazně se zapojil také do místní politiky a sportu. Někteří komentátoři tvrdí, že stoupenci společnosti zastávají většinu klíčových vládních funkcí na tomto území." # todo: CHANGED
 PMR_sheriff_phones: "Interdnestrcom" # todo: NEW TRANSLATION
 PMR_sheriff_phones_desc: "Interdnestrcom je transnistrijská telekomunikační společnost poskytující mobilní komunikační služby pro Transnistrii, odtržený neuznaný stát mezinárodně uznávaný jako součást Moldavska. Založena byla v roce 1998. Kromě poskytování mobilních služeb poskytuje také dial-up a ISDN internetový přístup." # todo: NEW TRANSLATION
 PMR_sheriff_oil: "Sklad ropných produktů" # todo: NEW TRANSLATION
 PMR_sheriff_oil_desc: "Sheriff hodlá vybudovat sklad ropných produktů, aby zajistil autonomii svého palivového komponentu." # todo: NEW TRANSLATION
 PMR_sheriff_kvint: "KVINT" # todo: NEW TRANSLATION
 PMR_sheriff_kvint_desc: "KVINT je vinařství a palírna se sídlem v Tiraspolu, hlavním městě a průmyslovém centru Pridnestrovie. Kvint produkty jsou certifikovány 'Made in Moldova'. Založena v roce 1897, společnost vyprodukovala až do roku 1938 jen vodku, poté začala vyrábět brandy. Je to nejstarší stále fungující komerční podnik v regionu. Místní považují KVINT za národní poklad a symbol své země. Její továrna je vyobrazená na bankovce 5 Pridnestrovských rublů. KVINT je jedním z největších vývozců Pridnestrovia, do Itálie a Číny, stejně jako do Ruska a Ukrajiny." # todo: NEW TRANSLATION
 PMR_sheriff_bank: "Agroprombank CJSC" # todo: NEW TRANSLATION
 PMR_sheriff_bank_desc: "Holding dále plánuje založit vlastní banku k poskytování finančních služeb po celé Transnistrii." # todo: NEW TRANSLATION
 PMR_sheriff_tiroteks: "Tirotex" # todo: NEW TRANSLATION
 PMR_sheriff_tiroteks_desc: "Tirotex je textilní společnost se sídlem v Transnistrii, která vyrábí oblečení a další textilní výrobky. Nachází se v Tiraspolu. Společnost byla založena v roce 1972 výstavbou její továrny, která trvala deset let. Společnost je největším textilním podnikem v jihozápadní Společenství nezávislých států a rovněž si nárokuje být druhým největším svého druhu v celé Evropě. Ve svém areálu probíhají tkaní, šití, dokončovací a tkalcovské operace. Jako exportně orientovaná firma vyváží 70 % svých výrobků do zahraničí." # todo: NEW TRANSLATION
 PMR_sheriff_agro: "Holding Agro-průmysl" # todo: NEW TRANSLATION
 PMR_sheriff_agro_desc: "Holding má rovněž v úmyslu získat několik dalších agro-průmyslových závodů pro jejich obnovu a uvedení do provozu." # todo: NEW TRANSLATION
 PMR_rail_road: "Podněsterské železnice" # todo: CHANGED
 PMR_rail_road_desc: "Transnistrian Railway je provozovatelem železniční dopravy v Transnistrii." # todo: NEW TRANSLATION
 PMR_airport_back: "Tiraspol Airport" # todo: NEW TRANSLATION
 PMR_airport_back_desc: "Plánujeme dokončit rekonstrukci letiště Tiraspol a v případě potřeby jej využít pro civilní i vojenské účely." # todo: NEW TRANSLATION
 PMR_denomination_idea: "Slabý transnistrijský rubl" # todo: NEW TRANSLATION
 PMR_inter_rao: "Inter Rao" # todo: NEW TRANSLATION
 PMR_encouraged_foreign_investments_idea: "Investiční zákon" # todo: NEW TRANSLATION
 PMR_denomination_idea_desc: "Podněsterský rubl byl zaveden v roce 1994 na základě přetištěných sovětských bankovek a nikdy neměl rezervu, o kterou by se mohl opřít. Hyperinflace dvakrát zničila úspory, obyvatelstvo oceňuje vše v dolarech a centrální banka nedokáže udržet pevný kurz ani po jediné čtvrtletí.\n§W--------------§!\nTento národní duch bude §ROdstraněn§!, pokud dokončíme zaměření §HDenominace§!." # todo: NEW TRANSLATION
 PMR_encouraged_foreign_investments_idea_desc: "Tiraspol si nemůže půjčovat v zahraničí a nemůže tak malou ekonomiku zdaněním přivést k růstu, a tak místo toho prodává přístup. Investiční zákon z roku 2002 odstraňuje licencování, zaručuje repatriaci zisků a předává příchozím partnerům státní podniky, které Sheriff dosud nepřevzal.\n§W--------------§!\nTento národní duch bude §ROdstraněn§!, pokud se staneme předmětem jiné země." # todo: NEW TRANSLATION
 PMR_economy_modifier: "Podněsterské hospodářství" # todo: NEW TRANSLATION
 PMR_economy_modifier_desc: "To, co zbylo z průmyslového pásu Moldavské SSR: cementárny v Rybnycji, tiraspolské textilní závody, palírna KVINT, železnice, která přepravuje vše do Oděsy, a farmy v údolí Dněstru. Každá společnost znovu uvedená do provozu zde zanechává svou stopu.\n§W--------------§!\nTento národní duch nebude nikdy §ROdstraněn§!. Modifikátory se však mohou postupně §Gzlepšovat§! s dokončováním dalších zaměření, rozhodnutí a událostí." # todo: NEW TRANSLATION
 PMR_foreign_investments_modifier: "Zahraniční investice" # todo: NEW TRANSLATION
 PMR_foreign_investments_modifier_desc: "Podíl podněsterského průmyslu, který podléhá vlastníkům v zahraničí. Rakouské, německé a maďarské podíly zakoupené během privatizací, rumunský a italský kapitál v zemědělství a ukrajinští oceláři v Rybnycji. Jejich kapitál udržuje závody v chodu a jejich vlády mají v Tiraspolu slovo.\n§W--------------§!\nPodíl partnera bude §ROdstraněn§!, pokud s ním půjdeme do války nebo přestane existovat. Poté můžeme jeho podíly §YKoupit zpět§! prostřednictvím rozhodnutí §YPodněsterské hospodářství§!." # todo: NEW TRANSLATION
 PMR_sheriff_modifier: "Sheriff" # todo: NEW TRANSLATION
 PMR_sheriff_modifier_desc: "Společnost Sheriff, založená v roce 1993 dvěma bývalými důstojníky podněsterské milice, vlastní supermarkety, čerpací stanice, mobilní síť, televizní kanály, fotbalový klub a prostřednictvím strany Obnovlenie také Nejvyšší radu. Republika je méně státem s firmou uvnitř než firmou se státem kolem sebe.\n§W--------------§!\nTento národní duch bude §GSílit§! s každým dokončeným zaměřením Sheriffu a bude §ROdstraněn§!, pokud dokončíme rozhodnutí §YZničit monopol Sheriffu§! nebo jedno ze zaměření §HUkončit holding Sheriffu§!." # todo: NEW TRANSLATION
 PMR_sheriff_grows_tt: "£text_icon_pmr_sheriff Vliv společnosti §YSheriff§! v republice se §Rupevňuje§!" # todo: NEW TRANSLATION
 PMR_sheriff_full_control_tt: "£text_icon_pmr_sheriff §YSheriff§! má nad republikou §Rúplnou kontrolu§!" # todo: NEW TRANSLATION
 PMR_economy_category: "Transnistrijská ekonomika" # todo: NEW TRANSLATION
