 CRO_political.1.t: "Haag obžaloval Gotovinu" # todo: NEW TRANSLATION
 CRO_political.1.d: "MTSJ zveřejnil obžalobu generála Anteho Gotoviny za zločiny spáchané během operace Bouře. Před zatčením však zmizel. Veteránská sdružení se scházejí k protestům a Brusel dal jasně najevo, že spolupráce s tribunálem je podmínkou evropské integrace." # todo: NEW TRANSLATION
 CRO_political.1.a: "Musíme s tribunálem spolupracovat" # todo: NEW TRANSLATION
 CRO_political.1.b: "Chorvatsko své hrdiny nevydává" # todo: NEW TRANSLATION
 CRO_political.2.t: "Gotovina zatčen na Tenerife" # todo: NEW TRANSLATION
 CRO_political.2.d: "Španělská policie zatkla Anteho Gotovinu v hotelové restauraci na Kanárských ostrovech po čtyřech letech na útěku. Informace sdílené Záhřebem pomohly vypátrat jeho úkryt. Veteráni zapalují svíčky na hlavním náměstí, ale poslední překážka na evropské cestě byla odstraněna." # todo: NEW TRANSLATION
 CRO_political.2.a: "Bolestný, ale nezbytný krok" # todo: NEW TRANSLATION
 CRO_political.3.t: "Žádost o členství v Evropské unii" # todo: NEW TRANSLATION
 CRO_political.3.d: "Premiér Ivica Račan v Aténách oficiálně podal žádost Chorvatska o členství v Evropské unii. Vláda doufá, že dožene vlnu přistoupení, která již probíhá mezi jejími severními sousedy, a definitivně za sebou zanechá války předchozího desetiletí." # todo: NEW TRANSLATION
 CRO_political.3.a: "Naše místo je v Evropě" # todo: NEW TRANSLATION
 CRO_political.4.t: "Přístupová jednání zahájena" # todo: NEW TRANSLATION
 CRO_political.4.d: "Poté, co hlavní žalobce potvrdil plnou spolupráci Chorvatska s tribunálem, Evropská unie zahájila přístupová jednání. Prověřování chorvatského práva z hlediska acquis začíná okamžitě a zahraniční investoři si toho všímají." # todo: NEW TRANSLATION
 CRO_political.4.a: "Prověřování začíná" # todo: NEW TRANSLATION
 CRO_political.5.t: "Pozvání na bukurešťském summitu" # todo: NEW TRANSLATION
 CRO_political.5.d: "Summit NATO v Bukurešti oficiálně pozval Chorvatsko a Albánii. Přístupové protokoly mají být podepsány ještě letos. Pozvání je odměnou za desetiletí obranných reforem a ukotvuje Chorvatsko v západním spojenectví." # todo: NEW TRANSLATION
 CRO_political.5.a: "Místo u stolu" # todo: NEW TRANSLATION
 CRO_political.6.t: "Aféra Ina-MOL" # todo: NEW TRANSLATION
 CRO_political.6.d: "Bývalý premiér Ivo Sanader byl po útěku před stíháním zatčen v Rakousku. Vyšetřovatelé tvrdí, že přijal úplatek od maďarské ropné společnosti MOL, aby jí přenechal správní práva nad Inou, národní ropnou společností. Případ zasahuje do nejvyšších pater vládnoucí strany." # todo: NEW TRANSLATION
 CRO_political.6.a: "Nikdo nestojí nad zákonem" # todo: NEW TRANSLATION
 CRO_political.6.b: "Omezme škody" # todo: NEW TRANSLATION
 CRO_political.7.t: "Gotovina zproštěn v odvolacím řízení" # todo: NEW TRANSLATION
 CRO_political.7.d: "Odvolací senát MTSJ zrušil rozsudky nad generály Antem Gotovinou a Mladenem Markačem a nařídil jejich okamžité propuštění. Záhřebské hlavní náměstí zaplnily davy, které je vítaly doma. V Bělehradě a Banja Luce se rozhodnutí setkalo s hněvem." # todo: NEW TRANSLATION
 CRO_political.7.a: "Generálové se vracejí domů" # todo: NEW TRANSLATION
 CRO_political.8.t: "Vítejte v Evropské unii" # todo: NEW TRANSLATION
 CRO_political.8.d: "O půlnoci se Chorvatsko stalo 28. členským státem Evropské unie, čímž uzavřelo dvanáctiletý přístupový proces, který přežil šest vlád. Celní stanoviště na slovinských a maďarských hranicích se odstraňují." # todo: NEW TRANSLATION
 CRO_political.8.a: "Evropská budoucnost" # todo: NEW TRANSLATION
 CRO_political.9.t: "Schengen a euro" # todo: NEW TRANSLATION
 CRO_political.9.d: "Chorvatsko ve stejný den přijalo euro a vstoupilo do schengenského prostoru jako první členský stát, který oba kroky dokončil současně. Hraniční kontroly se zbytkem bloku zmizely a kuna se stává historií. Turistický průmysl očekává rekordní sezónu." # todo: NEW TRANSLATION
 CRO_political.9.a: "Konečně plně integrováni" # todo: NEW TRANSLATION
 CRO_political.10.t: "Herceg-Bosna vyhlašuje nezávislost" # todo: NEW TRANSLATION
 CRO_political.10.d: "Chorvatské kantony Hercegoviny vyhlásily samosprávnou Herceg-Bosnu a přerušily své vazby na Sarajevo. Záhřeb se musí rozhodnout, jak daleko při podpoře odštěpenců zajde." # todo: NEW TRANSLATION
 CRO_political.10.a: "Uznat Herceg-Bosnu" # todo: NEW TRANSLATION
 CRO_political.10.b: "Poskytnout tichou podporu" # todo: NEW TRANSLATION
