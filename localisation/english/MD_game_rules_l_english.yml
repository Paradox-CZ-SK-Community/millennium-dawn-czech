 RULE_ENABLE_HARD_AI_ECONOMIC: "Žádná omezení" # todo: NEW TRANSLATION
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Pokud vás nudí, že každá hra s AI nezvládá ekonomickou krizi - tohle je pro vás. AI již nebude omezena v rozhodování o své ekonomice. Připravte se na to, že mnoho zemí bude bohatších než vy. Pouze pro ty, kteří se nebojí výzvy. Pozdravy od Battle AI;)" # todo: NEW TRANSLATION
