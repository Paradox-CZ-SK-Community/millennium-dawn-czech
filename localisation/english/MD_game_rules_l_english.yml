 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Dluhové války pro AI" # todo: NEW TRANSLATION
 RULE_DISABLE_AI_DEBT_WAR: "Vypnout" # todo: NEW TRANSLATION
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Toto vypne funkci dluhových válek pro AI. AI již nebude mít možnost napadnout zemi, která nesplatí svůj dluh." # todo: NEW TRANSLATION
 RULE_ENABLE_AI_DEBT_WAR: "Povolit" # todo: NEW TRANSLATION
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Toto nastavení zvýší pravděpodobnost vyhlašování dluhových válek AI, pokud vy dlužíte jim." # todo: NEW TRANSLATION
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "AI používá §TZvýšit zaměření autonomie§!" # todo: NEW TRANSLATION
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Povolit" # todo: NEW TRANSLATION
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "AI bude bojovat proti vaší autonomii pomocí kontinuálního zaměření §YZlepšit autonomii§!." # todo: NEW TRANSLATION
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Zakázat" # todo: NEW TRANSLATION
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "AI již nebude bojovat proti vaší autonomii pomocí kontinuálního zaměření §YZlepšit autonomii§!." # todo: NEW TRANSLATION
 RULE_ENABLE_AI_USING_ATTACHES: "Povolit AI používání §Yattaché§!" # todo: NEW TRANSLATION
 RULE_ENABLE_AI_USING_ATTACHES_YES_DESC: "Umožní AI používat §Yattaché§! prostřednictvím diplomatických akcí" # todo: NEW TRANSLATION
 RULE_ENABLE_AI_USING_ATTACHES_NO_DESC: "Zakáže AI používat §Yattaché§! prostřednictvím diplomatických akcí" # todo: NEW TRANSLATION
 RULE_ALLOW_MD_ANNEX: "Povolit úklid border gore" # todo: NEW TRANSLATION
 RULE_OPTION_MD_ANNEX_NO_DESC: "Nebude mít vliv na hranice po mírové dohodě a zůstanou tak, jak byly nakresleny na konferenci." # todo: NEW TRANSLATION
 RULE_OPTION_MD_ANNEX_YES_DESC: "Po uzavření míru, pokud existuje více případů stejného tagu, budou všechny zbývající tagy integrovány do toho s nejmocnějším vrchním lenním pánem. Síla vrchního lenního pána bude určena jeho národním duchem hodnosti moci. Úklid po válce může trvat až 14 dní." # todo: CHANGED
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Povolit chaotické mírové dohody" # todo: NEW TRANSLATION
 RULE_OPTION_CHAOTIC_PC_NO: "Ne" # todo: NEW TRANSLATION
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Tato volba by měla zřejmě zastavit, aby si všichni hráči AI nedělali nároky na území během mírových konferencí.\nToto omezuje, kdo může nárokovat státy na velmoci a vůdce frakcí. (Toto ovlivní pouze AI, hráč ne.)" # todo: NEW TRANSLATION
 RULE_OPTION_CHAOTIC_PC_YES: "Ano" # todo: NEW TRANSLATION
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Pro ty, kteří si skutečně užívají prokleté mírové konference, proč omezovat svět na 1 §YRusko§! když jsou možné 12 §YRuska§!\n(Nejsem zodpovědný za výsledky, které z této volby mohou vyplynout!)" # todo: NEW TRANSLATION
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Povolit mírové konference vedené hráčem" # todo: NEW TRANSLATION
 RULE_OPTION_PLAYER_LED_PC_NO: "Ne" # todo: NEW TRANSLATION
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Tato volba umožní AI dělat vlastní rozhodnutí, ať už budou hloupá." # todo: NEW TRANSLATION
 RULE_OPTION_PLAYER_LED_PC_YES: "Ano" # todo: NEW TRANSLATION
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Pro ty, kteří nevěří AI, že správně zařídí věci, to umožní pouze hráčům dělat nároky během mírových konferencí." # todo: NEW TRANSLATION
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "Povolit Podmíněné mírové dohody" # todo: NEW TRANSLATION
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "Umožní válčícím státům použít naplánovanou diplomatickou akci §YPodmíněné mírové dohody§! , která umožní státům podepsat mírové dohody, jež nevyžadují plnou kapitulaci ani jedné strany." # todo: NEW TRANSLATION
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "Zakáže státům používat §YPodmíněné mírové dohody§! naplánovanou diplomatickou akcí, která donutí státy vytrvat v totální válce, aby dosáhly míru." # todo: NEW TRANSLATION
 RULE_ALLOW_CPD_AI_OFFERS: "Povolit podmíněné mírové nabídky AI" # todo: NEW TRANSLATION
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "Umožní státům ovládaným AI ve válce pravidelně vyhodnocovat probíhající konflikty a navrhovat §Ypodmíněné mírové dohody§!, pokud dospějí k závěru, že válku nelze vyhrát nebo uvízla na mrtvém bodě. Vládci budou také vyjednávat jménem omezených podřízených států." # todo: NEW TRANSLATION
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "Brání státům ovládaným AI v samostatném zahajování §Ypodmíněných mírových dohod§!. Hráči mohou dohody stále navrhovat ručně prostřednictvím diplomatické akce." # todo: NEW TRANSLATION
 RULE_PEACE_PROPOSAL_BLOCKED_TT: "Přestože §YPodmíněné mírové dohody§! jsou povoleny, toto bude zablokováno, použijte místo toho §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§!." # todo: NEW TRANSLATION
 RULE_OPTION_MD_RANDOM_PATH: "Náhodná cesta" # todo: NEW TRANSLATION
 RULE_OPTION_MD_RANDOM_PATH_DESC: "AI na začátku hry náhodně vybere jednu z cest této země, historickou nebo alternativní. Kterou si vybrala, zůstane před vámi skryto." # todo: NEW TRANSLATION
 RULE_OPTION_MD_NO_PATH: "Bez cesty" # todo: NEW TRANSLATION
 RULE_OPTION_MD_NO_PATH_DESC: "AI nesleduje žádnou skriptovanou cestu a volně si vybírá zaměření podle vývoje hry. Její chování se při každém průchodu mění." # todo: NEW TRANSLATION
 RULE_SALAFIST_BRANCH: "Povolit Salafistickou větev" # todo: NEW TRANSLATION
 RULE_YES_SALAFIST_BRANCH_DESC: "Umožňuje Salafistickou větev v generickém stromu pro všechny země bez ohledu na počáteční náboženství." # todo: NEW TRANSLATION
 RULE_NO_SALAFIST_BRANCH_DESC: "Umožňuje Salafistickou větev v generickém stromu pro národy sledující jakoukoli variantu islámu." # todo: NEW TRANSLATION
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY: "@AFG Povstání Tálibánu" # todo: NEW TRANSLATION
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT: "Historické" # todo: NEW TRANSLATION
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC: "Povstání Tálibánu sílí a slábne běžným tempem." # todo: NEW TRANSLATION
 RULE_AFG_TALIBAN_INSURGENCY_WEAK: "Udržené pod kontrolou" # todo: NEW TRANSLATION
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC: "Tálibán se obnovuje poloviční rychlostí. Protipovstalecké úsilí přináší trvalé výsledky a Afghánistán může povstání realisticky zlikvidovat." # todo: NEW TRANSLATION
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS: "Neúnavné" # todo: NEW TRANSLATION
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC: "Tálibán se obnovuje poloviční rychlostí navíc. Udržení země pohromadě se stává trvalou kampaní, nikoli problémem, který vyřešíte jednou provždy." # todo: NEW TRANSLATION
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING: "@AFG Povstání Severní aliance" # todo: NEW TRANSLATION
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC: "Pokud Tálibán vyhraje občanskou válku, Severní aliance o několik měsíců později znovu povstane pod vedením Ismaila Khana, nebo od roku 2020 pod vedením Ahmada Massouda." # todo: NEW TRANSLATION
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC: "Vítězství Tálibánu je konečné. Na severu se neotevře žádná druhá fronta." # todo: NEW TRANSLATION
 ALG_AI_BEHAVIOR: "@ALG Alžírsko" # todo: NEW TRANSLATION
 RULE_OPTION_ALG_HISTORICAL: "Bouteflikova léta" # todo: NEW TRANSLATION
 RULE_OPTION_ALG_HISTORICAL_DESC: "Prezidentství uzavírá Černé desetiletí amnestií a sjednocuje §8Frontu národního osvobození§! a její spojence za sebou, dokud pochody §8Hiraku§! nedonutí starého muže odejít. Alžírsko zůstává pilířem arabské a africké diplomacie, zatímco generálové mají doma poslední slovo." # todo: NEW TRANSLATION
 RULE_OPTION_ALG_LE_POUVOIR: "Le Pouvoir přetrvává" # todo: NEW TRANSLATION
 RULE_OPTION_ALG_LE_POUVOIR_DESC: "Prezidentství se nikdy nevymaní z vlivu generálů a §8le pouvoir§! odpovídá na §8Hirak§! zatýkáním namísto reforem. Alžírsko si zachovává civilní fasádu, zatímco bezpečnostní aparát za oponou rozhoduje o všem." # todo: NEW TRANSLATION
 RULE_OPTION_ALG_HIRAK_DEMOCRACY: "Hirak vítězí" # todo: NEW TRANSLATION
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC: "Týdenní pochody nekončí u prezidentství a §8Hirak§! zlomí oligarchy i rozebere le pouvoir. Alžírsko sepíše skutečně civilní ústavu a stane se první opravdovou demokracií v Maghrebu." # todo: NEW TRANSLATION
 RULE_OPTION_ALG_MILITARY_JUNTA: "Generálové přebírají moc" # todo: NEW TRANSLATION
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC: "§8Národní lidová armáda§! ukončí předstírání, pozastaví ústavu a začne Alžírsku vládnout přímo. Země se obrátí dovnitř a její sousedé naleznou na hranici posádkový stát." # todo: NEW TRANSLATION
 RULE_OPTION_ALG_ISLAMIST: "Islamistické Alžírsko" # todo: NEW TRANSLATION
 RULE_OPTION_ALG_ISLAMIST_DESC: "§8Hnutí společnosti za mír§! a §8Ennahda§! zvítězí u voleb místo v maquis a prostřednictvím parlamentu, soudů a mešity vybudují islámskou republiku. Alžírsko se stane hlasem politického islámu v celé severní Africe." # todo: NEW TRANSLATION
 RULE_OPTION_ALG_FIS_UPRISING: "Fronta spásy se vrací" # todo: NEW TRANSLATION
 RULE_OPTION_ALG_FIS_UPRISING_DESC: "§8Islámská fronta spásy§! nebude nikdy potlačena a získá volební vítězství, o které ji armáda připravila. Černé desetiletí skončí za podmínek povstalců a Alžírsko se stane základnou ozbrojeného islamismu v celém Sahelu." # todo: NEW TRANSLATION
 ARM_AI_BEHAVIOR: "@ARM Armenia" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_HISTORICAL: "Karabašský klan" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_HISTORICAL_DESC: "Veteráni karabašské války drží dvě desetiletí prezidentství za podpory §8Republikánské strany Arménie§!, dokud ulice zemi nakonec nepředají §8Straně občanské smlouvy§!. Arménie zůstává kvůli své bezpečnosti spojena s Moskvou, zatímco se s Baku přetahuje o hory." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_TER_PETROSIAN: "První prezident se vrací" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_TER_PETROSIAN_DESC: "§8Arménský národní kongres§! vrátí zakládajícího prezidenta, kterého generálové vyhnali, a karabašští muži se nikdy nedostanou ke slovu. Arménie vymění hory za otevřené hranice a normální vztahy se sousedy." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_PEOPLES_PARTY: "Lidová strana se vrací" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_PEOPLES_PARTY_DESC: "§8Lidová strana Arménie§! přežije střelbu v parlamentu a převezme stát, o který byla připravena. Arménie se obnoví na sovětském průmyslu a plánování a stane se nejspolehlivějším partnerem Moskvy na Kavkaze." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_TSARUKYAN: "Republika oligarchy" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_TSARUKYAN_DESC: "§8Prosperující Arménie§! si přímo koupí parlament a zemi bude řídit podnikatelovo sídlo místo prezidentského paláce. Arménie se stane bohatou, zkorumpovanou a na prodej kterémukoli hlavnímu městu, které zaplatí nejvíc." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_UNITED_STATES: "Spojené státy Arménie" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_UNITED_STATES_DESC: "§8Strana dědictví§! a diaspora přepíší republiku na federaci s místem vyhrazeným pro každého Arména v zahraničí. Arménie se místo Moskvy obrátí k Los Angeles a Bejrútu kvůli své budoucnosti." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT: "Zakládající parlament" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT_DESC: "Karabašští veteráni ze skupiny §8Sasna Tsrer§! se zmocní republiky, o níž věří, že jim byla ukradena, a vládnou jí jako posádce. Arménie vyžene ruské základny a místo toho požádá Západ o záruky." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_MONARCHY: "Obnovená koruna" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_MONARCHY_DESC: "§8Svaz Meliqů Arménie§! ukončí republiku a v Jerevanu po šesti stoletích poprvé usedne král. Arménie bude vládnout prostřednictvím trůnu a církve a bude si nárokovat každou provincii, kterou kdy držela její stará království." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_DASHNAK_LEFT: "D ř a š n a k s k ý  s o c i a l i s m u s" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_DASHNAK_LEFT_DESC: "Socialistické křídlo §8Arménské revoluční federace§! zvítězí ve stranickém sporu a obnoví republiku na jejím zakládajícím krédu. Arménie znárodní majetky oligarchů a postaví se proti každé říši, na kterou narazí." # todo: NEW TRANSLATION
 RULE_OPTION_ARM_DASHNAK_RIGHT: "Odkaz fedajínů" # todo: NEW TRANSLATION
 RULE_OPTION_ARM_DASHNAK_RIGHT_DESC: "Nacionalistické křídlo §8Arménské revoluční federace§! převezme stranu a bude vládnout jménem horských bojovníků. Arménie se vyzbrojí pro země, o které přišla, a nebude skrývat touhu získat je zpět." # todo: NEW TRANSLATION
 BHR_AI_BEHAVIOR: "@BHR Bahrain" # todo: NEW TRANSLATION
 RULE_OPTION_BHR_HISTORICAL: "Charta Ál Chalífy" # todo: NEW TRANSLATION
 RULE_OPTION_BHR_HISTORICAL_DESC: "Koruna koupí mír národní chartou a volenou komorou, poté pomocí saúdských obrněnců rozbije §8Koalici mládeže 14. února§!, jakmile se náměstí zaplní. Bahrajn zůstává přístavem amerického loďstva a nejspolehlivějším klientem Rijádu." # todo: NEW TRANSLATION
 RULE_OPTION_BHR_DAY_OF_RAGE: "Den hněvu" # todo: NEW TRANSLATION
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC: "§8Al-Wefaq§! udrží náměstí, dokud šíitská většina konečně nebude moci sama odhlasovat vládu, která jí byla vždy upírána. Bahrajn zruší monarchii ve prospěch republiky a bude odpovídat Teheránu místo Rijádu." # todo: NEW TRANSLATION
 RULE_OPTION_BHR_CROWNED_DEMOCRACY: "Ústavní kompromis" # todo: NEW TRANSLATION
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC: "Koruna legalizuje §8Wa'ad§! a jeho soupeře a svěří skutečnému parlamentu správu země, zatímco trůn zůstane nad sporem, nikoli jeho součástí. Bahrajn se stane první fungující demokracií v Zálivu, aniž by kdy opustil západní tábor." # todo: NEW TRANSLATION
 BLR_AI_BEHAVIOR: "@BLR Bělorusko" # todo: NEW TRANSLATION
 BLR_union_state_ai_behavior: "@BLR Chování Státu Unie" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_HISTORICAL: "Poslední diktátor Evropy" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_HISTORICAL_DESC: "Alexander Lukašenko uvězní své soupeře, připoutá ekonomiku k rublu a pomocí pořádkových jednotek rozbije §8Džínovou revoluci§!. Bělorusko zůstane nejbližším spojencem Moskvy a nejizolovanější vládou v Evropě." # todo: NEW TRANSLATION
 RULE_OPTION_BLR_EUROPEAN_BELARUS: "Evropské Bělorusko" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC: "Andrej Sannikov získá prezidentství pro kampaň §8Evropského Běloruska§! a odvrátí zemi od rublu směrem k Bruselu. Bělorusko požádá o členství v NATO a Evropské unii a Rusko přijde o půdu, na kterou spoléhalo západně od Smolenska." # todo: NEW TRANSLATION
 RULE_OPTION_BLR_TIKHANOVSKAYA: "Tichanovské revoluce" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC: "Lukašenko vládne bez odporu celou generaci, dokud ukradené volby nepostaví Svjatlanu Cichanovskou do čela §8Koordinační rady§!, kterou pořádkové jednotky nedokážou rozbít. Bělorusko se obrátí na Západ mnohem později než jeho sousedé, zatímco ruské divize už stojí na hranici." # todo: NEW TRANSLATION
 RULE_OPTION_BLR_POPULAR_FRONT: "Národní obrození" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_POPULAR_FRONT_DESC: "Zianon Pazňak přivede §8Běloruskou lidovou frontu§! k moci s programem bělorusizace, očistí sovětské důstojníky a oživí vzpomínku na Velkoknížectví. Bělorusko se obrátí proti Moskvě a vznese nárok na každého souseda, který kdysi odpovídal Vilniusu." # todo: NEW TRANSLATION
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS: "Národněbolševické povstání" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC: "§8Národní bolševici§! ovládnou ulice a poté i stát a obnoví sovětský pořádek za pomoci dělnické armády a stranických milicí. Bělorusko se s požehnáním Moskvy vyzbrojí proti Polsku, Ukrajině a Pobaltí." # todo: NEW TRANSLATION
 RULE_OPTION_BLR_LITBEL: "Obrození Litbelu" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_LITBEL_DESC: "§8Komunistická strana Běloruska§! se vrátí k moci a učiní ze staré litevsko-běloruské republiky svůj zakládající projekt. Bělorusko přitáhne Litvu a Lotyšsko zpět do socialistického svazu vlivem, kde to půjde, a silou, kde ne." # todo: NEW TRANSLATION
 RULE_OPTION_BLR_OLIGARCHY: "Oligarchův obchod" # todo: NEW TRANSLATION
 RULE_OPTION_BLR_OLIGARCHY_DESC: "Siarhej Hajdukievič a §8Liberálně demokratická strana§! vymění Lukašenkovu ideologii za otevřenější podnikání a prodají přístup k Moskvě za nejlepší cenu, jakou dokážou získat. Bělorusko zůstane na oběžné dráze Ruska, ale Svazový stát bude považovat za smlouvu, nikoli za krédo." # todo: NEW TRANSLATION
 BLR_WONT_FOLLOW_UNION_STATE: "Nedodržovat Stát Unie" # todo: NEW TRANSLATION
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "Bělorusko nevybuduje Stát Unie a nestane se ruskou loutkou." # todo: NEW TRANSLATION
 BLR_WILL_FOLLOW_UNION_STATE: "Formovat Stát Unie" # todo: NEW TRANSLATION
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "Bělorusko se pokusí vytvořit Stát Unie. Zpočátku se stane ruskou loutkou, ale později..." # todo: NEW TRANSLATION
 BOS_AI_BEHAVIOR: "@BOS Bosna a Hercegovina" # todo: NEW TRANSLATION
 RULE_OPTION_BOS_HISTORICAL: "Daytonský řád" # todo: NEW TRANSLATION
 RULE_OPTION_BOS_HISTORICAL_DESC: "Rotující prezidentství pod mezinárodním dohledem vydrží a §8Strana demokratické akce§! se podělí o stát se svými srbskými a chorvatskými soupeři, místo aby je porazila. Bosna se obnoví za NATO a evropskými mírovými jednotkami a přiblíží se Bruselu, aniž by kdy vyřešila, čím vlastně země je." # todo: NEW TRANSLATION
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "Republika srbská přebírá předsednictví" # todo: NEW TRANSLATION
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "§8Aliance nezávislých sociálních demokratů§! zvítězí v prezidentských volbách a obrátí Sarajevo k Bělehradu a Moskvě, přičemž federaci ponechá nedotčenou. Bosna opustí západní oběžnou dráhu dohodou, nikoli silou, a Rusko získá druhou oporu na Balkáně." # todo: NEW TRANSLATION
 RULE_OPTION_BOS_SRPSKA_UNION: "Republika srbská na prvním místě" # todo: NEW TRANSLATION
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "§8Srbská demokratická strana§! centralizuje celou zemi pod Banja Lukou a vyjedná svaz se Srbskem. Bosna bude začleněna do většího srbského státu a její sousedé se probudí k překreslené mapě." # todo: NEW TRANSLATION
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "Bosňácké probuzení" # todo: NEW TRANSLATION
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "Bosňácká křivda ztvrdne v náboženské obrození a §8Národní probuzení§! znovu vyzbrojí republiku, aby dokončila válku podle vlastních podmínek. Bosna pošle mírové jednotky domů a obrátí se nejprve proti svým entitám a poté proti sousedům." # todo: NEW TRANSLATION
 RULE_OPTION_BOS_WORKERS_STATE: "Dělnické rady" # todo: NEW TRANSLATION
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "Masová nezaměstnanost vynese §8Dělnickou frontu§! nad etnické strany a bosenský průmysl přejde do rukou rad lidí, kteří v něm pracují. Stát se stane sekulárním a samosprávným a nebude odpovídat ani Bruselu, ani Bělehradu." # todo: NEW TRANSLATION
 BOT_AI_BEHAVIOR: "@BOT Botswana" # todo: NEW TRANSLATION
 RULE_OPTION_BOT_HISTORICAL: "BDP přetrvává" # todo: NEW TRANSLATION
 RULE_OPTION_BOT_HISTORICAL_DESC: "§8Botswanská demokratická strana§! předává prezidentství od jednoho svého člena k druhému a vyhrává každé volby, do nichž kandiduje, zatímco příjmy z diamantů financují školy, kliniky a boj proti AIDS. Botswana zůstává tichým úspěchem kontinentu, nezúčastněná, solventní a ochotná nahlas říct to, co její sousedé ne." # todo: NEW TRANSLATION
 RULE_OPTION_BOT_POLITICAL_RAINBOW: "Deštník se otevírá" # todo: NEW TRANSLATION
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC: "Opozice přestane dělit hlasy a sjednotí se za §8Deštníkem pro demokratickou změnu§!, čímž prolomí sevření, které §8Botswanská demokratická strana§! drží od získání nezávislosti. Botswana zažije první změnu vlády a jižní Afrika získá důkaz, že osvobozeneckou stranu lze porazit ve volbách." # todo: NEW TRANSLATION
 RULE_OPTION_BOT_KGOSIKGOLO: "Korunovace Kgosikgola" # todo: NEW TRANSLATION
 RULE_OPTION_BOT_KGOSIKGOLO_DESC: "§8Dikgosi§! promění Sněmovnu náčelníků z poradní komory v sídlo moci a pozvednou jednoho ze svých řad na nejvyššího náčelníka celé země. Volby ustoupí tradiční monarchii a modelová demokracie kontinentu se stane něčím, co její sousedé již nepoznávají." # todo: NEW TRANSLATION
 RULE_OPTION_BRA_HISTORICAL: "Lulova léta" # todo: NEW TRANSLATION
 RULE_OPTION_BRA_HISTORICAL_DESC: "§8Dělnická strana§! konečně zvítězí v prezidentských volbách a spojí finanční převody chudým s ortodoxními financemi, dokud korupční vyšetřování nevyprázdní levici a nepředá palác bývalému armádnímu kapitánovi. Brazílie vyroste v žádanou střední mocnost, která se přetahuje s Washingtonem, aniž by kdy opustila jeho oběžnou dráhu." # todo: NEW TRANSLATION
 RULE_OPTION_BRA_BROAD_FRONT: "Nová Brazílie" # todo: NEW TRANSLATION
 RULE_OPTION_BRA_BROAD_FRONT_DESC: "§8Dělnická strana§! vládne prostřednictvím široké koalice s §8Brazilským demokratickým hnutím§! a menší levicí a na korupční skandály odpoví reformou místo ústupu. Brazílie zůstane ústavní demokracií a stane se kotvou Jižní Ameriky, která již nehledí na sever pro svolení." # todo: NEW TRANSLATION
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC: "Rudá republika" # todo: NEW TRANSLATION
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC: "§8Dělnická strana§! přestane sdílet moc, pohltí své levicové soupeře a přepíše stát kolem sebe. Brazílie vyhlásí socialistickou republiku a bude tento model vyvážet každému sousedovi ochotnému jej přijmout." # todo: NEW TRANSLATION
 RULE_OPTION_BRA_LIBERALS: "Liberální řád" # todo: NEW TRANSLATION
 RULE_OPTION_BRA_LIBERALS_DESC: "§8Brazilská strana sociální demokracie§! udrží prezidentství, které již ovládá, a dotáhne privatizaci i inflační cílování do konce. Brazílie se stane nejotevřenější ekonomikou kontinentu a nejstabilnějším americkým partnerem jižně od rovníku." # todo: NEW TRANSLATION
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS: "Sociální demokraté" # todo: NEW TRANSLATION
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC: "§8Brazilská strana sociální demokracie§! bude vládnout společně s §8Demokratickou dělnickou stranou§! a odkloní se od tržní ortodoxie k rozvojovému státu se sociální záchrannou sítí. Brazílie bude investovat do průmyslu a škol místo do úroků a udrží si odstup od Washingtonu i Pekingu." # todo: NEW TRANSLATION
 RULE_OPTION_BRA_MILITARY_RULE: "Kapitánova republika" # todo: NEW TRANSLATION
 RULE_OPTION_BRA_MILITARY_RULE_DESC: "§8Sociálně liberální strana§! převezme prezidentství, bude oslavovat starou diktaturu a rozpustí kongres, který jí stojí v cestě. Brazílii bude znovu vládnuto dekrety z kasáren a země bude prosazovat své nároky proti socialistickým vládám na hranicích." # todo: NEW TRANSLATION
 RULE_OPTION_BRA_MONARCHY: "Obnovené císařství" # todo: NEW TRANSLATION
 RULE_OPTION_BRA_MONARCHY_DESC: "§8Monarchistické§! obrození promění nacionalistické prezidentství v korunovaci a rod Orléans-Braganza se vrátí na trůn prázdný více než století. Brazílie zruší volby, obnoví nárok na starou provincii Cisplatina a znovu se podřídí koruně." # todo: NEW TRANSLATION
 RULE_OPTION_BUL_HISTORICAL: "Cesta do Bruselu" # todo: NEW TRANSLATION
 RULE_OPTION_BUL_HISTORICAL_DESC: "§8Svaz demokratických sil§! udrží pohromadě měnovou radu a reformní program a každá následující vláda ponechá na stole stejné dvě žádosti. Bulharsko vstoupí do NATO a poté do Evropské unie a poskytne alianci nejtišší hranici na Balkáně." # todo: NEW TRANSLATION
 RULE_OPTION_BUL_TSARIST_RESTORATION: "Car se vrací" # todo: NEW TRANSLATION
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC: "Exilový §8rod Sasko-kobursko-gothajský§! se vrátí k něčemu víc než premiérství, sjednotí nacionalistickou pravici za korunou a bude vládnout vlastním jménem. Bulharsko vymění západní žádosti za hranice slíbené v San Stefanu a jeho sousedé naleznou makedonskou otázku znovu otevřenou." # todo: NEW TRANSLATION
 RULE_OPTION_BUL_RED_BALKAN: "Sen rudého Balkánu" # todo: NEW TRANSLATION
 RULE_OPTION_BUL_RED_BALKAN_DESC: "§8Komunistická strana Bulharska§! povstane z trosek transformace a převezme stát, který §8Bulharská socialistická strana§! odmítla znovu získat. Bulharsko se obrátí k Moskvě a Pekingu a začne z Balkánu budovat socialistickou federaci." # todo: NEW TRANSLATION
 RULE_OPTION_CAN_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_CAN_HISTORICAL_DESC: "§8Liberální strana§! vládne ze středu, zachovává oba zakládající jazyky ve správním aparátu federace a odpovídá Quebecu zákonem o jasnosti místo ústupků. Kanada zůstane v NATO i severoamerickém obchodním prostoru a bude nejstabilnějším sousedem Washingtonu." # todo: NEW TRANSLATION
 RULE_OPTION_CAN_FRENCH_CANADA: "Francouzská Kanada" # todo: NEW TRANSLATION
 RULE_OPTION_CAN_FRENCH_CANADA_DESC: "§8Québecký blok§! promění jazykovou křivdu ve federální program, učiní francouzštinu jediným jazykem státu a přesune sídlo vlády do Québecu. Anglicky mluvící Kanada se ocitne menšinou ve vlastním hlavním městě a unie bude držet pohromadě zákonem, nikoli souhlasem." # todo: NEW TRANSLATION
 RULE_OPTION_CAN_ARMED_NEUTRALITY: "Skutečný Sever sám" # todo: NEW TRANSLATION
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC: "Kanada vystoupí z NATO, ukončí své zahraniční závazky a úspory vloží do domácí ekonomiky a soběstačného obranného průmyslu. Severní křídlo aliance ztichne a Washington přijde o druhou armádu na vlastním kontinentu." # todo: NEW TRANSLATION
 RULE_OPTION_CAN_NATIONALIST: "Nacionalistický převrat" # todo: NEW TRANSLATION
 RULE_OPTION_CAN_NATIONALIST_DESC: "§8Kanada na prvním místě§! se sveze do úřadu na troskách ústavního pořádku, pozastaví volby a odpoví Québecu i rezervacím mimořádnými pravomocemi. Kanada se obrátí proti vlastnímu kontinentu a nejdelší nebráněná hranice na světě bude opevněna ze severní strany." # todo: NEW TRANSLATION
 RULE_OPTION_CAN_EASTERN_REALIGNMENT: "Arktický most" # todo: NEW TRANSLATION
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC: "Ottawa opustí NATO a místo Washingtonu prodá své arktické trasy, přístavy a zdroje Moskvě a Pekingu. Kanada se stane severním koncem rusko-čínské sféry a Spojené státy procitnou k rivalovi na vlastním kontinentu." # todo: NEW TRANSLATION
 CAS_AI_BEHAVIOR: "@CSA Southern Republic Of America" # todo: NEW TRANSLATION
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "Odpor Skalnatých hôr" # todo: NEW TRANSLATION
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "Olympia přenechá nepokoje v idahském výběžku místním šerifům a §8Odboj ve Skalnatých horách§! je přeroste, až horské okresy povstanou za nezávislost. Kaskádie bude muset čelit odtržení ve vlastním zapadlém kraji §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "Mír v našem čase" # todo: NEW TRANSLATION
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "Olympia vyšle na východ zvláštní vyšetřovací jednotku, aby převzala protipovstalecké úsilí, a pořádek se vrátí, dokud vedení §8Odboje ve Skalnatých horách§! samo hnutí nerozpustí. Kaskádie vyjde z krize celistvá a klidná §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 CHE_AI_BEHAVIOR: "@CHE Čečensko" # todo: NEW TRANSLATION
 RULE_OPTION_CHE_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_CHE_HISTORICAL_DESC: "Druhá válka skončí zničením §8Ičkerie§! a opětovným začleněním republiky do Ruska pod Kadyrovy. Čečensko vymění nezávislost za peníze na obnovu a stane se nejspolehlivějším vykonavatelem Moskvy na Kavkaze." # todo: NEW TRANSLATION
 RULE_OPTION_CHE_CALIPHATE: "Kavkazský emirát" # todo: NEW TRANSLATION
 RULE_OPTION_CHE_CALIPHATE_DESC: "Zahraniční §8mudžáhidé§! odsunou sekulární separatisty stranou a budou vládnout tomu, co z republiky přežije, podle šaríi. Čečensko se stane útočištěm pro §8al-Káidu§! a odrazovým můstkem džihádu napříč Kavkazem i samotným Ruskem." # todo: NEW TRANSLATION
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION: "Kavkazská konfederace" # todo: NEW TRANSLATION
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC: "Sekulární důstojníci porazí §8islamisty§! a obnoví Ičkerii jako jádro svazu národů Severního Kavkazu. Čečensko se opře o Ankaru a Baku, aby získalo váhu potřebnou k udržení Moskvy mimo hory." # todo: NEW TRANSLATION
 RULE_OPTION_CHE_WESTERN_ALIGNMENT: "Uznání ze Západu" # todo: NEW TRANSLATION
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC: "§8Islamisté§! budou vytlačeni a republika bude svou nezávislost trávit hledáním uznání v západních metropolích místo spojenců v horách. Čečensko si koupí přežití demokratickým kreditem a místem u evropského stolu." # todo: NEW TRANSLATION
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS: "Rudý Kavkaz" # todo: NEW TRANSLATION
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC: "Frakce §8Salmana Radueva§! převezme republiku a spojí islám se sovětským řádem, na který si hory stále pamatují. Čečensko vyhlásí kavkazskou socialistickou republiku a s Moskvou se vyrovná jako rovný s rovným, nikoli jako podřízený." # todo: NEW TRANSLATION
 RULE_OPTION_CHI_HISTORICAL: "Velké omlazení" # todo: NEW TRANSLATION
 RULE_OPTION_CHI_HISTORICAL_DESC: "§8Šanghajská klika§! předá stranu §8Tuanpaj§! a Tuanpaj Si Ťin-pchingovi, načež bude postupně rozebrána i autonomie Hongkongu. Peking bude prosazovat své nároky v Jihočínském moři a přes průliv, aniž by kvůli nim šel do války." # todo: NEW TRANSLATION
 RULE_OPTION_CHI_HEGEMON: "Obnovená Říše středu" # todo: NEW TRANSLATION
 RULE_OPTION_CHI_HEGEMON_DESC: "§8Čchungčchingský model§! vynese Po Si-laje do vedení a §8Vlkům bojovníkům§! bude brzy sundán řetěz. Čína vyřeší himálajskou hranici silou, přivede Bhútán, Nepál a Indii k poslušnosti a dobude Tchaj-wan útokem." # todo: NEW TRANSLATION
 RULE_OPTION_CHI_PEACEFUL_RISE: "Mírový vzestup" # todo: NEW TRANSLATION
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC: "Ceng Čching-chung zdědí Ťiangův stroj a §8šanghajští technokraté§! se budou držet Tengovy cesty. Jedna země, dva systémy bude dodržováno, Tibet a Sin-ťiang budou spravovány zákonem místo kampaní a sjednocení bude hledáno u vyjednávacího stolu." # todo: NEW TRANSLATION
 COM_AI_BEHAVIOR: "@COM Komory" # todo: NEW TRANSLATION
 RULE_OPTION_COM_HISTORICAL: "Svaz Komor" # todo: NEW TRANSLATION
 RULE_OPTION_COM_HISTORICAL_DESC: "Azali Assoumani vymění uniformu za volební urnu, každý ostrov získá prezidenta a předsednictví svazu se mezi nimi bude střídat, zatímco jednotky Africké unie vezmou Anjouan zpět jeho plukovníkovi. §8Konvent pro obnovu Komor§! vyhraje a poté pokojně ztratí moc a souostroví konečně přestane svrhávat samo sebe." # todo: NEW TRANSLATION
 RULE_OPTION_COM_MILITARY_DICTATORSHIP: "Plukovník zůstává" # todo: NEW TRANSLATION
 RULE_OPTION_COM_MILITARY_DICTATORSHIP_DESC: "Azali si ponechá prezidentství, které získal v uniformě, stáhne ostrovy zpět pod Moroni a nechá rotaci zemřít dříve, než se dostane k někomu dalšímu. Komory se vzdálí francouzské oběžné dráze a obrátí se k Pekingu a Africké unii pro uznání, které jim Paříž již nenabízí." # todo: NEW TRANSLATION
 RULE_OPTION_COM_ORANGE_PARTY: "Nadvláda Oranžových" # todo: NEW TRANSLATION
 RULE_OPTION_COM_ORANGE_PARTY_DESC: "§8Oranžová strana§! Mohameda Daoudoua převezme Moroni a bude souostroví řídit jako technokracii založenou na zásluhách, rozbije pašerácké kruhy a profesionalizuje ministerstva. Komory se nabídnou západnímu kapitálu jako jediný mikrostát Indického oceánu, jehož dokumentům lze věřit." # todo: NEW TRANSLATION
 RULE_OPTION_COM_ISLAMIC_REPUBLIC: "Arabská republika" # todo: NEW TRANSLATION
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC: "Mešitní výbory vynesou Ahmeda Abdallaha Mohameda Sambiho do prezidentského úřadu a §8baasistické hnutí§! přetvoří ostrovy v arabskou republiku. Přístavy budou znárodněny, Damašek a Bagdád nahradí Paříž a Komory se stanou hlasem Arabské ligy v Mosambickém průlivu." # todo: NEW TRANSLATION
 RULE_OPTION_COM_WARRIOR_KING: "Válečný král" # todo: NEW TRANSLATION
 RULE_OPTION_COM_WARRIOR_KING_DESC: "Robert Denard se naposledy vrátí na ostrovy a §8Prezidentská garda§! mu bez jediného výstřelu předá palác. Komory přestanou být zemí s armádou a stanou se armádou s vlajkou k pronájmu, která bude prodávat své žoldnéře po celé Africe." # todo: NEW TRANSLATION
 CUB_AI_BEHAVIOR: "@CUB Kuba" # todo: NEW TRANSLATION
 RULE_OPTION_CUB_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_CUB_HISTORICAL_DESC: "Fidel předá prezidentství svému bratrovi a §8Komunistická strana Kuby§! udrží ostrov jako stát jedné strany, povolí drobné podnikání a kvůli ropě se bude ucházet o Caracas a Moskvu. Embargo trvá, zvláštní období nikdy zcela neskončí a Havana zůstane nepohodlnou výjimkou na Washingtonově polokouli." # todo: NEW TRANSLATION
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "Fidel otevírá ostrov" # todo: NEW TRANSLATION
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "Castro sám rozebere direktivní ekonomiku, povolí banky, obnoví církev a sepíše ústavu, která připustí soupeřící strany pod vedením §8pro-západního křídla Komunistické strany§!. Havana s Washingtonem vyřeší otázku Guantánama, uzná Tchaj-pej a nakonec bude cvičit po boku NATO." # todo: NEW TRANSLATION
 RULE_OPTION_CUB_DIAZ_CANEL: "Tání za Díaze-Canela" # todo: NEW TRANSLATION
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "Miguel Díaz-Canel převezme palác před Raúlem, odblokuje §8Kubánskou liberální unii§! a vyhlásí první soutěživé volby od revoluce. Cenzura bude zrušena, zahraniční kapitál se vrátí a Kuba se bez jediného výstřelu stane obyčejnou karibskou republikou." # todo: NEW TRANSLATION
 RULE_OPTION_CUB_NEW_SOCIALISM: "Druhá revoluce" # todo: NEW TRANSLATION
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "Díaz-Canel v polovině opouštění ustoupí, obnoví stát jedné strany kolem mladšího kádru a začne otevřeně obchodovat s Pchjongjangem. Kuba vstoupí do ODKB a vrátí Rusku jeho základny, čímž postaví ruskou posádku devadesát mil od Floridy." # todo: NEW TRANSLATION
 RULE_OPTION_CUB_NATIONALIST: "Kuba Kubáncům" # todo: NEW TRANSLATION
 RULE_OPTION_CUB_NATIONALIST_DESC: "§8Kubánská falanga§! se zmocní státu, očistí komunisty i demokraty a přebuduje armádu kolem mládežnického pracovního sboru. Havana poté prohlásí celou pánev za své dědictví a Haiti, Jamajka i šíje budou postupně anektovány." # todo: NEW TRANSLATION
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "Obnovená republika" # todo: NEW TRANSLATION
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "§8Kubánská demokratická sociálně-revoluční strana§! získá moc, propustí politické vězně a přepíše ústavu kolem vícestranického parlamentu. Kuba pak pozve své sousedy do karibské federace místo toho, aby je dobyla." # todo: NEW TRANSLATION
 RULE_OPTION_CZE_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_CZE_HISTORICAL_DESC: "§8Čeští sociální demokraté§! a §8Občanská demokratická strana§! si mezi sebou vyměňují vládu, zatímco země zapadá do NATO a Evropské unie a Škoda mění Mladou Boleslav v exportní centrum. Praha posílá své vojáky na Balkán a do Afghánistánu a stává se pohodlným, nevýrazným členem západního bloku." # todo: NEW TRANSLATION
 RULE_OPTION_CZE_COMMUNISM: "Komunisté se vracejí" # todo: NEW TRANSLATION
 RULE_OPTION_CZE_COMMUNISM_DESC: "§8Komunistická strana Čech a Moravy§! promění hněv z privatizace ve vládní většinu a zaměří ministerstva na muže, kteří prodali továrny. Česká republika vystoupí z NATO, začne se ucházet o Moskvu a Peking a znovu otevře hraniční otázky, o nichž si sousedé mysleli, že jsou vyřešené." # todo: NEW TRANSLATION
 RULE_OPTION_CZE_MONARCHY_KING: "Habsburská koruna" # todo: NEW TRANSLATION
 RULE_OPTION_CZE_MONARCHY_KING_DESC: "§8Koruna Česká§! vyroste ze zvláštnosti v největší stranu, vyndá korunovační klenoty z úschovy a povolá Karla von Habsburga domů ke korunovaci. České země se znovu stanou královstvím a začnou spojovat Vídeň a Budapešť do monarchistického bloku ve střední Evropě." # todo: NEW TRANSLATION
 RULE_OPTION_CZE_MONARCHY_PRESIDENT: "Korunovaná republika" # todo: NEW TRANSLATION
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC: "§8Koruna Česká§! přesvědčí zemi, aby se vrátila ke starému řádu, ale ponechá volební urny a dosadí monarchistickou hlavu státu volenou namísto dědičné. Česká republika si ponechá parlament i evropské partnery a přestaví se kolem trůnu, církve a regionu." # todo: NEW TRANSLATION
 RULE_OPTION_DEN_HISTORICAL: "Foghova léta" # todo: NEW TRANSLATION
 RULE_OPTION_DEN_HISTORICAL_DESC: "§8Venstre§! a §8sociální demokraté§! si mezi sebou vyměňují Christiansborg, zatímco Dánsko zachová své výjimky, odmítne euro a vyšle vojáky na Balkán, do Iráku a Afghánistánu. Kodaň se stane nejochotnějším malým spojencem Washingtonu v Evropě a nechá Unii prohlubovat se bez sebe." # todo: NEW TRANSLATION
 RULE_OPTION_DEN_EUROPEAN_UNION: "V srdci Evropy" # todo: NEW TRANSLATION
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC: "§8Sociální liberálové§! a §8sociální demokraté§! prosadí druhé referendum a využijí dánské výjimky k získání místa ve středu Unie. Koruna ustoupí euru a Kodaň se připoutá k Berlínu a Paříži místo k Washingtonu." # todo: NEW TRANSLATION
 RULE_OPTION_DEN_EUROSCEPTIC: "Mimo Unii" # todo: NEW TRANSLATION
 RULE_OPTION_DEN_EUROSCEPTIC_DESC: "§8Dánská lidová strana§! vynutí otázku, kterou staré strany stále odkládají, a Dánsko vystoupí ze Schengenu a poté i ze samotné Unie. Severská obranná spolupráce nahradí Brusel a zbytek Skandinávie bude požádán, aby si vybral stranu." # todo: NEW TRANSLATION
 RULE_OPTION_DEN_SOCIALIST: "Rudý prapor nad Christiansborgem" # todo: NEW TRANSLATION
 RULE_OPTION_DEN_SOCIALIST_DESC: "§8Rudo-zelená aliance§! a odbory promění sociální stát v dělnický stát a postaví rady nad Folketing. Dánsko opustí alianci i Unii, obrátí se za přáteli na východ a nabídne zbytku Severu revoluci." # todo: NEW TRANSLATION
 RULE_OPTION_DEN_MONARCHIST: "Obnovená koruna" # todo: NEW TRANSLATION
 RULE_OPTION_DEN_MONARCHIST_DESC: "Dvůr přestane předstírat, že je ceremoniální, a §8Dánská lidová strana§! prosadí případ koruny parlamentem, který ztratil trpělivost země. Panovník znovu převezme pravomoci odstraněné ústavou a Grónsko i Faerské ostrovy pevně stáhne pod ruku Kodaně." # todo: NEW TRANSLATION
 RULE_OPTION_DEN_NATIONALIST: "Dánsko Dánům" # todo: NEW TRANSLATION
 RULE_OPTION_DEN_NATIONALIST_DESC: "§8Dánská lidová strana§! převezme vládu, kterou dosud jen podporovala, a učiní z přistěhovalectví a kontroly hranic celou dánskou politiku. Dánsko opustí alianci i Severskou radu a začne prosazovat nároky, které nevzneslo od středověku." # todo: NEW TRANSLATION
 EGY_AI_BEHAVIOR: "@EGY Egypt" # todo: NEW TRANSLATION
 RULE_OPTION_EGY_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_EGY_HISTORICAL_DESC: "Egypt řídí §8Národnědemokratická strana§!, dokud jej náměstí nevyprázdní, předá jediné období §8Muslimskému bratrstvu§! a poté vrátí prezidentství generálům. Mír s Izraelem vydrží, americká pomoc bude proudit dál a Káhira bude mluvit za arabský řád, nikoli proti němu." # todo: NEW TRANSLATION
 RULE_OPTION_EGY_BROTHERHOOD: "Bratrstvo se udrží" # todo: NEW TRANSLATION
 RULE_OPTION_EGY_BROTHERHOOD_DESC: "Egypt si ponechá svou zvolenou vládu §8Muslimského bratrstva§!, koupí si důstojníky místo jejich očištění a sepíše islamistickou ústavu, kterou soudy nedokážou zvrátit. Káhira se přikloní k Ankaře, Dauhá a Hamásu a monarchie Zálivu ji začnou považovat za hrozbu." # todo: NEW TRANSLATION
 RULE_OPTION_EGY_PAN_ARAB: "Následníci Násira" # todo: NEW TRANSLATION
 RULE_OPTION_EGY_PAN_ARAB_DESC: "Egypt vrátí §8Národní frontu§! k moci, znárodní rozhodující odvětví a obnoví Sjednocenou arabskou republiku. Káhira se bude ucházet o Damašek, Bagdád a Tripolis a obrátí se zády k Washingtonu." # todo: NEW TRANSLATION
 RULE_OPTION_EGY_SALAFIST: "Salafistický obrat" # todo: NEW TRANSLATION
 RULE_OPTION_EGY_SALAFIST_DESC: "Egypt dosadí §8Stranu an-Núr§! do prezidentského paláce, pozastaví volby a bude vládnout podle náboženského práva. Šaría bude spravovat Kopt y jako chráněnou menšinu a sinajská kampaň se stane svatou válkou." # todo: NEW TRANSLATION
 RULE_OPTION_EGY_COPTIC: "Koptská nadvláda" # todo: NEW TRANSLATION
 RULE_OPTION_EGY_COPTIC_DESC: "Egypt převezme §8Koptská církev§! a její laičtí spojenci, kteří budou místo arabského dědictví prosazovat dědictví faraonů. Káhira bude chránit křesťany od Palestiny po Asýrii a ocitne se izolovaná ve vlastním regionu." # todo: NEW TRANSLATION
 RULE_OPTION_EST_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_EST_HISTORICAL_DESC: "§8Reformní strana§! prosazuje radikální deregulaci a rovnou daň, zatímco buduje digitální stát založený na národní online identitě. Estonsko vstupuje do NATO a Evropské unie jako západní kotva v Baltu a trvalá protiváha ruskému vlivu." # todo: NEW TRANSLATION
 RULE_OPTION_EST_CONSERVATIVE: "Tradiční Estonsko" # todo: NEW TRANSLATION
 RULE_OPTION_EST_CONSERVATIVE_DESC: "§8Isamaa§! výrazně investuje do školství a rodinné péče, poskytuje podnikům daňové úlevy a zavádí cílené programy zaměstnanosti. Estonsko zůstává západní a proevropské, ale společensky se uzavírá, zpřísňuje imigrační politiku a staví ochranu kultury před kosmopolitismus." # todo: NEW TRANSLATION
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC: "Severský model" # todo: NEW TRANSLATION
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC: "§8Sociálnědemokratická strana§! buduje sociální stát severského typu založený na minimálních mzdách, posílených odborech a státem řízených průmyslových investicích. Estonsko si zachovává západní orientaci, ale připojuje se k Evropě jako sociální demokracie hájící práva pracujících a rovnost na pracovišti." # todo: NEW TRANSLATION
 RULE_OPTION_EST_CENTRIST: "Východní rovnováha" # todo: NEW TRANSLATION
 RULE_OPTION_EST_CENTRIST_DESC: "§8Strana středu§! opouští estonský atlantický směr, obnovuje obchod s Ruskem a získává ruskojazyčnou menšinu, zatímco usiluje o unii s Lotyšskem a Litvou. Estonsko se stává neutrálním mostem mezi Východem a Západem a Pobaltí přichází o svého nejpevnějšího zastánce NATO." # todo: NEW TRANSLATION
 RULE_OPTION_EST_NATIONALIST: "Estonsko na prvním místě" # todo: NEW TRANSLATION
 RULE_OPTION_EST_NATIONALIST_DESC: "§8EKRE§! se ujímá moci, zabavuje státní zdroje a odstraňuje proevropské strany i jejich sympatizanty z veřejného života. Estonsko se odvrací od evropské integrace, mohutně zbrojí a vznáší nároky vůči Lotyšsku, Litvě, Finsku a Švédsku, čímž mění Balt v ohnisko konfliktu." # todo: NEW TRANSLATION
 ETH_AI_BEHAVIOR: "@ETH Ethiopia" # todo: NEW TRANSLATION
 RULE_OPTION_ETH_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_ETH_HISTORICAL_DESC: "Etiopie posiluje svou Federativní demokratickou republiku pokrokem ve zdravotnictví, školství a náboženských svobodách. Koalice §8EPRDF§! zachovává politickou kontinuitu a zároveň prohlubuje spolupráci s Africkou unií." # todo: NEW TRANSLATION
 RULE_OPTION_ETH_MONARCHIST_RESTORATION: "Návrat koruny" # todo: NEW TRANSLATION
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC: "Etiopie obnovuje §8Korunní radu Etiopie§! a zve Zera Yacoba Amhu Selassieho na trůn. Císařská moc se znovu prosazuje, zatímco úloha parlamentu slábne a je obnoven nárok na Eritreu." # todo: NEW TRANSLATION
 RULE_OPTION_ETH_DERG_RESTORATION: "Návrat Dergu" # todo: NEW TRANSLATION
 RULE_OPTION_ETH_DERG_RESTORATION_DESC: "Etiopie rehabilituje Mengistu Haile Mariama a obnovuje komunistickou vládu pod §8Lidovou demokratickou republikou Etiopie§!. Země se orientuje na Čínu a usiluje o panafrickou komunistickou solidaritu." # todo: NEW TRANSLATION
 FIJ_AI_BEHAVIOR: "@FIJ Fidži" # todo: CHANGED
 RULE_OPTION_FIJ_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_HISTORICAL_DESC: "Armáda odstraňuje zvolenou vládu §8Sjednocené fidžijské strany§! a nahrazuje ji administrativou podporovanou armádou. Na ostrovy se vrací stabilita, ale konečná moc spočívá v kasárnách a volby zůstávají pozastaveny." # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_COUP_AVERTED: "Odvrácený převrat" # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_COUP_AVERTED_DESC: "Napětí mezi vládou a armádou je zažehnáno dříve, než může kdokoli svrhnout vládu, a §8Fidžijská labouristická strana§! nastupuje k moci se středolevým mandátem. Programu dominuje usmíření a veřejné investice a Fidži si udržuje civilní vládu, nad níž už jeho sousedé zlomili hůl." # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_MILITARY_JUNTA: "Republika důstojníků" # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC: "Radikálové z §8Fidžijských vojenských sil§! jdou dále, než převrat původně požadoval, a formalizují otevřenou vojenskou vládu, která v rámci stanného práva slučuje policii s armádou. Politika se řídí z kasáren a Pacifik získává otevřeně militarizovaný stát v srdci svých námořních tras." # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_RESTORED_KINGDOM: "Obnovená koruna" # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC: "§8Velká rada náčelníků§! krizi zvládá a obnovuje Fidži jako království s voleným monarchou. Základem státu se stávají náčelnické tradice a domorodé elity řeší etnickou otázku podle vlastních představ." # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_TECHNOCRACY: "Vláda inženýrů" # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_TECHNOCRACY_DESC: "Zemi přebírá rada inženýrů, plánovačů a administrátorů a vládne podle technokratické ústavy. Stranickou politiku nahrazují automatizace a průmyslové plánování a Fidži se vydává překonat rozvojem všechny ekonomiky v regionu." # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_EARLY_JUNTA: "Kasárna zasahují předčasně" # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC: "Krize s rukojmími na přelomu tisíciletí není nikdy zvládnuta a §8Fidžijské vojenské síly§! přebírají zemi, zatímco je parlament stále obléhán. Militarizovaná společnost se upevňuje o několik let dříve a region sleduje, jak se zvyk na převrat zakořeňuje předčasně." # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_EARLY_KINGDOM: "Předčasný návrat koruny" # todo: NEW TRANSLATION
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC: "Krize s rukojmími na přelomu tisíciletí končí tím, že §8Velká rada náčelníků§! povyšuje voleného krále, nikoli návratem k republice. Monarchie je obnovena o celou politickou generaci dříve a druhá krize, která by následovala, nikdy nepřijde." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_HISTORICAL: "Historická" # todo: CHANGED
 RULE_OPTION_FRA_HISTORICAL_DESC: "Pátá republika pokračuje ve svém kurzu, když prezidentský úřad přechází od Chiraka k Sarkozymu, poté k Hollandovi a Macronovi, přičemž §8Republikáni§! a střed si mezi sebou předávají moc. Francie ukotvuje evropskou integraci a drží si vliv ve sféře Françafrique." # todo: CHANGED
 RULE_OPTION_FRA_SOCIALIST: "Návrat socialistů" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_SOCIALIST_DESC: "§8Parti Socialiste§! obsazuje Elysejský palác a vládne s rozšiřováním sociálního státu, kratší pracovní dobou a mírnějším přístupem k veřejným výdajům. Francie zůstává v NATO i Unii, ale zasazuje se o sociální Evropu namísto čistě liberální." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_LIBERAL: "Liberální střed" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_LIBERAL_DESC: "Centristická §8UDF§! a její nástupkyně §8La République En Marche§! vládnou prostřednictvím deregulace, reformy pracovního trhu a hlubšího evropského federalismu. Francie tlačí ze všech velmocí nejvíce na Unii, která jedná jako jeden celek." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_GAULLIST: "Gaullistické obrození" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_GAULLIST_DESC: "§8Rassemblement pour la France§! obnovuje gaullistický suverenismus, uvolňuje vazby Francie na velení NATO a trvá na nezávislém jaderném odstrašení. Francie si zachovává své evropské místo, ale odmítá následovat Washington." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_GREEN: "Zelená republika" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_GREEN_DESC: "§8Les Verts§! a jejich nástupci §8Europe Écologie Les Verts§! získávají moc a obracejí stát k ekologické transformaci, přičemž přehodnocují jadernou energetiku i těžký průmysl. Francie obětuje část růstu výměnou za nejhlasitější zelený hlas v Evropě." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_FRANCE_UNBOWED: "Nepokořená Francie" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC: "§8La France Insoumise§! přivádí radikální levici do vlády se slibem Šesté republiky a odklonu od evropské fiskální ortodoxie. Francie se staví proti pravidlům Unie a hledá partnery mimo západní blok." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_NATIONAL_RALLY: "Národní sdružení" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC: "§8Front National§! a jeho nástupce §8Rassemblement National§! ovládají republiku a vládnou na základě omezení imigrace a národní preference. Francie tlačí na odchod z Bruselu a sbližuje se s Moskvou." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_COMMUNE: "Francouzská komuna" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_COMMUNE_DESC: "§8Parti Communiste Français§! a radikální levice rozbíjejí Pátou republiku a vyhlašují Francouzskou komunu. Francie opouští západní tábor ve prospěch revolučního směru, který děsí všechna hlavní města kontinentu." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_KINGDOM: "Francouzské království" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_KINGDOM_DESC: "Monarchistický převrat ukončuje republiku a korunuje bourbonského nebo orléanistického pretendenta francouzským králem. Obnovená monarchie se obrací zády k Bruselu a obnovuje staré spory se sousedy." # todo: NEW TRANSLATION
 RULE_OPTION_FRA_EMPIRE: "Francouzské císařství" # todo: NEW TRANSLATION
 RULE_OPTION_FRA_EMPIRE_DESC: "Bonapartistický převrat ukončuje republiku a vyhlašuje nové Francouzské císařství. Císařství sleduje kontinentální ambice, které ho staví proti Německu i Británii." # todo: NEW TRANSLATION
 USB_AI_BEHAVIOR: "@USB Svobodné státy" # todo: CHANGED
 RULE_OPTION_REVANCHIST_PATH: "Znovuzískání osudu" # todo: NEW TRANSLATION
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "To, co zbylo z federálního establishmentu, nasměruje Svobodné státy k obnovení celých kontinentálních Spojených států. Každý soused na staré americké mapě se stane nárokem čekajícím na prosazení §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_ISOLATION_PATH: "Velké uzavření" # todo: NEW TRANSLATION
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "Americký sen je odepsán a Svobodné státy zavřou dveře světu, o němž už nevěří, že mu něco dluží. Staré závazky Washingtonu zaniknou a východní pobřeží zůstane samo sobě §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_ARCADIA_PATH: "Východní identita" # todo: NEW TRANSLATION
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "Federální loajalita vyprchá a Svobodné státy na základě Arcadijského plánu vybudují novou §8Východní identitu§!, místo aby oplakávaly Unii. Východní pobřeží se stane národem samo o sobě, nikoli zbytkem starého státu §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_SECOND_COAL_WARS: "Druhé uhelné války" # todo: NEW TRANSLATION
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "Svobodné státy odmítnou oživeným §8Spojeným horníkům§! znovu otevřít doly v Západní Virginii a uhelná oblast se vzbouří a vyhlásí stát nezávislým. Druhá uhelná válka otevře frontu v Apalačských horách §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 GEO_AI_BEHAVIOR: "@GEO Georgia" # todo: NEW TRANSLATION
 GEO_NATIONALIST_behavior: "@GEO Nationalist's behavior" # todo: NEW TRANSLATION
 GEO_help_CHE_behavior: "@GEO Help for Chechens" # todo: NEW TRANSLATION
 GEO_2008_war_behavior: "@GEO Behavior in 2008 war" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_HISTORICAL_DESC: "Růžová revoluce smete §8Svaz občanů Gruzie§! a Micheil Saakašvili nasměruje zemi rozhodně k NATO a Západu. Gruzie prohrává válku s Ruskem o odštěpenecké republiky a poté pokojně předává moc straně §8Gruzínský sen§!." # todo: NEW TRANSLATION
 RULE_OPTION_GEO_SHEVARDNADZE_WEST: "Ševardnadze vytrvává" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC: "Eduard Ševardnadze rozdrtí opozici, místo aby jí ustoupil, a §8Svaz občanů Gruzie§! udrží zemi na západním kurzu bez revoluce. Gruzie zůstává autoritářským státem, o který se Brusel a Washington přesto ucházejí." # todo: NEW TRANSLATION
 RULE_OPTION_GEO_PRO_RUSSIAN: "Ústupek Moskvě" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC: "§8Svaz občanů Gruzie§! se dohodne s Kremlem, ponechá ruské základny na místě a vyřeší otázku odštěpeneckých republik podle moskevských podmínek. Gruzie sklouzává do Společenství nezávislých států a opouští západní tábor." # todo: NEW TRANSLATION
 RULE_OPTION_GEO_NATIONALIST: "Návrat Mchedrioni" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_NATIONALIST_DESC: "Paramilitární jednotky §8Mchedrioni§! jsou obnoveny a přebírají stát. Gruzie usiluje o Velkou Gruzii, která není zavázána žádnému bloku. Arménie, Ázerbájdžán a odštěpenecké republiky se stávají cíli namísto sousedů." # todo: NEW TRANSLATION
 RULE_OPTION_GEO_COMMUNIST: "Obnovená sovětská republika" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_COMMUNIST_DESC: "§8Sjednocená komunistická strana Gruzie§! se vrací k moci volbami nebo revolucí a znovu vyhlašuje sovětskou republiku. Gruzie se obrací k Arménii a Ázerbájdžánu s cílem obnovit zakavkazskou federaci." # todo: NEW TRANSLATION
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT: "Národní hnutí se udrží" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC: "Dějiny dospějí k válce a následnému urovnání, ale §8Sjednocené národní hnutí§! Saakašviliho si udrží prezidentský úřad, místo aby o něj přišlo. Gruzie zdvojnásobí úsilí o členství v NATO a odpoví Moskvě otevřeným nepřátelstvím." # todo: NEW TRANSLATION
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS: "Aliance vlastenců" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC: "Poválečné urovnání proběhne stejně jako ve skutečnosti a poté zvítězí §8Aliance vlastenců§! s nacionalistickým a sociálně konzervativním programem. Gruzie se odvrací od Bruselu a znovu se posouvá na východ." # todo: NEW TRANSLATION
 RULE_OPTION_GEO_UNITED_GEORGIA: "Mezi Východem a Západem" # todo: NEW TRANSLATION
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC: "Poválečné urovnání proběhne stejně jako ve skutečnosti a poté se k moci dostává §8Sjednocená Gruzie§! s vědomě vícevektorovou zahraniční politikou. Gruzie vyvažuje Evropskou unii, Rusko a své sousedy, místo aby si mezi nimi vybírala." # todo: NEW TRANSLATION
 GEO_WILL_FOLLOW_OWN_WAY: "Vlastní cesta" # todo: NEW TRANSLATION
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Nacionalistická Gruzie bude následovat svou vlastní cestu a doběhne Arménii a Ázerbájdžán." # todo: NEW TRANSLATION
 GEO_WILL_BE_PRO_ARMENIA: "Pro-arménská" # todo: NEW TRANSLATION
 GEO_WILL_BE_PRO_ARMENIA_DESC: "Nacionalistická Gruzie bude pomáhat Arménii porazit Ázerbájdžán." # todo: NEW TRANSLATION
 GEO_WILL_BE_PRO_AZERI: "Pro-Ázerbájdžánský" # todo: NEW TRANSLATION
 GEO_WILL_BE_PRO_AZERI_DESC: "Nacionalistická Gruzie bude pomáhat Ázerbájdžánu porazit Arménii." # todo: NEW TRANSLATION
 GEO_WILL_HELP: "Pomoc Čečenům" # todo: NEW TRANSLATION
 GEO_WILL_HELP_DESC: "Gruzie pomůže Čečencům ve válce s Ruskem. Mohou Gruzii v budoucnu pomoci." # todo: NEW TRANSLATION
 GEO_WONT_HELP: "Nepomáhej Čečenům" # todo: NEW TRANSLATION
 GEO_WONT_HELP_DESC: "Gruzie Čečencům ve válce s Ruskem nepomůže. Bude vůči Gruzii nepřátelská." # todo: NEW TRANSLATION
 GEO_ATTACK_RUS: "Příprava na válku" # todo: NEW TRANSLATION
 GEO_ATTACK_RUS_DESC: "Gruzie bude připravena na válku v roce 2008 a bude se snažit ve válce zvítězit." # todo: NEW TRANSLATION
 GEO_WEAKBOY: "Dohoda s Ruskem" # todo: NEW TRANSLATION
 GEO_WEAKBOY_DESC: "Gruzie bude usilovat o dohodu s Ruskem, aby se vyhnula boji." # todo: NEW TRANSLATION
 RULE_OPTION_GER_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_GER_HISTORICAL_DESC: "§8Sociálnědemokratická strana§! vládne v koalici se §8Zelenými§! a prosadí reformy práce Hartz navzdory vlastní voličské základně, poté předá kancléřství §8Křesťanskodemokratické unii§! pro dlouhou velkou koalici. Německo zůstává pevně ukotveno v NATO a řídí Evropskou unii z jejího středu." # todo: NEW TRANSLATION
 RULE_OPTION_GER_LIBERAL: "Liberální republika" # todo: NEW TRANSLATION
 RULE_OPTION_GER_LIBERAL_DESC: "§8Svobodná demokratická strana§! se vymaní z role juniorního partnera a vede zemi na základě volného trhu, deregulace, privatizované obrany a digitálního státu. Německo se pevněji váže na NATO a otevírá hranice těm, které jeho bodový systém ohodnotí nejvýše." # todo: NEW TRANSLATION
 RULE_OPTION_GER_GREEN: "Zelené kancléřství" # todo: CHANGED
 RULE_OPTION_GER_GREEN_DESC: "§8Zelení§! převezmou kancléřství vlastním právem a využijí ho k ukončení jaderné energetiky, evropské zelené dohodě a progresivnímu zdanění. Německo zatlačí alianci na východ a vytvoří si odstup od Moskvy i Pekingu." # todo: CHANGED
 RULE_OPTION_GER_POPULIST: "Alternativa povstává" # todo: NEW TRANSLATION
 RULE_OPTION_GER_POPULIST_DESC: "§8Alternativa§! se vynořuje z okraje politické scény a vstupuje do vlády s programem proti imigraci, islámu a euru a s pochybnostmi o klimatu. Německo se sbližuje s Moskvou, zatímco zevnitř rozkládá Evropskou unii." # todo: NEW TRANSLATION
 RULE_OPTION_GER_SOCIALIST: "Vzestup levice" # todo: CHANGED
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! převezme moc z trosek Spolkové republiky, vyžene Američany z jejich základen a odzbrojí zemi. Německo poté zatlačí Francii, Polsko a Švédsko do dělnické unie, v případě odmítnutí i silou." # todo: CHANGED
 RULE_OPTION_GER_NATIONALIST: "Vláda národních demokratů" # todo: CHANGED
 RULE_OPTION_GER_NATIONALIST_DESC: "Ústavní řád se zhroutí do občanské války a §8Národnědemokratická strana§! převezme trosky a vybuduje jednostranický policejní stát na krvi, půdě a vyhánění. Německo se otevřeně stane iredentistickým a každá hranice kolem něj se promění v nárok." # todo: CHANGED
 RULE_OPTION_GER_MONARCHIST: "Císař se vrací" # todo: CHANGED
 RULE_OPTION_GER_MONARCHIST_DESC: "Republika padne a §8císař§! bude znovu korunován nad obnovenou říší. Německo dosadí monarchie zpět na švýcarský, rakouský, belgický, osmanský a italský trůn a shromáždí je do císařského bloku." # todo: CHANGED
 RULE_OPTION_GRE_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_GRE_HISTORICAL_DESC: "§8Nová demokracie§! provádí Řecko dluhovou krizí pomocí úspor a eura, osekává rozpočet na kost, než přijde oživení. Atény se ještě pevněji ukotvují v Evropské unii a NATO a spojují Kypr, Izrael a Francii do východostředomořské fronty." # todo: NEW TRANSLATION
 RULE_OPTION_GRE_COMMUNIST: "Rudá Akropole" # todo: NEW TRANSLATION
 RULE_OPTION_GRE_COMMUNIST_DESC: "Zhroucení předává stát §8Komunistické straně Řecka§!, která sepíše novou ústavu, znárodní banky a pozvedne rudou armádu. Řecko opouští NATO a organizuje komunistický blok na Balkáně, přičemž vznáší nároky vůči Bulharsku, Albánii, Severní Makedonii, Srbsku a Rumunsku." # todo: NEW TRANSLATION
 RULE_OPTION_GRE_NATIONALIST: "Zlatý úsvit" # todo: NEW TRANSLATION
 RULE_OPTION_GRE_NATIONALIST_DESC: "§8Zlatý úsvit§! využívá stejného kolapsu a dostává se k moci, pohřbívá republiku pod metaxistickou diktaturou a umlčuje tisk i opozici. Řecko obnovuje ideu Megali a vznáší územní nároky vůči Albánii, Bulharsku, Severní Makedonii a Turecku." # todo: NEW TRANSLATION
 RULE_OPTION_GRE_MULTIPOLAR: "Obrat na východ" # todo: NEW TRANSLATION
 RULE_OPTION_GRE_MULTIPOLAR_DESC: "Republika přežívá, ale obrací se proti Evropské unii, získává přízeň Ruska, Číny a Íránu a prodává Pireus čínskému kapitálu. Řecko vstupuje do BRICS a opouští NATO, čímž vyměňuje své místo v západním táboře za pozici v multipolárním řádu." # todo: NEW TRANSLATION
 GRN_AI_BEHAVIOR: "@GRN Greenland" # todo: NEW TRANSLATION
 RULE_OPTION_GRN_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_GRN_HISTORICAL_DESC: "Grónsko získává od Dánska samosprávu a soustředí své úsilí na osídlení, rybolov, těžbu a veřejné služby namísto zahraničních dobrodružství. Arktida zůstává klidná a grónští severští sousedé si ponechávají své hranice." # todo: NEW TRANSLATION
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY: "Skandinávský klid" # todo: NEW TRANSLATION
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC: "Grónsko sjednocuje Island, Faerské ostrovy, Dánsko, Norsko, Švédsko a Finsko do §8Severské unie§! a poté se zastavuje na pobřeží Baltu. Skandinávie hovoří jedním hlasem a širší evropský řád zůstává beze změny." # todo: NEW TRANSLATION
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY: "Kontinentální hegemonie" # todo: NEW TRANSLATION
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC: "Grónsko vede svou §8Severskou unii§! na jih a východ, dokud se §8Ledová federace§! nerozprostře přes většinu Evropy. Hlavní města kontinentu se zodpovídají Nuuku a starý evropský řád končí." # todo: NEW TRANSLATION
 HEZ_AI_BEHAVIOR: "@HEZ Hezbollah" # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_HISTORICAL_DESC: "§8Hezbollah§! se účastní voleb jako strana, udržuje partyzánskou armádu §8Taabia§!, s níž bojoval proti Izraeli, a stojí po boku §8Libanonských ozbrojených sil§! místo aby je nahradil. Bojuje po boku Damašku, §8iráckých šíitských milicí§! a §8Húsíů§!, přičemž zůstává státem uvnitř libanonského státu." # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_LAND_OF_GOD: "Boží země" # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC: "§8Hezbollah§! se odtrhává od Libanonu a buduje uznaný islámský stát na jihu a v Biká, získává spojence a zvyšuje životní úroveň ve vesnicích, kterým vládne. Buduje expediční síly a zahraniční zpravodajskou službu a mění libanonskou frakci v samostatnou regionální mocnost." # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_CONQUER_LEBANON: "Páni Libanonu" # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC: "§8Hezbollah§! vyzbrojuje přeběhlíky z §8Libanonských ozbrojených sil§! a ovládá Libanon otevřenou válkou, nikoli hlasováním. Kampaň financuje íránskými penězi, továrnami a silnicemi a připojuje zemi k Islámské republice podřízené Teheránu." # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE: "Export revoluce" # todo: NEW TRANSLATION
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC: "§8Hezbollah§! si udržuje pozice v Libanonu a lije peníze do zahraničních sítí, od §8Islámského hnutí§! v západní Africe po diasporu a kartelové trasy z Venezuely. Buduje buňky a milice přímo v Severní Americe a přenáší válku daleko za Levantu." # todo: NEW TRANSLATION
 RULE_OPTION_HKG_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_HKG_HISTORICAL_DESC: "§8Pekingu nakloněný tábor§! udržuje Zvláštní administrativní oblast na pekingském kurzu, přestavuje §8Legislativní radu§! kolem vlastenců, zavádí vlasteneckou výchovu ve školách a nechává kantonský občanský život chřadnout. Následují i peníze: Hongkong se stává offshore centrem jüanu a financérem §8Pásu a stezky§!, zatímco §8Velká zátoková oblast§! pohlcuje to, co sliboval §8Základní zákon§!." # todo: NEW TRANSLATION
 RULE_OPTION_HKG_INDEPENDENCE: "Vlastní národ" # todo: NEW TRANSLATION
 RULE_OPTION_HKG_INDEPENDENCE_DESC: "Hongkong ruší loutkové uspořádání, píše vlastní ústavu a buduje armádu i flotilu letadlových lodí na svou obranu. Poté vznáší iredentistický nárok na deltu Perlové řeky a vyzývá Peking, aby odpověděl za Kuang-tung." # todo: NEW TRANSLATION
 RULE_OPTION_HKG_BRITISH: "Zpět pod korunu" # todo: NEW TRANSLATION
 RULE_OPTION_HKG_BRITISH_DESC: "Hongkong opouští čínskou svrchovanost a žádá Londýn o návrat, poskytuje Spojenému království právo na posádku, připojuje se ke zpravodajskému sdílení §8AUKUS§! a zavádí všeobecné volební právo i nezávislé soudnictví. §8Commonwealthská§! říše u čínských hranic předává Západu demokratické předmostí, které Peking po desetiletí uzavíral." # todo: NEW TRANSLATION
 RULE_OPTION_HKG_CITY_STATE: "Svobodné město" # todo: NEW TRANSLATION
 RULE_OPTION_HKG_CITY_STATE_DESC: "Hongkong z vlastní moci přepisuje §8Základní zákon§!, ponechává pobřežní obranné síly namísto armády a činí se finančním hlavním městem východní Asie. Není přísahou vázán k žádnému bloku, obchoduje s Pekingem i Washingtonem a nepodléhá ani jednomu z nich." # todo: NEW TRANSLATION
 RAJ_AI_BEHAVIOR: "@RAJ India" # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_HISTORICAL_DESC: "Indie střídá u moci §8Bharatíja džanata pártí§! a §8Indický národní kongres§!, zachovává ekonomickou liberalizaci a závazek vůči §8BRICS§! i multipolární, nezúčastněné zahraniční politice. Indie udržuje vztahy s Washingtonem i Moskvou a zároveň se etablovala jako významný hlas rozvojového světa." # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_GREATER_INDIA: "Velká Indie" # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_GREATER_INDIA_DESC: "K moci se dostává hinduistická nacionalistická fronta, která doma zavádí hinduistickou většinovou vládu, zachovává kastovní hierarchii a zbavuje menšiny ochrany. Indie se obrací k autarkii, izolaci a územním nárokům vůči Nepálu, Bhútánu a Bangladéši a buduje autoritářský panindický režim." # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_RED_REPUBLIC: "Rudá republika" # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC: "§8Komunistická strana Indie§! získává moc, znárodňuje ekonomiku a vrací se k pětiletému plánování, zatímco se sbližuje s Čínou a stahuje nárok na Aksai Čin. Indie vyváží revoluci po jižní Asii a stává se radikální socialistickou předvojem regionu." # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_PEOPLES_FRONT: "Lidová fronta" # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC: "§8Bahudžan samádž pártí§! a §8Samádžvádí pártí§! vytvářejí dalitskou a socialistickou koalici, rozbíjejí kastovní privilegia a přerozdělují bohatství ve společnosti. Indie buduje sociální stát severského typu a zároveň zachovává nezúčastněnou zahraniční politiku." # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT: "Spojenec Západu" # todo: NEW TRANSLATION
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC: "Indie se přibližuje Francii a Izraeli, stává se významným spojencem Spojených států mimo NATO a prohlubuje vojenskou i obchodní spolupráci s Washingtonem. Indie uznává Tchaj-wan a nakonec vstupuje do NATO, čímž upevňuje své místo v západní alianci." # todo: NEW TRANSLATION
 IND_AI_BEHAVIOR: "@IND Indonesia" # todo: NEW TRANSLATION
 RULE_OPTION_IND_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_IND_HISTORICAL_DESC: "Indonésie upevňuje republiku Reformasi za Národní stranou probuzení, bojuje proti náboženskému extremismu a místo volby stran zprostředkovává konflikt na Molukách. Díky protikorupčním institucím a západní orientaci se Indonésie stává stabilní demokratickou kotvou jihovýchodní Asie." # todo: NEW TRANSLATION
 RULE_OPTION_IND_PARTY_OF_STRUGGLE: "Strana boje" # todo: NEW TRANSLATION
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC: "§8Indonéská demokratická strana boje§! se ujímá moci jako největší sekulární a nacionalistická síla země, chrání náboženské menšiny v konfliktních regionech a prosazuje Pancasilu proti radikalizaci. Indonésie posouvá diplomacii na východ k Číně a Rusku a buduje levicově nacionalistickou baštu napříč souostrovím." # todo: NEW TRANSLATION
 RULE_OPTION_IND_DEMOCRAT_PARTY: "Technokratické předsednictví" # todo: NEW TRANSLATION
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC: "Reformující generál shromažďuje technokratické odborníky v §8Demokratické straně§! a upřednostňuje hospodářský růst, institucionální stabilitu a důvěru investorů. Indonésie zůstává pevně orientovaná na Západ jako vzor profesionální a kompetentní správy v jihovýchodní Asii." # todo: NEW TRANSLATION
 RULE_OPTION_IND_UNITED_DEVELOPMENT: "Sjednocená rozvojová fronta" # todo: NEW TRANSLATION
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC: "§8Sjednocená rozvojová strana§!, zakořeněná v islámských sítích establishmentu Nového řádu, přebírá stát a vládne prostřednictvím protekce, osobních vztahů a konsenzu elit namísto strukturálních reforem. Indonésie si zachovává západní ukotvení, zatímco islámská identita sílí prostřednictvím neformálních mocenských struktur a transakční politiky." # todo: NEW TRANSLATION
 RULE_OPTION_IND_PROSPEROUS_JUSTICE: "Hnutí prosperující spravedlnosti" # todo: NEW TRANSLATION
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC: "§8Strana prosperující spravedlnosti§!, disciplinované islamistické hnutí založené na boji proti korupci a mobilizaci zdola, uchvacuje moc a rozbíjí klientelistické sítě, které vládly od Reformasi. Indonésie, nepřátelská západnímu poručnictví a sociálně konzervativní, se orientuje na východ jako nezávislý aktér mimo liberální řád i staré elity." # todo: NEW TRANSLATION
 RULE_OPTION_IND_ISLAMIST: "Islámská Indonésie" # todo: NEW TRANSLATION
 RULE_OPTION_IND_ISLAMIST_DESC: "Náboženská radikalizace probíhá bez kontroly, zatímco §8Fronta islámských obránců§! přechází od pouličního aktivismu k ovládnutí státu. Indonésie se rozpadá v šaría republiku, která vznáší územní i ideologické nároky vůči sousedům a prosazuje nadvládu nad vlastním souostrovím." # todo: NEW TRANSLATION
 RULE_OPTION_PER_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_PER_HISTORICAL_DESC: "Islámská republika přežívá pod Nejvyšším vůdcem a prezidentský úřad přechází mezi reformistickým a principialistickým táborem. Írán kotví osu odporu, protláčí svůj jaderný program každým kolem sankcí a promítá moc prostřednictvím spojeneckých milicí od Libanonu po Jemen." # todo: NEW TRANSLATION
 RULE_OPTION_PER_RESTORATION: "Paví trůn" # todo: NEW TRANSLATION
 RULE_OPTION_PER_RESTORATION_DESC: "Exilová §8Konstitucionalistická strana§! přivádí dynastii §8Pahlaví§! zpět domů a korunuje Rezá Pahlavího II. sekulárním králem. Klerikální řád je smeten a Írán se obrací k Západu, přičemž opouští síť zástupných sil budovanou po generaci." # todo: NEW TRANSLATION
 RULE_OPTION_PER_IRANIC_FEDERATION: "Íránská federace" # todo: NEW TRANSLATION
 RULE_OPTION_PER_IRANIC_FEDERATION_DESC: "§8Panikánistická strana§! se ujímá moci a snaží se sjednotit íránské národy Tádžikistánu, Kurdistánu, Ázerbájdžánu a Balúčistánu do jediné federace. Írán se stává srdcem nové íránské sféry a každý soused, který drží íránskou zemi, zjišťuje, že jeho hranice jsou zpochybněny." # todo: NEW TRANSLATION
 RULE_OPTION_PER_MOJAHEDIN: "Lidoví mudžáhedíni" # todo: NEW TRANSLATION
 RULE_OPTION_PER_MOJAHEDIN_DESC: "§8Mudžáhedíne-chalk§! se pod vedením Maryam Radžaví vracejí z exilu a uchvacují stát duchovenstvu. Írán je vyhlášen lidovou republikou, která staré revoluci nic nedluží, a její zahraniční politika je vystavěna od základů." # todo: NEW TRANSLATION
 RULE_OPTION_PER_FREEDOM_MOVEMENT: "Hnutí svobody" # todo: NEW TRANSLATION
 RULE_OPTION_PER_FREEDOM_MOVEMENT_DESC: "§8Hnutí svobody Íránu§! přebírá trosky klerikální vlády a buduje sekulární ústavní republiku, která ponechává víru soukromému svědomí. Revoluční gardy jsou vytlačeny z politiky i obchodu a Írán se znovu otevírá Západu jako běžný stát." # todo: NEW TRANSLATION
 RULE_OPTION_PER_NATIONAL_FRONT: "Národní fronta" # todo: NEW TRANSLATION
 RULE_OPTION_PER_NATIONAL_FRONT_DESC: "§8Národní fronta§! se vrací jako dědic Mosaddeka a obnovuje Írán na základech sekulárního nacionalismu a ropy, kterou revoluce promarnila. Zachovává nezúčastněnost, nezískává si ani Washington, ani Moskvu, a vrací technokraty k práci." # todo: NEW TRANSLATION
 RULE_OPTION_PER_GREEN_MOVEMENT: "Zelené hnutí" # todo: NEW TRANSLATION
 RULE_OPTION_PER_GREEN_MOVEMENT_DESC: "§8Zelené hnutí§! přivádí Míra-Hosejna Músávího k moci se slibem, že hlas voličů bude konečně započítán. Írán zůstává islámskou republikou, ale odpovídá svým voličům a region přichází o Nejvyššího vůdce jako adresáta." # todo: NEW TRANSLATION
 RULE_OPTION_PER_MONTAZERI: "Montazerího republika" # todo: NEW TRANSLATION
 RULE_OPTION_PER_MONTAZERI_DESC: "Reformní duchovní kolem §8velkého ajatolláha Montazerího§! přebírají semináře od jestřábů a konečně skládají účty za věznice. Víra si zachovává své místo ve státě, ale je umírněna mužem, který celý život odsuzoval to, co se dělo jejím jménem." # todo: NEW TRANSLATION
 RULE_OPTION_PER_AHMADINEJAD: "Ahmadínežádův návrat" # todo: NEW TRANSLATION
 RULE_OPTION_PER_AHMADINEJAD_DESC: "§8Mahmúd Ahmadínežád§! shromažďuje zastánce tvrdé linie, vyplácí chudé z ropného účtu a vyzývá svět, aby ho zastavil. Basídž a Ansár-e Hizballáh se doma stávají ramenem státu a zahraniční konfrontace účelem, nikoli cenou." # todo: NEW TRANSLATION
 RULE_OPTION_PER_GHALIBAF: "Ghalíbáfův řád" # todo: NEW TRANSLATION
 RULE_OPTION_PER_GHALIBAF_DESC: "§8Mohammad Bagher Ghalíbáf§! vládne jako velitel, který zařídí stavbu všeho potřebného, a vyměňuje politickou svobodu za silnice, pořádek a výsledky. Revoluční gardy si ponechávají své obchodní impérium a tisk svou uzdu, zatímco Teherán získává od Moskvy kapitál na jejich financování." # todo: NEW TRANSLATION
 RULE_OPTION_PER_MASHAEI: "Mašáího íránská škola" # todo: NEW TRANSLATION
 RULE_OPTION_PER_MASHAEI_DESC: "§8Esfandjár Rahím Mašáí§! staví národ před víru a hlásá Írán, který nepotřebuje duchovenstvo mezi sebou a Bohem. Semináře jsou jako politická síla rozbity a íránský nacionalismus, nikoli šíitský islám, se stává tím, co stát vyváží." # todo: NEW TRANSLATION
 RULE_OPTION_PER_WORKERS_REPUBLIC: "Dělnická republika" # todo: NEW TRANSLATION
 RULE_OPTION_PER_WORKERS_REPUBLIC_DESC: "§8Strana Túdeh§! a íránská levice se vracejí z exilu a vyhlašují dělnickou republiku. Duchovenstvo i Revoluční gardy jsou rozebrány společně a Írán hledá přátele mezi zbývajícími socialistickými státy světa." # todo: NEW TRANSLATION
 RULE_OPTION_PER_ARTESH: "Direktorium Artesh" # todo: NEW TRANSLATION
 RULE_OPTION_PER_ARTESH_DESC: "§8Artesh§! rozpouští zbytky civilní vlády a vládne prostřednictvím direktorátu vlastních důstojníků. Ideologii nahrazuje holý státní zájem a Írán jedná se sousedy jako voják, nikoli revolucionář." # todo: NEW TRANSLATION
 IRQ_AI_BEHAVIOR: "@IRQ Iraq" # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_HISTORICAL_DESC: "Irák funguje pod §8Baasistickou stranou§! Saddáma Husajna, dokud americká invaze režim nesvrhne. Okupační vláda poté vládne z Bagdádu, zatímco moc přechází k šíitským náboženským stranám §8Islámské strany الدعوة§!. Irák končí jako Američany podporovaná republika, která se přesto posouvá do íránské diplomatické oběžné dráhy." # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_BAATHIST_STATE: "Baas přetrvává" # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC: "§8Baasistická strana§! přežívá americkou invazi, prolomí sankční režim, vyřeší nástupnictví uvnitř rodiny a obnoví nároky na Kuvajt, kurdské oblasti a íránský Chúzestán. Záliv žije vedle nepřerušeného §8baasistického§! Iráku, který tlačí na sousedy a prosazuje panarabské ambice." # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_SHIA_THEOCRACY: "Vláda právníků" # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC: "Šíitské klerikální strany a §8Organizace Badr§! přebírají poválečný stát a budují republiku ovládanou právníky a spojenou s Teheránem. Bagdád se stává západní kotvou íránské osy vedoucí do Damašku a Bejrútu." # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_SADRIST: "Sadrův příliv" # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_SADRIST_DESC: "Hnutí §8Muktady as-Sadra§! povstává z bagdádských slumů, vyhání Američany a vládne jako šíitská populistická a irácká nacionalistická síla, která odmítá íránské poručnictví stejně rozhodně jako americké. Irák se uzavírá a nepřátelsky se staví ke každému zahraničnímu patronovi." # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_SECULAR_REPUBLIC: "Sekulární republika" # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC: "Sekulární opozice §8Iráckého národního kongresu§! a §8Irácké národní dohody§! píše ústavu nadřazenou sektám a etnikům a drží stát pohromadě jako arabskou, nikoli náboženskou republiku. Irák se vrací do arabského řádu jako sekulární stát nakloněný Západu." # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_COMMUNIST: "Socialistický Irák" # todo: NEW TRANSLATION
 RULE_OPTION_IRQ_COMMUNIST_DESC: "§8Irácká komunistická strana§! vystupuje z podzemí, kde žila od §8baasistických§! čistek, získává dělníky, ženy a Kurdy a přebírá republiku. Irák se stává socialistickým státem uprostřed ropných monarchií." # todo: NEW TRANSLATION
 ISR_AI_BEHAVIOR: "@ISR Israel" # todo: NEW TRANSLATION
 RULE_OPTION_ISR_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_ISR_HISTORICAL_DESC: "§8Likud§! přebírá zemi po zhroucení mírových rozhovorů, potlačuje druhou intifádu za separační bariérou a stahuje osadníky z Gazy. Izrael zůstává ukotven u Washingtonu, normalizuje vztahy s arabským Zálivem a považuje Írán za hrozbu, která určuje vše ostatní." # todo: NEW TRANSLATION
 RULE_OPTION_ISR_PEACE_PROCESS: "Mírový tábor" # todo: NEW TRANSLATION
 RULE_OPTION_ISR_PEACE_PROCESS_DESC: "§8Labour§! vládne s §8Meretz§! a arabskými stranami a vážně vyjednává dvoustátní uspořádání. Palestinská samospráva je vyzbrojena jako partner, nikoli kontrolována jako podezřelý, a Gaza získává fungující přístav i letiště." # todo: NEW TRANSLATION
 RULE_OPTION_ISR_SECULAR_CENTRE: "Sekulární střed" # todo: NEW TRANSLATION
 RULE_OPTION_ISR_SECULAR_CENTRE_DESC: "§8Ješ atid§!, §8Modrá a bílá§! a §8Nová naděje§! přebírají zemi a vytlačují náboženství zpět ze státu. Soudy jsou chráněny, branná povinnost přepsána a Izrael se přiklání k Evropě a OECD." # todo: NEW TRANSLATION
 RULE_OPTION_ISR_GREATER_ISRAEL: "Velký Izrael" # todo: NEW TRANSLATION
 RULE_OPTION_ISR_GREATER_ISRAEL_DESC: "§8Ocma jehudit§! a §8Náboženský sionismus§! se ujímají moci a trhají zbytky osloského rámce. Osady jsou upevněny a anektovány, status quo Chrámové hory přepsáno a armáda udeří na sever, než bude napadena." # todo: NEW TRANSLATION
 RULE_OPTION_ISR_LOOK_EAST: "Obrat na východ" # todo: NEW TRANSLATION
 RULE_OPTION_ISR_LOOK_EAST_DESC: "Vláda §8Likudu§! se odvrací od Washingtonu, pronajímá přístav v Haifě čínským provozovatelům a prodává Pekingu zbraně i technologie. Izrael se kvůli Ukrajině přiklání k Moskvě a západní aliance, která ho zaručovala, začíná působit podmíněně." # todo: NEW TRANSLATION
 RULE_OPTION_ITA_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_ITA_HISTORICAL_DESC: "Moc se střídá mezi §8Partito Democratico§! a blokem §8Forza Italia§! a Itálie zůstává ukotvena v NATO a Evropské unii. Její vlády se vyčerpávají bojem s organizovaným zločinem, veřejným dluhem, jižní otázkou a vlastní správou namísto péče o hranice země." # todo: NEW TRANSLATION
 RULE_OPTION_ITA_ROMAN_RESTORATION: "Obnovení Římské říše" # todo: NEW TRANSLATION
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC: "§8Fratelli d'Italia§! a národní pravice rostou, dokud nevyhrají volby, nerozpustí parlament a neustanoví císaře obnoveného Říma. Itálie poté postupně vznáší nárok na staré císařské provincie od afrického pobřeží až po Britannii." # todo: NEW TRANSLATION
 RULE_OPTION_ITA_MARCH_ON_ROME: "Druhý pochod na Řím" # todo: NEW TRANSLATION
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC: "Stejné hnutí získává moc, ale zachovává republiku a v Římě nastoluje §8fašistickou§! vládu. Itálie prosazuje iredentistické nároky v Jadranu a Alpách, aniž by usilovala o císařství." # todo: NEW TRANSLATION
 RULE_OPTION_ITA_EASTERN_TURN: "Obrat na východ" # todo: NEW TRANSLATION
 RULE_OPTION_ITA_EASTERN_TURN_DESC: "§8Rifondazione Comunista§! a §8Partito dei Comunisti Italiani§! obnovují italskou levici a vyvádějí zemi z NATO. Itálie se uchází o přízeň Moskvy a Pekingu a hledá místo v Šanghajské organizaci pro spolupráci." # todo: NEW TRANSLATION
 RULE_OPTION_JAP_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_JAP_HISTORICAL_DESC: "§8Liberální demokraté§! udržují Diet, spojenectví s Washingtonem trvá a Síly sebeobrany jsou normalizovány jen do té míry, do jaké je k tomu nutí nepřátelské okolí. Japonsko odepisuje špatné úvěry, přijímá opatření proti kolapsu porodnosti a krizi karóši a ponechává článek devět v platnosti." # todo: NEW TRANSLATION
 RULE_OPTION_JAP_NORMAL_NATION: "Normální národ" # todo: NEW TRANSLATION
 RULE_OPTION_JAP_NORMAL_NATION_DESC: "§8Liberální demokraté§! postupně vyčerpávají konsenzus kolem článku devět, dokud nejsou Síly sebeobrany zapsány v ústavě jako armáda jako každá jiná. Japonsko zbrojí v rámci amerického spojenectví a začíná samo odpovídat Pekingu i Pchjongjangu." # todo: NEW TRANSLATION
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY: "Druhé poválečné období" # todo: NEW TRANSLATION
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC: "§8Demokratická strana§! prolomí konzervativní kontrolu nad Dietem a vládne s transparentností, pracovním právem a otevřenými dveřmi pro zahraniční pracovníky. Japonsko věnuje síly porodnosti, zaměstnancům a korupci, která přežila ekonomickou bublinu, místo regionu." # todo: NEW TRANSLATION
 RULE_OPTION_JAP_PACIFIST: "Mírová ústava" # todo: NEW TRANSLATION
 RULE_OPTION_JAP_PACIFIST_DESC: "§8Sociální demokraté§! ovládnou Diet se slibem, že článek devět znamená to, co říká. Vývoz zbraní, základny a nakonec i Síly sebeobrany jsou zrušeny. Japonsko ruší bezpečnostní smlouvu s Washingtonem a odzbrojené stojí mezi Čínou a Korejemi." # todo: NEW TRANSLATION
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE: "Návrat císařství" # todo: NEW TRANSLATION
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC: "§8Strana obnovy§! vyrůstá z nacionalistické pravice, dokud není trůnu navrácena moc a článek devět zrušen. Japonsko znovu zbrojí za oceánskou flotilou a silou si bere zpět Kurily, Koreu, Tchaj-wan a starou pacifickou sféru." # todo: NEW TRANSLATION
 LKT_AI_BEHAVIOR: "@LKT Lakotové" # todo: CHANGED
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "Válka Fronty znovuzískání území" # todo: NEW TRANSLATION
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "Auditor vyslaný z hlavního města se z vlastní pravomoci postaví vedení §8Fronty obnovy§! a setkání skončí otevřeným rozkolem. Kansas se pod vedením Fronty militarizuje a Lakotové s ní vstoupí do války §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "Mír Fronty znovuzískání území" # todo: NEW TRANSLATION
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "Druhé kolo vyšetřování vyvrátí nejtvrdší zprávy o §8Frontě obnovy§! a obě vlády místo zbrojení zahájí rozhovory. Lakotové a Fronta z usmíření vybudují společnou hospodářskou a společenskou unii §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 LBA_AI_BEHAVIOR: "@LBA Libya" # todo: NEW TRANSLATION
 RULE_OPTION_LBA_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_LBA_HISTORICAL_DESC: "Kaddáfí drtí §8Libyjskou islámskou bojovou skupinu§!, vzdává se zbrojního programu a vyjednává o ukončení mezinárodních sankcí. Režim nakonec padá při povstání a Libye přechází pod vojenského siláka velícího §8Libyjské národní armádě§!." # todo: NEW TRANSLATION
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE: "Islámský chalífát" # todo: NEW TRANSLATION
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE_DESC: "Kaddáfí toleruje §8Libyjskou islámskou bojovou skupinu§!, která ho zavraždí a nastolí salafistický stát. Libye se stává základnou džihádu napříč Sahelem a destabilizuje Čad, Niger, Nigérii, Alžírsko, Mali a Mauritánii." # todo: NEW TRANSLATION
 RULE_OPTION_LBA_GRAND_MUFTI: "Vláda velkého muftího" # todo: CHANGED
 RULE_OPTION_LBA_GRAND_MUFTI_DESC: "Je jmenován §8velký muftí§! a náboženské právo je postaveno nad stát. Muftí nakonec převezme moc, založí salafistické království a zavede v celé Libyi přísnou islámskou vládu." # todo: CHANGED
 RULE_OPTION_LBA_LIBYAN_REPUBLIC: "Libyjská republika" # todo: NEW TRANSLATION
 RULE_OPTION_LBA_LIBYAN_REPUBLIC_DESC: "Libye reviduje Zelenou knihu, posiluje lidové kongresy a legalizuje politické strany. Stát se mění v prezidentskou republiku, kde soutěživá politika nahrazuje Kaddáfího přímou demokracii." # todo: NEW TRANSLATION
 RULE_OPTION_LBA_KINGDOM: "Senússké království" # todo: CHANGED
 RULE_OPTION_LBA_KINGDOM_DESC: "Královská rodina se vrátí domů a bude odškodněna a §8senússká§! monarchie bude obnovena jako absolutní vláda. Libye opustí republiku a koruna na neurčito pozastaví volby." # todo: CHANGED
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION: "Antikoloniální unie" # todo: NEW TRANSLATION
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION_DESC: "Kaddáfí zůstává a buduje §8Antikoloniální unii§!, která vyzbrojuje povstání napříč Afrikou a Blízkým východem. Libye se stává centrem revolučních hnutí, destabilizuje sousedy a šíří chaos přes dva kontinenty." # todo: NEW TRANSLATION
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC: "Sjednocená arabská republika" # todo: NEW TRANSLATION
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC_DESC: "Kaddáfí zůstává a spolupracuje s §8baasisty§! na vybudování §8Sjednocené arabské republiky§!. Libye se slučuje v panarabský stát táhnoucí se od Mauritánie po Jemen a mění geopolitiku arabského světa." # todo: NEW TRANSLATION
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA: "Spojené státy africké" # todo: NEW TRANSLATION
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA_DESC: "Kaddáfí zůstává a usiluje o kontinentální §8Spojené státy africké§!, v jejichž čele stojí. Libye se stává hlavním městem africké supervelmoci a proměňuje celý politický řád kontinentu." # todo: NEW TRANSLATION
 RULE_OPTION_MNT_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_MNT_HISTORICAL_DESC: "§8Đukanovićova frakce§! vede Černou Horu do EU a NATO, zatímco upevňuje oligarchickou kontrolu nad státními institucemi a ekonomikou. Černá Hora se stává malým státem orientovaným na Západ, jehož instituce zůstávají propojeny s organizovaným zločinem a politickými klientelistickými sítěmi." # todo: NEW TRANSLATION
 RULE_OPTION_MNT_EUROPEAN_REFORM: "Reformní cesta" # todo: NEW TRANSLATION
 RULE_OPTION_MNT_EUROPEAN_REFORM_DESC: "Demokratické a sociálnědemokratické strany svrhávají oligarchy a usilují o vstup do EU spolu s agresivní protikorupční reformou a rozbitím klientelistických sítí. Černá Hora se stává skutečnou liberální demokracií, kde státní instituce fungují bez organizovaného zločinu a oligarchické nadvlády." # todo: NEW TRANSLATION
 RULE_OPTION_MNT_SERBIAN_UNION: "Srbský nacionalismus" # todo: NEW TRANSLATION
 RULE_OPTION_MNT_SERBIAN_UNION_DESC: "§8Srbské nacionalistické strany§! se dostávají k moci, povyšují srbskou kulturu a autoritu pravoslavné církve a hospodářsky i politicky sbližují Černou Horu se Srbskem a Ruskem. Vývoj Černé Hory vrcholí politickou unií se Srbskem a ruší nezávislost získanou před jednou generací." # todo: NEW TRANSLATION
 RULE_OPTION_MNT_MONARCHIST_RESTORATION: "Monarchistická obnova" # todo: NEW TRANSLATION
 RULE_OPTION_MNT_MONARCHIST_RESTORATION_DESC: "Černohorští §8monarchisté a tradicionalisté§! obnovují dynastii rodu Petrović-Njegoš a zakotvují pravoslavné křesťanství jako státní náboženství. Černá Hora usiluje o obnovu orientovanou na Rusko a soustředěnou kolem církve, mimo západní řád a evropské struktury." # todo: NEW TRANSLATION
 RULE_OPTION_MNT_NEUTRAL_HARBOUR: "Ozbrojená neutralita" # todo: NEW TRANSLATION
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC: "Đukanovićova vláda odmítá integraci do EU a NATO i srbskou a ruskou orientaci a podle švýcarského vzoru vyhlašuje trvalou ozbrojenou neutralitu. Svobodný přístav Černé Hory se stává obchodním střediskem otevřeným všem blokům a využívá strategické polohy na Jadranu k maximálnímu obchodnímu prospěchu." # todo: NEW TRANSLATION
 RULE_OPTION_MNT_SOCIALIST_REVIVAL: "Socialistické obrození" # todo: NEW TRANSLATION
 RULE_OPTION_MNT_SOCIALIST_REVIVAL_DESC: "Moci se ujímá §8komunistické a neo-jugoslávské hnutí§!, znárodňuje ekonomiku po titoistickém vzoru a podporuje obnovu panjugoslávských politických struktur. Černá Hora se pokouší obnovit jugoslávskou federaci ze svého území směrem ven a znovu sjednotit jižní Slovany pod socialistickou vládou." # todo: NEW TRANSLATION
 BRM_AI_BEHAVIOR: "@BRM Myanmar" # todo: CHANGED
 RULE_OPTION_BRM_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_BRM_HISTORICAL_DESC: "§8Národní liga pro demokracii§! se ujímá vlády, zatímco §8Tatmadaw§! si ponechává vyhrazená křesla a ministerstva obrany a Rohingové jsou pod tlakem, nikoli vyháněni. Myanmar zůstává v ASEAN, etnická povstání pokračují a generálové nepřicházejí o nic, co by si nemohli vzít zpět." # todo: NEW TRANSLATION
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY: "Maják demokracie" # todo: NEW TRANSLATION
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY_DESC: "§8Národní liga pro demokracii§! ruší ústavní úlohu armády a buduje federální stát s etnickou autonomií a občanstvím pro Rohingy. Myanmar se stává mnohonárodnostní federální demokracií a obrací se k regionálním partnerstvím." # todo: NEW TRANSLATION
 RULE_OPTION_BRM_AN_IRON_FIST: "Železná pěst" # todo: NEW TRANSLATION
 RULE_OPTION_BRM_AN_IRON_FIST_DESC: "§8Tatmadaw§! upevňuje vojenskou vládu a drtí opozici, potlačuje etnická povstání a odmítá mezinárodní tlak na demokratické reformy. Myanmar opouští ASEAN, vyhání Rohingy a obrací se ke konfrontaci se sousedy." # todo: NEW TRANSLATION
 RULE_OPTION_HOL_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_HOL_HISTORICAL_DESC: "§8Labour§! po šoku kolem Fortuyna předává zemi §8křesťanským demokratům§!, §8liberálové§! ji drží po generaci a poté se střídají §8Strana pro svobodu§! a §8Demokraté 66§!. Nizozemsko zůstává za každé z těchto koalic kotvou NATO a Evropské unie." # todo: NEW TRANSLATION
 RULE_OPTION_HOL_OPEN_VERDICT: "Otevřený verdikt" # todo: NEW TRANSLATION
 RULE_OPTION_HOL_OPEN_VERDICT_DESC: "Nizozemsko kráčí stejnou parlamentní cestou, ale nic nepředjímá: koalici sestavuje strana, která vyhraje volby, včetně §8populistů§!. Spojenci nikdy zcela nevědí, s jakou vládou v Haagu budou příště jednat." # todo: NEW TRANSLATION
 RULE_OPTION_HOL_WESTERN_MONARCHY: "Oranžská obnova" # todo: NEW TRANSLATION
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC: "Obnovené místodržitelství vládne prostřednictvím koruny, zatímco §8Generální stavy§! si drží kontrolu nad pokladnou a znovuzaložená §8Západoindická společnost§! vrací Nizozemsko do Atlantiku. Surinam a Guyana se vracejí pod nizozemskou vládu, Karibik je spravován pomocí pomoci a ambasád a Lucembursko, Irsko i Anglie jsou osobní unií spojeny s rodem Oranžských." # todo: NEW TRANSLATION
 RULE_OPTION_HOL_NATIONALIST_MONARCHY: "Bojovná koruna" # todo: NEW TRANSLATION
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC: "Královská pravomoc je obnovena, volby pozastaveny a §8Nizozemská východoindická společnost§! znovu vybudována jako nástroj dobývání v Indickém oceánu. Cejlon, Kapsko a Batávie jsou získány zpět silou a Lucembursku, Irsku i Anglii jsou předána ultimáta namísto sňatkových smluv." # todo: NEW TRANSLATION
 RULE_OPTION_HOL_NVU: "Nederlandse Volks-Unie" # todo: NEW TRANSLATION
 RULE_OPTION_HOL_NVU_DESC: "§8Nederlandse Volks-Unie§! vyrůstá z okraje, táhne na Binnenhof a přetváří ekonomiku podle korporativistických a autarkických zásad po odstranění opozice. Dietsland je sjednocen a Nizozemsko si nárokuje vedení germánské Evropy proti Francii a Británii." # todo: NEW TRANSLATION
 NEN_AI_BEHAVIOR: "@NEN Nová Anglie" # todo: NEW TRANSLATION
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "Povstání Zelených hor" # todo: NEW TRANSLATION
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "Národní vláda odmítne vermontský požadavek přesunout sídlo vlády do Montpelieru a nechá odpor narůstat. §8Zelenohorské§! okresy povstanou a Nová Anglie bude muset potlačit povstání v jednom z vlastních států §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "Druhé nové hlavní město" # todo: NEW TRANSLATION
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "Jen málokomu v hlavním městě bude stát za to bojovat kvůli adrese, takže vláda vermontskému požadavku vyhoví a přesune se do Montpelieru. Nová Anglie do sporu nic nevloží a udrží své severní státy spokojené §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 NIG_AI_BEHAVIOR: "@NIG Nigérie" # todo: CHANGED
 RULE_OPTION_NIG_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_NIG_HISTORICAL_DESC: "§8Lidová demokratická strana§! drží federální centrum a udržuje sever i jih v nejisté náboženské rovnováze, zatímco amnestie namísto síly řeší deltu Nigeru. Nigérie zůstává kotvou západní Afriky a vyváží mírové jednotky, nikoli nestabilitu." # todo: NEW TRANSLATION
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY: "Sociálnědemokratická Nigérie" # todo: NEW TRANSLATION
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY_DESC: "§8Lidová strana celé Nigérie§! láme sevření vládnoucí strany a obrací federaci ke státem řízenému průmyslu, veřejnému zdravotnictví a široké sociální síti. Přerozdělující Abuja utrácí příjmy z ropy doma a zahraniční investoři hledí jinam v regionu." # todo: NEW TRANSLATION
 RULE_OPTION_NIG_CHRISTIAN_NATION: "Křesťanská Nigérie" # todo: NEW TRANSLATION
 RULE_OPTION_NIG_CHRISTIAN_NATION_DESC: "Abuja ruší šaríu v severních státech a přestavuje federální vládu kolem §8církve§!, přičemž proti vzdorujícím kazatelům nasazuje křesťanské milice. Sever je pacifikován silou, nikoli vyjednáváním, a muslimští sousedé Nigérie ochlazují vztahy." # todo: NEW TRANSLATION
 RULE_OPTION_NIG_CALIPHATE: "Západoafrický chalífát" # todo: NEW TRANSLATION
 RULE_OPTION_NIG_CALIPHATE_DESC: "Šaría se šíří ze severních států, dokud §8Boko Haram§! nesedí uvnitř vlády místo boje proti ní a federální republika neustoupí chalífátu. Sousedé Nigérie čelí expanzivnímu islámskému státu, který velí největší armádě západní Afriky." # todo: NEW TRANSLATION
 NKO_AI_BEHAVIOR: "@NKO Severní Korea" # todo: CHANGED
 RULE_OPTION_NKO_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_NKO_HISTORICAL_DESC: "Nejmladší syn Kim Čong-ila je připravován jako nástupce a dědí stát. §8Dělnická strana Koreje§! znovu prosazuje velení nad generály, než se zaváže k §8Pjongdžinu§!: hlavicím i spotřebnímu zboží zároveň. Dynastie drží, tržní obchodníci jsou tolerováni, nikoli však důvěryhodní, a poloostrov zůstává zamrzlý tam, kde jej zanechalo příměří." # todo: NEW TRANSLATION
 RULE_OPTION_NKO_KIM_JONG_NAM: "Reformní dědic" # todo: NEW TRANSLATION
 RULE_OPTION_NKO_KIM_JONG_NAM_DESC: "Starší bratr v exilu vítězí v boji o nástupnictví a obrací §8Dělnickou stranu Koreje§! k čínskému typu otevírání, přičemž vyměňuje §8čučche§! za zvláštní ekonomické zóny, společné podniky a nakonec hlasovací lístek. Pchjongjang mění izolaci za investice a Soul konečně získává souseda, s nímž může vyjednávat." # todo: NEW TRANSLATION
 RULE_OPTION_NKO_MILITARY_JUNTA: "Generálové přebírají moc" # todo: NEW TRANSLATION
 RULE_OPTION_NKO_MILITARY_JUNTA_DESC: "Generální štáb odmítá oba Kimovy dědice a přebírá moc sám, zachovává §8songun§! a čistí rodinu, která přežila svou užitečnost. Čínský obchod udržuje zemi při životě, zatímco armáda se zodpovídá žádné straně a každý soused musí počítat s jaderným státem řízeným vojáky." # todo: NEW TRANSLATION
 RULE_OPTION_NRY_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_NRY_HISTORICAL_DESC: "Centristická koalice ustupuje a §8Labour§! znovu přebírá vládu, utrácí ropný fond za sociální stát a udržuje Norsko pevně uvnitř aliance. Oslo si buduje pověst prostředníka mírových jednání a rozvojové pomoci, zatímco zůstává mimo Unii, do níž vstoupili jeho sousedé." # todo: NEW TRANSLATION
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES: "Křesťanský střed" # todo: NEW TRANSLATION
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES_DESC: "§8Křesťanská lidová strana§! si udržuje premiérský úřad a zapisuje rodinnou morálku, rozvojovou pomoc a velkorysou kvótu pro uprchlíky do národní politiky. Norsko cvičí s aliancí, ale Brusel si drží od těla a přijímá migranty, které jeho jižní sousedé nedokážou přijmout." # todo: NEW TRANSLATION
 RULE_OPTION_NRY_PROGRESS: "Norsko Norům" # todo: NEW TRANSLATION
 RULE_OPTION_NRY_PROGRESS_DESC: "§8Strana pokroku§! se vymaní z opozice a utrácí ropné bohatství za daňové škrty, nemocniční oddělení a péči o seniory namísto zahraniční pomoci. Norsko se centralizuje, zpřísňuje imigrační zákony a obrací chladnější tvář k severským sousedům, kteří s ním kdysi počítali." # todo: NEW TRANSLATION
 RULE_OPTION_POL_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_POL_HISTORICAL_DESC: "Polsko dokončuje transformaci pod postkomunistickou levicí, vstupuje do Evropské unie a poté předává zemi §8Právu a spravedlnosti§!, které vládne proti Moskvě a opírá se o Washington. Varšava se stává nejhlasitějším východním hlasem v NATO a trvalým dráždidlem pro Berlín i Brusel." # todo: NEW TRANSLATION
 RULE_OPTION_POL_CIVIC_PLATFORM: "Roky Občanské platformy" # todo: NEW TRANSLATION
 RULE_OPTION_POL_CIVIC_PLATFORM_DESC: "§8Občanská platforma§! udržuje vládu a sází budoucnost Polska na euro, německé investice a fondy, které s nimi přicházejí. Varšava se stává nejspolehlivějším partnerem Bruselu v regionu a zároveň zachovává svůj kurz vůči Moskvě." # todo: NEW TRANSLATION
 RULE_OPTION_POL_WALESA: "Wałęsa se vrací" # todo: NEW TRANSLATION
 RULE_OPTION_POL_WALESA_DESC: "§8Křesťanští demokraté§! vynášejí Lecha Wałęsu do prezidentského paláce na vzpomínce Solidarity. Polsko zůstává pevně uvnitř NATO a svou důvěru utrácí za obnovu armády, nikoli za honbu za evropským hlavním proudem." # todo: NEW TRANSLATION
 RULE_OPTION_POL_KORWIN_COMMONWEALTH: "Korwin a Společenství" # todo: NEW TRANSLATION
 RULE_OPTION_POL_KORWIN_COMMONWEALTH_DESC: "Janusz Korwin-Mikke a §8Unie reálné politiky§! vracejí stát k jeho základům a ucházejí se o Litvu, Bělorusko a Ukrajinu jako o rovnocenné partnery. Obnovené Společenství roste mezi Německem a Ruskem, aniž by kdy opustilo západní alianci." # todo: NEW TRANSLATION
 RULE_OPTION_POL_KORWIN_EAST: "Korwin se obrací na východ" # todo: NEW TRANSLATION
 RULE_OPTION_POL_KORWIN_EAST_DESC: "Janusz Korwin-Mikke a §8Unie reálné politiky§! vyřizují staré polské účty přímým jednáním s Moskvou a Minském. Varšava opouští západní tábor, prosazuje nárok na Lvov a zaujímá místo v OSKB." # todo: NEW TRANSLATION
 RULE_OPTION_POL_FALANGA: "Vzestup Falangy" # todo: NEW TRANSLATION
 RULE_OPTION_POL_FALANGA_DESC: "Pouliční milice a sjednocená nacionalistická fronta vynášejí §8Falangu§! z okraje do vlády. Polsko opouští Evropskou unii i NATO ve prospěch konfesního, militarizovaného státu, který zneklidňuje všechny své sousedy." # todo: NEW TRANSLATION
 RULE_OPTION_POL_RED_DREAM: "Rudý sen" # todo: NEW TRANSLATION
 RULE_OPTION_POL_RED_DREAM_DESC: "Druhá revoluce staví kormidlo do rukou §8Polské socialistické strany§! a pohřbívá privatizaci transformace. Polsko se rozchází se Západem, pozastavuje volby a obnovuje se jako dělnická republika." # todo: NEW TRANSLATION
 RULE_OPTION_POL_PEOPLES_ARMY: "Lidová armáda" # todo: NEW TRANSLATION
 RULE_OPTION_POL_PEOPLES_ARMY_DESC: "Jestřábi z §8Unie polských komunistů§! uchvacují revoluci a obnovují Lidovou armádu jako páteř státu. Polsko se stává posádkou nového východního bloku a hledí na Západ s otevřeným nepřátelstvím." # todo: NEW TRANSLATION
 RULE_OPTION_ROM_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_ROM_HISTORICAL_DESC: "§8Sociálnědemokratická strana§! pod Iliescuem a Năstasem bojuje proti endemické korupci novým protikorupčním ředitelstvím, zároveň privatizuje průmysl a obnovuje ekonomiku. Rumunsko vstupuje do NATO a poté do Evropské unie a zajišťuje si postavení západní demokracie ukotvené v institucích, nikoli v kultu osobnosti." # todo: NEW TRANSLATION
 RULE_OPTION_ROM_NATIONAL_LIBERAL: "Liberální republika" # todo: NEW TRANSLATION
 RULE_OPTION_ROM_NATIONAL_LIBERAL_DESC: "§8Národní liberální strana§! získává moc prosazováním rovné daně, liberalizace trhu a decentralizace, které mají uvolnit soukromé podnikání a osobní iniciativu. Rumunsko buduje evropskou identitu kolem liberálních principů volného trhu a integruje se na Západ hlouběji, než by dovolila jeho sociálnědemokratická alternativa." # todo: NEW TRANSLATION
 RULE_OPTION_ROM_PEASANT_PARTY: "Křesťanští demokraté drží" # todo: NEW TRANSLATION
 RULE_OPTION_ROM_PEASANT_PARTY_DESC: "§8Křesťanskodemokratická národní rolnická strana§! přežívá zhroucení Demokratické konvence a udržuje venkov ve středu rumunské politiky, přičemž zdůrazňuje venkovské investice, agrární obrodu a náboženský konzervatismus. Restituce půdy vrací majetek těm, o které jej komunisté připravili, a dává rolníkům podíl na novém řádu." # todo: NEW TRANSLATION
 RULE_OPTION_ROM_DEMOCRATIC_PARTY: "Strana Evropy" # todo: NEW TRANSLATION
 RULE_OPTION_ROM_DEMOCRATIC_PARTY_DESC: "§8Demokratická strana§! pod Băsescem zaujímá politický střed a poté slučuje sociálnědemokratické a konzervativní křídlo země do jediné otevřeně proevropské strany. Evropská integrace se stává určujícím cílem rumunské politiky a všechny ostatní zájmy se podřizují práci na vstupu na Západ." # todo: NEW TRANSLATION
 RULE_OPTION_ROM_RESTORED_MONARCHY: "Koruna se vrací" # todo: NEW TRANSLATION
 RULE_OPTION_ROM_RESTORED_MONARCHY_DESC: "Demokratická konvence se znovu skládá dohromady, vyhlašuje referendum o monarchii a §8král Michal I.§! se vrací na trůn, čímž po padesáti letech komunismu obnovuje symbolickou autoritu koruny. Rumunské vedení si nárokuje starobylé právo koruny na vládu nad všemi Rumuny včetně těch v Moldavsku, na Ukrajině i jinde." # todo: NEW TRANSLATION
 RULE_OPTION_ROM_GREATER_ROMANIA: "Velké Rumunsko" # todo: NEW TRANSLATION
 RULE_OPTION_ROM_GREATER_ROMANIA_DESC: "§8Strana Velkého Rumunska§! Cornelia Vadima Tudora uchvacuje prezidentský úřad a mění bezpečnostní služby i tisk v nástroje stranického státu, přičemž upevňuje moc strachem a propagandou. Rumunsko usiluje o násilné znovusjednocení všech rumunských zemí, ohrožuje Moldavsko, Maďarsko, Bulharsko, Ukrajinu a Srbsko a mění region v ohnisko konfliktu." # todo: NEW TRANSLATION
 SOV_AI_BEHAVIOR: "@SOV Russia" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_HISTORICAL_DESC: "Rusko obnovuje vertikálu moci pod §8Jednotným Ruskem§!, podrobuje si oligarchy a mění energetické bohatství v obnovené postavení velmoci. Jeho sousedé čelí státu, který obsazuje Krym, podporuje republiky Donbasu a nakonec silou postupuje na Ukrajinu." # todo: NEW TRANSLATION
 RULE_OPTION_SOV_OLIGARCHS: "Republika oligarchů" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_OLIGARCHS_DESC: "Muži, kteří koupili Rusko při privatizaci, si ho ponechávají a §8oligarchové§! řídí stát jako holdingovou společnost pro vlastní majetek. Zahraniční kapitál nachází všechny dveře otevřené, zatímco armáda a státní pokladna platí účet za toto uspořádání." # todo: NEW TRANSLATION
 RULE_OPTION_SOV_LIBERAL_REFORM: "Liberální obrat" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_LIBERAL_REFORM_DESC: "§8Jabloko§! a §8Svaz pravých sil§! vítězí ve sporu o budoucnost Ruska a obnovují soudy, tisk i ekonomiku podle západních vzorů. Moskva vyměňuje vliv na sousedy za partnerství s Evropou a Spojenými státy." # todo: NEW TRANSLATION
 RULE_OPTION_SOV_COMMUNIST_REVIVAL: "Rudé obrození" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_COMMUNIST_REVIVAL_DESC: "§8Komunistická strana Ruské federace§! se ujímá moci se slibem zvrátit privatizaci a znovu shromáždit sovětské republiky. Renacionalizace doma a obnovený východní blok v zahraničí znovu staví Rusko do čela soupeřícího tábora." # todo: NEW TRANSLATION
 RULE_OPTION_SOV_NATIONALIST: "Velké Rusko" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_NATIONALIST_DESC: "§8Liberálnědemokratická strana§! vynáší rozhořčení k moci a pouští se do každé hranice, o níž se domnívá, že Rusku náleží. Od Baltu po Střední Asii se sousedé stávají nároky, které je třeba prosadit, nikoli státy, s nimiž je třeba jednat." # todo: NEW TRANSLATION
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK: "Národněbolševický řád" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK_DESC: "§8Národní bolševici§! spojují rudou a hnědou v revoluční stát, který se nezodpovídá liberálům ani oligarchům. Rusko násilím shromažďuje ruské země a považuje postsovětské hranice za dočasnou urážku." # todo: NEW TRANSLATION
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE: "Železný prezident" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE_DESC: "Dmitrij Medveděv odmítá předat prezidentský úřad zpět a buduje vlastní bezpečnostní stát nad tím, který zdědil. Tandem se veřejně rozpadá a lidé kolem jeho předchůdce jsou vyhnáni z ruské politiky." # todo: NEW TRANSLATION
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL: "Medveděvovo tání" # todo: NEW TRANSLATION
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL_DESC: "Dmitrij Medveděv uskutečňuje svůj modernizační program, uvolňuje sevření bezpečnostních služeb a láká západní technologie i kapitál. Rusko doma liberalizuje a v zahraničí zmírňuje kurz, zatímco siloviki definitivně prohrávají spor." # todo: NEW TRANSLATION
 SAU_AI_BEHAVIOR: "@SAU Saúdská Arábie" # todo: CHANGED
 RULE_OPTION_SAU_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_HISTORICAL_DESC: "§8Rod Saúdů§! udržuje trůn nepřerušeným nástupnictvím, utrácí příjmy z ropy za diverzifikaci mimo ropný sektor a zachovává americké bezpečnostní vztahy, zatímco zadržuje Írán, dokud Peking nezprostředkuje oteplení. Saúdská Arábie zůstává kotvou Zálivu a hlavním partnerem každé monarchie podél něj." # todo: NEW TRANSLATION
 RULE_OPTION_SAU_KHALEEJI_UNION: "Chalídžská unie" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_KHALEEJI_UNION_DESC: "Království mění Radu pro spolupráci v Zálivu z diskusního fóra v jediný stát: nejprve společná měna a velení, poté politická unie pod Rijádem. Menší monarchie Zálivu jsou pohlceny a přestávají existovat jako nezávislé země." # todo: NEW TRANSLATION
 RULE_OPTION_SAU_FAISALITE_KINGDOM: "Fajsalistická obnova" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_FAISALITE_KINGDOM_DESC: "Reakční proud v královské rodině vítězí v nástupnictví, obnovuje §8vahhábistické ulamá§! k autoritě, kterou měli za krále Fajsala, a vyhání ze země zahraniční peníze i základny. Království buď zcela uzavírá hranice, nebo se ustavuje jako třetí pól vedoucí muslimský svět proti oběma supervelmocím." # todo: NEW TRANSLATION
 RULE_OPTION_SAU_MILITARY_RULE: "Převrat důstojníků" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_MILITARY_RULE_DESC: "Pravidelná armáda, které jsou odpírány prostředky, zatímco Národní garda si ponechává privilegia, sesazuje krále a vládne prostřednictvím §8Nejvyšší vojenské rady§!. Důstojníci řídí Záliv, který už neví, kdo mluví za Rijád, a jejich moc trvá jen tak dlouho, jak dlouho dokážou kupovat legitimitu." # todo: NEW TRANSLATION
 RULE_OPTION_SAU_BAATHIST_REPUBLIC: "Arabská socialistická republika" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_BAATHIST_REPUBLIC_DESC: "Po zániku monarchie přebírá republiku §8Arabská socialistická strana Baas§!, znárodňuje klíčová odvětví a obnovuje armádu jako předvoj arabské jednoty. Zahraniční posádky dostávají na celém poloostrově výpověď a každé arabské hlavní město je pozváno do jediného státu." # todo: NEW TRANSLATION
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC: "Šíitská republika" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC_DESC: "Dlouho potlačované §8šíitské strany§! Východní provincie dědí republiku a vybírají mezi ústavním urovnáním a chomejnistickou cestou. Největší ropné rezervy Zálivu mění stranu a Teherán získává spojence, kterého hledal po desetiletí." # todo: NEW TRANSLATION
 RULE_OPTION_SAU_PEOPLES_REPUBLIC: "Rudá republika" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_PEOPLES_REPUBLIC_DESC: "§8Komunistická strana§! přebírá republiku, přímo znárodňuje ropná pole a mění poloostrov v základnu revoluce napříč arabským světem. Rijád buď podepisuje smlouvu s Moskvou, nebo vede nezúčastněný blok, zatímco monarchie Zálivu se probouzejí k nepříteli na hranici." # todo: NEW TRANSLATION
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC: "Demokratický experiment" # todo: NEW TRANSLATION
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC_DESC: "§8Národní demokratické shromáždění§! vítězí v ústavodárných volbách a píše liberální ústavu s voleným Madžlisem, nezávislým soudnictvím a svobodným tiskem. Západ získává první arabskou demokracii v Zálivu a každá sousední monarchie musí vysvětlit, proč jí není." # todo: NEW TRANSLATION
 SIN_AI_BEHAVIOR: "@SIN Singapore" # todo: NEW TRANSLATION
 SIN_GLOBAL_DIPLOMACY: "Globální diplomacie" # todo: NEW TRANSLATION
 SIN_GLOBAL_DIPLOMACY_DESC: "Singapur vynaloží své bohatství na svolávání jednání, nejen na obchod, a učiní z ostrova místo, kde se asijská rivalita mírní prostřednictvím rozhovorů. Malé státy dostanou sluch, který by jinak neměly, a velmoci se setkají na neutrální půdě." # todo: CHANGED
 SIN_SINGAPORE_ALONE: "Singapur sám" # todo: NEW TRANSLATION
 SIN_SINGAPORE_ALONE_DESC: "§8Strana lidové akce§! vládne bez přerušení a ponechá obranu ostrova ve vlastních rukou, protože nevěří žádné záruce, za kterou sama nezaplatila. Singapur zůstane bohatý, ozbrojený a nezařazený a nebude se stavět na žádnou stranu více, než vyžaduje obchod." # todo: CHANGED
 SIN_PRESSURE_SOUTH_ASIAN_SEAS: "Tlak na jižní Asijská moře" # todo: NEW TRANSLATION
 SIN_PRESSURE_SOUTH_ASIAN_SEAS_DESC: "Singapur obrátí své námořnictvo i peníze navenek a začne určovat podmínky v průlivech, na nichž závisí. Jihovýchodní Asie získá malou mocnost ochotnou hlídat její námořní trasy a větší sousedé si toho všimnou." # todo: CHANGED
 SOL_AI_BEHAVIOR: "@SOL Solomon Islands" # todo: NEW TRANSLATION
 RULE_OPTION_SOL_DYNAMIC: "Dynamické chování" # todo: NEW TRANSLATION
 RULE_OPTION_SOL_DYNAMIC_AI_DESC: "Šalomounovy ostrovy se řídí podmínkami, které naleznou, zvažují, kdo se o ně uchází, jak se chovají provincie a zda dějiny probíhají podle scénáře. Žádné dvě hry nepošlou Honiaru úplně stejnou cestou." # todo: NEW TRANSLATION
 RULE_OPTION_AUSTRALIAN_PEACE: "Intervence a amnestie" # todo: NEW TRANSLATION
 RULE_OPTION_AUSTRALIAN_PEACE_AI_DESC: "  @SOL Šalomounovy ostrovy budou usilovat o mírový proces podporovaný jejich největším vlivovým aktérem. \nPOZNÁMKA: @AST Austrálie je při začátku hry největším vlivovým aktérem na @SOL Šalomounových ostrovech." # todo: NEW TRANSLATION
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP: "Dubnové komuniké selhává – rastafariánský převrat" # todo: NEW TRANSLATION
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP_AI_DESC: "Bartholomew Ulufa'alu nedokáže prosadit dohody z Mundy, §8Hnutí za svobodu Isatabu§! se vrací do války a §8Malaitské orlí síly§! ho pod vedením Jimmyho Lusibaey sesazují. Ostrovy přecházejí pod velitele milice a Austrálie nachází na svém severním přístupu ozbrojený zhroucený stát." # todo: NEW TRANSLATION
 RULE_OPTION_AST_REJECTS_TEE_REBEL: "Převrat Te'e" # todo: NEW TRANSLATION
 RULE_OPTION_AST_REJECTS_TEE_REBEL_AI_DESC: "Žádná regionální mocnost nezasahuje a Andrew Te'e přebírá velení §8Hnutí za svobodu Isatabu§! bez soupeře. Šalomounovy ostrovy upadají do občanské války a malaitští osadníci z Guadalcanalu jsou hromadně vyhnáni." # todo: NEW TRANSLATION
 CSA_AI_BEHAVIOR: "@CSA Jižní republika" # todo: CHANGED
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "Jižní Amerika" # todo: NEW TRANSLATION
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "Jižní republika zůstane věrná staré americké myšlence a vydá se obnovit Unii pod vlastní vlajkou. Nabídne se jako legitimní nástupce Spojených států, nikoli jako odtržený stát §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "Zlatý kruh" # todo: NEW TRANSLATION
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "Republika obnoví §8Zlatý kruh§!, starý plán Konfederace na říši kolem Mexického zálivu a Karibiku. Jižní republika hledí do budoucnosti na jih a její sousedé se ocitnou v něčí sféře vlivu §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "Východní identita" # todo: NEW TRANSLATION
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "Republika odmítne nést americké i konfederační dědictví a vybuduje novou identitu na svém cajunském a kreolském dědictví. Pobřeží Mexického zálivu se stane vlastním národem, nikoli nástupnickým státem kohokoli §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "Florida Vzpoura" # todo: NEW TRANSLATION
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "Jižní nacionalisté odmítnou výsledek na Floridě a chopí se zbraní proti vládě, kterou označují za ukradenou. Mladá republika se v prvních letech rozervá zevnitř §Ra tato cesta existuje pouze tehdy, když je pravidlo Spojených států nastaveno na Éru po Unii nebo Velký kolaps§!." # todo: CHANGED
 SPR_CONSERVATIVE_LEANINGS: "Konzervativní sklony" # todo: NEW TRANSLATION
 SPR_CONSERVATIVE_LEANINGS_DESC: "§8Lidová strana§! a širší španělská pravice ovládnou Cortes a budou vládnout na tržně liberální, atlantistické linii. Španělsko zůstane pevným členem NATO a nenápadným partnerem v Bruselu." # todo: CHANGED
 SPR_RENACIMIENTO_NACIONALISTA: "Nacionalistické znovuzrození" # todo: NEW TRANSLATION
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "§8Vox§! a nacionalistická pravice uniknou z okraje a převezmou vládu. Španělsko se obrátí proti autonomním společenstvím i migraci a místo následování Bruselu se s ním začne přít." # todo: CHANGED
 SPR_NACION_UNIDAD_IMPERIO: "Národní jednota impéria" # todo: NEW TRANSLATION
 SPR_NACION_UNIDAD_IMPERIO_DESC: "§8La Falange§! se vrátí z politické divočiny a obnoví španělský stát na národně-syndikalistickém modelu. Cortes ustoupí vertikálním syndikátům a Španělsko se obrátí ke své staré říši namísto k Evropě." # todo: CHANGED
 SPR_SOCIALISM_RISING: "Socialismus vzrůstá" # todo: NEW TRANSLATION
 SPR_SOCIALISM_RISING_DESC: "§8Španělská socialistická dělnická strana§! a širší levice udrží moc po generaci a posunou sociální stát dále než kterákoli vláda před nimi. Španělsko se stane sociálnědemokratickým argumentem v Evropě a strhne s sebou Středomoří." # todo: CHANGED
 SPR_COMMUNIST_REVISIONISM: "Komunistický revisionismus" # todo: NEW TRANSLATION
 SPR_COMMUNIST_REVISIONISM_DESC: "§8Komunistická strana Španělska§! převezme stát, který socialisté nechtěli, a republika bude obnovena po marxistických liniích. Španělsko opustí západní tábor a NATO přijde o své jižní křídlo." # todo: CHANGED
 SPR_THE_OLD_WAYS: "Staré způsoby" # todo: NEW TRANSLATION
 SPR_THE_OLD_WAYS_DESC: "Koruna a církev budou znovu postaveny do středu státu a Španělsko se pustí do obnovy říše, kterou ztratilo. Gibraltar, Maghreb a stará místokrálovství budou považovány za nedokončenou záležitost, nikoli za historii." # todo: CHANGED
 RULE_OPTION_NORTHERN_AMBITION: "Severní ambice" # todo: NEW TRANSLATION
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "Švédská nacionalistická pravice zesílí a promění severní nálady v program unie. Stockholm se vydá sjednotit Skandinávii a Pobaltí pod obnovenou švédskou říší, smlouvami, kde to půjde, a silou, kde to bude nutné." # todo: CHANGED
 RULE_OPTION_SWE_PRO_WESTERN: "Jdi na Západ" # todo: NEW TRANSLATION
 RULE_OPTION_SWE_PRO_WESTERN_AI_DESC: "Švédsko opustí dvě století neangažovanosti a zaujme své místo v NATO i ve středu Evropské unie. Balt se stane spojeneckým mořem a Rusko zjistí, že jeho severní přístupy jsou uzavřené." # todo: CHANGED
 RULE_OPTION_SWE_RED_SWEDEN: "Švédská republika" # todo: NEW TRANSLATION
 RULE_OPTION_SWE_RED_SWEDEN_AI_DESC: "Švédská levice zcela ovládne Riksdag, zruší monarchii a vyhlásí republiku. Sociální stát bude posunut za hranice sociální demokracie k veřejnému vlastnictví a Švédsko přestane být neutrálním vzorem kohokoli." # todo: CHANGED
 SWI_AI_BEHAVIOR: "@SWI Switzerland" # todo: NEW TRANSLATION
 SWI_NATO_EU: "Euroatlantická integrace" # todo: NEW TRANSLATION
 SWI_NATO_EU_DESC: "Švýcarsko opustí neutralitu, vstoupí do NATO a bude usilovat o kandidaturu do Evropské unie. Pokud NATO nebude existovat, zůstane samo a rozpustí federaci." # todo: NEW TRANSLATION
 SWI_NEUTRAL: "Ozbrojená neutralita" # todo: NEW TRANSLATION
 SWI_NEUTRAL_DESC: "Švýcarsko si zachová ozbrojenou neutralitu a zůstane mimo každou nabízenou alianci. Bern obchoduje se všemi stranami, zprostředkovává mezi nimi a odmítá být započítán do číhokoli tábora." # todo: NEW TRANSLATION
 SYR_AI_BEHAVIOR: "@SYR Sýrie" # todo: CHANGED
 RULE_OPTION_SYR_HISTORICAL: "Historické AI" # todo: NEW TRANSLATION
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez al-Assad bude následován svým nejstarším synem Bassár al-Assádem. Bashar si udrží Sýrii jako zemi orientovanou na Rusko s vyváženým zaměřením na diplomacii, vojenskou a ekonomiku." # todo: NEW TRANSLATION
 RULE_OPTION_SYR_IRON_LADY: "Železná dáma Sýrie" # todo: NEW TRANSLATION
 RULE_OPTION_SYR_IRON_LADY_DESC: "Hafez al-Assad bude následován dcerou Bushra al-Assád. Bushra zaujme vyváženější postoj mezi velmocemi se zaměřením na diplomacii a ekonomiku." # todo: NEW TRANSLATION
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Sýrský divoch" # todo: NEW TRANSLATION
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Hafeze al-Assada vystřídá jeho nejmladší syn Maher namísto Bašára a armáda převezme stát bez výhrad. Sýrie se znovu vyzbrojí pro Velkou Sýrii a Levanta získá agresivní mocnost namísto opatrné." # todo: CHANGED
 RULE_OPTION_SYR_NEW_ASSAD: "Nový al-Assád" # todo: NEW TRANSLATION
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Hafez al-Assad bude následován jeho bratrem Rifátem al-Assád po Damascus Spring. Rifát se zaměří na pro-Saúdskou politiku se zaměřením na diplomacii a ekonomiku." # todo: NEW TRANSLATION
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Damaské jaro" # todo: NEW TRANSLATION
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "Salony §8Damašského jara§! nebudou nikdy uzavřeny a reformátoři promění období debat ve změnu vlády. Sýrie se stane fungující demokracií a baasistický řád přijde o své druhé hlavní město." # todo: CHANGED
 SIA_AI_BEHAVIOR: "@SIA Thailand" # todo: NEW TRANSLATION
 RULE_OPTION_SIA_DEFAULT_AI_DESC: "§8Thai Rak Thai§! a její nástupkyně ovládají volební urny, zatímco demokraté a palác s nimi soupeří a generálové přebírají vládu pokaždé, když tak neučiní soudy. Thajsko zůstává smluvním spojencem Washingtonu bez skutečného vedení a ponechává své staré iredentistické nároky tam, kde jsou." # todo: NEW TRANSLATION
 RULE_OPTION_SIA_PAN_THAI: "Panthajská politika (Velké Thajsko)" # todo: NEW TRANSLATION
 RULE_OPTION_SIA_PAN_THAI_AI_DESC: "Thajsko znovu zbrojí a prosazuje nároky, kterých se vzdalo vůči Laosu, Kambodži a severním malajským státům. Bangkok se činí hegemonem pevninské jihovýchodní Asie a jeho sousedé podle toho zbrojí." # todo: NEW TRANSLATION
 RULE_OPTION_SIA_SEATO_LEADER: "Vůdce SEATO" # todo: NEW TRANSLATION
 RULE_OPTION_SIA_SEATO_LEADER_AI_DESC: "Thajsko obnovuje §8SEATO§! a shromažďuje jihovýchodní Asii do obranného paktu řízeného z Bangkoku, nikoli z Washingtonu. Region získává vlastní bezpečnostní řád a velmoci s ním musí jednat jako s blokem." # todo: NEW TRANSLATION
 RULE_OPTION_SIA_ALT_HISTORY: "Alternativní historie" # todo: NEW TRANSLATION
 RULE_OPTION_SIA_ALT_HISTORY_AI_DESC: "Thajsko se vydává komunistickou cestou a vzdaluje se Washingtonu i Západu. Nebude prosazovat iredentistické nároky ani zakládat SEATO." # todo: NEW TRANSLATION
 PMR_AI_BEHAVIOR: "@PMR Transnistria" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_HISTORICAL_DESC: "Tiraspol zůstává v rukou Igora Smirnova a nástupců, kteří dědí jeho republiku, a mění rozhovory s Kišiněvem za hlubší závislost na ruském plynu, rublech a mírotvorcích. Konflikt na Dněstru zůstává zamrzlý a Moldavsko nedostává nic, co by mohlo nazvat urovnáním." # todo: NEW TRANSLATION
 RULE_OPTION_PMR_DEMOCRATIC: "Mosty do Kišiněva" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_DEMOCRATIC_DESC: "Podněstří předává moc svým §8liberálům§!, rozebírá válečný bezpečnostní aparát a vyjednává návrat k Moldavsku jako federální partner. Moskva ztrácí opěrný bod na Dněstru a Evropská unie získává vyřešenou hranici." # todo: NEW TRANSLATION
 RULE_OPTION_PMR_REPUBLICAN: "Republikánský obrat" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_REPUBLICAN_DESC: "Strana §8Republika§! přebírá Tiraspol s programem čisté vlády, malého podnikání a nezávislosti, která se nezodpovídá nikomu. Podněstří přestává být ruskou posádkou a začíná se pokoušet být státem." # todo: NEW TRANSLATION
 RULE_OPTION_PMR_COMMUNIST: "Obnovený rudý prapor" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_COMMUNIST_DESC: "§8Komunistická strana§! se vrací k moci v Tiraspolu, znárodňuje majetek Sheriffu a znovu otevírá otázku obnovené Moldavské SSR. Kišiněv čelí sousedovi, který chce zpět jeho území, nikoli urovnání." # todo: NEW TRANSLATION
 RULE_OPTION_PMR_MONARCHIST: "Koruna na Dněstru" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_MONARCHIST_DESC: "§8Monarchisté§! korunují na Dněstru panovníka a obnovují Podněstří jako poslední přeživší úlomek imperiálního Ruska. Tiraspol vyměňuje sovětskou nostalgii za dvůr, gardu a nárok na starší legitimitu." # todo: NEW TRANSLATION
 RULE_OPTION_PMR_MILITARY_JUNTA: "Republika generála" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_MILITARY_JUNTA_DESC: "Generál Alexandr Lebeď je povolán zpět z Krasnojarsku, aby vedl republiku, kterou bránil, a §8důstojníci 14. armády§! s ním přebírají ministerstva. Podněstří se vyzbrojuje proti Kišiněvu a Bukurešti, místo aby čekalo na svolení Moskvy." # todo: NEW TRANSLATION
 RULE_OPTION_PMR_UKRAINIAN: "Směrem ke Kyjevu" # todo: NEW TRANSLATION
 RULE_OPTION_PMR_UKRAINIAN_DESC: "Tiraspol vyhání své ruské patrony, zve ukrajinské důstojníky a administrátory, aby je nahradili, a předkládá vstup do Ukrajiny referendu. Dněstr přestává být ruskou západní výspou a stává se východní hranicí Kyjeva." # todo: NEW TRANSLATION
 PMR_sub_behavior: "@PMR Transnistrie – dílčí chování" # todo: NEW TRANSLATION
 PMR_PASSIVE_DEFAULT: "Ekonomická priorita" # todo: NEW TRANSLATION
 PMR_PASSIVE_DEFAULT_DESC: "Transnistrie se zaměří na ekonomické odvětví." # todo: NEW TRANSLATION
 PMR_SHERIFF: "Šerifská republika" # todo: CHANGED
 PMR_SHERIFF_DESC: "Tiraspol nechá holding §8Sheriff§! pohltit stát, v němž byl vybudován, dokud vlastní bezpečnostní složka společnosti nezačne odpovídat za republiku. Podněstří nakonec bude spravováno největší firmou, nikoli parlamentem." # todo: CHANGED
 RULE_OPTION_TUR_HISTORICAL: "Historická AI" # todo: NEW TRANSLATION
 RULE_OPTION_TUR_HISTORICAL_DESC: "Bankovní krize ničí §8Stranu ctnosti§! a z ní odštěpená §8Strana spravedlnosti a rozvoje§! přebírá zemi. Turecko se obrací k neoosmanské diplomacii na Blízkém východě a Balkáně, zatímco prezidentský úřad pomalu přerůstá parlament." # todo: NEW TRANSLATION
 RULE_OPTION_TUR_KEMALIST_GUARD: "Strážci kemalismu" # todo: NEW TRANSLATION
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC: "Islamisté jsou zakázáni dříve, než se mohou znovu sjednotit, a §8sekulární republika§! se semkne za generálním štábem. Turecko zůstává ukotveno v NATO a na kurdskou otázku odpovídá armádou namísto reforem." # todo: NEW TRANSLATION
 RULE_OPTION_TUR_GREY_WOLVES: "Šedí vlci" # todo: NEW TRANSLATION
 RULE_OPTION_TUR_GREY_WOLVES_DESC: "§8Nacionalistická pravice§! vítězí ve sněmovně, ukončuje volby a korunuje sultána nad obnoveným osmanským státem. Turecko prosazuje nároky v Thrákii, na Kavkaze i v turkickém světě." # todo: NEW TRANSLATION
 RULE_OPTION_TUR_HIZMET: "Hnutí Hizmet" # todo: NEW TRANSLATION
 RULE_OPTION_TUR_HIZMET_DESC: "§8Gülenistická§! síť dědí trosky Strany ctnosti a přebírá stát prostřednictvím soudů, policie a škol, nikoli volební urny. Turecko v zahraničí prosazuje umírněný islám a doma potichu vydlabává vlastní instituce." # todo: NEW TRANSLATION
 RULE_OPTION_TUR_TURKISH_LEFT: "Návrat turecké levice" # todo: NEW TRANSLATION
 RULE_OPTION_TUR_TURKISH_LEFT_DESC: "Hlas proti establishmentu se místo k islamistům obrací k §8revoluční levici§!. Turecko opouští NATO, uznává své menšiny a ustavuje se jako antiimperialistický předvoj regionu." # todo: NEW TRANSLATION
 RULE_OPTION_TUR_GREAT_EAST: "Velký východ" # todo: NEW TRANSLATION
 RULE_OPTION_TUR_GREAT_EAST_DESC: "Strana ctnosti se ujímá moci, zneškodňuje generální štáb a poté se radikalizuje v §8salafistické§! hnutí, které rozpouští republiku. Turecko vyhlašuje chalífát a rozpíná se všemi směry, kam dosáhne." # todo: NEW TRANSLATION
 UKR_AI_BEHAVIOR: "@UKR Ukraine" # todo: NEW TRANSLATION
 UKR_VINTRENKO: "Vitrenko" # todo: NEW TRANSLATION
 UKR_VINTRENKO_DESC: "§8Progresivní socialistická strana§! Natalii Vitrenkové povede zemi programem spojujícím pravoslaví, sovětskou nostalgii a její vlastní pojetí ženské politiky. Ukrajina se ostře obrátí proti Západu a evropskou nabídku bude chápat jako nepřátelský čin." # todo: CHANGED
 UKR_NATIONALISTS: "Ukrainian Nationalism" # todo: NEW TRANSLATION
 UKR_NATIONALISTS_DESC: "Dědicové §8Ukrajinské povstalecké armády§! převezmou moc a obnoví stát kolem nacionalistické tradice. Ukrajina se postaví Moskvě, aniž by čekala, až jí to Západ dovolí, a její ruskojazyčné oblasti budou spravovány, nikoli obcházeny." # todo: CHANGED
 UKR_DEMOCRATIC: "Demokratická Ukrajina" # todo: NEW TRANSLATION
 UKR_DEMOCRATIC_DESC: "Ukrajina setrvá na prozápadní linii a celý stát uspořádá kolem přistoupení k Evropské unii a NATO. Kyjev se stane východním okrajem západního bloku a Moskva to bude považovat za ztrátu, kterou musí zvrátit." # todo: CHANGED
 UKR_COMMUNISM: "Komunistická Ukrajina" # todo: NEW TRANSLATION
 UKR_COMMUNISM_DESC: "§8Komunistická strana Ukrajiny§! vyhraje spor, který transformace nedokončila, a převezme republiku zpět. Kyjev bude pracovat na znovusložení Sovětského svazu, nikoli na útěku od něj." # todo: CHANGED
 UKR_SOCIALISM: "Socialistická Ukrajina" # todo: NEW TRANSLATION
 UKR_SOCIALISM_DESC: "§8Socialistická strana Ukrajiny§! převezme moc a obnoví zemi na přerozdělování a veřejném vlastnictví, aniž by sahala po starém rudém praporu. Oligarchové ztratí svůj vliv a Kyjev si udrží odstup od Bruselu i Moskvy." # todo: CHANGED
 UKR_YUSHENKO: "Juščenko" # todo: NEW TRANSLATION
 UKR_YUSHENKO_DESC: "Oranžový tábor udrží prezidentský úřad za Viktora Juščenka a bude vládnout na základě rehabilitace, jazyka a cesty na západ. Ukrajina se opře o Evropu a Spojené státy a plyn, který ji vytápí, se stane zbraní v rukou Moskvy." # todo: CHANGED
 UKR_YANUK: "Janukovič" # todo: NEW TRANSLATION
 UKR_YANUK_DESC: "Viktor Janukovyč a §8Strana regionů§! udrží stát a nasměrují ho zpět k Moskvě. Evropská dohoda zůstane nepodepsaná a východ i západ země budou spravovány jako soupeřící voličské základny." # todo: CHANGED
 RULE_OPTION_ENG_HISTORICAL: "Historické" # todo: NEW TRANSLATION
 RULE_OPTION_ENG_HISTORICAL_DESC: "§8Labour§! vládne pod Blairem a Brownem, než §8konzervativci§! převezmou úřad a předávají premiérství řadě vůdců, dokud se Labour pod Starmerem nevrátí. Británie opouští Evropskou unii, zachovává americké spojenectví a udržuje Unii pohromadě." # todo: NEW TRANSLATION
 RULE_OPTION_ENG_RISE_OF_BRITAIN: "Vzestup Británie" # todo: NEW TRANSLATION
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC: "Británie zůstává parlamentní demokracií a obnovuje impérium nákupem namísto dobývání: kupuje tisk, strany a ministerstva svých bývalých kolonií. Vlády od Karibiku po Pacifik se znovu zodpovídají Londýnu, aniž by padl jediný výstřel." # todo: NEW TRANSLATION
 RULE_OPTION_RULE_BRITANNIA: "Vláda Británie" # todo: NEW TRANSLATION
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Stoupenci Koruny rozbijí dvoustranický systém, vybudují své hnutí z úpadku země a přímo převezmou moc. Říše bude obnovena silou a Británie přestane být mladším partnerem Washingtonu." # todo: CHANGED
 RULE_OPTION_DEMOCRAT: "Demokraticky orientovaný" # todo: NEW TRANSLATION
 RULE_OPTION_DEMOCRAT_AI_DESC: "§8Demokratická strana§! drží Bílý dům i Kongres a po generaci vládne ze středu levice. Washington utrácí doma a v zahraničí vede prostřednictvím institucí, nikoli silou." # todo: CHANGED
 RULE_OPTION_REPUBLICAN: "Republikánsky orientovaný" # todo: NEW TRANSLATION
 RULE_OPTION_REPUBLICAN_AI_DESC: "§8Republikánská strana§! drží Bílý dům i Kongres a po generaci vládne ze středu pravice. Washington doma škrtá a udržuje svět v pořádku vahou zbraní." # todo: CHANGED
 RULE_OPTION_REFORMED_REPUBLIC: "Reformovaná republika" # todo: NEW TRANSLATION
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "Veřejný tlak prosadí politickou a volební reformu, která třetím stranám poskytne skutečný přístup k hlasovacím lístkům a skutečné zastoupení. Dvoustranický zámek se prolomí a americká vláda se poprvé stane koaličním problémem." # todo: CHANGED
 RULE_OPTION_POST_UNITED: "Éra po Unitedu" # todo: NEW TRANSLATION
 RULE_OPTION_POST_UNITED_AI_DESC: "Federální vláda ztratí kontrolu a Spojené státy se rozpadnou na nástupnické republiky, které převezmou jejich území. Severní Amerika se stane kontinentem soupeřících amerických států §Ra tuto cestu nelze kombinovat s historickým pravidlem AI§!." # todo: CHANGED
 RULE_OPTION_ALL_AHEAD_SLOW: "Vše vpřed pomalu" # todo: NEW TRANSLATION
 RULE_OPTION_ALL_AHEAD_SLOW_AI_DESC: "Povolením tohoto herního pravidla zajistíte, že AI nezkolabuje USA. V podstatě vyřazuje RNG faktor z nehistorického AI režimu." # todo: NEW TRANSLATION
 RULE_OPTION_GREAT_COLLAPSE: "Velký kolaps" # todo: NEW TRANSLATION
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "Vojenské výdaje studené války přežijí nepřítele, pro něhož byly vytvořeny, a desetiletí protestů a represí vyústí v celostátní stávku železničářů, která ochromí federální vládu. Spojené státy se zhroutí pod vlastní vahou a státy zůstanou odkázané samy na sebe." # todo: CHANGED
 RULE_OPTION_THE_GREAT_REBELLION: "Velké povstání" # todo: NEW TRANSLATION
 RULE_OPTION_THE_GREAT_REBELLION_AI_DESC: "Soupeřící zájmové skupiny zemi roztrhávají, zatímco voliči ztrácejí zájem jim v tom bránit, a sporné sčítání s nemožně těsnými výsledky nakonec podkopává důvěru veřejnosti ve výsledek. Spojené státy upadají do otevřeného povstání kvůli volbám, které nikdo nepřijme." # todo: NEW TRANSLATION
 RULE_OPTION_HISTORICAL_PRESIDENTS: "Historičtí prezidenti USA" # todo: NEW TRANSLATION
 RULE_OPTION_HISTORICAL_PRESIDENTS_AI_DESC: "Každé volby vrátí prezidenta, který je skutečně vyhrál, a strany si předávají Bílý dům podle skutečného harmonogramu. Americká politika se řídí záznamy namísto kostek a její spojenci se podle ní mohou plánovat." # todo: CHANGED
 VEN_AI_BEHAVIOR: "@VEN Venezuela" # todo: NEW TRANSLATION
 RULE_VEN_CHAVISMO_CONTINUES: "Chávismus pokračuje" # todo: NEW TRANSLATION
 RULE_VEN_CHAVISMO_CONTINUES_DESC: "Bolívarský socialismus pokračuje pod §8Sjednocenou socialistickou stranou§!, mise jsou financovány a ropný průmysl zůstává pevně v rukou státu. Caracas dál financuje bolívarský projekt napříč Latinskou Amerikou a Washington ho dál považuje za problém." # todo: NEW TRANSLATION
 RULE_VEN_OPPOSITION_STATIST: "Opozice, etatistický model" # todo: NEW TRANSLATION
 RULE_VEN_OPPOSITION_STATIST_DESC: "Demokratická opozice se ujímá moci, ale ponechává klíčová odvětví i státní ropnou společnost přesně tam, kde jsou. Venezuela mění vládu, nikoli ekonomiku, a regionální orientace se téměř nemění." # todo: NEW TRANSLATION
 RULE_VEN_OPPOSITION_LIBERTARIAN: "Opozice, tržní model" # todo: NEW TRANSLATION
 RULE_VEN_OPPOSITION_LIBERTARIAN_DESC: "Demokratická opozice přebírá moc a otevírá ekonomiku zahraničnímu i domácímu kapitálu prostřednictvím rozsáhlé deregulace a privatizace. Venezuela se vrací do západního ekonomického řádu a bolívarský blok přichází o svého finančníka." # todo: NEW TRANSLATION
 RULE_VEN_MILITARY_JUNTA: "Vojenská junta" # todo: NEW TRANSLATION
 RULE_VEN_MILITARY_JUNTA_DESC: "Důstojnický sbor obsazuje palác a vládne jako nacionalistický režim silného muže, který se nezodpovídá nikomu. Venezuela obrací armádu navenek a její sousedé zjišťují, že sdílejí hranici s expanzivním státem." # todo: NEW TRANSLATION
 SER_AI_BEHAVIOR: "@SER Yugoslavia" # todo: NEW TRANSLATION
 RULE_OPTION_MILOCEVIC_COMMI: "Miloševič je komunista" # todo: NEW TRANSLATION
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "Slobodan Milošević přežije výzvu své vládě a vrátí zemi k socialismu namísto obrany toho, co z republiky zbylo. Jugoslávie bude obnovena jako socialistická federace a Balkán znovu získá marxistickou mocnost." # todo: CHANGED
 RULE_OPTION_MILOCEVIC_NATI: "Miloševičova Velká Srb" # todo: NEW TRANSLATION
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Slobodan Milošević přežije a obrátí stát k projektu Velkého Srbska, přičemž si nárokuje každý okres, kde žijí Srbové. Jugoslávské války budou znovu rozpoutány namísto urovnání a každý soused se srbskou menšinou se stane cílem." # todo: CHANGED
 RULE_OPTION_MILOCEVIC_FEDERATION: "Miloševičova balkánská federace" # todo: NEW TRANSLATION
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Slobodan Milošević přežije a oživí §8Balkánskou federaci§!, unii, kterou se socialistům v regionu nikdy nepodařilo vybudovat. Bělehrad nabídne sousedům členství namísto dobytí a poloostrov sjednotí pod jednou střechou." # todo: CHANGED
 RULE_OPTION_SERBIAN_KINGDOM: "Království Srbska" # todo: NEW TRANSLATION
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "Milošević bude svržen a nacionalisté s monarchisty převezmou stát po něm, přičemž dynastii §8Karađorđevićů§! znovu usadí v Bělehradě. Srbsko bude vládnout korunou a církví a prosazovat tytéž staré nároky úctyhodnějšími prostředky." # todo: CHANGED
 RULE_OPTION_SERBIAN_LIBERALS: "Liberální Srbsko" # todo: NEW TRANSLATION
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "Reformátoři, kteří svrhli Miloševiće, si zemi udrží a obnoví ji jako liberální demokracii. Srbsko nasměruje svůj kurz k Evropské unii a urovná spory se sousedy, místo aby je živilo." # todo: CHANGED
 RULE_DISABLE_FORMABLE_NATIONS: "Zakázat formovatelné národy" # todo: NEW TRANSLATION
 RULE_YES_FORMABLE_NATIONS_DESC: "Zakáže rozhodnutí formovatelných národů." # todo: NEW TRANSLATION
 RULE_NO_FORMABLE_NATIONS_DESC: "Formovatelné národy budou povoleny." # todo: NEW TRANSLATION
 RULE_ALLOW_EDGY_FLAGS: "Povolit odvážné vlajky" # todo: NEW TRANSLATION
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Zabraňuje zobrazení některých z nejkontroverznějších možností vlajek." # todo: NEW TRANSLATION
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Umožňuje více kontroverzní možnosti vlajek, které by normálně byly cenzurovány." # todo: NEW TRANSLATION
 RULE_DISABLE_EU: "Zakázat EU" # todo: NEW TRANSLATION
 RULE_YES_DISABLE_EU_DESC: "Všechny země budou z Evropské unie odstraněny." # todo: NEW TRANSLATION
 RULE_NO_DISABLE_EU_DESC: "Evropská unie bude existovat tak, jak je." # todo: NEW TRANSLATION
 RULE_EUROPEAN_VOTING_COOLDOWN_LIMIT: "Doba mezi volbami Evropské unie" # todo: NEW TRANSLATION
 RULE_OPTION_EU_ONE: "1 den" # todo: NEW TRANSLATION
 RULE_OPTION_EU_ONE_DESC: "§RPro testovací účely.§! Doba čekání na hlasování v Evropském parlamentu a Evropské radě bude nastavena na jeden den místo výchozích sto osmdesáti dnů." # todo: NEW TRANSLATION
 RULE_OPTION_EU_SIXTY: "60 dní" # todo: NEW TRANSLATION
 RULE_OPTION_EU_SIXTY_DESC: "Doba odkladu hlasování Evropských Parlamentu a Evropské rady bude nastavena na 60 dní namísto výchozích 180 dní." # todo: NEW TRANSLATION
 RULE_OPTION_EU_NINETY: "90 dní" # todo: NEW TRANSLATION
 RULE_OPTION_EU_NINETY_DESC: "Doba odkladu hlasování Evropských Parlamentu a Evropské rady bude nastavena na 90 dní namísto výchozích 180 dní." # todo: NEW TRANSLATION
 RULE_OPTION_EU_ONE_HUNDRED_TWENTY: "120 dní" # todo: NEW TRANSLATION
 RULE_OPTION_EU_ONE_HUNDRED_TWENTY_DESC: "Doba odkladu hlasování Evropských Parlamentu a Evropské rady bude nastavena na 120 dní namísto výchozích 180 dní." # todo: NEW TRANSLATION
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY: "180 dní" # todo: NEW TRANSLATION
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY_DESC: "Doba odkladu hlasování Evropských Parlamentu a Evropské rady bude nastavena na výchozích 180 dní." # todo: NEW TRANSLATION
 RULE_OPTION_EU_TWO_HUNDRED_TEN: "210 dní" # todo: NEW TRANSLATION
 RULE_OPTION_EU_TWO_HUNDRED_TEN_DESC: "Doba odkladu hlasování Evropských Parlamentu a Evropské rady bude nastavena na 210 dní namísto výchozích 180 dní." # todo: NEW TRANSLATION
 RULE_EU_EXPANSION_FOCUS: "Chování EU" # todo: NEW TRANSLATION
 RULE_EU_EXP_NO: "Výchozí" # todo: NEW TRANSLATION
 RULE_EU_EXP_NO_DESC: "Výchozí chování EU" # todo: NEW TRANSLATION
 RULE_EU_EXP_YES: "Důraz na rozšiřování" # todo: NEW TRANSLATION
 RULE_EU_EXP_YES_DESC: "EU bude upřednostňovat zákony o rozšiřování" # todo: NEW TRANSLATION
 RULE_AI_EU_END_GAME_PATHS: "Povolit AI koncové cesty EU" # todo: NEW TRANSLATION
 RULE_AI_YES_EU_END_GAME_PATHS: "AI smí sledovat koncové cesty Evropské unie, jako jsou Evropská federace nebo Spojené státy evropské." # todo: NEW TRANSLATION
 RULE_AI_NO_EU_END_GAME_PATHS: "AI nesmí sledovat koncové cesty Evropské unie, jako jsou Evropská federace nebo Spojené státy evropské." # todo: NEW TRANSLATION
 RULE_DISABLE_NATO: "Zakázat NATO" # todo: NEW TRANSLATION
 RULE_YES_DISABLE_NATO_DESC: "NATO bude při načtení do hry zakázáno." # todo: NEW TRANSLATION
 RULE_NO_DISABLE_NATO_DESC: "NATO zůstane frakcí." # todo: NEW TRANSLATION
 GAME_RULE_nato_disabled: "§YNATO§! Zakázáno Pomocí Herního Pravidla" # todo: NEW TRANSLATION
 RULE_DISABLE_COUP_CONTEST: "Zakázat události soupeření o převrat" # todo: NEW TRANSLATION
 RULE_YES_DISABLE_COUP_CONTEST_DESC: "§RZakáže§! řetězec událostí §Hsoupeření o převrat§!. Hlavní zahraniční vlivové mocnosti §Rnebudou§! dostávat oznámení ani možnosti reagovat, když v zemi, do níž investují, dojde k převratu. Použijte tuto možnost, pokud chcete, aby se AI vyhnula eskalaci zástupných konfliktů." # todo: NEW TRANSLATION
 RULE_NO_DISABLE_COUP_CONTEST_DESC: "§GPovolí§! řetězec událostí §Hsoupeření o převrat§!. Když v zemi uspěje převrat, největší zahraniční vlivové mocnosti (a druhá největší, pokud přesahuje §H20 %§!) jsou informovány a mohou zvolit reakci: odsoudit převrat, uvalit sankce, podpořit opozici nebo vojensky zasáhnout. Občanské války po převratu také spustí odpovídající událost na podporu starého režimu." # todo: NEW TRANSLATION
 RULE_DISABLE_CSTO: "Zakázat CSTO" # todo: NEW TRANSLATION
 RULE_YES_DISABLE_CSTO_DESC: "CSTO bude při načítání do hry zakázáno." # todo: NEW TRANSLATION
 RULE_NO_DISABLE_CSTO_DESC: "CSTO zůstane frakcí." # todo: NEW TRANSLATION
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "Zisk vlivu při šíření vlivu" # todo: NEW TRANSLATION
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "Změnit množství vlivu získaného ze šíření vlivu." # todo: NEW TRANSLATION
