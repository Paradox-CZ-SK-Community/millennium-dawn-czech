 RULE_AI_STARTING_POLITICAL_POWER_NO: "Žádná počáteční politická síla AI" # todo: NEW TRANSLATION
 RULE_AI_STARTING_POLITICAL_POWER_NO_DESC: "AI nezačne s žádnou politickou silou." # todo: NEW TRANSLATION
 RULE_AI_STARTING_POLITICAL_POWER_250: "250 politická síla" # todo: NEW TRANSLATION
 RULE_AI_STARTING_POLITICAL_POWER_250_DESC: "Přidejte 250 politickou sílu všem AI národům." # todo: NEW TRANSLATION
 RULE_AI_STARTING_POLITICAL_POWER_500: "500 politická síla" # todo: NEW TRANSLATION
