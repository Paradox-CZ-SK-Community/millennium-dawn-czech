 EH_drone_mission_category: "Mise dronů" # todo: NEW TRANSLATION
 EH_drone_mission_category_desc: "\n£EH_gui_drone_picture\n\n\n\nDrony jsou našimi nejlepšími a nejbezpečnějšími průzkumnými prostředky. Díky nim můžeme shromažďovat informace o nepříteli, aniž bychom riskovali životy našich vojáků. Můžeme je použít k průzkumu nedalekého Portálu a zjistit, co kolem něj nepřítel buduje, což nám možná umožní získat taktickou výhodu během bitvy s jednou z těchto věcí." # todo: NEW TRANSLATION
 EH_research_sites_category: "Výzkumná stanoviště" # todo: NEW TRANSLATION
 EH_research_sites_category_desc: "Výzkumná stanoviště jsou naším nejlepším způsobem, jak získat více informací o Chiméře a její technologii. Takové základny přilákají nejlepší dostupné vědce a zároveň poskytnou výzkumný bonus pro naše speciální projekty. Jen doufejme, že si jich síly Chiméry nevšimnou příliš brzy." # todo: NEW TRANSLATION
 EH_setup_research_site: "Zřídit výzkumné stanoviště" # todo: NEW TRANSLATION
 EH_install_anti_air_weapons: "Nainstalovat protiletadlové zbraně" # todo: NEW TRANSLATION
 EH_panic_shelters_and_land_turrets: "Vybudovat kryty a pozemní věže" # todo: NEW TRANSLATION
 EH_hire_additional_security_for_scientists: "Přijmout dodatečnou ochranu pro vědce" # todo: NEW TRANSLATION
 EH_disable_site_notifications: "Vypnout oznámení o nájezdech na výzkumná stanoviště" # todo: NEW TRANSLATION
 EH_enable_site_notifications: "Zapnout oznámení o nájezdech na výzkumná stanoviště" # todo: NEW TRANSLATION
 EH_doudna_or_charpentier_project_mission: "Speciální projekt §YJennifer Doudna§! a §YEmmanuelle Charpentier§!" # todo: NEW TRANSLATION
 EH_doudna_or_charpentier_project_mission_desc: "§YJennifer Doudna§! a §YEmmanuelle Charpentier§! pracují na speciálním projektu, který nám může pomoci lépe porozumět genetické stavbě Chiméry. Jejich odbornost v technologii úpravy genů CRISPR by mohla poskytnout neocenitelné poznatky o slabinách těchto tvorů a umožnit nám vyvinout účinnější strategie boje proti nim." # todo: NEW TRANSLATION
 EH_find_new_veins_category: "Najít nová ložiska randallitu" # todo: NEW TRANSLATION
 EH_find_new_veins_category_desc: "Randallit je vzácná a cenná surovina, kterou lze nalézt v určitých žilách po celém světě. Je nezbytný pro náš výzkum a vývoj nových technologií k boji proti Chiméře. Investicemi do průzkumu a těžby můžeme zvýšit šanci na nalezení nových ložisek randallitu a zajistit stabilní dodávky této klíčové suroviny.\n\nKaždý randallitový důl poskytne každý týden malé množství randallitu. Musíme najít a zabezpečit co nejvíce nalezišť, než velké korporace převezmou těžbu této suroviny a donutí nás činit nepříjemná rozhodnutí." # todo: NEW TRANSLATION
 EH_search_for_randallite_veins: "Hledat ložiska randallitu" # todo: NEW TRANSLATION
 EH_set_up_mine_mission: "Zřizování nového dolu" # todo: NEW TRANSLATION
 EH_large_company_seeks_for_randallite_mission: "Velká korporace hledá randallit" # todo: NEW TRANSLATION
 EH_outlaw_randallite_extraction: "Zakázat těžbu randallitu mimo státní sektor" # todo: NEW TRANSLATION
 EH_legalize_randallite_extraction: "Legalizovat těžbu randallitu mimo státní sektor" # todo: NEW TRANSLATION
 EH_construct_southern_zenobia_defense_line: "Vybudovat obrannou linii §GJižní Zenobie§!" # todo: NEW TRANSLATION
 EH_construct_western_zenobia_defense_line: "Vybudovat obrannou linii §GZápadní Zenobie§!" # todo: NEW TRANSLATION
 EH_construct_inner_saladin_defense_line: "Vybudovat obrannou linii §GVnitřní Saladin§!" # todo: NEW TRANSLATION
 EH_construct_outer_saladin_defense_line: "Vybudovat obrannou linii §GVnější Saladin§!" # todo: NEW TRANSLATION
 EH_southern_zenobia_defense_line_destruction: "Obranná linie Jižní Zenobie se hroutí" # todo: NEW TRANSLATION
 EH_western_zenobia_defense_line_destruction: "Obranná linie Západní Zenobie se hroutí" # todo: NEW TRANSLATION
 EH_inner_saladin_defense_line_destruction: "Obranná linie Vnitřní Saladin se hroutí" # todo: NEW TRANSLATION
 EH_outer_saladin_defense_line_destruction: "Obranná linie Vnější Saladin se hroutí" # todo: NEW TRANSLATION
 EH_nile_defense_line_category: "Obranné linie Zenobie a Saladin" # todo: NEW TRANSLATION
 EH_nile_defense_line_category_desc: "Obranné linie na Nilu jsou naší nejlepší šancí, jak zastavit síly Chiméry v Africe. Linie Zenobie bude naší první obrannou linií, zatímco linie Saladin bude naší poslední nadějí, pokud Zenobie padne. Musíme zajistit, aby byly obě linie dobře opevněné a obsazené, protože budou klíčem k našemu přežití v této válce." # todo: NEW TRANSLATION
 EH_bosporus_defense_line_category: "Bosporuská obranná linie" # todo: NEW TRANSLATION
 EH_bosporus_defense_line_category_desc: "Bosporuská obranná linie je naší nejlepší šancí, jak zastavit síly Chiméry v Evropě. Linie bude opevněna těžkým dělostřelectvem a protiletadlovou obranou, stejně jako sítí zákopů a bunkrů. Budou zde rozmístěny armády většiny evropských národů. Musíme zajistit, aby linie vydržela." # todo: NEW TRANSLATION
 EH_construct_bosphorus_defense_line: "Vybudovat obrannou linii §GBospor§!" # todo: NEW TRANSLATION
 EH_bosphorus_defense_line_destruction: "Bosporuská obranná linie se hroutí" # todo: NEW TRANSLATION
 EH_caucasus_defense_line_category: "Kavkazská obranná linie" # todo: NEW TRANSLATION
 EH_caucasus_defense_line_category_desc: "Nepřítel rychle postupuje Blízkým východem a ohrožuje naše jižní hranice. Kavkazská obranná linie je naší nejlepší šancí, jak v tomto regionu zastavit síly Chiméry. Opevnění bude dvouvrstvým obranným systémem, přičemž první linie se bude skládat ze zákopů a bunkrů, zatímco druhá linie bude opevněna těžkým dělostřelectvem a protiletadlovou obranou. Musíme zajistit, aby linie vydržela, a doufat, že udržíme Chiméru v Tibetu, pokud se naše obranná linie nezhroutí zezadu." # todo: NEW TRANSLATION
 EH_construct_caucasus_defense_line: "Vybudovat obrannou linii §GKavkaz§!" # todo: NEW TRANSLATION
 EH_caucasus_defense_line_destruction_1: "První kavkazská obranná linie se hroutí" # todo: NEW TRANSLATION
 EH_caucasus_defense_line_destruction_2: "Druhá kavkazská obranná linie se hroutí" # todo: NEW TRANSLATION
 EH_europe_defense_line_category: "Evropská obranná linie" # todo: NEW TRANSLATION
 EH_europe_defense_line_category_desc: "Evropské obranné linie jsou naší nejlepší šancí, jak zastavit síly Chiméry v Evropě. Linie budou opevněny těžkým dělostřelectvem a protiletadlovou obranou, stejně jako sítí zákopů a bunkrů. Budou zde rozmístěny armády většiny evropských národů. Musíme zajistit, aby linie vydržely, až padne Rusko." # todo: NEW TRANSLATION
 EH_construct_europe_defense_line: "Vybudovat §GEvropskou§! obrannou linii" # todo: NEW TRANSLATION
 EH_europe_defense_line_destruction: "Evropská obranná linie se hroutí" # todo: NEW TRANSLATION
 EH_event.0.t: "Vítejte na horizontu událostí!" # todo: NEW TRANSLATION
 EH_event.0.d: "Horizont událostí je náš první velký speciální scénář, vytvořený na oslavu jednoho milionu odběratelů na Steam Workshopu. Jde o válečný scénář, ve kterém lidstvo bojuje o přežití proti neznámým mimozemským vetřelcům. Scénář obsahuje jedinečný strom zaměření, nové události, rozhodnutí, mechaniky, jednotky a surovinu, které vás vtáhnou do tohoto epického boje o přežití. Připravte se čelit neznámému, veďte lidstvo k vítězství a děkujeme vám za podporu!" # todo: NEW TRANSLATION
 EH_event.0.a: "Jupííí!!! Počkat, MIMOZEMŠŤANI?!!!" # todo: NEW TRANSLATION
 EH_event.1.t: "Linie Zenobie a Saladin se budují" # todo: NEW TRANSLATION
 EH_event.1.d: "V reakci na rostoucí hrozbu přicházející ze subsaharské Afriky schválila Aliance Blízkého východu urychlenou výstavbu opevněné obranné linie podél jižního Nilu a západních pouštních oblastí Egypta. Tato pozice, označená jako linie Zenobie, bude chránit postavení těžkého dělostřelectva a systémy zákopů napříč klíčovými přístupovými směry.\n\nPokud linie Zenobie padne, za ní bude stát linie Saladin. Toto opevnění, táhnoucí se celou oblastí průplavu od Port Saidu až k Rudému moři, bude sloužit jako absolutní obranná linie.\n" # todo: NEW TRANSLATION
 EH_event.1.a: "Nechť se poušť stane naším štítem" # todo: NEW TRANSLATION
 EH_event.300.t: "CERN překračuje hranice" # todo: NEW TRANSLATION
 EH_event.300.d: "Výzkumníci z Evropské organizace pro jaderný výzkum (CERN) úspěšně provedli řízenou vysokoenergetickou srážku, jejímž výsledkem bylo dočasné vytvoření toho, co je popisováno jako „lokalizovaná interdimenzionální anomálie“.\n\nAčkoli byl trhlina naměřena na subatomární úrovni a trvala pouhý zlomek nanosekundy, jde o první zaznamenaný případ energetických signatur, které nejsou v souladu se známými fyzikálními zákony. Počáteční izolační protokoly obstály a nebyl pozorován žádný přenos hmoty, důsledky však již otřásají globální vědeckou komunitou.\n\nHranice mezi teoretickým a skutečným se právě setřela." # todo: NEW TRANSLATION
 EH_event.300.a: "Je to skutečně bezpečné?" # todo: NEW TRANSLATION
 EH_event.301.t: "Konvoj OSN zmizel ve střední Africe" # todo: NEW TRANSLATION
 EH_event.301.d: "Humanitární konvoj Organizace spojených národů působící v pohraniční oblasti mezi Rwandou a Demokratickou republikou Kongo přestal komunikovat. Satelitní snímky ukazují trosky a převrácená vozidla roztroušená podél džunglové cesty, nebyl však přijat žádný nouzový signál.\n\nNebyli nalezeni žádní přeživší ani těla. Žádná povstalecká frakce nepřevzala odpovědnost. Příčina incidentu zůstává oficiálně neznámá." # todo: NEW TRANSLATION
 EH_event.301.a: "Další útok na mírové jednotky OSN..." # todo: NEW TRANSLATION
 EH_event.302.t: "Neobvyklá seismická aktivita v Tarimské pánvi" # todo: NEW TRANSLATION
 EH_event.302.d: "V Tarimské pánvi na západě Číny byl zaznamenán shluk mělkých, vysokofrekvenčních otřesů. Seismické vzorce neodpovídají přirozenému tektonickému pohybu ani známé podzemní aktivitě. Čínské úřady nevydaly žádné prohlášení, ale regionální seismologická data, nenápadně sdílená prostřednictvím univerzitního výměnného programu, vzbudila mezi geofyziky pozornost." # todo: NEW TRANSLATION
 EH_event.302.a: "Tyto hodnoty nedávají smysl" # todo: NEW TRANSLATION
 EH_event.303.t: "Rádiové ticho v Pamíru" # todo: NEW TRANSLATION
 EH_event.303.d: "Vysokohorské odposlouchávací stanoviště CHAL poblíž čínsko-tádžické hranice přestalo veškerou komunikaci. Z Pekingu nepřišlo žádné oficiální vyjádření, ale kazašský radioamatér oznámil, že před úplným tichem zachytil krátké nouzové vysílání v mandarínštině. Zpravodajské satelity ukazují viditelné známky poškození." # todo: NEW TRANSLATION
 EH_event.303.a: "Byl to tádžický útok?" # todo: NEW TRANSLATION
 EH_event.304.t: "Nezvěstní rangery na severu Aljašky" # todo: NEW TRANSLATION
 EH_event.304.d: "Dva strážci národního parku hlídkující v odlehlém sektoru Denaliho národního parku byli prohlášeni za nezvěstné poté, co se 72 hodin neozvali. Pátrací tým byl vyslán a objevil jejich opuštěný tábor s jasnými známkami zápasu.\n\nPřestože o případu nejprve informovaly pouze místní noviny, získal celostátní i mezinárodní pozornost, když beze stopy zmizela také pátrací skupina. FBI nyní zahájila vyšetřování a probíhá pátrání po pachatelích." # todo: NEW TRANSLATION
 EH_event.304.a: "Je na svobodě vrah?" # todo: NEW TRANSLATION
 EH_event.305.t: "Podivná nákaza v peruánské vysočině" # todo: NEW TRANSLATION
 EH_event.305.d: "Vzdálená vesnice v andské vysočině jižního Peru byla po záhadném vypuknutí nákazy umístěna do karantény regionálními zdravotnickými úřady. První zprávy popisují horečku, halucinace a akutní smyslovou dezorientaci místních obyvatel. Příznaky se objevily rychle po údajném „záblesku světla“ a otřesu, který byl zaznamenán pouze v úzkém údolí poblíž vesnice.\n\nPeruánští představitelé tvrdí, že jde o izolovanou plísňovou infekci, ale nevládní organizace působící poblíž uvádějí, že zdravotnické týmy doprovází vojenský personál. Mezi pohřešovanými je i geolog z Národní univerzity San Marcos, člen výzkumného týmu zkoumajícího nedaleké jeskyně." # todo: NEW TRANSLATION
 EH_event.305.a: "Průběžně nás informujte" # todo: NEW TRANSLATION
 EH_event.306.t: "Nepokoje v Sin-ťiangu: napadená vojenská základna" # todo: NEW TRANSLATION
 EH_event.306.d: "Poblíž Kašgaru v západním Sin-ťiangu došlo k násilnému incidentu. Čínská státní média mlčí, ale zpravodajské zprávy uvádějí, že základna 36, zařízení CHAL poblíž města Jie-čcheng, byla v noci obsazena neidentifikovanými nepřátelskými živly. Popis předaný rádiem nedával příliš smysl, pokud jde o skutečnou povahu útočníků.\n\nLidová osvobozenecká armáda zahájila nouzové nasazení mechanizovaných jednotek a týmů pro chemickou ochranu v regionu. V časných ranních hodinách byla na letišti v Kašgaru spatřena přistávat transportní letadla.\n\nV neobvyklém kroku překročil čínské území přes průsmyk Kulma také ruský oddíl rychlé reakce." # todo: NEW TRANSLATION
 EH_event.306.a: "Podle Pekingu je situace pod kontrolou" # todo: NEW TRANSLATION
 EH_event.307.t: "Taktický jaderný výbuch v západní Číně" # todo: NEW TRANSLATION
 EH_event.307.d: "Poblíž Taklamakanské pouště, přibližně 120 kilometrů východně od Kašgaru, byl zaznamenán taktický jaderný výbuch. K explozi došlo pět dní poté, co byly v regionu nasazeny jednotky CHAL k potlačení neznámé hrozby.\n\nPeking i Moskva popřely použití jaderných zbraní, ale seismická data potvrzují detonaci s nízkou účinností odpovídající ruské taktické hlavici. Satelitní snímky ukazují spálený terén, zhroucené geologické vrstvy a rychle se rozpínající temnou kouli.\n\nMezinárodní pozorovatelé požadují odpovědi, oficiální kanály však mlčí. Ve vojenských kruzích sílí dohady, že úder byl jednostranným rozhodnutím ruského polního velení v rámci doktríny nouzového nasazení." # todo: NEW TRANSLATION
 EH_event.307.a: "Co se tam děje?!" # todo: NEW TRANSLATION
 EH_event.308.t: "Závoj je roztržen" # todo: NEW TRANSLATION
 EH_event.308.d: "Satelitní snímky uniklé neznámým zpravodajským zdrojem se rozšířily po celém světě: nad ohořelými pozůstatky místa dopadu se vznáší obrovská fialová pulzující koule, z níž vychází roj tvorů. Vědci nedokážou snímky vysvětlit. Záběry jasně ukazují, že jaderný úder ji nedokázal zničit, a pokud něco, způsobil pouze její růst. Během několika hodin vybuchly tři nové portály podobné velikosti a účinku:\n- Na severozápadě Aljašky\n- V keňské vysočině poblíž hory Elgon\n- V jižním Chile poblíž mysu Horn.\n\nJiž přicházejí zprávy, že tvorové jsou vysoce agresivní. Věk normality skončil." # todo: NEW TRANSLATION
 EH_event.308.a: "Pravdu již nelze popírat" # todo: NEW TRANSLATION
 EH_event.309.t: "OSN svolává mimořádné shromáždění" # todo: NEW TRANSLATION
 EH_event.309.d: "S rostoucí panikou veřejnosti a slábnoucí důvěrou v národní vlády vstoupila Organizace spojených národů do mimořádného zasedání. Valné shromáždění využilo jen zřídka uplatňované krizové pravomoci a Rada bezpečnosti zahájila naléhavou debatu o koordinovaných strategiích reakce.\n\nNávrhy sahají od globální vojenské spolupráce po společné vědecké pracovní skupiny. Mezi stálými členy roste napětí, zatímco se šíří obviňování a střetávají se jednotlivé agendy.\n\nPokud jsou ovšem zprávy z prvních střetů nějakým vodítkem, jedna pravda je již jasná: lidstvo musí stát jednotně, nebo čelit vyhynutí." # todo: NEW TRANSLATION
 EH_event.309.a: "Globální reakce začíná nabývat podoby" # todo: NEW TRANSLATION
 EH_event.310.t: "Jednotné velení" # todo: NEW TRANSLATION
 EH_event.310.d: "Mimořádné shromáždění OSN skončilo vytvořením Společného velení OSN (UNJC). Tento mezinárodní orgán má za úkol koordinovat vojenskou strategii, zpravodajství a logistickou podporu proti rychle se rozšiřující mimodimenzionální hrozbě. Ačkoli má především poradní funkci, velení získalo bezprecedentní operační volnost.\n\nSoučasně začaly regionální bloky, například Evropská unie, předkládat návrhy na úplné politické a vojenské sjednocení s odkazem na potřebu bezproblémové mobilizace a sdílené suverenity tváří v tvář vyhynutí. To, co bylo kdysi nemyslitelné, se nyní otevřeně projednává v parlamentech po celém kontinentu." # todo: NEW TRANSLATION
 EH_event.310.a: "Jeden nepřítel. Jedna válka" # todo: NEW TRANSLATION
 EH_event.311.t: "Portál se zcela stabilizoval" # todo: NEW TRANSLATION
 EH_event.311.d: "Satelitní termální snímkování potvrzuje to, čeho se analytici obávali: portál nad Africkým rohem přestal kolísat a ustálil se v trvalém stabilním stavu. Průzkumné drony hlásí, že se na druhé straně shromažďuje roj v počtech příliš velkých na spočítání." # todo: NEW TRANSLATION
 EH_event.311.a: "Invaze skutečně začala" # todo: NEW TRANSLATION
 EH_event.401.t: "Spojené státy Severní Ameriky" # todo: NEW TRANSLATION
 EH_event.401.d: "Naše vláda je připravena vyzvat ke sjednocení našeho kontinentu. Je čas spojit se a společně čelit hrozbě. Přežít můžeme pouze sjednoceni." # todo: NEW TRANSLATION
 EH_event.401.a: "Jdeme na to" # todo: NEW TRANSLATION
 EH_event.402.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.402.d: "V historickém projevu k národu vyzvala [FROM.GetName] ke sjednocení severoamerických vojenských a politických struktur se sousedními státy s cílem vytvořit jednotnou frontu proti hrozbě Chiméry. Vláda zdůraznila, že vzhledem k existenčnímu nebezpečí, které představují rychle se šířící portály a jejich nestvůrní obyvatelé, lze přežití zajistit pouze jednotou.\n\nNávrh zahrnuje společné velitelské struktury, sdílené zdroje, integrované obranné systémy a jednotné území." # todo: NEW TRANSLATION
 EH_event.402.a: "Je čas" # todo: NEW TRANSLATION
 EH_event.403.t: "Republika Střední Ameriky" # todo: NEW TRANSLATION
 EH_event.403.d: "Po vzoru Severní Ameriky nastal čas, aby se náš národ spojil s našimi sousedy. Naše národy nejsou tak silné jako ty v Jižní či Severní Americe, ale společně můžeme mnoho změnit." # todo: NEW TRANSLATION
 EH_event.403.a: "Za přežití našeho lidu" # todo: NEW TRANSLATION
 EH_event.404.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.404.d: "Od [FROM.GetName] jsme obdrželi nečekanou nabídku na sjednocení středoamerických národů do jediného státu, aby bylo možné lépe koordinovat obranu proti hrozbě Chiméry.\n\nAčkoli někteří vůdci vyjadřují obavy o suverenitu, naléhavost situace vedla k vážnému zvážení této nabídky." # todo: NEW TRANSLATION
 EH_event.404.a: "Musíme to udělat, ať to stojí cokoli" # todo: NEW TRANSLATION
 EH_event.405.t: "Unie jihoamerických národů" # todo: NEW TRANSLATION
 EH_event.405.d: "V současnosti jsme jedinou nesjednocenou částí Ameriky. Naše národy jsou silné, ale ne dost silné na to, aby samy čelily hrozbě Chiméry. Je čas spojit se a čelit hrozbě společně." # todo: NEW TRANSLATION
 EH_event.405.a: "Rozešlete pozvánky" # todo: NEW TRANSLATION
 EH_event.406.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.406.d: "Po nedávných sjednoceních v Severní a Střední Americe navrhla vláda [FROM.GetName] podobnou cestu pro naše jihoamerické národy. Cílem je vytvořit jednotnou frontu proti hrozbě Chiméry a spojit zdroje, vojenskou sílu i politickou vůli k zajištění přežití. Ačkoli se některé ideologie a vlády liší, situace je možná přiměje změnit názor." # todo: NEW TRANSLATION
 EH_event.406.a: "Za budoucnost našeho kontinentu" # todo: NEW TRANSLATION
 EH_event.407.t: "Evropská federace" # todo: NEW TRANSLATION
 EH_event.407.d: "Náš kontinent nikdy nebyl jednotnější než dnes. Evropská unie a NATO si v průběhu let vytvořily pevné vazby, nyní je však čas posunout se na další úroveň. Musíme se sjednotit v jediný národ a společně čelit hrozbě Chiméry." # todo: NEW TRANSLATION
 EH_event.407.a: "Sejdeme se v Bruselu" # todo: NEW TRANSLATION
 EH_event.408.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.408.d: "Dnes, [GetDateText], vláda [FROM.GetAdjectiveCap] oficiálně navrhla sjednocení evropských národů do jediného federálního celku, aby bylo možné lépe koordinovat obranu proti hrozbě Chiméry. Po vzoru Ameriky bylo jisté, že s podobným návrhem přijde i jeden z národů našeho kontinentu.\n\nAčkoli to může být v rozporu s demokratickými hodnotami nezávislosti národů, naléhavost situace zastřela většinu ideologických rozdílů." # todo: NEW TRANSLATION
 EH_event.408.a: "Sjednoceni dříve, sjednoceni dnes" # todo: NEW TRANSLATION
 EH_event.409.t: "Africký obranný bod" # todo: NEW TRANSLATION
 EH_event.409.d: "Náš kontinent v poslední době čelil mnoha válkám, stále však existuje naděje. Africké národy se musí sjednotit a společně čelit hrozbě Chiméry. Musí pochopit, že je to jediná možnost." # todo: NEW TRANSLATION
 EH_event.409.a: "Za přežití Afriky" # todo: NEW TRANSLATION
 EH_event.410.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.410.d: "Navzdory všemu navrhla vláda [FROM.GetName] sjednocení afrických národů, aby společně čelily hrozbě Chiméry. Ačkoli se některé národy stále zotavují z nedávných konfliktů, naléhavost situace je důležitější než naše místní problémy." # todo: NEW TRANSLATION
 EH_event.410.a: "To je to nejlepší, co můžeme udělat" # todo: NEW TRANSLATION
 EH_event.411.t: "Východní kontinentální unie" # todo: NEW TRANSLATION
 EH_event.411.d: "Musíme následovat příklad ostatních kontinentů. Naše národy jsou silné, ale ne dost silné na to, aby samy čelily hrozbě Chiméry. Musíme odložit své rozdíly stranou a sjednotit se." # todo: NEW TRANSLATION
 EH_event.411.a: "Rozešlete pozvánky" # todo: NEW TRANSLATION
 EH_event.412.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.412.d: "Naše národy v poslední době prošly mnoha brutálními konflikty. [FROM.GetName] navrhuje odložit naše rozdíly stranou a sjednotit se, abychom společně čelili hrozbě Chiméry. Nebylo to snadné jednání, ale Chiméra je pro nás všechny mnohem větší hrozbou než naše místní problémy." # todo: NEW TRANSLATION
 EH_event.412.a: "Prozatím zůstaňme spolu" # todo: NEW TRANSLATION
 EH_event.413.t: "Euroasijská federace" # todo: NEW TRANSLATION
 EH_event.413.d: "Naše velká frakce musí zůstat jednotná. Hrozba Chiméry se přibližuje k našim hranicím. Naše národy jsou silné, ale ne dost silné na to, aby samy čelily hrozbě Chiméry. Je čas spojit se a čelit hrozbě společně." # todo: NEW TRANSLATION
 EH_event.413.a: "Sejdeme se v Moskvě" # todo: NEW TRANSLATION
 EH_event.414.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.414.d: "Časy jsou těžké. Vláda [FROM.GetName] navrhla sjednocení euroasijských národů do jediného federálního celku, aby bylo možné lépe koordinovat obranu proti hrozbě Chiméry. S ochranou ruské armády a ekonomiky budeme schopni vytlačit síly Chiméry z této planety." # todo: NEW TRANSLATION
 EH_event.414.a: "Ať žije ODKB!" # todo: NEW TRANSLATION
 EH_event.415.t: "Tři vrcholy" # todo: NEW TRANSLATION
 EH_event.415.d: "Náš velký národ musí zůstat nedotčen, proto nastal čas sjednotit naše komunistické spojence. Společně můžeme čelit hrozbě Chiméry a přežít do dalšího dne." # todo: NEW TRANSLATION
 EH_event.415.a: "Peking ukáže cestu" # todo: NEW TRANSLATION
 EH_event.416.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.416.d: "Čína není ochotna vytvořit další obrovskou federaci jako ostatní kontinenty, ale naše národy si vždy byly blízké. Vláda [FROM.GetName] navrhla sjednotit naše země pod jedinou vlajkou a společně čelit hrozbě Chiméry." # todo: NEW TRANSLATION
 EH_event.416.a: "Poslední komunistická pevnost" # todo: NEW TRANSLATION
 EH_event.417.t: "Koalice ASEAN" # todo: NEW TRANSLATION
 EH_event.417.d: "V poslední době jsme byli obklopeni velmocemi. Naši situaci navíc zhoršuje nedaleký portál Chiméry v Číně. Je čas spojit se a společně čelit hrozbě." # todo: NEW TRANSLATION
 EH_event.417.a: "Už jsme čekali příliš dlouho" # todo: NEW TRANSLATION
 EH_event.418.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.418.d: "Vláda [FROM.GetName] navrhla sjednocení národů jihovýchodní Asie do jediného celku, aby bylo možné lépe koordinovat obranu proti hrozbě Chiméry. Po nedávných sjednoceních na jiných kontinentech bylo jen otázkou času, než s podobným návrhem přijde některý z našich národů." # todo: NEW TRANSLATION
 EH_event.418.a: "Naše jediná možnost" # todo: NEW TRANSLATION
 EH_event.419.t: "Východoasijská koalice" # todo: NEW TRANSLATION
 EH_event.419.d: "Hrozba se přibližuje k našim hranicím. Nejen kvůli silám Chiméry z Číny, ale také kvůli samotné Číně a jejím novým spojencům. Ukažme jim, že v této válce nebudeme nečinně přihlížet." # todo: NEW TRANSLATION
 EH_event.419.a: "Za bezpečnost našich ostrovů" # todo: NEW TRANSLATION
 EH_event.420.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.420.d: "Vláda [FROM.GetName] navrhla sjednocení východoasijských národů do jediného celku, aby bylo možné lépe koordinovat obranu proti hrozbě Chiméry i rostoucímu vlivu Číny." # todo: NEW TRANSLATION
 EH_event.420.a: "Připravme se na nejhorší" # todo: NEW TRANSLATION
 EH_event.421.t: "Oceánská obranná unie" # todo: NEW TRANSLATION
 EH_event.421.d: "Zbytek světa je sjednocen. Mysleli jsme si, že se tato válka na naše ostrovy nedostane, ale je to jen otázka času. Naše národy žily v relativním míru, nyní je čas sjednotit se a bránit své domovy." # todo: NEW TRANSLATION
 EH_event.421.a: "Za přežití Oceánie" # todo: NEW TRANSLATION
 EH_event.422.t: "[FROM.GetAdjectiveCap] vláda vyzývá ke sjednocení" # todo: NEW TRANSLATION
 EH_event.422.d: "Vláda [FROM.GetName] navrhla sjednocení oceánských národů. Ačkoli jsou naše národy daleko od hlavních oblastí konfliktu, nedávná sjednocení na jiných kontinentech nám ukázala, že musíme být připraveni na všechno." # todo: NEW TRANSLATION
 EH_event.422.a: "Budiž" # todo: NEW TRANSLATION
 EH_event.423.t: "Vzestup Spojených států Severní Ameriky" # todo: NEW TRANSLATION
 EH_event.423.d: "Rychlá reakce americké vlády na hrozbu Chiméry vyvrcholila formálním založením Spojených států Severní Ameriky (USNA). Po týdnech intenzivních jednání se země kontinentu dohodly na rozpuštění svých národních vlád a začlenění do jediného federálního celku.\n\nUSNA nyní velí sjednoceným ozbrojeným silám, centralizované logistice a jediné válečné vládě." # todo: NEW TRANSLATION
 EH_event.423.a: "Začíná nová éra" # todo: NEW TRANSLATION
 EH_event.424.t: "Sjednocení Republiky Střední Ameriky" # todo: NEW TRANSLATION
 EH_event.424.d: "Vůdci Střední Ameriky se dohodli na rozpuštění svých národních vlád a začlenění do jediného celku: Republiky Střední Ameriky (RCA). Není zcela jasné, zda bylo sjednocení vyvoláno pouze hrozbou Chiméry, nebo také hrozbou, kterou samotná USNA představuje. Jedno je však jisté: další skupina zemí je připravena čelit apokalyptické hrozbě." # todo: NEW TRANSLATION
 EH_event.424.a: "Kdo by to byl řekl?" # todo: NEW TRANSLATION
 EH_event.425.t: "Unie jihoamerických národů byla vytvořena" # todo: NEW TRANSLATION
 EH_event.425.d: "Poslední část Ameriky se konečně sjednotila. Po týdnech vyjednávání se jihoamerické národy dohodly na sjednocení pod jedinou vlajkou: Unií jihoamerických národů (UNASUR).\n\nCelá Amerika je nyní připravena čelit hrozbě společně." # todo: NEW TRANSLATION
 EH_event.425.a: "Záblesk naděje" # todo: NEW TRANSLATION
 EH_event.426.t: "Zrod Evropské federace" # todo: NEW TRANSLATION
 EH_event.426.d: "Po měsících politických sporů, mimořádných zasedání a rostoucích ztrát Evropská unie odhlasovala rozpuštění svého nadnárodního rámce a přetvoření v jediný federální velkostát: Evropskou federaci.\n\nDokonce i historicky neutrální země jako Švýcarsko a Finsko se po dlouhých vnitřních debatách a referendech rozhodly připojit s odkazem na existenční hrozbu představovanou CHIMERAMI. Po sjednocení národních armád a odstranění hranic má Evropská federace jednotnou velitelskou strukturu, sdílené zdroje a jedinou válečnou vládu.\n\nKritici varují před uspěchanou integrací a ztrátou nezávislosti, zastánci však tvrdí, že přežití nezajistí nic menšího než úplné sjednocení." # todo: NEW TRANSLATION
 EH_event.426.a: "Přežití nezná hranice" # todo: NEW TRANSLATION
 EH_event.427.t: "Vznik Afrického obranného bodu" # todo: NEW TRANSLATION
 EH_event.427.d: "V historickém kroku se africké národy spojily a vytvořily Africký obranný bod (ADF).\n\nNavzdory přetrvávajícím regionálním konfliktům a ekonomickým rozdílům se vůdci shodli, že pouze prostřednictvím jednoty mohou doufat v obranu svého lidu a území. Afrika je nyní připravena významně přispět ke globálnímu boji proti hrozbě CHIMÉR." # todo: NEW TRANSLATION
 EH_event.427.a: "Afrika stojí sjednocená" # todo: NEW TRANSLATION
 EH_event.428.t: "Východní kontinentální unie založena" # todo: NEW TRANSLATION
 EH_event.428.d: "V překvapivém vývoji událostí se národy napříč Střední Asií a severní Afrikou dohodly na rozpuštění svých národních vlád a vytvoření Východní kontinentální unie (ECU).\n\nK tomuto kroku dochází uprostřed sílících vpádů CHIMÉR a uvědomění, že roztříštěné reakce vedly pouze k větším ztrátám.\n\nAčkoli některé konflikty zdaleka nejsou vyřešeny, naléhavost hrozby CHIMÉR přiměla vůdce upřednostnit přežití před suverenitou." # todo: NEW TRANSLATION
 EH_event.428.a: "Vydrží tato aliance?" # todo: NEW TRANSLATION
 EH_event.429.t: "Euroasijská federace oficiálně založena" # todo: NEW TRANSLATION
 EH_event.429.d: "Moskevské setkání skončilo a svět nyní sleduje zrod Euroasijské federace (ERF). Mnoho národů spekuluje, zda bylo sjednocení vynuceno Ruskem, pravdou však je, že všechny národy se sjednocením souhlasily, aby společně čelily hrozbě Chiméry.\n\nObjevují se také zvěsti, že by Rusko mohlo této situace využít k obnovení Sovětského svazu nebo se znovu stát hrozbou pro Evropu." # todo: NEW TRANSLATION
 EH_event.429.a: "Zůstává příliš mnoho otázek..." # todo: NEW TRANSLATION
 EH_event.430.t: "Tři vrcholy sjednoceny" # todo: NEW TRANSLATION
 EH_event.430.d: "Severní Korea, Mongolsko a Čína se oficiálně sjednotily pod jedinou vlajkou: Tři vrcholy. Ačkoli čínská vláda sjednocení kritizovala, pevné vztahy se spojenci a hrozba Chiméry ji přiměly změnit názor.\n\nNový národ je nyní připraven čelit hrozbě společně." # todo: NEW TRANSLATION
 EH_event.430.a: "Řekl bych, že spravedlivé..." # todo: NEW TRANSLATION
 EH_event.431.t: "Koalice ASEAN vytvořena" # todo: NEW TRANSLATION
 EH_event.431.d: "Další část Asie se sjednotila. Nedávná sjednocení blízkovýchodních národů a Tří vrcholů přiměla národy jihovýchodní Asie následovat stejnou cestu." # todo: NEW TRANSLATION
 EH_event.431.a: "Svět nikdy nebyl jednotnější" # todo: NEW TRANSLATION
 EH_event.432.t: "Východoasijská koalice založena" # todo: NEW TRANSLATION
 EH_event.432.d: "Poslední asijské země se sjednotily. Po týdnech vyjednávání se východoasijské národy dohodly na rozpuštění svých národních vlád a začlenění do jediného celku: Východoasijské koalice (EAC).\n\nVzhledem k rostoucímu vlivu Číny a nedalekému portálu Chiméry se nový národ nyní připravuje nejen na boj s hrozbou Chiméry, ale také na možnou agresi samotné Číny." # todo: NEW TRANSLATION
 EH_event.432.a: "Lepší sjednoceni než rozděleni" # todo: NEW TRANSLATION
 EH_event.433.t: "Oceánská obranná unie vytvořena" # todo: NEW TRANSLATION
 EH_event.433.d: "Oceánské národy se spojily a vytvořily Oceánskou obrannou unii (ODU). Navzdory geografické izolaci a ekonomickým rozdílům se vůdci shodli, že pouze prostřednictvím jednoty mohou doufat v obranu svého lidu a území.\n\nODU je nyní připravena významně přispět ke globálnímu boji proti hrozbě Chiméry.\n\nPo sjednocení Oceánie je svět nyní zcela rozdělen mezi několik velkostátů. Organizace spojených národů zůstává poslední mezinárodní organizací a dělá vše pro podporu globálního válečného úsilí." # todo: NEW TRANSLATION
 EH_event.433.a: "Statečný nový svět" # todo: NEW TRANSLATION
 EH_event.434.t: "Energie portálů narušuje globální komunikaci" # todo: NEW TRANSLATION
 EH_event.434.d: "V týdnech po vzniku portálů Chiméry došlo v globálních komunikačních sítích k bezprecedentním poruchám. Satelitní spojení občas selhávají, podmořské kabely vykazují nepravidelné ztráty dat a pozemní sítě sužuje nevysvětlitelné rušení.\n\nOdborníci se domnívají, že portály vyzařují jedinečnou formu elektromagnetického záření, která ruší běžné komunikační technologie. Probíhá vývoj nových protokolů a zařízení schopných fungovat v tomto nepřátelském prostředí, prozatím však zůstává tok informací vážně narušen." # todo: NEW TRANSLATION
 EH_event.434.a: "Opravte to rychle!" # todo: NEW TRANSLATION
 EH_event.500.t: "Objev randallitu" # todo: NEW TRANSLATION
 EH_event.500.d: "Od chvíle, kdy se do Země otevřely první portály, byly po celém světě nacházeny úlomky neidentifikované kovové látky. Většina lidí předpokládala, že jde o dimenzionální přeměnu existujících kovů, podivnou, ale neškodnou.\n\nTo se dnes změnilo. Doktorka Lisa Randall, teoretická fyzička a jedna z předních světových odbornic na fyziku vyšších dimenzí, rozluštila strukturu a vlastnosti tohoto materiálu a odhalila stabilní, lehký a mimořádně odolný kov s obrovským potenciálem pro vojenské využití.\n\nLátka, nyní nazývaná randallit, se jedinečně hodí pro pokročilé slitiny, protože kombinuje pevnost, tepelnou odolnost a pružnost. Při správném zpracování může sloužit jako základ nové generace válečných strojů, které nám pomohou zvítězit." # todo: NEW TRANSLATION
 EH_event.500.a: "Konečně nějaké dobré zprávy" # todo: NEW TRANSLATION
 EH_event.501.t: "Odhalen prototyp konstrukce HACS" # todo: NEW TRANSLATION
 EH_event.501.d: "Po měsících urychleného vývoje tým [FROM.GetAdjective] úspěšně zkonstruoval první prototyp konstrukce Vysoce obratného bojového systému (HACS).\n\nPlatforma HACS, zkonstruovaná s dvounohým podvozkem vyztuženým randallitem a vybavená integrovanými pomocnými tryskami, byla navržena k překlenutí rozdílu mezi palebnou silou a přežitím. Tam, kde jsou tanky příliš pomalé a letouny příliš zranitelné vůči hrozbám Chiméry, poskytují HACS potřebnou mobilitu bez obětování nákladu těžkých zbraní.\n\nAčkoli je stále ve fázi testování, tento průlom představuje významný krok k jednotkám nové generace pro první linii. Byl schválen specializovaný výzkumný program, který má HACS přivést do bojeschopné podoby." # todo: NEW TRANSLATION
 EH_event.501.a: "Nová éra války" # todo: NEW TRANSLATION
 EH_event.511.t: "Operace Perlík" # todo: NEW TRANSLATION
 EH_event.511.d: "Po měsících hořkých ztrát napříč východní Evropou a zhroucení balkánské obranné sítě zahájila Evropská federace operaci Perlík, vysoce rizikovou vojenskou ofenzivu s cílem znovu dobýt Bosporenskou linii a otevřít strategický koridor mezi Evropou a Blízkým východem. Ofenzivu vedou nově nasazené jednotky HACS a podporují ji koordinované dělostřelecké, námořní a raketové údery. Cílem je vytlačit houfy Chimér z ruin Istanbulu a okolních kopců.\n\nÚspěch operace by znamenal zásadní obrat v obnově kontinentální mobility a zajištění jižního křídla Evropy. Přítomnost houfu však zesílila a zpravodajské zprávy naznačují výskyt nových, dosud nepoznaných variant v tomto regionu. Nadcházející bitva bude nákladná." # todo: NEW TRANSLATION
 EH_event.511.a: "Kostky jsou vrženy" # todo: NEW TRANSLATION
 EH_event.800.t: "Linie Zenobie a Saladina se budují" # todo: NEW TRANSLATION
 EH_event.800.d: "V reakci na rychle postupující houf ze subsaharské Afriky nařídila Liga obrany Blízkého východu okamžitou výstavbu opevněné bariéry napříč jižním Egyptem. Linie Zenobie, jak se jí začalo říkat, se táhne podél Nilu a západního pouštního křídla a kombinuje zesílené bunkry, síť zákopů a stanoviště dálkového dělostřelectva, aby zastavila postup Chimér.\n\nPokud Zenobie padne, za ní čeká Saladinova linie. Táhne se podél Suezského průplavu od Port Saidu až k Rudému moři a představuje poslední pevnost, neprolomitelnou linii určenou k ochraně kulturního a duchovního srdce regionu před vyhlazením." # todo: NEW TRANSLATION
 EH_event.800.a: "Linie je vytyčena" # todo: NEW TRANSLATION
 EH_event.801.t: "Zhroucení linií Zenobie a Saladina" # todo: NEW TRANSLATION
 EH_event.801.d: "Přicházejí zprávy, že houf Chimér prolomil jak linii Zenobie v jižním Egyptě, tak Saladinovu linii podél Suezského průplavu. Navzdory brutálnímu obrannému úsilí a silné dělostřelecké podpoře byl nepřítel příliš početný a neúnavný.\n\nCelé obranné sektory byly překonány, opevnění ztracena, zákopové linie pohlceny a mnoho jednotek bojovalo až do hořkého konce. Velitelství Suezu od té doby mlčí. Liga obrany Blízkého východu nařídila úplný ústup směrem k Levantě.\n\nProražení poslední obranné linie otevírá bránu k severní frontě. Žádné nárazníkové pásmo už nezůstalo." # todo: NEW TRANSLATION
 EH_event.801.a: "Drželi tak dlouho, jak jen mohli" # todo: NEW TRANSLATION
 EH_event.802.t: "Linie Zenobie a Saladina napadeny zezadu!" # todo: NEW TRANSLATION
 EH_event.802.d: "Kvůli zhroucení obranných linií Blízkého východu nyní síly Chimér prolomily linie Zenobie a Saladina z jejich jediné zranitelné strany – zezadu. Houf se průlomem přelil v drtivém počtu, rychle přemohl zbývající obránce a zajistil si opěrný bod v srdci kontinentu.\n\nPo prolomení linií mají Chiméry volnou cestu na sever, což ohrožuje klíčová města a infrastrukturu napříč Evropou. Situace je zoufalá a Evropská unie se nyní musí připravit na vleklý a brutální boj na první frontě u svých hranic." # todo: NEW TRANSLATION
 EH_event.802.a: "Východní fronta byla příliš slabá" # todo: NEW TRANSLATION
 EH_event.803.t: "Opevňování Evropy: Bosporenská linie" # todo: NEW TRANSLATION
 EH_event.803.d: "Západní koalice schválila vytvoření nové kontinentální pevnosti: Bosporenské linie.\n\nTato obranná linie se táhne přes istanbulské úžiny a kombinuje minová pole, námořní blokády, připravená postavení a zesílené valy, aby zabránila průlomu do Evropy. V jejím srdci je umístěno bojové uskupení Hellespont, mnohonárodní jednotka připravená bojovat až do konce.\n\nRozkaz je jasný: držet linii bez ohledu na cenu." # todo: NEW TRANSLATION
 EH_event.803.a: "Bez boje nepřejdou" # todo: NEW TRANSLATION
 EH_event.804.t: "Pád Bosporenské linie" # todo: NEW TRANSLATION
 EH_event.804.d: "Po brutálním a dlouhém obléhání byla Bosporenská linie prolomena. Chiméry se převalily Istanbulí v přílivu ohně a masa a navzdory zoufalému protiútoku přemohly obranu.\n\nBojové uskupení Hellespont bojovalo do posledního muže a nyní je oplakáváno jako hrdinové Evropy.\n\nEvropa je nyní přímo vystavena. Západní svět přišel o svůj první štít." # todo: NEW TRANSLATION
 EH_event.804.a: "Strážci Evropy budou oplakáváni" # todo: NEW TRANSLATION
 EH_event.805.t: "Bosporenská linie napadena zezadu!" # todo: NEW TRANSLATION
 EH_event.805.d: "Síly Chimér dokázaly obejít Černé moře ze severu a napadnout Bosporenskou linii zezadu, čímž zcela obešly opevnění a přemohly zbývající obránce. Houf již ovládá Balkán a západní Evropu." # todo: NEW TRANSLATION
 EH_event.805.a: "Evropa již padla" # todo: NEW TRANSLATION
 EH_event.806.t: "Kavkazská obranná linie se buduje" # todo: NEW TRANSLATION
 EH_event.806.d: "Kavkazská obranná linie se buduje na ochranu spojení mezi Blízkým východem a jižním územím Eurasijské federace. Linie se bude táhnout přes Kavkazské hory a spojí výhody přirozeného terénu s opevněnými pozicemi, dělostřeleckými stanovišti a jednotkami rychlé reakce, aby vytvořila mohutnou bariéru proti postupujícím silám Chimér.\n\nAčkoli nemusí stačit k úplnému zastavení houfu, poslouží jako kritické nárazníkové pásmo, které získá čas pro evakuaci a přeskupení sil v Evropě a bývalém Rusku." # todo: NEW TRANSLATION
 EH_event.806.a: "Doufejme, že to stihnou včas" # todo: NEW TRANSLATION
 EH_event.807.t: "První linie kavkazské obrany prolomena" # todo: NEW TRANSLATION
 EH_event.807.d: "Síly Chimér prolomily první linii kavkazské obrany, překonaly počáteční opevnění a pronikly do horského regionu. Navzdory zuřivému odporu obránců vytvořil neúnavný útok houfu opěrný bod v oblasti a hrozí jeho přelití do srdce Eurasijské federace.\n\nSituace je kritická, ale stále existuje naděje, že druhá obranná linie vydrží a zabrání dalším průnikům." # todo: NEW TRANSLATION
 EH_event.807.a: "Pro druhou linii stále existuje naděje" # todo: NEW TRANSLATION
 EH_event.808.t: "Kavkazská obrana padla" # todo: NEW TRANSLATION
 EH_event.808.d: "Navzdory statečnému úsilí kavkazská obranná linie padla. Síly Chimér přemohly zbývající obránce a zajistily si opěrný bod v regionu, čímž otevřely Eurasijské federaci novou frontu.\n\nSe ztrátou této kritické nárazníkové zóny má nyní houf přímou cestu ke klíčovým městům a infrastruktuře napříč Ruskem a západní Evropou. Situace je zoufalá a Eurasijská federace se nyní musí připravit na vleklý a brutální boj na vlastní půdě." # todo: NEW TRANSLATION
 EH_event.808.a: "Nelze je zastavit..." # todo: NEW TRANSLATION
 EH_event.809.t: "Kavkazská obranná linie napadena zezadu!" # todo: NEW TRANSLATION
 EH_event.809.d: "Síly Chimér dokázaly obejít Kavkazské hory ze severu a napadnout obrannou linii zezadu, čímž zcela obešly opevnění a přemohly zbývající obránce. Houf již ovládá okolní regiony." # todo: NEW TRANSLATION
 EH_event.809.a: "Bylo to riziko, které jsme museli podstoupit" # todo: NEW TRANSLATION
 EH_event.810.t: "Evropská obranná linie se buduje" # todo: NEW TRANSLATION
 EH_event.810.d: "Vzhledem k významu východní hranice Evropy se nyní buduje nová linie, která oddělí kontinent od Asie. Jde o dosud největší investici do ochrany kritického regionu před invazí Chimér. Někteří jí říkají „první a poslední obrana Evropy“." # todo: NEW TRANSLATION
 EH_event.810.a: "Zajímavé" # todo: NEW TRANSLATION
 EH_event.811.t: "Evropská linie prolomena" # todo: NEW TRANSLATION
 EH_event.811.d: "Síly Chimér dnes ráno prolomily obrovskou Evropskou obrannou zeď. Díky drtivé převaze se Chimérám podařilo překonat opevnění a nyní pochodují směrem k evropským národům. Pokud Evropská federace nepřipraví účinný plán, jak je zastavit, Evropa bude ztracena." # todo: NEW TRANSLATION
 EH_event.811.a: "Co teď?" # todo: NEW TRANSLATION
 EH_event.900.t: "Pád Washingtonu D.C." # todo: NEW TRANSLATION
 EH_event.900.d: "Hlavní město bývalých Spojených států amerických padlo.\n\nSíly Chimér zahájily ničivý útok, prolomily obranu města a přemohly vojenské jednotky. Ikonické památky nyní leží v troskách a kdysi rušné ulice jsou děsivě tiché.\n\nPřeživší vyprávějí otřesné příběhy o chaosu a zkáze, když město padlo do rukou houfu." # todo: NEW TRANSLATION
 EH_event.900.a: "Srdce národa je ztraceno..." # todo: NEW TRANSLATION
 EH_event.901.t: "Pád New Yorku" # todo: NEW TRANSLATION
 EH_event.901.d: "New York padl do rukou houfu Chimér.\n\nTvorové využili podzemní tunely a systém metra, aby obešli obranu na povrchu a zaskočili vojenské jednotky. Ikonické panorama města je nyní siluetou zkázy, v níž zuří požáry a hroutí se budovy.\n\nStaten Island padl jako první a nyní je celé město pod kontrolou Chimér." # todo: NEW TRANSLATION
 EH_event.901.a: "Socha Svobody je pryč..." # todo: NEW TRANSLATION
 EH_event.902.t: "Pád Los Angeles" # todo: NEW TRANSLATION
 EH_event.902.d: "Los Angeles padlo.\n\nKdysi krásné město je nyní jen vzpomínkou pro nespočet uprchlíků prchajících před neúnavným postupem Chimér. Ikonický nápis Hollywood nyní zůstává ponurou připomínkou toho, co jsme ztratili." # todo: NEW TRANSLATION
 EH_event.902.a: "Taková ztráta..." # todo: NEW TRANSLATION
 EH_event.903.t: "Pád San Francisca" # todo: NEW TRANSLATION
 EH_event.903.d: "San Francisco je pryč.\n\nChiméry se vynořily z podzemních puklin a pobřežních průlomů a děsivou rychlostí obešly obranné linie. Pacifické velitelství hlásí, že všechny zbývající síly byly zničeny nebo odříznuty. Civilní ztráty jsou katastrofální.\n\nDalší velké město padlo do rukou houfu." # todo: NEW TRANSLATION
 EH_event.903.a: "Golden Gate je ztracen..." # todo: NEW TRANSLATION
 EH_event.904.t: "Pád Moskvy" # todo: NEW TRANSLATION
 EH_event.904.d: "Moskva padla.\n\nHouf Chimér zahájil koordinovaný útok a díky početní převaze a zuřivosti přemohl obranu města. Kreml, kdysi symbol ruské odolnosti, nyní leží v troskách.\n\nPřeživší hovoří o chaosu a zoufalství, když město podlehlo neúnavnému postupu tvorů." # todo: NEW TRANSLATION
 EH_event.904.a: "Srdce Ruska je ztraceno..." # todo: NEW TRANSLATION
 EH_event.905.t: "Pád Šanghaje" # todo: NEW TRANSLATION
 EH_event.905.d: "Šanghaj padla.\n\nHouf udeřil drtivou silou, nejprve přes jižní předměstí a poté přes řeku Chuang-pchu, čímž zaskočil obránce během ústupu. Bund se proměnil v hřbitov ohořelé oceli a rozbitého betonu. Satelitní přenosy nyní ukazují jen ticho, prázdnou skořápku města." # todo: NEW TRANSLATION
 EH_event.905.a: "Kdy je zastavíme?" # todo: NEW TRANSLATION
 EH_event.1000.t: "Portál Chimér uzavřen!" # todo: NEW TRANSLATION
 EH_event.1000.d: "Projekt T.E.S.L.A. se ukázal jako obrovský úspěch. [FROM.GetName] provedlo úspěšný nájezd s cílem uzavřít jeden z portálů Chimér, což způsobilo, že všechny síly Chimér v obrovském perimetru okamžitě ztratily vědomí. Tvorové jsou stále naživu, proto se místnímu obyvatelstvu doporučuje, aby nepřicházelo do kontaktu s jejich těly. Národní armáda je na cestě, aby jednotky Chimér ve spánku zabila." # todo: NEW TRANSLATION
 EH_event.1000.a: "Ti zkurvysyni to dokázali." # todo: NEW TRANSLATION
 EH_focus_event.1.t: "Plán velké mobilizace" # todo: NEW TRANSLATION
 EH_focus_event.1.d: "Objevili se náhle. Útočí na všechno, co se hýbe, a nepřestanou, dokud nebude všechno mrtvé. Naši vědci se snaží zjistit, co jsou tyto bytosti zač, odkud pocházejí a jak je zastavit. Mezitím se naše armáda snaží udržet frontovou linii a chránit občany. Musíme jednat rychle, než dosáhnou našich hranic. Můžeme se spolehnout na profesionální armádu, nebo vyhlásit masivní mobilizaci." # todo: NEW TRANSLATION
 EH_focus_event.1.a: "Vrhněme na ně všechno, co máme!" # todo: NEW TRANSLATION
 EH_focus_event.1.b: "Spolehneme se na profesionální armádu." # todo: NEW TRANSLATION
 EH_focus_event.2.t: "První generace chitinových vojáků" # todo: NEW TRANSLATION
 EH_focus_event.2.d: "Nedávný výzkum jednotek Chimér umožnil vytvořit nový druh vojáků – chitinové vojáky. Nové brnění učiní naše lidi odolnějšími vůči fyzickým útokům mimozemšťanů a jeho futuristický design přináší obyvatelstvu naději a vzrušení." # todo: NEW TRANSLATION
 EH_focus_event.2.a: "Když se fikce setká s realitou." # todo: NEW TRANSLATION
 EH_focus_event.3.t: "Drony dosáhly cíle" # todo: NEW TRANSLATION
 EH_focus_event.3.d: "Drony pořídily podrobné snímky struktury kolem portálu. Aby vědci lépe pochopili její účel a fungování, kromě obranného využití, budou muset získaná data analyzovat. Naštěstí existuje profesor biologie, který se bude chtít na fotografie podívat zblízka." # todo: NEW TRANSLATION
 EH_focus_event.3.a: "Doufejme, že to stálo za to." # todo: NEW TRANSLATION
 EH_focus_event.4.t: "Chiméry zničily letku dronů" # todo: NEW TRANSLATION
 EH_focus_event.4.d: "Síly Chimér úspěšně zachytily a zničily letku dronů dříve, než mohla dokončit svou misi. Ani jediný stroj nestihl pořídit a odeslat jediný snímek, než byl sestřelen." # todo: NEW TRANSLATION
 EH_focus_event.4.a: "Další selhání..." # todo: NEW TRANSLATION
 EH_focus_event.5.t: "Síly Chimér zničily výzkumné pracoviště" # todo: NEW TRANSLATION
 EH_focus_event.5.d: "Síly Chimér objevily a zničily jedno z našich výzkumných pracovišť. Část výzkumných dat byla ztracena, ale přinejmenším Chiméry neodešly bez ztrát." # todo: NEW TRANSLATION
 EH_focus_event.5.a: "Najděte přeživší!" # todo: NEW TRANSLATION
 EH_focus_event.6.t: "Síly Chimér odraženy od výzkumného pracoviště" # todo: NEW TRANSLATION
 EH_focus_event.6.d: "Chiméry nedokázaly zničit naše výzkumné pracoviště. Žádná výzkumná data nebyla ztracena a vědci jsou v bezpečí." # todo: NEW TRANSLATION
 EH_focus_event.6.a: "Velké vítězství!" # todo: NEW TRANSLATION
 EH_focus_event.7.t: "Pohřešovaný vědec" # todo: NEW TRANSLATION
 EH_focus_event.7.d: "Jeden z vědců nedokázal uprchnout z výzkumného pracoviště před útokem sil Chimér. Nevíme, zda je vědec mrtvý, nebo naživu, ale musíme předpokládat nejhorší. V současnosti neexistuje způsob, jak zahájit záchrannou misi." # todo: NEW TRANSLATION
 EH_focus_event.7.a: "Zatraceně!" # todo: NEW TRANSLATION
 EH_focus_event.8.t: "Energetické emise portálu oslabují síly Chimér" # todo: NEW TRANSLATION
 EH_focus_event.8.d: "Díky delšímu sledování neobvyklých energetických emisí z portálu, které narušovaly naši satelitní síť, naši vědci zjistili, že tyto emise sledují velmi specifické vzorce. Nové satelity byly vybaveny speciálními senzory, které dokážou tyto emise zachytit a využít je k narušení komunikačních systémů Chimér. Tento průlom může síly Chimér výrazně oslabit." # todo: NEW TRANSLATION
 EH_focus_event.8.a: "Tohle je velký průlom!" # todo: NEW TRANSLATION
 EH_focus_event.9.t: "Soukromí vlastníci vysílají pracovníky na pomoc výzkumným pracovištím" # todo: NEW TRANSLATION
 EH_focus_event.9.d: "Velké soukromé korporace se spojily, aby pomohly našim vědcům ve výzkumu proti Chimérám. Vysílají své nejlepší pracovníky na pomoc s výstavbou nových výzkumných pracovišť, čímž celý proces výrazně urychlí." # todo: NEW TRANSLATION
 EH_focus_event.9.a: "Skvělé zprávy!" # todo: NEW TRANSLATION
 EH_focus_event.10.t: "Vojenští generálové nabízejí výzkumným pracovištím dodatečné zabezpečení" # todo: NEW TRANSLATION
 EH_focus_event.10.d: "Naši vojenští generálové nabídli vyslání dalších jednotek na ochranu našich výzkumných pracovišť před útoky Chimér. Jejich bojové zkušenosti a znalost taktiky Chimér budou neocenitelné při zajišťování bezpečnosti našich vědců a úspěchu našich projektů." # todo: NEW TRANSLATION
 EH_focus_event.10.a: "Vážíme si jejich podpory!" # todo: NEW TRANSLATION
 EH_focus_event.11.t: "Miliardář věnuje své peníze na financování aktiv" # todo: NEW TRANSLATION
 EH_focus_event.11.d: "Bohatý miliardář se rozhodl věnovat významnou část svého jmění na financování našich výzkumných pracovišť. Toto obrovské aktivum pokryje náklady na výstavbu nových zařízení a výrazně zvýší rychlost výzkumu." # todo: NEW TRANSLATION
 EH_focus_event.11.a: "Snižte mu daně!" # todo: NEW TRANSLATION
 EH_focus_event.12.t: "Objevena žíla randallitu" # todo: NEW TRANSLATION
 EH_focus_event.12.d: "Pátrací tým objevil novou žílu randallitu. Nyní je na nás, abychom zřídili těžební provoz a tento cenný zdroj vytěžili." # todo: NEW TRANSLATION
 EH_focus_event.12.a: "Zahajte těžbu!" # todo: NEW TRANSLATION
 EH_focus_event.12.b: "Nemůžeme si to dovolit." # todo: NEW TRANSLATION
 EH_focus_event.13.t: "Objevena železná žíla" # todo: NEW TRANSLATION
 EH_focus_event.13.d: "Pátrací tým objevil novou železnou žílu. Nyní je na nás, abychom zřídili těžební provoz, vytěžili ji a zvýšili naši produkci oceli." # todo: NEW TRANSLATION
 EH_focus_event.13.a: "Čekal jsem víc, ale stále to potřebujeme." # todo: NEW TRANSLATION
 EH_focus_event.13.b: "Nemůžeme si to dovolit." # todo: NEW TRANSLATION
 EH_focus_event.14.t: "Objevena hliníková žíla" # todo: NEW TRANSLATION
 EH_focus_event.14.d: "Pátrací tým objevil novou hliníkovou žílu. Nyní je na nás, abychom zřídili těžební provoz a tento zdroj vytěžili." # todo: NEW TRANSLATION
 EH_focus_event.14.a: "Žádný randallit? I tak dobrý obchod." # todo: NEW TRANSLATION
 EH_focus_event.14.b: "Nemůžeme si to dovolit." # todo: NEW TRANSLATION
 EH_focus_event.15.t: "Nestátní společnost objevila žílu randallitu" # todo: NEW TRANSLATION
 EH_focus_event.15.d: "Jedna z velkých soukromých korporací objevila novou žílu randallitu. Jsou ochotni zahájit těžbu na vlastní náklady, bez jakékoli pomoci vlády." # todo: NEW TRANSLATION
 EH_focus_event.15.a: "Ehm... nechte je." # todo: NEW TRANSLATION
 EH_focus_event.16.t: "[FROM.GetName] zahajuje poslední ofenzivu" # todo: NEW TRANSLATION
 EH_focus_event.16.d: "Po úspěšné detonaci zbraně T.E.S.L.A. u portálu Chimér zahájila armáda [FROM.GetName] rozsáhlou ofenzivu s cílem zlikvidovat všechny síly Chimér v oblasti. Portál je uzavřen a nepřítel dezorientovaný – tohle je naše šance zasadit rozhodující úder a získat zpět ztracená území." # todo: NEW TRANSLATION
 EH_focus_event.16.a: "Zvítězíme." # todo: NEW TRANSLATION
 EH_protect_the_homeland: "Chraňte vlast!" # todo: NEW TRANSLATION
 EH_protect_the_homeland_desc: "Napadly nás neznámé síly samotného ďábla. Musíme se bránit vším, co máme, odrazit hrozbu a přežít do dalšího dne!" # todo: NEW TRANSLATION
 EH_territorial_advantages: "Územní výhody" # todo: NEW TRANSLATION
 EH_territorial_advantages_desc: "Vetřelci jsou silnější v boji zblízka... nebo celkově v boji. Pokud je nemůžeme porazit silou, musíme být chytřejší. Nový obranný program nám pomůže využít krajinu ve svůj prospěch a možná to bude stačit k vítězství v některých bitvách." # todo: NEW TRANSLATION
 EH_cold_acclimatization: "Aklimatizace na chlad" # todo: NEW TRANSLATION
 EH_cold_acclimatization_desc: "Vetřelci jsou mimořádně odolní vůči nízkým teplotám. Dalším problémem je, že na Aljašce a v Tibetu se nacházejí dva portály. Pokud se k nim chceme přiblížit, musíme zesílit nebo vyvinout nové způsoby boje s chladem." # todo: NEW TRANSLATION
 EH_300: "300" # todo: NEW TRANSLATION
 EH_300_desc: "Úzké horské průsmyky představují neuvěřitelně obtížný terén. Pokud se mě ptáte, je to ideální místo pro přepadení. Dokud si poradíme s jejich leteckou podporou, můžeme tyto průsmyky využít k získání obrovské výhody v bitvách." # todo: NEW TRANSLATION
 EH_heat_acclimatization: "Aklimatizace na horko" # todo: NEW TRANSLATION
 EH_heat_acclimatization_desc: "Monstra jsou velmi odolná vůči silám přírody. I my musíme být silnější. Na této planetě bojujeme déle než tyto věci a nyní musíme tyto zkušenosti využít ve svůj prospěch." # todo: NEW TRANSLATION
 EH_sandstorms_are_our_allies: "Písečné bouře jsou našimi spojenci" # todo: NEW TRANSLATION
 EH_sandstorms_are_our_allies_desc: "Víme, kdy přicházejí písečné bouře. S těmito znalostmi můžeme připravit obranu a využít písek ve svůj prospěch. Jen doufejme, že monstra nemají žádné „biologické radary“." # todo: NEW TRANSLATION
 EH_observe_local_fauna: "Pozorování místní fauny" # todo: NEW TRANSLATION
 EH_observe_local_fauna_desc: "Zvířata poskytují dokonalý systém včasného varování. Tato monstra jsou hrozbou pro všechny druhy a naše zvířata si jejich přítomnost zřejmě již uvědomují. Velká skupina zvířat prchajících v panice může být důležitou informací, až naše radary zmlknou." # todo: NEW TRANSLATION
 EH_our_weakness_to_their_disadvantage: "Naše slabost v jejich neprospěch" # todo: NEW TRANSLATION
 EH_our_weakness_to_their_disadvantage_desc: "Roviny jsou pro naše vozidla mimořádně užitečné, ale tanky a bojová vozidla pěchoty nestačí k zastavení těchto monster. Díky plochému terénu však budeme moci připravit něco zvláštního, co nám snad poskytne dočasnou výhodu na bojišti." # todo: NEW TRANSLATION
 EH_electric_traps: "Elektrické pasti" # todo: NEW TRANSLATION
 EH_electric_traps_desc: "Pomocí řízených silných elektrických výbojů bychom měli být schopni získat několik minut času k útoku na nepřátelské jednotky. Spotřeba energie bude obrovská, takže budeme muset najít způsob, jak v zemi snížit spotřebu elektřiny, nebo připravit nová staveniště." # todo: NEW TRANSLATION
 EH_transfer_energy_from_civilian_sector: "Převod energie z civilního sektoru" # todo: NEW TRANSLATION
 EH_transfer_energy_from_civilian_sector_desc: "Když jsou pasti aktivní, spotřebováváme příliš mnoho energie. Jejich nabíjení trvá příliš dlouho a nemůžeme čekat celý týden, než je znovu použijeme. Převedeme část energie z veřejného sektoru do našich energetických zásob." # todo: NEW TRANSLATION
 EH_invest_in_additional_power_sources: "Investice do dodatečných zdrojů energie" # todo: NEW TRANSLATION
 EH_invest_in_additional_power_sources_desc: "Válka již nesmí civilisty ovlivňovat více, než tomu tak je. Zřídíme nový projekt reaktoru, abychom zajistili energetickou bezpečnost pro dnešek i každý další den." # todo: NEW TRANSLATION
 EH_reduce_energy_loss: "Snížení energetických ztrát" # todo: NEW TRANSLATION
 EH_reduce_energy_loss_desc: "Tyto pasti spotřebovávají příliš mnoho energie. Jsou účinné, ale nákladné pro naši infrastrukturu. Nemůžeme snížit jejich výkon, ale můžeme najít způsoby, jak omezit spotřebu z jiných zdrojů." # todo: NEW TRANSLATION
 EH_nation_remains_untouched: "Národ zůstává nedotčen" # todo: NEW TRANSLATION
 EH_nation_remains_untouched_desc: "Ať už jsou tyto bytosti cokoli, nemůžeme všechno podřídit posílení armády. Lidé budou dál žít normálním životem, jako by se nic špatného nedělo..." # todo: NEW TRANSLATION
 EH_put_away_internal_problems: "Odložení vnitřních problémů" # todo: NEW TRANSLATION
 EH_put_away_internal_problems_desc: "Ochrana vlasti je nyní nejdůležitějším cílem. Bez armády nebude žádný národ, který by bylo možné chránit. Lidé se budou muset se svými problémy vypořádat sami, zatímco my posílíme armádu. Pokud armáda selže, selže i společnost." # todo: NEW TRANSLATION
 EH_minimal_military_focus: "Minimální vojenské zaměření" # todo: NEW TRANSLATION
 EH_minimal_military_focus_desc: "Civilní průmysl je nyní důležitější než výroba nových zbraní. Pokud je válka daleko od nás, není důvod utrácet za obranu příliš mnoho peněz." # todo: NEW TRANSLATION
 EH_high_military_focus: "Silné vojenské zaměření" # todo: NEW TRANSLATION
 EH_high_military_focus_desc: "Nepřítel se každý den přibližuje k našemu hlavnímu městu. Nesmíme polevit v ostražitosti a musíme urychlit výrobu." # todo: NEW TRANSLATION
 EH_lower_conscription: "Omezení odvodů" # todo: NEW TRANSLATION
 EH_lower_conscription_desc: "Ostatní národy ztrácejí mnoho živé síly, ale naši vojáci většinou hlídají hranice. Nemusíme verbovat další, jen abychom utráceli více peněz za armádu." # todo: NEW TRANSLATION
 EH_extended_conscription: "Rozšířené odvody" # todo: NEW TRANSLATION
 EH_extended_conscription_desc: "Udržet nepřítele mimo naše hranice je nejdůležitější úkol, nesmíme ztratit další území!" # todo: NEW TRANSLATION
 EH_prioritize_corporations: "Upřednostnění korporací" # todo: NEW TRANSLATION
 EH_prioritize_corporations_desc: "Válka zničí naši ekonomiku. Musíme udržet korporace loajální státu, abychom se nedostali do vážných problémů." # todo: NEW TRANSLATION
 EH_prioritize_military_companies: "Upřednostnění vojenských společností" # todo: NEW TRANSLATION
 EH_prioritize_military_companies_desc: "Výzkum a zvýšená výroba zbraní musí být naší nejvyšší prioritou. Bez zbraní naši muži nebudou schopni bojovat s těmito bezbožnými tvory." # todo: NEW TRANSLATION
 EH_a_new_resource: "Nový(?) zdroj" # todo: NEW TRANSLATION
 EH_a_new_resource_desc: "Dr. Lisa Randallová již nějakou dobu studuje nový zdroj, randallit. Spolu se svým vědeckým týmem objevila jeho mimořádnou odolnost při neuvěřitelně nízké hmotnosti. Po objevení randallitu si ostatní národy všimly klesajícího množství [RESOURCE HERE]. Je možné, že portály jej přeměňují na randallit. Možná jde o běžný zdroj na druhé straně portálu? Potřebujeme další výzkum." # todo: NEW TRANSLATION
 EH_a_fine_addition_to_my_collection: "Skvělý přírůstek do mé sbírky" # todo: NEW TRANSLATION
 EH_a_fine_addition_to_my_collection_desc: "Randallit bude skvělou součástí zbraní a brnění. Jakmile se randallitem vybavíme, možná dokážeme odrazit nejen mimozemské tvory, ale i ostatní národy." # todo: NEW TRANSLATION
 EH_first_hacs_prototype: "První prototyp HACS" # todo: NEW TRANSLATION
 EH_first_hacs_prototype_desc: "Jaegery, Atlas, Evangelion a další. Pokročilé bojové mechy zůstávaly pouhou fikcí, dokud nedávné události vše nezměnily. High Agility Combat System (HACS) je skutečný operační bojový mech, zkonstruovaný pouze díky vlastnostem randallitu. Hmotnost již není velkým problémem, protože jsme začali používat slitinu mnohem pevnější než ocel a lehčí než hořčík. Díky této technologii bychom konečně mohli způsobit nepřátelským silám významné škody." # todo: NEW TRANSLATION
 EH_new_enemy_new_strategy: "Nový nepřítel, nová strategie" # todo: NEW TRANSLATION
 EH_new_enemy_new_strategy_desc: "Hloupé problémy vyžadují hloupá řešení a tohle je ten nejhloupější problém, s jakým jsme se kdy setkali. Mimozemšťané bojují jako někdo, kdo se nebojí zranění, a toho využijeme. Brnění těžkých jednotek poskytuje velkou ochranu, ale není neproniknutelné. Tento boj musíme vyhrát rychlostí proti obrněným jednotkám a silou proti létajícím tvorům. To znamená, že potřebujeme více randallitu a samozřejmě také náboje." # todo: NEW TRANSLATION
 EH_more_mechs_less_weapons: "Více mechů, méně zbraní" # todo: NEW TRANSLATION
 EH_more_mechs_less_weapons_desc: "Mechové jsou naší jedinou účinnou zbraní proti těmto tvorům. Jejich výroba trvá dlouho a zásoby randallitu jsou omezené. Bude lepší přeměnit některé továrny na výrobu součástí pro mechy místo původních zbraní." # todo: NEW TRANSLATION
 EH_more_weapons_less_mechs: "Více zbraní, méně mechů" # todo: NEW TRANSLATION
 EH_more_weapons_less_mechs_desc: "Výroba mechů spotřebovává většinu našich zdrojů. Pokud budeme pokračovat v této plnohodnotné výrobě, naše ekonomika se může propadnout do deprese a z dluhů se už nikdy nevzpamatujeme. Je válka, ale kvůli těmto novým strojům nemůžeme zničit naši ekonomiku." # todo: NEW TRANSLATION
 EH_iron_man: "Iron Man?" # todo: NEW TRANSLATION
 EH_iron_man_desc: "První nové mechy již bojují na bojišti. Nyní začal skutečný boj, ve kterém máme konečně šanci proti Vetřelcům. Někteří lidé začali spekulovat, jak daleko se s touto technologií můžeme dostat. Samozřejmě, že fanoušci Marvelu nám začali posílat své návrhy brnění Iron Mana... vlastně, proč ne?" # todo: NEW TRANSLATION
 EH_second_generation_hacs: "HACS druhé generace" # todo: NEW TRANSLATION
 EH_second_generation_hacs_desc: "Díky návrhům od nadšenců a profesionálních inženýrů jsme připraveni začít s plánováním nových mechů o něco dříve. Dosáhněme dalšího velkého milníku!" # todo: NEW TRANSLATION
 EH_highly_purified_randallite: "Vysoce čištěný randallit" # todo: NEW TRANSLATION
 EH_highly_purified_randallite_desc: "Nikdy jsme si nenašli dostatek času na čištění surového randallitu, protože výroba byla naší nejvyšší prioritou. Nyní však o tomto zdroji víme více a nemusíme tolik spěchat s objevováním jeho nových vlastností, takže můžeme věnovat čas maximalizaci jeho účinnosti." # todo: NEW TRANSLATION
 EH_increase_research_budget: "Zvýšit rozpočet na výzkum" # todo: NEW TRANSLATION
 EH_increase_research_budget_desc: "Druhá generace HACS měla velký úspěch, ale nemůžeme usnout na vavřínech. Lidstvo bude vždy požadovat něco lepšího a právě teď začínáme s přípravou třetí generace." # todo: NEW TRANSLATION
 EH_third_generation_hacs: "HACS třetí generace" # todo: NEW TRANSLATION
 EH_third_generation_hacs_desc: "Veškerá naše tvrdá práce vedla k tomuto okamžiku. Po měsících výzkumu a testování a s miliardami z našeho rozpočtu jsme připraveni vypustit největší bojový mech, jaký kdy historie bojových mechů spatřila!" # todo: NEW TRANSLATION
 EH_military_advantages: "Vojenské výhody" # todo: NEW TRANSLATION
 EH_military_advantages_desc: "Musíme zjistit, jak může randallit pomoci našim jednotkám. Zatímco se mechy vyrábějí, máme této rudy více, než můžeme spotřebovat na nové stroje. Musíme najít další způsoby jejího využití." # todo: NEW TRANSLATION
 EH_ranjets: "Randallitové proudové motory" # todo: NEW TRANSLATION
 EH_ranjets_desc: "Randallit nám umožnil postavit vůbec první bojové mechy. Je tak lehký, že se nemusíme omezovat pouze na tuto novou technologii. Vyřeší to mnoho problémů souvisejících s tahem a hmotností letadel. Letadla s lehčími trupy budou moci nést více nákladu a zbraní a naše proudové letouny budou obratnější než kdy dříve." # todo: NEW TRANSLATION
 EH_not_so_heavy_weapons: "Ne tak těžké zbraně" # todo: NEW TRANSLATION
 EH_not_so_heavy_weapons_desc: "Randallit můžeme při výrobě těžkých zbraní použít místo oceli, titanu a dalších materiálů. Zbraně budou lehčí a vojáci je budou snáze přenášet a používat. Nákladní automobily spotřebují při přepravě méně paliva, takže tato změna prospěje všem." # todo: NEW TRANSLATION
 EH_find_new_veins: "Najít nová ložiska" # todo: NEW TRANSLATION
 EH_find_new_veins_desc: "Mnoho nalezišť zdrojů bylo nahrazeno randallitem. Nevíme, jak tento proces postupuje, ale nyní může být vhodná chvíle začít kopat pro další zdroje. Možná najdeme další randallit pod zemí." # todo: NEW TRANSLATION
 EH_more_precious_than_gold: "Cennější než zlato" # todo: NEW TRANSLATION
 EH_more_precious_than_gold_desc: "Randallit je již všude. Obrovské společnosti utrácejí miliardy dolarů, aby se k tomuto zdroji dostaly. Je to jako stará dobrá zlatá horečka, ale randallit je mnohem užitečnější než zlato. Můžeme z něj vyrábět běžné nástroje, stroje a zbraně, a to je jen velmi zkrácený seznam. My, stát, musíme najít co nejvíce randallitu, než chamtivé podniky získají monopol na jeho těžbu, výzkum a vývoz. Je těžké uvěřit, že skutečně musíme bojovat s vlastním národem, ale pokud se situace vymkne kontrole, mohou být konečným důsledkem omezení." # todo: NEW TRANSLATION
 EH_civilian_benefits: "Výhody pro civilisty" # todo: NEW TRANSLATION
 EH_civilian_benefits_desc: "Naše válečná situace je stabilní, takže se můžeme zaměřit na využití randallitu ve veřejných prostorách. Pokud se situace s Vetřelci zhorší, vždy můžeme bez větších problémů přejít na vojenskou výrobu." # todo: NEW TRANSLATION
 EH_a_wonderful_prosthesis: "Úžasná protéza" # todo: NEW TRANSLATION
 EH_a_wonderful_prosthesis_desc: "Neuvěřitelná odolnost a nízká hmotnost randallitu nám umožnily zkonstruovat nový model protézy nohy, díky němuž budou její uživatelé ještě „zdravější“, než by byli se svou původní nohou. Je čas posunout syntetická rozšíření lidského těla na kyberpunkovou úroveň!" # todo: NEW TRANSLATION
 EH_market_potential: "Tržní potenciál" # todo: NEW TRANSLATION
 EH_market_potential_desc: "Mnoho lidí se chce dostat k randallitu. Jelikož již nemusíme spěchat s vojenskými projekty, můžeme začít randallit prodávat investorům a pro komerční využití. Velké společnosti začnou nahrazovat své stroje stroji vyrobenými z randallitu, čímž se celosvětově sníží množství paliva používaného k pohonu těžkých strojů a vozidel." # todo: NEW TRANSLATION
 EH_study_new_enemy: "Studovat nového nepřítele" # todo: NEW TRANSLATION
 EH_study_new_enemy_desc: "Po jaderném úderu na tajemný Portál se kolem něj začal v kruhu šířit jakýsi nový druh tvorů. Jsou vysoce agresivní a útočí na vše, co se pohybuje. Nevíme, zda je dokážeme zastavit, ale pokud existuje způsob, jak se proti nim bránit, musíme co nejdříve zjistit jak." # todo: NEW TRANSLATION
 EH_launch_orbital_scans: "Zahájit orbitální průzkum" # todo: NEW TRANSLATION
 EH_launch_orbital_scans_desc: "Naše satelity můžeme využít ke studiu manévrů nepřítele a ke zjištění vzorců jeho pohybu, pokud nějaké má. To by mělo našim stratégům pomoci připravit účinnější pasti a protitaktiky." # todo: NEW TRANSLATION
 EH_find_the_weak_spots: "Najít slabá místa" # todo: NEW TRANSLATION
 EH_find_the_weak_spots_desc: "Tyto tvory lze zabít. Koneckonců jsou tvořeni krví a organickou hmotou. Pokud se nám podaří jednoho z nich dopravit do naší laboratoře, mohli bychom najít jejich nejdůležitější orgány a studovat je v náš prospěch. Jakmile zjistíme, které orgány jsou kritické, vycvičíme naše vojáky a bojové systémy, aby na ně podle možností útočili." # todo: NEW TRANSLATION
 EH_disassemble_invader_armor: "Rozebrat brnění Vetřelců" # todo: NEW TRANSLATION
 EH_disassemble_invader_armor_desc: "Většina Vetřelců je díky svému tvrdému chitinovému brnění odolná vůči našim zbraním. Můžeme zahájit výzkum jeho struktury a přizpůsobit ji lidskému tělesnému brnění. Možná se tak naše jednotky stanou o něco odolnějšími vůči nepřátelským útokům." # todo: NEW TRANSLATION
 EH_portals_must_be_the_key: "Portály musí být klíčem" # todo: NEW TRANSLATION
 EH_portals_must_be_the_key_desc: "Musíme shromáždit více informací o nejbližším Portálu, cokoli, co by pro nás mohlo být užitečné. Jsou odolné vůči jadernému úderu, ale nic není nezničitelné. Najdeme způsob, jak je uzavřít, i kdyby to znamenalo vyslat naše drony a letadla na sebevražedné mise." # todo: NEW TRANSLATION
 EH_investigate_strange_structure: "Prozkoumat podivnou strukturu" # todo: NEW TRANSLATION
 EH_investigate_strange_structure_desc: "Všimli jsme si podivného chování našich nepřátel. Zdá se, že kolem Portálů něco budují, pravděpodobně aby je zabezpečili. Pokud staví nějakou pevnost, musíme jednat rychle, než je zcela oddělí. Naším dalším krokem je připravit podrobnou průzkumnou misi s využitím našich bojových dronů. Nepřítel ovládá vzdušný prostor, takže jde spíše o sebevražednou misi, ale musíme doufat, že alespoň jednomu stroji se podaří pořídit snímky této struktury a odeslat je našemu velení." # todo: NEW TRANSLATION
 EH_finding_their_vulnerability: "Najít jejich zranitelnost" # todo: NEW TRANSLATION
 EH_finding_their_vulnerability_desc: "Dostatečně častým bombardováním bychom mohli odhalit slabiny komponentů, z nichž je tato struktura postavena. Nejdůležitější je ověřit odolnost vůči žáru a výbuchům a také toxickou korozi. Nemůžeme zjistit hustotu při zmrznutí, ale můžeme sledovat chování jiných materiálů těchto nestvůr a zjistit, jak budou reagovat na nižší teploty." # todo: NEW TRANSLATION
 EH_but_how_does_this_key_work: "Ale jak tento klíč funguje?" # todo: NEW TRANSLATION
 EH_but_how_does_this_key_work_desc: "Tyto Portály vedou do jiné dimenze, tím jsme si jistí. Ať už jde o Obrácenou stranu, Anti-Zemi nebo cokoli jiného, musí obsahovat něco, co jim umožňuje otevřít a udržovat spojení. Zjistit, jak to dělají, může být důležité pro pochopení jejich podstaty a fungování. A možná s trochou štěstí najdeme způsob, jak narušit jejich činnost a toto spojení ukončit." # todo: NEW TRANSLATION
 EH_project_tesla: "Projekt T.E.S.L.A." # todo: NEW TRANSLATION
 EH_project_tesla_desc: "Taktický elektromagnetický systém lineární anihilace bude naší největší šancí ukázat nestvůrám, kdo to tu skutečně řídí. Jakmile bude zbraň připravena, vystřelíme ji na nejbližší Portál. Pokud je naše teorie správná, elektromagnetický pulz by měl být dostatečně silný, aby přerušil spojení a možná jej dočasně nebo trvale uzavřel." # todo: NEW TRANSLATION
 EH_whole_new_dawn: "Zcela nové svítání" # todo: NEW TRANSLATION
 EH_whole_new_dawn_desc: "Víme vše, co potřebujeme vědět k uzavření Portálů. Pokud se budeme držet plánu, měli bychom být konečně dostatečně silní na ukončení této války." # todo: NEW TRANSLATION
 EH_DRONE_AMOUNT: "[?EH_selected_drones_var]" # todo: NEW TRANSLATION
 EH_INCREASE_AMOUNT: "Přidat k misi 1 §Ydron§!" # todo: NEW TRANSLATION
