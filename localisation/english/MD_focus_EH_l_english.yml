 EH_scientist_Jennifer_Doudna_tt: "§YJennifer Doudna§!" # todo: NEW TRANSLATION
 EH_scientist_Jennifer_Doudna_tt_delayed: "Jennifer Doudna je uznávaná biochemička známá průkopnickou prací na technologii editace genů CRISPR spolu s Emmanuelle Charpentier. Díky CRISPR bychom mohli lépe porozumět genetické skladbě Chiméry a najít způsob, jak využít její slabiny.\n--------------\n§YÚčinky:§!\n[!EH_hire_Jennifer_Doudna_button_click]\n\n§YPožadavky:§!\n[!EH_scientist_Jennifer_Doudna_click_enabled]" # todo: NEW TRANSLATION
 EH_scientist_Fabiola_Gianotti_tt: "§YFabiola Gianotti§!" # todo: NEW TRANSLATION
 EH_scientist_Fabiola_Gianotti_tt_delayed: "Fabiola Gianotti je italská experimentální částicová fyzička a současná generální ředitelka CERNu. Její odborné znalosti částicové fyziky a zkušenosti s rozsáhlou vědeckou spoluprací budou neocenitelné v našem úsilí porozumět Portálům a jejich spojení s jinou dimenzí.\n--------------\n§YÚčinky:§!\n[!EH_hire_Fabiola_Gianotti_button_click]\n\n§YPožadavky:§!\n[!EH_scientist_Fabiola_Gianotti_click_enabled]" # todo: NEW TRANSLATION
 EH_scientist_Lene_Hau_tt: "§YLene Hau§!" # todo: NEW TRANSLATION
 EH_scientist_Lene_Hau_tt_delayed: "Lene Hau je dánská fyzička známá průkopnickou prací na zpomalování a zastavování světla. Její odborné znalosti kvantové optiky a fyziky kondenzovaných látek by mohly přinést poznatky o povaze Portálů a jejich energetických emisích.\n--------------\n§YÚčinky:§!\n[!EH_hire_Lene_Hau_button_click]\n\n§YPožadavky:§!\n[!EH_scientist_Lene_Hau_click_enabled]" # todo: NEW TRANSLATION
 EH_scientist_Emmanuelle_Charpentier_tt: "§YEmmanuelle Charpentier§!" # todo: NEW TRANSLATION
 EH_scientist_Emmanuelle_Charpentier_tt_delayed: "Emmanuelle Charpentier je francouzská mikrobioložka a biochemička. Spolu s Jennifer Doudna vyvinula technologii editace genů CRISPR-Cas9. Její znalosti budou klíčové v našem úsilí porozumět biologii Chiméry a případně s ní manipulovat.\n--------------\n§YÚčinky:§!\n[!EH_hire_Emmanuelle_Charpentier_button_click]\n\n§YPožadavky:§!\n[!EH_scientist_Emmanuelle_Charpentier_click_enabled]" # todo: NEW TRANSLATION
 EH_scientist_Andrzej_Trautman_tt: "§YAndrzej Trautman§!" # todo: NEW TRANSLATION
 EH_scientist_Andrzej_Trautman_tt_delayed: "Andrzej Trautman je polsko-americký teoretický fyzik známý svou prací v obecné relativitě a fyzice černých děr. Jeho odborné znalosti by nám mohly pomoci pochopit základní fyziku za Portály a jejich účinky na náš svět.\n--------------\n§YÚčinky:§!\n[!EH_hire_Andrzej_Trautman_button_click]\n\n§YPožadavky:§!\n[!EH_scientist_Andrzej_Trautman_click_enabled]" # todo: NEW TRANSLATION
