 sp_monitor_portal_energy_emissions_project: "Monitorovat energetické emise Portálu" # todo: NEW TRANSLATION
 sp_monitor_portal_energy_emissions_project_desc: "Pomocí našich satelitů budeme monitorovat energetické emise z nejbližšího Portálu. To nám umožní shromáždit více informací o nepříteli a jeho pohybech. Pokud uspějeme, můžeme se také zbavit cyklických poruch v naší satelitní síti způsobených těmito emisemi." # todo: NEW TRANSLATION
 sp_monitor_portal_energy_emissions_project_prototype: "Nepravidelné energetické značky" # todo: NEW TRANSLATION
 sp_monitor_portal_energy_emissions_project_prototype_desc: "Naše poškozené satelity dokázaly oznámit některé nepravidelné energetické značky, které z Portálů neustále zachycují. Zdá se, že jsou zodpovědné za poruchy v naší satelitní síti. Můžeme připravit protiopatření na ochranu satelitů před těmito emisemi, nebo můžeme věnovat více času výzkumu tohoto jevu, abychom mu lépe porozuměli." # todo: NEW TRANSLATION
 sp_monitor_portal_energy_emissions_project_prototype_a: "Pokrok je nejdůležitější" # todo: NEW TRANSLATION
 sp_monitor_portal_energy_emissions_project_prototype_b: "Věnovat čas dalšímu výzkumu" # todo: NEW TRANSLATION
 sp_spies_in_hive_project: "Špioni v úlu" # todo: NEW TRANSLATION
 sp_spies_in_hive_project_desc: "Některé jednotky Chiméry se po úspěšném útoku vracejí do oblasti svého Portálu. V této fázi se zdají téměř instinktivní, což vytváří příležitost označit je sledovacím zařízením a malou kamerou. Poté jim dovolíme vrátit se k Portálu. Co by se mohlo pokazit?" # todo: NEW TRANSLATION
 sp_spies_in_hive_project_prototype: "Mechy mohou být našimi doručovateli" # todo: NEW TRANSLATION
 sp_spies_in_hive_project_prototype_desc: "Jelikož vyrábíme mechy, můžeme je použít k umístění sledovacích zařízení během boje s jednotkami Chiméry. Bude to riskantní a určitě ztratíme mnoho dobrých strojů i jejich pilotů, ale může nás to přiblížit k ukončení této války." # todo: NEW TRANSLATION
 sp_spies_in_hive_project_prototype_a: "Použít pouze mechy" # todo: NEW TRANSLATION
 sp_spies_in_hive_project_prototype_b: "Nemůžeme ztratit příliš mnoho mechů, pomůže armáda" # todo: NEW TRANSLATION
 sp_spies_in_hive_project_prototype_c: "Nepodstupovat další riziko" # todo: NEW TRANSLATION
 sp_the_tesla_weapon_project: "Zbraň T.E.S.L.A." # todo: NEW TRANSLATION
 sp_the_tesla_weapon_project_desc: "Taktický elektromagnetický systém lineární anihilace (T.E.S.L.A.) je superzbraň navržená k vysílání silného elektromagnetického pulzu (EMP), který dokáže vyřadit elektronické systémy v širokém okolí. Tato zbraň by mohla být klíčem k narušení Portálů a trvalému oslabení sil Chiméry." # todo: NEW TRANSLATION
 sp_the_tesla_weapon_project_prototype: "Přesměrování výzkumného sektoru" # todo: NEW TRANSLATION
 sp_the_tesla_weapon_project_prototype_desc: "Veškeré naše výzkumné úsilí můžeme přesměrovat k vývoji zbraně T.E.S.L.A. To projekt urychlí, ale může to zpozdit jiné důležité výzkumné iniciativy." # todo: NEW TRANSLATION
 sp_the_tesla_weapon_project_prototype_a: "Zaměřit veškerý výzkum na T.E.S.L.A." # todo: NEW TRANSLATION
 sp_the_tesla_weapon_project_prototype_b: "Vyvážit výzkumné úsilí" # todo: NEW TRANSLATION
 sp_the_tesla_weapon_project_prototype_c: "Nemůžeme si dovolit zpoždění" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project: "BF-38 Atlas" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_desc: "Mechy HACS první generace budou významným milníkem v našem boji proti Chiméře. Tyto mechy budou naším největším prostředkem v boji proti silám Chiméry." # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_one: "Odolnost, nebo palebná síla?" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_one_desc: "Bojiště je drsné místo a naše mechy musí být schopny odolávat silné palbě a zároveň zasazovat nepříteli ničivé údery. Můžeme se zaměřit na zvýšení odolnosti HACS a učinit je v boji houževnatějšími. Případně můžeme upřednostnit palebnou sílu a vybavit naše mechy pokročilými zbraněmi, aby nepřátele rychle likvidovaly." # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_one_a: "Zvýšit odolnost" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_one_b: "Upřednostnit palebnou sílu" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_one_c: "Takto je dokonalý" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_two: "Priorita komponent HACS" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_two_desc: "Máme nějaké volné prostředky na vylepšení konstrukce HACS. Můžeme se zaměřit na zvýšení pohyblivosti mechů, aby byly na bojišti rychlejší a obratnější. Případně můžeme investovat do vylepšení jejich zbraňových systémů a zvýšit jejich útočné schopnosti." # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_two_a: "Zaměřit se na pohyblivost" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_western_two_b: "Zaměřit se na výzbroj" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_one: "Možné snížení výroby" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_one_desc: "V konstrukci HACS můžeme vynechat některé bezpečnostní spouště a redundantní systémy, abychom urychlili výrobu. To sice může vést k mírnému zvýšení poruchovosti, ale umožní nám to rychleji nasadit na bojiště více mechů." # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_one_a: "Potřebujeme je co nejdříve" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_one_b: "Měli bychom na tom více zapracovat" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_one_c: "Zachovat současné výrobní standardy" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_two: "Účinnost na bojišti" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_two_desc: "Můžeme postavit větší počet mechů HACS a přemoci nepřítele pouhou početní převahou. Případně se můžeme zaměřit na zlepšení konstrukce mechů, aby byly v boji účinnější, i kdyby to znamenalo výrobu menšího počtu jednotek." # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_two_a: "Potřebujeme více mechů" # todo: NEW TRANSLATION
 sp_hacs_gen_one_project_prototype_eastern_two_b: "Vylepšit jejich konstrukci" # todo: NEW TRANSLATION
 sp_hacs_gen_two_project: "GSK-41 Bogatyr" # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_desc: "Nastal čas dalšího vylepšení našich nejnovějších majestátních mechů HACS. Díky nadšeným civilním inženýrům a vědcům se nám podařilo konstrukci našich mechů ještě více zdokonalit. Možná dokonce najdeme způsob, jak zlevnit jejich výrobu." # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_western_one: "Snížení spotřeby randallitu" # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_western_one_desc: "Při procházení starých výzkumných poznámek jsme našli několik nápadů, jak snížit množství randallitu použitého při výrobě HACS. Zavedením těchto změn můžeme snížit cenu každého mechu, aniž bychom výrazně ovlivnili jeho výkon." # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_western_one_a: "Jistě!" # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_western_one_b: "Nemůžeme naše mechy oslabit" # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_eastern_one: "Snížení spotřeby randallitu" # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_eastern_one_desc: "Díky novému výzkumu randallitu jsme našli způsob, jak dále snížit množství tohoto vzácného zdroje používaného při výrobě HACS. To nám umožní vyrábět více mechů ze stejného množství randallitu, ale stroje budou muset obětovat část svého výkonu." # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_eastern_one_a: "Jistě, proč ne" # todo: NEW TRANSLATION
 sp_hacs_gen_two_project_prototype_eastern_one_b: "To je na bojišti příliš velká nevýhoda" # todo: NEW TRANSLATION
 sp_hacs_gen_three_project: "SAS-32 Herkules" # todo: NEW TRANSLATION
 sp_hacs_gen_three_project_desc: "Nastal čas dalšího vylepšení našich nejnovějších majestátních mechů HACS. Díky nadšeným civilním inženýrům a vědcům se nám podařilo konstrukci našich mechů ještě více zdokonalit. Možná dokonce najdeme způsob, jak zlevnit jejich výrobu." # todo: NEW TRANSLATION
 sp_hacs_gen_three_project_prototype_one: "Konečná zbraň" # todo: NEW TRANSLATION
 sp_hacs_gen_three_project_prototype_one_desc: "Naši inženýři navrhli radikální přepracování mechů HACS s cílem vytvořit dokonalou zbraň proti Chiméře. Tato nová konstrukce posune hranice současné technologie a výsledkem bude mech rychlejší, silnější a odolnější než kdy dříve, ovšem za mnohem vyšší cenu." # todo: NEW TRANSLATION
 sp_hacs_gen_three_project_prototype_one_a: "To je dokonalá zbraň" # todo: NEW TRANSLATION
 sp_hacs_gen_three_project_prototype_one_b: "Potřebujeme je hned!" # todo: NEW TRANSLATION
 sp_hacs_gen_three_project_prototype_one_c: "Současná konstrukce je dokonalá" # todo: NEW TRANSLATION
