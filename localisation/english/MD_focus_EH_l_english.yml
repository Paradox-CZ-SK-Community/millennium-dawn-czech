 EH_electric_traps_TT: "Povolí rozhodnutí §YElektrické pasti§!, která se během války s Chimérou objeví na mapě (s aktivní kartou rozhodnutí). Každou past lze umístit v kontrolovaném státě, který je státem §Yprvní linie§! nebo §Ydruhé linie§!. Zřízení pasti stojí §R1 technologický kov§! a během aktivity spotřebovává §R100 MW§! energie.\n\nPast bude aktivní §Y10 dní§! a poté se na §Y15 dní§! přepne do stavu obnovy. Během aktivity pasti obdrží všechny nepřátelské jednotky ve státě §G+20 %§! §Yopotřebení§! a §G-15 %§! §Yrychlost pohybu§!. Past lze odstranit, čímž se vrátí §G1 technologický kov§!." # todo: NEW TRANSLATION
