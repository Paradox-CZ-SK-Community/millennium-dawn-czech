 ENG_building_britain_idea_desc: "Dlouhodobá průmyslová strategie propojuje investice do nápadů, lidí, infrastruktury a regionů, pomalu zvyšuje produktivitu a dává firmám jistotu plánovat, nabírat zaměstnance a budovat po celé zemi." # todo: NEW TRANSLATION
 ENG_ireland_border_cooperation_idea_IRE: "Přeshraniční spolupráce s Irskem" # todo: NEW TRANSLATION
 ENG_ireland_border_cooperation_idea_IRE_desc: "Praktické přeshraniční instituce a společné programy propojují Severní Irsko a Irsko v oblasti obchodu, infrastruktury a služeb, omezují administrativu a pomáhají zboží, lidem i myšlenkám volněji překračovat hranici." # todo: NEW TRANSLATION
 ENG_Space_Command0: "Britské schopnosti v kyberprostoru" # todo: NEW TRANSLATION
 ENG_Space_Command0_desc: "Spojené království pracuje na zlepšení svých schopností a zabezpečení svých zájmů ve vesmíru." # todo: NEW TRANSLATION
 ENG_Space_Command: "Vesmírné velitelství Spojeného království" # todo: NEW TRANSLATION
 ENG_Space_Command_desc: "Vesmírné velitelství Spojeného království je vedoucí složkou obrany pro vesmírné operace, vesmírný personál a vesmírné schopnosti. Jde o společné velitelství se základnou na RAF High Wycombe, které tvoří personál Royal Navy, britské armády a Royal Air Force spolu se státními zaměstnanci a dodavateli." # todo: NEW TRANSLATION
 ENG_Space_Command2: "Vesmírné velitelství Spojeného království" # todo: NEW TRANSLATION
 ENG_Space_Command2_desc: "Vesmírné velitelství Spojeného království je vedoucí složkou obrany pro vesmírné operace, vesmírný personál a vesmírné schopnosti. Jde o společné velitelství se základnou na RAF High Wycombe, které tvoří personál Royal Navy, britské armády a Royal Air Force spolu se státními zaměstnanci a dodavateli. S návratem slavných Rudých kabátů se těší vyšší morálce a obnovené hrdosti." # todo: NEW TRANSLATION
 ENG_Space_Command3: "Vesmírné velitelství Spojeného království" # todo: NEW TRANSLATION
 ENG_Space_Command3_desc: "Vesmírné velitelství Spojeného království je vedoucí složkou obrany pro vesmírné operace, vesmírný personál a vesmírné schopnosti. Jde o společné velitelství se základnou na RAF High Wycombe, které tvoří personál Royal Navy, britské armády a Royal Air Force spolu se státními zaměstnanci a dodavateli. Po vytvoření 1. vesmírné divize organizace překonala očekávání po celém světě a Británie zažívá novou éru dreadnoughtů." # todo: NEW TRANSLATION
 ENG_standardized_space_parts1: "Standardizované vesmírné součástky" # todo: NEW TRANSLATION
 ENG_standardized_space_parts1_desc: "Podpora komerčních společností, aby byl vesmír dostupnější a cenově přijatelnější, snížila náklady na výrobu vesmírných produktů." # todo: NEW TRANSLATION
 ENG_british_spaceports_privatized: "Britské kosmodromy privatizovány" # todo: NEW TRANSLATION
 ENG_british_spaceports_privatized_desc: "Spojené království přijímá novou hranici vesmírného průzkumu a privatizuje kosmodromy s cílem usnadnit komerční aktivity mimo Zemi. Tato soukromě provozovaná zařízení signalizují posun k podpoře inovací a rozvoji komerčního vesmírného průmyslu ve Spojeném království." # todo: NEW TRANSLATION
 ENG_Historical_Valor1: "Historická statečnost" # todo: NEW TRANSLATION
 ENG_Historical_Varlor1_desc: "Britské ozbrojené síly zakořeněné v tradicích čerpají hrdost ze své slavné minulosti. Generální štáb však zůstává pevně zakotven v konvenčních strategiích a k neověřeným taktikám je skeptický. Zatímco armáda stojí na prahu změny, vyvážení hrdosti a přizpůsobivosti se stává podstatou obrany národa." # todo: NEW TRANSLATION
 ENG_Aging_Military1: "Stárnoucí armáda" # todo: NEW TRANSLATION
 ENG_Aging_Military1_desc: "Kvůli zanedbanému financování čelí armáda Spojeného království vážným problémům spojeným se stárnutím, zastaralým vybavením a klesající kvalitou. Dopad finančního zanedbání se ozývá napříč řadami a ztěžuje udržení moderních a účinných ozbrojených sil." # todo: NEW TRANSLATION
 ENG_desert_hawk: "Pouštní jestřáb" # todo: NEW TRANSLATION
 ENG_desert_hawk_desc: "Lockheed Martin Desert Hawk III je bezpilotní letoun navržený oddělením Skunkworks společnosti Lockheed Martin Aeronautics. Jde o malý průzkumný dron schopný radarového pozorování, signálového zpravodajství a zachycování komunikace spolu s dálkovým pozorováním pomocí nočního vidění, termovize a elektrooptických senzorů." # todo: NEW TRANSLATION
 ENG_archer_artillery_alliance: "Dělostřelecká aliance Archer" # todo: NEW TRANSLATION
 ENG_archer_artillery_alliance_desc: "Dělostřelecká aliance Archer, vyvinutá Švédskem, představuje průlom v přesné palebné síle dlouhého dosahu. Díky automatickému nabíjení a rychlému nasazení tento dělostřelecký systém zajišťuje přesnou a flexibilní podporu na bojišti. Modulární konstrukce zvyšuje účinnost vojenských operací a poskytuje Švédsku a Spojenému království strategickou výhodu v boji." # todo: NEW TRANSLATION
 ENG_Boxer_Program: "Program Boxer" # todo: NEW TRANSLATION
 ENG_Boxer_Program_desc: "Program obrněných transportérů Boxer, na němž spolupracují Německo a Nizozemsko, přináší novou éru obrněných transportérů. Modulární konstrukce Boxeru umožňuje snadné přizpůsobení různým úkolům, včetně přepravy vojáků a zdravotnické evakuace. Díky pokročilé ochraně a vynikající pohyblivosti toto vozidlo zvyšuje bezpečnost a účinnost vojenského personálu v různých operačních prostředích." # todo: NEW TRANSLATION
 ENG_warrior_capability_sustainment_programme: "Program udržení schopností obrněných vozidel Warrior" # todo: NEW TRANSLATION
 ENG_warrior_capability_sustainment_programme_desc: "Zastaralý 30mm kanón RARDEN vozidla Warrior, který nedokáže přesně střílet za pohybu, vedl ke studiím nových zbraňových systémů a konstrukcí věží s cílem prodloužit jeho bojovou životnost. Současné plány počítají s přidáním plně stabilizované věže s kanónem CT40 ráže 40 mm, vylepšenou elektronickou architekturou a modulárním pancéřovým systémem s rychloupínacími sadami. Program podpůrného vozidla obrněné bojové skupiny zároveň navrhl přestavbu této platformy na obrněný transportér a její nahrazení vozidlem FV432." # todo: NEW TRANSLATION
 ENG_warrior_ajax_upgrades: "Modernizace Warrior Ajax" # todo: NEW TRANSLATION
 ENG_warrior_ajax_upgrades_desc: "Projekt modernizace Warrior Ajax vedený Spojeným královstvím představuje významné vylepšení ikonického bojového vozidla pěchoty Warrior. Díky pokročilým úpravám včetně lepší palebné síly, zdokonalených komunikačních systémů a modernizovaného pancéřování zajišťuje Warrior Ajax vynikající výkon na bojišti. Tyto modernizace posilují vojenské schopnosti Spojeného království a poskytují pozemním silám moderní a všestrannou obrněnou podporu v různých operačních situacích." # todo: NEW TRANSLATION
 ENG_fres_program_Idea: "Program FRES" # todo: NEW TRANSLATION
 ENG_fres_program_Idea_desc: "Program FRES (Future Rapid Effect System) Spojeného království je progresivní iniciativa, která zvyšuje vojenskou obratnost prostřednictvím všestranných pozemních platforem. Integrací špičkových technologií pro rychlou reakci zajišťuje připravenost Spojeného království na rozmanité mise." # todo: NEW TRANSLATION
 ENG_fixing_civil_servant_idea: "Náprava státní služby" # todo: NEW TRANSLATION
 ENG_fixing_civil_servant_idea_desc: "Naši vojáci potřebují spolehlivé vybavení. Pracujeme na splnění tohoto požadavku." # todo: NEW TRANSLATION
 ENG_special_command1: "Specializované velení" # todo: NEW TRANSLATION
 ENG_special_command1_desc: "Soustředíme se na zdokonalení specializace a účinnosti armády, abychom zvýšili bojové schopnosti našich ozbrojených sil. Tento závazek však přináší vyšší výdaje a náročnější požadavky na zdroje." # todo: NEW TRANSLATION
 ENG_special_command2: "Specializované velení" # todo: NEW TRANSLATION
 ENG_special_command2_desc: "Soustředíme se na zdokonalení specializace a účinnosti armády, abychom zvýšili bojové schopnosti našich ozbrojených sil. Tento závazek však přináší vyšší výdaje a náročnější požadavky na zdroje." # todo: NEW TRANSLATION
 ENG_special_command3: "Specializované velení" # todo: NEW TRANSLATION
 ENG_special_command3_desc: "Soustředíme se na zdokonalení specializace a účinnosti armády, abychom zvýšili bojové schopnosti našich ozbrojených sil. Tento závazek však přináší vyšší výdaje a náročnější požadavky na zdroje." # todo: NEW TRANSLATION
 ENG_mothballing_operations_idea: "Konzervace námořních plavidel" # todo: NEW TRANSLATION
 ENG_mothballing_operations_idea_desc: "S rostoucím finančním tlakem se britská vláda přiklání ke konzervaci námořních lodí, což je praktický krok, který má v námořním průmyslu, zejména u BAE, smíšený ohlas. Ačkoli je cílem šetřit zdroje, toto rozhodnutí vyvolává v průmyslu obavy a vrhá stín na výrobu i pracovní sílu." # todo: NEW TRANSLATION
 ENG_UKSF1: "Speciální síly Spojeného království" # todo: NEW TRANSLATION
 ENG_UKSF1_desc: "Tyto vysoce vycvičené jednotky, tvořené elitními silami jako SAS a SBS, vynikají v tajných operacích, boji proti terorismu a nekonvenční válce. Přítomnost elitních speciálních sil zvyšuje strategickou obratnost a protiteroristické schopnosti Spojeného království a ztělesňuje dokonalost v přesnosti a přizpůsobivosti." # todo: NEW TRANSLATION
 ENG_UKSF2: "Speciální síly Spojeného království" # todo: NEW TRANSLATION
 ENG_UKSF2_desc: "Tyto vysoce vycvičené jednotky, tvořené elitními silami jako SAS a SBS, vynikají v tajných operacích, boji proti terorismu a nekonvenční válce. Přítomnost elitních speciálních sil zvyšuje strategickou obratnost a protiteroristické schopnosti Spojeného království a ztělesňuje dokonalost v přesnosti a přizpůsobivosti." # todo: NEW TRANSLATION
 ENG_aircraft_ai_idea: "Integrace umělé inteligence do letadel" # todo: NEW TRANSLATION
 ENG_aircraft_ai_idea_desc: "S rozvojem technologií je Spojené království průkopníkem v integraci umělé inteligence do letadel a propojuje špičkovou umělou inteligenci s leteckými schopnostmi. Tento národní duch vyjadřuje odhodlání využívat AI ke zlepšení výkonu letadel, autonomních systémů a adaptivních schopností pro plnění misí." # todo: NEW TRANSLATION
 ENG_quality_over_quantity: "Kvalita nad kvantitou" # todo: NEW TRANSLATION
 ENG_quality_over_quantity_desc: "Spojené království vedené zásadou kvality nad kvantitou upřednostňuje ve svých ozbrojených silách excelenci a technologickou převahu. Tento národní duch zdůrazňuje pořizování pokročilého a sofistikovaného vybavení a zajišťuje impozantní a technologicky vyspělou obrannou pozici. Zaměřením na kvalitu chce Spojené království maximalizovat účinnost svých sil a vytvořit strategickou výhodu tváří v tvář moderním výzvám." # todo: NEW TRANSLATION
 ENG_worldwide_command1: "Celosvětové velení" # todo: NEW TRANSLATION
 ENG_worldwide_command1_desc: "Koncept britského celosvětového armádního velení předpokládá strategický přístup, v němž britská armáda rozšiřuje svůj operační dosah po celém světě. Tato iniciativa zahrnuje vytvoření velitelské struktury schopné koordinovat a provádět vojenské operace v celosvětovém měřítku. Nasazením sil v různých regionech chce britská armáda posílit svůj globální vliv, reagovat na vznikající hrozby a přispívat k mezinárodní bezpečnosti. Britské celosvětové armádní velení představuje závazek k aktivnímu a všestrannému vojenskému působení v souladu s proměnlivou povahou globálních bezpečnostních výzev." # todo: NEW TRANSLATION
 ENG_worldwide_command2: "Celosvětové velení" # todo: NEW TRANSLATION
 ENG_worldwide_command2_desc: "Koncept britského celosvětového armádního velení předpokládá strategický přístup, v němž britská armáda rozšiřuje svůj operační dosah po celém světě. Tato iniciativa zahrnuje vytvoření velitelské struktury schopné koordinovat a provádět vojenské operace v celosvětovém měřítku. Nasazením sil v různých regionech chce britská armáda posílit svůj globální vliv, reagovat na vznikající hrozby a přispívat k mezinárodní bezpečnosti. Britské celosvětové armádní velení představuje závazek k aktivnímu a všestrannému vojenskému působení v souladu s proměnlivou povahou globálních bezpečnostních výzev." # todo: NEW TRANSLATION
