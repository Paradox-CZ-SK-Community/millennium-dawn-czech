 ENG_create_new_faction_TT: "Vytvoří novou frakci: Organizace atlantické bezpečnosti\n\nPomocí [ADS.GetFlag] Albionis budeme moci svrhnout zahraniční vlády!\n - Tuto schopnost získáme třikrát a bude dostupná v nabídce vlivu prostřednictvím tlačítka převratu. Objeví se také další možnost, která vám umožní použít [ADS.GetFlag] Albionis ke svržení dané vlády v Evropě a získat vazala a spojence." # todo: NEW TRANSLATION
 ENG_collapse_of_society_TT: "£text_icon_kaldanger Volba této možnosti může vést ke svržení vlády!\n - Umožní nám splnit zaměření §HRozdělené království, sjednocený stát§!\n - Po určité době zasáhne armáda a převezme správu státu" # todo: NEW TRANSLATION
 ENG_do_fp_TT: "Dokončena alespoň §H3§! zaměření zahraniční politiky" # todo: NEW TRANSLATION
 ENG_core_desc_TT: "Dosažením ekonomické, vojenské a politické hegemonie budeme moci třem hlavním státům Commonwealthu ukázat, že se o ně dokážeme postarat a chránit je. Jejich území se navíc budou ochotněji připojovat, pokud budou naše podmínky lepší." # todo: NEW TRANSLATION
 ENG_econ_hegemony_TT: "„Peníze vyřeší všechno“\n\nDosažením ekonomické hegemonie získáme dobrou pozici pro integraci dalších ekonomik, například ekonomik států Commonwealthu. K tomu potřebujeme:\n\nVyšší HDP než všechny tři státy dohromady\n- Náš současný HDP činí $[?gdp_per_capita] (tisíc)\n- Jejich současný HDP činí $[?commonwealth_total_gdp] (tisíc)" # todo: NEW TRANSLATION
 ENG_military_hegemony_TT: "„Silná armáda znamená silnou vládu“\n\nDosažením vojenské hegemonie ukážeme, že jsme schopni bránit svá území a svůj lid. K tomu potřebujeme:\n\nVíce nasazené živé síly než všechny tři státy dohromady\n- V současnosti máme nasazeno [?ENG.deployed_army_manpower_k] (tisíc) vojáků\n- Oni mají v současnosti nasazeno [?commonwealth_total_army] (tisíc) vojáků" # todo: NEW TRANSLATION
 ENG_political_hegemony_TT: "„Stačí tahat za nitky“\n\nDosažením politické hegemonie ukážeme, že vláda Westminsteru je stabilní, propojená a v kontaktu s lidmi všech společenských vrstev. K tomu potřebujeme:\n\nSilnou sféru vlivu\n- Alespoň 50% vlivu ve všech třech zemích" # todo: NEW TRANSLATION
 ENG_tooltip_TT: "Splňuje všechny požadavky ekonomické hegemonie" # todo: NEW TRANSLATION
