 ENG_prince_edward: "Edward" # todo: NEW TRANSLATION
 ENG_prince_edward_trait: "Hrabě z Wessexu" # todo: NEW TRANSLATION
 ENG_edward_1_idea: "Hrabě z Wessexu" # todo: NEW TRANSLATION
 ENG_edward_1_idea_desc: "Titul hraběte z Wessexu byl Edwardovi udělen jako významné královské vyznamenání spojené se službou a veřejnou odpovědností. Vychází ze starobylého anglického názvu s hlubokým historickým významem a přináší prestiž, aniž by znamenal ústavní pravomoc. V moderní Británii slouží jako platforma pro patronát, reprezentaci a soustavnou podporu veřejné činnosti monarchie." # todo: NEW TRANSLATION
