 ENG_the_inner_circle_dm_desc: "Královnin Vnitřní kruh sdružuje královský dvůr a nejdůvěryhodnější osobnosti [ENG.GetNameDef], oddané udržování autority královny $ENG_elizabeth_queen$ a ochraně zájmů Koruny. Spojeni povinností a prestiží soupeří o blízkost, jmenování a panovníkovu důvěru, neboť vědí, že vliv u dvora může utvářet politiku daleko za hranicemi veřejného pohledu. Jejich působení zasahuje do vojenských, průmyslových i politických rozhodnutí a prostřednictvím patronátu, přístupu a tichého vedení řídí Británii." # todo: NEW TRANSLATION
