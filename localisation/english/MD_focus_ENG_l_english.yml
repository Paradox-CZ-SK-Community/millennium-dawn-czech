 ENG_andrew_1_idea: "Velitel Královského námořnictva" # todo: NEW TRANSLATION
 ENG_andrew_1_idea_desc: "Andrew jako velitel Královského námořnictva sloužil s vyznamenáním v britském loďstvu, mimo jiné jako pilot vrtulníku a velitel lodi. Tento titul odráží jeho dlouhou aktivní službu, vedení námořních operací a hluboké spojení s námořním dědictvím Spojeného království." # todo: NEW TRANSLATION
 ENG_andrew_2_idea: "Velitel Královského námořnictva" # todo: NEW TRANSLATION
 ENG_andrew_3_idea: "Vévoda z Yorku" # todo: NEW TRANSLATION
 ENG_andrew_3_idea_desc: "Titul vévody z Yorku byl Andrewovi udělen jako výraz jeho postavení významného člena královské rodiny a druhého syna panovníka. Tradičně udělovaný mladším synům monarchů nese historickou prestiž a dlouhodobě se pojí s královskou službou a veřejnou povinností." # todo: NEW TRANSLATION
