 ENG_referendum_region_none: "Unie" # todo: NEW TRANSLATION
 ENG_union_settlement_referendum: "Referendum o uspořádání Unie v roce [GetYear] v oblasti [ENG_GetReferendumRegion]" # todo: NEW TRANSLATION
 ENG_union_settlement_referendum_desc: "Westminster předložil ústavní otázku voličům podle svých vlastních podmínek: trvalé uspořádání, které ukončí proces přenesení pravomocí, zákonem zakotví místo regionu ve Spojeném království a uzavře cestu k jakémukoli dalšímu referendu o nezávislosti. Hlasování je stále hlasováním a separatistické strany proti němu vedou kampaň všemi prostředky, které mají. Rozhodné odmítnutí nezávislosti toto uspořádání schválí. Cokoli menšího ponechá otázku přesně tam, kde byla, s vládou, která promarnila svou důvěru a prohrála.\n\nHlasujte pro odchod z Unie: §Y[?ENG_referendum_leave_vote|0]§!%" # todo: NEW TRANSLATION
 ENG_unionist_campaign_tour: "Předvolební turné unionistů" # todo: NEW TRANSLATION
 ENG_unionist_campaign_tour_desc: "Vyšlete kabinet do terénu. Radnice, tovární haly, loděnice a univerzitní odbory, každý den kampaně, osobní vysvětlování argumentů namísto tiskové zprávy napsané v Londýně. Posune to výsledek o několik bodů a lze to opakovat tak dlouho, dokud ministři vydrží.\n\nHlasujte pro odchod z Unie: §Y[?ENG_referendum_leave_vote|0]§!%" # todo: NEW TRANSLATION
 ENG_fiscal_settlement_offer: "Nabídněte finanční dohodu" # todo: NEW TRANSLATION
 ENG_fiscal_settlement_offer_desc: "Otevřete pokladnu. Zaručený blokový grant, kapitálové projekty potvrzené namísto pouhých slibů a spodní hranice financování, vše podepsané před volebním dnem. Voliči zvažující nezávislost proti svým rodinným financím si toho všimnou a závislost regionu na Westminsteru se s každou librou prohloubí.\n\nHlasujte pro odchod z Unie: §Y[?ENG_referendum_leave_vote|0]§!%" # todo: NEW TRANSLATION
 ENG_discredit_separatists: "Znevěrohodněte separatistickou kampaň" # todo: NEW TRANSLATION
 ENG_discredit_separatists_desc: "Postavte se proti separatistickému vedení. Jejich měnové plány, uspořádání hranice, finance a, pokud tomu budou odpovídat informace pro tisk, i jejich soukromý život. Funguje to častěji, než ne, a když ne, poskytne jim to křivdu a titulní stranu." # todo: NEW TRANSLATION
 ENG_discredit_separatists_tt: "§G60%§! šance, že kampaň zabere a podpora odchodu prudce klesne.\n§R40%§! šance, že se obrátí proti nám, zvýší podporu odchodu i místní nepokoje." # todo: NEW TRANSLATION
 ENG_further_devolution_pledge: "Slibte další přenesení pravomocí" # todo: NEW TRANSLATION
 ENG_further_devolution_pledge_desc: "Poslední karta v ruce: podepsaný slib, že hlas pro setrvání bude odměněn novými pravomocemi v oblasti daní, sociální péče a vysílání. Posune umírněné separatistické voliče a na generaci zklidní nacionalistickou politiku, ovšem za cenu předání pák, které by Westminster příště potřeboval k udržení regionu pohromadě.\n\nLze slíbit jednou za kampaň.\n\nHlasujte pro odchod z Unie: §Y[?ENG_referendum_leave_vote|0]§!%" # todo: NEW TRANSLATION
 ENG_referendum_leave_vote_down_4_tt: "Hlasování pro odchod z Unie: §G-4§!" # todo: NEW TRANSLATION
 ENG_referendum_leave_vote_down_6_tt: "Hlasování pro odchod z Unie: §G-6§!" # todo: NEW TRANSLATION
 ENG_referendum_leave_vote_down_7_tt: "Hlasování pro odchod z Unie: §G-7§!" # todo: NEW TRANSLATION
 ENG_promote_unionism_scotland: "Obhajujte Unii ve Skotsku" # todo: NEW TRANSLATION
 ENG_promote_unionism_scotland_desc: "Financujte pozemní působení unionistických stran ve Skotsku mezi volbami, nikoli během nich: udržujte otevřené volební kanceláře, nabírejte kandidáty v obvodech, které strana odepsala, a soustavně obhajujte Unii tam, kde se za ni roky nikdo nepostavil. Pomalá, neokázalá a jediná práce, která snižuje skotský nacionalismus.\n\nVyžaduje dostatečně nízké skotské nepokoje, aby argument získal sluch." # todo: NEW TRANSLATION
 ENG_scottish_unionism_calm_tt: "Skotské nepokoje jsou pod §G25§! (aktuálně §Y[?ENG_scottish_agitation|0]§!)" # todo: NEW TRANSLATION
 ENG_promote_unionism_nireland: "Obhajujte Unii v Severním Irsku" # todo: NEW TRANSLATION
 ENG_promote_unionism_nireland_desc: "Financujte unionistické občanské organizace v Severním Irsku mimo období pochodů: komunitní projekty v kontaktních oblastech, zaměstnanecké programy napříč komunitami a kandidáty, kteří dokážou udržet mandát, aniž by kandidovali na hranici. Pomalá práce a jediná věc, která snižuje severoirský nacionalismus.\n\nVyžaduje dostatečně nízké sektářské napětí, aby argument získal sluch." # todo: NEW TRANSLATION
 ENG_north_irish_unionism_calm_tt: "Sektářské napětí je pod §G25§! (aktuálně §Y[?ENG_north_irish_agitation|0]§!)" # todo: NEW TRANSLATION
 ENG_promote_unionism_wales: "Obhajujte Unii ve Walesu" # todo: NEW TRANSLATION
 ENG_promote_unionism_wales_desc: "Financujte organizaci unionistických stran ve Walesu: práci v obvodech údolí, kampaň ve velštině, která nepřenechá jazyk nacionalistům, a pozitivní obhajobu Unie namísto tvrzení, že čísla nevycházejí. Pomalá práce a jediná věc, která snižuje velšský nacionalismus.\n\nVyžaduje dostatečně nízké velšské nepokoje, aby argument získal sluch." # todo: NEW TRANSLATION
 ENG_wales_unionism_calm_tt: "Velšské nepokoje jsou pod §G25§! (aktuálně §Y[?ENG_wales_agitation|0]§!)" # todo: NEW TRANSLATION
 ENG_convene_constitutional_convention: "Svolejte ústavní konvent" # todo: NEW TRANSLATION
 ENG_convene_constitutional_convention_desc: "Ústavní uspořádání z roku 1998 bylo napsáno ve spěchu lidmi, kteří očekávali, že ho později znovu projednají, a tento pozdější okamžik nastal. Svolejte mezistranický konvent o budoucí podobě Unie: zástupce přenesených správ, opoziční frontbenchery, církve a odbory, kteří budou šest měsíců zasedat a podají zprávu Parlamentu, nikoli kabinetu.\n\nKonvent sám o ničem nerozhodne. Jeho zpráva bude právním a politickým základem, na němž může Westminster předložit trvalé uspořádání Skotsku, Severnímu Irsku nebo Walesu, a bez něj by žádnou nabídku uspořádání nikdo nebral vážně.\n\nVyžaduje vládu dostatečně stabilní na přežití tohoto sporu a žádné referendum či kampaň za nezávislost, které by již probíhaly." # todo: NEW TRANSLATION
 ENG_scottish_union_settlement: "Navrhněte skotské uspořádání v Unii" # todo: NEW TRANSLATION
 ENG_scottish_union_settlement_desc: "Když je skotská politika klidná, skotské finance jsou svázané s ministerstvem financí a strany podporující nezávislost jsou nejslabší, může Westminster předložit ústavní otázku Skotsku podle vlastních podmínek, místo aby čekal, až bude požádán. Uspořádání schválené u volebních uren trvale ukončí proces přenesení pravomocí: místo Skotska ve Spojeném království bude zakotveno zákonem, mechanismus referenda rozebrán a Holyrood přestane být cestou ven z Unie.\n\nOdmítnutí uspořádání nic nezmění a jeho opakování bude možné až za deset let.\n\nTlak na nezávislost: §Y[?ENG_scottish_pressure|0]§!/§G20§!\nSkotský nacionalismus: §Y[?ENG_scottish_nationalists|0]§!/§G25§!" # todo: NEW TRANSLATION
 ENG_scottish_settlement_calm_tt: "Tlak na skotskou nezávislost je pod §G20§! (aktuálně §Y[?ENG_scottish_pressure|0]§!)" # todo: NEW TRANSLATION
 ENG_scottish_settlement_ready_tt: "Skotský nacionalismus je pod §G25§! (aktuálně §Y[?ENG_scottish_nationalists|0]§!)" # todo: NEW TRANSLATION
 ENG_north_irish_union_settlement: "Navrhněte severoirské uspořádání v Unii" # todo: NEW TRANSLATION
 ENG_north_irish_union_settlement_desc: "Po odzbrojení odštěpenců, uklidnění provincie a oslabení republikánské politiky může Westminster předložit ústavní otázku Severnímu Irsku podle vlastních podmínek. Uspořádání schválené u volebních uren trvale ukončí proces přenesení pravomocí a uzavře referendum o hranici jako cestu ven z Unie.\n\nOdmítnutí uspořádání nic nezmění a jeho opakování bude možné až za deset let.\n\nTlak na nezávislost: §Y[?ENG_north_irish_pressure|0]§!/§G20§!\nSeveroirský nacionalismus: §Y[?ENG_north_irish_nationalists|0]§!/§G25§!" # todo: NEW TRANSLATION
 ENG_north_irish_settlement_calm_tt: "Tlak na severoirskou nezávislost je pod §G20§! (aktuálně §Y[?ENG_north_irish_pressure|0]§!)" # todo: NEW TRANSLATION
 ENG_north_irish_settlement_ready_tt: "Severoirský nacionalismus je pod §G25§! (aktuálně §Y[?ENG_north_irish_nationalists|0]§!)" # todo: NEW TRANSLATION
 ENG_welsh_union_settlement: "Navrhněte velšské uspořádání v Unii" # todo: NEW TRANSLATION
 ENG_welsh_union_settlement_desc: "Když je velšská politika klidná a křídlo Seneddu podporující nezávislost okrajové, může Westminster vyřešit ústavní otázku ve Walesu dříve, než ji kdokoli jiný otevře. Uspořádání schválené u volebních uren trvale ukončí proces přenesení pravomocí a zákonem zakotví místo Walesu ve Spojeném království.\n\nOdmítnutí uspořádání nic nezmění a jeho opakování bude možné až za deset let.\n\nTlak na nezávislost: §Y[?ENG_wales_pressure|0]§!/§G20§!\nVelšský nacionalismus: §Y[?ENG_wales_nationalists|0]§!/§G25§!" # todo: NEW TRANSLATION
 ENG_wales_settlement_calm_tt: "Tlak na velšskou nezávislost je pod §G20§! (aktuálně §Y[?ENG_wales_pressure|0]§!)" # todo: NEW TRANSLATION
 ENG_wales_settlement_ready_tt: "Velšský nacionalismus je pod §G25§! (aktuálně §Y[?ENG_wales_nationalists|0]§!)" # todo: NEW TRANSLATION
 devolution.11.t: "[ENG_GetReferendumRegion] hlasuje pro odchod" # todo: NEW TRANSLATION
 devolution.11.d: "Sčítání je dokončeno a výsledek není pochyb. Většina hlasovala pro odchod ze Spojeného království a vláda, která referendum vyhlásila, je povinna jej uskutečnit. Okamžitě začínají jednání o obraně, dluhu, měně a hranici a prvním krokem je ústavní krok: převod pravomocí, které Westminster po generaci odmítal postoupit, je nyní převodem suverenity." # todo: NEW TRANSLATION
 devolution.11.a: "Výsledek platí." # todo: NEW TRANSLATION
 devolution.12.t: "Unie obstála" # todo: NEW TRANSLATION
 devolution.12.d: "Kampaň za odchod prohrála. Účast byla vysoká, rozdíl je dostatečně jasný, takže ho nikdo důvěryhodný nezpochybňuje, a ústavní otázka je na generaci uzavřena jasným zněním hlasování. Separatistické strany se znovu zorganizují a hořkost z prohrané kampaně se bude usazovat roky, Spojené království však zůstává celistvé a Westminster má odpověď pro příští okamžik, kdy bude požadavek vznesen." # todo: NEW TRANSLATION
 devolution.12.a: "Jednou za generaci." # todo: NEW TRANSLATION
 devolution.13.t: "Uspořádání bylo schváleno" # todo: NEW TRANSLATION
 devolution.13.d: "Uspořádání bylo schváleno. [ENG_GetReferendumRegion] hlasoval pro uzavření ústavní otázky podle podmínek Westminsteru: proces přenesení pravomocí zde končí, místo regionu ve Spojeném království spočívá na mandátu, nikoli na zákoně, který by budoucí Parlament mohl zrušit, a žádné další referendum nebude vyhlášeno. Nacionalistické strany nyní argumentují proti výsledku, který odevzdali jejich vlastní voliči." # todo: NEW TRANSLATION
 devolution.13.a: "Otázka je vyřešena." # todo: NEW TRANSLATION
 devolution.14.t: "Uspořádání bylo odmítnuto" # todo: NEW TRANSLATION
 devolution.14.d: "Uspořádání bylo odmítnuto. Požadavek, aby se region vzdal práva požádat znovu, byl přijat přesně tak, jak separatisté tvrdili, a kampaň jim poskytla argument, který se roky marně snažili prosadit. Ústavně se nic nemění, peníze i politický kapitál jsou pryč a otázka, kterou se Westminster pokusil uzavřít, je nyní hlasitější než dříve." # todo: NEW TRANSLATION
 devolution.14.a: "Drahá chyba." # todo: NEW TRANSLATION
