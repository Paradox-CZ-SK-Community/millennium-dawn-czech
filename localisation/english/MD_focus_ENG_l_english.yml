 ENG_the_dissident_campaign: "Kampaň republikánských disidentů IRA" # todo: NEW TRANSLATION
 ENG_the_dissident_campaign_desc: "Republikánské disidentské skupiny, jako Real IRA a Continuity IRA, odmítají Velkopáteční dohodu a neuznávají britskou moc v Severním Irsku jako legitimní. Real IRA se v roce 1997 odštěpila od Provisional IRA s tvrzením, že je skutečnými republikány, a odsoudila mírový proces jako zradu. Provos považuje za kolaboranty, kteří vyměnili republiku za britskou moc. Continuity IRA vznikla dříve, v roce 1986, po rozkolu kvůli rozhodnutí Sinn Féin ukončit abstencionismus v Dáil Éireann. Odmítla směřování vedení a trvala na tom, že stávající republikánské hnutí opustilo skutečný ústavní nárok na irskou svrchovanost. Obě frakce odmítají legitimitu mírového procesu. Tyto skupiny vedou proti britské vládě konflikt nízké intenzity prostřednictvím bombových útoků, střelby a cílených útoků a zároveň působí jako de facto donucovací orgán v republikánských baštách, kde má Royal Ulster Constabulary omezenou kontrolu. Ověřené odzbrojení pod dohledem Nezávislé mezinárodní komise může kampaň definitivně ukončit a je nabízeno v rámci §HDecentralizovaných záležitostí§!, jakmile bude napětí v provincii sníženo." # todo: NEW TRANSLATION
 ENG_good_friday_agreement: "Velkopáteční dohoda" # todo: NEW TRANSLATION
 ENG_good_friday_agreement_desc: "Velkopáteční dohoda, podepsaná 10. dubna 1998, je souborem menších dohod, které ukončily většinu násilí spojeného s konfliktem o status Severního Irska. Unionisté, známí také jako loajalisté, převážně ulsterští protestanti, chtějí zůstat součástí Spojeného království. Naproti tomu irští republikáni a nacionalisté, převážně irští katolíci, usilovali o odchod Severního Irska ze Spojeného království a jeho připojení ke sjednocenému Irsku. Ačkoli se může zdát, že konflikt měl teologickou povahu, ve skutečnosti šlo o konflikt politický a národní, přičemž náboženství z velké části sloužilo jako prvek identity. Na základě Mnohostranné dohody byla v Severním Irsku obnovena samospráva v podobě dohody o dělbě moci mezi irskými nacionalisty a unionistickými skupinami. Reformy přijaté v rámci dohody sahaly od restrukturalizace policie po odzbrojení polovojenských organizací. Tato opatření mají položit základy stabilnějšího a mírumilovnějšího Irska. Budoucnost Severního Irska je nyní otázkou, kterou může Westminster vyřešit, nikoli pouze spravovat, a cesty k jejímu řešení se nacházejí v rámci §HDecentralizovaných záležitostí§!." # todo: NEW TRANSLATION
 ENG_the_macabre_alliance: "Ponuré spojenectví" # todo: NEW TRANSLATION
 ENG_the_macabre_alliance_desc: "Od konce 80. let zahájila BP průkopnickou strategii, tedy vysoce rizikový průzkum s vysokými výnosy, jehož cílem bylo zvrátit stálý pokles zásob ropy. V roce 1991 udeřila BP do černého, když naleziště Casanare přineslo největší ropný objev společnosti za více než dvě desetiletí. S tím však přišlo vysoké riziko útoků guerill. Jen v posledních několika letech Národní osvobozenecká armáda (ELN), jedna z kolumbijských guerillových organizací, vyhodila ropovod společnosti Occidental Petroleum do vzduchu více než 460krát a americkou společnost finančně vyčerpala. Šestnáctá brigáda, specializovaná armádní jednotka proslulá neetickými operacemi, byla vytvořena výslovně k ochraně ropných zájmů a stala se osobním popravčím oddílem BP v Casanare. Šestnáctou brigádu financovala a podporovala společnost Defence Systems Limited, britský soukromý bezpečnostní dodavatel založený bývalými členy SAS s hlubokými vazbami na britskou vládu. Ministerstvo zahraničí vyjádřilo svůj postoj jasně: BP bude fungovat bez problémů, ať to stojí cokoli. Generál Álvaro Velandia Hurtado tomu říká „řešení konfliktu“. Rodiny mrtvých tomu říkají jinak." # todo: NEW TRANSLATION
