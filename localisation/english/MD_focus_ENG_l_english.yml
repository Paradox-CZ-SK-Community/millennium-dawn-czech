 ENG_accuracy_mio_trait_finish_and_coating_line: "Linka povrchových úprav a nátěrů" # todo: NEW TRANSLATION
 ENG_accuracy_mio_trait_gauge_control_and_spc: "Kontrola měřidel a SPC" # todo: NEW TRANSLATION
 raid_type_ENG_raid_nigeria: "Operace Delta Guard" # todo: NEW TRANSLATION
 raid_type_ENG_raid_nigeria_desC: "Nestabilní nigerijská vláda prokázala neschopnost spravovat ropná pole v okolí delty. V důsledku toho budeme muset zasáhnout a podniknout kroky k obnovení stability." # todo: NEW TRANSLATION
 raid_type_ENG_raid_zimbabwe: "Operace Safeguard" # todo: NEW TRANSLATION
 raid_type_ENG_raid_zimbabwe_desc: "Tyran vládnoucí Zimbabwe musí být okamžitě svržen, protože mu nelze svěřit vládu nad zemí. Jeho jednání proti lidem britského původu i původnímu zimbabwskému obyvatelstvu prokázalo, že nemá žádné hranice a je zjevně ochoten překročit ty naše." # todo: NEW TRANSLATION
 raid_type_ENG_Wonga_Coup: "Operace Epic Fuck-Up" # todo: NEW TRANSLATION
 raid_type_ENG_Wonga_Coup_desc: "Operace Epic Fuck-Up má být pravým opakem svého názvu. Malá síla žoldnéřů, finančníků a místních spojenců se pokusí odstranit vládu Rovníkové Guineje a dosadit příznivější správu." # todo: NEW TRANSLATION
 ENG_seize_oil_wonga_coup_TT: "§HOdemkne nový nájezd§!: Operace Epic Fuck-Up\n - [ENG.GetFlag] Britské speciální jednotky budou moci zasáhnout a svrhnout [EGU.GetLeader] z [EGU.GetFlag] Rovníkové Guineje a nahradit ho britským chráněncem, silným mužem Severem Moto Nsá.\n\nPokud bude operace Epic Fuck-Up úspěšná\n - Zmocníme se jejich zdrojů ve státě §H$STATE_319$§! (tedy ropy, pokud jste příliš líní se podívat)" # todo: NEW TRANSLATION
 ENG_election_unlock_tt: "§YTento fokus lze odemknout, jakmile bude volbami vytvořena nová vláda§!" # todo: NEW TRANSLATION
 ENG_royal_armed_forces_review: "Revize královských ozbrojených sil" # todo: NEW TRANSLATION
 ENG_royal_armed_forces_review_desc: "Ozbrojené síly Koruny si zaslouží víc než ceremoniální prestiž. Systematická revize doktríny, výcvikových standardů a připravenosti všech tří složek znovu vybuduje královské ozbrojené síly jako důvěryhodnou bojovou sílu hodnou monarchie." # todo: NEW TRANSLATION
 ENG_household_division_revival: "Obnova gardové divize" # todo: NEW TRANSLATION
 ENG_household_division_revival_desc: "Gardová divize byla dlouho hrotem britské armády. Obnova jejích tradic a rozšíření její role obnoví elitní jádro vojska, jehož kvalita, disciplína a esprit de corps jej odlišují od hlavních sil." # todo: NEW TRANSLATION
 ENG_jewel_of_the_admiralty: "Klenot Admirality" # todo: NEW TRANSLATION
 ENG_jewel_of_the_admiralty_desc: "Královské námořnictvo je nejstarším symbolem projekce britské moci. Opětovné investice do jeho velkých lodí, prodloužení jejich operačního dosahu a obnova institucionální kultury světu signalizují, že Britannia stále vládne vlnám." # todo: NEW TRANSLATION
 ENG_wings_of_the_crown: "Křídla Koruny" # todo: NEW TRANSLATION
 ENG_wings_of_the_crown_desc: "Královské letectvo se zrodilo v žáru první světové války a ve druhé světové válce sehrálo rozhodující úlohu. Obnovené investice do výcviku pilotů, doktríny vzdušného boje a rozvoje leteckých es zajistí, že vzdušná převaha zůstane pilířem britské obrany." # todo: NEW TRANSLATION
 ENG_imperial_general_staff_restored: "Obnovený císařský generální štáb" # todo: NEW TRANSLATION
 ENG_imperial_general_staff_restored_desc: "Císařský generální štáb kdysi koordinoval pozemní, námořní a leteckou moc napříč globálním impériem. Obnovení jednotné struktury společného velení podřídí ozbrojené síly jediné strategické vizi a maximalizuje jejich společnou účinnost." # todo: NEW TRANSLATION
 ENG_reservist_corps_act: "Zákon o záložním sboru" # todo: NEW TRANSLATION
 ENG_reservist_corps_act_desc: "Britské záložní síly byly dlouhodobě nedostatečně využívaným zdrojem. Nový zákon o záložním sboru formalizuje odvodní cíle, urychlí mobilizační postupy a pevněji propojí záložní jednotky s jejich protějšky v pravidelné armádě." # todo: NEW TRANSLATION
 ENG_global_anglosphere_initiative: "Globální iniciativa anglosféry" # todo: NEW TRANSLATION
 ENG_global_anglosphere_initiative_desc: "Anglicky mluvící národy sdílejí víc než společný jazyk: sdílejí právní tradice, demokratické instituce a historická pouta utvářená po staletí. Koordinovaná iniciativa anglosféry poskytne Koruně diplomatickou platformu k prohloubení těchto vazeb a posílení britského vlivu od Ottawy po Canberru." # todo: NEW TRANSLATION
 ENG_crown_realm_status: "Královská říše" # todo: NEW TRANSLATION
 ENG_crown_realm_status_desc: "Tento národ uznává britského monarchu jako hlavu státu. Ústavní uspořádání poskytuje politickou stabilitu a úzké vazby na Commonwealth." # todo: NEW TRANSLATION
 ENG_crown_realm_monthly_influence_tt: "Měsíční britský vliv: §R+4%§!" # todo: NEW TRANSLATION
 ENG_crown_diplomatic_corps: "Diplomatický sbor Koruny" # todo: NEW TRANSLATION
 ENG_crown_diplomatic_corps_desc: "Vyhrazený sbor královských vyslanců, vybraných z nejlepších diplomatických talentů, které může Británie nabídnout, bude přímo zastupovat zájmy Koruny u zahraničních dvorů a v hlavních městech. Jejich úkolem je zlepšovat vztahy, usnadňovat jednání a zajistit, aby hlas Koruny měl váhu v každém koutě světa." # todo: NEW TRANSLATION
 ENG_royal_visits_abroad: "Královské návštěvy v zahraničí" # todo: NEW TRANSLATION
 ENG_royal_visits_abroad_desc: "Dobře načasované královské turné může dosáhnout toho, co měsíce tiché diplomacie nedokážou. Osobní přítomnost monarchy v zahraničí signalizuje odhodlání, vytváří dobrou vůli a zanechává trvalý dojem na vládách i obyvatelstvu." # todo: NEW TRANSLATION
 ENG_pax_britannica_reborn: "Znovuzrozená Pax Britannica" # todo: NEW TRANSLATION
 ENG_pax_britannica_reborn_desc: "Pax Britannica devatenáctého století byla vybudována na námořní převaze, kulturní prestiži a bezkonkurenčním diplomatickém dosahu. Obnovou monarchie, přesměrováním anglosféry a obnoveným závazkem ke globálnímu působení může Británie obnovit moderní obdobu: éru stability podloženou britskou mocí a cílevědomostí." # todo: NEW TRANSLATION
 ENG_royal_visits.1.t: "Královské turné" # todo: NEW TRANSLATION
 ENG_royal_visits.1.d: "Poradci monarchy předkládají užší seznam oblastí, kde by královské turné přineslo největší diplomatický užitek. Volba určí, kam bude soustředěna britská měkká síla a které vlády budou těžit z osobní pozornosti Koruny." # todo: NEW TRANSLATION
 ENG_royal_visits.1.a: "Navštívit Afriku" # todo: NEW TRANSLATION
 ENG_royal_visits.1.b: "Navštívit jižní a jihovýchodní Asii" # todo: NEW TRANSLATION
 ENG_royal_visits.1.c: "Navštívit Blízký východ" # todo: NEW TRANSLATION
 ENG_royal_visits.1.e: "Navštívit Latinskou Ameriku" # todo: NEW TRANSLATION
 ENG_crown_diplomatic_corps_idea: "Diplomatický sbor Koruny" # todo: NEW TRANSLATION
 ENG_crown_diplomatic_corps_idea_desc: "Aktivní sbor královských vyslanců působí v zahraničí, udržuje osobní kontakty se zahraničními vládami a napomáhá diplomatické agendě Koruny. Jejich přítomnost snižuje náklady na udržování vztahů a vytváří stálý přísun politického kapitálu." # todo: NEW TRANSLATION
 ENG_army_field_exercise: "Každoroční polní cvičení" # todo: NEW TRANSLATION
 ENG_army_field_exercise_desc: "Brigády britské armády provádějí rozsáhlá polní cvičení, aby zdokonalily schopnosti kombinovaných zbraní a zvýšily připravenost." # todo: NEW TRANSLATION
 ENG_army_engineering_corps: "Program bojového ženijního vojska" # todo: NEW TRANSLATION
 ENG_army_engineering_corps_desc: "Investice do výcviku a vybavení bojových ženistů zlepšují schopnost armády působit v obtížném terénu." # todo: NEW TRANSLATION
 ENG_armoured_tactics_programme: "Program obrněné taktiky" # todo: NEW TRANSLATION
 ENG_armoured_tactics_programme_desc: "Cvičení spojující nová obrněná vozidla s pěchotou a dělostřelectvem zdokonalují doktrínu moderního obrněného boje." # todo: NEW TRANSLATION
 ENG_energy_transition_programme: "Program energetické transformace" # todo: NEW TRANSLATION
 ENG_energy_transition_programme_desc: "Celovládní strategie urychlení přechodu k nízkouhlíkové energetice posiluje důvěru veřejnosti a průmyslové investice." # todo: NEW TRANSLATION
 ENG_critical_materials_reserve: "Rezerva kritických materiálů" # todo: NEW TRANSLATION
 ENG_critical_materials_reserve_desc: "Vládou podporované zásoby kritických průmyslových materiálů chrání britskou výrobu před narušením dodavatelských řetězců." # todo: NEW TRANSLATION
 ENG_research_excellence_awards: "Ceny za excelenci ve výzkumu" # todo: NEW TRANSLATION
 ENG_research_excellence_awards_desc: "Soutěžní granty pro univerzity a výzkumné ústavy podporují pokrok v elektronice a digitálních technologiích." # todo: NEW TRANSLATION
 britain_md.300.t: "Stavební kameny pod návrhem" # todo: NEW TRANSLATION
 britain_md.300.d: "Arm kupuje společnost Artisan Components a přechází od návrhů procesorů k fyzickým knihovnám, které každý návrh promění ve skutečný křemík. Je to posun výše v hodnotovém řetězci a odklon od čistě licenčního podnikání. Ministerstvo financí musí rozhodnout, zda se britská podpora výzkumu bude vztahovat i na tuto oblast." # todo: NEW TRANSLATION
 britain_md.300.a: "Rozšiřte podporu výzkumu na fyzický návrh" # todo: NEW TRANSLATION
 britain_md.300.b: "Nechte akvizici stát na jejích obchodních přednostech" # todo: NEW TRANSLATION
 britain_md.301.t: "Procesor v každé kapse" # todo: NEW TRANSLATION
 britain_md.301.d: "Jádro Arm je v centru nového telefonu společnosti Apple a téměř každého konkurenta, který bude následovat. Licenční poplatek za každý čip se počítá v pencích, zatímco objem v miliardách. Cambridge vytvořil něco, na čem nyní závisí celé odvětví, aniž by cokoli z toho vlastnil." # todo: NEW TRANSLATION
 britain_md.301.a: "Financujte kolem něj cambridgeské návrhářské centrum" # todo: NEW TRANSLATION
 britain_md.301.b: "Nechte licenční model, aby se uživil sám" # todo: NEW TRANSLATION
 britain_md.302.t: "Šedesát čtyři bitů" # todo: NEW TRANSLATION
 britain_md.302.d: "ARMv8 posouvá architekturu Arm na 64 bitů a s ní i do serverů a datových center, kterým Intel dominuje bez vážného konkurenta. Whitehall může postavit veřejnou výpočetní infrastrukturu na britské architektuře, nebo tuto otázku přenechat trhu. Jedinou pákou, která dokáže jednat tak rychle, jsou veřejné zakázky." # todo: NEW TRANSLATION
 britain_md.302.a: "Zaveďte architekturu do veřejné výpočetní infrastruktury" # todo: NEW TRANSLATION
 britain_md.302.b: "Zachovejte komerční neutralitu platformy" # todo: NEW TRANSLATION
 britain_md.303.t: "Nabídka SoftBank" # todo: NEW TRANSLATION
 britain_md.303.d: "SoftBank nabídla za Arm 24,3 miliardy liber, s prémií, které se žádný britský kupující nevyrovná, a se závazky ohledně sídla i počtu zaměstnanců v Británii. Společnost zůstane v Cambridge. Vlastnictví už britské nezůstane." # todo: NEW TRANSLATION
 britain_md.303.a: "Před dokončením prodeje získejte státní podíl" # todo: NEW TRANSLATION
 britain_md.303.b: "Přijměte závazky a nechte prodej pokračovat" # todo: NEW TRANSLATION
 britain_md.304.t: "Čtyřicet miliard dolarů za Arm" # todo: NEW TRANSLATION
 britain_md.304.d: "Nvidia se dohodla na koupi společnosti Arm od SoftBank. Vlastní licencovatelé společnosti Arm, kteří s Nvidií soutěží na každém významném trhu, se veřejně ptají, jaká neutralita by po prodeji zůstala. Rozhodnutí náleží úřadu pro hospodářskou soutěž a ministrům, kteří mu dávají pokyny." # todo: NEW TRANSLATION
 britain_md.304.a: "Schvalte prodej se závaznými pravidly chování" # todo: NEW TRANSLATION
 britain_md.304.b: "Předejte případ z důvodů národní bezpečnosti" # todo: NEW TRANSLATION
 britain_md.305.t: "Kde bude Arm kótován" # todo: NEW TRANSLATION
 britain_md.305.d: "SoftBank znovu uvádí Arm na burzu a zvolila New York. Londýnu bylo jasně řečeno, že jeho pravidla pro kotaci, váhy indexů a investorská základna by nedokázaly udržet největší technologickou společnost, jakou Británie vytvořila. Udržet kotaci doma by znamenalo přepsat všechny tři." # todo: NEW TRANSLATION
 britain_md.305.a: "Reformujte pravidla kotace a ukotvěte kotaci v Londýně" # todo: NEW TRANSLATION
 britain_md.305.b: "Přijměte kotaci v New Yorku a zachovejte sídlo" # todo: NEW TRANSLATION
 britain_md.306.t: "Čím se Arm stal" # todo: NEW TRANSLATION
 britain_md.306.d: "Čtvrtstoletí licencování, převzetí a kotací rozhodlo, čím Arm je: kdo vlastní cambridgeskou společnost, jejíž architektura je uvnitř téměř každého telefonu na světě, a která burza jí stanovuje cenu." # todo: NEW TRANSLATION
 britain_md.306.a: "Suverénní podíl v architektuře" # todo: NEW TRANSLATION
 britain_md.306.b: "Architektura platformy někoho jiného" # todo: NEW TRANSLATION
 britain_md.306.c: "Kótována doma" # todo: NEW TRANSLATION
 britain_md.306.e: "Ostrov, který licencuje celý svět" # todo: NEW TRANSLATION
 ENG_arm_sovereign_architecture_stake: "Suverénní podíl v architektuře" # todo: NEW TRANSLATION
 ENG_arm_sovereign_architecture_stake_desc: "Stát vlastní podíl ve společnosti, na jejíž instrukční sadě svět staví, a má právo veta nad jejím dalším směřováním. Podíl vynáší méně, než by vynášel na trhu, a kupuje něco, co trh neprodává." # todo: NEW TRANSLATION
 ENG_arm_foreign_platform_architecture: "Architektura zahraniční platformy" # todo: NEW TRANSLATION
 ENG_arm_foreign_platform_architecture_desc: "Arm nyní patří větší společnosti a její plán rozvoje slouží především křemíku této společnosti. Vývoj stále probíhá v Cambridge, v měřítku, které by žádný nezávislý poskytovatel licencí nedokázal financovat, a za podmínek někoho jiného." # todo: NEW TRANSLATION
 ENG_arm_listed_at_home: "Kótována doma" # todo: NEW TRANSLATION
 ENG_arm_listed_at_home_desc: "Kotace zůstala v Londýně a pravidla byla přepsána, aby tomu tak zůstalo. Burza konečně získala technologickou kotvu a reformy, které ji přilákaly, platí pro všechny, kdo se kótují později." # todo: NEW TRANSLATION
 ENG_arm_licensing_island: "Ostrov, který licencuje celý svět" # todo: NEW TRANSLATION
 ENG_arm_licensing_island_desc: "Návrhy jsou britské, vlastníci nikoli a akcie se obchodují v New Yorku. Británie si ponechává inženýry, licenční poplatky a pověst, ale žádnou kontrolu, která jí byla dvakrát dostupná a dvakrát odmítnutá." # todo: NEW TRANSLATION
 ENG_scottish_agitation_rising_tt: "Skotské nepokoje přesahují 10." # todo: NEW TRANSLATION
 ENG_north_irish_agitation_rising_tt: "Nepokoje v Severním Irsku přesahují 10." # todo: NEW TRANSLATION
 ENG_wales_agitation_rising_tt: "Nepokoje ve Walesu přesahují 10." # todo: NEW TRANSLATION
 ENG_scottish_referendum_pressure: "Výzvy ke skotskému referendu" # todo: NEW TRANSLATION
 ENG_scottish_referendum_pressure_desc: "Skotský parlament má většinu podporující nezávislost a argument pro Unii se již neozývá nikde, kde by ho veřejnost mohla slyšet. V Holyroodu se připravuje návrh zákona o referendu. Westminster má rok na to, aby ústavní otázka působila méně naléhavě než účet za elektřinu, ať už získáním podpory ve Skotsku, nebo tím, že skotské finance viditelně učiní závislými na ministerstvu financí. Pokud bude tlak po dozrání kampaně stále vyšší než 60, požadavek se stane formálním a musíme na něj odpovědět." # todo: NEW TRANSLATION
 ENG_scottish_pressure_defused_tt: "Tlak na skotskou nezávislost je pod §G50§!" # todo: NEW TRANSLATION
 ENG_north_irish_referendum_pressure: "Výzvy k referendu o hranici" # todo: NEW TRANSLATION
 ENG_north_irish_referendum_pressure_desc: "Nacionalistické strany drží rovnováhu ve Stormontu a tlačí na ministra pro Severní Irsko, aby stanovil datum referenda o hranici. Na stole je sektářské napětí i schopnost provincie financovat se vlastními silami a Republika vše sleduje. Westminster má rok na snížení těchto čísel, než se požadavek stane formálním." # todo: NEW TRANSLATION
 ENG_north_irish_pressure_defused_tt: "Tlak na severoirskou nezávislost je pod §G50§!" # todo: NEW TRANSLATION
 ENG_welsh_referendum_pressure: "Výzvy k velšskému referendu" # todo: NEW TRANSLATION
 ENG_welsh_referendum_pressure_desc: "Většina podporující nezávislost v Seneddu připravuje vlastní návrh zákona o referendu. Velšská nezávislost byla v Londýně dlouho považována za nerealistickou právě proto, že čísla nikdy nevycházela; tento argument platí jen do chvíle, kdy jsou to stále naše čísla, která můžeme ovlivňovat. Máme rok na snížení tlaku, než se požadavek stane formálním." # todo: NEW TRANSLATION
 ENG_welsh_pressure_defused_tt: "Tlak na velšskou nezávislost je pod §G50§!" # todo: NEW TRANSLATION
 ENG_decommission_tension_tt: "Sektářské napětí je pod §G15§! (aktuálně §Y[?ENG_north_irish_agitation|0]§!)" # todo: NEW TRANSLATION
 ENG_decommission_dependency_tt: "Závislost Severního Irska je nad §G60§! (aktuálně §Y[?ENG_north_irish_dependency|0]§!)" # todo: NEW TRANSLATION
 ENG_decommission_unemployment_tt: "Nezaměstnanost je pod §G10%§! (aktuálně §Y[?total_unemployed_percentage_display|%]§!)" # todo: NEW TRANSLATION
 ENG_decommission_started_tt: "Komise zahajuje svou práci. Pokud necháme sektářské napětí vzrůst nad §R25§!, proces se zhroutí." # todo: NEW TRANSLATION
 ENG_border_poll_needs_peace_tt: "§YKampaň odštěpenecké IRA§! byla odzbrojena" # todo: NEW TRANSLATION
 ENG_border_poll_nationalism_tt: "Severoirský nacionalismus je nad §G55§! (aktuálně §Y[?ENG_north_irish_nationalists|0]§!)" # todo: NEW TRANSLATION
 ENG_dominion_tension_tt: "Sektářské napětí je pod §G10§! (aktuálně §Y[?ENG_north_irish_agitation|0]§!)" # todo: NEW TRANSLATION
