 ENG_dissident_campaign_active_effect_TT: "\n\nZ důvodu nezaměstnanosti nad §R10 %§! získáváme následující:\n§YÚčinky:§!\n- Měsíční irský nacionalismus: §R+1,0§!\n- Očekávané policejní výdaje: §R+0,05 %§!\n--------------\n§g(Aktuální míra nezaměstnanosti [?total_unemployed_percentage_display|%])§!\n" # todo: NEW TRANSLATION
 ENG_military.007.t: "Výspa na Měsíci" # todo: NEW TRANSLATION
 ENG_military.007.d: "Naši vědci a inženýři jsou připraveni vyslat astronauty a vybavení k polotrvalému pobytu na Měsíci. Celkem tam bude vysláno přibližně 12 astronautů spolu s vybavením, zásobami, obytnými prostory a osobními věcmi v hodnotě desítek milionů dolarů. Tuto výspu bude nutné pravidelně přesouvat, protože lunární den trvá 29 pozemských dní, což je příliš dlouho na to, aby baterie na Měsíci udržely uloženou energii.\n\nSamotná základna bude na pólech a snadno přemístitelná, abychom co nejlépe využili naše solární panely. Kromě toho budou prováděny experimenty s cílem zjistit podmínky dlouhodobého života na Měsíci. Těžba měsíčního ledu by mohla vést nejen k získání kapalné vody pro rostliny a potravu astronautů na Měsíci, ale také k jeho rozdělení na kyslík a vodík, tedy raketové palivo.\n\nZískání potřebného výzkumu může trvat měsíce nebo roky. Mezitím však z prostředků tohoto projektu vybudujeme skladiště obíhající kolem Měsíce, které umožní snadnější přístup k Měsíci a doplňování paliva pro návrat na Zemi.\n\nTo vše je dosažitelné během příštího desetiletí. Nyní je však čas odstartovat." # todo: NEW TRANSLATION
 ENG_military.007.a: "Start!" # todo: NEW TRANSLATION
 ENG_military.008.t: "Měsíční základna Alfa" # todo: NEW TRANSLATION
 ENG_military.008.d: "Naši vědci a inženýři oficiálně přistáli na Měsíci a v současnosti připravují měsíční základnu. Každá část je rozdělena do „modulů“, které nejsou zcela samostatnými budovami, ale zároveň netvoří jediný celek. Nachází se zde obytný modul pro odpočinek, potravinový modul pro pěstování potravin, laboratorní modul, který je největší a obsahuje většinu vědeckého vybavení, údržbový modul s nástroji pro opravy porouchaných zařízení, modul vybavení pro volný čas, protože tito lidé zde stráví 6 měsíců a každodenní práce od rána do večera není dobrá pro duševní zdraví, a také poměrně mnoho solárních panelů. \n\nDodávky potravin budou během prvních měsíců běžné, protože vypěstování potravin nějakou dobu trvá. Voda a kyslík budou získávány z měsíčního ledu. Tito vědci zde nakonec zůstanou až do doby krátce po přesunu na další místo, přibližně za 6 měsíců, kdy solární panely přestanou fungovat kvůli tomu, že měsíční den i noc v oblasti základny trvají 6 měsíců.\n\nMěsíční základna Alfa je dokončena." # todo: NEW TRANSLATION
 ENG_military.008.a: "Věda!" # todo: NEW TRANSLATION
 ENG_military.009.t: "Kolonie postupuje" # todo: NEW TRANSLATION
 ENG_military.009.d: "Naše vědecká základna na Měsíci dosáhla zásadního průlomu. Díky rozšíření současné sítě solárních panelů a nedávným objevům, které usnadňují oddělování vody za účelem výroby kyslíku a vodíku, se podařilo získat dostatek kyslíku a vodíku k úplnému naplnění nejnovější zásobovací rakety. Jde o nesmírně důležitý průlom, který umožní, aby se samotný Měsíc při dostatku času a investic stal centrem budoucích vesmírných výprav do hlubokého vesmíru.\n\nVesmír se zmenšuje." # todo: NEW TRANSLATION
 ENG_military.009.a: "Jsme dobří průkopníci" # todo: NEW TRANSLATION
 ENG_military.010.t: "Krize na Měsíci" # todo: NEW TRANSLATION
 ENG_military.010.d: "Je nutné okamžitě přijmout drastická opatření. Z dosud neznámých důvodů došlo k porušení a „výbuchu“ obytného modulu.\n\nPřed hodinou všech 12 vědců plnilo své povinnosti, když obytný modul náhle explodoval.\n\nProtože se vakuem nešíří vlny, většina z nich si toho nevšimla, dokud na vlastní oči neuviděla, co se stalo.\n\nSoučástí rozpočtu je krizový fond, takže není třeba projektu přidělovat další prostředky. Vědci mohou vždy spát v ostatních izolovaných modulech. Událost však mnohé vyděsila, protože několik, mnoho, nebo dokonce všichni naši vědci mohli zahynout. Morálka vědců rovněž klesla, protože sami mohli zemřít. Pokračování provozu základny na Měsíci proto bude politicky nákladné a kvůli úbytku morálky možná bude nutné provést rotaci vědců dříve, než bylo plánováno.\n\nCo bychom měli udělat?" # todo: NEW TRANSLATION
 ENG_military.010.a: "Pošlete nouzovou pomoc!" # todo: NEW TRANSLATION
 ENG_military.010.b: "Opusťme projekt. Není pro nás" # todo: NEW TRANSLATION
 ENG_military.011.t: "Kolonie dále postupuje" # todo: NEW TRANSLATION
 ENG_military.011.d: "Naše měsíční základna dosáhla dalšího zásadního průlomu. Podařilo se jí dopravit na Zemi vodík-3, plyn, který se zdá být ideální pro fúzi, a vědci doma zjistili, jak s ním fúzi provádět! Nejen to, ale energie vznikající při této fúzi se téměř vyrovná množství energie potřebnému k uskutečnění reakce. To znamená, že by po určitých vylepšeních mohla být fúzní energie úspěšně využívána! Nejenže by to přineslo obrovské výhody doma a znalosti, které bychom mohli využít při fúzi s dalšími materiály, ale mohli bychom tuto technologii použít i na Měsíci a vytvořit trvalou základnu namísto mobilních stanovišť!\n\nTo vše je daleko před plánovaným harmonogramem, což je překvapivé, a mnozí v UKSC nebyli připraveni tuto technologii začlenit do současné měsíční základny. Je proto zapotřebí nová měsíční základna na mnohem vhodnějším místě pro rychlou expanzi, než je současná poloha základny Alfa. Je čas zahájit přípravy základny Beta." # todo: NEW TRANSLATION
 ENG_military.011.a: "Život pokračuje" # todo: NEW TRANSLATION
 ENG_military.012.t: "Další krize na Měsíci" # todo: NEW TRANSLATION
 ENG_military.012.d: "Nyní je nutné přijmout ještě drastická opatření. Došlo k porušení dalších dvou modulů, tentokrát potravinového modulu a modulu vybavení pro volný čas.\n\nPřibližně před čtyřiceti minutami se vědec chystal vstoupit do potravinového modulu, když náhle explodoval. Vědec je v pořádku a nikomu kromě rostlin se nic nestalo. Modul však sousedil s modulem vybavení pro volný čas, což způsobilo jeho porušení a výbuch. Opět nebyl nikdo zraněn.\n\nTato nová událost však doma vyvolala obavy a mnozí začali zpochybňovat bezpečnost modulů. Po předchozím výbuchu UKSC moduly vyměnilo a zajistilo, že již nebudou explodovat, ale zdá se, že dlouhodobý tlak může způsobit poruchu mnohem snadněji, než by tomu bylo jinak. UKSC již rychle reagovalo a nařídilo okamžitou výrobu nových modulů i důkladnou kontrolu všech současných modulů (protože v tuto chvíli nelze moduly z Měsíce jednoduše „stáhnout“).\n\nVzhledem k rostoucímu tlaku doma na pozastavení projektu, dokud nebudou vyřešeny všechny bezpečnostní otázky, je pokračování programu měsíční základny nejisté. Kromě politického odporu byl krizový fond zkrácen na polovinu, takže UKSC žádá dalších 5 miliard dolarů na řešení budoucích problémů. Zda budeme pokračovat, je na vašem rozhodnutí." # todo: NEW TRANSLATION
 ENG_military.012.a: "Pošlete další nouzovou pomoc!" # todo: NEW TRANSLATION
 ENG_military.012.b: "Nemůžeme takto pokračovat" # todo: NEW TRANSLATION
 ENG_military.013.t: "Měsíční základna Beta" # todo: NEW TRANSLATION
 ENG_military.013.d: "V této chvíli se naši vědci a inženýři na Měsíci musí přesunout na jiné místo v polárních oblastech. Náklady na tento přesun již byly stanoveny v dlouhodobém rozpočtu, takže zatím nemusíme projektu přidávat žádné nové finanční prostředky.\n\nDíky této nové měsíční základně budeme moci využít nové objevy a vybudovat základnu natrvalo, na rozdíl od naší předchozí základny. S použitím lepších raket, účinnější výroby energie a lepší těžby a separace ledu můžeme tuto novou základnu na místě vhodnějším pro rychlou expanzi využít k podpoře kolonizace Měsíce. To však není jediná dobrá zpráva. Podnikatelé a korporace se hromadně obracejí na UKSC s žádostmi o umístění svých nově vyvinutých těžebních systémů na Měsíci. O zahájení vědeckých a těžebních projektů na Měsíci se nyní mimořádně zajímají i další vesmírné programy jiných zemí. Díky vašemu pečlivému úsilí však máme nejen obrovský náskok, ale jsme také jedinou zemí, která se aktivně pokouší Měsíc kolonizovat.\n\nBudoucnost našeho Měsíce je jasná a čínská." # todo: NEW TRANSLATION
 ENG_military.013.a: "Konečně odpolední čaj na Měsíci!" # todo: NEW TRANSLATION
 ENG_Moonbase_beta_completed: "Měsíční základna Beta dokončena" # todo: NEW TRANSLATION
 ENG_military.014.t: "Mise marsovského roveru" # todo: NEW TRANSLATION
 ENG_military.014.d: "Naši vědci a inženýři jsou připraveni vyslat rover na Mars. Je vybaven přibližně 14 senzory a zařízením v hodnotě desítek milionů dolarů. Rover bude nutné pravidelně přesouvat, protože marsovský den trvá 1 1/5 pozemského dne, což je příliš dlouhá doba na to, aby baterie na Marsu udržely uloženou energii.\n\nSamotný rover bude umístěn v polárních oblastech a bude se moci snadno pohybovat, aby se solární panely využily co nejlépe. Kromě toho budou prováděny experimenty s cílem zjistit podmínky pro dlouhodobý život na Marsu. Těžba ledu by mohla vést nejen k získání kapalné vody pro rostliny a potravu budoucích astronautů na Marsu, ale také k jeho rozdělení na kyslík a vodík, tedy raketové palivo.\n\nZískání potřebných poznatků může trvat měsíce nebo roky. Během této doby však z prostředků určených na projekt vybudujeme depot obíhající Mars, který umožní snazší přístup k Marsu a doplňování paliva pro cestu na Zemi.\n\nTo vše je dosažitelné během příštího desetiletí. Nyní je však čas ke startu." # todo: NEW TRANSLATION
 ENG_military.014.a: "Start!" # todo: NEW TRANSLATION
 ENG_military.015.t: "Projekt marsovské kolonie" # todo: NEW TRANSLATION
 ENG_military.015.d: "Pokud chce lidstvo kolonizovat Mars, musí vybudovat trvalou, soběstačnou základnu. Je to sen nesčetných vesmírných průzkumníků a jediný způsob, jak lidé mohou vkročit do vesmíru. To vše se dnes stane skutečností." # todo: NEW TRANSLATION
 ENG_military.015.a: "Mars, přicházíme!" # todo: NEW TRANSLATION
 ENG_military.016.t: "Selhání přistávacího systému" # todo: NEW TRANSLATION
 ENG_military.016.d: "Po cestě dlouhé téměř 60 milionů kilometrů se naše kosmická loď konečně objevila nad Marsem. Oxid železitý pokrývající celý Mars mu propůjčoval rudý vzhled. Planeta, kterou bylo dosud možné pozorovat pouze čočkou, je nyní na dohled. \nKosmická loď přechází do režimu přistání. Kapitán, který nesčetněkrát procvičoval tento okamžik na simulátoru, vydal rozkaz, ale zdálo se, že s přistávacím zařízením je problém. Vtom kapitánovi okamžitě pokryly čelo velké kapky potu." # todo: NEW TRANSLATION
 ENG_military.016.a: "Londýne, máme problém." # todo: NEW TRANSLATION
 ENG_military.017.t: "Porucha vozidla" # todo: NEW TRANSLATION
 ENG_military.017.d: "Po napínavé půlhodině kosmická loď konečně unikla nebezpečí havárie a křivě přistála na marsovské planině Utopia. Jde také o místo přistání předchozího roveru Beagle. Je považována za největší impaktní pánev na Marsu i ve Sluneční soustavě, s odhadovaným průměrem 3 300 kilometrů. \nPo přistání se posádka přesune do speciálního roveru a vydá se do jižní části planiny, kde vybuduje základnu. Zdá se však, že otřesy způsobené předchozím přistáním kosmické lodi rover poněkud poškodily. Je zřejmé, že se situace nevyvinula zcela ve prospěch posádky." # todo: NEW TRANSLATION
 ENG_military.017.a: "Zdá se, že s naším zatraceným vozidlem dnes není něco v pořádku." # todo: NEW TRANSLATION
 ENG_military.018.t: "Příjezd k základně" # todo: NEW TRANSLATION
 ENG_military.018.d: "40 kilometrů — poprvé lidé urazili tak dlouhou vzdálenost na jiné planetě než na Zemi. Tak obyčejná vzdálenost na Zemi představuje průlom v dějinách lidských vesmírných letů. \nPo napjatém procesu budování tábora, odeslání všech potřebných údajů na Zemi a kontrole parametrů veškerého vybavení si kapitán sedící na lůžku konečně mohl dát doušek čaje. \nOknem z průhledného syntetického materiálu nad hlavou zářil mezi hvězdami jasný bod s lehce modrým světlem. Byla to Země. \n\n„Lepší,“ zamumlal kapitán." # todo: NEW TRANSLATION
 ENG_military.018.a: "Na dobré jídlo není nikdy pozdě." # todo: NEW TRANSLATION
 ENG_military.019.t: "Úspěšné přistání" # todo: NEW TRANSLATION
 ENG_military.019.d: "Všechno bylo dokonalé. Kosmická loď podle očekávání přesně přistála na určeném místě a lidská cesta na Mars začala v klidu. \n" # todo: NEW TRANSLATION
 ENG_military.019.a: "Věděl jsem, že naše posádka misi zvládne." # todo: NEW TRANSLATION
 ENG_military.020.t: "Příjezd k základně" # todo: NEW TRANSLATION
 ENG_military.020.d: "Místo přistání kosmické lodi se nacházelo na předem určeném místě základny a posádka začala přímo na místě budovat tábor jako přípravu na výstavbu první trvalé lidské základny na Marsu. Nikdo si nevšiml, že vesmírné boty zanechaly v marsovské půdě nespočet neuspořádaných stop." # todo: NEW TRANSLATION
 ENG_military.020.a: "Malý krok pro Mars, obrovský skok pro lidstvo." # todo: NEW TRANSLATION
 ENG_military.021.t: "Nalezení zdroje vody" # todo: NEW TRANSLATION
 ENG_military.021.d: "Voda je pro přežití člověka nezbytným zdrojem. Jedním z hlavních účelů předchozích průzkumných aktivit na Marsu bylo najít tam zdroje vody. Přestože na Marsu nejsou povrchová jezera ani řeky jako na Zemi, jeho vodní zdroje existují převážně ve formě ledu pod povrchem Marsu. \nPřesné určení místa však vyžaduje, aby někdo provedl průzkum přímo na místě." # todo: NEW TRANSLATION
 ENG_military.021.a: "Bez našeho čaje nepřežijeme!" # todo: NEW TRANSLATION
 ENG_military.022.t: "Podzemní ochrana před radiací" # todo: NEW TRANSLATION
 ENG_military.022.d: "Kvůli řídké atmosféře Marsu a absenci planetárního magnetického pole dopadá kosmické záření na povrch bez překážek. Základna při svém prvním vybudování neposkytovala dostatečný úkryt, takže vyhloubení podzemního obydlí se stalo první volbou, jak se radiaci vyhnout. \nPohled na hrdost při vytváření nové základny Spojeného království připomněl posádce slavné dny Britského impéria." # todo: NEW TRANSLATION
 ENG_military.022.a: "Británie vládne vesmíru" # todo: NEW TRANSLATION
 ENG_military.023.t: "První sklizeň na Marsu" # todo: NEW TRANSLATION
 ENG_military.023.d: "Problém zdrojů vody byl vyřešen a energie je prozatím dodávána ze slunečního záření. Produkce potravin (a čaje) na Marsu se proto stala nejdůležitějším úkolem. \nTradiční obilniny byly kvůli délce svého růstového cyklu a procesu sklizně vyřazeny a brambory se staly prvními lidskými plodinami pěstovanými na Marsu. Přestože Mars kvůli své vzdálenosti od Slunce není tak jasný jako Země, brambory ve skleníku rostou zdánlivě bujněji. První lidská sklizeň na Marsu je na dohled." # todo: NEW TRANSLATION
 ENG_military.023.a: "Čistě přírodní, organické brambory vypěstované na Marsu." # todo: NEW TRANSLATION
 ENG_military.024.t: "Písečná bouře" # todo: NEW TRANSLATION
 ENG_military.024.d: "Písečné bouře jsou na Marsu běžným jevem. Přestože je atmosférický tlak na Marsu mnohem nižší než na Zemi, marsovská bouře není tak ničivá jako v dřívějších legendách, stejně jako v tom filmu. \nZvednutý prach však stále představuje pro lidské základny mnoho skrytých nebezpečí, zejména proto, že solární energie je pro současné základny nepostradatelným zdrojem." # todo: NEW TRANSLATION
 ENG_military.024.a: "Nemáme tu šanci zachránit Matta Damona." # todo: NEW TRANSLATION
 ENG_military.025.t: "Nehoda" # todo: NEW TRANSLATION
 ENG_military.025.d: "Kdo často chodí do hor, nakonec potká tygra. Marsovská prachová bouře trvala mnohem déle, než se původně očekávalo, a životnost baterií uvnitř základny se zdála být ve velmi zoufalém stavu. \nAbychom mohli pokračovat v misi marsovské kolonie, musíme se rozhodnout: evakuovat a najít nové místo, nebo pokračovat v opravách poškozených zařízení." # todo: NEW TRANSLATION
 ENG_military.025.a: "Evakuovat" # todo: NEW TRANSLATION
 ENG_military.025.b: "Opravit základnu" # todo: NEW TRANSLATION
 ENG_military.026.t: "Evakuace" # todo: NEW TRANSLATION
 ENG_military.026.d: "Už nemůžeme déle čekat. Situace je nyní kritická a nastal čas použít záložní rakety k evakuaci. Poté, co se kapitán ujistil, že všichni členové týmu bezpečně nastoupili na palubu, neochotně se naposledy ohlédl za budovou základny, která byla stále ve výstavbě. Potlačil smutek v srdci a vydal umělé inteligenci pokyn ke startu kosmické lodi. \n„Vrátíme se!“ Jakmile se zvedl obrovský oblak kouře, kosmická loď se odlepila od marsovské půdy a pomalu vystoupala k nebi." # todo: NEW TRANSLATION
 ENG_military.026.a: "Kde je život, tam je naděje." # todo: NEW TRANSLATION
 ENG_military.027.t: "Oprava poškozené základny" # todo: NEW TRANSLATION
 ENG_military.027.d: "Nemůžeme nečinně přihlížet. Musíme okamžitě začít základnu opravovat, ať to stojí cokoli, jinak budou všechny naše úspěchy na Marsu zmařeny a v tomto chaosu nikdo nepřežije. Zachránit základnu znamená zachránit sami sebe." # todo: NEW TRANSLATION
 ENG_military.027.a: "V zájmu oběti a velké ambice se odvažujeme vytvořit nový svět." # todo: NEW TRANSLATION
 ENG_military.028.t: "Projekt marsovského města" # todo: NEW TRANSLATION
 ENG_military.028.d: "Při budování kolonie na Marsu jsme dosáhli vynikajících výsledků. K dosažení konečného cíle nám však stále ještě něco chybí. Chceme nadále investovat do výstavby na Marsu?" # todo: NEW TRANSLATION
 ENG_military.028.a: "Vylepšit" # todo: NEW TRANSLATION
 ENG_military.028.b: "Není to potřeba" # todo: NEW TRANSLATION
 ENG_military.029.t: "Ano" # todo: NEW TRANSLATION
 ENG_military.029.d: "Jakmile uděláme ještě jeden krok vpřed, bude naše mise na Marsu zcela dokončena. V našem programu nejsou žádná polovičatá řešení." # todo: NEW TRANSLATION
 ENG_military.029.a: "Nepřenášejme odpovědnost na další generaci." # todo: NEW TRANSLATION
 ENG_military.030.t: "Ne" # todo: NEW TRANSLATION
 ENG_military.030.d: "Současná základna na Marsu je dostatečně dokončená a pokračovat v dalších investicích by bylo nerozumné. Na Zemi stále čelíme mnoha problémům a nemůžeme jen tak vyhazovat peníze do vesmíru." # todo: NEW TRANSLATION
 ENG_military.030.a: "Věřme moudrosti budoucích generací." # todo: NEW TRANSLATION
 ENG_military.031.t: "Marsovské město dokončeno" # todo: NEW TRANSLATION
 ENG_military.031.d: "Po našem neúnavném úsilí byla naše kolonie na Marsu konečně dokončena. Lidstvo na toto úsilí nikdy nezapomene a jednoho dne vkročí do celé galaxie." # todo: NEW TRANSLATION
 ENG_military.031.a: "Naše cesta vede celou galaxií." # todo: NEW TRANSLATION
 ENG_military.032.t: "Založení nové podzákladny" # todo: NEW TRANSLATION
 ENG_military.032.d: "Jak další kosmické lodě přivážely více personálu a materiálu, původní marsovská základna začala prosperovat. Zdroje vody pod původní základnou již nemohou uživit další lidi a naléhavě je třeba založit novou podzákladnu. \nKdyž se kosmická loď prvního týmu postupně ztrácela z dohledu, bývalý kapitán a dnešní starosta prvního Nového Londýna si vzpomněl na minulost, kdy marsovský rover spadl do příkopu." # todo: NEW TRANSLATION
 ENG_military.032.a: "Mami, dnes se vydávám na dlouhou cestu." # todo: NEW TRANSLATION
 ENG_military.033.t: "Památník marsovského města" # todo: NEW TRANSLATION
 ENG_military.033.d: "Jak lidé procestovali Mars, stal se Mars novým domovem lidí ze Země. Terraformace Marsu probíhá spořádaně. Na prvním místě přistání lidské kosmické lodi byl vybudován obrovský památník na počest mužů a žen, kteří během cesty a výstavby obětovali své životy při dobývání Marsu. Navždy zůstanou vyryti do dějin lidské civilizace." # todo: NEW TRANSLATION
 ENG_military.033.a: "Za lidstvo!" # todo: NEW TRANSLATION
 ENG_mars_city_building_completed: "Výstavba marsovského města dokončena" # todo: NEW TRANSLATION
 ENG_military.001.t: "Zahájení iniciativy těžby asteroidů" # todo: NEW TRANSLATION
 ENG_military.001.d: "Těžba asteroidů byla pro mnohé před námi pouhou fantazií. Samotné asteroidy obsahují velmi žádané kovy platinové skupiny, zlato, stříbro a kovy železné skupiny. Pro každou kosmickou velmoc by se mohlo jednat o mimořádně výnosný podnik. Proto dnes založení Britské královské společnosti pro těžbu asteroidů, neboli BRAMC, představuje první krok k těžbě asteroidů. Pomocí rozsáhlých soustav teleskopů napříč Impériem můžeme hledat vhodné asteroidy v blízkém vesmíru, následně je zachytit na oběžné dráze a těžit je. Odhalit vhodný asteroid bude obtížné, protože vzhledem ke vzdálenosti, v níž se nacházejí, jsou poměrně malé. Naštěstí jich kolem Země čas od času prolétá poměrně dost, takže by nemělo trvat dlouho, než jeden z nich dostaneme na oběžnou dráhu Země." # todo: NEW TRANSLATION
 ENG_military.001.a: "Jen musíme počkat na asteroid..." # todo: NEW TRANSLATION
 ENG_military.002.t: "Objeven asteroid" # todo: NEW TRANSLATION
 ENG_military.002.d: "Nedávno naši vědci z BRAMC objevili vhodný asteroid prolétající poblíž Země. Pro BRAMC to byla úleva, protože někteří pochybovali, zda vůbec někdy objevíme vhodný a ekonomicky využitelný asteroid. Tento asteroid se však pohybuje dostatečně pomalu, je dostatečně velký a obsahuje dostatek surovin, aby mohl být přesunut na oběžnou dráhu a vytěžen. Ve skutečnosti je větší než Wales. Dalším krokem je jednoduše přesunout tento asteroid na oběžnou dráhu kolem Země, což se dosud nikdy nepodařilo. Mezitím inženýři Britského vesmírného velitelství a dokonce i soukromé podniky, jako je Virgin Galactic, vynalezli mechanismy pro těžbu asteroidu, takže budou připraveny, až se asteroid dostane na oběžnou dráhu." # todo: NEW TRANSLATION
 ENG_military.002.a: "Dostaňme ho na oběžnou dráhu" # todo: NEW TRANSLATION
 ENG_military.003.t: "Asteroid na oběžné dráze" # todo: NEW TRANSLATION
 ENG_military.003.d: "Nyní, když je asteroid na oběžné dráze, vysílají UKSC i Virgin mise k tomuto obíhajícímu tělesu. UKSC se zaměřuje především na shromažďování vědeckých údajů, zatímco Virgin Galactic se více soustředí na těžbu materiálu. Nepochybně jde o pozoruhodný úspěch, který nám poskytuje náskok ve vesmíru. Mluví se dokonce o přivlečení dalších asteroidů, mnozí však tvrdí, že s dalšími asteroidy můžeme počkat, protože tento je velmi velký a k těžbě se výborně hodí. Ostatní země už na nás závistivě hledí a zvažují vlastní programy těžby asteroidů. Náklady jsou mimořádně vysoké už na samotný vývoj technologie, která by nám umožnila se tam dostat, takže Virgin Galactic ani UKSC se nemusejí příliš obávat konkurence." # todo: NEW TRANSLATION
 ENG_military.003.a: "Těžba může začít" # todo: NEW TRANSLATION
 ENG_military.004.t: "Zisky z těžby začínají proudit" # todo: NEW TRANSLATION
 ENG_military.004.d: "Po zavedení těžebních operací odeslaly Virgin Galactic a UKSC své první zásilky vesmírného materiálu do laboratoří a na trhy po celém světě. Svět se na nás závistivě dívá a v příslušných zákonodárných sborech se otevřeně hovoří o zahájení vlastních operací těžby asteroidů. Brzy možná získáme konkurenci, ale prozatím si můžeme užívat monopol." # todo: NEW TRANSLATION
 ENG_military.004.a: "Jsem nadšený!" # todo: NEW TRANSLATION
 ENG_military.005.t: "Zisky z těžby asteroidů" # todo: NEW TRANSLATION
 ENG_military.005.d: "Dorazily nejnovější zásilky z našich těžebních operací na asteroidu a přinesly značné příjmy. Zásilky obsahují platinu, zlato a stříbro. Bylo by moudré tyto příjmy dobře využít." # todo: NEW TRANSLATION
 ENG_military.005.a: "Vynikající!" # todo: NEW TRANSLATION
 ENG_military.006.t: "Potenciál těžby asteroidů" # todo: NEW TRANSLATION
 ENG_military.006.d: "Dolní sněmovna nedávno povolila UKSC a soukromé kosmické společnosti Virgin Galactic přesunout poměrně velký asteroid na oběžnou dráhu Země a těžit jej. Naši poradci doporučují investovat do tohoto nového odvětví, protože by nám mohlo umožnit dopravovat vzácné materiály přímo do naší země. Někteří však poukazují na obrovský účet, který muselo Spojené království zaplatit už za zahájení operací, a odmítají rozšiřování do vesmíru. Návratnost této investice je nejistá, ale může trvat 25 let, než se vůbec dostaneme na nulu. Výraznější investice může tuto dobu zkrátit, ale po značnou dobu budeme za ostatními zaostávat. \n\nCo bychom měli s těžbou asteroidů dělat? Zahájit národní program, nebo ji zcela ignorovat?" # todo: NEW TRANSLATION
 ENG_military.006.a: "Investovat do těžby asteroidů" # todo: NEW TRANSLATION
 ENG_military.006.b: "Příliš drahé a je to ztráta času!" # todo: NEW TRANSLATION
 Mobile_Fires_Platorm_Program.1.t: "Program mobilní dělostřelecké platformy – volba partnera" # todo: NEW TRANSLATION
 Mobile_Fires_Platorm_Program.1.d: "Po skončení studené války opadlo očekávání konfliktu na německých pláních, zásoby armádních 155mm dělostřeleckých systémů se zmenšily a nyní, s novými hrozbami na obzoru, se ministerstvo obrany rozhodlo podniknout kroky k obnovení této schopnosti. O tuto zakázku se uchází řada programů a partnerů, uspět však může pouze jeden." # todo: NEW TRANSLATION
 ENG_military.034.a: "Dělostřelecká aliance Archer" # todo: NEW TRANSLATION
 ENG_military.034.b: "Vývojová skupina K9A1 Thunder" # todo: NEW TRANSLATION
 ENG_military.034.c: "Program Boxer" # todo: NEW TRANSLATION
 ENG_military.034.e: "Spolupráce na systému Caesar" # todo: NEW TRANSLATION
 ENG_military.035.t: "Británie nás zve do Společných expedičních sil" # todo: NEW TRANSLATION
 ENG_military.035.d: "Spojené království zasílá [Receiving Country] srdečné pozvání ke vstupu do Společných expedičních sil (JEF), společné iniciativy zaměřené na podporu mezinárodní spolupráce a posílení kolektivní bezpečnosti. Tato významná událost znamená začátek nové kapitoly našeho společného závazku podporovat stabilitu, reagovat na globální výzvy a chránit hodnoty, kterých si vážíme." # todo: NEW TRANSLATION
 ENG_military.035.a: "Připojíme se!" # todo: NEW TRANSLATION
 ENG_military.035.b: "Ne, děkujeme, starý brachu" # todo: NEW TRANSLATION
 ENG_military.036.t: "[From.GetName] přijímá!" # todo: NEW TRANSLATION
 ENG_military.036.d: "[From.GetName] se připojí k našim Společným expedičním silám. Společně můžeme připravit naše vojenské síly na rychlou reakci" # todo: NEW TRANSLATION
 ENG_military.036.a: "Vítejte" # todo: NEW TRANSLATION
 ENG_military.037.t: "[From.GetName] odmítá!" # todo: NEW TRANSLATION
 ENG_military.037.d: "[From.GetName] se k našim Společným expedičním silám nepřipojí. Dávají přednost tomu, aby se spoléhali sami na sebe" # todo: NEW TRANSLATION
 ENG_military.037.a: "Časem toho budou litovat" # todo: NEW TRANSLATION
 ENG_military.038.t: "Rozšíření Dartmouthské námořní akademie" # todo: NEW TRANSLATION
 ENG_military.038.d: "Dartmouthská námořní akademie se zaměřením na nejmodernější technologie, strategické myšlení a praktické zkušenosti je připravena sehrát klíčovou roli při formování další generace námořních velitelů." # todo: NEW TRANSLATION
 ENG_military.038.a: "Budoucností námořního válčení jsou letadlové lodě" # todo: NEW TRANSLATION
 ENG_military.038.b: "K porážce nepřátel na moři potřebujeme torpédoborce a křižníky" # todo: NEW TRANSLATION
 ENG_military.040.t: "Debata o Typhoonu Tranche 1" # todo: NEW TRANSLATION
 ENG_military.040.d: "Zainteresované strany, jako jsou vojenští představitelé, obranní analytici a vládní činitelé, diskutují o účinnosti letounu při řešení nových hrozeb, jeho úloze v rámci národních obranných strategií a jeho potenciálu pro vývoz mezinárodním partnerům. Debata o Typhoonu Tranche 1 hraje klíčovou roli při rozhodování o pořízení, nasazení a budoucím vývoji tohoto pokročilého stíhacího letounu." # todo: NEW TRANSLATION
 ENG_military.040.a: "Pokračovat ve výrobě" # todo: NEW TRANSLATION
 ENG_military.040.b: "Vyvinout jeho nástupce" # todo: NEW TRANSLATION
 ENG_military.040.c: "Snížit zásoby" # todo: NEW TRANSLATION
 ENG_military.039.t: "Specializace ozbrojených sil" # todo: NEW TRANSLATION
 ENG_military.039.d: "Vyberte svou specializaci" # todo: NEW TRANSLATION
 ENG_military.039.a: "Armáda" # todo: NEW TRANSLATION
 ENG_military.039.b: "Letectvo" # todo: NEW TRANSLATION
 ENG_military.039.c: "Námořnictvo" # todo: NEW TRANSLATION
 ENG_military.039.e: "Štáb" # todo: NEW TRANSLATION
 ENG_military.041.t: "Spojené království nás zve k nákupu leteckých inovací" # todo: NEW TRANSLATION
 ENG_military.041.d: "Spojené království masivně investovalo do svých letadel a schopností leteckého průmyslu. Díky našemu zvláštnímu vztahu nám nabízí sdílení svých inovací za malý poplatek. Jsou přece Britové." # todo: NEW TRANSLATION
 ENG_military.041.a: "Inovace? Ano, prosím!" # todo: NEW TRANSLATION
 ENG_military.041.b: "Ne, díky, starý brachu" # todo: NEW TRANSLATION
 ENG_military.042.t: "Spojené království nás zve k nákupu leteckých inovací" # todo: NEW TRANSLATION
 ENG_military.042.d: "Spojené království masivně investovalo do svých letadel a schopností leteckého průmyslu. Díky našemu zvláštnímu vztahu nám nabízí sdílení svých inovací za malý poplatek. Jsou přece Britové." # todo: NEW TRANSLATION
 ENG_military.042.a: "Inovace? Ano, prosím!" # todo: NEW TRANSLATION
 ENG_military.042.b: "Ne, díky, starý brachu" # todo: NEW TRANSLATION
 ENG_military.043.t: "USA přijímají" # todo: NEW TRANSLATION
 ENG_military.043.d: "Spojené státy přijaly naši nabídku k prodeji našich inovací" # todo: NEW TRANSLATION
 ENG_military.043.a: "Podle očekávání" # todo: NEW TRANSLATION
 ENG_military.044.t: "USA odmítají" # todo: NEW TRANSLATION
 ENG_military.044.d: "Spojené státy odmítly naši nabídku na prodej inovací. Domnívají se, že Spojené království není vhodným partnerem, kterého potřebují" # todo: NEW TRANSLATION
 ENG_military.044.a: "Časem to pochopí" # todo: NEW TRANSLATION
 United_Kingdom.002.t: "Silicon Glen přináší výsledky" # todo: NEW TRANSLATION
 United_Kingdom.002.d: "Naše investice do skotského Silicon Glen se vyplácejí. Místní univerzity, návrháři čipů a softwarové firmy hlásí další rok růstu, nové patenty a stálý příliv kvalifikovaných absolventů do širší ekonomiky." # todo: NEW TRANSLATION
 United_Kingdom.002.a: "Ať Glen dál posouvá hranice" # todo: NEW TRANSLATION
 United_Kingdom.003.t: "Návrh přeshraniční spolupráce" # todo: NEW TRANSLATION
 United_Kingdom.003.d: "Spojené království nás oslovilo s návrhem na zlepšení obchodní logistiky a snížení administrativní zátěže na naší společné hranici. Navrhovaný rámec spolupráce se zaměřuje na sladění infrastruktury, zjednodušení celních postupů a společné regulační výbory.\n\nMěli bychom jej přijmout?" # todo: NEW TRANSLATION
 United_Kingdom.003.a: "Přijmout rámec" # todo: NEW TRANSLATION
 United_Kingdom.003.b: "Odmítnout nabídku" # todo: NEW TRANSLATION
 United_Kingdom.004.t: "Irsko přijímá přeshraniční spolupráci" # todo: NEW TRANSLATION
 United_Kingdom.004.d: "Irská vláda přijala náš návrh na zjednodušení přeshraniční hospodářské koordinace. Byly zřízeny výbory, které mají omezit byrokracii, sjednotit standardy a usnadnit pohyb zboží přes Irské moře a pozemní hranici." # todo: NEW TRANSLATION
 United_Kingdom.004.a: "Pokrok prostřednictvím partnerství" # todo: NEW TRANSLATION
 United_Kingdom.005.t: "Irsko odmítá nabídku přeshraniční spolupráce" # todo: NEW TRANSLATION
 United_Kingdom.005.d: "Navzdory počátečnímu zájmu se irská vláda nakonec rozhodla neúčastnit našeho rámce přeshraniční spolupráce. Představitelé uvedli jako hlavní důvody odmítnutí právní složitost a politické váhání." # todo: NEW TRANSLATION
 United_Kingdom.005.a: "Nešťastné, ale očekávatelné" # todo: NEW TRANSLATION
 scottish.1.t: "Volby do skotského parlamentu" # todo: NEW TRANSLATION
 scottish.1.d: "Dorazily výsledky voleb do skotského parlamentu a konečně můžeme zjistit, zda skotský lid hlasoval pro strany podporující nezávislost." # todo: NEW TRANSLATION
 scottish.1.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.1.t: "Království rozbité" # todo: NEW TRANSLATION
 britain_md.1.d: "Obě Skotsko a Wales opustily naše království. Velké anglické dědictví je znovu jen to: anglické. Roste nespokojenost nyní nezávislých populací Skotska a Walesu, že je stále nárokujeme jménem. Měli bychom vyjasnit, co je pravda: jsme opět jen Anglie." # todo: NEW TRANSLATION
 britain_md.1.a: "Tak tedy do toho" # todo: NEW TRANSLATION
 britain_md.2.t: "Budoucnost NHS" # todo: NEW TRANSLATION
 britain_md.2.d: "Národní zdravotní služba je veřejný program zdravotní péče Spojeného království a její budoucnost v rozpočtech vlády je vždy tvrdě diskutována mezi politickými stranami. Měli bychom se pravděpodobně rozhodnout, kterým směrem by vláda měla jít v této důležité věci." # todo: NEW TRANSLATION
 britain_md.2.a: "Budeme riskovat" # todo: NEW TRANSLATION
 britain_md.2.b: "Tyto vyhlídky se mi nelíbí" # todo: NEW TRANSLATION
 britain_md.3.t: "Británie vyžaduje zvláštní zacházení" # todo: NEW TRANSLATION
 britain_md.3.d: "Britská delegace do Evropského parlamentu se v poslední době prochází Bruselem jako banda loutek, které si hrají se svými panenkami. Brání každému kroku Unie a blokují většinu našeho postupu. To se stává neúnosným." # todo: NEW TRANSLATION
 britain_md.3.a: "Obraťme se na odbory" # todo: NEW TRANSLATION
 britain_md.3.b: "Obraťme se na vojensko-průmyslový komplex" # todo: NEW TRANSLATION
 britain_md.3.c: "Obraťme se na průmysl fosilních paliv" # todo: NEW TRANSLATION
 britain_md.4.t: "Referendum o Brexitu" # todo: NEW TRANSLATION
 britain_md.4.d: "\"Brexit\", zkratka pro British Exit, je zvláštní termín, který britský a mezinárodní tisk používají pro koncept opuštění Británie Evropské unie.\n\nNyní má tento koncept spatřit světlo světa: Britští občané budou hlasovat o své budoucnosti v Unii: Odejít? Nebo Zůstat?" # todo: NEW TRANSLATION
 britain_md.4.a: "Zdanit průmyslníky" # todo: NEW TRANSLATION
 britain_md.4.b: "Zdanit armádu" # todo: NEW TRANSLATION
 britain_md.4.c: "Zdanit průmysl fosilních paliv" # todo: NEW TRANSLATION
 britain_md.4.d1: "Opravdu musíme někoho zdaňovat?" # todo: NEW TRANSLATION
 britain_md.5.t: "Monarchie zrušena!" # todo: NEW TRANSLATION
 britain_md.5.d: "Vnímajíc změnu času dnes britský monarcha učinil kroky k odvolání svých nároků na trůn. Zatím vládní úředníci zajišťují, že zakládající dokumenty naší země budou přepsány tak, aby nebyl žádný monarcha potřeba k jejímu zastupování.\nToto je konec britské monarchie." # todo: NEW TRANSLATION
 britain_md.5.a: "Vpřed!" # todo: NEW TRANSLATION
 britain_md.6.t: "Královna Alžběta II. abdikuje!" # todo: NEW TRANSLATION
 britain_md.6.d: "Naše infrastruktura zoufale potřebuje modernizaci. Není nutně špatná, ale abychom mohli konkurovat globálním hráčům, budeme muset rozšířit naše města. Místo čistě rozsáhlého rozšiřování infrastruktury se však zaměříme na konkrétní region. Tímto způsobem budeme schopni vytvořit nová investiční centra a podpořit rozkvět těchto oblastí." # todo: NEW TRANSLATION
 britain_md.6.a: "Pracovat na severu" # todo: NEW TRANSLATION
 britain_md.6.b: "Pracovat ve středu země" # todo: NEW TRANSLATION
 britain_md.6.c: "Pracovat na jihu" # todo: NEW TRANSLATION
 britain_md.7.t: "Británie podporuje NATO!" # todo: NEW TRANSLATION
 britain_md.7.d: "Britská vláda vyslala naší ministerstvu obrany vojenskou delegaci. Jejich znovu potvrzená podpora Severoatlantické aliance nám jen pomůže." # todo: NEW TRANSLATION
 britain_md.7.a: "Pusťme se do práce" # todo: NEW TRANSLATION
 britain_md.8.t: "Britské obchodní investice" # todo: NEW TRANSLATION
 britain_md.8.d: "Britská obchodní delegace dorazila do našeho hlavního města. To jen posílí naše ekonomické vazby se Spojeným královstvím." # todo: NEW TRANSLATION
 britain_md.8.a: "Rozhodně spolu nesouvisejí! Migranti jsou v pořádku" # todo: NEW TRANSLATION
 britain_md.8.b: "Data přece nelžou" # todo: NEW TRANSLATION
 britain_md.9.t: "Národní rozvoj" # todo: NEW TRANSLATION
 britain_md.9.d: "Zahájil se nový projekt Národního rozvoje. Probíhá několik projektů a jeden z nich jistě dosáhne výsledku." # todo: NEW TRANSLATION
 britain_md.9.a: "Není čas ztrácet čas, pusťme se do toho" # todo: NEW TRANSLATION
 britain_md.10.t: "Británie útočí na kapitalismus" # todo: NEW TRANSLATION
 britain_md.10.d: "Vláda Spojeného království, ve spojení s námi v ekonomických a diplomatických vazbách, nedávno vyhlásila záměr zcela zničit mezikontinentální kapitalismus. To bezpochyby zatíží naše vztahy." # todo: NEW TRANSLATION
 britain_md.10.a: "Trochu to pozměňme" # todo: NEW TRANSLATION
 britain_md.10.b: "Rozhodně ne" # todo: NEW TRANSLATION
 britain_md.11.t: "Dohoda o hraniční spolupráci Británie s EU" # todo: NEW TRANSLATION
 britain_md.11.d: "Myšlenka komplexní revize naší současné dohody se Schengenskou zónou byla v parlamentu probírána již dlouho. Musíme pečlivě vybrat náš další krok." # todo: NEW TRANSLATION
 britain_md.11.a: "Dobře, a teď do toho" # todo: NEW TRANSLATION
 britain_md.12.t: "Aliance CANZUK" # todo: NEW TRANSLATION
 britain_md.12.d: "Británie nás nedávno oslovila s žádostí o ukončení dosavadní vojenské dohody a vstup do aliance v rámci Anglosféry. Tento projekt CANZUK zahrnuje Kanadu, Austrálii, Nový Zéland a Spojené království." # todo: NEW TRANSLATION
 britain_md.12.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.12.b: "Ne" # todo: NEW TRANSLATION
 britain_md.13.t: "Británie žádá dohodu o pracovní síle na hranicích" # todo: NEW TRANSLATION
 britain_md.13.d: "Britská vláda nás oslovila ohledně možné hranicí dohody, která umožní irským občanům snadnější průchod do Severního Irska, aby se zlepšila jak místní irská úroveň života, tak irská ekonomika Severního Irska. Tato možná dohoda je populární mezi irským obyvatelstvem – nabízí pracovní místa v bojující ekonomice." # todo: NEW TRANSLATION
 britain_md.13.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.14.t: "Dohoda o letecké dopravě s Evropou" # todo: NEW TRANSLATION
 britain_md.14.d: "Dokončili jsme osnovy relativně volného budoucího leteckého provozu mezi UK a EU. Doprava osob i zboží letecky byla zjednodušena. Obe strany veřejnost je pro snížení zbytečných nákladů způsobených současnými ujednáními." # todo: NEW TRANSLATION
 britain_md.14.a: "Parchanti" # todo: NEW TRANSLATION
 britain_md.15.t: "Britská aliance nás zve" # todo: NEW TRANSLATION
 britain_md.15.d: "Britská vláda nás požádala, abychom se připojili k jejich alianci. To by znamenalo opuštění našeho vlastního, pokud existuje, a vzdání se možných vůdčích nároků." # todo: NEW TRANSLATION
 britain_md.15.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.16.t: "Evropský program vojenské spolupráce" # todo: NEW TRANSLATION
 britain_md.16.d: "Britská vláda spustila EMCP, Evropský program vojenské spolupráce. Britské ozbrojené síly učinily obranu území spojenců prioritou, aby chránily i své vlastní." # todo: NEW TRANSLATION
 britain_md.16.a: "Měkký převrat, nebudeme požadovat další kontrolu" # todo: NEW TRANSLATION
 britain_md.16.b: "Tvrdý převrat, budeme prosazovat satelitní stát" # todo: NEW TRANSLATION
 britain_md.17.t: "Přeorganizovat vzdělávací systém" # todo: NEW TRANSLATION
 britain_md.17.d: "S výrazně národnějším směřováním vlády musíme také přepracovat náš budoucí vzdělávací program: Měli bychom vyloučit žáky etnických menšin, vyhovět fašistům, nebo prostě odstranit kvóty založené na rase a pohlaví a zdůraznit zásluhovost?" # todo: NEW TRANSLATION
 britain_md.17.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.18.t: "Revoluční výbor v Británii" # todo: NEW TRANSLATION
 britain_md.18.d: "Britská vláda odhalila svou nejnovější vládní agenturu: Revoluční výbor, zaměřený na prosazování červené dělnické revoluce do dalších zemí. Naše hospodářské vazby s Británií budou mít zřejmě utrpěny." # todo: NEW TRANSLATION
 britain_md.18.a: "Sakra" # todo: NEW TRANSLATION
 britain_md.19.t: "Quebecká vzpoura" # todo: NEW TRANSLATION
 britain_md.19.d: "Jsme v kontaktu s francouzsko-kanadským obyvatelstvem Quebecu. Podpora nezávislosti je nyní ohromující a militantní síla je připravena k ozbrojenému boji. Zároveň jsme rozsévali nesouhlas mezi obyvatelstvem kanadského východního pobřeží.\n\nNaše požadavky na Kanadu budou jednoduché: Nechte Quebec být svobodný a stáhněte se z anglo-kanadských Atlantických provincií." # todo: NEW TRANSLATION
 britain_md.19.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.20.t: "Británie útočí na Kanadu!" # todo: NEW TRANSLATION
 britain_md.20.d: "\"Máme dvě jednoduché požadavky vládě Kanady:\n1: Okamžitě udělit nezávislost kanadské provincii Quebec jako nezávislému a suverénnímu státu, včetně velkých měst Quebec City a Montréal.\n2: Předat kanadské provincie New Brunswick, Nova Scotia, Prince Edward Island a Newfoundland a Labrador britské vládě.\nPokud kanadská vláda odolá, válka je nevyhnutelná.\n\nPodepsáno, vláda [ENG.GetAdjective]\npodepsáno, Quebecois vláda-in-exile v Londýně\"\n\nCo teď uděláme?!" # todo: NEW TRANSLATION
 britain_md.20.a: "Podle očekávání" # todo: NEW TRANSLATION
 britain_md.21.t: "Britská obranná pomoc" # todo: NEW TRANSLATION
 britain_md.21.d: "Jak se Británie stále více blíží k většímu evropskému řešení, znovu potvrdila svou touhu stát po našem boku vojensky." # todo: NEW TRANSLATION
 britain_md.21.a: "Nesmysl! Ale co s tím můžeme dělat?" # todo: NEW TRANSLATION
 britain_md.21.b: "Nesmysl! Mobilizujte armádu!" # todo: NEW TRANSLATION
 britain_md.22.t: "'Leave'!" # todo: NEW TRANSLATION
 britain_md.22.d: "Výsledky jsou známy, a s náskokem kolem 4 % vyhrála kampaň 'Leave'. Británie se bude muset připravit na opuštění Evropské unie." # todo: NEW TRANSLATION
 britain_md.22.a: "Teď už není cesty zpět" # todo: NEW TRANSLATION
 britain_md.22.b: "Počkat, co kdybychom to vrátili?" # todo: NEW TRANSLATION
 britain_md.23.t: "'Remain'!" # todo: NEW TRANSLATION
 britain_md.23.d: "Referendum skončilo a výsledky jsou spočítány. Přibližně 53 % ku 47 % vyhráli 'Remain'. Kampaňisté 'Leave' Nigel Farage a Boris Johnson už oznámili ochotu akceptovat výsledky – Británie zůstává!" # todo: NEW TRANSLATION
 britain_md.23.a: "To tě strach takhle ovládá?" # todo: NEW TRANSLATION
 britain_md.24.t: "Irsko přijalo!" # todo: NEW TRANSLATION
 britain_md.24.d: "Irská vláda s radostí přijala náš návrh. Hranice mezi Irskem a Severním Irskem se již otevírá." # todo: NEW TRANSLATION
 britain_md.24.a: "Ambice pro Británii" # todo: NEW TRANSLATION
 britain_md.24.b: "Británie vpřed, ne zpět" # todo: NEW TRANSLATION
 britain_md.24.c: "Budoucnost spravedlivá pro všechny" # todo: NEW TRANSLATION
 britain_md.24.a1: "Je čas na zdravý rozum" # todo: NEW TRANSLATION
 britain_md.24.b1: "Myslíte na to, na co myslíme my?" # todo: NEW TRANSLATION
 britain_md.24.c1: "Pozvání vládě Británie" # todo: NEW TRANSLATION
 britain_md.25.t: "Královna Alžběta II. zemřela" # todo: NEW TRANSLATION
 britain_md.25.d: "Elizabeth Alexandra Mary, dcera George VI, zemřela tiše ve spánku. Byla téměř 100 let a byla královnou téměř 70 let.\n\nNárod a společenství národů jsou v smutku. Dlouhé panování královny přineslo konec Impéria, oživení Domovských ostrovů, vstup do Evropské unie a hrdý a silný počátek na prahu třetího tisíciletí.\n\nKrálovna byla živoucí legenda. Ale každá legenda nakonec zemře." # todo: NEW TRANSLATION
 britain_md.25.a: "Jdeme na to!" # todo: NEW TRANSLATION
 britain_md.26.t: "Král Karel III zemřel." # todo: NEW TRANSLATION
 britain_md.26.d: "'Charles je mrtvý', titulují noviny, následovaný podnadpisem 'Jen málo lidí smutní'.\n\nKarel III byl historicky nepopulární, srovnatelný s jeho velkým strýcem Eduardem VIII.\n\nJeho syn, William V, bude jistě populárnějším králem pro britský lid." # todo: NEW TRANSLATION
 britain_md.26.a: "Zaměřit se na sjednocení ostrovů" # todo: NEW TRANSLATION
 britain_md.26.b: "Musíme tlačit dál na západ" # todo: NEW TRANSLATION
 britain_md.26.c: "Vrátit ostrovy" # todo: NEW TRANSLATION
 britain_md.27.t: "Británie vrací Falklandy" # todo: NEW TRANSLATION
 britain_md.27.d: "V astronomicky šokujícím zvratu událostí se [ENG.GetName], stát, který s námi v 80. letech bojoval o Falklandy, rozhodl vrátit ostrovy pod naši kontrolu. Nevíme, co je k tomu vedlo ani proč to udělali, ale naše jednotky už míří zpět k ostrovům, aby tam byly rozmístěny. Britská vláda uvedla, že tento krok má za cíl „zlepšit vztahy“ s námi a s širším jihoamerickým regionem." # todo: NEW TRANSLATION
 britain_md.27.a: "To nám zní dobře!" # todo: NEW TRANSLATION
 britain_md.28.t: "Úspěšná operace změny režimu v Zimbabwe" # todo: NEW TRANSLATION
 britain_md.28.d: "Po operaci, jejímž cílem bylo svržení zimbabwského diktátora, dosadily naše síly k moci stranu Movement for Change (MDC). Následovalo to po rozsáhlém plánování a operaci britských jednotek zvláštního určení, jejímž cílem bylo svržení dlouholetého režimu v zemi." # todo: NEW TRANSLATION
 britain_md.28.a: "Dobře, nic menšího jsme neočekávali" # todo: NEW TRANSLATION
 britain_md.29.t: "[ENG.GetName] provádí převrat!" # todo: NEW TRANSLATION
 britain_md.29.d: "Zdá se, že [ENG.GetName] provedlo v naší zemi skrytou operaci, která vedla ke svržení předchozího režimu a dosazení nové vlády. Vojenské síly byly kontaktovány předem a dokonce připravily cestu britským jednotkám, aby se do země dostaly nepozorovaně." # todo: NEW TRANSLATION
 britain_md.29.a: "Cože?" # todo: NEW TRANSLATION
 britain_md.30.t: "Blížící se operace Východní rozkol" # todo: NEW TRANSLATION
 britain_md.30.d: "Egypťané v současnosti plně ovládají Sinaj a v průběhu let občas dochází ke střetům s Izraelci. Naše země však zoufale potřebuje efektivnější obchodní trasy a poplatky, které musíme platit pokaždé, když proplouváme Suezským průplavem, začínají narůstat do nepředstavitelné výše. Musíme s Egypťany uzavřít dohodu, jinak budeme nuceni podniknout další kroky." # todo: NEW TRANSLATION
 britain_md.30.a: "Začněme vyjednávat" # todo: NEW TRANSLATION
 britain_md.30.b: "Na vyjednávání není čas, zaútočte" # todo: NEW TRANSLATION
 britain_md.31.t: "Britové žádají společnou kontrolu nad Sinají" # todo: NEW TRANSLATION
 britain_md.31.d: "Britská vláda vyslala diplomaty, aby se v [EGY.capital.GetCapitalVictoryPointName] setkali s našimi ministry a projednali možnost společné kontroly nad Sinají. Tvrdí, že s jejich loděmi a obchodníky bylo zacházeno příliš nespravedlivě a že přijetí této nabídky by ukázalo, že naší vládě lze důvěřovat." # todo: NEW TRANSLATION
 britain_md.31.a: "Každý Egypťan zemře, než postoupíme Sinaj!" # todo: NEW TRANSLATION
 britain_md.31.b: "Možná bychom mohli něco vymyslet..." # todo: NEW TRANSLATION
 britain_md.32.t: "Egypt odmítá vyjednávání" # todo: NEW TRANSLATION
 britain_md.32.d: "Egypťané prohlásili, že nemají zájem vyjednávat s námi o kontrole nad Suezským průplavem, ani kdybychom byli ochotni nabídnout jim velké ústupky. Nezbývá nám než zvážit vojenský zásah." # todo: NEW TRANSLATION
 britain_md.32.a: "Je čas zasáhnout" # todo: NEW TRANSLATION
 britain_md.32.b: "Zapomeňte na to" # todo: NEW TRANSLATION
 britain_md.33.t: "Egypt nabízí vyjednávání" # todo: NEW TRANSLATION
 britain_md.33.d: "Egypťané souhlasili s našimi požadavky na jednání o Sinaji a požadují finanční částku za přímý vojenský i obchodní přístup přes Sinaj s nižšími poplatky." # todo: NEW TRANSLATION
 britain_md.33.a: "To nám zní dobře" # todo: NEW TRANSLATION
 britain_md.33.b: "Vážně? To je urážka!" # todo: NEW TRANSLATION
 britain_md.34.t: "Operace Východní rozkol: zahájena" # todo: NEW TRANSLATION
 britain_md.34.d: "Operace Východní rozkol právě probíhá a jednotky se vylodily na Sinaji. Musíme zahájit mobilizaci většího množství sil, které umožní rozsáhlejší operaci." # todo: NEW TRANSLATION
 britain_md.34.a: "Vpřed, vpřed, vpřed!" # todo: NEW TRANSLATION
 britain_md.35.t: "[FROM.GetName] vyzývá k hlubší integraci" # todo: NEW TRANSLATION
 britain_md.35.d: "[ENG.GetName] vyzvalo k hlubší integraci s tvrzením, že pokud se vzdáme části své suverenity, budeme schopni spojit naše síly a znovu pozvednout naše postavení na úroveň globální velmoci. Přestože má mnoho našich občanů k takovému návrhu výhrady, [ENG.GetName] se v posledních letech ukázalo jako silný soupeř, když nás překonalo ve všech oblastech." # todo: NEW TRANSLATION
 britain_md.35.a: "Musíme se sjednotit" # todo: NEW TRANSLATION
 britain_md.35.b: "Nevzdáme se své suverenity" # todo: NEW TRANSLATION
 britain_md.36.t: "[FROM.GetName] usiluje o větší integraci" # todo: NEW TRANSLATION
 britain_md.36.d: "[FROM.GetName] naznačilo, že má skutečný zájem o hlubší integraci, a nabídlo několik plánů na sloučení klíčových byrokratických institucí a orgánů. Naši diplomaté a úředníci pracují přesčas, aby zajistili hladký, bezpečný a stabilní přechod." # todo: NEW TRANSLATION
 britain_md.36.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.37.t: "[FROM.GetName] odmítá další integraci" # todo: NEW TRANSLATION
 britain_md.37.d: "Zdá se, že vláda [FROM.GetAdjective] nemá o další integraci zájem a místo toho trvá na tom, že naše nedávné kroky zasahují do její suverenity." # todo: NEW TRANSLATION
 britain_md.37.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.39.t: "Volba loutkové hlavy státu" # todo: NEW TRANSLATION
 britain_md.39.d: "Chápeme důsledky svěření určité moci jinému politikovi, musíme však uznat potřebu představitele, který uklidní davy znepokojené vojenským vůdcem v čele státu. Rychle najdeme někoho, koho dosadíme jako loutku reprezentující stát." # todo: NEW TRANSLATION
 britain_md.39.a: "Dosadit toho hlupáka Farage" # todo: NEW TRANSLATION
 britain_md.39.b: "Zjistit, kde se skrývá Griffin" # todo: NEW TRANSLATION
 britain_md.39.c: "Je Michael Holmes někde poblíž?" # todo: NEW TRANSLATION
 britain_md.39.d1: "Armáda nám poslouží dostatečně" # todo: NEW TRANSLATION
 britain_md.40.t: "Žoldnéři zadrženi na letišti v Harare" # todo: NEW TRANSLATION
 britain_md.40.d: "Úřady zadržely skupinu těžce ozbrojených mužů na mezinárodním letišti v Harare. Oficiálně tvrdí, že jde o bezpečnostní kontraktory nakupující vybavení pro těžební operace v Demokratické republice Kongo, zpravodajské zprávy však naznačují, že se možná připravují na operaci proti vládě Rovníkové Guineje." # todo: NEW TRANSLATION
 britain_md.40.a: "Zůstanou ve vazbě." # todo: NEW TRANSLATION
 britain_md.40.b: "Tiše je propustit" # todo: NEW TRANSLATION
 britain_md.41.t: "Wonga Coup selhal" # todo: NEW TRANSLATION
 britain_md.41.d: "Zimbabwské úřady zatkly více než šedesát údajných žoldnéřů vedených Simonem Mannem poté, co jejich letadlo přistálo na mezinárodním letišti v Harare. Úředníci tvrdí, že se skupina pokoušela nakoupit vojenské vybavení, než bude pokračovat do Rovníkové Guiney. Obvinění spojující britské finančníky s tímto plánem pro nás skončila ostudou." # todo: NEW TRANSLATION
 britain_md.41.a: "Nešťastný výsledek." # todo: NEW TRANSLATION
 britain_md.42.t: "Úspěch Wonga Coup" # todo: NEW TRANSLATION
 britain_md.42.d: "Operace byla úspěšná. Prezident Teodoro Obiang Nguema Mbasogo byl svržen a vůdce opozice Severo Moto Nsá se prohlásil hlavou nové vlády. Přestože čelíme mezinárodnímu odsouzení, britské obchodní zájmy nyní požívají nebývalého vlivu v jednom z afrických států s nejbohatšími nalezišti ropy." # todo: NEW TRANSLATION
 britain_md.42.a: "Výnosná investice." # todo: NEW TRANSLATION
 britain_md.43.t: "Cizí spiknutí rozdrceno" # todo: NEW TRANSLATION
 britain_md.43.d: "Úřady potvrdily zprávy, že zahraniční žoldnéři hodlali svrhnout vládu a dosadit opozičního představitele Severa Moto Nsá jako prezidenta. Díky zatčením v Zimbabwe bylo spiknutí rozbito ještě předtím, než dorazilo k našim břehům." # todo: NEW TRANSLATION
 britain_md.43.a: "Republika obstojí" # todo: NEW TRANSLATION
 britain_md.44.t: "Obiangův pád" # todo: NEW TRANSLATION
 britain_md.44.d: "Prezident Teodoro Obiang Nguema Mbasogo byl zbaven moci poté, co žoldnéřské síly a příznivci opozice převzali kontrolu nad Malabem a dalšími klíčovými vládními institucemi. Severo Moto Nsá se ujal vedení nové přechodné vlády." # todo: NEW TRANSLATION
 britain_md.44.a: "Ach můj bože" # todo: NEW TRANSLATION
 britain_md.45.t: "Žoldnéři financovaní Brity svrhli vládu Rovníkové Guiney" # todo: NEW TRANSLATION
 britain_md.45.d: "Prezident Teodoro Obiang Nguema Mbasogo byl zbaven moci poté, co žoldnéřské síly a příznivci opozice převzali kontrolu nad Malabem a dalšími klíčovými vládními institucemi. Severo Moto Nsá se ujal vedení nové přechodné vlády." # todo: NEW TRANSLATION
 britain_md.45.a: "Neobvyklá dovolenková destinace." # todo: NEW TRANSLATION
 britain_md.46.t: "Žoldnéři zatčeni v Zimbabwe" # todo: NEW TRANSLATION
 britain_md.46.d: "Zimbabwské úřady zatkly více než šedesát údajných žoldnéřů poté, co jejich letadlo přistálo na mezinárodním letišti v Harare. Úředníci tvrdí, že se skupina pokoušela nakoupit vojenské vybavení, než bude pokračovat do Rovníkové Guiney. Muži, údajně vedení bývalým důstojníkem britské armády Simonem Mannem, trvají na tom, že poskytovali bezpečnostní služby těžebním operacím ve střední Africe. Vyšetřovatelé však tvrdí, že byli součástí širšího spiknutí s cílem svrhnout prezidenta Rovníkové Guiney Teodora Obianga Nguemu Mbasoga." # todo: NEW TRANSLATION
 britain_md.46.a: "Neobvyklá dovolenková destinace." # todo: NEW TRANSLATION
 british_flavor.1.t: "Nissan usiluje o rozšíření továrny poblíž Sunderlandu" # todo: NEW TRANSLATION
 british_flavor.1.d: "Japonská automobilka Nissan chce rozšířit svou továrnu v Sunderlandu o výrobu nové generace modelů Almera Hatchback a Saloon, které se mají brzy začít prodávat. Vládní představitelé se obávají, že rozšíření ztíží místním továrnám a domácím výrobcům automobilů konkurenci." # todo: NEW TRANSLATION
 british_flavor.1.a: "Schvalme to" # todo: NEW TRANSLATION
 british_flavor.1.b: "Ne, tohle nemůžeme dopustit" # todo: NEW TRANSLATION
 british_flavor.2.t: "Vydání Augusta Pinocheta" # todo: NEW TRANSLATION
 british_flavor.2.d: "Lékařské důkazy dospěly k závěru, že bývalý chilský diktátor Augusto Pinochet není způsobilý stanout před soudem. V důsledku tohoto vyšetřování zesílily výzvy k deportaci bývalého diktátora zpět do jeho vlasti, Chile, ale v reakci na zástup těch, kteří požadují jeho deportaci, jiná skupina volá po pokračování jeho procesu zde ve Spojeném království." # todo: NEW TRANSLATION
 british_flavor.2.a: "Pošleme ho zpět" # todo: NEW TRANSLATION
 british_flavor.2.b: "Zůstane zde" # todo: NEW TRANSLATION
 british_flavor.3.t: "Solway Harvester se potopil" # todo: NEW TRANSLATION
 british_flavor.3.d: "Bylo oznámeno, že loď Solway Harvester se za silného vlnobití potopila u pobřeží ostrova Man. Rovněž se uvádí, že všech 11 členů posádky zahynulo a že loď je možné vyzvednout, přestože je těžce poškozena." # todo: NEW TRANSLATION
 british_flavor.3.a: "Budeme se tím zabývat později" # todo: NEW TRANSLATION
 british_flavor.3.b: "Vyzdvihněme těla posádky a připravme pohřby" # todo: NEW TRANSLATION
 british_flavor.4.t: "Unesen let Ariana Afghan Airways" # todo: NEW TRANSLATION
 british_flavor.4.d: "Skupina únosců v Afghánistánu nastoupila do letadla a donutila ho odletět do [ENG.GetName], kde přistálo v Londýně. Úřady se připravují vyslat malou jednotku, která se únoscům postaví, ale není známo, co s nimi následně uděláme." # todo: NEW TRANSLATION
 british_flavor.4.a: "Zatknout je a poté deportovat" # todo: NEW TRANSLATION
 british_flavor.4.b: "Zatknout je a poslat před soud!" # todo: NEW TRANSLATION
 british_flavor.5.t: "Nepřátelské převzetí banky NatWest" # todo: NEW TRANSLATION
 british_flavor.5.d: "Skotská banka se v současnosti pokouší o nepřátelské převzetí anglické banky NatWest Bank. Royal Bank of Scotland je v současnosti menší z obou bank a její úspěch do značné míry závisí na další nabídce jiné banky, Bank of Scotland." # todo: NEW TRANSLATION
 british_flavor.5.a: "Není to náš problém" # todo: NEW TRANSLATION
 british_flavor.5.b: "Zachraňme banku" # todo: NEW TRANSLATION
 british_flavor.6.t: "BMW oznámilo plány na prodej skupiny Rover" # todo: NEW TRANSLATION
 british_flavor.6.d: "Německá automobilka BMW oznámila plány na prodej skupiny Rover, přičemž londýnské konsorcium Alchemy se ukázalo jako hlavní kandidát na převzetí. Přestože by nám toto převzetí mohlo zajistit větší vliv v automobilovém průmyslu, nakonec se stane další přítěží v neustále křehčím automobilovém odvětví." # todo: NEW TRANSLATION
 british_flavor.6.a: "Nám to nevadí" # todo: NEW TRANSLATION
 british_flavor.6.b: "Možná by to měli přehodnotit..." # todo: NEW TRANSLATION
 british_flavor.7.t: "David Trimble vyhrál volby předsedy Ulsterské unionistické strany" # todo: NEW TRANSLATION
 british_flavor.7.d: "David Trimble vyhrál volby předsedy Ulsterské unionistické strany, pro-unijní politické strany a třetí nejstarší strany v Británii. Jeho vítězství slaví konzervativci, zatímco ti, kteří si přejí větší autonomii, jsou k výsledkům buď lhostejní, nebo rozhořčení, jako vždy." # todo: NEW TRANSLATION
 british_flavor.7.a: "Pogratulovat vítězi" # todo: NEW TRANSLATION
 british_flavor.8.t: "Zákon o přistěhovalectví a azylu" # todo: NEW TRANSLATION
 british_flavor.8.d: "O zákonu o přistěhovalectví a azylu se v současnosti diskutuje. Pokud bude skutečně schválen, znamená to, že všichni uprchlíci a migranti získají nárok na poukázky na pokrytí nákladů na jídlo a oblečení. Vetovat jej může působit poněkud nelidsky, ale v konečném důsledku to povede k vyšším nákladům pro britské daňové poplatníky." # todo: NEW TRANSLATION
 british_flavor.8.a: "Schvalme to" # todo: NEW TRANSLATION
 british_flavor.8.b: "Vetujme to" # todo: NEW TRANSLATION
 british_flavor.9.t: "Antikapitalistické nepokoje na Parliament Square" # todo: NEW TRANSLATION
 british_flavor.9.d: "Antikapitalističtí výtržníci vyšli do ulic a zhanobili sochu bývalého britského premiéra Winstona Churchilla. Nepokojům se přezdívá nepokoje „Prvního máje“ a dav se zatím nezdá být připraven rozejít. Někteří volají po zásahu, zatímco jiní tvrdí, že se nakonec unaví a odejdou domů." # todo: NEW TRANSLATION
 british_flavor.9.a: "Počkáme, až to přejde" # todo: NEW TRANSLATION
 british_flavor.9.b: "Pošleme úklidové čety a policii" # todo: NEW TRANSLATION
 british_flavor.10.t: "[ENG.GetLeader] vypískán v Ženském institutu" # todo: NEW TRANSLATION
 british_flavor.10.d: "[ENG.GetLeader] se v Ženském institutu setkal s nepřátelským přijetím, když na něj rozzlobené členky pokřikovaly a pomalu mu tleskaly. Toto trapné přijetí vedlo k diskusím mezi členy strany i veřejností, která začala zpochybňovat některé aspekty našeho vedení." # todo: NEW TRANSLATION
 british_flavor.10.a: "Ignorovat to" # todo: NEW TRANSLATION
 british_flavor.10.b: "Reagovat na kritiku" # todo: NEW TRANSLATION
 british_flavor.11.t: "Skotsko usiluje o zrušení článku 28" # todo: NEW TRANSLATION
 british_flavor.11.d: "Skotský parlament usiluje o zrušení kontroverzního článku 28 zákona o místní samosprávě z roku 1988, který místním úřadům brání v „šíření homosexuality“. Pokud jim dovolíme tento zákon zrušit, může to vést k výzvám k jeho zrušení i jinde a způsobit politickou nestabilitu." # todo: NEW TRANSLATION
 british_flavor.11.a: "Zastavit je" # todo: NEW TRANSLATION
 british_flavor.11.b: "Je nám to jedno" # todo: NEW TRANSLATION
 british_flavor.12.t: "Alex Salmond odstupuje z SNP" # todo: NEW TRANSLATION
 british_flavor.12.d: "Alex Salmond odstoupil z vedení Skotské národní strany kvůli sporům o strategie financování uvnitř strany. Jeho rezignace nám poskytla příležitost zaútočit na SNP v době její slabosti a umožnit tak větší rozkol mezi jejími členy." # todo: NEW TRANSLATION
 british_flavor.12.a: "Nejlepší bude nic nedělat" # todo: NEW TRANSLATION
 british_flavor.12.b: "Zahájit politický útok" # todo: NEW TRANSLATION
 british_flavor.13.t: "Posledních osmdesát" # todo: NEW TRANSLATION
 british_flavor.13.d: "V rámci mírového procesu v Severním Irsku byla přijata opatření k propuštění posledních 80 vězňů držených ve věznici Maze. Tito vězni byli buď členy Irské národněosvobozenecké armády, nebo s ní měli úzké vazby. V roce 1997 došlo k incidentu, při němž tito vězni zabili a zastřelili velitele loajální dobrovolnické síly." # todo: NEW TRANSLATION
 british_flavor.13.a: "Možná si je ponecháme..." # todo: NEW TRANSLATION
 british_flavor.13.b: "Dobrá, ať tedy odejdou" # todo: NEW TRANSLATION
 british_flavor.14.t: "Na sídlišti Paulsgrove vypukly nepokoje" # todo: NEW TRANSLATION
 british_flavor.14.d: "Na sídlišti Paulsgrove v Portsmouthu vypukly nepokoje poté, co více než 100 lidí oblehlo bytový dům, v němž údajně bydlel odsouzený pachatel zneužívání dětí. Jde o poslední případ násilí vigilantů proti údajným sexuálním delikventům od začátku kampaně „pojmenování a zostuzení“ pořádané organizací News of the World." # todo: NEW TRANSLATION
 british_flavor.14.a: "Nuže, s tím jsme nemohli nic dělat" # todo: NEW TRANSLATION
 british_flavor.14.b: "Poslat policii" # todo: NEW TRANSLATION
 british_flavor.15.t: "Vypukly protesty proti cenám paliva" # todo: NEW TRANSLATION
 british_flavor.15.d: "Protestující zablokovali vjezdy do ropných rafinerií ve snaze protestovat proti vysokým cenám paliva. Motoristé začali panicky skupovat pohonné hmoty, což začíná vést k celostátnímu nedostatku paliva a dalšímu růstu cen ropy. Uvádí se, že v důsledku situace začíná zavírat velké množství čerpacích stanic a vláda se zoufale snaží najít řešení." # todo: NEW TRANSLATION
 british_flavor.15.a: "Obviňme průmysl fosilních paliv" # todo: NEW TRANSLATION
 british_flavor.15.b: "Zaveďme přísné kvóty na spotřebu ropy" # todo: NEW TRANSLATION
 british_flavor.15.c: "§RNechat být§!" # todo: NEW TRANSLATION
 british_flavor.151.t: "Vypukly nepokoje kvůli nečinnosti vlády" # todo: NEW TRANSLATION
 british_flavor.151.d: "Zdá se, že naše neschopnost vyřešit nedostatek paliva pouze přiživila další hněv. Stále více lidí vychází do ulic a požaduje vládní řešení. V současnosti protestující pochodují k vládním budovám a vandalizují sochy, budovy i symboly vlády." # todo: NEW TRANSLATION
 british_flavor.151.a: "Snažíme se!" # todo: NEW TRANSLATION
 british_flavor.152.t: "Výzvy ke změně sílí" # todo: NEW TRANSLATION
 british_flavor.152.d: "Zdá se, že odhodlání lidu pouze zesílilo a nenávist s hněvem se zaměřují na [ENG.GetLeader] a vládnoucí establishment. Zároveň sílí výzvy k přerozdělení královských prostředků na podporu dotací na palivo a někteří dokonce požadují, aby monarchie v hanbě odstoupila." # todo: NEW TRANSLATION
 british_flavor.152.a: "Směšné!" # todo: NEW TRANSLATION
 british_flavor.153.t: "Dolní sněmovna zapálena" # todo: NEW TRANSLATION
 british_flavor.153.d: "Byl vyhlášen výjimečný stav, protože protesty a nepokoje se dramaticky posunuly k otevřené anarchii namísto organizovaného občanského odporu. Rozzlobení protestující zapálili Dolní sněmovnu, zatímco policie nedokázala zadržet rozzuřený dav. Objevily se zprávy, že protestující plánují pochod k dalším státním institucím, není však jasné, jaký bude jejich další cíl." # todo: NEW TRANSLATION
 british_flavor.153.a: "Ach bože" # todo: NEW TRANSLATION
 british_flavor.154.t: "Královna abdikuje!" # todo: NEW TRANSLATION
 british_flavor.154.d: "Vzhledem k nedávnému povstání a pokračujícím selháním vlády královna oficiálně oznámila, že abdikuje, a plánuje později odpoledne oslovit národ ve formálním projevu. Přestože je mnoho lidí zarmouceno jejím odchodem, stále není jasné, zda bude nahrazena, neboť nenávist vůči monarchii od začátku protestů pouze zesílila." # todo: NEW TRANSLATION
 british_flavor.154.a: "Sbohem, koruno drahokamů a sametové róbě" # todo: NEW TRANSLATION
 british_flavor.155.t: "[ENG.GetLeader] odstupuje bez jasného nástupce" # todo: NEW TRANSLATION
 british_flavor.155.d: "[ENG.GetLeader] rezignoval, přičemž jeho strana nedokázala rychle najít vhodnou náhradu. Tento stav anarchie zanechal zemi v rozvratu, zmatku a zranitelnosti. Británie nikdy předtím nečelila takové krizi a vláda ukázala, že v současnosti není schopna nic vyřešit." # todo: NEW TRANSLATION
 british_flavor.155.a: "Co bude dál?!" # todo: NEW TRANSLATION
 british_flavor.156.t: "Armáda převzala kontrolu" # todo: NEW TRANSLATION
 british_flavor.156.d: "Britské ozbrojené síly oznámily své přímé zapojení do obnovy pořádku. Jejich mluvčí prohlásil, že každý, kdo poruší zákaz vycházení od 16:00, bude „rychle potrestán“, a uvedl, že vše, co hodlají učinit, bude v „nejlepším zájmu všech Britů“. To vyvolalo pobouření mezi členy Labouristické i Konzervativní strany, kteří označili toto převzetí moci za uzurpace moci, přičemž někteří tento krok odsoudili jako radikální posun k diktatuře. Politici však prokázali svou neschopnost řešit státní záležitosti a po rezignaci [ENG.GetLeader] není jasný nástupce." # todo: NEW TRANSLATION
 british_flavor.156.a: "Co přinese budoucnost?" # todo: NEW TRANSLATION
 british_flavor.157.t: "Zpráva: Stav nové vlády" # todo: NEW TRANSLATION
 british_flavor.157.d: "Adresováno Jeho Excelenci, [ENG.GetLeader],\nDatum: [GetDateText]\n\nBod I: Stav pořádku\nVaše Excelence, britské ozbrojené síly rychle zajistily kontrolu nad hlavními městskými oblastmi, jako jsou mimo jiné Londýn, Birmingham, Manchester a Liverpool. Zatím se zdá, že se lidé pomalu rozcházejí z davů a míří domů, protože jsme začali zavádět vládou financované dotace na ropu a programy, které mají zemi pomoci znovu se postavit na nohy.\n\nBod II: Výzvy zleva i zprava\nPolitici Labouristické i Konzervativní strany začali vyzývat naši krizovou administrativu, aby zahájila proces nutný k obnovení demokratické vlády v zemi. Někteří politici označují novou administrativu za symbol autoritářství a vojenského přehánění pravomocí. Jeden labouristický politik dokonce prohlásil, že „muži se zbraněmi se musí vrátit na své základny a muži s pery musí znovu plnit své povinnosti státních úředníků“.\n\nBod III: Další upevňování moci\nNaši muži začali vyhledávat politiky a úředníky, kteří byli nespokojeni se starým systémem, a vyzývají je, aby přišli sloužit místo bývalých politiků dvoustranického systému. Převzetí moci tímto způsobem téměř jistě povede k určitému celostátnímu konfliktu, avšak v současnosti nemáme jiný způsob, jak naši kontrolu upevnit." # todo: NEW TRANSLATION
 british_flavor.157.a: "Dobré vědět" # todo: NEW TRANSLATION
 british_flavor.16.t: "Konzervativci posilují v průzkumech" # todo: NEW TRANSLATION
 british_flavor.16.d: "Příznivci Konzervativní strany slaví poté, co zjistili, že toryové vedou před Labouristickou stranou s 38 % v průzkumu veřejného mínění MORI. Je to poprvé od roku 1993, kdy konzervativci vedou před Labouristickou stranou v celostátním průzkumu." # todo: NEW TRANSLATION
 british_flavor.16.a: "Dobře" # todo: NEW TRANSLATION
 british_flavor.17.t: "Zemětřesení otřáslo Warwickshirem" # todo: NEW TRANSLATION
 british_flavor.17.d: "Ceremoniální hrabství Warwickshire zasáhlo zemětřesení, které poškodilo několik okolních budov. Ozývají se výzvy k vládní pomoci při obnově některých poškozených staveb, avšak vládní rozpočet se v poslední době stále více ztenčuje, takže pro Westminster je obtížné dospět k jasnému závěru." # todo: NEW TRANSLATION
 british_flavor.17.a: "Nezbývá než doufat, že bude vše v pořádku" # todo: NEW TRANSLATION
 british_flavor.17.b: "Schválit vládní pomoc" # todo: NEW TRANSLATION
 british_flavor.18.t: "Donald Dewar převezen do nemocnice" # todo: NEW TRANSLATION
 british_flavor.18.d: "Donald Dewar, první ministr Skotska, byl po pádu před Bute House, svým oficiálním edinburským sídlem, převezen do nemocnice. Jeho zdravotní stav se rychle zhoršuje a sílí výzvy k zásahu vlády a vyslání pokročilých lékařských týmů." # todo: NEW TRANSLATION
 british_flavor.18.a: "Modleme se za jeho uzdravení" # todo: NEW TRANSLATION
 british_flavor.18.b: "Schválit vyslání pokročilých lékařských týmů na pomoc" # todo: NEW TRANSLATION
 United_Kingdom_News.2.t: "Ve Spojeném království vypukly nepokoje" # todo: NEW TRANSLATION
 United_Kingdom_News.2.d: "Po celostátním nedostatku paliva a prudkém růstu cen plynu se britské úřady rozhodly vyčkat, až nedostatek pomine, v naději, že se ekonomika přirozeně zotaví sama. Situace se však nezlepšila, naopak se dále zhoršovala a začátkem tohoto týdne se zcela vymkla kontrole, když protestující zapálili Dolní sněmovnu. Britské úřady prohlásily, že za nedostatek nenesou odpovědnost, a tvrdí, že jde pouze o přirozený problém, který pomine. Jeden protestující uvedl: „Nemám čím natankovat auto! Nemám jak se dostat do práce a doma nemám topení, které by udrželo mou rodinu v teple. To, co se dnes děje, je výsledkem neefektivního systému a vlády.“\nVláda trvá na tom, že dělá vše, co je v jejích silách, aby situaci zmírnila, protesty však podle všeho jen tak neustanou." # todo: NEW TRANSLATION
 United_Kingdom_News.2.a: "Hněv znovu propuká" # todo: NEW TRANSLATION
 United_Kingdom_News.3.t: "Královna Alžběta II. abdikovala" # todo: NEW TRANSLATION
 United_Kingdom_News.3.d: "V důsledku nedávných událostí oznámila královna Spojeného království Alžběta II. svou oficiální abdikaci z trůnu. Stalo se tak poté, co protestující začali požadovat konec monarchie a spojovali ji se symboly korupce, chamtivosti a finančních černých děr. Tentokrát byl hněv namířen proti monarchii konkrétně proto, že lidé požadovali přerozdělení peněz na vládní dotace paliva, jejich výzvy však ve Westminsteru padly na hluché uši. Není známo, zda na trůn nastoupí jiný člen královské rodiny, ale v tuto chvíli monarchii nezbývá než přihlížet, jak země hoří." # todo: NEW TRANSLATION
 United_Kingdom_News.3.a: "Trůn se hroutí" # todo: NEW TRANSLATION
 United_Kingdom_News.4.t: "Britské ozbrojené síly převzaly kontrolu nad Londýnem" # todo: NEW TRANSLATION
 United_Kingdom_News.4.d: "Britské ozbrojené síly oznámily své oficiální zapojení do vymáhání státem vyhlášeného výjimečného stavu a výslovně uvedly, že každý, kdo poruší zákaz vycházení od 16:00, bude „rychle potrestán“. Stalo se tak po týdnech protestů a nepokojů ve Spojeném království, během nichž protestující v návalu vzteku zapálili Dolní sněmovnu. Záměry tohoto nového správního orgánu zatím nejsou známy, údajně jej však tvoří vojenští představitelé, kteří hodlají omezit moc Labouristické a Konzervativní strany v britském establishmentu." # todo: NEW TRANSLATION
 United_Kingdom_News.4.a: "Je to konec Spojeného království?" # todo: NEW TRANSLATION
 ENG_inner_circle.01.t: "Vzestup [GetAscendingAdvisorName]" # todo: NEW TRANSLATION
 ENG_inner_circle.01.desc: "[GetAscendingAdvisorName] projevil(a) značné ambice a tiše rozšířil(a) svůj vliv v královské domácnosti. Každý krok směrem k větší autoritě však vyvolal námitky ostatních dvořanů a významných osobností a palác nyní pulzuje známým bojem o přístup a přednost. Otázkou je, zda [GetAscendingAdvisorName] udělal(a) na Královnu dostatečný dojem, aby získal(a) skutečné místo ve vnitřním kruhu Královny." # todo: NEW TRANSLATION
 ENG_inner_circle.01.a: "Nahradit [ENGGetAscendedAdvisorName1]" # todo: NEW TRANSLATION
 ENG_inner_circle.01.b: "Nahradit [ENGGetAscendedAdvisorName2]" # todo: NEW TRANSLATION
 ENG_inner_circle.01.c: "Nahradit [ENGGetAscendedAdvisorName3]" # todo: NEW TRANSLATION
 ENG_inner_circle.01.d: "[GetAscendingAdvisorName] si to nezaslouží." # todo: NEW TRANSLATION
 ENG_inner_circle_charles.03.t: "Princova návštěva harmonie" # todo: NEW TRANSLATION
 ENG_inner_circle_charles.03.desc: "Princ z Walesu dorazil na návštěvu, která spojuje dvorskou diplomacii s jasným poselstvím o péči o životní prostředí. Jednání s vysokými představiteli a představiteli občanské společnosti se zaměřila na obnovu důvěry, rozšíření praktické spolupráce a představení klimatické odolnosti jako společného strategického zájmu, nikoli pouhého tématu k diskusi." # todo: NEW TRANSLATION
 ENG_inner_circle_charles.03.a: "Nechme naše vztahy vést harmonií." # todo: NEW TRANSLATION
 ENG_inner_circle_charles.04.t: "Princ Charles prosazuje ochranu deštných pralesů" # todo: NEW TRANSLATION
 ENG_inner_circle_charles.04.desc: "Byli jsme informováni, že Jeho královská Výsost princ Charles, princ z Walesu, vyzval k rozsáhlejším globálním opatřením na ochranu tropických deštných pralesů. Jako zakladatel Prince's Rainforests Project využil svůj vliv ke spolupráci s vládami, podniky a občanskou společností, aby zdůraznil význam zastavení odlesňování a zachování těchto klíčových ekosystémů pro klimatickou stabilitu a biologickou rozmanitost." # todo: NEW TRANSLATION
 ENG_inner_circle_charles.04.a: "Vítáme podporu prince Charlese při ochraně deštných pralesů" # todo: NEW TRANSLATION
 ENG_inner_circle_charles.05.t: "Environmentální diplomacie prince Charlese" # todo: NEW TRANSLATION
 ENG_inner_circle_charles.05.desc: "Obdrželi jsme zprávu, že Jeho královská Výsost princ Charles, princ z Walesu, dokončil ve naší zemi cestu zaměřenou na environmentální diplomacii, během níž prosazoval spolupráci v oblasti klimatu, udržitelnosti a ekologické odolnosti. Jako jeden z nejdéle působících hlasů volajících po ochraně životního prostředí princ po desetiletí zdůrazňoval potřebu společného úsilí napříč státy a sektory při řešení globálních environmentálních výzev a podpoře udržitelných řešení." # todo: NEW TRANSLATION
 ENG_inner_circle_charles.05.a: "Podpořit udržitelnost." # todo: NEW TRANSLATION
 ENG_inner_circle_charles.06.t: "Princ Charles podporuje ekologické zemědělství" # todo: NEW TRANSLATION
 ENG_inner_circle_charles.06.desc: "Dozvěděli jsme se, že Jeho královská Výsost princ Charles, princ z Walesu, podnikl aktivní kroky na podporu rozvoje ekologického a udržitelného zemědělství v našem národě. Na základě desetiletí průkopnické práce na ekologických zemědělských metodách v Highgrove a Duchy Home Farm zdůraznil environmentální a sociální přínosy ekologických postupů a podpořil spolupráci v oblasti udržitelného zemědělství." # todo: NEW TRANSLATION
 ENG_inner_circle_charles.06.a: "Podpořit udržitelné zemědělství." # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.04.t: "Princ Andrew na obchodní misi" # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.04.desc: "Jeho královská Výsost princ Andrew, který působí jako obchodní zástupce Spojeného království, navštívil naši zemi s cílem podpořit užší obchodní vztahy a hospodářskou spolupráci. Během své mise jednal s vládními představiteli, vedoucími představiteli podniků a potenciálními investory, aby zdůraznil příležitosti pro obchod a investice, které prospívají jak naší ekonomice, tak ekonomice Spojeného království." # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.04.a: "Vítáme vás" # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.05.t: "Obchodní dohoda uzavřena" # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.05.desc: "S potěšením oznamujeme, že po nedávných jednáních a vyjednáváních vedených Jeho královskou Výsostí princem Andrewem, vévodou z Yorku, byla mezi naším národem a Spojeným královstvím uzavřena nová obchodní dohoda. Dohoda otevírá možnosti pro rozšíření obchodní výměny, spolupráci v klíčových odvětvích a vzájemný hospodářský prospěch a odráží společné zájmy a posílené vazby mezi našimi ekonomikami." # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.05.a: "Souhlasit s partnerstvím." # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.06.t: "Princ Andrew vyřazen z královské rodiny" # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.06.d: "V důsledku následků jeho vazeb na Jeffreyho Epsteina se princ Andrew stal politicky toxickým. Pod rostoucím tlakem veřejnosti a institucí je zbaven svého zbývajícího postavení v královské rodině a odstraněn z vnitřního kruhu." # todo: NEW TRANSLATION
 ENG_inner_circle_andrew.06.a: "Už nemůže zůstat" # todo: NEW TRANSLATION
 ENG_military.045.t: "Žádost Británie o strategické partnerství" # todo: NEW TRANSLATION
 ENG_military.045.d: "Spojené království, vedené konstitučním monarchou a oddané spolupráci se Západem, formálně požádalo o status významného spojence mimo NATO. Jeho udělení by posílilo transatlantické vztahy a zajistilo klíčového partnera v Evropě." # todo: NEW TRANSLATION
 ENG_military.045.a: "Schválit jejich žádost, jde o cenného spojence." # todo: NEW TRANSLATION
 ENG_military.045.b: "Odmítnout, u takových označení musíme být opatrní." # todo: NEW TRANSLATION
 ENG_military.046.t: "Washington partnerství schválil" # todo: NEW TRANSLATION
 ENG_military.046.d: "Spojené státy formálně označily Spojené království za významného spojence mimo NATO. Strategické partnerství otevírá cestu k hlubší obranné spolupráci a přednostnímu přístupu k americkým vojenským technologiím." # todo: NEW TRANSLATION
 ENG_military.046.a: "Cenný přítel za Atlantikem" # todo: NEW TRANSLATION
 ENG_military.047.t: "Washington partnerství odmítl" # todo: NEW TRANSLATION
 ENG_military.047.d: "Spojené státy odmítly naši žádost o označení za významného spojence mimo NATO. Zvláštní vztah trvá, Washington však v této chvíli není připraven jej dále formalizovat." # todo: NEW TRANSLATION
 ENG_military.047.a: "Zklamání, ale není to konec" # todo: NEW TRANSLATION
 ENG_military.048.t: "Návrh AUKUS" # todo: NEW TRANSLATION
 ENG_military.048.d: "Londýn navrhuje trilaterální partnerství s Washingtonem a Canberrou, založené na společné jaderné útočné ponorce. Britský návrh vychází ze studií nástupce třídy Astute a kombinuje reaktor Rolls-Royce s americkými bojovými systémy a vertikálními odpalovacími šachtami. Žádost jde dál než jakákoli předchozí dohoda: od Dohody o vzájemné obraně z roku 1958 je námořní jaderný pohon sdílen pouze se Spojeným královstvím a Britové nyní žádají, aby k němu byla připuštěna Austrálie. Schválení by propojilo Barrow-in-Furness a Osborne do jediné výrobní linky a po zbytek století rozmístilo spojenecké útočné ponorky ve východním Indickém oceánu." # todo: NEW TRANSLATION
 ENG_military.048.a: "Rozšířit dohodu o pohonu na Canberru" # todo: NEW TRANSLATION
 ENG_military.048.b: "Reaktor zůstane uvnitř dohody z roku 1958" # todo: NEW TRANSLATION
 ENG_military.049.t: "Jaderné ponorky, nebo konvenční pořadí" # todo: NEW TRANSLATION
 ENG_military.049.d: "Spojené království a Spojené státy nabídly Austrálii jadernou útočnou ponorku, první, která kdy byla dodána zemi bez vlastních jaderných zbraní. Cenou je stávající program konvenční náhrady, jehož smlouva by musela být zcela zrušena a evropský partner odškodněn. Místo něj přijdou rotace přes HMAS Stirling, přestavěná loděnice v Osborne a platba britské a americké průmyslové základně, aby zajistila výrobní kapacitu potřebnou pro naše vlastní ponorky. Rozhodnutí zavazuje Commonwealth k ponorkovým silám, které bez spojenecké podpory nedokáže udržovat, a k partnerství, jež je dodává." # todo: NEW TRANSLATION
 ENG_military.049.a: "Zrušit objednávku a stavět jaderné ponorky v Osborne" # todo: NEW TRANSLATION
 ENG_military.049.b: "Dodržíme smlouvu, kterou jsme podepsali" # todo: NEW TRANSLATION
 ENG_military.050.t: "AUKUS podepsán" # todo: NEW TRANSLATION
 ENG_military.050.d: "Tři vlády oznámily partnerství. Austrálie bude provozovat jadernou útočnou ponorku postavenou podle britského návrhu a reaktor, bojový systém i loděnice, které je sestavují, se nyní stávají společným projektem. Barrow-in-Furness získává vývozní zakázku, která na desetiletí zajistí nástupce třídy Astute, a britští, američtí a australští námořní inženýři budou poprvé pracovat podle společné sady výkresů." # todo: NEW TRANSLATION
 ENG_military.050.a: "Tři námořnictva, jedna ponorka" # todo: NEW TRANSLATION
 ENG_military.051.t: "Smlouva roztrhána" # todo: NEW TRANSLATION
 ENG_military.051.d: "Canberra bez varování a bez konzultace zrušila ponorkový program, aby přijala angloamerickou nabídku vyjednanou za našimi zády. Zakázka byla největší obrannou smlouvou, jakou kdy naši stavitelé lodí získali, a její ztráta přímo dopadá na loděnice a konstrukční týmy, které již zahájily práci. Naši velvyslanci jsou odvoláváni. Ať už je strategický argument pro nové uspořádání jakýkoli, spojenci se o takových rozhodnutích nemají dozvídat z tisku." # todo: NEW TRANSLATION
 ENG_military.051.a: "Rána do zad" # todo: NEW TRANSLATION
 ENG_military.052.t: "Washington zadržuje reaktor" # todo: NEW TRANSLATION
 ENG_military.052.d: "Spojené státy odmítly rozšířit námořní jaderný pohon za rámec dohody z roku 1958. Námitky v oblasti nešíření jaderných zbraní byly očekávatelné a Washington rozhodl, že převáží strategický přínos. Ponorka bude postavena, ale bude postavena samotná." # todo: NEW TRANSLATION
 ENG_military.052.a: "Pak ji postavíme sami" # todo: NEW TRANSLATION
 ENG_military.053.t: "Canberra odmítá" # todo: NEW TRANSLATION
 ENG_military.053.d: "Austrálie se rozhodla ponechat svůj stávající ponorkový program. Nabídka jaderné ponorky s sebou nesla závazky, které Canberra nebyla připravena přijmout, od poplatků za zrušení smlouvy až po závislost na údržbě trvající půl století. Partnerství nebude pokračovat." # todo: NEW TRANSLATION
 ENG_military.053.a: "Nabídka platí, pokud si to rozmyslí" # todo: NEW TRANSLATION
 ENG_military.054.t: "AUKUS oznámen" # todo: NEW TRANSLATION
 ENG_military.054.d: "Spojené království, Spojené státy a Austrálie oznámily trilaterální bezpečnostní partnerství, jehož prvním projektem bude společná jaderná útočná ponorka. Austrálie se stává první zemí bez jaderných zbraní, která ji bude provozovat. Reakce přichází okamžitě: odborníci na nešíření jaderných zbraní zpochybňují záruky týkající se vysoce obohaceného paliva pro námořnictvo, Peking dohodu odsuzuje jako blok namířený proti němu a evropský partner, jehož smlouva byla zrušena, odvolal své velvyslance." # todo: NEW TRANSLATION
 ENG_military.054.a: "Rovnováha v Indo-Pacifiku se mění" # todo: NEW TRANSLATION
 AST_aukus_submarine_programme: "Ponorkový program AUKUS" # todo: NEW TRANSLATION
 AST_aukus_submarine_programme_desc: "Loděnice v Osborne se přestavuje na montáž jaderných útočných ponorek podle britského návrhu, přičemž pracovníci získávají zkušenosti střídavými pobyty v Barrow-in-Furness a amerických loděnicích. Reaktorové jednotky dorazí jako uzavřené celky, avšak trup, integrace bojového systému a celoživotní údržba zůstanou v Jižní Austrálii, čímž Commonwealth získá ponorkový průmysl, jaký v takovém měřítku nikdy neměl." # todo: NEW TRANSLATION
 ENG_inner_circle_philip.04.t: "Princ Philip zemřel" # todo: NEW TRANSLATION
 ENG_inner_circle_philip.04.d: "Princ Philip, vévoda z Edinburghu, zemřel po desetiletích strávených v centru veřejného života královské rodiny. Jeho smrt znamená konec jedné éry monarchie a pocítí ji celé Spojené království." # todo: NEW TRANSLATION
 ENG_inner_circle_philip.04.a: "Národ truchlí" # todo: NEW TRANSLATION
 ENG_integrate_ireland: "Integrovat [IRE.GetFlag] Irsko" # todo: NEW TRANSLATION
 ENG_integrate_ireland_desc: "Po desetiletích jsme konečně podrobili a integrovali území Irska. Je nejvyšší čas formalizovat proces integrace." # todo: NEW TRANSLATION
 ENG_a_more_united_kingdom_decisions: "Sjednocení říše" # todo: NEW TRANSLATION
 ENG_a_more_united_kingdom_decisions_desc: "Po postupném úpadku Britského impéria a dekolonizaci během studené války naše říše neustále slábla. Diplomatickými prostředky a hegemonickým růstem budeme schopni znovu sjednotit naši říši.\n\nPřejeďte kurzorem přes barevný text pro více informací." # todo: NEW TRANSLATION
 ENG_core_objectives_text: "Hlavní cíle" # todo: NEW TRANSLATION
 ENG_econ_hegemony_text: "Ekonomická hegemonie" # todo: NEW TRANSLATION
 ENG_military_hegemony_text: "Vojenská hegemonie" # todo: NEW TRANSLATION
 ENG_political_hegemony_text: "Politická hegemonie" # todo: NEW TRANSLATION
 ENG_declare_economic_hegemony: "Vyhlásit ekonomickou hegemonii" # todo: NEW TRANSLATION
 ENG_declare_economic_hegemony_desc: "Nadešel čas prohlásit se ekonomickým hegemonem Commonwealthu." # todo: NEW TRANSLATION
 ENG_declare_military_hegemony: "Vyhlásit vojenskou hegemonii" # todo: NEW TRANSLATION
 ENG_declare_military_hegemony_desc: "Nadešel čas prohlásit se vojenským hegemonem Commonwealthu." # todo: NEW TRANSLATION
 ENG_declare_political_hegemony: "Vyhlásit politickou hegemonii" # todo: NEW TRANSLATION
 ENG_declare_political_hegemony_desc: "Nadešel čas prohlásit se politickým hegemonem Commonwealthu." # todo: NEW TRANSLATION
 ENG_fractured_kingdom_united_state_decisions: "Nová éra" # todo: NEW TRANSLATION
 ENG_fractured_kingdom_united_state_decisions_desc: "S nástupem nového režimu v [ENG.GetFlag] Británii budeme konečně schopni rychle, rozhodně a agresivně šířit svůj vliv navenek.\n\nPod naším velením budeme moci založit organizaci PMC, která rozpoutá chaos ve světě." # todo: NEW TRANSLATION
 ENG_grant_land_in_isle_of_man: "Proměnit ostrov Man" # todo: NEW TRANSLATION
 ENG_grant_land_in_isle_of_man_desc: "Navzdory svému historickému významu nám ostrov Man dnes mimo těžbu zdrojů slouží jen k velmi málo účelům. Pokud však tuto zemi svěříme naší nové organizaci PMC, bude moci plně rozvinout svůj potenciál a využít ji jako možnou základnu pro své operace." # todo: NEW TRANSLATION
 ENG_devolved_matters: "Otázky přenesených pravomocí" # todo: NEW TRANSLATION
 ENG_devolved_matters_desc: "Naše členské státy požadují více §Hdecentralizovaný stát§!, aby mohly získat nominální nebo úplnou nezávislost. Třemi hlavními státy jsou [SCO.GetFlag] §HSkotsko§!, [NIR.GetFlag] §HSeverní Irsko§! a [WAS.GetFlag] §HWales§!.\n\nPokud se stav našeho národa zhorší, budou se členské státy snažit prosadit zákony snižující jejich závislost. Ty můžeme vetovat, ovšem za cenu zvýšení jejich nespokojenosti.\n\nS postupem decentralizace se zpřístupní další rozhodnutí. Více informací najdete v rozhraní decentralizace v pravém dolním rohu obrazovky, označeném dílkem skládačky.\n\nDalší volby členských států: [?ROOT.ENG_election_var|Y0] měsíců" # todo: NEW TRANSLATION
 ENG_appease_scotland: "Cílené dotace pro [SCO.GetFlag] Skotsko" # todo: NEW TRANSLATION
 ENG_appease_nireland: "Cílené dotace pro [NIR.GetFlag] Severní Irsko" # todo: NEW TRANSLATION
 ENG_appease_wales: "Cílené dotace pro [WAS.GetFlag] Wales" # todo: NEW TRANSLATION
 ENG_doing_other_decision: "Probíhá jiné rozhodnutí" # todo: NEW TRANSLATION
 ENG_scottish_referendum: "Skotské referendum" # todo: NEW TRANSLATION
 ENG_scottish_referendum_desc: "Skotové byli našimi politikami již dlouho uklidněni. Po hlasování o Brexitu získala SNP v Skotsku obrovskou podporu. SNP je stranou, která usiluje o nezávislost na Spojeném království. Petice začínají zaplavovat Westminster. Je rozumné nechat Skotsko uspořádat jejich malé referendum." # todo: NEW TRANSLATION
 ENG_irish_referendum: "Irské referendum" # todo: NEW TRANSLATION
 ENG_irish_referendum_desc: "Po Brexitu se obyvatelé Severního Irska snaží o sjednocení s Irskem. Lidé to žádají a tlačí na to. Zklidněme jejich touhy a uspořádejme referendum." # todo: NEW TRANSLATION
 ENG_welsh_referendum: "[GetYear] Referendum [WAS.GetFlag] Walesu o nezávislosti" # todo: NEW TRANSLATION
 ENG_welsh_referendum_desc: "Obyvatelé [WAS.GetFlag] Walesu budou hlasovat v referendu, které určí jejich budoucnost jako národa, členského státu a hráče na Britských ostrovech. Kampaň potrvá až do volebního dne a výsledek bude odpovídat tomu, jaké bude mínění Velšanů v okamžiku sečtení hlasů. Westminster může vynaložit politický kapitál a peníze státní pokladny, aby výsledek ovlivnil.\n\nHlasů pro odchod z Unie: §Y[?ENG_referendum_leave_vote|0]§!%" # todo: NEW TRANSLATION
 ENG_release_scotland: "Schválit [GetYear] referendum [SCO.GetFlag] Skotska o nezávislosti" # todo: NEW TRANSLATION
 ENG_release_scotland_desc: "„Skotsko navždy!“\n\nMožná jsme předchozí pokus o referendum zavrhli příliš ukvapeně. Tuto chybu můžeme napravit." # todo: NEW TRANSLATION
 ENG_release_ireland: "Schválit [GetYear] referendum [NIR.GetFlag] Severního Irska o nezávislosti" # todo: NEW TRANSLATION
 ENG_release_ireland_desc: "Možná jsme předchozí pokus o referendum zavrhli příliš ukvapeně. Tuto chybu můžeme napravit." # todo: NEW TRANSLATION
 ENG_release_wales: "Schválit [GetYear] referendum [WAS.GetFlag] Walesu o nezávislosti" # todo: NEW TRANSLATION
 ENG_release_wales_desc: "Možná jsme předchozí pokus o referendum zavrhli příliš ukvapeně. Tuto chybu můžeme napravit." # todo: NEW TRANSLATION
 ENG_decommission_paramilitaries: "Odzbrojit polovojenské skupiny" # todo: NEW TRANSLATION
 ENG_decommission_paramilitaries_desc: "Nezávislá mezinárodní komise pro odzbrojení zasedá od roku 1997, aniž by jí kdy byl předán kompletní arzenál. Disidentské republikánské frakce, které odmítly Dohodu, nemají zájem odzbrojit, dokud mohou stále verbovat nové členy. Verbují všude tam, kde jsou chudé obytné čtvrti a vysoké napětí. Poskytněme Komisi peníze a politický kapitál, udržujme sektářské napětí dostatečně nízko, aby zprostředkovatelé dál jednali, a dejme tomu dva roky. Pak bude možné poslední arzenály trvale vyřadit z provozu. Pokud napětí znovu vzroste, celý proces se zhroutí.\n\nVyžaduje §YVelkopáteční dohodu§! jako svůj rámec.\n\nSektářské napětí: §Y[?ENG_north_irish_agitation|0]§!/§G15§!\nZávislost Severního Irska: §Y[?ENG_north_irish_dependency|0]§!/§G60§!\nNezaměstnanost: §Y[?total_unemployed_percentage_display|%]§!/§G10%§!" # todo: NEW TRANSLATION
 ENG_call_border_poll: "Vyhlásit hraniční referendum" # todo: NEW TRANSLATION
 ENG_call_border_poll_desc: "Dohoda zavazuje ministra pro Severní Irsko vyhlásit referendum, kdykoli se zdá pravděpodobné, že většina v Severním Irsku bude hlasovat pro sjednocené Irsko. Britská vláda je zároveň povinna výsledek provést. Nacionalistické strany nyní drží rozhodující vliv ve Stormontu a požadavek již nelze odkládat, aniž bychom Dohodu otevřeně porušili. Kampaň před referendem trvá rok a výsledek bude záviset na tom, jaké bude mínění obyvatel Severního Irska v době sčítání hlasů. Rok kampaně je proto stejně důležitý jako samotné vyhlášení hlasování.\n\nPolovojenské skupiny musí být nejprve odzbrojeny. Žádná komunita by nepřijala referendum konané pod hrozbou zbraní.\n\nSeveroírský nacionalismus: §Y[?ENG_north_irish_nationalists|0]§!/§G55§!" # todo: NEW TRANSLATION
 ENG_border_poll_mission: "Kampaň před hraničním referendem" # todo: NEW TRANSLATION
 ENG_border_poll_mission_desc: "Referendum bylo vyhlášeno a kampaň potrvá jeden rok. Výsledek určí úroveň severoirského nacionalismu v den hlasování, nikoli v den vyhlášení. Jasná nacionalistická většina vyvede provincii z Unie do Republiky, pokud ji Dublin přijme. Cokoli menšího uzavře ústavní otázku na několik let a zanechá nacionalistické hnutí poražené u volebních uren, plně si vědomé své porážky.\n\nSeveroírský nacionalismus: §Y[?ENG_north_irish_nationalists|0]§!\nJasné „Ano“ vyžaduje více než §G65§!." # todo: NEW TRANSLATION
 ENG_all_ireland_dominion: "Celoirské dominium" # todo: NEW TRANSLATION
 ENG_all_ireland_dominion_desc: "Jelikož Republika již odpovídá Londýnu, hranice se stala spíše správní než ústavní linií. Předání šesti hrabství Dublinu nás nestojí nic, co bychom již nezajistili: celý ostrov je spravován z hlavního města, které spravujeme my. Vyřešíme tím nejstarší křivdu těchto ostrovů v náš prospěch a podle našeho pohodlí, zrušíme dotace i posádku a ponecháme republikánskému hnutí sjednocené Irsko, které nemůže oslavovat.\n\nNejprve musí být skutečně vyřešena decentralizace Severního Irska. Předání provincie uprostřed krize by znamenalo krizi exportovat, nikoli vyřešit.\n\nSektářské napětí: §Y[?ENG_north_irish_agitation|0]§!/§G10§!\nZávislost Severního Irska: §Y[?ENG_north_irish_dependency|0]§!/§G70§!\nTlak na nezávislost: §Y[?ENG_north_irish_pressure|0]§!/§G40§!" # todo: NEW TRANSLATION
 ENG_repeal_good_friday_agreement: "Zrušit Velkopáteční dohodu" # todo: NEW TRANSLATION
 ENG_repeal_good_friday_agreement_desc: "Dohoda nás stojí trvalé dotace, přebujelý policejní aparát a vládu založenou na sdílení moci, v níž ministerské úřady zastávají lidé, kteří kdysi organizovali bombové útoky. Zrušme ji, pozastavme činnost Stormontu a spravujme provincii přímo z Londýna jako před rokem 1998. Úspory budou okamžité, stejně jako všechno ostatní: ústavní záruka, která držela republikánské hnutí v politice, zmizí, polovojenské skupiny se vrátí a sektářské napětí se projeví v plné síle, bez čehokoli, co by ho zmírnilo.\n\nUlster povstane. Budeme mít několik měsíců na udržení provincie pod kontrolou, než k tomu dojde." # todo: NEW TRANSLATION
 ENG_repeal_gfa_remove_TT: "Odstraní §Y$ENG_good_friday_agreement$§!" # todo: NEW TRANSLATION
 ENG_ulster_on_the_brink_activated_TT: "Aktivuje §RUlster na pokraji§!: máme §Y180§! dní na snížení severoirského sektářského napětí pod §G20§!, jinak prozatímní republikánské vedení vyhlásí povstání a my budeme bojovat o provincii." # todo: NEW TRANSLATION
 ENG_ulster_on_the_brink: "Ulster na pokraji" # todo: NEW TRANSLATION
 ENG_ulster_on_the_brink_desc: "Dohoda je pryč a provincie se rozpadá. Nepokoje se staly trvalými, armáda je zpět v ulicích v počtech nevídaných od sedmdesátých let a obě komunity se vyzbrojují v přesvědčení, že je nikdo nepřijde chránit. Pokud se sektářské napětí podaří během šesti měsíců snížit, lze provincii udržet bez dohody a bez povstání. Pokud ne, prozatímní republikánské vedení vyhlásí povstání a my budeme bojovat o Ulster.\n\nSektářské napětí: §Y[?ENG_north_irish_agitation|0]§!\nMusí klesnout pod §G20§!." # todo: NEW TRANSLATION
 decisions_ENG: "Rozhodnutí Spojeného království" # todo: NEW TRANSLATION # todo: MOVED KEY
 decisions_ENG_desc: "Zde může vláda zahajovat mise a přijímat rozhodná opatření k určení směru Británie, podporovat průmysl, utvářet výzkum, posilovat regiony a reagovat na měnící se potřeby národa." # todo: NEW TRANSLATION
 falkland_policy: "Falklandská politika" # todo: NEW TRANSLATION # todo: MOVED KEY
 denounce_status_as_the_commonwealth_of_nation_member: "§YOdsuzovat§! Status Člena Společenství národů" # todo: NEW TRANSLATION # todo: MOVED KEY
 denounce_status_as_the_commonwealth_of_nation_member_desc: "Osvoboďte se od zastaralých pout. Odzrušit členství v Společenství národů a nasměrujte se k skutečné národní suverenitě. Znovu si určete svůj osud. Najděte si svou vlastní cestu. Nezávislost čeká." # todo: NEW TRANSLATION # todo: MOVED KEY
 ENG_bankers_switch_faction: "Podpořit mezinárodní bankéře" # todo: NEW TRANSLATION
 ENG_bankers_switch_faction_desc: "Přeskupíme naše vnitřní spojenectví ve prospěch frakce mezinárodních bankéřů a nasměrujeme politiku ke globálním financím, volnému toku kapitálu a ekonomice založené na službách." # todo: NEW TRANSLATION
 ENG_scottish_parliament: "[SCO.GetFlag] Skotský parlament" # todo: NEW TRANSLATION
 ENG_scottish_parliament_desc: "Členové [SCO.GetFlag] Skotského parlamentu nebyli a nikdy nebudou vždy loajální Londýnu. Existují §Hpro-nezávislostní§! poslanci, kteří budou bojovat za vytvoření autonomního nebo nezávislého [SCO.GetFlag] Skotska.\n\nPokud §Hpro-nezávislostní§! poslanci získají většinu, začnou prosazovat zákony poskytující jim větší autonomii, které můžeme schválit nebo vetovat. Pokud budeme jejich požadavky soustavně přijímat, získáme přátelský a loajální [SCO.GetFlag] skotský členský stát. Pokud však jejich požadavky budeme opakovaně odmítat, jejich §Hnespokojenost§! může vést k velmi chaotické situaci. Pokud [SCO.GetFlag] §Hskotská nespokojenost§! dosáhne §H100§!, budou požadovat nezávislost.\n\n§HPro-nezávislostní mandáty§!: [?ENG_scottish_nationalists]/129\n\n[SCO.GetFlag] §HSkotská nespokojenost§!: [?ENG_scottish_agitation]" # todo: NEW TRANSLATION
 ENG_invest_northern_ireland_mission: "Investice do stavebního sektoru Severního Irska" # todo: NEW TRANSLATION
 ENG_ireland_border_cooperation: "Smlouva o spolupráci na irské hranici" # todo: NEW TRANSLATION
 ENG_clydach_nickel_decision: "Modernizovat niklovou rafinerii Clydach" # todo: NEW TRANSLATION
 ENG_clydach_nickel_decision_desc: "Modernizujeme niklovou rafinerii Clydach v jižním Walesu a rozšiřujeme kapacitu pro výrobu kovů do baterií a vysoce kvalitních slitin, abychom posílili dodávky kritických nerostů." # todo: NEW TRANSLATION
 ENG_alloys_modernisation: "Modernizovat výrobu slitin" # todo: NEW TRANSLATION
 ENG_alloys_modernisation_desc: "Investujeme do nových tavicích pecí a válcovacích linek pro speciální slitiny, čímž zvyšujeme kvalitu a průchodnost výroby všeho od turbín a pancéřových plátů po vysoce výkonné součástky." # todo: NEW TRANSLATION
 ENG_ellesmere_port_decision: "Továrna na magnety z vzácných zemin v Ellesmere Port" # todo: NEW TRANSLATION
 ENG_ellesmere_port_decision_desc: "Rozšiřujeme zpracování kovů vzácných zemin v Ellesmere Port a vyrábíme vysoce kvalitní magnety pro větrné turbíny, elektrická vozidla a pokročilé obranné systémy." # todo: NEW TRANSLATION
 ENG_shetland_hydrocarbon_decision: "Rozšířit těžbu uhlovodíků západně od Shetland" # todo: NEW TRANSLATION
 ENG_shetland_hydrocarbon_decision_desc: "Urychlíme rozvoj ropných a plynových polí západně od Shetland a využijeme hlubokomořské zásoby k posílení domácí produkce uhlovodíků a energetické bezpečnosti." # todo: NEW TRANSLATION
 ENG_rosebank_field_decision: "Rozvinout ropné pole Rosebank" # todo: NEW TRANSLATION
 ENG_rosebank_field_decision_desc: "Schvalujeme plný rozvoj ropného a plynového pole Rosebank a uvádíme do provozu nové pobřežní plošiny a potrubí, abychom posílili dlouhodobé dodávky energie." # todo: NEW TRANSLATION
 ENG_cambo_offshore_decision: "Rozvinout pobřežní pole Cambo" # todo: NEW TRANSLATION
 ENG_cambo_offshore_decision_desc: "Pokračujeme v projektu Cambo a přidáváme nové vrty a podmořská propojení, která uvedou jeho zásoby ropy a plynu do těžby." # todo: NEW TRANSLATION
 ENG_hornsea_wind_farm_decision: "Rozšířit větrnou farmu Hornsea" # todo: NEW TRANSLATION
 ENG_hornsea_wind_farm_decision_desc: "Podpoříme další fáze pobřežní větrné zóny Hornsea v Severním moři a přidáme turbíny i připojení k síti, abychom z největší větrné farmy na světě získali více čisté energie." # todo: NEW TRANSLATION
 ENG_drakeland_tungsten_decision: "Znovu otevřít wolframový důl Drakelands" # todo: NEW TRANSLATION
 ENG_drakeland_tungsten_decision_desc: "Znovu spustíme důl Drakelands poblíž Plymouthu a obnovíme těžbu cínu a wolframu, abychom posílili britské dodávky kritických kovů pro moderní technologie." # todo: NEW TRANSLATION
 ENG_south_crofty_tin_decision: "Znovu otevřít cínový důl South Crofty" # todo: NEW TRANSLATION
 ENG_south_crofty_tin_decision_desc: "Financujeme znovuotevření dolu South Crofty v Cornwallu, obnovíme hlubinnou těžbu cínu a přidáme stabilní domácí zdroj vysoce kvalitné rudy pro náš průmysl." # todo: NEW TRANSLATION
 ENG_scottish_industry_mission: "Skotský průmyslový neočekávaný zisk" # todo: NEW TRANSLATION
 ENG_scottish_industry_mission_desc: "Naše investice do skotského ocelářství a těžkého průmyslu mohou odemknout nová ložiska, zakázky a navazující projekty. Je značná šance, že obnovená aktivita v hutích a loděnicích odhalí další zdroje, které můžeme uvést do výroby." # todo: NEW TRANSLATION
 ENG_celsa_steel_mission: "Přezkum produkce ocelárny Celsa" # todo: NEW TRANSLATION
 ENG_celsa_steel_mission_desc: "Každý rok prověříme ocelárnu Celsa v Cardiffu, abychom zjistili, zda nové zakázky, zvýšení efektivity nebo dodávky šrotu ospravedlňují další zvýšení výroby oceli." # todo: NEW TRANSLATION
 ENG_roysth_naval_port_decision: "Rozšířit námořní přístav Rosyth" # todo: NEW TRANSLATION
 ENG_roysth_naval_port_decision_desc: "Rozšíříme doky a podpůrná zařízení v Rosythu a proměníme ústí řeky Forth v silnější základnu pro opravy, podporu a budoucí stavbu válečných lodí." # todo: NEW TRANSLATION
 ENG_expand_belfast_decision: "Rozšířit průmyslovou zónu v Belfastu" # todo: NEW TRANSLATION
 ENG_expand_belfast_decision_desc: "Uvolníme a vybavíme nové pozemky kolem belfastských doků a na okrajích města, čímž otevřeme další prostor pro továrny, loděnice a kanceláře v celém Severním Irsku." # todo: NEW TRANSLATION
 ENG_highland_main_line_decision: "Modernizovat hlavní trať přes Highlands" # todo: NEW TRANSLATION
 ENG_highland_main_line_decision_desc: "Modernizujeme hlavní trať přes Highlands mezi Perthem a Invernessem, zkrátíme jízdní doby a poskytneme městům podél trasy tolik potřebné zlepšení spojení a produktivity." # todo: NEW TRANSLATION
 ENG_titanic_quarter_decision: "Rozvinout Titanic Quarter" # todo: NEW TRANSLATION
 ENG_titanic_quarter_decision_desc: "Přestavíme bývalé loděniční pozemky v Belfastu na čtvrť Titanic Quarter, kde spojíme kanceláře, studia a nábřežní průmysl, abychom vdechli nový život starému areálu Harland & Wolff." # todo: NEW TRANSLATION
 ENG_elizabeth_line_decision: "Dokončit Elizabeth Line" # todo: NEW TRANSLATION
 ENG_elizabeth_line_decision_desc: "Dokončíme Elizabeth Line napříč Londýnem a propojíme Heathrow, West End, City a Canary Wharf rychlými a častými vlaky napříč městem, které zkrátí jízdní doby a zvýší produktivitu." # todo: NEW TRANSLATION
 ENG_productivity_gap_mission: "Ztráta produktivity" # todo: NEW TRANSLATION
 ENG_hs2_mission: "Výstavba vysokorychlostní železnice 2" # todo: NEW TRANSLATION
 ENG_northen_powerhouse_mission: "Výstavba železnice Northern Powerhouse" # todo: NEW TRANSLATION
 ENG_build_london: "Rozvoj Velkého Londýna" # todo: NEW TRANSLATION
 ENG_build_london_desc: "Slíbili jsme našim voličům v oblasti Velkého Londýna, že přijdou rekonstrukce. Nyní tento slib musíme splnit." # todo: NEW TRANSLATION
 ENG_promise_labour: "Slib labouristickým odborům" # todo: NEW TRANSLATION
 ENG_promise_labour_desc: "Dali jsme labouristickým odborům slib a musíme podle něj jednat." # todo: NEW TRANSLATION
 ENG_promise_military: "Slib vojensko-průmyslovému komplexu" # todo: NEW TRANSLATION
 ENG_promise_military_desc: "Dali jsme vojensko-průmyslovému komplexu slib a musíme podle něj jednat." # todo: NEW TRANSLATION
 ENG_promise_fossil_fuel: "Slib průmyslu fosilních paliv" # todo: NEW TRANSLATION
 ENG_promise_fossil_fuel_desc: "Dali jsme průmyslu fosilních paliv slib a musíme podle něj jednat." # todo: NEW TRANSLATION
 ENG_monarchy_decision_category: "Windsorští" # todo: NEW TRANSLATION
 ENG_monarchy_decision_category_desc: "Windsorští vládnou od roku 1917 a provádějí moderní monarchii válkou, společenskými změnami i tlaky nového století. Stojí v centru veřejného života Británie; jejich dynastie je vetkána do ceremonií, služby a tichých každodenních zvyklostí, které drží říši pohromadě. Její členové uplatňují vliv prostřednictvím patronátu, návštěv a diskrétních zásahů a zasahují do charity, diplomacie i ozbrojených sil způsoby, kterých samotná politika nedosáhne. Zde jsou zobrazovány úkoly královské rodiny a ukazuje se, jaké iniciativy může každý člen královské rodiny prosazovat a co může jeho přítomnost uvést do pohybu." # todo: NEW TRANSLATION
 ENG_monarchy: "Windsorští" # todo: NEW TRANSLATION
 ENG_charles_youth_sustainability_decision: "Posílit mládež pro udržitelnost" # todo: NEW TRANSLATION
 ENG_charles_youth_sustainability_decision_desc: "Jeho královská Výsost princ Charles zahájí program na podporu mladých lidí při vedení udržitelných a klimaticky šetrných iniciativ. Princ z Walesu naváže na desetiletí práce s mládežnickými charitami a ekologickými projekty a bude podporovat vzdělávání, rozvoj dovedností a podnikání v souladu s ekologickou odolností. Program uznává zásadní úlohu mladších generací při budování udržitelnější budoucnosti." # todo: NEW TRANSLATION
 ENG_charles_sustainable_urban_planning_decision: "Prosazovat udržitelné městské plánování" # todo: NEW TRANSLATION
 ENG_charles_sustainable_urban_planning_decision_desc: "Jeho královská Výsost princ Charles bude prosazovat udržitelné plánování měst a komunit založené na holistických principech designu, které upřednostňují lidi, životní prostředí a dlouhodobou odolnost. Program naváže na jeho dlouhodobou podporu budování komunit respektujících klimatický a kulturní kontext a bude prosazovat tradiční a ekologicky citlivé přístupy k architektuře, infrastruktuře a využívání půdy." # todo: NEW TRANSLATION
 ENG_charles_organic_agriculture_decision: "Prosazovat ekologické a udržitelné zemědělství" # todo: NEW TRANSLATION
 ENG_charles_organic_agriculture_decision_desc: "Jeho královská Výsost princ Charles využije svůj vliv k podpoře ekologických a udržitelných zemědělských metod ve venkovských i světových komunitách. Princ naváže na desetiletí oddanosti péči o ekologii a regenerativnímu zemědělství a bude prosazovat postupy, které zlepšují zdraví půdy, podporují rodinné farmy a snižují dopad na životní prostředí." # todo: NEW TRANSLATION
 ENG_charles_environmental_diplomacy_tour_decision: "Turné ekologické diplomacie" # todo: NEW TRANSLATION
 ENG_charles_environmental_diplomacy_tour_decision_desc: "Jeho královská Výsost princ Charles podnikne mezinárodní turné ekologické diplomacie na podporu spolupráce v oblasti udržitelnosti a klimatických iniciativ. Během desetiletí služby jako princ z Walesu navštívil mnoho zemí a jednal s vůdci i komunitami, aby podpořil opatření proti změně klimatu, ochranu deštných pralesů a udržitelný rozvoj. Turné se pokusí posílit globální partnerství a zdůraznit společný závazek chránit přírodní svět." # todo: NEW TRANSLATION
 ENG_charles_rainforest_help_decision: "Podpořit globální ochranu deštných pralesů" # todo: NEW TRANSLATION
 ENG_charles_rainforest_help_decision_desc: "Jeho královská Výsost princ Charles povede program na podporu globálního boje proti ničení tropických deštných pralesů. Jako zakladatel projektu Prince's Rainforests Project bude spolupracovat s vládami, organizacemi a občanskou společností na zdůraznění významu ochrany deštných pralesů a jejich role v boji proti změně klimatu." # todo: NEW TRANSLATION
 ENG_charles_charities_network_decision: "Aktivovat charitativní síť prince" # todo: NEW TRANSLATION
 ENG_charles_charities_network_decision_desc: "Jeho královská Výsost princ Charles aktivuje rozsáhlou síť charitativních organizací na podporu sociálních, vzdělávacích a ekologických projektů doma i v zahraničí. Jako předseda The Prince's Charities, skupiny organizací založených nebo podporovaných princem z Walesu, využije jejich společné odborné znalosti k budování udržitelných komunit, rozšiřování příležitostí a zlepšování životní pohody v několika regionech." # todo: NEW TRANSLATION
 ENG_charles_harmony_tour_decision: "Uskutečnit diplomatické turné Harmonie" # todo: NEW TRANSLATION
 ENG_charles_harmony_tour_decision_desc: "Jeho královská Výsost princ Charles podnikne mezinárodní turné na podporu své filozofie Harmonie a spolupráce v otázkách životního prostředí a udržitelnosti. Během desetiletí služby jako princ z Walesu soustavně využíval svůj vliv ke zdůrazňování potřeby klimatických opatření, ochrany deštných pralesů a udržitelného rozvoje. Toto turné se pokusí posílit globální partnerství kolem těchto společných cílů." # todo: NEW TRANSLATION
 ENG_andrew_naval_haritage_decision: "Přijetí námořního dědictví" # todo: NEW TRANSLATION
 ENG_andrew_naval_haritage_decision_desc: "Princ Andrew využije svou dlouhou kariéru v námořnictvu k vyzdvižení námořních tradic a služby svého národa. Jako pilot, instruktor a velitel vrtulníku Královského námořnictva, který se účastnil aktivní služby během konfliktu o Falklandy, bude podporovat úctu k námořnímu dědictví a rozvíjet spolupráci se spojeneckými flotilami a námořními výcvikovými institucemi po celém světě." # todo: NEW TRANSLATION
 ENG_andrew_trade_representive_decision: "Mise obchodního zástupce" # todo: NEW TRANSLATION
 ENG_andrew_trade_representive_decision_desc: "Princ Andrew podnikne misi obchodního zástupce na podporu britských obchodních zájmů v zahraničí. Naváže na své zkušenosti zvláštního zástupce Spojeného království pro mezinárodní obchod a investice a bude jednat se zahraničními vládami, obchodními představiteli a investory o příležitostech pro britský vývoz a příliv investic, čímž posílí hospodářské vztahy a podpoří spolupráci v obchodu a podnikání." # todo: NEW TRANSLATION
 ENG_andrew_emerging_trade_agreement_decision: "Usilovat o nové obchodní dohody" # todo: NEW TRANSLATION
 ENG_andrew_emerging_trade_agreement_decision_desc: "Princ Andrew povede úsilí o uzavření obchodních dohod a podnikatelských partnerství na rozvíjejících se světových trzích. Díky rozsáhlým zkušenostem s reprezentací britských obchodních zájmů v zahraničí se pokusí otevřít příležitosti pro vývoz, partnerství a investice s rozvojovými ekonomikami s vysokým potenciálem budoucího růstu a spolupráce." # todo: NEW TRANSLATION
 ENG_andrew_emerging_economy_benefits_decision: "Využít partnerství s rozvíjejícími se ekonomikami" # todo: NEW TRANSLATION
 ENG_andrew_emerging_economy_benefits_decision_desc: "Princ Andrew se zaměří na posílení partnerství s rozvíjejícími se ekonomikami s cílem rozšířit příležitosti pro obchod, investice a sdílený hospodářský růst. Tato iniciativa využije jeho rozsáhlé zkušenosti s podporou britských obchodních zájmů po celém světě, přiláká investice a odborné znalosti z rychle se rozvíjejících trhů, zvýší domácí produktivitu a podpoří dynamičtější podnikatelské prostředí." # todo: NEW TRANSLATION
 ENG_andrew_digital_enterprise_decision: "Iniciativa digitálního podnikání" # todo: NEW TRANSLATION
 ENG_andrew_digital_enterprise_decision_desc: "Princ Andrew zahájí iniciativu digitálního podnikání na podporu digitálních dovedností a podnikavosti v celé zemi. Program naváže na jeho práci s oceněními pro digitální podnikání, která pomáhala lidem rozvíjet online, technické a podnikatelské dovednosti. Jeho cílem je podporovat začínající digitální inovátory, zvyšovat technologickou gramotnost a budovat pevnější základy digitální ekonomiky." # todo: NEW TRANSLATION
 ENG_anne_national_charity_decision: "Národní charitativní organizace princezny Royal" # todo: NEW TRANSLATION
 ENG_anne_national_charity_decision_desc: "Princezna Royal rozšíří a zkoordinuje své národní patronáty, aby prosazovala praktické výsledky namísto příležitostí k fotografování. Sbírky, mobilizace dobrovolníků a pozornost veřejnosti budou směřovat tam, kde se kapacity hroutí." # todo: NEW TRANSLATION
 ENG_anne_carers_promotion_decision: "Kampaň za uznání pečujících" # todo: NEW TRANSLATION
 ENG_anne_carers_promotion_decision_desc: "Anne postaví neplacené pečující do středu národní pozornosti a bude tlačit na instituce, aby péči považovaly za základní službu, nikoli za soukromé břemeno. Kampaň prostřednictvím královského patronátu a trvalé viditelnosti zviditelní odlehčovací služby, pružnost na pracovišti a veřejný respekt." # todo: NEW TRANSLATION
 ENG_anne_military_readiness_decision: "Standardy připravenosti" # todo: NEW TRANSLATION
 ENG_anne_military_readiness_decision_desc: "Princezna Royal využije své vojenské funkce k požadavku profesionality, kázně při výcviku a neokázalých rutin, které udržují jednotky připravené k nasazení. Kontroly, cvičení a důsledné zajištění logistiky budou prosazovány jako měřítko serióznosti." # todo: NEW TRANSLATION
 ENG_anne_navy_readiness_decision: "Kontroly připravenosti flotily" # todo: NEW TRANSLATION
 ENG_anne_navy_readiness_decision_desc: "Royal Navy bude nuceno prokázat, že dokáže pod tlakem plout, bojovat a udržovat vlastní provoz. Přítomnost Anne nastaví standardy: údržba, způsobilost posádek a operační tempo budou považovány za nevyjednatelné." # todo: NEW TRANSLATION
 ENG_anne_tourism_decision: "Královská podpora cestovnímu ruchu" # todo: NEW TRANSLATION
 ENG_anne_tourism_decision_desc: "Pověst Británie je aktivem a princezna Royal ji využije účelně. Cílená podpora cestovního ruchu zviditelní dědictví, události a místní ekonomiky, které potřebují poptávku, a promění královská angažmá v rezervace a investice." # todo: NEW TRANSLATION
 ENG_edward_beach_youth_decision: "Práce s mládeží na pobřeží" # todo: NEW TRANSLATION
 ENG_edward_beach_youth_decision_desc: "Hrabě z Wessexu přenese práci Koruny s mládeží na pobřeží a prostřednictvím návštěv, oceňovacích programů a místních partnerství nasměruje mladé lidi k dovednostem a službě. Poselství je praktické: sebevědomí, disciplína a cesta vpřed." # todo: NEW TRANSLATION
 ENG_edward_global_youth_decision: "Globální zapojení mládeže" # todo: NEW TRANSLATION
 ENG_edward_global_youth_decision_desc: "Edward rozšíří práci s mládeží za hranice Británie a posílí vztahy prostřednictvím výměnných pobytů, výcviku a společných občanských projektů se zahraničními partnery." # todo: NEW TRANSLATION
 ENG_edward_arts_culture_patronage_decision: "Patronát umění a kultury" # todo: NEW TRANSLATION
 ENG_edward_arts_culture_patronage_decision_desc: "Koruna bude podporovat britský umělecký a kulturní sektor jako součást identity i strategického vlivu. Královský patronát zvýší viditelnost, uvolní financování a ochrání instituce, které doma i v zahraničí utvářejí národní vyprávění." # todo: NEW TRANSLATION
 ENG_edward_production_guild_decision: "Podpořit výrobní cechy" # todo: NEW TRANSLATION
 ENG_edward_production_guild_decision_desc: "Britské cechy a kvalifikovaná výrobní řemesla jsou páteří kvality a exportní síly. Edward podpoří výrobní cechy prostřednictvím uznání, vazeb na výcvik a koordinace odvětví, která udrží řemesla při životě a zajistí otevřené vzdělávací i výrobní dráhy." # todo: NEW TRANSLATION
 ENG_edward_veteran_support_decision: "Podpora veteránů ve Wessexu" # todo: NEW TRANSLATION
 ENG_edward_veteran_support_decision_desc: "Služba nekončí propuštěním a Koruna nebude s veterány zacházet jako s dodatečnou starostí. Hrabě z Wessexu zkoordinuje charity, zaměstnavatele a místní úřady s cílem zlepšit podporu při přechodu do civilního života, stabilitu bydlení a pracovní příležitosti." # todo: NEW TRANSLATION
 ENG_philip_award_medal_decision: "Předat medaili prince Philipa" # todo: NEW TRANSLATION
 ENG_philip_award_medal_decision_desc: "Princ Philip podnikne vlastní misi, aby předal medaili prince Philipa přednímu inženýrovi s mimořádným globálním dopadem. Toto ocenění pod jeho osobním patronátem uznává vynikající úspěchy v inženýrské praxi a inovacích." # todo: NEW TRANSLATION
 ENG_philip_award_expansion_decision: "Rozšířit ceny vévody" # todo: NEW TRANSLATION
 ENG_philip_award_expansion_decision_desc: "Princ Philip odcestuje, aby zahájil rozšíření Ceny vévody z Edinburghu a zpřístupnil tento mládežnický program širšímu mezinárodnímu publiku. Jeho úsilí má posílit odolnost mladých lidí a občanské dovednosti v mnoha zemích." # todo: NEW TRANSLATION
 ENG_philip_trust_funds_grants_decision: "Aktivovat granty fondu prince Philipa" # todo: NEW TRANSLATION
 ENG_philip_trust_funds_grants_decision_desc: "Princ Philip osobně dohlédne na rozdělování grantů z fondu prince Philipa místním komunitním a vzdělávacím projektům. Jeho přímé zapojení zajistí podporu iniciativ, které zlepšují volnočasové aktivity, vzdělávání a občanský život." # todo: NEW TRANSLATION
 ENG_philip_faith_conservation_decision: "Zahájit iniciativu víry a ochrany přírody" # todo: NEW TRANSLATION
 ENG_philip_faith_conservation_decision_desc: "Princ Philip zahájí program spojující náboženské komunity a ekologické skupiny ke společné péči o přírodu. Jeho cílem je mobilizovat morální a komunitní zdroje na podporu udržitelných ochranářských cílů." # todo: NEW TRANSLATION
 ENG_philip_innovation_recognition_decision: "Zavést národní ocenění inovací" # todo: NEW TRANSLATION
 ENG_philip_innovation_recognition_decision_desc: "Princ Philip zahájí národní program odměňující vynikající průmyslový design, vědu a praktické řešení problémů. Jeho iniciativa zdůrazní vynalézavost jako pilíř hospodářského růstu a národního úspěchu." # todo: NEW TRANSLATION
 ENG_william_air_ambulance_decision: "Sloužit ve směně letecké záchranky" # todo: NEW TRANSLATION
 ENG_william_air_ambulance_decision_desc: "Princ William vyráží na další směnu u letecké záchranky, létá k naléhavým zásahům a setkává se s pozemními posádkami." # todo: NEW TRANSLATION
 ENG_william_mental_health_at_work_decision: "Duševní zdraví na pracovišti" # todo: NEW TRANSLATION
 ENG_william_mental_health_at_work_decision_desc: "Princ William vyráží získat zaměstnavatele a charitativní organizace pro podporu duševního zdraví na pracovišti." # todo: NEW TRANSLATION
 ENG_william_step_into_health_decision: "Kampaň Step into Health" # todo: NEW TRANSLATION
 ENG_william_step_into_health_decision_desc: "Princ William vyráží na turné, aby podpořil program Step into Health a otevřel veteránům a rodinám vojáků přístupové cesty k NHS." # todo: NEW TRANSLATION
 ENG_william_early_years_forum_decision: "Svolat fórum raného dětství" # todo: NEW TRANSLATION
 ENG_william_early_years_forum_decision_desc: "Princ William svolává fórum o raném dětství, aby přivedl odborníky, charitativní organizace a podnikatele k jednomu stolu." # todo: NEW TRANSLATION
 ENG_william_chogm_youth_decision: "Poselství mládeži CHOGM" # todo: NEW TRANSLATION
 ENG_william_chogm_youth_decision_desc: "Princ William se účastní zasedání mládeže na setkání předsedů vlád Commonwealthu (CHOGM), aby dal najevo, že na příští generaci záleží pro budoucnost Commonwealthu." # todo: NEW TRANSLATION
 ENG_seize_sierra_leone_resources: "Využít [SIE.GetFlag] Sierru Leone" # todo: NEW TRANSLATION
 ENG_seize_sierra_leone_resources_desc: "Je čas, abychom z operace Barras něco vytěžili. Zmocníme se klíčových zdrojů v Sieře Leone a na 500 dní zde získáme ekonomický vliv." # todo: NEW TRANSLATION
 ENG_war_for_delta: "Válka o deltu" # todo: NEW TRANSLATION
 ENG_war_for_delta_desc: "Možná jsme na Nigerijce zatlačili až příliš, takže jejich ego potlačilo veškeré obavy z konfrontace s našimi silami. Přesto budeme muset obsadit jejich hlavní město, abychom jim ukázali, kdo tu skutečně velí." # todo: NEW TRANSLATION
 ENG_end_of_the_world: "Dobytí konce světa" # todo: NEW TRANSLATION
 ENG_end_of_the_world_desc: "Ohňová země, známá také jako „Konec světa“, je důležitým souostrovím a branou do Antarktidy. Obsazení tohoto strategického místa by mohlo celému národu přinést obrovské výhody, natolik velké, že jsme ochotni o něj bojovat." # todo: NEW TRANSLATION
 ENG_operation_eastern_divide: "Operace Východní rozdělení" # todo: NEW TRANSLATION
 ENG_operation_eastern_divide_desc: "Egypťané nevyhověli našim požadavkům na spravedlivý a rovnocenný přístup přes Suez, a proto nám nezbyla jiná možnost než přistoupit k vojenské akci." # todo: NEW TRANSLATION
 ENG_a_more_united_kingdom: "Jednotnější Spojené království" # todo: NEW TRANSLATION
 ENG_a_more_united_kingdom_desc: "Náš stát je sice v současnosti sjednocený, ale části našeho území se odtrhly a vytvořily nezávislé státy. Pokud máme být skutečně Spojeným královstvím, musíme znovu sjednotit státy Commonwealthu ze všech koutů světa." # todo: NEW TRANSLATION
 ENG_fractured_kingdom_united_state: "Rozdělené království, sjednocený stát" # todo: NEW TRANSLATION
 ENG_fractured_kingdom_united_state_desc: "§R„Občan, nikoli poddaný“§!\nZatímco monarchie a předchozí režim upadly v zapomnění, stát pouze zesílil. Nastal čas zaujmout na světové scéně rozhodnější a dominantnější postoj a konečně potrestat ty, kteří po staletí drancovali tuto zemi." # todo: NEW TRANSLATION
 ENG_deeper_commonwealth_integration: "Hlubší integrace Commonwealthu" # todo: NEW TRANSLATION
 ENG_deeper_commonwealth_integration_desc: "Pokud se máme stát skutečně sjednoceným státem, musíme nejprve přesvědčit ty, které si přejeme integrovat, že jsme vhodným hostitelem. Teprve potom budeme moci podniknout další kroky." # todo: NEW TRANSLATION
 ENG_sovereignty_above_all: "Svrchovanost nade vše" # todo: NEW TRANSLATION
 ENG_sovereignty_above_all_desc: "Nic není důležitější než schopnost našich správců určovat budoucnost našeho lidu. Žádný jiný stát než náš by neměl mít právo mluvit do toho, jak spravujeme své záležitosti." # todo: NEW TRANSLATION
 ENG_establishing_new_leadership: "Ustavení nového režimu" # todo: NEW TRANSLATION
 ENG_establishing_new_leadership_desc: "Než se můžeme pustit do práce, musíme ustavit nový režim. Bude nutné převrátit společenské uspořádání a začít plánovat novou přechodnou autoritu, která převezme správu v částech země a celý proces usnadní." # todo: NEW TRANSLATION
 ENG_two_way_concessions: "Oboustranné ústupky" # todo: NEW TRANSLATION
 ENG_two_way_concessions_desc: "Nemůžeme očekávat pokrok při dohodě o decentralizaci, pokud se bude snažit pouze jedna strana. Uděláme určité ústupky a očekáváme totéž od druhé strany ve Skotsku." # todo: NEW TRANSLATION
 ENG_uniting_the_isle: "Sjednocení ostrova" # todo: NEW TRANSLATION
 ENG_uniting_the_isle_desc: "Irové jsou příčinou mnoha našich problémů — od podněcování napětí po politické strany volající po odtržení Severního Irska. Je nejvyšší čas zasáhnout a dát jim lekci." # todo: NEW TRANSLATION
 ENG_revolution_not_devolution: "Revoluce, nikoli decentralizace" # todo: NEW TRANSLATION
 ENG_revolution_not_devolution_desc: "Abychom měli skutečně sjednocený stát, musíme nejprve zničit příčinu decentralizace. Potřebujeme národní revoluci, nikoli decentralizaci!" # todo: NEW TRANSLATION
 ENG_bring_in_canada: "Přivést Kanadu" # todo: NEW TRANSLATION
 ENG_bring_in_canada_desc: "Musíme podat ruku Kanadě jako největšímu členu Commonwealthu z hlediska rozlohy. Naši kanadští přátelé si po dlouhou dobu udržovali blízké vztahy, takže by nemělo být příliš obtížné získat je na svou stranu." # todo: NEW TRANSLATION
 ENG_the_realm_of_britain: "Britská říše" # todo: NEW TRANSLATION
 ENG_the_realm_of_britain_desc: "Britskou říši nelze nikdy rozbít, protože duch britského lidu vytrvává i v dobách mimořádných útrap." # todo: NEW TRANSLATION
 ENG_glory_of_pax_britannica: "Sláva Pax Britannica" # todo: NEW TRANSLATION
 ENG_glory_of_pax_britannica_desc: "Naše minulost je slavná a někteří říkají, že minulost ve skutečnosti nezmizela, nýbrž předznamenává to, co přijde. Musíme naplnit sny našich předků a obnovit slávu Pax Britannica!" # todo: NEW TRANSLATION
 ENG_australian_outreach: "Navázání kontaktu s Austrálií" # todo: NEW TRANSLATION
 ENG_australian_outreach_desc: "Nesmíme zapomenout na oběti, které Australané v průběhu dějin přinesli pro naši věc. Proto je nezbytné pozvat je, aby se k nám v budoucnu připojili." # todo: NEW TRANSLATION
 ENG_new_zealands_offer: "Nabídka Nového Zélandu" # todo: NEW TRANSLATION
 ENG_new_zealands_offer_desc: "Lidé z Nového Zélandu jsou již po velmi dlouhou dobu našimi pevnými spojenci a v dobrém i zlém stáli při nás. Je pouze příhodné požádat je, aby se k nám připojili." # todo: NEW TRANSLATION
 ENG_fracture_nato_unity: "Rozštěpit jednotu NATO" # todo: NEW TRANSLATION
 ENG_fracture_nato_unity_desc: "Je sice pravda, že jsme po dlouhou dobu těžili z bezpečnosti NATO, ale nyní tomu tak již není. Musíme pochopit, že naši bývalí přátelé si nepřejí nic jiného než rozdělit a rozštěpit náš stát, a náš lid si toho musí být vědom." # todo: NEW TRANSLATION
 ENG_end_eastern_suffering: "Ukončit utrpení Východu" # todo: NEW TRANSLATION
 ENG_end_eastern_suffering_desc: "Ubohá změť států ve východní Evropě vedená Ruskem pomalu a strašlivě upadá. Bylo by lepší zasáhnout a nastolit v tomto regionu skutečnou prosperitu a pořádek." # todo: NEW TRANSLATION
 ENG_declare_the_commonwealth: "Vyhlásit Commonwealth" # todo: NEW TRANSLATION
 ENG_declare_the_commonwealth_desc: "Nyní, když se všechny země Commonwealthu — alespoň ty důležité — připojily pod jeden prapor, je namístě oznámit světu, že Federace Commonwealthu je zde a hodlá zde zůstat." # todo: NEW TRANSLATION
 ENG_overseas_territory: "Britské zámořské území" # todo: NEW TRANSLATION
 ENG_active_resource_project: "§YAktivní projekt kritických nerostů§!" # todo: NEW TRANSLATION
 ENG_active_productivity_project: "§YAktivní projekt národní produktivity§!" # todo: NEW TRANSLATION
 ENG_ucl_east_campus: "Areál UCL East" # todo: NEW TRANSLATION
 OPEN_devolution_BUTTON: "Decentralizované záležitosti" # todo: NEW TRANSLATION
 OPEN_devolution_BUTTON_TT: "Otevřít panel decentralizace a spravovat Skotsko, Wales a Severní Irsko." # todo: NEW TRANSLATION
 ENG_mechanic_menu_explanation: "Decentralizace" # todo: NEW TRANSLATION
 ENG_devolution_HEADER_TITTLE_LOC: "Decentralizované záležitosti" # todo: NEW TRANSLATION
 ENG_mechanic_menu_explanation_2: "Decentralizace nám umožňuje vrátit část moci do rukou našich území. Spravovat je můžeme kliknutím na příslušný stát. Každé území bude mít §Cparlament§!, úroveň §Rneklidu§! a úroveň §Gzávislosti§!. Podržením kurzoru nad tlačítkem §Ginformací§! zobrazíte podrobné vysvětlení." # todo: NEW TRANSLATION
 ENG_parliament_gui_tooltip: "Každé území bude mít vlastní parlament. V závislosti na míře neklidu v jednotlivých územích mohou lidé s větší či menší pravděpodobností volit poslance podporujícího nezávislost. Jakmile se však takový poslanec ujme úřadu, bude velmi nepravděpodobné, že bude odvolán. Pokud poslanci podporující nezávislost získají většinu, mohou začít prosazovat zákony snižující jejich závislost a nakonec požadovat referendum.\n\nNaši poddaní na nás budou mít určitý názor, který se projevuje jejich neklidem. Území může být neklidnější v závislosti na naší politické straně, počtu zákonů, které vetujeme, nebo na tom, zda násilně zvyšujeme jeho závislost. Neklid mohou ovlivnit některé události, rozhodnutí či zaměření. Území silně závislé na Westminsteru se každý měsíc samo uklidní, zatímco území, které nás již nepotřebuje, bude postupně stále rozzlobenější.\n\nZávislost určuje míru, do jaké se území dokáže spravovat samo. Pokud je závislost nízká, může začít požadovat více svobod, protože si bez království dokáže dobře poradit. Na základě událostí, které obdržíme, a zaměření, která zvolíme, budeme mít možnost jejich závislost snížit nebo zvýšit.\n\nNacionalismus, neklid a míra soběstačnosti se kombinují do skóre tlaku na nezávislost. Jakmile má území většinu podporující nezávislost a jeho tlak překročí §R60§!, začne kampaň za referendum. Poté máme rok na snížení tlaku pod §G50§!, než bude referendum skutečně vyhlášeno. Kampaň může vést vždy pouze jedno území a dalších pět let poté nemůže následovat žádné další.\n\nNapětí v Severním Irsku představuje napětí mezi unionistickými protestanty a republikánskými katolíky. Naše rozhodnutí mohou napětí rozdmýchat, a pokud dosáhne 50 %, dojde k občasným násilným střetům. Pokud bude napětí dále růst nad 50 %, bude frekvence střetů narůstat." # todo: NEW TRANSLATION
 ENG_dependency_gui_tooltip2: "Závislost určuje míru, do jaké se území dokáže spravovat samo. Pokud je závislost nízká, může začít požadovat více svobod, protože si bez království dokáže dobře poradit. Na základě událostí, které obdržíme, a zaměření, která zvolíme, budeme mít možnost jejich závislost snížit nebo zvýšit." # todo: NEW TRANSLATION
 ENG_parliament_gui_tooltip2: "Každé území bude mít vlastní parlament. V závislosti na míře neklidu v jednotlivých územích mohou lidé s větší či menší pravděpodobností volit poslance podporujícího nezávislost. Jakmile se však takový poslanec ujme úřadu, bude velmi nepravděpodobné, že bude odvolán. Pokud poslanci podporující nezávislost získají většinu, mohou začít prosazovat zákony snižující jejich závislost a nakonec požadovat referendum." # todo: NEW TRANSLATION
 ENG_agitation_gui_tooltip2: "Naši poddaní na nás budou mít určitý názor, který se projevuje jejich neklidem. Území může být neklidnější v závislosti na naší politické straně, počtu zákonů, které vetujeme, nebo na tom, zda násilně zvyšujeme jeho závislost. Neklid mohou ovlivnit některé události, rozhodnutí či zaměření. Území silně závislé na Westminsteru se každý měsíc samo uklidní, zatímco území, které nás již nepotřebuje, bude postupně stále rozzlobenější. Neklid přispívá ke skóre tlaku na nezávislost, které rozhoduje o zahájení kampaně za referendum." # todo: NEW TRANSLATION
 ENG_irish_tension_tooltip: "Napětí v Severním Irsku představuje napětí mezi unionistickými protestanty a republikánskými katolíky. Naše rozhodnutí mohou napětí rozdmýchat, a pokud dosáhne 50 %, dojde k občasným násilným střetům. Pokud bude napětí dále růst nad 50 %, bude frekvence střetů narůstat." # todo: NEW TRANSLATION
