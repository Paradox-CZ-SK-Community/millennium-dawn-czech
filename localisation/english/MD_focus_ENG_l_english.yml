 ENG_phillip_1_idea: "Vévoda z Edinburghu" # todo: NEW TRANSLATION
 ENG_phillip_1_idea_desc: "Titul vévody z Edinburghu užíval princ Philip jako určující znak své role po boku panovníka a celoživotní služby říši. Byl mu udělen při sňatku s princeznou Alžbětou a spojoval historickou prestiž s moderní identitou založenou na povinnosti, disciplíně a institucionální podpoře. Ve veřejném životě se stal úzce spjatým s jeho patronáty a praktickou prací, která po celé generace podporovala monarchii." # todo: NEW TRANSLATION
