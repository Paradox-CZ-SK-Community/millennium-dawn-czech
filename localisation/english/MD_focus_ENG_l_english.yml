 ENG_auxiliary_navy1: "Královské pomocné námořnictvo" # todo: NEW TRANSLATION
 ENG_auxiliary_navy1_desc: "Koncept pomocného Královského námořnictva zdůrazňuje význam civilní podpory námořních operací a vyzdvihuje spolupráci mezi vojenským a civilním personálem s cílem zajistit účinnost a připravenost Královského námořnictva při plnění jeho námořních povinností." # todo: NEW TRANSLATION
 ENG_auxiliary_navy2: "Královské pomocné námořnictvo" # todo: NEW TRANSLATION
 ENG_auxiliary_navy2_desc: "Koncept pomocného Královského námořnictva zdůrazňuje význam civilní podpory námořních operací a vyzdvihuje spolupráci mezi vojenským a civilním personálem s cílem zajistit účinnost a připravenost Královského námořnictva při plnění jeho námořních povinností." # todo: NEW TRANSLATION
 ENG_royal_army1: "Britská královská armáda" # todo: NEW TRANSLATION
 ENG_royal_army1_desc: "Britská armáda je pozemní složkou britských ozbrojených sil a slouží jako hlavní pozemní vojenská síla Spojeného království. Díky bohaté historii sahající několik staletí do minulosti je britská armáda známá svou profesionalitou, přizpůsobivostí a operační účinností. Tvoří ji vysoce vycvičení vojáci z různých prostředí a je vybavena k plnění široké škály misí, včetně bojových operací, mírových misí, pomoci při katastrofách a humanitárních úkolů." # todo: NEW TRANSLATION
 ENG_royal_army2: "Britská královská armáda" # todo: NEW TRANSLATION
 ENG_royal_army2_desc: "Britská armáda je pozemní složkou britských ozbrojených sil a slouží jako hlavní pozemní vojenská síla Spojeného království. Díky bohaté historii sahající několik staletí do minulosti je britská armáda známá svou profesionalitou, přizpůsobivostí a operační účinností. Tvoří ji vysoce vycvičení vojáci z různých prostředí a je vybavena k plnění široké škály misí, včetně bojových operací, mírových misí, pomoci při katastrofách a humanitárních úkolů." # todo: NEW TRANSLATION
 ENG_royal_army3: "Britská královská armáda" # todo: NEW TRANSLATION
 ENG_royal_army3_desc: "Britská armáda je pozemní složkou britských ozbrojených sil a slouží jako hlavní pozemní vojenská síla Spojeného království. Díky bohaté historii sahající několik staletí do minulosti je britská armáda známá svou profesionalitou, přizpůsobivostí a operační účinností. Tvoří ji vysoce vycvičení vojáci z různých prostředí a je vybavena k plnění široké škály misí, včetně bojových operací, mírových misí, pomoci při katastrofách a humanitárních úkolů." # todo: NEW TRANSLATION
 ENG_royal_airforce1: "Duchové Královského letectva" # todo: NEW TRANSLATION
 ENG_royal_airforce1_desc: "Navzdory své slavné historii odráží zastaralé Královské letectvo éru stárnoucího vybavení a omezených schopností. Zatížené zastaralými letouny a nedostatečnou modernizací symbolizuje tento národní duch výzvy spojené s udržením vzdušné převahy pomocí zastaralých technologií. Navzdory těmto omezením však odkaz Královského letectva přetrvává a inspiruje k odolnosti a odhodlání přizpůsobit se a překonat tyto překážky." # todo: NEW TRANSLATION
 ENG_royal_airforce2: "Modernizace Královského letectva" # todo: NEW TRANSLATION
 ENG_royal_airforce2_desc: "Modernizující se Královské letectvo představuje strategický posun směrem k oživení vzdušných schopností prostřednictvím rozsáhlé modernizace. Se zaměřením na modernizaci letounů, zvyšování technologických schopností a investice do špičkových systémů odráží tento národní duch proaktivní přístup k zajištění toho, aby Královské letectvo zůstalo v popředí vzdušné převahy na vyvíjejícím se bojišti." # todo: NEW TRANSLATION
 ENG_royal_airforce3: "Modernizované Královské letectvo" # todo: NEW TRANSLATION
 ENG_royal_airforce3_desc: "Modernizované Královské letectvo, zaměřené na vzdušnou převahu a rychlou reakci, představuje impozantní sílu vybavenou špičkovými stíhacími letouny a pokročilými bojovými schopnostmi. Díky obratným stíhačkám schopným ovládnout oblohu a zasahovat protivníky bezkonkurenční rychlostí a přesností ztělesňuje tento národní duch závazek Královského letectva udržovat vzdušnou převahu a chránit národní zájmy." # todo: NEW TRANSLATION
 ENG_royal_airforce4: "Modernizované Královské letectvo" # todo: NEW TRANSLATION
 ENG_royal_airforce4_desc: "Modernizované Královské letectvo ohlašuje novou éru projekce strategické vzdušné síly, charakterizovanou nejmodernějšími bombardéry a schopnostmi přesných úderů. Díky pokročilým bombardérům vybaveným pro mise na dlouhé vzdálenosti a přesně naváděné munici zdůrazňuje tento národní duch schopnost Královského letectva provádět rozhodné a přesné nálety proti vysoce hodnotným cílům, promítat moc a odrazovat protivníky s bezkonkurenční přesností." # todo: NEW TRANSLATION
 ENG_royal_airforce5: "Modernizované Královské letectvo" # todo: NEW TRANSLATION
 ENG_royal_airforce5_desc: "Modernizované Královské letectvo ohlašuje novou éru projekce strategické vzdušné síly, charakterizovanou nejmodernějšími bombardéry a schopnostmi přesných úderů. Díky pokročilým bombardérům vybaveným pro mise na dlouhé vzdálenosti a přesně naváděné munici zdůrazňuje tento národní duch schopnost Královského letectva provádět rozhodné a přesné nálety proti vysoce hodnotným cílům, promítat moc a odrazovat protivníky s bezkonkurenční přesností." # todo: NEW TRANSLATION
 ENG_airbus_expansion: "Rozšíření Airbusu" # todo: NEW TRANSLATION
 ENG_airbus_expansion_desc: "Rozšíření Airbusu zdůrazňuje závazek společnosti k inovacím, excelenci a spokojenosti zákazníků a zároveň přispívá k hospodářskému rozvoji, tvorbě pracovních míst a technologickému pokroku v britském leteckém průmyslu." # todo: NEW TRANSLATION
 ENG_homegrown_innovation: "Domácí inovace" # todo: NEW TRANSLATION
 ENG_homegrown_innovation_desc: "Domácí inovace mají za cíl podporovat kulturu inovací a podnikání v britském leteckém a kosmickém průmyslu." # todo: NEW TRANSLATION
