 ENG_additional_expenditure_Colombia_TT: "£corruption_cost_factor_texticon  Náklady politické moci na změnu korupce: §R+15 %§!\n--------------\n§YVojenská pomoc§! zaměřená na [COL.GetFlag] §YKolumbii§!:\n- Pravděpodobněji bude přijata.\n- Nevyžaduje, aby jim bylo vyhrožováno.\n\n§YManipulace s politikou§! zaměřená na [COL.GetFlag] §YKolumbii§!:\n- Požadovaný vliv: §G20 %§! (základ 30 %)\n- Náklady politické moci: §G-25 %§!\n\nZískáme §G20 %§! příjmů [COL.GetFlag] §YKolumbie§! z vývozu ropy\n- Dodatečný příjem: £income_texticon $$[?additional_income_ENG_columbia_oil|+3]\n--------------\n§gTento národní duch bude odstraněn, pokud Kolumbie zlikviduje kartely nebo pokud bude korupce vyšší než mírná korupce (úroveň 2).§!" # todo: NEW TRANSLATION
 ENG_dissident_campaign_TT: "Měsíční úroveň severoírského sektářského napětí: §R+0,15§![ENG_dissident_campaign_active_loc]\n\n[ENG_no_longer_good_friday]\n--------------\n§YOdzbrojení paramilitárních jednotek§!\nRozhodnutí §HOdzbrojit paramilitární jednotky§! v části §HDevolvované záležitosti§! tento národní duch po dvou letech ověřeného odzbrojení navždy odstraní. Vyžaduje §YVelkopáteční dohodu§! jako rámec a:\n- Sektářské napětí pod §G15§! (aktuálně §Y[?ENG_north_irish_agitation|0]§!)\n- Severoírskou závislost nad §G60§! (aktuálně §Y[?ENG_north_irish_dependency|0]§!)\n- Nezaměstnanost pod §G10 %§! (aktuálně §Y[?total_unemployed_percentage_display|%]§!)\n\nPokud sektářské napětí znovu vzroste nad §R25§!, proces se zhroutí." # todo: NEW TRANSLATION
 ENG_operation_banner_TT: "\n" # todo: NEW TRANSLATION
