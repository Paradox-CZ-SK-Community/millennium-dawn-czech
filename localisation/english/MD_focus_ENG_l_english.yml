 ENG_anne_1_idea: "Královská princezna" # todo: NEW TRANSLATION
 ENG_anne_1_idea_desc: "Anne užívá titul královské princezny jako výraz svého výsadního postavení a mimořádné služby královské rodině. Tradičně jej panovník uděluje své nejstarší dceři; titul není automatický a je osobní poctou. Nese historickou prestiž a vyjadřuje celoživotní očekávání veřejné povinnosti a neochvějné oddanosti Koruně." # todo: NEW TRANSLATION
