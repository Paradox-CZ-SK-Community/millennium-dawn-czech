 ENG_andrew_digital_enterprise_modifier: "Královská iniciativa digitalizace podnikání" # todo: NEW TRANSLATION
 ENG_andrew_digital_enterprise_modifier_desc: "S podporou patronátních sítí vévody z Yorku vznikla nová iniciativa propojující investory, regionální firmy a technologické podniky prostřednictvím modernějšího obchodního rámce. K urychlení digitalizace a zlepšení viditelnosti britského podnikání doma i v zahraničí slouží obchodní zastoupení, podnikatelská fóra a partnerství se soukromým sektorem." # todo: NEW TRANSLATION
 ENG_edward_beach_youth_modifier: "Vévodova kampaň na podporu mládeže" # todo: NEW TRANSLATION
 ENG_edward_beach_youth_modifier_desc: "Pod patronátem hraběte z Wessexu byly po celé zemi rozšířeny iniciativy zapojující mládež prostřednictvím programů ocenění, komunitních sítí a veřejných akcí. Kampaň zdůrazňuje sebevědomí, občanskou službu a praktické dovednosti, posiluje společenskou soudržnost a povzbuzuje novou generaci k účasti na životě národa." # todo: NEW TRANSLATION
