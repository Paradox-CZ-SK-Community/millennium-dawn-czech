l_english:
 united_kingdom_focus: "Strom zaměření Spojeného království" # todo: NEW TRANSLATION
 ENG_british_flag_on_the_moon: "Britská vlajka na Měsíci" # todo: NEW TRANSLATION
 ENG_british_flag_on_the_moon_desc: "Vydejte se na ambiciózní lunární misi, během níž se Spojené království pokusí vybudovat britskou základnu na Měsíci. Tato lunární iniciativa představuje odhodlání národa k průzkumu vesmíru, demonstruje technologickou vyspělost a podporuje vědecké inovace. Staňte se průkopníky kosmické hranice, pozvedněte globální postavení Spojeného království v oblasti průzkumu vesmíru." # todo: NEW TRANSLATION
 ENG_set_sail_to_mars: "Vyplout k Marsu" # todo: NEW TRANSLATION
 ENG_set_sail_to_mars_desc: "Spojené království se odvážně vydává za hranice Země s cílem vybudovat svou přítomnost na Marsu. Tato vizionářská iniciativa se zaměřuje na průkopnický průzkum Marsu, posouvání hranic vesmírných technologií a etablování Spojeného království jako klíčového hráče v lidské snaze dosáhnout Rudé planety. Přijměte výzvu dobytí Marsu a definujte roli Spojeného království v budoucnosti meziplanetárního průzkumu." # todo: NEW TRANSLATION
 ENG_new_thirteen_colonies: "Nových třináct kolonií" # todo: NEW TRANSLATION
 ENG_new_thirteen_colonies_desc: "Spojené království, které vytyčuje kurz k novým hranicím, čerpá inspiraci z historie a představuje si založení Nových třinácti kolonií na Marsu. Tato ambiciózní iniciativa, odkazující na ducha původních třinácti kolonií, představuje odhodlání Spojeného království osídlit Mars a přijmout výzvy meziplanetární kolonizace. Veďte úsilí o vytvoření nového odkazu na Rudé planetě, kde britští průkopníci zahájí cestu připomínající historické kořeny národa." # todo: NEW TRANSLATION
 ENG_asteroid_mining: "Těžba asteroidů" # todo: NEW TRANSLATION
 ENG_asteroid_mining_desc: "Vydejte se do kosmu s Britskou královskou společností pro těžbu asteroidů, zatímco Spojené království přijímá těžbu kosmických zdrojů. Tato iniciativa zaměřená na získávání cenných surovin z asteroidů symbolizuje odhodlání národa k průkopnickému využívání vesmírných zdrojů a špičkovým technologiím." # todo: NEW TRANSLATION
 ENG_establish_asteroid_mining_network_mission: "Budování sítě pro těžbu asteroidů" # todo: NEW TRANSLATION
 ENG_establish_asteroid_mining_network_mission_desc: "Vesmírná agentura Spojeného království nasazuje orbitální platformy a průzkumné vybavení, aby zahájila těžbu zdrojů mimo Zemi." # todo: NEW TRANSLATION
 ENG_asteroid_mining_light_operation: "Průzkumný průzkum" # todo: NEW TRANSLATION
 ENG_asteroid_mining_light_operation_desc: "Menší průzkumná mise nasadí robotické sondy k nalezení vhodných blízkozemních asteroidů pro těžbu." # todo: NEW TRANSLATION
 ENG_asteroid_mining_medium_operation: "Těžební mise" # todo: NEW TRANSLATION
 ENG_asteroid_mining_medium_operation_desc: "Specializovaná těžební mise zaměří nalezená ložiska asteroidů a získá použitelné kovy pro britský průmysl." # todo: NEW TRANSLATION
 ENG_asteroid_mining_heavy_operation: "Velkovýprava za těžbou" # todo: NEW TRANSLATION
 ENG_asteroid_mining_heavy_operation_desc: "Do pásu asteroidů je vyslána průmyslová těžební operace, která mobilizuje nejpokročilejší britské orbitální těžební prostředky." # todo: NEW TRANSLATION
 ENG_asteroid_mining_network_established: "Síť pro těžbu asteroidů vybudována" # todo: NEW TRANSLATION
 ENG_asteroid_mining_operation_active: "Těžba asteroidů probíhá" # todo: NEW TRANSLATION
 ENG_standardized_space_parts: "Standardizované vesmírné součástky" # todo: NEW TRANSLATION
 ENG_standardized_space_parts_desc: "Spojené království usiluje o standardizaci vesmírných součástek s cílem zpřístupnit průzkum vesmíru a snížit jeho náklady. Zjednodušení a standardizace komponent má učinit vesmírné projekty nákladově efektivnějšími a potvrdit odhodlání národa podporovat dostupné a hospodárné vesmírné aktivity." # todo: NEW TRANSLATION
 ENG_virgin_galactic: "Virgin Galactic" # todo: NEW TRANSLATION
 ENG_virgin_galactic_desc: "Virgin Galactic jako průkopník v oblasti vesmírného turismu usiluje o zpřístupnění kosmu všem. Díky inovativním kosmickým lodím a odhodlání posouvat hranice průzkumu vesmíru představuje Virgin Galactic britskou roli při utváření budoucnosti civilních vesmírných cest." # todo: NEW TRANSLATION
 ENG_british_commercial_spaceport: "Britský komerční kosmodrom" # todo: NEW TRANSLATION
 ENG_british_commercial_spaceport_desc: "S tím, jak se globální závod o kosmos zrychluje, si Spojené království uvědomuje nutnost zajistit si své postavení na hranici průzkumu vesmíru. Vybudování britského komerčního kosmodromu je klíčovým krokem k posílení postavení národa v komerčních vesmírných aktivitách. Investicemi do výstavby a rozvoje specializovaného kosmodromu chce Spojené království podporovat inovace, přilákat mezinárodní partnerství a posunout svůj letecký a kosmický průmysl na novou úroveň, aby si zajistilo slibnou budoucnost jako klíčový hráč na kosmické hranici." # todo: NEW TRANSLATION
 ENG_united_kingdom_space_command: "Vesmírné velitelství Spojeného království" # todo: NEW TRANSLATION
 ENG_united_kingdom_space_command_desc: "Jak se kosmos stává novou arénou strategického vlivu, Spojené království uznává nutnost sjednotit své úsilí ve vesmírných operacích. Zřízení Vesmírného velitelství Spojeného království je rozhodným krokem zaměřeným na sjednocení a posílení vesmírných schopností národa. Centralizací velení, podporou společných operací a investicemi do špičkových technologií se Spojené království snaží zajistit své zájmy v kosmické oblasti, vybudovat silnou přítomnost mezi hvězdami a chránit národní bezpečnost ve vesmírném věku." # todo: NEW TRANSLATION
 ENG_istari_programme: "Program ISTARI" # todo: NEW TRANSLATION
 ENG_istari_programme_desc: "V reakci na proměňující se globální prostředí zavádí Spojené království program ISTARI, ambiciózní iniciativu zaměřenou na zpravodajství, sledování, získávání cílů a průzkum v kybernetické oblasti." # todo: NEW TRANSLATION
 ENG_space_red_coats: "Vesmírní mušketýři" # todo: NEW TRANSLATION
 ENG_space_red_coats_desc: "Spojené království čerpá inspiraci ze své slavné minulosti a oživuje odkaz Rudokabátníků prostřednictvím vesmírných mušketýrů 21. století. Tato iniciativa, připomínající historickou odolnost, posouvá britský průzkum vesmíru do nové éry. V symbolické červené uniformě se Vesmírní rudokabátníci vydávají prozkoumávat kosmos, ztělesňují tradici objevování a promítají britský vliv napříč nebeským prostorem." # todo: NEW TRANSLATION
 ENG_1st_space_force_division: "1. divize vesmírných sil" # todo: NEW TRANSLATION
 ENG_1st_space_force_division_desc: "Spojené království vykračuje za hranice Země a vytváří britskou divizi vesmírných sil. Tento bezprecedentní krok ohlašuje novou éru, v níž Británie zřizuje svou první specializovanou vesmírnou divizi. Divize vesmírných sil, pověřená ochranou zájmů v kosmu a přijímáním neznáma, představuje odhodlání národa zkoumat a zabezpečit kosmickou hranici, kde bude mezi hvězdami vlát Union Jack." # todo: NEW TRANSLATION
 ENG_space_capabilities: "Kybernetické schopnosti" # todo: NEW TRANSLATION
 ENG_space_capabilities_desc: "Spojené království si uvědomuje zásadní význam digitální oblasti a zaměřuje se na posílení kybernetických schopností. V éře, kdy jsou informace mocí, tato iniciativa představuje odhodlání upevnit schopnosti národa v kybernetických operacích." # todo: NEW TRANSLATION
 ENG_strategic_defence_review: "Bílá kniha obrany [GetYear]" # todo: NEW TRANSLATION
 ENG_strategic_defence_review_desc: "Naše priority a hrozby se neustále mění a naše vojenská byrokracie se jim musí přizpůsobovat. Koordinací nové reakce na národní bezpečnost s partnery napříč vládou a našimi spojenci zajistíme, že naše armáda zůstane přizpůsobivá a připravená čelit hrozbám britské bezpečnosti." # todo: NEW TRANSLATION
 ENG_royal_army: "Královská armáda" # todo: NEW TRANSLATION
 ENG_royal_army_desc: "Zatímco existuje Královské námořnictvo a Královská vzdušná moc, naše armáda ještě královská není. Dejme jí takový název, který uctí její nejnovější úspěchy." # todo: NEW TRANSLATION
 ENG_AS90: "AS90 „Braveheart“" # todo: NEW TRANSLATION
 ENG_AS90_desc: "AS90, dělostřelecký systém pro devadesátá léta, známý také jako dělový systém 155 mm L131, je hlavní obrněná samohybná houfnice používaná britskou armádou. Byla navržena a vyrobena zbrojní divizí společnosti Vickers Shipbuilding and Engineering v letech 1982 až 1987, přičemž výroba následovala v roce 1992 a vzniklo 179 vozidel. Nahradila starší 105mm FV433 Abbot a starší 155mm samohybné dělo M109. Byly navrženy snahy o modernizaci AS90 tak, aby mohl používat delší hlaveň schopnou střílet granáty ráže 52, čímž by se zvýšil dostřel bez podpory a s municí s prodlouženým dosahem." # todo: NEW TRANSLATION
 ENG_operation_excellence: "Speciální velení" # todo: NEW TRANSLATION
 ENG_operation_excellence_desc: "Naše armáda je malá, ale profesionální a schopná síla, kterou lze rychle nasadit na domácí půdě k pomoci civilní moci a dalším vládním úřadům, kdykoli je to nutné. Tuto schopnost vnitřní bezpečnosti lze rozšířit a podpořit, aby Británie zůstala v bezpečí." # todo: NEW TRANSLATION
 ENG_utility_vehicle_modernisation: "Modernizace užitkových vozidel" # todo: NEW TRANSLATION
 ENG_utility_vehicle_modernisation_desc: "Zkušenosti ze Severního Irska během období Troubles jasně ukázaly, že současná vojenská užitková vozidla pěchoty používaná armádou, například Snatch Land Rover, poskytují jen malou nebo žádnou ochranu proti IED a minám. Zprávy o přežití dokonce uvádějí, že aktivně zhoršují stav přeživších prvotního výbuchu. Ministerstvo obrany proto začalo zkoumat možnosti nasazení moderních vozidel s pancéřováním odolným proti minám a chránícím proti přepadení, jako je americký MRAP „Cougar“." # todo: NEW TRANSLATION
 ENG_nlaw_anti_tank_system: "Protitankový systém NLAW" # todo: NEW TRANSLATION
 ENG_nlaw_anti_tank_system_desc: "SAAB Bofors Dynamics NLAW, známý také jako MBT LAW nebo R85, je lehký, jednorázový, z ramene odpalovaný protitankový raketový systém typu vystřel a zapomeň určený pro pěchotu. Byl navržen společností SAAB pro britské a švédské ministerstvo obrany ve Spojeném království v rámci týmu NLAW, na němž se podíleli různí subdodavatelé včetně společnosti Thales Air Defences." # todo: NEW TRANSLATION
 ENG_startstreak_anti_air_system: "Protiletadlový systém Starstreak" # todo: NEW TRANSLATION
 ENG_startstreak_anti_air_system_desc: "Starstreak je britská protiletadlová střela krátkého dosahu, používaná jako přenosný protiletadlový systém i v různých konfiguracích na vrtulnících a vozidlech pro mobilní krytí. Vyrábí ji společnost Thales Air Defence v Belfastu v Severním Irsku. Po odpálení střela zrychlí na rychlost vyšší než Mach 4, čímž se stává nejrychlejší protiletadlovou střelou krátkého dosahu na světě. Její potenciál dále zvyšuje skutečnost, že na cíl vypouští tři laserem naváděné submunice, čímž zvyšuje pravděpodobnost zásahu." # todo: NEW TRANSLATION
 ENG_M270: "Rekapitalizace M270" # todo: NEW TRANSLATION
 ENG_M270_desc: "Ministerstvo obrany plánuje investovat do obnovy pásových raketometů M270 a různých typů střel, které jsou ve službě, aby doplnily nákup munice pro systém Guided Launch Rocket System. Záměrem je zavést nové motory, pancéřovou ochranu a modernizované systémy řízení palby." # todo: NEW TRANSLATION
 ENG_mobile_fires_platform_program: "Program mobilní palebné platformy" # todo: NEW TRANSLATION
 ENG_mobile_fires_platform_program_desc: "Po skončení studené války a ústupu očekávání konfliktu na německých pláních se zásoby 155mm dělostřeleckých systémů britské armády zmenšily. Nyní, s novými hrozbami na obzoru, se ministerstvo obrany rozhodlo podniknout kroky k obnovení této schopnosti. O zakázku se uchází řada kandidátů, z nichž uspěje pouze jeden." # todo: NEW TRANSLATION
 ENG_fres_program: "Program FRES" # todo: NEW TRANSLATION
 ENG_fres_program_desc: "Program FRES (Future Rapid Effect System) představuje pokrokový přístup k rozvoji vojenských schopností. Zaměřuje se na obratnost a přizpůsobivost a jeho cílem je poskytnout britským ozbrojeným silám všestrannou řadu pozemních platforem včetně obrněných vozidel a podpůrných systémů." # todo: NEW TRANSLATION
 ENG_fix_civil_servant: "Oprava „úředníka“" # todo: NEW TRANSLATION
 ENG_fix_civil_servant_desc: "Puška L85A1, původně sužovaná častými stížnostmi a problémy s výkonem mezi vojáky, prošla rozsáhlou modernizací kvůli obtížné údržbě a nespolehlivému provozu. Tyto obavy, kvůli nimž byla puška často označována jako „úředník“ pro svou vnímanou nespolehlivost a složitou funkčnost, vedly k významné přestavbě v letech 2000 až 2002. Modernizováno bylo přibližně 200 000 z tehdejších 320 000 automatických pušek L85A1." # todo: NEW TRANSLATION
 ENG_modern_littoral_force: "Moderní pobřežní síly" # todo: NEW TRANSLATION
 ENG_modern_littoral_force_desc: "Britské moderní pobřežní síly jsou strategickou iniciativou zdůrazňující námořní schopnosti v pobřežních oblastech. Tyto modernizované síly vedené Spojeným královstvím integrují pokročilé námořní technologie, všestranná plavidla a schopnosti rychlé reakce, aby zajistily námořní převahu v pobřežním prostředí. Zaměření na obratnost a přizpůsobivost zvyšuje schopnost Spojeného království chránit pobřežní zájmy, reagovat na nové hrozby a přispívat k regionální stabilitě." # todo: NEW TRANSLATION
 ENG_trident_nuclear_program: "Jaderný program Trident" # todo: NEW TRANSLATION
 ENG_trident_nuclear_program_desc: "Program Trident představuje nepřetržité britské jaderné odstrašení na moři, založené na ponorkách třídy Vanguard vyzbrojených balistickými střelami Trident II D5. Tato strategická iniciativa řízená ze zařízení v Aldermastonu a Burghfieldu zdůrazňuje odhodlání národa udržovat pružnou a účinnou obrannou schopnost." # todo: NEW TRANSLATION
 ENG_mothballing_operations: "Operace zakonzervování" # todo: NEW TRANSLATION
 ENG_mothballing_operations_desc: "Britská vláda v reakci na finanční omezení volí pragmatickou cestu zakonzervování námořních lodí. Toto rozhodnutí se setkává s výhradami námořního průmyslu, zejména společnosti BAE. Krok má šetřit zdroje, ale v průmyslu vyvolává obavy z možných dopadů na výrobu a pracovní sílu." # todo: NEW TRANSLATION
 ENG_general_dynamics_ajax: "General Dynamics Ajax" # todo: NEW TRANSLATION
 ENG_general_dynamics_ajax_desc: "General Dynamics Ajax, nejmodernější průzkumné vozidlo, se stal základním kamenem modernizačního úsilí britských ozbrojených sil. Toto obratné a pokročilé obrněné vozidlo navržené podle náročných potřeb moderní války integruje špičkové technologie a poskytuje bezkonkurenční průzkumné schopnosti." # todo: NEW TRANSLATION
 ENG_challenger_lethality_improvement_programme: "Program zvýšení účinnosti Challengeru" # todo: NEW TRANSLATION
 ENG_challenger_lethality_improvement_programme_desc: "Program zvýšení účinnosti Challengeru měl nahradit současný drážkovaný kanon L30A1 hladkým kanonem Rheinmetall ráže 120 mm, který se používá na tancích Leopard 2 a M1 Abrams. Hladký kanon by Challengeru 2 umožnil používat standardní munici NATO včetně wolframových penetrátorů kinetické energie, které nemají stejné politické a ekologické nevýhody jako náboje s ochuzeným uranem." # todo: NEW TRANSLATION
 ENG_challenger_3: "Challenger 3" # todo: NEW TRANSLATION
 ENG_challenger_3_desc: "Tank Challenger 3, hrdě vyvinutý Spojeným královstvím, představuje špičku obrněného válčení. Díky nejmodernějším technologiím, ničivé palebné síle a vylepšené ochraně zajišťuje Challenger 3 převahu na bojišti. Tento modernizovaný tank zdůrazňuje odhodlání Spojeného království udržovat silné obrněné jednotky připravené čelit výzvám současné války." # todo: NEW TRANSLATION
 ENG_modern_landing_craft: "Moderní výsadková plavidla" # todo: NEW TRANSLATION
 ENG_modern_landing_craft_desc: "Spojené království v rámci svého trvalého úsilí o posílení námořních schopností pokračuje v modernizačních iniciativách včetně investic do nových výsadkových plavidel. V souladu s programem Future Commando Force chce Spojené království posílit své obojživelné síly, zejména Royal Marines, a zajistit jejich vyšší účinnost v pobřežních a obojživelných operacích." # todo: NEW TRANSLATION
 ENG_mechanised_amphibious_assault: "Mechanizovaný obojživelný útok" # todo: NEW TRANSLATION
 ENG_mechanised_amphibious_assault_desc: "Spojené království s důrazem na přizpůsobivost a rychlost vytváří komplexní doktrínu mechanizovaného obojživelného útoku. Tato strategie založená na součinnosti Royal Marines a Royal Navy využívá specializovaná obojživelná útočná vozidla a výsadková plavidla k rychlému nasazení na pobřeží. Integrované velení a řízení, letecká podpora a nasazení specializovaných obojživelných výsadkových lodí zdůrazňují odhodlání Spojeného království udržovat silné a všestranné síly připravené na různé scénáře díky intenzivnímu výcviku a cvičením." # todo: NEW TRANSLATION
 ENG_aircraft_ai_integration: "Integrace umělé inteligence do letadel" # todo: NEW TRANSLATION
 ENG_aircraft_ai_integration_desc: "Spojené království vedené zásadou kvality nad kvantitou upřednostňuje ve svých ozbrojených silách výjimečnost a technologickou převahu. Tento národní duch zdůrazňuje pořizování pokročilého a sofistikovaného vybavení, které zajistí silnou a technologicky vyspělou obranu. Zaměřením na kvalitu chce Spojené království maximalizovat účinnost svých sil a vytvořit strategickou výhodu tváří v tvář moderním výzvám." # todo: NEW TRANSLATION
 ENG_strike_brigades: "Úderné brigády" # todo: NEW TRANSLATION
 ENG_strike_brigades_desc: "V reakci na vyvíjející se hrozby Spojené království zřizuje britské úderné brigády, všestranné a rychle nasaditelné jednotky určené pro obratné pozemní operace. Tyto brigády složené z pěchoty, obrněných jednotek a dělostřelectva ztělesňují odhodlání národa rychle a pružně reagovat vojenskými prostředky. Zaměření na úderné brigády posiluje schopnost Spojeného království promítat sílu a účinně reagovat na dynamické a rozmanité bezpečnostní výzvy." # todo: NEW TRANSLATION
 ENG_future_soldier_armed_forces: "Ozbrojené síly budoucího vojáka" # todo: NEW TRANSLATION
 ENG_future_soldier_armed_forces_desc: "Iniciativa Future Soldier představuje pokrokovou strategii přijatou ozbrojenými silami včetně Spojeného království. Zaměřuje se na vybavení vojáků špičkovými technologiemi a schopnostmi, které zvyšují jejich účinnost na moderním bojišti." # todo: NEW TRANSLATION
 ENG_joint_expeditionary_force: "Společné expediční síly" # todo: NEW TRANSLATION
 ENG_joint_expeditionary_force_desc: "Společné expediční síly (JEF), které vznikly v roce 2012 z iniciativy tehdejšího náčelníka generálního štábu generála sira Davida Richardse, vzešly z rozpuštění Společných sil rychlé reakce v době, kdy se Spojené království soustředilo na operace v Afghánistánu a Iráku. Britská část JEF, složená z personálu a vybavení Royal Navy, Royal Marines, britské armády a Royal Air Force, klade důraz na hlubší integraci. Ta se projevuje zejména při spolupráci s ozbrojenými silami jiných zemí a představuje významný odklon od předchozích modelů." # todo: NEW TRANSLATION
 ENG_carrier_group_debate: "Debata o skupinách letadlových lodí" # todo: NEW TRANSLATION
 ENG_carrier_group_debate_desc: "Úderná uskupení letadlových lodí jsou nezbytnou součástí moderního námořnictva. Musíme prodiskutovat nejlepší způsob jejich vytvoření." # todo: NEW TRANSLATION
 ENG_worldwide_reach: "Celosvětový dosah" # todo: NEW TRANSLATION
 ENG_worldwide_reach_desc: "Spojené království bylo kdysi velmocí s dosahem po celém světě, který chránil jeho zájmy. Musíme se k této síle vrátit, abychom udrželi své zájmy po celé planetě." # todo: NEW TRANSLATION
 ENG_national_service_debate: "Debata o národní službě" # todo: NEW TRANSLATION
 ENG_national_service_debate_desc: "Armáda založená na dobrovolnících nedokáže držet krok s rostoucí poptávkou po britských vojácích po celém světě. Musíme rozšířit odvody, abychom tuto potřebu pokryli." # todo: NEW TRANSLATION
 ENG_army_special_operations_brigade: "Armádní brigáda speciálních operací" # todo: NEW TRANSLATION
 ENG_army_special_operations_brigade_desc: "Armádní brigáda speciálních operací představuje vrchol vojenských schopností Spojeného království a je určena k provádění tajných a náročných misí. Tato elitní brigáda složená z výjimečného personálu z různých složek působí s bezkonkurenční přesností a přizpůsobivostí. Vybavena špičkovými technologiemi a podrobena náročnému výcviku je připravena k protiteroristickým operacím, získávání zpravodajských informací a dalším operacím s vysokým dopadem, čímž upevňuje svou úlohu klíčového prvku obrany a bezpečnosti země." # todo: NEW TRANSLATION
 ENG_reestablish_far_east_command: "Obnovit velení na Dálném východě" # todo: NEW TRANSLATION
 ENG_reestablish_far_east_command_desc: "Obnovení velení na Dálném východě představuje strategické přeorientování britských snah na posílení vojenských schopností v tomto klíčovém regionu. Iniciativa zahrnuje rozmístění velitelských struktur, operačních jednotek a logistické podpory s cílem účinně reagovat na měnící se bezpečnostní prostředí. Posílením přítomnosti a koordinace na Dálném východě chtějí britské ozbrojené síly pružně reagovat na regionální výzvy, rozvíjet partnerství se spojenci a významně přispět k celkové stabilitě této strategicky důležité části světa." # todo: NEW TRANSLATION
 ENG_britannia_armed_forces: "Ozbrojené síly Britannia" # todo: NEW TRANSLATION
 ENG_britannia_armed_forces_desc: "Díky našemu úsilí o obnovení světové vojenské moci nyní konečně můžeme říci, že máme armádu schopnou bránit britské zájmy po celém světě." # todo: NEW TRANSLATION
 ENG_allied_basing_efforts: "Úsilí o spojenecké základny" # todo: NEW TRANSLATION
 ENG_allied_basing_efforts_desc: "Iniciativa spojeneckých základen představuje jednotný závazek posílit strategické schopnosti členských zemí aliance. V jejím rámci Spojené království těží z trvalého a významného zlepšení infrastruktury včetně železnic, leteckých základen, přístavů a dalších zařízení. Toto dlouhodobé posílení zvyšuje logistické schopnosti Spojeného království i celkovou operační účinnost." # todo: NEW TRANSLATION
 ENG_reactivate_naval_defense_act_1889: "Obnovit zákon o námořní obraně z roku 1889" # todo: NEW TRANSLATION
 ENG_reactivate_naval_defense_act_1889_desc: "Obnovení zákona o námořní obraně z roku 1889 je symbolickým odkazem na historickou námořní velikost a zároveň pokrokovým závazkem k posílení námořních schopností. Tato legislativa má přenést ducha minulosti do moderní námořní připravenosti. Oživením principů původního zákona Spojené království potvrzuje své odhodlání udržovat silné a technologicky vyspělé námořnictvo. Zákon může zahrnovat modernizaci námořních prostředků, rozšíření námořní infrastruktury a strategické investice, které zajistí, že Royal Navy zůstane významnou silou na světové scéně." # todo: NEW TRANSLATION
 ENG_royal_navy: "Royal Navy" # todo: NEW TRANSLATION
 ENG_royal_navy_desc: "Britské Royal Navy patří mezi přední námořní síly světa a pyšní se slavnou tradicí sahající několik staletí do minulosti. Royal Navy, známé svou přizpůsobivostí a technologickou vyspělostí, hraje klíčovou úlohu při ochraně námořních zájmů Spojeného království a při promítání jeho moci po celém světě." # todo: NEW TRANSLATION
 ENG_dartmouth_naval_college_expansion: "Rozšíření námořní akademie v Dartmouthu" # todo: NEW TRANSLATION
 ENG_dartmouth_naval_college_expansion_desc: "Rozšíření námořní akademie v Dartmouthu představuje významnou investici do námořního vzdělávání a výcviku ve Spojeném království. Na základě bohaté námořní tradice akademie počítá projekt s nejmodernějším vybavením, pokročilými výcvikovými programy a zvýšenou kapacitou pro rostoucí poptávku po kvalifikovaném námořním personálu." # todo: NEW TRANSLATION
 ENG_british_foreign_legion: "Britská cizinecká legie" # todo: NEW TRANSLATION
 ENG_british_foreign_legion_desc: "Tato legie přijímá model mezinárodní služby a vítá cizí státní příslušníky, kteří chtějí sloužit v britské armádě. Britská cizinecká legie, vytvořená k podpoře kamarádství, rozmanitosti a společného cíle, představuje jedinečnou možnost pro lidi z různých prostředí přispět k obraně Spojeného království." # todo: NEW TRANSLATION
 ENG_multi_ocean_navy: "Víceoceánské námořnictvo" # todo: NEW TRANSLATION
 ENG_multi_ocean_navy_desc: "Abychom mohli chránit britské zájmy po celém světě, musíme posílit své námořní schopnosti a být schopni zasahovat napříč oceány." # todo: NEW TRANSLATION
 ENG_Strategic_Aircraft_Training: "Výcvik strategického letectva" # todo: NEW TRANSLATION
 ENG_Strategic_Aircraft_Training_desc: "V moderní době je nutné mít letectvo schopné zasahovat napříč všemi oceány. Musíme rozšířit své operace strategického letectva, abychom tuto možnost získali." # todo: NEW TRANSLATION
 ENG_field_army_expansion: "Rozšíření polní armády" # todo: NEW TRANSLATION
 ENG_field_army_expansion_desc: "Iniciativa rozšíření polní armády představuje strategický závazek Spojeného království posílit pozemní síly a zajistit robustní a přizpůsobivou vojenskou schopnost. Rozšíření zahrnuje zvýšení početního stavu a schopností polní armády, tedy hlavních pozemních sil britské armády." # todo: NEW TRANSLATION
 ENG_type_31_frigate_inspiration_class: "Fregata typu 31 třídy Inspiration" # todo: NEW TRANSLATION
 ENG_type_31_frigate_inspiration_class_desc: "Typ 31 představuje víceúčelovou polovinu fregatového loďstva. V roce 2019 byl objednán za pevnou cenu 250 milionů liber za loď. Společnost Babcock staví všech pět plavidel v Rosyth podle konstrukce Arrowhead 140, odvozené od dánské třídy Iver Huitfeldt. Jde o velký dieselelektrický trup s kanonem Bofors ráže 57 mm, systémem Sea Ceptor a záměrně ponechanou rezervou pro pozdější modernizaci. Lodě Inspiration, Active, Bulldog, Campbeltown a Formidable obnovují jména z různých období historie loďstva." # todo: NEW TRANSLATION
 ENG_type_32_frigate_guardian_class: "Fregata typu 32 třídy Guardian" # todo: NEW TRANSLATION
 ENG_type_32_frigate_guardian_class_desc: "Fregata typu 32 je připravovaná fregata Spojeného království pro Royal Navy. V listopadu 2020 ji v rámci Integrovaného přezkumu oficiálně oznámil premiér Boris Johnson. Loď stavěná po fregatách typu 26 a 31 bude víceúčelová a modulární a očekává se, že pomůže rozšířit eskortní loďstvo Royal Navy." # todo: NEW TRANSLATION
 ENG_queen_elizabeth_class_carrier: "Letadlová loď třídy Queen Elizabeth" # todo: NEW TRANSLATION
 ENG_queen_elizabeth_class_carrier_desc: "Letadlové lodě třídy Queen Elizabeth představovaly vrchol britského námořního letectví a znamenaly zásadní skok ve schopnostech letadlových lodí. Tyto kolosy posílily námořní projekci Spojeného království a díky pokročilým technologiím, kapacitě letadel a rozsáhlému operačnímu dosahu ztělesnily modernitu a upevnily globální obranné postavení národa." # todo: NEW TRANSLATION
 ENG_multi_role_support_ship_project: "Projekt víceúčelové podpůrné lodě" # todo: NEW TRANSLATION
 ENG_multi_role_support_ship_project_desc: "Víceúčelová podpůrná loď je zamýšlenou náhradou za lodě Albion, Bulwark a třídu Bay v jediném flexibilním trupu. Namísto dokové lodi určené pro jedno velké vylodění je navržena kolem modifikovatelného prostoru, letové paluby a modulárního ubytování. Stejné plavidlo tak může přepravovat přepadovou jednotku commandos, provádět operace humanitární pomoci nebo sloužit jako předsunutá základna pro bezpilotní systémy." # todo: NEW TRANSLATION
 ENG_expanded_carrier_wing_procurement: "Nákup rozšířeného leteckého křídla letadlových lodí" # todo: NEW TRANSLATION
 ENG_expanded_carrier_wing_procurement_desc: "Investicemi do rozšířeného leteckého křídla letadlových lodí chce Spojené království promítat svou moc, chránit námořní zájmy a významně přispívat k mezinárodní bezpečnosti. Tato iniciativa odráží odhodlání národa udržovat moderní a schopné námořní letectvo v rychle se měnícím globálním bezpečnostním prostředí." # todo: NEW TRANSLATION
 ENG_strategic_aircraft_strategy: "Strategie strategického letectva" # todo: NEW TRANSLATION
 ENG_strategic_aircraft_strategy_desc: "Strategie strategického letectva vymezuje přístup Spojeného království k pořizování, nasazování a využívání strategických leteckých prostředků. Komplexní strategie zahrnuje národní obranné priority, globální bezpečnostní výzvy a technologický pokrok." # todo: NEW TRANSLATION
 ENG_continent_operational_considerations: "Operační úvahy pro kontinent" # todo: NEW TRANSLATION
 ENG_continent_operational_considerations_desc: "Musíme upřednostnit svůj závazek vůči ozbrojeným silám a spojencům. Proto musíme vybrat složku armády, na kterou se specializujeme." # todo: NEW TRANSLATION
 ENG_astute_class: "Ponorka třídy Astute" # todo: NEW TRANSLATION
 ENG_astute_class_desc: "Třída Astute je nejnovější třídou jaderných útočných ponorek ve službě Royal Navy. Ponorky staví BAE Systems Submarines v Barrow-in-Furness." # todo: NEW TRANSLATION
 ENG_type_45_destroyer_upgrades: "Modernizace torpédoborců typu 45" # todo: NEW TRANSLATION
 ENG_type_45_destroyer_upgrades_desc: "Projekt modernizace torpédoborců typu 45 má prostřednictvím pokročilých technologií a vylepšení systémů zvýšit schopnosti těchto plavidel Royal Navy. Mezi hlavní oblasti patří radar, bojové systémy, pohon a protiraketová obrana." # todo: NEW TRANSLATION
 ENG_dreadnought_class: "Ponorka třídy Dreadnought" # todo: NEW TRANSLATION
 ENG_dreadnought_class_desc: "Projekt ponorek třídy Dreadnought zahrnuje návrh, konstrukci a integraci balistických ponorek nové generace pro Royal Navy. Tyto ponorky budou vybaveny pokročilým stealth, pohonem a strategickými zbraňovými schopnostmi, které zajistí důvěryhodné jaderné odstrašení Spojeného království." # todo: NEW TRANSLATION
 ENG_type_26_frigate: "Fregata typu 26" # todo: NEW TRANSLATION
 ENG_type_26_frigate_desc: "Typ 26, pojmenovaný po Glasgow, Cardiffu, Belfastu a jejich sesterských městech jako třída City, představuje protiponorkovou polovinu fregatového loďstva. Staví jej BAE Systems na Clyde od roku 2017 a jeho konstrukce je zaměřena na akustické ztišení: na základně uložený dieselelektrický a plynový turbínový pohon, vlečný sonar 2087 a uprostřed lodi umístěný modulární prostor pro čluny, kontejnery a bezpilotní systémy. Osm lodí bude doprovázet letadlové lodě a síly jaderného odstrašení, další trupy byly prodány Austrálii a Kanadě." # todo: NEW TRANSLATION
 ENG_type_83_destroyer: "Torpédoborec typu 83" # todo: NEW TRANSLATION
 ENG_type_83_destroyer_desc: "Torpédoborec typu 83 je připravovaná třída torpédoborců s řízenými střelami, která má vstoupit do služby Royal Navy v polovině až na konci 30. let. Navrhovaná třída slibuje pokročilé schopnosti a modernizované prvky, aby splnila vyvíjející se požadavky námořnictva. Torpédoborec typu 83, navržený s ohledem na všestrannost a účinnost, představuje zásadní posun v námořních schopnostech Royal Navy a zajistí připravenost i účinnost v budoucích operačních prostředích." # todo: NEW TRANSLATION
 ENG_qinetiq_dragonfire_system: "Systém QinetiQ Dragonfire" # todo: NEW TRANSLATION
 ENG_qinetiq_dragonfire_system_desc: "Dragonfire představuje špičkový britský demonstrátor laserové zbraně s řízenou energií. Byl představen na konferenci Defence and Security Equipment International v Londýně v roce 2017 a vyvíjí jej UK Dragonfire, společné úsilí společností MBDA UK, Leonardo UK, QinetiQ a Defence Science and Technology Laboratory. Jako klíčový technologický demonstrátor projde Dragonfire důkladným testováním zaměřeným na vyhodnocení laserových zbraní s řízenou energií a jejich možného využití v britských ozbrojených silách, což představuje významný pokrok ve vojenských inovacích a rozvoji schopností." # todo: NEW TRANSLATION
 ENG_auxiliary_royal_navy: "Pomocné Royal Navy" # todo: NEW TRANSLATION
 ENG_auxiliary_royal_navy_desc: "Pomocné Royal Navy historicky označuje lodě s civilní posádkou, které v době konfliktu nebo krize podporují a doplňují operace Royal Navy." # todo: NEW TRANSLATION
 ENG_revitalise_merchant_navy: "Obnovit obchodní loďstvo" # todo: NEW TRANSLATION
 ENG_revitalise_merchant_navy_desc: "Britské impérium bylo kdysi založeno na obchodu a naše globální obchodní loďstvo je naší slávou i základem. Nechme naše obchodní loďstvo znovu rozšířit své působení po celém světě." # todo: NEW TRANSLATION
 ENG_bay_slass_landing_ships: "Výsadkové lodě třídy Bay" # todo: NEW TRANSLATION
 ENG_bay_slass_landing_ships_desc: "Výsadkové lodě třídy Bay jsou všestranná obojživelná plavidla určená k podpoře řady vojenských operací včetně humanitární pomoci, odstraňování následků katastrof a obojživelných útoků. Tato plavidla mají velkou letovou palubu a dok pro vypouštění a vyzvedávání výsadkových člunů a obojživelných vozidel." # todo: NEW TRANSLATION
 ENG_river_class_patrol_boat: "Hlídkový člun třídy River" # todo: NEW TRANSLATION
 ENG_river_class_patrol_boat_desc: "Hlídkové čluny třídy River slouží jako všestranná oceánská hlídková plavidla využívaná k námořní bezpečnosti, ochraně hranic a prosazování práva. Díky pokročilým sledovacím a komunikačním systémům účinně hlídkují pobřežní vody a chrání územní celistvost i námořní zájmy. Plavidla třídy River navržená s ohledem na vytrvalost a pružnost hrají klíčovou úlohu při zvyšování námořní bezpečnosti a prosazování námořního práva ve vodách Spojeného království i mimo ně." # todo: NEW TRANSLATION
 ENG_point_class_sealift_ships: "Námořní transportní lodě třídy Point" # todo: NEW TRANSLATION
 ENG_point_class_sealift_ships_desc: "Námořní transportní lodě třídy Point jsou důležitou součástí Royal Fleet Auxiliary a slouží k přepravě vojenského nákladu a vybavení na podporu expedičních operací. Tato plavidla typu roll-on/roll-off mají všestranné možnosti manipulace s nákladem a umožňují účinné nakládání a vykládání vozidel a zásob v různých přístavech a námořních prostředích. Díky strategické přepravní kapacitě významně přispívají k logistickým schopnostem Spojeného království a usnadňují rychlé nasazení vojsk a vybavení v době míru i konfliktu." # todo: NEW TRANSLATION
 ENG_type_23_lifex: "Prodloužení životnosti typu 23" # todo: NEW TRANSLATION
 ENG_type_23_lifex_desc: "Fregata typu 23 byla navržena na životnost trupu osmnáct let, avšak v polovině 00. let představovalo šestnáct přeživších lodí celé eskortní loďstvo. Program prodloužení životnosti, všeobecně známý jako LIFEX, postupně provedl každý trup kompletní opravou v Devonportu: nové dieselové generátory a převodovky, obnovu konstrukce, radar Artisan typu 997 namísto typu 996 a systém Sea Ceptor jako náhradu za Sea Wolf. Práce prodloužily službu jednotlivých lodí nad třicet let a poskytly Royal Navy desetiletí potřebné k návrhu nástupce." # todo: NEW TRANSLATION
 ENG_future_surface_combatant: "Budoucí hladinový bojový prostředek" # todo: NEW TRANSLATION
 ENG_future_surface_combatant_desc: "Program Future Surface Combatant, zahájený v roce 1998 a více než jednou restrukturalizovaný, se pokoušel definovat nástupce typů 22 a 23. Prošel studiemi Sustained Surface Combatant Capability a koncepty C1, C2 a C3 — protiponorkovou lodí, víceúčelovou lodí a oceánským hlídkovým plavidlem — než se sjednotil na jediném flexibilním trupu nabízeném jako Global Combat Ship. Každá britská fregata navržená později vychází z předpokladů stanovených zde." # todo: NEW TRANSLATION
 ENG_ark_royal_class_carrier: "Letadlová loď třídy Ark Royal" # todo: NEW TRANSLATION
 ENG_ark_royal_class_carrier_desc: "S loděmi Queen Elizabeth a Prince of Wales ve službě vyvstává otázka, co přijde po nich. Třetí trup postavený podle upraveného návrhu by ukončil situaci, kdy loďstvo zůstává bez úderné letadlové lodi pokaždé, když jedno plavidlo vstoupí do dlouhodobé údržby. Zároveň by nesl jméno, které v minulosti neslo pět britských válečných lodí, naposledy loď třídy Invincible vyřazená v roce 2011." # todo: NEW TRANSLATION
 ENG_type_45_daring_class: "Torpédoborec typu 45 třídy Daring" # todo: NEW TRANSLATION
 ENG_type_45_daring_class_desc: "Typ 45, objednaný poté, co Británie v roce 1999 opustila trilaterální program fregat Horizon, byl postaven kolem systému Sea Viper, víceúčelového radaru Sampson umístěného na vrcholu stožáru a dálkového radaru S1850M. V letech 2003 až 2013 bylo v loděnicích Govan, Scotstoun a Portsmouth sestaveno šest lodí, které nahradily typ 42. Daring a Dauntless vedou třídu a společně poskytují Royal Navy nejschopnější platformu oblastní protivzdušné obrany, jakou kdy provozovalo." # todo: NEW TRANSLATION
 ENG_aukus_programme: "Program AUKUS" # todo: NEW TRANSLATION
 ENG_aukus_programme_desc: "Partnerství AUKUS oznámené v září 2021 zavazuje Spojené království, Spojené státy a Austrálii ke společné jaderné útočné ponorce. Konstrukce SSN-AUKUS je vedena Brity a vychází ze studií nástupce třídy Astute. Kombinuje reaktorový systém Rolls-Royce s americkými bojovými systémy a vertikálními odpalovacími zařízeními. Stavba je rozdělena mezi Barrow-in-Furness a Osborne, čímž propojuje tři průmyslové základny do jediné výrobní linie pro zbytek století." # todo: NEW TRANSLATION
 ENG_albion_class_lpd: "Výsadková doková loď třídy Albion" # todo: NEW TRANSLATION
 ENG_albion_class_lpd_desc: "Program náhrady výsadkových dokových lodí přinesl HMS Albion a HMS Bulwark, uvedené do služby v letech 2003 a 2004 místo dosluhujících lodí Fearless a Intrepid. Každá loď nese zaplavovací dok pro čtyři výsadkové čluny, vozidlovou palubu, letovou palubu schopnou přijmout dva střední vrtulníky a velitelské prostory pro štáb obojživelného uskupení. Právě z těchto platforem vysazují Royal Marines brigádu na pobřeží." # todo: NEW TRANSLATION
 ENG_royal_marines_future_commando_force: "Budoucí síly commandos" # todo: NEW TRANSLATION
 ENG_royal_marines_future_commando_force_desc: "Program Future Commando Force odklání 3. brigádu commandos od masového obojživelného útoku směrem k trvalým předsunutým nájezdům. Commandos operují v malých soběstačných týmech, působí z upravených pomocných a pobřežních úderných lodí namísto předmostí a jsou vybaveni k průzkumu, sabotáži a obsazování klíčových námořních prostorů. Jde o největší změnu doktríny Royal Marines od druhé světové války." # todo: NEW TRANSLATION
 ENG_royal_marines_littoral_response_group: "Pobřežní zásahové uskupení" # todo: NEW TRANSLATION
 ENG_royal_marines_littoral_response_group_desc: "Dvě pobřežní zásahová uskupení, jedno v euroatlantickém prostoru a druhé východně od Suezu, udržují rotu commandos a její lodě trvale na moři. Založená na dokové lodi třídy Albion a pomocných plavidlech třídy Bay poskytují stálou schopnost evakuace, pomoci při katastrofách, výcviku s partnerskými silami a nájezdů. K dispozici jsou během několika dnů, nikoli týdnů potřebných ke shromáždění celého uskupení." # todo: NEW TRANSLATION
 ENG_royal_marines_arctic_warfare_centre: "Centrum arktického válčení" # todo: NEW TRANSLATION
 ENG_royal_marines_arctic_warfare_centre_desc: "Británie od 70. let plní závazek NATO vůči severnímu křídlu v chladném počasí a každou zimu vysílá 3. brigádu commandos do Bardufossu a Porsangmoenu. Formalizace tohoto sezónního nasazení do stálého výcvikového zařízení zachová kádr instruktorů lyžování a horského vedení, posádky pásových vozidel i instruktory přežití a udrží Royal Marines jako hlavní formaci aliance pro operace za polárním kruhem." # todo: NEW TRANSLATION
 ENG_bae_cv90_MkIV: "BAE CV90 Mk IV" # todo: NEW TRANSLATION
 ENG_bae_cv90_MkIV_desc: "BAE CV90 Mk IV je modernizovaná verze bojového vozidla pěchoty CV90, vybavená pokročilými technologiemi a vylepšeními pro moderní válku. Nabízí lepší pohyblivost, přežitelnost a palebnou sílu, což z něj činí impozantní prostředek obrněných pěchotních jednotek na bojišti." # todo: NEW TRANSLATION
 ENG_expand_sandhurst_academy: "Rozšířit akademii v Sandhurstu" # todo: NEW TRANSLATION
 ENG_expand_sandhurst_academy_desc: "Royal Military Academy Sandhurst (RMAS) patří mezi přední vojenské výcvikové instituce na světě. Je proslulá náročnými programy a odhodláním vychovávat výjimečné vojenské vůdce. RMAS byla založena v roce 1802 a slouží jako hlavní důstojnická výcviková instituce britské armády i několika mezinárodních spojenců a partnerů." # todo: NEW TRANSLATION
 ENG_soldier_welfare_initiative: "Iniciativa péče o vojáky" # todo: NEW TRANSLATION
 ENG_soldier_welfare_initiative_desc: "Upřednostněním péče o naše vojáky a jejich rodiny tato iniciativa dokazuje náš závazek ctít jejich službu a oběti a zároveň budovat podpůrnou a odolnou vojenskou komunitu." # todo: NEW TRANSLATION
 ENG_mgcs_program: "Program MGCS" # todo: NEW TRANSLATION
 ENG_mgcs_program_desc: "Main Ground Combat System (MGCS) je program obrněného bojového vozidla nové generace určený k poskytnutí pokročilých schopností pozemním silám v podmínkách moderní války. MGCS jako společné úsilí Německa a Francie usiluje o vývoj všestranného a technologicky vyspělého hlavního bojového tanku schopného účinně působit v různorodém prostředí bojiště." # todo: NEW TRANSLATION
 ENG_royal_airforce_modernisation: "Modernizace Royal Air Force" # todo: NEW TRANSLATION
 ENG_royal_airforce_modernisation_desc: "Modernizací RAF Royal Air Force znovu potvrzuje svůj závazek udržovat vzdušnou převahu, promítat sílu a chránit národní zájmy ve stále složitějším a spornějším globálním bezpečnostním prostředí." # todo: NEW TRANSLATION
 ENG_watchkeeper_wk450: "Watchkeeper WK450" # todo: NEW TRANSLATION
 ENG_watchkeeper_wk450_desc: "Watchkeeper WK450 je pokročilý bezpilotní letecký systém určený k průzkumu, sledování a získávání zpravodajských informací. Tento UAV střední výškové kategorie s dlouhou vytrvalostí vyvinutý společností Thales Group nabízí řadu sofistikovaných senzorů a kamer pro sledování v reálném čase a získávání cílů. Díky dlouhé vytrvalosti a autonomnímu letu poskytuje Watchkeeper WK450 ozbrojeným silám lepší situační povědomí a schopnost shromažďovat klíčové informace v různých operačních prostředích." # todo: NEW TRANSLATION
 ENG_reaper_purchase: "Nákup Reaperů" # todo: NEW TRANSLATION
 ENG_reaper_purchase_desc: "Ozbrojené síly po celém světě pořizují MQ-9 Reaper ke zlepšení průzkumných, sledovacích a zpravodajských schopností a k provádění přesných úderů proti vysoce hodnotným cílům. Schopnost Reaperu dlouhodobě kroužit nad cílovými oblastmi a jeho pokročilá senzorová výbava z něj činí cenný prostředek pro získávání zpravodajských informací v reálném čase a podporu pozemních sil." # todo: NEW TRANSLATION
 ENG_missile_development: "Vývoj raket" # todo: NEW TRANSLATION
 ENG_missile_development_desc: "Musíme modernizovat své raketové schopnosti, abychom zůstali moderním letectvem." # todo: NEW TRANSLATION
 ENG_electronic_warfare_measures: "Opatření elektronického válčení" # todo: NEW TRANSLATION
 ENG_electronic_warfare_measures_desc: "Musíme modernizovat naše výpočetní systémy, abychom zůstali v bezpečí před kybernetickými útoky." # todo: NEW TRANSLATION
 ENG_nato_joint_airforce_training: "Společný letecký výcvik NATO" # todo: NEW TRANSLATION
 ENG_nato_joint_airforce_training_desc: "Prostřednictvím simulovaných scénářů, ostrých cvičení a společných výcvikových akcí rozvíjejí a zdokonalují zúčastněná letectva své schopnosti v oblastech, jako je vzdušný boj, operace vzduch-země, tankování za letu a protivzdušná obrana. Tyto aktivity podporují vzájemné porozumění, důvěru a spolupráci mezi spojeneckými letectvy a zajišťují jejich bezproblémovou spolupráci v koaličním prostředí i účinnou reakci na regionální a globální bezpečnostní výzvy." # todo: NEW TRANSLATION
 ENG_c19_globemasters: "C-17 Globemastery" # todo: NEW TRANSLATION
 ENG_c19_globemasters_desc: "C-17 Globemaster III je všestranný strategický transportní letoun využívaný letectvy po celém světě k rychlým a dálkovým přepravním misím. Tento těžký transportní letoun vyráběný společností Boeing dokáže přepravovat velký náklad včetně vojáků, vozidel a humanitární pomoci do odlehlých míst a na provizorní letiště. Díky pokročilé avionice, hornoplošnému uspořádání a schopnosti krátkého vzletu a přistání hraje C-17 Globemaster III klíčovou úlohu při podpoře vojenských a humanitárních operací po celém světě." # todo: NEW TRANSLATION
 ENG_airbus_a400m: "Airbus A400M" # todo: NEW TRANSLATION
 ENG_airbus_a400m_desc: "Airbus A400M je moderní vojenský transportní letoun navržený tak, aby splnil operační požadavky různých letectev po celém světě. Díky hornoplošnému uspořádání a pokročilým turbovrtulovým motorům nabízí A400M výjimečný výkon včetně schopnosti krátkého vzletu a přistání, dlouhého doletu a provozu z částečně upravených vzletových drah." # todo: NEW TRANSLATION
 ENG_nimrod_mra4: "Nimrod MRA4" # todo: NEW TRANSLATION
 ENG_nimrod_mra4_desc: "Nimrod MRA4 byl modernizovanou verzí ikonického námořního hlídkového letounu Nimrod, který měl poskytovat lepší schopnosti pro protiponorkový boj, námořní sledování a pátrací a záchranné mise. Díky pokročilým senzorům, komunikačním systémům a palubnímu vybavení nabízel Nimrod MRA4 ve srovnání s předchůdcem vyšší výkon a všestrannost." # todo: NEW TRANSLATION
 ENG_apache_wah64: "AgustaWestland Apache" # todo: NEW TRANSLATION
 ENG_apache_wah64_desc: "Pořízení a nasazení vrtulníku Augusta Westland Apache představovalo významný pokrok v leteckém bojovém arzenálu Spojeného království. Standardní konstrukce Apachu prošla několika úpravami včetně modernizovaného motoru Rolls-Royce, sklápěcího mechanismu listů pro skladování, ochrany rotorů proti námraze a zvýšené kapacity raket. Tento sofistikovaný útočný vrtulník zavedený k posílení leteckých schopností národa symbolizuje skok vpřed ve vojenské letecké technice a strategické operační účinnosti." # todo: NEW TRANSLATION
 ENG_boeing_p8_poseidon: "Boeing P-8 Poseidon" # todo: NEW TRANSLATION
 ENG_boeing_p8_poseidon_desc: "Boeing P-8 Poseidon je víceúčelový námořní hlídkový letoun určený k dálkovému protiponorkovému boji, boji proti hladinovým cílům a zpravodajským, sledovacím a průzkumným operacím. P-8 Poseidon vycházející z dopravního letounu Boeing 737 je vybaven pokročilými senzory, komunikačními systémy a zbraňovými schopnostmi, což z něj činí velmi účinnou platformu pro námořní hlídkové mise." # todo: NEW TRANSLATION
 ENG_revive_p125_project: "Obnovit projekt P125" # todo: NEW TRANSLATION
 ENG_revive_p125_project_desc: "Obnovený projekt P125 usiluje o vývoj všestranné a nákladově efektivní letecké platformy schopné plnit různé úlohy včetně vzdušné převahy, blízké letecké podpory, průzkumu a výcviku. Díky začlenění nejmodernější avioniky, senzorů a zbraňových systémů nabídne modernizovaný letoun P125 vyšší výkon, přežitelnost a účinnost misí." # todo: NEW TRANSLATION
 ENG_joint_strike_fighter_project: "Projekt Joint Strike Fighter" # todo: NEW TRANSLATION
 ENG_joint_strike_fighter_project_desc: "F-35 Joint Strike Fighter díky pokročilým stealth schopnostem, fúzi senzorů a víceúčelovým bojovým schopnostem poskytuje bezkonkurenční situační povědomí a účinnost v operacích vzduch-vzduch i vzduch-země." # todo: NEW TRANSLATION
 ENG_bae_systems_tempest: "BAE Systems Tempest" # todo: NEW TRANSLATION
 ENG_bae_systems_tempest_desc: "BAE Systems Tempest je koncept stíhacího letounu šesté generace vyvinutý s ohledem na měnící se potřeby moderního vzdušného boje. Díky pokročilé stealth technologii, schopnostem fúze senzorů a autonomním systémům má Tempest poskytovat vyšší výkon, přežitelnost a účinnost v prostředí sporného vzdušného prostoru." # todo: NEW TRANSLATION
 ENG_defence_industrial_policy: "Obranná průmyslová politika" # todo: NEW TRANSLATION
 ENG_defence_industrial_policy_desc: "Britská obranná průmyslová politika vymezuje strategický rámec pro rozvoj, řízení a udržitelnost obranné průmyslové základny národa. Díky bohaté tradici inovací a vynikající úrovně hraje obranný průmysl Spojeného království klíčovou úlohu při podpoře národní bezpečnosti, hospodářské prosperity a technologického vedení na světové scéně." # todo: NEW TRANSLATION
 ENG_defence_industry_modifier: "Britský obranný průmysl" # todo: NEW TRANSLATION
 ENG_sovereign_capability_doctrine: "Doktrína suverénních schopností" # todo: NEW TRANSLATION
 ENG_sovereign_capability_doctrine_desc: "Británie se zavazuje udržovat nezávislou obrannou průmyslovou základnu v celém spektru. Náklady strukturální transformace krátkodobě snižují civilní výrobu, protože továrny mění své zaměření." # todo: NEW TRANSLATION
 ENG_consolidate_national_champions: "Konsolidovat národní šampiony" # todo: NEW TRANSLATION
 ENG_consolidate_national_champions_desc: "BAE Systems, Rolls-Royce a Babcock jsou určeny jako strategické průmyslové pilíře. Vládní zakázky, přednostní nákupy a podpora vývozu budou směřovat k těmto firmám." # todo: NEW TRANSLATION
 ENG_rolls_royce_raynesway_expansion: "Rozšíření Rolls-Royce Raynesway" # todo: NEW TRANSLATION
 ENG_rolls_royce_raynesway_expansion_desc: "Závod v Raynesway u Derby, který vyrábí jaderné pohonné systémy pro ponorky Royal Navy, získá významnou kapitálovou injekci. V East Midlands budou spuštěny dvě nové zbrojní továrny." # todo: NEW TRANSLATION
 ENG_barrow_strategic_shipyard: "Strategická loděnice v Barrow" # todo: NEW TRANSLATION
 ENG_barrow_strategic_shipyard_desc: "Loděnice BAE Systems v Barrow-in-Furness je určena za chráněný suverénní majetek. Do námořního komplexu v Cumbrii budou přidány tři nové loděnice, aby byla zajištěna kapacita pro další třídu jaderných ponorek." # todo: NEW TRANSLATION
 ENG_combat_air_sovereignty: "Suverenita v bojovém letectví" # todo: NEW TRANSLATION
 ENG_combat_air_sovereignty_desc: "Global Combat Air Programme určuje budoucí stíhací schopnosti Británie. BAE Systems vede konstrukční fázi a vládou podporované granty na výzkum a vývoj urychlují harmonogram vývoje platformy." # todo: NEW TRANSLATION
 ENG_rolls_royce_aerospace_centre: "Letecké a kosmické centrum Rolls-Royce" # todo: NEW TRANSLATION
 ENG_rolls_royce_aerospace_centre_desc: "Ve Filtonu v Bristolu bylo otevřeno nové zařízení pro testování a výrobu motorů, které je klíčové pro vývoj pohonného systému nové generace pro program GCAP." # todo: NEW TRANSLATION
 ENG_munitions_strategic_reserve: "Strategická zásoba munice" # todo: NEW TRANSLATION
 ENG_munitions_strategic_reserve_desc: "Audit zásob odhalil kritický nedostatek přesně naváděné munice. Ke znovuvybudování operačních rezerv na úroveň z dob studené války budou uvedeny do provozu dvě nové výrobní linky." # todo: NEW TRANSLATION
 ENG_land_systems_sovereignty: "Suverenita pozemních systémů" # todo: NEW TRANSLATION
 ENG_land_systems_sovereignty_desc: "Programy Ajax a Challenger 3 určují cestu k plně domácí výrobě obrněných vozidel. Na podporu harmonogramu dodávek programu bude zřízeno jedno nové zbrojní zařízení." # todo: NEW TRANSLATION
 ENG_skills_pipeline_apprenticeship_act: "Zákon o rozvoji dovedností a učňovství" # todo: NEW TRANSLATION
 ENG_skills_pipeline_apprenticeship_act_desc: "Dohoda mezi průmyslem a vládou vytvoří 50 000 učňovských míst v obranném inženýrství a řeší nedostatek kvalifikovaných pracovníků způsobený úpadkem průmyslu po studené válce. S růstem pracovní síly budou otevřena další dvě zařízení na výrobu zbraní." # todo: NEW TRANSLATION
 ENG_national_armaments_director: "Národní ředitel pro vyzbrojování" # todo: NEW TRANSLATION
 ENG_national_armaments_director_desc: "V rámci ministerstva obrany bude vytvořen úřad národního ředitele pro vyzbrojování, který zajistí strategický dohled nad suverénní průmyslovou základnou a bude koordinovat nákupy, vývozní licence a interoperabilitu se spojenci." # todo: NEW TRANSLATION
 ENG_strategic_export_pact: "Strategický vývozní pakt" # todo: NEW TRANSLATION
 ENG_strategic_export_pact_desc: "BAE Systems získá oprávnění uzavírat vládou podporované vývozní dohody s Austrálií, Kanadou, Japonskem a Itálií. Diplomatický rámec poskytují dohody AUKUS a Global Combat Air." # todo: NEW TRANSLATION
 ENG_full_spectrum_industrial_base: "Průmyslová základna v celém spektru" # todo: NEW TRANSLATION
 ENG_full_spectrum_industrial_base_desc: "Británie dosáhne soběstačnosti ve všech pěti pilířích obranného průmyslu: ponorkách, bojových letounech, obrněných vozidlech, munici a přesných zbraních. Komplex bude oficiálně označen za strategický národní majetek." # todo: NEW TRANSLATION
 ENG_lean_defence_posture: "Úsporné obranné uspořádání" # todo: NEW TRANSLATION
 ENG_lean_defence_posture_desc: "Ministerstvo obrany přijme model založený na poptávkových signálech, omezí domácí průmyslové závazky a přijme větší závislost na spojeneckých dodavatelích. Úspory státní pokladny se projeví okamžitě." # todo: NEW TRANSLATION
 ENG_value_for_money_review: "Přezkum efektivity výdajů" # todo: NEW TRANSLATION
 ENG_value_for_money_review_desc: "Přezkum nákupů ministerstva obrany provedený Národním kontrolním úřadem odhalí systematické překračování nákladů. Komplexní nové vyjednání hlavních smluv sníží jednotkové náklady a odstraní duplicitní programy." # todo: NEW TRANSLATION
 ENG_mothball_strategic_yards: "Zakonzerovat strategické loděnice" # todo: NEW TRANSLATION
 ENG_mothball_strategic_yards_desc: "Tři zařízení Royal Navy budou převedena do režimu omezené údržby. Okamžitá úspora bude značná, ale kapacita námořní výstavby se nevrátí bez významných budoucích investic." # todo: NEW TRANSLATION
 ENG_cancel_legacy_programmes: "Zrušit staré programy" # todo: NEW TRANSLATION
 ENG_cancel_legacy_programmes_desc: "Programy Nimrod MRA4, Sentinel R1 a jejich nástupci budou zrušeni ještě před dodáním. Rozhodnutí uvolní kapitál, ale vytvoří mezeru ve schopnostech sledování a námořního hlídkování, jejíž zaplnění potrvá roky." # todo: NEW TRANSLATION
 ENG_off_the_shelf_procurement: "Nákup hotových řešení" # todo: NEW TRANSLATION
 ENG_off_the_shelf_procurement_desc: "Británie upustí od vývoje na míru ve prospěch osvědčených zahraničních platforem. Tento přístup sníží počáteční náklady, ale omezí domácí průmyslovou výrobu a zúží výzkumnou základnu." # todo: NEW TRANSLATION
 ENG_f35_partnership_deepening: "Prohloubení partnerství F-35" # todo: NEW TRANSLATION
 ENG_f35_partnership_deepening_desc: "Spojené království urychlí pořízení 48 letounů F-35B a prohloubí integraci do dodavatelského řetězce Joint Strike Fighter. Britské firmy dodávají přibližně 15 procent každého vyrobeného letounu." # todo: NEW TRANSLATION
 ENG_european_defence_cooperation: "Evropská obranná spolupráce" # todo: NEW TRANSLATION
 ENG_european_defence_cooperation_desc: "Británie znovu naváže na bilaterální partnerství v oblasti schopností s Francií, Německem a Itálií. Společný výzkum omezí duplicity, přestože domácí výroba zbraní poklesne s růstem zahraničních nákupů." # todo: NEW TRANSLATION
 ENG_smart_acquisition_reform: "Reforma chytrého pořizování" # todo: NEW TRANSLATION
 ENG_smart_acquisition_reform_desc: "Program reformy obranných nákupů bude plně zaveden. Analýza investic v rané fázi a modelování nákladů během celého životního cyklu se stanou povinnými, což omezí nákladné úpravy v pozdních fázích." # todo: NEW TRANSLATION
 ENG_dual_use_innovation: "Inovace dvojího užití" # todo: NEW TRANSLATION
 ENG_dual_use_innovation_desc: "Mechanismy přenosu technologií mezi civilním a obranným sektorem budou formalizovány a elektronické a komunikační firmy se zapojí do vojenských programů C4ISR. Budou vypsána dvě kola grantů na výzkum elektroniky." # todo: NEW TRANSLATION
 ENG_naval_squeeze_efficiency: "Efektivita v podmínkách námořních úspor" # todo: NEW TRANSLATION
 ENG_naval_squeeze_efficiency_desc: "Ředitelství připravenosti loďstva sjednotí cykly údržby v Rosyth a využije společné nástroje a pracovní týmy ke snížení nákladů na jeden měsíc provozu trupu. Pro zvládnutí konsolidované práce bude otevřeno nové zařízení loděnice." # todo: NEW TRANSLATION
 ENG_minimum_viable_industrial_base: "Minimální životaschopná průmyslová základna" # todo: NEW TRANSLATION
 ENG_minimum_viable_industrial_base_desc: "Británie stanoví nezbytné minimum suverénní výrobní schopnosti. Pod tuto hranici nebude dovoleno provádět další škrty. Tento závazek stabilizuje očekávání průmyslu a uklidní pracovní nepokoje." # todo: NEW TRANSLATION
 ENG_strategic_reliance_doctrine: "Doktrína strategické závislosti" # todo: NEW TRANSLATION
 ENG_strategic_reliance_doctrine_desc: "Rada národní bezpečnosti dospěje k závěru, že závislost na spojencích, především na Spojených státech, představuje pro středně velkou ekonomiku nejhospodárnější uspořádání. Podmínky půjček a pronájmu budou trvale zlepšeny." # todo: NEW TRANSLATION
 ENG_industrial_realignment_idea: "Přeorientování obranného průmyslu" # todo: NEW TRANSLATION
 ENG_industrial_realignment_idea_desc: "Zdroje jsou přesouvány z civilních na obranné výrobní linky. Továrny přestavované pro programy suverénních zbraní dočasně omezí civilní výrobu." # todo: NEW TRANSLATION
 ENG_capability_gap_idea: "Mezera ve schopnostech" # todo: NEW TRANSLATION
 ENG_capability_gap_idea_desc: "Zrušení starých programů zanechalo ozbrojené síly bez náhradních systémů. Operační připravenost bude snížena, dokud nebude dokončeno nové pořizování." # todo: NEW TRANSLATION
 ENG_british_overseas_territories: "Britská zámořská území" # todo: NEW TRANSLATION
 ENG_british_overseas_territories_desc: "Britská zámořská území zahrnují rozmanitou skupinu území a jurisdikcí roztroušených po celém světě, z nichž každé má své vlastní kulturní, geografické a politické charakteristiky. Tato území, mezi něž patří ikonická místa jako Gibraltar, Bermudy a Kajmanské ostrovy, udržují silné vazby na Spojené království a zároveň požívají různé míry autonomie a samosprávy." # todo: NEW TRANSLATION
 ENG_cayman_enterprise_city: "Caymanské podnikatelské město" # todo: NEW TRANSLATION
 ENG_cayman_enterprise_city_desc: "Caymanské podnikatelské město je zvláštní ekonomická zóna na Kajmanských ostrovech, která nabízí jedinečnou platformu pro mezinárodní podniky usilující o fyzickou přítomnost v daňově neutrální jurisdikci. Díky zjednodušeným procesům a pobídkám poskytuje příznivé prostředí pro rozvoj a růst společností v odvětvích, jako jsou technologie, biotechnologie a média." # todo: NEW TRANSLATION
 ENG_illex_fishery: "Rybolov olihní Illex" # todo: NEW TRANSLATION
 ENG_illex_fishery_desc: "Rybolov olihní Illex je zásadní součástí ekonomiky Falklandských ostrovů a zaměřuje se na udržitelný lov tohoto druhu olihní. Pečlivě spravovaný rybolov zajišťuje dlouhodobou životaschopnost, podporuje místní obživu a přispívá k potravinové bezpečnosti i ekonomické stabilitě regionu." # todo: NEW TRANSLATION
 ENG_north_mole_power_plant: "Elektrárna North Mole" # todo: NEW TRANSLATION
 ENG_north_mole_power_plant_desc: "Elektrárna North Mole se nachází v Gibraltaru a hraje klíčovou roli při pokrývání energetických potřeb tohoto území. Díky moderním technologiím a infrastruktuře zajišťuje spolehlivou výrobu elektřiny a podporuje každodenní život i ekonomické aktivity obyvatel a podniků Gibraltaru." # todo: NEW TRANSLATION
 ENG_biras_creek_resort: "Rezort Biras Creek" # todo: NEW TRANSLATION
 ENG_biras_creek_resort_desc: "Rezort Biras Creek, zasazený do Britských Panenských ostrovů, nabízí luxusní útočiště uprostřed úchvatné přírody. Je známý odlehlými plážemi, prvotřídním ubytováním a osobními službami a poskytuje idylický únik cestovatelům hledajícím odpočinek a načerpání sil v tropickém ráji." # todo: NEW TRANSLATION
 ENG_bermuda_innovation_sprint: "Bermudský inovační sprint" # todo: NEW TRANSLATION
 ENG_bermuda_innovation_sprint_desc: "Bermudský inovační sprint je iniciativa zaměřená na podporu inovací a podnikání na ostrově. Prostřednictvím akceleračních programů, mentoringu a možností financování podporuje startupy a technologické podniky při vývoji inovativních řešení a podpoře hospodářského růstu na Bermudách." # todo: NEW TRANSLATION
 ENG_princes_lodge_plantation: "Plantáž Princes Lodge" # todo: NEW TRANSLATION
 ENG_princes_lodge_plantation_desc: "Plantáž Princes Lodge je historické panství na Svaté Heleně, které představuje bohaté kulturní dědictví ostrova a jeho zemědělské tradice. Díky malebnému prostředí a zachované koloniální architektuře nabízí návštěvníkům pohled do minulosti ostrova a zároveň přispívá ke kulturnímu turismu a ochraně místního dědictví." # todo: NEW TRANSLATION
 ENG_beaches_turks_caicos: "Beaches Turks and Caicos" # todo: NEW TRANSLATION
 ENG_beaches_turks_caicos_desc: "Beaches Turks and Caicos je luxusní all-inclusive rezort proslulý nedotčenými plážemi, prvotřídním vybavením a atmosférou vhodnou pro rodiny. Nabízí širokou škálu aktivit a možností zábavy a poskytuje nezapomenutelný zážitek z dovolené hostům všech věkových kategorií na Turks a Caicos." # todo: NEW TRANSLATION
 ENG_little_bay_port_development_project: "Projekt rozvoje přístavu Little Bay" # todo: NEW TRANSLATION
 ENG_little_bay_port_development_project_desc: "Projekt rozvoje přístavu Little Bay má za cíl posílit infrastrukturu a hospodářské vyhlídky Montserratu vybudováním moderního přístavního zařízení v Little Bay. Díky lepším dopravním a logistickým možnostem chce podpořit obchod, cestovní ruch a investiční příležitosti na ostrově." # todo: NEW TRANSLATION
 ENG_pitcairn_islands_study_center: "Studijní centrum Pitcairnových ostrovů" # todo: NEW TRANSLATION
 ENG_pitcairn_islands_study_center_desc: "Studijní centrum Pitcairnových ostrovů je výzkumná instituce věnovaná studiu a ochraně historie, kultury a biodiverzity Pitcairnových ostrovů. Prostřednictvím archivů, publikací a vzdělávacích programů podporuje povědomí o těchto odlehlých a jedinečných územích a jejich docenění." # todo: NEW TRANSLATION
 ENG_typhoon_tranche_debate: "Debata o Typhoonu Tranche 1" # todo: NEW TRANSLATION
 ENG_typhoon_tranche_debate_desc: "Debata o Typhoonu Tranche 1 označuje diskuse a analýzy týkající se Eurofighteru Typhoon, všestranného víceúčelového bojového letounu vyvinutého několika evropskými zeměmi. Tyto debaty se často zabývají různými aspekty Typhoonu, včetně jeho výkonu, schopností, nákladové efektivity a strategického významu v moderním leteckém boji." # todo: NEW TRANSLATION
 ENG_share_vtol_research: "Sdílet výzkum VTOL" # todo: NEW TRANSLATION
 ENG_share_vtol_research_desc: "Sdílení výzkumu VTOL zahrnuje iniciativy spolupráce a výměny znalostí mezi průmyslovými subjekty a výzkumnými institucemi s cílem rozvíjet technologii kolmého vzletu a přistání (VTOL)." # todo: NEW TRANSLATION
 ENG_channel_homegrown_innovation: "Podpořit domácí inovace" # todo: NEW TRANSLATION
 ENG_channel_homegrown_innovation_desc: "Podporou domácích startupů, výzkumných institucí a malých podniků chceme urychlit vývoj špičkových technologií a řešení, která reagují na klíčové výzvy a příležitosti v tomto odvětví. Prostřednictvím spolupráce, finanční podpory a budování ekosystému chceme Spojené království etablovat jako globálního lídra v leteckých inovacích a podpořit hospodářský růst i konkurenceschopnost." # todo: NEW TRANSLATION
 ENG_revive_british_aviation_industry: "Obnovit britský letecký průmysl" # todo: NEW TRANSLATION
 ENG_revive_british_aviation_industry_desc: "Podporou investic, inovací a rozvoje dovedností chceme oživit domácí výrobní kapacity, posílit odolnost dodavatelských řetězců a vytvořit kvalitní pracovní místa po celé zemi." # todo: NEW TRANSLATION
 ENG_focus_on_component_manufacturing: "Zaměřit se na výrobu komponent" # todo: NEW TRANSLATION
 ENG_focus_on_component_manufacturing_desc: "Investicemi do pokročilých výrobních technologií, vzdělávání pracovní síly a opatření na posílení odolnosti dodavatelských řetězců chceme získat větší hodnotu a konkurenceschopnost na globálním leteckém trhu. Prostřednictvím partnerství s výrobci OEM, dodavateli jednotlivých úrovní a výzkumnými organizacemi chceme podporovat inovace, efektivitu a kvalitu v celém ekosystému leteckých komponent." # todo: NEW TRANSLATION
 ENG_us_uk_collaboration: "Spolupráce USA a Spojeného království" # todo: NEW TRANSLATION
 ENG_us_uk_collaboration_desc: "USA neustále hledají dobré partnery. Přijetím britských leteckých projektů bychom mohli spolupracovat na získání většího financování a zároveň jim poskytnout část našich inovací." # todo: NEW TRANSLATION
 ENG_skylon_engine: "Motor Skylon" # todo: NEW TRANSLATION
 ENG_skylon_engine_desc: "Motor Skylon představuje průkopnický projekt britského leteckého průmyslu zaměřený na vývoj pohonných systémů nové generace. Prostřednictvím pokročilého inženýrství, materiálových věd a počítačového modelování chce tato iniciativa navrhovat a vyrábět vysoce výkonné proudové motory s mimořádnou účinností, spolehlivostí a udržitelností." # todo: NEW TRANSLATION
 ENG_rebirthing_black_arrow: "Znovuzrození Black Arrow" # todo: NEW TRANSLATION
 ENG_rebirthing_black_arrow_desc: "Znovuzrození Black Arrow připomíná odkaz programu Black Arrow, historického britského projektu nosné rakety pro vynášení kosmických těles. Tato iniciativa chce oživit a modernizovat ducha průzkumu vesmíru ve Spojeném království rozvojem pokročilých schopností vynášení a satelitních technologií." # todo: NEW TRANSLATION
 ENG_lightweight_fire_platform_artillery: "Lehkostřelecký systém" # todo: NEW TRANSLATION
 ENG_lightweight_fire_platform_artillery_desc: "Projekt lehkého dělostřeleckého systému má za cíl vyvinout a nasadit všestranný a mobilní dělostřelecký systém optimalizovaný pro rychlé nasazení a přesnou palebnou podporu. Využitím lehkých materiálů, modulární konstrukce a pokročilých systémů řízení palby chce tato iniciativa zvýšit pohyblivost, pohotovost a účinnost dělostřeleckých jednotek v různých operačních prostředích." # todo: NEW TRANSLATION
 ENG_harpoon_replacement: "Náhrada střel Harpoon" # todo: NEW TRANSLATION
 ENG_harpoon_replacement_desc: "Program náhrady střel Harpoon se zaměřuje na vývoj protilodního raketového systému nové generace, který nahradí zastarávající střely Harpoon ve výzbroji britské armády. Využitím pokročilých technologií navádění, pohonu a zaměřování chce tato iniciativa poskytnout námořním silám větší dosah, přesnost a účinnost proti hladinovým hrozbám v námořním prostředí." # todo: NEW TRANSLATION
 ENG_codify_service_economy: "Kodifikovat ekonomiku založenou na službách" # todo: NEW TRANSLATION
 ENG_codify_service_economy_desc: "Británie po desetiletí směřuje k modelu založenému na službách. Finance, poradenství a média zaplnily prázdné místo po uzavřených továrnách. Je čas tento vývoj přeměnit v explicitní strategii." # todo: NEW TRANSLATION
 ENG_gate_burton_energy: "Vybudovat energetický park Gate Burton" # todo: NEW TRANSLATION
 ENG_gate_burton_energy_desc: "Energetický park Gate Burton promění zemědělskou půdu poblíž Gate Burton v Lincolnshiru ve významné solární a bateriové zařízení, které bude dodávat čistou energii do celostátní sítě a pomůže nahradit stárnoucí uhelné a plynové elektrárny." # todo: NEW TRANSLATION
 ENG_gate_burton_energy_tt: "Přidá §G1§! §Ybateriový park§!" # todo: NEW TRANSLATION
 ENG_ai_white_collar: "Umělá inteligence pro kancelářskou práci" # todo: NEW TRANSLATION
 ENG_ai_white_collar_desc: "Od právních kanceláří po účetní firmy začínají systémy umělé inteligence zvládat rutinní analýzy a práci s dokumenty. Pracovní místa mizí, marže rostou." # todo: NEW TRANSLATION
 ENG_empower_city_london: "Posílit City of London" # todo: NEW TRANSLATION
 ENG_empower_city_london_desc: "Uvolněním pravidel územního plánování a podporou nových věží ve Square Mile povzbudíme banky a servisní firmy k rozšíření působnosti. Nové kancelářské prostory třídy A v City budou přibývat rychleji a upevní roli Londýna jako globálního finančního centra." # todo: NEW TRANSLATION
 ENG_empower_edinburgh: "Posílit finanční čtvrť Edinburghu" # todo: NEW TRANSLATION
 ENG_empower_edinburgh_desc: "Podporou nových kanceláří třídy A a infrastruktury v okolí čtvrti New Town a Exchange pomůžeme edinburským bankám a správcům aktiv rozšířit působnost a posílíme druhé nejvýznamnější finanční centrum Spojeného království mimo Londýn." # todo: NEW TRANSLATION
 ENG_found_invest_northern_ireland: "Založit Invest Northern Ireland" # todo: NEW TRANSLATION
 ENG_found_invest_northern_ireland_desc: "Založíme Invest Northern Ireland, aby propagovala region v zahraničí a přilákala stabilní příliv nových továren, kanceláří a doků." # todo: NEW TRANSLATION
 ENG_digital_government: "Komplexní digitalizace vlády" # todo: NEW TRANSLATION
 ENG_digital_government_desc: "Digitalizujeme veřejné služby, daně, licencování a dávky, omezíme papírování a snížíme náklady." # todo: NEW TRANSLATION
 ENG_invest_silicon_glenn: "Investovat do Silicon Glen" # todo: NEW TRANSLATION
 ENG_invest_silicon_glenn_desc: "Přesměrujeme finanční prostředky do skotského Silicon Glen, rozšíříme laboratoře a technologické parky a urychlíme výzkum v oblasti výpočetní techniky, internetu a umělé inteligence." # todo: NEW TRANSLATION
 ENG_cross_border_cooperation: "Přeshraniční spolupráce" # todo: NEW TRANSLATION
 ENG_cross_border_cooperation_desc: "Prohloubíme praktickou spolupráci mezi Severním Irskem a Irskem, omezíme byrokracii a podpoříme přeshraniční obchod i vliv." # todo: NEW TRANSLATION
 ENG_national_data_infrastructure: "Národní datová infrastruktura" # todo: NEW TRANSLATION
 ENG_national_data_infrastructure_desc: "Vybudujeme celostátní optické sítě, datová centra a páteřní sítě, abychom urychlili digitální spojení, rozšířili dosah dodávek a zvýšili produktivitu celé ekonomiky." # todo: NEW TRANSLATION
 ENG_admiral_group: "Navázat partnerství s Admiral Group" # todo: NEW TRANSLATION
 ENG_admiral_group_desc: "Spoluprací s Admiral Group v Cardiffu rozšíříme soukromé pojistné krytí a zmírníme tlak na rozpočty sociální péče a zdravotnictví." # todo: NEW TRANSLATION
 ENG_fintech_open_banking: "Centrum fintechu a otevřeného bankovnictví" # todo: NEW TRANSLATION
 ENG_fintech_open_banking_desc: "Proměníme Spojené království v přední centrum fintechu a otevřeného bankovnictví, zvýšíme výnosy z daní právnických osob a zároveň snížíme náklady vládních půjček." # todo: NEW TRANSLATION
 ENG_fintech_open_banking_opinion_tt: "Názor §Ymezinárodních bankéřů§! musí být vyšší než 49" # todo: NEW TRANSLATION
 ENG_global_consulting_state: "Globální poradenský stát" # todo: NEW TRANSLATION
 ENG_global_consulting_state_desc: "Podpoříme britské poradenské a právní firmy po celém světě, rozšíříme náš vliv, prohloubíme výzkumné vazby a přilákáme více zahraničních investic." # todo: NEW TRANSLATION
 ENG_lean_manufacturing: "Štíhlá výroba" # todo: NEW TRANSLATION
 ENG_lean_manufacturing_desc: "Rozšířením robotiky, senzorů a výrobních postupů just-in-time v našich závodech nahradíme rutinní práci automatizovanými linkami. Továrny budou spotřebovávat více energie, ale zaměstnávat méně lidí, zatímco výroba a efektivita porostou s každou výrobní sérií." # todo: NEW TRANSLATION
 ENG_cloud_isles: "Oblačné ostrovy" # todo: NEW TRANSLATION
 ENG_cloud_isles_desc: "Proměníme Británii v centrum rozsáhlých datových center a cloudových kampusů. Kanceláře budou spotřebovávat více energie pro serverové farmy, ale digitální služby, které hostují, vytvoří vyšší daňové příjmy a urychlí výzkumné průlomy." # todo: NEW TRANSLATION
 ENG_algorithmic_finance: "Algoritmické finance" # todo: NEW TRANSLATION
 ENG_algorithmic_finance_desc: "Nasadíme pokročilé systémy řízení rizik a automatizované pokladní systémy pro správu peněžních toků, dluhu a plateb, omezíme byrokracii a snížíme provozní náklady vlády." # todo: NEW TRANSLATION
 ENG_invest_harland_wolff: "Investovat do Harland & Wolff" # todo: NEW TRANSLATION
 ENG_invest_harland_wolff_desc: "Vložíme nový kapitál do loděnic Harland & Wolff v Belfastu i jinde, znovu otevřeme doky, zaměstnáme kvalifikované pracovníky a zvýšíme výkon našich loděnic." # todo: NEW TRANSLATION
 ENG_critical_minerals_strategy: "Strategie kritických nerostů" # todo: NEW TRANSLATION
 ENG_critical_minerals_strategy_desc: "Spustíme národní strategii kritických nerostů a podpoříme nové projekty v Cornwallu, Walesu i jinde, abychom zajistili klíčové rudy a zlepšili přístup Británie k životně důležitým zdrojům." # todo: NEW TRANSLATION
 ENG_dogger_bank_offshore: "Pobřežní energetické centrum Dogger Bank" # todo: NEW TRANSLATION
 ENG_dogger_bank_offshore_desc: "Podpoříme pobřežní větrný komplex Dogger Bank v Severním moři a vybudujeme největší větrnou farmu na světě, která bude dodávat čistou energii milionům britských domácností." # todo: NEW TRANSLATION
 ENG_hinkley_point_c: "Dokončit Hinkley Point C" # todo: NEW TRANSLATION
 ENG_hinkley_point_c_desc: "Urychlíme projekt dvoureaktorové elektrárny Hinkley Point C v Somersetu a přidáme do sítě více než 3 GW dlouhodobého nízkouhlíkového základního výkonu." # todo: NEW TRANSLATION
 ENG_acknowledge_industrial_collapse: "Uznat průmyslový úpadek" # todo: NEW TRANSLATION
 ENG_acknowledge_industrial_collapse_desc: "Od Redcaru v Teesside po Port Talbot v jižním Walesu vyhasly vysoké pece a celé komunity přišly o průmyslovou základnu. Než ji budeme moci obnovit, musíme konečně přiznat, jak hluboko britský těžký průmysl klesl." # todo: NEW TRANSLATION
 ENG_building_brittain_fit_future: "Budování Británie připravené na budoucnost" # todo: NEW TRANSLATION
 ENG_building_brittain_fit_future_desc: "Spustíme dlouhodobou průmyslovou strategii na zvýšení produktivity a příjmů, investujeme do nápadů, lidí, infrastruktury a regionů po celé Británii." # todo: NEW TRANSLATION
 ENG_northern_powerhouse: "Northern Powerhouse a Midlands Engine" # todo: NEW TRANSLATION
 ENG_northern_powerhouse_desc: "Propojíme Northern Powerhouse a Midlands Engine do jediného růstového koridoru a podpoříme dopravu, dovednosti a podnikatelské investice s cílem zvýšit produktivitu od Liverpoolu a Manchesteru přes Birmingham až po East Midlands." # todo: NEW TRANSLATION
 ENG_aerospace_wales: "Letecký průmysl Walesu" # todo: NEW TRANSLATION
 ENG_aerospace_wales_desc: "Podpoříme velšský letecký klastr kolem Airbusu v Broughtonu, St Athanu a širšího centra MRO, zvýšíme místní výrobu křídel, opravárenské práce a počet vysoce hodnotných pracovních míst v letectví." # todo: NEW TRANSLATION
 ENG_marine_power_systems: "Podpořit Marine Power Systems" # todo: NEW TRANSLATION
 ENG_marine_power_systems_desc: "Podpoříme velšskou společnost Marine Power Systems při rozšiřování plovoucích větrných a vlnových platforem a proměníme místní loděnice a přístavy v centra mořské energie nové generace." # todo: NEW TRANSLATION
 ENG_develop_edinburgh_west_end: "Rozvíjet West End Edinburghu" # todo: NEW TRANSLATION
 ENG_develop_edinburgh_west_end_desc: "Modernizujeme čtvrť Exchange ve West Endu a vytvoříme hustší směs kanceláří, laboratoří a moderních dílen. Zvýšíme tak místní výzkumnou produkci a efektivitu výroby a zároveň přidáme nový prostor pro rozšíření našich předních frakcí." # todo: NEW TRANSLATION
 ENG_develop_bae_aerospace: "Rozvíjet BAE Aerospace ve Skotsku" # todo: NEW TRANSLATION
 ENG_develop_bae_aerospace_desc: "Rozšíříme působnost BAE v leteckém průmyslu v okolí Prestwicku a na dalších skotských pracovištích. Přidáme nové hangáry, dílny a inženýrské týmy na podporu pokročilých bojových letounů a budoucích programů." # todo: NEW TRANSLATION
 ENG_glasgow_shipbuilidng: "Centrum glasgowského loďařství" # todo: NEW TRANSLATION
 ENG_glasgow_shipbuilidng_desc: "Modernizujeme loděnice na řece Clyde v Govanu a Scotstounu a proměníme Glasgow v dlouhodobé centrum vojenské stavby lodí a námořního exportu." # todo: NEW TRANSLATION
 ENG_glasgow_shipbuilidng_tt: "Tento efekt lze zlepšit dokončením §Y$ENG_refine_natural_bauxite$§!" # todo: NEW TRANSLATION
 ENG_high_value_manufacturing_zones: "Zóny výroby s vysokou přidanou hodnotou" # todo: NEW TRANSLATION
 ENG_high_value_manufacturing_zones_desc: "Vymezíme zóny výroby s vysokou přidanou hodnotou kolem center typu Catapult a vědeckých parků. Firmám tak zajistíme rychlejší přístup k laboratořím, kvalifikovaným pracovníkům a moderním zařízením, což zvýší produktivitu a pokročilou výrobu." # todo: NEW TRANSLATION
 ENG_high_value_manufacturing_zones_tt: "Pokud má stát §G5§! §Y$infrastructure$§!, alespoň §G10§! §Y$industrial_complex$§!, alespoň §G5§! §Y$offices$§!, alespoň §G5§! §Y$arms_factory$§! NEBO §G5§! §Y$dockyard$§!, přidáme za stát:" # todo: NEW TRANSLATION
 ENG_steel_guarantee: "Garance oceli" # todo: NEW TRANSLATION
 ENG_steel_guarantee_desc: "Zajistíme dlouhodobé financování a záruky pro nízkouhlíkové ocelářské projekty, čímž investorům dodáme jistotu k modernizaci závodů a zabezpečíme domácí výrobu oceli na další desetiletí." # todo: NEW TRANSLATION
 ENG_steel_guarantee_tt: "§Y[10.GetName],[11.GetName],[12.GetName]§! nebo §Y[1191.GetName]§! získá:\nVíce než §Y4 $industrial_complex$§!: §G+6§! §Y$country_resource_steel$§!.\nVíce než §Y4 $offices$§!: §G+3§! §Y$country_resource_tungsten$§!.\nDokončené libovolné §Yzařízení§! a §Y$sp_improved_synthetic_diamonds$§!: dodatečných §G+3§! §Y$country_resource_chromium$§!." # todo: NEW TRANSLATION
 ENG_celsa_steel: "Podpořit Celsa Steel Cardiff" # todo: NEW TRANSLATION
 ENG_celsa_steel_desc: "Podpoříme ocelárny s elektrickými obloukovými pecemi a válcovnu tyčí a profilů společnosti Celsa v Cardiffu. Zvýšíme výrobu nízkouhlíkové betonářské oceli a drátu a udržíme významného velšského recyklátora i zaměstnavatele v plném provozu." # todo: NEW TRANSLATION
 ENG_expand_scottish_steel: "Rozšířit skotské ocelářství" # todo: NEW TRANSLATION
 ENG_expand_scottish_steel_desc: "Investujeme do závodů Dalzell a Clydebridge, obnovíme výrobu plechů, zajistíme skotskou ocel pro válečné lodě a pobřežní větrné elektrárny a vybudujeme moderní základnu těžkého ocelářství severně od hranice." # todo: NEW TRANSLATION
 ENG_refine_natural_bauxite: "Zpracovávat přírodní bauxit" # todo: NEW TRANSLATION
 ENG_refine_natural_bauxite_desc: "Vybudujeme v okolí Edinburghu zařízení na výrobu oxidu hlinitého, která budou z dováženého bauxitu vyrábět vysoce kvalitní surovinu a zvýší domácí výrobu hliníku ve Skotsku." # todo: NEW TRANSLATION
 ENG_refine_natural_bauxite_tt: "Zlepší účinky §Y$ENG_glasgow_shipbuilidng$§!" # todo: NEW TRANSLATION
 ENG_deep_mining_coal: "Obnovit hlubinnou těžbu uhlí ve Skotsku" # todo: NEW TRANSLATION
 ENG_deep_mining_coal_desc: "Znovu otevřeme hlubinné sloje ve starých skotských uhelných revírech, vyhloubíme nové šachty a obnovíme důlní infrastrukturu, abychom obnovili hlubinnou těžbu uhlí severně od hranice." # todo: NEW TRANSLATION
 ENG_opencast_mining: "Rozšířit povrchovou těžbu ve Skotsku" # todo: NEW TRANSLATION
 ENG_opencast_mining_desc: "Povolíme nové povrchové doly ve skotských uhelných revírech, odstraníme nadloží, zpřístupníme mělké sloje a zvýšíme domácí zásoby uhlí." # todo: NEW TRANSLATION
 ENG_cononish_gold_silver: "Zlaté a stříbrné doly Cononish" # todo: NEW TRANSLATION
 ENG_cononish_gold_silver_desc: "Podpoříme důl Cononish poblíž Tyndrumu a proměníme jediné komerční ložisko zlata a stříbra ve Skotsku ve stabilní zdroj drahých kovů pro národ." # todo: NEW TRANSLATION
 ENG_national_productivity_commission: "Národní komise pro produktivitu" # todo: NEW TRANSLATION
 ENG_national_productivity_commission_desc: "Zřídíme Národní komisi pro produktivitu, která sladí investiční, infrastrukturní a inovační politiku kolem jediného cíle: zvýšení produktivity v celé Británii." # todo: NEW TRANSLATION
 ENG_infrastructure_for_productivty: "Národní infrastrukturní strategie" # todo: NEW TRANSLATION
 ENG_infrastructure_for_productivty_desc: "Zavedeme Národní infrastrukturní strategii zaměřenou na silnice, železnice a digitální sítě, které zvyšují produktivitu namísto jejího brzdění." # todo: NEW TRANSLATION
 ENG_universaties_engines_of_growth: "Fond Síla v regionech" # todo: NEW TRANSLATION
 ENG_universaties_engines_of_growth_desc: "Zavedeme fond ve stylu programu Síla v regionech a podpoříme partnerství univerzit a podniků v celé Anglii, aby se místní výzkumné kapacity proměnily v pracovní místa, investice a růst." # todo: NEW TRANSLATION
 ENG_hs2: "Spustit High Speed 2" # todo: NEW TRANSLATION
 ENG_hs2_desc: "Dáme zelenou projektu High Speed 2, schválíme první fázi mezi Londýnem a Midlands a zavážeme se k desetiletím investic do nové vysokorychlostní železnice." # todo: NEW TRANSLATION
 ENG_northern_powerhouse_rail: "Železnice Northern Powerhouse" # todo: NEW TRANSLATION
 ENG_northern_powerhouse_rail_desc: "Zavážeme se k projektu Northern Powerhouse Rail, nové a modernizované východo-západní síti spojující Liverpool, Manchester, Leeds a širší sever rychlejšími a častějšími vlaky s větší kapacitou pro cestující i náklad." # todo: NEW TRANSLATION
 ENG_euston_canary_wharf_integration: "Propojit Euston a Canary Wharf" # todo: NEW TRANSLATION
 ENG_euston_canary_wharf_integration_desc: "Napojíme konečnou stanici HS2 v Eustonu na londýnskou východo-západní železniční a podzemní síť. Vytvoříme plynulé spojení s City a Canary Wharf, aby se cestující vysokorychlostní železnicí dostali do finančních čtvrtí hlavního města během několika minut." # todo: NEW TRANSLATION
 ENG_midland_main_lines: "Modernizace Midland Main Line" # todo: NEW TRANSLATION
 ENG_midland_main_lines_desc: "Pokročíme v modernizaci a elektrifikaci Midland Main Line mezi Londýnem a East Midlands, zkrátíme jízdní doby a uvolníme kapacitu pro cestující i náklad." # todo: NEW TRANSLATION
 ENG_russel_group: "Univerzity Russell Group" # todo: NEW TRANSLATION
 ENG_russel_group_desc: "Prohloubíme vazby s výzkumně zaměřenými univerzitami skupiny Russell Group a podpoříme společné projekty, které promění špičkovou vědu v růst po celé zemi." # todo: NEW TRANSLATION
 ENG_golden_triangle_research: "Výzkumný oblouk Zlatého trojúhelníku" # todo: NEW TRANSLATION
 ENG_golden_triangle_research_desc: "Prohloubíme vazby mezi předními univerzitami v Oxfordu, Cambridge a Londýně a vybudujeme výzkumný oblouk Zlatého trojúhelníku, který soustředí špičkové laboratoře, talenty a financování do jediného významného inovačního koridoru." # todo: NEW TRANSLATION
 ENG_imperial_king_tech_clusters: "Technologické klastry Imperial a King's" # todo: NEW TRANSLATION
 ENG_imperial_king_tech_clusters_desc: "Propojíme inovační kampus Imperialu ve White City s technologickými a zdravotnickými centry King's a vybudujeme husté klastry, v nichž laboratoře, startupy a investoři promění průlomový výzkum v komerční úspěchy." # todo: NEW TRANSLATION
 ENG_skill_england_technical: "Skills England a technické obory" # todo: NEW TRANSLATION
 ENG_skill_england_technical_desc: "Ve spolupráci se Skills England zmapujeme nedostatky v dovednostech a rozšíříme technické obory i učňovské programy. Více lidí tak získá jasnou a kvalitní cestu ke kvalifikované práci." # todo: NEW TRANSLATION
 ENG_closing_britains_productivity_gap: "Uzavřít britskou mezeru v produktivitě" # todo: NEW TRANSLATION
 ENG_closing_britains_productivity_gap_desc: "Po letech cílených investic do infrastruktury, univerzit a dovedností se naše mezera v produktivitě konečně začíná uzavírat. Roste výkon na pracovníka a ekonomika získává prostor pro vyšší mzdy a kvalitnější služby." # todo: NEW TRANSLATION
 ENG_closing_britains_productivity_gap_tt: "Sankci za produktivitu můžeme odstranit výzkumem §Y$CAT_infrastructure$§!" # todo: NEW TRANSLATION
 ENG_ambitions_for_britain: "Ambice pro Británii" # todo: NEW TRANSLATION
 ENG_ambitions_for_britain_desc: "Británie nesmí s postupem času chátrat. Británie musí být ambiciózní, a proto britský lid potřebuje Labouristickou stranu. Díky odhodlání Labouristická strana katapultuje Spojené království mezi nejvýznamnější světové mocnosti naší doby. Nové tisíciletí bude patřit nám." # todo: NEW TRANSLATION
 ENG_deeper_prosperity: "Hlubší prosperita" # todo: NEW TRANSLATION
 ENG_deeper_prosperity_desc: "Dosáhneme hlubší prosperity vytvořením většího počtu pracovních míst a motivací našich lidí k hledání pracovních příležitostí. Toho lze dosáhnout pouze vytvořením udržitelného prostředí, zejména prostřednictvím odpovídající infrastruktury." # todo: NEW TRANSLATION
 ENG_every_region_of_the_country: "Každý region země" # todo: NEW TRANSLATION
 ENG_every_region_of_the_country_desc: "Naše úsilí se nebude soustředit pouze na hlavní centra společnosti, ale upřednostní každý region země. Koneckonců jsme unií. Bez rovnoměrného rozdělení zdrojů se stát rozpadne a vytvoří nerovnosti mezi velkým městským i venkovským obyvatelstvem." # todo: NEW TRANSLATION
 ENG_the_foundation: "Základ" # todo: NEW TRANSLATION
 ENG_the_foundation_desc: "Základem, pilířem a páteří této země je tvrdě pracující dělník, který tráví nespočet hodin službou své zemi. Zahájení reforem umožňujících větší flexibilitu na pracovišti, pokud jde o dovolenou, volno a nemocenskou, bude důležitou změnou pro udržení tohoto pilíře společnosti." # todo: NEW TRANSLATION
 ENG_nhs_reform: "Reforma NHS" # todo: NEW TRANSLATION
 ENG_nhs_reform_desc: "Národní zdravotní služba nutně potřebuje reformu. Nejde jen o povrchní změnu spočívající ve výstavbě nových nemocnic a zdravotnických zařízení. Místo toho podpoříme synchronizaci soukromého a veřejného sektoru s cílem zlepšit NHS, zkrátit čekací doby, modernizovat stávající zařízení a přijímat více pacientů v kratším čase." # todo: NEW TRANSLATION
 ENG_reinassaince_of_status: "Renesance společenského postavení" # todo: NEW TRANSLATION
 ENG_reinassaince_of_status_desc: "Naši lidé musí mít možnost stoupat po společenském žebříčku a ekonomicky se rozvíjet. Proto musíme zasáhnout již v raném věku. Poskytnutím potřebných nástrojů institucím vyššího vzdělávání dokážeme našim lidem snadněji zpřístupnit zdroje potřebné k postupu ve společnosti." # todo: NEW TRANSLATION
 ENG_a_grand_promise: "Velký slib" # todo: NEW TRANSLATION
 ENG_a_grand_promise_desc: "Abychom si udrželi podporu pro naši stranu, musíme učinit velký slib, který zaujme naše voliče. Splněním tohoto slibu upevníme důvěryhodnost naší koalice a zasadíme opozici významnou ránu." # todo: NEW TRANSLATION
 ENG_more_frontline_staff: "Více pracovníků v první linii" # todo: NEW TRANSLATION
 ENG_more_frontline_staff_desc: "Musíme podpořit zemědělskou produktivitu tím, že povzbudíme více pracovníků v první linii k nástupu na pracoviště. Prostřednictvím motivačních programů dokážeme obnovit slábnoucí zemědělského ducha v naší zemi." # todo: NEW TRANSLATION
 ENG_foster_the_tech_revolution: "Podpořit křemíkovou revoluci" # todo: NEW TRANSLATION
 ENG_foster_the_tech_revolution_desc: "Přímo před našima očima probíhá nová revoluce, křemíková revoluce. Technologie začínají měnit globální ekonomiky způsoby, jaké jsme dosud nepoznali. Bývalé venkovské a zemědělské společnosti se díky mikročipům a další elektronice proměnily v jedny z nejvýkonnějších ekonomik. I my musíme tento nový trend co nejdříve využít." # todo: NEW TRANSLATION
 ENG_uplift_traditional_industry: "Pozvednout tradiční průmysl" # todo: NEW TRANSLATION
 ENG_uplift_traditional_industry_desc: "Nepotřebujeme elektronickou módu, kterou je posedlá velká část světa. Místo toho se můžeme soustředit na to, o čem z historie víme, že funguje: tvrdý průmysl. Proč bychom měli riskovat s tak bezvýznamnými věcmi, které by mohly ohrozit naši ekonomiku?" # todo: NEW TRANSLATION
 ENG_prioritize_the_teachers: "Upřednostnit učitele" # todo: NEW TRANSLATION
 ENG_prioritize_the_teachers_desc: "Posílení role pedagogů ve společnosti přinese obrovské výhody, které se projeví v celém národě i regionu. Upevněním jejich role v životě každodenních civilistů [ENG.GetAdjective] si lidé konečně začnou vážit vzdělání tak, jak si skutečně zaslouží." # todo: NEW TRANSLATION
 ENG_prioritize_the_doctors: "Upřednostnit lékaře" # todo: NEW TRANSLATION
 ENG_prioritize_the_doctors_desc: "Lékaři brání lidem v umírání, zabraňují šíření nemocí a udržují širší pocit bezpečí v naší zemi. Podporou role lékařů a zdravotnického personálu dokážeme také povzbudit více lidí k obsazení pozic v NHS, které trpí vážným nedostatkem pracovníků." # todo: NEW TRANSLATION
 ENG_strengthening_communities: "Posilování komunit" # todo: NEW TRANSLATION
 ENG_strengthening_communities_desc: "Posílení komunit a tím i britské identity nám umožní podporovat silnější pocit národní jednoty. To nám umožní chránit hodnoty, kterých si nejvíce vážíme, a zároveň účinněji vytvářet společenskou soudržnost." # todo: NEW TRANSLATION
 ENG_to_europa_and_beyond: "Do Evropy a ještě dál!" # todo: NEW TRANSLATION
 ENG_to_europa_and_beyond_desc: "Nejprve jsme Evropané, teprve potom Britové. Zapomenout na náš regionální domov znamená zapomenout, kým jsme. Musíme usilovat o hlubší integraci s evropským kontinentem a Evropskou unií jako celkem, abychom mohli podporovat velkolepější vizi všech evropských národů." # todo: NEW TRANSLATION
 ENG_no_one_left_behind: "Nikoho nenechat za sebou" # todo: NEW TRANSLATION
 ENG_no_one_left_behind_desc: "Žádný Brit nezůstane pozadu v našem spěchu k velikosti. Všem pomůžeme a dovedeme je do cíle společenského pokroku. Společně překonáme tento velký zápas o úspěch." # todo: NEW TRANSLATION
 ENG_criminal_justice_reform: "Reforma trestní justice" # todo: NEW TRANSLATION
 ENG_criminal_justice_reform_desc: "Posílení našeho justičního systému zase posílí naše dlouholeté demokratické normy. Zefektivněním soudního procesu vzroste důvěra v demokratické instituce a zvýší se pravděpodobnost dlouhodobé podpory vlády." # todo: NEW TRANSLATION
 ENG_welfare_reform: "Reforma sociálního zabezpečení" # todo: NEW TRANSLATION
 ENG_welfare_reform_desc: "Důvěryhodný vztah s našimi voliči lze vybudovat pouze reformou systému sociálního zabezpečení. Ukážeme-li, že nám záleží na jejich každodenním životě, získáme tucet důvodů, proč by nás měli i nadále volit do úřadu." # todo: NEW TRANSLATION
 ENG_tax_reform: "Daňové reformy" # todo: NEW TRANSLATION
 ENG_tax_reform_desc: "§R„P-počkat… kam se poděly moje peníze?!“§!\n\nPřijetím daňových reforem nejen posílíme naši ekonomiku a státní pokladnu, ale také pokročíme ve financování našich sociálních reformních programů. Pro ty, kteří budou zdaněni, to však možná nebude příliš populární." # todo: NEW TRANSLATION
 ENG_productivity_challenge: "Výzva produktivity" # todo: NEW TRANSLATION
 ENG_productivity_challenge_desc: "Je stále obtížnější přimět některé naše pracovníky, aby… pracovali. Prosazením několika změn bychom je mohli znovu přimět k něčemu produktivnímu." # todo: NEW TRANSLATION
 ENG_britain_forward_not_back: "Británie vpřed, ne zpět" # todo: NEW TRANSLATION
 ENG_britain_forward_not_back_desc: "Stačí se podívat před sebe, abychom viděli, kam směřujeme. Pokud se neujmeme kontroly nad svou budoucností, náš osud bude v rukou náhody. To nechceme. Chceme vést naši zemi k velikosti, čehož lze dosáhnout pouze stanovením toho, co musíme nejprve udělat, abychom se tam dostali." # todo: NEW TRANSLATION
 ENG_competition_planning_and_regulation: "Plánování a regulace hospodářské soutěže" # todo: NEW TRANSLATION
 ENG_competition_planning_and_regulation_desc: "Bez regulace nemůžeme mít hospodářskou soutěž. Bez řádných zábran by korporace překročily meze a pohltily menší podniky, čímž by v podstatě vytlačily příjmy tisíců, ne-li milionů lidí." # todo: NEW TRANSLATION
 ENG_new_rights_new_choices: "Nová práva, nové volby" # todo: NEW TRANSLATION
 ENG_new_rights_new_choices_desc: "Poskytnutím větších práv v otázce, kdy chtějí pracovat, dokážeme zvýšit celostátní produktivitu. V současnosti některá pracoviště omezují práci pro lidi staršího důchodového věku a pomalu je vytlačují. Umožníme-li lidem nad důchodovým věkem znovu pracovat, přineseme větší ekonomickou stabilitu." # todo: NEW TRANSLATION
 ENG_supporting_science: "Podpora vědy" # todo: NEW TRANSLATION
 ENG_supporting_science_desc: "Podporou nových vědeckých těžebních metod zvýšíme schopnost zásobovat domácí výzkumné programy a rozšíříme možnosti vývozu dalšího zboží na mezinárodní trh." # todo: NEW TRANSLATION
 ENG_codify_key_of_convetions: "Kodifikovat klíč konvencí" # todo: NEW TRANSLATION
 ENG_codify_key_of_convetions_desc: "Konečnou kodifikací klíče konvencí proměníme politická pravidla v pravidla právní. Naše politika již nebude řízena tradicí, ale zákonem, a tím budeme moci dále rozvíjet lepší demokracii." # todo: NEW TRANSLATION
 ENG_generations_of_tomorrow: "Generace zítřka" # todo: NEW TRANSLATION
 ENG_generations_of_tomorrow_desc: "Reforma důchodového systému nám konečně umožní vytvořit pevnou záchrannou síť pro současné i budoucí generace. Mnozí lidé nyní dostávají příliš nízký příspěvek, nebo žádný, a je nejvyšší čas s tím něco udělat." # todo: NEW TRANSLATION
 ENG_fostering_entrepreneurship: "Podpora podnikání" # todo: NEW TRANSLATION
 ENG_fostering_entrepreneurship_desc: "Chceme, aby naši zemi zaplavili inovátoři. K tomu musíme začít vyčleňovat část vládních prostředků na vytvoření udržitelného prostředí pro ty, kteří jsou ochotni investovat." # todo: NEW TRANSLATION
 ENG_modern_transport_infrastructure: "Modernizace dopravní infrastruktury" # todo: NEW TRANSLATION
 ENG_modern_transport_infrastructure_desc: "Pokud jsou naše silnice rozbité a zanedbané, k čemu je dobré řídit? Investice do nových a inovativních infrastrukturních programů vydláždí cestu k lepší a funkčnější Británii." # todo: NEW TRANSLATION
 ENG_thriving_rural_scene: "Rozkvétající venkov" # todo: NEW TRANSLATION
 ENG_thriving_rural_scene_desc: "Naše venkovská sídla nesmí být ponechána větru dějin a zapomenuta. Místo toho tyto venkovské oblasti přijmeme a budeme dále podporovat jejich činnost." # todo: NEW TRANSLATION
 ENG_scraping_the_skies: "Škrábat se k nebi" # todo: NEW TRANSLATION
 ENG_scraping_the_skies_desc: "Chceme-li budovat naši image na mezinárodní scéně, budeme potřebovat několik věží, konkrétně takových, které svou velkolepostí ohromí celý svět." # todo: NEW TRANSLATION
 ENG_creative_cities: "Kreativní města" # todo: NEW TRANSLATION
 ENG_creative_cities_desc: "Podporou kulturních vlivů při navrhování nových městských lokalit vytvoříme ideální podmínky pro posílení ducha a morálky našeho lidu bez ohledu na to, kam se vydá." # todo: NEW TRANSLATION
 ENG_party_of_pensior_poverty: "Strana chudoby důchodců" # todo: NEW TRANSLATION
 ENG_party_of_pensior_poverty_desc: "Konzervativci, toryové neboli „Strana chudoby důchodců“, jak jim říkáme, ničí integritu našeho sociálního sektoru a aktivně zhoršují životní podmínky těch, kteří jsou odkázáni na důchody. Musíme zajistit, aby si lidé uvědomili jejich zpátečnické praktiky." # todo: NEW TRANSLATION
 ENG_fostering_home_ownership: "Podpora vlastnictví bydlení" # todo: NEW TRANSLATION
 ENG_fostering_home_ownership_desc: "Místo motivování lidí k životu z vládních prostředků jim pomůžeme získat domovy pro ně a jejich blízké. Budou tak moci klidně spát s vědomím, že nežijí na pozemku, který jim nepatří." # todo: NEW TRANSLATION
 ENG_social_housing: "Programy sociálního bydlení" # todo: NEW TRANSLATION
 ENG_social_housing_desc: "Buďme realisty, ceny domů začínají prudce růst a nic nenasvědčuje tomu, že by se tento trend zastavil. Musíme prosadit programy sociálního bydlení, které našim voličům poskytnou střechu nad hlavou a ochranu před přírodními živly." # todo: NEW TRANSLATION
 ENG_copyright_in_a_digital_age: "Autorské právo v digitálním věku" # todo: NEW TRANSLATION
 ENG_copyright_in_a_digital_age_desc: "Naše autorské zákony stále nejsou tam, kde by měly být, protože mnoho ustanovení chybí nebo je nejasných. Musíme kodifikovat naše předpisy a poskytnout médiím větší ochranu." # todo: NEW TRANSLATION
 ENG_strengthening_our_grids: "Posílit naše sítě" # todo: NEW TRANSLATION
 ENG_strengthening_our_grids_desc: "Naši lidé potřebují silnou, spolehlivou a stabilní energii pro každodenní život. Náhodným výpadkům se tu a tam nevyhneme, neměly by se však stát běžnou součástí každého dne. Posílením hlavních sítí zajistíme spolehlivost našeho energetického sektoru." # todo: NEW TRANSLATION
 ENG_strengthen_pension_credit: "Posílit důchodový kredit" # todo: NEW TRANSLATION
 ENG_strengthen_pension_credit_desc: "Poskytnutím státní dávky lidem v důchodovém věku s nízkými příjmy dokážeme zvýšit jejich týdenní příjem na minimální úroveň a pomoci s náklady na bydlení i dalšími výdaji." # todo: NEW TRANSLATION
 ENG_the_workers_of_yesterday: "Včerejší pracovníci" # todo: NEW TRANSLATION
 ENG_the_workers_of_yesterday_desc: "Nesmíme dovolit, aby práce minulých generací přišla vniveč. Rozšíříme důchodové programy pro ty, kteří odešli do důchodu, a možná nabídneme další výhody, pokud se rozhodnou předat své zkušenosti novým generacím." # todo: NEW TRANSLATION
 ENG_tenant_regulation: "Regulace nájemníků" # todo: NEW TRANSLATION
 ENG_tenant_regulation_desc: "Nesmíme opustit majitele domů, kteří pronajímají své nemovitosti ostatním. K nemovitostem je třeba přistupovat s respektem, a proto jsou regulace nezbytné k zajištění spokojenosti všech." # todo: NEW TRANSLATION
 ENG_a_future_fair_for_all: "Spravedlivá budoucnost pro všechny" # todo: NEW TRANSLATION
 ENG_a_future_fair_for_all_desc: "Zdá se, že jak se svět vyvíjí, životní podmínky lidí se stále zhoršují. Po vzrušení, které přinesl úsvit nového tisíciletí, lidé na celém světě doufali, že jejich vlády konečně změní své způsoby k lepšímu. Tak tomu však nebylo. Demokratický úpadek, rostoucí náklady a všeobecný chaos svedly svět z jeho cesty. Musíme udělat vše, co je v našich silách, aby Spojené království nespadlo do této spirály smrti." # todo: NEW TRANSLATION
 ENG_crime_and_immigration: "Kriminalita a migrace" # todo: NEW TRANSLATION
 ENG_crime_and_immigration_desc: "Pravicové síly volají po větších omezeních pro migranty. Chápeme, odkud tyto požadavky přicházejí, ale podlehnout jim by znamenalo odklonit se od základních principů naší strany a vydat se konzervativnějším směrem." # todo: NEW TRANSLATION
 ENG_democratic_reform: "Pokračování demokratické reformy" # todo: NEW TRANSLATION
 ENG_democratic_reform_desc: "V současnosti existují určité mezery, které umožňují přijímat autokratičtější rozhodnutí na úrovni státu. Je čas vzít věci do vlastních rukou a konečně prosadit v parlamentu návrh zákona, který přinutí ty, kdo z této politické nejasnosti těží, jednat." # todo: NEW TRANSLATION
 ENG_a_global_future: "Globální budoucnost" # todo: NEW TRANSLATION
 ENG_a_global_future_desc: "Nemůžeme se soustředit pouze na záležitosti státu, ale musíme věnovat pozornost také globálním otázkám. S ohledem na suverenitu ostatních států budeme usilovat o šíření vlivu [ENG.GetAdjective] po celém světě." # todo: NEW TRANSLATION
 ENG_national_renewal: "Národní obroda" # todo: NEW TRANSLATION
 ENG_national_renewal_desc: "Přeorientování politiky [ENG.GetAdjective] vedlo k určitému hnutí národní obrody, v němž lidé stále požadují změnu. Nezastavíme se ani neodpočineme a budeme dál přinášet změny. Dobré změny, samozřejmě." # todo: NEW TRANSLATION
 ENG_with_open_arms: "S otevřenou náručí" # todo: NEW TRANSLATION
 ENG_with_open_arms_desc: "Musíme si uvědomit význam migrantů. Ať už je přijmeme s otevřenou náručí, nebo ne, pokud je budeme nadále odmítat, přijdeme o významné talenty, které bychom jinak nezískali." # todo: NEW TRANSLATION
 ENG_community_payback: "Program odplaty komunitě" # todo: NEW TRANSLATION
 ENG_community_payback_desc: "Program odplaty komunitě umožní komunitám rozhodovat, jak mají být zločinci potrestáni. Může jít o délku trestu i typ veřejně prospěšných prací. Vše bude záležet na místních komunitách, ale prospěch z toho bude mít celý národ." # todo: NEW TRANSLATION
 ENG_checks_on_migration: "Kontroly migrace" # todo: NEW TRANSLATION
 ENG_checks_on_migration_desc: "Bez ohledu na to, jak moc migranty potřebujeme, nemůžeme je jednoduše vpustit bez předchozí prověrky. Zavedeme kontroly migrantů, abychom se ujistili, že skutečně nepředstavují hrozbu." # todo: NEW TRANSLATION
 ENG_australian_style_point_system: "Australský bodový systém" # todo: NEW TRANSLATION
 ENG_australian_style_point_system_desc: "Po vzoru našich australských přátel zavedeme bodový systém, v němž budou migranti přijímáni na základě svých dovedností a schopnosti přispět národu." # todo: NEW TRANSLATION
 ENG_tough_on_anti_social_behavior: "Tvrdý přístup k protispolečenskému chování" # todo: NEW TRANSLATION
 ENG_tough_on_anti_social_behavior_desc: "Naši lidé musí být motivováni k práci. Celodenní sezení doma nic nevyřeší. Mladé lidi přivedeme k práci tím, že jim umožníme stáže u policie a ozbrojených sil, zejména v obranném průmyslu." # todo: NEW TRANSLATION
 ENG_renewed_police_budget: "Obnovený rozpočet policie" # todo: NEW TRANSLATION
 ENG_renewed_police_budget_desc: "Naše policie nesmí být podfinancovaná. Musíme uznat význam silného a robustního policejního sboru, který zajistí bezpečnost našich komunit." # todo: NEW TRANSLATION
 ENG_established_refugee_programs: "Zavést programy pro uprchlíky" # todo: NEW TRANSLATION
 ENG_established_refugee_programs_desc: "Bez řádného programu pro uprchlíky k nám lidé prchající ze svých domovů přijdou bez ničeho, co by mohli nabídnout. Vytvoříme komplexní plán, který uprchlíky začlení do společnosti a umožní jim přispívat k ekonomice národa." # todo: NEW TRANSLATION
 ENG_streamlined_citizenship_process: "Zjednodušený proces získání občanství" # todo: NEW TRANSLATION
 ENG_streamlined_citizenship_process_desc: "Řekněme si to na rovinu, přidávat další překážky pro získání občanství není nutné. Umožnit rychlejší integraci bude z dlouhodobého hlediska výhodnější pro všechny." # todo: NEW TRANSLATION
 ENG_neighbourhood_police_teams: "Sousedské policejní týmy" # todo: NEW TRANSLATION
 ENG_neighbourhood_police_teams_desc: "Místo zvyšování nákladů na policii můžeme postupovat opačně. Vyzveme sousedství k vytváření policejních týmů a decentralizujeme justici natolik, aby bylo možné zločiny hlásit příslušným úřadům a řešit je bez toho, aby hlídkové jednotky musely být všude najednou." # todo: NEW TRANSLATION
 ENG_cctv_reduce_fear: "Kamerové systémy snižují strach" # todo: NEW TRANSLATION
 ENG_cctv_reduce_fear_desc: "Kamery na veřejných místech jsou nezbytnou součástí udržování národní a občanské bezpečnosti. Pokud lidé vědí, že zločinci budou dopadeni, zůstanou v klidu, zatímco pachatelé si před spácháním zločinu dvakrát rozmyslí své jednání." # todo: NEW TRANSLATION
 ENG_britain_can_be_better: "Británie může být lepší" # todo: NEW TRANSLATION
 ENG_britain_can_be_better_desc: "Díky správným změnám a reformám může být Británie lepší. Neznamená to, že je nyní špatná, ale vždy je prostor ke zlepšení. Britský lid pověřil naši stranu, Labouristickou stranu, aby vedla Británii k reformě. Nesmíme je zklamat a musíme udělat vše, co je v našich silách, aby jejich hlasy byly vyslyšeny." # todo: NEW TRANSLATION
 ENG_more_power_to_people: "Více moci lidem" # todo: NEW TRANSLATION
 ENG_more_power_to_people_desc: "Moc vlády musí být v rukou lidu. Politici přece pocházejí ze samotného lidu. Nesmíme dovolit vzestup politických dynastií a jejich převzetí moci." # todo: NEW TRANSLATION
 ENG_westminster_reinforced: "Posílený Westminster" # todo: NEW TRANSLATION
 ENG_westminster_reinforced_desc: "Někdy lidé přesně nevědí, o co žádají. V takových případech je třeba zvýšit zapojení vlády a umožnit politickým odborníkům zasáhnout a rozhodnout za ně." # todo: NEW TRANSLATION
 ENG_further_digital_governance: "Další digitalizace správy" # todo: NEW TRANSLATION
 ENG_further_digital_governance_desc: "Lidé by měli mít možnost svobodněji komunikovat s vládou. Internet je k tomu ideálním nástrojem a umožněním přístupu k vládním zdrojům prostřednictvím digitálního prostoru rozšíříme naše správní schopnosti bez větších problémů." # todo: NEW TRANSLATION
 ENG_a_union_of_nations: "Unie národů" # todo: NEW TRANSLATION
 ENG_a_union_of_nations_desc: "Británie není jeden národ, ale unie národů. Zajistíme, aby byl každý národ náležitě zastoupen, což uskutečníme tím, že mu poskytneme přístup k ekonomickým příležitostem." # todo: NEW TRANSLATION
 ENG_reconsider_the_lobbying_act: "Přehodnotit zákon o lobbingu" # todo: NEW TRANSLATION
 ENG_reconsider_the_lobbying_act_desc: "Zákon o lobbingu byl často chválen za výrazné zvýšení transparentnosti vlády tím, že vyžaduje od lobbistických skupin zveřejnění financování, reguluje jejich výdaje a podobně. Zároveň však ovlivnil naše aktivity a někteří volají po přezkoumání tohoto zákona." # todo: NEW TRANSLATION
 ENG_people_led_constitutional_convention: "Konvent vedený lidem" # todo: NEW TRANSLATION
 ENG_people_led_constitutional_convention_desc: "Vyzveme lid, aby vedl ústavní konvent, a umožníme pluralitě nahradit jednostrannost. Díky hlasu lidu bude jeho důvěra v nás zajištěna navždy." # todo: NEW TRANSLATION
 ENG_corporaet_led_constitutional_convention: "Konvent vedený korporacemi" # todo: NEW TRANSLATION
 ENG_corporaet_led_constitutional_convention_desc: "Korporace vědí, co je pro Británii nejlepší. Proto musíme při vedení země upřednostnit jejich zájmy před všemi ostatními. Koneckonců ony mají peníze." # todo: NEW TRANSLATION
 ENG_revised_town_laws: "Revidované městské zákony" # todo: NEW TRANSLATION
 ENG_revised_town_laws_desc: "Některé městské zákony stále obsahují značně zastaralá pravidla a předpisy. Je nejlepší je začít čistit, zvláště když některé z nich narušují činnost určitých průmyslových odvětví." # todo: NEW TRANSLATION
 ENG_replacing_the_house_of_lords: "Nahradit Sněmovnu lordů" # todo: NEW TRANSLATION
 ENG_replacing_the_house_of_lords_desc: "Sněmovna lordů je jednou z nejstarších institucí na světě, zároveň však patří k těm nejzaostalejším. Její neustálé vměšování do parlamentu z ní při přijímání zákonů činí velkou přítěž a je třeba s tím něco udělat." # todo: NEW TRANSLATION
 ENG_ulift_peerages: "Pozvednout šlechtické tituly" # todo: NEW TRANSLATION
 ENG_ulift_peerages_desc: "Prvním krokem k zabránění tomu, aby se Británie odklonila od svých tradic, je pozvednutí šlechtických titulů. Díky nim budeme moci chránit naše tradice a dvorskou kulturu." # todo: NEW TRANSLATION
 ENG_abolish_life_peerages: "Zrušit doživotní šlechtické tituly" # todo: NEW TRANSLATION
 ENG_abolish_life_peerages_desc: "Šlechtické tituly nejsou volené, jsou zcela dědičné nebo udělované. Na šlechtických titulech není nic demokratického a jejich zrušení výrazně omezí aristokratický vliv." # todo: NEW TRANSLATION
 ENG_common_expertise: "Odbornost obyčejných lidí" # todo: NEW TRANSLATION
 ENG_common_expertise_desc: "Potřebujeme odbornost obyčejného člověka, nikoli korporace, politika nebo cizince. Potřebujeme skutečné lidi z běžného života, kteří povedou národ ke světlejší a lepší budoucnosti." # todo: NEW TRANSLATION
 ENG_technocratic_expertise: "Technokratická odbornost" # todo: NEW TRANSLATION
 ENG_technocratic_expertise_desc: "Ti, kteří prokázali svou hodnotu, jsou téměř vždy bohatí a vzdělaní. Přivedení jejich odbornosti do vlády katapultuje pokrok Británie desetinásobně." # todo: NEW TRANSLATION
 ENG_labour_for_workers_and_ceos_alike: "Labouristé: pro dělníky i generální ředitele" # todo: NEW TRANSLATION
 ENG_labour_for_workers_and_ceos_alike_desc: "Musíme přestat odcizovat generální ředitele a vyšší vrstvy společnosti. Místo toho je musíme usmířit a usilovat o jednání a kompromis, který umožní lepší pracovní regulaci." # todo: NEW TRANSLATION
 ENG_the_queens_family: "Královnina rodina" # todo: NEW TRANSLATION
 ENG_the_queens_family_desc: "Síla panovnice nespočívá pouze v zákoně nebo tradici, ale také v kruhu lidí, kteří za ní stojí, když je stát pod tlakem. Ti, kteří jsou pozváni do vnitřního kruhu královny, budou jejím jménem disponovat vlivem, nikdy si však nesmějí plést blízkost s autoritou. Koruna je jedinou konstantou a královna rozhodne, jak jí bude její rodina sloužit." # todo: NEW TRANSLATION
 ENG_the_prince_trust: "Prince's Trust" # todo: NEW TRANSLATION
 ENG_the_prince_trust_desc: "Koruna přetrvává, protože se dokáže přizpůsobit, a jen málo nástrojů se ukázalo praktičtějších než Prince's Trust. Rozšířením jeho dosahu proměníme královskou patronaci v měřitelné příležitosti, školení, učňovské programy a cestu zpět do společnosti pro ty, kteří zůstali pozadu. Je to měkká síla s tvrdými výsledky a posiluje monarchii tam, kde na tom záleží nejvíce: v životech obyčejných Britů." # todo: NEW TRANSLATION
 ENG_harmony_doctrine: "Doktrína harmonie" # todo: NEW TRANSLATION
 ENG_harmony_doctrine_desc: "V době polarizace spočívá autorita monarchie v její schopnosti sjednocovat, aniž by vládla. Prosadíme doktrínu harmonie, tiché zprostředkování mezi vládou, průmyslem, náboženskými komunitami a občanskou společností, abychom zmírnili rozkol a obnovili národní soudržnost. Stát může přikazovat, ale Koruna může usmiřovat." # todo: NEW TRANSLATION
 ENG_climate_alarm_bell: "Zaznít na poplach kvůli klimatu" # todo: NEW TRANSLATION
 ENG_climate_alarm_bell_desc: "Varování již nejsou teoretická a odkládání nyní přináší národní náklady. Využijeme váhu platformy následníka trůnu k tomu, aby se klimatické riziko dostalo na program každého jednání, od energetické bezpečnosti po odolnost potravinového systému a plánování infrastruktury. Když palác promluví jasně, naslouchají i ty nejváhavější úřady." # todo: NEW TRANSLATION
 ENG_duchy_originals: "Duchy Originals" # todo: NEW TRANSLATION
 ENG_duchy_originals_desc: "Vévodství může být více než tradice; může být důkazem, že moderní správa je zisková. Rozšíříme Duchy Originals jako model udržitelné výroby, etických dodavatelských řetězců a venkovského podnikání, které udrží komunity životaschopné, aniž by je vyprázdnilo. Pokud má Koruna jít příkladem, ať je to příklad, který se sám uživí." # todo: NEW TRANSLATION
 ENG_heir_of_the_realm: "Následník říše" # todo: NEW TRANSLATION
 ENG_heir_of_the_realm_desc: "Alžbětina vláda definovala jednu éru, říše však musí vždy hledět k tomu, co přijde dál. Formalizujeme národní roli následníka, jeho větší viditelnost, hlubší přístup ke státním brífinkům a jasnější přítomnost v celé Unii. Kontinuita se nepředpokládá, na tu se připravuje." # todo: NEW TRANSLATION
 ENG_naval_prince: "Námořní princ" # todo: NEW TRANSLATION
 ENG_naval_prince_desc: "Královská služba není divadlo, ale nárok na důvěryhodnost získanou v uniformě. Umístíme námořní identitu vévody z Yorku do popředí ceremoniálních a náborových snah a posílíme pouto mezi Korunou a flotilou. V nejistých vodách mohou symboly povinnosti stále držet národ pevně." # todo: NEW TRANSLATION
 ENG_naval_prince_tt: "Odemkne §Y$ENG_prince_andrew_leader_name$§! jako §Ynejvyšší vojenské velení§!" # todo: NEW TRANSLATION
 ENG_appoint_trade_representative: "Jmenovat královského obchodního zástupce" # todo: NEW TRANSLATION
 ENG_appoint_trade_representative_desc: "Britský vliv cestuje nejlépe, když přichází s vládním mandátem i královskou prestiží. Jmenujeme královského obchodního zástupce, který bude otevírat dveře, uklidňovat partnery a poskytovat vývozcům významného obhájce při jednáních. Tam, kde ministři vyjednávají, může Koruna propůjčit váhu." # todo: NEW TRANSLATION
 ENG_emerging_markets_circuit: "Okruh rozvíjejících se trhů" # todo: NEW TRANSLATION
 ENG_emerging_markets_circuit_desc: "Růst světa se přesouvá a Británie si nemůže dovolit přijít pozdě. Spustíme okruh rozvíjejících se trhů tvořený návštěvami, investičními fóry a strategickými kontakty, jehož cílem bude ukotvit britské podnikání v další vlně globální poptávky. Cíl je jednoduchý: vztahy nyní, vliv později." # todo: NEW TRANSLATION
 ENG_digital_enterprise_patronage: "Podpora digitálního podnikání" # todo: NEW TRANSLATION
 ENG_digital_enterprise_patronage_desc: "Obchod se stále více zapisuje do kódu, nikoli do nákladu. Královskou patronací pozvedneme britské digitální podnikání, fintech, kybernetickou bezpečnost, pokročilé služby a startupy, které je rozvíjejí, a proměníme prestiž v investice a investice v pracovní místa. Pokud se dokáže modernizovat palác, dokáže se modernizovat i ekonomika." # todo: NEW TRANSLATION
 ENG_duty_of_the_crown: "Povinnost Koruny" # todo: NEW TRANSLATION
 ENG_duty_of_the_crown_desc: "Královský titul není štít, ale závazek. Veřejnou roli vévody postavíme na viditelné službě, disciplinovaném zastupování a výsledcích, které ospravedlňují místo instituce v národním životě. V monarchii je povinnost jedinou měnou, která nikdy neztrácí hodnotu." # todo: NEW TRANSLATION
 ENG_workhorse_of_the_crown: "Tahoun Koruny" # todo: NEW TRANSLATION
 ENG_workhorse_of_the_crown_desc: "Monarchie přežívá díky více než okázalosti; přežívá díky neúnavné a viditelné službě. Povýšíme model povinnosti princezny Royal, plný rozvrh, místní angažmá a tiché plnění úkolů, na standard, který veřejnost rozpozná jako skutečnou práci. Když je Koruna zpochybňována, toto je odpověď, kterou by měla dát." # todo: NEW TRANSLATION
 ENG_carers_recognition_campaign: "Kampaň za uznání pečujících" # todo: NEW TRANSLATION
 ENG_carers_recognition_campaign_desc: "Péči v Británii často zajišťují lidé, kterým se dostává jen malého uznání a ještě menšího odpočinku. Pod královskou patronací zahájíme národní kampaň za uznání pečujících a budeme tlačit na vládu i občanskou společnost, aby neformální pečující získali praktickou úlevu a veřejný respekt. Země, která ctí službu v zahraničí, musí ctít i službu doma." # todo: NEW TRANSLATION
 ENG_discipline_service: "Disciplína ve službě" # todo: NEW TRANSLATION
 ENG_discipline_service_desc: "Koruna, která bloudí, se stává terčem; Koruna, která je disciplinovaná, se znovu stává institucí. Zpřísníme standardy chování, zlepšíme rutiny královské domácnosti a budeme požadovat profesionální výkon při každé veřejné povinnosti. Annin příklad není okouzlující, ale je trvalý." # todo: NEW TRANSLATION
 ENG_princess_admiral_royal_navy: "Admirálka Royal Navy" # todo: NEW TRANSLATION
 ENG_princess_admiral_royal_navy_desc: "Royal Navy je více než technika; je to tradice, identita a národní dosah. Prohloubíme námořní roli princezny Royal, abychom posílili morálku, nábor a pouto služby s národem. V míru i krizi musí flotila vědět, že Koruna stojí při ní." # todo: NEW TRANSLATION
 ENG_princess_admiral_royal_navy_tt: "Odemkne §Y$ENG_princess_anne_leader_name$§! jako §Ynejvyšší vojenské velení§!" # todo: NEW TRANSLATION
 ENG_colonel_of_horse_logistics: "Plukovník jezdectva a logistiky" # todo: NEW TRANSLATION
 ENG_colonel_of_horse_logistics_desc: "Armády se pohybují díky disciplíně a logistice, nikoli díky proslovům. Formalizujeme vojenská jmenování princezny Royal s důrazem na připravenost, zásobování a neokázalou kompetenci, která vyhrává tažení. Moderní síly potřebují zastánce, kteří respektují práci v zázemí." # todo: NEW TRANSLATION
 ENG_quiet_professionalism: "Tichý profesionalismus" # todo: NEW TRANSLATION
 ENG_quiet_professionalism_desc: "V zdrženlivosti je síla a v důslednosti důvěryhodnost. Tichý profesionalismus učiníme provozní filozofií paláce: méně divadla, více výsledků a stabilní přítomnost v celé Unii. Pokud Británie chce monarchii, která si zaslouží své místo, takto ho získá." # todo: NEW TRANSLATION
 ENG_chairman_international_award: "Předseda Mezinárodní ceny" # todo: NEW TRANSLATION
 ENG_chairman_international_award_desc: "Odkaz je zachován institucemi, které přežijí jednotlivé vlády. Posílíme vedení vévody v rámci Mezinárodní ceny, abychom budovali praktické dovednosti, občanské sebevědomí a vůdcovství příští generace. Monarchie, která investuje do mládeže, investuje do vlastní budoucnosti." # todo: NEW TRANSLATION
 ENG_trustee_network: "Síť správců" # todo: NEW TRANSLATION
 ENG_trustee_network_desc: "Vliv se nevyhlašuje, ale udržuje prostřednictvím správních rad, charit a tichého mechanismu veřejného života. Rozšíříme síť správců, která propojí důvěryhodné instituce s královskou patronací, zlepší koordinaci a zvýší standardy v celém sektoru. Když Koruna organizuje odpovědnost, získává autoritu." # todo: NEW TRANSLATION
 ENG_commonwealth_youth_outreach: "Program pro mládež Commonwealthu" # todo: NEW TRANSLATION
 ENG_commonwealth_youth_outreach_desc: "Commonwealth nepřežije jen díky ceremoniím, musí být relevantní pro mladé lidi. Spustíme dlouhodobé programy výměn, školení a společných občanských iniciativ, které udrží britské vazby živé v životech budoucích vůdců. Měkká síla je nejsilnější, když je osobní." # todo: NEW TRANSLATION
 ENG_production_guild_patronage: "Patronace produkčních cechů" # todo: NEW TRANSLATION
 ENG_production_guild_patronage_desc: "Průmysl je stejně tak kulturou jako obchodem a britský kreativní i výrobní sektor představuje strategické aktivum. Královskou patronací podpoříme cechy, studia a kvalifikovaná řemesla, díky nimž je britská výroba globálně konkurenceschopná. Prestiž přináší pozornost a pozornost přináší investice." # todo: NEW TRANSLATION
 ENG_steady_hand: "Pevná ruka" # todo: NEW TRANSLATION
 ENG_steady_hand_desc: "V rodině definované pozorností veřejnosti se stabilita stává strategickou ctností. Vévodu představíme jako pevnou ruku, spolehlivou, předvídatelnou a zaměřenou na službu, nikoli na titulky. Někdy je nejcennější královskou rolí prostě zabránit tomu, aby se instituce vychýlila." # todo: NEW TRANSLATION
 ENG_duke_charities: "Vévodovy charity" # todo: NEW TRANSLATION
 ENG_duke_charities_desc: "Odkaz vévody z Edinburghu se měří institucemi, které vybudoval, nikoli proslovy, které pronesl. Konsolidujeme a profesionalizujeme jeho charitativní portfolio, abychom zajistili dlouhodobé financování, lepší správu a trvalou důvěru veřejnosti. Má-li být monarchie respektována, její filantropie musí být stejně disciplinovaná jako její ceremonie." # todo: NEW TRANSLATION
 ENG_international_award_conference: "Konference Mezinárodní ceny" # todo: NEW TRANSLATION
 ENG_international_award_conference_desc: "Síla Ceny vždy spočívala v její globální síti a společných standardech. Svoláme konferenci Mezinárodní ceny, abychom sladili partnery, rozšířili účast a modernizovali programy pro novou generaci. Královský odkaz se stává systémem, když je organizován mezinárodně." # todo: NEW TRANSLATION
 ENG_wwf_president_emeritus: "Emeritní prezident WWF" # todo: NEW TRANSLATION
 ENG_wwf_president_emeritus_desc: "Ochrana přírody již není okrajovou záležitostí; je jiným názvem pro národní bezpečnost. Využijeme postavení vévody jako emeritního prezidenta WWF k povýšení ochrany volně žijících zvířat, biodiverzity a péče o životní prostředí mezi skutečné politické priority. Když palác představí přírodu jako strategickou otázku, vlády ji budou hůře ignorovat." # todo: NEW TRANSLATION
 ENG_prince_phillip_medal: "Medaile prince Philipa" # todo: NEW TRANSLATION
 ENG_prince_phillip_medal_desc: "Symboly mají význam, když odměňují správné ctnosti. Zřídíme medaili prince Philipa na počest praktické služby, inženýrství, průmyslu, krizové reakce a neokázalé kompetence, která udržuje Británii v chodu. Je to královské poselství v kovu: rozhodují výsledky." # todo: NEW TRANSLATION
 ENG_strength_and_stay: "Síla a vytrvalost" # todo: NEW TRANSLATION
 ENG_strength_and_stay_desc: "Monarchie přetrvává díky tomu, že pod tlakem zůstává pevná. Do veřejného vystupování domácnosti promítneme starou vévodovu filozofii, disciplínu, odolnost a odmítání podléhat pomíjivým módám. Když přijdou bouře, Koruna musí působit neochvějně." # todo: NEW TRANSLATION
 ENG_from_sandhurst_to_service: "Od Sandhurstu ke službě" # todo: NEW TRANSLATION
 ENG_from_sandhurst_to_service_desc: "Příští generace Koruny musí být důvěryhodná ve více než jen ceremoniích. Veřejnou roli prince ukotvíme v disciplinované službě, vojenském profesionalismu, povinnosti a praktickém vedení získaném těžkou cestou. Sandhurst není odznak, ale standard." # todo: NEW TRANSLATION
 ENG_royal_foundation: "Královská nadace" # todo: NEW TRANSLATION
 ENG_royal_foundation_desc: "Moderní monarchie se měří dopadem, nikoli tradicí. Rozšíříme Královskou nadaci jako hlavní nástroj prince: profesionální programy, měřitelné výsledky a partnerství, která přežijí politické změny. Pokud má palác vést, musí přinášet výsledky." # todo: NEW TRANSLATION
 ENG_heads_together: "Heads Together" # todo: NEW TRANSLATION
 ENG_heads_together_desc: "Odolný národ potřebuje více než silné hranice; potřebuje silné mysli. Povýšíme Heads Together na národní program gramotnosti v oblasti duševního zdraví, omezování stigmatizace a praktické podpory pro ty, kteří trpí v tichosti. Koruna nemůže nařídit soucit, ale může ho učinit běžným." # todo: NEW TRANSLATION
 ENG_veteran_armed_forces_support: "Podpořit naše veterány" # todo: NEW TRANSLATION
 ENG_veteran_armed_forces_support_desc: "Služba nekončí odložením uniformy. Posílíme podporu veteránů a ozbrojených sil prostřednictvím charit, zaměstnavatelů a koordinace s vládou, abychom zajistili, že ti, kteří nesli břemeno, nebudou následně odvrženi. Země, která žádá oběti, musí zaručit důstojnost." # todo: NEW TRANSLATION
 ENG_bridge_to_the_future: "Most do budoucnosti" # todo: NEW TRANSLATION
 ENG_bridge_to_the_future_desc: "Alžbětina vláda představuje kontinuitu. Vilém musí představovat přechod. Prince utváříme jako most do budoucnosti, moderního v metodách, disciplinovaného v tónu a zakořeněného v legitimitě služby. Další kapitola monarchie začíná ještě před předáním koruny." # todo: NEW TRANSLATION
 ENG_queen_eldest: "Rada nejstaršího" # todo: NEW TRANSLATION
 ENG_queen_eldest_desc: "Královna se obrací na svou nejstarší větev, aby v zahraničí promítla kontinuitu a doma sebevědomí. S veřejným dosahem následníka a přístupem královského vyslance může Koruna otevírat dveře, které ministři otevřít nedokážou, a udržovat britský hlas slyšitelný v každém hlavním městě." # todo: NEW TRANSLATION
 ENG_queen_middle: "Střední pilíř" # todo: NEW TRANSLATION
 ENG_queen_middle_desc: "Královna spoléhá na střední generaci, která udržuje instituci v chodu pomocí disciplíny a výsledků. Její síla nespočívá v okázalosti, ale v rozvrhu, standardech a tiché kompetenci, která chrání Korunu před skandálem a úpadkem." # todo: NEW TRANSLATION
 ENG_queen_youngest: "Most k zítřku" # todo: NEW TRANSLATION
 ENG_queen_youngest_desc: "Královna ukotvuje domácnost v osvědčené stabilitě a zároveň připravuje další éru přímo před očima veřejnosti. S institucionální váhou zkušeného manžela a moderní služební minulostí dalšího následníka monarchie signalizuje, že obnova bude řízená, nikoli chaotická." # todo: NEW TRANSLATION
 ENG_triumph_of_the_crown: "Triumf Koruny" # todo: NEW TRANSLATION
 ENG_triumph_of_the_crown_desc: "Rovnováha se změnila a Koruna již nevládne pouze díky tradici. S monarchií v čele státu vstupuje Británie do nového uspořádání, v němž je loajalita odměňována, nesouhlas řízen a národní směr určován z paláce. Říše se nyní bude pohybovat jedním směrem a svět pochopí, že Koruna se vrátila k vládnutí." # todo: NEW TRANSLATION
 ENG_the_queens_speech: "[ENG_the_queens_speech_focus_title]" # todo: NEW TRANSLATION
 ENG_the_queens_speech_desc: "[ENG_the_queens_speech_focus_description]" # todo: NEW TRANSLATION
 ENG_the_queens_speech_title: "Královnina řeč" # todo: NEW TRANSLATION
 ENG_the_queens_speech_desc_key: "Národ naslouchá jinak, když panovnice mluví jako hlas státu, nikoli ceremonie. V královnině řeči bude vyhlášeno nové politické uspořádání a program vlády bude podřízen mandátu Koruny. Od tohoto dne bude politika nést královskou autoritu a Británie bude jednat jako říše s jedinou vůlí." # todo: NEW TRANSLATION
 ENG_the_kings_speech_title: "Králova řeč" # todo: NEW TRANSLATION
 ENG_the_kings_speech_desc_key: "Národ naslouchá jinak, když panovník mluví jako hlas státu, nikoli ceremonie. V králově řeči bude vyhlášeno nové politické uspořádání a program vlády bude podřízen mandátu Koruny. Od tohoto dne bude politika nést královskou autoritu a Británie bude jednat jako říše s jedinou vůlí." # todo: NEW TRANSLATION
 ENG_restore_civil_liberties: "Obnovit občanské svobody" # todo: NEW TRANSLATION
 ENG_restore_civil_liberties_desc: "Koruna, která vládne, musí také prokázat, že se dokáže ovládnout. Zrušíme mimořádné pravomoci, obnovíme řádný proces a znovu potvrdíme práva, která činí britskou autoritu legitimní. Ať to naši odpůrci nazývají slabostí, říše tomu bude říkat sebevědomí." # todo: NEW TRANSLATION
 ENG_rule_sword_sceptre: "Vláda meče a žezla" # todo: NEW TRANSLATION
 ENG_rule_sword_sceptre_desc: "Staré zábrany selhaly a říše nebude řízena váháním. Spojíme královskou autoritu s nástroji státní moci a zajistíme, aby byla vůle Koruny prosazována bez prodlení. Británie bude spořádaná, rozhodná a obávaná těmi, kdo si pletou zdvořilost se slabostí." # todo: NEW TRANSLATION
 ENG_royal_prerogative_activation: "Aktivovat královskou výsadu" # todo: NEW TRANSLATION
 ENG_royal_prerogative_activation_desc: "V ústavních stínech existují pravomoci, které se používají střídmě a hovoří se o nich opatrně. Aktivujeme královskou výsadu, abychom stát rozhýbali rychlostí, obešli ochromení a donutili vládní aparát ke sjednocení. Když Koruna jedná, říše následuje." # todo: NEW TRANSLATION
 ENG_a_bid_soft_power: "Úsilí o měkkou sílu" # todo: NEW TRANSLATION
 ENG_a_bid_soft_power_desc: "Moc se neměří pouze loděmi a rozpočty, ale také prestiží, přístupem a schopností udávat tón mezinárodnímu životu. Z Koruny učiníme motor britské měkké síly, rozšíříme kulturní diplomacii, královskou patronaci v zahraničí a sítě vlivu, které přežijí každou vládu. Zatímco jiní budou nahánět titulky, my budeme utvářet příběh." # todo: NEW TRANSLATION
 ENG_commonwealth_summit: "Hostit summit Commonwealthu" # todo: NEW TRANSLATION
 ENG_commonwealth_summit_desc: "Commonwealth není ozvěnou impéria, ale sítí, kterou lze proměnit ve strategii. Pod královským vedením uspořádáme summit Commonwealthu, abychom zajistili nové závazky v oblasti obchodu, bezpečnostní spolupráce a společného rozvoje. Má-li Británie znovu vést, začne to shromážděním přátel v jedné místnosti." # todo: NEW TRANSLATION
 ENG_crown_procurement_program: "Program nákupů Koruny" # todo: NEW TRANSLATION
 ENG_crown_procurement_program_desc: "Monarchie, která vládne, se nemůže spoléhat na pomalé smlouvy a ministerské spory o pravomoci. Zřídíme program nákupů Koruny, centralizujeme nákupy, urychlíme přezbrojení a odměníme firmy, které dodávají včas a ve velkém měřítku. Když podepíše palác, průmysl se pohne." # todo: NEW TRANSLATION
 ENG_modernize_royal_navy: "Modernizovat Royal Navy" # todo: NEW TRANSLATION
 ENG_modernize_royal_navy_desc: "Britský dosah byl vždy námořní a Koruna nebude vládnout říši, která nedokáže ovládat své námořní trasy. Modernizujeme Royal Navy novými trupy, propracovanější doktrínou a logistikou schopnou udržet operace daleko od domácích vod. Ať soupeři sledují naše přístavy a počítají, co z nich vyplouvá." # todo: NEW TRANSLATION
 ENG_raf_army_overhaul: "Reformovat RAF a armádu" # todo: NEW TRANSLATION
 ENG_raf_army_overhaul_desc: "Flotila bez leteckého krytí a pozemních sil je symbolem, nikoli štítem. Reformujeme RAF a armádu moderními velitelskými strukturami, vylepšeným vybavením a výcvikem určeným pro válku vysoké intenzity. Koruna nebude riskovat svou autoritu se zastaralými silami." # todo: NEW TRANSLATION
 ENG_leverage_crown_estate: "Využít Crown Estate" # todo: NEW TRANSLATION
 ENG_leverage_crown_estate_desc: "Crown Estate je více než dědictví, je to strategický nástroj. Využijeme jeho majetek k financování národních projektů, stabilizaci klíčových průmyslových odvětví a ukotvení dlouhodobého rozvoje, aniž bychom museli za každou libru prosit parlament. Pokud má monarchie vládnout, musí se také naučit investovat." # todo: NEW TRANSLATION
 ENG_national_service_act: "Přijmout zákon o národní službě" # todo: NEW TRANSLATION
 ENG_national_service_act_desc: "Říše, která chce bezpečí, musí být ochotná nést svůj díl břemene. Přijmeme zákon o národní službě, abychom vybudovali lidské zdroje, disciplínu a společný smysl pro povinnost v celém národě. Někteří tomu budou říkat nátlak, Koruna tomu bude říkat povinnost." # todo: NEW TRANSLATION
 ENG_new_constitutional_charter: "Sepsat novou ústavní chartu" # todo: NEW TRANSLATION
 ENG_new_constitutional_charter_desc: "Staré uspořádání bylo napsáno pro jinou Británii a pod tlakem již neobstojí. Sepíšeme novou ústavní chartu, která vymezí pravomoc Koruny, meze parlamentu a práva, jež zůstanou mimo politiku. Jakmile bude zpečetěna, říše získá jasno a jasno je moc." # todo: NEW TRANSLATION
 ENG_secure_succession: "Zajistit následnictví" # todo: NEW TRANSLATION
 ENG_secure_succession_desc: "Monarchie, která vládne, si nemůže dovolit nejistotu na vrcholu. Zajistíme následnictví jasným zákonem, disciplinovaným plánováním a veřejným potvrzením mandátu následníka. Kontinuita se nepředpokládá, ta se vynucuje." # todo: NEW TRANSLATION
 ENG_rule_councillorship: "Vláda prostřednictvím rady" # todo: NEW TRANSLATION
 ENG_rule_councillorship_desc: "Parlamentní vláda plodí frakce, ale Koruna může vládnout prostřednictvím důvěryhodných rukou. Zmocníme Královskou radu poradců k tvorbě politiky, dohledu nad ministerstvy a udržování souladu státu s palácem. Británii bude řídit kompetence a loajalita, nikoli stranické smlouvání." # todo: NEW TRANSLATION
 ENG_convene_foreign_secretary_cabinet: "Svolat kabinet ministra zahraničí" # todo: NEW TRANSLATION
 ENG_convene_foreign_secretary_cabinet_desc: "Diplomacii nelze improvizovat, když je v sázce autorita Koruny. Svoláme kabinet ministra zahraničí ke koordinaci velvyslanců, zpravodajství, obchodních vyslanců a obranných plánovačů pod jediným vedením. Británie bude v zahraničí mluvit jedním hlasem a bude to ten správný." # todo: NEW TRANSLATION
 ENG_champion_liberal_values: "Prosazovat liberální hodnoty" # todo: NEW TRANSLATION
 ENG_champion_liberal_values_desc: "Má-li monarchie vládnout, musí vládnout podle principů, které Británie pozná jako vlastní. Budeme prosazovat liberální hodnoty, bránit svobodné instituce a dokazovat, že královská autorita může koexistovat s právy a zdrženlivostí. Koruna bude silná a legitimní." # todo: NEW TRANSLATION
 ENG_european_outreach: "Evropské kontakty" # todo: NEW TRANSLATION
 ENG_european_outreach_desc: "Británie si nemůže dovolit izolaci na vlastním prahu. Spustíme evropskou kontaktní kampaň, obnovíme kanály, zajistíme spolupráci tam, kde se naše zájmy překrývají, a zabráníme soupeřům určovat podmínky na kontinentu bez nás. Koruna bude jednat přímo a Evropa si toho všimne." # todo: NEW TRANSLATION
 ENG_close_proximity_nato: "Úzké vztahy s NATO" # todo: NEW TRANSLATION
 ENG_close_proximity_nato_desc: "NATO není pouze pakt, ale také nástroj odstrašení a přístupu. Přiblížíme se Alianci, abychom zajistili sdílení zpravodajských informací, interoperabilitu a strategickou hloubku, přičemž zachováme svobodu jednání Koruny. Británie bude spojencem, nikoli podřízeným." # todo: NEW TRANSLATION
 ENG_joint_operational_command: "Zřídit společné operační velení" # todo: NEW TRANSLATION
 ENG_joint_operational_command_desc: "Soupeření mezi složkami plýtvá časem a čas zabíjí. Zřídíme společné operační velení, které sjednotí plánování, logistiku a provádění operací námořnictva, armády a RAF pod jedinou válečnou doktrínou. Když Koruna nařídí akci, všechny složky se pohnou jako jedna." # todo: NEW TRANSLATION
 ENG_reaffirm_special_relationship: "Obnovit zvláštní vztah" # todo: NEW TRANSLATION
 ENG_reaffirm_special_relationship_desc: "Moc respektuje moc a Spojené státy zůstávají nejrozhodnějším partnerem říše. Znovu potvrdíme zvláštní vztah prostřednictvím zpravodajské spolupráce, koordinace obrany a společného strategického plánování na nejvyšší úrovni. Koruna udrží Británii u stolu, kde se rozhoduje o světě." # todo: NEW TRANSLATION
 ENG_royal_charitable_initiative: "Královská charitativní iniciativa" # todo: NEW TRANSLATION
 ENG_royal_charitable_initiative_desc: "Vláda je snazší, když říše věří, že je o ni pečováno. Spustíme královskou charitativní iniciativu, která nasměruje financování, dobrovolníky a pozornost veřejnosti ke komunitám pod tlakem a dokáže, že Koruna může vládnout se soucitem. Loajalita roste nejrychleji tam, kde pomoc přichází jako první." # todo: NEW TRANSLATION
 ENG_time_for_common_sense: "Je čas na zdravý rozum" # todo: NEW TRANSLATION
 ENG_time_for_common_sense_desc: "Čas na zdravý rozum nastal právě teď. Roky vlády Labouristické strany odvedly náš lid od ideálů, které dělaly Británii tím, čím kdysi byla. Nesmíme dovolit, aby úsilí velkých mužů, jako byl Winston Churchill, přišlo vniveč. Proměníme Británii v to, čím vždy měla být: velmoc." # todo: NEW TRANSLATION
 ENG_knowing_who_we_are: "Vědět, kým jsme" # todo: NEW TRANSLATION
 ENG_knowing_who_we_are_desc: "Nejprve jsme Britové, teprve potom Evropané. Nesmíme zapomenout, kým jsme: dědici supervelmoci, jakou svět předtím nikdy neviděl. Slunce nad Británií skutečně nikdy nezapadalo a tak to zůstane, pokud s tím budeme moci něco udělat." # todo: NEW TRANSLATION
 ENG_a_world_leader: "Světový lídr" # todo: NEW TRANSLATION
 ENG_a_world_leader_desc: "Jsme Britové, nikomu se neklaníme. Jsme světoví lídři a šampioni svobody, proto nesmíme dovolit, aby náš vliv světového lídra upadl. Znovu se prosadíme jako předvoj globálního vedení." # todo: NEW TRANSLATION
 ENG_fighting_the_power_of_brussels: "Boj proti moci Bruselu" # todo: NEW TRANSLATION
 ENG_fighting_the_power_of_brussels_desc: "Brusel překročil své pravomoci v administrativě. Svou rétorikou aktivně podkopává nezávislost našich národů a ohrožuje naši schopnost rozhodovat, co chceme pro Británii." # todo: NEW TRANSLATION
 ENG_a_civilized_society: "Civilizovaná společnost" # todo: NEW TRANSLATION
 ENG_a_civilized_society_desc: "Jako civilizovaná společnost se Británie nepodřídí propagandě ostatních. Proto je třeba rychle zasáhnout proti těm, kteří chtějí radikálně změnit náš způsob života." # todo: NEW TRANSLATION
 ENG_a_stronger_society: "Silnější společnost" # todo: NEW TRANSLATION
 ENG_a_stronger_society_desc: "Naše společnost bude jednotnější a silnější než kdykoli předtím. Nesmíme dovolit ostatním rozbít naši jednotu pod záminkou „reformy“. Naše společnost může zesílit pouze tehdy, budeme-li nadále chránit své základní hodnoty." # todo: NEW TRANSLATION
 ENG_a_staunch_ally: "Pevný spojenec" # todo: NEW TRANSLATION
 ENG_a_staunch_ally_desc: "Pro naše partnery v NATO jsme pevným spojencem a ničím jiným! Každý, kdo se odváží obvinit nás z příživnictví, nespolehlivosti nebo čehokoli mezi tím, se může vrátit domů, odkud přišel." # todo: NEW TRANSLATION
 ENG_town_and_country: "Město a venkov" # todo: NEW TRANSLATION
 ENG_town_and_country_desc: "Jsme zemí, která nesmí zapomenout na svá malá, venkovská a skromná města. Musíme na tyto lidi pamatovat ze všech sil a motivovat je, aby pokračovali." # todo: NEW TRANSLATION
 ENG_a_more_flexible_europe: "Flexibilnější Evropa" # todo: NEW TRANSLATION
 ENG_a_more_flexible_europe_desc: "Evropa potřebuje být ve svých zahraničněpolitických cílech celkově flexibilnější. Má-li se náš kontinent jako celek stát silnějším, musí Evropa opustit agendu „sjednocení“ a pracovat na větší pružnosti." # todo: NEW TRANSLATION
 ENG_rural_friendly_transport_services: "Doprava přátelská k venkovu" # todo: NEW TRANSLATION
 ENG_rural_friendly_transport_services_desc: "Naše dopravní služby nejsou k venkovským komunitám příliš vstřícné. Budeme muset najít způsob, jak tyto lidi uspokojit." # todo: NEW TRANSLATION
 ENG_industrial_friendly_transport_services: "Doprava přátelská k průmyslu" # todo: NEW TRANSLATION
 ENG_industrial_friendly_transport_services_desc: "Pracující člověk se musí dostat do práce a zpět bez problémů. Budeme muset zvážit obnovu nebo alespoň zlepšení našich dopravních služeb pro průmyslové oblasti." # todo: NEW TRANSLATION
 ENG_no_army_outside_of_europe: "Žádná armáda mimo Evropu" # todo: NEW TRANSLATION
 ENG_no_army_outside_of_europe_desc: "Proč se britští vojáci nacházejí mimo hranice Evropy? Co mají dělat v Asii, Africe nebo na Blízkém východě? Místo toho se musíme soustředit na udržení našich jednotek v Evropě." # todo: NEW TRANSLATION
 ENG_abolish_centrally_planned_housing: "Zrušit centrálně plánované bydlení" # todo: NEW TRANSLATION
 ENG_abolish_centrally_planned_housing_desc: "Místo zaměření rozpočtu na centrálně plánovanou bytovou agendu můžeme tyto prostředky přesměrovat na důležitější věci." # todo: NEW TRANSLATION
 ENG_coming_to_the_aid_of_others: "Přijít na pomoc ostatním" # todo: NEW TRANSLATION
 ENG_coming_to_the_aid_of_others_desc: "Na světě jsou lidé, kteří zoufale potřebují naši pomoc, a my jsme tu, abychom jim ji poskytli." # todo: NEW TRANSLATION
 ENG_global_matters_global_problems: "Globální záležitosti, globální problémy" # todo: NEW TRANSLATION
 ENG_global_matters_global_problems_desc: "Proč by nás mělo zajímat, s čím se potýkají ostatní? Je to jejich problém, ne náš! Musí si ho vyřešit sami." # todo: NEW TRANSLATION
 ENG_credit_based_public_transport: "Veřejná doprava podle kreditu" # todo: NEW TRANSLATION
 ENG_credit_based_public_transport_desc: "Pracujete? Skvěle, nemusíte se obávat placení jízdného. Umožníme-li pracujícím využívat veřejnou dopravu zdarma, motivujeme lidi k hledání zaměstnání a práci." # todo: NEW TRANSLATION
 ENG_safe_haven_not_safe_touch: "Bezpečný přístav, ne snadný cíl" # todo: NEW TRANSLATION
 ENG_safe_haven_not_safe_touch_desc: "Jsme bezpečným přístavem pro ty, kteří skutečně potřebují pomoc. Pokud však necháme přijít kohokoli, rozloží naši zemi." # todo: NEW TRANSLATION
 ENG_are_you_thinking_what_were_thinking: "Myslíte na to, na co myslíme my?" # todo: NEW TRANSLATION
 ENG_are_you_thinking_what_were_thinking_desc: "" # todo: NEW TRANSLATION
 ENG_power_to_the_bank_of_england: "Moc Bank of England" # todo: NEW TRANSLATION
 ENG_power_to_the_bank_of_england_desc: "Bank of England je v horším stavu než kdy dříve. Proto je nezbytné jednat a tuto instituci posílit." # todo: NEW TRANSLATION
 ENG_british_dream: "Britský sen" # todo: NEW TRANSLATION
 ENG_british_dream_desc: "Britský sen už dlouhou dobu mnozí nepoznali. Je to sen a ambice, aby všichni Britové prosperovali, aniž by museli trpět důsledky společných ztrát." # todo: NEW TRANSLATION
 ENG_whats_wrong_with_discipline: "Co je špatného na disciplíně?" # todo: NEW TRANSLATION
 ENG_whats_wrong_with_discipline_desc: "Zdá se, že naše školy změkly a začaly se vyhýbat nezbytným disciplinárním opatřením. Je naší povinností naučit naše mladé slušnému chování a zajistíme, aby to pedagogové věděli." # todo: NEW TRANSLATION
 ENG_across_the_board_tax_slashes: " plošné snížení daní" # todo: NEW TRANSLATION
 ENG_across_the_board_tax_slashes_desc: "Pokud plošně snížíme daně, lidé ze všech společenských vrstev pocítí výraznou úlevu od svého břemene. Nesmíme nikoho diskriminovat!" # todo: NEW TRANSLATION
 ENG_tax_slashes_only_for_some: "Snížení daní pouze pro některé" # todo: NEW TRANSLATION
 ENG_tax_slashes_only_for_some_desc: "Nemáme rozpočet ani vůli snížit daně všem. Budeme muset postupovat koordinovaně a snížit daně pouze tam, kde z toho budeme mít prospěch." # todo: NEW TRANSLATION
 ENG_icnreased_control_for_administrators: "Větší kontrola pro správce" # todo: NEW TRANSLATION
 ENG_icnreased_control_for_administrators_desc: "Lidé pracující v našich školách musí mít možnost vyjádřit se k otázkám svých institucí. To nám umožní vychovat nové učence." # todo: NEW TRANSLATION
 ENG_keeping_hospitals_clean: "Udržovat nemocnice čisté" # todo: NEW TRANSLATION
 ENG_keeping_hospitals_clean_desc: "Musíme udržovat naše nemocnice čisté, a to jak po stránce fyzického vzhledu, tak jejich důvěryhodnosti." # todo: NEW TRANSLATION
 ENG_corporate_invitations: "Pozvání korporací" # todo: NEW TRANSLATION
 ENG_corporate_invitations_desc: "Musíme pozvat korporace, aby nám pomohly rozhodovat o hospodářské politice. Jsou srdcem naší ekonomiky a bez nich bychom nebyli ničím." # todo: NEW TRANSLATION
 ENG_more_police_less_crime: "Více policie, méně zločinu" # todo: NEW TRANSLATION
 ENG_more_police_less_crime_desc: "Je to přece jasné, ne? Pokud budeme mít v ulicích více policistů, bude jistě méně zločinů." # todo: NEW TRANSLATION
 ENG_cutting_wait_times: "Zkrácení čekacích dob" # todo: NEW TRANSLATION
 ENG_cutting_wait_times_desc: "Lidé čekají na zdravotní služby příliš dlouho. Je načase s tím něco udělat a zkrátit čekací doby na polovinu!" # todo: NEW TRANSLATION
 ENG_turnaround_schools: "Nápravné školy" # todo: NEW TRANSLATION
 ENG_turnaround_schools_desc: "Pokud studenti nedokážou ve třídě správně sedět a poslouchat učitele, budeme muset vymyslet něco jiného. Poslat je do nápravné školy tento problém s malou menšinou našich studentů konečně vyřeší." # todo: NEW TRANSLATION
 ENG_structural_overhaul_of_nhs: "Strukturální reforma NHS" # todo: NEW TRANSLATION
 ENG_structural_overhaul_of_nhs_desc: "NHS již nemůže pokračovat současným způsobem. Pohlcuje všechny naše peníze a nechává pacienty nemocné a čekající před dveřmi. Musíme zahájit řadu reforem, které NHS přebudují od základů." # todo: NEW TRANSLATION
 ENG_trusting_local_professionals: "Důvěřovat odborníkům" # todo: NEW TRANSLATION
 ENG_trusting_local_professionals_desc: "Proč opravovat něco, co není rozbité? Zdravotní otázky přenecháme zdravotnickým odborníkům a dovolíme NHS fungovat s několika drobnými úpravami." # todo: NEW TRANSLATION
 ENG_keeping_up_our_guard: "Udržovat ostražitost" # todo: NEW TRANSLATION
 ENG_keeping_up_our_guard_desc: "Nesmíme polevit v ostražitosti jen proto, že je nyní klid. Musíme předvídat nejrůznější scénáře, dokonce i v období stability a prosperity." # todo: NEW TRANSLATION
 ENG_benefitting_the_taxpayer: "Ve prospěch daňového poplatníka" # todo: NEW TRANSLATION
 ENG_benefitting_the_taxpayer_desc: "Komu sloužíme, ne-li daňovému poplatníkovi? Musíme zavést politiky, které daňové poplatníky ujistí, že jejich peníze nepřijdou nazmar." # todo: NEW TRANSLATION
 ENG_invitation_to_the_government_of_britain: "Pozvání britské vlády" # todo: NEW TRANSLATION
 ENG_invitation_to_the_government_of_britain_desc: "" # todo: NEW TRANSLATION
 ENG_get_britain_moving_again: "Znovu rozpohybovat Británii" # todo: NEW TRANSLATION
 ENG_get_britain_moving_again_desc: "Nastal čas znovu rozpohybovat Británii. Už nikdy více pomalá, metodická a konvenční strategie čekání, až se ekonomika sama napraví. Vezmeme věci do vlastních rukou." # todo: NEW TRANSLATION
 ENG_cleanup_westminster: "Vyčistit Westminster" # todo: NEW TRANSLATION
 ENG_cleanup_westminster_desc: "Westminster je nepořádek přesycený byrokracií a přehnanými zásahy úřadů. Je načase vzít na celý systém kladivo a místo uklidit." # todo: NEW TRANSLATION
 ENG_big_society_not_big_government: "Velká společnost, ne velká vláda" # todo: NEW TRANSLATION
 ENG_big_society_not_big_government_desc: "Proč potřebujeme velkou vládu? Pokud je naše společnost dostatečně dobrá, proč sledovat, spravovat a diktovat každý aspekt jejího života? Místo toho omezíme vládu a necháme společnost dělat, co umí." # todo: NEW TRANSLATION
 ENG_household_debt_management_programs: "Programy správy dluhů domácností" # todo: NEW TRANSLATION
 ENG_household_debt_management_programs_desc: "Někdy lidé jednoduše nedokážou splatit své dluhy, a to je v pořádku. Zavedeme programy správy dluhů, které část jejich dluhu převezmou nebo jim pomohou vytvořit plán jeho splacení." # todo: NEW TRANSLATION
 ENG_bigger_place_for_educators: "Větší prostor pro pedagogy" # todo: NEW TRANSLATION
 ENG_bigger_place_for_educators_desc: "Země se musí více otevřít našim pedagogům. Neoceňujeme je zdaleka tak, jak bychom měli, zejména s ohledem na práci, kterou odvádějí." # todo: NEW TRANSLATION
 ENG_the_most_family_friendly_country: "Nejvstřícnější země pro rodiny" # todo: NEW TRANSLATION
 ENG_the_most_family_friendly_country_desc: "Naše země musí být otevřenější přijímání rodin a podpoře zakládání rodin. Naše populace nemůže zůstat malá a stagnující, musíme růst a podporovat dobré hodnoty." # todo: NEW TRANSLATION
 ENG_knowledge_for_industry: "Znalosti pro průmysl" # todo: NEW TRANSLATION
 ENG_knowledge_for_industry_desc: "Místo abychom nechali znalosti přijít vniveč jinde, mohli bychom část tohoto duševního potenciálu přesměrovat do nových průmyslových odvětví, třeba do vojenského průmyslu." # todo: NEW TRANSLATION
 ENG_power_of_recall: "Právo na odvolání" # todo: NEW TRANSLATION
 ENG_power_of_recall_desc: "Je zřejmé, že někteří premiéři lžou, a pokud nedodrží své sliby, musí být odvoláni. Musíme lidem umožnit odvolat premiéry, které již nechtějí v čele." # todo: NEW TRANSLATION
 ENG_a_more_balanced_economy: "Vyváženější ekonomika" # todo: NEW TRANSLATION
 ENG_a_more_balanced_economy_desc: "Naše ekonomika je kvůli desetiletím neschopnosti Labouristické strany v žalostném stavu. Je čas dát věci znovu do pořádku!" # todo: NEW TRANSLATION
 ENG_bye_bye_bureaucracy: "Sbohem, byrokracie" # todo: NEW TRANSLATION
 ENG_bye_bye_bureaucracy_desc: "Kdo potřebuje velkou vládu, když můžeme mít velkou svobodu? V každodenním životě našich voličů není třeba byrokracie, ale rozšířených svobod ano." # todo: NEW TRANSLATION
 ENG_case_by_case_intervention: "Zásah případ od případu" # todo: NEW TRANSLATION
 ENG_case_by_case_intervention_desc: "Nemůžeme se jednoduše vzdát možnosti vyjádřit se k otázkám veřejného významu jen proto, že odmítáme větší vládu. Místo toho musíme každý případ posoudit individuálně a usilovat o lepší řešení." # todo: NEW TRANSLATION
 ENG_protecting_childhood: "Chránit dětství" # todo: NEW TRANSLATION
 ENG_protecting_childhood_desc: "Naše mládež je nyní vystavena velkému riziku újmy ze strany nemocných jedinců prostřednictvím různých kanálů, ať už internetu, nebo ulic. Musíme podniknout další kroky k ochraně dětství a umožnit dětem růst a rozkvět." # todo: NEW TRANSLATION
 ENG_investigate_lost_funds: "Vyšetřit ztracené prostředky" # todo: NEW TRANSLATION
 ENG_investigate_lost_funds_desc: "Před několika lety z nějakého důvodu zmizely velké částky vládních peněz. Je čas zahájit řádné vyšetřování a zjistit, co se stalo." # todo: NEW TRANSLATION
 ENG_a_more_transparent_government: "Transparentnější vláda" # todo: NEW TRANSLATION
 ENG_a_more_transparent_government_desc: "Naše vláda zdaleka není dostatečně transparentní a musíme podniknout další kroky, aby naši voliči věděli, co se ve Westminsteru děje." # todo: NEW TRANSLATION
 ENG_petitions_for_debate: "Petice k projednání" # todo: NEW TRANSLATION
 ENG_petitions_for_debate_desc: "Pokud lidem umožníme získat významný počet podpisů pod peticí za změnu, můžeme ji předložit parlamentu k přezkoumání a přímo zavést zpětnou vazbu veřejnosti." # todo: NEW TRANSLATION
 ENG_public_reading_stage: "Fáze veřejného čtení" # todo: NEW TRANSLATION
 ENG_public_reading_stage_desc: "Umožníme internetové fórum, na němž budou lidé komentovat a diskutovat o změnách projednávaných v parlamentu, čímž zvýšíme transparentnost a kontakt vlády s veřejností." # todo: NEW TRANSLATION
 ENG_for_the_common_man: "Pro obyčejného člověka" # todo: NEW TRANSLATION
 ENG_for_the_common_man_desc: "Naše vláda je pro obyčejného člověka, ne pro ty, kteří tahají za nitky. Prosadíme cílené reformy, které umožní větší politickou aktivitu mezi běžnými vrstvami." # todo: NEW TRANSLATION
 ENG_for_the_wealthy_man: "Pro bohatého člověka" # todo: NEW TRANSLATION
 ENG_for_the_wealthy_man_desc: "Co mají chudí lidé vůbec společného s vládou? Většina z nich jsou levicoví povaleči, kteří nechtějí nic jiného než státní podporu, aby nemuseli pracovat. Zaměříme se na ty členy společnosti, kteří skutečně pracují a přispívají k ekonomice." # todo: NEW TRANSLATION
 ENG_a_brighter_more_secure_future: "Světlejší a bezpečnější budoucnost" # todo: NEW TRANSLATION
 ENG_a_brighter_more_secure_future_desc: "" # todo: NEW TRANSLATION
 ENG_operation_dagger: "Operace Dagger" # todo: NEW TRANSLATION
 ENG_operation_dagger_desc: "Perský záliv kdysi ovládaly naše síly a naše schopnost určovat, co do něj proudí a co z něj odchází, byla téměř bezproblémová. Dnes jsme v horší vyjednávací pozici vůči regionálním aktérům a musíme se spoléhat na své vyjednávací trumfy, abychom něčeho dosáhli. Zmocníme-li se Musandamu, znovu získáme mocenskou pozici v Zálivu." # todo: NEW TRANSLATION
 ENG_operation_barras: "Operace Barras" # todo: NEW TRANSLATION
 ENG_operation_barras_desc: "Obdrželi jsme zprávy, že milice „West Side Niggaz“, novináři a hlasateli běžně označovaná jako „West Side Boys“, zajala několik britských vojáků a drží je jako rukojmí. Jsme pod tlakem, abychom zasáhli a zachránili jejich životy, a vojenské velení připravilo operaci Barras. Máme také možnost během operace podniknout další kroky k obsazení životně důležitých zdrojů; není to však povinné." # todo: NEW TRANSLATION
 ENG_operation_coastal_star: "Operace Coastal Star" # todo: NEW TRANSLATION
 ENG_operation_coastal_star_desc: "Gambie se nebezpečně posouvá k autoritářství a nestabilitě a rozhodně se vymyká našemu vlivu. Musíme nějak zasáhnout a přimět ji změnit kurz, jinak by ji mohla následovat celá západní Afrika." # todo: NEW TRANSLATION
 ENG_operation_delta_guard: "Operace Delta Guard" # todo: NEW TRANSLATION
 ENG_operation_delta_guard_desc: "Nigerijci zjevně nevědí, jak řídit stát, a my máme povinnost něco udělat s promarněným černým zlatem v okolí delty. Jinak bychom ho nechali přijít vniveč, a to nikdo nechce. Operace Delta Guard nám umožní znovu nastolit ekonomickou dominanci v Nigérii a příjmy jistě prospějí státu." # todo: NEW TRANSLATION
 ENG_the_sun_which_never_set: "Slunce, které nikdy nezapadalo" # todo: NEW TRANSLATION
 ENG_the_sun_which_never_set_desc: "Slunce nad Británií skutečně nikdy nezapadá a my zajistíme, aby tomu tak zůstalo." # todo: NEW TRANSLATION
 ENG_operation_resolute_banner: "Operace Resolute Banner" # todo: NEW TRANSLATION
 ENG_operation_resolute_banner_desc: "Srbská vláda nadále ohrožuje Kosovo, a proto jsme nuceni zasáhnout a stanovit červenou linii." # todo: NEW TRANSLATION
 ENG_falklands_policy: "Politika Falkland" # todo: NEW TRANSLATION
 ENG_falklands_policy_desc: "Navzdory našemu menšímu střetu s Argentinou o Falklandy před několika desetiletími zůstává vzpomínka na konflikt v myslích mnoha lidí stále čerstvá. Můžeme na ostrovech prosazovat novou politiku a možná podniknout další kroky." # todo: NEW TRANSLATION
 ENG_regime_change_in_zimbabwe: "Operace Safeguard" # todo: NEW TRANSLATION
 ENG_regime_change_in_zimbabwe_desc: "Dlouholetý diktátor Zimbabwe, [ZIM.GetLeader], musí být svržen jakýmikoli nezbytnými prostředky. Jeho útlak britského lidu i obyvatel Zimbabwe nesmí zůstat bez povšimnutí a spravedlnost musí být vykonána rychle." # todo: NEW TRANSLATION
 ENG_operation_east_divide: "Operace Eastern Divide" # todo: NEW TRANSLATION
 ENG_operation_east_divide_desc: "Suez je právoplatně britským územím a bez něj jsme nuceni podstupovat útrapy „mezinárodních obchodních regulací“. Proto se pokusíme s Egypťany vyjednat částečnou kontrolu nad Sinají, jinak nám nezbude než s tím něco udělat." # todo: NEW TRANSLATION
 ENG_operation_ninety_seven: "Operace „97“" # todo: NEW TRANSLATION
 ENG_operation_ninety_seven_desc: "Předání Hongkongu Číňanům byla chyba, a navíc závažná. Musíme hledat nové způsoby, jak Hongkong znovu dostat pod náš vliv, chceme-li se znovu etablovat jako ekonomický hegemon." # todo: NEW TRANSLATION
 ENG_the_wonga_coup: "Seznam Wonga" # todo: NEW TRANSLATION
 ENG_the_wonga_coup_desc: "Rovníková Guinea leží nad rozsáhlými zásobami ropy, k nimž chtějí britští finančníci, včetně významných osobností, jako je Mark Thatcher, syn bývalé premiérky Margaret Thatcherové, získat přednostní práva v $STATE_319$. Teodoro Obiang Nguema Mbasogo je v izolované pozici a opoziční vůdce Severo Moto Nsá se jeví jako vhodnější alternativa. Spiklenci chtějí pomocí žoldnéřů svrhnout Obianga a dosadit Motoa do funkce prezidenta.  " # todo: NEW TRANSLATION
 devolution.1.t: "Konstituenty usilují o schválení zákonů ke snížení závislosti" # todo: NEW TRANSLATION
 devolution.1.d: "Nedávný vývoj v zemi přiměl naše konstituenty k prosazování politik zaměřených na snížení jejich závislosti na ústřední vládě. Máme možnost tyto zákony vetovat, avšak takový krok může vést k větší nespokojenosti." # todo: NEW TRANSLATION
 devolution.1.a: "Schválit je" # todo: NEW TRANSLATION
 devolution.1.b: "Vetovat je" # todo: NEW TRANSLATION
 devolution.1.c: "Ukaž mi jednotlivé zákony" # todo: NEW TRANSLATION
 devolution.2.t: "Skotský zákon" # todo: NEW TRANSLATION
 devolution.2.d: "Skotský parlament předložil vládě zákon, který zvýší jeho autonomii a posune ho směrem k decentralizovanějšímu státu. Vetování tohoto zákona je může rozzlobit, jeho schválení je však posune směrem k decentralizaci." # todo: NEW TRANSLATION
