 ENG_trans_atlantic_defence: "Transatlantická obrana" # todo: NEW TRANSLATION
 ENG_harmony_doctrine_idea: "Doktrína harmonie" # todo: NEW TRANSLATION
 ENG_harmony_doctrine_idea_desc: "Doktrína harmonie považuje ekologickou rovnováhu za národní zájem a zaměřuje vliv Koruny na péči o půdu, vodu a odolnost vůči změně klimatu. Tlačí vládu a průmysl k udržitelné výrobě, čistší energii a dlouhodobé ochraně přírody, aniž by obětovala stabilitu. Británie bude prosperovat tím, že bude žít v rámci svých možností, a palác bude trvat na tom, že příroda je součástí státní správy." # todo: NEW TRANSLATION
 ENG_State_17_Paramilitary_Activity: "Paramilitární aktivita:" # todo: NEW TRANSLATION
 ENG_State_17_Paramilitary_Activity_desc: "Navzdory pokroku dosaženému Velkopáteční dohodou zůstává v Severním Irsku aktivních mnoho republikánských a loajalistických paramilitárních organizací. Ačkoli mnohé z nich formálně vyhlásily příměří, tyto skupiny si nadále udržují struktury, zásoby zbraní a vliv v místních komunitách. Mnohé se podílejí na organizovaném zločinu, včetně pašování, obchodu s drogami, vydírání a trestných útoků. \n\n§YBude odstraněno, pokud již nebudeme ovládat $STATE_17$.§!" # todo: NEW TRANSLATION
