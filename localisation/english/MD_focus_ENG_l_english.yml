 ENG_unlock_the_next_era_TT: "Převedeme [IOM.GetFlag] ostrov Man na [ADS.GetFlag] §Hobranné síly Albionu§!\n - Půjde o novou skupinu PMC pod naší přímou kontrolou\n - Budeme ji moci využít k rozštěpení NATO prostřednictvím náboru, uplácení a přesvědčování vojenských velitelů, politiků a civilistů v členských státech NATO\n - Bude financována z našeho rozpočtu a bude mít vlastní stálou profesionální armádu" # todo: NEW TRANSLATION
