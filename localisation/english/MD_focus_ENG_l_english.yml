 devolution.7.d: "Každý den stojí moderátoři zpráv před davy lidí požadujícími vyhlášení celostátního referenda, které má rozhodnout, zda Wales zůstane součástí [ENG.GetName]. Westminster je pochopitelně obecně proti této myšlence, avšak její přímé vetování by mohlo vyvolat nestabilitu." # todo: NEW TRANSLATION
 devolution.7.a: "Dobrá, uvidíme, co se stane" # todo: NEW TRANSLATION
 devolution.7.b: "Vetovat jej" # todo: NEW TRANSLATION
 devolution.20.t: "Likvidace zbraní se hroutí" # todo: NEW TRANSLATION
 devolution.20.d: "Nezávislá mezinárodní komise pro likvidaci zbraní pozastavila svou činnost. Napětí v ulicích rostlo rychleji, než inspektoři stačili ověřovat sklady, a vedení polovojenských organizací stáhlo své vyjednavače, aby nevypadalo, že odzbrojuje v době, kdy ulice hoří. Loajalistické i republikánské organizace trvají na tom, že zbraně nikdy nebyly překážkou, a z rozpadu procesu obviňují jedna druhou. Nic z toho, co bylo vyřazeno z použití, se nevrátí, ale nic dalšího už také nebude předáno a návrat hnutí k jednacímu stolu bude nyní mnohem obtížnější, protože jeho radikálové mohou tvrdit, že měli pravdu." # todo: NEW TRANSLATION
 devolution.20.a: "Snížit napětí a zkusit to znovu" # todo: NEW TRANSLATION
 devolution.21.t: "Trvale vyřazeno z použití" # todo: NEW TRANSLATION
 devolution.21.d: "Komise oznámila, že byla svědkem likvidace celého zbývajícího arzenálu. Zapečetěné sklady pušek, semtexu, minometů a těžkých kulometů byly pod nezávislým dohledem trvale znepřístupněny, přičemž svědky byli duchovní z obou komunit. Disidentské frakce, které po léta odsuzovaly mírový proces jako zradu, tak přišly o jedinou věc, kvůli níž se vyplatilo jej odsuzovat. Nábor se zhroutil, fundraisingové sítě ve Spojených státech vyschly a zvláštní oddělení soudí, že to, co zbylo, je spíše kriminálním pozůstatkem než povstáním. Severní Irsko ještě není smířené, ale poprvé od roku 1969 není ozbrojené." # todo: NEW TRANSLATION
 devolution.21.a: "Válka skončila" # todo: NEW TRANSLATION
 devolution.23.t: "Westminster nabízí sjednocení" # todo: NEW TRANSLATION
 devolution.23.d: "Hlasování o hranici přineslo většinu pro sjednocené Irsko a britská vláda je podle podmínek Dohody povinna toto přání uskutečnit. Londýn formálně pozval Dublin, aby převzal svrchovanost nad šesti hrabstvími. Nabídka je skutečná, stejně jako účet, který s ní přichází: dva miliony lidí, dotace, kterou Westminster hradí už desetiletí, policejní služba, které polovina obyvatel stále nedůvěřuje, a unionistická komunita, která hlasovala proti a nikam neodchází. Přijetí znamená, že republika zdědí vše spolu s nejstarší ambicí irské politiky. Odmítnutí znamená říci většině na severu, že ji republika nechce." # todo: NEW TRANSLATION
 devolution.23.a: "Nesvobodné Irsko nikdy nebude v míru" # todo: NEW TRANSLATION
 devolution.23.b: "Nejsme připraveni převzít Sever" # todo: NEW TRANSLATION
 devolution.24.t: "Hlasování o hranici selhává" # todo: NEW TRANSLATION
 devolution.24.d: "Hlasy jsou sečteny a Unie trvá. Účast byla na obou stranách vysoká a kampaň udělala to, co kampaně v Severním Irsku vždy dělají: připomněla všem, co je rozděluje. Když však byla otázka skutečně položena, odpověď zněla ne. Nacionalističtí politici se již začali přít o to, zda nebylo hlasování vyhlášeno příliš brzy, zatímco unionistické strany výsledek považují za řešení, nikoli za odklad. Ministr pro Severní Irsko potvrdil, že další hlasování se v dohledné době konat nebude." # todo: NEW TRANSLATION
 devolution.24.a: "Otázka je prozatím zodpovězena" # todo: NEW TRANSLATION
 devolution.25.t: "Dublin přijímá" # todo: NEW TRANSLATION
 devolution.25.d: "Taoiseach potvrdil sněmovně, že republika převezme svrchovanost nad Severním Irskem. Převod proběhne podle podmínek Dohody, přičemž součástí ujednání budou záruky pro unionistickou komunitu a britské občanství zůstane zachováno všem, kdo o něj stojí. Není zde žádná porážka, kterou by bylo třeba pomstít, ani smlouva vnucená pod hrozbou zbraní. Století irské otázky končí hlasováním, předáním moci a velkým množstvím lidí v Ulsteru, kteří toto místo nikdy nenazvou domovem." # todo: NEW TRANSLATION
 devolution.25.a: "Lid promluvil" # todo: NEW TRANSLATION
 devolution.26.t: "Dublin odmítá" # todo: NEW TRANSLATION
 devolution.26.d: "Republika odmítla. Ministři v Dublinu byli na veřejnosti zdvořilí a v soukromí otevření: samotná dotace by pohltila jejich rozpočet, bezpečnostní břemeno nejsou schopni nést a ve dvaceti šesti hrabstvích není zájem zdědit unionistickou menšinu, která je považuje za cizí mocnost. Sever hlasoval pro odchod a bylo mu řečeno, že nemá kam jít. Nacionalistické veřejné mínění odmítnutí vnímá jako ponížení a následky ponese Westminster." # todo: NEW TRANSLATION
 devolution.26.a: "Zůstává nám provincie" # todo: NEW TRANSLATION
 devolution.27.t: "Ulsterské povstání" # todo: NEW TRANSLATION
 devolution.27.d: "Stormont zmizel, Dohoda je mrtvou literou a ústavní záruka, která udržovala republikánské hnutí v politice, zmizela s ní. To, co začalo jako nepokoje po jejím zrušení, se změnilo v něco, co hlavní konstábl již odmítá označovat za narušování veřejného pořádku. Policejní stanice byly obsazeny, armádní hlídky jsou za denního světla napadány těžkými zbraněmi a prozatímní správa, která si nárokuje pravomoc nad šesti hrabstvími, vyhlásila nezávislost provincie na Koruně. Když Británie vedla tuto válku naposledy, trvalo třicet let a vyjednané řešení, než skončila. Tentokrát se není o co opřít." # todo: NEW TRANSLATION
 devolution.27.a: "Pak ji získáme zpět silou" # todo: NEW TRANSLATION
 devolution.28.t: "Povstání na druhé straně hranice" # todo: NEW TRANSLATION
 devolution.28.d: "Britové roztrhali Dohodu a Sever se otevřeně bouří. Prozatímní vláda v Belfastu požádala Dublin o uznání, zbraně a vojáky a žádost byla zveřejněna natolik otevřeně, že mlčení bude považováno za odpověď. Články dva a tři byly pozměněny, nikoli zapomenuty, a zde existuje skupina, která na tento okamžik čekala celý život. Existuje však také britská armáda, britské jaderné odstrašení a všechny argumenty, které republika od roku 1998 uváděla: hranice se změní souhlasem a ničím jiným." # todo: NEW TRANSLATION
 devolution.28.a: "Uznat prozatímní vládu a vyrazit na pochod" # todo: NEW TRANSLATION
 devolution.28.b: "Vyzbrojit je a nic nepřiznávat" # todo: NEW TRANSLATION
 devolution.28.c: "Tohle není naše válka" # todo: NEW TRANSLATION
 devolution.10.t: "Volby v konstituentních státech" # todo: NEW TRANSLATION
 devolution.10.d: "Nastal čas voleb v našich konstituentních státech. Každý konstituent zvolí nové premiéry ve svých parlamentech, kteří budou buď pro nezávislost, nebo pro-[ENG.GetName]. Pravděpodobnost zvolení proindependistických členů závisí na míře agitace v jednotlivých konstituentech." # todo: NEW TRANSLATION
 devolution.10.a: "Dobře" # todo: NEW TRANSLATION
 britain_md.100.t: "Operace Dagger se blíží" # todo: NEW TRANSLATION
 britain_md.100.d: "Musandam leží ve strategicky významném regionu a tvoří dýku Perského zálivu. Hormuzským průlivem denně proplouvá nespočet tankerů a konvojů. Vzhledem k rostoucí nestabilitě regionu nejsme schopni zajistit ochranu této námořní trasy. Pokud se nám podaří dostat provincii pod naši kontrolu, budeme v lepší pozici k ochraně našich flotil a prostředků v regionu." # todo: NEW TRANSLATION
 britain_md.100.a: "Zkusit uzavřít dohodu s Ománem" # todo: NEW TRANSLATION
 britain_md.100.b: "Na vyjednávání není čas, vstoupit" # todo: NEW TRANSLATION
 britain_md.101.t: "[ENG.GetName] nás žádá o Musandam" # todo: NEW TRANSLATION
 britain_md.101.d: "Britové za námi přišli k jednání. Přesněji řečeno, přišli kvůli našemu území. Po vyslechnutí britského návrhu naši diplomaté rozzlobeně odešli, neschopni se ovládnout poté, co slyšeli, že se Britové pokoušejí vyjednávat o Musandamu. Takto agresivní požadavek jistě naše obyvatelstvo pobouří k nepříčetnosti. Britové však znovu uvedli, že odmítnutí takového požadavku jim nezanechá jinou možnost než „použít jiné prostředky“." # todo: NEW TRANSLATION
 britain_md.101.a: "Nikdy!" # todo: NEW TRANSLATION
 britain_md.101.b: "Jakou máme jinou možnost?" # todo: NEW TRANSLATION
 britain_md.102.t: "Omán odmítá vyjednávat" # todo: NEW TRANSLATION
 britain_md.102.d: "Ománská vláda dala jasně najevo, že nemá zájem o žádnou formu vyjednávání, a místo toho se rozhodla naše diplomaty odmítnout." # todo: NEW TRANSLATION
 britain_md.102.a: "Nenechávají nám jinou možnost" # todo: NEW TRANSLATION
 britain_md.102.b: "Zapomeňme na to" # todo: NEW TRANSLATION
 britain_md.103.t: "Omán nám předkládá podmínky" # todo: NEW TRANSLATION
 britain_md.103.d: "Ománská vláda učinila moudrý krok a rozhodla se s námi vyjednávat, dokonce nám předložila podmínky. Požaduje se po nás zaplacení vysoké částky předem a záruka ochrany Ománu po určitou dobu. Odmítnutí této nabídky by znamenalo, že nám Omán neposkytne práva k Musandamu." # todo: NEW TRANSLATION
 britain_md.103.a: "Dobrá" # todo: NEW TRANSLATION
 britain_md.103.b: "Ne, získáme ho jiným způsobem" # todo: NEW TRANSLATION
 britain_md.103.c: "Zapomeňme na to" # todo: NEW TRANSLATION
