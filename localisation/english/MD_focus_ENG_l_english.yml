 ENG_charles_1_idea_desc: "Charles získal titul prince z Walesu jako následník britského trůnu. Tento titul, udělený listinou a potvrzený slavnostní investiturou, vyjadřoval jeho postavení hlavního nástupce Koruny a jeho trvalé spojení s Walesem i širšími državami." # todo: NEW TRANSLATION
