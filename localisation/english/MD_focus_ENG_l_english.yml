 devolution.5.d: "Každý den stojí moderátoři zpráv před davy lidí požadujícími vyhlášení celostátního referenda, které má rozhodnout, zda Skotsko zůstane součástí [ENG.GetName]. Westminster je pochopitelně obecně proti této myšlence, avšak její přímé vetování by mohlo vyvolat nestabilitu." # todo: NEW TRANSLATION
