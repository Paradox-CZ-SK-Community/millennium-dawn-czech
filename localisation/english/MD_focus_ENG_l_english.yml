 devolution.6.d: "Každý den stojí moderátoři zpráv před davy lidí požadujícími vyhlášení celostátního referenda, které má rozhodnout, zda Severní Irsko zůstane součástí [ENG.GetName]. Westminster je pochopitelně obecně proti této myšlence, avšak její přímé vetování by mohlo vyvolat nestabilitu." # todo: NEW TRANSLATION
