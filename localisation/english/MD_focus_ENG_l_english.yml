 ENG_william_1_idea: "Vévoda z Cambridge" # todo: NEW TRANSLATION
 ENG_william_1_idea_desc: "Titul vévody z Cambridge byl princi Williamovi udělen jako významné královské vyznamenání označující jeho roli přední osobnosti nastupující generace. Panovník jej tradičně uděluje prominentním členům královské rodiny; titul přináší prestiž a jasné očekávání národní reprezentace a veřejné služby. V moderní Británii slouží jako platforma pro patronát, službu a postupnou přípravu následníka na budoucí odpovědnost." # todo: NEW TRANSLATION
