 ENG_worldwide_command3_desc: "Koncept britského celosvětového armádního velení předpokládá strategický přístup, v němž britská armáda rozšiřuje svůj operační dosah po celém světě. Tato iniciativa zahrnuje vytvoření velitelské struktury schopné koordinovat a provádět vojenské operace v celosvětovém měřítku. Nasazením sil v různých regionech chce britská armáda posílit svůj globální vliv, reagovat na vznikající hrozby a přispívat k mezinárodní bezpečnosti. Britské celosvětové armádní velení představuje závazek k aktivnímu a všestrannému vojenskému působení v souladu s proměnlivou povahou globálních bezpečnostních výzev." # todo: NEW TRANSLATION
 ENG_worldwide_command4: "Celosvětové velení" # todo: NEW TRANSLATION
 ENG_worldwide_command4_desc: "Koncept britského celosvětového armádního velení předpokládá strategický přístup, v němž britská armáda rozšiřuje svůj operační dosah po celém světě. Tato iniciativa zahrnuje vytvoření velitelské struktury schopné koordinovat a provádět vojenské operace v celosvětovém měřítku. Nasazením sil v různých regionech chce britská armáda posílit svůj globální vliv, reagovat na vznikající hrozby a přispívat k mezinárodní bezpečnosti. Britské celosvětové armádní velení představuje závazek k aktivnímu a všestrannému vojenskému působení v souladu s proměnlivou povahou globálních bezpečnostních výzev." # todo: NEW TRANSLATION
 ENG_naval_defense_act_1889_1: "Zákon o námořní obraně z roku 1889" # todo: NEW TRANSLATION
 ENG_naval_defense_act_1889_1_desc: "Zákon o námořní obraně z roku 1889 byl přijat parlamentem Spojeného království. Královský souhlas obdržel 31. května 1889 a formálně přijal standard dvou mocností, čímž zvýšil námořní sílu Spojeného království. Tento standard požadoval, aby Royal Navy udržovalo počet bitevních lodí alespoň rovnající se kombinované síle dvou následujících největších námořnictev světa." # todo: NEW TRANSLATION
 ENG_naval_defense_act_1889_1_tt: "§RJakmile se staneme námořní mocností kontinentu, bude na dva roky změněno na dočasný národní duch§!" # todo: NEW TRANSLATION
 ENG_army_special_operations_brigade_idea: "Armádní brigáda speciálních operací" # todo: NEW TRANSLATION
 ENG_army_special_operations_brigade_idea_desc: "Armádní brigáda speciálních operací Spojeného království je elitní a vysoce specializovanou silou britské armády. Tvoří ji odborně vycvičení vojáci z různých jednotek a je určena pro nekonvenční mise s vysokým rizikem. Vybavena pokročilými zbraněmi, specializovaným výcvikem a odhodláním k všestrannosti hraje klíčovou roli při řešení složitých hrozeb, provádění přesných operací a naplňování celkové obranné strategie národa." # todo: NEW TRANSLATION
 ENG_allied_basing_efforts_Idea: "Budování základen spojenců" # todo: NEW TRANSLATION
 ENG_allied_basing_efforts_Idea_desc: "Iniciativa budování základen spojenců představuje komplexní přístup k posílení infrastruktury a strategických prostředků členských států aliance. Program zahrnuje nezbytné zlepšení dopravních sítí, leteckých základen, přístavů a dalších kritických zařízení. Spojené království jako významný přispěvatel do aliance získává podstatné a trvalé zlepšení infrastruktury, které podporuje logistickou účinnost a strategickou připravenost." # todo: NEW TRANSLATION
 ENG_royal_navy_Idea1: "Britské Royal Navy" # todo: NEW TRANSLATION
 ENG_royal_navy_Idea1_desc: "Britské Royal Navy patří mezi přední námořní síly světa a může se pochlubit slavnou tradicí sahající několik staletí do minulosti. Royal Navy, proslulé svou přizpůsobivostí a technologickou vyspělostí, hraje klíčovou roli při ochraně námořních zájmů Spojeného království a projekci moci po celém světě." # todo: NEW TRANSLATION
 ENG_royal_navy_Idea2: "Britské Royal Navy" # todo: NEW TRANSLATION
 ENG_royal_navy_Idea2_desc: "Britské Royal Navy patří mezi přední námořní síly světa a může se pochlubit slavnou tradicí sahající několik staletí do minulosti. Royal Navy, proslulé svou přizpůsobivostí a technologickou vyspělostí, hraje klíčovou roli při ochraně námořních zájmů Spojeného království a projekci moci po celém světě." # todo: NEW TRANSLATION
 ENG_royal_navy_Idea3: "Britské královské námořnictvo" # todo: NEW TRANSLATION
 ENG_royal_navy_Idea3_desc: "Britské královské námořnictvo patří mezi přední námořní síly světa a může se pochlubit slavnou historií sahající několik staletí do minulosti. Díky své proslulé přizpůsobivosti a technologické vyspělosti hraje Královské námořnictvo klíčovou roli při ochraně námořních zájmů Spojeného království a při prosazování jeho moci po celém světě." # todo: NEW TRANSLATION
 ENG_royal_navy_Idea4: "Britské královské námořnictvo" # todo: NEW TRANSLATION
 ENG_royal_navy_Idea4_desc: "Britské královské námořnictvo patří mezi přední námořní síly světa a může se pochlubit slavnou historií sahající několik staletí do minulosti. Díky své proslulé přizpůsobivosti a technologické vyspělosti hraje Královské námořnictvo klíčovou roli při ochraně námořních zájmů Spojeného království a při prosazování jeho moci po celém světě." # todo: NEW TRANSLATION
 ENG_royal_navy_Idea5: "Britské královské námořnictvo" # todo: NEW TRANSLATION
 ENG_royal_navy_Idea5_desc: "Britské královské námořnictvo patří mezi přední námořní síly světa a může se pochlubit slavnou historií sahající několik staletí do minulosti. Díky své proslulé přizpůsobivosti a technologické vyspělosti hraje Královské námořnictvo klíčovou roli při ochraně námořních zájmů Spojeného království a při prosazování jeho moci po celém světě." # todo: NEW TRANSLATION
 ENG_british_foregin_legion_idea: "Britská cizinecká legie" # todo: NEW TRANSLATION
 ENG_british_foregin_legion_idea_desc: "Umožňujeme vojákům z celého světa vstoupit do britské armády, aby mohli hájit britské zájmy." # todo: NEW TRANSLATION
 ENG_field_army_expansion_idea: "Rozšíření polní armády" # todo: NEW TRANSLATION
 ENG_field_army_expansion_idea_desc: "Rozšířená polní armáda je navržena tak, aby vynikala v různých operačních prostředích, od konvenční války až po mírové mise. Tato iniciativa odpovídá širší obranné strategii Spojeného království, která klade důraz na připravenost, mobilitu a interoperabilitu se spojeneckými silami. Investicemi do růstu a modernizace polní armády Spojené království potvrzuje svůj závazek udržovat všestranné a pružné pozemní síly schopné čelit vyvíjejícím se hrozbám 21. století." # todo: NEW TRANSLATION
 ENG_multi_ocean_training: "Výcvik ve více oceánech" # todo: NEW TRANSLATION
 ENG_multi_ocean_training_desc: "Tento strategický program se zaměřuje na zvýšení schopností a připravenosti Královského námořnictva prostřednictvím specializovaných cvičení, simulací a scénářů z reálného světa. Vystavením námořního personálu jedinečným výzvám různých oceánů, od Atlantiku až po Pacifik a dále, tato iniciativa zajišťuje přizpůsobivost, všestrannost a efektivní námořní operace v globálním měřítku." # todo: NEW TRANSLATION
 ENG_carrier_wing_procurement: "Nákup leteckých křídel pro letadlové lodě" # todo: NEW TRANSLATION
 ENG_carrier_wing_procurement_desc: "Iniciativa rozšířeného nákupu leteckých křídel pro letadlové lodě zdůrazňuje odhodlání Spojeného království posílit vzdušné schopnosti svých letadlových lodí třídy Queen Elizabeth. Toto strategické úsilí zahrnuje získání a rozšíření palubních letounů se zaměřením na pokročilé platformy, které zvýší operační dosah a všestrannost leteckého křídla. Součástí nákupu je integrace špičkových letounů, jako je F-35B Lightning II, spolu s podpůrnými a průzkumnými prostředky. Toto rozšíření má posílit schopnosti letadlových lodí a zajistit vytvoření mocné úderné skupiny schopné plnit široké spektrum misí." # todo: NEW TRANSLATION
 ENG_strategic_aircraft_strategy_idea: "Strategie strategického letectva" # todo: NEW TRANSLATION
 ENG_strategic_aircraft_strategy_idea_desc: "Strategie strategického letectva má zajistit, aby Spojené království udržovalo silnou a schopnou flotilu strategických letounů, která může účinně podporovat cíle národní obrany, přispívat k mezinárodním bezpečnostním operacím a přizpůsobovat se novým hrozbám v globálním bezpečnostním prostředí." # todo: NEW TRANSLATION
