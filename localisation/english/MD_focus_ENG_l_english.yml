 ENG_additional_expenditure_goodfriday_TT: "Dodatečné výdaje: §R+0,03 %§! HDP\nOčekávané policejní výdaje: §R+0,15 %§!\nStabilita: §G+10,00 %§!\n\nSnižuje všechny postihy z §Ysektářského napětí§! o §G20 %§!.\n\nOd úrovně sektářského napětí:\n$ENG_additional_expenditure_goodfriday_info_TT$\n--------------\n§YS řešením otázky Severního Irska§!\nParamilitární jednotky musí být odzbrojeny, než lze předložit ústavní otázku. Všechny cesty najdete v části §HDevolvované záležitosti§!.\n\n§HVyhlášení pohraničního referenda§! – severoírský nacionalismus nad §G55§! (aktuálně §Y[?ENG_north_irish_nationalists|0]§!). Hlasování pro odchod předá $STATE_17$ Irsku.\n§HAll-Ireland Dominion§! – s Irskem jako naším podřízeným státem a vyřešenou severoírskou devolucí přejde $STATE_17$ pod Dublin, zatímco Irsko zůstane naše.\n§HZrušení dohody§! – okamžitě ukončí platby, obnoví plnou sílu sektářského napětí a Ulster povstane.\n--------------\n§gTento národní duch bude odstraněn, pokud již nevlastníme $STATE_17$.§!" # todo: NEW TRANSLATION
