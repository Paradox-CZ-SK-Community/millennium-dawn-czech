 ENG_raid_enabled_2_TT: "§HOdemkne nový nájezd§!: Operace Safeguard\n - [ENG.GetFlag] Britské jednotky speciálních sil budou moci vtrhnout do [ZIM.GetFlag] Zimbabwe a svrhnout jeho diktátora, kterého nahradí [ENG.GetFlag] britským podporovaným silným mužem." # todo: NEW TRANSLATION
