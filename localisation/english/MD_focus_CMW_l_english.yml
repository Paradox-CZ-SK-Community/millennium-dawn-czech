l_english:
 CMW_focus: "Strom zaměření Společenství národů" # todo: NEW TRANSLATION
 Commonwealth_member_modifier: "Člen Společenství národů" # todo: NEW TRANSLATION
 Commonwealth_member_modifier_desc: "Jako člen Společenství národů naše země těží ze silných diplomatických vazeb a hospodářské spolupráce s ostatními členskými státy. Toto historické sdružení nám poskytuje síť vzájemné podpory a sdílených hodnot, čímž posiluje naše mezinárodní postavení a obchodní příležitosti. Vyvažování naší suverenity s kolektivními zájmy Společenství národů však někdy může vést k diplomatickým a politickým výzvám." # todo: NEW TRANSLATION
 CMW_Aso_Rock_Declaration: "Deklarace Aso Rock" # todo: NEW TRANSLATION
 CMW_Aso_Rock_Declaration_desc: "Deklarace Aso Rock Společenství národů byla klíčovým prohlášením vydaným během zasedání předsedů vlád Společenství národů konaného v roce 2003 v Abuji v Nigérii. Tato deklarace znovu potvrdila závazek Společenství národů k podpoře demokracie, řádné správy věcí veřejných, lidských práv a udržitelného hospodářského rozvoje. Zdůraznila význam vzájemného respektu, inkluzivity a spolupráce mezi členskými státy při účinném řešení globálních výzev." # todo: NEW TRANSLATION
 CMW_of_Learning: "Společenství pro vzdělávání" # todo: NEW TRANSLATION
 CMW_of_Learning_desc: "Společenství pro vzdělávání, mezivládní organizace Společenství národů se sídlem v Metro Vancouveru v Kanadě, spolupracuje s různými partnery ve Společenství národů a mezinárodními rozvojovými agenturami na podpoře otevřeného vzdělávání a distančního vzdělávání." # todo: NEW TRANSLATION
 CMW_New_Petroleum_Group: "Diskusní skupina producentů ropy" # todo: NEW TRANSLATION
 CMW_New_Petroleum_Group_desc: "Diskusní skupina nových producentů ropy je platformou spolupráce rozvíjejících se ropných států, která jim umožňuje sdílet poznatky a strategie pro rozvoj ropného průmyslu." # todo: NEW TRANSLATION
 CMW_Hub_And_Spokes_Program: "Obchodní program Hub and Spokes" # todo: NEW TRANSLATION
 CMW_Hub_And_Spokes_Program_desc: "Obchodní program Hub and Spokes je iniciativa podporující obchodní partnerství mezi více zeměmi, zaměřená zejména na budování kapacit a rozvojové úsilí související s obchodem." # todo: NEW TRANSLATION
 CMW_Leaving_The_Organisation: "Odchod ze Společenství národů" # todo: NEW TRANSLATION
 CMW_Leaving_The_Organisation_desc: "Rozhodnutí opustit Společenství národů představuje významný posun v mezinárodních vztazích. Tento krok odráží strategické přeskupení zahraniční politiky, které upřednostňuje národní suverenitu a nezávislost před tradičními spojenectvími. Odchodem ze Společenství národů se [ROOT.GetNamewithFlag] snaží navázat nová partnerství a vydat se ve světových záležitostech autonomnější cestou." # todo: NEW TRANSLATION
 CMW_Charter: "Charta Společenství národů" # todo: NEW TRANSLATION
 CMW_Charter_desc: "Charta Společenství národů je dokument, který vymezuje sdílené hodnoty a zásady Společenství národů, skupiny 54 členských států zavázaných k lidským právům, udržitelnému rozvoji a právnímu státu." # todo: NEW TRANSLATION
 CMW_Ministerial_Action_Group: "Ministerská akční skupina" # todo: NEW TRANSLATION
 CMW_Ministerial_Action_Group_desc: "Ministerská akční skupina Společenství národů je orgán složený z ministrů členských zemí Společenství národů, který odpovídá za řešení a přijímání opatření v otázkách správy věcí veřejných a politického vývoje v členských státech s cílem zachovávat hodnoty Společenství národů." # todo: NEW TRANSLATION
 CMW_Kampala_Review: "Kampalské hodnocení" # todo: NEW TRANSLATION
 CMW_Kampala_Review_desc: "Kampalské hodnocení, které proběhlo během zasedání předsedů vlád Společenství národů v roce 2007, mělo za cíl posoudit a zvýšit účinnost Společenství národů při podpoře demokracie, rozvoje a řádné správy věcí veřejných. Toto hodnocení se zaměřilo na posílení schopnosti organizace řešit současné globální výzvy a zajistit, aby její hodnoty a cíle zůstaly relevantní a účinné pro všechny členské státy." # todo: NEW TRANSLATION
 CMW_Anti_Corruption_Centre: "Africké protikorupční centrum Společenství národů" # todo: NEW TRANSLATION
 CMW_Anti_Corruption_Centre_desc: "Africké protikorupční centrum Společenství národů je instituce zřízená v rámci Společenství národů s cílem řešit a potírat korupci v afrických členských zemích a podporovat transparentnost a řádnou správu věcí veřejných." # todo: NEW TRANSLATION
 CMW_Association_Legislative_Council: "Legislativní rada sdružení" # todo: NEW TRANSLATION
 CMW_Association_Legislative_Council_desc: "Sdružení legislativních poradců Společenství národů je organizace sdružující právní odborníky, kteří poskytují poradenství a podporu zákonodárným sborům a parlamentům v členských státech Společenství národů. Podporuje spolupráci a sdílení odborných znalostí mezi legislativními poradci." # todo: NEW TRANSLATION
 CMW_Connectivity_Agenda: "Agenda konektivity Společenství národů" # todo: NEW TRANSLATION
 CMW_Connectivity_Agenda_desc: "Agenda konektivity Společenství národů je platforma pro výměnu osvědčených postupů a zkušeností v oblasti obchodu a investic a pro provádění domácích reforem." # todo: NEW TRANSLATION
 CMW_Parliament: "Parlament Společenství národů" # todo: NEW TRANSLATION
 CMW_Parliament_desc: "Zřízení Parlamentu Společenství národů představuje významný krok k větší politické integraci a spolupráci mezi členskými státy. Tento zákonodárný orgán má usnadňovat dialog, podporovat demokratické hodnoty a dohlížet na provádění politik Společenství národů. Slouží jako platforma pro zástupce všech členských zemí k projednávání a řešení společných výzev, čímž podporuje jednotu a kolektivní jednání." # todo: NEW TRANSLATION
 CMW_Parliament_tt: "Všechny členské státy §HSpolečenství národů§! umožní konání voleb ve svých zemích" # todo: NEW TRANSLATION
 CMW_Legal_Education_Association: "Sdružení pro právní vzdělávání Společenství národů" # todo: NEW TRANSLATION
 CMW_Legal_Education_Association_desc: "Sdružení pro právní vzdělávání Společenství národů je organizace podporující právní vzdělávání a spolupráci mezi členskými zeměmi Společenství národů." # todo: NEW TRANSLATION
 CMW_Fintech_Toolkit: "Fintechová sada nástrojů Společenství národů" # todo: NEW TRANSLATION
 CMW_Fintech_Toolkit_desc: "Fintechová sada nástrojů Společenství národů je zdroj určený k podpoře rozvoje a inovací finančních technologií v členských zemích Společenství národů." # todo: NEW TRANSLATION
 CMW_CFTC: "Fond Společenství národů pro technickou spolupráci" # todo: NEW TRANSLATION
 CMW_CFTC_desc: "Fond Společenství národů pro technickou spolupráci (CFTC) je finanční mechanismus, který pomáhá členským zemím Společenství národů provádět projekty a iniciativy technické spolupráce pro rozvoj." # todo: NEW TRANSLATION
 CMW_School_Leaders: "Profesní standardy sekretariátu" # todo: NEW TRANSLATION
 CMW_School_Leaders_desc: "Rámec profesních standardů sekretariátu pro učitele a vedoucí pracovníky škol je soubor pokynů a měřítek určených ke zlepšení profesního rozvoje a výkonu pedagogů a vedoucích pracovníků škol v působnosti sekretariátu." # todo: NEW TRANSLATION
 CMW_Trade_Association: "Obchodní sdružení Společenství národů" # todo: NEW TRANSLATION
 CMW_Trade_Association_desc: "Obchodní sdružení Společenství národů (CTA) usiluje o posílení hospodářské spolupráce a obchodních vztahů mezi členskými státy. Podporou integrovanějšího a spolupracujícího obchodního prostředí se CTA snaží snižovat cla, zjednodušovat celní postupy a podporovat udržitelný hospodářský růst." # todo: NEW TRANSLATION
 CMW_Joint_Research_Initiative: "Společná výzkumná iniciativa Společenství národů" # todo: NEW TRANSLATION
 CMW_Joint_Research_Initiative_desc: "Společná výzkumná iniciativa Společenství národů je společným úsilím o rozvoj vědeckých a technologických inovací mezi členskými státy. Tato iniciativa podporuje sdílení znalostí, zdrojů a odborných znalostí při řešení společných výzev, jako jsou změna klimatu, zdravotnictví a udržitelný rozvoj. Vytvářením sítě výzkumných institucí a odborníků chce Společenství národů podporovat pokrok a inovace ku prospěchu všech členských zemí." # todo: NEW TRANSLATION
 CMW_Valuta: "Zavedení měny Commo" # todo: NEW TRANSLATION
 CMW_Valuta_desc: "Zavedení měny Commo představuje historický krok k hospodářské integraci v rámci Společenství národů. Tato společná měna má usnadnit obchod, zvýšit finanční stabilitu a podpořit hospodářskou spolupráci mezi členskými státy. Přijetím měny Commo chce Společenství národů snížit překážky při směně měn, stabilizovat regionální ekonomiky a podpořit jednotnější hospodářské společenství." # todo: NEW TRANSLATION
 CMW_Promoting_Democracy: "Prosazování ideologie" # todo: NEW TRANSLATION
 CMW_Promoting_Democracy_desc: "Sjednotíme Společenství národů s Británií, abychom zvýšili naši diplomatickou moc ve světě" # todo: NEW TRANSLATION
 CMW_Counter_Insurgency_Training: "Den boje proti povstalcům Společenství národů" # todo: NEW TRANSLATION
 CMW_Counter_Insurgency_Training_desc: "Výcvik Společenství národů v boji proti povstalcům je iniciativa zaměřená na posílení schopnosti členských zemí Společenství národů účinně řešit a zmírňovat povstalecké hrozby. Poskytuje specializovaný výcvik, zdroje a odborné znalosti, které zemím pomáhají zvládat a řešit vnitřní bezpečnostní výzvy, a tím podporuje stabilitu a mír." # todo: NEW TRANSLATION
 CMW_Cyber_Declaration: "Program kybernetické deklarace Společenství národů" # todo: NEW TRANSLATION
 CMW_Cyber_Declaration_desc: "Program kybernetické deklarace Společenství národů je iniciativa zaměřená na řešení otázek kybernetické bezpečnosti a podporu spolupráce v členských zemích Společenství národů s cílem zvýšit digitální bezpečnost a chránit před kybernetickými hrozbami." # todo: NEW TRANSLATION
 CMW_Intelligence_Network: "Zpravodajská síť Společenství národů" # todo: NEW TRANSLATION
 CMW_Intelligence_Network_desc: "Vytvoření zpravodajské sítě Společenství národů (CIN), vedené nově založenou Zpravodajskou agenturou Společenství národů (CIA), má posílit bezpečnost a sdílení zpravodajských informací mezi členskými státy. Tato síť usnadňuje výměnu důležitých informací, společné kontrarozvědné operace a jednotné reakce na globální hrozby. Posílením zpravodajské spolupráce chce Společenství národů chránit své členské státy před špionáží, terorismem a kybernetickými hrozbami." # todo: NEW TRANSLATION
 CMW_Patrol_Boat_Program: "Program hlídkových člunů Společenství národů" # todo: NEW TRANSLATION
 CMW_Patrol_Boat_Program_desc: "Program hlídkových člunů Společenství národů je strategickým úsilím zahrnujícím společný vývoj a nasazení námořních hlídkových člunů členskými zeměmi Společenství národů. Tato plavidla jsou navržena ke zvýšení námořní bezpečnosti, ochraně teritoriálních vod a podpoře různých námořních misí, čímž přispívají k bezpečnosti a stabilitě regionů Společenství národů." # todo: NEW TRANSLATION
 CMW_Chief_Of_Staff: "Náčelník štábu Společenství národů" # todo: NEW TRANSLATION
 CMW_Chief_Of_Staff_desc: "Náčelník štábu Společenství národů je vysoká funkce odpovědná za dohled nad vojenskými operacemi a strategiemi a jejich koordinaci v členských zemích Společenství národů. Tato role je klíčová pro zajištění bezpečnosti a obrany Společenství národů, jakož i pro podporu spolupráce a připravenosti ozbrojených sil s cílem udržovat mír a stabilitu." # todo: NEW TRANSLATION
 CMW_Secretariat_CVE: "Jednotka sekretariátu pro boj proti násilnému extremismu" # todo: NEW TRANSLATION
 CMW_Secretariat_CVE_desc: "Jednotka sekretariátu Společenství národů pro boj proti násilnému extremismu (CVE) je specializované oddělení sekretariátu Společenství národů odpovědné za řešení a potírání násilného extremismu v členských zemích Společenství národů se zaměřením na prevenci radikalizace a podporu míru a stability." # todo: NEW TRANSLATION
 CMW_Offices_For_Peace: "Mírové kanceláře Společenství národů" # todo: NEW TRANSLATION
 CMW_Offices_For_Peace_desc: "Zřízení Mírových kanceláří Společenství národů (COP) zdůrazňuje závazek Společenství národů ke globálnímu míru a řešení konfliktů. Tyto kanceláře, umístěné v klíčových regionech členských států, usilují o zprostředkování konfliktů, podporu diplomacie a podporu iniciativ pro budování míru." # todo: NEW TRANSLATION
 CMW_Academy: "Vojenská akademie Společenství národů" # todo: NEW TRANSLATION
 CMW_Academy_desc: "Vojenská akademie Společenství národů (CMA) je zřízena za účelem poskytování pokročilého vojenského výcviku a vzdělávání personálu ze všech členských států. Tato instituce má zvyšovat odborné dovednosti, strategické znalosti a vůdčí schopnosti vojenských důstojníků. Podporou společných výcvikových standardů a ducha spolupráce CMA posiluje kolektivní obranné schopnosti Společenství národů." # todo: NEW TRANSLATION
 CMW_Training_Day: "Výcvik světového území" # todo: NEW TRANSLATION
 CMW_Training_Day_desc: "Výcvik světového území je globální program určený ke zlepšení připravenosti a schopností zemí při správě územních a hraničních otázek. Tato iniciativa nabízí výcvik a zdroje ke zlepšení porozumění geografickým hranicím a jejich správě a pomáhá zemím řešit hraniční spory, podporovat mírové soužití a posilovat územní stabilitu po celém světě." # todo: NEW TRANSLATION
 CMW_Defense_Treaty: "Obranná smlouva Společenství národů" # todo: NEW TRANSLATION
 CMW_Defense_Treaty_desc: "Obranná smlouva Společenství národů je významná mezinárodní dohoda mezi členskými zeměmi Společenství národů, která stanovuje vzájemné obranné závazky a povinnosti. Tato smlouva slouží jako rámec kolektivní bezpečnosti, v němž se členské státy zavazují podporovat jeden druhého v době vnějších hrozeb či agrese, a posiluje tak závazek chránit bezpečnost a suverenitu všech signatářských států Společenství národů." # todo: NEW TRANSLATION
 CMW_New_CMW: "Nové Společenství národů" # todo: NEW TRANSLATION
 CMW_New_CMW_desc: "Po sérii rozsáhlých reforem stojí Společenství národů znovu na nohou a je připraveno čelit novým globálním výzvám. Tyto reformy modernizovaly struktury správy, zefektivnily rozhodovací procesy a posílily závazek k základním hodnotám, jako jsou demokracie, rozvoj a lidská práva. Nové Společenství národů je nyní připraveno vést své členské státy do nové éry spolupráce, inkluzivity a odolnosti a čelit složitostem 21. století." # todo: NEW TRANSLATION
 CMW_Education_Framework: "Vzdělávací rámec Společenství národů" # todo: NEW TRANSLATION
 CMW_Education_Framework_desc: "Vzdělávací rámec Společenství národů je komplexní systém pro řízení vzdělávacích politik a postupů v členských státech Společenství národů." # todo: NEW TRANSLATION
 CMW_Debt_Swaps: "Dluhové swapy Společenství národů" # todo: NEW TRANSLATION
 CMW_Debt_Swaps_desc: "Dluhové swapy Společenství národů označují finanční dohody či iniciativy v rámci Společenství národů, které zahrnují výměnu nebo restrukturalizaci dluhu jako prostředek k řešení hospodářských a finančních problémů v členských zemích." # todo: NEW TRANSLATION
 CMW_Climate_Hub: "Centrum přístupu ke klimatickému financování Společenství národů" # todo: NEW TRANSLATION
 CMW_Climate_Hub_desc: "Centrum přístupu ke klimatickému financování Společenství národů je platforma zřízená v rámci Společenství národů s cílem usnadnit členským zemím přístup ke klimatickému financování a podpoře při řešení změny klimatu a iniciativ souvisejících s udržitelností." # todo: NEW TRANSLATION
 CMW_Blue_Charter: "Modrá charta Společenství národů" # todo: NEW TRANSLATION
 CMW_Blue_Charter_desc: "Modrá charta Společenství národů je závazek členských zemí Společenství národů spolupracovat na ochraně zdraví a udržitelnosti světových oceánů a mořského prostředí." # todo: NEW TRANSLATION
 CMW_Living_Lands: "Charta živých zemí" # todo: NEW TRANSLATION
 CMW_Living_Lands_desc: "Charta živých zemí je průlomová ekologická iniciativa přijatá Společenstvím národů. Tato charta zavazuje členské státy k udržitelnému hospodaření s půdou, ochraně biologické rozmanitosti a boji proti změně klimatu. Podporou zalesňování, obnovy půdy a ochrany přírodních stanovišť chce Společenství národů zajistit, aby budoucí generace zdědily zdravé a odolné životní prostředí." # todo: NEW TRANSLATION
 CMW_Health_Section: "Zdravotní sekce sekretariátu" # todo: NEW TRANSLATION
 CMW_Health_Section_desc: "Zdravotní sekce sekretariátu Společenství národů je oddělení v rámci sekretariátu Společenství národů, které odpovídá za poskytování podpory a poradenství členským zemím Společenství národů v otázkách zdravotní péče, veřejného zdraví a tvorby zdravotních politik a programů v rámci Společenství národů. Hraje úlohu při usnadňování spolupráce a sdílení osvědčených postupů v oblasti zdraví mezi členskými státy." # todo: NEW TRANSLATION
 CMW_Body_And_Sports: "Poradní orgán Společenství národů pro sport" # todo: NEW TRANSLATION
 CMW_Body_And_Sports_desc: "Poradní orgán Společenství národů pro sport je výbor, který poskytuje členským zemím Společenství národů rady a pokyny v oblasti sportovních politik a programů se zaměřením na podporu sociálního rozvoje, zdraví a dobrých životních podmínek prostřednictvím sportu." # todo: NEW TRANSLATION
 CMW_Youth_Networks: "Mládežnické sítě Společenství národů" # todo: NEW TRANSLATION
 CMW_Youth_Networks_desc: "Mládežnické sítě Společenství národů jsou skupiny či organizace zaměřené na mládež v rámci Společenství národů, které usnadňují spolupráci, sdílení informací a kolektivní činnost mladých lidí v členských zemích Společenství národů. Tyto sítě se často zabývají otázkami důležitými pro mládež, jako jsou vzdělávání, zaměstnanost a sociální rozvoj." # todo: NEW TRANSLATION
 CMW_Defense_Association: "Obranné sdružení Společenství národů" # todo: NEW TRANSLATION
 CMW_Defense_Association_desc: "Obranné sdružení Společenství národů je společné sdružení členských zemí Společenství národů zaměřené na posílení jejich kolektivních obranných schopností a bezpečnosti. Tato aliance slouží jako platforma pro vzájemnou podporu, strategickou koordinaci a společné úsilí o mír a stabilitu v rámci společenství Společenství národů." # todo: NEW TRANSLATION
 CMW_Leaving.1.t: "[FROM.GetName] opouští Společenství národů" # todo: NEW TRANSLATION
 CMW_Leaving.1.d: "[FROM.GetName] oficiálně oznámila svůj odchod ze Společenství národů. Toto rozhodnutí představuje významný posun v její zahraniční politice a odráží touhu po větší autonomii a nových mezinárodních aliancích. Odchod může ovlivnit diplomatické vztahy a hospodářské vazby v rámci Společenství národů a přinést nové výzvy i příležitosti jak odcházející zemi, tak zbývajícím členským státům." # todo: NEW TRANSLATION
