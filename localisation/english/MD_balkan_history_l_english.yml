l_english:
 balkan_news.1.t: "Karadžić odsouzen za genocidu" # todo: NEW TRANSLATION
 balkan_news.1.d: "Tribunál v Haagu shledal Radovana Karadžiće vinným z genocidy ve Srebrenici a ze zločinů proti lidskosti po celé Bosně a odsoudil ho ke čtyřiceti letům vězení. Dvě desetiletí po Daytonu byl válečný vůdce bosenských Srbů souzen soudem, který jeho válka pomohla vytvořit." # todo: NEW TRANSLATION
 balkan_news.1.a: "Rozsudek je v Sarajevu přečten nahlas" # todo: NEW TRANSLATION
 balkan_news.1.b: "Někteří říkají, že jde o rozsudek proti všem Srbům" # todo: NEW TRANSLATION
 balkan_news.1.c: "Spravedlnost, která se opozdila" # todo: NEW TRANSLATION
 balkan_news.2.t: "Doživotí pro Karadžiće" # todo: NEW TRANSLATION
 balkan_news.2.d: "Odvolací senát zamítl odvolání Radovana Karadžiće a zvýšil jeho trest na doživotí s odůvodněním, že původní čtyřicetiletý trest neodpovídá závažnosti jeho zločinů. Je to poslední slovo o muži, který během války vedl Republiku srbskou." # todo: NEW TRANSLATION
 balkan_news.2.a: "Haag uzavírá případ" # todo: NEW TRANSLATION
 balkan_news.3.t: "Mladić odsouzen za genocidu" # todo: NEW TRANSLATION
 balkan_news.3.d: "Tribunál odsoudil Ratka Mladiće za genocidu, válečné zločiny a zločiny proti lidskosti a uložil mu doživotní trest. Bývalý generál křičel na soudce a před dočtením rozsudku musel být ze soudní síně vyveden. Ve Srebrenici matky mrtvých sledovaly dění mlčky." # todo: NEW TRANSLATION
 balkan_news.3.a: "Generál se konečně zodpovídá" # todo: NEW TRANSLATION
 balkan_news.4.t: "Sebevražda v soudní síni" # todo: NEW TRANSLATION
 balkan_news.4.d: "Chvíli poté, co soudci potvrdili jeho dvacetiletý trest, bosenskochorvatský generál Slobodan Praljak prohlásil, že není válečným zločincem, a před kamerami vypil lahvičku s jedem. Během několika hodin zemřel. Odvolací senát potvrdil rozsudky nad všemi šesti bývalými vůdci Herceg-Bosny a shledal, že společné zločinecké spolčení sahalo až do Záhřebu." # todo: NEW TRANSLATION
 balkan_news.4.a: "Odmítl spravedlnost soudu" # todo: NEW TRANSLATION
 balkan_news.4.b: "Ponurý konec posledního případu tribunálu" # todo: NEW TRANSLATION
 balkan_news.5.t: "Mladićovo odvolání zamítnuto" # todo: NEW TRANSLATION
 balkan_news.5.d: "Soudci Organizace spojených národů potvrdili rozsudek nad Ratkem Mladićem za genocidu i doživotní trest, čímž uzavřeli poslední velký případ vyplývající z bosenské války. Čtvrt století po Srebrenici je soudní vyrovnání s válkou dokončeno. Politické vyrovnání nikoli." # todo: NEW TRANSLATION
 balkan_news.5.a: "Archiv se uzavírá" # todo: NEW TRANSLATION
 CRO_nat_populism_gain_tt: "§RPodpora nacionalistické pravice roste.§!" # todo: NEW TRANSLATION
 balkan_news.6.t: "Deklarace srbského světa" # todo: NEW TRANSLATION
 balkan_news.6.d: "Bělehrad a Banja Luka společně přijaly třináctistránkovou deklaraci o sjednocení srbských zemí pod stálou Nejvyšší radou pro spolupráci mezi Srbskem a Republikou srbskou. Má jen malou právní váhu, ale o to větší záměry." # todo: NEW TRANSLATION
 balkan_news.6.a: "Patron, kterého stojí za to mít" # todo: NEW TRANSLATION
 balkan_news.6.b: "Autorita Sarajeva dále slábne" # todo: NEW TRANSLATION
 balkan_news.6.c: "Zprávy ze sousedství" # todo: NEW TRANSLATION
 balkan_news.7.t: "EUFOR přitvrzuje" # todo: NEW TRANSLATION
 balkan_news.7.d: "Dny poté, co ruské tanky vjely na Ukrajinu, Evropská unie přibližně zdvojnásobila posádku EUFOR Althea v Bosně a Hercegovině a letecky dopravila záložní jednotky jako pojistku proti přelití nestability." # todo: NEW TRANSLATION
 balkan_news.7.a: "Uklidňující přehlídka odhodlání" # todo: NEW TRANSLATION
 balkan_news.7.b: "Preventivní opatření přijaté jinde" # todo: NEW TRANSLATION
 balkan_news.8.t: "Erdoğan mobilizuje Sarajevo" # todo: NEW TRANSLATION
 balkan_news.8.d: "Erdoğan, kterému bylo znemožněno vést kampaň po celé západní Evropě, uspořádal v Sarajevu jediný evropský mítink této kampaně, přilákal tisíce lidí a setkal se s Bakirem Izetbegovićem ze SDA. Dodik to označil za vměšování." # todo: NEW TRANSLATION
 balkan_news.8.a: "Přítel, na kterého se Sarajevo může spolehnout" # todo: NEW TRANSLATION
 balkan_news.8.b: "Mítink v cizí zemi" # todo: NEW TRANSLATION
 balkan_news.9.t: "Lavrovova návštěva Sarajeva" # todo: NEW TRANSLATION
 balkan_news.9.d: "Sergej Lavrov navštívil Sarajevo, kde ho na letišti přivítal pouze Dodik. Při této příležitosti nebyla vyvěšena žádná bosenská vlajka. Odvezl si staletou pravoslavnou ikonu, jejíž původ lze vystopovat do Luhansku, což je dar, který Kyjev požaduje vysvětlit." # todo: NEW TRANSLATION
 balkan_news.9.a: "Vlastní zahraniční politika Republiky srbské" # todo: NEW TRANSLATION
 balkan_news.9.b: "Návštěva jako každá jiná" # todo: NEW TRANSLATION
