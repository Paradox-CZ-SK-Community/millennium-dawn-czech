 REVOKE_MIL_GNSS_ACCESS_ACTION_DESC: "Odvolat všechny přihlašovací údaje k naší šifrované vojenské poziční síti a okamžitě ukončit jejich přístup k integraci. Tímto krokem se přeruší kritické navigační schopnosti jejich obranných operací, deaktivují se přesně naváděné systémy a vyšle se signál o zásadním narušení strategické důvěry. Takové opatření má závažné důsledky pro bilaterální bezpečnostní spolupráci a operační interoperabilitu. Ztratí veškerý přístup k naší §Yvojenské satelitní síti GNSS§!." # todo: CHANGED
