 REVOKE_MIL_SPY_ACCESS_TITLE: "Odvolat přístup k vojenskému SPYSAT" # todo: NEW TRANSLATION
 REVOKE_MIL_SPY_ACCESS_ACTION_DESC: "Odvolat veškerá přístupová oprávnění k našemu vojenskému průzkumnému satelitnímu systému a okamžitě ukončit jejich přísun klasifikovaných snímků. Tímto krokem se přeruší kritické schopnosti shromažďování zpravodajských informací, deaktivují se jejich data z dohledu a zaměřování a vyšle se signál o zásadním narušení strategické důvěry. Takové opatření má závažné důsledky pro bilaterální zpravodajskou spolupráci a jejich operační přehled. Ztratí svůj dosavadní přístup k naší §Yvojenské satelitní síti SPYSAT§!." # todo: CHANGED
