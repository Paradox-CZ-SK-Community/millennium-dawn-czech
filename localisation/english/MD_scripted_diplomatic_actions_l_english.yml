 OFFER_CIV_SPY_ACCESS_TITLE: "Nabídnout přístup k civilnímu SPYSAT" # todo: NEW TRANSLATION
 OFFER_CIV_SPY_ACCESS_ACTION_DESC: "Poskytnout přístup k našemu civilnímu průzkumnému satelitnímu systému na podporu jejich potřeb v oblasti pozorování Země a monitorování. Toto oprávnění zahrnuje sdílení obrazových dat, technickou pomoc s integrací a koordinaci kompatibilních pozemních analytických stanic. Takový přístup usnadní zlepšení monitorování životního prostředí, připravenosti na katastrofy a plánování civilní infrastruktury. Pokud bude nabídka přijata, získáme přístup k jejich §Ycivilní satelitní síti SPYSAT§!." # todo: CHANGED
