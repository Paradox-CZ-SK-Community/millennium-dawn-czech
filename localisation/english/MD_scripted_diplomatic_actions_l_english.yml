 REQUEST_CIV_SPY_ACCESS_TITLE: "Přístup k civilnímu SPYSAT" # todo: NEW TRANSLATION
 REQUEST_CIV_SPY_ACCESS_ACTION_DESC: "Požádat o přístup k integraci jejich civilního průzkumného satelitního systému za účelem zlepšení pozorování Země a monitorovacích schopností. To zahrnuje standardní dohody o sdílení snímků, koordinaci technických datových formátů a stanovení protokolů pro stahování dat do našich analytických systémů. Takový přístup umožní zlepšit monitorování životního prostředí, plánování reakce na katastrofy a posuzování infrastruktury. Pokud bude žádost přijata, získají přístup k naší §Ycivilní satelitní síti SPYSAT§!." # todo: CHANGED
