 REVOKE_CIV_SPY_ACCESS_TITLE: "Odvolat přístup k civilnímu SPYSAT" # todo: NEW TRANSLATION
 REVOKE_CIV_SPY_ACCESS_ACTION_DESC: "Ukončit jejich přístup k našemu civilnímu průzkumnému satelitnímu systému a odvolat všechna oprávnění k obrazovým datům. Tímto krokem se přeruší jejich schopnosti pozorování Země, deaktivuje se integrace s našimi systémy pro stahování dat a může dojít k významnému narušení monitorování životního prostředí, plánování reakce na katastrofy a hodnocení infrastruktury. Takové opatření signalizuje zhoršování vztahů a omezuje jejich kapacity dohledu a analýzy. Ztratí svůj dosavadní přístup k naší §Ycivilní satelitní síti SPYSAT§!." # todo: CHANGED
