l_english:
 brics_join.1.t: "[FROM.GetNameDef] Usiluje o členství v BRICS" # todo: NEW TRANSLATION
 brics_join.1.d: "[FROM.GetNameDef] formálně požádal o vstup do BRICS. Jako vůdce tohoto bloku máme rozhodnutí o jeho přijetí v rukou my." # todo: NEW TRANSLATION
 brics_join.1.a: "Posílí tento blok. Přijměme je." # todo: NEW TRANSLATION
 brics_join.1.b: "Jejich členství nám neposlouží." # todo: NEW TRANSLATION
 brics_join.2.t: "Naše žádost byla přijata" # todo: NEW TRANSLATION
 brics_join.2.d: "BRICS schválil naši žádost o členství. Zaujímáme své místo mezi národy tohoto bloku." # todo: NEW TRANSLATION
 brics_join.2.a: "Zaujměme své místo v BRICS" # todo: NEW TRANSLATION
 brics_join.3.t: "Naše žádost o členství v BRICS byla zamítnuta" # todo: NEW TRANSLATION
 brics_join.3.d: "Vedení BRICS naši žádost zamítlo. Dveře nejsou navždy zavřené a časem můžeme svou žádost znovu předložit." # todo: NEW TRANSLATION
 brics_join.3.a: "Požádáme znovu později" # todo: NEW TRANSLATION
 brics_join.3.b: "Vzdejme se tohoto úsilí" # todo: NEW TRANSLATION
 brics_join.4.t: "[ROOT.GetNameDef] vstupuje do BRICS" # todo: NEW TRANSLATION
 brics_join.4.d: "[ROOT.GetNameDef] byl přijat do BRICS, čímž se rozšiřuje dosah i váha tohoto bloku v mezinárodním uspořádání." # todo: NEW TRANSLATION
 brics_join.4.a: "Rovnováha se mění" # todo: NEW TRANSLATION
 brics_join.5.t: "Čas znovu oslovit BRICS" # todo: NEW TRANSLATION
 brics_join.5.d: "Od našeho posledního zamítnutí uplynula dostatečně dlouhá doba. Můžeme vedení BRICS předložit novou žádost." # todo: NEW TRANSLATION
 brics_join.5.a: "Podejme žádost znovu" # todo: NEW TRANSLATION
 brics_join.5.b: "Ještě ne" # todo: NEW TRANSLATION
 brics_join.6.t: "[FROM.GetNameDef] nás zve k založení BRICS" # todo: NEW TRANSLATION
 brics_join.6.d: "[FROM.GetNameDef] vytváří BRICS a požádal nás, abychom se stali jedním z jeho zakládajících členů a od samého počátku pomáhali utvářet tento blok." # todo: NEW TRANSLATION
 brics_join.6.a: "Pomůžeme založit BRICS" # todo: NEW TRANSLATION
 brics_join.6.b: "Zůstaneme stranou" # todo: NEW TRANSLATION
