 MAPMODE_SCO_MAP_MODE_DESCRIPTION: "Zobrazuje členské státy, pozorovatele a potenciální členy Šanghajské organizace pro spolupráci." # todo: CHANGED
 SCO_map_mode_tooltip: "Šanghajská organizace pro spolupráci" # todo: CHANGED
 SCO_map_mode_tooltip_delayed: "Zobrazuje aktuální členství v Šanghajské organizaci pro spolupráci (SCO).\n\n§HLegenda barev:§!\n§9Oranžová§! = členský stát SCO\n§0Fialová§! = pozorovatelský stát\n§CAzurová§! = partner pro dialog\n§YŽlutá§! = potenciální členský stát\n\nAktualizováno každý týden." # todo: CHANGED
 MAPMODE_SUBIDEOLOGY_MAP_MODE_NAME: "Vládnoucí strana" # todo: NEW TRANSLATION
 MAPMODE_SUBIDEOLOGY_MAP_MODE: "Vládnoucí strana" # todo: NEW TRANSLATION
 MAPMODE_SUBIDEOLOGY_MAP_MODE_DESCRIPTION: "Zobrazuje podideologii strany vládnoucí v každé zemi a při najetí kurzorem podíl hlasů vládních stran." # todo: NEW TRANSLATION
 subideology_map_mode_tooltip: "Vládnoucí strana [FROM.CONTROLLER.GetNameWithFlag]" # todo: NEW TRANSLATION
 subideology_map_mode_tooltip_delayed: "§H[FROM.CONTROLLER.GetNameWithFlag]§!\n\n§HVládnoucí strana:§![FROM.CONTROLLER.map_mode_ruling_party]\n\n§HVládní koalice:§![FROM.CONTROLLER.map_mode_coalition_none][FROM.CONTROLLER.L_coal_elect_percent_0][FROM.CONTROLLER.L_coal_elect_percent_1][FROM.CONTROLLER.L_coal_elect_percent_2][FROM.CONTROLLER.L_coal_elect_percent_3][FROM.CONTROLLER.L_coal_elect_percent_4][FROM.CONTROLLER.L_coal_elect_percent_5][FROM.CONTROLLER.L_coal_elect_percent_6][FROM.CONTROLLER.L_coal_elect_percent_7][FROM.CONTROLLER.L_coal_elect_percent_8][FROM.CONTROLLER.L_coal_elect_percent_9][FROM.CONTROLLER.L_coal_elect_percent_10][FROM.CONTROLLER.L_coal_elect_percent_11][FROM.CONTROLLER.L_coal_elect_percent_12][FROM.CONTROLLER.L_coal_elect_percent_13][FROM.CONTROLLER.L_coal_elect_percent_14][FROM.CONTROLLER.L_coal_elect_percent_15][FROM.CONTROLLER.L_coal_elect_percent_16][FROM.CONTROLLER.L_coal_elect_percent_17][FROM.CONTROLLER.L_coal_elect_percent_18][FROM.CONTROLLER.L_coal_elect_percent_19][FROM.CONTROLLER.L_coal_elect_percent_20][FROM.CONTROLLER.L_coal_elect_percent_21][FROM.CONTROLLER.L_coal_elect_percent_22][FROM.CONTROLLER.L_coal_elect_percent_23]\n\n§HCelková podpora vlády:§! §Y[?FROM.CONTROLLER:government_coalition_strength_elect|%1]§!\n\nProcenta představují podíl hlasů, který každá strana získala v posledních volbách, takže země, ve kterých se volby nikdy nekonaly, zobrazují 0,0 %.\n\n§HLegenda barev:§!\nKaždá strana si zachovává barvu, kterou má ve výsečovém grafu v přehledu politiky.\n§nModré§! = západní strany\n§RČervené§! = rozvíjející se strany\n§GZelené§! = salafistické a islamistické strany\n§Žluté a šedé§! = neutrální strany\n§9Oranžové, olivové a fialové§! = nacionalistické strany\n\nAktualizuje se při každé změně vlády." # todo: NEW TRANSLATION
