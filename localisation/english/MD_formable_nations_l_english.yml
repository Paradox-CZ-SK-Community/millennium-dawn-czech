 formable_buy.1.t: "Nabídka území od [?formable_offer_buyer_id.GetNameDef]" # todo: NEW TRANSLATION
 formable_buy.1.d: "[?formable_offer_buyer_id.GetNameDef] formálně nabídl naší vládě §H£treasury 100 miliard§! za [?formable_offer_state_id.GetName], stát, který považuje za své historické jádro.\n\nNáš kabinet musí rozhodnout: přijmout platbu a vzdát se území, nebo nabídku odmítnout a zachovat naši územní celistvost." # todo: NEW TRANSLATION
 formable_buy.1.a: "Nabídka, kterou nemůžeme odmítnout." # todo: NEW TRANSLATION
 formable_buy.1.b: "Naše země není na prodej." # todo: NEW TRANSLATION
 formable_buy.1.c: "Odmítnout a už se nás nikdy neptat." # todo: NEW TRANSLATION
 formable_buy.2.t: "[?formable_offer_holder_id.GetNameDef] přijímá naši nabídku" # todo: NEW TRANSLATION
 formable_buy.2.d: "[?formable_offer_holder_id.GetNameDef] převedl [?formable_offer_state_id.GetName] pod naši správu. Prostředky byly převedeny a území je nyní naše." # todo: NEW TRANSLATION
 formable_buy.2.a: "Hodná investice." # todo: NEW TRANSLATION
 formable_buy.3.t: "[?formable_offer_holder_id.GetNameDef] odmítá naši nabídku" # todo: NEW TRANSLATION
 formable_buy.3.d: "[?formable_offer_holder_id.GetNameDef] odmítl naši nabídku za [?formable_offer_state_id.GetName]. Prostředky byly vráceny do naší pokladny a stát zůstává pod jejich kontrolou." # todo: NEW TRANSLATION
 formable_buy.3.a: "Zvážíme jiné možnosti." # todo: NEW TRANSLATION
 formable_buy.4.t: "Naše nabídka území propadá" # todo: NEW TRANSLATION
 formable_buy.4.d: "Naši vyslanci nabídku nikdy nepředložili. Situace na místě se změnila dříve, než mohly být podmínky předloženy držiteli, a rezervované prostředky byly vráceny do pokladny." # todo: NEW TRANSLATION
 formable_buy.4.a: "Promarněné úsilí." # todo: NEW TRANSLATION
 formable_buy.5.t: "[?formable_offer_holder_id.GetNameDef] zavírá dveře" # todo: NEW TRANSLATION
 formable_buy.5.d: "[?formable_offer_holder_id.GetNameDef] odmítl naši nabídku za [?formable_offer_state_id.GetName] a dal jasně najevo, že o dalších nabídkách nebude jednat. Prostředky byly vráceny do naší pokladny." # todo: NEW TRANSLATION
 formable_buy.5.a: "Pak se poohlédneme jinde." # todo: NEW TRANSLATION
