 form_AVG_category: "Angevinská říše" # todo: NEW TRANSLATION
 form_AVG_category_desc: "Angevinská říše představovala vrchol evropské moci ve 12. a 13. století, kdy dynastie Plantagenetů vládla Anglii, rozsáhlým částem Francie a dalším územím. Říše se vyznačovala svým kulturním a politickým vlivem napříč kontinentem. Obnovení Angevinské říše by bylo monumentálním úspěchem, který by znovu sjednotil tyto historické země pod jedním praporem." # todo: NEW TRANSLATION
