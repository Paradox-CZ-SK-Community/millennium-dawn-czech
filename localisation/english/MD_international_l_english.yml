 IS_un_aid_general_budget: "§YObecný provozní rozpočet§!: $$[?global.un_operating_budget_base|+G3] / týden" # todo: NEW TRANSLATION
 IS_un_aid_general_budget_tt: "Zobrazuje příspěvky států v sestupném pořadí do §YObecného provozního rozpočtu§! §BOSN§!" # todo: NEW TRANSLATION
 IS_un_aid_general_budget_tt_delayed: "§YObecný provozní rozpočet§! je celkový základní rozpočet, do kterého přispívají všechny členské státy §BOSN§!, pokud splní minimální požadavky. Minimální příspěvek do rozpočtu činí §Y[?global.general_operating_budget_contribute_percent|%]§! HDP, vypočítává se každoročně na začátku roku a k rozpočtu musí být přidán minimální příspěvek §G$0.001§!. Státy, které tohoto minima nedosáhnou, v daném roce do rozpočtu nepřispívají a nezískají z toho plynoucí výhody.\n\n§YObecný provozní rozpočet§! je základní částka peněz, kterou členské státy každý týden poskytují §BOrganizaci spojených národů§! k rozdělení mezi různé §YProgramy pomoci§! §BOSN§!. Tyto příspěvky jsou rovnoměrně rozděleny mezi všechny programy a poskytují počáteční základní částku, kterou každý program každý týden obdrží na svůj provoz.\n\nStáty získávají jako odměnu za své příspěvky bonus k multiplikátoru £foreign_influence_modifier_texticon §YZahraničního vlivu§! a k multiplikátoru £foreign_influence_defense_modifier_texticon §YOchrany před zahraničním vlivem§! odpovídající jejich procentuálnímu podílu na §YObecném provozním rozpočtu§!." # todo: NEW TRANSLATION
 is_un_aid_total_budget_spending: "§RCelkové výdaje§! na §COSN§!:" # todo: NEW TRANSLATION
 is_un_aid_total_budget_spending_tt: "V současnosti vynakládáme $[?united_nations_expenses|-3] na financování §BOSN§!" # todo: NEW TRANSLATION
 is_un_aid_total_budget_spending_tt_delayed: "Toto číslo zobrazuje, kolik vynakládáme na všechny §YProgramy pomoci§! §BOSN§!, včetně §YObecného provozního rozpočtu§! a našich nezávislých rozhodnutí o dalších příspěvcích do programů §BOSN§!." # todo: NEW TRANSLATION
 is_un_basic_budget_spending: "§RVýdaje§! na §Yrozpočet§! §COSN§!:" # todo: NEW TRANSLATION
 is_un_basic_budget_spending_tt: "V současnosti vynakládáme $[?united_nations_base_expenses|-3] na §YObecný provozní rozpočet§! §BOSN§!" # todo: NEW TRANSLATION
 is_un_basic_budget_spending_tt_delayed: "§YObecný provozní rozpočet§! je základní částka peněz, kterou členské státy každý týden poskytují §BOrganizaci spojených národů§! k rozdělení mezi různé §YProgramy pomoci§! §BOSN§!. Tyto příspěvky jsou rovnoměrně rozděleny mezi všechny programy a poskytují počáteční základní částku, kterou každý program každý týden obdrží na svůj provoz. Programy financované z tohoto rozpočtu jsou §YUNIDO§!, §YUNCDF§! a §YUNESCOE§!." # todo: NEW TRANSLATION
 is_un_aid_unescoe_spending: "§RVýdaje§! na §YUNESCOE§!:" # todo: NEW TRANSLATION
 is_un_aid_unescoe_spending_tt: "V současnosti vynakládáme $[?united_nations_unescoe_funding|-3] na §YProgram UNESCOE§!" # todo: NEW TRANSLATION
 is_un_aid_unescoe_spending_tt_delayed: "§BVzdělávací, vědecká a kulturní organizace§! §BOrganizace spojených národů§! je organizace poskytující pomoc, jejímž cílem je zlepšovat vzdělávání, poskytovat technické poradenství rozvojovým zemím a zajišťovat politický dialog pro státy, které potřebují pomoc s rozvojem.\n\nTento §YProgram pomoci§! §BOSN§! poskytne bonusy k £research_speed_texticon §YRychlosti výzkumu§! a £political_power_texticon §YZisku politické moci§!." # todo: NEW TRANSLATION
 is_un_aid_unido_spending: "§RVýdaje§! na §YUNIDO§!:" # todo: NEW TRANSLATION
 is_un_aid_unido_spending_tt: "V současnosti vynakládáme $[?united_nations_unido_funding|-3] na §YProgram UNIDO§!" # todo: NEW TRANSLATION
 is_un_aid_unido_spending_tt_delayed: "§YOrganizace OSN pro průmyslový rozvoj§! je program pomoci určený k podpoře průmyslového rozvoje. Pomocí rozvojovým zemím při budování vlastního průmyslu tento program bojuje proti chudobě, podporuje inkluzivní globalizaci a zaměřuje se také na ekologickou udržitelnost.\n\nTento §YProgram pomoci§! §BOSN§! poskytne možnost získat bezplatný pronajatý §Ycivilní průmysl§! a zároveň zlepší £construction_speed_texticon §Yrychlost výstavby§! států, aby pomohl zlepšit jejich průmyslovou základnu, energetickou a stavební infrastrukturu." # todo: NEW TRANSLATION
 is_un_aid_uncdf_spending: "§RVýdaje§! na §YUNCDF§!:" # todo: NEW TRANSLATION
 is_un_aid_uncdf_spending_tt: "V současnosti vynakládáme $[?united_nations_uncdf_funding|-3] na §YProgram UNCDF§!" # todo: NEW TRANSLATION
 is_un_aid_uncdf_spending_tt_delayed: "§YKapitálový rozvojový fond§! §BOrganizace spojených národů§! je program pomoci určený ke zlepšení toku kapitálu pro národní investice. Cílem tohoto programu je prostřednictvím investičních programů a digitálních financí vytvářet pracovní místa a podporovat udržitelný hospodářský růst.\n\nTento §YProgram pomoci§! §BOSN§! poskytne státům přijímajícím pomoc jak §Yfinanční§!, tak §Yrozvojovou§! podporu. Program je určen ke zlepšení rozpočtů a zvýšení růstu produktivity." # todo: NEW TRANSLATION
 is_un_aid_spending_percent: "% §Yzákladního rozpočtu§!:" # todo: NEW TRANSLATION
 is_un_aid_spending_percent_tt: "Procento §YObecného provozního rozpočtu§!, kterým přispíváme, činí [?united_nations_contribution_percent|Y%2]" # todo: NEW TRANSLATION
 is_un_aid_spending_percent_tt_delayed: "Procento §YObecného provozního rozpočtu§! je otázkou prestiže i moci. Čím více přispíváme, tím větší vliv £foreign_influence_modifier_texticon §YZahraničního vlivu§! budeme moci uplatnit nad ostatními a tím účinnější náš vliv bude. Čím vyšší se nám podaří toto procento nastavit, tím lépe." # todo: NEW TRANSLATION
 is_un_aid_additional_percent: "% §Cprogramů pomoci§! §BOSN§!:" # todo: NEW TRANSLATION
 is_un_aid_additional_percent_tt: "Procento všech §YDodatečných příspěvků do programů pomoci§!, kterými přispíváme, činí [?united_nations_aid_program_contribution_percent|Y%2]" # todo: NEW TRANSLATION
 is_un_aid_additional_percent_tt_delayed: "Procento §YDodatečných příspěvků do programů pomoci§! nám poskytuje větší vliv nad státy, které pomoc z programů přijímají, a přináší nám vyšší £political_power_texticon §YZisk politické moci§!. Zároveň zvyšuje šanci, že ostatní státy přijmou naše §YInvestice§!, protože §Gzkracuje§! dobu i náklady potřebné pro naše §YInvestice§!." # todo: NEW TRANSLATION
 is_un_aid_total_budget_ido_tt_delayed: "§Y25 %§! rozpočtu programu jde na pomoc zemím se zlepšením jejich £construction_speed_texticon §Yrychlosti výstavby§! a zbývajících §Y75 %§! se používá k poskytování pronajatých §Ycivilních průmyslů§! §Ydotovaným§! státům." # todo: NEW TRANSLATION
