 CT_CUR_POLICE_COST: "§YModifikátor bezpečnostních nákladů§!" # todo: NEW TRANSLATION
 CT_FUND_POLICE_TT: "Zobrazuje procentuální hodnotu, o kterou se zvýší §Yvýdaje na vnitřní bezpečnost§! v důsledku finančních opatření provedených v tomto systému." # todo: NEW TRANSLATION
 CT_SYS_DESC: "§YProtiteroristický systém§! funguje tak, že globální situace určuje, zda teroristické organizace zvýší svou hrozbu a jak viditelné budou pro zpravodajské služby. S růstem §RÚrovně teroristické hrozby§! se zvýší četnost a síla útoků organizace. Světové napětí, spokojenost země a kroky hráče mohou §RÚroveň teroristické hrozby§! zvýšit nebo snížit. Tyto hodnoty se aktualizují měsíčně nebo po významných akcích.\n\nHráči mohou provádět operace shromažďování zpravodajských informací pomocí systému špionáže a akcí v této nabídce a také provádět nájezdy pomocí systému nájezdů, aby získali informace a snížili §RÚroveň teroristické hrozby§!. S rostoucí §YPřesností zpravodajství§! budete moci přesněji zaměřovat teroristické organizace, až nakonec získáte možnost přepadnout jejich velitelství a hrozbu zlikvidovat." # todo: NEW TRANSLATION
