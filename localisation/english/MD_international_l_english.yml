 un_ascent_effect_tt: "Podá žádost o §Bvzestup v OSN§!, nejprve zahájí hlasování v §YRádě bezpečnosti§! a poté, pokud hlasování v §YRádě bezpečnosti§! projde, hlasování ve §YValném shromáždění§!.\n\nAbychom dosáhli §Ymezinárodního uznání§! a byli přijati jako stát §BOrganizace spojených národů§!, musíme splnit následující:\n\n§GSchválit§! doporučující hlasování v §YRádě bezpečnosti§!, které vyžaduje celkem §Y9§! hlasů §Gpro§! a §Y0§! hlasů §Rproti§! od §Ystálého člena Rady bezpečnosti§!\n\nPo §Gschválení§! hlasování v §YRádě bezpečnosti§! §Gschválit§! ve §BOrganizaci spojených národů§! hlasování většinou §Y2/3§!." # todo: NEW TRANSLATION
