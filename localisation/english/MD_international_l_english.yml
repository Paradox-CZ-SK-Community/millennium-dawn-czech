 MD_terror.1.t: "[org_doing_attack] provádí teroristický útok!" # todo: NEW TRANSLATION
 MD_terror.1.d: "[org_doing_attack] dnes proti nám provedla teroristický útok, kterému naše zpravodajské a protiteroristické služby nedokázaly zabránit. Zprávy o škodách a obětech stále přicházejí, ale odhaduje se, že obojí bude značné. Nyní musíme rozhodnout o našem dalším kroku, abychom v této krizové době zajistili bezpečí, ochranu a podporu našim občanům." # todo: NEW TRANSLATION
 MD_terror.1.a: "Musíme nechat reagovat místní složky." # todo: NEW TRANSLATION
 MD_terror.1.b: "Pošleme tolik pomoci, kolik dokážeme!" # todo: NEW TRANSLATION
 MD_terror.2.t: "[org_doing_attack] teroristický útok odvrácen!" # todo: NEW TRANSLATION
 MD_terror.2.d: "[org_doing_attack] se dnes pokusila provést teroristický útok, ale díky účinnému shromažďování zpravodajských informací našimi službami a odvážnému zásahu našich protiteroristických týmů mu bylo zabráněno. Všichni zúčastnění teroristé byli zabiti nebo zajati a jejich bezpečné úkryty se nyní vyšetřují kvůli dalším zpravodajským informacím. Dnešek je velkým úspěchem našich protiteroristických sil!" # todo: NEW TRANSLATION
 MD_terror.2.a: "Velké vítězství pro [THIS.GetNameDef]!" # todo: NEW TRANSLATION
 MD_terror.3.t: "[FROM.GetName] zasažen teroristickým útokem!" # todo: NEW TRANSLATION
 MD_terror.3.d: "[FROM.GetName] byl dnes zasažen útokem organizace [org_doing_attack_int], která dokázala státu způsobit značné škody a ztráty na životech. Zatímco se [FROM.GetName] vzpamatovává z útoku, naši vlastní občané začínají mít obavy z možných útoků na našem území. Musíme rozhodnout, zda státu [FROM.GetName] pošleme podporu, a také co uděláme pro uklidnění vlastních občanů." # todo: NEW TRANSLATION
 MD_terror.3.a: "Jaká tragédie." # todo: NEW TRANSLATION
 MD_terror.3.b: "Musíme zpřísnit vlastní bezpečnost!" # todo: NEW TRANSLATION
 MD_terror.3.c: "Mučednický úder proti nevěřícím!" # todo: NEW TRANSLATION
 MD_terror.4.t: "[FROM.GetName] odvrátil teroristický útok!" # todo: NEW TRANSLATION
 MD_terror.4.d: "Vláda státu [FROM.GetName] dnes oznámila, že úspěšně zabránila teroristickému útoku organizace [org_doing_attack_int] na svém území. K narušení teroristické buňky před útokem využila účinné zpravodajské, policejní a vojenské operace. Dnešní úspěch je velkým vítězstvím v globální válce proti terorismu!" # todo: NEW TRANSLATION
 MD_terror.4.a: "[FROM.GetNameDef] byl zjevně připraven." # todo: NEW TRANSLATION
 MD_terror.5.t: "Protesty proti hromadnému shromažďování dat" # todo: NEW TRANSLATION
 MD_terror.5.d: "Kvůli únikům z naší zpravodajské komunity se veřejnost dozvěděla o našem hromadném shromažďování dat v rámci snahy zabránit terorismu. Lidé to však vnímají jako masivní narušení soukromí a začali kritizovat a protestovat proti tomu, co považují za překračování pravomocí vlády." # todo: NEW TRANSLATION
 MD_terror.5.a: "Děláme to pro jejich dobro!" # todo: NEW TRANSLATION
 MD_terror.6.t: "Protesty proti hromadnému zatýkání" # todo: NEW TRANSLATION
 MD_terror.6.d: "Ačkoli naše hromadné zatýkání stoupenců [name_of_org_disp] účinně narušilo jejich operace, kvůli špatným zpravodajským informacím jsme také omylem zatkli velké množství nevinných civilistů a kolemjdoucích. Veřejnost se proto rozhořčila nad našimi protiteroristickými operacemi a začíná protestovat proti používání hromadného zatýkání a dalších kritických metod, které musíme používat k zajištění bezpečnosti našeho státu." # todo: NEW TRANSLATION
 MD_terror.6.a: "Nestačí se omluvit?" # todo: NEW TRANSLATION
 MD_terror.7.t: "Úspěšná infiltrace!" # todo: NEW TRANSLATION
 MD_terror.7.d: "Náš agent se konečně ozval: úspěšně zaujal své místo a nyní působí uvnitř organizace. Může to chvíli trvat, ale jak budeme naše operace posouvat vpřed, zpravodajské informace, které nám dokáže předávat, budou pro náš stát velmi cenné." # todo: NEW TRANSLATION
 MD_terror.7.a: "Jeho informace budou nesmírně cenné!" # todo: NEW TRANSLATION
 MD_terror.8.t: "Agent zabit" # todo: NEW TRANSLATION
 MD_terror.8.d: "Bohužel nyní, po delší době bez zpráv od našeho agenta, konečně víme proč. [name_of_org_disp] dnes zveřejnila video, na němž našeho agenta spolu s několika dalšími popravuje. Zjevně byl odhalen nebo zajat, a v důsledku toho mají veškeré informace, které nám dříve poskytl nebo které nyní získáváme, menší hodnotu, protože organizace ví, že ho sledujeme." # todo: NEW TRANSLATION
 MD_terror.8.a: "Jaká ztráta." # todo: NEW TRANSLATION
 MD_terror.9.t: "Rozhořčení nad zvýšenými bezpečnostními opatřeními" # todo: NEW TRANSLATION
 MD_terror.9.d: "Občané jsou nespokojeni se zvýšenými bezpečnostními opatřeními, která jsme zavedli a která zkomplikovala leteckou, námořní i pozemní dopravu. Rozhořčení vyvolala také zvýšená bezpečnostní úroveň na vládních akcích, což zatěžuje naše vztahy s občany." # todo: NEW TRANSLATION
 MD_terror.9.a: "Opatření musí zůstat!" # todo: NEW TRANSLATION
 MD_terror.9.b: "Možná bychom mohli jejich dopad trochu zmírnit..." # todo: NEW TRANSLATION
 MD_terror.11.t: "[FROM.GetName] navrhuje společná protiteroristická cvičení" # todo: NEW TRANSLATION
 MD_terror.11.d: "[FROM.GetName] navrhl provedení společných protiteroristických cvičení s cílem rozšířit schopnosti našich vojenských a protiteroristických sil. Pokud nabídku přijmeme, budeme muset na cvičení vynaložit určité prostředky, ale část peněz bude muset vynaložit i druhá strana. Pokud odmítneme, pravděpodobně je tím rozrušíme, ale časem se přes to přenesou." # todo: NEW TRANSLATION
 MD_terror.11.a: "Proveďte cvičení!" # todo: NEW TRANSLATION
 MD_terror.11.b: "Je to ztráta času." # todo: NEW TRANSLATION
 MD_terror.11.c: "Nebudeme cvičit po boku nevěřících!" # todo: NEW TRANSLATION
 MD_terror.13.t: "[FROM.GetName] nabízí poradce" # todo: NEW TRANSLATION
 MD_terror.13.d: "[FROM.GetName] navrhl, že nám pošle pomoc v podobě zahraničních poradců. To by sice zvýšilo naše protiteroristické schopnosti, zároveň však musíme předpokládat, že tito poradci budou podávat zprávy o našich aktivitách a schopnostech, což by mohlo vést k úniku zpravodajských informací." # todo: NEW TRANSLATION
 MD_terror.13.a: "Nabídku přijímáme!" # todo: NEW TRANSLATION
 MD_terror.13.b: "[THIS.GetName] žádnou pomoc nepotřebuje!" # todo: NEW TRANSLATION
 MD_terror.13.c: "Nebudeme hostit špiony křižáků!" # todo: NEW TRANSLATION
 MD_terror.14.t: "[FROM.GetName] odvolává poradce" # todo: NEW TRANSLATION
 MD_terror.14.d: "[FROM.GetName] stáhl ze své země protiteroristické poradce, což snížilo naše schopnosti provádět protiteroristické operace." # todo: NEW TRANSLATION
 MD_terror.14.a: "Jak se opovažují!" # todo: NEW TRANSLATION
 MD_terror.15.t: "[FROM.GetName] přijímá poradce!" # todo: NEW TRANSLATION
 MD_terror.15.d: "[FROM.GetName] přijal naši nabídku protiteroristických poradců z našich zpravodajských služeb! Nejenže nám to pomůže zlepšit jejich protiteroristické operace, ale také získáme vhled do jejich shromažďování a zpracování zpravodajských informací." # todo: NEW TRANSLATION
 MD_terror.15.a: "Rozhodli se správně!" # todo: NEW TRANSLATION
 MD_terror.16.t: "[FROM.GetName] odmítá poradce!" # todo: NEW TRANSLATION
 MD_terror.16.d: "[FROM.GetName] odmítl vpustit naše protiteroristické poradce do své země." # todo: NEW TRANSLATION
 MD_terror.16.a: "Je to jejich škoda." # todo: NEW TRANSLATION
