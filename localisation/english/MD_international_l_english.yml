 terror_main_category: "Čím vyšší je §YTerror Threat§! v zemi, tím vyšší je pravděpodobnost, že džihádistické skupiny zaútočí na domácí cíle (např. vládní budovy) i na zahraniční cíle (např. vojenské základny) v té zemi. Útoky mohou být vedeny i v sousední zemi, pokud je její hranice nepřísně hlídána. Závažnost útoků a pravděpodobnost jejich úspěchu lze snížit zvýšením výdajů na vnitřní bezpečnost a prováděním protiteroristického výcviku." # todo: NEW TRANSLATION
 terror_instruct_category: "Schopnost země snížit §YTerror Threat§! pod určitou úroveň závisí na tom, zda je ve válce, její stabilitě, GDP/c a úrovni korupce. §YTerror Threat§! může vzrůst vlivem §YRadicalization§! a infiltrace džihádistů z sousedních zemí. Bude klesat při nízké úrovni §YRadicalization§! a v důsledku razie a externího zásahu. Minimální úroveň §YRadicalization§! lze snížit bojem proti korupci, zvyšováním stability a růstem ekonomiky. §YRadicalization§! roste spolu s popularitou [Caliphate_L] a v důsledku rychlé sociální liberalizace." # todo: NEW TRANSLATION
