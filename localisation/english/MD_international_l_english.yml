 recognition_category_desc: "Několik neuznaných států usiluje o členství v mezinárodním společenství. Musíme se rozhodnout, zda podpoříme jejich kampaně. Pokud získají dostatečnou podporu od členských států OSN, mohou být přijaty do Organizace spojených národů a zbaví se svého neuznaného statusu a s ním spojených nevýhod. Pro státy, které jsme již uznali, můžeme jejich kampaně dále podporovat tím, že povzbudíme ostatní členské státy OSN, aby je uznaly také." # todo: NEW TRANSLATION
 recog_cat_nation_guide_tt: "Jako neuznaný národ se musíme snažit přimět §COrganizaci spojených národů§!, aby nás uznala jako nezávislý stát. Spoluprací se spojenci, podáváním žádostí §COSN§! a dalšími politickými manévry nakonec získáme potřebnou podporu k §Yvzestupu§!" # todo: NEW TRANSLATION
