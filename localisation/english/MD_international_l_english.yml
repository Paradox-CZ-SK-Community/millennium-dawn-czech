 CT_CUR_SEL_INTEL: "§YPřesnost zpravodajství§!" # todo: NEW TRANSLATION
 CT_CUR_SEL_INTEL_TT: "Zobrazuje, jak účinné je v současnosti naše shromažďování zpravodajských informací proti této organizaci." # todo: NEW TRANSLATION
 CT_CUR_LOCATION: "§YMožné umístění velitelství§!" # todo: NEW TRANSLATION
 CT_CUR_LOCATION_TT: "Zobrazuje místo, kde se podle našeho odhadu může nacházet regionální velitelství." # todo: NEW TRANSLATION
 CT_CUR_FOREIGN: "§YZahraniční poradci§!" # todo: NEW TRANSLATION
 CT_CUR_FOREIGN_TT: "Toto číslo představuje počet zemí, které nám vyslaly poradce na pomoc s protiteroristickými operacemi. Každý stát, který vyšle poradce, zvýší náš modifikátor §YPřesnosti zpravodajství§! o §G1 %§!, čímž zlepší naši §YPřesnost zpravodajství§!. Státy se §YZahraničními poradci§! v naší zemi budou mít navíc zlepšeny své operace na našem území." # todo: NEW TRANSLATION
 CT_CUR_FUNDING_DETECT: "§YBonus detekce financování§!" # todo: NEW TRANSLATION
