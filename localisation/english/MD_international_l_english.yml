 is_ct_infil_agent_tt: "Pokusí se infiltrovat agenta do §Y[name_of_org_disp]§!. Pokud bude úspěšný, získáme trvalý bonus k §YPřesnosti zpravodajství§!. Pokud infiltrace selže, naše §YPřesnost zpravodajství§! se na krátkou dobu zhorší a §RÚroveň teroristické hrozby§! organizace §Y[name_of_org_disp]§! vzroste.\n\nŠanci na úspěch infiltrace ovlivňuje naše §YPřesnost zpravodajství§! a celkový výcvik agentů §YZpravodajské služby§!." # todo: NEW TRANSLATION
 is_ct_asset_seizure_tt: "Zabavení majetku sníží §RÚroveň teroristické hrozby§! organizace §Y[name_of_org_disp]§!, ale na krátkou dobu také ztíží získávání §YPřesnosti zpravodajství§! proti §Y[name_of_org_disp]§!." # todo: NEW TRANSLATION
 is_ct_arrest_sympathizers_tt: "Zatýkání sympatizantů sníží §RÚroveň teroristické hrozby§! organizace §Y[name_of_org_disp]§! a zároveň zvýší §YPřesnost zpravodajství§! o §Y[name_of_org_disp]§!. Existuje však možnost, že při zatýkání budou zadrženi i nevinní lidé, což může vést k politickému odporu.\n\nÚčinnost zatýkání bude záviset na naší §YPřesnosti zpravodajství§! a vylepšeních §YZpravodajské služby§! v oblasti kontrarozvědky a protiterorismu.\n" # todo: NEW TRANSLATION
