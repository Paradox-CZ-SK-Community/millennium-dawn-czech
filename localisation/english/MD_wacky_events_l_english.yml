l_english:
 MD_wacky.1.t: "Nezaregistrovaný kontakt na Štědrý večer" # todo: NEW TRANSLATION
 MD_wacky.1.d: "Protivzdušná obrana krátce po půlnoci zaznamenala pomalý nízko letící objekt, který překročil hranici, a bez varování na něj zaútočila. Záchranný tým hlásí saně, devět sobů a velmi velký pytel zabalených dárků." # todo: NEW TRANSLATION
 MD_wacky.1.a: "Klasifikujte trosky." # todo: NEW TRANSLATION
 MD_wacky.1.b: "Omluvte se dětem." # todo: NEW TRANSLATION
 MD_wacky.2.t: "Neidentifikovaný objekt nad hlavním městem" # todo: NEW TRANSLATION
 MD_wacky.2.d: "Tisíce lidí vyfotografovaly tiché trojúhelníkové světlo, které po dobu jedenácti minut setrvávalo nad vládní čtvrtí. Letectvo trvá na tom, že jeho radary nezaznamenaly vůbec nic." # todo: NEW TRANSLATION
 MD_wacky.2.a: "Vyšlete stíhače." # todo: NEW TRANSLATION
 MD_wacky.2.b: "Oznamte, že šlo o meteorologický balon." # todo: NEW TRANSLATION
 MD_wacky.3.t: "Vesmírný odpad dopadl na parkoviště ministerstva" # todo: NEW TRANSLATION
 MD_wacky.3.d: "Titanová palivová nádrž z vyřazeného komunikačního satelitu v noci dopadla na zem a zdemolovala tři služební vozidla a živý plot. Nikdo nebyl zraněn a žádná vesmírná agentura nepřizná, komu satelit patřil." # todo: NEW TRANSLATION
 MD_wacky.3.a: "Vystavte účet státu, který jej vypustil." # todo: NEW TRANSLATION
 MD_wacky.3.b: "Umístěte ji do muzea." # todo: NEW TRANSLATION
 MD_wacky.4.t: "Automaty vyřadily síť ministerstva" # todo: NEW TRANSLATION
 MD_wacky.4.d: "Ministerstvo vnitra celý týden pátralo po zahraničním kybernetickém útoku, než technici vysledovali provoz k chytrým automatům ve vlastní budově, které potají objednávaly sycené nápoje v nekonečné smyčce." # todo: NEW TRANSLATION
 MD_wacky.4.a: "Odpojte všechny automaty v budově." # todo: NEW TRANSLATION
 MD_wacky.4.b: "Nechte tisk věřit, že za tím stála cizí mocnost." # todo: NEW TRANSLATION
 MD_wacky_events: "Podivný incident" # todo: NEW TRANSLATION
 MD_wacky_classified_intercept: "Utajené zachycení" # todo: NEW TRANSLATION
 MD_wacky_classified_intercept_desc: "Tento útok se neobjevuje v žádném zveřejněném záznamu a zúčastněným posádkám bylo nařízeno, aby nikdy nemluvily o tvaru cíle. Záznam z kamery na kanónu je však vynikajícím výukovým materiálem." # todo: NEW TRANSLATION
 MD_wacky_ufo_conspiracy: "Vysvětlení meteorologickým balonem" # todo: NEW TRANSLATION
 MD_wacky_ufo_conspiracy_desc: "Oficiálnímu prohlášení nikdo nevěří. Dva soupeřící občanské výbory nyní zveřejňují konkurenční fotografické analýzy a jedna televizní stanice objednala dokument o mlčení vlády." # todo: NEW TRANSLATION
 MD_wacky_debris_exhibit: "Expozice trosek po návratu do atmosféry" # todo: NEW TRANSLATION
 MD_wacky_debris_exhibit_desc: "Palivová nádrž stojí v národním muzeu vedle fotografie tří vozidel, na která dopadla. Návštěvnost vzrostla a neobvykle mnoho školáků nyní říká, že hodlají studovat techniku." # todo: NEW TRANSLATION
 MD_wacky_phantom_cyber_threat: "Přízračná kybernetická hrozba" # todo: NEW TRANSLATION
 MD_wacky_phantom_cyber_threat_desc: "Ministerstvo nikdy neopravilo zprávu o zahraničním průniku a rozpočet na zabezpečení krizové sítě byl schválen bez jediné otázky. Automaty byly z budovy odstraněny." # todo: NEW TRANSLATION
