l_english:
 GRE_nato_pressure_turkey_accept_tt: "Spojenci, kteří podpoří Řecko, zmírní napětí v Egejském moři a posílí dynamiku na Kypru, čímž zvýší šanci, že Turecko během měsíce ustoupí." # todo: NEW TRANSLATION
 GRE_nato_pressure_turkey_reject_tt: "Spojenci, kteří odmítnou, nepřidají žádnou diplomatickou váhu, takže Turecko bude méně ochotné ustoupit." # todo: NEW TRANSLATION
 GRE_hellenic_economy: "Řecká ekonomika" # todo: NEW TRANSLATION
 GRE_hellenic_economy_desc: "Řecká ekonomika se nachází v obtížné situaci. Rostoucí dluh, nezaměstnanost a otázka vstupu do eurozóny jsou naléhavými problémy. Máme však silné obchodní loďstvo, strategickou polohu a cestovní ruch, který každoročně přivádí miliony návštěvníků. Měli bychom co nejlépe využít to, co máme." # todo: NEW TRANSLATION
 GRE_debt_mounts: "Dluh narůstá" # todo: NEW TRANSLATION
 GRE_debt_mounts_desc: "Náš dluh vzrostl na téměř 300 miliard dolarů, což je jeden z nejvyšších poměrů na obyvatele na světě. Úrokové platby pohlcují obrovskou část našeho rozpočtu a na investice zbývá jen málo prostoru. Zahraniční bankéři jsou stále neklidnější a EU požaduje odpovědi. Musíme jednat, než se situace zhorší." # todo: NEW TRANSLATION
 GRE_debt_mounts_req_tt: "Náš §Yjednotný poměr dluhu§! je vyšší než §Y90 %§! (aktuálně §Y[?GRE_unified_debt_ratio|-1%]§!)" # todo: NEW TRANSLATION
 GRE_brics_membership_req_tt: "Skóre východního směřování je vyšší než 7" # todo: NEW TRANSLATION
 GRE_pillar_of_the_west_req_tt: "Závazek vůči Západu je vyšší než 3" # todo: NEW TRANSLATION
 GRE_aegean_assertiveness_event_tt: "§YZa 90 dní Turecko zareaguje na naše hlídky v Egejském moři.§!" # todo: NEW TRANSLATION
 GRE_cyprus_gas_crisis_event_tt: "§RZa již tak vysokého napětí vrty během několika dní vyvolají reakci tureckého námořnictva.§!" # todo: NEW TRANSLATION
 GRE_greek_bonds: "Návrat na dluhopisové trhy" # todo: NEW TRANSLATION
 GRE_greek_bonds_desc: "Atény byly od krize vytlačeny z dlouhodobého zadlužování, takže ministerstvo financí je závislé na krátkodobých směnkách a výplatách věřitelů. Referenční desetiletá emise, nabízená prostřednictvím Agentury pro správu veřejného dluhu evropským a americkým fondům, by ověřila, zda jsou investoři připraveni znovu půjčovat Řecku za běžných podmínek." # todo: NEW TRANSLATION
 GRE_solve_evasion: "Vyřešit daňové úniky" # todo: NEW TRANSLATION
 GRE_solve_evasion_desc: "Každý rok přicházíme kvůli daňovým únikům o miliardy na příjmech. Pokud posílíme výběr daní, investujeme do lepších technologií a zakročíme proti offshore účtům, můžeme uzavřít mezery a vrátit náš rozpočet do správných kolejí." # todo: NEW TRANSLATION
 GRE_convert_to_euro: "Přijmout euro" # todo: NEW TRANSLATION
 GRE_convert_to_euro_desc: "Euro je příležitostí i rizikem. Jeho přijetí propojí naši ekonomiku s Evropou, což znamená větší stabilitu, než jakou kdy měla drachma, ale ztratíme kontrolu nad vlastní měnovou politikou. Záleží na nás, zda tato výměna stojí za to." # todo: NEW TRANSLATION
 GRE_skouries_mines: "Doly Skouries" # todo: NEW TRANSLATION
 GRE_skouries_mines_desc: "Měděno-zlaté ložisko Skouries na Chalkidiki patří k největším v Evropě. Zahraniční korporace chtějí těžební práva a slibují pracovní místa a bohatství. Ekologové jsou proti. Budeme se muset rozhodnout, na čem záleží více." # todo: NEW TRANSLATION
 GRE_local_manufacturing: "Vyrobeno v Řecku" # todo: NEW TRANSLATION
 GRE_local_manufacturing_desc: "Řecký zpracovatelský průmysl se zmenšil na několik odvětví: potravinářství, cement, hliník, farmaceutika a stavbu lodí podél pobřeží Peramy. Pravidlo upřednostňující domácí výrobce ve veřejných zakázkách spolu s investičními pobídkami podle rozvojového zákona by přeživším závodům poskytlo potřebné zakázky k opětovnému náboru zaměstnanců." # todo: NEW TRANSLATION
 GRE_military_industrial: "Řecký zbrojní průmysl" # todo: NEW TRANSLATION
 GRE_military_industrial_desc: "Elliniki Viomichania Oplon a její sesterská společnost Pyrkal vyzbrojují řecké vojáky od studené války, avšak desetiletí státního vlastnictví je zatížila dluhy a nevyužitými výrobními linkami. Trvalé a cílené dotace by mohly udržet pece v provozu, zajistit domácí dodávky munice a ručních zbraní a spojit oba podniky do jediného konkurenceschopného výrobce namísto trvalé zátěže pro státní rozpočet." # todo: NEW TRANSLATION
 GRE_agriculture_sector: "Páteř venkova" # todo: NEW TRANSLATION
 GRE_agriculture_sector_desc: "Téměř pětina Řeků stále získává obživu z půdy, od olivových hájů na Peloponésu po bavlníková pole v Thesálii. Odvětví však stárne, je rozdrobené na malé parcely a závislé na dotacích z Bruselu v rámci společné zemědělské politiky. Podpora zemědělců spolu s rozvojem zavlažování, družstev a moderních strojů by udržela kalamatské olivy, fetu a Assyrtiko na stolech celého světa." # todo: NEW TRANSLATION
 GRE_power_corporations: "Veřejná energetická společnost" # todo: NEW TRANSLATION
 GRE_power_corporations_desc: "Půl století státem vlastněná Veřejná energetická společnost, DEI, udržuje světla rozsvícená spalováním lignitu těženého v dolech u Ptolemaidy a Megalopoli. Toto uhlí je levné, ale špinavé, a naše závislost na dovážené ropě a plynu nás vystavuje každému otřesu na Blízkém východě. Modernizace sítě, rozšíření plynovodní sítě DEPA a výstavba nových elektráren by z těchto podniků učinily strategickou páteř národa." # todo: NEW TRANSLATION
 GRE_austerity_measures: "Úsporná opatření" # todo: NEW TRANSLATION
 GRE_austerity_measures_desc: "Věřitelé požadují snížení důchodů, vyšší daně a zrušení dávek. Bez úspor čelíme bankrotu, s nimi však veřejnému hněvu. Protesty a stávky jsou nevyhnutelné. Snadná rozhodnutí zde neexistují." # todo: NEW TRANSLATION
 GRE_debt_refactoring: "Strategická restrukturalizace dluhu" # todo: NEW TRANSLATION
 GRE_debt_refactoring_desc: "Aukce dluhopisů nám získaly čas, ale to nestačí. Věřitelé jsou netrpěliví a úrokové platby vyčerpávají státní pokladnu. Musíme restrukturalizovat svůj dluh: znovu vyjednat podmínky, prodloužit splatnost a ukázat partnerům, že když nám poskytnou prostor k nadechnutí, skutečně jim budeme schopni splatit, co jim dlužíme." # todo: NEW TRANSLATION
 GRE_ilarionas_hydro: "Vodní elektrárna Ilarionas" # todo: NEW TRANSLATION
 GRE_ilarionas_hydro_desc: "Řeka Ilarionas v severním Řecku má obrovský hydroelektrický potenciál. Vodní energie je čistá, obnovitelná a na rozdíl od slunce či větru dostupná podle potřeby. Tento projekt by mohl zásobovat elektřinou statisíce domácností." # todo: NEW TRANSLATION
 GRE_telecomms: "Investice do OTE" # todo: NEW TRANSLATION
 GRE_telecomms_desc: "Miliony Řeků v ostrovních vesnicích a horských městech stále nemají spolehlivý telefonní ani internetový přístup. Státní investice do OTE by mohla tyto oblasti propojit se zbytkem země a poskytnout zemědělcům přístup na trhy a studentům přístup k univerzitám." # todo: NEW TRANSLATION
 GRE_new_railways: "Obnova železniční trati Atény–Soluň" # todo: NEW TRANSLATION
 GRE_new_railways_desc: "Koridor Atény–Soluň je páteří pevninského Řecka, železniční trať je však bolestně pomalá. Moderní soupravy a modernizovaná trať by mohly zkrátit cestovní dobu na polovinu a výrazně podpořit provinční ekonomiku." # todo: NEW TRANSLATION
 GRE_highway_initiatives: "Rozšířit dálnice AX" # todo: NEW TRANSLATION
 GRE_highway_initiatives_desc: "Hory, které kdysi rozdělovaly starověké městské státy, dodnes izolují obce a poškozují obchod. Navrhovaná dálniční síť AX by proťala pohoří Pindos a spojila západní pobřeží s Thesálií. Bude nákladná, ale hospodářské přínosy by mohly stát za to." # todo: NEW TRANSLATION
 GRE_hellas_gold: "Rozšířit doly Kassandra" # todo: NEW TRANSLATION
 GRE_hellas_gold_desc: "Těžební oblast Kassandra má značné zásoby chromu, které dosud nebyly plně využity. Prohloubení stávajících provozů a investice do těžebního vybavení by toto bohatství přivedly na trh a snížily naši závislost na dovozu." # todo: NEW TRANSLATION
 GRE_euboea_bauxite_deposits: "Bauxitová ložiska na Euboji" # todo: NEW TRANSLATION
 GRE_euboea_bauxite_deposits_desc: "Euboia má významná ložiska bauxitu, hlavní rudy pro výrobu hliníku. Velkoplošná těžba by mohla zásobovat naši průmyslovou základnu a omezit nákladný dovoz." # todo: NEW TRANSLATION
 GRE_industrial_lignite_mining: "Pánev Ptolemaidy" # todo: NEW TRANSLATION
 GRE_industrial_lignite_mining_desc: "Povrchové lignitové doly kolem Ptolemaidy a Amyntaia v Západní Makedonii zásobují Veřejnou energetickou společnost již půl století. Rozšíření těžby a přidání zkapalňovacího závodu by z pánve učinily domácí zdroj paliva namísto stárnoucí uhelné oblasti." # todo: NEW TRANSLATION
 GRE_rare_element_prospecting: "Prozkoumat řecké podloží" # todo: NEW TRANSLATION
 GRE_rare_element_prospecting_desc: "Chalkidické zlato-měděné porfyry, bauxitový pás Parnassu a Peloponésu a niklové laterity Euboje představují pouze zmapovaná ložiska. Celostátní geologický průzkum vedený IGME a podpořený průzkumnými licencemi by identifikoval další generaci těžebních lokalit." # todo: NEW TRANSLATION
 GRE_transport_sector: "Silnice, železnice a trajekty" # todo: NEW TRANSLATION
 GRE_transport_sector_desc: "Země ostrovů a hor žije či umírá podle své dopravy. Autobusy KTEL se vinou horskými průsmyky, modrobílé trajekty propojují Egejské moře a autobusy a trolejbusy OASA každé ráno přepravují Atény do práce. Obnova stárnoucích vozových parků, rozšíření linek do předměstí a propojení silnic, železnice a moře do jediné sítě s jednotnými jízdenkami by umožnily zboží dostat se na trh a pracovníkům do zaměstnání." # todo: NEW TRANSLATION
 GRE_vintage_wines: "Řecká vína" # todo: NEW TRANSLATION
 GRE_vintage_wines_desc: "Řekové lisovali hrozny ještě před založením Říma, přesto svět stále zná naše víno jen jako levnou retsinu v karafě taverny. To je křivda vůči sopečnému Assyrtiku ze Santorini, výraznému Xinomavru z Naussy a rubínovému Agiorgitiku z Nemeje. Investice do lahvování přímo na statcích, označení chráněného původu a vinařské turistiky by konečně mohly postavit řecká vína po bok velkých jmen Francie a Itálie." # todo: NEW TRANSLATION
 GRE_tobacco_plantations: "Orientální tabák" # todo: NEW TRANSLATION
 GRE_tobacco_plantations_desc: "Sluncem sušené listy Basma z Makedonie a Thrákie po generace provoněly nejlepší světové směsi a domy jako Papastratos v Pireu na nich vybudovaly své bohatství. Kouření na Západě možná ustupuje, ale poptávka na Balkáně a Blízkém východě přetrvává a tisíce malých pěstitelů v okolí Kavaly a Xanthi jsou stále závislé na sklizni. Musíme podpořit pěstitele a zároveň usnadnit těm, kteří mohou přejít k jiným plodinám." # todo: NEW TRANSLATION
 GRE_gas_oil_plants: "Rafinérie Attiky" # todo: NEW TRANSLATION
 GRE_gas_oil_plants_desc: "Rafinérie kolem Sarónského zálivu — Hellenic Petroleum v Aspropyrgosu a Elefsině a Motor Oil Hellas v Agioi Theodoroi — zpracovávají ropu, která udržuje v chodu Řecko i polovinu Balkánu. Starší provozy jsou však unavené a jejich marže se ztenčují. Nové krakovací kapacity, čistší odsiřování a rozšířené skladování by upevnily naše postavení rafinerského centra jihovýchodního Středomoří." # todo: NEW TRANSLATION
 GRE_trim_the_fat: "Ořezat přebytečné výdaje" # todo: NEW TRANSLATION
 GRE_trim_the_fat_desc: "Vláda se stala přebujelou a neefektivní. Ministerstva jsou přeplněná, zakázky získávají přátelé a příbuzní a byrokracie vše dusí. Musíme se zeštíhlit omezením plýtvání, automatizací tam, kde je to možné, a vyvozením odpovědnosti." # todo: NEW TRANSLATION
 GRE_debt_swaps: "Partneři pro výměnu dluhu" # todo: NEW TRANSLATION
 GRE_debt_swaps_desc: "Výměna našeho dluhu za dluhopisy denominované v cizí měně by mohla snížit naši expozici vůči nestabilitě. Vyžaduje dobré bankovní partnery a určité finanční inženýrství, ale jde o jeden ze způsobů, jak spravovat dluh s menšími politickými následky." # todo: NEW TRANSLATION
 GRE_debt_swap_initial_tt: "§G50 miliard§! státního dluhu bude převedeno na vybraného partnera s úrokovou sazbou §G3 %§!." # todo: NEW TRANSLATION
 GRE_debt_swap_accepted_opinion: "Přijatá výměna dluhu" # todo: NEW TRANSLATION
 GRE_debt_swap_rejected_opinion: "Odmítnutá výměna dluhu" # todo: NEW TRANSLATION
 GRE_olympic_airways: "Olympic Airways" # todo: NEW TRANSLATION
 GRE_olympic_airways_desc: "Letecká společnost Olympic Airways, kterou založil Aristotle Onassis, byla kdysi pýchou řeckého letectví. V posledních letech se potýká s problémy, její jméno však stále něco znamená. Oživení společnosti by mohlo přivést turisty a přimět je k návratu." # todo: NEW TRANSLATION
 GRE_trainose: "TrainOSE" # todo: NEW TRANSLATION
 GRE_trainose_desc: "Řecký železniční systém, kdysi zanedbávaný, ožil. TrainOSE provozuje osobní i nákladní dopravu spojující Atény se Soluní a Peloponés s pevninou. Rozšířením tratí, zlepšením jízdních řádů a investicemi do vozového parku můžeme učinit železnici skutečnou alternativou." # todo: NEW TRANSLATION
 GRE_cotton_plantations: "Bavlníkové plantáže" # todo: NEW TRANSLATION
 GRE_cotton_plantations_desc: "Řecká bavlna z Thesálie a Makedonie patří k nejlepším na světě. Pevná vlákna a vynikající kvalita z ní činí skvělý materiál pro textil. Podpora pěstitelů bavlny a investice do zpracování by mohly toto odvětví vrátit tam, kam patří." # todo: NEW TRANSLATION
 GRE_fisheries_expansion: "Bohatství Egejského moře" # todo: NEW TRANSLATION
 GRE_fisheries_expansion_desc: "Řecko produkuje více chovaných pražem a mořských vlků než kterýkoli jiný evropský stát; jeho klece jsou rozesety podél chráněných zálivů Jónského a Egejského moře. Volně žijící populace se však hroutí kvůli nadměrnému rybolovu, znečištění a trawlerům překračujícím námořní hranici. Rozšíření akvakultury, obnova pobřežní flotily a prosazování poctivých kvót by udržely při životě rybáře i ryby." # todo: NEW TRANSLATION
 GRE_aegean_wind_banks: "Využití meltemi" # todo: NEW TRANSLATION
 GRE_aegean_wind_banks_desc: "Každé léto se přes Kyklady žene meltemi, jeden z nejspolehlivějších větrů v celé Evropě. Turbíny rozmístěné na ostrovech a hřebenech pevniny by mohly dodávat do sítě čistou energii a prolomit naši závislost na dovážené ropě a uhlí. Největší přínos představuje propojovací vedení, které by konečně začlenilo ostrovní dieselové generátory do národní sítě." # todo: NEW TRANSLATION
 GRE_resolution_crisis: "Vyřešení krize" # todo: NEW TRANSLATION
 GRE_resolution_crisis_desc: "Příliš dlouho jsme krizi pouze řídili, místo abychom ji skutečně vyřešili. Je čas na řádný plán, který se najednou vypořádá s dluhem, růstem, bankovnictvím a reformami. Nebude to snadné, ale je to jediná cesta vpřed. Dokončení tohoto zaměření ukončí dluhovou krizi jednou provždy, proto nejprve musíme dostat dluh pod kontrolu: úrok pod 8 % a poměr dluhu k HDP pod 50 %." # todo: NEW TRANSLATION
 GRE_urban_railways: "Rozšíření athénského metra" # todo: NEW TRANSLATION
 GRE_urban_railways_desc: "Athénské metro proměnilo hlavní město před hrami v roce 2004, celé čtvrti však stále leží mimo jeho dosah, Soluň čeká na vlastní linku už desítky let a příměstská železnice Proastiakos sotva využívá svůj potenciál. Ražba nových tunelů, prodloužení tramvajové trati k pobřeží a propojení měst by zmírnily ochromující dopravu, vyčistily smog a zlepšily každodenní život milionů lidí." # todo: NEW TRANSLATION
 GRE_ionian_solar: "Jónská solární energie" # todo: NEW TRANSLATION
 GRE_ionian_solar_desc: "Jónské ostrovy mají mnoho slunečního svitu. Instalace solárních parků na Korfu, Lefkadě a Zakynthosu by nám umožnila tuto výhodu využít a snížit závislost na dovážených fosilních palivech." # todo: NEW TRANSLATION
 GRE_tourism_boom: "Žij svůj řecký mýtus" # todo: NEW TRANSLATION
 GRE_tourism_boom_desc: "Od pláží Kréty přes kalderu Santorini až po bílé uličky Mykonu přitahuje Řecko každoročně desítky milionů návštěvníků a cestovní ruch již vytváří téměř pětinu celkové produkce ekonomiky. Koordinované úsilí Národní turistické organizace v oblasti marketingu, kapacity letišť a propojení ostrovů by mohlo proměnit sezónní příliv ve skutečný pilíř národního bohatství." # todo: NEW TRANSLATION
 GRE_tourism_boom_event_TT: "§YRekordní sezóna vyvolá debatu o tom, kam by měly peníze směřovat.§!" # todo: NEW TRANSLATION
 GRE_mass_tourism: "Slunce, písek a zájezdy" # todo: NEW TRANSLATION
 GRE_mass_tourism_desc: "Naplňme charterové lety z Manchesteru a Düsseldorfu, lemujme pobřeží all-inclusive resorty a nechme davy proudit po milionech. Masová turistika zaplaví státní pokladnu a udrží letní mzdu na dosah každého ostrovana, ale vyčerpává podzemní vody Mykonu, pohřbívá útesy Santorini pod pasažéry výletních lodí a vyčerpává trpělivost lidí, kteří tam skutečně žijí." # todo: NEW TRANSLATION
 GRE_premium_tourism: "Jachty a butikové resorty" # todo: NEW TRANSLATION
 GRE_premium_tourism_desc: "Méně hostů, z nichž každý zaplatí mnohem více a zanechá menší stopu. Zaměření na pětihvězdičkové resorty, kulturní a archeologickou turistiku a přístavy pro superjachty v Jónském moři ochrání křehké ostrovy i řeckou značku. Počet příjezdů možná poroste pomaleji, ale peníze, které zůstanou doma, budou významnější." # todo: NEW TRANSLATION
 GRE_diaspora_remittances: "Získat přízeň diaspory" # todo: NEW TRANSLATION
 GRE_diaspora_remittances_desc: "Miliony Řeků v zahraničí, od Melbourne po Chicago, udržují spojení s vlastí. Směřování jejich úspor a převodů do ekonomiky promění city v kapitál." # todo: NEW TRANSLATION
 GRE_diaspora_remittances_event_TT: "§YŘecká diaspora reaguje na výzvu k investicím.§!" # todo: NEW TRANSLATION
 GRE_reverse_brain_drain: "Zvrátit odliv mozků" # todo: NEW TRANSLATION
 GRE_reverse_brain_drain_desc: "Krize vyslala celou generaci řeckých inženýrů, lékařů a výzkumníků do zahraničí. Daňové úlevy, financování výzkumu a skutečná pracovní místa je mohou spolu s jejich odborností přivést zpět domů." # todo: NEW TRANSLATION
 GRE_eu_cohesion_funds: "Kohezní fondy EU" # todo: NEW TRANSLATION
 GRE_eu_cohesion_funds_desc: "Jako jeden z chudších členů Unie je Řecko čistým příjemcem strukturálních a kohezních fondů. Čerpání každého dostupného eura financuje silnice, přístavy a regionální rozvoj." # todo: NEW TRANSLATION
 GRE_recovery_resilience_facility: "Nástroj pro obnovu a odolnost" # todo: NEW TRANSLATION
 GRE_recovery_resilience_facility_desc: "Pokrizový Nástroj pro obnovu a odolnost směřuje desítky miliard k zelené a digitální transformaci. Při dobrém využití jde o největší investiční program v moderních řeckých dějinách." # todo: NEW TRANSLATION
 GRE_recovery_facility_event_TT: "§YBrusel vyplatí první tranši a Atény musí rozhodnout, jak rychle ji utratí.§!" # todo: NEW TRANSLATION
 GRE_infrastructure_cofinancing: "Spolufinancování infrastruktury" # todo: NEW TRANSLATION
 GRE_infrastructure_cofinancing_desc: "Evropské peníze pokryjí většinu účtu a řecké peníze zbytek. Spolufinancované dálnice, linky metra a sítě se vybudují za zlomek národních nákladů." # todo: NEW TRANSLATION
