 GRE_homelessness_crisis_category: "Athénská krize bezdomovectví" # todo: NEW TRANSLATION
 GRE_homelessness_crisis_category_desc: "Po athénském zemětřesení v roce 1999 zůstaly tisíce řeckých občanů bez domova. Ve městě již probíhá pomoc a opravy, můžeme však tuto iniciativu podpořit a dokončit obnovu městských a obytných čtvrtí." # todo: NEW TRANSLATION
 GRE_reconstruction_efforts_in_athens_decision: "Financovat další obnovu Atén" # todo: NEW TRANSLATION
 GRE_reconstruction_efforts_in_athens_decision_desc: "Zemětřesení způsobilo napříč Aténami vážné škody. Panelové domy se zřítily, infrastruktura byla poškozena a celé čtvrti se proměnily v trosky. První opravy již začaly, ale pomocné fondy nestačí. Přesměrování dalších prostředků na obnovu by urychlilo rekonstrukci." # todo: NEW TRANSLATION
 GRE_issue_relief_funds_to_victims_decision: "Vyplatit pomoc obětem zemětřesení" # todo: NEW TRANSLATION
 GRE_issue_relief_funds_to_victims_decision_desc: "Kromě fyzického zničení zanechalo zemětřesení mnoho rodin bez ničeho. Úspory zmizely, podniky byly zničeny a lidé utrpěli zranění. Přímá finanční pomoc obětem by poskytla okamžitou podporu na potraviny, oblečení, dočasné bydlení a základní potřeby pro zahájení obnovy." # todo: NEW TRANSLATION
 GRE_petition_turkey_for_support_decision: "Požádat [TUR.GetName] o pomoc" # todo: NEW TRANSLATION
 GRE_petition_turkey_for_support_decision_desc: "Požádejte [TUR.GetNameWithFlag] o pomoc s obnovou po zemětřesení. Doufejme, že ve chvíli naší nouze najdou ve svých srdcích ochotu nám pomoci." # todo: NEW TRANSLATION
 GRE_cypriot_TT: "§KKypr§! vyhlásí válku §SSeverní Kypr§!" # todo: NEW TRANSLATION
 GRE_failures_capitalism_TT: "§RÚčinek zaměření se odvíjí od rozsahu dluhové krize.§!" # todo: NEW TRANSLATION
 GRE_communist_takeover_TT: "§GŘekové volby požadují!§!\n\nUjistěte se, že máte dostatek politické síly uložené na toto. Pokud §Rselžete§! zvolit a vytvořit vládu, budete muset uspořádat další mimořádné volby, abyste posílili §Y[Communist-State_L]§!" # todo: NEW TRANSLATION
 GRE_fascist_takeover_TT: "§GŘekové volby požadují!§!\n\nUjistěte se, že máte dostatek politické síly uložené na toto. Pokud §Rselžete§! zvolit a vytvořit vládu, budete muset uspořádat další mimořádné volby, abyste posílili §Y[Nat_Fascism_L]§!" # todo: NEW TRANSLATION
 GRE_civil_units_TT: "§RNavrhujeme přestěhovat naši armádu na státní hranice Středního Řecka, kde se můžeme pokusit udržet rebely.§!" # todo: NEW TRANSLATION
 GRE_worsen_debt_TT: "§RZhoršuje dluhovou krizi!§!" # todo: NEW TRANSLATION
 GRE_lowers_debt_TT: "§GUlehčuje dluhovou krizi§!" # todo: NEW TRANSLATION
 GRE_golden_visa_income_tt: "§GOdemyká příjmový tok programu zlatých víz§!" # todo: NEW TRANSLATION
 GRE_end_austerity_TT: "§GUkončuje protesty proti úsporným opatřením§!" # todo: NEW TRANSLATION
 GRE_debt_crisis_experienced_tt: "Čelili jsme §Rdluhové krizi§!" # todo: NEW TRANSLATION
 GRE_increase_drift_TT: "§GZvyšuje politický drift směrem k této straně§!" # todo: NEW TRANSLATION
 GRE_process_sco_member_tt: "§YZačátek procesu integrace do SCO.§!" # todo: NEW TRANSLATION
 GRE_joining_the_euro_interest_rate_tt: "Mění požadavky §Y$EU_join_the_euro_decision$§!:\n- požadavek na §Yúrokovou sazbu§! bude §Y6,5 %§! místo §Y3,5 %§!\n" # todo: NEW TRANSLATION
 GRE_defer_payments_decision_tt: "Umožňuje odložit platby za budoucí akce (např. rozhodnutí a zaměření) do našeho §Ystátního dluhu§! nebo k §Yzahraničnímu věřiteli§! místo placení v hotovosti." # todo: NEW TRANSLATION
 istanbul_renamed: "Istanbul Přejmenováno" # todo: NEW TRANSLATION
 GRE_9833_name: "Constantinopol" # todo: NEW TRANSLATION
 GRE_ICBC: "Půjčit si od ICBC" # todo: NEW TRANSLATION
 GRE_ICBC_desc: "Průmyslová a obchodní banka Číny je ochotna nám půjčit peníze pod rukou, aby zajistila naši spolupráci s Čínskou lidovou republikou." # todo: NEW TRANSLATION
 GRE_chi_real_estate: "Čínské nemovitostní investice" # todo: NEW TRANSLATION
 GRE_chi_real_estate_desc: "Číňané projevili zájem o nákup domů po celém Řecku. To je iniciativa, kterou bychom měli podporovat a využít." # todo: NEW TRANSLATION
 GRE_chi_investments: "Čínské investice" # todo: NEW TRANSLATION
 GRE_chi_investments_desc: "Čína má zájem o rozsáhlé projekty po celém Řecku. Tyto projekty mohou oživit oblasti ekonomiky, které sami nemáme prostředky zlepšit." # todo: NEW TRANSLATION
 GRE_golden_visa_deals: "Zlatá víza" # todo: NEW TRANSLATION
 GRE_golden_visa_deals_desc: "Program zlatých víz nabízí pětileté povolení k pobytu každému investorovi, který vloží kvalifikovanou částku do nemovitostí nebo podnikání [GRE.GetAdjective]. Bohatí kupci ze zemí mimo EU projevili značný zájem a poskytují domácímu trhu přímý přísun zahraničního kapitálu." # todo: NEW TRANSLATION
 GRE_piraeus: "Získat Pireus dražbou" # todo: NEW TRANSLATION
 GRE_piraeus_desc: "Diskutovalo se o získání portu Pireus dražbou mezi členy vlády a zdá se, že v době dluhové krize to uleví od tlaku na nás." # todo: NEW TRANSLATION
 GRE_piraeus_corruption: "Omezit Čínu" # todo: NEW TRANSLATION
 GRE_piraeus_corruption_desc: "Čínské plány rozšířit jejich vliv v Řecku jsou hrozbou pro naši nezávislost. Pod záminkou Centrální archeologické rady můžeme zvrátit jakékoli čínské plány rozšíření." # todo: NEW TRANSLATION
 GRE_chi_investments_piraeus: "Čínské investice kolem Pireusu" # todo: NEW TRANSLATION
 GRE_chi_investments_piraeus_desc: "Číňané projevili velký zájem investovat do oblastí kolem přístavu Pireus. Ačkoli někteří tvrdí, že tento projekt by mohl ohrozit naši zahraniční nezávislost, to rozhodně není pravda." # todo: NEW TRANSLATION
 GRE_chi_nationwide_investments: "Čínské investice napříč zemí" # todo: NEW TRANSLATION
 GRE_chi_nationwide_investments_desc: "Zisk z umožnění Číně volně investovat do naší země je obrovský; musíme Číňanům umožnit investovat, jak chtějí." # todo: NEW TRANSLATION
 GRE_invest_elliniko: "Investujte do Elliniko" # todo: NEW TRANSLATION
 GRE_invest_elliniko_desc: "Elliniko je předměstská část Athén, která by mohla být považována za opomenutou revitalizačními projekty, které jsme spustili jinde. Tato oblast je zvláště důležitá, protože je to turistické centrum." # todo: NEW TRANSLATION
 GRE_unemployed: "Nezaměstnaní" # todo: NEW TRANSLATION
 GRE_unemployed_desc: "Důkladným řízením nezaměstnanosti zajistíme, že ti, kteří přišli o práci v důsledku dluhové krize, nebudou bez peněz potřebných k zajištění základních životních standardů." # todo: NEW TRANSLATION
 GRE_targeted_pension_reforms: "Cílené důchodové reformy" # todo: NEW TRANSLATION
 GRE_targeted_pension_reforms_desc: "Důchodový systém pohlcuje nepřiměřený podíl HDP. Cílené reformy zpřísňující podmínky nároku, omezující zneužívání předčasných důchodů a převádějící doplňkové důchody na fondový model zmírní fiskální zátěž, aniž by zcela zničily sociální síť." # todo: NEW TRANSLATION
 GRE_glass_cannon_economics: "Skleněná kanónová ekonomika" # todo: NEW TRANSLATION
 GRE_glass_cannon_economics_desc: "Naše ekonomika a naši občané vidí výhody zdravé ekonomiky. Jak utrácejí své peníze, pomáhá to naší zemi růst. To platí, dokud se nic §Runfortunate§! nestane s ekonomikou." # todo: NEW TRANSLATION
 GRE_strength: "Řecká ekonomická síla" # todo: NEW TRANSLATION
 GRE_strength_desc: "Řecko je odolný národ, stejně jako naše ekonomika. Jsme národem s mnoha silami a různými odvětvími. Podporováním těchto odvětví a místních podniků můžeme zaručit zdravou ekonomiku na dlouhé roky." # todo: NEW TRANSLATION
 GRE_pharma: "Farmaceutické vývozy" # todo: NEW TRANSLATION
 GRE_pharma_desc: "Řecko je plodný název ve farmacickém obchodu. Je to naše druhé největší exportní odvětví hned za rafinaci ropy. Export těchto produktů tvořil 20 % zisku tohoto odvětví. Navíc, jelikož tyto produkty vyvážíme do zahraničí, ekonomické problémy doma nebudou ovlivňovat schopnost lidí je kupovat v zahraničí." # todo: NEW TRANSLATION
 GRE_construction_mat: "Stavební materiály" # todo: NEW TRANSLATION
 GRE_construction_mat_desc: "Náš národ vyprodukuje poměrně hodně stavebních materiálů, které bychom mohli použít k rozšíření vlastní průmyslové ekonomiky." # todo: NEW TRANSLATION
 GRE_merchant_marine: "Obchodní loďstvo" # todo: NEW TRANSLATION
 GRE_merchant_marine_desc: "Řecko provozuje největší obchodní loďstvo na světě pod vlajkami Svazu řeckých rejdařů, jedné z nejmocnějších průmyslových lobbistických skupin v Aténách. Rejdaři a jejich rodiny ovládají dvě pětiny tonáže flotily a prostřednictvím mezd, daní a přístavních poplatků udržují v národních účtech tok odpovídající 7–8 % HDP. Posílení jejich konkurenceschopnosti udrží tento motor v chodu." # todo: NEW TRANSLATION
 GRE_tonnage_tax_regime: "Zachovat tonážní daň" # todo: NEW TRANSLATION
 GRE_tonnage_tax_regime_desc: "Rodiny rejdařů dlouhodobě využívají výhodný režim tonážní daně, který udržuje lodě pod řeckou vlajkou ziskové a odrazuje od přechodu k zahraničním registrům. Zachování tohoto režimu udrží příjmy proudící řeckými přístavy a loděnicemi a udrží v provozu loděnice Skaramangas, Elefsina a Neorion." # todo: NEW TRANSLATION
 GRE_tax_the_shipowners: "Zdanit lodní magnáty" # todo: NEW TRANSLATION
 GRE_tax_the_shipowners_desc: "Lodní magnáti se dlouhodobě vyhýbají daňovému břemenu, které dopadá na běžné Řeky. Zrušení režimu tonážní daně a přímé zdanění rejdařů by přineslo státní pokladně velký jednorázový příjem, přičemž přechod pod cizí vlajku zůstává stálou hrozbou." # todo: NEW TRANSLATION
 GRE_shipbuilding_revival: "Obnovit řecké loděnice" # todo: NEW TRANSLATION
 GRE_shipbuilding_revival_desc: "Loděnice ve Skaramangasu, Elefsině a Neorionu kdysi stavěly obchodní loďstvo, které přineslo Řecku bohatství. Obnovení jejich kapacity cílenými dotacemi a zakázkami by vrátilo pracovní místa v loděnicích a zajistilo domácí dodávky moderních trupů." # todo: NEW TRANSLATION
 GRE_pdo_exports: "Prémiový vývoz s chráněným původem" # todo: NEW TRANSLATION
 GRE_pdo_exports_desc: "Kalamatské olivy, extra panenský olivový olej, sýr feta a víno Assyrtiko jsou světově proslulé. Investice do značek s chráněným označením původu a prémiového marketingu pozvednou tyto produkty nad komoditní konkurenci a zajistí vyšší ceny na mezinárodních trzích." # todo: NEW TRANSLATION
 GRE_recapitalize_banks: "Rekapitalizovat banky" # todo: NEW TRANSLATION
 GRE_recapitalize_banks_desc: "Čtyři systémové banky v Řecku během krize nashromáždily biliony v nesplácených úvěrech. Řecký fond finanční stability by mohl prostřednictvím nucené rekapitalizace vložit nový kapitál, obnovit jejich schopnost poskytovat úvěry a stabilizovat finanční systém za značných fiskálních nákladů." # todo: NEW TRANSLATION
 GRE_hercules_scheme: "Program ochrany aktiv Hercules" # todo: NEW TRANSLATION
 GRE_hercules_scheme_desc: "Program HAPS sekuritizuje nesplácené úvěry mimo rozvahy bank, uvolňuje jejich úvěrovou kapacitu a snižuje náklady na půjčky podnikům a domácnostem hledajícím úvěr." # todo: NEW TRANSLATION
 GRE_privatize_banks: "Vrátit banky do soukromých rukou" # todo: NEW TRANSLATION
 GRE_privatize_banks_desc: "Prodej státních podílů v rekapitalizovaných bankách soukromým investorům by vyvolal silnou poptávku korporací a přinesl významný zdroj daňových příjmů. Důvěra trhu by také signalizovala návrat Řecka k normálu." # todo: NEW TRANSLATION
 GRE_state_bank_control: "Ponechat banky ve státních rukou" # todo: NEW TRANSLATION
 GRE_state_bank_control_desc: "Zachování státního vlastnictví bank nám umožní směřovat jejich úvěry k domácí výstavbě, průmyslu a strategickým odvětvím bez tlaku soukromých akcionářů na zisk. Politické náklady veřejného vlastnictví vyváží kontrola nad přidělováním úvěrů." # todo: NEW TRANSLATION
 GRE_austerity: "Úsporná opatření" # todo: NEW TRANSLATION
 GRE_austerity_desc: "Vládní schodek je nevyhnutelný a pokud nezačneme brzy, ekonomika vstoupí do ještě horšího stavu, než je nyní. §RTo vyvolá protesty po celé zemi§!, ale pokud omezíme nepokoje, můžeme znovu získat kontrolu nad naši finanční situací." # todo: NEW TRANSLATION
 GRE_turn_century: "Přelom století" # todo: NEW TRANSLATION
 GRE_turn_century_desc: "Když naše cesta v tomto novém světě vstupuje do nového milénia, mnoho věcí je nejistých, politika a ekonomika jsou na pochybách. Je na nás, abychom vedli naši zemi v této nové éře." # todo: NEW TRANSLATION
 GRE_golden_dawn: "Zlaté úsvit" # todo: NEW TRANSLATION
 GRE_golden_dawn_desc: "extrémně pravicová strana Golden Dawn je politická strana založená na nacionalistických ideálech a má sympatie k nacionalistickým hnutím po celé Evropě. Mnozí kritizovali Golden Dawn jako neonacistickou a kriminální organizaci, ale tito lidé jsou lháři. Golden Dawn je jedinou cestou vpřed pro Řecko a musíme zajistit, aby získala vedení nad národem." # todo: NEW TRANSLATION
 GRE_subtle_propaganda_campaigns: "Jemné propagandistické kampaně" # todo: NEW TRANSLATION
 GRE_subtle_propaganda_campaigns_desc: "Lidé se musí dozvědět pravdu o tom, co Golden Dawn chce dosáhnout, a jak demokraté tuto zemi zničili, uvrhli ji do chaosu." # todo: NEW TRANSLATION
 GRE_open_youth_front: "Otevřít mládežnickou frontu" # todo: NEW TRANSLATION
 GRE_open_youth_front_desc: "Demokratické vlády bohužel nechaly mládež naší země bez budoucnosti. Musíme proto získat důvěru mládeže, abychom úspěšně převzali národní vedení." # todo: NEW TRANSLATION
 GRE_influence_police: "Vliv policie" # todo: NEW TRANSLATION
 GRE_influence_police_desc: "Pokud se nám podaří získat podporu policie, získáme více podpory veřejnosti a snadněji si poradíme s politickými zrádci." # todo: NEW TRANSLATION
 GRE_committee_national_memory: "Výbor národní paměti" # todo: NEW TRANSLATION
 GRE_committee_national_memory_desc: "Musíme ctít velké nacionalistické hrdiny, kteří bojovali a zemřeli za náš národ, připomínat lidem jejich principy, abychom se všichni mohli sjednotit pod jedním cílem." # todo: NEW TRANSLATION
 GRE_form_golden_dawn_death_legions: "Form Golden Dawn Death Legions" # todo: NEW TRANSLATION
 GRE_form_golden_dawn_death_legions_desc: "Smrtící legie Golden Dawn budou naší hlavní paravojenskou jednotkou. Budou mít za úkol čistit ulice od zrádců, udržovat pořádek a bránit zemi proti nepřátelům, kdykoli to bude potřeba." # todo: NEW TRANSLATION
 GRE_glorify_regime_of_colonels: "Oslavovat režim plukovníků" # todo: NEW TRANSLATION
 GRE_glorify_regime_of_colonels_desc: "Od roku 1967 do 1974 byl Řecko řízen řeckou juntou, známější jako „Režim plukovníků“. Pod plukovníky Řecko zažívalo rychlý ekonomický růst, vnitřní stabilitu a obrovskou armádu, která chránila zemi. Proto musíme lidem připomenout úspěchy plukovníků." # todo: NEW TRANSLATION
 GRE_golden_greece: "Požadovat okamžité volby" # todo: NEW TRANSLATION
 GRE_golden_greece_desc: "Přišel čas vést tuto zemi poté, co jsme získali podporu většiny obyvatel. Budeme žádat volby od zkorumpované vlády, abychom jim ukázali, kdo by měl být skutečným vůdcem." # todo: NEW TRANSLATION
 GRE_fund_elam: "Rozsáhlé financování ELAM" # todo: NEW TRANSLATION
 GRE_fund_elam_desc: "ELAM, neboli Národní lidová fronta, je sestrská strana Golden Dawn na Kypru. Poskytnutím jí více prostředků, než si kdy přála, můžeme alespoň zajistit, že budeme populární mezi řeckými Kyprany." # todo: NEW TRANSLATION
 GRE_revive_megali_idea: "Oživit Megali Idea" # todo: NEW TRANSLATION
 GRE_revive_megali_idea_desc: "Megali Idea byla koncepce většího řeckého národa složeného z bývalých řeckých území, jako je Severní Epirus a pobřežní oblasti Turecka. Naším posláním je Megali Idea oživit a učinit naše předky hrdými." # todo: NEW TRANSLATION
 GRE_censor_media: "Cenzurovat média" # todo: NEW TRANSLATION
 GRE_censor_media_desc: "Média, než jsme se dostali k moci, byly lháři a zrádci, šířili pro-demokratickou propagandu. Nyní, když jsme u moci, nahradíme demokratické lži našimi státem řízenými médii, která budou publikovat jen pravdu." # todo: NEW TRANSLATION
 GRE_one_religion: "Jedna víra" # todo: NEW TRANSLATION
 GRE_one_religion_desc: "Pravoslavné křesťanství je naše státní náboženství a důležitá součást našeho dědictví. Musíme za každou cenu klást větší důraz na naši víru." # todo: NEW TRANSLATION
 GRE_oppress_political_opposition: "Potlačte politickou opozici" # todo: NEW TRANSLATION
 GRE_oppress_political_opposition_desc: "Musíme vyhubit zrádce, kteří prodali naši zemi, stejně jako kohokoli, kdo je proti Řecku. Golden Dawn vyčistí Řecko od páté kolony." # todo: NEW TRANSLATION
 GRE_army_first: "Armáda na prvním místě" # todo: NEW TRANSLATION
 GRE_army_first_desc: "Zavedením politik, které upřednostňují naši armádu a její rozšíření, zajistíme, že i bez podpory průměrného Řeka si udržíme kontrolu. Samozřejmě, to nikdy nestane." # todo: NEW TRANSLATION
 GRE_economic_control: "Ekonomická kontrola" # todo: NEW TRANSLATION
 GRE_economic_control_desc: "Předchozí vlády zajistily zničení ekonomiky skokovým nárůstem dluhu Řecka. Abychom tomu zabránili, musíme zvýšit naši přímou kontrolu nad ekonomikou." # todo: NEW TRANSLATION
 GRE_anti_migrant_policies: "Politiky proti migraci" # todo: NEW TRANSLATION
 GRE_anti_migrant_policies_desc: "Přistěhovalci odvádějí zdroje, které by Řekové mohli lépe využít. Nesmíme dovolit, aby degradovali Matku Řecka." # todo: NEW TRANSLATION
 GRE_metaxism: "Metaxismus" # todo: NEW TRANSLATION
 GRE_metaxism_desc: "Převzali jsme velký vliv z režimu Metaxas, zejména politiky, které prosazoval, jako korporativismus, výhody pro pracující a nadřazenost řeckého lidu. Jedinou věcí, kterou musíme potlačit, je antiimperialistické cítění Metaxase." # todo: NEW TRANSLATION
 GRE_depart_ecomomic_migrants: "Vyhostit ekonomické migranty" # todo: NEW TRANSLATION
 GRE_depart_ecomomic_migrants_desc: "Nyní, když jsme začali prosazovat anti-migrantní zákony, musíme zahájit deportaci ekonomických migrantů zpět do jejich zemí." # todo: NEW TRANSLATION
 GRE_metaxas_policies: "Metaxistické politiky" # todo: NEW TRANSLATION
 GRE_metaxas_policies_desc: "Ioannis Metaxas, který k moci nastoupil díky puči 4. srpna 1936, je pro Golden Dawn obrovskou inspirací. Byl jedním z největších vůdců, jaké Řecko kdy mělo, přivedl řecký lid k slávě a odolal Osy ve druhé světové válce. Měli bychom znovu prozkoumat jeho politiky, abychom mu vzdali hold." # todo: NEW TRANSLATION
 GRE_dissolve_plutocracy: "Rozpuštění plutokracie" # todo: NEW TRANSLATION
 GRE_dissolve_plutocracy_desc: "Příliš dlouho byla naše ekonomika vykořisťována demokratickými režimy a cizinci. Teď je čas tento systém zničit jednou provždy." # todo: NEW TRANSLATION
 GRE_increase_agricultural_production: "Zvýšit zemědělskou produkci" # todo: NEW TRANSLATION
 GRE_increase_agricultural_production_desc: "Zemědělství bylo dlouho největším a nejúspěšnějším sektorem v Řecku. Musíme ho ještě posílit investicemi do zemědělského sektoru." # todo: NEW TRANSLATION
 GRE_exploit_and_export: "Využívat a vyvážet" # todo: NEW TRANSLATION
 GRE_exploit_and_export_desc: "Naše země je plná nevyužitých přírodních zdrojů a musíme rychle začít je těžit pro naši zemi." # todo: NEW TRANSLATION
 GRE_tax_relief_for_businessman: "Daňová úleva pro podnikatele" # todo: NEW TRANSLATION
 GRE_tax_relief_for_businessman_desc: "Musíme finančně pomoci podnikům, které byly ponechány, aby si poradily samy v důsledku politik našich předchozích vlád, a proto snížíme jejich daně." # todo: NEW TRANSLATION
 GRE_revise_national_debt: "Přezkoumat národní dluh" # todo: NEW TRANSLATION
 GRE_revise_national_debt_desc: "Demokraté dokázali zvýšit řecký dluh na 300 miliard dolarů. To způsobuje problémy pro ekonomiku. Proto je nutné vyjednat podmínky, abychom se tohoto obrovského dluhu zbavili." # todo: NEW TRANSLATION
 GRE_nationalize_resources: "Nacionalizovat zdroje" # todo: NEW TRANSLATION
 GRE_nationalize_resources_desc: "V současnosti drží mnohé zahraniční firmy v naší zemi přírodní zdroje. To je nepřijatelné. Zmocníme se všech zahraničních aktiv na území Řecka." # todo: NEW TRANSLATION
 GRE_trade_agreements: "Obchodní dohody" # todo: NEW TRANSLATION
 GRE_trade_agreements_desc: "Řecká obchodní síla je velmi nízká, jelikož nejsme dost konkurenceschopní ve světě. Prosadíme obchodní dohody, abychom mohli vyvážet naše produkty do více zemí." # todo: NEW TRANSLATION
 GRE_nationalize_banks: "Nacionalizovat banky" # todo: NEW TRANSLATION
 GRE_nationalize_banks_desc: "Jako součást našeho plánu ekonomické kontroly musí být banky státem nacionalizovány, protože drží cenné aktivum, které můžeme využít." # todo: NEW TRANSLATION
 GRE_force_germany_to_pay_debt_taken_from_occupation: "Vynutit splacení dluhů za německou okupaci" # todo: NEW TRANSLATION
 GRE_force_germany_to_pay_debt_taken_from_occupation_desc: "Německá okupace Řecka během druhé světové války byla velmi krutá, neboť Němci zničili velkou část Řecka a dluží nám 300 miliard dolarů v reparacích, které nikdy nebyly vyplaceny, a dnes jim to připomeneme." # todo: NEW TRANSLATION
 GRE_russia: "Obchod s Ruskem" # todo: NEW TRANSLATION
 GRE_russia_desc: "Rusko je historickým spojencem, protože jsme obě ortodoxní křesťanské země a v historii nám mnohokrát pomohli, proto musíme posílit obchodní vazby s Ruskem." # todo: NEW TRANSLATION
 GRE_china: "Obchod s Čínou" # todo: NEW TRANSLATION
 GRE_china_desc: "Ačkoli se ideologie liší, Čína podporuje nacionalistické režimy jako my, je světovou obchodní velmocí a musíme posílit ekonomické vazby s ní." # todo: NEW TRANSLATION
 GRE_iran: "Obchod s Íránem" # todo: NEW TRANSLATION
 GRE_iran_desc: "Ač Írán s naší zemí nemusí mít mnoho společného, sdílíme mnoho podobných cílů a měli bychom rozvíjet spolupráci mezi námi." # todo: NEW TRANSLATION
 GRE_of_continents_seas: "Řecko dvou kontinentů a pěti moří" # todo: NEW TRANSLATION
 GRE_of_continents_seas_desc: "Naše námořnictvo bývalo nejsilnější, nyní už tomu tak není. Budeme jej nicméně znovu vybudovat do jeho slavných časů." # todo: NEW TRANSLATION
 GRE_resolve_naming_dispute: "Vyřešit spory ohledně názvu" # todo: NEW TRANSLATION
 GRE_resolve_naming_dispute_desc: "Spory kolem názvu Makedonie jsou tak triviální, že je prostě vyřešíme anexí Severní Makedonie." # todo: NEW TRANSLATION
 GRE_strike_albania: "Útočit na Albánii" # todo: NEW TRANSLATION
 GRE_strike_albania_desc: "Albánie je známá tím, že zneužívá řeckou menšinu ve svých hranicích. Anexe je nejjednodušším řešením." # todo: NEW TRANSLATION
 GRE_strike_bulgaria: "Útočit na Bulharsko" # todo: NEW TRANSLATION
 GRE_strike_bulgaria_desc: "Role Řecka při formování Bulharska jako „civilizované“ země je nepopiratelná: Byzantské misie vyvinuly první literární jazyk slovanského lidu, který se vyvinul v bulharský jazyk. Tato 'válka' je spíše sjednocením dávno ztracených bratrů." # todo: NEW TRANSLATION
 GRE_greater_greece: "Větší Řecko" # todo: NEW TRANSLATION
 GRE_greater_greece_desc: "Řecko bylo středem mnoha z nejmocnějších národů v historii; takové dědictví by bylo pošlapáno, kdybychom v tom nepokračovali." # todo: NEW TRANSLATION
 GRE_great_greece: "Velké Řecko" # todo: NEW TRANSLATION
 GRE_great_greece_desc: "Nepůjdeme po cestě válečnického nadšení, která by vedla ke zániku i největších říší v historii." # todo: NEW TRANSLATION
 GRE_constantinople_not_istanbul: "Constantinopol, nikoli Istanbul" # todo: NEW TRANSLATION
 GRE_constantinople_not_istanbul_desc: "Istanbul byl Konstantinopol\nNyní je Istanbul, ne Konstantinopol\nUž je to dlouho pryč, Konstantinopol\nNyní je to turecké lokum za svitu měsíce" # todo: NEW TRANSLATION
 GRE_agriculture_focus: "Zaměření na zemědělství" # todo: NEW TRANSLATION
 GRE_agriculture_focus_desc: "Zemědělství je jedním z nejsilnějších prvků řecké ekonomiky, protože dodáváme velkou část produktů, jako je olivový olej. Musíme investovat více peněz do zemědělství, abychom mohli plně vyvážet naše produkty do zbytku světa." # todo: NEW TRANSLATION
 GRE_greater_state_control: "Větší státní ekonomická kontrola" # todo: NEW TRANSLATION
 GRE_greater_state_control_desc: "Stát musí zasahovat a získat větší ekonomickou kontrolu nad státem a lidmi." # todo: NEW TRANSLATION
 GRE_kke: "KKE" # todo: NEW TRANSLATION
 GRE_kke_desc: "KKE (Komunistická strana Řecka) je krajně levicová strana, která vychází z myšlenek marxismu-leninismu a je silně proti zahraničnímu imperialismu. Chce odstranit nerovnost a zajistit práva pracujících a je odhodlána vytvořit skutečnou socialistickou společnost. Musíme všichni stát za KKE, abychom vedli naši zemi kupředu!" # todo: NEW TRANSLATION
 GRE_communist_education: "Komunistické vzdělávání" # todo: NEW TRANSLATION
 GRE_communist_education_desc: "Mladé mysli jsou nejvíce vnímavé. Vštěpováním základních hodnot komunismu v mladší generaci a vyučováním studentů na univerzitní úrovni o slávě rovnosti by naše věc mohla výrazně pokročit." # todo: NEW TRANSLATION
 GRE_labour_focus_unions: "Kontaktujte odbory" # todo: NEW TRANSLATION
 GRE_labour_focus_unions_desc: "Odbory budou velmi rády, že mají vládu ochotnou nejen spolupracovat, ale vyhovět jejich požadavkům. Zajistíme, aby jejich vliv nepřesáhl rámec našeho nastupující moci a vyhneme se §Rkonfliktům zájmů§!" # todo: NEW TRANSLATION
 GRE_failures_capitalism: "Selhání kapitalismu" # todo: NEW TRANSLATION
 GRE_failures_capitalism_desc: "Kapitalismus nám již neslibuje nekonečné bohatství, které slíbil. Je načase jít vlastní cestou, aby se taková krize už nikdy neopakovala! §RDopad tohoto zaměření se odvíjí od rozsahu dluhové krize.§!" # todo: NEW TRANSLATION
 GRE_working_class: "Dělnická třída" # todo: NEW TRANSLATION
 GRE_working_class_desc: "Dělnická třída – místo, kde se sny rodí i umírají. Můžeme jim slíbit, že budou dobře zacházeni a získají zasloužené uznání jako základ nového komunistického státu." # todo: NEW TRANSLATION
 GRE_communist_propaganda: "Propagační aparát" # todo: NEW TRANSLATION
 GRE_communist_propaganda_desc: "Kvůli našemu rozšiřujícímu se vlivu si můžeme dovolit vypustit propagandistický aparát na Řecko. Ačkoli provoz je drahý, tato propaganda by neměla být opomíjena, bude extrémně účinná při získávání řeckého obyvatelstva." # todo: NEW TRANSLATION
 GRE_prepare_government: "Připravit vládu" # todo: NEW TRANSLATION
 GRE_prepare_government_desc: "Zřízením vlády v rámci naší politické strany zajistíme efektivní přechod, který nám umožní jednat podle našich cílů rychleji, než se naši rivalové sesbírají. Bude to nákladné, ale vzhledem k našim šancím na vítězství je to dobře položená sázka." # todo: NEW TRANSLATION
 GRE_damn_market: "Proklít volný trh" # todo: NEW TRANSLATION
 GRE_damn_market_desc: "Jsme v pozici, kdy můžeme zasadit poslední úder kapitalistům. S mocí propagandy na naší straně můžeme zasadit smrtící úder ekonomice volného trhu a při tom se zmocnit trůnu nad nadbytky, na němž kapitalisté sedí!" # todo: NEW TRANSLATION
 GRE_election_com: "Požadovat okamžité volby" # todo: NEW TRANSLATION
 GRE_election_com_desc: "Soudruzi, čas je nyní! Veškeré naše budování pro nový svobodný stát vedlo k tomuto okamžiku! \n\n§RZajistíme, že lidová vláda bude vládnout dalších 1000 let!§!" # todo: NEW TRANSLATION
 GRE_com_democratic: "Demokratický komunismus" # todo: NEW TRANSLATION
 GRE_com_democratic_desc: "Nejpravdivější formou komunismu je ten, který dává průměrnému dělníkovi volit svého vůdce do vlády; opomenutí tohoto práva je zradou komunismu." # todo: NEW TRANSLATION
 GRE_com_authoritarian: "Autoritářský komunismus" # todo: NEW TRANSLATION
 GRE_com_authoritarian_desc: "Lidé jsou příliš snadno oklamáni lžemi a libovolnými sliby, že by je ani kdyby byly dodrženy neovlivnily. Je to jednoduše příliš velké riziko nechat manipulovatelnou veřejnost rozhodovat budoucnost Řecka; je to příliš nebezpečné." # todo: NEW TRANSLATION
 GRE_handle_bankers: "Zvládnout bankéře" # todo: NEW TRANSLATION
 GRE_handle_bankers_desc: "Kapitalisté nemají místo ve státě, který je komunistický. Musíme okamžitě přerozdělit jejich nelegitimně získané bohatství." # todo: NEW TRANSLATION
 GRE_com_constitutionalism: "Komunistický ústavní systém" # todo: NEW TRANSLATION
 GRE_com_constitutionalism_desc: "Vytvoříme nový ústav, abychom zajistili, že nikdo nebude narušovat právo lidu volit, a mimo jiné. To bude znamenat, že hlava státu bude mít méně pravomoc." # todo: NEW TRANSLATION
 GRE_government_purge: "Vládní čistka" # todo: NEW TRANSLATION
 GRE_government_purge_desc: "Zcela převezmeme vládu a ustanovíme se jako jediná strana povolená vládnout Řecku. Fašisté číhají všude a pracují na kolapsu utopie, kterou se snažíme vytvořit!" # todo: NEW TRANSLATION
 GRE_curtail_corruption: "Omezit korupci" # todo: NEW TRANSLATION
 GRE_curtail_corruption_desc: "Náš vzestup k moci vytvořil mocenské vakuum, které lidé jsou příliš dychtiví zaplnit. Musíme zajistit, aby naše vláda zůstala čistá a oddaná lidem." # todo: NEW TRANSLATION
 GRE_promote_local: "Podporovat místní podnikání" # todo: NEW TRANSLATION
 GRE_promote_local_desc: "Moderní komunistické státy bohužel musí začlenit kapitalistické koncepty do státu, aby přežily. Místní podnikání je páteří ekonomiky, a k naplnění našich snů musíme posílit tuto páteř." # todo: NEW TRANSLATION
 GRE_investment_effort: "Investice do infrastruktury" # todo: NEW TRANSLATION
 GRE_investment_effort_desc: "Musíme investovat do infrastruktury po celé zemi, abychom zajistili kapacitu pro udržení zvýšené produkce zdrojů." # todo: NEW TRANSLATION
 GRE_com_resources: "Využívání přírodních zdrojů" # todo: NEW TRANSLATION
 GRE_com_resources_desc: "Se zavedenou potřebnou infrastrukturou se můžeme soustředit na rozšíření těžby našich přírodních zdrojů." # todo: NEW TRANSLATION
 GRE_subsidize_farmers: "Dotovat farmáře" # todo: NEW TRANSLATION
 GRE_subsidize_farmers_desc: "Evropské farmy klesají z mnoha faktorů; jedním z největších je obtížná konkurence se Spojenými státy. Musíme našim farmářům pomoci zastavit jejich neustálý úpadek." # todo: NEW TRANSLATION
 GRE_abandon_army: "Opustit armádu" # todo: NEW TRANSLATION
 GRE_abandon_army_desc: "Armáda je v současnosti břemenem pro stát. Šance, že by taková síla byla použita, jsou nízké, a proto je logické začít s restrukturalizací a zmenšováním armády podle potřeby." # todo: NEW TRANSLATION
 GRE_reorganize_army: "Přeorganizovat armádu" # todo: NEW TRANSLATION
 GRE_reorganize_army_desc: "Současná armáda si nadále zachovává ostudnou loajalitu ke staré ústavě." # todo: NEW TRANSLATION
 GRE_silence_press: "Umlčet tisk" # todo: NEW TRANSLATION
 GRE_silence_press_desc: "Jsme osvoboditelé, ne tyrani. Pokud jsou média příliš omámena, aby si to uvědomila, musíme vzít věci do vlastních rukou." # todo: NEW TRANSLATION
 GRE_extend_education: "Rozšířit vzdělání" # todo: NEW TRANSLATION
 GRE_extend_education_desc: "Naši lidé si zaslouží jen to nejlepší ve vzdělání, abychom zajistili rezervu vysoce vzdělaných lidí pro nástup na pokročilejší pracovní místa." # todo: NEW TRANSLATION
 GRE_farmer_tax: "Daňové úlevy pro farmáře" # todo: NEW TRANSLATION
 GRE_farmer_tax_desc: "Měli bychom farmářům udělit daňové úlevy, nejen abychom povzbudili více lidí k této profesi, ale také abychom zajistili, že budou mít vyšší zisk, umožňující jim rozšířit jejich růst efektivnějšími výrobními metodami a dokonce i půdu." # todo: NEW TRANSLATION
 GRE_new_army: "Nová armáda" # todo: NEW TRANSLATION
 GRE_new_army_desc: "Zreformovali jsme naši armádu do bodu, kdy byla nahrazena policií vnitřní bezpečnosti. Nicméně, jak můžeme ovlivňovat bez skutečné ozbrojené síly, která by podpořila naše slova? I když ji nebudeme používat, měli bychom začít budovat novou armádu pro novou Řecko." # todo: NEW TRANSLATION
 GRE_red_army: "Rudá armáda" # todo: NEW TRANSLATION
 GRE_red_army_desc: "Zajistíme, aby komunistický duch byl hluboko ve službách nové Rudé armády. Tento ideologický fanatismus bude pro nás výhodou, protože vytvoří armádu oddanou státu, která bude bojovat do konce, aby zachovala socialismus v Řecku." # todo: NEW TRANSLATION
 GRE_pacify_unions: "Uklidnit odbory" # todo: NEW TRANSLATION
 GRE_pacify_unions_desc: "Posílili jsme odbory do takové míry, že zasahují do státních záležitostí na mnoha úrovních kvůli stále triviálnějším věcem. Zatímco naše strana je oddána lidem, lidé potřebují ekonomiku, která funguje a umožňuje hledání práce, a proto požádáme odbory, aby ustoupily dřív, než je budeme muset vyloučit z legálního zasahování." # todo: NEW TRANSLATION
 GRE_purge_unions: "Čistka odborů" # todo: NEW TRANSLATION
 GRE_purge_unions_desc: "Odbory ukázaly neschopnost ukáznit se nebo zůstat loajální; naše zdvořilost má své meze." # todo: NEW TRANSLATION
 GRE_militarist_education: "Militaristické vzdělávání" # todo: NEW TRANSLATION
 GRE_militarist_education_desc: "Zavedením vojenského vzdělávání do našeho kurikula zajistíme, že široká veřejnost bude připravena na odvod v mimořádných situacích." # todo: NEW TRANSLATION
 GRE_balkan_diplomacy: "Balkánská diplomacie" # todo: NEW TRANSLATION
 GRE_balkan_diplomacy_desc: "Je čas realizovat naše skutečné ambice. Řecko prosperovalo pod komunismem a ačkoliv nejsme považováni za slovanské, stále dodržujeme pravoslaví a nacházíme se na Balkáně. Snad naše kulturní neutralita zajistí stabilitu takového státu: \n\nŘecko-slovanský stát." # todo: NEW TRANSLATION
 GRE_balkan_hegemony: "Balkánská nadvláda" # todo: NEW TRANSLATION
 GRE_balkan_hegemony_desc: "Poslední dva pokusy o takový stát selhaly. Spojování bylo vždy snahou dosáhnout diplomaticky, nikoli silou. Pokud jste nikdy neměli dost síly dobyvat ostatní balkánské státy, proč se snažit je držet pohromadě? Nezpochybnitelně můžeme udržet takový stát skrze vnitřní diplomacii; jde jen o to nejdřív vyřešit nevyhnutelný konflikt." # todo: NEW TRANSLATION
 GRE_constitution: "The Constitution..." # todo: NEW TRANSLATION
 GRE_constitution_desc: "Ústava je poslední věcí, kterou musíme řešit, než se definitivně upevníme při moci a znovu vybudujeme Řecko tak, jak si ho představujeme." # todo: NEW TRANSLATION
 GRE_european_communists: "Evropští komunisté" # todo: NEW TRANSLATION
 GRE_european_communists_desc: "Komunismus zanechal na Balkáně stopu, od konce Sovětského svazu a pádu komunistického bloku. Snad s dostatkem moci a intrik můžeme znovu zapálit pochodeň, kterou po sobě zanechali naši spolubojovníci. Stačí jen iskra, abychom zapálili oheň." # todo: NEW TRANSLATION
 GRE_bulgaria: "Přineste revoluci do Bulharska" # todo: NEW TRANSLATION
 GRE_bulgaria_desc: "Bulharsko, kdysi prosperující komunistický národ, ztratilo cestu po zhroucení SSSR. Předání jim dalšího národa, na nějž by se mohli dívat a následovat ho, by mělo umožnit, aby komunismus znovu nabral na síle." # todo: NEW TRANSLATION
 GRE_albania: "Přineste revoluci do Albánie" # todo: NEW TRANSLATION
 GRE_albania_desc: "Albánie je národ, který čelil mnoha obtížím. Poskytnutí ochrany a pomoci při hospodářském rozvoji stačí k získání srdcí a mysli Albánců, při částečném respektování jejich suverenity." # todo: NEW TRANSLATION
 GRE_macedonia: "Přineste revoluci do Makedonie" # todo: NEW TRANSLATION
 GRE_macedonia_desc: "Makedonie byla kdysi součástí Jugoslávie a sdílela stejné komunismu jako Srbsko; avšak po rozpadu Jugoslávie a kulturních 'mylných představ', opustili cestu komunismu. Vyjasnění těchto mylných představ umožní obyvatelstvu znovu podpořit socialistickou vládu." # todo: NEW TRANSLATION
 GRE_serbia: "Přineste revoluci do Srbska" # todo: NEW TRANSLATION
 GRE_serbia_desc: "Srbsko bylo kdysi centrem Jugoslávie za komunistické vlády. Zatímco Srbové přijali nacionalistickou ideologii, někteří stále chovají komunistické sympatie a země je dokonalým cílem pro rozšíření revoluce." # todo: NEW TRANSLATION
 GRE_romania: "Přineste revoluci do Rumunska" # todo: NEW TRANSLATION
 GRE_romania_desc: "Rumunsko je bohaté na zdroje a vojenskou sílu. Šíření revoluce k nim by bezpochyby ukázalo světu, že komunismus se znovu etabloval na Balkáně." # todo: NEW TRANSLATION
 GRE_dictatorship: "Diktatura začíná" # todo: NEW TRANSLATION
 GRE_dictatorship_desc: "S poražením našich nepřátel se můžeme konečně řídit zemi tak, jak by měla být." # todo: NEW TRANSLATION
 GRE_cypriot_question: "Kyprská otázka" # todo: NEW TRANSLATION
 GRE_cypriot_question_desc: "Napětí dosáhlo bodu varu, musíme jednat nyní. §RTo nás přivede do války s Tureckem a jejich spojenci§!; avšak pokud získáme kontrolu nad Kyprem do 30 dnů a budeme držet většinu našeho domovského území, možná budeme moci podepsat mírovou dohodu." # todo: NEW TRANSLATION
 GRE_turkish_trade: "Turecký obchod" # todo: NEW TRANSLATION
 GRE_turkish_trade_desc: "Jedním z nejlepších způsobů, jak podpořit dobré vztahy mezi dvěma národy, je hospodářská spolupráce. Podporou obchodu s Tureckem budou obě země těžit bez nákladů." # todo: NEW TRANSLATION
 GRE_settle_eez_dispute: "Urovnat spor o EEZ" # todo: NEW TRANSLATION
 GRE_settle_eez_dispute_desc: "Spor o EEZ je zbytečný. Dokud budeme podporovat volný obchod mezi našimi EEZ a budeme si navzájem rovnoměrně přiřazovat zdroje, konečně bychom mohli tento zbytečný konflikt urovnat." # todo: NEW TRANSLATION
 GRE_increased_privatization: "Zvýšená privatizace" # todo: NEW TRANSLATION
 GRE_increased_privatization_desc: "Zvyšování privatizace řeckého průmyslového sektoru by mohlo být prospěšné pro posílení našeho průmyslu, stejně jako pro vytvoření více pracovních příležitostí a posílení celé řecké ekonomiky." # todo: NEW TRANSLATION
 GRE_leadership: "Věčné vedení" # todo: NEW TRANSLATION
 GRE_leadership_desc: "Náš vůdce Nikolaos Michaloliakos dokázal spojit lid Řecka a vytvořit dokonalou řeckou společnost. Nikolaos Michaloliakos a strana Zlatý úsvit musí vládnout Řecku doživotně." # todo: NEW TRANSLATION
 GRE_nationalist_takeover_TT: "Národ dotahuje nové volby!\\n\\nUjistěte se, že máte dostatek politické síly na toto. Pokud §Rselžete§! zvolit a utvořit vládu, budete §Rpotřebovat uspořádat další mimořádné volby§! k posílení §Y[Nat_Fascism_L]§!" # todo: NEW TRANSLATION
 GRE_new_greece_old_ways: "Nové Řecko, staré způsoby" # todo: NEW TRANSLATION
 GRE_new_greece_old_ways_desc: "Po desetiletí jsme byli ovládáni vládami, které naši zemi uváděly do chaosu. Nyní řecký lid požaduje změnu, aby se mohli vrátit do dnů, kdy jsme byli po světě proslulí.\n§RProtože trávíte čas upevňováním moci nové vlády, budeme déle trpět ekonomickou krizí, ale budeme jí moci rychle čelit, až budeme mít ekonomiku pod kontrolou.§!" # todo: NEW TRANSLATION
 GRE_draft_youth_wing: "Nábor mládežnického křídla" # todo: NEW TRANSLATION
 GRE_draft_youth_wing_desc: "Jak jsme získali více podpory od mládeže, měli bychom je organizovat do para‑militárních jednotek, aby mohli bránit zemi proti nepřátelům revoluce." # todo: NEW TRANSLATION
 GRE_foreign_relations: "Zahraniční vztahy" # todo: NEW TRANSLATION
 GRE_foreign_relations_desc: "Vytváření vztahů se zahraničními zeměmi je jedním z klíčů k úspěšné politice. Budeme muset vybrat jednu z stran v různých otázkách." # todo: NEW TRANSLATION
 GRE_dev_cyp: "Rozvíjet Kypr" # todo: NEW TRANSLATION
 GRE_dev_cyp_desc: "Kypr trpí desetiletími rozdělení a nedostatečných investic. Nyní, když je ostrov pod řeckou svrchovaností, můžeme zahájit rozvoj jeho infrastruktury, ekonomiky a institucí na úroveň pevniny." # todo: NEW TRANSLATION
 GRE_the_hellenic_republic: "Řecká republika" # todo: NEW TRANSLATION
 GRE_the_hellenic_republic_desc: "Navzdory potížím, kterým čelíme, nesmíme opustit ideály demokracie a neobracet se k tyranii, abychom vyřešili naše problémy, protože by to bylo zradou pro každého muže i ženy v Řecku." # todo: NEW TRANSLATION
 GRE_discredit_eu: "Zpochybnit Evropskou unii" # todo: NEW TRANSLATION
 GRE_discredit_eu_desc: "Abychom chránili naše ideály, musíme lidem ukázat skutečné hodnoty demokracie a radikalismus prohlásit za hrozbu pro svobodu." # todo: NEW TRANSLATION
 GRE_support_eu: "Stát po boku Evropské unie" # todo: NEW TRANSLATION
 GRE_support_eu_desc: "Evropská unie podporuje spolupráci mezi národy, demokratické hodnoty, odsuzuje radikalismus a chce klidnou Evropu. Řecko by mělo posílit pouta s Evropskou unií." # todo: NEW TRANSLATION
 GRE_dominant_party_desc: "Jako v každé demokratické zemi hrají politické strany velkou roli v politice naší země a budeme muset rozumně vybrat, která strana povede naši zemi kupředu." # todo: NEW TRANSLATION
 GRE_dominant_party: "Dominantní strana" # todo: NEW TRANSLATION
 GRE_new_democracy: "Nová demokracie" # todo: NEW TRANSLATION
 GRE_new_democracy_desc: "Středopravicová strana 'Nová demokracie', která prokázala schopnost ve všech svých vládách a svých ideálů udržení našich tradic, je nejvhodnější stranou pro vedení Řecka." # todo: NEW TRANSLATION
 GRE_socialist_coalition: "SYRIZA" # todo: NEW TRANSLATION
 GRE_socialist_coalition_desc: "Hlavní řecké strany selhaly zemi a uvrhly ji do hospodářské katastrofy, stejně jako rozdělení naší společnosti. Řecko potřebuje novou stranu, která povede svůj lid kupředu, a my se shromáždíme kolem levicové strany SYRIZA, která stojí při lidech a je proti politikám našich předchozích vlád." # todo: NEW TRANSLATION
 GRE_economic_liberalism: "Ekonomický liberalismus" # todo: NEW TRANSLATION
 GRE_economic_liberalism_desc: "Ekonomický liberalismus musí být naším prioritou, pokud chceme posílit řeckou ekonomiku. Přináší nám vyšší obchod a větší hospodářský prospěch pro naše občany, například pracovní příležitosti." # todo: NEW TRANSLATION
 GRE_anti_migration_policies: "Politiky proti migraci" # todo: NEW TRANSLATION
 GRE_anti_migration_policies_desc: "V posledních letech Řecko přitahuje velké množství migrantů. Zatímco naše vláda toleruje migranty, kteří do Řecka přicházejí za ekonomickými příležitostmi, obáváme se hlavně nelegálních migrantů, jejichž počet se pomalu zvyšuje, a bude nutné zavést přísnější omezení." # todo: NEW TRANSLATION
 GRE_counter_radicals: "Proti radikálům" # todo: NEW TRANSLATION
 GRE_counter_radicals_desc: "Radikální strany v Řecku pomalu získávají popularitu, a jejich hlavní agendou je zničení ideologie, kterou naše země vytvořila: demokracie. Tyto strany jsou mnoha považovány za kriminální organizace kvůli konkrétním organizovaným útokům na určité skupiny. Pokud chceme udržet demokracii, budeme muset zvrátit vliv radikálních stran." # todo: NEW TRANSLATION
 GRE_increase_corruption_measures: "Protikorupční opatření" # todo: NEW TRANSLATION
 GRE_increase_corruption_measures_desc: "Řecko dlouhodobě trpí korupcí, která zasahuje do všech sektorů vlády, a způsobuje problémy státu. Pokud chceme vytvořit lepší správu, musíme zkorumpování ve vládě vykořenit." # todo: NEW TRANSLATION
 GRE_increase_industrial_privatization: "Zvýšit privatizaci průmyslu" # todo: NEW TRANSLATION
 GRE_increase_industrial_privatization_desc: "Řecký veřejný sektor je jedním z největších sektorů v Řecku. Již delší dobu to vytváří problém, neboť řecký soukromý sektor je relativně slabý. Je zde jen málo konkurence ve srovnání s jinými zeměmi. Pokud chceme růst naší ekonomiky, budeme muset ustoupit od veřejného sektoru a přijmout soukromý." # todo: NEW TRANSLATION
 GRE_decrease_taxes: "Snížit daně" # todo: NEW TRANSLATION
 GRE_decrease_taxes_desc: "Řecký lid nesmí být zatěžován vysokým zdaněním. Pokud navíc daně snížíme, mohlo by se omezit i daňové vyhýbání, které je v naší zemi velkým problémem." # todo: NEW TRANSLATION
 GRE_reinforce_justice: "Posílit justiční systém" # todo: NEW TRANSLATION
 GRE_reinforce_justice_desc: "V mnoha regionech naší země je zločinnost rozsáhlá kvůli nedostatečnému vynucování práva. Naše vláda bude muset posílit justiční systém, aby se snížila kriminalita v Řecku." # todo: NEW TRANSLATION
 GRE_begin_changing_education_system: "Reformy vzdělávacího systému" # todo: NEW TRANSLATION
 GRE_begin_changing_education_system_desc: "Řecký vzdělávací systém je v porovnání s ostatními evropskými zeměmi zdaleka pozadu, pokud jde o školy, financování a příležitosti pro lidi s nižšími dovednostmi. Pokud chceme moderní vzdělávací systém, budeme muset provést rozsáhlé reformy a vytvořit lepší prostředí pro naše děti." # todo: NEW TRANSLATION
 GRE_worker_rights: "Práva pracovníků" # todo: NEW TRANSLATION
 GRE_worker_rights_desc: "V rámci našich politik zvýšíme práva pracovníků, abychom snížili nerovnost mezi pracujícími muži a ženami v Řecku." # todo: NEW TRANSLATION
 GRE_question_eu_policies: "Zpochybňovat politiky EU" # todo: NEW TRANSLATION
 GRE_question_eu_policies_desc: "Ačkoli věříme, že Evropská unie je prospěšná, mnoho jejich politik je nepřijatelné, například zvýšená ekonomická kontrola. Dokud tyto politiky existují, EU nám nepřinese žádné výhody." # todo: NEW TRANSLATION
 GRE_left_united: "Levice sjednocená" # todo: NEW TRANSLATION
 GRE_left_united_desc: "Naše strana se skládá z mnoha levicových proudů a to po mnoho let způsobovalo problémy v naší straně. Proto musíme posílit jednotu v naší straně, abychom mohli sjednotit levici jako jednu." # todo: NEW TRANSLATION
 GRE_support_the_public_sector: "Podpora veřejného sektoru" # todo: NEW TRANSLATION
 GRE_support_the_public_sector_desc: "Veřejný sektor je největší v Řecku a zaměstnává obrovské množství lidí. Posílení a modernizace veřejného sektoru by mohlo přinést více pracovních příležitostí a větší podporu pro naši vládu." # todo: NEW TRANSLATION
 GRE_remind_the_failures_of_pasok_and_new_democracy: "Selhání PASOK a Nové demokracie" # todo: NEW TRANSLATION
 GRE_remind_the_failures_of_pasok_and_new_democracy_desc: "Musíme připomenout řeckému lidu selhání PASOK a Nové Demokracie, neboť se jim podařilo zvýšit ekonomickou a sociální nerovnost, navýšit veřejný dluh na 300 miliard dolarů, vytvořit dluhovou krizi a zároveň zvýšit míru korupce. Musí si uvědomit, že řecký lid na jejich katastrofy nezapomněl." # todo: NEW TRANSLATION
 GRE_encourage_agricultural_growth: "Podporovat zemědělský růst" # todo: NEW TRANSLATION
 GRE_encourage_agricultural_growth_desc: "Zemědělství je jednoznačně největším a nejsilnějším odvětvím naší ekonomiky a mnoho našich vývozů do jiných zemí jsou zemědělské produkty, jako olivový olej. Zvýšení financování zemědělství posílí naši ekonomiku a zároveň zvýší export do dalších zemí." # todo: NEW TRANSLATION
 GRE_the_greek_crisis: "Řešení dluhové krize" # todo: NEW TRANSLATION
 GRE_the_greek_crisis_desc: "Naše ekonomika je kvůli obrovskému objemu dluhů na pokraji zhroucení. Proto je nutné provést razantní opatření, aby byla řecká ekonomika zachráněna." # todo: NEW TRANSLATION
 GRE_enact_austerity_measures: "Zavést úsporná opatření" # todo: NEW TRANSLATION
 GRE_enact_austerity_measures_desc: "Zavedení úsporných opatření by mohlo zachránit naši ekonomiku před kolapsem, ale lidé tyto kroky nebudou brát lehce." # todo: NEW TRANSLATION
 GRE_reduce_education: "Snížit rozpočet na vzdělání" # todo: NEW TRANSLATION
 GRE_reduce_education_desc: "V rámci našeho programu úsporných opatření je nutné snížit financování vzdělávacího systému, abychom ušetřili více prostředků potřebných pro ekonomické oživení. To bohužel sníží efektivnost řeckého vzdělávacího systému, ale v konečném důsledku to pomůže naší zemi." # todo: NEW TRANSLATION
 GRE_reduce_health: "Škrty ve zdravotnictví" # todo: NEW TRANSLATION
 GRE_reduce_health_desc: "Částka financí putuje do řeckého zdravotnictví, která je pro naši ekonomiku příliš vysoká. Pokud omezíme prostředky pro zdravotnictví, mohlo by to pomoci ekonomice, avšak občané by měli horší podmínky při hospitalizaci." # todo: NEW TRANSLATION
 GRE_reduce_welfare: "Škrty ve sociálním zabezpečení" # todo: NEW TRANSLATION
 GRE_reduce_welfare_desc: "Naše země investovala do sociálního zabezpečení velké množství prostředků a ačkoliv to zlepšilo kvalitu života občanů, zároveň to snížilo potřebné zdroje pro posílení naší ekonomiky. Abychom zachránili ekonomiku, musíme ukončit sociální stát, za který byla naše země známá." # todo: NEW TRANSLATION
 GRE_reduce_army: "Snížit vojenské výdaje" # todo: NEW TRANSLATION
 GRE_reduce_army_desc: "V posledních letech ztrácí potřeba navýšených vojenských prostředků na ostrosti, jelikož naše země se do války brzy nepřipravuje. Proto by bylo rozumné stáhnout část financí z armády a posílit tak důležitější sektory naší ekonomiky." # todo: NEW TRANSLATION
 GRE_recovery: "Hospodářské oživení" # todo: NEW TRANSLATION
 GRE_recovery_desc: "Po těžkých rozhodnutích a tvrdých úsporných opatřeních se nám podařilo zastavit hospodářský pokles a snížit obrovský dluh. Ať žije naše země, která se stane opět velkou, jakou bývala v době říší." # todo: NEW TRANSLATION
 GRE_eastern_neighborhood: "Východní sousedství" # todo: NEW TRANSLATION
 GRE_eastern_neighborhood_desc: "Řecko musí vymezit svůj vztah k nejbližším sousedům, Turecku a rozdělenému ostrovu Kypru. Způsob, jakým budeme jednat s oběma, ovlivní region na celou generaci." # todo: NEW TRANSLATION
 GRE_turkey_rapprochement: "Sblížení s Tureckem" # todo: NEW TRANSLATION
 GRE_turkey_rapprochement_desc: "Řecko a Turecko mají více společného, než si kterákoliv strana připouští. Strukturovaný dialog o obchodu, migraci a Egejském moři může snížit napětí a otevřít cestu ke stabilnímu soužití." # todo: NEW TRANSLATION
 GRE_turkey_confrontation: "Čelit tureckým ambicím" # todo: NEW TRANSLATION
 GRE_turkey_confrontation_desc: "Opakované narušování řeckého vzdušného prostoru a provokace Turecka v Egejském moři nesmějí zůstat bez odpovědi. Řecko zaujme pevný postoj a shromáždí spojence k odporu proti dalšímu pronikání." # todo: NEW TRANSLATION
 GRE_aegean_dialogue: "Egejský dialog" # todo: NEW TRANSLATION
 GRE_aegean_dialogue_desc: "Formální kanál pro dialog o právech a hranicích v Egejském moři snižuje riziko náhodné eskalace a vytváří základ pro trvalou námořní dohodu." # todo: NEW TRANSLATION
 GRE_migration_cooperation: "Spolupráce v oblasti migrace" # todo: NEW TRANSLATION
 GRE_migration_cooperation_desc: "Koordinace migrační politiky s Tureckem je nezbytná pro řízení toku uprchlíků přes Egejské moře. Sdílená odpovědnost znamená méně krizí pro obě strany." # todo: NEW TRANSLATION
 GRE_greco_turkish_trade: "Řecko-turecká obchodní dohoda" # todo: NEW TRANSLATION
 GRE_greco_turkish_trade_desc: "Rozšíření bilaterálního obchodu snižuje motivaci k politické konfrontaci. Hospodářská vzájemná závislost Řecka a Turecka slouží zájmům obou národů." # todo: NEW TRANSLATION
 GRE_nato_pressure_turkey: "Tlak NATO na Turecko" # todo: NEW TRANSLATION
 GRE_nato_pressure_turkey_desc: "Řecko využije svého postavení v NATO, aby Turecko volalo k odpovědnosti za porušování aliančních norem. Naši spojenci musí uznat, že stabilita ve východním Středomoří vyžaduje tureckou zdrženlivost." # todo: NEW TRANSLATION
 GRE_aegean_assertiveness: "Asertivní postoj v Egejském moři" # todo: NEW TRANSLATION
 GRE_aegean_assertiveness_desc: "Řecké námořnictvo zvýší hlídky a cvičení ve sporných vodách, aby prosadilo svrchovanost nad egejským kontinentálním šelfem a vzdušným prostorem." # todo: NEW TRANSLATION
 GRE_aegean_deterrence: "Odstrašení v Egejském moři" # todo: NEW TRANSLATION
 GRE_aegean_deterrence_desc: "Investice do pobřežní obrany a sil rychlé reakce vysílají jasný signál, že Řecko je připraveno bránit své území proti jakémukoli vpádu." # todo: NEW TRANSLATION
 GRE_enosis_campaign: "Kampaň za Enosis" # todo: NEW TRANSLATION
 GRE_enosis_campaign_desc: "Řecko zahajuje diplomatickou a kulturní kampaň na posílení vazeb s řeckokyperskou komunitou a podporu myšlenky budoucího sjednocení s mateřskou zemí." # todo: NEW TRANSLATION
 GRE_cypriot_economic_integration: "Hospodářská integrace Kypru" # todo: NEW TRANSLATION
 GRE_cypriot_economic_integration_desc: "Prohloubení obchodních a finančních vazeb mezi Řeckem a Kyperskou republikou činí znovusjednocení ekonomicky přitažlivým a posiluje řecký vliv na ostrově." # todo: NEW TRANSLATION
 GRE_northern_outreach: "Oslovení severu" # todo: NEW TRANSLATION
 GRE_northern_outreach_desc: "Řecko oslovuje turecké Kypřany na severu a nabízí hospodářské pobídky a kulturní výměnu, aby ukázalo, že znovusjednocení slouží jejich zájmům stejně jako zájmům kohokoli jiného." # todo: NEW TRANSLATION
 GRE_british_bases_accord: "Dohoda o britských základnách" # todo: NEW TRANSLATION
 GRE_british_bases_accord_desc: "Spojené království si na Kypru ponechává dvě oblasti svrchovaných základen. Dohoda s Londýnem zajistí britskou neutralitu nebo aktivní podporu jakéhokoli budoucího procesu znovusjednocení." # todo: NEW TRANSLATION
 GRE_cyprus_gas_exploitation: "Těžba plynu na Kypru" # todo: NEW TRANSLATION
 GRE_cyprus_gas_exploitation_desc: "Ve vodách jižně od Kypru byla objevena významná ložiska zemního plynu. Řecko se snaží tato ložiska společně rozvíjet a vytvořit na sjednoceném ostrově sdílené hospodářské zájmy." # todo: NEW TRANSLATION
 GRE_confederation_framework: "Konfederační rámec" # todo: NEW TRANSLATION
 GRE_confederation_framework_desc: "Řecko navrhuje formální model konfederace, který zachovává autonomii komunit a zároveň sjednocuje ostrov pod jedinou svrchovaností; jde o rámec, který mohou přijmout obě komunity." # todo: NEW TRANSLATION
 GRE_cyprus_reunification: "Znovusjednocení Kypru" # todo: NEW TRANSLATION
 GRE_cyprus_reunification_desc: "S širokou podporou obou komunit, dostatečně nízkým napětím v Egejském moři, aby Turecko nezasáhlo, zajištěnou dohodou o britských základnách a plně rozpracovaným konfederačním rámcem konečně nastal čas ostrov znovu sjednotit." # todo: NEW TRANSLATION
 GRE_force_enosis: "Vynutit řešení" # todo: NEW TRANSLATION
 GRE_force_enosis_desc: "Jednání selhala a ostrov je sudem prachu. Namísto čekání na urovnání, které nikdy nepřijde, tlačí Atény Enosis až na pokraj a vyzývají Sever k akci. Pokud nikosijské tureckokyperské vedení udeří jako první, Kyperská republika bude mít plné právo ostrov znovu sjednotit silou." # todo: NEW TRANSLATION
 GRE_aegean_tension_high_TT: "§BNapětí v Egejském moři nad §H50§!§!" # todo: NEW TRANSLATION
 GRE_recognize_unified_cyprus: "Uznat sjednocenou Kyperskou republiku" # todo: NEW TRANSLATION
 GRE_recognize_unified_cyprus_desc: "Síly Nikósie obsadily Sever. Rozdělení, které poznamenalo ostrov na půl století, skončilo. Atény formálně uznávají jedinou, s Řeckem spřízněnou Kyperskou republiku a pomáhají jí integrovat území." # todo: NEW TRANSLATION
 GRE_war_cyprus_active: "Vyhlásili jsme válku Kypru" # todo: NEW TRANSLATION
 GRE_war_ncyprus_active: "Vyhlásili jsme válku Severnímu Kypru" # todo: NEW TRANSLATION
 GRE_western_alignment: "Západní orientace" # todo: NEW TRANSLATION
 GRE_western_alignment_desc: "Řecko znovu potvrzuje své místo v centru západní diplomacie. Jako zakládající člen NATO, jeden z prvních členů EU a přirozená kotva východního Středomoří se Atény snaží proměnit svou geografickou váhu v závazné politické závazky a zahajují kampaň bilaterálního i multilaterálního oslovování, jejíž výsledky se budou měřit v západním závazku." # todo: NEW TRANSLATION
 GRE_franco_hellenic_pact: "Francouzsko-řecké strategické partnerství" # todo: NEW TRANSLATION
 GRE_franco_hellenic_pact_desc: "Na základě strategického partnerství podepsaného v Aténách v září 2021 usiluje Řecko s Francií o komplexní bilaterální rámec zahrnující obranný průmysl, sladění zahraniční politiky a bezpečnost východního Středomoří. Paříž je nejochotnějším významným partnerem v Evropě; její užší připoutání je základním kamenem každého důvěryhodného západního postoje." # todo: NEW TRANSLATION
 GRE_eastmed_trilateral: "Trilaterála východního Středomoří" # todo: NEW TRANSLATION
 GRE_eastmed_trilateral_desc: "Řecko, Izrael a Kypr formalizují svou dlouholetou trilaterální spolupráci: společná námořní cvičení, sdílení zpravodajských informací a koordinovaný postoj k bezpečnosti východního Středomoří. Uspořádání mění tři spřátelená hlavní města v jediný strategický blok obrácený k levantské pánvi." # todo: NEW TRANSLATION
 GRE_eu_political_anchor: "Kotva zakládajícího člena EU" # todo: NEW TRANSLATION
 GRE_eu_political_anchor_desc: "Řecko znovu potvrzuje svou identitu zakládajícího člena evropského projektu. Převzetím vedoucího hlasu v Bruselu v otázkách soudržnosti, rozšíření a společné zahraniční politiky mění Atény desetiletí členství v současnou politickou váhu." # todo: NEW TRANSLATION
 GRE_strategic_partnership_treaty: "Vzájemná obranná doložka podle článku 2" # todo: NEW TRANSLATION
 GRE_strategic_partnership_treaty_desc: "Řecko dovádí francouzsko-řecké partnerství k závěru: závazná doložka vzájemné obrany podle vzoru článku 5, kodifikovaná ve smlouvě. Francie se stává první evropskou mocností smluvně zavázanou bránit řecké území, čímž se trvale mění bezpečnostní řád ve Středomoří." # todo: NEW TRANSLATION
 GRE_eastmed_gas_forum: "Člen Fóra pro plyn ve východním Středomoří" # todo: NEW TRANSLATION
 GRE_eastmed_gas_forum_desc: "Řecko formalizuje svou roli ve Fóru pro plyn ve východním Středomoří po boku Kypru, Izraele, Egypta, Itálie, Jordánska a Palestiny. Institucionální rámec ukotvuje regionální energetickou spolupráci, zajišťuje preferenční obchodní přístup pro řeckou námořní dopravu a poskytuje Aténám stálé místo u východostředomořského diplomatického stolu." # todo: NEW TRANSLATION
 GRE_3plus1_dialogue: "Strategický dialog 3+1" # todo: NEW TRANSLATION
 GRE_3plus1_dialogue_desc: "Řecko, Kypr a Izrael formalizují dialog 3+1 se Spojenými státy, formát podporovaný ministerstvem zahraničí, který zahrnuje energetickou bezpečnost, námořní spolupráci a boj proti terorismu. Uspořádání poskytuje Washingtonu strukturovaný kanál do východostředomořské trilaterály a završuje regionální architekturu americkým zapojením." # todo: NEW TRANSLATION
 GRE_eu_strategic_compass: "Strategický kompas EU" # todo: NEW TRANSLATION
 GRE_eu_strategic_compass_desc: "Řecko se stává hlasitým zastáncem Strategického kompasu EU a prosazuje evropskou strategickou autonomii, hlubší integraci PESCO a evropský pilíř v rámci NATO. Atény se v kontinentální obraně slaďují s Paříží a Berlínem a mění tiché členství v aktivní roli při utváření politiky." # todo: NEW TRANSLATION
 GRE_pillar_of_the_west: "Pilíř Západu" # todo: NEW TRANSLATION
 GRE_pillar_of_the_west_desc: "Práce let přináší ovoce. Řecko nestojí na okraji západní diplomacie, ale jako jeden z jejích základních kamenů. Hloubka tohoto dědictví, měřená západním závazkem nashromážděným během kampaně, určuje, jak pevně jsou Atény v této struktuře zakotveny." # todo: NEW TRANSLATION
 GRE_regional_diplomacy: "Regionální diplomacie" # todo: NEW TRANSLATION
 GRE_regional_diplomacy_desc: "Řecko je pilířem Balkánu a musí udržovat silné vztahy se všemi svými sousedy. Stabilita regionu je neoddělitelná od vlastní bezpečnosti a prosperity Řecka." # todo: NEW TRANSLATION
 GRE_prespa_implementation: "Provádění Prespanské dohody" # todo: NEW TRANSLATION
 GRE_prespa_implementation_desc: "Prespanská dohoda vyřešila desetiletí trvající spor o název Severní Makedonie. Řecko nyní plně plní své závazky, normalizuje vztahy a otevírá cestu k rozšíření obchodu." # todo: NEW TRANSLATION
 GRE_albania_minority: "Práva albánské menšiny" # todo: NEW TRANSLATION
 GRE_albania_minority_desc: "V jižní Albánii žije početná řecká menšina. Řecko vede konstruktivní dialog o právech menšin a využívá tuto otázku jako základ hlubší bilaterální spolupráce namísto konfrontace." # todo: NEW TRANSLATION
 GRE_egypt_maritime: "Námořní partnerství s Egyptem" # todo: NEW TRANSLATION
 GRE_egypt_maritime_desc: "Řecko a Egypt podepisují dohodu o námořní hranici ve východním Středomoří, čímž vytvářejí právní rámec pro společný rozvoj energetiky a vylučují turecké nároky z této oblasti." # todo: NEW TRANSLATION
 GRE_italy_mediterranean_axis: "Italsko-středomořská osa" # todo: NEW TRANSLATION
 GRE_italy_mediterranean_axis_desc: "Itálie je největším obchodním partnerem Řecka v EU a bilaterální obchod přesahuje dvanáct miliard eur ročně. Formální partnerství rozšiřuje spolupráci v energetice, dopravě a obraně napříč středním Středomořím." # todo: NEW TRANSLATION
 GRE_balkan_energy_corridor: "Balkánský energetický koridor" # todo: NEW TRANSLATION
 GRE_balkan_energy_corridor_desc: "Plynovodní propojení Řecka a Bulharska a plovoucí terminál v Alexandroupoli mění Řecko v klíčový energetický tranzitní uzel. Nový plynovod do Severní Makedonie tuto síť rozšiřuje hlouběji do Balkánu." # todo: NEW TRANSLATION
 GRE_mediterranean_energy_hub: "Středomořský energetický uzel" # todo: NEW TRANSLATION
 GRE_mediterranean_energy_hub_desc: "S plovoucí jednotkou FSRU v Alexandroupoli a terminálem Revithoussa pracujícími na plnou kapacitu se Řecko staví do role hlavní evropské brány pro LNG a nahrazuje závislost na ruském plynovodním plynu dodávkami po moři z východního Středomoří i odjinud." # todo: NEW TRANSLATION
 GRE_gulf_strategic_partners: "Strategičtí partneři v Zálivu" # todo: NEW TRANSLATION
 GRE_gulf_strategic_partners_desc: "Řecko zřizuje Nejvyšší radu strategické spolupráce se Saúdskou Arábií a prohlubuje obranné a investiční vazby se Spojenými arabskými emiráty. Kapitál ze Zálivu a vojenská spolupráce proudí do východního Středomoří." # todo: NEW TRANSLATION
 GRE_balkans_eu_advocacy: "Prosazování vstupu Balkánu do EU" # todo: NEW TRANSLATION
 GRE_balkans_eu_advocacy_desc: "Na základě závazku ze soluňského summitu z roku 2003 Řecko prosazuje vstup západního Balkánu do EU. Jako nejdéle etablovaný člen EU v regionu získává Řecko vliv měkké síly nad Srbskem, Albánií a Severní Makedonií." # todo: NEW TRANSLATION
 GRE_imec_gateway: "Brána IMEC" # todo: NEW TRANSLATION
 GRE_imec_gateway_desc: "Ekonomický koridor Indie–Blízký východ–Evropa označuje Pireus za svou evropskou koncovku. Masivní investice do přístavu a logistiky proměňují střední Řecko v transkontinentální obchodní uzel propojující Asii s Evropou." # todo: NEW TRANSLATION
 GRE_se_european_pillar: "Pilíř jihovýchodní Evropy" # todo: NEW TRANSLATION
 GRE_se_european_pillar_desc: "Řecko upevňuje svou pozici nepostradatelného uzlu jihovýchodní Evropy: energetické brány, balkánského patrona, středomořské obchodní kotvy a koncového bodu koridoru spojujícího tři kontinenty." # todo: NEW TRANSLATION
 GRE_eastern_alignment: "Obrat na východ" # todo: NEW TRANSLATION
 GRE_eastern_alignment_desc: "Po desetiletí úspor Trojky a atlantistického dohledu se Atény obracejí na východ. Řecko bude pěstovat paralelní vztahy s Ruskem, Čínou, Íránem a pravoslavným Balkánem a postupně se promění ve středomořskou kotvu multipolárního světa." # todo: NEW TRANSLATION
 GRE_strategic_autonomy: "Strategická autonomie" # todo: NEW TRANSLATION
 GRE_strategic_autonomy_desc: "Řecko nemusí volit jediného pána. Člen NATO, který stále nakupuje ruský plyn, usiluje o kapitál ze Zálivu a Číny a zprostředkovává mezi soupeři, může získávat ústupky ze všech stran. Atény nastupují kurz s více vektory, zavázané žádnému bloku a užitečné všem." # todo: NEW TRANSLATION
 GRE_strategic_autonomy_event_TT: "§YOtevírá se debata o tom, jak využít řecké neangažované postavení.§!" # todo: NEW TRANSLATION
 GRE_russia_outreach: "Otevřít kanály s Moskvou" # todo: NEW TRANSLATION
 GRE_russia_outreach_desc: "Řecko se potichu obrací na Kreml s nabídkou dlouhodobých smluv na zemní plyn, rozšířeného přístupu ruské námořní dopravy do přístavů a vstřícnějších politických signálů. Reakce Moskvy určí tón nového středomořského partnerství." # todo: NEW TRANSLATION
 GRE_china_outreach: "Navázat kontakt s Pekingem" # todo: NEW TRANSLATION
 GRE_china_outreach_desc: "Řečtí vyslanci cestují do Pekingu s cílem prohloubit spolupráci v průmyslovém financování, telekomunikacích a infrastruktuře. Akvizice Pirea společností COSCO již tento model prokázala. Nyní Atény navrhují jeho rozšíření na celou řeckou ekonomiku." # todo: NEW TRANSLATION
 GRE_iran_outreach: "Oslovení Teheránu" # todo: NEW TRANSLATION
 GRE_iran_outreach_desc: "Řecko, dlouhodobě sympatizující s íránskými výhradami vůči sankcím, potichu navrhuje barterový a energetický rámec mimo SWIFT. Tento krok je v Bruselu a Washingtonu provokativní, ale v případě souhlasu Teheránu výnosný." # todo: NEW TRANSLATION
 GRE_orthodox_outreach: "Pravoslavné bratrství" # todo: NEW TRANSLATION
 GRE_orthodox_outreach_desc: "Atény svolávají summit s Bělehradem, Nikósií a Jerevanem a vytvářejí kulturní a politické spojenectví pravoslavné Evropy. Diplomacie patriarchátu se stává státnickou politikou a buduje regionální blok, který se nezodpovídá ani Bruselu, ani Washingtonu." # todo: NEW TRANSLATION
 GRE_russia_milcoop: "Řecko-ruská obranná jednání" # todo: NEW TRANSLATION
 GRE_russia_milcoop_desc: "Po energetickém partnerství Atény navrhují Moskvě formální obrannou spolupráci: společná cvičení, modernizaci S-300 PMU2 a sdílení zpravodajských informací. Politický signál NATO je nezaměnitelný." # todo: NEW TRANSLATION
 GRE_china_bri_anchor: "Kotva Pásu a stezky" # todo: NEW TRANSLATION
 GRE_china_bri_anchor_desc: "Řecko se nabízí jako evropská kotva čínské iniciativy Pás a stezka, rozšiřuje působnost COSCO, otevírá nové zóny volného obchodu v Attice a zapojuje řeckou logistiku do čínských dodavatelských řetězců." # todo: NEW TRANSLATION
 GRE_iran_med_corridor: "Koridor východního Středomoří" # todo: NEW TRANSLATION
 GRE_iran_med_corridor_desc: "Atény navrhují energetický koridor z Íránu do Řecka, který by prostřednictvím třetích zemí přepravoval ropu a LNG mimo západní sankce. Pokud Teherán souhlasí, Řecko se stane íránským oknem do Evropy." # todo: NEW TRANSLATION
 GRE_orthodox_security: "Pravoslavný bezpečnostní pakt" # todo: NEW TRANSLATION
 GRE_orthodox_security_desc: "Pravoslavná rada formalizuje obranný pakt: společný výcvik, zpravodajskou spolupráci a stálé politické konzultace. Srbsko, Kypr a Arménie se připojují k Řecku v diskrétním, ale nezaměnitelném bloku." # todo: NEW TRANSLATION
 GRE_brics_membership: "Připojit se k BRICS+" # todo: NEW TRANSLATION
 GRE_brics_membership_desc: "Řecko formálně vstupuje do rámce BRICS+ jako první evropský člen. Rozchod s NATO je nyní dokončen; Atény výměnou získávají přednostní přístup k Nové rozvojové bance, systému vypořádání v jüanech a rublech a místo u multipolárního stolu." # todo: NEW TRANSLATION
 GRE_multipolar_anchor: "Kotva multipolárního světa" # todo: NEW TRANSLATION
 GRE_multipolar_anchor_desc: "Řecko se prohlašuje za kotvu nového multipolárního řádu. Atlantická aliance je opuštěna, Evropská unie opuštěna a ze sídla v Aténách se rodí středomořská republika tří kontinentů — eurasijského, levantského a afrického." # todo: NEW TRANSLATION
 GRE_eastern_outreach: "Východní oslovování" # todo: NEW TRANSLATION
 GRE_eastern_outreach_desc: "Atény začaly pěstovat partnerství mimo atlantickou alianci. Diplomatická kapacita proudí na východ a autonomie obchodní politiky se rozšiřuje, západní metropole však situaci pozorně sledují." # todo: NEW TRANSLATION
 GRE_eurasian_partner: "Euroasijský partner" # todo: NEW TRANSLATION
 GRE_eurasian_partner_desc: "Řecko je nyní uznávaným euroasijským partnerem. Kapitál z Moskvy, Pekingu a Teheránu podporuje řecký průmysl, zatímco západní veřejné mínění se přitvrzuje. Cesta zpět se zužuje." # todo: NEW TRANSLATION
 GRE_brics_anchor: "Kotva BRICS" # todo: NEW TRANSLATION
 GRE_brics_anchor_desc: "Řecko zasedá u stolu BRICS+. Atlantická aliance je minulostí a Středomoří je multipolárním mořem. Atény hovoří s autoritou kontinentálního spojovacího článku." # todo: NEW TRANSLATION
 GRE_orthodox_defense_pact: "Pravoslavný obranný pakt" # todo: NEW TRANSLATION
 GRE_orthodox_defense_pact_desc: "Stálý obranný pakt pravoslavné Evropy: společná cvičení, sdílená doktrína a společné zpravodajství s Bělehradem, Nikósií a Jerevanem." # todo: NEW TRANSLATION
 GRE_iran_barter_framework: "Barter ve stylu INSTEX" # todo: NEW TRANSLATION
 GRE_iran_barter_framework_desc: "Řecko-íránský obchod proudí prostřednictvím barterového zúčtovacího střediska mimo SWIFT, obchází sankce a otevírá íránské trhy řeckým vývozcům." # todo: NEW TRANSLATION
 GRE_iran_med_corridor_idea: "Energetický koridor východního Středomoří" # todo: NEW TRANSLATION
 GRE_iran_med_corridor_idea_desc: "Íránská ropa a LNG proudí do Evropy koridorem ukotveným v Řecku. Rafinérské kapacity rostou, zásoby paliva se zvyšují a Atény se stávají regionálním energetickým hrdlem." # todo: NEW TRANSLATION
 GRE_diplomacy_category: "Řecká diplomacie" # todo: NEW TRANSLATION
 GRE_host_putin_summit: "Hostit ruský summit" # todo: NEW TRANSLATION
 GRE_host_putin_summit_desc: "Pozvěte ruského prezidenta do Atén na významný bilaterální summit. Podepíší se obchodní dohody, připraví fotografické příležitosti a západní ambasády se zamračí." # todo: NEW TRANSLATION
 GRE_cosco_pier_expansion: "Rozšíření mola COSCO" # todo: NEW TRANSLATION
 GRE_cosco_pier_expansion_desc: "Spolufinancujte další fázi rozšíření COSCO v Pireu. Civilní továrna se k projektu zaváže na tři měsíce; výměnou získá Attika trvalý slot infrastruktury." # todo: NEW TRANSLATION
 GRE_instex_iran_barter: "Provozovat íránský barterový kanál" # todo: NEW TRANSLATION
 GRE_instex_iran_barter_desc: "Zpracujte část řecko-íránského obchodu prostřednictvím barterového zúčtovacího střediska, obnovte tento rámec a odměňte obchodníky, kteří jej udržují při životě." # todo: NEW TRANSLATION
 GRE_orthodox_patriarchate_summit: "Svolat pravoslavnou radu" # todo: NEW TRANSLATION
 GRE_orthodox_patriarchate_summit_desc: "Uspořádejte summit patriarchátu v Aténách a spojte srbské, kyperské a arménské představitele k církevním a politickým konzultacím." # todo: NEW TRANSLATION
 GRE_retry_russia_outreach: "Znovu oslovit Moskvu" # todo: NEW TRANSLATION
 GRE_retry_russia_outreach_desc: "Po předchozím odmítnutí řečtí diplomaté připraví revidovaný návrh a znovu otevřou kanály s Kremlem." # todo: NEW TRANSLATION
 GRE_retry_russia_milcoop: "Znovu navrhnout obranná jednání" # todo: NEW TRANSLATION
 GRE_retry_russia_milcoop_desc: "Obnovte návrh řecko-ruské obranné spolupráce s výhodnějšími podmínkami a tiššími signály." # todo: NEW TRANSLATION
 GRE_retry_china_outreach: "Znovu oslovit Peking" # todo: NEW TRANSLATION
 GRE_retry_china_outreach_desc: "Pošlete do Pekingu nového vyslance s upravenými podmínkami a novou nabídkou investičních záruk." # todo: NEW TRANSLATION
 GRE_retry_china_bri_anchor: "Znovu nabídnout roli kotvy BRI" # todo: NEW TRANSLATION
 GRE_retry_china_bri_anchor_desc: "Upravte nabídku role kotvy BRI širšími ústupky v oblasti logistiky, vlastnictví a politického sladění." # todo: NEW TRANSLATION
 GRE_retry_iran_outreach: "Znovu se zapojit s Teheránem" # todo: NEW TRANSLATION
 GRE_retry_iran_outreach_desc: "Po prvním odmítnutí Teheránu Atény znovu otevírají zákulisní jednání prostřednictvím prostředníků ze třetích zemí." # todo: NEW TRANSLATION
 GRE_retry_iran_med_corridor: "Znovu navrhnout středomořský koridor" # todo: NEW TRANSLATION
 GRE_retry_iran_med_corridor_desc: "Upravte návrh koridoru východního Středomoří novými trasami, které dále omezí vystavení Íránu prosazování západních sankcí." # todo: NEW TRANSLATION
 GRE_retry_orthodox_outreach: "Znovu svolat pravoslavný summit" # todo: NEW TRANSLATION
 GRE_retry_orthodox_outreach_desc: "Po neúspěšném prvním summitu napravte vztahy a znovu pozvěte pravoslavné ministry zahraničí do Atén." # todo: NEW TRANSLATION
 GRE_retry_orthodox_security: "Znovu navrhnout bezpečnostní pakt" # todo: NEW TRANSLATION
 GRE_retry_orthodox_security_desc: "Obnovte pravoslavný bezpečnostní pakt s upravenými závazky v oblasti sdílení zpravodajských informací a rotace cvičení." # todo: NEW TRANSLATION
 greece.530.t: "Řecký návrh energetické spolupráce" # todo: NEW TRANSLATION
 greece.530.d: "Atény navrhují komplexní energetické a obchodní partnerství: dlouhodobé smlouvy na dodávky plynu, koncese v přístavech pro ruskou námořní dopravu a diskrétní přesměrování řecké zahraniční politiky směrem k Moskvě. Řecký ministr zahraničí čeká na odpověď." # todo: NEW TRANSLATION
 greece.530.a: "Vítaná příležitost. Podepsat." # todo: NEW TRANSLATION
 greece.530.b: "Atény nemohou dostát svým slibům. Odmítnout." # todo: NEW TRANSLATION
 greece.531.t: "Moskva přijímá partnerství" # todo: NEW TRANSLATION
 greece.531.d: "Kreml přijímá řecký návrh. Obchodní portfolia jsou vyměněna, je podepsána vylepšená bilaterální dohoda a za výhodných podmínek začíná proudit ruský plyn. Atény získaly svého prvního východního partnera." # todo: NEW TRANSLATION
 greece.531.a: "Vítejte v nové řecké zahraniční politice." # todo: NEW TRANSLATION
 greece.532.t: "Moskva odmítá" # todo: NEW TRANSLATION
 greece.532.d: "Kreml zdvořile odmítá řeckou nabídku. Bez pevných záruk, že Atény opustí Atlantickou alianci, nemá Moskva důvod podstupovat politická rizika. Neúspěch je skutečný, ale dveře nejsou zavřené." # todo: NEW TRANSLATION
 greece.532.a: "Přeskupit síly a zkusit to znovu." # todo: NEW TRANSLATION
 greece.533.t: "Návrh řecké obranné spolupráce" # todo: NEW TRANSLATION
 greece.533.d: "Atény navrhují formální řecko-ruský obranný rámec: společná cvičení, podporu modernizace systémů S-300 PMU2 a sdílení zpravodajských informací. Moskva zvažuje politický zisk oproti diplomatickému odporu ze strany NATO." # todo: NEW TRANSLATION
 greece.533.a: "Historické sblížení. Přijmout." # todo: NEW TRANSLATION
 greece.533.b: "Řecko je stále členem NATO. Odmítnout." # todo: NEW TRANSLATION
 greece.534.t: "Moskva přijímá jednání o obraně" # todo: NEW TRANSLATION
 greece.534.d: "Ruské ministerstvo obrany souhlasí s formální spoluprací. Řečtí důstojníci cestují do Moskvy na výcvik; ruští inženýři přijíždějí na námořní základnu Salamis. Bonus pro pozemní doktrínu je významný, stejně jako politické náklady." # todo: NEW TRANSLATION
 greece.534.a: "Řecko-ruská zbrojní spolupráce začíná." # todo: NEW TRANSLATION
 greece.535.t: "Moskva odmítá jednání o obraně" # todo: NEW TRANSLATION
 greece.535.d: "Moskva odmítá s odvoláním na pokračující závazky Řecka vůči NATO. Dokud Atény neopustí Atlantickou alianci, nebo alespoň nevyšlou věrohodný signál, že to hodlají udělat, nebude existovat žádná formální obranná spolupráce." # todo: NEW TRANSLATION
 greece.535.a: "Vzít na vědomí požadavek na větší odhodlání." # todo: NEW TRANSLATION
 greece.536.t: "Řecké oslovení Pekingu" # todo: NEW TRANSLATION
 greece.536.d: "Atény oslovují Peking s návrhem na prohloubení ekonomické spolupráce: telekomunikace, financování infrastruktury a širší integrace do iniciativy BRI. Čínské ministerstvo zahraničí návrh posuzuje." # todo: NEW TRANSLATION
 greece.536.a: "Přirozené spojení. Podpořit." # todo: NEW TRANSLATION
 greece.536.b: "Politické náklady převyšují přínosy. Odmítnout." # todo: NEW TRANSLATION
 greece.537.t: "Peking přijímá" # todo: NEW TRANSLATION
 greece.537.d: "Čínské vedení podporuje partnerství. Státní kapitál začíná proudit do řeckých průmyslových a telekomunikačních projektů a řecký vliv v kalkulacích Pekingu měřitelně roste." # todo: NEW TRANSLATION
 greece.537.a: "Čínsko-řecké partnerství se prohlubuje." # todo: NEW TRANSLATION
 greece.538.t: "Peking odmítá" # todo: NEW TRANSLATION
 greece.538.d: "Peking váhá: Atény podle něj nemohou nabídnout nic, co by již nebylo zajištěno tiššími kanály. Řečtí diplomaté se vracejí s prázdnýma rukama, ale neodradili se." # todo: NEW TRANSLATION
 greece.538.a: "Přehodnotit situaci a zkusit to znovu." # todo: NEW TRANSLATION
 greece.539.t: "Návrh řecké kotvy BRI" # todo: NEW TRANSLATION
 greece.539.d: "Atény se nabízejí jako evropská kotva Nové hedvábné stezky: prodloužené koncese COSCO, zóny volného obchodu v Attice a politické sladění v otázkách Indo-Pacifiku. Cena je vysoká, stejně jako odměna." # todo: NEW TRANSLATION
 greece.539.a: "Kotva historických ambicí. Přijmout." # todo: NEW TRANSLATION
 greece.539.b: "Podmínky zatím nejsou přijatelné. Odmítnout." # todo: NEW TRANSLATION
 greece.540.t: "Peking schvaluje kotvu BRI" # todo: NEW TRANSLATION
 greece.540.d: "Čína oficiálně označuje Řecko za kotvu BRI. Stavební týmy se mobilizují; do Attiky proudí kapitál; v hlavním regionu díky čínským investicím podporujícím řecký průmysl vyrůstá další civilní továrna." # todo: NEW TRANSLATION
 greece.540.a: "Řecko je evropským koncem Nové hedvábné stezky." # todo: NEW TRANSLATION
 greece.541.t: "Peking odmítá roli kotvy" # todo: NEW TRANSLATION
 greece.541.d: "Peking odmítá formální označení za kotvu, protože považuje řeckou politickou nestabilitu za příliš vysokou pro závazek tohoto rozsahu. Atény musí před obnovením nabídky prokázat pevnější sladění." # todo: NEW TRANSLATION
 greece.541.a: "Podmínky je třeba znovu projednat." # todo: NEW TRANSLATION
 greece.542.t: "Řecké oslovení Teheránu" # todo: NEW TRANSLATION
 greece.542.d: "Řecký vyslanec v Teheránu navrhuje rámec barterového obchodu a obchodu mimo systém SWIFT, jehož cílem je obejít západní sankce a otevřít íránské trhy řeckým vývozcům. Nejvyšší rada národní bezpečnosti nabídku projednává." # todo: NEW TRANSLATION
 greece.542.a: "Vítaný partner z Evropy. Přijmout." # todo: NEW TRANSLATION
 greece.542.b: "Atény mluví za Západ. Odmítnout." # todo: NEW TRANSLATION
 greece.543.t: "Teherán přijímá rámec" # todo: NEW TRANSLATION
 greece.543.d: "Teherán souhlasí. V Aténách vzniká clearingové centrum pro barterový obchod a řečtí vývozci získávají přednostní přístup na íránské trhy. Západní metropole nejsou potěšeny." # todo: NEW TRANSLATION
 greece.543.a: "První evropský vstup do íránského systému." # todo: NEW TRANSLATION
 greece.544.t: "Teherán odmítá" # todo: NEW TRANSLATION
 greece.544.d: "Teherán odmítá. Jak poznamenává íránský ministr zahraničí, Řecko je stále státem NATO a jakýkoli rámec by byl v okamžiku aktivace zranitelný vůči americkým sekundárním sankcím." # todo: NEW TRANSLATION
 greece.544.a: "Nejprve prokázat nezávislost." # todo: NEW TRANSLATION
 greece.545.t: "Návrh řeckého středomořského koridoru" # todo: NEW TRANSLATION
 greece.545.d: "Atény navrhují Východostředomořský koridor: íránská ropa a LNG přepravované přes prostředníky ve třetích zemích do řeckých terminálů a odtud dále do Evropy. Íránská strana zvažuje přínosy oproti americké odvetě." # todo: NEW TRANSLATION
 greece.545.a: "Koridor je strategickou kořistí. Přijmout." # todo: NEW TRANSLATION
 greece.545.b: "Vystavení riziku je příliš velké. Odmítnout." # todo: NEW TRANSLATION
 greece.546.t: "Teherán schvaluje koridor" # todo: NEW TRANSLATION
 greece.546.d: "Teherán schvaluje koridor. Íránská ropa začíná připlouvat do řeckých přístavů; rafinérská kapacita se rozšiřuje po celé Attice a Boiótii. Řecko se stává energetickou překážkou ve Středomoří a Teherán tichým příjemcem výhod." # todo: NEW TRANSLATION
 greece.546.a: "Východostředomořský energetický koridor je otevřen." # todo: NEW TRANSLATION
 greece.547.t: "Teherán odmítá koridor" # todo: NEW TRANSLATION
 greece.547.d: "Teherán odmítá s odvoláním na americký protitlak na prostřednické státy. Koridor je odložen; obě metropole se k němu vrátí, až to podmínky dovolí." # todo: NEW TRANSLATION
 greece.547.a: "Počkat na vhodnější chvíli." # todo: NEW TRANSLATION
 greece.548.t: "Atény svolávají pravoslavný koncil" # todo: NEW TRANSLATION
 greece.548.d: "Atény navrhují stálé politické konzultace mezi pravoslavnými státy Evropy: Srbskem, Kyprem, Arménií a dalšími. Diplomacie patriarchátů je nabízena jako zástěrka; skutečným záměrem je státní politika." # todo: NEW TRANSLATION
 greece.548.a: "Bratrství, které již dlouho chybělo. Přijmout." # todo: NEW TRANSLATION
 greece.548.b: "Rizika převyšují zisky. Odmítnout." # todo: NEW TRANSLATION
 greece.549.t: "Bělehrad schvaluje koncil" # todo: NEW TRANSLATION
 greece.549.d: "Bělehrad návrh schvaluje a Nikósie následuje. Pravoslavný koncil se schází v Aténách za účasti řeckého, srbského a kyperského ministra zahraničí. Vznikl diskrétní, ale nezaměnitelný blok." # todo: NEW TRANSLATION
 greece.549.a: "Pravoslavný blok je zrozen." # todo: NEW TRANSLATION
 greece.550.t: "Bělehrad odmítá" # todo: NEW TRANSLATION
 greece.550.d: "Bělehrad odmítá s odvoláním na obavy z vyprovokování Bruselu a zkomplikování srbského přistoupení k EU. Pravoslavný projekt je odložen, nikoli mrtvý." # todo: NEW TRANSLATION
 greece.550.a: "Trpělivost. Tato chvíle přijde." # todo: NEW TRANSLATION
 greece.551.t: "Návrh řeckého bezpečnostního paktu" # todo: NEW TRANSLATION
 greece.551.d: "Atény navrhují přeměnit pravoslavný blok ve formální obranný pakt: společný výcvik, sdílené zpravodajství a stálé politické konzultace. Bělehrad zvažuje výhody oproti nevyhnutelné reakci Bruselu." # todo: NEW TRANSLATION
 greece.551.a: "Pakt nás všechny posílí. Přijmout." # todo: NEW TRANSLATION
 greece.551.b: "Bělehrad to nemůže riskovat. Odmítnout." # todo: NEW TRANSLATION
 greece.552.t: "Podepsán pravoslavný obranný pakt" # todo: NEW TRANSLATION
 greece.552.d: "Bělehrad, Nikósie a Jerevan se připojují k Aténám při formalizaci Pravoslavného obranného paktu. Začínají společná cvičení; otevírají se zpravodajské kanály; na mapě se objevil diskrétní evropský pól." # todo: NEW TRANSLATION
 greece.552.a: "Pravoslavná bezpečnostní architektura je vytvořena." # todo: NEW TRANSLATION
 greece.553.t: "Bělehrad odmítá pakt" # todo: NEW TRANSLATION
 greece.553.d: "Bělehrad odmítá formální pakt, protože diplomatické náklady považuje za příliš vysoké v době aktivních jednání o přistoupení k EU. Pravoslavný blok zůstává, ale neformální." # todo: NEW TRANSLATION
 greece.553.a: "Pokračovat jinými prostředky." # todo: NEW TRANSLATION
 greece.554.t: "Vítejte v BRICS+" # todo: NEW TRANSLATION
 greece.554.d: "Vedoucí představitelé BRICS+ oficiálně vítají Řecko jako prvního evropského člena aliance. Ruští, čínští, indičtí a íránští vyslanci přijíždějí do Atén na přístupový ceremoniál. Atlantická kapitola je uzavřena." # todo: NEW TRANSLATION
 greece.554.a: "Atény zaujímají místo u multipolárního stolu." # todo: NEW TRANSLATION
 greece.555.t: "Řecko kotví multipolární svět" # todo: NEW TRANSLATION
 greece.555.d: "Řecko se formálně zřeklo Atlantické aliance a Evropské unie a prohlásilo se za kotvu nového multipolárního řádu. Z Atén byla vyhlášena středomořská republika tří kontinentů. Svět se podle toho přeskupuje." # todo: NEW TRANSLATION
 greece.555.a: "Řecká budoucnost začala." # todo: NEW TRANSLATION
 greece.555.b: "Západ ztratil své středomořské křídlo." # todo: NEW TRANSLATION
 greece.555.c: "Objevil se nový pól. Věnujte tomu pozornost." # todo: NEW TRANSLATION
 CYP_seek_greek_union: "Usilovat o sjednocení s Řeckem" # todo: NEW TRANSLATION
 CYP_seek_greek_union_desc: "Kyperská republika podniká formální diplomatické kroky k posílení vztahů s Řeckem a směřuje k budoucímu politickému sjednocení." # todo: NEW TRANSLATION
 CYP_seek_greek_union_cooldown: "Usilovat o sjednocení s Řeckem – čekací doba" # todo: NEW TRANSLATION
 CYP_appeal_to_un: "Obrátit se na Organizaci spojených národů" # todo: NEW TRANSLATION
 CYP_appeal_to_un_desc: "Kypr předkládá otázku znovusjednocení Organizaci spojených národů a hledá mezinárodní legitimitu pro řešení ve prospěch řeckokyperské komunity." # todo: NEW TRANSLATION
 CYP_economic_incentive_north: "Ekonomické pobídky pro sever" # todo: NEW TRANSLATION
 CYP_economic_incentive_north_desc: "Kypr nabízí ekonomické pobídky tureckokyperským komunitám na severu a ukazuje, že znovusjednocení přinese hmatatelné výhody všem obyvatelům ostrova." # todo: NEW TRANSLATION
 CYP_economic_incentive_north_cooldown: "Ekonomické pobídky pro sever – čekací doba" # todo: NEW TRANSLATION
 NCY_seek_turkish_union: "Usilovat o sjednocení s Tureckem" # todo: NEW TRANSLATION
 NCY_seek_turkish_union_desc: "Severní Kypr prohlubuje politické a ekonomické vazby s Tureckem a podporuje vyhlídku na formální sjednocení pod tureckým vedením." # todo: NEW TRANSLATION
 NCY_seek_turkish_union_cooldown: "Usilovat o sjednocení s Tureckem – čekací doba" # todo: NEW TRANSLATION
 NCY_recognition_campaign: "Kampaň za mezinárodní uznání" # todo: NEW TRANSLATION
 NCY_recognition_campaign_desc: "Severní Kypr zahajuje diplomatickou kampaň s cílem získat širší mezinárodní uznání a legitimizovat svou vládu v očích širšího společenství národů." # todo: NEW TRANSLATION
 GRE_aegean_defense_posture: "Obranné postavení v Egejském moři" # todo: NEW TRANSLATION
 GRE_aegean_defense_posture_desc: "Zvýšená připravenost a síly rozmístěné v předních pozicích udržují řeckou armádu ve vysokém stupni pohotovosti. Každé zachycení, každá hlídka a každé cvičení vysílá signál, že řecké území bude bráněno." # todo: NEW TRANSLATION
 GRE_cypriot_integration_idea: "Kyperská ekonomická integrace" # todo: NEW TRANSLATION
 GRE_cypriot_integration_idea_desc: "Hluboká ekonomická integrace s Kyperskou republikou, včetně celní unie a harmonizace bankovnictví, posiluje obchodní vazby a vytváří trvalé příjmy z korporátních daní pro obě ekonomiky." # todo: NEW TRANSLATION
 GRE_north_macedonian_ties: "Vztahy se Severní Makedonií" # todo: NEW TRANSLATION
 GRE_north_macedonian_ties_desc: "Normalizované vztahy se Skopje po Prespanské dohodě otevřely nové diplomatické kanály na Balkáně a vytvořily dobrou vůli, která se promítá do politického vlivu." # todo: NEW TRANSLATION
 GRE_chinese_investment: "Čínské investice do infrastruktury" # todo: NEW TRANSLATION
 GRE_chinese_investment_desc: "Čínský státní kapitál financuje infrastrukturní a průmyslové stavební projekty po celém Řecku a urychluje stavební programy, které domácí rozpočet sám nedokáže pokrýt." # todo: NEW TRANSLATION
 GRE_lng_gateway: "Brána LNG" # todo: NEW TRANSLATION
 GRE_lng_gateway_desc: "Řecko se etablovalo jako hlavní evropské místo pro vykládku zkapalněného zemního plynu a dodává regionálním partnerům energii nezávislou na potrubních dodávkách." # todo: NEW TRANSLATION
 GRE_balkan_advocate: "Zastánce vstupu Balkánu do EU" # todo: NEW TRANSLATION
 GRE_balkan_advocate_desc: "Jako přední zastánce přistoupení západního Balkánu k EU uplatňuje Řecko rostoucí měkkou moc vůči svým severním sousedům." # todo: NEW TRANSLATION
 GRE_imec_terminus: "Evropský konec IMEC" # todo: NEW TRANSLATION
 GRE_imec_terminus_desc: "Určení Pirea jako evropského koncového bodu Ekonomického koridoru Indie–Blízký východ–Evropa přináší značné tranzitní příjmy a investice do infrastruktury." # todo: NEW TRANSLATION
 GRE_regional_pillar: "Pilíř jihovýchodní Evropy" # todo: NEW TRANSLATION
 GRE_regional_pillar_desc: "Řecko si zajistilo roli nepostradatelného centra jihovýchodního evropského sousedství a promítá vliv prostřednictvím energetických, obchodních a diplomatických kanálů." # todo: NEW TRANSLATION
 GRE_epirus_cultural_ties: "Kulturní vazby v Epiru" # todo: NEW TRANSLATION
 GRE_epirus_cultural_ties_desc: "Formální rámec menšinových práv s Tiranou stabilizoval řecky mluvící komunity v jižní Albánii a proměnil dlouhodobý zdroj napětí v tichou diplomatickou výhodu." # todo: NEW TRANSLATION
 GRE_italo_hellenic_axis: "Italsko-řecká osa" # todo: NEW TRANSLATION
 GRE_italo_hellenic_axis_desc: "Koordinovaná průmyslová politika a společné programy loděnic s Římem vtáhly Atény a Apeninský poloostrov do jednotného středomořského ekonomického prostoru." # todo: NEW TRANSLATION
 GRE_balkan_gas_transit: "Přeprava plynu přes Balkán" # todo: NEW TRANSLATION
 GRE_balkan_gas_transit_desc: "Rozšíření plynovodu IGB vede kaspický a východostředomořský plyn přes řecké území do širšího Balkánu a vytváří trvalé tranzitní příjmy." # todo: NEW TRANSLATION
 GRE_gulf_capital_inflow: "Příliv kapitálu z Perského zálivu" # todo: NEW TRANSLATION
 GRE_gulf_capital_inflow_desc: "Státní investiční fondy z Arabského poloostrova vstoupily do řeckého průmyslu a logistiky a urychlily tvorbu kapitálu v celé ekonomice." # todo: NEW TRANSLATION
 GRE_eez_delimitation: "Dohoda o vymezení výlučné ekonomické zóny" # todo: NEW TRANSLATION
 GRE_eez_delimitation_desc: "Bilaterální dohoda o výlučné ekonomické zóně s Káhirou poskytuje řeckým lodím jasné trasy ve východním Středomoří a právní rámec proti konkurenčním námořním nárokům." # todo: NEW TRANSLATION
 greece.1.t: "Rozhořčení kvůli novým úsporným politikám" # todo: NEW TRANSLATION
 greece.1.d: "Dnes řecká vláda zavedla nová úsporná opatření v souladu s balíčkem EU na záchranu zadluženosti. Následovalo rozhořčení veřejnosti, nesoucí nápisy jako „Úspory jsou proti Řecku.“ Tyto nepokoje jen zhoršují situaci Řecka a lze předpokládat, že jde jen o špičku ledovce." # todo: NEW TRANSLATION
 greece.1.a: "Mám z toho špatný pocit..." # todo: NEW TRANSLATION
 greece.2.t: "Výtržnosti na ulicích!" # todo: NEW TRANSLATION
 greece.2.d: "Dnes protesty v Aténách se změnily v násilí poté, co policie se pokusila zvládnout stále se zvětšující dav. Použito slzný plyn a gumové projektily, aby zastavili dav před dalším ničením; dav nakonec ustoupil, napětí však zůstává ve vzduchu." # todo: NEW TRANSLATION
 greece.2.a: "Oni to začali!" # todo: NEW TRANSLATION
 greece.3.t: "Napětí se zhoršuje" # todo: NEW TRANSLATION
 greece.3.d: "Dav se zvětšuje a projevuje stále větší nespokojenost. Není pochyb o tom, že situace se jen zhoršila." # todo: NEW TRANSLATION
 greece.3.a: "Jak se to mohlo stát?" # todo: NEW TRANSLATION
 greece.4.t: "Golden Dawn vyzývá k volbám v Řecku" # todo: NEW TRANSLATION
 greece.4.d: "Po rostoucí podpoře vysoce pravicové strany Golden Dawn požádala vládu o uspořádání voleb - požadavek, který řecká vláda souhlasila kvůli vysoké podpoře ze strany lidí i tlaku uvnitř vlády. Strana Golden Dawn se očekává, že vyhraje, protože má vysokou podporu, a vyhrožovala, že pokud vláda nepřipustí její vítězství, strana spolu se svými podporovateli podnikne proti vládě odvetu." # todo: NEW TRANSLATION
 greece.4.a: "Nové ráno pro Řecko" # todo: NEW TRANSLATION
 greece.4.b: "Zajímavé" # todo: NEW TRANSLATION
 greece.5.t: "KKE vyzývá k volbám v Řecku" # todo: NEW TRANSLATION
 greece.5.d: "Po získání většinové podpory dělnické třídy Řecka a několika politických osobností vyzvala KKE (Komunistická strana Řecka) vládu k uspořádání voleb, což řecká vláda souhlasila vzhledem k masivní podpoře a tlaku ze strany různých politiků. Očekává se, že KKE vyhraje volby, protože má širokou podporu mezi většinou populace; mluvčí strany uvedl, že pokud nebudou moci uspořádat volby, pracující třídu vyvolá povstání, aby svrhla vládu." # todo: NEW TRANSLATION
 greece.5.a: "Dělníci Řecka, vaše osvobození přijde" # todo: NEW TRANSLATION
 greece.5.b: "Zajímavé" # todo: NEW TRANSLATION
 greece.6.t: "Řecko se posouvá doprava" # todo: NEW TRANSLATION
 greece.6.d: "Po politickém napětí, migrační a ekonomické krizi se obyvatelé Řecka unavili z demokratických vlád a podpořili krajní pravici stranu Golden Dawn. Strana Golden Dawn je proti vládním ekonomickým politikám, je silně proti levici a proti imigraci a slíbil, že Řecku vymaže všechny problémy řecké společnosti." # todo: NEW TRANSLATION
 greece.6.a: "Řecko se znovu vztyčí" # todo: NEW TRANSLATION
 greece.6.b: "Zajímavé" # todo: NEW TRANSLATION
 greece.7.t: "Řecko se posouvá doleva" # todo: NEW TRANSLATION
 greece.7.d: "Po tvrdých ekonomických politikách provedených nedávnou řeckou vládou se nezaměstnanost zvýšila a řecká dělnická třída požaduje kroky proti řecké vládě. Dělnická třída se shromáždila za stranu KKE (Komunistická strana Řecka). KKE je proti nezaměstnanosti a porušování pracovních práv, zatímco podporuje anti-západní politiky a organizuje neustálé výtržnosti složené z dělníků, aby vyvíjely tlak na vládu." # todo: NEW TRANSLATION
 greece.7.a: "Dělníci Řecka, vaše osvobození je blízko" # todo: NEW TRANSLATION
 greece.7.b: "Zajímavé" # todo: NEW TRANSLATION
 greece.12.t: "Alexis Tsipras se stává vůdcem SYRIZA" # todo: NEW TRANSLATION
 greece.12.d: "Dne 10. srpna 2008 zvolila levicová strana SYRIZA 33letého Alexise Tsiprase svého vůdcem strany, což ho učinilo jedním z nejmladších vůdců politických stran v řecké historii." # todo: NEW TRANSLATION
 greece.12.a: "Gratulace" # todo: NEW TRANSLATION
 greece.13.t: "Návrhy výtržností na Severním Kypru" # todo: NEW TRANSLATION
 greece.13.d: "Ozbrojené nepokoje propukly po celém severním Kypru proti řecké agendě usilující o sjednocení Kypru. Povstání bylo zřejmě zinscenované tureckými úřady; jejich nevraživost však nepochybně zhoršila, jak nás vnímají." # todo: NEW TRANSLATION
 greece.13.a: "Hrůza!" # todo: NEW TRANSLATION
 greece.14.t: "Odbory nabízejí podporu" # todo: NEW TRANSLATION
 greece.14.d: "Náš nedávný útok na ústavu nám přinesl značnou politickou opozici. Odbory nám nabídly podporu výměnou za větší moc. Máme skutečně na výběr?" # todo: NEW TRANSLATION
 greece.14.a: "Nemáme na výběr." # todo: NEW TRANSLATION
 greece.15.t: "Odbory žádají ještě více ústupků" # todo: NEW TRANSLATION
 greece.15.d: "Odbory nás navštíví znovu; tentokrát však nenabízejí podporu, ale hrozí, že nám ji odeberou, pokud jim nedáme ještě větší moc." # todo: NEW TRANSLATION
 greece.15.a: "Svině!" # todo: NEW TRANSLATION
 greece.16.t: "Základna v troskách" # todo: NEW TRANSLATION
 greece.16.d: "Stále těžší je spát každou noc, jak se země hroutí na kousky. Nejsevernější města zažívají organizované útoky, které si vyžádaly stovky obětí na obou stranách. Nezvládneme je déle držet touto silou.\n\n §RAttempting to contain them in the North is pointless. We should concentrate our troops to defend Athens and the surrounding areas. I'll see you on the frontline§!" # todo: NEW TRANSLATION
 greece.16.a: "Chci sem hned generály!" # todo: NEW TRANSLATION
 greece.17.t: "Čas vypršel!" # todo: NEW TRANSLATION
 greece.17.d: "Naše předpovědi nebyly špatné: severní povstalci se zformovali do armády; nicméně se nezdá, že by byli tak agresivní, jak jsme si původně mysleli, že budou... Počkáme. Ano. Ano. Jste si jistí? ... Do prdele." # todo: NEW TRANSLATION
 greece.17.a: "Zdá se, že napříč našimi liniemi probíhá několik pokusů o prolomení." # todo: NEW TRANSLATION
 greece.18.t: "Řecko vydraží Pireus" # todo: NEW TRANSLATION
 greece.18.d: "Přístav Pireus byl nedávno vydražen řeckou vládou ve snaze získat prostředky pro dluhovou krizi. Bylo by to více než vhodné opatření přidat Pireus do naší sbírky, a zároveň by to otevřelo dveře pro další projekty uvnitř Řecka i v Evropě, čímž bychom rozšířili náš vliv v regionu." # todo: NEW TRANSLATION
 greece.18.a: "Podávejte nejvyšší nabídku." # todo: NEW TRANSLATION
 greece.18.b: "Náš nezájem o takový projekt se nedá vyjádřit slovy." # todo: NEW TRANSLATION
 greece.19.t: "Čína podala nabídku na Pireus" # todo: NEW TRANSLATION
 greece.19.d: "Číňané projevili zájem o Port Pireus a následně podali značnou nabídku za výhradní práva k přístavu, čímž vyhráli aukci. Co s přístavem Čína udělá v budoucnu, je na ní; nicméně my máme také možnost Čínu zabránit v rozšiřování přístavu nebo zahájení dalších projektů, pokud to považujeme za nebezpečné." # todo: NEW TRANSLATION
 greece.19.a: "Dohoda s ďáblem." # todo: NEW TRANSLATION
 greece.20.t: "Čína nemá zájem o Pireus" # todo: NEW TRANSLATION
 greece.20.d: "Navzdory našim nejlepším snahám čínská vláda náš návrh odmítla bez sebemenšího zaváhání." # todo: NEW TRANSLATION
 greece.20.a: "Ať už k lepšímu či horšímu, nemohu to říct." # todo: NEW TRANSLATION
 greece.22.t: "Napětí kvůli úsporným opatřením mizí" # todo: NEW TRANSLATION
 greece.22.d: "Obvykle klidný den pro Řecko, protože protivládní protesty se momentálně zdají ustupovat. Snad je to jen únava z neustálých protestů, možná je to něco jiného." # todo: NEW TRANSLATION
 greece.22.a: "Chvála Bohu." # todo: NEW TRANSLATION
 greece.23.t: "Enosis konečně!" # todo: NEW TRANSLATION
 greece.23.d: "Po desetiletích nepokojů, odloučení a obav ohledně rodinných pout a spojení, Enosis konference vyplatily.\n\nŘečtí Kyprané slaví na ulicích, turečtí Kyprané byli dostatečně uklidněni a Britové se zdají být poměrně spokojeni s dohodami, na jejichž základě jsme se dohodli.\n\nZbývá však jedna otázka... co s Akrotiri a Dhekelia?" # todo: NEW TRANSLATION
 greece.23.a: "Požadovat plnou kontrolu" # todo: NEW TRANSLATION
 greece.23.b: "Povolit RAF udržovat základny" # todo: NEW TRANSLATION
 greece.24.t: "Řecká vláda chce zpět Akrotiri!" # todo: NEW TRANSLATION
 greece.24.d: "Po dosažení cílů Enosis přišla řecká vláda s žádostí o navrácení základny Akrotiri a Dhekelia... měli bychom je nechat vrátit pod řeckou správu?" # todo: NEW TRANSLATION
 greece.24.a: "Bylo by špatné to neudělat!" # todo: NEW TRANSLATION
 greece.24.b: "Ani náhodou!" # todo: NEW TRANSLATION
 greece.25.t: "Řecká vláda nám umožňuje zůstat na Kypru!" # todo: NEW TRANSLATION
 greece.25.d: "Po dosažení svých cílů Enosis si řecká vláda uvědomila, že návrat Akrotiri a Dhekelia by byl pro všechny nevýhodný; naštěstí nebudeme muset stěhovat naše vojsko z této země." # todo: NEW TRANSLATION
 greece.25.a: "Dobře tedy!" # todo: NEW TRANSLATION
 greece.500.t: "Smrt Stephena Saunderse" # todo: NEW TRANSLATION
 greece.500.d: "Britský obranný atašé Stephen Saunders byl v Aténách zavražděn teroristickou organizací 17. listopad. Drzý útok vyvolal mezinárodní odsouzení a vyvinul obrovský tlak na řecké bezpečnostní služby, aby skupinu rozložily." # todo: NEW TRANSLATION
 greece.500.a: "Tvrdě zakročit proti domácímu terorismu" # todo: NEW TRANSLATION
 greece.500.b: "Spolupracovat s mezinárodními zpravodajskými službami" # todo: NEW TRANSLATION
 greece.501.t: "Proces s revoluční organizací" # todo: NEW TRANSLATION
 greece.501.d: "Zajatí členové organizace 17. listopad stanuli před soudem v Aténách. Po desetiletích unikání spravedlnosti čelí vedení skupiny stíhání za sérii atentátů a bombových útoků. Proces představuje přelomový okamžik pro řecký boj proti terorismu." # todo: NEW TRANSLATION
 greece.501.a: "Udělit přísné tresty" # todo: NEW TRANSLATION
 greece.501.b: "Využít příležitost k reformě bezpečnostních služeb" # todo: NEW TRANSLATION
 greece.502.t: "Protesty proti válce proti terorismu" # todo: NEW TRANSLATION
 greece.502.d: "Po celém Řecku vypukly masivní protiválečné protesty v reakci na invazi do Iráku. Desítky tisíc lidí vyšly do ulic Atén a Soluně, což odráží hluboký odpor veřejnosti k tažení vedenému Spojenými státy." # todo: NEW TRANSLATION
 greece.502.a: "Povolit pokojné demonstrace" # todo: NEW TRANSLATION
 greece.502.b: "Omezit protesty kvůli zachování pořádku" # todo: NEW TRANSLATION
 greece.503.t: "Havárie letu 522 společnosti Helios Airways" # todo: NEW TRANSLATION
 greece.503.d: "Let 522 společnosti Helios Airways se po letu na autopilota jako let duchů zřítil poblíž Grammatika a zahynulo všech 121 cestujících a členů posádky. Tragédie způsobená selháním přetlakování kabiny vyvolala vážné otázky ohledně dohledu nad bezpečností letectví v Řecku." # todo: NEW TRANSLATION
 greece.503.a: "Zahájit reformy bezpečnosti letectví" # todo: NEW TRANSLATION
 greece.503.b: "Vyhlásit den státního smutku" # todo: NEW TRANSLATION
 greece.504.t: "Kurdské protesty v Aténách" # todo: NEW TRANSLATION
 greece.504.d: "Členové kurdské diaspory v Aténách zorganizovali velké demonstrace na podporu kurdských práv. Protesty přitáhly pozornost Ankary, která pohlíží na jakoukoli podporu kurdského aktivismu v zahraničí s podezřením." # todo: NEW TRANSLATION
 greece.504.a: "Povolit pokračování protestů" # todo: NEW TRANSLATION
 greece.504.b: "Rozehnat davy" # todo: NEW TRANSLATION
 greece.505.t: "Protesty kvůli krizi v Gaze" # todo: NEW TRANSLATION
 greece.505.d: "Po řeckých městech vypukly propalestinské demonstrace v reakci na vyostřující se krizi v Gaze. Demonstranti vyzývají vládu k rozhodnějšímu postoji proti vojenským operacím a k poskytnutí humanitární pomoci." # todo: NEW TRANSLATION
 greece.505.a: "Vyjádřit solidaritu s demonstranty" # todo: NEW TRANSLATION
 greece.505.b: "Vyzvat ke zdrženlivosti a diplomatickým řešením" # todo: NEW TRANSLATION
 greece.506.t: "Řecké lesní požáry roku 2007" # todo: NEW TRANSLATION
 greece.506.d: "Zničující lesní požáry zachvátily Peloponés a Euboiu, zabily desítky lidí a zničily celé vesnice. Požáry odhalily zásadní slabiny řeckých kapacit pro zvládání katastrof a vyvolaly veřejný hněv nad postupem vlády." # todo: NEW TRANSLATION
 greece.506.a: "Mobilizovat krizové zdroje" # todo: NEW TRANSLATION
 greece.506.b: "Požádat o mezinárodní pomoc" # todo: NEW TRANSLATION
 greece.507.t: "Smrt Alexandrose Grigoropoulose" # todo: NEW TRANSLATION
 greece.507.d: "Patnáctiletý Alexandros Grigoropoulos byl v aténské čtvrti Exarchia zastřelen policistou. Střelba vyvolala nejhorší nepokoje, jaké Řecko zažilo za několik desetiletí, a rozsáhlé ničení ve velkých městech." # todo: NEW TRANSLATION
 greece.507.a: "Stíhat odpovědné policisty" # todo: NEW TRANSLATION
 greece.507.b: "Nasadit pořádkovou policii k obnovení pořádku" # todo: NEW TRANSLATION
 greece.508.t: "Řecké lesní požáry roku 2009" # todo: NEW TRANSLATION
 greece.508.d: "Řecko zasáhla další ničivá sezóna lesních požárů, která zpustošila lesy a ohrozila sídla v Attice a na východním Peloponésu. Navzdory zkušenostem z roku 2007 zůstává hasičská infrastruktura země přetížená." # todo: NEW TRANSLATION
 greece.508.a: "Investovat do infrastruktury prevence požárů" # todo: NEW TRANSLATION
 greece.508.b: "Zaměřit pomoc na postižené komunity" # todo: NEW TRANSLATION
 greece.509.t: "Zlatý úsvit vstupuje do parlamentu" # todo: NEW TRANSLATION
 greece.509.d: "Krajně pravicová strana Zlatý úsvit poprvé získala parlamentní křesla a využila veřejného hněvu kvůli úsporným opatřením a hospodářské krizi. Její otevřeně nacionalistická a násilná rétorika znepokojila demokratické instituce v celé Evropě." # todo: NEW TRANSLATION
 greece.509.a: "Pečlivě sledovat jejich činnost" # todo: NEW TRANSLATION
 greece.509.b: "Ignorovat je jako okrajové hnutí" # todo: NEW TRANSLATION
 greece.510.t: "Vzniká strana Řecké řešení" # todo: NEW TRANSLATION
 greece.510.d: "Televizní moderátor Kyriakos Velopoulos založil stranu Řecké řešení a představil ji jako konzervativně-nacionalistickou alternativu. Strana oslovuje voliče rozčarované jak z tradiční pravice, tak z krajně pravicového okraje." # todo: NEW TRANSLATION
 greece.510.a: "Vzít na vědomí novou politickou scénu" # todo: NEW TRANSLATION
 greece.510.b: "Odmítnout je jako populisty" # todo: NEW TRANSLATION
 greece.511.t: "Smrt Pavlose Fyssase" # todo: NEW TRANSLATION
 greece.511.d: "Antifašistický rapper Pavlos Fyssas byl v Keratsini ubodán k smrti členem Zlatého úsvitu. Vražda vyvolala celonárodní pobouření a posílila výzvy, aby vláda rozhodně zasáhla proti násilné síti této strany." # todo: NEW TRANSLATION
 greece.511.a: "Tvrdě zakročit proti Zlatému úsvitu" # todo: NEW TRANSLATION
 greece.511.b: "Vyzvat ke klidu a řádnému procesu" # todo: NEW TRANSLATION
 greece.512.t: "Proces s členy Zlatého úsvitu" # todo: NEW TRANSLATION
 greece.512.d: "Vedení Zlatého úsvitu stojí před soudem v největším trestním řízení proti politické straně v dějinách Evropy. Obvinění zahrnují vedení zločinecké organizace, vraždu a četná napadení zaměřená proti přistěhovalcům a politickým odpůrcům." # todo: NEW TRANSLATION
 greece.512.a: "Usilovat o nejvyšší tresty" # todo: NEW TRANSLATION
 greece.512.b: "Nechat spravedlnost, ať se ubírá svou cestou" # todo: NEW TRANSLATION
 greece.513.t: "Velké zemětřesení v Egejském moři" # todo: NEW TRANSLATION
 greece.513.d: "Silné zemětřesení zasáhlo východní Egejské moře poblíž Lesbu a způsobilo značné škody a oběti. Zasaženo bylo také Turecko, což otevřelo vzácný prostor pro bilaterální spolupráci obou sousedů při záchranných pracích." # todo: NEW TRANSLATION
 greece.513.a: "Zahájit celostátní záchranné úsilí" # todo: NEW TRANSLATION
 greece.513.b: "Spolupracovat s Tureckem na pomoci" # todo: NEW TRANSLATION
 greece.514.t: "Požáry v Attice roku 2018" # todo: NEW TRANSLATION
 greece.514.d: "Katastrofální požáry zachvátily východní Attiku a v přímořském městě Mati usmrtily více než sto lidí. Jde o nejsmrtelnější požární katastrofu v řeckých dějinách, která odhalila systémová selhání v krizovém plánování a civilní ochraně." # todo: NEW TRANSLATION
 greece.514.a: "Kompletně přepracovat systémy civilní ochrany" # todo: NEW TRANSLATION
 greece.514.b: "Poskytnout obětem okamžitou pomoc" # todo: NEW TRANSLATION
 greece.515.t: "Další zemětřesení v okolí Atén" # todo: NEW TRANSLATION
 greece.515.d: "Zemětřesení zasáhlo oblast poblíž Atén, poškodilo budovy a vyvolalo v hlavním městě rozsáhlý poplach. Ačkoli jsou oběti omezené, událost znovu otevřela debatu o seismické odolnosti stárnoucí řecké infrastruktury." # todo: NEW TRANSLATION
 greece.515.a: "Zpřísnit stavební normy" # todo: NEW TRANSLATION
 greece.515.b: "Poskytnout krizovou pomoc" # todo: NEW TRANSLATION
 greece.517.t: "Velké zemětřesení v Egejském moři" # todo: NEW TRANSLATION
 greece.517.d: "Silné zemětřesení zasáhlo východní Egejské moře poblíž Lesbu a způsobilo značné škody a oběti. Zasaženo bylo také Turecko, což otevřelo vzácný prostor pro bilaterální spolupráci obou sousedů při záchranných pracích." # todo: NEW TRANSLATION
 greece.517.a: "Mobilizovat záchranné práce" # todo: NEW TRANSLATION
 greece.518.t: "Požáry v Attice roku 2018" # todo: NEW TRANSLATION
 greece.518.d: "Katastrofální požáry zachvátily východní Attiku a v přímořském městě Mati usmrtily více než sto lidí. Jde o nejsmrtelnější požární katastrofu v řeckých dějinách, která odhalila systémová selhání v krizovém plánování a civilní ochraně." # todo: NEW TRANSLATION
 greece.518.a: "Zahájit krizovou reakci" # todo: NEW TRANSLATION
 greece.519.t: "Další zemětřesení v okolí Atén" # todo: NEW TRANSLATION
 greece.519.d: "Zemětřesení zasáhlo oblast poblíž Atén, poškodilo budovy a vyvolalo v hlavním městě rozsáhlý poplach. Ačkoli jsou oběti omezené, událost znovu otevřela debatu o seismické odolnosti stárnoucí řecké infrastruktury." # todo: NEW TRANSLATION
 greece.519.a: "Koordinovat záchranné služby" # todo: NEW TRANSLATION
 greece.620.t: "Otázka sjednocení" # todo: NEW TRANSLATION
 greece.620.d: "Atény formálně pozvaly Kyperskou republiku k dokončení konfederace a opětovnému sjednocení s řeckým státem. Rozhodnutí spočívá na Nikósii." # todo: NEW TRANSLATION
 greece.620.a: "Připojit se k řecké unii" # todo: NEW TRANSLATION
 greece.620.b: "Zůstat nezávislou republikou" # todo: NEW TRANSLATION
 greece.621.t: "Otázka severu" # todo: NEW TRANSLATION
 greece.621.d: "Řecký návrh se vztahuje i na sever ostrova. Znovusjednocení pod vedením Atén by rozpustilo samostatnou severní správu a začlenilo její území do řeckého státu." # todo: NEW TRANSLATION
 greece.621.a: "Přijmout znovusjednocení" # todo: NEW TRANSLATION
 greece.621.b: "Návrh odmítnout" # todo: NEW TRANSLATION
 greece.630.t: "Prosba z Atén" # todo: NEW TRANSLATION
 greece.630.d: "Řecko požádalo Turecko o pomoc při řešení bytové krize, která zatěžuje jeho města. Spolupráce by ulevila Aténám a znamenala vzácný okamžik dobré vůle mezi oběma sousedy." # todo: NEW TRANSLATION
 greece.630.a: "Poskytnout podporu" # todo: NEW TRANSLATION
 greece.630.b: "Odmítnout zasáhnout" # todo: NEW TRANSLATION
 greece.631.t: "Přichází turecká pomoc" # todo: NEW TRANSLATION
 greece.631.d: "Do Řecka začala proudit turecká pomoc a stavební podpora, což zmírňuje nejhorší nedostatek bytů a zlepšuje vztahy v Egejském moři." # todo: NEW TRANSLATION
 greece.631.a: "Vítaná pomocná ruka" # todo: NEW TRANSLATION
 greece.632.t: "Z Ankary nepřichází žádná pomoc" # todo: NEW TRANSLATION
 greece.632.d: "Turecko odmítlo zasáhnout do řeckých problémů s bydlením. Atény musí krizi zvládnout samy." # todo: NEW TRANSLATION
 greece.632.a: "Spoléháme sami na sebe" # todo: NEW TRANSLATION
 greece.641.t: "Rekordní sezóna" # todo: NEW TRANSLATION
 greece.641.d: "Léto překonalo všechny rekordy v počtu příjezdů. Hotely jsou plné, letiště přetížená a tržby proudí dovnitř. Otázkou je, kdo z neočekávaného zisku těží." # todo: NEW TRANSLATION
 greece.641.a: "Znovu investovat do ostrovů" # todo: NEW TRANSLATION
 greece.641.b: "Nechat si jej provozovateli" # todo: NEW TRANSLATION
 greece.642.t: "Diaspora odpovídá" # todo: NEW TRANSLATION
 greece.642.d: "Výzva Řekům v zahraničí našla odezvu. Z komunit po celém světě proudí investiční přísliby a finanční převody, protože touží vidět svou vlast znovu prosperovat." # todo: NEW TRANSLATION
 greece.642.a: "Založit státní fond diaspory" # todo: NEW TRANSLATION
 greece.642.b: "Kompenzovat převody daňovými úlevami" # todo: NEW TRANSLATION
 greece.643.t: "Brusel otevírá kohoutky" # todo: NEW TRANSLATION
 greece.643.d: "První tranše prostředků na obnovu byla schválena. Na cestě jsou desítky miliard, podmíněné reformami a schopností Řecka peníze skutečně včas utratit." # todo: NEW TRANSLATION
 greece.643.a: "Urychlit projekty" # todo: NEW TRANSLATION
 greece.643.b: "Utrácet opatrně" # todo: NEW TRANSLATION
 greece.650.t: "Doktrína více vektorů" # todo: NEW TRANSLATION
 greece.650.d: "Atény prohlásily, že budou jednat s Východem i Západem za vlastních podmínek. Kabinet diskutuje o tom, jak tuto nezávislost nejlépe proměnit v páku." # todo: NEW TRANSLATION
 greece.650.a: "Diverzifikovat naše energetické a obchodní partnery" # todo: NEW TRANSLATION
 greece.650.b: "Postavit Řecko do role regionálního prostředníka" # todo: NEW TRANSLATION
 greece_military.01.t: "Vznikly Řecké obranné systémy" # todo: NEW TRANSLATION
 greece_military.01.d: "Pyrkal a Řecký zbrojní průmysl byly sloučeny do jediného státem kontrolovaného podniku, Řeckých obranných systémů. Konsolidace má zjednodušit akvizice, standardizovat výrobu a pod jednou správní strukturou obnovit domácí obrannou průmyslovou kapacitu." # todo: NEW TRANSLATION
 greece_military.01.a: "Rodí se národní šampion" # todo: NEW TRANSLATION
 greece_military.02.t: "Řecké námořnictvo zpochybňuje naše vody" # todo: NEW TRANSLATION
 greece_military.02.d: "Řecko dokončilo strategii svých výsostných vod a nyní otevřeně uplatňuje nárok na sporné vody v Egejském moři a kolem Kréty. Jeho námořní expanze představuje přímou výzvu našemu postavení ve východním Středomoří." # todo: NEW TRANSLATION
 greece_military.02.a: "Rozšířit flotilu" # todo: NEW TRANSLATION
 greece_military.02.b: "Podat diplomatický protest" # todo: NEW TRANSLATION
 greece.516.t: "Nacionalistické hnutí získává podporu" # todo: NEW TRANSLATION
 greece.516.d: "Nacionalisté z hnutí ELAM podporovaného Řeckem šíří svůj vliv po našem ostrově. Jejich rétorika volá po sjednocení s Řeckem a nachází příznivý ohlas u části obyvatelstva. Můžeme jejich přítomnost tolerovat, nebo tvrdě zakročit za cenu veřejných nepokojů." # todo: NEW TRANSLATION
 greece.516.a: "Nechat je působit" # todo: NEW TRANSLATION
 greece.516.b: "Potlačit hnutí" # todo: NEW TRANSLATION
 greece_debt.1.t: "Partner pro výměnu dluhu" # todo: NEW TRANSLATION
 greece_debt.1.desc: "Účty stále přicházejí a státní pokladna se stále zmenšuje. Náš ministr financí navrhl vyměnit části našeho dluhu denominovaného v eurech za cizí měny prostřednictvím centrální banky partnerské země. Nový držitel by účtoval úrok, avšak za vyjednatelných sazeb a přátelštějších podmínek, než jaké nabízejí naši současní věřitelé. Partnerem by mohly být Indie, Rusko, Čína nebo ECB, každý z nich však přináší vlastní politickou cenu." # todo: NEW TRANSLATION
 greece_debt.1.a: "Možná rupie" # todo: NEW TRANSLATION
 greece_debt.1.b: "Možná rubl" # todo: NEW TRANSLATION
 greece_debt.1.c: "Juan by mohl být dobrou volbou" # todo: NEW TRANSLATION
 greece_debt.1.e: "Pokračovat v dosavadním kurzu" # todo: NEW TRANSLATION
 GRE_debt_swap_accept_tt: "§GPokud přijmou:§! odkoupí část našeho dluhu a stanou se věřitelem, kterému budeme platit úroky, čímž nyní uleví naší rozvaze výměnou za pravidelné pozdější platby." # todo: NEW TRANSLATION
 GRE_debt_counter_refund_tt: "Protinabídku odmítáme. Kapitál, který potenciální věřitel poskytl, bude v plné výši vrácen." # todo: NEW TRANSLATION
 greece_debt.2.a: "Musíme odmítnout" # todo: NEW TRANSLATION
 greece_debt.2.b: "Převezmeme jejich dluh" # todo: NEW TRANSLATION
 GRE_homelessness_crisis_idea: "Aténská krize bezdomovectví" # todo: NEW TRANSLATION
 GRE_homelessness_crisis_idea_desc: "Aténské zemětřesení připravilo tisíce lidí o domov a donutilo je spát v parcích. Sociální služby jsou přetížené a hlavním městem se šíří stanová městečka. Čím déle budeme čekat, tím horší situace bude." # todo: NEW TRANSLATION
 GRE_the_drachma_idea: "Drachma" # todo: NEW TRANSLATION
 GRE_the_drachma_idea_desc: "Provoz mimo eurozónu znamená, že drachmu spravujeme sami. Nestabilita měny a vyšší náklady na půjčky zatěžují ekonomiku, ale slabší drachma udržuje řecký vývoz konkurenceschopný a zvyšuje příjmy na mezinárodních trzích." # todo: NEW TRANSLATION
 GRE_solving_tax_evasion_idea: "Řešení daňových mezer" # todo: NEW TRANSLATION
 GRE_solving_tax_evasion_idea_desc: "Odstranění daňových mezer nám umožní odstranit nedostatky, bude však vyžadovat velké množství komisí a nové posouzení našeho daňového systému." # todo: NEW TRANSLATION
 GRE_tax_evasion_idea: "Neomezené daňové úniky" # todo: NEW TRANSLATION
 GRE_tax_evasion_idea_desc: "Daňové úniky jsou hluboce zakořeněny v řeckém fiskálním životě a odčerpávají příjmy vlády. Bez prostředků na financování základních služeb a reforem je stát ochromen." # todo: NEW TRANSLATION
 GRE_bonds_issued_idea: "Krátkodobé dluhopisy s vysokým úrokem" # todo: NEW TRANSLATION
 GRE_bonds_issued_idea_desc: "Vydali jsme krátkodobé dluhopisy s vysokými úrokovými sazbami. Příliv hotovosti je nyní užitečný, ale vysoké výnosy budou zátěží až do splatnosti dluhu." # todo: NEW TRANSLATION
