 GRE_eastern_vars_initialized: "Větev východního bratrství inicializována" # todo: NEW TRANSLATION
 GRE_migration_deal_active: "Spolupráce s Tureckem v oblasti migrace je aktivní" # todo: NEW TRANSLATION
 GRE_assertive_patrols: "Režim asertivních hlídek v Egejském moři je aktivní" # todo: NEW TRANSLATION
 GRE_lost_continental_shelf_claims: "Územní nároky na kontinentální šelf postoupeny Turecku" # todo: NEW TRANSLATION
 GRE_aegean_de_escalation: "Ustoupení před tureckým ultimátem" # todo: NEW TRANSLATION
 GRE_confederation_active: "Řetězec rozhodnutí o konfederaci je aktivní" # todo: NEW TRANSLATION
 GRE_confederation_autonomy_done: "Dohodnuta struktura autonomie konfederace" # todo: NEW TRANSLATION
 GRE_confederation_economy_done: "Dohodnuto hospodářské rozdělení konfederace" # todo: NEW TRANSLATION
 GRE_confederation_security_done: "Dohodnut bezpečnostní rámec konfederace" # todo: NEW TRANSLATION
 GRE_defending_sovereignty: "Obrana řecké suverenity" # todo: NEW TRANSLATION
 GRE_defending_sovereignty_desc: "Trvalý postoj vojenské připravenosti zaměřený na odrazení tureckého pronikání do Egejského moře a na Kypr. Řecké námořnictvo a letectvo udržují zvýšenou ostražitost a výdaje na obranu spotřebovávají zdroje, které by jinak mohly být využity na spotřební zboží. Toto cílené odstrašení posiluje řecké odhodlání, zároveň však přináší hospodářské náklady." # todo: NEW TRANSLATION
 GRE_aegean_naval_supremacy: "Námořní nadvláda v Egejském moři" # todo: NEW TRANSLATION
 GRE_aegean_naval_supremacy_desc: "Předsunuté hlídky a stálá přítomnost hladinových plavidel dávají řeckému námořnictvu převahu ve sporných vodách Egejského moře." # todo: NEW TRANSLATION
 GRE_migration_cooperation_idea: "Migrační pakt EU–Turecko" # todo: NEW TRANSLATION
 GRE_migration_cooperation_idea_desc: "Turecko zpracovává migrační toky na vlastním území výměnou za ústupky Řecka a EU, čímž zmírňuje tlak na egejské ostrovy." # todo: NEW TRANSLATION
 GRE_migration_crisis_idea: "Migrační krize" # todo: NEW TRANSLATION
 GRE_migration_crisis_idea_desc: "Turecko odstoupilo od migračního paktu, což přináší nové vlny příchozích přes Egejské moře a zahlcuje řecká přijímací zařízení." # todo: NEW TRANSLATION
 GRE_confederation_category: "Kyperská konfederace" # todo: NEW TRANSLATION
 GRE_confederation_category_desc: "Vyřešit strukturální otázky navrhované kyperské konfederace: autonomii, hospodářské rozdělení a bezpečnost." # todo: NEW TRANSLATION
 GRE_eastern_missions_category: "Mise východního bratrství" # todo: NEW TRANSLATION
 GRE_eastern_missions_category_desc: "Opakující se politické výzvy vyplývající z otázek Egejského moře a Kypru." # todo: NEW TRANSLATION
 GRE_decide_autonomy_level: "Rozhodnout o autonomii konfederace" # todo: NEW TRANSLATION
 GRE_decide_autonomy_level_desc: "Rozhodnout, zda nový stát přijme federální model se silnými ústředními institucemi, nebo volnější konfederaci poskytující každé komunitě širokou samosprávu." # todo: NEW TRANSLATION
 GRE_decide_economic_distribution: "Rozhodnout o hospodářském rozdělení" # todo: NEW TRANSLATION
 GRE_decide_economic_distribution_desc: "Rozhodnout, zda bude federální rozpočet mezi obě komunity rozdělován paritně, nebo podle podílu na HDP." # todo: NEW TRANSLATION
 GRE_decide_security_guarantees: "Rozhodnout o bezpečnostních zárukách" # todo: NEW TRANSLATION
 GRE_decide_security_guarantees_desc: "Rozhodnout, zda sjednocený stát spadne pod bezpečnostní deštník NATO, nebo zaujme neutrální obranný postoj." # todo: NEW TRANSLATION
 GRE_aegean_dialogue_mission: "Dialog o Egejském moři" # todo: NEW TRANSLATION
 GRE_aegean_dialogue_mission_desc: "Každých šest měsíců musí řečtí a turečtí vyjednavači rozhodnout, jak důrazně prosazovat své nároky. Mise končí, pokud dialog přeroste v otevřenou konfrontaci nebo válku." # todo: NEW TRANSLATION
 greece.700.t: "Dialog o Egejském moři: Pololetní přezkum" # todo: NEW TRANSLATION
 greece.700.d: "Nejnovější kolo jednání dospělo ke známému rozcestí. Turečtí protějšci tlačí na částečné řecké ústupky ohledně kontinentálního šelfu výměnou za další deeskalaci. Pevný postoj zachová naše nároky, trpělivost však bude slábnout." # todo: NEW TRANSLATION
 greece.700.a: "Nabídnout umírněné ústupky" # todo: NEW TRANSLATION
 greece.700.b: "Držet linii" # todo: NEW TRANSLATION
 greece.701.t: "Ankara opouští migrační pakt" # todo: NEW TRANSLATION
 greece.701.d: "Turecké úřady s odvoláním na řecký diplomatický postoj pozastavily spolupráci při navracení a zpracování migrantů. Na egejských ostrovech jsou již hlášeni noví příchozí; přijímací centra během několika týdnů čelí krizi." # todo: NEW TRANSLATION
 greece.701.a: "Připravit se na příliv" # todo: NEW TRANSLATION
 greece.702.t: "Incident v Egejském moři" # todo: NEW TRANSLATION
 greece.702.d: "Turecká hlídka přes noc vstoupila do vzdušného prostoru, na nějž si činí nárok Řecko. Zasáhly řecké stíhačky. Výstřely nepadly, vzdálenosti při přiblížení však byly nebezpečně malé. Nyní musíme rozhodnout, zda situaci uklidnit, nebo zatlačit tvrději." # todo: NEW TRANSLATION
 greece.702.a: "Deeskalovat" # todo: NEW TRANSLATION
 greece.702.b: "Stupňovat reakci" # todo: NEW TRANSLATION
 greece.703.t: "Ankara posiluje Severní Kypr" # todo: NEW TRANSLATION
 greece.703.d: "Turecká státní média potvrdila rozšířenou podporu správě Severního Kypru. Tento krok působí spíše promyšleně než provokativně a signalizuje, že Athény nemohou prosazovat kyperskou otázku podle vlastních představ." # todo: NEW TRANSLATION
 greece.703.a: "Zaznamenat pro protokol" # todo: NEW TRANSLATION
 greece.704.t: "Plynová krize ve východním Středomoří" # todo: NEW TRANSLATION
 greece.704.d: "Turecká vrtná plavidla vstoupila do vod, které Řecko a Kypr považují za výlučnou ekonomickou zónu. Athény musí rozhodnout, zda pat uklidnit, nebo hájit své pozice s rizikem širší konfrontace." # todo: NEW TRANSLATION
 greece.704.a: "Prozatím ustoupit" # todo: NEW TRANSLATION
 greece.704.b: "Držet pozice" # todo: NEW TRANSLATION
 greece.705.t: "Turecké ultimátum" # todo: NEW TRANSLATION
 greece.705.d: "Ankara vydala důrazné varování: pokračující řecké kroky ohledně Kypru se setkají s nespecifikovanými, avšak hmatatelnými následky. Ministerstvo zahraničí musí odpovědět." # todo: NEW TRANSLATION
 greece.705.a: "Ustoupit od propasti" # todo: NEW TRANSLATION
 greece.705.b: "Nenechat se zastrašit" # todo: NEW TRANSLATION
 greece.706.t: "Rutinní incident ve vzdušném prostoru" # todo: NEW TRANSLATION
 greece.706.d: "Další turecký přelet byl zaznamenán a obvyklými kanály proti němu bylo protestováno. Vzorec pokračuje; žádná strana nechce eskalaci, žádná však není ochotna ustoupit." # todo: NEW TRANSLATION
 greece.706.a: "Podat protest" # todo: NEW TRANSLATION
 greece.710.t: "Konfederace: Otázka autonomie" # todo: NEW TRANSLATION
 greece.710.d: "Vyjednavači předložili dva modely: federální uspořádání se silnými ústředními institucemi, nebo konfederaci, která přenechává většinu pravomocí komunitám. Tato volba určí charakter nového státu." # todo: NEW TRANSLATION
 greece.710.a: "Federální model" # todo: NEW TRANSLATION
 greece.710.b: "Konfederální model" # todo: NEW TRANSLATION
 greece.711.t: "Konfederace: Hospodářské rozdělení" # todo: NEW TRANSLATION
 greece.711.d: "Jak budou rozdělovány federální příjmy? Přísná parita uklidní menší komunitu, vzorec vážený podle HDP však odráží hospodářskou realitu a bude se snáze obhajovat doma." # todo: NEW TRANSLATION
 greece.711.a: "Paritní rozdělení" # todo: NEW TRANSLATION
 greece.711.b: "Rozdělení vážené podle HDP" # todo: NEW TRANSLATION
 greece.712.t: "Konfederace: Bezpečnostní rámec" # todo: NEW TRANSLATION
 greece.712.d: "Spadne sjednocený stát pod deštník NATO, nebo přijme neutrální obranný postoj? Každá cesta má v Athénách i Nikósii své zastánce." # todo: NEW TRANSLATION
 greece.712.a: "Bezpečnostní deštník NATO" # todo: NEW TRANSLATION
 greece.712.b: "Neutrální obranný postoj" # todo: NEW TRANSLATION
 greece.720.t: "Požadavky na sjednocení Kypru" # todo: NEW TRANSLATION
 greece.720.d: "Po měsících diplomatického manévrování a tlaku na Turecko jsou Athény připraveny vznést formální požadavky na sjednocení Kypru a Severního Kypru s Řeckem. Řecko získalo dostatečnou podporu mezi řeckými Kypřany a pokud Turecko pod mezinárodním tlakem ustoupilo, lze přesvědčit i vedení Severního Kypru. Okamžik pravdy je zde." # todo: NEW TRANSLATION
 greece.720.a: "Vznést požadavky" # todo: NEW TRANSLATION
 greece.721.t: "Válka se vrací na Kypr" # todo: NEW TRANSLATION
 greece.721.d: "Jedna nebo obě kyperské vlády odmítly řecké požadavky na sjednocení a vojenský konflikt je bezprostřední. Ankara vydala rozhořčená odsouzení a varování. Turecká armáda zůstává připravena, dosud se však přímo nezavázala k intervenci. Mezinárodní společenství napjatě sleduje, zda Athény nasadí vlastní ozbrojené síly, nebo budou pokračovat v tajné podpoře." # todo: NEW TRANSLATION
 greece.721.a: "Zaznamenat reakci" # todo: NEW TRANSLATION
 greece.722.t: "Jak daleko Athény zajdou? (Kypr)" # todo: NEW TRANSLATION
 greece.722.d: "Kyperská republika odmítla požadavek na sjednocení a vojenský konflikt je bezprostřední. Můžeme ze stínů vyzbrojovat a zásobovat síly řeckých Kypřanů podporující sjednocení pomocí dobrovolníků a materiálu, nebo otevřeně nasadit řecké ozbrojené síly k vynucení anexe. První možnost udrží Řecko v přízni NATO. Druhá vyšle řecké vojáky do boje, vyžaduje vystoupení z aliance a může vyvolat přímou tureckou intervenci. Zároveň však zaručuje rychlé dobytí a začlenění jižní části ostrova." # todo: NEW TRANSLATION
 greece.722.a: "Pouze dobrovolníci a materiál" # todo: NEW TRANSLATION
 greece.722.b: "Nasadit řecké ozbrojené síly; vyhlásit válku Kypru" # todo: NEW TRANSLATION
 greece.730.t: "Tlak NATO na Turecko" # todo: NEW TRANSLATION
 greece.730.d: "Athény oslovují spojence v NATO s žádostí, aby diplomatickými kanály přesvědčil Turecko ke zmírnění agresivního postoje v Egejském moři. Takový tlak západní mocnosti by mohl Ankaru přimět k přehodnocení jejího postoje." # todo: NEW TRANSLATION
 greece.730.a: "Stát při Athénách" # todo: NEW TRANSLATION
 greece.730.b: "To není náš spor" # todo: NEW TRANSLATION
 greece.731.t: "Podpora spojenců zajištěna" # todo: NEW TRANSLATION
 greece.731.d: "Náš partner v NATO souhlasil, že bude s Ankarou jednat o napětí v Egejském moři. Diplomatická podpora Západu by měla pomoci zmírnit patovou situaci a potvrdit oprávněnost našeho asertivního postoje." # todo: NEW TRANSLATION
 greece.731.a: "Diplomatické vítězství" # todo: NEW TRANSLATION
 greece.732.t: "Naše žádost odmítnuta" # todo: NEW TRANSLATION
 greece.732.d: "Spojenec v NATO zdvořile odmítl vstoupit do přímých rozhovorů s Tureckem o sporech v Egejském moři. Dává přednost neutralitě v dvoustranných námořních otázkách." # todo: NEW TRANSLATION
 greece.732.a: "Zůstáváme odhodlaní" # todo: NEW TRANSLATION
 greece.733.t: "Navržena hospodářská integrace Kypru" # todo: NEW TRANSLATION
 greece.733.d: "Athény navrhují hlubokou hospodářskou integraci s Kyperskou republikou, včetně celní unie, harmonizace bankovnictví a koordinované energetické politiky. Takové vazby by ostrov těsně spojily s řeckou ekonomikou a zároveň zvýšily životní úroveň v Nikósii." # todo: NEW TRANSLATION
 greece.733.a: "Integrovat se s Řeckem" # todo: NEW TRANSLATION
 greece.733.b: "Zachovat naši autonomii" # todo: NEW TRANSLATION
 greece.734.t: "Kypr přijímá integraci" # todo: NEW TRANSLATION
 greece.734.d: "Nikósie návrh přijala. Řecké a kyperské podniky nyní harmonizují předpisy, bankovní systémy se konsolidují a přes Egejské moře proudí společné investice. Hospodářská unie posiluje pozici Athén v jakémkoli budoucím politickém urovnání." # todo: NEW TRANSLATION
 greece.734.a: "Jednota přináší prosperitu" # todo: NEW TRANSLATION
 greece.735.t: "Kypr odmítá hlubší integraci" # todo: NEW TRANSLATION
 greece.735.d: "Nikósie nabídku hlubší hospodářské integrace s úctou odmítla. Kyperská republika si prozatím přeje zachovat nezávislost v hospodářských otázkách, i za cenu pomalejšího růstu." # todo: NEW TRANSLATION
 greece.735.a: "Zůstáváme odhodlaní" # todo: NEW TRANSLATION
 greece.736.t: "Navržen rozvoj plynu ve východním Středomoří" # todo: NEW TRANSLATION
 greece.736.d: "Athény navrhují společný rozvoj pobřežních ložisek zemního plynu ve vodách jižně od Kypru a východně od Kréty. Společný těžební program by podpořil obě ekonomiky a přinesl dlouhodobé energetické příjmy." # todo: NEW TRANSLATION
 greece.736.a: "Rozvíjet ložiska společně" # todo: NEW TRANSLATION
 greece.736.b: "Prozatím příliš provokativní" # todo: NEW TRANSLATION
 greece.737.t: "Kyperská plynová ložiska zahajují provoz" # todo: NEW TRANSLATION
 greece.737.d: "Řecké a kyperské vrtné plošiny zahájily těžbu zemního plynu ze společných ložisek. Do provozu vstupují nové rafinerské kapacity a obě ekonomiky těží z trvalých energetických příjmů. Tento krok vysílá Ankaře signál, že Řekové jsou ochotni rozvíjet svou výlučnou ekonomickou zónu bez ohledu na turecké námitky." # todo: NEW TRANSLATION
 greece.737.a: "Zdroje zajistí naši budoucnost" # todo: NEW TRANSLATION
 greece.738.t: "Kypr odmítá plynový projekt" # todo: NEW TRANSLATION
 greece.738.d: "Kyperská republika odmítla účast na společném rozvoji plynu z obavy před diplomatickou reakcí Turecka. Athény nebudou otázku dále vynucovat." # todo: NEW TRANSLATION
 greece.738.a: "Promarněná příležitost" # todo: NEW TRANSLATION
 greece.739.t: "Oslovení tureckých Kypřanů" # todo: NEW TRANSLATION
 greece.739.d: "Athény podávají turecko-kyperské komunitě na severu hospodářskou a kulturní ruku. Nabízejí investice, obchodní výhody a kulturní výměnné programy a dokazují, že znovusjednocení pod řeckou záštitou slouží zájmům severu stejně jako řeckokyperské straně." # todo: NEW TRANSLATION
 greece.739.a: "Přijmout řecké investice" # todo: NEW TRANSLATION
 greece.739.b: "Zůstáváme obezřetní" # todo: NEW TRANSLATION
 greece.740.t: "Severní Kypr vítá investice" # todo: NEW TRANSLATION
 greece.740.d: "Vedení tureckých Kypřanů přijalo řecké investice a užší hospodářské vztahy. Peníze proudí na sever, vznikají obchodní partnerství a vliv se postupně přesouvá ve prospěch Athén. Základy budoucího sjednocení jsou každým měsícem pevnější." # todo: NEW TRANSLATION
 greece.740.a: "Semena jednoty jsou zaseta" # todo: NEW TRANSLATION
 greece.741.t: "Severní Kypr odmítá spolupráci" # todo: NEW TRANSLATION
 greece.741.d: "Tureckokyperská komunita, obezřetná vůči řeckým záměrům, odmítla investiční balíček. Jejím štítem zůstává podpora Ankary a nabídky Athén ji nepřesvědčily." # todo: NEW TRANSLATION
 greece.741.a: "Další neúspěch" # todo: NEW TRANSLATION
 greece.742.t: "Navržena dohoda o suverénních základnách" # todo: NEW TRANSLATION
 greece.742.d: "Athény žádají, aby Spojené království převedlo kontrolu nad suverénními základnami Akrotiri a Dekelia. Řecko výměnou nabízí odškodnění, zachování přístupu NATO a záruky ochrany britských vojenských zařízení. Převod těchto základen by změnil strategickou rovnováhu na Kypru." # todo: NEW TRANSLATION
 greece.742.a: "Předat základny Řecku" # todo: NEW TRANSLATION
 greece.742.b: "Základny zůstanou britské" # todo: NEW TRANSLATION
 greece.743.t: "Spojené království souhlasí s převodem" # todo: NEW TRANSLATION
 greece.743.d: "Londýn dospěl k závěru, že převod základen slouží dlouhodobým zájmům obou národů. Řecké síly nyní obsazují Akrotiri a Dekelii a Athény získávají strategickou hloubku i kontrolu nad klíčovými letišti a přístavy. Tento posun rozhodně naklání vojenskou rovnováhu ve prospěch enosis." # todo: NEW TRANSLATION
 greece.743.a: "Historický zisk" # todo: NEW TRANSLATION
 greece.744.t: "Spojené království odmítá převod" # todo: NEW TRANSLATION
 greece.744.d: "Britská vláda odmítla předat suverénní základny. Zůstávají britským územím a britskými vojenskými zařízeními, stejně jako od roku 1960." # todo: NEW TRANSLATION
 greece.744.a: "Máme svázané ruce" # todo: NEW TRANSLATION
 GRE_western_commitment: "Řecké západní směřování" # todo: NEW TRANSLATION
 GRE_western_commitment_tt: "$GRE_western_commitment$: $RIGHT|+=0Y$" # todo: NEW TRANSLATION
 greece.745.t: "Kampaň nátlaku končí" # todo: NEW TRANSLATION
 greece.745.d: "Kampaň vyvíjející tlak na Turecko kvůli Kypru skončila. Několik velmocí vyjádřilo podporu řeckému postoji s odvoláním na potřebu stability ve východním Středomoří a práva kyperského lidu. Athény nyní disponují značnou diplomatickou pákou. Na základě počtu hlasů spojenců má Ankara [GRE_GetTurkeyConcessionChance] šanci ustoupit a přijmout omezení svého vlivu na Kypr. Pokud Turecko odmítne, napětí v Egejském moři vzroste." # todo: NEW TRANSLATION
 greece.745.a: "Zjistit, jak Ankara odpoví" # todo: NEW TRANSLATION
 greece.724.t: "Athény požadují sjednocení" # todo: NEW TRANSLATION
 greece.724.d: "Řecká vláda formálně požádala Kyperskou republiku o sjednocení s Řeckem. Nabídka je jasná: dobrovolně se připojit a přechod bude hladký a prosperující. Na základě nálad řeckých Kypřanů a tureckého vlivu činí šance na přijetí [GRE_GetCyprusAcceptanceChance]. Vláda v Nikósii stojí před historickou volbou." # todo: NEW TRANSLATION
 greece.724.a: "Přijmout sjednocení s Řeckem" # todo: NEW TRANSLATION
 greece.724.b: "Požadavek odmítnout" # todo: NEW TRANSLATION
 greece.725.t: "Athény požadují podřízení Severu" # todo: NEW TRANSLATION
 greece.725.d: "Řecko nyní obrátilo pozornost k Severnímu Kypru a požaduje, aby vedení tureckých Kypřanů rovněž přijalo sjednocení s Athénami. Postavení tureckých Kypřanů je složitější: sever se dlouhodobě spoléhá na tureckou vojenskou ochranu a kulturní vazby. Šance na přijetí činí [GRE_GetNorthernCyprusAcceptanceChance] a závisí na tom, zda Turecko pod tlakem NATO ustoupilo, i na síle řeckokyperské dynamiky. Pokud Severní Kypr odmítne, ostrov zůstane rozdělený a ozbrojený konflikt bude pravděpodobný." # todo: NEW TRANSLATION
 greece.725.a: "Přijmout sjednocení s Řeckem" # todo: NEW TRANSLATION
 greece.725.b: "Vyhledat tureckou ochranu; požadavek odmítnout" # todo: NEW TRANSLATION
 greece.726.t: "Jak daleko Athény zajdou?" # todo: NEW TRANSLATION
 greece.726.d: "Severní Kypr odmítá dobrovolné podřízení a vláda tureckých Kypřanů signalizuje, že vyhledá tureckou vojenskou podporu proti pohlcení. Řecko nyní stojí před volbou: pokračovat v tajné pomoci silám podporujícím sjednocení a doufat v pokojné řešení, nebo přímo nasadit řecké ozbrojené síly k násilné anexi severu. Přímá vojenská akce znamená vystoupení z NATO, protože aliance nepodpoří útočnou válku za účelem odebrání území ze sféry vlivu člena NATO." # todo: NEW TRANSLATION
 greece.726.a: "Pouze dobrovolníci a materiál" # todo: NEW TRANSLATION
 greece.726.b: "Nasadit řecké ozbrojené síly; vyhlásit válku Severnímu Kypru" # todo: NEW TRANSLATION
 greece.723.t: "Kypr sjednocen" # todo: NEW TRANSLATION
 greece.723.d: "Dva kyperské státy byly sjednoceny pod řeckou vlajkou. Jižní i severní území jsou nyní plně začleněna do Řecka jako státy s core. Poprvé od roku 1974 je ostrov celý pod jedinou správou. Jde o završení desetiletí kyperského nacionalismu a řeckých iredentistických ambicí: enosis byla konečně dosažena." # todo: NEW TRANSLATION
 greece.723.a: "Historický den pro helénismus" # todo: NEW TRANSLATION
 GRE_turkey_concedes_tt: "Turecko ustupuje: jeho vliv na Kypru a Severním Kypru výrazně klesá, napětí v Egejském moři polevuje a dynamika Kypru roste." # todo: NEW TRANSLATION
 GRE_turkey_holds_firm_tt: "Turecko odmítá ustoupit; napětí v Egejském moři roste." # todo: NEW TRANSLATION
 GRE_gain_cyprus_tt: "Kyperská republika se sjednocuje s Řeckem a stává se řeckým územím s core." # todo: NEW TRANSLATION
 GRE_gain_north_cyprus_tt: "Severní Kypr se sjednocuje s Řeckem a stává se řeckým územím s core." # todo: NEW TRANSLATION
 GRE_enosis_demand_refused_tt: "Odmítnutí vyvolá mezinárodní odsouzení a donutí Athény rozhodnout, jak daleko eskalovat; krize může skončit válkou." # todo: NEW TRANSLATION
 GRE_enosis_campaign_influence_tt: "Při ovlivňování ze strany §Y[GRE.GetNameWithFlag]§! se účinnost vlivu zvyšuje o §Y15 %§!\n" # todo: NEW TRANSLATION
