 GRE_vision_2030: "Vojenská vize" # todo: NEW TRANSLATION
 GRE_vision_2030_desc: "Naše ozbrojené síly po letech úsporných opatření a zastaralého myšlení z dob studené války zaostaly. Máme stárnoucí vybavení, přebujelé struktury a armádu, která neodpovídá hrozbám, jimž čelíme. Tento plán je nejambicióznější obrannou reformou v moderních řeckých dějinách." # todo: NEW TRANSLATION
 GRE_armored_transition: "Přechod obrněných sil" # todo: NEW TRANSLATION
 GRE_armored_transition_desc: "BMP-1 a M48 Patton již odsloužily své. Vyřazení obrněné techniky z dob studené války a přechod na Leopard 2 v řecké variantě dá našim obrněným brigádám tankové síly, které se mohou měřit s kýmkoli v regionu." # todo: NEW TRANSLATION
 GRE_pzh_2000: "Houfnice PzH 2000" # todo: NEW TRANSLATION
 GRE_pzh_2000_desc: "Naše dělostřelectvo musí držet krok s moderním obrněným válčením. Samohybné houfnice PzH 2000 by našim silám poskytly přesnou palbu na velkou vzdálenost a zajistily, že naši pozemní velitelé budou mít vždy účinnou nepřímou palebnou podporu." # todo: NEW TRANSLATION
 GRE_m270_mlrs: "M270 MLRS" # todo: NEW TRANSLATION
 GRE_m270_mlrs_desc: "Krytí vylodění na ostrovech a údery proti pobřežním cílům v celém Egejském moři vyžadují palebnou sílu přesahující přední linii. Vícenásobný raketomet M270 by naší armádě poskytl takový dosah." # todo: NEW TRANSLATION
 GRE_puls_rocket: "Raketový systém PULS" # todo: NEW TRANSLATION
 GRE_puls_rocket_desc: "Prostřednictvím společného programu EURO-PULS s Izraelem a evropskými partnery můžeme zavést přesný raketový dělostřelecký systém schopný zasahovat cíle na velkou vzdálenost. Každý protivník v Egejském moři by si takový krok dvakrát rozmyslel." # todo: NEW TRANSLATION
 GRE_special_warfare_command: "Velitelství speciálních operací" # todo: NEW TRANSLATION
 GRE_special_warfare_command_desc: "Sjednocení jednotek EKAM, úderných brigád, bojových potápěčů a výsadkářů pod jedno Velitelství speciálních operací by nám poskytlo elitní síly schopné působit na našich ostrovech i mimo ně. V moderním válčení mohou malé a smrtící jednotky rozhodovat o výsledcích, kterých celé divize nedosáhnou." # todo: NEW TRANSLATION
 GRE_archipelagos_strategy: "Strategie souostroví" # todo: NEW TRANSLATION
 GRE_archipelagos_strategy_desc: "Naše tisíce ostrovů nejsou přítěží. Při správné obraně a soudržné doktríně se stanou vrstvenou překážkou, kterou žádné nepřátelské loďstvo nepřekoná bez těžkých ztrát. Měli bychom využít geografii Egejského moře ve svůj prospěch." # todo: NEW TRANSLATION
 GRE_f16_modernisation: "Modernizace F-16" # todo: NEW TRANSLATION
 GRE_f16_modernisation_desc: "Modernizace 83 našich letounů F-16 na standard Block 70/72 Viper prostřednictvím Řeckého leteckého průmyslu udrží naši stíhací flotilu v dobrém stavu a zároveň vybuduje domácí odborné kapacity potřebné pro budoucí údržbu F-35." # todo: NEW TRANSLATION
 GRE_intl_flight_training: "Mezinárodní středisko leteckého výcviku" # todo: NEW TRANSLATION
 GRE_intl_flight_training_desc: "Otevření našich výcvikových zařízení spojeneckým zemím by posílilo dobrou vůli, prohloubilo vojenské vazby a poskytlo našim pilotům zkušenosti s výcvikem podle mezinárodních standardů." # todo: NEW TRANSLATION
 GRE_new_transport_helicopters: "Nové transportní vrtulníky" # todo: NEW TRANSLATION
 GRE_new_transport_helicopters_desc: "Rychlá přeprava mezi našimi ostrovy je pro jejich obranu zásadní. Zavedení 35 vrtulníků UH-60M Black Hawk vedle našich MH-60R Seahawk by nám poskytlo kapacitu k posílení jakéhokoli ohroženého postavení dříve, než se nepřítel stihne zakopat." # todo: NEW TRANSLATION
 GRE_f35_program: "Spolupráce na programu F-35" # todo: NEW TRANSLATION
 GRE_f35_program_desc: "Zapojení do programu F-35 nám poskytne stíhací letoun páté generace se schopností stealth, kterému se v regionu nikdo nevyrovná. Smlouva podepsaná v červenci 2024 je významným milníkem pro řecké letectvo a staví naše piloty před všechny ostatní v Egejském moři." # todo: NEW TRANSLATION
 GRE_patriot_air_defense: "Protivzdušné systémy Patriot" # todo: NEW TRANSLATION
 GRE_patriot_air_defense_desc: "Naše baterie Nike Hercules jsou příliš staré na to, aby se vypořádaly s moderními hrozbami. Přechod na Patriot PAC-3 s interceptory MSE by Řecku konečně poskytl skutečnou obranu proti balistickým střelám a ochránil naši kritickou infrastrukturu." # todo: NEW TRANSLATION
 GRE_centauros_anti_drone: "Systém proti dronům Centauros" # todo: NEW TRANSLATION
 GRE_centauros_anti_drone_desc: "Systém Centauros C-UAS vyvinul Řecký letecký průmysl a osvědčil se při operacích v Rudém moři. Jeho rozmístění na našich ostrovech, námořních základnách a letištích je prioritou. Drony představují největší hrozbu moderního válčení a my musíme být schopni jim čelit." # todo: NEW TRANSLATION
 GRE_achilles_shield: "Achillův štít" # todo: NEW TRANSLATION
 GRE_achilles_shield_desc: "Integrace našich baterií Patriot, protidronové obrany Centauros a pobřežních raketových systémů do jediné sítě pokrývající celé Egejské moře by vytvořila zónu zamezení přístupu, díky níž by byl každý útok na řecké území nesmírně nákladný." # todo: NEW TRANSLATION
 GRE_kimon_class_frigate: "Fregata třídy Kimon" # todo: NEW TRANSLATION
 GRE_kimon_class_frigate_desc: "Po letech zrušených programů jsme konečně podepsali smlouvu s Naval Group na tři fregaty FDI HN s opcí na čtvrtou. Třída Kimon poskytne řeckému námořnictvu řádné hladinové bojové plavidlo schopné čelit jakékoli flotile v regionu." # todo: NEW TRANSLATION
 GRE_hydra_class_upgrade: "Modernizace třídy Hydra" # todo: NEW TRANSLATION
 GRE_hydra_class_upgrade_desc: "Fregaty třídy Hydra jsou plavidla MEKO 200HN postavená v loděnicích Skaramangas v 90. letech a tvoří páteř našich hladinových bojových sil. Modernizace jejich radarů, systémů elektronického boje a protilodních střel v polovině životnosti by je udržela bojeschopné po další desetiletí." # todo: NEW TRANSLATION
 GRE_elli_class: "Program náhrady třídy Elli" # todo: NEW TRANSLATION
 GRE_elli_class_desc: "Fregaty třídy Elli jsou stará nizozemská plavidla třídy Van Speijk převedená k nám v 80. letech a již dávno překročila svou životnost. Potřebujeme nové trupy, ať už postavené doma ve Skaramangasu, nebo získané ze zahraničí, abychom obnovili sílu našich fregat." # todo: NEW TRANSLATION
 GRE_roussen_attack_craft: "Rychlé útočné plavidlo třídy Roussen" # todo: NEW TRANSLATION
 GRE_roussen_attack_craft_desc: "Egejské moře není otevřený oceán, ale stísněné vody jako stvořené pro rychlá útočná plavidla. Třída Roussen je určena přesně pro tento účel: je rychlá, vyzbrojená střelami a smrtící na krátkou vzdálenost. Nová generace těchto plavidel by mohla každému nepřátelskému loďstvu zabránit v přístupu do řeckých vod." # todo: NEW TRANSLATION
 GRE_fremm_frigate: "Víceúčelové fregaty FREMM" # todo: NEW TRANSLATION
 GRE_fremm_frigate_desc: "Naše flotila potřebuje více lodí. Můžeme buď rychle získat osvědčené italské fregaty FREMM, nebo investovat do páté fregaty FDI od Naval Group. Každá možnost má jiné výhody z hlediska rychlosti, schopností a spojeneckých vztahů." # todo: NEW TRANSLATION
 GRE_submarine_expansion: "Program pořízení ponorek typu 214" # todo: NEW TRANSLATION
 GRE_submarine_expansion_desc: "Třída Papanikolis představuje to nejlepší v konvenčním ponorkovém válčení. Nezávislý pohon vzduchem umožňuje našim ponorkám zůstat pod vodou celé týdny bez vynoření. Rozšíření a udržení tohoto programu by posílilo naši kontrolu nad podmořským prostorem Egejského moře." # todo: NEW TRANSLATION
 GRE_bluewhale_submarines: "Ponorky BlueWhale" # todo: NEW TRANSLATION
 GRE_bluewhale_submarines_desc: "Autonomní bezpilotní ponorky od Israel Aerospace by přidaly schopnost, které se v regionu nikdo nevyrovná. Tyto systémy pracují bez posádky a bez rizika, což našemu námořnictvu poskytne trvalou přítomnost pod hladinou." # todo: NEW TRANSLATION
 GRE_defense_manufacturing: "Povinnost místní výroby" # todo: NEW TRANSLATION
 GRE_defense_manufacturing_desc: "Požadavek na 25% podíl domácí výroby ve všech významných obranných programech zajistí, že náš průmysl bude těžit z každé smlouvy. EAS, HAI a naše loděnice posílí a snížíme svou závislost na zahraničních dodavatelích." # todo: NEW TRANSLATION
 GRE_research_hubs: "Výzkumná centra" # todo: NEW TRANSLATION
 GRE_research_hubs_desc: "Formální spolupráce mezi našimi univerzitami, Řeckým leteckým průmyslem a ministerstvem obrany vytvoří pro ozbrojené síly zdrojový řetězec inovací." # todo: NEW TRANSLATION
 GRE_defense_innovation_center: "Řecké centrum obranných inovací" # todo: NEW TRANSLATION
 GRE_defense_innovation_center_desc: "Specializované inovační centrum propojující začínající firmy, univerzity a partnery z obranného průmyslu pomůže urychlit vývoj vojenských technologií nové generace v Řecku." # todo: NEW TRANSLATION
 GRE_communication_satellites: "Komunikační satelity" # todo: NEW TRANSLATION
 GRE_communication_satellites_desc: "Specializované vojenské komunikační satelity by nám poskytly trvalé pokrytí Egejského moře z oběžné dráhy a bezpečnou komunikační páteř pro všechny složky ozbrojených sil." # todo: NEW TRANSLATION
 GRE_theon_international: "Mezinárodní expanze společnosti Theon" # todo: NEW TRANSLATION
 GRE_theon_international_desc: "Theon International má silnou celosvětovou pověst v oblasti nočního vidění a optických systémů. Podpora její expanze na nové exportní trhy by přinesla příjmy, budovala obranné vztahy a ukázala, že řecký průmysl může konkurovat na nejvyšší úrovni." # todo: NEW TRANSLATION
 GRE_industrial_synergy: "Průmyslová synergie" # todo: NEW TRANSLATION
 GRE_industrial_synergy_desc: "Naše obranné programy fungují nejlépe, když naše průmyslová odvětví spolupracují. Formální koordinace mezi HAI, našimi loděnicemi, EAS a výzkumnými institucemi by každý program urychlila, zlevnila a zvýšila jeho schopnosti." # todo: NEW TRANSLATION
 GRE_irix_loitering: "Vyčkávací munice IRIX" # todo: NEW TRANSLATION
 GRE_irix_loitering_desc: "Hellenic Defence Systems uzavřel partnerství se společností Paramount Industries za účelem výroby systému IRIX, první vyčkávací munice vyrobené v Řecku. S dosahem až 100 kilometrů poskytne našim silám schopnost přesných úderů hluboko na nepřátelském území bez závislosti na zahraničních dodavatelích." # todo: NEW TRANSLATION
 GRE_lora_ballistic: "Balistický raketový systém LORA" # todo: NEW TRANSLATION
 GRE_lora_ballistic_desc: "Balistický raketový systém LORA od Israel Aerospace Industries by nám poskytl schopnost přesných úderů na velkou vzdálenost s dosahem 400 kilometrů. Takový dosah výrazně mění rovnováhu v Egejském moři a dává každému potenciálnímu protivníkovi vážný důvod k zamyšlení." # todo: NEW TRANSLATION
 GRE_iniochos: "Program cvičení Iniochos" # todo: NEW TRANSLATION
 GRE_iniochos_desc: "Každoroční cvičení Iniochos v Andravidi se stalo jednou z nejvýznamnějších evropských mnohonárodních akcí leteckého výcviku. Rozšíření účasti a větší složitost scénářů zdokonalí naše piloty a posílí vojenské vztahy se spojeneckými zeměmi." # todo: NEW TRANSLATION
 GRE_grypas_ucav: "Program UCAV Grypas" # todo: NEW TRANSLATION
 GRE_grypas_ucav_desc: "Řecký letecký průmysl vyvinul Grypas, náš první domácí bojový dron. Investice do tohoto programu nám poskytne bezpilotní údernou schopnost nezávislou na zahraničních exportních omezeních či politických podmínkách." # todo: NEW TRANSLATION
 GRE_integrated_air_defense: "Integrovaná síť protivzdušné obrany" # todo: NEW TRANSLATION
 GRE_integrated_air_defense_desc: "Propojení baterií Patriot, raketového štítu Achilles, protidronových systémů a našeho radarového pokrytí do jediné vrstvené sítě dá Řecku oblohu, kterou žádný nepřátelský letoun ani dron nepřekoná bez odpovědi. Každý senzor a každý interceptor nyní bojuje jako součást jediného systému." # todo: NEW TRANSLATION
 GRE_strategic_transport_fleet: "Strategická transportní flotila" # todo: NEW TRANSLATION
 GRE_strategic_transport_fleet_desc: "Obrana našich ostrovů je jen tak dobrá jako naše schopnost je zásobovat a posilovat. Modernizace flotily C-27J a pořízení dalších transportních letounů C-130H zajistí, že žádná posádka nezůstane bez podpory a žádný ostrov nebude v krizi izolován." # todo: NEW TRANSLATION
 GRE_constellation_co_production: "Společná výroba třídy Constellation" # todo: NEW TRANSLATION
 GRE_constellation_co_production_desc: "Společně se Spojenými státy jsme zahájili plánování společné výroby fregat třídy FFG-62 Constellation. Toto partnerství přidá do naší flotily válečné lodě světové úrovně a rozvine odborné kapacity i schopnosti našich loděnic ve Skaramangasu a Elefsině." # todo: NEW TRANSLATION
 GRE_eyes_of_poseidon: "Poseidonovy oči" # todo: NEW TRANSLATION
 GRE_eyes_of_poseidon_desc: "Nemůžeme bránit to, co nevidíme. Integrace námořních hlídkových letounů, pobřežních radarových stanic a satelitních snímků do jednotné sledovací sítě by nám poskytla úplný přehled o Egejském a Jónském moři." # todo: NEW TRANSLATION
 GRE_souda_bay_expansion: "Rozšíření námořní základny Souda Bay" # todo: NEW TRANSLATION
 GRE_souda_bay_expansion_desc: "Souda Bay je jedním ze strategicky nejcennějších přístavů ve Středomoří. Rozšíření spolupráce se Spojenými státy a NATO v tomto zařízení by posílilo naše spojenectví a upevnilo roli Řecka jako klíčové kotvy na jižním křídle NATO." # todo: NEW TRANSLATION
 GRE_alexandroupolis_strategic_hub: "Strategické centrum Alexandroupolis" # todo: NEW TRANSLATION
 GRE_alexandroupolis_strategic_hub_desc: "Přístav Alexandroupolis se stal životně důležitým logistickým koridorem NATO do východní Evropy, který zcela obchází Bospor. Investice do jeho infrastruktury a užší spolupráce s Bulharskem a Rumunskem by z něj učinily trvalé strategické aktivum." # todo: NEW TRANSLATION
 GRE_spike_atgm_integration: "Integrace protitankových střel Spike" # todo: NEW TRANSLATION
 GRE_spike_atgm_integration_desc: "Naše pěchota a obrněná vozidla potřebují moderní protitankovou řízenou střelu schopnou zasahovat cíle mimo přímou viditelnost. Integrace rodiny střel Spike do našich pozemních sil a námořních hlídkových plavidel by každému veliteli poskytla možnost přesného úderu." # todo: NEW TRANSLATION
 GRE_stinger_manpads: "Modernizace přenosných protiletadlových systémů" # todo: NEW TRANSLATION
 GRE_stinger_manpads_desc: "Naše ostrovní posádky a předsunuté jednotky čelí vzdušným hrozbám, proti nimž se velké baterie protivzdušné obrany nevyplatí nasazovat. Modernizace a rozšíření zásob přenosných systémů Stinger by každé pěší jednotce a hlídkovému plavidlu poskytly vlastní schopnost protivzdušné obrany." # todo: NEW TRANSLATION
 GRE_infantry_digitisation: "Program digitalizace pěchoty" # todo: NEW TRANSLATION
 GRE_infantry_digitisation_desc: "Moderní vojáci musí sdílet stejný operační obraz jako pilot nad nimi a fregata na moři. Vybavení pěchoty systémy řízení bojiště, šifrovanou komunikací a digitálním zaměřovacím vybavením ji propojí s širší sítí namísto izolovaného působení." # todo: NEW TRANSLATION
 GRE_sovereign_waters: "Svrchované vody" # todo: NEW TRANSLATION
 GRE_sovereign_waters_desc: "Po desetiletí jiní zpochybňovali naše svrchovaná práva v Egejském a východním Středomoří a my jsme neměli námořnictvo, které by s tím mohlo mnoho dělat. S modernizovanou flotilou a řádnou obranou ostrovů nyní můžeme uplatnit to, co nám mezinárodní právo vždy přiznávalo. Naše výlučná ekonomická zóna patří nám." # todo: NEW TRANSLATION
 GRE_rheinmetall_greece: "Rheinmetall v Řecku" # todo: NEW TRANSLATION
 GRE_rheinmetall_greece_desc: "Rheinmetall chce v Řecku zřídit místní montáž a údržbu v rámci budoucích akvizičních smluv. Formalizace tohoto partnerství a začlenění jejich výroby do našeho domácího obranného průmyslu by posílily modernizaci pozemních sil a učinily z Řecka centrum obranné výroby v jihovýchodní Evropě." # todo: NEW TRANSLATION
 GRE_joint_operations_reform: "Reforma společných operací" # todo: NEW TRANSLATION
 GRE_joint_operations_reform_desc: "Naše tři složky po desetiletí působily odděleně s vlastními doktrínami a velitelskými kulturami. Jednotný rámec společných operací, v němž armáda, námořnictvo a letectvo společně plánují, cvičí a bojují, je nezbytný. Vše ostatní, čeho chceme dosáhnout, na něm závisí." # todo: NEW TRANSLATION
 GRE_new_army_doctrine: "Od masy k manévru" # todo: NEW TRANSLATION
 GRE_new_army_doctrine_desc: "Řecká armáda byla vybudována k udržení linie v Thrákii s co největším počtem mužů. K této válce nikdy nedošlo. Musíme se restrukturalizovat kolem menších a rychlejších brigádních uskupení, která se mohou rychle přesouvat po Egejském moři a reagovat na hrozby dříve, než přerostou v krize." # todo: NEW TRANSLATION
 GRE_nco_reform: "Páteř armády" # todo: NEW TRANSLATION
 GRE_nco_reform_desc: "Od řeckých důstojníků se vždy očekávalo, že budou rozhodovat až na úrovni čet, protože poddůstojníkům nikdy nebyla dána pravomoc ani výcvik jednat samostatně. Vybudování profesionálního sboru poddůstojníků, který dokáže vést a přizpůsobovat se bez čekání na rozkazy shora, by armádu výrazně zefektivnilo." # todo: NEW TRANSLATION
 GRE_thrace_to_aegean: "Přeorientování armády" # todo: NEW TRANSLATION
 GRE_thrace_to_aegean_desc: "Čtyřicet let naše pozemní síly hleděly na severovýchod směrem k řece Evros. Tato hrozba nezmizela, ale již není naší jedinou starostí. Měli bychom hlavní nasazení přeorientovat na ostrovy a pobřeží Egejského moře, kde je svrchovanost zpochybňována každý den." # todo: NEW TRANSLATION
 GRE_joint_fires_doctrine: "Škola kombinovaných zbraní" # todo: NEW TRANSLATION
 GRE_joint_fires_doctrine_desc: "Dělostřelectvo, obrněná technika, pěchota a blízká letecká podpora příliš dlouho působily v oddělených strukturách. Válčení kombinovaných zbraní se musí stát standardem a každá jednotka musí cvičit společně. Naši vojáci musí vědět, jak spolupracovat s leteckou podporou, nejen o ní číst." # todo: NEW TRANSLATION
 GRE_sead_doctrine: "Potlačení nepřátelské protivzdušné obrany" # todo: NEW TRANSLATION
 GRE_sead_doctrine_desc: "Naši piloti patří v NATO k nejzkušenějším v obranných protiproudových operacích nad Egejským mořem, ale útočné údery proti bráněným cílům jsou stále nedostatečně rozvinuté. Potřebujeme specializovanou doktrínu SEAD využívající SCALP a Meteor z letounů Rafale k vyřazení nepřátelské protivzdušné obrany před nasazením úderných skupin." # todo: NEW TRANSLATION
 GRE_iniochos_as_doctrine: "Poučení z Iniochosu" # todo: NEW TRANSLATION
 GRE_iniochos_as_doctrine_desc: "Každý rok Iniochos spojuje piloty z dvaceti zemí, aby se učili, co funguje ve sporném vzdušném prostoru. Toto cvičení pořádáme už léta, aniž bychom jeho poznatky plně převedli do doktríny. Zjištění z každého ročníku by měla být formalizována do aktualizované taktiky a postupů a přijata v celém řeckém letectvu." # todo: NEW TRANSLATION
 GRE_cas_doctrine: "Integrace blízké letecké podpory" # todo: NEW TRANSLATION
 GRE_cas_doctrine_desc: "Řecké letectvo a řecká armáda spolu jen zřídka cvičily na úrovni potřebné pro účinnou blízkou leteckou podporu. Je zapotřebí trvalý společný výcvikový systém a standardizované komunikační protokoly, aby pozemní velitelé a stíhací piloti dokázali v rozhodující chvíli skutečně spolupracovat." # todo: NEW TRANSLATION
 GRE_aegean_fortress_doctrine: "Egejské moře jako naše moře" # todo: NEW TRANSLATION
 GRE_aegean_fortress_doctrine_desc: "Egejské moře není otevřený oceán. Je to bludiště šesti tisíc ostrovů, úzkých průlivů, mělkých mělčin a hrdel. Dobře připravený obránce může tuto geografii učinit pro každé útočící loďstvo nesmírně nebezpečnou. Potřebujeme námořnictvo, díky němuž bude každý přístup k řeckému území rizikem, které nikdo nebude chtít podstoupit." # todo: NEW TRANSLATION
 GRE_aegean_fortress_doctrine_tt: "[GREadmiraldefenseeffect]" # todo: NEW TRANSLATION
 GRE_aegean_fortress_doctrine_effect: "Admirálové: §G30% šance§! získat při postupu na vyšší úroveň §Y+1 obrany§!." # todo: NEW TRANSLATION
 GRE_submarine_wolf_packs: "Doktrína ponorkového válčení" # todo: NEW TRANSLATION
 GRE_submarine_wolf_packs_desc: "Ponorky jsou nejnebezpečnější zbraní v Egejském moři. Voda je příliš mělká na to, aby se v ní nepřítel skryl, ale na správných místech dostatečně hluboká pro naše ponorky. Výcvik posádek k působení v koordinovaných skupinách, sdílení zaměřovacích údajů a krytí hlídkových oblastí druhých by znamenal, že se žádná hladinová flotila nemůže pohybovat Egejským mořem, aniž by byla sledována zpod hladiny." # todo: NEW TRANSLATION
 GRE_missile_corvette_network: "Síť Roussen" # todo: NEW TRANSLATION
 GRE_missile_corvette_network_desc: "Naše raketové korvety třídy Roussen jsou rychlé a smrtící, pro Egejské moře ideální, ale nikdy nepůsobily jako koordinovaná síť. Jejich propojení s pobřežními radary, ostrovními senzory a hlášeními o kontaktech ponorek do jediného zaměřovacího obrazu by umožnilo každé korvetě během několika minut zaútočit na jakoukoli hladinovou hrozbu." # todo: NEW TRANSLATION
 GRE_aegean_minefield_doctrine: "Zaminované průlivy" # todo: NEW TRANSLATION
 GRE_aegean_minefield_doctrine_desc: "Řecko disponuje schopností námořního minování od druhé světové války, ale nikdy nebyla řádně začleněna do doktríny. Předem naplánovaná minová pole pro každý hlavní přístup do Egejského moře, připravená k aktivaci během několika hodin, by změnila průlivy v překážky, které by ani převaha loďstva nedokázala bezpečně překonat." # todo: NEW TRANSLATION
 GRE_sea_denial_complete: "Pevnost Egejské moře" # todo: NEW TRANSLATION
 GRE_sea_denial_complete_desc: "Egejské moře je nyní plně řeckým operačním prostorem. Každá vrstva naší námořní obrany — ponorky, korvety, fregaty, miny a pobřežní střely — byla začleněna do jediné doktríny zamezení přístupu na moři. Možná nemáme největší námořnictvo ve Středomoří, ale pro každého, kdo se pokusí proniknout do našich vod, máme to nejnebezpečnější." # todo: NEW TRANSLATION
 GRE_eastern_med_doctrine: "Za hranicemi Egejského moře" # todo: NEW TRANSLATION
 GRE_eastern_med_doctrine_desc: "Řecké zájmy nekončí u Dodekanésu. Naše práva na výlučnou ekonomickou zónu jižně od Kréty, náš závazek vůči Kypru a energetická partnerství s Izraelem a Egyptem vyžadují námořnictvo schopné dlouhodobě působit daleko od domova. Potřebujeme flotilu, která bude důvěryhodná v celém východním Středomoří, nejen v Egejském moři." # todo: NEW TRANSLATION
 GRE_asw_training: "Lov ponorek" # todo: NEW TRANSLATION
 GRE_asw_training_desc: "Protiponorkový boj je nejnáročnější a nejzanedbávanější dovedností řeckého námořnictva. Naše nové fregaty mají vynikající protiponorkové senzory a torpéda, ale posádky potřebují specializovaný výcvik, aby je dokázaly správně využívat. Trvalý výcvikový program pro protiponorkový boj, který čerpá z našich vlastních ponorkových sil, naučí posádky hladinových lodí, jak nepřátelské ponorky skutečně operují." # todo: NEW TRANSLATION
 GRE_fleet_coordination: "Jednotné námořní velení" # todo: NEW TRANSLATION
 GRE_fleet_coordination_desc: "Působení ve východním Středomoří vyžaduje koordinaci, kterou roztříštěná velení eskader nemohou zajistit. Restrukturalizace řeckého námořnictva pod jediné operační velení s přehledem v reálném čase o každé lodi, ponorce a hlídkovém letounu by učinila flotilu jako celek mnohem účinnější." # todo: NEW TRANSLATION
 GRE_eastern_med_taskforce: "Dokonalé zvládnutí středomořských operací" # todo: NEW TRANSLATION
 GRE_eastern_med_taskforce_desc: "Po zajištění Egejského moře musíme rozšířit svůj dosah po celém Středomoří. Restrukturalizace výcviku, reforma rotace flotily a dlouhodobá nasazení vybudují schopnost sledovat a napadat jakoukoli nepřátelskou flotilu po celé délce Středomoří." # todo: NEW TRANSLATION
 GRE_eastern_med_supremacy: "Nadvláda ve východním Středomoří" # todo: NEW TRANSLATION
 GRE_eastern_med_supremacy_desc: "Stálé expediční uskupení podporované moderními suchými doky a působící od Jónského moře po Levantskou pánev činí z řeckého námořnictva rozhodující námořní mocnost východního Středomoří. Projekce síly v takovém měřítku odpoví na každou výzvu dříve, než dorazí do řeckých vod." # todo: NEW TRANSLATION
 GRE_landforces_modifier: "Řecká armáda" # todo: NEW TRANSLATION
 GRE_landforces_modifier_desc: "Řecko disponuje bojově zocelenými pozemními silami, jejichž podobu utvářela desetiletí napětí v Egejském moři. Naše armáda je vycvičena, vybavena a rozmístěna tak, aby bránila každý metr řecké půdy." # todo: NEW TRANSLATION
 GRE_airforce_modifier: "Řecké letectvo" # todo: NEW TRANSLATION
 GRE_airforce_modifier_desc: "Řecké letectvo ovládá oblohu nad Egejským mořem. Naši piloti patří k nejzkušenějším v NATO, zoceleným každodenními přepady a sporným vzdušným prostorem." # todo: NEW TRANSLATION
 GRE_navy_modifier: "Řecké námořnictvo" # todo: NEW TRANSLATION
 GRE_navy_modifier_desc: "Řecko je námořní národ. Naše flotila fregat, ponorek a rychlých útočných plavidel hlídkuje ve vodách, které jsou řecké již od starověku." # todo: NEW TRANSLATION
 GRE_cold_war_giant_1: "Armáda studené války" # todo: NEW TRANSLATION
 GRE_cold_war_giant_1_desc: "Naše armáda byla vybudována k zastavení sovětského postupu přes Balkán. K této válce nikdy nedošlo. Nyní máme předimenzované formace, jejichž personální zajištění je nákladné, pomalu se přesouvají a jsou vycvičeny pro bojiště, které již neexistuje." # todo: NEW TRANSLATION
 GRE_aircraft_bad_1: "Letectvo studené války" # todo: NEW TRANSLATION
 GRE_aircraft_bad_1_desc: "Naše letectvo je směsicí letounů z éry studené války. Velké draky jsou nákladné na údržbu a našim pilotům chybí doktrína pro projekci síly mimo Egejské moře. Strategické letectvo a průzkum představují významné nedostatky." # todo: NEW TRANSLATION
 GRE_navy_bad_1: "Námořnictvo studené války" # todo: NEW TRANSLATION
 GRE_navy_bad_1_desc: "Naše flotila vypadá na papíře početně, ale v praxi je neuspořádaná. Lodě z druhé ruky ze tří různých námořnictev znamenají tři různé logistické řetězce. Náklady na palivo jsou příliš vysoké, protivzdušná obrana má mezery a naši důstojníci jsou vycvičeni spíše k pobřežním hlídkám než k operacím flotily." # todo: NEW TRANSLATION
 GRE_defense_industry: "Arzenál Egejského moře" # todo: NEW TRANSLATION
 GRE_defense_industry_modifier: "Arzenál Egejského moře" # todo: NEW TRANSLATION
 GRE_defense_industry_modifier_desc: "Od loděnic ve Skaramangasu po zbrojovky v okolí Pirea zásobuje řecký průmysl ozbrojené síly již celé generace. Máme vlastní obranný průmysl a měli bychom ho využívat." # todo: NEW TRANSLATION
 GRE_research_hubs_idea_tt: "[GREresearchhubidea]" # todo: NEW TRANSLATION
 GRE_archipelagos_defense_plan: "Štít Egejského moře" # todo: NEW TRANSLATION
 GRE_archipelagos_defense_plan_desc: "Vrstvená obranná architektura, která považuje ostrovní řetězec Egejského moře za integrovanou síť pevností. Rychlé opravy, pobřežní baterie, zamezení zásobování a raketové pokrytí společně činí každý přístup do řeckých vod nákladným." # todo: NEW TRANSLATION
 GRE_archipelagos_defense_plan_country: "Štít Egejského moře" # todo: NEW TRANSLATION
 GRE_archipelagos_defense_plan_country_desc: "Vrstvená obranná architektura, která považuje ostrovní řetězec Egejského moře za integrovanou síť pevností. Rychlé opravy, pobřežní baterie, zamezení zásobování a raketové pokrytí společně činí každý přístup do řeckých vod nákladným." # todo: NEW TRANSLATION
 GRE_defense_innovation_research_mission: "Výzkumný cyklus obranných inovací" # todo: NEW TRANSLATION
 GRE_defense_innovation_research_mission_desc: "Řecké centrum obranných inovací řídí nepřetržitý výzkum napříč všemi složkami ozbrojených sil. Každých 100 dní může dojít k průlomu v oblasti obrněné techniky, dělostřelectva, pěchotních systémů, letectví nebo námořních technologií." # todo: NEW TRANSLATION
 GRE_aegean_survey: "Průzkum dna Egejského moře" # todo: NEW TRANSLATION
 GRE_aegean_survey_desc: "Mapujeme to, co je naše. Kompletní geologický průzkum dna Egejského moře určí rozsah našich zásob uhlovodíků a položí základy jejich těžby." # todo: NEW TRANSLATION
 GRE_aegean_surveyed: "Zmapované vody Egejského moře" # todo: NEW TRANSLATION
 GRE_aegean_extraction: "Těžba ropy v Egejském moři" # todo: NEW TRANSLATION
 GRE_aegean_extraction_desc: "Průzkum je dokončen. Zahajujeme těžbu z egejských ložisek. Řecká ropa z řeckých vod pro řecké hospodářství." # todo: NEW TRANSLATION
 GRE_aegean_extracting: "Vytěžená ropa z Egejského moře" # todo: NEW TRANSLATION
 GRE_aegean_offshore_industry: "Offshore průmysl v Egejském moři" # todo: NEW TRANSLATION
 GRE_aegean_offshore_industry_desc: "Těžba vytváří průmysl. Budujeme podpůrnou infrastrukturu ke zpracování a distribuci toho, co získáváme ze dna Egejského moře." # todo: NEW TRANSLATION
 GRE_crete_survey: "Průzkum dna jižně od Kréty" # todo: NEW TRANSLATION
 GRE_crete_survey_desc: "Vody jižně od Kréty skrývají významný nevyužitý potenciál. Rozšiřujeme průzkumné operace do Jónské a Levantské pánve." # todo: NEW TRANSLATION
 GRE_crete_surveyed: "Zmapované krétské vody" # todo: NEW TRANSLATION
 GRE_crete_extraction: "Těžba ropy jižně od Kréty" # todo: NEW TRANSLATION
 GRE_crete_extraction_desc: "Nejhlubší řecké vody ukrývají největší zásoby. Zahajujeme těžbu jižně od Kréty a zajišťujeme hospodářskou budoucnost národa." # todo: NEW TRANSLATION
 GRE_crete_extracting: "Vytěžená krétská ropa" # todo: NEW TRANSLATION
 GRE_crete_offshore_industry: "Offshore průmysl jižně od Kréty" # todo: NEW TRANSLATION
 GRE_crete_offshore_industry_desc: "Jižní ložiska produkují. Budujeme průmyslovou kapacitu, která promění surovou těžbu v trvalý hospodářský výstup." # todo: NEW TRANSLATION
 TUR_naval_expansion_response: "Program rozšiřování námořnictva" # todo: NEW TRANSLATION
 TUR_naval_expansion_response_desc: "V reakci na řeckou námořní asertivitu Turecko urychluje svůj program stavby lodí. Loděnice pracují na zvýšenou kapacitu, aby dohnaly náskok ve východním Středomoří." # todo: NEW TRANSLATION
 GRE_creditor_management_category: "Správa řeckého dluhu" # todo: NEW TRANSLATION
 GRE_creditor_management_category_desc: "Jako držitel řeckého státního dluhu můžeme požadovat splacení jeho části nebo jej zcela odpustit. Naše současné podíly nám z Athén přinášejí pravidelný úrokový příjem." # todo: NEW TRANSLATION
 GRE_propose_debt_deal: "Navrhnout dohodu o dluhu" # todo: NEW TRANSLATION
 GRE_propose_debt_deal_desc: "Navrhnout zahraničnímu státu převzetí části našeho státního dluhu výměnou za pravidelné úrokové platby. Vybranému věřiteli převedeme 10 % našeho současného dluhu, po překročení 90 % HDP pak 25 %." # todo: NEW TRANSLATION
 GRE_repay_creditor: "Splácet věřiteli" # todo: NEW TRANSLATION
 GRE_repay_creditor_desc: "Provést jednorázovou platbu a snížit náš nesplacený dluh vůči tomuto věřiteli o 10 % dlužné částky." # todo: NEW TRANSLATION
 GRE_creditor_call_in_debt: "Požadovat splacení řeckého dluhu" # todo: NEW TRANSLATION
 GRE_creditor_call_in_debt_desc: "Požadovat, aby Řecko okamžitě splatilo 20 % dluhu, který nám dluží. Tento závažný diplomatický krok může poškodit vztahy." # todo: NEW TRANSLATION
 GRE_creditor_forgive_debt: "Odpustit řecký dluh" # todo: NEW TRANSLATION
 GRE_creditor_forgive_debt_desc: "Odepsat 25 % dluhu, který nám Řecko dluží, jako gesto dobré vůle. Výrazně to zlepší vztahy s Athénami." # todo: NEW TRANSLATION
 greece_debt.10.t: "Návrh na řecký dluh" # todo: NEW TRANSLATION
 greece_debt.10.d: "[FROM.GetName] nás oslovil s návrhem převzít část jejich státního dluhu. Na oplátku bychom z držené částky dostávali pravidelné úrokové platby. Navrhovaná částka je skromná, ale představuje spolehlivý zdroj příjmů." # todo: NEW TRANSLATION
 greece_debt.10.a: "Přijmout podmínky" # todo: NEW TRANSLATION
 greece_debt.10.b: "Nemáme zájem" # todo: NEW TRANSLATION
 greece_debt.10.c: "Jedině za vyšší sazbu" # todo: NEW TRANSLATION
 greece_debt.12.t: "Dohoda o dluhu přijata" # todo: NEW TRANSLATION
 greece_debt.12.d: "[FROM.GetName] souhlasil s převzetím části našeho státního dluhu. Budeme mu pravidelně platit úroky, ale naše celkové dluhové zatížení bylo restrukturalizováno." # todo: NEW TRANSLATION
 greece_debt.12.a: "Nezbytné uspořádání" # todo: NEW TRANSLATION
 greece_debt.13.t: "Dohoda o dluhu odmítnuta" # todo: NEW TRANSLATION
 greece_debt.13.d: "[FROM.GetName] odmítl náš návrh na převzetí části dluhu. Musíme hledat úlevu jinde nebo najít jiné způsoby, jak řešit naši finanční situaci." # todo: NEW TRANSLATION
 greece_debt.13.a: "Najdeme jinou cestu" # todo: NEW TRANSLATION
 greece_debt.14.t: "Obdržena protinabídka" # todo: NEW TRANSLATION
 greece_debt.14.d: "[FROM.GetName] je ochoten převzít náš dluh, ale pouze za vyšší úrokovou sazbu, než jsme původně navrhli. Vyšší náklady na obsluhu tohoto dluhu musíme zvážit oproti okamžité úlevě, kterou poskytuje." # todo: NEW TRANSLATION
 greece_debt.14.a: "Přijmout vyšší sazbu" # todo: NEW TRANSLATION
 greece_debt.14.b: "Podmínky jsou nepřijatelné" # todo: NEW TRANSLATION
 greece_debt.16.t: "Dluh požadován k okamžitému splacení" # todo: NEW TRANSLATION
 greece_debt.16.d: "[FROM.GetName] požaduje okamžité splacení části dluhu, který mu dlužíme. Nesplnění této povinnosti poškodí naše vztahy a mezinárodní důvěryhodnost." # todo: NEW TRANSLATION
 greece_debt.16.a: "Zaplatit, co požadují" # todo: NEW TRANSLATION
 greece_debt.16.b: "Nemůžeme si to dovolit" # todo: NEW TRANSLATION
 greece_debt.17.t: "Dluh odpuštěn" # todo: NEW TRANSLATION
 greece_debt.17.d: "[FROM.GetName] velkoryse odepsal část dluhu, který mu dlužíme. Tato nečekaná úleva značně zmírňuje naše finanční břemeno." # todo: NEW TRANSLATION
 greece_debt.17.a: "Vítaná úleva" # todo: NEW TRANSLATION
 greece_debt.18.t: "Řecký dluh zcela splacen" # todo: NEW TRANSLATION
 greece_debt.18.d: "[FROM.GetName] nám plně splatil veškerý nesplacený dluh. Přicházíme sice o zdroj úrokových příjmů, ale splacení dokládá fiskální odpovědnost." # todo: NEW TRANSLATION
 greece_debt.18.a: "Účet je vyrovnán" # todo: NEW TRANSLATION
 greece_debt.2.t: "Návrh na výměnu dluhu" # todo: NEW TRANSLATION
 greece_debt.2.d: "[FROM.GetName] žádá, abychom zvážili převzetí části jejich státního dluhu prostřednictvím výměnného ujednání." # todo: NEW TRANSLATION
 GRE_eligible_creditor_tt: "Nesmí být ve válce s Řeckem, musí být nezávislý, nesmí být již věřitelem a musí mít vztah vyšší než -50" # todo: NEW TRANSLATION
 GRE_debt_ratio_above_50_tt: "Poměr dluhu k HDP musí být vyšší než 50 %" # todo: NEW TRANSLATION
 GRE_debt_ratio_above_90_tt: "Poměr dluhu k HDP musí být vyšší než 90 %" # todo: NEW TRANSLATION
 GRE_propose_debt_deal_accept_tt: "Věřitel převezme část našeho dluhu, čímž sníží náš státní dluh výměnou za pravidelné úrokové platby." # todo: NEW TRANSLATION
 GRE_creditor_call_in_debt_accept_tt: "Řecko splatí požadovanou část dluhu, který nám dluží." # todo: NEW TRANSLATION
 GRE_creditor_call_in_debt_reject_tt: "Řecko odmítne zaplatit, což zhorší vztahy mezi našimi národy." # todo: NEW TRANSLATION
 GRE_retry_outreach_accept_tt: "Souhlasí s naší nabídkou, čímž zlepší vztahy a posílí naše směřování." # todo: NEW TRANSLATION
 GRE_repay_10pct_tt: "Splatit 10 % dluhu dluženého tomuto věřiteli." # todo: NEW TRANSLATION
 GRE_call_in_20pct_tt: "Požadovat splacení 20 % řeckého dluhu, který držíme." # todo: NEW TRANSLATION
 GRE_forgive_25pct_tt: "Odpustit 25 % dluhu, který nám Řecko dluží." # todo: NEW TRANSLATION
 GRE_eastmed_jor_accept_tt: "Jordánsko se připojí k fóru, zlepší vztahy a otevře s námi obchodní dohodu." # todo: NEW TRANSLATION
 GRE_eastmed_jor_reject_tt: "Jordánsko odmítne, což nás připraví o politický kapitál." # todo: NEW TRANSLATION
 GRE_interest_rate_below_cap_tt: "Úroková sazba musí být nižší než 8 %" # todo: NEW TRANSLATION
 GRE_interest_rate_above_min_tt: "Úroková sazba musí být vyšší než 0,5 %" # todo: NEW TRANSLATION
 GRE_creditor_holds_significant_debt_tt: "Držíme více než §Y10 miliard§! v §Yřeckém dluhu§! (aktuálně §Y[?GRE_debt_held_by_us|1] miliard§!)" # todo: NEW TRANSLATION
 GRE_deferred_to_creditors_tt: "Odložené náklady rozdělené poměrně mezi věřitelské státy" # todo: NEW TRANSLATION
 GRE_prospecting_category: "Průzkum řeckých zdrojů" # todo: NEW TRANSLATION
 GRE_prospecting_category_desc: "Naše geologické průzkumy odhalily slibná ložiska nerostů na řecké pevnině i ostrovech. Se správnou těžební technologií a infrastrukturou můžeme tato naleziště proměnit v produktivní doly." # todo: NEW TRANSLATION
 GRE_prospecting_unlocked_tt: "Odemkne rozhodnutí týkající se průzkumu zdrojů" # todo: NEW TRANSLATION
 GRE_halkidiki_prospecting: "Rozšíření těžby na Chalkidiki" # todo: NEW TRANSLATION
 GRE_halkidiki_prospecting_desc: "Poloostrov Chalkidiki v severním Řecku ukrývá významná ložiska chromu a zlata. Těžební oblasti Skouries a Stratoni lze rozšířit pomocí moderních těžebních metod." # todo: NEW TRANSLATION
 GRE_peloponnese_bauxite: "Těžba bauxitu na Peloponésu" # todo: NEW TRANSLATION
 GRE_peloponnese_bauxite_desc: "Doly Distomon a oblast Fokis obsahují značné zásoby bauxitu. Postupná těžba může po desetiletí zásobovat náš hliníkový průmysl." # todo: NEW TRANSLATION
 GRE_thessaly_mining: "Těžba niklu v Thesálii" # todo: NEW TRANSLATION
 GRE_thessaly_mining_desc: "Lateritová ložiska niklu u Larymny v Thesálii představují jedny z největších zásob niklu v Evropě. Systematická těžba přinese vedlejší produkty v podobě oceli a chromu." # todo: NEW TRANSLATION
 GRE_aegean_mining: "Těžba nerostů na egejských ostrovech" # todo: NEW TRANSLATION
 GRE_aegean_mining_desc: "Sopečné ostrovy Egejského moře, zejména Milos a Naxos, obsahují ložiska bentonitu, perlitu a smirku, která lze komerčně využít." # todo: NEW TRANSLATION
 GRE_pipeline_infrastructure: "Potrubní infrastruktura" # todo: NEW TRANSLATION
 GRE_pipeline_infrastructure_desc: "Síť potrubí propojující průzkumná naleziště se stávajícími rafineriemi a průmyslovými odběrateli učiní těžbu komerčně životaschopnou a začlení zdrojový sektor do širší řecké energetické sítě." # todo: NEW TRANSLATION
 greece.28.t: "Návrh čínské průmyslové investice" # todo: NEW TRANSLATION
 greece.28.d: "[FROM.GetName] nás oslovilo s nabídkou investice do své průmyslové základny. Navrhují, abychom financovali výstavbu továrny v Thesálii výměnou za obchodní vliv na jejich rostoucí ekonomiku." # todo: NEW TRANSLATION
 greece.28.a: "Rozumná investice" # todo: NEW TRANSLATION
 greece.28.b: "O řecký průmysl nemáme zájem" # todo: NEW TRANSLATION
 greece.29.t: "Čínská investice přijata" # todo: NEW TRANSLATION
 greece.29.d: "Čína souhlasila s financováním našeho průmyslového rozvoje v Thesálii. Z čínského kapitálu bude postavena nová továrna, což prohloubí naše hospodářské vztahy s Pekingem." # todo: NEW TRANSLATION
 greece.29.a: "Vynikající zprávy" # todo: NEW TRANSLATION
 greece.30.t: "Čínská investice odmítnuta" # todo: NEW TRANSLATION
 greece.30.d: "Čína odmítla náš návrh průmyslové investice. Výstavbu stále můžeme provést sami, ovšem na vlastní náklady." # todo: NEW TRANSLATION
 greece.30.a: "Budeme to financovat sami" # todo: NEW TRANSLATION
 greece.30.b: "Bez zahraničního kapitálu je projekt neuskutečnitelný" # todo: NEW TRANSLATION
 greece.31.t: "Návrh investice do přístavu Pireus" # todo: NEW TRANSLATION
 greece.31.d: "[FROM.GetName] navrhuje čínskou investici do přístavu Pireus. Společnost COSCO Shipping by získala kontrolní podíl v přístavní správě a financovala rozsáhlou modernizaci infrastruktury výměnou za obchodní kontrolu nad jedním z nejvytíženějších přístavů Středomoří." # todo: NEW TRANSLATION
 greece.31.a: "Pireus je strategické aktivum hodné investice" # todo: NEW TRANSLATION
 greece.31.b: "Do řeckých přístavů investovat nebudeme" # todo: NEW TRANSLATION
 greece.32.t: "COSCO získává podíl v Pireu" # todo: NEW TRANSLATION
 greece.32.d: "Čína souhlasila s investicí do Pirea. COSCO Shipping bude financovat rozšíření přístavu a přidá nové dokové kapacity a infrastrukturu. Čínský vliv v naší ekonomice roste, stejně jako kapacita našeho přístavu." # todo: NEW TRANSLATION
 greece.32.a: "Přístavu se bude dařit" # todo: NEW TRANSLATION
 greece.33.t: "Čína odmítá investici do Pirea" # todo: NEW TRANSLATION
 greece.33.d: "Čína odmítla investovat do Pirea. Přístav stále můžeme modernizovat sami, avšak bez čínského kapitálu veškeré náklady poneseme z naší pokladny." # todo: NEW TRANSLATION
 greece.33.a: "Pireus zmodernizujeme sami" # todo: NEW TRANSLATION
 greece.33.b: "Přístav může počkat" # todo: NEW TRANSLATION
 greece.34.t: "Návrh rozvoje řeckých nemovitostí" # todo: NEW TRANSLATION
 greece.34.d: "[FROM.GetName] nás oslovilo s návrhem na rozvoj komerčních nemovitostí v regionu Attika. Čínští developeři by financovali výstavbu nákupních center, hotelů a kancelářských budov výměnou za dlouhodobé pronájmy a obchodní přítomnost." # todo: NEW TRANSLATION
 greece.34.a: "Řecké nemovitosti jsou lákavou investicí" # todo: NEW TRANSLATION
 greece.34.b: "O řecké nemovitosti nemáme zájem" # todo: NEW TRANSLATION
 greece.35.t: "Čínská investice do nemovitostí přijata" # todo: NEW TRANSLATION
 greece.35.d: "Čínští developeři budou financovat rozsáhlé stavební projekty po celé Attice. Nové komerční a obytné kapacity promění celý region, čínská obchodní přítomnost však výrazně vzroste." # todo: NEW TRANSLATION
 greece.35.a: "Výstavba začíná" # todo: NEW TRANSLATION
 greece.36.t: "Čína odmítá investici do nemovitostí" # todo: NEW TRANSLATION
 greece.36.d: "Čína odmítla investovat do našeho realitního sektoru. Rozvoj stále můžeme uskutečnit s využitím domácího kapitálu." # todo: NEW TRANSLATION
 greece.36.a: "Rozvineme to sami" # todo: NEW TRANSLATION
 greece.36.b: "Rozvoj může počkat" # todo: NEW TRANSLATION
 greece.37.t: "Návrh celostátní investice do infrastruktury" # todo: NEW TRANSLATION
 greece.37.d: "[FROM.GetName] navrhuje komplexní infrastrukturní program po celém Řecku. Čínské státní podniky by financovaly letiště, továrny a výstavbu kanceláří po celé zemi výměnou za značný obchodní vliv." # todo: NEW TRANSLATION
 greece.37.a: "Řecko je připravené na rozvoj" # todo: NEW TRANSLATION
 greece.37.b: "Rozsah tohoto návrhu nás znepokojuje" # todo: NEW TRANSLATION
 greece.38.t: "Čínská celostátní investice přijata" # todo: NEW TRANSLATION
 greece.38.d: "Čína se zavázala k celostátnímu infrastrukturnímu programu. Po celém Řecku budou na čínské náklady vybudována nová letiště, továrny a komerční budovy." # todo: NEW TRANSLATION
 greece.38.a: "Partnerství, které promění zemi" # todo: NEW TRANSLATION
 greece.39.t: "Čína odmítá celostátní investici" # todo: NEW TRANSLATION
 greece.39.d: "Čína odmítla náš návrh celostátní investice. Infrastrukturu stále můžeme vybudovat sami, náklady však budou značné." # todo: NEW TRANSLATION
 greece.39.a: "Vybudujeme ji sami" # todo: NEW TRANSLATION
 greece.39.b: "Bez zahraniční podpory je to příliš nákladné" # todo: NEW TRANSLATION
 greece.40.t: "Návrh rozvoje Ellinika" # todo: NEW TRANSLATION
 greece.40.d: "[FROM.GetName] navrhuje čínskou investici do areálu bývalého mezinárodního letiště Elliniko. Obrovský projekt pobřežního rozvoje by proměnil opuštěné ranveje v moderní městskou čtvrť a přinesl zlepšení infrastruktury po celé Attice a Peloponésu." # todo: NEW TRANSLATION
 greece.40.a: "Projekt Elliniko má velký potenciál" # todo: NEW TRANSLATION
 greece.40.b: "Do tohoto projektu investovat nebudeme" # todo: NEW TRANSLATION
 greece.41.t: "Čínská investice do Ellinika přijata" # todo: NEW TRANSLATION
 greece.41.d: "Čína souhlasila s financováním přestavby Ellinika. Zlepšení infrastruktury se rozšíří po Attice i Peloponésu." # todo: NEW TRANSLATION
 greece.41.a: "Průlomový projekt začíná" # todo: NEW TRANSLATION
 greece.42.t: "Čína odmítá investici do Ellinika" # todo: NEW TRANSLATION
 greece.42.d: "Čína odmítla investovat do přestavby Ellinika. Projekt stále můžeme uskutečnit z vlastních prostředků, nebo můžeme plány odložit." # todo: NEW TRANSLATION
 greece.42.a: "Budeme to financovat sami" # todo: NEW TRANSLATION
 greece.42.b: "Projekt prozatím odložíme" # todo: NEW TRANSLATION
 greece.46.t: "Žádost o půjčku od ICBC" # todo: NEW TRANSLATION
 greece.46.d: "[FROM.GetName] oslovilo Industrial and Commercial Bank of China s žádostí o značnou půjčku. Navrhují, aby ICBC poskytla úvěr ve výši 10 % jejich HDP, čímž by se prohloubily naše finanční vazby s Athénami a rozšířila přítomnost čínského bankovnictví ve Středomoří." # todo: NEW TRANSLATION
 greece.46.a: "Poskytnout půjčku" # todo: NEW TRANSLATION
 greece.46.b: "Riziko je příliš vysoké" # todo: NEW TRANSLATION
 greece.47.t: "Půjčka od ICBC schválena" # todo: NEW TRANSLATION
 greece.47.d: "Industrial and Commercial Bank of China schválila naši žádost o půjčku. Do naší pokladny proudí čínský kapitál a přináší značný příliv prostředků. Naše finanční závislost na Pekingu se prohlubuje, okamžitá úleva je však vítaná." # todo: NEW TRANSLATION
 greece.47.a: "Prostředky jsou zajištěny" # todo: NEW TRANSLATION
 greece.48.t: "Půjčka od ICBC zamítnuta" # todo: NEW TRANSLATION
 greece.48.d: "Čína odmítla poskytnout půjčku od ICBC. Bez podpory čínského bankovnictví musíme hledat alternativní zdroje kapitálu nebo hospodařit v rámci našich současných možností." # todo: NEW TRANSLATION
 greece.48.a: "Nějak si poradíme" # todo: NEW TRANSLATION
 GRE_drydock_modernization: "Modernizace suchých doků" # todo: NEW TRANSLATION
 GRE_drydock_modernization_desc: "Investice do moderních zařízení suchých doků rozšířily kapacitu oprav a výstavby plavidel a umožnily Řeckému námořnictvu efektivněji modernizovat svou flotilu." # todo: NEW TRANSLATION
 GRE_strategic_autonomy_idea: "Strategická autonomie" # todo: NEW TRANSLATION
 GRE_strategic_autonomy_idea_desc: "Řecko není podřízeno žádnému jedinému bloku a obchoduje i vyjednává se všemi. Svoboda hrát na všechny strany přináší lepší podmínky a určitou ochranu před tlakem velmocí." # todo: NEW TRANSLATION
 GRE_euro_adopted: "Přijetí eura" # todo: NEW TRANSLATION
 GRE_euro_adopted_desc: "Přijetí eura Řeckem začlenilo jeho ekonomiku do širší eurozóny, snížilo náklady na půjčky a usnadnilo obchod za cenu nezávislé měnové politiky." # todo: NEW TRANSLATION
 GRE_manpads_expansion_idea: "Rozšíření MANPADS" # todo: NEW TRANSLATION
 GRE_manpads_expansion_idea_desc: "Rozšířený program přenosných protiletadlových systémů zlepšil protiletadlové schopnosti a snížil výrobní náklady díky domácímu výzkumu a výrobě." # todo: NEW TRANSLATION
 GRE_port_modernization: "Modernizace přístavů" # todo: NEW TRANSLATION
 GRE_port_modernization_desc: "Modernizovaná přístavní infrastruktura rozšířila kapacitu doků a zlepšila efektivitu námořní výstavby v řeckých loděnicích." # todo: NEW TRANSLATION
 GRE_research_hubs_idea: "Vojenská výzkumná centra" # todo: NEW TRANSLATION
 GRE_research_hubs_idea_desc: "Byla založena specializovaná vojenská výzkumná centra, která urychlují vývoj obranných technologií a inovace zbraňových systémů." # todo: NEW TRANSLATION
 GRE_research_hubs_idea_2: "Pokročilá výzkumná centra" # todo: NEW TRANSLATION
 GRE_research_hubs_idea_2_desc: "Rozšíření programu výzkumných center nyní zahrnuje vedle vojenských aplikací také vesmírné technologie, čímž rozšiřuje technologické hranice Řecka." # todo: NEW TRANSLATION
 GRE_greater_state_control_authoritarian: "Autoritářská státní kontrola" # todo: NEW TRANSLATION
 GRE_greater_state_control_authoritarian_desc: "Stát převzal přímou kontrolu nad klíčovými hospodářskými odvětvími, čímž urychlil výstavbu za cenu politické svobody a byrokratické pružnosti." # todo: NEW TRANSLATION
 GRE_com_liberators: "Osvoboditelé lidu" # todo: NEW TRANSLATION
 GRE_com_liberators_desc: "Řadami vojáků proudí revoluční zápal. Vojáci bojující na domácí půdě jsou posíleni svou věcí, udeří tvrději a pevněji brání revoluci." # todo: NEW TRANSLATION
 GRE_western_outreach: "Západní angažovanost" # todo: NEW TRANSLATION
 GRE_western_outreach_desc: "Řecká diplomacie vede cílenou kampaň dvoustranné a mnohostranné spolupráce v rámci NATO a Evropské unie. Západní závazek: [?GRE_western_commitment|0]" # todo: NEW TRANSLATION
 GRE_franco_hellenic_strategic_partnership: "Francouzsko-řecké strategické partnerství" # todo: NEW TRANSLATION
 GRE_franco_hellenic_strategic_partnership_desc: "Strategické partnerství z roku 2021 otevřelo cestu k hluboké obranně-průmyslové spolupráci s Francií. Řecké zbrojovky vyrábějí podle společných standardů, francouzské výzkumné bonusy proudí do našich vojenských programů a politická koordinace se prohloubila." # todo: NEW TRANSLATION
 GRE_franco_greek_mutual_defense: "Francouzsko-řecká doložka vzájemné obrany" # todo: NEW TRANSLATION
 GRE_franco_greek_mutual_defense_desc: "Článek 2 rozšířeného partnerství zavazuje Francii k obraně řeckého území. Tato doložka zajišťuje řeckou bezpečnost na úrovni spojeneckých závazků a spojuje dvě největší středomořské armády do jediné strategické jednotky." # todo: NEW TRANSLATION
 GRE_eastmed_trilateral_idea: "Trojstranné partnerství Řecko–Izrael–Kypr" # todo: NEW TRANSLATION
 GRE_eastmed_trilateral_idea_desc: "Společná prohlášení, cvičení a sdílené zpravodajské informace spojily tři námořnictva a letectva do jediného operačního prostoru napříč východním Středomořím." # todo: NEW TRANSLATION
 GRE_eastmed_gas_forum_idea: "Člen Fóra pro plyn ve východním Středomoří" # todo: NEW TRANSLATION
 GRE_eastmed_gas_forum_idea_desc: "Řecká námořní doprava využívá přednostní trasy, regionální toky plynu obohacují řecké rafinerie a doky a Athény si udržují stálé místo u stolu pro energetiku východního Středomoří." # todo: NEW TRANSLATION
 GRE_3plus1_pact: "Strategický dialog 3+1" # todo: NEW TRANSLATION
 GRE_3plus1_pact_desc: "Americké zapojení završuje trojstranné partnerství ve východním Středomoří. Společná cvičení, výměna zpravodajských informací a strukturovaný strategický dialog zvyšují operační schopnosti řeckých ozbrojených sil v námořní i vzdušné oblasti." # todo: NEW TRANSLATION
 GRE_eu_political_anchor_idea: "Kotva zakládajícího člena EU" # todo: NEW TRANSLATION
 GRE_eu_political_anchor_idea_desc: "Řecko využívá politickou váhu zakládajícího člena EU, těží z obchodu uvnitř bloku a z pozice zkušeného člena ovlivňuje agendu Bruselu." # todo: NEW TRANSLATION
 GRE_eu_strategic_compass_idea: "Zastánce Strategického kompasu EU" # todo: NEW TRANSLATION
 GRE_eu_strategic_compass_idea_desc: "Řecká diplomacie prosazuje Evropský strategický kompas, volá po autonomii vůči dobrodružství velmocí zvenčí a zároveň stále těsněji propojuje obranně-průmyslovou základnu EU." # todo: NEW TRANSLATION
 greece.556.t: "Opětovné potvrzení západního směřování" # todo: NEW TRANSLATION
 greece.556.d: "Řecko oznámilo komplexní opětovné potvrzení svého západního směřování a zahájilo trvalou kampaň dvoustranné a mnohostranné spolupráce v rámci NATO a Evropské unie. Athény dávají spojencům i soupeřům najevo, že jejich strategická budoucnost je pevně zakotvena na Západě." # todo: NEW TRANSLATION
 greece.556.a: "Vítané potvrzení" # todo: NEW TRANSLATION
 greece.556.b: "Řecko drží linii" # todo: NEW TRANSLATION
 greece.556.c: "Vezměte to na vědomí" # todo: NEW TRANSLATION
 greece.557.t: "Řecký návrh: Strategické partnerství" # todo: NEW TRANSLATION
 greece.557.d: "Athény navrhují komplexní strategické partnerství zahrnující obranně-průmyslovou spolupráci, sladění zahraniční politiky a bezpečnost východního Středomoří. Řecká vláda je ochotna vložit značný politický kapitál, aby se partnerství stalo vlajkovou lodí francouzské středomořské politiky." # todo: NEW TRANSLATION
 greece.557.a: "Podepsat partnerství" # todo: NEW TRANSLATION
 greece.557.b: "Návrh odmítnout" # todo: NEW TRANSLATION
 greece.558.t: "Francie přijímá partnerství" # todo: NEW TRANSLATION
 greece.558.d: "Paříž přijala strategické partnerství. Okamžitě vznikají společné pracovní skupiny pro obranně-průmyslovou spolupráci, přičemž francouzské know-how proudí do řeckých zbrojovek a výzkumných programů. Partnerství je představováno jako vzor evropské dvoustranné spolupráce." # todo: NEW TRANSLATION
 greece.558.a: "Historická dohoda" # todo: NEW TRANSLATION
 greece.559.t: "[FROM.GetName] odmítá partnerství" # todo: NEW TRANSLATION
 greece.559.d: "[FROM.GetName] diplomaticky a s taktem informuje Athény, že partnerství nemůže pokračovat. Politické náklady však zůstávají skutečné." # todo: NEW TRANSLATION
 greece.559.a: "Politováníhodný neúspěch" # todo: NEW TRANSLATION
 greece.560.t: "Řecký návrh: Trojstranné partnerství ve východním Středomoří" # todo: NEW TRANSLATION
 greece.560.d: "Athény navrhují formální trojstranný rámec s Izraelem a Kyprem: společná cvičení, sdílené zpravodajské informace a koordinované diplomatické postoje. Toto uspořádání by proměnilo dlouhodobou spolupráci v závaznou institucionální podobu." # todo: NEW TRANSLATION
 greece.560.a: "Podepsat trojstrannou dohodu" # todo: NEW TRANSLATION
 greece.560.b: "Návrh odmítnout" # todo: NEW TRANSLATION
 greece.561.t: "Izrael se připojuje k trojstrannému partnerství" # todo: NEW TRANSLATION
 greece.561.d: "Izrael podepsal trojstranný rámec. Na operační úrovni vznikají společná plánovací pracoviště a dohody o sdílení izraelských zpravodajských informací se rozšiřují na řecké protějšky." # todo: NEW TRANSLATION
 greece.561.a: "Vítejte, naši partneři" # todo: NEW TRANSLATION
 greece.563.t: "Řecký návrh: Trojstranné partnerství ve východním Středomoří" # todo: NEW TRANSLATION
 greece.563.d: "Athény navrhují formální trojstranný rámec s Kyprem a Izraelem. Pro Nikósii je nabídka v podstatě samozřejmá, formální podpis však stále musí přijít." # todo: NEW TRANSLATION
 greece.563.a: "Samozřejmě podepíšeme" # todo: NEW TRANSLATION
 greece.563.b: "Předat k dalšímu přezkoumání" # todo: NEW TRANSLATION
 greece.564.t: "Kypr se připojuje k trojstrannému partnerství" # todo: NEW TRANSLATION
 greece.564.d: "Nikósie podepsala trojstranný rámec s Athénami a Jeruzalémem. Tři vlády nyní působí pod jednotným diplomatickým a operačním zastřešením ve východním Středomoří." # todo: NEW TRANSLATION
 greece.564.a: "Jednotné východní Středomoří" # todo: NEW TRANSLATION
 greece.566.t: "Řecký návrh: Doložka vzájemné obrany podle článku 2" # todo: NEW TRANSLATION
 greece.566.d: "Athény navrhují přirozené završení strategického partnerství: závaznou doložku vzájemné obrany podle vzoru článku 5, zapsanou přímo do dvoustranné smlouvy. Územní celistvost Řecka by poprvé byla smluvně zaručena významnou evropskou mocností." # todo: NEW TRANSLATION
 greece.566.a: "Podepsat doložku vzájemné obrany" # todo: NEW TRANSLATION
 greece.566.b: "Odmítnout. Příliš daleko, příliš rychle." # todo: NEW TRANSLATION
 greece.567.t: "Francie podepisuje doložku vzájemné obrany" # todo: NEW TRANSLATION
 greece.567.d: "Paříž podepsala. Článek 2 rozšířené smlouvy zavazuje Francii k obraně řeckého území. Diplomatické otřesy sahají daleko za hranice Středomoří." # todo: NEW TRANSLATION
 greece.567.a: "Nová éra evropské bezpečnosti" # todo: NEW TRANSLATION
 greece.568.t: "Francie odmítá doložku vzájemné obrany" # todo: NEW TRANSLATION
 greece.568.d: "Paříž odmítla doložku vzájemné obrany jako příliš velký krok pro současnou francouzskou strategickou doktrínu. Stávající partnerství zůstává, závazná bezpečnostní záruka se však neuskuteční." # todo: NEW TRANSLATION
 greece.568.a: "Vážný neúspěch" # todo: NEW TRANSLATION
 greece.569.t: "Řecký návrh: Strategický dialog 3+1" # todo: NEW TRANSLATION
 greece.569.d: "Athény, Nikósie a Jeruzalém společně navrhují formalizovat strategický dialog 3+1 se Spojenými státy, rámec podporovaný ministerstvem zahraničí a zaměřený na energetickou bezpečnost, námořní spolupráci a boj proti terorismu ve východním Středomoří." # todo: NEW TRANSLATION
 greece.569.a: "Zapojit se do dialogu" # todo: NEW TRANSLATION
 greece.569.b: "Odložit zapojení" # todo: NEW TRANSLATION
 greece.570.t: "Spojené státy se zapojují do formátu 3+1" # todo: NEW TRANSLATION
 greece.570.d: "Washington se formálně zapojil do strategického dialogu 3+1. Americké závazky v oblasti výcviku a cvičení se rozšiřují po celém východním Středomoří a řecké ozbrojené síly získávají přístup k nové úrovni společných operačních zkušeností." # todo: NEW TRANSLATION
 greece.570.a: "Nezbytné partnerství" # todo: NEW TRANSLATION
 greece.571.t: "Spojené státy odkládají zapojení" # todo: NEW TRANSLATION
 greece.571.d: "Ministerstvo zahraničí signalizuje, že americkou pozornost pohlcují širší strategické priority. Rámec 3+1 není opuštěn, jeho formální rozšíření se však v současném období neuskuteční." # todo: NEW TRANSLATION
 greece.571.a: "Vrátíme se k tomu později" # todo: NEW TRANSLATION
 greece.572.t: "Řecko: Pilíř Západu" # todo: NEW TRANSLATION
 greece.572.d: "Postupné smlouvy, prohlášení a partnerství proměnily Řecko z okrajového člena NATO v nosný pilíř západní diplomacie ve východním Středomoří. Athény nyní hovoří z pozice strukturální váhy jak v Bruselu, tak ve Washingtonu." # todo: NEW TRANSLATION
 greece.572.a: "Pilíř Západu" # todo: NEW TRANSLATION
 greece.572.b: "Spojenec znovu na výši" # todo: NEW TRANSLATION
 greece.572.c: "Nová strategická geometrie" # todo: NEW TRANSLATION
 greece.575.t: "FSRU v Alexandrupoli zahajuje provoz" # todo: NEW TRANSLATION
 greece.575.d: "Plovoucí jednotka pro skladování a znovuzplyňování zakotvená v Alexandrupoli zahájila komerční provoz a ukotvila odklon jihovýchodní Evropy od ruského plynu z potrubí. Řecká půda je nyní vstupní branou pro zásobování kontinentu energií." # todo: NEW TRANSLATION
 greece.575.a: "Athény rozsvěcují světlo" # todo: NEW TRANSLATION
 greece.575.b: "Užitečný nový uzel" # todo: NEW TRANSLATION
 greece.577.t: "Pireus se stává kotvou koridoru IMEC" # todo: NEW TRANSLATION
 greece.577.d: "Hlavy států v Dillí, Rijádu a Bruselu potvrdily Pireus jako evropský konec Ekonomického koridoru Indie–Blízký východ–Evropa. Očekává se, že objem překládky přes Attiku se během desetiletí ztrojnásobí." # todo: NEW TRANSLATION
 greece.577.a: "Od Egejského moře k Indickému oceánu" # todo: NEW TRANSLATION
 greece.577.b: "Logistický milník" # todo: NEW TRANSLATION
 greece.580.t: "Řecký návrh: Plán spolupráce z Prespy" # todo: NEW TRANSLATION
 greece.580.d: "Athény navrhují strukturovaný plán rozšíření Prespanské dohody: odvětvové pracovní skupiny, dohodu o volném obchodu a společné plánování infrastruktury. Tento balíček by propojil naše ekonomiky na celou generaci." # todo: NEW TRANSLATION
 greece.580.a: "Skopje je připraveno navázat na Prespu" # todo: NEW TRANSLATION
 greece.580.b: "Za stávající rámec nepůjdeme" # todo: NEW TRANSLATION
 greece.581.t: "Severní Makedonie schvaluje plán" # todo: NEW TRANSLATION
 greece.581.d: "Skopje podepsalo plán spolupráce z Prespy. Pracovní skupiny se během několika týdnů sejdou v Soluni a dohoda o volném obchodu je nyní na dosah." # todo: NEW TRANSLATION
 greece.581.a: "Vynikající zprávy" # todo: NEW TRANSLATION
 greece.582.t: "Řecký návrh: Rámec práv menšin" # todo: NEW TRANSLATION
 greece.582.d: "Athény navrhují formální rámec práv řecky mluvící komunity v jižní Albánii: jazykové školy, restituci majetku a přeshraniční kulturní spolupráci výměnou za vřelejší dvoustranné vztahy." # todo: NEW TRANSLATION
 greece.582.a: "Tirana rámec přijímá" # todo: NEW TRANSLATION
 greece.582.b: "S těmito podmínkami nemůžeme souhlasit" # todo: NEW TRANSLATION
 greece.583.t: "Albánie podepisuje rámec práv menšin" # todo: NEW TRANSLATION
 greece.583.d: "Dohoda byla podepsána v Tiraně. Řecky mluvící komunity v jižní Albánii získávají konkrétní ochranu a ministerské kanály s Athénami se prohlubují." # todo: NEW TRANSLATION
 greece.583.a: "Diplomatický úspěch" # todo: NEW TRANSLATION
 greece.584.t: "Řecký návrh: Dohoda o výlučných ekonomických zónách ve východním Středomoří" # todo: NEW TRANSLATION
 greece.584.d: "Athény navrhují dvoustranné vymezení výlučných ekonomických zón s Káhirou. Dohoda by vyřešila překrývající se námořní nároky a vyloučila konkurenční aktéry ze společného rozvoje zdrojů mořského dna." # todo: NEW TRANSLATION
 greece.584.a: "Káhira dohodu podepisuje" # todo: NEW TRANSLATION
 greece.584.b: "Káhira prozatím odmítá" # todo: NEW TRANSLATION
 greece.585.t: "Egypt ratifikuje dohodu o výlučných ekonomických zónách" # todo: NEW TRANSLATION
 greece.585.d: "Egypt ratifikoval vymezení námořních hranic. Společné průzkumy vymezené zóny začnou během měsíce a obchodní ustanovení spojená s dohodou vstoupí v platnost." # todo: NEW TRANSLATION
 greece.585.a: "Základní dohoda" # todo: NEW TRANSLATION
 greece.586.t: "Řecký návrh: Italsko-řecká osa Středomoří" # todo: NEW TRANSLATION
 greece.586.d: "Athény navrhují Římu komplexní partnerství: koordinovanou průmyslovou politiku, společné programy loděnic a sladěné postoje k bezpečnosti ve Středomoří. Oba poloostrovy by v Bruselu vystupovaly jako jeden celek." # todo: NEW TRANSLATION
 greece.586.a: "Řím s partnerstvím souhlasí" # todo: NEW TRANSLATION
 greece.586.b: "Řím zdvořile odmítá" # todo: NEW TRANSLATION
 greece.587.t: "Itálie se připojuje ke středomořské ose" # todo: NEW TRANSLATION
 greece.587.d: "Itálie podepsala partnerský dokument. V Athénách budou během tohoto čtvrtletí ustaveny společné průmyslové výbory a rámec pro společnou výrobu válečných lodí." # todo: NEW TRANSLATION
 greece.587.a: "Osa je zrozena" # todo: NEW TRANSLATION
 greece.588.t: "Řecký návrh: Rozšíření plynovodu IGB" # todo: NEW TRANSLATION
 greece.588.d: "Athény navrhují postupné rozšíření řecko-bulharského propojovacího plynovodu a navazujícího terminálu v Alexandrupoli. Sofie by získala diverzifikované dodávky plynu, zatímco Athény by získávaly tranzitní příjmy napříč Balkánem." # todo: NEW TRANSLATION
 greece.588.a: "Sofie podepisuje plán rozšíření" # todo: NEW TRANSLATION
 greece.588.b: "Sofie návrh odmítá" # todo: NEW TRANSLATION
 greece.589.t: "Bulharsko schvaluje rozšíření plynovodu" # todo: NEW TRANSLATION
 greece.589.d: "Sofie schválila rozšíření. Výstavba má začít během této sezóny; očekává se, že tok plynu na sever do Bulharska i na jih přes řecké terminály se zdvojnásobí." # todo: NEW TRANSLATION
 greece.589.a: "Strategický koridor" # todo: NEW TRANSLATION
 greece.590.t: "Řecký návrh: Řecko-saúdská strategická rada" # todo: NEW TRANSLATION
 greece.590.d: "Athény navrhují Nejvyšší radu strategické spolupráce s Rijádem: obranně-průmyslovou spolupráci, spoluinvestice státních fondů a pravidelný dialog ministrů. Království by získalo středomořského partnera a Řecko kapitál." # todo: NEW TRANSLATION
 greece.590.a: "Rijád přijímá" # todo: NEW TRANSLATION
 greece.590.b: "Rijád odmítá" # todo: NEW TRANSLATION
 greece.591.t: "Saúdská Arábie svolává radu" # todo: NEW TRANSLATION
 greece.591.d: "Nejvyšší rada strategické spolupráce uspořádala své ustavující zasedání v Athénách. Saúdské státní fondy oznámily první tranši investic do řeckého průmyslu." # todo: NEW TRANSLATION
 greece.591.a: "Průlomové partnerství" # todo: NEW TRANSLATION
 greece.592.t: "Řecký návrh: Řecko-emirátský investiční pakt" # todo: NEW TRANSLATION
 greece.592.d: "Athény navrhují strukturovaný investiční pakt s Abú Zabí: daňové podmínky pro emirátské fondy, přístup do bezcelních zón v Attice a vzájemné řecké investice do logistické sítě v Zálivu." # todo: NEW TRANSLATION
 greece.592.a: "Abú Zabí přijímá" # todo: NEW TRANSLATION
 greece.592.b: "Abú Zabí odmítá" # todo: NEW TRANSLATION
 greece.593.t: "Spojené arabské emiráty podepisují pakt" # todo: NEW TRANSLATION
 greece.593.d: "Abú Zabí podepsalo pakt. Emirátský kapitál začíná proudit do řecké logistiky a průmyslu a řecké firmy získávají přednostní přístup k infrastruktuře logistických uzlů v Zálivu." # todo: NEW TRANSLATION
 greece.593.a: "Vynikající" # todo: NEW TRANSLATION
 greece.594.t: "Řecký návrh: Přistoupení k Fóru pro plyn ve východním Středomoří" # todo: NEW TRANSLATION
 greece.594.d: "Athény navrhují, aby se Ammán připojil k Fóru pro plyn ve východním Středomoří, přičemž Řecko by jeho přistoupení sponzorovalo. Vznikla by regionální energetická struktura rozprostírající se od Levanty po Egejské moře." # todo: NEW TRANSLATION
 greece.594.a: "Ammán pozvání přijímá" # todo: NEW TRANSLATION
 greece.594.b: "Ammán odmítá" # todo: NEW TRANSLATION
 greece.595.t: "Jordánsko se připojuje k Fóru pro plyn ve východním Středomoří" # todo: NEW TRANSLATION
 greece.595.d: "Jordánsko formalizovalo své přistoupení k Fóru pro plyn ve východním Středomoří. Geografický i politický dosah této instituce se nyní rozhodně rozšiřuje napříč východním Středomořím." # todo: NEW TRANSLATION
 greece.595.a: "Diplomatické vítězství" # todo: NEW TRANSLATION
 GRE_lobby_eu_partners: "Lobovat u partnerů v EU" # todo: NEW TRANSLATION
 GRE_lobby_eu_partners_desc: "Vynaložit politický kapitál na trvalou lobbistickou kampaň v Evropské unii: dvoustranné návštěvy, poziční dokumenty a výměnu ústupků s cílem prosadit řecké diplomatické priority a nahromadit západní závazek." # todo: NEW TRANSLATION
