 GRE_eastern_neighborhood_setup_tt: "Otevírá složku vztahů s Tureckem a Kyprem; zasévá řecký vliv mezi kyperské komunity." # todo: NEW TRANSLATION
 GRE_cypriot_economic_integration_reject_tt: "Kypr odmítá hlubší hospodářskou integraci; řeckokyperská dynamika slábne." # todo: NEW TRANSLATION
 GRE_northern_outreach_accept_tt: "Severní Kypr přijímá řecké investice a kulturní výměnu; vliv a dynamika rostou." # todo: NEW TRANSLATION
 GRE_british_bases_accord_accept_tt: "Británie předává suverénní základny Řecku; Řecko poskytuje britským silám vojenský přístup. Území může být plně integrováno, jakmile bude dostatečně vysoká spolupráce místního obyvatelstva." # todo: NEW TRANSLATION
 GRE_british_bases_accord_reject_tt: "Británie odmítá předat suverénní základny." # todo: NEW TRANSLATION
 GRE_integrate_sovereign_bases: "Integrovat suverénní základny" # todo: NEW TRANSLATION
 GRE_integrate_sovereign_bases_desc: "Akrotiri a Dekelia k nám přišly jako okupovaná půda, nikoli jako řecké území. Získání místního obyvatelstva na naši stranu a vyřešení správy nám umožní prohlásit základny za plnou a trvalou součást Řecké republiky." # todo: NEW TRANSLATION
 GRE_sovereign_bases_compliance_tt: "Spolupráce v suverénních základnách přesahuje 80 %" # todo: NEW TRANSLATION
 GRE_integrate_sovereign_bases_effect_tt: "Řecko získá core na suverénních základnách" # todo: NEW TRANSLATION
 GRE_defense_innovation_funding_tt: "Každý výzkumný grant je financován z pokladny (při odkladu plateb se odkládá do státního dluhu)" # todo: NEW TRANSLATION
 GRE_cyprus_reunification_accept_tt: "Kypr a Severní Kypr se připojí k Řecku a budou plně integrovány jako řecké území s core." # todo: NEW TRANSLATION
 GRE_cyprus_reunification_reject_tt: "Kyperské vlády zůstanou nezávislé; malý postih názoru vůči Řecku." # todo: NEW TRANSLATION
