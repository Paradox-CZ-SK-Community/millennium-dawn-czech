 GRE_defense_exporter: "Vývozce obranné techniky" # todo: NEW TRANSLATION
 GRE_f35_partner: "Partner programu F-35" # todo: NEW TRANSLATION
 GRE_aegean_encroachment: "Pronikání v Egejském moři" # todo: NEW TRANSLATION
 GRE_refused_debt_call_opinion: "Odmítnutý požadavek na splacení dluhu" # todo: NEW TRANSLATION
 GRE_debt_forgiven_opinion: "Dluh odpuštěn" # todo: NEW TRANSLATION
 GRE_debt_fully_repaid_opinion: "Dluh plně splacen" # todo: NEW TRANSLATION
 GRE_forgave_debt_opinion: "Odpustili náš dluh" # todo: NEW TRANSLATION
 GRE_debt_crisis: "Dluhová krize" # todo: NEW TRANSLATION
 GRE_debt_crisis_desc: "Řecko má 300 miliard dolarů externího dluhu – jeden z největších na světě. To nám vytváří obrovský problém, protože dluh rychle roste a způsobuje masivní problémy naší ekonomice. Budeme muset najít způsob, jak vyřešit dluhovou problematiku, než se to vymkne kontrole." # todo: NEW TRANSLATION
 GRE_constitutional_crisis: "Ústavní krize" # todo: NEW TRANSLATION
 GRE_constitutional_crisis_desc: "Ústava je to poslední, s čím se musíme vypořádat, než se definitivně upevníme u moci a znovu vybudujeme Řecko tak, jak si to představujeme." # todo: NEW TRANSLATION
 GRE_austerity_idea: "Napětí úsporného programu" # todo: NEW TRANSLATION
 GRE_austerity_idea_desc: "Jak budeme nadále zavádět úsporná opatření, obyvatelé Řecka budou čím dál více nespokojení. Tato nespokojenost roste a nakonec povede k nepokojům, pokud nebudeme rychle jednat. Čím horší bude situace, tím pravděpodobnější bude, že se vyvine v něco mnohem vážnějšího." # todo: NEW TRANSLATION
 GRE_drift_modifiers: "Politický posun" # todo: NEW TRANSLATION
 GRE_debt_modifier: "Dluhová krize" # todo: NEW TRANSLATION
 GRE_debt_modifier_desc: "Dluhová krize má tvrdší dopady v závislosti na tom, jak hospodaříme s penězi. Nicméně, utrácení více peněz na vytváření pracovních míst nám v dlouhodobém horizontu přinese prospěch." # todo: NEW TRANSLATION
 GRE_economy_modifier: "Řecká ekonomika" # todo: NEW TRANSLATION
 GRE_press_opposition: "Opozice médiím" # todo: NEW TRANSLATION
 GRE_press_opposition_desc: "Média nás nezobrazila v nejlepším světle od doby, co jsme obnovili pořádek ve vládě, avšak je logické, že slabí se bojí silných." # todo: NEW TRANSLATION
 GRE_one_party: "Stát s jednou stranou" # todo: NEW TRANSLATION
 GRE_one_party_desc: "Po prohlášení, že KKE je jedinou politickou stranou povolenou v Řecku, máme moc dělat cokoli, co chceme, avšak za cenu krve, kterou je nutné prolít, aby byli naši lidé podřízeni." # todo: NEW TRANSLATION
 GRE_reorganize_army_idea: "Přeorganizace armády" # todo: NEW TRANSLATION
 GRE_reorganize_army_idea_desc: "Nemůžeme prostě omezit výdaje na armádu do stavu funkční deprivace. Může přijít čas, kdy budeme potřebovat silné ozbrojené síly, a pro tuto eventualitu zajistíme, že naše armáda bude loajální a připravená." # todo: NEW TRANSLATION
 GRE_cracked_foundation_desc: "Základy státu byly až tolik zpochybněny, že pokud budeme pokračovat v současném kurzu, mohlo by nás postihnout hrozné nové povstání. \n\n§RPokud naše stabilita klesne pod 30 %, bude nám hrozit revoluce v Řecku!§!" # todo: NEW TRANSLATION
 GRE_militarist_education_idea: "Militaristické vzdělávání" # todo: NEW TRANSLATION
 GRE_militarist_education_idea_desc: "Vzdělávací systém do svých osnov vštívil hodnoty vojenské, což umožňuje větší připravenost státu pro náhlé útoky." # todo: NEW TRANSLATION
 GRE_elam: "Obnovení Národní lidové fronty" # todo: NEW TRANSLATION
 GRE_elam_desc: "Národní lidová fronta významně rozšířila své snahy napříč všemi oblastmi, aby ovlivnila myšlení průměrného voliče. Podezříváme, že Řecko je příčinou tohoto 'rušení'." # todo: NEW TRANSLATION
 GRE_debt_crisis_category: "Dluhová krize [GRE.GetAdjective]" # todo: NEW TRANSLATION
 GRE_debt_crisis_category_desc: "Navzdory hospodářskému růstu náš dluh stále narůstá, ať už kvůli neefektivním vládním výdajům, splatným dluhopisům nebo pravidelným rozpočtovým schodkům. Musíme se s dluhem vypořádat dříve, než se stane krizí, nebo jej proměnit v nástroj zajišťující naši pokračující prosperitu v novém tisíciletí.\n\nAktuální poměr HDP k dluhu: [?debt_ratio|%Y]\nAktuální §Ydluh držený věřiteli§!: $$[?GRE_total_creditor_debt|0]\n" # todo: NEW TRANSLATION
 GRE_austerity_tension_mission: "Napětí kvůli úsporám" # todo: NEW TRANSLATION
 GRE_austerity_tension_mission_desc: "Škrty ve výdajích a zvyšování daní rozzlobily obyvatele. Ke zmírnění napětí musíme snížit náš jednotný poměr dluhu pod §Y75 %§!. Pokaždé, když čas vyprší, protesty se zhorší, a pokud na vrcholu přerostou v nepokoje, země sklouzne do plné dluhové krize." # todo: NEW TRANSLATION
 GRE_debt_crisis_mission: "Dluhová krize [GRE.GetAdjective]" # todo: NEW TRANSLATION
 GRE_debt_crisis_mission_desc: "Úsporná opatření selhala a trhy v nás ztratily důvěru. Musíme snížit náš jednotný poměr dluhu pod §Y75 %§! škrty ve výdajích a přesunutím dluhu na zahraniční věřitele. Pokaždé, když čas vyprší, vláda za to zaplatí a naše selhání může stáhnout celou eurozónu s námi." # todo: NEW TRANSLATION
 GRE_austerity_placate_decision: "Uklidnit protestující" # todo: NEW TRANSLATION
 GRE_austerity_placate_decision_desc: "Kontakt vlády s veřejností a cílená pomoc mohou otupit veřejnou frustraci. Snížení viditelného tlaku úsporných opatření by mělo pomoci obnovit stabilitu a znovu snížit napětí." # todo: NEW TRANSLATION
 GRE_slash_public_spending_decision: "Omezit veřejné výdaje" # todo: NEW TRANSLATION
 GRE_slash_public_spending_decision_desc: "Plošné škrty v ministerstvech, veřejných mzdách a důchodech. Účetnictví bude vypadat lépe, ale lidé pocítí každé euro. Sníží náš státní dluh o §Y5 %§!." # todo: NEW TRANSLATION
 GRE_emergency_tax_hikes_decision: "Nouzové zvýšení daní" # todo: NEW TRANSLATION
 GRE_emergency_tax_hikes_decision_desc: "Zvyšte DPH a daně z příjmu, abyste zacelili rozpočtovou díru. Příjmy budou skutečné, stejně jako hněv vůči vládnoucí straně. Sníží náš státní dluh o §Y4 %§!." # todo: NEW TRANSLATION
 GRE_privatization_drive_decision: "Privatizační tažení" # todo: NEW TRANSLATION
 GRE_privatization_drive_decision_desc: "Rozprodejte státní majetek, od přístavů po energetické podniky, tomu, kdo nabídne nejvíce. Jednorázový příjem, který odbory rychle neodpustí. Sníží náš státní dluh o §Y8 %§!." # todo: NEW TRANSLATION
 GRE_unified_ratio_below_75_tt: "Náš §Yjednotný poměr dluhu§! je nižší než §Y75 %§! (aktuálně §Y[?GRE_unified_debt_ratio|-1%]§!)" # todo: NEW TRANSLATION
 GRE_buys_mission_time_tt: "§GPřidá 30 dní k aktivní dluhové misi§!" # todo: NEW TRANSLATION
 GRE_austerity_mission_active: "\nAktuální napětí kvůli úsporám činí §R[gre_austerity_tension]§!" # todo: NEW TRANSLATION
 GRE_generic_decisions_category: "Politická rozhodnutí [GRE.GetNameWithFlag]" # todo: NEW TRANSLATION
 GRE_generic_decisions_category_desc: "Politická rozhodnutí dostupná řecké vládě." # todo: NEW TRANSLATION
 GRE_rename_istanbul: "Přejmenovat Istanbul" # todo: NEW TRANSLATION
 GRE_rename_istanbul_desc: "Po získání Konstantinopole pod řeckou kontrolu vláda formálně obnovuje historický název města. Přejmenování má hluboký kulturní význam a zvyšuje národní morálku." # todo: NEW TRANSLATION
 GRE_archipelago_air_base_rapid_repair: "Program rychlých oprav leteckých základen" # todo: NEW TRANSLATION
 GRE_archipelago_air_base_rapid_repair_desc: "Zřízení specializovaných opravárenských týmů a předem rozmístěného vybavení na ostrovních leteckých základnách znamená, že škody způsobené nepřátelskými údery lze opravit rychleji a naše letectvo zůstane provozuschopné." # todo: NEW TRANSLATION
 GRE_archipelago_anti_air_rapid_repair: "Protokoly údržby protiletadlových baterií" # todo: NEW TRANSLATION
 GRE_archipelago_anti_air_rapid_repair_desc: "Mobilní údržbářské týmy na ostrovních stanovištích protivzdušné obrany se standardizovanými součástkami a výcvikem by nám umožnily rychleji obnovovat poškozené baterie a udržet síť protivzdušné obrany neporušenou." # todo: NEW TRANSLATION
 GRE_archipelago_bunker_repair_protocols: "Sbor pro opravy ostrovních opevnění" # todo: NEW TRANSLATION
 GRE_archipelago_bunker_repair_protocols_desc: "Specializované ženijní jednotky napříč souostrovím se zaměří na rychlou obnovu bunkrů. Poškozená opevnění lze rychle vrátit do plné účinnosti." # todo: NEW TRANSLATION
 GRE_archipelago_naval_base_repair_protocols: "Iniciativa údržby námořních základen" # todo: NEW TRANSLATION
 GRE_archipelago_naval_base_repair_protocols_desc: "Předem rozmístěný opravárenský materiál a kvalifikovaní technici v ostrovních námořních zařízeních znamenají, že poškozenou přístavní infrastrukturu lze opravit rychleji a námořní operace udržet v chodu." # todo: NEW TRANSLATION
 GRE_archipelago_coastal_obstacle_network: "Síť pobřežních překážek" # todo: NEW TRANSLATION
 GRE_archipelago_coastal_obstacle_network_desc: "Podvodní překážky, minová pole a zátarasy v možných výsadkových zónách by výrazně ztížily každému nepřátelskému námořnímu útoku dosažení našich břehů." # todo: NEW TRANSLATION
 GRE_archipelago_supply_disruption: "Odepření zásobování v klíčových územích" # todo: NEW TRANSLATION
 GRE_archipelago_supply_disruption_desc: "Předem naplánované narušení logistiky na našich ostrovních jádrových územích by okupačnímu nepříteli ztížilo udržování zásobovacích linií a využívání místních zdrojů." # todo: NEW TRANSLATION
 GRE_archipelago_coastal_battery_expansion: "Program rozšíření pobřežních baterií" # todo: NEW TRANSLATION
 GRE_archipelago_coastal_battery_expansion_desc: "Rozšíření našich pobřežních dělostřeleckých stanovišť nad rámec toho, co terén běžně umožňuje. Ostrovní geografie by neměla omezovat naši schopnost bránit pobřeží." # todo: NEW TRANSLATION
 GRE_archipelago_island_fortress_expansion: "Program rozšíření ostrovních pevností" # todo: NEW TRANSLATION
 GRE_archipelago_island_fortress_expansion_desc: "Financování ženijních prací k výstavbě bunkrů nad rámec současných terénních limitů. Naše ostrovy mohou podporovat silnější opevnění, než předpokládala dosavadní doktrína." # todo: NEW TRANSLATION
 GRE_archipelago_attrition_doctrine: "Doktrína opotřebení v souostroví" # todo: NEW TRANSLATION
 GRE_archipelago_attrition_doctrine_desc: "Kodifikace taktiky využívající ostrovní terén k vyčerpání každé útočící síly. Nepřátelské jednotky v otevřeném prostoru by čelily vyšším ztrátám a neustálému obtěžování z našich připravených pozic." # todo: NEW TRANSLATION
 GRE_archipelago_supply_interdiction: "Operace proti zásobování na ostrovech" # todo: NEW TRANSLATION
 GRE_archipelago_supply_interdiction_desc: "Výcvik a rozmístění jednotek k aktivnímu odepření přístupu nepřátelských sil k místním zdrojům. Každý nepřítel působící na našich ostrovech by zjistil, že jeho zdroje zásobování jsou systematicky odříznuty." # todo: NEW TRANSLATION
 GRE_archipelago_missile_battery_expansion: "Rozšíření ostrovní protiraketové obrany" # todo: NEW TRANSLATION
 GRE_archipelago_missile_battery_expansion_desc: "Dodatečné financování výstavby stanovišť protiraketové obrany nad běžné terénní limity napříč souostrovím. Větší investice do ženijních prací znamenají, že překonáme obvyklá omezení terénu." # todo: NEW TRANSLATION
 GRE_archipelago_air_defense_expansion: "Rozšířená síť protivzdušné obrany" # todo: NEW TRANSLATION
 GRE_archipelago_air_defense_expansion_desc: "Zvýšení stavebního limitu protiletadlových zařízení nad standardní terénní omezení. I menší ostrovy by mohly získat husté pokrytí protivzdušnou obranou." # todo: NEW TRANSLATION
 GRE_archipelago_decision_active: "Program obrany souostroví již probíhá" # todo: NEW TRANSLATION
