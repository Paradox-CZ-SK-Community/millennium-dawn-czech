 GRE_hide_financial_records: "Zfalšované finanční záznamy" # todo: NEW TRANSLATION
 GRE_lie_about_financial_records_decision: "Příznivě upravit finanční záznamy" # todo: NEW TRANSLATION
 GRE_lie_about_financial_records_decision_desc: "Navzdory našemu trvalému hospodářskému růstu nám zastaralá měna a další ekonomické problémy brání dokončit hospodářské dohody s Evropskou unií." # todo: NEW TRANSLATION
 GRE_negotiate_debt_swap_deals_decision: "Vyjednat dohody o výměně dluhu" # todo: NEW TRANSLATION
 GRE_negotiate_debt_swap_deals_decision_desc: "Zahajte jednání se zahraniční mocností o restrukturalizaci našeho dluhu prostřednictvím měnových swapů. Přesunutím našich závazků na centrální banku jiného státu bychom mohli získat výhodnější podmínky splácení." # todo: NEW TRANSLATION
 GRE_defer_payments_decision: "Odložit platby za zaměření" # todo: NEW TRANSLATION
 GRE_defer_payments_decision_desc: "Místo okamžitého placení za hospodářské programy odložme náklady do našeho státního dluhu. Zachováme tím prostředky ve státní pokladně za cenu rostoucích závazků." # todo: NEW TRANSLATION
 GRE_do_not_defer_payments_decision: "Obnovit přímé platby" # todo: NEW TRANSLATION
 GRE_do_not_defer_payments_decision_desc: "Přestaňme odkládat náklady a vraťme se k přímému placení hospodářských programů ze státní pokladny." # todo: NEW TRANSLATION
 GRE_austerity_tension1: "Nepatrné" # todo: NEW TRANSLATION
 GRE_austerity_tension2: "Mírné" # todo: NEW TRANSLATION
 GRE_austerity_tension3: "Rostoucí" # todo: NEW TRANSLATION
 CYP_NCY_diplomatic_category: "Jednání o znovusjednocení Kypru" # todo: NEW TRANSLATION
 GRE_CYP_category: "Kyprský spor" # todo: NEW TRANSLATION
 GRE_CYP_category_desc: "Od roku 1974 je Kypr rozdělen mezi Tureckou republicu severního Kypru a Republiku Kypr, po státní puči podpořené Řeckem, která téměř sjednotila ostrov s Řeckem. V reakci na to Turecko napadlo, což vedlo k trvajícímu rozdělení Kypru – druhému nejdelšímu vojenskému okupaci v moderní éře, překonanému jen okupací v Izraeli.\n\n§YŘecko-kyperská síla:§! §C[?145.GRE_SUPPORT]%§!\n§YTurecko-kyperská síla:§! §C[?146.GRE_SUPPORT]%§!\n\n§CPrvní strana, která dosáhne síly 100, unifikuje Kypr pod svou vládou!§!" # todo: NEW TRANSLATION
 GRE_guarantee_turkish_property: "Spark Unification Protests across Cyprus" # todo: NEW TRANSLATION
 GRE_guarantee_turkish_property_desc: "Vyvoláním touhy po sjednocení vytvoříme chaos po celém Kypru, dáváme nám příležitost posílit naši sílu, zatímco Turci řeší protesty" # todo: NEW TRANSLATION
 GRE_guarantee_turkish_property_support_tt: "§HŘečtí Kypřané§! mají více než §H50 %§! síly" # todo: NEW TRANSLATION
 GRE_please_south: "Uspokojit řecké Kyprany" # todo: NEW TRANSLATION
 GRE_please_south_desc: "Pokračováním v uspokojování řeckých Kypranů zajistíme, že budou pravděpodobněji podporovat naši snahu o unifikaci Kypru a konečný cíl Enos." # todo: NEW TRANSLATION
 GRE_please_north: "Propaganda proti Turecku" # todo: NEW TRANSLATION
 GRE_please_north_desc: "Posilování a šíření propagandy mezi severními Kypranами, aby jimi nebyli ovlivněni Řeky, je klíčové pro náš úspěch v regionu." # todo: NEW TRANSLATION
 TUR_CYP_incite_riot: "Vyvolat nepokoje na jižním Kypru" # todo: NEW TRANSLATION
 TUR_CYP_incite_riot_desc: "Je čas začít vyvolávat nepokoje na jižním Kypru, aby Řekové nezískali politický vliv v regionu." # todo: NEW TRANSLATION
 TUR_CYP_propaganda_north: "Propaganda proti Řekům na severu Kypru" # todo: NEW TRANSLATION
 TUR_CYP_propaganda_north_desc: "Posilovat a šířit propagandu mezi severními Kyprany, aby nebyli ovlivněni Řeky, je pro náš úspěch v regionu zásadní." # todo: NEW TRANSLATION
 TUR_CYP_propaganda_south: "Propaganda proti Řekům na jihu Kypru" # todo: NEW TRANSLATION
 TUR_CYP_propaganda_south_desc: "Posilovat a šířit propagandu mezi jižními Kyprany, aby nebyli ovlivněni Řeky, je pro náš úspěch v regionu zásadní." # todo: NEW TRANSLATION
 TUR_attack_CYP_strength: "Útok na sílu řecko-kyperské armády" # todo: NEW TRANSLATION
 TUR_attack_CYP_strength_desc: "Útokem na sílu řecko-kyperské armády zajistíme, že nebudou moci získat politický vliv v regionu." # todo: NEW TRANSLATION
 GRE_attack_turkish_strength: "Útok na sílu turecko-kyperské armády" # todo: NEW TRANSLATION
 GRE_attack_turkish_strength_desc: "Útokem na sílu turecko-kyperské armády zajistíme, že nebudou moci získat politický vliv v regionu." # todo: NEW TRANSLATION
 GRE_south_50_TT: "§HŘecko-kyperská síla bude na 55§!" # todo: NEW TRANSLATION
