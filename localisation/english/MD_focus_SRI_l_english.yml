 news.91.t: "Srílanská občanská válka končí" # todo: NEW TRANSLATION
 news.91.d: "Srílanská vláda vyhlásila úplné vítězství nad Tygři osvobození Tamilského Ílamu. V závěrečné sérii ofenziv na severovýchodě vládní síly obsadily poslední bašty Tygrů. V posledních dnech války byli zbývající tamilští bojovníci obklíčeni podél lagun a džunglí Mullaitivu. Odříznuti od možnosti úniku byli při všech pokusech o útěk po moři zadrženi. Vedení Tygrů, dlouho považované za nedotknutelné, bylo podle zpráv zabito v posledních hodinách konfliktu. Prezident [SRI.GetName] při projevu v parlamentu prohlásil, že národ byl „osvobozen od terorismu“. Prozatím vlajka lva vlaje nad celým ostrovem bez odporu." # todo: NEW TRANSLATION
 news.91.a: "Mír… za jakou cenu." # todo: NEW TRANSLATION
 news.92.t: "Osvobození Tamilského Ílamu Tamilskými tygry" # todo: NEW TRANSLATION
 news.92.d: "To, co kdysi bývalo válkou opotřebovávacího charakteru, skončilo. Tygři osvobození Tamilského Ílamu zvítězili. V posledních dnech konfliktu se poslední bašty srílanského státu v zemích Tamilského Ílamu zhroutily pod neúnavným náporem. Zásobovací linie se zhroutily, letiště shořela a kdysi obávaná armáda se ocitla obklíčená a opuštěná. Tygři Tamilského Ílamu zvítězili z džungle nikoli jako povstalci, ale jako vůdci. Sen o Tamilském Ílamu, zapsaný krví a obětmi, se konečně stal skutečností." # todo: NEW TRANSLATION
 news.92.a: "Zajímavé." # todo: NEW TRANSLATION
