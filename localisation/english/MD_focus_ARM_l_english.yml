 arm_sargsyan.13.a: "Vpřed do budoucnosti s Evropou" # todo: NEW TRANSLATION
 arm_sargsyan.14.t: "EU odmítla naši podporu" # todo: NEW TRANSLATION
 arm_sargsyan.14.d: "Země EU ignorovaly naši akci a nepodpořily nás" # todo: NEW TRANSLATION
 arm_sargsyan.14.a: "Dobře" # todo: NEW TRANSLATION
 arme.12.t: "Kontaktování oligarchů" # todo: NEW TRANSLATION
 arme.12.d: "Během nadcházejícího kongresu, kde probíhají diskuse mezi vládou a oligarchy, navrhl Gagik Tsarukyan, že nám pomůže získat kontrolu nad opozicí vytvořením neformální koalice mezi stranami." # todo: NEW TRANSLATION
 arme.12.a: "Jistě!" # todo: NEW TRANSLATION
 arme.12.b: "Promiň, ne." # todo: NEW TRANSLATION
 ARM_armenia_serj_idea: "Arménie Serža Sargsyana" # todo: NEW TRANSLATION
 ARM_armenia_serj_idea_desc: "Zastřešující koncept zahrnující celý politický systém Serže Sargsyana během jeho prezidentství (2008–2018): sítě vojenské loajality, kampaně vlasteneckého vzdělávání, důchodová reforma, monopoly podporované oligarchy a selektivní westernizace pod ruským bezpečnostním deštníkem. Skutečné účinky Sargsyanova režimu se projevují prostřednictvím propojených podřízených idejí odrážejících různé stránky jeho modelu vládnutí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_tig_reforms: "Reformy Tigrana Sargsjana" # todo: NEW TRANSLATION
 ARM_tig_reforms_desc: "Premiér Tigran Sargsyan (2008–2014) zavádí technokratické hospodářské reformy: přestavbu důchodového systému, cílenou daňovou reformu, modernizaci infrastruktury a zvýšení administrativní efektivity. Tyto reformy vytvářejí krátkodobý růst, ale ukazují se jako politicky nepopulární, zejména mezi důchodci a pracovníky čelícími krácení dávek.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_loyal_military_idea: "Věrná armáda Serža Sargsyana" # todo: NEW TRANSLATION
 ARM_loyal_military_idea_desc: "Arménská armáda se stává základem Sargsyanova politického systému: důstojníci a generálové, kteří pod ním sloužili během karabašské války, tvoří loajální elitu povyšovanou do politických a podnikatelských funkcí. Toto spojení armády a oligarchie zajišťuje politickou stabilitu a zároveň podřizuje vojenskou nezávislost prezidentské kontrole.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_westernization_of_society_idea: "Západnění společnosti" # todo: NEW TRANSLATION
 ARM_westernization_of_society_idea_desc: "Sargsyan povoluje selektivní západní kulturní vliv: západní móda, hudba, filmy a sociální média volně pronikají do Arménie. Vysokoškolské vzdělání se stále častěji získává na západních univerzitách a proudí sem bohatství diaspory. Tato kulturní westernizace koexistuje s politickým autoritarismem a zachováním ruské vojenské dominance, čímž vytváří hybridní společnost.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_armenian_turkish_cooperation_idea: "Arméno-turecká spolupráce" # todo: NEW TRANSLATION
 ARM_increased_food_imports_idea: "Zvýšené dovoz potravin" # todo: NEW TRANSLATION
 ARM_increased_food_imports_idea_desc: "Sargsyanovi oligarchové monopolizují dovoz pšenice, cukru a paliv ze sousedních zemí, zejména z Ruska. Kontrola tohoto dovozního kartelu obohacuje oligarchii, udržuje ceny uměle vysoké a činí Arménii závislou na ruských prostřednících. Zemědělská reforma a konkurence ohrožují oligarchické monopolní zisky.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_loyal_generalitet: "Vojenský loajalismus" # todo: NEW TRANSLATION
 ARM_loyal_generalitet_desc: "Sargsyanův důstojnický sbor se stává privilegovanou kastou: vysoké platy důstojníků, přednostní přístup k podnikání a přednost ve státních zakázkách upevňují spojení armády a oligarchie. Generálové přecházejí do vedení civilních podniků; loajalita k Sargsyanovi se stává jediným požadavkem pro postup, čímž se vojenská profesionalita podřizuje politické poslušnosti.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_pension_reform_idea: "Důchodová reforma" # todo: NEW TRANSLATION
 ARM_pension_reform_idea_desc: "Povinná kapitalizační důchodová reforma Tigrana Sargsyana z roku 2014 snižuje závazky státu vůči důchodcům tím, že přesouvá riziko na pracovníky a investiční trhy. Reforma vytváří příjmy, ale ukazuje se jako hluboce nepopulární: důchodci čelí krácení dávek, pracovníci nedůvěřují soukromým penzijním fondům a v reakci na vnímanou krádež jistoty na stáří propukají stávky.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_patriotic_educ_spir: "Patriotické vzdělávání" # todo: NEW TRANSLATION
 ARM_patriotic_educ_spir_desc: "Sargsyanův režim začleňuje nacionalistické vzdělávání do arménských škol: vojenský výcvik, glorifikaci karabašské války a důraz na arménskou civilizační jedinečnost. Toto vlastenecké vzdělávání vychovává generaci spjatou s národní vojenskou mocí a ochotnou podřídit občanské svobody bezpečnostním potřebám.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_patriotic_educmore_spir: "Patriotické vzdělávání" # todo: NEW TRANSLATION
 ARM_patriotic_educmore_spir_desc: "Pokročilé stadium vlasteneckého vzdělávání: vojenská služba se stává téměř povinným očekáváním pro mládež; akademické osnovy zdůrazňují strategická studia a bojové ctnosti; státní prostředky proudí do programů oslavujících arménské válečnické tradice. Vzdělávací systém se stává nástrojem vojenské mobilizace.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_monopolies_supported_idea: "Podporované monopolie" # todo: NEW TRANSLATION
 ARM_monopolies_supported_idea_desc: "Sargsyanův systém výslovně chrání oligarchické monopoly na paliva, obilí a stavebnictví: státní zakázky proudí ke schváleným oligarchům, zahraniční konkurence je blokována a ceny zůstávají uměle vysoké. Hospodářská liberalizace zůstává pouze rétorikou, zatímco oligarchické kartely ovládají základní komodity a odčerpávají zisky od arménských spotřebitelů.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_nationalistic_educ_spir: "Nacionalistické vzdělávání" # todo: NEW TRANSLATION
 ARM_nationalistic_educ_spir_desc: "Ideologicky důraznější varianta vlasteneckého vzdělávání: arménský nacionalismus se stává nejen hrdostí na dědictví, ale i agresivním prosazováním etnických a historických nároků. Učebnice zdůrazňují arménské územní vzpomínky; mezinárodní spory jsou vykládány nacionalistickou optikou; soupeřící nacionalistická hnutí se stávají státem schválenými občanskými vzory.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HSerž Sargsyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
