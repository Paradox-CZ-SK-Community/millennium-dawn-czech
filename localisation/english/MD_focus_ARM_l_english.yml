 arm_economic.24.t: "Západní partneři odcházejí" # todo: NEW TRANSLATION
 arm_economic.24.d: "Jakmile padly první výstřely, sešly se správní rady. Tabákové společnosti, banky, telekomunikační operátoři, těžební koncese a univerzitní programy najednou utlumují své arménské operace. Někteří uvádějí sankce, jiní pojištění a nikdo neřekne, kdy se hodlají vrátit." # todo: NEW TRANSLATION
 arm_economic.24.a: "Stejně nikdy neměli v úmyslu zůstat." # todo: NEW TRANSLATION
 arm_economic.25.t: "Moskva zavírá ústavy" # todo: NEW TRANSLATION
 arm_economic.25.d: "Nejprve se zastavilo financování výzkumu a poté bylo univerzitní pobočce oznámeno, aby pozastavila přijímací řízení. Desetiletí společných laboratoří a výměn zaměstnanců jsou rušena administrativním dopisem a vědci, kteří je vybudovali, již hledají práci v zahraničí." # todo: NEW TRANSLATION
 arm_economic.25.a: "Obnovíme je sami." # todo: NEW TRANSLATION
 arm_economic.2.t: "Osud banky HSBC" # todo: NEW TRANSLATION
 arm_economic.2.d: "Banka HSBC působí na našem území od devadesátých let; nyní, když naše ekonomika opět ožila, je načase rozhodnout, co s touto bankou uděláme, protože nyní jsme připraveni vyjít bez tolika zahraničních firem jako dříve." # todo: NEW TRANSLATION
 arm_economic.2.a: "Ardšinbank koupí pobočky bank." # todo: CHANGED
 arm_economic.2.b: "Nechme je zůstat v Arménii." # todo: CHANGED
 arm_economic.3.t: "Osud YCRDI" # todo: NEW TRANSLATION
 arm_economic.3.d: "Jerevanský vědecko-výzkumný ústav matematických strojů, slavný ústav založený za sovětské éry, je nyní v úpadku a je důležité rozhodnout o jeho osudu. Rusko nabízí převzít jeho vlastnictví od nás, nebo do něj investujeme ze svých vlastních prostředků a reorganizujeme Univerzitu." # todo: NEW TRANSLATION
 arm_economic.3.a: "Přijmeme nabídku Moskvy." # todo: NEW TRANSLATION
 arm_economic.3.b: "Institut zachráníme." # todo: CHANGED
 arm_economic.4.t: "Osud VEON" # todo: NEW TRANSLATION
 arm_economic.4.d: "VEON je připraven plně vstoupit na telekomunikační trh naší země, ale máme možnost je odkoupit a převést na našeho domácího operátora. Co je pro nás prioritou: zahraniční investice nebo podpora domácích firem?" # todo: NEW TRANSLATION
 arm_economic.4.a: "Nechme je být." # todo: CHANGED
 arm_economic.4.b: "Odkoupíme jejich majetek." # todo: NEW TRANSLATION
 arm_economic.5.t: "Tepelná elektrárna Hrazdan" # todo: NEW TRANSLATION
 arm_economic.5.d: "Tepelná elektrárna Hrazdan je největší tepelná elektrárna v naší zemi, bohužel nastal čas rozhodnout o jejím osudu. Buď ji zcela svěříme do kontroly ruskému Gazpromu, nebo do ní investujeme ze svých vlastních prostředků na její podporu." # todo: NEW TRANSLATION
 arm_economic.5.a: "Nechme to Gazpromu." # todo: CHANGED
 arm_economic.5.b: "Budeme dál investovat." # todo: CHANGED
 arm_economic.6.t: "Osud Shoghakn" # todo: NEW TRANSLATION
 arm_economic.6.d: "Závod Shoghakn byl založen v roce 1971 a nyní ho ovládá izraelská společnost založená našimi spoluobčany. Musíme rozhodnout, zda do závodu budeme investovat, nebo ho svěříme soukromému vlastníku." # todo: NEW TRANSLATION
 arm_economic.6.a: "Nechme je, ať si to odvezou." # todo: CHANGED
 arm_economic.6.b: "Budeme pokračovat v investicích." # todo: NEW TRANSLATION
 arm_economic.7.t: "Jaderná elektrárna" # todo: NEW TRANSLATION
 arm_economic.7.d: "Naše země čelí rozhodnutí, komu svěřit výstavbu nové jaderné elektrárny. Rusko, Spojené státy, nebo možná my sami riskneme investovat peníze do takového objemného projektu?" # todo: NEW TRANSLATION
 arm_economic.7.a: "Spojené státy to zvládnou." # todo: NEW TRANSLATION
 arm_economic.7.b: "Rusko je v tom odborník." # todo: CHANGED
 arm_economic.7.c: "Arméni jsou skuteční jaderní vědci." # todo: NEW TRANSLATION
 arm_economic.8.t: "Bankrot závodu Shoghakn" # todo: NEW TRANSLATION
 arm_economic.8.d: "Majitel závodu Šoghakn oficiálně oznámil, že závod kvůli bankrotu končí." # todo: CHANGED
 arm_economic.8.a: "Jak jsme to mohli nechat stát?" # todo: NEW TRANSLATION
 arm_economic.9.t: "Zangezurský měďno-molybdenový kombinát" # todo: NEW TRANSLATION
 arm_economic.9.d: "Nyní musíme rozhodnout o budoucnosti tohoto závodu, protože je třeba jej zcela rekonstruovat. Rusko nabízí to provést na vlastní náklady a získat nad závodem kontrolu, nebo to postavíme znovu my." # todo: NEW TRANSLATION
 arm_economic.9.a: "Zvládneme to." # todo: CHANGED
 arm_economic.9.b: "Přenechme to Rusku." # todo: CHANGED
 arm_economic.10.t: "ErAZ" # todo: NEW TRANSLATION
 arm_economic.10.d: "ErAZ byl arménský automobilový výrobce v Jerevanu, Arménie, známý hlavně výrobou dodávky RAF-977K od roku 1966 do roku 1996. Plány na založení továrny ErAZ vznikly 31. prosince 1964 Radou ministrů Arménské sovětské socialistické republiky. Osud továrny leží na váhách, buď ji privatizujeme pro ruského investora, nebo ji zrekonstruujeme sami." # todo: NEW TRANSLATION
 arm_economic.10.a: "Zvládneme to." # todo: CHANGED
 arm_economic.10.b: "Přenechme to Rusku." # todo: CHANGED
 arm_economic.11.t: "Pivovar Kotayk" # todo: NEW TRANSLATION
 arm_economic.11.d: "Pivovar Kotayk byl založen v roce 1974 jako státní podnik vládou Arménské sovětské socialistické republiky s omezeným rozsahem výroby. Po dokončení veškerého vybavení zahájil závod v roce 1978 velkovýrobu. Po rozpadu Sovětského svazu převzal pivovar v roce 1995 Gagik Carukjan a začal vyrábět pivo pod značkami Kotayk a Artsakh. V roce 1997 se díky investici ve výši 17 milionů amerických dolarů stal hlavním akcionářem pivovaru Castel Group, jeden z prvních zahraničních investorů v Arménii. Nyní se musíme rozhodnout, zda závod privatizovat, nebo jej podřídit státu." # todo: CHANGED
 arm_economic.11.a: "Zvládneme to." # todo: CHANGED
 arm_economic.11.b: "Přenejme to privatizaci" # todo: NEW TRANSLATION
 arm_economic.12.t: "Jerevanská továrna na brandy Ararat" # todo: NEW TRANSLATION
 arm_economic.12.d: "Jerevanská továrna na brandy Ararat, oficiálně známá jako Továrna na brandy‑víno‑vodka Jerevan Ararat, běžně známá svým proslulým brandem Noy, je jednou z předních arménských společností vyrábějících brandy v Jerevanu, Arménie. Továrna je v žalostném stavu a soukromý investor chce ji obnovit privatizací, nebo se o slavnou továrnu postará stát." # todo: NEW TRANSLATION
 arm_economic.12.a: "Zvládneme to." # todo: CHANGED
 arm_economic.12.b: "Přenejme to privatizaci" # todo: NEW TRANSLATION
 arm_economic.13.t: "Jerevanská společnost na brandy" # todo: NEW TRANSLATION
 arm_economic.13.d: "Jerevanská továrna na brandy, známá především svou slavnou značkou „ArArAt“, je předním arménským podnikem vyrábějícím koňak. Byla založena v roce 1887 za Ruského impéria. Po sovětizaci Arménie se závod stal státním podnikem. V roce 1999 prodala vláda nezávislé Arménie závod francouzské společnosti Pernod Ricard vyrábějící destilované nápoje. Různé koňakové produkty společnosti jsou označovány a propagovány jako ArArAt. Možná budeme chtít své rozhodnutí změnit a převzít kontrolu nad závodem, nebo se nakonec rozhodneme ponechat jej ve vlastnictví francouzského investora." # todo: CHANGED
 arm_economic.13.a: "Převzali bychom továrnu." # todo: NEW TRANSLATION
 arm_economic.13.b: "Nechme je u Francouzů." # todo: CHANGED
 arm_economic.14.t: "ErAZ" # todo: NEW TRANSLATION
 arm_economic.14.d: "Bohužel, závod ErAZ nebyl schopen konkurovat na globálním trhu a musel vyhlásit bankrot. Měli bychom uvažovat o našem vlastním pokusu o oživení závodu?" # todo: NEW TRANSLATION
 arm_economic.14.a: "Ne." # todo: CHANGED
 arm_economic.14.b: "Zvládneme to." # todo: CHANGED
 arm_economic.15.t: "Noví hráči na domácím IT sektoru" # todo: NEW TRANSLATION
 arm_economic.15.d: "Náš IT průmysl byl obohacen o nové společnosti, které zajistí růst našeho IT sektoru." # todo: NEW TRANSLATION
 arm_economic.15.a: "Ano." # todo: CHANGED
 arm_economic.16.t: "Noví hráči na domácím IT sektoru" # todo: NEW TRANSLATION
 arm_economic.16.d: "Náš IT průmysl byl obohacen o nové společnosti, které zajistí růst našeho IT sektoru." # todo: NEW TRANSLATION
 arm_economic.16.a: "Ano." # todo: CHANGED
 arm_economic.17.t: "Pobočka MSU v Arménii" # todo: NEW TRANSLATION
 arm_economic.17.d: "MSU se dohodla s arménským ministerstvem školství na otevření své pobočky v této zemi. Arménští občané nyní získají široký přístup k programům této ruské univerzity." # todo: CHANGED
 arm_economic.17.a: "Skvělé!" # todo: CHANGED
 arm_economic.17.b: "Dobře." # todo: CHANGED
 arm_economic.18.t: "Otevření TUMO" # todo: NEW TRANSLATION
 arm_economic.18.d: "Tumo byl původně koncipován jako centrum pro postsekundární vzdělávání pro teenagery. Sam Simonyan, americký podnikatel arménského původu, a Silva Simonyan se stali zakladateli centra. Nyní byl náš vzdělávací systém rozšířen o další úžasný institut. Slavnostní otevření centra Tumo proběhlo a bylo doprovázeno koncertem rockových hudebníků Serge Tankian a Dorians." # todo: NEW TRANSLATION
 arm_economic.18.a: "Skvělé." # todo: CHANGED
 arm_economic.19.t: "Americká univerzita v Arménii" # todo: NEW TRANSLATION
 arm_economic.19.d: "Americká univerzita v Arménii byla založena v 90. letech a po dokončení budovy Paramaze Avedisyana je nyní plně etablovanou institucí. Arménští občané mohou získat vzdělání podle amerických standardů a mezinárodně uznávané tituly." # todo: CHANGED
 arm_economic.19.a: "Skvěle" # todo: NEW TRANSLATION
 arm_economic.19.b: "Dobře." # todo: CHANGED
 arm_economic.20.t: "ERASMUS+ v Arménii" # todo: NEW TRANSLATION
 arm_economic.20.d: "Arménie se zapojila do programu ERASMUS+ a zahájila plnohodnotnou výměnu studentů s evropskými vzdělávacími institucemi, zejména s francouzskými a německými institucemi, které jsou lídry v tomto programu výměny." # todo: NEW TRANSLATION
 arm_economic.20.a: "Skvělé!" # todo: CHANGED
 arm_economic.20.b: "Dobře." # todo: CHANGED
 arm_economic.21.t: "Škola Ayb" # todo: NEW TRANSLATION
 arm_economic.21.d: "Od založení Ayb Educational Foundation implementovala pokročilé předměty pro středoškoláky, zřídila moderní vzdělávací laboratoře ve školách v různých regionech Arménie, uspořádala oblíbené mezinárodní školní soutěže v Arménii a Artsachu, provedla rekvalifikaci učitelů, vyvinula výukovou metodiku, přeložila některé z nejlepších učebnic světa do arménštiny, vyvinula a otestovala systémy jednotnosti vzdělávání a řízení vzdělávací struktury atd. Na základě pětileté zkušenosti všech těchto vzdělávacích programů a iniciativ bylo rozhodnuto založit novou arménskou školu, která splní všechny moderní požadavky na vzdělání a bude vycházet z nejlepších poznatků o arménském písmu." # todo: NEW TRANSLATION
 arm_economic.21.a: "Skvělé!" # todo: CHANGED
 arm_economic.22.t: "Cambridge v Arménii" # todo: NEW TRANSLATION
 arm_economic.22.d: "Arménie vstoupila do spolupráce s University of Cambridge, aby arménští občané mohli získat britské vzdělání a užívat si ho na stejné úrovni jako ostatní britští studenti." # todo: NEW TRANSLATION
 arm_economic.22.a: "Skvělé!" # todo: CHANGED
 arm_economic.22.b: "Dobře." # todo: CHANGED
 arm_economic.23.t: "AmeriaBank" # todo: NEW TRANSLATION
 arm_economic.23.d: "Ameriabank je nejstarší banka v Arménii. Nyní, díky rozvoji bankovního systému, bude mít banka větší pozitivní dopad na rozvoj naší ekonomiky." # todo: NEW TRANSLATION
 arm_economic.23.a: "Skvělé!" # todo: CHANGED
 arm_economic.1.t: "Otázka tabáku" # todo: NEW TRANSLATION
 arm_economic.1.d: "Tabákové společnosti zaujímají velkou část ekonomiky našeho státu, bohužel se mají příliš dobře, navíc některé zahraniční země mohou skrze ně naši zemi ovlivňovat; možná je čas tuto otázku s nimi vyřešit." # todo: NEW TRANSLATION
 arm_economic.1.a: "Odkoupíme je zpět." # todo: CHANGED
 arm_economic.1.b: "K jejich zajetí použijeme policii." # todo: CHANGED
 arm_economic.1.c: "K jejich zajetí použijeme speciální jednotky armády." # todo: CHANGED
 arm_economic.1.f: "Přijměme jejich úplatek." # todo: CHANGED
 NKR_economy_start: "Ekonomika v novém miléniu" # todo: NEW TRANSLATION
 NKR_economy_start_desc: "Náš krásný region vstupuje do nového milénia, nedávno jsme získali nezávislost a stále se vyrovnáváme s důsledky konfliktu a boje za naši nezávislost." # todo: NEW TRANSLATION
 NKR_economy_police: "Reorganizace policie" # todo: NEW TRANSLATION
 NKR_economy_police_desc: "Máme v plánu provést rozsáhlou reformu policie, vyhnat z ní všechny úplatkáře a zcela aktualizovat její personál." # todo: NEW TRANSLATION
 NKR_economy_corruption: "Vyhnat korupční úředníky" # todo: NEW TRANSLATION
 NKR_economy_corruption_desc: "Všem zkorumpovaným úředníkům bude dáno ultimátum. Nikdo neunikne spravedlnosti. Máme v úmyslu zcela očistit státní úřady od úplatkářů." # todo: CHANGED
 NKR_economy_nalog: "Daňová reforma" # todo: NEW TRANSLATION
 NKR_economy_nalog_desc: "Snížíme daňové zatížení našich občanů a ulevíme naší ekonomice." # todo: CHANGED
 NKR_economy_construction: "Usnadnění vydávání stavebních povolení" # todo: NEW TRANSLATION
 NKR_economy_construction_desc: "Máme v plánu zjednodušit postup vydávání stavebních povolení. Přestaňte občany zahlcovat byrokracií; pokud mohou, ať staví!" # todo: NEW TRANSLATION
 NKR_economy_land: "Distribuce pozemků bez majitele" # todo: NEW TRANSLATION
 NKR_economy_land_desc: "Jsme připraveni doslova rozdělit pozemky našim občanům, aby na nich mohli vytvořit cokoliv, včetně vlastního podnikání." # todo: NEW TRANSLATION
 NKR_economy_selhoz: "Podpora zemědělských producentů" # todo: NEW TRANSLATION
 NKR_economy_selhoz_desc: "Zemědělský sektor bude vždy jedním z našich největších průmyslů a my ho budeme vždy finančně podporovat." # todo: NEW TRANSLATION
 NKR_economy_antimonopol: "Rozpustit antimonopolní úřady" # todo: NEW TRANSLATION
 NKR_economy_antimonopol_desc: "Rozpustíme antimonopolní úřad, není třeba regulovat soutěž v našem malém státě." # todo: NEW TRANSLATION
 NKR_economy_gas: "Provést plynofikaci" # todo: NEW TRANSLATION
 NKR_economy_gas_desc: "Provedeme rozsáhlý program plynofikace po celé republice, aby občané měli neustále přístup k plynu!" # todo: NEW TRANSLATION
 NKR_economy_fermers: "Snížení daní pro zemědělce" # todo: NEW TRANSLATION
 NKR_economy_fermers_desc: "Chceme ještě více podpořit zemědělský průmysl, a proto hodláme snížit daně pro všechny, kteří se zabývají zemědělskými činnostmi." # todo: NEW TRANSLATION
 NKR_economy_copper_gold: "Investice do mědi a zlata" # todo: NEW TRANSLATION
 NKR_economy_copper_gold_desc: "Možná není v naší republice mnoho zdrojů, ale hodláme využít i to, co máme, pro prospěch ekonomiky." # todo: NEW TRANSLATION
 NKR_economy_gornaya: "Těžební průmysl" # todo: NEW TRANSLATION
 NKR_economy_gornaya_desc: "Máme v úmyslu investovat do těžebního průmyslu, protože i v naší situaci můžeme snadno rozvíjet zdroje na území naší republiky." # todo: NEW TRANSLATION
 NKR_economy_support_local: "Podpora místních výrobců" # todo: NEW TRANSLATION
 NKR_economy_support_local_desc: "Podpora našich výrobců je hlavní prioritou našeho ekonomického programu; nemůžeme se spoléhat na dovážené výrobky ve velkém množství." # todo: NEW TRANSLATION
 NKR_economy_invest_climate: "Podpora investičního prostředí" # todo: NEW TRANSLATION
 NKR_economy_invest_climate_desc: "Ačkoli jsme skeptičtí k zahraničním výrobkům, budeme nadále usilovat o vytvoření investičního prostředí a investice nebudou nadbytečné." # todo: NEW TRANSLATION
 NKR_economy_forest: "Lesnický průmysl" # todo: NEW TRANSLATION
 NKR_economy_forest_desc: "Potřebujeme další zdroje paliva a energie. Lesnický průmysl, jako doplněk ke všem ostatním, může být velmi účinný." # todo: NEW TRANSLATION
 NKR_economy_boring_10: "Desetiprocentní růst" # todo: NEW TRANSLATION
 NKR_economy_boring_10_desc: "Naše ekonomika roste zhruba o 10 % ročně; není to největší růst, jakého bychom si přáli, ale naši občané si tuto stabilitu cení víc než vysoké sliby." # todo: NEW TRANSLATION
 NKR_safe_start: "Na stráži Artsakh" # todo: NEW TRANSLATION
 NKR_safe_start_desc: "Naše vlast je v neustálém nebezpečí. Musíme pečlivě promyslet ochranu našich hranic a pamatovat, že naše bezpečnost spočívá jak na silné ekonomice, tak na odvaze našich vojáků a policistů." # todo: CHANGED
 NKR_safe_army: "Artsakh obranná armáda" # todo: NEW TRANSLATION
 NKR_safe_army_desc: "Artsakh obranná armáda byla obrannou složkou odtržené Republiky Artsakh. Založena v roce 1992, spojila dříve neorganizované obranné jednotky, které byly vytvořeny na počátku 90. let." # todo: NEW TRANSLATION
 NKR_planes: "Naše letadla" # todo: NEW TRANSLATION
 NKR_planes_desc: "Naše armáda zoufale potřebuje letadla; musíme je požádat Arménii." # todo: NEW TRANSLATION
 NKR_safe_special_forces: "Speciální jednotky Artsakh" # todo: NEW TRANSLATION
 NKR_safe_special_forces_desc: "Kromě běžných vojáků musíme mít ve svých řadách speciální jednotky, abychom mohli plnit ty nejnebezpečnější úkoly." # todo: NEW TRANSLATION
 NKR_safe_univer: "Vojenská kolej Kristapor Ivanyan" # todo: NEW TRANSLATION
 NKR_safe_univer_desc: "Vojenská kolej Kristapor Ivanyan byla vojenská vzdělávací instituce se sídlem ve Stepanakertu a provozovaná Artsakh Defence Army." # todo: NEW TRANSLATION
 NKR_safe_anti_air: "Letecká obranná síla" # todo: NEW TRANSLATION
 NKR_safe_anti_air_desc: "Podobně jako arménské ozbrojené síly si vytvoříme i vlastní síly protivzdušné obrany." # todo: NEW TRANSLATION
 NKR_safe_mo_ra: "Arménská vojenská letecká univerzita Armenak Khanperyants" # todo: NEW TRANSLATION
 NKR_safe_mo_ra_desc: "Máme v úmyslu posílat naše kadety studovat na této arménské univerzitě, protože klíčem ke silné armádě je vycvičený vojenský personál." # todo: NEW TRANSLATION
 NKR_safe_vazgen: "Vojenská univerzita Vazgena Sargsyana" # todo: NEW TRANSLATION
 NKR_safe_vazgen_desc: "Máme v úmyslu posílat naše kadety studovat na této arménské univerzitě, protože klíčem ke silné armádě je vycvičený vojenský personál." # todo: NEW TRANSLATION
 NKR_safe_aspar: "Aspar Arms" # todo: NEW TRANSLATION
 NKR_safe_aspar_desc: "Máme v úmyslu nakupovat produkty této arménské společnosti pro potřeby našich ozbrojených sil." # todo: NEW TRANSLATION
 NKR_safe_davisur: "Davisur" # todo: NEW TRANSLATION
 NKR_safe_davisur_desc: "Máme v úmyslu nakupovat produkty této arménské společnosti pro potřeby našich ozbrojených sil." # todo: NEW TRANSLATION
 NKR_safe_full_integrate_army: "Úplná integrace s arménskými ozbrojenými silami" # todo: NEW TRANSLATION
 NKR_safe_full_integrate_army_desc: "Chceme maximálně posílit naši integraci s arménskými ozbrojenými silami; jen tam budou naše spojené síly moci odrazit útok jakéhokoli nepřítele." # todo: NEW TRANSLATION
 NKR_safe_mvd: "Ministerstvo vnitra" # todo: NEW TRANSLATION
 NKR_safe_mvd_desc: "Naše bezpečnost závisí nejen na ozbrojených silách, ale také na policii a bezpečnostních službách. Musíme zajistit, aby se jim dostávalo patřičné pozornosti a prostředků." # todo: CHANGED
 NKR_safe_border_troops: "Hraniční vojsko" # todo: NEW TRANSLATION
 NKR_safe_border_troops_desc: "Pohraniční jednotky jsou stejně důležité jako vzduch. Naši nepřátelé nikdy neodpočívají a naše hranice musí být neustále střeženy." # todo: CHANGED
 NKR_safe_police_troops: "Policejní jednotky" # todo: NEW TRANSLATION
 NKR_safe_police_troops_desc: "Naše policejní síly, vytvořené podle vzoru arménských bezpečnostních složek, udržují vnitřní pořádek a jsou připraveny reagovat na každou mimořádnou událost." # todo: CHANGED
 NKR_safe_nss: "Národní bezpečnostní rada Artsakh" # todo: NEW TRANSLATION
 NKR_safe_nss_desc: "Nejen policie musí chránit zemi, ale i zvláštní služby, s nimiž si Národní bezpečnostní služba vede úspěšně." # todo: NEW TRANSLATION
 NKR_we_are_at_war: "Jsme ve válce!" # todo: NEW TRANSLATION
 NKR_we_are_at_war_desc: "Ázerbájdžán nás napadl, teď musíme bojovat!" # todo: NEW TRANSLATION
 NKR_scorched_earth: "Spálená země" # todo: NEW TRANSLATION
 NKR_scorched_earth_desc: "Musíme se připravit na zničení části našeho průmyslu, aby nebylo možné je použít Ázerbájdžánem." # todo: NEW TRANSLATION
 NKR_plant_minefields: "Vysazování minových polí" # todo: NEW TRANSLATION
 NKR_plant_minefields_desc: "I když se stáhneme z některých území, musíme na všech místech rozmístit miny, aby jimi nepřešli snadno." # todo: NEW TRANSLATION
 NKR_final_defense: "Konečná obrana" # todo: NEW TRANSLATION
 NKR_final_defense_desc: "Přišel čas pro konečnou obranu. Lepší je zemřít vztyčeně než žít na kolenou." # todo: NEW TRANSLATION
 ARM_landmines: "Artsakhské miny" # todo: NEW TRANSLATION
 ARM_landmines_desc: "Protitankové a protipěchotní miny rozmístěné po celém území Artsachu jako obranné opatření proti invazi. Ztěžují nepřátelské mechanizované operace, ale komplikují civilní obnovu a hospodářský rozvoj." # todo: NEW TRANSLATION
 mines_lostprov_tt: "Miny budou rozmístěny na ztracených územích!" # todo: NEW TRANSLATION
 NKR_last_defense: "Poslední obrana" # todo: NEW TRANSLATION
 arm_dashnak.1.t: "Naše aliance s Kocharianem" # todo: NEW TRANSLATION
 arm_dashnak.1.d: "Kocharian, i po opuštění funkce hlavy státu, má vážný vliv na arménské elity a společnost. Můžeme s ním vyjednávat a přivést ho na naši stranu, nebo s ním můžeme jednoznačně zatočit." # todo: NEW TRANSLATION
 arm_dashnak.1.a: "Máme nového přítele!" # todo: NEW TRANSLATION
 arm_dashnak.1.b: "Ani náhodou" # todo: NEW TRANSLATION
 arm_dashnak.2.t: "Arménie si přeje rozšířit vojenskou spolupráci" # todo: NEW TRANSLATION
 arm_dashnak.2.d: "Arménská delegace nás oficiálně informovala o vůli rozšířit vojenskou spolupráci mezi našimi zeměmi. Podle nich je tento krok prospěšný pro obě strany. Měli bychom souhlasit?" # todo: NEW TRANSLATION
 arm_dashnak.2.a: "Samozřejmě!" # todo: NEW TRANSLATION
 arm_dashnak.2.b: "O to nemáme zájem." # todo: NEW TRANSLATION
 arm_dashnak.3.t: "Rusko souhlasilo" # todo: NEW TRANSLATION
 arm_dashnak.3.d: "Ruská a arménská delegace podepsaly dohody o rozšíření vojenské spolupráce, včetně společných vojenských cvičení v blízké budoucnosti! Je to nový krok ve vztazích mezi oběma zeměmi." # todo: NEW TRANSLATION
 arm_dashnak.3.a: "Skvělé!" # todo: NEW TRANSLATION
 arm_dashnak.4.t: "Rusko odmítlo" # todo: NEW TRANSLATION
 arm_dashnak.4.d: "Rusko nás informovalo o svém odmítnutí. Podle nich nemají zájem o rozvoj vojenské spolupráce s námi." # todo: NEW TRANSLATION
 arm_dashnak.4.a: "Najdeme si jiného spojence!" # todo: NEW TRANSLATION
 ARM_in_between_empires: "Mezi Orlem a lvem" # todo: NEW TRANSLATION
 ARM_in_between_empires_desc: "V průběhu historie byla Arménie rozervána říšemi, které se snažily ovládnout její území. Staré říše dostaly nová jména a masky, ale podstata zůstává stejná. Budeme s nimi muset najít společný jazyk, abychom přežili." # todo: NEW TRANSLATION
 ARM_relations_with_europe: "Vztahy s Evropou" # todo: NEW TRANSLATION
 ARM_relations_with_europe_desc: "Musíme se zaměřit na vztahy s Evropou a určit naše současné i budoucí vztahy s ní." # todo: NEW TRANSLATION
 ARM_relations_with_russia: "Vztahy s Ruskem" # todo: NEW TRANSLATION
 ARM_relations_with_russia_desc: "Mnoho lidí v Arménii má velmi polarizovaný názor na Rusko. Bez ohledu na veřejné mínění musíme budovat naše vztahy s Ruskem na základě našich zájmů." # todo: NEW TRANSLATION
 ARM_partn_coop_agrem: "Partnerství a spolupráce" # todo: NEW TRANSLATION
 ARM_partn_coop_agrem_desc: "Zahajujeme naši dlouhou cestu spolupráce s Evropskou unií a tato dohoda odstartuje náš postup stát se součástí velké evropské rodiny." # todo: NEW TRANSLATION
 ARM_open_action_plan: "Otevřený akční plán" # todo: NEW TRANSLATION
 ARM_open_action_plan_desc: "Jsme s Evropskou unií v diplomatické spolupráci blíž než kdy dříve." # todo: NEW TRANSLATION
 ARM_arm_eu_compr_agre: "Vylepšená smlouva o partnerství" # todo: NEW TRANSLATION
 ARM_arm_eu_compr_agre_desc: "Naše partnerství s Evropskou unií dosahuje bezprecedentních výšin, možná jsme již jen krok od toho, abychom se stali součástí přátelské evropské rodiny." # todo: NEW TRANSLATION
 ARM_join_council_of_europe: "Vstup do Rady Evropy" # todo: NEW TRANSLATION
 ARM_join_council_of_europe_desc: "Máme v úmyslu spolupracovat s Radou Evropy, jako s jedním z evropských politických orgánů, které považujeme za důležité i pro nás samotné." # todo: NEW TRANSLATION
 ARM_standing_comitee_eu_integr: "Stálý výbor pro evropskou integraci" # todo: NEW TRANSLATION
 ARM_standing_comitee_eu_integr_desc: "Integrace do Evropského společenství je naší cestou a hodláme rozšířit naši účast v organizacích, dokumentech a dalších vazbách mezi námi a EU." # todo: NEW TRANSLATION
 ARM_open_up_for_ngos: "Otevření dveří pro neziskové organizace" # todo: NEW TRANSLATION
 ARM_open_up_for_ngos_desc: "Máme v úmyslu umožnit vstup evropským neziskovým organizacím do naší země, aby se zlepšil rozvoj naší občanské a demokratické společnosti." # todo: NEW TRANSLATION
 ARM_instanbul_conventions_discuss: "Diskuze o Istanbulské úmluvě" # todo: NEW TRANSLATION
 ARM_instanbul_conventions_discuss_desc: "Je čas definitivně rozhodnout o osudu LGBT občanů v naší zemi." # todo: NEW TRANSLATION
 ARM_prep_article_fortynine: "Příprava Arménie na článek 49" # todo: NEW TRANSLATION
 ARM_prep_article_fortynine_desc: "Konečně se blížíme k etapě, kterou jsme dlouho sledovali; možná se letos staneme součástí Evropské unie." # todo: NEW TRANSLATION
 ARM_prop_against_west_values: "Propaganda proti 'evropským' hodnotám" # todo: NEW TRANSLATION
 ARM_prop_against_west_values_desc: "Evropské hodnoty 21. století jsou nám cizí, povedou naši společnost z rozvoje ke degradaci." # todo: NEW TRANSLATION
 ARM_closing_ngos: "Uzavření neziskových organizací" # todo: NEW TRANSLATION
 ARM_closing_ngos_desc: "Evropské neziskové organizace nemají místo v naší krásné zemi, jejich vliv je pro naše občany příliš škodlivý." # todo: NEW TRANSLATION
 ARM_seizing_eu_funds: "Zabavení fondů EU" # todo: NEW TRANSLATION
 ARM_seizing_eu_funds_desc: "Západní investice nám budou prospívat, je čas si je vzít pro sebe." # todo: NEW TRANSLATION
 ARM_diplomatic_distance_eu: "Diplomatické odloučení od EU" # todo: NEW TRANSLATION
 ARM_diplomatic_distance_eu_desc: "Máme v úmyslu distancovat se od Evropské unie a přestat udržovat velmi přátelské vztahy s ní." # todo: NEW TRANSLATION
 ARM_slander_pro_europ_parties: "Pomluvy proevropských stran" # todo: NEW TRANSLATION
 ARM_slander_pro_europ_parties_desc: "Všechny proevropské strany by měly být kontrolovány a omezeny ve svých schopnostech, a prozápadní propagandisté by neměli mít volný průchod v Arménii." # todo: NEW TRANSLATION
 ARM_close_integr_orgs: "Uzavření všech integračních organizací" # todo: NEW TRANSLATION
 ARM_close_integr_orgs_desc: "Uzavíráme spolupráci se všemi evropskými integračními organizacemi, máme už dost evropského způsobu." # todo: NEW TRANSLATION
 ARM_negot_individ_trade_agreements: "Jednat o jednotlivých obchodních dohodách" # todo: NEW TRANSLATION
 ARM_negot_individ_trade_agreements_desc: "Máme v úmyslu navázat jednotlivé interakce se zeměmi EU; nepovažujeme EU za zástupce těchto zemí v mezinárodní politice." # todo: NEW TRANSLATION
 ARM_support_euroscept: "Podpora euroskepticismu" # todo: NEW TRANSLATION
 ARM_support_euroscept_desc: "Euroskepticismus je jedním ze základů našich vztahů s Evropou, a bude tomu tak i nadále." # todo: NEW TRANSLATION
 ARM_levons_legacy: "Odkaz krále Levona" # todo: NEW TRANSLATION
 ARM_levons_legacy_desc: "Bratrské vazby mezi Francií a Arménií zůstávají a budou trvat v průběhu let, navzdory případným problémům." # todo: NEW TRANSLATION
 ARM_cultural_econ_fra: "Kulturní a ekonomické vztahy" # todo: NEW TRANSLATION
 ARM_cultural_econ_fra_desc: "Francie a my jsme spojeni mnoha kulturními a historickými aspekty a hodláme rozšířit spolupráci ve prospěch obou národů." # todo: NEW TRANSLATION
 ARM_french_educ_arm: "Francouzské vzdělávání v Arménii" # todo: NEW TRANSLATION
 ARM_french_educ_arm_desc: "Francouzské vzdělávání je považováno za jedno z nejlepších na světě a hodláme otevřít pobočky francouzských univerzit v naší zemi." # todo: NEW TRANSLATION
 ARM_military_coop_fra: "Vojenská spolupráce s Francií" # todo: NEW TRANSLATION
 ARM_military_coop_fra_desc: "Chceme rozšířit spolupráci ozbrojených sil Arménie a Francie na dosud nevídanou úroveň." # todo: NEW TRANSLATION
 ARM_francophonie_membership: "Členství ve Francophonie" # todo: NEW TRANSLATION
 ARM_francophonie_membership_desc: "Máme v úmyslu stát se součástí Francophonie, což významně posílí naše vazby s Francií." # todo: NEW TRANSLATION
 ARM_armenia_eu_idea: "Arménie – Evropská unie" # todo: NEW TRANSLATION
 ARM_eu_coop_agreement: "Dohoda o partnerství a spolupráci" # todo: NEW TRANSLATION
 ARM_eu_coop_agreement_desc: "Arménie v roce 2017 podepisuje s Evropskou unií Komplexní a posílenou dohodu o partnerství (CEPA), která povyšuje vztahy nad rámec Asociační dohody z roku 2013 opuštěné poté, co Arménie vstoupila do Eurasijské hospodářské unie. CEPA zavádí spolupráci v obchodu, investicích, správě, energetice a bezpečnosti a představuje rovnováhu mezi evropským zapojením a regionální integrací vedenou Ruskem.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, jakmile bude dokončen fokus §HUzavřít všechny integrační organizace§!." # todo: NEW TRANSLATION
 ARM_eu_council: "Rada Evropy" # todo: NEW TRANSLATION
 ARM_eu_council_desc: "Členství Arménie v Radě Evropy vystavuje zemi evropským standardům lidských práv, demokratickým normám a mezinárodnímu dohledu. Tato institucionální kotva v evropských strukturách správy poskytuje legitimitu a právní rámce pro domácí reformy, zároveň však podrobuje arménskou politiku vnějšímu tlaku a dohledu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, jakmile bude dokončen fokus §HUzavřít všechny integrační organizace§!." # todo: NEW TRANSLATION
 ARM_eu_commitie: "Stálý výbor pro evropskou integraci" # todo: NEW TRANSLATION
 ARM_eu_commitie_desc: "Arménský parlamentní výbor věnovaný integraci do EU koordinuje harmonizaci legislativy, zavádí evropské standardy a spravuje byrokratický mechanismus propojující Arménii s evropskými institucionálními sítěmi. Výbor představuje hluboké zakořenění očekávání evropského vládnutí v arménské státní praxi.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, jakmile bude dokončen fokus §HUzavřít všechny integrační organizace§!." # todo: NEW TRANSLATION
 ARM_eu_ngos: "Neziskové organizace" # todo: NEW TRANSLATION
 ARM_eu_ngos_desc: "Evropské a mezinárodní nevládní organizace působí po celé Arménii, sledují lidská práva, poskytují služby a podporují reformu vládnutí. Jejich přítomnost poskytuje mechanismy vnější odpovědnosti, zároveň však podrývá státní monopol na občanskou společnost a přináší západní hodnoty do arménských komunit.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, jakmile bude dokončen fokus §HUzavřít nevládní organizace§!." # todo: NEW TRANSLATION
 ARM_eu_lgbt: "Postoj k LGBTQIA" # todo: NEW TRANSLATION
 ARM_eu_lgbt_desc: "Formální závazek Arménie k právům LGBTQIA, zakotvený prostřednictvím evropských úmluv o lidských právech, naráží na hluboký společenský a náboženský odpor konzervativní pravoslavné většiny Arménie. Toto napětí mezi evropskými právními závazky a domácími hodnotami zůstává jedním z nejspornějších bodů vztahů Arménie se Západem.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, jakmile bude dokončen fokus §HPropaganda proti západním hodnotám§!." # todo: NEW TRANSLATION
 ARM_eu_article_49: "Příprava na Článek 49" # todo: NEW TRANSLATION
 ARM_usa_ngo_leave_idea: "Odchod amerických nevládních organizací" # todo: NEW TRANSLATION
 ARM_usa_noembaracy_idea: "Uzavření amerického velvyslanectví" # todo: NEW TRANSLATION
 ARM_usa_embaracy_idea: "Rozšíření amerického velvyslanectví" # todo: NEW TRANSLATION
 ARM_help_siryan_idea: "Pomoc od arménské armády" # todo: NEW TRANSLATION
 ARM_help_siryan_idea_desc: "Arménie letecky přepravuje vojenský personál, poradce a humanitární zásoby do arménsko-arménské enklávy v Aleppu a podporuje arménské komunity ohrožené během syrské občanské války. Tato mise zajišťuje bezpečnost diasporické komunity a potvrzuje závazek Arménie chránit arménské menšiny na celém Blízkém východě.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, až bude obnoven mír a naše humanitární mise skončí." # todo: NEW TRANSLATION
