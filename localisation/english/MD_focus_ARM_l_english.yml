 ARM_vdv_level_1_tt: "Založili jsme §Výsadkové síly§!" # todo: NEW TRANSLATION
 ARM_davisur_level_1_tt: "Přijali jsme program vybavení §YDAVISUR§!" # todo: NEW TRANSLATION
 NKR_integrate_army_of_armenia_available: "[ARM.GetNameWithFlag] reformoval složku svých ozbrojených sil, kterou jsme dosud nepřijali" # todo: NEW TRANSLATION
