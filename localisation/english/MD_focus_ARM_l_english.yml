 ARM_foreseeing_the_prophecy: "Předvídání proroctví" # todo: NEW TRANSLATION
 ARM_foreseeing_the_prophecy_desc: "Legenda o původu arménského národa praví, že Arméni získali právo na existenci tím, že se pod sjednocením Hayka Praotce postavili semitským kmenům z jihu. Nové časy nesou dědictví minulosti na svých bedrech a legendy praví, že záchrana Arménů, stejně jako Hayk Praotec, musí přijít v novém tisíciletí." # todo: CHANGED
 ARM_expand_cis_cooperations: "Rozšíření bezpečnostní spolupráce CIS" # todo: NEW TRANSLATION
 ARM_expand_cis_cooperations_desc: "Rozšiřování CIS bezpečnostní spolupráce" # todo: NEW TRANSLATION
 arme.16.t: "Bezpečnostní schůzka CIS v Jerevanu, Arménie" # todo: NEW TRANSLATION
 arme.16.d: "Arménský vůdce [ARM.GetLeader] přijal vedoucí delegací, které dorazily do Jerevanu, aby se zúčastnily zasedání Rady vedoucích bezpečnostních a zvláštních služeb SNS CIS.\n\nPodle tiskové služby hlavy arménského státu [ARM.GetLeader] poznamenal důležitost práce Rady, zvláště s ohledem na prioritu zajištění bezpečnosti na národní, regionální a mezinárodní úrovni. Prezident zdůraznil potřebu prohloubit spolupráci v rámci SNS CIS.\n\n[ARM.GetLeader] uvedl, že otázky boje proti bezpečnostním hrozbám byly vždy v centru pozornosti států. Podle něj spolupráce v této a v dalších oblastech umožňuje dále posílit mezistátní vazby a přátelství mezi národy.\n\nNa žádost [ARM.GetLeader] hosté prezentovali témata projednaná na zasedání konaném v Tsaghkadzoru a učiněná rozhodnutí." # todo: NEW TRANSLATION
 arme.16.a: "Zajímavé." # todo: NEW TRANSLATION
 armcis_infl: "§Y[ROOT.GetNameWithFlag]§! Získá §Y2% vliv§! na všechny §3Členské státy SNS§!" # todo: NEW TRANSLATION
 ARM_russian_culture_promotion: "Podpora ruské kultury" # todo: NEW TRANSLATION
 ARM_russian_culture_promotion_desc: "Rusko se vždy snaží šířit svou kulturu v naší zemi. Ať už motivace je jakákoli, další znalosti cizího jazyka a vzdělávací spolupráce jsou pro naši populaci vždy prospěšné." # todo: NEW TRANSLATION
 ARM_russian_fsb_borderguards: "FSB pohraniční strážci" # todo: NEW TRANSLATION
 ARM_russian_fsb_borderguards_desc: "Musíme pozvat ruské pohraniční jednotky FSB, aby posílily naši bezpečnost." # todo: CHANGED
 arme.17.t: "[ARM.GetNameWithFlag] zve FSB pohraniční jednotky" # todo: NEW TRANSLATION
 arme.17.d: "Nedávno arménská vláda navrhla, aby naše FSB pohraniční jednotky chránily a sledovaly arménsko-tureckou hranici a arménsko-azerbajdžánské hranice.\n\nTo zvýší náš vliv a zpravodajské schopnosti v regionu, pokud tuto nabídku přijmeme." # todo: NEW TRANSLATION
 arme.17.a: "Jistě!" # todo: NEW TRANSLATION
 arme.17.b: "Promiňte, ne." # todo: NEW TRANSLATION
 ARM_fsb_borderguards: "FSB pohraniční strážci" # todo: NEW TRANSLATION
 ARM_fsb_borderguards_desc: "Pohraniční stráže ruské Federální bezpečnostní služby jsou od roku 1992 rozmístěny na arménských hranicích s Tureckem a Íránem, což bylo formalizováno dvoustrannou smlouvou. Hlídkují na hranici, zadržují pašeráky a představují viditelný symbol ruské vojenské přítomnosti na naší půdě. Jejich nasazení závisí na dobré vůli Moskvy a stabilitě bilaterálních vztahů.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud vstoupíme do války s [SOV.GetNameWithFlag], přijmeme demokratickou vládu nebo pokud si [SOV.GetNameWithFlag] o nás vytvoří negativní mínění." # todo: NEW TRANSLATION
 arme.18.t: "[SOV.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.18.d: "Ruské FSB pohraniční jednotky budou vyslány do všech našich regionů." # todo: NEW TRANSLATION
 arme.18.a: "Skvěle." # todo: NEW TRANSLATION
 arme.19.t: "[SOV.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.19.d: "Rusko zamítlo naši nabídku umístit ruské FSB jednotky na našich hranicích." # todo: NEW TRANSLATION
 arme.19.a: "Bruh." # todo: NEW TRANSLATION
 ARM_expand_russian_base_time: "Cvičení s ruskou armádou" # todo: NEW TRANSLATION
 ARM_expand_russian_base_time_desc: "Jelikož ruská vojenská základna se nachází v naší zemi, můžeme společně provádět vojenská cvičení." # todo: NEW TRANSLATION
 ARM_remove_fsb_borderguards: "Odstranit [SOV.GetNameWithFlag]ově FSB Pohraniční strážce" # todo: NEW TRANSLATION
 fsb_deployed: "FSB byl nasazen v [ARM.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.20.t: "[ARM.GetNameWithFlag] Navrhuje propagaci ruské kultury!" # todo: NEW TRANSLATION
 arme.20.d: "Od dob staré Rusi kulturní výměna mezi Arménií a Ruskem výrazně obohatila obě kultury. Se společnou historií v rámci Ruského impéria a Sovětského svazu Arménie navrhla dohodu: bude hostit naše kulturní centra, aby zde podporovala ruskou kulturu a čelila západnímu vlivu. Na oplátku žádá, abychom financovali zřízení těchto center." # todo: CHANGED
 arme.20.a: "Day'om Dobro!" # todo: NEW TRANSLATION
 arme.20.b: "Nevidíme žádný užitek z propagace kultury." # todo: NEW TRANSLATION
 arme.21.t: "[SOV.GetNameWithFlag] Agrees!" # todo: NEW TRANSLATION
 arme.21.d: "Rusko souhlasilo financovat ruská kulturní centra v Arménii." # todo: NEW TRANSLATION
 arme.21.a: "Wonderful!" # todo: NEW TRANSLATION
 arme.22.t: "[SOV.GetNameWithFlag] Denies!" # todo: NEW TRANSLATION
 arme.22.d: "Rusko odmítlo naši návrh na otevření ruských kulturních center v Arménii. Říkají, že nevidí užitek v takových snahách." # todo: NEW TRANSLATION
 arme.22.a: "What a strange folk. Maybe we didn't need their cultural centers after all." # todo: NEW TRANSLATION
 ARM_educational_cooperation: "Vzdělávací spolupráce s Ruskem" # todo: NEW TRANSLATION
 ARM_educational_cooperation_desc: "Můžeme se pokusit přesvědčit Rusko, aby s námi zahájilo studentský výměnný program." # todo: CHANGED
 ARM_rusarm_educ_coop: "Arménsko-ruská vzdělávací dohoda" # todo: NEW TRANSLATION
 arme.23.t: "[ARM.GetNameWithFlag] Navrhuje vzdělávací dohodu!" # todo: NEW TRANSLATION
 arme.23.d: "Arménie nám nedávno navrhla dohodu o vzdělávací spolupráci, v rámci které by studenti z obou zemí mohli být směňováni mezi univerzitami. Vzhledem k tomu, že arménské univerzity mají mnoho vazeb na západní vzdělání, naši studenti z toho mohou hodně profitovat." # todo: NEW TRANSLATION
 arme.23.a: "Jistě!" # todo: NEW TRANSLATION
 arme.23.b: "To je nějaký arménský plán!" # todo: NEW TRANSLATION
 arme.24.t: "[SOV.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.24.d: "Rusko souhlasilo s naším návrhem na výměnu studentů a brzy podepíšeme dokumenty." # todo: NEW TRANSLATION
 arme.24.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.25.t: "[SOV.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.25.d: "Rusko naši nabídku odmítlo a vnímají ji jako zvrácený prostředek, jak zvracet ruskou mládež západními vlivy." # todo: NEW TRANSLATION
 arme.25.a: "Cože?" # todo: NEW TRANSLATION
 mgu_unlock: "§YSpolupráce s Moskevskou státní univerzitou§! bude k dispozici k získání!" # todo: NEW TRANSLATION
 ARM_russian_tv_channels: "Ruské televizní kanály" # todo: NEW TRANSLATION
 ARM_russian_tv_channels_desc: "Můžeme povolit ruským televizním kanálům vstoupit na arménský trh. Ano, zvýší to ruský vliv nad námi, ale výhody mohou být mnohem větší." # todo: NEW TRANSLATION
 ARM_rus_diaspora_strength: "Spojení s diaspórou" # todo: NEW TRANSLATION
 ARM_rus_diaspora_strength_desc: "Můžeme se pokusit navázat spojení s arménskou diaspórou a přijímat od ní dary." # todo: NEW TRANSLATION
 ARM_ratify_iran_pipeline: "Schválení plynovodu Syunik" # todo: NEW TRANSLATION
 ARM_ratify_iran_pipeline_desc: "Možná bychom měli nabídnout Íránu dohodu o plynovodu skrz naši jižní hranici. Budeme vyměňovat energii za plyn." # todo: NEW TRANSLATION
 arme.26.t: "[ARM.GetNameWithFlag] Navrhuje dohodu o plynu!" # todo: NEW TRANSLATION
 arme.26.d: "Arménie nám nabízí dohodu, při níž bude plynovod vybudován z Íránu do Arménie. Plyn dodávaný z Íránu do Arménie bude vyměněn za elektřinu, kterou postrádáme v severních regionech.\n\nNáklady na plynovod budou rozděleny mezi nás a Arménii. Dohoda je celkem výhodná, měli bychom souhlasit?" # todo: NEW TRANSLATION
 arme.26.a: "Souhlasíme!" # todo: NEW TRANSLATION
 arme.26.b: "Promiňte, ne." # todo: NEW TRANSLATION
 arme.27.t: "[PER.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.27.d: "Írán odmítl naši nabídku. Vidí náš návrh jako jistý druh sionistického spiknutí, které podkopává jejich suverenitu." # todo: NEW TRANSLATION
 arme.27.a: "Jsou snad šílení?" # todo: NEW TRANSLATION
 arme.28.t: "[PER.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.28.d: "Írán souhlasil s naší nabídkou a je připraven vybudovat plynovod. Nyní musíme zaplatit naši část nákladů a začít koordinovat naše stavební práce." # todo: NEW TRANSLATION
 arme.28.a: "Skvělé!" # todo: NEW TRANSLATION
 ARM_syunik_pipeline: "Írán–Arménský plynovod" # todo: NEW TRANSLATION
 ARM_syunik_pipeline_desc: "Plynovod procházející provincií Sjunik, který dodává íránský plyn do Arménie. Plynovod zmírňuje chronický nedostatek energie v Arménii, začleňuje jižní provincii do národního hospodářství a vytváří cenné spojení v íránsko-arménském obchodu.\n§W--------------§!\nTento modifikátor státu bude §ROdebrán§!, pokud zrušíme plynovod prostřednictvím rozhodnutí §YZrušit plynovod§! nebo jej rozšíříme prostřednictvím rozhodnutí §YRozšířit plynovod§!." # todo: NEW TRANSLATION
 ARM_syunik_pipeline_two: "Írán–Arménský plynovod" # todo: NEW TRANSLATION
 ARM_syunik_pipeline_two_desc: "Modernizovaný plynovod přes provincii Sjunik, který dodává Arménii zvýšené dodávky íránského plynu. Rozšířený plynovod prohlubuje hospodářskou integraci Arménie s Íránem a významně podporuje rozvoj provincie.\n§W--------------§!\nTento modifikátor státu bude §ROdebrán§!, pokud zrušíme plynovod prostřednictvím rozhodnutí §YZrušit plynovod§!." # todo: NEW TRANSLATION
 gas_two_tt: "Dává nám §G2 Fosilní paliva§! v §YSyunik§!" # todo: NEW TRANSLATION
 gas_two_per_tt: "Dává §G2 Fosilní paliva§! do §YArménie§!" # todo: NEW TRANSLATION
 gas_four_tt: "Dává nám §G4 Fosilní paliva§! v §YSyunik§!" # todo: NEW TRANSLATION
 gas_four_per_tt: "Dává §G4 Fosilní paliva§! do §YArménie§!" # todo: NEW TRANSLATION
 ARM_arm_electr_deal: "Arménské dodávky elektřiny" # todo: NEW TRANSLATION
 ARM_arm_electr_deal_desc: "Dohoda o dodávkách elektřiny z Íránu do Arménie, která snižuje závislost na domácí výrobě elektřiny a zmírňuje sezónní nedostatky v provincii." # todo: NEW TRANSLATION
 ARM_arm_electr_deal_two: "Arménské dodávky elektřiny" # todo: NEW TRANSLATION
 ARM_arm_electr_deal_two_desc: "Rozšířená dohoda o zvýšených dodávkách elektřiny z Íránu, která stabilizuje arménskou energetickou síť a umožňuje průmyslový růst v pohraničních provinciích." # todo: NEW TRANSLATION
 arme.29.t: "[PER.GetNameWithFlag]-[ARM.GetNameWithFlag] Dohoda o plynu!" # todo: NEW TRANSLATION
 arme.29.d: "Nedávno se vůdci Arménie a Íránu setkali v provincii Syunik v Arménii a oslavili slavnostní otevření nového plynovodu." # todo: NEW TRANSLATION
 arme.29.a: "Skvělé!" # todo: NEW TRANSLATION
 per_gas_accepted: "[PER.GetNameWithFlag] Přijal(a) dohodu o plynovodu" # todo: NEW TRANSLATION
 ARM_expand_pipeline: "Rozšířit plynovod s [PER.GetNameWithFlag]" # todo: NEW TRANSLATION
 ARM_cancel_pipeline: "§RCancel§! Plynovod s [PER.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.30.t: "[ARM.GetNameWithFlag] Rozšiřuje dohodu o plynu!" # todo: NEW TRANSLATION
 arme.30.d: "Arménie se rozhodla zvýšit výměnnou dohodu a poskytnout nám více elektřiny výměnou za více plynu." # todo: NEW TRANSLATION
 arme.30.a: "Skvělé!" # todo: NEW TRANSLATION
 ARM_eaeu_integrat: "Integrace EAEU" # todo: NEW TRANSLATION
 ARM_eaeu_integrat_desc: "Ruský ekonomický tlak na nás je příliš velký na to, abychom jej ignorovali. Pokud uzavřeme správné dohody, můžeme jej proměnit v něco velmi prospěšného." # todo: CHANGED
 ARM_undermine_russian_influence: "Podkopávání ruského vlivu" # todo: NEW TRANSLATION
 ARM_undermine_russian_influence_desc: "Rusi ovlivňují naši zemi příliš dlouho. Musíme se zbavit jejich vlivu v naší zemi." # todo: NEW TRANSLATION
 arme.31.t: "[PER.GetNameWithFlag]-[ARM.GetNameWithFlag] Dohoda o plynu je zrušena!" # todo: NEW TRANSLATION
 arme.31.d: "Dohoda o plynu mezi Arménií a Íránem je nyní zrušena a plynovod uzavřen." # todo: NEW TRANSLATION
 arme.31.a: "Dobře." # todo: NEW TRANSLATION
 arme.32.t: "[ARM.GetNameWithFlag] Podkopává vliv [SOV.GetNameWithFlag]!" # todo: NEW TRANSLATION
 arme.32.d: "Nedávno Arménie začala uzavírat různá vlivná ruská kulturní centra a zakázala ruská státní média ve své zemi." # todo: NEW TRANSLATION
 arme.32.a: "Idioti!" # todo: NEW TRANSLATION
 ARM_support_russian_opposition: "Podpora ruské opozice" # todo: NEW TRANSLATION
 ARM_support_russian_opposition_desc: "Musíme podkopat Rusko a podporovat ruské opoziční vůdce financováním z Arménie." # todo: NEW TRANSLATION
 arme.33.t: "[ARM.GetNameWithFlag] Podporuje naši opozici!" # todo: NEW TRANSLATION
 arme.33.d: "Nedávno arménská vláda oznámila, že podporuje ruskou opozici a zve všechny, kdo by mohli být stíháni, aby přišli do Arménie. Není jasné, proč arménská vláda zvolila takové stanovisko, ale je zřejmé, že bylo ovlivněno nedávným ochlazením vztahů mezi Jerevanem a Moskvou." # todo: NEW TRANSLATION
 arme.33.a: "Jak si to dovolují!" # todo: NEW TRANSLATION
 arme.34.t: "Otázka ruské vojenské základny" # todo: NEW TRANSLATION
 arme.34.d: "Nyní, po zhoršení našich vztahů s Ruskem, se objevuje otázka stažení ruských vojenských jednotek z naší země. Na jednu stranu je možné je prostě vyhnat, na druhou stranu se pokusit ovlivnit Rusko prostřednictvím této vojenské základny. Jak bychom měli postupovat?" # todo: NEW TRANSLATION
 arme.34.a: "Musí odejít co nejrychleji!" # todo: NEW TRANSLATION
 arme.34.b: "Mohou být užiteční... prozatím." # todo: NEW TRANSLATION
 ARM_question_military_base: "Zpochybnění ruské vojenské základny" # todo: NEW TRANSLATION
 ARM_question_military_base_desc: "Nyní musíme přemýšlet, co bychom měli dělat s ruskou vojenskou základnou v Arménii." # todo: NEW TRANSLATION
 ARM_freeze_csto_membership: "Zmrazení členství v CSTO" # todo: NEW TRANSLATION
 ARM_freeze_csto_membership_desc: "CSTO nám nepomáhá a nechce nám pomáhat proti Ázerbájdžánu. Musíme rozhodnout, co budeme dělat s touto organizací." # todo: NEW TRANSLATION
 ARM_investigate_prorus_offic: "Vyšetřovat pro-ruské úředníky" # todo: NEW TRANSLATION
 ARM_investigate_prorus_offic_desc: "Mnoho politiků a úředníků touží prosazovat ruské zájmy. Musíme je vyšetřit a zjistit hloubku jejich loajality." # todo: CHANGED
 ARM_polish_cherries: "Polská třešeň" # todo: NEW TRANSLATION
 ARM_polish_cherries_desc: "Polsko je známé svými zemědělskými produkty, proč nezačneme s ním navazovat obchodní vztah tím, že od něj pořídíme tak malé množství?" # todo: NEW TRANSLATION
 ARM_polish_mil_coop: "Vojenská spolupráce s Polskem" # todo: NEW TRANSLATION
 ARM_polish_mil_coop_desc: "Polsko může být pro nás dobrým dodavatelem zbraní a máme v úmyslu uzavřít s nimi smlouvu o dodávkách zbraní." # todo: NEW TRANSLATION
 ARM_arm_pol_friend: "Partnerství s Polskem" # todo: NEW TRANSLATION
 ARM_arm_pol_friend_desc: "Máme v úmyslu rozvíjet naše partnerské vztahy s polskými kolegy na novou úroveň." # todo: NEW TRANSLATION
 ARM_polish_fleet_help: "Požádat Polsko o pomoc s flotilou" # todo: NEW TRANSLATION
 ARM_polish_fleet_help_desc: "Máme v úmyslu přilákat polské odborníky pro rozvoj naší flotily, připomínající první dohody Polska s První Arménskou republikou." # todo: NEW TRANSLATION
 ARM_our_common_heritage: "Naše společné dědictví" # todo: NEW TRANSLATION
 ARM_our_common_heritage_desc: "Bitva u Grunvaldu, při které byl Teutonský řád poražen polskou armádou, se Arménie podílela; tehdy jsme Polsku pomohli, a tak ho můžeme pozvat, aby si připoměl slavné dědictví těch let." # todo: NEW TRANSLATION
 ARM_military_coop_greece: "Vojenská spolupráce s Řeckem" # todo: NEW TRANSLATION
 ARM_military_coop_greece_desc: "Máme v úmyslu navrhnout Řecku rozšíření naší vojenské spolupráce a uspořádat řadu společných cvičení." # todo: NEW TRANSLATION
 arme.38.t: "Výsledky vyšetřování" # todo: NEW TRANSLATION
 arme.38.d: "Národní bezpečnostní služba prověřila všechny pro-ruské politiky a našla jejich vazby na ruskou vládu. Nicméně nebyly nalezeny žádné podvodné schémata." # todo: NEW TRANSLATION
 arme.38.a: "Zajímavé." # todo: NEW TRANSLATION
 arme.39.t: "Výsledky vyšetřování" # todo: NEW TRANSLATION
 arme.39.d: "Národní bezpečnostní služba prověřila všechny pro-ruské politiky a našla jejich vazby na ruskou vládu. Korupční schémata byla také deklasifikována a jejich činnosti byly zastaveny." # todo: NEW TRANSLATION
 arme.39.a: "Skvělé!" # todo: NEW TRANSLATION
 ARM_sign_rome_statute: "Podepsání Římského statutu" # todo: NEW TRANSLATION
 ARM_sign_rome_statute_desc: "Podpis Římského statutu nám může poskytnout více nástrojů k boji proti ruské agresi v našem regionu a mimo něj." # todo: NEW TRANSLATION
 ARM_cleanse_russian_agents: "Zatknout ruské agenty" # todo: NEW TRANSLATION
 ARM_cleanse_russian_agents_desc: "Musíme zatknout a zakázat všechny politiky, kteří otevřeně pracují pro ruské zájmy, a prosazovat politiku pokory!" # todo: NEW TRANSLATION
 ARM_demand_contr_reassur: "Požadovat splnění smluv" # todo: NEW TRANSLATION
 ARM_demand_contr_reassur_desc: "S rozšiřujícím se vlivem na Rusko musíme žádat, aby byly splněny naše smlouvy o dodávkách zbraní." # todo: NEW TRANSLATION
 arme.40.t: "[ARM.GetNameWithFlag] Požaduje splnění smluv" # todo: NEW TRANSLATION
 arme.40.d: "Arménská vláda, která rozšířila svůj vliv nad naší zemí, vyžaduje, abychom splnili některé smlouvy o dodávkách zbraní, které jsme přestali plnit poté, co se jejich vztahy s námi zhoršily. Pokud ale smlouvu splníme, jejich vliv na nás výrazně poklesne." # todo: NEW TRANSLATION
 arme.40.a: "Strčte si to!" # todo: NEW TRANSLATION
 ARM_northern_neighbor: "Severní soused" # todo: NEW TRANSLATION
 ARM_northern_neighbor_desc: "Náš nejméně antagonický severní soused musí být vyřešen. Buď diplomaticky, nebo jinak." # todo: NEW TRANSLATION
 ARM_open_up_djavakhq_quest: "Otevřít Djavakhq otázku" # todo: NEW TRANSLATION
 ARM_open_up_djavakhq_quest_desc: "Naši lidé v Gruzii jsou utlačováni našimi severními partnery. Přišel čas je osvobodit od Gruzie!" # todo: NEW TRANSLATION
 ARM_support_separatism: "Podpora separatismu" # todo: NEW TRANSLATION
 ARM_support_separatism_desc: "Musíme podpořit separatismus v Gruzii a prosazovat svobodu Djavakhku vojenskými prostředky!" # todo: NEW TRANSLATION
 ARM_protect_minority_rights: "Chránit práva menšin" # todo: NEW TRANSLATION
 ARM_protect_minority_rights_desc: "Naši gruzínští přátelé jsou v Arménii příliš tvrdí na arménskou populaci v jejich zemi. Nesmíme vyvolat konflikt, ale ovlivňovat Gruzii prostřednictvím diplomatických prostředků." # todo: NEW TRANSLATION
 ARM_friendship_and_trade_agreement: "Dohoda o přátelství a obchodu" # todo: NEW TRANSLATION
 ARM_friendship_and_trade_agreement_desc: "Ačkoli existují některé problémy ohledně Gruzie a naší arménské populace v Djavakhq, můžeme to vyřešit smířlivě a nechat obě země prosperovat." # todo: NEW TRANSLATION
 ARM_demand_representation: "Požadovat zastoupení" # todo: NEW TRANSLATION
 ARM_demand_representation_desc: "Respektujeme územní integritu Gruzie, avšak nemůžeme jen tak stát zpříma a sledovat, jak v Gruzii funguje nedemokratický systém a jak vyřazuje arménskou komunitu z jejich politického systému!" # todo: NEW TRANSLATION
 ARM_black_sea_agreements: "Dohody o Černém moři" # todo: NEW TRANSLATION
 ARM_black_sea_agreements_desc: "Obchod ve Černém moři je rozsáhlý a mohli bychom si obě strany prospěšné dohody o bilaterálním obchodu a přístupu k moři." # todo: NEW TRANSLATION
 ARM_electro_exporting: "Export elektřiny" # todo: NEW TRANSLATION
 ARM_electro_exporting_desc: "Naše kapacity pro export elektřiny jsou dostatečné pro rozšíření exportu. Můžeme navázat dohodu s Gruzií, která by byla prospěšná." # todo: NEW TRANSLATION
 ARM_javakhq_must_be_free: "Operace „Padlý kříž“" # todo: CHANGED
 ARM_javakhq_must_be_free_desc: "Imperialistští Gruzíni zneužívali naši zemi a náš lid příliš dlouho! Teď musíme provést vojenskou operaci a osvobodit náš lid!" # todo: NEW TRANSLATION
 ARM_support_geo_peace: "Podpora míru v Gruzii" # todo: NEW TRANSLATION
 ARM_support_geo_peace_desc: "Abychom podpořili důvěru mezi našimi zeměmi, můžeme se pokusit vyjednat dohodu mezi separatistickými republikami a Gruzií a ukončit tento zbytečný konflikt." # todo: NEW TRANSLATION
 ARM_friendship_syria: "Přátelství se Sýrií" # todo: NEW TRANSLATION
 ARM_friendship_syria_desc: "Navzdory našim možným politickým rozdílům se Sýrií byla alavitská komunita vždy oporou Arménů v regionu a musíme podpořit prohloubení našich vztahů." # todo: NEW TRANSLATION
 ARM_alaw_assyr_armen: "Alavitsko-arménsko-asyrské vztahy" # todo: NEW TRANSLATION
 ARM_alaw_assyr_armen_desc: "Trojice alavitských, Arménů a Asyranů jsou v Sýrii neislámské menšiny. Aby naše komunity přežily, musíme spolupracovat a vzájemně si pomáhat." # todo: NEW TRANSLATION
 ARM_rescuing_diasp: "Záchrana diaspory" # todo: NEW TRANSLATION
 ARM_rescuing_diasp_desc: "Situace v Sýrii je značně nestabilní a musíme pomoci naší komunitě repatriovat do Arménie a začlenit se do naší společnosti." # todo: NEW TRANSLATION
 ARM_human_aid_syr: "Humanitární pomoc Sýrii" # todo: NEW TRANSLATION
 ARM_human_aid_syr_desc: "Syrská populace je v nouzi a my musíme poskytnout humanitární pomoc Sýrii a rozšířit náš vliv nad ní." # todo: NEW TRANSLATION
 ARM_intervene_in_syria: "Zasáhnout do Sýrie" # todo: NEW TRANSLATION
 ARM_intervene_in_syria_desc: "Musíme vyslat naše síly, abychom Sýrii pomohli v jejím boji!" # todo: NEW TRANSLATION
 arme.41.t: "Arméni z Djavakhk požadují zastoupení!" # todo: NEW TRANSLATION
 arme.41.d: "Arméni žijící v Samtskhe-Djavakheti požadují zastoupení v našem parlamentu a chtějí zvětšit autonomii v Gruzii. Uvedli, že jejich protesty nesouvisí s Jižní Osetií a Abcházií a nechtějí ozbrojený konflikt ve své vlasti.\n\nArménská vláda sama podpořila jejich požadavek a vyzvala k stabilizaci situace a k tomu, aby Arméni nezačali ozbrojené povstání.\n\nArménská vláda také uvedla, že pokud federalizujeme naši zemi, pomohou nám integrovat Jižní Osetii a Abcházii prostřednictvím jejich diasporických spojení a obejdou ruský vliv." # todo: NEW TRANSLATION
 arme.41.a: "Čestný požadavek!" # todo: NEW TRANSLATION
 arme.41.b: "To si nemůžeme dovolit!" # todo: NEW TRANSLATION
 arme.42.t: "Federalizace!" # todo: NEW TRANSLATION
 arme.42.d: "Proč to čteš, ty malý podvodníku?" # todo: NEW TRANSLATION
 arme.42.a: "Za co?" # todo: NEW TRANSLATION
 djavakhq_pizdec: "[GEO.GetNameWithFlag] Odmítl mírové řešení" # todo: NEW TRANSLATION
 arme.44.t: "[GEO.GetNameWithFlag] Odmítl federalizaci!" # todo: NEW TRANSLATION
 arme.44.d: "Gruzie odmítla federalizaci a neudělí autonomii Djavakhk." # todo: NEW TRANSLATION
 arme.44.a: "To je škoda!" # todo: NEW TRANSLATION
 geofed_arm_tt: "[GEO.GetNameWithFlag] by mohl federalizovat a udělit autonomii [ARM.GetFlag]§9Djavakhk§!" # todo: NEW TRANSLATION
 ARM_djavakhq: "Djavakheti Autonomy" # todo: NEW TRANSLATION
 arme.45.t: "[ARM.GetNameWithFlag] Navrhuje řešení konfliktu!" # todo: NEW TRANSLATION
 arme.45.d: "Nedávno se arménská vláda rozhodla prostřednictvím řešení našeho konfliktu s Gruzií. Arméni navrhují řešení, podle kterého [ROOT.GetNameWithFlag] získáme plnou autonomii s možností odtržení, pokud to budeme chtít. V souvislosti s nedávnou situací autonomie Djavakhk a tím, jak byla vyřešena. Arménská vláda také uvedla, že pokud federalizujeme naši zemi, pomohou nám začlenit Jižní Osetii a Abcházii prostřednictvím jejich diasporických spojení a obejdou ruský vliv." # todo: NEW TRANSLATION
 arme.45.a: "Jistě!" # todo: NEW TRANSLATION
 arme.45.b: "Nebudeme se vzdávat naší suverenity!" # todo: NEW TRANSLATION
 arme.46.t: "[FROM.GetNameWithFlag] Přijímá federalizaci!" # todo: NEW TRANSLATION
 arme.46.d: "[FROM.GetNameWithFlag] přijal arménské řešení pro federalizaci se Gruzií a nyní jsou součástí gruzínského státu." # todo: NEW TRANSLATION
 arme.46.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.46.b: "Skvěle!" # todo: NEW TRANSLATION
 arme.47.t: "[FROM.GetNameWithFlag] Odmítá federalizaci!" # todo: NEW TRANSLATION
 arme.47.d: "[FROM.GetNameWithFlag] odmítl náš návrh řešení." # todo: NEW TRANSLATION
 arme.47.a: "Velmi nešťastné." # todo: NEW TRANSLATION
 arme.48.t: "[ARM.GetNameWithFlag] Požaduje Samtskhe-Djavakheti!" # todo: NEW TRANSLATION
 arme.48.d: "Nedávno vláda [ARM.GetNameWithFlag] prohlásila, že utlačování Arménů v Gruzii musí být okamžitě zastaveno.\n\nNaši úředníci a někteří místní Arméni pro Gruzii to popírají, avšak Arménie již zahájila shromažďování jednotek na gruzinsko-arménské hranici." # todo: NEW TRANSLATION
 arme.48.a: "Zmetci!" # todo: NEW TRANSLATION
 arme.49.t: "[ARM.GetNameWithFlag] - [GEO.GetNameWithFlag] válka!" # todo: NEW TRANSLATION
 arme.49.d: "Arménie nedávno vyhlásila válku Gruzii. To by mohla být naše historická šance zcela zničit gruzínského obra!" # todo: NEW TRANSLATION
 arme.49.a: "Přidáme se!" # todo: NEW TRANSLATION
 arme.49.b: "To je příliš riskantní..." # todo: NEW TRANSLATION
 ARM_amenia_georgia_trade: "[ARM.GetNameWithFlag] - [GEO.GetNameWithFlag] Obchodní dohoda" # todo: NEW TRANSLATION
 arme.50.t: "[ARM.GetNameWithFlag] Navrhuje obchodní dohodu!" # todo: NEW TRANSLATION
 arme.50.d: "[ARM.GetNameWithFlag] nedávno navrhla dohodu o přátelství a obchodu mezi našimi zeměmi. Měli bychom souhlasit s jejich návrhem?" # todo: NEW TRANSLATION
 arme.50.a: "Jistě!" # todo: NEW TRANSLATION
 arme.50.b: "Nemáme zájem." # todo: NEW TRANSLATION
 arme.51.t: "[GEO.GetNameWithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.51.d: "[GEO.GetNameWithFlag] přijalo náš diplomatický návrh na podepsání dohody o přátelství a obchodu." # todo: NEW TRANSLATION
 arme.51.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.52.t: "[GEO.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.52.d: "[GEO.GetNameWithFlag] odmítl náš návrh na přátelství a obchod." # todo: NEW TRANSLATION
 arme.52.a: "Musíme opustit naše snahy o sblížení se s Gruzií." # todo: NEW TRANSLATION
 arme.52.b: "Pokračujme v naší diplomatické misi." # todo: CHANGED
 arme.53.t: "[ARM.GetNameWithFlag] Žádá o přístup k Černému moři!" # todo: NEW TRANSLATION
 arme.53.d: "Nedávno arménská vláda vyjádřila ochotu nám zaplatit za přístup k Černému moři. Měli bychom souhlasit s jejich nabídkou?" # todo: NEW TRANSLATION
 arme.53.a: "Ano, jistě!" # todo: NEW TRANSLATION
 arme.53.b: "Ne, pryč." # todo: NEW TRANSLATION
 arme.54.t: "[GEO.GetNameWithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.54.d: "[GEO.GetNameWithFlag] přijal náš diplomatický návrh na poskytnutí přístupu k přístavům Černého moře." # todo: NEW TRANSLATION
 arme.54.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.55.t: "[GEO.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.55.d: "[GEO.GetNameWithFlag] odmítl náš návrh na přátelství a obchod." # todo: NEW TRANSLATION
 arme.55.a: "Bruh" # todo: NEW TRANSLATION
 arme.55.b: "Musíme pokračovat diplomatické snahy!" # todo: NEW TRANSLATION
 arme.56.t: "[ARM.GetNameWithFlag] Nabízí dohodu o vývozu elektřiny!" # todo: NEW TRANSLATION
 arme.56.d: "Nedávno Arménie navrhla nám dohodu o vývozu elektřiny, díky níž nám na několik let poskytnou elektřinu za dostupnou cenu. Měli bychom souhlasit?" # todo: NEW TRANSLATION
 arme.56.a: "Jistě!" # todo: NEW TRANSLATION
 arme.56.b: "Promiň, ne." # todo: NEW TRANSLATION
 arme.57.t: "[ARM.GetNameWithFlag] Chce koupit naše zbraně" # todo: NEW TRANSLATION
 arme.57.d: "[ARM.GetName] vyjádřil touhu koupit některé z našich zbraní v rámci posílení vojenské spolupráce s námi a posílení svých ozbrojených sil. Měli bychom souhlasit?" # todo: NEW TRANSLATION
 arme.57.a: "Jistě!" # todo: NEW TRANSLATION
 arme.57.b: "Promiň, ne." # todo: NEW TRANSLATION
 arme.58.t: "Vojenská smlouva s [POL.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.58.d: "Oni souhlasili s prodejem svých zbraní nám v rámci vojenské spolupráce mezi oběma zeměmi, což je velmi povzbudivé, protože budeme moci výrazně posílit naše ozbrojené síly." # todo: NEW TRANSLATION
 arme.58.a: "Dobré" # todo: NEW TRANSLATION
 arme.59.t: "Vojenská smlouva s [POL.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.59.d: "Odmítli podepsat smlouvu o dodávce zbraní nám; zřejmě si myslí, že jejich zbraně v našich rukou naruší rovnováhu sil. Hloupost." # todo: NEW TRANSLATION
 arme.59.a: "Škoda" # todo: NEW TRANSLATION
 arme.60.t: "[ARM.GetNameWithFlag] usiluje o zlepšení vztahů s námi" # todo: NEW TRANSLATION
 arme.60.d: "Arménská vláda je zjevně odhodlána prohloubit diplomatické vztahy mezi našimi zeměmi a hodlá nás pozvat k podpisu dohody o přátelství a spolupráci. Měli bychom souhlasit?" # todo: CHANGED
 arme.60.a: "Jistě!" # todo: NEW TRANSLATION
 arme.60.b: "Promiň, ne." # todo: NEW TRANSLATION
 arme.61.t: "Partnerství s [POL.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.61.d: "Polská vláda schválila dohodu o partnerství a přátelství mezi našimi zeměmi, což je bezpochyby povzbudivé, protože čím dál více zemí se stává našimi partnery!" # todo: NEW TRANSLATION
 arme.61.a: "Dobře" # todo: NEW TRANSLATION
 arme.62.t: "Partnerství s [POL.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.62.d: "Polská vláda nám odepřela smlouvu o přátelství a spolupráci, což je smutné, protože jsme vždy zaměřeni na spolupráci mezi našimi zeměmi." # todo: NEW TRANSLATION
 arme.62.a: "Smutné" # todo: NEW TRANSLATION
 arme.63.t: "[ARM.GetNameWithFlag] Žádá o pomoc při rozvoji flotily" # todo: NEW TRANSLATION
 arme.63.d: "Vláda Arménie, odkazující na dohodu uzavřenou v době existence První Arménské republiky, žádá naši vládu o pomoc při rozvoji flotily, protože Arménie znovu získala přístup k moři. Měli bychom souhlasit?" # todo: NEW TRANSLATION
 arme.63.a: "Jistě!" # todo: NEW TRANSLATION
 arme.63.b: "Promiň, ne." # todo: NEW TRANSLATION
 arme.64.t: "[POL.GetFlag]Polská pomoc ve vývoji flotily" # todo: NEW TRANSLATION
 arme.64.d: "Polská vláda souhlasila s tím, že nám pomůže rozvíjet naši flotilu, a nyní posílíme naše námořní síly." # todo: NEW TRANSLATION
 arme.64.a: "Pěkné!" # todo: NEW TRANSLATION
 arme.65.t: "[POL.GetFlag]Polská pomoc ve vývoji flotily" # todo: NEW TRANSLATION
 arme.65.d: "Polská vláda nám odmítla pomoci s rozvojem našich námořních sil s odůvodněním finanční nemožnosti." # todo: NEW TRANSLATION
 arme.65.a: "Smutné" # todo: NEW TRANSLATION
 arme.66.t: "[ARM.GetNameWithFlag] zve nás na připomenutí Bitvy u Grunwaldu" # todo: NEW TRANSLATION
 arme.66.d: "Bitva u Grunwaldu je historickou událostí v historii Polska, kdy Řád německé rytířstvo a jeho spojenci byli zcela poraženi polskou armádou. Historikové rovněž potvrzují účast Arménů na straně polské armády. To výrazně rozzlobí německou stranu. Měli bychom souhlasit?" # todo: NEW TRANSLATION
 arme.66.a: "Je to důvod k hrdosti." # todo: NEW TRANSLATION
 arme.66.b: "Promiň, ne." # todo: NEW TRANSLATION
 arme.67.t: "Polsko-arménský odkaz Bitvy u Grunwaldu" # todo: NEW TRANSLATION
 arme.67.d: "Polská vláda podpořila naši snahu uchovat tuto historickou událost v paměti našich národů jako důvod k hrdosti." # todo: NEW TRANSLATION
 arme.67.a: "Dobře" # todo: NEW TRANSLATION
 arme.68.t: "Polsko-arménský odkaz Bitvy u Grunwaldu" # todo: NEW TRANSLATION
 arme.68.d: "Polská vláda nepodpořila naši snahu o oživení historie událostí těch let; očividně se bojí německé moci." # todo: NEW TRANSLATION
 arme.68.a: "Smutné" # todo: NEW TRANSLATION
 arme.69.t: "Polská třešeň" # todo: NEW TRANSLATION
 arme.69.d: "Každé partnerství začíná malými kroky. Naše vztahy s Polskem začaly polskými bobulemi na našem trhu. Možná odtud můžeme vybudovat něco většího." # todo: CHANGED
 arme.69.a: "Doufáme, že ano" # todo: NEW TRANSLATION
 arme.70.t: "[ARM.GetNameWithFlag] Navrhuje společná cvičení" # todo: NEW TRANSLATION
 arme.70.d: "Arménie má v úmyslu rozšířit vojensko-technickou spolupráci s námi a nabízí uspořádat společná cvičení našich speciálních operačních jednotek s cílem sdílet zkušenosti." # todo: NEW TRANSLATION
 arme.70.a: "Souhlasíme" # todo: NEW TRANSLATION
 arme.70.b: "Ne" # todo: NEW TRANSLATION
 arme.71.t: "Společná cvičení s Řeckem" # todo: NEW TRANSLATION
 arme.71.d: "Řecká vláda naši nabídku přijala a my jsme uspořádali společná cvičení našich speciálních operačních jednotek." # todo: NEW TRANSLATION
 arme.71.a: "Jsme silnější spolu." # todo: NEW TRANSLATION
 arme.72.t: "Společná cvičení s Řeckem" # todo: NEW TRANSLATION
 arme.72.d: "Řecká vláda odmítla provést společná cvičení s našimi speciálními operačními silami." # todo: CHANGED
 arme.72.a: "Musí existovat důvody." # todo: NEW TRANSLATION
 ARM_legacy_of_grunwald_idea: "Dědictví bitvy u Grunwaldu" # todo: NEW TRANSLATION
 ARM_legacy_of_grunwald_idea_desc: "Arménie se dovolává lekce Grunwaldu: jednotného odporu proti germánské hegemonii. Arménie připomíná polsko-litevské spojenectví proti teutonské expanzi a získává bývalé sovětské a východoevropské partnery k vytvoření protiváhy německé průmyslové a politické dominanci v regionu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud se komunisté dostanou k moci." # todo: NEW TRANSLATION
 ARM_anti_turkish_idea: "Antiturkická diplomacie" # todo: NEW TRANSLATION
 ARM_amenia_georgia_electro: "[ARM.GetNameWithFlag]'ův dovoz elektřiny" # todo: NEW TRANSLATION
 ARM_amenia_georgia_electro_agre: "Export elektřiny do [GEO.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.74.t: "[GEO.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.74.d: "Gruzie souhlasila s naší nabídkou exportu elektřiny a nyní budujeme veškerou nezbytnou infrastrukturu pro přepravu elektřiny." # todo: NEW TRANSLATION
 arme.74.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.75.t: "[GEO.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.75.d: "Gruzie považuje naši nabídku exportu elektřiny za škodlivou pro jejich průmysl výroby elektřiny. Proto nechtějí naši elektřinu ve své zemi." # todo: NEW TRANSLATION
 arme.75.a: "Šílené" # todo: NEW TRANSLATION
 ARM_bilat_trade_agreement: "Dvoustranná obchodní dohoda" # todo: NEW TRANSLATION
 ARM_bilat_trade_agreement_desc: "Obchod mezi Arménií a Íránem má velký potenciál. Musíme vytvořit podmínky, aby mezi našimi zeměmi nebyly překážky v obchodě." # todo: NEW TRANSLATION
 ARM_memorandum_of_understanding: "Memorandum o porozumění" # todo: NEW TRANSLATION
 ARM_memorandum_of_understanding_desc: "Státní média Íránu a Arménie musí podepsat memorandum o porozumění a koordinaci v boji proti dezinformacím o obou zemích od jejich společných nepřátel." # todo: NEW TRANSLATION
 ARM_amenia_iran_memo: "[ARM.GetNameWithFlag] - [PER.GetNameWithFlag] Memorandum o porozumění" # todo: NEW TRANSLATION
 ARM_amenia_iran_memo_desc: "Arménie a Írán podepsaly na počátku 21. století zásadní memoranda o porozumění týkající se energetické spolupráce, tranzitních tras a koordinace médií. Tyto dohody uznaly společné zájmy v oblasti stability, přístupu na trhy a společné obrany proti sdíleným rivalům. Partnerství ukotvilo Arménii v síti euroasijských vazeb.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud mínění Íránu o nás klesne pod nulu." # todo: NEW TRANSLATION
 arme.76.t: "[ARM.GetNameWithFlag]'s - [PER.GetNameWithFlag]ian Memorandum o porozumění" # todo: NEW TRANSLATION
 arme.76.d: "Nedávno nám arménská vládní média oslovila s návrhem vzájemně výhodné dohody. Navrhují podepsání memoranda, kterým budou iránská i arménská média bojovat proti dezinformacím o obou zemích, šířeným našimi vzájemnými nepřáteli. Měli bychom souhlasit s tímto návrhem?" # todo: NEW TRANSLATION
 arme.76.a: "Jistě!" # todo: NEW TRANSLATION
 arme.76.b: "Nemáme zájem." # todo: NEW TRANSLATION
 arme.77.t: "[PER.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.77.d: "Írán souhlasil s naším návrhem memoranda, kterým budou íránská a arménská média bojovat proti dezinformacím o obou zemích, šířeným našimi společnými nepřáteli." # todo: NEW TRANSLATION
 arme.77.a: "Skvěle!" # todo: NEW TRANSLATION
 arme.78.t: "[PER.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.78.d: "Írán neviděl žádný užitek ze podepsání memoranda, které jsme jim navrhli." # todo: NEW TRANSLATION
 arme.78.a: "Divné" # todo: NEW TRANSLATION
 arme.80.t: "Politická spolupráce s [ARM.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.80.d: "Arménie je naším partnerem a jedním z národů, které jsou nám duchem nejbližší. Sdílíme společné dědictví a není divu, že Arménie vyjádřila přání rozšířit naši spolupráci." # todo: CHANGED
 arme.80.a: "Jsme přátelé!" # todo: NEW TRANSLATION
 arme.80.b: "Nemáme zájem" # todo: NEW TRANSLATION
 arme.81.t: "Politická spolupráce s [GRE.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.81.d: "Řecko vyjádřilo ochotu spolupracovat s námi v politické rovině a společně můžeme dosáhnout hodně!" # todo: NEW TRANSLATION
 arme.81.a: "Dobré" # todo: NEW TRANSLATION
 arme.82.t: "Politická spolupráce s [GRE.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.82.d: "Řecko není připraveno rozšířit politickou spolupráci s námi, nevidí v tom smysl." # todo: NEW TRANSLATION
 arme.82.a: "Smutné" # todo: NEW TRANSLATION
 arme.83.t: "Společná protiturkická politika" # todo: NEW TRANSLATION
 arme.83.d: "Turecko je pro Arménii i pro nás rovnocennou hrozbou. Arménie navrhuje uskutečnit společnou protiturkickou politiku, aby turecká vláda poznala své místo." # todo: NEW TRANSLATION
 arme.83.a: "Turecko by se mělo bát nás" # todo: NEW TRANSLATION
 arme.83.b: "Nemáme zájem" # todo: NEW TRANSLATION
 arme.84.t: "Společná protiturkická politika" # todo: NEW TRANSLATION
 arme.84.d: "Řecká vláda podpořila naši protiturkickou politickou iniciativu a hodláme bojovat proti tureckému vlivu na nás." # todo: NEW TRANSLATION
 arme.84.a: "Dobré" # todo: NEW TRANSLATION
 arme.85.t: "Společná protiturkická politika" # todo: NEW TRANSLATION
 arme.85.d: "Řecká vláda se rozhodla naši protiturkickou iniciativu nepodpořit, což nám způsobilo zklamání." # todo: NEW TRANSLATION
 arme.85.a: "Smutné" # todo: NEW TRANSLATION
 arme.86.t: "Partnerství s [ARM.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.86.d: "Arménie hodlá rozšířit své partnerství s námi v rámci spolupráce s EU. Považuje nás za bránu do celé Evropské unie." # todo: CHANGED
 arme.86.a: "Jsme přátelé!" # todo: NEW TRANSLATION
 arme.86.b: "Nemáme zájem" # todo: NEW TRANSLATION
 arme.87.t: "Politická spolupráce s [GRE.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.87.d: "Řecko je připraveno rozšířit naši politickou spolupráci a je také připraveno pomoci navázat kontakty s Evropskou unií." # todo: NEW TRANSLATION
 arme.87.a: "Dobré" # todo: NEW TRANSLATION
 arme.88.t: "Pomoc v boji o Kypr" # todo: NEW TRANSLATION
 arme.88.d: "Arménská vláda podporuje naše snahy o ochranu našich zájmů na Kypru a je připravena nám poskytnout maximální podporu v této bitvě. Jsme připraveni zvýšit laťku a zapojit Arménii do tohoto?" # todo: NEW TRANSLATION
 arme.88.a: "Ano" # todo: NEW TRANSLATION
 arme.88.b: "Nemáme zájem" # todo: NEW TRANSLATION
 arme.89.t: "Pomoc v boji o Kypr" # todo: NEW TRANSLATION
 arme.89.d: "Řecká vláda vyjádřila velkou radost z naší nabídky pomoci v otázce Kypru a jasně naznačila, že bychom jí mohli pomoci jakýmkoli nezbytným způsobem." # todo: CHANGED
 arme.89.a: "Dobré" # todo: NEW TRANSLATION
 arme.90.t: "Pomoc v boji o Kypr" # todo: NEW TRANSLATION
 arme.90.d: "Řecká vláda naši nabídku odmítla a varovala nás, abychom se do otázky Kypru nevměšovali. Zdá se, že se více obává eskalace, než touží po řešení." # todo: CHANGED
 arme.90.a: "Smutné" # todo: NEW TRANSLATION
 arme.91.t: "Arménie nás podporuje na Kypru" # todo: NEW TRANSLATION
 arme.91.d: "Arménské speciální služby nám aktivně pomáhají řešit naši situaci na Kypru, čímž nám pomáhají zvýšit náš vliv na ostrov." # todo: NEW TRANSLATION
 arme.91.a: "Dobré" # todo: NEW TRANSLATION
 ARM_mithridates_legacy: "Dědictví Mithridata" # todo: NEW TRANSLATION
 ARM_mithridates_legacy_desc: "Už od dávných dob Arméni a Řekové sdílejí společné hodnoty, krevní bratrství a společné nepřátele. Ve tradici dědictví Mithridata Pontského musíme pokračovat v přátelství našich bratrských národů." # todo: NEW TRANSLATION
 ARM_reassuring_comp_agre: "Komplexní dohoda" # todo: NEW TRANSLATION
 ARM_reassuring_comp_agre_desc: "Musíme uzavřít komplexní dohodu o přátelství s Řeckem, aby naše vztahy byly oficiálně uzavřeny na vládní úrovni." # todo: NEW TRANSLATION
 ARM_anti_turk_diplo: "Antiturkická diplomacie" # todo: NEW TRANSLATION
 ARM_anti_turk_diplo_desc: "Musíme koordinovat naše diplomatické snahy s Řeckem, abychom čelili tureckým ambicím vůči nám." # todo: NEW TRANSLATION
 ARM_our_friend_in_eu: "Náš přítel v EU" # todo: NEW TRANSLATION
 ARM_our_friend_in_eu_desc: "Řecko je naším nejbližším spojencem v Evropské unii. Musíme toho využít." # todo: NEW TRANSLATION
 ARM_support_cyprus: "Podpora Kypru" # todo: NEW TRANSLATION
 ARM_support_cyprus_desc: "Stejně jako Artsakh, i Řecko má Kypr. Turecké tyranské kroky jsou tam také. Musíme podpořit řeckou věc na Kypru." # todo: NEW TRANSLATION
 arme.79.t: "[ARM.GetNameWithFlag] Navrhuje projekt přehrady!" # todo: NEW TRANSLATION
 arme.79.d: "Nedávno arménská vláda navrhla společný projekt vodní elektrárny na řece Araks, která protéká mezi našimi hranicemi. Měli bychom souhlasit s jejich návrhem?" # todo: NEW TRANSLATION
 arme.79.a: "Jistě, souhlasíme!" # todo: NEW TRANSLATION
 arme.79.b: "Ne, nemáme zájem." # todo: NEW TRANSLATION
 arme.92.t: "[PER.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.92.d: "Írán souhlasil se společnou výstavbou vodní elektrárny v regionu Syunik. Již zaplatili svou část ceny." # todo: NEW TRANSLATION
 arme.92.a: "Skvělé!" # todo: NEW TRANSLATION
 ARM_amenia_iran_dam_share: "Podíl hydroelektrárny Syunik" # todo: NEW TRANSLATION
 ARM_amenia_iran_dam_share_desc: "Arménie a Írán společně investovaly do hydroelektrické infrastruktury podél řeky Araks v provincii Sjunik a vytvořily sdílenou výrobu energie a vzájemnou hospodářskou závislost. Tento společný podnik byl příkladem praktické přeshraniční spolupráce a poskytl Arménii levnou elektřinu, zatímco Írán získal vliv na arménskou energetickou bezpečnost.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud mínění Íránu o nás klesne pod nulu." # todo: NEW TRANSLATION
 idea_willcanc_if_rel_tt: "§YTento národní duch bude odstraněn, pokud se naše vztahy s [ARM.GetNameWithFlag] zhorší.§!" # todo: CHANGED
 arme.93.t: "[PER.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.93.d: "Írán nemá zájem o výstavbu hydroelektrárny v regionu Syunik." # todo: NEW TRANSLATION
 arme.93.a: "Velmi nešťastné." # todo: NEW TRANSLATION
 ARM_arax_hydro_power: "Araks Hydro Power" # todo: NEW TRANSLATION
 ARM_arax_hydro_power_desc: "Můžeme Íránu navrhnout dohodu o výstavbě hydroelektrárny v regionu Syunik na řece Araks." # todo: NEW TRANSLATION
 ARM_export_weapons_iran: "Export zbraní do Íránu" # todo: NEW TRANSLATION
 ARM_export_weapons_iran_desc: "Zahraniční tlak na Írán připravil Teherán o spolehlivé dodavatele zbraní. Možná by měl zájem koupit naše zbraně za rozumnou cenu." # todo: CHANGED
 arme.94.t: "[ARM.GetNameWithFlag] Nabízí dohodu o zbraních!" # todo: NEW TRANSLATION
 arme.94.d: "Nedávno nám arménská vláda navrhla dodávku zbraní pro pěchotu nejvyšší kvality. Nabízejí nám rozumnou cenu vzhledem k současné situaci." # todo: NEW TRANSLATION
 arme.94.a: "Jistě, souhlasíme!" # todo: NEW TRANSLATION
 arme.94.b: "Nemáme zájem." # todo: NEW TRANSLATION
 arme.95.t: "[PER.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.95.d: "Írán souhlasil s nákupem našich zbraní, dodávka bude brzy dokončena." # todo: NEW TRANSLATION
 arme.95.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.96.t: "[PER.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.96.d: "Írán nesouhlasil s naší dohodou o nákupu zbraní." # todo: NEW TRANSLATION
 arme.96.a: "Velmi nešťastné." # todo: NEW TRANSLATION
 ARM_free_trade_zone: "Meghri volná obchodní zóna" # todo: NEW TRANSLATION
 ARM_free_trade_zone_desc: "Zóna volného obchodu založená v provincii Meghri s cílem usnadnit obchodní toky, omezit celní překážky a přilákat zahraniční investice do jižního pohraničního regionu spojujícího Arménii s Íránem." # todo: NEW TRANSLATION
 ARM_third_power_transmission: "Meghri volná ekonomická zóna" # todo: NEW TRANSLATION
 ARM_third_power_transmission_desc: "Pro zvýšení našeho obchodu s Íránem bychom měli zřídit ve Meghri volnou obchodní zónu." # todo: NEW TRANSLATION
 ARM_iranian_drone_deal: "Nákup íránských dronů" # todo: NEW TRANSLATION
 ARM_iranian_drone_deal_desc: "Íránské drony se v moderním boji osvědčily. Jejich získání by našim ozbrojeným silám poskytlo významnou schopnost za zlomek ceny západních alternativ." # todo: CHANGED
 arme.97.t: "[ARM.GetNameWithFlag] Chce koupit naše drony!" # todo: NEW TRANSLATION
 arme.97.d: "Nedávno Arménie projevila zájem o nákup našich dronů. Měli bychom souhlasit s jejich nabídkou a poskytnout jim drony za vhodnou cenu?" # todo: NEW TRANSLATION
 arme.97.a: "Jistě!" # todo: NEW TRANSLATION
 arme.97.b: "Promiňte, ne." # todo: NEW TRANSLATION
 arme.98.t: "[PER.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.98.d: "Írán souhlasil prodat nám některé ze svých dronů. Brzy budou dodány." # todo: NEW TRANSLATION
 arme.98.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.99.t: "[PER.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.99.d: "Írán nesouhlasil s naší dohodou o nákupu dronů." # todo: NEW TRANSLATION
 arme.99.a: "Hm." # todo: NEW TRANSLATION
 ARM_covert_defense_agreement: "Tajná obranná dohoda" # todo: NEW TRANSLATION
 ARM_covert_defense_agreement_desc: "Musíme se s Íránem spojit na tajné, hlubší úrovni, aby byla zajištěna bezpečnost našich obou států." # todo: NEW TRANSLATION
 arme.100.t: "[ARM.GetNameWithFlag] Nabízí tajnou obrannou dohodu!" # todo: NEW TRANSLATION
 arme.100.d: "Tajná obranná dohoda byla podepsána." # todo: NEW TRANSLATION
 arme.100.a: "Jistě!" # todo: NEW TRANSLATION
 arme.100.b: "Ne, nemůžeme si to dovolit." # todo: NEW TRANSLATION
 arme.101.t: "[PER.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.101.d: "Tajná obranná dohoda byla podepsána." # todo: NEW TRANSLATION
 arme.101.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.102.t: "[PER.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.102.d: "Tajná obranná dohoda nebyla podepsána." # todo: NEW TRANSLATION
 arme.102.a: "Hm..." # todo: NEW TRANSLATION
 arme.103.t: "Povstání v Kurdistánu" # todo: NEW TRANSLATION
 arme.103.d: "Kurdy se vzbouřili v regionech jejich pobytu, které se nacházejí na území naší země, byli zjevně podpořeni někým ze zahraničí. Naše zpravodajství uvádí, že šlo o činnost arménských zvláštních služeb." # todo: NEW TRANSLATION
 arme.103.a: "Arménie za to zaplatí." # todo: NEW TRANSLATION
 arme.104.t: "Povstalecké bataliony" # todo: NEW TRANSLATION
 arme.104.d: "Naše povstání nabírá na síle, již byly vytvořeny celé bataliony, které jsou připravené bránit naši svobodu proti íránské okupaci." # todo: NEW TRANSLATION
 arme.104.a: "Za svobodu Kurdistánu" # todo: NEW TRANSLATION
 arme.105.t: "Obchodní dohoda s Arménií" # todo: NEW TRANSLATION
 arme.105.d: "Arménská vláda s námi chce uzavřít obchodní dohodu mimo struktury EU. Domnívá se, že přímá spolupráce je účinnější než čekat roky, než evropská byrokracie začne jednat." # todo: CHANGED
 arme.105.a: "Souhlasíme" # todo: NEW TRANSLATION
 arme.105.b: "Nesouhlasíme" # todo: NEW TRANSLATION
 arme.106.t: "Dohoda o hospodářské a obchodní spolupráci s Arménií" # todo: NEW TRANSLATION
 arme.106.d: "Arménská vláda hodlá prohloubit kulturní a hospodářské vazby s naší zemí. Arménie navrhuje uzavřít řadu smluv a dohod zaměřených na spolupráci v těchto oblastech mezi našimi zeměmi." # todo: NEW TRANSLATION
 arme.106.a: "Souhlasíme" # todo: NEW TRANSLATION
 arme.106.b: "Nesouhlasíme" # todo: NEW TRANSLATION
 arme.107.t: "Obchodní dohoda s Francií" # todo: NEW TRANSLATION
 arme.107.d: "Francouzská vláda souhlasila s uzavřením řady dohod o hospodářské a kulturní spolupráci s námi." # todo: NEW TRANSLATION
 arme.107.a: "Skvělé" # todo: NEW TRANSLATION
 arme.108.t: "Obchodní dohoda s Francií" # todo: NEW TRANSLATION
 arme.108.d: "Francouzská vláda odmítla rozšířit spolupráci s námi v kulturní a ekonomické sféře, zřejmě nás nepovažuje za možné partnery." # todo: NEW TRANSLATION
 arme.108.a: "Smutné" # todo: NEW TRANSLATION
 arme.109.t: "Dohoda o spolupráci ve vzdělávání s Arménií" # todo: NEW TRANSLATION
 arme.109.d: "Arménská vláda vyjádřila zájem o spolupráci s našimi vzdělávacími institucemi a ráda by v jejich zemi zřídila zastoupení našich nejlepších univerzit. To je skvělá příležitost ovlivnit myšlení arménské mládeže." # todo: NEW TRANSLATION
 arme.109.a: "Souhlasíme" # todo: NEW TRANSLATION
 arme.109.b: "Nesouhlasíme" # todo: NEW TRANSLATION
 arme.110.t: "Dohoda o spolupráci ve vzdělávání s Francií" # todo: NEW TRANSLATION
 arme.110.d: "Francouzská vláda vyjádřila ochotu a vůli aktivně s námi spolupracovat v oblasti vzdělávání a je také připravena otevřít zastoupení svých vysokých škol v naší zemi." # todo: NEW TRANSLATION
 arme.110.a: "Pěkné" # todo: NEW TRANSLATION
 arme.111.t: "Dohoda o spolupráci ve vzdělávání s Francií" # todo: NEW TRANSLATION
 arme.111.d: "Francouzská vláda odmítla naši nabídku vzdělávací spolupráce. Zdá se, že v této oblasti nemá náladu na dialog s námi." # todo: CHANGED
 arme.111.a: "Smutné" # todo: NEW TRANSLATION
 arme.112.t: "Vojenská spolupráce s Arménií" # todo: NEW TRANSLATION
 arme.112.d: "Arménská vláda má v úmyslu nabídnout nám vojenskou spolupráci mezi našimi zeměmi, Arménie má velký zájem o zkušenosti z našich mezinárodních misí, stejně jako o zkušenosti Cizinecké legie." # todo: NEW TRANSLATION
 arme.112.a: "Souhlasíme" # todo: NEW TRANSLATION
 arme.112.b: "Nesouhlasíme" # todo: NEW TRANSLATION
 arme.113.t: "Vojenská spolupráce s Francií" # todo: NEW TRANSLATION
 arme.113.d: "Francouzská vláda souhlasila se spoluprací mezi našimi ozbrojenými silami, zejména v získávání zkušeností s mezinárodními misemi, stejně jako s některými operacemi Cizinecké legie." # todo: NEW TRANSLATION
 arme.113.a: "Skvělé" # todo: NEW TRANSLATION
 arme.114.t: "Vojenská spolupráce s Francií" # todo: NEW TRANSLATION
 arme.114.d: "Francouzská vláda odmítla s námi vojensky spolupracovat; zřejmě nevěří, že naše armáda je schopna učit se z cizích zkušeností." # todo: NEW TRANSLATION
 arme.114.a: "Smutné" # todo: NEW TRANSLATION
 arme.115.t: "Arménie ve Francophonie" # todo: NEW TRANSLATION
 arme.115.d: "Arménská vláda se již dlouho snaží stát součástí Francophonie; možná to bude pro ně něco navíc, protože časem budeme moci je plně začlenit do frankofonní sféry. Stojí za to podpořit arménskou touhu stát se součástí Francophonie?" # todo: NEW TRANSLATION
 arme.115.a: "Ano" # todo: NEW TRANSLATION
 arme.115.b: "Ne" # todo: NEW TRANSLATION
 arme.116.t: "Arménie ve Francophonie" # todo: NEW TRANSLATION
 arme.116.d: "Francie pozitivně reagovala na naši touhu stát se součástí Francophonie, a nyní, když jsme v její sféře vlivu, můžeme počítat s jejich podporou." # todo: NEW TRANSLATION
 arme.116.a: "Pěkné" # todo: NEW TRANSLATION
 arme.117.t: "Arménie ve Francophonie" # todo: NEW TRANSLATION
 arme.117.d: "Francie se rozhodla odmítnout naše přání stát se součástí Francophonie a v budoucnu částí celé frankofonní sféry." # todo: NEW TRANSLATION
 arme.117.a: "Smutné" # todo: NEW TRANSLATION
 arme.118.t: "Arménie chce vstoupit do našeho evropského vojenského programu" # todo: NEW TRANSLATION
 arme.118.d: "Program státního partnerství Národní gardy USA (EUCOM SPP) podle své mise je program státního partnerství Národní gardy, který spojuje americké státy s vybranými partnery zeměmi na podporu cílů bezpečnostní spolupráce velitelství. V současnosti existuje 22 partnerství se zeměmi bývalého Sovětského svazu, Jugoslávie a zeměmi Varšavského paktu v oblasti odpovědnosti EUCOM. Po rozpadu Sovětského svazu 26. prosince 1991 tyto země brzy požádaly USA o radu a pomoc při vytváření nových obranných sil." # todo: NEW TRANSLATION
 arme.118.a: "Jistě, potřebujeme vycvičit naše spojence" # todo: NEW TRANSLATION
 arme.118.b: "Promiň, ne" # todo: NEW TRANSLATION
 arme.119.t: "[USA.GetNamewithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.119.d: "[FROM.GetNameWithFlag] přijali naši iniciativu, a nyní naše jednotky se budou účastnit společných cvičení s našimi evropskými spojenci." # todo: NEW TRANSLATION
 arme.119.a: "Perfektní" # todo: NEW TRANSLATION
 arme.120.t: "[USA.GetNamewithFlag] Nám to zamítl." # todo: NEW TRANSLATION
 arme.120.d: "Naše zahraniční politika to možná ovlivnila, ale nebylo nám dovoleno účastnit se společných cvičení evropských zemí." # todo: NEW TRANSLATION
 arme.120.a: "Špatné" # todo: NEW TRANSLATION
 arme.121.t: "Společné cvičení se státem Kansas" # todo: NEW TRANSLATION
 arme.121.d: "Arménie si přeje uspořádat společné cvičení s naší Kansas State Army" # todo: NEW TRANSLATION
 arme.121.a: "Jistě" # todo: NEW TRANSLATION
 arme.121.b: "Nikdy" # todo: NEW TRANSLATION
 arme.122.t: "[USA.GetNamewithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.122.d: "[FROM.GetNameWithFlag] souhlasí se společnými cvičeními mezi naší armádou a Národní gardou státu Kansas." # todo: NEW TRANSLATION
 arme.122.a: "Perfektní" # todo: NEW TRANSLATION
 arme.123.t: "[USA.GetNamewithFlag] Zamítl naši žádost." # todo: NEW TRANSLATION
 arme.123.d: "Bohužel, nebudeme moci zlepšit připravenost naší armády ve společných cvičeních se státem Kansas." # todo: NEW TRANSLATION
 arme.123.a: "Špatné" # todo: NEW TRANSLATION
 arme.124.t: "Arménie si přeje získat status hlavního nestátního spojence NATO" # todo: NEW TRANSLATION
 arme.124.d: "Arménie považujeme za klíčovou zemi v regionu Kavkazu a její členství v programu partnerství mimo NATO je dobrou perspektivou pro rozšíření našeho vlivu tam." # todo: NEW TRANSLATION
 arme.124.a: "Ano, souhlasíme" # todo: NEW TRANSLATION
 arme.124.b: "Ne, Arménie je slabá" # todo: NEW TRANSLATION
 arme.125.t: "[USA.GetNamewithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.125.d: "Spojené státy americké [USA.GetNamewithFlag] ratifikovaly naši žádost a nyní máme jedinečnou příležitost k vojenské spolupráci s NATO." # todo: NEW TRANSLATION
 arme.125.a: "Dobré" # todo: NEW TRANSLATION
 arme.126.t: "[USA.GetNamewithFlag] Zamítl naši žádost." # todo: NEW TRANSLATION
 arme.126.d: "Naše vláda neprovedla veškeré nezbytné reformy, aby [USA.GetNamewithFlag] souhlasil." # todo: NEW TRANSLATION
 arme.126.a: "Nic moc" # todo: NEW TRANSLATION
 arme.127.t: "Další investice do [ARM.GetNamewithFlag]?" # todo: NEW TRANSLATION
 arme.127.d: "Je nutné rozvíjet hospodářské vazby mezi našimi zeměmi prostřednictvím různých společných programů" # todo: NEW TRANSLATION
 arme.127.a: "Ano, jistě" # todo: NEW TRANSLATION
 arme.127.b: "Nikdy" # todo: NEW TRANSLATION
 arme.128.t: "[USA.GetNamewithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.128.d: "Naštěstí jsme byli schopni přesvědčit [USA.GetNamewithFlag] o dodatečných programech financování v naší zemi." # todo: NEW TRANSLATION
 arme.128.a: "Dobré" # todo: NEW TRANSLATION
 arme.129.t: "[USA.GetNamewithFlag] Zamítl naši žádost." # todo: NEW TRANSLATION
 arme.129.d: "Bohužel, [USA.GetNamewithFlag] o to nemá zájem." # todo: NEW TRANSLATION
 arme.129.a: "Špatné" # todo: NEW TRANSLATION
 arme.130.t: "[ARM.GetNamewithFlag] Požaduje platby v rámci Millennium Challenge Compact" # todo: NEW TRANSLATION
 arme.130.d: "Arménie věří, že jejich stát prošel všemi fázemi zlepšeného řízení a je připravena na vyplácení prostředků v rámci programu Millennium Challenge Compact." # todo: NEW TRANSLATION
 arme.130.a: "Jistě, jsou připraveni" # todo: NEW TRANSLATION
 arme.130.b: "Ne, opravte svou zemi" # todo: NEW TRANSLATION
 arme.131.t: "[USA.GetNamewithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.131.d: "Podmínky plateb jsme získali, protože vláda [USA.GetNamewithFlag] je přesvědčena, že jsme na to plně připraveni." # todo: NEW TRANSLATION
 arme.131.a: "Dobré" # todo: NEW TRANSLATION
 arme.132.t: "[USA.GetNamewithFlag] Zamítl naši žádost." # todo: NEW TRANSLATION
 arme.132.d: "Naše vláda neprovedla všechny nezbytné reformy, aby [USA.GetNamewithFlag] souhlasil." # todo: NEW TRANSLATION
 arme.132.a: "Nic moc" # todo: NEW TRANSLATION
 arme.133.t: "Lobování ANCA" # todo: NEW TRANSLATION
 arme.133.d: "Arménská Národní komise Ameriky (ANCA) je arménsko-americká občanská organizace na základní bázi. Její sídlo se nachází ve Washingtonu, D.C., a má regionální kanceláře v Glendale, Kalifornie, a Watertown, Massachusetts." # todo: NEW TRANSLATION
 arme.133.a: "Dobré" # todo: NEW TRANSLATION
 arme.134.t: "[ARM.GetNamewithFlag] Žádá o uznání Arménské genocidy" # todo: NEW TRANSLATION
 arme.134.d: "Arménie usiluje o uznání Arménské genocidy velmi intenzivně. Pokud s tím souhlasíme, náš vliv v Arménii se výrazně posílí, ale narušíme naše vztahy s Tureckem." # todo: NEW TRANSLATION
 arme.134.a: "Turecko by za to mělo být potrestáno" # todo: NEW TRANSLATION
 arme.134.b: "Arménie co?" # todo: NEW TRANSLATION
 arme.135.t: "[USA.GetNamewithFlag] Uznali genocidu!" # todo: NEW TRANSLATION
 arme.135.d: "Tento den bude skutečně jedním z nejdůležitějších dní v historii Arménie, neboť se nám podařilo přesvědčit [USA.GetNamewithFlag], aby uznaly genocidu spáchanou Tureckem." # todo: NEW TRANSLATION
 arme.135.a: "Hurá!" # todo: NEW TRANSLATION
 arme.136.t: "[USA.GetNamewithFlag] Předstírají, že neví, o čem mluvíme." # todo: NEW TRANSLATION
 arme.136.d: "Bohužel USA dává přednost přátelství s [TUR.GetNamewithFlag] spíše než s námi." # todo: NEW TRANSLATION
 arme.136.a: "Špatné" # todo: NEW TRANSLATION
 arme.137.t: "[ARM.GetNamewithFlag] odstupuje od vojenských dohod s [USA.GetNamewithFlag]" # todo: NEW TRANSLATION
 arme.137.d: "Patříme mezi slabé země, které se neumí o sebe postarat? Tyto země jsou vysoce závislé na názoru [USA.GetNamewithFlag], protože spoléhají jen na [USA.GetNamewithFlag] zbrojní výrobu a dodávky, a tím ohrožují svou bezpečnost tím, že jsou závislé na Washingtonu. O to už nestojíme." # todo: NEW TRANSLATION
 arme.137.a: "Vypadně NATO!" # todo: NEW TRANSLATION
 arme.144.t: "Zmrazení aktiv [USA.GetNamewithFlag]" # todo: NEW TRANSLATION
 arme.144.d: "Měna, kterou [USA.GetNamewithFlag] vkládala do naší země, měla za cíl svrhnout naši vládu. Nacionalizujeme tento kapitál jako kompenzaci." # todo: NEW TRANSLATION
 arme.144.a: "Patří nám" # todo: NEW TRANSLATION
 arme.145.t: "Odstoupení od nevládních organizací" # todo: NEW TRANSLATION
 arme.145.d: "[USA.GetNamewithFlag] financuje organizace, které ohrožují naši bezpečnost. Už nemáme zájem se na nich podílet." # todo: NEW TRANSLATION
 arme.145.a: "Lepší tak" # todo: NEW TRANSLATION
 arme.149.t: "[ARM.GetNamewithFlag] Chce rozšířit kulturní vazby" # todo: NEW TRANSLATION
 arme.149.d: "Naše národy jsou spojeny staletími historie a v budoucnu musíme tento odkaz udržet. Kromě toho naše země vzájemně profitují z takové spolupráce v politickém i hospodářském smyslu." # todo: NEW TRANSLATION
 arme.149.a: "Jistě" # todo: NEW TRANSLATION
 arme.149.b: "Ne" # todo: NEW TRANSLATION
 arme.150.t: "[SYR.GetNamewithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.150.d: "Syrská vláda s námi plně souhlasí a je připravena dále posílit kulturní interakci." # todo: NEW TRANSLATION
 arme.150.a: "Dobře" # todo: NEW TRANSLATION
 arme.151.t: "[SYR.GetNamewithFlag] Odmítá kulturní spolupráci" # todo: NEW TRANSLATION
 arme.151.d: "Nemají o to zájem a odmítli naši nabídku." # todo: NEW TRANSLATION
 arme.151.a: "Špatně" # todo: NEW TRANSLATION
 arme.152.t: "[ARM.GetNamewithFlag] Evakuuje diasporu zpět do [ARM.GetNamewithFlag]" # todo: NEW TRANSLATION
 arme.152.d: "V důsledku války, do které je naše země zapojena, se arménská vláda rozhodla evakuovat své obyvatelstvo zpět do [ARM.GetNamewithFlag]." # todo: NEW TRANSLATION
 arme.152.a: "Přejeme šťastnou cestu!" # todo: NEW TRANSLATION
 arme.153.t: "Arméni dorazili ze [SYR.GetNamewithFlag]" # todo: NEW TRANSLATION
 arme.153.d: "Podařilo se nám evakuovat naše obyvatele ze Sýrie, která prochází v současnosti obtížnými časy." # todo: NEW TRANSLATION
 arme.153.a: "Dobře" # todo: NEW TRANSLATION
 arme.154.t: "Humanitární pomoc [SYR.GetNamewithFlag]" # todo: NEW TRANSLATION
 arme.154.d: "Naši syrští přátelé jsou v obtížné situaci, takže jim poskytneme humanitární pomoc." # todo: NEW TRANSLATION
 arme.154.a: "Naši bratři musí být zachráněni!" # todo: NEW TRANSLATION
 arme.155.t: "[ARM.GetNamewithFlag] Poskytuje humanitární pomoc" # todo: NEW TRANSLATION
 arme.155.d: "Naši Přátelé z [ARM.GetNamewithFlag] nám poslali humanitární pomoc. Náš lid srdečně děkuje arménskému lidu za to, že na nás nezapomněl." # todo: NEW TRANSLATION
 arme.155.a: "Bůh chraň Arménii!" # todo: NEW TRANSLATION
 arme.156.t: "[ARM.GetNamewithFlag] Posílá nám vojenskou pomoc" # todo: NEW TRANSLATION
 arme.156.d: "[ARM.GetNamewithFlag] je ochotné nám poskytnout pomoc, která by měla zlepšit naši situaci na frontě." # todo: NEW TRANSLATION
 arme.156.a: "Díky" # todo: NEW TRANSLATION
 arme.156.b: "Nepotřebujeme to" # todo: NEW TRANSLATION
 arme.157.t: "[SYR.GetNamewithFlag] Přijímá naši pomoc" # todo: NEW TRANSLATION
 arme.157.d: "Jejich vojenské vedení děkuje za naši poskytnutou pomoc." # todo: NEW TRANSLATION
 arme.157.a: "Dobře" # todo: NEW TRANSLATION
 arme.158.t: "[SYR.GetNamewithFlag] Odmítá pomoc" # todo: NEW TRANSLATION
 arme.158.d: "Zřejmě naši pomoc nepotřebují." # todo: NEW TRANSLATION
 arme.158.a: "Dobře" # todo: NEW TRANSLATION
 arme.163.t: "[ARM.GetNamewithFlag] Chce vstoupit do NATO" # todo: NEW TRANSLATION
 arme.163.d: "Ujišťují, že budou pracovat pro společný cíl a stanou se klíčovým spojencem ve svém regionu." # todo: NEW TRANSLATION
 arme.163.a: "Jistě" # todo: NEW TRANSLATION
 arme.163.b: "Ne" # todo: NEW TRANSLATION
 arme.165.t: "[USA.GetNamewithFlag] Odmítá naši žádost" # todo: NEW TRANSLATION
 arme.165.d: "Nemají zájem o náš vstup do NATO." # todo: NEW TRANSLATION
 arme.165.a: "Škoda" # todo: NEW TRANSLATION
 ARM_relations_with_america: "Vztahy se USA" # todo: NEW TRANSLATION
 ARM_relations_with_america_desc: "USA má velkou arménskou diasporu a velmi dobré historické vztahy s námi. Od prezidenta Wilsona vnívalo mnoho Arménů Ameriku jako našeho spolehlivého partnera." # todo: NEW TRANSLATION
 ARM_join_us_eur_partn_prog: "Evropské velenství – Program státního partnerství" # todo: NEW TRANSLATION
 ARM_join_us_eur_partn_prog_desc: "Spojené státy nabízejí program vojenského partnerství se svými vojenskými rezervami, který má za cíl vybudovat naše nové vojenské struktury." # todo: NEW TRANSLATION
 ARM_expand_us_embassy: "Rozšíření americké ambasády" # todo: NEW TRANSLATION
 ARM_expand_us_embassy_desc: "Spojené státy již mají velký kus půdy pod kontrolou své ambasády. Pokud však budou chtít více půdy pro svou ambasádu, můžeme ji pro ně zajistit." # todo: NEW TRANSLATION
 ARM_additional_programs_for_armenia: "Další programy pro Arménii" # todo: NEW TRANSLATION
 ARM_additional_programs_for_armenia_desc: "USA nám může poskytnout další rozvojové programy, které by byly výlučně zaměřeny na Arménii." # todo: NEW TRANSLATION
 ARM_millennium_challenge_compact: "Kompakt Millennium Challenge" # todo: NEW TRANSLATION
 ARM_millennium_challenge_compact_desc: "Millennium Challenge je pětiletá vládní dohoda USA mezi MCC a způsobilou zemí na financování specifických programů zaměřených na snižování chudoby a stimulaci hospodářského růstu." # todo: NEW TRANSLATION
 ARM_anca_lobbying: "Lobbying ANCA" # todo: NEW TRANSLATION
 ARM_anca_lobbying_desc: "Arménská národní komise Ameriky je arménsko-americká občanská organizace. Její sídlo je ve Washingtonu, D.C., a má regionální kanceláře v Glendale, Kalifornii, a Watertown, Massachusetts." # todo: NEW TRANSLATION
 ARM_us_recog_arm_gen: "Uznání genocidy Arménů Spojenými státy" # todo: NEW TRANSLATION
 ARM_us_recog_arm_gen_desc: "Musíme požádat USA, aby konečně vyvinuly tlak na Turecko a uznaly turecké zvěrstva během první světové války jako genocidu." # todo: NEW TRANSLATION
 ARM_kansas_armenia_partnership: "Státní partnerství Kansasu a Arménie" # todo: NEW TRANSLATION
 ARM_kansas_armenia_partnership_desc: "Arménská armáda navázala partnerství s národní gardou Kansasu prostřednictvím programu CSPP USA. Musíme provádět společná školení." # todo: NEW TRANSLATION
 ARM_req_mnna_status: "Žádáme o status hlavního spojence mimo NATO" # todo: NEW TRANSLATION
 ARM_req_mnna_status_desc: "Nyní, když jsme prokázali skutečnou loajalitu k západní věci, možná bychom měli žádat USA o status hlavního spojence mimo NATO." # todo: NEW TRANSLATION
 ARM_stopping_usaid: "Zastavení USAID" # todo: NEW TRANSLATION
 ARM_stopping_usaid_desc: "USAID je organizace, která dělá jen propagaci amerických zájmů. Musí být zastavena!" # todo: NEW TRANSLATION
 ARM_close_us_embassy: "Uzavření velvyslanectví" # todo: NEW TRANSLATION
 ARM_close_us_embassy_desc: "USA proti nám konspirují prostřednictvím své ambasády už příliš dlouho. To musí být ukončeno." # todo: NEW TRANSLATION
 ARM_seizing_us_investments: "Zabavování amerických investic" # todo: NEW TRANSLATION
 ARM_seizing_us_investments_desc: "Jakékoliv americké investice směřují nikoli k prosperitě hostitelské země, ale k ziskům amerických elit. Musíme je zabavit!" # todo: NEW TRANSLATION
 ARM_stop_military_coop: "Zastavení vojenské spolupráce" # todo: NEW TRANSLATION
 ARM_stop_military_coop_desc: "Nemáme žádný užitek z vojenské spolupráce s slabými Američany." # todo: NEW TRANSLATION
 ARM_no_more_relations_with_us: "Žádné další vztahy se USA" # todo: NEW TRANSLATION
 ARM_no_more_relations_with_us_desc: "Nelze si dovolit mít JAKÉKOLI vztahy s teroristickou zemí USA." # todo: NEW TRANSLATION
 ARM_no_more_ngo_funds: "Žádné další prostředky pro nevládní organizace" # todo: NEW TRANSLATION
 ARM_no_more_ngo_funds_desc: "NVO jsou sociální špionážní organizace, které prosazují hodnoty, jež nesedí s naší agendou. To musí být zastaveno." # todo: NEW TRANSLATION
 ARM_anti_nato_propaganda: "Propaganda proti NATO" # todo: NEW TRANSLATION
 ARM_anti_nato_propaganda_desc: "NATO je imperialistická organizace západní hegemonie! Jak jinak světu říci pravdu o nich?" # todo: NEW TRANSLATION
 ARM_combat_us_influence: "Boj proti vlivu USA" # todo: NEW TRANSLATION
 ARM_combat_us_influence_desc: "Musíme čelit vlivu USA na každém rohu. Od kultury po ekonomiku, působení Ameriky musí být omezeno." # todo: NEW TRANSLATION
 ARM_relations_with_iran: "Vztahy s Íránem" # todo: NEW TRANSLATION
 ARM_relations_with_iran_desc: "Írán je jedním z našich nejstarších sousedů. Přišel čas rozhodnout, jaké budou naše vztahy v 21. století." # todo: NEW TRANSLATION
 ARM_close_border_with_iran: "Zavřít hranici s Íránem" # todo: NEW TRANSLATION
 ARM_close_border_with_iran_desc: "Musíme zavřít naši hranici s Íránem, abychom už nepovolili žádný obchod s ním." # todo: NEW TRANSLATION
 ARM_rip_the_trade_agreements: "Žádný obchod" # todo: NEW TRANSLATION
 ARM_rip_the_trade_agreements_desc: "Musíme zakázat íránské produkty a ukončit veškeré obchodní styky mezi Íránem a Arménií." # todo: NEW TRANSLATION
 ARM_closing_blue_mosque: "Uzavření Modré mešity" # todo: NEW TRANSLATION
 ARM_closing_blue_mosque_desc: "Írán používá Modrou mešitu jako centrum svého vlivu v Arménii. Musíme s tím skoncovat." # todo: NEW TRANSLATION
 ARM_amenia_iran_agen_capt: "Protiíránský dohled" # todo: NEW TRANSLATION
 ARM_capture_iranian_agents: "Zadržení íránských agentů" # todo: NEW TRANSLATION
 ARM_capture_iranian_agents_desc: "Írán nám může zkusit spiknutí proti nám. Musíme být na takovou situaci připraveni." # todo: NEW TRANSLATION
 ARM_hez_are_terrorists: "Hizballáh jsou teroristé!" # todo: NEW TRANSLATION
 ARM_hez_are_terrorists_desc: "Hizballáh jsou teroristické íránské proxy. Musíme odsoudit jejich politickou organizaci a agendu." # todo: NEW TRANSLATION
 ARM_support_pjaks: "Podpora Kurdistánské Strany Svobodného Života" # todo: NEW TRANSLATION
 ARM_support_pjaks_desc: "Abychom zkrotili íránské ambice, musíme podporovat kurdské separatistické organizace, jako je Kurdistánská Strana Svobodného Života (PJAK)." # todo: NEW TRANSLATION
 ARM_post_ussr_partnersh: "Partnerství po SSSR" # todo: NEW TRANSLATION
 ARM_post_ussr_partnersh_desc: "Mnoho zemí, se kterými jsme měli ekonomické a politické vztahy během sovětské éry, je dnes od nás značně vzdálených. Můžeme se pokusit naše vztahy znovu vybudovat." # todo: NEW TRANSLATION
 ARM_trade_partnership_blr: "Partnerství s Běloruskem" # todo: NEW TRANSLATION
 ARM_trade_partnership_blr_desc: "Běloruský trh může být pro naše podniky velmi zajímavý, stejně jako náš trh pro ně." # todo: NEW TRANSLATION
 ARM_trade_partnership_kaz: "Partnerství s Kazachstánem" # todo: NEW TRANSLATION
 ARM_trade_partnership_kaz_desc: "Naše vztahy s Kazachstánem nemusí být nejrůžovější, ale naše společné obchodní zájmy a hluboká integrace s Ruskem nám mohou prospět." # todo: NEW TRANSLATION
 ARM_trade_partnership_ukr: "Partnerství s Ukrajinou" # todo: NEW TRANSLATION
 ARM_trade_partnership_ukr_desc: "Zajištění dobrých obchodních vztahů s Ukrajinou by pro nás mohlo být velmi prospěšné, neboť náš trh by pro jejich produkty byl velmi vhodný." # todo: NEW TRANSLATION
 arme.138.t: "[ARM.GetNameWithFlag] Chce podepsat dohodu o spolupráci s EU!" # todo: NEW TRANSLATION
 arme.138.d: "Nedávno se Arménie rozhodla podepsat dohodu o spolupráci s Evropskou unií. Měli bychom souhlasit s jejich návrhem?" # todo: NEW TRANSLATION
 arme.138.a: "Jistě!" # todo: NEW TRANSLATION
 arme.138.b: "S tím nesouhlasíme?" # todo: NEW TRANSLATION
 arme.139.t: "[FROM.GetNameWithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.139.d: "[FROM.GetNameWithFlag] přijal náš návrh a dohoda bude brzy podepsána." # todo: NEW TRANSLATION
 arme.139.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.140.t: "[FROM.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.140.d: "[FROM.GetNameWithFlag] odmítl náš návrh na podpis dohody o spolupráci." # todo: NEW TRANSLATION
 arme.140.a: "Velmi nešťastné." # todo: NEW TRANSLATION
 arme.141.t: "[ARM.GetNamewithFlag] Chce se připojit k Otevřenému akčnímu plánu!" # todo: NEW TRANSLATION
 arme.141.d: "Nedávno vyjádřila Arménie zájem o vstup do Otevřeného akčního plánu. Akční plány si kladou za cíl zlepšit program reforem přijatých vládou, učinit je transparentnějšími, odpovědnějšími, participativními a inovativními. Měli bychom jim dovolit vstoupit do Otevřeného akčního plánu?" # todo: NEW TRANSLATION
 arme.141.a: "Jistě!" # todo: NEW TRANSLATION
 arme.141.b: "Promiňte, ne." # todo: NEW TRANSLATION
 arme.142.t: "[FROM.GetNameWithFlag] Přijímá!" # todo: NEW TRANSLATION
 arme.142.d: "Přijali naši žádost o připojení k Akčnímu plánu otevřené vlády, jehož cílem je zlepšit reformní agendu vlády a učinit ji transparentnější, odpovědnější, participativnější a inovativnější." # todo: CHANGED
 arme.142.a: "Skvěle!" # todo: NEW TRANSLATION
 arme.143.t: "[FROM.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.143.d: "[FROM.GetNameWithFlag] odmítl náš návrh na vstup do Otevřeného akčního plánu." # todo: NEW TRANSLATION
 arme.143.a: "Velmi nešťastné." # todo: NEW TRANSLATION
 arme.146.t: "Obchodní dům v [ARM.GetNameWithFlag]" # todo: NEW TRANSLATION
 arme.146.d: "Arménská vláda navrhuje, abychom rozšířili naše obchodní vztahy na novou úroveň. Arménská vláda, za pomoci společnosti Multigroup, je připravena poskytnout prostor pro vznik obchodního domu, kde budou naše zboží nabízeny k prodeji arménským kupujícím. Měli bychom uzavřít takovou dohodu?" # todo: NEW TRANSLATION
 arme.146.a: "Ano" # todo: NEW TRANSLATION
 arme.146.b: "Ne" # todo: NEW TRANSLATION
 arme.147.t: "Obchodní dům Běloruska v Arménii" # todo: NEW TRANSLATION
 arme.147.d: "Běloruská vláda souhlasila s otevřením obchodního domu pro běloruské výrobky v naší zemi" # todo: NEW TRANSLATION
 arme.147.a: "Dobré" # todo: NEW TRANSLATION
 arme.148.t: "Obchodní dům Běloruska v Arménii" # todo: NEW TRANSLATION
 arme.148.d: "Běloruská vláda odmítla otevřít obchodní dům pro běloruské výrobky v naší zemi" # todo: NEW TRANSLATION
 arme.148.a: "Smutné" # todo: NEW TRANSLATION
 arme.159.t: "Diskuze o Istanbulské úmluvě" # todo: NEW TRANSLATION
 arme.159.d: "Čelíme otázce přijmout či nepřijmout Istanbulské dohody o lidských právech. Tato dohoda nás přiblíží k členství v Evropské unii, ale může vyvolat nespokojenost mezi obyvateli." # todo: NEW TRANSLATION
 arme.159.a: "Podepseme je!" # todo: NEW TRANSLATION
 arme.159.b: "Nemůžeme si to dovolit." # todo: NEW TRANSLATION
 arme.160.t: "Společné vojenské cvičení s Arménií" # todo: NEW TRANSLATION
 arme.160.d: "Arménská vláda navrhuje, aby naše ozbrojené síly prováděly společná vojenská cvičení za účelem sdílení zkušeností a dovedností, zlepšení koordinace našich ozbrojených sil a posílení přátelských vztahů mezi oběma zeměmi." # todo: NEW TRANSLATION
 arme.160.a: "Souhlasíme" # todo: NEW TRANSLATION
 arme.160.b: "Ne" # todo: NEW TRANSLATION
 arme.161.t: "Společné vojenské cvičení s [FROM.GetName]" # todo: NEW TRANSLATION
 arme.161.d: "Jejich vláda souhlasila s provedením společných cvičení s našimi ozbrojenými silami." # todo: NEW TRANSLATION
 arme.161.a: "Dobré" # todo: NEW TRANSLATION
 arme.162.t: "Společné vojenské cvičení s [FROM.GetName]" # todo: NEW TRANSLATION
 arme.162.d: "Jejich vláda odmítla provést společná cvičení s našimi ozbrojenými silami." # todo: NEW TRANSLATION
 arme.162.a: "Smutné" # todo: NEW TRANSLATION
 arme.166.t: "[ARM.GetNameWithFlag] Navrhuje vědeckou smlouvu!" # todo: NEW TRANSLATION
 arme.166.d: "Nedávno nám arménská vláda nabídla smlouvu o vzájemné vědecké výměně, která by mohla být pro obě strany prospěšná. Měli bychom souhlasit s jejich návrhem?" # todo: NEW TRANSLATION
 arme.166.a: "Jistě!" # todo: NEW TRANSLATION
 arme.166.b: "Promiňte, ne." # todo: NEW TRANSLATION
 arme.167.t: "[KAZ.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.167.d: "Kazachstán souhlasil s naší vědeckou smlouvou a nyní z ní začnou těžit obě strany." # todo: CHANGED
 arme.167.a: "Skvěle!" # todo: NEW TRANSLATION
 arme.168.t: "[KAZ.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.168.d: "Kazachstán náš návrh smlouvy odmítl, protože jej považoval za jakýsi trik, který by ho dostal do horší pozice." # todo: CHANGED
 arme.168.a: "Cože?" # todo: NEW TRANSLATION
 arme.169.t: "[ARM.GetNameWithFlag] Navrhuje obchodní spolupráci!" # todo: NEW TRANSLATION
 arme.169.d: "Nedávno se arménská vláda prostřednictvím kontaktů diaspory na Ukrajině obrátila s návrhem oboustranně výhodné obchodní dohody. Měli bychom souhlasit?" # todo: CHANGED
 arme.169.a: "Jistě!" # todo: NEW TRANSLATION
 arme.169.b: "Ne." # todo: NEW TRANSLATION
 arme.170.t: "[UKR.GetNameWithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.170.d: "Ukrajina souhlasila s naší obchodní smlouvou a obě strany z ní začnou mít prospěch." # todo: NEW TRANSLATION
 arme.170.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.171.t: "[UKR.GetNameWithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.171.d: "Ukrajina náš obchodní návrh odmítla, protože jej považovala za jakýsi trik, který by ji dostal do horší pozice." # todo: CHANGED
 arme.171.a: "Cože?" # todo: NEW TRANSLATION
 arme.172.t: "Arménská dobrovolnická brigáda" # todo: NEW TRANSLATION
 arme.172.d: "V poslední době, s podporou arménské diaspory a arménské vlády, se místní Arméni z Rójavy připojili k naší bitvě proti tureckému útlaku a islámské tyranii. Nyní je součástí Osvobozenecké armády dělníků a rolníků Turecka (TİKKO) a Syrských demokratických sil. Brigáda uvedla, že její cíle jsou chránit Armény v Sýrii, jejich jazyk a kulturu a všechny obyvatele Autonomního spravovaného území severní a východní Sýrie před Islámským státem v Iráku a Levantu (ISIL) a tureckým státem, který ji popsal jako současné zástupce fašistické Unie a Progresního výboru." # todo: NEW TRANSLATION
 arme.172.a: "Skvěle!" # todo: NEW TRANSLATION
 arme.173.t: "Spojené státy Arménie" # todo: NEW TRANSLATION
 arme.173.d: "Naše země vstoupila do nové etapy svého historického vývoje! Nyní jsme připraveni oznámit vznik Spojených států arménských! Náš stát se rozšířil k hranicím hodným tohoto jména. Staneme se strážci míru a demokracie na celém Kavkaze a možná i za jeho hranicemi." # todo: CHANGED
 arme.173.a: "Skvěle!" # todo: NEW TRANSLATION
 ARM_kaz_scienc_part: "Science Partnership With Kazakhstan" # todo: NEW TRANSLATION
 ARM_kaz_scienc_part_desc: "We can offer Kazakhstan a mutually beneficial scientific treaty." # todo: NEW TRANSLATION
 ARM_diasp_ukr: "Kontakty na Ukrajině" # todo: NEW TRANSLATION
 ARM_diasp_ukr_desc: "Arménská diaspora na Ukrajině je početná. Můžeme využít naše kontakty k nalezení oboustranně výhodné dohody." # todo: CHANGED
 ARM_ukraine_cooperation_idea: "[ARM.GetNameWithFlag] - [UKR.GetNameWithFlag] Dohoda" # todo: NEW TRANSLATION
 ARM_ukraine_cooperation_idea_desc: "Arménie a Ukrajina vytvářejí strategická partnerství a využívají rozsáhlou přítomnost arménské diaspory na Ukrajině. Spolupráce zahrnuje obchod, investice, vojenské technologie a politickou koordinaci v postsovětském prostoru a spojuje dva národy se společnou zkušeností ruského tlaku a sporných hranic.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud vstoupíme do války s Ukrajinou." # todo: NEW TRANSLATION
 ARM_reach_out_baltics: "Navázat kontakt s Baltskými státy" # todo: NEW TRANSLATION
 ARM_reach_out_baltics_desc: "Musíme navázat kontakt s Baltskými státy a normalizovat naše vztahy s nimi, s ohledem na naše historické vazby." # todo: NEW TRANSLATION
 ARM_gods_land: "Boží země" # todo: NEW TRANSLATION
 ARM_gods_land_desc: "Svatá země má dnes velký význam nejen z náboženských důvodů, ale také kvůli geostrategickému soupeření, které se tam odehrává." # todo: NEW TRANSLATION
 ARM_arm_quart_partnership: "Partnerství Arménské čtvrti" # todo: NEW TRANSLATION
 ARM_arm_quart_partnership_desc: "Arménská apoštolská církev je známá tím, že téměř úplně ovládá svatyni Ježíšova hrobu. Kromě toho má arménská čtvrť v Jeruzalémě velký vliv na město. Měli bychom tyto faktory využít." # todo: NEW TRANSLATION
 ARM_recog_palest: "Uznání Palestiny" # todo: NEW TRANSLATION
 ARM_recog_palest_desc: "Izrael projevuje vůči nám dostatečnou nepřátelnost, a my nyní chápeme boj palestinské věci. Musíme uznat Palestinu, abychom vyjádřili svůj postoj." # todo: NEW TRANSLATION
 ARM_support_israel: "Podpora Izraeli" # todo: NEW TRANSLATION
 ARM_support_israel_desc: "Izrael projevuje dobrou vůli v spolupráci s námi. Měli bychom mu na to odpovědět přátelským duchem." # todo: NEW TRANSLATION
 ARM_cont_pal_christians: "Podpora palestinských křesťanů" # todo: NEW TRANSLATION
 ARM_cont_pal_christians_desc: "Musíme podporovat palestinské křesťany zasíláním humanitární pomoci a prohlubováním vztahů s Arménskou církví." # todo: NEW TRANSLATION
 ARM_relat_in_kurdistan: "Oslovit Kurdistán" # todo: NEW TRANSLATION
 ARM_relat_in_kurdistan_desc: "Možná naše vztahy s Kurdy nebyly bez problémů, avšak jsme oba oběťmi tureckého útlaku a proto se musíme spojit." # todo: NEW TRANSLATION
 ARM_yazidi_repatriation: "Repatriace Yazidů" # todo: NEW TRANSLATION
 ARM_yazidi_repatriation_desc: "Arménie vítá Jezídí prchající před pronásledováním na celém Blízkém východě a nabízí jim útočiště, kulturní autonomii a zastoupení v arménských politických institucích. Program repatriace Jezídů odráží historické vazby Arménie na jezídskou komunitu a staví Arménii do role útočiště pronásledovaných menšin v celé diaspoře.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jakmile dokončíme fokus §HNaše země, jejich svoboda§!." # todo: NEW TRANSLATION
 ARM_yazidi_repatriation2: "Repatriace Yazidů" # todo: NEW TRANSLATION
 ARM_yazidi_repatriation2_desc: "Repatriace Jezídů dosahuje vrcholu: desítky tisíc Jezídů se vrátily do arménských zemí a vytvořily prosperující kulturní centra v Kilikii a jinde. Komunita získává plné parlamentní zastoupení, náboženskou autonomii a hospodářské příležitosti, čímž se Arménie stává vzorovým útočištěm pronásledovaných menšin na Blízkém východě.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud ztratíme kontrolu nad Kilikii." # todo: NEW TRANSLATION
 ARM_accept_yazidis: "Přijímání Yazídů" # todo: NEW TRANSLATION
 ARM_accept_yazidis_desc: "Yazídové jsou náboženská menšina na Blízkém východě, která historicky měla s Armény velmi dobré vztahy a nikdy nás nezklamala. Musíme přijmout jejich organizace v Arménii a podpořit jejich kulturní renesanci." # todo: NEW TRANSLATION
 ARM_our_land_their_freedom: "Naše země — jejich svoboda" # todo: NEW TRANSLATION
 ARM_our_land_their_freedom_desc: "Musíme prosadit zákon, který Yazídům uzná oficiální menšinu v Arménii a umožní jim plně repatriovat do Arménie, stejně jako jim poskytnout místa v parlamentu." # todo: NEW TRANSLATION
 ARM_yazidis_are_kurds: "Yazídové jsou Kurdi" # todo: NEW TRANSLATION
 ARM_yazidis_are_kurds_desc: "Nesmíme podporovat yazídské organizace, raději bychom zvát kurdské organizace, aby podpořily kurdskou identitu Yazídů." # todo: NEW TRANSLATION
 ARM_support_barzani_ambitions: "Podpora kurdských ambicí" # todo: NEW TRANSLATION
 ARM_support_barzani_ambitions_desc: "Navzdory skutečnosti, že Kurdové osidlují bývalá arménská území, musíme je přesto podporovat proti Turecku." # todo: NEW TRANSLATION
 ARM_support_nubar_ozanian: "Podpora Armenů v Rojavě" # todo: NEW TRANSLATION
 ARM_support_nubar_ozanian_desc: "Nedávno Kurdové v Rojavě zahájili svůj boj proti islamistům a tureckým okupantům. Musíme podpořit jejich věc." # todo: NEW TRANSLATION
 ARM_ministry_of_external_category: "Vláda Arménie" # todo: NEW TRANSLATION
 ARM_ministry_of_external_category_desc: "£text_icon_armgovern §YArménská vláda§! bude muset provádět různé §Yvnitřní a zahraničněpolitické kroky§!, aby přežila, prosperovala a rozšířila svůj vliv.\n\nMechaniky §Gintegrace nových území§! vyžadují, aby váš §Ypolitický režim§! měl §Onároky na určitá území§!. Ne všechna území jsou dostupná k integraci pro všechny politické strany.\n\nRozhodnutí týkající se §Yarménské diaspory§! jsou dostupná, dokud máte odpovídající §Yn árodní duch§!." # todo: CHANGED
 ARM_integration_new_lands: "Integrace nových území" # todo: NEW TRANSLATION
 ARM_annex_states: "Anektovat státy" # todo: NEW TRANSLATION
 ARM_new_crusade_israel: "Spusťte křížovou výpravu pro Království Jeruzalémské [ISR.GetFlag]!" # todo: NEW TRANSLATION
 ARM_new_crusade_hazbik: "Spusťte křížovou výpravu pro Duch Antiochie [LEB.GetFlag]!" # todo: NEW TRANSLATION
 ARM_new_crusade_palestine: "Spusťte křížovou výpravu pro [PAL.GetNameWithFlag]!" # todo: NEW TRANSLATION
 ARM_italy_reclamation: "Spusťte Sjednocení s [ITA.GetNameWithFlag]!" # todo: NEW TRANSLATION
 ARM_new_decision_govern_unlock_tt: "Arménská vláda: Odemkne nová rozhodnutí" # todo: NEW TRANSLATION
 integr_stuff_tt: "Toto rozhodnutí nám umožní integrovat různá území, pokud nám to dovolí náš politický režim! Sledujte úroveň poslušnosti; některé regiony mohou povstat proti vaší okupaci." # todo: NEW TRANSLATION
 ARM_United_States: "Spojené státy Arménie" # todo: NEW TRANSLATION
 ARM_Zhirayr_Sefilyan: "Národnědemokratický pól" # todo: CHANGED
 ARM_Zhirayr_Sefilyan_desc: "Jirair Sefilian je arménský vojenský velitel a politický aktivista. Během První války o Náhorní Karabach velel speciálnímu vojenskému praporu v Šuši. Dlouhodobě usiluje o to, aby Arménie neztratila území a boj proti vlivu Ruska v Arménii. Sefilian je jednou z klíčových postav pan-arménské strany Sasna Tsrer." # todo: NEW TRANSLATION
 ARM_veter_must_rule: "Národní demokracie" # todo: NEW TRANSLATION
 ARM_veter_must_rule_desc: "Západní hodnoty a demokratický přístup nedávají smysl, pokud musíme zavřít oči před tím, kým jsou Arméni a jaké jsou naše národní zájmy. Veteráni musí vést naše země, i když chceme skutečnou demokracii." # todo: NEW TRANSLATION
 ARM_request_support_us: "Arménská legie Ameriky" # todo: NEW TRANSLATION
 ARM_request_support_us_desc: "Arménská legie Ameriky je organizace, která sdružuje Armény, kteří sloužili v americké armádě v minulosti. Legie má v úmyslu bojovat proti nepřátelům arménského lidu. Organizace má také malé speciální týmy po pěti lidech, které pod vedením bývalých důstojníků US Army Marine Corps procházejí tajným výcvikem. Již existuje více než tisíc bojovníků v Arménské legii – mladí lidé původu Arménů. Měli bychom podpořit jejich věc a zařadit je jako vojenský útvar." # todo: NEW TRANSLATION
 ARM_staunch_western_position: "Trn v patě" # todo: NEW TRANSLATION
 ARM_staunch_western_position_desc: "Aby se Arménie stala skutečně silnou a nezávislou, musíme zapomenout na úzkou spolupráci s Ruskem a zaměřit se výhradně na západní partnery." # todo: NEW TRANSLATION
 ARM_against_euroscepticism: "Proti euroskepticismu" # todo: NEW TRANSLATION
 ARM_against_euroscepticism_desc: "Rusko je hrozbou. To je jednomyslný názor naší vlády. Je čas jednat a prohloubit naše zapojení do NATO. Navíc to výrazně ztíží Turecku snahy o naše podkopání." # todo: CHANGED
 ARM_protectorate: "Kaukasijská hradba" # todo: NEW TRANSLATION
 ARM_protectorate_desc: "NATO touží pomalu se přibližovat k Rusku, a i když už mají Turecko v alianci, můžeme je dostat ještě blíž. Naše podmínky budou vyžadovat, aby členové NATO garantovali naši národní nezávislost." # todo: NEW TRANSLATION
 ARM_nato_weapon: "Vojenská podpora od NATO" # todo: NEW TRANSLATION
 ARM_nato_weapon_desc: "Okamžitě potřebujeme znovu vyzbrojit naši armádu, a nyní, jako členové NATO, jsme připraveni obrátit se na další členy organizace o pomoc při řešení tohoto problému." # todo: NEW TRANSLATION
 ARM_plant_radicalism: "Radikální západnost" # todo: NEW TRANSLATION
 ARM_plant_radicalism_desc: "Evropská kultura a západní ekonomický model by měly být cílem Arménie. To je ideál, který bohužel ustupuje od naší poslední hranice evropské civilizace." # todo: NEW TRANSLATION
 ARM_first_war_glorify: "Chvála první války v Artsachu" # todo: NEW TRANSLATION
 ARM_first_war_glorify_desc: "Musíme oslavovat válku v Artsachu, abychom posílili naši národní a vlasteneckou morálku!" # todo: NEW TRANSLATION
 ARM_fight_for_freedom: "Bojuj za svobodu" # todo: NEW TRANSLATION
 ARM_fight_for_freedom_desc: "Náš boj není ve své podstatě pouze nacionalistický. Bojujeme také za práva, svobodu a důstojnost!" # todo: CHANGED
 ARM_ecommerce_init: "Iniciativy elektronického obchodu" # todo: NEW TRANSLATION
 ARM_ecommerce_init_desc: "Musíme podporovat elektronický obchod a digitalizaci vládních struktur." # todo: NEW TRANSLATION
 ARM_fourth_rev_stnd: "Standardy čtvrté revoluce" # todo: NEW TRANSLATION
 ARM_fourth_rev_stnd_desc: "Naše hnutí je novou revolucí - evolucí národních a demokratických hodnot, která musí stanovit nové standardy pro všechny Armény." # todo: NEW TRANSLATION
 ARM_new_nuclear_plants: "Nové jaderné elektrárny" # todo: NEW TRANSLATION
 ARM_new_nuclear_plants_desc: "Musíme se spoléhat na jadernou energii, protože je to jediný způsob, jak naše země může vyrábět více a být konkurenceschopná na globálním trhu." # todo: NEW TRANSLATION
 ARM_no_more_kgb: "Žádný vliv KGB" # todo: NEW TRANSLATION
 ARM_no_more_kgb_desc: "KGB agenti po dlouhou dobu spikli proti naší zemi prostřednictvím různých influencerů a politických aktivistů. Dokonce jsou i v našem parlamentu! Musíme s tím skoncovat." # todo: NEW TRANSLATION
 ARM_ally_ukr_blr: "Spřátelení hnutí" # todo: NEW TRANSLATION
 ARM_ally_ukr_blr_desc: "Mnohá hnutí na Ukrajině a v Bělorusku mají stejné myšlenky jako my. Musíme je podpořit v naší kolektivní odolnosti vůči Rusku." # todo: NEW TRANSLATION
 ARM_no_more_colony: "Konec kolonialistické nadvlády!" # todo: NEW TRANSLATION
 ARM_no_more_colony_desc: "Rusko nás ovládá už příliš dlouho! Musíme ukončit tuto kolonialistickou nadvládu!" # todo: NEW TRANSLATION
 ARM_new_sparapet_pavel: "Nový Sparapet" # todo: NEW TRANSLATION
 ARM_new_sparapet_pavel_desc: "Pavel Manukyan prokázal své kvality být Sparapetem pro naši novou, mocnou zemi!" # todo: NEW TRANSLATION
 ARM_like_sassoun_daredevils: "Jako Sassounští odvážlivci" # todo: NEW TRANSLATION
 ARM_like_sassoun_daredevils_desc: "Musíme se inspirovat naším slavnostním eposem a sjednotit národ v našem lidovém duchu!" # todo: NEW TRANSLATION
 ARM_investig_milit: "Vyšetřovat vojenské síly" # todo: NEW TRANSLATION
 ARM_investig_milit_desc: "Vojenské síly musí být vyšetřeny, aby se vykořenila veškerá korupce." # todo: NEW TRANSLATION
 ARM_heroes_need_heroes: "Hrdinové potřebují hrdiny" # todo: NEW TRANSLATION
 ARM_heroes_need_heroes_desc: "Hrdinové skutečně potřebují hrdiny! Celý náš národ, muži i ženy, staří i mladí, musí být připraveni bojovat za naši věc." # todo: NEW TRANSLATION
 ARM_armenia_zhirayr_idea: "Radikálně prozápadní Arménie" # todo: NEW TRANSLATION
 ARM_armenia_zhirayr_idea_desc: "Zastřešující koncept ztělesňující radikálně prozápadní a protiruský politický program Sefiliana: vládu vedenou veterány, konfrontaci s oligarchickou elitou, protikorupční aktivismus a dramatické přeorientování směrem k NATO a Západu. Skutečné účinky této radikální proměny se projevují prostřednictvím propojených podřízených idejí odrážejících různé stránky Sefilianovy vize.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_veterans_idea: "Veteráni u moci" # todo: NEW TRANSLATION
 ARM_zhirayr_veterans_idea_desc: "Sefilian a jeho hnutí staví bojové veterány, zejména velitele karabašské války, do politického vedení a tvrdí, že vojenské zkušenosti a oběť poskytují legitimitu. Veteráni vytlačují civilisty a oligarchy z mocenských pozic a přinášejí do vládnutí vojenskou disciplínu a nacionalistické priority.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_pro_western_position_idea: "Radikálně prozápadní postoj" # todo: NEW TRANSLATION
 ARM_zhirayr_pro_western_position_idea_desc: "Ostrý odklon od postsovětské arménské zahraniční politiky: Sefilianovo hnutí opouští ruské vojenské partnerství a závazky ODKB ve prospěch členství v NATO, integrace s EU a spojenectví se západními mocnostmi. Arménie se stává výspou západního spojenectví na Jižním Kavkaze a přímo čelí Rusku přes arménské hranice.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_no_russian_idea: "Antiruská politika" # todo: NEW TRANSLATION
 ARM_zhirayr_no_russian_idea_desc: "Sefilian výslovně odmítá arménskou závislost na ruské vojenské ochraně. Odstranění ruských vojsk z arménské půdy, odmítnutí závazků ODKB a budování nezávislých arménských obranných schopností se stávají ústředními prvky tohoto antikoloniálního nacionalistického programu. Arménie znovu získává suverenitu od Moskvy.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_in_blr_ukr_idea: "Arménský vliv" # todo: NEW TRANSLATION
 ARM_zhirayr_radicalism_idea: "Politický radikalismus" # todo: NEW TRANSLATION
 ARM_zhirayr_radicalism_idea_desc: "Sefilianovo hnutí výslovně odmítá konsenzuální politiku a liberální kompromisy a přijímá přímou akci a ideologickou konfrontaci se zavedeným oligarchickým řádem. Radikální pojetí arménské politiky, tedy ozbrojené protesty, obsazování státních budov a veřejný vzdor, se institucionalizuje jako princip vládnutí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_first_armenia_war_idea: "Sláva první arménské války" # todo: NEW TRANSLATION
 ARM_zhirayr_first_armenia_war_idea_desc: "Sefilian a jeho hnutí uctívají první válku o Náhorní Karabach (1988–1994) jako určující okamžik arménské nezávislosti a vojenské slávy. Vzpomínka na tuto válku se stává mobilizační silou pro novou konfrontaci: s Ázerbájdžánem, s Ruskem o budoucnost Arménie a s domácí elitou, která údajně promarnila vítězství.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_fight_freedom_idea: "Boj za svobodu" # todo: NEW TRANSLATION
 ARM_zhirayr_fight_freedom_idea_desc: "Sefilian vykresluje současný boj jako pokračování osvobozeneckých válek Arménie: svobodu od cizí nadvlády (Ruska), svobodu od domácí tyranie (oligarchů) a svobodu zvolit si vlastní nezávislou cestu. Hrdinský boj se stává zároveň metodou i ospravedlněním radikální akce a západního spojenectví.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_heroes_idea: "Hrdinové potřebují hrdiny" # todo: NEW TRANSLATION
 ARM_zhirayr_heroes_idea_desc: "Sefilianovo hnutí povyšuje válečné hrdiny, aktivistické vůdce a mučedníky na vzory arménské mládeže a nahrazuje jimi oligarchy jako symboly národních ambicí. Z boje proti korupci a zahraniční závislosti vyrůstá nová generace hrdinů, která inspiruje k větší mobilizaci a obětem pro národní cíle.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_e_commerce_idea: "Radikální IT" # todo: NEW TRANSLATION
 ARM_zhirayr_e_commerce_idea_desc: "Sefilianovo hnutí přijímá radikální technologickou proměnu: rozvoj arménského IT sektoru jako páky západní integrace a hospodářské nezávislosti na Rusku. Technologické hospodářství se stává symbolem modernity, posílení mládeže a odklonu od průmyslových odvětví sovětské éry.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_zhirayr_4th_idea: "Čtvrtá revoluce" # todo: NEW TRANSLATION
 ARM_zhirayr_sassoun_idea: "Bojovníci Sassounu" # todo: NEW TRANSLATION
 ARM_zhirayr_sassoun_idea_desc: "Tato idea, pojmenovaná po legendárních hrdinech Sasunu z arménského folklóru a ozbrojené skupině Sasna Tsrer, kterou Sefilian vedl při obsazení policejní stanice v roce 2016, oslavuje ozbrojený vzdor jako morální a politický nástroj. Válečnicko-hrdinský model se stává vzorem pro konfrontaci s domácí i cizí tyranií.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní autokraté§! ztratí moc." # todo: NEW TRANSLATION
