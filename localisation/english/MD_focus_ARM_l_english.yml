 arm_sargsyan.9.t: "Arménie ustupuje" # todo: NEW TRANSLATION
 arm_sargsyan.9.d: "Arménie se rozhodla nekonfliktně souhlasit a přijímá naše požadavky" # todo: NEW TRANSLATION
 arm_sargsyan.9.a: "Dobře" # todo: NEW TRANSLATION
 arm_sargsyan.10.t: "Rusko ustupuje" # todo: NEW TRANSLATION
 arm_sargsyan.10.d: "Rusko se rozhodlo ustoupit od svých hrozeb a tiše nám umožnit realizaci našich cílů" # todo: NEW TRANSLATION
 arm_sargsyan.10.a: "Perfektní" # todo: NEW TRANSLATION
