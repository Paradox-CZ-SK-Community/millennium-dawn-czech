 ARM_balanced_solution: "Vytvořit vyvážené řešení" # todo: NEW TRANSLATION
 ARM_ideal_balance: "Nový arménský postoj" # todo: NEW TRANSLATION
 eastern_church_arm: "Arménská Apoštolská církev" # todo: NEW TRANSLATION
 eastern_church_arm_desc: "Arménská apoštolská církev (AAC) je jednou z nejstarších křesťanských církví na světě. Podle legendy se arménská církev nazývá „apoštolskou“, protože jejími zakladateli byli apoštolové Tadeáš a Bartoloměj, kteří jako první v Arménii kázali křesťanství. Historicky vznikla AAC v roce 301 působením svatého Řehoře Osvětitele a přijetím křesťanství králem Trdatem III. jako státního náboženství." # todo: CHANGED
 eastern_church_eth: "Etiopská ortodoxní církev" # todo: NEW TRANSLATION
 eastern_church_eth_desc: "Etiopská ortodoxní církev je jednou z nejstarších východních (před Chalcedonem) církví. Do roku 1959 byla autonomní církví v kanonické závislosti na Císařské Cíši, poté získala autocefalii. Stejně jako jiné starověké východní církve uznává tři ecumenické rady a vyznává myafisický Kristologii. Má vlastní etiopský rit a speciální hierarchickou strukturu kléru, která nemá analogii v jiných církevních tradicích." # todo: NEW TRANSLATION
 AZE_karabakh_defeat: "Porážka ve válce o Náhorní Karabach" # todo: NEW TRANSLATION
 AZE_karabakh_defeat_desc: "Porážka ve válce 90. let byla pro náš národ bolestnou ranou. Ázerbájdžánci touží po pomstě, aby navrátili svá historická území a vrátili tisíce uprchlíků domů." # todo: NEW TRANSLATION
 AZE_karabakh_revanchism: "Karabachský revanšismus" # todo: NEW TRANSLATION
 AZE_karabakh_revanchism_desc: "Ázerbájdžánci, kteří prohráli válku o Artsakh s velkou mezinárodní podporou, zůstali poníženi na mezinárodní scéně a lidé zasaženi neúspěchem jsou čím dál více nakloněni nacionalismu a vstupu do ozbrojených sil." # todo: NEW TRANSLATION
 ARM_victory_karabakh: "Vítězství ve válce o Náhorní Karabach" # todo: NEW TRANSLATION
 ARM_victory_karabakh_desc: "Vítězství v karabašské válce pozvedlo národní cítění Arménů a také umožnilo mnoha lidem z Arcachu obsadit vysoké pozice v arménské vládě. Zároveň však odňalo motivaci k dalšímu vojenskému a politickému rozvoji.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud dokončíme fokus §HEra of Peace Agenda§!." # todo: CHANGED
 ARM_armenian_mafia_6: "Arménská mafie" # todo: NEW TRANSLATION
 ARM_armenian_mafia_6_desc: "Po rozpadu Sovětského svazu zaplnil organizovaný zločin prázdnotu po slábnoucím státu. Arménská mafie se hluboce propletla s oligarchií, odčerpává politickou moc, potlačuje průmyslovou výrobu a korumpuje každou vrstvu veřejného života. Zločinecké sítě působí téměř beztrestně a autorita státu nad vlastní ekonomikou je vážně narušena.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud dokončíme fokusy §HConfrontation With The Mafia§! nebo §HDeals With Mafia§!, a bude §ROdebrán§!, pokud dokončíme fokus §HCrushing Mafia§!." # todo: CHANGED
 ARM_armenian_mafia_4: "Mafie utrpěla ztráty" # todo: NEW TRANSLATION
 ARM_armenian_mafia_4_desc: "Státní tlak způsobil arménské mafii významné ztráty. Klíčové postavy byly odstraněny a příjmy ze zločinu narušeny, přestože sítě zůstávají nedotčené. Korupce a politické zásahy přetrvávají ve značné míře a při polevení tlaku je stále možný návrat mafie.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud dokončíme fokus §HBosses Elimination§! nebo rozhodnutí §YDestroy Mafia Influence§!." # todo: CHANGED
 ARM_armenian_mafia_3: "Jedná s mafií" # todo: NEW TRANSLATION
 ARM_armenian_mafia_3_desc: "Vláda se místo otevřeného střetu s mafií dohodla na neklidném kompromisu. Zločinecké organizace si zachovávají široký vliv a nadále odčerpávají z ekonomiky rentu, otevřený konflikt se státem však byl odložen. Korupce je vysoká a politické náklady zůstávají stálou zátěží.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud dokončíme fokus §HDominate Bandits§!." # todo: CHANGED
 ARM_armenian_mafia_2: "Nadvláda nad mafií" # todo: NEW TRANSLATION
 ARM_armenian_mafia_2_desc: "Vláda přivedla mafii k poslušnosti. Zločinecké sítě již nejednají nezávisle; jejich peněžní toky procházejí kanály kontrolovanými státem a oligarchické excesy jsou drženy na uzdě. Šedá ekonomika přetrvává a stabilita trpí, výnosy však nyní místo konkurenčních mocenských center plní státní pokladnu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud dokončíme fokus §HCrushing Mafia§!." # todo: CHANGED
 ARM_mafia_strikes_back: "Mafie útočí zpět" # todo: NEW TRANSLATION
 ARM_deals_with_bandits_3: "Jednání s banditami" # todo: NEW TRANSLATION
 ARM_deals_with_bandits_3_desc: "Místo boje s mafií navážeme vztahy, omezíme tlak na malé podniky a začneme kontrolovat velké peněžní toky." # todo: NEW TRANSLATION
 ARM_deals_with_bandits_2: "Nadvláda nad bandity" # todo: NEW TRANSLATION
 ARM_deals_with_bandits_2_desc: "Teď už mafie nebude moci jít proti nám. Ovládáme oběh peněz v zemi, což nám dává možnost využívat veškeré páky vlivu na oligarchii." # todo: NEW TRANSLATION
 ARM_deals_with_bandits_1: "Rozdělení sfér vlivu" # todo: NEW TRANSLATION
 ARM_deals_with_bandits_1_desc: "Rozdělili jsme sféry vlivu s představiteli arménské mafie. Necháme bandity nadále existovat, ale zbavili jsme se vnitřního nepřítele." # todo: NEW TRANSLATION
 armenian_perseverance: "Arménská vytrvalost" # todo: NEW TRANSLATION
 armenian_perseverance_desc: "Mnoho civilizací vzešlo a zaniklo během posledních tří tisíciletí. Na rozdíl od svých bývalých přátel a nepřátel Arméni stále vytrvají. Ačkoli historická Arménie se možná nikdy nevrátí, vůle přežít a stát pevně na místě je stále stejně silná." # todo: NEW TRANSLATION
 NKR_marz_arm: "De-facto marz [ARM.GetNamewithFlag]" # todo: NEW TRANSLATION
 NKR_marz_arm_desc: "Právní status Artsachu jako autonomního marzu (územně-správní jednotky) v rámci Arménie chrání zdejší výraznou arménskou většinu před ázerbájdžánskými nároky a zároveň udržuje nárazníkovou zónu na Kavkaze. Toto uspořádání vzniklo ze sovětských správních struktur a vyvinulo se v základní kámen arménské územní integrity a kulturní kontinuity.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud Artsach ztratí §Hautonomii marzu§! nebo pokud §HArtsach§! přestane existovat." # todo: NEW TRANSLATION
 NKR_marz_tt: "\n§YDodatečné výdaje: $$§R0.350§!§! pro [ARM.GetFlag] Arménské daně\n" # todo: NEW TRANSLATION
 ARM_echoes_1999: "Ozvěny roku 1999" # todo: NEW TRANSLATION
 ARM_echoes_1999_desc: "Následky parlamentní střelby z roku 1999 stále rozjitřují obyvatelstvo a nutí opoziční frakce protestovat proti Kocharyanovi.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud Robert Kocharyan přestane být naším vůdcem nebo pokud dokončíme fokus §HPacifying Yerkrapah§!." # todo: CHANGED
 ARM_echoes_1999_pac: "Ozvěny roku 1999 - §YNacionalisté očištěni ze koalice§!" # todo: NEW TRANSLATION
 ARM_echoes_1999_pac_desc: "Následky parlamentní střelby z roku 1999 stále rozjitřují obyvatelstvo a nutí opoziční frakce protestovat proti Kocharyanovi.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud Robert Kocharyan přestane být naším vůdcem nebo pokud dokončíme fokus §HConstitutional Changes§!." # todo: CHANGED
 ARM_changes_in_militar: "Změny v armádě" # todo: NEW TRANSLATION
 ARM_broken_economy: "Ekonomické ozvěny 90. let" # todo: NEW TRANSLATION
 ARM_broken_economy_desc: "Arménská ekonomika je v hlubokém úpadku. Usazení oligarchové vzdorují reformám, takže strukturální problémy zůstávají neřešeny.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud náš §HHDP na obyvatele§! překročí §H$20,000§!." # todo: CHANGED
 ARM_diaspora_links: "Vazby s diasporou" # todo: NEW TRANSLATION
 ARM_diaspora_links_desc: "Arménská diaspora po celém světě má významné kontakty a může nám pomoci budovat vztahy nebo ovlivňovat jiné země.\n\nTento národní duch nám zpřístupňuje panel rozhodnutí týkajících se diaspory.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud dokončíme fokus §HAddress Irreconcilable Contradictions§!." # todo: CHANGED
 ARM_rural_water_issues: "Problém zásobování venkova vodou" # todo: NEW TRANSLATION
 ARM_rural_water_issues_desc: "Po rozpadu SSSR začala Arménie mít problémy s infrastrukturou pro zavlažování zemědělských plodin. Přestože zemědělství zaujímá významnou část arménské ekonomiky, tyto problémy dosud nebyly vyřešeny." # todo: NEW TRANSLATION
 ARM_102st_base: "[SOV.GetNamewithFlag] 102. vojenská základna" # todo: NEW TRANSLATION
 ARM_102st_base_desc: "Ruská 102. vojenská základna je ruská vojenská základna v arménském Gjumri, podléhající velení Jižního vojenského okruhu Ozbrojených sil Ruské federace.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud vstoupíme do NATO, [SOV.GetNameWithFlag] nebude mít vojenský přístup na naše území nebo vstoupíme do války s [SOV.GetNameWithFlag]." # todo: CHANGED
 ARM_echoes_of_1999: "Ozvěny roku 1999" # todo: NEW TRANSLATION
 ARM_echoes_of_1999_desc: "Arménie stojí na politickém rozcestí a sklízejí se plody teroristického útoku z roku 1999. Co znamená vzestup Roberta Kocharyana pro Arménii?" # todo: NEW TRANSLATION
 ARM_agree_on_places: "Dohody o místech" # todo: NEW TRANSLATION
 ARM_agree_on_places_desc: "Kocharyan upevňuje svou moc vyjednáváním tajných dohod s regionálními mocenskými činiteli a oligarchy: rozdělováním vládních postů, zárukami hospodářských privilegií a ujištěním, že stávající mocenské struktury budou respektovány výměnou za podporu jeho prezidentství. Tyto dohody elit udržují Kocharyanův systém stabilní.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HRobert Kocharyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_high_emigration_5: "Obrovská úroveň emigrace" # todo: NEW TRANSLATION
 ARM_high_emigration_5_desc: "S rozpadem SSSR a zhoršující se ekonomickou situací se mnoho zemí SNS stalo rukojmími zvýšené vnější migrace. V dnešní realitě Arménii hrozí vymření, což nelze říci o jejím východním sousedovi a hlavním politickém nepříteli. Řešení demografické otázky se musí stát hlavním bodem arménské politiky.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud náš §HHDP§! překročí §H$20B§! a stabilita bude alespoň §H15%§!." # todo: CHANGED
 ARM_high_emigration_4: "Substantial Level of Emigration" # todo: NEW TRANSLATION
 ARM_high_emigration_4_desc: "S rozpadem SSSR a zhoršující se ekonomickou situací se mnoho zemí SNS stalo rukojmími zvýšené vnější migrace. V dnešní realitě Arménii hrozí vymření, což nelze říci o jejím východním sousedovi a hlavním politickém nepříteli. Řešení demografické otázky se musí stát hlavním bodem arménské politiky.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud náš §HHDP§! překročí §H$30B§! a stabilita bude alespoň §H24%§!." # todo: CHANGED
 ARM_high_emigration_3: "Vysoká úroveň emigrace" # todo: NEW TRANSLATION
 ARM_high_emigration_3_desc: "S rozpadem SSSR a zhoršující se ekonomickou situací se mnoho zemí SNS stalo rukojmími zvýšené vnější migrace. V dnešní realitě Arménii hrozí vymření, což nelze říci o jejím východním sousedovi a hlavním politickém nepříteli. Řešení demografické otázky se musí stát hlavním bodem arménské politiky.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud náš §HHDP§! překročí §H$40B§! a stabilita bude alespoň §H24%§!." # todo: CHANGED
 ARM_high_emigration_2: "Nízká úroveň emigrace" # todo: NEW TRANSLATION
 ARM_high_emigration_2_desc: "S rozpadem SSSR a zhoršující se ekonomickou situací se mnoho zemí SNS stalo rukojmími zvýšené vnější migrace. V dnešní realitě Arménii hrozí vymření, což nelze říci o jejím východním sousedovi a hlavním politickém nepříteli. Řešení demografické otázky se musí stát hlavním bodem arménské politiky.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud náš §HHDP§! překročí §H$50B§! a stabilita bude alespoň §H34%§!." # todo: CHANGED
 ARM_high_emigration_1: "Malá emigrace" # todo: NEW TRANSLATION
 ARM_high_emigration_1_desc: "S rozpadem SSSR a zhoršující se ekonomickou situací se mnoho zemí SNS stalo rukojmími zvýšené vnější migrace. V dnešní realitě Arménii hrozí vymření, což nelze říci o jejím východním sousedovi a hlavním politickém nepříteli. Řešení demografické otázky se musí stát hlavním bodem arménské politiky.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud náš §HHDP§! překročí §H$60B§! a stabilita bude alespoň §H44%§!." # todo: CHANGED
 ARM_high_emigration_0: "Velmi malá emigrace" # todo: NEW TRANSLATION
 ARM_high_emigration_0_desc: "S rozpadem SSSR a zhoršující se ekonomickou situací se mnoho zemí SNS stalo rukojmími zvýšené vnější migrace. V dnešní realitě Arménii hrozí vymření, což nelze říci o jejím východním sousedovi a hlavním politickém nepříteli. Řešení demografické otázky se musí stát hlavním bodem arménské politiky.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud náš §HHDP§! překročí §H$100B§! a stabilita bude alespoň §H64%§!." # todo: CHANGED
 ARM_immigration: "Pozitivní imigrace" # todo: NEW TRANSLATION
 ARM_immigration_desc: "Arméni z celého světa se systematicky vracejí do svého historického domova, masovou repatriací se stávají plnohodnotnými občany." # todo: NEW TRANSLATION
 ARM_russia_debt_wait: "[SOV.GetNamewithFlag] Dluh §Wodklad§! Dohoda" # todo: NEW TRANSLATION
 ARM_russia_debt_wait_desc: "[ARM.GetNamewithFlag] je jedinou zemí, jejíž dluh [SOV.GetNamewithFlag] nepřevzala ani neodpustila. Ať už šlo o politický, nebo pragmatický krok, poskytli nám odklad, abychom otázku dluhu uzavřeli.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud náš dluh klesne pod §H10§! nebo pokud dokončíme fokus §HProperty For Debt Agreement§!." # todo: CHANGED
 ARM_Kocharjan: "Kocharyanova éra" # todo: CHANGED
 ARM_Kocharjan_desc: "Poté co byl jeho předchůdce Levon Ter-Petrosjan sesazen z funkce prezidenta, byl Kočaryan jmenován druhým prezidentem Arménie, když ve včasných prezidentských volbách porazil svého hlavního rivala Karena Demirčjana (který byl bývalým vůdcem sovětské Arménie), volby byly poznamenány neregularitami a porušeními ze strany obou stran podle mezinárodních volebních pozorovatelů." # todo: NEW TRANSLATION
 ARM_manifestation_power: "Projev politické moci" # todo: NEW TRANSLATION
 ARM_manifestation_power_desc: "Abychom dokázali, že naše role ve vedení země nebude otřesena, musíme projevit svou vůli a přivést státní aparát k poslušnosti." # todo: CHANGED
 ARM_place_agreement: "Dohody o místech" # todo: NEW TRANSLATION
 ARM_place_agreement_desc: "Abychom posílili Kocharyanovo sevření země, musíme v tichosti vyjednávat s regionálními politiky, úředníky a vybranými poslanci." # todo: CHANGED
 ARM_confrontation_mafia: "Konfrontace s mafií" # todo: NEW TRANSLATION
 ARM_confrontation_mafia_desc: "Arménská mafie, která má četné vazby na ruské zločince, má příliš velký vliv na dění v Arménii. Musíme to změnit." # todo: NEW TRANSLATION
 ARM_liquidation_bosses: "Eliminace bossů" # todo: NEW TRANSLATION
 ARM_liquidation_bosses_desc: "Mafie je slabá. Přišel čas zasadit rozhodný úder spravedlnosti a odříznout hlavu draka." # todo: NEW TRANSLATION
 ARM_installing_loyal: "Vlastní instalace" # todo: NEW TRANSLATION
 ARM_installing_loyal_desc: "Přestože je to krátkodobě nákladné, posílení Kocharyanovy moci vyžaduje očištění státního aparátu od disidentů. S nimi není o čem vyjednávat." # todo: CHANGED
 ARM_suppress_opposition: "Potlačit opozici" # todo: NEW TRANSLATION
 ARM_suppress_opposition_desc: "Opozice je kvůli vnějšímu vlivu na Arménii příliš aktivní. Je čas přijmout tvrdá opatření a několika vhodně načasovanými zatčeními zbrzdit její rozmach." # todo: CHANGED
 ARM_deals_with_bandits: "Dohody s mafií" # todo: NEW TRANSLATION
 ARM_deals_with_bandits_desc: "Kriminální kruhy Arménie, i když mají sklony k vzpouře a systematicky porušují zákon, výrazně ovlivňují dění v Arménii. Možná bychom s nimi neměli bojovat, ale podmanit si bandity a učinit z toho pro nás zisk." # todo: NEW TRANSLATION
 ARM_domination_over_bandits: "Ovládnout bandity" # todo: NEW TRANSLATION
 ARM_domination_over_bandits_desc: "Ačkoli jsme se rozhodli vyjednávat s bandity, neměli bychom jim dávat přílišnou moc. Kocharyan musí nad nimi získat kontrolu." # todo: NEW TRANSLATION
 ARM_official_investigation: "Spustit oficiální vyšetřování" # todo: NEW TRANSLATION
 ARM_official_investigation_desc: "Abychom uklidnili opozici a mezinárodní společenství, musíme zahájit oficiální vyšetřování teroristického útoku z roku 1999." # todo: CHANGED
 ARM_pacify_yerkrapah: "Uklidňování Yerkrapahu" # todo: NEW TRANSLATION
 ARM_pacify_yerkrapah_desc: "Vojenská organizace Jerkrapah je pro naši vládu v Arménii příliš vlivná. Skládá se především z příznivců nacionalisticky smýšlejícího Vazgena Sargsyana. Musíme je odstranit z vojenského velení." # todo: CHANGED
 ARM_meet_putin: "Setkání s Putinem" # todo: NEW TRANSLATION
 ARM_meet_putin_desc: "Možná se nám podaří přesvědčit Rusko, aby investovalo do naší ekonomiky a vybudovalo důvěru pro budoucí dluhovou dohodu." # todo: NEW TRANSLATION
 ARM_northern_avenue_project: "Northern Avenue Project" # todo: NEW TRANSLATION
 ARM_northern_avenue_project_desc: "Northern Avenue je navrhovaný projekt pro centrum Jerevanu, při kterém budou ulice rekonstruovány odstraněním starých historických budov a výstavbou nových moderních." # todo: NEW TRANSLATION
 ARM_property_for_debt: "Majetek pro dluhovou dohodu" # todo: NEW TRANSLATION
 ARM_property_for_debt_desc: "Arménie je jedinou zemí, která po pádu Sovětského svazu nedostala dluh prominutý Ruskem. Avšak možná můžeme vyjednat dohodu tím, že poskytneme majetek namísto peněz." # todo: NEW TRANSLATION
 ARM_autocrats_power: "Autokratická moc" # todo: NEW TRANSLATION
 ARM_autocrats_power_desc: "Konečně, Kocharyan nemá žádné překážky ve své politické dráze." # todo: NEW TRANSLATION
 ARM_person_business: "Osobní podnikatelské aktivity" # todo: NEW TRANSLATION
 ARM_person_business_desc: "Ačkoli to může poškodit náš hospodářský cyklus, můžeme získat určité výhody z Kocharyanových osobních podnikatelských aktivit." # todo: NEW TRANSLATION
 ARM_caucasian_tiger: "Kavkazský tygr" # todo: NEW TRANSLATION
 ARM_caucasian_tiger_desc: "Kvůli nafouknutému stavebnímu sektoru má Arménie nyní nejvyšší růst HDP v regionu. Musíme tuto situaci přijmout." # todo: CHANGED
 ARM_silence_hun: "Umlčování Hunanyana" # todo: NEW TRANSLATION
 ARM_silence_hun_desc: "Hunanyan by opozici mohl poskytnout poznatky. Nesmíme to dopustit." # todo: NEW TRANSLATION
 ARM_constitutional_changes: "Ústavní změny" # todo: NEW TRANSLATION
 ARM_constitutional_changes_desc: "Abychom ukončili jakoukoli naději opozice zastavit naši nadvládu, musíme provést změny ústavy a potlačit protesty." # todo: NEW TRANSLATION
 ARM_hi_rob: "Ahoj, Rob!" # todo: NEW TRANSLATION
 ARM_hi_rob_desc: "Poghos Poghosyan z Dashnakcutyun strany byl pro Kocharyana dlouhodobým problémem. Byl jeho starým \"přítelem\" a staré vazby jsou pro nás nyní příliš rizikové." # todo: NEW TRANSLATION
 ARM_political_assassinations: "Politické vraždy" # todo: NEW TRANSLATION
 ARM_political_assassinations_desc: "Pokud je to nutné pro naši politickou vládu, pokračujeme v likvidaci našich protivníků." # todo: CHANGED
 ARM_union_state_proposal: "Návrh Sjednoceného státu" # todo: NEW TRANSLATION
 ARM_union_state_proposal_desc: "Nakonec se můžeme pokusit připojit ke projektu Sjednoceného státu pro naši budoucí prosperitu." # todo: NEW TRANSLATION
 ARM_loyal_in_power: "\"Náš\" lid na místech" # todo: NEW TRANSLATION
 ARM_loyal_in_power_desc: "Regionální úřady jsou nyní pod Kocharyanovou kontrolou. Kvůli politické moci je však boj proti korupci stále obtížnější.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud Robert Kocharyan přestane být naším vůdcem." # todo: CHANGED
 ARM_suppressed_oppos: "Potlačená opozice" # todo: NEW TRANSLATION
 ARM_suppressed_oppos_desc: "Kocharyanův režim používá policejní opatření, zadržování, omezený přístup k médiím a obtěžování k potlačení opozičních stran a nesouhlasných hlasů. Opozice existuje, ale je zastrašená, neschopná účinně se organizovat nebo zpochybnit prezidentovo sevření moci.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HRobert Kocharyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_cauc_tigr: "Kavkazský tygr" # todo: NEW TRANSLATION
 ARM_cauc_tigr_desc: "Mimořádný hospodářský růst Arménie za Kocharyana, založený na stavebním boomu, přílivu zahraničních investic a růstu HDP, vede ke srovnání s asijskými tygry. Kocharyan tento růst prezentuje jako důkaz, že jeho autokratický přístup přátelský k oligarchům funguje lépe než demokratické vládnutí, a ospravedlňuje tak svou pevnou kontrolu nad politikou a médii.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HRobert Kocharyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_autocratic_grip: "Autokratická moc" # todo: NEW TRANSLATION
 ARM_autocratic_grip_desc: "Kocharyanův systém se ustaluje v plnohodnotný autoritarismus: volby jsou řízené, parlament podřízený, soudnictví poslouchá prezidenta a opozice je marginalizována. Kocharyan nečelí žádné vážné výzvě své osobní vládě a státní aparát slouží jeho vůli bez vnitřního tření.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HRobert Kocharyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_armenia_kocharyan_idea: "Arménie Kocharyanova" # todo: NEW TRANSLATION
 ARM_armenia_kocharyan_idea_desc: "Zastřešující koncept zahrnující celý Kocharyanův politický systém: upevnění osobní autokratické moci prostřednictvím dohod elit, hospodářského růstu, potlačování opozice a spoléhání na oligarchické partnery. Skutečné účinky Kocharyanovy vlády se projevují prostřednictvím propojených podřízených idejí odrážejících různé aspekty jeho modelu vládnutí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §HRobert Kocharyan§! již nebude naším vůdcem." # todo: NEW TRANSLATION
 ARM_political_assassinations_category: "Politické vraždy" # todo: NEW TRANSLATION
 ARM_political_assassinations_category_desc: "Po převratu v roce 1999 je moc Konzervativní strany Kocharyana v nejistém stavu. §YOpposition§! bude připravovat svrhnutí prezidenta několikrát. Je nutné vyčistit politické prostředí, abychom zajistili udržení moci. Nepřátelé v politickém prostředí a vnější opozice musí být vyhlazeni." # todo: NEW TRANSLATION
 arm_opposition_backlash_ticker_mission: "Odezva opozice" # todo: NEW TRANSLATION
 arm_opposition_backlash_ticker_mission_desc: "The [ARM.GetFlag] §YArménská opozice§! bude připravovat shromáždění a nutit £ARM_Conservative §YKocharyan§! vládu ustoupit a uspořádat férové volby. Musíme tuto chvíli oddálit a nejlépe zabránit shromážděním úplně, nebo si být jisti, že opozice prohraje." # todo: NEW TRANSLATION
 ARM_first_wave_of_assasinat: "Spusťte §YPrvní vlna§! §YPolitických vražd§!" # todo: NEW TRANSLATION
 ARM_second_wave_of_assasinat: "Spusťte §9Druhá vlna§! §YPolitických vražd§!" # todo: NEW TRANSLATION
 first_assasinat_done: "§YPrvní vlna vražd byla dokončena§!" # todo: NEW TRANSLATION
 second_assasinat_done: "§YDruhá vlna vražd byla dokončena§!" # todo: NEW TRANSLATION
 ARM_armenia_kocharyan_idea_tt: "[ARM_Kocharyan_People_loc][ARM_Kocharyan_Tiger_loc][ARM_Kocharyan_Autocratic_loc][ARM_Kocharyan_Opposition_loc]" # todo: NEW TRANSLATION
 ARM_Kocharyan_People_loc1: "\n§gNAŠI LIDÉ NA MÍSTECH§!:\n£corruption_cost_factor_texticon Náklady na změnu korupce politické síly: §R+30.00%§!\n£political_power_texticon  Zisk politické síly: §G+30.00%§!\n" # todo: NEW TRANSLATION
 ARM_Kocharyan_Tiger_loc1: "\n§gKAVKAZSKÝ TYGR§!:\n£econ_cycle_upg_cost_multiplier_modifier_texticon §YEkonomický cyklus upgrade Náklady na pokladnu§! Násobič: §G-10.00%§!\n£construction_speed_texticon  Lokální stavební rychlost: §G+10.00%§!\n" # todo: NEW TRANSLATION
 ARM_Kocharyan_Autocratic_loc1: "\n§gAUTOKRATICKÁ MOC§!:\n£construction_speed_texticon  Lokální stavební rychlost: §G+10.00%§!\n£political_power_texticon  Zisk politické síly: §G+5.00%§!\n£interest_rate_multiplier_modifier_texticon §YÚroková sazba§!: §G-2§!\n£emerging_outlook_campaign_cost_modifier_texticon Denní rostoucí podpora: §G+0.06§!" # todo: NEW TRANSLATION
 ARM_Kocharyan_Opposition_loc1: "\n§gPOTLAČOVANÁ OPOZICE§!:\n£western_outlook_campaign_cost_modifier_texticon Denní prozápadní podpora: §R-0.01§!\n£nonaligned_outlook_campaign_cost_modifier_texticon Denní nezúčastněná podpora: §R-0.01§!\n£nationalist_outlook_campaign_cost_modifier_texticon Denní nacionalistická podpora: §R-0.01§!\n§YOčekávané výdaje na zdravotnictví§!: §G-1.00§!\n" # todo: NEW TRANSLATION
 ARM_Sargsyan: "Serž Sargsjan" # todo: CHANGED
 ARM_Sargsyan_desc: "Od roku 1988 byl Serž Sargsjan jedním z vůdců Karabachského hnutí, jehož cílem bylo obránit Náhorní Karabach Arménií. Díky širokým kontaktům v armádních a politických kruzích v Arménii se stal ideálním kandidátem na prezidenta po Kocharyanovi." # todo: NEW TRANSLATION
 ARM_appoint_tigran: "Jmenovat Tigrana" # todo: NEW TRANSLATION
 ARM_appoint_tigran_desc: "Měli bychom jmenovat Tigrana Sargsyana do čela Arménské centrální banky kvůli možným budoucím reformám." # todo: CHANGED
 ARM_clear_out_nats: "Vyčistit podpory Andranika Margaryana" # todo: NEW TRANSLATION
 ARM_clear_out_nats_desc: "Andranik Margaryan a jeho nacionalistické křídlo strany musí být potlačeni, jsou příliš neloajální a nebezpeční, než abychom je v naší straně tolerovali." # todo: CHANGED
 ARM_spheres_of_influence_sep: "Oddělené sféry vlivu" # todo: NEW TRANSLATION
 ARM_spheres_of_influence_sep_desc: "Předešlá vláda nám dala zelenou vládnout této zemi, a proto musíme respektovat jejich podnikatelské aktivity." # todo: NEW TRANSLATION
 ARM_utilize_military_knowledge: "Využívání vojenských znalostí" # todo: NEW TRANSLATION
 ARM_utilize_military_knowledge_desc: "Vojenské zkušenosti Serže Sargsyana musí být využity ve prospěch našich ozbrojených sil, ví, co je třeba dělat." # todo: CHANGED
 ARM_befriend_oligs: "Přátelit se s oligarchy" # todo: NEW TRANSLATION
 ARM_befriend_oligs_desc: "Možná bychom měli navázat kontakty s oligarchy a vyslechnout si dohody, které nám mohou nabídnout." # todo: CHANGED
 ARM_patriotic_educ: "Patriotická výchova mládeže" # todo: NEW TRANSLATION
 ARM_patriotic_educ_desc: "Musíme vychovávat naši mládež v duchu patriotismu. Naše strana, ještě než jsme ji vedli, byla v tomto ohledu velmi úspěšná, a proto bychom měli tuto tradici nadále dodržovat." # todo: NEW TRANSLATION
 ARM_ensure_milit: "Zajistit vojenskou podporu" # todo: NEW TRANSLATION
 ARM_ensure_milit_desc: "Měli bychom zajistit, aby armáda měla jednu z nejdůležitějších pozic v naší vládě a společnosti." # todo: NEW TRANSLATION
 ARM_priorit_loy_gener: "Upřednostňovat loajální generály" # todo: NEW TRANSLATION
 ARM_priorit_loy_gener_desc: "Musíme upřednostňovat generály, kteří nám jsou loajální, a budovat politické kontakty." # todo: NEW TRANSLATION
 ARM_new_gov_builds: "Nové vládní budovy" # todo: NEW TRANSLATION
 ARM_new_gov_builds_desc: "Díky našim dobrým kontaktům s oligarchií bychom s nimi mohli uzavřít výhodnou dohodu o výstavbě nových budov pro naši vládu." # todo: NEW TRANSLATION
 ARM_navasard_legacy_sup: "Dědictví Navasardjana" # todo: NEW TRANSLATION
 ARM_navasard_legacy_sup_desc: "Ačkoli jsme potlačili starou gardu republikánské strany, využití jejich metod a dědictví může být pro budoucnost naší země velmi užitečné." # todo: CHANGED
 ARM_cronies_elevated: "Povýšení kumpánů" # todo: NEW TRANSLATION
 ARM_cronies_elevated_desc: "Musíme změnit priority ve vzdělávání, a zároveň zachovat jádro myšlenek." # todo: NEW TRANSLATION
 ARM_support_monopolies: "Podporované monopoly" # todo: NEW TRANSLATION
 ARM_support_monopolies_desc: "Musíme zachovat náš monopolní systém, abychom si udrželi vliv ve státě." # todo: CHANGED
 ARM_hovik_guidelines: "Hovikovy pokyny" # todo: NEW TRANSLATION
 ARM_hovik_guidelines_desc: "Premiér Hovik Abrahamyan pověřil ministerstvo hospodářství, aby během jednoho měsíce vypracovalo pokyny pro dovoz deseti základních produktů na trh. Patřily mezi ně cukr, mouka, pšenice, olej, rýže, pohanka, máslo, margarín, banány, pomeranče, dětská výživa, drůbež, léky, nafta a benzin. Poznamenal, že ačkoli tyto trhy nejsou formálně monopolizované, veřejnost je tak vnímá." # todo: CHANGED
 ARM_mandatory_pension_system: "Povinný akumulační důchodový systém" # todo: NEW TRANSLATION
 ARM_mandatory_pension_system_desc: "Povinný spořicí důchodový systém zajistí občanům zabezpečení ve stáří a sníží dlouhodobou závislost na státní podpoře." # todo: CHANGED
 ARM_patronize_nats: "Podpora nacionalistů" # todo: NEW TRANSLATION
 ARM_patronize_nats_desc: "Republikánská strana různými způsoby podporuje nacionalistická hnutí v zemi." # todo: CHANGED
 ARM_footbal_diplo: "Fotbalová diplomacie" # todo: NEW TRANSLATION
 ARM_footbal_diplo_desc: "„Fotbalová diplomacie“ ve vztazích mezi Arménií a Tureckem začala 6. září 2008, kdy turecký prezident Abdullah Gül přijel na pozvání arménského prezidenta Serže Sargsyana do Jerevanu, aby společně sledovali fotbalový zápas národních týmů obou zemí v rámci kvalifikace na mistrovství světa 2010. Po utkání pozval turecký vůdce svého arménského protějška na odvetný zápas v Turecku 14. října 2009. Dne 10. října 2009 byly v Curychu za podpory vysoce postavených politiků a světových vůdců podepsány bilaterální protokoly. O čtyři dny později v Burse navštívili prezidenti Turecka a Arménie zápas národních fotbalových týmů. Dne 22. dubna 2010 však Sargsjan svým výnosem pozastavil ratifikaci dokumentů podepsaných v Curychu s vysvětlením, že Turecko není připraveno pokračovat v započatém procesu." # todo: CHANGED
 ARM_visit_to_russia: "Státní návštěva Ruska" # todo: NEW TRANSLATION
 ARM_visit_to_russia_desc: "Serzh Sargsyan pojede do Ruska, aby vyjednal sblížení Arménie s EU" # todo: NEW TRANSLATION
 ARM_approach_eu_serzh: "Přibližování Evropské unii" # todo: NEW TRANSLATION
 ARM_approach_eu_serzh_desc: "Evropský den je významnou událostí v naší zemi, díky níž máme více příležitostí se přiblížit k EU" # todo: NEW TRANSLATION
 ARM_serzh_free_speech: "Svoboda projevu pro podporu EU" # todo: NEW TRANSLATION
 ARM_serzh_free_speech_desc: "Ač nechceme rozšiřovat opozici, musíme lidem dát určité práva, která podpoří ekonomické příležitosti" # todo: NEW TRANSLATION
 ARM_ss_army: "Armáda S.S." # todo: NEW TRANSLATION
 ARM_ss_army_desc: "Jsme armádou Serža Sargsjana, budeme ho následovat až na samotný konec světa!" # todo: NEW TRANSLATION
 arm_sargsyan.1.t: "Setkání v Arménii po fotbalovém zápasu!" # todo: NEW TRANSLATION
 arm_sargsyan.1.d: "Po shlédnutí fotbalového zápasu mezi Arménií a Tureckem jednají vůdci Arménie a Turecka o různých záležitostech. Arménie navrhuje uzavřít bilaterální dohodu o spolupráci mezi našimi zeměmi pro vzájemně prospěšný rozvoj našich ekonomik a normalizaci vztahů." # todo: NEW TRANSLATION
 arm_sargsyan.1.a: "Jistě" # todo: NEW TRANSLATION
 arm_sargsyan.1.b: "Ne" # todo: NEW TRANSLATION
 arm_sargsyan.2.t: "Arméno-turecká spolupráce podepsána" # todo: NEW TRANSLATION
 arm_sargsyan.2.d: "Turecko souhlasilo s podpisem bilaterální dohody o spolupráci" # todo: NEW TRANSLATION
 arm_sargsyan.2.a: "Dobře" # todo: NEW TRANSLATION
 arm_sargsyan.3.t: "Turecko odmítlo" # todo: NEW TRANSLATION
 arm_sargsyan.3.d: "Naše snahy o zlepšení vztahů nebyly druhou stranou vyslyšeny" # todo: NEW TRANSLATION
 arm_sargsyan.3.a: "Dobře" # todo: NEW TRANSLATION
 arm_sargsyan.4.t: "Sargsjan navštíví Moskvu" # todo: NEW TRANSLATION
 arm_sargsyan.4.d: "Sargsjan nás žádá, abychom Arménii umožnili se přiblížit ke zemím EU. Tvrdí, že to nepovede k přerušení našich vazeb." # todo: NEW TRANSLATION
 arm_sargsyan.4.a: "Souhlasíme" # todo: NEW TRANSLATION
 arm_sargsyan.4.b: "Arménie nás nemůže opustit kvůli EU" # todo: NEW TRANSLATION
 arm_sargsyan.4.c: "Můžeme jim nabídnout bližší hospodářské partnerství" # todo: NEW TRANSLATION
 arm_sargsyan.5.t: "Rusko požaduje, abychom se vzdali našich cílů sblížení s EU" # todo: NEW TRANSLATION
 arm_sargsyan.5.d: "Rusko je kategoricky proti jakémukoli sblížení mezi námi a EU, a proto hrozí hospodářskými sankcemi, pokud se budeme snažit více k sobě přiblížit" # todo: NEW TRANSLATION
 arm_sargsyan.5.a: "Ponecháme si své názory" # todo: NEW TRANSLATION
 arm_sargsyan.5.b: "Přijímáme požadavky" # todo: NEW TRANSLATION
 arm_sargsyan.6.t: "Arménie se nebojí našich hrozeb" # todo: NEW TRANSLATION
 arm_sargsyan.6.d: "Naše hrozby arménskému vedení nezaskočily; měli bychom uvalit slíbené sankce?" # todo: NEW TRANSLATION
 arm_sargsyan.6.a: "Varovali jsme" # todo: NEW TRANSLATION
 arm_sargsyan.6.b: "Možná příště to vyjde" # todo: NEW TRANSLATION
 arm_sargsyan.7.t: "Rusko nabízí dohodu" # todo: NEW TRANSLATION
 arm_sargsyan.7.d: "Pokud se vzdáme svých plánů na sblížení s EU, dostaneme ekonomickou pomoc výměnou. Pokud však nabídku porušíme, budou následovat důsledky" # todo: NEW TRANSLATION
 arm_sargsyan.7.a: "Dohoda" # todo: NEW TRANSLATION
 arm_sargsyan.7.b: "Odmítáme tuto nabídku" # todo: NEW TRANSLATION
