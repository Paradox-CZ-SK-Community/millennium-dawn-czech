 arm_foreign_legion.1.t: "Armenian Foreign Legion" # todo: NEW TRANSLATION
 arm_foreign_legion.1.d: "We were inspired by the example of the French Foreign Legion and decided to create a similar unit in our Army. Now there is a question of technical equipment of the legion, we intend to involve French and Indian specialists to help in this matter." # todo: NEW TRANSLATION
 arm_foreign_legion.1.a: "Great" # todo: NEW TRANSLATION
 arm_foreign_legion.2.t: "Armenian Foreign Legion" # todo: NEW TRANSLATION
 arm_foreign_legion.2.d: "Konečně byla vytvořena naše nová jednotka, cizinecká legie. Nyní mají mimo jiné občané jiných zemí možnost získat naše občanství několikaletou službou v legii a proléváním krve ve prospěch Arménie." # todo: CHANGED
 arm_foreign_legion.2.a: "Great" # todo: NEW TRANSLATION
 arm_foreign_legion.3.t: "Armenian Foreign Legion" # todo: NEW TRANSLATION
 arm_foreign_legion.3.d: "Arménská vláda nám nabízí vyslání vlastní jednotky, cizinecké legie. Tvrdí, že její příslušníci jsou zkušení bojovníci s dobrým technickým vybavením a bojovým výcvikem a v současné situaci se jistě osvědčí." # todo: CHANGED
 arm_foreign_legion.3.a: "We'll Let Them In." # todo: NEW TRANSLATION
 arm_foreign_legion.3.b: "Not Interesting" # todo: NEW TRANSLATION
 arm_foreign_legion.4.t: "Our Foreign Legion" # todo: NEW TRANSLATION
 arm_foreign_legion.4.d: "[FROM.GetName] souhlasí s umístěním naší cizinecké legie na svém území, aby pomohla stabilizovat současnou situaci, a jsme s naší spoluprací velmi spokojeni." # todo: CHANGED
 arm_foreign_legion.4.a: "Nice" # todo: NEW TRANSLATION
 arm_foreign_legion.5.t: "Our Foreign Legion" # todo: NEW TRANSLATION
 arm_foreign_legion.5.d: "[FROM.GetName] odmítlo přijmout naši cizineckou legii na svém území, protože její přítomnost považuje za zbytečnou." # todo: CHANGED
 arm_foreign_legion.5.a: "Sad" # todo: NEW TRANSLATION
 arm_foreign_legion.6.t: "Our Foreign Legion" # todo: NEW TRANSLATION
 arm_foreign_legion.6.d: "Vojáci naší cizinecké legie dokončili svůj úkol a vracejí se do vlasti." # todo: CHANGED
 arm_foreign_legion.6.a: "Welcome Home" # todo: NEW TRANSLATION
