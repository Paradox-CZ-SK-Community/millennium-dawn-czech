 ARM_army: "Arménská armáda v nové éře" # todo: NEW TRANSLATION
 ARM_army_desc: "Po skončení války o Artsach, Arménská armáda, která se ukázala, zažila výrazný pokles, který začal i po zhroucení Sovětského svazu. Díky sovětskému dědictví a rozsáhlé milici se Arméni podařilo porazit Ázerbájdžán a nastavit nejistou rovnováhu v regionu. Staré doktríny, stejně jako zastaralé zbraně, ztuhlí generálové a ekonomické problémy ukončily vývoj ozbrojených sil. Hlavním směrem rozvoje je pokračování spolupráce s Ruskem, stejně jako s dalšími sousedy a partnery v CSTO. Nicméně někteří vojenskí experti trvají na úplném přepracování vojenské doktríny a struktury armády podle západních vzorů. Arménie, která má diplomaticky výhodnou pozici, může zkusit vzít to nejlepší z každé strany, nebo zvolit jasný kurz spolupráce s určitými silami. I bez významných zdrojů má Arménie velký potenciál, pokud dokáže správně rozdělit své priority." # todo: NEW TRANSLATION
 ARM_vazgen_academy: "Vojenská univerzita Vazgena Sargsyana" # todo: NEW TRANSLATION
 ARM_vazgen_academy_desc: "Vojenská univerzita Vazgena Sargsjana je vysoká vzdělávací instituce fungující v rámci Ministerstva obrany Arménie. Jejím posláním je připravovat a vycvičovat důstojníky schopné plnit obranné úkoly v míru i válce." # todo: NEW TRANSLATION
 ARM_inner_troops: "Vnitřní jednotky" # todo: NEW TRANSLATION
 ARM_inner_troops_desc: "Kromě hlavních jednotek a pohraniční stráže musíme vytvořit vnitřní jednotky země, abychom zajistili plnohodnotný pořádek uvnitř a udrželi rezervy." # todo: NEW TRANSLATION
 ARM_institute_mo_ra: "Vojenská letecká univerzita" # todo: NEW TRANSLATION
 ARM_institute_mo_ra_desc: "Vojenská letecká univerzita Armenak Khanperyants je vysoká vzdělávací instituce Arménského letectva fungující pod Ministerstvem obrany Arménie." # todo: NEW TRANSLATION
 ARM_pvo_troops: "Protivzdušná obrana" # todo: NEW TRANSLATION
 ARM_pvo_troops_desc: "Musíme počítat s vytvořením sil protivzdušné obrany, abychom zajistili bezpečnost našeho nebe." # todo: CHANGED
 ARM_intern_cooperat: "Mezinárodní spolupráce" # todo: NEW TRANSLATION
 ARM_intern_cooperat_desc: "K rozvoji našich ozbrojených sil a zlepšení profesionality našich důstojníků musíme spolupracovat s přátelskými zeměmi po celém světě." # todo: NEW TRANSLATION
 ARM_peace_brigade: "Mírová brigáda" # todo: NEW TRANSLATION
 ARM_peace_brigade_desc: "Abychom získali a osvojili zahraniční zkušenosti ve vedení války, musíme rozvíjet naše mírové jednotky, abychom je mohli vysílat na vojenské a humanitární mise." # todo: NEW TRANSLATION
 ARM_air_fedence_force: "Systematizované vzdušné výcviky" # todo: NEW TRANSLATION
 ARM_air_fedence_force_desc: "Naše letectvo nemá systematický výcvik pilotů a manuály nebyly aktualizovány od sovětských dob. Měli bychom sloučit letecké akademie a zavést systematický výcvik." # todo: NEW TRANSLATION
 ARM_davisur_arm: "Davisur" # todo: NEW TRANSLATION
 ARM_davisur_arm_desc: "Jedna z továren na šití v Jerevanu může být převedena na plnohodnotnou společnost, která bude vyrábět standardizované uniformy s novou, pixelovanou maskovací výstrojí, kterou můžeme okopírovat z Kanady nebo USA." # todo: NEW TRANSLATION
 ARM_aspar_arms: "Aspar Arms" # todo: NEW TRANSLATION
 ARM_aspar_arms_desc: "Aspar Arms je společnost zabývající se exportem a samotným dovozem zbraní do Arménské republiky. Nedávno začali vyvíjet slibné prototypy vlastních modelů malých zbraní. Měli bychom jim poskytnout výrobní licenci a podpořit jejich továrnu." # todo: NEW TRANSLATION
 ARM_k3_prototype: "K-3 Puškové prototypy" # todo: NEW TRANSLATION
 ARM_k3_prototype_desc: "Arménská společnost Garni-Ler vyrábí ručně vyráběné zbraně v Arménii od 90. let. Měli bychom modernizovat jejich staré prototypy a dotovat jejich firmu." # todo: NEW TRANSLATION
 ARM_uav_krunk: "Krunk UAV" # todo: NEW TRANSLATION
 ARM_uav_krunk_desc: "Krunk je arménský bezpilotní letoun v službách ozbrojených sil Arménie. Je určen pro blízký průzkum, přenos živého videa (vizuálního či infračerveného) nebo pořizování snímků s vyšším rozlišením." # todo: NEW TRANSLATION
 ARM_sso: "Speciální operační síly" # todo: NEW TRANSLATION
 ARM_sso_desc: "Je čas modernizovat naše speciální síly na základě našich vývojových schopností a vojenské zkušenosti." # todo: NEW TRANSLATION
 ARM_new_army: "Nová arménská armáda" # todo: NEW TRANSLATION
 ARM_new_army_desc: "Arménská armáda vstupuje do nové éry modernizace a vývoje, zanechávající své problémy v minulosti!" # todo: NEW TRANSLATION
 ARM_militia: "Vytvořit lidovou milici" # todo: NEW TRANSLATION
 ARM_militia_desc: "Arménie má od 90. let zákon, který legalizuje vznik nestátních civilních pololojenských milic a jejich integraci do ozbrojených sil v případě konfliktu. Je načase, aby tento zákon vstoupil v platnost." # todo: NEW TRANSLATION
 ARM_national_guard: "Vytvořit národní gardu" # todo: NEW TRANSLATION
 ARM_national_guard_desc: "Možná bychom měli zvážit možnost vytvoření národní gardy Arménie, která bude přímo zodpovědná za udržování pořádku v Arménii a bude úzce provázána s Ministerstvem vnitra." # todo: NEW TRANSLATION
 ARM_vdv: "Vytvořit vzdušně výsadkové síly" # todo: NEW TRANSLATION
 ARM_vdv_desc: "Sovětská vojenská doktrína předpokládala značnou různorodost větví ozbrojených sil. Měli bychom přijmout podobnou strategii vytvořením plnohodnotných výsadkových jednotek." # todo: NEW TRANSLATION
 ARM_morpehi: "Vytvořit námořní pěchotu" # todo: NEW TRANSLATION
 ARM_morpehi_desc: "Spolu s přístupem k moři bychom měli brát v úvahu zkušenosti jiných zemí a vytvořit námořní jednotky." # todo: NEW TRANSLATION
 ARM_fleet: "Vytvořit námořnictvo" # todo: NEW TRANSLATION
 ARM_fleet_desc: "Moře vítězství obklopilo naši zemi! Od dob Kilikijské Arménie konečně máme přístup k moři. Je vhodné začít budovat naši novou flotilu." # todo: NEW TRANSLATION
 ARM_n2: "N-2" # todo: NEW TRANSLATION
 ARM_n2_desc: "N-2 je arménský projekt vícenásobného raketometu vědeckovýrobního sdružení Garni-Ler. Můžeme jejich projekt schválit a zahájit výrobu tohoto raketometu." # todo: CHANGED
 ARM_lusan: "Lusan" # todo: NEW TRANSLATION
 ARM_lusan_desc: "Charentsavanská strojírenská továrna hledá finanční prostředky na zahájení masové výroby vojenských vozidel LUSAN. Možná bychom měli zvážit investici do ní." # todo: NEW TRANSLATION
 ARM_mortars_prod: "Výroba minometů" # todo: NEW TRANSLATION
 ARM_mortars_prod_desc: "Minomety jsou poměrně snadné na výrobu a nevyžadují mnoho technického vybavení k výrobě. Měli bychom se na to podívat." # todo: NEW TRANSLATION
 ARM_hayk_car: "Prototyp Hayk vozidla" # todo: NEW TRANSLATION
 ARM_hayk_car_desc: "Vozidlo Hayk je prototyp vytvořený pod dohledem návrháře Karen Gevorkyan. Ačkoliv není nejefektivnějším typem vojenského dopravního prostředku, je to náš inovativní a spolehlivý vývoj, který stojí za podporu." # todo: NEW TRANSLATION
 ARM_rockets_modern: "Modernizace raket" # todo: NEW TRANSLATION
 ARM_rockets_modern_desc: "Vzhledem k našim technickým schopnostem můžeme zkusit modernizovat staré sovětské a ruské rakety." # todo: NEW TRANSLATION
 ARM_mlrs_proto: "Prototypy MLRS" # todo: NEW TRANSLATION
 ARM_mlrs_proto_desc: "Garni-Ler navrhl vytvoření prototypů MLRS. Musíme jejich úsilí v tomto směru podpořit." # todo: CHANGED
 ARM_our_own_armor: "Výroba keramických pancířů" # todo: NEW TRANSLATION
 ARM_our_own_armor_desc: "Kromě ocelových desek vyráběných firmou Davisur můžeme zahájit výrobu keramických pancířových desek kopírováním dostupných komerčních návrhů." # todo: NEW TRANSLATION
 ARM_radars_arm: "Arménské radary" # todo: NEW TRANSLATION
 ARM_radars_arm_desc: "Abychom si zajistili jistotu v přesném detekování nepřátelských letounů nad naším územím, musíme investovat do výstavby vojenských radarů." # todo: NEW TRANSLATION
 ARM_night_vis_arm: "Zavádění nočního vidění" # todo: NEW TRANSLATION
 ARM_night_vis_arm_desc: "Pokud nám ekonomická situace dovolí, můžeme začít zavádět noční vidění a brýle do našich ozbrojených sil." # todo: NEW TRANSLATION
 ARM_new_unif_proj: "Nový projekt uniformy" # todo: NEW TRANSLATION
 ARM_new_unif_proj_desc: "Na základě zahraničních zkušeností musíme začít vyvíjet novou maskovací uniformu pro naše ozbrojené síly." # todo: NEW TRANSLATION
 ARM_voma_center: "VOMA Center" # todo: NEW TRANSLATION
 ARM_voma_center_desc: "VOMA (arménská zkratka Art of Survival) je arménská nevládní organizace, kterou založila skupina profesionálních vojenských odborníků a veteránů, kteří oznámili svůj cíl vybudovat společnost schopnou bránit se ve válce." # todo: NEW TRANSLATION
 ARM_warfare_analysis_center: "Centrum válečné analýzy" # todo: NEW TRANSLATION
 ARM_warfare_analysis_center_desc: "Koordinace našich ozbrojených sil, přehodnocení bojových zkušeností, analýza moderních bojových operací. Všechny tyto činnosti musí být sjednoceny v jednom orgánu ozbrojených sil, kterým bude toto centrum." # todo: NEW TRANSLATION
 ARM_reform_army: "Reformovaná armáda" # todo: NEW TRANSLATION
 ARM_reform_army_desc: "Naše armáda se musí reformovat, aby byla připravena odrazit nepřátelské útoky na naši zemi. Obranná strategie je základem naší vojenské politiky" # todo: NEW TRANSLATION
 ARM_swiss_model: "Model švýcarské armády" # todo: NEW TRANSLATION
 ARM_swiss_model_desc: "Začneme reformovat naši armádu podle modelu švýcarské armády, abychom optimalizovali naše ozbrojené síly podle potřeby." # todo: NEW TRANSLATION
 ARM_fortress: "Horská obrana" # todo: NEW TRANSLATION
 ARM_fortress_desc: "Přeměníme naši zemi na skutečnou pevnost; švýcarské obranné taktiky budou naším základem." # todo: NEW TRANSLATION
 ARM_territorial_defence: "Teritoriální obrana" # todo: NEW TRANSLATION
 ARM_territorial_defence_desc: "Máme v úmyslu vytvořit teritoriální obranu pro další ochranu našeho státu." # todo: NEW TRANSLATION
 ARM_soviet_army: "Sovětská armáda" # todo: NEW TRANSLATION
 ARM_soviet_army_desc: "Sovětská armáda byla standardem ozbrojených sil, podle našeho názoru. Máme v úmyslu vytvořit nové větve ozbrojených sil, které budou vyhovovat našim logistickým potřebám." # todo: NEW TRANSLATION
 ARM_engineer_troops: "Inženýrské jednotky" # todo: NEW TRANSLATION
 ARM_engineer_troops_desc: "Speciální jednotky ozbrojených sil určené pro inženýrskou podporu: zajištění vybavení pro vojenské (bojové) operace, inženýrské průzkumy a doprovod jednotek při ofenzívě, a tak dále" # todo: NEW TRANSLATION
 ARM_radio_troops: "Radiové jednotky" # todo: NEW TRANSLATION
 ARM_radio_troops_desc: "Speciální jednotky určené pro nasazení a provoz komunikačních systémů s cílem zajistit kontrolu vojsk a sil podřízených Ministerstvu obrany ve všech jejich činnostech" # todo: NEW TRANSLATION
 ARM_railway_troops: "Železniční jednotky" # todo: NEW TRANSLATION
 ARM_railway_troops_desc: "Železnice byly určeny pro železniční podporu ozbrojených sil. Železniční jednotky zahrnovaly řídicí orgány, formace, jednotky, instituce, instituce a podniky" # todo: NEW TRANSLATION
 ARM_border_troops: "Pohraniční jednotky" # todo: NEW TRANSLATION
 ARM_border_troops_desc: "Jednotky určené k ochraně a obraně státní hranice, prevenci a potlačování narušení suverenity a územní celistvosti" # todo: NEW TRANSLATION
 ARM_nationalist_army: "Národní armáda" # todo: NEW TRANSLATION
 ARM_nationalist_army_desc: "Naše země potřebuje silnou národní armádu, která bude vytvořena na základě jedinečné vojenské doktríny." # todo: CHANGED
 ARM_nationalists_in_army: "Nábor radikálů do armády" # todo: NEW TRANSLATION
 ARM_nationalists_in_army_desc: "Máme v úmyslu získat pomoc radikálních nacionalistických živlů. Navzdory nepořádku, který mohou způsobit, zvýší morálku a posílí ideologické odhodlání." # todo: CHANGED
 ARM_univeristy_army: "Nové vojenské univerzity" # todo: NEW TRANSLATION
 ARM_univeristy_army_desc: "Máme v úmyslu vybudovat nové vojenské univerzity pro zlepšení kvality vojenského vzdělávání v zemi." # todo: NEW TRANSLATION
 ARM_polk_dziavory: "Dzhiavory" # todo: NEW TRANSLATION
 ARM_polk_dziavory_desc: "Dzhiavors (Armenian Cavalry), Cilician knights or Armenian Knights are crusader knights from Cilician Armenia. We intend to reorganize the Honor Guard Company into a combat unit of our army." # todo: NEW TRANSLATION
 ARM_102: "Jednotka 102" # todo: NEW TRANSLATION
 ARM_102_desc: "Jednotka 102 je speciální jednotka arménské armády složená z Arménů z komunit po celém světě, která provádí tajné operace proti nepřátelským státům." # todo: CHANGED
 ARM_ar15_west_contr: "Smlouva o výrobě vzoru AR" # todo: NEW TRANSLATION
 ARM_ar15_west_contr_desc: "Nejnovější americké pušky jsou nejlepší volbou pro naši budoucí výrobu vzoru AR. Budeme je moci vyrábět takové, jaké jsou, ale také je reverzně inženýrsky vyvinout pro náš prospěch." # todo: NEW TRANSLATION
 ARM_ak12_rus_contr: "Licence na výrobu vzorů AK" # todo: NEW TRANSLATION
 ARM_ak12_rus_contr_desc: "Nejnovější ruské pušky jsou nejlepší volbou pro naši budoucí výrobu pušek vzoru AK. Budeme je moci vyrábět tak, jak jsou, ale také je reverzně inženýrsky vyvinout pro náš prospěch." # todo: NEW TRANSLATION
 ARM_orsis_dilemma: "Orsis Dilemma" # todo: NEW TRANSLATION
 ARM_orsis_dilemma_desc: "Orsis projevil zájem investovat do našeho vojensko-průmyslového komplexu. Naši armádní generálové však mají jiný návrh." # todo: CHANGED
 ARM_start_foreign_legion: "Založení zahraniční legie" # todo: NEW TRANSLATION
 ARM_start_foreign_legion_desc: "Zahraniční legie, jako koncepce součásti ozbrojených sil, nás již dlouho přitahovala, a nyní jsme připraveni tuto myšlenku realizovat s pomocí některých států." # todo: NEW TRANSLATION
 ARM_foreign_legion_france: "Francouzské zbraně a specialisté" # todo: NEW TRANSLATION
 ARM_foreign_legion_france_desc: "Máme v úmyslu nakoupit francouzské vybavení a specialisty, kteří jsou připraveni s tímto vybavením pracovat pro naši zahraniční legii." # todo: NEW TRANSLATION
 ARM_foreign_legion_india: "Indické zbraně a specialisté" # todo: NEW TRANSLATION
 ARM_foreign_legion_india_desc: "Máme v úmyslu nakoupit indické vybavení a specialisty, kteří jsou připraveni s tímto vybavením sloužit pro naši zahraniční legii." # todo: NEW TRANSLATION
 ARM_foreign_legion_create: "Arménská zahraniční legie" # todo: NEW TRANSLATION
 ARM_foreign_legion_create_desc: "S hrdostí oznamujeme vznik Arménské zahraniční legie, kde budeme očekávat občany jakékoli země!" # todo: NEW TRANSLATION
 ARM_landforce_modifier: "Arménské pozemní síly" # todo: NEW TRANSLATION
 ARM_landforce_modifier_desc: "Pozemní složka Arménských ozbrojených sil, vybudovaná kolem branné pěchotní páteře zděděné po sovětské 7. gardové armádě a zocelené první karabašskou válkou. Každá reforma pozemních sil, od vnitřních jednotek po zálohy územní obrany, se zde kumuluje." # todo: NEW TRANSLATION
 ARM_airforce_modifier: "Arménské letectvo" # todo: NEW TRANSLATION
 ARM_airforce_modifier_desc: "Letecká a protivzdušná složka Arménských ozbrojených sil. Byla založena v roce 1992 kolem několika převedených sovětských letounů a vždy představovala mladší složku ozbrojených sil; její schopnosti spočívají stejně tak na pozemní protivzdušné obraně jako na bojových letounech." # todo: NEW TRANSLATION
 ARM_navalforce_modifier: "Arménské námořní síly" # todo: NEW TRANSLATION
 ARM_navalforce_modifier_desc: "Arménie nemá pobřeží ani loďstvo, ale generální štáb udržuje námořní kádr, výcvikové zařízení a tradici námořní pěchoty zděděnou po sovětském námořnictvu. Pokud naše hranice někdy dosáhnou moře nebo naši námořníci budou sloužit pod jinou vlajkou, odborné znalosti již budou existovat." # todo: NEW TRANSLATION
 NKR_landforce_modifier: "Obranná armáda Artsachu" # todo: NEW TRANSLATION
 NKR_landforce_modifier_desc: "Pozemní síly Republiky Artsach, vytvořené v roce 1992 z místních oddílů milic a od té doby udržované arménským vybavením, výcvikem a důstojníky. Reformy převedené z Jerevanu se zde kumulují." # todo: NEW TRANSLATION
 NKR_airforce_modifier: "Síly protivzdušné obrany Artsachu" # todo: NEW TRANSLATION
 NKR_airforce_modifier_desc: "Malé uskupení protivzdušné obrany Republiky Artsach. Protože vlastní bojové letectvo prakticky nemá, Stepanakert se při kontrole vzdušného prostoru nad linií kontaktu téměř zcela spoléhá na pozemní systémy." # todo: NEW TRANSLATION
 ARM_security_modifier: "Arménské zvláštní služby" # todo: NEW TRANSLATION
 ARM_security_modifier_desc: "Vnitřní bezpečnostní aparát Republiky Arménie: Národní bezpečnostní služba v Jerevanu, její pohraniční a protiteroristická ředitelství, policie ministerstva vnitra a zahraniční zpravodajská složka oddělená v roce 2016. Každá reforma služeb se zde kumuluje." # todo: NEW TRANSLATION
 NKR_security_modifier: "Bezpečnostní služby Artsachu" # todo: NEW TRANSLATION
 NKR_security_modifier_desc: "Bezpečnostní aparát Republiky Artsach, vybudovaný podle arménského vzoru a z velké části obsazený důstojníky vyslanými z Jerevanu. Reformy přijaté v Arménii jsou předávány Stepanakertu a kumulují se zde." # todo: NEW TRANSLATION
 ARM_economy_modifier: "£text_icon_armdram Arménské hospodářství" # todo: NEW TRANSLATION
 ARM_economy_modifier_desc: "Domácí část arménského hospodářství: maloobchodní banky Jerevanu, měděné a molybdenové doly v Sjunik a Lori, zpracovatelé ovoce, cementárny a elektrická síť. Každá společnost uvedená do výroby, privatizovaná nebo rozšířená zde zanechává svou stopu." # todo: NEW TRANSLATION
 ARM_western_partners_modifier: "Západní hospodářská partnerství" # todo: NEW TRANSLATION
 ARM_western_partners_modifier_desc: "Část arménského hospodářství opírající se o západní kapitál a instituce: kanadské tabákové společnosti, britské bankovnictví, nizozemské telekomunikace, izraelské těžební koncese, IT sektor orientovaný na Ameriku a univerzitní programy v Evropě a Spojených státech. Tito partneři si v Jerevanu kupují vliv, dokud zůstávají.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud vstoupíme do války s kteroukoli z těchto zemí:§Y \n[USA.GetNameWithFlag] \n[ENG.GetNameWithFlag] \n[CAN.GetNameWithFlag] \n[FRA.GetNameWithFlag] \n[GER.GetNameWithFlag] \n[HOL.GetNameWithFlag] \n[ISR.GetNameWithFlag]§!" # todo: NEW TRANSLATION
 ARM_russian_partners_modifier: "Ruská hospodářská partnerství" # todo: NEW TRANSLATION
 ARM_russian_partners_modifier_desc: "Vědecké a vzdělávací vazby ze sovětské éry, které Moskva stále financuje: jerevanské výzkumné ústavy a ruské univerzitní pobočky v Arménii. Udržují arménskou vědu při životě a s ní i ruský vliv v Jerevanu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud vstoupíme do války s:§Y \n[SOV.GetNameWithFlag]§!" # todo: NEW TRANSLATION
 NKR_economy_modifier: "Hospodářství Artsachu" # todo: NEW TRANSLATION
 NKR_economy_modifier_desc: "Malé válečné hospodářství Republiky Artsach: válečné zdanění, farmy v karabašských údolích, lesnické podniky a všechny investice, které Stepanakert dokáže přilákat. Každá reforma přijatá ve Stepanakertu se zde kumuluje." # todo: NEW TRANSLATION
 ARM_alpha_mobilize_idea: "Skupina Alfa (mobilizovaná)" # todo: NEW TRANSLATION
 ARM_alpha_mobilize_idea_desc: "Protiteroristická skupina Alfa byla stažena ze své běžné role a nasazena na frontě jako řadová formace. Dokud je nasazena, služba přichází o kontrarozvědnou a posádkovou práci, kterou běžně vykonává.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, až válka skončí." # todo: NEW TRANSLATION
 ARM_police_troops_mobilize_idea: "Policejní jednotky (mobilizované)" # todo: NEW TRANSLATION
 ARM_police_troops_mobilize_idea_desc: "Vnitřní jednotky ministerstva vnitra byly mobilizovány jako polní formace. Dokud jsou na frontě, nevykonávají policejní dohled ve vnitrozemí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, až válka skončí." # todo: NEW TRANSLATION
 ARM_outdated_airforce_idea: "Zastaralé letectvo" # todo: NEW TRANSLATION
 ARM_outdated_airforce_idea_desc: "Naše letectvo létá na hrstce letounů převedených po rozpadu Sovětského svazu. Životnost draků se krátí, náhradní díly přicházejí nepravidelně a piloti nalétávají příliš málo hodin, aby si udrželi kvalifikaci.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud dokončíme fokus §H$ARM_institute_mo_ra$§!, a bude §ROdebrán§!, pokud dokončíme fokus §H$ARM_air_fedence_force$§!.\nJako §HArtsach§! bude §ROdebrán§! fokusem §H$NKR_planes$§!." # todo: NEW TRANSLATION
 ARM_outdated_army_idea: "Zastaralá armáda" # todo: NEW TRANSLATION
 ARM_outdated_army_idea_desc: "Naše pozemní síly jsou vybaveny sovětskými zásobami zanechanými v roce 1991 a organizovány podle doktríny určené pro válku, která se nikdy nebude bojovat. Vozidla jsou rozebírána na náhradní díly, výcvik je pouze formální a důstojnický sbor nebyl od získání nezávislosti reformován.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud dokončíme fokusy §H$ARM_army$§!, §H$ARM_vazgen_academy$§!, §H$ARM_aspar_arms$§!, §H$ARM_k3_prototype$§!, §H$ARM_n2$§!, §H$ARM_lusan$§!, §H$ARM_uav_krunk$§! nebo §H$ARM_new_army$§!, a bude §ROdebrán§!, jakmile budou dokončeny všechny osmi.\nJako §HArtsach§! se místo toho §Gzlepší§! fokusem §H$NKR_safe_army$§!, §H$NKR_safe_univer$§!, §H$NKR_safe_special_forces$§!, §H$NKR_safe_vazgen$§! a §H$NKR_safe_mo_ra$§! a bude §ROdebrán§!, jakmile budou dokončeny všech pět." # todo: NEW TRANSLATION
 ARM_nati_army_idea: "Radikální nacionalisté v armádě" # todo: NEW TRANSLATION
 ARM_nati_army_idea_desc: "Veteráni karabašské války a strany, které je zastupují, ovládli důstojnický sbor a odvodní komise. Zaplňují řady a zvyšují chuť k válce, ale civilní vláda se zodpovídá jim stejně jako oni jí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud se komunisté dostanou k moci." # todo: NEW TRANSLATION
 ARM_dziavory_idea: "Dzhiavory" # todo: NEW TRANSLATION
 ARM_dziavory_idea_desc: "Elitní průzkumný a speciální operační oddíl sestavený z nejschopnějších dobrovolníků karabašské války. Dziavory jsou svým vyhraněně nacionalistickým smýšlením stejně tak politickou skupinou jako vojenskou jednotkou.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud se komunisté dostanou k moci." # todo: NEW TRANSLATION
 ARM_102_idea: "Jednotka 102" # todo: NEW TRANSLATION
 ARM_102_idea_desc: "Spolupráce s ruskou 102. vojenskou základnou v Gjumri poskytuje našim službám přístup k ruskému signálnímu zpravodajství, kontrarozvědné praxi a bezpečnostní záruce, kterou přináší cizí posádka na našem území.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud se komunisté dostanou k moci." # todo: NEW TRANSLATION
 ARM_corrupt_military: "Korupční armáda" # todo: NEW TRANSLATION
 ARM_corrupt_military_desc: "Korupce v arménské armádě je všudypřítomná a ochromující. Mnoho generálů se obohacuje prodejem vybavení a vykrádáním skladů místo udržování bojeschopnosti.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud bude korupce nižší než §H$corruption_level_04$§!." # todo: CHANGED
 ARM_armenian_foreign_legion_idea: "Arménská zahraniční legie" # todo: NEW TRANSLATION
 ARM_armenian_foreign_legion_idea_desc: "Naše cizinecká legie, vytvořená podle francouzské legie, přijímá dobrovolníky jakékoli národnosti ochotné sloužit Arménii. Poskytuje nám profesionální expediční kádr bez čerpání branné síly, ovšem za cenu zahraničního vlivu na její vybavení a výcvik.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud Ozbrojené síly přestanou přijímat dobrovolníky nebo ukončíme zahraniční vojenské spojení." # todo: NEW TRANSLATION
 ARM_armenian_foreign_legion_moblize_idea: "[ARM.GetFlag]Arménská zahraniční legie" # todo: NEW TRANSLATION
 ARM_armenian_foreign_legion_moblize_idea_desc: "Brigáda cizinecké legie byla stažena ze své běžné role a nasazena na frontě jako řadová formace. Její rekruti, pocházející z diaspory a řad zahraničních dobrovolníků, slouží po dobu bojů za stejných podmínek jako branci.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, až válka skončí." # todo: NEW TRANSLATION
 ARM_national_guard_level_1_tt: "Založili jsme §YNárodní gardu§!" # todo: NEW TRANSLATION
 ARM_national_guard_level_2_tt: "Rozšířili jsme §YNárodní gardu§!" # todo: NEW TRANSLATION
