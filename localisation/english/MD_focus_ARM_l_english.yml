 arm_expansion.4.t: "[ARM.GetNamewithFlag] Demands Historical Justice" # todo: NEW TRANSLATION
 arm_expansion.4.d: "Pokud nedojde k pozitivní odpovědi z naší strany, spustí operaci 'Zloměný půlměsíc'." # todo: NEW TRANSLATION
 arm_expansion.4.a: "Nemáme žádnou jinou volbu..." # todo: NEW TRANSLATION
 arm_expansion.4.b: "To je naše šance obnovit slávu Osmanské říše!" # todo: NEW TRANSLATION
 arm_expansion.5.t: "Arménie se vzdává Artsachu" # todo: NEW TRANSLATION
 arm_expansion.5.d: "Oficiálně uznáváme úplné zřeknutí se našich nároků na Náhorní Karabach" # todo: NEW TRANSLATION
 arm_expansion.5.a: "Všechno pro dobro našich zahraničních partnerů" # todo: NEW TRANSLATION
 arm_expansion.6.t: "[ARM.GetNamewithFlag] chce navázat s námi přátelské vztahy" # todo: NEW TRANSLATION
 arm_expansion.6.d: "Věří, že nastal čas zapomenout na staré křivdy a konflikty a společně vykročit k lepší budoucnosti" # todo: NEW TRANSLATION
 arm_expansion.6.a: "Všichni jsme udělali chyby" # todo: NEW TRANSLATION
 arm_expansion.6.b: "Zapomeňte na to, že bychom byli přáteli" # todo: NEW TRANSLATION
 arm_expansion.7.t: "[ARM.GetNamewithFlag] žádá o investice" # todo: NEW TRANSLATION
 arm_expansion.7.d: "[ARM.GetNamewithFlag] žádá, abychom investovali do jejich infrastruktury, a na oplátku se stanou naším obchodním centrem" # todo: NEW TRANSLATION
 arm_expansion.7.a: "Vždy rádi pomůžeme" # todo: NEW TRANSLATION
 arm_expansion.7.b: "U nás už nejsou pro nás užiteční" # todo: NEW TRANSLATION
 arm_expansion.8.t: "[FROM.GetNameWithFlag] souhlasí s investicí do naší země" # todo: NEW TRANSLATION
 arm_expansion.8.d: "Naštěstí jsme dokázali [FROM.GetNameWithFlag] přesvědčit, aby investoval do naší země" # todo: NEW TRANSLATION
 arm_expansion.8.a: "Dobré" # todo: NEW TRANSLATION
 arm_expansion.9.t: "[FROM.GetNameWithFlag] odmítl investovat do naší země" # todo: NEW TRANSLATION
 arm_expansion.9.d: "Zdá se, že [FROM.GetNameWithFlag] už nemá zájem o spolupráci s námi." # todo: NEW TRANSLATION
 arm_expansion.9.a: "Špatně" # todo: NEW TRANSLATION
 arm_expansion.10.t: "[ARM.GetNamewithFlag] nabízí nám koridor Zangezur do Nakhichevanu" # todo: NEW TRANSLATION
 arm_expansion.10.d: "Jako součást nových ujednání nám [ARM.GetNamewithFlag] nabízí koridor do Nakhichevanu. To by mělo vyloučit další konflikty mezi našimi zeměmi" # todo: NEW TRANSLATION
 arm_expansion.10.a: "Náš sen se vyplnil!" # todo: NEW TRANSLATION
 arm_expansion.10.b: "Ne, milujeme Arménii" # todo: NEW TRANSLATION
 arm_expansion.11.t: "[AZE.GetNamewithFlag] souhlasí s demilitarizací Syunik" # todo: NEW TRANSLATION
 arm_expansion.11.d: "Nyní, když jsme demilitarizovali Syunik a odevzdali kontrolu nad koridorem do Nakhichevanu [AZE.GetNamewithFlag], válka už do naší země nikdy nepřijde" # todo: NEW TRANSLATION
 arm_expansion.11.a: "Všechno pro přátelství s našimi partnery!" # todo: NEW TRANSLATION
 arm_expansion.12.t: "[AZE.GetNamewithFlag] Odmítá naši nabídku" # todo: NEW TRANSLATION
 arm_expansion.12.d: "Bezprostředně po odmítnutí naší nabídky [AZE.GetNamewithFlag] proběhla v Baku série velkých protestů" # todo: NEW TRANSLATION
 arm_expansion.12.a: "Možná je to k lepšímu" # todo: NEW TRANSLATION
 arm_expansion.13.t: "[TUR.GetNamewithFlag] souhlasí" # todo: NEW TRANSLATION
 arm_expansion.13.d: "[FROM.GetNameWithFlag] souhlasí s obnovením diplomatických vztahů s námi." # todo: NEW TRANSLATION
 arm_expansion.13.a: "Společně jsme síla" # todo: NEW TRANSLATION
 arm_expansion.14.t: "[TUR.GetNamewithFlag] odmítá znovu navázat diplomatické styky s námi" # todo: NEW TRANSLATION
 arm_expansion.14.d: "[TUR.GetNamewithFlag] přijal náš odmítavý postoj k požadavku na uznání [TUR.GetNamewithFlag] válečných zločinů v WW1, ale nebude obnovovat diplomatické styky s námi" # todo: NEW TRANSLATION
 arm_expansion.14.a: "Eh" # todo: NEW TRANSLATION
 arm_expansion.15.t: "Povstání ve Západní Arménii" # todo: NEW TRANSLATION
 arm_expansion.15.d: "Máme šanci zahájit ozbrojené povstání ve Západní Arménii, která je v současnosti pod tureckou kontrolou, avšak musíme si uvědomit, že nás to vtáhne do války s Tureckem a nebude cesty zpět." # todo: NEW TRANSLATION
 arm_expansion.15.a: "Svobodu Západní Arménie!" # todo: NEW TRANSLATION
 arm_expansion.15.b: "Nebudeme riskovat" # todo: NEW TRANSLATION
 arm_expansion.16.t: "Povstání ve Západní Arménii" # todo: NEW TRANSLATION
 arm_expansion.16.d: "Nečekaně pro nás ve takzvané Západní Arménií došlo k povstání proti naší vládě! Arménské úřady přímo prohlásily organizaci tohoto povstání a již se objevily informace o tom, že jejich militanté vystupují ve stejné řadě s rebely, to je ohavné!" # todo: NEW TRANSLATION
 arm_expansion.16.a: "Zaplatí za to." # todo: NEW TRANSLATION
 arm_expansion.17.t: "Povstání ve Západní Arménii" # todo: NEW TRANSLATION
 arm_expansion.17.d: "Přišel čas poslední války za osvobození původních Arménských zemí, teď nebo nikdy, sláva Arménii!" # todo: NEW TRANSLATION
 arm_expansion.17.a: "Sláva Arménii!" # todo: NEW TRANSLATION
 ARM_west_armenia: "Západní Arménská republika" # todo: NEW TRANSLATION
 ARM_turkey_compliance_idea: "Vláda Západní Arménie" # todo: NEW TRANSLATION
 ARM_turkey_compliance_idea_desc: "Arménie mlčky toleruje exilovou vládu Západní Arménie a udržuje diplomatickou shodu s Tureckem, aby se vyhnula provokacím, přičemž zachovává iredentistický nárok na historické arménské země. Toto uspořádání umožňuje Arménii hájit zájmy diaspory, aniž by vyvolala přímou tureckou vojenskou reakci.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, jakmile se spustí událost §HPovstání v Západní Arménii§! a Arménie zvolí osvobození." # todo: NEW TRANSLATION
 ARM_shadow_of_sevres: "Stín Sèvreské smlouvy" # todo: NEW TRANSLATION
 ARM_shadow_of_sevres_desc: "Sèvreská smlouva je jednou ze smluv versaillesko-washingtonského systému, jehož vytvoření znamenalo konec první světové války. Byla podepsána 10. srpna 1920 v Sèvres (Francie) zeměmi Dohody a státy, které se k nim připojily, na jedné straně a vládou Osmanské říše na straně druhé. Smlouva nevstoupila v platnost, protože Velké národní shromáždění Turecka ji odmítlo ratifikovat. O tři roky později byla nahrazena Lausannskou smlouvou, která stanovila hranice Turecka v jejich současné podobě." # todo: CHANGED
 ARM_active_diplomacy: "Aktivní diplomacie" # todo: NEW TRANSLATION
 ARM_active_diplomacy_desc: "Musíme hrát vedoucí roli v regionální politice, a naším základním úkolem při jejím dosažení bude porazit hlavní zlo Kavkazu - Turecko" # todo: NEW TRANSLATION
 ARM_west_arm_gov: "Kontaktovat vládu Západní Arménie" # todo: NEW TRANSLATION
 ARM_west_arm_gov_desc: "Republika Západní Arménie, také známá jako Stát Arménie, je vládou v exile, která nárokuje suverenitu nad částmi arménských vysočin včetně částí Západní Arménie, stejně jako Náchijevan, a někdy i Nagorno-Karabachu. Tato sebeprohlášená země tvrdí, že má vlastní prezidentství, vládu, parlament, ústavu, státní hymnu a státní znak" # todo: NEW TRANSLATION
 ARM_agree_with_greece: "Obnovit Velkou myšlenku" # todo: NEW TRANSLATION
 ARM_agree_with_greece_desc: "V současnosti [TUR.GetNamewithFlag] drží rozsáhlé území, která právo patří [GRE.GetNamewithFlag]. Pozveme Řecko, aby se k naší koalici připojilo a pomohlo nám získat zpět to, co bylo ztraceno." # todo: NEW TRANSLATION
 ARM_negotiate_syria: "Jednání se [SYR.GetNamewithFlag]" # todo: NEW TRANSLATION
 ARM_negotiate_syria_desc: "Některé z původních území [SYR.GetNamewithFlag] se nacházejí také pod tureckou kontrolou. [SYR.GetNamewithFlag] se však nachází ve zranitelné strategické pozici v případě možného útoku ze severu." # todo: NEW TRANSLATION
 ARM_negotiate_kurds: "Jednání s [KUR.GetNamewithFlag]" # todo: NEW TRANSLATION
 ARM_negotiate_kurds_desc: "Po desítky let se Kurdové snaží založit vlastní nezávislý stát, který by sjednotil celý kurdský lid. Pojďme jim tedy v tomto úsilí pomoci." # todo: NEW TRANSLATION
 ARM_return_to_western_armenia: "Návrat do Západní Arménie" # todo: NEW TRANSLATION
 ARM_return_to_western_armenia_desc: "Je čas znovu získat to, co bylo ztraceno, a osvobodit Kavkaz a Malou Asii od tureckého kolonialismu." # todo: NEW TRANSLATION
 ARM_land_of_peace: "Země míru" # todo: NEW TRANSLATION
 ARM_land_of_peace_desc: "Minulé zkušenosti ukazují, že nejsme schopni znovu získat naše území. Nyní stojí za to přehodnotit naši zahraniční politiku a pokusit se navázat vztahy s našimi islámskými sousedy." # todo: NEW TRANSLATION
 ARM_ussr_success_const: "Dědictví Arménské SSR" # todo: NEW TRANSLATION
 ARM_ussr_success_const_desc: "Abychom navázali přátelské vztahy se sousedy, považujeme se za nástupce Arménské SSR, čímž potvrzujeme územní celistvost všech ostatních SSR, včetně [AZE.GetNamewithFlag]" # todo: NEW TRANSLATION
 ARM_normalize_relations_with_turkey: "Normalizovat vztahy s Tureckem" # todo: NEW TRANSLATION
 ARM_normalize_relations_with_turkey_desc: "Hlavním důvodem dlouhodobého konfliktu mezi Tureckem a Arménií byly turecké válečné zločiny ve Západní Arménii. Nyní o tom už nemáme zájem, neboť uplynulo více než půl století." # todo: NEW TRANSLATION
 ARM_crossroad_of_peace: "Křižovatka míru" # todo: NEW TRANSLATION
 ARM_crossroad_of_peace_desc: "Jako neutrální země, která udržuje dobré vztahy se sousedy, jim nabídneme investice do naší ekonomiky." # todo: NEW TRANSLATION
 ARM_zang_corr_question: "Problém Zangezurského koridoru" # todo: NEW TRANSLATION
 ARM_zang_corr_question_desc: "V souladu s naší novou politikou míru už nemáme zájem o další vojenský rozvoj Syuniku. Ač je to klíčová tepna bránící Ázerbájdžánu v přístupu k jeho exklávě Náchijevan a zároveň nám poskytuje vozní trasu pro íránské vojenské dodávky, již nemáme v úmyslu tuto oblast využívat k tlaku na Ázerbájdžán." # todo: NEW TRANSLATION
 ARM_anatolian_heritage: "Anatolské dědictví" # todo: NEW TRANSLATION
 ARM_anatolian_heritage_desc: "Je nutné zahájit kulturní, hospodářskou, politickou a vědeckou výměnu mezi našimi zeměmi, aby se dále stabilizovaly naše vztahy." # todo: NEW TRANSLATION
 ARM_scince_poten_idea: "Vědecký potenciál" # todo: NEW TRANSLATION
 ARM_kazah_cooperation_idea: "[KAZ.GetNamewithFlag] - [ARM.GetNamewithFlag] spolupráce" # todo: NEW TRANSLATION
 ARM_kazah_cooperation_idea_desc: "Arménie navazuje hospodářské a politické vztahy s Kazachstánem a využívá společné sovětské dědictví, vazby diaspory a vzájemný zájem na odporu proti ruské hegemonii. Spolupráce zahrnuje obchod s energiemi, investice a bezpečnostní koordinaci a ukotvuje Arménii ve středoasijských sítích.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud vstoupíme do války s Kazachstánem." # todo: NEW TRANSLATION
 ARM_raising_taxes_idea: "Zvyšování daní" # todo: NEW TRANSLATION
 ARM_shirvan_deal: "Nabídka [PER.GetNamewithFlag] teritoriální výměny" # todo: NEW TRANSLATION
 arme.174.t: "[ARM.GetNamewithFlag] nabízí teritoriální výměnu" # todo: NEW TRANSLATION
 arme.174.d: "Nedávno nám Arménie navrhla provést výměnu území a vyměnit naši provincii Khoy, kde žijí převážně íránští Kurdové, za území obývané persky mluvícím obyvatelstvem - provincii Shirvan. Měli bychom souhlasit?" # todo: NEW TRANSLATION
 arme.174.a: "Jistě, proč ne!" # todo: NEW TRANSLATION
 arme.174.b: "Je to nějaký plán?" # todo: NEW TRANSLATION
 arme.175.t: "[PER.GetNamewithFlag] popírá teritoriální výměnu!" # todo: NEW TRANSLATION
 arme.175.d: "Írán si nepřeje předat Khoy nám výměnou za Shirvan." # todo: NEW TRANSLATION
 arme.175.a: "Zaplatí za to." # todo: NEW TRANSLATION
 ARM_turkey_negotiations: "Jednání s [TUR.GetNamewithFlag]" # todo: NEW TRANSLATION
 ARM_turkey_negotiations_desc: "Od naší nezávislosti bylo Turecko velkou překážkou pro obchod s Evropou. Možná bychom mohli normalizovat naše vztahy a otevřít hranice." # todo: NEW TRANSLATION
 arme.176.t: "Náš postoj k jednáním se [TUR.GetNamewithFlag]" # todo: NEW TRANSLATION
 arme.176.d: "Je čas definovat náš postoj k jednáním s Tureckem. Měli bychom začít s normalizací vztahů a otevřením hranic, nebo na tuto myšlenku zapomenout?" # todo: NEW TRANSLATION
 arme.176.a: "Oznamte Turecku, že jsme připraveni jednat." # todo: NEW TRANSLATION
 arme.176.b: "Zbavte se tohoto hloupého nápadu." # todo: NEW TRANSLATION
 arme.177.t: "[ARM.GetNamewithFlag] chce normalizovat vztahy!" # todo: NEW TRANSLATION
 arme.177.d: "Nedávno nám Arménie zaslala diplomatickou nabídku k normalizaci a regulaci vztahů. Z dlouhodobého hlediska může vzájemné partnerství a otevření hranic přinést pro obě strany prospěch. Arménie však vyžaduje od nás uznání Genocidy v Osmanské říši. Mnoho nacionalistických aktivistů věří, že uznání může vést k územním nárokům nebo ekonomickým náhradám. Arménie sama však takové obvinění popírá." # todo: NEW TRANSLATION
 arme.177.a: "Jsme připraveni na normalizaci, avšak musíme prodiskutovat několik bodů." # todo: NEW TRANSLATION
 arme.177.b: "Nejprve budou muset vyřešit konflikt v Náhorním Karabachu." # todo: NEW TRANSLATION
 arme.177.c: "Jak si to vůbec troufají, myslet si, že s námi mohou jednat!" # todo: NEW TRANSLATION
 arme.178.t: "[TUR.GetNamewithFlag] asks Us to Drop Genocide Allegations!" # todo: NEW TRANSLATION
 arme.178.d: "Arménie souhlasila s tím, že odstoupí od svých nároků na genocidu a nyní je plně připravena normalizovat vztahy a otevřít hranice pro obchod." # todo: NEW TRANSLATION
 arme.178.a: "Požadavek na spravedlnost se nerovná odškodněním a územním nárokům." # todo: NEW TRANSLATION
 arme.178.b: "Můžeme se jistě vzdát svých aspirací." # todo: NEW TRANSLATION
 arme.179.t: "[ARM.GetNamewithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.179.d: "Arménie souhlasila s tím, že odstoupí od svých nároků na genocidu a nyní je plně připravena normalizovat vztahy a otevřít hranice pro obchod." # todo: NEW TRANSLATION
 arme.179.a: "Skvělé!" # todo: NEW TRANSLATION
 turkish_relat_negotated: "Arméno-turecké vztahy normalizovány" # todo: NEW TRANSLATION
 arme.180.t: "[ARM.GetNamewithFlag] Trvá na svém!" # todo: NEW TRANSLATION
 arme.180.d: "Arménie znovu prohlašuje, že nemá v úmyslu nárokovat žádné území Turecka. Naopak by mohly být vybudovány muzea míru a historie, aby odsoudily krvavou historii a očistily turecký stát od osmanské minulosti. Arménie trvá na tom, že chce podporovat obchod a politické vztahy, nikoli irredentistické cíle." # todo: NEW TRANSLATION
 arme.180.a: "Pojďme uznat minulé zvěrstva a vybudovat novou budoucnost." # todo: NEW TRANSLATION
 arme.180.b: "Chtějí nás ponížit. To je nepřijatelné." # todo: NEW TRANSLATION
 arme.181.t: "[TUR.GetNamewithFlag] Uznává arménskou genocidu!" # todo: NEW TRANSLATION
 arme.181.d: "Turecko nedávno souhlasilo uznat genocidu z roku 1915 v Osmanské říši a normalizovat vztahy s námi." # todo: NEW TRANSLATION
 arme.181.a: "Bůh žehnej!" # todo: NEW TRANSLATION
 arme.182.t: "[TUR.GetNamewithFlag] Odmítá normalizovat vztahy!" # todo: NEW TRANSLATION
 arme.182.d: "Turecko nedávno zrušilo veškeré diplomatické snahy o normalizaci vztahů s námi. Žádné spojení už se nevytváří." # todo: NEW TRANSLATION
 arme.182.a: "Oni se nikdy nemění." # todo: NEW TRANSLATION
 arme.183.t: "Opozice proti staré vládě" # todo: NEW TRANSLATION
 arme.183.d: "Radikální změna moci v naší zemi nezůstala bez povšimnutí. Příznivci předchozí vlády proti nám zorganizovali mohutnou opoziční kampaň a testují sílu a stabilitu naší vlády." # todo: CHANGED
 arme.183.a: "Jejich čas vypršel." # todo: NEW TRANSLATION
 arme.184.t: "Opozice proti staré vládě" # todo: NEW TRANSLATION
 arme.184.d: "Radikální změna moci v naší zemi nezůstala bez povšimnutí. Příznivci předchozí vlády proti nám zorganizovali mohutnou opoziční kampaň a testují sílu a stabilitu naší vlády." # todo: CHANGED
 arme.184.a: "Jejich čas vypršel." # todo: NEW TRANSLATION
 arme.185.t: "Opozice proti staré vládě" # todo: NEW TRANSLATION
 arme.185.d: "Radikální změna moci v naší zemi nezůstala bez povšimnutí. Příznivci předchozí vlády proti nám zorganizovali mohutnou opoziční kampaň a testují sílu a stabilitu naší vlády." # todo: CHANGED
 arme.185.a: "Jejich čas vypršel." # todo: NEW TRANSLATION
 arme.186.t: "Opozice proti staré vládě" # todo: NEW TRANSLATION
 arme.186.d: "Radikální změna moci v naší zemi nezůstala bez povšimnutí. Příznivci předchozí vlády proti nám zorganizovali mohutnou opoziční kampaň a testují sílu a stabilitu naší vlády." # todo: CHANGED
 arme.186.a: "Jejich čas vypršel." # todo: NEW TRANSLATION
 arme.187.t: "Protesty v regionech" # todo: NEW TRANSLATION
 arme.187.d: "Politická nestabilita zasáhla i naše loutky. Státy pod naší kontrolou sužují protesty proti Arménům; musíme s tím rychle zatočit." # todo: NEW TRANSLATION
 arme.187.a: "Sakra!" # todo: NEW TRANSLATION
 arme.188.t: "Arménie žádá o zbraně" # todo: NEW TRANSLATION
 arme.188.d: "Arménie, jako plnohodnotný člen NATO, zahájila program zbrojení a nyní žádá, abychom jí poskytli určité zbraně pro její reformovanou armádu." # todo: NEW TRANSLATION
 arme.188.a: "Zbraně poskytneme." # todo: NEW TRANSLATION
 arme.188.b: "Ne" # todo: NEW TRANSLATION
 arme.189.t: "Zbraně NATO" # todo: NEW TRANSLATION
 arme.189.d: "[FROM.GetNamewithFlag] souhlasí s tím, že nám poskytne zbraně k vyzbrojení naší armády." # todo: NEW TRANSLATION
 arme.189.a: "Skvělé" # todo: NEW TRANSLATION
 arme.190.t: "Zbraně NATO" # todo: NEW TRANSLATION
 arme.190.d: "[FROM.GetNamewithFlag] odmítl poskytnout nám zbraně k vyzbrojení naší armády." # todo: NEW TRANSLATION
 arme.190.a: "Škoda." # todo: NEW TRANSLATION
 arme.223.t: "Povstání v Ázerbájdžánu" # todo: NEW TRANSLATION
 arme.223.d: "Ázerbájdžánští separatisté využili naši nepřipravenou speciální službu i malou armádu a rozpoutali ozbrojené povstání v snaze osvobodit svou zemi od naší vlády." # todo: NEW TRANSLATION
 arme.223.a: "Oh ne!" # todo: NEW TRANSLATION
 arme.224.t: "Povstání v Kubanu" # todo: NEW TRANSLATION
 arme.224.d: "Naše kroky v Kubanu nebyly bez následků; lid Kubanu se vzbouřil proti nám, oznámili vznik Kubánské republiky a začali vytvářet ozbrojené skupiny, aby s námi bojovali." # todo: NEW TRANSLATION
 arme.224.a: "Oh ne!" # todo: NEW TRANSLATION
 arme.225.t: "Povstání v Dagestánu" # todo: NEW TRANSLATION
 arme.225.d: "Naše akce v Dagestánu nebyly bez následků; lid Dagestánu se postavil proti nám, oznámili vznik Dagestánské republiky a začali tvořit ozbrojené skupiny, aby s námi bojovali." # todo: NEW TRANSLATION
 arme.225.a: "Oh ne!" # todo: NEW TRANSLATION
 arme.226.t: "Povstání v Gruzii" # todo: NEW TRANSLATION
 arme.226.d: "Naše akce v Gruzii nebyly bez následků; Gruziné se vzbouřili proti nám a chtějí se osvobodit od naší okupace; nyní se musíme vypořádat s organizovaným gruzínským povstáním." # todo: NEW TRANSLATION
 arme.226.a: "Oh ne!" # todo: NEW TRANSLATION
 arme.227.t: "Povstání v Abcházii" # todo: NEW TRANSLATION
 arme.227.d: "Naše akce v Abcházii nebyly bez následků; Abchazové se vzbouřili proti nám a chtějí se osvobodit od naší okupace, nyní se musíme vypořádat s organizovaným Abcházie povstáním." # todo: NEW TRANSLATION
 arme.227.a: "Oh ne!" # todo: NEW TRANSLATION
 arme.228.t: "Povstání v Kurdistánu" # todo: NEW TRANSLATION
 arme.228.d: "Naše akce v Kurdistánu nebyly bez následků; Kurdistánští lidé se vzbouřili proti nám a chtějí se osvobodit od naší okupace, nyní se musíme vypořádat s organizovaným Kurdistán povstáním." # todo: NEW TRANSLATION
 arme.228.a: "Oh ne!" # todo: NEW TRANSLATION
 arme.229.t: "Povstání v Djavakheti" # todo: NEW TRANSLATION
 arme.229.d: "Obyvatelé Djavakheti byli extrémně šokováni naší politikou vůči Artsachu a opuštěním těchto území. V tomto kontextu se skupina radikálních vojenských sil podařilo zorganizovat povstání, prohlašující naši vládu za ilegální a proti Arménům." # todo: NEW TRANSLATION
 arme.229.a: "Oh ne!" # todo: NEW TRANSLATION
 arme.230.t: "Autonomie Talyšstánu" # todo: NEW TRANSLATION
 arme.230.d: "Vláda Talyšstánu vydala ultimátum na naši vládu, vyjadřující ostrou neposlušnost vůči našim politickým ambicím plně podmanit tato území Arménskému národu; žádají autonomii od nás jako součást našeho státu, nebo hodlají bránit svou nezávislost zbraněmi." # todo: NEW TRANSLATION
 arme.230.a: "Žádná autonomie" # todo: NEW TRANSLATION
 arme.230.b: "Dejme jim autonomii" # todo: NEW TRANSLATION
 arme.231.t: "Protesty proti slabé armádě" # todo: NEW TRANSLATION
 arme.231.d: "Ozbrojené povstání, které proti nám vzniklo, vyvolalo vlnu protestů napříč zemí; lidé jsou nespokojeni se slabostí našich ozbrojených sil a požadují větší financování naší armády." # todo: NEW TRANSLATION
 arme.231.a: "A co budou jíst?" # todo: NEW TRANSLATION
 ARM_repatriate_armenians: "§GRepatriate§! §YArméni§! zpět do [ARM.GetNamewithFlag]" # todo: NEW TRANSLATION
 first_repat_done: "První repatriace dokončena" # todo: NEW TRANSLATION
 second_repat_done: "Druhá repatriace dokončena" # todo: NEW TRANSLATION
 third_repat_done: "Třetí repatriace dokončena" # todo: NEW TRANSLATION
 four_repat_done: "Čtvrtá repatriace dokončena" # todo: NEW TRANSLATION
 effect_app_if_migr_lev_tt: "§YDopad tohoto rozhodnutí se projeví, až dosáhne alespoň nízké úrovně emigrace§!" # todo: NEW TRANSLATION
 ARM_ask_diaspora_invest: "Žádejte §YDiaspora§! o §GInvestovat§! do [ARM.GetNamewithFlag]" # todo: NEW TRANSLATION
 ARM_fix_water_yerevan: "Opravit vodovodní potrubí v §YYerevan§!" # todo: NEW TRANSLATION
 ARM_fix_water_gegharkunik: "Opravit vodovodní potrubí v §YGegharkunik-Tavush§!" # todo: NEW TRANSLATION
 ARM_fix_water_syunik: "Opravit vodovodní potrubí v §YSyunik§!" # todo: NEW TRANSLATION
 arme.191.t: "Opoziční snahy o sesazení Kocharyana!" # todo: NEW TRANSLATION
 arme.191.d: "Opoziční vůdci vytvořili koalici a kromě protestů se nyní snaží sesadit Kocharyana z prezidentského úřadu. Nyní vše závisí na tom, jak loajální budou vládní elity k Kocharyanovi." # todo: NEW TRANSLATION
 arme.191.a: "Sakra!" # todo: NEW TRANSLATION
 arme.191.b: "Neměli šanci." # todo: NEW TRANSLATION
 oppos_killed: "Opozice zabita" # todo: NEW TRANSLATION
 oppos_lived: "Opozice žije" # todo: NEW TRANSLATION
 arme.192.t: "Raffi Hovhannisyan zakládá stranu Heritage!" # todo: NEW TRANSLATION
 arme.192.d: "V Arménii byla nedávno založena národní-liberální strana Heritage. Založil ji první ministr zahraničních věcí Arménie Raffi Hovhannisyan, který tuto funkci zastával v 90. letech pod Levonem Ter-Petrosyanem. Strana považuje za svůj primární úkol vybudování vyspělého právního demokratického státu, který buduje domácí i zahraniční politiku na základě svého národního suvereního zájmu." # todo: NEW TRANSLATION
 arme.192.a: "Nový hráč?" # todo: NEW TRANSLATION
 ARM_protests: "Opoziční protesty" # todo: NEW TRANSLATION
 arme.193.t: "Opoziční protesty!" # todo: NEW TRANSLATION
 arme.193.d: "Demirchyan zahájil protest požadující odchod moci na Náměstí Svobody, později uspořádal shromáždění u Prezidentského paláce, ale policie zablokovala cestu před Národním shromážděním." # todo: NEW TRANSLATION
 arme.193.a: "Potlačte je silou." # todo: NEW TRANSLATION
 arme.194.t: "Arménský voják zavražděn v Maďarsku!" # todo: NEW TRANSLATION
 arme.194.d: "Na maďarském území, během společného cvičení partnerů NATO, se arménští a ázerbájdžánští vojáci zúčastnili; arménský voják Gurgen Margaryan byl zabit. Od 11. ledna 2004 se Margaryan účastnil tříměsíčního kurzu angličtiny v programu NATO Partnership for Peace v Budapešti. Brzy ráno 19. února byl zabit. Vrah, ázerbájdžánský důstojník Ramíl Safarov, udeřil spícího arménského důstojníka 16 ran sekerou, téměř oddělil mu hlavu od těla. Safarov byl zadržen, ale jeho budoucnost je stále nejasná. Není známo, zda bude deportován do Ázerbájdžánu nebo ne." # todo: NEW TRANSLATION
 arme.194.a: "Takový barbarský čin!" # todo: NEW TRANSLATION
 arme.194.b: "Dobrá práce! Musíme mu udělit titul hrdiny!" # todo: NEW TRANSLATION
 arme.195.t: "[AZE.GetNamewithFlag] pays us to release Safarov!" # todo: NEW TRANSLATION
 arme.195.d: "V Maďarsku, během společného cvičení partnerů NATO, se arménští a ázerbájdžánští vojáci zúčastnili; arménský voják Gurgen Margaryan byl zabit. Od 11. ledna 2004 Margaryan absolvoval tříměsíční kurz angličtiny v programu NATO Partnership for Peace v Budapešti. Brzy ráno 19. února byl zabit. Vrah, ázerbájdžánský důstojník Ramíl Safarov, udeřil spícího arménského důstojníka 16 ran sekerou, téměř oddělil mu hlavu od těla. Safarov byl zadržen, ale jeho budoucnost je stále nejasná. Není známo, zda bude deportován do Ázerbájdžánu nebo ne." # todo: NEW TRANSLATION
 arme.195.a: "Peníze jsou vždycky dobré!" # todo: NEW TRANSLATION
 arme.196.t: "90 let od Arménské genocidy" # todo: NEW TRANSLATION
 arme.196.d: "Dnes je země v truchlení k 90. výročí genocidy Arménců, Řeků a Asýrů v Osmanské Turecku. Miliony Arménů po celém světě vyjadřují s námi solidaritu, stejně jako vůdcové mnoha zemí, které uznaly osmanské zločiny proti lidskosti." # todo: NEW TRANSLATION
 arme.196.a: "Ať oběti odpočívají v pokoji." # todo: NEW TRANSLATION
 arme.197.t: "Zřízení Výboru pro výzkum genocidy" # todo: NEW TRANSLATION
 arme.197.d: "Dnes se v Jerevánu sešli vládní představitelé, zástupci Muzea genocidy a zástupci Arménské diaspory a duchovních, aby projednali zřízení výboru pro studium Arménské genocidy." # todo: NEW TRANSLATION
 arme.197.a: "Dobrá iniciativa" # todo: NEW TRANSLATION
 arme.198.t: "Masové protesty v Jerevánu!" # todo: NEW TRANSLATION
 arme.198.d: "Řada proti vládě směřujících nepokojů proběhla v Arménii. Protesty vypukly v arménském hlavním městě Jerevánu, organizované přívrženci prezidentského kandidáta a bývalého prezidenta Levona Ter-Petrosjana a dalšími opozičními vůdci. Ve dne jich bylo desítky tisíc demonstrantů a stovky tábořily přes noc." # todo: NEW TRANSLATION
 arme.198.a: "Potlačte je!" # todo: NEW TRANSLATION
 arme.199.t: "Protesty dosahují svého vrcholu!" # todo: NEW TRANSLATION
 arme.199.d: "Protesty dosáhly takové míry, že policie již nemůže dav nekonfrontovat nenásilnými prostředky. Armáda je ve střehu, policie i vojáci jsou připraveni otevřít palbu. Všichni čekají na rozkaz." # todo: NEW TRANSLATION
 arme.199.a: "Zničte je naší armádou!" # todo: NEW TRANSLATION
 arme.199.b: "Ne, armáda už není loajální... Musíme odstoupit!" # todo: NEW TRANSLATION
 arme.200.t: "Převod moci na Serzh Sargsyana" # todo: NEW TRANSLATION
 arme.200.d: "Po potlačení shromáždění a vnitřních dohod je Kočaryan připraven předat post prezidenta vyvolenému nástupci Serzh Sargsyana." # todo: NEW TRANSLATION
 arme.200.a: "Skvělé" # todo: NEW TRANSLATION
 arme.200.b: "To se nestane!" # todo: NEW TRANSLATION
 arme.201.t: "Protesty Dashnaktsutyun!" # todo: NEW TRANSLATION
 arme.201.d: "Na pozadí zahájení jednání mezi Tureckem a Arménií zahájila strana Dashnaktsutyun proces odchodu z koalice a protestovala proti diplomatickému rozhodnutí Serzh Sargsyana." # todo: NEW TRANSLATION
 arme.201.a: "Zatracení idioti" # todo: NEW TRANSLATION
 arme.203.t: "Hnutí Mashtots Park" # todo: NEW TRANSLATION
 arme.203.d: "Na základě rozhodnutí starosty Jerevanu, který je nám loajální, o demolici kiosků a zelených ploch v parku Mashtots, vzniklo v Jerevánu pokojné protestní hnutí. Požadují zachování současných podmínek veřejného prostoru města." # todo: NEW TRANSLATION
 arme.203.a: "Jejich požadavky jsou rozumné." # todo: NEW TRANSLATION
 arme.203.b: "Idioti liberálové!" # todo: NEW TRANSLATION
 arme.204.t: "Raffi Hovhannisyan vyhlašuje revoluci!" # todo: NEW TRANSLATION
 arme.204.d: "Různé politické a občanské skupiny nyní organizují proti-vládní protesty v Arménii. Lídrem protestního hnutí je jasně Raffi Hovhannisyan. Množství jeho příznivců se shromáždilo na Náměstí Svobody v Jerevánu, kde Hovhannisyan vyzval prezidenta Sargsyana, aby uznal vítězství lidu a přiznal svou porážku. Do protestu se zapojují i prozápadní a nacionalistické strany, jako Dashnaks." # todo: NEW TRANSLATION
 arme.204.a: "Potlačte protesty!" # todo: NEW TRANSLATION
 arme.204.b: "Dejte jim to, co chtějí" # todo: NEW TRANSLATION
 arme.205.t: "Raffi Hovhannisyan zahájí hladovku!" # todo: NEW TRANSLATION
 arme.205.d: "Raffi, po projevu ke svým příznivcům na Náměstí Svobody, oznámil svůj záměr zahájit hladovku. Vyzval zvoleného prezidenta Serzh Sargsyana k rezignaci. Podle Hovhannisyana to není jen hladovka, ale bojkot lží a podvodů." # todo: NEW TRANSLATION
 arme.205.a: "Alespoň protesty ustupují." # todo: NEW TRANSLATION
 arme.206.t: "Strana občanského kontraktu" # todo: NEW TRANSLATION
 arme.206.d: "Nedávno skupina různých opozičních představitelů oznámila vytvoření nové strany složené z bývalých členů ANC. Vůdcem této nové strany je Nikol Pašinjan, který byl nedávno propuštěn z vězení po zadržení během protestů." # todo: CHANGED
 arme.206.a: "Další skupina?" # todo: NEW TRANSLATION
 arme.207.t: "Elektrické protesty v Jerevánu" # todo: NEW TRANSLATION
 arme.207.d: "V souvislosti s nedávným pokusem parlamentu zvýšit tarify za elektřinu začaly v Jerevánu masové protesty. Policie se snaží protestující rozehnat prostředky nekonvenčního násilí a vodními děly. Měli bychom znovu zvážit náš postoj k tarifům, nebo nechat věci tak, jak jsou?" # todo: NEW TRANSLATION
 arme.207.a: "Opustíme náš plán" # todo: NEW TRANSLATION
 arme.207.b: "Prosadíme změnu tarifů!" # todo: NEW TRANSLATION
 arme.208.t: "Masakr v Gyumri!" # todo: NEW TRANSLATION
 arme.208.d: "Valery Permyakov, služebník 102. ruské vojenské základny v Gyumri, byl na noční hlídce. Přibližně ve 4:00 ráno 12. ledna, Permyakov, nesoucí útočnou pušku AK-74 a dva zásobníky munice, opustil místo jednotky, nebo spíše strážní post skladů RAV, bez povolení. Deserter headed for the Armenian-Turkish border, intending to cross it and disappear into Turkey. Some time after his escape, Permyakov decided to enter one of the houses located on Myasnikyan Street, about a 30-minute walk from the Russian military unit. Entering the common courtyard through a gate that was locked only symbolically, Permyakov discovered several detached one-story houses. The soldier, having broken the frame of the glass part of the front door, entered the building.\n\nPermyakov killed all members of the Avetisyan family, who lived in this house, including the children. After the massacre he committed, Valery Permyakov, dressed in the clothes of the dead and abandoning his machine gun, left the scene of the crime. At 12:30 p.m., the bodies of the Avetisyan family were discovered by neighbors.\n\nWe are faced with a dilemma - should we deal with him ourselves or hand this scum over to Russia?" # todo: NEW TRANSLATION
 arme.208.a: "Rusko naučí tohoto zmetka, jak se chovat, v Sibiři!" # todo: NEW TRANSLATION
 arme.208.b: "Popravte toho zmetka!" # todo: NEW TRANSLATION
 arme.209.t: "Masakr v Gyumri!" # todo: NEW TRANSLATION
 arme.209.d: "Valerij Permjakov, voják 102. ruské vojenské základny v Gjumri, měl noční službu. Kolem čtvrté hodiny ranní 12. ledna Permjakov vyzbrojený útočnou puškou AK-74 a dvěma zásobníky munice bez povolení opustil areál jednotky, přesněji strážní stanoviště skladů RAV. Dezertér zamířil k arménsko-turecké hranici s úmyslem překročit ji a zmizet v Turecku. Nějaký čas po útěku se Permjakov rozhodl vstoupit do jednoho z domů v Mjasnikjanově ulici, asi třicet minut chůze od ruské vojenské jednotky. Branou, která byla uzamčena pouze symbolicky, vstoupil na společný dvůr a objevil několik samostatně stojících jednopatrových domů. Voják rozbil rám skleněné části vstupních dveří a vstoupil do budovy.\n\nPermjakov zabil všechny členy rodiny Avetisjanových, kteří v tomto domě žili, včetně dětí. Po masakru, který spáchal, Valerij Permjakov odešel z místa činu v oblečení mrtvých a zanechal svou pušku. Ve 12:30 objevili těla rodiny Avetisjanových sousedé.\n\nArménie byla velmi velkorysá, když tohoto netvora nepopravila. Permjakov nyní musí stanout před soudem a být poslán do věznice s nejvyšší ostrahou." # todo: CHANGED
 arme.209.a: "Tento zmetek zhyne v pekle." # todo: NEW TRANSLATION
 arme.210.t: "Masakr v Gyumri!" # todo: NEW TRANSLATION
 arme.210.d: "Valerij Permjakov, voják 102. ruské vojenské základny v Gjumri, měl noční službu. Kolem čtvrté hodiny ranní 12. ledna Permjakov vyzbrojený útočnou puškou AK-74 a dvěma zásobníky munice bez povolení opustil areál jednotky, přesněji strážní stanoviště skladů RAV. Dezertér zamířil k arménsko-turecké hranici s úmyslem překročit ji a zmizet v Turecku. Nějaký čas po útěku se Permjakov rozhodl vstoupit do jednoho z domů v Mjasnikjanově ulici, asi třicet minut chůze od ruské vojenské jednotky. Branou, která byla uzamčena pouze symbolicky, vstoupil na společný dvůr a objevil několik samostatně stojících jednopatrových domů. Voják rozbil rám skleněné části vstupních dveří a vstoupil do budovy.\n\nPermjakov zabil všechny členy rodiny Avetisjanových, kteří v tomto domě žili, včetně dětí. Po masakru, který spáchal, Valerij Permjakov odešel z místa činu v oblečení mrtvých a zanechal svou pušku. Ve 12:30 objevili těla rodiny Avetisjanových sousedé.\n\nArménie se rozhodla Permjakova popravit a nevydat ho Rusku k doživotnímu trestu." # todo: CHANGED
 arme.210.a: "Tento zmetek zhyne v pekle." # todo: NEW TRANSLATION
 arme.211.t: "Krizová situace s rukojmími v Jerevánu" # todo: NEW TRANSLATION
 arme.211.d: "Skupina ozbrojených mužů, kteří si říkají Daredevils of Sasun, vtrhla do policejní stanice v Jerevánu a vzala devět rukojmích. Požadovali propuštění opozičního vůdce Jirair Sefilian a rezignaci prezidenta. Skupina zahájila patovou situaci s vládními silami, s rostoucími davy demonstrantů, které volají po rezignaci prezidenta. Dva policisté byli zabiti během patové situace a desítky byly zraněny; jeden policista zemřel po skončení krize. Někteří útočníci byli rovněž zraněni. Co bychom měli dělat?" # todo: NEW TRANSLATION
 arme.211.a: "Negotiate with them" # todo: NEW TRANSLATION
 arme.211.b: "Send the National Security Service to storm the place!" # todo: NEW TRANSLATION
 arme.212.t: "Sasna Tsrer Surrender!" # todo: NEW TRANSLATION
 arme.212.d: "Skupina Sasna Tsrer se rozhodla vzdát, aby se zabránilo dalšímu krveprolití. S ohledem na naše úsilí byla situace vyřešena poměrně klidně." # todo: NEW TRANSLATION
 arme.212.a: "Díky bohu..." # todo: NEW TRANSLATION
 arme.213.t: "Zásah speciálních sil byl úspěšný!" # todo: NEW TRANSLATION
 arme.213.d: "Speciální síly úspěšně obsadily policejní stanici a vyčistily oblast od politických teroristů Sasna Tsrer. Všichni útočníci byli zabiti. Žádný rukojmý nebyl zraněn." # todo: NEW TRANSLATION
 arme.213.a: "Skvělá operace!" # todo: NEW TRANSLATION
 pavlik_dies: "Pavlik Manukyan zemřel" # todo: NEW TRANSLATION
 arme.214.t: "Armen Sarkissian se stává prezidentem!" # todo: NEW TRANSLATION
 arme.214.d: "Dne 31. března zahájil Nikol Pashinyan svůj protestní pochod Im Qayl (můj krok), který začíná ve městě Gyumri a plánuje projít města a vesnice, jako jsou Vanadzor, Dilijan, Hrazdan a Abovyan, než nakonec dorazí do Jerevanu." # todo: NEW TRANSLATION
 arme.214.a: "Dobrá volba." # todo: NEW TRANSLATION
 arme.215.t: "Protestní pochod v Gyumri!" # todo: NEW TRANSLATION
 arme.215.d: "Dne 31. března zahájil Nikol Pashinyan svůj protestní pochod Im Qayl (můj krok), který začíná ve městě Gyumri a plánuje projít města a vesnice jako Vanadzor, Dilijan, Hrazdan a Abovyan, než nakonec dorazí do Jerevanu." # todo: NEW TRANSLATION
 arme.215.a: "Další zbytečný protest?" # todo: NEW TRANSLATION
 arme.217.t: "Sametová revoluce" # todo: NEW TRANSLATION
 arme.217.d: "Z řady politických protestů v Arménii se reakční takzvaná 'konzervativní' strana Arménie vedená Serzh Sargsyan vzdala a umožnila lidem zvolit Nikol Pashinyana do úřadu, který slíbil zničit rozšířenou korupci, která Arménii sužuje, zlepšit její hospodářskou situaci a zastavit masovou emigraci." # todo: NEW TRANSLATION
 arme.217.a: "Duch!" # todo: NEW TRANSLATION
 arme.218.t: "Nikol Pashinyan jmenuje příštího ministra obrany!" # todo: NEW TRANSLATION
 arme.218.d: "Premiér Arménie Nikol Pashinyan uvedl, že jmenuje Davita Tonoyana, dočasného ministra pro mimořádné situace, na post ministra obrany. Navzdory pochybnému renomé Davita Tonoyana a možným korupčním vazbám je Davit Tonoyan proslavený svou nacionalistickou a expanzivní rétorikou, která by mohla uklidnit nacionalisty v zemi." # todo: NEW TRANSLATION
 arme.218.a: "Zajímavé" # todo: NEW TRANSLATION
 arme.219.t: "Panarménská národní dohoda" # todo: NEW TRANSLATION
 arme.219.d: "Ve Arménii byla nedávno vytvořena nová strana. Aliance věří v přímou demokracii, zrušení prezidentského úřadu, posílení suverenity Arménie, pokračování hospodářského rozvoje země, zřízení nezávislých médií, zajištění bezplatného vysokoškolského vzdělání, podporu repatriace arménské diaspory, ochranu práv etnických menšin, podporuje koncepci Wilsonovské Arménie a sjednocení Artsachu s Arménií." # todo: NEW TRANSLATION
 arme.219.a: "Zajímavé." # todo: NEW TRANSLATION
 arme.220.t: "5165 Národní konzervativní hnutí" # todo: NEW TRANSLATION
 arme.220.d: "Strana 5165 Národní konzervativní hnutí byla nedávno založena a Karin Tonoyan byla zvolena předsedkyní strany. Číslo v názvu strany reprezentuje výšku hory Ararat. V podstatě tato strana sdružuje bývalé vojenské osoby, příbuzné vojáků a lidi, kteří podporují vojenský režim v Arménii." # todo: NEW TRANSLATION
 arme.220.a: "Zajímavé." # todo: NEW TRANSLATION
 arme.221.t: "Volba skutečného Bagratuni" # todo: NEW TRANSLATION
 arme.221.d: "Meliqská unie se sešla, aby zvolila nového panovníka – kdo jím bude?" # todo: CHANGED
 arme.221.a: "Roland von Bagratuni" # todo: NEW TRANSLATION
 arme.221.b: "Ter Ashot Bagratuni" # todo: NEW TRANSLATION
 arme.222.t: "[ARM.GetNamewithFlag] Přidá se k §GUnijnímu státu§!" # todo: NEW TRANSLATION
 arme.222.d: "Nedávno se rozhodl arménský prezident připojit k projektu Unie Státu a spojit se s námi a dalšími členskými státy!" # todo: NEW TRANSLATION
 arme.222.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.222.b: "O tuto unii nemáme zájem." # todo: NEW TRANSLATION
