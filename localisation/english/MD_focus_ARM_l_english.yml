 ARM_nor_aven_first: "Severní třída" # todo: NEW TRANSLATION
 ARM_nor_aven_first_desc: "Obnova Severní třídy v centru Jerevanu přináší modernizaci a obchod do srdce hlavního města a zvyšuje příliv investic a podnikatelské příležitosti v dotčeném státu." # todo: NEW TRANSLATION
 later_good_thing_tt: "Až budou §ROdebrány§! problémy s infrastrukturou v Jerevanu, získáme v Jerevanu zlepšení státní infrastruktury." # todo: CHANGED
 ARM_infr_problems_yerevan: "Infrastrukturní problémy v Jerevanu" # todo: NEW TRANSLATION
 ARM_infr_problems_yerevan_desc: "Obnova centra Jerevanu způsobuje dočasné komplikace: dopravní zácpy, přerušení obchodní činnosti a náklady na výstavbu zatěžují ekonomiku a služby hlavního města.\n§W--------------§!\nTento národní duch bude §ROdebrán§! po dokončení obnovy, čímž se zlepší státní infrastruktura v Jerevanu." # todo: CHANGED
 ARM_nor_aven_sec: "Starý Jerevan" # todo: NEW TRANSLATION
 ARM_nor_aven_sec_desc: "Zachování starého města Jerevanu přináší hlavnímu městu kulturní kontinuitu a turistický potenciál, udržuje charakter historického centra a zároveň otevírá nové hospodářské příležitosti.\n§W--------------§!\nTento modifikátor státu bude §ROdebrán§!, pokud budou vyřešeny Problémy s infrastrukturou v Jerevanu." # todo: NEW TRANSLATION
 norav_tt: "We Will Get §YVarious Options§! on What to Do With §YNorthern Avenue Project§!" # todo: NEW TRANSLATION
 rus_waits_tt: "Máme §Ydohodu§! se [SOV.GetNamewithFlag], že vyřešíme §Rdluhovou záležitost§! během §Yroku§!" # todo: NEW TRANSLATION
 first_assasin_tt: "§YDokončíme první fázi politických atentátů!§" # todo: NEW TRANSLATION
 second_assasin_tt: "§YDokončíme druhou fázi politických atentátů!§" # todo: NEW TRANSLATION
 arm_milit.1.t: "Arménie Žádá o licenci na pušku!" # todo: NEW TRANSLATION
 arm_milit.1.d: "Nedávno se na nás arménská vláda obrátila s žádostí o výrobní licenci na naše útočné pušky ve své zemi. Měli bychom tuto nabídku přijmout?" # todo: CHANGED
 arm_milit.1.a: "Kam podepsat?" # todo: NEW TRANSLATION
 arm_milit.1.b: "Ne, samozřejmě." # todo: NEW TRANSLATION
 arm_milit.2.t: "[FROM.GetNamewithFlag] Přijímá naši nabídku!" # todo: NEW TRANSLATION
 arm_milit.2.d: "[FROM.GetNamewithFlag] přijalo naši nabídku a poskytne nám veškeré dokumenty pro výrobu pušek." # todo: CHANGED
 arm_milit.2.a: "Skvělé." # todo: NEW TRANSLATION
 arm_milit.3.t: "[FROM.GetNamewithFlag] Odmítl naši nabídku!" # todo: NEW TRANSLATION
 arm_milit.3.d: "Odmítli naši nabídku a neposkytnou nám žádné dokumenty ani licenci k výrobě jejich pušek." # todo: NEW TRANSLATION
 arm_milit.3.a: "Bruh." # todo: NEW TRANSLATION
 arm_milit.4.t: "Nabídka Orsis" # todo: NEW TRANSLATION
 arm_milit.4.d: "Orsis, společnost vyrábějící vojenské zbraně, nabídla investici do našeho vojensko-průmyslového komplexu. Můžeme její návrh přijmout nebo tuto příležitost využít k politickým ziskům." # todo: CHANGED
 arm_milit.4.a: "Jistě, souhlasíme!" # todo: NEW TRANSLATION
 arm_milit.4.b: "Tvoje věci jsou na lov, ne vojenské použití!" # todo: NEW TRANSLATION
 arm_milit.5.t: "Armáda Artsachu je začleňována do naší" # todo: NEW TRANSLATION
 arm_milit.5.d: "Ozbrojené síly Republiky Artsakh přijímají opatření k integraci do naší armády, pro lepší interakci a spolupráci našich ozbrojených sil." # todo: NEW TRANSLATION
 arm_milit.5.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.4.t: "Vyšetřování útoku z roku 1999" # todo: NEW TRANSLATION
 arme.4.d: "Naše vláda zahájila oficiální vyšetřování parlamentního teroristického útoku z roku 1999. Aby nedošlo k příliš velkému rozruchu, případ vyšetřují polozávislí vyšetřovatelé. Uvidíme, na co přijdou." # todo: NEW TRANSLATION
 arme.4.a: "Ano, jistě..." # todo: NEW TRANSLATION
 arme.5.t: "Výsledky vyšetřování" # todo: NEW TRANSLATION
 arme.5.d: "Vyšetřovatelé nemohou najít skutečného objednavatele útoku, a všechny důkazy vedou jedním či druhým směrem k nám nebo k bývalým členům strany Dashnaktsutyun. V každém případě musíme uzavřít tento demonstrativní případ dříve, než to zajde příliš daleko. Ale co napíšeme ve zprávě?" # todo: NEW TRANSLATION
 arme.5.a: "Případ prostě uzavřete." # todo: NEW TRANSLATION
 arme.5.b: "Eh, obviňme Dashnaky!" # todo: NEW TRANSLATION
 arme.6.t: "[ARM.GetNamewithFlag] Žádá o investice!" # todo: NEW TRANSLATION
 arme.6.d: "Náš starý politický partner a přítel Robert Kocharyan nás žádá o investici do arménské ekonomiky v oboustranně výhodné dohodě. Měli bychom souhlasit?" # todo: CHANGED
 arme.6.a: "Jistě!" # todo: NEW TRANSLATION
 arme.6.b: "Promiň, tentokrát ne." # todo: NEW TRANSLATION
 arme.7.t: "[SOV.GetNamewithFlag] Souhlasí!" # todo: NEW TRANSLATION
 arme.7.d: "Díky našim dobrým vztahům s ruským politickým vedením souhlasili s investicí do naší ekonomiky a s výstavbou civilní továrny v naší zemi." # todo: CHANGED
 arme.7.a: "Úžasné!" # todo: NEW TRANSLATION
 arme.8.t: "[SOV.GetNamewithFlag] Odmítá!" # todo: NEW TRANSLATION
 arme.8.d: "Bohužel, Rusko nebylo přesvědčeno investovat do naší ekonomiky a podepsat dohodu." # todo: NEW TRANSLATION
 arme.8.a: "Jé." # todo: NEW TRANSLATION
 arme.9.t: "Projekt Severní třídy" # todo: NEW TRANSLATION
 arme.9.d: "Projekt Severní třídy je pěší bulvár, který musíme vybudovat, abychom přilákali investice a případně získali velký příjem. Otázkou však je, co udělat se starými budovami a jejich obyvateli?" # todo: NEW TRANSLATION
 arme.9.a: "Částečně nahradit ztráty" # todo: NEW TRANSLATION
 arme.9.b: "Úplně nahradit ztráty" # todo: NEW TRANSLATION
 arme.9.c: "Zrekonstruovat staré historické budovy" # todo: NEW TRANSLATION
 arme.10.t: "Majetek pro dohodu o dluhu" # todo: NEW TRANSLATION
 arme.10.d: "Arménie souhlasila poskytnout majetek výměnou za prominutí státních dluhů. Arménie byla jedinou zemí, jejíž státní dluhy jsme neodpustili pro budoucí tlak a to hrálo svou roli." # todo: NEW TRANSLATION
 arme.10.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.11.t: "Útočník Poghos Poghosyan!" # todo: NEW TRANSLATION
 arme.11.d: "Po nedávném setkání Roberta Kocharyana s Poghosem Poghosyanem byl Poghos Poghosyan zlikvidován. Strana Dašnakcutjun bude nejspíš zuřit. Musíme se rozhodnout, co s ní uděláme." # todo: CHANGED
 arme.11.a: "Přibližme si loajální." # todo: CHANGED
 arme.11.b: "Jsou k ničemu." # todo: NEW TRANSLATION
 arme.13.t: "Opozice oslabena!" # todo: NEW TRANSLATION
 arme.13.d: "Opoziční organizace a neloajální byrokraté byli z naší země očištěni a opozice byla výrazně oslabena, což je v naší situaci velmi užitečné. Kocharyanova vláda je prozatím prodloužena." # todo: CHANGED
 arme.13.a: "Velmi dobře." # todo: CHANGED
 arme.14.t: "[ARM.GetNamewithFlag] se připojuje k §GUnion State§!" # todo: NEW TRANSLATION
 arme.14.d: "Nedávno se arménský prezident Robert Kocharyan rozhodl připojit k projektu §GUnion State§ a spojit se s námi a s ostatními členskými státy!" # todo: NEW TRANSLATION
 arme.14.a: "Skvělé!" # todo: NEW TRANSLATION
 arme.14.b: "O tuto unii nemáme zájem." # todo: NEW TRANSLATION
 koch_union_stat_tt: "[ARM.GetNamewithFlag] se připojí k §GUnion State§!" # todo: NEW TRANSLATION
 arme.15.t: "Opozice získává podporu!" # todo: NEW TRANSLATION
 arme.15.d: "Kvůli nečinnosti Kocharyanovy vlády zvýšila opozice svou podporu mezi obyvatelstvem a více se sjednotila." # todo: CHANGED
 arme.15.a: "Sakra!" # todo: NEW TRANSLATION
 ARM_triump_revolution_barhat: "Triumf sametové revoluce" # todo: CHANGED
 ARM_triump_revolution_barhat_desc: "Nikol Pašinjan uchvátil moc v Arménii na vlně sametové revoluce." # todo: CHANGED
 ARM_Pashik_misters_loc1: "Přesvědčování pana P" # todo: NEW TRANSLATION
 ARM_Pashik_misters_loc2: "Přesvědčování pana J" # todo: NEW TRANSLATION
 ARM_Pashik_misters_loc3: "Přesvědčování pana N" # todo: NEW TRANSLATION
 ARM_Pashik_misters_loc4: "Přesvědčování pana Z" # todo: NEW TRANSLATION
 ARM_Pashik_misters_loc5: "Přesvědčování pana L" # todo: NEW TRANSLATION
 ARM_Pashik_misters_loc6: "Přesvědčování pana P" # todo: NEW TRANSLATION
 ARM_mister_p: "[ARM_Pashik_misters_loc]" # todo: NEW TRANSLATION
 ARM_mister_p_desc: "Musíme se setkat s ruským prezidentem, abychom posílili naše vztahy a přesvědčili ho, že nejsme proti němu." # todo: NEW TRANSLATION
 ARM_crackdown_on_corruption: "Zásah proti korupci" # todo: NEW TRANSLATION
 ARM_crackdown_on_corruption_desc: "\"Už žádné úplatky, žádné monopolní praktiky, lidská práva budou chráněna a vláda práva bude panovat!\" – prohlásil Nikol Pashinyan ve svém projevu předtím, než arménský parlament ho zvolil za nového premiéra země." # todo: NEW TRANSLATION
 ARM_exit_problems: "Konec problémů" # todo: NEW TRANSLATION
 ARM_exit_problems_desc: "Naše nová agenda je konec problémů. Jsme stranou změn!" # todo: NEW TRANSLATION
 ARM_educ_curicullum: "Nový vzdělávací program" # todo: NEW TRANSLATION
 ARM_educ_curicullum_desc: "Vzdělávání musí být změněno v naší nové éře. Musíme zajistit, aby veškeré vzdělávání sloužilo našim novým ideologickým preferencím." # todo: NEW TRANSLATION
 ARM_renew_view_hist: "Obnovit pohled na arménskou historii" # todo: NEW TRANSLATION
 ARM_renew_view_hist_desc: "Pohled na arménskou historii musí být přepracován podle představ našeho vůdce. Svět se skládá z různých perspektiv a je naší povinností je změnit." # todo: NEW TRANSLATION
 ARM_irrecons_contr: "Řešit neřešitelné rozpory" # todo: NEW TRANSLATION
 ARM_irrecons_contr_desc: "V naší ústavě existuje mnoho rozporů mezi liberalismem a nacionalismem. Musíme je řešit a změnit ústavu." # todo: NEW TRANSLATION
 ARM_gather_loyalists: "Shromáždit loajální stoupence" # todo: NEW TRANSLATION
 ARM_gather_loyalists_desc: "Musíme shromáždit všechny loajalisty v naší straně a dosadit je na příslušná ministerská místa. Prokletí technokraté jsou politicky tak neloajální, že by se mohli stát problémem v našem správním aparátu." # todo: CHANGED
 ARM_investig_clique: "Vyšetřovat kliku" # todo: NEW TRANSLATION
 ARM_investig_clique_desc: "SerzhoRob-ian kliku je třeba vyšetřit, aby bylo možné konečně očistit naši zemi od krve represií a korupce." # todo: NEW TRANSLATION
 ARM_change_gov_structure: "Změna vládní struktury" # todo: NEW TRANSLATION
 ARM_change_gov_structure_desc: "Naše vládní struktura už neodpovídá tomu, jak věci fungují efektivně. Musíme to změnit." # todo: NEW TRANSLATION
 ARM_social_media_prop: "Propaganda na sociálních médiích" # todo: NEW TRANSLATION
 ARM_social_media_prop_desc: "Abychom přesvědčili obyvatele, že máme pravdu, náš vůdce musí být neustále v informační sféře našich občanů; každý Armén bude číst a sledovat našeho skvělého národního vůdce, blízkého lidem." # todo: NEW TRANSLATION
 ARM_hijack_nat_voters: "Ovládnutí nacionalistických voličů" # todo: NEW TRANSLATION
 ARM_hijack_nat_voters_desc: "Abychom zvýšili podporu pro našeho premiéra, musíme oslovit masy, včetně radikální pravice." # todo: NEW TRANSLATION
 ARM_era_of_peace: "Éra míru" # todo: NEW TRANSLATION
 ARM_era_of_peace_desc: "Naše nová doktrína je mír, ne válka! Musíme zapomenout na to, co se stalo v roce 1915 a v 90. letech. Nyní jsme novou zemí." # todo: NEW TRANSLATION
 ARM_police_guard: "Policijní stráž" # todo: NEW TRANSLATION
 ARM_police_guard_desc: "Máme v úmyslu vytvořit z policejních sil samostatnou jednotku. Policejní garda bude působit výhradně v rámci civilního vymáhání práva a nebude se účastnit bojových operací." # todo: CHANGED
 ARM_csto_dilemm: "Postoj vůči CSTO?" # todo: NEW TRANSLATION
 ARM_csto_dilemm_desc: "Musíme rozhodnout, jaký postoj zaujmeme k CSTO. Měli bychom odejít, nebo posílit naše vazby?" # todo: NEW TRANSLATION
 ARM_anti_belarus_rhetoric: "Rétorika proti Bělorusku" # todo: NEW TRANSLATION
 ARM_anti_belarus_rhetoric_desc: "Bělorusko dlouhodobě podporuje ázerbájdžánská zvěrstva. Musíme na to reagovat!" # todo: CHANGED
 ARM_NGO_friend: "Navázat přátelské styky s neziskovými organizacemi" # todo: NEW TRANSLATION
 ARM_NGO_friend_desc: "Naše nová, mladá demokracie potřebuje spojence. Neziskové organizace se pro tuto roli hodí dokonale!" # todo: NEW TRANSLATION
 ARM_you_are_that_one_man: "'A ty jsi ten jeden muž'" # todo: NEW TRANSLATION
 ARM_you_are_that_one_man_desc: "Nikol Pashinyan je muž lidu! Ví, co lidé potřebují a oni zase nesou odpovědnost za každé volby. Ty jsi ten jeden muž, který rozhoduje o osudu Arménie!" # todo: NEW TRANSLATION
 ARM_i_am_that_one_man: "'A já jsem ten jeden muž'" # todo: NEW TRANSLATION
 ARM_i_am_that_one_man_desc: "Nikol Pashinyan je vyvolený! Nejen volbami, ale i Bohem. Volba lidí nakonec odráží kosmické uspořádání moci, které přivedlo Nikol, našeho vůdce, k moci." # todo: NEW TRANSLATION
 ARM_armenia_pashik_idea: "Pashinyan's Armenia" # todo: NEW TRANSLATION
 ARM_armenia_pashik_idea_desc: "Vláda Nikola Pašinjana po Sametové revoluci v roce 2018 přijala občanskou společnost, decentralizaci a demokratické normy. Jeho administrativa se posunula směrem k západním institucím a občanským svobodám, což znamenalo ostrý odklon od desetiletí oligarchického vládnutí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 ARM_loyalists_in_government: "Loajální stoupenci ve vládě" # todo: NEW TRANSLATION
 ARM_loyalists_in_government_desc: "Pašinjan si ve státních institucích vybudoval politickou základnu a jmenoval reformně smýšlející úředníky a technokraty sympatizující s jeho programem. Tato síť loajalistů poskytovala zásadní podporu během prvních let upevňování moci, kdy odpor starých mocenských struktur zůstával silný.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 ARM_armenian_soc_media_prop_idea: "Propaganda na sociálních médiích" # todo: NEW TRANSLATION
 ARM_armenian_soc_media_prop_idea_desc: "Pašinjanova vláda využívala sociální média k obcházení tradičních médií kontrolovaných oligarchy a přímo oslovovala občany na Facebooku, Instagramu a Telegramu. Tento moderní propagandistický aparát posiloval jeho obraz lidového vůdce a obcházel institucionální odpor k jeho reformám.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HNikol Pašinjan§!." # todo: NEW TRANSLATION
 ARM_pashinyan_anti_corrupt_idea: "Politika boje proti korupci" # todo: NEW TRANSLATION
 ARM_pashinyan_anti_corrupt_idea_desc: "Boj proti korupci se stal Pašinjanovou charakteristickou politikou a osobní značkou, včetně zatýkání a stíhání oligarchů předchozích režimů. Jeho vláda vytvořila nové protikorupční orgány a mechanismy stíhání, ačkoli kritici tvrdili, že prosazování zůstává selektivní a politicky motivované.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HNikol Pašinjan§!." # todo: NEW TRANSLATION
 ARM_education_reforms: "Vzdělávací reformy" # todo: NEW TRANSLATION
 ARM_education_reforms_desc: "Pašinjan upřednostnil modernizaci arménského vzdělávacího systému, zvýšení platů učitelů a zavedení nových osnov odpovídajících demokratickým hodnotám. Reforma vzdělávání symbolizovala odklon od mechanického učení sovětské éry a připravila mladší generaci na úlohy v občanské společnosti.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 ARM_true_pashik_democracy: "Kavkazský bastion demokracie" # todo: NEW TRANSLATION
 ARM_true_pashik_democracy_desc: "Pašinjanova vize demokracie zdůrazňovala transparentní instituce, nezávislá média a pluralitní debatu, což představovalo výrazný kontrast k neprůhledné oligarchii 90. let. Fráze „Pašikova demokracie“ vystihovala jeho příslib skutečně zastupitelského vládnutí a odpovědnosti.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 ARM_controlled_democracy: "Kontrolovaná demokracie" # todo: NEW TRANSLATION
 ARM_controlled_democracy_desc: "Ačkoli Pašinjanova vláda rozvíjela občanské svobody, zachovala významnou státní kontrolu nad klíčovými institucemi, citlivými sektory a politickými výsledky. Tato rovnováha mezi demokratickým zdáním a výkonnou mocí se ukázala jako pragmatická při zvládání arménské rozštěpené oligarchie a regionálního napětí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 ARM_new_era_of_peace_idea: "Éra míru" # todo: NEW TRANSLATION
 ARM_new_era_of_peace_idea_desc: "Po letech konfliktu Pašinjan zpočátku prosazoval dialog a deeskalaci s Ázerbájdžánem a Tureckem a zdůrazňoval hospodářskou spolupráci namísto vojenské konfrontace. Jeho vláda usilovala o vyjednávání o sporu kolem Náhorního Karabachu prostřednictvím mezinárodního zprostředkování.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 ARM_support_of_ngo_idea: "Podpora neziskových organizací" # todo: NEW TRANSLATION
 ARM_support_of_ngo_idea_desc: "Pašinjanova vláda posílila vztahy s mezinárodními nevládními organizacemi a občanskými sdruženími a vítala jejich dohled nad správou a lidskými právy. Toto partnerství posílilo demokratický obraz Arménie a zajistilo zahraniční pomoc navázanou na reformy dobrého vládnutí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 arm_pashinyan.1.t: "[ARM_Pashik_misters_loc]" # todo: NEW TRANSLATION
 arm_pashinyan.1.d: "[ARM.GetNamewithFlag] vláda tvrdí, že jejich liberální vláda nám neohrožuje a souhlasí s další spoluprací" # todo: NEW TRANSLATION
 arm_pashinyan.1.a: "OK, Souhlasím" # todo: NEW TRANSLATION
 arm_pashinyan.1.b: "Ne" # todo: NEW TRANSLATION
 arm_pashinyan.2.t: "[SOV.GetNamewithFlag] nám důvěřuje" # todo: NEW TRANSLATION
 arm_pashinyan.2.d: "[FROM.GetNameWithFlag] přijal naši pozici a také nám potvrdil, že nás nevidí jako jejich nepřítele" # todo: NEW TRANSLATION
 arm_pashinyan.2.a: "Dobře" # todo: NEW TRANSLATION
 arm_pashinyan.3.t: "[SOV.GetNamewithFlag] nám nedůvěřuje" # todo: NEW TRANSLATION
 arm_pashinyan.3.d: "[FROM.GetNameWithFlag] řekl, že naše zahraniční politika je pro ně hrozbou, a naše snaha změnit jejich názory je jen záminka pro naši spolupráci s nepřáteli [SOV.GetNamewithFlag]" # todo: NEW TRANSLATION
 arm_pashinyan.3.a: "Špatné" # todo: NEW TRANSLATION
 arm_pashinyan.5.t: "Lidé nás podporují" # todo: NEW TRANSLATION
 arm_pashinyan.5.d: "Před dvěma lety jsme slíbili zlepšit život našich občanů a splnili jsme to. Nyní nás lidé plně podporují" # todo: NEW TRANSLATION
 arm_pashinyan.5.a: "Dobře" # todo: NEW TRANSLATION
 arm_pashinyan.6.t: "Pamatují si na naše sliby?" # todo: NEW TRANSLATION
 arm_pashinyan.6.d: "Nečekaně si lidé zapamatovali naše slova, že zlepšíme jejich životní úroveň. Nyní stačí tuto chybu odůvodnit jinými důvody." # todo: NEW TRANSLATION
 arm_pashinyan.6.a: "Mysleli jsme si, že nebudeme muset utrácet příliš mnoho peněz..." # todo: NEW TRANSLATION
 arm_pashinyan.7.t: "Kontroverze v ústavě" # todo: NEW TRANSLATION
 arm_pashinyan.7.d: "V naší ústavě je několik protichůdných článků, které nám znemožňují navázat normální diplomatické vztahy s našimi sousedy" # todo: NEW TRANSLATION
 arm_pashinyan.7.a: "Dobře" # todo: NEW TRANSLATION
 arm_pashinyan.8.t: "Soutěžící o moc" # todo: NEW TRANSLATION
 arm_pashinyan.8.d: "Serž Sargsjan a Robert Kocharyan ohrožují naši moc, protože se mohou vrátit k moci. Musíme podkopat jejich autoritu." # todo: CHANGED
 arm_pashinyan.8.a: "Proveďte plné vyšetřování" # todo: NEW TRANSLATION
 arm_pashinyan.8.b: "Stačí prosté politické pomluvy" # todo: NEW TRANSLATION
 arm_pashinyan.9.t: "Otázka politického systému" # todo: NEW TRANSLATION
 arm_pashinyan.9.d: "Nyní, když náš politický program dosáhl většiny svých cílů, musíme rozhodnout, jak půjdeme vpřed do budoucna. Můžeme nadále dodržovat demokratické principy, nebo trochu omezit politické svobody" # todo: NEW TRANSLATION
 arm_pashinyan.9.a: "Nesmíme ztratit kontrolu" # todo: NEW TRANSLATION
 arm_pashinyan.9.b: "Slíbili jsme lidem demokracii, budeme jí dodržovat" # todo: NEW TRANSLATION
 arm_pashinyan.10.t: "Proslov proti Bělorusku v parlamentu" # todo: NEW TRANSLATION
 arm_pashinyan.10.d: "\"Od nyní prohlašuji, že už nikdy nepůjdu do Běloruska. Dokud bude v Bělorusku prezident Alexander Lukashenko. A obecně prohlašuji, že od nynějška žádný oficiální zástupce Arménie nepůjde do Běloruska. Vůbec.\"" # todo: NEW TRANSLATION
 arm_pashinyan.10.a: "Nenávidím brambory" # todo: NEW TRANSLATION
 arme.35.t: "Dilema CSTO" # todo: NEW TRANSLATION
 arme.35.d: "CSTO se ukázalo být neúčinné pro naši zemi, neboť naši nominalní spojenci nám odmítají pomoci proti Azerbajdžáncům, kteří neustále porušují naši územní integritu. Musíme se rozhodnout, co uděláme se svým postavením v CSTO." # todo: NEW TRANSLATION
 arme.35.a: "Roztrhejte papíry a sbohem!" # todo: NEW TRANSLATION
 arme.35.b: "Možná bychom měli zmrazit členství." # todo: NEW TRANSLATION
 arme.36.t: "[ARM.GetNameWithFlag] opouští CSTO!" # todo: NEW TRANSLATION
 arme.36.d: "Nedávno arménská strana oznámila, že chce opustit CSTO a momentálně připravuje dokumentaci pro plnohodnotný odchod ze sdružení. To výrazně ovlivní náš vliv v regionu." # todo: NEW TRANSLATION
 arme.36.a: "Val se jako špekáček!" # todo: NEW TRANSLATION
 arme.37.t: "[ARM.GetNameWithFlag] zmrazí členství CSTO!" # todo: NEW TRANSLATION
 arme.37.d: "Nedávno arménská strana oznámila, že chce zmrazit členství v CSTO, ale neorganizuje dokumentaci pro plný odchod ze sdružení. Možná jde o politické rozhodnutí zaměřené na vnitřní politiku jejich země." # todo: NEW TRANSLATION
 arme.37.a: "Cože?" # todo: NEW TRANSLATION
