 ARM_Tsarukyan: "Carukjan" # todo: CHANGED
 ARM_Tsarukyan_desc: "Gagik Tsarukyan je arménský podnikatel, politik a bývalý sportovec. Tsarukyan je zakladatelem a vůdcem politické strany Prosperous Armenia. Vlastní také řadu velkých podniků a předpokládá se, že je jedním z nejbohatších mužů v Arménii." # todo: NEW TRANSLATION
 ARM_patriotism: "Patriotismus" # todo: NEW TRANSLATION
 ARM_patriotism_desc: "Arménský patriotismus je abstraktní. Mnozí hledají svůj domov v oblacích, v mystické mlze, ale je tak blízko a tak je potřeba naší pozornosti, oddanosti, obdivu. Pro mnohé je Arménie jen nápad, amnézie, Zión, oltář. Arménie potřebuje konkrétní a živý patriotismus. Vlast je pro člověka, ne člověk pro vlast." # todo: NEW TRANSLATION
 ARM_berkut: "Kde je naše Berkut?" # todo: NEW TRANSLATION
 ARM_berkut_desc: "Arménská soukromá bezpečnostní společnost Berkut, překvapivě, byla vždy vysoce vybavená jednotka složená z bývalých kriminálních postav a bývalého vojska. Možná stojí za to ji přenést na úroveň státu." # todo: NEW TRANSLATION
 ARM_hard_way: "Tvrdá cesta" # todo: NEW TRANSLATION
 ARM_hard_way_desc: "Pokud někdo nebude chtít poslouchat novou vládu, donutíme ho. Budeme muset jít tvrdou cestou a odebírat podniky nepoddajným disidentům." # todo: CHANGED
 ARM_Group: "Vláda Multi Group" # todo: NEW TRANSLATION
 ARM_Group_desc: "Skupina Multi Group byla založena v roce 1998 na iniciativu Gagika Tsarukyana. Proces rozvoje a intenzivní činnosti konglomerátu začal v roce 2001, kdy byl konglomerát vytvořen a do něj bylo zapojeno mnoho velkých firem. Konglomerát se pravidelně řadí mezi top desítku největších plátců daní Arménie." # todo: NEW TRANSLATION
 ARM_olympic_comitee: "Olympijský výbor" # todo: NEW TRANSLATION
 ARM_olympic_comitee_desc: "Musíme posílit a podpořit Olympijský výbor ve všech možných ohledech. Gagik Tsarukyan je sám sportovec a nemůže stát stranou." # todo: NEW TRANSLATION
 ARM_buy_small_business: "Odkoupit je" # todo: NEW TRANSLATION
 ARM_buy_small_business_desc: "Musíme odkoupit veškeré malé podniky z rukou prostřední třídy spekulantů. Musíme udělat tento krok, abychom dosáhli korporatokracie." # todo: NEW TRANSLATION
 ARM_pooling_capital: "Seskupení kapitálu" # todo: NEW TRANSLATION
 ARM_pooling_capital_desc: "Je na čase spojit veškerý kapitál a získat z toho dobrý prospěch." # todo: NEW TRANSLATION
 ARM_tsaruk_trde: "Tsarukyanův obchod" # todo: NEW TRANSLATION
 ARM_tsaruk_trde_desc: "Tsarukyan je velmi zkušený obchodník. Možná bychom měli tuto podnikatelskou činnost státně ovládnout." # todo: NEW TRANSLATION
 ARM_remove_competitors: "Odstranění konkurentů" # todo: NEW TRANSLATION
 ARM_remove_competitors_desc: "Jediný Tsarukyan může podnikat v Arménii. Je to jeho říše a ostatní oligarchové buď musí poslouchat, nebo jinak." # todo: NEW TRANSLATION
 ARM_utilize_assets: "Využívání našich aktiv" # todo: NEW TRANSLATION
 ARM_utilize_assets_desc: "Musíme využít vše, co máme v naší zemi, abychom zvýšili naše příjmy, i kdyby to znamenalo vynaložit více úsilí ve všech oblastech ekonomiky." # todo: NEW TRANSLATION
 ARM_statue_of_christ: "Nová socha Krista" # todo: NEW TRANSLATION
 ARM_statue_of_christ_desc: "Tsarukyan je velice zbožný křesťan. Chce postavit novou sochu Ježíše Krista. To je skvělý nápad!" # todo: NEW TRANSLATION
 ARM_sports_promotion: "Rozvoj sportu" # todo: NEW TRANSLATION
 ARM_sports_promotion_desc: "Musíme rozvíjet naše sporty a šířit je všude, kde jen můžeme!" # todo: NEW TRANSLATION
 ARM_sport_youth: "Sportovní mládež" # todo: NEW TRANSLATION
 ARM_sport_youth_desc: "Všichni mladí lidé v Arménii musí být sportovní, silní a zdraví! To je náš konečný cíl." # todo: NEW TRANSLATION
 ARM_bet_culture: "Přijmout kulturu sázek" # todo: NEW TRANSLATION
 ARM_bet_culture_desc: "Mnoho Arménů rádo pije pivo a sází na sporty. Musíme tuto kulturu podporovat! Co na tom?" # todo: NEW TRANSLATION
 ARM_support_peasants: "Podpora venkovského obyvatelstva" # todo: NEW TRANSLATION
 ARM_support_peasants_desc: "Celé venkovské obyvatelstvo musí být podporováno. Tsarukyan sám pochází z venkovského prostředí a zná potíže obyčejných lidí." # todo: NEW TRANSLATION
 ARM_befr_mafia: "Přátelit se s mafií" # todo: NEW TRANSLATION
 ARM_befr_mafia_desc: "Spřátelení s mafií by mohlo z dlouhodobého hlediska sloužit našim politickým cílům a proměnit její sítě v nástroj státní moci." # todo: CHANGED
 ARM_monopoly: "Plná korporatokracie" # todo: NEW TRANSLATION
 ARM_monopoly_desc: "Nyní musí skupina Multi Group ovládat veškeré vládní struktury. To je skvělý nápad!" # todo: NEW TRANSLATION
 ARM_freedom_for_pes: "Svoboda pro rolníky" # todo: NEW TRANSLATION
 ARM_freedom_for_pes_desc: "Musíme se zdržet zasahování do malých podniků zemědělské produkce. Musíme jim dát určitou svobodu." # todo: NEW TRANSLATION
 ARM_hire_pmc_wagner: "Najmout PMC Wagner" # todo: NEW TRANSLATION
 ARM_hire_pmc_wagner_desc: "Válka kráčí našimi lesy a my nebudeme šetřit na obranu vlasti, hodláme vyhledat pomoc od Ruska a jeho proslulých PMCs, abychom odrazili nepřátelský útok." # todo: NEW TRANSLATION
 ARM_create_pmc: "PMC Zlatí Lví Válečníci" # todo: NEW TRANSLATION
 ARM_create_pmc_desc: "Také potřebujeme vytvořit naši vlastní soukromou vojenskou společnost, která bude chránit zájmy naší země za slušný honorář, který jí rozhodně poskytneme." # todo: NEW TRANSLATION
 ARM_sport_development: "Sportovní národ" # todo: NEW TRANSLATION
 ARM_sport_development_desc: "Arménie systematicky investuje do sportovní infrastruktury, tréninkových akademií a závodního sportu s cílem pěstovat národní hrdost a mezinárodní prestiž. Úspěchy v olympijských sportech a regionálních soutěžích ukazují světu arménskou výjimečnost, budují měkkou moc a sjednocují společnost kolem společných národních úspěchů.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jakmile dokončíme fokus §HRozvoj sportu§!." # todo: NEW TRANSLATION
 ARM_berkut_troops: "Berkut" # todo: NEW TRANSLATION
 ARM_berkut_troops_desc: "Berkut, Zlatý orel, je elitní jednotka pro potlačování nepokojů a boj proti terorismu nasazovaná oligarchickými zájmy k potlačování stávek, odborového organizování a občanských nepokojů. Její přítomnost odráží ochotu oligarchů použít sílu k ochraně svých hospodářských monopolů před lidovou výzvou.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální oligarchové§! ztratí moc." # todo: NEW TRANSLATION
 ARM_farmercracy: "Agrarianismus" # todo: NEW TRANSLATION
 ARM_farmercracy_desc: "Arménští oligarchové udržují hospodářskou kontrolu prostřednictvím zemědělských monopolů: ovládají ceny obilí, exportní kanály a držbu půdy. Politické strany podporované oligarchy prosazují zemědělskou ochranu, která udržuje arménský venkov závislý na jejich patronátních sítích a volební podpoře.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální oligarchové§! ztratí moc." # todo: NEW TRANSLATION
 ARM_corporatocracy: "Korporatokracie" # todo: NEW TRANSLATION
 ARM_corporatocracy_desc: "Vláda oligarchů a jejich korporátních zástupců: státní podniky jsou neformálně kontrolovány mocnými oligarchy, vládní zakázky proudí k jejich spojencům a státní politika je formována jejich hospodářskými zájmy, nikoli veřejným blahem. Oligarchové si státní aparát fakticky koupili.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální oligarchové§! ztratí moc." # todo: NEW TRANSLATION
 ARM_unstable_government_idea: "Nestabilní vláda" # todo: NEW TRANSLATION
 arme.73.t: "Socha Krista v Arménii" # todo: NEW TRANSLATION
 arme.73.d: "Naše velkolepé náboženské dílo, socha Ježíše Krista, bylo dokončeno. Nyní má Arménie svou vlastní tvář Krista na svém území, křesťané po celém světě nás obdivují." # todo: NEW TRANSLATION
 arme.73.a: "S Boží pomocí" # todo: NEW TRANSLATION
 ARM_Demirchyan: "Arménská lidová strana" # todo: CHANGED
 ARM_Demirchyan_desc: "Lidová strana Arménie (v arménštině Hayastani Zhoghovrdakan Kusaktsutyun) je socialistická politická strana v Arménii. Byla založena sovětskou a arménskou stranou a státníkem Karenem Demirchyanem, který sloužil jako první tajemník Komunistické strany Arménie v letech 1974–1988. Nyní má straně na starosti jeho syn Stepan Demirchyan." # todo: NEW TRANSLATION
 ARM_strat_technocrats: "Podporovat technokraty" # todo: NEW TRANSLATION
 ARM_strat_technocrats_desc: "Aby byla Arménie taková, jakou ji chceme, musíme provést rozsáhlou reformu vlády a kabinetu ministrů, odstranit staré loajální stoupence minulého vládnutí a nahradit je novými mladými profesionály." # todo: NEW TRANSLATION
 ARM_reindustr_country: "Zpět k 'Obnovit'" # todo: NEW TRANSLATION
 ARM_reindustr_country_desc: "Špinavý Gorbačov, který zahájil svou perestrojku, zničil naši zemi, pohrdal ji a nechal ji v ruinách. Je na čase znovu vybudovat socialistický systém a na dlouho zapomenout na tyto strašné poslední dny SSSR." # todo: NEW TRANSLATION
 ARM_demirch_gamble: "Stepanova sázka" # todo: NEW TRANSLATION
 ARM_demirch_gamble_desc: "Navzdory Stepanovým socialistickým názorům by bylo politicky prospěšné spojit se s jednou z dalších stran, které mají stejné zahraničně politické cíle jako my." # todo: NEW TRANSLATION
 ARM_legacy_of_father: "Dědictví otce" # todo: NEW TRANSLATION
 ARM_legacy_of_father_desc: "Máme jen jeden slogan, jedno motto: každý, kdo pracuje, má právo užívat si výhod života. Parazité, parazité, sát krev ze pracujících, musí být zbaveni těchto výhod. A hlásáme: každý – dělníkům, každý – dělníkům!" # todo: NEW TRANSLATION
 ARM_mobilization_of_economy: "Mobilizace ekonomiky" # todo: NEW TRANSLATION
 ARM_mobilization_of_economy_desc: "Abychom znovu vybudovali zemi, je nutné mobilizovat ekonomiku a využít veškeré naše zdroje k trojnásobnému nárůstu ekonomických ukazatelů." # todo: NEW TRANSLATION
 ARM_iron_fisting_oligs: "Drtící oligarchii" # todo: NEW TRANSLATION
 ARM_iron_fisting_oligs_desc: "Musíme zajistit, aby bandité z 90. let už nad touto zemí a ekonomikou nekontrolovali." # todo: NEW TRANSLATION
 ARM_socialism_with_human_face: "Socialismus s lidskou tváří" # todo: NEW TRANSLATION
 ARM_socialism_with_human_face_desc: "Náboženství a socialismus si vůbec neodporují. Dokonce i sovětská vláda během své existence arménskou církev povolovala. Nesmíme s církví bojovat, ale sjednotit se s ní!" # todo: CHANGED
 ARM_coalition_with_vazgen_supporters: "Koalice s Vazgenovými stoupenci" # todo: NEW TRANSLATION
 ARM_coalition_with_vazgen_supporters_desc: "Útok na parlament v roce 1999 byl konkrétně zaměřen na to, aby se k moci dostali Yerkrapah a Arménská lidová strana. Vazgen Sargsyan a Karen Demirchyan byli během tohoto útoku zavražděni. Musíme se znovu sloučit pro prosperitu naší země!" # todo: NEW TRANSLATION
 ARM_remember_shaumian: "Šaumjanova strategie" # todo: NEW TRANSLATION
 ARM_remember_shaumian_desc: "Šaumjan byl výrazným příkladem spojení arménského nacionalismu a bolševismu ve službě dělnické třídě a národní soudržnosti. Musíme pokračovat v jeho odkazu." # todo: CHANGED
 ARM_euro_dilemma: "Evropská dilema" # todo: NEW TRANSLATION
 ARM_euro_dilemma_desc: "Musíme konečně rozhodnout o našem postoji k Evropské unii. Jsme poměrně nakloněni EU, avšak naše geopolitická situace nás může vést k odlišnému postoji." # todo: NEW TRANSLATION
 ARM_rebuilding_initiative: "Iniciativa obnovy" # todo: NEW TRANSLATION
 ARM_rebuilding_initiative_desc: "Lenin rozuměl tomu, že oživení kapitalismu nebylo pro RSFSR bezpečné, ale považoval ho za přijatelné, protože otázkou byla míra. A tuto míru stanovily samy sověty. To umožnilo regulovat růst kapitalistického sektoru ekonomiky: \"Abychom udrželi cestu ke socialismu, dáváme rolníkům řadu ústupků v rámci hranic, které si sami určíme.\"" # todo: NEW TRANSLATION
 ARM_sov_legacy_cond_dec: "Potrestání sovětských rozhodnutí" # todo: NEW TRANSLATION
 ARM_sov_legacy_cond_dec_desc: "Uplynulo celé století od vzniku Transkavkazské republiky. Rozervaná nacionalismem se rozdělila do tří států. Musíme zapomenout na národní a historické rozdíly a pomoci našim sousedům svrhnout buržoazní moc a nastolit diktaturu proletariátu!" # todo: NEW TRANSLATION
 ARM_invite_asala: "Červená expanze" # todo: NEW TRANSLATION
 ARM_invite_asala_desc: "Arménská tajná armáda za osvobození Arménie (ASALA) byla marxisticko-leninský ozbrojený útvar aktivní mezi lety 1975 a 1990s, jehož cílem bylo donutit tureckou vládu, aby veřejně připustila odpovědnost za arménský genocidu v roce 1915, zaplatila reparace a postoupila území pro arménské území. ASALA sama a jiné zdroje ji popsaly jako guerillovou a ozbrojenou organizaci. Měli bychom následovat její kroky." # todo: NEW TRANSLATION
 ARM_workers_soldiers: "Dělníci a vojáci" # todo: NEW TRANSLATION
 ARM_workers_soldiers_desc: "Nemůžeme oddělovat naši identitu, naši touhu po národní spravedlnosti od naší hospodářské politiky. Jsme zemí Arménů, jsme zemí dělníků a vojáků!" # todo: NEW TRANSLATION
 ARM_support_patriotic_movement: "Podpora patriotského hnutí" # todo: NEW TRANSLATION
 ARM_support_patriotic_movement_desc: "Musíme podpořit všechna patriotická hnutí, která neusilují o obnovení nekontrolované kapitalismu v naší zemi." # todo: NEW TRANSLATION
 ARM_legacy_of_father_idea: "Odkaz Otce" # todo: NEW TRANSLATION
 ARM_legacy_of_father_idea_desc: "Demirchyanův odkaz vůdce komunistické strany spočíval v podpoře průmyslových dělníků a sovětských vojáků, které považoval za páteř arménského rozvoje. Tato úroveň představuje základní přitažlivost jeho technokratického socialistického modelu pro dělnickou třídu.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jakmile dokončíme fokus §Dělníci a vojáci§!." # todo: NEW TRANSLATION
 ARM_legacy_of_father_two_idea: "Odkaz Otce" # todo: NEW TRANSLATION
 ARM_legacy_of_father_two_idea_desc: "Demirchyanova vize rozvoje sovětské Arménie zdůrazňovala kulturní autonomii v rámci řízeného socialistického státu a vyvažovala národní identitu s proletářským internacionalismem. Tato úroveň představuje prohloubený závazek k technokratickému vládnutí a sovětskému institucionálnímu dědictví.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jakmile dokončíme fokus §Odsouzení sovětských rozhodnutí§!." # todo: NEW TRANSLATION
 ARM_legacy_of_father_three_idea: "Odkaz Otce" # todo: NEW TRANSLATION
 ARM_legacy_of_father_three_idea_desc: "Demirchyanův důraz na strategické technokraty, tedy ekonomy, inženýry a administrátory, jako nezbytné pro národní modernizaci, se v pozdní fázi jeho kariéry stal základem jeho filozofie vládnutí. Tato úroveň představuje vzestup odbornosti a meritokratických principů nad patronátními sítěmi.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jakmile dokončíme fokus §HPodpora technokratů§!." # todo: NEW TRANSLATION
 ARM_legacy_of_father_four_idea: "Odkaz Otce" # todo: NEW TRANSLATION
 ARM_legacy_of_father_four_idea_desc: "Konečné uskutečnění Demirchyanova odkazu, technokratického komunistického státu spravujícího strategické zájmy a rozvoj Arménie, představuje vrchol vlády sovětského typu v Arménii. Tato poslední úroveň zachycuje sen o efektivním nacionalistickém komunismu oproštěném od zásahů Moskvy.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, až skončí Demirchyanova obnova a komunistický projekt bude čelit nevyhnutelné výzvě." # todo: NEW TRANSLATION
 ARM_christian_humanism_idea: "Křesťanský humanismus" # todo: NEW TRANSLATION
 ARM_shaumians_thought_idea: "Shaumjanova myšlenka" # todo: NEW TRANSLATION
 ARM_armenia_demirchyan_idea: "Ději Arménsko Demirčyanovo" # todo: NEW TRANSLATION
 ARM_armenia_demirchyan_idea_desc: "Karen Demirchyan, vůdce arménské komunistické strany ze sovětské éry, ztělesňoval technokratické vládnutí a nacionalistické tendence v rámci sovětské struktury. Jeho administrativa zdůrazňovala průmyslový rozvoj a ochranu kultury a respekt si získala i u odpůrců svou kompetentností a zdrženlivostí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální komunisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_asala_bases_idea: "Základny ASALA" # todo: NEW TRANSLATION
 arm_demirchyan.1.t: "OČISTA ARMÁDY" # todo: NEW TRANSLATION
 arm_demirchyan.1.d: "V armádě stále působí nebezpečné živly zastoupené Kocharyanovými příznivci. Musíme od nich armádu očistit." # todo: CHANGED
 arm_demirchyan.1.a: "Dobře." # todo: CHANGED
 arm_demirchyan.2.t: "Naši poradci" # todo: NEW TRANSLATION
 arm_demirchyan.2.d: "Možná bychom kvůli lepší správě měli dbát rad jiných stran. Zbývá jen vybrat kterých." # todo: CHANGED
 arm_demirchyan.2.a: "Mír a demokracie musí vést náš lid." # todo: CHANGED
 arm_demirchyan.2.b: "Jsme pro skutečný socialismus." # todo: CHANGED
 arm_demirchyan.3.t: "§Y[ARM.GetNameWithFlag]§! nabízí ubytování ASALA základnám" # todo: NEW TRANSLATION
 arm_demirchyan.3.d: "§Y[ARM.GetNameWithFlag]§! nám nabízí základny na ochranu naší suverenity před Tureckem. Na oplátku od nás žádají povolení zahrnout oblast Vanu do své sféry zájmu." # todo: CHANGED
 arm_demirchyan.3.a: "Vždy stojíme po boku našich bratrů ve zbrani!" # todo: NEW TRANSLATION
 arm_demirchyan.3.b: "Promiňte, ne." # todo: CHANGED
 arm_demirchyan.4.t: "§Y[KUR.GetNameWithFlag]§! Odradili naši nabídku" # todo: NEW TRANSLATION
 arm_demirchyan.4.d: "Řekli, že naši pomoc nepotřebují." # todo: CHANGED
 arm_demirchyan.4.a: "No jo." # todo: CHANGED
 arm_demirchyan.5.t: "Obnovení ASALA" # todo: NEW TRANSLATION
 arm_demirchyan.5.d: "Nedávno vyšlo najevo, že skupina ASALA, známá svou militarizovanou politikou vůči Ázerbájdžánu a Turecku, nyní oficiálně drží stráž nad bezpečností §Y[ARM.GetNameWithFlag]§!." # todo: CHANGED
 arm_demirchyan.5.a: "Au..." # todo: NEW TRANSLATION
 arm_demirchyan.5.b: "Je to jen politický manévr." # todo: CHANGED
 arm_demirchyan.6.t: "ASALA je na straně naší vlády" # todo: NEW TRANSLATION
 arm_demirchyan.6.d: "Nikdo není zapomenut a nic nezůstává zapomenuto – spolu s našimi spojenci z ASALA můžeme vést §Y[ARM.GetNameWithFlag]§! do skvělé budoucnosti!" # todo: NEW TRANSLATION
 arm_demirchyan.6.a: "Dobře!" # todo: CHANGED
 arm_demirchyan_news.1.t: "[ARM.GetLeader] kritizuje komunistické režimy" # todo: NEW TRANSLATION
 arm_demirchyan_news.1.d: "Arménský vůdce [ARM.GetLeader] veřejně kritizoval všechny komunistické režimy na světě. Řekl, že neefektivně využívají zdroje svých zemí a ničí jejich ekonomiku a kulturu." # todo: CHANGED
 arm_demirchyan_news.1.a: "Úder socialistickému systému." # todo: CHANGED
 ARM_forced_industrialisation_unlock_tt: "§YBudou vydána rozhodnutí o nucené industrializaci v §Y[ARM.GetNameWithFlag]§!§!" # todo: NEW TRANSLATION
 arm_demirchyan.8.t: "Náš postoj k Evropské unii" # todo: NEW TRANSLATION
 arm_demirchyan.8.d: "Je třeba rozhodnout, zda budeme nadále pokračovat ve spolupráci s EU nebo ji opustíme. Pokud se rozhodneme pokračovat ve spolupráci s EU, můžeme od nich získat určité výhody." # todo: NEW TRANSLATION
 arm_demirchyan.8.a: "Pošleme delegaci do EU." # todo: CHANGED
 arm_demirchyan.8.b: "Máme jiné plány." # todo: CHANGED
 arm_demirchyan.9.t: "§Y[ARM.GetNameWithFlag]§! Delegace dorazí do hlavního města" # todo: NEW TRANSLATION
 arm_demirchyan.9.d: "§Y[ARM.GetNameWithFlag]§! chtějí nadále spolupracovat s námi navzdory jejich ideologii. Přijmeme jejich nabídku?" # todo: NEW TRANSLATION
 arm_demirchyan.9.a: "Jasně, proč ne?" # todo: NEW TRANSLATION
 arm_demirchyan.9.b: "Komunisté si naši pozornost nezaslouží." # todo: CHANGED
 arm_demirchyan.10.t: "[FROM.GetNamewithFlag] Přijímá!" # todo: NEW TRANSLATION
 arm_demirchyan.10.d: "Podařilo se nám přesvědčit je k další spolupráci s námi." # todo: CHANGED
 arm_demirchyan.10.a: "Dobře!" # todo: CHANGED
 arm_demirchyan.11.t: "Odmítli s námi spolupracovat" # todo: CHANGED
 arm_demirchyan.11.d: "Naše dohoda u nich bohužel nenašla odezvu." # todo: CHANGED
 arm_demirchyan.11.a: "No jo." # todo: CHANGED
 arm_demirchyan.12.t: "Budoucnost země" # todo: NEW TRANSLATION
 arm_demirchyan.12.d: "Přichází čas rozhodnout o budoucnosti naší země. Národní bolševické i demokratické názory jsou v naší zemi populární, ale konečný výsledek bude záviset na nás." # todo: NEW TRANSLATION
 arm_demirchyan.12.a: "Demokracie je pro nás nejlepší." # todo: CHANGED
 arm_demirchyan.12.b: "Radikálnější cesta by naši zemi ještě posílila." # todo: CHANGED
