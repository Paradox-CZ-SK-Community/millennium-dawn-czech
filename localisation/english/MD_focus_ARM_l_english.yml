 ARM_de_sovietization_idea: "De-sovětsizace" # todo: NEW TRANSLATION
 ARM_de_sovietization_idea_desc: "Systematické rozebírání institucí, ideologie a infrastruktury sovětské éry: nahrazování komunistické symboliky, dekomunizace vzdělávání a kultury a obnova občanské společnosti podle demokratických zásad. Tato agenda definuje liberálně-nacionalistický projekt Ter-Petrosiana pro Arménii po získání nezávislosti.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HLevon Ter-Petrosian§!." # todo: NEW TRANSLATION
 ARM_land_reform_idea: "Zemědělská reforma" # todo: NEW TRANSLATION
 ARM_land_reform_idea_desc: "Rozbití sovchozů a navrácení půdy do soukromého vlastnictví s cílem podpořit zemědělskou produktivitu a zvrátit úpadek venkova. Tato liberálně-demokratická reforma usiluje o vytvoření nezávislé vrstvy svobodných rolníků a o oživení arménského venkova.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HLevon Ter-Petrosian§!." # todo: NEW TRANSLATION
 ARM_cilician_diplomacy_idea: "Diplomacie Cilicie" # todo: NEW TRANSLATION
 ARM_cilician_diplomacy_idea_desc: "Arménská diaspora a historická arménská království Kilikie poskytují arménské zahraniční politice diplomatické a kulturní zdroje. Zapojení diasporických sítí a uctívání kilikijského dědictví posiluje mezinárodní postavení Arménie a její kulturní legitimitu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HLevon Ter-Petrosian§!." # todo: NEW TRANSLATION
 ARM_balanced_approach_idea: "Vyvážený přístup" # todo: NEW TRANSLATION
 ARM_balanced_approach_idea_desc: "Střední cesta mezi bezvýhradným pravoslavným tradicionalismem a západním liberalismem, která vyvažuje křesťanské dědictví Arménie s pragmatickým zapojením Západu a sousedních muslimských států. Tato pragmatická diplomacie usiluje o stabilitu prostřednictvím promyšlené neutrality a hospodářského partnerství namísto ideologické konfrontace.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HLevon Ter-Petrosian§!." # todo: NEW TRANSLATION
 ARM_liberalization_of_economy_idea: "Liberalizace ekonomiky" # todo: NEW TRANSLATION
 ARM_liberalization_of_economy_idea_desc: "Tržní reformy nahrazující sovětské centrální plánování: privatizace státních podniků, odstranění cenových kontrol, otevření Arménie mezinárodnímu obchodu a vytvoření moderního bankovního systému. Tento liberální hospodářský program chce využít produktivní energii kapitalismu a zároveň zachovat sociální ochranu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HLevon Ter-Petrosian§!." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_reverse_idea: "Obchodní smlouva s Arménií" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_reverse_idea_desc: "Náš národ navázal vzájemně výhodné obchodní partnerství s Arménií a využívá její strategickou polohu k přístupu na několik regionálních trhů a ke zdrojům. Tento obchodní vztah vytváří stabilní hospodářské výnosy a politický vliv na Kavkaze a prostřednictvím neutrálního prostředníka nabízí hospodářský zisk i geopolitickou výhodu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud Arménie přestane existovat nebo vstoupíme do války s Arménií." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea: "Diplomacie na křižovatkách" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_desc: "Geografická poloha Arménie na křižovatce ruské, perské, turecké a západní sféry vlivu nabízí nebezpečí i příležitosti. Ter-Petrosian usiluje o pragmatické vztahy se všemi stranami a využívá hospodářská a bezpečnostní partnerství, aniž by Arménii připoutal k jedinému bloku. Tento trvalý přístup umožňuje vláda neutrálních libertariánů nebo vláda vedená Ter-Petrosianem.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jak budou diplomatické iniciativy úspěšné a Arménie prohloubí své vztahy napříč bloky." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_1: "Diplomacie na křižovatkách" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_1_desc: "Prohlubující se zapojení Arménie do několika sfér: dohody s Ruskem o bezpečnosti, se Západem o obchodu a investicích, s Íránem o energiích a tranzitu a s diasporou o kapitálu a odborných znalostech. Tato pokročilá rovnováha zůstává závislá na vládě neutrálních libertariánů nebo na pokračujícím vedení Ter-Petrosiana.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jak Arménie rozšíří diplomatické a hospodářské vazby ve všech regionech." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_2: "Diplomacie na křižovatkách" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_2_desc: "Postavení Arménie na křižovatce se stalo základním kamenem její strategie přežití: hraje prostředníka mezi soupeřícími mocnostmi a nabízí své geografické a kulturní přednosti nejvyšší nabídce, přičemž minimalizuje vojenské riziko a politické závazky. Tato křehká rovnováha vyžaduje trvalý závazek k neutrální zahraniční politice.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jak poroste hodnota Arménie jako neutrálního partnera na křižovatce." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_3: "Diplomacie na křižovatkách" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_3_desc: "Arménie upevnila své postavení skutečného mostu mezi Východem a Západem: hostí ruské vojenské základny, zatímco jedná se členy NATO, prodává demokratickým i autoritářským partnerům a přivádí investice ze všech stran. Udržitelnost tohoto uspořádání zcela závisí na tom, zda Arménie zůstane mimo ideologické tábory, což dokážou zachovat pouze libertariánské nebo Ter-Petrosianovy vlády.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jak bude neutrální pověst Arménie pro soupeřící mocnosti cennější." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_4: "Diplomacie na křižovatkách" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_4_desc: "Arménie se stala skutečně nepostradatelnou křižovatkou: její území, diasporické sítě, finanční centra a neutrální postoj jsou nezbytné pro strategické kalkulace Ruska, Západu, Íránu a dalších. Hospodářské renty proudí ze všech směrů, financují arménský rozvoj a bezpečnost bez nutnosti úplného přiklonění k jedinému bloku.\n§W--------------§!\nTento národní duch se §Gzlepší§!, jak poroste strategická nepostradatelnost Arménie pro všechny strany." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_5: "Diplomacie na křižovatkách" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_5_desc: "Arménie dovedla umění křižovatky k dokonalosti: stala se oblíbeným prostředníkem a investiční destinací několika velmocí, z nichž každá usiluje o vliv na Jižním Kavkaze bez přímé konfrontace. Pokračující neutralita a libertariánské vládnutí Arménie jsou klíčem k udržení této mimořádně výnosné rovnováhy.\n§W--------------§!\nTento národní duch se §Gzlepší§!, pokud Arménie bude nadále prohlubovat vztahy se všemi hlavními mocnostmi bez formálního přiklonění." # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_6: "Diplomacie na křižovatkách" # todo: NEW TRANSLATION
 ARM_crossroad_diplomacy_idea_6_desc: "Vyvrcholení desetiletí pečlivé diplomacie: Arménie dosáhla tak úplného zvládnutí své role křižovatky, že je nezbytná pro regionální strategii každé velmoci. Arménské hospodářství je protkáno všemi soupeřícími bloky; arménskou bezpečnost zaručuje ruská přítomnost, ale Západ ji respektuje; arménské elity mají majetek všude. Tato poslední fáze vyžaduje neochvějný závazek k neutralitě a nemůže přežít ideologický posun.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hneutrální libertariáni§!, ani §HLevon Ter-Petrosian§!." # todo: NEW TRANSLATION
 ARM_Raffi: "Triumf dědictví" # todo: CHANGED
 ARM_Raffi_desc: "Dědictví je arménská národně liberální politická strana. Byla založena Raffim Hovhannisyanem, prvním ministrem zahraničních věcí Arménie." # todo: NEW TRANSLATION
 ARM_national_liberal_agenda: "Národní liberální program" # todo: NEW TRANSLATION
 ARM_national_liberal_agenda_desc: "Program naší strany musí být liberální ekonomika a ochrana národního dědictví. To jsou naše pilíře k velikosti!" # todo: NEW TRANSLATION
 ARM_freemrk_freppl: "Volnější trh – svobodnější lid" # todo: NEW TRANSLATION
 ARM_freemrk_freppl_desc: "Je zřejmé, že musíme přestat snažit ovládat trh nad rámec nutnosti." # todo: NEW TRANSLATION
 ARM_armenian_traders_spir: "Duch arménských obchodníků" # todo: NEW TRANSLATION
 ARM_armenian_traders_spir_desc: "Náš lid byl po celé dějiny úspěšnými obchodníky, musíme tuto tradici podpořit." # todo: NEW TRANSLATION
 ARM_protect_armenian_heritage: "Chránit arménské dědictví" # todo: NEW TRANSLATION
 ARM_protect_armenian_heritage_desc: "Musíme chránit naše dědictví, naši kulturu, která nás dělá tím, kým jsme." # todo: NEW TRANSLATION
 ARM_diaspora_connect: "Spojení s diaspórou" # todo: NEW TRANSLATION
 ARM_diaspora_connect_desc: "Musíme využívat naše vazby v diaspóře pro prospěch vlády." # todo: NEW TRANSLATION
 ARM_part_of_western_civ: "Součást západní civilizace" # todo: NEW TRANSLATION
 ARM_part_of_western_civ_desc: "Arménie není jen nějaká země na Blízkém východě ani ve východní Evropě. Jsme součástí křesťanské západní civilizace, kterou musíme přijmout a napodobovat!" # todo: NEW TRANSLATION
 ARM_befr_church: "Přátelit se s Arménskou církví" # todo: NEW TRANSLATION
 ARM_befr_church_desc: "Musíme podporovat Arménskou církev, protože je jedním ze základních pilířů naší sociální soudržnosti." # todo: NEW TRANSLATION
 ARM_liberty_soil_blood: "Svoboda, půda, krev!" # todo: NEW TRANSLATION
 ARM_liberty_soil_blood_desc: "Musíme milovat naši půdu pro svobodu, kterou nám poskytuje, a vážit si všech krví prolité pro svobodu našeho lidu." # todo: NEW TRANSLATION
 ARM_new_leader_image: "Nový obraz vůdce" # todo: NEW TRANSLATION
 ARM_new_leader_image_desc: "Raffi musí být novou ikonou poctivého, skutečného populárního vůdce pro Arménii!" # todo: NEW TRANSLATION
 ARM_anti_corrupt_mass: "Obrovské protikorupční kampaně" # todo: NEW TRANSLATION
 ARM_anti_corrupt_mass_desc: "Korupce musí být vyhlazena z naší země a musí být vytvořena nová protikorupční policie." # todo: NEW TRANSLATION
 ARM_foster_econ_growth: "Rychlejší ekonomický růst" # todo: NEW TRANSLATION
 ARM_foster_econ_growth_desc: "Musíme za každou cenu urychlit ekonomický růst, protože je klíčem k arménské prosperitě." # todo: CHANGED
 ARM_free_full_healthcare: "Zcela zdarma zdravotní péče" # todo: NEW TRANSLATION
 ARM_free_full_healthcare_desc: "Musíme našim občanům poskytnout nejlepší bezplatnou komplexní zdravotní péči a starat se o ně." # todo: CHANGED
 ARM_anti_braindead: "Boj proti odlivu mozku" # todo: NEW TRANSLATION
 ARM_anti_braindead_desc: "Musíme bojovat proti odlivu mozků, který Arménii sužuje od pádu Sovětského svazu." # todo: CHANGED
 ARM_us_example: "Americký příklad" # todo: NEW TRANSLATION
 ARM_us_example_desc: "USA jsou skvělým příkladem demokratické kapitalistické země, jejíž prosperita září dodnes. Musíme vybudovat naši zemi podle těchto ideálů!" # todo: CHANGED
 ARM_elect_reform: "Volební reformy" # todo: NEW TRANSLATION
 ARM_elect_reform_desc: "Musíme učinit náš volební systém více demokratickým a zajistit plnou účast." # todo: NEW TRANSLATION
 ARM_united_states_armenia: "Spojené státy Arménie" # todo: NEW TRANSLATION
 ARM_united_states_armenia_desc: "Naše inspirace pro americký systém dosáhne vrcholu! Jsme připraveni oznámit vznik Spojených států Arménie!" # todo: NEW TRANSLATION
 ARM_true_air_force: "Skutečná arménská letecká síla" # todo: NEW TRANSLATION
 ARM_true_air_force_desc: "Máme v úmyslu vybudovat strukturu naší letecké síly podobnou letecké síle USA a investovat významný rozpočet naší země do jejich rozvoje." # todo: NEW TRANSLATION
 ARM_true_national_guard: "Skutečná národní garda" # todo: NEW TRANSLATION
 ARM_true_national_guard_desc: "Máme v úmyslu plně přizpůsobit zkušenost americké Národní gardy realitám Arménské armády. Stejně jako americký prototyp bude Národní garda moci se zapojit do operací v jiných zemích, a letecká Národní garda bude také vytvořena, což umožní našim pilotům podílet se na operacích v zahraničí." # todo: NEW TRANSLATION
 ARM_national_liberal_agenda_idea: "Národně-liberální agenda" # todo: NEW TRANSLATION
 ARM_national_liberal_agenda_idea_desc: "Raffi Hovannisian a strana Heritage prosazují národní liberalismus: tržní hospodářství spojené s kulturním nacionalismem a zapojením diaspory. Tato agenda odmítá jak autoritarismus sovětského typu, tak západní neoliberalismus a hledá jedinečnou arménskou cestu občanského nacionalismu, podnikání a rozvoje financovaného diasporou.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_health_pindos_idea: "Důsledky reformy zdravotní péče" # todo: NEW TRANSLATION
 ARM_health_pindos_idea_desc: "Zdravotnické reformy zaměřené na modernizaci a privatizaci arménského zdravotnictví mají nečekané důsledky: rostoucí náklady, horší dostupnost pro chudé, byrokratické tření a nedostatek léků a vybavení. Pokus uplatnit americké modely zdravotního trhu na arménské podmínky selhává a vyvolává veřejnou nespokojenost i hospodářské napětí.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_free_market_reforms_idea: "Reformy volného trhu" # todo: NEW TRANSLATION
 ARM_free_market_reforms_idea_desc: "Hovannisian prosazuje klasicky liberální hospodářství: privatizaci státních podniků, rozbití monopolů, odstranění cenových kontrol a otevření Arménie konkurenci. Reformy volného trhu mají uvolnit podnikatelskou energii a odstranit oligarchický rentiérský systém, ačkoli bez podpory sociálního zabezpečení hrozí společenskými otřesy a nerovností.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_protection_of_armenian_heritage_idea: "Ochrana arménského dědictví" # todo: NEW TRANSLATION
 ARM_protection_of_armenian_heritage_idea_desc: "Strana Heritage staví arménské kulturní a duchovní dědictví do středu politiky: státní podpora apoštolské církve, ochrana arménských klášterů a historických památek a důraz na kontinuitu arménské civilizace. Tento kulturní nacionalismus odlišuje Arménii od sovětského ateismu a zároveň zachovává otevřenost západním občanským hodnotám.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_armenian_traders_culture_idea: "Duch arménských obchodníků" # todo: NEW TRANSLATION
 ARM_armenian_traders_culture_idea_desc: "Hovannisian připomíná historické obchodnické sítě arménské diaspory a oslavuje podnikatelského ducha a obchodní kontakty jako jedinečně arménské vlastnosti. Stát podporuje obchodní sdružení, obchodní partnerství s diasporou a tržně orientované vzdělávání a považuje kapitalismus a arménskou identitu za slučitelné.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_protection_of_national_education_idea: "Ochrana národního vzdělávání" # todo: NEW TRANSLATION
 ARM_protection_of_national_education_idea_desc: "Heritage chrání arménské vzdělávání před cizí, zejména ruskou kulturní dominancí: v osnovách zdůrazňuje arménskou historii, jazyk a literaturu, zvyšuje výdaje na vzdělávání s cílem přilákat učitele z diaspory a posiluje vazby na západní univerzity, přičemž arménskou kulturní identitu ponechává v centru.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_soil_of_libery_idea: "Půda svobody" # todo: NEW TRANSLATION
 ARM_soil_of_libery_idea_desc: "Arménská půda, fyzicky i metaforicky, se stává základem demokratické svobody a národní nezávislosti. Hovannisian vykresluje arménskou státnost jako projekt univerzálních principů svobody: demokracie, lidských práv a právního státu zakořeněných v arménské půdě, který odolává ruskému autoritarismu i oligarchickému uchvácení.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_us_inspired_government_idea: "Vláda inspirovaná Spojenými státy" # todo: NEW TRANSLATION
 ARM_us_inspired_government_idea_desc: "Hovannisian výslovně modeluje arménské vládnutí podle amerických institucí: ústavní dělbu moci, nezávislé soudnictví, federální struktury a důraz na občanskou společnost. Amerikanizace vládnutí má přenést západní demokratickou odolnost a ochránit Arménii před ruskou dominancí i oligarchickým uchvácením.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
 ARM_social_promises: "Sociální sliby" # todo: NEW TRANSLATION
 ARM_social_promises_desc: "Pašinjan slíbil rozsáhlou sociální reformu včetně zvýšení důchodů, zlepšení veřejných služeb a protikorupčních opatření s cílem získat lidovou legitimitu. Tyto závazky tvořily základ jeho kampaně v roce 2018 a prvních vládních iniciativ.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hneutrální libertariáni§! ztratí moc." # todo: NEW TRANSLATION
 ARM_armenia_raffik_idea: "Americká Arménie" # todo: NEW TRANSLATION
 ARM_armenia_raffik_idea_desc: "Zastřešující koncept ztělesňující západně-konzervativní vizi Raffiho Hovannisiana: arménský národní liberalismus spojený se zapojením diaspory, ekonomikou volného trhu, ochranou dědictví a demokratickým vládnutím po americkém vzoru. Skutečné účinky této vize se projevují prostřednictvím propojených podřízených idejí odrážejících různé stránky Hovannisianova modelu proměny Arménie.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hzápadní konzervativci§! ztratí moc." # todo: NEW TRANSLATION
