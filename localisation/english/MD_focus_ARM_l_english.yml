 ARM_defence: "Na obranu Arménie" # todo: NEW TRANSLATION
 ARM_defence_desc: "Naše země potřebuje lepší ochranu, a jen ty nejlepší speciální služby ji mohou zajistit, za což je budeme štědře financovat." # todo: NEW TRANSLATION
 ARM_police: "Policie Arménie" # todo: NEW TRANSLATION
 ARM_police_desc: "Policie Arménské republiky je národní policií Arménie. Nyní jsme připraveni na rozsáhlé reformy této struktury: přijmeme nový personál, odstraníme zkorumpované úředníky a zvýšíme financování policie." # todo: CHANGED
 ARM_police_troops: "Policejní jednotky" # todo: NEW TRANSLATION
 ARM_police_troops_desc: "Policejní jednotky Arménie se účastnily všech významných operací po boku bývalých vnitřních jednotek a jejich sovětských předchůdců. Jejich úkolem je ochrana zvláštních objektů, udržování veřejného pořádku a bezpečnosti a základní výcvik branců a poddůstojníků." # todo: CHANGED
 ARM_national_central_bureua: "Národní centrální úřad" # todo: NEW TRANSLATION
 ARM_national_central_bureua_desc: "Národní ústředna rozděluje svou práci do tří oddělení zaměřených na kriminalistiku, operační podporu a technickou pomoc. Zvýšíme financování a provedeme personální reformy, aby všechna tři oddělení fungovala naplno." # todo: CHANGED
 ARM_special_oper_forces: "Speciální operační síly" # todo: NEW TRANSLATION
 ARM_special_oper_forces_desc: "Elitní speciální jednotky arménské policie pověřené bojem proti ozbrojeným hrozbám státu. Jejich současné složení a vybavení zaostávají za moderními standardy a hodláme obojí zcela obnovit." # todo: CHANGED
 ARM_black_panters: "Černé pantery" # todo: NEW TRANSLATION
 ARM_black_panters_desc: "Černí panteři jsou bývalí vojáci začlenění do policejních speciálních jednotek. Jejich bojové zkušenosti a metody nasazení v terénu jsou cenným přínosem pro naše bezpečnostní složky." # todo: CHANGED
 ARM_nss: "Národní bezpečnostní služba" # todo: NEW TRANSLATION
 ARM_nss_desc: "Národní bezpečnostní služba je hlavní arménskou agenturou pro národní bezpečnost a zpravodajství. Je stále poměrně mladá a postrádá zkušený personál. To napravíme cílenými reformami a zvýšeným financováním." # todo: CHANGED
 ARM_take_border_troops: "Hraniční stráž" # todo: NEW TRANSLATION
 ARM_take_border_troops_desc: "Arménská pohraniční stráž monitoruje a zabezpečuje hranice Arménie s Tureckem, Ázerbájdžánem, Íránem a Gruzií. Kvůli chronickému podfinancování v současnosti plní jen zlomek svých povinností. To napravíme." # todo: CHANGED
 ARM_economic_corruption_security: "Ekonomická bezpečnost a boj proti korupci" # todo: NEW TRANSLATION
 ARM_economic_corruption_security_desc: "Tato jednotka odpovídá za boj proti korupci a ochranu arménské ekonomiky před vnitřními sabotážemi. V době, kdy je ekonomická bezpečnost důležitější než kdy dříve, není investice do tohoto oddělení luxusem, ale nutností." # todo: CHANGED
 ARM_constitutional_teerorism: "Ochrana ústavního pořádku a boj proti terorismu" # todo: NEW TRANSLATION
 ARM_constitutional_teerorism_desc: "Toto oddělení brání ústavní pořádek a bojuje proti terorismu. Dodatečné financování zlepší jeho schopnosti a reakční kapacitu." # todo: CHANGED
 ARM_alpha: "Speciální jednotky Alfa" # todo: NEW TRANSLATION
 ARM_alpha_desc: "Elitní speciální jednotky arménských zpravodajských služeb plní široké spektrum úkolů od boje proti organizovanému zločinu po protiteroristické operace. Obměna personálu a zvýšené financování výrazně zlepší jejich schopnosti." # todo: CHANGED
 ARM_fis: "Zahraniční zpravodajská služba" # todo: NEW TRANSLATION
 ARM_fis_desc: "Zahraniční zpravodajská služba je hlavní externí zpravodajská agentura Arménie. Naše vlastní státní zpravodajská služba, která bude odpovědná za všechny naše neoficiální zahraničněpolitické kroky." # todo: NEW TRANSLATION
 ARM_special_services_category: "Speciální služby Arménie" # todo: NEW TRANSLATION
 ARM_special_services_category_desc: "[ARM.GetFlag]§YArménii§! nechrání pouze statečná armáda, která §Gvítězně§! prošla [NKR.GetFlag]§Rkarabašským konfliktem§!, ale také statečné £text_icon_armnss §2bezpečnostní a zvláštní služby§!, na nichž by stát neměl šetřit, protože jsou klíčem k §Yvnitřní bezpečnosti země £text_icon_armnss§!.\n\n§GDokončováním§! fokusů ve £text_icon_armnss §Yvětvi zvláštních služeb§! §Godemknete§! stále více §Yn árodních duchů§!, kteří se zobrazí níže." # todo: CHANGED
