 ARM_monarch: "Obnova monarchie" # todo: CHANGED
 ARM_monarch_desc: "Žádný vojenský, politický ani jiný činitel nemá právo vládnout zemi. Nejlegitimnějším vládcem může být jen monarcha, jehož paternalistický přístup může Arménii dovést k velikosti." # todo: NEW TRANSLATION
 ARM_assemble_meliq_union: "Shromažďování Meliqovy unie" # todo: NEW TRANSLATION
 ARM_assemble_meliq_union_desc: "Meliq Union je aristokratická tradicionalistická organizace v Arménii. Musíme shromáždit každého člena této organizace, abychom zvolili nového Tagavora." # todo: NEW TRANSLATION
 ARM_armeno_ari_union: "Arméno-árijská unie" # todo: NEW TRANSLATION
 ARM_armeno_ari_union_desc: "Armeno-árijská unie je politická strana v Arménii, která prosazuje návrat ke starověkým arménským pohanským tradicím a obnovení Arménského království v podobě, jakou mělo v antice." # todo: CHANGED
 ARM_bagratuni: "Bagratuni pretendent?" # todo: NEW TRANSLATION
 ARM_bagratuni_desc: "Bagratuni neboli dynastie Bagratid je arménská královská dynastie, která vládla středověkému Království Arménie. Původně jako vazalové Království Arménie v době starověku, vzrostli na nejvýznamnější arménskou šlechtickou rodinu během období arabské nadvlády nad Arménií, nakonec založili vlastní nezávislé království. Jsou také předky gruzínské královské dynastie Bagrationi. Nicméně, Roland von Bagratuni nedoložil své potomstvo z dynastie Bagratuni na plnou míru, což vyvolává řadu obav u členů Unie Meliq." # todo: NEW TRANSLATION
 ARM_savoya: "Savojská dynastie" # todo: NEW TRANSLATION
 ARM_savoya_desc: "Poslední královskou dynastií Arménie byla dynastie Lusignan. Když v roce 1375 bylo zničeno Království Kilikie, poslední král Levon VI (Leo VI) předal titul krále Arménie Jamesi I. (Hakob I), králi Kypru, který pocházel ze stejné dynastie Lusignan. V roce 1489 královna Charlotta titul předala svému bratranecovi Karlu Válečníkovi, vévodovi ze Savoj (v Itálii)." # todo: NEW TRANSLATION
 ARM_going_to_roots: "Návrat ke kořenům" # todo: NEW TRANSLATION
 ARM_going_to_roots_desc: "Arménie je jednou z nejstarších zemí, které přežily dodnes. Ne všechny národy dokázaly přežít, ale náš národ prošel trnitou cestou, po níž by mnozí nepřežili. Víra našich předků, jejich slavné činy a tradice jsou tím, co nám pomohly přežít a pokračovat v boji." # todo: NEW TRANSLATION
 ARM_glory_of_tigr: "Sláva Tigranes Velikého" # todo: NEW TRANSLATION
 ARM_glory_of_tigr_desc: "Nyní je čas, aby Arménie znovu povstala na nohy a sjednotila se kolem svého nového, znovuzrozeného království, které musí dosáhnout výšin, jichž dosáhl Tigranes Veliký, a dokonce je překonat!" # todo: NEW TRANSLATION
 ARM_state_christianity: "Státní křesťanství" # todo: NEW TRANSLATION
 ARM_state_christianity_desc: "Ústava našeho státu již popisuje důležitost Arménské církve v životě našeho lidu. Nyní však nastal čas učinit z církve součást státu a začlenit ji do všech aspektů života." # todo: NEW TRANSLATION
 ARM_restoring_aspets: "Obnovení Aspets" # todo: NEW TRANSLATION
 ARM_restoring_aspets_desc: "Aspeti Dziavorové neboli Ayrudziové byli arménští rytíři, kteří sloužili jako věrní bojovníci arménským tagavorům neboli šlechtickým rodinám. Musíme tento titul obnovit v naší armádě a spojit staré tradice s moderním vedením války." # todo: CHANGED
 ARM_support_pan_iranists: "Parthský hněv" # todo: NEW TRANSLATION
 ARM_support_pan_iranists_desc: "My, Arméni, jsme vším, co zbylo z Arsakovské říše, která byla nešťastným sledem událostí zničena Sásánovci. Nyní se musíme rozhodnout: spojíme se a sjednotíme s Peršany, nebo obnovíme naši dynastii v Íránu." # todo: CHANGED
 ARM_give_money_to_kob: "Podpora KOB" # todo: NEW TRANSLATION
 ARM_give_money_to_kob_desc: "Konceptuální strana KOB má s námi velmi podobné hodnoty. Musíme podpořit naše bratry z Ruska a vytvořit soudržnou osu spojenců v regionu." # todo: NEW TRANSLATION
 ARM_supporting_chechens: "Podpora Ichkerie" # todo: NEW TRANSLATION
 ARM_supporting_chechens_desc: "Během první čečenské války si Roland von Bagratuni dopisoval s Džocharom Dudajevem; oba v dopisech probírali odpor proti Rusku a pankavkazské ambice." # todo: CHANGED
 ARM_crusader_legacy: "Dědictví křižáků" # todo: NEW TRANSLATION
 ARM_crusader_legacy_desc: "Mezi činy, jichž Arméni prokázali vůči církvi a křesťanskému světu, je zvláště zdůrazněno, že v dobách, kdy křesťanští panovníci a válečníci šli dobýt Svatou zemi, žádný národ této vášněji, radostí a vírou nepomohl, jako Arméni, kteří křižovníkům poskytovali koně, zásoby a vedení. Arméni těmto bojovníkům projevovali odvahu a věrnost během svatých válek. - papež Řehoř XIII." # todo: NEW TRANSLATION
 ARM_our_old_realm: "Dluh Edwarda" # todo: NEW TRANSLATION
 ARM_our_old_realm_desc: "Poslední král Arménie Kilikie, ve snaze vyvolat novou křížovou výpravu za osvobození Arménie, navštívil krále Anglie Eduarda III. V naději na obnovení Království Kilikie uložil Levon státní pokladnu v bezpečí anglickému králi. Strany uzavřely dohodu, že pokladna zůstane v Anglii až do osvobození a obnovení Arménie. Je čas požadovat naše peníze zpět." # todo: NEW TRANSLATION
 ARM_renewed_nobility: "Obnovená šlechta" # todo: NEW TRANSLATION
 ARM_renewed_nobility_desc: "Nesmíme jen integrovat starou šlechtu, která by mohla váhat spolupracovat s námi, ale musíme také vytvořit novou aristokracii z našich vojenských velitelů." # todo: NEW TRANSLATION
 ARM_polish_hung_dilem: "Polské dilema" # todo: NEW TRANSLATION
 ARM_polish_hung_dilem_desc: "Roland von Bagratuni přišel do Arménie z Polska a je ochoten podpořit monarchistické hnutí ve své první vlasti." # todo: NEW TRANSLATION
 ARM_fate_of_italy: "Osud Itálie" # todo: NEW TRANSLATION
 ARM_fate_of_italy_desc: "Dynastie Savojská oprávněně vlastní titul králů Itálie. Musíme začít uvažovat, jak se spojit s naší druhou korunou." # todo: NEW TRANSLATION
 ARM_true_tseghakronism: "Pravý Tseghakronismus" # todo: NEW TRANSLATION
 ARM_true_tseghakronism_desc: "Jako nově vzniklá monarchie musíme podporovat Tseghakronistické myšlenky, které plně souzní s naší tradiční orientací." # todo: NEW TRANSLATION
 ARM_new_religious_thought: "Nové náboženské myšlenky" # todo: NEW TRANSLATION
 ARM_new_religious_thought_desc: "Vůdci naší rady věří, že je v souladu s našimi ideály oživit starou původní arménskou víru a začlenit ji do naší společnosti." # todo: CHANGED
 ARM_support_ossetia: "Podpora Osetie" # todo: NEW TRANSLATION
 ARM_support_ossetia_desc: "Osetie je jednou z mála zemí v Kavkaze, která s námi sdílí nejen krev, ale i stejné ideály. Musíme podpořit jejich věc." # todo: NEW TRANSLATION
 ARM_pan_caucasianism: "Pan-kavkazanství" # todo: NEW TRANSLATION
 ARM_pan_caucasianism_desc: "Sjednocení celého Kavkazu pod naší vlajkou je cílem našeho krále a jeho vůle musí být naplněna." # todo: NEW TRANSLATION
 ARM_liberating_levant: "Osvobození Levantu" # todo: NEW TRANSLATION
 ARM_liberating_levant_desc: "Stejně jako naši západní a arménští předkové musíme zahájit novou křížovou výpravu za osvobození Levanty a obnovení bývalých křižáckých států." # todo: CHANGED
 ARM_true_urheimat: "Skutečná Urheimat" # todo: NEW TRANSLATION
 ARM_true_urheimat_desc: "Arménie je pravou vlastí všech Indoevropanů. Jak naše strana původně prohlásila:\n\nArménská vysočina\ndomovina Arménů,\nkolébka árijské civilizace.\nÁrijci po celém světě,\nosvoboďte ji,\nosvoboďte sebe." # todo: CHANGED
 arm_empire.2.t: "Unification with Our Armenian Brothers" # todo: NEW TRANSLATION
 arm_empire.2.d: "Je čas spojit se a stát bok po boku s našimi arménskými bratry. Společně postavíme skvělou budoucnost, potrestáme naše společné nepřátele a povedeme naše národy k prosperitě." # todo: NEW TRANSLATION
 arm_empire.2.a: "Spojme se" # todo: NEW TRANSLATION
 arm_empire.2.b: "Tak si překřížíme paže" # todo: NEW TRANSLATION
 arm_empire.2.c: "Jdeme různými cestami" # todo: NEW TRANSLATION
 arm_empire.3.t: "Shodli se na sjednocení" # todo: NEW TRANSLATION
 arm_empire.3.d: "Náš sen se stal skutečností a nyní jsou arménský a perský lid opět sjednoceni" # todo: NEW TRANSLATION
 arm_empire.3.a: "Dobré" # todo: NEW TRANSLATION
 arm_empire.4.t: "Odmítli naši nabídku" # todo: NEW TRANSLATION
 arm_empire.4.d: "Nedokázali jsme je přesvědčit, aby se k nám přidali." # todo: NEW TRANSLATION
 arm_empire.4.a: "Dobře" # todo: NEW TRANSLATION
 arm_empire.5.t: "Zvolili si spojenectví s námi" # todo: CHANGED
 arm_empire.5.d: "Rozhodli se, že nejlepší možností bude stát se naším spojencem." # todo: CHANGED
 arm_empire.5.a: "Dobře" # todo: NEW TRANSLATION
 arm_empire.6.t: "Arménie nabízí koupit [SOO.GetName]" # todo: NEW TRANSLATION
 arm_empire.6.d: "Arménská vláda nás dnes oslovila neobvyklou nabídkou. Hodlají koupit území [SOO.GetName] od nás za velmi značnou sumu. Jsme touto nabídkou šokováni; navíc arménští diplomaté jasně naznačili, že jejich odmítnutí povede k negativním důsledkům." # todo: NEW TRANSLATION
 arm_empire.6.a: "Je to absurdní!" # todo: NEW TRANSLATION
 arm_empire.6.b: "Souhlasíme" # todo: NEW TRANSLATION
 arm_empire.7.t: "Arménie Offers to Buy [SOO.GetName]" # todo: NEW TRANSLATION
 arm_empire.7.d: "Arménská vláda nás dnes oslovila neobvyklou nabídkou. Hodlají koupit území [SOO.GetName] od nás za velmi vysokou sumu. Jsme šokováni touto nabídkou, navíc arménští diplomaté jasně naznačili, že jejich odmítnutí by vedlo k negativním důsledkům." # todo: NEW TRANSLATION
 arm_empire.7.a: "Je to absurdní!" # todo: NEW TRANSLATION
 arm_empire.7.b: "Souhlasíme" # todo: NEW TRANSLATION
 arm_empire.8.t: "Arménie offers to Buy Us" # todo: NEW TRANSLATION
 arm_empire.8.d: "Arménská vláda dnes navázala diplomatické styky a předložila velmi neobvyklou nabídku. Hodlají koupit naši zemi pod svou kontrolou za velkou sumu. Částka bude oficiálními médii prezentována diplomatickyji, avšak nabídnutá částka je značná, navíc jejich patronát, na rozdíl od Ruska, s námi dosud nesouhlasil." # todo: NEW TRANSLATION
 arm_empire.8.a: "Hurá!" # todo: NEW TRANSLATION
 arm_empire.8.b: "Souhlasíme" # todo: NEW TRANSLATION
 arm_empire.9.t: "[SOO.GetName] Odmítla nabídku" # todo: NEW TRANSLATION
 arm_empire.9.d: "Jejich vláda odmítla naši velkoryslou nabídku. No, vypadá to, že budeme muset hledat jiné způsoby, jak s nimi navázat kontakt." # todo: NEW TRANSLATION
 arm_empire.9.a: "Smutné" # todo: NEW TRANSLATION
 arm_empire.10.t: "Arménie požaduje vrácení peněz" # todo: NEW TRANSLATION
 arm_empire.10.d: "Nyní, když bylo Království Arménie obnoveno, je čas splnit podmínky staré smlouvy, podle níž byla arménská pokladna uložená v Velké Británii převedena tehdy smlouvou z roku 1378. V případě získání Arménie státnosti musí být pokladna vrácena." # todo: NEW TRANSLATION
 arm_empire.10.a: "Dodržujeme naše sliby" # todo: NEW TRANSLATION
 arm_empire.10.b: "To není Arménie, se kterou byla smlouva uzavřena." # todo: NEW TRANSLATION
 arm_empire.11.t: "Británie odmítá vrátit peníze" # todo: NEW TRANSLATION
 arm_empire.11.d: "Není divu, že Britové nemají nic důvěryhodného, ani naše peníze" # todo: NEW TRANSLATION
 arm_empire.11.a: "Přimějeme je, aby vrátili peníze, ale teď ne" # todo: NEW TRANSLATION
 arm_empire.12.t: "Británie dodržuje podmínky smlouvy" # todo: NEW TRANSLATION
 arm_empire.12.d: "Britská vláda souhlasila s vrácením našich peněz" # todo: NEW TRANSLATION
 arm_empire.12.a: "Možná se skutečně můžeme spolehnout na Británii v dobách nouze" # todo: NEW TRANSLATION
 arm_empire.14.t: "Sjednocení pod jednou korunou" # todo: NEW TRANSLATION
 arm_empire.14.d: "Nyní, po nástupu dynastie Savojské k moci v Arménii, máme příležitost znovu se sjednotit pod jednou korunou." # todo: NEW TRANSLATION
 arm_empire.14.a: "Souhlasíme se sloučením s Arménií" # todo: NEW TRANSLATION
 arm_empire.14.b: "Pojďme hovořit o integraci" # todo: NEW TRANSLATION
 arm_empire.14.c: "Ne" # todo: NEW TRANSLATION
 arm_empire.15.t: "Itálie souhlasí stát se naším územím" # todo: NEW TRANSLATION
 arm_empire.15.d: "Italská koruna souhlasila s tím, že bude sjednocena s námi pod nadvládou naší dynastie." # todo: NEW TRANSLATION
 arm_empire.15.a: "Perfektní" # todo: NEW TRANSLATION
 arm_empire.16.t: "Itálie odmítla naši nabídku" # todo: NEW TRANSLATION
 arm_empire.16.d: "Itálie odmítla naši nabídku, čímž projevila extrémní neúctu vůči nám" # todo: NEW TRANSLATION
 arm_empire.16.a: "Jejich problémy" # todo: NEW TRANSLATION
 arm_empire.17.t: "Itálie nabízí sloučení pod svým praporem" # todo: NEW TRANSLATION
 arm_empire.17.d: "Itálie nám nabízí stát se součástí jejího státu, čímž budeme finančně a politicky výrazně těžit. Budeme si také moci zachovat naši suverenitu" # todo: NEW TRANSLATION
 arm_empire.17.a: "Možná vy?" # todo: NEW TRANSLATION
 arm_empire.17.b: "Souhlasíme" # todo: NEW TRANSLATION
 arm_empire.18.t: "Arménie odmítá naši nabídku a nabízí stát se její součástí" # todo: NEW TRANSLATION
 arm_empire.18.d: "Arménie nás zve stát se součástí jejího státu. Budeme moci si zachovat část naší suverenity." # todo: NEW TRANSLATION
 arm_empire.18.a: "Ne" # todo: NEW TRANSLATION
 arm_empire.18.b: "Pojďme se sjednotit" # todo: NEW TRANSLATION
 arm_empire.19.t: "Povstání v Čečensku" # todo: NEW TRANSLATION
 arm_empire.19.d: "V Čečensku válka začala znovu. Podle našich zprav byly čečenské povstalecké síly financovány arménskými zpravodajskými službami, aby vyvolaly povstání. Zdá se, že arménská vláda má zájem o nestabilitu v naší zemi." # todo: NEW TRANSLATION
 arm_empire.19.a: "Třetí čečenská válka začala" # todo: NEW TRANSLATION
 arm_empire.20.t: "Povstání v Čečensku" # todo: NEW TRANSLATION
 arm_empire.20.d: "V Čečensku válka začala znovu. Podle našich zprav byly čečenské povstalecké síly financovány arménskými zpravodajskými službami, aby vyvolaly povstání. Zdá se, že arménská vláda má zájem o nestabilitu v naší zemi." # todo: NEW TRANSLATION
 arm_empire.20.a: "Třetí čečenská válka začala" # todo: NEW TRANSLATION
 arm_empire.21.t: "Sjednocení pod jednou vlajkou" # todo: NEW TRANSLATION
 arm_empire.21.d: "Nyní, když se na Arménii dostal k moci rod Savoyů, máme příležitost se sjednotit pod jednou vlajkou." # todo: NEW TRANSLATION
 arm_empire.21.a: "Souhlasíme se sloučením s Arménií" # todo: NEW TRANSLATION
 arm_empire.21.b: "Pojďme hovořit o integraci" # todo: NEW TRANSLATION
 arm_empire.21.c: "Ne" # todo: NEW TRANSLATION
 arm_empire.22.t: "Čečensko souhlasí stát se naším územím" # todo: NEW TRANSLATION
 arm_empire.22.d: "Čečenská vláda souhlasí se sloučením s námi pod naší vlajkou" # todo: NEW TRANSLATION
 arm_empire.22.a: "Perfektní" # todo: NEW TRANSLATION
 arm_empire.23.t: "Čečensko odmítlo naši nabídku" # todo: NEW TRANSLATION
 arm_empire.23.d: "Čečensko odmítlo naši nabídku, čímž projevilo extrémní neúctu vůči nám" # todo: NEW TRANSLATION
 arm_empire.23.a: "Jejich problémy" # todo: NEW TRANSLATION
 arm_empire.24.t: "Čečensko nabízí sloučení pod svým praporem" # todo: NEW TRANSLATION
 arm_empire.24.d: "Čečensko nám nabízí stát se součástí jeho, čímž budeme finančně a politicky výrazně těžit. Budeme si také moci zachovat naši suverenitu" # todo: NEW TRANSLATION
 arm_empire.24.a: "Možná vy?" # todo: NEW TRANSLATION
 arm_empire.24.b: "Souhlasíme" # todo: NEW TRANSLATION
 arm_empire.25.t: "Arménie odmítá naši nabídku a nabízí stát se její součástí" # todo: NEW TRANSLATION
 arm_empire.25.d: "Arménie nás zve stát se součástí jejího státu. Budeme moci si zachovat část naší suverenity." # todo: NEW TRANSLATION
 arm_empire.25.a: "Ne" # todo: NEW TRANSLATION
 arm_empire.25.b: "Pojďme se sjednotit" # todo: NEW TRANSLATION
 arm_empire.26.t: "Polská občanská válka" # todo: NEW TRANSLATION
 arm_empire.26.d: "V důsledku nedávných událostí a skutečnosti, že k moci byla dosazena loutková pro-Arménská vláda, s tímto postavením Polska nesouhlasilo mnoho politických sil. Mnoho generálů polské armády, za podpory západních politických stran, zorganizovalo proti nám povstání!" # todo: NEW TRANSLATION
 arm_empire.26.a: "Bože chraň nás" # todo: NEW TRANSLATION
 arm_empire.26.b: "Znepokojivý vývoj." # todo: CHANGED
 arm_empire.27.t: "Italská občanská válka" # todo: NEW TRANSLATION
 arm_empire.27.d: "V Itálii po událostech nastala politická krize. Mnozí v zemi nebyli spokojeni s otevřeným loutkovým režimem, který převzal kontrolu nad zemí. Výsledkem bylo ozbrojené povstání vedené pro-západními politickými silami." # todo: NEW TRANSLATION
 arm_empire.27.a: "Bože chraň nás" # todo: NEW TRANSLATION
 arm_empire.27.b: "Znepokojivý vývoj." # todo: CHANGED
 arm_empire.28.t: "Podpora Koncepční strany 'Jednota'" # todo: NEW TRANSLATION
 arm_empire.28.d: "Ruský politický systém nám nedává příliš na výběr, pokud jde o to, kterého favorita prosazovat v zájmu našich politických zájmů. Současnou vládu považujeme za otevřeně nepřátelskou vůči naší zemi, a proto hodláme prosazovat své zájmy v Rusku prostřednictvím našeho chráněnce." # todo: CHANGED
 arm_empire.28.a: "Jdeme" # todo: NEW TRANSLATION
 arm_empire.29.t: "Pokračující financování Koncepční strany 'Jednota'" # todo: NEW TRANSLATION
 arm_empire.29.d: "Budeme tuto stranu nadále finančně podporovat v naději, že se nám naše finance v budoucnu vrátí." # todo: CHANGED
 arm_empire.29.a: "Dobře" # todo: NEW TRANSLATION
 arm_empire.30.t: "Osud Koncepční strany 'Jednota'" # todo: NEW TRANSLATION
 arm_empire.30.d: "Je čas rozhodnout, zda se kvůli změně moci v Rusku posuneme k závěru našeho velkého plánu, nebo budeme dál posilovat svůj vliv." # todo: CHANGED
 arm_empire.30.a: "Ještě je brzy" # todo: NEW TRANSLATION
 arm_empire.30.b: "Nastal čas" # todo: NEW TRANSLATION
 arm_empire.31.t: "Povstání Koncepční strany 'Jednota'" # todo: NEW TRANSLATION
 arm_empire.31.d: "Všechny přípravy byly dokončeny a nyní můžeme jen doufat, že naše finance byly dobře vynaloženy." # todo: CHANGED
 arm_empire.31.a: "Nastal čas" # todo: NEW TRANSLATION
 arm_empire.32.t: "Koncepční strana 'Jednota' uchopila moc v Rusku" # todo: NEW TRANSLATION
 arm_empire.32.d: "Koncepční strana 'Jednota', vedená Konstantinem Petrovem, uchopila moc v Rusku bez výrazného odporu, a politická nesourodost se zdá oslabila vnitřní obranu země." # todo: NEW TRANSLATION
 arm_empire.32.a: "Ztrácíme zemi." # todo: NEW TRANSLATION
 arm_empire.32.b: "Vítězství!" # todo: NEW TRANSLATION
 arm_empire.33.t: "Povstání Koncepční strany 'Jednota'" # todo: NEW TRANSLATION
 arm_empire.33.d: "Koncepční strana „Jednota“ vedená Konstantinem Petrovem se pokusila převzít moc v Moskvě pomocí převratu, ale zvláštní služby tomu dokázaly zabránit. Strana měla bohužel v regionech mnoho příznivců, což vyvolalo povstání po celé zemi." # todo: CHANGED
 arm_empire.33.a: "Ztrácíme zemi." # todo: NEW TRANSLATION
 arm_empire.33.b: "Částečné vítězství" # todo: NEW TRANSLATION
 arm_empire.34.t: "Povstání Koncepční strany 'Jednota' selhalo" # todo: NEW TRANSLATION
 arm_empire.34.d: "Koncepční strana „Jednota“ vedená Konstantinem Petrovem se pokusila převzít moc v Moskvě pomocí převratu, ale zvláštní služby tomu dokázaly zabránit. Všichni příznivci jeho strany v regionech byli také zatčeni a vše proběhlo pokojně." # todo: CHANGED
 arm_empire.34.a: "Rusko je opět zachráněno." # todo: NEW TRANSLATION
 arm_empire.34.b: "Ztratili jsme." # todo: NEW TRANSLATION
 arm_empire_news.1.t: "Polská občanská válka" # todo: NEW TRANSLATION
 arm_empire_news.1.d: "Polskem se ujala pro-arménská vláda, kterou Arménie pečlivě podporovala po mnoho let. Ne všechny politické síly v zemi s touto situací souhlasily. Mnoho generálů, stejně jako pro-západní politické strany, uspořádalo povstání k svržení loutkové vlády." # todo: NEW TRANSLATION
 arm_empire_news.1.a: "Chudé Polsko" # todo: NEW TRANSLATION
 arm_empire_news.2.t: "Italská občanská válka" # todo: NEW TRANSLATION
 arm_empire_news.2.d: "V Itálii je krize. Pro-arménská vláda převzala kontrolu nad zemí a v důsledku toho některé politické síly vstoupily do otevřeného ozbrojeného konfliktu s centrální politickou mocí v zemi." # todo: NEW TRANSLATION
 arm_empire_news.2.a: "Chudá Itálie" # todo: NEW TRANSLATION
 arm_empire_news.3.t: "Povstání v regionech Ruska" # todo: NEW TRANSLATION
 arm_empire_news.3.d: "Koncepční strana 'Jednota', vedená Konstantinem Petrovem, selhala v pokusu o uchopení moci v Kremlu; využila však slabost regionálních zvláštních služeb a uspořádala nepokoje v některých regionech Ruska, kde měla silnou podporu." # todo: NEW TRANSLATION
 arm_empire_news.3.a: "Šílenství" # todo: NEW TRANSLATION
 arm_empire_news.4.t: "Spojené státy Arménie" # todo: NEW TRANSLATION
 arm_empire_news.4.d: "Dnes se v Arménii stala historická událost. Arménská vláda oznámila vznik zcela nového státu založeného na principech a zákonech radikálně odlišných od jejich předchůdce, Spojené státy Arménie. Nyní je Arménie jako Spojené státy, ale již v Kavkaze, což je skutečně ohromující událost." # todo: NEW TRANSLATION
 arm_empire_news.4.a: "OK... okay?" # todo: NEW TRANSLATION
 ARM_new_nobility_idea: "Nová šlechta" # todo: NEW TRANSLATION
 ARM_new_nobility_idea_desc: "Novou aristokracii našeho státu netvoří jen staré rody navrácené k jejich titulům, ale také nová, mladá vojenská aristokracie.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud nacionalističtí monarchisté přestanou být u moci." # todo: CHANGED
 ARM_armenian_paganism_idea: "Hetanismus" # todo: NEW TRANSLATION
 ARM_armenian_paganism_idea_desc: "Arménská domorodá víra, též nazývaná Hetanismus, je moderní pohanské nové náboženské hnutí, které se vrací k historickým, předkřesťanským systémům víry a etnickým náboženstvím Arménů." # todo: NEW TRANSLATION
 ARM_glory_of_tigran_idea: "Sláva Tigrana" # todo: NEW TRANSLATION
 ARM_glory_of_tigran_idea_desc: "Obnovení národní hrdosti Arménie prostřednictvím odkazu Tigrana Velikého, starověkého krále, který kdysi vládl říši rozkládající se od Kaspického moře až po Středozemní moře. Nacionalisticko-monarchistické kruhy se dovolávají této historické velkoleposti, aby mobilizovaly podporu pro návrat monarchické vlády a obnovu území.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hnacionalističtí monarchisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_crusade_legacy_idea: "Duch křížových výprav" # todo: NEW TRANSLATION
 ARM_crusade_legacy_idea_desc: "Křesťanská arménská království minulosti mobilizovala své věřící jako křižáky proti sousedním muslimským mocnostem. Nacionalisticko-monarchistická hnutí na tento odkaz navazují, vykreslují arménskou státnost jako křesťanské poslání a shromaždiště proti regionálním rivalům.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hnacionalističtí monarchisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_urheimat_restored_idea: "Obnovená domovina" # todo: NEW TRANSLATION
 ARM_urheimat_restored_idea_desc: "Historické srdce arménského národa se rozkládá v anatolských vysočinách a na Jižním Kavkaze. Nacionalisticko-monarchistická ideologie se soustředí na obnovení arménské svrchovanosti nad těmito starobylými zeměmi a na znovuzískání toho, co je považováno za skutečnou územní domovinu Arménie.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hnacionalističtí monarchisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_tseghakronism_one_idea: "Tseghakronismus" # todo: NEW TRANSLATION
 ARM_tseghakronism_one_idea_desc: "Cegakronismus neboli „národní monarchismus“ je ideologickým programem arménských nacionalisticko-monarchistických hnutí, který spojuje obnovu monarchie s etnickým nacionalismem, územním maximalismem a křesťanským pravoslavným tradicionalismem.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hnacionalističtí monarchisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_renewed_knighthood_idea: "Obnovené rytířství" # todo: NEW TRANSLATION
 ARM_renewed_knighthood_idea_desc: "Obnova arménského feudálního řádu jako modelu moderního vládnutí: válečnická šlechta spojená ctí, bojovou zdatností a loajalitou k obnovené arménské koruně. Nacionalističtí monarchisté hledají paralely mezi starověkými rytířskými řády a současnými vojensko-aristokratickými strukturami.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hnacionalističtí monarchisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_tseghakronism_two_idea: "Tseghakronismus" # todo: NEW TRANSLATION
 ARM_tseghakronism_two_idea_desc: "Rozvoj cegakronismu v komplexní státní ideologii: monarchie, nacionalismus a pravoslavné křesťanství sjednocené jako pilíř arménské civilizace. Stát se stává neoddělitelným od církve a loajalita k trůnu se stává náboženskou i vlasteneckou povinností.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hnacionalističtí monarchisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_state_christianity_idea: "Každý občan je křesťan" # todo: NEW TRANSLATION
 ARM_state_christianity_idea_desc: "Nacionalisticko-monarchistický program staví Arménskou apoštolskou církev do středu jako duši arménského národa. Státní politika prosazuje křesťanské zvyklosti a pravoslavné hodnoty jako základ arménské identity, občanství a společenského řádu.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud §Hnacionalističtí monarchisté§! ztratí moc." # todo: NEW TRANSLATION
 ARM_restore_armenian_empire_tt: "Nyní budeme moci §GZačlenit bývalá území Arménie§!" # todo: NEW TRANSLATION
 ARM_house_elections_warning_tt: "§RMusíme být obezřetní při výběru hlavy rodu§!" # todo: NEW TRANSLATION
 ARM_bagratuni_house_chosen_tt: "§RDům Bagratuni§! se stane vládnoucí dynastií ve státě" # todo: NEW TRANSLATION
 ARM_savoya_house_chosen_tt: "§YDům Savoyů§! se stane vládnoucí dynastií v Arménii!" # todo: NEW TRANSLATION
 ARM_kob_wait_tt: "Budeme nadále §Rzvyšovat§! popularitu přívrženců Koncepční strany 'Unity' v Rusku, dokud nepovažujeme za nutné zahájit §Rrevoluci§!" # todo: NEW TRANSLATION
 ARM_kob_go_tt: "Koncepční strana 'Jednota' bude §Yzahájí§! pokus o převrat §! v Rusku" # todo: NEW TRANSLATION
 ARM_dashnak: "Dašnakcutjun" # todo: CHANGED
 ARM_dashnak_desc: "Jediná politická síla, která má právo vládnout Arménii, je bezpochyby Dashnaktsutyun, nejstarší strana Arménie, která vedla První republiku Arménie od kolébky. Pouze její levicově nacionalistická agenda může Arménii dovést k velkoleposti." # todo: NEW TRANSLATION
 ARM_legacy_of_fedayi: "Dědictví fedayi" # todo: NEW TRANSLATION
 ARM_legacy_of_fedayi_desc: "Musíme uctívat arménské fedayi, kteří bojovali proti turecké tyranii ve svém minulém století. Musíme se připravit na válku, jinak nás Turci znovu zaútočí a zabijí!" # todo: NEW TRANSLATION
 ARM_end_to_democr: "Konec demokracie" # todo: NEW TRANSLATION
 ARM_end_to_democr_desc: "Je načase přestat budovat iluze a zničit jakýkoli bastion falešné demokracie zřízené v Arménii." # todo: NEW TRANSLATION
 ARM_bring_sefily: "Přiveďte Sefilyana zpět" # todo: NEW TRANSLATION
 ARM_bring_sefily_desc: "Sefilyan byl zbožný Dashnak až do chvíle, kdy vznikající křídlo naší strany začalo Rusku příliš ustupovat. Musíme se opět spojit s NDP!" # todo: NEW TRANSLATION
 ARM_venerate_nemesis: "Uctívat Operaci Nemesis" # todo: NEW TRANSLATION
 ARM_venerate_nemesis_desc: "Operace Nemesis byla program Arménské revoluční federace (Dashnaktsutyun) k atentátům na osmanské pachatele armenijské genocidy a na představitele Ázerbájdžánské demokratické republiky, nejvíce zodpovědné za masakr Arménů během Září dnů 1918 v Baku." # todo: NEW TRANSLATION
 ARM_nzhdehs_thought: "Integrovat Nzhdehovo myšlení" # todo: NEW TRANSLATION
 ARM_nzhdehs_thought_desc: "Garegin Nzhdeh se s Dashnaky na určitou dobu odklonil od naší sociálně-nacionální agendy. Avšak musíme se pokusit začlenit jeho myšlenky do naší filozofie a použít jeho obraz pro propagaci strany." # todo: NEW TRANSLATION
 ARM_soc_nationalism: "Sociální nacionalismus" # todo: NEW TRANSLATION
 ARM_soc_nationalism_desc: "Dašnakcutjun je ve své podstatě socialistická i arménsky nacionalistická strana. Ať už se ve 20. století stalo cokoli, musíme posílit naši ideologii a vybudovat novou Arménii!" # todo: CHANGED
 ARM_just_like_eagle: "Stejně jako Orel z Taronu" # todo: NEW TRANSLATION
 ARM_just_like_eagle_desc: "Používáním Nzhdeistické rétoriky můžeme do našich řad přilákat více arménských nacionalistů a vybudovat skutečnou národní společnost." # todo: NEW TRANSLATION
 ARM_harmonize_economy: "Harmonizace ekonomiky" # todo: NEW TRANSLATION
 ARM_harmonize_economy_desc: "Musíme využít odbory a státní nacionalizaci průmyslu, abychom harmonizovali ekonomiku a brali kapitál z rukou kapitalistů." # todo: NEW TRANSLATION
 ARM_scout_movem_ref: "Reformovat skautské hnutí" # todo: CHANGED
 ARM_scout_movem_ref_desc: "Arménské skautské hnutí je po dlouhou dobu sponzorováno a podporováno Dashnaky. Nyní je musíme militarizovat a vychovat budoucí mladé bojovníky." # todo: NEW TRANSLATION
 ARM_militarized_society: "Militarizovaná společnost" # todo: NEW TRANSLATION
 ARM_militarized_society_desc: "Naše společnost musí být jednou velkou armádou, armádou lidí s duchem odhodlaným rozdrtit naše nepřátele." # todo: CHANGED
 ARM_incr_contr_diaspora: "Zvýšit kontrolu nad diasporou" # todo: NEW TRANSLATION
 ARM_incr_contr_diaspora_desc: "Během jejich historie konfrontací s Tureckem a otázky přežití národa se Arméni spoléhají na vzájemnou spolupráci mezi velkými a malými komunitami. Dobrovolnické ozbrojené skupiny a vliv diaspory se zaměřením na lobování zájmů jsou klíčem k prosperitě Arménie." # todo: NEW TRANSLATION
 ARM_first_republic_decl: "Dědic první republiky" # todo: NEW TRANSLATION
 ARM_first_republic_decl_desc: "Jsme právoplatnými dědici Arménské republiky a je naší posvátnou povinností vrátit celé území naší země!" # todo: NEW TRANSLATION
 ARM_lebanon_coup: "Podpora libanonských Dashnaků" # todo: NEW TRANSLATION
 ARM_lebanon_coup_desc: "Arménská komunita je v Libanonu poměrně politicky aktivní. Můžeme podpořit naši pobočku strany v Libanonu a uspořádat převrat." # todo: NEW TRANSLATION
 ARM_prevail_of_east_looking_ideas: "Vítězství myšlenek orientovaných na východ" # todo: NEW TRANSLATION
 ARM_prevail_of_east_looking_ideas_desc: "Musíme se dívat na politickou agendu i mimo sebe samé. Musíme spolupracovat se všemi, abychom bojovali proti západnímu vlivu!" # todo: NEW TRANSLATION
 ARM_review_all_with_koch: "Obnovování naší aliance s Kocharyanem" # todo: NEW TRANSLATION
 ARM_review_all_with_koch_desc: "Kocharyan dlouho držel naši stranu jako rukojmí svých politických ambicí. Teď, když jsme u moci, můžeme rozhodnout, k čemu nám bude. Kocharyan má výrazný vliv na arménskou politiku. Můžeme ho využít jako jeden z nástrojů, jak získat vliv v Arménii." # todo: NEW TRANSLATION
 ARM_ishkhan_saghat: "Postoj Ishkhan Saghatelyana" # todo: NEW TRANSLATION
 ARM_ishkhan_saghat_desc: "Postoj Ishkhan Saghatelyana je mnohem umírněnější v sociálních politikách, avšak je velmi proslulý svými pro-ruskými prohlášeními." # todo: NEW TRANSLATION
 ARM_leftwing_origins: "Přijetí levicových kořenů" # todo: NEW TRANSLATION
 ARM_leftwing_origins_desc: "Musíme si pamatovat kořeny naší strany a vrátit se k myšlenkám marxismu s arménskými rysy." # todo: NEW TRANSLATION
 ARM_marxist_thought_integr: "Integrovat marxistickou myšlenku" # todo: NEW TRANSLATION
 ARM_marxist_thought_integr_desc: "Musíme opět začlenit marxistickou myšlenku do naší sociálně-nacionální agendy a vybudovat skutečně revoluční stát!" # todo: NEW TRANSLATION
 ARM_spirit_of_revol: "Duch revoluce" # todo: NEW TRANSLATION
 ARM_spirit_of_revol_desc: "Musíme z naší země učinit předvoj revoluce. Revoluce proti tureckému imperialismu!" # todo: CHANGED
 ARM_revol_selhoz: "Zemědělská revoluce" # todo: NEW TRANSLATION
 ARM_revol_selhoz_desc: "Naše země musí být soběstačná v potravinách, velká část půdy zůstává nevyužita pro zemědělské potřeby, je na čase to napravit!" # todo: NEW TRANSLATION
 ARM_seize_oligs_stuff: "Zabavení majetku oligarchů" # todo: NEW TRANSLATION
 ARM_seize_oligs_stuff_desc: "Oligarchové musí být podmaněni naším státem a jejich majetek musí být zestátněn!" # todo: NEW TRANSLATION
 ARM_letter_to_russia: "Dopis Rusku" # todo: NEW TRANSLATION
 ARM_letter_to_russia_desc: "Musíme Rusku ukázat, že už nejsou sami v odporu proti liberálnímu Západu!" # todo: NEW TRANSLATION
 ARM_soc_welfare: "Sociální stát" # todo: NEW TRANSLATION
 ARM_soc_welfare_desc: "Nová politická agenda Arménie musí být plně sociálním státem blahobytu, kde je každý občan podporován." # todo: NEW TRANSLATION
 ARM_hold_oligs_gunpoint: "Držet oligarchy na mušce" # todo: NEW TRANSLATION
 ARM_hold_oligs_gunpoint_desc: "Možná bychom neměli být vůči oligarchům tak radikální a znárodnit veškerý jejich majetek, ale musíme zajistit, aby platili vysoké daně a byli dostatečně odpovědní." # todo: CHANGED
 ARM_pkk_negotiat: "Pomoc PKK" # todo: NEW TRANSLATION
 ARM_pkk_negotiat_desc: "Boj našich kurdských bratří musí být podporován a uctíván! Musíme vynaložit veškeré úsilí na podporu jejich kauzy." # todo: NEW TRANSLATION
 ARM_union_states: "Návrh unijního státu" # todo: NEW TRANSLATION
 ARM_union_states_desc: "Nakonec se můžeme pokusit zapojit do projektu spolkového státu pro naši budoucí prosperitu." # todo: NEW TRANSLATION
 ARM_armenia_dashnak_idea: "Dashnak Arménie" # todo: NEW TRANSLATION
 ARM_armenia_dashnak_idea_desc: "Arménská revoluční federace (Dašnakcutjun) usilovala během 20. století o nezávislost a národní osvobození a vyvinula se od socialistických kořenů k nacionalistickým ideálům. Tento zastřešující duch odráží hlubokou organizační přítomnost strany, její podzemní sítě a ideologickou pružnost ve službě arménským národním zájmům.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_dashnak_mitia_idea: "Nové dashnakové milice" # todo: NEW TRANSLATION
 ARM_dashnak_mitia_idea_desc: "Garegin Nzhdeh (Murad), známý jako „Mitia“, ztělesňoval militantní tradice Dašnakcutjunu a partyzánský odpor proti cizí okupaci. Jeho odkaz inspiroval podzemní sítě strany a rétoriku ozbrojeného boje hluboko v 21. století.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_legacy_of_nzhden: "Dědictví Nzhdeha" # todo: NEW TRANSLATION
 ARM_legacy_of_nzhden_desc: "Dašnakcutjun se dovolával Nzhdehovy vize sjednocené a nezávislé Arménie osvobozené od imperiální kontroly a přizpůsoboval jeho ideologii modernímu nacionalismu a socialismu. Jeho filozofie inspirovala decentralistické tendence strany a nedůvěru k centralizované cizí vládě.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_anti_imperialism: "Antiemperialismus" # todo: NEW TRANSLATION
 ARM_anti_imperialism_desc: "Dašnakcutjun kritizoval arménskou závislost na ruských a západních imperiálních mocnostech a prosazoval národní sebeurčení a hospodářskou autonomii. Tento antiimperialistický postoj oslovoval levicové i nacionalistické skupiny usilující o skutečnou arménskou svrchovanost.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_dashnak_militarism: "Dashnak militarismus" # todo: NEW TRANSLATION
 ARM_dashnak_militarism_desc: "Dašnakcutjun zdůrazňoval ozbrojený boj a vojenskou připravenost jako nezbytné pro národní přežití a nezávislost. Strana pěstovala polovojenské tradice a podporovala modernizaci armády, přičemž konflikty Arménie vnímala jako existenční, nikoli vyjednatelné.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_dashnak_increase_economic_growth_tt: "§YVáš ekonomický růst bude zvýšen!§!" # todo: NEW TRANSLATION
 ARM_great_trial_radi: "Příprava na Velký soud" # todo: NEW TRANSLATION
 ARM_great_trial_radi_desc: "Dašnakcutjun vykresloval historické utrpení Arménie, od osmanské genocidy po sovětskou nadvládu, jako „velkou zkoušku“, která zformovala národní charakter a revoluční odhodlání. Tento příběh ospravedlňoval neústupný postoj strany k suverenitě a její odpor ke kompromisům s cizími mocnostmi.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_class_strugle: "Arménský třídní boj" # todo: NEW TRANSLATION
 ARM_class_strugle_desc: "Socialistické dědictví Dašnakcutjunu stavělo třídní boj do neoddělitelné souvislosti s národním osvobozením a kritizovalo kapitalistické elity i sovětské byrokraty jako utlačovatele. Strana vykreslovala dělníky a rolníky jako skutečné činitele arménského národního vykoupení.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_arm_revolt_dashnak: "Arménská revoluce" # todo: NEW TRANSLATION
 ARM_arm_revolt_dashnak_desc: "Dašnakcutjun během své historie organizoval ozbrojená povstání proti cizí okupaci, od Osmanské říše po Sovětský svaz. Podzemní sítě strany vedly povstání a sabotáže a ozbrojené povstání považovaly za jedinou cestu ke skutečné nezávislosti.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_arm_revolt_selhoz: "Zemědělská revoluce" # todo: NEW TRANSLATION
 ARM_arm_revolt_selhoz_desc: "Dašnakcutjun mobilizoval venkovské a zemědělské pracovníky (sovchozy za sovětské vlády) do svých organizačních sítí a zdůrazňoval úlohu rolnictva v národním osvobození. Agrární socialismus se stal pilířem populistické přitažlivosti strany na arménském venkově.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
 ARM_social_welfare_reform_idea: "Reforma sociálního systému" # todo: NEW TRANSLATION
 ARM_social_welfare_reform_idea_desc: "Dašnakcutjun prosazoval sociální zabezpečení, pracovní práva a ochranu zranitelných jako morální imperativy spojené s přežitím a solidaritou Arménie. Strana podporovala družstevní hospodářství a vzájemnou pomoc a stavěla se do role ochránce chudých před kapitalismem i zkorumpovanou oligarchií.\n§W--------------§!\nTento národní duch bude §ROdebrán§!, pokud moc nedrží ani §Hanarchističtí komunisté§!, ani §Hnacionalističtí fašisté§!." # todo: NEW TRANSLATION
