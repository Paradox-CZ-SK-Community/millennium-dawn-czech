 ARM_army_category: "[ARM.GetFlag]Arménská armáda" # todo: NEW TRANSLATION
 ARM_army_category_desc: "£text_icon_armarmy Armáda [ARM.GetFlag]§YArménské republiky§! existuje přibližně 10 let a během této doby dokázala projít celou §Rválkou za nezávislost§! §Y[NKR.GetFlag]Arcachu§! v boji proti §Y[AZE.GetFlag]Ázerbájdžánu§!.\n\nMusíme však pamatovat, že [ARM.GetFlag]§Ynaše země§! nevyhnutelně čelí možnosti opakování těchto událostí a musíme být §Gpřipraveni§!, stejně jako £text_icon_armarmy naše armáda." # todo: CHANGED
 ARM_new_decision_army_unlock_tt: "£text_icon_armarmy §YArmáda Arménie§!: §YOdemkne§! Nová rozhodnutí" # todo: NEW TRANSLATION
