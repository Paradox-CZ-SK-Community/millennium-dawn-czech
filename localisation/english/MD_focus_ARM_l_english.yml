 arm_sargsyan.11.d: "Navzdory našim snahám nabídnout jim výhodnou ekonomickou nabídku byla nabídka stále odmítnuta" # todo: NEW TRANSLATION
 arm_sargsyan.11.a: "Špatně" # todo: NEW TRANSLATION
 arm_sargsyan.12.t: "Evropský den v Arménii" # todo: NEW TRANSLATION
 arm_sargsyan.12.d: "Delegace EU v Arménii bude pořádat slavnostní akce v Jerevánu a v různých regionech země, stejně jako informační setkání, výstavy a koncerty věnované činnosti EU v Arménii" # todo: NEW TRANSLATION
