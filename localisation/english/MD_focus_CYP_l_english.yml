l_english:
 CYP_division_of_the_island: "Rozdělený ostrov" # todo: NEW TRANSLATION
 CYP_division_of_the_island_desc: "Zelená linie rozděluje Kypr na dvě části. Severní Kypr zůstává pod tureckou okupací a pravomoc Republiky končí u nárazníkového pásma monitorovaného OSN. Nevyřešené rozdělení oslabuje politickou vůli a drží část obyvatelstva i území mimo náš dosah." # todo: NEW TRANSLATION
 CYP_eu_membership: "Členský stát EU" # todo: NEW TRANSLATION
 CYP_eu_membership_desc: "Kypr vstoupil do Evropské unie v roce 2004 a získal přístup na jednotný trh, strukturální fondy a rámec politické podpory od partnerů Nikósie v Bruselu. Členství utváří hospodářský vývoj ostrova i jeho diplomatický postoj." # todo: NEW TRANSLATION
 CYP_offshore_gas: "Plynárenská pole ve východním Středomoří" # todo: NEW TRANSLATION
 CYP_offshore_gas_desc: "Průzkumné bloky ve vodách výlučné ekonomické zóny potvrdily komerčně využitelné zásoby plynu. Příjmy z těžby a licenční smlouvy přinášejí nový zdroj příjmů a komplikují vztahy s Tureckem, které zpochybňuje části této zóny." # todo: NEW TRANSLATION
 CYP_financial_center: "Regionální finanční centrum" # todo: NEW TRANSLATION
 CYP_financial_center_desc: "Kypr si vybudoval pověst jurisdikce s nízkými daněmi pro holdingové společnosti, lodní registry a mezinárodní kapitálové toky. Toto odvětví přináší značné příjmy ze služeb, ale zároveň přitahuje pozornost kvůli transparentnosti." # todo: NEW TRANSLATION
 CYP_tourism_economy: "Ekonomika založená na cestovním ruchu" # todo: NEW TRANSLATION
 CYP_tourism_economy_desc: "Slunce, pobřeží a starověké památky každoročně přitahují miliony návštěvníků. Cestovní ruch je pilířem kyperského HDP, podporuje pohostinství a maloobchod a zmírňuje část tlaku na dovoz v ekonomice založené na vysoké spotřebě." # todo: NEW TRANSLATION
 CYP_foreign_investment_wave: "Podpora zahraničních investic" # todo: NEW TRANSLATION
 CYP_foreign_investment_wave_desc: "Aktivní program daňových pobídek, investorských víz a bilaterálních záruk otevřel krátké období zvýšených přímých zahraničních investic. Nový kapitál proudí do služeb, nemovitostí a lehkého průmyslu." # todo: NEW TRANSLATION
 CYP_develop_offshore_gas: "Rozvoj plynárenských polí na moři" # todo: NEW TRANSLATION
 CYP_develop_offshore_gas_desc: "Zajistěte průzkumné práce a uzavřete licenční smlouvy, aby se plynárenské bloky ve východním Středomoří dostaly do těžby. Investice je značná, ale úspěšný rozvoj poskytne dlouhodobý zdroj příjmů a posílí kyperské nároky na výlučnou ekonomickou zónu." # todo: NEW TRANSLATION
 CYP_eu_accession_push: "Iniciativa pro hlubší integraci s EU" # todo: NEW TRANSLATION
 CYP_eu_accession_push_desc: "Kypr jedná s Bruselem a klíčovými členskými státy o plné účasti v procesech integrace EU, od kandidatury do Schengenu po upevnění eurozóny. Vytrvalé lobbování posiluje řeckou i evropskou podporu postoje Nikósie ke sporu o ostrov." # todo: NEW TRANSLATION
 CYP_eu_accession_push_cooldown: "Iniciativa pro hlubší integraci s EU se obnovuje" # todo: NEW TRANSLATION
 CYP_bicommunal_talks: "Jednání mezi oběma komunitami" # todo: NEW TRANSLATION
 CYP_bicommunal_talks_desc: "Pozvěte zástupce Severního Kypru ke strukturovanému dialogu pod záštitou OSN. Pokrok bývá zřídka dramatický, ale trvalý kontakt udržuje otevřenou cestu k urovnání a ukazuje Řecku i Evropě, že Nikósie jedná v dobré víře." # todo: NEW TRANSLATION
 CYP_bicommunal_talks_cooldown: "Jednání mezi oběma komunitami se obnovují" # todo: NEW TRANSLATION
 CYP_court_foreign_investment: "Nalákat zahraniční investice" # todo: NEW TRANSLATION
 CYP_court_foreign_investment_desc: "Nabídněte cílené pobídky zahraničním společnostem, které zvažují Kypr jako základnu pro své operace. Počáteční balíček zatíží státní pokladnu, ale úspěšné přilákání kapitálu zvýší příjmy sektoru služeb a na omezenou dobu rozšíří daňovou základnu." # todo: NEW TRANSLATION
 CYP_court_foreign_investment_cooldown: "Nalákání zahraničních investic se obnovuje" # todo: NEW TRANSLATION
 CYP_mobilize_greek_cypriots: "Sjednotit řecké Kypřany" # todo: NEW TRANSLATION
 CYP_mobilize_greek_cypriots_desc: "Nasmerujte státní zdroje na občanská sdružení, církev a diasporu, abyste upevnili podporu vizi Republiky pro tento ostrov. Sebevědomá a organizovaná řeckokyperská komunita posiluje pozici Nikósie v zápasu o budoucnost Kypru." # todo: NEW TRANSLATION
 CYP_mobilize_greek_cypriots_cooldown: "Sjednocování řeckých Kypřanů se obnovuje" # todo: NEW TRANSLATION
 CYP_outreach_to_north: "Překročit Zelenou linii" # todo: NEW TRANSLATION
 CYP_outreach_to_north_desc: "Financujte projekty mezi komunitami, otevírání obchodních cest a tiché kontakty s umírněnými představiteli na Severu. Každý získaný turecký Kypřan, který podpoří společné urovnání vedené Nikósií, oslabuje argumenty pro trvalé rozdělení." # todo: NEW TRANSLATION
 CYP_outreach_to_north_cooldown: "Překročení Zelené linie se obnovuje" # todo: NEW TRANSLATION
 NCY_mobilize_turkish_cypriots: "Sjednotit turecké Kypřany" # todo: NEW TRANSLATION
 NCY_mobilize_turkish_cypriots_desc: "Mobilizujte instituce Severu a podporu Ankary, abyste sjednotili turecké Kypřany kolem existence samostatného státu. Jednotný Sever je obtížnější začlenit do jakéhokoli řeckého řešení." # todo: NEW TRANSLATION
 NCY_mobilize_turkish_cypriots_cooldown: "Sjednocování tureckých Kypřanů se obnovuje" # todo: NEW TRANSLATION
 NCY_settler_program: "Anatolský osidlovací program" # todo: NEW TRANSLATION
 NCY_settler_program_desc: "Pokračujte v dlouhodobé politice přesídlování rodin z pevninské Anatolie na Sever. Demografický posun upevňuje váhu tureckých Kypřanů na ostrově, přestože prohlubuje křivdu na Jihu a vyvolává mezinárodní kritiku." # todo: NEW TRANSLATION
 NCY_settler_program_cooldown: "Anatolský osidlovací program se obnovuje" # todo: NEW TRANSLATION
 CYP_gain_8_strength_TT: "§HŘečtí Kypřané§! §GZÍSKAJÍ§! §H8 síly§!" # todo: NEW TRANSLATION
 CYP_reduce_north_TT: "§HTurečtí Kypřané§! §RZTRATÍ§! §H6 síly§!" # todo: NEW TRANSLATION
 NCY_gain_8_strength_TT: "§HTurečtí Kypřané§! §GZÍSKAJÍ§! §H8 síly§!" # todo: NEW TRANSLATION
 NCY_settler_TT: "§HTurečtí Kypřané§! §GZÍSKAJÍ§! §H6 síly§! a §Hřečtí Kypřané§! §RZTRATÍ§! §H4 síly§!" # todo: NEW TRANSLATION
 cyprus.1.t: "Potvrzeno: Zásoby ve východním Středomoří jsou využitelné" # todo: NEW TRANSLATION
 cyprus.1.d: "Výsledky průzkumu jsou k dispozici. Vrty v blocích Aphrodite a přilehlých oblastech potvrdily zásoby dostatečně velké pro komerční těžbu. Nikósie rychle přistupuje k dokončení licenčních smluv. Turecko vzneslo své námitky diplomatickou cestou, právní základ naší výlučné ekonomické zóny je však pevný." # todo: NEW TRANSLATION
 cyprus.1.a: "Zahájit rozvoj." # todo: NEW TRANSLATION
 cyprus.2.t: "Jednání mezi oběma komunitami: Volba přístupu" # todo: NEW TRANSLATION
 cyprus.2.d: "Delegace řeckých a tureckých Kypřanů se sešly v Nikósii za zprostředkování OSN. Atmosféra je obezřetná. Obě strany mají nevyřešené křivdy a žádná z nich nespěchá s nabídkou ústupků. To, jak zde budeme postupovat, ovlivní další kolo jednání." # todo: NEW TRANSLATION
 cyprus.2.a: "Jednat konstruktivně a předložit konkrétní návrhy." # todo: NEW TRANSLATION
 cyprus.2.b: "Trvat na zásadních postojích a odmítnout učinit první krok." # todo: NEW TRANSLATION
 cyprus.3.t: "Kypr: Silnější místo u evropského stolu" # todo: NEW TRANSLATION
 cyprus.3.d: "Kyperské představitelé se z Bruselu vrátili s výraznější institucionální pozicí než dříve. Partneři z EU uznali důsledné dodržování acquis Nikósií a její aktivní účast v evropských strukturách. Postavení ostrova v Bruselu je vyšší než kdykoli od přistoupení." # todo: NEW TRANSLATION
 cyprus.3.a: "Tento impuls využijeme." # todo: NEW TRANSLATION
 cyprus.4.t: "Zelená linie: Incident v nárazníkovém pásmu" # todo: NEW TRANSLATION
 cyprus.4.d: "Střet na jednom z kontrolních stanovišť nárazníkového pásma přerostl v menší diplomatický incident. Mírové síly OSN obnovily pořádek, obě strany se však navzájem obviňují. Událost znovu rozpoutala v Nikósii debatu o tom, jak reagovat na provokace ze Severu." # todo: NEW TRANSLATION
 cyprus.4.a: "Vydat formální veřejné odsouzení." # todo: NEW TRANSLATION
 cyprus.4.b: "Vznést záležitost u OSN a držet ji mimo média." # todo: NEW TRANSLATION
