 GEO_vardnili_hydro_power_plant: "Vybudovat §Yvodní elektrárnu Vardnili§!" # todo: NEW TRANSLATION
 GEO_vardnili_hydro_power_plant_desc: "Hydroelektrický projekt Vardnili, který se nachází v povodí řeky Alazani, přispěje k portfoliu obnovitelné energie Gruzie a sníží závislost na dovážené elektřině v období špičkové poptávky." # todo: NEW TRANSLATION
 GEO_tvishi_hydro_power_plant: "Vybudovat §Yvodní elektrárnu Tvishi§!" # todo: NEW TRANSLATION
 GEO_tvishi_hydro_power_plant_desc: "Vodní elektrárna Tvishi na řece Cchenisckali představuje významnou investici do gruzínské energetické infrastruktury a využije přirozený spád horských řek západní Gruzie." # todo: NEW TRANSLATION
 GEO_shuakhevi_hydro_power_plant: "Vybudovat §Yvodní elektrárnu Shuakhevi§!" # todo: NEW TRANSLATION
 GEO_shuakhevi_hydro_power_plant_desc: "Kaskádový projekt Shuakhevi v regionu Adžárie využije strmý horský terén k výrobě obnovitelné energie a podpoří jak národní energetickou bezpečnost, tak regionální ekonomický rozvoj." # todo: NEW TRANSLATION
 GEO_samtskhe_javakheti_hydro_power_plant: "Vybudovat §Yvodní elektrárnu Samcche-Džavacheti§!" # todo: NEW TRANSLATION
 GEO_samtskhe_javakheti_hydro_power_plant_desc: "Rozvoj hydroelektrické kapacity v regionu Samcche-Džavacheti přinese moderní infrastrukturu do této historicky zaostalé oblasti a zároveň využije její bohaté vodní zdroje." # todo: NEW TRANSLATION
 GEO_nenskra_hydro_power_plant: "Vybudovat §Yvodní elektrárnu Nenskra§!" # todo: NEW TRANSLATION
 GEO_nenskra_hydro_power_plant_desc: "Hydroelektrický projekt Nenskra ve Svanetii patří mezi největší plánované energetické projekty Gruzie a slibuje značnou výrobu elektřiny pro pokrytí rostoucí domácí poptávky i exportní potenciál." # todo: NEW TRANSLATION
 GEO_namakhvani_hydro_power_plant: "Vybudovat §Yvodní elektrárnu Namakhvani§!" # todo: NEW TRANSLATION
 GEO_namakhvani_hydro_power_plant_desc: "Kaskáda Namakhvani na řece Rioni využije jednu z hlavních vodních cest západní Gruzie a poskytne značnou hydroelektrickou kapacitu ke snížení závislosti na výrobě elektřiny z tepelných elektráren." # todo: NEW TRANSLATION
