 GEO_dilos: "Dilos" # todo: NEW TRANSLATION
 GEO_dilos_desc: "Spolupráce s Řeckem na námořních technologiích a plavidlech třídy torpédoborců zmodernizuje gruzínské černomořské loďstvo prostřednictvím partnerství se zkušenou středomořskou námořní mocností." # todo: NEW TRANSLATION
