l_english:
 georgia_focus: "Gruzijský strom zaměření" # todo: NEW TRANSLATION
 GEO_gergiandream2013: "Gruzijský strom zaměření" # todo: NEW TRANSLATION
 GEO_gergiandream2013_desc: "Gruzínský sen je skutečnou stranou, která by měla mít mandát vládnout Gruzii." # todo: CHANGED
 GEO_crush_opposition_dreams: "Zničte sny opozice" # todo: NEW TRANSLATION
 GEO_crush_opposition_dreams_desc: "Zničení ubohé opozice je jediná skutečná cesta, jak rozvíjet Gruzii. Zahraniční agenti chtějí zničit naši zemi! Nesmíme to dopustit!" # todo: NEW TRANSLATION
 GEO_accept_turkish_capital: "Přijmout turecký kapitál" # todo: NEW TRANSLATION
 GEO_accept_turkish_capital_desc: "Přijetí tureckého kapitálu je velmi důležité a musí nám něco přinést." # todo: NEW TRANSLATION
 GEO_geo_elections2013: "Volby v roce 2013" # todo: CHANGED
 GEO_geo_elections2013_desc: "Dne 27. října 2013 se v Gruzii konaly prezidentské volby." # todo: CHANGED
 GEO_stren_garrisons: "Posílit severní posádky" # todo: CHANGED
 GEO_stren_garrisons_desc: "Posílení posádek na severních hranicích zajistí, že už nebudeme čelit takovým situacím." # todo: NEW TRANSLATION
 GEO_pankis_resolve: "Vyřešit konflikt v Pankiském kaňonu" # todo: NEW TRANSLATION
 GEO_pankis_resolve_desc: "Konečně bychom měli ukončit chaos, který panuje na hranici s Ruskem, a zajistit naši zemi." # todo: CHANGED
 GEO_sng_unite: "Spojit se se SNS" # todo: NEW TRANSLATION
 GEO_sng_unite_desc: "SNS - Ó můj Bože, kolik štěstí a vzájemné spolupráce je na této modré vlajce. Nemohu odolat..." # todo: NEW TRANSLATION
 GEO_shervad_victory: "Shevardnadzeho vítězství!" # todo: CHANGED
 GEO_shervad_victory_desc: "Shevardnadze vyhrál volby. Nyní musí uklidnit situaci." # todo: CHANGED
 GEO_epoch_of_peace: "Éra míru" # todo: CHANGED
 GEO_epoch_of_peace_desc: "Období míru by mělo nastat v Gruzii. Musíme prosperovat bez jakékoli války." # todo: NEW TRANSLATION
 GEO_give_passports_to_everyone: "Pasy pro všechny!" # todo: CHANGED
 GEO_give_passports_to_everyone_desc: "Rozšíření programů občanství posílí demografické postavení Gruzie a začlení obyvatelstvo diaspory, může však vyvolat diplomatické napětí se sousedními státy." # todo: CHANGED
 GEO_tskinvali_attack: "Plán útoku Tygra – Plánovaná operace k navrácení Osetie Gruzii. Možná stojí za to vzít tento riskantní krok." # todo: NEW TRANSLATION
 GEO_tskinvali_attack_desc: "Tiger Attack Plan - A planned operation to return Ossetia to Georgia. Perhaps it is worth taking this risky step." # todo: NEW TRANSLATION
 GEO_pmc_support_instr: "Pozvat instruktory PMC" # todo: NEW TRANSLATION
 GEO_pmc_support_instr_desc: "Potřebujeme pomoc kvalifikovaných vojenských instruktorů, abychom úspěšně zorganizovali naši armádu a získali další efektivitu pro budoucí útok." # todo: NEW TRANSLATION
 GEO_fail_war_geo2008: "Porážka ve Válce 2008" # todo: NEW TRANSLATION
 GEO_fail_war_geo2008_desc: "Válka proti Rusku v roce 2008 skončila pro Gruzii ponižující porážkou, když ruské síly postoupily hluboko na gruzínské území. Jižní Osetie a Abcházie jsou nyní ztraceny, naše armáda je rozdrcena a sen o územní celistvosti se zdá být vzdálenější než kdy dříve." # todo: CHANGED
 GEO_win_war_geo2008: "Vítězství ve Válce 2008" # todo: NEW TRANSLATION
 GEO_win_war_geo2008_desc: "Navzdory všem očekáváním Gruzie vyšla z války v roce 2008 vítězně! Ruské síly byly odraženy a znovu jsme získali Jižní Osetii a Abcházii. Tento ohromující vojenský úspěch změní geopolitickou situaci na Kavkaze a zajistí územní celistvost Gruzie." # todo: CHANGED
 GEO_nato_in_georgia: "Síly NATO v Gruzii" # todo: NEW TRANSLATION
 GEO_nato_in_georgia_desc: "Požádání NATO o nasazení pozemních sil v Gruzii poskytne okamžité bezpečnostní záruky proti ruské agresi a prokáže západní odhodlání podporovat gruzínskou suverenitu, hrozí však vyostřením regionálního napětí." # todo: CHANGED
 GEO_osset_abkhaz_priznat: "Uznat Abcházii a Osetii" # todo: NEW TRANSLATION
 GEO_osset_abkhaz_priznat_desc: "Nastal čas uznat Jižní Osetii a Abcházii ve snaze zajistit mír pro náš národ i nyní nezávislé regiony." # todo: CHANGED
 GEO_diplomatic_requests_fromrussia: "Diplomatické žádosti Ruska" # todo: CHANGED
 GEO_diplomatic_requests_fromrussia_desc: "Rusko podniká vůči Gruzii diplomatické kroky ve snaze normalizovat vztahy a dosáhnout možných dohod o obchodu, bezpečnosti a statusu sporných území. Tyto žádosti vyžadují pečlivé zvážení strategických zájmů Gruzie." # todo: CHANGED
 GEO_join_nato_geo: "Přidejte se k NATO" # todo: NEW TRANSLATION
 GEO_join_nato_geo_desc: "Vstup do NATO nabídne ochranu a bezpečnost před jakýmkoli agresorem bez ohledu na jeho velikost. Spojenectví se Západem také zajistí naši bezpečnost do budoucna." # todo: CHANGED
 GEO_bezhenci_help_of_uf: "Pomoc uprchlíkům" # todo: NEW TRANSLATION
 GEO_bezhenci_help_of_uf_desc: "Musíme vyměnit uprchlíky s Osetií, abychom měli jistotu, že na hranici nedojde k napětí kvůli etnickým osadám na druhé straně hranice." # todo: NEW TRANSLATION
 GEO_we_will_not_forget: "Nezapomeneme" # todo: NEW TRANSLATION
 GEO_we_will_not_forget_desc: "Gruzie se nikdy nebude moci zahojit z ran, které jí způsobila pětidenní válka, ani z následků, které přinesla." # todo: CHANGED
 GEO_peace_deals_with_russia: "Dohody o míru s Ruskem" # todo: NEW TRANSLATION
 GEO_peace_deals_with_russia_desc: "Rusko se může snažit podkopat naši moc na Kavkaze, ale zjevnou pravdou je, že nás nechce dobýt. Bude pro nás mnohem výhodnější podepsat s ním pakt o neútočení a pokračovat v naší západní cestě bez Jižní Osetie a Abcházie." # todo: CHANGED
 GEO_constitutional_reforms: "Ústavní reformy" # todo: NEW TRANSLATION
 GEO_constitutional_reforms_desc: "Bez ohledu na výsledek bychom neměli zaplétat Gruzii do žádného konfliktu po tomto." # todo: NEW TRANSLATION
 GEO_anti_corruption_measures: "Protikorupční opatření" # todo: NEW TRANSLATION
 GEO_anti_corruption_measures_desc: "Korupce nás vedla k nadměrnému využívání rozpočtu na různé aspekty vlády, které už nejsou relevantní. Měli bychom to změnit." # todo: NEW TRANSLATION
 GEO_stop_the_war_geo: "Zastavte válku" # todo: NEW TRANSLATION
 GEO_stop_the_war_geo_desc: "Je nutné jednou provždy zastavit válku s Republikány. Nesmíme dovolit, aby naše neshody vedly k válce mezi námi." # todo: NEW TRANSLATION
 GEO_ukrainian_volunteers_unso: "Pozvat UNA-UNSO" # todo: NEW TRANSLATION
 GEO_ukrainian_volunteers_unso_desc: "Musíme pozvat bojovníky z UNA-UNSO do Gruzie na další válku. Jsou ideologicky připraveni za nás bojovat." # todo: NEW TRANSLATION
 GEO_us_help_in_war_geo: "Požádat USA o pomoc" # todo: NEW TRANSLATION
 GEO_us_help_in_war_geo_desc: "Je nutné požádat o pomoc Spojené státy a plně se připravit na ozbrojený konflikt nákupem potřebných zbraní." # todo: CHANGED
 GEO_chechen_boevik_help2008: "Pozvat Ichkerijské bojovníky" # todo: NEW TRANSLATION
 GEO_chechen_boevik_help2008_desc: "Kdysi jsme měli kontakty s čečenskými bojovníky z Ichkerie, ještě v době před Růžovou revolucí." # todo: CHANGED
 GEO_prepare_for2008_war: "Připravit se na válku v roce 2008!" # todo: CHANGED
 GEO_prepare_for2008_war_desc: "Měli bychom se pokusit o zvláštní operaci a rychlou blitzkriegovou anexi Jižní Osetie, aby se Rusko nemohlo zareagovat a vyrovnalo se s faktem anexace Osetie." # todo: NEW TRANSLATION
 GEO_compromiss_with_russia: "Kompromis s Ruskem" # todo: NEW TRANSLATION
 GEO_compromiss_with_russia_desc: "Nabídneme Rusku plnohodnotnou dohodu o uznání pseudo-republik, potom se stanou ... plnohodnotnými republikami. Možná jen to osvobodí Gruzii od břemene neuznaných území a my budeme moci navázat plnohodnotnou diplomacii." # todo: NEW TRANSLATION
 GEO_osset_abkhaz_let: "Nechte Osetii a Abcházii odejít" # todo: NEW TRANSLATION
 GEO_osset_abkhaz_let_desc: "Měli bychom nechat Osetii a Abcházii jít ve jménu prosperity a vzájemné spolupráce." # todo: NEW TRANSLATION
 GEO_befriend_azeri_geo: "Spřátelit se s Ázerbájdžánem" # todo: NEW TRANSLATION
 GEO_befriend_azeri_geo_desc: "Ázerbájdžán má s námi stejný diplomatický pohled; měli bychom si vzájemně být spojenci." # todo: NEW TRANSLATION
 GEO_befriend_eu: "Spřátelit se s EU" # todo: NEW TRANSLATION
 GEO_befriend_eu_desc: "Měli bychom usilovat o vstup do EU. Je to volba naší civilizace." # todo: NEW TRANSLATION
 GEO_geo_elections2008: "§02008 Volby§!" # todo: NEW TRANSLATION
 GEO_geo_elections2008_desc: "Dne 5. ledna 2008 se v Gruzii konaly prezidentské volby." # todo: CHANGED
 GEO_government_strenght: "Posílit vládu" # todo: NEW TRANSLATION
 GEO_government_strenght_desc: "Saakašvili musí zvýšit vliv vlády a upevnit svou autoritu, aniž by poškodil demokracii. Začátek každodenní práce na vytvoření jasného postoje vyžaduje analýzu nových návrhů." # todo: CHANGED
 GEO_kill_zhvania: "Odstranit Zhvania" # todo: NEW TRANSLATION
 GEO_kill_zhvania_desc: "I když Zurab Zhvania pomáhal naší zemi v počátečních fázích revoluce a vzniku, začal nám příliš zasahovat, žádal, aby prezidentovy pravomoci byly omezeny. Má na nás velké množství kompromitujících důkazů a neměli bychom mu to jen tak dovolit..." # todo: NEW TRANSLATION
 GEO_demograph_crisis_oh: "Vypořádat se s demografickou krizí" # todo: NEW TRANSLATION
 GEO_demograph_crisis_oh_desc: "Vypořádání se s demografickou krizí je nezbytný krok k vybudování prosperujícího gruzínského státu." # todo: NEW TRANSLATION
 GEO_compromiss_oppos: "Kompromis s opozicí" # todo: NEW TRANSLATION
 GEO_compromiss_oppos_desc: "Jsme demokracie. Měli bychom naslouchat opozici, pokud chce od nás konkrétní reformy, i když to v krátkodobém horizontu poškodí naši vládu." # todo: NEW TRANSLATION
 GEO_babax_po_oppos: "Násilně zastavte opozici" # todo: NEW TRANSLATION
 GEO_babax_po_oppos_desc: "Nesmíme dovolit opozici podkopat naši politickou cestu a rozhodnutí. Drsné metody je jistě umlčí." # todo: NEW TRANSLATION
 GEO_befriend_ukraine_geo: "Spřátelit s Ukrajinou" # todo: NEW TRANSLATION
 GEO_befriend_ukraine_geo_desc: "Ukrajina vždy usilovala o stejné ideály jako my. Dlouho jsme byli spolupořadateli v GUAM. Vztahy je potřeba posunout na další úroveň." # todo: NEW TRANSLATION
 GEO_send_troops_toiraq: "Vyslat naše jednotky do Iráku" # todo: NEW TRANSLATION
 GEO_send_troops_toiraq_desc: "Měli bychom poslat naše jednotky do Iráku, abychom získali zkušenosti v nové válce a pochopili strategii americké vojenské taktiky. To nám prospěje." # todo: NEW TRANSLATION
 GEO_adjara_crisis: "Adjarská krize" # todo: NEW TRANSLATION
 GEO_adjara_crisis_desc: "Adjarská krize, také známá jako Adjarská revoluce či Druhá Růžová revoluce, byla politická krize v Autonomní republice Adžarská v Gruzii, tehdy pod vedením Aslana Abashidzeho, který se odmítl podřídit centrálním úřadům po sesazení prezidenta Eduarda Ševardnadzého během Růžové revoluce v listopadu 2003." # todo: NEW TRANSLATION
 GEO_political_reforms_saak: "Saakashviliho politické reformy" # todo: NEW TRANSLATION
 GEO_political_reforms_saak_desc: "Saakashviliho reformy a jeho přístup k řízení země mohou pomoci. Je nutné zavést nové metody řízení, protože každodenní praxe ukazuje, že konzultace se širokým spektrem zdrojů přispívá k přípravě a realizaci směrů pro progresivní rozvoj." # todo: NEW TRANSLATION
 GEO_kviciani_myatezh: "Kvicianiho povstání" # todo: NEW TRANSLATION
 GEO_kviciani_myatezh_desc: "Kviciani vyvolal povstání v údolí Kodori, měli bychom převzít kontrolu nad situací." # todo: NEW TRANSLATION
 GEO_clear_adjaria: "Vyčistit Adjarii" # todo: NEW TRANSLATION
 GEO_clear_adjaria_desc: "Je čas očistit Adjarii od disidentů a integrovat Adjarii do plnohodnotného formátu a donutit Abashidze odstoupit." # todo: NEW TRANSLATION
 GEO_discuss_adjara_release: "Diskutovat o uvolnění Adjarii" # todo: NEW TRANSLATION
 GEO_discuss_adjara_release_desc: "Možná bychom měli Abashidze dát větší autonomii, ale udržet je pod dohledem. Snad to posílí naši zemi." # todo: NEW TRANSLATION
 GEO_deal_with_turkey_adjara: "Dohodnout se s Tureckem na Adjarii" # todo: NEW TRANSLATION
 GEO_deal_with_turkey_adjara_desc: "Je načase podepsat relevantní dohody s Tureckem o spolupráci na tématu Adjary. Vzájemná spolupráce bude dobrým záminkou pro zlepšení vztahů." # todo: NEW TRANSLATION
 GEO_close_monadire: "Uzavřít Monadire" # todo: NEW TRANSLATION
 GEO_close_monadire_desc: "Monadire by měl být zakázán a Kviciani uvězněn. Není jiná volba!" # todo: NEW TRANSLATION
 GEO_clear_dissidents_monadire: "Vyčistit Monadire disidenty" # todo: NEW TRANSLATION
 GEO_clear_dissidents_monadire_desc: "Čistka je jediná životaschopná varianta!" # todo: NEW TRANSLATION
 GEO_allow_kviciani: "Povolit Kviciani" # todo: NEW TRANSLATION
 GEO_allow_kviciani_desc: "Měli bychom povolit Kvicianiho činnost a dosáhnout s ním dohody." # todo: CHANGED
 GEO_deal_with_monadire: "Jednat s Monadire" # todo: NEW TRANSLATION
 GEO_deal_with_monadire_desc: "Jednání s nimi je nejlepší možností pro naši vládu." # todo: NEW TRANSLATION
 GEO_rustavitwo: "Přepadnout Rustavi 2!" # todo: CHANGED
 GEO_rustavitwo_desc: "Rustavi 2 je opoziční gruzínský kanál, který neustále zasahuje do naší vlády. Možná bychom měli zaútočit na jejich vysílací základnu a vypnout je. To však může vést k nepředvídaným důsledkům..." # todo: NEW TRANSLATION
 GEO_geo_elections2003: "Volby v roce 2003" # todo: CHANGED
 GEO_geo_elections2003_desc: "Volby 2003" # todo: NEW TRANSLATION
 GEO_another_victory_shervad: "Další vítězství Ševardnadzeho" # todo: NEW TRANSLATION
 GEO_another_victory_shervad_desc: "Shevardnadze znovu zvítězil, ale obyvatelstvo ho nepodporuje. Musíme jeho ubohou vládu svrhnout pokojnou cestou." # todo: CHANGED
 GEO_rose_revolution: "Růžová revoluce!" # todo: NEW TRANSLATION
 GEO_rose_revolution_desc: "Je čas začít Růžovou revoluci a učinit Gruzii skutečně demokratickou. Saakašvili nás povede k velikosti!" # todo: NEW TRANSLATION
 GEO_vneochered_elections: "Nové svobodné volby" # todo: NEW TRANSLATION
 GEO_vneochered_elections_desc: "Nyní nastal čas uspořádat nové volby v Gruzii férově a skutečně." # todo: NEW TRANSLATION
 GEO_unn_kodor: "OSN jednotky v Pankiských a Kodorských kaňonech" # todo: NEW TRANSLATION
 GEO_unn_kodor_desc: "Nyní bychom měli do nestabilních oblastí umístit jednotky OSN, abychom zajistili stabilitu." # todo: CHANGED
 GEO_russians_leave_abkhaz: "Požádat o stažení Rusů" # todo: CHANGED
 GEO_russians_leave_abkhaz_desc: "Situace v Abcházii se od té v Osetii značně liší. Abcházci nejsou ve svém diplomatickém postoji konstruktivní a jsou mnohem nepřátelštější než Osetinci. Musíme požádat Rusy, aby Abcházii opustili, a zároveň jim slíbit, že na ně nezaútočíme. Kviciani a Gelaev by měli přestat s tím, co dělají. Musíme tam rozmístit hlídky OSN, abychom zajistili stabilitu." # todo: CHANGED
 GEO_release_boeviks: "Propusť Nokhchas" # todo: NEW TRANSLATION
 GEO_release_boeviks_desc: "Tito čečenští bojovníci se mohou hodit, pokud Gruzie jednoho dne změní svůj geopolitický směr. Měli bychom je poslat do třetích zemí." # todo: CHANGED
 GEO_give_boevikstorussia: "Odevzdejte Boeviky Rusku" # todo: NEW TRANSLATION
 GEO_give_boevikstorussia_desc: "Tito čečenští teroristé by měli být posláni zpět tam, odkud přišli, i kdyby to znamenalo oslabení vládní autority." # todo: CHANGED
 GEO_help_chechens_pankis: "Čečenské Boeviks v gruzínských kaňonech" # todo: NEW TRANSLATION
 GEO_help_chechens_pankis_desc: "Kvůli nestabilitě v Čečensku překračuje hranice mnoho čečenských bojovníků a terorizuje místní obyvatelstvo. Musíme tuto situaci řešit." # todo: CHANGED
 GEO_ensure_for_russians: "Zajištění pro Rusy" # todo: NEW TRANSLATION
 GEO_ensure_for_russians_desc: "Musíme oslovit ruské představitele, abychom konflikt v rokli vyřešili účinněji." # todo: CHANGED
 GEO_ustupki_russia: "Ústupky Rusku" # todo: CHANGED
 GEO_ustupki_russia_desc: "Možná budeme muset Rusku svěřit více pravomocí nad naším politickým směrováním, abychom si udrželi moc." # todo: NEW TRANSLATION
 GEO_pokrov_of_west: "Západní ochrana" # todo: CHANGED
 GEO_pokrov_of_west_desc: "Eduard měl po dlouhou dobu různá spojení se západními zeměmi. Možná stojí za to změnit směr země a opustit našeho vládce." # todo: NEW TRANSLATION
 GEO_russian_mil_in_geo: "Ruská armáda v Gruzii" # todo: NEW TRANSLATION
 GEO_russian_mil_in_geo_desc: "Měli bychom přijmout naše vztahy s Ruskem a zajistit ruskou vojenskou přítomnost v Gruzii." # todo: NEW TRANSLATION
 GEO_agreements_with_turks: "Strategické pakt se Tureckem" # todo: NEW TRANSLATION
 GEO_agreements_with_turks_desc: "Měli bychom posílit naše vztahy s Tureckem a zajistit vojenskou přítomnost NATO v Gruzii." # todo: NEW TRANSLATION
 GEO_start_talks_with_russia: "Větší styky s Východem" # todo: NEW TRANSLATION
 GEO_start_talks_with_russia_desc: "Ahoj, post-sovětské báby, buďme kamarádi." # todo: NEW TRANSLATION
 GEO_vygod_svet: "Větší styky se Západem" # todo: NEW TRANSLATION
 GEO_vygod_svet_desc: "Ahoj, evropské babičky z NATO, buďme kamarádi." # todo: NEW TRANSLATION
 GEO_georgian_capital_for_west: "Integrace gruzínského a západního trhu" # todo: NEW TRANSLATION
 GEO_georgian_capital_for_west_desc: "Je čas orientovat náš trh na západ a znovu vybudovat naši ekonomiku." # todo: NEW TRANSLATION
 GEO_kill_oppos_leaders: "Zabít vůdce opozice" # todo: NEW TRANSLATION
 GEO_kill_oppos_leaders_desc: "Je čas ukončit polovičatá opatření a utrhnout hlavu hada. Musíme zabít vůdce opozice." # todo: NEW TRANSLATION
 GEO_deport_oppos: "Vyhostit vůdce opozice" # todo: NEW TRANSLATION
 GEO_deport_oppos_desc: "Možná nemáme být tak radikální. Můžeme vyhostit nebo uvěznit vůdce opozice." # todo: NEW TRANSLATION
 GEO_befriend_armenia: "Navázat přátelské vztahy s Arménií" # todo: NEW TRANSLATION
 GEO_befriend_armenia_desc: "Arménie je naším nejstarším a stálým sousedem. Je nutné zlepšit bilaterální vztahy na základě vzájemného porozumění." # todo: NEW TRANSLATION
 GEO_djavakhk_compromiss: "Dojednání kompromisu o Djavakhq" # todo: NEW TRANSLATION
 GEO_djavakhk_compromiss_desc: "Na jihu Gruzie žije velké množství Arménů. Arménie pro ně nikdy nepožadovala samostatnost ani nic podobného, ale stojí za to dát jim více autonomie pro další integraci." # todo: NEW TRANSLATION
 GEO_vassal_of_russia: "Smlouva o unii s Ruskem" # todo: NEW TRANSLATION
 GEO_vassal_of_russia_desc: "Musíme podepsat konečnou smlouvu s Ruskem o vzájemné obraně a hospodářské spolupráci." # todo: NEW TRANSLATION
 GEO_priznat_abkhazosset: "Federace Gruzie" # todo: NEW TRANSLATION
 GEO_priznat_abkhazosset_desc: "Není možné uznat pseudo-republiky Abcházie a Jižní Osetie, ale Gruzii můžeme federalizovat pod tlakem Ruska. To však znamená významný vliv Ruska na nás." # todo: NEW TRANSLATION
 GEO_biggest_influencer_soo_tt: "Vyžaduje, aby Gruzie byla největším ovlivňovatelem Jižní Osetie" # todo: NEW TRANSLATION
 GEO_biggest_influencer_abk_tt: "Vyžaduje, aby Gruzie byla největším ovlivňovatelem Abcházie" # todo: NEW TRANSLATION
 GEO_change_course_of_party: "Změnit kurz strany" # todo: NEW TRANSLATION
 GEO_change_course_of_party_desc: "Staré Strany Ševardnadze není tou správnou cestou. Je čas ji změnit a podřídit si ostatní prozápadní strany." # todo: NEW TRANSLATION
 GEO_nato_help_shervad: "NATO pomoc Gruzii" # todo: NEW TRANSLATION
 GEO_nato_help_shervad_desc: "Je čas požádat NATO o větší pomoc pro Gruzii. Jsme na to připraveni." # todo: NEW TRANSLATION
 GEO_status_of_ossetabkhaz_demand: "Požadujte status pseudo-republik" # todo: NEW TRANSLATION
 GEO_status_of_ossetabkhaz_demand_desc: "Přestaňte s hledáním polovičatých řešení a začněte vyžadovat bezpodmínečný vstup těchto republik do našeho členství!" # todo: NEW TRANSLATION
 GEO_prowestern_shervad: "Pro-západní diplomacie" # todo: NEW TRANSLATION
 GEO_prowestern_shervad_desc: "Musíme nadále sledovat západní ideály svobody a liberalismu, a proto musíme zlepšit naše vztahy se západními partnery." # todo: NEW TRANSLATION
 GEO_reactionary_shervad: "Přerušit vztahy s EU!" # todo: CHANGED
 GEO_reactionary_shervad_desc: "Nedovolme EU ovlivňovat naši zemi jakkoli. Politicky ani ekonomicky." # todo: NEW TRANSLATION
 GEO_russina_spy_clear: "Vyčistěte ruské špióny" # todo: NEW TRANSLATION
 GEO_russina_spy_clear_desc: "Ruští špióni korumpují naši zemi! Musíme se jich okamžitě zbavit!" # todo: NEW TRANSLATION
 GEO_join_eaes: "Připojit se k EACU" # todo: NEW TRANSLATION
 GEO_join_eaes_desc: "Musíme být integrováni do EACU. Proč se zabývat hospodářským otrokářstvím EU, když můžeme volně obchodovat s našimi sousedy?" # todo: NEW TRANSLATION
 GEO_national_propaganda: "Národní propaganda" # todo: NEW TRANSLATION
 GEO_national_propaganda_desc: "Musíme našim rozličným lidem ukázat, že Rusko není jen naším spolehlivým ekonomickým partnerem a spojencem, ale také naším přítelem, bratrem a přirozeným ochráncem!" # todo: NEW TRANSLATION
 GEO_open_door_toeasterninvestments: "Otevřené dveře východním investicím" # todo: CHANGED
 GEO_open_door_toeasterninvestments_desc: "Ruské peníze budou proudit do žil gruzinské ekonomiky a naplní naši touhu po hospodářském blahobytu. Tak poetické!" # todo: NEW TRANSLATION
 GEO_soviet_legacy_pol: "Sovětské dědictví" # todo: NEW TRANSLATION
 GEO_soviet_legacy_pol_desc: "Nesmíme zapomenout, odkud jsme získali nezávislost a s kým jsme byli spojeni od dob SSSR. Měli bychom přijmout naše vzájemné dědictví." # todo: NEW TRANSLATION
 GEO_join_csto: "Připojit se k CSTO" # todo: NEW TRANSLATION
 GEO_join_csto_desc: "Arménie a Rusko jsou v CSTO. Snad když posílíme naše společné hranice a vojenskou spolupráci, skutečně zlepšíme bezpečnost naší země..." # todo: NEW TRANSLATION
 GEO_embargo_turkey: "Podkopat turecký vliv" # todo: NEW TRANSLATION
 GEO_embargo_turkey_desc: "Turecký vliv je škodlivý pro naši zemi, zejména pro Batumi a jejich takzvanou autonomii... Měli bychom to ukončit." # todo: NEW TRANSLATION
 GEO_trade_deal_russia: "Dohoda o vzájemné spolupráci s Ruskem" # todo: NEW TRANSLATION
 GEO_trade_deal_russia_desc: "Měli bychom spolupracovat s Ruskem na principech vzájemné dohody a porozumění. Ať je naše přátelství legendární!" # todo: NEW TRANSLATION
 GEO_deal_with_armenia: "Dohoda o přátelství s Arménií" # todo: NEW TRANSLATION
 GEO_deal_with_armenia_desc: "Měli bychom spolupracovat s Arménií na principech vzájemné dohody a porozumění. Ať je naše přátelství legendární!" # todo: NEW TRANSLATION
 GEO_demands_from_azeris: "Východní nároky" # todo: NEW TRANSLATION
 GEO_demands_from_azeris_desc: "Měli bychom našim ázerbájdžánským partnerům připomenout, že severozápadní část Azerbajdžánu historicky patřila Gruzii a že by měli vůči našemu dědictví jednat s respektem!" # todo: NEW TRANSLATION
 GEO_nato_drills: "Nácviky s NATO" # todo: NEW TRANSLATION
 GEO_nato_drills_desc: "Pořádat společná cvičení s NATO! Aspoň nám nebudou vrtat díru do zad." # todo: NEW TRANSLATION
 GEO_legit_heir: "Legitimní dědic" # todo: NEW TRANSLATION
 GEO_legit_heir_desc: "Bidzina Ivanishvili je muž, který by měl vládnout Gruzii" # todo: NEW TRANSLATION
 GEO_defence_priority: "Priorita obrany" # todo: NEW TRANSLATION
 GEO_defence_priority_desc: "Priorita obrany by měla být důležitým bodem moderní gruzínské agendy." # todo: NEW TRANSLATION
 GEO_increase_eu_friendship: "Diplomatické pakty s EU" # todo: CHANGED
 GEO_increase_eu_friendship_desc: "Evropská unie je organizace, do které se potřebujeme zapojit." # todo: NEW TRANSLATION
 GEO_narmalization_with_russia: "Ruský pragmatismus" # todo: NEW TRANSLATION
 GEO_narmalization_with_russia_desc: "Proč se trápit rivalitou s Ruskem, když můžeme být pragmatičtější a mít dobré obchodní vztahy." # todo: NEW TRANSLATION
 GEO_azerbaijani_coop: "Spolupráce s Azerbajdžánem" # todo: NEW TRANSLATION
 GEO_azerbaijani_coop_desc: "Ázerbájdžán je náš dlouhodobý ekonomický a politický partner. Měli bychom prohloubit naše vzájemné vztahy." # todo: NEW TRANSLATION
 GEO_nato_connections: "Spojení s NATO" # todo: NEW TRANSLATION
 GEO_nato_connections_desc: "Měli bychom prohloubit naše spojení s NATO. Rozmanité a bohaté zkušenosti stávající struktury organizace vyžadují definici a vyladění systému školení personálu, který vyhovuje naléhavým potřebám." # todo: NEW TRANSLATION
 GEO_isolationaism: "Částečný izolacionismus" # todo: NEW TRANSLATION
 GEO_isolationaism_desc: "Proč zasahovat do věcí, které se nás netýkají? Musíme být zapojeni do politiky částečného izolacionismu." # todo: NEW TRANSLATION
 GEO_salome_zurab: "Salome Zurabishvili" # todo: NEW TRANSLATION
 GEO_salome_zurab_desc: "Potřebujeme prezidenta, který nebude zasahovat do obecného chodu politických otázek v zemi, ale který bude dobrým diplomatickým činitelem pro zahraniční politiku." # todo: NEW TRANSLATION
 GEO_compromiss_monacrhists: "Kompromis s monarchisty" # todo: NEW TRANSLATION
 GEO_compromiss_monacrhists_desc: "Náš lid chce krále vrátit zpět, jak šílené přání! Měli bychom se s nimi pokusit najít kompromis." # todo: NEW TRANSLATION
 GEO_lgbt_rights_geo: "Pro-LGBTQ+ Gruzie" # todo: NEW TRANSLATION
 GEO_lgbt_rights_geo_desc: "Měli bychom zaujmout tento sociální postoj kvůli naší ideologické vazbě na evropské země." # todo: NEW TRANSLATION
 GEO_best_variant: "Nejlepší varianta" # todo: NEW TRANSLATION
 GEO_best_variant_desc: "Přijetím demokratických hodnot a západních institucí při zachování společenské harmonie si Gruzie razí umírněnou cestu vpřed, která dává přednost stabilitě a prosperitě před ideologickým extremismem." # todo: CHANGED
 GEO_second_epoch_of_saakash: "Návrat Mikheila" # todo: NEW TRANSLATION
 GEO_second_epoch_of_saakash_desc: "Nakonec se otec Růžové revoluce vrací vládnout Sakartvelo!" # todo: NEW TRANSLATION
 GEO_united_nat_movem: "Jednotné národní hnutí" # todo: NEW TRANSLATION
 GEO_united_nat_movem_desc: "Sjednocené národní hnutí je skutečnou stranou, která by měla mít mandát vládnout Gruzii." # todo: CHANGED
 GEO_prowestern_nationalist: "Křižáci Růžové revoluce" # todo: NEW TRANSLATION
 GEO_prowestern_nationalist_desc: "Bakradze by měl převzít otěže v Gruzii a dokončit cíle, o které usilovala Růžová revoluce." # todo: CHANGED
 GEO_radical_antirussian_rhetoric: "Radikální protiruská rétorika" # todo: CHANGED
 GEO_radical_antirussian_rhetoric_desc: "Rusko nás vždy chtělo zotročit, měli bychom se mu postavit a šířit tuto zprávu!" # todo: NEW TRANSLATION
 GEO_legacy_of_rose_revol: "Dědictví Růžové revoluce" # todo: NEW TRANSLATION
 GEO_legacy_of_rose_revol_desc: "Dědictví Růžové revoluce by mělo být přijato a vzato jako příklad toho, jak by se měla vést skutečná politika." # todo: NEW TRANSLATION
 GEO_reformation_of_armedforces_nat: "Reforma ozbrojených sil" # todo: NEW TRANSLATION
 GEO_reformation_of_armedforces_nat_desc: "Naše ozbrojené síly potřebují zásadní změnu. Moderní stav naší armády neodpovídá tomu, jak si ji představujeme." # todo: NEW TRANSLATION
 GEO_moderate_right_wing: "Zachovat sociální konzervatismus" # todo: NEW TRANSLATION
 GEO_moderate_right_wing_desc: "Naše sociální tradice a celkový způsob života by měly být zachovány pro budoucí generace. To je to, co nás dělá námi samými." # todo: NEW TRANSLATION
 GEO_mistakes_of_prevgov: "Chyby předchozí vlády" # todo: CHANGED
 GEO_mistakes_of_prevgov_desc: "Chyby předchozí vlády je třeba zohlednit, aby byla v budoucnu zajištěna prosperita Gruzie." # todo: CHANGED
 GEO_allance_geo_patrio: "Aliance gruzínských patriotů" # todo: NEW TRANSLATION
 GEO_allance_geo_patrio_desc: "Aliance gruzínských patriotů představuje proruskou nacionalistickou frakci, která usiluje o odklon Gruzie od západní integrace a o užší spolupráci se Společenstvím nezávislých států." # todo: CHANGED
 GEO_proeastern_nationalist: "Kvitsianiho 360° obrat" # todo: NEW TRANSLATION
 GEO_proeastern_nationalist_desc: "Kvitsiani má vlastní představu o tom, jaká by Gruzie měla být. Možná má pravdu..." # todo: CHANGED
 GEO_prorussian_country: "Pro-ruský postoj" # todo: NEW TRANSLATION
 GEO_prorussian_country_desc: "Rusko je skutečně naším přítelem a velkým bratrem. Vždy bychom měli stát po jejich boku." # todo: NEW TRANSLATION
 GEO_social_conservatism: "Sociální konzervatismus" # todo: NEW TRANSLATION
 GEO_social_conservatism_desc: "Naše sociální tradice a způsob života by měly být zachovány pro budoucí generace. To je to, co nás dělá námi samými." # todo: NEW TRANSLATION
 GEO_dem_dvizh_edgruz: "Demokratické hnutí - Sjednocená Gruzie" # todo: NEW TRANSLATION
 GEO_dem_dvizh_edgruz_desc: "Demokratické hnutí za sjednocenou Gruzii představuje proruskou demokratickou opozici, která by v případě vítězství ve volbách v roce 2013 mohla odklonit gruzínskou politiku od západní integrace." # todo: NEW TRANSLATION
 GEO_proeastern_reactionary: "Nino Burjanadze" # todo: NEW TRANSLATION
 GEO_proeastern_reactionary_desc: "Nino Burjanadze má plán pro novou, pragmaticky orientovanou Gruzii." # todo: NEW TRANSLATION
 GEO_deepen_rus_coop: "Prohloubit spolupráci s Ruskem" # todo: NEW TRANSLATION
 GEO_deepen_rus_coop_desc: "Prohloubení ruské spolupráce nám jistě prospěje." # todo: NEW TRANSLATION
 GEO_csto_nat_join: "Připojit se k CSTO" # todo: NEW TRANSLATION
 GEO_csto_nat_join_desc: "Připojení k CSTO je náš přirozený cíl." # todo: NEW TRANSLATION
 GEO_soviet_legacy_honor: "Uctívání sovětského dědictví" # todo: NEW TRANSLATION
 GEO_soviet_legacy_honor_desc: "Uctívání sovětského dědictví je naším normálním a přirozeným způsobem politického myšlení." # todo: NEW TRANSLATION
 GEO_multivector_kek: "Vícevektorová politika" # todo: NEW TRANSLATION
 GEO_multivector_kek_desc: "Vícevektorová politika je cestou vpřed! Proč bychom měli opouštět dohody a smlouvy kvůli geopolitickému podmanění?" # todo: NEW TRANSLATION
 GEO_geopolice: "Gruzijská policie" # todo: NEW TRANSLATION
 GEO_geopolice_desc: "Vláda Gruzie rychle zvýší rozpočet na policii ve snaze obnovit pořádek!" # todo: CHANGED
 GEO_bring_back_order: "Obnovit pořádek" # todo: NEW TRANSLATION
 GEO_bring_back_order_desc: "Zvýšené financování policie napravilo vnitřní situaci kriminality a teroru. Majitelé podniků po celé zemi jsou nesmírně vděční, že byla situace vyřešena. Pořádek byl obnoven na ulicích Gruzie." # todo: NEW TRANSLATION
 GEO_internal_affairs: "Vnitřní záležitosti" # todo: NEW TRANSLATION
 GEO_internal_affairs_desc: "Úspěšně jste vyřešili veškerou korupci v policii v zemi. Bylo nutné nahradit stovky policistů, což stálo vaši zemi personál." # todo: NEW TRANSLATION
 GEO_recruit_more_men: "Najměte více policistů" # todo: NEW TRANSLATION
 GEO_recruit_more_men_desc: "Podařilo se vám najmout více policistů, čímž klesla průměrná korupce a zvýšila se stabilita." # todo: NEW TRANSLATION
 GEO_vozmest_nedobor: "Reforma policie v regionech" # todo: NEW TRANSLATION
 GEO_vozmest_nedobor_desc: "Úspěšně jste uspořádali několik náborových akcí ve velkých městech Gruzie, byl zaznamenán značný příliv žádostí, stát je nyní z velké části považován za bezpečný. To bude stát, ale zvýší vaši celkovou stabilitu." # todo: NEW TRANSLATION
 GEO_geopolice_game: "Geopolice hra" # todo: NEW TRANSLATION
 GEO_geopolice_game_desc: "Nová a vylepšená policie Gruzie úspěšně potlačila zločinnost; statistiky ukazují, že Gruzínci budou pravděpodobněji dodržovat zákony, vzájemně se respektovat a udržovat mír. We are the Georgian Dream." # todo: NEW TRANSLATION
 GEO_yak52: "Yak 52" # todo: NEW TRANSLATION
 GEO_yak52_desc: "Úspěšně jste získali 15 ruských letounů Striker." # todo: NEW TRANSLATION
 GEO_superpuma: "Super Puma" # todo: NEW TRANSLATION
 GEO_superpuma_desc: "Pořízení vrtulníků Super Puma francouzské výroby poskytne Gruzii moderní leteckou mobilitu a schopnosti pátrání a záchrany." # todo: NEW TRANSLATION
 GEO_albatros: "Albatros" # todo: NEW TRANSLATION
 GEO_albatros_desc: "Úspěšně jste pořídili 15 českých úderných letounů Albatros." # todo: CHANGED
 GEO_air_reforms: "Letecké reformy" # todo: NEW TRANSLATION
 GEO_air_reforms_desc: "Úspěšně jste reformovali gruzínské letectvo a zvýšili stabilitu v zemi." # todo: NEW TRANSLATION
 GEO_west_avia_inst: "Západní letečtí instruktoři" # todo: NEW TRANSLATION
 GEO_west_avia_inst_desc: "Vy a Západ se účastníte společných leteckých bojových cvičení, čímž zvyšujete své letecké zkušenosti a odolnost." # todo: CHANGED
 GEO_restructure_vvs: "Přeorganisovat VVS" # todo: NEW TRANSLATION
 GEO_restructure_vvs_desc: "Ministerstvo obrany zahajuje reformu rozpočtu gruzínského letectva." # todo: NEW TRANSLATION
 GEO_new_methods: "Nové tréninkové metody" # todo: NEW TRANSLATION
 GEO_new_methods_desc: "Gruzínské letectvo zahajuje masivní tréninková cvičení s cílem posílit své dovednosti." # todo: NEW TRANSLATION
 GEO_hermes: "Hermes" # todo: NEW TRANSLATION
 GEO_hermes_desc: "Úspěšně jste objednali 20 izraelských bezpilotních letounů Hermes." # todo: CHANGED
 GEO_skylark: "Skylark" # todo: NEW TRANSLATION
 GEO_skylark_desc: "Úspěšně jste objednali 15 izraelských bezpilotních letounů Skylark." # todo: CHANGED
 GEO_belluh: "Bell-uh" # todo: NEW TRANSLATION
 GEO_belluh_desc: "Úspěšně jste získali 25 amerických transportních vrtulníků z roku 1965." # todo: NEW TRANSLATION
 GEO_polt_crisis_aknowl: "Uznat Politickou krizi" # todo: NEW TRANSLATION
 GEO_polt_crisis_aknowl_desc: "Gruzie je ve stavu trvalé politické krize. Abychom naplánovali naše další kroky, musíme uznat problémy a konsolidovat moc." # todo: NEW TRANSLATION
 GEO_raskol_soyuz_gruz: "Rozkol strany Ševardnadzeho" # todo: NEW TRANSLATION
 GEO_raskol_soyuz_gruz_desc: "Rozkol v Ševardnadzeho straně byl zřejmě nevyhnutelný. Od nynějška Ševardnadze výrazně ztratil podporu. Zároveň sílí prozápadní strany." # todo: CHANGED
 GEO_revive_mhedrioni: "Obnovit Mhedrioni" # todo: CHANGED
 GEO_revive_mhedrioni_desc: "Mkhedrioni byla paramilitární skupina v Republice Gruzie, známá svým výrazným zapojením do Gruzínské občanské války a Války v Abcházii. Byla zakázána od roku 1995, ale následně byla znovu zformována jako politická strana Unie Patriotů. Avšak po selhání registrace brzy zanikla. Nyní ji musíme vrátit zpět, aby bylo zajištěno panování armády." # todo: NEW TRANSLATION
 GEO_revive_high_council: "Obnovit Nejvyšší radu Gruzie" # todo: NEW TRANSLATION
 GEO_revive_high_council_desc: "Proč bychom potřebovali parlament a vnitřní fragmentaci, když můžeme svolat Nejvyšší radu, která bude řídit vnitřní záležitosti státu v klíči, jaký potřebujeme?" # todo: NEW TRANSLATION
 GEO_puppet_shervad: "Loutka Ševardnadze" # todo: NEW TRANSLATION
 GEO_puppet_shervad_desc: "Kdysi byl čas, kdy jsme během stabilizace vlády podpořili Eduarda, aby vládl zemi. Nyní je země opět v chaosu. Rada by měla učinit Shervarda loutkou, zatímco skutečná moc zůstává u..." # todo: NEW TRANSLATION
 GEO_iron_hand_georgia: "Železná ruka Gruzie" # todo: NEW TRANSLATION
 GEO_iron_hand_georgia_desc: "Všechny problémy Gruzie vyplývají z nedostatku železné ruky v této zemi, která lidi sjednotí a přinese řád naší společnosti." # todo: NEW TRANSLATION
 GEO_diplomatic_president: "Eduard Shevardnadze" # todo: NEW TRANSLATION
 GEO_empower_yoseliani: "Pověřit Yoseliani do moci" # todo: NEW TRANSLATION
 GEO_empower_yoseliani_desc: "Pouze Yoseliani může převzít nad Gruzií kontrolu a díky své autoritě a schopnostem určit nezbytné priority v zemi. Je čas ho uvést do moci." # todo: NEW TRANSLATION
 GEO_question_of_abkhazosset: "Otázka Osetie a Abcházie" # todo: NEW TRANSLATION
 GEO_question_of_abkhazosset_desc: "Otázka Osetie a Abcházie by měla být konečně projednána. Musíme rozhodnout, co dál." # todo: CHANGED
 GEO_seek_for_greater_georgia: "Usilovat o větší Gruzii" # todo: NEW TRANSLATION
 GEO_seek_for_greater_georgia_desc: "Musíme vybudovat novou myšlenku kolem touhy vybudovat Větší Gruzii. To by měla být nová agenda, nová rutina. Velká Gruzie je nevyhnutelná!" # todo: NEW TRANSLATION
 GEO_diplomatic_approach: "Efektivní diplomatický přístup" # todo: NEW TRANSLATION
 GEO_diplomatic_approach_desc: "Pro naši novou vládu je vhodnější efektivní diplomatický přístup. Musíme zabránit byrokracii, aby mařila naše plány." # todo: CHANGED
 GEO_reketir_opposition: "Šikanovat opozici" # todo: NEW TRANSLATION
 GEO_reketir_opposition_desc: "Proč se s opozicí neustále bavit, když naše pouliční hnutí a bandité ji mohou šikanovat a donutit ji k podřízení?" # todo: NEW TRANSLATION
 GEO_loyal_guard: "Královská stráž Mkhedrioni" # todo: NEW TRANSLATION
 GEO_loyal_guard_desc: "Věrná stráž Mkhedrioni by měla být uznána jako součást gruzínské armády. Ačkoliv jsou to gauneři, jsou loajálnější než kterýkoli generál." # todo: NEW TRANSLATION
 GEO_killt_opposition: "Vyčistit opoziční seznamy" # todo: NEW TRANSLATION
 GEO_killt_opposition_desc: "Přišel čas očistit naši zemi od různých typů disidentů a politických šašků..." # todo: NEW TRANSLATION
 GEO_reform_governmant: "Reformovat vládu" # todo: NEW TRANSLATION
 GEO_reform_governmant_desc: "Je čas reformovat naši zemi pro jasnější, militarizovanou kontrolu země. Je načase ukončit všechna základní ustanovení regionismu a místní samosprávy... Také je třeba prosazovat euroskepticismus v Evropě i v Gruzii samotné." # todo: NEW TRANSLATION
 GEO_epoch_of_saakash: "Éra Saakašviliho!" # todo: CHANGED
