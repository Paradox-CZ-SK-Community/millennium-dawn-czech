 GEO_german_archeologists_desc: "Pozvání německých archeologů k pomoci s obnovou historických památek zachová dávné kulturní dědictví Gruzie prostřednictvím mezinárodní akademické spolupráce." # todo: NEW TRANSLATION
 GEO_tbilisi_ceyhan: "Ropovod Tbilisi-Ceyhan" # todo: NEW TRANSLATION
 GEO_tbilisi_ceyhan_desc: "Ropovod Baku–Tbilisi–Ceyhan představuje strategický význam Gruzie jako energetického koridoru spojujícího kaspické zdroje se středomořskými trhy." # todo: NEW TRANSLATION
 GEO_fight_with_plague: "Boj s morom" # todo: NEW TRANSLATION
 GEO_fight_with_plague_desc: "Zahájení komplexní kampaně v oblasti veřejného zdraví s cílem odstranit propuknutí nemocí ochrání obyvatelstvo a prokáže odhodlání vlády pečovat o veřejné blaho." # todo: NEW TRANSLATION
 GEO_healthcare_geo: "Gruzínské zdravotnictví" # todo: NEW TRANSLATION
 GEO_healthcare_geo_desc: "Reforma a financování národního zdravotnického systému zlepší výsledky veřejného zdraví a prokáže odhodlání vlády pečovat o sociální blahobyt." # todo: NEW TRANSLATION
 GEO_budget_deficit: "Reforma rozpočtu zdravotnictví" # todo: NEW TRANSLATION
 GEO_budget_deficit_desc: "Řízení rozpočtových deficitů prostřednictvím západního financování a obchodní integrace s EU zajistí stabilitu, zároveň však prohloubí ekonomickou závislost Gruzie na evropských partnerech." # todo: NEW TRANSLATION
 GEO_migrant_programs: "Programy migrace a relokace" # todo: NEW TRANSLATION
 GEO_migrant_programs_desc: "Programy migrace a přesídlování budou řídit pohyb obyvatelstva a rozložení pracovní síly po průmyslových rozvojových projektech." # todo: NEW TRANSLATION
 GEO_agreement_with_turkey: "Dohody s Tureckem" # todo: NEW TRANSLATION
 GEO_agreement_with_turkey_desc: "Diplomatické dohody s Tureckem otevřou cesty k regionální spolupráci a přístupu k ázerbájdžánským energetickým zdrojům, čímž Gruzii postaví do role klíčového tranzitního státu." # todo: NEW TRANSLATION
 GEO_prepare_for_crisis2008: "Připravit se na krizi 2008" # todo: NEW TRANSLATION
 GEO_prepare_for_crisis2008_desc: ""
 GEO_oil_extr_experts: "Gruzíjští ropní experti" # todo: NEW TRANSLATION
 GEO_oil_extr_experts_desc: "Najmutí zahraničních ropných odborníků předá klíčové technické znalosti potřebné k rozvoji domácí těžby ropy v Gruzii." # todo: NEW TRANSLATION
 GEO_deal_with_india: "Dohoda s Indií" # todo: NEW TRANSLATION
 GEO_deal_with_india_desc: "Navázání obchodních a diplomatických vztahů s Indií diverzifikuje ekonomická partnerství Gruzie nad rámec bezprostředního kavkazského regionu." # todo: NEW TRANSLATION
 GEO_private_miners: "Soukromí těžaři" # todo: NEW TRANSLATION
 GEO_private_miners_desc: "Privatizace těžebních provozů s britskými investicemi zmodernizuje těžební průmysl prostřednictvím zahraničního kapitálu a odborných znalostí." # todo: NEW TRANSLATION
 GEO_telecommunications: "Telekomunikační kanceláře" # todo: NEW TRANSLATION
 GEO_telecommunications_desc: "Modernizace telekomunikační infrastruktury zlepší propojení a vytvoří digitální základ pro ekonomický rozvoj Gruzie." # todo: NEW TRANSLATION
 GEO_light_industry: "Investiční balíček" # todo: NEW TRANSLATION
 GEO_light_industry_desc: "Přilákání investičních balíčků pro rozvoj lehkého průmyslu zmodernizuje gruzínský výrobní sektor a prospěje průmyslovým podnikatelským zájmům." # todo: NEW TRANSLATION
 GEO_build_materials: "Stavební materiály" # todo: NEW TRANSLATION
 GEO_build_materials_desc: "Rozvoj průmyslu stavebních materiálů podpoří gruzínský stavební sektor a prospěje podnikatelským zájmům napříč několika hospodářskými odvětvími." # todo: NEW TRANSLATION
 GEO_agriculture_reform: "Zemědělská reforma" # todo: NEW TRANSLATION
 GEO_agriculture_reform_desc: "Modernizace gruzínského zemědělství zlepší produktivitu a podpoří průmyslový rozvoj, tradiční zemědělci však mohou změnám zavedených postupů odporovat." # todo: NEW TRANSLATION
 GEO_fertilizer_import: "Import hnojiv" # todo: NEW TRANSLATION
 GEO_fertilizer_import_desc: "Dovoz hnojiv prostřednictvím nově zavedených arménských železničních spojení zvýší zemědělskou produktivitu a zlepší výnosy plodin v celé Gruzii." # todo: NEW TRANSLATION
 GEO_agriculture_subsidize: "Subvencování zemědělství" # todo: NEW TRANSLATION
 GEO_agriculture_subsidize_desc: "Zemědělské dotace podpoří zemědělce a pracovníky po nedávných reformách, velcí vlastníci půdy je však mohou vnímat jako nežádoucí zásah státu." # todo: NEW TRANSLATION
 GEO_agree_with_armenia_on_rail: "Armensko-gruzínské hospodářské partnerství" # todo: NEW TRANSLATION
 GEO_agree_with_armenia_on_rail_desc: "Železniční spolupráce s Arménií posílí propojení zakavkazské infrastruktury, zlepší obchodní trasy a upevní diplomatické vztahy s naším jižním sousedem." # todo: NEW TRANSLATION
 GEO_food_industry: "Politika na podporu zemědělců" # todo: CHANGED
 GEO_food_industry_desc: "Rozvoj moderního zpracování potravin a zemědělských technologií posílí gruzínský zemědělský sektor a zlepší ekonomické postavení venkovských komunit." # todo: NEW TRANSLATION
 GEO_wine: "Gruzínské víno" # todo: NEW TRANSLATION
 GEO_wine_desc: "Rozvoj dávného gruzínského vinařství pomocí moderních výrobních zařízení vytvoří prémiový exportní produkt představující tisíciletou vinařskou tradici." # todo: NEW TRANSLATION
 GEO_grapeyards: "Oživení vinic" # todo: NEW TRANSLATION
 GEO_grapeyards_desc: "Obnova historických gruzínských vinic znovu oživí vinařský průmysl, který je po tisíciletí ústřední součástí gruzínské kultury a ekonomiky." # todo: NEW TRANSLATION
 GEO_ask_for_international_help: "Požádat o mezinárodní pomoc" # todo: NEW TRANSLATION
 GEO_ask_for_international_help_desc: "Žádost o mezinárodní pomoc pro sociální programy poskytne zásadní financování rozšíření zdravotní péče, zároveň však zvýší závislost Gruzie na zahraniční pomoci." # todo: NEW TRANSLATION
 GEO_HES_of_geo: "Hidroelektrárna" # todo: NEW TRANSLATION
 GEO_HES_of_geo_desc: "Investice do vodních elektráren sníží závislost Gruzie na fosilních palivech a zajistí čistou obnovitelnou energii, mohou však rozrušit tradiční energetický průmysl." # todo: NEW TRANSLATION
 GEO_mtkvari_tpp: "Mtkvarská elektrárna" # todo: NEW TRANSLATION
 GEO_mtkvari_tpp_desc: "Projekt tepelné elektrárny Mtkvari výrazně rozšíří kapacitu výroby elektřiny v Gruzii prostřednictvím výstavby moderní elektrárny." # todo: NEW TRANSLATION
 GEO_mtkvari_tpp1: "TPP1" # todo: NEW TRANSLATION
 GEO_mtkvari_tpp1_desc: "První fáze rozšíření energetického komplexu Mtkvari zvýší výkon a díky vyšší účinnosti sníží závislost na fosilních palivech." # todo: NEW TRANSLATION
 GEO_mtkvari_tpp2: "TPP2" # todo: NEW TRANSLATION
 GEO_mtkvari_tpp2_desc: "Konečné rozšíření elektrárny Mtkvari dokončí přechod Gruzie k udržitelné energetické infrastruktuře." # todo: NEW TRANSLATION
 GEO_mineral_waters: "Nabeghlavi" # todo: NEW TRANSLATION
 GEO_mineral_waters_desc: "Rozvoj průmyslu minerální vody Nabeghlavi využije přírodní prameny Gruzie, které jsou známé v celém kavkazském regionu." # todo: NEW TRANSLATION
 GEO_rebrand_borjomi: "Přejmenovat Borjomi" # todo: NEW TRANSLATION
 GEO_rebrand_borjomi_desc: "Změna značky minerální vody Borjomi připraví tento historický gruzínský produkt na mezinárodní exportní trhy a prémiové ceny." # todo: NEW TRANSLATION
 GEO_transit_deal_eu: "Tranzitní dohoda s EU" # todo: NEW TRANSLATION
 GEO_transit_deal_eu_desc: "Vytvoření tranzitního koridoru pro obchod mezi EU a Asií začlení Gruzii do evropských ekonomických sítí a zmírní euroskeptické nálady." # todo: NEW TRANSLATION
 GEO_azot_combinat: "Azot Kombinát" # todo: NEW TRANSLATION
 GEO_azot_combinat_desc: "Chemický závod Rustavi Azot představuje průmyslovou kapacitu ze sovětské éry, kterou lze obnovit prostřednictvím investic a modernizace orientovaných na EU." # todo: NEW TRANSLATION
 GEO_marneuli_plant: "Továrna Marneuli" # todo: NEW TRANSLATION
 GEO_marneuli_plant_desc: "Výstavba průmyslového závodu v Marneuli prostřednictvím indicko-gruzínské spolupráce rozšíří výrobní kapacitu a posílí ekonomické vazby s Indií." # todo: NEW TRANSLATION
 GEO_mahindra: "Mahindra" # todo: NEW TRANSLATION
 GEO_mahindra_desc: "Partnerství s indickým průmyslovým gigantem Mahindra vytvoří v Gruzii kapacitu pro výrobu zbraní prostřednictvím transferu zahraničních technologií." # todo: NEW TRANSLATION
 GEO_geopromining: "GeoProMining" # todo: NEW TRANSLATION
 GEO_geopromining_desc: "Rozvoj společnosti GeoProMining rozšíří gruzínský těžební průmysl a zmodernizuje civilní průmyslovou kapacitu." # todo: NEW TRANSLATION
 GEO_gold_extract: "Zvýšit těžbu zlata" # todo: NEW TRANSLATION
 GEO_gold_extract_desc: "Rozšíření těžby zlata s britskými investicemi vytvoří příjmy z exportu, zároveň však zvýší zahraniční kontrolu nad gruzínskými přírodními zdroji." # todo: NEW TRANSLATION
 GEO_nationalize_gold: "Nacionalizace zlata" # todo: NEW TRANSLATION
 GEO_nationalize_gold_desc: "Státní znárodnění těžby zlata prosadí domácí kontrolu nad přírodními zdroji, hrozí však podkopáním důvěry zahraničních investorů." # todo: NEW TRANSLATION
 GEO_gold_privat: "Privatizace zlata" # todo: NEW TRANSLATION
 GEO_gold_privat_desc: "Privatizace zlatokopeckého průmyslu přiláká zahraniční investice a vytvoří příjmy pro státní pokladnu, čímž prokáže závazek k tržně orientované ekonomické reformě." # todo: NEW TRANSLATION
 GEO_oil_pipelines: "Pozemková reforma" # todo: NEW TRANSLATION
 GEO_oil_pipelines_desc: "Výstavba ropovodní infrastruktury postaví Gruzii do role klíčového energetického tranzitního koridoru mezi kaspickým a černomořským regionem." # todo: NEW TRANSLATION
 GEO_exchange_energy_rus: "Dohody o ruských energetických investicích" # todo: CHANGED
 GEO_exchange_energy_rus_desc: "Uzavření energetických dohod s Ruskem, v nichž se bude obchodovat v jeho měně a za výhodných podmínek, nám umožní zajistit stabilnější dodávky energie pro naši zemi." # todo: NEW TRANSLATION
 GEO_inter_rao_tpp: "Vzájemné zájmy" # todo: NEW TRANSLATION
 GEO_inter_rao_tpp_desc: "Ruský energetický gigant Inter RAO postaví v Gruzii tepelné elektrárny, čímž rozšíří průmyslovou kapacitu, zvýší ruský ekonomický vliv a podpoří euroskepticismus." # todo: NEW TRANSLATION
 GEO_georgian_oil: "Gruzinské rafinerie" # todo: NEW TRANSLATION
 GEO_georgian_oil_desc: "Rozvoj domácí kapacity zpracování ropy sníží závislost Gruzie na dovážených ropných produktech a posílí energetickou nezávislost." # todo: NEW TRANSLATION
 GEO_azeri_oil: "Dohoda s Ázerbájdžánem" # todo: NEW TRANSLATION
 GEO_azeri_oil_desc: "Přístup k ázerbájdžánským ropným polím prostřednictvím tureckého zprostředkování posílí energetický koridor Baku–Tbilisi a zlepší postavení Gruzie jako tranzitního státu." # todo: NEW TRANSLATION
 GEO_negotiate_red_cross: "Jednat s Červeným křížem" # todo: NEW TRANSLATION
 GEO_negotiate_red_cross_desc: "Jednání s Mezinárodním červeným křížem zajistí humanitární pomoc a lékařské odborné znalosti pro programy kontroly nemocí." # todo: NEW TRANSLATION
 GEO_german_specialists: "Německá lékařská pomoc" # todo: NEW TRANSLATION
 GEO_german_specialists_desc: "Němečtí lékařští specialisté přinesou pokročilé odborné znalosti ve zdravotnictví, které zmodernizují gruzínské nemocnice a programy lékařského vzdělávání." # todo: NEW TRANSLATION
 GEO_healthcare_reformation: "Reforma zdravotnictví" # todo: NEW TRANSLATION
 GEO_healthcare_reformation_desc: "Komplexní reforma zdravotnického systému po pomoci německých specialistů zásadně promění poskytování zdravotní péče v celé Gruzii." # todo: NEW TRANSLATION
 GEO_build_hospitals: "Postavit nemocnice" # todo: NEW TRANSLATION
 GEO_build_hospitals_desc: "Výstavba moderních nemocnic s mezinárodní podporou a pomocí Červeného kříže výrazně zlepší gruzínskou zdravotnickou infrastrukturu a výsledky veřejného zdraví." # todo: NEW TRANSLATION
