 GEO_papa_tsiklauri: "Mama Tsiklauri" # todo: NEW TRANSLATION
 GEO_papa_tsiklauri_desc: "Otec Tsiklauri vám všem bude dávat Twix tyčinky ve jménu jasné komunistické revoluce, ano!" # todo: NEW TRANSLATION
 GEO_stalin_dzidziguri: "Jandaba Dzhugashvili" # todo: NEW TRANSLATION
 GEO_stalin_dzidziguri_desc: "Ach, vnuk Stalina! Kdo jiný by měl vládnout naší drahocenné zemi!" # todo: NEW TRANSLATION
 GEO_haha_com_classic: "Krevní průkopníci revoluce!" # todo: NEW TRANSLATION
 GEO_haha_com_classic_desc: "Pipia a Georgadze znají pravou cestu komunistické revoluce pro pokrok a štěstí!" # todo: NEW TRANSLATION
 GEO_communist_iron_hand: "Železná ruka komunismu" # todo: NEW TRANSLATION
 GEO_communist_iron_hand_desc: "Konsolidace komunistické vlády jedné strany odstraní politickou opozici a nastolí absolutní kontrolu nad gruzínskou společností a státními institucemi." # todo: NEW TRANSLATION
 GEO_political_reformation: "Politická reformace" # todo: NEW TRANSLATION
 GEO_political_reformation_desc: "Politická restrukturalizace za komunismu přerozdělí ekonomickou moc od oligarchů a bankéřů k malým podnikům a odborovým svazům." # todo: NEW TRANSLATION
 GEO_no_towest_infl: "Průmyslový rozvoj" # todo: NEW TRANSLATION
 GEO_no_towest_infl_desc: "Gruzie odmítne západní hospodářské modely a zaměří se na průmyslovou expanzi řízenou státem a mobilizaci zdrojů, aby vybudovala soběstačnou ekonomiku osvobozenou od kapitalistického vlivu." # todo: CHANGED
 GEO_friendship_with_russia: "Přátelství s Ruskem" # todo: NEW TRANSLATION
 GEO_friendship_with_russia_desc: "Posílení diplomatických a hospodářských vazeb s Ruskem představuje pragmatický přístup k regionální stabilitě a otevírá kanály spolupráce navzdory minulým konfliktům." # todo: CHANGED
 GEO_osetabkh_com: "Autonomní republiky" # todo: NEW TRANSLATION
 GEO_osetabkh_com_desc: "Pod sovětským vlivem Gruzie znovu začlení Jižní Osetii a Abcházii jako autonomní loutkové republiky a vyřeší územní spory politickou kontrolou podporovanou Ruskem namísto vojenské síly." # todo: CHANGED
 GEO_porvat_connections: "Náš nový plán" # todo: NEW TRANSLATION
 GEO_porvat_connections_desc: "Naše nová komunistická vláda musí vytvořit silný aparát vnitřní bezpečnosti a upevnit kontrolu nad státními institucemi, aby zajistila úspěch revoluční transformace." # todo: CHANGED
 GEO_government_reform_com: "Ekonomická mobilizace" # todo: NEW TRANSLATION
 GEO_government_reform_com_desc: "Hospodářská mobilizace podle komunistických principů vyžaduje centrální plánování, státní kontrolu výroby a odstranění buržoazních hospodářských struktur, které brzdily rozvoj Gruzie." # todo: CHANGED
 GEO_intervene_in_azerbaijan: "Přivést revoluci do Ázerbájdžánu" # todo: NEW TRANSLATION
 GEO_intervene_in_azerbaijan_desc: "Komunistická revoluce se musí rozšířit za hranice Gruzie. Podporou revolučních sil v Ázerbájdžánu můžeme vytvořit novou zakavkazskou federaci založenou na socialistických principech." # todo: CHANGED
 GEO_ally_tocomarmenia: "Spojenec pro vznikající Arménii" # todo: NEW TRANSLATION
 GEO_ally_tocomarmenia_desc: "Komunistická Arménie sdílí naši ideologickou vizi Kavkazu a posílení diplomatických vztahů vytvoří jednotnou socialistickou frontu proti reakčním silám." # todo: CHANGED
 GEO_rel_question_com: "Náboženská otázka" # todo: NEW TRANSLATION
 GEO_rel_question_com_desc: "Gruzínská pravoslavná církev má v naší společnosti hluboké historické kořeny a musíme pečlivě řídit vztah mezi komunistickou ideologií a tradičními náboženskými institucemi." # todo: CHANGED
 GEO_suppress_oppos_com: "Potlačit opozici" # todo: NEW TRANSLATION
 GEO_suppress_oppos_com_desc: "Demokratická a buržoazní opoziční hnutí ohrožují revoluční transformaci Gruzie a musí být potlačena, aby byla zajištěna úplná kontrola komunistické strany nad politickým životem." # todo: CHANGED
 GEO_allow_religion_geo: "Povolit náboženství" # todo: NEW TRANSLATION
 GEO_allow_religion_geo_desc: "Namísto prosazování přísného ateismu můžeme přijmout pluralitní přístup, který toleruje náboženskou praxi při zachování nadřazenosti komunistické strany, čímž snížíme společenské napětí a získáme určitou podporu obyvatelstva." # todo: CHANGED
 GEO_no_opium_for_people: "Žádné opium pro lidi" # todo: NEW TRANSLATION
 GEO_no_opium_for_people_desc: "Náboženství je opiem lidstva. Prosazování státního ateismu a odstranění vlivu duchovenstva osvobodí gruzínské mysli od pověr a urychlí rozvoj socialistického vědomí." # todo: CHANGED
 GEO_exapnd_com_party: "Rozšířit Komunistickou stranu" # todo: NEW TRANSLATION
 GEO_exapnd_com_party_desc: "Rozšíření členství v komunistické straně a zavedení komplexního ideologického kodexu zajistí, že revoluční principy proniknou do všech úrovní gruzínské společnosti a vlády." # todo: CHANGED
 GEO_clearup_local_gov: "Obnovit ekonomiku" # todo: NEW TRANSLATION
 GEO_clearup_local_gov_desc: "Očista místních vlád od oportunistů a reakcionářů posílí komunistický systém, zatímco zavedení omezených tržních mechanismů může zlepšit hospodářskou efektivitu, aniž by byly opuštěny socialistické principy." # todo: CHANGED
 GEO_rodina_zakav_com: "Páté mezinárodní" # todo: NEW TRANSLATION
 GEO_rodina_zakav_com_desc: "Pátá internacionála představuje odhodlání Gruzie podporovat globální komunistickou solidaritu, revoluční hnutí a socialistické vlády na Kavkaze i mimo něj." # todo: CHANGED
 GEO_new_nep: "Nová NEP" # todo: NEW TRANSLATION
 GEO_new_nep_desc: "Nová hospodářská politika podle Leninova vzoru zavede omezené soukromé podnikání a tržní mechanismy s cílem oživit zemědělství a drobnou výrobu při zachování státní kontroly nad těžkým průmyslem." # todo: CHANGED
 GEO_help_othercommies: "Hráči, povstaňte!" # todo: NEW TRANSLATION
 GEO_help_othercommies_desc: "Gruzie musí podporovat komunistická hnutí po celém světě poskytováním materiální a ideologické pomoci a šířit revoluční vědomí přes mezinárodní hranice." # todo: CHANGED
 GEO_txtrveli_line: "Tskhrtveli Line" # todo: NEW TRANSLATION
 GEO_txtrveli_line_desc: "Obranná linie Tskhrveli opevní zranitelné gruzínské hranice pomocí silně chráněných bunkrových komplexů proti možné invazi." # todo: NEW TRANSLATION
 GEO_training_drills_com: "Výcvikové cvičení" # todo: NEW TRANSLATION
 GEO_training_drills_com_desc: "Komunistická vojenská cvičení zdokonalí připravenost ozbrojených sil k obraně revoluce a rozšiřování socialistického vlivu." # todo: NEW TRANSLATION
 GEO_mil_reforms: "Vojenské reformy" # todo: NEW TRANSLATION
 GEO_mil_reforms_desc: "Komplexní komunistické vojenské reformy zmodernizují všechny složky gruzínských ozbrojených sil prostřednictvím organizačních zlepšení podle sovětského vzoru." # todo: NEW TRANSLATION
 GEO_military_communism: "Vojenský komunismus" # todo: NEW TRANSLATION
 GEO_military_communism_desc: "Přijetí válečného komunismu mobilizuje celou gruzínskou ekonomiku pro válčení a revoluční expanzi a upřednostní vojenskou sílu před blahobytem civilního obyvatelstva." # todo: NEW TRANSLATION
 GEO_marxism_geo_win: "Marxistický triumf!" # todo: NEW TRANSLATION
 GEO_marxism_geo_win_desc: "Vítězství marxismu v Gruzii upevní komunistickou kontrolu nad všemi oblastmi společnosti a pod státním vedením výrazně rozšíří průmyslovou kapacitu." # todo: NEW TRANSLATION
 GEO_gov_prop: "Militaristické vzdělávání" # todo: NEW TRANSLATION
 GEO_gov_prop_desc: "Zavedení militaristických vzdělávacích programů indoktrinuje gruzínskou mládež komunistickou ideologií a připraví obyvatelstvo na případný konflikt." # todo: NEW TRANSLATION
 GEO_beria_doctrine: "Beriova doktrína" # todo: NEW TRANSLATION
 GEO_beria_doctrine_desc: "Tato doktrína, pojmenovaná po Lavrentiji Berijovi, nechvalně známém Stalinově šéfovi tajné policie, vytvoří komplexní státní bezpečnostní aparát na ochranu komunistické Gruzie před vnitřními i vnějšími hrozbami." # todo: NEW TRANSLATION
 GEO_fiftintern: "Přípravy aparátu" # todo: NEW TRANSLATION
 GEO_fiftintern_desc: "Přípravy na Pátou internacionálu posílí aparát komunistické strany a upevní státní kontrolu nad výrobními prostředky." # todo: NEW TRANSLATION
 GEO_gov_plans: "Modernizace NKVD" # todo: NEW TRANSLATION
 GEO_gov_plans_desc: "Modernizace tajné policie NKVD posílí schopnosti komunistické vlády v oblasti dohledu a vnitřní bezpečnosti." # todo: NEW TRANSLATION
 GEO_Military: "Gruzinská vojenská reforma" # todo: NEW TRANSLATION
 GEO_Military_desc: "Začněte masivní reformu gruzínské armády." # todo: NEW TRANSLATION
 GEO_soviet_airbase: "Zajmout staré sovětské letecké základny" # todo: NEW TRANSLATION
 GEO_soviet_airbase_desc: "Připravte své ozbrojené síly na útok na staré sovětské letecké základny a získejte veškerý jejich majetek." # todo: NEW TRANSLATION
 GEO_Geo_air_mil: "Reforma gruzínského letectva" # todo: NEW TRANSLATION
 GEO_Geo_air_mil_desc: "Začněte reformovat gruzínské letectvo." # todo: NEW TRANSLATION
 GEO_bpla_isr: "Izraelské UAV" # todo: NEW TRANSLATION
 GEO_bpla_isr_desc: "Gruzijský ministr obchodu a zahraničních věcí se sejde s Izraelem, aby jednali o možné dohodě o obchodu BPLA." # todo: NEW TRANSLATION
 GEO_us_helis: "Nákup amerických vrtulníků" # todo: NEW TRANSLATION
 GEO_us_helis_desc: "Úspěšně jste objednali 20 amerických bojových vrtulníků." # todo: NEW TRANSLATION
 GEO_su27: "Nákup ruských stíhačů" # todo: NEW TRANSLATION
 GEO_su27_desc: "Měli jste jednání s ruským ministerstvem obrany, dohodli jste se a získali 10 SU-27." # todo: NEW TRANSLATION
 GEO_dolphin: "Delfíni na obloze" # todo: NEW TRANSLATION
 GEO_dolphin_desc: "Úspěšně jste pořídili 15 českých úderných letounů Dolphin." # todo: CHANGED
 GEO_electro_problems: "Stabilizovat elektrickou síť" # todo: CHANGED
 GEO_electro_problems_desc: "Masivní investice do elektrické infrastruktury konečně vyřeší chronický nedostatek elektřiny v Gruzii, který zemi sužuje od rozpadu Sovětského svazu." # todo: NEW TRANSLATION
 GEO_ITERA: "ITERA Corp" # todo: NEW TRANSLATION
 GEO_ITERA_desc: "ITERA představuje alternativu k ruskému monopolnímu dodavateli plynu Gazpromu, která je orientovaná na Západ. Gruzii nabídne větší energetickou nezávislost za cenu politického kapitálu a rostoucího amerického vlivu." # todo: NEW TRANSLATION
 GEO_gazprom_rus: "Gazprom Rusko" # todo: NEW TRANSLATION
 GEO_gazprom_rus_desc: "Partnerství s ruským státním plynovým monopolem Gazprom zajistí spolehlivé dodávky energie, ale výrazně zvýší politický vliv Moskvy na gruzínskou politiku." # todo: NEW TRANSLATION
 GEO_accept_russian_influence: "Ruské rafinerie" # todo: NEW TRANSLATION
 GEO_accept_russian_influence_desc: "Přijetí ruského ekonomického vlivu po uzavření dohody s Gazpromem prohloubí energetické vazby s Moskvou a prostřednictvím ruských investic rozšíří průmyslovou kapacitu Gruzie." # todo: NEW TRANSLATION
 GEO_enlarge_debt_timeout: "Prodloužit lhůtu splatnosti dluhu" # todo: CHANGED
 GEO_enlarge_debt_timeout_desc: "Restrukturalizace a prodloužení splatnosti dluhových závazků po uzavření dohody o plynu s ITERA sníží okamžitý finanční tlak a zároveň prohloubí vazby se západními věřiteli." # todo: NEW TRANSLATION
 GEO_udeshevlenie: "Požádat Rusko o zlevnění" # todo: NEW TRANSLATION
 GEO_udeshevlenie_desc: "Přijetí levnějšího ruského dovozu prostřednictvím preferenčních obchodních podmínek sníží náklady, ale zvýší ekonomickou závislost na Moskvě." # todo: NEW TRANSLATION
 GEO_restructure_debt: "Restrukturalizace dluhu" # todo: NEW TRANSLATION
 GEO_restructure_debt_desc: "Restrukturalizace státního dluhu prostřednictvím škrtů ve vojenských výdajích sníží fiskální závazky, zároveň však oslabí obranné schopnosti." # todo: NEW TRANSLATION
 GEO_gas_postavka: "Problémy s plynem" # todo: NEW TRANSLATION
 GEO_gas_postavka_desc: "Řešení problémů s dodávkami zemního plynu v Gruzii je zásadní pro energetickou bezpečnost, získání spolehlivých dodávek plynu však vyžaduje obtížná diplomatická rozhodnutí." # todo: NEW TRANSLATION
 GEO_geo_railway: "Opravy železnic" # todo: NEW TRANSLATION
 GEO_geo_railway_desc: ""
 GEO_polminmeet: "Setkání s polskými úředníky" # todo: NEW TRANSLATION
 GEO_polminmeet_desc: "Spolupráce s Polskem nám umožní dále rozvíjet diplomatické vztahy v Evropě a rozšířit náš rostoucí seznam přátel v zahraničí." # todo: CHANGED
 GEO_money_from_outside: "Připojit se k WTO" # todo: NEW TRANSLATION
 GEO_money_from_outside_desc: "Nedávná obchodní jednání přinesla ovoce, protože Gruzie dokončuje své přistoupení ke Světové obchodní organizaci. Plné členství ve WTO umožní hospodářský rozvoj a přístup k výhodným obchodním dohodám, které budou pro naši zemi přínosem." # todo: CHANGED
 GEO_guam_meeting: "Setkání GUAM" # todo: NEW TRANSLATION
 GEO_guam_meeting_desc: "Organizace GUAM (Gruzie, Ukrajina, Ázerbájdžán, Moldavsko) představuje regionální alianci států, které se prostřednictvím vzájemné spolupráce snaží vyvážit ruský vliv." # todo: NEW TRANSLATION
 GEO_help_from_azer: "Pomoc od Ázerbájdžánu" # todo: NEW TRANSLATION
 GEO_help_from_azer_desc: "Ázerbájdžánská rozvojová pomoc zlepší gruzínskou infrastrukturu a zároveň posílí bilaterální vztahy mezi dvěma kavkazskými národy." # todo: NEW TRANSLATION
 GEO_bezviz_rus: "Ruské investice" # todo: NEW TRANSLATION
 GEO_bezviz_rus_desc: "Zavedení bezvízového styku s Ruskem výrazně zvýší ekonomickou integraci se Společenstvím nezávislých států a upevní proruskou orientaci Gruzie." # todo: NEW TRANSLATION
 GEO_decrease_import: "Omezit dovoz" # todo: NEW TRANSLATION
 GEO_decrease_import_desc: "Politika nahrazování dovozu sníží obchodní závislost Gruzie a posílí domácí průmysl, může však utrpět ekonomická efektivita." # todo: NEW TRANSLATION
 GEO_transit_tax: "Transitační daň" # todo: NEW TRANSLATION
 GEO_transit_tax_desc: "Co se stane, když vezmeme peníze od imigrantů?" # todo: NEW TRANSLATION
 GEO_tax_reforms: "Daňová reforma" # todo: NEW TRANSLATION
 GEO_tax_reforms_desc: "Můžeme zavést dobré daňové reformy a získat peníze pro rozvoj naší země." # todo: NEW TRANSLATION
 GEO_tax_amnisty_2004: "Daňová amnestie 2004" # todo: NEW TRANSLATION
 GEO_tax_amnisty_2004_desc: "Máme v naší zemi mnoho daňových neplatičů, a proto nemáme dostatek peněz na financování naší země. Měli bychom proti nim zrušit obvinění, aby se cítili bezpečně platit daně znovu a my tak získali mnohem více peněz!" # todo: NEW TRANSLATION
 GEO_kulev_terminal: "Kulevi Terminal" # todo: NEW TRANSLATION
 GEO_kulev_terminal_desc: "Utratíme peníze za vybudování ropného terminálu a získáme zpět více peněz!" # todo: NEW TRANSLATION
