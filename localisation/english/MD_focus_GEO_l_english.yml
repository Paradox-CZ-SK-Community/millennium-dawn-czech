 GEO_immediate_response_desc: "Po provedení rozsáhlých vojenských reforem a spolupráci s partnery z NATO Gruzie vytváří rámec rychlé reakce pro koordinaci s Arménií, Ukrajinou, Ázerbájdžánem a Spojenými státy v případě regionálních krizí." # todo: CHANGED
