 GEO_kick_russian_troops: "Reformy pozemních sil" # todo: CHANGED
 GEO_kick_russian_troops_desc: "Naše armáda zoufale potřebuje reformu po zkušenostech z konfliktů proti Jižní Osetii a Abcházii. Dodatečné financování, oslovení zahraničních podporovatelů, spojenců či hospodářských partnerů představují různé způsoby, jak reformovat naši skvělou armádu a optimalizovat ji pro budoucnost." # todo: CHANGED
