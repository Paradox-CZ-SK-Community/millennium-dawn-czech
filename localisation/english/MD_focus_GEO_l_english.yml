 GEO_ss_mhedrioni_desc: "Musíme vytvořit legii složenou z mezinárodních falangistů a domácích gruzínských nacionalistických fanatiků." # todo: NEW TRANSLATION
 GEO_ordnungstaat: "Stát pořádku" # todo: NEW TRANSLATION
 GEO_ordnungstaat_desc: "Gruzie je skutečně státem absolutního pořádku a poslušnosti a naši lidé nás podporují!" # todo: NEW TRANSLATION
 GEO_monarchist_council: "Monarchistická rada" # todo: NEW TRANSLATION
 GEO_monarchist_council_desc: "Monarchistická rada by měla rozhodovat o tom, kdo bude vůdcem Gruzie..." # todo: NEW TRANSLATION
 GEO_yos_warl_abk_oss: "Zničte pseudorepubliky" # todo: NEW TRANSLATION
 GEO_yos_warl_abk_oss_desc: "Takzvané republiky Abcházie a Jižní Osetie nejsou ničím jiným než ruskými loutkami okupujícími gruzínskou půdu. Vojenskou silou obnovíme naši územní celistvost a vrátíme tyto odštěpenecké regiony pod kontrolu Tbilisi." # todo: CHANGED
 GEO_yos_federal_abk_oss: "Federalizujte Gruzii" # todo: NEW TRANSLATION
 GEO_yos_federal_abk_oss_desc: "Namísto rozdrcení separatistických hnutí vojenskými prostředky můžeme Abcházii a Jižní Osetii nabídnout skutečnou autonomii v rámci federalizovaného gruzínského státu. Tato cesta může zachovat jednotu a zároveň respektovat regionální identity." # todo: CHANGED
 GEO_befriend_nat_nobody: "Naše vlastní pěst" # todo: NEW TRANSLATION
 GEO_befriend_nat_nobody_desc: "Gruzie byla po staletí sevřena mezi velmocemi. Možná nastal čas vydat se vlastní cestou a nespoléhat ani na Východ, ani na Západ, nýbrž na vlastní sílu a nezávislost." # todo: CHANGED
 GEO_befriend_nat_azeris: "Oslovit Ázerbájdžán" # todo: NEW TRANSLATION
 GEO_befriend_nat_azeris_desc: "Ázerbájdžán a Gruzie sdílejí hluboké historické vazby a společné zájmy v kavkazském regionu. Posílením vztahů s Baku můžeme vytvořit mocné spojenectví čelící regionálním hrozbám." # todo: CHANGED
 GEO_befriend_nat_armenia: "Spřátelit Arménii" # todo: NEW TRANSLATION
 GEO_befriend_nat_armenia_desc: "Navzdory historickému napětí čelí Arménie i Gruzie podobným výzvám ze strany větších sousedů. Partnerství s Jerevanem by mohlo oběma našim národům přinést vzájemnou bezpečnost a hospodářské výhody." # todo: CHANGED
 GEO_support_armenian_monarchists: "Podpořit Arménské monarchisty" # todo: NEW TRANSLATION
 GEO_support_armenian_monarchists_desc: "Podporou obnovení arménské monarchie můžeme vytvořit mocné dynastické spojenectví mezi našimi dvěma starobylými křesťanskými královstvími Kavkazu." # todo: CHANGED
 GEO_befriend_nat_russia: "Navázat přátelství s Ruskem" # todo: NEW TRANSLATION
 GEO_befriend_nat_russia_desc: "Rusko bylo po staletí gruzínským sousedem a vládcem. Namísto odporu vůči vlivu Moskvy by snad přizpůsobení se a přátelství s Ruskou federací mohly být cestou ke stabilitě a prosperitě." # todo: CHANGED
 GEO_alliance_armeniA_NAT: "Spojit Arménii" # todo: NEW TRANSLATION
 GEO_alliance_armeniA_NAT_desc: "Pod nacionalistickým vedením může Gruzie uzavřít strategické spojenectví s Arménií s cílem čelit ázerbájdžánskému vlivu v oblasti Kavkazu." # todo: NEW TRANSLATION
 GEO_befriend_nat_west: "Navázat přátelství s USA" # todo: NEW TRANSLATION
 GEO_befriend_nat_west_desc: "Spojené státy představují liberálně-demokratický řád, k němuž Gruzie usiluje připojit. Spojením s Washingtonem a snahou o západní integraci si zajistíme budoucnost v NATO a evropském společenství." # todo: CHANGED
 GEO_alliance_azeri: "Spojit Ázerbájdžán" # todo: NEW TRANSLATION
 GEO_alliance_azeri_desc: "Formální vojenské spojenectví s Ázerbájdžánem upevní naše strategické partnerství a vytvoří na Kavkaze mocný blok schopný odolávat ruskému a íránskému tlaku." # todo: CHANGED
 GEO_crush_both: "Rozdrtit oba" # todo: CHANGED
 GEO_crush_both_desc: "Odmítnutí spojenectví s Arménií i Ázerbájdžánem představuje agresivní nacionalistický postoj, který připravuje Gruzii na možný konflikt na více frontách." # todo: NEW TRANSLATION
 GEO_crush_nat_armeni: "Snězte Somekhia" # todo: NEW TRANSLATION
 GEO_crush_nat_armeni_desc: "Nacionalistická cesta vyžaduje územní expanzi do Arménie s cílem zajistit gruzínskou dominanci na Kavkaze, ať už s ázerbájdžánskou podporou, nebo prostřednictvím jednostranné akce." # todo: NEW TRANSLATION
 GEO_crush_nat_azeri: "Snězte Arran" # todo: NEW TRANSLATION
 GEO_crush_nat_azeri_desc: "Nacionalistické ambice vyžadují konfrontaci s Ázerbájdžánem za účelem nastolení gruzínské hegemonie v regionu, ať už ve spojenectví s Arménií, nebo prostřednictvím samostatného dobývání." # todo: NEW TRANSLATION
 GEO_integrat_armen: "Nakrmte je khinkali" # todo: NEW TRANSLATION
 GEO_integrat_armen_desc: "Kulturní asimilace dobytých arménských území prostřednictvím gruzínské kuchyně a tradic upevní nacionalistickou kontrolu nad nově získanými zeměmi." # todo: NEW TRANSLATION
 GEO_integrat_meskheti: "Nakrmte je khachapuri" # todo: NEW TRANSLATION
 GEO_integrat_meskheti_desc: "Integrace tureckých a ázerbájdžánských území v Meschétii prostřednictvím gruzínské kulturní dominance upevní nacionalistické územní zisky." # todo: NEW TRANSLATION
 GEO_crush_northcauc: "Dobýt severní Kavkaz" # todo: NEW TRANSLATION
 GEO_crush_northcauc_desc: "Národy Severního Kavkazu byly pod ruskou nadvládou příliš dlouho utlačovány. Jako přirozený vůdce kavkazského regionu musí Gruzie osvobodit naše horské bratry a sjednotit Kavkaz pod jediným praporem." # todo: CHANGED
 GEO_crush_turk: "Dobýt Turecko" # todo: NEW TRANSLATION
 GEO_crush_turk_desc: "Osmanská říše po staletí utlačovala Gruzii a naše křesťanské bratry. Nyní je Turecko oslabené a zranitelné. Získáme zpět svá historická území a pomstíme minulé křivdy." # todo: CHANGED
