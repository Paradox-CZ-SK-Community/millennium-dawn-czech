 GEO_the_conflict_desc: "Tento konflikt rozhodne o budoucnosti Gruzie. Sjednotí se, nebo se ještě více rozdělí?" # todo: NEW TRANSLATION
 georg.1000.t: "Éra Ševardnadze" # todo: NEW TRANSLATION
 georg.1000.d: "Eduard Amvrosijevič Ševardnadze prožil tři životy: jako sovětský stranický funkcionář, tvůrce perestrojky a nového myšlení a vůdce nezávislé Gruzie. Nikdo nemohl předvídat tyto zvraty, nejméně ze všech on sám. Stejně jako jeho patron Michail Gorbačov je Ševardnadze ve světě více respektován a oceňován než doma. Někteří tvrdí, že ve všem, do čeho se pustil, soustavně selhával, jiní jsou přesvědčeni, že lidstvo na jeho historické zásluhy nezapomene. Když však v březnu 1992 gruzínští politici, kteří právě svrhli Zviada Gamsachurdii, nabídli Ševardnadzemu vedení země, souhlasil. Těžko říci, co v tom převážilo: touha pomoci vlasti v těžké době, nebo touha po moci a aktivní práci. „Věděl jsem, že kdybych se do Gruzie nevrátil, zemřela by,“ řekl Ševardnadze. V jeho slovech byla jistá pravda, ale na rozdíl od Hejdara Alijeva, který se ocitl v podobné situaci, nedokázal sjednotit společnost. Ševardnadze pravděpodobně očekával, že bude v malé zemi „velrybou v akváriu“, před jejíž světovou autoritou se všichni svorně pokloní. Místo toho se ocitl ve společnosti vybičované k varu a obklopené ozbrojenými barony odhodlanými nikoho neposlouchat. Krizi ve vztazích s Abcházií a Jižní Osetií vytvořil jeho předchůdce Gamsachurdia. Ševardnadze pod tlakem veřejného mínění a vlivných vojenských představitelů Tengize Kitovaniho a Džaby Ioselianiho souhlasil v srpnu 1992 s vojenskou výpravou do Abcházie. Po svržení Gamsachurdii musí proruský Ševardnadze, který poměrně úspěšně buduje vztahy se Západem i Východem, avšak nejistě stojí na své někdejší autoritě, vytvořit plán dalšího rozvoje Gruzie." # todo: CHANGED
 georg.1000.a: "Pravá ruka Gorbačova." # todo: NEW TRANSLATION
 georg_chech.1.t: "Gelayevovi bojovníci v kaňonech" # todo: NEW TRANSLATION
 georg_chech.1.d: "Před několika dny se rozšířila informace, že do Abcházie plánuje vstoupit přibližně 700 ozbrojených čečenských bojovníků. Parlamentní menšina (politický blok Obroda, jehož vůdcem je Aslan Abašidze, předseda autonomní republiky Adžárie) obvinila gruzínské úřady z vojenského a politického avanturismu. Vůdce menšiny Džemal Gogitidze je přesvědčen, že čečenští bojovníci shromáždění v Kodorské soutěsce poblíž hranic Abcházie plánují přes Černé moře vstoupit do autonomní republiky Adžárie. Giorgi Targamadze, vůdce opoziční frakce Sjednocená Gruzie, tuto myšlenku podporuje a tvrdí, že vojenské a politické intriky byly vytvořeny úřady, aby odvedly pozornost společnosti od konfliktu mezi Ševardnadzem a Žvaniou (předsedou parlamentu) a sloužily ruským zájmům v Gruzii,“ uvádí list Resonance. Svaz občanů – vládnoucí strana – naopak považuje vládu Adžárie za vládu podporující ruské zájmy. Nelegální rozmístění ruských vojenských sil v okolí Choloki (Adžárie) bylo včera projednáno na zasedání Výboru pro obranu a bezpečnost. „Je třeba udělat vše pro to, aby ruské vojenské základny opustily území Gruzie, protože ohrožují bezpečnost země,“ oznámil předseda výboru Gia Baramidze. Vládnoucí i opoziční strany se snaží získat body před nadcházejícími volbami, zatímco vnitřní situace v zemi je velmi napjatá. Aktivizace tématu Abcházie a hovoření o možných nepřátelích je součástí volební kampaně,“ takto noviny hodnotily komentáře představitelů vlády. Za zmínku také stojí, že Rusko vyslalo výsadek na vojenskou základnu Gudauta na území Abcházie, aby našlo a zadrželo 13 čečenských bojovníků, o nichž se předpokládalo, že jsou tam rozmístěni (Resonance). Podle Chizriho Aldamova, neoficiálního představitele Čečenska v Gruzii, není žádný z těchto 13 bojovníků etnickým Čečencem; jsou to občané Ruské federace. Lze se domnívat, že pouze předstírají, že jsou Čečenci. K podobným případům došlo již dříve. Rusko je záměrně nechalo přijít do Gruzie, aby Gruzii zatáhlo do provokace, uvedl Aldamov." # todo: CHANGED
 georg_chech.1.a: "We need to stabilize the situation." # todo: NEW TRANSLATION
 georg_chech.2.t: "Setkání gruzínských a ruských úředníků." # todo: NEW TRANSLATION
 georg_chech.2.d: "Nedávno se konalo setkání gruzínských a ruských politiků v rámci řešení otázky přítomnosti čečenských bojovníků v hraničních kaňonech mezi Gruzií a Ruskou federací. Gruzie požádala o pomoc při řešení této záležitosti, navzdory dosavadním konfliktům. Gruzie žádá o přítomnost ruských mírových sil, stejně jako o pomoc v diplomatické podpoře Gruzie." # todo: NEW TRANSLATION
 georg_chech.2.a: "Doufejme, že nám pomohou." # todo: NEW TRANSLATION
 georg_chech.2.b: "Jistě, teroristy by měli být zadrženi." # todo: NEW TRANSLATION
 georg_chech.2.c: "Budou si muset vystačit sami." # todo: NEW TRANSLATION
 georg_chech.3.t: "Rusko posílá pomoc" # todo: NEW TRANSLATION
 georg_chech.3.d: "Rusko souhlasilo, že nám vyšle pomoc, abychom je dopadli a poslali zpět do Ruska." # todo: NEW TRANSLATION
 georg_chech.3.a: "Rozhodněme, co udělat dále..." # todo: NEW TRANSLATION
 georg_chech.4.t: "Gruzie nepředává čečenské bojovníky Rusku." # todo: NEW TRANSLATION
 georg_chech.4.d: "K překvapení ruských úřadů Gruzie prohlásila, že nemůže předat všech  čečenských bojovníků Rusku z různých důvodů. Někteří tvrdí, že se rozhodli je deportovat do třetích zemí nebo je postavit před soud v Gruzii. Gruzie odevzdala jen několik menších bojovníků, ale vůdcové jsou stále ve gruzínských věznicích." # todo: NEW TRANSLATION
 georg_chech.4.a: "Budou se hodit v budoucnu..." # todo: NEW TRANSLATION
 georg_chech.4.b: "Hraješ si s ohněm, Eduarde." # todo: NEW TRANSLATION
 georg_chech.4.c: "Nejdůležitější je, že hranice jsou nyní v bezpečí." # todo: NEW TRANSLATION
 georg_chech.5.t: "Gruzie předává čečenské bojovníky Rusku." # todo: NEW TRANSLATION
 georg_chech.5.d: "Gruzie tvrdí, že vydala všechy čečenské bojovníky Rusku z důvodu vzájemně prospěšné bezpečnosti a stability v regionu. Původně Gruzie vydala jen některé menší bojovníky, ale nyní byli vůdcové již postaveni k soudu v Rusku." # todo: NEW TRANSLATION
 georg_chech.5.a: "Doufejme, že se jim bude naše snaha líbit." # todo: NEW TRANSLATION
 georg_chech.5.b: "Gruzie-ruské vztahy by se měly posílit." # todo: NEW TRANSLATION
 georg_chech.5.c: "Cože? Co to? Na to kašleme." # todo: NEW TRANSLATION
 georg_chech.6.t: "Gruzie zahajuje diplomatickou misi." # todo: NEW TRANSLATION
 georg_chech.6.d: "Téměř současně s počátkem vojenské operace USA a Velké Británie v Afghánistánu – s počátkem boje proti terorismu – došlo k ozbrojenému konfliktu v zóně Abcházie–Gruzie. Z Kodoriho kaňonu, který patří Abcházii, ale je jí pod kontrolou Gruzie, dorazily spojené oddíly gruzínských partyzánů a militantů ze Severního Kavkazu na území pod kontrolou Sukhumi. Jednotky se stahují k hranicím Abcházie a Gruzie. Gruzijský parlament požadoval stažení ruských mírových sil z konfliktní zóny; Abcházie na oplátku oznámila, že požádá o začlenění do Ruska: ozbrojená fáze. Budeme se snažit tuto záležitost projednat se zástupcem Abcházie v Moskvě Igorem Akhbou, gruzínským parlamentním Hamletem Chipashvili a tbiliským zpravodajem Jurijem Vachnadze. Takže, v Kodoriho kaňonu probíhají skutečné boje a hned se objevuje několik otázek. Kodoriho kaňon geograficky patří Abcházii, ale do nedávna byl pod kontrolou Gruzie. Igor Akhba, zástupce Abcházie v Moskvě, promlouvá." # todo: NEW TRANSLATION
 georg_chech.6.a: "Kviciani a Gelaev, samozřejmě..." # todo: NEW TRANSLATION
 georg_chech.6.b: "Připravme vzájemnou dohodu." # todo: NEW TRANSLATION
 georg_chech.6.c: "Nám je to vlastně jedno." # todo: NEW TRANSLATION
 georg.3.t: "Gruzie žádá o dohodu o spolupráci." # todo: NEW TRANSLATION
 georg.3.d: "Gruzie žádá, abychom neřešili otázku Javakhk, výměnou za vzájemnou spolupráci v různých oblastech a komplexní dohodu o přátelství. Jak na ně odpovíme?" # todo: NEW TRANSLATION
 georg.3.a: "Samozřejmě" # todo: NEW TRANSLATION
 georg.3.b: "Promiň, ne" # todo: NEW TRANSLATION
 georg.4.t: "Arménie souhlasí!" # todo: NEW TRANSLATION
 georg.4.d: "Arménie souhlasila s dohodou." # todo: NEW TRANSLATION
 georg.4.a: "Skvělé" # todo: NEW TRANSLATION
 georg.5.t: "Arménie odepřela!" # todo: NEW TRANSLATION
 georg.5.d: "Arménie odmítla naši návrh dohody." # todo: NEW TRANSLATION
 georg.5.a: "Eh..." # todo: NEW TRANSLATION
 georg.21.t: "Gruzie chce investice" # todo: NEW TRANSLATION
 georg.21.d: "Gruzie od nás chce investice. Máme je přijmout?" # todo: NEW TRANSLATION
 georg.21.a: "Samozřejmě, Gogi!" # todo: NEW TRANSLATION
 georg.21.b: "Ne" # todo: NEW TRANSLATION
 georg.22.t: "Vyšetřování Saakashviliho" # todo: NEW TRANSLATION
 georg.22.d: "Měli bychom začít vyšetřování Saakashviliho a případně ho uvěznit?" # todo: NEW TRANSLATION
 georg.22.a: "Samozřejmě ne" # todo: NEW TRANSLATION
 georg.22.b: "samozřejmě ano" # todo: NEW TRANSLATION
 georg.23.t: "Saakashvili uniká do Ukrajiny" # todo: NEW TRANSLATION
 georg.23.d: "Saakashvili uprchl na Ukrajinu, aby unikl soudnímu řízení a uvěznění. Bude tam pokračovat ve své politické kariéře." # todo: NEW TRANSLATION
 georg.23.a: "Skatertyu Doroga, Mikheil." # todo: NEW TRANSLATION
 georg.24.t: "Velká debata" # todo: NEW TRANSLATION
 georg.24.d: "Kdo povede Gruzii dál? Tato otázka se v poslední době vynořila. Když mluvíme o národním dědictví, nebylo by skvělé znovu přivést Bagrationovce k vládě nad Gruzií?" # todo: CHANGED
 georg.24.a: "Ať žije král!" # todo: NEW TRANSLATION
 georg.24.b: "Yoseliani by měli být Nejvyšším vládcem a králem celé Gruzie." # todo: NEW TRANSLATION
 georg.25.t: "Gruzie nás zve do aliance!" # todo: NEW TRANSLATION
 georg.25.d: "Gruzie nás zve do jejich aliance, abychom bojovali proti našim společným nepřátelům!" # todo: NEW TRANSLATION
 georg.25.a: "Jistě!" # todo: NEW TRANSLATION
 georg.25.b: "ne." # todo: NEW TRANSLATION
 georg.26.t: "Gruzie žádá o záruky" # todo: NEW TRANSLATION
 georg.26.d: "Gruzie chce, aby naše vojsko chránilo Gruzii." # todo: NEW TRANSLATION
 georg.26.a: "Samozřejmě" # todo: NEW TRANSLATION
 georg.26.b: "Promiň, ne" # todo: NEW TRANSLATION
 georg.234.t: "Geopolice hra" # todo: NEW TRANSLATION
 georg.234.d: "Hra je ZDARMA a v gruzínštině, ale je poměrně intuitivní na hraní, existují 3 úrovně: 1 vyšetřování, 1 puzzle, 1 střílecí FPS, 1 úroveň s Easter egg. Úrovně lze hrát v libovolném pořadí, s více volbami a způsoby řešení hádanek. Odkazy ke stažení hry jsou uvedeny níže. ISO hry: Stormbringerstudios.com Patch: Stormbringerstudios.com" # todo: NEW TRANSLATION
 georg.234.a: "naše hra!" # todo: NEW TRANSLATION
 georg.1243.t: "Gruzie požaduje stažení ruských sil" # todo: NEW TRANSLATION
 georg.1243.d: "S ohledem na nedávné události zaslala gruzínská vláda naší vládě oznámení, v němž požaduje formální stažení veškerého našeho vojenského personálu ze země. Požadavky zahrnují také vyřazení všech vojenských základen vlastněných a provozovaných naší armádou, ruskými ozbrojenými silami. Naše síly byly staženy ze svých stanovišť a jsou posílány zpět přes gruzínské hranice." # todo: CHANGED
 georg.1243.a: "Nešťastná okolnost" # todo: NEW TRANSLATION
 georg.1244.t: "Zajmout staré sovětské letecké základny a jejich majetek na našem území." # todo: NEW TRANSLATION
 georg.1244.d: "Dnes Gruzínské ozbrojené síly vpadly a získaly staré sovětské letecké základny, zabraly veškerý zbývající majetek." # todo: NEW TRANSLATION
 georg.1244.a: "Vezmeme si je!" # todo: NEW TRANSLATION
 geo_misc.2.t: "Okamžité výcviky reakce" # todo: NEW TRANSLATION
 geo_misc.2.d: "Spojené státy, Gruzie, Ázerbájdžán, Arménie a Ukrajina provádějí vzájemné vojenské výcvikové programy v Gruzii!" # todo: NEW TRANSLATION
 geo_misc.2.a: "Skvělé!" # todo: NEW TRANSLATION
 geo_misc.3.t: "Gruzie navrhuje dohodu o neútočení" # todo: NEW TRANSLATION
 geo_misc.3.d: "Gruzie chce dosáhnout silného míru v regionu tím, že bude podepsána smlouva oběma našimi zeměmi." # todo: NEW TRANSLATION
 geo_misc.3.a: "Dobrá myšlenka!" # todo: NEW TRANSLATION
 geo_misc.3.b: "Nikdy" # todo: NEW TRANSLATION
 geo_misc.4.t: "Rusko popírá" # todo: NEW TRANSLATION
 geo_misc.4.d: "Rusko s námi nepodepíše pakt." # todo: NEW TRANSLATION
 geo_misc.4.a: "Smutný" # todo: NEW TRANSLATION
 geo_misc.5.t: "Gruzie navrhuje pakt o vzájemném neútočení" # todo: NEW TRANSLATION
 geo_misc.5.d: "Gruzie chce dosáhnout silného míru v regionu tím, že bude podepsána smlouva oběma našimi zeměmi." # todo: NEW TRANSLATION
 geo_misc.5.a: "Dobrá myšlenka!" # todo: NEW TRANSLATION
 geo_misc.5.b: "Nikdy" # todo: NEW TRANSLATION
 geo_misc.5.c: "Nikdy" # todo: NEW TRANSLATION
 geo_misc.6.t: "Osetie popírá" # todo: NEW TRANSLATION
 geo_misc.6.d: "Osetie s námi nepodepíše pakt." # todo: NEW TRANSLATION
 geo_misc.6.a: "Smutný" # todo: NEW TRANSLATION
 geo_misc.7.t: "Abcházie popírá" # todo: NEW TRANSLATION
 geo_misc.7.d: "Abcházie s námi nepodepíše pakt." # todo: NEW TRANSLATION
 geo_misc.7.a: "Smutný" # todo: NEW TRANSLATION
 geo_misc.8.t: "Gruzie navrhuje, abychom se připojili k ZSFSR" # todo: NEW TRANSLATION
 geo_misc.8.d: "Gruzínští komunisté chtějí pod jejich vedením vybudovat komunistickou Transkaukasii. Chtějí, abychom se začlenili do jejich svazu jako loutkový stát." # todo: NEW TRANSLATION
 geo_misc.8.a: "Všechno pro Rudý říjen!" # todo: NEW TRANSLATION
 geo_misc.8.b: "Jdi do prdele!" # todo: NEW TRANSLATION
 geo_misc.11.t: "Návrh Gruzínské SSR" # todo: NEW TRANSLATION
 geo_misc.11.d: "Gruzínští socialisté navrhují dohodu o sjednocení našich zemí. Co bychom měli dělat?" # todo: NEW TRANSLATION
 geo_misc.11.a: "Červení maskovaní kapitalisté nás nezotročí!" # todo: NEW TRANSLATION
 geo_misc.11.b: "Možná kvůli Rudému říjnu..." # todo: NEW TRANSLATION
 geo_misc.100.t: "Radiologický incident v Lia" # todo: NEW TRANSLATION
 geo_misc.100.d: "Začátkem tohoto týdne bylo oznámeno, že u tří mužů z města Lia byl diagnostikován akutní radiační syndrom (ARS). Muži sbírali dřevo v lese s výhledem na nádrž přehrady Enguri, když narazili na radioizotopový termoelektrický generátor, který byl opuštěn po rozpadu Sovětského svazu. Pokusili se generátor sami získat, utrpěli však vysoké dávky radiace, což vedlo k úmrtí jednoho z nich a k vážnému onemocnění dalších dvou." # todo: NEW TRANSLATION
 geo_misc.100.a: "Naše soustrast rodinám." # todo: NEW TRANSLATION
 georg_war2008.1.t: "Rozhodování o dalším postupu" # todo: NEW TRANSLATION
 georg_war2008.1.d: "A tak je problém Jižní Osetie a Abcházie skutečně na vrcholu současné agendy Gruzie... Na jedné straně je dobývání Gruzie obtížným a nebezpečným dobrodružstvím pro Gruzii. Někteří naši generálové navrhují provést blitzkrieg a zaútočit na Osetii ze dvou stran rychlým tahem, aby Rusko nemělo čas na nic a my bychom Osetii anektovali dříve, než ruské mírové síly zahájí jakékoli akce. Na druhé straně naši experti varují, že bychom měli opustit otázku Osetie a Abcházie a nechat všechno tak, jak je, možná i uznat jejich nezávislost. Soudruhu prezident [GEO.GetLeader], co budeme dělat?" # todo: NEW TRANSLATION
 georg_war2008.1.b: "Měli bychom otázku opustit... Uznějme je." # todo: NEW TRANSLATION
 georg_war2008.1.a: "Máme zaútočit na pseudorepubliky. Připravte plán." # todo: NEW TRANSLATION
 georg_war2008.1.c: "Existují i jiné možnosti?" # todo: NEW TRANSLATION
 georg_war2008.2.t: "Jiné možnosti" # todo: NEW TRANSLATION
 georg_war2008.2.d: "Soudruhu prezident [GEO.GetLeader], slíbili jste vyřešit tuto otázku! Lidé požadují řešení." # todo: NEW TRANSLATION
 georg_war2008.2.a: "Dobře... Uf." # todo: NEW TRANSLATION
 georg_war2008.3.t: "Ukrajinská dobrovolníci v Gruzii" # todo: NEW TRANSLATION
 georg_war2008.3.d: "Mnoho ukrajinských dobrovolníků z armády a vojenských veteránů z organizace UNA-UNSO se rozhodlo odpovědět na výzvu Gruzie o pomoc a vstoupili do gruzínských ozbrojených sil, čímž vytvořili dobrovolnické bataliony." # todo: NEW TRANSLATION
 georg_war2008.3.a: "Zajímavé" # todo: NEW TRANSLATION
 georg_war2008.3.b: "Skvělé" # todo: NEW TRANSLATION
 georg_war2008.4.t: "Čečenskí dobrovolníci v Gruzii." # todo: NEW TRANSLATION
 georg_war2008.4.d: "Mnoho čečenských bojovníků svobodné Ichkerie se rozhodlo přidat na stranu Gruzie a vytvořit dobrovolnické prapory v gruzínské armádě." # todo: CHANGED
 georg_war2008.4.a: "Uf, zrádci." # todo: NEW TRANSLATION
 georg_war2008.4.b: "Skvělé" # todo: NEW TRANSLATION
 georg_war2008.5.t: "Gruzie navrhuje dohodu." # todo: NEW TRANSLATION
 georg_war2008.5.d: "Gruzie nám chce nabídnout plnohodnotnou dohodu o Abcházii a Jižní Ossetii, podle níž vzdají své nároky a uznají neuznané republiky. To je samozřejmě dobře, ale nesmíme dovolit Gruzii vstoupit do NATO poté..." # todo: NEW TRANSLATION
 georg_war2008.5.a: "Souhlasíme, ale potřebujeme ústupky." # todo: NEW TRANSLATION
 georg_war2008.6.t: "Gruzie nás varuje před speciální operací." # todo: NEW TRANSLATION
 georg_war2008.6.d: "Gruzie nám sděluje, že se rozhodla provést vojenskou operaci na území Jižní Osetie. Slíbili, že nebudou útočit na naše mírové síly výměnou za naše nezasahování. Avšak pro malý důvod již zahájili ostřelování vojenského tábora poblíž Tskhinvali. Naše země garantuje bezpečnost Jižní Osetie; možná bychom měli zasáhnout a dát Gruzíncům lekci." # todo: NEW TRANSLATION
 georg_war2008.6.a: "Dojednejte přeživší!" # todo: NEW TRANSLATION
 georg_war2008.6.b: "Nechme Ossetii být..." # todo: NEW TRANSLATION
 georg_war2008.7.t: "Úspěšná operace Tygr!" # todo: NEW TRANSLATION
 georg_war2008.7.d: "Gruzie anektuje Jižní Osetii." # todo: NEW TRANSLATION
 georg_war2008.7.a: "Ha-ha!" # todo: NEW TRANSLATION
 georg_war2008.8.t: "Vynucený mír..." # todo: NEW TRANSLATION
 georg_war2008.8.d: "Nic se nezměnilo" # todo: NEW TRANSLATION
 georg_war2008.8.a: "Ah." # todo: NEW TRANSLATION
 georg_war2008.10.t: "Vynucený mír" # todo: NEW TRANSLATION
 georg_war2008.10.d: "Máme Gruzii vnutit mír, nebo pokračovat ve válce?" # todo: CHANGED
 georg_war2008.10.a: "Samozřejmě, už toho mají dost..." # todo: NEW TRANSLATION
 georg_war2008.10.b: "Zlikvidujte přeživší!" # todo: NEW TRANSLATION
 georg_war2008.11.t: "Gruzie žádá o záruky" # todo: NEW TRANSLATION
 georg_war2008.11.d: "Gruzie žádá o záruky, aby byla zajištěna ruská neagrese vůči jejich mezinárodně uznanému území." # todo: NEW TRANSLATION
 georg_war2008.11.a: "Gruzie Národní garda bude nasazena okamžitě." # todo: NEW TRANSLATION
 georg_war2008.11.b: "Promiňte, pánové, měla být jen jedna Gruzie." # todo: NEW TRANSLATION
 georg_revol.1.t: "Růžová revoluce v Gruzii!" # todo: NEW TRANSLATION
 georg_revol.1.d: "Období šedé lišky v Gruzii skončilo. Pokojná Růžová revoluce odvolala Eduarda Ševardnadze. Legenda lstivosti a umění intrik ho zradily. Ševardnadze mohl zachránit svou zemi před otřesem a sám sebe před zahanbením, kdyby se dávno stáhl. Gruzie by z toho měla jen prospěch. V posledních letech 75letý prezident problémy země neřešil, nýbrž je dával na vedlejší kolej. Gruzie zdroje byly vynakládány výhradně na udržení moci Ševardnadze. Ševardnadze oklamal svůj lid. Dovolil si, nebo dokonce sám zorganizoval volební podvody. Byla to lež, která vedla k jeho rezignaci. Zachránil zemi od krveprolití, a to je jeho zásluha. Avšak autorita státní moci v Gruzii dosud nebyla podkopána. Krom toho neexistuje odpověď na hlavní otázku: jaká bude budoucnost země po Ševardnadze?" # todo: NEW TRANSLATION
 georg_revol.1.a: "Nemáme jinou volbu" # todo: NEW TRANSLATION
 georg_revol.2.t: "Protesty v Gruzii" # todo: NEW TRANSLATION
 georg_revol.2.d: "Na demonstraci s protesty proti falšování voleb se sešlo v Tbilisi shromáždění. Vláda byla znepokojena a pro jistotu mírně upravila výsledek, aby Burdzhanadze-Demokraté získali jejich passing 7 procent. Všechny tyto nepokoje by bylo možno opatrně ignorovat, ale byla tu jedna jemná nuance - nový parlament by se nemusel sejít na vlně chaosu. Zjevně nebyl stanoven potřebný počet poslanců - polovina poslanců neuznala výsledky voleb. Ševardnadze musel něco udělat, aby parlament začal fungovat, ale nic nemohl. Šedá liška se rozhodla hrát na čas - vést nekonečné vyjednávání, dokud se protestující neomydlí. Na jeho straně byl silný spojenec v podobě listopadových dešťů v Tbilisi." # todo: NEW TRANSLATION
 georg_revol.2.a: "Doufejme, že protesty se samy uklidní..." # todo: NEW TRANSLATION
 georg_revol.3.t: "Éra Saakashviliho" # todo: NEW TRANSLATION
 georg_revol.3.d: "Éra Saakashvili začala v Gruzii. Zpožděná rezignace Eduarda Ševardnadze možná zabránila krvavé občanské válce. Budoucnost však zůstává velmi nebezpečná. Gruzie bude mít šanci na lepší budoucnost jen tehdy, pokud dokáže sjednotit umírněné politické síly opozice a izolovat radikály. Růžová revoluce vyvolá jistou nervozitu mezi prezidenti postsovětských zemí. Podobnému neklidu dojde i na Ukrajině, v Kyrgyzstánu a Uzbekistánu. Mnoho se změní i v samotném Rusku - úřady pochopí, že jsou zranitelné. Ministerstvo zahraničních věcí se znepokojilo skutečností, že postsovětské republiky také vyžadují pozornost a že s nimi musí také spolupracovat a chránit jejich zájmy tam." # todo: NEW TRANSLATION
 georg_revol.3.a: "Gruzie si zvolila svou cestu!" # todo: CHANGED
 georg_revol.4.t: "Kvitsianiho povstání!" # todo: NEW TRANSLATION
 georg_revol.4.d: "Kvitsiani prohlásil, že již není podřízen centrální vládě Gruzie. Důvodem tohoto prohlášení byla činnost členů gruzínské vlády - šéfů Ministerstva vnitra a Ministerstva obrany Vano Merabishviliho a Okruashviliho. Podle Kvitsianiho na jejich příkaz obyvatelé Kodori čelili perseci ze strany úřadů. Kvitsiani proto požadoval odstoupení šéfů gruzínských bezpečnostních složek a hrozil, že jinak vyvede lidi do ulic Tbilisi a uspořádá ozbrojený odpor proti gruzínské armádě přímo v Kodoru." # todo: NEW TRANSLATION
 georg_revol.4.a: "Uvidíme, co můžeme udělat." # todo: NEW TRANSLATION
 georg_revol.5.t: "Kriz v Adjarii!" # todo: NEW TRANSLATION
 georg_revol.5.d: "Abashidze, který byl proti naší současné vládě, začal provádět protigruinské aktivity v Adjarii. Během těchto projevů Abashidze podpořil prezidenta Eduarda Ševardnadze a na adjarské televizi označil vůdce opozice – Mikheil Saakashvili a David Berdzenishvili – za fašisty a jejich hnutí za fašistické. Dne 23. listopadu, když opozice obsadila budovu parlamentu, adjarská vláda vyhlásila výjimečný stav." # todo: NEW TRANSLATION
 georg_revol.5.a: "Pojďme si s tímto blbcem poradit." # todo: NEW TRANSLATION
 georg_revol.6.t: "Kriz Kodori" # todo: NEW TRANSLATION
 georg_revol.6.d: "Emzar Kvitsiani ohlásil znovuzaložení jednotky Monadire a prohlásil neposlušnost vůči vládě Gruzie, požadujíc odstoupení šéfů Ministerstva vnitra a Ministerstva obrany Vano Merabishviliho a Okruashviliho, kteří podle Kvitsianiho páchali svévoli proti Svanským a připravili jejich vyhlazení. Zároveň Kvitsiani hrozil činy občanské neposlušnosti a v extrémních případech převedení k ozbrojenému odporu." # todo: NEW TRANSLATION
 georg_revol.6.a: "Možná najdeme dohodu?" # todo: NEW TRANSLATION
 georg_revol.6.b: "Zrádci musí být potrestáni!" # todo: NEW TRANSLATION
 georg_revol.7.t: "Zhvania byl zabit!" # todo: NEW TRANSLATION
 georg_revol.7.d: "Tělo premiéra bylo nalezeno v bytě jeho přítele. Mrtvý byl nalezen také jeho přítel. Podle ministra přišel Z. Žvania minulou noc navštívit svého přítele, zástupce guvernéra jednoho z gruzínských regionů. Po nějaké době začala mít premiérova ochranka obavy, protože neodpovídal na telefonáty. Ve 4:30 místního času strážci rozbili okno a našli těla Z. Žvanii a jeho přítele. Podle předběžné verze, kterou uvedl V. Merabišvili, šlo o nehodu – příčinou smrti byla otrava plynem. David Morčiladze, generální ředitel tbiliské plynárenské distribuční společnosti JSC Tbilgaz, však po prohlídce bytu řekl televizi Rustavi 2, že k úniku zemního plynu nedošlo. Podle něj byl v bytě instalován plynový ohřívač. S největší pravděpodobností se v bytě po určitou dobu hromadily zplodiny nedokonalého spalování plynu, což mohlo způsobit otravu. Podle Echo Moskvy jsou navíc nyní všechny přístupy ke vchodu domu, kde Z. Žvania zemřel, obklíčeny policií. Novinářům rovněž není dovoleno vstoupit do republikové nemocnice, kam bylo jeho tělo převezeno. Jak sdělil zástupcům médií lékař nemocnice, až do dokončení vyšetřování nebudou s tiskem hovořit. „Byli jsme informováni, že prezident nařídil, abychom s novináři nekomunikovali,“ řekl. V Tbilisi se již konalo mimořádné zasedání vlády, svolané u příležitosti úmrtí Z. Žvanii. Na zasedání vystoupil prezident Gruzie Michail Saakašvili. Podle něj Gruzie ztratila velkého patriota a M. Saakašvili sám svého nejbližšího přítele, nejspolehlivějšího poradce a spolubojovníka. Prezident vyzval vládu k pevnosti, odolnosti a jednotě. M. Saakašvili rovněž vyjádřil soustrast rodinám Z. Žvanii a Raula Jusupova, který zemřel spolu s ním. Účastníci zasedání uctili památku zesnulých minutou ticha." # todo: CHANGED
 georg_revol.7.a: "Dobře" # todo: NEW TRANSLATION
 georg_revol.8.t: "Gruzie uvěznila domnělé ruské špiony!" # todo: NEW TRANSLATION
 georg_revol.8.d: "Po týdnu ticha Gruzie vnutila prohlášení, v němž bylo uvedeno 13 lidí podezřelých ze špionáže pro Rusko. Enveryho rozsáhlá operace, podle zástupců Ministerstva vnitra, je výsledkem čtyř let práce gruzinské kontrarozvědky. Ojedinělá operace a zničení mýtu o neporazitelnosti ruských tajných služeb – taková hodnocení byla v Gruzii učiněna v pátek po oficiálním prohlášení gruzinského ministerstva vnitra o odhalení špionážní sítě." # todo: NEW TRANSLATION
 georg_revol.8.a: "Zbláznili se?" # todo: NEW TRANSLATION
 georg_militar.1.t: "Vojenský převrat v Gruzii!" # todo: NEW TRANSLATION
 georg_militar.1.d: "Nedávno se v Gruzii odehrál vojenský převrat. Nejvyšší velení armády převzalo vládu Gruzie. Uvidíme, kam to povede." # todo: NEW TRANSLATION
 georg_militar.1.a: "Vpřed!" # todo: NEW TRANSLATION
 georg_militar.2.t: "Djaba Yoseliani je posílen v Gruzii" # todo: NEW TRANSLATION
 georg_militar.2.d: "Djaba Yoseliani byl posílen v Gruzii. On a jeho mafie/vojenská rada nyní sídlí ve vládním prezídiu Gruzie. Co udělá dál?" # todo: NEW TRANSLATION
 georg_militar.2.a: "Zajímej se." # todo: NEW TRANSLATION
 georg_military.1.t: "Gruzijská vojenská reforma" # todo: NEW TRANSLATION
 georg_military.1.d: "Gruzie úspěšně reformovala svou armádu; došlo k přílivu rekrutů, kteří se hlásí do obrany slavné země." # todo: NEW TRANSLATION
 georg_military.1.a: "Jste spokojeni s výsledkem." # todo: NEW TRANSLATION
 georgia_news.1.t: "Gruzie uznává Jižní Osetii a Abcházii!" # todo: NEW TRANSLATION
 georgia_news.1.d: "Vzhledem k nové politice Gruzie se Gruzie rozhodla uznat Jižní Osetii a Abcházii v rámci bilaterální spolupráce. Znamená to pro Gruzii mír a absence budoucích konfliktů?" # todo: NEW TRANSLATION
 georgia_news.1.o1: "Zajímavé" # todo: NEW TRANSLATION
