 GEO_dariali_hydropower_plant_desc: "Vodní elektrárna Dariali, která se nachází poblíž Gruzínské vojenské cesty v regionu Kazbegi, využije strmý spád řeky Těrek k výrobě čisté energie pro severní oblasti Gruzie." # todo: NEW TRANSLATION
