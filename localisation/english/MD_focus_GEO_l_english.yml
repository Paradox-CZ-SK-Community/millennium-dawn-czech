 GEO_radioloc_usa: "Oživit plány" # todo: NEW TRANSLATION
 GEO_radioloc_usa_desc: "Americké radarové a elektronické technologie výrazně zlepší schopnosti gruzínských válečných lodí v oblasti detekce a zaměřování." # todo: NEW TRANSLATION
 GEO_greece_repair: "Řecké opravárenské stanice" # todo: NEW TRANSLATION
 GEO_greece_repair_desc: "Zřízení zařízení pro opravy lodí ve spolupráci s Řeckem poskytne Gruzii klíčové loděniční kapacity pro údržbu a modernizaci černomořského loďstva." # todo: NEW TRANSLATION
 GEO_ukraine_verf: "Ukrajinský přístup k dokování" # todo: NEW TRANSLATION
 GEO_ukraine_verf_desc: "Spolupráce s ukrajinskými loděnicemi umožní přístup k odborným znalostem a zařízením pro stavbu námořních plavidel ze sovětské éry." # todo: NEW TRANSLATION
 GEO_contract_vmf: "Reforma VMF" # todo: NEW TRANSLATION
 GEO_contract_vmf_desc: "Smlouva s ruským námořnictvem (Военно-морской флот) o výcviku a odborné pomoci urychlí rozvoj gruzínského námořnictva díky spolupráci se zkušenou námořní mocností." # todo: NEW TRANSLATION
 GEO_money_navyusa: "Program partnerství s US Navy" # todo: NEW TRANSLATION
 GEO_money_navyusa_desc: "Finanční pomoc Spojených států pro rozvoj námořnictva poskytne zásadní prostředky na modernizaci gruzínských námořních schopností v Černém moři." # todo: NEW TRANSLATION
