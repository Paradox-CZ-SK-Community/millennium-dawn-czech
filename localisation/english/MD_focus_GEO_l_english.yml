 GEO_hydroelectric_plant_decision_category_desc: "Naše krásná země je bohatá na přírodní zdroje a řeky stékající z hor nejsou výjimkou. To nám poskytuje jedinečnou příležitost vybudovat další přehrady a vodní elektrárny, které doplní naši stárnoucí energetickou infrastrukturu." # todo: NEW TRANSLATION
