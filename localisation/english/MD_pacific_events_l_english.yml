 Solomon_Islands.1.t: "Mundská dohoda" # todo: NEW TRANSLATION
 Solomon_Islands.1.d: "Po intenzivním zprostředkování ze strany zvláštního vyslance Společenství národů Sitiveniho Rabuky podepsali provinční vláda a představitelé opozice Mundskou dohodu. Dohoda představuje devítibodový plán, jehož cílem je zmírnit etnické násilí a stanovit plán ústavní reformy." # todo: NEW TRANSLATION
 Solomon_Islands.1.a: "Křehký mír je lepší než žádný" # todo: NEW TRANSLATION
 Solomon_Islands.1.b: "Potopme dohody" # todo: NEW TRANSLATION
 Solomon_Islands.2.t: "Převrat Malaitských orlích sil" # todo: NEW TRANSLATION
 Solomon_Islands.2.d: "Politická situace dosáhla bodu zlomu. Dnes brzy ráno převzali členové Malaitských orlích sil, údajně s pomocí některých složek polovojenské policie, kontrolu nad klíčovými strategickými body v Honiáře. Premiér [SOL.GetLeader] byl se zbraní v ruce uvržen do domácího vězení. Vedení Malaitských orlích sil tvrdí, že vláda nedokázala ochránit zájmy Malaitanů, a požaduje okamžité předání moci. Demokratický proces byl fakticky pozastaven. " # todo: NEW TRANSLATION
 Solomon_Islands.2.a: "Manasseh Sogavare" # todo: NEW TRANSLATION
 Solomon_Islands.2.b: "Jimmy „Rasta“ Lusibaea" # todo: NEW TRANSLATION
 Solomon_Islands.3.t: "Útok Hnutí za svobodu Isatabu na Honiaru" # todo: NEW TRANSLATION
 Solomon_Islands.3.d: "Hnutí za svobodu Isatabu zahájilo masivní protiútok s cílem vytlačit malaitský vliv z ostrova. Z džungle se vynořili partyzánští bojovníci a oblehli hlavní město Honiaru. Jelikož se oficiální policejní síly rozštěpily podle etnických linií, země se propadla do rozsáhlé občanské války. Hnutí za svobodu Isatabu požaduje úplné vyhnání malaitských osadníků, zatímco vládou kontrolovaná vláda se připravuje na krvavou obranu městského centra. " # todo: NEW TRANSLATION
 Solomon_Islands.3.a: "Válka v Pacifiku." # todo: NEW TRANSLATION
 Solomon_Islands.4.t: "Krize na Šalomounových ostrovech" # todo: NEW TRANSLATION
 Solomon_Islands.4.d: "[SOL.GetNameWithFlag] upadly do stavu občanského kolapsu. Administrativa premiéra [SOL.GetLeader] je paralyzována sílícím napětím mezi Hnutím za svobodu Isatabu a Malaitskými orlími silami. Konflikt má kořeny ve sporech o vnitřní migraci na Guadalcanal a práva původních obyvatel na půdu. Co je nejhorší, důl Gold Ridge a další životně důležitá odvětví zastavily provoz, což ohrožuje naše hospodářské zájmy v jižním Pacifiku." # todo: NEW TRANSLATION
 Solomon_Islands.4.a: "Tuto nestabilitu nemůžeme ignorovat." # todo: NEW TRANSLATION
 Solomon_Islands.4.b: "Koho to zajímá? Já jsem [ROOT.GetLeader]" # todo: NEW TRANSLATION
 Solomon_Islands.5.t: "Žádost o zprostředkování" # todo: NEW TRANSLATION
 Solomon_Islands.5.d: "Ve zoufalé snaze zabránit úplné humanitární katastrofě [FROM.GetNameWithFlag] oficiálně požádaly, abychom hostili mírový summit. Jejich návrh předpokládá rámec usmíření prostřednictvím reforem decentralizace a autonomie, které mají uklidnit etnické frakce. Dále požádaly o vyslání skupiny správních a vojenských poradců, kteří zajistí, aby reformní proces nebyl narušován militantními zásahy." # todo: NEW TRANSLATION
 Solomon_Islands.5.a: "Přijměme mírový proces" # todo: NEW TRANSLATION
 Solomon_Islands.5.b: "Je to náš vnitřní boj, ostatní ať se nepletou" # todo: NEW TRANSLATION
 Solomon_Islands.6.t: "Odmítnutí zprostředkování" # todo: NEW TRANSLATION
 Solomon_Islands.6.d: "[SOL.GetNameWithFlag] bez obalu odmítly naši nabídku zprostředkovat probíhající krizi. Ve strohém komuniké vedení uvedlo, že nebude tolerovat neokoloniální vměšování do svých vnitřních záležitostí. Dalo jasně najevo, že zahraniční poradci ani diplomatické vměšování nejsou vítáni, a trvalo na tom, že Šalomounovy ostrovy vyřeší své spory samy, bez vnějšího dohledu. " # todo: NEW TRANSLATION
 Solomon_Islands.6.a: "Pak budou muset čelit následkům samy." # todo: NEW TRANSLATION
 Solomon_IslandsNews.1000.t: "Austrálie zprostředkovala příměří na Šalomounových ostrovech" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1000.d: "Po několika dnech vyjednávání na základně RAAF Townsville v Queenslandu bylo dosaženo kompromisu. Vláda [SOL.GetNameWithFlag] podepsala komplexní mírovou smlouvu. [AST.GetNameWithFlag] se zavázaly vést Mezinárodní tým pro monitorování míru, který bude dohlížet na třicetidenní amnestii za odevzdání zbraní a likvidaci odevzdaných zbraní. Přestože [AST.capital.GetName] zůstává obezřetné vůči rozšiřování mise." # todo: NEW TRANSLATION
 Solomon_IslandsNews.1000.a: "Na Šalomounovy ostrovy se vrací stabilita" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1001.t: "Příměří na Šalomounových ostrovech" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1001.d: "[FROM.GetNameWithFlag] úspěšně zprostředkovaly příměří mezi válčícími frakcemi [SOL.GetNameWithFlag]. Dohoda stanovuje plán odzbrojení a ústavní reformy. Všechny strany souhlasily s okamžitým ukončením nepřátelských akcí a vytvořením neutrálních monitorovacích sil. " # todo: NEW TRANSLATION
 Solomon_IslandsNews.1001.a: "Na Šalomounovy ostrovy se vrací stabilita" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1002.t: "Státní převrat na Šalomounových ostrovech" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1002.d: "Malaitské orlí síly, malaitská militantní organizace, obsadily hlavní město. Malaitské orlí síly, vyzbrojené ukradenými policejními zbraněmi a podporované zrádnými členy policejních polních sil, dnes brzy ráno obklíčily rezidenci premiéra Bartholomewa Ulufa'alu. Ulufa'alu byl pod silnou ochranou a s městskou zbrojnicí v rukou povstalců donucen podat rezignaci. Vláda podporovaná Malaitskými orlími silami nyní tvrdí, že je jedinou mocí v Honiáře." # todo: NEW TRANSLATION
 Solomon_IslandsNews.1002.a: "Blíží se bouře" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1003.t: "Šalomounovy ostrovy upadají do povstání" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1003.d: "Občanská válka skončila úplným vítězstvím Hnutí za svobodu Isatabu. Po dlouhém tažení partyzánské války Hnutí za svobodu Isatabu úspěšně přinutilo ke zhroucení administrativu v Honiáře spojenou s Malaitskými orlími silami." # todo: NEW TRANSLATION
 Solomon_IslandsNews.1003.a: "Demokracie v Honiáře padá." # todo: NEW TRANSLATION
 Solomon_IslandsNews.1004.t: "Konec občanského konfliktu na Šalomounových ostrovech" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1004.d: "Občanská válka skončila úplným vítězstvím Hnutí za svobodu Isatabu. Po dlouhém tažení partyzánské války Hnutí za svobodu Isatabu úspěšně přinutilo ke zhroucení administrativu v Honiáře spojenou s Malaitskými orlími silami." # todo: NEW TRANSLATION
 Solomon_IslandsNews.1004.a: "Jaká bude další kapitola" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1005.t: "Konec občanského konfliktu na Šalomounových ostrovech" # todo: NEW TRANSLATION
 Solomon_IslandsNews.1005.d: "Společné operace Malaitských orlích sil a zbytků národní policie konečně rozdrtily povstání Hnutí za svobodu Isatabu. Po brutální ofenzivě do vnitrozemí Guadalcanalu. " # todo: NEW TRANSLATION
 Solomon_IslandsNews.1005.a: "Jaká bude další kapitola" # todo: NEW TRANSLATION
