 ALG_kabylia_unrest: "Nepokoje v Kabýlii" # todo: NEW TRANSLATION
 ALG_kabylia_unrest_desc: "Od „Berberského jara“ v roce 1980 je Kabýlie poznamenána pravidelnými protesty, kulturními požadavky a nedůvěrou vůči ústřední vládě. Toto napětí doutná pod povrchem, podkopává stabilitu a hrozí přerůst v širší nepokoje, pokud nebude řešeno. Bez řešení by se události mohly v budoucnu dramaticky vyostřit." # todo: NEW TRANSLATION
 ALG_black_spring.1.t: "Nepokoje v Kabýlii" # todo: NEW TRANSLATION
