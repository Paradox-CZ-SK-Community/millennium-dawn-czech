 algeria.42.a: "Skvělé" # todo: NEW TRANSLATION
 algeria.43.t: "Alžírsko vydává diplomatický protest!" # todo: NEW TRANSLATION
 algeria.43.d: "Alžírský prezident Abderrazak Makri vydal proti naší vládě diplomatický protest. Tvrdí, že jsme teroristé a mezinárodní společenství musí zahájit zvláštní operaci s cílem zlikvidovat náš režim." # todo: NEW TRANSLATION
 algeria.43.a: "Jdi do pr***, Makri" # todo: NEW TRANSLATION
 ALG_support_fsa: "Podpora FSA" # todo: NEW TRANSLATION
 ALG_support_fsa_desc: "Naše vztahy se Sýrií mají dlouhou historii. Nyní musí být tyto vztahy vymezeny jejich vztahem k ideologii Bratrstva." # todo: NEW TRANSLATION
 ALG_brotherhood_diplo: "Diplomacie Bratrstva" # todo: NEW TRANSLATION
 ALG_brotherhood_diplo_desc: "Musíme reformovat naši diplomacii v souladu s naší novou vládou." # todo: NEW TRANSLATION
 ALG_hamas_under_wing: "Hamás pod naším křídlem" # todo: NEW TRANSLATION
 ALG_hamas_under_wing_desc: "Hamás je skupina bojovníků za svobodu v Pásmu Gazy, která je spojena s Muslimským bratrstvem. Pomáhat jim je naší povinností!" # todo: NEW TRANSLATION
 algeria.44.t: "Hamás přebírá kontrolu nad Gazou" # todo: NEW TRANSLATION
 algeria.44.d: "Hamás s podporou Alžírska převzal kontrolu nad Pásmem Gazy. Jejich ozbrojené milice obsadily vládní budovy a jejich mluvčí [HAM.GetLeader] prohlásil, že se skupina připravuje na pochod za osvobození mešity al-Aksá" # todo: NEW TRANSLATION
