 TT_ALG_KICKING_ASSADS_EFFECT: "Politická inkluzivita Alávitů: §R-40%§!" # todo: NEW TRANSLATION
 TT_ALG_REPUBLICANISM_FOCUS_EFFECT: "Pro každou významnou etnickou a náboženskou komunitu v Alžírsku si zvolíme mezi vyhrazením míst v parlamentu pro politiky zastupující tyto komunity, což zvýší inkluzivitu menšin výměnou za vyšší náklady na korupci, nebo tak neučiníme, což způsobí nepokoje a škody na majetku v jejich regionech, kdykoli jejich politická inkluzivita klesne pod §Y50%§!" # todo: NEW TRANSLATION
 TT_ALG_FEDERALISM_FOCUS_EFFECT: "Pro každou významnou etnickou a náboženskou komunitu v Alžírsku si zvolíme mezi udělením částečné autonomie, které zvýší jejich politickou inkluzivitu výměnou za nižší těžbu zdrojů, rychlost výstavby a počet stavebních slotů, stejně jako zvýšení nákladů na změnu vládního zákona nepřímo úměrně politické inkluzivitě komunity, nebo úplným propuštěním regionu jako autonomního státu" # todo: NEW TRANSLATION
 TT_ALG_DIRECT_DEMOCRACY_REQ: "Aby naše přímá demokracie fungovala, stát musí být sekularizován a teroristická hrozba se musí stát neexistující. Společnost musí být také zbavena radikálních salafistických ideálů" # todo: NEW TRANSLATION
 TT_ALG_SECULARIZE_CONSTITUTION: "V závislosti na přijatých reformách a politikách se buď staneme liberální demokracií, nebo neliberální demokracií" # todo: NEW TRANSLATION
