 ALG_idea_pro_palestinian_campaign: "Kampaň na podporu Palestiny" # todo: NEW TRANSLATION
 ALG_idea_pro_palestinian_campaign_desc: "Zlepšuje vztahy s palestinskými skupinami a potenciálně zvyšuje podporu alžírských hnutí za nezávislost v regionu." # todo: NEW TRANSLATION
