 ALG_resistance_power_struggle: "Boj o moc" # todo: NEW TRANSLATION
 ALG_resistance_power_struggle_desc: "Mezi alžírským lidem a *Le Pouvoir* zuří tichá válka. Obě strany se snaží upevnit podporu, dokud nevyhnutelný střet nerozhodne o budoucnosti Alžírska." # todo: NEW TRANSLATION
 Resistance_support: "Podpořit odpor" # todo: NEW TRANSLATION
