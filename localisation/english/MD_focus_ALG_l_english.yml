 ALG_sonatrach_restructure_desc: "Národní ropná společnost Sonatrach prochází rozsáhlou restrukturalizací s cílem zvýšit efektivitu, produkci a hospodářskou stabilitu. Tato proměna má posílit energetický sektor země a podpořit dlouhodobý růst." # todo: NEW TRANSLATION
