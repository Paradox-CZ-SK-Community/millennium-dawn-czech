 ALG_black_spring.1.a: "Tohle musíme řešit." # todo: NEW TRANSLATION
 ALG_black_decade: "Černá dekáda" # todo: NEW TRANSLATION
 ALG_black_decade_desc: "Alžírská občanská válka, v Alžírsku známá jako Černá dekáda, byla občanskou válkou mezi alžírskou vládou a různými islamistickými povstaleckými skupinami od 11. ledna 1992, kdy převrat zmařil islamistické volební vítězství, do 8. února 2002. Válka začala pomalu, protože se zpočátku zdálo, že vláda islamistické hnutí úspěšně rozdrtila. Objevily se však ozbrojené skupiny, které vyhlásily džihád, a do roku 1994 násilí dosáhlo takové úrovně, že se zdálo, že ho vláda nemusí zvládnout. V letech 1996–1997 bylo zřejmé, že islamistický odpor ztratil lidovou podporu, přesto boje pokračovaly ještě několik let." # todo: NEW TRANSLATION
 ALG_maghreb_invite.1.t: "Pozvání do Maghrebské unie" # todo: NEW TRANSLATION
