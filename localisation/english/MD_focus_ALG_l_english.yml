 ALG_civil_war_recovered: "Občanská válka překonána" # todo: NEW TRANSLATION
 ALG_civil_war_recovered_desc: "Národ vyšel z otřesů občanské války a zahájil dlouhý proces uzdravení a obnovy. Úsilí se soustředí na obnovení jednoty, rekonstrukci infrastruktury a prevenci budoucích vnitřních konfliktů." # todo: NEW TRANSLATION
