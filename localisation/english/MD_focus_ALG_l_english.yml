 ALG_join_belt_and_road: "Připojit se k Hedvábné stezce" # todo: NEW TRANSLATION
 ALG_join_belt_and_road_desc: "Připojíme se k čínskému železničnímu systému a vybudujeme první stanici metra v Africe." # todo: NEW TRANSLATION
