 ALG_transparent_budget: "Transparentní rozpočet" # todo: NEW TRANSLATION
 ALG_appoint_sellal: "Jmenovat Abdelmaleka Sellala" # todo: NEW TRANSLATION
 ALG_appoint_sellal_desc: "Sellal, technokrat a Bouteflikův loajalista, představuje kontinuitu a pragmatickou správu se zaměřením na stabilitu a řízení státních institucí." # todo: NEW TRANSLATION
 ALG_sellal_gets_appointed: "Abdelmalek Sellal byl jmenován předsedou vlády." # todo: NEW TRANSLATION
 ALG_sellal_modifiers: "§YÚčinky Sellalova jmenování:§!\nDemokratický posun: §G+0,10§!\nNáklady na byrokracii: §G-10 %§!\nDaňové příjmy: §G+3 %§!\nOčekávané výdaje na policii: §R-1§!\nOčekávané výdaje na zdravotnictví: §R-1§!" # todo: NEW TRANSLATION
 ALG_appoint_ouyahia: "Jmenovat Ahmeda Ouyahiu" # todo: NEW TRANSLATION
 ALG_appoint_ouyahia_desc: "Ouyahia je zkušený politik známý tvrdými úspornými opatřeními a loajalitou k vládnoucímu establishmentu. Jeho styl vedení upřednostňuje centralizovanou kontrolu a finanční disciplínu." # todo: NEW TRANSLATION
 ALG_ouyahia_gets_appointed: "Ahmed Ouyahia byl jmenován předsedou vlády." # todo: NEW TRANSLATION
 ALG_ouyahia_modifiers: "§YÚčinky Ouyahiova jmenování:§!\nDemokratický posun: §G+0,10§!\nNáklady na byrokracii: §G-10 %§!\nDaňové příjmy: §G+3 %§!\nOčekávané výdaje na policii: §R-1§!\nOčekávané výdaje na zdravotnictví: §R-1§!" # todo: NEW TRANSLATION
 ALG_appoint_bedoui: "Jmenovat Noureddina Bedouiho" # todo: NEW TRANSLATION
 ALG_appoint_bedoui_desc: "Bedoui, kariérní byrokrat a ministr, ztělesňuje technokratickou loajalitu k prezidentskému úřadu. Jeho styl vlády zdůrazňuje administrativní efektivitu a omezené reformy." # todo: NEW TRANSLATION
 ALG_bedoui_gets_appointed: "Noureddine Bedoui byl jmenován předsedou vlády." # todo: NEW TRANSLATION
 ALG_bedoui_modifiers: "§YÚčinky Bedouiova jmenování:§!\nDemokratický posun: §G+0,10§!\nNáklady na byrokracii: §G-10 %§!\nDaňové příjmy: §G+3 %§!\nOčekávané výdaje na policii: §R-1§!\nOčekávané výdaje na zdravotnictví: §R-1§!" # todo: NEW TRANSLATION
 ALG_no_pm_set: "§RŽádný předseda vlády nebyl jmenován§!" # todo: NEW TRANSLATION
 ALG_ahmed_gaid_salah_desc: "Náčelník štábu Lidové národní armády Ahmed Gaïd Salah byl kariérní důstojník, který během války za nezávislost stoupal vojenskými hodnostmi a později se stal jednou z nejvlivnějších osobností alžírských vojenských a politických záležitostí." # todo: NEW TRANSLATION
 ALG_smain_lamari_desc: "Smain Lamari, vedoucí alžírských zpravodajských a kontrarozvědných služeb, sehrál ústřední úlohu ve „špinavé válce“ proti islamistickým povstalcům během Černé dekády." # todo: NEW TRANSLATION
 ALG_kaidi_mohamed_desc: "Respektovaný důstojník se zkušenostmi z mechanizovaných jednotek Kaidi Mohamed se specializoval na obrněný boj a modernizaci alžírských pozemních sil." # todo: NEW TRANSLATION
 ALG_ahcene_tafer_desc: "Ahcène Tafer byl známý svým vedením alžírských mechanizovaných jednotek a svou úlohou při restrukturalizaci armády v poválečných letech." # todo: NEW TRANSLATION
 ALG_mohammed_larbi_haouli_desc: "Mohammed Larbi Haouli velel alžírnému námořnictvu v období modernizace a vyvažoval pobřežní obranu s regionální spoluprací." # todo: NEW TRANSLATION
 ALG_ammar_atamnia_desc: "Ammar Atamnia, vysoký důstojník působící jako stratég alžírských pozemních sil, byl známý důrazem na obranný boj a vojenský výcvik." # todo: NEW TRANSLATION
 ALG_mohammed_al_arabi_hawalli_desc: "Mohammed Al-Arabi Hawalli zastával velitelské funkce v námořnictvu a přispěl k reformě alžírských námořních sil." # todo: NEW TRANSLATION
 ALG_mahmoud_laraba_desc: "Velitel letectva Mahmoud Laraba se podílel na výcviku pilotů a reorganizaci alžírské sítě protivzdušné obrany." # todo: NEW TRANSLATION
 ALG_mohamed_lamari_desc: "Mohamed Lamari byl během Černé dekády náčelníkem štábu a jednou z klíčových postav řídících alžírské protipovstalecké operace." # todo: NEW TRANSLATION
 ALG_said_chengriha_desc: "Said Chengriha se specializoval na obrněný boj a logistiku, později povýšil do čela alžírských pozemních sil a nakonec se stal náčelníkem štábu." # todo: NEW TRANSLATION
 ALG_ben_ali_ben_ali_desc: "Ben Ali Ben Ali, velitel elitních jednotek Alžírska, si mezi pěchotou vybudoval pověst profesionality a disciplíny." # todo: NEW TRANSLATION
 ALG_fatima_zohra_ardjoune_desc: "Fatima Zohra Ardjoune, jedna z prvních žen v Alžírsku, které dosáhly hodnosti generála, byla vojenskou lékařkou a symbolem modernizace ozbrojených sil." # todo: NEW TRANSLATION
 ALG_mohamed_mediene_desc: "Mohamed Mediène, známý jako „Toufik“, vedl v letech 1990 až 2015 mocnou alžírskou zpravodajskou službu (DRS) a stal se jednou z nejvlivnějších osobností moderních dějin Alžírska." # todo: NEW TRANSLATION
 ALG_abdelmalek_guenaizia_desc: "Abdelmalek Guenaizia působil jako náměstek ministra obrany a později jako náčelník štábu. Sehrál klíčovou úlohu při modernizaci alžírské armády." # todo: NEW TRANSLATION
 ALG_ahmed_bousteila_desc: "Ahmed Bousteila, velitel alžírského četnictva, dohlížel na bezpečnost venkovských oblastí Alžírska a boj proti pašování a terorismu." # todo: NEW TRANSLATION
 ALG_fatima_boudouani_desc: "Fatima Boudouani, první žena povýšená na generálku v alžírské armádě (2009), představovala průlom v začleňování žen do ozbrojených sil." # todo: NEW TRANSLATION
 alg_medal_1: "Řád 1. listopadu" # todo: NEW TRANSLATION
 alg_medal_1_desc: "Udělován za mimořádnou statečnost při obraně národa." # todo: NEW TRANSLATION
 alg_medal_2: "Medaile národního osvobození" # todo: NEW TRANSLATION
 alg_medal_2_desc: "Připomíná významný přínos k boji Alžírska za nezávislost." # todo: NEW TRANSLATION
 alg_medal_3: "Medaile vojenských zásluh" # todo: NEW TRANSLATION
 alg_medal_3_desc: "Udělována za vynikající velení a službu." # todo: NEW TRANSLATION
 alg_medal_4: "Medaile za statečnost" # todo: NEW TRANSLATION
 alg_medal_4_desc: "Oceňuje činy odvahy na bojišti." # todo: NEW TRANSLATION
 alg_medal_5: "Medaile lidové služby" # todo: NEW TRANSLATION
 alg_medal_5_desc: "Udělována za nezištnou službu při ochraně civilistů." # todo: NEW TRANSLATION
 alg_medal_6: "Medaile odkazu mučedníků" # todo: NEW TRANSLATION
 alg_medal_6_desc: "Symbol nejvyšší oběti pro národ." # todo: NEW TRANSLATION
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0: "Podporučík" # todo: NEW TRANSLATION
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1: "Poručík" # todo: NEW TRANSLATION
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2: "Kapitán" # todo: NEW TRANSLATION
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3: "Major" # todo: NEW TRANSLATION
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4: "Plukovník" # todo: NEW TRANSLATION
 algeria_intro.1.t: "Alžírská lidově demokratická republika" # todo: NEW TRANSLATION
 algeria_intro.1.d: "Alžírsko vstupuje do 21. století poznamenané krvavou Černou dekádou, přesto však stále stojí. Stát přežil islamistické povstání, ale rány občanské války zůstávají hluboké. Prezident Abdelaziz Bouteflika slibuje usmíření a obnovu, avšak výzvy před námi jsou skličující: oživit ekonomiku, reformovat armádu, obnovit důvěru mezi lidem a státem a orientovat se mezi mocnými zahraničními partnery. Upevní Alžírsko stabilitu a povznese se v regionální mocnost, nebo znovu upadne do vnitřních rozbrojů?" # todo: NEW TRANSLATION
 algeria_intro.1.a: "Národ poznamenaný, ale nezlomený." # todo: NEW TRANSLATION
 ALG_resistance_window_title: "Alžírské hnutí odporu" # todo: NEW TRANSLATION
 ALG_resistance_window_desc: "Národem otřásají rozsáhlé protesty, nepokoje a odpor. Le Pouvoir se snaží potlačit nesouhlas, ale čím větší tlak vyvíjí, tím silnější odpor vzniká." # todo: NEW TRANSLATION
 ALG_protester_exhaustion_TT: "§YProtestující§! jsou vyčerpáni vládními protiopatřeními." # todo: NEW TRANSLATION
 ALG_deploys_security_TT: "§YStát nasazuje rozsáhlé bezpečnostní síly k potlačení nepokojů.§!" # todo: NEW TRANSLATION
 ALG_presidential_decisions_only_one_is_available_TT: "Současně může být aktivní pouze jedno potlačovací opatření." # todo: NEW TRANSLATION
 ALG_resistance_movement: "Hnutí Hirak" # todo: NEW TRANSLATION
 ALG_resistance_movement_desc: "Celostátní lidové protesty známé jako Hirak nadále požadují politické reformy, transparentnost a sociální spravedlnost v celém Alžírsku." # todo: NEW TRANSLATION
 ALG_throttle_internet_speeds: "Nařízení č. 24-17: Regulace telekomunikací" # todo: NEW TRANSLATION
 ALG_throttle_internet_speeds_desc: "Na základě nařízení 24-17 úřady omezují přístup k online platformám a sociálním sítím, aby narušily činnost organizátorů Hiraku. To omezuje koordinaci protestů, ale frustruje občany a zpomaluje hospodářskou aktivitu." # todo: NEW TRANSLATION
 ALG_nationwide_security_presence: "Operace Pouštní jestřáb: Celostátní bezpečnostní přítomnost" # todo: NEW TRANSLATION
 ALG_nationwide_security_presence_desc: "Bezpečnostní síly jsou v rámci operace Pouštní jestřáb mobilizovány po celé zemi, aby odradily demonstrace Hiraku. Toto opatření je účinné při odrazování protestů, zvyšuje však náklady a podrývá důvěru veřejnosti." # todo: NEW TRANSLATION
 ALG_fund_pro_government_protests: "Program národní solidarity: Iniciativa „Baraka“" # todo: NEW TRANSLATION
 ALG_fund_pro_government_protests_desc: "Vláda v rámci projektu Baraka financuje a organizuje demonstrace na podporu režimu, aby čelila hnutí Hirak. To může oslabit rozmach opozice, je však nákladné a hrozí podnícení veřejné nespokojenosti." # todo: NEW TRANSLATION
 ALG_deploy_security_kabylia_1: "Nasadit bezpečnostní jednotky do Kabylie" # todo: NEW TRANSLATION
 ALG_deploy_security_kabylia_1_desc: "Kabylie se stala ohniskem nepokojů. Nasazení bezpečnostních sil může region uklidnit, hrozí však další rozdmýchání místní nespokojenosti." # todo: NEW TRANSLATION
 ALG_deploy_security_mzab_1: "Nasadit bezpečnostní jednotky do údolí M'zab" # todo: NEW TRANSLATION
 ALG_deploy_security_mzab_1_desc: "Napětí v údolí M'zab eskalovalo. Vyslání bezpečnostních oddílů může místní nepokoje omezit, tvrdé operace však mohou odcizit místní komunity a podkopat dlouhodobou důvěru." # todo: NEW TRANSLATION
 ALG_deploy_security_aures_1: "Nasadit bezpečnostní jednotky do pohoří Aurès" # todo: NEW TRANSLATION
 ALG_deploy_security_aures_1_desc: "Pohoří Aurès se stalo ohniskem demonstrací. Bezpečnostní nasazení může rozehnat velká shromáždění, zároveň však zatíží logistiku v náročném terénu a může prohloubit regionální nespokojenost." # todo: NEW TRANSLATION
 ALG_deploy_security_tamanrasset_1: "Nasadit bezpečnostní jednotky do provincie Tamanrasset" # todo: NEW TRANSLATION
 ALG_deploy_security_tamanrasset_1_desc: "V jižních provinciích Tamanrassetu narůstají nepokoje. Nasazení sil může stabilizovat dopravní trasy a klíčová zařízení, hrozí však poškození vztahů s místními komunitami a narušení transsaharského obchodu." # todo: NEW TRANSLATION
 ALG_deploy_security_granderg_1: "Nasadit bezpečnostní jednotky do oblasti Grand Erg Occidental" # todo: NEW TRANSLATION
 ALG_deploy_security_granderg_1_desc: "Nepokoje v okolí Grand Erg Occidental ohrozily odlehlá sídla a kritickou infrastrukturu. Bezpečnostní hlídky mohou krátkodobě obnovit pořádek, drsné prostředí však činí dlouhodobé operace nákladnými a politicky citlivými." # todo: NEW TRANSLATION
 ALG_deploy_security_atlas_1: "Nasadit bezpečnostní jednotky do podhůří Atlasu" # todo: NEW TRANSLATION
 ALG_deploy_security_atlas_1_desc: "V podhůří Atlasu se opakovaně konaly protesty a pracovní stávky. Cílené nasazení může zabránit masové mobilizaci podél dopravních koridorů, může však posílit nespokojenost venkovského obyvatelstva." # todo: NEW TRANSLATION
 ALG_deploy_security_constantinois_1: "Nasadit bezpečnostní jednotky do oblasti Constantinois" # todo: NEW TRANSLATION
 ALG_deploy_security_constantinois_1_desc: "Constantine a jeho okolí čelí častým demonstracím. Soustředění bezpečnostních sil zde může ochránit vládní zařízení a přístavy, zvyšuje však pravděpodobnost střetů v hustě obydlených městských čtvrtích." # todo: NEW TRANSLATION
 ALG_deploy_security_algerois_1: "Nasadit bezpečnostní jednotky do metropolitní oblasti Alžíru" # todo: NEW TRANSLATION
 ALG_deploy_security_algerois_1_desc: "Alžír zůstává centrem aktivity Hiraku. Výrazná bezpečnostní přítomnost může odradit pouliční mobilizaci a zabezpečit instituce, hrozí však viditelné represe v hlavním městě a značné politické následky." # todo: NEW TRANSLATION
 ALG_deploy_security_oranais_1: "Nasadit bezpečnostní jednotky do Oranu a na západní pobřeží" # todo: NEW TRANSLATION
 ALG_deploy_security_oranais_1_desc: "V oblasti Oranu přibývá demonstrací spojených s dělnickými a mládežnickými sítěmi. Nasazení sil může ochránit přístavy a hospodářská centra, může však narušit obchod a vyostřit napětí s místními vůdci." # todo: NEW TRANSLATION
 ALG_doing_decision: "V současnosti prosazujeme potlačovací opatření" # todo: NEW TRANSLATION
 ALG_doing_decision_y: "V současnosti prosazujeme potlačovací opatření" # todo: NEW TRANSLATION
