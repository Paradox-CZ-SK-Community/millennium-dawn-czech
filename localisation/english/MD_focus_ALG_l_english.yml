 TT_ALG_ALLY_ULEMA: "Ulamá se k nám připojí jako vnitřní frakce v našem boji" # todo: NEW TRANSLATION
 TT_ALG_ALLY_INTL_BANKERS: "Mezinárodní bankéři se k nám připojí jako vnitřní frakce v našem boji" # todo: NEW TRANSLATION
 TT_ALG_AGRICULTURAL_INVESTMENT_EFFECT: "Několikanásobné investice do zemědělství umožní vznik nových trhů a podniků prodávajících úrodu. Počet investic potřebných pro vznik nových podniků je však ovlivněn úrovní korupce" # todo: NEW TRANSLATION
 ALG_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§YPozveme stranu do koalice. Tato strana nám během procesu budování státu a vyvažování moci výrazně pomůže v její příslušné otázce, ať už jde o centralizaci, nebo decentralizaci§!" # todo: NEW TRANSLATION
 ALG_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§CPřítomnost této strany v koalici nám během procesu budování státu a vyvažování moci výrazně pomůže s centralizací§!" # todo: NEW TRANSLATION
 ALG_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§GPřítomnost této strany v koalici nám během procesu budování státu a vyvažování moci výrazně pomůže s decentralizací§!" # todo: NEW TRANSLATION
 ALG_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "Pokud uspějeme, získáme §G75§! politické moci a ideu §YNastupující byrokraté§!, která na §Y100§! dní poskytne §G+0,5§! §Ydenního zisku politické moci§! a §G+0,2§! §Yrychlosti výstavby§!" # todo: NEW TRANSLATION
 ALG_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "Pokud uspějeme, získáme §G5%§! stability" # todo: NEW TRANSLATION
 ALG_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "Pokud uspějeme, získáme §G10%§! obliby strany a snížíme korupci" # todo: NEW TRANSLATION
 ALG_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "Pokud uspějeme, snížíme korupci a získáme §YVzestup dobrovolnických organizací§!, což na §Y100§! dní poskytne §G0,2§! denního zisku politické moci a §G+30%§! rychlosti výstavby" # todo: NEW TRANSLATION
 ALG_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "Pokud uspějeme, urychlíme cyklus našeho hospodářského růstu" # todo: NEW TRANSLATION
 TT_ALG_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§GJakmile budou po vyhoštění Asadovců odstraněni udělením občanství Kurdům, vytvoří politickou stranu usilující o přeměnu Alžírska na federaci§!" # todo: NEW TRANSLATION
 ALG_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§RMusí být k dispozici alespoň jeden průmyslový komplex, který není přiřazen k výstavbě. Zrušte přidělenou výstavbu nebo počkejte, dokud nebude dokončena a komplex se neuvolní§!" # todo: NEW TRANSLATION
 ALG_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§RMusí být k dispozici alespoň dva průmyslové komplexy, které nejsou přiřazeny k výstavbě. Zrušte přidělenou výstavbu nebo počkejte, dokud nebude dokončena a komplexy se neuvolní§!" # todo: NEW TRANSLATION
 ALG_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§RMusí být k dispozici alespoň tři průmyslové komplexy, které nejsou přiřazeny k výstavbě. Zrušte přidělenou výstavbu nebo počkejte, dokud nebude dokončena a komplexy se neuvolní§!" # todo: NEW TRANSLATION
