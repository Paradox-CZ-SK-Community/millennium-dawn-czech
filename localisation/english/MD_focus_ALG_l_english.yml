 ALG_letter_isr: "Izraelská manipulace" # todo: NEW TRANSLATION
 ALG_letter_isr_desc: "Ach, Izraeli! Nastal čas rozhodnout, co s tebou uděláme." # todo: NEW TRANSLATION
 MSP_letter_isr: "Izraelská manipulace" # todo: NEW TRANSLATION
 MSP_letter_isr_desc: "Ach, Izraeli! Nastal čas rozhodnout, co s tebou uděláme." # todo: NEW TRANSLATION
 ALG_und_supp_hamas: "Tajná podpora Hamásu" # todo: NEW TRANSLATION
 ALG_und_supp_hamas_desc: "Aby byla věc Hamásu úspěšná, musíme jej materiálně podporovat." # todo: NEW TRANSLATION
 ALG_org_of_isl_coop: "Organizace islámské spolupráce" # todo: NEW TRANSLATION
 ALG_org_of_isl_coop_desc: "Organizace islámské spolupráce, dříve Organizace islámské konference, je mezivládní organizace založená v roce 1969, která se skládá z 57 členských států, z nichž 48 jsou země s muslimskou většinou." # todo: NEW TRANSLATION
 MSP_und_supp_hamas: "Tajná podpora Hamásu" # todo: NEW TRANSLATION
 MSP_und_supp_hamas_desc: "Aby byla věc Hamásu úspěšná, musíme jej materiálně podporovat." # todo: NEW TRANSLATION
 MSP_org_of_isl_coop: "Organizace islámské spolupráce" # todo: NEW TRANSLATION
 MSP_org_of_isl_coop_desc: "Organizace islámské spolupráce, dříve Organizace islámské konference, je mezivládní organizace založená v roce 1969, která se skládá z 57 členských států, z nichž 48 jsou země s muslimskou většinou." # todo: NEW TRANSLATION
 algeria.49.t: "Alžírsko žádá o propuštění Omara Abdela Rahmana" # todo: NEW TRANSLATION
 algeria.49.d: "Makri ve svém dopise krátce zmínil, že nás žádá o osvobození Omara Abdela Rahmana, odsouzeného za bombový útok na Světové obchodní centrum v New Yorku v roce 1993, spolu s mnoha Egypťany zatčenými během revoluce. Mluvčí Bratrstva později uvedl, že vydání je navrhováno z humanitárních důvodů a že Makri neměl v úmyslu zvrátit Abdel-Rahmanovo trestní odsouzení." # todo: NEW TRANSLATION
 algeria.49.a: "Zbláznil se Makri?" # todo: NEW TRANSLATION
 algeria.49.b: "Uf, jistě?" # todo: NEW TRANSLATION
 ALG_supp_plo: "Podpořit OOP" # todo: NEW TRANSLATION
 ALG_supp_plo_desc: "Organizace pro osvobození Palestiny (OOP) je již dlouho klíčovým aktérem v boji za sebeurčení Palestinců. Podpora OOP by mohla posílit naše postavení u mezinárodních spojenců a podpořit mírové řešení konfliktu." # todo: NEW TRANSLATION
 ALG_the_pal_issue: "Palestinská otázka" # todo: NEW TRANSLATION
 ALG_the_pal_issue_desc: "Otázka Palestiny zůstává klíčovým tématem naší zahraniční politiky. Náš postoj k palestinskému boji určí naše mezinárodní spojenectví a vliv v regionu. Musíme rozhodnout, jak tento pokračující konflikt řešit." # todo: NEW TRANSLATION
 ALG_supp_hamas: "Podpořit Hamás" # todo: NEW TRANSLATION
 ALG_supp_hamas_desc: "Hamás představuje významnou frakci palestinského odporu. Poskytnutím podpory můžeme posílit naše vazby s touto skupinou, zvýšit svůj vliv v regionu a spojit se s jejím bojem." # todo: NEW TRANSLATION
 ALG_diplo: "Diplomacie MSP" # todo: NEW TRANSLATION
 ALG_diplo_desc: "Musíme reformovat naši diplomacii v souladu s naší novou vládou." # todo: NEW TRANSLATION
 ALG_Get_rid_of_military_corrupt: "Očistit armádu od zkorumpovaných činitelů" # todo: NEW TRANSLATION
 ALG_Get_rid_of_military_corrupt_desc: "Armáda je pevně zakořeněná v našich institucích a představuje jasnou hrozbu pro budoucnost naší země. Zatkneme její představitele na základě obvinění z korupce a zabavíme veškerý majetek, ke kterému se dostaneme" # todo: NEW TRANSLATION
 idea_algerian_oligarchy_arrests: "Očista armády" # todo: NEW TRANSLATION
 ALG_the_coalition: "Koalice" # todo: NEW TRANSLATION
 ALG_the_coalition_desc: "Po obnovení politických stran povstaly dvě významné síly. Jedna prosazuje federalizaci státu a předání větší moci provinciím, zatímco druhá podporuje upevnění centralizované autority a zachování jednotné centralizované republiky. Musíme pečlivě zvolit, s kým se spojíme" # todo: NEW TRANSLATION
 federalists_in_coalition: "Federalistická strana v koalici" # todo: NEW TRANSLATION
 nationalists_in_coalition: "Nacionalistická strana v koalici" # todo: NEW TRANSLATION
 ALG_dismantle_the_military: "Omezit vojenský rozpočet" # todo: NEW TRANSLATION
 ALG_dismantle_the_military_desc: "Velká část HDP určeného na obranu byla kvůli zakořeněné korupci v institucích našich ozbrojených sil zpronevěřena a směřována do zbytečných projektů. Znovu využijeme a prodáme vše, k čemu se dostaneme. Ačkoli to může oslabit naši armádu a učinit nás zranitelnými vůči hrozbám, jde o nezbytný krok k hospodářskému oživení a vymýcení korupce" # todo: NEW TRANSLATION
 ALG_empower_institutions: "Posílit instituce" # todo: NEW TRANSLATION
 ALG_empower_institutions_desc: "Naše instituce jsou velmi slabé a odsunuté na okraj. Je to způsobeno soustředěním moci v rukou prezidenta, omezenou mocí parlamentu a státem kontrolovanými médii podporujícími atmosféru omezující osobní svobody. Vypracování nové ústavy zajišťující rozdělení moci a liberalizaci je klíčovým krokem k budoucnosti" # todo: NEW TRANSLATION
 ALG_western_supported_economic_relief: "Západní pomoc" # todo: NEW TRANSLATION
 ALG_western_supported_economic_relief_desc: "Naše ideály se shodují s ideály Západu a dokonce nám umožnily založit v jeho zemích naše strany. Navážeme s nimi vztahy a požádáme o pomoc výměnou za hospodářské ústupky" # todo: NEW TRANSLATION
 ALG_liberalize_society: "Liberalizovat společnost" # todo: NEW TRANSLATION
 ALG_liberalize_society_desc: "Lidé nejsou obeznámeni s hodnotami svobody a rovnosti. Měli bychom pracovat na tom, aby si těchto svobod vážili" # todo: NEW TRANSLATION
 ALG_scientific_ventures: "Vědecké projekty" # todo: NEW TRANSLATION
 ALG_scientific_ventures_desc: "Podporou stipendií a aktualizací zastaralých školních osnov budeme schopni rozvíjet vědecký sektor země" # todo: NEW TRANSLATION
 Algeria_student_exchanges: "Výměny studentů" # todo: NEW TRANSLATION
 ALG_banish_authoritarian_influence: "Vyhnat autoritářský vliv" # todo: NEW TRANSLATION
 ALG_banish_authoritarian_influence_desc: "Mnoho autoritářských států, například Írán a Rusko, zde mělo výrazný vliv. Nyní, když jsme svobodným státem, je čas ukončit jejich vliv na naše instituce a hospodářství" # todo: NEW TRANSLATION
 ALG_democratic_socialism: "Demokratický socialismus" # todo: NEW TRANSLATION
 ALG_democratic_socialism_desc: "Zničující hospodářský stav naší země zanechal obyvatelstvo velmi chudé a zaostalé. Omezování podnikání by vedlo k vykořisťování a nespravedlivé konkurenci, protože hospodářská nerovnost je u nás stále rozšířená. Musíme se zaměřit na podporu vzniku nových podniků v zemi a poskytování grantů, které umožní široký hospodářský rozvoj dostupný všem společenským třídám" # todo: NEW TRANSLATION
 ALG_unleash_economic_potential: "Uvolnit hospodářský potenciál" # todo: NEW TRANSLATION
 ALG_unleash_economic_potential_desc: "Máme velký potenciál stát se hospodářskou velmocí. Můžeme povzbudit zahraniční investory a podniky, aby zde zakládali společnosti, a přestože tím naše obyvatelstvo vystavíme roli levné pracovní síly, bude to náš velký skok k hospodářskému rozvoji" # todo: NEW TRANSLATION
 ALG_domestic_investments: "Domácí investice" # todo: NEW TRANSLATION
 ALG_domestic_investments_desc: "Vzniká mnoho mladých domácích podniků. Budeme do nich investovat a podporovat jejich cestu k hospodářské prosperitě" # todo: NEW TRANSLATION
 ALG_subsidize_local_firms: "Místní podniky" # todo: NEW TRANSLATION
 ALG_subsidize_local_firms_desc: "Díky našim politikám získávají místní podniky uznání za své úspěchy. Je čas do nich investovat" # todo: NEW TRANSLATION
 ALG_economic_democracy: "Hospodářská rovnost" # todo: NEW TRANSLATION
 ALG_economic_democracy_desc: "Náš hospodářský rozvoj zasáhl všechny lidi bez ohledu na jejich ekonomické zázemí, protože jsme řešili hospodářskou nerovnost, a dokonce vedl ke vzniku úspěšných domácích společností. Na to bychom měli být hrdí" # todo: NEW TRANSLATION
 ALG_federalisation: "Federalizace" # todo: NEW TRANSLATION
 ALG_federalisation_desc: "Řešením je předat více moci státům. To výrazně podpoří místní zastoupení a inkluzivitu a značně zmírní sektářské obavy a napětí. Tato autonomie však oslabí naši kontrolu nad státy, zejména tam, kde žijí menšiny" # todo: NEW TRANSLATION
 ALG_algerian_investments: "Investice diaspory" # todo: NEW TRANSLATION
 ALG_algerian_investments_desc: "Díky našim hospodářsky přátelským politikám jsme přilákali investice alžírské diaspory žijící v zahraničí" # todo: NEW TRANSLATION
 ALG_invite_US_business_giants: "Pozvat podnikatelské giganty" # todo: NEW TRANSLATION
 ALG_invite_US_business_giants_desc: "Přestože jsme umožnili našemu hospodářství prosperovat, nestačí to. Pozveme obří podniky ze Spojených států, aby v zemi založily franšízy a podpořily konzumerismus" # todo: NEW TRANSLATION
 ALG_republicanism: "Republikánství" # todo: NEW TRANSLATION
 ALG_republicanism_desc: "Alžírsko je nejlépe spravováno jako silný stát s centralizovanou autoritou. To posílí vládu, ale způsobí odcizení a hněv menšin, které se cítí odstrčené" # todo: NEW TRANSLATION
 ALG_address_ethnic_divides: "Vyřešit etnické rozdělení" # todo: NEW TRANSLATION
 ALG_address_ethnic_divides_desc: "Naše země byla vždy rozdělena a sužována sektářstvím. Musíme rozhodnout, jak tyto problémy řešit" # todo: NEW TRANSLATION
 ALG_EU_investments: "Investice EU" # todo: NEW TRANSLATION
 ALG_EU_investments_desc: "Různé evropské země usilují o investice v naší zemi" # todo: NEW TRANSLATION
 ALG_student_exchanges: "Výměny studentů" # todo: NEW TRANSLATION
 ALG_student_exchanges_desc: "Budeme podporovat stipendia v zahraničí, abychom zlepšili naše vzdělávání a udrželi je na úrovni světových standardů" # todo: NEW TRANSLATION
 ALG_democratic_victory: "Demokratické vítězství" # todo: NEW TRANSLATION
 ALG_democratic_victory_desc: "" # todo: NEW TRANSLATION
 ALG_new_era: "Nová éra" # todo: NEW TRANSLATION
 ALG_new_era_desc: "V regionu nastane nová éra. Éra míru a stability, oproštěná od útlaku a nespravedlnosti" # todo: NEW TRANSLATION
 ALG_islamic_nato: "Islámské NATO" # todo: NEW TRANSLATION
 ALG_islamic_nato_desc: "Ačkoli nám NATO poskytuje bezpečnost, jeho členové prokázali naprosté přehlížení Blízkého východu. Pokud nedokážou zajistit stabilitu a prosperitu, musíme převzít iniciativu. Vytvoříme vlastní vojenskou alianci, Středomořskou smluvní organizaci neboli MTO" # todo: NEW TRANSLATION
 ALG_invite_iraq: "Pozvat Irák" # todo: NEW TRANSLATION
 ALG_invite_iraq_desc: "Musíme pozvat Irák do naší aliance, protože se pomalu začíná dávat dohromady a vzájemná spolupráce by nám výrazně prospěla" # todo: NEW TRANSLATION
 ALG_invite_syria: "Pozvat Sýrii" # todo: NEW TRANSLATION
 ALG_invite_syria_desc: "Skutečnost, že Sýrie leží přímo na jih od naší země, znamená, že jsme velmi zranitelní. Pozvání Sýrie do naší frakce by bylo skvělým způsobem, jak zaručit naši bezpečnost" # todo: NEW TRANSLATION
 ALG_invite_algeria: "Pozvat Egypt" # todo: NEW TRANSLATION
 ALG_invite_algeria_desc: "Egypt je nastupující velmocí a s tak početným obyvatelstvem bude naše aliance schopna dosáhnout prakticky čehokoli" # todo: NEW TRANSLATION
 ALG_assistance_to_bulgaria: "Pomoc Bulharsku" # todo: NEW TRANSLATION
 ALG_assistance_to_bulgaria_desc: "Měli bychom Bulharsku pomoci s rozvojem infrastruktury, abychom mohli snadněji provádět další investice za jeho hranicemi" # todo: NEW TRANSLATION
 ALG_islamic_economic_cooperation: "Islámská hospodářská spolupráce" # todo: NEW TRANSLATION
 ALG_islamic_economic_cooperation_desc: "Mnoho muslimských zemí plave v penězích a používá je na nesmyslné věci. Měli bychom vytvořit hospodářskou alianci a spojit naše zdroje do společných hospodářských projektů" # todo: NEW TRANSLATION
 ALG_msp_win: "§RPOZNÁMKA§! : §GTOTO ZAMĚŘENÍ ODEMKNĚ STROM ZAMĚŘENÍ MSP! TENTO STROM BUDE PŘEPSÁN§!" # todo: NEW TRANSLATION
 algeria_news.1.t: "Vojenský převrat v Alžírsku!" # todo: NEW TRANSLATION
 algeria_news.1.d: "V rychlém a nečekaném obratu událostí se Alžírsko ocitá uvrženo do nejistoty, když vojenský převrat svrhává vládu [ALG.GetLeader]. Uprostřed rostoucího napětí mezi vládnoucí stranou a opozičními frakcemi přebírá alžírská armáda pod vedením generála Ahmeda Gaida Salaha kontrolu nad státním aparátem, pozastavuje platnost ústavy a zadržuje klíčové politické představitele. Ulice Káhiry propukají v jásot i obavy, což odráží hluboké rozdělení národa kvůli zásahu armády. Mezinárodní společenství situaci pozorně sleduje, zatímco budoucnost Alžírska visí na vlásku a rostou obavy z dopadů na demokracii a stabilitu v regionu." # todo: NEW TRANSLATION
 algeria_news.1.a: "Zajímavé" # todo: NEW TRANSLATION
 algeria_news.2.t: "Alžírsko na křižovatce" # todo: NEW TRANSLATION
 algeria_news.2.d: "Po téměř desetiletí krveprolití a nestability se Alžírsko ocitá v křehké a nejisté situaci. V mnoha oblastech utichly zbraně, ale mír není zdaleka zaručen. Národ nyní stojí na kritické křižovatce: zvolí usmíření a reformy, bude pokračovat v nouzové vládě armády, nebo se znovu propadne do obnoveného konfliktu? Oči alžírského lidu i celého světa se upírají k tomu, co přijde." # todo: NEW TRANSLATION
 algeria_news.2.a: "Boj o budoucnost Alžírska začíná" # todo: NEW TRANSLATION
 algeria_news.3.t: "Bouteflika se ujímá prezidentského úřadu" # todo: NEW TRANSLATION
 algeria_news.3.d: "V dubnu 1999 byl Abdelaziz Bouteflika zvolen prezidentem Alžírska, čímž se země po letech politické krize vrátila k formálnímu civilnímu vedení. Ačkoli válka ještě zcela neskončila, Bouteflika nastupuje do úřadu odhodlán obnovit stabilitu, znovu vybudovat stát a vést Alžírsko do nového tisíciletí. Jeho program usmíření a dialogu vzbudil naděje mnoha Alžířanů, stále však přetrvávají pochybnosti, zda jeho prezidentství dokáže skutečně zahojit rány černého desetiletí." # todo: NEW TRANSLATION
 algeria_news.3.a: "Pod Bouteflikou začíná nová éra" # todo: NEW TRANSLATION
 algeria_news.4.t: "Lhůta Občanské shody uplynula" # todo: NEW TRANSLATION
 algeria_news.4.d: "Okno amnestie otevřené v rámci Občanské shody prezidenta Boutefliky se uzavřelo. Tisíce povstalců sestoupily z hor a vrátily se k civilnímu životu a Islámská armáda spásy se formálně rozpustila, místo aby pokračovala v boji. Tvrdé jádro Ozbrojené islámské skupiny a nově vytvořená Salafistická skupina pro kázání a boj odmítly všechny nabídky a zůstávají v terénu. Příznivci označují Shodu za nejlepší šanci ukončit krveprolití; kritici namítají, že odpouští pachatelům masakrů, aniž by jejich obětem poskytla byť jen zlomek spravedlnosti." # todo: NEW TRANSLATION
 algeria_news.4.a: "Šance obrátit list černého desetiletí" # todo: NEW TRANSLATION
 algeria_news.5.t: "FLN oživuje svůj revoluční odkaz" # todo: NEW TRANSLATION
 algeria_news.5.d: "Prezident Bouteflika a FLN zahájili celostátní kampaň na posílení své legitimity prostřednictvím připomínání války za nezávislost. Státní média a školy nyní oslavují oběti mučedníků a představují FLN jako věčného strážce alžírské suverenity. Vláda zároveň zajistila spojenectví s dalšími významnými stranami a vytvořila politickou koalici s cílem upevnit autoritu a vystupovat jednotně. Kritici kampaň odsuzují jako oportunistickou propagandu, zatímco příznivci v ní spatřují znovuzrození alžírského revolučního ducha." # todo: NEW TRANSLATION
 algeria_news.5.a: "Revoluce pokračuje prostřednictvím jednoty" # todo: NEW TRANSLATION
 algeria_news.5.b: "Žádná FLN by neměla vládnout sama" # todo: NEW TRANSLATION
 algeria_news.6.t: "Vznik prezidentské aliance" # todo: NEW TRANSLATION
 algeria_news.6.d: "FLN navázala na kampaň svého revolučního odkazu a zajistila si vládní koalici známou jako „Prezidentská aliance“. Fronta národního osvobození (FLN), Národní shromáždění pro demokracii (RND) a Hnutí společnosti za mír (MSP) se dohodly na koordinaci politik na podporu prezidenta Boutefliky. Aliance posiluje kontrolu vládnoucího bloku nad alžírským politickým systémem a představuje veřejnosti jednotnou frontu. Zatímco příznivci tuto koalici vítají jako symbol stability, opoziční hlasy varují, že Alžírsku hrozí další sklouznutí k dominanci jedné strany pod novou zástěrkou." # todo: NEW TRANSLATION
 algeria_news.6.a: "Společně ochráníme budoucnost Alžírska" # todo: NEW TRANSLATION
 ALG_presidential_alliance: "§YFLN, RND a MSP vytvořily prezidentskou alianci.§!\nTato koalice zvyšuje stabilitu vlády, ale upevňuje politickou dominanci vládnoucího bloku." # todo: NEW TRANSLATION
 algeria_news.7.t: "Krize znovu propuká" # todo: NEW TRANSLATION
 algeria_news.7.d: "Sliby usmíření a reforem se rozpadly v lež. FLN a její údajní spojenci v RND a dalších demokratických stranách nedokázali zajistit spravedlnost a práva, která lid požadoval. Mnozí, rozčarovaní prázdnými sliby, se nyní obracejí ke Groupe Salafiste pour la Prédication et le Combat (GSPC) v přesvědčení, že skutečnou spravedlnost může Alžírsku přinést pouze Alláhův zákon. Šaría pro ně představuje vyšší právo, nezkažené chamtivostí politiků, zradou Harkisů ani vlivem cizích mocností. Nejde o válku proti alžírskému lidu, nýbrž proti zkorumpovaným úředníkům a elitám podporovaným ze zahraničí, které ukradly jeho budoucnost. Nad Alžírskem se vznáší nová občanská válka, která jednou provždy rozhodne o jeho osudu." # todo: NEW TRANSLATION
 algeria_news.7.a: "Alláhův zákon povede budoucnost Alžírska" # todo: NEW TRANSLATION
 ALG_army_alliance: "Le Pouvoir sílí" # todo: NEW TRANSLATION
 ALG_strengthen_le_pouvoir: "Posílit Le Pouvoir" # todo: NEW TRANSLATION
 ALG_strengthen_le_pouvoir_desc: "Vládnoucí elita a armáda upevňují moc na úkor politických svobod." # todo: NEW TRANSLATION
 ALG_resistance_challenges_new: "Požadavky lidu" # todo: NEW TRANSLATION
 ALG_resistance_challenges_new_desc: "Lid požaduje reformy ve zdravotnictví, školství a zaměstnanosti. Pokud tyto potřeby nebudou řešeny, posílí se nespokojenost a Alžírsko se přiblíží občanské válce." # todo: NEW TRANSLATION
 ALG_healthcare_reform: "Reformovat zdravotnictví" # todo: NEW TRANSLATION
 ALG_healthcare_reform_desc: "Nemocnice jsou přeplněné, lékaři nedostatečně placení a nedostatek zdravotnických prostředků je všudypřítomný. Musíme jednat rychle." # todo: NEW TRANSLATION
 alg.310.t: "Reforma zdravotnictví uspěla" # todo: NEW TRANSLATION
 alg.310.d: "Investice do nemocnic a lékařů obnovily část důvěry ve vládu." # todo: NEW TRANSLATION
 alg.310.a: "Malé vítězství." # todo: NEW TRANSLATION
 alg.311.t: "Kolaps zdravotnictví" # todo: NEW TRANSLATION
 alg.311.d: "Nemocnice jsou zahlcené, pacienti odmítaní a systém rozežírá korupce. Hněv přetéká." # todo: NEW TRANSLATION
 alg.311.a: "Bude nás to stát draho." # todo: NEW TRANSLATION
 ALG_education_reform: "Reformovat školství" # todo: NEW TRANSLATION
 ALG_education_reform_desc: "Naše školy a univerzity jsou zastaralé a absolventy čeká budoucnost bez pracovních míst." # todo: NEW TRANSLATION
 alg.320.t: "Reforma školství uspěla" # todo: NEW TRANSLATION
 alg.320.d: "Investice do škol a univerzit znovu poskytly studentům naději." # todo: NEW TRANSLATION
 alg.320.a: "Světlejší budoucnost." # todo: NEW TRANSLATION
 alg.321.t: "Kolaps školství" # todo: NEW TRANSLATION
 alg.321.d: "Přeplněné třídy, upadající univerzity a nedostatek příležitostí podněcují nespokojenost." # todo: NEW TRANSLATION
 alg.321.a: "Mládež se obrací proti nám." # todo: NEW TRANSLATION
 ALG_unemployment_reform: "Řešit krizi nezaměstnanosti" # todo: NEW TRANSLATION
 ALG_unemployment_reform_desc: "Alžírská mládež je bez práce a neklidná. Musíme investovat do průmyslu a tvorby pracovních míst, nebo čelit nepokojům." # todo: NEW TRANSLATION
 alg.330.t: "Program pracovních míst uspěl" # todo: NEW TRANSLATION
 alg.330.d: "Nová pracovní místa a malé podniky poskytují naději tisícům mladých Alžířanů." # todo: NEW TRANSLATION
 alg.330.a: "Krok vpřed." # todo: NEW TRANSLATION
 alg.331.t: "Krize nezaměstnanosti se prohlubuje" # todo: NEW TRANSLATION
 alg.331.d: "Továrny zůstávají nečinné, absolventi postávají v ulicích a protesty se mění v násilí." # todo: NEW TRANSLATION
 alg.331.a: "To nemůže trvat." # todo: NEW TRANSLATION
 alg.400.t: "Armáda přijímá porážku" # todo: NEW TRANSLATION
 alg.400.d: "Národní lidová armáda ztratila vliv na politiku. Vzhledem k rostoucímu tlaku veřejnosti a neochotě důstojníků riskovat další krvavou válku generálové přijímají, že ustoupí civilnímu vedení." # todo: NEW TRANSLATION
 alg.400.a: "Konečně civilní vláda!" # todo: NEW TRANSLATION
 alg.401.t: "Armáda vrací úder" # todo: NEW TRANSLATION
 alg.401.d: "Ačkoli reformy začaly, skutečnou moc stále drží armáda. Vyšší generálové zasahují do politiky, přesměrovávají finance a sabotují pokusy o transparentnost. Alžírsko opět upadá do stínové vlády." # todo: NEW TRANSLATION
 alg.401.a: "Zkorumpovaní generálové zůstávají u moci." # todo: NEW TRANSLATION
 alg.402.t: "Lid povstává se zbraní v ruce" # todo: NEW TRANSLATION
 alg.402.d: "Nespokojenost alžírského lidu dosáhla bodu zlomu. Když zmizela stabilita a důvěra v instituce byla zničena, protesty se mění v otevřené povstání. Alžírsko čelí další občanské válce." # todo: NEW TRANSLATION
 alg.402.a: "Národ je rozerván." # todo: NEW TRANSLATION
 ALG_resist_le_pouvoir: "Odpor proti Le Pouvoir" # todo: NEW TRANSLATION
 ALG_resist_le_pouvoir_desc: "Po desetiletí vládne Alžírsku ze stínů zkorumpovaná elita známá jako *Le Pouvoir*, která používá armádu jako železnou pěst. Lid je neklidný a pokud jeho nespokojenost nebude řešena, může Alžírsko čelit další bouři. Volba této cesty otevře prostor reformám, nebo krveprolití." # todo: NEW TRANSLATION
 ALG_popular_salvation: "Hnutí lidové spásy" # todo: NEW TRANSLATION
 ALG_popular_salvation_desc: "Z popela zoufalství povstává nové hnutí. Studenti, dělníci a rozčarovaní vojáci se spojují v požadavku změny. Zda toto hnutí dokáže pokojně svrhnout starý řád, nebo rozpoutá občanskou válku, bude záviset na tom, jak zvládneme požadavky lidu." # todo: NEW TRANSLATION
 ALG_popular_salvation_tt: "§YToto zaměření posílí opoziční hnutí, ale nezaručuje občanskou válku. Výsledek závisí na tom, jak budou řízeny nespokojenost a vliv armády.§!" # todo: NEW TRANSLATION
 ALG_restore_hope: "Obnovit naději" # todo: NEW TRANSLATION
 ALG_restore_hope_desc: "V roce 1999 se Abdelaziz Bouteflika dostal k moci se slibem stability a usmíření po černém desetiletí. Lid v něm spatřuje symbol naděje." # todo: NEW TRANSLATION
 ALG_charter_for_peace: "Občanská shoda" # todo: NEW TRANSLATION
 ALG_charter_for_peace_desc: "Občanská shoda schválená referendem v září 1999 nabízí amnestii každému povstalci, který se vzdá před uzavřením tohoto okna. Islámská armáda spásy již své příměří dodržela; otázkou je, kolik zbývajících bojovníků ji bude následovat z hor." # todo: NEW TRANSLATION
 ALG_balance_islamists_and_secularists: "Vyvažovat islamisty a sekularisty" # todo: NEW TRANSLATION
 ALG_balance_islamists_and_secularists_desc: "Mezi náboženskými hnutími a sekulárními elitami je třeba udržovat křehkou rovnováhu, jejíž selhání hrozí obnovením konfliktu." # todo: NEW TRANSLATION
 ALG_new_constutition_reforms: "Ústavní reformy" # todo: NEW TRANSLATION
 ALG_new_constutition_reforms_desc: "Požadavky na reformy nelze navždy ignorovat. Nová ústava může otevřít cestu k pluralitnější vládě." # todo: NEW TRANSLATION
 ALG_no_pres_alliance: "FLN vládne sama" # todo: NEW TRANSLATION
 ALG_no_pres_alliance_desc: "Bouteflika a FLN odmítají spojenectví s ostatními stranami a prosazují úplnou dominanci nad politickým systémem Alžírska." # todo: NEW TRANSLATION
 ALG_le_pouvoir_in_the_shadows: "Le Pouvoir ve stínech" # todo: NEW TRANSLATION
 ALG_le_pouvoir_in_the_shadows_desc: "Ačkoli se konají volby, skutečnou moc drží zakořeněná elita. Korupce se prohlubuje, zatímco občané jsou stále neklidnější." # todo: NEW TRANSLATION
 ALG_peace_charter: "Občanská shoda" # todo: NEW TRANSLATION
 ALG_peace_charter_desc: "Bouteflikova amnestie pro povstalce, kteří složí zbraně, měla vyprázdnit černé desetiletí od jeho bojovníků, nikoli je porazit v poli." # todo: NEW TRANSLATION
 ALG_fln_dominance: "Dominance FLN" # todo: NEW TRANSLATION
 ALG_fln_dominance_desc: "Fronta národního osvobození (FLN) nadále dominuje alžírskému politickému systému. Její dominance omezuje politický pluralismus a podněcuje odpor opozičních skupin, zároveň však režimu poskytuje kontinuitu a kontrolu." # todo: NEW TRANSLATION
 ALG_only_FLN: "Bez aliance" # todo: NEW TRANSLATION
 ALG_only_FLN_desc: "FLN bude vládnout sama a odmítne aliance či koalice. Tím sice upevní moc, ale dále izoluje opoziční síly a riskuje nárůst veřejné nespokojenosti." # todo: NEW TRANSLATION
 ALG_pres_coa: "Prezidentská aliance" # todo: NEW TRANSLATION
 ALG_pres_coa_desc: "V zájmu zachování stability může FLN vytvořit širší prezidentskou koalici. Začleněním loajálních stran a nezávislých získá vláda legitimitu, aniž by se vzdala své dominance." # todo: NEW TRANSLATION
 ALG_nationalize_privatized_industries: "Znárodnit privatizovaný průmysl" # todo: NEW TRANSLATION
 ALG_nationalize_privatized_industries_desc: "Neoliberální privatizace z 90. let oslabily suverenitu Alžírska. Opětovným znárodněním klíčových průmyslových odvětví může stát znovu získat kontrolu nad strategickými sektory." # todo: NEW TRANSLATION
 ALG_sonatrach_expansion: "Rozšíření Sonatrachu" # todo: NEW TRANSLATION
 ALG_sonatrach_expansion_desc: "Sonatrach, státní energetická společnost Alžírska, je páteří našeho hospodářství. Rozšíření její kapacity a dosahu posílí státní příjmy i vliv Alžírska na světových energetických trzích." # todo: NEW TRANSLATION
 ALG_the_cult_of_bouteflika: "Bouteflikův kult" # todo: NEW TRANSLATION
 ALG_the_cult_of_bouteflika_desc: "Bouteflikovi příznivci kolem jeho vedení budují kult osobnosti. Prostřednictvím loajálních sítí a propagandy jeho okolí upevňuje jeho dominanci nad alžírskou politikou, zatímco korupce a klientelismus se prohlubují." # todo: NEW TRANSLATION
 ALG_cult_of_bouteflika: "Bouteflikovo okolí" # todo: NEW TRANSLATION
 ALG_cult_of_bouteflika_desc: "Bouteflikův vnitřní kruh, obklopený loajálním, ale hluboce zkorumpovaným okolím, ovládá páky moci. Jejich vliv zajišťuje stabilitu režimu, ale upevňuje nepotismus a snižuje transparentnost vlády." # todo: NEW TRANSLATION
 ALG_oppose_ffs_and_rcd: "Zakázat FFS a RCD" # todo: NEW TRANSLATION
 ALG_oppose_ffs_and_rcd_desc: "Socialistická fronta sil (FFS) a Shromáždění pro kulturu a demokracii (RCD) zpochybňují hegemonii FLN. Jejich zákazem režim odstraní opoziční hlasy, ale riskuje rozdmýchání nesouhlasu, zejména v Kabýlii." # todo: NEW TRANSLATION
 ALG_smaller_state: "Menší stát" # todo: NEW TRANSLATION
 ALG_smaller_state_desc: "Přerostlý alžírský stát je neefektivní a nákladný. Zmenšení jeho velikosti a decentralizace autority by mohly zlepšit efektivitu, zakořeněné elity však budou těmto reformám odporovat." # todo: NEW TRANSLATION
 ALG_fight_bloated_bureaucracy: "Boj proti přebujelé byrokracii" # todo: NEW TRANSLATION
 ALG_fight_bloated_bureaucracy_desc: "Vrstvy byrokracie dusí alžírskou správu. Kampaň za zjednodušení veřejné správy sníží korupci a přiblíží služby lidem." # todo: NEW TRANSLATION
 FLN_parties_corruptions: "Korupce v našich stranách" # todo: NEW TRANSLATION
 FLN_parties_corruptions_desc: "Korupce pronikla do FLN a jejích spojeneckých stran. Odsouzení a řešení této korupce je zásadní, pokud chce režim obnovit svou důvěryhodnost." # todo: NEW TRANSLATION
 ALG_denounce_previous_colonialist_regimes: "Odsoudit francouzský zákon o kolonialismu" # todo: NEW TRANSLATION
 ALG_denounce_previous_colonialist_regimes_desc: "Kontroverzní francouzský zákon oslavující koloniální minulost vyvolal pobouření. FLN musí vést tažení proti odsuzování koloniálních zločinů a znovu potvrdit alžírský antikoloniální boj." # todo: NEW TRANSLATION
 ALG_share_power: "Sdílet moc" # todo: NEW TRANSLATION
 ALG_share_power_desc: "Místo samostatného vládnutí může FLN opatrně sdílet moc s vybranými opozičními a technokratickými silami. To může zachovat stabilitu a zároveň zmírnit lidový hněv vůči režimu." # todo: NEW TRANSLATION
 ALG_elite_control: "Kontrola elity" # todo: NEW TRANSLATION
 ALG_elite_control_desc: "Síť podnikatelských magnátů, stranických vůdců a vojenských důstojníků známá jako „Le Pouvoir“ vládne Alžírsku ze stínů." # todo: NEW TRANSLATION
 ALG_military_coup: "Vojenský převrat" # todo: NEW TRANSLATION
 ALG_military_coup_desc: "Armáda se rozhodla ukončit civilní vedení a přímo převzít moc, slibuje pořádek, ale přináší strach." # todo: NEW TRANSLATION
 ALG_suspend_democracy: "Pozastavit demokracii" # todo: NEW TRANSLATION
 ALG_suspend_democracy_desc: "Parlament je rozpuštěn, volby zrušeny a generálové vládnou Alžírsku." # todo: NEW TRANSLATION
 ALG_repression_campaign: "Kampaň represí" # todo: NEW TRANSLATION
 ALG_repression_campaign_desc: "Národní lidová armáda používá brutální metody z černého desetiletí k potlačení nesouhlasu, za cenu mezinárodního pobouření." # todo: NEW TRANSLATION
 ALG_black_market_rises: "Černý trh povstává" # todo: NEW TRANSLATION
 ALG_black_market_rises_desc: "Korupce a nedostatky vytvářejí prosperující černý trh, který podkopává oficiální hospodářství." # todo: NEW TRANSLATION
 ALG_expand_the_pna: "Rozšířit Národní lidovou armádu" # todo: NEW TRANSLATION
 ALG_expand_the_pna_desc: "Armáda je rozšířena, modernizována a posílena, aby zajistila přežití režimu." # todo: NEW TRANSLATION
 ALG_africas_strongest_army: "Nejsilnější armáda Afriky" # todo: NEW TRANSLATION
 ALG_africas_strongest_army_desc: "Alžírsko nyní disponuje nejsilnějšími ozbrojenými silami na kontinentu, s nimiž je třeba počítat." # todo: NEW TRANSLATION
 ALG_global_power_projection: "HCS znovu povstává" # todo: NEW TRANSLATION
 ALG_global_power_projection_desc: "Nyní, když armáda opět drží nespornou moc, prosazuje Alžírsko svou sílu doma i v zahraničí. Naše země, odkazující na dominanci éry HCS v 90. letech, stojí vzpřímeně, neústupně a připravena promítat svůj vliv daleko za hranice. Svět si sílu alžírského odhodlání zapamatuje." # todo: NEW TRANSLATION
