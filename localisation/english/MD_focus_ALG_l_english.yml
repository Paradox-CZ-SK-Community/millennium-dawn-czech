l_english:
 algeria_focus: "Alžírský strom zaměření" # todo: NEW TRANSLATION
 ALG_political_tree_shortcut: "Politický strom" # todo: NEW TRANSLATION
 ALG_foreign_policy_shortcut: "Zahraniční politika" # todo: NEW TRANSLATION
 ALG_industry_shortcut: "Hospodářská obnova" # todo: NEW TRANSLATION
 ALG_military_shortcut: "Alžírské ozbrojené síly" # todo: NEW TRANSLATION
 ALG_the_nation_stands_at_a_crossroads: "Národ stojí na rozcestí" # todo: NEW TRANSLATION
 ALG_the_nation_stands_at_a_crossroads_desc: "Alžírsko vychází z Černé dekády zjizvené. Více než 200 000 mrtvých, celé vesnice srovnané se zemí a ekonomika zničená občanskou válkou. Prezident Bouteflika vsadil svůj mandát na Občanskou shodu, nabízí ozbrojencům amnestii a slibuje reformy. Za ním však stojí le Pouvoir, tajemná síť generálů a zpravodajských důstojníků, kteří vládnou Alžírsku od získání nezávislosti. Budoucnost patří tomu, kdo ovládne to, co přijde." # todo: NEW TRANSLATION
 ALG_restore_the_presidency_desc: "Po politických otřesech bylo prezidentské úřadování oslabeno. Je čas obnovit autoritu našeho zvoleného vůdce a znovu zavést demokratické normy, které byly narušeny. Obnovením prezidentského úřadu můžeme naší vládě vrátit stabilitu a důvěru." # todo: NEW TRANSLATION
 ALG_emergency_rule_continues: "§RVýjimečný stav pokračuje§!" # todo: NEW TRANSLATION
 ALG_emergency_rule_continues_desc: "Protože národ stále prochází nepokoji, vláda se rozhodla prodloužit výjimečný stav. Ačkoli je toto opatření nezbytné pro udržení pořádku, přichází za cenu občanských svobod a demokratických procesů. Při plavbě těmito rozbouřenými vodami musíme postupovat obezřetně." # todo: NEW TRANSLATION
 ALG_national_reconciliation: "Národní usmíření" # todo: NEW TRANSLATION
 ALG_national_reconciliation_desc: "Abychom zacelili rány rozdělení a konfliktu, musíme se vydat cestou národního usmíření. Podporou dialogu mezi všemi frakcemi a řešením jejich křivd můžeme vybudovat jednotnější společnost a položit základy trvalého míru." # todo: NEW TRANSLATION
 ALG_moderate_islamist_talks: "Jednání s umírněnými islamisty" # todo: NEW TRANSLATION
 ALG_moderate_islamist_talks_desc: "Ve snaze překlenout rozdělení a podpořit stabilitu zahajujeme jednání s umírněnými islamistickými frakcemi. Konstruktivním dialogem chceme najít společnou půdu a vytvořit politické prostředí, v němž mohou rozmanité hlasy pokojně soužít." # todo: NEW TRANSLATION
 ALG_charter_for_civil_peace: "Charta občanského míru" # todo: NEW TRANSLATION
 ALG_charter_for_civil_peace_desc: "Pro zajištění trvalé stability a společenské harmonie navrhujeme Chartu občanského míru. Tento dokument vymezí práva a povinnosti všech občanů a podpoří toleranci, porozumění a spolupráci mezi různými skupinami v naší společnosti." # todo: NEW TRANSLATION
 ALG_open_democratic_path: "Otevřít demokratickou cestu" # todo: NEW TRANSLATION
 ALG_open_democratic_path_desc: "Je čas plně přijmout demokracii a otevřít cestu ke světlejší budoucnosti. Zavedením reforem, které posílí naše občany a podpoří politickou účast, můžeme vytvořit živou demokratickou společnost odrážející vůli lidu." # todo: NEW TRANSLATION
 ALG_clamp_down_on_extremism: "Tvrdě zakročit proti extremismu" # todo: NEW TRANSLATION
 ALG_clamp_down_on_extremism_desc: "Pomocí vojenských tribunálů a zpravodajských sil vláda odstraní všechny zbývající radikální islamistické a politické hrozby." # todo: NEW TRANSLATION
 ALG_counterterrorism_program: "Protiteroristický program" # todo: NEW TRANSLATION
 ALG_counterterrorism_program_desc: "Musíme vytvořit moderní bezpečnostní aparát, který bude sledovat, infiltrovat a likvidovat hrozby dříve, než destabilizují Alžírsko." # todo: NEW TRANSLATION
 ALG_authoritarian_restoration: "Obnova autoritářství" # todo: NEW TRANSLATION
 ALG_authoritarian_restoration_desc: "Stabilitu lze zaručit pouze pevnou, centralizovanou vládou. Armáda převezme plnou odpovědnost za budoucnost národa." # todo: NEW TRANSLATION
 ALG_counterterrorism_agency: "Protiteroristická agentura" # todo: NEW TRANSLATION
 ALG_counterterrorism_agency_desc: "Département du Renseignement et de la Sécurité (DRS) byl po občanské válce znovu vybudován z pozůstatků staré vojenské zpravodajské služby Sécurité Militaire (SM). DRS, který fungoval téměř zcela nezávisle na civilním dohledu, se stal nejmocnější institucí v Alžírsku, obávanější než samotné předsednictví." # todo: NEW TRANSLATION
 ALG_extremism_crackdown_modifier: "Tvrdý zásah proti extremismu" # todo: NEW TRANSLATION
 ALG_extremism_crackdown_modifier_desc: "V reakci na rostoucí hrozby extremistických skupin, které se snaží destabilizovat náš národ, zavádíme rozsáhlý zásah proti radikalismu. Tato iniciativa má za cíl rozložit extremistické sítě, posílit dohled a zlepšit schopnosti donucovacích orgánů. Podporou kultury tolerance a porozumění chceme řešit kořeny extremismu a zároveň zajistit bezpečnost našich občanů. Těmito opatřeními vytvoříme soudržnější společnost a ochráníme naše demokratické hodnoty." # todo: NEW TRANSLATION
 ALG_military_regime_restored: "Obnovena vojenská vláda" # todo: NEW TRANSLATION
 ALG_military_regime_restored_desc: "Po letech politické nestability armáda znovu získala kontrolu a obnovila pořádek. Režim se zaměřuje na disciplínu, národní bezpečnost a přísnou správu, aby obnovil sílu a jednotu národa." # todo: NEW TRANSLATION
 ALG_reconciliation_path_category: "Národní usmíření" # todo: NEW TRANSLATION
 ALG_reconciliation_path_category_desc: "\n£AFG_menu1\n\n\n\nAbychom zacelili rány rozdělení a konfliktu, musíme se vydat cestou národního usmíření. Podporou dialogu mezi všemi frakcemi a řešením jejich křivd můžeme vybudovat jednotnější společnost a položit základy trvalého míru." # todo: NEW TRANSLATION
 ALG_pardon_moderate_islamist: "Pardonovat umírněné islamisty" # todo: NEW TRANSLATION
 ALG_pardon_moderate_islamist_desc: "Bývalým nenásilným islamistům může být nabídnuta podmíněná amnestie výměnou za odzbrojení a zřeknutí se politického násilí." # todo: NEW TRANSLATION
 ALG_initiate_national_dialogues: "Zahájit národní dialog" # todo: NEW TRANSLATION
 ALG_initiate_national_dialogues_desc: "Bude zahájeno národní fórum, které zapojí bývalé povstalce, politické strany a občanskou společnost do budování nového Alžírska." # todo: NEW TRANSLATION
 ALG_reintegrate_former_fighter: "Reintegrovat bývalé bojovníky" # todo: NEW TRANSLATION
 ALG_reintegrate_former_fighter_desc: "Program reintegrace odevzdaných povstalců do civilního života prostřednictvím práce, bydlení nebo národní služby." # todo: NEW TRANSLATION
 ALG_crackdown_category: "Autoritářské represe" # todo: NEW TRANSLATION
 ALG_crackdown_category_desc: "\n£TAJ_desctext_pamir\n\n\n\nAbychom zajistili stabilitu státu, musíme potlačit podvratné živly a posílit naše vnitřní bezpečnostní síly." # todo: NEW TRANSLATION
 ALG_arrest_political_opponents: "Zatknout politické odpůrce" # todo: NEW TRANSLATION
 ALG_arrest_political_opponents_desc: "Vnitřní hrozby neutralizujeme odstraněním radikálních politických aktérů z veřejného prostoru." # todo: NEW TRANSLATION
 ALG_expand_surveillance_services: "Rozšířit sledovací služby" # todo: NEW TRANSLATION
 ALG_expand_surveillance_services_desc: "Rozsáhlá zpravodajská síť bude sledovat obyvatelstvo a zabrání šíření nepokojů dříve, než se rozšíří." # todo: NEW TRANSLATION
 ALG_ban_opposition_parties: "Zakázat opoziční strany" # todo: NEW TRANSLATION
 ALG_ban_opposition_parties_desc: "Všechny politické strany, které nejsou v souladu s národní jednotou, budou vyloučeny z politické účasti." # todo: NEW TRANSLATION
 ALG_economic_recovery_category: "Program hospodářské obnovy" # todo: NEW TRANSLATION
 ALG_economic_recovery_category_desc: "\n£MAIN_desctext_dept\n\n\n\nMMF nabízí podmíněnou podporu a Alžírsko nyní může zahájit rozsáhlejší reformy, čerpat půjčky a provádět privatizaci." # todo: NEW TRANSLATION
 ALG_accept_imf_loan: "Přijmout půjčku od MMF" # todo: NEW TRANSLATION
 ALG_accept_imf_loan_desc: "Můžeme přijmout finanční pomoc od MMF, stabilizovat měnu a zahájit reformy. Cena za to bude dlouhodobý dluh a přísné podmínky." # todo: NEW TRANSLATION
 ALG_start_oil_licensing: "Otevřít těžbu ropy zahraničním společnostem" # todo: NEW TRANSLATION
 ALG_start_oil_licensing_desc: "Umožnění nadnárodním společnostem přístup k ropným zásobám by mohlo urychlit růst, ale také zvýšit zahraniční vliv." # todo: NEW TRANSLATION
 ALG_repay_imf_loan: "Splatit půjčku od MMF" # todo: NEW TRANSLATION
 ALG_repay_imf_loan_desc: "Jakmile se naše finance stabilizují, můžeme splatit půjčku a snížit mezinárodní závislost." # todo: NEW TRANSLATION
 ALG_improve_public_services: "Zlepšit veřejné služby" # todo: NEW TRANSLATION
 ALG_improve_public_services_desc: "Rozšíříme zdravotnictví, školství a podporu obětí války." # todo: NEW TRANSLATION
 ALG_international_aid_effort: "Mezinárodní pomoc" # todo: NEW TRANSLATION
 ALG_international_aid_effort_desc: "Spolupráce s OSN a dárci může nastartovat základní služby a obnovu." # todo: NEW TRANSLATION
 ALG_building_civil_society: "Budování občanské společnosti" # todo: NEW TRANSLATION
 ALG_building_civil_society_desc: "Posílení komunit a sociálních programů může pomoci zabránit obnovení konfliktu." # todo: NEW TRANSLATION
 ALG_economic_recovery_program: "Program hospodářské obnovy" # todo: NEW TRANSLATION
 ALG_economic_recovery_program_desc: "Spouštíme národní plán růstu podporovaný zahraniční pomocí a reformou státu." # todo: NEW TRANSLATION
 ALG_remove_international_monitors: "Odstranit mezinárodní pozorovatele" # todo: NEW TRANSLATION
 ALG_remove_international_monitors_desc: "Alžírsko se dostatečně zotavilo, aby znovu získalo plnou suverenitu nad svou hospodářskou cestou." # todo: NEW TRANSLATION
 ALG_postwar_recovery_program: "Poválečný program obnovy" # todo: NEW TRANSLATION
 ALG_postwar_recovery_program_desc: "Válka skončila. Nyní začneme obnovovat stát, ekonomiku a společnost." # todo: NEW TRANSLATION
 ALG_un_aid_mission: "Mise OSN pro pomoc" # todo: NEW TRANSLATION
 ALG_un_aid_mission_desc: "Pomoc OSN a nevládní organizace podpoří naše základní veřejné služby." # todo: NEW TRANSLATION
 ALG_social_healing_programs: "Programy společenského uzdravení" # todo: NEW TRANSLATION
 ALG_social_healing_programs_desc: "S poválečnými traumaty a nedůvěrou je třeba se vypořádat prostřednictvím sociálních programů a usmíření." # todo: NEW TRANSLATION
 ALG_public_services_funding: "Financování veřejných služeb" # todo: NEW TRANSLATION
 ALG_public_services_funding_desc: "Obnovíme přístup ke zdravotní péči, bydlení a programům zaměstnanosti." # todo: NEW TRANSLATION
 ALG_finalize_recovery_phase: "Dokončit fázi obnovy" # todo: NEW TRANSLATION
 ALG_finalize_recovery_phase_desc: "Po obnovení stability můžeme omezit zahraniční dohled a získat zpět hospodářskou autonomii." # todo: NEW TRANSLATION
 ALG_change_the_economy: "Změnit hospodářský model" # todo: NEW TRANSLATION
 ALG_change_the_economy_desc: "Je čas si vybrat: zachováme státní kontrolu, nebo liberalizujeme?" # todo: NEW TRANSLATION
 ALG_preserve_state_controlled_oil: "Zachovat státní kontrolu nad ropou" # todo: NEW TRANSLATION
 ALG_preserve_state_controlled_oil_desc: "Sonatrach musí zůstat páteří naší suverenity a ekonomiky." # todo: NEW TRANSLATION
 ALG_industrial_expansion_plan: "Plán průmyslové expanze" # todo: NEW TRANSLATION
 ALG_industrial_expansion_plan_desc: "Zvýšíme domácí výrobu prostřednictvím infrastruktury a továren." # todo: NEW TRANSLATION
 ALG_open_market_reforms: "Reformy otevřeného trhu" # todo: NEW TRANSLATION
 ALG_open_market_reforms_desc: "Alžírsko může přilákat investice a podpořit růst deregulací klíčových sektorů." # todo: NEW TRANSLATION
 ALG_oil_licensing_program: "Spustit program těžebních licencí" # todo: NEW TRANSLATION
 ALG_oil_licensing_program_desc: "Zahraniční společnosti mohou žádat o těžbu ropných polí na základě licenčních smluv." # todo: NEW TRANSLATION
 ALG_urban_or_rural_development: "Kmeny, nebo města?" # todo: NEW TRANSLATION
 ALG_urban_or_rural_development_desc: "Má se naše poválečné úsilí zaměřit na kmenové oblasti, nebo na velká města?" # todo: NEW TRANSLATION
 ALG_empower_rural_provinces: "Posílit venkovské provincie" # todo: NEW TRANSLATION
 ALG_empower_rural_provinces_desc: "Náš venkovský jih a kabylská srdce země obdrží přímé investice." # todo: NEW TRANSLATION
