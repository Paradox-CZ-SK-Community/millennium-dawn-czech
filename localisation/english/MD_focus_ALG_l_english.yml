 ALG_urbanization_initiative: "Spustit urbanizační iniciativu" # todo: NEW TRANSLATION
 ALG_urbanization_initiative_desc: "Městská centra jako Alžír a Oran jsou klíčem k naší modernizaci." # todo: NEW TRANSLATION
 ALG_expand_the_capital: "Rozšířit hlavní město" # todo: NEW TRANSLATION
 ALG_expand_the_capital_desc: "Rozšíříme infrastrukturu a úřady v Alžíru, aby se stal skutečným moderním centrem." # todo: NEW TRANSLATION
 ALG_foreign_policy_review: "Přezkoumat doktrínu zahraniční politiky" # todo: NEW TRANSLATION
 ALG_foreign_policy_review_desc: "S návratem vnitřní stability musí Alžírsko znovu definovat svou úlohu na světové scéně." # todo: NEW TRANSLATION
