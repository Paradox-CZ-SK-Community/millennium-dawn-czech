 ALG_islamist_opposition_victory: "Vláda islamistické opozice" # todo: NEW TRANSLATION
 ALG_islamist_opposition_victory_desc: "Koalice islamistické opozice vyhrála volby a jejím úkolem bude vést Alžírsko k vytvoření konzervativní islámské republiky" # todo: NEW TRANSLATION
 ALG_islamist_renaissance: "Islámská renesance" # todo: NEW TRANSLATION
 ALG_islamist_renaissance_desc: "Naše vítězství posílilo naši podporu mezi širokými masami. Vyvinula se nová kultura a my ji plně podporujeme" # todo: NEW TRANSLATION
 ALG_empower_sharia_courts: "Posílit soudy šaría" # todo: NEW TRANSLATION
 ALG_empower_sharia_courts_desc: "Je čas posílit islámské soudnictví a rozšířit jeho vliv" # todo: NEW TRANSLATION
 ALG_turkish_inspired_islamism: "Islamismus inspirovaný Tureckem" # todo: NEW TRANSLATION
 ALG_turkish_inspired_islamism_desc: "Inspiraci budeme čerpat z islamistických hnutí, která vznikla v Turecku po založení republiky. To naše hnutí prozatím vykreslí v příznivějším světle a může přilákat turecké konzervativní podnikatele k investicím v naší zemi." # todo: NEW TRANSLATION
 ALG_deregulate_economy: "Deregulované hospodářství" # todo: NEW TRANSLATION
 ALG_deregulate_economy_desc: "Abychom posílili střední třídu a obchodníky, od nichž získáváme velkou část podpory, omezíme jejich regulaci a poskytneme jim prostor potřebný k růstu" # todo: NEW TRANSLATION
 ALG_moderate_conservatism: "Umírněný konzervatismus" # todo: NEW TRANSLATION
 ALG_moderate_conservatism_desc: "Vymýtíme extremistické prvky z našich řad a přetvoříme svůj obraz v sílu konzervatismu, která nemá nic společného s náboženským fanatismem" # todo: NEW TRANSLATION
 ALG_religious_values: "Naše hodnoty jsou neochvějné" # todo: NEW TRANSLATION
 ALG_religious_values_desc: "Je možné, že nám naše předchozí politiky, jejichž cílem bylo usmířit obyvatelstvo a zmírnit náš obraz, umožnily odchýlit se od skutečných hodnot, na nichž jsou naše ideály založeny. Méně nám záleží na tom, jak nás vnímají ostatní, a naším jediným cílem je zavést v naší zemi šaríu, bez ohledu na to, jak nepopulární to může být" # todo: NEW TRANSLATION
 ALG_religious_economic_charity: "Náboženské dary" # todo: NEW TRANSLATION
 ALG_religious_economic_charity_desc: "Naše hnutí byla vždy spojována s charitami a nadacemi, které byly prospěšné našim komunitám. Nyní, když máme významnější postavení, je dále institucionalizujeme, abychom zmírnili naše hospodářské břemeno" # todo: NEW TRANSLATION
 ALG_qatari_support: "Katarská podpora" # todo: NEW TRANSLATION
 ALG_qatari_support_desc: "Vzbudili jsme zájem různých katarských investorů" # todo: NEW TRANSLATION
 ALG_flourishment_of_central_economy: "Rozvoj městských center" # todo: NEW TRANSLATION
 ALG_flourishment_of_central_economy_desc: "Naše základna podpory pochází především z různých městských oblastí a měli bychom je začít rozvíjet, abychom posílili podporu jejich obyvatel" # todo: NEW TRANSLATION
 ALG_turkish_investments: "Turecké investice" # todo: NEW TRANSLATION
 ALG_turkish_investments_desc: "Díky naší deregulaci a ideologické podobnosti s Tureckem jsme přilákali mnoho tureckých investorů" # todo: NEW TRANSLATION
 ALG_reverse_secularization: "Zvrátit sekularizaci" # todo: NEW TRANSLATION
 ALG_arm_palestinians_to_fight: "Vyzbrojit Palestince" # todo: NEW TRANSLATION
 ALG_arm_palestinians_to_fight_desc: "V Jordánsku žije početná populace palestinských uprchlíků. Můžeme z těchto uprchlíků vytvořit bojovníky a podněcovat je k působení chaosu v Palestině a Izraeli. Jelikož jde o zástupné bojovníky, můžeme je využít k vyprovokování odvetné reakce Izraele, díky čemuž bude v konfliktu vypadat jako viník" # todo: NEW TRANSLATION
 ALG_zionist_threat: "Sionistická hrozba" # todo: NEW TRANSLATION
 ALG_zionist_threat_desc: "Izrael je největší urážkou všech muslimů a ohavný falešný stát v srdci islámu. Musí být vymazán z povrchu země." # todo: NEW TRANSLATION
 ALG_help_sahara: "Naši saharští přátelé" # todo: NEW TRANSLATION
 ALG_help_sahara_desc: "Jsme v kontaktu s mnoha hnutími podporujícími naši panarabskou věc. Jedním z nich je Polisario, které usiluje o osvobození obyvatel Severní Sahary. Polisario již celé století bojuje proti koloniálnímu a následně marockému útlaku a nyní Fronta ovládá pouze malou část Západní Sahary. Konflikt je v současnosti zmrazený, ale můžeme to změnit zasláním vojenské pomoci našim přátelům a vybavením Sahrawců vším, co potřebují k pokračování svého boje." # todo: NEW TRANSLATION
 algeria.42.t: "Podpora zbraněmi od [FROM.GetName]!" # todo: NEW TRANSLATION
