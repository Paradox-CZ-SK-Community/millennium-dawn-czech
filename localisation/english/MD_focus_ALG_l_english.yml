 KBY_no_corrupt_military_desc: "Naše armáda je stále mladá, a proto je mnohem snazší v ní korupci odstranit." # todo: NEW TRANSLATION
 KBY_nation_quest: "Národní otázka" # todo: NEW TRANSLATION
 KBY_nation_quest_desc: "Kabylie byla a bude součástí Alžírska. To je naše odpověď na národní otázku." # todo: NEW TRANSLATION
 KBY_referendum: "Referendum o osudu Kabylie" # todo: NEW TRANSLATION
 KBY_referendum_desc: "Nastal osudový okamžik, kdy musíme rozhodnout, jakou cestou se naše země vydá. Stane se plnohodnotnou součástí Ruska v podobě republiky, nebo zvolíme cestu svazového státu?" # todo: NEW TRANSLATION
 KBY_dinar: "Dinar jako státní měna" # todo: NEW TRANSLATION
 KBY_dinar_desc: "Dinar se stane naší státní měnou, o tom nikdo ani nepochyboval." # todo: NEW TRANSLATION
 KBY_corruption: "Boj proti korupci" # todo: NEW TRANSLATION
 KBY_corruption_desc: "Přestože je náš stát stále mladý, již se v něm objevili zkorumpovaní úředníci. Musíme se s tím vypořádat." # todo: NEW TRANSLATION
 KBY_isr_invest: "Izraelské investice" # todo: NEW TRANSLATION
 KBY_isr_invest_desc: "Izrael nás podporuje svými investicemi." # todo: NEW TRANSLATION
 KBY_build_factories: "Výstavba továren" # todo: NEW TRANSLATION
 KBY_build_factories_desc: "Země potřebuje továrny a další továrny. Zajistíme našemu lidu vše, co potřebuje." # todo: NEW TRANSLATION
 KBY_social_invest: "Investice do sociální oblasti" # todo: NEW TRANSLATION
 KBY_social_invest_desc: "Naši občané by měli mít přístup k nejkvalitnějším zdravotnickým zařízením a také všechny sociální záruky." # todo: NEW TRANSLATION
 KBY_infrastructure: "Investice do infrastruktury" # todo: NEW TRANSLATION
 KBY_infrastructure_desc: "Silnice jsou žilami našeho státu." # todo: NEW TRANSLATION
 KBY_fight_oligarch: "Boj proti oligarchům" # todo: NEW TRANSLATION
 KBY_fight_oligarch_desc: "I v našem mladém státě se již začali objevovat zkorumpovaní oligarchové, kteří během války vydělali mnoho peněz. Vypořádejme se s nimi." # todo: NEW TRANSLATION
 KBY_it_invest: "Investice do IT" # todo: NEW TRANSLATION
 KBY_it_invest_desc: "Budeme investovat do informačních technologií pro úspěšný rozvoj naší země." # todo: NEW TRANSLATION
 KBY_maloross_economy: "Ekonomika Kabylie" # todo: NEW TRANSLATION
 KBY_maloross_economy_desc: "Naše hospodářská opatření vedla k růstu ekonomiky." # todo: NEW TRANSLATION
 KBY_union_state: "Svazový stát" # todo: NEW TRANSLATION
 KBY_union_state_desc: "Zvolili jsme cestu svazového státu." # todo: NEW TRANSLATION
 KBY_union_group_army: "Společné uskupení vojsk" # todo: NEW TRANSLATION
 KBY_union_group_army_desc: "Naši vojáci se stanou členy společného uskupení vojsk svazového státu." # todo: NEW TRANSLATION
 KBY_union_group_economic: "Investice svazového státu" # todo: NEW TRANSLATION
 KBY_union_group_economic_desc: "Členství ve svazovém státě mělo pozitivní dopad na naši ekonomiku." # todo: NEW TRANSLATION
 KBY_union_health_social: "Spolupráce v sociální a zdravotní oblasti" # todo: NEW TRANSLATION
 KBY_union_health_social_desc: "Členové svazového státu aktivně spolupracují v sociální a zdravotní oblasti." # todo: NEW TRANSLATION
 KBY_republic_rf: "Jsme součástí Alžírska" # todo: NEW TRANSLATION
 KBY_republic_rf_desc: "Stali jsme se republikou Alžírska, nyní je náš osud s ním spojen." # todo: NEW TRANSLATION
 KBY_alg_regions: "Spolupráce s alžírskými regiony" # todo: NEW TRANSLATION
 KBY_alg_regions_desc: "Budeme aktivně spolupracovat s ostatními regiony Alžírska." # todo: NEW TRANSLATION
 KBY_fra_companies: "Spolupráce s francouzskými společnostmi" # todo: NEW TRANSLATION
 KBY_fra_companies_desc: "Francouzské společnosti budou našimi hlavními partnery." # todo: NEW TRANSLATION
 KBY_integrate_army: "Integrace do alžírské armády" # todo: NEW TRANSLATION
 KBY_integrate_army_desc: "Přizpůsobíme naši armádu standardům alžírské armády." # todo: NEW TRANSLATION
 ALG_legacy_of_independence_war: "Odkaz alžírské války za nezávislost" # todo: NEW TRANSLATION
 ALG_legacy_of_independence_war_desc: "Boj proti francouzské koloniální nadvládě vytvořil silný pocit národní identity a jednoty. Tento trvalý odkaz posiluje naši politickou moc, urychluje výzkum a modernizaci a zvyšuje vliv Alžírska v zahraničí. Ideologické rozdíly a historické vzpomínky však nadále utvářejí domácí názory i zahraniční vztahy." # todo: NEW TRANSLATION
 ALG_new_nobility_idea: "Obnovená šlechta" # todo: NEW TRANSLATION
 ALG_new_nobility_idea_desc: "Obnovením šlechtických privilegií a vytvořením loajální aristokracie monarchie posiluje svou vládu a odměňuje loajalitu vlivem a prestiží." # todo: NEW TRANSLATION
 ALG_state_islam_idea: "Islám jako stát" # todo: NEW TRANSLATION
 ALG_state_islam_idea_desc: "Monarchie formalizuje islám jako vůdčí princip státu, posiluje ulema a začleňuje šaríu do správy země za cenu vědeckého pokroku." # todo: NEW TRANSLATION
 ALG_andalus_crusade_idea: "Odkaz al-Andalusu" # todo: NEW TRANSLATION
 ALG_andalus_crusade_idea_desc: "Sen o znovudobytí al-Andalusu pohání věc chalífátu, inspiruje bojovníky a ospravedlňuje expanzi na Pyrenejský poloostrov." # todo: NEW TRANSLATION
 ALG_maghribi_identity_idea: "Maghrebská identita" # todo: NEW TRANSLATION
 ALG_maghribi_identity_idea_desc: "Monarchie podporuje osobitou maghrebskou identitu založenou na sdílené kultuře a jednotě, čímž posiluje stabilitu a omezuje zahraniční vliv." # todo: NEW TRANSLATION
 ALG_maghribi_identity_idea_two: "Pravý maghrebismus" # todo: NEW TRANSLATION
 ALG_maghribi_identity_idea_two_desc: "Od Maroka po Libyi se Maghreb sjednocuje pod jediným osudem. Monarchie ztělesňuje tuto vizi, omezuje zahraniční vměšování a spojuje celý region." # todo: NEW TRANSLATION
 ALG_renewed_nobility_idea: "Obnovené rytířstvo" # todo: NEW TRANSLATION
 ALG_renewed_nobility_idea_desc: "Rytíři říše se vracejí, ctěni jako loajální vojenská a politická elita. Jejich obnovená role posiluje sevření monarchie a snižuje náklady na vedení." # todo: NEW TRANSLATION
 ALG_going_to_roots: "Návrat ke kořenům" # todo: NEW TRANSLATION
 ALG_going_to_roots_desc: "Maghrebské i andaluské dynastie položily základy alžírské identity. Přijetím těchto tradic sjednotíme minulost a přítomnost do jediné vůdčí vize národa." # todo: NEW TRANSLATION
 ALG_state_islam: "Islám jako státní víra" # todo: NEW TRANSLATION
 ALG_state_islam_desc: "Náboženství vždy vedlo alžírský lid. Prohlášením islámu za základ monarchie upevníme svou legitimitu, získáme přízeň ulema a posílíme jednotu věřících." # todo: NEW TRANSLATION
 ALG_restore_knighthood: "Obnovit rytířstvo" # todo: NEW TRANSLATION
 ALG_restore_knighthood_desc: "V době říší bránily naši zemi a víru řády bojovníků a šlechticů. Obnovíme tyto rytířské řády, aby sloužily trůnu a podněcovaly loajalitu ve zbrani." # todo: NEW TRANSLATION
 ALG_andalus_legacy: "Odkaz al-Andalusu" # todo: NEW TRANSLATION
 ALG_andalus_legacy_desc: "Naše andaluské obrození není jen otázkou trůnu. Jde o znovuoživení ztracené hrdosti muslimů vyhnaných před staletími z Iberie. Rozšíříme svůj vliv a připomeneme Evropě, že al-Andalus není zapomenut." # todo: NEW TRANSLATION
 ALG_our_old_realm: "Naše stará říše" # todo: NEW TRANSLATION
 ALG_our_old_realm_desc: "Kdysi jsme pod praporem al-Andalusu vládli částem Iberie. Nyní si pomocí diplomatických iniciativ a historické paměti znovu nárokujeme naše staré země a připravíme půdu pro jejich návrat." # todo: NEW TRANSLATION
 ALG_renewed_nobility: "Obnovená šlechta" # todo: NEW TRANSLATION
 ALG_renewed_nobility_desc: "Musíme vytvořit nové šlechtické rody, které budou sloužit monarchii. Staré rodiny budou obnoveny a nové elity povýšeny, aby Alžírsku poskytly loajální služebníky koruny." # todo: NEW TRANSLATION
 ALG_politic_outreach_iberia: "Politické kontakty v Iberii" # todo: NEW TRANSLATION
 ALG_politic_outreach_iberia_desc: "Podporou spřízněných sil ve Španělsku a Portugalsku můžeme rozšířit alžírský vliv na západ. Naše podpora iberských hnutí posílí naše nároky a oslabí jejich státy." # todo: NEW TRANSLATION
 ALG_fate_of_spain: "Osud Španělska" # todo: NEW TRANSLATION
 ALG_fate_of_spain_desc: "Španělsko leží na zemi našich předků. Jeho osud nyní může být rozhodnut rukou Alžírska prostřednictvím unie, znovuzískání či dobytí." # todo: NEW TRANSLATION
 ALG_true_maghribism: "Pravý maghrebismus" # todo: NEW TRANSLATION
 ALG_true_maghribism_desc: "Nastal čas vyhlásit naši vlastní vizi, ideologii založenou na maghrebské identitě, islámské jednotě a monarchistické hrdosti. Doktrína maghrebismu bude inspirovat nový řád v celé severní Africe." # todo: NEW TRANSLATION
 ALG_glory_of_andalus_idea: "Sláva al-Andalusu" # todo: NEW TRANSLATION
 ALG_glory_of_andalus_idea_desc: "Kulturní obrození inspirované odkazem al-Andalusu povzbuzuje naše učence, řemeslníky a vládce. Spojuje národ prostřednictvím hrdé sdílené paměti." # todo: NEW TRANSLATION
 ALG_spain_algeria_union_tt: "Odemkne rozhodnutí pro unii se Španělskem pod alžírskou monarchií." # todo: NEW TRANSLATION
 ALG_trade_with_arabic_nations_tt: "Alžírsko uzavře lepší obchodní dohody se všemi arabskými národy." # todo: NEW TRANSLATION
 ALG_loas_influence_tt: "Alžírsko zvýší diplomatickým úsilím a dohodami o přátelství svůj vliv mezi členskými státy Arabské ligy." # todo: NEW TRANSLATION
 ALG_isr_threat: "Alžírsko odsuzuje izraelskou agresi" # todo: NEW TRANSLATION
 ALG_palestinian_aid_package_tt: "Alžírsko poskytne pomoc Palestině a zvýší svůj vliv ve všech státech Blízkého východu." # todo: NEW TRANSLATION
 ALG_african_union_reforms_tt: "Alžírsko uzavřelo lepší obchodní dohody se všemi členskými státy OAJ." # todo: NEW TRANSLATION
 ALG_mutual_defense_idea: "Vzájemná obrana" # todo: NEW TRANSLATION
 ALG_mutual_defense_idea_desc: "" # todo: NEW TRANSLATION
 ALG_the_State: "Alžírský stát" # todo: NEW TRANSLATION
 ALG_unlocks_focus_for_us: "§COdemkne rozhodnutí, které nám umožní odstranit negativní modifikátory, které z toho získáváme!§!" # todo: NEW TRANSLATION
 ALG_activate_from_event: "§HTyto zaměření se aktivují prostřednictvím události nebo rozhodnutí§!" # todo: NEW TRANSLATION
 ALG_our_society: "Alžírská společnost" # todo: NEW TRANSLATION
 ALG_our_society_desc: "Alžírská společnost se neustále mění a vyvíjí v něco nového. Ačkoli je role vlády v této oblasti obvykle omezená kvůli určitým omezením, nastaly chvíle, kdy jsme museli zasáhnout, a nastanou chvíle, kdy budeme muset změnit svou politiku." # todo: NEW TRANSLATION
 ALG_DRS: "DRS" # todo: NEW TRANSLATION
 ALG_DRS_desc: "DRS je zpravodajská agentura našeho národa, jejímž úkolem je chránit vládu a státní politiku před vnitřními i vnějšími hrozbami." # todo: NEW TRANSLATION
 ALG_domestic_focus: "Vnitřní zaměření" # todo: NEW TRANSLATION
 ALG_domestic_focus_desc: "DRS by se měla zaměřit na ochranu národa před vnitřními hrozbami, například před škodlivými aktéry, kteří chtějí svrhnout vládu šířením nebezpečných idejí." # todo: NEW TRANSLATION
 ALG_foreign_focus: "Zahraniční zaměření" # todo: NEW TRANSLATION
 ALG_foreign_focus_desc: "DRS by se měla zabývat hrozbami za našimi hranicemi, protože lidé si nikdy nepřejí škodit vlastnímu národu." # todo: NEW TRANSLATION
 ALG_disaster_relief: "Plán pro katastrofy" # todo: NEW TRANSLATION
 ALG_disaster_relief_desc: "V současnosti nemáme žádný plán pro katastrofy, což znamená, že nejsme připraveni chránit naše občany a pomáhat jim." # todo: NEW TRANSLATION
 ALG_charity_based: "Zavést systém vedený charitami" # todo: NEW TRANSLATION
 ALG_charity_based_desc: "Charity se postarají o náš lid, když udeří katastrofa, takže můžeme výrazně omezit výdaje." # todo: NEW TRANSLATION
 ALG_government_reliant: "Zavést vládou vedený systém" # todo: NEW TRANSLATION
 ALG_government_reliant_desc: "Úkolem vlády je pomoci svému lidu, když udeří katastrofa, i kdyby to znamenalo zvýšení výdajů." # todo: NEW TRANSLATION
 ALG_migration_problems: "Problémy s migrací" # todo: NEW TRANSLATION
 ALG_migration_problems_desc: "Vždy jsme měli problémy s přílivem migrantů do země. Nikdy jsme však nevěděli, co s nimi dělat, když jejich problémy v domovské zemi skončí." # todo: NEW TRANSLATION
 ALG_open_door_policy: "Politika otevřených dveří" # todo: NEW TRANSLATION
 ALG_open_door_policy_desc: "Rozhodneme-li se pro politiku otevřených dveří, můžeme příchozí migranty snadno využít ke zlepšení a rozvoji naší země." # todo: NEW TRANSLATION
 ALG_closed_borders: "Uzavřít hranice" # todo: NEW TRANSLATION
 ALG_closed_borders_desc: "Migrantů přicházejících do země se můžeme zcela zbavit jednoduše uzavřením hranic, a tím uzavřít i naše problémy." # todo: NEW TRANSLATION
 ALG_drug_problem: "Problém drog" # todo: NEW TRANSLATION
 ALG_drug_problem_desc: "Někdy jsou drogy potřebné pro lékařské účely, to však některým jednotlivcům nebrání ve zneužívání systému a rekreačním užívání s nebezpečnými následky." # todo: NEW TRANSLATION
 ALG_tighten_punishments: "Tvrdší přístup" # todo: NEW TRANSLATION
 ALG_tighten_punishments_desc: "Každého, kdo užívá drogy k jinému než lékařskému účelu, prohlásíme za zločince bez ohledu na jeho výmluvy." # todo: NEW TRANSLATION
 ALG_relax_restrictions: "Zmírnit náš přístup" # todo: NEW TRANSLATION
 ALG_relax_restrictions_desc: "I když si naši lidé přejí užívat drogy rekreačně, proč by nám na tom mělo záležet? Možná bychom je měli nechat dělat, co chtějí, i když s určitými riziky." # todo: NEW TRANSLATION
 ALG_rising_nationalism: "Vzestup nacionalismu" # todo: NEW TRANSLATION
 ALG_rising_nationalism_desc: "Přestože nacionalismus může být dobrou věcí, jeho nadbytek škodí. Nacionalismus v zemi způsobil problémy a propuknutí střetů mezi menšinovými skupinami." # todo: NEW TRANSLATION
 ALG_utilize_it: "Využít nacionalismus" # todo: NEW TRANSLATION
 ALG_utilize_it_desc: "Využijeme nacionalismus ve svůj prospěch, aby nepřítel věděl, že alžírský lid nebude v době války nečinně přihlížet." # todo: NEW TRANSLATION
 ALG_combat_it: "Bojovat proti němu" # todo: NEW TRANSLATION
 ALG_combat_it_desc: "Budeme muset proti nacionalismu bojovat, protože si nemůžeme dovolit další nestabilitu uvnitř našich hranic." # todo: NEW TRANSLATION
 ALG_charity_disasters: "Charitativní plán" # todo: NEW TRANSLATION
 ALG_charity_disasters_desc: "Náš plán pro katastrofy spoléhá na laskavost občanů a dary, které poskytují pomoc lidem v nouzi." # todo: NEW TRANSLATION
 ALG_government_led_disasters: "Vládní plán" # todo: NEW TRANSLATION
 ALG_government_led_disasters_desc: "Vláda bude poskytovat pomoc lidem postiženým přírodními katastrofami namísto charit, ačkoli ty mohou samozřejmě také pomáhat, pokud chtějí." # todo: NEW TRANSLATION
 ALG_drugs_illegalized: "Drogy postaveny mimo zákon" # todo: NEW TRANSLATION
 ALG_drugs_illegalized_desc: "Každý, kdo užívá drogy k jinému než lékařskému účelu, se dostane do konfliktu se zákonem." # todo: NEW TRANSLATION
 ALG_drugs_legalized: "Legalizace drog" # todo: NEW TRANSLATION
 ALG_drugs_legalized_desc: "Ve skutečnosti nám nezáleží na tom, k čemu lidé drogy užívají, je to koneckonců jejich život." # todo: NEW TRANSLATION
 ALG_drs_idea_1: "Militarizovaná policie" # todo: NEW TRANSLATION
 ALG_drs_idea_1_desc: "Policie byla reorganizována na polovojenskou sílu schopnou zvládat terorismus, nepokoje a výtržnosti, čímž získala významnější roli ve vnitřní bezpečnosti Alžírska." # todo: NEW TRANSLATION
 ALG_drs_idea_2: "Silně militarizovaná policie" # todo: NEW TRANSLATION
 ALG_drs_idea_2_desc: "Policie nyní funguje jako těžce ozbrojený polovojenský sbor s pokročilým vybavením a úzkými vazbami na armádu, čímž se stírá hranice mezi civilní bezpečností a vojenskou kontrolou." # todo: NEW TRANSLATION
 ALG_drs_idea_3: "Integrovaná militarizovaná policie" # todo: NEW TRANSLATION
 ALG_drs_idea_3_desc: "Naše policejní síly jsou plně integrovány do bezpečnostního aparátu a po boku armády působí v boji proti terorismu, při obraně hranic a domácím dohledu." # todo: NEW TRANSLATION
 ALG_riot_police_idea: "Pořádková policie" # todo: NEW TRANSLATION
 ALG_riot_police_idea_desc: "Specializovaná policejní složka určená k řešení protestů, demonstrací a sociálních nepokojů. Je vybavena prostředky pro kontrolu davu a klade velký důraz na udržení stability režimu." # todo: NEW TRANSLATION
 ALG_algerian_special_forces: "Vytvořit alžírské speciální síly" # todo: NEW TRANSLATION
 ALG_algerian_special_forces_desc: "Bezpečnostní hrozby Alžírska vyžadují elitní jednotky schopné rychlého zásahu a boje proti terorismu. Zřízení specializovaných sil posílí naši obranu proti vnitřním nepokojům i vnějším nebezpečím." # todo: NEW TRANSLATION
 ALG_BRI: "Rozšířit BRI" # todo: NEW TRANSLATION
 ALG_BRI_desc: "Brigade de Recherche et d’Intervention (BRI) je specializovaná policejní jednotka vycvičená k osvobozování rukojmích a provádění vysoce rizikových operací. Rozšíření jejích početních stavů a zdrojů zlepší naši městskou bezpečnost." # todo: NEW TRANSLATION
 ALG_al_saiqa: "Jednotky Al-Sa'iqa" # todo: NEW TRANSLATION
 ALG_al_saiqa_desc: "Speciální polovojenské jednotky pro potlačování nepokojů a boj proti povstalcům posílí naši schopnost udržovat zákon a pořádek v období občanských nepokojů." # todo: NEW TRANSLATION
 ALG_al_hars_al_watani: "Národní garda" # todo: NEW TRANSLATION
 ALG_al_hars_al_watani_desc: "Národní bezpečnostní garda zajistí místní bezpečnost v ohrožených oblastech, uvolní armádní zdroje a bude udržovat pořádek v krizových situacích." # todo: NEW TRANSLATION
 ALG_haras_al_hudod: "Jednotky pohraniční stráže" # todo: NEW TRANSLATION
 ALG_haras_al_hudod_desc: "Specializované síly hlídkující na našich hranicích omezí pašování, zabrání infiltraci a posílí obranu alžírského pohraničí." # todo: NEW TRANSLATION
 ALG_central_armed_police: "Ústřední ozbrojená policie" # todo: NEW TRANSLATION
 ALG_central_armed_police_desc: "Soustředění ozbrojené policie pod centralizované velení zlepší rychlost reakce a efektivitu a zajistí tvrdší postup proti organizovaným hrozbám." # todo: NEW TRANSLATION
 ALG_border_security_force: "Pohraniční bezpečnostní síly" # todo: NEW TRANSLATION
 ALG_border_security_force_desc: "Vytvořením specializované síly pro dohled nad hranicemi a zadržování narušitelů Alžírsko zasáhne proti pašeráckým sítím a ozbrojeným infiltracím." # todo: NEW TRANSLATION
 ALG_firqat_tadakhol_al_sariye: "Jednotka rychlého nasazení" # todo: NEW TRANSLATION
 ALG_firqat_tadakhol_al_sariye_desc: "Elitní jednotky rychlé reakce umožní Alžírsku rychle udeřit proti teroristickým buňkám a vznikajícím krizím dříve, než eskalují." # todo: NEW TRANSLATION
 ALG_expanding_BRI: "Rozšíření schopností BRI" # todo: NEW TRANSLATION
 ALG_expanding_BRI_desc: "Díky vyššímu financování, výcviku a pokročilému vybavení se BRI může proměnit v impozantní protiteroristickou jednotku pro osvobozování rukojmích, která se vyrovná nejlepším v regionu." # todo: NEW TRANSLATION
 ALG_increase_police_funding: "Zvýšit financování policie" # todo: NEW TRANSLATION
 ALG_increase_police_funding_desc: "Vyšší investice do policie a četnictva posílí vnitřní stabilitu, veřejnou bezpečnost a odolnost Alžírska vůči nepokojům." # todo: NEW TRANSLATION
 ALG_drs_expand: "Rozšířit DRS" # todo: NEW TRANSLATION
 ALG_drs_expand_desc: "Département du Renseignement et de la Sécurité (DRS) lze dále rozšířit, čímž získá větší schopnosti shromažďovat zpravodajské informace a bojovat proti špionáži." # todo: NEW TRANSLATION
 ALG_new_gendarmerie_equipment: "Nové vybavení pro četnictvo" # todo: NEW TRANSLATION
 ALG_new_gendarmerie_equipment_desc: "Naše četnictvo musí být řádně vyzbrojeno a vybaveno, aby čelilo výzvám terorismu, kriminality a vnitřních nepokojů." # todo: NEW TRANSLATION
 ALG_mia_reform: "Reformovat ministerstvo vnitra" # todo: NEW TRANSLATION
 ALG_mia_reform_desc: "Centralizace velení pod ministerstvem vnitra zefektivní řízení vnitřní bezpečnosti a zajistí rychlejší a koordinovanější reakce." # todo: NEW TRANSLATION
 ALG_internal_troops: "Vnitřní jednotky" # todo: NEW TRANSLATION
 ALG_internal_troops_desc: "Polovojenské vnitřní jednotky pod státním velením posílí boj proti povstalcům a zločineckým sítím." # todo: NEW TRANSLATION
 ALG_increase_special_forces: "Rozšířit speciální síly" # todo: NEW TRANSLATION
 ALG_increase_special_forces_desc: "Naše elitní síly potřebují rozšířený nábor a specializované výcvikové programy, aby mohly čelit sofistikovaným hrozbám moderní války." # todo: NEW TRANSLATION
 ALG_cybercrime_directorate: "Ředitelství pro kyberkriminalitu" # todo: NEW TRANSLATION
 ALG_cybercrime_directorate_desc: "Zřízení ředitelství pro boj s kyberkriminalitou ochrání Alžírsko před digitální špionáží, kybernetickými útoky a nepřátelskými dezinformačními kampaněmi." # todo: NEW TRANSLATION
 ALG_riot_police: "Jednotky pořádkové policie" # todo: NEW TRANSLATION
 ALG_riot_police_desc: "Organizované jednotky pořádkové policie zajistí kontrolu davu a disciplinovanou reakci na masové protesty, čímž udrží stabilitu během nepokojů." # todo: NEW TRANSLATION
 ALG_military_police_training: "Výcvik vojenské policie" # todo: NEW TRANSLATION
 ALG_military_police_training_desc: "Výcvikové programy pro vojenskou policii zvýší disciplínu, omezí dezertérství a zlepší správu okupovaných oblastí v nestabilních regionech." # todo: NEW TRANSLATION
 ALG_peoples_security: "Lidová bezpečnost" # todo: NEW TRANSLATION
 ALG_peoples_security_desc: "Doktrína „lidové bezpečnosti“ posílí civilně-vojenskou spolupráci, zvýší morálku a zapojí místní obyvatelstvo do úsilí o národní obranu." # todo: NEW TRANSLATION
 ALG_procurement_of_espionage_equipment: "Nákup špionážního vybavení" # todo: NEW TRANSLATION
 ALG_procurement_of_espionage_equipment_desc: "Investice do pokročilých sledovacích a špionážních technologií zlepší naši schopnost odhalovat a neutralizovat vnitřní i zahraniční hrozby." # todo: NEW TRANSLATION
 ALG_occupation_management_strategies: "Strategie správy okupovaných území" # todo: NEW TRANSLATION
 ALG_occupation_management_strategies_desc: "Nové strategie pro správu okupovaných či nestabilních oblastí minimalizují odpor, sníží ztráty a upevní státní autoritu." # todo: NEW TRANSLATION
 ALG_french_weapons: "Dovoz francouzských zbraní" # todo: NEW TRANSLATION
 ALG_french_weapons_desc: "Nákupem francouzských ručních zbraní a vybavení může Alžírsko rychle modernizovat svou pěchotu a současně posílit vztahy s Paříží." # todo: NEW TRANSLATION
 ALG_russian_guns: "Dovoz ruských zbraní" # todo: NEW TRANSLATION
 ALG_russian_guns_desc: "Ruské ruční zbraně dodávané ve velkém množství poskytnou Alžírsku odolnou a spolehlivou výzbroj a posílí tradiční obranné partnerství s Moskvou." # todo: NEW TRANSLATION
 ALG_algerian_space_programme: "Založit ASAL" # todo: NEW TRANSLATION
 ALG_algerian_space_programme_desc: "Alžírská kosmická agentura (ASAL) bude koordinovat veškeré národní kosmické aktivity od vývoje družic po mezinárodní spolupráci ve výzkumu vesmíru." # todo: NEW TRANSLATION
 ALG_alsat_initiative: "Iniciativa AlSat" # todo: NEW TRANSLATION
 ALG_alsat_initiative_desc: "Projekt AlSat poskytne Alžírsku jeho první družice určené k pozorování Země a komunikaci a znamená náš vstup do kosmického věku." # todo: NEW TRANSLATION
 ALG_alsat2_series: "Série AlSat-2" # todo: NEW TRANSLATION
 ALG_alsat2_series_desc: "Vývoj pokročilých družic AlSat-2 zlepší naše schopnosti sledování, komunikace a dálkového průzkumu." # todo: NEW TRANSLATION
 ALG_finance_private_space_companies: "Financovat soukromé kosmické společnosti" # todo: NEW TRANSLATION
 ALG_finance_private_space_companies_desc: "Podpora účasti alžírského soukromého sektoru v kosmickém průmyslu posílí naši domácí technologickou základnu." # todo: NEW TRANSLATION
 ALG_regional_satnet: "Regionální satelitní síť" # todo: NEW TRANSLATION
 ALG_regional_satnet_desc: "Propojíme naše družice do regionální sítě, spojíme civilní a vojenské využití a zároveň propojíme Alžírsko s jeho sousedy." # todo: NEW TRANSLATION
 ALG_asal_lunar_project: "Lunární projekt ASAL" # todo: NEW TRANSLATION
 ALG_asal_lunar_project_desc: "Alžírská kosmická agentura zahájí ambiciózní projekt výzkumu průzkumu Měsíce a rozvoje raketové technologie." # todo: NEW TRANSLATION
 ALG_human_spaceflight: "Program pilotovaných letů do vesmíru" # todo: NEW TRANSLATION
 ALG_human_spaceflight_desc: "Náš kosmický program učiní odvážný krok vpřed: ve spolupráci s mezinárodními spojenci naplánujeme první alžírský pilotovaný let do vesmíru." # todo: NEW TRANSLATION
 ALG_orbital_defense_program: "Program orbitální obrany" # todo: NEW TRANSLATION
 ALG_orbital_defense_program_desc: "Družice lze využít i k obraně. Rozvoj schopností orbitální obrany ochrání Alžírsko před budoucími hrozbami." # todo: NEW TRANSLATION
 ALG_alsat_future: "Budoucnost AlSatu" # todo: NEW TRANSLATION
 ALG_alsat_future_desc: "Budoucnost alžírského kosmického programu spočívá v trvalých investicích, partnerstvích veřejného a soukromého sektoru a dlouhodobém vědeckém plánování." # todo: NEW TRANSLATION
 ALG_cyber_sat_integration: "Kyberneticko-satelitní integrace" # todo: NEW TRANSLATION
 ALG_cyber_sat_integration_desc: "Spojení schopností kybernetické války s naší satelitní sítí poskytne Alžírsku mocný asymetrický nástroj moderního konfliktu." # todo: NEW TRANSLATION
 ALG_idea_the_new_space_race: "Nové vesmírné závody" # todo: NEW TRANSLATION
 ALG_idea_the_new_space_race_desc: "Alžírsko vstoupilo do globálních vesmírných závodů a soupeří se světovými mocnostmi, aby prokázalo svou technologickou a strategickou sílu." # todo: NEW TRANSLATION
 ALG_idea_cyberwarfare_2: "Kyberneticko-satelitní integrace" # todo: NEW TRANSLATION
 ALG_idea_cyberwarfare_2_desc: "Alžírské kybernetické velení je nyní integrováno s našimi satelitními systémy, což poskytuje lepší bezpečnost komunikace a útočné schopnosti." # todo: NEW TRANSLATION
 ALG_algeria_police_modifier: "Vnitřní bezpečnost Alžírska" # todo: NEW TRANSLATION
 ALG_algeria_police_modifier_desc: "Alžírská vláda má od dob svého členství v SSSR bohaté zkušenosti s potlačováním nesouhlasu a nepřátelských agentů." # todo: NEW TRANSLATION
 ALG_algeria_police_modifier_tt_intro: "Upravit §Y$ALG_algeria_police_modifier$§! o" # todo: NEW TRANSLATION
 ALG_algeria_support_category: "Pomocné jednotky Alžírska" # todo: NEW TRANSLATION
 ALG_stabilize_mali: "Stabilizovat Mali" # todo: NEW TRANSLATION
 ALG_stabilize_mali_desc: "Nestabilita Mali ohrožuje celý Sahel. Alžírsko se svými zkušenostmi v boji proti povstalcům a diplomacii musí zasáhnout a stabilizovat svého jižního souseda, ať už silou, vyjednáváním nebo vlivem." # todo: NEW TRANSLATION
 ALG_back_tuareg_rebellion: "Podpořit povstání Tuaregů" # todo: NEW TRANSLATION
 ALG_back_tuareg_rebellion_desc: "Namísto podpory Bamaka můžeme posílit tuaregské povstalce usilující o autonomii v severním Mali. Oslabíme tím ústřední moc Mali a zvýšíme svůj vliv v regionu." # todo: NEW TRANSLATION
 ALG_support_malian_army: "Podpořit malijskou armádu" # todo: NEW TRANSLATION
 ALG_support_malian_army_desc: "Alžírsko může místo toho přímo podpořit malijskou vládu a poskytnout jí politickou i vojenskou podporu k posílení armády proti povstalcům." # todo: NEW TRANSLATION
 ALG_promote_tuareg_dialogue: "Podpořit dialog s Tuaregy" # todo: NEW TRANSLATION
 ALG_promote_tuareg_dialogue_desc: "Namísto volby strany by Alžírsko mohlo hostit rozhovory mezi tuaregskými povstalci a malijským státem a postavit se do role prostředníka a stabilizátora Sahelu." # todo: NEW TRANSLATION
 ALG_support_tuareg_politicians: "Podpořit tuaregské politiky" # todo: NEW TRANSLATION
 ALG_support_tuareg_politicians_desc: "Vliv Tuaregů lze budovat i politickými cestami, nejen na bojišti. Podpora umírněných tuaregských představitelů poskytne Alžírsku dlouhodobé spojence v Mali." # todo: NEW TRANSLATION
 ALG_aid_malian_army: "Poskytnout pomoc malijské armádě" # todo: NEW TRANSLATION
 ALG_aid_malian_army_desc: "Alžírsko může vyslat zbraně, vozidla a velitelské systémy k posílení schopnosti malijské armády bojovat proti povstalcům a stabilizovat zemi." # todo: NEW TRANSLATION
 ALG_mali_stabilized: "Mali stabilizováno" # todo: NEW TRANSLATION
 ALG_mali_stabilized_desc: "Po letech nepokojů přineslo alžírské úsilí výsledky. Konflikt v Mali je pod kontrolou, povstání Tuaregů potlačeno a Alžírsko stojí jako stabilizační mocnost Sahelu." # todo: NEW TRANSLATION
 ALG_tuareg_autonomy_victory: "Vítězství tuaregské autonomie" # todo: NEW TRANSLATION
 ALG_tuareg_autonomy_victory_desc: "Tuaregské hnutí získalo uznání své autonomie. S podporou Alžírska nyní Tuaregové drží politickou moc a Mali čelí nové rovnováze autority v Sahelu." # todo: NEW TRANSLATION
 Algeria.237.t: "Alžírský zásah v Mali" # todo: NEW TRANSLATION
 Algeria.237.d: "Alžírsko vyhlásilo svůj záměr stabilizovat Mali s odvoláním na obavy z terorismu, tuaregského separatismu a regionální nestability. Jak Alžír přesouvá na jih vojska, pomoc a politický tlak, rovnováha sil v Mali se mění. Zda to přinese mír, nebo hlubší konflikt, teprve uvidíme." # todo: NEW TRANSLATION
 Algeria.237.a: "Alžírsko přebírá vedení v Sahelu." # todo: NEW TRANSLATION
 Algeria.409.t: "Iniciativa tuaregského dialogu" # todo: NEW TRANSLATION
 Algeria.409.d: "Alžírsko začalo podporovat dialog s tuaregskými představiteli v Mali a širším Sahelu. Zatímco někteří v Alžíru to považují za cestu k míru a stabilitě, jiní se obávají, že legitimizace tuaregských požadavků posílí separatismus. Vláda musí rozhodnout, jak daleko chce tuto iniciativu podporovat." # todo: NEW TRANSLATION
 Algeria.409.a: "Zapojit se prostřednictvím kulturní a mediální osvěty" # todo: NEW TRANSLATION
 Algeria.409.b: "Poskytnout diskrétní podporu tuaregskému vedení" # todo: NEW TRANSLATION
 ALG_TUA_REV_TT: "[TUA.GetFlag] §HOdpor Tuaregů§! byl podpořen Alžírskem, což vedlo k vytvoření §Yautonomního regionu Tuaregů§! (nebo případně §Gnového tuaregského státu§!) v Mali." # todo: NEW TRANSLATION
 ALG_MAL_STABILIZED_TT: "[MAL.GetFlag] §HMali§! bylo s alžírskou podporou §Gstabilizováno§!, čímž byl zajištěn mír a sníženo riziko obnovení konfliktu." # todo: NEW TRANSLATION
 ALG_algerian_intervention: "Doktrína regionální intervence" # todo: NEW TRANSLATION
 ALG_algerian_intervention_desc: "Alžírsko dlouhodobě působí jako regionální prostředník. Vzhledem k tomu, že nestabilita ohrožuje naše sousedství, musíme rozhodnout, zda do regionálních konfliktů zasáhnout přímo a chránit své národní zájmy." # todo: NEW TRANSLATION
 ALG_intervene_in_sahrawi: "Zasáhnout na Sahaře" # todo: NEW TRANSLATION
 ALG_intervene_in_sahrawi_desc: "Konflikt mezi Marokem a Saharskou arabskou demokratickou republikou zůstává nevyřešen. Alžírsko musí zasáhnout diplomaticky či vojensky, aby ochránilo své hranice a posílilo svůj vliv v Maghrebu." # todo: NEW TRANSLATION
 ALG_supp_polisario: "Podpořit Frontu Polisario" # todo: NEW TRANSLATION
 ALG_supp_polisario_desc: "Saharský boj za nezávislost je ústřední součástí alžírské regionální politiky. Dodávkami zbraní a podporou Fronty Polisario můžeme oslabit Maroko a zajistit růst našeho vlivu v Západní Sahaře." # todo: NEW TRANSLATION
 ALG_a_new_stance: "Nový postoj vůči Maroku" # todo: NEW TRANSLATION
 ALG_a_new_stance_desc: "Alžírsko tradičně odmítalo marockou kontrolu nad Západní Saharou, měnící se politické klima však vyžaduje pragmatismus. Spojenectví s Marokem by mohlo snížit napětí, otevřít nové hospodářské příležitosti a poskytnout nám vliv v Maghrebu." # todo: NEW TRANSLATION
 ALG_intervene_in_libya: "Zasáhnout v Libyi" # todo: NEW TRANSLATION
 ALG_intervene_in_libya_desc: "Chaos v Libyi hrozí přelitím přes naše hranice. Alžírsko si nemůže dovolit nestabilitu u souseda. Ať už vojenskou akcí, diplomacií nebo skrytým vlivem musíme zajistit své zájmy v Libyi." # todo: NEW TRANSLATION
 ALG_assassinate_gaddafi: "Zavraždit Kaddáfího" # todo: NEW TRANSLATION
 ALG_assassinate_gaddafi_desc: "Vláda Muammara Kaddáfího destabilizuje celý region. Zorganizováním jeho pádu může Alžírsko urychlit změnu režimu v Libyi a zajistit vznik příznivější vlády, i kdyby to uvrhlo Libyi do občanské války." # todo: NEW TRANSLATION
 ALG_peacekeepers: "Vyslat mírové jednotky do Libye" # todo: NEW TRANSLATION
 ALG_peacekeepers_desc: "Namísto dalšího uvržení Libye do chaosu by Alžírsko mohlo zasáhnout jako mírová síla. Nasazení vojsk ke stabilizaci situace by posílilo náš obraz odpovědné regionální mocnosti a poskytlo nám trvalý vliv v Tripolisu." # todo: NEW TRANSLATION
 ALG_pulse.1.t: "Sahara se rozšiřuje" # todo: NEW TRANSLATION
 ALG_pulse.1.d: "Podle nejnovějších údajů se Sahara nadále vytrvale rozšiřuje. Pastviny se mění v pustinu, oázy vysychají a volně žijící zvířata, jako jsou gazely a jeleni berberští, mizí kvůli pytláctví. Nadměrná pastva, nekontrolovaná těžba a přehlížení pytláctví desertifikaci jen zhorší." # todo: NEW TRANSLATION
 ALG_pulse.1.a: "Znepokojivé znamení" # todo: NEW TRANSLATION
 ALG_pulse.2.t: "Sahara stabilní" # todo: NEW TRANSLATION
 ALG_pulse.2.d: "Letošní údaje naznačují, že postup Sahary se zpomalil a desertifikace se stabilizovala. Bez opatření proti nadměrné pastvě, pytláctví a neudržitelnému využívání půdy se však rovnováha může brzy znovu vychýlit." # todo: NEW TRANSLATION
 ALG_pulse.2.a: "Musíme zůstat ostražití" # todo: NEW TRANSLATION
 ALG_pulse.3.t: "Sahara si bere půdu zpět" # todo: NEW TRANSLATION
 ALG_pulse.3.d: "Nedávné zprávy naznačují, že se na některé okraje pouště pomalu vrací vegetace. Zdá se, že protipytlácké hlídky, kontrolovaná pastva a zalesňování pomáhají zemi zotavit se a obnovují rovnováhu křehkých ekosystémů." # todo: NEW TRANSLATION
 ALG_pulse.3.a: "Povzbudivý pokrok" # todo: NEW TRANSLATION
 ALG_reduce_yearly_good_desertification_5: "Pravděpodobnost §YOasifikace§!: §R-5%§!\n" # todo: NEW TRANSLATION
 ALG_increase_yearly_good_desertification_5: "Pravděpodobnost §YOasifikace§!: §G+5%§!\n" # todo: NEW TRANSLATION
 ALG_increase_yearly_bad_desertification_5: "Pravděpodobnost §Ydesertifikace§!: §R+5%§!\n" # todo: NEW TRANSLATION
 ALG_decrease_yearly_bad_desertification_5: "Pravděpodobnost §Ydesertifikace§!: §G-5%§!\n" # todo: NEW TRANSLATION
 ALG_reduce_yearly_neutral_desertification_5: "Pravděpodobnost §Ystabilizace§!: §R-5%§!\n" # todo: NEW TRANSLATION
 ALG_increase_yearly_neutral_desertification_5: "Pravděpodobnost §Ystabilizace§!: §G+5%§!\n" # todo: NEW TRANSLATION
 ALG_anti_poaching_raid_successful: "§GÚspěšně jsme zlikvidovali §Y[?poachers_killed]§! pytláků!§!" # todo: NEW TRANSLATION
 ALG_anti_poaching_raid_normal: "§GPodařilo se nám zlikvidovat §Y[?poachers_killed]§! pytláků!§!" # todo: NEW TRANSLATION
 ALG_anti_poaching_raid_failure: "§RNaši rangeři utrpěli ztráty§!" # todo: NEW TRANSLATION
 ALG_strengthen_ENTV_environmental_campaigns: "Posílit ekologické kampaně ENTV" # todo: NEW TRANSLATION
 ALG_strengthen_ENTV_environmental_campaigns_desc: "ENTV, naše národní vysílací služba, může sloužit ke zvyšování povědomí o ekologických otázkách. Kampaně o desertifikaci, ochraně vody a ochraně přírody mohou povzbudit občany k podpoře udržitelné budoucnosti." # todo: NEW TRANSLATION
 ALG_increase_cattle_grazing: "Rozšířit pastvu dobytka" # todo: NEW TRANSLATION
 ALG_increase_cattle_grazing_desc: "Chov dobytka zůstává základem ekonomiky alžírských stepí a vysokých náhorních plošin. Rozšíření pastvy skotu a ovcí může zvýšit příjmy na venkově, pokud však nebude správně řízeno, hrozí nadměrná pastva, degradace půdy a desertifikace." # todo: NEW TRANSLATION
 ALG_optimize_pastoral_practices: "Optimalizovat pastevecké postupy" # todo: NEW TRANSLATION
 ALG_optimize_pastoral_practices_desc: "Tradiční způsoby pastvy značně zatížily křehké ekosystémy. Zavedením rotační pastvy, udržitelného využívání vody a lepší veterinární péče můžeme pastevecké postupy modernizovat a omezit jejich dopad na stepi a okraje Sahary." # todo: NEW TRANSLATION
 ALG_expand_steppe_farming: "Rozšířit zemědělství ve stepích" # todo: NEW TRANSLATION
 ALG_expand_steppe_farming_desc: "Stepní oblasti Alžírska mezi Tellským Atlasem a Saharou jsou zásadní pro produkci obilí a chov dobytka. Investicemi do zavlažování a rekultivace můžeme zvýšit obdělávání těchto oblastí, byť za cenu dalšího zatížení životního prostředí." # todo: NEW TRANSLATION
 ALG_research_drought_resistant_crops: "Výzkum plodin odolných vůči suchu" # todo: NEW TRANSLATION
 ALG_research_drought_resistant_crops_desc: "Klimatická změna a desertifikace ohrožují potravinovou bezpečnost Alžírska. Investicemi do výzkumu plodin odolných vůči suchu, například odolných obilovin a odrůd datlových palem, můžeme ochránit zemědělství před zhoršujícími se suchými podmínkami." # todo: NEW TRANSLATION
 ALG_shrink_nature_reserves_sahara: "Zmenšit přírodní rezervace Sahary" # todo: NEW TRANSLATION
 ALG_shrink_nature_reserves_sahara_desc: "Někteří tvrdí, že rozsáhlé části půdy vyčleněné v Sahaře jako přírodní rezervace by mohly být využity pro zemědělství, pastvu nebo průmyslové projekty. Zmenšení těchto rezervací by umožnilo rozvoj, avšak za vysokou cenu pro životní prostředí." # todo: NEW TRANSLATION
 ALG_expand_nature_reserves_sahara: "Rozšířit přírodní rezervace Sahary" # todo: NEW TRANSLATION
 ALG_expand_nature_reserves_sahara_desc: "Ochrana křehkých ekosystémů Sahary je nezbytná pro biodiverzitu a dlouhodobou ekologickou rovnováhu. Rozšířením chráněných území můžeme ochránit ohrožené druhy a omezit tlaky přispívající k desertifikaci." # todo: NEW TRANSLATION
 ALG_drs: "DRS" # todo: NEW TRANSLATION
 ALG_drs_desc: "Alžírské Département du Renseignement et de la Sécurité (DRS) vzniklo během krvavé Černé dekády a proslulo svými rozsáhlými pravomocemi. Ačkoli oficiálně slouží jako štít proti terorismu a zahraniční infiltraci, DRS rovněž výrazně zasahuje do politiky a zajišťuje zachování státní autority a stability, byť za cenu občanských svobod." # todo: NEW TRANSLATION
 ALG_decline_of_tourism: "Úpadek cestovního ruchu" # todo: NEW TRANSLATION
 ALG_destroyed_agriculture: "Zničené zemědělství" # todo: NEW TRANSLATION
 ALG_tikjda_resort: "Lyžařské středisko Tikjda" # todo: NEW TRANSLATION
 ALG_algerian_tourism: "Cestovní ruch v Alžírsku" # todo: NEW TRANSLATION
 ALG_natural_products_idea: "Alžírské přírodní produkty" # todo: NEW TRANSLATION
 ALG_sonatrach: "Rozšíření Sonatrachu" # todo: NEW TRANSLATION
 algeria_invest.1.t: "Investice v Alžírsku" # todo: NEW TRANSLATION
 algeria_invest.1.d: "Alžírsko nás žádá, abychom investovali do jeho státu. Díky investicím v Alžírsku můžeme posílit svůj vliv v severní Africe a podél pobřeží Středozemního moře." # todo: NEW TRANSLATION
 algeria_invest.1.a: "Dobře" # todo: NEW TRANSLATION
 algeria_invest.1.b: "Ne" # todo: NEW TRANSLATION
 algeria_invest.2.t: "Souhlasili" # todo: NEW TRANSLATION
 algeria_invest.2.d: "Souhlasili s investicí v naší zemi." # todo: NEW TRANSLATION
 algeria_invest.2.a: "Dobře." # todo: NEW TRANSLATION
 algeria_invest.3.t: "Odmítli" # todo: NEW TRANSLATION
 algeria_invest.3.d: "Odmítli investovat v naší zemi s tvrzením, že naše nabídka nebyla zisková." # todo: NEW TRANSLATION
 algeria_invest.3.a: "Smutné" # todo: NEW TRANSLATION
 algeria_invest.4.t: "Americké investice v Alžírsku" # todo: NEW TRANSLATION
 algeria_invest.4.d: "Alžírsko nabízí našim společnostem možnost investovat do své ekonomiky. Na oplátku získáme vliv a z dlouhodobého hlediska posílíme vztahy s Alžírskem." # todo: NEW TRANSLATION
 algeria_invest.4.a: "Kdo mluvil o penězích?" # todo: NEW TRANSLATION
 algeria_invest.4.b: "Ne" # todo: NEW TRANSLATION
 algeria_invest.5.t: "Amerika souhlasila." # todo: NEW TRANSLATION
 algeria_invest.5.d: "Americké společnosti již začaly plánovat investiční projekty v Alžírsku." # todo: NEW TRANSLATION
 algeria_invest.5.a: "Vítězství pro podnikání a demokracii." # todo: NEW TRANSLATION
 algeria_invest.6.t: "Amerika odmítla" # todo: NEW TRANSLATION
 algeria_invest.6.d: "Amerika odmítla investovat do naší ekonomiky. Nedůvěřuje transparentnosti našeho politického systému." # todo: NEW TRANSLATION
 algeria_invest.6.a: "Dobrá, zavoláme tedy Evropě." # todo: NEW TRANSLATION
 algeria_invest.7.t: "Evropské investice v Alžírsku" # todo: NEW TRANSLATION
 algeria_invest.7.d: "Alžírsko nás žádá, abychom investovali do jeho ekonomiky. Podle jeho slov má příznivé investiční prostředí a naše zapojení posílí vazby napříč Středozemním mořem." # todo: NEW TRANSLATION
 algeria_invest.7.a: "Samozřejmě" # todo: NEW TRANSLATION
 algeria_invest.7.b: "Nejsou peníze." # todo: NEW TRANSLATION
 algeria_invest.8.t: "Evropa souhlasila" # todo: NEW TRANSLATION
 algeria_invest.8.d: "Evropští investoři souhlasili s podporou naší ekonomiky. Několik velkých společností je již ochotno zahájit investiční projekty v Alžírsku." # todo: NEW TRANSLATION
 algeria_invest.8.a: "Dobrá zpráva pro rozvoj." # todo: NEW TRANSLATION
 algeria_invest.9.t: "Evropa odmítla" # todo: NEW TRANSLATION
 algeria_invest.9.d: "Tvrdili, že v současnosti nejsou k dispozici žádné prostředky na přidělení investičního balíčku." # todo: NEW TRANSLATION
 algeria_invest.9.a: "Smutné" # todo: NEW TRANSLATION
 algeria_invest.10.t: "Čínský investor financuje metro v Alžíru" # todo: NEW TRANSLATION
 algeria_invest.10.d: "Čínský investor nám nabízí peníze na rozšíření metra v Alžíru. Metro můžeme postavit z jeho prostředků, nebo je zpronevěřit podvodem, což by však mohlo poškodit naše vztahy s Čínou." # todo: NEW TRANSLATION
 algeria_invest.10.a: "Alžír potřebuje metro!" # todo: NEW TRANSLATION
 algeria_invest.10.b: "Alžírsko potřebuje peníze!" # todo: NEW TRANSLATION
 algeria_invest.11.t: "Alžírsko nás podvedlo" # todo: NEW TRANSLATION
 algeria_invest.11.d: "Skupina alžírských podvodníků zmanipulovala projekt metra a vzala si všechny peníze, které jsme pro ně připravili." # todo: NEW TRANSLATION
 algeria_invest.11.a: "Hajzlové" # todo: NEW TRANSLATION
 algeria_invest.12.t: "Rebrabovy investice" # todo: NEW TRANSLATION
 algeria_invest.12.d: "Issad Rebrab, zakladatel společnosti Cevital, je jedním z nejvlivnějších alžírských podnikatelů. Od 90. let investoval do průmyslu, výroby potravin a mezinárodní expanze. Díky němu Alžírsko získalo továrny, pracovní místa a prestižní projekty. Nadále zůstává symbolem potenciálu soukromého sektoru země." # todo: NEW TRANSLATION
 algeria_invest.12.a: "Děkujeme, Rebrabe!" # todo: NEW TRANSLATION
 ALG_our_economy: "Naše ekonomika" # todo: NEW TRANSLATION
 ALG_our_economy_desc: "Alžírská ekonomika stojí na rozcestí. Po letech nestability a nedostatečných investic se vláda musí rozhodnout, zda se zaměří dovnitř, nebo otevře dveře modernizaci a růstu." # todo: NEW TRANSLATION
 ALG_attract_foreign_inv: "Přilákat zahraniční investice" # todo: NEW TRANSLATION
 ALG_attract_foreign_inv_desc: "Otevřením našich trhů zahraničním investorům může Alžírsko získat kapitál, odborné znalosti a infrastrukturní projekty, které by jinak zůstaly mimo jeho dosah." # todo: NEW TRANSLATION
 ALG_france_inv: "Vyhledat francouzské investice" # todo: NEW TRANSLATION
 ALG_france_inv_desc: "Francie zůstává jedním z nejbližších ekonomických partnerů Alžírska. Obnovení jejího zapojení do našich energetických a průmyslových odvětví by mohlo urychlit rozvoj, pokud dokážeme snést její vliv." # todo: NEW TRANSLATION
 ALG_chinese_inv: "Iniciativa čínských investic" # todo: NEW TRANSLATION
 ALG_chinese_inv_desc: "Čína nabízí ambiciózní investiční balíčky, často spojené s infrastrukturou a rozvojem zdrojů. Partnerství s Pekingem by mohlo proměnit naši ekonomiku, avšak za cenu hlubší závislosti." # todo: NEW TRANSLATION
 ALG_usa_inv: "Pozvat americké investory" # todo: NEW TRANSLATION
 ALG_usa_inv_desc: "Spojené státy mohou poskytnout pokročilé technologie a značnou finanční podporu. Spolupráce s Washingtonem může přetvořit alžírský průmysl a služby v globálně konkurenceschopná odvětví." # todo: NEW TRANSLATION
 ALG_russian_inv: "Ruská hospodářská spolupráce" # todo: NEW TRANSLATION
 ALG_russian_inv_desc: "Rusko je dlouhodobým strategickým spojencem v energetice a obraně. Rozšíření spolupráce na širší ekonomické projekty posílí naši průmyslovou a vojenskou základnu." # todo: NEW TRANSLATION
 ALG_iran_inv: "Partnerství s Íránem" # todo: NEW TRANSLATION
 ALG_iran_inv_desc: "Alžírsko a Írán sdílejí historii neangažovanosti a odporu vůči zahraniční nadvládě. Rozšíření vztahů s Teheránem by mohlo otevřít nové možnosti energetické spolupráce, průmyslových projektů a regionální diplomacie, přestože to může vyvolat obavy západních partnerů." # todo: NEW TRANSLATION
 ALG_italia_inv: "Posílení italských vazeb" # todo: NEW TRANSLATION
 ALG_italia_inv_desc: "Itálie je jedním z nejbližších evropských partnerů Alžírska, zejména díky roli společnosti ENI v našem energetickém sektoru. Prohloubením spolupráce s Římem můžeme zajistit klíčové investice do infrastruktury, podpořit středomořský obchod a posílit své postavení hlavního dodavatele energie pro Evropu." # todo: NEW TRANSLATION
 ALG_algiers_metro_expansion: "Rozšířit metro v Alžíru" # todo: NEW TRANSLATION
 ALG_algiers_metro_expansion_desc: "Alžír trpí dopravními zácpami a zastaralou infrastrukturou. Rozšíření systému metra nejen modernizuje dopravu, ale také vyšle investorům i občanům signál o pokroku." # todo: NEW TRANSLATION
 ALG_cevital_group_expansion: "Rozšíření skupiny Cevital" # todo: NEW TRANSLATION
 ALG_cevital_group_expansion_desc: "Cevital, přední alžírský koncern, má potenciál stát se kontinentální velmocí. Podpora jeho růstu vytvoří pracovní místa a urychlí průmyslovou modernizaci." # todo: NEW TRANSLATION
 ALG_scientific_research_push: "Podpora vědeckého výzkumu" # todo: NEW TRANSLATION
 ALG_scientific_research_push_desc: "Inovace je klíčem k dlouhodobému růstu. Investicemi do vědeckého výzkumu může Alžírsko položit základy ekonomiky založené na znalostech." # todo: NEW TRANSLATION
 ALG_expand_higher_education: "Rozšíření vysokoškolského vzdělávání" # todo: NEW TRANSLATION
 ALG_expand_higher_education_desc: "Univerzity a technické školy musí být rozšířeny a modernizovány, aby dokázaly naplnit požadavky 21. století. Vzdělanější obyvatelstvo posílí společnost i ekonomiku." # todo: NEW TRANSLATION
 ALG_digitalize_education: "Digitalizace vzdělávání" # todo: NEW TRANSLATION
 ALG_digitalize_education_desc: "Digitální platformy, online výuka a integrace informačních technologií způsobí revoluci v alžírském školství a vytvoří kvalifikovanější a přizpůsobivější pracovní sílu." # todo: NEW TRANSLATION
 ALG_national_research_program: "Zahájení národního výzkumného programu" # todo: NEW TRANSLATION
 ALG_national_research_program_desc: "Koordinovaný národní výzkumný program propojí univerzity, průmysl a vládu a umožní Alžírsku držet krok s globálním technologickým pokrokem." # todo: NEW TRANSLATION
 ALG_industry: "Rozšíření alžírského průmyslu" # todo: NEW TRANSLATION
 ALG_industry_desc: "Alžírský průmysl musí být diverzifikován a modernizován. Podporou průmyslového růstu můžeme snížit závislost na uhlovodících a vytvořit vyváženější ekonomiku." # todo: NEW TRANSLATION
 ALG_constantine_hub: "Rozvoj konstantinského průmyslového centra" # todo: NEW TRANSLATION
 ALG_constantine_hub_desc: "Město Konstantina je významným regionálním centrem. Investice zde vytvoří nové průmyslové centrum, které rozšíří růst mimo Alžír." # todo: NEW TRANSLATION
 ALG_tlemcen_agro_industry: "Podpora zemědělsko-potravinářského průmyslu v Tlemcenu" # todo: NEW TRANSLATION
 ALG_tlemcen_agro_industry_desc: "Zemědělství a zpracování potravin v Tlemcenu lze rozvinout v mocné zemědělsko-průmyslové odvětví, které uživí národ a vytvoří pracovní místa." # todo: NEW TRANSLATION
 ALG_snvi_modernization: "Modernizace SNVI" # todo: NEW TRANSLATION
 ALG_snvi_modernization_desc: "SNVI, alžírský národní výrobce vozidel, musí být modernizován, aby mohl konkurovat na světovém trhu. Rozšíření výrobní kapacity posílí naši dopravní a průmyslovou základnu." # todo: NEW TRANSLATION
 ALG_annaba_steel_complex: "Ocelárenský komplex v Annábě" # todo: NEW TRANSLATION
 ALG_annaba_steel_complex_desc: "V Annábě se nachází největší alžírská ocelárna. Její modernizace a rozšíření poskytnou základ budoucím infrastrukturním a obranným odvětvím." # todo: NEW TRANSLATION
 ALG_arzew_refinery: "Rozšíření arzewské rafinerie" # todo: NEW TRANSLATION
 ALG_arzew_refinery_desc: "Rafinerie v Arzewu je zásadním článkem našeho energetického exportu. Rozšíření její kapacity zajistí příliv zahraniční měny a posílí dominanci Sonatrachu." # todo: NEW TRANSLATION
 ALG_pipeline_modernization: "Modernizace potrubí" # todo: NEW TRANSLATION
 ALG_pipeline_modernization_desc: "Moderní potrubní systém je nezbytný pro bezpečný a efektivní vývoz energie. Modernizace našich potrubí zabrání ztrátám a zlepší mezinárodní spolehlivost." # todo: NEW TRANSLATION
 ALG_skikda_port_modernization: "Modernizace přístavu Skikda" # todo: NEW TRANSLATION
 ALG_skikda_port_modernization_desc: "Přístav Skikda je klíčový pro obchod a vývoz energie. Modernizace jeho zařízení zajistí, že Alžírsko zůstane konkurenceschopným námořním centrem." # todo: NEW TRANSLATION
 ALG_grant_foreign_energy_concessions: "Udělení zahraničních energetických koncesí" # todo: NEW TRANSLATION
 ALG_grant_foreign_energy_concessions_desc: "Udělením vybraných koncesí zahraničním společnostem může Alžírsko přilákat kapitál a technologie, ovšem za cenu rizika částečného oslabení své energetické nezávislosti." # todo: NEW TRANSLATION
 ALG_hassi_messaoud_expansion: "Rozšíření ropného pole Hassi Messaoud" # todo: NEW TRANSLATION
 ALG_hassi_messaoud_expansion_desc: "Ropné pole Hassi Messaoud je největší v Alžírsku. Rozšíření těžební a rafinérské kapacity výrazně zvýší naši energetickou produkci." # todo: NEW TRANSLATION
 ALG_expand_sonatrach: "Rozšíření Sonatrachu" # todo: NEW TRANSLATION
 ALG_expand_sonatrach_desc: "Sonatrach je srdcem alžírské ekonomiky. Posílení této společnosti zajistí naši globální úlohu v těžbě ropy a zemního plynu." # todo: NEW TRANSLATION
 ALG_protect_oil_gas_facilities: "Ochrana ropných a plynových zařízení" # todo: NEW TRANSLATION
 ALG_protect_oil_gas_facilities_desc: "Naše energetická infrastruktura je v dobách války či nepokojů zranitelná. Posílení obrany ropných a plynových zařízení je zásadní pro národní bezpečnost." # todo: NEW TRANSLATION
 ALG_minister_of_agriculture_reforms: "Program zemědělské reformy" # todo: NEW TRANSLATION
 ALG_minister_of_agriculture_reforms_desc: "Léta zanedbávání oslabila alžírské zemědělství. Nové reformy pod vedením ministerstva zemědělství obnoví produktivitu a sníží závislost na dovozu potravin." # todo: NEW TRANSLATION
 ALG_modernize_agricultural_sector: "Modernizace zemědělského sektoru" # todo: NEW TRANSLATION
 ALG_modernize_agricultural_sector_desc: "Léta konfliktů a zanedbávání zanechala alžírské farmy zastaralé a neefektivní. Mechanizace, zavlažovací systémy a dotace oživí zemědělský sektor a zajistí potravinovou bezpečnost našeho lidu." # todo: NEW TRANSLATION
 ALG_rural_development_program: "Program rozvoje venkova" # todo: NEW TRANSLATION
 ALG_rural_development_program_desc: "Alžírské vesnice dlouhodobě trpí nedostatkem investic. Přesměrováním prostředků do venkovské infrastruktury, energetiky a pracovních míst snížíme nerovnost mezi městy a venkovem a posílíme národní jednotu." # todo: NEW TRANSLATION
 ALG_promote_algerian_produce: "Podpora alžírské produkce" # todo: NEW TRANSLATION
 ALG_promote_algerian_produce_desc: "Naše půda poskytuje širokou škálu plodin a přírodních produktů, avšak místním trhům dominují zahraniční dovozy. Pomocí značek, dotací a obchodních pobídek zvýšíme prestiž alžírského zboží doma i v zahraničí." # todo: NEW TRANSLATION
 ALG_build_farm_to_market_roads: "Silnice z farem na trhy" # todo: NEW TRANSLATION
 ALG_build_farm_to_market_roads_desc: "Zemědělci potřebují lepší přístup ke spotřebitelům a exportním trasám. Výstavba silnic z venkovských oblastí do městských center a přes tuniské hranice posílí naše zemědělství i regionální vazby." # todo: NEW TRANSLATION
 ALG_new_agro_industrial_complexes: "Nové zemědělsko-průmyslové komplexy" # todo: NEW TRANSLATION
 ALG_new_agro_industrial_complexes_desc: "Alžírsko musí propojit zemědělství s moderním průmyslem. Výstavbou zemědělsko-průmyslových komplexů můžeme vytvářet produkty s vyšší přidanou hodnotou, pracovní místa a zvyšovat příjmy na venkově." # todo: NEW TRANSLATION
 ALG_invest_tourism: "Investice do cestovního ruchu" # todo: NEW TRANSLATION
 ALG_invest_tourism_desc: "Cestovní ruch v Alžírsku kdysi vzkvétal, než válečná léta odradila návštěvníky. Opatrnými investicemi a zlepšením bezpečnosti můžeme začít obnovovat toto životně důležité odvětví." # todo: NEW TRANSLATION
 ALG_restore_hotel_resorts: "Obnova hotelových resortů" # todo: NEW TRANSLATION
 ALG_restore_hotel_resorts_desc: "Mnoho alžírských resortů a hotelů leží v troskách nebo chátrá. Jejich renovace pomůže přilákat zahraniční návštěvníky a poskytne domácí pracovní místa." # todo: NEW TRANSLATION
 ALG_blida_airbase_modernization: "Modernizace letecké základny Blída" # todo: NEW TRANSLATION
 ALG_blida_airbase_modernization_desc: "Letecká základna Blída je klíčovým zařízením pro civilní dopravu i vojenskou přepravu. Její modernizace zlepší propojení Alžírska a podpoří regionální obchod." # todo: NEW TRANSLATION
 ALG_algiers_oran_highway: "Dálnice Alžír–Oran" # todo: NEW TRANSLATION
 ALG_algiers_oran_highway_desc: "Propojení Alžíru s Oranem moderní dálnicí zkrátí přepravní časy, podpoří obchod a posílí hospodářskou páteř Alžírska." # todo: NEW TRANSLATION
 ALG_east_west_highway_project: "Projekt východo-západní dálnice" # todo: NEW TRANSLATION
 ALG_east_west_highway_project_desc: "Východo-západní dálnice, táhnoucí se napříč celým Alžírskem, bude jedním z největších infrastrukturních projektů v Africe. Propojí naše regiony a podnítí obchod." # todo: NEW TRANSLATION
 ALG_ski_resorts_of_tikjda: "Lyžařské resorty v Tikjdě" # todo: NEW TRANSLATION
 ALG_ski_resorts_of_tikjda_desc: "V kabylských horách leží Tikjda, resort s nevyužitým potenciálem. Modernizace jeho zařízení a podpora zimního cestovního ruchu diverzifikují hospodářskou základnu Alžírska." # todo: NEW TRANSLATION
 ALG_north_african_tourism_hub: "Centrum severoafrického cestovního ruchu" # todo: NEW TRANSLATION
 ALG_north_african_tourism_hub_desc: "Investicemi do našich pobřeží, kulturního dědictví a přírodní krajiny se Alžírsko může stát přední turistickou destinací v severní Africe a konkurovat našim středomořským sousedům." # todo: NEW TRANSLATION
 ALG_it_investments: "Investice do IT" # todo: NEW TRANSLATION
 ALG_it_investments_desc: "Vzhledem k rychlosti vývoje IT technologií se bez nich v budoucnu neobejdeme. Je tedy nejvyšší čas do tohoto odvětví investovat." # todo: NEW TRANSLATION
 ALG_infrastructure_investments: "Investice do infrastruktury" # todo: NEW TRANSLATION
 ALG_infrastructure_investments_desc: "Naše infrastruktura je po 90. letech v žalostném stavu. Je nejvyšší čas ji obnovit." # todo: NEW TRANSLATION
 ALG_science_idea: "Alžírská věda a vzdělávání" # todo: NEW TRANSLATION
 ALG_fuel: "Alžírské palivo" # todo: NEW TRANSLATION
 ALG_dziri: "Dziri" # todo: NEW TRANSLATION
 ALG_dziri_desc: "Alžírsko musí řešit naléhavé společenské otázky: od tradic a islámu po práva Amazighů a demokratické reformy. Cesta, kterou zvolíme, utváří národ." # todo: NEW TRANSLATION
 ALG_traditions_matter: "Na tradicích záleží" # todo: NEW TRANSLATION
 ALG_traditions_matter_desc: "Alžírský lid pevně lpí na víře, rodině a národní identitě. Naše vláda musí tyto tradice respektovat, pokud si chceme zachovat legitimitu." # todo: NEW TRANSLATION
 ALG_restrict_women_roles: "Zachování rodinného zákoníku" # todo: NEW TRANSLATION
 ALG_restrict_women_roles_desc: "Konzervativní představitelé tvrdí, že úloha žen by měla zůstat zaměřena na rodinu. Reforma rodinného zákoníku by mohla rozzlobit náboženské autority i veřejnost." # todo: NEW TRANSLATION
 ALG_expand_berber_rights: "Uznání práv Amazighů" # todo: NEW TRANSLATION
 ALG_expand_berber_rights_desc: "Hnutí za berberskou identitu požaduje úplné kulturní a jazykové uznání. Přiznání práv Amazighům by zmírnilo napětí, ale mohlo by odcizit zastánce tvrdé linie." # todo: NEW TRANSLATION
 ALG_censor_internet: "Cenzura internetu" # todo: NEW TRANSLATION
 ALG_censor_internet_desc: "Sociální média a online aktivismus podnítily protesty. Omezení online svobod obnoví státní kontrolu, ale poškodí náš mezinárodní obraz." # todo: NEW TRANSLATION
 ALG_open_civil_society: "Otevření občanské společnosti" # todo: NEW TRANSLATION
 ALG_open_civil_society_desc: "Demokratické síly tlačí na svobodnou občanskou společnost, nevládní organizace a sdružení Hiraku. Otevření tohoto prostoru posílí legitimitu, ale hrozí politickou fragmentací." # todo: NEW TRANSLATION
 ALG_integration_policy: "Integrační politika" # todo: NEW TRANSLATION
 ALG_integration_policy_desc: "Migranti ze subsaharské Afriky a vracející se diaspora čelí problémům. Strukturovaná integrační politika může snížit společenské napětí a podpořit soudržnost." # todo: NEW TRANSLATION
 ALG_marriage_subsidies: "Dotace na sňatky" # todo: NEW TRANSLATION
 ALG_marriage_subsidies_desc: "Mladí lidé mají potíže uzavírat sňatky a zakládat rodiny. Dotace na bydlení a svatby stabilizují společnost a podpoří zakládání rodin." # todo: NEW TRANSLATION
 ALG_constitutionalize_rights: "Zakotvení práv v ústavě" # todo: NEW TRANSLATION
 ALG_constitutionalize_rights_desc: "Občanské svobody, práva žen a uznání Amazighů můžeme prostřednictvím ústavní reformy trvale zakotvit. To by signalizovalo trvalou společenskou změnu." # todo: NEW TRANSLATION
 ALG_berber_right: "Uznání Amazighů" # todo: NEW TRANSLATION
 ALG_berber_right_desc: "Identita Amazighů byla oficiálně uznána, což posílilo stabilitu v regionech s berberskou většinou." # todo: NEW TRANSLATION
 Algeria.238.t: "Stabilizace Mali" # todo: NEW TRANSLATION
 Algeria.238.d: "Probíhající konflikt v Mali ohrožuje destabilizací celý region Sahelu. Tuáregští separatisté a džihádistické skupiny vytvořili bezpečnostní krizi na naší jižní hranici. Alžírsko si nemůže dovolit zůstat pasivní, zatímco se nestabilita šíří. Musíme se rozhodnout, zda podpoříme malijskou vládu při obnově pořádku, nebo zahájíme jednání s tuáregskými frakcemi v naději na trvalé urovnání." # todo: NEW TRANSLATION
 Algeria.238.a: "Podpořit malijskou vládu" # todo: NEW TRANSLATION
 Algeria.238.b: "Poskytnout podporu tuáregským silám" # todo: NEW TRANSLATION
 ALG_us_invest_tt: "Vyhledat americké investice v Alžírsku" # todo: NEW TRANSLATION
 ALG_fra_invest_tt: "Vyhledat francouzské investice v Alžírsku" # todo: NEW TRANSLATION
 ALG_eng_invest_tt: "Vyhledat anglické investice v Alžírsku" # todo: NEW TRANSLATION
 ALG_chi_invest_tt: "Vyhledat čínské investice v Alžírsku" # todo: NEW TRANSLATION
 ALG_rus_invest_tt: "Vyhledat ruské investice v Alžírsku" # todo: NEW TRANSLATION
 ALG_open_to_west: "Otevření Západu" # todo: NEW TRANSLATION
 ALG_open_to_west_desc: "Alžírsko dlouhodobě usilovalo o neutralitu, ale časy se mění. Užší spojení se západním světem by nám mohlo přinést stabilitu, bezpečnost a investiční příležitosti." # todo: NEW TRANSLATION
 ALG_nato_partnership: "Partnerství s NATO" # todo: NEW TRANSLATION
 ALG_nato_partnership_desc: "Prozkoumáme strukturovanou spolupráci s NATO. Toto partnerství posílí mezinárodní postavení Alžírska a pomůže modernizovat naše ozbrojené síly." # todo: NEW TRANSLATION
 ALG_energy_partnership_eu: "Energetické partnerství s EU" # todo: NEW TRANSLATION
 ALG_energy_partnership_eu_desc: "Obrovské energetické zásoby Alžírska jsou v Evropě velmi žádané. Navázáním energetických partnerství s Francií a Spojeným královstvím můžeme zajistit lukrativní smlouvy a dlouhodobé investice." # todo: NEW TRANSLATION
 ALG_strengthen_eu_trade: "Posílení obchodních vztahů s EU" # todo: NEW TRANSLATION
 ALG_strengthen_eu_trade_desc: "Evropa zůstává naším největším obchodním partnerem. Posílení těchto ekonomických vazeb stabilizuje náš exportní trh a dále začlení Alžírsko do globálního obchodu." # todo: NEW TRANSLATION
 ALG_expand_us_partnership: "Rozšíření partnerství s USA" # todo: NEW TRANSLATION
 ALG_expand_us_partnership_desc: "Spojené státy usilují o stabilitu v severní Africe. Rozšířením hospodářské a bezpečnostní spolupráce s Washingtonem může Alžírsko přilákat investice a získat mocného spojence." # todo: NEW TRANSLATION
 ALG_become_nato_ally: "Stát se spojencem NATO" # todo: NEW TRANSLATION
 ALG_become_nato_ally_desc: "Ačkoli by plné členství v NATO mohlo být předčasné, Alžírsko může získat status důvěryhodného spojence. To by nám poskytlo přístup k vojenským znalostem, společným cvičením a diplomatickému vlivu." # todo: NEW TRANSLATION
 ALG_exchange_research_with_nato: "Výměna výzkumu s NATO" # todo: NEW TRANSLATION
 ALG_exchange_research_with_nato_desc: "Vědecká spolupráce se spojenci v NATO umožní Alžírsku těžit ze společného výzkumu, sdílení vojenských technologií a modernizace našich vzdělávacích a výzkumných institucí." # todo: NEW TRANSLATION
 ALG_get_nato_military_exp: "Získání vojenských zkušeností NATO" # todo: NEW TRANSLATION
 ALG_get_nato_military_exp_desc: "Rozsáhlý vojenský výcvik a doktrína NATO nabízejí cenné znalosti. Alžírské ozbrojené síly se modernizují prostřednictvím společných cvičení a strategického vedení." # todo: NEW TRANSLATION
 ALG_counterterrorism_coordination: "Koordinace boje proti terorismu" # todo: NEW TRANSLATION
 ALG_counterterrorism_coordination_desc: "Terorismus zůstává v severní Africe významnou hrozbou. Koordinací s zpravodajskými a protiteroristickými jednotkami NATO může Alžírsko posílit domácí bezpečnost i regionální stabilitu." # todo: NEW TRANSLATION
 ALG_get_investements_from_nato: "Přilákání investic NATO" # todo: NEW TRANSLATION
 ALG_get_investements_from_nato_desc: "Naše sbližování s NATO přiláká od členských zemí ekonomickou podporu a infrastrukturní projekty a zajistí dlouhodobé přínosy pro alžírskou ekonomiku." # todo: NEW TRANSLATION
 ALG_strengthen_democratic_norms: "Posílení demokratických norem" # todo: NEW TRANSLATION
 ALG_strengthen_democratic_norms_desc: "Pro úplné začlenění do západního světa musí Alžírsko posílit demokratické instituce. To zahrnuje ochranu občanských svobod, podporu pluralismu a povzbuzení politických reforem." # todo: NEW TRANSLATION
 ALG_seek_greater_influence_in_wto: "Snaha o větší vliv ve WTO" # todo: NEW TRANSLATION
 ALG_seek_greater_influence_in_wto_desc: "S rozvojem Alžírska musíme rozšířit svou úlohu ve Světové obchodní organizaci a zajistit, aby byl náš hlas slyšet v globálních ekonomických jednáních." # todo: NEW TRANSLATION
 ALG_seek_security_council_seat: "Snaha o křeslo v Radě bezpečnosti OSN" # todo: NEW TRANSLATION
 ALG_seek_security_council_seat_desc: "Diplomatická historie Alžírska a jeho mírové mise nám dávají silné argumenty pro trvalé zastoupení v Radě bezpečnosti OSN. Musíme o tento cíl usilovat." # todo: NEW TRANSLATION
 ALG_join_nato: "Vstup do NATO" # todo: NEW TRANSLATION
 ALG_join_nato_desc: "Po desetiletích neutrality a opatrného balancování se Alžírsko připravuje na historický krok: plné členství v NATO. Toto rozhodnutí upevní naše místo mezi západními mocnostmi a přetvoří naši zahraniční politiku." # todo: NEW TRANSLATION
 ALG_global_companies: "Pozvání globálních korporací" # todo: NEW TRANSLATION
 ALG_global_companies_desc: "Otevřením našich trhů zahraničním investorům může Alžírsko přilákat globální korporace, aby v naší ekonomice založily své pobočky. To podpoří průmyslový růst, transfer technologií a mezinárodní prestiž." # todo: NEW TRANSLATION
 ALG_huawei: "Telekomunikace Huawei" # todo: NEW TRANSLATION
 ALG_huawei_desc: "Huawei nabídla vybudování pokročilé telekomunikační infrastruktury v Alžírsku, čímž nám poskytne moderní digitální páteř a upevní naši úlohu v informačním věku." # todo: NEW TRANSLATION
 ALG_hyundai: "Průmyslové rozšíření Hyundai" # todo: NEW TRANSLATION
 ALG_hyundai_desc: "Hyundai projevil zájem o investice do alžírského automobilového a průmyslového sektoru. Přijetím jejich továren můžeme podpořit zaměstnanost a technologický rozvoj." # todo: NEW TRANSLATION
 ALG_weapons_expert: "Zahraniční odborné znalosti v oblasti zbraní" # todo: NEW TRANSLATION
 ALG_weapons_expert_desc: "Spoluprací se zahraničními obrannými firmami může Alžírsko získat nové znalosti v oblasti podpůrných zbraní a taktických systémů a posílit své pozemní síly." # todo: NEW TRANSLATION
 ALG_airburst_weapons: "Vývoj zbraní s vzdušným výbuchem" # todo: NEW TRANSLATION
 ALG_airburst_weapons_desc: "Technologie vzdušného výbuchu umožňuje pěchotě zasahovat nepřátele ukryté za překážkami nebo v opevněných pozicích. Investice do tohoto špičkového systému výrazně zvýší naši účinnost na bojišti." # todo: NEW TRANSLATION
 ALG_vehicle_industry: "Rozšíření automobilového průmyslu" # todo: NEW TRANSLATION
 ALG_vehicle_industry_desc: "Partnerstvím s globálními výrobci automobilů a průmyslovými firmami může Alžírsko vybudovat silný průmysl vojenských i civilních vozidel a podpořit obranu i ekonomiku." # todo: NEW TRANSLATION
 ALG_advanced_ultility_vehicle: "Pokročilá užitková vozidla" # todo: NEW TRANSLATION
 ALG_advanced_ultility_vehicle_desc: "Náš automobilový sektor musí přejít k pokročilému vývoji. Výroba moderních a spolehlivých užitkových vozidel posílí logistiku a efektivitu dopravy." # todo: NEW TRANSLATION
 ALG_sat_tech: "Spolupráce v oblasti satelitních technologií" # todo: NEW TRANSLATION
 ALG_sat_tech_desc: "Díky partnerství s globálními firmami může Alžírsko vyvinout pokročilé satelitní technologie a zlepšit své sledovací, komunikační a polohovací systémy." # todo: NEW TRANSLATION
 ALG_advanced_radar: "Pokročilé radarové systémy" # todo: NEW TRANSLATION
 ALG_advanced_radar_desc: "Moderní radarové a detekční technologie poskytnou Alžírsku lepší obranné schopnosti a umožní jeho začlenění do pokročilých regionálních bezpečnostních struktur." # todo: NEW TRANSLATION
 ALG_microsoft: "Digitální infrastruktura Microsoftu" # todo: NEW TRANSLATION
 ALG_microsoft_desc: "Partnerstvím se společností Microsoft může Alžírsko modernizovat své IT a softwarové sektory, posílit kybernetickou bezpečnost, digitální správu a technologicky řízený růst." # todo: NEW TRANSLATION
 ALG_Lenovo: "Technologické investice Lenova" # todo: NEW TRANSLATION
 ALG_Lenovo_desc: "Lenovo má zájem rozšířit svou přítomnost v Alžírsku. Spolupráce s touto společností posílí náš průmysl počítačového hardwaru a podpoří technologické inovace." # todo: NEW TRANSLATION
 ALG_Danone: "Rozšíření potravinářského průmyslu Danone" # todo: NEW TRANSLATION
 ALG_Danone_desc: "Přijetí investic společnosti Danone do alžírského potravinářského sektoru podpoří výživu, standardy výroby potravin a mezinárodní obchodní vztahy." # todo: NEW TRANSLATION
 ALG_toyota: "Průmyslové partnerství s Toyotou" # todo: NEW TRANSLATION
 ALG_toyota_desc: "Pozváním Toyoty k založení průmyslových a automobilových závodů může Alžírsko zvýšit výrobu vozidel, vytvořit pracovní místa a podpořit technologický pokrok v automobilovém sektoru." # todo: NEW TRANSLATION
 ALG_align_with_south_africa: "Spojit se s Jihoafrickou republikou" # todo: NEW TRANSLATION
 ALG_align_with_south_africa_desc: "Jihoafrická republika hraje vedoucí úlohu v afrických politických a ekonomických záležitostech. Posílením našeho partnerství můžeme koordinovat obchodní, diplomatickou a bezpečnostní politiku napříč kontinentem." # todo: NEW TRANSLATION
 ALG_open_to_east: "Otevřít se Východu" # todo: NEW TRANSLATION
 ALG_open_to_east_desc: "Obrácení k Východu zpestří naše partnerství, sníží závislost na Západu a odemkne příležitosti na trzích, jako jsou Rusko, Čína a další vzmáhající se mocnosti." # todo: NEW TRANSLATION
 ALG_expand_trade_with_russia: "Rozšířit obchod s Ruskem" # todo: NEW TRANSLATION
 ALG_expand_trade_with_russia_desc: "Rusko nabízí Alžírsku nové příležitosti v energetice, zbrojním průmyslu a průmyslové spolupráci. Posílení našich obchodních vazeb prohloubí strategické vztahy." # todo: NEW TRANSLATION
 ALG_expand_trade_with_china: "Rozšířit obchod s Čínou" # todo: NEW TRANSLATION
 ALG_expand_trade_with_china_desc: "Čína má zájem investovat v Africe a nabízí Alžírsku výhodné obchodní dohody. Tato spolupráce by nám mohla zajistit infrastrukturu a průmyslový rozvoj." # todo: NEW TRANSLATION
 ALG_mediterranean_corridor_initiative: "Iniciativa středomořského koridoru" # todo: NEW TRANSLATION
 ALG_mediterranean_corridor_initiative_desc: "Užším propojením naší ekonomiky se středomořskými a východními trhy se Alžírsko může etablovat jako klíčový koridor pro obchod a infrastrukturní projekty." # todo: NEW TRANSLATION
 ALG_Investments_From_East: "Východní investice" # todo: NEW TRANSLATION
 ALG_Investments_From_East_desc: "Přilákání investorů z Východu posílí naši ekonomiku, poskytne nová průmyslová odvětví a zajistí, že Alžírsko bude těžit z diverzifikovaných zdrojů kapitálu." # todo: NEW TRANSLATION
 ALG_eastern_alignment: "Východní orientace" # todo: NEW TRANSLATION
 ALG_eastern_alignment_desc: "Užší orientace na Rusko, Čínu a jejich spojence poskytne Alžírsku nové partnery v oblasti bezpečnosti, obchodu a technologií a zároveň omezí západní vliv." # todo: NEW TRANSLATION
 ALG_china_civ: "Čínské civilní investice" # todo: NEW TRANSLATION
 ALG_china_civ_desc: "Čínské společnosti jsou připraveny expandovat do alžírských civilních odvětví. Tyto projekty vytvoří pracovní místa a urychlí modernizaci." # todo: NEW TRANSLATION
 ALG_china_civ2: "Další čínské civilní projekty" # todo: NEW TRANSLATION
 ALG_china_civ2_desc: "Po úspěchu dřívějších projektů Čína nabízí další investice k ještě výraznějšímu rozšíření alžírské civilní průmyslové základny." # todo: NEW TRANSLATION
 ALG_chinese_armor_deal: "Dohoda o čínské obrněné technice" # todo: NEW TRANSLATION
 ALG_chinese_armor_deal_desc: "Čína navrhla prodej obrněných vozidel a technologických balíčků Alžírsku. Tato dohoda zlepší naše pozemní síly a prohloubí obranné vazby." # todo: NEW TRANSLATION
 ALG_joint_military_exercise_with_rus: "Společná vojenská cvičení s Ruskem" # todo: NEW TRANSLATION
 ALG_joint_military_exercise_with_rus_desc: "Prováděním společných cvičení s Ruskem Alžírsko zlepší vojenskou koordinaci a poučí se z ruských bojových zkušeností." # todo: NEW TRANSLATION
 ALG_russia_inf_tech: "Ruské technologie pěchoty" # todo: NEW TRANSLATION
 ALG_russia_inf_tech_desc: "Ruské odborné znalosti v oblasti ručních zbraní a pěchotní taktiky lze přizpůsobit alžírským potřebám a poskytnout našim vojákům lepší vybavení a výcvik." # todo: NEW TRANSLATION
 ALG_russia_experience: "Obranná spolupráce s Moskvou" # todo: NEW TRANSLATION
 ALG_russia_experience_desc: "Prohloubení vojenské spolupráce s Ruskem přivede do Alžírska zkušené poradce a výcvikové programy. Naše ozbrojené síly vyjdou silnější a lépe připravené." # todo: NEW TRANSLATION
 ALG_idea_parliamentary_republic: "Majlis al-Watani al-Shaabi" # todo: NEW TRANSLATION
 ALG_idea_presidential_republic: "Prezidentský systém" # todo: NEW TRANSLATION
 ALG_idea_semi_presidential_republic: "Al-Jumhorya al-Democratia al-Shaabia" # todo: NEW TRANSLATION
 ALG_release_political_pirsoners: "Propustit politické vězně" # todo: NEW TRANSLATION
 ALG_release_political_pirsoners_desc: "Aby národ otevřel novou kapitolu, nová vláda propustí osoby zadržované z politických důvodů během let nepokojů. Tento akt milosti má podpořit národní jednotu a obnovit důvěru mezi lidem a státem." # todo: NEW TRANSLATION
 ALG_al_jazair_al_djadida: "Al-Jazair Al-Djadida" # todo: NEW TRANSLATION
 ALG_al_jazair_al_djadida_desc: "Slib prezidenta Abdelmadjida Tebbounea o „Novém Alžírsku“ usiluje o obnovení legitimity státu prostřednictvím ústavních a správních reforem, posílení demokratických institucí a důvěry veřejnosti." # todo: NEW TRANSLATION
 ALG_republic_of_algeria: "Alžírská republika" # todo: NEW TRANSLATION
 ALG_republic_of_algeria_desc: "Po položení základů reforem Alžírsko znovu potvrzuje svou identitu republiky vedené národní suverenitou, sociální spravedlností a vůlí svých občanů." # todo: NEW TRANSLATION
 ALG_majlis_al_watani_al_shaabi: "Majlis al-Watani al-Shaabi" # todo: NEW TRANSLATION
 ALG_majlis_al_watani_al_shaabi_desc: "Parlamentní republika by svěřila vedení národa do rukou volených zástupců lidu, omezila převahu výkonné moci a zajistila kolektivní rozhodování." # todo: NEW TRANSLATION
 ALG_jumhorya_democratia_shaabia: "Al-Jumhorya al-Democratia al-Shaabia" # todo: NEW TRANSLATION
 ALG_jumhorya_democratia_shaabia_desc: "Udržení poloprezidentské rovnováhy mezi výkonnou a zákonodárnou mocí by mohlo stabilizovat alžírskou transformaci, zabránit návratu autoritářství a zároveň zajistit rozhodné vládnutí." # todo: NEW TRANSLATION
 ALG_corrupt_successor_flag: "Dosazen loajalistický nástupce" # todo: NEW TRANSLATION
 ALG_deep_state_republic: "Republika hlubokého státu" # todo: NEW TRANSLATION
 ALG_deep_state_republic_desc: "Za fasádou reforem vzniká nová mocenská struktura. Bývalí generálové, podnikatelé a byrokraté upevňují kontrolu v zákulisí. Tato „republika hlubokého státu“ udržuje iluzi demokracie a zároveň chrání své sítě vlivu a korupce." # todo: NEW TRANSLATION
 ALG_tamazgha: "Sen o Tamazghe" # todo: NEW TRANSLATION
 ALG_tamazgha_desc: "Nastal čas znovuzrození Tamazghy, země Amazighů rozprostírající se od Atlantiku až k Nilu. Pod praporem svobody a jednoty vychází nad severní Afrikou nový úsvit." # todo: NEW TRANSLATION
 ALG_tamazgha_path: "Následovat vizi Tamazghy" # todo: NEW TRANSLATION
 ALG_our_land: "Naše posvátná země" # todo: NEW TRANSLATION
 ALG_our_land_desc: "Náš lid musí znovu získat a obnovit země, které nám vždy patřily. Průmysl, pracovní síla a odvaha budou základem naší znovuzrozené vlasti." # todo: NEW TRANSLATION
 ALG_expand_our_army: "Rozšířit naši armádu" # todo: NEW TRANSLATION
 ALG_expand_our_army_desc: "Obrana Tamazghy závisí na síle naší armády. Musíme vycvičit, vyzbrojit a rozšířit naše síly, abychom ochránili nový národ před jeho mnoha nepřáteli." # todo: NEW TRANSLATION
 ALG_berber_of_tunisia: "Berbeři v Tunisku" # todo: NEW TRANSLATION
 ALG_berber_of_tunisia_desc: "Naši amazighští bratři v Tunisku jsou již dlouho pod cizí nadvládou. Nastal čas sjednotit je pod vlajkou Tamazghy a osvobodit jejich země." # todo: NEW TRANSLATION
 ALG_libya_invasion: "Invaze do Libye" # todo: NEW TRANSLATION
 ALG_libya_invasion_desc: "Od písků Sahary až po břehy Tripolisu je Libye právoplatnou součástí naší kulturní vlasti. Musíme ji začlenit do Tamazghy." # todo: NEW TRANSLATION
 ALG_take_egypt: "Tažení do Egypta" # todo: NEW TRANSLATION
 ALG_take_egypt_desc: "Egypt drží klíč k východní hranici Tamazghy. Jeho rozsáhlé zdroje a strategický význam z něj činí zásadní součást naší vize." # todo: NEW TRANSLATION
 ALG_canary_island: "Zmocnit se Kanárských ostrovů" # todo: NEW TRANSLATION
 ALG_canary_island_desc: "Kanárské ostrovy kdysi obývali Amazighové, Guanchové. Vrátíme tyto ostrovy pod amazighskou suverenitu." # todo: NEW TRANSLATION
 ALG_take_niger: "Vznést nárok na Niger" # todo: NEW TRANSLATION
 ALG_take_niger_desc: "Tuaregové v Nigeru jsou krví i dědictvím Amazighové. Jejich pouště se znovu připojí k velké federaci Tamazghy." # todo: NEW TRANSLATION
 ALG_rif_in_morocco: "Ríf v Maroku" # todo: NEW TRANSLATION
 ALG_rif_in_morocco_desc: "Pohoří Ríf dalo vzniknout hrdinům, kteří odolávali kolonialismu. Jejich statečnost nás inspiruje ke sjednocení Maroka pod amazighskou věcí." # todo: NEW TRANSLATION
 ALG_demand_mali: "Požadovat Mali" # todo: NEW TRANSLATION
 ALG_demand_mali_desc: "Země Mali, bohaté na historii a kulturu, byly kdysi součástí velkých amazighských říší. Nastal čas obnovit náš vliv v Sahelu." # todo: NEW TRANSLATION
 ALG_demand_mauritania: "Požadovat Mauritánii" # todo: NEW TRANSLATION
 ALG_demand_mauritania_desc: "Pouště Mauritánie ukrývají amazighské kořeny sahající hluboko do naší minulosti. Její sjednocení s Tamazghou je dalším krokem v našem kontinentálním osudu." # todo: NEW TRANSLATION
 ALG_TAM_unite_tamazgha: "Sjednotit Tamazghu" # todo: NEW TRANSLATION
 ALG_TAM_unite_tamazgha_desc: "Všechny amazighské země musí být sjednoceny pod jedním praporem. Sen o Tamazghe již není vizí, ale posláním, které naplníme." # todo: NEW TRANSLATION
 ALG_expand_more: "Rozšířit federaci" # todo: NEW TRANSLATION
 ALG_expand_more_desc: "Tamazgha nesmí ustrnout. Rozšiřování, průmyslové i územní, zajistí naše místo velmoci Afriky a Středomoří." # todo: NEW TRANSLATION
 ALG_focus_on_our_land: "Zaměřit se na naši zemi" # todo: NEW TRANSLATION
 ALG_focus_on_our_land_desc: "Namísto přílišné expanze bychom se měli zaměřit na rozvoj naší země, posílení našeho vlivu, ekonomiky a jednoty uvnitř samotné Tamazghy." # todo: NEW TRANSLATION
 ALG_expand_to_ME: "Rozšířit se na Blízký východ" # todo: NEW TRANSLATION
 ALG_expand_to_ME_desc: "Blízký východ je zmítán chaosem. Díky síle a odhodlání může Tamazgha přinést do zemí Arábie pořádek a amazighské vedení." # todo: NEW TRANSLATION
 ALG_take_arabia: "Dobýt Arábii" # todo: NEW TRANSLATION
 ALG_take_arabia_desc: "Arabský poloostrov je rozdělený a slabý. Přineseme do těchto zemí světlo Tamazghy a zajistíme svou nadvládu nad Rudým mořem a Perským zálivem." # todo: NEW TRANSLATION
 ALG_take_levant: "Zmocnit se Levanty" # todo: NEW TRANSLATION
 ALG_take_levant_desc: "Od libanonských hor po pláně Sýrie a Palestiny padne Levanta pod prapor Tamazghy a přiblíží nás ke kontrole kolébky civilizace." # todo: NEW TRANSLATION
 ALG_legacy_of_dihiya: "Dědictví Dihyi" # todo: NEW TRANSLATION
 ALG_legacy_of_dihiya_desc: "Královna Dihya, neohrožená bojovnice z Aurès, kdysi sjednotila amazighské kmeny proti cizím útočníkům. Její duch vzdoru a vůdcovství žije dál v našem lidu. Neseme její dědictví vpřed, neporušené, nezdolné a navždy svobodné." # todo: NEW TRANSLATION
 ALG_de_arabisation_mission_desc: "Probíhá národní kampaň kulturních a jazykových reforem. Byrokracie a vzdělávání jsou přepisovány tak, aby odrážely amazighské dědictví. Tato proměna krátkodobě způsobí napětí, z dlouhodobého hlediska však náš národ posílí." # todo: NEW TRANSLATION
 ALG_dearabisation_end_TT: "§GProces dearabizace končí.§! Arabská jádra jsou nahrazena amazighskými a získáváme národního ducha §Y„Vytrvalost Imazighenů“§!." # todo: NEW TRANSLATION
 ALG_de_arabisation: "Kampaň dearabizace" # todo: NEW TRANSLATION
 ALG_de_arabisation_desc: "Po staletí byla skutečná identita našeho lidu pohřbena pod vnucenými kulturami. Znovu získáme své kořeny reformou vzdělávání, správy a jazykové politiky, i kdyby to krátkodobě narušilo naši společnost." # todo: NEW TRANSLATION
 ALG_dearabisation_penalty: "Správní otřesy" # todo: NEW TRANSLATION
 ALG_dearabisation_penalty_desc: "Proces dearabizace narušil státní byrokracii a vzdělávací systém. Přechod provázejí odpor, zmatek a neefektivita, zatímco se vláda pokouší obnovit instituce v amazighském duchu." # todo: NEW TRANSLATION
 ALG_imazighen_perseverance: "Vytrvalost Imazighenů" # todo: NEW TRANSLATION
 ALG_imazighen_perseverance_desc: "Náš lid vytrval navzdory těžkostem a reformám. Amazighský duch se ukázal jako nezlomný; z bouře vycházíme silnější, hrdější a sjednocení." # todo: NEW TRANSLATION
 ALG_el_salam_nuclear_reactor: "Jaderný reaktor El Salam" # todo: NEW TRANSLATION
 ALG_el_salam_nuclear_reactor_desc: "Aby vláda pokryla rostoucí energetickou poptávku Alžírska a snížila závislost na fosilních palivech, zahájí výstavbu jaderného reaktoru El Salam. Tento projekt představuje významný krok k vědeckému pokroku a diverzifikaci energetiky." # todo: NEW TRANSLATION
 ALG_uranium_enrichment: "Program obohacování uranu" # todo: NEW TRANSLATION
 ALG_uranium_enrichment_desc: "Rozvoj domácí kapacity pro obohacování uranu umožní Alžírsku řídit vlastní dodávky jaderného paliva. Naši vědci chtějí v rámci tohoto programu zvládnout centrifugovou technologii a dosáhnout jaderné soběstačnosti." # todo: NEW TRANSLATION
 ALG_el_nour_nuclear_facility: "Jaderné zařízení El Nour" # todo: NEW TRANSLATION
 ALG_el_nour_nuclear_facility_desc: "Po úspěchu reaktoru El Salam Alžírsko rozšíří svou jadernou infrastrukturu výstavbou zařízení El Nour, centra pro výzkum, údržbu reaktorů a mírový jaderný rozvoj." # todo: NEW TRANSLATION
 ALG_ask_for_help_from_india: "Vyhledat indickou pomoc" # todo: NEW TRANSLATION
 ALG_ask_for_help_from_india_desc: "Indie má desítky let zkušeností s rozvojem jaderné energetiky pod mezinárodním dohledem. Obrátí-li se Alžírsko na Nové Dillí s žádostí o technickou a vědeckou spolupráci, může svůj civilní jaderný program rozvíjet rychleji." # todo: NEW TRANSLATION
 ALG_buy_pinaka_launcher: "Zakoupit raketomety Pinaka" # todo: NEW TRANSLATION
 ALG_buy_pinaka_launcher_desc: "Indický salvový raketomet Pinaka je cenově efektivní a spolehlivý systém. Jeho získání posílí alžírské dělostřelecké divize a podpoří užší vojenskou spolupráci s Indií." # todo: NEW TRANSLATION
 ALG_indian_missiles: "Získat indickou raketovou technologii" # todo: NEW TRANSLATION
 ALG_indian_missiles_desc: "Díky rozšířené obranné spolupráci s Indií může Alžírsko získat přístup k pokročilým systémům navádění a pohonu raket. Začlenění této technologie výrazně posílí naše obranné schopnosti." # todo: NEW TRANSLATION
 ALG_subsidise_amazigh_businesses: "Dotovat amazighské podniky" # todo: NEW TRANSLATION
 ALG_subsidise_amazigh_businesses_desc: "Poskytnout státní dotace a přednostní podporu amazighským podnikatelům a podpořit tak ekonomický růst v oblastech Tamazghy." # todo: NEW TRANSLATION
 ALG_leave_arab_league: "Opustit Arabskou ligu" # todo: NEW TRANSLATION
 ALG_leave_arab_league_desc: "Vystoupit Alžírskem z Arabské ligy a prosadit svrchovanou amazighskou identitu oddělenou od politiky arabského bloku." # todo: NEW TRANSLATION
 ALG_bring_back_amazigh_exiles: "Přivést zpět amazighské exulanty" # todo: NEW TRANSLATION
 ALG_bring_back_amazigh_exiles_desc: "Usnadnit návrat amazighských exulantů a přistěhovalců a nabídnout jim pobídky k přesídlení." # todo: NEW TRANSLATION
 ALG_boost_kabyle_population: "Posílit kabylskou populaci" # todo: NEW TRANSLATION
 ALG_boost_kabyle_population_desc: "Provést politiky ke zvýšení demografického podílu Kabylů prostřednictvím pobídek, přesídlování a podpory." # todo: NEW TRANSLATION
 ALG_de_arabisation_category: "Program dearabizace Tamazghy" # todo: NEW TRANSLATION
 ALG_de_arabisation_category_desc: "Chceme-li vybudovat novou Tamazghu, musíme odvrhnout vnucenou arabskou identitu a obnovit amazighského ducha našeho národa." # todo: NEW TRANSLATION
 ALG_de_arabisation_mission: "Proces dearabizace" # todo: NEW TRANSLATION
 ALG_return_amazigh_exiles: "Přivést zpět amazighské exulanty a přistěhovalce" # todo: NEW TRANSLATION
 ALG_return_amazigh_exiles_desc: "Desetiletí diskriminace přinutila mnohé uprchnout. Nastal čas přivést je domů." # todo: NEW TRANSLATION
 ALG_dearabisation_fail_TT: "Neúspěch oslabí stabilitu a zvýší etnické napětí." # todo: NEW TRANSLATION
 ALG_amazigh_businesses_complete_TT: "Spokojenost Kabylů a ekonomika se zlepší." # todo: NEW TRANSLATION
 ALG_amazigh_businesses_fail_TT: "Neúspěch sníží spokojenost Kabylů." # todo: NEW TRANSLATION
 ALG_return_exiles_complete_TT: "Navracející se exulanti posílí amazighskou identitu a pracovní sílu." # todo: NEW TRANSLATION
 ALG_return_exiles_fail_TT: "Neúspěch při repatriaci exulantů oslabí jednotu." # todo: NEW TRANSLATION
 ALG_no_arab_league_faction_partner_tt: "Nesdílíme frakci s žádným členem §YArabské ligy§!" # todo: NEW TRANSLATION
 ALG_leave_arab_league_complete_TT: "Opuštění Arabské ligy posílí suverenitu Tamazghy." # todo: NEW TRANSLATION
 ALG_leave_arab_league_fail_TT: "Neúspěch při odchodu způsobí nepokoje." # todo: NEW TRANSLATION
 ALG_kabyle_pop_complete_TT: "Kabylská populace roste a národní jednota se zvyšuje." # todo: NEW TRANSLATION
 ALG_kabyle_pop_fail_TT: "Zanedbání kabylské demografie způsobí nepokoje." # todo: NEW TRANSLATION
 ALG_maintain_kabyle_relations: "Udržovat kabylské vztahy" # todo: NEW TRANSLATION
 ALG_maintain_kabyle_relations_desc: "Nenáročná iniciativa vůči kabylským komunitám, která má zabránit poklesu spokojenosti. Stojí politickou moc, ale vyhne se tvrdým postihům za neúspěch rozsáhlejších reforem." # todo: NEW TRANSLATION
 ALG_maintain_kabyle_relations_tt: "§GSpokojenost Kabylů:§! +5\n§YStabilita:§! +2,0 %\nObnovení po 90 dnech." # todo: NEW TRANSLATION
 ALG_tamazgha_cultural_revival_category: "Kulturní obrození Tamazghy" # todo: NEW TRANSLATION
 ALG_tamazgha_cultural_revival_category_desc: "Po skončení arabizace nastal čas obnovit naše kulturní, jazykové a intelektuální dědictví. Začíná znovuzrození Tamazghy." # todo: NEW TRANSLATION
 ALG_amazigh_language_reform: "Reforma amazighského jazyka" # todo: NEW TRANSLATION
 ALG_amazigh_language_reform_desc: "Musíme obnovit Tamazight jako národní jazyk a podporovat jeho používání ve vzdělávání a správě." # todo: NEW TRANSLATION
 ALG_tamazight_in_education: "Zavést Tamazight do vzdělávání" # todo: NEW TRANSLATION
 ALG_tamazight_in_education_desc: "Zavést jazyk Tamazight do škol a univerzit, abychom zachovali své kulturní kořeny." # todo: NEW TRANSLATION
 ALG_media_cultural_independence: "Kulturní a mediální nezávislost" # todo: NEW TRANSLATION
 ALG_media_cultural_independence_desc: "Podporovat nezávislá amazighská média a kulturní iniciativy osvobozené od vnějšího vlivu." # todo: NEW TRANSLATION
 ALG_tamazgha_regional_cooperation: "Regionální spolupráce Tamazghy" # todo: NEW TRANSLATION
 ALG_tamazgha_regional_cooperation_desc: "Sjednotit severoafrické národy amazighského původu v rámci spolupráce pro společnou budoucnost." # todo: NEW TRANSLATION
 ALG_amazigh_language_reform_complete_TT: "Tamazight se stane státním jazykem a podpoří vzdělávání." # todo: NEW TRANSLATION
 ALG_amazigh_language_reform_fail_TT: "Neúspěch reformy vzdělávání oddálí kulturní obrození." # todo: NEW TRANSLATION
 ALG_tamazight_in_education_complete_TT: "Tamazight byl úspěšně zaveden do vzdělávacích programů." # todo: NEW TRANSLATION
 ALG_tamazight_in_education_fail_TT: "Vzdělávací systém zůstává ovládán arabským vlivem." # todo: NEW TRANSLATION
 ALG_media_cultural_independence_complete_TT: "Nezávislá amazighská média posílí národní identitu." # todo: NEW TRANSLATION
 ALG_media_cultural_independence_fail_TT: "Nečinnost oslabí kulturní vliv." # todo: NEW TRANSLATION
 ALG_tamazgha_regional_cooperation_complete_TT: "Regionální jednota mezi národy Tamazghy byla dosažena." # todo: NEW TRANSLATION
 ALG_tamazgha_regional_cooperation_fail_TT: "Neschopnost navázat spolupráci Tamazghu izoluje." # todo: NEW TRANSLATION
 ALG_black_decade_lesson: "Poučení z černé dekády" # todo: NEW TRANSLATION
 ALG_black_decade_lesson_desc: "Občanská válka v 90. letech národ hluboce poznamenala a zanechala po sobě generaci obávající se extremismu a nestability. Stát si z této temné kapitoly odnesl tvrdá poučení a zaměřuje se na zachování národní jednoty, posílení bezpečnostních institucí a vyhnutí se chaosu ideologického střetu. Tato poučení však také ospravedlňují pokračující vliv staré gardy na politiku, neboť strach z opakování stále utváří každou reformu." # todo: NEW TRANSLATION
 AlgeriaElections.1.t: "Volby" # todo: NEW TRANSLATION
 AlgeriaElections.1.d: "Po letech Alžírsko poprvé sleduje skutečně konkurenční volby. Ve vzduchu panuje očekávání i napětí, když miliony občanů míří k volebním urnám odhodlané utvářet budoucnost svého národa po desetiletích politické stagnace. Politické scéně dominuje několik sil.\n\nJeden blok složený z reformistických, liberálních a umírněně islamistických frakcí vede kampaň za demokracii, transparentnost a národní usmíření. Jejich vize volá po rozebrání systému „Le Pouvoir“ a obnovení legitimity vlády. Jejich výzva silně rezonuje s mládeží, občanskou společností a dělníky hledajícími skutečnou změnu.\n\nDalší frontu tvoří pragmatičtí nezávislí a technokraté, kteří usilují o reformu zevnitř. Upřednostňují postupnou demokratizaci, lepší správu a ekonomickou liberalizaci při zachování stability a bezpečnosti.\n\nPo sečtení hlasů vítězí jedna strana, přičemž každá představuje odlišnou cestu do budoucnosti národa." # todo: NEW TRANSLATION
 AlgeriaElections.1.a: "FFS slaví vítězství" # todo: NEW TRANSLATION
 AlgeriaElections.1.b: "RND vyhrává volby" # todo: NEW TRANSLATION
 AlgeriaElections.1.c: "MSP získává mandát" # todo: NEW TRANSLATION
 AlgeriaElections.1.dd: "RCD se dostává k moci" # todo: NEW TRANSLATION
 AlgeriaElections.2.t: "Volby" # todo: NEW TRANSLATION
 AlgeriaElections.2.d: "Dlouho očekávané volby jsou zde a národ zatajuje dech. Vládnoucí Front de Libération Nationale, neboli FLN, opět stojí jako ústřední pilíř alžírského politického systému a oslovuje ty, kteří po zmatcích černé dekády stále oceňují stabilitu, jednotu a kontinuitu. Pod vedením prezidenta Abdelazize Boutefliky a loajálního stranického aparátu slibuje FLN modernizaci bez chaosu a reformu bez rozvratu.\n\nOpoziční hnutí, ač hlasitá a rozmanitá, zůstávají rozdělená a roztříštěná, neschopná vytvořit jednotnou frontu schopnou čelit staré gardě. Mnoho Alžířanů, unavených otřesy a toužících po pořádku, odevzdává hlas známé volbě v přesvědčení, že zkušenosti a bezpečnost převáží rizika změny.\n\nPo sečtení posledních hlasů je výsledek jasný: odkaz revoluce stále vládne nejvyšší měrou." # todo: NEW TRANSLATION
 AlgeriaElections.2.a: "FLN zajišťuje další vítězství!" # todo: NEW TRANSLATION
 ALG_election_time: "Volební období" # todo: NEW TRANSLATION
 ALG_election_time_desc: "Alžírsko se připravuje na další zásadní volební období. Politická scéna je napjatá, protože vládnoucí FLN i opoziční strany připravují své kampaně." # todo: NEW TRANSLATION
 ALG_FLN_media_control: "Média pod státní kontrolou" # todo: NEW TRANSLATION
 ALG_FLN_media_control_desc: "Zpřísněním kontroly nad tiskem a televizí vláda zajišťuje, aby veřejné vyprávění zůstalo loajální vládnoucí FLN a její vizi stability." # todo: NEW TRANSLATION
 ALG_loyal_military: "Loajální armáda" # todo: NEW TRANSLATION
 ALG_loyal_military_desc: "Armáda se osvědčila jako spolehlivý strážce režimu a zajišťuje, že pořádek a národní jednota zůstanou nade vše zachovány." # todo: NEW TRANSLATION
 ALG_FLN_state_led_development: "Rozvoj vedený státem" # todo: NEW TRANSLATION
 ALG_FLN_state_led_development_desc: "Stát řídí hlavní sektory ekonomiky a zajišťuje, že průmyslový a sociální rozvoj zůstane pod národní kontrolou." # todo: NEW TRANSLATION
 ALG_FLN_oil_for_people: "Ropa pro lid" # todo: NEW TRANSLATION
 ALG_FLN_oil_for_people_desc: "Vláda využívá rozsáhlé uhlovodíkové bohatství země k poskytování sociální péče a dotací a podporuje společenskou smlouvu založenou na ekonomickém přerozdělování." # todo: NEW TRANSLATION
 ALG_FLN_national_security_council: "Rada národní bezpečnosti" # todo: NEW TRANSLATION
 ALG_FLN_national_security_council_desc: "Vrcholný orgán koordinující vnitřní bezpečnost a kontrarozvědku, který zajišťuje rychlou neutralizaci hrozeb vůči státu." # todo: NEW TRANSLATION
 ALG_FLN_industrial_nationalization: "Industrializace pod státní kontrolou" # todo: NEW TRANSLATION
 ALG_FLN_industrial_nationalization_desc: "Vláda FLN podnikla kroky k obnovení kontroly nad klíčovými průmyslovými odvětvími s cílem chránit ekonomickou suverenitu Alžírska." # todo: NEW TRANSLATION
 ALG_FLN_legacy_of_stability: "Odkaz stability" # todo: NEW TRANSLATION
 ALG_FLN_legacy_of_stability_desc: "Navzdory svým nedostatkům poskytla vláda FLN kontinuitu a stabilitu, čehož si mnoho Alžířanů po letech otřesů cení." # todo: NEW TRANSLATION
 ALG_FLN_oil_for_people_idea: "Ropa pro lid" # todo: NEW TRANSLATION
 ALG_FLN_oil_for_people_idea_desc: "Vláda se rozhodla využívat příjmy z ropy k přímému financování veřejných programů a dotací. Zatímco to zvyšuje životní úroveň, zároveň to přináší riziko dlouhodobé neefektivity a závislosti." # todo: NEW TRANSLATION
 ALG_FLN_legacy_of_stability_idea: "Odkaz stability" # todo: NEW TRANSLATION
 ALG_FLN_legacy_of_stability_idea_desc: "Po desetiletí se FLN představuje jako strážce stability Alžírska. Její pevná kontrola politiky a bezpečnosti zajišťuje mír, avšak za cenu omezených svobod." # todo: NEW TRANSLATION
 ALG_FLN_industrial_nationalization_idea: "Industrializace pod státní kontrolou" # todo: NEW TRANSLATION
 ALG_FLN_industrial_nationalization_idea_desc: "Hlavní sektory ekonomiky jsou převáděny pod státní kontrolu, aby byla zajištěna národní nezávislost a průmyslový růst vedený vládním plánováním." # todo: NEW TRANSLATION
 ALG_FLN_state_led_development_idea: "Rozvoj vedený státem" # todo: NEW TRANSLATION
 ALG_FLN_state_led_development_idea_desc: "Stát aktivně řídí ekonomický růst Alžírska a klade důraz na infrastrukturu, vzdělávání a sociální péči s cílem posílit základy národa." # todo: NEW TRANSLATION
 ALG_FLN_media_control_idea: "Code de l'Information" # todo: NEW TRANSLATION
 ALG_FLN_media_control_idea_desc: "Code de l'Information vytváří právní rámec pro tisk a vysílání a umožňuje státu regulovat činnost médií a usměrňovat národní informační prostor." # todo: NEW TRANSLATION
 ALG_FLN_national_security_council_idea: "Rada národní bezpečnosti" # todo: NEW TRANSLATION
 ALG_FLN_national_security_council_idea_desc: "Mocná rada složená z vojenských představitelů, zpravodajců a vysokých úředníků dohlíží na vnitřní stabilitu a národní strategii a zajišťuje loajalitu vládě FLN." # todo: NEW TRANSLATION
 ALG_loyal_military_idea: "Loajální armáda" # todo: NEW TRANSLATION
 ALG_loyal_military_idea_desc: "Armáda zůstává loajální FLN a nade vše si cení pořádku a hierarchie. Tato jednota však přichází za cenu nižší přizpůsobivosti a iniciativy na bojišti." # todo: NEW TRANSLATION
 ALG_loyal_military2_idea: "Sbor loajální armády" # todo: NEW TRANSLATION
 ALG_loyal_military2_idea_desc: "Loajalita armády se prohloubila politickou integrací a privilegovanými výhodami, čímž vznikl mocný a disciplinovaný vojenský aparát pod vládním velením." # todo: NEW TRANSLATION
 ALG_invest_in_youth_idea: "Investovat do mládeže" # todo: NEW TRANSLATION
 ALG_invest_in_youth_idea_desc: "Programy zaměřené na vzdělávání a zaměstnávání rostoucí mladé populace Alžírska ovlivní budoucnost země a vytvoří novou generaci odborníků a vůdců." # todo: NEW TRANSLATION
 ALG_anti_corruption_campaign_idea: "Protikorupční kampaň" # todo: NEW TRANSLATION
 ALG_anti_corruption_campaign_idea_desc: "Vláda zahájila kampaň proti korupci a zneužívání byrokracie s cílem obnovit důvěru veřejnosti a zlepšit efektivitu státu." # todo: NEW TRANSLATION
 ALG_new_era_for_algeria_idea: "Nová éra Alžírska" # todo: NEW TRANSLATION
 ALG_new_era_for_algeria_idea_desc: "Alžírsko vstupuje do nové éry reforem a modernizace a vyvažuje inovace a sociální pokrok s výzvami měnící se globální ekonomiky." # todo: NEW TRANSLATION
 ALG_open_market_idea: "Politika otevřeného trhu" # todo: NEW TRANSLATION
 ALG_open_market_idea_desc: "Postupná liberalizace alžírské ekonomiky přiláká investice a podnikavost, avšak s rizikem oslabení tradiční státní kontroly nad klíčovými průmyslovými odvětvími." # todo: NEW TRANSLATION
 ALG_reform_education_system_idea: "Reformovat vzdělávací systém" # todo: NEW TRANSLATION
 ALG_reform_education_system_idea_desc: "Probíhají rozsáhlé reformy s cílem modernizovat vzdělávací systém, podporovat inovace a přizpůsobit školy potřebám moderní alžírské ekonomiky." # todo: NEW TRANSLATION
 ALG_reform_the_judicial_system_idea: "Soudní reforma" # todo: NEW TRANSLATION
 ALG_reform_the_judicial_system_idea_desc: "Probíhají snahy o modernizaci alžírského soudního systému, omezení korupce a vytvoření spravedlivějších soudů, které dodržují právní stát." # todo: NEW TRANSLATION
 ALG_free_media_idea: "Svobodná média" # todo: NEW TRANSLATION
 ALG_free_media_idea_desc: "Nezávislá média začínají vzkvétat, poskytují transparentnost a odpovědnost, zároveň však zvyšují míru kritiky a veřejné debaty." # todo: NEW TRANSLATION
 ALG_black_decade_lesson_idea: "Poučení z černé dekády" # todo: NEW TRANSLATION
 ALG_black_decade_lesson_idea_desc: "Trauma občanské války stále pronásleduje Alžírsko. Národ zůstává opatrný, upřednostňuje bezpečnost před rizikem a zajišťuje, aby se podobná nestabilita již nevrátila." # todo: NEW TRANSLATION
 ALG_election_day: "Den voleb" # todo: NEW TRANSLATION
 ALG_election_day_desc: "Nastal čas, aby Alžířané zvolili svou budoucnost. To, zda si vládnoucí FLN udrží moc, nebo zvítězí opozice, bude utvářet zemi po desetiletí." # todo: NEW TRANSLATION
 ALG_FLN_path: "Vítězství FLN" # todo: NEW TRANSLATION
 ALG_FLN_path_desc: "FLN znovu zvítězila a udržela si kontrolu nad vládou i směřováním budoucnosti Alžírska." # todo: NEW TRANSLATION
 ALG_FLN_preserve_system: "Zachovat systém" # todo: NEW TRANSLATION
 ALG_FLN_preserve_system_desc: "Vedení FLN nevidí potřebu drastických změn. Zachování stávajícího řádu zajišťuje stabilitu a kontinuitu." # todo: NEW TRANSLATION
 ALG_FLN_control_media: "Přijmout organický zákon č. 12-05" # todo: NEW TRANSLATION
 ALG_FLN_control_media_desc: "Přijetím organického zákona č. 12-05 upravujícího informační a mediální činnost může stát utvářet národní vyprávění a zároveň zachovat právní rámec pro dohled nad tiskem." # todo: NEW TRANSLATION
 ALG_election_day_tt: "§YOdemkne cestu k alžírským prezidentským volbám v roce 2004.§!\nBrzy si budete muset vybrat mezi vládnoucími §RFLN§! a §Yopozicí§! pro budoucnost země." # todo: NEW TRANSLATION
 ALG_ethnic_kabyle_tt: "§YKabylská populace§! je vyšší než §Y10 %§!" # todo: NEW TRANSLATION
 ALG_kabyle_satisfaction_tt: "§YSpokojenost Kabylů§! je nejméně §Y65 %§!" # todo: NEW TRANSLATION
 ALG_kabyle_satisfaction_70_tt: "§YSpokojenost Kabylů§! je vyšší než §Y70 %§!" # todo: NEW TRANSLATION
 ALG_kabyle_satisfaction_60_tt: "§YSpokojenost Kabylů§! je nejméně §Y60 %§!" # todo: NEW TRANSLATION
 ALG_fossil_fuel_industry: "Lobisté Sonatrachu" # todo: NEW TRANSLATION
 ALG_fossil_fuel_industry_desc: "Státní energetický gigant Sonatrach a jeho síť dodavatelů tvoří jednu z nejmocnějších frakcí v Alžírsku. Hájí dotace, brání ekonomické diverzifikaci a udržují úzké vazby se zahraničními společnostmi a vládami závislými na alžírské ropě a plynu." # todo: NEW TRANSLATION
 ALG_the_military: "Lidová národní armáda (ANP)" # todo: NEW TRANSLATION
 ALG_the_military_desc: "Alžírská armáda, ANP, je páteří státu. Působí jako strážce národní jednoty a stability, její dominance však omezuje demokratické reformy. ANP vyvažuje ochranu Alžírska s omezováním civilní vlády a vždy představuje rozhodujícího hráče v politice." # todo: NEW TRANSLATION
 ALG_industrial_conglomerates: "CEVITAL-MADAR" # todo: NEW TRANSLATION
 ALG_industrial_conglomerates_desc: "Průmyslové konglomeráty, ovládané giganty jako Cevital a Madar Holdings, představují rostoucí alžírskou oligarchickou podnikatelskou elitu. Úzce propojené s politickou mocí a často provázané s armádou a vládnoucími rodinami usilují tyto skupiny o zisk prostřednictvím privatizace, spotřebního zboží, nemovitostí a zahraničního obchodu. Mohou poskytnout tolik potřebné investice a růst, avšak za cenu korupce, nerovnosti a ovládnutí politiky." # todo: NEW TRANSLATION
 ALG_offices_contruction_speed: "Rychlost výstavby kanceláří" # todo: NEW TRANSLATION
 ALG_arms_factory_contruction_speed: "Rychlost výstavby vojenských továren" # todo: NEW TRANSLATION
 ALG_civ_construction_speed: "Rychlost výstavby civilních továren" # todo: NEW TRANSLATION
 ALG_population_energy_consumption: "Spotřeba energie obyvatelstvem" # todo: NEW TRANSLATION
 ALG_civ_factory_workforce: "Potřební pracovníci civilních továren" # todo: NEW TRANSLATION
 ALG_mil_factory_workforce: "Potřební pracovníci vojenských továren" # todo: NEW TRANSLATION
 ALG_office_workforce: "Potřební kancelářští pracovníci" # todo: NEW TRANSLATION
 ALG_military_modifier: "Alžírské ozbrojené síly" # todo: NEW TRANSLATION
 ALG_military_modifier_desc: "Představuje schopnosti a reformy alžírské armády." # todo: NEW TRANSLATION
 ALG_opposition_path: "Cesta opozice" # todo: NEW TRANSLATION
 ALG_opposition_path_desc: "S rostoucí silou politické opozice stojí země před volbou: reformovat zevnitř, nebo riskovat chaos. Nastal čas přijmout transparentnost a pokrok." # todo: NEW TRANSLATION
 ALG_opposition_chosen: "Zvolena cesta opozice" # todo: NEW TRANSLATION
 ALG_OPP_free_elections: "Uspořádat svobodné volby" # todo: NEW TRANSLATION
 ALG_OPP_free_elections_desc: "Hlas lidu byl příliš dlouho umlčován. Skutečná demokracie začíná transparentními a spravedlivými volbami." # todo: NEW TRANSLATION
 ALG_FLN_military_loyalty: "Zajistit loajalitu armády" # todo: NEW TRANSLATION
 ALG_FLN_military_loyalty_desc: "Armáda je pilířem stability. Zajištění její loajality zabrání otřesům a zajistí budoucnost našeho národa." # todo: NEW TRANSLATION
 ALG_FLN_public_works: "Zahájit programy veřejných prací" # todo: NEW TRANSLATION
 ALG_FLN_public_works_desc: "Investicemi do veřejné infrastruktury poskytujeme pracovní místa a obnovujeme důvěru lidu ve státní instituce." # todo: NEW TRANSLATION
 ALG_reform_armed_forces: "Reformovat ozbrojené síly" # todo: NEW TRANSLATION
 ALG_reform_armed_forces_desc: "Modernizace vojenské struktury zajistí efektivitu, disciplínu a loajalitu ke státu namísto jednotlivců." # todo: NEW TRANSLATION
 ALG_counter_extremism: "Protiteroristické schopnosti" # todo: NEW TRANSLATION
 ALG_counter_extremism_desc: "Teroristické sítě ohrožují naši národní stabilitu. Posílením zpravodajství, bezpečnostních sil a preventivních programů můžeme zlepšit alžírské protiteroristické schopnosti." # todo: NEW TRANSLATION
 ALG_regional_power: "Regionální mocnost" # todo: NEW TRANSLATION
 ALG_regional_power_desc: "Po dosažení vnitřní stability může Alžírsko prosazovat svou sílu a vedoucí úlohu v severní Africe a Středomoří." # todo: NEW TRANSLATION
 ALG_expanding_the_power_grid: "Rozšířit elektrickou síť" # todo: NEW TRANSLATION
 ALG_expanding_the_power_grid_desc: "Spolehlivé dodávky elektřiny jsou zásadní pro hospodářský růst. Rozšíření energetické sítě podpoří průmysl a rozvoj venkova." # todo: NEW TRANSLATION
 ALG_OPP_new_constitution: "Sepsat novou ústavu" # todo: NEW TRANSLATION
 ALG_OPP_new_constitution_desc: "Nová ústava položí základy demokracie, rovnosti a civilní vlády." # todo: NEW TRANSLATION
 ALG_OPP_media_freedom: "Zajistit svobodu médií" # todo: NEW TRANSLATION
 ALG_OPP_media_freedom_desc: "Svoboda tisku je nezbytná k tomu, aby představitelé nesli odpovědnost a veřejnost byla pravdivě informována." # todo: NEW TRANSLATION
 ALG_OPP_judiciary_reform: "Reformovat soudnictví" # todo: NEW TRANSLATION
 ALG_OPP_judiciary_reform_desc: "Nezávislé a transparentní soudnictví je klíčem k zajištění spravedlnosti pro všechny občany bez ohledu na postavení či vliv." # todo: NEW TRANSLATION
 ALG_OPP_education_first: "Vzdělání na prvním místě" # todo: NEW TRANSLATION
 ALG_OPP_education_first_desc: "Moderní národ závisí na dobře vzdělaném obyvatelstvu. Investice do škol a univerzit utvářejí jasnější budoucnost." # todo: NEW TRANSLATION
 ALG_OPP_open_market: "Otevřít trh" # todo: NEW TRANSLATION
 ALG_OPP_open_market_desc: "Ekonomické reformy a otevřený obchod přilákají investice a vytvoří příležitosti pro podnikatele." # todo: NEW TRANSLATION
 ALG_OPP_new_era: "Nová éra Alžírska" # todo: NEW TRANSLATION
 ALG_OPP_new_era_desc: "Po letech bojů a reforem vstupuje Alžírsko do nové kapitoly svobody, prosperity a stability." # todo: NEW TRANSLATION
 ALG_OPP_anti_corruption: "Bojovat proti korupci" # todo: NEW TRANSLATION
 ALG_OPP_anti_corruption_desc: "Korupce vyčerpává potenciál národa. Nastal čas pro přísné zákony, transparentní instituce a odpovědnost na všech úrovních." # todo: NEW TRANSLATION
 ALG_OPP_invest_in_youth: "Investovat do mládeže" # todo: NEW TRANSLATION
 ALG_OPP_invest_in_youth_desc: "Mládež je duší Alžírska. Jejím posílením prostřednictvím vzdělávání a zaměstnání zajistíme budoucnost národa." # todo: NEW TRANSLATION
 ALG_OPP_state_first: "Stát na prvním místě" # todo: NEW TRANSLATION
 ALG_OPP_state_first_desc: "V dobách změn musí každou politiku vést jednota a národní zájem. Integrita státu stojí před stranickým prospěchem." # todo: NEW TRANSLATION
 ALG_terror_2013_in_amenas_title: "Krize rukojmích v In Amenas v roce 2013" # todo: NEW TRANSLATION
 ALG_terror_2013_in_amenas_desc: "Skupina ozbrojených militantů napojených na extremistické organizace zahájila překvapivý útok na plynárenské zařízení In Amenas v jižním Alžírsku. Útočníci zajali stovky rukojmích včetně zahraničních pracovníků, což vyvolalo mezinárodní krizi. Alžírská armáda místo rychle obklíčila, následovalo krvavé střetnutí, které šokovalo svět a vyvolalo otázky ohledně schopnosti vlády čelit terorismu v pouštních oblastech." # todo: NEW TRANSLATION
 ALG_terror_2013_placeholder_option: "Naše síly rozhodně zasáhnou." # todo: NEW TRANSLATION
 ALG_terror_2013_low_tt: "Drobné nepokoje byly potlačeny. §GStabilita se mírně zlepšuje.§!" # todo: NEW TRANSLATION
 ALG_terror_2013_medium_tt: "Situace se zhoršuje, což podněcuje §ORadikalizaci§! a snižuje §Rstabilitu§!." # todo: NEW TRANSLATION
 ALG_terror_2013_high_tt: "Útok se vymyká kontrole. §RNárodní stabilita prudce klesá§!, zatímco §Oradikální povstalci§! získávají půdu." # todo: NEW TRANSLATION
 ALG_healthcare_reform_tt: "§YVeřejná nespokojenost§! musí být nižší než §Y40§!, aby mohla být zahájena reforma zdravotnictví." # todo: NEW TRANSLATION
 ALG_education_reform_tt: "§YVeřejná nespokojenost§! musí být nižší než §Y40§!, aby mohla být zahájena reforma školství." # todo: NEW TRANSLATION
 ALG_unemployment_reform_tt: "§YVeřejná nespokojenost§! musí být nižší než §Y40§!, aby mohla být zahájena reforma nezaměstnanosti." # todo: NEW TRANSLATION
 ALG_employment_TT: "§HNezaměstnanost§! je nižší než §H20%§!" # todo: NEW TRANSLATION
 ALG_grand_mosque: "Velká mešita v Alžíru" # todo: NEW TRANSLATION
 ALG_grand_mosque_desc: "Velká mešita v Alžíru, symbol duchovního a kulturního obrození Alžírska, patří mezi nejvyšší a nejvelkolepější mešity na světě. Její výstavba nejen demonstruje architektonické ambice národa, ale slouží také jako maják islámského dědictví a jednoty. Dokončení tohoto monumentálního projektu posílí národní hrdost a rozšíří vliv Alžírska napříč muslimským světem." # todo: NEW TRANSLATION
 ALG_big_cities_or_rising_states: "Program městského nebo regionálního rozvoje" # todo: NEW TRANSLATION
 ALG_big_cities_or_rising_states_desc: "Po programu poválečné obnovy musí vláda rozhodnout o dalším kroku. Máme soustředit zdroje na hlavní pobřežní města a posílit tak průmyslovou páteř Alžírska, nebo pozvednout vnitrozemské a pouštní oblasti a dosáhnout vyváženého národního růstu?" # todo: NEW TRANSLATION
 ALG_focus_on_big_cities: "Zaměření na velká města" # todo: NEW TRANSLATION
 ALG_focus_on_big_cities_desc: "Městská centra jako Alžír, Oran a Konstantina jsou motory alžírského hospodářství. Zaměřením rozvojového úsilí na ně můžeme modernizovat infrastrukturu a zvýšit produktivitu." # todo: NEW TRANSLATION
 ALG_rising_states_program: "Program rozvíjejících se oblastí" # todo: NEW TRANSLATION
 ALG_rising_states_program_desc: "Zatímco pobřežní města prosperují, vnitrozemské oblasti zaostávají. Program rozvíjejících se oblastí má přivést silnice, školy a průmysl do srdce Alžírska a zajistit, aby žádná provincie nezůstala pozadu." # todo: NEW TRANSLATION
 ALG_develop_atlas: "Rozvoj alžírského Atlasu" # todo: NEW TRANSLATION
 ALG_develop_atlas_desc: "Hornaté oblasti Atlasu mají velký potenciál pro zemědělství a drobný průmysl. Investice zde zlepší místní životní úroveň a vytvoří dlouhodobou potravinovou bezpečnost." # todo: NEW TRANSLATION
 ALG_develop_kabylia: "Rozšíření regionu Kabylie" # todo: NEW TRANSLATION
 ALG_develop_kabylia_desc: "Kabylie má silnou kulturní identitu a pracovité obyvatelstvo. Rozvoj infrastruktury a úřadů posílí regionální hrdost i národní jednotu." # todo: NEW TRANSLATION
 ALG_develop_aures: "Zemědělský růst v Aurès" # todo: NEW TRANSLATION
 ALG_develop_aures_desc: "Pohoří Aurès je domovem rozsáhlé zemědělské půdy a pracovitých komunit. Modernizace zemědělské výroby zde sníží venkovskou chudobu a stabilizuje zásobování potravinami." # todo: NEW TRANSLATION
 ALG_expand_oran: "Rozšíření průmyslové zóny Oranu" # todo: NEW TRANSLATION
 ALG_expand_oran_desc: "Oran je jedním z nejvýznamnějších průmyslových a přístavních měst Alžírska. Rozšíření jeho průmyslové zóny vytvoří nová pracovní místa a podpoří vývoz." # todo: NEW TRANSLATION
 ALG_expand_algiers: "Modernizace Alžíru" # todo: NEW TRANSLATION
 ALG_expand_algiers_desc: "Alžír jako tepající srdce Alžírska musí pokračovat ve svém rozvoji. Nové úřady, infrastruktura a městské reformy z něj vytvoří vzorové severoafrické hlavní město." # todo: NEW TRANSLATION
 ALG_expand_constantine: "Investice do Konstantiny" # todo: NEW TRANSLATION
 ALG_expand_constantine_desc: "Dlouhá tradice vzdělávání a kultury činí z Konstantiny ideální centrum vyššího vzdělávání a inovací. Investice zde vytvoří novou generaci alžírských myslitelů a inženýrů." # todo: NEW TRANSLATION
 ALG_develop_tamanrasset: "Rozvoj infrastruktury Tamanrassetu" # todo: NEW TRANSLATION
 ALG_develop_tamanrasset_desc: "Hluboko v Sahaře je Tamanrasset klíčem k logistice jižního Alžírska. Silnice, zásobovací uzly a komunikační infrastruktura propojí poušť se severem." # todo: NEW TRANSLATION
 ALG_develop_mzab: "Energetické posílení údolí Mzab" # todo: NEW TRANSLATION
 ALG_develop_mzab_desc: "Region Mzab má odolného ducha a rostoucí energetické potřeby. Výstavba nových elektráren poskytne místnímu obyvatelstvu elektřinu a pracovní místa." # todo: NEW TRANSLATION
 ALG_develop_granderg: "Využití zdrojů Grand Ergu" # todo: NEW TRANSLATION
 ALG_develop_granderg_desc: "Grand Erg Occidental může vypadat prázdně, ale jeho podzemní bohatství vypráví jiný příběh. Rozvoj těžby ropy zde posílí postavení Alžírska jako producenta energie." # todo: NEW TRANSLATION
 ALG_FIS.1.t: "Návrat Ulemů" # todo: NEW TRANSLATION
 ALG_FIS.1.d: "V rámci Islámské fronty spásy vznikla intenzivní debata o směřování našeho hnutí. Wahhábističtí učenci, inspirovaní přísnými saúdskými výklady, volají po úplném očištění alžírského islámu a politiky od toho, co považují za zkažené novoty. Tradiční alžírští Ulemové mezitím prosazují návrat k duchovnímu vedení a národní reformě v rámci tolerantnějšího islámského systému.\n\nNaše volba určí duši hnutí." # todo: NEW TRANSLATION
 ALG_FIS.1.a: "Následujme wahhábistické Ulemy. Očistěme a posilme víru" # todo: NEW TRANSLATION
 ALG_FIS.1.b: "Podpořme tradiční Ulemy. Reformujme a veďme národ" # todo: NEW TRANSLATION
 ALG_FIS.2.t: "Budoucnost Islámské fronty spásy" # todo: NEW TRANSLATION
 ALG_FIS.2.d: "V roce 1991, po masových demonstracích vedených Islámskou frontou spásy (FIS), alžírské úřady odpověděly silou, což znamenalo jeden z nejkrvavějších zlomů v moderních dějinách národa. Zakladatel hnutí Abbasi Madani byl po červnových událostech odsouzen k patnácti letům vězení. Během nich armáda a policie násilně rozehnaly tisíce příznivců FIS. Generál Khaled Nezzar nařídil Madaniho zatčení a vyhlásil výjimečný stav s cílem stranu rozložit a potlačit islamistický vliv. Tvrdý zásah vedl k chaosu, civilním obětem a rozpuštění veškeré naděje na pokojnou reformu — jiskře, která zažehla ničivou alžírskou občanskou válku, později známou jako Černé desetiletí. S Abbasi Madanim ve vězení a vedením FIS rozptýleným se uvnitř hnutí objevily nové osobnosti. Nyní, když se náš vliv tiše vrací, vyvstává otázka: kdo nás provede touto érou krve a obětí k nové vizi Alžírska?" # todo: NEW TRANSLATION
 ALG_FIS.2.a: "Jmenujme spoluzakladatele a hlas lidu. Aliho Belhadje" # todo: NEW TRANSLATION
 ALG_FIS.2.b: "Přijměme cestu boje. Abdelhak Layada, zakladatel GIA" # todo: NEW TRANSLATION
 ALG_ps_victory: "Vítězství Lidové fronty spásy" # todo: NEW TRANSLATION
 ALG_ps_victory_desc: "Islámská fronta spásy zvítězila. Alžírsko stojí na rozcestí mezi vírou a řádem, mezi mešitou a kasárnami. Nyní musíme upevnit tento nový úsvit moci." # todo: NEW TRANSLATION
 ALG_consolidate_power: "Upevnění nového řádu" # todo: NEW TRANSLATION
 ALG_consolidate_power_desc: "Moc musí být zajištěna na všech úrovních společnosti. Strana, Ulemové a ozbrojené skupiny nyní musí sloužit jedinému účelu — zachování naší vlády." # todo: NEW TRANSLATION
 ALG_national_reconstruction: "Národní obnova" # todo: NEW TRANSLATION
 ALG_national_reconstruction_desc: "Náš válkou zničený národ musí být znovu vybudován z trosek. Obnova bude vyžadovat víru i pragmatismus, když obnovíme průmysl a důvěru veřejnosti." # todo: NEW TRANSLATION
 ALG_religious_reconciliation: "Náboženské usmíření" # todo: NEW TRANSLATION
 ALG_religious_reconciliation_desc: "Rozpory mezi alžírskými islámskými učenci ohrožují naši jednotu. Musíme překonat naše rozdíly a vytvořit jednotný náboženský základ nového státu." # todo: NEW TRANSLATION
 ALG_crackdown_purges: "Tvrdé zásahy a čistky" # todo: NEW TRANSLATION
 ALG_crackdown_purges_desc: "Abychom si udrželi moc, musíme odstranit opozici. Zbytky starého režimu, sekulární důstojníci a disidentské frakce musí být očištěny." # todo: NEW TRANSLATION
 ALG_unify_parties: "Sjednocení islámských hnutí" # todo: NEW TRANSLATION
 ALG_unify_parties_desc: "Rozmanité islamistické skupiny, které podpořily náš vzestup, nyní musí být sjednoceny pod jediným praporem. Jednota Ummy začíná doma." # todo: NEW TRANSLATION
 ALG_infrastructure_crash: "Obnova infrastruktury" # todo: NEW TRANSLATION
 ALG_infrastructure_crash_desc: "Občanská válka zanechala naši infrastrukturu v troskách. Zahájíme nouzové programy na obnovu silnic, mostů a veřejných sítí." # todo: NEW TRANSLATION
 ALG_industry_investment: "Průmyslové investice" # todo: NEW TRANSLATION
 ALG_industry_investment_desc: "Pro udržení dlouhodobé obnovy musíme investovat do národního průmyslu a podporovat místní podnikatele vedené islámskými hospodářskými zásadami." # todo: NEW TRANSLATION
 ALG_madrasa_reforms: "Reformy medres" # todo: NEW TRANSLATION
 ALG_madrasa_reforms_desc: "Vzdělávání musí odpovídat moderním potřebám i náboženským hodnotám. Reforma našich medres zajistí novou generaci učenců a inženýrů pevně zakotvených ve víře." # todo: NEW TRANSLATION
 ALG_community_outreach: "Programy spolupráce s komunitami" # todo: NEW TRANSLATION
 ALG_community_outreach_desc: "Posílíme naše spojení s místními komunitami prostřednictvím sociálních iniciativ a budeme podporovat jednotu a solidaritu pod záštitou islámských hodnot." # todo: NEW TRANSLATION
 ALG_internal_security: "Aparát vnitřní bezpečnosti" # todo: NEW TRANSLATION
 ALG_internal_security_desc: "Musíme vytvořit loajální síť vnitřní bezpečnosti, která potlačí nepokoje a ochrání revoluci zevnitř." # todo: NEW TRANSLATION
 ALG_intelligence_network: "Islámský zpravodajský úřad" # todo: NEW TRANSLATION
 ALG_intelligence_network_desc: "Účinná zpravodajská služba nám umožní předvídat hrozby a zneškodnit spiknutí dříve, než zapustí kořeny." # todo: NEW TRANSLATION
 ALG_transport_upgrade: "Modernizace dopravy" # todo: NEW TRANSLATION
 ALG_transport_upgrade_desc: "Moderní dopravní systémy urychlí obchod, zlepší mobilitu a propojí alžírské regiony těsněji než kdy dříve." # todo: NEW TRANSLATION
 ALG_energy_program: "Národní energetický program" # todo: NEW TRANSLATION
 ALG_energy_program_desc: "Rozvoj obnovitelných i konvenčních zdrojů energie poskytne páteř nové alžírské ekonomice." # todo: NEW TRANSLATION
 ALG_scholastic_centers: "Výzkumná centra učenců" # todo: NEW TRANSLATION
 ALG_scholastic_centers_desc: "Naši učenci a vědci budou pracovat bok po boku na rozvoji islámského poznání i moderní vědy ve prospěch národního pokroku." # todo: NEW TRANSLATION
 ALG_social_welfare: "Rozšíření sociální péče" # todo: NEW TRANSLATION
 ALG_social_welfare_desc: "Postaráme se o chudé, vdovy a vysídlené a zajistíme, aby každý Alžířan těžil z požehnání naší vládní politiky založené na víře." # todo: NEW TRANSLATION
 ALG_military_rebuild: "Obnova armády víry" # todo: NEW TRANSLATION
 ALG_military_rebuild_desc: "Armáda musí být obnovena a očištěna od korupce. Disciplinované vojsko bude bránit revoluci i národ." # todo: NEW TRANSLATION
 ALG_garrison_restructure: "Reorganizace posádek" # todo: NEW TRANSLATION
 ALG_garrison_restructure_desc: "Musíme reorganizovat naše posádky, abychom zajistili loajalitu, efektivitu a připravenost vůči vnějším i vnitřním hrozbám." # todo: NEW TRANSLATION
 ALG_factory_output: "Rozšíření průmyslové výroby" # todo: NEW TRANSLATION
 ALG_factory_output_desc: "Naše investice přinášejí výsledky. Továrny nyní poběží na plnou kapacitu a podpoří hospodářský růst." # todo: NEW TRANSLATION
 ALG_oil_and_minerals: "Rozvoj ropy a nerostných surovin" # todo: NEW TRANSLATION
 ALG_oil_and_minerals_desc: "Bohaté přírodní zdroje Alžírska jsou božím darem. Zodpovědně je využijeme, abychom zajistili energetickou nezávislost." # todo: NEW TRANSLATION
 ALG_religious_council: "Zřízení náboženské rady" # todo: NEW TRANSLATION
 ALG_religious_council_desc: "Nejvyšší rada Ulemů bude určovat morální a duchovní směřování národa a zajišťovat, aby každý zákon odpovídal šaríe." # todo: NEW TRANSLATION
 ALG_national_cohesion: "Národní soudržnost" # todo: NEW TRANSLATION
 ALG_national_cohesion_desc: "Skrze sociální péči a víru zacelíme válečné rozdělení a vytvoříme novou, sjednocenou alžírskou identitu." # todo: NEW TRANSLATION
 ALG_border_defences: "Posílení hranic" # todo: NEW TRANSLATION
 ALG_border_defences_desc: "Naše hranice musí být opevněny proti infiltraci a pašování. Nepřátelé revoluce číhají za hranicemi i uvnitř." # todo: NEW TRANSLATION
 ALG_strategic_reserves: "Program strategických rezerv" # todo: NEW TRANSLATION
 ALG_strategic_reserves_desc: "Budeme hromadit zásoby a rozšiřovat rezervy, abychom zajistili vytrvalost v době války či hospodářské nestability." # todo: NEW TRANSLATION
 ALG_heavy_industry: "Rozvoj těžkého průmyslu" # todo: NEW TRANSLATION
 ALG_heavy_industry_desc: "Rozšíříme naši průmyslovou základnu za hranice spotřebního zboží a zaměříme se na těžké stroje, ocel a výrobu zbraní." # todo: NEW TRANSLATION
 ALG_international_trade: "Rozšíření mezinárodního obchodu" # todo: NEW TRANSLATION
 ALG_international_trade_desc: "Obchodem s přátelskými národy islámského světa se Alžírsko může stát centrem obchodu založeného na víře." # todo: NEW TRANSLATION
 ALG_cultural_influence: "Iniciativa kulturního vlivu" # todo: NEW TRANSLATION
 ALG_cultural_influence_desc: "Budeme šířit naši kulturu, naši víru a náš příklad a propagovat alžírský model islámského obrození." # todo: NEW TRANSLATION
 ALG_welfare_programs: "Programy sociální péče" # todo: NEW TRANSLATION
 ALG_welfare_programs_desc: "Komplexní sociální iniciativy posílí naši legitimitu a ochrání zranitelné." # todo: NEW TRANSLATION
 ALG_army_of_salvation: "Armáda spásy" # todo: NEW TRANSLATION
 ALG_army_of_salvation_desc: "Armáda spásy bude štítem islámu a mečem Alžírska — disciplinovaná, věrná a neústupná." # todo: NEW TRANSLATION
 ALG_nation_energy_independence: "Národní energetická nezávislost" # todo: NEW TRANSLATION
 ALG_nation_energy_independence_desc: "Jakmile bude naše energetika plně pod domácí kontrolou, osvobodíme se od zahraniční závislosti." # todo: NEW TRANSLATION
 ALG_international_outreach: "Mezinárodní islámská spolupráce" # todo: NEW TRANSLATION
 ALG_international_outreach_desc: "Podáme ruku islámskému světu a vybudujeme mosty s hnutími a národy, které sdílejí naši vizi." # todo: NEW TRANSLATION
 ALG_regional_leadership: "Regionální vůdcovství" # todo: NEW TRANSLATION
 ALG_regional_leadership_desc: "Alžírsko se prosadí jako politický, náboženský a hospodářský lídr v severní Africe i za jejími hranicemi." # todo: NEW TRANSLATION
 ALG_technological_renaissance: "Technologická renesance" # todo: NEW TRANSLATION
 ALG_technological_renaissance_desc: "Víra a věda nejsou nepřátelé. Pod vedením božského záměru přijmeme moderní výzkum a posílíme naše vojenské i technologické schopnosti." # todo: NEW TRANSLATION
 ALG_islamic_coalition: "Vytvoření islámské koalice" # todo: NEW TRANSLATION
 ALG_islamic_coalition_desc: "Jednotu Ummy je třeba obnovit prostřednictvím spolupráce. Alžírsko povede koalici islámských národů k vzájemné prosperitě." # todo: NEW TRANSLATION
 ALG_grand_strategy: "Velká strategie" # todo: NEW TRANSLATION
 ALG_grand_strategy_desc: "Náš národ nyní stojí pevně — vojensky, hospodářsky i duchovně. Nastal čas načrtnout dlouhodobou vizi naší civilizace." # todo: NEW TRANSLATION
 ALG_final_salvation: "Konečná spása" # todo: NEW TRANSLATION
 ALG_final_salvation_desc: "Poslední krok na naší cestě k vytvoření společnosti plně vedené božským zákonem a morální silou." # todo: NEW TRANSLATION
 ALG_restoration_of_the_ummah: "Obnova Ummy" # todo: NEW TRANSLATION
 ALG_restoration_of_the_ummah_desc: "Vize sjednoceného islámského světa je na dosah. Věřící znovu povstanou pod jediným praporem." # todo: NEW TRANSLATION
 ALG_guidance_council: "Rada vedení" # todo: NEW TRANSLATION
 ALG_guidance_council_desc: "Rada předních učenců bude dohlížet na naši politiku a zajišťovat, aby vláda zůstala věrná božskému vedení." # todo: NEW TRANSLATION
 ALG_restore_the_ummah_experiment: "Experiment s Ummou" # todo: NEW TRANSLATION
 ALG_restore_the_ummah_experiment_desc: "Pokusíme se vytvořit nový model vlády, který spojí víru, právo a vedení a bude inspirací pro muslimský svět." # todo: NEW TRANSLATION
 ALG_victory_of_the_faithful: "Vítězství věřících" # todo: NEW TRANSLATION
 ALG_victory_of_the_faithful_desc: "Naše vytrvalost a oddanost přinesly vítězství. Alžírsko nyní bude stát jako bašta věřících po celém světě." # todo: NEW TRANSLATION
 ALG_exterminate_corruption: "Vymýcení korupce" # todo: NEW TRANSLATION
 ALG_exterminate_corruption_desc: "Vymýtíme korupci z každé instituce. Žádný úředník, voják ani duchovní nebude stát nad božskou spravedlností." # todo: NEW TRANSLATION
 ALG_to_serve_allah: "Sloužit Alláhovi" # todo: NEW TRANSLATION
 ALG_to_serve_allah_desc: "Naše vláda neslouží světským ambicím, ale jedině Alláhovi. Každá politika, každá reforma a každý boj musí odrážet podřízení se Jeho božské vůli. Sloužit Alláhovi znamená očistit národ i duši." # todo: NEW TRANSLATION
 ALG_economic_islamization: "Islamizace hospodářství" # todo: NEW TRANSLATION
 ALG_economic_islamization_desc: "Přebudujeme naše hospodářství na islámských základech. Systémy založené na úrocích a korupce budou nahrazeny financováním v souladu se šaríou, etickým obchodem a spravedlivým rozdělením bohatství." # todo: NEW TRANSLATION
 FIS_rust_belt_rejuvenation: "Obnova rezavého pásu" # todo: NEW TRANSLATION
 ALG_rust_belt_rejuvenation_desc: "Továrny opuštěné během let nepokojů znovu ožijí. Naši dělníci, vedeni vírou a cílem, obnoví průmyslové srdce Alžírska." # todo: NEW TRANSLATION
 FIS_rule_to_perfection: "Vláda k dokonalosti" # todo: NEW TRANSLATION
 ALG_rule_to_perfection_desc: "Naše správa musí být zdokonalena a dovedena k dokonalosti. Chalífát mysli, stav duše, dokonalost správy skrze božskou kázeň." # todo: NEW TRANSLATION
 FIS_new_islamic_architecture: "Nová islámská architektura" # todo: NEW TRANSLATION
 ALG_new_islamic_architecture_desc: "Nová éra vyžaduje novou tvář našeho národa. Prostřednictvím mešit, škol a občanských budov bude krása islámského umění symbolizovat znovuzrození Alžírska." # todo: NEW TRANSLATION
 FIS_prioritize_military_industries: "Upřednostnění vojenského průmyslu" # todo: NEW TRANSLATION
 ALG_prioritize_military_industries_desc: "Věrná armáda musí být vyzbrojena věrným průmyslem. Upřednostníme vojenskou výrobu a zajistíme, aby naše obrana stála na domácí síle." # todo: NEW TRANSLATION
 FIS_industrialize_the_umma: "Industrializace Ummy" # todo: NEW TRANSLATION
 ALG_industrialize_the_umma_desc: "Průmysl má sloužit islámu, nikoli chamtivosti. Umma se musí stát soběstačnou, produktivní a hrdou — civilizací poháněnou ocelí i vírou." # todo: NEW TRANSLATION
 ALG_militarize_the_nation: "Militarizace národa" # todo: NEW TRANSLATION
 ALG_militarize_the_nation_desc: "Každý věřící musí být připraven bránit Ummu. Připravíme naši společnost na úplnou mobilizaci pod božským velením." # todo: NEW TRANSLATION
 ALG_soldiers_of_faith: "Vojáci víry" # todo: NEW TRANSLATION
 ALG_soldiers_of_faith_desc: "Naši vojáci nebojují za půdu ani moc, ale za samotnou víru. Armáda víry bude štítem islámu a mečem národa." # todo: NEW TRANSLATION
 ALG_forged_in_belief: "Ukuti ve víře" # todo: NEW TRANSLATION
 ALG_forged_in_belief_desc: "Víra je naší ocelí — nezlomnou a neústupnou. Alžírští vojáci jsou ukuti ve víře a vedeni božským přesvědčením." # todo: NEW TRANSLATION
 ALG_disciplined_army_of_god: "Disciplinovaná Boží armáda" # todo: NEW TRANSLATION
 ALG_disciplined_army_of_god_desc: "Ukutíme armádu založenou na poslušnosti, čistotě a neochvějné oddanosti. Každý voják je zároveň válečníkem i služebníkem Boha." # todo: NEW TRANSLATION
 ALG_made_of_steel_and_faith: "Z oceli a víry" # todo: NEW TRANSLATION
 ALG_made_of_steel_and_faith_desc: "Naše legie budou pochodovat se silou železa a vírou proroků. Kázeň a víra splynou v nezlomnou sílu." # todo: NEW TRANSLATION
 ALG_unrestricted_research: "Neomezený výzkum" # todo: NEW TRANSLATION
 ALG_unrestricted_research_desc: "Věda není nepřítelem víry. Pod vedením božského záměru přijmeme moderní výzkum a posílíme naše vojenské i technologické schopnosti." # todo: NEW TRANSLATION
 ALG_ai_military_integration: "Integrace umělé inteligence do armády" # todo: NEW TRANSLATION
 ALG_ai_military_integration_desc: "Umělá inteligence a automatizace se stanou nástroji ve službě božského řádu. Tyto systémy začleníme do naší obranné struktury, abychom zvýšili přesnost a kontrolu." # todo: NEW TRANSLATION
 ALG_new_executors_continent: "Noví vykonavatelé kontinentu" # todo: NEW TRANSLATION
 ALG_new_executors_continent_desc: "Alžírsko je připraveno prosazovat božskou spravedlnost v celé Africe. Naše víra a ocel utvoří osud kontinentu." # todo: NEW TRANSLATION
 ALG_the_future_in_the_present: "Budoucnost v přítomnosti" # todo: NEW TRANSLATION
 ALG_the_future_in_the_present_desc: "Budoucnost již nastala, vedena Alláhovou moudrostí a posílena lidskou inovací. Náš národ povede věřící do nového věku." # todo: NEW TRANSLATION
 ALG_destroy_their_will: "Zničit jejich vůli" # todo: NEW TRANSLATION
 ALG_destroy_their_will_desc: "Rozdrtíme všechny, kdo odporují víře — v mysli, vůli i těle. Odpor bude zlomen a zvítězí božský řád." # todo: NEW TRANSLATION
 ALG_fis_win: "Vítězství Islámské fronty spásy" # todo: NEW TRANSLATION
 ALG_fis_win_desc: "Díky vytrvalosti, jednotě a božskému vedení Islámská fronta spásy zvítězila nad svými protivníky. Cesta před námi je cestou duchovní vlády a obnovy. Pro Alžírsko začíná nová kapitola, definovaná vírou, spravedlností a Alláhovou vůlí." # todo: NEW TRANSLATION
 ALG_fis_win_tt: "§YOdemkne strom zaměření Islámské fronty spásy (FIS)§!" # todo: NEW TRANSLATION
 ALG_FIS_return: "Návrat Islámské fronty spásy" # todo: NEW TRANSLATION
 FIS_jamiat_al_karaouine: "Univerzita Al Karaouine" # todo: NEW TRANSLATION
 ALG_declare_jihad: "Vyhlášení džihádu" # todo: NEW TRANSLATION
 ALG_declare_jihad_desc: "Naše hnutí dospělo. Už se nebudeme omezovat na kázání a reformy. Nastal čas sjednotit věřící ve zbrani a vyhlásit džihád proti korupci a tyranii v zemích islámu." # todo: NEW TRANSLATION
 ALG_tharir_al_aqsa: "Tahrír al-Aksá" # todo: NEW TRANSLATION
 ALG_tharir_al_aqsa_desc: "Osvobození Al-Aksá je věčnou povinností Ummy. Shromáždíme věřící napříč Blízkým východem a vytvoříme posvátnou alianci pod jediným praporem odporu a jednoty." # todo: NEW TRANSLATION
 ALG_faction_with_middle_east: "Sjednotit se s blízkovýchodní frontou" # todo: NEW TRANSLATION
 ALG_faction_with_middle_east_desc: "Blízký východ zůstává duchovním srdcem islámu. Od Damašku po Mekku bude naše výzva znít a sjednotí sunnitské národy, které touží bránit Al-Aksá a vzdorovat utlačovatelům." # todo: NEW TRANSLATION
 ALG_faction_with_north_africa: "Sjednotit se se severoafrickou frontou" # todo: NEW TRANSLATION
 ALG_faction_with_north_africa_desc: "Naši bratři v severní Africe, od libyjských pouští po káhirské ulice, prožili stejné boje. Je čas oslovit je a pozvat je k naší věci." # todo: NEW TRANSLATION
 ALG_faction_with_asia: "Sjednotit se s východní frontou" # todo: NEW TRANSLATION
 ALG_faction_with_asia_desc: "Světlo islámu září i za Arábií. Národy Střední a Jižní Asie musí být vyzvány, aby se připojily k vzestupu Ummy — od stepí po ostrovy Východu." # todo: NEW TRANSLATION
 ALG_faction.1.t: "Pozvání z Alžíru" # todo: NEW TRANSLATION
 ALG_faction.1.d: "Naši vládu zastihlo diplomatické komuniké z Alžíru. Islámská fronta spásy, která nyní vládne Alžírsku, zve národy Blízkého východu, aby se připojily k nové koalici, Frontě osvobození Al-Aksá, jejímž cílem je koordinovat politickou a materiální podporu pro obranu a osvobození Al-Aksá. Přijetí by nás zavázalo k regionální věci; odmítnutí by nás oddělilo od alžírského projektu. Jak odpovíme?" # todo: NEW TRANSLATION
 ALG_faction.1.a: "Přijmout, připojit se k Frontě osvobození Al-Aksá" # todo: NEW TRANSLATION
 ALG_faction.1.b: "Odmítnout, k této regionální koalici se nepřipojíme" # todo: NEW TRANSLATION
 ALG_faction.2.t: "Návrh z Maghrebu" # todo: NEW TRANSLATION
 ALG_faction.2.d: "Delegace z Alžírska formálně pozvaly severoafrické vlády, aby přislíbily spolupráci v rámci nové koalice, Fronty osvobození Al-Aksá. Návrh usiluje o vytvoření maghrebské fronty ke koordinaci politického tlaku a humanitární podpory Palestině. Připojení by prohloubilo vztahy s Alžírem; odmítnutí by zachovalo naši současnou samostatnost. Jak odpovíme?" # todo: NEW TRANSLATION
 ALG_faction.2.a: "Ano, Maghreb bude stát při sobě" # todo: NEW TRANSLATION
 ALG_faction.2.b: "Ne, touto cestou se nevydáme" # todo: NEW TRANSLATION
 ALG_faction.3.t: "Výzva z Alžíru na Východ" # todo: NEW TRANSLATION
 ALG_faction.3.d: "Alžírští vyslanci oslovili asijské muslimské národy s nabídkou: připojit se k Frontě osvobození Al-Aksá, koalici zaměřené na koordinaci diplomatického, politického a materiálního úsilí na obranu Al-Aksá. Iniciativa žádá solidaritu napříč regiony, zároveň však hrozí zatažením do širších konfliktů. Připojíme se ke koalici Alžíru?" # todo: NEW TRANSLATION
 ALG_faction.3.a: "Připojit se, odpovíme na výzvu k solidaritě" # todo: NEW TRANSLATION
 ALG_faction.3.b: "Odmítnout, musíme se vyhnout tomuto zapletení" # todo: NEW TRANSLATION
 ALG_islamic_offices: "Zřízení islámských úřadů" # todo: NEW TRANSLATION
 ALG_islamic_offices_desc: "Abychom mohli vládnout podle zásad islámu, musí naše hnutí vybudovat organizovanou strukturu schopnou spravovat víru i stát. Zřízením islámských úřadů po celé zemi budeme dohlížet na náboženské vzdělávání, sociální záležitosti a morální vedení a zajistíme, aby vláda odpovídala hodnotám Ummy. Tyto úřady budou páteří našeho nového řádu a sjednotí lid pod vírou, kázní a spravedlností." # todo: NEW TRANSLATION
 alg_politics_news.1.t: "Abdallah Djaballah zakládá FJD" # todo: NEW TRANSLATION
 alg_politics_news.1.d: "Abdallah Djaballah, bývalý vůdce Hnutí za národní reformu (Islah) a zakladatel Ennahdy, oznámil vznik nové politické strany, Front pour la Justice et le Développement (FJD). FJD, inspirovaná tureckou Stranou spravedlnosti a rozvoje (AKP), usiluje o spojení islámských zásad s politickou umírněností a národním rozvojem. Hnutí chce obnovit důvěru veřejnosti v islamistickou politiku důrazem na spravedlnost, reformy a etickou vládu v alžírské éře po občanské válce." # todo: NEW TRANSLATION
 alg_politics_news.1.a: "Na alžírskou politickou scénu vstupuje nové islamistické hnutí." # todo: NEW TRANSLATION
 algerian.1.t: "Alžírská žádost o investice do infrastruktury" # todo: NEW TRANSLATION
 algerian.1.d: "Alžírská vláda nás oslovila s návrhem financovat výstavbu silnic spojujících farmy s trhy a rozvoj venkovské infrastruktury. Tato investice by zlepšila zemědělskou distribuci a průmyslovou kapacitu v Alžírsku a zároveň nám umožnila rozšířit politický a hospodářský vliv. Iniciativa by však vyžadovala finanční příspěvek z naší pokladny." # todo: NEW TRANSLATION
 algerian.1.a: "Financovat infrastrukturní projekt" # todo: NEW TRANSLATION
 algerian.1.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 algerian.4.t: "Schválena spolupráce v oblasti infrastruktury" # todo: NEW TRANSLATION
 algerian.4.d: "Tunisko souhlasilo s podporou naší iniciativy v oblasti infrastruktury spojující farmy s trhy. Investice posílí naše venkovské hospodářství a průmyslovou kapacitu a zároveň zlepší bilaterální vztahy." # todo: NEW TRANSLATION
 algerian.4.a: "Krok vpřed pro naše hospodářství" # todo: NEW TRANSLATION
 algerian.5.t: "Financování infrastruktury zamítnuto" # todo: NEW TRANSLATION
 algerian.5.d: "Tunisko odmítlo financovat naši navrhovanou infrastrukturní iniciativu. Bez zahraniční podpory bude rozvoj silnic spojujících farmy s trhy a souvisejících projektů opožděn." # todo: NEW TRANSLATION
 algerian.5.a: "Poradíme si sami" # todo: NEW TRANSLATION
 algeria_news.30.t: "Povstání Černého jara" # todo: NEW TRANSLATION
 algeria_news.30.d: "Po letech nepokojů v regionu Kabylie musíte rozhodnout, jak odpovědět na rostoucí požadavky berberského obyvatelstva." # todo: NEW TRANSLATION
 algeria_news.30.a: "Udělit Kabylům úplnou nezávislost" # todo: NEW TRANSLATION
 algeria_news.30.b: "Udělit Kabylům autonomii" # todo: NEW TRANSLATION
 algeria_news.30.c: "Potlačit povstání" # todo: NEW TRANSLATION
 algeria_news.30_a_tt: "Volba této cesty vytvoří nezávislý kabylský stát. Stabilita vzroste a získáme politickou moc." # todo: NEW TRANSLATION
 algeria_news.30_b_tt: "Volba autonomie udělí Kabylům omezenou samosprávu (Barbacha). Stabilita mírně vzroste a získáme politickou moc." # todo: NEW TRANSLATION
 algeria_news.30_c_tt: "Potlačení Kabylů sníží stabilitu a podporu války, ale získáte určitou politickou moc." # todo: NEW TRANSLATION
 AlgeriaFocusEvents.43.t: "Pozvání do Rady islámských světů" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.43.d: "Vedení [Root.GetName] obdrželo formální pozvání ke vstupu do Rady islámských světů. Členství by posílilo hospodářskou spolupráci mezi islámskými národy, otevřelo nové obchodní příležitosti a upevnilo naše společné politické směřování. Připojení by nás však mohlo vzdálit od neislámských hospodářských bloků." # todo: NEW TRANSLATION
 AlgeriaFocusEvents.43.a: "Připojit se k Radě" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.43.b: "Odmítnout pozvání" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.41.t: "Pozvání do Rady islámských světů" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.41.d: "Alžírsko nás formálně pozvalo ke vstupu do Rady islámských světů. Návrh zdůrazňuje hospodářskou spolupráci, politickou koordinaci a posílení vazeb mezi islámskými národy. Přijetí by mohlo zlepšit naše regionální postavení, zatímco odmítnutí může napnout vztahy." # todo: NEW TRANSLATION
 AlgeriaFocusEvents.41.a: "Je to dobrý nápad" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.41.b: "Nemáme zájem" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.411.t: "Irák odmítá pozvání" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.411.d: "Irácká vláda zdvořile odmítla naše pozvání ke vstupu do Rady islámských světů s odvoláním na strategické úvahy a národní priority." # todo: NEW TRANSLATION
 AlgeriaFocusEvents.411.a: "Je to nešťastné, ale bereme na vědomí" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.42.t: "Pozvání do Rady islámských světů" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.42.d: "Obdrželi jsme oficiální odpověď týkající se naší iniciativy rozšířit Radu islámských světů. Pozvaný národ zvažuje, zda se hospodářsky a politicky spojit s CIW." # todo: NEW TRANSLATION
 AlgeriaFocusEvents.42.a: "Přivítat je v Radě" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.42.b: "Odmítli" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.421.t: "Pozvání odmítnuto" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.421.d: "Pozvaná země odmítla účast v Radě islámských světů. Naše diplomatické úsilí bude nutné přesměrovat jinam." # todo: NEW TRANSLATION
 AlgeriaFocusEvents.421.a: "Dobrá tedy" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.81.t: "Pozvání do aliance CIW" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.81.desc: "Obdrželi jsme pozvání ke vstupu do aliance Rady islámských světů. Návrh slibuje větší spolupráci a vzájemnou podporu, může však na oplátku vyžadovat ústupky." # todo: NEW TRANSLATION
 AlgeriaFocusEvents.81.a: "Pouze s odpovídajícími zárukami" # todo: NEW TRANSLATION
 AlgeriaFocusEvents.81.b: "Rozhodně ne" # todo: NEW TRANSLATION
