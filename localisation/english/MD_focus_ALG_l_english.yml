 ALG_morocco.2.t: "Tlak AU/OSN na Maroko" # todo: NEW TRANSLATION
 ALG_morocco.2.d: "Po alžírské diplomatické kampani v AU a OSN čelí Maroko mezinárodnímu tlaku kvůli Západní Sahaře. Podvolí se království požadavkům, nebo bude vzdorovat a riskovat sankce?" # todo: NEW TRANSLATION
 ALG_morocco.2.a: "Podvolit se pod tlakem" # todo: NEW TRANSLATION
 ALG_morocco.2.b: "Vzdorovat tlaku a riskovat sankce" # todo: NEW TRANSLATION
 Algeria_events.5.t: "Úspěšná kampaň proti pytláctví" # todo: NEW TRANSLATION
 Algeria_events.5.desc: "Díky našemu koordinovanému úsilí byly v uplynulých měsících ochráněny stovky ohrožených zvířat. To nejen omezilo nelegální lov, ale také pomohlo zachovat křehké pouštní ekosystémy a zpomalit dopady desertifikace v postižených oblastech." # todo: NEW TRANSLATION
 Algeria_events.5.a: "Vynikající" # todo: NEW TRANSLATION
 Algeria_events.6.t: "Neúspěšná kampaň proti pytláctví" # todo: NEW TRANSLATION
 Algeria_events.6.desc: "Navzdory našim pokusům chránit divokou přírodu pytláci pokračují ve své činnosti jako obvykle. Pouštní ekosystém zůstává ohrožen a naše kampaň měla jen malý účinek na omezení desertifikace či nelegálního lovu." # todo: NEW TRANSLATION
 Algeria_events.6.a: "Všechno to úsilí přišlo vniveč!" # todo: NEW TRANSLATION
 ALG_ethnic_arab_display: "Arabové: [?ALG_ethnic_arab]%" # todo: NEW TRANSLATION
 ALG_ethnic_kabyle_display: "Kabylové: [?ALG_ethnic_kabyle]%" # todo: NEW TRANSLATION
 ALG_kabyle_content: "Kabylská spolupráce" # todo: NEW TRANSLATION
 ALG_kabyle_content_desc: "Kabylové, tradičně známí vysokou úrovní vzdělání, s nadšením přispívají k národnímu rozvoji a výzkumu." # todo: NEW TRANSLATION
 ALG_kabyle_discontent: "Hnutí za autonomii Kabylie" # todo: NEW TRANSLATION
 ALG_kabyle_discontent_desc: "Kabylští aktivisté organizují protesty a požadují uznání tamazightu a větší regionální autonomii. Nad regionem se vznáší stín Černého jara." # todo: NEW TRANSLATION
 ALG_kabyle_unrest: "Krize v Kabylie" # todo: NEW TRANSLATION
 ALG_kabyle_unrest_desc: "Region Kabylie otevřeně povstal. Protesty, stávky a občanská neposlušnost paralyzují region. Je nutná naléhavá akce." # todo: NEW TRANSLATION
 ALG_black_spring_happened: "Došlo k Černému jaru" # todo: NEW TRANSLATION
 ALG_has_conducted_census: "Provedlo celostátní sčítání lidu" # todo: NEW TRANSLATION
 ALG_ethnic_system_active: "Etnické záležitosti zavedeny" # todo: NEW TRANSLATION
 ALG_can_enact_ethnic_policy: "Lze přijmout novou etnickou politiku" # todo: NEW TRANSLATION
 algeria_power_balance: "Alžírský politický boj" # todo: NEW TRANSLATION
 algeria_old_guard: "Le Pouvoir (stará garda)" # todo: NEW TRANSLATION
 algeria_reformists: "Hnutí Hirak (reformisté)" # todo: NEW TRANSLATION
 algeria_compromise_range: "Křehký kompromis" # todo: NEW TRANSLATION
 algeria_compromise_range_desc: "Ani jedna strana nedominujte. Přetrvává neklidná patová situace, zatímco se obě frakce snaží získat výhodu." # todo: NEW TRANSLATION
 old_guard_leaning: "Vliv staré gardy" # todo: NEW TRANSLATION
 old_guard_leaning_desc: "Vojenský establishment začíná znovu upevňovat svou tradiční dominanci." # todo: NEW TRANSLATION
 old_guard_partial_control: "Upevnění staré gardy" # todo: NEW TRANSLATION
 old_guard_partial_control_desc: "Le Pouvoir utahuje svou kontrolu. Hlasy reformistů jsou marginalizovány." # todo: NEW TRANSLATION
 old_guard_strong_control: "Autoritářský posun" # todo: NEW TRANSLATION
 old_guard_strong_control_desc: "Bezpečnostní aparát dominuje politickému životu. Demokratické instituce erodují." # todo: NEW TRANSLATION
 old_guard_full_control: "Vojenská dominance" # todo: NEW TRANSLATION
 old_guard_full_control_desc: "Le Pouvoir ovládá Alžírsko železnou pěstí. Občanské svobody jsou výrazně omezeny." # todo: NEW TRANSLATION
 reformists_leaning: "Reformistické probouzení" # todo: NEW TRANSLATION
 reformists_leaning_desc: "Občanská společnost získává odvahu. Duch Hiraku ožívá." # todo: NEW TRANSLATION
 reformists_gaining_ground: "Dynamika reforem" # todo: NEW TRANSLATION
 reformists_gaining_ground_desc: "Reformní hnutí sílí. Stará garda se snaží udržet kontrolu." # todo: NEW TRANSLATION
 reformists_strong_momentum: "Demokratický vzestup" # todo: NEW TRANSLATION
 reformists_strong_momentum_desc: "Reformisté dominují veřejnému diskurzu. Skutečná změna se zdá být možná." # todo: NEW TRANSLATION
 reformists_victory: "Demokratický přechod" # todo: NEW TRANSLATION
 reformists_victory_desc: "Alžírsko přijímá civilní vládu a pluralismus. Moc Le Pouvoiru je zlomena." # todo: NEW TRANSLATION
 ALG_political_struggle: "Alžírský politický boj" # todo: NEW TRANSLATION
