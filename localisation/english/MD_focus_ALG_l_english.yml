 ALG_military_industrial_complex_desc: "Armáda rozšiřuje své ekonomické impérium, buduje zbrojní továrny a zajišťuje lukrativní obranné zakázky. Důstojnický sbor se stává podnikatelskou třídou, generálové zasedají ve správních radách a hromadí obrovské bohatství." # todo: NEW TRANSLATION
 ALG_patronage_networks_desc: "Síť klientelismu propojuje režim s podnikatelskými elitami a regionálními mocenskými prostředníky. Loajalita se kupuje smlouvami, licencemi a přístupem. Stát se stává nástrojem osobního obohacování." # todo: NEW TRANSLATION
 ALG_crush_all_opposition_desc: "Režim likviduje veškerou organizovanou opozici prostřednictvím zatýkání, cenzury a zastrašování. Politické strany jsou kooptovány nebo zakázány. Občanská společnost je zdecimována. Slyšet je pouze hlas režimu." # todo: NEW TRANSLATION
 ALG_control_hydrocarbons_desc: "Stát přebírá úplnou kontrolu nad sektorem uhlovodíků a přesměrovává příjmy z ropy a plynu přímo do pokladen režimu. Zahraniční partneři jsou vytlačováni, nezávislí provozovatelé pohlcováni a hluboký stát ovládá kohoutek." # todo: NEW TRANSLATION
 ALG_fortress_algeria_desc: "Alžírsko se stává posádkovým státem – militarizovaným, uzavřeným a nedůvěřivým vůči okolnímu světu. Armáda je silná, hranice zapečetěné a obyvatelstvo udržované v poslušnosti kombinací ropného bohatství a represí." # todo: NEW TRANSLATION
 ALG_oil_crash_weakens_regime_tt: "Propad cen ropy výrazně oslabil schopnost režimu kupovat sociální smír. Nespokojenost obyvatelstva roste." # todo: NEW TRANSLATION
 ALG_hirak_wins_tt: "Hnutí Hirak zvítězilo. Nové Alžírsko je možné." # todo: NEW TRANSLATION
 ALG_military_wins_tt: "Hluboký stát zvítězil. Vojenská vláda pokračuje v nové podobě." # todo: NEW TRANSLATION
 ALG_republic_new_era_tt: "Pro Alžírskou republiku začíná nová éra. Starý systém je rozebírán." # todo: NEW TRANSLATION
 ALG_parliamentary_republic_tt: "Alžírsko přijalo parlamentní systém vlády. Národní shromáždění je nejvyšší mocí." # todo: NEW TRANSLATION
 ALG_semi_presidential_republic_tt: "Alžírsko přijalo poloprezidentský systém vlády. Moc je rozdělena mezi prezidenta a parlament." # todo: NEW TRANSLATION
 ALG_presidential_republic_tt: "Alžírsko přijalo prezidentský systém vlády. Prezident disponuje dominantní výkonnou pravomocí." # todo: NEW TRANSLATION
 ALG_patronage_enriches_regime_tt: "Klientelistické sítě obohacují režim a jeho spojence na úkor alžírského lidu." # todo: NEW TRANSLATION
 ALG_fortress_state_tt: "Alžírsko se stalo pevnostním státem. Hluboký stát vládne absolutně a národ je uzavřen světu." # todo: NEW TRANSLATION
 ALG_military_industrial_economy: "Vojensko-průmyslová ekonomika" # todo: NEW TRANSLATION
 ALG_state_hydrocarbon_monopoly: "Státní monopol na uhlovodíky" # todo: NEW TRANSLATION
 ALG_fortress_state: "Pevnostní stát" # todo: NEW TRANSLATION
 ALG_military_industrial_economy_desc: "Armáda expandovala do výroby zbraní a obranného průmyslu a vytvořila pro režim soběstačnou ekonomickou základnu. Generálové zasedají ve správních radách a hranice mezi uniformou a obchodním oblekem se rozmazala." # todo: NEW TRANSLATION
 ALG_state_hydrocarbon_monopoly_desc: "Úplná státní kontrola nad příjmy z ropy a plynu financuje režim a jeho klientelistické sítě. Sektor uhlovodíků je uzavřeným světem, v němž mohou působit pouze lidé s konexemi." # todo: NEW TRANSLATION
 ALG_fortress_state_desc: "Alžírsko se stalo uzavřeným militarizovaným státem. Armáda je mocná, společnost kontrolovaná a hluboký stát vládne bez výzvy. Stabilita byla vykoupena cenou svobody." # todo: NEW TRANSLATION
 ALG_redmed_group_expansion: "Rozšíření RedMed Group" # todo: NEW TRANSLATION
 ALG_redmed_group_expansion_desc: "RedMed Group se osvědčila jako spolehlivý logistický partner ropného a plynárenského sektoru v okolí Hassi Messaoudu. Při správných investicích se může rozvinout v širší průmyslovou sílu." # todo: NEW TRANSLATION
 ALG_star_aviation_operations: "Provoz Star Aviation" # todo: NEW TRANSLATION
 ALG_star_aviation_operations_desc: "Letecká dceřiná společnost RedMed Group si od svého založení udržuje bezchybnou bezpečnostní bilanci. Měli bychom tuto pověst využít k prohloubení našeho zapojení v leteckém sektoru." # todo: NEW TRANSLATION
 ALG_military_aviation_contract: "Vojenské letecké zakázky" # todo: NEW TRANSLATION
 ALG_military_aviation_contract_desc: "Provozní dokonalost Star Aviation upoutala pozornost armády. Zajištění obranných zakázek otevře dveře pokročilému leteckému vývoji a financuje další fázi expanze." # todo: NEW TRANSLATION
 ALG_missile_development_initiative: "Iniciativa vývoje raket" # todo: NEW TRANSLATION
 ALG_missile_development_initiative_desc: "Moderní armáda se nemůže spoléhat pouze na zahraniční zbraně. Prostřednictvím RedMed Group zahájíme domácí raketový program a položíme základy strategického odstrašení." # todo: NEW TRANSLATION
 ALG_star_aviation_uav_division: "Divize bezpilotních prostředků Star Aviation" # todo: NEW TRANSLATION
 ALG_star_aviation_uav_division_desc: "Se zahraniční technologií bezpilotních prostředků v rukou je Star Aviation připravena založit specializovanou dronovou divizi. Alžírští inženýři budou studovat, upravovat a nakonec překonají to, co jim bylo předáno." # todo: NEW TRANSLATION
 ALG_domestic_uav_production: "Domácí výroba bezpilotních prostředků" # todo: NEW TRANSLATION
 ALG_domestic_uav_production_desc: "Fáze reverzního inženýrství je dokončena. Zařízení Star Aviation jsou připravena sériově vyrábět bezpilotní prostředky alžírského návrhu. Už nejde o dovoz, ale o suverenitu." # todo: NEW TRANSLATION
 ALG_russian_missile_cooperation: "Ruská spolupráce v oblasti raket" # todo: NEW TRANSLATION
 ALG_russian_missile_cooperation_desc: "Ruský raketový průmysl patří k nejpokročilejším na světě. Partnerství s Moskvou náš program výrazně urychlí, ovšem za cenu hlubší závislosti na ruské přízni." # todo: NEW TRANSLATION
 ALG_chinese_missile_cooperation: "Čínská spolupráce v oblasti raket" # todo: NEW TRANSLATION
 ALG_chinese_missile_cooperation_desc: "Čína projevila ochotu sdílet raketové technologie s přátelskými státy. Dohoda s Pekingem nabízí přístup k moderním systémům a posiluje naše postavení v rozvíjejícím se multipolárním světě." # todo: NEW TRANSLATION
 ALG_redmed_star_convergence: "Konvergence RedMed a Star" # todo: NEW TRANSLATION
 ALG_redmed_star_convergence_desc: "Nastal čas sjednotit raketovou divizi RedMed s bezpilotními schopnostmi Star Aviation v rámci jediné integrované obranné struktury. Alžírsko již nebude svou bezpečnost dovážet, ale vyrábět." # todo: NEW TRANSLATION
 ALG_regional_defense_leader: "Vůdce obrany Maghrebu" # todo: NEW TRANSLATION
 ALG_regional_defense_leader_desc: "Alžírský obranný průmysl nyní nemá v Maghrebu konkurenci. Naše bezpilotní prostředky hlídkují nad Saharou, naše rakety odstrašují soupeře a naši technologii vyhledávají sousedé, kteří se dříve obraceli k Evropě. Takto vypadá suverenita." # todo: NEW TRANSLATION
 ALG_uav_procurement_category: "Nákup bezpilotních prostředků" # todo: NEW TRANSLATION
 ALG_uav_procurement_category_desc: "Star Aviation potřebuje referenční platformu pro zahájení reverzního inženýrství. Vyberte zahraničního dodavatele bezpilotních prostředků." # todo: NEW TRANSLATION
 ALG_drone_program_category: "Program vývoje dronů" # todo: NEW TRANSLATION
 ALG_drone_program_category_desc: "Divize bezpilotních prostředků Star Aviation je připravena vyvinout první domácí alžírský dron. Zvolte směr vývoje." # todo: NEW TRANSLATION
 ALG_purchase_turkish_uavs: "Nakoupit turecké bezpilotní prostředky" # todo: NEW TRANSLATION
 ALG_purchase_turkish_uavs_desc: "Bayraktar TB2 se osvědčil v několika konfliktech. Jeho pořízení z Turecka poskytne provozní zkušenosti s bezpilotními prostředky a solidní platformu pro reverzní inženýrství, za cenu užšího přiblížení Ankaře." # todo: NEW TRANSLATION
 ALG_purchase_chinese_uavs: "Nakoupit čínské bezpilotní prostředky" # todo: NEW TRANSLATION
 ALG_purchase_chinese_uavs_desc: "Čínský Wing Loong II nabízí srovnatelné schopnosti se západními systémy za zlomek ceny. Peking také prokázal ochotu zahrnout do podobných dohod ustanovení o transferu technologií." # todo: NEW TRANSLATION
 ALG_purchase_iranian_uavs: "Nakoupit íránské bezpilotní prostředky" # todo: NEW TRANSLATION
 ALG_purchase_iranian_uavs_desc: "Íránský Mohajer-6 je cenově efektivní a bojem prověřený. Jeho pořízení z Teheránu je nejlevnější možností a prohloubí vazby s přirozeným strategickým partnerem, může však přitáhnout mezinárodní pozornost." # todo: NEW TRANSLATION
 ALG_develop_amel_recon_uav: "Vyvinout bezpilotní prostředek Amel" # todo: NEW TRANSLATION
 ALG_develop_amel_recon_uav_desc: "Amel bude prvním domácím průzkumným bezpilotním prostředkem Alžírska, vytrvalostní platformou optimalizovanou pro dohled nad hranicemi a shromažďování zpravodajských informací nad rozsáhlým saharským jihem." # todo: NEW TRANSLATION
 ALG_develop_el_djazair_ucav: "Vyvinout bojový dron El-Djazair" # todo: NEW TRANSLATION
 ALG_develop_el_djazair_ucav_desc: "El-Djazair bude skutečným bojovým dronem, ozbrojeným bezpilotním bojovým letounem schopným přesných úderů. Bude dražší a technicky náročnější než průzkumná platforma, ale zároveň mnohem účinnějším vojenským prostředkem." # todo: NEW TRANSLATION
 ALG_develop_swarm_loitering: "Vyvinout rojovou povalující se munici" # todo: NEW TRANSLATION
 ALG_develop_swarm_loitering_desc: "Namísto jediného velkého dronu bude Alžírsko investovat do rojů malých, levných a koordinovaných povalujících se zbraní. Hůře se zachycují, ve velkém počtu jsou ničivé a jejich sériová výroba je levnější." # todo: NEW TRANSLATION
 ALG_redmed_group_tt: "§GRedMed Group expanduje od logistiky ropného a plynárenského sektoru k širším průmyslovým schopnostem.§!" # todo: NEW TRANSLATION
 ALG_star_aviation_founded_tt: "§GProvozní dokonalost Star Aviation ji staví do pozice vhodné pro vojenské zakázky.§!" # todo: NEW TRANSLATION
 ALG_military_contract_tt: "§GStar Aviation získala vojenské zakázky. Nyní jsou dostupná rozhodnutí o nákupu bezpilotních prostředků.§!" # todo: NEW TRANSLATION
 ALG_uav_division_tt: "§GByla založena specializovaná divize bezpilotních prostředků. Nyní jsou dostupná rozhodnutí o vývoji dronů.§!" # todo: NEW TRANSLATION
 ALG_domestic_production_tt: "§GAlžírsko nyní může vyrábět bezpilotní prostředky doma.§!" # todo: NEW TRANSLATION
 ALG_amel_developed_tt: "§GPrůzkumný bezpilotní prostředek Amel byl úspěšně vyvinut.§!" # todo: NEW TRANSLATION
 ALG_ucav_developed_tt: "§GBojový bezpilotní prostředek El-Djazair je nyní operační.§!" # todo: NEW TRANSLATION
 ALG_swarm_developed_tt: "§GAlžírsko vyvinulo schopnost používat rojovou povalující se munici.§!" # todo: NEW TRANSLATION
 ALG_missile_division_tt: "§GRedMed Group založila specializovanou divizi vývoje raket.§!" # todo: NEW TRANSLATION
 ALG_redmed_leader_tt: "§GRedMed Group a Star Aviation se sloučily v jednotný obranně-průmyslový komplex.§!" # todo: NEW TRANSLATION
 ALG_defense_leader_tt: "§GAlžírsko je uznáváno jako přední stát Maghrebu v oblasti obranných technologií.§!" # todo: NEW TRANSLATION
 ALG_uav_procured: "Zahraniční bezpilotní prostředky již nakoupeny" # todo: NEW TRANSLATION
 ALG_drone_variant_chosen: "Domácí varianta dronu již vybrána" # todo: NEW TRANSLATION
 ALG_redmed_group_logistics: "Logistika RedMed Group" # todo: NEW TRANSLATION
 ALG_redmed_group_logistics_desc: "RedMed Group poskytuje komplexní logistické služby alžírskému ropnému a plynárenskému sektoru." # todo: NEW TRANSLATION
 ALG_redmed_star_aviation: "Provoz Star Aviation" # todo: NEW TRANSLATION
 ALG_redmed_star_aviation_desc: "Star Aviation si udržuje bezchybnou bezpečnostní bilanci. Její provozní přesnost je nyní přesměrovávána k leteckému vývoji." # todo: NEW TRANSLATION
 ALG_star_aviation_military: "Vojenské zakázky Star Aviation" # todo: NEW TRANSLATION
 ALG_star_aviation_military_desc: "Star Aviation získala vojenské zakázky a přenáší svou civilní provozní dokonalost do obranného sektoru." # todo: NEW TRANSLATION
 ALG_star_aviation_uav_division_idea: "Divize bezpilotních prostředků Star Aviation" # todo: NEW TRANSLATION
 ALG_star_aviation_uav_division_idea_desc: "Specializovaná dronová divize studuje zahraniční platformy bezpilotních prostředků s cílem rozvinout vlastní alžírské schopnosti." # todo: NEW TRANSLATION
 ALG_star_aviation_uav_production: "Výroba bezpilotních prostředků Star Aviation" # todo: NEW TRANSLATION
 ALG_star_aviation_uav_production_desc: "Star Aviation nyní sériově vyrábí bezpilotní prostředky alžírského návrhu." # todo: NEW TRANSLATION
 ALG_redmed_integrated_defense_systems: "Integrovaná obrana RedMed" # todo: NEW TRANSLATION
 ALG_redmed_integrated_defense_systems_desc: "RedMed Group sloučila své programy bezpilotních prostředků a raket do jednotného komplexu pokročilých zbraní." # todo: NEW TRANSLATION
 ALG_maghreb_defense_powerhouse: "Obranná velmoc Maghrebu" # todo: NEW TRANSLATION
 ALG_maghreb_defense_powerhouse_desc: "Alžírský obranný průmysl vedený společnostmi RedMed Group a Star Aviation je nejpokročilejší v severní Africe." # todo: NEW TRANSLATION
 ALG_aerospace_training_program: "Program leteckého a kosmického výcviku" # todo: NEW TRANSLATION
 ALG_aerospace_training_program_desc: "Národní program připravuje letecké a kosmické inženýry a techniky dronů, aby podpořil rostoucí alžírský obranný průmysl." # todo: NEW TRANSLATION
 ALG_combat_uav_program: "Program bojových bezpilotních prostředků" # todo: NEW TRANSLATION
 ALG_combat_uav_program_desc: "Aktivní vývoj ozbrojených bezpilotních prostředků zvyšuje údernou kapacitu alžírského letectva." # todo: NEW TRANSLATION
 ALG_redmed_missile_division_idea: "Raketová divize RedMed" # todo: NEW TRANSLATION
 ALG_redmed_missile_division_idea_desc: "Specializované raketové vývojové oddělení RedMed Group buduje alžírské strategické odstrašení od základů." # todo: NEW TRANSLATION
 ALG_cruise_missile_development: "Vývoj střel s plochou dráhou letu" # todo: NEW TRANSLATION
 ALG_cruise_missile_development_desc: "Aktivní program střel s plochou dráhou letu poprvé poskytuje Alžírsku schopnost přesných úderů na dlouhou vzdálenost." # todo: NEW TRANSLATION
 ALG_precision_strike_capability: "Schopnost přesných úderů" # todo: NEW TRANSLATION
 ALG_precision_strike_capability_desc: "Integrované raketové a bezpilotní systémy poskytly Alžírsku skutečnou schopnost přesných úderů." # todo: NEW TRANSLATION
 ALG_defense_export_industry: "Obranný exportní průmysl" # todo: NEW TRANSLATION
 ALG_defense_export_industry_desc: "Alžírské bezpilotní prostředky a rakety jsou nyní k dispozici pro vývoz. Každý prodej představuje příjem i diplomatickou páku." # todo: NEW TRANSLATION
 ALG_redmed_group_concern: "RedMed Group" # todo: NEW TRANSLATION
 ALG_redmed_group_concern_desc: "Přední alžírský průmyslový konglomerát s kořeny v logistice ropného a plynárenského sektoru. RedMed Group se rozrostla v hlavního alžírského výrobce obranné techniky a vyrábí bezpilotní prostředky a raketové systémy pro ozbrojené síly." # todo: NEW TRANSLATION
 ALG_star_aviation_concern: "Star Aviation" # todo: NEW TRANSLATION
 ALG_star_aviation_concern_desc: "Letecká dceřiná společnost RedMed Group. Byla založena v roce 2001 a pyšní se bezchybnou bezpečnostní bilancí. Star Aviation nyní vede domácí alžírské programy letecké techniky a výroby dronů." # todo: NEW TRANSLATION
