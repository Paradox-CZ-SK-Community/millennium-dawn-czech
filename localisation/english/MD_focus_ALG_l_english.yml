 ALG_presidency.1.t: "Napětí s armádou" # todo: NEW TRANSLATION
 ALG_presidency.1.d: "Po jmenování vůdce MSP prezidentem je vojenská elita rozzuřená. Považuje to za hrozbu pro své dlouholeté držení moci. Kolují zvěsti o tajných mobilizacích a ozbrojené jednotky loajální staré gardě se začínají přesouvat. Přijme armáda tuto změnu, nebo se vzbouří?" # todo: NEW TRANSLATION
