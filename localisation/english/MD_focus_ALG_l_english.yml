 ALG_promote_sovereignty: "Prosazovat suverenitu" # todo: NEW TRANSLATION
 ALG_promote_sovereignty_desc: "" # todo: NEW TRANSLATION
 ALG_promote_human_rights: "Prosazovat lidská práva" # todo: NEW TRANSLATION
 ALG_promote_human_rights_desc: "Lidská práva nade vše, i kdyby to bylo na úkor národní suverenity." # todo: NEW TRANSLATION
 ALG_extract_favorable_terms: "Vyjednat výhodné podmínky" # todo: NEW TRANSLATION
 ALG_extract_favorable_terms_desc: "" # todo: NEW TRANSLATION
 ALG_a_norm_entrepreneur: "Tvůrce norem" # todo: NEW TRANSLATION
