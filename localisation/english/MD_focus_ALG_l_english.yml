 ALG_oil_focused_energy_self_sufficient_desc: "Alžírsko se rozhodlo využít své nevyužité ropné zdroje a stát se soběstačným ve výrobě energie. Ropa je levná a snadno dostupná, ale není zrovna ekologicky šetrným řešením." # todo: NEW TRANSLATION
