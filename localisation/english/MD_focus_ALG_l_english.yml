 ALG_digital_initiative_tt: "§GAlžírsko zahajuje rozsáhlý program digitální transformace:§!\n- Modernizace vládních služeb\n- Rozšíření internetové infrastruktury\n- Podpora technologických startupů\n- Školení pracovní síly v digitálních dovednostech" # todo: NEW TRANSLATION
