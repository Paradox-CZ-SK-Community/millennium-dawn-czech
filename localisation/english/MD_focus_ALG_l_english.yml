 ALG_sahel_initiatives: "Rozšířit vliv v Sahelu" # todo: NEW TRANSLATION
 ALG_sahel_initiatives_desc: "Nestabilitu a terorismus v Sahelu budeme potírat prostřednictvím měkké síly a obrany." # todo: NEW TRANSLATION
 ALG_choose_global_partner: "Zvolit globálního partnera" # todo: NEW TRANSLATION
 ALG_choose_global_partner_desc: "Musíme se hospodářsky a vojensky spojit s jednou ze světových supervelmocí." # todo: NEW TRANSLATION
 ALG_align_with_us: "Spojit se se Spojenými státy" # todo: NEW TRANSLATION
 ALG_align_with_us_desc: "Spolupráce se Spojenými státy může přinést bezpečnost a hospodářský vliv." # todo: NEW TRANSLATION
 ALG_align_with_china: "Spojit se s Čínskou lidovou republikou" # todo: NEW TRANSLATION
 ALG_align_with_china_desc: "Čína nabízí hospodářský rozvoj bez vměšování a značný investiční potenciál." # todo: NEW TRANSLATION
 ALG_align_with_russia: "Spojit se s Ruskou federací" # todo: NEW TRANSLATION
 ALG_align_with_russia_desc: "Rusko poskytuje vojenské technologie a sdílí alžírský skepticismus vůči západní dominanci." # todo: NEW TRANSLATION
 ALG_non_aligned_revival: "Obnovit nezúčastněnou zahraniční politiku" # todo: NEW TRANSLATION
 ALG_non_aligned_revival_desc: "Obnovíme ducha neutrality a solidarity jihu, stejně jako v 60. letech." # todo: NEW TRANSLATION
 ALG_global_south_solidarity: "Solidarita globálního Jihu" # todo: NEW TRANSLATION
 ALG_global_south_solidarity_desc: "Alžírsko posílí vztahy s postkoloniálními národy prostřednictvím obchodu, diplomacie a pomoci." # todo: NEW TRANSLATION
 ALG_future_national_policy: "§G Budoucnost Alžírska§!" # todo: NEW TRANSLATION
 ALG_future_national_policy_desc: "Po skončení občanské války musíme nyní určit nový politický směr Alžírska.\n §RPOZNÁMKA§!: §YPokud zvolíte toto zaměření, odemknou se zaměření, která nakonec přepíší současný strom zaměření vlastním stromem pro každou stranu. Před jeho dokončením proto dokončete ostatní důležitá zaměření§!" # todo: NEW TRANSLATION
 ALG_approach_nato: "§CPřiblížit se NATO§!" # todo: NEW TRANSLATION
