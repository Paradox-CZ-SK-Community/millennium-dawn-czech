 alg.450.t: "Alžírsko upadá do občanského konfliktu" # todo: NEW TRANSLATION
 alg.450.d: "Narůstající křivdy a hroutící se stabilita zatlačily národ za hranici únosnosti. Povstávají ozbrojené frakce, stát se rozpadá a Alžírsko je vrženo do nové éry vnitřního konfliktu." # todo: NEW TRANSLATION
