 ALG_reactioners6: "Klastrové hospodářství" # todo: NEW TRANSLATION
 ALG_reactioners7: "Klastrové hospodářství" # todo: NEW TRANSLATION
 ALG_automobile_industry: "Rozvíjet automobilový průmysl" # todo: NEW TRANSLATION
 ALG_automobile_industry_desc: "Alžírsko se již dlouho spoléhá na dovoz, aby pokrylo své automobilové potřeby. Rozvojem domácího automobilového průmyslu můžeme vytvořit pracovní místa, omezit dovoz a etablovat Alžírsko jako regionální výrobní centrum." # todo: NEW TRANSLATION
 ALG_peugeot_deal: "Investice Peugeotu" # todo: NEW TRANSLATION
 ALG_peugeot_deal_desc: "Peugeot projevil zájem o otevření závodu v Alžírsku. Toto partnerství by nám mohlo poskytnout tolik potřebnou průmyslovou kapacitu." # todo: NEW TRANSLATION
 ALG_renault_oran: "Renault v Oranu" # todo: NEW TRANSLATION
 ALG_renault_oran_desc: "Renault je ochoten zahájit výrobu v Oranu, zajistit stabilní přísun vozidel a podpořit naše hospodářství." # todo: NEW TRANSLATION
 ALG_hyundai_tiaret: "Hyundai v Tiaretu" # todo: NEW TRANSLATION
 ALG_hyundai_tiaret_desc: "Jihokorejský Hyundai je připraven navázat partnerství v Tiaretu, vytvořit pracovní místa a snížit naši závislost na evropských výrobcích." # todo: NEW TRANSLATION
 ALG_volkswagen_relizane: "Volkswagen v Relizane" # todo: NEW TRANSLATION
 ALG_volkswagen_relizane_desc: "Volkswagen a jeho přidružené značky (Škoda, Audi, Seat) jsou připraveny otevřít závod v Relizane, čímž dále diverzifikují naši průmyslovou základnu." # todo: NEW TRANSLATION
 ALG_bmw_deal: "Partnerství s BMW" # todo: NEW TRANSLATION
 ALG_bmw_deal_desc: "Německé BMW projevilo zájem o montáž luxusních a prémiových vozidel v Alžírsku, čímž by náš automobilový průmysl pozvedlo na mezinárodní úroveň." # todo: NEW TRANSLATION
 ALG_mercedes_trucks: "Nákladní vozy Mercedes" # todo: NEW TRANSLATION
 ALG_mercedes_trucks_desc: "Spoluprací se společností Daimler můžeme v Alžírsku montovat vojenské nákladní vozy Mercedes a těžká vozidla, a přímo tak podporovat naše ozbrojené síly." # todo: NEW TRANSLATION
 ALG_auto_scandal: "Korupční skandál automobilového průmyslu" # todo: NEW TRANSLATION
 ALG_auto_scandal_desc: "Odhalení odhalila, že alžírský automobilový průmysl je podvodem prolezlým korupcí, v němž byly zneužity dotace a továrny nedělaly nic víc než montáž dovezených sad. Skandál bude mít vážné politické a hospodářské důsledky." # todo: NEW TRANSLATION
 ALG_import_ban: "Zakázat dovoz automobilů" # todo: NEW TRANSLATION
 ALG_import_ban_desc: "Ve snaze ochránit domácí průmysl zakážeme dovoz většiny zahraničních automobilů. Toto opatření je kontroverzní a krátkodobě vytvoří hospodářský tlak." # todo: NEW TRANSLATION
 ALG_fiat_deal: "Investiční dohoda s Fiatem" # todo: NEW TRANSLATION
 ALG_fiat_deal_desc: "Fiat nabídl návrat do Alžírska s moderním průmyslovým komplexem a slibuje obnovit výrobu i důvěru veřejnosti v náš automobilový sektor." # todo: NEW TRANSLATION
 ALG_indigenous_brand: "Vytvořit domácí značku" # todo: NEW TRANSLATION
 ALG_indigenous_brand_desc: "Místo spoléhání na zahraniční společnosti by Alžírsko mělo vytvořit vlastního domácího výrobce automobilů, navrhovaného a vyráběného místními Alžířany." # todo: NEW TRANSLATION
 ALG_auto_exports: "Vyvážet alžírské automobily" # todo: NEW TRANSLATION
 ALG_auto_exports_desc: "Se stabilním domácím automobilovým průmyslem se nyní můžeme obrátit ven a začít vyvážet vozidla vyrobená v Alžírsku na africké a středomořské trhy." # todo: NEW TRANSLATION
 alg.1000.t: "Korupční skandál automobilového průmyslu" # todo: NEW TRANSLATION
 alg.1000.d: "Alžírským automobilovým sektorem otřásl rozsáhlý korupční skandál. Vyšetřování odhalilo, že mnohé takzvané „továrny“ byly pouhými montovnami, které zneužívaly státní dotace a nadhodnocovaly náklady. Důvěra veřejnosti se hroutí a průmyslu hrozí ochromení." # todo: NEW TRANSLATION
 alg.1000.a: "Národní ponížení." # todo: NEW TRANSLATION
 ALG_tebboune_tt: "Abdelmadjid Tebboune se po protestech Hiraku v roce 2019 stává prezidentem Alžírska. Notoricky známý gang zkorumpovaných politiků, včetně Ahmeda Ouyahii, Abdelmaleka Sellala, Aliho Haddada a Mahieddina Tahkouta, je zatčen a postaven před soud. To znamená začátek nové éry, ačkoli mnozí pochybují, jak hluboké reformy skutečně budou." # todo: NEW TRANSLATION
 ALG_corruption_network: "Bouteflikovo okolí" # todo: NEW TRANSLATION
 ALG_corruption_network_desc: "Zkorumpovaná síť politiků a podnikatelů včetně Ouyahii, Sellala a Tahkouta dominuje alžírské politice. Jejich vliv oslabuje stát a podněcuje veřejný hněv." # todo: NEW TRANSLATION
 ALG_cleaning_the_state: "Očista státu" # todo: NEW TRANSLATION
 ALG_clean_government: "Čistá vláda" # todo: NEW TRANSLATION
 ALG_political_repression: "Politická represe" # todo: NEW TRANSLATION
 ALG_military_junta: "Vojenská junta" # todo: NEW TRANSLATION
 ALG_cleaning_the_state_desc: "Po pádu Bouteflikova okolí Alžírsko konečně podniká kroky k vymýcení korupce ve svých institucích a obnovení důvěry lidu." # todo: NEW TRANSLATION
 algeria_reforms.1.t: "Reformy za Tebbounea" # todo: NEW TRANSLATION
 algeria_reforms.1.d: "Po rezignaci Abdelazize Boutefliky a zvolení Abdelmadjida Tebbounea vstupuje Alžírsko do nové politické kapitoly. Tebboune slíbil reformy, novou ústavu a rozbití nechvalně proslulé korupční sítě známé jako „ʿIsābah“ (gang), do níž patřili bývalí premiéři Ahmed Ouyahia, Abdelmalek Sellal a podnikatelští magnáti jako Ali Haddad a Mahieddine Tahkout. \n\nHnutí Hirak však jeho slibům zůstává skeptické. Povedou tyto reformy ke skutečné demokratizaci, nebo jde jen o způsob, jak zachovat režim pod novým vedením?" # todo: NEW TRANSLATION
 algeria_reforms.1.a: "Podpořit Tebbouneovy reformy" # todo: NEW TRANSLATION
 algeria_reforms.1.b: "Lid požaduje víc!" # todo: NEW TRANSLATION
 ALG_arrest_the_gang: "Zatknout Bouteflikovo okolí" # todo: NEW TRANSLATION
 ALG_arrest_the_gang_desc: "Alžírský lid požaduje spravedlnost. Tebboune bude pokračovat v trestním stíhání Ouyahii, Sellala, Haddada, Tahkouta a dalších zkorumpovaných představitelů, kteří vysáli bohatství národa." # todo: NEW TRANSLATION
 ALG_at_a_crossroads: "Národ na křižovatce" # todo: NEW TRANSLATION
 ALG_at_a_crossroads_desc: "V době, kdy náš národ čelí bezprecedentním výzvám, stojíme v rozhodujícím okamžiku svých dějin. Rozhodnutí, která nyní učiníme, utvářejí naši budoucnost a určují směr naší společnosti. Přijmeme změnu a reformu, nebo se přidržíme minulosti? Zvolená cesta určí náš odkaz." # todo: NEW TRANSLATION
 ALG_promises_of_reform: "Sliby reforem" # todo: NEW TRANSLATION
 ALG_promises_of_reform_desc: "Nové Alžírsko potřebuje novou ústavu. Tebboune slibuje reformy omezující prezidentské mandáty, posilující parlament a zaručující více svobod." # todo: NEW TRANSLATION
 ALG_suppressed_opposition: "Potlačená opozice" # todo: NEW TRANSLATION
 ALG_black_decade_methods: "Metody černého desetiletí" # todo: NEW TRANSLATION
 ALG_black_market: "Černý trh" # todo: NEW TRANSLATION
 ALG_pna_expansion: "Rozšíření Národní lidové armády" # todo: NEW TRANSLATION
 ALG_global_power: "Globální velmoc" # todo: NEW TRANSLATION
 ALG_crackdown_on_dissent: "Represe proti Hiraku" # todo: NEW TRANSLATION
 ALG_crackdown_on_dissent_desc: "Protesty neustaly. Místo dialogu si Tebboune zvolil represi v naději, že umlčí nesouhlas a zachová stát." # todo: NEW TRANSLATION
 ALG_rebuild_trust_investors: "Obnovit důvěru investorů" # todo: NEW TRANSLATION
 ALG_rebuild_trust_investors_desc: "Po letech korupce a nestability musíme znovu získat důvěru zahraničních i domácích investorů v naše hospodářství." # todo: NEW TRANSLATION
 ALG_diversify_economy: "Diverzifikovat hospodářství" # todo: NEW TRANSLATION
 ALG_diversify_economy_desc: "Alžírsko se nemůže spoléhat pouze na ropu a plyn. Obnovitelné zdroje, zemědělství a výroba budou pilíři naší budoucnosti." # todo: NEW TRANSLATION
 ALG_social_subsidies: "Chránit sociální dotace" # todo: NEW TRANSLATION
 ALG_social_subsidies_desc: "Lidé jsou závislí na dotacích na palivo, chléb a bydlení. Tebboune slibuje zachovat tuto ochranu navzdory hospodářským problémům." # todo: NEW TRANSLATION
 ALG_balance_regional_powers: "Vyvažovat regionální mocnosti" # todo: NEW TRANSLATION
 ALG_balance_regional_powers_desc: "Alžírsko stojí mezi Evropou, Afrikou a arabským světem. Musíme zachovat vyváženou zahraniční politiku, která slouží našim zájmům." # todo: NEW TRANSLATION
 ALG_strengthen_russia_ties: "Posílit vztahy s Ruskem" # todo: NEW TRANSLATION
 ALG_strengthen_russia_ties_desc: "Naše historické přátelství s Moskvou lze prohloubit obrannou spoluprací a energetickými dohodami." # todo: NEW TRANSLATION
 ALG_china_investments: "Čínské investice" # todo: NEW TRANSLATION
 ALG_china_investments_desc: "Iniciativa Pásu a stezky nabízí Alžírsku šanci modernizovat infrastrukturu a přilákat velké čínské investiční projekty." # todo: NEW TRANSLATION
 ALG_north_south_highway: "Projekt dálnice Sever–Jih" # todo: NEW TRANSLATION
 ALG_automobile_factories: "Automobilový průmysl" # todo: NEW TRANSLATION
 ALG_automobile_factories_desc: "Abychom zaměstnali naše obyvatelstvo a získali větší hospodářskou kapacitu, možná budeme muset pozvat zahraniční výrobce automobilů do naší země." # todo: NEW TRANSLATION
 algeria_policy.1.t: "Odsouzení koloniálních režimů" # todo: NEW TRANSLATION
 algeria_policy.1.d: "FLN vydala důrazné odsouzení minulých koloniálních režimů a zločinů spáchaných během okupace Alžírska. Prohlášení podnítilo doma národní hrdost, ale vyvolalo hněv v Paříži a zhoršilo alžírsko-francouzské vztahy." # todo: NEW TRANSLATION
 algeria_policy.1.a: "Odhalit zločiny kolonialismu!" # todo: NEW TRANSLATION
 algeria_disaster.1.t: "Zemětřesení v Boumerdès" # todo: NEW TRANSLATION
 algeria_disaster.1.d: "Severní Alžírsko zasáhlo ničivé zemětřesení s epicentrem poblíž města Boumerdès. Tisíce lidí přišly o život, desítky tisíc dalších byly zraněny a rozsáhlé části Alžíru i pobřežního regionu se proměnily v trosky. Národ je v šoku, zatímco záchranné operace se snaží zvládnout rozsah katastrofy. K obnovení pořádku a poskytnutí pomoci postiženému obyvatelstvu je nutná okamžitá akce." # todo: NEW TRANSLATION
 algeria_disaster.1.a: "Mobilizovat záchranné týmy a zahájit obnovu" # todo: NEW TRANSLATION
 ALG_earthquake_recovery_tt: "Začínají záchranné operace. Vláda brzy rozhodne, jak financovat obnovu." # todo: NEW TRANSLATION
 algeria_disaster.2.t: "Obnova a záchranné úsilí" # todo: NEW TRANSLATION
 algeria_disaster.2.d: "Následky zemětřesení zanechaly Alžírsko tváří v tvář jedné z nejhorších humanitárních krizí v jeho moderních dějinách. Tisíce lidí zůstávají bez přístřeší a životně důležitá infrastruktura leží v troskách. Vláda musí rozhodnout, jak obnovu financovat: buď vytvoří národní fond pomoci ze státních zdrojů, nebo vyhledá zahraniční pomoc, která může být spojena s politickými podmínkami." # todo: NEW TRANSLATION
 algeria_disaster.2.a: "Zřídit státní fond pomoci" # todo: NEW TRANSLATION
 ALG_state_aid_fund_tt: "Vyčlenit státní zdroje na obnovu postižených oblastí. To zatíží státní pokladnu, ale posílí domácí důvěru ve vládu." # todo: NEW TRANSLATION
 algeria_disaster.2.b: "Vyhledat zahraniční pomoc" # todo: NEW TRANSLATION
 ALG_foreign_aid_dependence_tt: "Požádat o pomoc mezinárodní partnery. To zmírní finanční tlak, ale zvýší zahraniční vliv na vnitřní záležitosti Alžírska." # todo: NEW TRANSLATION
 ALG_french_influence: "Francouzský vliv ve stínech" # todo: NEW TRANSLATION
 ALG_french_influence_desc: "Ačkoli je Alžírsko na papíře nezávislé, jeho politika zůstává ve stínu francouzského vlivu. Zkorumpovaní generálové a politici napojení na Paříž utvářejí rozhodování a omezují skutečnou suverenitu." # todo: NEW TRANSLATION
 ALG_shadow_state: "Le Pouvoir ve stínech" # todo: NEW TRANSLATION
 ALG_shadow_state_desc: "Skrytá síť generálů, zpravodajských důstojníků a podnikatelů, často označovaná jako „Le Pouvoir“, dominuje Alžírsku. Korupce oslabuje stát, ale tento stínový systém zajišťuje politickou stabilitu a posiluje moc režimu." # todo: NEW TRANSLATION
 algeria_emerging_youth: "Mládežnické organizace" # todo: NEW TRANSLATION
 algeria_nationalist_youth: "Mládežnické organizace" # todo: NEW TRANSLATION
 algeria_nationalist_rise: "Nacionalistické obrození" # todo: NEW TRANSLATION
 algeria_nationalist_rise_desc: "Nacionalismus je v Alžírsku populárnější než kdy dříve. Je to způsobeno jasným odporem vlády vůči zahraničnímu zasahování do státu a její pevnou podporou suverenity a nezávislosti státu" # todo: NEW TRANSLATION
 algeria_cultural_rebirth: "Kulturní obrození" # todo: NEW TRANSLATION
 ALG_PNA_victory: "Vojenská vláda" # todo: NEW TRANSLATION
 ALG_PNA_victory_desc: "Armée nationale populaire (Národní lidová armáda) je armáda Alžírska. Od získání nezávislosti v roce 1962 hrála velkou roli v politice. Prakticky kontrolovala vládu až do roku 1988, kdy byl zaveden multipartijní systém. Nadále si však udržuje vliv na alžírskou politiku, jak ukázal i poslední případ, kdy prezident Abdelaziz Bouteflika v roce 2019 po protestech vedoucích ke ztrátě podpory armády odstoupil." # todo: NEW TRANSLATION
 ALG_kick_out_morocco: "Vyhostit Maroko" # todo: NEW TRANSLATION
 ALG_kick_out_morocco_desc: "Maroko nás vždy podřizovalo své kontrole a není důvod s ním udržovat vztahy. Nyní je pravý čas tyto ideologické nepřátele z Alžírska vyhnat!" # todo: NEW TRANSLATION
 ALG_statist_rise: "Vzestup etatismu" # todo: NEW TRANSLATION
 ALG_statist_rise_desc: "Liberální ekonomika umožňuje vykořisťování našeho lidu a ohrožuje naši národní nezávislost a kontrolu. Pro Alžírsko je nejlepší propojit každý aspekt hospodářství se státem." # todo: NEW TRANSLATION
 ALG_maintain_military_role: "Udržet vliv armády" # todo: NEW TRANSLATION
 ALG_maintain_military_role_desc: "Svět vstupuje do temné a podivné doby, a proto musíme svou zemi chránit bez ohledu na cenu." # todo: NEW TRANSLATION
 ALG_kick_out_iran: "Vyhostit Írán" # todo: NEW TRANSLATION
 ALG_kick_out_iran_desc: "Írán nás vždy podřizoval své kontrole a není důvod s ním udržovat vztahy. Nyní je pravý čas tyto ideologické nepřátele z Alžírska vyhnat!" # todo: NEW TRANSLATION
 ALG_nationalize_oligarchic_holdings: "Znárodnit majetek" # todo: NEW TRANSLATION
 ALG_nationalize_oligarchic_holdings_desc: "Znárodníme majetek a vlastnictví různých neukázněných oligarchů, abychom posílili svou kontrolu nad hospodářstvím." # todo: NEW TRANSLATION
 ALG_subsidise_police: "Dotovat policii" # todo: NEW TRANSLATION
 ALG_subsidise_police_desc: "Policie je jednou z nejdůležitějších věcí pro to, aby se naši lidé cítili bezpečně a aby byla zajištěna naše vláda v Alžírsku, přesto je značně podfinancovaná. To se musí změnit." # todo: NEW TRANSLATION
 ALG_maintain_socialistic_policies: "Udržet socialistické zákony" # todo: NEW TRANSLATION
 ALG_maintain_socialistic_policies_desc: "Jednou věcí, kterou předchozí vláda udělala správně a která je hlavním důvodem její relativně vyšší obliby, jsou její socialistické politiky podporující nižší vrstvy. Budeme pokračovat v politikách zavedených bývalým prezidentem Háfizem al-Asadem a prezentovat se jako skuteční zastánci utlačovaných." # todo: NEW TRANSLATION
 ALG_government_planned_economic_projects: "Vládní projekty" # todo: NEW TRANSLATION
 ALG_government_planned_economic_projects_desc: "Měli bychom zahájit veřejné projekty, abychom posílili svůj obraz odpovědné vlády a získali podporu obyčejných lidí." # todo: NEW TRANSLATION
 ALG_patriotic_propaganda: "Vlastenecká propaganda" # todo: NEW TRANSLATION
 ALG_patriotic_propaganda_desc: "Posílíme své ideologické pozice zdůrazňováním významu národní hrdosti a loajality ke státu." # todo: NEW TRANSLATION
 ALG_gather_support_from_peasantry: "Podpora rolnictva" # todo: NEW TRANSLATION
 ALG_gather_support_from_peasantry_desc: "Rolníci jsou páteří našeho národa a musíme zajistit, aby nás podporovali." # todo: NEW TRANSLATION
 ALG_strong_government: "Silná vláda" # todo: NEW TRANSLATION
 ALG_strong_government_desc: "Musíme svému lidu ukázat, že naše vláda je stabilní a dostatečně schopná vládnout. To nám umožní získat jeho důvěru" # todo: NEW TRANSLATION
 ALG_expand_youth_organizations: "Rozšířit mládežnické organizace" # todo: NEW TRANSLATION
 ALG_expand_youth_organizations_desc: "Naše strany se výrazně opíraly o mládežnické organizace a nyní, když máme moc, je čas povzbudit mladé, aby podporovali naše ideologické cíle získáním jejich srdcí a myslí." # todo: NEW TRANSLATION
 ALG_illiberal_democracy: "N liberální demokracie" # todo: NEW TRANSLATION
 ALG_illiberal_democracy_desc: "Liberalismus je virus, který infikuje a vykořisťuje chudé národy. Lidé potřebují skutečnou demokracii, která je skutečně zastupuje a zároveň je sjednocuje pod jedním praporem. Jsme demokracií bez ohledu na cokoli." # todo: NEW TRANSLATION
 ALG_reestablish_intelligence_committee: "Obnovit zpravodajské služby" # todo: NEW TRANSLATION
 ALG_reestablish_intelligence_committee_desc: "Budoucí války nebudou vedeny zbraněmi a tanky, ale informacemi. Je naší odpovědností vytvořit plně funkční zpravodajskou službu." # todo: NEW TRANSLATION
 ALG_national_security_act: "Zákon o národní bezpečnosti" # todo: NEW TRANSLATION
 ALG_national_security_act_desc: "Extremistické skupiny pomalu ničí náš národ a představují hrozbu pro náš lid. Jejich útoky jsou jasnou hrozbou pro naši zemi a musíme je okamžitě zastavit bez ohledu na cenu a následky. TERORISMUS MUSÍ SKONČIT." # todo: NEW TRANSLATION
 ALG_pan_algerian_nationalism: "Všealžírský nacionalismus" # todo: NEW TRANSLATION
 ALG_pan_algerian_nationalism_desc: "Alžírsko je zemí, která by měla svou jedinečnou identitou prozářit celou severní Afriku. Naše bohatá historie a kultura jasně ukazují, že je naší povinností ukázat světu svůj skutečný potenciál a identitu." # todo: NEW TRANSLATION
 ALG_cultural_rebirth: "Kulturní obrození" # todo: NEW TRANSLATION
 ALG_cultural_rebirth_desc: "Náš národ pomalu, ale jistě poznává svou identitu. Malicherná rozdělení nám nesmějí bránit v pochopení krásy našeho lidu. Náš lid si musí uvědomit, že bez ohledu na cokoli jsme stále Alžířané." # todo: NEW TRANSLATION
 ALG_deal_with_the_trade_unions: "Dohoda s odbory" # todo: NEW TRANSLATION
 ALG_deal_with_the_trade_unions_desc: "Klíčem k silné zemi je její výroba a hospodářství, takže musíme zajistit, aby nás všichni alžírští dělníci podporovali." # todo: NEW TRANSLATION
 ALG_reassert_russian_ties: "Ruské vztahy" # todo: NEW TRANSLATION
 ALG_reassert_russian_ties_desc: "Rusko je jediným skutečným spojencem, který nám pomáhá stát se moderním, bezpečným a prosperujícím národem." # todo: NEW TRANSLATION
 ALG_russian_oil_excavation: "Ruské ropné dohody" # todo: NEW TRANSLATION
 ALG_russian_oil_excavation_desc: "V naší zemi se ukrývá velký poklad a náš spojenec Rusko nám pomůže tyto zdroje dosáhnout." # todo: NEW TRANSLATION
 ALG_russian_algiers_base_expansion: "Rozšířit ruskou námořní přítomnost" # todo: NEW TRANSLATION
 ALG_russian_algiers_base_expansion_desc: "Nemůžeme okamžitě vytvořit silné námořnictvo, ale naši ruští přátelé nám pomohou udržet pobřeží v bezpečí podporou rozšíření kapacit přístavu." # todo: NEW TRANSLATION
 ALG_houarist_rise: "Vzestup houarismu" # todo: NEW TRANSLATION
 ALG_houarist_rise_desc: "Houarismus znovu povstává a je připraven učinit Alžírsko opět velikým." # todo: NEW TRANSLATION
 ALG_islamic_socialism: "Islámský socialismus" # todo: NEW TRANSLATION
 ALG_islamic_socialism_desc: "Lidé zřejmě zapomínají, že islám prosazuje mnoho praktik spojovaných se socialismem, jako jsou zakát a sadaqa. Měli bychom tento vztah zdůraznit a založit na něm své ideály, protože tím také získáme podporu islamistů, kteří se vždy stavěli proti našim ideálům. Islámský socialismus je skutečnou cestou k vytvoření moderní, silné a ctnostné republiky." # todo: NEW TRANSLATION
 ALG_Get_rid_of_oligarchs: "Očistit se od oligarchů" # todo: NEW TRANSLATION
 ALG_news.1.t: "Alžírsko na křižovatce" # todo: NEW TRANSLATION
 ALG_news.1.d: "Po téměř desetiletí brutálního násilí, hospodářského rozvratu a politické stagnace stojí Alžírsko v roce 2000 před rozhodujícím okamžikem. Občanská válka, mnohými známá jako „černé desetiletí“, si vyžádala desítky tisíc mrtvých a ještě více vysídlených. Ačkoli intenzita bojů poklesla, napětí zůstává vysoké a rány se zdaleka nezhojily.\n\nVzhledem k nejisté budoucnosti země nyní soupeřící síly tlačí různými směry. Jedna cesta usiluje o národní usmíření a demokratické reformy, které by zemi sjednotily. Druhá směřuje k prodloužení výjimečného stavu a zachování moci současného režimu. Třetí šeptá o pokračování války, nedokončených bitvách, radikálních slibech a těch, kteří odmítají složit zbraně.\n\nCesta, kterou si Alžírsko nyní zvolí, může utvářet jeho osud po celé generace." # todo: NEW TRANSLATION
 ALG_news.1.a: "Všechny oči se upírají na Alžír." # todo: NEW TRANSLATION
 Arab_Defense_Bloc: "Arabský obranný blok" # todo: NEW TRANSLATION
 The_Maghreb_Joint_Defense: "Společná obrana Maghrebu" # todo: NEW TRANSLATION
 ALG_bouteflika.3.t: "Bouteflikova zdravotní krize" # todo: NEW TRANSLATION
 ALG_bouteflika.3.d: "V roce 2013 utrpěl Bouteflika ochromující mrtvici. Novinář Hichem Aboud byl stíhán za ohrožování národní bezpečnosti, územní celistvosti a řádného fungování republikových institucí a noviny, pro které psal, byly cenzurovány, protože napsal, že se prezident vrátil z Val-de-Grâce v komatózním stavu a označil Saïda Boutefliku za loutkáře řídícího administrativu." # todo: NEW TRANSLATION
 ALG_bouteflika.3.a: "Co se stane?" # todo: NEW TRANSLATION
 ALG_boteflika_tt: "Tímto se odemkne zaměření Alžírská prezidentská zdravotní krize" # todo: NEW TRANSLATION
 ALG_bouteflika: "Zprávy o Bouteflikově zdravotní krizi" # todo: NEW TRANSLATION
 ALG_bouteflika.2.t: "Alžírské prezidentské volby v roce 2014" # todo: NEW TRANSLATION
 ALG_bouteflika.2.d: "Dne 17. dubna 2014 se v Alžírsku konaly prezidentské volby. Úřadující prezident Abdelaziz Bouteflika byl znovu zvolen s 82 % hlasů. Mezi témata kampaně patžila touha po domácí stabilitě po krvavé občanské válce v 90. letech" # todo: NEW TRANSLATION
 ALG_bouteflika.2.a: "Bouteflika vítězí" # todo: NEW TRANSLATION
 ALG_bouteflika_health_crisis: "Bouteflikova zdravotní krize" # todo: NEW TRANSLATION
 ALG_bouteflika_health_crisis_desc: "Zhoršující se zdravotní stav prezidenta hrozí destabilizací Alžírska. Udržíme ho u moci, nebo se připravíme na předání moci?" # todo: NEW TRANSLATION
 ALG_2014_elections: "Prezidentské volby 2014" # todo: NEW TRANSLATION
 ALG_2014_elections_desc: "Navzdory své nemoci kandiduje Bouteflika na čtvrté funkční období. Opozice je umlčena a výsledek je předem jasný." # todo: NEW TRANSLATION
 ALG_2014_elections_tt: "§YAlžírský politický boj§! je méně než §Y40%§! nakloněn reformistům." # todo: NEW TRANSLATION
 ALG_2014_oil_crash: "Zhroucení ceny ropy" # todo: NEW TRANSLATION
 ALG_2014_oil_crash_desc: "Propadající se ceny ropy devastují alžírské hospodářství. Lidé obviňují korupci a požadují změnu." # todo: NEW TRANSLATION
 ALG_silence_hirak: "Rozdrtit protesty Hiraku" # todo: NEW TRANSLATION
 ALG_silence_hirak_desc: "Armáda a policie potlačí nesouhlas. Ulice zrudnou, ale režim přežije." # todo: NEW TRANSLATION
 ALG_listen_to_hirak: "Ustoupit reformistickým požadavkům" # todo: NEW TRANSLATION
 ALG_listen_to_hirak_desc: "Slibem politických reforem uklidníme protestující. Stará garda bude vzdorovat, ale hněv lidu může opadnout." # todo: NEW TRANSLATION
 ALG_2019_elections: "Politická krize 2019" # todo: NEW TRANSLATION
 ALG_2019_elections_desc: "Bouteflikova kandidatura na páté funkční období vyvolává celonárodní hněv. Vypukne v Alžírsku revoluce, nebo se podřídí tyranii?" # todo: NEW TRANSLATION
 ALG_2019_elections_tt: "§YAlžírský politický boj§! se posunul o více než §Y60%§! směrem k reformistům nebo hlubokému státu." # todo: NEW TRANSLATION
 ALG_new_president: "Jmenovat nového prezidenta" # todo: NEW TRANSLATION
 ALG_new_president_desc: "Hnutí Hirak zvítězilo. Přechodná vláda uspořádá svobodné volby a ukončí desetiletí autoritářské vlády." # todo: NEW TRANSLATION
 ALG_new_president_tt: "§YAlžírský politický boj§! je z více než §Y60%§! nakloněn reformistům." # todo: NEW TRANSLATION
 ALG_algeria_djadida: "Probíhají reformy Nového Alžírska" # todo: NEW TRANSLATION
 ALG_release_political_prisoners: "Propustit politické vězně" # todo: NEW TRANSLATION
 ALG_release_political_prisoners_desc: "Tisíce aktivistů, novinářů a opozičních představitelů úpí ve vazbě kvůli své roli v protestech Hiraku. Jejich propuštění by znamenalo skutečný odklon od starého režimu a posílilo demokratickou legitimitu." # todo: NEW TRANSLATION
 ALG_corrupt_successor: "Dosadit loajálního nástupce" # todo: NEW TRANSLATION
 ALG_corrupt_successor_desc: "Armáda zajistí převzetí moci loutkou. Bouteflikův odkaz korupce žije dál." # todo: NEW TRANSLATION
 ALG_corrupt_successor_tt: "§YAlžírský politický boj§! je z více než §Y60%§! nakloněn hlubokému státu." # todo: NEW TRANSLATION
 alg_oil_crash_title: "Ceny ropy se hroutí" # todo: NEW TRANSLATION
 alg_oil_crash_desc: "Ceny ropy se hroutí. Přežije náš národ?" # todo: NEW TRANSLATION
 alg_oil_crash_option: "To je znepokojivé!" # todo: NEW TRANSLATION
 alg_hirak_victory_title: "Lid vítězí" # todo: NEW TRANSLATION
 alg_hirak_victory_desc: "Po letech protestů Bouteflika odstupuje. Začíná nová éra, ale dokáže vydržet?" # todo: NEW TRANSLATION
 alg_military_rule_title: "Generálové rozhodují" # todo: NEW TRANSLATION
 alg_military_rule_desc: "Armáda dosazuje loutkového vůdce. Hirak je prozatím rozdrcen." # todo: NEW TRANSLATION
 algeria_tebboune.1.t: "Prezidentské volby 2019" # todo: NEW TRANSLATION
 algeria_tebboune.1.d: "Po měsících protestů a rezignaci Abdelazize Boutefliky míří Alžířané k volebním urnám v nejspornějších volbách za několik desetiletí. Mnozí proces považují za ovládaný starou gardou, zatímco jiní se upínají k naději na reformu či dokonce islamistické obrození. Jako hlavní favorité se vynořili tři kandidáti: Abdelmadjid Tebboune, kandidát kontinuity spojený s establishmentem; Ali Benflis, liberální reformista s vlastním hnutím; a Abdelkader Bengrina, islamistický vůdce s vazbami na Hnutí společnosti za mír. Volba určí budoucí směřování Alžírska." # todo: NEW TRANSLATION
 algeria_tebboune.1.a: "Zvolit Abdelmadjida Tebbounea" # todo: NEW TRANSLATION
 algeria_tebboune.1.b: "Zvolit Aliho Benflise" # todo: NEW TRANSLATION
 algeria_tebboune.1.c: "Zvolit Abdelkadera Bengrinu" # todo: NEW TRANSLATION
 ALG_benflis_tt: "§YAli Benflis§! se stává prezidentem Alžírska a vede liberální reformisty." # todo: NEW TRANSLATION
 ALG_bengrina_tt: "§YAbdelkader Bengrina§! se stává prezidentem Alžírska a zastupuje islamistickou opozici." # todo: NEW TRANSLATION
 kabyle_resistance_info: "V Kabýlii probíhají nepokoje. Úroveň odporu: [?state_resistance@438|%Y]" # todo: NEW TRANSLATION
 kabyle_resistance_effects: "Sledujte Kabýlii kvůli rostoucí podpoře separatismu. Současný odpor: [?state_resistance@385|%Y]" # todo: NEW TRANSLATION
 ALG_kabyle_resistance_tooltip: "Úroveň odporu v Kabýlii:" # todo: NEW TRANSLATION
 ALG_suppress_kabyle: "Potlačit kabylské hnutí" # todo: NEW TRANSLATION
 ALG_suppress_kabyle_desc: "Nepokoje v Kabýlii ohrožují národní suverenitu. Nemůžeme dovolit, aby separatistická rétorika vzkvétala. Silná represe může být jediným způsobem, jak znovu prosadit kontrolu, i když to znamená čelit tvrdému odporu." # todo: NEW TRANSLATION
 ALG_recognize_kabyle: "Uznat kabylskou nezávislost" # todo: NEW TRANSLATION
 ALG_recognize_kabyle_desc: "Desetiletí napětí, protestů a nepokojů nás přivedla k tomuto okamžiku. Možná nastal čas uznat kabylské aspirace na nezávislost. Tím bychom ukončili bezprostřední nepokoje, ale za cenu územní celistvosti." # todo: NEW TRANSLATION
 ALG_recognize_tamazight: "Uznat tamazight" # todo: NEW TRANSLATION
 ALG_recognize_tamazight_desc: "Uznání tamazightu jako úředního jazyka je klíčovým požadavkem kabylského obyvatelstva. Tento krok může legitimizovat jejich kulturní identitu a zároveň zachovat národní jednotu." # todo: NEW TRANSLATION
 ALG_kabyle_cultural_reforms: "Kabylské kulturní reformy" # todo: NEW TRANSLATION
 ALG_kabyle_cultural_reforms_desc: "Musíme podporovat vzdělávání, místní instituce a kulturní práva v Kabýlii, abychom podpořili integraci a vzájemný respekt." # todo: NEW TRANSLATION
 ALG_internal_troops_kabyle: "Nasadit vnitřní jednotky" # todo: NEW TRANSLATION
 ALG_internal_troops_kabyle_desc: "Situace v Kabýlii vyžaduje silnou bezpečnostní přítomnost. Nasadíme vnitřní jednotky k zajištění regionu a potlačení nepokojů." # todo: NEW TRANSLATION
 ALG_disrupt_kabyle_networks: "Narušit kabylské politické sítě" # todo: NEW TRANSLATION
 ALG_disrupt_kabyle_networks_desc: "Separatistická činnost je koordinována prostřednictvím podzemních politických sítí. Jejich narušení pomocí sledování a zatýkání je nezbytné k zachování národní bezpečnosti." # todo: NEW TRANSLATION
 KBY_build_a_new_state: "Vybudovat nový stát" # todo: NEW TRANSLATION
 KBY_build_a_new_state_desc: "Nyní, když jsme nezávislí, musíme položit základy fungující republiky. Ústava, správa a sociální služby jsou hlavními prioritami." # todo: NEW TRANSLATION
 KBY_secure_our_borders: "Zabezpečit hranice" # todo: NEW TRANSLATION
 KBY_secure_our_borders_desc: "Po vyhlášení suverenity musíme opevnit zranitelné hranice a zajistit své přežití v nepřátelském prostředí." # todo: NEW TRANSLATION
 idea_ALG_neutrality: "Neutralita Alžírska" # todo: NEW TRANSLATION
 idea_ALG_neutrality_desc: "Alžírsko si již nemůže dovolit válku; neutralita je naší nejlepší možností." # todo: NEW TRANSLATION
 idea_ALG_neutrality_2: "Neutralita Alžírska" # todo: NEW TRANSLATION
 idea_ALG_neutrality_2_desc: "" # todo: NEW TRANSLATION
 ALG_a_globalized_algeria: "Globalizované Alžírsko" # todo: NEW TRANSLATION
 ALG_a_globalized_algeria_desc: "Dnešní doba je érou globalizace, na níž se Alžírsko musí podílet." # todo: NEW TRANSLATION
 ALG_international_investments: "Mezinárodní investice" # todo: NEW TRANSLATION
 ALG_international_investments_desc: "" # todo: NEW TRANSLATION
 ALG_export_driven_growth: "Růst založený na vývozu" # todo: NEW TRANSLATION
