 ALG_shipbuilding: "Alžírské loďařství" # todo: NEW TRANSLATION
 ALG_shipbuilding2: "Alžírské loďařství" # todo: NEW TRANSLATION
 ALG_resist_le_pouvoir_system_tt: "§YOdemčen nový systém: Nespokojenost lidu a vliv armády§!\n\n- §ONespokojenost lidu§! měří lidovou nespokojenost. Roste, pokud je zanedbávána zaměstnanost, školství nebo zdravotnictví.\n- Pokud nespokojenost vzroste příliš vysoko, mohou vypuknout masové protesty nebo občanská válka.\n\n- §OVliv armády§! sleduje úlohu armády v politice. Její oslabení prostřednictvím reforem může umožnit pokojný přechod, ale pokud její vliv poroste, armáda může potlačit demokracii a upevnit svou moc.\n\nAbyste tuto cestu přežili, musíte vyvažovat reformy, stabilitu a moc armády." # todo: NEW TRANSLATION
 ALG_reactioners: "Klastrové hospodářství" # todo: NEW TRANSLATION
 ALG_reactioners1: "Klastrové hospodářství" # todo: NEW TRANSLATION
 ALG_reactioners2: "Klastrové hospodářství" # todo: NEW TRANSLATION
