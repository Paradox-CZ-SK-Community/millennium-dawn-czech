 algerian_events.209.t: "Oranais padl do rukou protestujících" # todo: NEW TRANSLATION
 algerian_events.209.a: "Západ je ztracen" # todo: NEW TRANSLATION
 algerian_events.201.d: "Obyvatelé oblasti Mzab se vzepřeli vládní kontrole a ovládli ulice.\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 algerian_events.202.d: "V pohoří Aurès přerostly nepokoje v otevřený odpor.\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 algerian_events.203.d: "Navzdory izolaci Tamanrasset povstal a vláda nad oblastí ztratila kontrolu.\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 algerian_events.204.d: "Pouštní komunity Grand Erg Occidental se připojily k vlně protestů.\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 algerian_events.205.d: "Oblast Atlasu, dříve klidná, se stala ohniskem protivládních nepokojů.\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 algerian_events.206.d: "Protesty na východě přemohly místní bezpečnostní síly a Constantinois padl.\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 algerian_events.207.d: "Kabylie se svou dlouhou tradicí odporu znovu otevřeně vzepřela státu.\nNálada v Kabylie: [ALG_kabyle_satisfaction_text]" # todo: NEW TRANSLATION
 algerian_events.208.d: "Dokonce i oblast hlavního města byla otřesena neovladatelnými protesty.\nVojenská kontrola: [ALG_army_grip_text]" # todo: NEW TRANSLATION
 algerian_events.209.d: "Na západě se Oranais připojil k vlně nepokojů, která zachvátila Alžírsko.\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 algerian_events.200.t: "Protesty potlačeny" # todo: NEW TRANSLATION
 algerian_events.200.d: "Bezpečnostním silám se podařilo potlačit poslední vlnu demonstrací, veřejný hněv však doutná pod povrchem." # todo: NEW TRANSLATION
 algerian_events.200.a: "Pořádek je prozatím obnoven." # todo: NEW TRANSLATION
 algerian_events.2015.t: "Potlačování se obrací proti nám" # todo: NEW TRANSLATION
 algerian_events.2015.d: "Pokusy tvrdě zakročit proti protestům pouze podnítily další hněv, povzbudily demonstranty a oslabily autoritu vlády." # todo: NEW TRANSLATION
 algerian_events.2015.a: "Situace se zhoršuje." # todo: NEW TRANSLATION
 algerian_events.2025.t: "Konec protestů" # todo: NEW TRANSLATION
 algerian_events.2025.d: "Po měsících bojů poslední vlna protestů vyhasla. Napětí přetrvává, ale ulice jsou prozatím opět klidné." # todo: NEW TRANSLATION
 algerian_events.2025.a: "Konečně se vrací klid." # todo: NEW TRANSLATION
 algerian_events.301.t: "Propukají celostátní protesty!" # todo: NEW TRANSLATION
 algerian_events.301.d: "Zdá se, že lidé naše nedávné kroky nepřijali lehce a po celé zemi propukly protesty. Pomalu, ale jistě stále více lidí požaduje odstoupení vlády, přestože my nikam neodcházíme." # todo: NEW TRANSLATION
 algerian_events.301.a: "Měli jsme to čekat!" # todo: NEW TRANSLATION
 algerian_events.300.t: "Rostoucí nepokoje" # todo: NEW TRANSLATION
 algerian_events.300.d: "Z celé země přicházejí zprávy o sporadických protestech a občanské neposlušnosti. Veřejná frustrace z korupce, nezaměstnanosti a nedostatku politických reforem dosahuje bodu varu. Demonstrace jsou zatím rozptýlené, ale snadno by mohly přerůst v něco mnohem většího." # todo: NEW TRANSLATION
 algerian_events.300.a: "Přejde to." # todo: NEW TRANSLATION
 algerian_events.300.b: "Tohle by se mohlo vymknout kontrole." # todo: NEW TRANSLATION
 algerian_events.230.t: "Masové protesty zachvacují Alžírsko" # todo: NEW TRANSLATION
 algerian_events.230.d: "Alžírsko otřásají masivní a vytrvalé protesty požadující politické reformy a konec vládnoucího establishmentu. Ve městech po celé zemi vyšly do ulic statisíce lidí v rámci toho, čemu se říká nové hnutí Hirak. Mezinárodní společenství situaci pozorně sleduje." # todo: NEW TRANSLATION
 algerian_events.230.a: "Rozhodující okamžik pro Alžírsko." # todo: NEW TRANSLATION
 ALG_khenchela_arms_manufacturer: "Komplex výroby zbraní Khenchela" # todo: NEW TRANSLATION
 ALG_khenchela_arms_manufacturer_desc: "Státní zařízení v provincii Khenchela vyrábějící pěchotní zbraně a vybavení pro Alžírskou národní lidovou armádu. Bylo založeno s cílem snížit závislost na zahraničním dovozu zbraní a zajistit soběstačnost ve výrobě ručních zbraní." # todo: NEW TRANSLATION
 ALG_seriana_small_arms: "Továrna ručních zbraní Seriana" # todo: NEW TRANSLATION
 ALG_seriana_small_arms_desc: "Zařízení Seriana ve východním Alžírsku vyrábí pušky, pistole a munici pro alžírské bezpečnostní síly. Továrna funguje pod dohledem ministerstva národní obrany." # todo: NEW TRANSLATION
 ALG_dgi_missile_systems: "DGI – Direction Générale de l'Industrie Militaire" # todo: NEW TRANSLATION
 ALG_dgi_missile_systems_desc: "Generální ředitelství vojenského průmyslu dohlíží na alžírská obranná výrobní odvětví včetně řízených zbraní, protitankových a protiletadlových systémů a vývoje dělostřelectva. DGI podléhá ministerstvu národní obrany a koordinuje státní podniky i vojensko-technická partnerství s cílem zajistit strategickou autonomii." # todo: NEW TRANSLATION
 ALG_bcl_armored_development: "BCL – Brigade des Constructions Logistiques" # todo: NEW TRANSLATION
 ALG_bcl_armored_development_desc: "Brigáda vojenské logistické výstavby zajišťuje údržbu, modernizaci a omezenou domácí výrobu obrněných vozidel. BCL se specializuje na renovaci vybavení ze sovětské éry a úpravu vozidel pro provozní podmínky Sahary." # todo: NEW TRANSLATION
 ALG_snvi_vehicle_manufacturer: "SNVI – Société Nationale des Véhicules Industriels" # todo: NEW TRANSLATION
 ALG_snvi_vehicle_manufacturer_desc: "Alžírský národní výrobce vozidel založený v roce 1967. SNVI vyrábí vojenské nákladní vozy, užitková vozidla a lehká obrněná vozidla ve spolupráci s Mercedes-Benz a dalšími výrobci; všechny konstrukce jsou přizpůsobeny severoafrickému terénu a klimatu." # todo: NEW TRANSLATION
 ALG_enmib_helicopter_unit: "ENMIB – Entreprise Nationale des Matériels et Infrastructures de Base" # todo: NEW TRANSLATION
 ALG_enmib_helicopter_unit_desc: "Alžírské zařízení pro údržbu a montáž vrtulníků poskytující generální opravy a omezenou výrobu pro alžírské letectvo. ENMIB zajišťuje licenční montáž zahraničních konstrukcí vrtulníků." # todo: NEW TRANSLATION
