 ALG_can_enact_ethnic_policy: "Lze přijmout novou etnickou politiku" # todo: NEW TRANSLATION
 algeria_power_balance: "Alžírský politický boj" # todo: NEW TRANSLATION
 algeria_old_guard: "Le Pouvoir (stará garda)" # todo: NEW TRANSLATION
 algeria_reformists: "Hnutí Hirak (reformisté)" # todo: NEW TRANSLATION
 algeria_compromise_range: "Křehký kompromis" # todo: NEW TRANSLATION
 algeria_compromise_range_desc: "Ani jedna strana nedominujte. Přetrvává neklidná patová situace, zatímco se obě frakce snaží získat výhodu." # todo: NEW TRANSLATION
 old_guard_leaning: "Vliv staré gardy" # todo: NEW TRANSLATION
 old_guard_leaning_desc: "Vojenský establishment začíná znovu upevňovat svou tradiční dominanci." # todo: NEW TRANSLATION
 old_guard_partial_control: "Upevnění staré gardy" # todo: NEW TRANSLATION
 old_guard_partial_control_desc: "Le Pouvoir utahuje svou kontrolu. Hlasy reformistů jsou marginalizovány." # todo: NEW TRANSLATION
 old_guard_strong_control: "Autoritářský posun" # todo: NEW TRANSLATION
 old_guard_strong_control_desc: "Bezpečnostní aparát dominuje politickému životu. Demokratické instituce erodují." # todo: NEW TRANSLATION
 old_guard_full_control: "Vojenská dominance" # todo: NEW TRANSLATION
 old_guard_full_control_desc: "Le Pouvoir ovládá Alžírsko železnou pěstí. Občanské svobody jsou výrazně omezeny." # todo: NEW TRANSLATION
 reformists_leaning: "Reformistické probouzení" # todo: NEW TRANSLATION
 reformists_leaning_desc: "Občanská společnost získává odvahu. Duch Hiraku ožívá." # todo: NEW TRANSLATION
 reformists_gaining_ground: "Dynamika reforem" # todo: NEW TRANSLATION
 reformists_gaining_ground_desc: "Reformní hnutí sílí. Stará garda se snaží udržet kontrolu." # todo: NEW TRANSLATION
 reformists_strong_momentum: "Demokratický vzestup" # todo: NEW TRANSLATION
 reformists_strong_momentum_desc: "Reformisté dominují veřejnému diskurzu. Skutečná změna se zdá být možná." # todo: NEW TRANSLATION
 reformists_victory: "Demokratický přechod" # todo: NEW TRANSLATION
 reformists_victory_desc: "Alžírsko přijímá civilní vládu a pluralismus. Moc Le Pouvoiru je zlomena." # todo: NEW TRANSLATION
 ALG_political_struggle: "Alžírský politický boj" # todo: NEW TRANSLATION
 ALG_political_struggle_desc: "Boj mezi starou gardou a reformisty utvoří budoucnost Alžírska.\nSoučasná rovnováha: [ALG_power_struggle_state]\nVliv armády: [ALG_army_grip_text]\nVeřejná nespokojenost: [ALG_grievance_text]" # todo: NEW TRANSLATION
 ALG_power_struggle_state: "Politická situace" # todo: NEW TRANSLATION
 ALG_boost_reformists_tt: "Přesměrovat zdroje k reformistickým politikům a skupinám občanské společnosti.\nPosune rovnováhu směrem k reformistům o §G+0.15§!." # todo: NEW TRANSLATION
 ALG_boost_old_guard_tt: "Posílit podporu mezi válečnými veterány a bezpečnostním establishmentem.\nPosune rovnováhu směrem ke staré gardě o §R-0.15§!." # todo: NEW TRANSLATION
 ALG_rally_students_tt: "Mobilizovat studentská hnutí a mladé aktivisty na podporu reforem.\nPosune rovnováhu směrem k reformistům o §G+0.08§!." # todo: NEW TRANSLATION
 ALG_mobilize_veterans_tt: "Shromáždit veterány války za nezávislost a penzionované důstojníky.\nPosune rovnováhu směrem ke staré gardě o §R-0.08§!." # todo: NEW TRANSLATION
 ALG_bribe_elites_tt: "Využít klientelismus k zajištění loajality elit.\nPosune rovnováhu směrem ke staré gardě o §R-0.05§!.\nStojí §R30§! z pokladny. Hrozí podnícení korupce." # todo: NEW TRANSLATION
 ALG_compromise_tt: "Zprostředkovat dohodu o sdílení moci mezi reformisty a starou gardou.\nPosune rovnováhu směrem ke středu o §W±0.08§!." # todo: NEW TRANSLATION
 ALG_media_campaign_reform_tt: "Zahájit mediální kampaň propagující demokratické hodnoty.\nPosune rovnováhu směrem k reformistům o §G+0.05§!." # todo: NEW TRANSLATION
 ALG_security_crackdown_tt: "Pověřit bezpečnostní síly tvrdým zásahem proti disentu.\nPosune rovnováhu směrem ke staré gardě o §R-0.05§!." # todo: NEW TRANSLATION
 ALG_world_tension_security_tt: "Globální nestabilita ospravedlňuje posílení bezpečnostního aparátu.\nPosune rovnováhu směrem ke staré gardě o §R-0.08§!." # todo: NEW TRANSLATION
 ALG_world_tension_high_security_tt: "Vážné globální napětí vyžaduje mimořádná bezpečnostní opatření.\nPosune rovnováhu směrem ke staré gardě o §R-0.12§!." # todo: NEW TRANSLATION
 ALG_crackdown_momentum_tt: "Naše politika tvrdých zásahů posiluje postavení staré gardy.\nPosune rovnováhu směrem ke staré gardě o §R-0.10§!." # todo: NEW TRANSLATION
 ALG_reconciliation_momentum_tt: "Náš přístup založený na usmíření posiluje hlasy reformistů.\nPosune rovnováhu směrem k reformistům o §G+0.10§!." # todo: NEW TRANSLATION
 ALG_oil_patronage_tt: "Využít příjmy z ropy k financování klientelistických sítí.\nPosune rovnováhu směrem ke staré gardě o §R-0.06§!.\nStojí §R25§! z pokladny, ale zvyšuje stabilitu." # todo: NEW TRANSLATION
 ALG_economic_reforms_tt: "Provést hospodářskou liberalizaci a opatření na podporu transparentnosti.\nPosune rovnováhu směrem k reformistům o §G+0.08§!." # todo: NEW TRANSLATION
 ALG_elite_patronage: "Klientelistické sítě elit" # todo: NEW TRANSLATION
 ALG_elite_patronage_desc: "Kupujeme stabilitu prostřednictvím klientelismu, ale tím prohlubujeme korupci a vyčerpáváme zdroje." # todo: NEW TRANSLATION
 alg_politics.10.t: "Jednání o kompromisu" # todo: NEW TRANSLATION
 alg_politics.10.d: "Zástupci obou frakcí se tajně setkali. Bylo dosaženo kompromisu – ale budou ho obě strany respektovat?" # todo: NEW TRANSLATION
 alg_politics.10.a: "Přijmout dohodu" # todo: NEW TRANSLATION
 alg_politics.10.b: "Odmítnout a pokračovat v boji" # todo: NEW TRANSLATION
 alg_politics.20.t: "Reformisté se chopili moci" # todo: NEW TRANSLATION
 alg_politics.20.d: "Reformní hnutí dosáhlo kritické masy. Stará garda stojí před volbou: ustoupit, nebo bojovat." # todo: NEW TRANSLATION
 alg_politics.20.a: "Přijmout demokratickou transformaci" # todo: NEW TRANSLATION
 alg_politics.20.b: "Armáda se nevzdá" # todo: NEW TRANSLATION
 alg_politics.21.t: "Vojenský převrat je bezprostřední" # todo: NEW TRANSLATION
 alg_politics.21.d: "Generálové upevnili svou moc a snaží se odstavit civilní reformisty." # todo: NEW TRANSLATION
 alg_politics.21.a: "Přijmout vojenskou autoritu" # todo: NEW TRANSLATION
 alg_politics.21.b: "Bránit reformní hnutí" # todo: NEW TRANSLATION
 alg_politics.22.t: "Stíny nad Alžírem" # todo: NEW TRANSLATION
 alg_politics.22.d: "Bezpečnostní aparát je stále odvážnější. Alžírsko směřuje k autoritářství. Jak zareagujeme?" # todo: NEW TRANSLATION
 alg_politics.22.a: "Bezpečnost musí být na prvním místě" # todo: NEW TRANSLATION
 alg_politics.22.b: "Zmírnit napětí, než bude pozdě" # todo: NEW TRANSLATION
 alg_politics.23.t: "Větry změny" # todo: NEW TRANSLATION
 alg_politics.23.d: "Reformní hnutí sílí. Le Pouvoir však stále ovládá bezpečnostní síly. Jak budeme postupovat?" # todo: NEW TRANSLATION
 alg_politics.23.a: "Pokračovat v reformách" # todo: NEW TRANSLATION
 alg_politics.23.b: "Zpomalit, abychom předešli odporu" # todo: NEW TRANSLATION
 ALG_political_truce: "Politické příměří" # todo: NEW TRANSLATION
 ALG_political_truce_desc: "Mezi reformisty a starou gardou panuje křehký kompromis." # todo: NEW TRANSLATION
 ALG_tamazight_integration_process: "Proces integrace tamazightu" # todo: NEW TRANSLATION
 ALG_tamazight_integration_process_desc: "Oficiální uznání jazyka tamazight je zaváděno ve všech státních institucích. Ačkoli to do značné míry uklidnilo regiony, byrokratický posun a změna národní identity způsobují dočasné období napětí na cestě k úplné společenské soudržnosti." # todo: NEW TRANSLATION
 ALG_auto.1.t: "Skandál v automobilovém průmyslu" # todo: NEW TRANSLATION
 ALG_auto.1.desc: "Vyšla najevo rozsáhlá korupce v alžírském automobilovém průmyslu. Několik zahraničních partnerství včetně Renaultu, BMW a Mercedesu bylo zapleteno do úplatkářských schémat a podvodných dovozních praktik. Veřejnost je rozhořčena a požaduje opatření." # todo: NEW TRANSLATION
 ALG_auto.1.a: "Zahájit úplné vyšetřování" # todo: NEW TRANSLATION
 ALG_auto.1.b: "Potlačit zprávu" # todo: NEW TRANSLATION
 ALG_auto.2.t: "Reakce na skandál v automobilovém průmyslu" # todo: NEW TRANSLATION
 ALG_auto.2.desc: "Po vyšetřování skandálu musíme rozhodnout, jak dále naložit s dovozem automobilů. Úplný zákaz by vyslal silný signál, ale poškodil by naši ekonomiku. Částečná omezení představují střední cestu." # todo: NEW TRANSLATION
 ALG_auto.2.a: "Zavést úplný zákaz dovozu" # todo: NEW TRANSLATION
 ALG_auto.2.b: "Zavést částečná omezení" # todo: NEW TRANSLATION
 ALG_auto.2.c: "Dovoz nijak neomezovat" # todo: NEW TRANSLATION
 ALG_auto.3.t: "Fiat navrhuje partnerství" # todo: NEW TRANSLATION
 ALG_auto.3.desc: "Italská automobilka Fiat nás oslovila s návrhem na založení výrobních závodů v Alžírsku. Po zavedení dovozních omezení vidí příležitost na našem trhu. To by mohlo oživit náš automobilový průmysl." # todo: NEW TRANSLATION
 ALG_auto.3.a: "Přijmout návrh Fiatu" # todo: NEW TRANSLATION
 ALG_auto.3.b: "Vyjednat lepší podmínky" # todo: NEW TRANSLATION
 ALG_auto.3.c: "Návrh odmítnout" # todo: NEW TRANSLATION
 ALG_auto.4.t: "Obnova automobilového průmyslu" # todo: NEW TRANSLATION
 ALG_auto.4.desc: "Po naší uvážlivé reakci na skandál se automobilový průmysl začíná stabilizovat. Domácí výrobci projevují zájem o rozšíření výroby, zatímco zahraniční společnosti nás nadále oslovují." # todo: NEW TRANSLATION
 ALG_auto.4.a: "Podpořit domácí výrobce" # todo: NEW TRANSLATION
 ALG_auto.4.b: "Zvážit zahraniční nabídky" # todo: NEW TRANSLATION
 ALG_auto.5.t: "Fiat přijímá naše podmínky" # todo: NEW TRANSLATION
 ALG_auto.5.desc: "Naši vyjednavači uspěli. Fiat souhlasil s výhodnějšími podmínkami včetně dodatečných investic a transferu technologií. Pro alžírský průmysl je to významné vítězství." # todo: NEW TRANSLATION
 ALG_auto.5.a: "Výborné zprávy!" # todo: NEW TRANSLATION
 ALG_auto.6.t: "Fiat odmítá nové vyjednávání" # todo: NEW TRANSLATION
 ALG_auto.6.desc: "Fiat odmítl naše požadavky na lepší podmínky. Trvá na tom, že jeho původní nabídka je více než spravedlivá. Musíme se rozhodnout, zda jeho podmínky přijmeme, nebo od dohody zcela odstoupíme." # todo: NEW TRANSLATION
 ALG_auto.6.a: "Přijmout původní podmínky" # todo: NEW TRANSLATION
 ALG_auto.6.b: "Odstoupit od dohody" # todo: NEW TRANSLATION
 ALG_corruption_auto_scandal: "Korupční skandál v automobilovém průmyslu" # todo: NEW TRANSLATION
 ALG_corruption_auto_scandal_desc: "Odhalení rozsáhlé korupce v našem automobilovém průmyslu otřáslo důvěrou veřejnosti. Zahraniční partneři se distancují, zatímco vyšetřování pokračuje. Naše průmyslová produkce i politický kapitál utrpěly významné ztráty." # todo: NEW TRANSLATION
 ALG_corruption_auto_scandal_coverup: "Potlačený skandál v automobilovém průmyslu" # todo: NEW TRANSLATION
 ALG_corruption_auto_scandal_coverup_desc: "Pokusili jsme se potlačit zprávy o skandálu v automobilovém průmyslu. Bezprostřední škody jsou sice omezeny, zahraniční zpravodajské služby si však našeho klamu všimly a domácí opoziční skupiny proti nám získaly munici. Pravda může stále vyjít najevo." # todo: NEW TRANSLATION
 ALG_import_ban_penalty: "Zákaz dovozu automobilů" # todo: NEW TRANSLATION
 ALG_import_ban_penalty_desc: "Po korupčním skandálu byl zaveden úplný zákaz dovozu automobilů. Přestože tím vysíláme silný signál proti zahraničnímu vykořisťování, vážně jsme narušili dodavatelské řetězce a průmyslovou výrobu. Spotřebitelé čelí nedostatku a vyšším cenám." # todo: NEW TRANSLATION
 ALG_import_restrictions_light: "Omezení dovozu automobilů" # todo: NEW TRANSLATION
 ALG_import_restrictions_light_desc: "Byla zavedena částečná omezení dovozu automobilů. Tento uvážlivý přístup zachovává některé obchodní vztahy a zároveň reaguje na veřejné rozhořčení nad korupčním skandálem. Hospodářský dopad je zvládnutelný, ale stále citelný." # todo: NEW TRANSLATION
 ALG_4g_rollout_tt: "§GAlžírsko spouští celostátní mobilní síť 4G:§!\n- Vysokorychlostní mobilní internet\n- Lepší konektivita pro podniky\n- Rozšíření digitálních služeb" # todo: NEW TRANSLATION
 ALG_4g_coverage_basic: "Pokrytí 4G – základní" # todo: NEW TRANSLATION
 ALG_4g_coverage_basic_desc: "Naše síť 4G je v provozu, ale pokrytí je omezeno na hlavní městská centra. Je třeba pokračovat v investicích do infrastruktury." # todo: NEW TRANSLATION
 ALG_4g_coverage_moderate: "Pokrytí 4G – střední" # todo: NEW TRANSLATION
 ALG_4g_coverage_moderate_desc: "Pokrytí 4G nyní zasahuje většinu měst a obcí. Podniky i občané těží z lepší konektivity." # todo: NEW TRANSLATION
 ALG_4g_coverage_good: "Pokrytí 4G – dobré" # todo: NEW TRANSLATION
 ALG_4g_coverage_good_desc: "Většina Alžírska má silné pokrytí 4G. Digitální ekonomika vzkvétá a produktivita roste." # todo: NEW TRANSLATION
 ALG_4g_coverage_excellent: "Pokrytí 4G – vynikající" # todo: NEW TRANSLATION
 ALG_4g_coverage_excellent_desc: "Celostátní pokrytí 4G bylo dosaženo! Alžírsko je nyní regionálním lídrem v mobilní konektivitě. Základ pro rozvoj 5G je připraven." # todo: NEW TRANSLATION
 algerian_event.51.t: "Alžírská kosmická loď úspěšně přistála na Měsíci!" # todo: NEW TRANSLATION
 algerian_event.51.desc: "Alžírská kosmická agentura (ASAL) dosáhla historického milníku! Naše lunární přistávací zařízení úspěšně provedlo měkké přistání na povrchu Měsíce, čímž se Alžírsko stalo teprve pátým státem v dějinách, kterému se to podařilo.\n\nSestup byl živě vysílán po celé zemi a miliony Alžířanů s úžasem sledovaly, jak naše kosmická loď dosedá poblíž jižního pólu Měsíce. Vědci v řídicím středisku v Alžíru propukli v oslavy, když telemetrie potvrdila úspěšné přistání.\n\nTento úspěch staví Alžírsko po bok SSSR, USA, Číny a Indie do elitního klubu zemí schopných měkkého přistání na Měsíci. Představuje završení desetiletí investic do našeho vesmírného programu a signalizuje vzestup Alžírska mezi významné vesmírné mocnosti.\n\nSvět s obdivem sleduje, jak je na Měsíci vztyčena zelenobílá vlajka." # todo: NEW TRANSLATION
 algerian_event.51.a: "Obrovský skok pro Alžírsko!" # todo: NEW TRANSLATION
 ALG_missile_leverage: "Pákový efekt raket" # todo: NEW TRANSLATION
 ALG_missile_leverage_desc: "Naše vztahy s Čínou představují příležitost k získání pokročilé raketové technologie. Využitím diplomatických vazeb a strategického postavení můžeme vyjednat transfer pozemních střel s plochou dráhou letu a mobilních odpalovacích platforem. To výrazně posílí odstrašující schopnosti Alžírska." # todo: NEW TRANSLATION
 ALG_build_nuclear_reactor_tt: "§GVybudovat jaderný reaktor:§!\n- Zajistit civilní jadernou energetiku\n- Snížit závislost na fosilních palivech\n- Vyškolit jaderné vědce a inženýry\n- Položit základy pokročilého jaderného výzkumu" # todo: NEW TRANSLATION
 ALG_election_pending: "Čeká se na celostátní volby" # todo: NEW TRANSLATION
 ALG_opposition_reforms_1: "Reformy opozice: svoboda médií" # todo: NEW TRANSLATION
 ALG_opposition_reforms_1_desc: "Opoziční vláda zahájila svůj reformní program zaručením svobody médií. Svobodný tisk nyní kontroluje vládu a informuje veřejnost." # todo: NEW TRANSLATION
 ALG_opposition_reforms_2: "Reformy opozice: soudní systém" # todo: NEW TRANSLATION
 ALG_opposition_reforms_2_desc: "Opoziční vláda navázala na reformu médií reformou soudnictví. Nezávislé soudy nyní zajišťují spravedlnost pro všechny Alžířany a bojují proti korupci." # todo: NEW TRANSLATION
 ALG_opposition_reforms_3: "Reformy opozice: vzdělávání" # todo: NEW TRANSLATION
 ALG_opposition_reforms_3_desc: "Reformní program opozice pokračuje rozsáhlými investicemi do vzdělávání. Modernizovaný systém připravuje alžírskou mládež na budoucí výzvy." # todo: NEW TRANSLATION
 ALG_opposition_reforms_4: "Nová éra Alžírska" # todo: NEW TRANSLATION
 ALG_opposition_reforms_4_desc: "Komplexní reformní program opozice je dokončen. Alžírsko se proměnilo v moderní, demokratický a prosperující stát. Tuto novou éru definují svobodná média, nezávislé soudy, kvalitní vzdělávání a ekonomické příležitosti." # todo: NEW TRANSLATION
 ALG_fis_movement: "Hnutí islámské spásy" # todo: NEW TRANSLATION
 ALG_fis_movement_desc: "FIS si získala alžírský lid poselstvím islámské demokracie, sociální spravedlnosti a boje proti korupci. Mešity slouží jako komunitní centra a poskytují sociální služby, které vláda zanedbávala. Lidová podpora každým dnem roste." # todo: NEW TRANSLATION
 ALG_fln.1.t: "Korupční skandál otřásá Alžírskem" # todo: NEW TRANSLATION
 ALG_fln.1.desc: "Investigativní novináři odhalili síť korupce zasahující celou alžírskou politickou elitu. Bankovní záznamy odhalují miliony odkloněné z veřejných prostředků na soukromé účty. Zdá se, že je zapojeno několik stran, včetně členů našeho vlastního FLN.\n\nSkandál vyšel na veřejnost a nemůžeme ho ignorovat. Důkazy jsou usvědčující, ale naše reakce může celý politický systém buď stabilizovat, nebo destabilizovat. Musíme pečlivě zvolit další postup." # todo: NEW TRANSLATION
 ALG_fln.1.a: "Pohřbít zprávu" # todo: NEW TRANSLATION
 ALG_cover_up_corruption_tt: "§RZatajit skandál:§!\n• Korupce výrazně vzroste\n• Menší ztráta politické moci\n• Pověst FLN bude mírně poškozena\n• Stabilita bude prozatím zachována\n\n§7„Co lidé nevědí, to jim neublíží.“§!" # todo: NEW TRANSLATION
 ALG_fln.1.b: "Obvinit opoziční strany" # todo: NEW TRANSLATION
 ALG_blame_others_tt: "§YObvinit opoziční strany:§!\n• Korupce vzroste\n• Opoziční strany budou silně poškozeny\n• FLN získá určitou podporu\n• Částečná ztráta stability\n\n§7„Oni jsou skuteční zločinci!“§!" # todo: NEW TRANSLATION
 ALG_fln.1.c: "Nechat vyjít pravdu najevo" # todo: NEW TRANSLATION
 ALG_expose_all_tt: "§GOdhalit veškerou korupci:§!\n• Všechny strany budou poškozeny (včetně FLN)\n• Výrazná ztráta stability\n• Vysoké náklady na politickou moc\n• ALE korupce klesne\n• Protikorupční impuls (bonus na 1 rok)\n\n§7„Lidé si zaslouží znát pravdu.“§!" # todo: NEW TRANSLATION
 ALG_fln.1.e: "Zahájit rozsáhlou protikorupční kampaň" # todo: NEW TRANSLATION
 ALG_anti_corruption_campaign_tt: "§GZahájit protikorupční kampaň:§!\n• Všechny strany budou poškozeny (včetně FLN)\n• Vysoké náklady ze státní pokladny (§R-15§!)\n• Vysoké náklady na politickou moc (§R-100§!)\n• ALE korupce výrazně klesne\n• §GTrvalé protikorupční reformy§!\n• Dlouhodobý růst stability\n\n§7„Tuto rakovinu zcela vymýtíme!“§!" # todo: NEW TRANSLATION
 ALG_anti_corruption_momentum: "Protikorupční impuls" # todo: NEW TRANSLATION
 ALG_anti_corruption_momentum_desc: "Odhalení korupce vyvolalo ve veřejnosti požadavky na reformu. Tento bolestivý okamžik transparentnosti vytvořil impuls k pozitivní změně." # todo: NEW TRANSLATION
 ALG_anti_corruption_reforms: "Protikorupční reformy" # todo: NEW TRANSLATION
 ALG_anti_corruption_reforms_desc: "Napříč vládou byla zavedena komplexní protikorupční opatření. Transparentní zadávání zakázek, nezávislí auditoři a ochrana whistleblowerů omezují úplatkářství a obnovují důvěru veřejnosti." # todo: NEW TRANSLATION
 ALG_fln.2.t: "Korupční skandál v Sonatrachu" # todo: NEW TRANSLATION
 ALG_fln.2.desc: "V Sonatrachu, alžírské státní ropné společnosti, propukl rozsáhlý korupční skandál. Vyšetřování odhalilo miliardy zpronevěřené prostřednictvím falešných smluv a zahraničních účtů. Do skandálu jsou zapleteni vedoucí představitelé i zahraniční partneři.\n\nVeřejnost požaduje odpovědi. Jak zareagujeme?" # todo: NEW TRANSLATION
 ALG_fln.2.a: "Zametat pod koberec" # todo: NEW TRANSLATION
 ALG_fln.2.b: "Vyšetřit korupci" # todo: NEW TRANSLATION
 ALG_fln.2.c: "Obvinit opozici" # todo: NEW TRANSLATION
 ALG_fln.3.t: "Hirak se probouzí" # todo: NEW TRANSLATION
 ALG_fln.3.desc: "Miliony Alžířanů vyšly do ulic v masovém hnutí požadujícím změnu. Protesty Hiraku sjednotily lidi napříč všemi rozdíly – mladé i staré, sekulární i věřící.\n\n„Yetnahaw Ga3!“ (Všichni musí odejít!) se ozývá v každém městě.\n\nStarý řád se chvěje. Lid našel svůj hlas." # todo: NEW TRANSLATION
 ALG_fln.3.a: "Lid promluvil." # todo: NEW TRANSLATION
 ALG_grievance_increase_5_tt: "§YZášť lidu:§! +5" # todo: NEW TRANSLATION
 ALG_cover_up_scandal: "Zatajení skandálu" # todo: NEW TRANSLATION
 ALG_cover_up_scandal_desc: "Korupční skandál v Sonatrachu byl pohřben, ale šeptanda pokračuje. Zahraniční zpravodajské služby o zatajení vědí a pravda hrozí, že každou chvíli znovu vypluje na povrch." # todo: NEW TRANSLATION
 ALG_anti_corruption_probe: "Protikorupční vyšetřování" # todo: NEW TRANSLATION
 ALG_anti_corruption_probe_desc: "Probíhá důkladné vyšetřování korupce v Sonatrachu. Ačkoli narušuje běžné fungování, vyšetřování obnovuje důvěru veřejnosti a odhaluje zkorumpované úředníky." # todo: NEW TRANSLATION
 ALG_shift_blame: "Vina svalena na opozici" # todo: NEW TRANSLATION
 ALG_shift_blame_desc: "Vláda úspěšně odvedla veřejný hněv nad skandálem v Sonatrachu k opozičním stranám. Tato účinná propaganda však nijak neřeší základní korupci." # todo: NEW TRANSLATION
 ALG_mass_protests: "Masové protesty" # todo: NEW TRANSLATION
 ALG_mass_protests_desc: "Hnutí Hirak přivedlo miliony lidí do ulic po celém Alžírsku. Hospodářská činnost je narušena, protože lidé požadují zásadní změnu. Starý řád se otřásá." # todo: NEW TRANSLATION
 ALG_FLN_chosen: "Zvolena cesta FLN" # todo: NEW TRANSLATION
 ALG_fln_opp_path: "Opoziční cesta FLN" # todo: NEW TRANSLATION
 ALG_domestic_development_focus: "Zaměření na domácí rozvoj" # todo: NEW TRANSLATION
 ALG_domestic_development_focus_desc: "Alžírsko se rozhodlo investovat do vlastního rozvoje namísto zahraniční expanze. Infrastrukturní projekty, průmyslový rozvoj a sociální programy proměňují zemi v moderní a prosperující stát." # todo: NEW TRANSLATION
 ALG_middle_east_expansion: "Expanze na Blízký východ" # todo: NEW TRANSLATION
 ALG_middle_east_expansion_desc: "Naše armády pochodují směrem k Blízkému východu. Vojáci jsou dobře zásobováni a motivováni vidinou slávy a dobývání." # todo: NEW TRANSLATION
 ALG_integrate_kabylie_tt: "§GMírově integrovat Kabýlii§!" # todo: NEW TRANSLATION
 ALG_de_arabisation_effect_TT: "§YPolitika dearabizace:§!\n\n§G Obroda berberského jazyka§!\n  Tamazight se stane spoluúředním jazykem\n\n§G Kulturní uznání§!\n  Amazighská identita bude oslavována po celé zemi\n\n§G Reforma vzdělávání§!\n  Berberské dějiny se budou vyučovat ve školách\n\n§RDůsledky:§!\n  -Podpora arabského nacionalismu\n  -Vztahy s Arabskou ligou\n  +Regionální stabilita Kabýlie" # todo: NEW TRANSLATION
 ALG_civil_reforms_1: "Ochrana občanských práv" # todo: NEW TRANSLATION
 ALG_civil_reforms_1_desc: "Alžírsko zavedlo základní ochranu občanských práv. Občané se těší větší svobodě a byly položeny základy pro další reformy." # todo: NEW TRANSLATION
 ALG_civil_reforms_2: "Občanská práva a rovnost pohlaví" # todo: NEW TRANSLATION
 ALG_civil_reforms_2_desc: "Na základě reforem občanských práv Alžírsko pokročilo v oblasti rovnosti pohlaví. Do pracovního procesu vstupuje více žen, což podporuje produktivitu a růst." # todo: NEW TRANSLATION
 ALG_civil_reforms_3a: "Občanské reformy: svobodný tisk" # todo: NEW TRANSLATION
 ALG_civil_reforms_3a_desc: "Reformní program Alžírska nyní zahrnuje svobodu tisku. Nezávislá média kontrolují vládu, zatímco občanská práva a rovnost pohlaví nadále proměňují společnost." # todo: NEW TRANSLATION
 ALG_civil_reforms_3b: "Občanské reformy: nezávislost soudnictví" # todo: NEW TRANSLATION
 ALG_civil_reforms_3b_desc: "Reformní program Alžírska nyní zahrnuje nezávislé soudnictví. Spravedlivé soudy bojují proti korupci, zatímco občanská práva a rovnost pohlaví nadále proměňují společnost." # todo: NEW TRANSLATION
 ALG_civil_reforms_4: "Komplexní reformy občanské společnosti" # todo: NEW TRANSLATION
 ALG_civil_reforms_4_desc: "Alžírsko dokončilo komplexní reformy občanské společnosti. Občanská práva, rovnost pohlaví, svoboda tisku, nezávislost soudnictví a posílené organizace občanské společnosti proměnily Alžírsko v moderní demokracii." # todo: NEW TRANSLATION
 ALG_gov_reforms_1: "Iniciativa digitální vlády" # todo: NEW TRANSLATION
 ALG_gov_reforms_1_desc: "Alžírsko zahájilo digitalizaci vládních služeb. Online platformy zlepšují poskytování veřejných služeb a omezují byrokratickou neefektivitu." # todo: NEW TRANSLATION
 ALG_gov_reforms_2: "Reformy veřejných služeb" # todo: NEW TRANSLATION
 ALG_gov_reforms_2_desc: "Na základech digitalizace Alžírsko reformovalo veřejné služby. Občané nyní využívají rychlejší a efektivnější státní služby." # todo: NEW TRANSLATION
 ALG_gov_reforms_3a: "Protikorupční reformy" # todo: NEW TRANSLATION
 ALG_gov_reforms_3a_desc: "Alžírská protikorupční kampaň očistila vládní instituce. Transparentnost a odpovědnost byly obnoveny." # todo: NEW TRANSLATION
 ALG_gov_reforms_3b: "Systém elektronické správy" # todo: NEW TRANSLATION
 ALG_gov_reforms_3b_desc: "Portál elektronické správy Alžírska poskytuje občanům bezproblémový online přístup k vládním službám. Byrokratická efektivita se výrazně zlepšila." # todo: NEW TRANSLATION
 ALG_gov_reforms_4: "Moderní administrativní stát" # todo: NEW TRANSLATION
 ALG_gov_reforms_4_desc: "Alžírsko dosáhlo plně modernizované, efektivní a transparentní vlády. Novou správu charakterizují digitální služby, protikorupční opatření a zjednodušená byrokracie." # todo: NEW TRANSLATION
 ALG_african_union_engagement_full_tt: "§GZapojit se do Africké unie:§!\n\n§YÚčinky na všechny členské státy AU:§!\n• §G+25§! názor na Alžírsko\n• §G+2 %§! alžírského vlivu\n\nAlžírsko posílí své postavení předního hlasu v afrických záležitostech." # todo: NEW TRANSLATION
 ALG_mend_ties_with_rabat: "Obnovit vztahy s Rabatem" # todo: NEW TRANSLATION
 ALG_mend_ties_with_rabat_desc: "Alžírsko-marocká hranice je uzavřena od roku 1994. Konflikt o Západní Saharu, Písková válka z roku 1963 a uspořádání z období studené války vytvořily mezi našimi národy hluboké rány.\n\nPřesto sdílíme amazighské a arabské dědictví, stejný boj proti kolonialismu a stejné naděje pro naše lid. Možná nastal čas nechat minulost za sebou a vybudovat nový vztah s Marockým královstvím." # todo: NEW TRANSLATION
 ALG_our_east_brothers: "Naši východní bratři" # todo: NEW TRANSLATION
 ALG_our_east_brothers_desc: "Alžírsko a Tunisko bojovaly bok po boku proti francouzskému kolonialismu. Tuniská půda poskytovala během naší války za nezávislost útočiště alžírským uprchlíkům a bojovníkům FLN.\n\nToto bratrství musí být posíleno. Společně mohou Alžírsko a Tunisko vytvořit jádro sjednoceného Maghrebu a vést severní Afriku k prosperující budoucnosti." # todo: NEW TRANSLATION
 ALG_black_spring: "Černé jaro" # todo: NEW TRANSLATION
 ALG_black_spring_desc: "Dne 18. dubna 2001 byl Massinissa Guermah, mladý kabylský student, zastřelen uvnitř četnické stanice v Beni Douala. Jeho smrt vyvolala největší protesty v Kabýlii od získání nezávislosti, při nichž bezpečnostní síly zabily více než 100 lidí. Černé jaro začalo." # todo: NEW TRANSLATION
 ALG_black_spring_tt: "§HČerné jaro propuká§!\nSmrt Massinissy Guermaha vyvolá masové protesty po celé Kabýlii. Četnictvo zabije více než 100 demonstrantů.\n\n§YPožadavky Kabylů:§!\n- Spravedlnost pro mrtvé\n- Stažení četnictva\n- Uznání tamazightu\n- Konec „hogry“ (pohrdání)" # todo: NEW TRANSLATION
 ALG_negotiate_with_arrouch: "Vyjednávat s Arrouchem" # todo: NEW TRANSLATION
 ALG_negotiate_with_arrouch_desc: "Arrouch (vesnické rady) se zorganizovaly do koordinovaného hnutí zastupujícího kabylské požadavky. Namísto konfrontace zahájíme dialog s těmito tradičními strukturami." # todo: NEW TRANSLATION
 ALG_negotiate_arrouch_tt: "§HHnutí Arrouch§!\nTradiční kabylská vesnická shromáždění se sjednotila, aby předložila své požadavky. Vyjednávání může přinést mír.\n\n§YKlíčové požadavky Arrouchu:§!\n- Uznání platformy El-Kseur\n- Jazyková práva tamazightu\n- Hospodářský rozvoj\n- Konec vojenské přítomnosti" # todo: NEW TRANSLATION
 ALG_recognize_tamazight_2002: "Tamazight: národní jazyk" # todo: NEW TRANSLATION
 ALG_recognize_tamazight_2002_desc: "Dne 8. dubna 2002 bude po intenzivních jednáních tamazight uznán jako národní jazyk Alžírska – historický ústupek berberské identitě." # todo: NEW TRANSLATION
 ALG_tamazight_national_tt: "§HTamazight se stává národním jazykem§!\nHistorický okamžik – tamazight se připojuje k arabštině jako národní jazyk Alžírska.\n\n§YVýznam:§!\n- První uznání berberské identity\n- Ústavní dodatek\n- Školy mohou vyučovat tamazight\n- §GVelké kabylské vítězství§!" # todo: NEW TRANSLATION
 ALG_address_hogra: "Řešit hogru" # todo: NEW TRANSLATION
 ALG_address_hogra_desc: "Hogra – pohrdání a ponižování, které Kabylové pociťují ze strany státu – musí být řešena. Zanedbávání a zneužívání nahradí investice, pracovní místa a respekt." # todo: NEW TRANSLATION
 ALG_address_hogra_tt: "§HKonec hogry§!\n„Hogra“ – systematické pohrdání Kabylů – bude řešena prostřednictvím:\n\n- Investic do infrastruktury v Kabýlii\n- Programů tvorby pracovních míst\n- Ukončení diskriminačních praktik\n- Respektu ke kabylské důstojnosti" # todo: NEW TRANSLATION
 ALG_amazigh_cultural_revival: "Kulturní obroda Amazighů" # todo: NEW TRANSLATION
 ALG_amazigh_cultural_revival_desc: "Investice do berberských kulturních institucí, muzeí a vzdělávacích programů zachovají a oslaví amazighské dědictví, které předchází příchodu Arabů." # todo: NEW TRANSLATION
 ALG_amazigh_revival_tt: "§HAmazighská kulturní renesance§!\n- Založena Amazighská akademie\n- Financována berberská muzea\n- Podporovány kulturní festivaly\n- Propagováno tifinaghské písmo" # todo: NEW TRANSLATION
 ALG_yennayer_national_holiday: "Státní svátek Yennayer" # todo: NEW TRANSLATION
 ALG_yennayer_national_holiday_desc: "V prosinci 2017 prezident Bouteflika prohlásil Yennayer – amazighský Nový rok – za státní svátek. 12. leden se nyní bude slavit po celém Alžírsku." # todo: NEW TRANSLATION
 ALG_yennayer_tt: "§HYennayer se stává státním svátkem§!\nBerberský Nový rok (12. ledna) je nyní oficiálním alžírským svátkem.\n\n§YHistorické uznání:§!\n- Oslava předislámského dědictví\n- Posílení národní jednoty\n- §GZvýšení spokojenosti Kabylů§!" # todo: NEW TRANSLATION
 ALG_tamazight_official_2016: "Tamazight: Úřední jazyk" # todo: NEW TRANSLATION
 ALG_tamazight_official_2016_desc: "Ústavní dodatek z roku 2016 povyšuje tamazight ze „státního“ na „úřední“ jazyk a staví jej na roveň arabštině." # todo: NEW TRANSLATION
 ALG_tamazight_official_tt: "§HTamazight se stává úředním jazykem§!\n§WÚstavní dodatek z roku 2016:§!\n- Tamazight na roveň arabštině\n- Všechny vládní dokumenty dvojjazyčné\n- Berberština na všech školách\n- §GVelké ústavní vítězství§!" # todo: NEW TRANSLATION
 ALG_berber_integration_complete: "Jednota v rozmanitosti" # todo: NEW TRANSLATION
 ALG_berber_integration_complete_desc: "Prostřednictvím dialogu, uznání a investic Alžírsko vyřešilo kabylskou otázku. Arabští a amazighští Alžířané stojí sjednoceni." # todo: NEW TRANSLATION
 ALG_integration_complete_tt: "§HKabylská otázka vyřešena§!\nAlžírsko úspěšně integrovalo své berberské obyvatelstvo prostřednictvím:\n- Uznání jazyka\n- Kulturních investic\n- Hospodářského rozvoje\n- Respektu a dialogu\n\n§GDosaženo národní jednoty!§!" # todo: NEW TRANSLATION
 ALG_crush_the_uprising: "Potlačit povstání" # todo: NEW TRANSLATION
 ALG_crush_the_uprising_desc: "Černé jaro ohrožuje národní jednotu. Žandarmérie obnoví pořádek a separatistické živly budou zneškodněny." # todo: NEW TRANSLATION
 ALG_crush_uprising_tt: "§HCesta potlačení§!\nPoužijeme sílu k ukončení protestů a zachování územní celistvosti Alžírska.\n\n§YVýhody:§!\n- Udržení veškerého území\n- Žádné ústupky separatistům\n- Vojenská kontrola\n\n§RNáklady:§!\n- Mezinárodní kritika\n- Hluboká kabylská zášť\n- Pokračující odpor" # todo: NEW TRANSLATION
 ALG_gendarmerie_reinforcement: "Posílení žandarmérie" # todo: NEW TRANSLATION
 ALG_gendarmerie_reinforcement_desc: "Do Kabylie budou nasazeny další jednotky žandarmérie, aby udržovaly pořádek a zabránily budoucím nepokojům." # todo: NEW TRANSLATION
 ALG_gendarmerie_tt: "§HNasadit bezpečnostní síly§!\n- Zvýšená přítomnost žandarmérie\n- Monitorování protestů\n- Zadržení klíčových aktivistů\n- Pořádek udržován silou" # todo: NEW TRANSLATION
 ALG_arabization_policy: "Politika arabizace" # todo: NEW TRANSLATION
 ALG_arabization_policy_desc: "Jazykem Alžírska je arabština. Zintenzivníme arabizační programy v Kabylíi, abychom čelili separatistické berberské ideologii." # todo: NEW TRANSLATION
 ALG_arabization_1_tt: "§HZintenzivnit arabizaci§!\n- Vynuceno vzdělávání pouze v arabštině\n- Potlačení tamazightu\n- Prosazování islámské identity\n- Boj proti berberské ideologii\n\n§RKabylové budou hluboce rozhořčeni§!" # todo: NEW TRANSLATION
 ALG_ban_mak: "Zakázat MAK" # todo: NEW TRANSLATION
 ALG_ban_mak_desc: "V květnu 2021 bude Mouvement pour l'Autodétermination de la Kabylie (MAK), vedené Ferhatem Mehenniem, označeno za teroristickou organizaci a zakázáno." # todo: NEW TRANSLATION
 ALG_ban_mak_tt: "§HMAK označeno za teroristickou organizaci§!\nHnutí za sebeurčení Kabylie je zakázáno:\n- Ferhat Mehenni označen za teroristu\n- Zatčení stoupenců MAK\n- Separatistická činnost kriminalizována\n\n§ROčekává se mezinárodní kritika§!" # todo: NEW TRANSLATION
 ALG_accuse_foreign_interference: "Obvinit zahraniční síly" # todo: NEW TRANSLATION
 ALG_accuse_foreign_interference_desc: "Separatistické hnutí MAK není původní – je financováno a podporováno zahraničními mocnostmi, které se snaží destabilizovat Alžírsko. Maroko a další musí být odhaleni." # todo: NEW TRANSLATION
 ALG_foreign_interference_tt: "§HObvinit zahraniční mocnosti§!\nMAK je obviněno z role zahraničního prostředníka:\n- Maroko obviněno z financování MAK\n- Vnější spiknutí proti Alžírsku\n- Národní jednota proti nepřátelům\n\n§RZvýší se diplomatické napětí§!" # todo: NEW TRANSLATION
 ALG_mak_israel_connection: "Spojení MAK–Izrael" # todo: NEW TRANSLATION
 ALG_mak_israel_connection_desc: "Setkání Ferhata Mehenniho s izraelskými představiteli dokazuje, že MAK je sionistickým projektem zaměřeným na rozdělení arabského světa. Toto spojení musí být odhaleno." # todo: NEW TRANSLATION
 ALG_mak_israel_tt: "§HOdhaleno spojení MAK–Izrael§!\n- MAK označeno za sionistický projekt\n- Izrael obviněn z destabilizace\n- Získána podpora Arabské ligy\n- Mobilizovány protiizraelské nálady\n\n§YDomácí podpora §Groste§!§!\n§RVztahy s Izraelem budou zničeny§!" # todo: NEW TRANSLATION
 ALG_kabylie_pacified: "Kabylie pacifikována" # todo: NEW TRANSLATION
 ALG_kabylie_pacified_desc: "Prostřednictvím bezpečnostních operací a politického potlačování byla Kabylie přivedena pod kontrolu. Separatistická hrozba je zadržena." # todo: NEW TRANSLATION
 ALG_kabylie_pacified_tt: "§HKabylie pod kontrolou§!\n- MAK rozdrceno\n- Separatismus kriminalizován\n- Bezpečnostní síly převzaly kontrolu\n- Národní jednota vynucena\n\n§YAle zášť doutná pod povrchem.§!" # todo: NEW TRANSLATION
 ALG_el_kseur_platform: "Přijmout platformu El-Kseur" # todo: NEW TRANSLATION
 ALG_el_kseur_platform_desc: "Platforma El-Kseur, kterou Arrouch vypracovalo 11. června 2001, obsahuje 15 požadavků na spravedlnost a práva. Přijmeme ji jako základ jednání." # todo: NEW TRANSLATION
 ALG_el_kseur_tt: "§HPřijmout platformu El-Kseur§!\n15 požadavků zahrnuje:\n- Spravedlnost pro oběti Černého jara\n- Stažení žandarmérie\n- Úřední status tamazightu\n- Konec hogry\n- Hospodářský rozvoj\n- Demokratické reformy\n\n§RNutné radikální ústupky§!" # todo: NEW TRANSLATION
 ALG_withdraw_gendarmerie: "Stáhnout žandarmérii" # todo: NEW TRANSLATION
 ALG_withdraw_gendarmerie_desc: "Klíčový požadavek El-Kseuru – nenáviděná žandarmérie bude z Kabylie stažena a nahrazena místní policií." # todo: NEW TRANSLATION
 ALG_withdraw_gendarmerie_tt: "§HStažení žandarmérie§!\n- Paramilitární síly opouštějí Kabylíi\n- Kontrolu přebírá místní policie\n- Omezení vojenské přítomnosti\n- Splnění hlavního kabylského požadavku\n\n§RVojenské velení bude nespokojené§!" # todo: NEW TRANSLATION
 ALG_trial_responsible_officers: "Soud s odpovědnými důstojníky" # todo: NEW TRANSLATION
 ALG_trial_responsible_officers_desc: "Důstojníci odpovědní za úmrtí během Černého jara budou postaveni před spravedlnost. Tento bezprecedentní krok uznává státní zločiny proti Kabylům." # todo: NEW TRANSLATION
 ALG_trial_officers_tt: "§HStíhat odpovědné důstojníky§!\n- Důstojníci stanou před soudem za zabíjení\n- Rodiny obětí odškodněny\n- Stát uznává zločiny\n- Historická odpovědnost\n\n§RVojenské velení bude zuřit§!\n§GMezinárodní uznání roste§!" # todo: NEW TRANSLATION
 ALG_secular_berber_identity: "Sekulární berberská identita" # todo: NEW TRANSLATION
 ALG_secular_berber_identity_desc: "Kabylie byla historicky sekulárnější než zbytek Alžírska. Uznání sekulární berberské identity zpochybňuje arabsko-islámskou definici alžírského národa." # todo: NEW TRANSLATION
 ALG_secular_berber_tt: "§HUznat sekulární amazighskou identitu§!\n- Oslava předislámského dědictví\n- Ochrana sekulárních hodnot\n- Zaručení náboženské svobody\n- Zpochybnění islamistického narativu\n\n§RIslamisté se postaví proti§!" # todo: NEW TRANSLATION
 ALG_mak_dialogue: "Dialog s MAK" # todo: NEW TRANSLATION
 ALG_mak_dialogue_desc: "Zahájení dialogu se separatistickým hnutím MAK Ferhata Mehenniho. To s sebou nese riziko legitimizace separatismu, ale může jít o jedinou cestu k míru." # todo: NEW TRANSLATION
 ALG_mak_dialogue_tt: "§HZahájit dialog s MAK§!\nJednat se separatisty:\n- Navázání kontaktu s Ferhatem Mehenniem\n- Diskuse o sebeurčení\n- Prozkoumání autonomie\n- Nezávislost na stole\n\n§REExtrémně kontroverzní§!\n§RRiziko legitimizace separatismu§!" # todo: NEW TRANSLATION
 ALG_reject_separatism: "Odmítnout separatismus" # todo: NEW TRANSLATION
 ALG_reject_separatism_desc: "Při respektování berberských práv je územní celistvost Alžírska nevyjednatelná. Jednota v rozmanitosti – nikoli rozdělení – je odpovědí." # todo: NEW TRANSLATION
 ALG_reject_separatism_tt: "§HJednota v rozmanitosti§!\n- Separatismus odmítnut\n- Berberská práva zaručena\n- Územní celistvost zachována\n- Rozmanité, avšak sjednocené Alžírsko" # todo: NEW TRANSLATION
 ALG_kabyle_autonomy_statute: "Statut kabylské autonomie" # todo: NEW TRANSLATION
 ALG_kabyle_autonomy_statute_desc: "Formální statut autonomie pro Kabylíi – samospráva v místních záležitostech při zachování příslušnosti k Alžírsku. Historický kompromis." # todo: NEW TRANSLATION
 ALG_autonomy_statute_tt: "§HKabylie získává autonomii§!\n- Zřízen regionální parlament\n- Tamazight uznán jako úřední jazyk\n- Pravomoc vybírat místní daně\n- Udělena kulturní autonomie\n\n§YKabylie zůstává součástí Alžírska§!" # todo: NEW TRANSLATION
 ALG_federal_algeria: "Federální Alžírsko" # todo: NEW TRANSLATION
 ALG_federal_algeria_desc: "Alžírsko se mění ve federální republiku, jejímž prvním autonomním regionem se stává Kabylie. Ostatní regiony mohou tento model následovat." # todo: NEW TRANSLATION
 ALG_federal_algeria_tt: "§HAlžírsko se stává federací§!\n- Přijata federální ústava\n- Udělena regionální autonomie\n- Kabylie jako vzor\n- Decentralizace moci\n- Jednota prostřednictvím federalismu" # todo: NEW TRANSLATION
 ALG_united_secular_algeria: "Sjednocené sekulární Alžírsko" # todo: NEW TRANSLATION
 ALG_united_secular_algeria_desc: "Sjednocené sekulární Alžírsko, které respektuje všechny identity – arabskou i amazighskou, muslimskou i sekulární. Rozmanitost je naší silou." # todo: NEW TRANSLATION
 ALG_united_secular_tt: "§HSjednocené sekulární Alžírsko§!\n- Zřízen sekulární stát\n- Respekt ke všem identitám\n- Žádný separatismus\n- Žádný islamismus\n- Moderní demokracie" # todo: NEW TRANSLATION
 ALG_release_kby_autonomous_tt: "§YUvolnit Kabylíi jako autonomní region§!" # todo: NEW TRANSLATION
 ALG_black_spring_spirit: "Nepokoje Černého jara" # todo: NEW TRANSLATION
 ALG_black_spring_spirit_desc: "Zabití Massinissy Guermaha zažehlo největší protesty od získání nezávislosti. Kabylie hoří hněvem proti státu." # todo: NEW TRANSLATION
 ALG_arrouch_negotiations: "Jednání s Arrouch" # todo: NEW TRANSLATION
 ALG_arrouch_negotiations_desc: "Vláda jedná s hnutím Arrouch. Tradiční vesnické rady nyní hovoří za Kabylíi." # todo: NEW TRANSLATION
 ALG_tamazight_national_language: "Tamazight jako národní jazyk" # todo: NEW TRANSLATION
 ALG_tamazight_national_language_desc: "Tamazight byl uznán jako národní jazyk Alžírska – významný krok k uznání Berberů." # todo: NEW TRANSLATION
 ALG_tamazight_official_language: "Tamazight jako úřední jazyk" # todo: NEW TRANSLATION
 ALG_tamazight_official_language_desc: "Ústava z roku 2016 učinila tamazight úředním jazykem na roveň arabštině. Historický úspěch pro berberská práva." # todo: NEW TRANSLATION
 ALG_addressing_kabyle_grievances: "Řešení kabylských křivd" # todo: NEW TRANSLATION
 ALG_addressing_kabyle_grievances_desc: "Vláda investuje do Kabylie a řeší roky zanedbávání a „hogry“ (pohrdání)." # todo: NEW TRANSLATION
 ALG_amazigh_cultural_institutions: "Amazighské kulturní instituce" # todo: NEW TRANSLATION
 ALG_amazigh_cultural_institutions_desc: "Investice do berberských kulturních institucí zachovávají a oslavují amazighské dědictví Alžírska." # todo: NEW TRANSLATION
 ALG_united_algeria: "Sjednocené Alžírsko" # todo: NEW TRANSLATION
 ALG_united_algeria_desc: "Prostřednictvím dialogu a respektu Alžírsko sjednotilo své arabské a amazighské obyvatelstvo. Kabylská otázka je vyřešena." # todo: NEW TRANSLATION
 ALG_kabyle_crackdown: "Potlačení Kabylů" # todo: NEW TRANSLATION
 ALG_kabyle_crackdown_desc: "Bezpečnostní síly potlačují kabylské protesty. Pořádek je obnovován silou." # todo: NEW TRANSLATION
 ALG_gendarmerie_deployed: "Nasazení žandarmérie" # todo: NEW TRANSLATION
 ALG_gendarmerie_deployed_desc: "Jednotky žandarmérie jsou rozmístěny po celé Kabylíi, udržují pořádek a sledují opozici." # todo: NEW TRANSLATION
 ALG_forced_arabization: "Nucená arabizace" # todo: NEW TRANSLATION
 ALG_forced_arabization_desc: "Arabizační politika je v Kabylíi zintenzivňována. Berberská identita je potlačována ve prospěch arabsko-islámského nacionalismu." # todo: NEW TRANSLATION
 ALG_mak_banned: "MAK zakázáno" # todo: NEW TRANSLATION
 ALG_mak_banned_desc: "Hnutí za sebeurčení Kabylie bylo označeno za teroristickou organizaci. Separatismus je nyní kriminalizován." # todo: NEW TRANSLATION
 ALG_foreign_hands_narrative: "Narativ o zahraničních silách" # todo: NEW TRANSLATION
 ALG_foreign_hands_narrative_desc: "Vláda obviňuje ze separatismu Kabylů zahraniční mocnosti – zejména Maroko a Izrael. Vnější nepřátelé sjednocují národ." # todo: NEW TRANSLATION
 ALG_mak_terrorist_designation: "Označení MAK za teroristické" # todo: NEW TRANSLATION
 ALG_mak_terrorist_designation_desc: "MAK a Ferhat Mehenni jsou označeni za teroristy s vazbami na Izrael. Separatistická hrozba je vykreslována jako sionistické spiknutí." # todo: NEW TRANSLATION
 ALG_kabylie_under_control: "Kabylie pod kontrolou" # todo: NEW TRANSLATION
 ALG_kabylie_under_control_desc: "Kabylie je prostřednictvím síly a politického potlačování pod kontrolou vlády. Pod povrchem však doutná zášť." # todo: NEW TRANSLATION
 ALG_el_kseur_negotiations: "Jednání v El-Kseuru" # todo: NEW TRANSLATION
 ALG_el_kseur_negotiations_desc: "Vláda přijala platformu El-Kseur jako základ jednání s Kabylíí." # todo: NEW TRANSLATION
 ALG_secular_amazigh_movement: "Sekulární amazighské hnutí" # todo: NEW TRANSLATION
 ALG_secular_amazigh_movement_desc: "Je uznávána sekulární berberská identita, která zpochybňuje arabsko-islámskou definici alžírského národa." # todo: NEW TRANSLATION
 ALG_mak_negotiations: "Jednání s MAK" # todo: NEW TRANSLATION
 ALG_mak_negotiations_desc: "Vláda vede bezprecedentní dialog se separatistickým hnutím MAK. Budoucnost Kabylie visí na vlásku." # todo: NEW TRANSLATION
 ALG_unity_within_diversity: "Jednota v rozmanitosti" # todo: NEW TRANSLATION
 ALG_unity_within_diversity_desc: "Alžírsko přijímá svou rozmanitost – arabskou i amazighskou, muslimskou i sekulární – a zároveň zachovává národní jednotu. Separatismus je odmítnut." # todo: NEW TRANSLATION
 ALG_federal_republic: "Federální republika" # todo: NEW TRANSLATION
 ALG_federal_republic_desc: "Alžírsko se stalo federální republikou, jejímž prvním autonomním regionem je Kabylie. Moc je decentralizována při zachování jednoty." # todo: NEW TRANSLATION
 ALG_secular_united_nation: "Sekulární sjednocený národ" # todo: NEW TRANSLATION
 ALG_secular_united_nation_desc: "Alžírsko se stalo sjednoceným sekulárním národem, který respektuje všechny identity a odmítá separatismus i náboženský extremismus." # todo: NEW TRANSLATION
 KBY_autonomous_kabylie: "Autonomní Kabylie" # todo: NEW TRANSLATION
 KBY_autonomous_kabylie_desc: "Kabylie dosáhla autonomie v rámci Alžírska. Samospráva v místních záležitostech při zachování příslušnosti k národu." # todo: NEW TRANSLATION
 KBY_federal_partner: "Federální partner" # todo: NEW TRANSLATION
 KBY_federal_partner_desc: "Jako federální partner Alžírska se Kabylie těší plné autonomii a rovnoprávnému postavení v alžírské federaci." # todo: NEW TRANSLATION
 ALG_kabyle_autonomy: "Cesta kabylské autonomie" # todo: NEW TRANSLATION
 ALG_kabyle_suppressed: "Cesta potlačení Kabylů" # todo: NEW TRANSLATION
 ALG_kabyle_independence: "Cesta kabylské nezávislosti" # todo: NEW TRANSLATION
 ALG_black_spring_triggered: "Černé jaro vypuklo" # todo: NEW TRANSLATION
 ALG_kabyle_issue_resolved: "Kabylská otázka vyřešena" # todo: NEW TRANSLATION
 ALG_kabyle_suppressed_complete: "Potlačení Kabylů dokončeno" # todo: NEW TRANSLATION
 ALG_became_federal: "Alžírsko se stalo federací" # todo: NEW TRANSLATION
 ALG_secular_path_complete: "Sekulární cesta dokončena" # todo: NEW TRANSLATION
 human_rights_violation: "Porušování lidských práv" # todo: NEW TRANSLATION
 human_rights_progress: "Pokrok v oblasti lidských práv" # todo: NEW TRANSLATION
 accused_of_interference: "Obvinění ze vměšování" # todo: NEW TRANSLATION
 accused_of_terrorism_support: "Obvinění z podpory terorismu" # todo: NEW TRANSLATION
 anti_israel_stance: "Protiizraelský postoj" # todo: NEW TRANSLATION
 ALG_bribe_malian_generals: "Podplatit malijské generály" # todo: NEW TRANSLATION
 ALG_bribe_malian_generals_desc: "Malijskou vojenskou juntu lze ovlivnit pečlivým rozdělováním finančních prostředků. Podplacením klíčových generálů může Alžírsko získat vliv na rozhodování v Bamaku a zajistit naše zájmy v Sahelu." # todo: NEW TRANSLATION
 ALG_isolate_mali_regime: "Izolovat malijský režim" # todo: NEW TRANSLATION
 ALG_isolate_mali_regime_desc: "Vojenský režim v Bamaku destabilizoval region a ohrozil tuaregské obyvatelstvo. Alžírsko se pokusí juntu mezinárodně izolovat a postavit se do role legitimního prostředníka v sahelské krizi." # todo: NEW TRANSLATION
 ALG_isolate_mali_tt: "§HIzolovat malijský režim§!\nVyužijeme diplomatický tlak a kanály Africké unie k odsouzení vojenské junty.\n\n§YVýhody:§!\n- Regionální vedení Alžírska\n- Zvýšená podpora Tuaregů\n- Oslabení Mali\n- Získaný vliv v AU\n\n§WVýsledek:§!\nAlžírsko se stává klíčovým prostředníkem v záležitostech Sahelu" # todo: NEW TRANSLATION
 ALG_au_condemns_mali_tt: "§YAfrická unie odsuzuje malijský režim§!\nVšichni členové AU zhorší své mínění o Mali" # todo: NEW TRANSLATION
 ALG_malian_general_network: "Síť malijských generálů" # todo: NEW TRANSLATION
 ALG_malian_general_network_desc: "Síť podplacených malijských generálů poskytuje Alžírsku zpravodajské informace a vliv na vojenskou juntu v Bamaku." # todo: NEW TRANSLATION
 ALG_sahel_mediator: "Prostředník v Sahelu" # todo: NEW TRANSLATION
 ALG_sahel_mediator_desc: "Alžírsko se stalo hlavním diplomatickým prostředníkem v konfliktech v Sahelu. Náš hlas má v regionálních záležitostech váhu." # todo: NEW TRANSLATION
 MAL_international_isolation: "Mezinárodní izolace" # todo: NEW TRANSLATION
 MAL_international_isolation_desc: "Vojenský režim čelí mezinárodnímu odsouzení a izolaci. Obchod je narušen, zahraniční pomoc pozastavena a vláda má potíže udržet kontrolu." # todo: NEW TRANSLATION
 ALG_bribed_our_generals: "Podplatili jsme naše generály" # todo: NEW TRANSLATION
 ALG_supported_our_cause: "Podpořili naši věc" # todo: NEW TRANSLATION
 AU_condemned_regime: "AU odsoudila režim" # todo: NEW TRANSLATION
 ALG_bribed_mali_generals: "Podplacení malijští generálové" # todo: NEW TRANSLATION
 ALG_isolated_mali: "Izolovaný malijský režim" # todo: NEW TRANSLATION
 ALG_dziri_unlock_tt: "§YVyžaduje jednu z možností:§!\n- Dokončeno §HObnovit naději§!\n- Dokončeno §HOdolávat Le Pouvoir§!\n- Dokončen §Hvojenský převrat§!" # todo: NEW TRANSLATION
 ALG_requires_democratic_or_neutral_tt: "Vyžaduje §Hdemokratickou§! nebo §Hneutrální§! vládu" # todo: NEW TRANSLATION
 ALG_requires_authoritarian_or_neutral_tt: "Vyžaduje §Hautoritářskou§! nebo §Hneutrální§! vládu" # todo: NEW TRANSLATION
 ALG_not_gender_equality_tt: "§RNeslučitelné s ideou Rovnost pohlaví§!" # todo: NEW TRANSLATION
 ALG_not_suppressed_kabyle_tt: "§RNení dostupné, pokud byla Kabylie potlačena§!" # todo: NEW TRANSLATION
 ALG_migration_event_required_tt: "§YOdemčeno událostí Migrační krize§!" # todo: NEW TRANSLATION
 ALG_drug_event_required_tt: "§YOdemčeno událostí Drogová krize§!" # todo: NEW TRANSLATION
 ALG_bouteflika_crisis_unlock_tt: "§YVyžaduje, aby se rozšířily zprávy o prezidentově nemoci§!" # todo: NEW TRANSLATION
 ALG_dziri_tt: "§GVětev alžírské společnosti odemčena:§!\n\nVyberte, jak utvářet alžírskou společnost – pokrokově, nebo tradičně; otevřeně, nebo uzavřeně." # todo: NEW TRANSLATION
 ALG_dziri_unlocks_tt: "§YOdemkne větev společnosti:§!\n- Cesta občanské společnosti (demokratická/neutrální)\n- Cesta tradic (autoritářská/neutrální)\n- Berberská práva (demokratická/neutrální)\n- Reakce na drogy (spuštěná událostí)\n- Reakce na migraci (spuštěná událostí)" # todo: NEW TRANSLATION
 ALG_open_civil_society_tt: "§GOtevřená občanská společnost:§!\n\n- Nevládní organizace a charitativní spolky vzkvétají\n- Roste demokratická účast\n- Základ pro pokrokové reformy" # todo: NEW TRANSLATION
 ALG_constitutionalize_rights_tt: "§GÚstavní práva:§!\n\n- Ochrana základních svobod\n- Posílení právního státu\n- Mezinárodní uznání" # todo: NEW TRANSLATION
 ALG_integration_policy_tt: "§GIntegrační programy:§!\n\n- Migranti se stávají produktivními občany\n- Zisk pracovní síly\n- Sociální soudržnost" # todo: NEW TRANSLATION
 ALG_unlocks_migration_branch_tt: "§YOdemkne větev reakce na migraci§!\n(Při spuštění migrační události)" # todo: NEW TRANSLATION
 ALG_migration_problems_tt: "§YMigrační krize:§!\n\nMigranti ze subsaharské Afriky zaplavují jižní hranice Alžírska. Musíte zvolit, jak reagovat." # todo: NEW TRANSLATION
 ALG_migration_choice_tt: "§YVolba:§!\n- §GOtevřená politika§! – Přivítat migranty\n- §RUzavřené hranice§! – Zabezpečit hranici" # todo: NEW TRANSLATION
 ALG_open_door_tt: "§GOtevřená politika:§!\n\n- Přivítat migranty a uprchlíky\n- Zisk pracovní síly\n- Určitá ztráta stability\n- Humanitární pověst" # todo: NEW TRANSLATION
 ALG_closed_borders_tt: "§RUzavřené hranice:§!\n\n- Zabezpečit hranici\n- Zisk stability\n- Omezení zahraničního vlivu\n- Zpomalení růstu populace" # todo: NEW TRANSLATION
 ALG_expand_berber_rights_tt: "§GRozšířit berberská práva:§!\n\n- Oslava amazighské kultury\n- Zvýšení spokojenosti Kabylů\n- Výhody výzkumu díky rozmanitosti" # todo: NEW TRANSLATION
 ALG_drug_problem_tt: "§YDrogová krize:§!\n\nObchod s drogami z Maroka a Sahelu způsobil problémy se závislostí. Musíte zvolit, jak reagovat." # todo: NEW TRANSLATION
 ALG_drug_choice_tt: "§YVolba:§!\n- §GDe\-kriminalizovat§! – Přístup založený na zdravotní péči\n- §RPřitvrdit tresty§! – Přístup založený na prosazování práva" # todo: NEW TRANSLATION
 ALG_relax_restrictions_tt: "§GDe\-kriminalizovat drogy:§!\n\n- Zacházet se závislostí jako se zdravotním problémem\n- Snížit počet vězňů\n- Část vlivu mafie zůstává\n- Omezení mezinárodní kritiky" # todo: NEW TRANSLATION
 ALG_tighten_punishments_tt: "§RTvrdě zakročit proti drogám:§!\n\n- Přísné tresty pro dealery\n- Omezení vlivu mafie\n- Zvýšení podpory války\n- Určitá ztráta stability" # todo: NEW TRANSLATION
 ALG_traditions_matter_tt: "§GTradiční hodnoty:§!\n\n- Zachování alžírských zvyků\n- Prosazování náboženských hodnot\n- Odpor vůči západnímu vlivu" # todo: NEW TRANSLATION
 ALG_unlocks_conservative_path_tt: "§YOdemkne konzervativní společenskou cestu§!" # todo: NEW TRANSLATION
 ALG_censor_internet_tt: "§YCenzurovat internet:§!\n\n- Blokovat zahraniční propagandu\n- Kontrolovat tok informací\n- Omezit zahraniční vliv\n- Mírné zpomalení výzkumu" # todo: NEW TRANSLATION
 ALG_restrict_women_tt: "§YTradiční role pohlaví:§!\n\n- Povzbuzovat ženy, aby zůstaly doma\n- Porodnost může vzrůst\n- Omezení pracovní síly\n- Kritika ze Západu" # todo: NEW TRANSLATION
 ALG_marriage_subsidies_tt: "§GDotace na sňatky:§!\n\n- Vláda platí svatby\n- Podpora růstu populace\n- Náklady pro státní pokladnu\n- Prosazování tradičních hodnot" # todo: NEW TRANSLATION
 ALG_open_civil_society_idea: "Otevřená občanská společnost" # todo: NEW TRANSLATION
 ALG_open_civil_society_idea_desc: "Alžírsko má živou občanskou společnost s aktivními nevládními organizacemi, charitativními spolky a komunitními organizacemi, které přispívají k veřejnému životu." # todo: NEW TRANSLATION
 ALG_constitutionalize_rights_idea: "Ústavní práva" # todo: NEW TRANSLATION
 ALG_constitutionalize_rights_idea_desc: "Základní práva jsou zakotvena v ústavě, chrání alžírské občany a posilují právní stát." # todo: NEW TRANSLATION
 ALG_integration_policy_idea: "Integrační politika" # todo: NEW TRANSLATION
 ALG_integration_policy_idea_desc: "Alžírsko aktivně integruje migranty a uprchlíky, poskytuje jazykovou výuku a cesty k získání občanství." # todo: NEW TRANSLATION
 ALG_migration_crisis: "Migrační krize" # todo: NEW TRANSLATION
 ALG_migration_crisis_desc: "Vlny migrantů ze subsaharské Afriky zahltily pohraniční zařízení a vyvolaly společenské napětí." # todo: NEW TRANSLATION
 ALG_welcome_migrants: "Otevřená politika" # todo: NEW TRANSLATION
 ALG_welcome_migrants_desc: "Alžírsko vítá migranty a uprchlíky a poskytuje jim humanitární pomoc a podporu integrace." # todo: NEW TRANSLATION
 ALG_refugees_maintained: "Spravovaná populace uprchlíků" # todo: NEW TRANSLATION
 ALG_refugees_maintained_desc: "Populace uprchlíků v Alžírsku je dobře spravována díky vhodným zařízením a integračním programům." # todo: NEW TRANSLATION
 ALG_drug_crisis: "Drogová krize" # todo: NEW TRANSLATION
 ALG_drug_crisis_desc: "Obchod s drogami a závislost se staly vážnými problémy a zatěžují orgány činné v trestním řízení i zdravotnictví." # todo: NEW TRANSLATION
 ALG_traditions_matter_idea: "Tradiční hodnoty" # todo: NEW TRANSLATION
 ALG_traditions_matter_idea_desc: "Alžírsko prosazuje tradiční hodnoty včetně rodiny, víry a komunity. Západnímu kulturnímu vlivu se staví na odpor." # todo: NEW TRANSLATION
 ALG_censored_internet_idea: "Cenzurovaný internet" # todo: NEW TRANSLATION
 ALG_censored_internet_idea_desc: "Vláda kontroluje přístup k internetu a blokuje zahraniční propagandu a nemorální obsah." # todo: NEW TRANSLATION
 ALG_women_role_idea: "Tradiční role pohlaví" # todo: NEW TRANSLATION
 ALG_women_role_idea_desc: "Ženy jsou povzbuzovány k přijetí tradičních rolí hospodyněk a matek. Podíl žen na pracovní síle klesl." # todo: NEW TRANSLATION
 ALG_marriage_subsidies_idea: "Dotace na sňatky" # todo: NEW TRANSLATION
 ALG_marriage_subsidies_idea_desc: "Vláda dotuje sňatky, pomáhá mladým párům zaplatit svatbu a podporuje zakládání rodin." # todo: NEW TRANSLATION
 restricts_women_rights: "Omezuje práva žen" # todo: NEW TRANSLATION
 ALG_migration_flood: "Migrační krize probíhá" # todo: NEW TRANSLATION
 ALG_drugs: "Drogová krize probíhá" # todo: NEW TRANSLATION
 ALG_mediterranean_games_preparation: "Příprava na Středomořské hry" # todo: NEW TRANSLATION
 ALG_mediterranean_games_preparation_desc: "Oran se proměňuje kvůli Středomořským hrám v roce 2022. Stavební dělníci nepřetržitě pracují na olympijském komplexu, nových stadionech a olympijské vesnici. Národ se sjednocuje kolem této historické události, protože se Alžírsko připravuje přivítat na svém území 26 národů." # todo: NEW TRANSLATION
 ALG_more_infra: "Rozšířit infrastrukturu" # todo: NEW TRANSLATION
 ALG_more_infra_desc: "Alžírská infrastruktura vyžaduje výrazné rozšíření, aby podpořila hospodářský růst. Nové silnice, železnice a inženýrské sítě propojí komunity a usnadní obchod po celé zemi." # todo: NEW TRANSLATION
 TT_ALG_SECULAR_DISCONTENT_MODIFIER: "§RSekularisté jsou stále nespokojenější§!\nPokrokoví a sekulární Alžířané se staví proti náboženské politice." # todo: NEW TRANSLATION
 TT_ALG_ISLAMIST_SATISFACTION_MODIFIER: "§GPodpora islamistů roste§!\nNáboženští konzervativci tato opatření schvalují." # todo: NEW TRANSLATION
 ALG_more_relation_better: "§HJe§! §Gpravděpodobnější, že se přidají§! §Hpokud máme§! §Glepší vztahy!§!" # todo: NEW TRANSLATION
 ALG_improve_relations_with_egypt: "Zlepšit vztahy s Egyptem" # todo: NEW TRANSLATION
 ALG_improve_relations_with_egypt_desc: "Egypt a Alžírsko sdílejí hluboké vazby jako přední arabské národy. MSP, jehož kořeny sahají k tradici Muslimského bratrstva, považuje Káhiru za přirozeného partnera. Posílení vztahů s Egyptem zlepší naše postavení v arabském světě a otevře dveře hospodářské a náboženské spolupráci." # todo: NEW TRANSLATION
 algerian_military_dismantling: "Rozebrání armády" # todo: NEW TRANSLATION
 algerian_military_dismantling_desc: "Alžírská armáda je systematicky rozebírána. Výzbroj je vyřazována, jednotky rozpouštěny a důstojníci odcházejí do penze. Kdysi mocná Alžírská národní lidová armáda je jen stínem své někdejší podoby." # todo: NEW TRANSLATION
 algerian_student_exchanges: "Programy studentských výměn" # todo: NEW TRANSLATION
 algerian_student_exchanges_desc: "Alžírští studenti studují na zahraničních univerzitách, zatímco zahraniční studenti přicházejí do Alžírska. Tyto výměny budují vazby, předávají znalosti a vzdělávají další generaci alžírských odborníků." # todo: NEW TRANSLATION
 ALG_boost_reformists: "Posílit reformisty" # todo: NEW TRANSLATION
 ALG_boost_old_guard: "Posílit starou gardu" # todo: NEW TRANSLATION
 ALG_rally_students: "Mobilizovat studenty" # todo: NEW TRANSLATION
 ALG_mobilize_veterans: "Mobilizovat veterány" # todo: NEW TRANSLATION
 ALG_bribe_elites: "Podplatit elity" # todo: NEW TRANSLATION
 ALG_seek_compromise: "Hledat kompromis" # todo: NEW TRANSLATION
 ALG_media_campaign_reform: "Reforma mediální kampaně" # todo: NEW TRANSLATION
 ALG_security_crackdown: "Bezpečnostní represe" # todo: NEW TRANSLATION
 ALG_world_tension_security: "Bezpečnostní světové napětí" # todo: NEW TRANSLATION
 ALG_world_tension_high_security: "Vysoké bezpečnostní světové napětí" # todo: NEW TRANSLATION
 ALG_path_crackdown_momentum: "Impuls represí" # todo: NEW TRANSLATION
 ALG_path_reconciliation_momentum: "Impuls usmíření" # todo: NEW TRANSLATION
 ALG_oil_patronage: "Ropné klientelství" # todo: NEW TRANSLATION
 ALG_economic_reforms: "Hospodářské reformy" # todo: NEW TRANSLATION
 ALG_ter_oboronaup_start: "Územní obrana" # todo: NEW TRANSLATION
 ALG_internalup_start: "Vnitřní vojska" # todo: NEW TRANSLATION
 ALG_MAJLIS_WATANI_SHAABI_DESC: "Lidové národní shromáždění je dolní komorou alžírského parlamentu. V tomto systému náleží výkonná moc shromáždění, nikoli jedinému prezidentovi, čímž vzniká skutečná parlamentní republika, v níž zvolení zástupci společně řídí národ." # todo: NEW TRANSLATION
 ALG_a_new_algeria_tt: "Bouteflikova korupční síť je rozložena. Jejich ukradené bohatství je zabaveno, jejich majetek prodán a získané prostředky vráceny do státní pokladny." # todo: NEW TRANSLATION
 FIS_faction_middle_east_available_tt: "Alespoň jeden sunnitský stát Blízkého východu k nám musí mít vztah vyšší než 70 a musí prosazovat intervencionistickou zahraniční politiku" # todo: NEW TRANSLATION
 FIS_faction_asia_available_tt: "Alespoň jeden asijský sunnitský stát k nám musí mít vztah vyšší než 70 a musí prosazovat intervencionistickou zahraniční politiku" # todo: NEW TRANSLATION
 ALG_4g_upgrade_decisions_tt: "Odemkne rozhodnutí k modernizaci infrastruktury celostátní sítě 4G." # todo: NEW TRANSLATION
 ALG_environmental_campaign_no_space_tt: "Nebyly nalezeny žádné volné stavební sloty. Místo toho byl domácí vliv zvýšen prostřednictvím mediální ekologické kampaně." # todo: NEW TRANSLATION
 ALG_grand_mufti_rule_djaballah_tt: "Abdallah Djaballah bude jmenován novou hlavou státu a přinese do správy Alžírska konzervativní islamistický směr." # todo: NEW TRANSLATION
 ALG_grand_mufti_rule_ulema_tt: "Rada ulemů bude konzultována za účelem určení náboženského vedení Alžírska, čímž bude zahájena volba mezi soupeřícími duchovními frakcemi." # todo: NEW TRANSLATION
 ALG_revivify_non_aligned_movement_t: "Alžírsko bude pracovat na oživení Hnutí nezúčastněných zemí a postaví se do role předního hlasu národů stojících mimo bloky velmocí." # todo: NEW TRANSLATION
 TT_ALG_REDUCE_TAXES_5: "Daňová sazba pro obyvatelstvo bude snížena o 5 %, čímž se zmírní zátěž nižších vrstev a získá podpora mezi rolnictvem." # todo: NEW TRANSLATION
 ALG_east_west_highway: "Východo-západní dálnice" # todo: NEW TRANSLATION
 ALG_east_west_highway_desc: "Východo-západní dálnice bude hospodářskou páteří Alžírska, spojí hlavní populační centra od Annaby po Tlemcen a výrazně zlepší vnitřní obchod i mobilitu." # todo: NEW TRANSLATION
 ALG_future_national_policy1: "Národ na rozcestí" # todo: NEW TRANSLATION
 ALG_future_national_policy1_desc: "Budoucnost Alžírska zůstává nepsaná. Rozhodnutí učiněná v nadcházejících letech určí charakter státu, jeho hodnoty, spojence i místo ve světě." # todo: NEW TRANSLATION
 ALG_el_karaouin_uni: "Univerzita al-Karavijín" # todo: NEW TRANSLATION
 ALG_el_karaouin_uni_desc: "Navázáním vztahů s jednou z nejstarších islámských univerzit na světě FIS vychová generaci učenců loajálních novému řádu a odloučí armádu od náboženské autority." # todo: NEW TRANSLATION
 ALG_father_of_the_ummah: "Otec ummy" # todo: NEW TRANSLATION
 ALG_father_of_the_ummah_desc: "Vůdce Fronty islámské spásy se představí jako duchovní otec celé muslimské obce a bude budovat kult osobnosti založený na zbožnosti a božském mandátu." # todo: NEW TRANSLATION
 ALG_followers_of_the_prophet: "Prorokovi následovníci" # todo: NEW TRANSLATION
 ALG_followers_of_the_prophet_desc: "Stát bude přetvořen kolem přísného dodržování sunny. Od občanů se očekává, že budou žít jako Prorok, a vládní instituce budou přestavěny tak, aby tento pohled odrážely." # todo: NEW TRANSLATION
 ALG_governmental_cleansing: "Očista vlády" # todo: NEW TRANSLATION
 ALG_governmental_cleansing_desc: "Ti ve státním aparátu, kteří budou považováni za nedostatečně zbožné nebo ideologicky nečisté, budou systematicky odstraněni a nahrazeni loajálními stoupenci hnutí." # todo: NEW TRANSLATION
 ALG_make_our_nation_pure: "Učinit náš národ čistým" # todo: NEW TRANSLATION
 ALG_make_our_nation_pure_desc: "FIS zahájí rozsáhlou společenskou kampaň s cílem očistit alžírskou společnost od západního vlivu a prosadit islámské hodnoty ve vzdělávání, odívání i veřejném chování." # todo: NEW TRANSLATION
 ALG_new_patriotism: "Nové vlastenectví" # todo: NEW TRANSLATION
 ALG_new_patriotism_desc: "Láska k Alžírsku a láska k islámu jsou jedno a totéž. FIS vytvoří novou národní identitu, v níž bude víra základem občanské hrdosti a společného cíle." # todo: NEW TRANSLATION
 ALG_restore_the_soul_of_the_ummah: "Obnovit duši ummy" # todo: NEW TRANSLATION
 ALG_restore_the_soul_of_the_ummah_desc: "Alžírsko na sebe vezme posvátnou povinnost znovu zažehnout duchovní plamen muslimského světa a postaví stát do role morálního kompasu všech islámských národů." # todo: NEW TRANSLATION
 ALG_sharia_through_discipline: "Šaría prostřednictvím disciplíny" # todo: NEW TRANSLATION
 ALG_sharia_through_discipline_desc: "Právo šaría nebude prosazováno přesvědčováním, ale pevnou disciplínou. Stát rozšíří své pravomoci v oblasti dohledu a trestání, aby zajistil plné dodržování islámského práva." # todo: NEW TRANSLATION
 ALG_strength_and_virtue: "Síla a ctnost" # todo: NEW TRANSLATION
 ALG_strength_and_virtue_desc: "Silný stát a ctnostný lid jsou neoddělitelné. FIS bude investovat do morálního vzdělávání i institucionální disciplíny, aby vybudovala společnost spravedlivou ve svém charakteru a pevnou ve svém odhodlání." # todo: NEW TRANSLATION
 ALG_strict_authority: "Přísná autorita" # todo: NEW TRANSLATION
 ALG_strict_authority_desc: "Nové Alžírsko vyžaduje pevnou ruku. FIS centralizuje moc a zvýší rozpočet policie, aby zajistila, že obyvatelstvo bude dodržovat standardy chování hnutí." # todo: NEW TRANSLATION
 ALG_the_people_are_not_to_be_trusted: "Lidu nelze důvěřovat" # todo: NEW TRANSLATION
 ALG_the_people_are_not_to_be_trusted_desc: "Demokracie se ukázala být branou ke korupci a bezbožnosti. FIS demontuje demokratický proces a svěří správu pevně do rukou těch, kteří vědí, co Alláh požaduje." # todo: NEW TRANSLATION
 ALG_urban_preachers: "Městští kazatelé" # todo: NEW TRANSLATION
 ALG_urban_preachers_desc: "FIS vyšle do alžírských měst síť kazatelů, kteří budou šířit ideologii hnutí a upevňovat státní islám jako dominantní sílu veřejného života." # todo: NEW TRANSLATION
 ALG_hassi_massoud_exploitation_desc: "Ropné pole Hassi Messaoud je jedním z největších v Africe. Investicemi do jeho plného využití může Alžírsko dramaticky zvýšit těžbu ropy a zajistit si dlouhodobé příjmy z energetiky." # todo: NEW TRANSLATION
 ALG_north_south_highway_desc: "Transsaharská dálnice spojující severní pobřeží s hlubokým jihem otevře rozsáhlé alžírské vnitrozemí, umožní těžbu zdrojů a sníží regionální nerovnost." # todo: NEW TRANSLATION
 ALG_black_decade_lesson2_idea: "Poučení z temného desetiletí II" # todo: NEW TRANSLATION
 ALG_black_decade_lesson2_idea_desc: "Reformy ozbrojených sil navázaly na bolestná poučení z občanské války. Alžírská armáda je lépe připravena čelit vnitřním hrozbám, aniž by se uchylovala k nerozlišujícímu násilí." # todo: NEW TRANSLATION
 ALG_black_decade_lesson3_idea: "Poučení z temného desetiletí III" # todo: NEW TRANSLATION
 ALG_black_decade_lesson3_idea_desc: "Desetiletí reforem proměnilo alžírskou bezpečnostní doktrínu. Boj proti extremismu je nyní zakotven ve vojenské kultuře, přičemž specializované jednotky a zpravodajské sítě jsou navrženy tak, aby zabránily budoucím povstáním." # todo: NEW TRANSLATION
 ALG_decline_of_tourism1: "Obnova turistického sektoru" # todo: NEW TRANSLATION
 ALG_decline_of_tourism1_desc: "Nejhorší část úpadku pominula. Cílené investice a lepší bezpečnostní podmínky začínají lákat návštěvníky zpět k historickým památkám a středomořskému pobřeží Alžírska." # todo: NEW TRANSLATION
 ALG_destroyed_agriculture_two: "Poškozený zemědělský sektor" # todo: NEW TRANSLATION
 ALG_destroyed_agriculture_two_desc: "Pokračující nestabilita nadále brzdí obnovu zemědělství. Pole zůstávají neproduktivní a venkovské komunity se jen obtížně vracejí k běžnému hospodaření." # todo: NEW TRANSLATION
 ALG_destroyed_agriculture_three: "Obnova zemědělství" # todo: NEW TRANSLATION
 ALG_destroyed_agriculture_three_desc: "V zemědělském sektoru probíhá obnova. Nové oblasti se obdělávají a infrastruktura se pomalu obnovuje, aby byla navrácena kapacita produkce potravin." # todo: NEW TRANSLATION
 ALG_family_centric_2: "Rodina v srdci společnosti II" # todo: NEW TRANSLATION
 ALG_family_centric_2_desc: "Důraz na tradiční rodinné struktury se prohloubil a sociální politika se utváří kolem konzervativní představy domácnosti jako základu alžírské společnosti." # todo: NEW TRANSLATION
 ALG_hydroelectric_power_plants_upgraded2_idea: "Pokročilá hydroelektrická síť" # todo: NEW TRANSLATION
 ALG_hydroelectric_power_plants_upgraded2_idea_desc: "Druhá vlna modernizace alžírské hydroelektrické infrastruktury výrazně rozšířila kapacitu ukládání energie a spolehlivost sítě po celé zemi." # todo: NEW TRANSLATION
 ALG_mastering_atom_2: "Zvládnutí atomu II" # todo: NEW TRANSLATION
 ALG_mastering_atom_2_desc: "Alžírský jaderný program pokročil do fáze obohacování, což vyvolává mezinárodní obavy. Země je nyní schopna vyrábět materiál zbraňové kvality, ačkoli poslední krok zatím neučinila." # todo: NEW TRANSLATION
 ALG_mastering_atom_3: "Zvládnutí atomu III" # todo: NEW TRANSLATION
 ALG_mastering_atom_3_desc: "Alžírsko úspěšně vyvinulo schopnost vyrábět jaderné zbraně. Národ nyní patří mezi světové jaderné mocnosti, což dramaticky mění regionální rovnováhu sil." # todo: NEW TRANSLATION
 ALG_riot_police_1: "Jednotka rychlé reakce Al-Saiqa" # todo: NEW TRANSLATION
 ALG_riot_police_1_desc: "Byla vytvořena specializovaná jednotka pořádkové policie, vycvičená k rozhánění protestů a udržování pořádku v městských centrech. Její přítomnost odrazuje občanské nepokoje." # todo: NEW TRANSLATION
 ALG_riot_police_2: "Rozšířené nasazení Al-Saiqa" # todo: NEW TRANSLATION
 ALG_riot_police_2_desc: "Jednotka pořádkové policie byla po veřejné kritice nadměrného použití síly zmenšena a reformována. Její pravomoci byly zúženy a dohled posílen." # todo: NEW TRANSLATION
 ALG_riot_police_3: "Elitní síly Al-Saiqa" # todo: NEW TRANSLATION
 ALG_riot_police_3_desc: "Jednotka Al-Saiqa byla rozšířena a profesionalizována v elitní sílu vnitřní bezpečnosti schopnou rychlého nasazení kdekoli v zemi." # todo: NEW TRANSLATION
 ALG_science_idea_two: "Druhá alžírská vědecká renesance" # todo: NEW TRANSLATION
 ALG_science_idea_two_desc: "Na základě první vlny vědeckých investic Alžírsko vytvořilo síť výzkumných institucí a mezinárodních partnerství, která urychlují technologický rozvoj." # todo: NEW TRANSLATION
 ALG_air_reform_desc: "První kolo reforem alžírského letectva zahájilo modernizaci jeho velitelské struktury a obnovu zastarávajících letounů." # todo: NEW TRANSLATION
 ALG_air_reform2_desc: "Druhá fáze reformy letectva zavedla pokročilé výcvikové programy a zlepšila postupy údržby, čímž zvýšila operační připravenost." # todo: NEW TRANSLATION
 ALG_air_reform3_desc: "Alžírské letectvo prošlo zásadní přestavbou. Byly zřízeny nové letky vybavené moderními letouny, což výrazně zlepšilo protivzdušnou obranu a projekci síly." # todo: NEW TRANSLATION
 ALG_air_reform4_desc: "Program reformy letectva je dokončen. Alžírsko nyní disponuje jedním z nejschopnějších letectev na africkém kontinentu." # todo: NEW TRANSLATION
 ALG_algerian_tourism_desc: "Alžírský turistický sektor je aktivně propagován. Investice do pohostinské infrastruktury a mezinárodní marketingové kampaně lákají návštěvníky k bohatému kulturnímu a přírodnímu dědictví země." # todo: NEW TRANSLATION
 ALG_army_reform_desc: "Byl zahájen komplexní reformní program modernizace alžírské armády, který zlepšuje standardy výcviku, logistiku a velitelské struktury." # todo: NEW TRANSLATION
 ALG_army_reform_mass_army_desc: "Alžírsko buduje velkou konvenční armádu schopnou dlouhodobých operací a upřednostňuje počet mužstva a mechanizovanou pěchotu před specializovanými silami." # todo: NEW TRANSLATION
 ALG_army_reform_mass_army2_desc: "Reforma masové armády vstoupila do druhé fáze. Zlepšená logistika a obrněná podpora zvyšují konvenční bojovou sílu alžírských pozemních vojsk." # todo: NEW TRANSLATION
 ALG_army_reform_mass_army3_desc: "Alžírská doktrína masové armády je plně zavedena. Velké kombinované útvary jsou nyní páteří strategie pozemní obrany země." # todo: NEW TRANSLATION
 ALG_army_reform_mass_army4_desc: "Program masové armády je dokončen. Alžírsko může nasadit početně silnější pozemní síly podporované robustní logistickou infrastrukturou." # todo: NEW TRANSLATION
 ALG_army_reform_specops_desc: "Alžírsko investuje do speciálních jednotek a vytváří elitní útvary vycvičené pro boj proti terorismu, rychlé zásahy a nekonvenční válku." # todo: NEW TRANSLATION
 ALG_army_reform_specops2_desc: "Program speciálních sil se rozšířil a nové jednotky jsou cvičeny k osvobozování rukojmích, hlubokému průniku a přímým úderným operacím." # todo: NEW TRANSLATION
 ALG_army_reform_specops3_desc: "Alžírské speciální síly dosáhly vysoké úrovně schopností a čerpají ze zkušeností získaných během desetiletí protipovstaleckých operací v Sahelu i doma." # todo: NEW TRANSLATION
 ALG_army_reform_specops4_desc: "Program reformy speciálních sil je dokončen. Alžírské elitní jednotky patří mezi nejschopnější v Africe a respekt si získaly svými zkušenostmi a operační vyspělostí." # todo: NEW TRANSLATION
 ALG_basic_income_support_desc: "Program základní příjmové podpory poskytuje nejchudším občanům Alžírska finanční záchrannou síť, snižuje chudobu a zmírňuje dopady ekonomické volatility." # todo: NEW TRANSLATION
 ALG_black_decade_methods_desc: "Bezpečnostní síly se nadále spoléhají na brutální metody vyvinuté během občanské války. Přestože jsou krátkodobě účinné, tento přístup podporuje odpor a hrozí znovu zažehnout právě ten extremismus, který se snaží potlačit." # todo: NEW TRANSLATION
 ALG_border_security_idea_desc: "Posílené hraniční kontroly a rozšířené hlídkové trasy zlepšily schopnost Alžírska zachytávat pašeráky, obchodníky se zbraněmi a extremistické infiltrátory překračující jeho rozsáhlé pouštní hranice." # todo: NEW TRANSLATION
 ALG_childcare_reform_desc: "Po celé zemi se zavádějí nová zařízení péče o děti a dotované školky, což rodinám usnadňuje sladit práci s výchovou dětí." # todo: NEW TRANSLATION
 ALG_closed_moroccan_border_desc: "Hranice s Marokem zůstává pevně uzavřena. Přestože to omezuje přeshraniční pašování, zároveň to dusí legitimní obchod a prohlubuje diplomatické zmrazení vztahů mezi oběma národy." # todo: NEW TRANSLATION
 ALG_confidence_measures_idea_desc: "Soubor opatření k budování důvěry mezi Alžírskem a jeho sousedy pomáhá snižovat napětí a otevírat kanály pro diplomatický dialog." # todo: NEW TRANSLATION
 ALG_counter_morocco_idea_desc: "Alžírsko aktivně čelí marockému vlivu v regionu prostřednictvím diplomatického tlaku, podpory Polisaria a strategického soupeření o africké spojence." # todo: NEW TRANSLATION
 ALG_dialogue_with_morocco_desc: "S Marokem byl zahájen opatrný dialog, který zkoumá možnost normalizace vztahů a znovuotevření hranice po letech nepřátelství." # todo: NEW TRANSLATION
 ALG_education_arabization_desc: "Arabizace vzdělávacího systému byla prohloubena. Výuka ve francouzštině je na všech úrovních nahrazována arabštinou a do národních osnov jsou začleňovány islámské hodnoty." # todo: NEW TRANSLATION
 ALG_food_subsidy_idea_desc: "Vládní dotace udržují ceny základních potravin nízké a zajišťují, aby si i nejchudší Alžířané mohli dovolit základní výživu. To však představuje značnou zátěž pro státní rozpočet." # todo: NEW TRANSLATION
 ALG_foreign_arms_companies_desc: "Alžírsko otevřelo svůj zbrojní akviziční proces zahraničním výrobcům, čímž získalo přístup k širší škále vojenského vybavení, ale zároveň zvýšilo závislost na vnějších dodavatelích." # todo: NEW TRANSLATION
 ALG_fuel_subsidy_idea_desc: "Dotované ceny pohonných hmot udržují nízké dopravní a energetické náklady alžírských domácností a podniků, představují však značnou fiskální zátěž, která omezuje rozpočtovou flexibilitu vlády." # todo: NEW TRANSLATION
 ALG_future_army_desc: "Alžírsko investuje do vojenských technologií a doktrín nové generace a staví své ozbrojené síly do čela schopností moderního válčení." # todo: NEW TRANSLATION
 ALG_global_power_desc: "Alžírsko se etablovalo jako skutečná globální mocnost s místem u mezinárodního stolu a ekonomickou i vojenskou vahou, která jeho postavení podporuje." # todo: NEW TRANSLATION
 ALG_health_insurance_system_desc: "Je budován národní systém zdravotního pojištění, který Alžířanům poskytne přístup k lékařské péči bez ohledu na jejich příjmovou úroveň." # todo: NEW TRANSLATION
 ALG_housing_support_idea_desc: "Vládní programy podpory bydlení pomáhají nízkopříjmovým rodinám získat dostupné ubytování a zmírňují tlak způsobený nedostatkem městského bydlení v Alžírsku." # todo: NEW TRANSLATION
 ALG_hydroelectric_power_plants_upgraded_idea_desc: "Alžírská vodní energetická infrastruktura byla modernizována, což zvýšilo kapacitu a spolehlivost výroby elektřiny z vodních zdrojů a snížilo závislost na fosilních palivech." # todo: NEW TRANSLATION
 ALG_idea_arab_diplomacy_desc: "Alžírsko prosazuje aktivní arabskou diplomatickou agendu a staví se do role klíčového prostředníka a hlasu v rámci Arabské ligy i širšího arabského světa." # todo: NEW TRANSLATION
 ALG_idea_parliamentary_republic_desc: "Alžírsko přijalo systém parlamentní republiky, přesunulo výkonnou moc směrem k zákonodárnému sboru a zavedlo odpovědnější formu vlády." # todo: NEW TRANSLATION
 ALG_idea_presidential_republic_desc: "Alžírsko funguje jako prezidentská republika, v níž je výkonná pravomoc soustředěna v úřadu prezidenta, který je přímo volen lidem." # todo: NEW TRANSLATION
 ALG_idea_refoming_education_desc: "Bylo zahájeno první kolo vzdělávacích reforem, které zlepšuje standardy osnov, přípravu učitelů a přístup ke vzdělání v celé zemi." # todo: NEW TRANSLATION
 ALG_idea_refoming_education1_desc: "Druhá fáze vzdělávací reformy rozšířila střední školství, zlepšila odbornou přípravu a zavedla do alžírských škol modernizované pedagogické metody." # todo: NEW TRANSLATION
 ALG_idea_semi_presidential_republic_desc: "Alžírský poloprezidentský systém vyvažuje moc mezi přímo voleným prezidentem a premiérem odpovědným parlamentu." # todo: NEW TRANSLATION
 ALG_maghreb_cooperation_idea_desc: "Alžírsko pracuje na prohloubení hospodářské a politické spolupráce se svými maghrebskými sousedy a pokládá základy integrovanějšího severoafrického regionálního bloku." # todo: NEW TRANSLATION
 ALG_maghreb_security_idea_desc: "Společný bezpečnostní rámec s maghrebskými partnery umožňuje koordinované reakce na terorismus, pašování a přeshraniční nestabilitu v Sahelu." # todo: NEW TRANSLATION
 ALG_maghreb_trade_idea_desc: "Preferenční obchodní dohody s maghrebskými státy podporují vnitroregionální obchod a snižují závislost Alžírska na evropských trzích." # todo: NEW TRANSLATION
 ALG_mastering_atom_desc: "Alžírsko zahájilo tajný jaderný program a vybudovalo výzkumnou infrastrukturu potřebnou k budoucímu vývoji materiálu zbraňové kvality." # todo: NEW TRANSLATION
 ALG_military_expansion_desc: "Alžírsko rozšiřuje velikost svých ozbrojených sil, investuje do nového vybavení a nabírá další personál, aby mohlo promítat větší vojenskou sílu." # todo: NEW TRANSLATION
 ALG_military_expansion2_desc: "Program rozšiřování armády vstoupil do druhé fáze. Do služby jsou uváděny nové obrněné jednotky, dělostřelecké brigády a systémy protivzdušné obrany." # todo: NEW TRANSLATION
 ALG_military_junta_desc: "Armáda převzala přímou kontrolu nad státem. Alžírsku vládne junta generálů, jejíž legitimita spočívá v síle, nikoli v mandátu lidu." # todo: NEW TRANSLATION
 ALG_military_quality_initiative_desc: "Přístup upřednostňující kvalitu před kvantitou zlepšuje profesionalitu, výcvikové standardy a vybavení alžírských ozbrojených sil." # todo: NEW TRANSLATION
 ALG_military_quality_initiative2_desc: "Druhá fáze iniciativy vojenské kvality zavedla pokročilý simulační výcvik, zlepšila vzdělávání důstojníků a rozšířila společná cvičení jednotlivých složek." # todo: NEW TRANSLATION
 ALG_modern_hospitals_desc: "Alžírsko buduje síť moderních nemocnic vybavených současnou zdravotnickou technikou, což výrazně zlepšuje výsledky zdravotní péče pro obyvatelstvo." # todo: NEW TRANSLATION
 ALG_natural_products_idea_desc: "Alžírsko propaguje na mezinárodních trzích své přírodní produkty včetně datlí, olivového oleje a řemeslného zboží, diverzifikuje příjmy z vývozu a podporuje venkovské komunity." # todo: NEW TRANSLATION
 ALG_naval_reform_desc: "Alžírské námořnictvo prochází první velkou reformou za několik desetiletí, která zlepšuje údržbu, výcvik a schopnosti jeho hladinového loďstva." # todo: NEW TRANSLATION
 ALG_naval_reform2_desc: "V rámci druhé fáze námořní reformy byly uvedeny do služby nové fregaty a hlídková plavidla, čímž se rozšířil dosah Alžírska v západním Středomoří." # todo: NEW TRANSLATION
 ALG_naval_reform3_desc: "Schopnosti alžírského námořnictva byly výrazně posíleny zlepšením protiponorkového boje a pobřežní obrany." # todo: NEW TRANSLATION
 ALG_naval_reform4_desc: "Program námořní reformy je dokončen. Alžírsko nyní disponuje moderními a vyváženými námořními silami schopnými promítat moc napříč Středomořím až do Atlantiku." # todo: NEW TRANSLATION
 ALG_open_border_coop_desc: "Alžírsko otevřelo své hranice širší přeshraniční spolupráci se sousedy, čímž usnadnilo obchod, pohyb osob a společné infrastrukturní projekty." # todo: NEW TRANSLATION
 ALG_pna_expansion_desc: "Národní lidová armáda rozšířila své logistické a správní kapacity a zlepšila schopnost udržovat rozsáhlé operace na obrovském území Alžírska." # todo: NEW TRANSLATION
 ALG_polisario_support_idea_desc: "Alžírsko nadále poskytuje Polisariu politickou, logistickou a materiální podporu a udržuje tlak na Maroko ve sporu o Západní Saharu." # todo: NEW TRANSLATION
 ALG_private_clinics_expansion_desc: "Soukromému zdravotnictví je umožněno expandovat. Nabízí kvalitnější péči těm, kteří si ji mohou dovolit, a zároveň zmírňuje tlak na veřejný zdravotní systém." # todo: NEW TRANSLATION
 ALG_private_healthcare_idea_desc: "Alžírsko podporuje soukromé investice do zdravotnictví a vytváří paralelní soukromý sektor nabízející prémiové služby vedle veřejného systému." # todo: NEW TRANSLATION
 ALG_reactioners_desc: "Konzervativní složky státní byrokracie a armády odmítají smysluplné reformy a chrání zájmy zavedeného řádu na úkor modernizace." # todo: NEW TRANSLATION
 ALG_reactioners1_desc: "Reakční síly byly poněkud oslabeny, stále si však udržují značný vliv v klíčových institucích a nadále zpomalují tempo změn." # todo: NEW TRANSLATION
 ALG_reactioners2_desc: "Vliv staré gardy slábne. Reformní úsilí získalo dostatečnou dynamiku, aby překonalo mnohé institucionální překážky, které dříve bránily pokroku." # todo: NEW TRANSLATION
 ALG_reactioners3_desc: "Reakční frakce byla výrazně marginalizována. Nové politické uspořádání odstranilo mnoho jejích spojenců z mocenských pozic." # todo: NEW TRANSLATION
 ALG_reactioners4_desc: "Systémová reforma zlomila moc reakčního bloku. Alžírské instituce stále více reagují na požadavky obyvatelstva namísto zájmů zakořeněných elit." # todo: NEW TRANSLATION
 ALG_reactioners5_desc: "Mezi starou gardou zůstávají jen izolovaná ohniska odporu. Proměna alžírské politické kultury se blíží dokončení." # todo: NEW TRANSLATION
 ALG_reactioners6_desc: "Poslední zbytky reakčního systému byly smeteny. Alžírsko vstoupilo do nové éry definované odpovědností a skutečnou politickou soutěží." # todo: NEW TRANSLATION
 ALG_reactioners7_desc: "Alžírsko se definitivně rozešlo se svou autoritářskou minulostí. Stát je nyní vystavěn na demokratických normách a právním státě, přičemž staré klientelistické sítě byly rozpuštěny." # todo: NEW TRANSLATION
 ALG_sand_war_memory_idea_desc: "Vzpomínka na válku o písek s Marokem z roku 1963 stále formuje alžírské vojenské plánování a zahraniční politiku a podporuje hlubokou institucionální nedůvěru k marockým záměrům." # todo: NEW TRANSLATION
 ALG_science_idea_desc: "Alžírsko investuje do vědeckého výzkumu a vývoje, buduje nové laboratoře a financuje univerzitní výzkumné programy s cílem vytvořit domácí znalostní ekonomiku." # todo: NEW TRANSLATION
 ALG_shipbuilding_desc: "Alžírsko rozvíjí domácí loďařský průmysl a buduje zařízení schopná vyrábět vojenská i obchodní plavidla, čímž snižuje závislost na zahraničních dodavatelích." # todo: NEW TRANSLATION
 ALG_shipbuilding2_desc: "Loďařský průmysl dospěl a doma se nyní vyrábějí větší a složitější plavidla. Alžírsko se stává důvěryhodnou námořní průmyslovou velmocí." # todo: NEW TRANSLATION
 ALG_social_contract_idea_desc: "Vláda obnovila svou společenskou smlouvu s obyvatelstvem a vyměnila politickou poslušnost za zaručené dotace, veřejná pracovní místa a sociální služby." # todo: NEW TRANSLATION
 ALG_sonatrach_desc: "Sonatrach, alžírská národní ropná a plynárenská společnost, zůstává páteří národního hospodářství a vytváří naprostou většinu příjmů státu z vývozu." # todo: NEW TRANSLATION
 ALG_state_hospitals_idea_desc: "Síť státních nemocnic poskytuje základní zdravotní péči všem Alžířanům, chronické podfinancování však znamená, že se kvalita mezi regiony výrazně liší." # todo: NEW TRANSLATION
 ALG_suppressed_opposition_desc: "Politická opozice byla umlčena kombinací právních omezení, kontroly médií a přímého zastrašování. Nesouhlas je zatlačován do podzemí, nikoli odstraněn." # todo: NEW TRANSLATION
 ALG_technological_ties_desc: "Alžírsko uzavřelo se zahraničními partnery dohody o transferu technologií a získalo přístup k pokročilým systémům a odborným znalostem výměnou za ekonomické a diplomatické ústupky." # todo: NEW TRANSLATION
 ALG_tikjda_resort_desc: "Horské středisko Tikjda v oblasti Kabylie se rozvíjí jako vlajková turistická destinace, která podporuje ekoturistiku a láká návštěvníky do alžírských Atlasových hor." # todo: NEW TRANSLATION
 ALG_universal_healthcare_idea_desc: "Alžírsko zavedlo univerzální zdravotní systém poskytující všem občanům bezplatnou nebo výrazně dotovanou lékařskou péči, financovanou z obecných daní a příjmů z uhlovodíků." # todo: NEW TRANSLATION
 ALG_university_expansion_desc: "Po celém Alžírsku vznikají nové univerzitní kampusy, které rozšiřují přístup k vysokoškolskému vzdělání a produkují absolventy připravené na požadavky moderní ekonomiky." # todo: NEW TRANSLATION
 ALG_welfare_state_idea_desc: "Alžírsko vybudovalo rozsáhlý sociální stát poskytující podporu bydlení, zdravotnictví, vzdělávání a příjmovou pomoc, financovaný převážně z příjmů z ropy a plynu." # todo: NEW TRANSLATION
 ALG_jamiat_al_karaouin_desc: "Vazby na starobylou instituci Al-Karawiyyin vedly ke vzniku nové třídy islámských učenců loajálních státu FIS a nepřátelských vůči vojenským zásahům do náboženských záležitostí." # todo: NEW TRANSLATION
 FIS_al_aqsa_faction: "Koalice Al-Aksá" # todo: NEW TRANSLATION
 Algeria_desc: "Alžírsko" # todo: NEW TRANSLATION
 AlgeriaFocusEvents_desc: "Události spuštěné národními fokusy Alžírska." # todo: NEW TRANSLATION
 algeria_focus_desc: "Národní strom fokusů Alžírska pokrývající politické, ekonomické, vojenské a zahraničněpolitické směry." # todo: NEW TRANSLATION
 algerian_focus_desc: "Národní strom fokusů Alžírska pokrývající politické, ekonomické, vojenské a zahraničněpolitické směry." # todo: NEW TRANSLATION
 algeria_power_balance_desc: "Rovnováha moci mezi civilní vládou a vojenským establishmentem, který v Alžírsku dlouhodobě funguje jako stát ve státě." # todo: NEW TRANSLATION
 nuclear_algeria_desc: "Alžírsko překročilo jaderný práh a disponuje operačními jadernými zbraněmi, které zásadně mění jeho strategické postavení v severní Africe i širším Středomoří." # todo: NEW TRANSLATION
 ALG_civilian_government: "Civilní vláda" # todo: NEW TRANSLATION
 ALG_civilian_government_desc: "Poprvé po desetiletích vládne Alžírsku skutečně civilní administrativa. Armáda ustoupila od přímých politických zásahů a umožnila voleným představitelům vést zemi." # todo: NEW TRANSLATION
 ALG_corrupt_generals: "Zkorumpovaní generálové" # todo: NEW TRANSLATION
 ALG_corrupt_generals_desc: "Nejvyšší vojenské vedení je prolezlé korupcí. Generálové, kteří zbohatli během desetiletí klientelismu, odmítají jakékoli reformy ohrožující jejich ekonomické zájmy." # todo: NEW TRANSLATION
 ALG_government_led_disaster: "Vládní reakce na katastrofy" # todo: NEW TRANSLATION
 ALG_government_led_disaster_desc: "Stát převzal přímou kontrolu nad reakcí na katastrofy a ve velkém nasadil veřejné zdroje. Zásah je sice nákladný a byrokratický, přináší však skutečné výsledky v terénu." # todo: NEW TRANSLATION
 ALG_no_disasters_plan: "Žádný krizový plán pro katastrofy" # todo: NEW TRANSLATION
 ALG_no_disasters_plan_desc: "Alžírsko v současnosti nemá specializovaný rámec pro reakci na katastrofy. Když udeří krize, absence koordinovaného plánování vede ke zpožděným a neúčinným reakcím státu, které zhoršují následky." # todo: NEW TRANSLATION
 ALG_olympic_preparation: "Program přípravy na olympijské hry" # todo: NEW TRANSLATION
 ALG_olympic_preparation_desc: "Alžírsko výrazně investuje do příprav na pořádání olympijských her, buduje sportovní infrastrukturu světové úrovně a spouští národní programy rozvoje atletiky." # todo: NEW TRANSLATION
 algerian_empowered_sharia_courts: "Posílené šaríatské soudy" # todo: NEW TRANSLATION
 algerian_empowered_sharia_courts_desc: "Pravomoc islámských soudů byla rozšířena, což náboženským autoritám dává větší vliv nad občanskými a rodinnými záležitostmi a posouvá alžírský právní rámec směrem k šaríe." # todo: NEW TRANSLATION
 algerian_gulen_movement: "Hnutím Gülen inspirované uskupení" # todo: NEW TRANSLATION
 algerian_gulen_movement_desc: "Síť inspirovaná Gülenovým hnutím se zakořenila v alžírském školství a občanské společnosti, prosazuje modernistický přístup k islámu a získává značný vliv ve státních institucích." # todo: NEW TRANSLATION
 algerian_scientific_ventures: "Alžírské vědecké projekty" # todo: NEW TRANSLATION
 algerian_scientific_ventures_desc: "Vlna společných vědeckých projektů se zahraničními partnery pohání obrodu alžírského výzkumu. Nové projekty v oblasti obnovitelné energie, výpočetní techniky a materiálových věd získávají mezinárodní uznání." # todo: NEW TRANSLATION
 hoggar_nuclear_facility_idea: "Hoggarské jaderné zařízení" # todo: NEW TRANSLATION
 ALG_2014_oil_crash_idea_desc: "Propad cen ropy v roce 2014 zdevastoval alžírské příjmy z uhlovodíků, odhalil křehkost ekonomického modelu závislého na surovinách a vynutil si bolestivé škrty ve veřejných výdajích." # todo: NEW TRANSLATION
 ALG_AU_pressure_idea_desc: "Africká unie vyvíjí na Alžírsko diplomatický tlak kvůli regionální otázce, omezuje jeho možnosti zahraniční politiky a komplikuje vztahy se sousedními státy." # todo: NEW TRANSLATION
 ALG_black_market_desc: "Ve stínu státu se rozvinul prosperující černý trh, který podrývá oficiální obchodní statistiky, připravuje vládu o daňové příjmy a podporuje sítě organizovaného zločinu." # todo: NEW TRANSLATION
 ALG_clean_government_desc: "Nová generace technokratických úředníků přinesla do vlády větší transparentnost a odpovědnost. Korupce klesá a důvěra veřejnosti ve státní instituce se pomalu obnovuje." # todo: NEW TRANSLATION
 ALG_decline_of_tourism_desc: "Alžírský turistický sektor je v hlubokém úpadku. Bezpečnostní obavy, špatná infrastruktura a obtížný vízový režim učinily zemi pro zahraniční návštěvníky neatraktivní, což ekonomiku těžce poškozuje." # todo: NEW TRANSLATION
 ALG_destroyed_agriculture_desc: "Alžírské zemědělství bylo zpustošeno konfliktem a zanedbáváním. Zemědělská půda leží ladem, venkovské komunity byly vysídleny a závislost na dovozu potravin prudce vzrostla." # todo: NEW TRANSLATION
 ALG_election_time_idea_desc: "Probíhá volební kampaň, která ovládá politickou agendu a vytváří příležitosti i nestabilitu, zatímco soupeřící frakce mobilizují své základny." # todo: NEW TRANSLATION
 ALG_emergency_budget_desc: "Vláda aktivovala ustanovení o nouzovém rozpočtu, omezila nezbytné výdaje a přesměrovala zdroje k řešení akutní hospodářské nebo bezpečnostní krize." # todo: NEW TRANSLATION
 ALG_idea_joint_military_arab_desc: "Alžírsko vstoupilo do společného vojenského rámce s arabskými partnery, který umožňuje koordinované obranné plánování, sdílení zpravodajských informací a společná cvičení v celém regionu." # todo: NEW TRANSLATION
 ALG_insurgency_unleashed_desc: "Alžírsko záměrně vypěstovalo povstalecké sítě v sousedním státě a využívá nepravidelné zástupné síly k promítání moci a destabilizaci rivalů bez přímého vojenského nasazení." # todo: NEW TRANSLATION
 ALG_national_dialogue_modifier_desc: "Proces národního dialogu svedl dohromady vládu a opozici, vytvořil vzácný prostor pro politické vyjednávání a snížil bezprostřední riziko střetu." # todo: NEW TRANSLATION
 ALG_political_repression_desc: "Stát provádí systematické politické represe, zatýká aktivisty, cenzuruje média a využívá bezpečnostní služby k umlčení nesouhlasu a udržení kontroly." # todo: NEW TRANSLATION
 ALG_repression_modifier_desc: "Alžírskem se přehnala vlna represí. Opoziční představitelé jsou zadržováni, média umlčována a veřejné demonstrace násilně rozháněny." # todo: NEW TRANSLATION
 ALG_sahara_expansion_1_desc: "Dezertifikace postupuje do jižních zemědělských oblastí Alžírska. Objevují se první známky rozpínání Sahary, které ohrožují zemědělské komunity a zmenšují obdělávatelnou půdu." # todo: NEW TRANSLATION
 ALG_sahara_expansion_2_desc: "Saharská dezertifikace zesílila, snížila zemědělskou produkci a vysídlila venkovské komunity v postižených jižních provinciích." # todo: NEW TRANSLATION
 ALG_sahara_expansion_3_desc: "Dezertifikace dál neomezeně postupuje. Významná část dříve úrodné zemědělské půdy padla za oběť rozpínající se poušti." # todo: NEW TRANSLATION
 ALG_sahara_expansion_4_desc: "Rozpínání Sahary se stává celostátní krizí. Zemědělské ztráty narůstají a vnitřní migrace z jihu vytváří tlak na severní města." # todo: NEW TRANSLATION
 ALG_sahara_expansion_5_desc: "Polovina alžírské jižní zemědělské půdy je nyní ohrožena. Krize dezertifikace vyžaduje naléhavý zásah vlády a mezinárodní ekologickou pomoc." # todo: NEW TRANSLATION
 ALG_sahara_expansion_6_desc: "Dezertifikace dosáhla kritického bodu. Celé zemědělské oblasti byly opuštěny a ekonomické náklady krize vážně zatěžují státní rozpočet." # todo: NEW TRANSLATION
 ALG_sahara_expansion_7_desc: "Ekologická krize mění geografii Alžírska. Masivní přesun dun zasahuje infrastrukturu a úbytek zemědělské půdy urychluje potravinovou nejistotu." # todo: NEW TRANSLATION
 ALG_sahara_expansion_8_desc: "Rozpínání Sahary zpustošilo alžírské jižní zemědělství. Rozsah úbytku půdy vyvolává humanitární krizi mezi vysídlenými zemědělskými komunitami." # todo: NEW TRANSLATION
 ALG_sahara_expansion_9_desc: "Dezertifikace pohltila většinu alžírské jižní zemědělské půdy. Nápravná opatření jen obtížně čelí rozsahu ekologického kolapsu." # todo: NEW TRANSLATION
 ALG_sahara_expansion_10_desc: "Alžírský zemědělský jih téměř celý pohltila Sahara. Ekologická katastrofa je v současném měřítku bez rozsáhlých zásahů v podobě zalesňování a hospodaření s vodou nevratná." # todo: NEW TRANSLATION
 ALG_surveillance_state_modifier_desc: "Alžírsko vybudovalo sofistikovanou domácí sledovací infrastrukturu, která monitoruje komunikaci a sleduje činnost politických odpůrců a aktérů občanské společnosti." # todo: NEW TRANSLATION
 ALG_transparent_budget_desc: "Alžírsko zavedlo transparentní vykazování rozpočtu, zveřejňuje podrobné rozpisy veřejných výdajů a poprvé zpřístupňuje státní účty nezávislé kontrole." # todo: NEW TRANSLATION
 algeria_cultural_rebirth_desc: "Alžírskem se šíří silná vlna nacionalistického kulturního obrození, která pozvedá domorodé dědictví a historii a zároveň vytlačuje cizí kulturní vlivy." # todo: NEW TRANSLATION
 algeria_emerging_youth_desc: "Vynořuje se generace politicky angažovaných mladých Alžířanů, kteří stále důrazněji požadují demokratickou reformu a ekonomické příležitosti." # todo: NEW TRANSLATION
 algeria_nationalist_youth_desc: "Alžírské mládežnické hnutí se vydalo ostře nacionalistickým směrem a požaduje asertivnější zahraniční politiku a konec toho, co považuje za kompromisy staré gardy se zahraničními zájmy." # todo: NEW TRANSLATION
 hoggar_nuclear_facility_idea_desc: "Hluboko v horách Ahaggar bylo na odlehlém místě vybudováno jaderné výzkumné zařízení. Jeho existence slouží jako mocný prostředek odstrašení zahraničních dobrodruhů." # todo: NEW TRANSLATION
 idea_alg_empowered_parliament_desc: "Alžírskému parlamentu byla udělena skutečná zákonodárná pravomoc. Shromáždění nyní disponuje skutečnou mocí nad rozpočtem, zákony a odpovědností ministrů." # todo: NEW TRANSLATION
 idea_algerian_oligarchy_arrests_desc: "Zatčení klíčových oligarchů otřáslo alžírskou podnikatelskou elitou. Přestože je zásah u veřejnosti oblíbený, vytvořil nejistotu, která zmrazila soukromé investice." # todo: NEW TRANSLATION
 ALG_flavor_event.6.t: "Uprchlická krize" # todo: NEW TRANSLATION
 ALG_flavor_event.6.d: "Přes naše hranice proudí vlny uprchlíků prchajících před konflikty a nestabilitou v sousedních zemích. Naše infrastruktura je přetížená a naši lidé se neshodnou, jak reagovat." # todo: NEW TRANSLATION
 ALG_flavor_event.6.a: "Musíme je přijmout." # todo: NEW TRANSLATION
 ALG_flavor_event.7.t: "Krize obchodu s drogami" # todo: NEW TRANSLATION
 ALG_flavor_event.7.d: "Organizované zločinecké sítě proměnily Alžírsko v hlavní tranzitní koridor pro narkotika. Obchod s drogami korumpuje místní instituce a podporuje násilí v pohraničních oblastech." # todo: NEW TRANSLATION
 ALG_flavor_event.7.a: "Tvrdě zasáhnout proti pašerákům." # todo: NEW TRANSLATION
 fra_colonial.1.t: "Stín minulosti" # todo: NEW TRANSLATION
 fra_colonial.1.d: "Alžír formálně odsoudil francouzské koloniální dědictví v Alžírsku, znovu otevřel staré rány a rozjitřil veřejné mínění na obou stranách Středomoří. Náš parlament je rozdělený: někteří požadují, abychom trvali na našem historickém výkladu, zatímco jiní vidí příležitost ke smíření." # todo: NEW TRANSLATION
 fra_colonial.1.a: "Braňme náš historický výklad." # todo: NEW TRANSLATION
 fra_colonial.1.b: "Nabídněme gesto smíření." # todo: NEW TRANSLATION
 algerian_event.51.d: "Navzdory všem překážkám dosáhl alžírský kosmický program něčeho mimořádného: naše kosmická loď úspěšně přistála na Měsíci. Tento triumf techniky a národní vůle elektrizoval alžírský lid a umístil naši vlajku mezi hvězdy." # todo: NEW TRANSLATION
 ALG_aouchiche_desc: "Youcef Aouchiche je liberální reformista a vůdce Fronty socialistických sil. Jako hlasitý kritik vládnoucího establishmentu vedl kampaň za demokratické reformy, občanské svobody a ekonomickou modernizaci." # todo: NEW TRANSLATION
 ALG_hassani_desc: "Abdelali Hassani Cherif je vůdcem Hnutí za mírovou společnost, hlavní alžírské islamistické strany. Prosazuje umírněný politický islám v souladu s demokratickými normami a národním smířením." # todo: NEW TRANSLATION
 algeria_elections.a: "Tak je rozhodnuto." # todo: NEW TRANSLATION
 alg_military_rule_option: "Podpořit rozhodnutí armády." # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.1.t: "Politické přeskupení Alžírska" # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.1.d: "S blížícím se koncem Černého desetiletí stojí Alžírsko před zásadní volbou své budoucí politické orientace. Západní partnerství, nezúčastněnost nebo užší vazby na Východ — každá cesta má hluboké důsledky pro identitu a stabilitu země." # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.1.a: "Otevřít národní debatu." # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.20.t: "Ideologický rozkol ve vládě" # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.20.d: "S dozníváním konfliktu sílí uvnitř vlády tlak na vymezení budoucího politického systému Alžírska. Tvrdá linie požaduje dominanci armády, umírnění prosazují smíření a reformy, zatímco islamistické frakce volají po svobodných volbách." # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.20.a: "Posílit armádu." # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.20.b: "Prosazovat reformy a smíření." # todo: NEW TRANSLATION
 AlgeriaPoliticalEvents.20.c: "Vyjednávat s islamisty." # todo: NEW TRANSLATION
 Algeria.8.t: "Alžírsko žádá o ochranu" # todo: NEW TRANSLATION
 Algeria.8.d: "Alžírská vláda formálně požádala o americkou ochranu nebo bezpečnostní záruky s odvoláním na rostoucí regionální nestabilitu. Washington nyní musí rozhodnout, zda rozšíří svůj strategický deštník." # todo: NEW TRANSLATION
 Algeria.8.a: "Žádosti vyhovíme." # todo: NEW TRANSLATION
 Algeria.8.b: "K tomu se nemůžeme zavázat." # todo: NEW TRANSLATION
 ALG_alignments: "Orientace zahraniční politiky" # todo: NEW TRANSLATION
 KBY_alg_modifier: "Modifikátory Kabylského státu" # todo: NEW TRANSLATION
 ALG_algiers_metro: "Metropolitní koridor Alžíru" # todo: NEW TRANSLATION
 ALG_diplomatic_outreach_west: "Diplomatická iniciativa vůči Západu" # todo: NEW TRANSLATION
 ALG_diplomatic_outreach_west_desc: "Vztah Alžírska s Washingtonem a jeho evropskými spojenci je definován vzájemnou nedůvěrou. Trvalá diplomatická iniciativa by mohla položit základy užších hospodářských a bezpečnostních vazeb se západním světem." # todo: NEW TRANSLATION
 ALG_diplomatic_outreach_china: "Diplomatická iniciativa vůči Číně" # todo: NEW TRANSLATION
 ALG_diplomatic_outreach_china_desc: "Peking svou přítomnost na africkém kontinentu postupně rozšiřuje. Prohloubení vztahů s Čínou by mohlo odemknout významné investice do infrastruktury a otevřít nové trhy, může však zkomplikovat vztahy se západními partnery." # todo: NEW TRANSLATION
 monitor_kabyle_unrest_desc: "Hory Kabylie jsou trvalým ohniskem napětí. Bezpečnostní služby musí udržovat pečlivý dohled nad odbojovou činností v regionu, aby předešly eskalaci." # todo: NEW TRANSLATION
 kabyle_resistance_tooltip: "Odbojová činnost v Kabylie zůstává zvýšená." # todo: NEW TRANSLATION
 ALG_boost_reformists_desc: "V neprůhledné politické struktuře Alžírska prosazuje frakce technokratů a modernizátorů skutečné reformy. Poskytnutí politického krytí a zdrojů by mohlo posunout vnitřní rovnováhu moci směrem k otevřenosti." # todo: NEW TRANSLATION
 ALG_boost_old_guard_desc: "Zavedená síť vojenských důstojníků a veteránů FLN, kteří vybudovali stát po získání nezávislosti, je kvůli tempu změn stále nervóznější. Opětovné potvrzení jejich postavení a výsad posílí stabilitu, ale upevní status quo." # todo: NEW TRANSLATION
 ALG_rally_students_desc: "Univerzitní kampusy byly v minulosti motorem alžírských politických změn. Organizování studentských sdružení na podporu reformní agendy může vytvořit tlak zdola a změnit veřejný diskurz." # todo: NEW TRANSLATION
 ALG_mobilize_veterans_desc: "Veteráni války za nezávislost a Černého desetiletí mají v alžírské společnosti obrovskou morální autoritu. Jejich získání na stranu stávajícího řádu dodá postoji státu v současném politickém zápase legitimitu." # todo: NEW TRANSLATION
 ALG_bribe_elites_desc: "Velká část alžírské mocenské struktury funguje na neformálních sítích klientelismu a protekce. Rozdělování zakázek, funkcí a finančních výhod klíčovým osobám může upevnit loajalitu, zároveň však prohloubí korupci, která stát již nyní rozkládá." # todo: NEW TRANSLATION
 ALG_seek_compromise_desc: "Vzhledem k zakořenění obou stran vnitřní debaty může být neutrální mediační úsilí jediným způsobem, jak zabránit tomu, aby patová situace přerostla v otevřený střet. Kompromis nikoho plně neuspokojí, mohl by však odvrátit nejhorší." # todo: NEW TRANSLATION
 ALG_media_campaign_reform_desc: "Státní a spřízněná soukromá média lze nasměrovat k vytvoření příběhu o nutnosti politické obnovy. Formování veřejného mínění ve prospěch reforem posouvá půdu pod nohama staré gardě." # todo: NEW TRANSLATION
 ALG_security_crackdown_desc: "Bezpečnostní aparát lze pověřit potlačením protestů, nezávislých médií a skupin občanské společnosti, které podporují reformní hnutí. Získáme tím čas, ale zároveň si připravíme ještě větší problémy do budoucna." # todo: NEW TRANSLATION
 ALG_world_tension_security_desc: "Rostoucí nestabilita v celém regionu poskytuje vojenskému establishmentu nové argumenty pro pevné udržení politiky pod jeho kontrolou. Využití této atmosféry může upevnit pozici staré gardy." # todo: NEW TRANSLATION
 ALG_world_tension_high_security_desc: "S regionálními konflikty přelévajícími se k alžírským hranicím armáda prosazuje nouzové pravomoci, které by fakticky odsunuly civilní reformátory na vedlejší kolej. Krize poskytuje krytí, pozastavení politické soutěže však nese dlouhodobá rizika." # todo: NEW TRANSLATION
 ALG_path_crackdown_momentum_desc: "Zásah přináší výsledky. Udržení tempa prostřednictvím dalších bezpečnostních operací a politického tlaku prohloubí vliv staré gardy na stát, každý další krok však ztěžuje návrat zpět." # todo: NEW TRANSLATION
 ALG_path_reconciliation_momentum_desc: "Reformní proces nabírá na síle. Pokračování v dalších opatřeních k budování důvěry a politickém otevírání může agendu smíření posunout za bod, odkud není návratu." # todo: NEW TRANSLATION
 ALG_oil_patronage_desc: "Alžírské příjmy z uhlovodíků byly dlouho využívány k nákupu sociálního smíru. Přesměrování části ropných příjmů na cílený klientelismus může v současném politickém zápase zajistit loajalitu klíčových skupin." # todo: NEW TRANSLATION
 ALG_economic_reforms_desc: "Alžírská státem ovládaná ekonomika je hluboce neefektivní. Důvěryhodný balík hospodářských reforem, který otevře prostor soukromému podnikání a omezí byrokratické překážky, by mohl naklonit veřejné mínění reformnímu táboru." # todo: NEW TRANSLATION
 ALG_ter_oboronaup_start_desc: "V době války Národní garda požaduje vytvoření místně rekrutovaných jednotek územní obrany, které by držely týlové oblasti a uvolnily pravidelné armádní útvary pro operace na frontě." # todo: NEW TRANSLATION
 ALG_internalup_start_desc: "Situace vyžaduje nasazení specializovaných jednotek vnitřní bezpečnosti k udržení pořádku za frontovou linií, ochraně kritické infrastruktury a zabránění nepříteli ve využití nestability v týlu." # todo: NEW TRANSLATION
 ALG_casablanca_mission: "Usilovat o Casablanské urovnání" # todo: NEW TRANSLATION
 ALG_eliminate_GIA: "Zničit GIA" # todo: NEW TRANSLATION
 ALG_eliminate_GIA_desc: "Ozbrojená islámská skupina kdysi představovala nejbrutálnější tvář povstání. Nyní, když jsou její sítě rozbité a veřejná podpora se hroutí, stát přistupuje k likvidaci posledních zbytků organizace a obnovení pořádku v celé zemi." # todo: NEW TRANSLATION
 ALG_reintegration_programs: "Reintegrační programy" # todo: NEW TRANSLATION
 ALG_reintegration_programs_desc: "Roky násilí zanechaly v alžírské společnosti tisíce bývalých bojovníků a sympatizantů. Prostřednictvím pečlivě monitorovaných reintegračních programů vláda nabídne cestu zpět do civilního života těm, kteří jsou ochotni opustit povstání." # todo: NEW TRANSLATION
 ALG_strengthen_DRS: "Posílit DRS" # todo: NEW TRANSLATION
 ALG_strengthen_DRS_desc: "Département du Renseignement et de la Sécurité sehrál během Černého desetiletí rozhodující roli v boji proti extremistickým sítím. Posílení schopností našich zpravodajských služeb zajistí, že Alžírsko již nikdy neupadne do podobného chaosu." # todo: NEW TRANSLATION
 ALG_coalition_economic_program: "Hospodářský program koalice" # todo: NEW TRANSLATION
 ALG_coalition_economic_program_desc: "Prezidentská koalice musí předložit jednotnou hospodářskou vizi. Koordinací hospodářské politiky koaličních partnerů můžeme přilákat investice, podpořit malé podniky a položit základy udržitelného růstu. Silná ekonomika dodá koalici legitimitu a umlčí naše kritiky." # todo: NEW TRANSLATION
 ALG_governmental_transparency: "Transparentnost vlády" # todo: NEW TRANSLATION
 ALG_governmental_transparency_desc: "Má-li naše demokratická cesta něco znamenat, musíme se držet vyššího standardu než ti, kteří přišli před námi. Zavedením transparentních opatření a zpřístupněním vládních záznamů veřejné kontrole můžeme vymýtit korupci a obnovit víru lidí v jejich instituce, i kdybychom si tím znepřátelili starou gardu." # todo: NEW TRANSLATION
 ALG_coalition_economic_program_tt: "Prezidentská koalice zahajuje koordinovaný program hospodářského rozvoje." # todo: NEW TRANSLATION
 ALG_governmental_transparency_tt: "Vláda se zavazuje k reformám transparentnosti, které oslabí zakořeněnou korupci, ale rozhněvají vojenské zájmy." # todo: NEW TRANSLATION
 ALG_ethnic_satisfaction_critical: "§ROtevřené nepřátelství§!" # todo: NEW TRANSLATION
 ALG_ethnic_satisfaction_low: "§YHluboká zášť§!" # todo: NEW TRANSLATION
 ALG_ethnic_satisfaction_moderate: "§Y doutnající napětí§!" # todo: NEW TRANSLATION
 ALG_ethnic_satisfaction_high: "§GRelativní spokojenost§!" # todo: NEW TRANSLATION
 ALG_deep_state_map_name: "Alžír – centrum moci" # todo: NEW TRANSLATION
 ALG_hybrid_military_governance: "Hybridní vojenská správa" # todo: NEW TRANSLATION
 ALG_hybrid_military_governance_desc: "Alžírsko funguje v hybridním systému, v němž si armáda zachovává značný politický vliv, zatímco civilní struktury zůstávají zachovány." # todo: NEW TRANSLATION
