 ALG_maghreb_diplomacy_desc: "Alžírsko se prosazuje jako vůdce severní Afriky a podporuje jednotu prostřednictvím obchodu a společné bezpečnosti." # todo: NEW TRANSLATION
 ALG_maghreb_union_tt: "Vznikla Maghrebská unie\nAlžírsko, Tunisko a další severoafrické národy nyní pod naším vedením sdílejí hospodářské a vojenské vazby." # todo: NEW TRANSLATION
