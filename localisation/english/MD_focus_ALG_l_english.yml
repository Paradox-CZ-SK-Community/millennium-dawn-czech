 ALG_africa_and_arab_nations: "Afrika a arabské národy" # todo: NEW TRANSLATION
 ALG_africa_and_arab_nations_desc: "Zaměříme se na vedení diplomacie a rozvoje v Africe i arabském světě." # todo: NEW TRANSLATION
 ALG_western_sahara_position: "Podpořit Západní Saharu" # todo: NEW TRANSLATION
