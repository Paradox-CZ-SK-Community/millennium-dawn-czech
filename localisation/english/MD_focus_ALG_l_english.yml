 ALG_national_strength: "Národní síla" # todo: NEW TRANSLATION
 ALG_national_strength_desc: "" # todo: NEW TRANSLATION
 ALG_terror_2003_hostage_title: "Saharská rukojmí krize" # todo: NEW TRANSLATION
 ALG_terror_2003_hostage_desc: "Skupina evropských turistů byla v alžírské poušti unesena islamistickými militanty. Ačkoli nebyly hlášeny žádné oběti, jde o začátek znepokojivého nárůstu organizované džihádistické činnosti." # todo: NEW TRANSLATION
 ALG_terror_2003_hostage_option: "Znepokojivé znamení budoucnosti" # todo: NEW TRANSLATION
 ALG_terror_monitor: "Sledovat teroristickou hrozbu" # todo: NEW TRANSLATION
 ALG_conduct_security_raids: "Provádět bezpečnostní razie" # todo: NEW TRANSLATION
 ALG_terror_threat_category: "Monitor teroristické hrozby" # todo: NEW TRANSLATION
 ALG_terror_2007_algiers_title: "Bombové útoky v Alžíru" # todo: NEW TRANSLATION
 ALG_terror_2007_algiers_desc: "Vládní palác v Alžíru zasáhl mohutný sebevražedný atentát. Při jednom z nejsmrtelnějších útoků posledních let zahynulo více než 30 civilistů a vládních zaměstnanců." # todo: NEW TRANSLATION
 ALG_terror_2007_batna_title: "Bombový útok v Batně" # todo: NEW TRANSLATION
 ALG_terror_2007_batna_desc: "Sebevražedný atentátník odpálil zařízení poblíž davu čekajícího v Batně na prezidenta. Útok si vyžádal více než 20 mrtvých." # todo: NEW TRANSLATION
 ALG_terror_2008_issers_title: "Bombový útok na policejní akademii v Issersu" # todo: NEW TRANSLATION
 ALG_terror_2008_issers_desc: "Sebevražedný útok automobilem zamířil na policejní rekruty na akademii v Issersu, zabil 43 lidí a desítky dalších zranil." # todo: NEW TRANSLATION
 ALG_terror_generic_option: "Tragické zprávy." # todo: NEW TRANSLATION
 ALG_terror_2000_bus_ambush_title: "Přepadení autobusu poblíž Médéy" # todo: NEW TRANSLATION
 ALG_terror_2000_bus_ambush_desc: "Ozbrojení militanti připravili smrtící přepadení autobusu poblíž Médéy. Devatenáct civilistů přišlo o život. Tento útok signalizuje pokračující nestabilitu v období po občanské válce." # todo: NEW TRANSLATION
 ALG_terror_2002_tazmalt_title: "Bombový útok v Tazmaltu" # todo: NEW TRANSLATION
 ALG_terror_2002_tazmalt_desc: "V Tazmaltu vybuchla bomba a zabila či zranila několik civilistů. Bezpečnostní síly podezírají pozůstatky GSPC." # todo: NEW TRANSLATION
 ALG_terror_2002_miliana_title: "Bombový útok v Milianě" # todo: NEW TRANSLATION
 ALG_terror_2002_miliana_desc: "U silnice poblíž Miliany vybuchlo improvizované výbušné zařízení a zranilo několik vojáků." # todo: NEW TRANSLATION
 ALG_terror_2002_hammam_title: "Bombový útok v Hammam Righa" # todo: NEW TRANSLATION
 ALG_terror_2002_hammam_desc: "V Hammam Righa vybuchlo podomácku vyrobené výbušné zařízení zaměřené na vojenský konvoj." # todo: NEW TRANSLATION
 ALG_terror_2002_larbaa_title: "Bombový útok v Larbaa" # todo: NEW TRANSLATION
 ALG_terror_2002_larbaa_desc: "Militanti odpálili v Larbaa bombu a pokračovali ve své kampani proti státním úřadům." # todo: NEW TRANSLATION
 ALG_terror_2002_msila_title: "Bombový útok v M'Sile" # todo: NEW TRANSLATION
 ALG_terror_2002_msila_desc: "V M'Sile vybuchlo improvizované výbušné zařízení, které dále ukázalo trvalou přítomnost teroristických sítí v regionu." # todo: NEW TRANSLATION
 ALG_terror_2003_tizi_title: "Bombový útok v Tizi Ouzou" # todo: NEW TRANSLATION
 ALG_terror_2003_tizi_desc: "V Tizi Ouzou došlo ke smrtícímu výbuchu. Mezi mrtvými byli civilisté a bezpečnostní síly podezírají účast GSPC." # todo: NEW TRANSLATION
 ALG_terror_2004_tebessa_title: "Bombový útok v Tebesse" # todo: NEW TRANSLATION
 ALG_terror_2004_tebessa_desc: "Koordinovaný bombový útok v Tebesse zabil 7 lidí. Rostoucí rozsah útoků je alarmující." # todo: NEW TRANSLATION
 ALG_idea_arab_diplomacy: "Arabská diplomacie" # todo: NEW TRANSLATION
 ALG_terror_2005_tidjelabine_title: "Bombový útok v Tidjelabine" # todo: NEW TRANSLATION
 ALG_terror_2005_tidjelabine_desc: "V Tidjelabine zahynuli dva četníci poté, co jejich hlídku zasáhl automobil naložený výbušninami." # todo: NEW TRANSLATION
 ALG_relying_on_our_own_strength_spirit: "Spoléhat na vlastní sílu" # todo: NEW TRANSLATION
 ALG_relying_on_our_own_strength_spirit_desc: "Alžírsko potřebuje ke své prosperitě pouze Alžířany, nikoho jiného." # todo: NEW TRANSLATION
 ALG_hydroelectric_power_plants_upgraded_idea: "§RSonatrach§! – modernizované vodní elektrárny" # todo: NEW TRANSLATION
 ALG_legacy_revolution: "FLN" # todo: NEW TRANSLATION
 ALG_legacy_revolution_desc: "Fronta národního osvobození (FLN) je alžírská nacionalistická strana. Do roku 1989, kdy byl zaveden systém více stran, byla jedinou legální stranou a vládla Alžírsku jako stát jedné strany. Po alžírské občanské válce znovu získala moc v roce 2002 jako nejpopulárnější strana a zůstala jí dodnes. Její ideologie vychází z panarabského nacionalismu, jehož původní hlavní hodnotou je antikolonialismus. Podporuje socialismus, zejména arabský socialismus, a odmítá marxistické ideje." # todo: NEW TRANSLATION
 FLN_nationalize_resources: "Znárodnit zdroje" # todo: NEW TRANSLATION
 FLN_nationalize_resources_desc: "Přírodní zdroje Alžírska jsou klíčem k jeho suverenitě a prosperitě. Znárodněním našich zdrojů zajistíme, aby bohatství vytvořené ropou, plynem a nerosty přímo prospívalo obyvatelům Alžírska a položilo základy dlouhodobé hospodářské nezávislosti." # todo: NEW TRANSLATION
 ALG_devlop_industry: "Rozvíjet národní průmysl" # todo: NEW TRANSLATION
 ALG_devlop_industry_desc: "Budoucnost Alžírska závisí na posílení jeho průmyslové základny. Zaměřením na rozvoj klíčových odvětví, jako jsou výroba, energetika a technologie, snížíme závislost na zahraničním dovozu a vybudujeme soběstačné hospodářství." # todo: NEW TRANSLATION
 ALG_expand_hydro: "Rozšířit vodní infrastrukturu" # todo: NEW TRANSLATION
 ALG_expand_hydro_desc: "Abychom pokryli rostoucí energetické potřeby našeho národa a snížili závislost na zahraničních zdrojích, musíme investovat do rozšíření vodní energie. Využití našich řek nám poskytne čistou energii, posílí průmyslovou základnu a zlepší životní podmínky občanů." # todo: NEW TRANSLATION
 ALG_optimize_water_management: "Optimalizovat hospodaření s vodou" # todo: NEW TRANSLATION
 ALG_optimize_water_management_desc: "Abychom bojovali proti nedostatku vody a zvýšili zemědělskou produkci, musíme zavést moderní systémy hospodaření s vodou. Efektivní distribuce a šetření podpoří venkovské komunity i rostoucí městská centra a zvýší odolnost naší půdy vůči suchu." # todo: NEW TRANSLATION
 ALG_hydroelectric_authority: "Národní úřad pro vodní energii" # todo: NEW TRANSLATION
 ALG_hydroelectric_authority_desc: "Zřízením centralizovaného úřadu pro vodní energii můžeme systematicky rozvíjet nevyužité vodní zdroje Alžírska. To zajistí spolehlivou elektřinu pro industrializaci a zároveň vytvoří pracovní místa a technické znalosti v sektorech obnovitelné energie." # todo: NEW TRANSLATION
 ALG_electrify_rural_algeria: "Elektrifikovat venkovské Alžírsko" # todo: NEW TRANSLATION
 ALG_electrify_rural_algeria_desc: "Přivedení elektřiny na alžírský venkov je zásadní pro moderní rozvoj. Rozšířením sítě a místními vodními projekty můžeme zlepšit životní úroveň, umožnit mechanizované zemědělství a napojit odlehlé komunity na národní pokrok." # todo: NEW TRANSLATION
 ALG_foreign_investment: "Přilákat zahraniční investice" # todo: NEW TRANSLATION
 ALG_foreign_investment_desc: "Pro urychlení hospodářského rozvoje musíme vytvořit příznivé podmínky pro mezinárodní kapitál. Strategická partnerství v infrastrukturních a energetických projektech přinesou financování i technické znalosti při zachování národní suverenity." # todo: NEW TRANSLATION
 ALG_revivify_non_aligned_movement: "Oživit Hnutí nezúčastněných zemí" # todo: NEW TRANSLATION
 ALG_revivify_non_aligned_movement_desc: "Jako hrdý člen Hnutí nezúčastněných zemí musí Alžírsko znovu posílit tento blok nezávislých národů. Posílením vztahů s dalšími neutrálními státy můžeme vzdorovat dominanci velmocí a vydat se cestou skutečné suverenity v rozděleném světě." # todo: NEW TRANSLATION
 ALG_reach_out_ASEAN: "Navázat kontakt s ASEAN" # todo: NEW TRANSLATION
 ALG_reach_out_ASEAN_desc: "Národy jihovýchodní Asie sdílejí naši touhu po rozvoji bez zahraničního vměšování. Užší spolupráce s ASEAN otevře nové hospodářské příležitosti a zároveň posílí multipolární světový řád." # todo: NEW TRANSLATION
 ALG_support_developing_world: "Podpořit rozvojový svět" # todo: NEW TRANSLATION
 ALG_support_developing_world_desc: "Alžírsko stojí v solidaritě s utlačovanými a chudými národy. Prostřednictvím hospodářské pomoci, technických výměn a diplomatické podpory můžeme pomoci pozvednout globální Jih a čelit neokoloniálnímu vykořisťování." # todo: NEW TRANSLATION
 ALG_between_east_and_west: "Mezi Východem a Západem" # todo: NEW TRANSLATION
 ALG_between_east_and_west_desc: "Alžírsko, sevřené mezi soupeřícími bloky, musí postupovat obezřetně. Udržováním vyvážených vztahů s kapitalistickými i socialistickými mocnostmi si můžeme zajistit nezbytné investice, aniž bychom se vzdali nezávislosti ve prospěch kteréhokoli tábora." # todo: NEW TRANSLATION
 ALG_mediate_great_power_conflict: "Zprostředkovat konflikt velmocí" # todo: NEW TRANSLATION
 ALG_mediate_great_power_conflict_desc: "S rostoucím napětím mezi velmocemi může Alžírsko působit jako nestranný prostředník. Naše neutralita a morální autorita nám umožňují zmírňovat krize a podporovat mírové soužití v stále nestabilnějším světě." # todo: NEW TRANSLATION
 ALG_promote_reconciliation: "Podporovat usmíření" # todo: NEW TRANSLATION
 ALG_promote_reconciliation_desc: "Od Afriky po Blízký východ zuří konflikty mezi bratry. Alžírsko musí se svým revolučním dědictvím a diplomatickými zkušenostmi podporovat dialog a jednotu mezi rozdělenými národy." # todo: NEW TRANSLATION
 ALG_secure_balance: "Zajistit rovnováhu" # todo: NEW TRANSLATION
 ALG_secure_balance_desc: "Ve světě soupeřících hegemonií je rovnováha naší pojistkou. Pečlivým vyvažováním zahraniční politiky můžeme zabránit dominanci jediné mocnosti a současně získat maximum výhod od všech." # todo: NEW TRANSLATION
 ALG_joining_brics: "Připojit se k BRICS" # todo: NEW TRANSLATION
 ALG_joining_brics_desc: "Alžírsko usiluje o posílení svého globálního vlivu vstupem do skupiny rozvíjejících se ekonomik BRICS, čímž posílí hospodářský růst i politickou spolupráci." # todo: NEW TRANSLATION
 ALG_align_with_brazil: "Posílit vztahy s Brazílií" # todo: NEW TRANSLATION
 ALG_align_with_brazil_desc: "Brazílie stejně jako Alžírsko usiluje o nezávislou cestu ve světových záležitostech. Prohloubením partnerství s tímto jihoamerickým gigantem můžeme rozšířit obchod v zemědělství a technologiích a zároveň vystupovat jednotně proti neokoloniálním tlakům na globálních fórech." # todo: NEW TRANSLATION
 ALG_align_with_india: "Navázat strategické partnerství s Indií" # todo: NEW TRANSLATION
 ALG_align_with_india_desc: "Indie se svým nezúčastněným postojem a rostoucí průmyslovou mocí představuje přirozeného spojence. Spolupráce na energetických projektech, vojenských výměnách a diplomacii v OSN posílí oba naše národy proti dominanci velmocí a podpoří spolupráci Jihu s Jihem." # todo: NEW TRANSLATION
 ALG_islamic_monarchy_idea: "Islámská monarchie" # todo: NEW TRANSLATION
 ALG_islamic_monarchy_idea_desc: "Alžírsko obnovilo božskou monarchii založenou na islámských principech a národní tradici." # todo: NEW TRANSLATION
 ALG_caliph_crowned: "Korunovaný chalífa" # todo: NEW TRANSLATION
 ALG_caliph_crowned_desc: "Chalífa nevládne pouze podle zákona, ale také z vůle lidu a odkazu víry." # todo: NEW TRANSLATION
 ALG_amir_al_muminin_idea: "Amír al-mu'minín" # todo: NEW TRANSLATION
 ALG_amir_al_muminin_idea_desc: "Velitel věřících, titul s duchovní i politickou váhou v celém islámském světě." # todo: NEW TRANSLATION
 ALG_maghreb_alliance_idea: "Pilíře Maghrebu" # todo: NEW TRANSLATION
 ALG_maghreb_alliance_idea_desc: "Alžírsko vede úsilí o sjednocení západního islámského světa pod novým náboženským a politickým řádem." # todo: NEW TRANSLATION
 ALG_restore_caliphate_in_algiers: "Obnovit chalífát v Alžíru" # todo: NEW TRANSLATION
 ALG_restore_caliphate_in_algiers_desc: "Republika selhala. Nastal čas obnovit božskou monarchii zakořeněnou ve víře a historii. Z Alžíru povstane nový chalífát." # todo: NEW TRANSLATION
 ALG_crown_the_caliph: "Korunovat chalífu" # todo: NEW TRANSLATION
 ALG_crown_the_caliph_desc: "Byl vybrán právoplatný dědic chalífátu. Obřadem v Alžíru bude koruna obnovena a svět uzná nového Amíra al-mu'minína." # todo: NEW TRANSLATION
 ALG_amir_al_muminin: "Amír al-mu'minín" # todo: NEW TRANSLATION
 ALG_amir_al_muminin_desc: "Prohlašujeme chalífu Amírem al-mu'minínem, Velitelem věřících. Tento titul mu propůjčí duchovní a politickou legitimitu v celém islámském světě." # todo: NEW TRANSLATION
 ALG_umayyad_legacy: "Vyhlásit umajjovský odkaz" # todo: NEW TRANSLATION
 ALG_umayyad_legacy_desc: "Alžírsko vzývá památku Umajjovců, jejichž sláva se kdysi rozprostírala napříč kontinenty. Stavíme se do role dědiců jejich odkazu." # todo: NEW TRANSLATION
 ALG_reclaim_al_andalus: "Znovu získat al-Andalus" # todo: NEW TRANSLATION
 ALG_reclaim_al_andalus_desc: "Země al-Andalusu byly kdysi klenotem islámského světa. Nastal čas je znovu získat a oživit naši dávnou civilizaci v Ibérii." # todo: NEW TRANSLATION
 ALG_reclaim_the_crown: "Znovu získat korunu" # todo: NEW TRANSLATION
 ALG_reclaim_the_crown_desc: "Nastal čas obnovit právoplatnou, božsky vedenou monarchii zakořeněnou v islámské legitimitě. Z popela republikánského selhání a občanské války vzkřísíme historickou korunu a sjednotíme národ pod královským praporem víry, řádu a dědictví. Ať už půjde o abbásovského nástupce, obnovenou berberskou dynastii nebo symbol nové islámské jednoty, koruna bude nad Alžírskem znovu zářit." # todo: NEW TRANSLATION
 ALG_pillars_of_the_maghreb: "Pilíře Maghrebu" # todo: NEW TRANSLATION
 ALG_pillars_of_the_maghreb_desc: "Alžírsko usiluje o jednotu se svými západními bratry, Marokem a Tuniskem, aby vytvořilo základ sjednoceného islámského bloku v severní Africe." # todo: NEW TRANSLATION
 ALG_monarchy_tt: "§OJako nový panovník Alžírska vybíráme džizju a zakát od věřících. S Alláhovým vedením budeme pokračovat ve své vládě.§!" # todo: NEW TRANSLATION
 ALG_recovering_from_the_civil_war: "La décennie noire" # todo: NEW TRANSLATION
 ALG_recovering_from_the_civil_war_desc: "Alžírská občanská válka zanechala v národě hluboké jizvy. Přestože konflikt skončil, jeho důsledky přetrvávají a ovlivňují politickou krajinu i národní psychiku. Roky po občanské válce se Alžírsko stále potýká s jejími stíny. Rány konfliktu se dosud zcela nezhojily, národ je však odhodlán znovu vybudovat svou zemi." # todo: NEW TRANSLATION
 MSP_non_aligned_revival: "Obnovit nezúčastněnou zahraniční politiku" # todo: NEW TRANSLATION
 MSP_non_aligned_revival_desc: "Obnovíme ducha neutrality a solidarity globálního Jihu, stejně jako v 60. letech." # todo: NEW TRANSLATION
 MSP_global_south_solidarity: "Solidarita globálního Jihu" # todo: NEW TRANSLATION
 MSP_global_south_solidarity_desc: "Alžírsko posílí vztahy s postkoloniálními národy prostřednictvím obchodu, diplomacie a pomoci." # todo: NEW TRANSLATION
 MSP_north_africa_first: "Severní Afrika na prvním místě" # todo: NEW TRANSLATION
 MSP_north_africa_first_desc: "Zaměříme se na vedení diplomacie a rozvoje v našem bezprostředním regionu." # todo: NEW TRANSLATION
 MSP_western_sahara_position: "Podpořit Západní Saharu" # todo: NEW TRANSLATION
 MSP_western_sahara_position_desc: "Znovu potvrzujeme svou podporu sahrawské nezávislosti proti marockým nárokům." # todo: NEW TRANSLATION
 MSP_african_union_engagement: "Připojit se k Africké unii" # todo: NEW TRANSLATION
 MSP_african_union_engagement_desc: "Alžírsko se musí znovu připojit a převzít vedoucí úlohu v kontinentální diplomacii." # todo: NEW TRANSLATION
 MSP_sahel_initiatives: "Rozšířit působení v Sahelu" # todo: NEW TRANSLATION
 MSP_sahel_initiatives_desc: "Prostřednictvím měkké síly a obrany budeme bojovat proti nestabilitě a terorismu v Sahelu." # todo: NEW TRANSLATION
 MSP_arab_world_outreach: "Prohloubit arabské diplomatické vztahy" # todo: NEW TRANSLATION
 MSP_arab_world_outreach_desc: "Abychom posílili vliv Alžírska v arabském světě, musíme oživit naše diplomatické a koordinační úsilí. Prostřednictvím dvoustranných návštěv, summitů a obchodních iniciativ se Alžírsko může prosadit jako sjednocující síla v regionu." # todo: NEW TRANSLATION
 MSP_join_arab_league: "Posílit angažovanost v Lize arabských států" # todo: NEW TRANSLATION
 MSP_join_arab_league_desc: "Jako stávající člen Ligy arabských států může Alžírsko překročit rámec pouhé účasti a převzít vedoucí diplomatickou úlohu. Podpora hospodářské koordinace, konzultací v oblasti obrany a kulturní solidarity posílí naše postavení v arabském světě." # todo: NEW TRANSLATION
 MSP_support_palestine: "Podpořit palestinskou věc" # todo: NEW TRANSLATION
 MSP_support_palestine_desc: "Alžírsko dlouhodobě stojí po boku palestinského boje za sebeurčení. Obnovená diplomatická podpora, humanitární pomoc a mezinárodní prosazování této otázky znovu potvrdí náš zásadový postoj na obranu palestinských práv." # todo: NEW TRANSLATION
 MSP_algeria_algiers_axis: "Vytvořit osu Egypt–Alžír" # todo: NEW TRANSLATION
 MSP_algeria_algiers_axis_desc: "Užším spojenectvím s Egyptem může Alžírsko pomoci vytvořit mocný regionální blok schopný vést arabskou jednotu, zajistit stabilitu severní Afriky a vyvažovat zahraniční vliv." # todo: NEW TRANSLATION
 MSP_condemn_israel: "Odsoudit izraelské kroky" # todo: NEW TRANSLATION
 MSP_condemn_israel_desc: "S ohledem na pokračující agresi a porušování lidských práv bude Alžírsko na mezinárodní scéně formálně odsuzovat izraelské kroky, shromažďovat podporu pro spravedlivý mír a odmítat normalizaci bez vyřešení konfliktu." # todo: NEW TRANSLATION
 MSP_palestinian_aid_package: "Balíček pomoci Palestincům" # todo: NEW TRANSLATION
 MSP_palestinian_aid_package_desc: "Vyčleníme prostředky na humanitární, hospodářskou a technickou pomoc palestinským územím a zajistíme, aby závazek Alžírska přesáhl slova a proměnil se ve skutečnou, účinnou pomoc." # todo: NEW TRANSLATION
 MSP_pan_african_defense_initiative: "Panafrická obranná iniciativa" # todo: NEW TRANSLATION
 MSP_pan_african_defense_initiative_desc: "Na ochranu africké suverenity a posílení kontinentální stability Alžírsko navrhne koordinovanou africkou obrannou iniciativu, která vybuduje společnou vojenskou připravenost proti sdíleným hrozbám." # todo: NEW TRANSLATION
 MSP_send_troops_to_sahel: "Nasadit síly do Sahelu" # todo: NEW TRANSLATION
 MSP_send_troops_to_sahel_desc: "V reakci na rostoucí nestabilitu v Sahelu vyšle Alžírsko vojáky na podporu mírových operací, ochrany hranic a protiteroristických tažení ve spolupráci s regionálními vládami." # todo: NEW TRANSLATION
 MSP_sahel_stabilization_force: "Stabilizační síly Sahelu" # todo: NEW TRANSLATION
 MSP_sahel_stabilization_force_desc: "Alžírsko převezme vedoucí úlohu při vytvoření stálých stabilizačních sil Sahelu, bezpečnostního rámce vedeného Afričany, který bude čelit povstáním a zločineckým sítím v regionu." # todo: NEW TRANSLATION
 MSP_exploit_sahel_resources: "Využít zdroje Sahelu" # todo: NEW TRANSLATION
 MSP_exploit_sahel_resources_desc: "Alžírský vliv v Sahelu poskytuje přístup k nevyužitým přírodním zdrojům. Vyjednáváním těžebních a infrastrukturních smluv můžeme v regionu zajistit hospodářské zisky a strategická partnerství." # todo: NEW TRANSLATION
 MSP_propose_maghreb_union: "Navrhnout Maghrebskou unii" # todo: NEW TRANSLATION
 MSP_propose_maghreb_union_desc: "Nastal čas oživit vizi sjednoceného Maghrebu. Alžírsko převezme iniciativu a navrhne obnovené integrační úsilí zaměřené na hospodářskou spolupráci, společnou infrastrukturu a diplomatické sladění." # todo: NEW TRANSLATION
 MSP_economic_integration_initiative: "Hospodářská integrace Maghrebu" # todo: NEW TRANSLATION
 MSP_economic_integration_initiative_desc: "Prostřednictvím snížení cel, investic do infrastruktury a sladění diskusí o měnové politice bude Alžírsko podporovat vytvoření společné maghrebské hospodářské zóny, která prospěje všem členským státům." # todo: NEW TRANSLATION
 MSP_maghreb_joint_defense_pact: "Společný obranný pakt Maghrebu" # todo: NEW TRANSLATION
 MSP_maghreb_joint_defense_pact_desc: "Bezpečný Maghreb vyžaduje kolektivní obranu. Navrhneme regionální vojenský pakt zaměřený na ochranu hranic, sdílení zpravodajských informací a společná vojenská cvičení." # todo: NEW TRANSLATION
 MSP_mediterranean_dialogue: "Středomořský dialog" # todo: NEW TRANSLATION
 MSP_invite_iraq: "Pozvat Irák" # todo: NEW TRANSLATION
 MSP_invite_iraq_desc: "Musíme pozvat Irák do naší aliance, protože se pomalu začíná dávat dohromady a vzájemná spolupráce by nám přinesla značné výhody." # todo: NEW TRANSLATION
 MSP_invite_syria: "Pozvat Sýrii" # todo: NEW TRANSLATION
 MSP_invite_syria_desc: "Přítomnost Sýrie bezprostředně na jih od našeho území nás činí velmi zranitelnými. Pozvat Sýrii do naší frakce by byl skvělý způsob, jak zaručit naši bezpečnost." # todo: NEW TRANSLATION
 MSP_invite_algeria: "Pozvat Egypt" # todo: NEW TRANSLATION
 MSP_invite_algeria_desc: "Egypt je nastupující velmocí a s tak početným obyvatelstvem bude naše aliance schopna dosáhnout prakticky čehokoli." # todo: NEW TRANSLATION
 MSP_assistance_to_bulgaria: "Pomoc Bulharsku" # todo: NEW TRANSLATION
 MSP_assistance_to_bulgaria_desc: "Měli bychom Bulharsku pomoci s rozvojem infrastruktury, abychom mohli snadněji uskutečňovat další investice za jeho hranicemi." # todo: NEW TRANSLATION
 MSP_supp_plo: "Podpořit OOP" # todo: NEW TRANSLATION
 MSP_supp_plo_desc: "Organizace pro osvobození Palestiny (OOP) je již dlouho klíčovým aktérem boje za palestinské sebeurčení. Podpora OOP by mohla posílit naše postavení u mezinárodních spojenců a podpořit mírové řešení konfliktu." # todo: NEW TRANSLATION
 MSP_the_pal_issue: "Palestinská otázka" # todo: NEW TRANSLATION
 MSP_the_pal_issue_desc: "Otázka Palestiny zůstává zásadním tématem naší zahraniční politiky. Náš postoj k palestinskému boji určí naše mezinárodní aliance i vliv v regionu. Musíme rozhodnout, jak tento přetrvávající konflikt řešit." # todo: NEW TRANSLATION
 MSP_supp_hamas: "Podpořit Hamás" # todo: NEW TRANSLATION
 MSP_supp_hamas_desc: "Hamás představuje významnou frakci palestinského odporu. Poskytováním podpory můžeme posílit své vztahy s touto skupinou, zvýšit svůj vliv v regionu a ztotožnit se s jejím bojem." # todo: NEW TRANSLATION
 ALG_algeria_islamic: "MSP" # todo: NEW TRANSLATION
 ALG_algeria_islamic_desc: "Mouvement de la société pour la paix (Hnutí společnosti za mír) je pravicová až krajně pravicová politická strana v Alžírsku. Byla založena v roce 1990 Muslimským bratrstvem, s nímž zůstává spojena. Je sunnitsko-islamistická a hlásí se k islámské konzervativní demokracii. Největšího úspěchu dosáhla v parlamentních volbách roku 1997, kdy se stala druhou největší stranou a získala 69 z 380 křesel. Jednou kandidovala také v prezidentských volbách roku 1995, v nichž získala 25,6 % hlasů. V roce 2012 vstoupila do volební koalice s MRN a MRI. Strana je známá také jako „Hamás“, což je zkratka jejího arabského názvu „Harakat mujtama' as-silm“." # todo: NEW TRANSLATION
 MSP_Get_rid_of_military_corrupt: "Očistit zkorumpované vojenské představitele" # todo: NEW TRANSLATION
 MSP_Get_rid_of_military_corrupt_desc: "Armáda je hluboce zakořeněná v našich institucích a představuje jasnou hrozbu pro budoucnost naší země. Zatkneme její zkorumpované představitele a zabavíme veškerý majetek, který se nám podaří získat." # todo: NEW TRANSLATION
 ALG_algerian_islamic_movement: "Alžírské islámské hnutí" # todo: NEW TRANSLATION
 ALG_algerian_islamic_movement_desc: "Islámské hnutí bylo islamistické hnutí v Turecku, které bylo mezi studenty velmi populární a prosazovalo pacifistický a moderní pohled na islám. Inspirujeme se jeho učením a reformujeme školní osnovy tak, aby prosazovaly islámské hodnoty a vyučovaly je studenty, zároveň zlepšíme vzdělávání jako celek." # todo: NEW TRANSLATION
 MSP_reverse_secularization: "Zvrátit sekularizaci" # todo: NEW TRANSLATION
 MSP_arm_palestinians_to_fight: "Vyzbrojit Palestince" # todo: NEW TRANSLATION
 MSP_arm_palestinians_to_fight_desc: "V Jordánsku žije početná populace palestinských uprchlíků. Můžeme z těchto uprchlíků vytvořit bojovníky a podněcovat je k páchání chaosu v Palestině a Izraeli. Jelikož jde o zástupné bojovníky, můžeme je využít k vyprovokování izraelské odvety a vykreslit Izrael jako viníka konfliktu." # todo: NEW TRANSLATION
 MSP_zionist_threat: "Sionistická hrozba" # todo: NEW TRANSLATION
 MSP_zionist_threat_desc: "Izrael je největší urážkou všech muslimů a ohavný falešný stát v srdci islámu. Musí být vymazán z povrchu země." # todo: NEW TRANSLATION
 ALG_kabyle_issue: "Kabylská otázka" # todo: NEW TRANSLATION
 ALG_kabyle_issue_map: "Spokojenost [KBY.GetFlag] Amazighů s naší vládou!" # todo: NEW TRANSLATION
 ALG_2014_oil_crash_idea: "Propad cen ropy" # todo: NEW TRANSLATION
 ALG_algeria_resplendent: "Rozkvétající Alžírsko" # todo: NEW TRANSLATION
 ALG_algeria_resplendent_desc: "" # todo: NEW TRANSLATION
 KBY_new_state_born: "Zrodil se nový stát" # todo: NEW TRANSLATION
 KBY_new_state_born_desc: "Kabýlie se znovu zrodila jako suverénní národ. První dny naší nezávislosti musí být poznamenány konsolidací, oslavami a obezřetností." # todo: NEW TRANSLATION
 KBY_border_readiness: "Připravenost hranic" # todo: NEW TRANSLATION
 KBY_border_readiness_desc: "Musíme zabezpečit obvod naší vlasti, abychom zabránili infiltraci, pašování či vpádům." # todo: NEW TRANSLATION
 KBY_new_institutions: "Nové instituce" # todo: NEW TRANSLATION
 KBY_new_institutions_desc: "Fungující stát musí stát na základech důvěryhodných a stabilních institucí." # todo: NEW TRANSLATION
 KBY_state_economy_plan: "Státní hospodářský plán" # todo: NEW TRANSLATION
 KBY_state_economy_plan_desc: "Musíme stanovit strukturu našeho hospodářství, ať už centralizovaného, tržního nebo smíšeného." # todo: NEW TRANSLATION
 KBY_african_diplomacy: "Africká diplomacie" # todo: NEW TRANSLATION
 KBY_african_diplomacy_desc: "Hledání regionální legitimity mezi africkými sousedy posílí naše postavení i hospodářské příležitosti." # todo: NEW TRANSLATION
 KBY_international_recognition_campaign: "Kampaň za mezinárodní uznání" # todo: NEW TRANSLATION
 KBY_international_recognition_campaign_desc: "Naše přežití závisí na legitimitě v očích ostatních národů. Zahájíme cílenou diplomatickou ofenzivu." # todo: NEW TRANSLATION
 KBY_international_recognition_campaign_completion: "Diplomatické kanály byly otevřeny, nyní začíná náročná práce přesvědčování." # todo: NEW TRANSLATION
 KBY_establish_governance_structures: "Vybudovat správní struktury" # todo: NEW TRANSLATION
 KBY_establish_governance_structures_desc: "Musíme vytvořit instituce, které zajistí trvalost našich vládních principů." # todo: NEW TRANSLATION
 KBY_establish_governance_structures_completion: "Vládní instituce jsou nyní funkční a připravené sloužit našim občanům." # todo: NEW TRANSLATION
 KBY_plan_the_economy: "Naplánovat hospodářství" # todo: NEW TRANSLATION
 KBY_plan_the_economy_desc: "Rozhodněme o naší hospodářské budoucnosti: státem řízené, liberální nebo smíšené hospodářství. Každá cesta nabízí jedinečné kompromisy." # todo: NEW TRANSLATION
 KBY_plan_the_economy_completion: "Hospodářské plánování probíhá, pro dlouhodobou prosperitu vybírejte moudře." # todo: NEW TRANSLATION
 KBY_seek_regional_support: "Vyhledat regionální podporu" # todo: NEW TRANSLATION
 KBY_seek_regional_support_desc: "Podpora našich sousedů a afrického společenství posílí naši legitimitu." # todo: NEW TRANSLATION
 KBY_seek_regional_support_completion: "Úsilí o regionální spolupráci bylo zahájeno, nyní čekáme na odpovědi." # todo: NEW TRANSLATION
 KBY_secure_internal_stability: "Zajistit vnitřní stabilitu" # todo: NEW TRANSLATION
 KBY_secure_internal_stability_desc: "Nyní, když máme pod kontrolou vnější hrozby, musíme se vypořádat s vnitřním odporem a nesouhlasem." # todo: NEW TRANSLATION
 KBY_secure_internal_stability_completion: "Bezpečnostní protokoly byly aktivovány, veřejný pořádek se zlepšil." # todo: NEW TRANSLATION
 KBY.10.t: "Navazování mezinárodních vztahů" # todo: NEW TRANSLATION
 KBY.10.d: "Nyní, když mezinárodní společenství uznalo naši nezávislost, nastal čas, aby Kabýlie navázala formální diplomatické vztahy s ostatními národy. Naši diplomaté jsou připraveni oslovit potenciální partnery, počínaje Francií vzhledem k našim historickým vazbám a Tureckem, které projevilo zájem o amazighskou věc.\n\nTato diplomatická ofenziva pomůže legitimizovat náš mladý národ a otevře dveře budoucí spolupráci." # todo: NEW TRANSLATION
 KBY.10.a: "Oslovíme všechny národy!" # todo: NEW TRANSLATION
 KBY.15.t: "Hledání africké jednoty" # todo: NEW TRANSLATION
 KBY.15.d: "Naše africká diplomatická iniciativa položila základy hlubší integrace s kontinentem. Africká unie představuje pro náš národ důležité fórum; členství by přineslo legitimitu, hospodářské příležitosti a platformu pro prosazování práv Amazighů v celé severní Africe.\n\nNiger s početnou tuarežskou populací vyjádřil podporu naší žádosti." # todo: NEW TRANSLATION
 KBY.15.a: "Požádat o členství v Africké unii" # todo: NEW TRANSLATION
 KBY_diplomatic_move: "Kabylská diplomatická ofenziva" # todo: NEW TRANSLATION
 KBY_au_membership_attempt: "Pokus o kabylské členství v AU" # todo: NEW TRANSLATION
 KBY_state_economy_model_statist: "Státem řízené hospodářství" # todo: NEW TRANSLATION
 KBY_state_economy_model_liberal: "Liberální tržní hospodářství" # todo: NEW TRANSLATION
 KBY_state_economy_model_mixed: "Smíšený hospodářský model" # todo: NEW TRANSLATION
 ALG_recover_from_the_war: "Obnova po občanské válce" # todo: NEW TRANSLATION
 ALG_restoring_order: "Obnova pořádku" # todo: NEW TRANSLATION
 ALG_restoring_order_desc: "Bezprostřední prioritou je znovu nastolit státní autoritu a zastavit chaos, který v některých regionech přetrvává. Po letech zkázy obyvatelstvo touží po míru a řádu." # todo: NEW TRANSLATION
 ALG_secure_weapons_shipments: "Zajistit dodávky zbraní" # todo: NEW TRANSLATION
 ALG_secure_weapons_shipments_desc: "Zajištění dostatečného zásobování naší armády nám umožní udržovat vnitřní pořádek a zabránit obnovení povstání." # todo: NEW TRANSLATION
 ALG_recover_from_the_war_desc: "Nyní musíme zahájit dlouhý proces obnovy našeho národa. Černá dekáda zanechala v Alžírsku hluboké jizvy, ale s odhodláním můžeme povstat z popela." # todo: NEW TRANSLATION
 ALG_restoring_the_broken_economy: "Oživit národní hospodářství" # todo: NEW TRANSLATION
 ALG_restoring_the_broken_economy_desc: "Občanská válka ochromila naše finanční instituce. Musíme zavést mimořádná opatření ke stabilizaci hospodářství." # todo: NEW TRANSLATION
 ALG_arresting_extremists: "Neutralizovat ozbrojené hrozby" # todo: NEW TRANSLATION
 ALG_arresting_extremists_desc: "Extremistické skupiny stále působí v odlehlých oblastech. Obnovená bezpečnostní kampaň znovu nastolí plnou národní kontrolu." # todo: NEW TRANSLATION
 ALG_economic_recovery: "Hospodářské oživení" # todo: NEW TRANSLATION
 ALG_economic_recovery_desc: "Naše politika začíná přinášet výsledky. Nyní vstupujeme do fáze postupné obnovy a návratu důvěry." # todo: NEW TRANSLATION
 ALG_regain_banks: "Obnovit důvěru v bankovní sektor" # todo: NEW TRANSLATION
 ALG_regain_banks_desc: "Oživení bankovního sektoru je klíčové pro obnovení důvěry investorů a obnovení domácích úvěrů." # todo: NEW TRANSLATION
 ALG_financial_reform: "Reformovat finanční systém" # todo: NEW TRANSLATION
 ALG_financial_reform_desc: "Modernizace alžírského finančního systému podpoří udržitelný růst a umožní nám vyhnout se budoucím otřesům." # todo: NEW TRANSLATION
 ALG_begin_full_recovery: "Zahájit úplnou hospodářskou obnovu" # todo: NEW TRANSLATION
 ALG_begin_full_recovery_desc: "Nyní, když je zajištěna bezpečnost a hospodářství stabilizováno, můžeme zahájit úplné celostátní hospodářské oživení." # todo: NEW TRANSLATION
 ALG_repairing_the_roads: "Opravit infrastrukturu" # todo: NEW TRANSLATION
 ALG_repairing_the_roads_desc: "Silnice, mosty a komunikační vedení se zhroutily. Obnova naší logistické sítě je nezbytná pro národní soudržnost." # todo: NEW TRANSLATION
 ALG_rebuild_north: "Obnovit Kabýlii a Alžír" # todo: NEW TRANSLATION
 ALG_rebuild_north_desc: "Tato městská centra patřila mezi nejhůře postižená. Obnově základních služeb v Kabýlii a Alžíru musí být dána přednost." # todo: NEW TRANSLATION
 ALG_rebuild_centre: "Obnovit centrální vysočiny" # todo: NEW TRANSLATION
 ALG_rebuild_centre_desc: "Centrální vysočiny byly bojištěm i dějištěm humanitární krize. Potřebují cílenou rekonstrukci." # todo: NEW TRANSLATION
 ALG_rebuild_west: "Obnovit západ" # todo: NEW TRANSLATION
 ALG_rebuild_west_desc: "Infrastruktura na západě byla zanedbávána už před válkou. Nastal čas tyto odlehlé regiony začlenit." # todo: NEW TRANSLATION
 ALG_rebuild_algeria: "Obnovit Alžírsko" # todo: NEW TRANSLATION
 ALG_rebuild_algeria_desc: "Nastal čas obnovit náš národ a znovu se stát velmocí. Tato občanská válka způsobila příliš mnoho ran, nyní je čas je zahojit." # todo: NEW TRANSLATION
 ALG_rebuild_south: "Obnovit jih" # todo: NEW TRANSLATION
 ALG_rebuild_south_desc: "Infrastruktura na jihu byla zanedbávána už před válkou. Nastal čas tyto odlehlé regiony začlenit." # todo: NEW TRANSLATION
 ALG_order_restored_in_algeria: "V Alžírsku obnoven pořádek" # todo: NEW TRANSLATION
 ALG_order_restored_in_algeria_desc: "Poprvé po desetiletích je Alžírsko stabilní a sjednocené. Cesta před námi je dlouhá, ale mír se vrátil." # todo: NEW TRANSLATION
 ALG_state_and_imf_funding: "Státní a financování MMF" # todo: NEW TRANSLATION
 ALG_state_and_imf_funding_desc: "Prostřednictvím půjček a zahraniční pomoci, zejména od MMF, můžeme vdechnout život našemu ochromenému hospodářství." # todo: NEW TRANSLATION
 ALG_restocking_factories: "Doplnit zásoby továren" # todo: NEW TRANSLATION
 ALG_restocking_factories_desc: "Mnoho továren bylo poškozeno nebo vyprázdněno. S novými dodávkami můžeme obnovit výrobu." # todo: NEW TRANSLATION
 ALG_rebuilding_factories: "Obnovit průmyslové zóny" # todo: NEW TRANSLATION
 ALG_rebuilding_factories_desc: "Několik průmyslových zón se ocitlo v troskách. Jejich obnova vytvoří pracovní místa a vyrobí materiály potřebné pro obnovu." # todo: NEW TRANSLATION
 ALG_export_controls: "Kontrola vývozu a pomoc federace" # todo: NEW TRANSLATION
 ALG_export_controls_desc: "Na ochranu strategického zboží a zajištění vnitřního rozvoje zavedeme dočasná vývozní omezení vyvážená vnější podporou." # todo: NEW TRANSLATION
 ALG_post_war_recovery: "Poválečná obnova" # todo: NEW TRANSLATION
 ALG_post_war_recovery_desc: "Alžírsko zůstává poznamenáno brutálním občanským konfliktem 90. let. Přestože byl obnoven mír, národ stále trpí nestabilitou, nevyužitými továrnami, přetíženou infrastrukturou a křehkým politickým systémem." # todo: NEW TRANSLATION
 ALG_imf_funding_idea: "Mimořádné financování MMF" # todo: NEW TRANSLATION
 ALG_imf_funding_idea_desc: "Mezinárodní měnový fond zasáhl, aby poskytl tolik potřebnou likviditu a rozpočtovou úlevu. Přestože tyto prostředky pomáhají stabilizovat hospodářství, jsou spojeny s podmínkami." # todo: NEW TRANSLATION
 ALG_export_controls_idea: "Kontrola vývozu" # todo: NEW TRANSLATION
 ALG_export_controls_idea_desc: "V zájmu upřednostnění domácí obnovy vláda zavedla vývozní omezení na klíčové materiály. Tato politika stabilizuje vnitřní trhy, ale může poškodit mezinárodní obchodní vztahy." # todo: NEW TRANSLATION
 ALG_anti_terror_sweeps: "Protiteroristické operace" # todo: NEW TRANSLATION
 ALG_anti_terror_sweeps_desc: "Bezpečnostní síly provádějí agresivní operace s cílem zlikvidovat zbývající extremistické prvky. Přestože to zvyšuje národní bezpečnost, je třeba postup vyvažovat, aby nedocházelo k potlačování občanských svobod." # todo: NEW TRANSLATION
 ALG_banking_confidence_restored: "Obnovena důvěra v bankovní sektor" # todo: NEW TRANSLATION
 ALG_banking_confidence_restored_desc: "Po období hluboké nedůvěry a stagnace získal bankovní sektor určitou stabilitu, což občanům i investorům umožňuje znovu se zapojit do alžírského finančního systému." # todo: NEW TRANSLATION
 ALG_structural_reform: "Strukturální hospodářské reformy" # todo: NEW TRANSLATION
 ALG_structural_reform_desc: "Probíhají rozsáhlé reformy s cílem modernizovat alžírské hospodářství. Tyto změny mají snížit inflaci, zefektivnit instituce a podpořit dlouhodobý růst." # todo: NEW TRANSLATION
 ALG_national_recovery_completed: "Národní obnova dokončena" # todo: NEW TRANSLATION
 ALG_national_recovery_completed_desc: "Po obnově infrastruktury, zajištění bezpečnosti a oživení hospodářství Alžírsko konečně překonalo svou nejtemnější kapitolu. Začíná nová éra naděje a pokroku." # todo: NEW TRANSLATION
 ALG_mastering_atom: "Zvládnutí atomu" # todo: NEW TRANSLATION
 ALG_missile_chi_TT: "Alžírsko vylepší technologii §Hjaderného reaktoru§!" # todo: NEW TRANSLATION
 CHI_rejected_ALG: " Nabídka odmítnuta Čínou" # todo: NEW TRANSLATION
 ALG_technological_ties: "Technologické vazby" # todo: NEW TRANSLATION
 ALG_continue_1991_program: "Pokračovat v jaderném programu z roku 1991" # todo: NEW TRANSLATION
 ALG_continue_1991_program_desc: "Ačkoli byl náš jaderný program v 90. letech pozastaven, jeho základy zůstaly zachovány. Obnovením starých projektů můžeme usilovat o energetickou bezpečnost a větší nezávislost, přestože pravděpodobně budou následovat mezinárodní sankce." # todo: NEW TRANSLATION
 ALG_seek_china_help: "Vyhledat čínskou pomoc" # todo: NEW TRANSLATION
 ALG_seek_china_help_desc: "Čína byla dlouhodobě ochotna spolupracovat s Alžírskem v oblasti jaderných technologií. Obnovené partnerství nám poskytne vybavení, odborné znalosti a výcvik, které obejdou západní omezení." # todo: NEW TRANSLATION
 ALG_1983_deal: "Obnovit raketovou dohodu z roku 1983" # todo: NEW TRANSLATION
 ALG_1983_deal_desc: "Naše dřívější spolupráce s Čínou v roce 1983 nám poskytla raketové technologie a omezenou jadernou pomoc. Obnovení tohoto ujednání by urychlilo naše civilní i vojenské jaderné ambice." # todo: NEW TRANSLATION
 ALG_missile_cooperation: "Rozšířit raketovou spolupráci" # todo: NEW TRANSLATION
 ALG_missile_cooperation_desc: "Kromě reaktorů a paliva nám Čína může poskytnout také raketové systémy schopné nést jaderné nálože. Tento krok však přitáhne vážnou pozornost Západu." # todo: NEW TRANSLATION
 ALG_hoggar_nuclear_facility: "Vybudovat zařízení v Hoggaru" # todo: NEW TRANSLATION
 ALG_hoggar_nuclear_facility_desc: "Hluboko v hoggarských horách lze vybudovat zabezpečené jaderné zařízení chráněné před vnějším vměšováním. Stane se ústředním bodem alžírského jaderného programu." # todo: NEW TRANSLATION
 ALG_the_search_for_uranium: "Hledání uranu" # todo: NEW TRANSLATION
 ALG_the_search_for_uranium_desc: "Naši vědci jsou přesvědčeni, že rozsáhlá alžírská poušť ukrývá velké zásoby uranu. Lokalizace a těžba těchto ložisek poskytne základ každému nezávislému jadernému projektu." # todo: NEW TRANSLATION
 ALG_dig_in_tamanrasset: "Těžit v Tamanrassetu" # todo: NEW TRANSLATION
 ALG_dig_in_tamanrasset_desc: "Pouštní pláně Tamanrassetu ukrývají významná ložiska uranu. Investicemi do těžební infrastruktury se zde Alžírsko může osvobodit od závislosti na zahraničních dodavatelích." # todo: NEW TRANSLATION
 ALG_withdrawal_from_npt: "Vystoupit ze Smlouvy o nešíření jaderných zbraní" # todo: NEW TRANSLATION
 ALG_withdrawal_from_npt_desc: "Alžírsko již nemůže dovolit, aby jeho suverenitu omezovaly zahraniční smlouvy. Vystoupením ze Smlouvy o nešíření jaderných zbraní otevřeně deklarujeme svůj záměr usilovat o jaderné zbraně." # todo: NEW TRANSLATION
 ALG_wmds: "Zbraně hromadného ničení" # todo: NEW TRANSLATION
 ALG_wmds_desc: "Nyní, když jsou dokončena obohacovací zařízení a rakety připraveny, nastal čas dokončit alžírské jaderné odstrašení. Svět si toho všimne a naši nepřátelé si dvakrát rozmyslí, než nám pohrozí." # todo: NEW TRANSLATION
 ALG_algiers_agreement: "Alžírská dohoda" # todo: NEW TRANSLATION
 ALG_algiers_agreement_desc: "Namísto jaderného vyzbrojování se Alžírsko může představit jako zastánce míru. Alžírská dohoda bude sloužit jako závazek zdrženlivosti a otevře cestu zahraničním investicím a mezinárodní legitimitě." # todo: NEW TRANSLATION
 ALG_sign_BWC: "Podepsat Úmluvu o biologických zbraních" # todo: NEW TRANSLATION
 ALG_sign_BWC_desc: "Přistoupením k mezinárodním dohodám proti zbraním hromadného ničení prokážeme oddanost Alžírska míru. To uklidní zahraniční investory a sníží podezření ohledně našich jaderných aktivit." # todo: NEW TRANSLATION
 ALG_build_nuclear_reactor: "Vybudovat jaderný reaktor" # todo: NEW TRANSLATION
 ALG_build_nuclear_reactor_desc: "Náš jaderný program je připraven na další krok. Výstavbou reaktoru v plném měřítku získá Alžírsko mocný zdroj energie i zástěrku pro další obohacovací aktivity. Zatímco svět může spatřovat mírové úmysly, realita může být mnohem složitější." # todo: NEW TRANSLATION
 ALG_IAEA_safeguards_leave: "Záruky MAAE dokončeny" # todo: NEW TRANSLATION
 ALG_IAEA_safeguards_leave_desc: "Po letech dohledu a dodržování závazků Alžírsko plně provedlo své závazky vyplývající z Alžírské dohody a Úmluvy o biologických zbraních. Po odjezdu posledních inspektorů MAAE z našeho území jsou sankce zrušeny a náš národ je uznán jako odpovědná regionální mocnost." # todo: NEW TRANSLATION
 sanctioned_algeria: "Sankce" # todo: NEW TRANSLATION
 ALG_hoggar_nuclear_facility_idea: "Jaderné zařízení v Hoggaru" # todo: NEW TRANSLATION
 ALG_algeria_behave_TT: "[USA.GetFlag] §HSpojené státy§! pravděpodobně §Gzruší§! hospodářské sankce" # todo: NEW TRANSLATION
 nuclear_algeria.1.t: "Potenciální dodavatel?" # todo: NEW TRANSLATION
 nuclear_algeria.1.d: "V rámci snahy získat jaderné technologie si musíme přiznat, že nedosahujeme potřebné úrovně odbornosti k výrobě adekvátních zbraní či zařízení. Proto se musíme obrátit do světa a zjistit, kdo je ochoten nám pomoci. Naše zdroje nám sdělují, že o pomoc můžeme požádat jeden konkrétní národ." # todo: NEW TRANSLATION
 nuclear_algeria.1.a: "Kontaktovat Číňany" # todo: NEW TRANSLATION
 nuclear_algeria.2.t: "Alžírsko žádá o pomoc" # todo: NEW TRANSLATION
 nuclear_algeria.2.d: "Alžírští vědci a diplomaté se nedávno setkali s našimi představiteli a požádali o pomoc s jejich jaderným programem. Prohlásili, že přijmou cokoli, co jim poskytneme, pokud jim to pomůže rozvíjet jejich jaderný program." # todo: NEW TRANSLATION
 nuclear_algeria.2.a: "Dobrá" # todo: NEW TRANSLATION
 nuclear_algeria.2.b: "Nemůžeme sdílet svá tajemství" # todo: NEW TRANSLATION
 nuclear_algeria.3.t: "Čína sdílí raketové technologie" # todo: NEW TRANSLATION
 nuclear_algeria.3.d: "Čínští vědci se nedávno setkali s našimi v [ALG.capital.GetCapitalVictoryPointName] a poskytli nám plány pokročilých mezikontinentálních balistických raket, které v současnosti nevlastníme." # todo: NEW TRANSLATION
 nuclear_algeria.3.a: "Skvělé!" # todo: NEW TRANSLATION
 nuclear_algeria.4.t: "Čína poskytuje jaderné technologie" # todo: NEW TRANSLATION
 nuclear_algeria.4.d: "Čínští vědci se nedávno setkali s našimi v [ALG.capital.GetCapitalVictoryPointName] a poskytli nám plány pokročilých reaktorů, které v současnosti nevlastníme." # todo: NEW TRANSLATION
 nuclear_algeria.4.a: "Skvělé!" # todo: NEW TRANSLATION
 nuclear_algeria.5.t: "[FROM.GetName] odmítá poskytnout pomoc!" # todo: NEW TRANSLATION
 nuclear_algeria.5.d: "Při kontaktování [FROM.GetName] s žádostí o pomoc s naším jaderným programem jsme se dopustili zásadního omylu. Naše žádosti odmítli a pohrozili, že naši žádost předloží mezinárodním soudům, čímž by mohli odhalit naše tajemství." # todo: NEW TRANSLATION
 nuclear_algeria.5.a: "Promarněná příležitost." # todo: NEW TRANSLATION
 nuclear_algeria.6.t: "Alžírsko chce koupit rakety" # todo: NEW TRANSLATION
 nuclear_algeria.6.d: "Alžírská vláda nás požádala o prodej série balistických raket. Prohlásila, že rakety použije k ochraně svých státních hranic a v žádné podobě k útočné válce." # todo: NEW TRANSLATION
 nuclear_algeria.6.a: "Dobrá, dokončit prodej" # todo: NEW TRANSLATION
 nuclear_algeria.6.b: "Ne" # todo: NEW TRANSLATION
 nuclear_algeria.7.t: "Čína prodává své rakety" # todo: NEW TRANSLATION
 nuclear_algeria.7.d: "Čína nám prodala přibližně 400 balistických raket. Některé mohou být zastaralé, ale stále fungují, což je jediné, na čem záleží." # todo: NEW TRANSLATION
 nuclear_algeria.7.a: "Skvělé" # todo: NEW TRANSLATION
 nuclear_algeria.8.t: "Čína odmítá prodat rakety" # todo: NEW TRANSLATION
 nuclear_algeria.8.d: "Čínská vláda zamítla naši žádost o nákup raket s odůvodněním, že je potřebuje pro své vlastní vojenské operace." # todo: NEW TRANSLATION
 nuclear_algeria.8.a: "Dobrá" # todo: NEW TRANSLATION
 nuclear_algeria.19.t: "Mezinárodní sankce" # todo: NEW TRANSLATION
 nuclear_algeria.19.d: "Zdá se, že se svět rozhodl obrátit proti nám a uvalil sankce na naše hospodářství, které je nevyhnutelně ochromí. Budeme muset přehodnotit svou politiku." # todo: NEW TRANSLATION
 nuclear_algeria.19.a: "Co jsme čekali od světa zrádců?" # todo: NEW TRANSLATION
 nuclear_algeria.25.t: "Spojené státy zvyšují hospodářský tlak" # todo: NEW TRANSLATION
 nuclear_algeria.25.d: "Spojené státy se rozhodly prosazovat svou imperialistickou vizi zvýšením hospodářských sankcí proti našemu lidu." # todo: NEW TRANSLATION
 nuclear_algeria.25.a: "Budeme vzdorovat!" # todo: NEW TRANSLATION
 nuclear_algeria.26.t: "Spojené státy snižují hospodářský tlak" # todo: NEW TRANSLATION
 nuclear_algeria.26.d: "Spojené státy se rozhodly snížit počet sankcí uvalených na náš lid. Zda tento postoj zachovají, ukáže teprve čas." # todo: NEW TRANSLATION
 nuclear_algeria.26.a: "Dobře" # todo: NEW TRANSLATION
 nuclear_algeria.28.t: "Alžírsko se podřizuje" # todo: NEW TRANSLATION
 nuclear_algeria.28.d: "V naprostém opaku k typické alžírské politice se zdá, že se vydávají pokojnějším a kontrolovanějším směrem." # todo: NEW TRANSLATION
 nuclear_algeria.28.a: "Dobře, možná nyní můžeme sankce zmírnit" # todo: NEW TRANSLATION
 algerian_focus.171.t: "Jaderná elektrárna Es-Salam" # todo: NEW TRANSLATION
 algerian_focus.171.d: "To, co Američané z jaderné elektrárny Es-Salam vybudovali, zůstalo po desetiletí nedokončené a nečinné. S příchodem několika čínských vědců nabídla čínská společnost dokončení elektrárny." # todo: NEW TRANSLATION
 algerian_focus.171.a: "Přijmout návrh" # todo: NEW TRANSLATION
 algerian_focus.171.b: "Ne, děkujeme" # todo: NEW TRANSLATION
 ALG_sanctioned: "Pod sankcemi" # todo: NEW TRANSLATION
 ALG_nuclear_known: "Odhalený jaderný program" # todo: NEW TRANSLATION
 ALG_emergency_budget: "Mimořádný rozpočet" # todo: NEW TRANSLATION
 support_brics: "Podpořit BRICS" # todo: NEW TRANSLATION
 algeria_msp: "Výtev MSP" # todo: NEW TRANSLATION
 algeria_democratic: "Výtev RND" # todo: NEW TRANSLATION
 algeria_nationalist: "Výtev PNA" # todo: NEW TRANSLATION
 monitor_kabyle_unrest: "Sledovat [KBY.GetFlag] kabylské nepokoje" # todo: NEW TRANSLATION
 ALG_us_sanctions: "Americké sankce" # todo: NEW TRANSLATION
 ALG_us_sanctions_desc: "Spojené státy uvalily několik sankcí, které omezují naši schopnost komunikovat s vnějším světem. Přestože nejsou ochromující, do určité míry nám brání dosáhnout hospodářského úspěchu.\n§W--------------§!\nSpojené státy mohou na základě našich kroků sankce proti naší vládě zvyšovat nebo snižovat.\n§W--------------§!\nTento národní duch bude §Rodstraněn§!, pokud Spojené státy usoudí, že již neusilujeme o jaderné zbraně." # todo: NEW TRANSLATION
 ALG_imf_path: "Zvolit cestu půjčky MMF" # todo: NEW TRANSLATION
 ALG_imf_loan_taken: "Přijaty půjčky MMF" # todo: NEW TRANSLATION
 ALG_oil_reformed: "Reforma ropného sektoru" # todo: NEW TRANSLATION
 ALG_repression_modifier: "Represe" # todo: NEW TRANSLATION
 ALG_surveillance_state_modifier: "Dohledový stát" # todo: NEW TRANSLATION
 ALG_national_dialogue_modifier: "Národní dialog" # todo: NEW TRANSLATION
 ALG_boteflika: "Zdravotní krize prezidenta Alžírska" # todo: NEW TRANSLATION
 idea_alg_empowered_parliament: "Posílený parlament" # todo: NEW TRANSLATION
 algeria_sahar.1.t: "Pomoc z Alžírska" # todo: NEW TRANSLATION
 algeria_sahar.1.d: "Obdrželi jsme nabídku od Alžírska. Jsou ochotni poskytnout nám vojenskou pomoc a pomoci s přípravou na obnovení bojů výměnou za účast v procesu založení UAR. Máme alžírskou podporu přijmout?" # todo: NEW TRANSLATION
 algeria_sahar.1.a: "Musíme ji přijmout!" # todo: NEW TRANSLATION
 algeria_sahar.1.b: "V žádném případě se nestaneme jejich loutkami!" # todo: NEW TRANSLATION
 algeria_sahar.2.t: "Mírová dohoda" # todo: NEW TRANSLATION
 algeria_sahar.2.d: "Nedokázali jsme rebely zadržet a ti ovládli celou Západní Saharu. Máme rebelům nabídnout mírovou smlouvu a postoupit jim území?" # todo: NEW TRANSLATION
 algeria_sahar.2.a: "Poslat jim nabídku" # todo: NEW TRANSLATION
 algeria_sahar.2.b: "Musíme je rozdrtit!" # todo: NEW TRANSLATION
 algeria_sahar.3.t: "Nabídka z Maroka" # todo: NEW TRANSLATION
 algeria_sahar.3.d: "Maroko nám poslalo návrh mírové smlouvy. Toto prohlášení lze považovat za plnohodnotný akt kapitulace! Můžeme kapitulaci přijmout, nebo můžeme vyrazit širokou frontou osvobodit národy severního Maghrebu!" # todo: NEW TRANSLATION
 algeria_sahar.3.a: "Zvítězili jsme!" # todo: NEW TRANSLATION
 algeria_sahar.3.b: "Vpřed k Lidové federaci!" # todo: NEW TRANSLATION
 algeria_sahar.4.t: "Válka byla vyhrána" # todo: NEW TRANSLATION
 algeria_sahar.4.d: "Naše síly zvítězily. Konflikt v Západní Sahaře skončil a my nyní můžeme politický řád regionu přetvořit podle svého uvážení." # todo: NEW TRANSLATION
 algeria_sahar.4.a: "Založit Saharskou federaci." # todo: NEW TRANSLATION
 algeria_sahar.5.t: "Konečně mír." # todo: NEW TRANSLATION
 algeria_sahar.5.d: "Podepsali jsme mírovou smlouvu se Sarawi a válka skončila." # todo: NEW TRANSLATION
 algeria_sahar.5.a: "Naše nejtemnější časy…" # todo: NEW TRANSLATION
 algeria_sahar.6.t: "Odmítli nás!" # todo: NEW TRANSLATION
 algeria_sahar.6.d: "Sarawi odmítli naši mírovou smlouvu! Válka pokračuje!" # todo: NEW TRANSLATION
