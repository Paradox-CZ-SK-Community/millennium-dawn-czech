 ALG_mers_el_kebir_shipyards_desc: "Toto historické námořní zařízení se nachází ve strategickém přístavu Mers El-Kébir poblíž Oranu a zajišťuje stavbu a údržbu hlídkových lodí a lehkých plavidel pro alžírské námořnictvo." # todo: NEW TRANSLATION
