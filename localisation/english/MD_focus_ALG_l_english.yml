 ALG_reconciliation_momentum_ended_tt: "Dynamika smíření vyprchala." # todo: NEW TRANSLATION
 ALG_by_the_people_for_the_people: "Lidem, pro lid" # todo: NEW TRANSLATION
 ALG_by_the_people_for_the_people_desc: "Hnutí Hirak otřáslo Alžírskem v samotných základech. Lid požaduje úplnou proměnu politického systému, nikoli pouze výměnu tváří, ale zásadní přestavbu moci. Stará garda neodejde tiše." # todo: NEW TRANSLATION
 ALG_by_the_people_for_the_people_tt: "§YHnutí Hirak§! musí mít dostatečnou dynamiku (rovnováha moci nad §G70%§!)." # todo: NEW TRANSLATION
 ALG_break_the_oligarchs: "Zlomit oligarchy" # todo: NEW TRANSLATION
 ALG_break_the_oligarchs_desc: "Síť podnikatelů, kteří těžili ze své blízkosti k režimu, musí být rozbita. Jejich majetek bude zabaven, smlouvy přezkoumány a jejich vliv na stát navždy ukončen." # todo: NEW TRANSLATION
 ALG_dismantle_le_pouvoir: "Rozložit Le Pouvoir" # todo: NEW TRANSLATION
 ALG_dismantle_le_pouvoir_desc: "Stínový stát, generálové, zpravodajské služby a neviditelná ruka, která vede Alžírsko od získání nezávislosti, musí být vyneseny na světlo a zbaveny pravomocí." # todo: NEW TRANSLATION
 ALG_new_economic_model: "Nový ekonomický model" # todo: NEW TRANSLATION
 ALG_new_economic_model_desc: "Po odstranění oligarchů potřebuje Alžírsko novou hospodářskou vizi. Rentierský stát je mrtvý. Na jeho místě vznikne diverzifikovaná ekonomika založená na průmyslu, technologiích a lidském kapitálu." # todo: NEW TRANSLATION
 ALG_unleash_civil_society: "Uvolnit občanskou společnost" # todo: NEW TRANSLATION
 ALG_unleash_civil_society_desc: "Svobodný tisk, nezávislé odbory a politické strany zastupující skutečné voličské základny – to jsou základy, na nichž se buduje demokracie." # todo: NEW TRANSLATION
 ALG_constitutional_convention: "Ústavodárné shromáždění" # todo: NEW TRANSLATION
 ALG_constitutional_convention_desc: "Zástupci z celého Alžírska se scházejí, aby sepsali novou ústavu. Poprvé bude tento dokument napsán lidem, nikoli vnucen mocnými." # todo: NEW TRANSLATION
 ALG_presidential_republic: "Prezidentská republika" # todo: NEW TRANSLATION
 ALG_presidential_republic_desc: "Alžírsko přijme prezidentský systém se silnou výkonnou mocí, jasnými pravomocemi a demokratickou odpovědností. Prezident bude rozhodně vládnout, zatímco ústavní záruky zabrání zneužití moci." # todo: NEW TRANSLATION
 ALG_parliamentary_republic: "Parlamentní republika" # todo: NEW TRANSLATION
 ALG_parliamentary_republic_desc: "Alžírsko přijme parlamentní systém, v němž se moc dělí mezi volené zástupce. Budování koalic a konsenzus zajistí, že žádný jednotlivec již nebude moci ovládnout stát." # todo: NEW TRANSLATION
 ALG_civilian_military_control: "Civilní kontrola armády" # todo: NEW TRANSLATION
 ALG_civilian_military_control_desc: "Armáda musí sloužit státu, nikoli mu vládnout. Politické generály nahradí profesionální důstojníci. Armáda bude modernizována, depolitizována a pevně podřízena civilní moci." # todo: NEW TRANSLATION
 ALG_democratic_dividend: "Demokratická dividenda" # todo: NEW TRANSLATION
 ALG_democratic_dividend_desc: "Transparentní a demokratické Alžírsko přiláká zahraniční investice, mezinárodní partnerství a návrat diaspory. Ekonomika se diverzifikuje za hranice uhlovodíků, zatímco svět si toho povšimne." # todo: NEW TRANSLATION
 ALG_a_new_algeria: "Nové Alžírsko" # todo: NEW TRANSLATION
 ALG_a_new_algeria_desc: "Z popela starého režimu povstává nový národ. Korupční sítě jsou rozebrány. Odliv mozků se obrací. Alžírsko dokazuje, že skutečnou demokracii lze vybudovat vůlí vlastního lidu." # todo: NEW TRANSLATION
 ALG_transitional_instability: "Přechodná nestabilita" # todo: NEW TRANSLATION
 ALG_transitional_instability_desc: "Zhroucení starého řádu zanechalo mocenské vakuum. Instituce jsou slabé, ekonomika narušená a politické síly soupeří o podobu budoucnosti." # todo: NEW TRANSLATION
 ALG_economic_disruption: "Narušení ekonomiky" # todo: NEW TRANSLATION
 ALG_economic_disruption_desc: "Zabavení majetku oligarchů a restrukturalizace zkorumpovaných smluv dočasně narušily hospodářskou činnost." # todo: NEW TRANSLATION
 ALG_free_press_and_assembly: "Svobodný tisk a shromažďování" # todo: NEW TRANSLATION
 ALG_free_press_and_assembly_desc: "Nezávislé noviny vycházejí bez obav. Občané se svobodně organizují. Veřejný prostor patří lidu." # todo: NEW TRANSLATION
 ALG_diversified_economy: "Diverzifikovaná ekonomika" # todo: NEW TRANSLATION
 ALG_diversified_economy_desc: "Alžírská ekonomika překonává závislost na ropě a směřuje k průmyslu, technologiím a udržitelnému rozvoji." # todo: NEW TRANSLATION
 ALG_new_constitution_permanent: "Lidová ústava" # todo: NEW TRANSLATION
 ALG_new_constitution_permanent_desc: "Nová alžírská ústava, sepsaná volenými delegáty a ratifikovaná v lidovém referendu, zakotvuje demokratická práva, dělbu moci a právní stát." # todo: NEW TRANSLATION
 ALG_presidential_system: "Prezidentský systém" # todo: NEW TRANSLATION
 ALG_presidential_system_desc: "Alžírsko rozhodně řídí silná výkonná moc s jasnými pravomocemi a demokratickou odpovědností." # todo: NEW TRANSLATION
 ALG_parliamentary_system: "Parlamentní systém" # todo: NEW TRANSLATION
 ALG_parliamentary_system_desc: "Deliberativní systém, v němž volení zástupci diskutují, vyjednávají a budují konsenzus. Moc je rozdělena mezi strany a koalice." # todo: NEW TRANSLATION
 ALG_professional_military: "Profesionální ozbrojené síly" # todo: NEW TRANSLATION
 ALG_professional_military_desc: "Depolitizovaná, modernizovaná armáda pod civilním velením. Alžírská armáda slouží národu, místo aby ho ovládala." # todo: NEW TRANSLATION
 ALG_foreign_investment_boom: "Rozmach zahraničních investic" # todo: NEW TRANSLATION
 ALG_foreign_investment_boom_desc: "Do demokratického Alžírska proudí mezinárodní kapitál. Transparentní správa a právní stát činí ze země atraktivní investiční destinaci." # todo: NEW TRANSLATION
 ALG_beacon_of_democracy: "Maják demokracie" # todo: NEW TRANSLATION
 ALG_beacon_of_democracy_desc: "Alžírsko je živým důkazem, že skutečná demokratická proměna je možná. Národ inspiruje hnutí v celém regionu a získává obdiv celého světa." # todo: NEW TRANSLATION
 ALG_support_mujahideen: "Podpořit mudžáhidy" # todo: NEW TRANSLATION
 ALG_support_mujahideen_desc: "Části státního aparátu prosazují skrytou podporu islamistickým bojovníkům působícím v celém regionu. Takové kroky mohou posílit náš vliv mezi radikálními sítěmi a destabilizovat nepřátelské aktéry, hrozí však silná mezinárodní reakce a dlouhodobé vnitřní důsledky." # todo: NEW TRANSLATION
