 TT_ALG_DEAL_WITH_TRADE_UNIONS: "Zvýšíme názor odborů, jakmile je budeme mít jako vnitřní frakci" # todo: NEW TRANSLATION
 ALG_oil_price_collapse: "Propad cen ropy" # todo: NEW TRANSLATION
 ALG_oil_price_collapse_desc: "Náhlý pokles světových cen ropy vážně zasáhl státní příjmy Alžírska. Jelikož uhlovodíky zůstávají páteří národního hospodářství, tento propad ohrožuje stabilitu rozpočtu, měnové rezervy a sociální výdaje.\n\n§R- Příjmy státní pokladny prudce klesají§!" # todo: NEW TRANSLATION
 alg_hirak_victory_option: "Hnutí Hirak vítězí" # todo: NEW TRANSLATION
 alg_hirak_victory_option_desc: "Po letech protestů, mobilizace a občanského odporu hnutí Hirak konečně zvítězilo. Demokratické reformy nyní probíhají, stát však zůstává křehký a přechod nejistý.\n\n§G+ Reformistická legitimita§!\n§Y- Vliv hlubokého státu§!" # todo: NEW TRANSLATION
 alg_hirak_reforms_title: "Reformy vedené hnutím Hirak" # todo: NEW TRANSLATION
 alg_hirak_reforms_desc: "Vláda čelí obrovskému tlaku ulice a je nucena zavést symbolické reformy." # todo: NEW TRANSLATION
 alg_hirak_reforms_option: "Oznámit politické reformy" # todo: NEW TRANSLATION
 alg_hirak_gains_influence_tt: "§YHirak§! získává větší vliv v politické rovnováze." # todo: NEW TRANSLATION
 alg_hirak_crackdown_title: "Potlačení protestů hnutí Hirak" # todo: NEW TRANSLATION
 alg_hirak_crackdown_desc: "Režim dal přednost represím před reformami a vyslal proti demonstrantům bezpečnostní síly." # todo: NEW TRANSLATION
 alg_hirak_crackdown_option: "Použít sílu k obnovení pořádku" # todo: NEW TRANSLATION
 alg_pouvoir_crackdown_tt: "§YLe Pouvoir§! upevňuje svou moc za cenu stability." # todo: NEW TRANSLATION
 alg_health_crisis_title: "Prezidentská zdravotní krize" # todo: NEW TRANSLATION
 alg_health_crisis_desc: "Prezident Bouteflika utrpěl vážnou zdravotní příhodu, která znovu vyvolala obavy ze stárnoucího vedení a nedostatku transparentnosti v alžírské politice. Zatímco jeho nejbližší okolí trvá na tom, že bude dál vládnout, mnoho lidí i příslušníků elit začíná zpochybňovat legitimitu jeho pokračující vlády." # todo: NEW TRANSLATION
 alg_health_crisis_option_continue: "Znovu potvrdit Bouteflikovo vedení" # todo: NEW TRANSLATION
 alg_le_pouvoir_strengthens_tt: "§YLe Pouvoir§! upevňuje svou moc, protože prezidentovo okolí ho chrání před veřejnou kontrolou." # todo: NEW TRANSLATION
 maghreb_union_member: "§YPřijali náš návrh na vytvoření Maghrebské unie§!" # todo: NEW TRANSLATION
 has_power_balance_algeria: "Dokončeny alžírské volby v roce 2014" # todo: NEW TRANSLATION
 supports_brics: "Podpořit BRICS" # todo: NEW TRANSLATION
 ALG_eu_trade_agreements_desc: "Podepsat obchodní dohodu s EU, posílit naše vazby se Západem a rozvíjet naše hospodářství" # todo: NEW TRANSLATION
 ALG_join_nato_partnership_desc: "Připojit se k partnerství NATO, abychom mohli ovládnout africký region a učinit z Alžírska prvotřídní zemi" # todo: NEW TRANSLATION
 ALG_al_quwwat_al_jawwiya_al_jazaeriya: "Alžírské letectvo" # todo: NEW TRANSLATION
 ALG_al_quwwat_al_jawwiya_al_jazaeriya_desc: "Alžírské letectvo je od získání nezávislosti jedním z pilířů naší vojenské moci. Posílení leteckých schopností prostřednictvím modernizace a nákupů zajistí dominanci na obloze severní Afriky." # todo: NEW TRANSLATION
 ALG_al_jaysh_al_watani_al_shaabi: "Národní lidová armáda" # todo: NEW TRANSLATION
 ALG_al_jaysh_al_watani_al_shaabi_desc: "Národní lidová armáda je páteří obrany Alžírska. Reforma a vybavení pozemních sil zabezpečí naše území a udrží stabilitu tváří v tvář hrozbám." # todo: NEW TRANSLATION
 ALG_al_quwwat_al_bahriya_al_jazaeriya: "Alžírské námořnictvo" # todo: NEW TRANSLATION
 ALG_al_quwwat_al_bahriya_al_jazaeriya_desc: "Alžírské námořnictvo chrání naše středomořské pobřeží a námořní zájmy. Rozšíření flotily a infrastruktury umožní Alžírsku promítat svou moc a chránit životně důležité námořní trasy." # todo: NEW TRANSLATION
 ALG_al_quwwat_al_musallaha_al_jazaeriya: "Alžírské ozbrojené síly" # todo: NEW TRANSLATION
 ALG_al_quwwat_al_musallaha_al_jazaeriya_desc: "Alžírské ozbrojené síly představují spojenou sílu armády, letectva a námořnictva. Jako garant národní suverenity musí být restrukturalizovány a modernizovány, aby čelily výzvám nového století." # todo: NEW TRANSLATION
 ALG_expand_the_EFCIP: "Rozšířit EFCIP" # todo: NEW TRANSLATION
 ALG_expand_the_EFCIP_desc: "Škola výcviku komandos a parašutistů (EFCIP) v Bogharu je od roku 1963 základním kamenem výcviku alžírských speciálních sil. Rozšířením jejích zařízení, modernizací infrastruktury a zavedením pokročilých bojových programů dále posílíme schopnosti našich komand a výsadkářů. Tato investice zajistí, že si Alžírsko udrží jeden z nejúdernějších sborů speciálních sil v severní Africe." # todo: NEW TRANSLATION
 ALG_expand_conscription: "Rozšířit brannou povinnost" # todo: NEW TRANSLATION
 ALG_expand_conscription_desc: "Rozšíření branné povinnosti zvětší náš okruh vycvičených vojáků. Zajistí dostatek lidských zdrojů k obraně národa a reakci na hrozby." # todo: NEW TRANSLATION
 ALG_expand_military_infrastructure: "Rozšířit vojenskou infrastrukturu" # todo: NEW TRANSLATION
 ALG_expand_military_infrastructure_desc: "Budování nových základen, výcvikových středisek a logistických uzlů posílí naši vojenskou kapacitu. Zlepšení infrastruktury podpoří operační efektivitu." # todo: NEW TRANSLATION
 ALG_focus_on_military_morale: "Zaměřit se na vojenskou morálku" # todo: NEW TRANSLATION
 ALG_focus_on_military_morale_desc: "Vysoká morálka je pro bojovou efektivitu zásadní. Investice do péče o vojáky, vedení a ducha jednotek posílí bojového ducha." # todo: NEW TRANSLATION
 ALG_expand_artillery_units: "Rozšířit dělostřelecké jednotky" # todo: NEW TRANSLATION
 ALG_expand_artillery_units_desc: "Dělostřelectvo poskytuje na bojišti životně důležitou palebnou sílu. Zvýšení počtu dělostřeleckých jednotek posílí útočné i obranné schopnosti naší armády." # todo: NEW TRANSLATION
 ALG_an_army_of_the_masses: "Armáda mas" # todo: NEW TRANSLATION
 ALG_an_army_of_the_masses_desc: "Velká a dobře vycvičená armáda může odrazovat od agrese a chránit suverenitu. Vybudování masové armády vyžaduje odhodlání k výcviku a dostatek zdrojů." # todo: NEW TRANSLATION
 ALG_expand_the_escuela_de_condores: "Rozšířit školu Condores" # todo: NEW TRANSLATION
 ALG_expand_the_escuela_de_condores_desc: "Škola Condores cvičí elitní alžírské vojáky. Její rozšíření umožní připravit více příslušníků speciálních sil pro zvládání složitých bezpečnostních výzev." # todo: NEW TRANSLATION
 ALG_form_specops_brigades: "Vytvořit brigády speciálních sil" # todo: NEW TRANSLATION
 ALG_form_specops_brigades_desc: "Brigády speciálních sil provádějí vysoce rizikové mise vyžadující pokročilé dovednosti. Vytvoření těchto jednotek zvýší taktickou pružnost Alžírska." # todo: NEW TRANSLATION
 ALG_military_mechanization: "Mechanizace armády" # todo: NEW TRANSLATION
 ALG_military_mechanization_desc: "Mechanizace pěchoty zlepšuje pohyblivost a palebnou sílu. Tento přechod modernizuje armádu a zvyšuje její účinnost na bojišti." # todo: NEW TRANSLATION
 ALG_abolish_conscription: "Zrušit brannou povinnost" # todo: NEW TRANSLATION
 ALG_abolish_conscription_desc: "Ukončení branné povinnosti převede armádu na profesionální dobrovolnickou sílu. To může zlepšit její kvalitu, ale sníží dostupnost živé síly." # todo: NEW TRANSLATION
 ALG_quality_over_quantity: "Kvalita místo kvantity" # todo: NEW TRANSLATION
 ALG_quality_over_quantity_desc: "Zaměření na menší, lépe vybavené síly zvyšuje bojovou efektivitu. Výcvik a moderní vybavení mají přednost před pouhými počty." # todo: NEW TRANSLATION
 ALG_a_cost_effective_army: "Nákladově efektivní armáda" # todo: NEW TRANSLATION
 ALG_a_cost_effective_army_desc: "Udržování štíhlé a efektivní armády zajišťuje fiskální odpovědnost. Chytré rozpočtování nám umožní vyvážit obranné potřeby s hospodářskou realitou." # todo: NEW TRANSLATION
 ALG_modernizing_our_equipment: "Modernizovat naše vybavení" # todo: NEW TRANSLATION
 ALG_modernizing_our_equipment_desc: "Modernizace zbraní a výstroje udrží naše síly konkurenceschopné. Moderní vybavení zlepšuje přežití i bojovou sílu." # todo: NEW TRANSLATION
 ALG_develop_algerian_military_industry: "Rozvinout alžírský vojenský průmysl" # todo: NEW TRANSLATION
 ALG_develop_algerian_military_industry_desc: "Vybudování domácího zbrojního průmyslu sníží závislost na dovozu. Posílí suverenitu a vytvoří pracovní místa." # todo: NEW TRANSLATION
 ALG_cooperate_with_foreign_arms_companies: "Spolupracovat se zahraničními zbrojovkami" # todo: NEW TRANSLATION
 ALG_cooperate_with_foreign_arms_companies_desc: "Partnerství s mezinárodními zbrojními firmami urychlí transfer technologií. Tato spolupráce zlepší naše vojenské schopnosti." # todo: NEW TRANSLATION
 ALG_tackle_military_corruption: "Vypořádat se s vojenskou korupcí" # todo: NEW TRANSLATION
 ALG_tackle_military_corruption_desc: "Korupce podkopává vojenskou efektivitu a morálku. Rozsáhlé reformy a dohled obnoví důvěru a disciplínu." # todo: NEW TRANSLATION
 ALG_elite_officer_training: "Výcvik elitních důstojníků" # todo: NEW TRANSLATION
 ALG_elite_officer_training_desc: "Vysoce schopní důstojníci jsou klíčem k úspěchu na bojišti. Specializované výcvikové programy budují vůdčí a strategické schopnosti." # todo: NEW TRANSLATION
 ALG_an_army_for_the_future: "Armáda pro budoucnost" # todo: NEW TRANSLATION
 ALG_an_army_for_the_future_desc: "Musíme připravit armádu na budoucí hrozby a technologie. Ústředními prvky této vize jsou inovace a přizpůsobivost." # todo: NEW TRANSLATION
 ALG_purchase_american_aircraft: "Nakoupit americká letadla" # todo: NEW TRANSLATION
 ALG_purchase_american_aircraft_desc: "Nákup letadel ze Spojených států poskytne pokročilé technologie a osvědčenou spolehlivost. Posílí to naše letecké schopnosti." # todo: NEW TRANSLATION
 ALG_purchase_chinese_aircraft: "Nakoupit čínská letadla" # todo: NEW TRANSLATION
 ALG_purchase_chinese_aircraft_desc: "Čínská letadla nabízejí cenově efektivní možnosti a stále vyspělejší technologie. Diverzifikace dodavatelů rozšíří strategická partnerství." # todo: NEW TRANSLATION
 ALG_purchase_russian_aircraft: "Nakoupit ruská letadla" # todo: NEW TRANSLATION
 ALG_purchase_russian_aircraft_desc: "Ruská letadla přinášejí robustní konstrukci a vysoký výkon. Spolupráce zvýší všestrannost našeho letectva." # todo: NEW TRANSLATION
 ALG_improve_air_defense_infrastructure: "Zlepšit infrastrukturu protivzdušné obrany" # todo: NEW TRANSLATION
 ALG_improve_air_defense_infrastructure_desc: "Posílení systémů protivzdušné obrany chrání klíčová aktiva a populační centra. Modernizace sníží zranitelnost vůči leteckým hrozbám." # todo: NEW TRANSLATION
 ALG_close_air_support: "Blízká letecká podpora" # todo: NEW TRANSLATION
 ALG_close_air_support_desc: "Blízká letecká podpora zvyšuje účinnost pozemních sil během boje. Integrace leteckých a pozemních operací je pro úspěch na bojišti nezbytná." # todo: NEW TRANSLATION
 ALG_a_new_world_class_academy: "Nová akademie světové úrovně" # todo: NEW TRANSLATION
 ALG_a_new_world_class_academy_desc: "Založení vojenské akademie světové úrovně připraví budoucí vůdce. Tato instituce nastaví standardy excelence." # todo: NEW TRANSLATION
 ALG_dominate_the_skies: "Ovládnout oblohu" # todo: NEW TRANSLATION
 ALG_dominate_the_skies_desc: "Dosažení vzdušné převahy je v moderní válce zásadní. Budeme investovat do kontroly našeho vzdušného prostoru a podpory všech vojenských operací." # todo: NEW TRANSLATION
 ALG_might_of_the_sky: "Síla oblohy" # todo: NEW TRANSLATION
 ALG_might_of_the_sky_desc: "Naše letecká síla symbolizuje národní sílu a technologický pokrok. Udržování mocného letectva odrazuje agresi." # todo: NEW TRANSLATION
 ALG_naval_military_police: "Námořní vojenská policie" # todo: NEW TRANSLATION
 ALG_naval_military_police_desc: "Námořní vojenská policie udržuje disciplínu a bezpečnost na plavidlech a základnách. Zajišťuje pořádek a účinné operace." # todo: NEW TRANSLATION
 ALG_expand_the_naval_academy: "Rozšířit námořní akademii" # todo: NEW TRANSLATION
 ALG_expand_the_naval_academy_desc: "Rozšířená námořní akademie vycvičí více důstojníků a námořníků. Tato investice vybuduje profesionální a schopné námořní síly." # todo: NEW TRANSLATION
 ALG_return_to_the_sea: "Návrat na moře" # todo: NEW TRANSLATION
 ALG_return_to_the_sea_desc: "Obnovení přístupu k Tichému oceánu je historickým cílem Alžírska. Rozvoj námořní přítomnosti je pro tuto ambici zásadní." # todo: NEW TRANSLATION
 ALG_algerian_marine_forces: "Alžírské námořní pěchotní síly" # todo: NEW TRANSLATION
 ALG_algerian_marine_forces_desc: "Námořní pěchota poskytuje schopnosti rychlé reakce a zkušenosti s obojživelnými operacemi. Její rozšíření zvýší operační dosah Alžírska." # todo: NEW TRANSLATION
 ALG_quick_strikes: "Rychlé údery" # todo: NEW TRANSLATION
 ALG_quick_strikes_desc: "Rychlé a rozhodné údery mohou protivníky zahltit. Rozvoj těchto sil zvýší taktickou pružnost." # todo: NEW TRANSLATION
 ALG_invest_into_shipbuilding: "Investovat do stavby lodí" # todo: NEW TRANSLATION
 ALG_invest_into_shipbuilding_desc: "Vybudování domácího loďařského průmyslu podpoří rozšíření námořnictva i hospodářský růst. Toto odvětví je pro dlouhodobou obranu strategické." # todo: NEW TRANSLATION
 ALG_djebel_chenoua: "Djebel Chenoua" # todo: NEW TRANSLATION
 ALG_djebel_chenoua_desc: "Vytvoření mocné flotily projeví sílu a ochrání národní zájmy. Djebel Chenoua je symbolem námořní suverenity." # todo: NEW TRANSLATION
 ALG_masters_of_the_mediterranean: "Páni Středomoří" # todo: NEW TRANSLATION
 ALG_masters_of_the_mediterranean_desc: "Ovládnutí středomořských vod zajistí obchodní trasy a strategické výhody. Alžírsko musí usilovat o postavení klíčového hráče v tomto regionu." # todo: NEW TRANSLATION
 ALG_focus_on_mass_assault_tactics: "Zaměřit se na taktiku masového útoku" # todo: NEW TRANSLATION
 ALG_focus_on_mass_assault_tactics_desc: "Taktika masového útoku klade důraz na zdrcení nepřátelských sil velkou koncentrací vojsk. Tato strategie závisí na lidské síle a koordinaci." # todo: NEW TRANSLATION
 ALG_licence_mir: "Nákup licence na Mirage" # todo: NEW TRANSLATION
 ALG_licence_mir_desc: "Máme všechny prostředky k výrobě francouzských letadel, a proto musíme požádat o licenci na jejich výrobu" # todo: NEW TRANSLATION
 ALG_purchase_russian_su30: "Nakoupit ruské Su-30" # todo: NEW TRANSLATION
 ALG_purchase_russian_su30_desc: "Jako regionální mocnost musíme chránit své rozsáhlé hranice a promítat vliv napříč Maghrebem a Sahelem. Naše vojenské velení označilo legendární ruský Su-30 za ideální platformu k výraznému posílení vzdušné převahy. Tento nákup by nejen posílil naši flotilu a sjednotil logistiku, ale také nám poskytl rozhodující okamžitou výhodu, přestože nepochybně přitáhne značnou mezinárodní pozornost." # todo: NEW TRANSLATION
 alg_politics.50.t: "Úmrtí generála Smaïna Lamariho" # todo: NEW TRANSLATION
 alg_politics.50.d: "Generál Smaïn Lamari, vedoucí obávané kontrarozvědné větve DRS, zemřel. Jeho náhlá smrt zanechává v hlubokém státě Alžírska mocenské vakuum, zatímco soupeři manévrují, aby získali jeho bývalý vliv." # todo: NEW TRANSLATION
 alg_politics.50.a: "Stín starého režimu mizí." # todo: NEW TRANSLATION
 ALG_black_decade_threat: "Obnovení metod Černé dekády" # todo: NEW TRANSLATION
 ALG_2001_title: "Povýšení Fatimy Boudouani" # todo: NEW TRANSLATION
 ALG_2001_desc: "V rámci reformní obnovy prezidenta Boutefliky se Fatima Boudouani stává první alžírskou generálkou. Její povýšení znamená začátek nové éry pro ženy v ozbrojených silách, posiluje morálku a signalizuje modernizaci." # todo: NEW TRANSLATION
 ALG_2001_a: "Historický krok pro armádu." # todo: NEW TRANSLATION
 ALG_2002_title: "Povýšení Fatimy Zohry Ardjoune" # todo: NEW TRANSLATION
 ALG_2002_desc: "Po průkopnickém vzestupu Fatimy Boudouani je Fatima Zohra Ardjoune nyní povýšena do hodnosti generála. Jako první generálka v alžírském zdravotnickém sboru její jmenování odráží opatrné kroky Alžírska směrem k začlenění žen do armády." # todo: NEW TRANSLATION
 ALG_2002_a: "Další překážka je prolomena." # todo: NEW TRANSLATION
 alg_reform.1.t: "Šance na skutečnou reformu" # todo: NEW TRANSLATION
 alg_reform.1.d: "Po iniciativě „Lidem, pro lidi“ má Alžírsko vzácnou příležitost zvolit vůdce odhodlaného k opravdové reformě. Objevili se tři kandidáti, z nichž každý slibuje jinou cestu ke stabilizaci a modernizaci země. Rozhodnutí nyní spočívá na lidu." # todo: NEW TRANSLATION
 alg_reform.1.a: "Ahmed Benbitour – technokratický reformátor" # todo: NEW TRANSLATION
 alg_benbitour_desc: "Ahmed Benbitour je technokrat zaměřený na administrativní efektivitu a hospodářskou modernizaci. Jeho umírněný přístup má za cíl vybudovat dlouhodobou stabilitu a reformovat státní instituce." # todo: NEW TRANSLATION
 alg_reform.1.b: "Soufiane Djilali – charismatický reformátor" # todo: NEW TRANSLATION
 alg_djilali_desc: "Soufiane Djilali je reformní opoziční vůdce zdůrazňující sociální a politické reformy. Charismatický a odhodlaný se snaží posílit demokratické instituce a účast veřejnosti." # todo: NEW TRANSLATION
 alg_reform.1.c: "Rachid Nekkaz – populistický aktivista" # todo: NEW TRANSLATION
 alg_nekkaz_desc: "Rachid Nekkaz je populistický aktivista, který se obrací přímo na lid. Jeho popularita je vysoká, avšak jeho konfrontační styl by mohl v křehkém politickém prostředí způsobit nestabilitu." # todo: NEW TRANSLATION
 ALG_citizens_constitution: "Ústava občanů" # todo: NEW TRANSLATION
 ALG_justice_for_the_people: "Spravedlnost pro lid" # todo: NEW TRANSLATION
 ALG_free_press_free_people: "Svobodný tisk, svobodný lid" # todo: NEW TRANSLATION
 ALG_economic_transparency: "Hospodářská transparentnost" # todo: NEW TRANSLATION
 ALG_citizens_constitution_desc: "Sepište novou ústavu, která zaručí základní práva a posílí demokratické instituce." # todo: NEW TRANSLATION
 ALG_justice_for_the_people_desc: "Reformujte soudnictví, aby bylo nezávislé, spravedlivé a chráněné před politickými zásahy." # todo: NEW TRANSLATION
 ALG_free_press_free_people_desc: "Zaručte svobodu tisku, aby média mohla volat držitele moci k odpovědnosti a informovat občany." # todo: NEW TRANSLATION
 ALG_economic_transparency_desc: "Zaveďte transparentní rozpočtovou a fiskální politiku s cílem bojovat proti korupci a zvýšit důvěru veřejnosti." # todo: NEW TRANSLATION
 ALG_true_reformist_path_tt: "Tato cesta umožní Alžírsku zvolit skutečně reformního vůdce, zvýšit podporu demokracie a stabilitu a zahájit politické a hospodářské reformy pro lid." # todo: NEW TRANSLATION
 algeria_news.3_tt: "Bouteflikův mírový program dává Alžírsku naději a zlepšuje stabilitu i podporu demokracie." # todo: NEW TRANSLATION
 algeria_news.7_tt: "Odpor proti „le pouvoir“ získává podporu veřejnosti, čímž posiluje demokratický vliv a politický kapitál." # todo: NEW TRANSLATION
 algeria_news.1_tt: "Armáda po přijetí mimořádných opatření upevňuje kontrolu. Stabilita mírně klesá, ale podpora války a politická moc rostou." # todo: NEW TRANSLATION
 algeria_news.4_tt: "Bouteflikovo úsilí o usmíření posiluje národní stabilitu a podporu demokracie." # todo: NEW TRANSLATION
 algeria_news.8.t: "Oběti Černé dekády" # todo: NEW TRANSLATION
 algeria_news.8.d: "Občanská válka v 90. letech zanechala stovky tisíc obětí: zmizelé, vdovy, sirotky i ty, kteří trpěli mučením a terorem. Zatímco Alžírsko usiluje o usmíření, vyvstává otázka: jak by měl stát reagovat na požadavky spravedlnosti a uznání?" # todo: NEW TRANSLATION
 algeria_news.8.a: "Odškodnit rodiny a oběti" # todo: NEW TRANSLATION
 algeria_news.8.b: "Nabídnout pouze symbolické uznání" # todo: NEW TRANSLATION
 algeria_news.8.c: "Nemůžeme setrvávat v minulosti" # todo: NEW TRANSLATION
 algeria_news.8_a_tt: "§YNákladné odškodňovací programy§! zlepší stabilitu a posílí legitimitu Alžírska, ale zatíží státní pokladnu." # todo: NEW TRANSLATION
 algeria_news.8_b_tt: "§YSymbolické uznání§! zlepší stabilitu za obrovskou politickou cenu, ale některé požadavky zůstanou nesplněny." # todo: NEW TRANSLATION
 algeria_news.8_c_tt: "§YIgnorování požadavků obětí§! nyní ušetří zdroje, ale sníží stabilitu a podnítí nespokojenost." # todo: NEW TRANSLATION
 algeria_news.10.t: "Cesta k obnově" # todo: NEW TRANSLATION
 algeria_news.10.d: "Po skončení občanského konfliktu čelí Alžírsko obrovské výzvě obnovy zničeného hospodářství. Továrny stojí, infrastruktura je poškozená a nezaměstnanost zůstává nebezpečně vysoká. Přesto se po letech poprvé objevuje naděje, že rekonstrukce a reformy mohou obnovit prosperitu a stabilitu." # todo: NEW TRANSLATION
 algeria_news.10.a: "Obnova začíná!" # todo: NEW TRANSLATION
 algeria_news.10_a_tt: "§YByly učiněny první kroky k oživení alžírského hospodářství.§! Tím se otevírá cesta k hlubším reformám infrastruktury, průmyslu a financí." # todo: NEW TRANSLATION
 algeria_news.11.t: "Mise Organizace spojených národů pro poskytování pomoci" # todo: NEW TRANSLATION
 algeria_news.11.d: "Zástupci Organizace spojených národů dorazili do Alžíru s nabídkou hospodářské pomoci a podpory rekonstrukce. Jejich programy by mohly přinést cenné prostředky, odborné znalosti a humanitární pomoc, mnozí členové vlády však varují, že přijetí takové pomoci může přizvat zahraniční vměšování do vnitřních záležitostí Alžírska." # todo: NEW TRANSLATION
 algeria_news.11.a: "Přijmout misi OSN" # todo: NEW TRANSLATION
 algeria_news.11_a_tt: "§GObdržíme mezinárodní finanční pomoc a technickou podporu.§! \n§RTo však zvýší americký, francouzský a britský vliv v Alžírsku.§!" # todo: NEW TRANSLATION
 algeria_news.11.b: "Odmítnout zahraniční vměšování" # todo: NEW TRANSLATION
 algeria_news.11_b_tt: "§ROdmítáme dohled OSN a obnovíme se vlastními silami.§! \n§YTo zachová naši suverenitu, ale zpomalí hospodářský růst.§!" # todo: NEW TRANSLATION
 algeria_news.20.t: "Přehodnocení zahraniční politiky Alžírska" # todo: NEW TRANSLATION
 algeria_news.20.d: "S koncem občanského konfliktu a probíhající křehkou obnovou Alžírska zahájilo vedení v Alžíru komplexní přezkum zahraniční politiky země. Rozhodnutí učiněná v příštích letech určí, zda posílíme vztahy se starými spojenci, budeme hledat nová partnerství, nebo si zachováme nezávislost ve stále polarizovanějším světě. Debata začala a Alžírsko si brzy bude muset zvolit svůj směr." # todo: NEW TRANSLATION
 algeria_news.20.a: "Budoucnost Alžírska čeká." # todo: NEW TRANSLATION
 algeria_news.20_tt: "§YTo znamená začátek větve zahraniční politiky Alžírska.§!" # todo: NEW TRANSLATION
 ALG_between_east_and_west_tt: "Alžírsko usiluje o vyvážení vztahů mezi Východem a Západem a zároveň prosazuje nezúčastněnou zahraniční politiku." # todo: NEW TRANSLATION
 ALG_mediate_great_power_conflict_tt: "Alžírsko aktivně zprostředkovává mezi světovými mocnostmi a buduje si pověst neutrálního mírotvůrce." # todo: NEW TRANSLATION
 ALG_secure_balance_tt: "Alžírsko posiluje své nezúčastněné postavení a zajišťuje stabilní rovnováhu mezi hlavními světovými mocnostmi." # todo: NEW TRANSLATION
 alg_news_non_aligned.1.t: "Rovnováha mezi Východem a Západem" # todo: NEW TRANSLATION
 alg_news_non_aligned.1.d: "Alžírsko začalo opatrně hledat cestu mezi hlavními světovými mocnostmi a snaží se zachovat svou nezávislost, přičemž diplomaticky jedná s Východem i Západem." # todo: NEW TRANSLATION
 alg_news_non_aligned.1.a: "Alžírsko hledá rovnováhu" # todo: NEW TRANSLATION
 alg_news_non_aligned.2.t: "Zprostředkování globálního napětí" # todo: NEW TRANSLATION
 alg_news_non_aligned.2.d: "Alžírsko vystoupilo jako prostředník při zmírňování napětí mezi velmocemi a snaží se posílit své mezinárodní postavení neutrálního mírotvůrce." # todo: NEW TRANSLATION
 alg_news_non_aligned.2.a: "Zprostředkování je v plném proudu" # todo: NEW TRANSLATION
 alg_news_non_aligned.3.t: "Podpora regionálního usmíření" # todo: NEW TRANSLATION
 alg_news_non_aligned.3.d: "Alžírsko zahájilo řadu diplomatických iniciativ s cílem smířit regionální mocnosti a usiluje o stabilitu a spolupracující partnerství." # todo: NEW TRANSLATION
 alg_news_non_aligned.3.a: "Úsilí o usmíření" # todo: NEW TRANSLATION
 alg_news_non_aligned.4.t: "Zajištění nezúčastněné rovnováhy" # todo: NEW TRANSLATION
 alg_news_non_aligned.4.d: "Alžírsko upevnilo své nezúčastněné postavení a pečlivě udržuje vztahy s velmocemi, aniž by se plně připojilo k některému bloku." # todo: NEW TRANSLATION
 alg_news_non_aligned.4.a: "Rovnováha zajištěna" # todo: NEW TRANSLATION
 alg_news_non_aligned.5.t: "Obnova Hnutí nezúčastněných zemí" # todo: NEW TRANSLATION
 alg_news_non_aligned.5.d: "Alžírsko podniklo kroky k oživení své účasti v Hnutí nezúčastněných zemí a znovu prosazuje své vedoucí postavení a diplomatický vliv mezi neutrálními státy." # todo: NEW TRANSLATION
 alg_news_non_aligned.5.a: "Vliv HNZ obnoven" # todo: NEW TRANSLATION
 alg_news_non_aligned.6.t: "Podpora rozvojového světa" # todo: NEW TRANSLATION
 alg_news_non_aligned.6.d: "Alžírsko zahájilo rozsáhlou diplomatickou a hospodářskou spolupráci s rozvojovými zeměmi, podporuje stabilitu a spolupráci a zároveň zvyšuje svůj vliv na kontinentu." # todo: NEW TRANSLATION
 alg_news_non_aligned.6.a: "Spolupráce zahájena" # todo: NEW TRANSLATION
 algeria_news.9.t: "Odkaz Černé dekády" # todo: NEW TRANSLATION
 algeria_news.9.d: "Občanská válka zanechala v Alžírsku hluboké jizvy. Vláda musí rozhodnout, jak minulost interpretovat, určit vinu a nasměrovat budoucnost národa." # todo: NEW TRANSLATION
 algeria_news.9.a: "Podpořit vojenský režim" # todo: NEW TRANSLATION
 algeria_news.9.b: "Postavit se na stranu obětí a chudých" # todo: NEW TRANSLATION
 algeria_news.9.c: "Obvinit vnější aktéry" # todo: NEW TRANSLATION
 algeria_news.9.dd: "Oficiálně vymazat a potlačit veškeré diskuse" # todo: NEW TRANSLATION
 ALG_promote_reconciliation_tt: "§GPodpora usmíření:§!\n• Zlepšení vztahů se sousedy\n• Snížení regionálního napětí\n• Otevření diplomatických kanálů" # todo: NEW TRANSLATION
 alg_mufti.2.t: "Kterou cestou se vydá islámský stát?" # todo: NEW TRANSLATION
 alg_mufti.2.d: "Nyní, když byl islám prohlášen za vůdčí princip národa, musíme rozhodnout, který směr určí naši cestu. Islámské renesanční hnutí (Nahda) vedené Abdallahem Djaballahem volá po umírněné a strukturované islamistické vizi prostřednictvím voleb. Jiní však vzhlížejí k ulemům a charismatickým kazatelům, kteří slibují přímější a nekompromisnější podobu islámské autority." # todo: NEW TRANSLATION
 alg_mufti.2.a: "Posílit Islámské renesanční hnutí (Nahda)" # todo: NEW TRANSLATION
 alg_mufti.2.a.tt: "Nahda vedená Djaballahem se stává vedoucí silou islámské politiky." # todo: NEW TRANSLATION
 alg_mufti.2.b: "Vložit autoritu do rukou ulemů" # todo: NEW TRANSLATION
 alg_mufti.2.b.tt: "Později rozhodneme, zda budeme následovat kontroverzního kazatele, nebo vládou schváleného muftího." # todo: NEW TRANSLATION
 alg_mufti.3.t: "Tvář ulemů" # todo: NEW TRANSLATION
 alg_mufti.3.d: "Po potvrzení autority ulemů musí vláda rozhodnout, kdo bude tento proud zastupovat ve vedení. Cheikh Bouamrane je umírněný a přijatelný pro stát i armádu, zatímco Ali Belhadj zůstává radikálním a ohnivým hlasem, který inspiruje podporu veřejnosti, ale riskuje střet s úřady." # todo: NEW TRANSLATION
 alg_mufti.3.a: "Podpořit Belhadje" # todo: NEW TRANSLATION
 alg_mufti.3.a.tt: "Ali Belhadj se stane vůdcem a bude zastupovat tvrdou salafistickou frakci." # todo: NEW TRANSLATION
 alg_mufti.3.b: "Podpořit Bouamrana" # todo: NEW TRANSLATION
 alg_mufti.3.b.tt: "Cheikh Bouamrane se stane vůdcem a bude zastupovat umírněný, státu nakloněný proud ulemů.\n§RNedostupné po květnu 2016.§!" # todo: NEW TRANSLATION
 ALG_ennahda: "Podpořit Ennahdu" # todo: NEW TRANSLATION
 ALG_ennahda_desc: "Podpoříme Abdallaha Djaballaha a Islámské renesanční hnutí a začleníme islamistickou politiku do našich státních institucí." # todo: NEW TRANSLATION
 ALG_independent: "Nezávislí ulemové" # todo: NEW TRANSLATION
 ALG_independent_desc: "Posílíme nezávislost ulemů a svěříme náboženským učencům autoritu nad duchovními záležitostmi a případně i nad vedením státu." # todo: NEW TRANSLATION
 ALG_grand_mufti_rule: "Velký muftí vládne" # todo: NEW TRANSLATION
 ALG_grand_mufti_rule_desc: "Ulemové nebo politické islamistické hnutí poskytnou vůdčí autoritu alžírskému státu. Zvolená cesta určí, kdo se stane tváří islámské autority." # todo: NEW TRANSLATION
 ALG_nahda_path: "Zvolena cesta Nahdy" # todo: NEW TRANSLATION
 ALG_ulema_path: "Zvolena cesta ulemů" # todo: NEW TRANSLATION
 ALG_belhadj_leader: "Ali Belhadj je vůdcem" # todo: NEW TRANSLATION
 ALG_bouamrane_leader: "Cheikh Bouamrane je vůdcem" # todo: NEW TRANSLATION
 ALG_maintaining_kabyle_relations: "Automatizace zlepšování vztahů s Kabýlií" # todo: NEW TRANSLATION
 ALG_constitution_1996: "Ústava z roku 1996" # todo: NEW TRANSLATION
 ALG_constitution_1996_desc: "Revidovaná ústava z roku 1996 měla po otřesech Černé dekády stabilizovat Alžírsko. Mnohá ustanovení však byla vytvořena s ohledem na přežití režimu, nikoli na skutečnou demokratizaci. Její rigidní sekulární rámec považovaly velké části islamistického hnutí za nelegitimní a „neislámský“. Přestože upevňuje státní kontrolu a posiluje prezidentský úřad, zároveň omezuje politickou účast, snižuje důvěru mezi vládou a společností a brzdí dlouhodobé reformy. Odkaz této ústavy nadále silně zatěžuje stabilitu a legitimitu Alžírska." # todo: NEW TRANSLATION
 ALG_enahda_media_network_idea: "Mediální síť Ennahdy" # todo: NEW TRANSLATION
 ALG_enahda_media_network_idea_desc: "Hnutí Ennahda založilo vlastní média, aby šířilo své poselství a mobilizovalo podporu veřejnosti. Tato média propagují nábožensky inspirované hodnoty a zároveň kritizují selhání režimu.\n\n§YTento národní duch bude odstraněn, pokud nebudeme spojeni s Ennahdou§!" # todo: NEW TRANSLATION
 ALG_supreme_islamic_council_idea: "Nejvyšší islámská rada" # todo: NEW TRANSLATION
 ALG_supreme_islamic_council_idea_desc: "Byla ustavena poradní rada složená z předních ulemů a islámských učenců, která má vést státní politiku podle náboženských zásad. Přestože nemá přímou moc, její vliv na legislativu a veřejný život je významný.\n\n§YTento národní duch bude odstraněn, pokud nebudeme salafisté nebo islamisté§!" # todo: NEW TRANSLATION
 alg_constitution.1.t: "Ústava je reformována" # todo: NEW TRANSLATION
 alg_constitution.1.d: "Po letech sporů byla ústava z roku 1996 revidována. Nový rámec odstraňuje některá z nejautoritářštějších ustanovení, zavádí kontrolní mechanismy výkonné moci a snaží se vytvořit lepší rovnováhu mezi alžírskými islámskými a sekulárními proudy. Mnozí to považují za nezbytný krok k usmíření, jiní však pochybují, zda reformy skutečně změní zakořeněný systém le pouvoir." # todo: NEW TRANSLATION
 alg_constitution.1.a: "Přijmout novou ústavu" # todo: NEW TRANSLATION
 alg_constitution.1.a.tt: "Nahrazuje §Yústavu z roku 1996§! §Yreformovanou ústavou§!, která poskytuje bonusy ke stabilitě, politické moci a hospodářskému růstu." # todo: NEW TRANSLATION
 ALG_ali_belhadj_desc: "Ali Belhadj, spoluzakladatel Islámské fronty spásy (FIS), byl jedním z nejcharismatičtějších a nejradikálnějších islamistických vůdců bouřlivých 90. let v Alžírsku. Proslul svými ohnivými kázáními, nekompromisní rétorikou a odmítáním sekulární politiky a stal se symbolem odporu vůči režimu FLN. Po většinu občanské války byl vězněn a ústava z roku 1996 mu zakázala formální politickou činnost. Belhadj zůstává polarizující postavou: pro některé ztělesňuje islamistickou křivdu, pro jiné je nebezpečnou připomínkou Černé dekády. Jeho případný návrat na politickou scénu vyvolává naděje na usmíření i obavy z obnovení extremismu." # todo: NEW TRANSLATION
 ALG_bouamrane_desc: "Mohamed Bouamrane se v 90. letech objevil jako umírněnější islamistický intelektuál a politický aktér. Prosazoval dialog namísto konfrontace a zaujal pozici mezi radikálními islamisty, jako byl Ali Belhadj, a zakořeněnou elitou FLN. Přestože nikdy nedosáhl stejné masové přitažlivosti jako vedení FIS, Bouamrane se stal respektovanou osobností poválečných debat o usmíření a ústavní reformě. Jeho vize zdůrazňovala Alžírsko, v němž mohou islámské hodnoty koexistovat s demokratickými institucemi, čímž se stal mostem v napjaté rovnováze mezi sekulární a náboženskou politikou." # todo: NEW TRANSLATION
 algeria_elections.2024.t: "Prezidentské volby 2024" # todo: NEW TRANSLATION
 algeria_elections.2024.d: "Alžírsko vstupuje do dalších klíčových voleb. Tři přední osobnosti představují odlišné cesty: Abdelmadjid Tebboune slibuje kontinuitu pod vedením FLN; Soufiane Djilali Aouchiche prosazuje demokratickou reformu a liberální modernizaci; a Abdelali Hassani, podporovaný islamistickými proudy, usiluje o větší úlohu náboženství v politice. Výsledky odrážejí rozložení moci mezi jednotlivými frakcemi." # todo: NEW TRANSLATION
 algeria_elections.2024.a: "Abdelmadjid Tebboune zajišťuje znovuzvolení." # todo: NEW TRANSLATION
 algeria_elections.2024.b: "Youcef Aouchiche vítězí v prezidentských volbách." # todo: NEW TRANSLATION
 algeria_elections.2024.c: "Abdelali Hassani povstává s podporou islamistů." # todo: NEW TRANSLATION
 ALG_tebboune_2024_tt: "§YAbdelmadjid Tebboune§! zůstává prezidentem s dominantním postavením FLN." # todo: NEW TRANSLATION
 ALG_aouchiche_2024_tt: "§YYoucef Aouchiche§! se stává prezidentem a vede reformní liberály." # todo: NEW TRANSLATION
 ALG_hassani_2024_tt: "§YAbdelali Hassani§! se stává prezidentem s podporou islamistických hnutí." # todo: NEW TRANSLATION
 algeria_gspc.1.t: "Nabil Sahraoui přebírá vedení GSPC" # todo: NEW TRANSLATION
 algeria_gspc.1.d: "Uvnitř Salafistické skupiny pro kázání a boj (GSPC) vzrostla nespokojenost. Mnozí velitelé obvinili Hassana Hattaba ze slabosti a kritizovali jeho váhání s rozpoutáním totálního džihádu. V polovině roku 2003 Hattaba odstavili jeho vlastní muži a Nabil Sahraoui, mnohem radikálnější postava, se prohlásil novým emírem GSPC." # todo: NEW TRANSLATION
 algeria_gspc.1.a: "Povstání se dále radikalizuje." # todo: NEW TRANSLATION
 ALG_sahraoui_rise_tt: "§YNabil Sahraoui§! nahrazuje Hassana Hattaba ve funkci nového vůdce GSPC." # todo: NEW TRANSLATION
 algeria_gspc.2.t: "Sahraoui zabit, objevuje se Droukdel" # todo: NEW TRANSLATION
 algeria_gspc.2.d: "V červnu 2004 zabily alžírské bezpečnostní síly Nabila Sahraouiho při střetu. Jeho smrt však povstání neoslabila; vedení převzal Abdelmalek Droukdel, ambiciózní stratég s vazbami na globální síť al-Káidy. Pod jeho vedením GSPC pravděpodobně rozšíří a internacionalizuje svůj džihád." # todo: NEW TRANSLATION
 algeria_gspc.2.a: "Začíná ještě krvavější éra." # todo: NEW TRANSLATION
 ALG_droukdel_rise_tt: "§YAbdelmalek Droukdel§! se stává vůdcem GSPC." # todo: NEW TRANSLATION
 algeria_gspc.3.t: "Hassan Hattab se vzdává" # todo: NEW TRANSLATION
 algeria_gspc.3.d: "Po letech na útěku se zakladatel GSPC Hassan Hattab vzdal alžírským úřadům. Hattab, rozčarovaný směrem hnutí, které kdysi založil, přijal vládní program amnestie. Přestože jeho vliv zeslábl, jeho kapitulace představuje symbolické vítězství alžírského státu." # todo: NEW TRANSLATION
 algeria_gspc.3.a: "Symbol porážky povstání." # todo: NEW TRANSLATION
 ALG_hattab_surrender_tt: "§YHassan Hattab§! se vzdává, čímž omezuje činnost povstalců." # todo: NEW TRANSLATION
 alg_generals.1.t: "Abdelkader Lounès jmenován velitelem letectva" # todo: NEW TRANSLATION
 alg_generals.1.d: "Generál Abdelkader Lounès byl jmenován velitelem alžírského letectva. Je známý svým zaměřením na modernizaci a v nadcházejícím desetiletí bude dohlížet na rozvoj alžírské vzdušné síly." # todo: NEW TRANSLATION
 alg_generals.1.a: "Naše nebe je v bezpečných rukou." # todo: NEW TRANSLATION
 alg_generals.2.t: "Amar Amrani přebírá velení protivzdušné obrany" # todo: NEW TRANSLATION
 alg_generals.2.d: "Generálmajor Amar Amrani byl pověřen velením alžírských sil pozemní protivzdušné obrany. Jeho vedení posílí schopnost Alžírska chránit svůj vzdušný prostor před zahraničními hrozbami." # todo: NEW TRANSLATION
 alg_generals.2.a: "Naše protivzdušná obrana sílí." # todo: NEW TRANSLATION
 alg_generals.3.t: "Menad Nouba se stává velitelem četnictva" # todo: NEW TRANSLATION
 alg_generals.3.d: "Generál Menad Nouba byl jmenován velitelem alžírského národního četnictva. Jeho vedení, zaměřené na vnitřní bezpečnost a protipovstalecký boj, bude klíčové pro udržení domácího pořádku." # todo: NEW TRANSLATION
 alg_generals.3.a: "Pevná ruka pro bezpečnost Alžírska." # todo: NEW TRANSLATION
 ALG_ouyahia_pm: "Ahmed Ouyahia jako předseda vlády" # todo: NEW TRANSLATION
 ALG_belkhadem_pm: "Abdelaziz Belkhadem jako předseda vlády" # todo: NEW TRANSLATION
 ALG_interim_president.1.t: "Vyhlášeno prozatímní prezidentství" # todo: NEW TRANSLATION
 ALG_interim_president.1.d: "Po Bouteflikově rezignaci čelí Alžírsko mocenskému vakuu. Na základě ústavního mandátu skládá Abdelkader Bensalah, předseda horní komory, přísahu jako prozatímní prezident na 90 dní. Hirak toto jmenování odmítá a považuje ho za součást téhož zkorumpovaného systému." # todo: NEW TRANSLATION
 ALG_interim_president.1.a: "Jmenovat Abdelkadera Bensalaha" # todo: NEW TRANSLATION
 ALG_bouteflika_resigns.1.t: "Bouteflika rezignuje" # todo: NEW TRANSLATION
 ALG_bouteflika_resigns.1.d: "Pod obrovským tlakem několika týdnů protestů Hiraku a poté, co vojenské vedení stáhlo svou podporu, prezident Abdelaziz Bouteflika formálně rezignoval. Jeho dvě desetiletí trvající prezidentství skončilo a budoucnost Alžírska zůstává nejistá." # todo: NEW TRANSLATION
 ALG_bouteflika_resigns.1.a: "Éra Boutefliky skončila." # todo: NEW TRANSLATION
 ALG_hirak.100.t: "Hlas Hiraku" # todo: NEW TRANSLATION
 ALG_hirak.100.d: "Od Alžíru po Oran, od Konstantiny po Tamanrasset, každý pátek pochodují miliony lidí a požadují „Yetnahaw Ga3“ – všichni musí odejít. Starý režim se zhroutil. Nyní si Hirak musí zvolit, kdo přenese ducha 22. února do prezidentského paláce v El Mouradii?" # todo: NEW TRANSLATION
 ALG_hirak.100.a: "Zoubida Assoul – ústavní hlas" # todo: NEW TRANSLATION
 ALG_hirak.100.b: "Karim Tabbou – šampion ulice" # todo: NEW TRANSLATION
 ALG_hirak.100.c: "Hakim Addad – generace RAJ" # todo: NEW TRANSLATION
 ALG_hirak.100.e: "Amira Bouraoui – neúprosná dcera Barakatu" # todo: NEW TRANSLATION
 ALG_african_trade_links: "Obchodní vazby s Afrikou" # todo: NEW TRANSLATION
 ALG_african_trade_links_desc: "Díky posíleným hospodářským a diplomatickým iniciativám napříč Afrikou Alžírsko rozšiřuje svou síť obchodních dohod, snižuje závislost na vnějších trzích a zajišťuje vzájemnou prosperitu s našimi kontinentálními partnery." # todo: NEW TRANSLATION
 ALG_african_mediation_role: "Úloha afrického prostředníka" # todo: NEW TRANSLATION
 ALG_african_mediation_role_desc: "Alžírsko se dlouhodobě profiluje jako důvěryhodný prostředník v afrických sporech. Aktivním zapojením do řešení konfliktů můžeme posílit svou legitimitu na kontinentu a rozšířit diplomatický vliv." # todo: NEW TRANSLATION
 ALG_african_union_reforms: "Prosazovat reformy Africké unie" # todo: NEW TRANSLATION
 ALG_african_union_reforms_desc: "Africká unie zůstává omezená ve své účinnosti. Prosazováním reforem, posilováním jejích institucí, podporou odpovědnosti a budováním konsenzu můžeme zajistit, aby se Alžírsko stalo respektovaným vůdcem v kontinentálním rámci Afriky." # todo: NEW TRANSLATION
 ALG_african_economic_integration: "Africká hospodářská integrace" # todo: NEW TRANSLATION
 ALG_african_economic_integration_desc: "Kontinentální hospodářská integrace je klíčem k prosperitě Alžírska. Snížením obchodních bariér a zlepšením spojení s africkými partnery omezíme závislost na zahraničních trzích a podpoříme udržitelný růst v Africe." # todo: NEW TRANSLATION
 ALG_expand_african_investments: "Rozšířit africké investice" # todo: NEW TRANSLATION
 ALG_expand_african_investments_desc: "Prostřednictvím státem podporovaných podniků a spolupráce s africkými partnery může Alžírsko rozšířit investice do infrastruktury, energetiky a obchodu. Tyto investice posílí naše hospodářství a zároveň upevní vazby napříč kontinentem." # todo: NEW TRANSLATION
 ALG_PT: "PT (Strana pracujících)" # todo: NEW TRANSLATION
 ALG_PT_desc: "PT (Parti des travailleurs) je trockistická politická strana v Alžírsku úzce spojená s Nezávislou dělnickou stranou Francie. Stranu vede Louisa Hanoune. Dělnická strana, která používá zkratku „PT“, prosazuje ochranu a podporu odborového hnutí v Alžírsku. Podle svých prohlášení zastává rovnostářskou doktrínu usilující o spravedlivější rozdělení bohatství mezi obyvatele země. Strana vznikla v roce 1990, rok po ústavní reformě, která zavedla pluralitní systém. Její generální tajemnicí je Louisa Hanoune, která se v roce 2004 stala první ženou v arabském světě kandidující v prezidentských volbách." # todo: NEW TRANSLATION
 ALG_communist_education: "Komunistické vzdělávání" # todo: NEW TRANSLATION
 ALG_communist_education_desc: "Mladé mysli jsou nejvnímavější. Vštěpování základních hodnot komunismu mladé generaci a výuka slávy rovnosti studentům vysokých škol by mohly výrazně posunout naši věc." # todo: NEW TRANSLATION
 ALG_labour_focus_unions: "Navázat kontakt s odbory" # todo: NEW TRANSLATION
 ALG_labour_focus_unions_desc: "Odbory budou velmi potěšeny, že mají vládu ochotnou nejen spolupracovat, ale také ustoupit jejich požadavkům. Zajistíme, aby jejich vliv nepřesáhl období našeho nástupu k moci, a předejdeme tak §Rstřetu zájmů.§!" # todo: NEW TRANSLATION
 ALG_failures_capitalism: "Selhání kapitalismu" # todo: NEW TRANSLATION
 ALG_failures_capitalism_desc: "Kapitalismus nám již neposkytuje nekonečné bohatství, které sliboval. Je čas vydat se vlastní cestou a zajistit, aby se podobná krize už nikdy neopakovala! §RÚčinek tohoto zaměření se odvíjí od rozsahu dluhové krize.§!" # todo: NEW TRANSLATION
 ALG_working_class: "Dělnická třída" # todo: NEW TRANSLATION
 ALG_working_class_desc: "Dělnická třída – místo, kde se sny rodí i umírají. Můžeme jí slíbit, že s ní bude dobře zacházeno a že se jí dostane uznání, které si zaslouží jako základ nového komunistického státu." # todo: NEW TRANSLATION
 ALG_communist_propaganda: "Propagandistický stroj" # todo: NEW TRANSLATION
 ALG_communist_propaganda_desc: "Díky našemu rostoucímu vlivu si můžeme dovolit vypustit propagandistický stroj na Alžírsko. Přestože jsou jeho finanční náklady vysoké, tuto propagandu nelze podceňovat; při přesvědčování alžírského obyvatelstva bude mimořádně účinná." # todo: NEW TRANSLATION
 ALG_prepare_government: "Připravit vládu" # todo: NEW TRANSLATION
 ALG_prepare_government_desc: "Zřízením vlády uvnitř naší politické strany zajistíme účinný přechod, který nám umožní prosadit naše cíle rychleji, než se naši rivalové stačí vzpamatovat. Bude to nákladné, ale vzhledem k našim šancím na vítězství jde o dobře umístěnou sázku." # todo: NEW TRANSLATION
 ALG_damn_market: "Zatracený volný trh" # todo: NEW TRANSLATION
 ALG_damn_market_desc: "Jsme v pozici, kdy můžeme kapitalistům zasadit poslední úder. S mocí propagandy na své straně můžeme zasadit smrtící ránu ekonomice volného trhu a zároveň sesadit z trůnu přebytku, na němž kapitalisté sedí!" # todo: NEW TRANSLATION
 ALG_election_com: "Požadovat okamžité volby" # todo: NEW TRANSLATION
 ALG_election_com_desc: "Soudruzi, nastal čas! Veškeré naše úsilí směřující k novému svobodnému státu vedlo k tomuto okamžiku! \n\n§RZajistíme, aby vláda lidu vládla dalších 1000 let!§!" # todo: NEW TRANSLATION
 PT_flag: "PT" # todo: NEW TRANSLATION
 ALG_failures_capitalism_TT: "§RÚčinek tohoto zaměření se odvíjí od rozsahu dluhové krize.§!" # todo: NEW TRANSLATION
 ALG_communist_takeover_TT: "§GAlžírský lid požaduje volby!§!\n\nUjistěte se, že máte na to dostatek našetřené politické moci. Pokud §Rselžete§! při zvolení a vytvoření vlády, budete muset uspořádat §Ydalší mimořádné volby§!, abyste zmocnili §Y[Communist-State_L]§!" # todo: NEW TRANSLATION
 ALG_increase_drift_TT: "§GZvyšuje politický posun směrem k této straně!§!" # todo: NEW TRANSLATION
 ALG_wild_unions: "Nezkrotné odbory" # todo: NEW TRANSLATION
 ALG_wild_unions_desc: "Dali jsme odborům moc a ony ji využívají – nevidíme v tom žádný problém." # todo: NEW TRANSLATION
 ALG_wild_unions_2: "Nezkrotné odbory" # todo: NEW TRANSLATION
 ALG_wild_unions_2_desc: "Odbory dostaly během našeho vzestupu k moci velkou svobodu. Nyní, když jsme zvítězili, se na ně obracíme jen proto, abychom si před úplným upevněním mocenské základny zajistili přízeň lidu." # todo: NEW TRANSLATION
 ALG_wild_unions_3: "Nezkrotné odbory" # todo: NEW TRANSLATION
 ALG_wild_unions_3_desc: "Odbory jsou jednoduše nesnesitelné, už je nemůžeme dál tolerovat! Začaly jako obtíž, ale staly se překážkou vůle státu; musí být uklidněny, nebo zničeny!" # todo: NEW TRANSLATION
 ALG_press_opposition: "Opoziční média" # todo: NEW TRANSLATION
 ALG_press_opposition_desc: "Média nás od obnovení pořádku ve vládě nevykreslují v nejlepším světle, ale je jen logické, že slabí se bojí silných." # todo: NEW TRANSLATION
 ALG_one_party: "Jednostranický stát" # todo: NEW TRANSLATION
 ALG_one_party_desc: "Po prohlášení PT za jedinou politickou stranu povolenou v Alžírsku máme moc dělat, co chceme, ovšem za cenu krve prolité k zajištění podřízenosti našeho lidu." # todo: NEW TRANSLATION
 ALG_reorganize_army_idea: "Reorganizace armády" # todo: NEW TRANSLATION
 ALG_reorganize_army_idea_desc: "Nemůžeme armádu jednoduše financovat tak málo, až přestane fungovat. Může přijít čas, kdy budeme potřebovat silné ozbrojené síly, a proto zajistíme, aby naše armáda byla loajální a připravená." # todo: NEW TRANSLATION
 ALG_new_army_idea: "Nová armáda" # todo: NEW TRANSLATION
 ALG_new_army_idea_desc: "Dosáhli jsme velkého úspěchu, když policie převzala úlohu hlavní obranné síly. Víme však, že není dostatečně vybavena, aby dokázala odrazit zahraniční invazi. Vybudujeme novou armádu zaměřenou výhradně na obranu Alžírska, abychom zajistili bezpečnost našeho lidu." # todo: NEW TRANSLATION
 ALG_red_army_idea: "Rudá armáda" # todo: NEW TRANSLATION
 ALG_red_army_idea_desc: "Vštípili jsme ideologický fanatismus nejen do řad naší armády, ale i do civilního obyvatelstva a zajistili si tak početní sílu a loajalitu potřebnou k nasazení impozantní armády." # todo: NEW TRANSLATION
 ALG_cracked_foundation: "Popraskané základy" # todo: NEW TRANSLATION
 ALG_cracked_foundation_desc: "Základy státu byly již tolikrát popřeny, že pokud budeme pokračovat současnou cestou, může nás čekat další strašlivá revoluce. \n\n§RPokud naše stabilita klesne pod 30 %, čeká Alžírsko revoluce!§!" # todo: NEW TRANSLATION
 ALG_militarist_education_idea: "Militaristické vzdělávání" # todo: NEW TRANSLATION
 ALG_militarist_education_idea_desc: "Vzdělávací systém začlenil do osnov vojenské hodnoty, což umožňuje vyšší stupeň připravenosti v případě náhlých útoků." # todo: NEW TRANSLATION
 ALG_elam: "Obnovení Národní lidové fronty" # todo: NEW TRANSLATION
 ALG_elam_desc: "Národní lidová fronta výrazně rozšířila své úsilí ve všech oblastech, aby ovlivnila průměrného voliče. Máme podezření, že příčinou tohoto „narušení“ je Alžírsko." # todo: NEW TRANSLATION
 algeria.5.t: "PT vyzývá k volbám v Alžírsku" # todo: NEW TRANSLATION
 algeria.5.d: "Po získání většinové podpory alžírské dělnické třídy a několika politických osobností vyzvala Parti des Travailleurs (PT) vládu k uspořádání svobodných voleb. PT získala masivní podporu a úřady jsou z více stran pod tlakem, aby ustoupily. Mnozí očekávají rozhodující vítězství PT, protože její základna mezi dělníky a odbory každým dnem sílí. Mluvčí varoval, že pokud budou volby odmítnuty, dělníci zahájí povstání s cílem svrhnout vládu." # todo: NEW TRANSLATION
 algeria.5.a: "Dělníci Alžírska, povstaňte!" # todo: NEW TRANSLATION
 algeria.5.b: "Zajímavé" # todo: NEW TRANSLATION
 algeria.7.t: "Alžírsko se posouvá doleva" # todo: NEW TRANSLATION
 algeria.7.d: "S rostoucí nezaměstnaností a zhoršující se hospodářskou nerovností se alžírská dělnická třída sjednotila za krajně levicovou Parti des Travailleurs (PT). PT odsuzuje neoliberální politiku a porušování práv dělníků, podporuje proti-západní postoje a organizuje protesty s cílem vyvíjet tlak na vládu. Její vliv rychle roste, což znamená rozhodující posun alžírské politiky doleva." # todo: NEW TRANSLATION
 algeria.7.a: "Dělníci Alžírska, vaše osvobození se blíží" # todo: NEW TRANSLATION
 algeria.7.b: "Zajímavé" # todo: NEW TRANSLATION
 ALG_family_centric: "Rodina na prvním místě" # todo: NEW TRANSLATION
 ALG_family_centric_desc: "Podporujeme rodiny jako hlavní stavební kámen alžírské společnosti." # todo: NEW TRANSLATION
 ALG_religion_in_schools: "Náboženské vzdělávání" # todo: NEW TRANSLATION
 ALG_religion_in_schools_desc: "Náš vzdělávací systém pevně začleňuje náboženství do osnov a zajišťuje, aby mladší generace vyrůstaly se silnými islámskými hodnotami." # todo: NEW TRANSLATION
 ALG_grand_mufti_appointed: "Velký muftí Alžírska" # todo: NEW TRANSLATION
 ALG_grand_mufti_appointed_desc: "Byl jmenován velký muftí, který bude v Alžírsku vykládat islámské právo a posílí náboženskou legitimitu státu." # todo: NEW TRANSLATION
 ALG_islam_above_the_nation: "Islám nad národem" # todo: NEW TRANSLATION
 ALG_islam_above_the_nation_desc: "Během bouřlivé minulosti Alžírska spolu nacionalismus a islám soupeřily o převahu při utváření státu. Pro naši budoucnost by měl být islám vůdčím principem vládnutí a stát nade vším." # todo: NEW TRANSLATION
 ALG_family_is_a_central_unit: "Rodina nade vše" # todo: NEW TRANSLATION
 ALG_family_is_a_central_unit_desc: "Základem společnosti je rodina. Muž, žena a jejich děti tvoří základ národa. Silné rodiny zajistí prosperitu a úspěch Alžírska na mnoho let." # todo: NEW TRANSLATION
 ALG_follow_religious_law: "Řídit se náboženským právem" # todo: NEW TRANSLATION
 ALG_follow_religious_law_desc: "Islámské právo je nejlepším základem pro správu země. Jeho přijetí jako našeho základu zajistí spravedlnost a férovost pro všechny Alžířany." # todo: NEW TRANSLATION
 ALG_traditional_role_for_women: "Tradiční úloha žen" # todo: NEW TRANSLATION
 ALG_traditional_role_for_women_desc: "Ženy mají nejvyšší čest při výchově dětí a péči o rodiny. Zatímco muži pracují mimo domov, ženy musí doma chránit tradice národa." # todo: NEW TRANSLATION
 ALG_religious_education: "Náboženské vzdělávání" # todo: NEW TRANSLATION
 ALG_religious_education_desc: "Naše školy musí do osnov úzce začlenit náboženské studium. Alžířané by se měli od dětství učit Korán a islámské tradice." # todo: NEW TRANSLATION
 ALG_appoint_grand_mufti: "Jmenovat velkého muftího" # todo: NEW TRANSLATION
 ALG_appoint_grand_mufti_desc: "Alžírsko potřebuje velkého muftího, který bude vykládat islámské právo. Měli bychom navrhnout uznávaného učence, jenž poskytne státu náboženské vedení." # todo: NEW TRANSLATION
 ALG_abrogate_secular_constitution: "Zrušit sekulární ústavu" # todo: NEW TRANSLATION
 ALG_abrogate_secular_constitution_desc: "Současná ústava zachovává sekulární rámec zděděný po získání nezávislosti. Jediným právem, kterým bychom se měli řídit, je Korán, nikoli texty vytvořené člověkem." # todo: NEW TRANSLATION
 ALG_enahda_media_network: "Mediální síť Ennahdy" # todo: NEW TRANSLATION
 ALG_enahda_media_network_desc: "Měli bychom založit celostátní televizní síť, která bude vysílat poselství velkého muftího a propagovat islámské hodnoty po celém Alžírsku." # todo: NEW TRANSLATION
 ALG_supreme_islamic_council: "Nejvyšší islámská rada" # todo: NEW TRANSLATION
 ALG_supreme_islamic_council_desc: "Abychom ochránili nový stát, musíme vytvořit Nejvyšší islámskou radu, poradní orgán podporující velkého muftího a zajišťující, že Alžírsko zůstane pevně na cestě víry." # todo: NEW TRANSLATION
 ALG_edu_and_social_policy: "Vzdělávací a sociální politika" # todo: NEW TRANSLATION
 ALG_edu_and_social_policy_desc: "Dlouhodobá prosperita Alžírska závisí na více než jen přírodních zdrojích; spočívá na základech vzdělávání, zdravotnictví a sociální ochrany. Reformou těchto sektorů můžeme vytvořit novou společenskou smlouvu pro 21. století." # todo: NEW TRANSLATION
 ALG_expand_primary_education: "Rozšířit základní vzdělávání" # todo: NEW TRANSLATION
 ALG_expand_primary_education_desc: "Rozšíření přístupu k základním školám ve venkovských i městských oblastech sníží negramotnost a vybuduje základ národního rozvoje." # todo: NEW TRANSLATION
 ALG_reform_secondary_curriculum: "Reformovat středoškolské osnovy" # todo: NEW TRANSLATION
 ALG_reform_secondary_curriculum_desc: "Naše střední školy musí být reformovány tak, aby odpovídaly požadavkům moderní ekonomiky a zároveň zachovaly alžírskou identitu." # todo: NEW TRANSLATION
 ALG_western_curriculum: "Přijmout západní osnovy" # todo: NEW TRANSLATION
 ALG_western_curriculum_desc: "Začleněním západně orientovaných osnov můžeme mladé vystavit moderním vědám a globálním standardům a zvýšit konkurenceschopnost Alžírska." # todo: NEW TRANSLATION
 ALG_national_curriculum: "Posílit národní osnovy" # todo: NEW TRANSLATION
 ALG_national_curriculum_desc: "Namísto kopírování zahraničních modelů bychom se ve školách měli zaměřit na arabizaci a alžírské kulturní hodnoty, abychom zachovali suverenitu ve vzdělávání." # todo: NEW TRANSLATION
 ALG_university_reform: "Reforma univerzit" # todo: NEW TRANSLATION
 ALG_university_reform_desc: "Naše univerzity musí být rozšířeny a modernizovány, aby vzdělávaly odborníky, výzkumníky a inovátory schopné vést budoucnost Alžírska." # todo: NEW TRANSLATION
 ALG_basic_healthcare_access: "Přístup k základní zdravotní péči" # todo: NEW TRANSLATION
 ALG_basic_healthcare_access_desc: "Každý Alžířan si zaslouží přístup k základním zdravotnickým službám. Rozšíření pokrytí je prvním krokem ke zdravějšímu národu." # todo: NEW TRANSLATION
 ALG_state_hospitals: "Rozšířit státní nemocnice" # todo: NEW TRANSLATION
 ALG_state_hospitals_desc: "Investicemi do státního systému nemocnic můžeme zajistit bezplatnou a dostupnou zdravotní péči pro všechny Alžířany, i když to bude státní pokladnu značně zatěžovat." # todo: NEW TRANSLATION
 ALG_modernize_state_hospitals: "Modernizovat státní nemocnice" # todo: NEW TRANSLATION
 ALG_modernize_state_hospitals_desc: "Modernizace vybavení, školení lékařů a zlepšení infrastruktury posílí státní síť zdravotní péče." # todo: NEW TRANSLATION
 ALG_universal_healthcare: "Všeobecná zdravotní péče" # todo: NEW TRANSLATION
 ALG_universal_healthcare_desc: "Zdravotní péče je právo, nikoli výsada. Alžírsko se zaváže vybudovat plně univerzální systém zdravotní péče." # todo: NEW TRANSLATION
 ALG_private_healthcare: "Podporovat soukromou zdravotní péči" # todo: NEW TRANSLATION
 ALG_private_healthcare_desc: "Podporou soukromých nemocnic a klinik můžeme snížit zátěž státu a zavést do zdravotnictví tržní konkurenci." # todo: NEW TRANSLATION
 ALG_expand_private_clinics: "Rozšířit soukromé kliniky" # todo: NEW TRANSLATION
 ALG_expand_private_clinics_desc: "Soukromé kliniky mohou doplnit veřejný systém poskytováním specializovanějších služeb, zejména v městských oblastech." # todo: NEW TRANSLATION
 ALG_national_insurance: "Národní systém pojištění" # todo: NEW TRANSLATION
 ALG_national_insurance_desc: "Národní zdravotní pojištění sjednotí veřejnou i soukromou zdravotní péči pod jedinou záchrannou sítí pro alžírské občany." # todo: NEW TRANSLATION
 ALG_minimum_income_guarantee: "Záruka minimálního příjmu" # todo: NEW TRANSLATION
 ALG_minimum_income_guarantee_desc: "Stát zaručí nejzranitelnějším minimální úroveň příjmu a ochrání Alžířany před absolutní chudobou." # todo: NEW TRANSLATION
 ALG_housing_support: "Podpora bydlení" # todo: NEW TRANSLATION
 ALG_housing_support_desc: "Programy dotovaného bydlení poskytnou pracujícím rodinám dostupné domovy a sníží přeplněnost měst." # todo: NEW TRANSLATION
 ALG_childcare_support: "Podpora péče o děti" # todo: NEW TRANSLATION
 ALG_childcare_support_desc: "Podpora zařízení péče o děti a rodinných přídavků pomůže mladým rodinám vychovávat děti bez finančních potíží." # todo: NEW TRANSLATION
 ALG_fuel_subsidies: "Dotace na pohonné hmoty" # todo: NEW TRANSLATION
 ALG_fuel_subsidies_desc: "Dotováním cen pohonných hmot můžeme běžným Alžířanům zpřístupnit dopravu a vytápění, i když to zatíží státní pokladnu." # todo: NEW TRANSLATION
 ALG_food_subsidies: "Dotace na potraviny" # todo: NEW TRANSLATION
 ALG_food_subsidies_desc: "Ochrana ceny chleba a základních potravin zajistí, že žádná alžírská rodina nebude hladovět." # todo: NEW TRANSLATION
 ALG_welfare_consolidation: "Sjednotit sociální stát" # todo: NEW TRANSLATION
 ALG_welfare_consolidation_desc: "Sloučením našich sociálních programů do komplexního systému sociálního zabezpečení vybuduje Alžírsko moderní sociální záchrannou síť." # todo: NEW TRANSLATION
 ALG_civil_rights_protections: "Ochrana občanských práv" # todo: NEW TRANSLATION
 ALG_civil_rights_protections_desc: "Zajištění základních práv a svobod posílí národní stabilitu a sníží křivdy." # todo: NEW TRANSLATION
 ALG_gender_equality: "Prosazovat rovnost pohlaví" # todo: NEW TRANSLATION
 ALG_gender_equality_desc: "Posílení postavení alžírských žen prostřednictvím rovných práv a příležitostí je klíčem k vybudování spravedlivé a prosperující společnosti." # todo: NEW TRANSLATION
 ALG_freedom_of_press: "Zaručit svobodu tisku" # todo: NEW TRANSLATION
 ALG_freedom_of_press_desc: "Svobodný tisk je pro demokracii a odpovědnost zásadní. Podpora nezávislých médií dá Alžířanům silnější hlas." # todo: NEW TRANSLATION
 ALG_judicial_reform: "Reforma soudnictví" # todo: NEW TRANSLATION
 ALG_judicial_reform_desc: "Moderní a nezávislé soudnictví zajistí spravedlivé procesy, omezí korupci a posílí právní stát." # todo: NEW TRANSLATION
 ALG_civil_society_empowerment: "Posílit občanskou společnost" # todo: NEW TRANSLATION
 ALG_civil_society_empowerment_desc: "Podpora nevládních organizací, odborů a místních iniciativ vytvoří participativnější a odolnější společnost." # todo: NEW TRANSLATION
 ALG_digital_government: "Digitální vláda" # todo: NEW TRANSLATION
 ALG_digital_government_desc: "Digitalizace omezí byrokracii, zlepší transparentnost a přiblíží vládní služby občanům." # todo: NEW TRANSLATION
 ALG_public_service_efficiency: "Efektivita veřejných služeb" # todo: NEW TRANSLATION
 ALG_public_service_efficiency_desc: "Modernizací veřejného sektoru můžeme odstranit neefektivitu a zlepšit poskytování služeb." # todo: NEW TRANSLATION
 ALG_anti_corruption_campaign: "Protikorupční kampaň" # todo: NEW TRANSLATION
 ALG_anti_corruption_campaign_desc: "Korupce podkopává stát. Komplexní kampaň proti ní obnoví důvěru v alžírské instituce." # todo: NEW TRANSLATION
 ALG_e_governance_portal: "Portál elektronické správy" # todo: NEW TRANSLATION
 ALG_e_governance_portal_desc: "Vytvoření integrované platformy elektronické správy poskytne občanům transparentní, rychlé a dostupné veřejné služby." # todo: NEW TRANSLATION
 ALG_streamlined_bureaucracy: "Zjednodušit byrokracii" # todo: NEW TRANSLATION
 ALG_streamlined_bureaucracy_desc: "Omezením byrokratických překážek a modernizací správních struktur se Alžírsko stane efektivnějším a konkurenceschopnějším." # todo: NEW TRANSLATION
 ALG_social_contract_21st_century: "Společenská smlouva pro 21. století" # todo: NEW TRANSLATION
 ALG_social_contract_21st_century_desc: "Prostřednictvím reforem vzdělávání, zdravotnictví, sociálního zabezpečení, občanských práv a správy vytvoří Alžírsko novou společenskou smlouvu, která zajistí stabilitu, spravedlnost a prosperitu pro budoucí generace." # todo: NEW TRANSLATION
 ALG_corrupt_mil_idea: "Zkorumpovaná armáda" # todo: NEW TRANSLATION
 ALG_corrupt_mil_idea_desc: "Alžírská armáda, přestože je mocná a hluboce zakořeněná v politice, trpí všudypřítomnou korupcí. Prostředky určené na modernizaci a efektivitu odčerpávají generálové a klientelistické sítě. To podkopává operační schopnosti a narušuje důvěru veřejnosti, ztěžuje reformy a upevňuje úlohu armády jako ochránce i překážky pokroku." # todo: NEW TRANSLATION
 ALG_military_oversight: "Dohled armády" # todo: NEW TRANSLATION
 ALG_military_oversight_desc: "Armáda zavedla přísný dohled nad politikou a civilními institucemi. Přestože to zajišťuje stabilitu a brání chaosu, zároveň to snižuje transparentnost, omezuje reformy a posiluje dominanci armády ve veřejném životě." # todo: NEW TRANSLATION
 ALG_gas_pipeline_leverage: "Páka plynovodů" # todo: NEW TRANSLATION
 ALG_gas_pipeline_leverage_desc: "Rozsáhlá síť plynovodů Alžírska do Evropy poskytuje v zahraniční politice mocný vyjednávací nástroj. Energetická závislost činí partnery opatrnými, ale zároveň vytváří přílišnou závislost na vývozu uhlovodíků při udržování politického vlivu." # todo: NEW TRANSLATION
 ALG_resource_curse: "Prokletí zdrojů" # todo: NEW TRANSLATION
 ALG_resource_curse_desc: "Navzdory obrovským zásobám ropy a plynu Alžírsko zápasí s „prokletím zdrojů“. Závislost na uhlovodících podporuje korupci, odrazuje od diverzifikace a vystavuje hospodářství nestabilitě globálních energetických trhů." # todo: NEW TRANSLATION
 ALG_PM_Elections: "Jmenovat předsedu vlády" # todo: NEW TRANSLATION
 ALG_PM_Elections_desc: "\n£MAIN_desctext_elections\n\n\n\nPrezident musí rozhodnout o jmenování předsedy vlády, který povede vládu. Tato volba není pouze administrativní; jednotliví kandidáti představují soupeřící vize budoucnosti Alžírska, od loajálních technokratů po opoziční reformátory." # todo: NEW TRANSLATION
 ALG_authority_more_70: "§YReformisté§! mají alespoň §Y70 %§! £generic_anarchist_communism Vlivu v rámci [ROOT.GetFlag] alžírské vlády" # todo: NEW TRANSLATION
 ALG_PNA_victory_tt: "§Le pouvoir§! drží více než §Y45 %§! Vlivu v rámci rovnováhy moci." # todo: NEW TRANSLATION
 ALG_prime_minister_name_loc: "Předseda vlády" # todo: NEW TRANSLATION
 ALG_minister_bio_loc: "Nositel výkonné pravomoci pod prezidentem." # todo: NEW TRANSLATION
 algeria_morocco.1.t: "Marocká otázka" # todo: NEW TRANSLATION
 algeria_morocco.1.d: "Vztahy Alžírska s Marokem dlouhodobě zastiňuje trpký odkaz Písečné války, konfliktu o Západní Saharu a desetiletí uzavřených hranic. Napětí stále doutná a otázka přístupu k Maroku nabývá na významu. Má Alžírsko posílit svou historickou rivalitu, nebo se pokusit vydat novou cestou dialogu a spolupráce?" # todo: NEW TRANSLATION
 algeria_morocco.1.a: "Budoucnost Maghrebu je v sázce." # todo: NEW TRANSLATION
 algeria_morocco.1.b: "Pozorujeme z dálky." # todo: NEW TRANSLATION
 ALG_morocco_question: "Marocká otázka" # todo: NEW TRANSLATION
 ALG_morocco_question_desc: "Rivalita s Marokem kvůli Západní Sahaře, Písečné válce a desetiletí trvajícímu uzavření hranic oslabila Alžírsko. Musíme se rozhodnout: postavíme se Maroku, nebo budeme usilovat o usmíření?\n\n§YToto zaměření zahajuje větev marocké otázky.§!" # todo: NEW TRANSLATION
 ALG_sand_war_legacy: "Odkaz Písečné války" # todo: NEW TRANSLATION
 ALG_sand_war_legacy_desc: "Rány z Písečné války z roku 1963 stále přetrvávají. Alžířané si pamatují marocké ambice na našem území a mnozí volají po obnovené ostražitosti." # todo: NEW TRANSLATION
 ALG_close_the_border: "Uzavřít hranici" # todo: NEW TRANSLATION
 ALG_close_the_border_desc: "Hranice s Marokem zůstává zdrojem pašování, nepokojů a špionáže. Jejím uzavřením vyšleme silný vzdorovitý signál." # todo: NEW TRANSLATION
 ALG_border_security_investments: "Investice do bezpečnosti hranic" # todo: NEW TRANSLATION
 ALG_border_security_investments_desc: "Musíme posílit západní hranici stálými vojenskými stanovišti, moderním dohledem a jednotkami četnictva, abychom udrželi marocký vliv na uzdě." # todo: NEW TRANSLATION
 ALG_counter_moroccan_influence: "Čelit marockému vlivu" # todo: NEW TRANSLATION
 ALG_counter_moroccan_influence_desc: "Maroko aktivně hledá spojence v zahraničí. Alžírsko musí této diplomatické ofenzivě čelit a omezit jejich vliv v Africe i mimo ni." # todo: NEW TRANSLATION
 ALG_support_polisario_struggle: "Podpořit boj Polisaria" # todo: NEW TRANSLATION
 ALG_support_polisario_struggle_desc: "Saharští lidé si zaslouží nezávislost. Podporou Fronty Polisario posílí Alžírsko svou úlohu šampiona antikoloniálního boje v Maghrebu." # todo: NEW TRANSLATION
 ALG_internationalize_conflict: "Internacionalizovat konflikt" # todo: NEW TRANSLATION
 ALG_internationalize_conflict_desc: "Otázka Západní Sahary musí být předložena OSN, Africké unii a všem možným fórům, aby bylo na Maroko vyvíjeno diplomatické úsilí." # todo: NEW TRANSLATION
 ALG_african_union_pressure: "Mobilizovat Africkou unii" # todo: NEW TRANSLATION
 ALG_african_union_pressure_desc: "Prostřednictvím Africké unie vybuduje Alžírsko koalici států, které budou tlačit na Maroko, aby přijalo právo Saharaviů na sebeurčení." # todo: NEW TRANSLATION
 ALG_seek_dialogue_morocco: "Hledat dialog s Marokem" # todo: NEW TRANSLATION
 ALG_seek_dialogue_morocco_desc: "Alžírsko musí prozkoumat diplomatické kanály s Marokem. Přestože nás rozdělují minulé války a rivalita, dialog může vést k regionální stabilitě." # todo: NEW TRANSLATION
 ALG_confidence_building: "Opatření k budování důvěry" # todo: NEW TRANSLATION
 ALG_confidence_building_desc: "Malé kroky, jako jsou společné výbory a zmírnění vízových omezení, mohou vytvořit základ trvalé důvěry s Marokem." # todo: NEW TRANSLATION
 ALG_reopen_borders: "Znovu otevřít hranice" # todo: NEW TRANSLATION
 ALG_reopen_borders_desc: "Po letech uzavření by znovuotevření hranic pro volný pohyb lidí a zboží představovalo historický zlom v našich vztazích." # todo: NEW TRANSLATION
 ALG_economic_cooperation: "Hospodářská spolupráce" # todo: NEW TRANSLATION
 ALG_economic_cooperation_desc: "Hospodářská vzájemná závislost s Marokem přinese prosperitu, sníží napětí a posílí regionální úlohu Alžírska." # todo: NEW TRANSLATION
 ALG_security_cooperation: "Bezpečnostní spolupráce" # todo: NEW TRANSLATION
 ALG_security_cooperation_desc: "Společné hrozby, jako jsou terorismus a pašování, vyžadují společné hlídky a sdílení informací. Spolupráce je účinnější než rivalita." # todo: NEW TRANSLATION
 ALG_towards_maghreb_union: "Směrem k Maghrebské unii" # todo: NEW TRANSLATION
 ALG_towards_maghreb_union_desc: "Spolu s Marokem může Alžírsko položit základy silné Maghrebské unie a navázat na sny našich předků o jednotě severní Afriky." # todo: NEW TRANSLATION
 ALG_morocco.1.t: "Debata OSN o Západní Sahaře" # todo: NEW TRANSLATION
 ALG_morocco.1.d: "Alžírsko předložilo otázku Západní Sahary Organizaci spojených národů a odsoudilo marockou kontrolu nad tímto územím. Delegáti diskutují, zda by Maroko mělo ustoupit, nebo zda Alžírsko nepřekračuje své pravomoci." # todo: NEW TRANSLATION
 ALG_morocco.1.a: "Tvrdě odsoudit Maroko" # todo: NEW TRANSLATION
 ALG_morocco.1.b: "Prosazovat umírněné sankce a rezoluce" # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_start: "Napětí na hranici s Marokem" # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_start_desc: "Desetiletí nepřátelství s Marokem, živené Písečnou válkou, Západní Saharou a uzavřením hranice v roce 1994, těžce doléhají na Alžírsko. Napětí poškozuje naše hospodářství, stabilitu i vojenskou připravenost.\n§RTento národní duch nelze běžně odstranit.§!\nLze jej pouze snížit, nahradit nebo odstranit postupem skrze zaměření §YMarocká otázka§!." # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_A1: "Čelit marockému vlivu" # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_A1_desc: "Alžírsko podniklo kroky k oslabení marockého vlivu v regionu. Rivalita přetrvává, ale její důsledky zvládáme účinněji." # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_A2: "Vyostřená rivalita" # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_A2_desc: "Napětí s Marokem nadále zatěžuje stát, ale naše odhodlání a reformy omezily jeho dopad." # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_A_final: "Vojenská připravenost proti Maroku" # todo: NEW TRANSLATION
 ALG_moroccan_rivalry_A_final_desc: "Po letech konfrontace vybudovalo Alžírsko zocelenou a schopnou armádu připravenou na konflikt. Rivalita proměnila nepřízeň osudu v sílu." # todo: NEW TRANSLATION
 ALG_moroccan_reconciliation_B1: "Diplomatická gesta" # todo: NEW TRANSLATION
 ALG_moroccan_reconciliation_B1_desc: "Alžírsko podniklo opatrné kroky k dialogu s Marokem a vytvořilo příležitosti k omezené spolupráci a budování důvěry." # todo: NEW TRANSLATION
 ALG_moroccan_reconciliation_B2: "Otevření hranic" # todo: NEW TRANSLATION
 ALG_moroccan_reconciliation_B2_desc: "S prohlubováním diplomatických vztahů Alžírsko znovu otevřelo hranice s Marokem, snížilo hospodářskou zátěž a podpořilo regionální obchod." # todo: NEW TRANSLATION
 ALG_moroccan_reconciliation_B_final: "Maghrebská spolupráce" # todo: NEW TRANSLATION
 ALG_moroccan_reconciliation_B_final_desc: "Alžírsko a Maroko přijaly spolupráci, která umožňuje obchod, rozvoj a regionální vedení. Rivalita je konečně za námi." # todo: NEW TRANSLATION
 ALG_morocco_question_tt: "§YToto zaměření zahajuje cestu marocké otázky.§!\n\n- §RCesta A:§! Usilovat o konfrontaci s Marokem – Postupně oslabovat negativní modifikátor a zakončit cestu §Gsilnější armádou§!.\n- §GCesta B:§! Usilovat o usmíření s Marokem – Nahradit negativní modifikátor zlepšujícími se §Gpozitivními bonusy§! a zakončit cestu silnějším §Yhospodářstvím a diplomacií§!." # todo: NEW TRANSLATION
 alg_general.1.t: "Návrat Khaleda Nezzara" # todo: NEW TRANSLATION
 alg_general.1.d: "Po rozhodnutí obnovit metody Černé dekády je znovu povolán kontroverzní bývalý ministr obrany Khaled Nezzar. Jeho přístup tvrdé ruky může armádu stabilizovat, ale hrozí odcizením obyvatelstva a vyvoláním mezinárodní kritiky." # todo: NEW TRANSLATION
 alg_general.1.a: "Minulost se vrací, aby vedla přítomnost." # todo: NEW TRANSLATION
