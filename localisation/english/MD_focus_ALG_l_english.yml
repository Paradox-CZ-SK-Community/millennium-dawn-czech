 ALG_west_alignment_tt: "Formalizovat strategické partnerství se Spojenými státy a prohloubit vazby s NATO a EU. To umožní přístup k západním technologiím a investicím, ale může napnout vztahy s Čínou a Ruskem." # todo: NEW TRANSLATION
 ALG_china_alignment_tt: "Prohloubit spolupráci s Čínou v rámci Iniciativy pásu a stezky. Očekávejte rozsáhlé investice do infrastruktury a růst obchodu, západní mocnosti však budou ostražité." # todo: NEW TRANSLATION
 alg_crackdown.1.t: "V Alžíru propukají protesty" # todo: NEW TRANSLATION
 alg_crackdown.1.d: "Zatčení opozičních představitelů vyvolalo pouliční demonstrace. Demonstranti požadují politické reformy a konec represí." # todo: NEW TRANSLATION
 alg_crackdown.1.a: "Rozdrtit protesty." # todo: NEW TRANSLATION
 alg_crackdown.1.b: "Propustit některé zadržené." # todo: NEW TRANSLATION
 alg_crackdown.2.t: "Celostátní stávky a demonstrace" # todo: NEW TRANSLATION
 alg_crackdown.2.d: "Zákaz opozičních stran vyvolal masové hnutí připomínající protesty Hiraku. Země je paralyzována." # todo: NEW TRANSLATION
 alg_crackdown.2.a: "Nasadit armádu." # todo: NEW TRANSLATION
 alg_crackdown.2.b: "Zahájit dialog a zákaz zrušit." # todo: NEW TRANSLATION
 democratic_reforms: "Proces demokratických reforem" # todo: NEW TRANSLATION
 ALG_healthcare_success_tt: "Naše reforma zdravotnictví zlepší veřejné zdraví a zmírní nespokojenost." # todo: NEW TRANSLATION
 ALG_healthcare_failure_tt: "Neschopnost provést reformu zdravotnictví prohloubí veřejný hněv a posílí politické postavení armády." # todo: NEW TRANSLATION
 ALG_education_success_tt: "Reforma školství modernizuje naši pracovní sílu a sníží nespokojenost." # todo: NEW TRANSLATION
 ALG_education_failure_tt: "Krize školství pokračuje. Frustrace veřejnosti narůstá." # todo: NEW TRANSLATION
 ALG_unemployment_success_tt: "Programy tvorby pracovních míst sníží nezaměstnanost a stabilizují zemi." # todo: NEW TRANSLATION
 ALG_unemployment_failure_tt: "Neschopnost řešit nezaměstnanost vyvolá stávky a nepokoje." # todo: NEW TRANSLATION
 ALG_tamazgha.1.t: "Pozvání z Tamazghy" # todo: NEW TRANSLATION
 ALG_tamazgha.1.d: "Vláda [FROM.GetName], nyní přejmenovaná na „Tamazgha“, se na nás obrátila s návrhem vytvořit novou regionální alianci založenou na společném amazighském dědictví a kulturní spolupráci. Tvrdí, že tato konfederace zajistí vzájemný hospodářský rozvoj, bezpečnost a odmítnutí zastaralých panarabských struktur, jako je Arabská liga.\n\nZatímco někteří členové naší vlády to považují za historickou příležitost, jiní zpochybňují záměry Tamazghy a její dlouhodobé cíle." # todo: NEW TRANSLATION
 ALG_tamazgha.1.a: "Připojíme se ke konfederaci Tamazgha." # todo: NEW TRANSLATION
 ALG_tamazgha.1.b: "Tohle není náš boj." # todo: NEW TRANSLATION
 ALG_election_time_idea: "Příprava na příští volby" # todo: NEW TRANSLATION
 ALG_casablanca_decisions: "Casabланská iniciativa" # todo: NEW TRANSLATION
 ALG_casablanca_decisions_desc: "Diplomatické možnosti, jak vyvíjet tlak na Maroko ohledně Západní Sahary prostřednictvím Africké unie nebo mezinárodních kanálů." # todo: NEW TRANSLATION
 ALG_casablanca_mission_tt: "Zahájit misi Casablanské iniciativy. Nejprve je nutné zvolit přístup. Mise trvá 180 dní a přinese výsledek nízké, střední nebo vysoké úrovně." # todo: NEW TRANSLATION
 ALG_casablanca_mission_desc: "Zahájit časově omezený diplomatický tlak. Výsledek určí, zda tlak AU může odstranit marocké nároky, nebo při velkém úspěchu odstranit i jádra." # todo: NEW TRANSLATION
 ALG_casablanca_approach_tt: "Zvolit strategický přístup pro Casablanskou iniciativu. Lze zvolit pouze jeden přístup; poté spusťte misi prostřednictvím její dlaždice." # todo: NEW TRANSLATION
 ALG_casablanca_approach_great_powers: "Získat přízeň velmocí" # todo: NEW TRANSLATION
 ALG_casablanca_approach_great_powers_desc: "Vynaložit politickou moc na získání přízně velmocí (USA/Španělsko/Rusko). Nejvyšší šance na rozhodující tlak AU, ale za vysokou cenu a s politickým rizikem." # todo: NEW TRANSLATION
 ALG_casablanca_approach_regional: "Pouze regionální zaměření" # todo: NEW TRANSLATION
 ALG_casablanca_approach_regional_desc: "Spolehnout se na regionální partnery a vyhnout se vlivu velmocí. Levnější a méně riskantní, ale s menší pravděpodobností rozhodujícího výsledku." # todo: NEW TRANSLATION
 ALG_casablanca_approach_mixed: "Smíšená strategie" # todo: NEW TRANSLATION
 ALG_casablanca_approach_mixed_desc: "Spojit regionální a mezinárodní tlak. Vyvážené náklady i šance." # todo: NEW TRANSLATION
 AlgeriaFocusNews.100.t: "Casablanská iniciativa: Získávání přízně velmocí" # todo: NEW TRANSLATION
 AlgeriaFocusNews.100.d: "Alžírsko se rozhodlo získat podporu velmocí pro svou Casablanskou iniciativu. Je to nákladné, ale zvyšuje to šanci na silný výsledek v AU." # todo: NEW TRANSLATION
 AlgeriaFocusNews.101.t: "Casablanská iniciativa: Regionální přístup" # todo: NEW TRANSLATION
 AlgeriaFocusNews.101.d: "Alžírsko sleduje čistě regionální diplomatickou cestu a spoléhá se na sousední státy a spojence v Africké unii." # todo: NEW TRANSLATION
 AlgeriaFocusNews.102.t: "Casablanská iniciativa: Smíšená strategie" # todo: NEW TRANSLATION
 AlgeriaFocusNews.102.d: "Alžírsko spojí regionální a mezinárodní úsilí, aby zvýšilo tlak a zároveň omezilo rizika." # todo: NEW TRANSLATION
 AlgeriaFocusNews.103.t: "Casablanská iniciativa: Velký úspěch" # todo: NEW TRANSLATION
 AlgeriaFocusNews.103.d: "Casablanská iniciativa dosáhla rozhodujícího výsledku v procesu AU/OSN. Diplomatický tlak má skutečnou dynamiku; Alžírsko je v silné pozici, aby přimělo Maroko vzdát se diplomatických nároků a podle vašeho zaměření odstranit i jádra." # todo: NEW TRANSLATION
 AlgeriaFocusNews.104.t: "Casablanská iniciativa: Mírný úspěch" # todo: NEW TRANSLATION
 AlgeriaFocusNews.104.d: "Casablanská iniciativa přinesla významný diplomatický výsledek. Tlak na Maroko vzrostl; AU podporuje naši věc, ale není rozhodující." # todo: NEW TRANSLATION
 AlgeriaFocusNews.105.t: "Casablanská iniciativa: Skromný výsledek" # todo: NEW TRANSLATION
 AlgeriaFocusNews.105.d: "Casablanská iniciativa získala v AU pouze skromné sympatie. K vynucení zásadních ústupků bude zapotřebí další práce." # todo: NEW TRANSLATION
 AlgeriaFocusNews.106.t: "Casablanská iniciativa: Mise vypršela" # todo: NEW TRANSLATION
 AlgeriaFocusNews.106.d: "Uplynul čas bez hmatatelného výsledku. Diplomatická dynamika je ztracena." # todo: NEW TRANSLATION
 AlgeriaFocusNews.100.a: "Vzít na vědomí" # todo: NEW TRANSLATION
 AlgeriaFocusNews.101.a: "Vzít na vědomí" # todo: NEW TRANSLATION
