 alg_resistance.1.t: "Lid vítězí!" # todo: NEW TRANSLATION
 alg_resistance.1.d: "Hlasy lidu povstaly proti vládnoucím elitám. Masové demonstrace a lidová organizace donutily vládu ustoupit. Alžírsko vstupuje do nové éry demokratické správy." # todo: NEW TRANSLATION
 alg_resistance.1.a: "Lid promluvil." # todo: NEW TRANSLATION
 alg_resistance.2.t: "Le Pouvoir drtí odpor" # todo: NEW TRANSLATION
 alg_resistance.2.d: "Zakořeněná elita podporovaná armádou úspěšně potlačila odpor. Status quo přetrvává, doutnající nespokojenost však hrozí budoucími nepokoji." # todo: NEW TRANSLATION
 alg_resistance.2.a: "Pořádek byl obnoven." # todo: NEW TRANSLATION
 alg_resistance.3.t: "Národ v chaosu" # todo: NEW TRANSLATION
 alg_resistance.3.d: "Ani odpor, ani Le Pouvoir nedokázaly prosadit svou převahu. Mocenské vakuum uvrhlo Alžírsko do chaosu, v němž o kontrolu soupeří vojenští vůdci a různé frakce." # todo: NEW TRANSLATION
 alg_resistance.3.a: "Země balancuje na pokraji zhroucení." # todo: NEW TRANSLATION
 alg_resistance.4.t: "Alžírská krize eskaluje" # todo: NEW TRANSLATION
 alg_resistance.4.d: "Křehká junta nedokáže udržet stát pohromadě a Alžírsko upadá do stále hlubšího chaosu. Důstojníci mohou zemi vrátit civilní vládě, dokud je ještě co předávat, nebo se mohou opevnit a nechat přijít ozbrojené skupiny." # todo: NEW TRANSLATION
 alg_resistance.4.a: "Předat moc civilní vládě." # todo: NEW TRANSLATION
 alg_resistance.4.b: "Generálové neustoupí." # todo: NEW TRANSLATION
 ALG_deepen_african_union: "Prohloubit spolupráci s Africkou unií" # todo: NEW TRANSLATION
 ALG_deepen_african_union_desc: "Alžírsko je již dlouho jedním z pilířů africké diplomacie. Aktivním posílením naší role v Africké unii můžeme zvýšit svůj vliv na kontinentu, podpořit solidaritu a prosazovat iniciativy pro mír a hospodářskou integraci. Ačkoli nás to bude stát finanční prostředky, posílí to naši legitimitu v Africe." # todo: NEW TRANSLATION
 ALG_african_union_tt: "Alžírsko posiluje své vazby v rámci §YAfrické unie§!, čímž zlepšuje vztahy s africkými členskými státy." # todo: NEW TRANSLATION
 ALG_strengthen_maghreb_union: "Posílit Maghrebskou unii" # todo: NEW TRANSLATION
 ALG_strengthen_maghreb_union_desc: "Sen o regionální integraci severní Afriky zůstává nenaplněn, Alžírsko jej však může oživit. Podporou spolupráce s našimi maghrebskými sousedy můžeme odstranit obchodní překážky, zlepšit diplomatickou důvěru a upevnit naše společné kulturní a historické vazby." # todo: NEW TRANSLATION
 KBY_alg_modifier_desc: "Malorusko je stát vytvořený poměrně nedávno. Jeho vnitřní i zahraniční politika jsou zcela podřízeny Moskvě, přesto má značnou autonomii v domácí i zahraniční politice." # todo: NEW TRANSLATION
