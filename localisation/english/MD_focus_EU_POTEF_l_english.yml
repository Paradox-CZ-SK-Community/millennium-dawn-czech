 EU_POTEF_call_election_desc: "S vznikem Evropské federace se funkce prezidenta Evropské federace (POTEF) vyvinula z rotujícího předsednictví Rady Evropské unie. Aby POTEF získal demokratickou legitimitu nadřazenou rotujícímu předsednictví, bylo ve smlouvách stanoveno, že POTEF musí být volen lidmi a že jeho funkční období závisí na dosažené většině.\n\nMomentálně neexistuje žádný funkční prezident POTEF, takže je potřeba vyhlásit volby, aby bylo prázdné místo obsazeno." # todo: NEW TRANSLATION
