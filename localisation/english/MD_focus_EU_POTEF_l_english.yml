 EU_POTEF_break_environmental_sanctions_decision_desc: "Evropské sankce environmentální byly na nás uvaleny. Musíme je prolomit všemi prostředky - politickými i vojenskými. Ale to dá [FROM.GetNameWithFlag] válečný cíl proti nám. Proto musíme navázat alianci s dalšími zeměmi sankcionovanými [FROM.GetNameWithFlag]." # todo: NEW TRANSLATION
