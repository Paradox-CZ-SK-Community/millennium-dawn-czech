 EU_POTEF_environmental_imperialism_decision: "Požadovat environmentální reformy" # todo: NEW TRANSLATION
 EU_POTEF_environmental_imperialism_decision_desc: "We need to save the planet. If §Y[FROM.GetNameWithFlag]§! doesn't do the necessary §GEnvironmentální reformy§! by themselves, we need to force them to do so. They need to have at least one §YRafinérie biopaliv§! for every state they own. If §Y[FROM.GetNameWithFlag]§! doesn't fulfill our demands within a month, we will impose §REnvironmentální sankce§! on them." # todo: NEW TRANSLATION
 EU_POTEF_environmental_imperialism_target: "Požadovány environmentální reformy" # todo: NEW TRANSLATION
 EU_POTEF_environmental_imperialism_mission: "Environmentální reformy" # todo: NEW TRANSLATION
 EU_POTEF_environmental_imperialism_mission_desc: "§YEvropa§! vyžaduje §GEnvironmentální reformy§! od nás, abychom zachránili planetu. Pokud nepostavíme nebo nepřestavíme alespoň jednu §YRafinérie biopaliv§! pro každý stát, který vlastníme, do měsíce, uvalí na nás §REnvironmentální sankce§!." # todo: NEW TRANSLATION
 EU_POTEF_environmental_imperialism_restructure_industry_decision: "Green Energy Reconstruction" # todo: NEW TRANSLATION
 EU_POTEF_environmental_imperialism_restructure_industry_decision_desc: "Abychom splnili požadavky §GEnvironmentální reformy§! Evropské unie, musíme přestavět část našeho §Ycivilního průmyslu§! na výrobce obnovitelné energie (§Ybiopalivová rafinerie§!)." # todo: CHANGED
