 Militia_Bat: "Milice" # todo: NEW TRANSLATION
 Militia_Bat_desc: "Pěší prapor milice. Jednotky milice se vyznačují menším množstvím těžké techniky a komunikačního vybavení než běžná pěchota. Díky tomu jsou vysoce mobilní a účinné v obtížném terénu, ale v rovinatém terénu proti obrněnému protivníkovi rychle mizí.\n\n§GTip pro návrháře: Milice poskytuje levnou obrannou šíři fronty a potlačení. Nejlépe si vede ve městech, lesích a kopcích, ale má slabou obranu a průlom a je obzvláště zranitelná vůči obrněncům a boji v otevřeném či nehostinném terénu.§!" # todo: CHANGED
 Mot_Militia_Bat: "Motorizovaná milice" # todo: NEW TRANSLATION
 Mot_Militia_Bat_desc: "Prapor motorizované milice s pickupy nebo dokonce obrněnými užitkovými vozidly. Jednotky milice se vyznačují menším množstvím těžké techniky a komunikačního vybavení než běžná pěchota. Díky tomu jsou vysoce mobilní a účinné v obtížném terénu, ale v rovinatém terénu proti obrněnému protivníkovi rychle mizí.\n\n§GTip pro návrháře: Motorizovaná milice vyměňuje část úspornosti za rychlost a vyšší potlačení. Využijte ji k mobilní bezpečnosti a levnému postupu přes pláně či pouště, ale její slabé bojové statistiky a postihy v náročném terénu z ní činí špatné útočné jednotky.§!" # todo: CHANGED
 Mech_Militia_Bat: "Mechanizovaný milicionářský prapor" # todo: NEW TRANSLATION
 Mech_Militia_Bat_desc: "Milicionářský prapor s obrněnými transportéry. Milicionářské jednotky se vyznačují menším množstvím těžké techniky a komunikačního vybavení než běžná pěchota. Díky tomu jsou vysoce mobilní a účinné v obtížném terénu, ale v rovinatém terénu proti obrněnému protivníkovi rychle roztají.\n\n§GNápověda pro návrháře: Mechanizované milice dále vyměňují hospodárnost za rychlost a vyšší odolnost. Používejte je jako cenově dostupné těžší mobilní bezpečnostní jednotky a k postupu proti pěchotě na nohou a dělostřelectvu, ale jejich slabší bojové statistiky ve srovnání s profesionální mechanizovanou pěchotou jim brání utkat se tváří v tvář s dobře vybavenou armádou.§!" # todo: NEW TRANSLATION
 L_Inf_Bat: "Lehká pěchota" # todo: NEW TRANSLATION
 L_Inf_Bat_desc: "Lehká pěchota bez transportu. Na moderním bojišti je k vidění jen zřídka, ale existují specializované jednotky pro velmi obtížný terén, například džungle a hory, kde jsou mimořádně účinné. Mohou být také užitečné jako městské posádky.\n\n§GTip pro návrháře: Lehká pěchota poskytuje vysokou organizaci a silný bojový výkon v kopcích, lesích, horách, džunglích, bažinách a městech bez nutnosti vozidel. Využijte ji k držení nebo útoku v obtížném terénu, ale počítejte s pomalým strategickým pohybem a slabšími útoky přes pláně a pouště.§!" # todo: CHANGED
 Mot_Inf_Bat: "Motorizovaná pěchota" # todo: NEW TRANSLATION
 Mot_Inf_Bat_desc: "Motorizovaná pěchota používá k transportu všechny druhy užitkových vozidel, od pickupů až po moderní vozidla odolná proti minám. Poskytuje rychlou mobilitu na bojišti tam, kde pohybu vozidel nahrávají silnice a otevřený terén.\n\n§GTip pro návrháře: Motorizovaná pěchota poskytuje dostupnou rychlost a dobrý výkon v otevřeném terénu. Využijte ji k využití průlomů a podpoře rychlých front, ale její vozidla zvyšují nároky na vybavení a ztrácejí účinnost v lesích, horách, džunglích, bažinách a městech.§!" # todo: CHANGED
 Hvy_Mot_Inf_Bat: "Těžká motorizovaná pěchota" # todo: NEW TRANSLATION
 Hvy_Mot_Inf_Bat_desc: "Těžká motorizovaná pěchota používá jako transportéry vozidla chráněná proti minám a léčkám (MRAP). Jejich obrněná vozidla poskytují posádce vynikající ochranu proti minám, improvizovaným výbušným zařízením a palbě z ručních zbraní, takže jsou ideální pro operace v nepřátelském prostředí s vysokým rizikem přepadení.\n\n§GNápověda pro návrháře: Těžká motorizovaná pěchota používá lépe chráněná vozidla pro rychlé operace v první linii v rovinách a pouštích. Je náročnější na vybavení a má nižší organizovanost a opevnění než lehčí pěchota, přičemž stále trpí značnými postihy v členitém terénu.§!" # todo: NEW TRANSLATION
 Mech_Inf_Bat: "Mechanizovaná pěchota" # todo: NEW TRANSLATION
 Mech_Inf_Bat_desc: "Mechanizovaná pěchota používá jako transport obrněné transportéry. Je vhodná pro obrněný boj v rovinatém terénu.\n\n§GTip pro návrháře: Mechanizovaná pěchota kombinuje silnou obranu a obrněnou mobilitu s dobrým výkonem na pláních a v pouštích. Využijte ji k držení linie v rychlých obrněných formacích, ale transportéry jsou nákladné a její útok i pohyb trpí v lesích, horách, džunglích a městech.§!" # todo: CHANGED
 Arm_Inf_Bat: "Pancéřovaná pěchota" # todo: NEW TRANSLATION
 Arm_Inf_Bat_desc: "Obrněná pěchota používá jako transport bojová vozidla pěchoty. Je vhodná pro obrněný boj v rovinatém terénu, ale v obtížném terénu je nevyužitá, protože tam musí působit pěšky daleko od svých BVP.\n\n§GTip pro návrháře: Obrněná pěchota používá BVP k dosažení vyšší palebné síly, obrnění a průlomu než mechanizovaná pěchota. Využijte ji společně s tanky v otevřeném terénu, ale její nižší organizace, vysoké náklady na vybavení a silné postihy v horách, džunglích, bažinách a městech vyžadují pečlivé nasazení.§!" # todo: CHANGED
 L_Air_Inf_Bat: "Výsadková pěchota" # todo: CHANGED
 L_Air_Inf_Bat_desc: "Lehká výsadková pěchota je elitní pěchota se zvláštním výcvikem leteckého vysazení pomocí padákových seskoků z transportních letadel nebo transportních vrtulníků. Dokáže rychle reagovat na vzdálené krizové situace a může být vysazena za nepřátelskými liniemi, aby obsadila klíčové cíle před postupem hlavní armády. Způsob transportu však přísně omezuje množství těžké techniky, kterou může nést.\n\n§GTip pro návrháře: Výsadková pěchota kombinuje vysokou organizaci, schopnost výsadku a silný výkon v obtížném terénu. Využijte ji k obsazení a držení izolovaných cílů, ale její výcvik speciálních sil a vyšší nároky na pěchotní vybavení z ní činí nákladnou volbu pro běžný boj na frontě.§!" # todo: CHANGED
 Mot_Air_Inf_Bat: "Motorizovaná vzdušná pěchota" # todo: NEW TRANSLATION
 Mot_Air_Inf_Bat_desc: "Motorizovaná výsadková pěchota je elitní pěchota se zvláštním výcvikem leteckého vysazení pomocí padákových seskoků z transportních letadel nebo transportních vrtulníků. Dokáže rychle reagovat na vzdálené krizové situace a může být vysazena za nepřátelskými liniemi, aby obsadila klíčové cíle před postupem hlavní armády. Její užitková vozidla jí po vysazení poskytují vysokou mobilitu a umožňují jí přivést do boje více těžké techniky. Výsadek společně s vozidly je však mnohem náročnější na logistiku.\n\n§GTip pro návrháře: Motorizovaná výsadková pěchota získává po výsadku rychlost a dobře si vede v otevřeném terénu. Využijte ji, když musí výsadkové síly rychle využít průlom nebo posílit frontu, ale vozidla zvyšují nároky na vybavení a ve srovnání s pěšími výsadkáři snižují organizaci i výkon v náročném terénu.§!" # todo: CHANGED
 Mech_Air_Inf_Bat: "Mechanizovaná vzdušná pěchota" # todo: NEW TRANSLATION
 Mech_Air_Inf_Bat_desc: "Mechanizovaná výsadková pěchota je elitní pěchota se zvláštním výcvikem leteckého vysazení z transportních letadel. Dokáže rychle reagovat na vzdálené krizové situace a může být vysazena za nepřátelskými liniemi, aby obsadila klíčové cíle před postupem hlavní armády. Její speciálně navržené lehké obrněné transportéry jí poskytují vysokou mobilitu po vysazení a umožňují jí přivést do boje mnohem více těžké techniky než lehčí výsadkové síly. Výsadek společně s těmito vozidly je však mnohem náročnější na logistiku.\n\n§GTip pro návrháře: Mechanizovaná výsadková pěchota přináší při výsadku ochranu transportéry, rychlost a silnější palebnou sílu. Využijte ji, když izolované výsadkové síly musí po přistání přežít mobilní boj, ale její nižší organizace, vysoké nároky na vybavení a silné postihy v náročném terénu z ní činí nákladnou specializovanou volbu.§!" # todo: CHANGED
 Arm_Air_Inf_Bat: "Pancéřovaná vzdušná pěchota" # todo: NEW TRANSLATION
 Arm_Air_Inf_Bat_desc: "Obrněná výsadková pěchota je elitní pěchota se zvláštním výcvikem leteckého vysazení z transportních letadel. Dokáže rychle reagovat na vzdálené krizové situace a může být vysazena za nepřátelskými liniemi, aby obsadila klíčové cíle před postupem hlavní armády. Její speciálně navržená lehká bojová vozidla pěchoty jí poskytují vysokou mobilitu a umožňují jí bojovat za rovných podmínek proti běžným mechanizovaným formacím. Výsadek společně s jejími BVP je však mimořádně náročný na logistiku. Od roku 2017 takové síly provozovalo pouze Rusko.\n\n§GTip pro návrháře: Obrněná výsadková pěchota přináší při výsadku palebnou sílu BVP, obrnění a průlom. Využijte ji k boji o bráněné cíle nebo proti nepřátelským mobilním zálohám po vysazení, ale její velmi vysoké nároky na vybavení, nízká organizace a postihy v obtížném terénu činí ztráty nákladnými.§!" # todo: CHANGED
 L_Ranger_Bat: "Strážci" # todo: CHANGED
 L_Ranger_Bat_desc: "Rangers jsou elitní lehká pěchota specializovaná na nájezdy, přímé akce a rychlé nasazení před hlavními silami. Pohybují se nalehko, aby maximalizovali mobilitu a moment překvapení, obsazují klíčové cíle a drží je do příchodu konvenčních jednotek. Nevýhodou je nedostatek těžké techniky, kvůli němuž jsou v otevřeném terénu zranitelní vůči obrněným jednotkám.\n\n§GNápověda pro návrháře: Rangers soustřeďují vysokou organizovanost a mimořádné bonusy v obtížném terénu do malé šířky boje. Používejte je pro elitní horské, lesní, džunglové, bažinné nebo městské formace, ale jejich dlouhý výcvik, limit speciálních sil a omezené těžké vybavení činí masové nasazení nákladným a ponechává je zranitelné v rovinách.§!" # todo: NEW TRANSLATION
 L_Ranger_Recce_Comp: "Průzkumná rota strážců" # todo: CHANGED
 L_Ranger_Recce_Comp_desc: "Průzkumný prvek složený z Rangers, vycvičený k pěšímu pronikání hluboko za nepřátelské linie a hlášení pohybu nepřítele. Kombinuje utajení s průzkumem pomocí dronů a elektronickým sledováním, shromažďuje informace, označuje cíle pro palebnou podporu spojenců a při vhodné příležitosti může provádět omezené nájezdy a přepady.\n\n§GNápověda pro návrháře: Průzkum Rangers přidává průzkum a iniciativu, zlepšuje měkký útok dělostřelectva a dobře bojuje v obtížném terénu. Používejte jej ve formacích speciálních sil, které potřebují elitní průzkum, ale zvyšuje šířku boje, spotřebovává kapacitu speciálních sil a poskytuje omezenou přímou palebnou sílu.§!" # todo: NEW TRANSLATION
 L_Marine_Bat: "Námořní pěchota" # todo: CHANGED
 L_Marine_Bat_desc: "Námořní pěchota je elitní pěchota se zvláštním výcvikem pro obojživelné operace, jako jsou překračování řek, operace v bažinách a obojživelné invaze. Protože nemá vozidla, existují přísná omezení množství těžké techniky, kterou může nést.\n\n§GTip pro návrháře: Námořní pěchota poskytuje vysokou organizaci a silný výkon při obojživelných operacích a v bažinách bez nákladů na vozidla. Využijte ji k vytvoření předmostí a boji v mokřadech, ale po vylodění je pomalejší, spotřebovává kapacitu speciálních sil a je méně účinná v otevřeném terénu.§!" # todo: CHANGED
 Mot_Marine_Bat: "Motorizovaná námořní pěchota" # todo: NEW TRANSLATION
 Mot_Marine_Bat_desc: "Motorizovaná námořní pěchota je elitní pěchota se zvláštním výcvikem pro obojživelné operace, jako jsou překračování řek, operace v bažinách a obojživelné invaze. Ačkoli se vyloďuje jako lehká pěchota, má užitková vozidla pro pozemní transport, což jí poskytuje vysokou mobilitu a umožňuje nést do boje velké množství těžké techniky.\n\n§GTip pro návrháře: Motorizovaná námořní pěchota si zachovává silný obojživelný bonus a zároveň získává rychlost pro rychlé rozšíření předmostí. Využijte ji, když se výsadková síla musí rychle přesunout do vnitrozemí, ale její vozidla stojí více vybavení a ve srovnání s pěší námořní pěchotou snižují organizaci a výkon v horách.§!" # todo: CHANGED
 Mech_Marine_Bat: "Mechanizovaná námořní pěchota" # todo: NEW TRANSLATION
 Mech_Marine_Bat_desc: "Mechanizovaná námořní pěchota je elitní pěchota se zvláštním výcvikem pro obojživelné operace, jako jsou překračování řek, operace v bažinách a obojživelné invaze. Jelikož se vyloďuje chráněná ve speciálně navržených obojživelných obrněných transportérech, je připravena okamžitě zaútočit s vysokou mobilitou a velkým množstvím těžké techniky.\n\n§GTip pro návrháře: Mechanizovaná námořní pěchota kombinuje obojživelný bonus s ochranou transportéry a silnou mobilitou po vylodění. Využijte ji k rozšíření a držení mechanizovaných předmostí, ale má nižší organizaci než lehčí námořní pěchota a její vozidla si vedou špatně v lesích a horách.§!" # todo: CHANGED
 Arm_Marine_Bat: "Pancéřovaná námořní pěchota" # todo: NEW TRANSLATION
 Arm_Marine_Bat_desc: "Obrněná námořní pěchota je elitní pěchota se zvláštním výcvikem pro obojživelné operace, jako jsou překračování řek, operace v bažinách a obojživelné invaze. Dokáže překonávat velké vzdálenosti po vodě ve svých těžce obrněných obojživelných bojových vozidlech pěchoty s proudovým pohonem a po dosažení pobřeží bojovat přímo z těchto BVP s vysokou účinností.\n\n§GTip pro návrháře: Obrněná námořní pěchota poskytuje mezi námořní pěchotou nejsilnější palebnou sílu BVP, obrnění a schopnost boje ve městech a zároveň si zachovává obojživelný bonus. Využijte ji proti silně bráněným přístavům, ale její nízká organizace, vysoké náklady a silné postihy v horách a džunglích vyžadují pro obtížný vnitrozemský terén lehčí jednotky.§!" # todo: CHANGED
 L_Air_assault_Bat: "Vzdušná úderná pěchota" # todo: NEW TRANSLATION
 L_Air_assault_Bat_desc: "Výsadková pěchota je elitní pěchota se zvláštním výcvikem slaňování a letecké přepravy; její vybavení je někdy navrženo nebo polně upraveno pro lepší přepravu v letadlech. Často se používá k obsazení a držení klíčového terénu, který ještě nebyl plně zajištěn, a k přímému napadání nepřátelských sil za jejich liniemi.\n\n§GTip pro návrháře: Výsadková pěchota používá transportní vrtulníky k rychlým operacím a získává bojové bonusy ve většině obtížných terénů. Využijte ji k obsazení vzdálených kopců, lesů, hor, džunglí, bažin nebo měst, ale její nízká síla, slabé opevnění a nákladné vrtulníky činí dlouhodobý boj na frontě riskantním.§!" # todo: CHANGED
 attack_helo_bat: "Úderný vrtulníkový pluk" # todo: NEW TRANSLATION
 attack_helo_bat_desc: "Pluky bitevních vrtulníků soustřeďují bitevní vrtulníky s rotačními křídly pro rychlé protitankové údery a blízkou podporu na široké frontě.\n\n§GTip pro návrháře: Bitevní vrtulníky poskytují rychlou obrněnou palebnou sílu a silné útoky na pláních a v pouštích. Využijte je k posílení průlomů nebo lovu obrněnců v otevřeném terénu, ale jejich velmi nízká organizace a síla, nákladná letadla a slabý výkon ve městech, horách, lesích a džunglích činí dlouhodobý boj nebezpečným.§!" # todo: CHANGED
 attack_helo_comp: "Společnost útočných vrtulníků" # todo: NEW TRANSLATION
 attack_helo_comp_desc: "Rota bitevních vrtulníků poskytuje frontovým formacím rychlou podporu bitevními vrtulníky a mobilní protitankovou palebnou sílu.\n\n§GTip pro návrháře: Rota bitevních vrtulníků přidává rychlou obrněnou palebnou sílu bez šířky boje. Použijte ji jako flexibilní podporu pěším, mobilním, obrněným nebo námořním divizím, ale letadla a velitelské vybavení jsou nákladné a její útok je méně účinný ve městech a džunglích.§!" # todo: CHANGED
 Special_Forces: "Speciální operační síly" # todo: NEW TRANSLATION
 Special_Forces_desc: "Síly speciálních operací jsou elitou každé armády, která je nasazuje, a procházejí delším a náročnějším výcvikem než kdokoli jiný. Jsou odborníky na obtížný terén, výsadkové operace a obojživelná vylodění. Jsou však vybaveny velmi nalehko, protože mohou potřebovat působit mobilně za frontovými liniemi.\n\n§GTip pro návrháře: Síly speciálních operací nabízejí výjimečnou organizaci, obnovu a široké terénní bonusy se schopností výsadku a pobřežní evakuace. Využijte je k nejtěžším nájezdům a boji o sporné cíle, ale jejich velká šířka boje, velmi dlouhý výcvik, limit speciálních sil a lehké vybavení z nich činí nevhodnou běžnou pěchotu.§!" # todo: CHANGED
 armor_Bat: "Tanková rota" # todo: CHANGED
 armor_Bat_desc: "Tanková rota se skládá pouze z nejlépe obrněných vozidel, která existují: hlavních bojových tanků. Díky vynikající mobilitě v rovinatém terénu a ničivé přímé palbě jsou určeny k prorážení děr v nepřátelských liniích, které mohou rychle využít následující mechanizované pěší jednotky.\n\n§GTip pro návrháře: Tanky poskytují vysoké obrnění, průlom a palebnou sílu proti tvrdým cílům s vynikajícími bonusy na pláních a v pouštích. Využijte je jako hrot útočných divizí, ale spotřebovávají nákladné tankové a velitelské vybavení, mají nízkou organizaci a trpí značnými postihy v lesích, horách, džunglích, bažinách a městech.§!" # todo: CHANGED
 armor_Comp: "Tanková rota" # todo: NEW TRANSLATION
 armor_Comp_desc: "Tanková rota se skládá pouze z nejlépe obrněných vozidel, která existují: hlavních bojových tanků. Díky vynikající mobilitě v rovinatém terénu a ničivé přímé palbě jsou určeny k prorážení děr v nepřátelských liniích, které mohou rychle využít následující mechanizované pěší jednotky.\n\n§GTip pro návrháře: Tanková rota přidává obrnění, průlom a mobilní palebnou sílu bez šířky boje. Použijte ji k posílení vhodných pěších nebo mobilních formací pro boj v otevřeném terénu, ale její tanky a velitelské vybavení jsou nákladné a v horách, džunglích a bažinách zpomaluje a špatně útočí.§!" # todo: CHANGED
 Militia_Recce_Comp: "Milicionářská průzkumná rota" # todo: NEW TRANSLATION
 Militia_Recce_Comp_desc: "Milicionářské průzkumné roty používají užitková vozidla a omezené komunikační vybavení k průzkumu před milicionářskými formacemi. Poskytují levný průzkum nepřátelských pozic, zejména v zastavěném terénu.\n\n§GNápověda pro návrháře: Milicionářský průzkum přidává průzkum a iniciativu bez zvýšení šířky boje a obzvlášť dobře si vede ve městech a velkoměstech. Používejte jej k levnému zlepšení taktiky milic, ale je omezen na milice a poskytuje jen malou přímou bojovou sílu.§!" # todo: NEW TRANSLATION
 L_Recce_Comp: "Průzkumná pěší rota" # todo: CHANGED
 L_Recce_Comp_desc: "Pěší průzkumné roty působí pěšky, a proto postrádají velkou část těžkého vybavení, které by z nich učinilo účinné bojové jednotky. Přibližují se k nepříteli, aby sledovaly a hlásily jeho činnost, a ke shromažďování informací používají průzkum drony i elektronický dohled. Mohou také provádět omezené nájezdy a přepady. Průzkumné roty se často nazývají „eskadrony“ kvůli svému původu v bývalých jezdeckých jednotkách.\n\n§GTip pro návrháře: Pěší průzkum přidává průzkum a iniciativu bez šířky boje a zachovává malé bonusy v lesích, horách, džunglích a kopcích. Použijte jej v pěších, výsadkových, leteckovýsadkových, námořních nebo speciálních divizích, ale vyžaduje více živé síly než jiné průzkumné prvky a přidává jen malou palebnou sílu.§!" # todo: CHANGED
 Mot_Recce_Comp: "Motorizovaná průzkumná rota" # todo: NEW TRANSLATION
 Mot_Recce_Comp_desc: "Motorizované průzkumné roty působí s užitkovými vozidly a mají z velké části stejné vybavení jako jejich pěší protějšky. Jejich úkoly se však liší. Přibližují se k nepříteli, aby sledovaly a hlásily jeho činnost, a ke shromažďování informací používají průzkum drony i elektronický dohled. Mohou také provádět omezené nájezdy a přepady. Průzkumné roty se často nazývají „eskadrony“ kvůli svému původu v bývalých jezdeckých jednotkách.\n\n§GTip pro návrháře: Motorizovaný průzkum poskytuje více průzkumu a iniciativy než pěší průzkumníci, drží krok s mobilními formacemi a zvyšuje mobilitu v otevřeném terénu. Použijte jej v motorizovaných nebo námořních divizích, ale užitková vozidla zvyšují náklady a v horách, džunglích a bažinách zpomaluje.§!" # todo: CHANGED
 Mech_Recce_Comp: "Mechanizovaná průzkumná rota" # todo: NEW TRANSLATION
 Mech_Recce_Comp_desc: "Mechanizované průzkumné roty působí s obrněnými transportéry a mají z velké části stejné vybavení jako jejich pěší protějšky. Jejich úkoly se však liší. Přibližují se k nepříteli, aby sledovaly a hlásily jeho činnost, a ke shromažďování informací používají průzkum drony i elektronický dohled. Mohou také provádět omezené nájezdy a přepady. Průzkumné roty se často nazývají „eskadrony“ kvůli svému původu v bývalých jezdeckých jednotkách.\n\n§GTip pro návrháře: Mechanizovaný průzkum poskytuje vysoký průzkum a iniciativu bez šířky boje, drží krok s formacemi transportérů a zlepšuje pohyb na pláních. Použijte jej v obrněných nebo námořních divizích, ale jeho transportéry a podpůrné vybavení jsou nákladné a v horách a bažinách zpomaluje.§!" # todo: CHANGED
 Arm_Recce_Comp: "Těžká mechanizovaná průzkumná rota" # todo: NEW TRANSLATION
 Arm_Recce_Comp_desc: "Těžké mechanizované průzkumné roty působí s bojovými vozidly pěchoty a mají z velké části stejné vybavení jako jejich obrněné pěší protějšky. Jejich úkoly se však liší. Přibližují se k nepříteli, aby sledovaly a hlásily jeho činnost, a ke shromažďování informací používají průzkum drony i elektronický dohled. Mohou také provádět nájezdy a přepady. Průzkumné roty se často nazývají „eskadrony“ kvůli svému původu v bývalých jezdeckých jednotkách.\n\n§GTip pro návrháře: Těžký mechanizovaný průzkum poskytuje vysoký průzkum a iniciativu s ochranou BVP a bez šířky boje. Použijte jej v obrněných nebo námořních divizích působících na pláních či v pouštích, ale BVP jsou nákladná a pohyb v lesích, horách, džunglích a bažinách trpí.§!" # todo: CHANGED
 Drone_Recce_Comp: "Rota bezpilotního průzkumu" # todo: NEW TRANSLATION
 Drone_Recce_Comp_desc: "Rota bezpilotního průzkumu využívá malé bezpilotní letecké systémy k rozšíření pozorování za hranici přímé viditelnosti, čímž zlepšuje přehled o bojišti bez vystavení průzkumníků přímé palbě. Tyto drony mohou rychle prověřovat trasy, odhalovat nepřátelské pozice a potvrzovat cíle v komplikovaném terénu, což umožňuje rychlejší rozhodování a přesnější palbu.\n\n§GNápověda pro návrháře: Bezpilotní průzkum poskytuje vysoký průzkum a iniciativu, posiluje další průzkumné prvky a zlepšuje dělostřelecké útoky. Používejte jej v mobilních nebo obrněných divizích, které si mohou dovolit drony, ale zvyšuje šířku boje a spotřebu zásob, snižuje opevnění a špatně si vede ve městech a horách.§!" # todo: NEW TRANSLATION
 L_arm_Bat: "Rota lehkých tanků" # todo: CHANGED
 L_arm_Bat_desc: "Rota lehkých tanků používá speciální, často kolové lehké tanky, které kombinují neuvěřitelnou mobilitu s působivou zastavovací silou. V přímém boji si dokážou poradit se všemi typy pěchoty. Přímý boj však není jejich zamýšlenou úlohou — přibližují se k nepříteli, aby sledovaly a hlásily jeho činnost, a ke shromažďování informací používají průzkum drony i elektronický dohled. Mohou také provádět nájezdy a přepady důležitých nepřátelských objektů a mechanizovaných formací.\n\n§GTip pro návrháře: Lehké tanky poskytují rychlou obrněnou palebnou sílu a silné útoky na pláních a v pouštích. Využijte je k průzkumu silou a využití průlomů, ale jejich ochrana a přímá bojová síla jsou slabší a náročný terén výrazně snižuje jejich účinnost.§!" # todo: CHANGED
 A_L_arm_Bat: "Rota vzdušně přepravovaných lehkých tanků" # todo: NEW TRANSLATION
 A_L_arm_Bat_desc: "Rota lehkých tanků používá speciální, často kolové lehké tanky, které kombinují neuvěřitelnou mobilitu s ohromující zastavovací silou. V přímém boji se dokážou utkat se všemi druhy pěchoty. Přímý boj však není jejich zamýšlenou úlohou — pronikají do blízkosti nepřítele, aby pozorovaly a hlásily jeho činnost, a ke shromažďování informací používají průzkum pomocí dronů i elektronické sledování. Mohou také provádět nájezdy a přepady důležitých nepřátelských objektů a mechanizovaných formací. Tyto jednotky jsou schopny vzdušných operací s výsadkovými prvky a poskytují okamžitou blízkou obrněnou podporu.\n\n§GNápověda pro návrháře: Vzdušně přepravované lehké tanky poskytují výsadkovým formacím po seskoku mobilní pancéřování a protivozidlovou palebnou sílu. Používejte je k podpoře výsadkářů proti mobilnímu odporu v otevřeném terénu, ale specializovaná vozidla jsou nákladná a trpí silnými postihy v horách, džunglích, bažinách a městech.§!" # todo: NEW TRANSLATION
 armor_Recce_Comp: "Obrněná průzkumná společnost" # todo: NEW TRANSLATION
 armor_Recce_Comp_desc: "Obrněné průzkumné roty používají speciální průzkumné lehké tanky, které kombinují neuvěřitelnou mobilitu s působivou zastavovací silou. V přímém boji si dokážou poradit se všemi typy pěchoty. Přímý boj však není jejich zamýšlenou úlohou — přibližují se k nepříteli, aby sledovaly a hlásily jeho činnost, a ke shromažďování informací používají průzkum drony i elektronický dohled. Mohou také provádět nájezdy a přepady důležitých nepřátelských objektů a mechanizovaných formací. Průzkumné roty se často nazývají „eskadrony“ kvůli svému původu v bývalých jezdeckých jednotkách.\n\n§GTip pro návrháře: Obrněný průzkum poskytuje nejvyšší průzkum a iniciativu mezi konvenčními průzkumníky a zároveň přidává protitankovou mobilitu bez šířky boje. Použijte jej v tankových formacích na otevřeném terénu, ale průzkumné tanky a velitelské vybavení jsou nákladné a pohyb v lesích, horách, džunglích a bažinách prudce klesá.§!" # todo: CHANGED
 L_Engi_Comp: "Ženijní prapor" # todo: CHANGED
 L_Engi_Comp_desc: "Ženisté se kromě zneškodňování bomb věnují stavbě dočasných mostů a obranných perimetrů, kladení a odstraňování min. Nesou základní pěchotní výzbroj pro obranné účely.\n\n§GTip pro návrháře: Ženijní prapory zlepšují opevnění, pomáhají pěchotě útočit a bránit se v pevnostech, městech, lesích a bažinách a zlepšují obranu a pohyb v horách. Využijte je v obranných divizích nebo divizích pro náročný terén, ale přidávají šířku boje, živou sílu a vybavení a přispívají jen malou přímou palebnou silou.§!" # todo: CHANGED
 H_Engi_Comp: "Těžký ženijní prapor" # todo: CHANGED
 H_Engi_Comp_desc: "Ženisté se kromě zneškodňování bomb věnují stavbě dočasných mostů a obranných perimetrů, kladení a odstraňování min. Nesou základní pěchotní výzbroj pro obranné účely. Díky specializovaným konstrukčním a vyprošťovacím vozidlům jsou dobře vybaveni k obnově bojeschopnosti techniky vyřazené na frontě.\n\n§GTip pro návrháře: Těžké ženijní prapory poskytují větší opevnění a silnější bonusy k pevnostem, městům, horám a bažinám než standardní ženisté. Využijte je v cenných útočných nebo obranných formacích, ale jejich vysoké nároky na živou sílu a vybavení z nich činí nákladnou podpůrnou volbu.§!" # todo: CHANGED
 Arty_Bat: "Dělostřelectvo" # todo: NEW TRANSLATION
 Arty_Bat_desc: "Díky svým silným schopnostem nepřímé palby poskytuje dělostřelectvo trvalé přesné údery tam, kde jsou na bojišti potřeba, a daleko za hranicí viditelnosti. Jeho obsluha jej může přímo znovu nabíjet. Protože k přesunu vyžaduje externí vozidla, může být mezi údery obtížně pohyblivé, což jej činí zranitelným vůči nepřátelským dělostřeleckým protiúderům. Lehké systémy menší ráže lze tahat ručně a jsou vhodné pro výsadkové operace, protože se vejdou do transportních letadel.\n\n§GTip pro návrháře: Dělostřelectvo přidává značný měkký útok a lze jej vysadit padákem, takže je účinné proti silám založeným převážně na pěchotě. Využijte jej k poskytnutí útočné palebné síly pěším formacím, ale jeho nízká organizace a síla, přidaná šířka boje a postihy pohybu v náročném terénu vyžadují dostatek pěchoty k jeho ochraně.§!" # todo: CHANGED
 Arty_Battery: "Dělostřelectvá baterie" # todo: NEW TRANSLATION
 Arty_Battery_desc: "Díky svým silným schopnostem nepřímé palby poskytuje dělostřelectvo trvalé přesné údery tam, kde jsou na bojišti potřeba, a daleko za hranicí viditelnosti. Jeho obsluha jej může přímo znovu nabíjet. Protože k přesunu vyžaduje externí vozidla, může být mezi údery obtížně pohyblivé, což jej činí zranitelným vůči nepřátelským dělostřeleckým protiúderům. Lehké systémy menší ráže lze tahat ručně a jsou vhodné pro výsadkové operace, protože se vejdou do transportních letadel.\n\n§GTip pro návrháře: Dělostřelecká baterie přidává měkký útok bez šířky boje a za mnohem nižší náklady na vybavení než celý dělostřelecký prapor. Použijte ji jako úspornou palebnou podporu pro vhodné pěší formace, ale její velmi nízká organizace a postihy v náročném terénu omezují její hodnotu v nepodporovaných nebo vysoce mobilních divizích.§!" # todo: CHANGED
 SP_Arty_Bat: "Samohybná dělostřelecká jednotka" # todo: NEW TRANSLATION
 SP_Arty_Bat_desc: "Díky svým silným schopnostem nepřímé palby poskytuje samohybné dělostřelectvo trvalé přesné údery tam, kde jsou na bojišti potřeba, a daleko za hranicí viditelnosti. Jeho obsluha jej může přímo znovu nabíjet a vlastní pohon mu poskytuje mobilitu, takže se může přesouvat a vyhýbat protiúderům nepřátelského dělostřelectva.\n\n§GTip pro návrháře: Samohybné dělostřelectvo přidává silný měkký útok, drží krok s obrněnými formacemi a vyniká na pláních. Využijte jej k prolomení linií založených převážně na pěchotě, ale jeho nízká organizace, přidaná šířka boje, nákladný podvozek a postihy v náročném terénu vyžadují obrněnou ochranu a otevřený prostor.§!" # todo: CHANGED
 SP_Arty_Battery: "Samohybná dělostřelecká baterie" # todo: NEW TRANSLATION
 SP_Arty_Battery_desc: "Díky svým silným schopnostem nepřímé palby poskytuje samohybné dělostřelectvo trvalé přesné údery tam, kde jsou na bojišti potřeba, a daleko za hranicí viditelnosti. Jeho obsluha jej může přímo znovu nabíjet a vlastní pohon mu poskytuje mobilitu, takže se může přesouvat a vyhýbat protiúderům nepřátelského dělostřelectva.\n\n§GTip pro návrháře: Baterie samohybného dělostřelectva přidává mobilní měkký útok bez šířky boje. Použijte ji jako kompaktní palebnou podporu pro mobilní, obrněné, námořní nebo milicí formace, ale specializovaný podvozek je dražší než tažená děla a v horách, džunglích a bažinách se pohybuje špatně.§!" # todo: CHANGED
 SP_R_Arty_Bat: "Samohybná raketová dělostřelecká jednotka" # todo: NEW TRANSLATION
 SP_R_Arty_Bat_desc: "Raketometný prapor používající odpalovače MLRS dokáže z velké dálky zničit celou oblast. Používá se proti nepřátelskému týlu, protože jeho nerozlišující palba není vhodná pro přesné údery na bojišti. Vyžaduje speciální zásobovací vozidla a doba přebíjení je dlouhá.\n\n§GTip pro návrháře: Samohybné raketové dělostřelectvo poskytuje velmi vysoký měkký útok a průlom a v otevřeném terénu drží krok s mobilními formacemi. Využijte jej ke koncentrované útočné palebné síle, ale má nízkou organizaci, přidává šířku boje, vyžaduje nákladná raketová vozidla a v horách, džunglích, bažinách a městech si vede špatně.§!" # todo: CHANGED
 SP_R_Arty_Battery: "Samohybná raketová dělostřelecká baterie" # todo: NEW TRANSLATION
 SP_R_Arty_Battery_desc: "Raketometná baterie používající odpalovače MLRS dokáže z velké dálky zničit celé oblasti. Používá se proti nepřátelskému týlu, protože její nerozlišující palba není vhodná pro přesné údery na bojišti. Vyžaduje speciální zásobovací vozidla a doba přebíjení je dlouhá.\n\n§GTip pro návrháře: Raketometná baterie přidává silný mobilní měkký útok a určitý průlom bez šířky boje. Použijte ji ke kompaktní útočné podpoře v mobilních nebo obrněných divizích, ale raketová vozidla jsou nákladná, poskytují malou odolnost a v horách a bažinách ztrácejí mobilitu.§!" # todo: CHANGED
 SP_AA_Bat: "Samohybná protiletecká obrana" # todo: NEW TRANSLATION
 SP_AA_Bat_desc: "Prapor protivzdušné obrany používající samohybné protiletadlové raketové systémy krátkého nebo středního dosahu bude bránit svou jednotku před údery nepřátelské blízké letecké podpory.\n\n§GTip pro návrháře: Samohybná protivzdušná obrana poskytuje vysoký protiletadlový útok a mobilní ochranu obrněným formacím. Využijte ji, když nepřátelská letadla ohrožují cenné hroty útoku, ale přidává šířku boje, vyžaduje specializovaná vozidla, přispívá jen malou pozemní palebnou silou a v horách, džunglích a bažinách se pohybuje špatně.§!" # todo: CHANGED
 SP_AA_Battery: "Samohybná protiletecká baterie" # todo: NEW TRANSLATION
 SP_AA_Battery_desc: "Baterie protivzdušné obrany používající samohybné protiletadlové raketové systémy krátkého nebo středního dosahu bude bránit svou jednotku před údery nepřátelské blízké letecké podpory.\n\n§GTip pro návrháře: Baterie samohybné protivzdušné obrany přidává mobilní protiletadlový útok bez šířky boje. Použijte ji k ochraně mobilních, obrněných nebo námořních divizí pod nepřátelskou vzdušnou převahou, ale její specializovaný podvozek má proti pozemním silám malou hodnotu a v horách a bažinách je méně mobilní.§!" # todo: CHANGED
 combat_service_support_company: "Prapor bojového zabezpečení" # todo: CHANGED
 combat_service_support_company_desc: "Logistický a zdravotnický personál divize koordinuje distribuci zásob, evakuaci raněných a tok náhrad.\n\n§GTip pro návrháře: Bojové zabezpečení snižuje spotřebu zásob a paliva a zároveň díky zotavování raněných zachovává živou sílu a zkušenosti jednotky. Využijte jej ve velkých, zkušených nebo zásobování náročných divizích, ale přidává šířku boje a vybavení a výrazně snižuje přímé bojové statistiky.§!" # todo: CHANGED
 helicopter_combat_service_support: "Vrtulníkový prapor bojového zabezpečení" # todo: CHANGED
 helicopter_combat_service_support_desc: "Logistické a zdravotnické týmy přepravované vrtulníky zásobují rychle nasazené síly a evakuují raněné z předsunutých pozic.\n\n§GTip pro návrháře: Vrtulníkové bojové zabezpečení poskytuje lepší zotavování raněných a větší úspory zásob a paliva s menší náročností na živou sílu než pozemní podpora. Využijte jej pro nákladné leteckovýsadkové nebo rychlé formace, ale transportní vrtulníky jsou drahé, přidává šířku boje a jeho bojový přínos je minimální.§!" # todo: CHANGED
 L_Marine_Cdo_Bat: "Námořní komandové" # todo: CHANGED
 L_Marine_Cdo_Bat_desc: "Námořní komandové jsou větší formace námořních průzkumníků vycvičené k provádění útočných akcí typu udeř a uteč i dalších úkolů lehké pěchoty.\n\n§GTip pro návrháře: Námořní komandové kombinují vysokou organizaci s vynikajícími útoky při obojživelných operacích, v bažinách, lesích a městech. Využijte je k elitním nájezdům a sporným vyloděním, ale jejich limit speciálních sil, dlouhý výcvik, lehké vybavení a slabší útoky v otevřeném terénu omezují masové nasazení.§!" # todo: CHANGED
 air_assault_Arty_Bat: "Výsadkové dělostřelectvo" # todo: NEW TRANSLATION
 air_assault_Arty_Bat_desc: "Celý prapor tažených dělostřeleckých kusů přepravovaných vrtulníky pomocí podvěsu. Poskytuje trvalou nepřímou palebnou podporu vzdušně výsadkovým operacím a díky rychlému přesunu vzduchem drží krok s pěchotou vzdušného výsadku.\n\n§GNápověda pro návrháře: Výsadkové dělostřelectvo přidává vrtulníkovým formacím značný měkký útok a dobře si vede v kopcích, horách, lesích, džunglích a městech. Používejte je k podpoře vzdušných výsadků v obtížném terénu, ale zvyšuje šířku boje, má nízkou organizovanost a sílu a vyžaduje nákladné transportní vrtulníky.§!" # todo: NEW TRANSLATION
 air_assault_Arty_Battery: "Vzdušně mobilní dělostřelecká baterie" # todo: NEW TRANSLATION
 air_assault_Arty_Battery_desc: "Tyto jednotky používají tažená děla a zvyšují svou mobilitu zavěšením děl pod vrtulníky, což jim umožňuje držet krok s rychlejšími leteckovýsadkovými pěšími jednotkami.\n\n§GTip pro návrháře: Leteckovýsadková dělostřelecká baterie přidává měkký útok bez šířky boje a nejlépe si vede v kopcích, horách, lesích, džunglích a městech. Použijte ji jako kompaktní palebnou podporu pro leteckovýsadkové nebo námořní formace, ale vrtulníky a dělostřelecké vybavení jsou nákladné a vyniká méně na pláních a v pouštích.§!" # todo: CHANGED
 drone_tactical_company: "FPV droneová společnost" # todo: NEW TRANSLATION
 drone_tactical_company_desc: "Tyto jednotky používají FPV drony s pevnými křídly a kvadrokoptéry k průzkumu a cíleným úderům na podporu svých frontových jednotek.\n\n§GTip pro návrháře: Rota FPV dronů přidává účinný měkký a tvrdý útok bez šířky boje a lze ji vysadit padákem. Využijte ji jako flexibilní palebnou podporu v divizích schopných zásobovat pozemní drony, ale má téměř nulovou organizaci a vyžaduje značné množství dronového vybavení pro omezenou odolnost.§!" # todo: CHANGED
 group_headquarters_title: "Velitelství" # todo: NEW TRANSLATION
 group_headquarters_title_desc: "Velitelské jednotky vybavené k vedení jednotek do bitvy" # todo: NEW TRANSLATION
 light_inf_hq: "Velitelství lehké pěchoty" # todo: NEW TRANSLATION
 light_inf_hq_desc: "Velitelský prvek pro lehkou a motorizovanou pěchotu" # todo: NEW TRANSLATION
 arm_inf_hq: "Pancéřované pěchotní velitelství" # todo: NEW TRANSLATION
 arm_inf_hq_desc: "Velitelský prvek pro mechanizovanou a obrněnou pěchotu." # todo: CHANGED
 arm_hq: "Obrněné velitelství" # todo: CHANGED
 arm_hq_desc: "Velitelský prvek pro lehké tanky a hlavní bojové tanky" # todo: CHANGED
 helo_hq: "Vrtulníkové velitelství" # todo: NEW TRANSLATION
 helo_hq_desc: "Velitelský prvek pro vrtulníkové jednotky" # todo: NEW TRANSLATION
 group_light_bat_title: "Jednotky s podstavem" # todo: NEW TRANSLATION
 group_light_bat_title_desc: "Bojové prvky s podstavem určené k násobení sil, se sníženými schopnostmi, ale kratší dobou a nižšími náklady výcviku." # todo: NEW TRANSLATION
 Light_Mech_Inf_Bat: "Mechanizovaný pěší prapor s podstavem" # todo: NEW TRANSLATION
 Light_Mech_Inf_Bat_desc: "Mechanizovaný prvek s podstavem používá malý počet obrněných transportérů k posílení formace bez zabrání běžného úseku fronty.\n\n§GNápověda pro návrháře: Mechanizovaná pěchota s podstavem přidává ochranu transportéry a obranu bez zvýšení šířky boje. Používejte ji k posílení vhodných formací v rovinách, kopcích nebo městech, ale náklady na vozidla, nízká síla a silné postihy v horách, džunglích, bažinách, u řek a při obojživelných útocích omezují její samostatnou bojovou hodnotu.§!" # todo: NEW TRANSLATION
 Light_Arm_Inf_Bat: "Obrněný pěší prapor s podstavem" # todo: NEW TRANSLATION
 Light_Arm_Inf_Bat_desc: "Obrněný pěší prvek s podstavem používá malý počet bojových vozidel pěchoty k přidání chráněné palebné síly bez zabrání běžného úseku fronty.\n\n§GNápověda pro návrháře: Obrněná pěchota s podstavem přidává pancéřování a palebnou sílu bojových vozidel pěchoty bez zvýšení šířky boje a nejlépe si vede v rovinách a pouštích. Používejte ji k posílení cenných formací, ale její nízká organizovanost, nákladná vozidla a extrémní postihy v členitém terénu, u řek a při obojživelných útocích z ní činí vysoce specializovanou jednotku.§!" # todo: NEW TRANSLATION
 Light_L_Air_assault_Bat: "Pěší prapor vzdušného výsadku s podstavem" # todo: NEW TRANSLATION
 Light_L_Air_assault_Bat_desc: "Pěchota vzdušného výsadku je elitní pěchota se zvláštním výcvikem v slaňování a letecké přepravě; její vybavení je někdy navrženo nebo upraveno v poli tak, aby umožňovalo lepší přepravu v letadlech. Často se používá k obsazení a držení klíčového terénu, který ještě nebyl plně zajištěn, a k přímému boji s nepřátelskými silami za jejich liniemi.\n\n§GNápověda pro návrháře: Tento prvek vzdušného výsadku s podstavem přidává organizovanost a silné bonusy ve městech, horách, lesích, džunglích a bažinách bez zvýšení šířky boje. Používejte jej k posílení specializovaných formací v obtížném terénu, ale jeho požadavek na vrtulníky je nákladný a v rovinách, pouštích a při obojživelných útocích si vede špatně.§!" # todo: NEW TRANSLATION
 Light_attack_helo_bat: "Pluk bitevních vrtulníků s podstavem" # todo: NEW TRANSLATION
 Light_attack_helo_bat_desc: "Malý prvek bitevních vrtulníků poskytuje rychlou podporu bojových vrtulníků bez nároků celého pluku.\n\n§GNápověda pro návrháře: Bitevní vrtulníky s podstavem přidávají rychlou obrněnou palebnou sílu bez zvýšení šířky boje a vynikají v rovinách a pouštích. Používejte je jako kompaktní mobilní podporu, ale jejich velmi nízká organizovanost a síla, drahé letouny a silné postihy v horách, džunglích, bažinách a městech ztěžují nahrazování ztrát.§!" # todo: NEW TRANSLATION
 Light_armor_Bat: "Tankový prapor s podstavem" # todo: NEW TRANSLATION
 Light_armor_Bat_desc: "Tankový prvek s podstavem soustřeďuje omezený počet hlavních bojových tanků k posílení formace bez zabrání běžného úseku fronty.\n\n§GNápověda pro návrháře: Tanky s podstavem přidávají pancéřování, průlom a silné útoky v rovinách a pouštích bez zvýšení šířky boje. Používejte je k hospodárnému posílení útočných formací, ale jejich nízká organizovanost a síla, cena tanků a extrémní postihy v obtížném terénu a městech z nich činí špatnou univerzální podporu.§!" # todo: NEW TRANSLATION
 Light_L_arm_Bat: "Prapor lehkých tanků s podstavem" # todo: NEW TRANSLATION
 Light_L_arm_Bat_desc: "Prvek lehkých tanků s podstavem poskytuje mobilní protitankovou palebnou sílu a průzkum silou s menším počtem vozidel.\n\n§GNápověda pro návrháře: Lehké tanky s podstavem přidávají mobilní protitankovou palebnou sílu bez zvýšení šířky boje a vynikají v rovinách a pouštích. Používejte je k posílení rychlých formací proti vozidlům, ale jejich nízká síla, specializovaný podvozek a silné postihy v obtížném terénu, u řek a při obojživelných útocích omezují jejich pružnost.§!" # todo: NEW TRANSLATION
 Light_SP_Arty_Bat: "Prapor samohybného dělostřelectva s podstavem" # todo: NEW TRANSLATION
 Light_SP_Arty_Bat_desc: "Zmenšený prvek samohybného dělostřelectva poskytuje mobilní nepřímou palbu s menším počtem vozidel než celý prapor.\n\n§GNápověda pro návrháře: Samohybné dělostřelectvo s podstavem přidává mobilní měkký útok bez zvýšení šířky boje a obzvlášť dobře si vede v rovinách, pouštích a městech. Používejte je jako kompaktní útočnou podporu, ale má téměř nulovou organizovanost, nízkou sílu, nákladný specializovaný podvozek a slabší výkon v lesích, horách a džunglích.§!" # todo: NEW TRANSLATION
 Light_SP_R_Arty_Bat: "Prapor samohybného raketového dělostřelectva s podstavem" # todo: NEW TRANSLATION
 Light_SP_R_Arty_Bat_desc: "Zmenšený prvek salvových raketometů poskytuje soustředěnou plošnou palbu s menším počtem vozidel než celý prapor.\n\n§GNápověda pro návrháře: Raketové dělostřelectvo s podstavem přidává silný mobilní měkký útok bez zvýšení šířky boje a vyniká v rovinách, pouštích a městech. Používejte je k posílení útočných formací, ale jeho zanedbatelná organizovanost, nízká síla, náklady na raketová vozidla a postihy v obtížném terénu vyžadují ochranu.§!" # todo: NEW TRANSLATION
 Light_SP_AA_Bat: "Prapor samohybné protivzdušné obrany s podstavem" # todo: NEW TRANSLATION
 Light_SP_AA_Bat_desc: "Zmenšený prvek samohybné protivzdušné obrany chrání formaci malým počtem mobilních protiletadlových systémů.\n\n§GNápověda pro návrháře: Samohybná protivzdušná obrana s podstavem přidává protiletadlový útok bez zvýšení šířky boje a s malými nároky na živou sílu. Používejte ji ke kompaktní ochraně mobilních formací pod nepřátelskou vzdušnou převahou, ale má téměř nulovou organizovanost, nízkou sílu a vyžaduje specializovaná protiletadlová vozidla, která poskytují jen malou pozemní palebnou sílu.§!" # todo: NEW TRANSLATION
 medium_walker_battalion: "Prapor středních chodců" # todo: NEW TRANSLATION
 medium_walker_battalion_desc: "Prapor středních chodců, navržený jako univerzální páteř formací chodců, kombinuje vyváženou ochranu, mobilitu a kapacitu nákladu pro přímý boj.\n\n§GNápověda pro návrháře: Střední chodci poskytují pružnou obrněnou sílu první linie určenou vybaveným podvozkem chodce. Používejte je jako univerzální jádro formací chodců, ale jejich velká šířka boje, nízká organizovanost, dlouhý výcvik a vysoké nároky na podvozky činí jejich nasazení a nahrazování nákladným.§!" # todo: NEW TRANSLATION
 light_walker_tank_battalion: "Prapor lehkých chodců" # todo: NEW TRANSLATION
 light_walker_tank_battalion_desc: "Prapor lehkých chodců, postavený na protitankových podvozcích chodců, se zaměřuje na lov obrněných cílů a využívání mezer spíše než na dlouhodobý boj v linii.\n\n§GNápověda pro návrháře: Lehké chodce specializované na obrněné cíle zajišťují podvozky chodců-stíhačů tanků. Používejte je, když nepřátelské pancéřování vyžaduje soustředěný průbojnostní a tvrdý útok, ale jejich velká šířka boje, nízká organizovanost, dlouhý výcvik a cena specializovaných podvozků je činí neefektivními proti měkkým cílům.§!" # todo: NEW TRANSLATION
 heavy_walker_tank_battalion: "Prapor těžkých chodců" # todo: NEW TRANSLATION
 heavy_walker_tank_battalion_desc: "Prapory těžkých chodců nesou dělostřeleckou výzbroj na mohutných kráčejících platformách a poskytují chráněnou palebnou podporu hlavní formaci.\n\n§GNápověda pro návrháře: Těžcí chodci poskytují obrněnou dělostřeleckou palebnou sílu z dělostřeleckých podvozků chodců. Používejte je k přidání silné podpory proti pěchotě a opevněným liniím, ale jejich velká šířka boje, nízká organizovanost, dlouhý výcvik a nákladné specializované podvozky vyžadují dobře podporovanou formaci.§!" # todo: NEW TRANSLATION
 light_medium_walker_battalion: "Prapor středních chodců (lehký)" # todo: NEW TRANSLATION
 light_medium_walker_battalion_desc: "Zmenšený prvek středních chodců posiluje formaci malým počtem univerzálních podvozků chodců.\n\n§GNápověda pro návrháře: Střední chodci s podstavem přidávají pružnou obrněnou sílu s menší šířkou boje a mnohem menším počtem podvozků než celý prapor chodců. Používejte je, když výroba nedokáže uživit celý prvek, ale zachovávají si nízkou organizovanost, dlouhý výcvik a omezenou výdrž.§!" # todo: NEW TRANSLATION
 light_light_walker_tank_battalion: "Prapor lehkých chodců (lehký)" # todo: NEW TRANSLATION
 light_light_walker_tank_battalion_desc: "Zmenšený prvek lehkých chodců poskytuje malou sílu protitankových platforem chodců pro cílené posílení.\n\n§GNápověda pro návrháře: Lehčí chodci s podstavem přidávají soustředěnou protitankovou sílu s menší šířkou boje a menším počtem podvozků stíhačů tanků. Používejte je k posílení divizí proti obrněným cílům, ale zachovávají si nízkou organizovanost, dlouhý výcvik a úzkou úlohu proti měkkým cílům.§!" # todo: NEW TRANSLATION
 light_heavy_walker_tank_battalion: "Prapor těžkých chodců (lehký)" # todo: NEW TRANSLATION
 light_heavy_walker_tank_battalion_desc: "Zmenšený prvek těžkých chodců poskytuje kráčející platformy s dělostřeleckou výzbrojí bez nároků celého praporu.\n\n§GNápověda pro návrháře: Těžcí chodci s podstavem přidávají obrněnou dělostřeleckou palebnou sílu s menší šířkou boje a menším počtem podvozků než celý prvek. Používejte je jako kompaktní palebnou podporu, ale jejich nízká organizovanost, dlouhý výcvik a specializované dělostřelecké podvozky zůstávají nákladné.§!" # todo: NEW TRANSLATION
 space_artillery_support_company: "Rota vesmírné dělostřelecké podpory" # todo: NEW TRANSLATION
 space_artillery_support_company_desc: "Rota vesmírné dělostřelecké podpory využívá dělostřelecké projektily odpalované z orbitálních platforem k přesnému bombardování bojiště z vesmíru na cíle daleko za dosahem konvenčních systémů. Tyto údery mohou rychle potlačit opevněné pozice, zničit cenné objekty a rozbít nepřátelská soustředění s minimálním varováním.\n\n§GNápověda pro návrháře: Vesmírné dělostřelectvo zdvojnásobuje příspěvek dělostřeleckých praporů k útoku bez zvýšení šířky boje a lze jej vysadit padákem. Používejte je k zesílení formací s množstvím dělostřelectva, ale jeho vzácné vybavení pro řízení z oběžné dráhy, dlouhý výcvik a slabé samostatné bojové statistiky z něj činí plýtvání v divizích s malým množstvím dělostřelectva.§!" # todo: NEW TRANSLATION
 space_artillery_equipment_type: "Orbitální relé řízení palby" # todo: NEW TRANSLATION
 space_artillery_equipment_type_desc: "Odolné komunikační a zaměřovací relé určené k vyžádání, koordinaci a potvrzení orbitálních dělostřeleckých úderů v reálném čase. Propojuje pozorovatele v první linii s bateriemi ve vesmíru a umožňuje rychlé palebné úkoly, přesné načasování a spolehlivé oddělení palby od vlastních sil. Systém je nákladný a náročný na suroviny, ale bez něj zůstává orbitální palebná síla slepá, pomalá a nebezpečně neefektivní." # todo: NEW TRANSLATION
 space_artillery_equipment_1: "$space_artillery_equipment_type$ I" # todo: NEW TRANSLATION
 space_artillery_equipment_1_desc: "$space_artillery_equipment_type_desc$" # todo: NEW TRANSLATION
 HACS_Mech: "Bojový systém s vysokou obratností 1. generace" # todo: NEW TRANSLATION
 HACS_Mech_desc: "Bojový systém s vysokou obratností první generace kombinuje pokročilé pancéřování, výzbroj a mobilitu ve vzdušně nasaditelné bojové platformě.\n\n§GNápověda pro návrháře: HACS první generace poskytují velmi vysokou organizovanost, sílu, všestrannou palebnou sílu a schopnost výsadku s padákem a silnými bonusy v kopcích a rovinách. Používejte je jako elitní obrněné hroty útoku, ale jejich velká šířka boje, velmi dlouhý výcvik, vzácné vybavení a postihy v lesích a džunglích činí neopatrné ztráty závažnými.§!" # todo: NEW TRANSLATION
 HACS_Mech_2: "Bojový systém s vysokou obratností 2. generace" # todo: NEW TRANSLATION
 HACS_Mech_2_desc: "Bojový systém s vysokou obratností druhé generace zlepšuje ochranu, zbraňové systémy a výdrž na bojišti při zachování pružnosti strategického nasazení.\n\n§GNápověda pro návrháře: HACS druhé generace zlepšují organizovanost, sílu a průlom a zachovávají schopnost výsadku i pobřežní evakuace. Používejte je pro elitní útoky v kopcích, rovinách, pouštích a bažinách, ale jejich velká šířka boje, vzácné vybavení, dlouhý výcvik a přetrvávající postih v džunglích vyžadují uvážlivé nasazení.§!" # todo: NEW TRANSLATION
 HACS_Mech_3: "Bojový systém s vysokou obratností 3. generace" # todo: NEW TRANSLATION
 HACS_Mech_3_desc: "Bojový systém s vysokou obratností třetí generace kombinuje pokročilou ochranu, modulární výzbroj a mimořádnou výdrž na bojišti.\n\n§GNápověda pro návrháře: HACS třetí generace nabízejí mimořádnou organizovanost, sílu, opevnění, širokou palebnou sílu, schopnost výsadku a silné bonusy v terénu. Používejte je pro nejnáročnější obrněné operace, ale jejich velká šířka boje, dlouhý výcvik a nenahraditelné pokročilé vybavení stále tvrdě trestají opotřebení.§!" # todo: NEW TRANSLATION
 ALN_bellatoris: "Bellatoris" # todo: NEW TRANSLATION
 ALN_bellatoris_desc: "Bellatoris je frontový bojovník roje Chimér, vyšlechtěný pro neúnavný boj zblízka. Rychlý a agresivní překonává obranné linie samotným počtem a zuřivostí.\n\n§GNápověda pro návrháře: Bellatoris kombinují velmi vysokou organizovanost a sílu s vyváženými útoky, obranou, průlomem a rychlým výcvikem. Používejte je jako univerzální liniové jednotky Chimér v lesích, kopcích, bažinách, rovinách a pouštích, ale nemají protiletadlový útok a trpí v horách a džunglích.§!" # todo: NEW TRANSLATION
 ALN_brachionis: "Brachionis" # todo: NEW TRANSLATION
 ALN_brachionis_desc: "Brachionis je vícekončetinová Chiméra určená k uchopení a roztrhání obrněných cílů z bezprostřední blízkosti.\n\n§GNápověda pro návrháře: Brachionis obětují část obrany za vyšší měkký a tvrdý útok při zachování vysoké organizovanosti a rychlého výcviku. Používejte je jako agresivní útočné jednotky v otevřeném terénu, ale v horách a džunglích zůstávají slabší.§!" # todo: NEW TRANSLATION
 ALN_gravis: "Gravis" # todo: NEW TRANSLATION
 ALN_gravis_desc: "Gravis je nejtěžší kmen Chiméry, obrněná masa, která ukotvuje postup roje a silou proráží opevněné pozice.\n\n§GNápověda pro návrháře: Gravis poskytují nejsilnější útoky Chimér, průlom a iniciativu při vysoké organizovanosti a rychlém výcviku. Používejte je jako útočné kotvy v otevřeném terénu, ale spotřebovávají více zásob, mají nižší obranu a organizovanost než lehčí kmeny a trpí v horách a džunglích.§!" # todo: NEW TRANSLATION
 Weapons_company: "Rota zbraní" # todo: NEW TRANSLATION
 Weapons_company_desc: "Rota zbraní sestávající z pěchotních podpůrných zbraní s přímou palbou, jako jsou obsluhy univerzálních a těžkých kulometů, obsluhy granátometných kulometů a další těžké pěchotní zbraně s přímou palbou. Tato rota je určena k poskytování podpůrné palby libovolnému pěchotnímu prvku, kterému je přidělena, napříč širokou škálou sil.\n\n§GNápověda designéra: Rota zbraní přidává široké bonusy k parametrům přímé palby, zejména průbojnosti, bez bojové šířky. Použijte ji k posílení univerzální pěchoty, ale její značná spotřeba pěchotního vybavení a postih k opevnění ji činí méně atraktivní pro levné statické obránce.§!" # todo: NEW TRANSLATION
 Heavy_mortar_company: "Minometná rota" # todo: NEW TRANSLATION
 Heavy_mortar_company_desc: "Minomety jsou určeny k poskytování rychlé, integrované palebné podpory liniovým jednotkám bez potřeby přidělení vyšších velitelství. Tyto minomety poskytují liniovým jednotkám nepřímou palebnou podporu za mnohem nižší cenu, než jakou by vyžadovala plnohodnotná dělostřelecká jednotka.\n\n§GNápověda designéra: Minometná rota poskytuje silný měkký útok bez dělostřeleckého vybavení nebo bojové šířky. Použijte ji jako levnou integrovanou palebnou podporu proti pěchotě, ale nabízí jen malý tvrdý útok či průbojnost a snižuje opevnění.§!" # todo: NEW TRANSLATION
 Sniper_company: "Odstřelovačská rota" # todo: NEW TRANSLATION
 Sniper_company_desc: "Odstřelovačská rota vybavená přesnými střelci pracujícími ve dvojicích pozorovatele a střelce poskytuje dálkovou selektivní palbu proti vysoce hodnotným cílům, jako jsou důstojníci, obsluhy a komunikační týmy. Vyniká v obtěžování a narušování nepřátelských formací z úkrytu, čímž snižuje jejich účinnost a zároveň zůstává obtížně odhalitelná a zasažitelná.\n\n§GNápověda designéra: Odstřelovačská rota přidává měkký útok a průzkum a zvyšuje iniciativu průzkumných prvků a palebnou sílu dělostřelectva. Použijte ji proti pěchotě a pro lepší koordinaci na bojišti, ale přidává bojovou šířku a má velmi slabý průlom, tvrdý útok a průbojnost.§!" # todo: NEW TRANSLATION
 AT_company: "Pěchotní protitanková rota" # todo: NEW TRANSLATION
 AT_company_desc: "Tato protitanková rota vybavená pěchotními protitankovými zbraněmi je určena ke spolupráci zejména s lehkými pěchotními prvky. Snadno působí v městských oblastech, lesích a dalších opevněných či těsných prostorech. Tento tým dokáže snadno napadat nepřátelské obrněné prvky a poté znovu zmizet ve svých opevněných pozicích.\n\n§GNápověda designéra: Pěchotní protitanková rota přidává vysoký tvrdý útok a průbojnost bez bojové šířky pěším, výsadkovým, námořním a speciálním formacím. Použijte ji, když tyto divize musí odolávat obrněncům, ale oslabuje ostatní bojové parametry a zvyšuje náklady na specializované vybavení.§!" # todo: NEW TRANSLATION
 Mot_AT_company: "Vozidlová protitanková rota" # todo: NEW TRANSLATION
 Mot_AT_company_desc: "Rota zaměřená na protitankové operace, která působí z palebných postavení na vozidlech. Tato rota je určena především pro rychlost, aby dokázala držet krok s rychle se pohybujícími mobilními a obrněnými prvky a zároveň poskytovala zvýšené protitankové schopnosti.\n\n§GNápověda designéra: Vozidlová protitanková rota přidává vysoký tvrdý útok a průbojnost, aniž by zpomalovala mobilní formace. Použijte ji v motorizovaných, obrněných, výsadkových či námořních divizích čelících tankům, ale těžké protitankové zbraně a užitková vozidla ji prodražují a proti měkkým cílům přispívá jen málo.§!" # todo: NEW TRANSLATION
 AA_company: "Protiletadlová rota" # todo: NEW TRANSLATION
 AA_company_desc: "Prvek vybavený speciálně k napadání nepřátelských leteckých sil a k obraně proti nepřátelským vrtulníkům a dalším letounům.\n\n§GNápověda designéra: Protiletadlová rota poskytuje silný letecký útok bez bojové šířky. Použijte ji k ochraně divizí působících pod nepřátelskou vzdušnou převahou, ale v pozemním boji je slabá a spotřebovává specializované protiletadlové vybavení, které má jen malou hodnotu, když je obloha bezpečná.§!" # todo: NEW TRANSLATION
 Combat_engineer_company: "Rota ženistů" # todo: NEW TRANSLATION
 Combat_engineer_company_desc: "Bojoví ženisté provádějí útočné ženijní práce v přímé podpoře liniových jednotek. Jsou vycvičeni a vybaveni k překonávání obtížného terénu, jako jsou řeky či protitankové příkopy. Jsou také vybaveni k prorážení minových polí a dalších obranných překážek a k uvolňování tras, aby jimi mohly ostatní bojové síly nerušeně postupovat.\n\n§GNápověda designéra: Bojoví ženisté přidávají obranu, průlom a mírné bonusy k útoku a obraně v lesích, horách, džunglích a městech bez bojové šířky. Použijte je k útokům obtížným terénem, ale vyžadují značné množství pěchotního vybavení a na otevřeném prostranství poskytují menší specializovanou hodnotu.§!" # todo: NEW TRANSLATION
 pathfinder_company: "Rota průzkumníků výsadku" # todo: NEW TRANSLATION
 pathfinder_company_desc: "Elitní skupiny výsadkářů vycvičené k seskoku před zahájením vzdušných operací, aby nalezly nejbezpečnější zóny vysazení a shromaždiště. Tito elitní vojáci zajišťují kritické velení a řízení během klíčových částí každé výsadkové či vzdušně mobilní operace.\n\n§GNápověda designéra: Průzkumníci výsadku zlepšují organizaci a měkký útok výsadkové pěchoty a mohou být vysazeni padákem. Použijte je k posílení výsadkových či vzdušně mobilních útočných divizí, ale přidávají bojovou šířku, jsou omezeni na tyto formace a poskytují jen malou přímou bojovou sílu.§!" # todo: NEW TRANSLATION
 amphibious_landing_detachment: "Námořní výsadkové družstvo" # todo: NEW TRANSLATION
 amphibious_landing_detachment_desc: "Prvky přidělené námořnictvem, které umožňují rychlé a účinné obojživelné výsadkové operace. Tyto jednotky vybavené specializovanými výsadkovými loděmi a vybavením usnadňují rychlé operace z lodi na břeh či výsadky mimo dohled pobřeží. Cenou za přidělení jedné z těchto jednotek je však snížení schopností provádět neobojživelné operace.\n\n§GNápověda designéra: Námořní výsadkové družstvo výrazně zlepšuje útok, obranu a pohyb při obojživelných operacích námořních formací. Použijte je v divizích určených k útoku na pláže, ale přidává bojovou šířku, živou sílu a vybavení a uvaluje silné bojové postihy téměř ve všech typech pozemního terénu.§!" # todo: NEW TRANSLATION
 combat_maintenance_company: "Údržbová rota" # todo: NEW TRANSLATION
 combat_maintenance_company_desc: "Údržbová rota udržuje vozidla a těžké vybavení formace v boji, provádí opravy v poli a obnovuje poškozené platformy, než budou definitivně ztraceny. Obnovou bojeschopnosti vozidel poblíž fronty udržuje obrněnou sílu během dlouhých operací a snižuje ztráty způsobené opotřebením.\n\n§GNápověda designéra: Údržba zlepšuje spolehlivost, obnovu a ukořisťování vybavení u divizí s velkým podílem vozidel. Použijte ji k omezení opotřebení a zachování drahého vybavení během dlouhých operací, ale přidává bojovou šířku, živou sílu a užitková vozidla a poskytuje jen malou přímou palebnou sílu.§!" # todo: NEW TRANSLATION
 airmobile_maintenance_company: "Vzdušně mobilní údržbová rota" # todo: NEW TRANSLATION
 airmobile_maintenance_company_desc: "Údržbový prvek určený k podpoře vzdušně mobilních a vrtulníkových sil, s lehčím a lépe přepravitelným nářadím potřebným k udržení vrtulníkových a rychle nasazovaných jednotek v provozu. Obnovuje poškozené vybavení v předsunutých oblastech a udržuje tempo vzdušně útočných operací daleko od zavedených skladů.\n\n§GNápověda designéra: Vzdušně mobilní údržba zlepšuje ukořisťování vybavení a spolehlivost a drží krok s vrtulníkovými formacemi. Použijte ji k uchování nákladného vrtulníkového vybavení, ale nabízí menší obnovu než pozemní údržba, přidává bojovou šířku a vyžaduje mnoho transportních vrtulníků.§!" # todo: NEW TRANSLATION
 communications_company: "Komunikační rota" # todo: NEW TRANSLATION
 communications_company_desc: "Komunikační rota udržuje rádiové, datové a velitelské sítě, které spojují formaci, a zajišťuje spolehlivý tok rozkazů a hlášení napříč bojištěm. Robustní komunikace zlepšují koordinaci a reakční dobu a zvyšují odolnost formace proti rušení a elektronickému narušení.\n\n§GNápověda designéra: Komunikační rota zlepšuje organizaci, obnovu a iniciativu předních praporů. Použijte ji ve velkých či cenných bojových divizích, kterým prospívá koordinace, ale přidává bojovou šířku a značné náklady na vybavení velení a řízení, přičemž poskytuje jen malou přímou palebnou sílu.§!" # todo: NEW TRANSLATION
 military_police_attachment: "Vojenská policie" # todo: NEW TRANSLATION
 military_police_attachment_desc: "Vojenská policie řídí dopravu, zajišťuje týl a stará se o zajatce, čímž umožňuje liniovým jednotkám soustředit se na boj. Udržováním pořádku na zásobovacích trasách a zabezpečením týlu proti infiltrátorům a opozdilcům zachovává disciplínu a zajišťuje plynulý pohyb formace.\n\n§GNápověda designéra: Vojenská policie násobí potlačení pěchoty a přidává další potlačení bez bojové šířky. Použijte ji v okupačních šablonách a šablonách pro zabezpečení týlu, ale její náklady na živou sílu a vybavení přinášejí frontovým bojovým divizím jen malý užitek.§!" # todo: NEW TRANSLATION
 hq_support_company: "Rota podpory velitelství" # todo: NEW TRANSLATION
 hq_support_company_desc: "Rota podpory velitelství poskytuje velitelský personál, komunikaci, dopravu a bezpečnost potřebné k řízení polní formace.\n\n§GNápověda designéra: Rota podpory velitelství zlepšuje bonusy, které nasazený velitel získává ze své schopnosti. Jde o univerzální volbu pro šablonu armádního velitelství, ale přidává bojovou šířku, živou sílu a vybavení bez specializovaných bojových či operačních bonusů.§!" # todo: NEW TRANSLATION
 hq_engineer: "Ženijní rota velitelství" # todo: NEW TRANSLATION
 hq_engineer_desc: "Ženijní rota velitelství koordinuje prorážení, opevňování a práce na mobilitě napříč formací.\n\n§GNápověda designéra: Ženijní rota velitelství zlepšuje poškození opevnění a obranu proti obojživelnému vylodění a zároveň přidává opevnění a průlom. Použijte ji při obléhání, obranných či pobřežních operacích, ale přidává bojovou šířku a poskytuje jen omezenou přímou palebnou sílu.§!" # todo: NEW TRANSLATION
 hq_recon: "Průzkumná rota velitelství" # todo: NEW TRANSLATION
 hq_recon_desc: "Průzkumná rota velitelství shromažďuje a předává velitelskému personálu informace o terénu a nepříteli.\n\n§GNápověda designéra: Průzkumná rota velitelství zlepšuje průzkum a zkušenosti s terénními vlastnostmi nasazeného velitele a zároveň přidává průzkum velitelství. Použijte ji v mobilních či na terén zaměřených velitelstvích, ale přidává bojovou šířku a jen malou přímou bojovou sílu.§!" # todo: NEW TRANSLATION
 hq_maintenance: "Údržbová rota velitelství" # todo: NEW TRANSLATION
 hq_maintenance_desc: "Údržbová rota velitelství koordinuje obnovu, opravy a záchranu vybavení napříč formací.\n\n§GNápověda designéra: Údržbová rota velitelství snižuje opotřebení a zlepšuje ukořisťování vybavení nasazeného velitele a zároveň přidává spolehlivost a ukořisťování vybavení velitelství. Použijte ji ve velitelstvích s velkou spotřebou vybavení, ale přidává bojovou šířku a má slabé bojové parametry.§!" # todo: NEW TRANSLATION
 hq_logistics: "Logistická rota velitelství" # todo: NEW TRANSLATION
 hq_logistics_desc: "Logistická rota velitelství plánuje distribuci zásob a přesun paliva pro formaci.\n\n§GNápověda designéra: Logistická rota velitelství snižuje spotřebu zásobování nasazeného velitele a spotřebu paliva velitelství. Použijte ji na frontách s omezeným zásobováním či vysokou spotřebou paliva, ale přidává bojovou šířku a jen malou bojovou sílu.§!" # todo: NEW TRANSLATION
 hq_naval_liaison: "Námořní styčná rota velitelství" # todo: NEW TRANSLATION
 hq_naval_liaison_desc: "Námořní styčné týmy propojují velitelství s veliteli flotil a podpůrnými sítěmi mezi loděmi a pobřežím.\n\n§GNápověda designéra: Námořní styčná rota velitelství zlepšuje pobřežní bombardování, obojživelnou invazi a dobu bez postihu zásobování námořní pěchoty pro nasazeného velitele. Použijte ji při pobřežních a obojživelných taženích, ale ve vnitrozemí poskytuje jen malý užitek.§!" # todo: NEW TRANSLATION
 hq_air_liaison: "Letecká styčná rota velitelství" # todo: NEW TRANSLATION
 hq_air_liaison_desc: "Letecké styčné týmy koordinují velitelství s transportními, blízkými podpůrnými a stíhacími formacemi.\n\n§GNápověda designéra: Letecká styčná rota velitelství zkracuje přípravu vzdušné invaze a zlepšuje odolnost proti blízké letecké podpoře a bojový přínos vzdušné převahy. Použijte ji tam, kde záleží na koordinaci letectva a pozemních sil, ale přidává bojovou šířku a neposkytuje žádnou významnou pozemní palebnou sílu.§!" # todo: NEW TRANSLATION
 hq_specops: "Rota speciálních operací velitelství" # todo: NEW TRANSLATION
 hq_specops_desc: "Personál speciálních operací koordinuje elitní jednotky působící mimo běžné zásobovací a velitelské sítě.\n\n§GNápověda designéra: Rota speciálních operací velitelství zlepšuje útok a obranu speciálních sil a výkonnost mimo zásobování nasazeného velitele bez přidání bojové šířky. Použijte ji k velení elitním formacím, ale její náklady na živou sílu a vybavení jsou u konvenčních sil promarněné.§!" # todo: NEW TRANSLATION
 hq_mech: "Rota mechanizované pěchoty velitelství" # todo: NEW TRANSLATION
 hq_mech_desc: "Personál mechanizovaných operací koordinuje obrněné transportéry a jejich přepravovanou pěchotu napříč formací.\n\n§GNápověda designéra: Rota mechanizované pěchoty velitelství zlepšuje mechanizovaný útok a obranu nasazeného velitele. Použijte ji k velení mechanizovaným formacím, ale vyžaduje obrněné transportéry a značné množství podpůrného vybavení a ostatním typům jednotek poskytuje jen malý užitek.§!" # todo: NEW TRANSLATION
 hq_mot: "Rota motorizované pěchoty velitelství" # todo: NEW TRANSLATION
 hq_mot_desc: "Personál motorizovaných operací koordinuje pěchotu přepravovanou vozidly a rychlý pohyb formace.\n\n§GNápověda designéra: Rota motorizované pěchoty velitelství zlepšuje motorizovaný útok a obranu nasazeného velitele. Použijte ji k velení motorizovaným formacím, ale náklady na užitková vozidla a vybavení přinášejí pěším či obrněným silám jen malou hodnotu.§!" # todo: NEW TRANSLATION
 hq_armor: "Rota těžké jízdy velitelství" # todo: NEW TRANSLATION
 hq_armor_desc: "Personál obrněných operací koordinuje tanky, obrněnou pěchotu a jejich podpůrné prvky napříč formací.\n\n§GNápověda designéra: Rota těžké jízdy velitelství zlepšuje obrněný útok a obranu nasazeného velitele. Použijte ji k velení tankovým silám, ale její bojová vozidla pěchoty a široké požadavky na vybavení z ní činí jednu z dražších podpůrných voleb velitelství.§!" # todo: NEW TRANSLATION
 hq_infantry: "Pěchotní bezpečnostní družstvo velitelství" # todo: NEW TRANSLATION
 hq_infantry_desc: "Lehké pěchotní družstvo chrání personál velitelství, komunikaci a velitelská stanoviště před přímým útokem.\n\n§GNápověda designéra: Pěchotní bezpečnostní družstvo velitelství poskytuje armádnímu velitelství vysokou sílu a organizaci při mírných nákladech na vybavení. Použijte jej jako základní bezpečnostní linii, ale přidává bojovou šířku, postrádá terénní bonusy a má nižší bojové parametry než běžná frontová pěchota.§!" # todo: NEW TRANSLATION
 hq_Mot_Inf_Bat: "Motorizované pěchotní bezpečnostní družstvo velitelství" # todo: NEW TRANSLATION
 hq_Mot_Inf_Bat_desc: "Motorizované pěchotní družstvo poskytuje mobilní ochranu personálu velitelství a velitelských stanovišť.\n\n§GNápověda designéra: Motorizované pěchotní bezpečnostní družstvo velitelství přidává rychlost, solidní organizaci a silný výkon v kopcích a městech armádnímu velitelství. Použijte jej pro mobilní velitelskou formaci, ale vozidla zvyšují náklady a družstvo je slabé v pouštích, džunglích, bažinách, řekách a při obojživelných útocích.§!" # todo: NEW TRANSLATION
 hq_Mech_Inf_Bat: "Mechanizované pěchotní bezpečnostní družstvo velitelství" # todo: NEW TRANSLATION
 hq_Mech_Inf_Bat_desc: "Mechanizované pěchotní družstvo chrání mobilní velitelství pomocí obrněných transportérů.\n\n§GNápověda designéra: Mechanizované pěchotní bezpečnostní družstvo velitelství přidává obrněnou mobilitu a silnou obranu v kopcích a městech. Použijte jej k ochraně mechanizovaného armádního velitelství, ale obrněné transportéry jsou drahé a jednotka trpí silnými postihy v horách, džunglích, bažinách, řekách a při obojživelných útocích.§!" # todo: NEW TRANSLATION
 hq_Arm_Inf_Bat: "Obrněné bezpečnostní družstvo velitelství" # todo: NEW TRANSLATION
 hq_Arm_Inf_Bat_desc: "Obrněné pěchotní družstvo používá bojová vozidla pěchoty k zajištění těžké ochrany velitelství.\n\n§GNápověda designéra: Obrněné bezpečnostní družstvo velitelství poskytuje armádnímu velitelství ochranu založenou na bojových vozidlech pěchoty a výkon v otevřeném terénu. Použijte je s obrněnými velitelstvími, ale má nižší organizaci, vysoké náklady na vybavení a silné postihy v obtížném terénu a při obojživelných operacích.§!" # todo: NEW TRANSLATION
 hq_Mech_Marine_Bat: "Námořní bezpečnostní družstvo velitelství" # todo: NEW TRANSLATION
 hq_Mech_Marine_Bat_desc: "Mechanizované námořní družstvo chrání velitelství během operací z lodi na břeh a pobřežních operací.\n\n§GNápověda designéra: Námořní bezpečnostní družstvo velitelství kombinuje obrněnou mobilitu se silným obojživelným a říčním útokem pro armádní velitelství. Použijte je v námořních velitelstvích a při operacích na předmostí, ale náklady na obrněné transportéry a postihy v obtížném terénu z něj činí neefektivní volbu pro vnitrozemská tažení.§!" # todo: NEW TRANSLATION
 hq_Mech_Air_Inf_Bat: "Bezpečnostní družstvo vzdušného útoku velitelství" # todo: NEW TRANSLATION
 hq_Mech_Air_Inf_Bat_desc: "Lehké mechanizované družstvo chrání velitelství přidělená výsadkovým a rychle nasazovaným formacím.\n\n§GNápověda designéra: Bezpečnostní družstvo vzdušného útoku velitelství poskytuje obrněnou ochranu, kterou lze shodit padákem spolu s armádním velitelstvím. Použijte je pro výsadkové velitelské formace, ale jeho náklady na obrněné transportéry a podpůrné vybavení jsou vysoké a trpí značnými postihy v obtížném terénu, řekách a při obojživelných útocích.§!" # todo: NEW TRANSLATION
