l_english:
 muslim_brotherhood_sponsor: "Síť Muslimského bratrstva" # todo: NEW TRANSLATION
 muslim_brotherhood_suppressor: "Postavit se Bratrstvu" # todo: NEW TRANSLATION
 MB_build_network_hub: "Vybudovat mezinárodní organizaci" # todo: NEW TRANSLATION
 MB_build_network_hub_desc: "Muslimské bratrstvo je hnutí překračující hranice, jeho pobočky jsou rozptýlené po celém regionu a nemají žádné jediné centrum. Nechme [Root.GetNameDef] stát se tímto centrem, koordinujícím síť a poskytujícím nám prostředky k podpoře našich bratří v zahraničí." # todo: NEW TRANSLATION
 MB_fund_affiliates: "Financovat pobočky Bratrstva" # todo: NEW TRANSLATION
 MB_fund_affiliates_desc: "Bratrstvo v [FROM.GetNameDef] je odhodlané, ale chudé. Peníze, organizátoři a stálý přísun podpory posílí jejich pozici proti vládě, která by je nejraději viděla zmizet." # todo: NEW TRANSLATION
 MB_diplomatic_solidarity: "Vyzvat k solidaritě Bratrstva" # todo: NEW TRANSLATION
 MB_diplomatic_solidarity_desc: "Vlády spojené s Bratrstvem jsou silnější společně než každá zvlášť. Sveďme je k jednomu stolu, potvrďme společnou věc a nechme teplo mezi námi pocítit napříč blokem." # todo: NEW TRANSLATION
 MB_bankroll_crackdown: "Financovat zahraniční zásah" # todo: NEW TRANSLATION
 MB_bankroll_crackdown_desc: "[FROM.GetNameDef] sleduje, jak Bratrstvo roste uvnitř jeho hranic, aniž by mělo prostředky k zásahu. Nabídněme mu finance a zpravodajské informace k prvnímu úderu, než hnutí nabere dostatek síly k ohrožení státu." # todo: NEW TRANSLATION
 MB_designate_terrorist_organization: "Označit Bratrstvo za teroristickou organizaci" # todo: NEW TRANSLATION
 MB_designate_terrorist_organization_desc: "Označme Muslimské bratrstvo za to, čím ho prohlašujeme: teroristickou organizaci. Toto označení doma mnoho nestojí a staví [Root.GetNameDef] bok po boku s každou vládou, která vytyčila stejnou hranici." # todo: NEW TRANSLATION
 MB_counter_sponsor_influence: "Odhalit financování Bratrstva" # todo: NEW TRANSLATION
 MB_counter_sponsor_influence_desc: "Někdo financuje Bratrstvo v [FROM.GetNameDef] a peníze po sobě zanechávají stopu. Odhalme ji, překazme ji a sledujme, jak hnutí ztrácí tempo, zatímco jsou jeho podporovatelé vytaženi na světlo." # todo: NEW TRANSLATION
 MB_rescind_terrorist_designation: "Zrušit označení za teroristickou organizaci" # todo: NEW TRANSLATION
 MB_rescind_terrorist_designation_desc: "Potichu nechme označení za teroristickou organizaci pozbýt platnosti. Postoj proti Bratrstvu splnil svůj účel a udržovat staré křivdy v záznamech přináší jen malý užitek." # todo: NEW TRANSLATION
 MB_sponsored_network: "Sponzorování našeho hnutí Bratrstva" # todo: NEW TRANSLATION
 MB_funding_subversion: "Financování rozvracení Bratrstva v zahraničí" # todo: NEW TRANSLATION
 MB_solidarity: "Solidarita Muslimského bratrstva" # todo: NEW TRANSLATION
 MB_crackdown_patron: "Financování našeho zásahu" # todo: NEW TRANSLATION
 MB_funding_repression: "Financování potlačování Bratrstva" # todo: NEW TRANSLATION
 MB_counter_bloc: "Společný postoj proti Bratrstvu" # todo: NEW TRANSLATION
 MB_branded_terrorist: "Označili Bratrstvo za teroristickou skupinu" # todo: NEW TRANSLATION
 brotherhood.6.c: "Získat jejich umírněné představitele pro vládu." # todo: NEW TRANSLATION
 brotherhood.11.t: "Nabídka na financování zásahu" # todo: NEW TRANSLATION
 brotherhood.11.d: "[FROM.GetNameDef] nám potají nabídl peníze a zpravodajské informace k potlačení Muslimského bratrstva, než ještě více zesílí. Jejich vyslanci čekají na odpověď." # todo: NEW TRANSLATION
 brotherhood.11.a: "Přijmout financování a zakročit proti nim." # todo: NEW TRANSLATION
 brotherhood.11.b: "Nabídku odmítnout." # todo: NEW TRANSLATION
