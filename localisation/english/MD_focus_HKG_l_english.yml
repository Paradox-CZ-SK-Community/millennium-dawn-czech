l_english:
 hong_kong_focus: "Strom zaměření Hongkongu" # todo: NEW TRANSLATION
 HKG_divided_hong_kong: "Rozdělený Hongkong" # todo: NEW TRANSLATION
 HKG_divided_hong_kong_desc: "Poslední roky britské vlády v Hongkongu zanechaly dědictví pluralitní demokracie. Zároveň však přinesly nekonečné spory mezi tábory zastánců establishmentu, demokracie a lokalismu, což na každém kroku snižovalo správní efektivitu. Lidé si začínají klást otázku, zda je tento chaotický \"demokratický systém\" opravdu tak dobrý, jak se tvrdí." # todo: NEW TRANSLATION
 HKG_support_pro_beijing_camp: "Podpořit propekingský tábor" # todo: NEW TRANSLATION
 HKG_support_pro_beijing_camp_desc: "\"Svoboda není nedůležitá. V naší společenské kultuře však není tak důležitá jako stabilita.\" Nyní nastal čas, aby svět spatřil stabilnější a bezpečnější Hongkong." # todo: NEW TRANSLATION
 HKG_railway_development_strategy_2000: "Strategie rozvoje železnic 2000" # todo: NEW TRANSLATION
 HKG_railway_development_strategy_2000_desc: "Rostoucí populace a narůstající přeshraniční obchod tlačí hongkongskou silniční síť k úplnému zahlcení. Strategie rozvoje železnic 2000 povede v příštím desetiletí rozšiřování MTR a přesune dojíždějící i nákladní dopravu ze silnic na železnici." # todo: NEW TRANSLATION
 HKG_sign_CEPA: "Podepsat CEPA" # todo: NEW TRANSLATION
 HKG_sign_CEPA_desc: "Ujednání o užším hospodářském partnerství formalizuje preferenční přístup k obchodu mezi Hongkongem a pevninou. Je přínosem pro přeshraniční obchod a krokem k větší ekonomické vzájemné závislosti." # todo: NEW TRANSLATION
 HKG_approve_funding_for_XRL: "Schválit financování XRL" # todo: NEW TRANSLATION
 HKG_approve_funding_for_XRL_desc: "Expresní železniční spojení propojí Hongkong přímo s čínskou vysokorychlostní železniční sítí. Financování je rozsáhlé, politická symbolika ještě větší." # todo: NEW TRANSLATION
 HKG_co_location_bill: "Zákon o společné jurisdikci" # todo: NEW TRANSLATION
 HKG_co_location_bill_desc: "Kontroverzní zákon, který na terminálu XRL ve West Kowloonu zavádí jurisdikci pevninských čínských bezpečnostních složek. Propekingský tábor jej označuje za pragmatický, prodemokratičtí politici za porušení ústavy." # todo: NEW TRANSLATION
 HKG_electoral_reform: "Volební reforma" # todo: NEW TRANSLATION
 HKG_electoral_reform_desc: "Základní zákon stanovil, jak bude volen předseda vlády v prvních dvou funkčních obdobích a Legislativní rada v prvních třech, o dalších volbách však mlčí. To je naše příležitost prosadit reformu volebního systému a vykročit ke skutečnému všeobecnému volebnímu právu." # todo: NEW TRANSLATION
 HKG_a_broader_electorate: "Širší elektorát?" # todo: NEW TRANSLATION
 HKG_a_broader_electorate_desc: "Všeobecné volební právo nelze v Hongkongu zavést přes noc. Jako přechodný krok můžeme požádat Stálý výbor Všečínského shromáždění lidových zástupců o rozšíření členstva Volebního výboru, čímž učiníme volby demokratičtějšími, aniž bychom okamžitě přešli k plnému volebnímu právu." # todo: NEW TRANSLATION
 HKG_choose_your_own_puppet: "\"Vyberte si vlastní loutku\"" # todo: NEW TRANSLATION
 HKG_choose_your_own_puppet_desc: "Všeobecného volebního práva musí být v Hongkongu dosaženo, ne však za cenu stability. Nominační výbor zajistí, že kandidovat na předsedu vlády budou moci pouze ti, kteří jsou skutečně \"vlastenečtí vůči Číně a Hongkongu\"." # todo: NEW TRANSLATION
 HKG_a_new_reform_attempt: "Nový pokus o reformu" # todo: NEW TRANSLATION
 HKG_a_new_reform_attempt_desc: "Legislativní rada je znovu požádána, aby zvážila volební reformu. Projde tentokrát, nebo se historie zopakuje?" # todo: NEW TRANSLATION
 HKG_support_pan_democrats: "Podpořit prodemokratický tábor" # todo: NEW TRANSLATION
 HKG_support_pan_democrats_desc: "Demokracie a svoboda jsou již vetkány do života Hongkongu a Teng Siao-pching slíbil, že nebude zasahovat do jeho vnitřních záležitostí. Musíme se aktivně účastnit demokratického hnutí a bránit svobody, které tvoří základ hongkongské prosperity." # todo: NEW TRANSLATION
 HKG_keep_to_one_country_two_systems: "Zachovat princip jedna země, dva systémy" # todo: NEW TRANSLATION
 HKG_keep_to_one_country_two_systems_desc: "\"Jedna země, dva systémy\" funguje hladce. Pevnina využívá Hongkong jako základní kámen své politiky otevírání se světu, zatímco Hongkong spoléhá na záruku \"padesát let beze změny\", aby zachoval způsob života, který jej odlišuje od zbytku Číny. Uspořádání slouží oběma stranám a je zjevně v našem společném zájmu jej zachovat." # todo: NEW TRANSLATION
 HKG_hong_kong_post_2047_status: "Postavení Hongkongu po roce 2047" # todo: NEW TRANSLATION
 HKG_hong_kong_post_2047_status_desc: "Teng Siao-pching slíbil, že hongkongský politický a ekonomický systém zůstane padesát let nezměněn, nikdo však nedokáže říci, jak bude město po roce 2047 vypadat. Nastal čas zamyslet se nad jeho budoucností." # todo: NEW TRANSLATION
 HKG_stick_to_CPC_line: "Držet se linie KSČ" # todo: NEW TRANSLATION
 HKG_stick_to_CPC_line_desc: "Hongkong se bude v kontroverzních otázkách tiše držet linie preferované Pekingem. Prod demokrati budou zuřit, vlastenecký tábor jásat." # todo: NEW TRANSLATION
 HKG_loyal_puppet: "\"Věrná loutka\"" # todo: NEW TRANSLATION
 HKG_loyal_puppet_desc: "Prodemo­kraté odhalili své záměry a ulice ukázaly svůj hněv. Stabilita a prosperita vyžadují, aby se Hongkong otevřeně a bez omluv zavázal k cestě, kterou vytyčil Peking. Přechod k plně integrovanému zvláštnímu správnímu regionu nebude populární, ale bude definitivní." # todo: NEW TRANSLATION
 HKG_promote_patriotism: "Prosazovat vlastenectví" # todo: NEW TRANSLATION
 HKG_promote_patriotism_desc: "Na generaci vychovanou na koloniálních učebnicích a sentimentálních kantopopových písních nelze spoléhat při obraně vlasti. Výchova k národní bezpečnosti bude součástí každé učebny, každého pracoviště i každého vysílání. Lojalita ke straně je loajalitou k Hongkongu." # todo: NEW TRANSLATION
 HKG_patriots_governing: "Vlastenci vládnou Hongkongu" # todo: NEW TRANSLATION
 HKG_patriots_governing_desc: "Státní služba se příliš dlouho řídila koloniálními zvyklostmi a tichými sympatiemi. Prověrkové komise pročistí byrokracii od okresních úředníků až po vysoké administrátory a nahradí váhající zaměstnance osvědčenými vlastenci. Produktivita krátkodobě utrpí, spolehlivost nikoli." # todo: NEW TRANSLATION
 HKG_suppress_cantonese_local_culture: "Potlačit kantonskou místní kulturu" # todo: NEW TRANSLATION
 HKG_suppress_cantonese_local_culture_desc: "Hongkong je čínský a čínština znamená mandarínštinu. Kantonské vysílání bude omezeno, festivaly spojené s místní identitou tiše přijdou o financování a nesouhlasné hlasy v kulturní sféře budou vytlačeny z veřejného prostoru. Cenou budou nepokoje v ulicích a odpor v domácnostech, sjednocená národní kultura však za tuto cenu stojí." # todo: NEW TRANSLATION
 HKG_reduce_size_of_LegCo: "Zmenšit Legislativní radu" # todo: NEW TRANSLATION
 HKG_reduce_size_of_LegCo_desc: "Legislativní rada se rozrostla o přebytečná okresní křesla, která slouží pouze jako platformy pro opoziční divadlo. Zjednodušený sbor s menším počtem přímo volených křesel a rozšířenými funkčními obvody umožní vládě vládnout. Mezinský program pro talenty zaplní mezery administrátory vyškolenými v Pekingu a Šen-čenu." # todo: NEW TRANSLATION
 HKG_gong_zyu_ou_integration: "Integrace Hongkongu, Ču-chaje a Macaa" # todo: NEW TRANSLATION
 HKG_gong_zyu_ou_integration_desc: "\"Jedna země, dva systémy\" byla vždy jen přechodným uspořádáním. S vlastenci v čele zvláštního správního regionu se hranice mezi Hongkongem, Ču-chajem a Macaem stává spíše administrativní než skutečnou. Přeshraniční infrastruktura, harmonizovaná regulace a sdílené zásoby talentů dokončí přeměnu oblasti Velkého zálivu v jediný ekonomický celek připravený na úplné znovuzačlenění do vlasti." # todo: NEW TRANSLATION
 HKG_gong_zyu_ou_integration_tt: "Pokud je Hongkong v současnosti subjektem §Y[CHI.GetFlag]§!, zvláštní správní region bude anektován a začleněn do oblasti Velkého zálivu. V opačném případě dojde k dokončení politického přiklonění k loajalistům bez okamžitého převodu suverenity." # todo: NEW TRANSLATION
 HKG_china_dominant_influence_tt: "§Y[CHI.GetNameWithFlag]§! je nejsilnějším ovlivňovatelem v zemi [ROOT.GetNameWithFlag] s více než 80% vlivem" # todo: NEW TRANSLATION
 HKG_support_democracy_in_china: "Podpořit demokracii v Číně" # todo: NEW TRANSLATION
 HKG_support_democracy_in_china_desc: "Prod demokratické hnutí v Hongkongu bude otevřeně podporovat reformní snahy na pevnině. Jde o přímou výzvu pekingské autoritě." # todo: NEW TRANSLATION
 HKG_commemorate_june_fourth: "Připomenout čtvrtý červen" # todo: NEW TRANSLATION
 HKG_commemorate_june_fourth_desc: "Vzpomínková vigilie ve Victoria Parku se koná každý rok od roku 1990 a každý rok ji Peking sleduje s tichou nelibostí. Letos ji učiníme oficiální: veřejná vzpomínková akce schválená vládou zvláštního správního regionu, se svíčkami, písněmi a jmény mrtvých. Pevnina nezapomene. My také ne." # todo: NEW TRANSLATION
 HKG_inspire_chinese_grassroots_movements: "Inspirovat čínská lidová hnutí" # todo: NEW TRANSLATION
 HKG_inspire_chinese_grassroots_movements_desc: "Hongkong nedokáže sám zachránit pevninu, může však ukázat, jak vypadá čínská demokracie v praxi. Otevřené vysílání do delty Perlové řeky, pašované letáky přes hraniční přechody a tichá finanční podpora samizdatových sítí – semena změny zasazená z nejsvobodnějšího čínského města." # todo: NEW TRANSLATION
 HKG_call_on_CPC_to_release_dissidents: "Vyzvat KSČ k propuštění disidentů" # todo: NEW TRANSLATION
 HKG_call_on_CPC_to_release_dissidents_desc: "Jejich jména jsou dobře známá: Liou Siao-po, Wang Ping-čang, Sü Wen-li a desítky dalších. Vláda zvláštního správního regionu formálně a veřejně požaduje jejich propuštění. Peking samozřejmě odmítne, požadavek však dostane věznice režimu na mezinárodní pořad jednání." # todo: NEW TRANSLATION
 HKG_pro_democracy_media_charter: "Mediální charta pro demokracii" # todo: NEW TRANSLATION
 HKG_pro_democracy_media_charter_desc: "Svoboda tisku není heslem, ale právním režimem. Charta kodifikuje ochranu novinářů, kriminalizuje politické zasahování do redakčních rozhodnutí a zřizuje veřejnoprávní médium skutečně nezávislé na výkonné moci. Myšlenka Umlčeného tisku je zrušena." # todo: NEW TRANSLATION
 HKG_fund_civil_society: "Financovat občanskou společnost" # todo: NEW TRANSLATION
 HKG_fund_civil_society_desc: "Veřejné granty pro nevládní organizace, sousedská sdružení, právní poradny a prodemokratické iniciativy. Státní pokladna utrpí, politické tělo zesílí. Demokracie bez občanské společnosti je fórem bez publika." # todo: NEW TRANSLATION
 HKG_legco_reform_petition: "Petice za reformu Legislativní rady" # todo: NEW TRANSLATION
 HKG_legco_reform_petition_desc: "Formální petice Pekingu za skutečné všeobecné volební právo ve volbách do Legislativní rady. Přímá volba všech křesel, zrušení funkčních obvodů, žádný nominační výbor. Myšlenka Chybějícího všeobecného volebního práva je nahrazena Omezeným všeobecným volebním právem jako prvním ústupkem." # todo: NEW TRANSLATION
 HKG_accountability_for_tiananmen: "Vyvodit odpovědnost za Tchien-an-men" # todo: NEW TRANSLATION
 HKG_accountability_for_tiananmen_desc: "Jmenujeme muže, kteří vydali rozkazy. Jmenujeme jednotky, které je vykonaly. Otevřeme vlastní archivy zvláštního správního regionu, podpoříme mezinárodní tribunály a zviditelníme svědectví přeživších. Peking to bude považovat za vyhlášení války straně. Hongkongští demokraté uslyší jiné poselství." # todo: NEW TRANSLATION
 HKG_peaceful_democratic_path: "Pokojná demokratická cesta" # todo: NEW TRANSLATION
 HKG_peaceful_democratic_path_desc: "Reforma zevnitř, nikoli konfrontace zvenčí. Hongkong upevní své demokratické instituce, stabilizuje občanskou společnost a počká, až se pevnina změní vlastním tempem. Svíčky ve Victoria Parku stále hoří, ulice však zůstávají klidné. Další fáze reforem začíná z pozice síly." # todo: NEW TRANSLATION
 HKG_appease_localists: "Uklidnit lokalisty" # todo: NEW TRANSLATION
 HKG_appease_localists_desc: "Ústupky lokalistickému hnutí: zachování kantonštiny, politika přednostního zaměstnávání místních obyvatel a zpomalení projektů přeshraniční integrace." # todo: NEW TRANSLATION
 HKG_stoke_anti_mainland_sentiment: "Podněcovat protikontinentální nálady" # todo: NEW TRANSLATION
 HKG_stoke_anti_mainland_sentiment_desc: "Čína odebrala všechny výhody a zanechala obyvatele Hongkongu s vysokými cenami nemovitostí a nízkou kupní silou. Proč by měl Hongkong zůstat s Čínou a být ochoten stát se její malou kolonií?" # todo: NEW TRANSLATION
 HKG_restrict_tourism_immigration: "Omezit cestovní ruch a imigraci" # todo: NEW TRANSLATION
 HKG_restrict_tourism_immigration_desc: "Nové limity pro turisty z pevniny a přísnější pravidla přeshraniční imigrace. Místní obyvatelé ocení více prostoru k životu, maloobchodníci a developeři už méně." # todo: NEW TRANSLATION
 HKG_emphasize_hong_kong_identity: "Zdůraznit hongkongskou identitu" # todo: NEW TRANSLATION
 HKG_emphasize_hong_kong_identity_desc: "Úspěšné odtržení Singapuru od Malajsie bylo způsobeno úspěšnými reformami vědomí národní identity pana Lee Kuan Yewa. Hongkong je plně schopen přijmout stejný přístup." # todo: NEW TRANSLATION
 HKG_distance_from_china: "Distancovat se od Číny" # todo: NEW TRANSLATION
 HKG_distance_from_china_desc: "Hongkongu, nastal čas zvednout kotvy a vymanit se z čínské kontroly." # todo: NEW TRANSLATION
 HKG_great_hong_kong_nation: "Velký hongkongský národ" # todo: NEW TRANSLATION
 HKG_great_hong_kong_nation_desc: "Předání moci bylo zradou. Sliby na padesát let byly lží. Hongkong je národ, nikoli provincie, a národ potřebuje vlastní vlajku, vlastní hranice a vlastní ozbrojené síly. Vyhlásíme to, co nikdy nemělo být vyjednáno." # todo: NEW TRANSLATION
 HKG_hong_kong_first: "Hongkong na prvním místě" # todo: NEW TRANSLATION
 HKG_hong_kong_first_desc: "Od přístavů Aberdeenu až po výškové budovy Mong Koku patří Hongkong Hongkongčanům. Investice z pevniny, pracovní síla z pevniny i vliv pevniny budou podléhat vůli místního obyvatelstva. Občanství je dědictví, nikoli převoditelná výhoda." # todo: NEW TRANSLATION
 HKG_hong_kong_state_constitution: "Nová ústava hongkongského státu" # todo: NEW TRANSLATION
 HKG_hong_kong_state_constitution_desc: "Základní zákon byl sepsán v Pekingu, podepsán v Londýně a vnucen lidu, který neměl v žádném z těchto hlavních měst volební právo. Nahrazuje jej nová ústava sepsaná v Centralu Hongkongčany pro Hongkongčany. Přechod je definitivní." # todo: NEW TRANSLATION
 HKG_armed_forces_of_hong_kong: "Ozbrojené síly Hongkongu" # todo: NEW TRANSLATION
 HKG_armed_forces_of_hong_kong_desc: "Národ, který se nedokáže bránit, není žádným národem. Obranné síly Hongkongu, složené z dobrovolníků i branců, postaví pěchotu schopnou udržet Nová území a pobřežní stráž, která dokáže čelit jakémukoli vpádu. Vojenská omezení Základního zákona jsou mrtvou literou." # todo: NEW TRANSLATION
 HKG_irredentist_claim_pearl_river: "Vznést nárok na deltu Perlové řeky" # todo: NEW TRANSLATION
 HKG_irredentist_claim_pearl_river_desc: "Delta Perlové řeky – Šen-čen, Kanton a Ču-chaj – byla kantonská dříve, než se stala komunistickou, a tamní lidé toho mají více společného s námi než s Pekingem. Otevřeně uplatníme svůj nárok. Ať už vyjednáváním, nebo silou, delta se znovu spojí se svým kulturním srdcem." # todo: NEW TRANSLATION
 HKG_little_bird_under_british_wing: "Malý ptáček pod britskými křídly" # todo: NEW TRANSLATION
 HKG_little_bird_under_british_wing_desc: "Skutečnost, že se Hongkong odtrhl od Číny, neznamená, že dokáže ve světě přežít sám. Potřebujeme pomoc ostatních. Co třeba našich starých britských vládců?" # todo: NEW TRANSLATION
 HKG_request_rerule_british_government: "Požádat o opětovnou vládu britské vlády" # todo: NEW TRANSLATION
 HKG_request_rerule_british_government_desc: "Kdysi dávno čínsko-britská jednání nikdy nerespektovala přání Hongkongčanů zůstat součástí Britského impéria. Tentokrát se budeme řídit vlastními srdci." # todo: NEW TRANSLATION
 HKG_aukus_intelligence_share: "Sdílení zpravodajských informací AUKUS" # todo: NEW TRANSLATION
 HKG_aukus_intelligence_share_desc: "Britské, americké a australské zpravodajské služby dlouhodobě tiše sledují Hongkong. Formalizovaný převod technologií a spolupráce v oblasti zpravodajských signálů pod záštitou AUKUS pevně začlení SAR do bezpečnostní architektury anglosféry." # todo: NEW TRANSLATION
 HKG_uk_garrison_rights: "Právo britské posádky" # todo: NEW TRANSLATION
 HKG_uk_garrison_rights_desc: "Symbolický oddíl Royal Marines ve Stonecutters, návštěvy lodí Royal Navy ve Victoria Harbour a dohoda o základně, která Británii umožní dosáhnout z přátelského pobřeží do Jihočínského moře. Posádka je malá. Signál nikoli." # todo: NEW TRANSLATION
 HKG_commonwealth_realm_ambition: "Ambice stát se říší Commonwealthu" # todo: NEW TRANSLATION
 HKG_commonwealth_realm_ambition_desc: "Kanada, Austrálie, Nový Zéland – všechny kdysi kolonie, nyní říše, a stále pod Korunou. Hongkong žádá představitele vlád Commonwealthu, aby jej přijali zpět nikoli jako državu, ale jako suverénní říši sdílející monarchu. Historická urážka předání tak dostává svou dlouhou odpověď." # todo: NEW TRANSLATION
 HKG_city_state_idea: "Myšlenka městského státu" # todo: NEW TRANSLATION
 HKG_city_state_idea_desc: "Singapur dokázal, že to jde. Město s čínskou většinou obklopené většími mocnostmi může přežít a prosperovat jako suverénní obchodní centrum, pokud dá přednost neutralitě a kompetenci před ideologií. Hongkong bude tento vzor následovat, ale lépe." # todo: NEW TRANSLATION
 HKG_revise_basic_law: "Revidovat Základní zákon" # todo: NEW TRANSLATION
 HKG_revise_basic_law_desc: "Základní zákon byl sepsán jako přechodný dokument, v němž byl Peking implicitně nejvyšší autoritou. Revidovaná listina odstraní tato ustanovení, vyhlásí plnou suverenitu a přepíše rámec SAR jako republiku zákonů. Obrana a zahraniční politika nyní náleží Hongkongu." # todo: NEW TRANSLATION
 HKG_pearl_of_east_asia: "Perla východní Asie" # todo: NEW TRANSLATION
 HKG_pearl_of_east_asia_desc: "Město oproštěné od omezení pevniny i západních vazeb se staví do role bezkonkurenčního finančního a obchodního entrepôt východní Asie. Kapitál proudí přes Central. Talenty proudí do Wan Chai. Perla zastíní Šanghaj i Singapur." # todo: NEW TRANSLATION
 HKG_global_financial_capital: "Globální finanční metropole" # todo: NEW TRANSLATION
 HKG_global_financial_capital_desc: "HKEX, nezávislý měnový orgán a regulační režim navržený tak, aby přilákal kapitál, který nemůže důvěřovat New Yorku ani Londýnu. Hongkong se tiše, ziskově a nenahraditelně stane těžištěm financí asijsko-pacifického regionu." # todo: NEW TRANSLATION
 HKG_coastal_defence_doctrine: "Doktrína pobřežní obrany" # todo: NEW TRANSLATION
 HKG_coastal_defence_doctrine_desc: "Městský stát si nemůže dovolit oceánské námořnictvo, může si však dovolit učinit každý vpád nákladným. Protilodní střely, zaminované přístupy, opevněný přístav a doktrína zaměřená na znemožnění přístupu namísto projekce síly. Hongkong bude dikobrazem, nikoli lvem." # todo: NEW TRANSLATION
 HKG_under_lion_rock_hill: "Pod Lion Rock" # todo: NEW TRANSLATION
 HKG_under_lion_rock_hill_desc: "§CV jedné lodi pod Skalou se budeme snažit jako jeden\n\nVšichni rovni pod Sluncem.\n\nAž budeme svobodní a sjednocení\n\nBudeme usilovat o své sny radosti\n\nSpolečně, jedna duše, jedno srdce\n\nJedna naděje, kterou žádný strach nezničí.\n\nKde končí nebe a moře\n\nPodej mi ruku a kráčej se mnou\n\nAbychom překonali vše a zvítězili v našem boji napsat\n\nNáš příběh domova, zářící jasně.§!" # todo: NEW TRANSLATION
 HKG_race_discrimination_bill: "Zákon proti rasové diskriminaci" # todo: NEW TRANSLATION
 HKG_race_discrimination_bill_desc: "Základní zákon a hongkongské nařízení o listině práv chrání práva jednotlivců, včetně práva na ochranu před rasovou diskriminací. Podle Mezinárodní úmluvy o odstranění všech forem rasové diskriminace máme rovněž povinnost rasovou diskriminaci zakázat a odstranit." # todo: NEW TRANSLATION
 HKG_LGBT_rights: "Práva LGBT" # todo: NEW TRANSLATION
 HKG_LGBT_rights_desc: "Hongkongská LGBT komunita čekala příliš dlouho. Vláda prověří, jaká ochranná opatření a reformy jsou možné v rámci současného právního systému." # todo: NEW TRANSLATION
 HKG_affirm_support_for_christian_organizations: "Potvrdit podporu křesťanským organizacím" # todo: NEW TRANSLATION
 HKG_affirm_support_for_christian_organizations_desc: "Křesťanské organizace mají v Hongkongu dlouhodobě nepřiměřený vliv na sociální politiku. Jejich poradní role bude znovu potvrzena a chráněna." # todo: NEW TRANSLATION
 HKG_reduce_power_of_christian_groups: "Omezit moc křesťanských skupin" # todo: NEW TRANSLATION
 HKG_reduce_power_of_christian_groups_desc: "Poradní role křesťanských organizací v sociální politice bude omezena. Mezeru zaplní rozšířené sekulární konzultační procesy." # todo: NEW TRANSLATION
 HKG_consult_public_on_new_law: "Konzultovat s veřejností nový zákon" # todo: NEW TRANSLATION
 HKG_consult_public_on_new_law_desc: "Před přijetím zákona vláda provede rozsáhlé veřejné konzultace. Proces bude trvat déle, výsledek však získá demokratickou legitimitu." # todo: NEW TRANSLATION
 HKG_outlaw_anti_LGBT_discrimination: "Zakázat diskriminaci LGBT" # todo: NEW TRANSLATION
 HKG_outlaw_anti_LGBT_discrimination_desc: "Diskriminace LGBT osob na pracovišti, v oblasti bydlení a při poskytování služeb bude postavena mimo zákon. Očekávejme vleklý legislativní boj." # todo: NEW TRANSLATION
 HKG_seek_reform_of_existing_legislation: "Usilovat o reformu stávající legislativy" # todo: NEW TRANSLATION
 HKG_seek_reform_of_existing_legislation_desc: "Budou identifikována a reformována stávající diskriminační ustanovení v pracovním, rodinném a nájemním právu." # todo: NEW TRANSLATION
 HKG_anti_discrimination_reform_package: "Balíček protidiskriminačních reforem" # todo: NEW TRANSLATION
 HKG_anti_discrimination_reform_package_desc: "Komplexní protidiskriminační reforma pokrývající rasu, náboženství, sexuální orientaci, genderovou identitu a zdravotní postižení." # todo: NEW TRANSLATION
 HKG_legalize_gay_marriage: "Legalizovat sňatky osob stejného pohlaví" # todo: NEW TRANSLATION
 HKG_legalize_gay_marriage_desc: "Hongkong se stane první jurisdikcí východní Asie, která plně legalizuje sňatky osob stejného pohlaví. Některé kruhy budou slavit, jiné se ostře postaví proti." # todo: NEW TRANSLATION
 HKG_gender_pay_gap: "Rozdíl v odměňování žen a mužů" # todo: NEW TRANSLATION
 HKG_gender_pay_gap_desc: "Povinné vykazování rozdílů v odměňování pro všechny velké zaměstnavatele. Veřejné označování a zostuzování dosáhne toho, čeho dobrovolné dodržování nedosáhlo." # todo: NEW TRANSLATION
 HKG_require_greater_transparency_from_employers: "Vyžadovat větší transparentnost od zaměstnavatelů" # todo: NEW TRANSLATION
 HKG_require_greater_transparency_from_employers_desc: "Zaměstnavatelé s více než stanoveným počtem zaměstnanců budou povinni každoročně zveřejňovat podrobné zprávy o rovnosti odměňování." # todo: NEW TRANSLATION
 HKG_deny_existence_of_pay_gap: "Popřít existenci rozdílu v odměňování" # todo: NEW TRANSLATION
 HKG_deny_existence_of_pay_gap_desc: "Oficiální stanovisko vlády: stávající rozdíly v odměňování odrážejí volbu povolání, nikoli diskriminaci. Další kroky nejsou nutné." # todo: NEW TRANSLATION
 HKG_secondary_school_education_reform: "Reforma středoškolského vzdělávání" # todo: NEW TRANSLATION
 HKG_secondary_school_education_reform_desc: "Stará struktura středoškolského vzdělávání 3-2-2-3 bude nahrazena systémem 3-3-4, který se již používá ve Spojených státech a na pevninské Číně. Reforma odstraní překrývající se a zastaralý obsah a zavede širší nabídku volitelných předmětů." # todo: NEW TRANSLATION
 HKG_patriotic_education_curriculum_reform: "Reforma osnov vlastenecké výchovy" # todo: NEW TRANSLATION
 HKG_patriotic_education_curriculum_reform_desc: "Vlastenecká výchova nemá v současných hongkongských osnovách místo. Tuto mezeru vyplníme předmětem Liberal Studies." # todo: NEW TRANSLATION
 HKG_chinese_based_education_curriculum: "Vzdělávací osnovy založené na čínštině" # todo: NEW TRANSLATION
 HKG_chinese_based_education_curriculum_desc: "Nejprve jsme Číňané a teprve potom Hongkongčané. Každá škola v Hongkongu bude vyučovat v čínštině a od každého dítěte se očekává, že jí bude mluvit." # todo: NEW TRANSLATION
 HKG_hong_kong_police_force: "Hongkongská policie" # todo: NEW TRANSLATION
 HKG_hong_kong_police_force_desc: "Hongkongská policie byla založena 1. května 1844 a je největší disciplinovanou složkou hongkongské vlády. Kvůli omezením pohybu Lidové osvobozenecké armády umístěné v Hongkongu zajišťuje funkce, které v jiných zemích obvykle vykonává armáda, hongkongská policie. Hongkongská policie byla po dlouhou dobu označována za „nejlepší v Asii“." # todo: NEW TRANSLATION
 HKG_anti_terrorist_train: "Protiteroristický výcvik" # todo: NEW TRANSLATION
 HKG_anti_terrorist_train_desc: "Nové tisíciletí přineslo prosperitu a příležitosti, ale také nové hrozby. Terorismus nesmí v Hongkongu zakořenit." # todo: NEW TRANSLATION
 HKG_purchase_chinese_weapons: "Nakoupit čínskou výzbroj" # todo: NEW TRANSLATION
 HKG_purchase_chinese_weapons_desc: "Nahrazení pistolí Smith & Wesson z britské éry alternativami dodávanými společností Norinco. Náklady jsou nízké, symbolika značná." # todo: NEW TRANSLATION
 HKG_create_CTRU: "Vytvořit protiteroristickou zásahovou jednotku" # todo: NEW TRANSLATION
 HKG_create_CTRU_desc: "Protiteroristická zásahová jednotka, známá jako CTRU, je rychlá zásahová síla zřízená k reakci na teroristické incidenty. Její příslušníci budou tím nejlepším, co může policie nabídnout." # todo: NEW TRANSLATION
 HKG_police_system_reform: "Reforma policejního systému" # todo: NEW TRANSLATION
 HKG_police_system_reform_desc: "Modernizace výcviku, velitelské struktury a mechanismů odpovědnosti hongkongské policie." # todo: NEW TRANSLATION
 HKG_investigate_police_triad_cooperation_problem: "Vyšetřit spolupráci policie s triádami" # todo: NEW TRANSLATION
 HKG_investigate_police_triad_cooperation_problem_desc: "Do triád nasazujeme agenty v utajení, ale ony dělají totéž nám. Tito krtci narušují naše operace ještě před jejich zahájením. Prostřednictvím ICAC a OCTB tyto „Hak Ging“ odhalíme." # todo: NEW TRANSLATION
 HKG_anti_protest_train: "Rozsáhlý výcvik pro potlačování nepokojů" # todo: NEW TRANSLATION
 HKG_anti_protest_train_desc: "Specializovaný výcvik pro situace spojené s řízením davu, od pokojných shromáždění až po násilné nepokoje." # todo: NEW TRANSLATION
 HKG_purchase_anti_riot_armour: "Pořídit vybavení pro potlačování nepokojů" # todo: NEW TRANSLATION
 HKG_purchase_anti_riot_armour_desc: "Nové balistické vybavení a výstroj odolná proti nárazům pro policejní taktickou jednotku." # todo: NEW TRANSLATION
 HKG_purchase_non_lethal_weapons: "Nakoupit nesmrtící zbraně" # todo: NEW TRANSLATION
 HKG_purchase_non_lethal_weapons_desc: "Odpalovače slzného plynu, gumové projektily a zbraně vystřelující pepřové kuličky – moderní sada prostředků pro kontrolu davu." # todo: NEW TRANSLATION
 HKG_form_elite_team: "Vytvořit elitní tým" # todo: NEW TRANSLATION
 HKG_form_elite_team_desc: "Specializovaná protiteroristická zásahová jednotka vytvořená podle vzoru zahraničních taktických týmů." # todo: NEW TRANSLATION
 HKG_gong_hei_fat_coi: "Gong Hei Faat Choy" # todo: NEW TRANSLATION
 HKG_gong_hei_fat_coi_desc: "Hongkong [HKG.GetFlag], který právě překonal finanční krizi a vstoupil do nového tisíciletí, čelí mnoha hospodářským a sociálním problémům. Jak je vyřešit, musí rozhodnout lid." # todo: NEW TRANSLATION
 HKG_typhoon_shelter_from_financial_storm: "Úkryt před finanční bouří" # todo: NEW TRANSLATION
 HKG_typhoon_shelter_from_financial_storm_desc: "Bouře pominula. Nastal čas uklidit nepořádek. Vláda nasadí devizové rezervy a cílené intervence ke stimulaci ekonomiky." # todo: NEW TRANSLATION
 HKG_merge_into_HKEX: "Sloučit HKCE a HKFE do HKEX" # todo: NEW TRANSLATION
 HKG_merge_into_HKEX_desc: "Po finanční krizi v roce 1997 budou Hong Kong Commodity Exchange (HKCE) a Hong Kong Futures Exchange (HKFE) sloučeny do nové společnosti Hong Kong Exchanges and Clearing Limited (HKEX), čímž se posílí konkurenční výhoda města na stále globalizovanějším trhu." # todo: NEW TRANSLATION
 HKG_greatest_entrepot: "Největší obchodní přístav východní Asie" # todo: NEW TRANSLATION
 HKG_greatest_entrepot_desc: "Hongkong je již dlouho předním asijským entrepôt. Rozšíření kapacity přístavu a efektivity odbavování nákladu tento titul zachová." # todo: NEW TRANSLATION
 HKG_expand_Kwai_Tsing_terminals: "Rozšířit terminály Kwai Tsing" # todo: NEW TRANSLATION
 HKG_expand_Kwai_Tsing_terminals_desc: "Nová kapacita pro odbavování kontejnerů v Kwai Tsing. Větší lodě, rychlejší obrat a více nákladu přes Hongkong." # todo: NEW TRANSLATION
 HKG_attract_foreign_investment: "Přilákat zahraniční investice" # todo: NEW TRANSLATION
 HKG_attract_foreign_investment_desc: "Balíček daňových pobídek, zjednodušení regulací a specializovaných služeb pro styk s investory, který přiláká kapitál ze zahraničí." # todo: NEW TRANSLATION
 HKG_european_business: "Evropské podnikání" # todo: NEW TRANSLATION
 HKG_european_business_desc: "Cílené oslovení evropských obchodních komor. Hongkong jako regionální brána pro evropské firmy vstupující do Asie." # todo: NEW TRANSLATION
 HKG_chinese_entrepreneurs: "Podnikatelé z pevniny" # todo: NEW TRANSLATION
 HKG_chinese_entrepreneurs_desc: "Kapitál z pevninské Číny je budoucností hongkongské ekonomiky. Vláda prohloubí vazby na pekingskou podnikatelskou sféru." # todo: NEW TRANSLATION
 HKG_develop_solar_power: "Investovat do solární energie" # todo: NEW TRANSLATION
 HKG_develop_solar_power_desc: "Distribuované fotovoltaické instalace na střechách a vodních nádržích. Skromný začátek, ale přece jen začátek." # todo: NEW TRANSLATION
 HKG_T_PARK: "Zařízení T·PARK" # todo: NEW TRANSLATION
 HKG_T_PARK_desc: "Zařízení na zpracování kalu T-PARK v Tuen Mun mění odpad na energii a demonstruje hongkongské ekologické ambice." # todo: NEW TRANSLATION
 HKG_indonesian_gas: "Plyn z Jakarty" # todo: NEW TRANSLATION
 HKG_indonesian_gas_desc: "Dlouhodobá dohoda o dodávkách zkapalněného zemního plynu s Indonésií, která na desetiletí zajistí hongkongské energetické potřeby." # todo: NEW TRANSLATION
 HKG_australian_oil: "Ropa ze Sydney" # todo: NEW TRANSLATION
 HKG_australian_oil_desc: "Dovozní partnerství s australskými producenty ropy, které diverzifikuje hongkongskou závislost na uhlovodících mimo jediného dodavatele." # todo: NEW TRANSLATION
 HKG_new_development_idea: "Nový rozvojový plán" # todo: NEW TRANSLATION
 HKG_new_development_idea_desc: "Nová rozvojová iniciativa spojuje infrastrukturní, bytové a průmyslové projekty pod jedinou koordinovanou hlavičku." # todo: NEW TRANSLATION
 HKG_invest_hong_kong: "Investovat v Hongkongu" # todo: NEW TRANSLATION
 HKG_invest_hong_kong_desc: "InvestHK bude restrukturalizován a znovu financován jako hlavní městská agentura pro podporu investic." # todo: NEW TRANSLATION
 HKG_hong_kong_science_parks: "Vědecké parky" # todo: NEW TRANSLATION
 HKG_hong_kong_science_parks_desc: "Specializované zóny v Sha Tin a Tseung Kwan O pro biotechnologie, umělou inteligenci a výzkum a vývoj pokročilé výroby, s dotovanými kancelářskými prostory pro začínající podniky." # todo: NEW TRANSLATION
 HKG_invite_talent_to_hong_kong: "Pozvat talenty do Hongkongu" # todo: NEW TRANSLATION
 HKG_invite_talent_to_hong_kong_desc: "Zrychlený vízový program pro vysoce kvalifikované zahraniční odborníky, s anglicky poskytovanými službami a daňovými pobídkami usnadňujícími přechod." # todo: NEW TRANSLATION
 HKG_hong_kong_cyberport: "Cyberport" # todo: NEW TRANSLATION
 HKG_hong_kong_cyberport_desc: "Poslání Cyberportu bude obnoveno a rozšířeno jako digitální podnikatelský klastr zaměřený na finanční technologie, elektronický obchod a digitální média." # todo: NEW TRANSLATION
 HKG_tech_incubation_programme: "Technologický inkubační program" # todo: NEW TRANSLATION
 HKG_tech_incubation_programme_desc: "Vládou financované inkubátory se základním kapitálem, mentoringem a sdílenou infrastrukturou pro začínající technologické firmy." # todo: NEW TRANSLATION
 HKG_favor_traditional_values: "Obrátit se k tradici" # todo: NEW TRANSLATION
 HKG_favor_traditional_values_desc: "Vláda se veřejně přikloní k tradičním rodinným hodnotám a omezí aktivismus LGBT ve vzdělávání a veřejném životě." # todo: NEW TRANSLATION
 HKG_undercover_oppression: "Skrytý útlak" # todo: NEW TRANSLATION
 HKG_undercover_oppression_desc: "Tišší přístup: dohled, nátlak na zaměstnavatele a neoficiální odrazování namísto otevřené legislativy proti menšinovým skupinám." # todo: NEW TRANSLATION
 HKG_legislate_to_ban_LGBT: "Zakázat LGBT kolektiv" # todo: NEW TRANSLATION
 HKG_legislate_to_ban_LGBT_desc: "Otevřená legislativa kriminalizující veřejné projevy LGBT identity. Mezinárodní společenství zareaguje ostře." # todo: NEW TRANSLATION
 HKG_regulate_sale_of_residential_buildings: "Regulovat prodej obytných budov" # todo: NEW TRANSLATION
 HKG_regulate_sale_of_residential_buildings_desc: "Skromný rámec pravidel zveřejňování informací, limitů hypoték a daní proti spekulacím. Suenův plán zůstane v platnosti, ale nejhorší excesy neregulovaného trhu budou omezeny." # todo: NEW TRANSLATION
 HKG_land_reclamation: "Rekultivace půdy" # todo: NEW TRANSLATION
 HKG_land_reclamation_desc: "Hongkong má jen omezené množství půdy. Oddělení stavebního inženýrství připraví nový program rekultivace u ostrova Lantau, pobřeží Nových území a kowloonského přístavu. Náklady jsou obrovské a ekologové zuří; nová místa pro výstavbu za to však stojí." # todo: NEW TRANSLATION
 HKG_lock_housing_price: "Zmrazit ceny bydlení" # todo: NEW TRANSLATION
 HKG_lock_housing_price_desc: "Vláda stanoví zákonný strop cen rezidenčních nemovitostí indexovaný podle mediánu příjmů. Vlastníci půdy šílí vzteky, nájemníci a odbory slaví. Trh se stane předvídatelným – a stagnujícím." # todo: NEW TRANSLATION
 HKG_expand_home_ownership_scheme: "Rozšířit program vlastnického bydlení" # todo: NEW TRANSLATION
 HKG_expand_home_ownership_scheme_desc: "Program vlastnického bydlení bude rozšířen: více bytů, nižší hranice, rychlejší vyřizování. Hongkongčan z dělnické třídy může konečně doufat ve vlastní bydlení. Státní pokladna ponese náklady dotací; společenský klid bude jejich výnosem." # todo: NEW TRANSLATION
 HKG_let_government_hold_companies: "Vládou vlastněné společnosti" # todo: NEW TRANSLATION
 HKG_let_government_hold_companies_desc: "Největší firmy zabývající se rozvojem nemovitostí – Sun Hung Kai, Cheung Kong a Henderson – budou částečně znárodněny. Magnáti budou hlasitě protestovat, vláda však získá jejich podíly. Ceny nemovitostí se dostanou pod přímou politickou kontrolu." # todo: NEW TRANSLATION
 HKG_maintain_public_housing_construction: "Udržet výstavbu veřejného bydlení" # todo: NEW TRANSLATION
 HKG_maintain_public_housing_construction_desc: "Výstavba vedená Úřadem pro bydlení bude zachována a rozšířena. Veřejná sídliště vyrostou po celých Nových územích. Investice do infrastruktury se projeví ve stabilitě a tiše spokojenějším obyvatelstvu." # todo: NEW TRANSLATION
 HKG_my_home_purchase_scheme: "Program koupě vlastního bydlení" # todo: NEW TRANSLATION
 HKG_my_home_purchase_scheme_desc: "Plán Donalda Tsanga na koupi vlastního bydlení bude zaveden podle návrhu: nájemní jednotky s možností odkupu pro střední třídu, tedy Hongkongčany, kteří vydělávají příliš mnoho na veřejné bydlení, ale nemohou si dovolit soukromý trh. Hmatatelná odpověď na krizi dostupnosti bydlení." # todo: NEW TRANSLATION
 HKG_subsidised_sale_flats_project: "Projekt dotovaných bytů na prodej" # todo: NEW TRANSLATION
 HKG_subsidised_sale_flats_project_desc: "Vládou dotované byty prodávané prvním kupujícím pod tržní cenou. Úřad pro bydlení se v podstatě stane největším developerem v SAR." # todo: NEW TRANSLATION
 HKG_green_form_subsidised_home_ownership_scheme: "Program dotovaného vlastnického bydlení se zeleným formulářem" # todo: NEW TRANSLATION
 HKG_green_form_subsidised_home_ownership_scheme_desc: "Završením bytové reformy bude přednostní přístup k dotovanému vlastnictví pro držitele zeleného formuláře – stávající nájemníky veřejného bydlení. Řetězec vzestupné mobility, přerušený na dvě desetiletí, bude konečně obnoven. Hongkongská bytová krize skončí." # todo: NEW TRANSLATION
 HKG_public_housing_problem: "Problém veřejného bydlení" # todo: NEW TRANSLATION
 HKG_public_housing_problem_desc: "Hongkongská bytová krize je nejviditelnějším selháním vlády po předání moci. Medián cen domů převyšuje medián příjmů řádově; v rozdělených bytech a klecových obydlích žijí desítky tisíc lidí; čekací listina na veřejné bydlení přesahuje šest let. Politický tlak něco – cokoli – podniknout je zdrcující." # todo: NEW TRANSLATION
 HKG_sun_housing_policy: "Sunova devítibodová bytová reforma" # todo: NEW TRANSLATION
 HKG_sun_housing_policy_desc: "Devítibodový program ministra pro bydlení Michaela Suena. Omezit nabídku, zastavit veřejnou výstavbu a nechat trh zotavit se. Vlastníci půdy a konglomeráty souhlasí. Odbory a nájemníci nikoli. Historie tuto politiku odsoudí, krátkodobě však zajistí trh s nemovitostmi." # todo: NEW TRANSLATION
 HKG_end_tenants_purchase_scheme: "Ukončit program koupě nájemníky" # todo: NEW TRANSLATION
 HKG_end_tenants_purchase_scheme_desc: "Nájemníci veřejného bydlení již nebudou moci kupovat své byty za zvýhodněné ceny. Státní pokladna si ponechá majetek; nájemníci zůstanou nájemníky. Malý příjem navíc za skutečnou sociální cenu." # todo: NEW TRANSLATION
 HKG_suspend_home_ownership_scheme: "Pozastavit program vlastnického bydlení" # todo: NEW TRANSLATION
 HKG_suspend_home_ownership_scheme_desc: "Program vlastnického bydlení bude pozastaven na neurčito. Nabídka dotovaných bytů na prodej vyschne, soukromý trh bude osvobozen od veřejné konkurence a realitní magnáti budou mít o jednu starost méně." # todo: NEW TRANSLATION
 HKG_curtail_land_supply: "Omezit nabídku půdy" # todo: NEW TRANSLATION
 HKG_curtail_land_supply_desc: "Prodej vládní půdy bude zastaven; Pozemkový úřad ponechá své zásoby mimo trh. Ceny se stabilizují na vysoké úrovni, trh s nemovitostmi se zkoncentruje a bytová krize se stane trvalou součástí života v Hongkongu." # todo: NEW TRANSLATION
 HKG_housing_policy_modifier: "Bytová politika" # todo: NEW TRANSLATION
 HKG_housing_policy_modifier_desc: "Kumulativní dopad hongkongských rozhodnutí v oblasti bydlení, který se projevuje ve výstavbě, veřejných financích i trpělivosti obyvatel. Každý krok bytového programu tyto ukazatele posouvá k lepšímu, nebo k horšímu." # todo: NEW TRANSLATION
 HKG_small_house_policy: "Reformovat politiku malých domů" # todo: NEW TRANSLATION
 HKG_small_house_policy_desc: "Koloniální politika malých domů uděluje původním vesničanům z Nových teritorií právo postavit si nízkopodlažní dům na půdě předků. Její reforma uvolní rozsáhlé plochy pro výstavbu s vyšší hustotou, venkovské elity však budou každé změně svých zděděných privilegií odporovat." # todo: NEW TRANSLATION
 HKG_brownfield_consolidation: "Sloučit brownfieldy" # todo: NEW TRANSLATION
 HKG_brownfield_consolidation_desc: "Stovky hektarů v Nových teritoriích zabírají venkovní sklady, vrakoviště a kontejnerová depa. Sloučení těchto brownfieldů do vícepatrových zařízení uvolní půdu pod nimi pro bydlení bez jediné rekultivační bárky." # todo: NEW TRANSLATION
 HKG_revitalise_private_market: "Oživit soukromý trh" # todo: NEW TRANSLATION
 HKG_revitalise_private_market_desc: "Po odstranění veřejné konkurence se vláda obrací na developery. Nabízí zjednodušená povolovací řízení, uvolněné koeficienty zastavěnosti a daňové pobídky, aby se soukromé byty dostaly na trh rychleji." # todo: NEW TRANSLATION
 HKG_relax_mortgage_rules: "Uvolnit hypoteční pravidla" # todo: NEW TRANSLATION
 HKG_relax_mortgage_rules_desc: "Měnový úřad uvolňuje poměr úvěru k hodnotě nemovitosti a limity zátěžových testů. Kupující prvního bydlení konečně mohou překonat překážku akontace, kritici však varují před zadlužením domácností." # todo: NEW TRANSLATION
 HKG_vacancy_tax: "Zavést daň z neobsazenosti" # todo: NEW TRANSLATION
 HKG_vacancy_tax_desc: "Trestný odvod za nové byty, které zůstávají neprodané a neobydlené. Developeři již nemohou dávkovat dokončené jednotky na trh, aby udržovali vysoké ceny; spekulativní skladování bytů končí." # todo: NEW TRANSLATION
 HKG_light_public_housing: "Lehké veřejné bydlení" # todo: NEW TRANSLATION
 HKG_light_public_housing_desc: "Prefabrikovaná modulární sídliště postavená na nevyužívaných vládních pozemcích jako dočasné řešení pro rodiny uvázlé na čekací listině. Jsou levná a rychlá na výstavbu a poskytují Bytovému úřadu čas potřebný k trvalé výstavbě." # todo: NEW TRANSLATION
 HKG_tenancy_control: "Regulovat rozdělené byty" # todo: NEW TRANSLATION
 HKG_tenancy_control_desc: "Na nechvalně známé rozdělené jednotky ve městě se uvalují cenové stropy nájmů, povinné písemné smlouvy a minimální standardy. Pronajímatelé ztrácejí volnou ruku a desetitisíce lidí uvězněných v rozdělených kójích získávají určitou ochranu." # todo: NEW TRANSLATION
 HKG_starter_homes_scheme: "Program startovacích bytů" # todo: NEW TRANSLATION
 HKG_starter_homes_scheme_desc: "Nová vlastnická kategorie určená mladým profesionálům, kteří si nemohou dovolit ani veřejné bydlení, ani soukromý trh. Program nabízí byty pod tržní cenou s omezením dalšího prodeje a obnovuje první příčku na žebříku vlastnictví." # todo: NEW TRANSLATION
 HKG_artificial_islands: "Program umělých ostrovů" # todo: NEW TRANSLATION
 HKG_artificial_islands_desc: "Program rozsáhlých umělých ostrovů v centrálních vodách, navržený pro ubytování stovek tisíc lidí a vytvoření základů nové metropolitní čtvrti. Náklady dosahují stovek miliard a odpor ochránců životního prostředí je silný, zisk v podobě využitelné půdy je však bezkonkurenční." # todo: NEW TRANSLATION
 HKG_northern_metropolis: "Severní metropole" # todo: NEW TRANSLATION
 HKG_northern_metropolis_desc: "Rozsáhlý plán rozvoje Nových teritorií podél hranice se Šen-čenem, který propojí Hongkong s oblastí Velkého zálivu. Na severní hranici jsou naplánována nová města, železniční spojení a inovační pás." # todo: NEW TRANSLATION
 HKG_country_park_periphery: "Rozvíjet okraje venkovských parků" # todo: NEW TRANSLATION
 HKG_country_park_periphery_desc: "Nejméně ekologicky cenné okraje chráněných venkovských parků se otevírají výstavbě. Ochránci přírody jsou zděšeni vytvořeným precedentem; vláda trvá na tom, že během bytové krize je příliš cenné nechat tuto půdu ladem." # todo: NEW TRANSLATION
 HKG_redevelop_old_estates: "Přestavět stárnoucí sídliště" # todo: NEW TRANSLATION
 HKG_redevelop_old_estates_desc: "Nejstarší veřejná sídliště, postavená během desetiletí rozmachu a nyní chátrající, jsou zbourána a obnovena s moderní hustotou. Obyvatelé jsou dočasně vystěhováni a znovu ubytováni; na stejném půdorysu vznikne mnohem více bytů." # todo: NEW TRANSLATION
 HKG_abolish_subdivided_flats: "Zrušit rozdělené byty" # todo: NEW TRANSLATION
 HKG_abolish_subdivided_flats_desc: "Když je konečně k dispozici dostatek nových bytů, vláda přistupuje k zákazu rozdělených kójí a klecových bytů, které město zostuzovaly celou generaci. Éra rozdělených činžáků končí." # todo: NEW TRANSLATION
 HKG_urban_renewal_push: "Posílit Úřad pro obnovu měst" # todo: NEW TRANSLATION
 HKG_urban_renewal_push_desc: "Úřad pro obnovu měst získává rozsáhlejší pravomoci k nucenému výkupu a větší rozpočet na vyklizení a obnovu zchátralých čtvrtí. Starý Kowloon a nábřeží se přestavují blok po bloku." # todo: NEW TRANSLATION
 HKG_smart_city_housing: "Bydlení v chytrém městě" # todo: NEW TRANSLATION
 HKG_smart_city_housing_desc: "Nová sídliště jsou od základů vybavena integrovanou dopravou, chlazením čtvrtí a digitální správou. Hongkongský bytový fond se stává výkladní skříní ambicí oblasti Velkého zálivu v oblasti chytrých měst." # todo: NEW TRANSLATION
 HKG_housing_for_all: "Domov pro každého Hongkonžana" # todo: NEW TRANSLATION
 HKG_housing_for_all_desc: "Desetiletí trvající krize je prohlášena za ukončenou. Čekací listina je vyřízena, rozdělené byty zmizely a vlastnictví je znovu na dosah běžné rodiny. Generace, která vyrostla smířená s nájemním bydlením, může konečně usilovat o vlastní domov." # todo: NEW TRANSLATION
