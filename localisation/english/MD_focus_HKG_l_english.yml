 HKG_unrestricted_housing_market: "Neregulovaný trh s bydlením" # todo: NEW TRANSLATION
 HKG_unrestricted_housing_market_desc: "Hongkongský volný trh s bydlením patří mezi nejdynamičtější, ale také nejtrestuhodněji nedostupné na světě. Bez zásahu se rozdíl mezi příjmy a cenami bude dále prohlubovat." # todo: NEW TRANSLATION
 HKG_victoria_harbour: "Přístav Victoria" # todo: NEW TRANSLATION
 HKG_victoria_harbour_desc: "Přístav Victoria je historickým srdcem hongkongské přístavní ekonomiky: sbíhají se zde kontejnerová doprava, trajekty i terminály výletních lodí." # todo: NEW TRANSLATION
 HKG_victoria_harbour_expand_desc: "Rozšířený přístav Victoria s novými kontejnerovými stáními, prohloubenými kanály a modernizovanou manipulací s nákladem." # todo: NEW TRANSLATION
 HKG_victoria_harbour_expand_plus_desc: "Přístav Victoria v plné moderní kapacitě: automatizované terminály, hlubokovodní stání a nejvyšší průchodnost nákladu v regionu." # todo: NEW TRANSLATION
 legacy_of_handover_hong_kong: "Dědictví předání Hongkongu" # todo: NEW TRANSLATION
 legacy_of_handover_hong_kong_desc: "Předání v roce 1997 vytvořilo institucionální, ekonomické a kulturní vazby mezi Hongkongem a pevninou, které i po desetiletích nadále utvářejí politiku." # todo: NEW TRANSLATION
 Basic_Law_HKG: "Základní zákon Hongkongské zvláštní administrativní oblasti" # todo: MOVED KEY
 Basic_Law_milltary_HKG: "Základní zákon [HKG.GetFlag]Hongkongské SAR" # todo: NEW TRANSLATION
 Basic_Law_milltary_HKG_desc: "Podle Základního zákona je obrana vyhrazena ústřední vládě. Hongkong nemá vlastní ozbrojené síly; posádka CHKO v Hongkongu zajišťuje veškerou vnější obranu." # todo: NEW TRANSLATION
 Basic_Law_HKG_desc: "Základní zákon je zakládajícím dokumentem Hongkongské zvláštní administrativní oblasti po předání Hongkongu ze Spojeného království Čínské lidové republice. Dokument mimo jiné vymezuje postavení Hongkongu vůči Číně a zaručuje mu autonomii ve všech záležitostech kromě obrany a zahraniční politiky, které jsou svěřeny ústřední vládě." # todo: MOVED KEY
 One_Country_Two_Systems: "Jedna země, dva systémy" # todo: MOVED KEY
 One_Country_Two_Systems_desc: "Hongkongu a Macau bylo zaručeno 50 let autonomie od přímé čínské vlády. Model „jedna země, dva systémy“ umožňuje zachování a dokonce rozvoj mnoha ceněných politických svobod Hongkongu a Macaa, jako je svoboda projevu a svoboda shromažďování. Absence těchto práv na pevnině je významným faktorem podpory tzv. „pan-demokratického“ tábora v hongkongské politice, přičemž mnoho obyvatel Hongkongu zůstává obezřetných vůči hlubší integraci s pevninskou Čínou." # todo: MOVED KEY
 Localist_Movement: "Lokalistické hnutí" # todo: MOVED KEY
 Localist_Movement_desc: "Od předání Hongkongu v roce 1997 vedlo napětí mezi obyvateli Hongkongu a pevninské Číny k rozvoji lokálního sentimentu „Hongkong především“. Tento směr pohlíží s nedůvěrou na politický systém komunistické Číny a zároveň vnímá obyvatele Hongkongu jako kulturně odlišné, ba dokonce nadřazené obyvatelům Číny. Vzestup tohoto hnutí od Deštníkového hnutí v roce 2014 změnil dříve umírněný politický konflikt v Hongkongu v emotivnější a radikálnější." # todo: MOVED KEY
 Lacks_Universal_Suffrage: "Chybí všeobecné volební právo" # todo: MOVED KEY
 Lacks_Universal_Suffrage_desc: "Ačkoli Základní zákon stanoví, že výkonný správce i Legislativní rada mají být nakonec voleni na základě všeobecného volebního práva, k jeho zavedení dosud nedošlo především kvůli obavám Číny z možného převzetí moci výrazně populárnějšími pan-demokraty." # todo: MOVED KEY
 Limited_Universal_Suffrage: "Omezené všeobecné volební právo" # todo: MOVED KEY
 Limited_Universal_Suffrage_desc: "Čína souhlasila s tím, že výkonný správce Hongkongu může být volen všeobecným volebním právem, avšak pouze za podmínky, že kandidáti budou předem schváleni Čínou. Tento krok je široce vnímán jako snaha snížit šanci, že by se výkonným správcem stal pan-demokratický či lokalistický kandidát." # todo: MOVED KEY
 Universal_Suffrage: "Všeobecné volební právo" # todo: MOVED KEY
 Universal_Suffrage_desc: "Čína konečně souhlasila s tím, že Hongkongu umožní volit výkonného správce na základě všeobecného volebního práva bez zásahů čínských úřadů." # todo: MOVED KEY
 Hong_Kong_Protests: "Protesty v Hongkongu" # todo: MOVED KEY
 Hong_Kong_Protests_desc: "V reakci na nedávné kroky čínské vlády vypukly v Hongkongu rozsáhlé protesty požadující zrušení čínského rozhodnutí." # todo: MOVED KEY
 asian_crisis_HKG_desc: "Hospodářská krize, která sevřela rozvíjející se východní a jihovýchodní Asii, smetla desetiletí růstu. Ztráta důvěry v národní měny dodnes sužuje centrální banky. Veřejný i soukromý dluh rovněž prudce vzrostl.\n\nByly získány bolestivé lekce a dříve odmítané hospodářské reformy jsou v plném proudu. Každá země byla zasažena jinak a každá má vlastní řešení.\n\nPříliv investic do postižených zemí kdysi tvořil polovinu celkové světové hodnoty, nyní však proudí do [CHI.GetFlag]Číny a jinam." # todo: NEW TRANSLATION
 asian_crisis_league_HKG: "Hospodářská krize, která sevřela rozvíjející se východní a jihovýchodní Asii, smetla desetiletí růstu. Ztráta důvěry v národní měny dodnes sužuje centrální banky. Veřejný i soukromý dluh rovněž prudce vzrostl.\n\nByly získány bolestivé lekce a dříve odmítané hospodářské reformy jsou v plném proudu. Každá země byla zasažena jinak a každá má vlastní řešení.\n\nPříliv investic do postižených zemí kdysi tvořil polovinu celkové světové hodnoty, nyní však proudí do [CHI.GetFlag]Číny a jinam." # todo: NEW TRANSLATION
 HKG_HKEX: "Hongkongská burza a zúčtování" # todo: NEW TRANSLATION
 HKG_improve_trade: "Přilákat zahraniční investice" # todo: NEW TRANSLATION
 HKG_improve_trade_desc: "Koordinované úsilí o prohloubení obchodních vztahů Hongkongu v celé Asii i mimo ni: nové dohody, zjednodušené celní řízení a aktivní obchodní oddělení ambasád." # todo: NEW TRANSLATION
 HKG_idea_T_PARK: "§5T-PARK§!" # todo: NEW TRANSLATION
 HKG_idea_T_PARK_desc: "Zařízení T-PARK zpracovává hongkongské kaly z čistíren odpadních vod a zároveň vyrábí elektřinu, takže slouží jako infrastruktura pro nakládání s odpady i jako ekologická výkladní skříň." # todo: NEW TRANSLATION
 HKG_new_develop_idea_dynamic_modifier: "Nová rozvojová idea" # todo: NEW TRANSLATION
 HKG_new_develop_idea_dynamic_modifier_desc: "Souhrnné účinky Iniciativy nového rozvoje na hongkongskou ekonomiku a infrastrukturu." # todo: NEW TRANSLATION
 HKG_idea_secondary_education_reform: "Reforma středního školství" # todo: NEW TRANSLATION
 HKG_idea_secondary_education_reform_desc: "Starou strukturu středního vzdělávání 3-2-2-3 nahrazuje systém 3-3-4, který se již používá ve Spojených státech a v pevninské Číně. Překrývající se a zastaralý obsah je odstraněn a zavádí se širší nabídka volitelných předmětů." # todo: NEW TRANSLATION
 HKG_idea_patriotic_education_reform: "Reforma vlasteneckého vzdělávání" # todo: NEW TRANSLATION
 HKG_idea_patriotic_education_reform_desc: "Vlastenecké vzdělávání nemá v dosavadních hongkongských osnovách místo. Tuto mezeru zaplnil předmět Liberální studia." # todo: NEW TRANSLATION
 HKG_idea_chinese_based_education_reform: "Reforma vzdělávání založeného na čínštině" # todo: NEW TRANSLATION
 HKG_idea_chinese_based_education_reform_desc: "Na každé hongkongské škole se nyní vyučuje čínsky. Od všech dětí se očekává, že tímto jazykem budou mluvit." # todo: NEW TRANSLATION
 HKG_rise_of_internet: "Vzestup internetu" # todo: NEW TRANSLATION
 HKG_rise_of_internet_desc: "Internet otevřel nový směr lidského rozvoje. Zda půjde jen o krátkodobý fenomén, nebo o dominantní hospodářský trend nadcházejících desetiletí, se teprve ukáže." # todo: NEW TRANSLATION
 HKG_idea_SARS_outbreak: "Dopad SARS" # todo: NEW TRANSLATION
 HKG_idea_SARS_outbreak_desc: "Propuknutí SARS tvrdě zasáhlo hongkongskou ekonomiku i důvěru veřejnosti a narušilo turistiku, maloobchod i každodenní život v celém městě." # todo: NEW TRANSLATION
 HKG_idea_railway_development_strategy_2000: "Strategie rozvoje železnic 2000" # todo: NEW TRANSLATION
 HKG_idea_railway_development_strategy_2000_desc: "Strategie rozvoje železnic 2000 je hlavním plánem rozšiřování sítě MTR v příštím desetiletí." # todo: NEW TRANSLATION
 HKG_patriotic_loyalist_drive: "Vlastenecká loajalistická kampaň" # todo: NEW TRANSLATION
 HKG_patriotic_loyalist_drive_desc: "Vzdělávání v oblasti národní bezpečnosti zaplavuje školy, vysílání i veřejné služby. Výsledkem je poslušnější veřejnost a silnější stranické instituce, ovšem za cenu intelektuální otevřenosti a výzkumné produkce." # todo: NEW TRANSLATION
 HKG_loyalist_civil_service_purge: "Čistka loajalistů ve státní službě" # todo: NEW TRANSLATION
 HKG_loyalist_civil_service_purge_desc: "Prověřovací komise pročesávají státní službu a hledají váhající i skryté odpůrce. Každodenní správa během čistky trpí, ale byrokracie, která z ní vzejde, bude sloužit jedinému pánovi." # todo: NEW TRANSLATION
 HKG_mainland_talent_scheme: "Program talentů z pevniny" # todo: NEW TRANSLATION
 HKG_mainland_talent_scheme_desc: "Uvolněná místa ve hongkongské správě obsazují odborníci vyškolení na pevnině. Výzkumná produkce se obnovuje a úřady fungují efektivně, ale zmenšující se domácí pracovní síla ztěžuje místní mobilizaci politické moci." # todo: NEW TRANSLATION
 HKG_gba_integration_idea: "Integrace oblasti Velkého zálivu" # todo: NEW TRANSLATION
 HKG_gba_integration_idea_desc: "Hongkong, Macao, Šen-čen a Ču-chaj nyní fungují jako jedna ekonomika. Průmyslová výroba a obchod prosperují a hranice mezi SAR a pevninou se záměrně stírá." # todo: NEW TRANSLATION
 HKG_great_hong_kong_nation_idea: "Velký hongkongský národ" # todo: NEW TRANSLATION
 HKG_great_hong_kong_nation_idea_desc: "Hongkong vyhlásil svou svrchovanost navzdory Pekingu. Nálada je bojovná: morálka je vysoká, branná povinnost široká a generace, která dospívala při sledování represí proti deštníkům, je připravena bránit nezávislost, za niž bojovala. Vztahy s pevninou ustrnuly." # todo: NEW TRANSLATION
 HKG_city_state_doctrine: "Doktrína městského státu" # todo: NEW TRANSLATION
 HKG_city_state_doctrine_desc: "Hongkong následuje singapurský model: malý, neutrální, prosperující a technokratický. Ekonomika stojí na obchodu a financích, přístav je životní tepnou státu a vojenské ambice jsou pevně podřízeny obchodní pragmatičnosti." # todo: NEW TRANSLATION
 HKG_under_british_wing_idea: "Pod britskými křídly" # todo: NEW TRANSLATION
 HKG_under_british_wing_idea_desc: "Hongkong formalizoval své bezpečnostní a politické spojenectví se Spojeným královstvím a širším Společenstvím. Dobrovolníci z armád anglosféry, přednostní licencování technologií a jasný diplomatický postoj: starším partnerem je Londýn, nikoli Peking." # todo: NEW TRANSLATION
 HKG_pro_democracy_media: "Mediální charta pro demokracii" # todo: NEW TRANSLATION
 HKG_pro_democracy_media_desc: "Apple Daily, Stand News, RTHK a desítky menších médií působí pod výslovnou právní ochranou před politickými zásahy. Pevninské dezinformační sítě se obtížně prosazují a veřejná debata se jednoznačně přiklání k demokratickým normám." # todo: NEW TRANSLATION
 HKG_civil_society_funding: "Financování občanské společnosti" # todo: NEW TRANSLATION
 HKG_civil_society_funding_desc: "Nevládní organizace, sousedská sdružení a prodemokratické skupiny získávají transparentní veřejné financování. Výsledkem je angažovanější občanská kultura a tiše silnější demokratický tábor, hrazený z veřejných prostředků." # todo: NEW TRANSLATION
