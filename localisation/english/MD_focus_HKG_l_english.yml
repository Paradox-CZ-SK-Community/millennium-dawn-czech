 hongkong.8.t: "Rok draka" # todo: NEW TRANSLATION
 hongkong.8.d: "Od znovusjednocení s pevninou uplynuly tři roky. Hongkong překonal asijskou finanční krizi bez úpadku, který předpovídal Západ. S úsvitem nového tisíciletí bude město dál dokazovat, že integrace s Čínou není ničím špatným." # todo: NEW TRANSLATION
 hongkong.8.a: "San Nin Faa Lok! (Šťastný nový rok!)" # todo: NEW TRANSLATION
 hongkong.9.t: "Hongkong žádá o naši výzbroj" # todo: NEW TRANSLATION
 hongkong.9.d: "Hongkongská policie zadala objednávku ručních palných zbraní vyrobených v Číně. Objem je skromný, symbolika však významná: jde o první formální bezpečnostní nákup HKG od dodavatele z pevniny. Státní média již dohodu líčí jako známku rostoucí důvěry SAR v průmysl vlasti." # todo: NEW TRANSLATION
 hongkong.9.a: "Schválit za výhodné ceny" # todo: NEW TRANSLATION
 hongkong.9.b: "Využít okamžik ke státní propagandě" # todo: NEW TRANSLATION
 hongkong.13.t: "Peking odpovídá" # todo: NEW TRANSLATION
 hongkong.13.d: "Měsíc po výzvě LegCo k propuštění disidentů z pevniny vydává Úřad pro styk s pevninou ostré odsouzení. Státní média obviňují hongkongské politiky z „vměšování do vnitřních záležitostí Čínské lidové republiky“. Několik nenápadných zadržených je potichu propuštěno, mnozí další však zůstávají za mřížemi. Prodemokratický tábor zuří, vlastenecký tábor slaví vítězství." # todo: NEW TRANSLATION
 hongkong.13.a: "Uvítat částečná propuštění" # todo: NEW TRANSLATION
 hongkong.13.b: "Odsoudit Pekingovo napomenutí" # todo: NEW TRANSLATION
 hongkong.13.c: "Tiše věc odložit" # todo: NEW TRANSLATION
 HKG_aukus_request_tt: "§Y[ROOT.GetNameDef]§! požádá §H[ENG.GetName]§!, §H[USA.GetName]§! a §H[AST.GetName]§! o §Ypřístup ke sdílení zpravodajských informací§!. Mohou odmítnout." # todo: NEW TRANSLATION
 HKG_uk_garrison_request_tt: "§H[ENG.GetName]§! bude pozváno k rozmístění sil v Hongkongu. Může odmítnout." # todo: NEW TRANSLATION
 hongkong.14.t: "Hongkongská otázka" # todo: NEW TRANSLATION
 hongkong.14.d: "Dva miliony lidí v ulicích Hongkongu. Hnutí proti vydávání otřáslo politickým řádem SAR v samých základech. Propekingské úředníky žádají rozhodnější postup; pragmatici ve Státní radě varují, že přehnaná reakce odradí zahraniční kapitál. Stálý výbor politbyra rozhodne, jak odpovědět." # todo: NEW TRANSLATION
 hongkong.14.a: "Utáhnout otěže: formální loutkový status" # todo: NEW TRANSLATION
 hongkong.14.b: "Projevit zdrženlivost: zachovat rámec" # todo: NEW TRANSLATION
 hongkong.15.t: "Hongkong žádá o přístup k AUKUS" # todo: NEW TRANSLATION
 hongkong.15.d: "Prozápadní vláda Hongkongu formálně požádala o sdílení zpravodajských informací a přístup k základnám. Strategická hodnota přátelského přístavu na jižním okraji Číny je značná, Peking to však bude považovat za nepřátelský čin a bezpečnostní důsledky mohou působit oběma směry. Otázka míří k Radě národní bezpečnosti." # todo: NEW TRANSLATION
 hongkong.15.a: "Poskytnout přístup: Hongkong je strategickým aktivem" # todo: NEW TRANSLATION
 hongkong.15.b: "Odmítnout: držet Peking v odstupu" # todo: NEW TRANSLATION
 hongkong.16.t: "Hongkong zve britskou posádku" # todo: NEW TRANSLATION
 hongkong.16.d: "Hongkongská vláda formálně pozvala Spojené království k obnovení stálé vojenské posádky v SAR. Symbolika by byla mimořádná, diplomatické důsledky pro vztahy s Pekingem však vážné. Zpráva ministra obrany leží na stole kabinetu." # todo: NEW TRANSLATION
 hongkong.16.a: "Přijmout: obnovit britskou přítomnost" # todo: NEW TRANSLATION
 hongkong.16.b: "Odmítnout: diplomatická cena je příliš vysoká" # todo: NEW TRANSLATION
 hongkong.10.t: "Otázka všeobecného volebního práva" # todo: NEW TRANSLATION
 hongkong.10.d: "Podle Základního zákona byli první dva nejvyšší představitelé a první tři Legislativní rady zvoleni volební komisí, nikoli na základě všeobecného volebního práva. Volby nejvyššího představitele v roce 2007 a volby do LegCo v roce 2008 představují příležitost rozhodnout, zda by měl být hongkongský demokratický systém reformován, přičemž konečným cílem je plné všeobecné volební právo." # todo: NEW TRANSLATION
 hongkong.10.a: "Hongkongský volební systém zachová status quo." # todo: NEW TRANSLATION
 hongkong.10.b: "Okamžité všeobecné volební právo nepodporujeme, podpoříme však postupnou a spořádanou volební reformu." # todo: NEW TRANSLATION
 hongkong.10.c: "Můžeme být rovnou radikální a povolit všeobecné volební právo!" # todo: NEW TRANSLATION
 hongkong.11.t: "PCCW se slučuje s HKT" # todo: NEW TRANSLATION
 hongkong.11.d: "Cable & Wireless oznámila plány prodat Hong Kong Telecom společnosti SingTel navzdory námitkám čínské vlády. PCCW, ovládaná Li Tzar-kaiem, synem Li Ka-shinga, vstoupila do nabídkového řízení a nakonec zvítězila. Po oznámení fúze vzrostla cena akcií PCCW z několika centů na 28,50 HKD při závěru obchodování téhož dne, čímž její tržní kapitalizace krátce překročila 250 miliard HKD." # todo: NEW TRANSLATION
 hongkong.11.a: "Internet je úžasná věc!" # todo: NEW TRANSLATION
 hongkong.12.t: "Dopad prasknutí internetové bubliny" # todo: NEW TRANSLATION
 hongkong.12.d: "Po prasknutí internetové bubliny se cena akcií PCCW propadla o 98 %, jen několik měsíců poté, co ji fúze s Hong Kong Telecom vynesla vzhůru. Společnosti zůstal značný záporný vlastní kapitál a nezbylo jí než naplánovat prodej hlavní činnosti, aby zmírnila své finanční potíže." # todo: NEW TRANSLATION
 hongkong.12.a: "Nové tisíciletí, nové problémy." # todo: NEW TRANSLATION
 hongkong_legco.1.t: "Křesla LegCo v roce [GetYear]" # todo: NEW TRANSLATION
 hongkong_legco.1.d: "Legislativní rada se schází na nové funkční období. Počet křesel geografických a funkčních obvodů byl sečten a pracovní většiny komory jsou nyní známy. K přijetí návrhů bude zapotřebí [?HKG_legco_required_seats] křesel; u ústavních návrhů bude zapotřebí [?HKG_legco_specially_required_seats]." # todo: NEW TRANSLATION
 hongkong_legco.1.a: "Rozumím." # todo: NEW TRANSLATION
 hongkong_news.4.t: "123 Demokratická aliance je dnes rozpuštěna." # todo: NEW TRANSLATION
 hongkong_news.4.d: "123 Demokratická aliance, založená v roce 1994 skupinou pro-tchajwanských, prodemokratických a proobchodních politiků, byla rozpuštěna kvůli nedostatku finanční podpory tchajwanské vlády po porážce Kuomintangu v prezidentských volbách." # todo: NEW TRANSLATION
 hongkong_news.4.a: "Dobrá zpráva, ne?" # todo: NEW TRANSLATION
 hongkong_news.4.b: "Rozumím." # todo: NEW TRANSLATION
 hongkong_news.5.t: "Propuknutí SARS" # todo: NEW TRANSLATION
 hongkong_news.5.d: "V Kuang-tungu a Hongkongu došlo k propuknutí viru těžkého zápalu plic známého jako „SARS“. Navzdory tvrzením představitelů pevniny, že byl účinně zadržen, se nákaza v Hongkongu dále šíří. WHO nyní vydala varování před cestami do jižní Číny a Hongkongu a označila situaci za hrozbu pro zdraví celého světa. Dosud v důsledku nákazy zemřel jeden člověk. Hongkongská vláda zahájila povinnou karanténu osob podezřelých z nakažení." # todo: NEW TRANSLATION
 hongkong_news.5.a: "Náš turistický sektor má potíže." # todo: NEW TRANSLATION
 hongkong_news.5.b: "Zatknout neschopné úředníky a řešit nákazu transparentně." # todo: NEW TRANSLATION
 hongkong_news.5.c: "Musíme dál skrývat skutečná data, abychom zachovali společenskou stabilitu." # todo: NEW TRANSLATION
 hongkong_news.5.e: "Znepokojivý vývoj." # todo: NEW TRANSLATION
 hongkong_news.6.t: "Úmrtí Leslieho Cheunga" # todo: NEW TRANSLATION
 hongkong_news.6.d: "Celosvětově proslulý hongkongský zpěvák, herec a ikona Leslie Cheung spáchal ve věku 46 let sebevraždu skokem z budovy hotelu Mandarin v Hongkongu kvůli depresi. Leslie Cheung si získal srdce nespočtu fanoušků procítěnými písněmi, vynikajícím herectvím a jedinečným osobním kouzlem. Jeho úmrtí šokovalo celou čínskou komunitu a mnoho lidí hluboce zarmoutilo a zanechalo v beznaději.\n\nLeslieho úmrtí není jen významnou ztrátou pro zábavní průmysl, ale také kulturním a duchovním úderem. Jeho hudební a filmová díla budou nadále ovlivňovat a inspirovat budoucí umělce i diváky, jeho nepřítomnost však navždy zanechá nezaplnitelnou prázdnotu." # todo: NEW TRANSLATION
 hongkong_news.6.a: "Dnes jsme přišli o velkého umělce." # todo: NEW TRANSLATION
 hongkong_news.7.t: "Úmrtí Anity Mui" # todo: NEW TRANSLATION
 hongkong_news.7.d: "Anita Mui Yim-fong, široce známá jako „Madonna Asie“, zemřela ve věku 40 let po statečném boji s rakovinou děložního hrdla.\n\nAnita Mui, narozená v roce 1963, se proslavila v 80. letech a stala se klíčovou postavou kantopopu, přičemž zanechala trvalý odkaz milionům fanoušků. Její oddanost charitě a neochvějná síla tváří v tvář nemoci jí vynesly hluboký obdiv. Jak se zpráva o jejím úmrtí šíří, národ zahaluje pochmurná nálada a lidé se scházejí, aby uctili milovanou „Dceru Hongkongu“." # todo: NEW TRANSLATION
 hongkong_news.7.a: "Konec velké éry." # todo: NEW TRANSLATION
 hongkong_news.8.t: "Silná tropická bouře Utor" # todo: NEW TRANSLATION
 hongkong_news.8.d: "4. července v 17:45 vstoupil tajfun Yuet do varovné zóny o poloměru 800 kilometrů, což přimělo hongkongskou observatoř vydat pohotovostní signál č. 1. 5. července v 19:30 byl signál zvýšen na vichřicový nebo bouřkový signál č. 8, což bylo první vydání tohoto signálu ve 21. století. Kvůli bouřkovému přílivu vedla kombinace přílivové vlny a běžného ranního vysokého přílivu k hladině moře 3,4 metru naměřené v Quarry Bay, nejvyšší od úderu tajfunu Wanda na Hongkong v roce 1962. To 6. července způsobilo rozsáhlé záplavy v Tai O a na severozápadě Nových teritorií. Některé hlavní ulice v Tai O se proměnily v řeky a hloubka vody dosahovala až tří metrů. Zaplaven byl také velkoobchodní trh s mořskými plody v Lau Fau Shan, což donutilo mnoho obchodů zavřít." # todo: NEW TRANSLATION
 hongkong_news.8.a: "Observatoř odvedla svou práci." # todo: NEW TRANSLATION
 hongkong_news.9.t: "Silná tropická bouře Yutu (Měsíční králík)" # todo: NEW TRANSLATION
 hongkong_news.9.d: "Tropická bouře Yutu vstoupila do varovné zóny hongkongské observatoře, která vydala pohotovostní signál č. 1. Jízdní řády veřejné dopravy byly upraveny, školy přešly do pohotovosti a městské odvodňovací i záchranné služby byly aktivovány. Observatoř očekává nejhorší situaci během následujících dvaceti čtyř hodin." # todo: NEW TRANSLATION
 hongkong_news.9.a: "Zůstat doma a přečkat bouři." # todo: NEW TRANSLATION
