 HUN_annex_karpatalja: "Vyslyšte volání z Karpatalje" # todo: NEW TRANSLATION
 HUN_annex_karpatalja_desc: "Ukrajinská moc v Zakarpatsku se zhroutila. Místní maďarské rady žádají Budapešť o uznání sjednocení a v Kyjevě už nezbyl nikdo, kdo by řekl ne." # todo: NEW TRANSLATION
 HUN_karpatalja_ultimatum: "Ultimátum Kyjevu" # todo: NEW TRANSLATION
 HUN_karpatalja_ultimatum_desc: "Maďarská menšina v Karpatalji čeká celé století na znovusjednocení s mateřskou zemí. Kyjev by jí měl tiše předat, nebo o ni přijde násilím." # todo: NEW TRANSLATION
 HUN_karpatalja_integration_category: "Správa Karpatalje" # todo: NEW TRANSLATION
 HUN_701_return: "Návrat Karpatalje" # todo: NEW TRANSLATION
 HUN_701_return_desc: "Karpatalja byla ztracena v Trianonu. Nyní, když je zajištěn souhlas provincie, můžeme sjednocení učinit trvalým." # todo: NEW TRANSLATION
 HUN_karpatalja_autonomy: "Správa Karpatalje" # todo: NEW TRANSLATION
 HUN_karpatalja_autonomy_desc: "Správa Karpatalje prostřednictvím místních rad získá podporu a urychlí její integraci, za cenu pomalejšího dohledu nad rozpočtem a veřejné trpělivosti s tímto uspořádáním." # todo: NEW TRANSLATION
