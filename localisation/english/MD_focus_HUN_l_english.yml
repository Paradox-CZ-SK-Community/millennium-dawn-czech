 hungary_karpatalja.1.t: "Rady Karpatalje" # todo: NEW TRANSLATION
 hungary_karpatalja.1.d: "Protože Kyjev nedokáže prosadit svou moc tak daleko od hlavního města, místní shromáždění v Zakarpatsku odhlasovala žádost o sjednocení s Maďarskem. Budapešť je až příliš ochotná vyhovět." # todo: NEW TRANSLATION
 hungary_karpatalja.1.a: "Vítejte doma" # todo: NEW TRANSLATION
 hungary_karpatalja.2.t: "Správa Karpatalje" # todo: NEW TRANSLATION
 hungary_karpatalja.2.d: "Karpatalja je na mapě maďarská. Proměnit to ve fungující správu je však jiná věc a vláda musí rozhodnout, jak tvrdou ruku použít." # todo: NEW TRANSLATION
 hungary_karpatalja.2.a: "Vládnout prostřednictvím místních rad" # todo: NEW TRANSLATION
 hungary_karpatalja.2.b: "Přímá vláda z Budapešti" # todo: NEW TRANSLATION
 hungary_karpatalja.10.t: "Budapešť požaduje Karpatalju" # todo: NEW TRANSLATION
 hungary_karpatalja.10.d: "Maďarsko předložilo ultimátum: předejte Zakarpatsko, nebo čelte následkům. Vláda musí rozhodnout, jak odpoví." # todo: NEW TRANSLATION
 hungary_karpatalja.10.a: "Postoupit provincii" # todo: NEW TRANSLATION
 hungary_karpatalja.10.b: "Odmítnout ultimátum" # todo: NEW TRANSLATION
 hungary_karpatalja.11.t: "Kyjev odmítá" # todo: NEW TRANSLATION
 hungary_karpatalja.11.d: "Ukrajina odmítla naše požadavky ohledně Karpatalje. Pokud provincii chceme, budeme si ji muset vzít sami." # todo: NEW TRANSLATION
 hungary_karpatalja.11.a: "Připravit se na válku" # todo: NEW TRANSLATION
