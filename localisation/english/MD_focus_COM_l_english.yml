l_english:
 comoros_focus: "Strom zaměření Komor" # todo: NEW TRANSLATION
 COM_anjouan_idea: "Anžuánské povstání" # todo: NEW TRANSLATION
 COM_anjouan_idea_desc: "Ostrov Anžუán vyhlásil otevřenou vzpouru proti vládě [COM.GetAdjective]. Ostrov Anžუán je druhým největším ostrovem v [COM.GetName] a představuje obrovskou část země. Jako důvody svého odporu otevřeně uvádějí nedostatečné zastoupení, spravedlivé a svobodné volby a autonomii ostrova. Pokud nezasáhneme rychle, je možné, že se od země zcela odtrhnou." # todo: NEW TRANSLATION
 COM_poor_military_idea: "Zkorumpovaná armáda" # todo: NEW TRANSLATION
 COM_poor_military_idea_desc: "Ozbrojené síly fungují spíše jako skupina mocenských hráčů sledujících vlastní zájmy než jako profesionální armáda. Jejich loajalita závisí na vládních platbách a udržování pořádku, avšak tato podpora je vždy podmíněná. Postupem času hrozí každé vládě, že si jejich přízeň znepřátelí, což ohrožuje stabilitu národa." # todo: NEW TRANSLATION
 COM_big_problems_idea: "Neefektivní vláda" # todo: NEW TRANSLATION
 COM_big_problems_idea_desc: "Naše vláda je sužována drakonickými, nefunkčními nebo zcela nefungujícími úřady a agenturami. Zaměření na odstranění a nápravu nedostatků vlády by mělo být jednou z našich hlavních priorit do budoucna." # todo: NEW TRANSLATION
 COM_minority_inclusive_idea: "Zahrnutí menšin" # todo: NEW TRANSLATION
 COM_minority_inclusive_idea_desc: "Navzdory tomu, že [COM.GetName] je malým národem, má daleko k homogenní společnosti a skládá se z mnoha různých etnických skupin a lidí ze všech společenských vrstev. Je důležité, aby se menšiny podílely na správě našeho národa, jinak bude národ trpět." # todo: NEW TRANSLATION
 COM_eau_military_coop_idea: "EAU vojenská spolupráce" # todo: NEW TRANSLATION
 COM_eau_military_coop_idea_desc: "" # todo: NEW TRANSLATION
 COM_dictators_idea: "Drobní diktátoři" # todo: NEW TRANSLATION
 COM_dictators_idea_desc: "Komory zažily v posledních desetiletích mnoho úspěšných i neúspěšných převratů. Guvernéři se snaží uzurpovat moc na úkor ústřední vlády." # todo: NEW TRANSLATION
 COM_pro_farmers_idea: "Podpora zemědělců" # todo: NEW TRANSLATION
 COM_pro_farmers_idea_desc: "Ačkoli jsou Komory malou zemí s omezeným množstvím půdy a rozsáhlým zemědělstvím, měli bychom upřednostnit zemědělce, rybáře a další pracovníky v zemědělství." # todo: NEW TRANSLATION
 COM_agricultural_developments_idea: "Rozvoj zemědělství" # todo: NEW TRANSLATION
 COM_agricultural_developments_idea_desc: "Zaměření na rozvoj našeho zemědělského průmyslu nám pomůže ekonomicky se zotavit z nestability od získání nezávislosti a umožní nám růst díky našim největším přírodním zdrojům." # todo: NEW TRANSLATION
 COM_small_ship_project: "Projekt malých lodí" # todo: NEW TRANSLATION
 COM_small_ship_project_desc: "Naše námořní přítomnost byla příliš dlouho nedostatečná. Úzkou spoluprací s místními loděnicemi a staviteli lodí můžeme spustit skromnou flotilu, posílit pobřežní obranu a prosadit náš vliv v okolních vodách." # todo: NEW TRANSLATION
 COM_volcano_idea: "Ztráty v zemědělství způsobené sopečným popelem" # todo: NEW TRANSLATION
 COM_volcano_idea_desc: "Erupce hory Karthala pokryla rozsáhlé oblasti sopečným popelem a způsobila vážné škody na úrodě. Obnova zemědělské půdy potrvá dlouho a zemědělská produktivita zůstane v dohledné budoucnosti snížená." # todo: NEW TRANSLATION
 COM_typhoon_idea: "Obnova po škodách způsobených cyklonem" # todo: NEW TRANSLATION
 COM_typhoon_idea_desc: "Obnova po ničivém dopadu cyklonu Kenneth pokračuje, přičemž zemědělství a infrastruktura potřebují čas na obnovu." # todo: NEW TRANSLATION
 COM_total_ban_on_personal_weapons_idea: "Úplný zákaz osobních zbraní" # todo: NEW TRANSLATION
 COM_total_ban_on_personal_weapons_idea_desc: "Osobní obranné zbraně byly na Komorách v posledních několika desetiletích běžné, ale už je nepotřebujeme. Měli bychom odzbrojit naše občany a zcela zakázat osobní zbraně. Pomůže nám to stabilizovat společnost a snížit riziko násilí nyní i v budoucnu." # todo: NEW TRANSLATION
 COM_naval_treaty_with_france_idea: "Francouzsko-komorská smlouva o námořní obraně" # todo: NEW TRANSLATION
 COM_naval_treaty_with_france_idea_desc: "Jednání s Francouzi byla úspěšná. Uzavřeli jsme smlouvu o námořní obraně s [FRA.GetName]. Za cenu omezení našeho místního rozvoje námořních plavidel získáme rozsáhlou obrannou dohodu a balíček hospodářských stimulů." # todo: NEW TRANSLATION
 COM_naval_treaty_with_china_idea: "Čínsko-komorská smlouva o námořní obraně" # todo: NEW TRANSLATION
 COM_naval_treaty_with_china_idea_desc: "Jednání s Číňany byla úspěšná. Uzavřeli jsme smlouvu o námořní obraně s [CHI.GetName]. Za cenu omezení našeho místního rozvoje námořních plavidel získáme rozsáhlou obrannou dohodu a balíček hospodářských stimulů." # todo: NEW TRANSLATION
 COM_the_comoros_tourism_industry: "Turistický průmysl" # todo: NEW TRANSLATION
 COM_the_comoros_tourism_industry_desc: "[COM.GetAdjective] turistický průmysl na Komorách je významnou, ale klíčovou součástí země. Přináší hospodářský růst a příjmy místním podnikům na mnoha ostrovech souostroví." # todo: NEW TRANSLATION
 COM_small_ship_project_idea: "[COM.GetAdjective] projekty malých lodí" # todo: NEW TRANSLATION
 COM_small_ship_project_idea_desc: "Díky spolupráci s místními loděnicemi a mezinárodními partnery jsme úspěšně zahájili program výstavby skromných námořních plavidel. Tyto lodě posilují naše schopnosti pobřežní obrany a zvyšují naši námořní přítomnost v regionu." # todo: NEW TRANSLATION
 COM_the_east_africa_entrepot_idea: "Východoafrické obchodní centrum" # todo: NEW TRANSLATION
 COM_the_east_africa_entrepot_idea_desc: "Díky strategickému rozvoji přístavů a komplexním hospodářským partnerstvím se Komory etablovaly jako důležité obchodní centrum na východoafrickém pobřeží. Naše strategická poloha usnadňuje obchod mezi Afrikou, Blízkým východem a Asií a přináší prosperitu našim ostrovům." # todo: NEW TRANSLATION
 COM_militarized_police_force_idea: "Militarizované policejní síly" # todo: NEW TRANSLATION
 COM_militarized_police_force_idea_desc: "Vzhledem k nedávné historii nestability a převratů byly naše policejní síly reorganizovány a vybaveny tak, aby zvládaly občanské nepokoje i vojenské hrozby. Přestože se hranice mezi policií a armádou setřela, tato schopnost plnit obě role zajišťuje, že dokážeme udržet pořádek bez ohledu na výzvy, kterým čelíme." # todo: NEW TRANSLATION
 COM_comorosian_private_military_companies: "[COM.GetAdjective] soukromé vojenské společnosti" # todo: NEW TRANSLATION
 COM_comorosian_private_military_companies_desc: "Komory se staly domovem několika soukromých vojenských společností působících doma i v zahraničí. Tyto SVS poskytují bezpečnostní služby, vojenský výcvik a podporu operací v celém regionu, vytvářejí příjmy a zároveň z naší země činí centrum soukromých vojenských znalostí." # todo: NEW TRANSLATION
 COM_unstable_government_idea: "Nestabilní vláda" # todo: NEW TRANSLATION
 COM_unstable_government_idea_desc: "Nedávné události a nestabilita ve vládě způsobily její mimořádnou nestabilitu, která brání stabilním a progresivně uvažujícím Komorám. Je důležité, abychom začali vládu stabilizovat, jinak bude i nadále ve stavu neustálých změn." # todo: NEW TRANSLATION
 COM_state_of_the_pmcs_idea: "Stát soukromých vojenských společností" # todo: NEW TRANSLATION
 COM_state_of_the_pmcs_idea_desc: "Oficiálním uznáním a podporou soukromých vojenských společností jako legitimních institucí v naší zemi jsme vytvořili jedinečný ekonomický model, v němž SVS významně přispívají k našemu HDP a vojenským schopnostem. Stát aktivně usnadňuje jejich operace výměnou za bezpečnostní záruky a hospodářské výhody." # todo: NEW TRANSLATION
 COM_expanded_regional_operations_idea: "Rozšířené regionální operace" # todo: NEW TRANSLATION
 COM_expanded_regional_operations_idea_desc: "Naše armáda a síly SVS jsou nyní schopny nasazení v celém východoafrickém regionu. Tento rozšířený operační dosah nám umožňuje uzavírat bezpečnostní kontrakty, účastnit se mírových misí a provádět vojenské podpůrné operace v sousedních státech." # todo: NEW TRANSLATION
 COM_expanded_global_operations_idea: "Rozšířené globální operace" # todo: NEW TRANSLATION
 COM_expanded_global_operations_idea_desc: "S dostatečným financováním a podporou mohou naše soukromé vojenské síly nyní přijímat kontrakty po celém světě, místo aby omezovaly své operace na Afriku. Tento globální dosah výrazně zvyšuje potenciál příjmů a činí z Komor významného hráče v mezinárodním bezpečnostním průmyslu." # todo: NEW TRANSLATION
 COM_mayotte_referendum_decisions: "Referendum na Mayotte" # todo: NEW TRANSLATION
 COM_mayotte_referendum_decisions_desc: "Ostrov Mayotte je jedním z mnoha ostrovů Komorského souostroví. Obyvatelé Mayotte v současnosti rozhodují, zda chtějí zůstat součástí Francouzské republiky, připojit se ke Komorám, nebo se stát nezávislými. Můžeme podpořit francouzské hnutí, aby Mayotte zůstalo součástí Francie, komorské hnutí, nebo hnutí za nezávislost.\n\nSoučasný očekávaný podíl hlasů je následující:\n\n- Francie: [?COM.mayotte_referendum_france|Y]% hlasů\n- Komory: [?COM.mayotte_referendum_comoros|Y]% hlasů\n- Nezávislost: [?COM.mayotte_referendum_independence|Y]% hlasů" # todo: NEW TRANSLATION
 COM_mayotte_referendum_mission: "Referendum o statusu Mayotte" # todo: NEW TRANSLATION
 COM_mayotte_referendum_mission_desc: "Referendum se blíží. Máme jen omezený čas na přípravu, než bude pozdě." # todo: NEW TRANSLATION
 COM_mayotte_french_support_campaign_decision: "[FRA.GetFlag] [FRA.GetAdjective] kampaň na podporu" # todo: NEW TRANSLATION
 COM_mayotte_french_support_campaign_decision_desc: "Mayotte je neoddělitelnou součástí našich [FRA.GetAdjective] území v Indickém oceánu. Měli bychom podpořit francouzské stoupence v regionu a zajistit vítězství jejich strany v referendu." # todo: NEW TRANSLATION
 COM_mayotte_independence_support_campaign_decision: "[MTE.GetFlag] [MTE.GetAdjective] kampaň na podporu nezávislosti" # todo: NEW TRANSLATION
 COM_mayotte_independence_support_campaign_decision_desc: "Obyvatelé Mayotte touží po nezávislosti již velmi dlouho. Měli bychom oslovit vůdce hnutí za nezávislost a zvážit rozšíření práv obyvatel Mayotte." # todo: NEW TRANSLATION
 COM_mayotte_comorian_support_campaign_decision: "[COM.GetFlag] [COM.GetAdjective] kampaň na podporu" # todo: NEW TRANSLATION
 COM_mayotte_comorian_support_campaign_decision_desc: "Mayotte je součástí Komorského souostroví, a proto by mělo být součástí naší velké federace. Je nezbytné, abychom nadále podporovali naše bratry a sestry v regionu a zajistili, že jejich stanovisko bude vyslyšeno." # todo: NEW TRANSLATION
 COM_the_constitutional_referendum_decisions: "Ústavní referendum" # todo: NEW TRANSLATION
 COM_the_constitutional_referendum_decisions_desc: "V posledních letech zažívají Komory politickou nestabilitu a řadu převratů. Ústava Komor nyní musí být revidována, aby byla zajištěna stabilita země. Můžeme podpořit federalistické nebo centralistické hnutí, v nadcházejícím referendu se však musíme postavit na jednu stranu.\n\nPodpora federalistů: [?COM_federalist_constitutional_support|Y%0]\nPodpora centralistů: [?COM_anti_federalist_constitutional_support|Y%0]" # todo: NEW TRANSLATION
 COM_the_constitutional_referendum_mission: "Referendum" # todo: NEW TRANSLATION
 COM_the_constitutional_referendum_mission_desc: "Referendum se blíží a my se v něm musíme postavit na jednu stranu. Budoucnost Komor ukáže až čas." # todo: NEW TRANSLATION
 COM_anti_federalist_opinion_campaign_decision: "Kampaň ant federalistů" # todo: NEW TRANSLATION
 COM_anti_federalist_opinion_campaign_decision_desc: "" # todo: NEW TRANSLATION
 COM_federalist_opinion_campaign_decision: "Kampaň federalistů" # todo: NEW TRANSLATION
 COM_federalist_opinion_campaign_decision_desc: "" # todo: NEW TRANSLATION
 COM_comorian_political_decisions: "[COM.GetAdjective] politická rozhodnutí" # todo: NEW TRANSLATION
 COM_comorian_political_decisions_desc: "Klíčová politická rozhodnutí týkající se bezpečnostního aparátu Komor a politiky žoldnéřství." # todo: NEW TRANSLATION
 COM_disband_the_presidential_guard_decision: "Rozpustit prezidentskou gardu" # todo: NEW TRANSLATION
 COM_disband_the_presidential_guard_decision_desc: "Prezidentská garda se stala symbolem autoritářské vlády a žoldnéřského vlivu na Komorách. Rozpuštění těchto sil vyšle signál o začátku nové éry demokratické správy, může nás však zanechat zranitelnými vůči budoucím bezpečnostním hrozbám." # todo: NEW TRANSLATION
 COM_hire_control_risks_decision: "Vytvořit polovojenské křídlo Control Risks Group" # todo: NEW TRANSLATION
 COM_hire_control_risks_decision_desc: "Control Risks Group je britská poradenská firma v oblasti rizik, která může poskytovat profesionální bezpečnostní služby. Přestože je dražší než jiné možnosti, její pověst diskrétnosti a profesionality z ní činí ideální volbu pro udržení stability v našem křehkém národě." # todo: NEW TRANSLATION
 COM_hire_executive_outcomes_decision: "Reformovat Executive Outcomes" # todo: NEW TRANSLATION
 COM_hire_executive_outcomes_decision_desc: "Executive Outcomes je jihoafrická soukromá vojenská společnost s kontroverzní pověstí. Jejich zkušenosti z afrických konfliktních zón by nám mohly poskytnout značné vojenské znalosti, jejich přítomnost však může vyvolat mezinárodní obavy a destabilizovat naši vládu." # todo: NEW TRANSLATION
 COM_hire_defense_systems_decision: "Reformovat Defense Systems" # todo: NEW TRANSLATION
 COM_hire_defense_systems_decision_desc: "Defense Systems Limited byla britská soukromá vojenská společnost působící během studené války. Reformování této organizace by nám mohlo poskytnout zkušené bezpečnostní kontraktory, kteří rozumějí složitostem obrany malého ostrovního státu." # todo: NEW TRANSLATION
 COM_hire_watchguard_decision: "Reformovat Watchguard" # todo: NEW TRANSLATION
 COM_hire_watchguard_decision_desc: "WatchGuard International byla britská soukromá vojenská společnost, která ukončila činnost v roce 1972. Obnovení této organizace by nám umožnilo využít žoldnéře s prokázanými výsledky, jejich agresivní taktika by však mohla poškodit naši mezinárodní pověst." # todo: NEW TRANSLATION
 COM_reform_7_independent_company_decision: "Reformovat 7. nezávislou rotu" # todo: NEW TRANSLATION
 COM_reform_7_independent_company_decision_desc: "7. nezávislá rota byla jednotkou Roberta Denarda v Rhodesii. Reformování této jednotky umožní vytvořit sílu specificky loajální našemu králi válečníkovi, zároveň však bude loajální Denardovi." # todo: NEW TRANSLATION
 COM_reformed_7_independent: "Reformována §Y7. nezávislá rota§!" # todo: NEW TRANSLATION
 comoros.1.t: "Otázka loajality" # todo: NEW TRANSLATION
 comoros.1.d: "Ačkoli se Sýrie a Irák prohlašují za ideální představitele baasistické ideologie, obvykle spolu nevycházejí. Požadují naši loajalitu. Na čí straně stojíme?" # todo: NEW TRANSLATION
 comoros.1.a: "Háfiz je nejmoudřejší!" # todo: NEW TRANSLATION
 comoros.1.b: "Saddám zná cestu!" # todo: NEW TRANSLATION
 comoros.1.c: "Možná bychom je měli zkusit usmířit?" # todo: NEW TRANSLATION
 comoros.4.t: "Ústavní referendum" # todo: NEW TRANSLATION
 comoros.4.d: "Po nedávném převratu, který zbavil moci Tadjidinea Ben Saida Massoundea, zůstává struktura naší vlády nedokončená. Prezident Azali Assoumani strávil uplynulý rok stabilizací země a nyní nastal čas uspořádat ústavní referendum. Lid rozhodne, jakou formu vlády by měly Komory přijmout, přestože veřejné mínění můžeme ovlivnit. Kterou cestu bychom měli podpořit?" # todo: NEW TRANSLATION
 comoros.4.a: "Federální stát je správná cesta." # todo: NEW TRANSLATION
 comoros.4.b: "Centralistický stát je správná cesta." # todo: NEW TRANSLATION
 comoros.5.t: "Komory si nárokují Banc du Geyser!" # todo: NEW TRANSLATION
 comoros.5.d: "Vláda Komor si nedávno nárokovala Banc du Geyser a kontroluje ropná pole nacházející se v tomto regionu." # todo: NEW TRANSLATION
 comoros.5.a: "Francie je donutí svého rozhodnutí litovat!" # todo: NEW TRANSLATION
 comoros.5.b: "Jak se opovažují nárokovat si madagaskarské vody!" # todo: NEW TRANSLATION
 comoros.6.t: "Komory si nárokují Glorioské ostrovy" # todo: NEW TRANSLATION
 comoros.6.d: "Komory nedávno prohlásily, že nyní považují Glorioské ostrovy za součást svého území." # todo: NEW TRANSLATION
 comoros.6.a: "Jejich malicherné výkřiky nás nezajímají." # todo: NEW TRANSLATION
 comoros.7.t: "Námořní základna na Komorách" # todo: NEW TRANSLATION
 comoros.7.d: "[COM.GetAdjective] nám nabídli možnost zřídit formální námořní základnu na ostrově Grande Comore. Zřízení dalších námořních základen v regionu nám umožní dále šířit náš vliv a chránit naše strategické zájmy ve východní Africe. Přijmeme podmínky [COM.GetAdjective]?" # todo: NEW TRANSLATION
 comoros.7.a: "Skvělé!" # todo: NEW TRANSLATION
 comoros.7.b: "Vlastně..." # todo: NEW TRANSLATION
 comoros.8.t: "Operace Demokracie na Komorách" # todo: NEW TRANSLATION
 comoros.8.d: "Jsme připraveni provést vojenskou operaci a napadnout ostrov ovládaný vzbouřeným vojevůdcem." # todo: NEW TRANSLATION
 comoros.8.a: "Povoláme naše spravedlivé spojence!" # todo: NEW TRANSLATION
 comoros.9.t: "[COM.GetName] žádá o pomoc" # todo: NEW TRANSLATION
 comoros.9.d: "Komory nás žádají o pomoc při provedení speciální operace proti vzbouřenému vojevůdci na jednom ze svých ostrovů!" # todo: NEW TRANSLATION
 comoros.9.a: "Samozřejmě" # todo: NEW TRANSLATION
 comoros.9.b: "Vlastně nám na tom nezáleží." # todo: NEW TRANSLATION
 comoros.10.t: "Úspěšná operace!" # todo: NEW TRANSLATION
 comoros.10.d: "Operaci jsme úspěšně provedli. Vláda vojevůdce padla!" # todo: NEW TRANSLATION
 comoros.10.a: "Skvělé" # todo: NEW TRANSLATION
 comoros.11.t: "Protikoloniální shromáždění na Mayotte" # todo: NEW TRANSLATION
 comoros.11.d: "Na Komorách vypukly masové protesty odsuzující francouzskou kontrolu Mayotte. Protikoloniální nálady v celém souostroví sílí. Doufejme, že obyvatelé Mayotte nedostanou z této bezuzdné demonstrace neklidu nějaké podnětné nápady..." # todo: NEW TRANSLATION
 comoros.11.a: "Zajímavé..." # todo: NEW TRANSLATION
 comoros.12.t: "Komory požadují Mayotte!" # todo: NEW TRANSLATION
 comoros.12.d: "Obyvatelé Mayotte mají právo být svobodní a vaše malá koloniální říše by je neměla nechat trpět ve jménu vykořisťování! Osvoboďte je, nebo bude válka!" # todo: NEW TRANSLATION
 comoros.12.a: "Zajištění stability je naší nejvyšší prioritou." # todo: NEW TRANSLATION
 comoros.12.b: "Jen si to zkuste, hajzlové." # todo: NEW TRANSLATION
 comoros.13.t: "Zámořské území Komor" # todo: NEW TRANSLATION
 comoros.13.d: "Vláda Komor nás oslovila s možností návratu pod Francii jako zámořský departement, který by zajistil hospodářskou a finanční stabilitu a příslib vojenské ochrany před sousedy v případě, že by se něco stalo." # todo: NEW TRANSLATION
 comoros.13.a: "Schválit připojení" # todo: NEW TRANSLATION
 comoros.13.b: "Odmítnout žádost" # todo: NEW TRANSLATION
 comoros.14.t: "Francie dohodu přijímá" # todo: NEW TRANSLATION
 comoros.14.d: "Francie se rozhodla umožnit nám stát se zámořským územím. Nyní získáme finanční podporu a vojenskou ochranu, přičemž zůstaneme nominálně nezávislí s místní samosprávou." # todo: NEW TRANSLATION
 comoros.14.a: "Hurá!" # todo: NEW TRANSLATION
 comoros.15.t: "Politika na Komorách" # todo: NEW TRANSLATION
 comoros.15.d: "Rok 2000 byl pro Komory, malý národ u pobřeží Afriky, bouřlivým obdobím. Zemi vládla koaliční vláda složená ze zástupců tří hlavních ostrovů: Grande Comore, Anjouan a Mohéli. Mezi ostrovy však panovalo napětí, protože každý usiloval o větší moc a více zdrojů. To vedlo k časté politické nestabilitě a převratům, neboť politici se pokoušeli získat kontrolu nad vládou. V lednu 2000 vojenský převrat vedený plukovníkem Azalim Assoumanim svrhl prezidenta Tadjidinea Ben Saida Massoundea. Assoumani slíbil obnovení stability země a uspořádání svobodných a spravedlivých voleb. Budoucnost Komor ukáže až čas." # todo: NEW TRANSLATION
 comoros.15.a: "Zajímavé" # todo: NEW TRANSLATION
 comoros.16.t: "Komory hledají investice" # todo: NEW TRANSLATION
 comoros.16.d: "Velvyslanci [COM.GetAdjective] za námi přišli s řadou návrhů možných investic v ostrovním státě. Ačkoli nejsou významným obchodním partnerem ani velkou ekonomikou, můžeme v zemi provést cílené investice, které by snad mohly přinést poměrně vysoké výnosy. Nejvíce nás zaujaly dva návrhy týkající se průmyslových grantů a restrukturalizace dluhu. Který bychom měli zvolit? Mohli bychom jejich žádost také jednoduše ignorovat." # todo: NEW TRANSLATION
 comoros.16.a: "Investujme do jejich průmyslu!" # todo: NEW TRANSLATION
 comoros.16.b: "Pomozme jim s dluhem." # todo: NEW TRANSLATION
 comoros.16.c: "Komory? Nashledanou." # todo: NEW TRANSLATION
 comoros.17.t: "[FROM.GetName] souhlasí s průmyslovým plánem" # todo: NEW TRANSLATION
 comoros.17.d: "Naši velvyslanci se vracejí s dobrou zprávou. [FROM.GetName] souhlasí s rozvojem dalších továren a průmyslové infrastruktury v zemi." # todo: NEW TRANSLATION
 comoros.17.a: "Úžasné!" # todo: NEW TRANSLATION
 comoros.18.t: "[FROM.GetName] souhlasí s restrukturalizací dluhu" # todo: NEW TRANSLATION
 comoros.18.d: "[FROM.GetName] se rozhodl restrukturalizovat část našeho dluhu odkoupením a odpuštěním jeho části. Uvolní nám to další prostředky a možnosti utrácet více na jiné důležité věci v zemi." # todo: NEW TRANSLATION
 comoros.18.a: "Dobře" # todo: NEW TRANSLATION
 comoros.19.t: "[FROM.GetName]" # todo: NEW TRANSLATION
 comoros.19.d: "Velvyslanci, které jsme vyslali do [FROM.GetName], přinesli smutné zprávy. Nemají zájem spolupracovat na restrukturalizaci našeho dluhu ani na průmyslovém rozvoji." # todo: NEW TRANSLATION
 comoros.19.a: "Sakra." # todo: NEW TRANSLATION
 comoros.20.t: "Zmařený plán převratu" # todo: NEW TRANSLATION
 comoros.20.d: "Únor 2003. Bezpečnostní síly oznámily, že úspěšně zmařily plán převratu proti prezidentu Azalimu Assoumanimu. Několik vojáků a místních ministrů bylo zatčeno pro podezření z plánování svržení vlády. Přestože byla bezprostřední hrozba potlačena, incident poukazuje na přetrvávající nestabilitu v naší mladé Unii." # todo: NEW TRANSLATION
 comoros.20.a: "To bylo o fous." # todo: NEW TRANSLATION
 comoros.21.t: "Erupce hory Karthala" # todo: NEW TRANSLATION
 comoros.21.d: "Hora Karthala na jihu ostrova Grande Comore vybuchla a pokryla rozsáhlou oblast včetně hlavního města Moroni sopečným popelem. Popel kontaminoval pitnou vodu, vážně poškodil úrodu a donutil tisíce lidí k evakuaci. Vláda musí rychle zasáhnout a pomoci postiženým oblastem." # todo: NEW TRANSLATION
 comoros.21.a: "Zahájit nouzovou reakci." # todo: NEW TRANSLATION
 comoros.22.t: "Hora Karthala opět vybuchla" # todo: NEW TRANSLATION
 comoros.22.d: "Hora Karthala vybuchla letos již podruhé. Popel pokryl jižní vesnice a kontaminoval vodní zdroje, čímž ještě zhoršil napjaté zásobování pitnou vodou. Tato druhá katastrofa během probíhající obnovy prověřuje schopnost vlády reagovat." # todo: NEW TRANSLATION
 comoros.22.a: "To snad ne..." # todo: NEW TRANSLATION
 comoros.23.t: "Havárie Yemenia Airways" # todo: NEW TRANSLATION
 comoros.23.d: "Let Yemenia Airways 626 (Airbus A310) se při konečném přiblížení k mezinárodnímu letišti Moroni zřítil do moře u pobřeží Komor. Ze 153 cestujících a členů posádky přežil pouze jeden člověk. Mnoho obětí tvořili příslušníci komorské diaspory žijící ve Francii. Kritika letadel a údržby Yemenia Airways zesílila a ve Francii vyvolala rozsáhlé protesty. Přestože protesty míří proti letecké společnosti a francouzským úřadům, komorská vláda nyní musí podporovat rodiny obětí a účastnit se mezinárodních jednání." # todo: NEW TRANSLATION
 comoros.23.a: "Truchlit za oběti." # todo: NEW TRANSLATION
 comoros.24.t: "Cyklon Kenneth udeřil" # todo: NEW TRANSLATION
 comoros.24.d: "Komory zasáhl silný tropický cyklon Kenneth a způsobil ničivé škody. Nejméně sedm lidí zemřelo, více než 200 bylo zraněno a 60–80 % základních plodin bylo zničeno. Desítky tisíc lidí byly vysídleny a infrastruktura i zásoby pitné vody utrpěly vážné škody. Obnova si vyžádá značné finanční prostředky a čas." # todo: NEW TRANSLATION
 comoros.24.a: "Zahájit nouzovou pomoc" # todo: NEW TRANSLATION
 comoros.25.t: "Masový útěk z věznice v Moroni" # todo: NEW TRANSLATION
 comoros.25.d: "Z největší věznice v Moroni uprchlo třicet osm vězňů. Podle zpráv jednoduše vyšli špatně střeženou hlavní branou, přičemž úřady poukazují na nedbalost stráží a možnou předběžnou přípravu. Vláda musí rozhodnout, zda zvýší výdaje na bezpečnost a posílí ochranu, nebo zachová současnou úroveň a bude pokračovat v pátrání." # todo: NEW TRANSLATION
 comoros.25.a: "Zvýšit výdaje na bezpečnost" # todo: NEW TRANSLATION
 comoros.25.b: "Pokračovat v pátrání v rámci současného rozpočtu" # todo: NEW TRANSLATION
 comoros.26.t: "Prezident Assoumani pobodán" # todo: NEW TRANSLATION
 comoros.26.d: "Během pohřbu náboženského vůdce v Salimani byl prezident Azali Assoumani napaden nožem čtyřiadvacetiletým vojákem a utrpěl lehká zranění. Podezřelý byl na místě zatčen, následujícího dne však byl ve vazbě nalezen mrtev. Incident zvýšil obavy veřejnosti ohledně bezpečnostních sil a politické stability." # todo: NEW TRANSLATION
 comoros.26.a: "Posílit bezpečnostní opatření" # todo: NEW TRANSLATION
 comoros.26.b: "Minimální reakce na incident" # todo: NEW TRANSLATION
 comoros.27.t: "Robert Denard propuštěn" # todo: NEW TRANSLATION
 comoros.27.d: "Robert Denard, kdysi slavný žoldnéř v Africe, byl navzdory údajným zločinům propuštěn. Je zázrak, že k tomu došlo, ale přesto se tak stalo. Mnozí se domnívají, že by mohl získat muže a materiál k dalšímu vpádu do naší země." # todo: NEW TRANSLATION
 comoros.27.a: "Znepokojivé." # todo: NEW TRANSLATION
 comoros.27.b: "Spolupracovat s Francouzi na jeho zatčení" # todo: NEW TRANSLATION
 comoros.27.c: "Posílit bezpečnost paláce" # todo: NEW TRANSLATION
 comoros.28.t: "Robert Denard svrhl vládu" # todo: NEW TRANSLATION
 comoros.28.d: "Žoldnéř se vrátil se stovkami vojáků, úspěšně svrhl vládu a na jejím místě ustanovil loutkový režim vedený mužem známým pouze jako „Válečný král Afriky“." # todo: NEW TRANSLATION
 comoros.28.a: "Válečný král!" # todo: NEW TRANSLATION
 comoros.29.t: "Robert Denard zajat Francouzi" # todo: NEW TRANSLATION
 comoros.29.d: "Francouzská armáda zajala Denarda na cestě k provedení převratu v naší zemi s přibližně stovkou až dvěma stovkami mužů. Většina jeho sil byla propuštěna, Denard sám však byl zatčen a převezen do Francie k soudu." # todo: NEW TRANSLATION
 comoros.29.a: "Dobře mu tak!" # todo: NEW TRANSLATION
 comoros.30.t: "Robert Denard nedokázal svrhnout vládu" # todo: NEW TRANSLATION
 comoros.30.d: "Navzdory početnému oddílu byl Denard při pokusu o svržení vlády poražen. Po porážce byl zatčen a nyní bude hnít ve vězení na ostrově Grande Comore." # todo: NEW TRANSLATION
 comoros.30.a: "Dámy a pánové, máme ho." # todo: NEW TRANSLATION
 comoros.31.t: "Výsledky ústavního referenda" # todo: NEW TRANSLATION
 comoros.31.d: "Po měsících kampaně napříč ostrovy ústavní referendum skončilo a hlasy byly sečteny. Lid odpověděl na otázku, zda přijmout federální uspořádání poskytující autonomii jednotlivým ostrovům, nebo usilovat o centralizovanou vládu. Výsledky na dlouhá léta ovlivní rozdělení moci v našem národě." # todo: NEW TRANSLATION
 comoros.31.a: "Lid promluvil." # todo: NEW TRANSLATION
 comoros.32.t: "Úmrtí bývalého prezidenta Massoundea" # todo: NEW TRANSLATION
 comoros.32.d: "Z Paříže jsme obdrželi smutnou zprávu. Bývalý prezident Tadjidine Ben Said Massounde zemřel včera pozdě večer v pařížské nemocnici ve věku 76 let na komplikace spojené s dlouhou nemocí. Navzdory kontroverzním okolnostem svého odvolání během převratu v roce 1999 vedeného plukovníkem Azalim Assoumanim zůstal Massounde významnou postavou [COM.GetAdjective] politických dějin. Zpráva o jeho úmrtí hluboce zasáhla celé souostroví; občané ze všech tří ostrovů se shromažďují v mešitách a na veřejných prostranstvích, aby se modlili a vzpomínali. [COM.GetAdjective] ozbrojené síly oznámily, že mu vzdají plné vojenské pocty jako uznání jeho službě národu během prezidentského úřadu. Jeho rodina, jak ta žijící v Paříži, tak ta na Komorách, vyjádřila hlubokou vděčnost za množství soustrastných vyjádření a úctu, kterou mu projevili [COM.GetAdjective] občané, diasporická komunita ve Francii a mezinárodní pozorovatelé. Vlajky po celé zemi budou po dobu tří dnů oficiálního smutku spuštěny na půl žerdi." # todo: NEW TRANSLATION
 comoros.32.a: "X vzdává úctu." # todo: NEW TRANSLATION
 comoros.33.t: "Zanzibarská dohoda" # todo: NEW TRANSLATION
 comoros.33.d: "[COM.GetAdjective] diplomaté nám předložili neobvyklý, avšak zajímavý návrh – chtějí s naší vládou vyjednat koupi [253.GetName]. Delegace [COM.GetAdjective] přišla připravena s podrobnými ekonomickými prognózami, navrhovaným harmonogramem plateb a zárukami týkajícími se práv a blahobytu současných obyvatel. Tvrdí, že geografická blízkost a kulturní vazby činí toto uspořádání výhodným pro obě strany, a zdůrazňují svůj závazek zachovat stabilitu a prosperitu regionu. Návrh zahrnuje přechodné období, ochranu stávajících dohod a značnou finanční kompenzaci, která by mohla výrazně posílit naši státní pokladnu. Náš kabinet je rozdělený – někteří to považují za pragmatickou příležitost ke konsolidaci území a získání hospodářských zdrojů, zatímco jiní pokládají prodej svrchovaného území za nemyslitelný precedens, který by mohl v budoucnu přivést další podobné návrhy. Rozhodnutí nyní spočívá na naší vládě." # todo: NEW TRANSLATION
 comoros.33.a: "Podmínky jsou přijatelné." # todo: NEW TRANSLATION
 comoros.33.b: "Naše území není na prodej!" # todo: NEW TRANSLATION
