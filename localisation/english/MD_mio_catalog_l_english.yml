 GENERIC_krepost_state_defense_bureau_desc: "Tajemný státem licencovaný vývozce specializující se na MANPADS a protitankové řízené střely, který zásobuje klienty prostřednictvím neoznačených zprostředkovatelů." # todo: NEW TRANSLATION
 GENERIC_north_plains_heavy_industries_desc: "Rozsáhlý závod ze sovětského dědictví vyrábějící pěchotní zbraně ve velkém, optimalizovaný pro vysoký objem produkce namísto kvality." # todo: NEW TRANSLATION
 GENERIC_sentinel_grid_networks_desc: "Dodavatel komunikačních a velitelských systémů nabízející řešení pro zkrácení řetězce ničení armádám bez integrované velitelské infrastruktury." # todo: NEW TRANSLATION
 GENERIC_brunn_heavy_engineering_werke_desc: "Středoevropská strojírenská firma s kořeny v habsburské éře, vyrábějící licencované i vlastní dělostřelecké systémy." # todo: NEW TRANSLATION
 GENERIC_reichswerke_konstrukt_dynamik_desc: "Středoevropský vývojář zbraní s dvojím zaměřením na pásové dělostřelectvo a platformy hlavních bojových tanků." # todo: NEW TRANSLATION
 GENERIC_vector_defense_labs_desc: "Nákladově orientovaný integrátor protiraketové obrany založený na doktríně, že poměr ceny a účinnosti zachycení je lepší než přehnané investice do technologií." # todo: NEW TRANSLATION
 GENERIC_marshall_tractor_works_desc: "Kolektiv tankových továren fungující na základě zděděné sovětské výrobní metodiky, s důrazem na objem výroby a opravitelnost." # todo: NEW TRANSLATION
 GENERIC_vanderlind_hartwell_systems_desc: "Hlavní dodavatel z okruhu Washingtonu využívající politické kontakty k zajištění rozsáhlých programů obrněných vozidel a BVP." # todo: NEW TRANSLATION
 GENERIC_mil_kamov_rotorworks_desc: "Konstrukční kancelář vrtulníků vycházející ze sovětského vývoje útočných a transportních vrtulníků, známá důrazem na odolnost namísto sofistikovanosti." # todo: NEW TRANSLATION
 GENERIC_helitech_avionique_desc: "Specializovaná anglo-italská firma pro avioniku a integraci vrtulníků nabízející kvalitní elektroniku za prémiovou cenu." # todo: NEW TRANSLATION
 GENERIC_aurora_aerodynamics_corporation_desc: "Utajený vývojový podnik vyrábějící špičkové stíhací a víceúčelové letouny pro náročné obranné zákazníky." # todo: NEW TRANSLATION
 GENERIC_societe_europeenne_daerostructures_desc: "Panevropské konsorcium s dělbou práce specializující se na konstrukce velkých letounů, transportní platformy a námořní hlídkové letouny." # todo: NEW TRANSLATION
 GENERIC_southwestern_aerospace_dynamics_bureau_desc: "Direktorátem řízená kancelář vyrábějící víceúčelové a strategické vzdušné platformy pod přísným vládním dohledem." # todo: NEW TRANSLATION
 GENERIC_skyforge_autonomous_systems_desc: "Firma z okolí Silicon Valley uplatňující kulturu rychlého růstu startupů při vývoji autonomních úderných dronů." # todo: NEW TRANSLATION
 GENERIC_compagnie_aeronatique_darmement_desc: "Zbrojní firma s francouzskou tradicí nabízející standardy munice napříč platformami pro stíhací a námořní letouny i řízené střely." # todo: NEW TRANSLATION
 GENERIC_whitehall_strategic_solutions_desc: "Specializovaná poradenská firma pro admiralitu, která se proměnila v producenta malých bojových plavidel a specializuje se na korvety a hlídková plavidla." # todo: NEW TRANSLATION
 GENERIC_triton_maritime_defense_group_desc: "Nadnárodní síť loděnic vyrábějící torpédoborce a fregaty v několika partnerských zemích." # todo: NEW TRANSLATION
 GENERIC_eastern_maritime_shipbuilding_group_desc: "Loděnice s nepřetržitým třísměnným provozem vyrábějící křižníky a letadlové lodě ve zkrácených termínech." # todo: NEW TRANSLATION
 GENERIC_sevmorprom_submarine_yards_desc: "Severní ruská loděnice specializující se na provozní hloubky ve studených vodách a exportní útočné a raketové platformy." # todo: NEW TRANSLATION
 GENERIC_halland_civic_engineering_group_desc: "Severský průmyslový konglomerát s odborností v logistice dvojího užití, pokrývající civilní infrastrukturu i vojenské dodavatelské řetězce." # todo: NEW TRANSLATION
 GENERIC_second_academy_missile_bureau_desc: "Segmentovaná výzkumná kancelář balistických a křižujících střel fungující podle přísných protokolů přístupu pouze pro oprávněné osoby." # todo: NEW TRANSLATION
 GENERIC_western_orbital_systems_bureau_desc: "Kancelář orbitálních a strategických systémů zaměřená na nosiče nové generace a situační přehled o vesmírné oblasti." # todo: NEW TRANSLATION
 GENERIC_central_heavy_atomics_power_desc: "Program jaderného pohonu a zbraní kombinující odborné znalosti civilních reaktorů s vývojem námořních balistických střel." # todo: NEW TRANSLATION
