l_english:
 pakistan.1.t: "Americký tlak na kmenové oblasti" # todo: NEW TRANSLATION
 pakistan.1.d: "Spojené státy požadují, aby Pákistán podnikl rozhodné vojenské kroky proti militantním skupinám působícím z Federálně spravovaných kmenových oblastí podél afghánské hranice. Washington dal jasně najevo, že další nečinnost bude mít důsledky pro bilaterální vztahy a americkou vojenskou pomoc." # todo: NEW TRANSLATION
 pakistan.1.a: "Zahájit vojenskou operaci ve Vazíristánu" # todo: NEW TRANSLATION
 pakistan.1.b: "Místo toho vyjednávat s kmenovými náčelníky" # todo: NEW TRANSLATION
 pakistan.1.c: "Odmítnout americké požadavky" # todo: NEW TRANSLATION
 pakistan.2.t: "Pákistán zahajuje operaci v kmenových oblastech" # todo: NEW TRANSLATION
 pakistan.2.d: "Pákistán v reakci na americký tlak zahájil vojenskou operaci proti baštám militantů v kmenových oblastech. Operace cílí na prvky Tálibánu a al-Káidy podél afghánské hranice." # todo: NEW TRANSLATION
 pakistan.2.a: "Pozitivní vývoj" # todo: NEW TRANSLATION
 pakistan.3.t: "Pákistán odmítá jednat" # todo: NEW TRANSLATION
 pakistan.3.d: "Pákistán navzdory americkým požadavkům odmítl podniknout rozhodné vojenské kroky v kmenových oblastech. Militanti nadále volně působí podél afghánské hranice a podkopávají úsilí koalice v Afghánistánu." # todo: NEW TRANSLATION
 pakistan.3.a: "Omezit vojenskou pomoc Pákistánu" # todo: NEW TRANSLATION
 pakistan.3.b: "Prozatím jejich rozhodnutí přijmout" # todo: NEW TRANSLATION
 pakistan.4.t: "Odveta militantů" # todo: NEW TRANSLATION
 pakistan.4.d: "Vojenská operace v kmenových oblastech vyvolala zuřivou odvetu. Militantní skupiny zahájily vlnu bombových útoků ve velkých městech, jejichž cílem jsou vládní budovy, tržiště a vojenská zařízení. Pákistánský Tálibán vyhlásil státu válku." # todo: NEW TRANSLATION
 pakistan.4.a: "Zintenzivnit tažení" # todo: NEW TRANSLATION
 pakistan.4.b: "Usilovat o příměří s militanty" # todo: NEW TRANSLATION
 pakistan.5.t: "Americká pomoc pozastavena" # todo: NEW TRANSLATION
 pakistan.5.d: "Spojené státy pozastavily vojenskou pomoc Pákistánu v reakci na odmítnutí vlády zakročit proti militantům v kmenových oblastech. Ztráta amerického financování zatíží rozpočet na obranu." # todo: NEW TRANSLATION
 pakistan.5.a: "To je pobuřující" # todo: NEW TRANSLATION
 pakistan.6.t: "Pokrok v kmenových oblastech" # todo: NEW TRANSLATION
 pakistan.6.d: "Po měsících nepřetržitých vojenských operací dosáhly pákistánské ozbrojené síly v kmenových oblastech významného pokroku. Hlavní bašty militantů byly rozloženy, ačkoli lidské i ekonomické náklady byly vysoké. Nyní vyvstává otázka, zda vyhlásit vítězství, nebo udržovat trvalou vojenskou přítomnost." # todo: NEW TRANSLATION
 pakistan.6.a: "Vyhlásit vítězství a upevnit výsledky" # todo: NEW TRANSLATION
 pakistan.6.b: "Udržovat vojenskou přítomnost" # todo: NEW TRANSLATION
 PAK_waziristan_insurgency: "Povstání ve Vazíristánu" # todo: NEW TRANSLATION
 PAK_waziristan_insurgency_desc: "Pákistánské ozbrojené síly vedou v kmenových oblastech rozsáhlou protipovstaleckou kampaň a bojují proti militantním skupinám podél afghánské hranice." # todo: NEW TRANSLATION
 PAK_suspended_american_aid: "Pozastavená americká pomoc" # todo: NEW TRANSLATION
 PAK_suspended_american_aid_desc: "Spojené státy pozastavily vojenskou pomoc Pákistánu, čímž zatížily rozpočet na obranu a omezily nákupy zbraní." # todo: NEW TRANSLATION
 PAK_tribal_pacification: "Pacifikace kmenových oblastí" # todo: NEW TRANSLATION
 PAK_tribal_pacification_desc: "Úspěšná vojenská kampaň v kmenových oblastech posílila protipovstalecké schopnosti armády a obnovila určitou míru stability v pohraniční oblasti." # todo: NEW TRANSLATION
 pakistan_news.1.t: "Pákistán zahajuje vojenskou operaci v kmenových oblastech" # todo: NEW TRANSLATION
 pakistan_news.1.d: "Pákistánské ozbrojené síly zahájily rozsáhlou vojenskou operaci proti baštám Tálibánu a al-Káidy ve Federálně spravovaných kmenových oblastech podél afghánské hranice. Ofenzíva vedená pod silným americkým tlakem cílí na militantní sítě, které členitý terén dlouhodobě využívaly jako bezpečné útočiště." # todo: NEW TRANSLATION
 pakistan_news.1.a: "Vypudíme je" # todo: NEW TRANSLATION
 pakistan_news.1.b: "Krok správným směrem" # todo: NEW TRANSLATION
 pakistan_news.1.c: "Bereme na vědomí" # todo: NEW TRANSLATION
 pakistan_news.2.t: "Pákistán vyhlašuje vítězství v kmenových oblastech" # todo: NEW TRANSLATION
 pakistan_news.2.d: "Po dlouhotrvající vojenské kampani Pákistán prohlásil, že hlavní bašty militantů v kmenových oblastech byly rozloženy. Operace si vyžádala vysoké ztráty na životech i značné zdroje, vláda však tvrdí, že pohraniční oblast je bezpečnější než za poslední roky." # todo: NEW TRANSLATION
 pakistan_news.2.a: "Těžce vydobyté vítězství" # todo: NEW TRANSLATION
 pakistan_news.2.b: "Vítáme tento pokrok" # todo: NEW TRANSLATION
 pakistan_news.2.c: "Bereme na vědomí" # todo: NEW TRANSLATION
