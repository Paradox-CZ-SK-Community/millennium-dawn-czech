 SOO_Roki_Tunnel_tollage_desc: "Musíme opravit tento tunel, protože je naším jediným spojením s Ruskem." # todo: CHANGED
 SOO_Tskhinvali_gas_and_electricity_network: "Zajištění energie pro Tskhinvali" # todo: NEW TRANSLATION
 SOO_Tskhinvali_gas_and_electricity_network_desc: "Zajistíme Cchinvalu vše, co potřebuje z hlediska energetiky." # todo: CHANGED
 SOO_Move_towards_cash_crop_growth: "Zvýšit obrat obchodu s Ruskem" # todo: NEW TRANSLATION
 SOO_Move_towards_cash_crop_growth_desc: "Jsme připraveni zvýšit dodávky našich zemědělských produktů do Ruska." # todo: CHANGED
 SOO_Rural_Revitalization: "Investice do obnovy infrastruktury" # todo: NEW TRANSLATION
 SOO_Rural_Revitalization_desc: "Musíme obnovit naše silnice, které během mnoha let zchátraly." # todo: CHANGED
 SOO_konserv_zavod: "Otevřít konzervárnu" # todo: NEW TRANSLATION
 SOO_konserv_zavod_desc: "Otevřeme v naší zemi konzervárnu, která lidem poskytne práci a bude vytvářet solidní zisk." # todo: CHANGED
 SOO_Redevelop_the_Mamison_Pass: "Přestavět Mamison průsmyk" # todo: NEW TRANSLATION
 SOO_Redevelop_the_Mamison_Pass_desc: "Mamisonský průsmyk je drsný horský průsmyk na hranici Osetie a Ruska. Překonává jej Osetská vojenská silnice, vybudovaná Ruskou říší v letech 1854 až 1889, ačkoli dnes je značně zastíněna Zakavkazskou magistrálou." # todo: CHANGED
 SOO_The_Ergneti_market: "Ergneti trh" # todo: NEW TRANSLATION
 SOO_The_Ergneti_market_desc: "Ergneti je vesnice na okraji Cchinvalu, která se nachází na gruzínské straně hranice. To, co začalo jako místo, kde místní gruzínští obyvatelé nakupovali levné ruské zboží, se rozrostlo v rozsáhlý černý trh, na němž se obchoduje se vším od zemědělských produktů až po průmyslové zboží. Ergnetijský trh se stal nejspolehlivějším a nejtrvalejším zdrojem příjmů pro tisíce Osetinců i Gruzínů." # todo: CHANGED
 SOO_Sponsor_the_Georgian_grey_market: "Sponsor the Georgian Grey Market"  -> "Sponzorovat Gruzijský šedý trh" # todo: NEW TRANSLATION
 SOO_Sponsor_the_Georgian_grey_market_desc: "Gruzínský šedý trh vyrostl z přívalu ruského zboží proudícího do regionu, přičemž většina z něj překračuje osetskou hranici po Zakavkazské magistrále. Podpora šedého trhu by mohla přinést dosud nevyužitý zdroj příjmů pro potřebný stát, jako je ten náš." # todo: CHANGED
 SOO_fostering_economic_ties: "Posilování hospodářských vazeb" # todo: NEW TRANSLATION
 SOO_fostering_economic_ties_desc: "Ergneti sloužilo jako základní kámen míru mezi Jižní Osetií a Gruzií. Chceme-li zůstat na cestě stabilního růstu, musíme využít příležitosti k navázání užších vztahů s gruzínským státem." # todo: CHANGED
 SOO_tourism: "Turismus v Jižní Osetii" # todo: NEW TRANSLATION
 SOO_tourism_desc: "Naše země má nádhernou krajinu a krásné výhledy. Je čas rozvinout infrastrukturu potřebnou k tomu, aby turisté mohli tuto krásu poznat." # todo: CHANGED
 SOO_A_Shifting_market: "Přesouvající se trh" # todo: NEW TRANSLATION
 SOO_A_Shifting_market_desc: "Gruzínská vláda trh uzavřela. Musíme plánovat budoucnost národa a tento problém řešit; jelikož mnoho lidí přišlo o práci, jsme nuceni se přizpůsobit větší závislostí na ruské pomoci a větším zaměřením na pašování a další nelegální zdroje obchodu." # todo: CHANGED
 SOO_Host_transit_tax: "Poplatek za tranzit" # todo: NEW TRANSLATION
 SOO_Host_transit_tax_desc: "Ergnetijský trh stále funguje jako černý trh. Abychom využili dosud nevyužité příjmy, můžeme na osetské straně hranice zavést tranzitní poplatek. Pro mnohé to může být nevítané opatření, ale příjmy zůstanou v našem vlastním státě, místo aby proudily k sousedovi za hranicí." # todo: CHANGED
 SOO_Promote_contraband: "Podpora pašovaného zboží" # todo: NEW TRANSLATION
 SOO_Promote_contraband_desc: "Po nedávném uzavření trhu gruzínskou vládou musíme získávat příjmy jinými způsoby. Velká část obyvatelstva na obou stranách hranice je pobouřena tím, že Gruzie trh zlikvidovala. Nyní jsme nuceni zapojit se do obchodu s pašovaným zbožím." # todo: CHANGED
 SOO_regulate_the_market: "Regulace trhu" # todo: NEW TRANSLATION
 SOO_regulate_the_market_desc: "Regulace trhu jsou nutné k odstranění nezákonného jednání. Díky tomu bude pro gruzínskou stranu přitažlivější trh ponechat otevřený i v době změn nebo rostoucího napětí." # todo: CHANGED
 SOO_Districted_Oversight: "Okresní dohled" # todo: NEW TRANSLATION
 SOO_Districted_Oversight_desc: "S touto nově vzniklou správou musí řídící orgán gruzínských území zahájit proces začleňování obyvatelstva do zvyků a zákonů osetského státu." # todo: CHANGED
 SOO_Resilient_Commerce: "Odolný obchod" # todo: NEW TRANSLATION
 SOO_Resilient_Commerce_desc: "Budeme obchodovat aktivněji než dříve, abychom rozšířili svůj ekonomický potenciál." # todo: CHANGED
 SOO_Raise_Import_Tariffs: "Zvýšit dovozní cla" # todo: NEW TRANSLATION
 SOO_Raise_Import_Tariffs_desc: "Zvýšíme dovozní cla, abychom zlepšili příjmy naší státní pokladny." # todo: CHANGED
 SOO_the_Russian_bankroll: "Připustit ruské banky" # todo: NEW TRANSLATION
 SOO_the_Russian_bankroll_desc: "Budeme muset umožnit ruským bankám vstoupit na náš trh, aby podpořily naši ekonomiku." # todo: CHANGED
 SOO_new_developments_in_Kvaisa: "Energetika Osetie" # todo: NEW TRANSLATION
 SOO_new_developments_in_Kvaisa_desc: "Zahájíme výstavbu elektrárny, abychom zajistili naši energetickou bezpečnost." # todo: CHANGED
 SOO_Boost_the_local_flour_production: "Investice do produkce mouky" # todo: NEW TRANSLATION
 SOO_Boost_the_local_flour_production_desc: "Náš stát by měl investovat do všech zemědělských odvětví, počínaje místní výrobou mouky." # todo: CHANGED
 SOO_Tractor_Imports: "Import traktorů" # todo: NEW TRANSLATION
 SOO_Tractor_Imports_desc: "Dovezeme traktory, abychom uspokojili potřeby našeho zemědělství." # todo: CHANGED
