 SOO_subsidise_the_Farmers: "Dotace pro farmáře" # todo: NEW TRANSLATION
 SOO_subsidise_the_Farmers_desc: "Naše země je velmi chudá; musíme využít každou příležitost k vytvoření příjmů pro rozpočet. Pokusíme se podpořit naše zemědělce." # todo: CHANGED
