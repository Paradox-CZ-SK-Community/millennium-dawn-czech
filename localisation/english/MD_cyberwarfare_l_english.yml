 CYBER_GPS_BTN_TT_DELAYED: "Specializovaný malware proniká do infrastruktury satelitního příjmu cíle a zaplavuje vojenské navigační systémy falešnými signály. Velitelé v terénu mají potíže s koordinací, protože známé orientační body mizí z jejich digitálních map. I běžné manévry se stávají nebezpečnými, když selže přesná navigace." # todo: NEW TRANSLATION
 CYBER_SIGINT_BTN_TT_DELAYED: "Vytrvalý implantát se tiše zavrtává do telekomunikační páteře cíle a kopíruje provoz vládních, vojenských i diplomatických kanálů. Týden za týdnem zachycený tok vytváří podrobný obraz záměrů, zranitelností a vnitřních sporů cíle. Zpravodajství, které by žádný běžný špion nedokázal získat." # todo: NEW TRANSLATION
 CYBER_RADAR_BTN_TT_DELAYED: "Na obrazovkách radarů protivzdušné obrany cíle se objevují falešné kontakty. Operátoři se horečně snaží sledovat letadla, která neexistují, a během poplachů pronásledují přízraky. Skutečné lety proklouznou mezerami nepozorovaně. Okno je krátké, ale třicet dní zhoršené detekce ze vzduchu může být během aktivního tažení rozhodujících." # todo: NEW TRANSLATION
 CYBER_ECON_BTN_TT_DELAYED: "Zpracovatelé plateb začínají hlásit chyby. Obchodní algoritmy se dusí na poškozených datových vstupech. Řídicí systémy výrobních linek dostávají vadné aktualizační balíčky. Útok je navržen tak, aby jej bylo možné popřít: kaskáda zdánlivě nesouvisejících technických selhání, která po celé měsíce nenápadně odčerpává ekonomický výkon cíle." # todo: NEW TRANSLATION
 CYBER_PROP_BTN_TT_DELAYED: "Tisíce koordinovaných účtů zaplavují mediální prostor cíle protichůdnými narativy. Na sociálních sítích kolují zfalšované vládní dokumenty. Cílem není klamat, ale vyčerpat. Obyvatelstvo, které již nedokáže rozlišit skutečnost od fikce, ztrácí důvěru ve všechny instituce včetně vlastní vlády." # todo: NEW TRANSLATION
 CYBER_ELECT_BTN_TT_DELAYED: "Registrační systémy voličů jsou nenápadně poškozovány. V posledních dnech před hlasováním kolují záznamy vůdců opozice vytvořené pomocí deepfake. Algoritmy sociálních sítí jsou zneužívány k zesílení stávajících rozporů. Demokratické instituce cíle nejsou zničeny. Jsou pouze nenápadně učiněny nedůvěryhodnými a jejich výsledky jsou zpochybněny ještě před sečtením jediného hlasu." # todo: NEW TRANSLATION
 CYBER_ESPION_BTN_TT_DELAYED: "Kampaň cíleného phishingu umisťuje vlastní implantáty hluboko do nejcitlivějších výzkumných sítí cíle. Malware se po celé měsíce bočně šíří a shromažďuje výkresy, testovací data a vlastnické vzorce. V době, kdy je průnik odhalen, naši výzkumníci již stavějí na tom, co ukradli." # todo: NEW TRANSLATION
 CYBER_COMMS_BTN_TT_DELAYED: "Tichý útok typu man-in-the-middle se umisťuje mezi nejcitlivější komunikační uzly cíle. Rozkazy generálů, depeše velvyslanců i jednání vlády procházejí stejným napadeným přenosovým bodem: jsou kopírovány, katalogizovány a v reálném čase doručovány našim analytikům. Cíl nadále činí rozhodnutí, aniž by tušil, že čteme každé z nich." # todo: NEW TRANSLATION
 CYBER_INFRA_BTN_TT_DELAYED: "Průmyslové řídicí systémy spravující distribuci energie, úpravu vody a logistické uzly dostávají tiché, škodlivé aktualizace firmwaru. Po spuštění nálože kaskádová selhání současně zahlcují opravárenské týmy v několika sektorech. Škody jsou skutečné, fyzické a jejich náprava je pomalá." # todo: NEW TRANSLATION
 CYBER_FIN_BTN_TT_DELAYED: "Systémy zúčtování centrální banky zhasínají. Sítě bankomatů selhávají po celé zemi. Algoritmy obchodování s měnou dostávají otrávené vstupy, které spouštějí prudký krach. Narušení dosahuje mnohem dál než běžné sankce a na rozdíl od sankcí nenese žádné označení původu." # todo: NEW TRANSLATION
 CYBER_LOG_BTN_TT_DELAYED: "Software pro řízení dodavatelského řetězce se současně hroutí na všech předsunutých operačních základnách. Požadavky na munici mizí v poškozených frontách. Algoritmy přidělování paliva směrují konvoje k neexistujícím skladům. Vojenský stroj nepřítele se v bitvě nerozbije. Na místě vyhladne." # todo: NEW TRANSLATION
 CYBER_SLEEP_BTN_TT_DELAYED: "Trpělivě, metodicky, neviditelně. Naši operativci zde nejsou proto, aby útočili. Jsou zde proto, aby zůstali. Neaktivní přístupové body jsou rozmístěny v kritické síťové infrastruktuře cíle a čekají na aktivaci na povel. Během příštího roku nemusí mít jeho nejcitlivější systémy vůbec žádná tajemství." # todo: NEW TRANSLATION
 CYBER_CRIT_BTN_TT_DELAYED: "Veškerá síla našeho kybernetického arzenálu dopadá naráz. Elektrické sítě selhávají. Vojenská komunikace se hroutí. Průmyslová výroba se zastavuje. Finanční systémy zamrzají. Operace je digitálním ekvivalentem strategického bombardování a současně zanechává cíl funkčně ochromený ve všech oblastech národní moci." # todo: NEW TRANSLATION
 CYBER_DECEPT_BTN_TT_DELAYED: "Neútočíme na systémy cíle. Korumpujeme jeho mysl. Zfalšované zpravodajské odhady, podvržené rozkazy s autentizačními podpisy vysokých velitelů, zmanipulované snímky předkládané činitelům na nejvyšších úrovních. Každé rozhodnutí cíle může být založeno na skutečnosti, kterou jsme sami vytvořili." # todo: NEW TRANSLATION
 CYBER_ZERO_BTN_TT_DELAYED: "Klasifikovaný arzenál dosud neznámých exploitů, shromažďovaný po celá léta a vyhrazený přesně pro tento okamžik, je současně nasazen proti nejkritičtějším systémům cíle. V době, kdy analytici pochopí, co se stalo, jsou zranitelnosti vyčerpány a škody nevratné." # todo: NEW TRANSLATION
 CYBER_HARDEN_BTN_TT_DELAYED: "Naše bezpečnostní týmy kontrolují každé vystavené rozhraní, opravují každou známou zranitelnost a posilují protokoly, které cizí zpravodajské agentury nejčastěji zkoušejí. Tato práce není okázalá, ale každé dveře, které zavřeme, představují o jeden vektor méně, který může protivník využít. Nejlepší kybernetická operace je ta, která nikdy nezasáhne." # todo: NEW TRANSLATION
 CYBER_CNTRINT_BTN_TT_DELAYED: "Analytici procházejí síťové záznamy a telemetrii systémů a hledají nenápadné známky cizí přítomnosti: neobvyklé vzorce přístupu, neočekávaná odchozí spojení a neaktivní procesy bez legitimního účelu. Vyčištění infikované sítě je pomalá a pečlivá práce. Neodhalený implantát je mnohem nebezpečnější než známý." # todo: NEW TRANSLATION
 CYBER_ATTRIB_BTN_TT_DELAYED: "Naše týmy digitální forenziky rekonstruují cestu útoku: sledují podpisy malwaru, mapují infrastrukturu velení a řízení a katalogizují vzorce operační bezpečnosti, které identifikují odpovědného aktéra. Pojmenování státu stojícího za průnikem je prvním krokem k přiměřené reakci." # todo: NEW TRANSLATION
